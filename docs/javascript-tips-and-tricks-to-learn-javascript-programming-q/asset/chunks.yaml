  trans: "\n虽然大声朗读你编写的每一行代码看起来可能很复杂，但你仍然应该尝试这样做。这样做将让你有机会发现你可能遗漏掉的内容。如果你擅长阅读并确保自己没有犯任何错误，你就能非常高效地完成任务，而不会浪费大量时间。实际上，这花费的时间比回去修复你所有的错误要短得多。\n\
    \n# 调整信心\n\n虽然在你刚开始或学习代码时可能不会遇到这个问题，但对于那些编写 `JavaScript` 的人来说，过度自信可能是一个大问题。你认为自己对它已经有了充分的了解，本质上，你在编写代码时放松了警备。这是一个问题，因为你在编写代码时发现错误的速度将不再那么快，而且你可能会认为你写的代码没有任何问题。\n\
    \n保持清醒至关重要。即使你觉得自己写代码非常出色，并且永远不会犯错，你犯错的概率仍然很高。在任何时候编写任何类型的代码时，错误都可能发生在任何人身上。确保你清楚自己在做什么，不要对自己的技能自目自大。在编码方面，总有更多可以学习的东西，没有人能掌握一切。\n\
    \n你的自信甚至会误导你忘记已经学过的代码知识。自信告诉你你清楚自己在做什么，并且知道编写代码的最佳方法。它告诉你，对每一行代码反复编写相同的内容没有问题，但它也告诉你，你不需要为你编写的代码尝试不同的方案来变得更加努力。确保你对自己的充满充满，但不要让这种信心高到以至于阻碍了你对成功的观察。\n\
    \n# 怀疑你自己\n\n不要相信你自己。当你回看自己编写的代码时，你的大脑会试图告诉你你没有犯错，也没有遗漏任何内容，但事实可能是你实际上遗漏了某些代码行，并且犯了一些错误。务必始终质疑自己是否在完成尽可能最好的编码工作，这样你就能写出你期望的精确代码。不要相信自己能做到，而要始终检查你做的是否正确。\n\
    \n这样做的一种好方法是在编写和检查代码之间休息一下。确保休息时间足够长，让你能够真正刷新大脑。把它当作其中一次放松休息，但要花更长的时间，这样当你开始测试和查看代码时，你才能真正以清空大脑的状态回来。如果你盯着同样的\
    \ 100 行代码看了 5 小时然后尝试编辑它们，你将很难挑出自己犯的错误。\n\n本书第一部分章节中的所有技巧都涉及实践以及在实践过程中你可以学到的东西。它们本质上是你可以用来让编码实践进行得更好的心理技巧。在书的其余部分中，你将学习在开始编码时如何应用这些每一种技巧。真正的乐趣出现在你在本书的第二部分学习可以直接在这里使用的最佳代码时。\n\
    \n# 第 4 章：基础\n\n在能够真正参与 `JavaScript` 最高级的部分之前，你必须先学习 `JavaScript` 的基础。学习基础是非常重要的，这样当你开始更多地使用它时，你将拥有坚实的基础。学习这些基础技巧并加入你的\
    \ `JavaScript` 技能库中，将帮助你获得最大的机会在 `JavaScript` 上成功，并以一种你可以真正创建出优秀网站和网站选项的方式编写代码。\n\
    \n## 变量列表\n\n在编写 `JavaScript` 代码时，你很可能在某时刻列出变量。学习 `JavaScript` 后，将每个变量都列在变量标签下似乎是个好主意，例如：\n\
    \n```\nvar one thing = ‘a list’;\nvar differentthing = ‘different list’;\nvar\
    \ otherdifferentthing = ‘other different list’;\n```\n\n这里的每一行都是不同的代码，并且它们是相互分离的。与其这样做，你可以通过以下方式让你的代码看起来更好、更整洁：\n\
    \n```\nvar onething = ‘a list’,\nvar differentthing = ‘different list’,\nvar other\
    \ differentthing = ‘other different list’;\n```\n\n注意，在上面的每一个变量后面都有一个分号。在底部的，第二个和第三个变量之前有缩进。这表示有一个新变量。第一个和第二个变量之后也有逗号，表示它仍然是一个列表，但也表示它们必须被分开。分号只在每个列出的项的末尾使用，而不是在每个变量之间。\n\
    \n这是一个好主意，并不是因为它比通常的分号能让页面运行更快，而是因为它让代码看起来更漂亮。当你查看它时，它更容易阅读，如果你需要回来编辑它以进行更改，这对你来说会容易得多。你不需要在这一行一行的变量中筛选，因为它们都在同一个地方。\n\
    \n## 分号的困境\n\n在现代浏览器中，`JavaScript` 并不一定需要在文本字符串之间有分号，因为浏览器可以直接识别一串文本。这样做的问题在于，它们并不是万无一失的，浏览器经常会识别错误的字符串。这可能会破坏整个代码，无论你是开发者、老师还是仅仅是制作自己页面的人，都会让你看起来很糟糕。无论你做什么，不要创建这样的字符串：\n\
    \n```\nvar youritem = “this string\nfunction doit () {\n  return ‘it’\n}\n```\n\
    \n这里没有分号，你无法发现其中的错误，因为没有分号。无法识别字符串的系统会让你的网页看起来像崩溃了一样，这会让你看起来很糟糕。始终使用分号分隔是一个好主意，例如：\n\
    \n```\nvar youritem = ‘this string’ ;\nfunction doit () {\n  return ‘it’ ;\n```\n\
    \n分号是字符串的开始和结束。它告诉浏览器在何处停止读取。通过确保放置了分号，你就能告诉它哪里需要停止。\n\n如果你正在使用某些测试软件甚至允许编写纯文本的软件，你应该更改设置。你可以选择一种允许程序确保字符串前后不再有分号的设置。系统可以识别分号所在的位置，并告诉你你需要更改字符串并添加分号。\n\
    \n## 制作笔记\n\n如果你读过该系列中任何之前的作品或之前的书籍，你将知道，将你创建的各种代码及其功能记录在编码时参考的文档中是非常重要的，但在代码中写下同样重要。这样做将让你有机会轻松地浏览你的代码，以便你找到你做了什么以及它产生了什么。如果你需要修复特定的问题，比如网站的计时方式，你始终可以回去找到你对此做过注释的代码。\n\
    \n"
