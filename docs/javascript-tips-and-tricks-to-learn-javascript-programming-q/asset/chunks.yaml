    ## 引言

    恭喜下载本书，感谢你的支持。


    接下来的章节将讨论帮助你更快、更高效学习 JavaScript 的最佳技巧和妙招。


    市场上有很多关于这个主题的书，再次感谢你选择这一本！我们尽一切努力它包含尽可能有用的信息，请尽情享受！


    ## 第 1 章：路线图与实践

    在阅读本书的过程中，你会发现它分为两个主要部分：学习编码的技巧妙招，以及将所学的编码知识应用于实际编写 `JavaScript` 的技巧妙招。通过这样划分，你能够学习更多并开始更高效地编码。在书的最后三章中，你将学习已经设计并准备好你使用的编码技巧、快捷方式和模板。确保你知道在哪里找到这些内容以供参考，之后考虑使用我们在上一本书中提到过的笔记本或文档，这样你就始终知道信息在哪里。


    在书的第一部分的第一章中，我们将讨论你的路线图以及你可以采取的实践。如果你想确保从 `JavaScript` 体验中获得最大收益并尽可能多学习，这些是你需要遵循的重要步骤。


    ### 你的路线图

    如果你想去一个你从未去过的地方，你必须使用路线图才能到达。实际上，你可能会使用安装在手机和汽车上的 GPS，但 GPS 是接管了路线图，如果没有路线图，它们是不可能的。为了到达你想攻克的
    `JavaScript` 目标，你需要使用路线图。这并不意味着你要旅行或必须去某个特定的地方，它意味着你需要找到学习 `JavaScript` 的最佳行动方案。


    如果你想学习 `JavaScript` 以编写网站甚至成为前端开发人员，在进入 `JavaScript` 部分之前，你需要经过几个步骤。如果你只是想学习它来完成这些工作或教别人如何做，请考虑简单接触路线图中包含的每个步骤。


    你至少需要学习基础的 `HTML`。你不需要成为专家，如果你以后要写 `JavaScript`，也不需要只用 `HTML`，但学习它是有帮助的，这样你可以利用所学的
    `JavaScript` 和 `HTML` 结合创建一个整个网页。了解这些将为你的网站提供所需的基础，并在进行你网站的 `JavaScript` 部分时，帮助你做出一些更大、更重要的决策。


    在学习 HTML 之后，你还需要学习一些关于 `CSS` 的知识。这是大多数网站使用的语言，学习这两者可以确保你以正确的方式编码并使用所学的 `JavaScript`。`CSS`
    比 `HTML` 和 `JavaScript` 都复杂得多，所以你可能只想了解它的表面。如果你计划成为开发者，你最终需要学习 `CSS` 的所有方面，但如果你只是为了给
    `JavaScript` 做准备，就不太需要深入。


    在学习了这些语言后，你可以创建一个功能完整的网站。你只需要使用它们即可。不过，你也可以可以在其中添加一些 `JavaScript`。这正是你学习 `HTML`
    和 `CSS` 的原因，不是吗？你的 `JavaScript` 将与你所过的 `HTML` 和 `CSS` 代码完美融合。确保在遇到问题时，检查你的 `JavaScript`、`HTML`
    和 `CSS` 是否有错误。


    每个人的路线图都不同。你应该确保为你自己创建的路线图是量身定制的。例如，你可能不需要担心 `HTML` 或 `CSS`，因为那是你已经熟悉的内容。你可能不需要了解由于你编写代码可能带来的其他事情，因为你是
    `Jquery` 专家。编写代码和开发网站有许多方面，找出哪些适合你，并在开始编写代码时将其付诸实践。


    ### 高效练习

    当你决定学习 `JavaScript` 时，你可能对它非常兴奋，迫不及待要开始编写自己的代码并创建网站。随着时间的推移，这种兴奋可能会消退，特别是当你发现学习编写
    `JavaScript` 需要大量的练习和许多步骤时。这可能会令人沮丧，但有些方法可以让练习再次变得有趣。这些只是你在练习 `JavaScript` 时可以使用的一些简单心理技巧。（额外奖励：当你在练习任何你想学的内容时，都可以使用这些技巧）。


