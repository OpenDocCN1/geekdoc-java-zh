    虽然你可能不会写一篇 10 页的论文来讨论乔治·华盛顿为什么有木牙齿（就像你在高中或大学课程中可能会写的那样），但你仍然会写你想做的事情。先从写下网页将是什么内容、它将包含什么、它长什么样以及具体的细节开始。这将让你有机会写下你对该网页的所有想法。


    一旦你写下了所有这些信息，就可以开始编写关于页面内容的信息。它是一个博客页面吗？一个问答区？一个测试网站？还是向人们介绍你的页面？或者是一个导航页？所有这些都可以使用你的编程语言以及
    `JavaScript` 实现，所以务必确保你知道你想写什么。在写页面外观信息的同一个地方，用通俗的语言将其写下来。


    随着你编写 `JavaScript` 的经验增加，你可能会发现自己实际上正在将代码直接插入到本应该编写的纯白文中。只要代码是随你的思路流出的且不需要查阅，这样做是可以接受的。如果你发现自己停下写作来查阅代码，那么是时候回到只用通俗语言写作了，这样你就不会在准备要编写的代码草稿上浪费时间。


    即使是经验丰富的开发者也会使用这个技巧，以便习惯非常复杂代码的样子。编写复杂的代码可能是困难的，所以确保你能够先用通俗的语言将它们写出来。如果你能先用通俗语言写出来，你将对自己正在做什么以及以后想用代码做什么有更好的理解。当你知道自己将编写复杂的代码时，务必确保这样做，以便在你回回去检查错误之前就能消除缺陷和错误。


    有许多不同的方法可以练习，但将这些每一个原则应用到实践中，将让你有机会确保在你的 `JavaScript` 学习过程中做出了所有正确的决定。务必确保尽可能多练习，并在尝试练习之前尽可能多地学习。有一句古话说“熟能生工”，这完全适用于学习
    `JavaScript` 以及它能为你做到的事情。


    当你练习时，务必始终记住你刚开始时想做的事情。这样做会让你保持谦逊，并为你提供持续学习更多新知识所需的动力。


    # 第 3 章：慢思考，保持谦逊


    编写代码可以非常快，尤其是当你清楚自己在做什么，并且对你在 `JavaScript` 字符串中编写的代码有丰富经验时。你可能会进展很快，这可能导致你犯错。如果你变得对
    `JavaScript` 非常精通，并且觉得能用它做更多事情时，情况尤为如此。你可能发现，当你编写代码变得更熟练时，你对自己所做的一切都非常有信心。自信并不是坏事，但它可能会导致你忽略一些可能产生错误的地方。为了确保你在编写代码时做到最好（即使在练习时也是如此），你应该确保自己尽可能慢地思考，不要对自己的能力过度自信。


    ## 慢下来


    当你编写脑海中的代码时，确保你尽可能慢。起初这可能花费更多时间，但在回过处理你可能出的错误以及需要做的不同工作时，这将为你节省大量时间。通过慢下来，你产生错误的概率会更小。


    即使在你回看代码并逐行检查每一行 `JavaScript` 时，也要缓慢地观察。阅读每一个字母和符号，这样你就会知道自己在看什么，并能够看到是否漏掉了任何内容。这就像你在高中或大学写论文时可能进行的校对一样。慢下来，逐行校对你写出的作品和编写的代码。这种缓慢的节奏将帮助你发现你可能犯的任何错误。


    值得注意的是，慢下来将帮助你避免工作中的任何重大错误。如果你以较慢的速度移动，你会对每一次击键和放入每行代码中的每件事都更加敏感。缓慢的节奏不仅在你回看所写的内容时提供帮助，也能帮助你编写时的状态。确保你已准备好尽可能慢，不要匆忙完成你的工作。


    ## 休息一下


    从你正在的工作中休息一下总是有益的。在连续看了几小时代码后，你的眼睛不仅会疲劳，大脑也会开始感到疲倦。休息将帮助你刷新正在做的事情，并让你有机会带着大脑中的空白重新开始。在编写代码时，清醒的大脑有很多好处，而休息将为你提供完美的恢复。


    通常情况下，每工作代码一小时，你应该花 5-10 分钟移开眼睛，站起来走走，做一些与 `JavaScript` 无关的事情。出去呼吸新鲜空气或简单地走动一下一下是个好主意。这两项活动都有助于血液循环，并为大脑提供氧气，帮助在你决定坐下重新工作时高效运行。


    提醒：在离开电脑屏幕休息期间，尽量不要玩手机。虽然手机屏幕要小得多，但它发出的蓝光与电脑屏幕发出的光一样有害。在工作时留出特定时间使用手机，这样你就不必浪费休息时间和朋友聊天或检查非业务邮件。休息时将手机放在手不到的地方是个好主意。


    ## 逐步执行


    一旦你写好了你想写的代码，你需要确保你正在逐步执行它。执行的速度要像你编写过程一样慢，这样你就能发现你犯的任何错误。你应该在写完最后一行代码之后、在通过不同的测试进行检查之前这样做。确保你缓慢地查看每一行代码总是一个好主意。


    一种确保你查看了所写代码的每一个字符的方法是大声读出来。对自己读出每一个字母、数字和字符，这样你就能确保它们的写法是正确的。大声读出来总是一个好主意，因为读出来会展示你实际写了什么。大声读出来比在脑子里读花费更多时间。如果你在脑子里读，可能会遗漏很多东西。


