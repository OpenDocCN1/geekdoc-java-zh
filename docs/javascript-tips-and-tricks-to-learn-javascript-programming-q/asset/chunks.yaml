    it, you may end up not practicing at that time, and you will lose out on that
    block of your day. You should only do this once you have spiraled and once you
    know that you enjoy practicing. The time that you do it should be a time with
    very few other distractions and when you can think clearly.


    When you started coding and learning `JavaScript`, you probably did not know that
