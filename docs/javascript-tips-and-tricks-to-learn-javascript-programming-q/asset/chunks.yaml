  trans: "\n\n可以将此代码添加到你的代码行中，这样人们就能一直知道自己处于一个合法的网站上。当有人访问你的网站时，不会有任何东西出现，他们甚至不知道你已经在网站中编写了这种代码。除非你的网站被复制了副本，否则他们看不到任何内容。服务器地址和\
    \ URL 必须完全匹配，这样才能被正确地使用。你可以采取许多不同的方法来确保你的网站受到保护，但这是你能够编写的最容易的代码之一，而且你的访问者甚至不会察觉到它。\n\
    \n添加这段代码是一个好主意，因为这样你的访问者将始终确定他们正在访问正确的网站。如果由于某种原因出现了警告信息，你应该让访问者知道他们实际上不在你的网站上，并且面临着被黑客或在线攻击者攻击的风险。他们应该知道，如果看到那条信息，需要离开浏览器或跳转到其他网站。\n\
    \n## 简单区块\n\n你可以通过一行代码在网页上创建一个与其它部分隔离的区块。它实际上由几行不同的代码组成，其中包含变量并可以更改网站内容的显示方式，以便你能够对其进行更多操作。模态框（modal）是让网页上的内容脱颖而出的简单有效的方法，让人们看到你正在做什么。编写方法如下：\n\
    \n```css\ndiv# easy modal {\n  width: 449 px\n  position: absolute; top: 28 px;\
    \ left: 150 px;\n  padding: 15 px;\n  border: sold 1px #000;\n  background: #fff;\n\
    \  -webkit-box-shadow: 0px 4 px 8 px rgba (0, 0, 0, 0.25);\n  -webskit-transition:\
    \ -opacity 0.25 ease-out;\n}\n\ndiv# simple modal.shown {\n```\n\n你可以更改一些内容，比如边框的大小以及页面上不同定位的大小，但你想要确保它不会太大，或者不会完全接管你已经编写好的作为一部分的页面。除了边框的大小、框的大小以及所在的位置，你还可以更改颜色。你可以使用简单或高级的十六进制来选择颜色，但要确保模态框内的文字不会因为背景颜色而变得不可见。你还应该确保框与你已经在网页上使用的其他颜色相匹配。\n\
    \n## 对象属性\n\n有时你可能希望让你对象的所有属性都为人知。这可能是因为你想展示可用的不同选项，或者你只是想让某物在许多其他相同的物品中脱颖而出。当你这样做时，你可以确保你正在以正确的方式处理对象，并且可以确保人们在决定访问你的网页时可以看到不同的选项。如果你想让人们选择一个特定的对象，那么这样做是一个好主意。为对象编写属性迭代的写法如下：\n\
    \n```javascript\nfor (I = 4; i <thislist.length; i++) {\n  var thislist = thislist\
    \ [i];\n  //this list does it\n}\n```\n\n这不仅可以显示特定对象自带的属性，还包含了你需要在脚本注释中留下的说明。这样做将使你有机会让网页访问者选择你想要的对象，但它也会向他们展示当他们选择访问你的页面时将做什么。\n\
    \n选择这些能向他人展示你能做什么的属性高亮项，将给你一个机会确保你正在以正确的方式处理工作。它还允许人们在访问你的网站时看到他们可以选择的选项，并为他们提供做出良好选择所需的信息。这不一定能保证他们会做出选择，但可以引导他们做出那个选择。\n\
    \n## 用于其他网站\n\n你并不非要在自己的网站上工作才能使用 JavaScript。你可以使用 JavaScript 编辑一个不是你自己的网站，让它看起来像你想要的样子。这种方法非常简单，你会对结果感到满意，因为在编辑页面时，你可以从许多不同的选项中获益。要编辑你所在的页面，你只需要删除浏览器栏中的信息并插入：\n\
    \n```javascript\njavascript: document.body. contentEditable='true'; document .designMode='on';\
    \ void 0\n```\n\n它现在将运行方式与文字处理程序或任何你可以使用的编辑器完全相同，可以让它看起来像你想要的一样。除非你从服务器使用这种技巧，否则它在任何其他人的计算机上都不会显示这样，但如果你为了自己的利益想让网站呈现某种特定的样子，它就会派上用场。你能想象一下，如果\
    \ Google 上输入的是你的名字，而不是你所熟悉的“Google”标志，它会变成什么样吗？\n\n在改变事物和使用 JavaScript 实现这一点方面，有很多选择。无论你是在使用自己的网页、别人的网页，还是只是在尝试一些酷炫的技巧，你都能从\
    \ JavaScript 提供的一切中获益。当你学会了这些技巧时，你可以对它们进行定制，使其最符合你的需求。只需确保你总是为了善意使用它们，而不要对其他开发者或喜欢电脑的人产生恶意。学习\
    \ JavaScript 并不难，但你需要确保你完全按照要求进行操作。如果你这样做，脚本可能会看起来不同，并且可能不是你想要的样子。\n\n## 第 6 章：排查\
    \ JavaScript 故障\n\n你的 JavaScript 可能会出现很多问题。最常见的情况包括编写了错误的代码、添加了额外的字符以及放置位置错误。在这里，我们将讨论如何排查你编写的\
    \ JavaScript。\n\n如果页面没有正确加载、显示不正常或者当人们访问你的页面时可以看到代码，你可能发现 JavaScript 存在问题。请确保你在编写过程中不断测试，这样你就能发现你所编写的代码是否存在问题。\n\
    \n"
