    不要走捷径。


    直接丢进预写好的代码看起来可能很容易，但如果你决定这样做，你只会是在自讨。这是因为你需要确保自己确实是在在学习，而不仅仅是在使用别人已经写好的代码。如果你走捷径或尝试作弊，你将花费更长的时间才能学会你通过
    `JavaScript` 所需的知识。这样做可能会带来很多问题，而且你将无法尽可能地学习。


    如果你在寻找动力练习 `JavaScript` 方面遇到困难，你只需要做的就是改变心态。想象一下你刚刚学了一些 `JavaScript`，但你无法练习它或将其投入使用。你可能很想能够使用它，对吧？保持这种心态。如果你只是想象自己无法练习它，你会比自己完全有能力随时练习它时更想去练习它。


    你可以使用的另一个心理技巧是尝试记住你第一次学习 `JavaScript` 时的感受。你当时充满热情，想要一直做下去。把你的思绪回到那个时刻，为此感到兴奋。即使你必须再次假装自己很兴奋，也要假装直到你真正感到兴奋为止。这将给你一个机会，让你再次像一个拥有新玩具的孩子——渴望并准备好玩你所学的
    `JavaScript`。


    执行这些每一个心理技巧并不能保证你有更多时间练习，或能让你更高效地练习，但它们将帮助你进入练习 `JavaScript` 的正确心态。如果你处于正确的心态，你更有可能在实际练习以及在学习过程中尝试编写的
    `JavaScript` 代码时获得成功。


    # 第 2 章：Facebook 与通俗语言


    现在你已经处于可以练习的正确心态了，你需要真正开始练习了。即使你对这个过程充满热情，开始和寻找动力可能是最困难的部分之一。确保你在心理上为练习做好准备，然后开始使用这些技巧来完成练习。


    本章的第一部分将告诉你如何开始练习，以及你练习和学习你想要通过代码实现的目标时的最简单方法。


    ## Facebook


    当你有空闲，想什么都不做时，你很可能是在看手机浏览 `Facebook` 或你其他喜欢的社交媒体。回想一下你开始浏览的时候。你是怎么做的？你是特意说自己要坐在沙发上看几个小时
    `Facebook` 并不断刷新吗？还是，你坐下来心里想，你只想看看某某人在做什么？如果是后者，请举手。现在，放下手，你看起来很傻但事实是，大多数人并没有特意坐下来浪费
    4 或 5 小时去浏览 `Facebook`，但大多数人都这样做过。


    如果你上 `Facebook` 只是快速看一眼，很容易陷入不断刷新并获取所有朋友最新消息的螺旋中。如果你正试图完成某些任务，这种螺旋可能是危险的。`Facebook`
    是对生产力最不利的事情之一，但有一种方法可以让你化腐为神奇。你可以利用 `Facebook` 螺旋帮助自己开始练习 `JavaScript`。


    坐下来告诉自己，你只写一段代码或看一眼与你的 `JavaScript` 练习相关的一件事。开始做那件事吧。你可能会被其他代码分散注意力，并在完成你打算坐下来做的那“仅仅一件”后开始做另一项工作。你现在已经进入了螺旋，可以一次持续工作几个小时，而完全不用考虑它。你通过只完成一个小任务就欺骗了自己去练习
    `JavaScript`。


    显然，这并不会每次都有效。你做得越频繁，不起作用的可能性就越高，所以确保只有在你真的无法找到动力开始进行 `JavaScript` 练习时才这样做。你不会每次都陷入螺旋，但不要失望。这只意味着你那时真的并不适合开始练习。休息一下，稍后再回来练习，以确保你确实处于开始练习的正确心态状态。


    通过使用 `Facebook` 螺旋，你为自己提供了又一种练习方式。你可能会发现，一旦你这样做了，你就会不断回来。你可以陷入练习 `JavaScript`
    的螺旋中，这并不是坏事。这正是你所希望的。你总是渴望练习，并在编写 `JavaScript` 代码的过程中随着所学的内容不断进步。确保你已为这种情况发生做好准备，并设定好可以练习的时间。


    在刚阶段，从日程表中抽出时间可能不是最好的做法，所以确保不要这样做。如果你为它留了时间，你最终可能在那个时间没有练习，从而浪费了那段时间。你只有在进入螺旋并且知道自己喜欢练习后才应该这样做。你执行它的时间应该是一个干扰极少且你可以清晰思考的时间段。


    当你开始编写代码和学习 `JavaScript` 时，你可能不知道你的社交媒体习惯能够帮助你学习更多，但你始终可以利用它的优势。一个可以迅速变成益处的事情是减少你在社交媒体上的时间。几乎每个人都需要减少使用
    `Facebook` 或 `Instagram` 的时间，而在那个时间保持高效是一个好主意。如果你处于练习螺旋中，你会花更少的时间浏览 `Facebook`，花更多的时间编写对以后有益的优秀代码。


    ## 通俗语言


    当你和朋友交谈时，想要清晰地表达词汇，你不会在开始热情地说话之前停顿，对吧？你在编写代码时也不应该这样做。你应该确保从通俗语言开始，然后利用你对 `JavaScript`
    的知识以正确的方式进行编码。


    这种想法的一种很好的方法是草稿。中学生和大学生非常熟悉草稿。当他们开始写论文时，被要求写下他们能想到的所有内容。在写草稿时，他们不需要担心句子结构、语法或任何其他事情。他们需要把观点传达并写下他们的想法。


    如果你开始编写代码，请从草稿开始。使用 `Notepad` 或你在准备学习 `JavaScript` 时可能下载的其他软件。这将给你一个机会，真正将你所有的想法和你想做的事情都呈现在“纸”上。它还将告诉你，在你开始编写已经安排的代码时，需要做哪些改进。

