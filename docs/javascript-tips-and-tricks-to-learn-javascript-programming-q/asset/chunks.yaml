    If you’ve got the wrong codes, you risk destroying the rest of the strings that
    you have written in your code. It may make you unable to continue with the rest
    of the page and may make things harder for you to actually make it better. There
    could be a problem at the beginning that is easily fixed but if it remains there,
    the rest of your code will not look right, and your page will not appear in the
    way that you were hoping for it to look after you had done it.


    ## Additional Characters


    While you are writing your code, you may find that you have letters that slip
    into the code that may be responsible for changing your code. This can be a problem
    because you need to make sure that you are getting the most out of the code and
    having extra characters within it will change the string of things. Unless you
    want extra characters to show up outside of the code, you need to check and double
    check to make sure that you did not slip anything extra in there.


    You should also make sure that there are no irrelevant characters in the code
    that you have written. This can be anything from an extra comma to an entire string
    of words that isn’t really necessary.


    ## Missing Characters


    You always need to have a semicolon after the string of text. This cannot be stressed
    enough and is essential to making sure that you are getting the right code done
    in the right way each and every time. It is a good idea that you put a semicolon
    in there even if you don’t think that you need one. Missing a semicolon can have
    grave effects on the way that your code appears and it may cause your page to
    look like it is not complete. Because of this, you need to make sure that there
    is a semicolon each time that you want to change your string of text.


    It is also important to make sure that you include all of the necessary brackets
    and curly brackets so that you can make sure that your code is held up nicely.
    If you want to use parenthesis instead of the brackets, you should be sure that
    they are going in the correct direction and that they are placed in the right
    place so that they will be able to hold the code up.


    ## Wrong Place


    Placing a portion of your code in the wrong place can be a big problem if you
    want to make sure that your web page looks as good as possible. You should make
    sure that the information that is included in the right place whether it be toward
    the top or the bottom. In general, things that take a long time to load should
    be placed at the bottom, and things that you need to show on your page first should
    be placed toward the end. All of the information should be included within the
    `<script>` tag and should be in one central location.


    If you fail to include the information in the `<script>` tag, you may need to
    make a different tag or one that is able to be used in combination with the initial
    tag. You should also make sure that you are doing it the right way and that all
    of the information that you want to be included is included. Code that is left
    outside of the tag will show up on its own and will look out of place on the web
    page. It will not be formatted, and it will not fit in with the rest of the information
    that is on the page.


    ## Formatted Incorrectly


    Formatting is so important in JavaScript. Because this is a language that is mainly
    used for formatting, you need to make sure that it is something that you are working
    on when you are writing the code for your web page. It is a good idea to always
    check the formatting no matter what type of error you have. The format of the
    JavaScript, as well as the text, could be the culprit for problems when you are
    testing your page to see what, if anything, is wrong with it.


    There are some things that are just not compatible with the different types of
    codes. There are also some things that will just not work out no matter how hard
    you try to make sure that they are going together. For example, you simply cannot
    create a bold font that is also formatted to be bold. That will be too much, and
    the font will not be able to be read because it is so thick. The error with this
    may show up in that it simply shows as plain text or it doesn’t show at all. Make
    sure that all of your formattings is done correctly, and you are able to show
    exactly what you want on the web page that you have created.


    ## Conclusion


    Thank for making it through to the end of this book, let’s hope it was informative
    and able to provide you with all of the tools you need to achieve your goals whatever
    they may be. The next step is to read the next book in the series that includes
    simple JavaScript strategies. Once you have done that, you will be well on your
    way to coding and start to write in JavaScript.


    Finally, if you found this book useful in any way, a review on Amazon is always
    appreciated!

    '
