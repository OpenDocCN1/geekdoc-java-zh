    ```\n\n代码中放置的花括号必须完全精确，否则程序将无法运行。嵌套的 `if` 语句学习起来比较复杂，但可以拆解来理解。\n\n## 布尔值\n\n布尔值只有\
    \ `true` 或 `false`、`1` 或 `0`，甚至是 `yes` 或 `no`。Java 有一个专门用于布尔值的变量：\n\n```\nBoolean\
    \ client = true;\n```\n\n你不需要输入 `int`、`string` 或 `double`，你需要输入使用小写 b 的 `Boolean`。变量名将在赋值为\
    \ `true` 或 `false` 值之后出现。赋值将使用一个等号。然而，如果你要评估变量并且它有某个值，那么你就需要使用两个等号。\n\n### Code\n\
    ```\nBoolean client = true;\n\nif ( client == true) {\n    System.out.println\
    \ (“it’s true”) ;\n}\nelse {\n    System.out.println(“it’s false”) ;\n}\n```\n\
    \n`if` 语句将检查客户输入的变量是否为 `true`。`else` 将检查它是否为 `false`。你不需要说 `else if ( client ==\
    \ false)`。当结果不是 `true` 时，它显然是 `false`。由于布尔值只有两种选择，所以你会使用 `else`。\n\n另一个用于条件的运算符是\
    \ `NOT` 运算符，它被用于布尔值。\n\n### Code\n```\nBoolean client = true ;\n\nif( !client)\
    \ {\n    System.out.println (“it’s false”) ;\n}\nelse {\n    System.out.println\
    \ (“it’s true”) ;\n}\n```\n\n---\n\n![image](img/scene_break.png)\n\n`NOT` 运算符将放在\
