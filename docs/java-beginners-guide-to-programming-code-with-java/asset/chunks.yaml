    # Chapter 1: Java


    ![image](d2d_images/chapter_title_below.png)


    The hardest thing about starting with Java is ensuring that you have everything
    installed that you are going to use with Java. Before you are able to write code,
    you have to have all of these programs or else you are going to set yourself up
    for a headache.


    ## Virtual machine


    The Java platform is going to be independent from any other program. So, it is
    going to be able to run on any operating system that you may be working with.
    It can work on any system thanks to the Java Virtual Machine. This machine is
    going to help in programming so that your code is processed correctly. The virtual
    machine program has to be installed before any Java code can be run.


    A company called Oracle owns Java and on their website you are going to find the
    download link for the virtual machine which is also known as the Java Runtime
    Environment or `JRE`.


    When you check to see if your computer already has `JRE`, you can click on the
    link on the Oracle page that says “Do I have Java?” This link can be located under
    the download button that is on the top of the page. When this link is clicked,
    the computer is going to be scanned and then you are going to get your result
    for if you have it or not. If you do not, then you will have the chance to download
    it from this page.


    Once the virtual machine has been downloaded, you need to restart your system
    so that the program can run properly.


    ## Software development kit


    Now that the software has been installed, Java is going to be able to run on your
    computer. But, before you can write code, you will need to install the Software
    development kit off of the Oracle website as well.


    This kit is known as the standard edition, and the one that you are going to want
    use is known as `NetBeans`. The download will be rather large, but once it has
    been downloaded, you are going to be able to write Java code.


    ## How things work with Java


    The code for Java will be written in a text editor and the code is known as source
    code. Any code that you write is going to be saved in a file with the extension
    of `.java`. The `javac` program has the ability to turn any source code that you
    write into Java Byte Code which is known as compiling. Once the file has been
    compiled, a new file is going to be created with a new extension of `.class`.


    At the point in time that the class file is created, the virtual machine is going
    to be able to run the file. `NetBeans` is a program that will handle the creation
    and compiling of files for you. But, looking behind the curtain, you are going
    to notice that your source code will be created into a Java file which will then
    launch `javac` to create your class file. `NetBeans` has the capacity to run the
    program with its own software so that you are saved the hassle of opening up different
    windows when you are entering commands.


    ## NetBeans


    When first entering `NetBeans` you are going to have to wait for a minute because
    this program is not that fast. But, when you finally get it loaded, you are going
    to go to file and then new project so that you can create a new application.


    After you have clicked on Java Application, you are going to click the next button
    to go on to the next section. Obviously you are going to need name your project
    which is going to change the text at the bottom of the window so that it matches
    what you have named your project.


    A class is going to be created with your files name. If you name it as `firstproject.FirstProject`,
    the class is going to capitalize the `F` and `P` while the package is going to
    be lowercased.


    `NetBeans` automatically defaults the save, but you can change it if you are going
    to be able to find elsewhere better. A folder is also going to be created that
    will contain your projects name. Once you click the finish button, you are going
    to have all the files that you need created.


    After you have been returned to the IDE you are going to be able to look at your
    projects to see if there are any projects that you are working on. When you hit
    the plus symbol that is located next to the project name, you are going to see
    all the folders that are associated with that project. Each folder is going to
    expand further so that you can see the file where your source code is stored.


    Your source code should be displayed to the right inside of the text area. In
    the event that you do not see the code window, you are going to need to double
    click on your project so that the code appears and you can begin your work.

