    # Introduction


    ![image](d2d_images/chapter_title_below.png)


    Congratulations on downloading Java: Beginner’s Guide to Programming Code with
    Java and thanks for doing so.


    The following chapters will discuss what Java is and what it is used for.


    By the end of this book, you should be able to use Java as you would any other
    programming language.


    Keep in mind that Java is not going to be the same as JavaScript. They are two
    completely different languages.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, please enjoy!


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
