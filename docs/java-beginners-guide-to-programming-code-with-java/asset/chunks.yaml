    \ are 21 or 22”) ;\n  }\n}\n```\n\n第一个 `if` 语句将捕捉客户小于 19 岁的情况，第二个语句将进一步缩小范围，使其大于\
    \ 16 岁。当你想要打印不同的消息时，可以使用 `if else` 语句。\n\n### Code\n```\nif( client < 20) {\n\
