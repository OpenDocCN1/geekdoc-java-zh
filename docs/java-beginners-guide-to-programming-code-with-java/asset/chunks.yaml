    较大的数值可以存储在 `int` 变量中，但限制是 `2147483647`。你也可以处理负数，你能达到的最低值是 `-2147483648`。更大或更小的数值将使用
    `double` 变量类型。


    ## Double 变量


    `Double` 变量可以表示从极大到极小的各种数值。你能够达到的最高和最低数值将是 17 后面跟着大约三百零七个零。`double` 变量将用于存储浮点数。如果你尝试将浮点值存储在任何
    `int` 变量中，程序将标出代码错误之处，以便你可以在运行之前进行更改并接收错误消息。


    ### Code

    ```

    int last_amount, third_amount, result;


    double last_amount, third_amount, result;


    last_amount = 11.5;


    third_amount = 22.8;


    result = last_amount + third_amount ;

    ```


    现在可以运行程序来向你展示它的样子。


    ## Short 和 float


    `Short` 变量将保存于 `-32768` 到 `32767` 之间的较小数值。你将不再像以前那样在代码中使用它，而是将使用 `short`。当你使用
    `short` 时，你需要确保你所使用的数值落在这两个数值之间。


    `Double` 值将用于存储更大的浮点数。你将不会使用 `double` 而是使用 `float`。当你存储一个 `float` 变量时，你的数值末尾需要加上字母
    `f`。


    ### Code

    ```

    float last_amount, third_amount, result ;


    last_amount = 10.5f;


    second_number = 20.8f;

    ```


    ## 算术运算


    当你对变量进行数学运算时，你将使用基本符号进行计算。


    - 加法 (`+`)

    - 减法 (`-`)

    - 乘法 (`*`)

    - 除法 (`/`)


    ### 优先级


    Java 中可以计算两个以上的数值，但你必须确保在计算内容时要小心。


    ```go

    last_amount = 200;


    third_amount = 85;


    fourth_amount = 45;


    result = last_amount – third_amount + fourth_amount;

    ```


    计算将按照它们出现的顺序进行。因此，你需要从 `200` 中减去 `85` 得到 `115`。然后加上第三个数值得到 `160`。


    为了确保 Java 执行你意图的操作，可以使用括号。


    ```go

    result = (last_amount – third_amount) + fourth_amount


    result = last_amount – (third_amount + fourth_amount)

    ```


    对于乘法，乘法将先于任何加法或其他操作执行。


    优先级的顺序是乘法和除法优于加法或减法。


    ## String 变量


    数值并不是唯一可以存储的内容，变量也可以存储文本。当你想要存储一个字符时，你需要使用 `char` 关键字，以便 Java 知道你使用的是字符而不是数值。由于你存储的是多个字符，你将使用字符串（string）变量。


    像你在第一章中那样启动一个新项目，将项目命名为类似 `StringVars`。需要勾选该框以创建一个主类。你可以删除 `stringvars` 之后的 `main`，并代之输入
    `StringVariables`。


    删除所有注释后，你将拥有一个与之前类似的代码窗口。为了创建一个字符串，你将使用 `string` 作为你的关键字，后面将跟着变量名。仍然会使用分号。


    ```java

    String middle_name;

    ```


    再次使用等号将值赋值给新变量。等号后面的文本将存储在一对双引号内。


    ```java

    middle_name = “William” ;

    ```


    这段代码也可以放在单行中：


    ```java

    String middle_name = “William” ;

    ```


    在另一个字符串中，你将输入客户的姓氏。


    ```java

    String inherited_name = “Shakespeare” ;

    ```


    在你的打印语句中，你将它们结合在一起


    ```java

    System.out.println (middle_name + “ “ + inherited_name) ;

    ```


    括号内部信息将是我们的变量内容。加号后面跟着一个空格，该空格在双引号内。双引号帮助 Java 识别出这两个字符之间需要一个空格。


    你的代码看起来会很乱，但你只会得到名字和姓氏的打印。


    ```java

    String middle_name = “W”;

    ```


    虽然上面的语法是正确的：


    ```java

    String middle_name = ‘W’;

    ```


    但这种不对。


    ## 客户端输入


    在 Java 中，有大量的库可以可以使用，以便让你看到代码应该执行什么功能。如果你需要引用该库，你需要使用一个被调用的方法。最有用的类之一是处理来自客户端的输入，名为
    `Scanner`。该类可以在 `java.util` 库中获取。使用的 `Scanner` 必须在你的代码中有一个引用。你将使用的关键字是 `import`。


    ```java

    import java.util.Scanner ;

    ```


    权重最大的语句需要在包含该类的语句之前确定。


    ```java

    import java.util.Scanner ;


    public class StringVariables {


    }

    ```


    程序已被告知库中存在某个类，并且它在 `java.util` 库中。完成此后，你需要在 `Scanner` 类中建立一个实例。这个组仅仅是一系列代码，但在从它创建新对象之前，它不会执行任何操作。


    当你使用 `Scanner` 创建新对象时，你将使用一段特定的代码。


    ```java

    Scanner client_input = new Scanner( System.in) ;

    ```


