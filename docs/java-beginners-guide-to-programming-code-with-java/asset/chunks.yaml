    \ 变量已设置为 `true`，`!client` 最终将测试 `false` 值。如果条件被设置为 `false`，那么 `NOT` 运算符将测试 `true`\
    \ 的值。\n\n## Switch 语句\n\n为了管理脚本的运行，开发者可以使用 `switch` 语句。`switch` 语句将为你提供位于变量设置取值范围内的选项。本质上讲，这些是长而复杂的\
