    \ array is going to have.\n\nThe syntax will be: `int [] aryNums;`\n\nThe difference\
    \ is going to be that the normal integer variable is going to be in square brackets\
    \ once the data type has been set. The brackets will let Java know that you have\
    \ set an array up. The name for the array is going to be `aryNums`. But, like\
    \ any normal variable, you are going to be able to call them anything that you\
    \ want.\n\nWhen you are telling Java how many positions the array is going to\
    \ have, you have to set up a new object for the array.\n\n### Code\n\n```java\n\
    aryNums = new int[ 6 ];\n```\n\nAt first you are going to be starting with the\
