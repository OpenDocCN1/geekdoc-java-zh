    # Chapter 4:


    ![image](d2d_images/chapter_title_below.png)


    Arrays


    An array is going to hold more than a single value at a time; it is more of a
    list of items. When you are thinking of arrays, you should think of a spread sheet
    and how there are columns. You can have one column or a bunch of columns.


    ––––––––


    ![image](d2d_images/scene_break.png)


    An array that is in one column is going to look like this:


    0 – 10


    1 – 14


    2 – 36


    3 – 27


    4 – 43


    5 – 18


    Just like a spread sheet, every row is going to have a position amount. The positions
    are going to start at zero and go up by one every time. Each position will hold
    a value just like the code above.


    When you want to set up an array, you are going to need to let Java know what
    sort of data you are putting into the array. You are also going to need to say
    exactly how many positions the array is going to have.


    The syntax will be: int [ ] aryNums;


    The difference is going to be that the normal integer variable is going to be
    in square brackets once the data type has been set. The brackets will let Java
    know that you have set an array up. The name for the array is going to be aryNums.
    But, like any normal variable, you are going to be able to call them anything
    that you want.


    When you are telling Java how many positions the array is going to have, you have
    to set up a new object for the array.


    Code


    aryNums = new int[ 6 ];


    At first you are going to be starting with the array’s name then followed by an
    equals sign. The equals sign is going to have a new keyword before you get to
    your data type. The type of data that is being used is going to be followed by
    the array’s size. The size will let Java know how many positions the array needs
    to have.


    You can also put it all in one line if that is how you prefer your code to look.


    Code


    int[ ] aryNums = new int[ 6 ] ;


    Java is going to know that you are using an array that has six positions in it
    and that the data type is integers. Therefore, the default values are going to
    be zero to six.


    When you want to assign the values to a various amount of positions, you are going
    to do it like normal.


    Code


    aryNum[ 0 ] = 10 ;


    The value of ten will be assigned to the zero in the array.


    Remember that the array is always going to start at zero and the third position
    is going to be the index of the amount two.


    To make it easier to set your array up, you can do it like this:


    int[ ] aryNums = { 1, 2, 3, 4 } ;


    With this method, you are going to place your values for the array in the curly
    brackets. The first value as always is going to be zero. There are going to be
    square brackets after int but there is not going to be a new keyword nor will
    there be any data type that has been repeated. You can only use this method with
    in, char, and string values unless you want to use a new keyword.


    String[ ] aryStrings = { “ Autumn”, “Spring”, “Summer”, “Winter” } ;


    This is okay


    Boolean[ ] aryBools = { false, true, false, true } ;


    This is not okay!


    In setting up a Boolean array, you are going to have to use a new keyword


    Code


    Boolean[ ]  aryBools = new Boolean[ ]  { false, true, false, true } ;


    ––––––––


    ![image](d2d_images/scene_break.png)


    Loops and arrays


    Arrays are going to have their own loops. When a value has been assigned to an
    array you are going to use the syntax that you saw in the last section. While
    this is not entirely practical, it can work in the event that you have a lot of
    amounts that need to be assigned to the array.


    Code


    package prjarrays ;


    public class ArrayTest {


    public static void main (String[]  args) {


    int[ ] lottery_amounts = new int [ 49 ] ;


    int I ;


    for ( I = 0; I < lottery_amounts.length ; i++) {


    lottery_amounts[ I ] = I +1;


    System.out.println ( lottery_amounts[ 1 ] ) ;


    }


    }


    }


    This array is going to have 49 different integers. The end of the loop has a length
    which is going to note how many positions the array will have. This loop is going
    to continue to go until the value of I is a smaller amount than the array’s size.


    In order to appoint a amount to the positons the developer will use this:


    lottery_amounts[ I ] = I + 1 ;


    Instead of a hard coded value that is set between the square brackets, there is
    going to be a variable that will increase every by one every time that the loop
    goes around. Each array is going to be accessed by the loop’s value. The value
    being assigned here is I + 1. Since the loop value starts at zero you are going
    to have the amounts one through forty-nine.


    The next line for the loop will print out the value for every array position.
    Should you want to, you can write out the code so that it is jumbled up with the
    amounts in the array. After the values, have been jumbled, you are going to us
    the first six as the lottery amounts.


    Sorting Arrays in Java


    With Java methods, you are going to be able to sort out the arrays that you create.
    Using the sorting method is going to mean that you have to have a reference to
    the Array’s in the Java library. This can be done with an import statement. Your
    syntax will be:


    Code


    import java.util.Arrays ;


    package prjarrays;


    import java.util.Arrays ;


    public class ArraysTest {


    public static void main ( String[]  args) {


    int[]  aryNums;


    aryNums = new int [ 6 ] ;


    aryNums[ 0 ] = 20 ;


    aryNums[ 1 ] = 16 ;


    aryNums[ 2 ] = 38 ;


    aryNums[ 3 ] = 29 ;


    aryNums[ 4 ] = 45 ;


    aryNums[ 5 ] = 12 ;'
