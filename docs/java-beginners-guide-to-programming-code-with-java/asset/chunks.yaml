    Strings


    Strings are going to be different than the variables used for integers or variables
    for the double integers. The strings are actually items.


    Storing strings


    Strings use Unicode characters that are under the variable name.


    Code


    String someText = "Bill";


    Java is now informed that the string’s object is going to be four characters.
    The Unicode character sets are \u0042, \u0069, \u006c, \u006c. The values for
    the Unicode will be stored inside of hexadecimals. Any capital letters are going
    to be stored with the value of \u0041 to \u005a, at the same time lowercase letters
    are kept using the values \u0061 to \u007a.


    Code


    package strings1 ;


    import java.util.Arrays ;


    public class StringArrays {


    public static void main(String[]  args) {


    String[] aryString = new String [ 5 ] ;


    aryString[ 0 ] = “This” ;


    aryString[ 1 ] = “is” ;


    aryString[ 2 ] = “a” ;


    aryString[ 3 ] = “string” ;


    aryString[ 4 ] = “array” ;


    arrays. Sort( aryString ) ;


    int I ;


    for ( I = 0; I < aryString.length ; i++) {


    System.out.println( aryString[ I ] ) ;


    }


    }


    }


    When this code is sorted alphabetically, a is not going to come first because
    it is lowercase. Therefore, a is going to have a value of u\ 0061\. The T that
    is capitalized will have a value of u\0054.


    In manipulating strings of different texts, there are some methods that you can
    use:


    toUpperCasse


    toLowerCase


    compareTo


    IndexOf


    endWith, startsWith


    Substring


    Equals


    charAt


    trim


    valueOf


    Lower and Upper case letters


    Java is going to convert the text to either lowercase or uppercase in a manner
    that is straightforward and will use the methods that are built into the toUpperCase
    and toLowerCase.


    Code


    Package prjstrings;


    Public class StringManipulation {


    Public static void main (String[] args) {


    String changeCase = “text to change” ;


    String result ;


    Result = changeCase. toUpperCase( ) ;


    System. out. printIn( result ) ;


    }


    }


    The very beginning lines tell where the variable has been set up for the string
    while holding on to the text that has to be changed before it is printed. The
    third line calls for the result of the variable. Finally, in the fourth line,
    it is converted.


    result = changeCase.toUpperCase( );


    The string method is going to work on any string. You will just need to type a
    dot after the variable so that you can see what you can do with the string for
    your changeCase. If you want it to be uppercase, then you are going to select
    it, but keep in mind that the uppercase should have a set of empty brackets that
    come after it.


    Once the result has been converted, it is going to be stored as the new result.
    If you do not want the result stored, you can use this:


    System.out.println( changeCase.toUpperCase( ) )


    The same method is going to be used when you want to do toLowerCase.


    String comparison


    Strings can be compared to each other through the use of hexadecimal values. You
    will just need to use the compareTo method.


    Code


    package prjstrings ;


    public class StringManipulation {


    public static void main (String[] args) {


    int result ;


    String Word1 = ‘Ape” ;


    String Word2 = “App” ;


    result = word 1.compareTo( Word2 ) ;


    if (result < 1 ) {


    System.out.println (“Word1 is less than word2” ) ;


    }


    else if (result > 0 ) {


    System.out.println(“Word 1 is more than word 2” ) ;


    }


    else if (result == 0 ) {


    System.out.println (“the same word”) ;


    }


    }


    }


    When these two words were being compared the compareTo method was used with this
    syntax:


    result = Word1.compareTo( Word2 );


    A value is going to be returned that will be greater than zero, less than zero,
    and have a value that equals zero.


    It is going to be up to you to make sure that the proper value is assigned so
    that the compareTo is returned to the variable. If statements are going to be
    in the code to test and see what the result is going to be.


    But, when two strings are compared, Java is going to compare the hexadecimal values
    instead of the word’s letters. Since both have uppercase letters the A for App
    is going to be used before ape.


    indexOf


    The indexOf is going to locate a character inside of the current string or any
    other string.


    Code


    package prjstrings ;


    public class StringManipulation {


    public static void main (String[] args) {


    char ampersand = ‘ @ ‘ ;


    String email_address = “meme@me.com” ;


    int result ;


    result = email_address.indexOf( ampersand ) ;


    System.out.println(result) ;


    }


    }


    This code is checking to see if the @ symbol is located in the email address that
    was provided. Because of the single quotes it is a char variable. Once the email
    has been set up, you are going to have your result which will be an int variable.
    Therefore, your result is going to be an integer thanks to the indexOf method.


    The position for your ampersand is going to be the result for this code because
    of this line:


    result = email_address.indexOf( ampersand );


    The string that you want searched first is going to come after the dot when you
    specify that you want to use the indexOf method. Between the parentheses is going
    to be where you will have several options. First, you can type in a single character.
    With this, Java will tell you the position of the character in the string before
    it stores the value for the result of the variable.


    When the code is run, the output is going to be four. Since indexOf starts at
    zero like everything else, the ampersand is going to be the fourth character in
    the email string.


    Should the character that you are looking for not exist, then indexOf will give
    you a result of negative one.


    Code


    package prjstrings ;


    public class StringManipulation {


    public static void main(String[] args) {


    char ampersand = ‘ @ ‘ ;


    String email_address = “mememe.com” ;


    int result ;


    result = email_address.indexOf( ampersand ) ;


    if ( result == -1 ) {


    System.out.println( “invalid email address” ) ;


    }


    else {


    System.out.println( “email address is okay” ) ;


    }


    }


    }


    Your result of negative one is going to allow the client to continue.


    IndexOf can also be used to test for multiple characters.


    public static void main (String[] args) {


    String dotcom = “ .com “ ;


    String email_address = “ meme@me.com “ ;


    int result ;


    result = email_address.indexOf( dotcom ) ;


    if (result == -1( {


    System.out.println( “invalid email address” ) ;


    }


    else {


    System.out.println(“email address is okay”) ; 


    }


    }


    While this code looks exactly the same, you are now going to be using the variable
    from the string in order to hold the text that you want to check for instead of
    the char variable.


    With another result of negative one being returned, the text that was searched
    for could not be found in the string that comes before the dot for the indexOf
    method. If it had, then the indexOf would have returned the character that first
    matched what you were searching for.


    In the code listed above, the dot is going to be the seventh character inside
    of the email address whenever you start counting from zero.


