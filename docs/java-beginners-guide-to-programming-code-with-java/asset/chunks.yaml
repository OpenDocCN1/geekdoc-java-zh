  trans: '

    感谢你读完《Java：初学者编程代码指南》，希望这本书能为你提供有用的见解，并为你提供实现目标（无论目标为何）所需的所有工具。


    下一步是按照第一章所说的下载 Java 并开始编写你的代码。Java 将会有许多不同的规则会让你感到困惑，但这不应该是令你气馁的原因。如果你在练习过程中感到困惑，你随时可以回去重读已写的内容。


    你注定会犯错，这是不可所避免的。不要担心你犯的任何错误，当收到错误代码时，你可以删除它们并重新开始。对你的编程能力要有耐心，因为它们在第一次尝试是不可能完美的。要成为
    Java 或你在此过程中决定学习的任何其他语言的专家，你需要一些时间。


    再次感谢，并祝你好运！


    ![Charlie Masterson](img/ata_image.jpg)


    # 关于作者


    Charlie Masterson 是一位计算机程序员和导师，开发过多个应用程序和计算机程序。作为一名计算机科学专业的学生，他很早就对编程产生了兴趣，但对学习这些极其复杂的课题感到过挫败。Charlie
    想要一种能够让他轻松学习并提高编程技能的教学方法。很快，他发现了一系列让他学得更快、更好的教学课程。通过同样的方法，Charlie 成功学习了不同的编程语言，现在正通过写书教授这些知识。通过他编写的计算机编程书籍，他希望提供巨大的价值，并帮助对学习计算机相关感兴趣的读者。

    '
