    - 不允许使用关键字作为变量名。Java 中有几个关键字，NetBeans 会在你的编码中将这些词变为蓝色。\n\n当你想要存储一个名为 `last_amount`\
    \ 的变量时，在你放入想要存储的值之前将输入一个等号。\n\n```java\npublic static void main(String[] args)\
    \ {\n    int last_amount;\n    last_amount = 10;\n    System.out.println (\"My\
