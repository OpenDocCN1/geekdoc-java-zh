    \ line if that is how you prefer your code to look.\n\n### Code\n\n```java\nint[\
    \ ] aryNums = new int[ 6 ] ;\n```\n\nJava is going to know that you are using\
    \ an array that has six positions in it and that the data type is integers. Therefore,\
    \ the default values are going to be zero to six.\n\nWhen you want to assign the\
    \ values to a various amount of positions, you are going to do it like normal.\n\
    \n### Code\n\n```java\naryNum[ 0 ] = 10 ;\n```\n\nThe value of ten will be assigned\
    \ to the zero in the array.\n\nRemember that the array is always going to start\
