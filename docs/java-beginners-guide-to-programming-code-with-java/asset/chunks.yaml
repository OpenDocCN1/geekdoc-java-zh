  trans: "\nJava 将被告知循环的起始数值。这里也是值从 0 赋值给变量 `loopVal` 的地方。第二部分是条件逻辑：\n\n`loopVal <\
    \ last_value`\n\n`loopVal` 的值将比 `last_value` 的值小。“for”循环将一直持续，直到值小于变量结束的值。只要该值保持真（true），Java\
    \ 就会继续循环执行大括号之间的代码。\n\n循环的最后部分 `loopVal++` 表示值每次增加 1。\n\n## While 循环\n\n与 `for`\
    \ 循环相比，`while` 循环更更容易理解。`while` 循环的语法如下：\n\n```\nwhile ( condition) {\n\n}\n```\n\
    \n`while` 单词将是小写，你的条件将放在括号之间。大括号内将包含代码\n\n### 代码\n\n```java\nint loopVal = 0;\n\
    \nwhile (loopVal < 5) {\n\n    System.out.println (“Printing some text”);\n  \
    \  loopVal++;\n}\n```\n\n括号中的条件将正常运行，大括号中的代码是必须打印出来的代码。循环将一直进行，因为没有任何值为 0。\n\n\
    计数器 `loopVal` 将达到条件的终点。当你不需要计数而是在检查某个值时，`while` 循环非常好。对于代码来说，当键盘上没有按下键时，它可以保持循环。但字母\
    \ `x` 将退出循环。\n\n## Do while\n\n––––––––\n\n![image](img/scene_break.png)\n\n`do\
    \ while` 循环就像 `while` 循环，但它看起来不同。\n\n```java\nint loopVal = 0;\n\ndo {\n    System.out.println(\
    \ “Printing some text”) ;\n    loopVal++;\n}\n\nwhile ( loopVal < 5 ) ;\n```\n\
    \n循环将一直持续直到满足条件。这两个循环最大的区别在于你放在括号中的代码。`do while` 循环的代码至少会被检查一次，而 `while` 循环会一直执行直到条件满足。\n\
    \nJava 将跳出循环且不执行括号内的代码。当你想要测试此功能时，你需要先使用 `while` 循环。在代码运行之前，必须更改 `loopVal` 变量的值。文本将不会被打印。\n\
