    Lists for Arrays


    It is hard to tell the exact amount of items that are going to be inside of an
    array, so it is going to be easier for you to use an ArrayList. The ArrayList
    is a data structure that is going to be dynamic. Therefore, your items can be
    added and removed. Normal arrays have data that is static since you are not going
    to be able to change the original size of the array that you have created.


    When you are setting up ArrayList, you are going to have to make sure that you
    pull the package from the library with the following syntax.


    import java.util.ArrayList;


    Once it has been imported, you are going to be able to create new objects on the
    list with this syntax:


    ArrayList listTest = new ArrayList( );


    You are not going to need to have square brackets when you are using an Array
    List.


    Code


    listTest.add( "first item" );


    listTest.add( "second item" );


    listTest.add( "third item" );


    listTest.add( 7 );


    What falls in the middle of the parentheses is going to be added to the list.
    You are only going to be able to add objects. The first three items on this list
    is going to be added as objects of a string. The last item is an amount because
    of the amount object for the integer.


    The items that you put on your list are going to be referenced by their index
    amounts.


    Code


    listTest.get( 3 );


    This means that the line is going to get its item at index three. The index amounts
    are still going to start at zero. Therefore, this is going to be your fourth item.


    Items can also be removed from your list with their index amounts.


    Code


    listTest.remove(2);


    the value that is assigned in the list may also be used


    Code


    listTest.remove( "second item" );


    Whenever an item is removed, the list is going to be resized, this means that
    you are going to need to be careful before you try and get an item from your list
    with the use of its index amount. If you remove the second object, then the list
    is going to contain three items once that item is gone.


    When you want to go through each item on the list so that you design an iterator,
    this is another section that you are going to be able to locate in the java.util
    library.


    import java.util.Iterator;


    From here, the developer is going to be able to attach the ArrayList to the new
    Iterator object:


    Iterator it = listTest.iterator( );


    After the iterator has been set up, it is going to be used when items have to
    be gone through on the list which is called a listTest. The explanation for why
