    \n## 第 2 章：变量\n\n大多数程序通过处理存放在程序内存中的数据来工作。这些数据将是对象、数值、文本以及内存区域中的任何其他指针。当你给数据命名时，你可以在需要时对其重命名，但该名称和值被视为变量。\n\
