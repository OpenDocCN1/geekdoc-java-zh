    \ loop but it looks different.\n\n```java\nint loopVal = 0;\n\ndo {\n    System.out.println(\
    \ “Printing some text”) ;\n    loopVal++;\n}\n\nwhile ( loopVal < 5 ) ;\n```\n\
    \nThe loop is going to continue up until the condition has been met. The biggest\
