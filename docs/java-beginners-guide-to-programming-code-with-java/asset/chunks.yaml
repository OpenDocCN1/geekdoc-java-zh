    # Chapter 3:


    ![image](d2d_images/chapter_title_below.png)


    Control Flow for Java


    Any programming that you have done before this point is going to be known as sequential
    programming which basically means that the code you have entered was read from
    top to bottom, every line being read the way that it is written. However, not
    all programs are going to work like that.


    Some code has to be run but only in the event that a condition has been met. For
    code, you may want your client to be of a certain age. This is going to be where
    you will control the flow of how the program operates through conditional logic.


    Conditional statements are going to use the word if mostly, but there are other
    words that can be used to create conditional statements.


    If statement


    The code is going to be executed whenever something happens instead of waiting
    for something else, which is going to be most common when it comes to programming,
    therefore the if statement was created.


    An if statement is going to look like this:


    if ( statement ) {


    }


    The word if is going to be lowercased before your condition is paced in a set
    of brackets. The curly brackets are going to be used to divide the chunks of code.
    This code is going to be executed only in the case that the condition has been
    met.


    Code


    if( client < 18) {


    }


    This condition states that if the client is less than 18\. Instead of typing it
    all out, a shorthand method is going to be used so that the chunk of code is shorter
    and easier to read.


    Code


    if( client < 18) {


    // display message


    }


    Therefore, should the client be over 18, the code set in the two sets of curly
    brackets is going to be jumped over while Java proceeds how it is supposed to.
    Anything that is in the middle of the curly brackets will be carried out only
    if the condition has been met.


    Another shorthand notion is going to be to point the triangle to the right which
    means greater than.


    Code


    if( client > 18) {


    //display message


    }


    The code is the exact same except that the condition is going to apply to those
    who are over 18.


    If ... else


    Instead of an if statement being used, an if else statement can be used.


    if( condition_to_test) {


    }


    else {


    }


    The first line will still start with if while being followed by the condition.
    The curly brackets are going to divide different parts of the code. The second
    choice is going to go after the else with its own curly brackets.


    There are only two choices that you are going to have, either your client is going
    to be younger than 18 or older than 18\. Your code will have to match what you
    want to happen.


    If ... else if


    More than two conditions can be tested at once. If you want to test a certain
    range of ages, you are going to use an if else if statement. The syntax is going
    to be:


    if(condition_one) {


    }


    else if ( condition_ two ) {


    }


    else {


    }


    The newest part of the code is going to be the else if ( condition_two) {


    }


    When the if statement is sent, the next is going to be followed by round brackets.
    The second condition is going to be in between two new brackets but it is not
    going to be caught by the first condition. The code is still going to be sectioned
    off with curly brackets with every if else if statement that you have each having
    its own curly brackets. If you miss one then you are going to get an error message.


    The conditional operators that you need to use are


    Greater than (>)


    Less than (<)


    Greater than or equal to (>=)


    Less than or equal to ( <=)


    AND (&&)


    OR ( ||)


    Equal ( ==)


    NOT (!)


    The two ampersand symbols are going to be used to test for more than one condition
    at the same time.


    Code


    else if ( client > 18 && client < 40)'
