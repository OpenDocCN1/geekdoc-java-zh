  \ Ken Coleman Show》前电台主持人\n\n> “Payne 博士指引我们走上了通往梦想工作的道路！通过《教你的孩子编程》，他为各地的父母和老师提供了机会，让下一代创意问题解决者也能同样成功。”\n\
  \n> —Shah and Susan Rahman，Riot Games\n\n> “Bryson 帮助人们利用技术改善生活。他的书也是如此。”\n\n> —Ash\
  \ Mady，RedHat, Inc. 技术经理\n\n> “对父母和孩子来说都有趣且易上手。”\n\n> —Steve McLeod，北乔治亚州大学副首席信息官\n\
  \n> “Payne 博士用机器人、游戏和有趣的程序在大学期间激励了我而而教你的孩子编程》将这种对编写酷炫应用的热情延伸到了校园之外。”\n\n> —Bobby\
  \ Brown，GetUWired 首席开发人员\n\n# 关于作者\n\nBryson Payne 博士是北乔治亚州大学的计算机科学终身教授，在那里教授了有志的程序员超过\
  \ 15 年。他的学生在暴雪娱乐、Riot Games、Equifax、CareerBuilder 等公司拥有了成功的职业。他是 UNG 计算机科学系的第一位系主任，拥有乔治亚州立大学的计算机科学博士学位。此外，他还广泛与\
  \ K–12 学校合作以推广技术教育。\n\nPayne 博士编写程序已超过 30 年。他卖出的第一个程序是 1985 年卖给 `RUN` 杂志（Commodore\
  \ 64）的“Magic”专栏，售价为 10 美元。\n\nPayne 博士住在乔治亚州亚特兰大北部，与妻子 Bev 和两个儿子 Alex 和 Max。\n\n\
  # 关于插画师\n\nMiran Lipovača、《Learn You a Haskell for Great Good!》的作者。他喜欢拳击、弹贝斯吉他，当然还有绘画。他对跳舞的骨骼和数字\
  \ 71 非常着迷，当他走过自动门时，会假装自己是用意念打开门的。\n\n# 关于技术评审员\n\nAri Lacenski 是一位 Android 应用程序和\
  \ Python 软件开发者。她住在旧金山。她在 `http://gradlewhy.ghost.io/` 上编写 Android 编程，在 Women Who\
  \ Code 担任导师，并用吉他弹关于太空海盗歌曲。\n\n\n\n感谢 Michelle Friend 和 Ari Lacenski 细致且详尽的技术评审，感谢\
  \ Conor Seng 成为第一个阅读这本书并尝试程序的人——当时他才 10 岁。\n\n感谢 Miran Lipovača 奇妙的插画——它们为文字注入了我梦寐以求的生命力。\n\
  \n感谢我的岳父 Norman Petty，一位退休的 IBM 员工，他通过这本书的早期草开始自学 Python。\n\n感谢我的妻子兼好朋友 Bev 的一直支持，以及我可爱的儿子\
  \ Alex 和 Max 测试了每一个程序。这本书和我的生活因为你们而变得无限美好。\n\n最后，感谢我的妈妈 Esta，她鼓励我热爱学习和解决问题。\n\n\
  # 引言：什么是编程以及它为什么对孩子有好处？\n\n计算机编程或 `coding` 是一项每个孩子都应该学习的关键技能。我们使用计算机来解决问题、玩游戏、更高效工作、执行重复任务、存储和检索信息、创造新事物并与朋友和世界联系。理解如何编程让这些力量触手可及。\n\
  \n每个人都可以学习编程；这就像解决谜题一样。你运用逻辑，尝试解决方案，进行实验，然后解决问题。学习编程的时间就是`现在`！我们处于一个前所未有的时代：以前从未有过数百万的人每天这样通过计算机相互联系。我们生活在一个充满新可能的世界，从电动汽车、机器人护理到交付包裹甚至披萨的无人机。\n\
  \n如果你的孩子从现在开始编程，他们就能帮助定义这个快速变化的世界。\n\n# 为什么孩子应该学习编程？\n\n学习计算机编程有很多很好的理由，但这里有最重要的两个：\n\
  \n*   编程很有趣。\n*   编程是一项宝贵的职业技能。\n\n## 编程很有趣\n\n对于父母和孩子来说，技术都变得是日常生活的一部分。每家公司、慈善机构和事业都能从技术中受益。应用程序可以帮助购买、捐赠、加入、玩、志愿者、联系、分享——几乎是你想象的一切。\n\
  \n你的孩子是否想过为喜欢的视频游戏构建自己的关卡？程序员就是这样做的！什么是创建自己的手机应用程序？他们可以通过编程让想法变为现实！当孩子们编程时，他们在这个技术过程中扮演了主动角色——他们不仅仅是在*享受*乐趣，他们是在*创造*乐趣。\n\
  \n\n\n\n\n编码是 21 世纪的技能。如今的工作比以往任何时候都要求解决问题的能力，而且越来越多的职业将技术视为一项不可或缺的要求。\n\n美国劳工统计局预测，在未来五年内将创造超过\
  \ 800 万个技术岗位。在 2014–2015 年《职业展望手册》中，增长最快的十大职业中，不需要硕士或博士学位的职业有七个属于计算机科学或信息技术（IT）领域。\n\
  \n马克·扎克伯格（Mark Zuckerberg）在 2004 年开发 Facebook 的第一版本时，他还是一个在宿舍里工作的大学生。仅仅 10 年后，每月就有\
  \ 13.9 亿人使用 Facebook（来源：[`newsroom.fb.com/company-info/`](http://newsroom.fb.com/company-info/)）。在历史上从未有任何一个想法、产品或服务能在十年内吸引十亿人参与。Facebook\
  \ 展示了技术比任何时候都更快、更触及更多人的力量。\n\n# 孩子们可以在哪里学习编码？\n\n这本书只是开始。学习编程的地方比以往任何时候都多；像`Code.org`、`Codecademy`（查看图\
  \ 1）以及无数其他网站都在用各种热门编程语言教授从基础到高级的编程。当你和孩子一起完成这本书后，你的孩子可以通过`EdX`、`Udacity`和`Coursera`等网站的免费课程来进一步扩展他们的学习。\n\
  \n![Codecademy 用多种语言逐步教你如何编程。](img/httpatomoreillycomsourcenostarchimages2188673.png.jpg)\n\
  \n图 1. Codecademy 用多种语言逐步教你如何编程。\n\n“编码俱乐部”（Coding clubs）是和朋友一起边玩边学学习的好方法。在相关领域获得大学学位仍然是为职业准备的最佳方式之一，但即使目前无法上大学，你的孩子现在就可以开始建立编程作品集，并展示他们作为程序员和问题解决者的技能。\n\
  \n## 如何使用这本书\n\n这本书不仅仅是给孩子看的——它适用于家长、老师、学生以及想要理解计算机编程基础的成年人，既是为了乐趣，也是为了获得高科技经济中的新工作。无论你的年龄大小，你都可以愉快地学习编程基础。实现此点的最好方法是实验和合作。\n\
  \n## 探索！\n\n如果你愿意尝试新事物，学习编程是非常令人兴奋的。当你和孩子跟随书中的程序时，尝试更改代码中的数字和文本，看看程序发生了什么变化。即使你弄坏了它，你也会在修复过程中学习到新东西。在最坏的情况下，你只需要重新输入书中的示例，或者打开最后保存的可用版本。学习编码的意义在于尝试新事物、学习新技能并用新的方式解决问题。确保你的孩子们在玩——通过更改某些内容来测试他们的代码、保存程序、运行程序、观察结果并修复任何错误。\n\
  \n学习编码的意义在于尝试新事物、学习新技能并用新的方式解决问题。通过更改内容、保存程序、运行程序、观察结果并在时修复错误来测试你的代码。\n\n例如，我写了一些代码来画一张彩色的画（图\
  \ 2），然后回去，更改了这里和那里的一些数字，并尝试再次运行程序。这给了我另一幅完全不同但同样惊人的画。我再次回去，更改了其他数字，又得到了另一个美丽、独特的画。看看你仅仅通过玩耍能做些什么？\n\
  \n![我通过尝试程序中一行代码中的不同值创建的三个彩色螺旋画](img/httpatomoreillycomsourcenostarchimages2188677.png.jpg)\n\
  \n图 2. 我通过尝试程序中一行代码中的不同值创建的三个彩色螺旋画\n\n## 一起动手！\n\n对代码进行实验是学习程序如何运作的好方法，如果你和其他人一起会更有效。无论你是在教孩子或学生，还是为了自己学习，一起玩代码不仅更有趣，而且更有效。\n\
  \n例如，在铃尔木音乐教学法中，家长会和孩子一起上课，甚至提前学习，以便在课程之间帮助孩子。早开始是铃尔木教学法的另一个特点；孩子们可以在三岁或四岁时开始正式学习。\n\
  \n我两个儿子两岁和四岁时开始向他们介绍编程，我鼓励他们通过改变每个程序中的小部分（如颜色、形状和大小）来获得乐趣。\n\n我在 13 岁时通过输入书籍中的程序示例来学习编程，然后修改它们让它们实现新功能。现在，在我教的计算机科学课程中，我经常给学生一个程序，并鼓励他们玩代码以构建新东西。\n\
  \n如果你正在用这本书自学，你可以通过找一个朋友一起完成示例，或者建立一个课后或社区编码俱乐部来合作（想法和技巧请参见 [`coderdojo.com/`](http://coderdojo.com/)\
  \ 或 [`www.codecademy.com/afterschool/`](http://www.codecademy.com/afterschool/)）。编码是一项团队运动！\n\
  \n## 在线资源\n\n这本书所有的程序文件都可以在 [`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)\
  \ 获取，还有编程挑战的示例解决方案和其他信息。下载程序并进行实验以学习更多。如果你遇到困难，请使用示例解决方案。去看看吧！\n\n![一张没有说明的图像](img/httpatomoreillycomsourcenostarchimages2188682.png.jpg)\n\
  \n# 编码 = 解决问题\n\n无论你的孩子是 2 岁学习数数，还是 22 岁寻找新挑战，这本书以及它引入的概念都是通往富有回报、激发激性的爱好和更好职业机会的绝佳途径。能够编程的人——因此能够快速有效地解决问题的人——在当今世界受到备受重视，他们可以从事有趣且充实的工作。\n\
  \n世界上并不是所有问题都能仅通过技术解决，但技术可以以前无法想象的规模和速度实现通信、协作、意识和行动。如果你会编码，就能解决问题。问题解决者有让世界变得更好的力量，所以从今天开始编码吧。\n\
  \n# 第 1 章 Python 基础：了解你的环境\n\n几乎任何东西里都可能包含电脑——手机、汽车、手表、视频游戏机、健身设备、医疗设备、工业设备、问候卡或机器人。计算机编程或编码，是我们告诉计算机执行任务的方式，而理解如何编码将计算机的力量掌握在你的手中。\n\
  \n计算机程序——也称为应用程序或应用——告诉计算机做什么。网页应用可以告诉计算机如何跟踪你喜爱的音乐；游戏应用可以告诉计算机如何显示具有真实图形效果的史诗级战场；简单的应用可以告诉计算机画出一个像图\
  \ 1-1 中六边形美丽的螺旋。\n\n![彩色螺旋图形](img/httpatomoreillycomsourcenostarchimages2188686.png.jpg)\n\
  \n图 1-1. 彩色螺旋图形\n\n\n\n\n\n有些应用程序由数千万行代码组成，而另一些可能只有几行，例如图 1-2 中的 `NiceHexSpiral.py`\
  \ 程序。\n\n![NiceHexSpiral.py, 一个绘制图 1-1 中螺旋线的短 Python 程序](img/httpatomoreillycomsourcenostarchimages2188690.png.jpg)\n\
  \n图 1-2. `NiceHexSpiral.py`，一个绘制图 1-1 中螺旋线的简短 Python 程序。\n\n这个简短程序绘制了图 1-1 中所示的彩色螺旋。我想要一张漂亮的图片作为书中的示例，因此我决定用计算机程序来解决这个问题。首先，我构思了一个主意，然后开始编码。\n\
  \n在本章中，我们将下载、安装并学习使用这些程序，它们将帮助我们编写代码构建你可以想象的任何应用程序。\n\n## Python 入门\n\n要开始编码，我们必须学会计算机的语言。计算机需要逐步执行的指令，而且它们只能理解某些语言。就像一个俄罗斯人可能无法听懂英语一样，计算机只理解为它们编写的语言。计算机代码是用\
  \ Python、C++、Ruby 或 JavaScript 等编程语言编写的。这些语言允许我们与计算机“对话”并向它下命令。想想你教狗学会技巧——当你给出“坐下”（sit）命令时，它就坐下了；当你说“说话”（speak）时，它就会叫。狗能理解这些简单的指令，但听不懂你说的其他大部分话。\n\
  \n![没有说明的图像](img/httpatomoreillycomsourcenostarchimages2188694.png.jpg)\n\n同样，计算机也有自己的局限性，但只要用它们的语言，就能执行你要求的任何事情。我们在书中使用的语言是\
  \ `Python`，它是一种简单而强大的编程语言。Python 在高中和大学的入门计算机科学课程中教授，并被用于运行世界上最强大的应用程序，包括 Gmail、Google\
  \ Maps 和 YouTube。\n\n为了让你在计算机上开始使用 Python，我们将一起完成以下三个步骤：\n\n1. 下载 Python。\n2. 在你的计算机上安装\
  \ Python。\n3. 使用一两个简单的程序测试 Python。\n\n![没有说明的图像](img/httpatomoreillycomsourcenostarchimages2188698.png.jpg)\n\
  \n### 1. 下载 Python\n\nPython 是免费的，可以从 Python 网站轻松获得，如所示图 1-3\n\n![下载 Python 变得简单。](img/httpatomoreillycomsourcenostarchimages2188700.png.jpg)\n\
  \n图 1-3. Python 网站让下载 Python 变得简单。\n\n在浏览器中，访问 `https://www.python.org/`。将鼠标悬停在顶部\
  \ `Downloads` 菜单按钮上，点击以 `Python 3` 开头的按钮。\n\n### 2. 安装 Python\n\n找到你刚刚下载的文件（可能在你的\
  \ `Downloads` 文件夹中），双击它以运行并安装 Python 以及 IDLE 编辑器。IDLE 是我们将用于输入和运行 Python 程序的程序。详细的安装说明请参阅附录\
  \ A。\n\n### 3. 用程序测试 Python\n\n在你的开始菜单或 `Applications` 文件夹中，找到 IDLE 程序并运行它。你将看到一个基于文本的命令窗口，如所示图\
  \ 1-4。这被称为 Python shell（外）。`shell` (#apd.html_gloss01_044) 是允许用户输入命令或代码行的窗口或屏幕。\n\
  \n![IDLE Python shell——我们学习 Python 的命令行中心](img/httpatomoreillycomsourcenostarchimages2188705.png.jpg)\n\
  \n图 1-4. IDLE Python shell——我们学习 Python 的命令行中心\n\n`>>>` 被称为提示符（prompt），它意味着计算机已准备好接受你的第一条命令。计算机正在要求告诉它做什么。输入\n\
  \n```\nprint(\"Hello, world!\")\n```\n\n然后按下键盘上的 ENTER 或 RETURN 键。你应该看到 Python shell\
  \ 响应，打印出你在括号内输入的引号中的文本：`Hello, world!`。大功告成——你写了第一个程序！\n\n## 在 Python 中编写程序\n\n\
  你通常想编写比单行更长的程序，因此 Python 自带了一个编辑器（editor）来编写较长的程序。在 IDLE 中，进入 `File` (#apd.html_gloss01_020）菜单并选择\
  \ `File`▸`New Window`（新建窗口）或 `File`▸`New File`（新建文件）。弹出一个空白窗口，顶部显示 `Untitled`（无标题）。\n\
  \n用 Python 写一个稍微长一点的程序。在新的空白窗口中输入以下三行代码：\n\n```\n### YourName.py\nname = input(\"\
  What is your name?\\n\")\nprint(\"Hi, \", name)\n```\n\n第一行被称为注释（comment）。注释以井号（`#`）开头，是计算机忽略的编程笔记或提醒。在这个例子中，注释只是提醒我们程序名称的备注。第二行要求用户输入他们的姓名并将其记录为\
  \ `name`。第三行打印 `\"Hi, \"`，后面跟着用户的姓名。注意，有一个逗号（``,`）将引号中的文本 `\"Hi, \"` 与姓名隔开。\n\n\
  ## 在 Python 中运行程序\n\n转到程序上方菜单上的 `Run` 选项并选择 `Run`▸`Run Module`（运行模块）。这将运行（run，即执行）你程序中的指令。它会要求你保存程序。我们将文件命名为\
  \ `YourName.py`。`.py` 部分意味着这是一个 Python 程序。\n\n![没有说明的图像](img/httpatomoreillycomsourcenostarchimages2188709.png.jpg)\n\
  \n当你保存并运行文件时，你会看到 shell 窗口启动程序并显示 `What is your name?`。在下一行输入你的名字并按回。程序将打印 `Hi,`\
  \ 然后是你输入的名称。由于这是你要求程序执行的所有，程序将结束，你将再次看到 `>>>` 提示符，如所示图 1-5\n\n![我知道我的名字！](img/httpatomoreillycomsourcenostarchimages2188712.png.jpg)\n\
  \n图 1-5. 我知道我的名字！\n\n对于年学者，比如我三岁的儿子，解释程序正在要求他们输入名字很有趣。Max 知道他名字里的字母，所以他在键盘上输入 *m*-*a*-*x*，当我告诉他程序回回了\
  \ `Hi, max` 时，他非常开心。问你的年学习者是否想让程序说不同的内容。Max 说“Hello”，所以我修改了早期程序的第三行，用 `Hello,` 替换了\
  \ `Hi,`。\n\n然后我将第三行改为：\n\n```\nprint(\"Hello, \", name, name, name, name, name)\n\
  ```\n\n当程序回复为 `Hello, max max max max max` 时，Max 非常喜欢。尝试实验程序的第二和第三行，让计算机问不同的问题并打印不同的答案。\n\
  \n## 你学到了什么\n\n学习编程就像解决谜题、谜语或脑筋急转。你从一个问题开始，运用你所知的知识，并在过程中学习新事物。当你结束时，你已经锻炼了大脑，并回答了一个问题。希望你也过得很快。\n\
  \n在本章中，我们解决了第一个重大问题：我们在计算机上安装了 Python 编程语言，以便开始编码。这就像下载文件、安装和运行一样简单。\n\n\n\n\n在接下来的章节中，你将学习如何使用代码来解决问题。你将从简单的视觉谜题开始，比如在电脑屏幕（或平板电脑或手机）上画形状，然后发现如何创建简单的游戏，如猜数字、石头剪刀布和乒乓球游戏。\n\
  \n通过在这些早期程序中建立的基础，你可以继续编写游戏、移动应用程序、Web 应用程序等。\n\n到此为止，你应该 . . . \n\n*   拥有一个功能完整的\
  \ Python 编程环境和文本编辑器。\n*   能够直接在 Python shell 中输入编程命令。\n*   能够在 IDLE 中编写、保存、运行和修改短程序。\n\
  *   准备好在第 2 章 中尝试更高级、有趣的程序。\n\n### 编程挑战\n\n在每个章节的结束，你可以通过尝试几个挑战来练习所学的内容——并做出更酷的程序！（如果你卡住了，请访问\
  \ `http://www.nostarch.com/teachkids/` 查看示例答案。）\n\n#### #1: 填空游戏 (MAD LIBS)\n\n\
  简单的 `YourName.py` 程序包含了我们构建更有趣程序所需的全部必要组件，就像老式的 Mad Libs 文字游戏（如果你从未尝试过，请访问 `http://www.madlibs.com/`）。\n\
  \n让我们修改程序 `YourName.py` 并将其保存为 `MadLib.py`。我们不再询问用户的姓名，而是询问一个形容词、一个名词和一个过去式动词，并将它们存储在三个不同的变量中，就就像我们在原始程序中对\
  \ `name` 执行的那样。然后，我们将打印出像“那个*形容词 名词 动词* 跳过了那只懒惰的棕色狗”这样的句子。以下是修改后的代码。\n\n***MadLib.py***\n\
  \n```\nadjective = input(\"Please enter an adjective: \")\nnoun = input(\"Please\
  \ enter a noun: \")\nverb = input(\"Please enter a verb ending in -ed: \")\nprint(\"\
  Your MadLib:\")\nprint(\"The\", adjective, noun, verb, \"over the lazy brown dog.\"\
  )\n```\n\n你可以输入任何你想要的形容词、名词和动词。当你保存并运行 `MadLib.py` 时，你会看到以下内容（我输入了 `smart`、`teacher`\
  \ 和 `sneezed`）：\n\n```\n>>>\nPlease enter an adjective: smart\nPlease enter a noun:\
  \ teacher\nPlease enter a verb ending in -ed: sneezed\nYour MadLib:\nThe smart teacher\
  \ sneezed over the lazy brown dog.\n>>>\n```\n\n#### #2: 更多填空游戏！\n\n让我们我们的填空游戏变得更有趣一点。通过将\
  \ `MadLib.py` 保存为 `MadLib2.py` 来开启新版本。添加另一个输入行询问动物类型。然后，修改 `print` 语句，删除单词 `dog`\
  \ 并在引号句子末尾添加新的 `animal` 变量（在 `print` 语句内部的新变量之前添加一个逗号）。如果你愿意，还可以进一步修改句子。你可能会得到“那个有趣的黑板打了那只懒惰的棕色蜥蜴——或者更有趣的内容！\n\
  \n# 第 2 章 龟图图形：使用 Python 绘画\n\n在本章中，我们将编写短小程序来创建美且复杂的视觉效果。为了实现这一点，我们将使用*龟图图形 (turtle\
  \ graphics)*。在龟图图形中，你编写指令让一只虚拟的或想象中的乌龟在屏幕上移动。乌龟带着一只笔，你可以指令乌龟用它的笔在它经过任何地方画线。通过编写代码让乌龟以酷炫的图案移动，你可以让它画出惊人的图片。\n\
  \n使用龟图图形，你不仅可以用几行代码创建出令人印象深刻的视觉效果，还可以跟随乌龟移动，观察每行代码如何影响它的运动。这有助于帮助你理解代码的*逻辑*。\n\n\
  ## 我们的第一个龟图程序\n\n让我们使用龟图图形编写我们的第一个程序。在 IDLE 的新窗口中输入以下代码并将其保存为 `SquareSpiral1.py`。（你也可以在\
  \ `http://www.nostarch.com/teachkids/` 下载此程序以及书中的其他程序。）\n\n### SquareSpiral1.py\n\
  \n```\n### SquareSpiral1.py - 画一个正方形螺旋\nimport turtle\nt = turtle.Pen()\nfor x in\
  \ range(100):\n    t.forward(x)\n    t.left(90)\n```\n\n当我们运行这段代码时，得到了一张非常整洁的图片（图\
  \ 2-1）。\n\n![一个由短程序 SquareSpiral1.py 创建的催眠正方形螺旋](img/httpatomoreillycomsourcenostarchimages2188716.png.jpg)\n\
  \n图 2-1. 一个由短程序 SquareSpiral1.py 创建的催眠正方形螺旋\n\n## 它是如何工作的\n\n让我们逐行分解程序，看看它是如何工作的。\n\
  \n`SquareSpiral1.py` 的第一行是一个注释。正如你在第 1 章 中学到的，注释以井号（##）开头。计算机不会读取井号后的任何内容；注释只是给我们看的。\n\
  \n第二行 `import turtle` 允许程序使用龟图图形。导入已经写代码是 Python 最酷的功能之一。当你输入 `import turtle` 时，你是在说你想让程序使用它。图\
  \ 2-1 中的小黑箭头代表乌龟，用它的笔画画。\n\n![无标题图像](img/httpatomoreillycomsourcenostarchimages21870.png.jpg)\n\
  \n我们程序的第三行 `t = turtle.Pen()` 告诉计算机我们将用字母 `t` 代表乌龟的笔。这允许我们在输入 `t` 时在乌龟移动时使用它的笔画画。字母\
  \ `t` 是我们告诉乌龟做什么的快捷方式。\n\n第四行是最复杂的。在这里我们创建了一个循环，重复一组指令。这个特定的循环设置了一个包含 100 个数字的`range`或列表。（计算机几乎总是从\
  \ 0 开始计数，而不是像我们那样从 1 开始。）循环让字母 `x` 遍历该范围内的每个数字。因此 `x` 从 0 开始，然后变为 1，然后是 2，以此此类推一直计数到\
  \ 99，总共 100 步。\n\n这个 `x` 被称为变量。变量存储随我们程序运行而改变的值。在第 1 章的 `YourName.py` 程序中，`name`\
  \ 是一个变量。我们在编写的几乎每个程序中都会变量，所以尽早了解它们是好的。\n\n接下来的两行缩进了（即从左侧留空）。这意味着它们在循环中并与上面的行一起，因此每当\
  \ `x` 获取 0 到 99 范围内的新数字时，它们就会重复 100 次。\n\n\n\n\n让我们看看 Python 第一次读取这组指令时会发生什么。`t.forward(x)`\
  \ 命令告诉画笔在屏幕上向前移动 `x` 个点。由于 `x` 是 0，所以画笔完全没有移动。最后一行 `t.left(90)` 告诉乌龟左转 90 度，或者说四之分之一圈。\n\
  \n由于这个 `for` 循环，程序继续运行，并回到循环的起始位置。计算机将 `x` 加 1，使其移动到 `range` 中的下一个值，由于 1 仍然在 0 到\
  \ 99 的范围内，循环继续进行。现在 `x` 是 1，所以画笔向前移动 1 个点。然后，由于 `t.left(90)`，画笔再次向左转 90 度。这种过程周而复始。。当\
  \ `x` 达到 99（即循环的最后一次）时，画笔正在绘制正方形螺旋外围最长的线段。\n\n![image with no caption](img/httpatomoreillycomsourcenostarchimages2188724.png.jpg)\n\
  \n下面是 `x` 从 0 增长到 100 时循环的逐步视觉图：\n\n```\nfor x in range(100):\n    t.forward(x)\n\
  \    t.left(90)\n```\n\n| ![](img/httpatomoreillycomsourcenostarchimages2188728.png.jpg)\
  \ | 循环 0 到 4：绘制了前四条线（在 x = 4 之后）。 |\n\n| ![](img/httpatomoreillycomsourcenostarchimages2188732.png.jpg)\
  \ | 循环 5 到 8：又绘制了四条线；我们的正方形显现了。 |\n\n| ![](img/httpatomoreillycomsourcenostarchimages2188736.png.jpg)\
  \ | 循环 9 到 12：我们的正方形螺旋增长到了 12 条线（三个正方形）。 |\n\n你电脑屏幕上的点（或 `pixels`）可能太小了，你无法看清。但是，随着\
  \ `x` 接近 100，乌龟绘制的线条包含的像素越来越多。换句话说，随着 `x` 变大，`t.forward(x)` 绘制的线条变得越来越长。\n\n屏幕上的乌龟箭头画了一会儿，然后向左转，再画一段，向左转，然后又画，每次的线条都比上一次长。\n\
  \n最后，我们得到了一个迷人的正方形。向左转 90 度四次就得到了正方形，就像绕着建筑左转四次会带你绕过建筑回到起点一样。\n\n在这个例子中之所以有一个螺旋，是因为我们每次向左转都会走得更远一点。绘制的第一条线只有\
  \ 1 步长（当 `x` = 1 时），然后是 2 步（下次循环），然后是 3、4，以此类推，一直到 100 步，此时线条长度为 99 像素。再次，屏幕上的像素可能非常小，你可能无法轻易看清每一个点，但它们确实在那里，你可以看到随着像素的增加，线条变得越来越长。\n\
  \n通过将所有的转角设为 90 度，我们得到了完美的正方形形状。\n\n## 乌龟大行动 (Turtle on a Roll)\n\n让我们看看改变程序中的一个数字会发生什么。学习程序新知识的一种方法是观察当你改变其中某部分时会发生什么。你并不总是能得到漂亮的结果，但即使出现错误，你也可以从中学习。\n\
  \n仅将程序的最后一行改为 `t.left(91)` 并将其保存为 `SquareSpiral2.py`。\n\n### SquareSpiral2.py\n\n\
  ```\nimport turtle\nt = turtle.Pen()\nfor x in range(100):\n    t.forward(x)\n \
  \   t.left(91)\n```\n\n我提到过 90 度的左转会创建一个完美的正方形。稍微多转 90 度一点——在这种情况下是每次转弯 91 度——就会让正方形偏离一点。由于在下一次转弯时已经偏离了，随着程序的继续运行，我们的新形状看起来越来越不像正方形。事实上，它形成了一个漂亮的螺旋形状，开始像楼梯一样向左旋转，正如你在图\
  \ 2-2 中所示。\n\n![The square spiral program with one tiny change becomes a spiral\
  \ staircase.](img/httpatomoreillycomsourcenostarchimages2188740.png.jpg)\n\n图 2-2。经过微小修改的正方形螺旋程序变成了螺旋楼梯。\n\
  \n这也是一个很好的视觉示例，帮助你理解仅偏离一个数字就能剧烈改变程序的结果。1 度似乎不是什么大事，除非你偏离了 100 次度（总共 100 度），或者 1000\
  \ 次，或者你正在用程序来降落飞机……\n\n![image with no caption](img/httpatomoreillycomsourcenostarchimages2188744.png.jpg)\n\
  \n如果你还不知道角度是如何工作的，暂时不要担心。只需试着玩这些数字并看看会发生什么。\n\n## 乌龟总结 (Turtle Roundup)\n\n说到几何图形，乌龟图形可以绘制比直线多得多的形状。我们将在下一节回到正方形形状，但让我们先绕小路看看\
  \ Python 的更多功能。\n\n\n\n\n\n这些螺旋线形状很漂亮，但如果它们更丰富多彩，难道不是更酷吗？让我们回到方形螺旋代码，在 `t = turtle.Pen()`\
  \ 之后之后向程序添加一行代码，将画笔颜色设置为红色：\n\n### SquareSpiral3.py\n\n```\nimport turtle\nt = turtle.Pen()\n\
  t.pencolor(\"red\")\nfor x in range(100):\n    t.forward(x)\n    t.left(91)\n```\n\
  \n运行程序，你将看到一个更多彩的方形螺旋（图 2-4）。\n\n![方形螺旋变得更多彩了。](img/httpatomoreillycomsourcenostarchimages2188752.png.jpg)\n\
  \n图 2-4。方形螺旋变得更多彩了。\n\n尝试将 `\"red\"` 替换为其他常用颜色，如 `\"blue\"` 或 `\"green\"`，然后再次运行程序。你可以使用\
  \ Turtle 库中的数百种不同的颜色，包括一些奇怪的颜色如 `\"salmon\"` 和 `\"lemon chiffon\"`。（请访问 [`www.tcl.tk/man/tcl8.4/TkCmd/colors.htm`](http://www.tcl.tk/man/tcl8.4/TkCmd/colors.htm)\
  \ 获取完整列表。）让整个螺旋变成一种颜色是一个很好的步骤，但如果我们想让每条边都呈现不同的颜色呢？那将对我们的程序进行更多的修改。\n\n### 四色螺旋\n\
  \n让我们思考一下算法——即一组步骤——如何将我们的单色螺旋变成四色螺旋。大多数步骤与我们之前的螺旋程序相同，但增加了几个新变化：\n\n1. 导入 `turtle`\
  \ 模块并设置乌龟。\n2. 告诉计算机我们想使用哪些颜色。\n3. 设置一个循环在螺旋中绘制 100 条线。\n4. 为螺旋的每条边选择不同的画笔颜色。\n\
  5. 移动乌龟向前绘制每条边。\n6. 将乌龟左转以准备绘制下一条边。\n\n首先，我们需要一个颜色名称列表而不是单个颜色，因此我们将设置一个名为 `colors`\
  \ 的列表变量，并在列表中放入四种颜色，如下：\n\n```\ncolors = [\"red\", \"yellow\", \"blue\", \"green\"\
  ]\n```\n\n这个包含四种颜色的列表为正方形的每边提供一种颜色。注意，我们将颜色列表放在方括号 `[` 和 `]` 之中。确保每个颜色名称都在引号内，就像我们在第\
  \ 1 章 中打印的单词一样，因为这些颜色名称是字符串](#apd.html_gloss01_046)，或文本值，我们稍后会将它们传递给 `pencolor`\
  \ 函数。如所述，我们正在使用一个名为 `colors` 的变量来存储四种颜色列表，因此每当我们想从列表中获取颜色时，我们将使用 `colors` 变量来代表画笔颜色。记住，变量存储的是变化的值。这体现在它们的名字里：它们是变化的！\n\
  \n![没有标题说明的图像](img/httpatomoreillycomsourcenostarchimages2188757.png.jpg)\n\n接下来的事情是每次进入绘制循环时都更改画笔颜色。为了做到，我们需要将\
  \ `t.pencolor()` 函数移动到 `for` 循环下的指令组中。我们还需要告诉 `pencolor` 函数我们想使用列表中的一种颜色。\n\n输入以下代码并运行。\n\
  \n### ColorSquareSpiral.py\n\n```\nimport turtle\nt = turtle.Pen()\ncolors = [\"\
  red\", \"yellow\", \"blue\", \"green\"]\nfor x in range(100):\n    t.pencolor(colors[x%4])\n\
  \    t.forward(x)\n    t.left(91)\n```\n\n这个四种颜色的列表是有意义的，我们可以在运行示例中看到它们（图 2-5）。目前为止一切良好。\n\
  \n![多彩的方形螺旋程序](img/httpatomoreillycomsourcenostarchimages2188761.png.jpg)\n\n图 2-5。多彩的方形螺旋程序\n\
  \n唯一的新的新部分是 `pencolor` 函数中的 `(colors[x%4])`。语句中的 `x` 是我们在程序其他地方使用的相同变量。因此 `x` 将像我们之前看到的那样从\
  \ 0 继续增长到 99。括号内的 `colors` 变量名告诉 Python 从我们早在程序中添加的名为 `colors` 的颜色名称列表中选择一种颜色。\n\
  \n\n\n\n\n```python\nimport turtle\nt = turtle.Pen()\nturtle.bgcolor(\"black\")\n\
  colors = [\"red\", \"yellow\", \"blue\", \"green\"]\nfor x in range(100):\n    t.pencolor(colors[x%4])\n\
  \    t.circle(x)\n    t.left(91)\n```\n\n你可以在图 2-7 中看到结果。\n\n![Alex’s awesome color\
  \ circle spiral—eight lines of code, simple and elegant](img/httpatomoreillycomsourcenostarchimages2188773.png.jpg)\n\
  \n图 2-7. Alex 酷炫的彩色圆圈螺旋——八行代码，简单而优雅\n\n# 一个变量统治一切\n\n到目前为止，我们一直使用变量来改变螺旋形状的颜色、大小和旋转角度。让我们添加另一个变量\
  \ `sides`，来表示形状的边数。这个新变量将如何改变我们的螺旋？为了找到答案，请尝试这个程序 `ColorSpiral.py`。\n\n### ColorSpiral.py\n\
  \n```python\nimport turtle\nt = turtle.Pen()\nturtle.bgcolor(\"black\")\n## 你可以在\
  \ 2 到 6 边之间选择以获得酷的形状！\nsides = 6\ncolors = [\"red\", \"yellow\", \"blue\", \"orange\"\
  , \"green\", \"purple\"]\nfor x in range(360):\n    t.pencolor(colors[x%sides])\n\
  \    t.forward(x * 3/sides + x)\n    t.left(360/sides + 1)\n    t.width(x*sides/200)\n\
  ```\n\n你可以将 `sides` 的值从 6 改为 2（单条边没趣，除非你在程序第六行的列表中添加了更多颜色，否则你无法使用更大的数字）。然后根据你的需要多次保存并运行该程序。图\
