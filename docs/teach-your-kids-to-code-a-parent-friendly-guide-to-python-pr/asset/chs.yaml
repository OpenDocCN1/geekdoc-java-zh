  \npygame.quit()      # Exit\n```\n\n## 添加难度和结束游戏：Smiley Pong，2.0 版本\n\nSmiley Pong\
  \ 游戏的 1.0 版本是可玩的。玩家可以得分、失去生命，并在屏幕上看到进度。我们还缺少游戏结束机制。另一个是随着游戏进行而增加的挑战。我们将在 Smiley\
  \ Pong 1.0 版本中添加以下功能，以创建一个更完善的 2.0 版本：在失去最后一个生命时显示游戏结束、在不关闭程序的情况下重新玩或开始新游戏，以及随着游戏进行而增加难度。我们将逐一个添加这三个功能，最终获得一个有趣且具有挑战性的街机游戏！\n\
  \n## 游戏结束\n\n1.0 版本从未停止，因为我们没有添加处理游戏结束的逻辑。我们知道要测试的条件：当玩家没有剩余生命时，游戏结束。现在我们需要确定在失去最后一个生命时该做什么。\n\
  \n我们首先想做的是停止游戏。我们不想关闭程序，但确实想停止球。我们想要做的第二它是更改屏幕上的文本，告诉玩家游戏结束并给出他们的分数。我们可以通过在生命和分数的声明之后使用\
  \ `if` 语句来实现这两个任务。\n\n\n\n\n```python\nif lives < 1:\n    speedx = speedy = 0\n\
  \    draw_string = \"Game Over. Your score was: \" + str(points)\n    draw_string\
  \ += \". Press F1 to play again. \"\n```\n\n通过将 `speedx` 和 `speedy`（别代表球的水平和垂直速度）设置为\
  \ 0，我们停止了球的移动。用户仍然可以在屏幕上移动挡板，但我们已经在视觉上结束了游戏，让用户知道游戏已经结束。这段文字让这一点更加清晰，而且还告诉了用户他们这一轮的表现如何。\n\
  \n目前，我们正告诉用户按 `F1` 重新游戏，但按这个键目前还没有产生任何效果。我们需要一些逻辑来处理按键事件并重新开始游戏。\n\n## 再次游戏\n\n\
  我们希望在用户耗尽生命后让他们玩一局新游戏。我们已经在屏幕上添加了文字，告诉用户按 `F1` 键重新游戏，因此让我们添加代码来检测该按键按下并重新开始游戏。首先，我们将检查是否按了键，以及按下的键是否为\
  \ `F1`：\n\n```python\nif event.type == pygame.KEYDOWN:\n    if event.key == pygame.K_F1:\
  \ # F1 = 新游戏\n```\n\n在游戏循环内部的事件处理 `for` 循环中，我们添加了一个 `if` 语句来检查是否存在 `KEYDOWN` 事件。如果是，我们将检查该事件中的按键（`event.key`），看它是否等于\
  \ `F1` 键（`pygame.K_F1`）。紧随第二个 `if` 语句之后的代码将是我们的“再次游戏”或“新游戏”代码。\n\n### 注意\n\n你可以在\
  \ [`www.pygame.org/docs/ref/key.html`](http://www.pygame.org/docs/ref/key.html)\
  \ 获取完整的 Pygame 键码列表，例如 `K_F1`。\n\n“再次游戏”意味着我们想要从头开始开始。对于 Smiley Pong 来说，我们的初始状态是\
  \ 0 分、5 次生命，且球以每帧 5 像素的速度从屏幕的左上角 (0, 0) 向我们飞来。如果我们重置这些变量，就应该得到新游戏的效果：\n\n```python\n\
  points = 0\nlives = 5\npicx = 0\npicy = 0\nspeedx = 5\nspeedy = 5\n```\n\n将这些行添加到针对\
  \ `F1` 键 `KEYDOWN` 事件的 `if` 语句中，你就能随时重启游戏。如果你想只在游戏已经结束后才允许重启，可以包含一个额外的条件 `lives\
  \ == 0`，但我们将在 2.0 版本中保持目前的 `if` 语句不变，以便用户可以随时重启。\n\n## 越来越越快\n\n我们的游戏还缺少最后一个游戏设计元素：随着游戏时间的推移，挑战性并不会增加，因此有人可能会一直玩下去，注意力变得越来越少。让我们随着游戏的进行增加难度，以吸引玩家并让游戏更具街机感。\n\
  \n![image with no caption](img/httpatomoreillycomsourcenostarchimages2189047.png.jpg)\n\
  \n我们希望随着游戏的进行稍微增加球的速度，但不要太快，否则玩家可能会感到沮丧。我们希望在每次反弹后让游戏稍微快一点点。执行此事的自然位置是在检查碰撞的代码中。增加速度意味着让\
  \ `speedx` 和 `speedy` 更大，这样球在每一帧中每个方向移动的距离就越远。尝试我们将碰撞检测的 `if` 语句（即球从屏幕每个边缘反弹的地方）修改为：\n\
  \n```python\nif picx <= 0 or picx >= 700:\n    speedx = -speedx * 1.1\nif picy <=\
  \ 0:\n    speedy = -speedy + 1\n```\n\n在第一情况下，当球在水平方向上从屏幕左右两侧反弹时，我们通过乘以 `1.1` 来增加水平速度\
  \ `speedx`（我们仍然用负号来改变方向）。这意味着每次左右反弹后速度都增加了 10%。\n\n当球从屏幕顶部反弹时（`if picy <= 0`），我们知道当它从顶部反弹并向屏幕正\
  \ `y` 方向向下移动时，速度将变为正数，因此在我们用负号改变方向后，可以给 `speedy` 加 1。如果球以每帧 5 像素的速度 `speedy` 向顶部移动，它离开的速度将是每帧\
  \ 6 像素，然后是 7 像素，以此类推。\n\n如果你做了这些更改，你会看到球变得越来越快。但一旦球开始变快，它就永远不会慢下来。很快球运行得飞快，以至于玩家在一秒钟内失去所有的五个生命。\n\
  \n我们将每次玩家失去生命时重置速度，让游戏更具可玩性（且更公平）。如果速度快到用户无法用挡板击中球，可能是将速度重置为较慢的值的好时机，让玩家能够追上。\n\n\
  我们在屏幕底部反弹的代码是扣除玩家生命的地方，因此让我们在减去生命后改变速度：\n\n```python\nif picy >= 500:\n    lives\
  \ -= 1\n    speedy = -5\n    speedx = 5\n```\n\n\n\n\n\n```python\nimport pygame\
  \       # 设置\npygame.init()\nscreen = pygame.display.set_mode([800,600])\npygame.display.set_caption(\"\
  Smiley Pong\")\nkeepGoing = True\npic = pygame.image.load(\"CrazySmile.bmp\")\n\
  colorkey = pic.get_at((0,0))\npic.set_colorkey(colorkey)\npicx = 0\npicy = 0\nBLACK\
  \ = (0,0,0)\nWHITE = (255,255,255)\ntimer = pygame.time.Clock()\nspeedx = 5\nspeedy\
  \ = 5\npaddlew = 200\npaddleh = 25\npaddlex = 300\npaddley = 550\npicw = 100\npich\
  \ = 100\npoints = 0\nlives = 5\nfont = pygame.font.SysFont(\"Times\", 24)\n\nwhile\
  \ keepGoing:      # 游戏循环\n    for event in pygame.event.get():\n        if event.type\
  \ == pygame.QUIT:\n            keepGoing = False\n        if event.type == pygame.KEYDOWN:\n\
  \            if event.key == pygame.K_F1:     # F1 = 新游戏\n                points\
  \ = 0\n                lives = 5\n                picx = 0\n                picy\
  \ = 0\n                speedx = 5\n                speedy = 5\n    picx += speedx\n\
  \    picy += speedy\n\n    if picx <= 0 or picx >= 700:\n        speedx = -speedx\
  \ * 1.1\n    if picy <= 0:\n        speedy = -speedy + 1\n    if picy >= 500:\n\
  \        lives -= 1\n        speedy = -5\n        speedx = 5\n        picy = 499\n\
  \n    screen.fill(BLACK)\n    screen.blit(pic, (picx, picy))\n\n    # 绘制挡板\n   \
  \ paddlex = pygame.mouse.get_pos()[0]\n    paddlex -= paddlew/2\n    pygame.draw.rect(screen,\
  \ WHITE, (paddlex, paddley, paddlew, paddleh))\n\n    # 检查挡板反弹\n    if picy + pich\
  \ >= paddley and picy + pich <= paddley + paddleh \\\n       and speedy > 0:\n \
  \       if picx + picw/2 >= paddlex and picx + picw/2 <= paddlex + \\\n        \
  \   paddlew:\n            speedy = -speedy\n            points += 1\n\n    # 在屏幕上绘制文字\n\
  \    draw_string = \"Lives: \" + str(lives) + \" Points: \" + str(points)\n    #\
  \ 检查游戏是否结束\n    if lives < 1:\n        speedx = speedy = 0\n        draw_string\
  \ = \"Game Over. Your score was: \" + str(points)\n        draw_string += \". Press\
  \ F1 to play again. \"\n\n    text = font.render(draw_string, True, WHITE)\n   \
  \ text_rect = text.get_rect()\n    text_rect.centerx = screen.get_rect().centerx\n\
  \    text_rect.y = 10\n    screen.blit(text, text_rect)\n    pygame.display.update()\n\
  \    timer.tick(60)\n\npygame.quit()       # 退出\n```\n\n你可以继续在此示例的游戏元素基础上进行开发（参见编程挑战），或者你可以使用这些构建组件来开发新内容。大多数游戏，甚至其他应用程序，都具有你在本章中添加的这类功能，我们通常遵循与构建\
  \ Smiley Pong 类似的流程。首先，规划出游戏的骨架，然后构建一个可运行的*原型*，或者说 1.0 版本。一旦它运行正常，就不断添加功能，直到你你最终版本。在构建更复杂的应用程序时，你会发现*迭代版本控制——即一次添加一个功能来创建新版本——是非常有用的。\n\
  \n# 添加更多功能：SmileyPop V2.0\n\n我们将再次遵循我们的迭代版本控制流程，添加我儿子 Max 我希望在 SmileyPop 应用（第 9\
  \ 章）中看到的功能。首先，他希望每当鼠标点击破碎笑脸泡泡（或气球）时，都能有一个音效。其次，我们都希望有某种反馈和显示（可能是创建了多少泡泡以及破了多少个），而我想要一些进度迹象，比如我们破了泡泡的百分比。SmileyPop\
  \ 应用已经很有趣了，但这些元素可以让它变得更好。\n\n回顾 SmileyPop.py；我们将从这个版本的应用开始，通过添加代码来构建我们的第二个版本（v2.0，version\
  \ 2.0 的缩写）。最终版本 `SmileyPop2.py` 所示图 10-7。\n\n我们将从添加 Max 的请求开始：破碎声。\n\n## 使用 Pygame\
  \ 添加声音\n\n在 [`www.pygame.org/docs/`](http://www.pygame.org/docs/) 上，你会发现一些可以让你的游戏玩起来更有趣、编程更容易的模块、类和函数。我们需要的音效模块是\
  \ `pygame.mixer`。要使用此混合器模块为游戏添加声音，你首先需要一个声音文件。对于我们的破碎音效，请从 [`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)\
  \ 源代码和文件下下载 第 10 章 的 `pop.wav` 文件。\n\n我们将在 `SmileyPop.py` 的设置部分、`sprite_list = pygame.sprite.Group()`\
  \ 下方添加这两行代码：\n\n```python\npygame.mixer.init()    # 添加声音\npop = pygame.mixer.Sound(\"\
  pop.wav\")\n```\n\n我们将在 `SmileyPop.py` 的设置部分、`sprite_list = pygame.sprite.Group()`\
  \ 下方添加这两行代码：\n\n```python\npygame.mixer.init()    # 添加声音\npop = pygame.mixer.Sound(\"\
  pop.wav\")\n```\n（注：此处处示例原文重复，已按逻辑处理）\n\n我们将在 `SmileyPop.py` 的设置部分、`sprite_list\
  \ = pygame.sprite.Group()` 下方添加这两行代码：\n\n```python\npygame.mixer.init()    # 添加声音\n\
  pop = pygame.mixer.Sound(\"pop.wav\")\n```\n\n我们首先初始化混合器（就像我们用 `pygame.init()` 初始化\
  \ Pygame 一样），加载 `pop.wav` 作为一个 `Sound` 对象。\n\n第二行加载 `pop.wav` 作为一个 `Sound` 对象并存储在变量\
  \ `pop` 中，我们稍后会使用。\n\n接下来我们将添加逻辑来检查是否点击了笑脸并播放声音。我们在 `elif pygame.mouse.get_pressed()[2]`\
  \ 语句中这样做。在删除笑脸的 `sprite_list.remove(clicked_smileys)` 之后，检查是否有笑脸，然后播放声音。\n\n![没有说明的图片](img/httpatomoreillycenostarchimages19051.jpg)\n\
  \n用户可能会在屏幕没有笑脸的区域右点击，或者在尝试点击时点空。我们将通过检查 `len(clicked_smileys) > 0` 来检查是否点击了笑脸。`len()`\
  \ 函数告诉我们列表的长度，如果长度大于零，说明有被点击。\n\n如果 `clicked_smileys` 列表中包含笑脸精灵，说明用户正确右点击了，因此我们播放破碎声：\n\
  \n```python\nif len(clicked_smileys) > 0:\n    pop.play()\n```\n\n注意这两行代码都与 `elif`\
  \ 语句中的其他代码对齐。\n\n这四行添加的代码是用户成功右点击笑脸时所需的全部。要应用这些更改并听到结果，请确保你已将 `pop.wav` 音文件下载到与修改后的\
  \ `SmileyPop.py` 相同的文件夹中，打开音器，开始点击吧！\n\n## 追踪和显示玩家进度\n\n我们想要添加的下一个功能是让用户感觉到正在取得进展。音效增加了一种有趣的反馈（用户只有在实际点击精灵时才会听到破碎声），但让我们也追踪用户创建和破了多少泡泡，以及他们破了多少百分比。\n\
  \n为了构建跟踪用户创建和破碎笑脸数量的逻辑，我们首先将在应用的设置部分添加一个 `font` 变量和两个计数器变量 `count_smileys` 和 `count_popped`：\n\
  \n```python\nfont = pygame.font.SysFont(\"Arial\", 24)\nWHITE = (255,255,255)\n\
  count_smileys = 0\ncount_popped = 0\n```\n\n\n\n\n我们将 `font` 变量设置为 Arial 字体，大小为\
  \ 24 磅。我们希望在屏幕上用白色字母绘制文本，因此我们添加了一个颜色变量 `WHITE`，并将其设置为白色的 RGB 三元组 `(255,255,255)`。我们的\
  \ `count_smileys` 和 `count_popped` 变量将存储创建和破出的表情的数量，这两个值在程序首次加载时都从零开始。\n\n### 创建和破出的表情计数\n\
  \n首先，让我们在表情添加到 `sprite_list` 时对其进行计数。为了做到这一点，我们来到 `SmileyPop.py` 代码的底部附近，那里 `if\
  \ mousedown` 语句检查鼠标是否在按下鼠标键的情况下正在拖动，并将表情添加到我们的 `sprite_list` 中。在那个 `if` 语句中添加最后一行即可：\n\
  \n```\nif mousedown:\n    speedx = random.randint(-5, 5)\n    speedy = random.randint(-5,\
  \ 5)\n    newSmiley = Smiley(pygame.mouse.get_pos(), speedx, speedy)\n    sprite_list.add(newSmiley)\n\
  \    count_smileys += 1\n```\n\n每当向 `sprite_list` 添加一个新表情时给 `count_smileys` 加 1，将有助于我们跟踪绘制的表情总数。\n\
  \n我们将类似的逻辑添加到 `if` 语句中，该语句每有一个或多个表情被点击时就会播放破出的声，但我们不会简单地给 `count_popped` 加 1——我们将加上被点击的表情实际数量。记住，用户可能点击了屏幕上两个或多个重叠在同一点的表情精灵。在右键事件的事件处理器中，我们将所有这些碰撞的表情收集到列表\
  \ `clicked_smileys` 中。要确定给 `count_popped` 增加多少分，我们只需要再次使用 `len()` 函数获取用户通过这次右键点击破出的正确表情数量。在你编写用于破音的\
  \ `if` 语句中添加此行：\n\n```\nif len(clicked_smileys) > 0:\n    pop.play()\n    count_popped\
  \ += len(clicked_smileys)\n```\n\n通过向 `count_popped` 添加 `len(clicked_smileys)`，我们在任何时间点都拥有正确的破出表情数量。现在，我们只需要在游戏循环中添加代码，显示创建的表情数量、破出的数量以及破出的百分比，以衡量用户的进度。\n\
  \n![没有说明的图像](img/httpatomoreillycomsourcenostarchimages2189053.png.jpg)\n\n在 Smiley\
  \ Pong 显示中一样，我们将创建一个文本字符串绘制在屏幕上，并使用 `str()` 函数将数字显示为字符串。在你的游戏循环中 `pygame.display.update()`\
  \ 之前添加这些行：\n\n```\ndraw_string = \"Bubbles created: \" + str(count_smileys)\ndraw_string\
  \ += \" - Bubbles popped: \" + str(count_popped)\n```\n\n这些行将创建我们的 `draw_string`\
  \ 并显示创建的表情泡泡数量和破出的数量。\n\n### 表情破百分比\n\n在两个 `draw_string` 语句之后添加这三行：\n\n```\nif (count_smileys\
  \ > 0):\n    draw_string += \" - Percent: \"\n    draw_string += str(round(count_popped/count_smileys*100,\
  \ 1))\n    draw_string += \"%\"\n```\n\n为了得到所有已创建表情中破出表情的百分比，我们将 `count_popped`\
  \ 除以 `count_smileys` (`count_popped/count_smileys`)，然后乘以 100 得到百分比值 (`count_popped/count_smileys*100`)。但如果我们尝试显示这个数字，会有两个问题。首先，当程序启动且两个值都零时，我们的百分比计算将产生“除以零”错误。为了修复这个问题，只有当\
  \ `count_smileys` 大于零时才显示破出的百分比。\n\n其次，如果用户创建了三个表情并破出了其中一个——比例为三分之一或 1/3——百分比将是\
  \ 33.333333333.... . . . 我们不希望每次百分比计算中出现循环小数时显示都变得非常长，所以让我们使用 `round()` 函数将百分比保留到一位小数。\n\
  \n最后一步是用白色像素绘制字符串，将这些像素在屏幕顶部附近居中，并调用 `screen.blit()` 将这些像素复制到游戏窗口的绘制屏幕上：\n\n```\n\
  text = font.render(draw_string, True, WHITE)\ntext_rect = text.get_rect()\ntext_rect.centerx\
  \ = screen.get_rect().centerx\ntext_rect.y = 10\nscreen.blit (text, text_rect)\n\
  ```\n\n你可以在 图 10-7 中看到这些更改的效果。\n\n较小的表情更难捕获和破出，尤其是当它们移动很快时，因此很难破出 90%。这正是我们想要的。我们使用了这个反馈和挑战/成就组件，让应用程序看起来更像我们可能会玩的游戏。\n\
  \n![在我们添加声音和进度/反馈显示后，SmileyPop 应用现在更像一个游戏了。](img/httpatomoreillycomsourcenostarchimages2189055.png.jpg)\n\
  \n图 10-7。在我们添加声音和进度/反馈显示后，SmileyPop 应用现在更像一个游戏了。\n\n破出的声音和进度显示反馈让 SmileyPop 感觉像一个移动应用程序。当你通过右键点击破出表情时，你可能会想象在移动设备上点击表情来破出它们。（要学习如何构建移动应用，请查看\
  \ MIT 的 App Inventor：[`appinventor.mit.edu/`](http://appinventor.mit.edu/)。）\n\n\
  ### 汇总\n\n这里是 SmileyPop 2.0 的完整代码。请将 `.py` 源文件、`CrazySmile.bmp` 图像文件和 `pop.wav`\
  \ 声音文件放在同一个文件夹中。\n\n代码将将 90 行，手动输入可能太长。访问 [www.nostarch.com/teachkids/](http://www.nostarch.com/teachkids/)\
  \ 下载代码以及相关的声音和图片文件。\n\n### SmileyPop2.py\n\n\n\n\n\n```python\nimport pygame\nimport\
  \ random\n\nBLACK = (0,0,0)\nWHITE = (255,255,255)\npygame.init()\nscreen = pygame.display.set_mode([800,600])\n\
  pygame.display.set_caption(\"Pop a Smiley\")\nmousedown = False\nkeep_going = True\n\
  clock = pygame.time.Clock()\npic = pygame.image.load(\"CrazySmile.bmp\")\ncolorkey\
  \ = pic.get_at((0,0))\npic.set_colorkey(colorkey)\nsprite_list = pygame.sprite.Group()\n\
  pygame.mixer.init()    # Add sounds\npop = pygame.mixer.Sound(\"pop.wav\")\nfont\
  \ = pygame.font.SysFont(\"Arial\", 24)\ncount_smileys = 0\ncount_popped = 0\n\n\
  class Smiley(pygame.sprite.Sprite):\n    pos = (0,0)\n    xvel = 1\n    yvel = 1\n\
  \    scale = 100\n\n    def __init__(self, pos, xvel, yvel):\n        pygame.sprite.Sprite.__init__(self)\n\
  \        self.image = pic\n        self.scale = random.randrange(10,100)\n     \
  \   self.image = pygame.transform.scale(self.image,\n                          \
  \                  (self.scale,self.scale))\n        self.rect = self.image.get_rect()\n\
  \        self.pos = pos\n        self.rect.x = pos[0] - self.scale/2\n        self.rect.y\
  \ = pos[1] - self.scale/2\n        self.xvel = xvel\n        self.yvel = yvel\n\
  \    def update(self):\n        self.rect.x += self.xvel\n        self.rect.y +=\
  \ self.yvel\n        if self.rect.x <= 0 or self.rect.x > screen.get_width() - self.scale:\n\
  \            self.xvel = -self.xvel\n        if self.rect.y <= 0 or self.rect.y\
  \ > screen.get_height() - self.scale:\n            self.yvel = -self.yvel\n\nwhile\
  \ keep_going:\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n\
  \            keep_going = False\n        if event.type == pygame.MOUSEBUTTONDOWN:\n\
  \            if pygame.mouse.get_pressed()[0]: # Left mouse button, draw\n     \
  \           mousedown = True\n            elif pygame.mouse.get_pressed()[2]: #\
  \ Right mouse button, pop\n                pos = pygame.mouse.get_pos()\n      \
  \          clicked_smileys = [s for s in sprite_list if\n                      \
  \             s.rect.collidepoint(pos)]\n                sprite_list.remove(clicked_smileys)\n\
  \                if len(clicked_smileys) > 0:\n                    pop.play()\n\
  \                    count_popped += len(clicked_smileys)\n        if event.type\
  \ == pygame.MOUSEBUTTONUP:\n            mousedown = False\n    screen.fill(BLACK)\n\
  \    sprite_list.update()\n    sprite_list.draw(screen)\n    clock.tick(60)\n  \
  \  draw_string = \"Bubbles created: \" + str(count_smileys)\n    draw_string +=\
  \ \" - Bubbles popped: \" + str(count_popped)\n    if (count_smileys > 0):\n   \
  \     draw_string += \" - Percent: \"\n        draw_string += str(round(count_popped/count_smileys*100,\
  \ 1))\n        draw_string += \"%\"\n\n    text = font.render(draw_string, True,\
  \ WHITE)\n    text_rect = text.get_rect()\n    text_rect.centerx = screen.get_rect().centerx\n\
  \    text_rect.y = 10\n    screen.blit (text, text_rect)\n\n    pygame.display.update()\n\
  \    if mousedown:\n        speedx = random.randint(-5, 5)\n```\n\n### 代码概述\n\n\
  这段代码通过加载 `CrazySmile.bmp` 图像并初始化 `pygame` 库，创建了一个 `800x600` 的显示窗口。它定义了一个 `Smiley`\
  \ 类，它继承自 `pygame.sprite.Sprite`，并包含了位置、速度和缩放比例等属性。在 `__init__` 方法中，程序随机生成表情的缩放大小并调整图像。`update`\
  \ 方法处理表情的移动，使其在屏幕边界处发生反弹。\n\n主循环 `while keep_going` 持续处理事件。当用户点击左鼠标时，`mousedown`\
  \ 被设为 `True`；点击右键时，程序会检测点击位置是否与任何表情碰撞，如果是则移除该表情、播放 `pop` 音效并增加破碎计数器。最后，程序会刷新屏幕、更新精灵列表，并在屏幕上显示创建和破碎表情的数量以及百分比。\n\
  \n### 我们学到的内容\n\n在本章中，我们通过 `Smiley Pong` 学习了：\n\n- 游戏设计中的常见元素。\n- 在应用程序中集成游戏设计元素。\n\
  - 如何通过绘制画布、精灵以及添加用户交互来构建游戏框架。\n- 编写碰撞检测和得分逻辑。\n- 使用 `pygame.font` 模块在屏幕上显示文本信息。\n\
  \n### 编程挑战\n\n要获取这些挑战的示例答案以及本章所需的音频文件，请访问 `[`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)`。\n\
  \n#### #1: 音效\n\n为 `Smiley Pong` 版本 2.0 添加的一个功能是音效。在经典的 Pong 控制台和街机游戏中，当玩家得分时球会发出“blip”声，当错过时会发出“buzz”或“blap”声。在最后的挑战之一中，利用你在\
  \ `SmileyPop` 2.0 版本中学到的技能，将 Smiley Pong v2.0 升级到 v3.0，添加音效。将此新文件保存为 `SmileyPong3.py`。\n\
  \n#### #2 碰撞与缺失\n\n\n\n\n为了让 SmileyPop 应用更具游戏性，可以添加逻辑来记录在总点击次数中的命中和未命中次数。如果用户在右键点击时击中了任何表情脸精灵，则将\
  \ `hits` 计数加 1（每次点击命中 1 次——我们不想重复计算 `count_popped`）。如果用户右键点击但没有命中任何表情脸精灵，则将其记录为\
  \ `miss`（未命中）。你可以编写逻辑在未命中一定次数后结束游戏，或者给用户固定的总点击次数，以便他们尽可能获得最高百分比。你甚至可以添加一个计时器，告诉玩家在例如\
  \ 30 秒内尽可能创建并弹出尽可能表情脸泡泡。将此新版本保存为 `SmileyPopHitCounter.py`。\n\n### #3: 清空泡泡\n\n你可能想要添加一个“清除”功能（或作弊按钮），通过按下功能键来弹出所有泡泡，就像我们在\
  \ Smiley Pong 中的“再次游戏”功能一样。你还可以通过在跳动的表情脸每次撞击边缘时，将其速度乘以一个小于 1 的数字（如 0.95），让它们逐渐减慢。可能性是无限的。\n\
