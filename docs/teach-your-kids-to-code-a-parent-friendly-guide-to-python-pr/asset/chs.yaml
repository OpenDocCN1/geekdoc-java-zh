- "# 教孩子编程：家长友 Python 编程指南\n\n\n\n\n\n\n\n\n\n# 《教你的孩子编程》赞誉语\n\n> “文字清晰，图画引人入胜，应用程序也非常棒。这是一本可以让父母和孩子共同享受的编程指南。”\n\
