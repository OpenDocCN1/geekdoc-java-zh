  \  speedy = -speedy\n\n    screen.fill(BLACK)\n    screen.blit(pic, (picx, picy))\n\
  \n    # Draw paddle\n    paddlex = pygame.mouse_pos()[0]\n    paddlex -= paddlew\n\
