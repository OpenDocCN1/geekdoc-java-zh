  \   # Check for bounce\n    if picy + pic.get_height() >= paddley and picx >= paddlex\
  \ and picx <= paddlex + paddlew:\n        speedy = -speedy\n        points += 1\n\
  \n    # Draw text on screen\n    draw_string = \"Lives: \" + str(lives) + \" Points:\
  \ \" + str(points)\n    text = font.render(draw_string, True, WHITE)\n    text_rect\
  \ = text.get_rect()\n    text_rect.centerx = screen.get_rect().centerx\n    text_rect.y\
  \ = 10\n    screen.blit(text, text_rect)\n    pygame.display.update()\n    timer.tick(60)\n\
