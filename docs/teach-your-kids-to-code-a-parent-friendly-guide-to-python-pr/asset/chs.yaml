  \n```\ndraw_string = \"Lives: \" + str(lives) + \" Points: \" + str(points)\n```\n\
  \n我们的字符串变量将命名为 `draw_string`，它包含了我们要在屏幕上绘制并显示给游戏用户的文本。为了在屏幕上绘制这些文本，我们需要一个连接到文本绘制模块\
  \ `pygame.font` 的对象或变量。*font*（字体）是*typeface*（字体）的另一种名称，即字符的样式，如 Arial 或 Times New\
  \ Roman。在应用程序的设置部分，添加以下行：\n\n```\nfont = pygame.font.SysFont(\"Times\", 24)\n```\n\
  \n这创建了一个我们称为 `font` 的变量，允许我们以 24 点 Times 字体在 Pygame 显示器上绘制。你可以让文本变大或变小，但目前 24 点足够了。接下来我们将绘制文本；这应该添加到游戏循环中，紧跟在\
  \ `draw_string` 声明之后。要在窗口上绘制文本，我们首先要在创建的 `font` 对象通过 `render()` 命令在它自己的表面上绘制字符串：\n\
  \n```\ntext = font.render(draw_string, True, WHITE)\n```\n\n这创建了一个名为 `text` 的变量，用于存储一个包含我们字符串中所有字母、数字和符号的白色像素的表面。下一步将获取该表面的尺寸（宽度和高度）。较长的字符串渲染或绘制得更宽，而较短的字符串绘制所需的像素较少。大字体和小字体也是如此。文本字符串将在矩形表面上渲染，因此我们将变量命名为\
