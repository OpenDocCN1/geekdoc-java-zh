  \ 10-5 的内容。我们正在向街机级游戏迈进！\n\n### 整合\n\n我们使用了许多编码技能来制作这个游戏。变量、循环、条件、数学、图形、事件处理——几乎用了我们整个工具箱。游戏对于编码者和玩家来说都是一场冒险。制作游戏是具有挑战性又有回报的；我们可以构建自己想要的游戏玩法，然后与他人分享。我的儿子非常喜欢\
