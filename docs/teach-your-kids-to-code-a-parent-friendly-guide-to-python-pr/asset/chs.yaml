  \ `ColorSpiral.py` 再次尝试即可。\n\n`ColorSpiral.py` 程序使用了一个新命令 `t.width()`；它会改变龟画笔的宽度。在我们的程序中，随着绘制的形状越来越大，画笔变得越来越宽（线条变粗）。在第\
