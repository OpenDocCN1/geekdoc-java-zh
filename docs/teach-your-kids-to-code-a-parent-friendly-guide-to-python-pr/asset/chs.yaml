  \n# 附录 C 构建你自己的模块\n\n在书中，你已经将 `turtle`、`random` 和 `pygame` 等模块导入程序，以添加绘制、生成随机数和图形动画的功能，而无需从头开始编写代码。但你知道你也可以编写自己的模块并将其导入到程序中吗？Python\
  \ 让构建模块变得简单，你就可以保存有用代码并在许多程序中使用它。\n\n为了创建一个可重用的模块，我们在 IDLE 的文件编辑器窗口中编写该模块，就像我们构建的其他程序文件一样，并将其保存为新的\
  \ `.py` 文件，使用模块的名称作为文件名（例如，`colorspiral.py` 可能是绘制彩色螺旋的模块的文件名）。我们在模块中定义函数和变量。然后，为了在另一个程序中重用它们，我们通过输入\
  \ `import` 和模块名称将模块导入程序（例如，`import colorspiral` 将允许程序使用 `colorspiral.py` 中的代码来绘制彩色螺旋）。\n\
  \n为了练习编写自己的模块，让我们创建一个实际的 `colorspiral` 模块，看看它是如何避免我们重写代码的。\n\n# 构建 colorspiral \n\
  \n让我们创建一个 `colorspiral` 模块，帮助我们仅通过调用 `import colorspiral` 就在程序中快速方便地绘制螺旋。在新的 IDLE\
  \ 窗口中输入以下代码并将其保存为 `colorspiral.py`。\n\n## colorspiral.py\n\n```\n➊ \"\"\"用于绘制最多\
  \ 6 边的彩色螺旋的模块\"\"\"\n   import turtle\n➋ def cspiral(sides=6, size=360, x=0, y=0):\n\
  ➌     \"\"\"在黑色背景上绘制彩色螺旋。\n\n       参数：\n       sides -- 螺旋的边数（默认 6）\n       size\
  \ -- 最后一条边的长度（默认 360）\n       x, y -- 螺旋的位置，距离屏幕中心\n       \"\"\"\n       t=turtle.Pen()\n\
  \       t.speed(0)\n       t.penup()\n       t.setpos(x,y)\n       t.pendown()\n\
  \       turtle.bgcolor(\"black\")\n       colors=[\"red\", \"yellow\", \"blue\"\
  , \"orange\", \"green\", \"purple\"]\n       for n in range(size):\n           t.pencolor(colors[n%sides])\n\
  \           t.forward(n * 3/sides + n)\n           t.left(360/sides + 1)\n     \
  \      t.width(n*sides/100)\n```\n\n此模块导入了 `turtle` 模块，并定义了一个名为 `cspiral()` 的函数用于绘制不同形状、大小和位置的彩色螺旋。让我们看看这个模块与我们编写的其他程序之间的区别。首先，在\
  \ ➊ 处，我们有一个特殊的注释称为 docstring*（文档字符串）。docstring 是向打算重用或与他人共享的文件添加文档的方法；在 Python 中，模块应该拥有\
  \ docstring 以帮助未来的用户理解模块的作用。docstring 始终是模块或函数中的第一个语句，且每个 docstring 都以三个双引号（`\"\"\
  \"`，连续三个双引号且中间没有空格）开始并结束。在 docstring 之后，我们导入了 `turtle` 模块——是的，我们可以将模块导入到模块中！\n\n\
  在 ➋ 处，我们定义了一个名为 `cspiral()` 的函数，它接受最多四个参数——`sides`、`size`、`x` 和 `y`——用于螺旋的边数、螺旋的大小以及从乌龟屏幕中心开始的螺旋的\
  \ (`x`, `y`) 位置。`cspiral()` 函数的 docstring 起于 ➌；这个多行 docstring 提供了关于函数的更具体的信息。docstring\
  \ 的第一行以三个双引号开始，描述了函数的整体。接下来我们留出一个空行，然后是函数接受的参数列表。有了这些文档，未来的用户可以轻松读出函数接受哪些参数以及每个参数的含义。这些文档是用于绘制彩色螺旋的代码，类似于第\
  \ 2 章、第 4 章](#ch04.html \"第 4 章：循环很有趣\") 和第 7 章。\n\n## 使用 colorspiral 模块\n\n一旦我们完成了\
  \ `colorspiral.py` 并保存了它，就可以通过将其导入另一个程序来使用它。在 IDLE 中创建一个新文件并将其保存为 `MultiSpiral.py`，与\
  \ `colorspiral.py` 在同一个文件夹下。\n\n## MultiSpiral.py\n\n```\nimport colorspiral\ncolorspiral.cspiral(5,50)\n\
  colorspiral.cspiral(4,100)\n```\n\n这三行代码导入了我们创建的 `colorspiral` 模块，并在屏幕上绘制出两个螺旋，如图\
  \ C-1 所示。\n\n有了 `colorspiral` 模块，任何程序员只需导入该模块并调用 `cspiral()` 就可以创建彩色螺旋了！\n\n![三行代码绘制的彩色螺旋，感谢该模块](img/httpatomoreillycomsourcenostarchimages2189137.jpg)\n\
  \n图 C-1. 三行代码绘制的彩色螺旋，感谢该模块\n\n## 重用 colorspiral 模块\n\n让我们重用 `colorspiral` 模块绘制 30\
  \ 个随机的彩色螺旋。为了实现，我们将导入另一个之前使用过的模块 `random`。在 IDLE 的一个新文件中输入以下八行代码并将文件保存为 `SuperSpiral.py`。\n\
  \n## SuperSpiral.py\n\n```\nimport colorspiral\nimport random\nfor n in range(30):\n\
  \    sides = random.randint(3,6)\n    size = random.randint(25,75)\n    x = random.randint(-300,300)\n\
  \    y = random.randint(-300,300)\n    colorspiral.cspiral(sides, size, x, y)\n\
  ```\n\n该程序以两个 `import` 语句开头：一个是我们创建的 `colorspiral` 模块，另一个是我们在书中使用的 `random` 模块。`for`\
  \ 循环将运行 30 次。循环生成四个随机值：边数（3 到 6 之间）、螺旋的大小（25 到 75 之间）以及在屏幕上绘制螺旋的 (–300, –300) 到\
  \ (300, 300) 之间的 x 和 y 坐标。（记住乌龟的原点 (0, 0) 在绘图屏幕的中心。）最后，每次循环都会调用我们模块中的 `colorspiral.cspiral()`\
  \ 函数，使用循环随机生成的属性绘制彩色螺旋。\n\n尽管这个程序只有八行长，但它产生了惊叹的视觉效果，如图 C-2 所示。\n\n\n\n\n\n![colorspiral\
  \ 模块允许 SuperSpiral.py 仅需八行代码即可生成漂亮的多螺旋拼贴画。](img/httpatomoreillycomsourcenostarchimages2189139.png.jpg)\n\
  \n图 C-2. `colorspiral` 模块允许 `SuperSpiral.py` 仅需八行代码即可生成漂亮的多螺旋拼贴画。\n\n创建重用模块意味着你可以花费更多时间来解决新问题，而不是花时间重新编写之前的解决方案。每当你构建了一个想要反复使用的有用函数或一组函数时，你都可以创建一个模块供自己使用，或与代码伙伴们分享。\n\
  \n## 更多资源\n\nPython 的官方文档位于 `[`docs.python.org/3/`](http://docs.python.org/3/)`，包含了更多关于模块和\
  \ Python 语言的信息。《Python 教程》在 `[`docs.python.org/3/tutorial/modules.html`](http://docs.python.org/3/tutorial/modules.html)`\
  \ 中有一个关于模块的章节。在你学习新的 Python 编程技能时，请利用这些资源来丰富你的编程工具箱。\n\n# 附录 D 术语表\n\n在学习编程过程中遇到的许多术语是你已经理解的日常词汇。然而，某些术语是全新的，或者对计算机程序员来说有特殊含义。本术语表定义了书中你会遇到的几个新术语，以及在编程世界中具有新含义的常见单词。\n\
  \n### algorithm (算法)\n执行任务的一系列步骤，就像食谱一样。\n\n### animation (动画)\n当快速显示相似图像时产生的运动幻觉，就像动画片一样。\n\
  \n### app (应用程序)\n`application` 的缩写，一个执行有用（或有趣！）任务的计算机程序。\n\n### append (追加)\n在末尾添加某些内容；例如，在字符串末尾添加字母，或在列表或数组的末尾添加元素。\n\
  \n### argument (参数)\n传递给函数的值；在语句 `range(10)` 中，`10` 就是一个参数。\n\n### array (数组)\n\
  有序的值或对象的列表，通常类型相同，通过它们的 `index`（索引）或在列表中的位置来访问。\n\n### assignment (赋值)\n设置变量的值，例如\
  \ `x = 5`，这会将值 `5` 分配给变量 `x`。\n\n### block (块)\n一组编程语句。\n\n### Boolean (布尔值)\n可以为真（true）或假（false）的值或表达式。\n\
  \n### class (类)\n一种模板，定义了该类型任何对象中包含的函数和值。\n\n### code (代码)\n程序员用计算机可以理解的语言编写的语句或指令。\n\
  \n### collision detect (碰撞检测)\n检查屏幕上的两个虚拟对象是否正在接触或“碰撞”，例如 Pong 游戏中的球和球板。\n\n###\
  \ concatenate (连接/拼接)\n将两个文本字符串合并成一个单一字符串。\n\n### conditional expression (条件表达式)\n\
  一种允许计算机测试值并根据测试结果执行不同操作的语句。\n\n### constant (常量)\n计算机程序中保持不变的命名值，例如 `math.pi` (3.1415...)。\n\
  \n### declaration (声明)\n告诉计算机变量或函数名含义的语句或语句组。\n\n### element (元素)\n列表或数组中的单个项目。\n\
  \n### event (事件)\n计算机可以检测到的活动，例如鼠标点击、值变化、按键按下、定时器滴答等。响应事件的语句或函数被称为 `event handlers`（事件处理器）或\
  \ `event listeners`（事件监听器）。\n\n### expression (表达式)\n任何产生值或结果的有效值、变量、运算符和函数的集合。\n\
  \n### file (文件)\n由计算机存储在某种存储设备（如硬盘、DVD 或 USB 驱动器）上的数据或信息集合。\n\n### `for` loop (for\
  \ 循环)\n一种允许代码块在给定的值范围内重复的编程语句。\n\n### frame (帧)\n动画、视频或计算机图形移动序列中的单幅图像。\n\n### frames\
  \ per second (fps) (帧率)\n动画、视频游戏或电影中在屏幕上绘制图像的频率或速度。\n\n### function (函数)\n一组用于执行特定任务的命名的可重用编程语句。\n\
  \n### import (导入)\n从另一个程序或模块将可重用的代码或数据引入程序。\n\n### index (索引)\n元素在列表或数组中的位置。\n\n\
  ### initialize (初始化)\n赋予变量或对象第一个或“初始”值。\n\n### input (输入)\n输入计算机的任何数据或信息；输入可以来自键盘、鼠标、麦克风、数字相机或其他任何输入设备。\n\
  \n### iterative versioning (迭代版本)\n反复对程序进行微小更改或改进，并将其保存为新版本，例如 `Game1`、`Game2` 等。\n\
  \n### keyword (关键字)\n在特定编程语言中具有含义的特殊保留字。\n\n### list (列表)\n用于存储有序值或对象的容器。\n\n###\
  \ loop (循环)\n一组重复直到达到某个运行的指令。\n\n### module (模块)\n包含相关变量、函数和类的单文件或一组文件，可以在其他程序中重用。\n\
  \n### nested loop (嵌套循环)\n另一个循环内部的循环。\n\n### object (对象)\n包含类中单个实例信息的变量，例如来自 `Sprite`\
  \ 类的单个精灵（sprite）。\n\n### operator (运算符)\n代表动作或比较并返回结果的符号或符号组，如 `+`、`-`、`*`、`//`、`<`、>`\
  \ 等。\n\n### parameter (参数)\n函数的输入变量，在函数定义中指定。\n\n### pixel (像素)\n`picture element`（像素元素）的缩写，构成计算机屏幕图像的彩色小点。\n\
  \n### program (程序)\n用计算机可以理解的语言编写的一组指令。\n\n### pseudorandom (伪随机)\n看起来是随机且不可预测的，用于模拟掷骰子或抛硬币。\n\
  \n### random numbers (随机数)\n均匀分布。\n\n### range (范围)\n已知的起始和结束值；在 Python 中，`range`\
  \ 函数返回从 `0` 到 `10` 的序列。\n\n### RGB color (RGB 颜色)\n通过红、绿、蓝光来表示颜色的方式。\n\n### shell\
  \ (终端)\n读取用户命令并运行它们的文本界面；IDLE 就是一种 shell。\n\n### sort (排序)\n将列表或数组的元素按顺序排列，例如字母顺序。\n\
  \n### string (字符串)\n字符序列，可以包括字母、数字、符号和标点。\n\n### syntax (语法)\n编程语言的规则。\n\n### transparency\
