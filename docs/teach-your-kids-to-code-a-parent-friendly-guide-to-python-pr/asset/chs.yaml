  \n> —Dr. Antonio Sanz Montemayor，西班牙皇家胡安·卡洛斯大学信息学教授\n\n> “引人入胜、富有想象力的应用与极价值的终身技能的完美结合。”\n\
  \n> —Ted Cunningham，《家的力量》作者\n\n> “《教你的孩子编程》及其引入的逻辑思维将帮助培养下一代技术领袖。”\n\n> —N. Dean\
