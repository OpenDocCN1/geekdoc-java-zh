  \ Python 甚至如何帮助你完成数学作业！\n\n到目前，你应该能够完成以下操作：\n\n*   使用 Turtle 库绘制简单图形。\n*   使用变量存储简单的数字值和字符串。\n\
  *   在 IDLE 中更改、保存和运行程序。\n\n### 编程挑战\n\n尝试这些挑战来练习你在本章中学到的知识。（如果你卡住了，请访问 *[`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)*\
