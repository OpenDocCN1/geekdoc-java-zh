  timer = pygame.time.Clock()\nspeedx = 5\nspeedy = 5\npaddlew = 200\npaddleh = 25\n\
  paddlex = 300\npaddley = 550\npicw = 100\npich = 100\npoints = 0\nlives = 5\nfont\
  \ = pygame.font.SysFont(\"Times\", 24)\n\nwhile keepGoing:    # Game loop\n    for\
  \ event in pygame.event.get():\n        if event.type == pygame.QUIT:\n        \
