- - '##'
  - 测试 Python
- - '###'
  - 1. 前往 Launchpad（启动台）并点击 IDLE，或者前往 Finder（应用程序），Python 3.4 文件夹，然后双击 IDLE 打开 shell，如图
    A-20 所示。
- - '###'
  - 2. Python 编辑器会出现。你准备在 shell 中编码了。输入 `print("Hello, Python!")` 并 RETURN；Python
    shell 响应 `Hello, Python!`，如图 A-21 所示。
- - '###'
  - 3. 尝试加法语句，例如 `2 + 3`。按 RETURN，它将响应答案。
- - '###'
  - 4. 你可能更改 IDLE 窗口中的字体大小，以便在电脑上更容易。前往 `Preferences...`（偏好...）。在 `Fonts/Tabs`（字体/表符）选项下，将
    `Size`（大小）更改为 `20`，如图 A-22 所示，或者调大或调小容易阅读。你可以勾选 Bold（加粗）复选框使文本加粗（如果有帮助的话）。自定义字体让你眼睛舒适。
