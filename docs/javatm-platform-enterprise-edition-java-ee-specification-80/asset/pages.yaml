    arangements of class loaders that must be used by a Java EE product. Instead,
    the

    specification defines requirements in terms of what classes must or not be

    visible to components. A Java EE product is free to use whatever class loaders

    choose to meet these requirements. Portable applications must not depend on the

    types of class loaders used or the hierarchical arrangement of class loaders,
    and

    Portable applications must not depend on the order in which classes and resources

    are loaded. Portable Applications should use the techniques described in Section
    EE.8.2.5,

    "Dynamic Class Loading" if need to load classes dynamically.


