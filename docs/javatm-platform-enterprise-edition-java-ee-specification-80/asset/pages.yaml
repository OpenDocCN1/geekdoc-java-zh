  md: '# EE.10


    # Application Clients


    His chapter describes application clients in the Java™ Platform, Enterprise Edition
    (Java EE).


    A full Java EE product must support the application client container as described
    in this chapter. A Java EE profile may or not require support for the application
    client container.


    # EE.10.1 Overview


    Application clients are first tier client programs that execute in their own Java™
    virtual machines. Application clients follow the model for Java technology-based
    applications: they are invoked in their main method and run until the virtual
    machine is terminated. However, like other Java EE application components, application
    clients depend on a container to provide system services. The application client
    container may be very light-weight compared to other Java EE containers, providing
    only the security and deployment services described below


    # EE.10.2 Security


    The Java EE authentication requirements for application clients are the same as
    for other Java EE components, and the same authentication techniques may be used
    for other Java EE application components.


    No authentication is necessary when accessing unprotected web resources. When
    accessing protected web resources, the usual varieties of authentication may be
    used, namely HTTP Basic authentication, SSL client authentication, or HTTP Login
    Form authentication. Lazy authentication may be used.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Authentication is required when accessing protected enterprise beans. The authentication
    mechanisms for enterprise beans include those required in the EJB specification
    for enterprise bean interoperability. Lazy authentication may be used.


    An application client makes use of an authentication service provided by the application
    client container for authenticating its users. The container''s service may be
    integrated with the native platform''s authentication system, so that a single
    signon capability is employed. The container may authenticate the user when the
    application is started, or it may use lazy authentication, authenticating the
    user when a protected resource is accessed. This specification does not describe
    the technique used to authenticate the user, although a later version may do.


    If the container interacts with the user to gather authentication data, the container
    must provide an appropriate user interface. In addition, an application client
    may provide a class that implements the javax.auth.callback.CallbackHandler interface
    and specify the class name in its deployment descriptor (see Section EE.10.7 "Java
    EE Application Client XML Schema" for details). The Deployer may override the
    callback handler specified by the application and use the container''s default
    user interface instead.


    If a callback is configured by the Deployer, the application client container
    must instantiate an object of this class and use it for all authentication interactions
    with the user. The application''s callback handler must fully support Callback
    objects specified in the javax.security.auth.callback package.


    Note that when HTTP Login Form authentication is used, the authentication user
    interface provided by the server (in the form of an HTML page delivered in response
    to an HTTP request) must be displayed by the application client.


    # EE.10.3 Transactions


    Application clients are not required to have direct access to the transaction
    facilities of the Java EE platform. A Java EE product is not required to provide
    a JTA Transaction object for application clients. Application clients can invoke
    enterprise beans that start transactions, and they can use the transaction facilities
    of the JDBC API. If a JDBC API transaction is open when an application


