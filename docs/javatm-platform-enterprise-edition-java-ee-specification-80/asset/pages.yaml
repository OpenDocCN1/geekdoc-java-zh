    # EE.5.13.3 Deployer’s Responsibility


    The Deployer uses deployment tools to bind a persistence unit reference to the
    actual entity manager factory configured for the persistence unit in the target
    operational environment.


    The Deployer must perform the following tasks for each persistence unit reference
    declared in the metadata annotations or deployment descriptor:


    +   • Bind the persistence unit reference to an entity manager factory configured
    for the persistence unit that exists in the operational environment. The Deployer
    may use, for example, the JNDI Linkref mechanism to create a symbolic link to
    the actual JNDI name of the entity manager factory.


    +   • If the persistence unit name is specified, the Deployer should bind the
    persistence unit reference to the entity manager factory for the persistence unit
    specified as the target.


    +   • Provide any additional configuration information that the entity manager
    factory needs for managing the persistence unit, as described in the Java Persistence
    specification.


    # EE.5.13.4 Java EE Product Provider’s Responsibility


    The Java EE Product Provider is responsible for the following:


    +   • Provide the deployment tools that allow the Deployer to perform the tasks
    described in the previous subsection.


    +   • Provide the implementation of the entity manager factory classes for the
    persistence units that are configured with the container. The implementation of
    the entity manager factory classes may be provided by the container directly or
    by the container in conjunction with a third-party persistence provider, as described
    in the Java Persistence specification.


