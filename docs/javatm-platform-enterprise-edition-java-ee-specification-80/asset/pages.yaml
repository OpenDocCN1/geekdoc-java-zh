  md: '# EE.5.13.2 Application Assembler: Responsibilities


    The Application Assembler can use the persistence-unit-name element in the deployment
    descriptor to disambiguate a reference to a persistence unit.The Application Assembler
    (or Application Component Provider) may use the following syntax in the persistence-unit-name
    element of the referencing application component to avoid the need to rename persistence
    units to have unique names within a Java EE application. The Application Assembler
    specifies the path name of the root of the persistence unit.xml file for the referenced
    persistence unit and appends the name of the persistence unit separated from the
    path name by #. The path name is relative to the referencing application component
    jar file. In this manner, multiple persistence units with the same persistence
    unit name may be uniquely identified when the Application Assembler cannot change
    persistence units. For example:


    ```

    ...

    <persistence-unit-ref>

    <description>

    Persistence unit for the inventory management application.

    </description>

    <persistence-unit-ref-name>

    pistence/InventoryDB

    </persistence-unit-ref-name>

    <persistence-unit-name>

    ../lib/inventory.Jar#InventoryManagement

    </persistence-unit-name>

    </persistence-unit-ref>

    ...

    ```


    The Application Assembler uses the persistence-unit-name element to link the persistence
    unit name InventoryManagement declared in the InventoryManagerBean to the persistence
    unit named InventoryManagement defined in inventory.jar.


    The following rules apply to how a deployment descriptor entry may override a
    PersistenceUnit annotation:


    +   - The relevant deployment descriptor entry is located based on the JNDI name
    used with the annotation (either defaulted or provided explicitly).

    - The persistence-unit-name overrides the unitName element of the annotation.
    The Application Assembler or Deployer should exercise caution in changing this
    value, if specified, doing so is likely to break the application.


    Java EE 8, Final Release'
