    # Security Policy Domain


    A security policy domain, also referred to as a security domain, is a scope over
    which a common security policy is defined and enforced by the security administrator
    of the security service.


    A security policy domain is also sometimes referred to as a realm. This specification
    uses the security policy domain, security domain, terminology.


    # Security Technology Domain


    A security technology domain is the scope over which the same security mechanism
    (for example Kerberos) is used to enforce a security policy.


    A single security technology domain may include multiple security policy domains,
    for example.


    # Security Attributes


    A set of security attributes is associated with every principal. The security
    attributes have many uses (for example, access to protected resources and auditing
    of users). Security attributes can be associated with a principal by an authentication
    protocol and/or by the Java EE Product Provider.


    The Java EE platform does not specify what security attributes are associated
    with a principal.


