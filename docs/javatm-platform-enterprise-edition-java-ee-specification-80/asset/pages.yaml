    are client programs that may interact with enterprise beans directly (that is,
    without the help of a web browser and without traversing a web server). Application
    clients may access all web resources.


    Application clients, like the other Java EE application component types, execute
    in a managed environment that is provided by an appropriate container. Application
    clients are expected to have access to a graphical display and input device, and
    are expected to communicate with a human user.


    Application clients are used to authenticate end users to the Java EE platform,
    when the users access protected web resources or enterprise beans.


