  md: '# EE.6.2.3.11 Preferences API Requirements


    The Preferences API in the java.util.prefs package allows applications to store
    and retrieve user system and configuration data. A Java EE application will not
    have the RuntimePermission("preferences") necessary to use the Preferences API.
    This specification does not define any relationship between the principal used
    and the user preferences defined by the Preferences API. A future version of this
    specification may define the use of the Preferences API by Java EE applications.


    # EE.6.3 Enterprise JavaBeans™ (EJB) 3.2 Requirements


    This specification requires that a Java EE product provide support for enterprise
    beans as specified in the EJB specification. The EJB specification is available
    at http://jcp.com/en/jsr/summary?id=345.


    This specification does not impose any additional requirements at this time. Note
    that the EJB specification includes the specification of the EJB interoperability
    protocol based on RMI-IIOP. Support for the EJB interoperability protocol is Proposed
    in Java EE 8. All containers that support EJB clients must be capable of using
    the EJB interoperability protocol to invoke enterprise beans. All EJB containers
    must support the invocation of enterprise beans using the EJB interoperability
    protocol. A Java EE product may also support other protocols for the invocation
    of enterprise beans.


    A Java EE product may support multiple object systems (for example, RMI-IIOP and
    RMI-JRMP). It may not be possible to pass object references from one object system
    to another object system. However, when an enterprise bean is using the RMI-IIOP
    protocol, it must be possible to pass object references for RMI-IIOP or Java ID
