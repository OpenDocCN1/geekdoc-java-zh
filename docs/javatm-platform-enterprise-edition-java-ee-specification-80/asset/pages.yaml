  md: '# EE.2.7.10 JavaMail™


    Many Internet applications require the ability to send email notifications, so
    the Java EE platform includes the JavaMail API along with a JavaMail service provider
    that allows an application component to send Internet mail. The JavaMail API has
    two parts: an application-level interface used by the application components to
    send mail, and a service provider interface at the Java EE SPI level.


    # EE.2.7.11 JavaBeans™ Activation Framework (JAF)


    The JAF provides a framework for handling data in different MIME types, originating
    in different formats and locations. The JavaMail API makes use of the JAF API.
    The JAF API is included in Java SE and so is available to Java EE applications.


    # EE.2.7.12 XML Processing


    The Java™ API for XML Processing (JAXP) provides support for the industry standardX
    and DOM APIs for parsing XML documents, as well as support for XSLT engines. The
    Streaming API for XML (StAX) provides a pull-parsing API for XML. The JAXP and
    StAX APIs are included in Java SE and so are available to Java EE applications.


    # EE.2.7.13 Java EE™ Connector Architecture


    The Connector architecture is a Java EE SPI that allows resource adapters that
    support access to Enterprise Information Systems to be plugged in any Java EE
    product. The Connector architecture defines a standard of system-level contracts
    between a Java EE server and a resource adapter. The standard contracts include:


    +   - A connection management contract that lets a Java EE server pool connections
    to an underlying EIS, and lets application components connect to an EIS. This
    leads to a scalable application environment that can support a large number of
    clients requiring access to EIS systems.

