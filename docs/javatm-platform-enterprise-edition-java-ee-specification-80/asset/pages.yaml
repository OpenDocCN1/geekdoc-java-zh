- pgno: 128
  md: 'The Application Assembler uses the message-destination element to specify a
    logical destination within the application. The message-destination-element defines
    a message-destination-name, which is used for the purpose of linking.


    The Application Assembler uses the message-destination-link element of the message-destination-ref
    element of an application component that produces messages to link it to the target
    destination. The value of the message-destination-link element is the name of
    the target destination, as defined in the message-destination-name element of
    the message-destination-element. The message-destination element can be in any
    module in the Java EE application as the referencing component. The Application
    Assembler uses the message-destination-usage element of the message-destination-ref
    element to indicate that the referencing application component produces messages
    to the referred destination.


    If the consumer of messages from the common destination is a message-driven bean,
    the Application Assembler uses the message-destination-link element to reference
    the logical destination. The Application Assembler links a message-driven bean
    to its source destination, or he should use the message-destination-type element
    of the message-destination to specify the expected destination type. Otherwise,
    the Application Assembler uses the message-destination-link element of the message-destination-ref
    element of the application component that consumes messages to link to the common
    destination. In the latter case, the Application Assembler uses the message-destination-usage
    element of the message-destination-ref element to indicate that the application
    component consumes messages from the referred destination.


    To avoid the need to rename destinations to have unique names in an entire EE
    application, the Application Assembler may use the following syntax in the message-destination-link
    element of the referencing application component. The Application Assembler specifies
    the path name of the JAR file containing the referenced message and appends the
    message-destination-name of the target destination separated by #. The path name
    is relative to the referencing application JAR file. In this manner, multiple
    destinations with the same message-destination-name may be uniquely identified.


    When linking message destinations, the Application Assembler must ensure that
    the consumers and producers for the destination require a message destination
    of the same or compatible type, as determined by the messaging system.'
