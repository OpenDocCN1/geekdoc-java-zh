    Remote interface to a method on an RMI-IIOP or Java ID object, or to return such
    an enterprise object reference as a return value from such an RMI-IIOP or Java
    ID object.


    In a Java EE product that includes both an EJB container and a web container,
    both containers are required to support access to local enterprise beans. No support
    is provided for access to local enterprise beans from the application container
    or the applet container.'
