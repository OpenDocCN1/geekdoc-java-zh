  md: '# EE.3.4.2.2 SSL Mutual Authentication


    TLS 1.2 and the means to perform mutual (client and server) certificate-based
    authentication are required by this specification.


    All Java EE products must support TLS 1.1 and TLS 1.0, to ensure interoperable
    secure communications with clients; however, TLS 1.0 should be disabled if not
    needed for a given deployment, and TLS 1.1 may be disabled if not needed.


    Similarly, all Java EE products must support the following cipher suites, to ensure
    interoperable secure communications with clients:


    +   * TLS_RSA_WITH_AES_128_CBC_SHA

    * TLS_DHE_RSA_WITH_AES_128_CBC_SHA

    * TLS_ECDH_RSA_WITH_AES_128_CBC_SHA

    * TLS_ECDH_ECDSA_WITH_AES_128_CBC_SHA

    * TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA

    * TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA


    However, it is recommended to use the strongest cipher suite that can be negotiated
    between client and server, and the above cipher suites may be disabled in favor
    of stronger cipher suites, if not needed for a given deployment.


    Note that previous versions of this specification required support for SSL 3.0,
    and for the following cipher suites:


    +   * TLS_RSA_WITH_RC4_128_MD5

    * SSL_RSA_WITH_RC4_128_MD5

    * TLS_DHE_SSS_WITH_3DES_EDE_CBC_SHA

    * TLS_DHE_SSS_WITH_3DES_EDE_CBC_SHA

    * TLS_RSA_EXPORT_WITH_RC4_40_MD5

    * SSL_RSA_EXPORT_WITH_RC4_40_MD5

    * TLS_DHE_SSS_EXPORT_WITH_DES40_CBC_SHA

    * TLS_DHE_SSS_EXPORT_WITH_DES40_CBC_SHA


    SSL 3.0 was officially deprecated by RFC 7568 in 2015, and is unsupported or disabled
    by many TLS implementations. None of the above cipher suites is currently considered
    secure, and may be unsupported or disabled by default. In extreme cases, it may
    be necessary to use SSL 3.0, or to negotiate one of the above cipher suites, in
    order to operate with an older client or a previous version of Java EE. However,
    it is recommended to use TLS 1.0 or higher, and to negotiate a stronger cipher
    suite, whenever possible. SSL 3.0, and the above listed cipher suites, should
    be disabled if not needed for interoperability in a given deployment.'
