    # EE.5.18.2.3 Quality of Service Elements


    Quality of service elements may be altered by the Deployer. The Java EE Product
    Provider is permitted to impose restrictions upon quality of service elements
    in accordance with its implementation limits and quality of service guarantees.
    If quality of service values that have been specified do not meet these restrictions,
    the Product Provider must not reject the deployment (but must instead use appropriate
    values).


    # EE.5.18.2.4 Properties


    All resource definition annotations and XML elements support the use of property
    elements (elements named "properties" or "property"). A Java EE Product Provider
    is permitted to reject a deployment if a property that it recognizes has a value
    that it does not support. A Java EE Product Provider must not reject a deployment
    on the basis of a property that it does not recognize.


