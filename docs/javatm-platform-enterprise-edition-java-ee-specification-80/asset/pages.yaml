    Java technologies.


    # EE.6.1 Required APIs


    Java EE application components execute runtime environments provided by the containers
    that are a part of the Java EE platform. The full Java EE platform supports four
    types of containers corresponding to Java EE application types: application client
    containers; applet containers; web containers for servlets, JSP pages, JSF applications,
    JAX-RS applications; and enterprise bean containers. A Java EE profile may only
    support a subset of these component types, defined by the individual Java EE profile
    specification.


    The per-technology requirements in this chapter apply to any Java EE product that
    includes the technology. Note that even though a Java EE profile might not require
    support for a particular technology, a Java EE product based on Java EE profile
    might nonetheless include support for the technology. In such a case, the requirements
    for that technology described in this chapter would apply.


