  md: '# CHAPTER EE.3

    Security


    His chapter describes the security requirements for the Java™ Platform, Enterprise
    Edition (Java EE) that must be satisfied by Java EE products.

    In addition to the Java EE requirements, each Java EE Product Provider will determine
    the level of security and security assurances that will be provided by their implementation.


    # EE.3.1 Introduction


    Almost every enterprise has security requirements and specific mechanisms and
    infrastructure to meet them. Sensitive resources that can be accessed by many
    users or often traverse unprotected networks (such as the Internet) need to be
    protected.

    Although the quality assurances and implementation details may vary, they share
    some of the following characteristics:


    +   * **Authentication**: The means by which communicating entities (for example,
    client and server) prove to one another that they are acting on behalf of specific
    identities that are authorized for access.

    * **Access control for resources**: The means by which interactions are limited
    to collections of users or programs for the purpose of enforcing integrity, confidentiality,
    or availability constraints.

    * **Data integrity**: The means used to prove that information has not been modified
    by a third party (some other entity than the source of information). For example,
    a recipient of data sent over an open network may be able to detect and discard
    messages that were modified after they were sent.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '+   - Confidentiality or Data Privacy: The means used to ensure information
    is made available only to users who are authorized to access it.

    - Non-repudiation: The means used to prove that a user performed some action that
    the user cannot reasonably deny having done so.

    - Auditing: The means used to capture a tamper-resistant record of security related
    events for the purpose of being able to evaluate the effectiveness of security
    policies and mechanisms.


    This chapter specifies how Java EE platform requirements address security requirements,
    and identifies requirements that may be addressed by Java EE Product Providers.
    Finally, issues being considered for future versions of this specification are
    briefly mentioned in Section EE.3.7, “Future Directions”.


