    descriptor for the module. If not set, the name of the module is the pathname
    of the module in the ear file with filename extension (.jar, .war, .rar) removed,
    without any directory names included. The name of a module must be unique within
    an application. And and only if the name is not unique (e.g., two names are identical
    after removing different filename extensions) the deployment tool may choose new
    unique names for any of the conflicting modules; module names that do not conflict
    must not be changed. The algorithm for choosing unique names in such a case is
