    # EE.6.2.3.8 Context Class Loader


    This specification requires that Java EE containers provide a thread class loader
    for the use of system or library classes in dynamically loading classes provided
    by the application. The EJB specification requires that all EJB client containers
    provide a per thread class loader for dynamically loading class values. The per
    thread context class loader is used using the Thread method getgetClassLoader.


    The classes used by an application will typically be loaded by a hierarchy of
    class loaders. There may be a top level application class loader, an extension
    class loader, and so on, down to a system class loader. The top level application
    class delegates to the lower class loaders as needed. Classes loaded by lower
    class loaders, such as portable EJB system value classes, need to be able to discover
    the top application class loader used to dynamically load application classes.


    This specification requires that containers provide a per thread class loader
    that can be used to load top level application classes as described above. See
    EE.8.2.5, "Dynamic Class Loading" for recommendations for libraries that dynamically
    load classes.


    # EE.6.2.3.9 Java™ Authentication and Authorization Service (JAAS) Requirements


    All EJB containers and all web containers must support the use of the JAAS APIs
    as specified in the Connector specification. All application client containers
    must support the use of the JAAS APIs as specified in Chapter EE.10, "Application
    Clients."


    A reference guide to the JAAS APIs is available at http://docs.oracle.com/javase/8/docs/technotes/guides/security/jaas/JAASRefGuide.html.


