  md: '![](img/2d0d59290c8adb2789da0c25757ad1d3_71_0.png)


    # Figure EE.4-1 Servlets/JSP Pages Accessing Enterprise Beans


    The Application Component Provider specifies, using a combination of programmatic
    and declarative transaction demarcation APIs, how the platform must manage transactions
    on behalf of the application.


    For example, the application may require that all the components in Figure EE.4-1
    access resources as part of a single transaction. The Platform Provider must provide
    the transaction capabilities to support such a scenario.


    This specification does not define how the components and the resources are partitioned
    or distributed within a single Java EE product. In order to achieve the transactional
    semantics required by the application, the Java EE Product Provider is free to
    execute the application components sharing a transaction in the same Java virtual
    machine, or distribute them across multiple virtual machines, in accordance with
    the requirements of the component specifications.


    The rest of this chapter describes the transactional requirements for a Java EE
    product in detail.


    Java EE 8, Final Release'
