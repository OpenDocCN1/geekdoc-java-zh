    # EE.3.3  Security Architecture


    This section describes the Java EE security architecture on which the security
    requirements defined by this specification are based.


    # EE.3.3.1  Goals


    The following are goals for the Java EE security architecture:


    +   1. Portability: The Java EE security architecture must support the Write Once,
    RunAnywhere™ application property.

    2. Transparency: Application Component Providers should not have to know anything
    about security to write an application.

    3. Isolation: The Java EE platform should be able to perform authentication and
    access control according to instructions established by the Deployer using deployment
    attributes, and managed by the System Administrator.

    Note that divorcing the application from responsibility for security ensures greater
    portability of Java EE applications.

    4. Extensibility: The use of platform services by security-aware applications
    must not compromise application portability.

    This specification provides APIs in the component programming model for interacting
    with container/server security information. Applications that restrict their interactions
    to the provided APIs will retain portability.

    5. Flexibility: The security mechanisms and declarations used by applications
    this specification should not impose a particular security policy, but facilitate
    the implementation of security policies specific to the Java EE installation or
    application.

    6. Abstraction: An application’s security requirements will be logically specified
    using Java language annotations or deployment descriptors. Java language annotations
    or deployment descriptors will specify how security roles and access requirements
    are to be mapped into environment-specific se-'
