    # EE.10.4 Resources, Naming, and Injection


    As with Java EE components, application clients use JNDI to look up enterprise
    beans, get access to resource managers, reference configurable parameters at deployment
    time, and so on. Application clients use the java:JNDI namespace to access these
    items (see Chapter EE.5, "Resources, Naming, and Injection" for details).


    Injection is also supported for the application client main class. Because the
    application client container does not create instances of the application client
    main class, merely loads the class and invokes the static main method, injection
    into the application client class uses static fields and methods, unlike other
    Java EE components. Injection occurs before the main method is called.


    # EE.10.5 Application Programming Interfaces


    Application clients have all the facilities of the Java™ Platform, Standard Edition
    (subject to security restrictions), as well as various standard extensions, as
    described in Chapter EE.6 "Application Programming Interface." Each application
    client executes in its own Java virtual machine. Application clients start execution
    of the main method of the class specified in the Main-Class attribute in the manifest
    file of the application client''s JAR file (although note that application client
    container will typically execute before the application client itself, in order
    to prepare the environment of the container, install a SecurityManager, initialize
    the name service client library, and so on).


    # EE.10.6 Packaging and Deployment


    Application clients are packaged in JAR format with a .jar extension and may include
    a deployment descriptor similar to other Java EE components. The deployment descriptor
    describes the enterprise beans, web services, and other types of external resources
    referenced by the application. If the deployment descriptor is not included, or
    is included but marked metadata-complete, annotations on the main class of the
    application client may also be used to describe the resources needed by the application.
    As with other Java EE application'
