- pgno: 208
  md: '# CHAPTER EE.7


    # Interoperability


    This chapter describes the interoperability requirements for the JavaTM Platform,
    Enterprise Edition (Java EE).


    # EE.7.1 Introduction to Interoperability


    The Java EE platform will be used by enterprise environments that support clients
    of many different types. The enterprise environments will add new services to
    existing Enterprise Information Systems (EISs). They will be using various hardware
    platforms and applications written in various languages.


    In particular, the Java EE platform may be used in enterprise environments to
    bring together any of the following kinds of applications:


    +   - applications written in languages such as C++ and Visual Basic.

    - applications running on a personal computer platform, or Unix® workstation.

    - standalone Java technology-based applications that are not directly supported
    by the Java EE platform.


    It is the interoperability requirements of the Java EE platform, set out in this
    chapter, that make possible for it to provide indirect support for various types
    of clients, different hardware platforms, and a multitude of software applications.
    The interoperability features of the Java EE platform permit the underlying disparate
    systems to work together seamlessly, while hiding much of the complexity required
    to join these pieces together.


    The interoperability requirements for the current Java EE platform release allow:'
  merge: -1
  img_proc: true
- pgno: 209
  md: '+   • Java EE applications to connect to legacy systems using CORBA or low-level
    socket interfaces.


    +   • Java EE applications to connect to other Java EE applications across multiple
    Java EE products, whether from different Product Providers or from the same Provider,
    and multiple Java EE platforms.


    In this version of the specification, interoperability between Java EE applications
    running in different platforms is accomplished through the HTTP protocol, possibly
    using SSL, or the EJB interoperability protocol based on IIOP.


    # EE.7.2 Interoperability Protocols


    This specification requires that a Java EE product support a standard set of protocols
    and formats to ensure interoperability between Java EE applications and with other
    applications that also implement these protocols and formats. The specification
    requires support for the following groups of protocols and formats:


    +   • Internet and web protocols


    +   • OMG protocols


    +   • Java technology protocols


    +   • Data formats


    Most of these protocols and formats are supported by Java SE and by the underlying
    operating system.


    # EE.7.2.1 Internet and Web Protocols


    Standards based Internet protocols are the means by which different pieces of
    the platform communicate. The Java EE platform typically supports the following
    Internet protocols, as described in the corresponding technology specifications:


    +   • TCP/IP protocol family—This is the core component of Internet communication.
    TCP/IP and UDP/IP are the standard transport protocols for the Internet. TCP/IP
    is supported by Java SE and the underlying operating system.


    +   • HTTP 1.1—This is the core protocol of web communication. As with TCP/IP,
    HTTP 1.1 is supported by Java SE and the underlying operating system. A Java EE
    web container must be capable of advertising its HTTP services on the standard
    HTTP port, port 80.


    Java EE 8, Final Release'
  merge: -1
  img_proc: true
- pgno: 210
  md: '+   HTTP/2—Server-side support for the HTTP/2 protocol is required by the Servlet
    specification.


    +   SSL 3.0, TLS 1.2—SSL 3.0 (Secure Socket Layer) represents the security layer
    for Web communication. It is available indirectly when using https URL as opposed
    to the http URL. A Java EE container must be capable of advertising its HTTPS
    service on the standard HTTPS port, port 443. Note that SSL 3.0 and only TLS 1.0
    are required as part of the EJB interoperability protocol in the EJB.


    +   SOAP 1.1—SOAP is a presentation layer protocol for the exchange of XML messages.
    For SOAP layered over HTTP is required, as is described in the JAX-RPC and JAX-WS
    specifications.


    +   SOAP 1.2—SOAP 1.2 is the version of the SOAP protocol standardized through
    W3C and supported by JAX-WS.


    +   WS-I Basic Profile 1.1—The WS-I Basic Profile, in combination with the Simple
    SOAP Binding and Attachment Profile, describes interoperability requirements for
    the use of SOAP 1.1, WSDL 1.1, and MIME-based SOAP with Attachments. It is required
    by the JAX-RPC and JAX-WS specifications.


    +   WebSocket protocol—The WebSocket protocol enables two-way communication layered
    over TCP. It enables bi-directional communication over a single connection established
    by an initial HTTP handshake and upgrade request. The WebSocket protocol has been
    standardized by IETF under RFC 6455.


    # EE.7.2.2


    # OMG Protocols (Proposed Optional)


    This specification requires a full Java EE product to support the following Object
    Management Group (OMG) based protocols:


    +   IIOP (Internet-ORB Protocol)—Supported by Java IDL and RMI-IIOP in Java SE.
    Java IDL provides standards-based interoperability and connectivity through the
    Common Object Request Broker Architecture (CORBA). CORBA specifies the Object
    Request Broker (ORB) which allows applications to communicate with each other
    regardless of location. This interoperability is delivered through IIOP, and is
    typically found in an intranet setting. IIOP can be used as an RMI protocol using
    the RMI-IIOP technology. IIOP is defined in'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Chapters 13 and 15 of the CORBA 2.3.1 specification, available at http://omg.org/cgi-bin/doc?formal/99-10-07.


    +   EJB interoperability protocol—The EJB interoperability protocol is based on
    IIOP (GIOP 1.2) and the CSiv2 CORBA Secure Interoperability specification. The
    EJB interoperability protocol is defined in the EJB specification.


    +   CORBA Interoperable Naming Service protocol—The COSNaming-based INS protocol
    is an IIOP-based protocol for accessing a name service. The EJB interoperability
    protocol requires the use of the INS protocol for lookup of EJB objects using
    the JND API. In addition, it must be possible to use the Java IDL COSNaming API
    to access the name service. All Java EE products provide a name service that meets
    the requirements of the Interoperable Naming Service specification, available
    at http://omg.org/cgi-bin/doc?formal/2000-06-19 may be provided as a separate
    name server or gateway to another name service. Either approach is consistent
    with this specification.


    # EE.7.2.3 Java Technology Protocols


    This specification requires the Java EE platform to support the JRMP protocol,
    which is the Java-specific Remote Method Invocation (RMI) protocol. JRMP is a
    required component of Java SE and is one of two required RMI protocols (IIOP is
    the other required RMI protocol, see above.)


    JRMP is a distributed object model for the Java programming language. Distributed
    systems, running in different address spaces and on different hosts, must be able
    to communicate with each other. JRMP permits program-level objects in different
    address spaces to invoke remote objects using the semantics of the Java programming
    language object model.


    Complete information on the JRMP specification can be found at http://docs.oracle.com/java/8/docs/technotes/guides/rmi.


    # EE.7.2.4 Data Formats


    In addition to the protocols that allow communication between components, this
    specification requires Java EE platform support for a number of data formats.
    This formats provide the definition for data exchanged between components.


    The following data formats must be supported:


    +   XML 1.0—The XML format can be used to construct documents, RPC messages, etc.
    The JAXP API provides support for processing XML format data.


    Java EE 8, Final Release'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'The JAX-RPC API provides support for XML RPC messages, as well as a mapping
    between Java classes and XML.


    +   JSON—JSON is a language-neutral plain text format commonly used to transfer
    structured data between a server and web application. The JSON-P API provides
    support for the parsing, generation, transformation, and querying of JSON text.
    The JSON-B API provides support for mapping between JSON text and Java objects.


    +   HTML 4.01—This represents the minimum web browser document format. While all
    Java EE APIs with the exception of JSF are agnostic to the version of the browser
    document format, Java EE web clients are able to display HTML 4.01 documents.


    +   Image formats—The Java EE platform supports GIF, JPEG, and PNG images. Support
    for these formats is provided by the java.awt.image APIs (the URL: http://docs.oracle.com/javase/8/docs/api/java/awt/package-summary.html)
    and by Java EE clients.


    +   JAR files—JAR (Java Archive) files are the standard packaging format for Java
    technology-based application components, including the ej-jar-specialized format,
    the (RAR), and the Java EE enterprise application archive (EAR) format. JAR is
    a platform-independent file format that permits many files to be aggregated into
    one file. This allows multiple Java components to be bundled into one JAR file
    and file formats are supported by the java.util.jar and java.util.zip packages.
