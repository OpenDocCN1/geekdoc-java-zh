    HTTP Basic Authentication is the authentication mechanism supported by the HTTP
    protocol. This mechanism is based on a username and password. A web server requests
    a web client to authenticate the user. As part of the request, the web server
    passes the *realm* in which the user is to be authenticated. The web client obtains
    the username and the password and transmits them to the web server. The web server
    authenticates the user in the specified realm (referred to as HTTP Realm Realm
    in this document).

    HTTP Basic Authentication is not secure. Passwords are sent in simple base64 encoding.
    The target server is not authenticated. Additional protection can be applied to
    overcome these weaknesses. The password may be protected by applying security
    at the transport layer (for example HTTPS) or at'
