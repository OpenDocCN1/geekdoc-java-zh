- pgno: 278
  md: '# EE.A.7 Java EE 5 Application XML Schema


    The XML grammar for a Java EE application deployment descriptor is defined by
    the Java EE application schema. The root element of the deployment descriptor
    for a Jaav EE application is application. The granularity of composition for Java
    EE application assembly is the Java EE module. A Java EE deployment descriptor
    contains a name and description for the application and the URI of a UI icon for
    the application, as well as a list of the Java EE modules that compose the application.
    The content of the XML elements is in general case sensitive. This means, for
    example, that <role-name>Manager</role-name> is a different role than <role-name>role</role-name>.


    A valid Java EE 5 deployment descriptors must conform to the XML Schema definition.

    The deployment descriptor must be named META-INF/application.xml in the file.
    Note that this name is case-sensitive.


    Figure EE.A-5 shows a graphic representation of the structure of the Java EE application
    XML Schema.


    ![](img/2d0d59290c8adb2789da0c25757ad1d3_278_0.png)


    Figure EE.A-5 Java EE Application XML Schema Structure


    The XML Schema located at http://java.sun.com/ns/javaee/application_5.xsd defines
    the XML grammar for a Java EE application deployment descriptor.'
