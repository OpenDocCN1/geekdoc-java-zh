  md: '# EE.8.2.6 Examples


    The following example illustrates a simple use of the bundled library mechanism
    to reference a library of utility classes chosen that are shared between enterprise
    beans in two separate ejb-jar files.


    ```

    app1.ear:

    META-INF/application.xml

    ejb1.jar Class-Path: util.jar

    ejb2.jar Class-Path: util.jar

    util.jar

    ```


    The next example illustrates a more complex use of the Class-Path mechanism. In
    this example the Developer has chosen to package the enterprise bean client classes
    in a separate JAR file and reference that JAR file from the other JAR files that
    need those classes. Those classes are also needed ejb2.jar, packaged in the same
    application as ejb1.jar, and by ejb3.jar and servlet1.jar, packaged in a different
    application. Those classes are also needed by ejb1.jar itself because they define
    the remote interface of the enterprise beans in ejb1.jar, and the developer has
    chosen the reference model of making these classes available, as described in
    the EJB spec. The deployment descriptor for ejb1.jar names the client JAR file
    in the ejb-client-jar.


    The Class-Path must be used by components in app2.ear to reference the client
    JAR file that corresponds to the enterprise beans packaged in ejb1.jar. Enterprise
    beans are referenced by enterprise beans in ejb3.jar and by the servlets packaged
    in webapp.war.


    ```

    app2.ear:

    META-INF/application.xml

    ejb1.jar Class-Path: ejb1_client.jar

    deployment descriptor contains:

    <ejb-client-jar>ejb1_client.jar</ejb-client-jar>

    ejb1.jar

    ejb2.jar Class-Path: ejb1_client.jar

    ```


    ```

    app3.ear:

    META-INF/application.xml

    ejb1_client.jar

    Class-Path: ejb1_client.jar

    ejb3.jar Class-Path: ejb1_client.jar

    webapp.war Class-Path: ejb1_client.jar

    WEB-INF/web.xml

    WEB-INF/lib/servlet1.jar

    ```'
