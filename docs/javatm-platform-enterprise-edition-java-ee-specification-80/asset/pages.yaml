    # ## EE.5.18.1 Guidelines


    The following guidelines should be observed with regard to the specification of
    values for resource definition elements.


    +   * In general, the Application Component Provider or Assembler should specify
    values for elements which, if changed, would cause the application to break—for
    example, JNDI name, isolation level. If multiple resource definitions are specified
    for a given resource, they must be consistent.

    * The Java EE Product Provider may choose server-specific default values for optional
    elements for which values have not been specified.


    # ## EE.5.18.2 Requirements Common to All Resource Definition Types


    The following requirements apply to the resource definitions described in Sections
    5.18.3 through 5.18.8.


    When an Application Component Provider or Application Assembler specifies connectivity
    information to a "physical" resource through a resource definition annotation
    or deployment descriptor element, it is assumed that the physical resource exists.
    The automatic provisioning of resources may be supported by an implementation
    of this specification, but support for this functionality is not required. If
    automatic provisioning of resources is not supported, it is the Deployer''s responsibility
    (possibly in conjunction with the System Administrator) to insure that the physical
    resource is provisioned for the application.


    # ### EE.5.18.2.1 JNDI Name


    The Deployer and Java EE Product Provider must not alter the specified JNDI name.
    The requested resource must be made available in JNDI under the specified name.


