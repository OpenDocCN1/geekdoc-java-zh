  md: '# EE.3.4.5 Resource Authentication Requirements


    Resources within an enterprise are often deployed in security policy domains different
    from the security policy domain of the application component. The wide variance
    of authentication mechanisms used to authenticate the caller leads to the requirement
    that a Java EE product provides the means to authenticate in the security policy
    domain of the resource.


    A Product Provider must support the following:


    +   1. **Configured Identity.** A Java EE container must be able to authenticate
    for the resource using a principal and authentication data specified by a Developer
    at deployment time. The authentication must not depend in any way on data provided
    by the application components. Providing for the confidential storage of the authentication
    information is the responsibility of the Product Provider.


    +   2. **Programmatic Authentication.** The Java EE product must provide specification
    of the principal and authentication data for a resource by the application component
    at runtime using appropriate APIs. The application may obtain the principal and
    authentication data through a variety of mechanisms, including them as parameters,
    obtaining them from the component''s environment, and so forth.


    In addition, the following techniques are recommended but not required by this
    specification:


    +   3. **Principal Mapping.** A resource can have a principal and attributes that
    are determined by a mapping from the identity and security attributes of the requester.
    In this case, a resource principal is not based on inheritance of the identity
    or security attributes from a requesting principal, but gets its identity and
    security attributes from the mapping.


    +   4. **Caller Impersonation.** A resource principal acts on behalf of a requesting
    principal. Acting on behalf of a caller requires delegation of the caller''s identity
    and credentials to the underlying resource manager. In some scenarios, a requesting
    principal can be a delegate of an initiating principal and the resource principal
    is transitively impersonating an initiating principal.

    The support for principal delegation is typically specific to a security mechanism.
    For example, Kerberos offers a mechanism for the delegation of authentication.
    (Refer to the Kerberos v5 specification for more details.)


    +   5. **Credentials Mapping.** This technique may be used when an application
    server and an EIS support different authentication domains. For example:


