- pgno: 234
  md: '# EE.8.5 Deployment


    The Java EE platform supports three types of deployment units:


    +   - Stand-alone Java EE modules.

    - Java EE applications, consisting of one or more Java EE modules.

    - Class libraries packaged as .jar files according to the Extension Mechanism
    Architecture. These class libraries then became installed.


    Any Java EE product must be able to accept a Java EE application delivered as
    a .ear file or a stand-alone Java EE module delivered as a .jar, .war, or .rar
    file (appropriate to its type), together with an optional deployment descriptor
    external for the application or standalone Java EE module. If the application
    is delivered as a .ear, an enterprise bean module delivered as a .jar file, a
    web application delivered as a .war file, or an application client delivered as
    a .jar file, the deployment tool must be able to deploy the application such that
    the Java classes in the application are in a separate namespace from other Java
    applications. Typically this will require the use of a separate class loader for
    each application. Standalone resource adapters delivered in .rar files and standalone
    class libraries delivered in .jar files that become installed libraries of no
    necessarily appear in the class namespaces of any application depending on the
    effort, and may appear in the class namespace of any level of isolation supported
    by the Java EE product.


    As described in Section EE.2.10, "Java EE Product Packaging", the Java EE product
    might depend on external services to meet the requirements of this specification.
    While the Java EE product is not required to ensure the availability of these
    services, it is required to ensure that these services have been configured for
    use. Deployment of applications must fail if such services have not been configured
    for use.


    Deployment may provide an option that controls whether or not an application is
    attempted to be started during deployment. If no such option is provided or if
    the option to start the application is specified, and if deployment is successful,
    the application modules must be initialized as specified in section 8.5.4 and
    the application must be started.


    If the application is attempted to be started during deployment, the Servlet and
    EJB containers must be initialized during deployment. Such initialization must
    include CDI initialization. If initialization fails, deployment must fail.


    If the application is not attempted to be started during deployment, these containers
    must not be initialized during deployment.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'In all cases, the deployment and initialization of a Java EE application must
    be complete before the container delivers client requests to any of the application''s
    components. The container must first initialize all startup-time singleton bean
    components before delivering any requests to enterprise bean components. Containers
    must deliver requests to web components and resource adapters only after initialization
    of the component has completed.


    The Java EE Deployment API describes how a product-independent deployment tool
    accepts plugins for a specific Java EE product, and how those plugins cooperate
    to deploy Java EE applications. The requirements in this specification that refer
    to a deployment tool are meant to refer to the combination of any vendor-provided
    product-independent deployment tool and the vendor-specific deployment plugin
    for this tool, as well as any other vendor-specific deployment tools provided
    with the Java EE product.


    Typically a deployment tool will copy the deployed application or module to a
    product-specific location, along with the configuration settings and customizations
    provided by the Deployer. In some cases a deployment tool might include Assembly
    functionality well, allowing the Deployer to construct, modify, or customize the
    application before deployment. Still, it must be possible to deploy a portable
    Java EE application, module, or library containing no product-specific deployment
    information without modifying the original files or artifacts that the Deployer
    specified to the deployment.


    The deployment tools for Java EE containers must validate the deployment descriptors
    against the Java EE descriptor schemas or DTDs that correspond to the deployment
    descriptors being processed. The architecture schema or DTD is chosen by analyzing
    the deployment descriptor to determine which version it claims to conform to.
    Validation errors must cause an error to be reported to the Deployer. The deployment
    tool may allow the Deployer to correct the error and continue deployment. Note
    that the deployment descriptor version refers only to the XML schema or DTD against
    which the descriptor is to be validated. It does not provide any information as
    to what version of the Java EE platform the application is written to.


    Some deployment descriptors are optional. The required deployment information
    is determined by default rules or by annotations present on application class
    files. Some deployment descriptors that are included in an application may exist
    in either complete or incomplete form. A complete deployment descriptor provides
    a complete description of the deployment information; a deployment tool must not
    examine class files for this deployment information. An incomplete deployment
    descriptor provides only a subset of the


