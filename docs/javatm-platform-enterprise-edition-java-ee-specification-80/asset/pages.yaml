    # EE.3.3.4.1 Declarative Security


    Declarative security refers to the means of expressing an application''s security
    structure, including security roles, access control, and authentication requirements
    in non-programmatic form. Java language annotations and the deployment descriptor
    are the primary methods for declarative security in the Java EE platform.


    Java language annotations and the deployment descriptor are a contract between
    an Application Component Provider and a Deployer or Application Assembler. They
    can be used by an application programmer to represent an application''s security
    related environmental requirements. A deployment descriptor can be associated
    with groups of components.


    A Deployer maps the declarative representation of the application''s security
    policy to a security structure specific to the particular environment. A Deployer
    uses a tool to process the annotations and deployment descriptor.


    At runtime, the container uses the security policy security structure derived
    from the declarative security information expressed in annotations and the deployment
    descriptor and configured by the Deployer to enforce authorization (see Section
    EE.3.3.6, "Authorization Model").


    # EE.3.3.4.2 Programmatic Security


    Programmatic security refers to security decisions made by security awareness
    applications. Programmatic security is useful when declarative security alone
    is not sufficient to express the security model of the application. The API for
    programmatic security consists of methods of the Java EE Security API Context,
    methods of the EJBContext and the servlet HttpServletRequest interface. The methods
    of the Java EE Security API Context are intended to supersede the corresponding
    methods of the EJBContext and HttpServletRequest interfaces.


