  md: 'The XML Schema located at http://java.sun.com/xml/javaee/application_6.xsd
    defines the XML grammar for a Java EE application deployment descriptor.


    # EE.A.5 Common Java EE XML Schema Definitions


    The XML Schema located at http://java.sun.com/xml/javaee/javaee_6.xsd defines
    types that are used by many other Java EE deployment descriptor schemas, both
    in this specification and in other specifications.


    # EE.A.6 Java EE 6 Application Client XML Schema


    The XML grammar for a Java EE application client deployment descriptor is defined
    by the Java EE application-client deployment descriptor for an application client
    is application-client. The root element of the deployment descriptor of the XML
    elements is in general case sensitive. This means, for example, that <res-auth>Container</res-auth>
    must be used, rather than <res-auth>container</res-auth>.


    All valid application-client deployment descriptors must conform to the XML Schema
    definition, or to a DTD or schema definition from a previous version of this specification.
    The deployment descriptor must be named META-INF/application-client.xml in the
    application client’s jar file. Note that this name is case-sensitive.


    Figure EE.A-4 shows the structure of the Java EE application-client XML Schema.
    The Java EE application-client XML Schema is located at http://java.sun.com/xml/ns/javaee/application-client_6.xsd.'
