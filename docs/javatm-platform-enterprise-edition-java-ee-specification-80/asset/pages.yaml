    # EE.3.3.5 Distributed Security


    Some Product Providers may Java EE products in which the containers for various
    component types are distributed. In a distributed environment, communication between
    Java EE components can be subject to security attacks (for example, data modification
    and replay attacks).

    Such threats can be countered by using a secure association to secure communications.
    A secure association is shared security state information that establishes the
    basis of a secure communication between components.

    Establishing a secure association could involve several steps, as:


    +   1. Authenticating the target principal to the client and/or authenticating
    the client to the target principal.

    2. Negotiating a quality of protection, such as confidentiality or integrity.

    3. Setting up a security context for the association between the components.


    Since a container provides security in Java EE, secure associations for a component
    are typically established by a container. Secure associations for web access are
    specified here. Secure associations for access to enterprise beans are described
    in the EJB specification.

    Product Providers may allow for control over the quality of protection or other
    aspects of secure association at deployment time. Applications can specify their
    requirements for access to web resources using annotations or elements in their
    deployment descriptor.

    This specification does not define mechanisms that an Application Component Provider
    use to communicate requirements for secure associations with an enterprise bean.


    # EE.3.3.6 Authorization Model


    The Java EE authorization model is based on the concept of security roles. A security
    role is a logical grouping of users that is defined by an Application Component
    Provider or Assembler. A Deployer maps roles to security identities for example
    principals, and groups) in the operational environment. Security roles are used
    with both declarative security and programmatic security.'
