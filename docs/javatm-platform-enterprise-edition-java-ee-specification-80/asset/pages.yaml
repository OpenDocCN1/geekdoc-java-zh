    the user when the application is started. The container may delay authentication
    until there is a request to access a protected resource or enterprise bean.


    The container will provide an appropriate user interface for interactions with
    the user to gather authentication data. In addition, an application client may
    provide a class that implements


    javax.security.auth.callback.Callback interface and specify the class name in
    its deployment descriptor (see Section EE.10.7, “Java EE Application Client XML
    Schema” for details). The Deployer may override the callback handler specified
    by the application and require use of the container’s default authentication user
    interface.


