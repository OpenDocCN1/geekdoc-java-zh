    in the Servlet specification.


    # EE.3.4.4.3 Unauthenticated Access


    Web containers are required to support access to web resources by clients that
    have not authenticated them to the container. This is the common mode of access
    to web resources on the Internet.


    A web container reports that no user has been authenticated by returning null
    from the SecurityContext method getCallerPrincipal() or the HttpServlet method
    getUserPrincipal(). This is different from the result of the EJBContext method
    getCallerPrincipal(). The EJB specification requires the EJBContext method getCallerPrincipal()
    always returns a valid Principal object. This can never return null. The SecurityContext
    method getCallerPrincipal() can also be called in the EJB container, and still
    returns null for anonymous users.


    In Java EE products that contain both a web container and an EJB container, components
    running in a web container must be able to call enterprise beans when no user
    has been authenticated in the web container. When a call is made in such a case
    from a component in a web container to an enterprise bean, a Java EE product must
    provide a principal for use in the call.


    A Java EE product may provide a principal for use by unauthenticated callers using
    many approaches, including, but not limited to:


    +   - Always use a single distinguished principal.


    +   - Use a different distinguished principal per server, or per session, or per
    application.


    +   - Allow the deployer or system administrator to choose which principal to
    use through the Run As capability of the web and enterprise containers.


    This specification does not specify how a Java EE product should choose a principal
    to represent unauthenticated users, although future versions of this specification
    may add requirements in this area. Note that the EJB specification'
