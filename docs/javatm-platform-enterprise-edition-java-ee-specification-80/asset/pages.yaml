- pgno: 199
  md: '# EE.6.11 Web Services for Java EE 1.4 Requirements


    The Web Services for Java EE specification defines the capabilities a Java EE
    application server must support for deployment of web web service endpoints. A
    complete deployment model is defined, including several new deployment descriptors.
    All Java EE products must support the deployment and execution of web services
    as specified by the Web Services for Java EE specification (JSR-109).


    The Web Services for Java EE specification is available at http://jcp.org/en/jsr/detail?id=109.


    # EE.6.12 Java™ API for XML-based RPC (JAX-RPC) 1.1 Requirements (Optional)


    JAX-RPC specification defines client APIs for accessing web services as well as
    techniques for implementing web service endpoints. The Web Services for Java EE
    specification also describes the deployment of JAX-RPC-based services and clients.
    The EJB and Servlet specification also describe aspects of deployment. In Java
    EE products that support JAX-RPC, it must be possible to deploy JAX-RPC-based
    applications using any of these deployment models.


    The JAX-RPC specification describes the support for message handlers that can
    process requests and responses. In general, these message handlers execute in
    the same container and with the same privileges and execution context as the JAX-RPC
    client or endpoint component with which they are associated. These message handlers
    have access to the same JNDI java:comp/env namespace as their associated component.
    Component serializers and deserializers, if supported, are treated as message
    handlers.


    Note that web service annotations injection is supported for JAX-RPC service endpoints
    and handlers. New applications are encouraged to use JAX-WS to take advantage
    of these new facilities that make it easier to write web services.


    The JAX-RPC specification is available at http://jcp.org/en/jsr/detail?id=101.


    # EE.6.13 Java™ API for RESTful Web Services (JAX-RS) 2.1 Requirements


    JAX-RS defines APIs for the development of Web services built according to the
    Representational State Transfer (REST) architectural style.


    Java EE 8, Final Release'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'JAVA API for WEBSOCKET 1.1 (WEBSOCKET) REQUIREMENTS 185


