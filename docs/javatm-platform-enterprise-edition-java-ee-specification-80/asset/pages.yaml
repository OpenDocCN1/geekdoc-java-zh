    # EE.5.18  Resource Definition and Configuration


    In addition to referencing resources as defined in this chapter, an application
    may specify the definition and configuration of resources that it requires in
    its operational environment.


    Each application has a set of “physical” resources and services that it depends
    on (database storage, queuing, mailing, etc.) and which need to be made available
    when it is deployed. Deployed resources may be scoped to the application instance
    or may be shareable. An application may define a dependency upon resources in
    its environment by means of resource definition metadata.


    The specification of resource definition metadata provides information that can
    be used by the application’s deployment to provision and configure the required
    resource. Further, resource definitions allow an application to be deployed into
    a Java EE environment with minimal administrative configuration.


    Resources may be defined in any of the JNDI namespaces described in Section EE.5.2.2,
    “Application Component Environment Namespaces”. For example, a resource may be
