  md: 'loaded directly by a standard class loader should be the target of a Class-Path
    reference; such files are always named with a .jar extension. Top level JAR files
    that are processed by a deployment tool should not contain Class-Path entries;
    such entries would, by definition, reference other files external to the deployment
    unit. A deployment tool is not required to process such external references.


    +   2. A .ear file may contain a directory that contains libraries packed in JAR
    files. The library-directory element of the .ear file''s deployment descriptor
    contains the name of this directory. If a library-directory element is inspected,
    or if the .ear file does not contain a deployment descriptor, the directory named
    lib is used. An empty library-directory element may be used to specify that there
    is no library directory.

    All files in this directory (but not subdirectories) with a .jar extension must
    be available to all components packed in the EAR file, including application clients.
    These libraries may refer other libraries, bundled with the application or installed
    separately, using any of the techniques described herein.


    +   3. A web application may include libraries in the WEB-INF/lib directory. See
    the Servlet specification for details. These libraries may refer other libraries,
    either bundled with the application or installed separately, using any of the
    techniques described herein.


    # EE.8.2.2


    # Installed Libraries


    Libraries that have been installed separately may be referenced in the following
    way:


    +   1. JAR format files of all types may contain an Extension-List attribute in
    their Manifest file, indicating a dependency on an installed library. The JAR
    File Specification defines the semantics of such attributes for use by apps; this
    specification requires support for such attributes for all component types and
    corresponding JAR format files. The deployment tool is required to check such
    dependency information and reject the deployment of any component for which the
    dependency cannot be met. Portable applications should not assume that any installed
    libraries will be available to a component unless the component''s JAR format
    file, or one of the containing JAR format files, expresses a dependency on the
    library using the Extension-List and related attributes. The referenced libraries
    must be made available to all components contained


