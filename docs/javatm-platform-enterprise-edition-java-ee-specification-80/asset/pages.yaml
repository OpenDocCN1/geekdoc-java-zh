  md: 'managed beans (e.g., injected into other managed classes), the instances that
    are managed by CDI may not be the instances that are managed by the Java EE container.


    Therefore, to make injection more uniform across all Java EE component types,
    Java EE containers are required to support field, method, and constructor injection
    using the javax.inject.Inject annotation into all component classes listed in
    Table EE5.1 as having the "Standard" level of injection support, as well as the
    interceptors for these classes. Such injection must be performed in the same logical
    phase as resource injection of fields and methods annotated with the Resource
    annotation. In particular, dependency injection must precede the invocation of
    any methods annotated with the PostConstruct annotation. In supporting injection
    points, the container must behave as if it carried out the following steps, involving
    the use of the CDI SPI. Note that using these steps causes the container to create
    a non-contextual instance, which is not managed by CDI but rather by the Java
    EE container.


    +   1. Obtain a BeanManager instance.

    2. Create an Annotated instance for the component into which injection is to occur.

    3. Create an InjectionTarget instance for the annotated type.

    4. Create a CreationalContext, passing in null to the BeanManager createCreationalContext.

    5. Instantiate the component by calling the InjectionTarget produce method.

    6. Inject the component instance by calling the InjectionTarget inject method
    on the instance.

    7. Invoke the PostConstruct callback, if any, by calling the InjectionTarget postConstruct
    method on the instance.


    When a non-contextual instance is to be destroyed, the container should behave
    as if it carried out the following steps.


    +   1. Invoke the PreDestroy callback, if any, by calling the InjectionTarget
    preDestroy method on the instance.

    2. Invoke the InjectionTarget dispose method on the instance.

    3. Invoke the CreationalContext release method to destroy any dependent objects
    of the instance.'
