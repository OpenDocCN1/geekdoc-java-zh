- pgno: 222
  md: '# LIBRARY SUPPORT


    # 207


    within the referencing file, including any components contained within other JAR
    format files within the referencing file. For example, if a .ear references an
    installed library, the library must be made available to all components in .war
    files, EJB .jar files, application .jar files, and resource adapter .rar files
    within the ear.


    A Java EE product is not required to support downloading of libraries (using the
    <extension>-Implementation-URL header) at deployment time or runtime. A Java EE
    product is not required to support more than a single version of an installed
    library at once. A Java EE product is not required to limit access to installed
    libraries only to those for which the application has expressed a dependency;
    the application may be given access to more installed libraries than it has requested.
    In all of these cases, support is highly recommended and may be required in a
    future version of this specification. We recommend that a Java EE product support
    multiple versions of an installed library, and by default only allow applications
    to access the installed libraries for which they have expressed a dependency.


    # EE.8.2.3 Library Conflicts


    If an application includes a bundled version of the library, and the same library
    exists as an installed library, the instance of the library bundled with the application
    should be used in preference to any installed version of the library. This allows
    an application to bundle exactly the version of a library it requires without
    being influenced by any installed libraries. Note that if the library is also
    a required component of the Java EE platform version on which the application
    is being deployed, the platform version may (and typically will) take precedence.


    # EE.8.2.4 Library Resources


    In addition to allowing access to referenced classes, as described above, any
    resources contained in the referenced JAR files must also be accessible using
    the Class and ClassLoader getResource methods, as allowed by the security permissions
    of the application. An application will typically have the security permissions
    required to access resources in any of the JAR files packaged with the application.'
