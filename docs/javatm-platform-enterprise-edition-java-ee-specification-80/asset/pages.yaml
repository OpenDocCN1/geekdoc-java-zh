- pgno: 123
  md: 'Each resource-env-ref element describes the requirements that the the referencing
    application component has for the referenced administered object. The resource-env-ref
    element contains optional description and resource-env-ref-type elements and the
    mandatory resource-env-ref-name element. The resource-env-ref-type element is
    optional if an injection target is specified for this resource; in this case the
    resource-env-ref-type defaults to the type of the injection target.


    The resource-env-ref-name element specifies the resource environment reference
    name. It is the environment name used in the application code. The name of the
    resource environment reference is relative to the java:comp/env context. The resource-env-ref-type
    element specifies the expected type of the referenced object.


    A resource environment reference is scoped to the application component whose
    declaration contains the resource-env-ref element. This means that the resource
    environment reference is not accessible to other application components at runtime,
    and that other application components may define resource-env elements with the
    same resource-env-name without causing a name conflict.


    A resource environment reference may specify a lookup-name to link the reference
    being defined to another one via a JNDI name.


    # EE.5.8.2 Deployer’s Responsibilities


    The Deployer is responsible for the following:


    +   * The Deployer must ensure that all the declared resource environment references
    exist in the operational environment. The Deployer may use, for example, the JNDI
    LinkRef mechanism to create a symbolic link to the actual JNDI name of the target
    object. The Deployer may override the linkage preferences of a environment reference
    that includes a lookup annotation element or lookup-name deployment descriptor
    element.

    * The Deployer must ensure that the target object is type-compatible with the
    type declared for the resource environment reference. This means that the get
    object must be of the type indicated in the Resource annotation or the resource-env-ref-type
    element.'
