- pgno: 197
  md: 'name java:comp/TransactionSynchronizationRegistry or by requesting injection
    of a TransactionSynchronizationRegistry object.


    A number of interfaces defined by JTA are used by an application server to communicate
    with a transaction manager, and for a transaction manager to interact with a resource
    manager. These interfaces must be supported as described in the Connector specification.
    In addition, support for other transaction facilities may be provided transparently
    to the application by a Java EE product.


    The JTA specification is available at http://jcp.org/en/jsr/detail?id=907.


    # JavaMail™ 1.6 Requirements


    The JavaMail API allows for access to email messages contained in message stores,
    and for the creation and sending of email messages using a message transport.
    Specific support is included for Internet standard MIME protocols. Access to message
    stores and transports is through protocol providers supporting specific store
    and transport protocols. The JavaMail API specification does not require any specific
    protocol providers, but the JavaMail reference implementation includes an IM message
    store, a POP3 message store provider, and an SMTP message transport provider.


    Configuration of the JavaMail API is typically done by setting properties in a
    Properties object that is used to create a javax.mail.Session object using a static
    factory method. To allow the Java EE platform to configure and manage JavaMail
    API, an application component that uses the JavaMail API should request a Session
    object using JNDI, and list its need for a Session object in its deployment descriptor
    using a resource-ref element, or by using a Resource annotation. A JavaMail API
    Session object should be considered a resource factory, as described in Section
    EE.5.7,"Resource Manager Connection Factory References." This specification requires
    that the Java EE platform support javax.mail.Session objects as resource factories,
    as described in that section.


    The Java EE requires that a message transport be provided that is capable of handling
    addresses of type javax.mail.internet.InternetAddress and messages of type javax.mail.internet.MimeMessage.
    The default message transport must be properly configured to send such messages
    using the send method of the javax.mail.Transport class. Any authentication needed
    by the default Authenticator or be handled without need for the application to
    explicitly connect to the transport and supply authentication information.


    Java EE 8, Final Release'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# JAVA EE™ CONNECTOR ARCHITECTURE 1.7 REQUIREMENTS


