  md: '# EE.8.2 Library Support


    The Java EE platform provides several mechanisms for applications to use optional
    packages and shared libraries (hereafter referred to as libraries). Libraries
    may be bundled with an application or may be installed separately for use by any
    application.


    Java EE products are required to support the use of bundled and installed libraries
    as specified in the Extension Mechanism Architecture and Optional Package Versioning
    specifications (available at http://docs.oracle.com/java/8/docs/techniques/guides/extensions/)
    and the JAR File Specification (available at http://docs.oracle.com/java/8/docs/techniques/guides/jar/jar.html).
    Using this mechanism a Java JAR file can reference utility classes or other shared
    classes or resources packaged in a separate .jar file or directory that is included
    in the same Java EE application package, or that has been previously installed
    in the Java EE containers.


    # EE.8.2.1 Bundled Libraries


    Libraries bundled with an application may be referenced in the following ways:


    +   1. A JAR format (such as a .jar file, .war file, or .rar file) may reference
    a .jar file or directory by naming the referred .jar file or directory in a Class-Path
    header in the referencing JAR file''s Manifest file. The referenced .jar file
    or directory is named using a URL relative to the URL of the referencing JAR file.
    The Manifest file is named META-INF/MANIFEST.MF in the JAR file. The Class-Path
    entry in the Manifest file is of


    Class-Path: list-of-jar-files-or-directories-separated-by-spaces


    (See the JAR File Specification for important details and limitations of the syntax
    of Class-Path headers.) The Java EE deployment tools must process all referenced
    files and directories when processing a Java EE module. Any deployment descriptors
    in referenced .jar files must be ignored when processing the referencing .jar
    file. The deployment tool must install the .jar files and directories in a way
    that preserves the relative references between the files. Typically this is done
    by installing the .jar files into a directory hierarchy that matches the original
    application directory hierarchy. All referenced .jar files or directories must
    appear in the local class path of the referencing JAR file at runtime.


    Only JAR format files or directories containing class files or resources to be'
