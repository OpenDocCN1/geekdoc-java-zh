    # EE.6.20 Java™ Platform, Enterprise Edition Management API 1.1 Requirements


    The EE Management API provides APIs for management tools to query a Java EE application
    server to determine its current status, applications deployed, and so on. All
    Java EE products must support this API as described in its specification. The
    Java EE Management API specification is available at http://jcp.org/en/jsr/detail?id=77.


    # EE.6.21 Java™ Platform, Enterprise Edition Deployment API 1.2 Requirements (Optional)


    The Java EE Deployment API defines the interfaces between the runtime environment
    of a deployment tool and plug-in components by a Java EE application server. These
    plug-in components execute in the deployment tool and implement the Java EE product-specific
    deployment mechanisms. Java EE products that support the API are required to supply
    these plug-in components for use in tools from other vendors.\ Note that the Java
    EE Deployment specification does not define new APIs for direct use by Java EE
    applications. However, it would be possible to create a Java EE application that
    acts as a deployment tool and provides the runtime environment required by the
