    # EE.5.3.4 Java EE Product Provider’s Responsibilities


    The Java EE Product Provider has the following responsibilities:


    +   - Provide a deployment tool that allows the Deployer to set and modify the
    entries of the application component’s naming context.

    - Implement the java:comp, java:module, java:app and provide them to the application
    component instances at runtime. The naming context must include all the entries
    delivered by the Application Component Provider, with their values supplied in
    the deployment descriptor or set by the Deployer. The environment naming context
    must allow the Deployer to create subcontexts if they are needed by an application
    component. Certain entries in the naming context may have to be initialized with
    the values of other entries, specifically when the “lookup” facility is used.
    In this, there is an error if there are any circular dependencies between entries.
    Similarly, if there is an error looking up the specified JNDI name in a resource
    whose type is not compatible with the entry being created. The deployment tool
    may allow the Deployer to correct either of these classes of errors and continue
    the deployment.

    - Ensure that, in the absence of any properties specified by the application,
    the java.naming.InitialContext implementation meets the requirements described
    in this specification.

    - Inject entries from the naming environment into the application component, as
    specified by the deployment descriptor or annotations on the application component
    classes.

    - The container must ensure that the application component instances have only
    read access to naming context. The container must throw the java.naming.OperationNotSupportedException
    from all the methods of the java.naming.Context interface that modify the environment
    naming context and its subcontexts.


