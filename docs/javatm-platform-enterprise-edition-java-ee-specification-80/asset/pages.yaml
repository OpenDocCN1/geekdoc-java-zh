    +   7. Independence: Required security behaviors and deployment contracts should
    be implementable using a variety of popular security technologies.


    +   8. Compatibility testing: The Java EE security requirements architecture must
    be expressed in a manner that allows for an unambiguous determination of whether
    or not an implementation is compatible.


    +   9. Secure interoperability: Application components executing in a Java EE
    product must be able to invoke services provided in a Java EE product from a different
    vendor, whether with the same or a different security policy. The services may
    be provided by web components or enterprise beans.


    # EE.3.3.2 Non Goals


    The following are not goals for the Java EE security architecture:


    +   1. This specification does not dictate a specific security policy. Security
    policies for applications and for enterprise information systems for many reasons
    unconnected with this specification. Product Providers can provide the technology
    needed to implement and administer desired security policies while adhering to
    the requirements of this specification.


    +   2. This specification does not mandate a specific security technology, such
    as Kerberos, PK, NIS+, or NTLM.


    +   3. This specification does not require that the Java EE security behaviors
    be universally implementable using any or all security technologies.


    +   4. This specification does not provide any warranty or assurance of the effective
    security of a Java EE product.


    # EE.3.3.3 Terminology


    This section introduces the terminology that is used to describe the security
    requirements of the Java EE platform.


