  md: '# EE.4.2 Requirements


    This section defines the transaction support requirements of Java EE Products
    that must be supported by Product Providers.


    # EE.4.2.1 Web Components


    Web components may demarcate transactions using the javax.transaction.UserTransaction
    interface or transactional interceptors, which are defined in the JTA specification.
    They may access multiple resource managers and invoke multiple enterprise beans
    within a single transaction. The specified transaction context is automatically
    propagated to the enterprise beans and transactional resource managers. The result
    of the propagation may be subject to the enterprise bean transaction attributes
    (for example, bean may be required to use Container Managed Transactions).


    Web application listeners and upgrade handlers must not demarcate transactions
    using the javax.transaction.UserTransaction interface or transactional interceptors.
    Servlet filters may use transactional resources within their doFilter methods
    but should not use any transactional resources in the methods of objects used
    to wrap the request or response objects.


    # EE.4.2.1.1 Transaction Requirements


    The Java EE platform must meet the following requirements:


    +   * The Java EE platform must provide an object implementing the javax.transaction.UserTransaction
    interface to all web components. The platform must use the UserTransaction object
    in the Java™ Naming and Directory Interface (JNDI) name space available to web
    components under the name java:comp/UserTransaction.

    * The Java EE platform must provide classes that implement the transactional interceptors,
    as defined by the JTA specification.

    * If a web component invokes an bean from a thread associated with a JTA transaction,
    the Java EE platform must propagate the transaction context with the enterprise
    bean invocation. Whether the target enterprise bean will be invoked in this transaction
    context or not is determined by the rules defined in the EJB specification.


    Note that this transaction propagation requirement applies only to invocations
    of enterprise beans in the same Java EE product instance as the invoking'
