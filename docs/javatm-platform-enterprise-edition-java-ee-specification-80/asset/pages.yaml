    The JavaMail API specification is available at http://jcp.org/en/jsr/detail?id=919.


    # EE.6.10 Java EE™ Connector Architecture 1.7 Requirements


    In Java EE products, all EJB containers and all web containers must support the
    full set of Connector APIs. All containers must support Resource Adapters that
    use any of the specified transaction capacities. The Java EE deployment tools
    must support deployment of Resource Adapters, as defined in the Connector specification,
    and must support the deployment of applications that use Resource Adapters.


    The Connector specification is available at http://jcp.org/en/jsr/detail?id=322.'
  merge: -1
