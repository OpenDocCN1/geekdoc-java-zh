  md: '# CHAPTER EE.4


    # Transaction Management


    His chapter describes the required Java™ Platform, Enterprise Edition (Java EE)
    transaction management and runtime environment.


    Product Providers must transparently support transactions that involve multiple
    components and transactional resources within a single Java EE product, as described
    in this chapter. This requirement must be met regardless of whether the Java EE
    product is implemented as a single process, multiple processes on the same network
    node, or multiple processes on multiple network nodes.


    If the following components are included in a Java EE product, they are considered
    transactional resources and must behave as specified here:


    +   - JDBC connections

    - JMS sessions

    - Resource adapter connections for resource adapters specifying the XA transaction
    level


    # EE.4.1 Overview


    A Java EE product that includes both a servlet container and an EJB container
    must support a transactional application comprised of combinations of web application
    components accessing multiple enterprise beans within a single transaction. If
    the Java EE product also includes support for the Connectors specification, each
    component may also acquire one or more connections to access one or more transactional
    resource managers.


    For example, in Figure EE.4-1, the call tree starts from a servlet or JSP page
    accessing multiple enterprise beans, which in turn may access other enterprise
    beans. The components access resource managers via connections.'
