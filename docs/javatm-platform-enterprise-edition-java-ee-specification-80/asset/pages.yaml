    # #### EE.3.4.1 Login Sessions


    All Java web servers must maintain a login session for each web user. It must
    be possible for a login session to span more than one application, allowing a
    user to log in once and access multiple applications. The required login session
    support is described in Servlet specification. This requirement of a session for
    each web user supports single signon.


