    # EE.8.1.2 Application Assembly


    A Java EE application may consist of one or more Java EE modules and one Java
    EE application deployment deployor is packaged using the Java Archive (JAR) file
    format into a file with a .ear (Enterprise ARArchive) filename extension. A minimal
    Java EE application package will only contain Java EE modules, and optionally,
    the deployment descriptor. A Java EE application package may also include libraries
    referenced by Java EE modules (using the Class-Path mechanism described below
    in Section EE.8.2, "Library Support"), help files, and documentation to aid the
    deployer.


    The deployment of a portable Java EE application should depend on any entities
    that may be contained in the package other than those defined by this specification.
    Deployment of a portable Java EE application deployor, if any, and the Java EE
    modules (and their dependent libraries) are listed in it.


    The Java EE deployment descriptor represents the top level of a Java EE application''s
    contents. The Java EE application deployment is specified by an XML schema or
    document type definition (see Section EE.8.6, "Java EE Application XML Schema").


    In certain cases, a Java EE application will need customization before it can
    be deployed into the enterprise. New Java EE modules may be added to the application.
    Existing modules may need custom content created, changed, or replaced. For example,
    an application consumer may need to use an HTML editor to add graphics to a template
    login page that was provided with a Java EE web


    All Java EE applications have a name. The name can be explicitly set in the application
    deployment descriptor. If not set, the name of the application is the base name
