    # EE.8.1 Application Development Life Cycle


    The life cycle of a Java EE application begins with the creation of discrete Java
    EE components. These components may then be packaged with a module level deployment
    descriptor to create a Java EE module. Java EE modules can be deployed as stand-alone
    units or can be assembled with a Java EE application deployment descriptor and
    deployed as a Java EE application.


    Figure EE.8-2 shows the life cycle of a Java EE application.


    Java EE 8, Final Release'
