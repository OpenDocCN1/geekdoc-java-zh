    # EE.5.2.7 Other Naming Context Entries


    In addition to environment entries declared by application components, other items
    will appear in the naming context, as specified by this and other specifications.
    Following are some of these entries. This is not an exhaustive list; consult the
    corresponding specification for details.


    +   * All enterprise beans in an application are given entries in the shared namespaces.
    See the EJB specification for details.

    * All web applications are given names in the shared namespaces. The names correspond
    to the complete URL of the web application. See the Servlet specification for
    details.

    * Objects representing several services are defined in the java:comp namespace.
    See, for example, Section EE.5.10, "UserTransaction References," Section EE.5.11,
    "TransactionSynchronizationRegistry References," and Section EE.5.12,"ORB References."

    * Strings providing the current module name and application name are defined in
    the java:comp namespace. See Section EE.5.15, "Application Name and Module Name
    References."


    # EE.5.3 Responsibilities by Java EE Role


    This section describes the responsibilities for each Java EE role that apply to
    all uses of the Java EE naming context. The sections that follow describe the
    responsibilities that are specific to the different types of objects that may
    be stored in the naming context.


