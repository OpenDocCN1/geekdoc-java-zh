    that this specification does not require any additional support for logging. A
    Java application typically will not have the LoggingPermission necessary to control
    the logging configuration, but may use the logging API to produce log records.
    A future version of this specification may require that the Java EE containers
    use the logging API to log events.


    Java EE 8, Final Release'
