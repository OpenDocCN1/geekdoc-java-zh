    # EE.6.2.2.6 Declaring Permissions Required by Application Components


    By declaring the permissions required by an application as described in this section,
    through the successful deployment of his or her, the Java EE Product has granted
    at least the declared permissions to the classes and libraries packaged in the
    application module.


    Since the specific set of permissions granted to a successfully deployed application
    is a function of the security policy for the installation and the permissions
    declared within the permissions.xml file, the application provider is ensured
    that the effective permission set consists of at least those permissions that
    are declared within the application.


    Permission declarations must be stored in META-INF/permissions.xml file within
    an EJB, the application client, or resource adapter archive in order to be located
    and subsequently processed by the deployment machinery of the Java EE Product.
    The Java EE Product.xml files specify permission classes that are packaged in
    the application.


    The permissions for a packaged library are the same as the permissions for the
    module. thus, if a library is packaged in a .war file, it gets the permissions
    of the .war file.


    For applications packaged in an .ear file, the declaration of permissions must
    be at .ear file level. This permission set is applied to all modules and libraries
    packaged within the .ear file or within contained modules. Any permissions.xml
    files within packaged modules are ignored, regardless of whether a permissions.xml
    file has been supplied for the .ear file itself.


    The fact that these permission declarations are being made within the context
    of a particular application implies the codebase(s) to which the grant should
    be made. This simplifies the syntax that is needed to just the Permission class
    name and two String arguments. This aligns the declaration syntax with the default
    policy language and the constructor signature for permissions that is compliant
    with the default policy syntax.


    ```

    permission <class> [<name> [, <action list]];

    ```'
