  md: "# ENTERPRISE JAVABEANS™ (EJB) REFERENCES 93\n\nThe ejb-ref-name element specifies\
    \ the EJB reference name. Its value is the environment-ejb-ref entry name used\
    \ in the application component. The optional ejb-ref-type element specifies the\
    \ expected type of the enterprise bean. Its value must be either Entity or Session.\
    \ The home and remote or local-home elements specify the expected Java programming\
    \ language types of the referenced enterprise bean's interface(s). If the reference\
    \ is to an EJB 2.x remote client interface, the home element is required. Likewise,\
    \ if the reference is to EJB 2.x local client view interface, the local-home element\
    \ is required. The remote element of the ejb-ref element refers to either the\
    \ business interface type or the application component, depending on whether the\
    \ reference is to a bean's EJB 3.x or EJB 2.x remote client view. Likewise, the\
    \ local-ref element refers to either the business interface type, bean class type,\
    \ or the component interface type, depending on whether the reference is to a\
    \ bean's EJB 3.x local business interface, no-interface view, or EJB 2.x local\
    \ client view\n\nAn EJB reference is scoped to the application component whose\
    \ declaration contains the ejb-ref or ejb-local-ref element. This means that the\
    \ EJB reference is not accessible from other application components at runtime\
    \ and that other application components may define ejb-ref or ejb-local-ref elements\
    \ with the same ejb-ref-name without causing a name conflict.\n\nThe lookup-name\
    \ element specifies the JNDI name of an environment entry that provides a value\
    \ for the reference.\n\nThe following example illustrates the declaration of EJB\
    \ references in the deployment descriptor.\n\n```\n<ejb-ref>\n  <description>\n\
    \    This is a reference to the entity bean that encapsulates access to employee\
    \ records.\n  </description>\n  <ejb-ref-name>ejb/Emp1Record</ejb-ref-name>\n\
    \  <ejb-ref-type>Entity</ejb-ref-type>\n  <home>com.wombat.EmployeeRecordHome</home>\n\
    \  <remote>com.wombat.EmployeeRecord</remote>\n</ejb-ref>\n```\n\n```\n<ejb-ref>\n\
    \  <ejb-ref-name>ejb/Payroll</ejb-ref-name>\n  <ejb-ref-type>Entity</ejb-ref-type>\n\
    \  <home>com.aardvard.payroll.PayrollHome</home>\n  <remote>com.aardvard.payroll.Payroll</remote>\n\
    </ejb-ref>\n```"
