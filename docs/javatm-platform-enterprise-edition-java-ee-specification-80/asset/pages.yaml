    Resource annotations may appear on any of the classes listed above, or on any
    superclass of any class listed above. A resource annotation on any class in the
    inheritance hierarchy defines a resource needed by the application component.
    However, injection of resources follows the Java language overriding rules for
    visibility of fields and methods. A method definition that overrides a method
    on a superclass defines the resource, any, to be injected into that method. An
    overriding method may request injection even when the superclass does not request
    injection, it may request injection of a different resource than is requested
    by the superclass, or it may request no injection though the superclass method
    requests injection.


    In addition, fields or methods that are not visible or are hidden (as opposed
    to overridden) by a subclass may still request injection. This allows, a private
    field to be the target of injection and that field to be used in the implementation
    of the superclass, even though the subclass has no visibility into that and doesn''t
    know that the implementation of the superclass is using an injected resource.
    Note declaration of a field in a subclass with the same name as a field in the
    superclass always causes the field in the superclass to be hidden.


    In some cases a class may need to perform initialization of its own after resources
    have been injected. To support this, one of the class may be annotated with the
    PostConstruct annotation (or, equivalently, specified using the post-construct
    entry of a deployment descriptor). This method will be called after all injections
    have occurred and before the class is put into service. This method will be called
