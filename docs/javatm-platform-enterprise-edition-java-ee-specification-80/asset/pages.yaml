  md: '# EE.5.13 Persistence Unit References


    This section describes the metadata annotations and deployment descriptor elements
    that allow the application component code to refer to the entity manager factory
    for a persistence unit using a logical name called a persistence unit reference.
    Persistence unit references are special entries in the application component''s
    environment. The Deployer binds the persistence unit references to entity manager
    factories that are configured in accordance with the persistence.xml specification
    for the persistence unit, as described in the Java Persistence specification.


    The requirements in this section only apply to Java EE products that include support
    for the Java Persistence API.


    # EE.5.13.1 Application Component Provider''s Responsibilities


    This section describes the Application Component Provider''s view of locating
    the entity manager factory for a persistence unit and defines his or her responsibilities.
    The first subset describes annotations for injecting references to an entity manager
    factory for a persistence unit; the second describes the API for accessing an
    entity manager factory using a persistence unit reference; and the third describes
    syntax for declaring persistence unit references in a deployment descriptor.


    # EE.5.13.1.1 Injection of Persistence Unit References


    A field or method of an application component may be annotated with the PersistenceUnit
    annotation. The name element specifies the name under which the entity manager
    factory for the referenced persistence unit may be located in the JNDI naming
    context. The optional unitName element specifies the name of the persistence unit
    as declared in the persistence.xml file that defines the persistence unit.


    The following code example illustrates how an application component uses annotations
    to declare persistence unit references.


    ```

    @PersistenceUnit

    EntityManagerFactory emf;


    @PersistenceUnit(unitName="InventoryManagement")

    EntityManagerFactory inventoryEMF;

    ```'
