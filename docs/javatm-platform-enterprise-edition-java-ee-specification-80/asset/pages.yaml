    naming conventions for JavaBeans properties. The annotation is applied to the
    property, which is the method that is called to inject the environment entry into
    the class. The JavaBeans property (not the method name) is used as the JNDI name.
    For example, a method named setDatabase in the same MyApp class would correspond
    to the JNDI name java:comp/env/com.example.MyApp/myData as the single field or
    method of a given name in a class.


    Each resource may only be injected into a single field or method of a given name.
    Requesting injection of the java:comp/env/com.example.MyApp/myData resource into
    the setMyDatabase method and the myDatabase field is an error. Note, however,
    that either the field or the method could request injection of a different (non-default)
    name. By explicitly specifying the JNDI name of a resource, single resource may
    be injected into multiple fields or methods of multiple classes.


    The specifications for the various application component types describe classes
    which may be annotated for injection, summarized in Table EE.5-1.


    The component classes listed in Table EE.5-1 with support level “Standard” all
    support Java EE resource injection, as well as PostConstruct and PreDestroy callbacks.
    In addition, if CDI is enabled—which is by default—these classes also support
    CDI injection, as described in Section EE.5.24—“Support for Dependency Injection”,
    and the use of interceptors². Only support Java EE field injection and the PostConstruct
    callback. Note that these are application client main classes, where field injection
    is into static fields.


    The specifications for the various application component types also describe when
    injection occurs in the lifecycle of the component. Typically injection will occur
    after an instance of the class is constructed, but before any business methods
    are called. If the container fails to find a resource needed for injection, initialization
    of the class must fail, and the class must not be put into service.


