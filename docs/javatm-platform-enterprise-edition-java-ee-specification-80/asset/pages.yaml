- pgno: 39
  md: '# EE.2.12.4 Deployer


    The Deployer is responsible for deploying clients application clients, web applications,
    and Enterprise JavaBeans components into a specific operational environment. The
    Deployer uses tools supplied by the Java EE Product Provider to carry out deployment
    tasks. Deployment is typically a three-stage process:


    +   1. During Installation the Deployer moves media to the server, generates the
    additional container-specific classes and interfaces that enable the container
    to manage the application components at runtime, and installs application components,
    and additional classes and interfaces, into the appropriate Java EE components.

    2. During Configuration, external dependencies declared by the Application Component
    Provider are resolved and application assembly instructions defined by the Application
    Assembler. For example, the Deployer is responsible for managing security roles
    defined by the Application Assembler over user groups and accounts that exist
    in the target operational environment.

    3. Finally, the Deployer starts up Execution of the newly installed and configured
    application.


    In some cases, a specially qualified Deployer may customize the business logic
    of the application''s components at deployment time. For example, using tools
    provided with a Java EE product, the Deployer may provide simple application code
    that wraps an enterprise bean''s business methods, or customizes the appearance
    of a JSP or JSF page.


    The Deployer''s output is web applications, enterprise beans, applets, and application
    clients that have been customized for the target operational environment and are
    deployed in a specific Java EE container.


    For example, in the case of cloud deployments, the Deployer would be responsible
    for configuring the application to run in the cloud environment. The Deployer
    would install the application into the cloud environment, configure its external
    dependencies, and might handle aspects of provisioning its required resources.


