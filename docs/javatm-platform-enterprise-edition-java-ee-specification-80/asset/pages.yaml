  md: '# EE.2.7.15


    # Web Services


    Java provides full support for both clients of web services as well as web service
    endpoints. Several Java technologies work together to provide support for web
    services. The Java API for Web Services (JAX-WS) and the Java API for XML-based
    RPC (JAX-RPC) both provide support for service calls using the SOAP/HTTP protocol.
    JAX-WS, which is included in Java SE, is the primary API for web services and
    is a follow-on to JAX-RPC. JAX-WS offers extensive web services functionality,
    with support for multiple bindings/protocols. JAX-WS and JAX-RPC are fully interoperable
    when using the SOAP 1.1 over HTTP protocol as constrained by the W-I Basic Profile
    specification. For JAX-RPC has been made optional as of EE 7. See EE6.1.3, "Pruned
    Java Technologies".


    JAX-WS and the Java Architecture for XML Binding (JAXB) define the mapping between
    Java classes and XML used in SOAP calls, and provide support for 100% of XML Schema.
    JAXB is included in Java SE. The SOAP with Attachments API (SAAJ), is also included
    in Java SE, provides support for manipulating low level SOAP messages. The Web
    Services for EE specification fully defines the deployment of web service clients
    and web service endpoints in Java EE, as well as the implementation of web service
    endpoints using enterprise beans. The Web Services Metadata specification defines
    Java annotations that make it easier to develop web services. The Java API for
    XML Registries (JAXR) provides client access to XML registry servers. Support
    for JAXR has been made optional as of Java EE 7. See EE6.1.3, "Pruned Java Technologies".


    The Java API for JSON Processing (JSON-P) provides a convenient way to process
    (parse, generate, transform, and query) JSON text. The Java API for JSON Binding
    (JSON-B) provides a convenient way to convert between JSON text and objects. The
    Java API for WebSocket (WebSocket) is a standard API for creating WebSocket applications.


    The Java API for RESTful Web Services (JAX-RS) provides support for web services
    using the REST style. RESTful web services better match the design style of the
    web and are easier to access using a wide variety of programming languages. JAX-RS
    provides a simple high-level API for writing web services as well as a low-level
    API that can be used to control the details of the web service interaction.


