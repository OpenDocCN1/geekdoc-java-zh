    # EE.3.3.6.1 Role Mapping


    Enforcement of security constraints on resources or enterprise beans, whether
    programmatic or declarative, depends upon determination of whether the principal
    associated with an incoming request is given in a security role. A container makes
    this determination based on the security attributes of the calling principal.
    For example,


    +   1. A Deployer may have mapped a security role to a user group in the operational
    environment or may depend on the default mapping of security roles to user groups
    defined by the Java EE Security API specification. In this case, the user group
    of the calling principal is retrieved from its attributes. The principal is in
    the security role if the principal''s user group matches a user group to which
    the security role has been mapped.

    2. A Deployer may have mapped a security role to a principal name in a security
    policy domain. In this case, the principal name of the calling principal is retrieved
    from its attributes. If this principal name is the same as a principal name to
    which the security role was mapped, the calling principal is in the security role.


    The source of security attributes may vary across implementations of the Java
    EE platform. Security attributes may be transmitted in the calling principal’s
    credential or in the security context. In other cases, security attributes may
    be retrieved from an identity store, or from a trusted third party, such as a
