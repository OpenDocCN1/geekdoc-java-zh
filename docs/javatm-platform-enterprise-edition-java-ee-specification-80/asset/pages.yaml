  md: "# EE.8.2.5\n\n# Dynamic Class Loading\n\nLibraries that dynamically load classes\
    \ must consider the class loading environment of a Java EE application. Libraries\
    \ will often be loaded by a class loader that is a parent class of the class loader\
    \ that is used to load application classes and thus will not have direct visibility\
    \ to classes of the application modules. A library that only needs to dynamically\
    \ load classes provided by the library itself can safely use the Class method\
    \ setName. However, libraries that need to dynamically load classes that have\
    \ been provided as a part of the application need to use the context class loader\
    \ to load the classes. Note that the context class loader may be different in\
    \ each module of an application. Access to the context class loader requires RuntimePermission(\"\
    getClassLoader\\ which is not normally granted to applications, but should be\
    \ granted to libraries that need to dynamically load classes. Libraries can use\
    \ a method such as the following to assert their privilege when accessing the\
    \ context class loader. This technique will work in both Java SE and Java EE.\n\
    \n```\npublic ClassLoader getClassLoader() {\n    return AccessController.doPrivileged(\n\
    \        new PrivilegedAction<ClassLoader>() {\n            public ClassLoader\
    \ run() {\n                ClassLoader cl = null;\n                try {\n   \
    \                 cl = Thread.currentThread().getContextClassLoader();\n     \
    \           } catch (SecurityException ex) {}\n                return cl;\n  \
    \          }\n        }\n    ));\n}\n```\n\nLibraries should then use the following\
    \ technique to load classes.\n\n```\nClassLoader cl = getClassLoader();\nif (cl\
    \ != null) {\n    try {\n        clazz = Class.forName(name, false, cl);\n   \
    \ } catch (ClassNotFoundException ex) {\n        clazz = Class.forName(name);\n\
    \    }\n} else {\n    clazz = Class.forName(name);\n```\n\nJava EE 8, Final Release"
