- pgno: 281
  md: '# EE.A.10 J2EE 1.4 Application XML Schema


    This section provides the XML Schema for the J2EE application deployment descriptor.
    The XML grammar for a J2EE application deployment descriptor is defined by the
    J2EE:application schema. The granularity of composition for J2EE application assembly
    is the J2EE module. A J2EE:application deployment descriptor contains a name and
    description for the application and the URI of a UI icon for the application,
    as well as a list of the J2EE modules that comprise the application. The content
    of the XML elements is in general case sensitive. This means, for example, that
    <role-name>Manager</role-name> is a different role than <role-name>manager</role-name>


    A valid J2EE application deployment descriptors may conform to the XML Schema
    definition below. The deployment descriptor must be named META-INF/application.xml
    in the .ear file. Note that this name is case-sensitive.


    Figure EE.A-7 shows a graphic representation of the structure of the J2EE application
    XML Schema.


    ![](img/2d0d59290c8adb2789da0c25757ad1d3_281_0.png)


    Figure EE.A-7 J2EE Application XML Schema Structure


    The XML Schema that defines the XML grammar for a J2EE 1.4 application deployment
    descriptor is located at http://java.sun.com/xml/ns/j2ee/application_1_4.xsd.


    Java EE 8, Final Release'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# EE.A.11 Common J2EE 1.4 XML Schema Definitions


    The XML Schema that defines types that are used by many other J2EE 1.4 deployment
    descriptor schemas, both in this specification and in other specifications, is
    located at http://java.sun.com/ns/j2ee/j2ee_1_4.xsd.


    # EE.A.12 J2EE:application 1.3 XML DTD


    This section provides the XML DTD for the J2EE 1.3 application deployment descriptor.
    The XML grammar for a J2EE application deployment descriptor is defined by J2EE:application
    document type definition. The granularity of composition for J2EE application
    assembly is the J2EE module. A J2EE:application deployment descriptor contains
    a name and description for the application and the URI of the application, as
    well as a list of the J2EE modules that comprise the application. The content
    of the J2EE elements is general case sensitive. This means, for example, <role-name>Manager</role-name>
    is a different role than <role-name>manager</role-name>.


    A valid J2EE 1.3 application deployment descriptor may contain the following DOCTYPE
    declaration:


    ```

    <DOCTYPE APPLICATION PUBLIC "-Sun Microsystems, Inc.//DTD J2EE Application 1.3//EN"
    "http://java.sun.com/dtd/application_1_3.dtd">

    ```


    The deployment descriptor must be META-INF/application.xml in the .ear file.

    EE.A-8 shows a graphic representation of the structure of the J2EE:application
    XML DTD.


    ![](img/2d0d59290c8adb2789da0c25757ad1d3_282_0.png)'
  merge: -1
