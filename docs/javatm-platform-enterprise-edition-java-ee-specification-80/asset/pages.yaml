  md: '# EE.3.4.2.3 Form Based Login


    The web application deployment descriptor contains an element that causes a Java
    EE product to associate an HTML form response (perhaps dynamically generated)
    with the web application. If the Deployer chooses this form of authentication
    (over HTTP basic, or SSL certificate based authentication), this form must be
    used as the user interface for login to the application.


