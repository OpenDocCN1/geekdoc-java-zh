- pgno: 22
  md: '# CHAPTER EE.2


    # Platform Overview


    This chapter provides an overview of the Java™ Platform, Enterprise Edition (Java
    EETM).


    # EE.2.1 Architecture


    The required relationships of architectural elements of the Java EE platform are
    shown in Figure EE.2-1. Note that this figure shows the logical relationships
    of the elements; it is not meant to imply a physical partitioning of the elements
    into separate machines, processes, address spaces, or virtual machines.


    The Containers, denoted by the separate rectangles, are Java EE runtime environments
    that provide required services to the application components represented in the
    upper half of the rectangle. The services provided are denoted by the boxes in
    the lower half of the rectangle. For example, the Client Container provides Java
    Message Service (JMS) APIs to Application Clients, as well as the other services
    represented. All these services are explained below. See Section EE.2.7,"Java
    EE Standard".


    The arrows represent access to other parts of the Java EE platform. The Application
    Client Container provides Application Clients with direct access to the Java EE
    required Database through the Java API for connectivity with database systems,
    the JDBC™ API. Similar access to databases is provided to JSP applications, and
    servlets by the Web Container, and to enterprise beans by the EJB Container.


    As indicated, the APIs of the Java™ Platform, Standard Edition (Java SE), are
    supported by Java SE runtime environments for each type of application component.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/2d0d59290c8adb2789da0c25757ad1d3_23_0.png)


    # ### Figure EE.2-1 Java EE Architecture Diagram


    The following sections describe the Java EE Platform requirements for each kind
    of Java EE platform element.


    # ### EE.2.2 Profiles


    The Java EE 6 specification introduced the notion of “profiles” (see Chapter EE.9,
    “Profiles”).


    Java EE 8, Final Release'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'A profile is a configuration of the Java EE platform targeted at a specific
    class of applications.


    Profiles are not a new concept, nor are they unique to the Java EE platform. The
    Java Community Process Document (version 2.10) gives the following definition
    of a profile: “A Specification that references one of the Platform Edition Specifications
    and zero or more other JCP Specifications (that are not already a part of a Platform
    Edition Specification). APIs from the referenced Platform Edition must be included
    in the referencing rules set out in that Platform Edition Specification. Other
    referenced specifications must be referenced in their entirety.


    All EE profiles share a set of common features, such as naming and resource injection,
    packaging rules, security requirements, etc. This guarantees a degree of uniformity
    across all products and, indirectly, applications that fall under the “Java EE
    platform” umbrella. This also ensures that developers who are familiar with a
    certain profile, or with the full platform, can easily move to other profiles,
    avoiding excessive compartmentalization of skills and experience.


    Beyond the basic functionality outlined above, profiles are free to include any
    set of technologies that are part of the platform, providing that all rules in
    the present specification pertain to the included—either alone or in combination
    with others—are followed.


    This last point is worth stressing. If profiles only include pointwise technologies,
    they would be little more than bundles of APIs with few or no ties. Instead, the
    definition of profiles adopted guarantees that whenever this specification defines
    requirements on combinations of technologies, these requirements will be honored
    in all products based on Java EE profiles.


    As a concrete example, consider the use of transactions in a servlet container.
    In isolation, the Servlet specification nor the Java Transaction API specification
    defines a complete programming model for portable applications. This specification
    fills that by introducing its own set of requirements that pertain to the combination
    of Servlets and JTA. These requirements must be satisfied by any Java EE-based
    product that includes those two technologies, offering application developers
    a more complete programming model across all relevant Java EE profiles.


    A separate specification, the Java EE Web Profile Specification, defines the first
    profile of the Java EE platform.


    Additional profiles may be defined in accordance with the rules of the Java Community
    Process and those contained in the present specification. In particular, profiles
    are initiated by submitting a Java Specification Request and are released at completion
    on their own schedule, independent of any concurrent revision of'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'the platform itself or of other profiles. This ensures maximum flexibility
    in defining and releasing a new profile or an updated version of an existing one.


    In accordance with the definition of profiles given above, a profile may end up
    either a proper subset or a proper superset of the platform, or it may overlap
    with it to a certain extent. This flexibility guarantees that future profiles
    will be able to cover well beyond those originally envisioned by the platform
    specification.


    As the previous paragraphs made clear, creating a new profile is a significant
    undertaking. The decision to create a profile should take into account its potential
    drawbacks, especially in terms of fragmentation and developer confusion. In general,
    a profile should be created only when there is a natural developer constituency
    and a well-understood class of applications that can benefit from it. It is also
    recommended that a profile cast a comprehensive net on its area of interest, to
    minimize the occurrence of overlapping or competing profiles. Java EE features
    such as optional components and extensibility can be used by profiles to achieve
    a better fit to their intended target.


    # EE.2.3 Application Components


    The Java EE runtime defines four application component types that a Java EE product
    must support:


    +   Application clients are Java programming language programs that are typically
    GUI programs that execute on a desktop computer. Application clients offer a user
    experience similar to that of native applications and access to all of the facilities
    of the Java EE middle tier.


    +   Applets are GUI components that typically execute in a web browser, but can
    execute in a variety of other applications or devices that support the applet
    programming model. Applets can be used to provide a powerful user interface for
    Java EE applications.(Simple HTML pages can also be used to provide a more limited
    user interface for Java EE applications.)


    +   Servlets, JSP pages, JSP applications, filters, and web event listeners typically
    execute in a web container and may respond to HTTP requests from clients. Servlets,
    JSP pages, JSP applications, and filters may be used to generate HTML pages that
    are an application''s user interface. They may also be used to generate XML or
    other format data that is consumed by other application components. A special
    kind of servlet provides support for web services using the SOAP/HTTP protocol.
    Servlets, pages created with the Java Pag-


    Java EE 8, Final Release'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'est™ technology or JavaServer™ Faces, web filters, and web event listeners
    are referred to collectively in this specification as “web components.” Web applications
    are composed of web components and other data such as HTML pages. Web components
    execute in a web container. A web server includes a web container and other protocol
    support, security support, and so on, as required by Java EE specifications.


    +   - Enterprise JavaBeans™ (EJB) components execute in a managed environment
    that supports transactions. Enterprise beans typically contain the business logic
    for a Java EE application. Enterprise beans directly provide web services using
    the SOAP/HTTP protocol.


    # EE.2.3.1 Java EE Server Support for Application Components


    The Java EE servers provide deployment, management, and execution support for
    conforming application components. Application components can be divided into
    three categories according to their dependence on a Java EE server:


