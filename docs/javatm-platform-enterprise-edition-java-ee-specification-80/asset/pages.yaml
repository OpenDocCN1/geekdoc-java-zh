- pgno: 260
  md: '# CHAPTER EE.11


    # Service Provider Interface


    The Java™ Platform, Enterprise Edition (Java EE) includes several technologies
    that are primarily intended to be used to extend the capabilities of the Java
    EE containers. In addition, some Java EE technologies include service provider
    interfaces along with their application programming interfaces. A Java EE profile
    may include some or all of these facilities, as described in Chapter EE.9, “Profiles”.


    # EE.11.1 Java™ EE Connector Architecture


    The Connector API defines how resource adapters are packaged and integrated with
    any Java EE product. Many types of service providers can be provided using the
    Connector API and packaging, including JDBC drivers, JMS providers, and JAXR providers.
    All Java EE products support the Connector API, as specified in the Connector
    specification.


    The Connector specification is available at http://jcp.org/en/jsr/detail?id=322.


    # EE.11.2 Java™ Authorization Service Provider Contract for Containers


    The JACC specification defines the contract between a Java EE container and an
    authorization policy provider.


    The JACC specification is available at http://jcp.org/en/jsr/detail?id=115.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# EE11.3 Java™ Transaction API


    The Java Transaction API defines the TransactionSynchronizationRegistry interface
    that is intended for use by system level application server components as persistence
    managers, resource adapters, as well as EJB and Web application components. This
    provides the ability to register synchronization objects with special ordering
    semantics, associate resource objects with the current transaction, get the persistence
    context of the current transaction, get current transaction status, and mark the
    current transaction for rollback.


    The JTA specification is available at http://jcp.org/en/jsr/detail?id=907.


    # EE11.4 Java™ Persistence


    Java Persistence provides interfaces in the javax.persistence.spi package to allow
    a persistence provider to be plugged into the Java Persistence framework.


    The Java Persistence specification is available at http://jcp.org/en/jsr/detail?id=338.


    # EE11.5 JavaMail™


    The JavaMail specification describes how JavaMail protocol providers can be packaged
    and distributed so they can be discovered and used through the JavaMail API. This
    allows the JavaMail API to be extended with support for new mail protocols and
    mailbox formats.


    The JavaMail specification is available at http://jcp.org/en/jsr/detail?id=919.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# CHAPTER EE.12


    # Compatibility and Migration


    His chapter summarizes compatibility and migration issues for the Java EE platform.
    The specifications for each of the component technologies included in Java EE
    also describe compatibility and migration issues for that technology in much more
    detail.


    # EE.12.1 Compatibility


    The word compatibility covers many different concepts. Java EE products are compatible
    with the Java EE specification if they implement the APIs and behavior required
    by the specification. Applications are compatible with a release of the Java EE
    platform if they only depend on APIs and behavior defined by that release of the
    platform. A new release of the Java EE platform is compatible with previous releases
    of the platform if all portable applications written to the previous release of
    the platform will run unchanged and with identical behavior on the new release
    of the platform.


    Compatibility is a core value of the Java EE platform. A Java EE product is required
    to support portable applications written to previous versions of the platform.
    Compatibility and portability work together to provide the Write Once, Run Anywhere
    value of the Java EE platform. Java EE products conform to the Java EE specifications
    by providing APIs and behavior as required by the specifications. Portable applications
    depend only on the APIs and behavior required by the Java EE specifications. In
    general, portable applications written to a previous version of the platform will
    continue to work without change and with identical behavior on the current version
    of the platform.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# EE.12.2 Migration


    Migration is the act of converting an application to use new facilities introduced
    in this release of the platform. Given the strong level of compatibility in this
    release of the Java EE platform, migration is largely an optional exercise. Still,
    an application may be improved (better performance, simpler to develop, more flexible,
    etc.) by converting it to use new facilities of the Java EE platform.


    # EE.12.2.1 Java Persistence


    Java Persistence provides a much richer set of modeling capabilities and object/relational
    mapping capabilities than EJB CMP entity beans and is significantly easier to
    use.


    Support for EJB CMP and BMP entity beans has been made optional with the Java
    EE 7 release. Support for EJB CMP 1.1 entity beans has been deprecated since Java
    EE 5. Applications are strongly encouraged to migrate applications using EJB entity
    beans to the Java Persistence API.


    # EE.12.2.2 JAX-WS


    JAX-WS, along with JAXB and the Metadata for Web Services specification, provides
    simpler and more complete support for web services than is available using the
    JAX-RPC technology. Support for JAX-RPC has been made optional with the Java EE
    7 release. Applications that provide web services using JAX-RPC should consider
    migrating to the JAX-WS API. Note that both technologies support the same web
    service interoperability standards, clients and services can be migrated to the
    new API independently.


    Java EE 8, Final Release'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# EE.13


    # CHAPTER Future Directions


    His version of the Java™ Platform, Enterprise Edition (Java EE) specification
    includes most of the facilities needed by enterprise applications. Still, there
    is always more to be done. This chapter briefly describes our plans for future
    versions of this specification. Please keep in mind that all of this is subject
    to change. Your feedback is encouraged.


    The following sections describe additional facilities we would like to include
    in future versions of this specification. Many of the APIs included in the Java
    EE platform will continue to evolve on their own and we will include the latest
    version of each API.


    # EE.13.1 Java EE SPI


    Many of the APIs that make up the Java EE platform include an SPI layer that allows
    service providers or other system components to be plugged in. This specification
    does not describe the execution environment for all service providers, nor the
    packaging and deployment requirements for all service providers. However, the
    Java EE Connector Architecture does define the requirements for certain types
    of service providers called resource adapters, and the Java Authorization Contract
    for Containers defines requirements for security service providers. Future versions
    of this specification will more fully define the Java EE SPI.'
  merge: -1
  img_proc: true
