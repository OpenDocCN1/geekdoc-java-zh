    # EE.5.2.6 Annotations and Deployment Descriptors


    Environment entries may be declared by use of annotations, without need for any
    deployment descriptor entries. Environment entries may also be declared by deployment
    descriptor entries. The same environment entry may be declared using both an annotation
    and a deployment descriptor entry. In this case, the information in the deployment
    descriptor entry may be used to override some of the information provided in the
    annotation. This approach may be used by an Application Assembler or Deployer
    to override information provided by the Application Component Developer. Applications
    should not use deployment descriptor entries to request injection of a resource
    into a field or method that has not been designed for injection.


    The following list describes the rules for how a deployment descriptor entry may
    override a Resource annotation.


    +   - The relevant deployment descriptor entry is located on the JNDI name used
    with the annotation (either defaulted or provided explicitly).

    - The type specified in the deployment descriptor must be assignable to the type
    of the field or property.

    - The description, if specified, overrides the description element of the annotation.

    - The injection target, if specified, defines additional injection points for
    the source.

    - The mapped-name element, if specified, overrides the mappedName element of the
    annotation.

    - The res-sharing-scope element, if specified, overrides the shareable element
    of the annotation. In general, the Application Assembler or Deployer should not
    change this value as doing so is likely to break the application.

    - The res-auth element, if specified, overrides the authenticationType element
    of the annotation. In general, the Application Assembler or Deployer should not
    change this value as doing so is likely to break the application.

    - The lookup-name element, if specified, overrides the lookup element of the annotation.'
