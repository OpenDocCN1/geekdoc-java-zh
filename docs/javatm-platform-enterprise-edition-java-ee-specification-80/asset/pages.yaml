- pgno: 203
  md: '# Java™ Authentication Service Provider Interface for Containers (JASPIC) 1.1
    Requirements


    The JASPIC specification defines a service provider interface (SPI) by which authentication
    providers implementing message authentication mechanisms may be integrated in
    client or server message processing containers or runtimes. Authentication providers
    integrated through this interface operate on network messages provided to them
    by their calling container. They transform outgoing messages that the source of
    the message may be authenticated by the message container, and the recipient of
    the message may be authenticated by the message sender. They authenticate incoming
    messages and return to their calling container the identity established as a result
    of the message authentication.


    In a full Java EE product, all Java EE web containers and enterprise bean are
    required to support the baseline compatibility requirements as defined by the
    JASPIC specification. In a full Java EE product, all web containers must also
    support the Servlet Container Profile as defined in the JASPIC specification.
    In a Java EE product that includes Servlet and JASPIC, all web containers must
    also support the Servlet Container Profile as defined in the JASPIC specification.
    Support for the JASPIC SOAP Profile is not required.


    The JASPIC specification can be found at http://jcp.org/en/jsr/detail?id=196.


    # Java EE Security API 1.0 Requirements


    The Java EE Security API leverages JASPIC, but provides an easier to use SPI for
    authentication of web applications and defines identity stores for authentication
    and authorization.


    In a full Java EE product, all Java EE web containers and enterprise bean containers
    are required to support the requirements defined by the Java EE Security API specification.


    The Java EE Security API specification can be found at http://jcp.org/en/jsr/detailid=375.


    # Debugging Support for Other Languages (JSR-45) Requirements


    JSP pages are usually translated into Java language pages and then compiled to
    create class files. The Debugging Support for Other Languages specification


    Java EE 8, Final Release'
