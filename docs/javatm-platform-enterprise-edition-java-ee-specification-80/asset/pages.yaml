- pgno: 214
  md: '# EE.8

    CHAPTER


    # Application Assembly and Deployment


    This chapter specifies Java™ Platform, Enterprise Edition (Java EE) requirements
    for assembling, packaging, and deploying a Java EE application. The main goal
    of these requirements is to provide scalable and modular application assembly,
    and portable deployment of Java EE applications into any Java EE product.


    Java EE applications are composed of one or more Java EE components and an optional
    Java EE deployment descriptor. The deployment descriptor, if present, lists the
    application''s components as modules. If the deployment descriptor is not present,
    the application''s modules are discovered using default naming rules. A Java EE
    module represents the basic unit of Java EE components and an optional module
    deployment descriptor. The flexibility and extensibility of the Java EE component
    model facilitates the packaging and deployment of Java EE components as individual
    components, component libraries, or Java EE applications.


    A full Java EE product must support all the facilities described in this chapter.
    A Java EE profile may support only a subset of the Java EE module types. Any requirements
    related to a module type not supported by a product based on a particular Java
    EE profile should be understood to not apply to such a product.


    Figure EE.8-1 shows the composition model for Java EE deployment units and includes
    the optional use of alternate deployment descriptors by the application package
    to preserve any signatures of the original Java EE modules. An alternate deployment
    descriptor may also be provided external to the application package as described
    in Section EE.8.4.1,"Assembling a Java EE Application."'
