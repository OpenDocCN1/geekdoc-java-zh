    If not, the name of the module is the base of the module file with any extension
    (.war, .jar, .rar) removed and with any directory names removed.


    # EE.8.1.3 Deployment


    During the deployment phase of an application''s life cycle, the application is
    installed on the Java EE platform and then is configured and integrated into the
    existing infrastructure. Each Java EE module listed in the application deployment
    descriptor (or discovered the default rules described below) may be deployed according
    to the requirements of the specification for the respective Java EE module type.
    Each module listed must be installed in the appropriate container type and the
    environment properties of each module must be appropriately set in the target
    container to reflect the values declared by the deployment descriptor element
    for each component.


    Every resource reference should be bound to a resource of the required type. Some
    resources have default mapping rules specified; see sections EE.5.19, EE.5.20,
    and EE.5.21. By default, a product may map over unmapped resources using these
    default rules. A product may include an option to disable or override these default
    mapping rules.


    Once a resource reference is bound to a resource in the target operational environment,
    and deployment succeeds, binding is not expected to change. A product may provide
    administrative operations that change the resource bindings that are used by applications.
    A product may notify applications of changes to their resource bindings using
    JNDI events, but this is not required.


    If deployment succeeds, in addition to binding resource references as specified
    above, every resource definition (see section EE.5.18) specified by the application
    or specified or overridden by the Deployer must be present in the target operational
    environment.'
