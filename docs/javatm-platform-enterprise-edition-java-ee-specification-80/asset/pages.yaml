- pgno: 266
  md: '# APPENDIX EE.A


    # Previous Version Deployment Descriptors


    His appendix describes Document Type Definitions and XML schemas for Deployment
    Descriptors from previous versions of the Java EE specification. All Java EE products
    are required to support these DTDs and schemas as well as the schemas specified
    in this version of the specification. This ensures that applications written to
    previous versions of this specification can be deployed on products supporting
    the current version of this specification. In addition, there are no restrictions
    on mixing versions of deployment descriptors in a single application; any combination
    of valid deployment descriptor versions must be supported.


    # EE.A.1 Java EE 7 Application XML Schema


    The XML grammar for a Java EE deployment descriptor is defined by the Java EE
    application specification. The root element of the deployment descriptor for a
    Java application is application. The granularity of composition for Java EE assembly
    is the Java EE module. A Java EE deployment descriptor contains a name and description
    for the application and the URI of a UI icon for the application, as well as a
    list of Java EE modules that compose the application. The content of the XML elements
    is in general case sensitive. This means, for example, that <role-name>Manager</role-name>
    is a different role than <role-name>manager</role-name>.


    All valid Java EE deployment descriptors must conform to the XML Schema definition,
    the DTD or schema definition from a previous version of this specification. The
    deployment descriptor must be named META-INF/application.xml in the file. Note
    that this name is case-sensitive.'
