    # EE.6.2.2.3 System Administrator’s Responsibilities


    Security policy requirements differ from one installation environment to another.
    The system administrator is responsible for configuring the permissions available
    to application modules to meet the security policy requirements of the installation
    environment. For example, cloud environments may require greater restrictions
    on the system resources available to applications than on-premise installations.
    Note that restricting the permissions beyond those in Table EE.6-2 may prevent
    some applications from working correctly.


