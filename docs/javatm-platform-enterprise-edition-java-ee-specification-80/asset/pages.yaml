- pgno: 279
  md: '# EE.A.8 Common Java EE 5 XML Schema Definitions


    The XML Schema located at http://java.sun.com/xml/ns/javaee/javaee_5.xsd defines
    types that are used by many other Java EE deployment descriptor schemas, both
    in this specification and in other specifications.


    # EE.A.9 Java EE 5 Application Client XML Schema


    The XML grammar for a Java EE application client deployment descriptor is defined
    by the Java EE application-client schema. The root element of the deployment descriptor
    for an application client is application-client. The content of the XML elements
    is in general case sensitive. This means, for example, that <res-auth-container>/</res-auth>
    must be used, rather than <res-auth-container>/</res-auth>.


    All application-client deployment descriptors must conform to the XML Schema definition,
    or to DTD or schema definition from a previous version of this specification.
    The deployment descriptor must be named META-INF/application-client.xml in the
    application client''s .jar file. Note that this is case-sensitive.


    EE.A-6 shows the structure of the Java EE application-client XML Schema. The Java
    EE application-client XML Schema is located at http://java.sun.com/xml/ns/javaee/application-client_5.xsd.


    Java EE 8, Final Release'
