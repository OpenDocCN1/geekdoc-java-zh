    # EE.5.7


    # Resource Manager Connection Factory References


    A resource manager connection factory is an object that is used to create connections
    to a resource manager. For example, an object that implements the javax.sql.DataSource
    interface is a resource manager connection factory for java.sql.Connection objects
    that implement connections to a database management system.


    This section describes the application programming and deployment interfaces that
    allow the application component code to refer to resource references using logical
    names called resource manager connection factory references. The resource manager
    connection factory references are special entries in the application component''s
    environment. The Deployer binds the resource manager connection factory references
    to the actual resource manager connection factories that exist in the target operational
    environment. Because these affect resource management, the connections acquired
    through the resource manager connection factory references are called managed
    resources (for example, these resource manager connection factories allow the
    Container to implement connection pooling and automatic enlistment of the connection
    with a transaction).


    Resource manager connection factory objects accessed through the naming environment
    are only valid within the component instance that performed the lookup. See the
    individual component specifications for additional restrictions that may apply.


