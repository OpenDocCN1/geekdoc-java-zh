    # EE.8.1.1 Component Creation


    The EJB, servlet, application client, and Connector specifications include the
    XML Schema definition of the associated module level deployment descriptors and
    component packaging architecture required to produce Java EE modules. (The application
    client specification is found in Chapter EE.10 of this document.)


    A Java EE module is a collection of one or more Java EE components (web, EJB,
    application client, or Connector) with an optional module deployment descriptor
    of that type. Any number of components of the same type can be packaged together
    with a single Java EE deployment descriptor appropriate to that container type
    to produce a Java EE module. Components of different types may not be mixed in
    a single Java EE module, except for the packaging of EJB components within a web
    module.


    +   - A Java EE module represents the basic unit of composition of a Java EE application.
    In some cases a Java EE module (not necessarily packaged into a Java EE application
    package) will contain another application. In other cases an application will
    be composed of multiple Java EE modules.

    - The deployment descriptor for a Java EE module contains declarative data required
    to deploy the components in the module. The deployment descriptor for a Java EE
    module also contains assembly instructions that describe how the components are
    composed into an application.'
