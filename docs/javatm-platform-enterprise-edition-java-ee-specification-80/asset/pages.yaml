  md: '# EE.5.7.1.3 Declaration of Resource Manager Connection Factory References
    in Deployment Descriptor


    Although a resource manager connection factory reference is an entry in the application
    component''s environment, the Application Component Provider must not use an env-entry
    element to declare it.


    Instead, the Application Component Provider must declare all the resource manager
    connection factory references using either annotations on the application component''s
    code or in the deployment descriptor using the resource-ref elements. This allows
    the consumer of the application component JAR file (the Application Assembler
    or Deployer) to discover all the resource manager connection factory references
    used by an application component. Deployment descriptor may also be used for injection
    of a resource manager connection reference into an application component.


    Each res-ref element contains a single resource manager connection factory reference.
    The res-ref element consists of the description element, the mandatory res-name
    element, and the optional res-sharing-scope, res-type, and res-auth elements.
    The res-name element contains the name of the environment entry used in the application
    component''s code. The name of the environment entry is relative to the java:comp/env
    context (for example, the name may be jbdc/EmployeeApp0 rather than java:comp/env/jbc/EmployeeApp0).
    The res-type element contains the resource manager connection factory that the
    application component code specifies. The res-type is optional if an injection
    target is specified for this resource; in this case the res-type defaults to the
    type of the injection target. The res-auth element indicates whether the application
    component code performs resource sign on programmatically, or whether the container
    signs on the resource based on the principal mapping information supplied by the
    Deployer. The Application Component Provider indicates the sign responsibility
    by setting the value of the res-auth element to Application or Container. If not
    specified, the default is Container. The res-sharing-scope element indicates whether
    connections to the resource manager obtained through the given resource manager
    connection factory reference can be shared or whether connections are unshareable.
    If the res-sharing-scope element is Shareable or if not specified, connections
    are assumed to be shareable.


