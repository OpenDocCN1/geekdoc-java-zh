    # EE.5.16 Application Client Container Property


    An application may determine whether it is executing in a Java EE client container
    by using the pre-defined JNDI name java:comp/InClientContainer. This property
    is represented by a Boolean object. If the application is running in a Java EE
    application client container, the value of this property is true. If the application
    is running in a Java EE web or EJB container, the value of this property is false.


    # EE.5.16.1 Application Component Provider’s Responsibilities


    The Application Component Provider is responsible for requesting injection of
    the application client container property using a Resource annotation on a Boolean
    or boolean method or field, or using the defined name to look up the application
    client container property.


    # EE.5.16.2 Java EE Product Provider’s Responsibilities


    The Java EE Product Provider is responsible for providing the correct application
    client container property as required by this specification.


