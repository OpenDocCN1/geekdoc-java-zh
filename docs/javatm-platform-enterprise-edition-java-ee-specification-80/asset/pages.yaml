  md: '# EE.2.12.1 Java EE Product Provider


    A Java EE Product Provider is the implementor and supplier of a Java EE product
    that includes the component containers, Java EE platform APIs, and other features
    defined in this specification. A Java EE Product Provider is typically an application
    server vendor, a web server vendor, a database system vendor, or an operating
    system vendor. A Java EE Product Provider must make available the Java EE APIs
    to the application components through containers. A Product Provider frequently
    bases their implementation on an existing infrastructure.


    A Java EE Product Provider must provide the mapping of the application components
    to the network protocols as specified by this specification. A Java EE product
    is free to implement interfaces that are not specified by this specification in
    an implementation-specific way.


    A Java EE Product Provider must provide application deployment and management
    tools. Deployment tools enable a Deployer (see Section EE.2.12.4, “Deployer”)
    to deploy application components on the Java EE product. Management tools allow
    a System Administrator (see Section EE.2.12.5, “System Administrator”) to manage
    the Java EE product and the applications deployed on the Java EE product. The
    form of these tools is not prescribed by this specification.


    # EE.2.12.2 Application Component Provider


    There are multiple roles for Application Component Providers, including, for example,
    HTML document designers, document programmers, and enterprise bean developers.
    These roles use tools to produce Java EE applications and components.


    # EE.2.12.3 Application Assembler


    The Application Assembler takes a set of components developed by Application Component
    Providers and assembles them into a complete Java EE application delivered in
    the form of an Enterprise Archive (.ear) file. The Application Assembler will
    generally use GUI tools provided by either a Platform Provider or Tool Provider.
    The Application Assembler is responsible for providing assembly instructions describing
    external dependencies of the application that the Deployer must resolve in the
    deployment process.'
