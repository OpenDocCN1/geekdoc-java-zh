  md: '# EE.A.15 J2EE:application-client 1.3 XML DTD


    This section describes the XML DTD for the J2EE 1.3 version of the application
    client deployment descriptor. The XML grammar for a J2EE application client deployment
    descriptor is defined by the J2EE:application-client document type definition.
    The root element of the deployment descriptor for an application client is application-client.
    The content of the XML elements is in general case sensitive. This means, for
    example, that <res-auth>container</res-auth> must be used, rather than <res-auth>.


    A valid application-client deployment descriptor may contain the following DOCTYPE:


    ```

    <!DOCTYPE application-client PUBLIC "-//Sun Microsystems, Inc.//DTD J2EE Application
    Client 1.3/EN" "http://java.sun.com/dtd/application-client_1_3.dtd">

    ```


    The deployment descriptor must be named META-INF/application-client.xml in the
    application client''s .jar file.

