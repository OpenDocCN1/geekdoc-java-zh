- pgno: 96
  md: '# EE.5.3.1 Application Component Provider’s Responsibilities


    The Application Component Provider may make use three techniques for accessing
    and managing the naming context. First, the Application Component Provider may
    use Java language annotations to request injection of a resource from the naming
    context, or to declare elements that are needed in the naming context. Second,
    the component may use the JNDI APIs to access entries in the context. Third, deployment
    descriptor entries may be used to declare entries in the naming context, and to
    request injection of these entries into application components. Deployment descriptor
    entries may also be used to override information provided by annotations.


    As part of the declaration of elements in the naming context, the Application
    Component Provider can specify the JNDI name of a resource to be looked up in
    the naming context being declared. The JNDI name in question may belong to any
    of the namespaces that compose the component environment.


    To ensure that it has access to the correct javax.naming.InitialContext implementation
    by the container, a portable application component must not specify the java.naming.factory.initial
    property, must not specify a URLContextFactory for the “java” schema-id, and must
    not call the java.naming.spi.NamingManager.setInitialFactoryBean.


    # EE.5.3.2 Application Assembler’s Responsibilities


    The Application Assembler is allowed to modify the entries in the naming context
    set by the Application Component Provider, and is allowed to set the values of
    these entries for which the Application Component Provider has not specified any
    values. The Application Assembler may use the deployment descriptor to override
    settings made by the Application Component Provider in the source code using annotations.


    # EE.5.3.3 Deployer’s Responsibilities


    The Deployer must ensure that all the entries declared by an application component
    are created and properly initialized.


    The Deployer may modify the entries that have been previously set by the Application
    Component Provider and/or Application Assembler, and must set the values of these
    entries for which a required value has not been specified. If an annotation includes
    the lookup-name element, the Deployer should bind it to the entry specified as
    the target of the lookup. Deployment should fail if the lookup element of an annotat-
    is not found.'
