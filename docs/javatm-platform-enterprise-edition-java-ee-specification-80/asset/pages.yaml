- pgno: 246
  md: '# CHAPTER EE.9


    # Profiles


    His chapter describes the requirements common to all Java EE profiles. It does
    not define any concrete profiles, delegating this task to separate specifications.


    The Java EE Profile Specification, published in conjunction with the present specification,
    defines the first Java EE profile, the Web Profile. The definition of other profiles
    is left to future specifications.


    # EE.9.1 Introduction


    A Java EE profile (from now on, simply "a profile") represents a configuration
    of the platform suited to a particular class of applications.


    A profile may contain a proper subset of the technologies contained in the platform.
    By doing so, a profile can effectively drop technologies which the platform supports
    but are not generally useful in a particular domain.


    A profile may add one or more technologies which are not present in the profile
    itself. For example, a hypothetical Java EE Portal Profile would likely include
    the Portal API (JSR-286).


    Additionally, a profile may tag certain technologies as optional. In this case,
    products implementing the profile may or may not include the technology in question.
    Naturally, if they do, they need to obey all the relevant requirements mandated
    by the profile specification.


    A product may implement two or more Java EE profiles, or the full platform and
    one or more Java EE profiles, as long as their combined requirements do not give
    rise to conflicts.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# EE.9.2 Profile Definition


    A profile is defined in accordance with the rules of the Java Community Process.
    Typically, a proposal to create a new profile, or to revise an existing one, will
    be submitted as a Java Specification Request (JSR). Once the JSR is approved,
    an expert group will be formed and conduct work as dictated by the process. The
    JSR for a profile must mention the version of the Java EE Platform it builds upon.
    Additionally, if it builds on an existing platform, it must maintain this fact
    as well.


    Although profiles can be created and evolved independently of the Java EE platform,
    modulo the rules contained in this specification, it is envisioned that profiles
    maintain a reasonable level of alignment with the platform itself, in order to
    avoid fragmenting the development space into progressively incompatible islands.
    To this end, a profile must be built on the most recent version of the Java EE
    platform at the time the profile is approved. It is also recommended that profile
    expert groups go beyond this requirement and, as much as it is practical, ensure
    their profiles build on the most recent version of the Java EE platform at the
    time the profile is finalized.


    # EE.9.3 General Rules for Profiles


    A profile must include all technologies that are required components of the Java
    EE platform or of any profiles on which it builds. These technologies will be
    listed as required in the profile.


    A profile may promote to status any technologies that are optional components
    of the Java EE platform or of any profile on which it builds.


    Unless mandated by a profile, any technologies that are optional components of
    the Java EE platform, or of any profile on which the profile in question builds,
    must be optional components of the profile itself.


    A profile may include as a required or as an optional component any technology
    outside of those included in the Java EE platform or any profile on which it builds,
    as long as the corresponding compatibility requirements are satisfied.


    A profile must preserve any requirements defined in the Java EE platform specification,
    or in the specification of any profile on which it builds, as long as the preconditions
    for those requirements are satisfied. Typically, the preconditions will involve
    the presence of one or more technologies among those included the profile. Unconditional
    requirements must be obeyed unconditionally.


    A profile may add any requirements that pertain to one or more technologies whose
    inclusion allows or requires them. Such requirements must not conflict with'
