    # EE.5.5 Enterprise JavaBeans™ (EJB) References


    This section describes the programming and deployment descriptor interfaces that
    allow the Application Component Provider to refer to the homes of enterprise beans
    or to bean instances using "logical" names called EJB references. The EJB references
    are special entries in the application component''s naming environment. The Deployer
    binds the EJB reference to the enterprise bean''s business interface, no-interface
    view, or home interface in the target operational environment.


    The deployment descriptor also allows the Application Assembler to link an EJB
    reference declared in one application component to an enterprise bean contained
    in an ejb-jar file in the same Java EE application. The link is an instruction
    to the tools used by the Deployer the binding of the EJB reference to the business
    interface, no-interface view, or home interface of the specified target enterprise
    bean. This linking can also be specified by the Application Component Provider
    using annotations in the source code of the component.


    The requirements in this section only apply to Java EE products that include an
    EJB container.


    # EE.5.5.1 Application Component Provider’s Responsibilities


    This subsection describes the Application Component Provider’s view and responsibilities
    with respect to EJB references. It does so in three sections, the first describing
    annotations for injecting EJB references, the second describing the API for accessing
