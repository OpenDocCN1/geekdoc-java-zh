    # EE.2.11 Java EE Product Extensions


    This specification describes a minimum set of facilities available to all Java
    EE products. A Java EE profile may include some or all of these facilities, as
    described in Chapter EE.9, “Profiles”. Products implementing the full Java EE
    platform provide all of them (See Section EE.9.7, “Full Java EE Product Requirements”).
    Most Java EE products will provide facilities beyond the minimum required by this
    specification. This includes only a few limits to the ability of a product to
    provide extensions. In particular, it includes the same restrictions as Java SE
    on extensions to Java APIs. A Java EE product must not add classes to the programming
    language packages included in this specification, and must not add methods or
    otherwise alter the signatures of the specified classes.

    However, many extensions are allowed. A Java EE product may provide additional
    Java APIs, either Java optional packages or other (appropriately named) packages.
    A Java EE product may include support for additional protocols or services not
    specified here. A Java EE product may support applications written in other languages,
    or may support connectivity to other platforms or applications.


    Of course, portable applications will not make use of any platform extensions.
    Applications that do use of facilities not required by this specification will
    be less portable. Depending on the facility used, the loss of portability may
    be minor or it may be significant.

    We expect Java EE products to widely vary and compete vigorously on various aspects
    of quality. Products will provide different levels of performance, scalability,
    robustness, availability, and security. In some cases this specification requires
    minimum levels of service. Future versions of this specification may allow applications
    to describe their requirements in these areas.


