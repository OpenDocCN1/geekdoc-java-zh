  md: '# EE.5.8.1.1 Injection of Resource Environment References


    A field or a method of an application component may be annotated with the Resource
    annotation to request injection of a resource environment reference. The name
    and type of the resource environment reference are as described earlier. The authenticationType
    and shareable elements of the Resource annotation must not be specified; resource
    environment entries are not shareable and do not require authentication. The use
    of the Resource annotation to declare resource environment reference differs from
    the use of the Resource annotation to declare other environment references only
    in that the type of a resource environment reference is not one of the Java language
    types used for other references.


    # EE.5.8.1.2 Resource Environment Reference Programming Interfaces


    The Application Component Provider may use resource environment references to
    locate administered objects that are associated with resource references as follows.


    +   - Assign an entry in the application component''s environment to the reference.
    (See subsection 5.8.1.3 for information on how resource environment references
    are declared in the deployment descriptor.)

    - This specification recommends, but does not require, that all environment references
    be organized in the appropriate subcontext of the component''s environment for
    the resource type. Note that resource environment references declared via annotations
    will not, by default, appear in any subcontext.

    - Look up the administered object in the application component''s environment
    using JNDI.


    # EE.5.8.1.3 Declaration of Resource Environment References in Deployment Descriptor


    Although the resource environment reference is in the application component''s
    environment, the Application Component Provider must not use a env-entry element
    to declare it. Instead, the Application Component Provider must declare all references
    to administered objects associated with resources using either annotations on
    the application component''s code or the resource-ref elements of the deployment
    descriptor. This allows the application''s JAR file consumer to discover all the
    environment references used by the application component. Deployment descriptor
    entries may also be used to specify injection of a resource environment reference
    into an application component.'
