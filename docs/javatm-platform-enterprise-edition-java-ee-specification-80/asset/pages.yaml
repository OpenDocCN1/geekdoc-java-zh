  md: '# JAVA PLATFORM, STANDARD EDITION (JAVA SE) REQUIREMENTS 161


    # EE.6.1.3 Pruned Java Technologies


    As the Java EE specification has evolved, some of the technologies originally
    included in Java EE are no longer relevant as they were when they were introduced
    to the platform. The Java EE expert group follows a process first defined by the
    Java SE expert group (http://reinold.org/blog/removing-features) to prune technologies
    from the platform in a careful and orderly way that minimizes the impact to developers
    using these technologies, while allowing the platform to grow stronger. In short,
    the process defines two steps:


    +   1. The Umbrella Expert Group (UEG) for release N of the platform decides to
    propose that a particular feature be removed. The specification for that release
    documents the proposal.

    2. The UEG for release N+1 decides whether to remove the feature from that release,
    retain it as a required component, or leave it in the "proposed removal" state
    for the next UEG to decide.


    The result of successfully applying this policy to a feature is not the actual
    deletion of the feature but the conversion of the feature from a required component
    of the platform into an optional component. No actual removal from the specification
    occurs, although the feature may be removed from products at the choice of the
    product vendor.

    Technologies that have been pruned as of Java EE 8 are marked Optional in Table
    EE.6-1. Technologies that may be pruned in a future release are marked Optional
    in Table EE.6-1.


    # EE.6.2 Java Platform, Standard Edition (Java SE) Requirements


    # EE.6.2.1 Programming Restrictions


    The Java EE programming model divides responsibilities between Application Component
    Providers and Java EE Product Providers: Application Component Providers focus
    on writing business logic and the Java EE Product Providers focus on providing
    a managed system infrastructure in which the application components can be deployed.


    This division leads to restriction on the functionality that application components
    can contain. If application components contain the same functionality provided
    by Java EE system infrastructure, there is clashes and mis-management of the functionality.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'For example, if enterprise beans were allowed to manage threads, the Java EE
    platform could not manage the life cycle of the enterprise beans, and it could
    not properly manage transactions.


    Since we do not want to subset the Java SE platform, and we want Java EE Product
    Providers to be able to use Java SE products without modification in the Java
    EE platform, we use the Java SE security permissions to express the programming
    restrictions imposed on Application Component Providers.


    In this section, we specify the Java SE security permissions that the Java EE
    Product Provider must provide for each application component type. We call these
    permissions the Java EE security permissions set. The Java EE security permissions
    set is a required part of the Java EE API contract. We also specify the set of
    permissions that the Java EE Product Provider must be able to restrict from being
    provided to application components. In addition, we specify the means by which
    application components may declare the need for specific permissions and how these
    declarations must be processed by Java EE products.


    The Java SE security permissions are fully described in http://docs.oracle.com/javase/8/docs/techniques/guides/security/permissions.html.


