  md: '# CONNECTION SHARING


    When the first connection to a resource manager is established as part of the
    transaction, a resource manager specific local transaction is started on the connection.
    Any subsequent connection acquired as part of the transaction that can share the
    local transaction on the first connection is allowed to share the local transaction.


    A global transaction is started lazily under the following conditions:


    +   * When a subsequent connection cannot share the resource manager local transaction
    on the first connection, or if it uses a different resource manager.

    * When a transaction is exported to a different container.


    After the lazy start of a global transaction, any subsequent connection acquired
    may either share the local transaction on the first connection, or be part of
    the global transaction, depending on the resource manager it accesses. When a
    transaction completion (commit or rollback) is attempted, there are two possibilities:


