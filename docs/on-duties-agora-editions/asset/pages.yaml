    encounter some adversity, they cannot fall as far. Consequently, it is not without
    cause that those who administer public affairs are spurred on by greater perturbations
    of the mind to accomplish greater pursuits than those in retirement. The more,
    then, they must employ that greatness of spirit and freedom from anguish.'
