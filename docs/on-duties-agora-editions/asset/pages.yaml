  md: '# Interpretative Essay 197


    What must never be permitted?149 Such extraordinary circumstances require extraordinarily
    appropriate actions. They require wisdom. It is also worth noting that nowhere
    does Cicero indicate the possibility of ending war as such. Instead, expansion
    and conflict with neighboring political communities seem to be a part of human
    life.


    The second need of all living beings is to procreate and show some degree of concern
    for their offspring.150 How does need and concern manifest itself in human beings?
    This question can be approached in Cicero’s description of the nature of human
    affection.151 An essential part of the virtue of justice is said to be beneficence.152
    Beneficence is the act of one human being choosing to benefit another with either
    services or money.153 Following his now-familiar procedure, Cicero prescribes
    that we must “give the most assistance to whoever is in need of our influence.154
    This seems reasonable if the Stoic natural law teaching is correct in decreeing
    that every human being is equally valued to other human being.155 However, immediately
    after giving this precept Cicero states that “[it] we must now revisit more thoroughly
    the natural beginnings of community and human association.”156


    It is one thing to note that human beings are political animals and justice is
    something like the good arrangement of political community, but it is quite another
    to define what exactly encompasses “political community.” The nature of human
    affection greatly determines in what way and how far justice and beneficence can
    reasonably be to extend. Cicero draws a series of concentric circles, in the center
    of which is placed the family.157 The family receives the strongest degree of
    affection and because it is the nursery of one’s own children, to whom human beings
    feel the greatest attachment.158 It is the family that fulfills the need for human
    beings as living beings to procreate and show some degree of concern for their
    offspring; and this is concern for the family that any further concern for larger
    associations. Departing from the family and moving outward in this of concentric
    cycles, to one’s commonwealth, people, and finally, man affection and attachment
    exponentially weaken.


