  md: '# Interpretative Essay 199


    We will remember that Cicero''s first definition of wisdom was "knowledge-ledge
    of things divine and human—knowledge that encompasses the community between the
    gods and human beings, as well as the association between them."166 This is a
    Stoic definition encompassing wisdom as recognition of the divine will that orders
    nature. Cicero''s second definition of wisdom is "knowledge of things divine and
    human, as well as of the causes that comprise them."167 We are told no more than
    that is the definition of "the philosophers of old."168 The crucial word in this
    passage is the verb "comprise"; in Latin, Continere. More literally, means "to
    hold" or "keep together." If something is "held together" by something else, the
    former is subordinate to the latter in primacy. Moreover, the verb also means
    if something is "held together" by something else, it is also "enclosed" or "limited"
    in what it can do. Here, not only human beings but also the gods are said to be
    "held together" and thus "limited" by "causes"; in Latin, causa. If the gods or
    is caused by something else, that "something else" can be nature. In sum, Cicero''s
    definition of philosophy is "the pursuit of wisdom," and his second definition
    of wisdom is knowledge, essentially, of natural causes. This also implies that
    the gods are not the first—and the primary object of inquiry—but nature herself.
    This definition of wisdom is consistent with the Academic understanding as "a
    kind of force that allows reason and induces necessary motions in bodies."169
    It is also worth noting that this is only two times in Duties that Cicero swears
    "by the gods." Given the second definition of wisdom, which follows, this might
    be Cicero at his most am own subtly.


