  md: '# On Duties


    them. A new proscription was drawn up and Antonius''s insistence Cicero''s name
    was placed at the top.


    The soldiers caught up with Cicero as he attempted to escape by sea. Plutarch
    writes that when Cicero saw him coming, he ordered his servants to put down the
    litter in which they were carrying him. Eyeing his would-be murderers with a steady
    stare, he stretched his own neck to be cut, and was slain.³35 Not Even Cato died
    with more courage.


    It was during this chaotic time in 44 BC, with his philosophical program complete
    and Rome embroiled in another civil war, Cicero wrote On Duties. Given both the
    completion of his program and the political turmoil, On Duties is Cicero''s most
    puzzling composition. Ostensibly written as a letter in lieu of a planned visit
    to see his son,36 Cicero first mentions the book in a letter dated October 28,
    in which he states that he would write on the nature of appropriate action a grand
    scale.³39 He writes again, reporting the first two books completed on November
    5, then refers to one final time on November 13 Given that he was back in Rome
    and fully engaged in politics on December 9,41 scholars the spectacle was completed
    in four weeks. The speed of its composition has led many scholars to explain away
    the conflicting statements or digressions as deficiencies owing to a lack of time
    for revision.³42 But will be demonstrated in the notes and especially in the interpretative
    essay, a great many of these “deficiencies” are intentional. They are meant to
    reveal a deeper understanding of appropriate action. Thus the speed with which
    Cicero wrote On Duties is all the more remarkable.


