  md: '# On Duties


    Prior problematic translations of officium are exacerbated by their editors’ translations
    of key adjectives describing the different degrees of appropriate action. Officium
    perfectum has been translated by Grant as “perfect,” Atkins as “complete,” and
    Miller, Higginbotham, Edinger, and Walsh as “absolute duty,” while officium medium
    has been translated by Miller as “mean,” Grant as “second-class,” Higginbotham
    and Edinger as “secondary,” Atkins as “middle,” and Walsh as “intermediate duty.”
    All are problematic. Cicero contrasts two kinds of appropriate action:


    those “entirely” appropriate (officium perfectum) and those “ordinarily” or “commonly”
    appropriate (officium medium or commune). Perfectum, from the verb perficer, is
    Cicero’s Latin substitute for the Greek kathroma, both of which mean “something
    done thoroughly” or “something accomplished successfully.” I have translated officium
    perfectum throughout as an “entirely appropriate.” Medium and Cicero’s substitutes
    for the Greek meson, both of which mean “midling,” “ordinary,” or “common.” Thus
    I have translated medium or commune throughout as “ordinarily” or “commonly” appropriate
    action,” respectively. Officium perfectum implies the true virtue of the mean;
    medium, the political virtue of the citizen.


    Other problems provide prior translations. For example, res publica is translated
    anachronistically by Miller, Higginbotham, and Walsh as “state,” misleadingly
    by Grant and Atkins as “republic,” and variously by Edinger as “government,” “country,”
    or “state.” Res publica literally means “the public thing” or “commonwealth.”
    As Cicero uses the term, res publica implies a proper distribution of power within
    a political community, or a good regime. It must be carefully distinguished from
    human association at its most basic level (hominin societas) and political community
    as such (civitas).⁴⁵


    While it is impossible to translate every word exactly the same way every time,
    I have made an effort to be consistent. Particular attention has been paid to
    key words such as those found in the glossary and subject index.


    Careful translation must be followed by careful interpretation. Therefore, this
    edition includes historical, philological, and


    > ⁴⁵When attempting to understand difficult terms, I believe it best to consult
    the author who actually uses them, especially if he defines them. As an Academic,
    Cicero almost always defines his terms. The difference between res publica and
    civitas, Cicero On the Commonwealth 1.39, 1.41–3.43ff. See also the glossary entries
    “commonwealth” and “political community.”


    All references to On the Commonwealth are from K. Ziegler’s M. Tullius Cicero:
    De res publica (Leipzig, 1969). I have chosen to follow this edition over the
    more recent one by J G. F. Powells who are more familiar with its section numbering.'
