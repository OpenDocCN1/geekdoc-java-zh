    Epicureanism was the last of the four great philosophical schools of antiquity,
    founded around 307 BC. Named after its father, Epicurus (341–270 BC), Epicureanism
    taught a materialistic philosophy in which the universe was the result of the
    chance collisions of invisible atoms moving through the void. Famous for its political
    stance, Epicureanism denied the existence of the common good, believing human
    beings to be first and foremost individuals. Ethically, it held the good to be
    synonymous with the pleasant, and the bad with pain. If the Stoics were accused
    of holding human well-being bound to the mind, the Epicureans were accused of
    holding it to be entirely bound to the body. Throughout his writings, Cicero consistently
    opposes Epicureanism.


    Cicero defines nature as it was understood by these four schools in his treatise
    On the Nature of the Gods. The first definition is Academic, and argues for a
    mechanical universe;21 the second, Stoic, an intelligent universe;22 and the third,
    Epicurean, a meaningless universe;23 The Peripatetics seemed to oscillate between
    the Academic and the Stoic conceptions;24


    Some posit that nature is a kind of force that lacks and induces motions in bodies;
    but others that nature is a force that participates in reason and order—as if
    she were proceeding along a path, revealing what she does for the sake of each
    thing, as she shows—no ingenuity, no hand, no craftsman can achieve by imitation....
    But there are still others who call everything by the name of “nature,” such as
    Epicurus, who divides everything within nature into bodies and void and the interactions
    that might occur between them.25


    As will be demonstrated, each of these understandings of nature shaped how each
    school understood human nature; deciding how the possible conflict between the
    honorable and the useful was resolved; and this resolution determined the appropriateness
    of an action. But as Cicero did not explicitly discuss nature as a whole in On
    Duties, we must begin with his discussion of human nature.


