    res publica is defined as being “the concern of a people.” It implies a proper
    distribution of power within a political community, or a good regime, as opposed
    to any distribution of power. Good regimes include monarchy, aristocracy, and
    democracy. Each of these three can be a “concern of a people,” while their opposites—tyranny,
    oligarchy, and anarchy—cannot. The former are good insolar as they take into account
    the common good; the latter are insolar as they do not.


    The question of what Cicero believed to be the best regime is contentious, as
    On the Commonwealth is a fragmentary dialogue. It is often advocated for the mixed
    regime, a blending of the three good regimes. To be sure, he believed the mixed
    regime was the best practical regime, insofar as it was far more stable than any
    of the simple regimes. However, Cicero’s best regime may not be too dissimilar
    from Plato’s. Monarchy is singled out as being the best regime, and there are
    strong suggestions that its monarch should be a philosopher-king. But, like Plato,
    Cicero saw such a regime as being highly unlikely, and most susceptible to corruption.
    For Cicero’s definition of res publica, see Cicero, On the Commonwealth 1.39,
    1.41, 3.43ff. For the mixed regime being the best practical regime insofar as
