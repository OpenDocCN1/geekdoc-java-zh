  md: '# Glossary


    This glossary is comprised of key words found throughout On Duties. It is not
    meant to be exhaustive. Words are listed alphabetically in English; further distinctions
    are listed in bold within a given entry. All words have been consistently translated
    unless otherwise noted.


    Academics (*Academicici*) The first of the four great philosophical schools of
    antiquity, the Academy was the school outside the walls of Athens, founded by
    Plato around 385 BC. Diogenes Laertius divided its history into three periods:
    the Old, Middle and New. The Old Academy he considered to be more dogmatic in
    its stance toward both. The New Academy, much more skeptical in Plato’s dialogues
    and the possibility of knowledge; The New Academy, also called Academic skepticism,
    considered absolute knowledge unobtainable; what can be known is more or less
    probable. Arguments are advanced on both sides of an issue to cover the most likely
    answer. Cicero associated this Academic skepticism with the position taken by
    Plato himself. However, it must be stressed that Academic skepticism was not Pyrrhism.
    Academic skepticism did not allow from accepting verisimilitude, or highly probable
    arguments. Through his writings, Cicero describes himself as an Academic skeptic,


    For as Academic skeptic, 2.7–8; Academics 1.17, 2.7–9; Tusculan Disputations 1.2–4,
    2.5–9, 3.12, 5.11; On the Nature of the Gods 1.6, 11–12; On Divinity 1.7, 2.8–9;
    On Fate 3.4–7. See also where Cicero’s claim that the dialectical Socratic method
    is superior, the skeptical Academic method is still followed. For Cicero maintaining
    that Academic skepticism is consistent with the position taken by Plato himself,
    Academics 1.46.


    **appetite** (*appetitus*) Appetite is the Latin equivalent of the Greek word
    horde. It implies a strong or passionate desire for something. I have translated
    both appetite and its cognate appetitio as “appetite.” Cicero contrasts appetite
    with reason. See 1.101 and 2.18. See also **reason.**'
