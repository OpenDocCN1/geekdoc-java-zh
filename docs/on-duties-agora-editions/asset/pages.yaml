  md: '# 4 On Duties


    to be the most outstanding advocate in Rome.20 This helped him win the praetorship
    in 66 BC, an office that served various functions, such as commanding the army
    or judging in the courts. In 63 BC he was elected a consul, one of two officials
    who served one-year appointments heads of state and the army. Each of the preceding
    two offices was won by Cicero on the first attempt, at the minimum age requirement,
    and perhaps most impressively, as a novus homo, or “new man”. It was exceedingly
    rare for such a new man, ancestors had never been senators, to be admitted into
    the Senate, let alone win in his highest office.


    During the year of Cicero’s consulship, Catilina21 attempted to overthrow the
    government. The conspirators were largely a group of debt-ridden senators who
    hoped to erase the debt credit. The conspiracy was thwarted by Cicero’s vigilance
    in Rome, although an army had to be against Catilina and the remnants of his army
    in Etruria. The temporarily great Roman people gave Cicero the honorary title
    Pater Patriae, or Father of the Fatherland.22 When the danger passed, Cicero’s
    enemies, led by Cludius Pulcher,23 exiled him in 58 BC on the grounds that he
    executed the leading conspirators, who were Roman citizens, without a trial. This
    exile might have been avoided had Gaius Julius Caesar’s offer to join what became
    known as the First Triumvirate, Gnaeus Pompeius Magnus and Marcus Licinius Crassus
    Dives.24 The purpose of this union was to advance the careers of each of them
    at the expense of the common good. Cicero recognized the new conspiracy for what
    it was, and refused. His house on the Palatine, his villa at Tusculum was ravaged,
    and he was forced to flee into Macedonia.


    A year later his friend Titus Annius Milo,25 tribune, secured his return, and
    was warmly welcomed back into Italy and Rome. The First Triumvirate dominated
    Roman politics that Cicero’s efforts to reintegrate himself into political life
    proved futile. Disgusted, he withdrew from politics and devoted himself to writing.
    It was at this time his three most political works of philosophy were written,
    On the Orator in 55 BC, On Commonwealth (or The Republic) in 51 BC, and On the
    Laws around 50 BC.26 Yet Cicero did not remain entirely inactive during his time.
    In 53 BC he was elected, a priest who


