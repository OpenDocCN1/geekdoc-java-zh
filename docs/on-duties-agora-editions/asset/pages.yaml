    and fully realizes its distinctive characteristics, as it thrives; it will be
    happy. inasmuch the characteristics specific to a given living being may be called
    its virtues. What are the virtues specific to human beings?


    Most classical political philosophers singled out reason as the defining characteristics
    of human beings. Therefore, after discussing the characteristics common to all
    living beings, Cicero turns to the virtues specific to human beings, beginning
    with reason. Cicero defines reason when describing the nature of the human mind.
    He states the human mind has both appetite, which “pulls a human being in and
    there,” and reason, which “teaches and explains what must be done or avoided.”^29
    This use of reason in a human being’s ability to perceive deep “the causes of
    things,”^30 an ability that is itself prompted by innate “longing to inquire and
    know.”^31 Consequently, it may be said that the “inquiry into truth belongs especially
    to human nature.”^32 By contrast a beast has both appetite, and so “is roused
    insofar as to apply itself to what is immediate and present—and this alone—with
    minimal awareness of past or future.”^33 Reason is the crucial difference between
    man and beast, and so exceedingly irrational human beings are to be regarded as
    little better than beasts.^34 With the discussion of reason complete, the virtue
    of wisdom has been introduced.


    It is at this point in a discussion of human nature that the Academics, Peripatetics,
    Stoics, and Epicureans disagreed. The ability and inclination to discern the causes
    of things allows man to control for them; insofar as man can control for future
    events, he may be said to have power over them or a social animal.^35 The crucial
    question now becomes, Is by nature an individual or a social animal? If he is
    a social animal, how social? If man is an individual, he will use his power of
    reason to further his individual ends, thinking of the common good only insofar
    as is convenient for him to do so; if he is a social animal, he will use it, to
    the extent that he is social, on behalf of the common good for its own sake. The
    Epicureans argued that man was entirely individualistic; the Stoics, that he was
    social; the Academics and Peripatetics, that he was social to a degree.


