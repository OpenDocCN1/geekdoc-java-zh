  md: '# Glossary


    use of animus as courage, see, e.g., 1.61–63, 2.36, 3.47; as intention, see, e.g.,
    1.45, 1.49, 1.66. See also greatness of spirit.


    Stoics (Stoic) The third of the four great schools of antiquity, the Stoics were
    named after the Stoa Poikale, or “Painted Porch,” in the Athenian Agora, in which
    they found, Zeno of Citium (335–26 BC), taught beginning around 30 BC. Stoicism
    taught a deterministic philosophy in which the universe is ruled by a divine mind.
    Ethically, it held the only good to be virtue. All else either morally neutral,
    that is, to be “preferred” or “rejected,” or was simply bad. If the Epicureans
    understood human well-being to be wholly bound to the body, the Stoics were accused
    of holding it to be entirely bound to the mind and virtue.


    sustenance (victimus) means “the things upon which one lives,” and so implies
    the basic necessities of life, such as food, clothing, shelter, and the availability
    of other resources. This is the Ciceroian equivalent of Aristotle’s chore, or
    basic “equipment” for necessary life, to say nothing of virtuous life. I have
    translated it consistently imperfectly as “sustenance.” See exp. 1.12 and 1.158.
    See also Aristotle, Politics 1325b34ff.


    those attached to the multitude (populares) A popularis was not a democrat. He
    was someone who bypassed the Senate in order to get something approved directly
    by the people. Thus a popularis was not necessarily an adherent of democratic
    initiatives, but supported them in order to advance his own political agenda.
    I have translated populares as “those attached to the multitude.” See best people,
    adherents of the.


    unjust (iniustus) See injustice.


    unjustly (iniuste) See injustice.


    use (usus and utile) See utility.


    useful (utile) See utility.


    utility (utilitas) Utilitas and its cognates cogn and utile are derived from the
    verb uti, “to use,” “to enjoy,” or “to take advantage of.” Utility includes what
    is advantageous or profitable, but also what is necessary, such as the basic necessities
    of life. I have translated utus, utile, and utilitas as “use,” “to use,” the “useful,”
    and “utility,” respectively. Constant translation of uti is particularly important,
    as Cicero makes good use of the verb in order to draw readers’ attention to how
    much the “useful” encompasses.


    The conflict between the useful and the honorable is one of two fundamental conflicts
    in Duties, the other being the conflict between the virtues of wisdom and justice.
    See 2.1. See also.


    virtue (virtus) Virtus, “virtue,” is the Latin equivalent of the Greek word arete.
    Unlikearete, virtue literally means “the qualities of being a vir,” a man, as
    opposed to a woman. Originally these qualities implied manliness, resolution,
    and value, especially martial value. The concept gradually took to the meaning
    of'
