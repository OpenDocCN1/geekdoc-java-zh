  md: '# Glossary


    appropriate action (officium) Cicero selected officium as the Latin translation
    of the Greek word kathekon. Except for the traditional title and a few noted rare
    instances, I have avoided the traditional English translations of officium as
    “duty” or “obligation,” preferring to adopt the most euphonic, but much more accurate
    “appropriate action.” Duty and obligation Cicero understood the concept implies
    actions that look toward the preservation and cultivation of human action or the
    common good. Not all actions that are appropriate either the needs or the virtues
    of beings looks to the common good. Translations such as duty and obligation do
    not encompass officia in general. While I have consistently translated officium
    as “appropriate action,” it is sometimes awkward in English to put the words side
    by side. In such instances, I separate them. However, the reader will always know
    officium is translated because the words “appropriate” and “action” appear within
    the same clause. See, e.g. 1.59. “Now in presently performing these actions, we
    consider what is most necessary for each person, and what each person could not
    obtain without our help. These degrees of rapport and those of circumstance are
    not the same, and there are actions which are more appropriately suited to some
    others.


    Cicero contrasts two kinds of appropriate actions: officium perfectum, or those
    that are “entirely appropriate,” and officium medium or commune, or those that
    are “ordinarily” or “commonly appropriate.” Perfectum, from the verb facere, is
    Cicero’s substitute for “something done thoroughly” or “something accomplished
    successfully.” Thus I have translated officium throughout as an “entirely appropriate.”
    All of which mean “middling,” “ordinary,” or “common.” Thus I have translated
    officium medium or commune throughout an “ordinarily” or “commonly appropriate
    action,” respectively. Offilium perfectum implies the true virtue of the wise
    man; officium medium, the political virtue of the citizen. For Cicero choosing
