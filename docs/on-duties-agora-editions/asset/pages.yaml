  md: '# Introduction


    intertextual notes to assist readers. Since Cicero is concerned with prescribing
    precepts in On Duties, it is no surprise that he supports them with numerous historical
    examples. Many of these examples are repeated over the span of the book and can
    be difficult to remember. Thus I have made a note under each such example, referring
    back to its original usage and my explanatory note. The exception to this rule
    is when a given example is used so often in On Duties as to become—for example,
    Themistocles, Socrates, Plato, Lucius Crass, Gnaeus Pompeius Magnus, Gaius Julius
    Caesar, and so forth. In such instances, unless additional clarification is needed,
    only the original note and explanation are given. Furthermore, Cicero was a master
    linguist and endeavored to choose his words carefully. Readers must pay close
    attention to Cicero''s word choice and syntax in any given subject. I have made
    note of those important philosophical occurrences that I discovered, as well as
    those in which I believe to a more literal translation is warranted. Finally,
    intertextual references have been largely limited to the extant sources to which
    Cicero would have access. However, references to early modern thinkers, in particular,
    Machiavelli and Hobbes, are included in the notes. These early modern thinkers
    and their referred works are not meant to be exhaustive, only illustrative. I
    have done this first, to draw out the conflict between classical and modern political
