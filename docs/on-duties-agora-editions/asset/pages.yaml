  md: '# On Duties


    reread the text. Thus some of the entries are broader in scope than normally be
    found in a glossary.


    A few further words on the translation. Cicero is not Tacitus and should not be
    translated as if he were. He wrote in florid periodic prose, not terse epigramatic
    sentences. Periodic prose is characterized by long sentences in the main clause
    or point is usually placed towards the middle or end of the sentence, following
    a series of subordinate clauses that support or modify the main clause. Such prose
    is not exclusively in such sentences, but it is heavily infused with them. When
    used effectively, periodic prose is powerful and ornate; when not, it is long-winded
    and overwrought. Too often editors chop Cicero''s sentences in an effort to make
    them easier to read. True, his sentences sometimes grant upon English ears if
    not broken upon. Also true, as Cicero himself points out, his philosophical works
    are written in a more forceful speeches. But On Duties “able and temperate style”
    is still written in periodic prose, and whenever possible I have tried to preserve
    the style I have to capture something of its rhythm through good use of junctions
    between sentences. Readers would feel as if they were reading a master of the
    “grand style” of oratory. To translate On Duties would be to sap its prose of
    vitality and rhetorical power to rob Cicero of his most effective and renewed
    toll.


    Moreover, Cicero almost never uses elision, and so it is inappropriate for a translator
    to use contractions. This translator has respectfully banished all uses of the
    apostrophe from his translation.


    This translation is based on the text of M. Winterbottom.47 As classical Latin
    texts did not use word spacing, punctuation, or graphing, Winterbottom has inserted
    them, and I have largely followed his text, deviating infrequently. Occasionally
    I have resorted to the critical apparatus, marking the change in the notes. Sections
    that are bracketed as being likely interpolations, with which I agreed, have also
    been placed in the notes. The only time I have ever deviated from Winterbottom
    has been in paraphrasing exchanges of dialogue. These exchanges are meant to introduce
    an element of dialectic in the treatise and give rise to potentially troubling
    questions. This is especially apparent in the third book, which explicitly addresses
    the possible conflict between the honorable and the useful. For historical references
    I have consulted the Oxford Classical Dictionary, second and fourth editions;48


