    For these words of god, evil, and contempt are ever used with relation to the
    person that useth them, being nothing simply and absolutely, nor any common rule
    of good or evil to be taken from the nature of the objects themselves, but from
    the person of man (where there is no commonwealth), or (in a commonwealth) from
    the person that representeth it, from an arbitrator or judge whom men disagreeing
    by consent set up, and made his sentence the rule.¹¹¹⁵


