    The first of the four great philosophical schools of antiquity, the Academy was
    the school outside the walls of Athens, flourished by Plato (ca. 429–347 BC) around
    385 BC. Diogenes Laertius (fl. 3rd century AD) divided its history into three
    periods: the Old, Middle, and New Academy. Cicero recognized only two: the Old
    and the New. The Old Academy he considered to be more dogmatic in his approach
    to Plato’s dialogues and the philosophy of knowledge; the New Academy, much more
    skeptical in his stance toward both. The New Academy, also called Academic skepticism,
    considered absolute knowledge unobtainable; what can be known is more or less
    probable. Arguments are advanced on both sides of an issue in order to uncover
    the most likely answer. Cicero associated this Academic skepticism with the position
    taken by Plato himself.¹ However, it must be stressed that Academic skepticism
    was not Pyrrhon. Academic skepticism did not allow accepting verisimilitude, or
    highly probable arguments. Through his writings, Cicero consistently describes
    himself as an


    The Peripatetics were so called after their founder Aristotle’s (384–322 BC) habit
    of lecturing while walking the colonnades of the Lyceum. The Lyceum became famous
    for its association with Aristotle and his students, long before it had a gymnasium
    dedicated to Apollo Lyceus, or “Wolf-God.” Founded around 335 BC, Peripatism taught
    that the universe emanated from a first mover, a perfect being that all lesser
    beings strive to imitate. Ethically, it maintained a position between that of
    Epicureanism and Stoicism. Virtue held bodily pleasures and external things to
    be good, but virtue to be the highest good. Thus human well-being was given to
    both body and mind, with greater emphasis given to mind and virtue.


    The Stoics were named after the “Painted Porch,” or Stoa of the Athenian Agora,
    in which their founder, Zeno of Citium (335–263 BC), taught beginning around 300
    BC. Stoicism taught a deterministic philosophy in which the universe is ruled
    by a divine mind. Ethically, it held the only good to be virtue. All else was
    either morally neutral, that to be “preferred” or “rejected,” or simply bad. Thus
    they were accused of holding human well-being to be wholly the mind and virtue.


