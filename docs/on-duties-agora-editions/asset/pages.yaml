    preeminent people. Some of these people live in the country and take delight in
    their family estate. (70) Their objective is the same as that of kings: to want
    nothing, to obey no one, to make use of a liberty that is characterized by living
    as you please. This objective, then, common both to those longing for power and
    to leisure I mentioned. The first they can see if they have significant influence;
    the second, if they are content with the little that is theirs. Neither sentiment
    is entirely de despised, but the life that is easier and safer, as well as oppressive
    and less to others, is that of leisure. Still, the life more profitable to the
    human race, and more fitting to renown and greatness, is that of those who devote
    themselves to public affairs and the performance of great deeds.


    (71) So perhaps we must condemn those who do not devote themselves to public affairs,
