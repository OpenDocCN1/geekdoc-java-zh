  md: '# Introduction


    You hold in your hands one of the most famous books ever written by one of the
    most famous men who ever lived. Marcus Tullius Cicero was a preeminent Roman statesman,
    orator, and philosopher. He was a champion of republican government, who successfully
    defended the Roman commonwealth against its overthrow by Lucius Sergius Catilina;
    a powerful speaker, who transformed Latin into the language of learning for sixteen
    centuries to come; and a prudent man into Christianity and the modern world. De
    officiis, or On Duties, has been considered a source of moral authority throughout
    classical, medieval, and modern times. It was championed by thinkers of no less
    than Thomas Aquinas, Montesquieu, and Voltaire; it was of decisive influence by
    Hugo Grotius and his On the Law of War and Peace; it was one of the earliest books
    printed on the Gutenberg press. But the true significance of On Duties lies in
    its examination of several fundamental problems of political philosophy, the most
    important being the possible conflict between the honorable (honestum) and the
    useful (utile). The honorable encompasses the virtues of human beings, which include
    justice and concern for the common good. The useful encompasses the needs of living
    beings, which include certain necessities and concern for private good. Only by
    understanding the possible conflict between these two sides of human nature may
    we understand our duties to the community and to ourselves. Throughout On Duties,
    Cicero continually poses the question, Is there conflict between the honorable
    and the useful? Is there ever a time when necessity overcomes justice, or when
    private good conflicts with public good?


    This new edition of On Duties aims to provide readers who cannot read Latin but
    wish to carefully study the book with a literal elegant translation. Over the
    last century there have been five complete and'
