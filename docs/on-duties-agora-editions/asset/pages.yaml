- img_proc: true
  md: 'philosophers Aristotle believed incapable of consistently submitting passion
    to reason and of attaining wisdom. See Aristotle, Cicero 1260a.


    Cicero distinguishes virtue in On Duties as encompassing four sorts of qualities:
    wisdom, justice, magnanimity, and property. These virtue he collectively collects
    all "honorableness." See 1.15 and 1.61: see also greatness of spirit, honorableness,
    justice, property, and sapientia.


    wisdom (sapientia) Sapientia is the first virtue comprising the honorable. Cicero
    carefully distinguishes between sapientia, "wisdom," and prudentia, "prudence."
    He defines wisdom twice. The first is Stoic in 1.153, in which wis dom is said
    to be "knowledge of things divine and human—knowledge that encompasses the community
    between the gods and human beings, as well as the association between them." The
    second definition is that of "the philos- phers of 2.5, in which is said to be
    "knowledge of things divine and human, as well as the causes that comprise them."
    The first definition explicitly states that wisdom is dependent upon the divine,
    while the second implicitly hints that wisdom is something dependent upon nature.
    See god and nature.


    Cicero''s teaching on wisdom, however, can only be grasped by carefully studying
    On Duties as it essentially requires readers to understand the difference between
    "entirely" and "ordinarily" appropriate tions. Here I will offer a general observation
    on Cicero''s teaching on On Duties. Cicero''s exceedingly treatment of wisdom
    in 1.18-19 is pain- fully noticeable. What is the reason for the apparent neglect?
    Consider that Cicero states he will only consider appropriate actions, not entirely
    appropriate ones (see 1.7). Next, consider that when discussing the remaining
    virtues, useful things, or their comparisons, Cicero generally offers a definition:
    he introduces an overly simplistic definition of the subject under consideration,
    proceeds to give precepts in light of that definition, and then muddies the world
    by listing an exception or two. In doing, he effectively argues on both sides
    of an issue and behaves like the Academic skeptic he is (see 2.8). Finally, consider
    that On is addressed to Cicero''s young son, Marcus, but not only to Marcus (see
    2.45); it concerns Rome, but not solely Rome (see 2.74). It is addressed to all
    potential statesmen. These statesmen may or not have the potential for wisdom.
    How can a man understand that he is incapable of understanding, or again, how
    can you teach a man something that cannot be given as a precept? What must be
    understood by first discussing ordinarily appropriate actions and then introducing
    their ex- ceptions, Cicero invites readers to consider what an entirely appropriate
    action'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'might look like. Thus he makes readers discover the probable “right” answer
    for themselves. The entire treatise turns into one long dialogue between the author
    and the reader. Truly, this is the only way to teach the virtue of wisdom. See
    appropriate action.


    Cicero further declares wisdom to be the preeminent virtue. However, throughout
    On Duties there is a tension between wisdom and justice, that is, between the
    claims of the contemplative life and those of the political life. This is one
    of two fundamental conflicts in On Duties, the other being the honorable and the
    useful. For the conflicting superiority of wisdom and justice, see it 1.153-60.
    See also justice.


    woman (mulier) Cicero draws a distinction between homo, “human being,” and mulier,
    “woman,” as opposed to vir, “man.” The former includes qualities shared by both
    men and women; the latter, qualities shared only by women. I have translated mulier
    as “woman” and muliebris as “womanly.” See 1.61, 1.130. See also human being and
    man.


    womanly (muliebris) See woman.'
