    Cicero the Academic skeptic acknowledged both the honorable and the useful as
    two sides of human nature. He could define “a commonwealth as a ‘concern of a
    people.’ But a ‘people’ is not simply any group of human beings united in any
    way, but a group of great size, united in agreement about what is right and well
    as for mutual utility.$^{133}$ Thus he could teach that the appropriateness of
    every action must take into consideration both honorableness and utility.


    Cicero followed the Peripatetics in emphasizing the importance of both the honorable
    and the useful, while holding the former to be more important of the two.$^{134}$
    He admitted, albeit discreetly, that there is a conflict between the honorable
    and the useful. While he would continually introduce such deliberation throughout
    the first two books, let alone include the entirety of the third? Consider that
    Cicero does not judge honorableness solely on the character of whether it produces
    pleasure or reduces pain, he does concede that first, honorableness is sometimes
    useful;$^{135}$ second, the appropriateness of honorableness requires useful things
