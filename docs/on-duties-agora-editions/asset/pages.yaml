    The solution to the passage seems to be the phrase “distinguish in thought.” Certain
    philosophers believed to distinguish between the honorable, the useful, and their
    possible conflict, so they use questions as “What is honorable?” “What is useful?
    Do they conflict?” and if so, “Does the honorable take precedence over the useful,
    or the useful over the honorable?” Such distinctions are helpful for them in “thought,”
    that is, in thinking through these questions. The Stoics alone answered them with
    a syllogism as “Whatever is just is also useful; and, likewise, whatever is honorable
    is likewise useful.”

