  md: '# Introduction 7


    commentator, to seek the author’s intention and communicate it to readers. All
    editors strive to achieve this difficult feat, and so I begin my brief critique
    of prior editions with a humble bow of respect to their editors. I may not have
    always agreed with their translations or interpretations, but I always benefited
    from consulting them.


    Problems with prior editions begin with the translation of the very title and
    subject of the book, the word *officium*, translated by Meller, Edinger, and Atkins
    as “duty,” and Grant, Higginbotham, and Walsh as “obligation.” Cicero chose *officium*
    in the Latin translation of the Greek word *kathekon*, literally, “appropriate
    action.”⁴⁵ Except for the title,⁴ I have preferred the much more accurate translation
    of “appropriate action.” Duty and obligation as Cicero understood the concept
    implies that action look to the preservation and cultivation of human association
    or the merit good. Not all actions that are appropriate to the needs or the virtues
    of human beings look to the good. These translations as “duties” and “obligations”
    do not encompass *officia* in general. No elegance suffices with more literal
    translation. While I have consistently translated *officium* as “appropriate action,”
    it is sometimes awkward in English to put the words by side. In such instances,
    I separate them. However, readers will always know *officium* is being translated
    because the words “appropriate” and “action” always appear within the same clause.
    Compare Atkins’s translation of *On Duties* 1.59 with my own:


    But, one when bestowing all useful duties to look at what each person most greatly
    needs, and what would or not be able to secure without our help. The degrees of
    ties of relationship will not be the same as those of circumstance. Some duties
    are owed to one group of people rather than to another. (Atkins)


    In appropriately performing all these actions, we must consider what is most necessary
    for each person, and what each person could not obtain without our help. Thus
    degrees of rapport and those of circumstance are not the same, and there are actions
    that are more appropriately owed to some than to others. (Newton)


    > ⁴⁴See Cicero, *Letters to Atticus* 16.11.4, 16.14.3.

    ⁴⁵Just as translators recognize that *The Republic* is a poor title for Plato’s
    *Politeia*, but respect long-standing usage, I recognize that *On Duties* is a
    poor title for Cicero’s *De officiis*, but retain it. The most appropriate title
    would be *On Appropriate Actions*. See the the glossary entry “appropriate action.”'
