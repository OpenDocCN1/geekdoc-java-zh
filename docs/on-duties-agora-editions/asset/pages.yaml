    congregate, as well participate in such assemblages. And it is because of these
    things that it eagerly desires to prepare those things needed for cultivation
    and sustenance;⁴² not only for themselves, but for their spouses, children, and
    others they hold dear and ought to protect.⁴³ This concern kindles their spirits
    and makes them greater in the conduct of their affairs.⁴⁴


    (13) Particularly peculiar to the human being is the examination and investigation
    into the truth. And so when we are free from necessary business and concerns,
    we crave to see, hear, and learn.⁴⁵ We consider inquiry either hidden or admirable
    things necessary for a blessed life.⁴⁶ Consequently, we may understand what is
    true, simple, and sincere is most fitting for human nature. Associated with this
    longing for seeing the truth is a certain appetite for preeminence, that a spirit
    well formed by nature wishes to obey no one except—for his unity—one who advises
    or teachers or who rules and legitimately. From this arises greatness of spirit
    and contempt for human concerns.


    (14) This force of nature and reason is truly considerable, since this animal
    perceives what is orderly, what is proper, and what a measure in deeds and speech.
    And so no other animal perceives the beauty, elegance, and harmony of the parts
    of the visible world. Nature and reason, extending this similarity from the eyes
    to the mind, have thought all the more that beauty, constancy, and orderliness
    ought to be preserved in decisions and deeds; and they caution anything is done
    improperly or effeminately, or in all opinions and deeds, lest anything is done
    or reflected upon lustfully.⁴⁷


    Cicero, classical and modern philosophy, is whether man is by nature an individual
    or a social animal. If the former, he will use his power for his own desires,
    thinking of the common good only insofar as it is convenient for him to do so;
    if the latter, he will, to the extent that he is social, benefit of the common
    good for his own sake.


