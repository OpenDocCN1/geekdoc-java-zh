    To be an empathic communicator is to be emotionally mature in yourself


    and comfortable with emotions, whatever they are. It’s the ability to be


    vulnerable enough to feel, rather than run away from feelings, grasp at


    solutions or avoid discomfort at all costs. In fact, the better you’re able to


    tolerate your own discomfort without rushing in to fix or deny it, the more


