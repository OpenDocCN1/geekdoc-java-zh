    an argument!


     


    Though there is no bad intent, the conversation ends poorly primarily


    because Y fails to see that their listening style isn’t appropriate to the


    situation, and responds on the wrong level. The reverse could also be true:


    if X and Z from work were to discuss the issue, they would both fare better


    by adopting a more content-focused approach.


     


    This is worth repeating: the problem here wasn’t that either party was


    “wrong” or behaving badly, or even that there was a problem in the message


    itself. Rather, we can see with conversations that individual difference,


    context and intention make all the difference.


     


    There are two other styles in Barker’s theory, however, and some natural


    overlap between each. “**Action-oriented**” listeners are curious about what


    needs to be done or has been done already, who does it, and what actions


    are underway. For them, things need to be clear, obvious and translatable to


    the real world. When mismatched in style, these listeners can appear


    impatient, controlling or dismissive of others, responding to thoughts or


    emotions with a sort of “so what?” attitude. Leaders and those in action-'
