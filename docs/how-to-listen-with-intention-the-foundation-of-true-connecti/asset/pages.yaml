    **Chapter 1. One Mouth but Two Ears**


     


    We’ve all got two ears but only one mouth, right? This means we


    should do about double the listening versus speaking, but the truth


    is doing so goes against our natural instinct. We are wired to


    express and talk about ourselves—to the extent that it provides the


    same type of neurological stimulation as sex. Fair enough, but that


    doesn’t mean talking nonstop is acceptable or helpful to our


    relationships.


    It’s time to view listening as the true win-win in cultivating deeper


    relationships. When you listen, you not only get to learn about


    someone, you are (paradoxically to some) seen as more charismatic,


    interesting, and enjoyable to interact with. So if your end goal is to


    be those things, listening is the skill you must perfect. It’s a simple


    skill, but certainly nothing close to easy.


    The challenge is that there are so many unconscious ways we wrest


    control over a conversation and become a conversational narcissist.


    This is simply when someone speaks so much that it appears to be a


    monologue versus a shared dialogue. One subtle way this occurs is


    through support versus shift responses, where the feeling you


    impart to others can hinge on a single vocabulary choice. The


    underlying theme, however, is to accept letting go of control, pride,


    and ego, and go wherever someone else wishes to go.'
