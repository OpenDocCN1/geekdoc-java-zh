    hear and communicate with them.


    *1\. Be present.* First of all, show up. This is at once the easiest yet trickiest


    step of all. It doesn’t mean just being physically present and maintaining


    eye contact. Being present is actually more like two smaller steps: giving


    your partner your absolute attention, then being accommodating and


    understanding that they’re dealing with big emotions at the moment.


    The first part is physical: it just means eliminating distractions. Turn off


    your phone, switch off the TV, and reduce the volume of music to a hum in


    the background. (You could also just turn it off, but relaxing music can


    make the environment for communication a little easier.)


    This is obviously more complicated in a public place—if it’s easy to move


    to a quieter spot, do so. If not, try to ward off distractions by keeping


    complete visual focus on your partner and leaning in to hear if you have to.


    Angle your body toward them and use open, accepting gestures, postures


    and facial expressions.


    The second part means accepting your partner’s strong feelings—showing


    up in a sensitive way. We can react too quickly to a display of intense


    emotion, and it’s fair to feel initially startled when someone’s severely sad


    or angry. As soon as the shock recedes, though, it’s crucial to let your


    partner know you want to deal with them as they are. You can do this by


