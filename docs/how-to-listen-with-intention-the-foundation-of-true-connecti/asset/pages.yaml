  md: ' 


    It bears remembering this when you think about how you can become a


    better conversationalist yourself. Try to think of why some conversations


    have left you feeling ignored, misunderstood or not really heard—what was


    the other person’s attitude to you? Perhaps we can put our own “narcissism”


    to good use here. To be good listeners, we need to give other people the


    opportunity to speak, be heard, take up space with their stories—i.e., what


    we want when we’re tempted to butt into or dominate conversations!


     


    Think of it as being reflective—not absorbing a story so much as bouncing


    it back to the speaker, like in our proverbial game of tennis. You may have


    encountered this when interacting with a very young child. When babies are


    very little, they have to learn about who they are, what they’re feeling, and


    what their experiences mean.


     


    A mother might look at a crying child and mimic his frowning expression,


    saying, “Aw, are you unhappy about that?” Essentially, by doing this, she


    teaches the child that his emotion is called “unhappy” and even though he


    can’t quite understand it in himself, he can see the expression on *her* face,


    and begin to make sense of his own experience.


     


    In other words, empathetic reflection helps people deepen and comprehend


    their own experience. It’s why it’s so important to be “witnessed” in so


    many areas of life, why we need an audience at times, why we need others


    to give us their attention—in a very deep way, it confirms what we are


    feeling, and even deeper still, confirms that we simply exist.


     


