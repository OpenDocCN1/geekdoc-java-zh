  md: 'Have a little faith, suspend judgment and—again—just listen. Drop any


    preconceived ideas about what makes a person interesting—some of the


    most fascinating people are out there, just a few pointed questions away


    from being discovered. Be open to being proven wrong, to being surprised.


    Decide to actively look for the good and the interesting in others. It’s an old


    adage that “you can learn something from everyone,” and it’s true. Look at


    conversation as a means of finding out exactly what that thing is.


     


    If you immediately judge someone as uninteresting, they will undoubtedly


    remain that for you. Judge them differently, and they will become that as


    well. Use this to your advantage.


     


    It’s rude to assume people are boring simply because they don’t wow you


    after a few minutes, especially when you may be assisting in it by lobbing


    boring questions at them. This in itself can be rather narcissistic—to think


    of other people in terms of their entertainment value to you, rather than as


    individuals in their own right. When you don’t really know someone, it’s


    hard to be concerned about the mundane details of their lives, but you’d


    certainly care more if they were very important people to you.


     


    The idea is that people are not boring, exactly, but just that you don’t know


    them well enough to care. You can see the catch-22—you can only get to


    know someone if you first go through the “boring” small talk and try to


    forge a closer connection. Being sociable is something that builds on itself.


    It starts with extending a gesture of goodwill to the other person. You don’t


    know that they’re interesting, but you hope and expect they are, and you


    reach out in faith that your investment will be worth it later on.


     


    In other words, some people enter conversations expecting an immediate


    payoff, whereas in reality it’s more common that you need to invest a little


    first, and wait patiently for a reward that may take a while.


     


    You don’t need to force anything. Just be open and receptive and give it a


