  md: ' 


    Those who seem most boastful in a conversation, who jealously guard


    attention or speak over others, are often those who feel most insecure in


    themselves. Their need to control the conversation comes from a hunger for


    attention and approval. If you find yourself using conversations as a


    platform to boost your ego, feel better about yourself or be witnessed and


    supported by others, your work may be to learn to be comfortable taking the


    back seat for a change. The paradox is that people who seem most likeable


    and confident are those who don’t appear to be making frantic efforts to


    dominate others’ attention.


     


    *Be egalitarian*


     


    Do you have any unconscious beliefs about what conversations are actually


    for? Some people speak because they want a soapbox to share their


    opinions, or they want to “teach” others and tell them exactly what’s what,


    or simply to demonstrate superiority in some way or another. Become


    aware of *why* you’re conversing. Are you genuinely curious about the


    human being in front of you? Have you already made up your mind about


    them, or do you simply see them as an audience for your agenda (which you


    refuse to stray from), a sparring partner, a competitor?


     


    Good listeners stay in the moment, and don’t get distracted with their own


    concerns when they’re meant to be focused on someone else. Try to treat


    conversations as pleasurable opportunities to give and take, and to witness


    another as much as revealing oneself.


     


    Does it frequently end up being the case that your conversation partners


    know a ton about you, but you don’t know very much about them? This


    would mean that the flow of information is decidedly one-sided, and that


    you are monopolizing the air space. Do you actually ask others questions?


    When is the last time you asked five questions in a row?


     


    All of this leads us round again to the most important conversation skill—


    listening. Great communicators tend to speak *less* than poor


    communicators. Though the ego might not like it, the truth is that you don’t'
