  md: '**Active Listening**


     


    We talked in the previous chapter about the five levels of listening. How do


    we reach the ultimate level? Just as learning to read and write takes


    practice, so does the art of active listening.


    Active listening is one of the strongest relationship-building skills you can


    have in your arsenal. It establishes respect and concern for your partner’s


    viewpoints and makes it easier for you to process information that’s


    intricate and difficult to understand through passive listening. It also eases


    the communication process: active listening helps you learn what the other


    person’s needs are, and therefore makes you less cautious and more open


    with your responses.


    Perhaps above all else, active listening makes it 100 percent clear and


    certain that you *are* comprehending your conversation partner. They know


    that you’re right there with them.


    At the same time, we have to push our ego out of the way so we can truly


    access what the other person is saying. We call this process “active”


    listening because it engages so many parts of our mind and makes us *do*


    something to understand what’s being communicated.


    Therapists (good ones, at least, unlike the one mentioned earlier in this


    book) are excellent models of how to be an active listener. They listen to


    their clients with a clear purpose. If there’s something they’re hearing that


    they’re not 100 percent sure about, they encourage their clients to be clear


    and deliberate.


    These therapists try to restate their patients’ statements and ask them to


    elaborate on what they mean. Above all, they try to make their clients feel


    calm and safe about communicating through contemplation, clear body


    language, and a spirit of empathy. Therapists are driven by a very clear goal


    of hearing their clients out, and their every response is informed by this


    goal. Can we say the same about ourselves when we are trying to listen to


    others?


    Active listening involves a few essential types of reactions and inquiries


    that you can start using almost immediately. These are all designed to'
