  md: '**That’s Not What I Meant!**


     


    Communication is much more than the words that we speak or hear. Studies


    have quoted figures stating that 50% to 90% of communication—the


    message and emotion we get from others—is based on nonverbal or


    unspoken signals, starting from Mehrabian and Ferris in “Inference of


    Attitudes from Nonverbal Communications in Two Channels” in 1967. Add


    that to additional communication based on subtext, context, implication,


    and inference, and you’ll almost wonder what impact our actual words


    have.


     


    Whatever the case, what we think we are communicating is often


    overshadowed or outright contradicted by what is meant to be interpreted


    between the lines. What we say is not really what we mean most of the


    time, and this is something we begin to learn as children. It’s not that the


    words we use don’t matter—they do. But the way in which we use them,


    and the contexts we use them in, are far more indicative of our feelings and


    emotions.


     


    Unfortunately, for many of us, these small signs might as well be


    incantations for magic spells based on how subtle or convoluted they seem.


    One of the keys to communicating more clearly and being able to read


    between the lines of what people say is to understand *subtext*. To borrow


    from Chaney and Lyden’s 1997 publication “Subtextual Communication


    Impression Management: An Empirical Study,” in the context of an office


    environment, subtext is the following:


    Subtextual communication, a covert language that strengthens or


    negates the spoken text, is used to influence the impressions other


    people have of us and may be used to competitive advantage in


    numerous situations in the workplace. The subtext is more subtle than


    the obvious text and may be more honest in interactions between


    people (Fast, 1991).


    Subtextual communication elements are related to image and may


    convey positive or negative impressions related to assurance,


    credibility, competence, and savoir-faire through dress, manner of'
