  md: '**Empathetic Reflection**


     


    Empathy in dialogue comes from embodying the other person’s point of


    view—and showing it. Practicing empathy goes one step further than


    simply hearing and acknowledging what someone is saying—it’s actually


    processing what you’ve heard on a felt level. As you listen, engage.


    Continually ask yourself, internally, what is being said, and how, and why.


     


    What is going on in this person’s world? Who are they, what matters to


    them, and why are they telling you what they’re telling you? What are their


    values and how are they revealed in the way they’re communicating with


    you? What is it like to be them right now? In other words, ask yourself, in


    what ways does what I’m hearing *make total sense* for this person, from


    their perspective?


     


    If something appears to be unreasonable or illogical, it’s not because you


    are talking to an unreasonable or illogical person—you are just missing part


    of the equation in that person’s train of thought. We can always make a


    deliberate effort to validate what people say. When we validate, we tell


    someone that their experience has *intrinsic validity*. Not that we agree with


    them, or understand them, or share their beliefs or anything like that—only


    that we acknowledge they feel as they do, and they have a perfect right to.


    This comes more naturally to some than others, but you can practice by


    saying things like the following:


     


    “That makes sense.”


    “Hmm, can you say more about XYZ? What did you mean when


    you said ABC?”


    “It seems like such-and-so is the case. Have I understood you


    properly?”


    “Uh-huh. I get that.”


    “Go on.”


    “Do you think that (insert tentative interpretation)?”


    “I’m really curious about (something they’ve said earlier)…”


    “Oh wow. Well done!”'
