    in. They think of listening as dead space, as doing nothing. This is a


    disastrous mindset, because conversations only work when both people are


    actively, consciously involved. The mistake is to think that talking is


    somehow more interesting or more active than listening. Nothing could be


    further from the truth. And again, taking the spotlight is a completely


