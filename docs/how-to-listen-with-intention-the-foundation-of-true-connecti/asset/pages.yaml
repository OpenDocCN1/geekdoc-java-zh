  md: '**Validate**


     


    When we think about empathy, withholding judgment, and simply ceding


    the floor to others, once again, it’s not a completely passive activity.


    Just like active listening, this process of making people feel heard contains


    several different layers. **Validation** is the verbal affirmation and acceptance


    of the emotions and viewpoints of someone we’re communicating with.


    Validation is the message that someone’s experience and reality is valid,


    whatever it is. For our purposes, it’s truly an extension of deep listening and


    being mindful of both the conversation and the meta-conversation that is


    occurring in front of us.


    Normal listening takes care of the conscious conversation level, but


    validation satisfies an emotional need (the meta-conversation) that is


    presented any time anyone opens their mouth. Often, validation is the most


    fundamental reason why people seek conversation in the first place. Though


    it may seem otherwise, they are not looking for solutions, arguments or


    explanations. They just want someone to confirm for them that they are not


    bad or wrong or strange or alone for feeling as they do.


    At first glance, validation might seem like a fairly simple concept of


    nodding and saying yes when people want you to (not very distinguishable


    from active listening, even), but even though it sounds relatively


    uncomplicated, there are right and wrong ways to validate.


    Validation is one of the more powerful give-and-take practices of


    communication because it establishes respect between two people, whether


    they’re old friends or strangers. Shutting down someone’s feelings—even if


    they’re repellant to us—effectively closes those floodgates off and isolates


    *both* sides of the exchange, putting the relationship at risk.


    Genuine validation, on the other hand, helps everybody in the


    communication process score a win. The receiver gets a confirmation of


    their humanity, but the giver also enriches their own stature and enhances


    their sense of self-worth. Generosity, trust, and eagerness to confide


    emerge, and communication rarely goes wrong when all those elements are


    working.'
