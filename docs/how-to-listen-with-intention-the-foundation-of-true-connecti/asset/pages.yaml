  md: 'Through our behavior and choice of words, we transmit clues and


    desperately hope people pick up on them. Of course, this is the origin of


    passive-aggressive behavior—we don’t feel comfortable saying something


    directly, so our indirect measures become more and more aggressive and


    unpleasant. As a species, we are fairly avoidant and nonconfrontational. Not


    many people feel comfortable wearing their opinions and hearts on their


    sleeves, especially when they clash with those of other people. Directness is


    inherently tense, so it’s something we prefer to avoid.


     


    A helpful method to imagine how subtext works in social situations is to


    imagine how it factors into a novel or a screenplay. When you’re watching a


    movie or reading a book, you don’t usually get told what the characters


    understand, feel, or think, and despite that, you come away with a clear


    sense of meaning about the scenes and relationships. This is all because of


    subtext.


     


    In this context, it’s commonly referred to as what is *under the skin of the*


    *character*—what drives and motivates them, what they feel toward


    everyone else in the story, and what’s under the surface of all of their


    actions. Without giving characters clear motivations and having everyone in


    the movie operate only on a “what you see is what you get” level, you end


    up with a flat movie with no emotional impact.


     


    Even in movies, there can be ambiguity in the subtext—sometimes


    intentional and sometimes not. This is the part the audience must fill in,


    which is why two people can come out of a film and have radically different


    ideas about the meaning the director was trying to convey.


     


    Let’s take a look at an example scene in detail to illustrate this clearly.


    Always remember that we have to separate the covert and overt


    communication.


     


    Imagine a room where a man clasps a tiny baby-blue box in his hands. The


    table is decorated with roses and Champagne. A woman appears at the side


    of the frame and prepares to leave the room. She does not notice the man in


    the corner. He says, “Wait!”'
