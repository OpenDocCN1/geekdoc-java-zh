- img_proc: true
  md: 'focused careers may find themselves stuck in this approach to the detriment


    of their personal relationships.


     


    Action-oriented people might frequently say things like, “So what you have


    you done about it?” or “Have you tried such-and-such?” thinking that the


    only thing to consider in any discussion is the next course of action. Though


    they can see their approach as practical and geared toward problem-solving,


    others can see them as entirely missing the point. Action-oriented people


    talk only so they can facilitate what they see as most important: *doing* stuff.


     


    Finally, possibly “**time-oriented**” listeners put most of their attention on


    time and how it plays out in stories, requests or conversations. They are


    typically focused on schedules, and keeping conversations trimmed into


    neat time blocks they can manage predictably. In listening to others, they


    will constantly be seeking to “wrap up,” summarize, get to the point, or


    refer back to time in some way. For those in other groups, this can feel like


    a strange focus, resulting in both parties feeling annoyed and sidetracked.


     


    The key thing here is that none of these tendencies are fixed—we can all


    move from one style to another, but it may take some effort and practice,


    especially for those who are quite attached to their styles. If it looks like


    many of these styles could overlap, you’re right, and there are probably


    additional styles than the ones outlined here (what about that conversational


    narcissist we’ve already encountered, who may be more practical or more


    emotionally minded, but still has an overwhelming preference for one topic


    alone: themselves?)


     


    No style is better or worse than the other; rather, an effective communicator


    is someone who is aware of each approach as tools in an inventory that they


    can switch out as needed. More than that, we need to be able to recognize


    the conversational tools we see others using. Won’t we change our approach


    if we know we’re talking to a more heart-centered person versus a more


    head-centered one? The important thing is to maintain awareness of your


    own context, and the needs of both yourself and others, to pick an approach


    that has the best chance of success for everyone involved.'
