  md: '**The Correct Frame**


     


    Closely related to this discussion of listening styles and unique


    conversational perspectives is the idea of “frames.” In reading the previous


    few paragraphs you might have correctly noticed that the kinds of listening


    people use also has a lot to do with context. It matters who you’re speaking


    to, why, and what the preceding situation was. A conversational frame is


    bigger than the people inside the conversation. The frame is set by the


    broader context, the shared history, the assumptions and parameters drawn


    around the interaction, the unique relationship between the people speaking,


    and how their conversation fits into it all.


     


    What is someone looking for, what is your natural style, and how do you


    have to reframe things to communicate better? These are questions you


    should at least have a passing relationship with.


     


    Our earlier example between X and Y could be less about their individual


    personalities and listening styles and more to do with the fact that they were


    simply not sharing a conversational frame—one wanted sympathy while the


    other was trying to offer advice and practical suggestions. And we saw that


    this conversation isn’t “bad” in itself, but would make more sense in one


    context than another.


     


    In a way, *frame differences* can explain much of interpersonal conflict, and


    if you can become adept at noticing them, you may give yourself a


    powerful tool to resolving misunderstandings.


     


    So, what’s a frame? A frame is like a point of view, but instead of


    concerning one person, it’s more like a temporary platform that two or more


    people occupy when they share a conversation.


     


    Your frame may be about asserting a power dynamic, solving a problem,


    mutually validating one another, exchanging information, complaining,


    talking casually for its own sake, picking apart a misunderstanding, sharing


    guidance or wisdom, and so on. A frame is the background, the unspoken'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'goal of the conversation. A frame is like the stage on which the


    conversation is being acted out. Broadly speaking, why is anyone talking at


    all?


     


    Properly understanding how frames shape interpersonal interactions can


    give you a deeper insight into being a better listener and conversationalist.


     


    Though it’s possible to have conflict with a shared frame (for example, two


    people can share the frame of fighting or competing), matched or aligned


    frames usually lead to better understanding all round, while mismatched


    frames can cause complete communication breakdown.


     


    For example:


     


    a woman is trying to get help from a shop assistant, but the


    employee is more interested in flirting with her;


    someone phones a call center technical helpline not realizing that


    the person on the other end of the line is not there to share personal


    grievances about the company or product;


    a friend is relaxing on the weekend and wants to enjoy some


    pleasant, idle chitchat, but his friend wants to get embroiled in a


    deep, gut-wrenching philosophical conversation;


    someone offers up a playful joke but a person overhears and decides


    to “correct” them, completely missing the intention and tone in


    which the joke was made…


    someone vents about their supervisor at work and wants to let off


    steam, but the listener instantly draws up a to-do list to passive-


    aggressively make the supervisor’s life terrible.


     


    You get the idea.


     


    For many of us, playing with frames and understanding what each unique


    situation requires will lead to the following: embracing the fact that a


    solution is not being sought, and again, simple listening and imparting the


    feeling of being heard is the priority of the day.'
