  md: '**Unconscious Obstacles**


     


    If there’s so much value in being a good listener, why are so few people


    actually good at it? Instead of thinking in terms of skills or attributes you


    lack, think instead of the barriers that keep you from truly listening to


    another person. All the skills and techniques in the world won’t help if we


    still retain false beliefs, habits and blind spots that get in the way of real


    connection and empathy. It would be like owning a boat and being an


    expert seaman, but having a deathly fear of the water. Some things just


    overshadow others.


     


    If you’re reading this book, congratulations—you have already taken an


    active and conscious step toward becoming a better listener. Call it ego or


    call it a bad habit, but many people don’t like to think of themselves as poor


    conversationalists, or lacking in the listening department. This may be the


    biggest barrier of all—because it stops us from seeing all the other obstacles


    preventing us from being as attentive and empathetic as we could be. Let’s


    take a closer look at what some of these barriers might be.


     


    Think about the poor listeners you may have encountered in your own life.


    What made you feel they weren’t listening to you? Perhaps the biggest


    problem may be their ***inability to look outside of themselves and their own***


    ***needs***. This doesn’t mean that they have real or actual needs, it simply


    means that they are focused only on themselves and their reality.


     


    This is the person who starts every sentence with “I,” or who starts spouting


    opinions as though they’re a celebrity on a talk show, or who hogs the


    conversation only so they can tell you at length about what they’ve done,


    what they like and dislike, how they see things, what happened to them,


    blah blah blah…


     


    Good conversation is like a tennis match where the attention moves equally


    between the two parties, like a tennis ball. If someone is never able to truly


    put their attention on anything other than themselves, it’s like playing tennis


    with a person who never properly serves the ball, or never returns it once it'
