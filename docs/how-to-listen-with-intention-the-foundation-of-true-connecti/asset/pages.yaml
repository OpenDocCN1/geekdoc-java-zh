  md: 'When people are grieving, they sometimes say how they’re doubly


    saddened by people’s awkward and avoidant responses to their grief. What


    they really want in the moment is to have their reality mirrored to them


    honestly and fearlessly. They want someone to say, “That hurts. I can see it


    hurts” and simply be with them, letting them know they are not alone.


     


    A good habit to get into is to avoid passing what people say through your


    own judgment filter, where you quietly decide what *you* think about the


    matter. You may decide someone is over or underreacting, or reacting in a


    way you wouldn’t. You may start thinking about who the good guys and the


    bad guys are in the story, or quietly question the veracity of the version of


    events you’re getting.


     


    You may put on a scientist or investigator hat and try to solve the mystery,


    identify the villain or decide who’s wrong and why, or what facts are


    missing. Or you may play nurse or mother and decide that the bad feelings


    are unacceptable and that it’s your job to heal this person, cheer them up, or


    scold them for making you unhappy…


     


    But all of this is irrelevant—because it’s about *you* and not about *them*.


    Your take on the matter doesn’t matter right now. Suspend all your


    preconceptions and ideas and beliefs and immerse yourself in their world.


    How does it actually feel to be them right now? Don’t merely picture


    yourself as you are in their situation—picture this person in their situation.


     


    Another good idea is to give plenty of time for the person to speak and


    express, without hurrying the conversation along to a conclusion or


    summary. Even done subtly, this can feel like the listener wants to be done


    with the conversation quickly, and can really invalidate one’s feelings.


    When someone shares their feelings with you and you respond with a


    simplistic summary, you’re telling them that you’re not available to listen


    further, and that what you really want is for them to stop feeling how they


    feel and get on with it.


     


    Don’t run ahead in the conversation or try to insert an interpretation,


    conclusion or solution before the speaker actually arrives there on their own'
