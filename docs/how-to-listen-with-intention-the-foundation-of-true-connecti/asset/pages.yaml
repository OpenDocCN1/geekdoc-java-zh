  md: '**Emotional Genius**


     


    The best modern conception of emotional intelligence comes from


    psychologist Daniel Goleman.


     


    Emotional intelligence is knowing and perceiving the emotions *you* feel and


    why you feel them, then transferring that type of awareness onto others.


    You are able to put a label on your emotional state and find its cause and


    effect. By extension, emotional intelligence is being able to read other


    people’s emotions accurately and deduce the reasons for them.


     


