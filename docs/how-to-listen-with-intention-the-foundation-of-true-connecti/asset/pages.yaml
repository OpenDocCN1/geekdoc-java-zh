  md: ' 


    This is a book about a skill that may be *simple*, but is certainly not *easy*.


    Listening is at the heart of proper communication, which itself is at the


    heart of every meaningful connection you can have with another human


    being. In other words, learning to listen matters! If even trained therapists


    (whose true focus should be to listen and absorb and then provide feedback)


    can’t always hit the mark, then what chance do we stand? Well, as always,


    learning and gaining the necessary skills is the first step, and that’s what


    this book provides.


     


    Not being a deep listener doesn’t mean you’re a bad person. Gaining self-


    awareness and understanding the “meta conversation” are skills like any


    other—meaning they can be learnt and improved upon, whoever you are.


    Sadly, we live in a world where listening skill are never taught directly, and


    if people strive to be better communicators, they often mistakenly think


    they need to become more convincing debaters or better at arguing.


    In fact, lacking listening skills means you’re quite normal, as the instinct we


    are all born with is to be somewhat self-centered. And yet, some of us are


    naturally good listeners, but most people need a little deliberate effort to get


    there. Some of us are only good *at* listening, and are terrible at telling


    stories to others or even expressing emotions. However, unlike the way


    some of us are born taller, shorter, or with black or brown hair, listening is
    a


    quality that you have complete control over—starting now.


     


    Being a good listener is not some grand charitable gesture, or a thing you do


    purely for the sake of other people. When we actually engage with attention


    and thoughtfulness with another person’s world, *everyone* benefits, and we


    only enrich our own perspective. It’s the quintessential win-win—even


    more than you might imagine. At least, that’s the first important mindset


    shift you must make to be a better listener.'
