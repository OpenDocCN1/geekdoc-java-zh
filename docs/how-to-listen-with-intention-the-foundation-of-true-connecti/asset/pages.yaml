  md: 'A mismatched frame is a difference in conversational goals—and this


    difference means that neither party actually gets their needs or goals met.


    It’s possible that *one* party is satisfied, but typically only a matched frame


    gets both people what they want quickly.


     


    If there’s a mismatch, the most important first step is to notice it. You’ll


    know something is off if a conversation feels awkward, stilted or frustrating


    —or if you can sense the other person is feeling these things (this is where


    heart focus comes in handy!). Mismatched frame conversations can often


    feel like they’re going round in circles, or getting more confusing rather


    than less so, or are simply boring.


     


    Next, try to see if you can loosely identify your own and the other person’s


    conversational goals. What do you both want out of the conversation?


    Mismatch ends when you both get on the same page—they adopt your


    frame, you adopt theirs, or you both adopt a new shared one. It’s also


    possible to agree to work within different frames, as long as you


    acknowledge shared goals. It can help to refer to an external authority or


    yardstick to guide your interactions (“you say X and I say Y, but let’s just


    consult the handbook and agree to do what it says”).


     


    What do you do, though, if the other person’s conversational goal is “to


    hold these people as a hostage audience while I regale them with tales about


    how utterly awesome I am,” and your goal is just to have a nice time at your


    friend’s party? Conversational narcissists, bullies, angry people or those


    with an axe to grind or a niggle they want to complain about may not *want*


    to change frames—and when dealing with them, you might not want to


    either.


     


    Here, it’s wise to acknowledge that not all conversations are viable, and


    sometimes the best course for an interaction to take is for it to terminate, or


    at best be postponed. Call out a bad frame if you see it and think it will


    help, but if someone is hell-bent on engaging you from a destructive or


    nonsensical perspective, you can always choose to opt out. But, with more


    conscious awareness, you can see this as it happens and empower yourself


    to work around it.'
