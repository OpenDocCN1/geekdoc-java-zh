    pick up on the meaning behind them.


     


    Don’t be like Paul. Learn subtext to read people better and begin to truly


    respond to what people are trying to communicate.


     


    Communication can be divided into two categories: overt and covert. Overt


    is the words we say and the explicit messages we want to convey. This is


    when we directly tell someone that we’re hungry and ask for a hamburger.


     


    Subtext is the covert type of communication. It’s almost never directly said,


    relies on literally anything besides the direct message coming out of


    someone’s mouth, and requires correct interpretation. Using subtext to say


    “I’m hungry” would include rubbing your stomach, licking your lips,


    pointing out that there is a menu on a nearby table, and mentioning that


    your previous meal was tiny.


     


    Not everyone is going to pick up on those signs, but it is undeniable what


    the person wanted to convey. We routinely communicate through these


    indirect means and hope that it saves us the trouble of being direct.


    Subsequently, understanding the subtext under and surrounding people’s


    seemingly benign statements gives you insight into their true feelings and


    thoughts.'
