  md: '**Five Levels of Listening**


    As we continue our journey through different types of styles and frames, we


    end this chapter with a section on different levels of listening, and what is


    generally more effective for becoming a deep listener. *Unlike* previously,


    there is no particular use for some of these levels of listening, and they just


    demonstrate a shifting amount of focus and attentional generosity.


    There are five different levels of listening that we experience, from total


    ignorance to almost consuming attention. Most of our lives we sort of float


    through the first four levels, which all reflect at least a measure of self-


    interest. In other words, in those four levels we still use our own reference


    points to interpret what the other person is saying (if we’re listening at all).


    Many of us can hope to get to level four at best, and even that stage we can


    turn out to be a bit deceptive in our deepest intentions.


    In all truth, some of us never quite reach the deepest level five, even though


    it’s the most important stage and the one we should shoot for. It involves


    total focus and absorption in what our partner is saying. Getting there is


    exceptionally rare and hard to maintain. But in order to drive


    communication in a relationship forward, it’s vital that we *try* to achieve


    that deepest level.


    Here, then, are the levels we’re talking about:


    Ignoring


    Pretend listening


    Selective listening


    Attentive listening


    Empathetic listening


    **1\. Ignoring**


    I’m betting this level is obvious: it’s not listening at all—an ostrich with its


    head in the sand. Whether you’re distracted, consumed with something else,


    or flat-out don’t care, ignoring is an immediate discouragement to anyone'
