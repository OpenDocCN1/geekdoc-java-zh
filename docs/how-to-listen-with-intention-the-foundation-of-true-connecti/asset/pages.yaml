  md: ' 


    For example, how does the overt dialogue below differ from the subtextual,


    covert message? Here, it’s what is *not said* that completes the message. The


    subtext is that the question wasn’t replied to in a convincing manner and,


    thus, is less than sincere. Suppose the answerer of the question has a history


    of being blunt.


    *“Am I fat?”*


    *“No, you’re not fat.”*


    Translation: Yes, you might be a little bit fat.


     


    *“Am I fat?”*


    *“No, but I suppose you could maybe lose a couple of pounds.”*


    Translation: Yeah, you’re definitely fat now.


     


    Subtext can be delivered through vocal tone, phrasing, delivery, reference to


    prior experiences, knowledge of relationships, body language, gesticulation,


    circumstances, and even moods. It sounds abstract and confusing, but just


    imagine that subtext is everything we want to say besides the *exact words*


    we use.


     


    In fact, that’s one of the big reasons we use it. It allows us to navigate the


    world through indirect and nonconfrontational means. If you’re great at


    subtext, it saves time, it’s efficient, and it imparts great emotional


    intelligence by understanding people’s ever-shifting circumstances.


     


    Subtext appears in every situation, from work and dating to social situations


    and family dynamics. In fact, much of dating can be said to be subtext


    because much of sexual tension depends on not revealing true intentions up


    front. If you ask someone to dinner and they tell you they are busy, they


    might be busy, or they might not be interested. If you ask the same person


    out four times and each time they say they’re busy, then there is additional


    subtext for you to read. Take the context into account and things aren’t


    looking good for you on the romantic front.'
