  md: ' 


    Learning mastery in working with frames will not only help you navigate


    social situations in real time, but will offer you a broader overall picture of


    your communication style in general. What frame do you usually adopt and


    why? Is it working for your general goals in life? If you fail to properly


    communicate at times, why is that and what can you do next time to be


