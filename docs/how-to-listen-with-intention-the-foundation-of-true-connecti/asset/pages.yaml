    The general goal of active listening is to fully grasp the viewpoint or life


    experience of the person who’s speaking to you, and for you to absorb that


    information in a meaningful way that could spur you to new knowledge and


    understanding. You want to show the other person that you can step inside


    their world and see their experience from their point of view. To accomplish


    the goals of comprehending, retaining, and responding, you can employ a


