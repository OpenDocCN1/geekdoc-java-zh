  md: '**But They’re Boring…**


     


    No, you are.


     


    You may have read through the previous sections and wondered how


    realistic it is to be completely enthralled with what another person is saying.


    It can certainly make people feel good to be the center of your attention, but


    what if you literally don’t feel it?


     


    It’s not a great thing to admit, but many of us secretly think that other


    people simply aren’t that interesting, and it’s hard to care about what they


    have to say. After all, what could be more interesting than all the things


    going on in our own lives, from our own perspective? It’s tempting to look


    at the work it takes to listen to someone’s seemingly mundane story and


    decide you’d rather not bother.


     


    We can sometimes miss the point. Sometimes, it’s a question of unrealistic


    expectations. A conversation doesn’t necessarily have to blow your socks


    off or be massively useful to you to be worth taking part in. And of course


