- img_proc: true
  md: 'One method the researchers used to determine how much the participants


    valued being able to talk about themselves was to offer a modest financial


    incentive to anybody who would answer questions about *other* people


    instead. Some of the questions involved casual subjects such as hobbies and


    personal tastes while others covered personality traits, such as intelligence,


    curiosity, or aggression.


     


    The researchers found that many of the participants were willing to pass up


    on the money, preferring the rewarding feelings of self-disclosure over


    financial gain. In fact, the average participant gave up between 17 and 25


    percent of their possible earnings just so that they could reveal personal


    information.


     


    Researchers then used a functional magnetic resonance imaging scanner


    (fMRI) to observe what parts of the brain were most excited when the


    subjects were talking about themselves. Again, they found a correlation


    between self-disclosure and heightened activity in brain regions belonging


    to the mesolimbic dopamine system—the same region that’s associated with


    the satisfying feeling we get from food, money, and sex. This increased


    brain activity even happens when we speak about ourselves *without* anyone


    listening to us. Of course, there is a far more powerful effect when our


    listening skills come into play.


     


    What do these studies tell us? Well, firstly that you are not a selfish or vain


    person if you tend toward talking about yourself rather than listening to


    others. But it also suggests that we have at our fingertips a rock-solid


    method for helping *other people* feel that same sense of reward and


    satisfaction.'
