  md: 'goes over the net. A conversation suddenly turns into a monologue,


    soliloquy, or simply a lecture to an unwilling student.


     


    So-called “conversational narcissism” may look on its surface like a regular


    conversation, but on closer inspection it actually resembles two people


    spouting monologues in close proximity to one another! In a way, good


    conversation is a dying art precisely because people feel more isolated than


    ever before. Add to this growing phenomenon the fact that people are


    increasingly inhabiting “filter bubbles” of their own making, so that they


    only ever have to encounter opinions they already agree with and content


    from people who are just like them, and you have a recipe for


    conversational disaster.


     


    So, why is balanced conversation such a lost art? With so many people


    missing the feeling of being truly heard themselves, they crave attention


    and to be in the spotlight, having others listen closely to them. The sad


    irony is that such a person can bring a selfish, even competitive attitude to


    an activity that is supposed to be mutually beneficial. As they speak, they


    alienate the other person, who decides to stop listening and instead starts


    thinking about how they are going to get a word in and steal back a little of


    the spotlight for themselves.


     


    And thus the cycle continues and grows even worse over time, spurred on


    by feelings of not being heard or paid attention to. Using a conversation as a


    platform to win attention and stroke your ego is undoubtedly a losing


    strategy. The truth is that the more you misuse conversation to this end, the


    fewer opportunities you’ll actually have to converse with others, who will


    probably get tired of being a forced audience.


     


    Have you ever quietly waited for someone to stop speaking, thinking all the


    while about what you would say the moment they shut up? If so, you’ve


    likely been guilty of conversational narcissism too! It is still the inability
    to


    put aside your own internal monologue completely, and focus on what the


    other person is thinking or saying. It leads to the same outcome of dueling


    monologues, where conversation hasn’t really happened at all—rather, you


    have two people talking *at* each other instead of *with* each other.'
