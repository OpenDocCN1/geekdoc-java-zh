- img_proc: true
  md: 'These different listening styles can be framed a slightly different way


    according to the theories of educational psychologist Benjamin Bloom,


    although versions of this theory are perhaps thousands of years old. People


    can be understood as having a general preference for **feeling** (the heart,


    emotional), **thinking** (the head, cognitive), or **doing** (the hands,


    behavioral).


     


    Those with a preference for approaching life with their heads (thinking) are


    like the “content-oriented” people above, and will likely frame problems as


    a matter of lack of knowledge or insufficient understanding. When you talk


    to such a person, it’s helpful to acknowledge that they learn new things and


    engage with their world via rational, structured, cognitive means.


     


    This could result in the preference for more goal-oriented “informational


    listening”—active listening for facts, details, arguments or data in much the


    same way as a student might listen intently to a lecture. While this is great


    for corporate environments or in universities, it’s less ideal in romantic


    relationships, as our previous example with X and Y shows.


     


    Similarly, this orientation may favor a more critical kind of listening,


    wherein information is analyzed and appraised for its veracity, coherence


    and value. Importantly, this is still rather content-focused, especially if such


    a listener has neglected to consider the emotions and desires of the speaker


    as relevant data. Such people may look down on action-oriented speakers


    and find them unintelligent, or secretly prefer clean and abstract theory to


    the messy real world. They may similarly fear emotions and have a strong


    need to control others’ feelings when they encounter them.


     


    An example is a doctor who listens intently to a patient’s story but only


    filters out the medical facts in order to make a diagnosis, while ignoring


    emotional content. A lawyer may listen to a client or colleague speaking


    about a case and actively try to hear out missing information, flaws in an


    argument, opportunities, and weaknesses. The goal is to listen for some


    very specific purpose—to gather as much good-quality data as possible in


    order to do the job properly.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '“Hands” people act first and think later, or, more accurately, they seem to


    think *by* doing. To them, direct, real-world experience is the gold standard,


    and they engage with the world via their psychomotor skills, and working


    through the hands. Sensible and practical, they may have a reciprocal


    disdain for overly cognitive thinker types, believing these people waste time


    and lack real-world understanding of problems. Similarly, they may get


    irritated with “soft,” heart-centered or emotion and relationship-focused


    people, feeling that they lack will or a backbone.


     


    An example is a manager at work who is listening to an employee’s account


    of a problem in the office. Even though the employee may be relaying


    plenty of neutral information, along with some emotional details (“everyone


    in sales is sweating bullets now…”), the manager might only listen for what


    he feels is crucial information: what has the employee actually done so far,


    and did it work? He might not care much for theories, rumination, worry or


    analysis. For him, not much matters until it’s been put into action.


     


    “Heart” people prioritize emotional, relational and holistic content first, and


    engage with the world through their own felt direct experience, as well as


    striving for harmony and connectedness. What matters to heart people are


    motivations, values, appreciation, feelings and relationships. They may


    practice appreciative or empathetic listening—wherein the goal is merely to


    show support or sympathy, and encourage the speaker. Often, this is the true


    reaction we want in others, and it’s the type of interaction that fosters


    deeper relationships and open dialogue. It’s a large part of the type of


    listening we want to train in this book, though the others are of course not


    without their purposes and benefits.


     


    An example of a heart approach is someone who is able to hear a friend talk


    and simply listen attentively, perhaps occasionally asking a question or


    offering a supportive sound or phrase. The stereotypical “how does that


    make you feel?” is broadly considered poor practice, but all good


    psychologists, counselors, carers, and so on are in effect adopting this


    position in their conversation—they want to know what the other person is


    feeling, and the details are somewhat secondary.'
