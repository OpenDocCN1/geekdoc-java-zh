  md: 'A more conscious obstacle many people face is the feeling that the


    people they interact with are quite boring and have nothing


    worthwhile to say; thus, listening to them is not a good use of their


    time. Just reading that sentence, you should be able to spot a few


    flaws. If you think most people you run across are boring, you’re


    the boring one. You’re letting a prejudgment dictate your actions,


    and ruin your interactions. Instead, expect that you will find


    something fascinating and delightful, and that’s just what will begin


    to happen.


    For a role model on how to draw information out of people, look no


    further than late-night talk-show hosts. Their sole job is to make a


    celebrity, often no funnier than you or I, appear immensely


    charming and intelligent. That’s a tough task sometimes. Think


    about the energy, focus, attention, and listening they employ to


    make this happen. That’s what is possible.


     


    **Chapter 2. Styles, Frames, and Levels**


     


    Let’s suppose you’re trying to learn how to play the guitar. You’re


    right-handed, but you’ve accidentally gone and bought a guitar for


    left-handers. This is not a recipe for success. That’s how we can


    think about the different types of listening styles that exist. We must


    match our style with that of other people if we are to have any hope


    for success.


    Though it can be said there are countless listening styles, it’s helpful


    to think in terms of four main styles: people (emotion), content


    (information), action (to-do list), and time (duration and frequency)


    orientations. For our purposes, we want to recognize which is our


    natural tendency, and then try to skew more toward the


    people/emotion style. This is because when people communicate


    outside of giving an order or organizing an outing, they are doing so


    to express an emotion. Go find it! Another way to delineate


    listening styles is to think in terms of head, heart, and hands. Head


    is all about thinking and planning, hands is all about doing and


    action, and the heart, well, that’s all about emotion and people’s'
