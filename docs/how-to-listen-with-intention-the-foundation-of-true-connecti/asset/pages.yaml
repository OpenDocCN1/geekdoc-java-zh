  md: '**The True Win-Win**


     


    A large piece of the puzzle in creating a presence optimized for listening is


    the age-old piece of advice, popularized by Dale Carnegie and his famous


    book *How to Win Friends and Influence People*.


     


    Much of his advice is now derided as common sense, even though the very


    reason it’s deemed so obvious is because of *his* book. Perhaps one of his


    best pieces of advice was simply to get people to talk, or even brag, about


    themselves. He was quoted, “You can make more friends in two months by


    becoming interested in other people than you can in two years by trying to


    get other people interested in you.”


     


    It might go against everything we’ve been taught or instinctively feel. Isn’t


    our prime focus in any conversation on what *we* are saying and how *we* feel


    and whether other people are listening to and understanding *us*? We have an


    enormous bias for assuming the solution to better socializing must have


    something to do with what we say or how we say it. And all that listening


    stuff? Well, many of us think that listening is not much more than a


    convenient break to think about what you’re going to say next.


     


    But listening has always been more powerful. It turns out that Carnegie was


    correct, right down to the biological level. A 2012 study conducted by


    neuroscientists Diana Tamir and Jason Mitchell at Harvard University


    entitled “Disclosing Information About the Self Is Intrinsically Rewarding”


    found that our urge to share personal information with others is one of the


    most fundamental and powerful parts of being human.


     


    Brain images showed that sharing information about ourselves triggers the


    same sensations in our brains that we experience when we eat food and


    have sex—two behaviors that we are biologically compelled to do. Thus, it


    seems we are biologically compelled to share and communicate our


    thoughts.'
  merge: -1
