  md: ' 


    So to start with, improve your listening skills by being vigilant about the


    ways in which craving attention can make you a worse conversationalist.


    This takes some conscious awareness and also a little honesty. We can ask


    what our true intentions and motivations are for entering into conversations,


    in general and specifically with people we know. Are we reaching out to


    others because we want the validation of their attention? Because we want


    the feeling of proving ourselves right and another wrong?


     


    Do we see conversation as a battle, or a game, or a dance? Perhaps we see


    conversation as an opportunity to show ourselves off, or share what


    interests us. Whatever your reasons are, though, you probably notice that


    they usually concern only *you*… and don’t spare a thought for the other


    person sharing the conversation with you! How many of us can honestly


    say that our goal is to see and understand the other person, rather than just


    to have ourselves seen and understood?


     


    The idea is not to always seek to turn attention to yourself. Conversations


    should be thought of not as a means to win attention, but to *share* it


    enjoyably with someone else. The goal is not competition for the floor, but


    cooperation with an ally. The purpose is to collaborate, not express solely.


    The aim is to learn, not teach, and so on. For some of us, this may require a


    complete re-tooling of what we seek when we want to be social.


     


    After an ineffective conversation, people may feel depleted, bored, or even


    more alone. Good conversations, on the other hand, can be things of beauty,


    allowing both participants to create between them something bigger than


    the sum of its parts. And remember how much people were willing to pay to


    be heard and express themselves in the study referenced earlier in this very


    chapter? That’s because that feeling of being acknowledged, heard and


    respected is incredibly valuable. Hopefully, as you continue reading this


    book, you’ll decide that offering that feeling to someone else is just as


    rewarding.


     


    Listening well requires that you suspend your own self-interest and ego and


    gracefully allow someone else to shine.'
