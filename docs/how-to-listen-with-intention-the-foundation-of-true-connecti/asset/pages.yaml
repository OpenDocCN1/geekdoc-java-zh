  md: '**Chapter 1. One Mouth but Two Ears**


     


     


     


    ![](img/45836b3e8bea0ff9cf889d1699375515_6_0.png)


     


     


     


     


    Picture someone visiting a new therapist or counselor, and the dialogue they


    have in their first session. The client is, quite naturally, feeling a little


    nervous and exposed, and is trying to find their feet—this is the first time


    they’ve done anything like this, and they’re not quite sure about how it all


    works. Are they going to lie down on a couch and be asked about their


    attraction to their mother or father? Will they uncover something traumatic


    from their past that they have blocked out?


     


    They come into the room and the therapist invites them to sit. The client sits


    and eventually the therapist invites them to talk, saying, “So, what’s


    brought you here today?”


     


    “Well, it’s hard to say, actually,” says the client, who starts describing how


    they want to use therapy as a place to learn to be better, and not necessarily


    to fix anything that’s wrong.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '“So, it seems like you’re not quite sure about what you want here,” says the


    therapist.


     


    The client starts to wonder if they’re wasting this professional’s time.


     


    “No, not exactly. It’s just…I’m sorry, I don’t know how this goes. I suppose


    you see a lot of people every day with *real* problems…”


     


    “You don’t think your problems are real, then?”


     


    “Um. Hmm. That’s not what I meant. It’s not that I have…problems, it’s


    more like, I just want to be the best version of myself, you know?”


     


    “It’s OK. There’s nothing to be ashamed about. Seeking help for your


    problems doesn’t mean you’re weak, you know.”


     


    The rest of the session carries on but the client has already decided, in this


    first two minutes, never to return to therapy again. Why? For those who are


    skilled listeners, the reason is probably obvious: the therapist did a *really*


    bad job of listening. Did you catch it? Let’s review.


     


    Firstly, the therapist *tells* the client what they feel, without checking


    whether their interpretation is correct, or even wanted. It’s a series of


    statements and assumptions rather than acceptance. The therapist had their


    own version of events and conclusions likely before the patient even sat


    down.


     


    How frustrating. Rather than figuring out what exactly the client is


    experiencing, the therapist has some preconceived mold they’re forcing


    onto the conversation, completely ignoring what the client actually wants


    from them.


     


    Sadly, this state of miscommunication and poor listening is more common


    than it first seems, and many people—perhaps like our therapist—will


    never even know the extent to which their listening techniques are just not


    working for them and those they’re speaking with.'
