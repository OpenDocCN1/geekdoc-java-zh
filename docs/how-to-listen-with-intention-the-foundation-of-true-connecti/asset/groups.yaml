    - *Probing.* Without sounding like an invasive interrogator, try to ask leading
    questions that will elicit a deeper level of understanding and meaning from the
    person you’re speaking with. Most people enjoy being asked questions that are
    well-formed and not too presumptuous. When you probe, you can try to make guesses
    at how people feel, their reactions and desires. This type of forecasting shows
    that you are so engaged you want to jump to conclusions with them, and keep riding
    their train of thought. You’re not only there with them, you’re caught up in their
    emotions.


    - *You:* What did it feel like when that woman berated your kid at the supermarket?
    How did you *really* want to respond?


    - *Silence.* Frequently there’s more to be said by a well-placed silence than
    by filling up the space with additional verbiage. Silence can give every participant
    a miniature moment of time to gather themselves and their thoughts. It could also
    help reduce the tension that could arise from a heated or fruitless interaction.


    - *Them:* And *that’s* when I decided skydiving wasn’t my thing, especially when
    it’s work-related.


    - *You:*


    - *Not sermonizing, giving unsolicited advice, or glibly reassuring.* Nobody likes
    to be put on a level secondary to someone else, and in communication, this might
    make the speaker feel like shutting down further discussion.


    - *Them:* And worst of all, he cannot remember to put the toilet seat down.


    - *Sermonizing you:* You should never have let him in your bathroom in the first
    place.


    - *Unsolicited advising you:* You should barricade the bathroom until he agrees
    to your demands.


    - *Glibly reassuring you:* Don’t worry about it! Tomorrow’s another lovely day
    full of wonderful possibilities.


    - *Asking leading and open-ended questions.* To show that you’re invested in your
    partner’s well-being, ask some non-binary questions about their experience. These
    questions show that you’re ready to get input and that you’re interested in more
    than just the data or facts of a certain situation.


    - *Them:* So I decided, a couple hundred dollars later, perhaps parallel parking
    was something we were going to have to work a little harder on.


    - *You:* How does that make you feel? What are your plans for learning? Where
    do you plan on doing it? What do you hope comes out of it?


    Active listening takes a lot of patient work and practice and can even be challenging
    for people who are good at it. But it pays off in creating an atmosphere of true
    comprehension, easier information flow, and increased respect for all parties.
    What we are trying to do, albeit systematically, with active listening is to catch
    the habit of being conscious of other people’s emotions and suppressing our own.
    The ultimate form of this comes in empathetic reflection.


    ## Empathetic Reflection


    Empathy in dialogue comes from embodying the other person’s point of view—and
    showing it. Practicing empathy goes one step further than simply hearing and acknowledging
    what someone is saying—it’s actually processing what you’ve heard on a felt level.
