    ## Five Levels of Listening


    As we continue our journey through different types of styles and frames, we end
    this chapter with a section on different levels of listening, and what is generally
    more effective for becoming a deep listener. *Unlike* previously, there is no
    particular use for some of these levels of listening, and they just demonstrate
    a shifting amount of focus and attentional generosity.


    There are five different levels of listening that we experience, from total ignorance
    to almost consuming attention. Most of our lives we sort of float through the
    first four levels, which all reflect at least a measure of self-interest. In other
    words, in those four levels we still use our own reference points to interpret
    what the other person is saying (if we’re listening at all). Many of us can hope
    to get to level four at best, and even that stage we can turn out to be a bit
    deceptive in our deepest intentions.


    In all truth, some of us never quite reach the deepest level five, even though
    it’s the most important stage and the one we should shoot for. It involves total
    focus and absorption in what our partner is saying. Getting there is exceptionally
    rare and hard to maintain. But in order to drive communication in a relationship
    forward, it’s vital that we *try* to achieve that deepest level.


    Here, then, are the levels we’re talking about:


    - Ignoring

    - Pretend listening

    - Selective listening

    - Attentive listening

    - Empathetic listening


    ### 1. Ignoring


    I’m betting this level is obvious: it’s not listening at all—an ostrich with its
    head in the sand. Whether you’re distracted, consumed with something else, or
    flat-out don’t care, ignoring is an immediate discouragement to anyone who’s trying
    to speak to you. It’s like being served a tennis ball over the net and letting
    it to roll away without even looking at it.


    *Person A:* I’m worried about our son. He’s spending an awful lot of time online
    and doesn’t interact with anyone in the real world anymore.

    *Person B:*

    *Person A:* It’s like he’s got no interest in forming real relationships with
    anybody. It’s got me quite concerned.

    *Person B:*

    *Person A:* Hello?

    *Person B:*

    *Person A:* Also, he just drove our minivan into the river and is sacrificing
    animals to the Dark Lord in our living room.

    *Person B:*

    *Person A:* Are you hearing a word I’m saying?

    *Person B:* Hey, look at that squirrel!


    Ignoring can be intentional (and flat out rude, as above) or it can be careless
    and distracted, but it all has the same effect: the other person feels completely
    deflated and unheard. There’s not much to be said about this level. It’s bad communication
    at its worst. Person B is utterly uninterested in Person A’s point of view and
    makes no effort to say anything until something catches their personal interest.
    This first level of communication is important to get out of ASAP. (But keep in
    mind, someone not being *able* to hear you is not ignoring, so speak up if you
    can.)


    ### 2. Pretend Listening


    This happens most prevalently in face-to-face communication. We *look* like we’re
    paying attention, but we’re not entirely engaged with what our partner is saying.
    Our eyes might get that distant look, and we just don’t appear to be “all there.”
    We make the slightest cues imaginable just to appear that we’re taking everything
    in. But in reality, we’re kind of phoning it in, like a bored hall monitor. We
    know we probably should care, so we make a show of it. This isn’t even about different
    listening styles or frames, unless your frame for the conversation is to placate
    someone and be a fake friend.


    *Person A:* I had a talk with my sister the other day. Her husband’s been staying
    long hours at the office. I think she suspects something.

    *Person B:* Mm-hmm.

    *Person A:* I mean, I know she can get a little overly dramatic and unduly suspicious.
    But he can’t have that much work to do. Not so much that he misses four dinners
    a week.

    *Person B:* Yes.

    *Person A:* I kind of think she might have cause for concern. Don’t you?

    *Person B:* Yeah. Wait, what?

    *Person A:* Have you really heard anything I’m saying?

    *Person B:* Uh… hey, look. That squirrel’s back again.


    The level two listener is making only a superficial effort to convince their partner
    that they’re involved in the conversation so not to appear rude. But of course,
    they’re still preoccupied with their own thoughts and concerns. It may fool the
    other person for a time, but it can be hard to recover once your partner notices
    your genuine lack of interest. They stay at the minimum baseline, and it can be
    frustrating to anyone trying to impart a real thought or concern. It’s progress,
    but not.


    ### 3. Selective Listening


    At this level we start to give our partner real attention—to a point. As long
    as the speaker is saying something we agree or sympathize with, we’re with them.
    But if they switch direction and put forth an idea that doesn’t vibe with us,
    we go back to pretend listening or ignoring them (conversational narcissists,
    is that you?). It can be a reaction to a sentiment we have resistance toward,
    a story we don’t care about, or a statement we disagree with. We initially sound
    like we’re involved and concerned, but at a breakpoint we retreat under our shell
    of self-absorption. This is more attention than the previous levels, but it’s
    *conditional* listening.


    ### 4. Attentive Listening


    This, in all honesty, is good. Not perfect but good. We’re giving our partner
    our complete attention and listening to every detail they provide. We’re not...

