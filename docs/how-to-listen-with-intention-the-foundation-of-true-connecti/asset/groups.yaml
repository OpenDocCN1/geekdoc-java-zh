    completely different level than people-oriented conversationalists, and have completely
    different goals when speaking and also when listening.


    Such a listening style is more hands-off, neutral and impersonal, but probes for
    details, looking for patterns or cause and effect, trying to unpack the logical
    argument in a story rather than the human content. Understandably, an approach
    like this can be disastrous if used excessively in more intimate contexts, and
    is more suited for business or formal relationships.


    As you might have guessed, Y in our example was listening to X’s story, but “hearing”
    only the literal facts. Instead of understanding what was needed or the spirit
    in which the conversation was instigated, Y instead tried to ascertain whether
    what X said was true (“But didn’t you say…”) or suggest solutions to a problem
    that X wasn’t really presenting as the conflict (“You should ask for a pay raise”).
    You can see why these two had an argument!


    Though there is no bad intent, the conversation ends poorly primarily because
    Y fails to see that their listening style isn’t appropriate to the situation,
    and responds on the wrong level. The reverse could also be true: if X and Z from
    work were to discuss the issue, they would both fare better by adopting a more
    content-focused approach.


    This is worth repeating: the problem here wasn’t that either party was “wrong”
    or behaving badly, or even that there was a problem in the message itself. Rather,
    we can see with conversations that individual difference, context and intention
    make all the difference.


    There are two other styles in Barker’s theory, however, and some natural overlap
    between each. “**Action-oriented**” listeners are curious about what needs to
    be done or has been done already, who does it, and what actions are underway.
    For them, things need to be clear, obvious and translatable to the real world.
    When mismatched in style, these listeners can appear impatient, controlling or
    dismissive of others, responding to thoughts or emotions with a sort of “so what?”
    attitude. Leaders and those in action-focused careers may find themselves stuck
    in this approach to the detriment of their personal relationships.


    Action-oriented people might frequently say things like, “So what you have done
    about it?” or “Have you tried such-and-such?” thinking that the only thing to
    consider in any discussion is the next course of action. Though they can see their
    approach as practical and geared toward problem-solving, others can see them as
    entirely missing the point. Action-oriented people talk only so they can facilitate
    what they see as most important: *doing* stuff.


    Finally, possibly “**time-oriented**” listeners put most of their attention on
    time and how it plays out in stories, requests or conversations. They are typically
    focused on schedules, and keeping conversations trimmed into neat time blocks
    they can manage predictably. In listening to others, they will constantly be seeking
    to “wrap up,” summarize, get to the point, or refer back to time in some way.
    For those in other groups, this can feel like a strange focus, resulting in both
    parties feeling annoyed and sidetracked.


    The key thing here is that none of these tendencies are fixed—we can all move
    from one style to another, but it may take some effort and practice, especially
    for those who are quite attached to their styles. If it looks like many of these
    styles could overlap, you’re right, and there are probably additional styles than
    the ones outlined here (what about that conversational narcissist we’ve already
    encountered, who may be more practical or more emotionally minded, but still has
    an overwhelming preference for one topic alone: themselves?)


    No style is better or worse than the other; rather, an effective communicator
    is someone who is aware of each approach as tools in an inventory that they can
    switch out as needed. More than that, we need to be able to recognize the conversational
    tools we see others using. Won’t we change our approach if we know we’re talking
    to a more heart-centered person versus a more head-centered one? The important
    thing is to maintain awareness of your own context, and the needs of both yourself
    and others, to pick an approach that has the best chance of success for everyone
    involved.


    These different listening styles can be framed a slightly different way according
    to the theories of educational psychologist Benjamin Bloom, although versions
    of this theory are perhaps thousands of years old. People can be understood as
    having a general preference for **feeling** (the heart, emotional), **thinking**
    (the head, cognitive), or **doing** (the hands, behavioral).


    Those with a preference for approaching life with their heads (thinking) are like
    the “content-oriented” people above, and will likely frame problems as a matter
    of lack of knowledge or insufficient understanding. When you talk to such a person,
    it’s helpful to acknowledge that they learn new things and engage with their world
    via rational, structured, cognitive means.


    This could result in the preference for more goal-oriented “informational listening”—active
    listening for facts, details, arguments or data in much the same way as a student
    might listen intently to a lecture. While this is great for corporate environments
    or in universities, it’s less ideal in romantic relationships, as our previous
    example with X and Y shows.


    Similarly, this orientation may favor a more critical kind of listening, wherein
    information is analyzed and appraised for its veracity, coherence and value. Importantly,
    this is still rather content-focused, especially if such a listener has neglected
    to consider the emotions and desires of the speaker as relevant data. Such people
    may look down on action-oriented speakers and find them unintelligent, or secretly
    prefer clean and abstract theory to the messy real world. They may similarly fear
    emotions and have a strong need to control others’ feelings when they encounter
    them.


    An example is a doctor who listens intently to a patient’s story but only filters
    out the medical facts in order to make a diagnosis, while ignoring emotional content.
    A lawyer may listen to a client or colleague speaking about a case and actively
    try to hear out missing information, flaws in an argument, opportunities, and
    weaknesses. The goal is to listen for some very specific purpose—to gather as
    much good-quality data as possible in order to do the job properly.


    “Hands” people act first and think later, or, more accurately, they seem to think
    *by* doing. To them, direct, real-world experience is the gold standard, and they
    engage with the world via their psychomotor skills, and working through the hands.
    Sensible and practical, they may have a reciprocal disdain for overly cognitive
    types, believing these people waste time and lack real-world understanding. Similarly,
    they may get irritated with “soft,” heart-centered or emotion-focused people,
    feeling they lack will or a backbone.


    An example is a manager at work who is listening to an employee’s account of a
    problem in the office. Even though the employee may be relaying plenty of neutral
    information, along with some emotional details (“everyone in sales is sweating
    now…”), the manager might only listen for what he feels is crucial: what has the
    employee actually done so far, and did it work? He might not care much for theories,
    rumination, worry or analysis. For him.


    “Heart” people prioritize emotional, relational and holistic content first, and
    engage with the world through their own felt direct experience, as well as striving
    for harmony and connectedness. What matters to heart people are motivations, values,
    appreciation, feelings and relationships. They may practice appreciative or empathetic
    listening—wherein the goal is merely to show support or sympathy, and encourage
    the speaker. Often, this is the true reaction we want in others, and it’s a large
    part of the type of listening we want to train in this book, though the others
    are of course not without their purposes and benefits.


    An example of a heart approach is someone who is able to hear a friend talk and
    simply listen attentively, perhaps occasionally asking a question or offering
    a supportive sound or phrase. The stereotypical “how does that make you feel?”
    is broadly considered poor practice, but all good psychologists, counselors, carers,
    and so on are in effect adopting this position in their conversation—they want
    to know what the other person is feeling, and the details are somewhat secondary.

