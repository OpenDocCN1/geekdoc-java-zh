    distracted, we’re not shutting them out selectively, and we’re not changing the
    subject.


    However, what keeps this level from being five-star, fully focused listening is
    our analytical and judgmental mind. While the other person speaks, we’re comparing
    their statements to our own points of view, deciding whether we’re in agreement
    with them or not, like someone on a debate team. This is more than fair in a two-way
    conversation where both parties are expected to provide equal exchange. But the
    fact that we’re still assessing our partner with our own reason and logic keeps
    it from becoming pure listening:


    - Person A: My mother is starting an online business.

    - Person B: Doing what?

    - Person A: Selling some of her homemade crafts. She thinks she can do it on her
    own. I’m not sure she’s completely aware of what she’s in for.

    - Person B: What are your doubts?

    - Person A: That she’s never done anything remotely related to web management
    or coding, and I don’t know that she knows anyone who has. She’s almost seventy
    and I’m just concerned she’s underestimating what it will take.

    - Person B: You know, there are relatively cheap courses she can take online that
    can teach her to do it from scratch. It’s helped a lot of people.

    - Person A: Yeah, I suppose she can look into those.


    As you can see, this last exchange doesn’t end in a disagreement, an invalidation,
    detachment, or, thankfully, another squirrel sighting. It’s a fair and open exchange.
    Person B is paying close attention to what Person A says and is drawing Person
    A out so they feel safe to reveal their innermost feelings. That’s all good.


    But after hearing Person A explain what their doubts are, Person B makes a suggestion
    that Person A’s mom check out some online courses. Person B made this recommendation
    from their *own* standpoint. Hearing Person A’s doubts activated Person B’s own
    experience, judgment, or opinion, and it caused Person B to make a remark that
    was on topic but not reflective of what Person A was thinking or feeling.


    As you can see, “judgment” can often be subtle, well-intentioned and hard to pinpoint.
    In the above conversation, it’s tricky to see where things could have gone better,
    and Person A is likely to feel OK about the exchange if not thrilled with how
    supportive B was. Person B wasn’t outright contradicting, insulting or denying
    what Person A was sharing—they just squeezed in their own viewpoint instead of
    acknowledging and reflecting the one shared with them. (For example, B could have
    said something like, “It seems like you’re pretty worried about her biting off
    more than she can chew, huh?”) Is this terrible? Of course not. Maybe Person A
    and Person B talk this way with each other all the time. They might be perfectly
    comfortable with giving each other’s advice and might even welcome it. But Person
    A *could* have taken B’s advice as a form of invalidation. Person A was in the
    midst of expressing her emotional state and may not have finished—they could have
    interpreted B’s advice as a forced solution intended to stop the conversation.
    It all depends on how secure and close their relationship is and what boundaries
    they’ve set up for themselves. Attentive listening is very good. Responses like
    B’s aren’t criminal and hopefully don’t result in guesswork when they’re trying
    to figure out what to say. These potentially invalidating responses are just something
    to be aware of, think about, and consider in advance of communication.


    ## 5. Emphetic Listening


    This is both the final, most desirable level of listening and the polar opposite
    of the first level. In empathetic listening we give all our attention to the person
    we’re talking to. We’re not just focused on what they’re saying—we’re putting
    ourselves in their shoes. We’re not imagining what *we* would do or feel in their
    situation; we’re making a strong effort to understand where they’re coming from
    In empathetic listening we react as though we’re hearing our partner’s story for
    the first time, even if it’s something we’ve talked about. We treat it as new
    and unusual information that doesn’t pass through our own judgments, opinions,
    or frames of reference. It’s not an easy level to achieve and requires discipline.
    But it’s the most rewarding for both partners.


    - Person A: I know we’ve talked about this before, but Chris is impossible to
    deal with the last couple of weeks and I’m not sure what to do about it.

    - Person B: What is happening?

    - Person A: He’s emotionally distant. He’s been staying out most nights, and when
