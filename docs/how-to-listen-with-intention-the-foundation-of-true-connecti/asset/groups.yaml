    themselves rather vulnerable. If you nod and listen, then suggest you get

    coffee and bluntly change the topic, they may feel abandoned, as though

    you led them out into deep water and just left them there, feeling exposed.

    Psychologists who goad clients into gut-wrenching territory only to

    cheerfully tell them their session is finished, before quickly escorting the

    person out of the room with tears still on their face—this is emotional

    abandonment!


