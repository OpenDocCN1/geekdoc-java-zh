    Paul got a part-time job to give him extra cash as he got his university degree.
    He decided to work in a local electronics store because he knew the people, the
    area, and the product like the back of his hand. Imagine his surprise when he
    discovered he wasn’t the big sales star he made himself out to be during the interview
    process.


    Everyone else seemed to hit their sales quotas with ease, yet there he was, stuck
    barely reaching the lower end of the target. What made matters worse was the fact
    that other staff members had absolutely no technical knowledge, yet they surpassed
    Paul in sales every single month.


    Paul’s sales were so bad that his boss called him in for a performance meeting
    to address the problem. Instead of pointing out where Paul went wrong, he decided
    to match him up with his top salesman to discover how the sales techniques differed.


    For the entire afternoon, Paul tagged along with the top-performing salesperson,
    Sam. As Paul observed, he noticed something interesting. The customers were all
    completely the same, the queries were all the same, and his solutions were the
    same—except for one small thing.


    Where Paul would give up or move on, Sam offered additional recommendations and
    moved in for the kill. He realized this when a customer was looking at a camera.
    The customer raised his hands and declared the product to be “fine.” At this point,
    Sam picked up a more expensive camera and walked the customer through its features.
    Paul wouldn’t usually do that—when the customer said something was “fine,” he
    would continue focusing on closing the sale on the same camera.


    But to his surprise, the customer ended up buying the more expensive camera. As
    soon as the customer left the store, Paul asked Sam, “What made you suggest a
    whole new product? Isn’t that just confusing the customer? I thought he said it
    was fine!”


    Sam just laughed and said, “Just because the customer says it’s fine doesn’t mean
    it is. Fine is not positive. It usually means they want something more or their
    expectations haven’t been met. It’s them asking for more options in reality.”


    Paul was taking people’s words literally and only at face value, and because of
    that, he was missing the real messages people were sending him. Whatever was being
    said was the only thing Paul was operating on, and he didn’t consider that communication
    would occur in any other way. Sam explained that people’s words were merely the
    tip of the iceberg in terms of what they wanted to communicate, and “fine” said
    with a flat speaking tone was as good as “this sucks.” That one simple statement
    made a huge change in Paul’s sales, as he began trying to dig beneath the words
    themselves and pick up on the meaning behind them.


    Don’t be like Paul. Learn subtext to read people better and begin to truly respond
    to what people are trying to communicate.


    Communication can be divided into two categories: overt and covert. Overt is the
    words we say and the explicit messages we want to convey. This is when we directly
    tell someone that we’re hungry and ask for a hamburger.


    Subtext is the covert type of communication. It’s almost never directly said,
    relies on literally anything besides the direct message coming out of someone’s
    mouth, and requires correct interpretation. Using subtext to say “I’m hungry”
    would include rubbing your stomach, licking your lips, pointing out that there
    is a menu on a nearby table, and mentioning that your previous meal was tiny.


    Not everyone is going to pick up on those signs, but it is undeniable what the
    person wanted to convey. We routinely communicate through these indirect means
    and hope that it saves us the trouble of being direct. Subsequently, understanding
    the subtext under and surrounding people’s seemingly benign statements gives you
    insight into their true feelings and thoughts.


    For example, how does the overt dialogue below differ from the subtextual, covert
    message? Here, it’s what is *not said* that completes the message. The subtext
    is that the question wasn’t replied to in a convincing manner and, thus, is less
    than sincere. Suppose the answerer of the question has a history of being blunt.


    *“Am I fat?”*

    *“No, you’re not fat.”*

    Translation: Yes, you might be a little bit fat.


    *“Am I fat?”*

    *“No, but I suppose you could maybe lose a couple of pounds.”*

    Translation: Yeah, you’re definitely fat now.


    Subtext can be delivered through vocal tone, phrasing, delivery, reference to
    prior experiences, knowledge of relationships, body language, gesticulation, circumstances,
    and even moods. It sounds abstract and confusing, but just imagine that subtext
    is everything we want to say besides the *exact words* we use.


    In fact, that’s one of the big reasons we use it. It allows us to navigate the
    world through indirect and nonconfrontational means. If you’re great at subtext,
    it saves time, it’s efficient, and it imparts great emotional intelligence by
    understanding people’s ever-shifting circumstances.


    Subtext appears in every situation, from work and dating to social situations
    and family dynamics. In fact, much of dating can be said to be subtext because
    much of sexual tension depends on not revealing true intentions up front. If you
    ask someone to dinner and they tell you they are busy, they might be busy, or
    they might not be interested. If you ask the same person out four times and each
    time they say they’re busy, then there is additional subtext for you to read.
    Take the context into account and things aren’t looking good for you on the romantic
    front.


    Through our behavior and choice of words, we transmit clues and desperately hope
    people pick up on them. Of course, this is the origin of passive-aggressive behavior—we
    don’t feel comfortable saying something directly, so our indirect measures become
    more and more aggressive and unpleasant. As a species, we are fairly avoidant
    and nonconfrontational. Not many people feel comfortable wearing their opinions
    and hearts on their sleeves, especially when they clash with those of other people.
    Directness is inherently tense, so it’s something we prefer to avoid.


    A helpful method to imagine how subtext works in social situations is to imagine
    how it factors into a novel or a book. When watching movies, you don’t usually
    get what characters understand, feel, or think, despite that, you come away with
    a sense of relationships. This is all because of subtext. Even in movies, there
    can be ambiguity—sometimes intentional and not. This is the part the audience
    must fill in, which end up with a flat movie with no impact.


    Let’s take a look at an example to illustrate this clearly. Always remember to
    separate the covert and overt communication.


    Imagine a room where a man clasps a baby-blue box in his hands. The table is decorated
    with roses. A woman appears at the side of the frame and prepares to leave. She
    does not notice the man in the corner. He says, “Wait!”


    Why does the man call the woman?


    If you say, “Because he wants to propose to her,” you have understood the subtext
    present in this scene. The dialogue never says that the man wants to propose marriage.
    You inferred that from a combination of the mood, the description, and the scene
    itself.


    Imagine instead that the man overtly says, “I have a table laid out here for you
    and I intend to propose with this beautiful ring I bought from Tiffany & Co.”
    It’s not something that would happen in real life, and thus, movies have to be
    written with subtext.


    Filling in the details of any incoming communication through subtext is integral
    to better communication and greater likability. If you look closely, you will
    soon find that almost everything a person says has shades of subtext meant to
    consciously or unconsciously communicate additional messages.


    Pay attention to people’s prior history and experiences and how they might relate
    to the current situation. What emotions are at play here? Hint: there is always
    at least one primary emotion at play. It will inevitably color their perspectives,
    priorities, and motivations in a way that could make their message differ from
    their words. If you know someone’s general personality traits, you can often make
    a call by analyzing the situation from how they would prefer to conduct. If someone
    is extremely meek and quiet and says something to the effect of “I agree… I suppose,”
    then it probably means they are internally screaming “NO!”

