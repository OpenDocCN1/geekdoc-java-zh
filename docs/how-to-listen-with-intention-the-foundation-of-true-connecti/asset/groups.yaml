    even how we need other people to help us define ourselves and our


    experiences—by listening.


     


    Have you ever felt that really opening up to someone has helped you better


    understand your predicament? Try to offer the same to the next person you


    want to truly listen to. Adopt an approach of, “I see you. What you are


    saying and feeling is important, and so are you.” Isn’t it funny how so many


    of us crave this attention and validation, all the while being utterly


    unwilling to extend the same courtesy to others?


     


    From this basic attitude, it becomes much easier to genuinely engage with a


    person, rather than learning a set of techniques and phrases and hoping that


    using them will inspire you to become a better listener from the outside in.


    It might be a fun challenge to train yourself to really take your ego out of


    things.


     


    Try for one whole day to dedicate yourself to only listening to others.


    Become a passionate and curious researcher of the human condition. Extend


    the warmest, most fascinated attention to the people you engage with. You


    may find, counterintuitively, that you are far more liked than if you had set


    out to impress people deliberately!


     


    Another approach is to imagine that both you and the other person are not


    key players, but rather that the conversation itself is what’s most important.


    View both conversation partners as midwives, together helping birth into


    being a more refined, better-understood idea, a new thought, or a refreshed


    sense of rapport and connection. Hear what you’re being told, send it back


    and add a little extra “interest” (pun intended) to show you valued the


    original investment. Encourage your conversation partner to come along


    with you on this fascinating process of building a thing you own together.


     


    You can add to the conversation in many ways. Try extrapolating—taking


    what’s been said and extending the idea, asking about what happens next or


    following an idea to its natural conclusion:'
  - '[PAGE 69]


    “Well, I’m fed up with teaching and I certainly don’t want to go back to my


    old job either…”


    “Does that mean you’re thinking of doing something completely different


    then?”


     


    You can also add by synthesizing—taking separate ideas and combining


    them thoughtfully. The idea is that the whole would be greater than the sum


    of the parts—i.e., you’re adding a bigger picture that’s more valuable than


    simply considering each point in isolation. A good way to do this is to


    abandon either/or thinking and consider “this AND that” thinking:


     


    “Well, I’ve got my mother on the one hand telling me one thing, and my


    friends telling me to do another, and I don’t have a clue who to listen to!”


    “Have you considered that you don’t have to listen to either of them?”


     


    If you can, try to avoid using the word “but” and replace it instead with


    “and.” When you say “but” you are inevitably cancelling out everything


    you said before, and emphasizing the thing that comes after. When you use


    “and” you subtly shift to a more open-minded perspective, especially when


    you are expressing your opinion to someone or offering what might be


    perceived as a criticism, for example:


     


    “So what do you think of my short story?”


    “I love it! I liked the ending particularly. And I thought it was a lot more


    engaging than the beginning.” (Compare this to “I love it! But I didn’t like


    the beginning as much as the ending.”)


     


    Reflecting is also both a cause and an effect of creating an emotional bond


    with someone. People naturally mimic and reflect the tone of voice,


    language, posture and so on of people they’re connecting with. But you can


    use mimicking and reflecting to encourage connection, too. By using the


    same words, imagery, or tone of voice, you’re showing the speaker that


    you’re on “their side” and care about building a bridge between you.


     


    “This lesson really sucks, seriously.” (Spoken by a teenaged student to her


    adult teacher).'
  - '[PAGE 70]


    “*Does it*? Well what sucks about it?”


     


    Using the same language creates so much more of a rapport than saying


    something like, “If you’re dissatisfied with the lesson, maybe you’d like to


    take up the matter with the principal.” Responding to a casual tone with a


    formal and stilted one only serves to highlight distance, and is unlikely to


    lead to any sense of shared goals in this particular dialogue!


     


    Of course, reflecting doesn’t only have to be verbal. A person telling you a


    sad story with a slow, somber tone of voice will likely appreciate if you


    match them, rather than talking back to them loudly and excitedly.


    Similarly, body language can say a lot, as can facial expressions. Much can


    be communicated by simply adopting a similar posture when talking to


    someone. If they lean in, lean in a little too, to show your nonverbal


    agreement. If they’re smiling as they recount a particular part of their story,


    smiling along with them is the nonverbal equivalent of saying “uh-huh” and


    shows that you understand and empathize.


     


    Some people may even consider slightly changing pitch of voice or accent


    to highlight what is common between the two parties (or to emphasize how


    uncommon you are, if that’s what you want to do!). Have you ever noticed


    how two expats from the same country will sometimes overemphasize their


    native accent when talking to one another? They are unconsciously


    signaling to the other, “I’m like you. We’re friends, we’re on the same


    page.” However, notice as well that if someone has been living in a foreign


    country for decades but steadfastly refuses to use the local dialect (“it’s


    called a sofa, not a couch!”), it certainly tells you something.


     


    A woman might unconsciously simplify her grammar and raise her voice’s


    pitch when talking to small children, but throw in plenty of big, impressive


    words and talk more deeply when speaking to senior men in a corporate


    environment. A doctor might choose to use the Latin term for a common


    ailment specifically because he wants to distinguish himself as more


    intelligent and important than his non-medical audience. Conversational


    empathy is ultimately about so much more than the literal words that are


    being spoken.'
