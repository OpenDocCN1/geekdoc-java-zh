    Person A: “Well, that producer got back in touch with me and he says

    they’re very interested in my track! It’s so amazing! I’ve never been more

    excited in my life!”


    Person B: “Wow! Really? Tell me about it.”


    Person A: “They say the track has great commercial value and they want to

    chat to me soon about partnering up! Oh my god, right?!”


    Person B: “Haha, brilliant. I can tell you’re super excited, that’s awesome!

    Anyone would be over the moon about that.”


    Here, Person A’s emotional reality is not invalidated, but recognized, seen

    as valid, and reflected back. Notice how Person B is matching the “energy”

    of Person A, too. In this version Person A likely feels super supported and

    encouraged.


    Now, if Person B really did have some concerns, they could always share

    them later, as appropriate. The goal of this conversation, however, is simply

    to validate and be present. It can be the goal of another conversation later

    on to discuss the details.


    ## Validating Responses


    In the first example above, Partner 2’s responses are inappropriate because

    they derail Partner 1’s legitimate emotions. Partner 2 doesn’t want to spend

    time focusing on Partner 1 for whatever reason—they just don’t want to

    deal with them. So Partner 2’s ill-mannered, terse, and mean reaction makes

    a bad situation worse.


    But not all such responses are meant in a bad way—one can also,

    unpectingly, invalidate someone’s feelings with good intentions. Some

    of the innocuous responses we give to someone’s emotional

    can actually hurt them without us realizing what is going on. This is likely

    what of us are doing when we think we’re validating; in fact, we’re

    making the situation worse.


    For example, when consoling someone over a situation that makes them

    nervous or apprehensive, one might say something like “Don’t worry about it” or
    “You shouldn’t feel that.” And they might say it in a comforting

    tone to make them better. They mean well. Other phrases which come

    from a well-intentioned place but feel invalidating include:


    - “Oh you’ll change your mind soon!”

    - “Shh, everything’s going to be OK.”

    - “Lets not think about that now.”

    - “Come on, cheer up.”

    - “Hey, you’re better than that!”

    - “Don’t be silly, what is there to be scared about?”

    - “Oh don’t mean it, you’re just tired.”


    But such responses are actually invalidating. They are worried about

    situation; they already feel that way. Telling someone they’re not acting

    in the optimal way negates their entitlement to own feelings. Even if

    you’re making that remark out of kindness, your partner may receive it as

    validation of perfectly normal feelings. It’s simply unhelpful to hear,

    similar to telling someone, “Hey, just grow.”


    An alternative response that successfully validates the other partner might

    be “I can sense that you’re worried about this situation.” This response

    assures the partner that their concerns are real and that their presence is

    reasonable. Remember, your goal is to identify emotions and then justify

    them—nothing more. You don’t have to appraise those emotions or decide

    whether they’re right or wrong. You don’t have to give permission for them

    to exist or compare those emotions against your own. You just have to

    listen, and accept.


    Another invalidating and unhelpful response is “I’m sorry you feel that.” You
    might think the phrase “I’m sorry” is a form of empathy. And in a way it can be.
    But it can also be interpreted as an empty sentiment. If

    someone’s lost their job, been evicted, come down with a debilitating

    disease, or suffered some awful injury or fate, “’m sorry” doesn’t quite cut it.
    By saying you’re sorry someone is undergoing turmoil—that they “feel that way”—you’re
    also suggesting that there’s a different way they should feel, but they’re not.
    Whether they feel

    certain way is irrelevant, as they can’t change what they already feel.


    A more validating option would be “I can understand why you’re feeling

    this way—I think anyone else would too.” Remember, validation is about

    expressing that someone’s experience makes sense and is valid. Explaining

    that they have a right to be uneasy and that such feelings are normal help

    relax tension and produce a bond with the rest of the world: they wouldn’t

    be alone in feeling this way. Even if you think you wouldn’t feel this exact

    way, it’s important to establish that others would. (Besides, you might not

    really know how you would feel in this situation—it probably hasn’t

    happened to you yet.)


    Likewise, responses like “At least it’s not like…” or “It could be worse”

    imply that your partner’s concerns are illogical or unfounded. Emotions are

    never logical, but they are real. Maybe the issue can be worse, but what

    difference does it make in someone’s subjective sense of reality? If you had

    a Great White shark chewing on your leg, and someone said to you that at

    least he wasn’t chewing on both legs, it wouldn’t do much to stop the pain

    you were feeling, would it? Objective comparisons to more dire situations

    serve to put the worrier “in their place,” even if they’re meant to make the

    partner feel better in the short term. But they’re just friendlier forms of

    marginalization, and a way of saying, “Your emotions are too much.” The

    judgment as to whether someone’s situation can or can’t be worse belongs

    to the person who’s feeling the emotions. When we try to rank and evaluate

    emotions, we only end up judging them.


    In this situation, a proper validating response would make the listener feel

    that they’re being taken seriously: “You’ve really been through a lot” or

    “Tell me more about what you’re feeling.” These responses acknowledge

    the weight of the other person’s issues, reassuring them that you’re willing

    to take their worries seriously and don’t want to minimize how badly they

    feel.


    Outright rejections are not just invalidations but straight-up reproaches:

    “I’m not having this discussion!” This is invalidating because it directly

    cuts off communication and further says that the other person’s concerns

    are unworthy. By saying this, the respondent imposes a limit on communication—obviously
    there are some subjects they’re unwilling to discuss with you, when a true friend
    or partner wouldn’t have any whatsoever. You can imagine what it feels like when
    you bring an emotion, intending to share, and they essentially run from it! A
    better response is “Would you like some help working through this problem?” or
    (again) “Tell me more about what you’re feeling.” This helps

    the partner feel like they have a path to finding a better result, if not a

    total. It tells them that their problem is significant and that they deserve

    the trouble.


    If it sounds like you’re walking on eggshells when dealing with other

    people’s feelings and one of these responses slips out, don’t. To be honest, we

    both mean well, and we are humans who make mistakes. But be aware that those

    responses are invalidations that should be followed as quickly as possible

    with validating statements. Remember that you’re trying to form a connection

    and allow communication to flow freely. If you really put foot in it, you can
    set

    things right by re-establishing connection. “Oops, I think that came out the

    wrong way, I apologize. I want help!”


    ## Six Steps to Validation


    Learning the six steps of validation as outlined by Kate might be a prudent place
    for those who like breaking things down. When your friend or loved one is in a
    vulnerable state and is reaching out, these are the stages and the order you should
    go through to effectively hear and communicate with them:


    1. Be present. First of all, show up. This is once the easiest yet trickiest step
    of all. It doesn’t mean just being present and maintaining eye contact. Being
    present is actually like two smaller steps: giving your partner absolute attention,
    then understanding that they’re dealing with big emotions at the moment. The first
    part is physical: it just eliminating distractions. Turn off your phone, switch
    off the TV, and reduce the volume of music to a hum in the background. (You could
    also turn it off, but relaxing music can make the environment for communication
    a little easier.) This is obviously more complicated in a public place—if it’s
    easy to move to a quieter spot, do so. If not, try to ward off by keeping complete
    focus on your partner and leaning in if you have to. Angle your body toward them
    and use open, accepting gestures, postures and facial expressions.

