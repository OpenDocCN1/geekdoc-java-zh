    When people are grieving, they sometimes say how they’re doubly saddened by people’s
    awkward and avoidant responses to their grief. What they really want in the moment
    is to have their reality mirrored to them honestly and fearlessly. They want someone
    to say, “That hurts. I can see it hurts” and simply be with them, letting them
    know they are not alone.


    A good habit to get into is to avoid passing what people say through your own
    judgment filter, where you quietly decide what *you* think about the matter. You
    may decide someone is over or underreacting, or reacting in a way you wouldn’t.
    You may start thinking about who the good guys and the bad guys are in the story,
    or quietly question the veracity of the version of events you’re getting.


    You may put on a scientist or investigator hat and try to solve the mystery, identify
    the villain or decide who’s wrong and why, or what facts are missing. Or you may
    play nurse or mother and decide that the bad feelings are unacceptable and that
    it’s your job to heal this person, cheer them up, or scold them for making you
    unhappy…


    But all of this is irrelevant—because it’s about *you* and not about *them*. Your
    take on the matter doesn’t matter right now. Suspend all your preconceptions and
    ideas and beliefs and immerse yourself in their world. How does it actually feel
    to be them right now? Don’t merely picture yourself as you are in their situation—picture
    this person in their situation.


    Another good idea is to give plenty of time for the person to speak and express,
    without hurrying the conversation along to a conclusion or summary. Even done
    subtly, this can feel like the listener wants to be done with the conversation
    quickly, and can really invalidate one’s feelings. When someone shares their feelings
    with you and you respond with a simplistic summary, you’re telling them that you’re
    not available to listen further, and that what you really want is for them to
    stop feeling how they feel and get on with it.


    Don’t run ahead in the conversation or try to insert an interpretation, conclusion
    or solution before the speaker actually arrives there on their own time. This
    will communicate that you genuinely care. Let your speaker set the tone and pace,
    and match it empathetically. If you ask open-ended questions or merely reflect
    or show support, the person is likely to feel heard, whereas closed questions
    can feel like you’re more interested in pushing the speaker down a particular
    path than letting them express what they are feeling.


    You may never realize all the ways you subtly communicate to others that you don’t
    in fact value their emotional experience and are not truly listening, even if
    you’re trying really hard to be a better listener. Sometimes we don’t even know
    all the ways we enter a dialogue with fixed ideas of how it should go, what the
    other person should say—and indeed the role we should play for them. You’ve probably
    been at the mercy of someone who truly believed they were being a “good listener,”
    but you actually felt like your experience was merely being shoehorned into theirs.


    A good listener is above all open and receptive, and unafraid to completely embrace
    another person’s reality, entering alongside them in their feelings, whatever
    they are, without their own egos getting in the way. When you think about it,
    this phenomenon is so rare in the world today that if you can successfully demonstrate
    it to someone in a moment of vulnerability, you’ll likely win their trust forever
    and significantly strengthen that relationship.


    When in doubt, remember all the times you’ve wanted to talk and share your emotional
    world with someone else. At the time, did you want to hear their pop-psychology
    interpretation? Did you want to know their opinion on what you’re doing wrong
    and how to fix it? Did you want them to freak out and get awkward, so you feel
    guilty for making *them* feel bad? Did you want them to “fact check” your story,
    or tell you you were overreacting, or side with someone else? Or would you have
    immensely appreciated it if they simply told you, “Hey, whatever happens, I’m
    here and I support you. Tell me more”?


    ## Validate


    When we think about empathy, withholding judgment, and simply ceding the floor
    to others, once again, it’s not a completely passive activity. Just like active
    listening, this process of making people feel heard contains several different
    layers. **Validation** is the verbal affirmation and acceptance of the emotions
    and viewpoints of someone we’re communicating with. Validation is the message
    that someone’s experience and reality is valid, whatever it is. For our purposes,
    it’s truly an extension of deep listening and being mindful of both the conversation
    and the meta-conversation that is occurring in front of us.


    Normal listening takes care of the conscious conversation level, but validation
    satisfies an emotional need (the meta-conversation) that is presented any time
    anyone opens their mouth. Often, validation is the most fundamental reason why
    people seek conversation in the first place. Though it may seem otherwise, they
    are not looking for solutions, arguments or explanations. They just want someone
    to confirm for them that they are not bad or wrong or strange or alone for feeling
    as they do.


    At first glance, validation might seem like a fairly simple concept of nodding
    and saying yes when people want you to (not very distinguishable from active listening,
    even), but even though it sounds relatively complicated, there are right and wrong
    ways to validate. Validation is one of the more powerful give-and-take practices
    of communication because it establishes respect between two people, whether they’re
    old friends or strangers. Shutting down someone’s feelings—even if they’re reluctant
    to us—effectively closes those gates and isolates *both* sides of the exchange,
    putting relationship at risk. Genuine validation, on the other hand, helps everybody
    in communication process a win. The receiver gets a confirmation of their humanity,
    but the giver also enriches their sense of self. Generosity, trust, and eagerness
    to emerge, and communication rarely goes wrong when all those elements are working.


    Going beyond this, people who feel validated are far more likely to want to open
    up and listen to *you*, and return that same sense of validation. In today’s world,
    where people are more divided than ever, mutual validation can be the first step
    to healing some deep rifts, and undoing the disconnection that comes with misunderstanding.
    Studies from the University of Rochester highlighted the positive and subtle effects
    the act of validation has in relationship. It’s not just a way of paying to people
    or showing respect for people’s wishes. That is the lowest fruit that needs to
    be picked, but true validation goes far deeper in making people feel embraced
    and heard.


    In one study, a selection of participants was instructed to focus on the best
    experience they’d had in the previous years. Then they were matched with another
    person and encouraged to tell them. Unbeknown to them, that other person was not
    a subject but someone (“confederate,” as researchers put it) who’d been trained
    to respond in a favorable way to their experience. Other participants in the study
    were matched under the pretense that they were just participants in the study.
    Instead of talking about their experience, though, they participated in a “fun”
    activity that involved drawing.


    The feedback from the respondents after the experiment showed an interesting split.
    Subjects who took part in the fun activity reported liking their partners more
    and that they’d enjoyed time with them more than those who’d only spoken with
    them. But those who had discussed their experience and gotten a supportive response
    reported that they *trusted* the other person more and that they were more likely
    to be open with their private thoughts and feelings.


    These affirmations caused test subjects to feel even better about their experiences.
    They felt more assured about the daily structures of their lives and generated
    a large amount of goodwill in return. They got another level of satisfaction and
    value on top of the original experience—all from a somewhat simple act of validation.

