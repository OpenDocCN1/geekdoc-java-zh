    Frames are a different way to imagine listening styles. Frames are


    much more fluid, and simply ask you to consider what someone’s


    overall goals or purpose for the interaction is. What is theirs, what


    is yours, and do they match? If not, utilize your new understanding


    and make them match. An easy way to think about frames is in


    terms of an acting scene. All the actors are on the same page,


    working toward the same goal, and trying to capture an emotional


    payoff. What happens if one of the actors wants to wing it for a bit,


    and expound on their character’s love of the sea? Nothing good.


    Finally, we get to levels of listening. Unlike listening frames and


    styles, some of these levels of listening are just plain bad. The


    levels are: ignoring, pretending to listen, selectively listening,


    attentively listening, and empathetically listening. The first two


    levels are not very useful, and it’s only when we reach the ultimate


    level of empathetically listening that we remove ourselves from the


    equation and listen to hear rather than listen to reply. Most of us are


    stuck in the first three to four levels for the majority of our day-to-


    day interactions.


    **Chapter 3. The Tough Work of Hearing Someone**


     


    Listening is a truly not a passive activity. Well, it can be, but that


    would just mean that you’re not doing a good job. True, deep


    listening can be said to be extremely active, to the point of tiring


    you out! Surprised? This is because the purpose of true, deep


    listening is to *go there* with someone, and this involves teasing out


    exactly where you are even heading. It’s a job that requires a lot of


    comprehension, solving subtle mysteries, and clarification. It’s a bit


    like a therapist’s role in helping unravel emotions and situations.


    To this end, we come to the concept of active listening. It’s a way to


    participate in conversations while being on the receiving end. Most


    might think that receiving simply means sitting quietly, but that’s a


    huge mistake. There are nine types of active listening responses we


    cover, to be used when trying to connect deeply with someone:'
  - '[PAGE 122]


    comprehending, retaining, responding, restating, reflecting,


    summarizing, labeling emotions, probing with leading questions,


    and silence. The next level of active listening could be called


    empathetic reflection, and this is where the listener focuses on


    emotion, so much so that you are trying to predict what the speaker


    is feeling, and share it with them.


    **Chapter 4. I See You, I Hear You**


     


    Get into the hole with others—the holes that they have dug, not the


    one that you are digging beside them. Validation is a somewhat lost


    art. Validation is the act of showing respect and acknowledgment of


    people’s intentions and emotions. When we validate, we express


    that someone else’s experience, their thoughts, feelings, perspective


    and indeed they themselves, are valid, make sense and are


    understandable.


    It can be as easy as nodding your head, but it accomplishes the


    greater purpose of making people feel emotionally heard and


    fulfilled. At the most basic level, it consists of identifying people’s


    emotions and then justifying them. You first act as a detective to


    understand what you are dealing with, and then make people feel


    that they are completely reasonable in their emotional experience.


    Emotions are never quite rational, but they are always real.


    Many times when we try to validate, we actually worsen the


    situation by using invalidating statements. These are statements that


    dismiss or minimize people’s feelings, such as “Oh, you’ll be fine”


    or “You shouldn’t feel that way!” They’re prescriptive and try to


    convince people to see the bright side of things—but that’s not what


    they are in need of at the moment.


    A helpful six-step path to validation is as follows: being present,


    accurately reflecting emotions, guessing emotions, understanding


    emotions in context, affirming emotions, and then being honest. It’s


    not always necessary or even possible to practice every one of these


    steps, but it’s worth moving through them progressively,


    considering context, your position and what the other person most


    needs from the conversation.'
