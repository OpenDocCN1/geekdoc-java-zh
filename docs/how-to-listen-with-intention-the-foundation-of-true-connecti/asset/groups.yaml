    ensure that the speaker can *feel* you are on the same emotional page as them.
    After all, what’s listening if it’s only going on inside your head, and not being
    conveyed to the other person?


    *Comprehending.* The first step in active listening is, of course, comprehending
    what the other person is saying in the first place. If the person who’s talking
    to us is speaking the same language as we normally do, this process is fairly
    automatic.


    But there are other potential blocks—for example, if the person uses a lot of
    jargon or slang that we aren’t familiar with or if there are differences in generation,
    social standing, or culture that we just don’t know enough about. Above all else,
    you just want to make sure you are on the same emotional page as the speaker,
    so you can ascertain their needs and desires at the moment.


    A great thing to ask if we’re not understanding what someone’s saying is *“Can
    you explain it to me as if I were five years old?”* A five-year-old knows enough
    words to hold a conversation but needs to have relatively complex situations described
    to them in a very patient, deliberate way using the words they already know. Especially
    if you think the other person fears appearing condescending or patronizing, asking
    them to describe something as if you were, let’s say, *far younger than your actual
    age,* can make them feel a little more at ease.


    Other statements to ask for help comprehending include:

    - “What happened?”

    - “Tell me your story.”

    - “What do you mean?”

    - “Tell me more.”

    - “Can you clear this part up for me?”


    Don’t be afraid of coming across as stupid or interrupting. Most people like to
    feel like experts, and we are all experts in our own experience. It can even be
    useful sometimes to be completely transparent about your lack of understanding—if
    you frame this as a reason for you to listen all the more closely so you can learn!


    *Retaining.* More than just remembering what you just heard, retaining information
    is hearing what the speaker is trying to say so we can give back a suitable reply.
    You’re trying to get the whole story here, and this goes far beyond simple facts
    and events. The goal is to place yourself in the speaker’s shoes as closely as
    possible, and of course, questions are necessary for that.


    When we’re listening to someone, we tend to retain only the details that strike
    us more personally or in ways that we’re most used to retaining information. But
    that’s only our lens, and not particularly useful for trying to be a better listener.


    For example, if someone’s telling us about a date they went on, we might be the
    kind who remembers the physical details of the event (what restaurant they went
    to, what movie they saw, what they were wearing). Or we might recall some more
    general narrative about the date as a whole (what personality the other person
    had, what the date “felt like,” how it compared to other dates in the past).


    We might not even notice ourselves picking out pieces of the narrative that push
    our buttons, and internally we can set to work constructing a slightly different
    story for ourselves than the one we’re being offered. You might have been on the
    receiving end of this, when you tell someone something as they seem only to latch
    on to one aspect of the story that definitely wasn’t your focus. It’s definitely
    a way to “listen without listening!”


    In conversation we generally look for openings for us to say something and “get
    our two cents in.” This is normal, but it’s not conducive to active listening.
    To properly retain what our conversation partner is telling us, we have to put
    our egos away and focus squarely on the other person’s words, as they are laying
    them out. It’s not about your interpretation, but theirs.


    Again, questions are a powerful tool to frame things and keep your focus on the
    other person’s expression. To ensure you’re retaining all the relevant information
    you need, you could ask:

    - “What does that mean to you?”

    - “And just to be clear, what happened after?”

    - “Wait, how did she approach that?”

    - “How does that figure into the story?”

    - “How did that make you feel?”

    - “What was your reaction?”


    *Responding.* Active listening requires an effort to form a knowing and proper
    response—otherwise, the speaker might feel like they’re talking to a brick wall.
    As has been said multiple times, listening is anything *but* passive! An effective
    response will demonstrate our concern for what our conversation partner is talking
    about.


    You’re listening, comprehending, and retaining already; a quality response will
    prove that you *understand* everything the speaker has said and picked up on their
    nonverbal communication. Imagine that you are speaking to someone, and you’re
    not sure that they understand the language you are speaking. They give no indication
    of comprehension—do you feel listened to? That’s why a response is necessary.


    Like retaining, it’s important that a response isn’t tinted with our own ego or
    ideas. You don’t want to respond in ways that suggest you’re trying to steer,
    manipulate or interpret the conversation according to your own agenda. You’re
    trying to get a sense of the other person’s feelings and opinions without biases
    you’ve developed:


    - *Speaker A:* And that’s why I don’t like going to dinner parties.

    - *Respondent B:* That sounds insane! Were you flustered when that odd man jumped
    out of the cake?

    - *Speaker A:* Not flustered so much as disappointed. I expected something a little
    more grown-up from the Temperance League.

    - *Respondent B:* It must have tried your patience. Did it?

    - *Speaker A:* A little bit. But more than anything else, it just proved that
    I have to start putting some restrictions on the entertainment budget.


    Responses in active listening should be reflective of what the speaker has said.
    They should display a deep interest in your partner’s thoughts and feelings. Rather
    than expressing our *own* opinions and viewpoints, good responses in active listening
    help both parties make their own self-discoveries.


    In issuing a quality response, try to reply to your partner’s thoughts and feelings—the
    factual content is often less relevant than it first appears. You can do this
    by restating what they’ve said in your own words. Stay within their standpoint
    when you respond; introducing a suggestion or idea that doesn’t have anything
    to do with their immediate situation could be too jarring or distracting. Don’t
    offer a contradictory or conflicting opinion until you have fully understood,
    as much as you can, everything your partner is conveying to you. And even then,
    try to keep strong judgments tamped down.


    Some positive responses in active listening might be:

    - “I’m intrigued by your story.”

    - “That sounds like a _____ situation.”

    - “I can see how you’d feel that way.”

    - “I get the sense that you feel something has to change—what would you like to
    see happen?”

    - “Do you feel _____ about this situation?”


    The general goal of active listening is to fully grasp the viewpoint or life experience
    of the person who’s speaking to you, and for you to absorb that information in
    a meaningful way that could spur you to new knowledge and understanding. You want
    to show the other person that you can step inside their world and see their experience
    from their point of view. To accomplish the goals of comprehending, retaining,
    and responding, you can employ a few or more of these techniques:


    *Restating.* Paraphrasing your partner’s sentiments in your own words is an exceptional
    way to facilitate your comprehension. It’s important *not* to simply repeat what
    they said back to them like a parrot, but rather to show that you’ve caught the
    essence of what they were expressing. You’ll recognize this as a kind of “support
    response” discussed earlier. You’re letting them know that you heard them and
    are on the same page with them. If you’re not 100 percent right, they will almost
    certainly be to correct you.

    - *Them:* That situation confused and scared me.

    - *You:* It must have felt like a dangerous moment—it have been hard to know what
    to do.


    *Reflecting.* An alternative way of restating is to frame your reply along the
    lines of emotions rather than events or story points. Reflecting gives the speaker’s
    story a deeper level that you can prove you have handle on. Literally tell them,
    or ask them, about the emotion they are experiencing.

    - *Them:* So in the end, my dad said he knew all long I wouldn’t get into that
    college.

    - *You:* That’s terrible. That sounds like a cruel kind of rejection.


    *Summarizing.* Try to verbally round up the details of a speaker’s story into
    a concise form that displays your grasp of the whole picture. This is similar
    to restating, but you are going for a broader overview. You can also treat this
    as a test for your understanding. Many points and arguments may have been stated,
    and you may have lost sight of the primary emotion, action, or purpose.

    - *You:* So the baker got your order wrong, the dinner was burned, and they sent
    a hypnotist instead of a clown. Man, if that were my kids birthday party, I’d
    feel ticked off!


    *Label emotions.* Often, a speaker will get lost in the practical and physical
    details of what they’re relating to you. As sensitively as possible, try to identify
    the emotions they haven’t been able to specifically verbalize yet. This is not
    inherently difficult to do, as you only have to state a type of positive or negative
    feeling, but when you accurately label someone’s emotion, you are going to be
    seen as a psychic. Just watch out that you’re not overreaching or trying to inject
    your own ideas into the matter.

    - *Them:* Finally my boss apologized for overlooking my work and assured me that
    he was going to pay more attention from now on.

    - *You:* Wow, I’m guessing you feel pretty relieved and vindicated by that—not
    to mention a little cocky.

