  - '[PAGE 83]


    **Two-Step Emotions**


     


    Any verbal interaction looks simple on paper, but sometimes we can get


    tripped up on execution. Validation is no different: there are components


    one must include to make it felt. When someone confides in us or expresses


    a certain immediate emotion, they’re looking to have that emotion


    processed and accepted by whomever they’re talking with. That doesn’t


    always happen.


    There are two main components of an act of validation that define its


    success.


    *Identifying the emotion*. While recognizing our own emotions is a crucial


    part of our personal mental health, being able to do so with someone else is


    a big plus in our relationships and social health. The ability to verbalize our


    interpretation of our partner’s emotions—*before* they have to come right out


    and say “I’m angry” or “I’m sad”—opens the door to a positive validation.


    It shows that we’re keyed in on what they’re communicating, that we’re


    really listening and not just hearing.


    “I can see how upset this has made you.”


    “I wonder if you’re feeling overwhelmed right now.”


    “Do you think it’s fair to say that you’re feeling conflicted?”


    *Justifying the emotion.* Once we’ve identified what our communication


    partner is feeling, the next step is proclaiming it as a proper—or at least


    very understandable—emotional reaction: “Why, if *I* was in your shoes, I’d


    feel the same way too!” This establishes a sense of commonality, that our


    partner’s sentiments are exactly what rational people would feel under the


    circumstances. It communicates that you are feeling the same emotion they


    are and emphasizes that the way they feel and think is justified.


    More than this, it tells the other person that the way they feel makes sense,


    and is a sound, justifiable response. Granted, the emotions they’re


    experiencing might not be positive, but that doesn’t mean they’re wrong to


    feel them.


    “I can totally see where you’re coming from.”'
  - '[PAGE 84]


    “When you explain it like that, it makes sense that you acted that way.”


    “I’m not surprised you’re feeling exhausted.”


    “Your opinion is completely normal and understandable!”


    Justifying your partner’s feelings is a much more important component than


    instantly offering advice on what to do. They want to feel that you


    empathize with their plight first, before hearing what corrective measures


    they should take – if they want to hear these at all.


    Without first acknowledging their emotions, even well-intentioned or


    accurate advice would simply infer that the speaker has been doing


    something wrong or that their emotional status is primarily their fault.


    Before giving advice, we need to connect with them on a sympathetic,


    emotional level. That will make working through a solution much easier


    and more supportive later. Oftentimes the act of validation, not advice, is


    really what people are seeking in an interaction. They already *know* what


    they have to do, they just want someone else to hear their experience, and


    reflect it back to them.


    This tells us emotional support is more important than having a to-do list to


    fix someone’s circumstances or feelings; indeed, feeling better about


    something is *far more* important than knowing what to do about it.


    How do these two components work in real communication? Let’s first


    imagine a scenario that *doesn’t* work:


    *Partner 1: *“I can’t believe this! I’m getting heat at work for


    something my boss told me to do! I knew it was a bad idea, I


    protested it, they forced me to do it, it messed things up royally, and


    now my boss told me I’d have to work overtime this weekend to put


    everything back the way it was!”


    *Partner 2: *“I told you that place was a disaster before you took the


    job. You shouldn’t be surprised this is happening.”


    *Partner 1: *“Gee, thanks for making me feel worse.”


    *Partner 2:* “I’m not the one who wanted to go into the funeral home


    business. Don’t look at me. Why don’t you look for another job?”'
  - '[PAGE 85]


    What’s wrong with Partner 2’s response? Just about everything. Partner 1


    was upset at what they perceived as an unfair situation. They felt upset that


    they weren’t taken seriously at work and then got shafted when things went


    wrong. Partner 2 is essentially doing the exact same thing. By reminding


    Partner 1 that “I told you so,” Partner 2 isn’t taking their feelings seriously


    either. They judge Partner 1 for making the wrong choice to begin with and


    imply they shouldn’t feel upset because, essentially, they made their bed


    and have to lie in it.


    Here’s another example:


    Person A: “Well, that producer got back in touch with me and he says


    they’re very interested in my track! It’s so amazing! I’ve never been more


    excited in my life!”


    Person B: “Woah, woah, slow down there. What did they say exactly?”


    Person A: “Only that the track has great commercial value and they want to


    chat to me soon about partnering up! Oh my god, right?!”


    Person B: “Yeah, that’s great, but it’s not some scam or something, right?


    You need to rein in your expectations—I’d hate for you to get


    disappointed.”


    You can practically hear the wind rushing out of Person A’s sails, right? In


    the above example, we can see that it’s more than possible to invalidate


    positive feelings, too. Person B has basically communicated that Person A’s


    excitement and happiness is not “correct” or is too much—i.e., it’s not


    valid. They minimize this excitement and try to tell Person A what they


    *should* be feeling (what a jerk!).


    Let’s take a look at these updated exchanges, which are much more on the


    mark:


    *Partner 1: *“I can’t believe this! I’m getting heat at work for


    something my boss told me to do! I knew it was a bad idea, I


    protested it, they forced me to do it, it messed things up royally, and


    now my boss told me I’d have to work overtime this weekend to put


    everything back the way it was!”'
  - '[PAGE 86]


    *Partner 2: *“Did they really do that? No! That’s infuriating! I’d be


    livid about it too.”


    *Partner 1: *“I just feel like I don’t have any control over my own


    destiny at that place.”


    *Partner 2:* “That must be really disheartening. I don’t see how


    anyone would feel otherwise under such conditions, especially at a


    funeral home.”


    In that exchange, Partner 2 does a much better job of validating Partner 1’s


    experience. They’ve identified the emotion Partner 1 is feeling, namely fury


    (“That’s infuriating!”). They then established the emotion as proper or


    understandable and exactly the way people would feel in that situation (“I’d


    be livid about it too”). Partner 2 then repeats the process in the last


    statement: Partner 1 feels “disheartened,” and anyone in those


    circumstances would feel and act the same.


    Note that in the second exchange Partner 2 does not try to fix the problem


    or even necessarily take deliberate steps to make Partner 1 feel *that* much


    better. Partner 1 needs to feel enraged at the moment; it’s a justifiable


    emotion. If Partner 2 had tried to force a solution by giving advice or


    suggesting something else, it would have interrupted Partner 1’s emotional


    process. It would have been an effort to stop Partner 1 from feeling how


    they’re entirely entitled to feel.


    What’s more important is that Partner 1 feels validated in their response,


    that they’re understood and empathized with. That reinforces the quality of


    their communication. If there happens to be a way Partner 2 can effectively


    offer help or work through a solution later, great. But without a sense that


    the partner’s feelings are valid, that effort won’t amount to much. Even if


    you know what must be done and think someone is idiotic for engaging in


    self-defeating behaviors, think of it this way: they can’t understand it unless


    they hear themselves say it. So you must humor them and engage in a


    certain degree of their drama to successfully validate and guide them


    toward emotional support and perhaps even a solution.


