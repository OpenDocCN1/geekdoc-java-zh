    \ on the receiving end. Most might think that receiving simply means sitting quietly,\
    \ but that’s a huge mistake. There are nine types of active listening responses\
    \ we cover, to be used when trying to connect deeply with someone: comprehending,\
    \ retaining, responding, restating, reflecting, summarizing, labeling emotions,\
    \ probing with leading questions, and silence. The next level of active listening\
    \ could be called empathic reflection, and this is where the listener focuses\
    \ on emotion, so much so that you are trying to predict what the speaker is feeling,\
    \ and share it with them.\n\n## Chapter 4. I See You, I Hear You\n\nGoing deeper\
    \ than conversation styles, specific words you say and so on, we arrive at perhaps\
    \ the deepest function of any communication—to be seen, heard, understood and\
    \ acknowledged by another person, and to do the same for them. Listening without\
    \ judgment, without trying to “fix” anything or change how another person feels,\
    \ and without rushing in with your own feelings on the matter—all this comes from\
    \ having empathy.\n\nWhat is communication, really? When two people come together\
    \ to exchange some sort of information, what is truly going on between them? Every\
    \ one of us is embedded in the world we live in, in our families, communities,\
    \ and cultures. We are simultaneously separate and also connected. What connects\
    \ us to one another? Communication.\n\nThere are three parts to communication:\
    \ the person sending the message, the person receiving the message, and the message\
    \ itself. If something goes wrong in any of these three areas, communication will\
    \ fail. If the speaker isn’t expressing themselves correctly, if the listener\
    \ doesn’t really want to listen, or if the message is sent in a way that it can’t\
    \ be heard, then communication just doesn’t happen.\n\nTo be good communicators,\
    \ we need to do two things: understand who we are talking to, and figure out a\
    \ way to appeal to them directly. Empathy is what helps us achieve that first\
    \ part—understanding our audience. Who are we speaking to? How do they communicate\
    \ and why? What do they want and what matters to them? How do they see you in\
    \ the conversation? Asking these questions means you can tailor not only what\
    \ you say but how you say it. And none of that can be done without empathy, i.e.\
    \ imagining what it must be like to be someone else.\n\nEmpathy brings people\
    \ closer, dissolves conflict and misunderstanding, enriches our experiences and\
    \ makes us feel heard and understood. True empathy diffuses conflict and encourages\
    \ deeper intimacy. So-called “non-violent communication” is based on the principle\
    \ of seeking to understand a person’s emotional reality, rather than deny it,\
    \ change it, judge it, praise it, explain it away or take responsibility for it.\
