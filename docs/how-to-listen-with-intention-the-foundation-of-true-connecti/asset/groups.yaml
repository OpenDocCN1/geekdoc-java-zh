    It’s now time to get self-conscious and introspective. Sociologist Charles Derber
    has studied this phenomenon extensively and believes that this form of conversational
    narcissism can occur without people even being aware it’s going on. It can be
    easy to imagine that conversational narcissists are the stereotypical loudmouths
    who dominate conversation—but it’s far subtler than this. It turns out that the
    situation can turn on a single word choice. He articulated what he called *support
    responses* and *shift responses*, and how they can subtly pervade our everyday
    vocabulary.


    Derber explains what he calls “initiatives” in conversation—which can be *attention
    giving* or *attention seeking*, the latter of which can be further divided into
    active or passive. This is a little like our tennis analogy—in tennis, we are
    always either returning the ball or receiving it from the other player, enacting
    a give and take. In a conversation, what moves back and forth is awareness and
    attention. These can bounce between people, or pool on one side of the conversationconversation.
    For our purposes, you can guess which kinds of behaviors we want to orient toward.
    Let’s look at some examples of both in conversation.


    Let’s first look at support responses, which are what they sound like: words or
    behaviors that support the expression of the other person in the conversation.
    For the active, attention-giving variety, a “*support response*” maintains attention
    on the speaker and their topic—for example, asking a question about what’s been
    said. Support responses can be simple acknowledgments (“Oh really?” “Uh huh”),
    positively supporting (“that’s great!”), or in question form (“What did you say
    then?”). You can imagine the other person’s story is a balloon that everyone else
    is trying to keep aloft, jumping in here and there to bounce it back up into the
    air. For instance:


    “I love French films.”

    Response: “Which is your favorite?”


    The above response only exists to maintain attention and awareness on the original
    speaker. The response doesn’t interject any new information of its own, but encourages
    the flow of attention already unfolding. Obviously, this can make people feel,
    well, supported! This is a great way to validate your conversation partner, let
    them know you’re listening, and send a strong message that you value what they’re
    saying and want to hear more.


    The “*shift response,*” however, is an active attention-seeking response that
    shifts the attention to the other person, in other words back to themselves. It’s
    an act of grabbing the spotlight and pointing it in the opposite direction. With
    a shift response, the flow of attention and awareness is suddenly diverted elsewhere.
    What’s going on when you see two people vying for attention and talking over one
    another? Their dialogue is made exclusively of aggressive shift responses!


    “I love French films.”

    Response: “Yeah? I’ve never cared much about movies. The other day, actually,
    I saw this thing at the cinema…”


    This isn’t to say that shift responses are always wrong—in context, they can work,
    especially if the other person subtly reclaims attention again. Sometimes it might
    even behoove you to use more shift responses to grab some of the spotlight, or
    make your feelings known. But how much are you using them?


    A shift response is a great idea if you want to move the chat along to another
    topic, or inject some fresh energy or ideas into the conversation. It’s a bad
    idea if you are simply trying to derail the existing conversation in your favor,
    so you can say what you want to say. Many people get together and talk this way,
    each announcing a different personal anecdote that begins with a shift response.


    If you have two people with poor listening skills, and both are hell-bent on shift
    responses, you end up with a wrestling match for attention, rather than a conversation.
    Maybe both parties are satisfying their lust for expression, but their gas tanks
    for being heard are running on empty. You may not notice if you are locked in
    this type of battle, but from the outside looking in, observing this kind of interaction
    can be curious and confusing.


    Moreover, if a bad conversationalist (someone who continually uses shift responses)
    is paired with a very empathetic listener (someone who continually uses support
    responses), one party may well feel as though they’re having a good talk because
    the other person is consistently offering them support responses, while that person
    actually wants to jump off a bridge because the conversation is turning into an
    awkward pseudo-lecture on the other person’s life and beliefs.


    What about passive conversational narcissism? Naturally, some people are still
    quite aware of social norms and etiquette and so will vie for attention in subtle
    ways. One way of doing this is to fail to offer support responses, waiting till
    the other person’s thread dies away and you can take the limelight. Here, you
    are hoping that the other person runs out of steam so you can finally get your
    word in. It is like sitting in a tree and waiting for the prey to get tired and
    go to sleep—you know it will happen eventually, so you passively bide your time.


    Have you been part of a conversation where the other person didn’t offer any support
    responses, even a quaint “Oh really?” or “Uh-huh”? You’re not quite sure whether
    they’ve taken in what you’ve said, and that may be intentional on their part.
    It may have been a case of passive conversational narcissism. It’s like letting
    that balloon drop to the floor. You don’t have to do much to make someone feel
    that they’t really landed!


    Most of us are taught that it’s polite to not ramble on, to take your turn and
    then rest, to share space in conversations. Fine, this person will follow those
    basic rules. But encourage someone to speak more, lest it cut into their speaking—and
    this is where the narcissist steps back into the picture.


    Though it’s tempting to try to catch other people in the act of narcissism, it’s
    far more productive to learn to notice it in *yourself* and guard against it.
    You can’t control what others do, but you can control your actions and how good
    of a listener you are. After all, that is the goal of this book. For the other
    purpose, you may want to seek a book on persuasion or hypnosis.


    The irony is it’s often those who are able to listen well, to step aside, and
    to take a genuine interest in conversation partners who become people we think
    of as interesting, charismatic and worthy of our attention in the first place.
    So the purported goal of narcissism (*making darn sure that people know things
    about you*) isn’t even satisfied. Luckily, there are a few guidelines to battle
    these unconscious obstacles you’ll undoubtedly face.


    To do this, you first need to be aware of your focus and where it’s going. Pay
    attention to how the airtime is being distributed. Is one person doing all the
    talking? Is there a back-and-forth? This requires more than just playing at interested
    in another person’s life—you genuinely need to forget yourself for a moment and
    engage fully, and honestly, in what someone is saying. Stop thinking about your
    response for the future, and pay attention to what someone is currently saying
    to you.


    This means no rushing in to explain or frame what they’ve said so that it relates
    back to you. Give more supportive responses, and guard against constantly referring
    every topic back to yourself. Ask questions to invite the other person to say
    more. If you take attention for a while, enjoy it—but volley it back again. Like
    we were taught as children: It’s good to share!


    “As you were talking, it made me think about this experience I had once, where
    XYZ. That made me wonder, did you find that XYZ was the case as well?” A person
    saying this demonstrates that they’re willing to share the conversation, rather
    than hog it all for themselves.

