    overshadowed or outright contradicted by what is meant to be interpreted


    between the lines. What we say is not really what we mean most of the


    time, and this is something we begin to learn as children. It’s not that the


    words we use don’t matter—they do. But the way in which we use them,


    and the contexts we use them in, are far more indicative of our feelings and


    emotions.


     


    Unfortunately, for many of us, these small signs might as well be


    incantations for magic spells based on how subtle or convoluted they seem.


    One of the keys to communicating more clearly and being able to read


    between the lines of what people say is to understand *subtext*. To borrow


