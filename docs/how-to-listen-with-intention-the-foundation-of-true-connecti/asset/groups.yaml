    **People, Emotion, and Heart**


     


    Psychologist Larry Barker proposed four different communication styles,


    based on people’s preferences, personalities and the purpose of their


    conversation with you. When we consider the conversation that started out


    the chapter, we can plainly see that we must understand and tailor our


    communication style to that of other people in order to listen more


    effectively.


     


    Intuitive readers will immediately see the two different styles of the people


    speaking in the example above. What made them so different? Why didn’t


    they seem to “get” one another?


     


    Barker’s first approach is the “**people-oriented**” style, which, as it sounds,


    is a listening style that pays attention to people as a whole and their


    feelings. These are cooperative, collective-minded people who try to


    understand others, have empathy, and develop cohesion and harmony in a


    group. While going too far in this can be a problem (i.e. being a bit


    irrational, getting carried away with emotion, violating boundaries or


    getting overwhelmed), for the most part this is a great style to adopt if your


    goal is to connect interpersonally, and improve relationships of all kinds.


     


    In our example, X was communicating an *emotional* story—it involved


    their feelings about an event, and they were seeking empathy,


    understanding and a witness for these emotions. They were operating on a


    very particular plane of experience—one where the point of their story was


    their feelings, and the goal of telling the story was to get these feelings


    acknowledged and validated.


     


    However, Y was not people oriented, but what’s called “**content-oriented**”


    in their listening style. When these people listen, they are homing in on


    facts, data and *what* is said, rather than how it is said or who is saying it.


    They may seek to confirm the credibility of the speaker rather than offer


    support and compassion—after all, in their mind, the purpose of the


