    action, and the heart, well, that’s all about emotion and people’s well-being.
    Again, recognize where you are, and how to move toward people/emotion/heart styles
    of listening.


    Frames are a different way to imagine listening styles. Frames are much more fluid,
    and simply ask you to consider what someone’s overall goals or purpose for the
    interaction is. What is theirs, what is yours, and do they match? If not, utilize
    your new understanding and make them match. An easy way to think about frames
    is in terms of an acting scene. All the actors are on the same page, working toward
    the same goal, and trying to capture an emotional payoff. What happens if one
    of the actors wants to wing it for a bit, and expound on their character’s love
    of the sea? Nothing good.


    Finally, we get to levels of listening. Unlike listening frames and styles, some
    of these levels of listening are just plain bad. The levels are: ignoring, pretending
    to listen, selectively listening, attentively listening, and empathetically listening.
    The first two levels are not very useful, and it’s only when we reach the ultimate
    level of empathetically listening that we remove ourselves from the equation and
    listen to hear rather than listen to reply. Most of us are stuck in the first
    three to four levels for the majority of our day-to-day interactions.


    ## Chapter 3. The Tough Work of Hearing Someone


    Two people are in a coffee shop, “catching up” after a long time not chatting,
    and discussing this and that.


    Angela: “I’ve tried to talk to him so many times about it, but I have to say,
    he doesn’t really seem to *get* it, you know?”


    Kristen: “Well—what do you mean? What doesn’t he get?”


    Angela: “It’s like… I heard someone say once that a woman becomes a mother the
    moment she knows she’s pregnant, but a man only becomes a dad once the baby is
    born. I feel like that. Like maybe he’s not caught up yet…”


    Kristen: “Like he’s not on the same page as you…”


    Angela: “Exactly. And I feel like it’s all still just abstract for him, like it
    hasn’t really sunk in yet. I mean, I sympathize, but, I don’t know...”


    Kristen: “Oh, I hear you. Seems like you sympathize but there’s also something
    else.”


    Angela: “There is. I guess I’m a bit disappointed? Maybe I’m just scared that
    I’m actually going to be doing this all by myself, and that’s not what we agreed
    to. That’s *not* what I thought we were doing. We’re a team.”


    Kristen: “You thought you guys were… kind of in this together.”


    Angela: “Yes. But when I talk to him… it doesn’t feel like that. Like he’s kind
    of making it like *I’m* pregnant and he’s just kind of a spectator. I mean, I
    don’t want to speak badly about him…”


    Kristen: “Of course not! It seems like this is not an easy thing to talk about.”


    Angela: “Well what could I say? I think deep down I’m just… he can leave at this
    point, you know? And I’m the one that’s *really* doing this. Does that make sense?”


    Kristen: “Oh, completely. Do you think it’s that you’re worried about him leaving?”


    And so on. In the above conversation, both people are spending almost equal time
    talking, yet one person is definitely speaking and expressing while the other
    is definitely listening—actively. If you go back and look at the conversation
    again, you’ll see that the listener is more or less repeating the same content
    back to the speaker, albeit rephrasing the information, sometimes framing it as
    a question, or simply offering encouragement and support (“Oh, I hear you”).


    Not much is actually being said, but it’s eliciting a large response and a certain
    kind of elaboration that shows comfort and emotional fulfillment. The key is that
    the speaker can truly feel they are being heard, and this is part of what we do
    when we’re listening—not just staying silent.


    The speaker in this conversation likely feels extraordinarily heard and supported
    in this conversation. The other person is giving them their complete attention,
    not merely hearing but engaging deeply with the content—both factual and emotional—of
    what’s being said. Instead of interjecting with their own ideas, however, the
    listener is skillfully reflecting and summarizing what they’ve been told. Importantly,
    this is not just parroting what has been said, word for word. The listener also
    occasionally “tests” their comprehension—“it sounds like you mean such-and-such,
    is that the case? Have I understood?”


    This communicates loud and clear that the listener’s goal in the conversation
    is to understand the speaker deeply. In fact, it’s almost as though the listener
    is actively helping the speaker make their point, using cues and guiding them
    along. Such conversations can often lead to deeper insights and understandings,
    the kind of talk that leaves people feeling understood, connected, and like they’ve
    actively tackled some problem or issue. You may feel like you are giving someone
    your full attention, but unless you’re participating in a way that makes them
    feel this attention, then it’s as good as not happening.


    This is the “big talk” (versus small talk) that brings people closer together.
    When two good conversationalists encounter one another, they can take turns actively
    listening, and rather than the conversation being an exercise in ego, attention
    seeking, arguing or petty small talk, it becomes a platform to establish meaningful
    connections, enjoy the company of another person, solve problems, and dig into
    the juicy topics of life.


    In fact, even though this is “big talk,” you can see that it has the ability to
    cut to the heart of the matter in very few words. An hour of “small talk” about
    nothing might have never come close to this level of deep understanding and connection.


    Perhaps the above conversation reminded you of what a good psychologist might
    do, and indeed this method was explored in depth by the famous psychologist Carl
    Rogers. He believed that “unconditional positive regard” in a therapeutic encounter
    as well as active listening and reflection were the keys to transformative conversations—and
    therapy is, in the end, simply a kind of conversation.


    ## Active Listening


    Listening is not passive. Many people resist listening because they frame it as
    unwanted relinquishing of the stage, as boring role in the story, where they have
    to sit out and wait for the other person to give them. They think of listening
    as dead space, doing nothing. This is a disastrous mindset because conversations
    only work when both people are actively involved. The mistake is to think that
    talking is somehow more interesting or more active than listening. Nothing could
    be further from the truth. And again, taking the spotlight is a completely different
    goal from connecting with someone.


    Exceptional listeners know something that poor listeners don’t—that it is just
    as enjoyable to hear someone and share as it is to talk, maybe even so. It can
    be just as satisfying, if not more, to crack someone open and get true emotion
    flowing. Work doesn’t have to be as boring as sitting quietly and nodding your
    head. It can be quite active, and almost like unraveling a riddle—if you can use
    the right responses. That’s exactly what active listening is.


    We talked in the previous chapter about five levels of listening. How do we reach
    the ultimate level? Just as learning to read and write takes practice, so does
    the art of active listening.


    Active listening is one of the strongest relationship-building skills you can
    have in your arsenal. It establishes respect and concern for your partner’s viewpoints
    and makes it easier for you to process information that is intricate and difficult
    to understand through passive listening. It also eases the communication process:
    active listening helps you learn what the other person’s needs are, and therefore
    makes you less cautious and more open with your responses.


    Perhaps above all else, active listening makes it clear and certain that you *are*
    comprehending your conversation partner. They know that you’re right there with
    them. At the same time, we have to push our ego out of the way so we can truly
    access what the other person is saying. We call this process “active” listening
    because it engages so many parts of our mind and makes us *do* something to understand
    what is being communicated.


    Therapists (good ones, at least, unlike the one mentioned earlier in this book)
    are excellent models of how to be an active listener. They listen to their clients
    with a purpose. If there’s something they’re hearing that they’re not sure about,
    they encourage their clients to be clear and deliberate. These therapists try
    to restate their patients’ statements and ask them to elaborate on what they mean.
    Above all, they try to make their clients feel calm and safe about communicating
    through contemplation, clear body language, and a spirit of empathy. Therapists
    are driven by a very clear goal of hearing their out, and their every response
    is informed by this goal. Can we say the same about ourselves when we are trying
    to listen to others?


