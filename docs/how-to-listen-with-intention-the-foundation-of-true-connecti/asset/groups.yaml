    The listener above offers advice, and tries to cheer up the speaker with glib


    suggestions, as though they were standing far off from the speaker’s pain,


    unwilling to really acknowledge it or get too close. The relentless focus on


    positivity ironically only emphasizes the negativity—and the speaker may


    feel sadder and more alone after this conversation than they did before.


     


    To use empathy wisely, try to listen without judgment—easier said than


    done. Don’t interpret or explain, don’t theorize or justify. Don’t take


    responsibility for making the other person feel better, don’t blame, don’t


    feel guilty. You might ask: well, what’s left to do? That’s simple: just listen


    and accept what is being said.


     


    Be curious about what’s actually being communicated, take your ego out of


    the picture for a while, and simply witness what’s being said, without


    rushing through the conversation. Be present and try to *understand* where


    the speaker is coming from, emotionally. If anything else needs to be


    addressed, the time will come, but we usually want to leap ahead a few


    steps in the process and that leads to the feeling of being unheard.


     


    Don’t get stuck on the facts or the logical argument of what’s being


    presented, but listen instead with your “heart” and hear the emotional


    content. How is the speaker feeling? What are their desires, fears, needs?


    Completely forget about who is right and who is to blame. “Get into the


    hole” with them, alongside them. You don’t have to become overwhelmed


    with their emotions, but you can certainly try to see things through their


    eyes for a while. True understanding can feel so much better than advice or


    problem-solving—which often just misses the point.


     


    To be an empathic communicator is to be emotionally mature in yourself


    and comfortable with emotions, whatever they are. It’s the ability to be


    vulnerable enough to feel, rather than run away from feelings, grasp at


    solutions or avoid discomfort at all costs. In fact, the better you’re able to


    tolerate your own discomfort without rushing in to fix or deny it, the more


    you’ll be able to offer this to others.'
