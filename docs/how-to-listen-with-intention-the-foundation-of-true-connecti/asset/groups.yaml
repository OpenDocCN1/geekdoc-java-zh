    **Validate**


     


    When we think about empathy, withholding judgment, and simply ceding


    the floor to others, once again, it’s not a completely passive activity.


    Just like active listening, this process of making people feel heard contains


    several different layers. **Validation** is the verbal affirmation and acceptance


    of the emotions and viewpoints of someone we’re communicating with.


    Validation is the message that someone’s experience and reality is valid,


    whatever it is. For our purposes, it’s truly an extension of deep listening and


    being mindful of both the conversation and the meta-conversation that is


    occurring in front of us.


    Normal listening takes care of the conscious conversation level, but


    validation satisfies an emotional need (the meta-conversation) that is


    presented any time anyone opens their mouth. Often, validation is the most


    fundamental reason why people seek conversation in the first place. Though


    it may seem otherwise, they are not looking for solutions, arguments or


    explanations. They just want someone to confirm for them that they are not


    bad or wrong or strange or alone for feeling as they do.


    At first glance, validation might seem like a fairly simple concept of


    nodding and saying yes when people want you to (not very distinguishable


    from active listening, even), but even though it sounds relatively


    uncomplicated, there are right and wrong ways to validate.


    Validation is one of the more powerful give-and-take practices of


    communication because it establishes respect between two people, whether


    they’re old friends or strangers. Shutting down someone’s feelings—even if


    they’re repellant to us—effectively closes those floodgates off and isolates


    *both* sides of the exchange, putting the relationship at risk.


    Genuine validation, on the other hand, helps everybody in the


    communication process score a win. The receiver gets a confirmation of


    their humanity, but the giver also enriches their own stature and enhances


    their sense of self-worth. Generosity, trust, and eagerness to confide


    emerge, and communication rarely goes wrong when all those elements are


    working.'
  - '[PAGE 81]


    Going beyond this, people who feel themselves validated are far more


    likely to want to open up and listen to *you*, and return that same sense of


    validation. In today’s world, where people are more divided than ever,


    mutual validation can be the first step to healing some pretty deep rifts, and


    undoing the disconnection that comes with conflict or misunderstanding.


    Studies summarized in a 2010 article from the University of Rochester


    highlighted the positive and subtle effects the act of validation has in a


    successful relationship. It’s not just a way of paying attention to people or


    showing respect for people’s wishes. That is the lowest-hanging fruit that


    needs to be picked, but true validation goes far deeper in making people


    feel embraced and heard.


    In one study, a selection of participants was instructed to concentrate on the


    best experience they’d had in the previous three years. Then they were


    matched with another person and encouraged to tell them about that


    experience. Unbeknownst to them, that other person was not a subject in the


    study but someone (a “confederate,” as the researchers put it) who’d been


    trained to respond in a favorable way to their experience.


    Other participants in the study were matched with confederates under the


    pretense that they too were just participants in the study. Instead of talking


    about their positive experience, though, they participated in a “fun” activity


    that involved drawing.


    The feedback from the respondents after the third experiment showed an


    interesting split. Subjects who took part in the fun activity reported liking


    their partners more and that they’d enjoyed their time with them more than


    those who’d only spoken with them. But those who had discussed their


    experience and gotten a supportive response reported that they *trusted* the


    other person more and that they were more likely to be open with their


    private thoughts and feelings with those confederates.


    These affirmations caused test subjects to feel even better about their


    positive experiences. They felt more assured about the daily, basic


    structures of their lives and generated a large amount of goodwill in return.


    They got another level of satisfaction and value on top of the original


    experience—all from a somewhat simple act of validation.'
- md: "\nIt’s important to note that the positive events the subjects were talking\
    \ about were not all major milestones that are commonly validated on a mass level—positive\
    \ life-changers like graduation, marriage, or childbirth. Most of them were simply\
    \ happy experiences or interactions, things that take place every day. But the\
    \ validation of these smaller events was just as significant to the subjects,\
    \ if not more. Hearing supportive remarks about them fostered conditions of trust\
    \ and confidence, not to mention generosity in return.\n\n## Two-Step Emotions\n\
    \nAny verbal interaction looks simple on paper, but sometimes we can get tripped\
    \ up on execution. Validation is no different: there are components one must include\
    \ to make it felt. When someone confides in us or expresses a certain immediate\
    \ emotion, they’re looking to have that emotion processed and accepted by whomever\
    \ they’re talking with. That doesn’t always happen.\n\nThere are two main components\
    \ of an act of validation that define its success.\n\n- *Identifying the emotion*.\
    \ While recognizing our own emotions is a crucial part of our personal mental\
    \ health, being able to do so with someone else is a big plus in our relationships\
    \ and social health. The ability to verbalize our interpretation of our partner’s\
    \ emotions—*before* they have to come right out and say “I’m angry” or “I’m sad”—opens\
    \ the door to a positive validation. It shows that we’re keyed in on what they’re\
    \ communicating, that we’re really listening and not just hearing.\n\n  “I can\
    \ see how upset this has made you.”\n  “I wonder if you’re feeling overwhelmed\
    \ right now.”\n  “Do you think it’s fair to say that you’re feeling conflicted?”\n\
    \n- *Justifying the emotion.* Once we’ve identified what our communication partner\
    \ is feeling, the next step is proclaiming it as a proper—or at least very understandable—emotional\
    \ reaction: “Why, if *I* was in your shoes, I’d feel the same way too!” This establishes\
    \ a sense of commonality, that our partner’s sentiments are exactly what rational\
    \ people would feel under the circumstances. It communicates that you are feeling\
    \ the same emotion they are and emphasizes that the way they feel and think is\
    \ justified.\n\nMore than this, it tells the other person that the way they feel\
    \ makes sense, and is a sound, justifiable response. Granted, the emotions they’re\
    \ experiencing might not be positive, but that doesn’t mean they’re wrong to feel\
    \ them.\n\n  “I can totally see where you’re coming from.”\n  “When you explain\
    \ it like that, it makes sense that you acted that way.”\n  “I’m not surprised\
    \ you’re feeling exhausted.”\n  “Your opinion is completely normal and understandable!”\n\
    \nJustifying your partner’s feelings is a much more important component than instantly\
    \ offering advice on what to do. They want to feel that you empathize with their\
    \ plight first, before hearing what corrective measures they should take – if\
    \ they want to hear these at all.\n\nWithout first acknowledging their emotions,\
    \ even well-intentioned or accurate advice would simply infer that the speaker\
    \ has been doing something wrong or that their emotional status is primarily their\
    \ fault. Before giving advice, we need to connect with them on a sympathetic,\
    \ emotional level. That will make working through a solution much easier and more\
    \ supportive later. Oftentimes the act of validation, not advice, is really what\
    \ people are seeking in an interaction. They already *know* what they have to\
    \ do, they just want someone else to hear their experience, and reflect it back\
    \ to them.\n\nThis tells us emotional support is more important than having a\
    \ to-do list to fix someone’s circumstances or feelings; indeed, feeling better\
    \ about something is *far more* important than knowing what to do about it.\n\n\
    How do these two components work in real communication? Let’s first imagine a\
    \ scenario that *doesn’t* work:\n\n- Partner 1: “I can’t believe this! I’m getting\
    \ heat at work for something my boss told me to do! I knew it was a bad idea,\
    \ I protested it, they forced me to do it, it messed things up royally, and now\
    \ my boss told me I’d have to work overtime this weekend to put everything back\
    \ the way it was!”\n- Partner 2: “I told you that place was a disaster before\
    \ you took the job. You shouldn’t be surprised this is happening.”\n- Partner\
    \ 1: “Gee, thanks for making me feel worse.”\n- Partner 2: “I’m not the one who\
    \ wanted to go into the funeral home business. Don’t look at me. Why don’t you\
    \ look for another job?”\n\nWhat’s wrong with Partner 2’s response? Just about\
    \ everything. Partner 1 was upset at what they perceived as an unfair situation.\
    \ They felt upset that they weren’t taken seriously at work and then got shafted\
    \ when things went wrong. Partner 2 is essentially doing the exact same thing.\
    \ By reminding Partner 1 that “I told you so,” Partner 2 isn’t taking their feelings\
    \ seriously either. They judge Partner 1 for making the wrong choice to begin\
    \ with and imply they shouldn’t feel upset because, essentially, they made their\
    \ bed and have to lie in it.\n\nHere’s another example:\n\n- Person A: “Well,\
    \ that producer got back in touch with me and he says they’re very interested\
    \ in my track! It’s so amazing! I’ve never been more excited in my life!”\n- Person\
    \ B: “Woah, woah, slow down there. What did they say exactly?”\n- Person A: “They\
    \ said they want to hear the full album next month! I’m shaking!”\n- Person B:\
    \ “Wait, next month? That’s impossible, how are you going to finish?”\n- Person\
    \ A: “I don’t know, but I’m just so happy right!”\n- Person B: “You’re going to\
    \ be stuck in the studio for weeks. This is going to be stressful.”\n\nWhat’s\
    \ wrong with Person B’s response? Just about everything. Person A is sharing joy\
    \ and excitement, but Person B is immediately pivoting to potential stress and\
    \ logistics. Person B is invalidating the positive emotion by focusing on the\
    \ negative implications.\n\nLet’s take a look at these exchanges, which are much\
    \ more on the mark:\n\n- Partner 1: “I can’t believe this! I’m getting heat at\
    \ work for something my boss told me to do! I knew it was a bad idea, I protested\
    \ it, they forced me to do it, it messed things up royally, and now my boss told\
    \ me I’d have to work overtime this weekend to put everything back the way it\
    \ was!”\n- Partner 2: “Did they really do that? No! That’s infuriating! I’d be\
    \ livid about it too.”\n- Partner 1: “I just feel like I don’t have any control\
    \ over my own destiny.”\n- Partner 2: “That must be really disheartening. I don’t\
    \ see how anyone would feel otherwise, especially at work.”\n\nIn that exchange,\
    \ Partner 2 does a much better job of validating Partner 1. They’ve identified\
    \ the emotion Partner 1 is feeling, namely fury (“That’s infuriating!”). They\
    \ then established the emotion as proper or understandable and exactly the way\
    \ people would feel in situation (“I’d be livid about it too”). Partner 2 then\
    \ repeats the process in the last statement: Partner 1 feels “disheartened,” and\
    \ anyone in those circumstances would feel the same.\n\nNote that in the second\
    \ exchange Partner 2 does not try to fix the problem or even necessarily take\
    \ steps to make Partner 1 feel *that* much better. Partner 1 needs to feel enraged\
    \ at the moment; it’s a justifiable emotion. What’s more important is that Partner\
    \ 1 feels validated in their response, that they’re understood and empathized\
    \ with. That reinforces the quality of communication. If there happens to be a\
    \ way Partner 2 can effectively offer help or work through a solution later, great.\
    \ But without a sense that the partner’s feelings are valid, that effort won’t\
    \ amount to much.\n"
  mdcn: "\n\n需要注意的是，受访者所谈论的积极事件并非都是在大众层面被广泛认可的重大里程碑——例如毕业、婚姻或生育等能改变人生的重大积极事件。其中大多数仅仅是快乐的经历或互动，是每天都会发生的小事。但对受访者来说，这些小事件的认可同样重要，甚至更为如此。听到对这些事的支持性评价有助于营造信任和自信的氛围，不用说随之产生的慷慨。\n\
    \n## 两步情绪\n\n任何口头互动在理论上看起来都很简单，但在执行过程中我们有时会碰绊子。认可（Validation）也并不例外：要让对方感受到认可，必须包含某些特定的要素。当有人向我们倾诉或表达某种即时情绪时，他们希望与其交谈的对象能够处理并接纳这种情绪。这并非总是会发生。\n\
    \n认可行为有两个定义其成败的两个组成部分。\n\n- *识别情绪*。虽然识别自己的情绪是个人心理健康的关键部分，但能够与他人做到这对我们的人际关系和社交健康是一个巨大的加分项。能够用语言表达我们对伙伴情绪的解读——*在*他们不得不直接说出“我很生气”或“我很难过”之前——就为积极的认可开启了大门。这表明我们在关注他们所传达的信息，我们在倾听，而不仅仅是听到。\n\
    \n  “我能看出这件事让你有多么不开心。”\n  “我在想你现在是不是觉得压力很大。”\n  “你觉得说你现在感到很矛盾是公平的吗？”\n\n- *证明情绪合理性*。一旦我们识别了交流伙伴的感受，下一步就是宣布这种情绪是完全合理的——或者至少是非常可以理解的情绪反应：“天哪，如果*我*处在你的位置，我也会同样的感觉！”这建立了一种共性感，即伙伴的情绪完全是理性人在那种情况下会产生的感受。它传达了你感受着与他们相同的情绪，并强调了他们的感受和思考方式是合理的。\n\
    \n不仅如此，它还告诉对方他们的感受是有意义的，并且是一种健全的、有理可据的反应。诚然，他们正在经历的情绪可能不是积极的，但这并不意味着产生这些情绪是错误的。\n\
    \n  “我完全理解你的感受。”\n  “听你这么解释，你采取那样做法是有情合理的。”\n  “我不奇怪你会感到精疲力竭。”\n  “你的观点完全正常且可以理解！”\n\
    \n证明伙伴的感受比立即提供关于该做的建议要重要得多。他们希望先感受到你对他们的困境产生了同理心，然后再听取他们应该采取什么纠正措施——如果他们真的想听的话。\n\
    \n如果不先承认他们的情绪，即使是意图良好或准确的建议，也仅仅是在暗示说话者做错了什么，或者他们的情绪状态主要是他们自己的错。在给出建议之前，我们需要在同情和感性的层面与他们建立联系。这会让日后寻找解决方案变得容易得多且更有支持。很多时候，人们在互动中真正寻求其实是认可，而不是建议。他们已经*知道*自己该做什么，他们只是希望别人听听他们的经历，并将其反映给他们。\n\
    \n这告诉我们，情感支持比拥有一份待办清单来改变某人的处境或感受更重要；事实上，对某事感觉好一些要*重要得多*于知道该怎么办。\n\n这两个组成部分在现实沟通中是如何运作的？让我们先想象一个*行不通*的场景：\n\
    \n- 伙伴 1：“我不敢相信！我正因为老板让我做的一件事而在公司里受气！我就知道那是个坏主意，我抗议过，他们强迫我去做，结果搞得一团糟，现在老板又告诉我我这周末得加班把一切都恢复原状！”\n\
    - 伙伴 2：“在你接那份工作之前我就告诉过你那里是个灾难了。你不应该对这种事的发生感到惊讶。”\n- 伙伴 1：“噢，谢谢你让我感觉更糟糕了。”\n- 伙伴\
    \ 2：“又不是我想去搞殡仪业的。别看着我。你为什么不去找另一份工作呢？”\n\n伙伴 2 的回答哪里错了？几乎处处都是问题。伙伴 1 对他们认为不公平的局面感到不快。他们为自己在工作中没有被认真对待感到难过，接着在事情搞砸后被坑了一把。伙伴\
    \ 2 本质上在做完全相同的事情。通过提醒伙伴 1 “我早就说过了吧”，伙伴 2 也没有认真对待他们的感受。他们评判伙伴 1 从一开始就做了错误的选择，并暗示他们不应该感到难过，因为本质上他们是自作自受。\n\
    \n这里是另一个例子：\n\n- 人物 A：“好，那个制作人联系我了，他说他们对我的曲子非常感兴趣！太棒了！我这辈子从未像现在这么兴奋！”\n- 人物 B：“哇，哇，慢点。他们具体说了什么？”\n\
    - 人物 A：“他们说想在下个月听完整专辑！我都要发抖了！”\n- 人物 B：“等一下，下个月？这不可能，你怎么能做完？”\n- 人物 A：“我不知道，但我现在就是好开心啊！”\n\
    - 人物 B：“你会在录音室里被上几周。这压力很大。”\n\n人物 B 的回答哪里错了？几乎处处都是问题。人物 A 正在分享快乐和兴奋，但人物 B 立即转向了压力问题。人物\
    \ B 通过关注负面影响否定了这种积极的情绪。\n\n让我们来看看这些对话，它们要切中要得多：\n\n- 伙伴 1：“我不敢相信！我正因为老板让我做的一件事而在公司里受气！我就知道那是个坏主意，我抗议过，他们强迫我去做，结果搞得一团糟，现在老板又告诉我我这周末得加班把一切都恢复原状！”\n\
    - 伙伴 2：“他们真的那样做了吗？不！这太气人生人了！如果我是你，我也会生气的。”\n- 伙伴 1：“我觉得我对自己的命运没有任何控制权。”\n- 伙伴\
    \ 2：“这一定很令人沮丧。我不认为别人会有别的想法，尤其在工作中。”\n\n在那段对话中，伙伴 2 在认可伙伴 1 方面做得得多。他们识别了伙伴 1 感受到的情绪，即愤怒（“太气人生人了！”）。随后他们证明了情绪是合理的或可以理解的，并且是人在那种情况下会产生的感受（“我也会生气的”）。伙伴\
    \ 2 在最后的陈述中重复了这个过程：伙伴 1 感到“沮丧”，在那种情况下没有人会有别的想法。\n\n"
