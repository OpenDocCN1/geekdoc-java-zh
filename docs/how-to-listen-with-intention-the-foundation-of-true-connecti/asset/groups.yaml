    As you can see, “judgment” can often be subtle, well-intentioned and hard


    to pinpoint. In the above conversation, it’s tricky to see where things could


    have gone better, and Person A is likely to feel OK about the exchange if


    not thrilled with how supportive B was. Person B wasn’t outright


    contradicting, insulting or denying what Person A was sharing—they just


    squeezed in their own viewpoint instead of acknowledging and reflecting


    the one shared with them. (For example, B could have said something like,


    “It seems like you’re pretty worried about her biting off more than she can


    chew, huh?”)


    Is this terrible? Of course not. Maybe Person A and Person B talk this way


    with each other all the time. They might be perfectly comfortable with


    giving and hearing each other’s advice and might even welcome it. But


    Person A *could* have taken Person B’s suggestion as a form of invalidation.


    Person A was in the midst of expressing her emotional state and may not


    have been finished—they could have interpreted Person B’s advice as a


    forced solution intended to stop the conversation.


    It all depends on how secure and close their relationship is and what


    boundaries they’ve set up for themselves in communication. Attentive


    listening is very good. Responses like Person B’s aren’t criminal and


    hopefully don’t result in a spell of eggshell-walking when they’re trying to


    figure out what to say. These potentially invalidating responses are just


    something to be aware of, think about, and consider in advance of the


    communication.


    **5\. Empathetic Listening**


    This is both the final, most desirable level of listening and the polar


    opposite of the first level of ignoring. In empathetic listening we give all


    our attention to the person we’re talking to. We’re not just zeroed in on


    what they’re saying—we’re putting ourselves in their shoes. We’re not


    theorizing what *we* would do or feel in their situation; we’re making a


    strong effort to understand where they’re coming from.'
  - '[PAGE 50]


    In empathetic listening we react as though we’re hearing our partner’s story


    for the first time, even if it’s something we’ve talked about before. We treat


    it as new and unusual information that doesn’t pass through our own


    judgments, values, opinions, or frames of reference. It’s not an easy level to


    achieve and requires discipline. But it’s the most rewarding for both


    conversation partners.


    *Person A: *I know we’ve talked about this before, but Chris is really


    getting to me. He’s been impossible to deal with the last couple of


    weeks and I’m not sure what to do about it.


    *Person B:* What is happening?


    *Person A:* He’s remote. He’s emotionally distant. He’s been staying


    out late most nights, and when he doesn’t he locks himself into his


    study and shuts himself off.


    *Person B:* You must feel extremely lonely.


    *Person A:* Yeah, but more to the point, I just feel like I’ve been left


    out to dry. We’ve been together seven years and this sudden change


    just came out of nowhere. I’m confused. I don’t know what brought it


    on. I don’t know if he’s hiding something from me or whether this is


    just what longtime couples go through.


    *Person B:* You must be struggling to endure under that kind of


    mystery.


    *Person A:* Yeah, I am. If I could get any clarity from him on the


    situation, it would be helpful. I don’t know; we’ll see.


    In this example, Person B takes themselves out of the story completely.


    They start off by prompting Person A to confide in them. Then they try to


    imagine the emotional and mental state Person A is going through without


    making themselves the subject.


    That’s why Person B says, “*You must feel *extremely lonely” rather than “*I*


    *would feel *extremely lonely”—a small, maybe imperceptible difference in


    syntax, but one that reinforces that Person A is the subject of the exchange


    and that Person B is giving them their full focus.'
