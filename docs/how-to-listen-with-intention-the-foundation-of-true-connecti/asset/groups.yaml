    However, what keeps this level from being five-star, fully focused listening


    is our analytical and judgmental mind. While the other person speaks, we’re


    comparing their statements to our own points of view, deciding whether


    we’re in agreement with them or not, like someone on a debate team. This


    is more than fair in a two-way conversation where both parties are expected


    to provide equal exchange. But the fact that we’re still assessing our partner


    with our own reason and logic keeps it from becoming pure listening:


    *Person A: *My mother is starting an online business.


    *Person B:* Doing what?


    *Person A:* Selling some of her homemade crafts. She thinks she can


