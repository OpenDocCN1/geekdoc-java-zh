    -   *探究。* 不要听起来像个咄咄逼人的审讯者，尝试提问一些引导性的问题，以从对方那里引导出更深层次的理解和意义。大多数人喜欢被问一些组织得体且不过分自妄的问题。当你进行探究时，可以尝试猜测他人的感受、反应和欲望。这种预测显示出你非常投入，以至于想要和他们一起跳到结论，并顺着他们的思路走下去。你不仅与他们同在场，你还沉浸在他们的情绪中。


    -   *你：* 当那个女人在超市责备你的孩子时，你感觉如何？你当时*真的*想怎么回应？


    -   *沉默。* 时候，恰到好处的沉默比用冗余的话语填充空白更有意义。沉默可以给每位参与者一个短暂的时刻来整理心情和思考。它还有助于缓解激烈或无果互动中可能产生的紧张气氛。


    -   *对方：* 就在*那时*，我决定跳伞不是我的菜，尤其是和工作有关的时候。


    -   *你：*


    -   *不要说教、提供不自请的建议或轻率地安抚。*没有人喜欢被置于次于别人的地位，在交流中，这可能会让说话者想要停止进一步讨论。


    -   *对方：* 最糟糕的是，他总是忘了把马桶盖盖上。


    -   *对你进行说教：* 你从一开始就不该让他进你的浴室。


    -   *对你提供不请求的建议：* 你应该把浴室锁起来，直到他同意你的要求为止。


    -   *轻率地安抚你：* 别担心！明天又是充满无限可能的美好的一天。


    -   *提问引导性和开放式问题。* 为了表现你关注伴侣的福祉，针对他们的经历问一些非非黑即白的问题。这些问题显示出你准备好听取信息，而且你感兴趣的不仅仅是某个情况的数据或事实。


    -   *对方：* 所以在花了几百美元后，我决定，也许平行停车是我们需要必须多加努力才能学会。


    -   *你：* 那让你感觉如何？你的学习计划是怎样的？你打算在哪里练习？你希望从中获得什么？


    积极倾听需要大量的耐心工作和练习，即使对于擅长此道的人来说也具有挑战性。但它在营造真正理解的氛围、更顺畅的信息流以及增加各方尊重方面是非常有回报的。我们试图通过系统性的积极倾听，培养一种意识到的他人情绪并抑制自身情绪的习惯。这种形式的最终体现就是同情反思。


    ## 同情反思


    对话中的同情源于体现他人的观点——并表现出来。练习同情比仅仅听见并承认对方所说的更进一步——它实际上是在感性层面处理你所听到的内容。倾听时，要投入其中。在内心不断问自己：说了什么，怎么说的，以及为什么。


    这个人的世界正在发生什么？他们是谁，什么对他们来说很重要，他们为什么要告诉你这些内容？他们的价值观是什么，这些价值观是如何通过与你交流的方式体现出来的？现在成为他们是什么感觉？换句话说，问问自己：从他们的角度来看，我听到的内容在哪些方面对他们*完全合理*？


    如果某些事情看起来不合理或不符合逻辑，并不是因为你正在和一个不合理或不符合逻辑的人说话——你只是错过了对方思路中的一部分。我们总是可以刻意努力验证人们所说的话。当我们验证时，我们是在告诉对方他们的经历具有*内在效力*。并不是说我们认同他们、理解他们、或分享他们的信念或类似的事情——只是承认他们有那种感受，并且他们完全权利那样感受。这对某些人比其他人来得更自然，但你可以通过说以下话来练习：


    -   “这很有道理。”

    -   “嗯，你能多说一些关于 XYZ 的吗？你说 ABC 时是什么意思？”

    -   “看起来情况是这样的。我理解得正确吗？”

    -   “哦哦。我明白了。”

    -   “继续说。”

    -   “你认为（插入一个尝试性的解释）吗？”

    -   “我对（他们之前说的某事）非常好奇……”

    -   “噢，哇。做得好！”

    -   “所以你为什么 XYZ？”

    -   “后来发生了什么？”

    -   “所以，你是说（对刚刚所内容的简要总结）？”


    但请注意，你的积极倾听技巧可能会被对话自恋者完全滥用，他们只需要一点点鼓励。在这种情况下，坐下来听尽可能你能承受的内容，如果可以，就优雅地退出——你无法在一个执意占据主导的人身上通过更加合作来“赢”。微笑并练习你的同情倾听技巧——当一个更有合作的对话伙伴出现时，你会庆幸自己这么做的！


    再次想象第一个对话示例，但这次面对一个糟糕的对话者。你可以看到在面对占据主导的伴侣时使用积极倾听技巧实际上对谁都没有帮助。


    -   “我已经试着跟他聊过很多次了，但我不得不说，他似乎真的没进去，你懂吧？”（沉默）。

    -   “唉，我不知道。我觉得也许我不应该抱怨。”（对方心不在焉地淡地地点了点头，此时此人很快地看了一眼手机）。

    -   “总之，说够我的了，猜你怎么样？”（突然变得活跃起来）“噢，我们很好。那天我们去听了一场超级棒的音乐会，我告诉过你吗？所以，发生的是……啦啦啦。”


    后来，最初的说话者努力想要“插话”，随之而来的是关于城市各种音乐会的、乏味的一小时聊天。原本可以是一次非常亲密、建立联系且对双方都有益的对话，现在变成了一个每个成员受邀轮流站在上面讲述自己故事的讲台。


    当你思考如何成为一个更好的对话者时，值得记住这一点。试着思考为什么有些对话让你感到被忽视、被误解或没有被真正听见——对方对你的态度是什么？也许我们可以把自己的“自恋”用在正确的地方。


