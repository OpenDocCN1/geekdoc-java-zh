    *A 人：* 我的意思是，我知道她可能有点太过于戏剧化且无缘无疑了。但他不可能有那么多工作要做。不至于每周要错过四顿晚餐。

    *B 人：* 是的。

    *A 人：* 我觉得她可能有担心的理由。你不觉得吗？

    *B 人：* 嗯。等一下，什么？

    *A 人：* 你真的有听我说的任何话吗？

    *B 人：* 呃……嘿，看。那只松鼠又回来了。


