    Silence tell them that you are not waiting to pounce in with a response or reaction
    of your own, but really are listening attentively. Silence is an excellent tool—when
    paired with genuine attention, you can encourage the person to open up and speak
    more.


    ## 2. Accurate reflection. After you’ve listened to your partner explain what’s
    happening, the next step is to show that you’re concentrating on their well-being
    and trying to understand what they’re feeling. That’s when you attempt to offer
    an accurate reflection of what they’ve just expressed.


    Reflection can take different forms, but they are all verbal statements that mirror
    the emotions your partner is conveying, provide context, and assure them that
    you comprehend their feelings. “I sense that you’re disappointed about not getting
    that job” or “I can hear your anxiety about having to deal with your family at
    Thanksgiving.”


    It doesn’t have to be more than a sentence or two of acknowledgment—in fact, it
    shouldn’t be. It should be just enough to let your partner know that you’re hearing
    them, that you’ve invested your interest and concern, and want to hear them continue
    their story.


    A more subtle way to reflect is to simply offer acknowledging sounds at key points
    in the story. To show you are listening and understand, nod where appropriate,
    say “uh-huh,” smile when they smile or reflect back the facial expression they’re
    using.


    Also try to paraphrase their feelings in your own words instead of just repeating
    what they’ve said to you word for word. Simply echoing their statements verbatim
    only proves that you have a good short-term memory. Rephrasing it in your own
    language, though, shows that you’re trying to understand them on a deeper level.
    (Plus, parroting something back to someone could be mistaken for sarcasm, like
    an adult mimicking a crying child.)


    ## 3. Reading behavior and guessing what they’re feeling. For a variety of reasons,
    many of us are detached from and out of touch with our emotions. A big cause of
    this separation is having experienced invalidation in the past. Our parents may
    have neglected our feelings as kids (like that mimicking parent does in the last
    paragraph, for example). Or perhaps we’ve tried to be honest about our feelings
    with others before, and their reactions were so harmful that now we repress our
    emotions and keep them buried.


    Sometimes, people know they are distressed without having a strong sense of what
    is really the problem. In talking out loud, though, they sort through their thoughts
    and get a clearer picture of how they feel. That’s where you can come in.


    The next step is guessing how your partner feels by how they’re behaving: “I’m
    guessing you’re feeling rejected by your parents because they’re not showing confidence
    in your decisions” or “It sounds to me like you’re frustrated with your coworker
    because they’re not keeping their commitments.”


    You can make liberal use of emotion words to try to capture and summarize their
    experience, so you can share it with them, defining their experience at the same
    time as validating it. For example, “you seem really annoyed/disappointed/scared/depressed
    right now.”


    It’s vital to frame this statement as a guess, not a firm declaration of your
    belief or diagnosis of the situation. They are not coming to you to be told how
    they feel, but to have how they feel reflected back to them. Being assertive puts
    you in a position where you’re superior to the other person and you know the answers
    to their problems. It can feel enormously invalidating, as though you are acting
    as an almighty emotions expert, bestowing your wisdom upon them. That creates
    a distance, a sort of mentor-student relationship that might make your conversation
    partner less forthcoming, not to mention resentful.


    This is a step beyond reflecting emotions, because you aren’t waiting for the
    other person to express themselves. You are taking the lead here and trying to
    guide them to an emotional resolution. So, you facilitate, and you pay close attention
    to how your guesses are received.


    Another reason you need to present your interpretation of their feelings as a
    guess is, of course, that you might be wrong. In this step, being wrong is completely
    okay. You’re trying to figure out what their emotions are. But ultimately, they’re
    the ones who are feeling their emotions, and they know best what those are. If
    you supposed wrong, they might correct you. That, too, is completely okay. They
    might explain that no, it’s not fear they feel exactly but a vague sense of uneasiness,
    for example. Give them a safe environment to explain themselves, without you rushing
    in to put words in their mouths. If they know you’re just speculating, they’ll
    feel more secure in clarifying what’s happening with them.


    ## 4. Understand their behavior in the context of their lives. This step depends
    on your having knowledge of your partner’s past history and general makeup—and
    if you’ve been close for a long time, you should know that history reasonably
    well. All the reactions we have now are the product of events and experiences
    that we had in the past, as well as the way we’re biologically constructed. In
    this validation step, you express a connection with their behavior by understanding
    how the past has shaped their actions and feelings.


    In other words, you put their current experience in a bigger context. This is
    innately validating, because putting things in context is a powerful way to say
    they make sense, they belong, and are appropriate. If we can see the person’s
    reactions as a natural part of a bigger whole, they feel justified and correct
    in having those feelings.

