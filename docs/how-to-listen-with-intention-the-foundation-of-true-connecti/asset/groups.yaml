    time. This will communicate that you genuinely care. Let your speaker set


    the tone and pace, and match it empathetically. If you ask open-ended


    questions or merely reflect or show support, the person is likely to feel


    heard, whereas closed questions can feel like you’re more interested in


    pushing the speaker down a particular path than letting them express what


    they are feeling.


     


    You may never realize all the ways you subtly communicate to others that


    you don’t in fact value their emotional experience and are not truly


    listening, even if you’re trying really hard to be a better listener. Sometimes


    we don’t even know all the ways we enter a dialogue with fixed ideas of


    how it should go, what the other person should say—and indeed the role we


    should play for them. You’ve probably been at the mercy of someone who


    truly believed they were being a “good listener,” but you actually felt like


    your experience was merely being shoehorned into theirs.  


     


    A good listener is above all open and receptive, and unafraid to completely


    embrace another person’s reality, entering alongside them in their feelings,


    whatever they are, without their own egos getting in the way. When you


    think about it, this phenomenon is so rare in the world today that if you can


    successfully demonstrate it to someone in a moment of vulnerability, you’ll


    likely win their trust forever and significantly strengthen that relationship.


     


    When in doubt, remember all the times you’ve wanted to talk and share


    your emotional world with someone else. At the time, did you want to hear


    their pop-psychology interpretation? Did you want to know their opinion on


    what you’re doing wrong and how to fix it? Did you want them to freak out


    and get awkward, so you feel guilty for making *them* feel bad? Did you


    want them to “fact check” your story, or tell you you were overreacting, or


    side with someone else? Or would you have immensely appreciated it if


    they simply told you, “Hey, whatever happens, I’m here and I support you.


    Tell me more”?'
