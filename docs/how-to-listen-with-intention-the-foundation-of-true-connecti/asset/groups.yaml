    Bearing all this in mind, however, it’s worth remembering that reflecting


    might not always be the best idea, and can go wrong. If you reflect back


    something inaccurate, you may unintentionally show that you weren’t


    listening properly, with unfortunate consequences. This can usually be fixed


    by a sincere request for more information or an apology, but the best


    approach is to take baby steps and avoid sweeping interpretations of what


    you’re being told. Nobody likes to feel like they’re being analyzed, or being


    told what they think!


     


    Another risk is “premature exposure,” which is bringing up something the


    other person is not comfortable discussing, or ready to explore yet—with


    you or maybe with anyone. In the conversation at the start of this section, a


    particularly astute listener may say, “I wonder if you’re reconsidering your


    relationship with this guy.” This comment may be “true” in some sense, but


    a little too close to home and way more intimate than the speaker may be


    bargaining for. If this happens, a respectful backtrack can help. Change the


    subject, or use a little humor to transition gracefully away from the sensitive


    topic. You’ll probably earn more respect and trust by swiftly acknowledging


    the awkwardness and taking responsibility than by digging in your heels


    and continuing.


     


    “Emotional abandonment” is another thing to watch out for. Let’s say you


    made the above statement, and the other person, trusting you, runs with it.


    They may open up further, share some personal details, and make


    themselves rather vulnerable. If you nod and listen, then suggest you get a


    coffee and bluntly change the topic, they may feel abandoned, as though


    you led them out into deep water and just left them there, feeling exposed.


    Psychologists who goad clients into gut-wrenching territory only to


    cheerfully tell them their session is finished, before quickly escorting the


    person out of the room with tears still on their face—this is emotional


    abandonment!


     


