    people.


    *Person A:* Yeah, I suppose she can look into those.


    As you can see, this last exchange doesn’t end in a disagreement, an


    invalidation, detachment, or, thankfully, another squirrel sighting. It’s a fair


    and open exchange. Person B is paying close attention to what Person A


    says and is drawing Person A out so they feel safe to reveal their innermost


    feelings. That’s all good.


    But after hearing Person A explain what their doubts are, Person B makes a


    suggestion that Person A’s mom check out some online courses. Person B


    made this recommendation from their *own* standpoint. Hearing Person A’s


    doubts activated Person B’s own experience, judgment, or opinion, and it'
