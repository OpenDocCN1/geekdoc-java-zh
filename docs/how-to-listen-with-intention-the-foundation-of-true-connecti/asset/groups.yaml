    However, when affirming their feelings as normal, it’s important to *not* say
    something like *“You’ll be fine”* or *“It’s gonna be okay.”* Those statements,
    well-intended as they are, actually invalidate your partner’s feelings by effectively
    ending the discussion, negating the effect of their difficult emotions. You actually
    *don’t* know if it’s going to be fine. Even if your historical experiences with
    those feelings have turned out to be okay, that doesn’t mean *theirs* will. And
    even if your prediction is accurate, what use is it to them right now, when they
    feel as they do?


    A preferable option would be *“I have faith in your ability to get through this”*—but
    even that’s not completely necessary at this point. Your partner’s feelings should
    be center stage. And they have to know that they are. Your being able to comprehend
    and validate how they feel is much more important to them right now. They need
    the space to complete that expression on their own without getting cut off by
    a nice sentiment that means well. If you give them this opportunity, they will
    hopefully arrive at the same conclusion, and feel for themselves, *I’m going to
    be OK.*


    ## 6. Radical genuineness. This is related to the previous stage of normalizing
    your partner’s feelings and goes a step further. At the end of your communication,
    your partner should feel that they’re a real person experiencing valid feelings
    and *not* like someone who’s crazy and incompetent. Your endgame should result
    in your partner feeling loved and taken seriously—that you respect them as your
    equal, and they’re just going through an exceptionally hard time at the moment.


    When we express radical genuineness, what we’re doing is sharing a little bit
    of ourselves, and in being vulnerable and honest, we connect with the other person;
    we don’t just tell them that they’re not alone, we *show* them. Without giving
    advice or judgments, you might find it helpful to open up about a similar experience,
    to create trust and show that you know what they’re going through. You could say,
    “Did I ever tell you a similar thing happened to me when I was younger?”


    Consider, “I don’t know what it’s like to lose a dog, but my cat’s very elderly,
    and I worry about her dying all the time. I can imagine how it must feel like
    nothing could ever replace them.” Such a confession doesn’t dominate the conversation,
    but shows the other person that you can empathize, that you understand, and that
    you’re there with them, sharing in the normal human experience of loss.


    This might be a good time for the expression *“I have faith you’ll get through
    this,”* since it relates to their being a normal person in a challenging situation.
    But it’s important to establish that *you* believe them to be that way—that you
    know they’re able to solve their problems or adapt to changes, that they’re not
    helpless or unable to make anything right. This is the definition of radical genuineness:
    treating and supporting your loved one as a human being that you trust and believe
    in, especially when they’re down.


    In this stage, only genuine, sincere connection will work. You cannot fake it!
    Relationships and friendships emerge from feelings of love, happiness, and satisfaction.
    But they’re *preserved* by shaping those sentiments into practicing validation,
    and that takes work and conscientiousness.


    **Takeaways:**


    - Get into the hole with others—the holes that they have dug, not the one that
    you are digging beside them.

    - Validation is a somewhat lost art. Validation is the act of showing respect
    and acknowledgment of people’s intentions and emotions. When we validate, we express
    that someone else’s experience, their thoughts, feelings, perspective and indeed
    they themselves, are valid, make sense and are understandable.

    - It can be as easy as nodding your head, but it accomplishes the greater purpose
    of making people feel emotionally heard and fulfilled. At the most basic level,
    it consists of identifying people’s emotions and then justifying them. You first
    act as a detective to understand what you are dealing with, and then make people
    feel that they are completely reasonable in their emotional experience. Emotions
    are never quite rational, but they are always real.

    - Many times when we try to validate, we actually worsen the situation by using
    invalidating statements. These are statements that dismiss or minimize people’s
    feelings, such as “Oh, you’ll be fine” or “You shouldn’t feel that way!” They’re
    prescriptive and try to convince people to see the bright side of things—but that’s
    not what they are in need of at the moment.


    A helpful six-step path to validation is as follows: being present, accurately
    reflecting emotions, guessing emotions, understanding emotions in context, affirming
    emotions, and then being honest. It’s not always necessary or even possible to
    practice every one of these steps, but it’s worth moving through them progressively,
    considering context, your position and what the other person most needs from the
    conversation.


    We can be present by tuning out distractions, listening attentively and using
    silence. We can reflect by using paraphrasing, mirroring tone of voice, posture
    or language, or even using questions to gather more information. We can guess
    emotions by offering tentative suggestions for how the other person is feeling,
    then observing their reaction. We can then affirm these emotions by making statements
    that validate them as normal and understandable. Finally, we can show compassion
    by revealing a little of ourselves and being honest.


    ## Chapter 5. Read and Analyze


    **Emotional Genius**


    The best modern conception of emotional intelligence comes from psychologist Daniel
    Goleman. Emotional intelligence is knowing and perceiving the emotions *you* feel
    and why you feel them, then transferring that type of awareness onto others. You
    are able to put a label on your emotional state and find its cause and effect.
    By extension, emotional intelligence is being able to read other people’ emotions
    accurately and deduce the reasons for them.


    So, we can use our own inner reality as a model onto which we can pattern the
    inner realities of other people. When we are “emotionally literate” we can begin
    to see the same patterns in others, and recognize similar feelings. This, of course,
    takes a degree of self-awareness. When you start thinking “Why did she say that?”
    and “What made him do that?” instead of immediately reacting, that’s the beginning
    of your path to emotional intelligence. It’s a matter of understanding the whole
    causal chain of other people’s motivations and intentions and that leads to their
    emotions, which lead to their behaviors.


    High emotional intelligence is like being able to read someone’s mind. In reality,
    this everyday superpower is not so complex and requires resisting powerful aspects
    of human nature that behoove us to focus only on ourselves.


    The first way that we can generally read and analyze people better is through
    emotional intelligence. There are ways to be more direct about this. In reality,
    deep listening is a subset of evaluating others. However, the common theme remains
    of removing your own biases, desires, and goals from the equation, so that you
    can more clearly see the person in front of you. If you can’t achieve this first
    goal, you will set yourself up for interpersonal failure.


