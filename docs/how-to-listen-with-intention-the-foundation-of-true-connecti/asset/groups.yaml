    well-being. Again, recognize where you are, and how to move toward people/emotion/heart
    styles of listening.


    Frames are a different way to imagine listening styles. Frames are much more fluid,
    and simply ask you to consider what someone’s overall goals or purpose for the
    interaction is. What is theirs, what is yours, and do they match? If not, utilize
    your new understanding and make them match. An easy way to think about frames
    is in terms of an acting scene. All the actors are on the same page, working toward
    the same goal, and trying to capture an emotional payoff. What happens if one
    of the actors wants to wing it for a bit, and expound on their character’s love
    of the sea? Nothing good.


    Finally, we get to levels of listening. Unlike listening frames and styles, some
    of these levels of listening are just plain bad. The levels are: ignoring, pretending
    to listen, selectively listening, attentivelyively listening, and empathetically
    listening. The first two levels are not very useful, and it’s only when we reach
    the ultimate level of empathetically listening that we remove ourselves from the
    equation and listen to hear rather than listen to reply. Most of us are stuck
    in the first three to four levels for the majority of our day-to-day interactions.


    ## Chapter 3. The Tough Work of Hearing Someone


    Listening is truly not a passive activity. Well, it can be, but that would just
    mean that you’re not doing a good job. True, deep listening can be said to be
    extremely active, to the point of tiring you out! Surprised? This is because the
    purpose of true, deep listening is to *go there* with someone, and this involves
    teasing out exactly where you are heading. It’s a job that requires a lot of comprehension,
    solving subtle mysteries, and clarification. It’s a bit like a therapist’s role
    in helping unravel emotions and situations.


    To this end, we come to the concept of active listening. It’s a way to participate
    in conversations while being on the receiving end. Most might think that receiving
    simply means sitting quietly, but that’s a huge mistake. There are nine types
    of active listening responses we cover, to be used when trying to connect deeply
    with someone: comprehending, retaining, responding, restating, reflecting, summarizing,
    labeling emotions, probing with leading questions, and silence. The next level
    of active listening could be called empathetic reflection, and this is where the
    listener focuses on emotion, so much so that you are trying to predict what the
    speaker is feeling, and share it with them.


    ## Chapter 4. I See You, I Hear You


    Get into the hole with others—the holes that they have dug, not the one that you
    are digging beside them. Validation is a somewhat lost art. Validation is the
    act of showing respect and acknowledgment of people’s intentions and emotions.
    When we validate, we express that someone else’s experience, their thoughts, feelings,
    perspective and indeed they themselves, are valid, make sense and are understandable.


    It can be as easy as nodding your head, but it accomplishes the greater purpose
    of making people feel emotionally heard and fulfilled. At the most basic level,
    it consists of identifying people’s emotions and then justifying them. You first
    act as a detective to understand what you are dealing with, and then make people
    feel that they are completely reasonable in their emotional experience. Emotions
    are never quite rational, but they are always real.


    Many times when we try to validate, we actually worsen the situation by using
    invalidating statements. These are statements that dismiss or minimize people’s
    feelings, such as “Oh, you’ll be fine” or “You shouldn’t feel that way!” They’re
    prescriptive and try to convince people to see the bright side of things—but that’s
    not what they are in need of at the moment.


    A helpful six-step path to validation is as follows: being present, accurately
    reflecting emotions, guessing emotions, understanding emotions in context, affirming
    emotions, and then being honest. It’s not always necessary or even possible to
    practice every one of these steps, but it’s worth moving through them progressively,
    considering context, your position and what the other person most needs from the
    conversation.


    We can be present by tuning out distractions, listening attentively and using
    silence. We can reflect by using paraphrasing, mirroring tone of voice, posture
    or language, or even using questions to gather more information. We can guess
    emotions by offering tentative suggestions for how the other person is feeling,
    then observing their reaction. We can then affirm these emotions by making statements
    that validate them as normal and understandable. Finally, we can show genuine
    compassion by revealing a little of ourselves, and being honest, to encourage
    real feelings of trust and connection.


    ## Chapter 5. Read and Analyze


    We’ve talked about values and rational intentions that people might have. This
    chapter focuses on emotional cues that we can use to analyze people, and taken
    together, we are able to better predict and understand both rational and emotional
    states.


    Better understanding people’s emotions begins with understanding your own. This
    comes in the form of emotional intelligence, and Daniel Goleman’s conception of
    emotional intelligence consists of self-awareness (what do I feel and why), self-management
    (how can I express my emotions safely and learn from them), self-motivation (what
    makes me happy, and how can I achieve that), and social awareness (what are other
    people feeling and why). The whole process begins with understanding yourself
    and then realizing that everyone else has the same amount of unconscious and hidden
    thoughts that dictate their emotions and actions. It is a way of thinking that
    must be trained and allows you to pull a significant amount of information from
    a small interaction.


    Likewise, we must learn to understand subtextual cues. This is related to social
    awareness of emotional intelligence. We must realize that most communication is
    covert, and yet most of us are only responding to communication that is overt.
    This means we frequently miss the true meaning of people’s words and actions.
    The easiest way to adopt this particular method of thinking is to ask, *why did
    they say that, what are they feeling, and what could it mean?*


    I would be highly, greatly, amazingly grateful and appreciative if you felt like
    taking just 30 seconds and leaving me a review on Amazon! Reviews are incredibly
    important to an author’s livelihood, and they are shockingly hard to come by.
    Strange, right?


    Anyway, the more reviews my books get, the more I am actually able to continue
    my love of writing. If you felt any way about this book, please leave me a review
    and let me know that I’m on the right track. CLICK HERE TO REVIEW

