    generation, social standing, or culture that we just don’t know enough


    about. Above all else, you just want to make sure you are on the same


    emotional page as the speaker, so you can ascertain their needs and desires


    at the moment.


    A great thing to ask if we’re not understanding what someone’s saying is


    *“Can you explain it to me as if I were five years old?”* A five-year-old


    knows enough words to hold a conversation but needs to have relatively


    complex situations described to them in a very patient, deliberate way using


    the words they already know. Especially if you think the other person fears


    appearing condescending or patronizing, asking them to describe something


    as if you were, let’s say, *far younger than your actual age,* can make them


    feel a little more at ease.


    Other statements to ask for help comprehending include:


    “What happened?”


    “Tell me your story.”


    “What do you mean?”


    “Tell me more.”


    “Can you clear this part up for me?”


    Don’t be afraid of coming across as stupid or interrupting. Most people like


    to feel like experts, and we are all experts in our own experience. It can


    even be useful sometimes to be completely transparent about your lack of


    understanding—if you frame this as a reason for you to listen all the more


    closely so you can learn!'
  - '[PAGE 59]


    *Retaining. *More than just remembering what you just heard, retaining


    information is hearing what the speaker is trying to say so we can give back


    a suitable reply. You’re trying to get the whole story here, and this goes far


    beyond simple facts and events. The goal is to place yourself in the


    speaker’s shoes as closely as possible, and of course, questions are


    necessary for that.


    When we’re listening to someone, we tend to retain only the details that


    strike us more personally or in ways that we’re most used to retaining


    information. But that’s only our lens, and not particularly useful for trying


    to be a better listener.


    For example, if someone’s telling us about a date they went on, we might be


    the kind who remembers the physical details of the event (what restaurant


    they went to, what movie they saw, what they were wearing). Or we might


    recall some more general narrative about the date as a whole (what


    personality the other person had, what the date “felt like,” how it compared


    to other dates in the past).


    We might not even notice ourselves picking out pieces of the narrative that


    push our buttons, and internally we can set to work constructing a slightly


    different story for ourselves than the one we’re being offered. You might


    have been on the receiving end of this, when you tell someone something as


    they seem only to latch on to one aspect of the story that definitely wasn’t


    your focus. Its definitely a way to “listen without listening”!


    In conversation we generally look for openings for us to say something and


    “get our two cents in.” This is normal, but it’s not conducive to active


    listening. To properly retain what our conversation partner is telling us, we


    have to put our egos away and focus squarely on the other person’s words,


    as they are laying them out. It’s not about your interpretation, but theirs.


    Again, questions are a powerful tool to frame things and keep your focus on


    the other person’s expression. To ensure you’re retaining all the relevant


    information you need, you could ask:


    “What does that mean to you?”


    “And just to be clear, what happened after?”'
