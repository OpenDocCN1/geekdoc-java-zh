    One method the researchers used to determine how much the participants valued
    being able to talk about themselves was to offer a modest financial incentive
    to anybody who would answer questions about *other* people instead. Some of the
    questions involved casual subjects such as hobbies and personal tastes while others
    covered personality traits, such as intelligence, curiosity, or aggression.


    The researchers found that many of the participants were willing to pass up on
    the money, preferring the rewarding feelings of self-disclosure over financial
    gain. In fact, the average participant gave up between 17 and 25 percent of their
    possible earnings just so that they could reveal personal information.


    Researchers then used a functional magnetic resonance imaging scanner (fMRI) to
    observe what parts of the brain were most excited when the subjects were talking
    about themselves. Again, they found a correlation between self-disclosure and
    heightened activity in brain regions belonging to the mesolimbic dopamine system—the
    same region that’s associated with the satisfying feeling we get from food, money,
    and sex. This increased brain activity even happens when we speak about ourselves
    *without* anyone listening to us. Of course, there is a far more powerful effect
    when our listening skills come into play.


    What do these studies tell us? Well, firstly that you are not a selfish or vain
    person if you tend toward talking about yourself rather than listening to others.
    But it also suggests that we have at our fingertips a rock-solid method for helping
    *other people* feel that same sense of reward and satisfaction.


    ## Unconscious Obstacles


    If there’s so much value in being a good listener, why are so few people actually
    good at it? Instead of thinking in terms of skills or attributes you lack, think
    instead of the barriers that keep you from truly listening to another person.
    All the skills and techniques in the world won’t help if we still retain false
    beliefs, habits and blind spots that get in the way of real connection and empathy.
    It would be like owning a boat and being an expert seaman, but having a deathly
    fear of the water. Some things just overshadow others.


    If you’re reading this book, congratulations—you have already taken an active
    and conscious step toward becoming a better listener. Call it ego or call it a
    bad habit, but many people don’t like to think of themselves as poor conversationalists,
    or lacking in the listening department. This may be the biggest barrier of all—because
    it stops us from seeing all the other obstacles preventing us from being as attentive
    and empathetic as we could be. Let’s take a closer look at what some of these
    barriers might be.


    Think about the poor listeners you may have encountered in your own life. What
    made you feel they weren’t listening to you? Perhaps the biggest problem may be
    their ***inability to look outside of themselves and their own needs***. This
    doesn’t mean that they have real or actual needs, it simply means that they are
    focused only on themselves and their reality.


    This is the person who starts every sentence with “I,” or who starts spouting
    opinions as though they’re a celebrity on a talk show, or who hogs the conversation
    only so they can tell you at length about what they’ve done, what they like and
    dislike, how they see things, what happened to them, blah blah blah…


    Good conversation is like a tennis match where the attention moves equally between
    the two parties, like a tennis ball. If someone is never able to truly put their
    attention on anything other than themselves, it’s like playing tennis with a person
    who never properly serves the ball, or never returns it once it goes over the
    net. A conversation suddenly turns into a monologue, soliloquy, or simply a lecture
    to an unwilling student.


    So-called “conversational narcissism” may look on its surface like a regular conversation,
    but on closer inspection it actually resembles two people spouting monologues
    in close proximity to one another! In a way, good conversation is a dying art
    precisely because people feel more isolated than ever before. Add to this growing
    phenomenon the fact that people are increasingly inhabiting “filter bubbles” of
    their own making, so that they only ever have to encounter opinions they already
    agree with and content from people who are just like them, and you have a recipe
    for conversational disaster.


    So, why is balanced conversation such a lost art? With so many people missing
    the feeling of being truly heard themselves, they crave attention and to be in
    the spotlight, having others listen closely to them. The sad irony is that such
    a person bring a selfish, even competitive attitude to an activity that is supposed
    to be mutually beneficial. As they speak, they alienate the other person, who
    decides to stop listening and instead starts thinking about how they are going
    to get a word in and steal back a little of the spotlight for themselves.


    And thus the cycle continues and grows even worse over time, spurred on by feelings
    of not being heard or paid attention to. Using a conversation as a platform to
    win attention and stroke your ego is undoubtedly a losing strategy. The truth
    is that the more you misuse conversation to this end, the fewer opportunities
    you’ll actually have to converse with others, who will probably get tired of being
    a forced audience.


    Have you ever quietly waited for someone to stop speaking, thinking all the while
    about what you would say the moment they shut up? If so, you’ve likely been guilty
    of conversational narcissism too! It is still the inability to put aside your
    own internal monologue completely, and focus on what the other person is thinking
    or saying. It leads to the same outcome of dueling monologues, where conversation
    hasn’t really happened at all—rather, you have two people talking *at* each other
    instead of *with* each other.


    So to start with, improve your listening skills by being vigilant about the ways
    in which craving attention can make you a worse conversationalist. This takes
    some conscious awareness and also a little honesty. We can ask what our true intentions
    and motivations are for entering into conversations, in general and specifically
    with people we know. Are we reaching out to others because we want the validation
    of their attention? Because we want the feeling of proving ourselves right and
    another wrong?


    Do we see conversation as a battle, or a game, or a dance? Perhaps we see conversation
    as an opportunity to show ourselves off, or share what interests us. Whatever
    your reasons are, though, you probably notice that they usually concern only *you*…
    and don’t spare a thought for the other person sharing the conversation with you!
    How many of us can honestly say that our goal is to see and understand the other
    person, rather than just to have ourselves seen and understood?


    The idea is not to always seek to turn attention to yourself. Conversations should
    be thought of not as a means to win attention, but to *share* it enjoyably with
    someone else. The goal is not competition for the floor, but cooperation with
    an ally. The purpose is to collaborate, not express solely. The aim is to learn,
    not teach, and so on. For some of us, this may require a complete re-tooling of
    what we seek when we want to be social.


    After an ineffective conversation, people may feel depleted, bored, or even more
    alone. Good conversations, on the other hand, can be things of beauty, allowing
    both participants to create between them something bigger than the sum of its
    parts. And remember how much people were willing to pay to be heard and express
    themselves in the study referenced earlier in this very chapter? Hopefully, as
    you continue reading this book, you’ll decide that offering that feeling to someone
    else is just as rewarding.


    Listening well requires that you suspend your own self-interest and ego and gracefully
    allow someone else to shine.

