    What do you think they can teach you, and what do you have in common

    with them?


    Do you tend to ask the baristas or cashiers about their day and actually care

    about their answer? If not, do you think you’ll be able to simply “turn it on”

    when you’re around people you care about? Practice changing your

    mindsets concerning the people around you. It’s the easiest practice you’ll

    have because you don’t have to lift a finger, but it drastically transforms the

    quality of relationships you’ll create.


    Takeaways:


    We’ve all got two ears but only one mouth, right? This means we

    should do about double the listening versus speaking, but the truth

    is doing so goes against our natural instinct. We are wired to

    express and talk about ourselves—to the extent that it provides the

    same type of neurological stimulation as sex. Fair enough, but that

    doesn’t mean talking nonstop is acceptable or helpful to our

    relationships.


    It’s time to view listening as the true win-win in cultivating deeper

    relationships. When you listen, you not only get to learn about

    someone, you are (paradoxically to some) seen as more charismatic,

    interesting, and enjoyable to interact with. So if your end goal is to

    be those things, listening is the skill you must perfect. It’s a simple

    skill, but certainly nothing close to easy.


    The challenge is that there are so many unconscious ways we wrest

    control over a conversation and become a conversational narcissist.

    This is simply when someone speaks so much that it appears to be a

    monologue versus a shared dialogue. One subtle way this occurs is

    through support versus shift responses, where the feeling you

    impart to others can hinge on a single vocabulary choice. The

    underlying theme, however, is to accept letting go of control,

    pride, and ego, and go wherever someone else wishes to go.


    A more conscious obstacle many people face is the feeling that the

    people they interact with are quite boring and have nothing

    worthwhile to say; thus, listening to them is not a good use of their

    time. Just reading that sentence, you should be able to spot a few

    flaws. If you think most people you run across are boring, you’re

    the boring one. You’re letting a prejudgment dictate your actions,

    and ruin your interactions. Instead, expect that you will find

    something fascinating and delightful, and that’s just what will begin

    to happen.


    For a role model on how to draw information out of people, look no

    further than late-night talk-show hosts. Their sole job is to make a

    celebrity, often no funnier than you or I, appear immensely

    charming and intelligent. That’s a tough task sometimes. Think

    about the energy, focus, attention, and listening they employ to

    make this happen. That’s what is possible.


    ## Chapter 2. Styles, Frames, and Levels


    Picture a scene that may feel all too familiar to some couples. Person X has

    had a bad experience and is upset, and is now telling person Y about what

    happened. Person Y is listening—truly listening—and yet the conversation

    isn’t going well and eventually ends poorly. It goes like this:


    X: I had such an awful time at work today. Ugh, I hate my job.

    Y: Oh? I thought you liked it there. What’s the problem?


    X: I don’t know, I just sometimes feel like I never get a break, like I’m

    rushed off my feet the second I walk in the door…

    Y: Really? I’m sure you said you were enjoying the work last week.


    X: Well, yes, I mean of course I enjoy it sometimes. I just feel so

    unappreciated, you know?

    Y: Uh-huh. Maybe you should ask for a raise.


    X: No, it’s not that. Today Z didn’t even bother to thank me for basically

    bailing him out of an emergency, and I felt so…

    Y: Have you told Z? Anyway, you are Z’s superior, so…


    X: I *know* that. But does that mean I just have to carry everyone’s slack,

    forever?

    Y: So… you didn’t tell Z how you feel?


    X: You’re not listening! It’s not about Z!

    Y: Yeesh, then what *is* it about? I keep asking but you’re not telling me

    anything.

    X: Ugh, just forget it.


    What’s gone wrong here? Maybe you’ve had some version of this argument

    yourself—even playing both roles!


    Y may genuinely be interested in continuing the conversation, wanting to

    “help” and doing all the things we’ve discussed as good conversational

    technique. But Y still doesn’t feel listened to—and it’s because they have

    different listening styles, and are seemingly unaware of the fact.


    It’s more or less as simple as someone being right or left-handed—there’s a

    natural instinct and course of action, but that doesn’t mean that it can or

    should work optimally. As a result of our backgrounds, experiences, and

    preferences, we all have certain approaches to the world. So should it be

    surprising when our approach doesn’t line up with someone else’s,

    creating a type of listening nightmare?


    We’ve taken a look at some of the skills and attitudes we can develop to

    make us better listeners and, in turn, better communicators and more

    effective and balanced people. This chapter is again going to consider

    how important it is to be aware of the strengths and weaknesses in your

    communication style.


