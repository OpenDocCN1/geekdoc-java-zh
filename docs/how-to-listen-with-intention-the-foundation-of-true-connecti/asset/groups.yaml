    **Validating Responses**


     


    In the first example above, Partner 2’s responses are inappropriate because


    they derail Partner 1’s legitimate emotions. Partner 2 doesn’t want to spend


    time focusing on Partner 1 for whatever reason—they just don’t want to


    deal with them. So Partner 2’s ill-mannered, terse, and mean reaction makes


    a bad situation worse.


    But not all such responses are meant in a bad way—one can also,


    unsuspectingly, invalidate someone’s feelings with good intentions. Some


    of the more innocuous responses we give to someone’s emotional tumult


    can actually hurt them without us realizing what’s going on. This is likely


    what most of us are doing when we *think* we’re validating; in fact, we’re


    making the situation worse.


    For example, when consoling someone over a situation that makes them


    nervous or apprehensive, one might say something like “*Don’t worry about*


    *it*” or “*You shouldn’t feel that way.*” And they might say it in a comforting


    tone to make them feel better. They mean well. Other phrases which come


    from a well-intentioned place but feel pretty invalidating include:


    “Oh, you’ll change your mind soon!”


    “Shh, everything’s going to be OK.”


    “Let’s not think about that right now.”


    “Come on, cheer up.”


    “Hey, you’re better than that!”


    “Don’t be silly, what is there to be scared about?”


    “Oh, you don’t mean it, you’re just tired.”


     


     


    But such responses are actually invalidating. They *are* worried about their


    situation; they *already* feel that way. Telling someone they’re not acting in


    the optimal way negates their entitlement to their own feelings. Even if'
  - '[PAGE 89]


    you’re making that remark out of kindness, your partner may receive it as


    invalidation of their perfectly normal feelings. It’s simply unhelpful to hear,


    similar to telling someone, “*Hey, just grow taller*.”


    An alternative response that successfully validates the other partner might


    be *“I can sense that you’re worried about this situation.”* This response


    assures the partner that their concerns are real and that their presence is


    reasonable. Remember, your goal is to identify emotions and then justify


    them—nothing more. You don’t have to appraise those emotions or decide


    whether they’re right or wrong. You don’t have to give permission for them


    to exist or compare those emotions against your own. You just have to


    listen, and accept.


    Another invalidating and unhelpful response is *“I’m sorry you feel that*


    *way.”* You might think the phrase “I’m sorry” is a form of empathy. And in


    a way it can be. But it can also be interpreted as an empty sentiment. If


    someone’s lost their job, been evicted, come down with a debilitating


    disease, or suffered some other awful injury or fate, “I’m sorry” doesn’t


    quite cut it. By saying you’re sorry someone is undergoing emotional


    turmoil—that they “feel that way”—you’re also suggesting that there’s a


    different way they *should* feel, but they’re not. Whether they *should *feel
    a


    certain way is irrelevant, as they can’t change what they already feel.


    A more validating option would be *“I can understand why you’re feeling*


    *this way—I think anyone else would too.” *Remember, validation is about


    expressing that someone’s experience makes sense and is valid. Explaining


    that they have a right to be uneasy and that such feelings are normal help


    relax tension and produce a bond with the rest of the world: they wouldn’t


    be alone in feeling this way. Even if you think you *wouldn’t* feel this exact


    way, it’s important to establish that others *would*. (Besides, you might not


    really know how you would feel in this situation—it probably hasn’t


    happened to you yet.)


    Likewise, responses like *“At least it’s not like…” *or *“It could be worse”*


    imply that your partner’s concerns are illogical or unfounded. Emotions are


    never logical, but they *are* real. Maybe the issue *can* be worse, but what


    difference does it make in someone’s subjective sense of reality? If you had


    a Great White shark chewing on your leg, and someone said to you that at'
  - '[PAGE 90]


    least he wasn’t chewing on *both* legs, it wouldn’t do much to stop the pain


    you were feeling, would it? Objective comparisons to more dire situations


    serve to put the worrier “in their place,” even if they’re meant to make the


    partner feel better in the short term. But they’re just friendlier forms of


    marginalization, and a way of saying, “Your emotions are too much.” The


    judgment as to whether someone’s situation can or can’t be worse belongs


    to the person who’s feeling the emotions. When we try to rank and evaluate


    emotions, we only end up judging them.


    In this situation, a proper validating response would make the listener feel


    that they’re being taken seriously: *“You’ve really been through a lot” *or


    *“Tell me more about what you’re feeling.”* These responses acknowledge


    the weight of the other person’s issues, reassuring them that you’re willing


    to take their worries seriously and don’t want to minimize how badly they


    feel.


    Outright rejections are not just invalidations but straight-up reproaches:


    *“I’m not having this discussion!”* This is invalidating because it directly


    cuts off communication and further says that the other person’s concerns are


    unworthy. By saying this, the respondent imposes a limit on communication


    —obviously there are some subjects they’re unwilling to discuss with you,


    when a true friend or partner wouldn’t have any hands-off topics


    whatsoever. You can imagine what it feels like when you bring an emotion


    to someone, intending to share, and they essentially run screaming from it!


    A better response is *“Would you like some help working through this*


    *problem?”* or (again) *“Tell me more about what you’re feeling.”* This helps


    the partner feel like they have, if not a total solution, then at least an open


    path to finding a better result. It tells them that their problem is significant,


    and that as people they are worth the trouble, and deserve a solution to that


    problem.


    If it sounds like I’m suggesting you walk on eggshells when you’re dealing


    with other people’s feelings and one of these responses slips out, don’t. You


    will make one of those responses again when you’re done with this book.


    So will I, to be honest, because you and I both mean well, and we are


    humans who make mistakes.'
