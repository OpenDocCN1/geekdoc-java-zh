  - '[PAGE 18]


     


    Those who seem most boastful in a conversation, who jealously guard


    attention or speak over others, are often those who feel most insecure in


    themselves. Their need to control the conversation comes from a hunger for


    attention and approval. If you find yourself using conversations as a


    platform to boost your ego, feel better about yourself or be witnessed and


    supported by others, your work may be to learn to be comfortable taking the


    back seat for a change. The paradox is that people who seem most likeable


    and confident are those who don’t appear to be making frantic efforts to


    dominate others’ attention.


     


    *Be egalitarian*


     


    Do you have any unconscious beliefs about what conversations are actually


    for? Some people speak because they want a soapbox to share their


    opinions, or they want to “teach” others and tell them exactly what’s what,


    or simply to demonstrate superiority in some way or another. Become


    aware of *why* you’re conversing. Are you genuinely curious about the


    human being in front of you? Have you already made up your mind about


    them, or do you simply see them as an audience for your agenda (which you


    refuse to stray from), a sparring partner, a competitor?


     


    Good listeners stay in the moment, and don’t get distracted with their own


    concerns when they’re meant to be focused on someone else. Try to treat


    conversations as pleasurable opportunities to give and take, and to witness


    another as much as revealing oneself.


     


    Does it frequently end up being the case that your conversation partners


    know a ton about you, but you don’t know very much about them? This


    would mean that the flow of information is decidedly one-sided, and that


    you are monopolizing the air space. Do you actually ask others questions?


    When is the last time you asked five questions in a row?


     


    All of this leads us round again to the most important conversation skill—


    listening. Great communicators tend to speak *less* than poor


    communicators. Though the ego might not like it, the truth is that you don’t'
  - '[PAGE 19]


    become a good conversationalist by telling the best jokes or stories, by


    being the most interesting or impressive, or by speaking the most. You do it


    by being humble, friendly, and intrigued by how interesting *other people*


    are. *The secret is to be more interested than interesting.* Learn, rather than


    teach. Listen, rather than speak. Allow others to express, knowing there’s


    enough to go around. Connect rather than impress. Share or participate in a


    story, rather than merely telling it.'
  - '[PAGE 20]


    **But They’re Boring…**


     


    No, you are.


     


    You may have read through the previous sections and wondered how


    realistic it is to be completely enthralled with what another person is saying.


    It can certainly make people feel good to be the center of your attention, but


    what if you literally don’t feel it?


     


    It’s not a great thing to admit, but many of us secretly think that other


    people simply aren’t that interesting, and it’s hard to care about what they


    have to say. After all, what could be more interesting than all the things


    going on in our own lives, from our own perspective? It’s tempting to look


    at the work it takes to listen to someone’s seemingly mundane story and


    decide you’d rather not bother.


     


    We can sometimes miss the point. Sometimes, it’s a question of unrealistic


    expectations. A conversation doesn’t necessarily have to blow your socks


    off or be massively useful to you to be worth taking part in. And of course


    it’s normal to not be interested in literally everyone you meet—some people


    will spark curiosity, others less so. Finally, it’s not necessary at all to fake
    it,


    or act in ways that drain and bore you. Frankly, it is possible to be a warm


    and friendly person with a good social life who doesn’t launch into ecstatic


    conversation with everyone they encounter.


     


    ***But*** here’s where socially successful people have a subtler understanding


    than those who love calling themselves introverts or feel like other people


    are boring and not worth their time. We need to give other people a chance.


    After all, do you think that *you* would appear massively interesting to the


    average person if they just saw you walking down the road? Or if they


    spoke to you for three minutes at a party? You probably think there’s a lot


    more to you as a person than what you can convey in a quick chat. So,


    remember that this is true of others, too.'
  - '[PAGE 21]


    Have a little faith, suspend judgment and—again—just listen. Drop any


    preconceived ideas about what makes a person interesting—some of the


    most fascinating people are out there, just a few pointed questions away


    from being discovered. Be open to being proven wrong, to being surprised.


    Decide to actively look for the good and the interesting in others. It’s an old


    adage that “you can learn something from everyone,” and it’s true. Look at


    conversation as a means of finding out exactly what that thing is.


     


    If you immediately judge someone as uninteresting, they will undoubtedly


    remain that for you. Judge them differently, and they will become that as


    well. Use this to your advantage.


     


    It’s rude to assume people are boring simply because they don’t wow you


    after a few minutes, especially when you may be assisting in it by lobbing


    boring questions at them. This in itself can be rather narcissistic—to think


    of other people in terms of their entertainment value to you, rather than as


    individuals in their own right. When you don’t really know someone, it’s


    hard to be concerned about the mundane details of their lives, but you’d


    certainly care more if they were very important people to you.


     


    The idea is that people are not boring, exactly, but just that you don’t know


    them well enough to care. You can see the catch-22—you can only get to


    know someone if you first go through the “boring” small talk and try to


    forge a closer connection. Being sociable is something that builds on itself.


    It starts with extending a gesture of goodwill to the other person. You don’t


    know that they’re interesting, but you hope and expect they are, and you


    reach out in faith that your investment will be worth it later on.


     


    In other words, some people enter conversations expecting an immediate


    payoff, whereas in reality it’s more common that you need to invest a little


    first, and wait patiently for a reward that may take a while.


     


    You don’t need to force anything. Just be open and receptive and give it a


    go—at least for a while. Even if you never uncover something of interest in


    talking to another person, you can still do so with compassion and


    politeness, and you may just learn something about yourself in the process'
  - '[PAGE 22]


    —how to be a better conversationalist, for one. Some people will take more


    than one conversation to open up. Do your part by building trust and


    rapport, asking questions and listening.


     


    You may be surprised what happens if you have the expectation that you


    will find something delightful or fascinating. People can have unexpected


    hobbies or completely out-there experiences, skills, values, and so on that


    may be of interest to you even though some other parts of their life aren’t.


    Don’t be afraid to push a little and ask questions that invite more intimacy.


     


    Go beyond the surface and ask how your conversation partner feels about


    certain things. You can always divulge a little about yourself first to put


    them at ease. Along this vein, you might need to “go first” sometimes when


    opening up with people. Give unexpected answers, be truthful and make an


    effort at being honest and genuine. People are often more than willing to


    respond in kind.


     


    If you’re *still* not convinced that anyone has anything interesting to tell you,


    it may legitimately be a case of not hanging around with the right kinds of


    people. You may need to seek conversations with those you have more in


    common with than coworkers, fellow students or even family members—


    who might be easily available conversation partners, but won’t necessarily


    be your “people.”


     


    Sometimes, broadening yourself and the range of things that interest you


    has the effect of making other people seem more interesting. Dabble, take


    risks, and avoid assuming you know what things are before you try them.


    Failing to properly listen to others could be part of a broader discomfort


    around other people, feelings of low self-worth, depression, anxiety or an


    unhappiness in your own life.


     


    People who have been bullied or mistreated by others can take a haughty,


    condescending tone as a defense mechanism, or a way to cover up the fact


    that they feel it’s *others* who don’t like *them*. As we’ve already seen, having


    the perspective that others are enemies or rivals can kill a social life.'
- md: '

    Finally, feeling disinterested in others can simply be a phase of life, a period
    of immaturity or a result of being a certain age or living in a certain environment.
    Younger people can often consider something worthless unless they can personally
    get something out of it—it takes experience and wisdom to move away from this
    self-interest and toward healthy relationships with others.


    ## All Hail Conan


    I’ve found that the absolute best mindset to emulate for deep listening is that
    of a talk-show host—Jimmy Fallon, Jimmy Kimmel, Conan O’Brien, whoever your favorite
    is, they all do the same thing. Just ask yourself what they would do if you’re
    struggling for what curiosity looks like and how you can wield it. Conan O’Brien
    happens to be my favorite, so let’s think about the traits he embodies in a conversation
    with a guest on his show.


    Visualize his studio. He’s got a big open space, and he is seated at a desk. His
    guest is seated at a chair adjacent to the desk, and it’s literally like they
    exist in a world of their own. When Conan has a guest on his show, that guest
    is the center of his world for the next ten minutes. They are the most interesting
    person he has ever come across, everything they say is spellbinding, he is insatiably
    curious about their stories, and he reacts to anything they say with an uproarious
    laugh and an otherwise exaggerated reaction that they were seeking. He is charmingly
    positive and can always find a humorous spin on a negative aspect of a story.


    His sole purpose is to make his guest comfortable on the show, encourage them
    to talk about themselves, and ultimately make them feel good and look good. In
    turn, this makes them share things they might not otherwise reveal and creates
    a connection and chemistry that is so important for a talk show. The viewers at
    home are desperate to learn about this celebrity guest, so Conan acts as a proxy
    for their curiosity. Also, the viewers can tell in an instant if either party
    is mailing it in or faking it, so Conan’s job literally depends on his ability
    to use his curiosity to connect on a deeper level.


    Even with grumpy or more quiet guests, he is able to elevate their energy levels
    and attitudes simply by being intensely interested in them (at an energy level
    slightly above theirs) and encouraging them by giving the great reactions they
    seek. It’s almost as if he plays the game “How little can I say to get the most
    out of people?”


    Of course, in your life, this applies to those people you come across that are
    like pulling teeth to talk to. A little bit of friendly encouragement and affirmation
    can make even the meekest clam open up. Numerous questions, directing the conversation
    toward them, and the feeling that you actually care are also integral. Imagine
    the relief you can create at dreaded networking events. People like those who
    like them, so when you react the way they want, it encourages them to be more
    outgoing and open with you.


    Another talk-show host would later go on the record lamenting how often he disliked
    his guests and how boring he found the actors and actresses that he would be forced
    to speak to. But that’s a testament to how highly trained his habit of curiosity
    was. He started by making a conscious decision to be curious, built the habit,
    and engaged his guests easily; do you think his guests could tell if he was truly
    interested or not? Never.


    Curiosity allows people to feel comfortable enough to speak freely beyond a superficial
    level—because you are demonstrating that you care and that you will listen when
    they open up. People won’t be inclined to reveal their secret thoughts if they
    think they’ll be met with apathy, after all. So even if you have to fake it till
    you make it, Conan O’Brien is who your mindset and attitude should feel like.


    In case Conan O’Brien’s curiosity still isn’t coming naturally to you, here are
    some more specific patterns of thought you can use to improve your people skills.


    - ***I wonder what they are like?*** When you start to wonder about the other
    person, it changes your perspective on them completely. This is an inkling of
    curiosity. You start to care about them—not only about their shallow traits, such
    as their occupation or how their day is going, but what motivates them and makes
    them act in the way they do.


    - Having a sense of wonder about someone is one of the most powerful mindsets
    you can possess because it makes you want to scratch your itch. Scratching the
    itch of curiosity will become secondary to everything else because you simply
    want to know about the other person.


    - Suppose you had a sense of wonder about computers as a child. You probably irritated
    others with how many questions you asked anyone that seemed to have knowledge
    about computers. Now as an adult, what kind of attention span are you going to
    devote to computers, and what kind of questions are you going to ask? You are
    going to skip the small-talk interview questions and get right down to the details
    because it’s what you care and are curious about.


    - Keeping the mindset of wonderment will completely change the way you interact
    with people because you will suddenly care, and much of the time, we don’t notice
    that we don’t care about the person we are talking to. You’ll dig deeper and deeper
    until you can put together a picture of what you are wondering about.


    - ***What can they teach me?*** Don’t read this from the perspective of attempting
    to gain what you can from someone. Instead see others as being worthy of attention.
    Everyone has valuable knowledge, whether it applies to your life or not. Everyone
    is great at something, and everyone is an expert in something that you are not,
    no matter how small or obscure the subject. The main point is to ignite an interest
    in the other person as opposed to an apathetic approach. Imagine if you were a
    huge skier and you met someone who used to be a professional. They may have even
    reached the Olympics in their prime. You’ll be thrilled by what you can potentially
    learn and gain from the other person, and that will guide the entire interaction.
    Again, there will be a level of interest and engagement if you view others as
    worthy of talking to. But you’ll never know unless you dig below the surface.


    Whether we like to admit it or not, sometimes we feel some people are not worth
    our time. It’s a bad habit, and this line of thinking is one of the steps toward
    breaking it. Everyone is worth our time, but you won’t be able to discover it
    if you don’t put in the work.


    - ***What do we have in common?*** This is an investigation into the life you
    share with someone. It instantly makes them more interesting—because we feel more
    similar to us! It may sound a bit egotistical, but we are undoubtedly more captivated
    by people who share our views and interests. Finding commonalities may even elevate
    people who different from us. For instance, if you discovered that a new stranger
    was born in the same country as you, you would instantly feel open to them. This
    person must share similar views, values, and humor. But you wouldn’t have discovered
    that if you didn’t make an attempt at excavating beneath the surface.


    Curiosity can still be tough to maintain, which is why my final suggestion for
    creating curiosity is to make a game of it. Your goal is to learn as much about
    the other person as possible. Alternatively, assume there is something thrilling
    and exciting about the other person and make it your quest to uncover it. Eventually,
    you’ll find what you’re looking for. The next time you go out to a café or store,
    put these attitudes to the test with the audience of baristas or cashiers you
    come across—the lucky few who are paid to be nice. Do you perceive these people
    below you, or do you treat them differently than a good friend? Do you have a
    sense of wonderment and curiosity about them?

