    much more instantly. When you start digging, you might be able to


    excavate causes and amplifiers of behavior on the scale of days, weeks, or


    even years. You can start to look with more insight and understanding at


    yourself—and simultaneously practice extending this same curiosity to


    others.


     


    The sad reality is that most people are not in tune with their feelings. They


    may feel them pretty strongly, but lack awareness of their real source, which'
  - '[PAGE 105]


    prevents them from ever taking charge of changing those emotions, or


    having empathy. Often, we are negatively affected by the emotional impact


    of things that have long since been irrelevant. Most people just react


    automatically without realizing why and without stopping to think what is


    happening internally. They fall into patterns that are sometimes negative


    and sometimes destructive.


     


    Rather than looking inward and attempting to label your emotions based on


    what you might hypothesize caused them, you can also analyze how you are


    acting and label them that way. In the former, you are looking to the past to


    try to deduce a cause. In the latter, you are looking at the present to see the


    manifestation of emotion. In a sense, you are working backward from what


    you see and creating at least one theory about what caused it.


     


    Just as with other people, you can tell more about yourself by your actions


    than you can by what you say (or what you tell yourself). We all have


    favorite stories we like to tell about who we are and why things are as they


    are, but it can be incredibly useful to clear your mind of these occasionally,


    and just look at what you really see. What is actually happening? Why?


     


    **Self-Management**


    The most fundamental aspect of self-management is the ability to keep our


    emotions in check. When we’re ecstatic because we got a date with a


    dreamboat, we don’t let that excitement distract others in business meetings.


    When we’re angry about being overlooked for a promotion, we don’t let


    that impact our work relationship with our rival or our boss.


     


    We even work to stay calm, steady, and effective when situations are


    stressful, hostile, or dangerous. In short, it involves not letting emotions get


    the best of you. Now, this doesn’t mean we are ignorant of emotions or


    lacking in self-awareness. In fact, we can only really manage and modulate


    our emotions if we have some basic grasp of what they are. How can we


    master something we don’t properly understand?'
- md: '

    A lot of people attempt to do this by bottling up their emotions, but that’s a
    bad idea because it can lead to resentment, bitterness, and even eventual explosions
    of hatred and rage. Our emotions help us understand what we really think about
    events and people. They can keep us safe, let us know what we value, and inspire
    us to act. Paying attention to them can let us form rational descriptions of our
    concerns and joys that can let us impact our work and relationships in positive
    ways.


    Many people are uncomfortable with emotions because it seems to them that experiencing
    emotion means they are out of control somehow. But we can bring conscious awareness
    to any emotion we experience, and when we are consciously aware, we are never
    out of control—in fact, we are more empowered than ever.


    Emotions are a useful and valuable part of life. But they work best when paired
    with rational judgment, discernment and the ability to see the bigger picture.
    Notice what you feel, examine why you feel it, and talk about it calmly with relevant
    parties when your head is clear. That will let you form meaningful compromises
    and help you gain more happiness in life. In short, express emotions in appropriate,
    productive ways; don’t repress them. This step is the next step in being self-aware:
    what do you actually *do* with your emotions that you’ve identified?


    Self-management also involves monitoring our thoughts and moods to manufacture
    a positive outlook. Some people are natural optimists, some aren’t, but seeking
    out the opportunities and lessons in even the worst situations can produce a silver
    lining that allows for meaningful growth and progress.


    You can’t let yourself be crushed by a failure; you have to push through it, learn
    everything it taught you by heart, and do better next time. A well-managed emotional
    life is used to motivate you toward your goals because you can use conscious patterns
    of optimistic thought to rally yourself with hope and joy, letting you continue
    on your journey. Everyone likes people who can encourage them to go on in the
    face of hardship, and developing this optimism will do exactly that.


    The final trait in self-management is flexibility. A lot of people become attached
    to doing things a certain way and balk when a better method comes along. Others
    are so scared of change that they presume anything new must be bad. But a self-managed
    person will see those impulses as unhelpful and try to learn new ways of thinking
    and doing things.


    They do not experience change as a threat to their identity—the opposite, in fact.
    Because they are in conscious control, they can actively decide how they want
    to respond, what they want to value, and how they want to shape their experience.
    This helps them adapt and manage their expectations and emotions better.


    ## Self-Motivation


    Arguably a subset of self-management, self-motivation pushes people to meet and
    exceed expectations—because they know what emotions they want more and less of.
    They have a good guess on what will make them feel fulfilled, and they try to
    accomplish that constantly.


    Self-motivated people continually look for ways to improve their emotional state.
    They know what makes them tick, emotionally and otherwise, and try to set themselves
    up for success. You can supercharge your ability to do this by noticing when you
    or others complain. Complaints indicate problems, which are opportunities for
    improvement. When you find these, think about ways to solve the problem, and when
    you can make those solutions happen, get to it!


    ## Social Awareness


    People who are socially aware can read the room and understand the emotions that
    groups and individuals are likely feeling. At a group level, being socially aware
    means understanding the power structure and organization of groups, along with
    the emotional impact of those structures and the emotional currents that flow
    between one person and the next. It helps us interpret situations. Understanding
    that the secretary is happy to help her boss but is tired from overwork is part
    of social awareness.


    It’s also social awareness to know that she’s more replaceable and therefore less
    important and that both she and her boss are influenced by that dynamic. It sounds
    like an overwhelming amount of data to process, but it can be simplified to asking
    why people have certain behaviors with one person versus another and then finding
    the dynamic that causes it.


    Observing and interacting with people helps develop this skill. Whenever you see
    an interaction that puzzles or intrigues you, you can ask yourself why they’re
    saying and doing what they are to try to get a better grasp of relationship dynamics.
    The better you get, the easier it will be to find the right things to do in social
    situations of every size and type. Obviously, this is a massive oversimplification,
    but it begins with asking why something is happening and what unseen or unconscious
    elements are causing it.


    Ask yourself these questions, one at a time at first, and shortly they will become
    instinctual habit. It’s not an easy task because you can’t focus on one factor
    definitively. Each situation is different, and you must be adaptable in discovering
    why people feel what they do. Going through this checklist will assist you in
    reading people’s emotions in a way you may never have considered before.


    - How might your thoughts and actions be misinterpreted?

    - What are other people’s primary motivations and what unspoken, underlying motivations
    might they have that they (and you) are not even aware of?

    - Consider people’s built-in biases and life circumstances that give rise to certain
    emotions. What is their background and upbringing?

    - How do people display their emotions both positively and negatively?

    - How are emotions displayed in different ways?

    - What emotions are they likely to be feeling and why?

    - What is the purpose for what they are saying?

    - What is their baseline emotional state and preferred interaction style?


    By being aware of these factors, you increase your emotional intelligence because
    you are able to read people more accurately. And just as important, you can respond
    to them in a more calibrated manner that leads to fewer negative reactions. Notably,
    this process can take a while—exactly the difference between responding and reacting.


    At the most basic level, emotional intelligence is knowing the range of reactions
    to any given statement or circumstance and who might respond differently and why.


    If you insult someone’s mother in a serious manner and with a serious face, one
    reaction would be anger and being offended. You can expect that reaction a majority
    of the time. However, what are the other possible reactions, and what accounts
    for the difference? People might assume you are joking, laugh out of confusion,
    or ignore you.


    Emotional intelligence will allow you to connect with people on a deeper level
    because you understand them implicitly. This is what many people interpret as
    chemistry and rapport, naturally and instinctually. A final and important piece
    of emotional cues is to get better at understanding the subtext of a situation,
    which is similar to social awareness.


    ## That’s Not I Meant!


    Communication is much more than the words that we speak or hear. Studies have
    quoted figures stating that 50% to 90% of communication—the message and emotion
    we get from others—is based on nonverbal or unspoken signals, starting from Mehrabian
    and Ferris in “Inference of Attitudes from Nonverbal Communications” in 1967.
    Add that to additional communication based on subtext, context, implication, and
    inference, and you’ll almost wonder what impact actual words have.


    Whatever the case, what we think we are communicating is often overshadowed or
    outright contradicted by what is meant between the lines. It’s not that the words
    we use don’t matter—they do. But the way in which we use them, and the contexts
    we use them in, are far more indicative of our feelings and emotions. this is
    something we begin to learn as children.


    Unfortunately, for many of us, these small signs might as well be incantations
    for magic spells based on how subtle or convoluted they seem. One of the keys
    to communicating more clearly and being able to read between the lines of what
    people say is to understand subtext. To borrow from Chaney and Lyden’s 1997 publication
    “Subtextual Communication Impression Management: An Empirical Study,” in the context
    of an office environment, subtext is the following:


    Subtextual communication, a covert language that strengthens or negates the spoken
    text, is used to influence the impressions other people have of us and may be
    used for competitive advantage in numerous situations in the workplace (Fast,
    1991).


    Subtextual communication elements are related to image and may convey positive
    or negative impressions related to assurance, credibility, competence, and savoir-faire
    through dress, manner of.

