    It’s important to note that the positive events the subjects were talking about


    were not all major milestones that are commonly validated on a mass level


    —positive life-changers like graduation, marriage, or childbirth. Most of


    them were simply happy experiences or interactions, things that take place


    every day. But the validation of these smaller events was just as significant


    to the subjects, if not more. Hearing supportive remarks about them fostered


