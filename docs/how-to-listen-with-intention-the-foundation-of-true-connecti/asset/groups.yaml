    *this”—*but even that’s not completely necessary at this point. Your partner’s


    feelings should be center stage. And they have to know that they are. Your


    being able to comprehend and validate how they feel is much more


    important to them right now. They need the space to complete that


    expression on their own without getting cut off by a nice sentiment that


    means well. If you give them this opportunity, they will hopefully arrive at


    the same conclusion, and feel for themselves, *I’m going to be OK.*


    *6\. Radical genuineness.* This is related to the previous stage of normalizing


    your partner’s feelings and goes a step further. At the end of your


    communication, your partner should feel that they’re a real person


    experiencing valid feelings and *not* like someone who’s crazy and


    incompetent. Your endgame should result in your partner feeling loved and


    taken seriously—that you respect them as your equal, and they’re just going


    through an exceptionally hard time at the moment.


    When we express radical genuineness, what we’re doing is sharing a little


    bit of ourselves, and in being vulnerable and honest, we connect with the


    other person; we don’t just tell them that they’re not alone, we *show* them.


    Without giving advice or judgments, you might find it helpful to open up


    about a similar experience, to create trust and show that you know what


    they’re going through. You could say, “Did I ever tell you a similar thing


    happened to me when I was younger?”


    Consider, “I don’t know what it’s like to lose a dog, but my cat’s very


    elderly, and I worry about her dying all the time. I can imagine how it must


    feel like nothing could ever replace them.” Such a confession doesn’t


    dominate the conversation, but shows the other person that you can'
  - '[PAGE 98]


    empathize, that you understand, and that you’re there with them, sharing in


    the normal human experience of loss.


    This might be a good time for the expression *“I have faith you’ll get*


    *through this*,”since it relates to their being a normal person in a challenging


    situation. But it’s important to establish that *you* believe them to be that
    way


    —that you know they’re able to solve their problems or adapt to changes,


    that they’re not helpless or unable to make anything right. This is the


    definition of radical genuineness: treating and supporting your loved one as


    a human being that you trust and believe in, especially when they’re down.


    In this stage, only genuine, sincere connection will work. You cannot fake


    it! Relationships and friendships emerge from feelings of love, happiness,


    and satisfaction. But they’re *preserved* by shaping those sentiments into


    practicing validation, and that takes work and conscientiousness.


    Takeaways:


    Get into the hole with others—the holes that they have dug, not the


    one that you are digging beside them. Validation is a somewhat lost


    art. Validation is the act of showing respect and acknowledgment of


    people’s intentions and emotions. When we validate, we express


    that someone else’s experience, their thoughts, feelings, perspective


    and indeed they themselves, are valid, make sense and are


    understandable.


    It can be as easy as nodding your head, but it accomplishes the


    greater purpose of making people feel emotionally heard and


    fulfilled. At the most basic level, it consists of identifying people’s


    emotions and then justifying them. You first act as a detective to


    understand what you are dealing with, and then make people feel


    that they are completely reasonable in their emotional experience.


    Emotions are never quite rational, but they are always real.


    Many times when we try to validate, we actually worsen the


    situation by using invalidating statements. These are statements that


    dismiss or minimize people’s feelings, such as “Oh, you’ll be fine”


    or “You shouldn’t feel that way!” They’re prescriptive and try to'
  - '[PAGE 99]


    convince people to see the bright side of things—but that’s not what


    they are in need of at the moment.


    A helpful six-step path to validation is as follows: being present,


    accurately reflecting emotions, guessing emotions, understanding


    emotions in context, affirming emotions, and then being honest. It’s


    not always necessary or even possible to practice every one of these


    steps, but it’s worth moving through them progressively,


    considering context, your position and what the other person most


    needs from the conversation.


    We can be present by tuning out distractions, listening attentively


    and using silence. We can reflect by using paraphrasing, mirroring


    tone of voice, posture or language, or even using questions to gather


    more information. We can guess emotions by offering tentative


    suggestions for how the other person is feeling, then observing their


    reaction. We can then affirm these emotions by making statements


    that validate them as normal and understandable. Finally, we can


    show genuine compassion by revealing a little of ourselves, and


    being honest, to encourage real feelings of trust and connection.'
  - '[PAGE 100]


    **Chapter 5. Read and Analyze**


     


     


     


     


    ![](img/45836b3e8bea0ff9cf889d1699375515_100_0.png)


     


     


     


     


    Listening is really an exercise in *reading* people, isn’t it? People are rich


    sources of information, both verbal and nonverbal. When you learn to read


    others, you are taking in that information and then making as accurate as


    assessment as you can.


     


    There are ways to be a little more direct about this. In reality, deep listening


    is a subset of the skill of evaluating others. However, the common theme


    still remains of removing your own biases, desires, and goals from the


    equation, so that you can more clearly see the person in front of you for


    who they are. If you can’t achieve this first goal, you will set yourself up for


    interpersonal failure.


     


    The first way that we can generally read and analyze people better is


    through emotional intelligence.'
  - '[PAGE 101]


    **Emotional Genius**


     


    The best modern conception of emotional intelligence comes from


    psychologist Daniel Goleman.


     


    Emotional intelligence is knowing and perceiving the emotions *you* feel and


    why you feel them, then transferring that type of awareness onto others.


    You are able to put a label on your emotional state and find its cause and


    effect. By extension, emotional intelligence is being able to read other


    people’s emotions accurately and deduce the reasons for them.


     


    So, we can use our own inner reality as a model onto which we can pattern


    the inner realities of other people. When we are “emotionally literate” we


    can begin to see the same patterns in others, and recognize similar feelings.


    This, of course, takes a degree of self-awareness.


     


    When you start thinking “Why did she say that?” and “What made him do


    that?” instead of immediately reacting, that’s the beginning of your path to


    emotional intelligence. It’s a matter of understanding the whole causal chain


    of other people’s motivations and intentions and how that leads to their


    emotions, which lead to their behaviors.


     


    When we look closer at the hidden causes behind people’s words, thoughts


    and feelings, we see a whole universe of motivations, connections,


    associations, and goals, both conscious and unconscious. If we know how


    to examine this complex web, we can make better sense of other people,


    and understand *why* they are as they are.


     


    High emotional intelligence is like being able to read someone’s mind. In


    reality, this everyday superpower is not so complex and requires resisting


    powerful aspects of human nature that behoove us to focus only on


    ourselves.


     


    Take Charlotte. Charlotte prances into the office, her steps lilting and a


    smile on her face. Before sitting down, she asks her coworker a question:'
- md: '

    “What do you think of my new haircut?” Derek, her coworker, doesn’t care what
    her hair looks like whatsoever, but he likes Charlotte, and he also knows that
    she often worries about her looks. “It looks great,” he enthuses. “The new cut
    really brings out your eyes.”


    “I thought so too!” she gushes, taking her seat. “Thanks.” She smiles.


    Because Derek understood and cared about Charlotte’s emotions, he knew she was
    asking for encouragement and praise rather than an apathetic dismissal. Charlotte
    certainly didn’t want a detailed stylist’s review of her choices, especially from
    the likes of Derek. He read the situation and connected to her emotional state
    rather than to her simple and seemingly innocent question. His kind response bolstered
    her impression of his trustworthiness and kindness, raising her opinion of him.


    On the surface, Derek and Charlotte are having an ordinary conversation on an
    ordinary level. But really, the conversation is happening on a different level
    entirely—the emotional, unspoken, even unconscious one. Derek is probably considered
    a friendly, smart and kind guy because of his ability to read people like this.
    But he isn’t seeing some extra thing about Charlotte that nobody else can see—he
    is just taking the time to properly read what is already there.


    Every time you improve your emotional intelligence, you’ll have more interactions
    like these. It’s about understanding and consideration and stepping outside of
    your own desires and perspectives. Granted, telling someone their new haircut
    looks nice isn’t genius, but the same concept, when applied to bigger topics,
    can genuinely change people’s lives.


    Daniel Goleman’s modern conception of emotional intelligence can be described
    in four major categories. They all work together to create a blueprint for understanding
    and reading others more effectively.


    ## Self-Awareness


    When we’re self-aware, we know who we are, what we think, and what we feel. We
    know that when we get depressed, we’ll get less done. We know that when we drink
    coffee, we tend to be peppier and more productive. We understand that when we’re
    feeling stressed, we’re less likely to have patience for other people’s needs.
    We recognize emotion as an underlying basis for most of our actions—and can use
    understanding as our baseline for developing empathy for others, who are doing
    the same thing in their own way.


    In short, we have knowledge of what we feel, why we feel that way, and how our
    feelings will impact our behavior. We are experts at emotions—we are emotionally
    intelligent. Self-aware people are also able to observe the effects their emotions
    have on other people. Happiness and sadness alike tend to be contagious, and a
    self-aware person will know that their emotions impact and are impacted by their
    environment.


    Self-awareness also involves knowing our strengths and knowing our weaknesses,
    so we can adjust accordingly as we observe ourselves in the world. More importantly,
    it helps us be willing and able to accept advice and criticism. People who aren’t
    as aware of their real skills or value will either think they’re too incompetent
    and incapable of learning or that they already know everything and don’t need
    to be taught.


    Neither is true of anyone, and people who fall into those traps come off as lazy
    or as arrogant know-it-alls, respectively. When you can admit you need help and
    accept the help or advice offered, you show other people that you value their
    opinion and respect their knowledge. Accepting help makes the people helping you
    feel important and needed, which is something we all appreciate. Stop thinking
    about your faults as bad things; they’re really opportunities to make friends
    and learn new things.


    You can improve your self-awareness in a lot of ways. Overall, you just need to
    know yourself better. Professional-level psychological or personality tests can
    give some insight, as can asking your friends to rate you on various personality
    traits or skills. It’s also possible to watch how people respond to you when you
    do or say certain things and gain insight about what traits you have that contribute
    to their reactions. This takes a little patience and honesty.


    Or you can simply sit and reflect upon things you’ve done and ask *why*. And then
    ask *why* again. And then do it three more times—this typically allows you to
    cut through the defenses you’ve constructed around yourself and get to the heart
    of matters. Don’t just consider this moment right now, but all of your history
    and previous experience, including how you’ve behaved in the past and the outcome
    of those choices. Anything that gives you feedback about why you feel your emotions
    is useful.


    Take a step back and pause whenever you experience a strong emotion. Close your
    eyes and try to trace what happened in the past hour or two that led you to feel
    that way. Are there any facts or experiences in the past that would explain why
    you feel a particular way about certain things and people in your life? What is
    currently casting a subconscious shadow over your mood? By doing this, you are
    becoming a conscious and proactive participant in the unfolding of your own emotions,
    rather than just coming along for the ride.


    For example, if you’re angry at 6:00 p.m., start thinking about what you’ve done
    since 3:00 p.m. You’ve driven home, had a snack, changed into your sweatpants,
    and watched a little bit of television. When you visualize your drive home, though,
    suddenly remember that you were cut off by somebody and that you were still agitated
    hours later. This is a simplification of the process that begins to take place
    much more instantly. When you start digging, you might be able to excavate causes
    and amplifiers on the scale of days, weeks, or even years.


    The sad reality is that most people are not in tune with their feelings. They
    may feel them pretty strongly but lack awareness of their real source, which prevents
    them from ever taking charge of them or having empathy. Often, we are negatively
    affected by the emotional impact of things that have long been irrelevant. Most
    people just react automatically without realizing why and without stopping to
    think what is happening internally. They fall into patterns that are sometimes
    negative and sometimes destructive.


    Rather than looking inward and attempting to label your emotions based on what
    you might hypothesize caused them, you can also analyze how you are acting and
    label them that way. In the former, you are looking to the past to try to deduce
    a cause. In the latter, you are looking at the present to see the manifestation
    of emotion. In a sense, you are working backward from what you see and creating
    at least one theory about what caused it. Just as with other people, you can tell
    more about yourself by your actions than you can by what you say (or what you
    tell yourself). We all have favorite stories we like to tell about who we are
    and why things are as they are, but it can be incredibly useful to clear your
    mind of these occasionally and just look at what you really see. What is actually
    happening? Why?


    ## Self-Management


    The most fundamental aspect of self-management is the ability to keep emotions
    in check. When we’re ecstatic because we got a date with a dreamboat, we don’t
    let that excitement distract others in business meetings. When we’re angry about
    being overlooked for a promotion, we don’t let that impact our work relationship
    with our rival or our boss.


    We even work to stay calm, steady, and effective when situations are stressful,
    hostile, or dangerous. In short, it involves not letting emotions get the best
    of you. Now, this doesn’t mean we are ignorant of emotions or lacking in self-awareness.
    In fact, we can only really manage and modulate our emotions if we have some basic
    grasp of what they are. How can we master something we don’t properly understand?

    '
