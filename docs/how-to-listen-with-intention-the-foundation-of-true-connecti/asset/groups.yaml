  - '[PAGE 14]


     


    It’s now time to get self-conscious and introspective. Sociologist Charles


    Derber has studied this phenomenon extensively and believes that this form


    of conversational narcissism can occur without people even being aware it’s


    going on. It can be easy to imagine that conversational narcissists are the


    stereotypical loudmouths who dominate conversation—but it’s far subtler


    than this. It turns out that the situation can turn on a single word choice. He


    articulated what he called *support responses* and *shift responses*, and how


    they can subtly pervade our everyday vocabulary.


     


    Derber explains what he calls “initiatives” in conversation—which can be


    *attention giving* or *attention seeking*, the latter of which can be further


    divided into active or passive. This is a little like our tennis analogy—in


    tennis, we are always either returning the ball or receiving it from the other


    player, enacting a give and take. In a conversation, what moves back and


    forth is awareness and attention. These can bounce between people, or pool


    on one side of the conversation. For our purposes, you can guess which


    kinds of behaviors we want to orient toward. Let’s look at some examples


    of both in conversation.


     


    Let’s first look at support responses, which are what they sound like: words


    or behaviors that support the expression of the other person in the


    conversation. For the active, attention-giving variety, a “*support response*”


    maintains attention on the speaker and their topic—for example, asking a


    question about what’s been said. Support responses can be simple


    acknowledgements (“Oh really?” “Uh huh”), positively supporting (“that’s


    great!”), or in question form (“What did you say then?”). You can imagine


    the other person’s story is a balloon that everyone else is trying to keep


    aloft, jumping in here and there to bounce it back up into the air. For


    instance:


     


    “I love French films.”


    Response: “Which is your favorite?”


     


    The above response only exists to maintain attention and awareness on the


    original speaker. The response doesn’t interject any new information of its'
  - '[PAGE 15]


    own, but encourages the flow of attention already unfolding. Obviously, this


    can make people feel, well, supported! This is a great way to validate your


    conversation partner, let them know you’re listening, and send a strong


    message that you value what they’re saying and want to hear more.


     


    The “*shift response,*” however, is an active attention-seeking response that


    shifts the attention to the other person, in other words back to themselves.


    It’s an act of grabbing the spotlight and pointing it in the opposite direction.


    With a shift response, the flow of attention and awareness is suddenly


    diverted elsewhere. What’s going on when you see two people vying for


    attention and talking over one another? Their dialogue is made exclusively


    of aggressive shift responses!


     


    “I love French films.”


    Response: “Yeah? I’ve never cared much about movies. The other day,


    actually, I saw this thing at the cinema…”


     


    This isn’t to say that shift responses are always wrong—in context, they can


    work, especially if the other person subtly reclaims attention again.


    Sometimes it might even behoove you to use more shift responses to grab


    some of the spotlight, or make your feelings known. But how much are you


    using them?


     


    A shift response is a great idea if you want to move the chat along to


    another topic, or inject some fresh energy or ideas into the conversation. It’s


    a bad idea if you are simply trying to derail the existing conversation in


    your favor, so you can say what you want to say. Many people get together


    and talk this way, each announcing a different personal anecdote that begins


    with a shift response.


     


    If you have two people with poor listening skills, and both are hell-bent on


    shift responses, you end up with a wrestling match for attention, rather than


    a conversation. Maybe both parties are satisfying their lust for expression,


    but their gas tanks for being heard are running on empty. You may not


    notice if you are locked in this type of battle, but from the outside looking


    in, observing this kind of interaction can be curious and confusing.'
  - '[PAGE 16]


     


    Moreover, if a bad conversationalist (someone who continually uses shift


    responses) is paired with a very empathetic listener (someone who


    continually uses support responses), one party may well feel as though


    they’re having a good talk because the other person is consistently offering


    them support responses, while that person actually wants to jump off a


    bridge because the conversation is turning into an awkward pseudo-lecture


    on the other person’s life and beliefs.


     


    What about passive conversational narcissism? Naturally, some people are


    still quite aware of social norms and etiquette and so will vie for attention
    in


    subtler ways. One way of doing this is to fail to offer support responses,


    waiting till the other person’s thread dies away and you can take the


    limelight. Here, you are hoping that the other person runs out of steam so


    you can finally get your word in. It is like sitting in a tree and waiting for


    the prey to get tired and go to sleep—you know it will happen eventually,


    so you passively bide your time.


     


    Have you been part of a conversation where the other person didn’t offer


    any support responses, even a quaint “Oh really?” or “Uh-huh”? You’re not


    quite sure whether they’ve taken in what you’ve said, and that may be


    intentional on their part. It may have been a case of passive conversational


    narcissism. It’s like letting that balloon drop to the floor. You don’t have to


    do much to make someone else feel that what they’re saying hasn’t really


    “landed”!


     


    Most of us are taught that it’s polite to not ramble on, to take your turn and


    then rest, and to share space in conversations. Fine, this person will follow


    those basic rules. But they sure won’t encourage their conversation partner


    to speak more, lest it cut into their own speaking time! A lack of (genuine!)


    feedback from the other person can quickly make someone feel they ought


    to stop speaking—and this is where the conversational narcissist steps back


    into the picture.


     


    Though it’s tempting to try to catch other people in the act of conversational


    narcissism, its far more productive to learn to notice it in *yourself* and guard'
  - '[PAGE 17]


    against it. You can’t control what others do, but you can control your


    actions and how good of a listener you are. After all, that is the goal of this


    book. For the other purpose, you may want to seek a book on persuasion or


    hypnosis.


     


    The irony is it’s often those who are able to listen well, to step aside, and
    to


    take a genuine interest in their conversation partners who become people


    we think of as most interesting, charismatic and worthy of our attention in


    the first place. So the purported goal of conversational narcissism (*making*


    *darn sure that people know things about you*) isn’t even satisfied. Oops.


    Luckily, there are a few guidelines to battle these unconscious obstacles


    you’ll undoubtedly face.


     


    *Balance your needs and desires with other people’s*


     


    To do this, you first need to be aware of your focus and where it’s going.


    Pay attention to how the airtime is being distributed. Is one person doing all


    the talking? Is there a back-and-forth? This requires more than just playing


    at being interested in another person’s life—you genuinely need to forget


    yourself for a moment and engage fully, and honestly, in what someone else


    is saying. Stop thinking about your response for the future, and pay


    attention to what someone is currently saying to you.


     


    This means no rushing in to explain or frame what they’ve said so that it


    relates back to you again. Give more supportive responses, and guard


    against constantly referring every topic back to yourself. Ask questions to


    invite the other person to say more. If you take attention for a while, enjoy


    it—but volley it back again. Like we were taught as children: It’s good to


    share!


     


    “As you were talking, it made me think about this experience I had once,


    where XYZ. That made me wonder, did you find that XYZ was the case as


    well?” A person saying this demonstrates that they’re willing to share the


    conversation, rather than hog it all for themselves.


     


    *Think about ego, power, self-esteem and control*'
- md: '

    Those who seem most boastful in a conversation, who jealously guard attention
    or speak over others, are often those who feel most insecure in themselves. Their
    need to control the conversation comes from a hunger for attention and approval.
    If you find yourself using conversations as a platform to boost your ego, feel
    better about yourself or be witnessed and supported by others, your work may be
    to learn to be comfortable taking the back seat for a change. The paradox is that
    people who seem most likeable and confident are those who don’t appear to be making
    frantic efforts to dominate others’ attention.


    ## Be egalitarian


    Do you have any unconscious beliefs about what conversations are actually for?
    Some people speak because they want a soapbox to share their opinions, or they
    want to “teach” others and tell them exactly what’s what, or simply to demonstrate
    superiority in some way or another. Become aware of *why* you’re conversing. Are
    you genuinely curious about the human being in front of you? Have you already
    made up your mind about them, or do you simply see them as an audience for your
    agenda (which you refuse to stray from), a sparring partner, a competitor?


    Good listeners stay in the moment, and don’t get distracted with their own concerns
    when they’re meant to be focused on someone else. Try to treat conversations as
    pleasurable opportunities to give and take, and to witness another as much as
    revealing oneself.


    Does it frequently end up being the case that your conversation partners know
    a ton about you, but you don’t know very much about them? This would mean that
    the flow of information is decidedly one-sided, and that you are monopolizing
    the air space. Do you actually ask others questions? When is the last time you
    asked five questions in a row?


    All of this leads us round again to the most important conversation skill—listening.
    Great communicators tend to speak *less* than poor communicators. Though the ego
    might not like it, the truth is that you don’t become a good conversationalist
    by telling the best jokes or stories, by being the most interesting or impressive,
    or by speaking the most. You do it by being humble, friendly, and intrigued by
    how interesting *other people* are. *The secret is to be more interested than
    interesting.* Learn, rather than teach. Listen, rather than speak. Allow others
    to express, knowing there’s enough to go around. Connect rather than impress.
    Share or participate in a story, rather than merely telling it.


    ## But They’re Boring…


    No, you are.


    You may have read through the previous sections and wondered how realistic it
    is to be completely enthralled with what another person is saying. It can certainly
    make people feel good to be the center of your attention, but what if you literally
    don’t feel it?


    It’s not a great thing to admit, but many of us secretly think that other people
    simply aren’t that interesting, and it’s hard to care about what they have to
    say. After all, what could be more interesting than all the things going on in
    our own lives, from our own perspective? It’s tempting to look at the work it
    takes to listen to someone’s seemingly mundane story and decide you’d rather not
    bother.


    We can sometimes miss the point. Sometimes, it’s a question of unrealistic expectations.
    A conversation doesn’t necessarily have to blow your socks off or be massively
    useful to you to be worth taking part in. And of course it’s normal to not be
    interested in literally everyone you meet—some people will spark curiosity, others
    less so. Finally, it’s not necessary at all to fake it, or act in ways that drain
    and bore you. Frankly, it is possible to be a warm and friendly person with a
    good social life who doesn’t launch into ecstatic conversation with everyone they
    encounter.


    ***But*** here’s where socially successful people have a subtler understanding
    than those who love calling themselves introverts or feel like other people are
    boring and not worth their time. We need to give other people a chance. After
    all, do you think that *you* would appear massively interesting to the average
    person if they just saw you walking down the road? Or if they spoke to you for
    three minutes at a party? You probably think there’s a lot more to you as a person
    than what you can convey in a quick chat. So, remember that this is true of others,
    too.


    Have a little faith, suspend judgment and—again—just listen. Drop any preconceived
    ideas about what makes a person interesting—some of the most fascinating people
    are out there, just a few pointed questions away from being discovered. Be open
    to being proven wrong, to being surprised. Decide to actively look for the good
    and the interesting in others. It’s an old adage that “you can learn something
    from everyone,” and it’s true. Look at conversation as a means of finding out
    exactly what that thing is.


    If you immediately judge someone as uninteresting, they will undoubtedly remain
    that for you. Judge them differently, and they will become that as well. Use this
    to your advantage.


    It’s rude to assume people are boring simply because they don’t wow you after
    a few minutes, especially when you may be assisting in it by lobbing boring questions
    at them. This in itself can be rather narcissistic—to think of other people in
    terms of their entertainment value to you, rather than as individuals in their
    own right. When you don’t really know someone, it’s hard to be concerned about
    the mundane details of their lives, but you’d certainly care more if they were
    very important people to you.


    The idea is that people are not boring, exactly, but just that you don’t know
    them well enough to care. You can see the catch-22—you can only get to know someone
    if you first go through the “boring” small talk and try to forge a closer connection.
    Being sociable is something that builds on itself. It starts with extending a
    gesture of goodwill to the other person. You don’t know that they are interesting,
    but you hope and expect they are, and reach out in faith that your investment
    will be worth it later. You don’t need to force anything. Just be open and receptive
    and give it a go—at least for while. Even if you never uncover something of interest
    in talking to another, you can still do so with compassion and politeness, and
    you may just learn something about yourself in the process—how to be a better
    conversationalist, for one. Some people will take more than one conversation to
    open up.


    You may be surprised what happens if you have the expectation that you will find
    something delightful. People can have unexpected hobbies or out-there experiences,
    skills, values and so on that may be of interest. Go beyond the surface and ask
    how your conversation partner feels about certain things. You can always divulge
    a little about yourself first to put them at ease. Along this vein, you might
    need to “go first” sometimes when opening up with people. Give unexpected answers,
    be truthful and make an effort at being honest and genuine. People are often more
    than willing to respond in kind.


    If you’re *still* not convinced that anyone has anything interesting to tell you,
    it may legitimately be a case of not hanging around with the right kinds of people.
    You may need to seek conversations with those you have more in common than coworkers,
    fellow students or even family members—who might be easily available conversation
    partners, but won’t necessarily be your “people.”


    Sometimes, broadening yourself and the range of things that interest you has the
    effect of making other people seem more interesting. Dabble, take risks, and avoid
    assuming you know what things are before you try them. Failing to properly listen
    to others could be part of a broader discomfort around other people, feelings
    of low self-worth, depression, anxiety or an unhappiness in your own life.


    People who have been bullied or mistreated by others can take a haughty, condescending
    tone as a defense mechanism, or a way to cover up the fact that it’s *others*
    who don’t like *them*. As we’ve already seen, having the perspective that others
    are enemies or rivals can kill a social life.

