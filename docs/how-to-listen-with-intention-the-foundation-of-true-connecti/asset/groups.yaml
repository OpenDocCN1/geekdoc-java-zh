    行动，而内心，嗯，这一切关乎情感和人的福祉。再次，要意识到你所处的位置，以及如何向关注人/情感/内心的听风格转变。


    “框架”（Frames）是想象倾听风格的不同方式。框架更具流动性，它只是要求你考虑对方互动的整体目标或目的是什么。他们的目标是什么，你的目标是什么，它们彼此匹配吗？如果不匹配，就利用你的新理解让它们匹配。思考框架的一种简单方法是将其看作一个戏场景。所有演员都在同一频道上，朝着同一个目标努力，并试图捕捉情感上的回报。如果其中一个演员想即兴发挥一下，详细阐述他们角色对大海的热爱，会发生什么？不会有什么好结果。


    最后，我们谈到了倾听的层次。与倾听框架和风格不同，这些倾听层次中的某些非常糟糕。这些层次是：忽略、假装倾听、选择倾听、专注倾听和共情倾听。前两个层次没有太大用，只有当我们达到共情倾听的最高境界时，我们才把自己排除在外，为了听见而听，而不是为了回答而听。我们大多数人在日常互动中，大部分时间都停留在前三四层次。


    ## 第三章 听某人的艰巨工作


    两个人在咖啡馆里，在很久没聊天后“叙旧”，讨论着这件事情和那件事。


    安杰拉：“我已经试着跟他谈了很多次关于这件事了，但我不得不说，他似乎并没有真正*理解*，你懂吗？”


    克里斯汀：“嗯——你什么意思？他哪里没理解？”


    安杰拉：“感觉就像……我以前听人说过，女性从知道自己怀孕的那一刻起就成了母亲，而男人只有在孩子出生后才成为父亲。感觉就是那样。也许他还没进入状态……”


    克里斯汀：“就像他和你不在同一个频道上……”


    安杰拉：“没错。而且我觉得对他来说，这一切似乎仍然很抽象，好像还没有真正入到心里。我的意思是，我很同情他，但我不知道……”


    克里斯汀：“噢，我理解你。看起来你很同情他，但也有其他什么。”


    安杰拉：“有的。我想我可能有点失望？也许我只是担心自己真的要独自承担这一切，而这并不是我们约好的。这*不是*我以为我们要做的。我们是一个团队。”


    克里斯汀：“你本以为你们是……某种同舟共济的。”


    安杰拉：“是的。但当我跟他交谈时……感觉并不那样。好像他搞得像*是我*怀孕了，而他只是个旁观者。我的意思是，我不想说他的坏话……”


    克里斯汀：“当然不想！看起来这并不是一个容易讨论的话题。”


    安杰拉：“我能说什么呢？我觉得从心深处我只是……在这个时候他可以离开，你懂吗？而我是那个*真正*在做这一切的人。这合理吗？”


    克里斯汀：“噢，完全理解。你觉得是你担心他离开吗？”


    以此类推。在上面的对话中，两个人说话的时间几乎相等，但其中一个人显然在说话和表达，而另一个人显然在倾听——积极地倾听。如果你回头看这段对话，你会发现倾听者或或少地将相同的内容重复给说话者，尽管是重新组织了信息，有时将其设定为一个问题，或者简单地提供鼓励和支持（“噢，我理解你”）。


    实际上并没有说什么内容，但它引发了巨大的反应和某种程度的详述，显示了安慰和情感上的满足。关键在于说话者可以真正感觉到他们被听见了，而这是我们在倾听时所做的一部分——而不只是保持沉默。


    对话中的说话者可能感到受到了非同常的倾听和支持。另一个人给了他们全部注意力，不仅仅是听见，而是与所说内容（包括事实和情感层面）进行了深度互动。然而，倾听者并没有插进自己的想法，而是熟练地反映并总结了他们听到的内容。重要的是，这不仅仅是逐字地重复所说过的话。倾听者偶尔还会“测试”他们的理解力——“听起来你的意思是这样，是吗？我理解对了吗？”


    这清晰地传达了倾听者在对话中的目标是深度理解说话者。事实上，这就像倾听者正在积极帮助说话者表达观点，利用线索并引导他们。这样的对话通常能带来更深层次的洞察和理解，那种让人们感到被理解、被连接，并觉得自己积极解决了某个问题或冲突的对话。你可能觉得自己正给予某人全部注意力，但除非你以一种让他们感受到这种注意力的方式参与其中，否则等同于没有发生。


    这就是让人们彼此靠近的“深度交谈”（相对于“闲聊”）。当两个优秀的对话者相遇时，他们可以轮流积极倾听，对话不再是自心自大、寻求关注、争论或琐碎闲聊的练习，而是变成了一个建立意义连接、享受他人陪伴、解决问题并挖掘生活中精彩话题的平台。


    事实上，尽管这是“深度交谈”，但你可以看到它能够用寥寥数语直击问题核心。一小时关于无关无紧的“闲聊”可能永远无法达到这种深度的理解和连接。


    也许上面的对话让你想起了优秀的心理学家会做的事情，而且这种方法确实被著名的心理学家卡尔·罗杰斯深入探讨过。他认为，在治疗性会面中的“无条件积极关注”以及积极倾听和反映是转化性对话的关键——而治疗归根结底仅仅是对话的一种形式。


    ## 积极倾听


    倾听不是被动的。许多人抵制倾听，因为他们将其视为一种不愿让出的舞台、故事中一个无聊的角色，他们必须坐在那里等别人给他们机会。他们把倾听看作是死空间，什么都不做。这是一种灾难性的心态，因为只有当双方都积极参与时，对话才有效。错误在于认为说话比倾听更有趣或更主动。事实完全并非如此。再次，占据光灯与某人建立联系是完全不同的目标。


    卓越的倾听者知道一些糟糕的倾听者不知道的事情——听某人说话并分享与说话一样愉快，也许甚至更甚。打开一个人的内心并让真实的情感流淌出来可能同样令人满足，甚至更多。工作并不非得像静静地坐着点头那样无聊。它可以非常主动，几乎就像解开谜题——如果你能使用正确的反应的话。这正是积极倾听的意义。


    我们在上一章中讨论了倾听的五个层次。我们如何达到最高境界？就像学习读写需要练习一样，积极倾听的艺术也是如此。


    积极倾听是你武器库中建立关系最强大的技能之一。它建立了对对方观点的尊重和关心，并让你更容易处理通过被动倾听难以理解的复杂信息。它还缓解了沟通过程：积极倾听帮助你了解对方的需求是什么，从而让你的反应不再谨慎、更加开放。

