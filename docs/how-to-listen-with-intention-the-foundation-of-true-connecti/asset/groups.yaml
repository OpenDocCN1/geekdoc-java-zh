    ## 倾听的五个层次


    在我们继续探索不同风格和框架的过程中，我们将在本章节最后讨论倾听的不同层次，以及哪种方式对于成为深度倾听者来说通常更有效。*与之前不同*，这些倾听的某些层次并没有特定的用途，它们只是展示了关注程度和注意力慷慨程度的变化。


    我们经历着五种不同的倾听层次，从完全的无知到几乎消耗所有注意力。在生活的大部分时间里，我们都处于漂浮在前四个层次，这四个层次至少反映了某种程度的自我利益。换句话说，在这四个层次中，我们仍然使用自己的参考点来解释对方所说的话（如果我们在听的话话）。我们许多人最好也只能达到第四层，即使在那个阶段，我们内心深处的意图也可能带有些欺骗性。


    说实话，我们中有些人从未真正达到最深层的第五层，尽管它是最重要的阶段，也是我们应该努力的目标。它涉及到对对方所说内容的完全专注和投入。达到这种状态异常稀有且难以维持。但为了推动关系中的沟通，我们*努力*达到那个最深层的水平至关重要。


    以下是我们所讨论的层次：


    - 忽视（Ignoring）

    - 假装倾听（Pretend listening）

    - 选择性倾听（Selective listening）

    - 专注倾听（Attentive listening）

    - 共情式倾听（Empathetic listening）


    ### 1. 忽视


    我打赌这一层次显而易见：它根本没有在听——就像一只头埋在沙里的鸵鸵。无论你是心不在焉、忙于其他事情，还是完全不在乎，忽视对任何试图和你说话的人来说都是直接的打击。这就像对方过网发来一个网球，而你看都不看就让它滚走了。


    *A 人：* 我在担心我们的儿子。他在网上花了大量时间，在现实世界中再也不和任何人互动了。

    *B 人：*

    *A 人：* 感觉就像他对与任何人建立真正的关系完全没有兴趣。这让我我很担心。

    *B 人：*

    *A 人：* 喂？

    *B 人：*

    *A 人：* 另外，他刚刚把我们的 minivan开进了河里，并在我们的客厅里为黑暗主宰祭动物。

    *B 人：*

    *A 人：* 你听进我说的一个字了吗？

    *B 人：* 嘿，看那只松鼠！


    忽视可能是故意的（像上面那样完全无礼），也可能是粗心和心不在焉，但效果是一样的：对方会感到完全的挫败且未被听见。这一层次没什么好说的。它是最糟糕的沟通。B
    人对 A 人的观点完全不感兴趣，除非有某事引起他们的个人兴趣，否则他们不会努力说任何话。这种第一层次的沟通需要尽快摆脱。（但请记住，某人*无法*听见你并不是忽视，所以如果可以，请大声说话。）


    ### 2. 假装倾听


    这在面对面的交流中最为常见。我们*看起来*在听，但并没有完全投入到对方所说的话中。我们的眼睛可能会变得空洞，看起来并没“全神贯注”。我们做出能想象出的最细微的反应，好让自己看起来在接收所有信息。但实际上，我们是在敷衍了，像一个无聊的走廊管理员。我们知道自己可能应该关心，所以做出了戏戏。这甚至不属于不同的倾听风格或框架，除非你对话的框架是为了安抚某人并做一个假朋友。


