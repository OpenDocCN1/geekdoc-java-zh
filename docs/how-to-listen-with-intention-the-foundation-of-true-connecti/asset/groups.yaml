    ### 3. 选择性倾听


    在这个层次上，我们开始给予对方真正的注意力——仅到某种程度。只要说话者说的是我们认同或同情的内容，我们就和他们在一起。但如果他们改变方向，提出了一个与我们不契合的想法，就会回到假装倾听或忽视他们（对话自恋狂们，是你吗？）。这可能是对我们我们产生抵触的情绪、我们不在的故事或我们不同意见的陈述的反应。我们最初听起来很投入、很关注，但在转折点，我们会退缩到自我关注的壳里。这比之前的层次注意力更多，但它是*条件性*的倾听。


