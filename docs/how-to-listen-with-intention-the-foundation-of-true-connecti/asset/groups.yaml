    确保说话者能*感受到*你和他们处于同一个频道上。毕竟，如果倾听只是发生在你的脑子里，而没有传达给对方，那么倾听还有什么意义呢？


    *理解。* 主动倾听的第一步，当然是首先理解对方在说什么。如果和我们说话的人使用的语言和我们平时的一一样，那么这个过程是相当自动的。


    但还有其他潜在的障碍——例如，如果对方使用了许多我们不熟悉的术语或俚语，或者在代际、社会地位或文化上存在我们并不十分了解的差异。最重要的是，你只需要确保自己和和说话者处于同一个情感频道上，这样你就能确定他们当下的需求和愿望。


    当我们不懂某人在说什么时，一个非常棒的问法是*“你能像对五岁孩子解释那样向我解释一下吗？”* 五岁的孩子有足够的词汇来对话，但需要别人用非常有耐心、且缓慢的方式使用他们已经掌握的词汇来描述相对复杂的情况。特别是如果你认为对方担心表现得傲慢或居人临下，要求他们像（比如）*比你的实际年龄小得多*那样来描述某事，可以让他们感到更轻松一些。


    其他寻求帮助理解的表述包括：

    - “发生了什么？”

    - “给我听你的故事。”

    - “你什么意思？”

    - “多告诉我一些。”

    - “你能为我澄清一下这部分吗？”


    不要害怕表现得愚蠢或打断别人。大多数人喜欢感觉自己像专家，而我们都是自己自身经历的专家。有时，完全透明地承认自己的理解不足是有用的——只要你将其归类为你听得更加仔细的原因，以便你学习！


    *留。* 保留信息不仅仅是记住刚刚听到的话，更是听出说话者试图表达的内容，以便我们给出恰当的回应。你在这里试图获取整个故事，这远超简单的事实和事件。目标是尽可能让自己置于说话者的立场，当然，为了这一点，提问是必不可少的。


    当我们听某人说话时，我们倾向于只保留那些引起我们个人共鸣的细节，或者符合我们最习惯的信息留方式的细节。但这只是我们的视角，对于成为一个更好的倾听者并没有特别帮助。


    例如，如果有人在告诉我们他们去约约会的经历，我们可能是那种记得活动物理细节的人（他们去了哪家餐厅、看了什么电影、穿了什么）。或者我们可能会想起关于约会整体的更通用的叙述（对方是什么性格、那次约会“感觉如何”、与过去其他约会相比如何）。


    我们可能甚至没有注意到自己在挑选叙述中那些触动我们神经的片段，并在内心开始为自己构建一个与对方提供的略有不同的故事。你可能也经历过这种情况：当你告诉某人某事时，他们似乎只抓住了故事中一个绝对不是你关注重点的方面。这绝对是一种“身在心不在的听”！


    在对话中，我们通常会寻找自己说话和“发表自己见解”的机会。这很正常，但它不利于主动倾听。为了正确地保留对话伙伴告诉我们的内容，我们必须收起自尊，完全集中在对方正在陈述的话语上。这关乎他们的解释，而不是你的诠释。


    再次，提问是构建问题并保持你的注意力集中在对方表达上的有力工具。为了确保你留住了所有需要的相关信息，你可以问：

    - “这对你来说意味着什么？”

    - “而且为了清楚起见，发生了什么？”

    - “你怎么看？”

    - “那是如何进入故事的？”

    - “这让你感觉如何？”

    - “你的反应是什么？”


    *回应。* 主动倾听需要努力形成一个恰当的回应——否则说话者可能会觉得像在对着墙壁说话。正如多次提到的，倾听绝不是被动的！你正在倾听、理解并记录；一个有效的回应将证明你理解了说话者所说的一切，并捕捉到了他们的非语言交流。想象你正在和某人说话，而你不确定他们是否理解你的语言。他们没有迹象表明你听到了吗？这就是回应的意义。


    和保留一样，重要的是回应不要染上你自己的自尊或想法。你不希望以试图引导、操纵或根据自己的意图来回应的方式。尝试回应对方的想法和感受，而不产生偏见：


    - 说话者：这就是为什么我不喜欢参加聚会。

    - 回应者：这听起来太疯狂了！你当时感到很困惑吗？

    - 说话者：与其说是困惑，不如说是很失望。

    - 回应者：这一定考验了你的耐心。对吗？

    - 说话者：有一点点。但最重要的是，这证明了我必须做出改变。


    主动倾听的回应应该反映说话者所说的话。它们应该表现出对对方想法和感受的深层兴趣。而不是表达*自己的*意见和观点，良好的倾听回应有助于双方做出自己的发现。


    在给出优质的回应时，尝试回应对方的想法和感受——事实内容往往没有那么重要。你可以通过用自己的话复述他们所说的话来做到。在完全理解对方传达的一切之前，保持他们的立场；引入一个与当前情况无关的建议或想法可能会太突兀或分心。即便如此，也要尽量压制判断。


    一些积极的倾听的回应可能是：

    - “我对你的故事很感兴趣。”

    - “这听起来是一个_____的情况。”

    - “我理解你会有那种感觉。”

    - “我觉得有些需要改变——你希望发生什么？”

    - “你对这种情况感觉如何？”


    主动倾听的总目标是完全掌握说话人的观点或生活经历，并以一种有意义的方式吸收这些信息，从而引发新的认知和理解。你想向对方展示你可以进入他们的世界，并从他们的视角来看他们的经历。为了实现理解、记录和回应的目标，你可以采用以下几种或技巧：


    *复述。* 用自己的话转述对方的情绪是促进理解的极佳方式。重要的是*不要*像鹦鹉一样重复他们说的话，而是展示你抓住了他们表达的精髓。你会将其视为之前讨论过的“支持性回应”。你让他们知道你听进去了并且和他们处于同一频道。如果你不是100%正确，他们几乎会纠正你。

    - 说话者：那个情况让我很困惑也很害怕。

    - 你：那感觉一定像是一个危险的时刻——当时很难知道怎么办。


    *反映。* 复述的另一种方式是根据情感而非事件或情节来构建你的回应。反映让说话者的故事进入更深层次，证明你掌握了局面。直接告诉他们，或询问他们他们正在经历的情绪。

    - 说话者：最后，我爸爸说他早就知道我进不了那所大学。

    - 你：太糟糕了。这听起来像是一种残酷的拒绝。


    *总结。* 尝试口头上将说话者故事细节总结成一个简洁的形式，显示你对整体情况的掌握。这与复述相似，但你追求的是更广泛的概括。你也可以将其视为对你理解程度的测试。可能陈了许多观点和论点，你可能忽略了主要的这种、行动或目的。

    - 你：所以面包师搞错了你的订单，晚餐烧焦了，他们还派了一个魔术师而不是小丑。老兄，如果那是我孩子的生日派对，我会气炸的！


    *标注情感。* 经常，说话者会迷失在向你描述的实际和物理细节中。尽可能敏感地尝试识别出他们尚未能具体用语言表达的情绪。这在本质上并不困难，因为你只需要说明一种正面或负面的感受，但当你准确标注某人的情绪时，你会被视为读心者。只要注意不要越界或试图将你自己的想法注入这件事中。

    - 说话者：我的老板终于为忽略我的工作道歉了，并向我保证从以后会多注意。

    - 你：哇，我猜你现在感到非常释脱并觉得得到了证明——更不用说还有点小自豪了。

