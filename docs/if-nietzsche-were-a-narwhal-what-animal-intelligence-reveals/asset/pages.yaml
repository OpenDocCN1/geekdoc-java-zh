  md: 'Here’s a pro parenting tip: Telling your tween to “stop being so negative”
    is


    pointless. Instead, why not try an old-school behavioral manipulation


    technique: operant conditioning. It’s such a powerful means of


    unconsciously modifying behavior that you can use it on your child even if


    they are fully aware that they’re being manipulated.


    With the goal of getting my daughter to be nicer in the mornings, I sat


    her down and explained how my operant conditioning plan for her was


    going to work (and what operant conditioning was). The basic idea is that


    she would get an immediate, positive reward every time she produced a


    desired behavior. In our case, she would receive one piece of cheese


    popcorn every time she said something nice. Soon, her brain would make


    an indelible association between saying nice things and getting a yummy


    treat. Her subconscious mind would then prompt her to generate positive


    statements to get the endorphin hit that comes with popcorn consumption.


    This is exactly how a scientist might approach an animal behavior


    experiment, but in this case, I could tell my animal subject exactly what was


    in store for her. We both accepted that what we were doing was trying to


    train her brain to generate more happiness, a goal she was fully on board


    with.


    And it worked like gangbusters.


    Each morning, I would fill a Ziploc bag with cheese popcorn and carry


    it around with me, tossing her a piece whenever she said things like “It’s


    cold out this morning, but at least I have a warm jacket.” Or, “I’m looking


    forward to eating macaroni and cheese for lunch today.” Our mornings were


    suddenly brighter and happier, and everyone’s mood improved. She wasn’t


    necessarily happy to go to school, but she was happier than she was before.


    This is one of the oldest methods that brains have for generating


    decisions. From fruit flies to tweens, brains learn quickly that generating


    certain behaviors will result in immediate positive (or negative)


    consequences. It’s a simple, ancient decision-making hack that generates a


    kind of heuristic. In psychology, a heuristic is a mental shortcut or rule of


    thumb, often unconscious, that helps us make quick decisions. My daughter


    no longer needed to waste time thinking about the half a dozen possible


    things she could say around the breakfast table, and micro-analyze the


    extent to which each remark would annoy her parents. Instead, operant


    conditioning shoved her brain down the path of pleasantness.'
