  md: 'look after him. Elisabeth had always longed for her brother’s approval, but


    Nietzsche had spent a lifetime dismissing her. When they were children, he


    nicknamed her *llama,* apparently due to the fact that llamas are such


    “stupid” and stubborn animals that, when maltreated, refuse to eat and will


    “lie down in the dust to die.”^(16)


    Unfortunately for Nietzsche (and the rest of us), Elisabeth was a far-


    right German nationalist. She helped establish the town of Nueva Germania


    in Paraguay with her husband, Bernhard Förster, in 1887. It was intended to


    be a shining example of a community based on the supremacy of the Aryan


    race—a new Fatherland. Förster was a vocal anti-Semite who once wrote


    that Jews were “a parasite on the German body.”^(17) Nueva Germania,


    however, quickly failed; the early Aryan settlers died of starvation, malaria,


    and sand flea infections.^(18) Sand fleas, it turns out, are a non-metaphorical


    parasite that can live happily on the anti-Semitic body.


    Humiliated by the town’s failure, Bernhard took his life, and Elisabeth


    returned to Germany where she ended up looking after her now helpless


    brother. Nietzsche was no anti-Semite and wrote disparagingly of both anti-


    Semitism and fascism.^(19) But Nietzsche was in no state to argue; by the time


    she arrived to care for him, he was partially paralyzed and unable to speak.


    After his death in August 1900, Elisabeth took full control of his estate, and


    was able to retcon his philosophical writings to fit her white-supremacist


    ideology.


    In a bid to make herself popular with the rising fascist movement in


    Germany, she combed through Nietzsche’s old notebooks and published a


    posthumous book titled *The Will to Power,*^(20) which she pimped out to her


    fascist friends as a philosophical justification for their belligerent ideologies


    involving the subjugation (and eradication) of the “weaker races.” Despite


    needing a tutor in the form of the famous Austrian philosopher Rudolf


    Steiner to help her understand her brother’s ideas, and despite Steiner


    stating that “her thinking is void of even the least logical consistency,”^(21)


    Elisabeth had great success in portraying her brother as the intellectual


