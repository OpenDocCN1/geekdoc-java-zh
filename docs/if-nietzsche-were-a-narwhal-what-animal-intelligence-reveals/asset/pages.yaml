    causing everything to work better? Nobody knows. At the core of the study


    of intelligence in the human mind is this utter confusion as to what we’re


    even talking about.


    Then we have animals. If you want to highlight the slipperiness of


    intelligence as a concept, just ask an animal behavior researcher to explain


    why crows are more intelligent than pigeons. You’ll often get an answer


    from folks like me along the lines of, “Well, you really can’t compare the


    intelligence of different species like this.” Which is code for “the question


    doesn’t make sense because nobody knows what the hell intelligence is or


    how to measure it.”


    But if you want the final nail in the coffin showing that wrangling


    intelligence is difficult bordering on ridiculous bordering on impossible,


    look no further than SETI: the search for extraterrestrial intelligence. This
    is


    a movement inspired by an article in *Nature* published in 1959 by Philip


    Morrison and Giuseppe Cocconi—two scientists from Cornell who


    suggested that if alien civilizations were trying to communicate, they’d


    most likely do it through radio waves. This led to a gathering of scientists at


    Green Bank in West Virginia in November 1960, where the radio


    astronomer Frank Drake introduced his famous Drake equation, an estimate


    as to the number of extraterrestrial civilizations in the Milky Way intelligent


    enough to generate radio waves. The equation itself is full of wildly


    estimated (i.e., pulled out of thin air) factors, including the average number


    of planets that could support life, and the percentage of those planets that


    might go on to evolve intelligent life.


    The thing about SETI and the Drake equation is that they don’t even


    bother to provide a definition of what intelligence is. We are all just


    supposed to know what it is. It’s that thing that results in a creature’s ability


    to create radio signals. By that tacit definition, humans were not intelligent


    until such time as Marconi patented the radio in 1896. And we’ll probably


    stop being intelligent in a century or so when all our communication is


    handled by optical transmission instead of radio. This silliness is why Philip


    Morrison always hated the phrase *the search for extraterrestrial*


    *intelligence,* stating, “SETI has always made me unhappy because it


    somehow denigrates the situation. It wasn’t the intelligence we could


    detect; it was the communications we could detect. Yes, they imply'
