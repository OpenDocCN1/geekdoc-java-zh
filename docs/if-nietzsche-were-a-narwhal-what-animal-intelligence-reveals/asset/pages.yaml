    This brand of cognitive dissonance is what I call *prognostic myopia*.


    Prognostic myopia is the human capacity to think about and alter the future


    coupled with an inability to actually care all that much about what happens


    in the future. It’s caused by the human ability to make complex decisions


    availing of our unique cognitive skills that result in long-term


    consequences. But because our minds evolved primarily to deal with


    immediate—not future—outcomes, we rarely experience or even


    understand the consequences of these long-term decisions. It is the most


    dangerous flaw in human thinking. So dangerous that it might lead to the


    extinction of our species. Which is why I will dedicate a whole chapter to


    explaining what prognostic myopia is, how it came into existence, how it


    affects our everyday lives, and why it’s an extinction-level threat to


    humanity.


    What is prognostic myopia?


