  md: 'complex thought, in all its forms throughout the animal kingdom, is often a


    liability. If there’s one lesson we can learn from the tortured life of Friedrich


    Wilhelm Nietzsche, it’s that thinking too hard about things isn’t necessarily


    doing anyone any favors.


    What if Nietzsche had been a simpler animal incapable of thinking so


    deeply about the nature of existence, like the Turin horse or one of those


    cows he pitied/envied so much? Or even a narwhal, one of my favorite


    marine mammals? The absurdity of a narwhal experiencing an existential


    crisis is the key to understanding everything that is wrong about human


    thinking, and everything that is right about animal thinking. For narwhals to


    suffer a Nietzsche-like psychotic break, they would need to have a


    sophisticated level of awareness of their own existence. They’d need to


    know that they were mortal—destined to die one day in the not-so-distant


    future. But the evidence that narwhals or any animals other than humans


    have the intellectual muscle to conceptualize their own mortality is, as we’ll


    see in this book, thin on the ground. And that, it turns out, is a good thing.


    What is intelligence?


    There’s a puzzling gulf between the way humans understand and


    experience the world, and the way all other animals do. There’s never really


    been any doubt that there’s something happening in our skulls that isn’t


    happening in the skulls of narwhals. We can send robots to Mars. Narwhals


    can’t. We can write symphonies. Narwhals can’t. We can find meaning in


    death. Narwhals can’t. Whatever our brains are doing that results in these


    miracles is clearly a result of that thing we call *intelligence*.


    Unfortunately, despite our utter confidence in the exceptionalism of


    human intelligence, nobody really has a clue as to what intelligence is.


    That’s not just a glib statement to say that we don’t have a good working


    definition. I mean that we’re not sure if intelligence even exists as a


    quantifiable concept.


    Consider the field of artificial intelligence (AI). This is our attempt to


    create computer software or robotic systems that are, as the name implies,


    intelligent. But AI researchers are not on the same page as to how to define'
