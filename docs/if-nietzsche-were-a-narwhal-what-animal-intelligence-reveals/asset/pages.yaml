  md: 'Epilogue


    *Why save a slug?*


    My front garden is overrun with slugs in late spring. Their glossy slime


    trails blanket our driveway, and a few dozen of them take shelter near my


    car each morning. My daily ritual now involves a slug check, moving them


    out from under my tires. I cannot imagine simply wantonly driving over a


    slug. To me, that feels like the behavior of a sociopath.


    This has always been my lot in life. I grew up in a home where my


    mother was a friend to all animals. When I was a small boy, I remember her


    breaking up a crowd of people who were threatening to step on a bat that


    was floundering on the sidewalk in front of the drugstore. My mother, who


    could have been awarded the Nobel Prize for timidity, yelled at everyone to


    get back. She found a cardboard box, scooped it up, and rescued it.


    Whether I inherited my mother’s animal empathy mindset or learned by


    watching her interact with animals is immaterial. I, too, am consumed by a


    crippling empathy for the living creatures around me. My daughter has been


    late for school on more than one occasion due to my insistence on morning


    slug checks. And I don’t tolerate squishing bugs, which has resulted in


    many awkward (and sometimes confrontational) conversations with


    arachnophobes and fly-bashers over the years.


    My academic interest in animal cognition was a logical extension of my


    upbringing. But it was also constrained by the values and norms I learned


    during those years. I have only ever conducted observational—not


    experimental—research on animals. I’ve never collected data from captive


    animals. Something deep inside me finds the idea of captivity problematic.


    Intellectually, I can produce numerous arguments as to why captivity is


    sometimes necessary and even good for some species. Some captive


    facilities are doing good work, thanks to their stellar research output and'
