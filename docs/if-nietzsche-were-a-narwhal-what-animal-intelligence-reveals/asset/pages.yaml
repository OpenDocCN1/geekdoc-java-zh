    were rustling. We froze in place, nervous that maybe a bear was lurking


    near us. I went over to investigate. Instead of a bear, I found a large branch


    of a long-dead tree, which must have rolled down the hill a few feet before


    coming to rest against the alder, generating that sound that had startled all


    three of us.


    This scenario is something that animals have been dealing with for


    millions of years. Natural selection is built on countless iterations of


    animals hearing a sudden sound, determining what it signifies, and deciding


    how to react. For apex predators like the Komodo dragon (an enormous


    Indonesian lizard that has been known to eat people), a random noise in the


    bush might trigger curiosity as it could be something to eat. For prey


    species like squirrels, a sudden noise might be the opposite: a potential


    predator or threat that would send it fleeing in the opposite direction.


    There are only two ways an animal can interpret the significance of a


    sudden noise. The first is to *learn* through *association* that a loud noise


    emanating from behind a bush often precedes the appearance of a living


    thing. The second is to *infer* that a noise is *caused* by a living thing. It


    sounds subtle, but this difference—between learned associations and causal


    inference—is where nonhuman animal thinking ends and being a why


    specialist begins.'
