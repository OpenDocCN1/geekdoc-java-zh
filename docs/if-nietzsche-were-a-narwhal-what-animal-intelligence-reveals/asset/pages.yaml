  md: '**Introduction**


    Friedrich Wilhelm Nietzsche (1844–1900) had a magnificent mustache


    and a peculiar relationship with animals. On the one hand, he pitied animals


    because, as he wrote in *Untimely Meditations,* they “cling to life, blindly


    and madly, with no other aim… with all the perverted desire of the fool.”¹


    Animals, he believed, stumble through life unaware of what they are doing


    or why they are doing it. What’s worse, he believed that they lack the


    intelligence to experience pleasure or suffering as deeply as us humans.²


    For an existential philosopher like Nietzsche, that was a real bummer;


    finding meaning in suffering was Nietzsche’s whole shtick. But he also


    envied their lack of angst, writing:


    Consider the cattle, grazing as they pass you by: they do not


    know what is meant by yesterday or today, they leap about, eat, rest,


    digest, leap about again, and so from morn till night and from day to


    day, fettered to the moment and its pleasure or displeasure, and thus


    neither melancholy nor bored. This is a hard sight for man to see; for,


    though he thinks himself better than the animals because he is


    human, he cannot help envying them their happiness.³


    Nietzsche both wished he was as stupid as a cow so he wouldn’t have to


    contemplate existence, and pitied cows for being so stupid that they


    couldn’t contemplate existence. That’s the kind of cognitive dissonance that


    generates big ideas. Nietzsche’s contributions to philosophy included


    challenging the nature of truth and morality, famously declaring God to be


    dead, and grappling with the problem of meaninglessness and nihilism. But


    this body of work came at a terrible price. In his personal life, he was a hot


    mess, the quintessential example of how too much profundity can literally


    break your brain.


    As a child, Nietzsche had debilitating headaches that left him


    incapacitated for days on end.⁴ At the height of his academic output, he'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'experienced persistent depression, hallucinations, and thoughts of suicide.


    By 1883, at age thirty-nine, he declared himself “mad”—the same year his


    most famous book, *Also sprach Zarathustra,* was published. His mental


    state continued to decline even as his philosophical output skyrocketed. In


    1888, Nietzsche rented a small apartment in the middle of Turin from his


    friend Davide Fino. Despite being in the throes of a mental health crisis, he


    wrote three books that year.⁵ One night, Fino looked through Nietzsche’s


    keyhole to find the man “shouting, jumping, and dancing around the room,


    stark naked, in what seems to have been a one-man re-creation of a


    Dionysian orgy.”⁶ He would stay awake all night pounding out discordant


    songs on his piano with his elbows while screaming misremembered lyrics


    to Wagner operas. He was a creative genius, but clearly not a well man.


    And also a terrible neighbor.


    Given his preoccupation with animal nature, it is perhaps fitting that it


    was an encounter with a horse that caused Nietzsche to suffer a final mental


    breakdown from which he never recovered. On January 3, 1889, Nietzsche


    was walking through the Piazza Carlo Alberto in Turin when he saw a


    coachman whipping his horse. Overcome, Nietzsche burst into tears, threw


    his arms around the animal’s neck, and collapsed in the street. Fino, who


    was working at a nearby newspaper kiosk, found him there and guided him


    back to his apartment.⁷ The poor philosopher remained in a catatonic state


    for a few days before being whisked off to a mental asylum in Basel,


    Switzerland. He never again regained his mental faculties.


    The Turin horse, it seems, had been the final blow to Nietzsche’s fragile


    mental state.⁸


    There has been much speculation as to the causes of Nietzsche’s mental


    illness, which blossomed into full-blown dementia before his death. It could


    have been a chronic syphilitic infection, which can eat away at the brain. Or


    a vascular disease (CADASIL) that causes diverse neurological symptoms


    as brain tissue slowly atrophies and dies.⁹ Whatever the medical cause,


    there is no doubt that Nietzsche’s psychiatric problems were compounded


    by his intellectual genius, which spurred him to seek meaning, beauty, and


    truth in his suffering at the expense of his sanity.


    Was Nietzsche too smart for his own good? If we look at intelligence


    from an evolutionary perspective, there’s every reason to believe that'
