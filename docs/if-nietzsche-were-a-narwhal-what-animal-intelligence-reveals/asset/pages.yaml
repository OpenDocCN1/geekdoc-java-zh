    The ability to both recall the past and think about the future is called


    *mental time travel*. It is succinctly defined by the psychologists Thomas


    Suddendorf and Michael Corballis as “the faculty that allows humans to


    mentally project themselves backward in time to relive, or forward to


    prelive, events.”^(15) It’s intimately tied to another cognitive capacity called


    *episodic foresight*, which is the ability to mentally project yourself into the


    future to simulate imagined events and potential outcomes.”^(16) We have


    access to an infinite array of imagined scenarios in which we can be placed


    at the center. You can ask yourself the question “What might happen if I ate


    spaghetti with my hands” and imagine the many possible outcomes,


    including scary ones. For example, in one of those scenarios you might


    choke to death on undercooked spaghetti.


    For an animal to have humanlike death wisdom, they, too, would


