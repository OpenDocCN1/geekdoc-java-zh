    Which checks out. Remember, this is the same guy who suffered a total


    mental breakdown because he saw someone hurting a horse.


    And this highlights the grand drawback to human intelligence. We can,


    and often do, use our human intellect to divine the secrets of the universe


    and generate philosophical theories predicated on the fragility and


    transience of life. But we also can, and often do, harness those secrets to


    wreak death and destruction, and twist those philosophies to justify our


    savagery. With an understanding of how the world has been built comes the


    knowledge to break it. Humans have the capacity to both rationalize


    genocide and the technological competence to carry it out. Elisabeth


    Förster-Nietzsche used her brother’s philosophical writings—born of a


    staggering human intellect—to validate a worldview that led to the deaths


    of six million Jews.^(27) In this regard, humans are nothing like narwhals.


    Narwhals do not build gas chambers.


    The grand MacGuffin


    Intelligence is not a biological fact. This idea of human intellectual or


    behavioral exceptionalism has no basis in science. We feel in our guts that


    intelligence is both real and good. But when we look at all the ways in


    which nonhuman animals manage to eke out a living on this planet—the


    jaw-dropping solutions they’ve come up with for solving ecological'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'problems—it becomes clear that neither of these gut beliefs holds up to


    scrutiny. Intelligence is the grand MacGuffin—a concept we’ve been


    chasing in the study of human, animal, and robot minds that has distracted


    us from the reality of the natural world. A reality in which natural selection


    has never once acted on a biological trait that we can distill into a singular


    concept known as *intelligence.* A reality in which our intellectual and


    technology feats—born of a mishmash of cognitive traits shared by many


    other species—are not quite as important or exceptional as we’d like to


    believe. A reality in which the Earth is bursting with animal species that


    have hit on solutions for how to live a good life in ways that put the human


    species to shame.


    This is a book about the problem of intelligence, and whether it’s a good


    or a bad thing. I think most of us believe that intelligence, whatever that


    word means to you, is inherently good. We’ve always looked at the world—


    and the value of the nonhuman animals in that world—through the prism of


    our own brand of human intelligence. But what if we quiet down that voice


    shouting about the exceptionalism of our species and instead listen to the


    stories that other species are telling us? What if we acknowledge that


    sometimes our so-called human achievements are actually rather shitty


    solutions, evolutionarily speaking? Doing that turns the whole world upside


    down. Then supposedly less brainy animals—like cows, horses, and


    narwhals—seem like geniuses. The animal kingdom suddenly explodes


    with beautiful, simple minds that have found elegant solutions to the


    problem of survival.


    What good is human intelligence? That is a question that bothered


    Nietzsche just as it bothers me. Let’s see if we can answer it together.'
