    By all accounts, Nietzsche’s philosophical ideas were integral to the


    formation and success of the Nazi Party and helped to justify the Holocaust.


    This even though Nietzsche despised anti-Semitism and would probably


    have hated Nazis,^(23) advising that people should “eject the anti-Semitic


