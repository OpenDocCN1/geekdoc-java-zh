    *A story of hats, bets, and chicken butts*


    Gradually, man has become a fantastic animal that has to fulfill


    one more condition of existence than any other animal: man has to


    believe, to know, from time to time, why he exists.


    —Nietzsche¹


    It took Mike McCaskill twenty years to beat the stock market. But when


    he did, boy, did he succeed.


    Mike started small, trading penny stocks as a hobby while working at


    his parents’ furniture store.² When the store closed in 2007, he decided to


    turn to his hobby full-time. He sold his car for $10,000, and then stuck that


    cash into his trading account. Over the next two years, a volatile market and


    the subprime mortgage crisis saw the S&P 500 lose half its value, which


    only served to excite a day trader like Mike. He reveled in the chance to


    unravel the mystery of where the market was going. He predicted that


    stocks would spike not long after the election of President Obama, so he


    took the hundreds of thousands he had made in penny stocks and dumped it


    into the regular stock market.


    But he was wrong.


    As Obama was sworn in on January 20, 2009, Mike watched as the


    Dow Jones continued to plummet, eventually hitting its lowest point during


    the financial crisis on March 5 at 6,594.44 points. That was a 50 percent


    drop from the all-time high in October 2007 of 14,164.43, and was just 3


    percent shy of the record-breaking crash that sparked the Great Depression


    in 1929. It looked bad for Mike. His trading account was completely wiped'
