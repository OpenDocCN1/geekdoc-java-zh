    overnight compartments. The birds ended up caching most of the kibble in


    the cage where peanuts were the usual breakfast food, and cached more


    peanuts in the cage where kibble was the usual breakfast food. In other


    words, they were planning it so that no matter which compartment they


    were stuck in for the night, they could wake up to a breakfast consisting of


    both peanuts *and* kibble.


