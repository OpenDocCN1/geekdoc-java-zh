  md: 'About the Author


    **Justin Gregg** is a senior research associate with the Dolphin


    Communication Project and an adjunct professor at St. Francis Xavier


    University, where he lectures on animal behavior and cognition. Originally


    from Vermont, Justin studied the echolocation abilities of wild dolphins in


    Japan and the Bahamas. He currently lives in rural Nova Scotia where he


    writes about science and contemplates the inner lives of the crows that live


    near his home.'
