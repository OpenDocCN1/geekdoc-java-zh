  md: 'intelligence, but that’s so evident that it’s better to talk about getting


    signals.”^(14)


    What AI researchers, human psychologists, animal cognition


    researchers, and SETI scientists have in common is their belief that


    intelligence is a quantifiable phenomenon without an agreed-upon method


    for quantifying it. We all just know it when we see it. Alien radio waves?


    Yep, that’s intelligence. Crows using a stick to fish ants out of a log? Yeah,


    that’s intelligence. Lieutenant Commander Data composing a poem for his


    beloved pet cat? Yes, that’s intelligence for sure. This “I know it when I see


    it” approach to intelligence is the same method that US Supreme Court


    Justice Potter Stewart famously used to identify when something was


    pornographic.^(15) We all know what intelligence is just like we know what


    porn is. Spending too much time trying to define either is bound to make


    people uncomfortable, so most people don’t bother.


    What good is intelligence?


    At the heart of this discussion of intelligence is an unshakable belief


    that intelligence, however we define it and whatever the heck it actually is,


    is a good thing. A magic ingredient that you can sprinkle onto a boring old


    monkey, or a robot, or an alien and create something better. But should we


    be so confident as to the added value of intelligence? If Nietzsche’s mind


    had been more narwhal-like—had he not been intelligent enough to


    ruminate on his impending death—his madness might have been less potent


    if not entirely absent. That would have not just been better for him, but also


    for the rest of us. If Nietzsche had been born a narwhal, the world might


    never have had to endure the horrors of the Second World War or the


    Holocaust—events that, through no fault of his own, Nietzsche helped


    create.


    After his mental breakdown, Nietzsche spent a year at the psychiatric


    asylum in Jena, Germany, before returning to his childhood home in


    Naumburg under the care of his mother, Franziska. He remained in a semi-


    catatonic state and needed round-the-clock nursing. When she died after


    seven years of doting on her son, Nietzsche’s sister, Elisabeth, arrived to'
  merge: -1
