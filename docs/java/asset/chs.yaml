  \n### 5. `protected void finalize() throws Throwable`\n\n该方法在对象被垃圾回收之前被调用，以便进行任何清理工作。然而，`Object`\
  \ 类中默认的 `finalize()` 方法没有做任何实用的事情。这对于释放非 Java 资源可能有用，但不建议这样做。如果可用内存足够，`finalize()`\
  \ 方法可能永远不会被调用，在这种情况下资源可能永远不会被释放。\n\n### 6. `protected Object clone() throws CloneNotSupportedException`\n\
  \n通过 `clone()` 方法可以创建与当前对象完全相同（即具有相同状态）的新对象，即复制原始类型值和引用值，这被称为浅拷贝。\n\n类可以重写 `clone()`\
  \ 方法以提供其自己的克隆概念。例如，通过递归地克隆组成对象来克隆复合对象被称为深拷贝。当重写时，子类中的该方法通常被声明为 `public`，以便任何客户端克隆该类的对象。\n\
  \n如果重写 `clone()` 方法依赖于 `Object` 类中的 `clone()` 方法，则子类必须实现 `Cloneable` 标记接口，以指示其对象可以安全地克隆。否则，`Object`\
  \ 类中的 `clone()` 方法将抛出受检异常 `CloneNotSupportedException`。\n\n#### 使用 `clone()` 和 `Cloneable`\
  \ 接口\n\n`clone()` 方法会在其调用的对象上生成该对象的副本。以下是与 `clone()` 方法相关的几个重要事实：\n\n- 只有实现了 `Cloneable`\
  \ 接口的类才能被克隆。`Cloneable` 接口没有定义成员。它用于指示一个类允许对对象进行位拷贝（即克隆体）。\n- 如果你尝试对未实现 `cloneable`\
  \ 接口的类对象调用 `clone()`，将抛出 `CloneNotSupportedException`。\n- `Cloneable` 接口是一个空接口。这种接口被称为标记/标签接口。在创建克隆体时，不会调用被克隆对象的构造函数。\n\
  - 克隆体只是原始对象的精确复制。克隆是一个潜在的危险操作，因为它可能会导致意料之外的副作用。\n- 例如，如果被克隆的对象包含一个名为 `objRef` 的引用变量，那么在创建克隆体时，`clone`\
  \ 中的 `objRef` 将指向与原始对象中 `objRef` 相同的同一个对象。如果克隆体对 `objRef` 所指向的内容进行更改，那么原始对象也会随之改变。\n\
  \n#### Example20.5\n\n以下示例演示了 `clone()` 方法的使用。`CloneDemo1` 类通过 `clone2()` 方法间接调用\
  \ `clone()` 方法，对 `TestClone1` 类的对象进行克隆。\n\n```java\n1. class TestClone1 implements\
  \ Cloneable\n{\n    int a;\n    float b;\n    public TestClone1 clone2() throws\
  \ CloneNotSupportedException\n    {\n        return (TestClone1) clone();\n    }\n\
  }\nclass CloneDemo1\n{\n    public static void main(String a[]) throws CloneNotSupportedException\n\
  \    {\n        TestClone1 tc1 = new TestClone1();\n        TestClone1 tc2;\n  \
  \      tc1.a = 8; tc1.b = 4.5f;\n        tc2 = tc1.clone2();\n        System.out.println(tc2.a);\n\
  \        System.out.println(tc2.b);\n    }\n}\n```\nOutput:\n```\n8\n4.5\n```\n\
  在这里，`clone2()` 方法调用 `Object` 类的 `clone()` 方法并返回结果。注意，`clone()` 返回的对象必须转换为其适当类型，即\
  \ `TestClone1`。\n\n#### Example 20.6\n\n在以下示例中，重写了 `clone()` 方法，以便从类外部的代码调用它。为了做到这一点，其访问修饰符必须是\
  \ `public`。\n\n```java\n1. class TestClone2 implements Cloneable\n{\n    int a;\n\
  \    float b;\n    public Object clone() throws CloneNotSupportedException\n   \
  \ {\n        return super.clone();\n    }\n}\nclass CloneDemo2\n{\n    public static\
  \ void main(String args[]) throws CloneNotSupportedException\n    {\n        TestClone2\
  \ tc1 = new TestClone2();\n        TestClone2 tc2;\n        tc1.a = 8; tc1.b = 4.5f;\n\
  \        tc2 = (TestClone2) tc1.clone();\n        System.out.println(tc2.a + \"\
  \ \" + tc2.b);\n    }\n}\n```\nOutput:\n```\n8 , 4.5\n```\n\n#### Example 20.7\n\
  \n在以下示例中，重写了 `clone()` 方法，使其不再使用 `Object` 类的 `clone()` 方法。我们正在编写自己的 `clone()` 方法。\n\
  \n```java\n1. class TestClone3\n{\n    int a;\n    float b;\n    public Object clone()\n\
