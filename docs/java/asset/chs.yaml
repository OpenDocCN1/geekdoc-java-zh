  \ 挂起、恢复和停止线程...（此处文本不完整）\n\n\n\n\n\n通过指定成员访问性修饰符，类可以控制哪些信息对客户端（即其他类）可见。这些修饰符帮助类定义一个约，使得客户端确切知道该类提供了哪些服务。\n\
  \n成员的访问性/可见性可以是以下之一：\n\n- `public`\n- `protected`\n- `default`（也称为包访问权限）\n- `private`\n\
  \n注意： 只有当类（或其任一个子类）对客户端可见时，成员访问性修饰符才有意义。此外，请注意，一个成员只能指定一个访问性修饰符。\n\n此讨论同时适用于类的实例成员和静态成员。\n\
  \n### 3. 接口的成员访问性/可见性修饰符\n\n接口数据成员和方法唯一可以使用访问性/可见性修饰符是 `public`。\n\n`public` 也是接口成员的隐式访问性/可见性修饰符，即使我们不使用\
  \ `public` 修饰符，成员总是被隐式认为是公共的。\n\n### 4. 顶层类的修饰符\n\n除了可见性修饰符，我们还可以在顶层类之前使用以下修饰符：\n\
  \n#### (a) `abstract`\n可以使用关键字 `abstract` 指定类，以表示它不能被实例化。包含抽象方法的类必须声明为抽象类，否则将无法编译。不包含抽象方法的类也可以声明为抽象类。此类类可以作为多个子类的基类。\n\
  \n#### (b) `final`\n可以将类声明为 `final`，以表示它不能被扩展。`final` 类标记了其实现继承层次结构的下边界。只有定义完整的类才能被声明为\
  \ `final`。一个类不能同时是 `final` 又是 `abstract`。\n\n以下是 `final` 类的一些重要特性：\n\n- `final`\
  \ 类的所有方法也都是 `final` 的，即它们具有具体的实现且不能被重写。\n- 使用 `final` 类时，某些类型检查会变得更快。事实上，许多类型检查变成了编译时检查，错误可以更早地被捕获。如果编译器遇到对\
  \ `final` 类的引用，它知道所引的对象恰是该类型。\n- 编译器能够对 `final` 方法执行某些代码优化，因为对这些成员可以做出某些假设。\n- 当调用非\
  \ `final` 方法时，运行时系统确定对象的实际类，将方法调用绑定到该类型方法的正确实现上，然后调用该实现。\n- 在 `final` 方法的情况下，我们确定类型子类不能重写该方法，因此绑定是在编译时完成的，类似于\
  \ `private` 和 `static` 方法，这无疑会提高性能。\n- 在 `final` 方法的情况下，编译器可以将调用替换为方法的实际体，类似于宏。这种机制被称为“内联”（inlining）。在\
  \ C++ 中，我们有将函数声明为 `inline` 的选项（尽管最终决定由编译器做出），但在 Java 中，由编译器做决定。\n\n### 5. 顶层接口的其他修饰符\n\
  \n#### (a) `abstract`\n这是除可见性修饰符外，唯一可与接口配合修饰符。\n\n接口仅指定方法原型而不包含任何实现：它们从本质上说是隐式抽象的（即它们不能被实例化）。我们可以将接口声明为\
  \ `abstract`，但这是多余的，因为接口总是抽象的。\n\n### 6. 接口成员的其他修饰符\n\n数据成员的其他修饰符：\n除了可见性修饰符 `public`\
  \ 外，我们还可以使用修饰符 `static` 和 `final`。虽然可以使用这些修饰符，但它是多余的，因为所有数据成员隐式是 `public`、`static`\
  \ 和 `final` 的。\n\n方法的其他修饰符：\n除了可见性修饰符 `public` 外，我们还可以使用修饰符 `abstract`。虽然可以使用 `abstract`\
  \ 修饰符，但它是多余的，因为所有方法隐式是 `public` 且 `abstract` 的。\n\n### 7. 类成员的其他修饰符\n\n可以通过以下关键字在字段和/方法的声明中指定某些特性：\n\
  \n1. `static`\n2. `final`\n3. `abstract`\n4. `synchronized`\n5. `native`\n6. `transient`\n\
  7. `volatile`\n\n#### A. `static` 修饰符\n`static` 成员类类而不属于类的任何实例。根据类中静态成员的访问性修饰符，客户端可以使用类名或通过类的对象引用来访问这些成员。\n\
  \n**静态变量**（也称为类变量）：\n这些变量只存在于它们定义的类中。当类被加载时，如果没有指定显式初始化表达式，静态变量将初始化为它们的默认值。静态成员变量通常用于跟踪实例的全局信息。\n\
  \n**静态方法**：\n这些也被称为类方法。类中的 `static` 方法可以直接访问类中的其他其他静态成员。它不能访问类的实例（即非静态）成员，因为没有与静态方法相关的对象的概念。\n\
  \n然而，请注意，类中的 `static` 方法始终可以使用该类类型的引用来访问其成员，无论这些成员是否是静态的。一个典型的静态方法可能会代表整个类和/或类的对象执行某些任务。\n\
  \n子类中的实例不能重写父类中的 `static` 方法。编译器将对此标记为错误（意味着父类中的静态方法不能被子类中的非静态方法重写）。`static` 方法是类特定的，不属于任何对象，而在重写时，方法是代表对象被调用的。然而，子类中的\
  \ `static` 方法可以隐藏父类中的 `static` 方法。\n\n声明为 `static`的方法有若干限制：\n- 它们只能调用其他静态方法。\n-\
  \ 它们只能访问静态数据成员。\n- 它们无法以任何方式引用 `this` 或 `super`。\n\n**静态初始化块**：\nJava 类可以有一个或多个静态初始化块。静态初始化块的语法如下：\n\
  \n```java\nstatic {\n    code\n}\n```\n\n静态初始化块可以被认为是一种静态方法，一旦类被加载就会隐式/自动地调用。静态块在以下情况下有用：\n\
  - 静态变量的动态初始化。\n- 在加载类时执行一次性活动。例如，加载 jdbc 驱动类。\n- 在 Hashtable、HashMap、Properties\
  \ 等加载小型数据库/配置文件。\n\n#### B. `final` 修饰符\n`final` 修饰符可以用于\n- 局部变量\n- 实例变量/数据成员\n\
  - 静态变量/数据成员\n- 实例方法\n\n**final 变量**：\n`final` 变量通常在声明时初始化，赋值一次后无法修改。关于 final 变量有一些重要要点：\n\
  - `final` 变量是一个常量，尽管被称为变量。一旦初始化，其值无法更改。这适用于实例、静态和局部变量，包括参数。\n- `final` 是唯一适用于局部变量或形式参数的修饰符。\n\
  - 原始数据类型的 `final` 变量一旦初始化就无法更改其值。\n- 引用类型的 `final` 变量一旦初始化就无法更改其引用值，但它所指示的对象的状态仍然可以更改。\n\
  - 通常 `final` 变量在声明时初始化，但并非必须如此。这种 final 变量也被称为空白 final 变量（blank final variable），必须在使用之前初始化一次。\n\
  \n\n\n\n\n*   `final` 静态变量通常用于定义命名常量，例如 `Integer.MAX_VALUE`，它是 int 的最大值。\n\n## 局部\
  \ final 变量:-\n\n### 示例 13.1\n以下示例说明了如上所述，局部 final 变量可以留空，但在首次使用之前必须进行初始化。变量 `x`\
