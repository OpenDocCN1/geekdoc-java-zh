  \n## 引言\n\n### Scanner 类:-\n这是 Java 在 JDK1.5-6-7 版本中添加的一个新类，用于从用户处获取原始数据类型的输入。使用该类获取输入非常简单，因为只需要创建该类的对象并调用特定方法即可。该类位于\
  \ `java.util` 包中。\n\n| `public java.util.Scanner(java.io.InputStream);` |\n| `public\
  \ java.util.Scanner(java.io.File) throws java.io.FileNotFoundException;` |\n| `public\
  \ java.util.Scanner(java.lang.String);` |\n| `public void close();` |\n| `public\
  \ boolean hasNext();` |\n| `public java.lang.String next();` 输入不包含任何空格的字符串。 |\n\
  | `public java.lang.String nextLine();` 输入可能包含空格的字符串。 |\n| `public boolean hasNextBoolean();`\
  \ |\n| `public boolean nextBoolean();` |\n| `public boolean hasNextByte();` |\n\
  | `public byte nextByte();` |\n| `public boolean hasNextShort();` |\n| `public short\
  \ nextShort();` |\n| `public boolean hasNextInt();` 检查输入缓冲区中的下一个值是否为 int。 |\n| `public\
  \ int nextInt();` 输入一个整数值。 |\n| `public boolean hasNextLong();` |\n| `public long\
  \ nextLong();` |\n| `public boolean hasNextFloat();` |\n| `public float nextFloat();`\
  \ |\n| `public boolean hasNextDouble();` |\n| `public double nextDouble();` |\n\n\
  #### 示例 4.1:\n```java\n1. import java.util.*;\n2. class SumInput\n3. {\n4.   public\
  \ static void main(String args[])\n5.   {\n6.     Scanner sc=new Scanner(System.in);\n\
  7.     int a,b,sum;\n8.     System.out.print(\"Enter Ist number\");\n9.     a =\
  \ sc.nextInt();\n10.    System.out.print(\"Enter 2nd number\");\n11.    b = sc.nextInt();\n\
  12.    sum = a+b;\n13.    System.out.println(\"Sum is \" + sum);\n14.    }\n15.\
  \ }\n```\n输出：\n```\nEnter Ist number 45\nEnter 2nd number 55\nSum is 100\n```\n\n\
  ## 数组-\n\nJava 中的数组是相同类型变量或数据项的有序集合。Java 允许任意维度的数组。Java 数组与 C/C++ 有不同。我们不能在声明时指定数组的大小。内存分配始终是动态的。Java\
  \ 中的每个数组都被视为一个对象，有一个特殊的属性 `length`，该属性指定数组中元素的个数。\n\n### 1. 一维数组:-\n\n#### 声明\n\
  `type array_name[ ]; // 声明时不分配内存。`\n或\n`type [ ] array_name;`\n\n需要注意的是，声明并没有真正创建数组。它只是声明了一个可以指向数组对象的引用。\n\
  \n`int a1 [ ], a2 ;`\n`int [ ] a3, a4 ;`\n\n这两个声明将 `a1`、`a3` 和 `a4` 声明为指向 `int`\
  \ 数组的引用变量，但变量 `a2` 不能指向 `int` 值的数组。它仅仅是一个 `int` 变量。当 `[]` 符号跟在类型后面，声明中的所有变量都是数组。否则，`[]`\
  \ 符号必须跟在声明中的每个单独数组名后面。\n\n#### 使用 `new` 运算符进行内存分配:-\n`array_name = new type[SIZE];\
  \ // SIZE 可以是常量或变量。`\n\n![image](img/image036.png)\n\n**注意 1** 数组的所有元素将自动初始化为零，但为了用不同的值初始化数组，我们可以在声明时进行初始化。数组的声明、内存分配和初始化步骤可以合并为一个：\n\
  `int a[]={5,7,1};`\n\n**注意 2**-数组索引从零开始。\n\n**注意 3**:-在 Java 中，所有数组都将分配的大小在一个名为\
  \ `length` 的变量中。我们可以使用属性 `length` 访问数组的长度：`array_name.length` 。\n\n**注意 4**- `int\
  \ a[],b[];`\n`a = b = new int[5];`\n在上述步骤中，`new` 只创建了一个数组，该数组的引用先存储在 `b` 中然后在 `a`\
  \ 中。因此 `a` 和 `b` 指向同一个数组。赋值不会创建副本。\n\n#### 示例 4.2 数组中存储的所有数字之和。\n```java\n1. class\
