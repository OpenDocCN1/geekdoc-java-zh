  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n# ∞ 20 ∞\n\n# (Java.Lang.Object 类)\n\
  \n## 引言\n`java.lang` 包中的 `Object` 类是 Java 中所有类的根。所有类直接或间接继承 `Object` 类。\n\n即使你写了一个简单的类（即它没有继承任何基类），它也会隐式地继承内置的\
  \ `Object` 类。因此，该类的特性在所有中可用。\n\n## Object 类的方法\n`object` 类定义了以下方法，这些方法被所有类继承：\n\n\
  1. `public int hashCode()`\n2. `public boolean equals(Object obj)`\n3. `public final\
  \ Class getClass()`\n4. `public String toString()`\n5. `protected void finalize()\
  \ throws Throwable`\n6. `protected Object clone() throws CloneNotSupportedException`\n\
  7. `public final void wait(long timeout) throws InterrputedException`\n8. `public\
  \ final void wait(long timeout, int nanos) throws InterrputedException`\n9. `public\
  \ final void wait() throws InterrputedException`\n10. `public final void notify()`\n\
  11. `public final void notifyAll()`\n\n### 1. `public int hashCode()`\n在哈希表中存储对象时，可以使用此方法获取对象的哈希值。该值在程序执行期间保证具有的一一致性。\n\
  \n### 2. `boolean equals(Object obj)`\n如果每个对象都被认为是唯一的，那么没有必要重写 `Object` 类的 `equals()`\
  \ 方法。该方法比较对象的引用以判断相等。\n\n### 3. `final Class getClass()`\n返回对象的运行时类，该类在运行时由 `java.lang.Class`\
  \ 类的对象表示。\n\n**示例 20.1：** 以下示例说明了此方法可以用于获取任何 java 对象对应的 `Class` 对象。然后我们可以使用 `Class`\
  \ 类的方法通过反射/内省来获取有关对象类的信息。`getMethods()` 和 `getFields()` 将仅显示公共成员，而 `getDeclaredMethods()`\
  \ 和 `getDeclaredFields()` 将显示所有成员。\n\n```java\nimport java.lang.reflect.Method;\n\
  import java.lang.reflect.Field;\nclass DispClassMembers1\n{\n    public static void\
  \ main(String args[])\n    {\n      String s = new String(\"Hello\");\n      Class\
  \ c = s.getClass();\n      Method m[] = c.getMethods();\n      System.out.println(\"\
  ......Public Methods (\" + m.length + \")......\");\n      for(int i=0; i < m.length;\
  \ i++)\n            System.out.println(m[i]);\n      Field f[] = c.getFields();\n\
  \      System.out.println(\"......Public Fields (\" + f.length + \")......\");\n\
  \      for(int i=0; i< f.length; i++)\n            System.out.println(f[i]);\n \
  \     m = c.getDeclaredMethods();\n      System.out.println(\"......Declared Methods\
  \ (\" + m.length + \")......\");\n      for(int i=0; i< m.length; i++)\n       \
  \ System.out.println(m[i]);\n      f = c.getDeclaredFields();\n      System.out.println(\"\
  ......Declared Fields (\" + f.length + \")......\");\n      for(int i=0; i< f.length;\
  \ i++)\n        System.out.println(f[i]);\n    }\n}\n```\n\n**输出：**\n```\n......Public\
  \ Methods (72)......\npublic int java.lang.String.hashCode()\npublic int java.lang.String.compareTo(java.lang.String)\n\
  public int java.lang.String.compareTo(java.lang.Object)\npublic int java.lang.String.indexOf(int,int)\n\
  public int java.lang.String.indexOf(int)\npublic int java.lang.String.indexOf(java.lang.String)\n\
  public int java.lang.String.indexOf(java.lang.String,int)\npublic boolean java.lang.String.equals(java.lang.Object)\n\
  public String java.lang.String java.lang.String.toString()\npublic char java.lang.String.charAt(int)\n\
  public int java.lang.String.codePointAt(int)\n...\n```\n\n\n\n\n\n# 声明方法 (70)\n\n\
