  );\n    }\n}\n```\n\n## Adapter\n有些监听器接口有多个方法。最大的接口 `WindowListener` 有七方法。假设我们要捕获\
  \ `windowClosing()` 事件，以便执行关闭窗口的代码。虽然实现 `WindowListener` 的类只需要 `windowClosing()`\
  \ 方法，但我们必须为所有方法提供空实现。\n\n`java.awt.event` 包提供了多个适配器类，每个定义了多个方法的监听器接口都有一个对应的适配器。\n\
  \n适配器只是一个实现接口并提供空方法的类。例如，`WindowAdapter` 类实现了 `WindowListener` 接口并包含了七个空方法。\n\n\
  适配器类及其接口：\n\n| 适配器类 | 监听器接口 |\n| :--- | :--- |\n| `ContainerAdapter` | `ContainerListener`\
  \ |\n| `FocusAdapter` | `FocusListener` |\n| `KeyAdapter` | `KeyListener` |\n| `MouseAdapter`\
  \ | `MouseListener` |\n| `MouseMotionAdapter` | `MouseMotionListener` |\n| `WindowAdapter`\
  \ | `WindowListener` |\n\n### 示例 18.6 WindowAdapter 类的使用\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\nclass A6\n{\n  public static void main (String args[])\n\
  \    {\n      Frame f= new Frame();\n      f.setLayout(new FlowLayout());\n    \
  \  f.setSize(300,300);\n      f.addWindowListener(new B( ));\n      f.setVisible(true);\n\
  \    }\n}\nclass B extends WindowAdapter\n{\n  public void windowClosing(WindowEvent\
  \ we)\n    {\n      System.out.printIn(“Window Closing”);\n      Frame f = (Frame)\
  \ we.getWindow( );\n      f.dispose();\n    }\n}\n```\n`InputEvent` 类：\n\n\n\n\n\
  \n这是所有组件级输入事件的根事件类。输入事件在由产生源进行正常处理之前，会传递给监听器。这允许监听器和组件子类“消费”事件，从而使源不会以其默认方式处理这些事件。例如，消费\
  \ `Button` 组件上的鼠标按下事件将防止 `Button` 被激活。\n\n### 方法\n\n- `void consume()`\n消费此事件，使其不会由产生它的的源以默认方式对其进行处理。\n\
  - `int getModifiers()`\n返回此事件的修饰符掩（Modifier mask）。\n- `int getModifiersEx()`\n返回此事件的扩展修饰符掩。\n\
  - `static String getModifiersExText(int modifiers)`\n返回描述扩展修饰符键的字符串，例如“shift”、“Ctrl\
  \ + Shift”等。\n- `long getWhen()`\n返回此事件发生的时间戳。\n- `boolean isAltDown()`\n返回此事件中的\
  \ Alt 修饰键是否被按下。\n- `boolean isConsumed()`\n返回此事件是否已被消费。\n- `boolean isControlDown()`\n\
  返回此事件中的 Control 修饰键是否被按下。\n- `boolean isShiftDown()`\n返回此事件中的 shift 修饰键是否被按下。\n\n\
  ### 鼠标事件类\n\n这是 `Input Event` 类的子类。此事件表示组件中发生了鼠标动作。当且仅当鼠标指针悬悬在组件子元素的未被遮挡部分、菜单或顶层窗口上时，才认为鼠标动作发生在特定组件中。\n\
  \n此事件同时用于鼠标事件（点击、进入、按下、退出、释放）和鼠标移动事件（移动和拖拽）。\n\n### 方法\n\n- `int getButton()`\n\
  返回哪个鼠标按钮的状态发生了变化（如果有）。\n- `int getClickCount()`\n返回与此事件相关的鼠标点击次数。\n- `static String\
  \ getMouseModifiersText(int modifiers)`\n返回描述事件发生期间被按下的修饰键的字符串，例如“Shift”或“Ctrl +\
  \ shift”。\n- `point getPoint()`\n返回事件相对于源组件的 x, y 位置。\n- `int getX()`\n返回事件相对于源组件的水平\
  \ x 位置。\n- `int getY()`\n返回事件相对于源组件的垂直 y 位置。\n- `boolean isPopupTrigger()`\n返回此鼠标事件是否为该平台的弹出菜单触发事件。\n\
  \n**注意：** 弹出菜单在不同系统触发方式不同。因此，为了实现正确的跨平台功能，应该在鼠标按下（Pressed）和鼠标释放（Released）时都检查 `isPopupTrigger()`。\n\
  \n### 处理鼠标事件\n\n### 示例 18.7\n\n```java\n1. import java.awt.*;\n2. import java.awt.event.*;\n\
  3. class A7\n{ \n   public static void main(String args[])\n   { \n      Frame f=\
  \ new Frame();\n      f.setLayout(new FlowLayout());\n      f.setSize(300,300);\n\
  \      Button b1 = new Button(\"Push Me\");\n      b1.addMouseListener(new B());\n\
  \      b1.addMouseMotionListener(new C());\n      b1.addActionListener(new D());\n\
  \      f.add(b1);\n      f.setVisible(true);\n   }\n17. class B implements MouseListener\n\
  { \n   public void mouseEntered(MouseEvent me)\n   { \n      System.out.println(\"\
  Mouse Entered...\");\n      System.out.println(me.getX());\n      System.out.println(me.getY());\n\
  \   }\n   public void mouseExited(MouseEvent me)\n   { \n      System.out.println(\"\
  Mouse Exited...\");\n      Point p1=me.getPoint();\n      System.out.println(p1.x);\n\
  \      System.out.println(p1.y);\n   }\n   public void mousePressed(MouseEvent me)\n\
  \   { \n      System.out.println(\"Mouse pressed...\");\n      int ms = me.getModifiersEx();\n\
  \      String s = me.getModifiersText(ms);\n      System.out.println(s);\n   }\n\
  \   public void mouseReleased(MouseEvent me)\n   { \n      System.out.println(\"\
  Mouse Released...\");\n      System.out.println(\"ClickCount—>\" + me.getClickCount());\n\
  \   }\n   public void mouseClicked(MouseEvent me)\n   { \n      System.out.println(\"\
  Mouse Clicked...\");\n      System.out.println(\"Button—>\"+me.getButton());\n \
  \  }\n}\n51. class C implements MouseMotionListener\n{ \n   public void mouseMoved(MouseEvent\
  \ me)\n   { \n      System.out.println(\"Mouse Moved...\");\n   }\n   public void\
  \ mouseDragged(MouseEvent me)\n   { \n      System.out.println(\"Mouse Dragged...\"\
  );\n   }\n}\n62. class D implements ActionListener\n{ \n   public void actionPerformed(ActionEvent\
  \ ae)\n   { \n      System.out.println (\"Button Pressed...\");\n   } }\n```\n\n\
  ### ActionEvent 类\n\n这是一种语义事件，表示发生了组件——定义的动作。这种高级事件是由组件（如 `Button`）在发生组件特定动作时（如被按下）时生成的。该事件会被传递给每个通过组件的\
  \ `ActionListener` 方法注册以接收此类事件的 `ActionListener` 对象。\n\n实现 `ActionListener` 接口的对象在事件发生时会获取此\
  \ `ActionEvent`。因此，监听器可以无需处理单个鼠标移动和鼠标点击的细节，而是可以处理“有意义的”（语义化的）事件，例如“按钮按下”。\n\n**注意：**\
  \ 要使用键盘在 `Button` 上触发 `ActionEvent`，请使用空格键。\n\n### 方法\n\n- `String getAction(Command)`\n\
  返回与此动作相关的命令字符串。\n- `int getModifiers()`\n返回此动作事件期间被按下的修饰符键。\n- `long getWhen()`\n\
  返回此事件发生的时间戳。\n\n#### 示例 18.8:\n\n此示例演示了我们如何识别 Action Event 发生时有效的键修饰符。\n\n```java\n\
  1. import java.awt.*;\n2. import java.awt.event.*;\n3. class KeyModifierDemo extends\
  \ Frame implements ActionListener\n{ \n   Button b;\n   KeyModifierDemo ()\n   {\
  \ \n      b = new Button (\"Button\");\n      b.addActionListener (this);\n    \
  \  setLayout (new FlowLayout ());\n      add (b);\n      setBounds (100,100,200,200);\n\
  \      setVisible (true);\n   }\n   15. public static void main (String args[])\n\
  \   { \n      new KeyModifierDemo ();\n   }\n   19. public void actionPerformed\
  \ (ActionEvent ae )\n   { \n      System.out.println (\"Button Pressed...\");\n\
  \      int ms = ae.getModifiers ();\n      if (ms & InputEvent.CTRL_DOWN_MASK)!=0)\n\
  \      { \n         System.out.println (\"CTRL key was pressed\");\n      }\n  \
  \    if (ms & InputEvent.SHIFT_DOWN_MASK)!=0)\n      { \n         System.out.println\
  \ (\"Shift Key was pressed\");\n      }\n      if (ms & InputEvent.ALT_DOWN_MASK)!=0)\n\
  \      { \n         System.out.println (\"ALT key was pressed\");\n      }\n   }\n\
  }\n```\n\n### 处理多个 Action 命令\n\nAction 事件是最简单的。当我们发现滚动条发送了调整事件时，显而易的问题是：“现在滚动条的值是多少？”当我们发现鼠标被点击时，自然会想：“鼠标的\
  \ x 和 y 坐标是多少？”但但当我们发现一个按钮发送了 Action 事件时，似乎没有其他额外信息需要寻找了；按钮被点击了，这似乎就是全部了。\n\n\n\n\
  \n然而，Action 事件还关联有一条额外信息。这条信息是一个字符串，被称为 Action 命令（Action command）。我们可以通过 `getActionCommand()`\
  \ 方法提取 Action 事件的 Action 命令。如果 Action 事件是由文本字段发送的，`getActionCommand()` 将返回文本字段的当前内容。（当用户按下回车键时，文本字段会发送\
  \ Action 事件）。如果 Action 事件是由按钮发送的，默认行为是 `getActionCommand()` 返回按钮标签的字符串。然而，我们可以通过调用按钮的\
  \ `setActionCommand(String)` 方法显式地设置按钮的 `ActionCommand`。\n\n```java\nButton btn\
  \ = new Button (\"Hello\");\nbtn.setActionCommand (\"Hello\");\n```\n\n当按钮的 `ActionListener`\
  \ 需要决定如何对 Action 事件做出反应时，按钮 Action 命令的优势就显而易见了。单个监听器作为多个组件的监听器是常见的；在我们的语境中，一个对象可以是几个或多个按钮的\
  \ `ActionListener`。在这种情况下，必须通过确定是哪个按钮被触发来调用对象的 `actionPerformed()` 方法。下面的示例演示了这一点：\n\
  \n### 示例 18.9\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass ButtonRefTest\n\
  {\n    Button b1,b2,b3;\n    ButtonRefTest()\n    {  \n      Frame f=new Frame();\n\
  \      f.setLayout(new FlowLayout ));\n      f.setSize(300,300);\n      b1=new Button(\"\
  Push Me\");\n      b2=new Button(\"Click Me\");\n      b3=new Button(\"Hit Me\"\
  );\n      f.add(b1);   f.add(b2);   f.add(b3);\n      B obj= new B(b1,b2,b3);\n\
  \      b1.addActionListener(obj);\n      b2.addActionListener(obj);\n      b3.addActionListener(obj);\n\
  \      f.setVisible(true);\n    }\n    public static void main(String args [ ])\n\
  \    { \n      new ButtonRefTest();\n    }\n}\nclass B implements ActionListener\n\
  { \n    Button b4,b5,b6;\n    B(Button b1, Button b2, Button b3)\n    {\n      b4\
  \ = b1;\n      b5 = b2;\n      b6 = b3;\n    }\n    public void actionPerformed(ActionEvent\
  \ ae)\n    {  \n      Button b=(Button)ae.getSource();\n      if(b==b4)\n      \
  \  System.out.println(\"First Button was pressed\");\n      else if(b==b5)\n   \
  \     System.out.println(\"Second Button was pressed\");\n      else if(b==b6)\n\
  \        System.out.println(\"Third  was pressed\");\n    }\n}\n``` \n\n### 示例 18.10\n\
  \n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass GetLabelTest\n{\n\
  \    Button b1,b2,b3;\n    GetLabelTest()\n    {  \n      Frame f=new Frame();\n\
  \      f.setLayout(new FlowLayout ));\n      f.setSize(300,300);\n      b1=new Button(\"\
  Push Me\");\n      b2=new Button(\"Click Me\");\n      b3=new Button(\"Hit Me\"\
  );\n      f.add(b1);   f.add(b2);   f.add(b3);\n      B obj= new B();\n      b1.addActionListener(obj);\n\
  \      b2.addActionListener(obj);\n      b3.addActionListener(obj);\n      f.setVisible(true);\n\
  \    }\n    public static void main(String args [ ])\n    { \n      new GetLabelTest();\n\
  \    }\n}\nclass B implements ActionListener\n{ \n    public void actionPerformed(ActionEvent\
  \ ae)\n    {  \n      Button b=(Button)ae.getSource();\n      String s=b.getLabel();\n\
  \      if(s.equals(\"Push Me\"))\n        System.out.println(\"First Me Button was\
  \ pressed\");\n      else if(s.equals(\"Click Me\"))\n        System.out.println(\"\
  Second Me Button was pressed\");\n      else if(s.equals(\"Hit Me\"))\n        System.out.println(\"\
  Third Me Button was pressed\");\n    }\n}\n```\n\n### 示例 18.11：使用 `setActionCommand()`\
  \ 方法设置 Action Command\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  class ActionCommandTest\n{\n    Button b1,b2,b3;\n    ActionCommandTest()\n    {\
  \  \n      Frame f=new Frame();\n      f.setLayout(new FlowLayout());\n      f.setSize(300,300);\n\
  \      b1=new Button(\"Push Me\");\n      b2=new Button(\"Push Me\");\n      b3=new\
  \ Button(\"Push Me\");\n      b1.setActionCommand(\"First\");\n      b2.setActionCommand(\"\
  Second\");\n      b3.setActionCommand(\"Third\");\n      f.add(b1);   f.add(b2);\
  \   f.add(b3);\n      B obj= new B();\n      b1.addActionListener(obj);\n      b2.addActionListener(obj);\n\
  \      b3.addActionListener(obj);\n      f.setVisible(true);\n    }\n    public\
  \ static void main(String args [ ])\n    { \n      new ActionTest();\n    }\n}\n\
  class B implements ActionListener\n{ \n    public void actionPerformed(ActionEvent\
  \ ae)\n    {  \n      Button b=(Button)ae.getSource();\n      String s=b.getActionCommand();\n\
