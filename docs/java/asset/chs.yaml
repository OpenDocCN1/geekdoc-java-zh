  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章：∞ 12 ∞ (多线程编程)\n\n## 引言\n\n线程是程序内部的控制流。线程与进程非常相似。事实上，线程也被称为轻量级进程。\n\
  \n### 线程对比 进程\n\n通常，不同的进程占用不同的内存空间。当 CPU 从一个进程切换到另一个进程时，当前运行进程的状态会被保存，另一个进程的状态会被恢复。在状态切换期间没有进行任何有用工作。状态切换时间应该尽可能短，以最大化\
  \ CPU 的利用率。\n\n线程也像独立的进程，但它们共享相同的内存和状态。各个线程也有独立的状态，但与进程状态相比，该状态非常小。状态可能只包含程序计数器和栈指针。因此，从一个线程切换到另一个线程所需的时间非常短。与进程相比，线程的上下文切换时间非常小。因此，多线程的\
  \ CPU 利用率高于多进程的情况。\n\n### 多线程程序\n\n多线程程序包含两个或多个可以并发运行的部分。此类程序的每个部分被称为线程，每个线程都定义了一条独立的执行路径。因此，多线程是多任务的一种特殊形式。\n\
  \n例如，一个程序可能有三个线程：\n* 一个处理打印。\n* 一个处理编辑。\n* 一个从互联网下载文件。\n\n所有这些线程都可能并发运行，从而最大化 CPU\
  \ 的利用率。\n\n### 基于进程的多任务\n\n大多数操作系统允许我们同时运行两个或多个程序。这被称为基于进程的多任务。例如，我们可以运行一个 Java\
  \ 程序，同时编辑一个 Word 文档。基于进程的多任务确保了在大多数时间内会有程序被执行，从而增加了 CPU 的利用率。\n\n在基于进程的多任务中，程序是调度程序可以派发的最小代码单元。\n\
  \n### 基于线程的多任务\n\n在基于线程的多任务环境中，线程是执行的最小单元。一个进程可以被分为若干并发执行的线程。这允许我们在单个程序中并发处理多个任务。\n\
  \n例如，我们可以编辑一个 Word 文档。基于线程的多任务提高了 CPU 的利用率。\n\n## Java 线程模型\n\nJava 运行时系统许多方面依赖线程，所有的类库都是为了多线程设计的。\n\
  \n## 线程生命周期（线程状态）\n\n线程存在于几种状态。线程可以处于运行状态。一旦获得 CPU 时间，就可以处于就绪状态。运行中的线程可以被挂起，暂时停止其活动。挂起的线程随后可以恢复，让它从停止的地方继续。线程在等待资源或终止时会处于阻塞状态。\n\
  \n#### 1. 新生状态 (Newborn State)\n\n当我们创建一个线程对象时，线程就出生了，被称为处于新生状态。该线程尚未被调度运行。\n\n\
  在此状态下，我们只能对它执行以下其中一操作：\n1. 使用 `start()` 方法调度它运行。\n2. 使用 `stop()` 方法将其杀死。\n\n如果被调度，它将移动到可运行状态（Runnable\
  \ State）。如果我们尝试在此状态下使用任何其他方法，将会抛出异常。\n\n#### 2. 可运行状态 (Runnable State)\n\n可运行状态意味着线程已准备好执行，并正在等待处理器的可用。也就是说，该线程已加入等待执行的线程队列。如果所有线程的优先级相同，则将以轮询的方式给它们执行时间片。\n\
  \n放弃控制权的线程会加入队列末尾并再次等待轮到它。然而，如果我们想让一个线程在轮到它之前将控制权让给另一个相同优先级的线程，它可以通过调用 `yield()`\
  \ 方法来实现。\n\n#### 3. 运行状态 (Running State)\n\n运行意味着处理器已将时间分配给线程进行执行。运行中的线程在以下情况下可能会放弃控制权：\n\
  * 其时间片用完。\n* 被高优先级线程抢占。\n* 它让出（yield），即主动放弃控制权。\n* 它已完成执行。\n* 它被其他线程停止。\n\n\n\n\n\
  \n*   它已使用 `suspend()` 方法挂起。被挂起的线程可以通过使用 `resume()` 方法恢复。当我们由于某些原因想挂起线程一段时间，但不想杀死它时，这种方法非常有用。\n\
  *   它被告知等待直到某个事件发生。这是通过使用 `wait()` 方法实现的。可以使用 `notify()` 方法调度该线程再次运行。\n*   它正在执行某些\
  \ I/O 操作。\n\n#### 4. 阻塞状态 (Blocked State)\n\n当一个线程被阻止进入可运行状态以及随后的运行状态时，该线程被称为阻塞的。这发生在线程被挂起、睡眠或等待以满足某些需求时。阻塞线程被视为“不可运行”，但并未死亡，因此完全有资格再次运行。\n\
  \n#### 5. 死亡状态 (Dead State)\n\n每个线程都有生命周期。运行中的线程在完成其 `run()` 方法的执行后结束生命，这自然死亡。然而，我们可以通过在任何状态向它发送停止消息来杀死它，从而导致过早死亡。线程可以在一出生时、运行期间、甚至在它处于“不可运行”（阻塞条件）状态时被杀死。\n\
  \n### 线程优先级 (Thread Priorities)\n\nJava 为每个线程分配一个优先级，该优先级决定了相对于其他线程如何处理该线程。线程优先级是整数，指定了一个线程相对于另一个线程的相对优先级。\n\
  \n从绝对值来说，优先级是没有意义的；如果它是唯一运行的线程，高优先级的线程运行速度并不比低优先级的线程快。相反，线程的优先级用于决定何时从一个运行中的线程切换到下一个线程。这被称为上下文切换（context\
  \ switch）。决定何时发生上下文切换的规则如下：\n\n*   线程可以自愿（自己）放弃控制。这是通过显式地让出（yielding）、睡眠、阻塞或等待 I/O\
  \ 实现的。在这种情况下，将检查所有其他线程，通常将就绪运行的优先级最高的线程赋予 CPU。\n*   线程可以被高优先级线程抢占。在这种情况下，一个不让出处理器的低优先级线程无论正在做什么，简单地被高优先级线程抢占。基本上，只要高优先级线程想要运行，它就会运行。这被称为抢占式多任务处理（preemptive\
  \ multitasking）。\n*   某些操作系统支持非抢占式优先级调度。在这种情况下，高优先级线程只有在低优先级线程完成后才有机会运行。\n*   在两个相同优先级的线程竞争\
  \ CPU 周期的情况下，情况会有点复杂。对于像 windows98 这样的操作系统，等优先级的线程必须自愿（自己）让出（放弃）控制权给同。如果它们这样做，其他线程将不会运行。\n\
  \n注意：由于操作系统切换相同优先级线程的方式不同可能会可能会问题。\n\n### 同步 (Synchronization)\n\n由于多线程为我们的程序引入了异步行为，我们必须在需要时有一种方法来强制执行同步。例如，如果我们想让两个线程通信并共享一个复杂的数据结构（如链表），我们需要某种方法来确保它们不会发生冲突。\n\
  \n也就是说，我们必须防止一个线程在另一个线程正在读取数据时写入数据。Java 使用监视器（monitor）进行线程间同步。我们可以将监视器想象成只能容纳一个线程的小盒子。一旦线程进入监视器，它就可以用来保护共享资源不被多个线程同时操作。\n\
  \n大多数多线程系统将对象暴露出来，我们的程序必须显式地获取并锁定。Java 提供了一个更整洁的解决方案。\n\n没有 `monitor` 类，相反，每个对象都有自己的隐式监视器，当调用对象的某个\
  \ `synchronized` 方法时，该监视器会自动进入。一旦线程进入 `synchronized` 方法，任何其他线程都无法调用同一对象上的任何其他 `synchronized`\
  \ 方法。这使我们能够编写非常清晰且简洁的多线程代码，因为同步支持已内置在语言中。\n\n### 消息传递 (Messaging)\n\n使用大多数其他语言进行编程时，我们必须依赖操作系统来建立线程之间的通信。\n\
  \n这无疑增加了开销。相比之下，Java 提供了一种清晰、低成本的方法让两个或多个线程通过调用所有对象都有的预定义方法进行通信。Java 的消息传递系统允许线程进入对象的\
  \ `synchronized` 方法，然后在那里等待，直到其他线程显式地通知其出来。\n\n### Thread 类和 Runnable 接口\n\nJava\
  \ 的多线程系统建立在 `Thread` 类、其方法及其伴侣接口 `Runnable` 之上。该类属于 `java.lang` 包，因此不需要显式导入它。\n\n\
  `Thread` 封装了一个执行线程，由于我们无法直接引用运行线程的内部状态，我们将通过它的代理（即产生它的线程的 `Thread` 实例）来处理它。要创建一个新线程，我们的程序将扩展\
  \ `Thread` 类或实现 `Runnable` 接口。\n\n`Thread` 类定义了几个帮助管理线程的方法：\n\n| 方法 |  |\n| :---\
  \ | :--- |\n| `String getName()` | 返回此线程的名称 |\n| `int getPriority()` | 返回此线程的优先级\
  \ |\n| `boolean isAlive()` | 测试此线程是否仍在运行 |\n| `void join()` | 等待此线程死亡（终止） |\n| `void\
  \ run()` | 如果此线程使用单独的 `Runnable` 对象构造，则调用该 `Runnable` 对象的 `run` 方法；否则，此方法不做任何操作并返回；如果扩展了线程类并在子类中重写了\
  \ `run()` 方法，则调用重写的 `run()` 方法。 |\n| `void setName(String name)` | 将此线程的名称更改为参数\
  \ |\n| `static void sleep(long millis)` | 使当前执行的线程睡眠指定的毫秒数（1 秒 = 1000ms） |\n| `static\
  \ void sleep(long millis, int nanos)` | 使当前执行的线程睡眠指定的毫秒加上指定的纳秒。 |\n| `void start()`\
  \ | 使此线程开始执行，Java 虚拟机调用此线程的 `run` 方法。 |\n| `static void yield()` | 使当前执行的线程对象临时暂停并允许其他线程执行。\
  \ |\n| `static Thread currentThread()` | 返回当前执行线程的引用。 |\n\n### 主线程 (The main thread)\n\
  \n当 Java 程序启动时，一个线程会立即开始运行。这通常被称为我们程序的主线程，因为它是程序启动时执行的线程。主线程是创建其他“子”线程的线程。\n\n虽然主线程是在程序启动时创建的，但可以通过\
  \ `Thread` 对象对其进行控制。为此，我们必须通过调用 `currentThread()` 方法获取其引用，该方法是 `Thread` 类的公共静态成员。\n\
  \n该方法返回调用它的线程的引用。一旦有了主方法的引用，我们就可以像任何其他线程一样控制它。\n\n示例 12.1\n\n以下示例演示了我们如何获取主线程的引用，然后使用\
  \ `Thread` 类的方法访问其属性。\n\n```java\nclass CurrentThreadTest {\n    public static void\
  \ main (String args[]) {\n        Thread t = Thread.currentThread();\n        System.out.println(\"\
  Current thread:\" + t);\n        System.out.println(\"Name:\"+ t.getName());\n \
  \       System.out.println(\"Priority:\"+ t.getPriority());\n        t.setName(\"\
  MyThread\");\n        t.setPriority(Thread.MAX_PRIORITY);\n        System.out.println(\"\
  After name and priority change :\" + t);\n        System.out.println(\"Name:\" +\
  \ t.getName());\n    }\n}\n```\n\n\n\n\n\n```java\n13. System.out.println(“Priority:”\
  \ + t.getPriority());\n14. for (int n=1; n<=5; n++)\n15 {\n16. System.out.println(n);\n\
  17 try {\n18 Thread.sleep(1000);\n19 } catch (InterruptedException e) {\n20 System.out.println(“Main\
  \ thread interrupted”);\n21 }\n```\n\n**输出：**\n```\nCurrent thread:Thread[main,5,main]\n\
  Name:main\nPriority:5\nAfter name and priority change :Thread[MyThread,10,main]\n\
  Name:MyThread\nPriority:10\n1\n2\n3\n4\n5\n```\n\n**注意 1：** `Thread` 中的 `sleep()`\
  \ 方法可能会抛出 `InterruptedException`，这是一个检查异常。如果其他线程想要中断正在睡眠的这个线程，就会发生这种情况。\n\n**注意\
  \ 2：** 注意当 `t`（线程引用）作为 `println()` 的参数时产生的输出。它将按顺序显示：线程名称、优先级以及线程组名称。它的优先级是 5，这是默认值，而\
  \ `main` 也是该线程所属线程组的名称。线程组是一个控制线程集合整体状态的数据结构。\n\n## 创建线程\n在最一般的意义上，我们通过实例化 `Thread`\
  \ 类型的对象来创建线程。Java 识别了两种实现目标的方法：\n\n1. 我们可以实现 `Runnable` 接口\n2. 我们可以继承 `Thread` 类本身。\n\
  \n### 实现 Runnable\n创建线程最简单的方法创建一个实现 `Runnable` 接口的类。要实现 `Runnable`，类只需要实现一个名为 `run()`\
  \ 的方法。\n\n```java\npublic void run( )\n```\n\n在 `run()` 方法内部，我们将定义构成新线程的代码。`run()`\
  \ 可以像主线程一样调用其他方法、使用其他类并声明变量。\n\n唯一的区别是，`run()` 为程序中的另一个并发执行线程确立了入口点。该线程将在 `run()`\
  \ 返回时结束。\n\n在我们创建了实现 `Runnable` 的类后，我们将在该类内部使用以下构造函数之一来实例化 `Thread` 类型的对象：\n\n-\
  \ `Thread(Runnable threadObj)`\n- `Thread(Runnable threadObj, String threadName)`\n\
  \n这里 `threadObj` 是调用其 `run` 方法的对象，`threadName` 是新线程的名称。在新线程创建后，在我们调用 `start()` 方法之前，它将不会开始运行。\n\
  \n`start()` 方法将线程放入就绪队列（可运行状态）。每当线程被调度时，它的执行将从 `run()` 方法开始。\n\n### 示例 12.2\n```java\n\
  class A implements Runnable\n{\n  public void run()\n  {\n    for(int i=1;i<=5;i++)\n\
  \    {\n      System.out.println(“Child Thread:” + i);\n    }\n    System.out.println(“Exiting\
  \ child thread”);\n  }\n}\nclass RunnableTest\n{\n  public static void main(String\
  \ args[])\n  {\n    A a1=new A();\n    Thread t1 = new Thread(a1,”Demo Thread”);\n\
  \    t1.start();\n    System.out.println(“Main thread exiting”);\n  }\n}\n```\n\
  **输出：**\n```\nMain thread exiting\nChild Thread:1\nChild Thread:2\nChild Thread:3\n\
  Child Thread:4\nChild Thread:5\nExiting child thread\n```\n\n### 示例 12.3\n```java\n\
  class A implements Runnable\n{\n  Thread t;\n  A()\n  {\n    t= new Thread(this,\
  \ “Demo Thread”);\n    System.out.println(“Child thread: “+ t);\n    t.start();\n\
  \  }\n  public void run()\n  {\n    for (int i=1; i<=5; i++)\n    {\n      System.out.println(“Child\
  \ Thread: ”+ i );\n      try {\n        Thread.sleep(500);\n      } catch (InterruptedException\
  \ e) {\n        System.out.println(e);\n      }\n    }\n    System.out.println (“Exiting\
  \ Child thread”);\n  }\n}\nclass Runnable2\n{\n  public static void main (String\
  \ args )\n  {\n    A a1=new A();\n    for (int i=1; i<=5; i++)\n    {\n      System.out.println(“Main\
  \ Thread:”+ i);\n      try {\n        Thread.sleep (1000);\n      } catch(InterruptedException\
  \ e) {\n        System.out.println(“thread interrupted”);\n      }\n    }\n    System.out.println(“End\
  \ of Main thread”);\n  }\n}\n```\n**输出：**\n```\nChild thread:Thread[Demo Thread,5,main]\n\
  Main Thread:1\nChild Thread: 1\nChild Thread: 2\nMain Thread:2\nChild Thread: 3\n\
  Child Thread: 4\nMain Thread:3\nChild Thread: 5\nExiting Child thread\nMain Thread:4\n\
  Main Thread:5\nEnd of Main thread\n```\n\n### 扩展 Thread 类：\n创建线程的第二种方法创建一个扩展 `Thread`\
  \ 的新类，然后创建该类的实例。扩展类必须重写 `run()` 方法，这是新线程的入口点。它还必须调用 `start()` 来执行新线程。\n\n### 示例\
  \ 12.4\n```java\nclass A extends Thread\n{\n  A()\n  {\n    super (“Test Thread”);\n\
  \    System.out.println (“Child thread:” + this);\n    start();\n  }\n  public void\
  \ run ()\n  {\n    for (int i=1; i<=5; i++)\n    {\n      System.out.println(“Child\
  \ Thread:”+i);\n      try {\n        sleep(500);\n      } catch(InterruptedException\
  \ e) {\n        System.out.println(“Child interrupted”);\n      }\n    }\n    System.out.println\
  \ (“Exiting Child thread”);\n  }\n}\nclass ThreadTest\n{\n  public static void main(String\
  \ args[])\n  {\n    new A();\n    for (int i=1; i<=5; i++)\n    {\n      System.out.println(“Main\
  \ Thread: “+i);\n      try {\n        Thread.sleep(1000);\n      } catch(InterruptedException\
  \ e) {\n        System.out.println(“Main thread interrupted”);\n      }\n    }\n\
  \    System.out.println (“Main thread exiting”);\n  }\n}\n```\n**输出：**\n```\nChild\
  \ thread:Thread[Testing Thread,5,main]\nMain Thread: 1\nChild Thread:1\nChild Thread:2\n\
  Main Thread: 2\nChild Thread:3\nChild Thread:4\nMain Thread: 3\nChild Thread:5\n\
  Exiting Child thread\nMain Thread: 4\nMain Thread: 5\nMain thread exiting\n```\n\
  **注意：** 如果 `Thread` 没有分配任何名称，它将类似于 `Thread-1`、`Thread-2`、`Thread-3` 等。\n\n### 选择方法\n\
  `thread` 类定义了一些可以被派生类重写的方法。在这些方法中，唯一必须重写的是 `run()`。这也是我们在实现 `Runnable` 接口时要求的方法。\n\
  \n许多 Java 程序员认为只有在对类进行某种方式的增强或修改时才扩展类。因此，如果我们不需要重写 `Thread` 的其他方法，实现 `Runnable`\
  \ 可能是最好的。\n\n### 创建多个线程\n### 示例 12.5\n```java\nclass A implements Runnable\n{\n\
  \  String name;\n  Thread t;\n  A(String threadName)\n  {\n    name=threadName;\n\
  \    t=new Thread(this, name);\n    System.out.println(“Child thread:”+t);\n   \
  \ t.start();\n  }\n  public void run()\n  {\n    for(int i=1;i<=5;i++)\n    {\n\
  \      System.out.println(t.getName())+ \":\" + i);\n      try {\n        Thread.sleep(1000);\n\
  \      } catch(InterruptedException e) {\n        System.out.println(e); \n    \
  \  }\n    }\n    System.out.println(name+ “Exiting”);\n  }\n}\nclass MultiThreadTest\n\
  {\n  public static void main(String args[] )\n  {\n    A a1=new A(“One”);\n    A\
  \ a2=new A (“Two”);\n    A a3=new A (“Three”);\n    try {\n      Thread.sleep(10000);\n\
  \    } catch(InterruptedException e) {\n      System.out.println(“main thread interrupted”);\n\
  \    }\n    System.out.println (“Main thread exiting”);\n  }\n}\n```\n\n\n\n\n\n\
  ```java\n45.    }\n46.  }\n```\n\nOutput:\n```\nChild thread:Thread[One,5,main]\n\
  Child thread:Thread[Two,5,main]\nChild thread:Thread[Three,5,main]\nOne:1\nTwo:1\n\
  Three:1\nOne:2\nTwo:2\nThree:2\nOne:3\nTwo:3\nThree:3\nOne:4\nTwo:4\nThree:4\nOne:5\n\
  Two:5\nThree:5\nOneExiting\nTwoExiting\nThreeExiting\nMain thread exiting\n```\n\
  \n### 使用 isAlive() 和 join() 方法强制执行某些顺序：\n\n我们通常希望主线程最后结束。实现这一目标的一种方法是在 `main` 方法中调用\
  \ `sleep()`。这是一种相当粗糙的方法。有两种方法可以判断线程是否已完成。首先，我们可以在线程上调用 `isAlive()`。该方法由 `Thread`\
  \ 类定义，其通用形式为：\n\n```java\nfinal boolean isAlive()\n```\n\n如果调用该方法的线程仍在运行，则 `isAlive()`\
  \ 返回 `true`；否则返回 `false`。虽然 `isAlive()` 有时很有用，但我们更常用的等待线程完成的方法是 `join()`，所示所示：\n\
  \n```java\nfinal void join() throws InterruptedException\n```\n\n该方法会等待直到调用该方法的线程终止为止。`join()`\
  \ 的其他形式允许我们指定等待指定线程终止的最大时间。\n\n下面的示例使用了 `join()` 来确保主线程是最后一个停止的。它还演示了 `isAlive()`\
  \ 方法。\n\n### 示例 12.6\n\n```java\n1.  class A implements Runnable\n2.  { \n3.   \
  \ String name;\n4.    Thread t;\n5.    A(String threadName)\n6.    { \n7.      name=threadName;\n\
  8.      t=new Thread(this,name);\n9.      System.out.println(\"Child thread:\"+t);\n\
  10.      t.start();\n11.    }\n12.    public void run()\n13.    { \n14.      for(int\
  \ i=1;i<=5;i++)\n15.      { \n16.        System.out.println(name +\":\"+ i );\n\
  17.        try\n18.        { \n19.          Thread.sleep(1000);\n20.        }\n\
  21.        catch(InterruptedException e)\n22.        { \n23.          System.out.println(e);\n\
  24.        }\n25.      }\n26.      System.out.println(name + \"Exiting\");\n27.\
  \    }\n28.  }\n29.  class DemoJoin\n30.  { \n31.    public static void main(String\
  \ args[] )\n32.    { \n33.      A ob1=new A(\"One\");\n34.      A ob2=new A(\"Two\"\
  );\n35.      A ob3=new A(\"Three\");\n36.      System.out.println(\"Thread One is\
  \ alive?:\"+ob1.t.isAlive());\n37.      System.out.println(\"Thread Two is alive?:\"\
  +ob2.t.isAlive());\n38.      System.out.println(\"Thread Three is alive?:\"+ob3.t.isAlive());\n\
  39.      try\n40.      { \n41.        ob3.t.join();\n42.        ob2.t.join();\n\
  43.        ob1.t.join();\n44.      }\n45.      catch(InterruptedException e)\n46.\
  \      { \n47.        System.out.println(\"main thread interrupted\");\n48.    \
  \  }\n49.      System.out.println(\"Thread One is alive?:\"+ ob1.t.isAlive());\n\
  50.      System.out.println(\"Thread Two is alive?:\"+ ob2.t.isAlive());\n51.  \
  \    System.out.println(\"Thread Three is alive?:\"+ ob3.t.isAlive());\n52.    \
  \  System.out.println (\"Main thread exiting\");\n53.    }\n54.  }\n```\n\nOutput:\n\
  ```\nChild thread:Thread[One,5,main]\nChild thread:Thread[Two,5,main]\nChild thread:Thread[Three,5,main]\n\
  Thread One is alive?:true\nThread Two is alive?:true\nThread Three is alive?:true\n\
  One:1 \nTwo:1\nThree:1 \nOne:2\nTwo:2\nThree:2\nOne:3\nTwo:3\nThree:3\nOne:4\nTwo:4\n\
  Three:4\nOne:5\nTwo:5\nThree:5\nOneExiting\nTwoExiting\nThreeExiting\nThread One\
  \ is alive?:false\nThread Two is alive?:false\nThread Three is alive?:false\nMain\
  \ thread exiting\n```\n\n### 线程优先级：\n\n线程优先级用于线程调度器来决定何时允许每个线程运行。与低优先级相比，高优先级线程会被优先调度。高优先级线程还可以抢占低优先级线程。例如，当低优先级线程正在睡眠或等待\
  \ I/O 时，高优先级线程将恢复运行。理论上，相同优先级的线程应该获得相同的 CPU 访问权限。Java 设计用于各种环境，某些环境的行为与其他环境有本质不同。为了安全，共享优先级的线程应该偶尔让控制。这确保了所有线程都有运行的机会。\n\
  \n要设置线程的优先级，请使用 `setPriority()` 方法。其通用形式为：\n\n```java\nvoid setPriority(int level)\n\
  ```\n\n`level` 必须在 `MIN_PRIORITY` 和 `MAX_PRIORITY` 范围内。目前，`NORM_PRIORITY` 为 5。我们可以通过调用\
  \ `Thread` 类的 `getPriority()` 方法获取当前优先级，所示：\n\n```java\nint getPriority()\n```\n\
  \n下面的示例演示了两个不同优先级的线程，由于它们在抢占式平台上运行，它们的运行方式并不相同。\n\n示例 12.7\n1.  class Clicker implements\
  \ Runnable\n2.  { \n3.    long click = 0;\n4.    Thread t;\n5.    volatile boolean\
  \ running=true;\n6.    Clicker(int p)\n7.    { \n8.      t=new Thread(this);\n9.\
  \      t.setPriority(p);\n10.    }\n11.    public void run()\n12.    { \n13.   \
  \   while (running)\n14.      { \n15.        click++;\n16.      }\n17.    }\n18.\
  \    void stop ()\n19.    { \n20.      running = false;\n21.    }\n22.    void start\
  \ ()\n23.    { \n24.      t.start();\n25.    }\n26.  }\n27.  class HiLo\n28.  {\
  \ \n29.    public static void main(String args[])\n30.    { \n31.      Thread.currentThread().setPriority(Thread.MAX_PRIORITY);\n\
  32.      Clicker hi = new Clicker(Thread.NORM_PRIORITY+1);\n33.      Clicker lo\
  \ = new Clicker(Thread.NORM_PRIORITY-1);\n34.      lo.start(); hi.start();\n35.\
  \      try\n36.      { \n37.        Thread.sleep(10000);\n38.      }\n39.      catch\
  \ (InterruptedException e)\n40.      { \n41.        System.out.println(e);\n42.\
  \      }\n43.      lo.stop(); hi.stop();\n44.      System.out.println(\"Low : \"\
  \ + lo.click);\n45.      System.out.println(\"High : \" + hi.click);\n46.    }\n\
  47.  }\n```\n\nOutput:\n```\nLow : 63660819\nHigh : 2086505403\n```\n\n注意：变量 `running`\
  \ 之前有 `volatile` 关键字，以确保每次迭代以下循环时都检查 `running` 的值。\n\n```java\nwhile (running)\n\
  {\n  click++;\n}\n```\n\n如果不使用 `volatile`，Java 可以自由对循环进行优化，创建 `running` 的局部副本。\n\
  \n\n\n\n\n当两个或多个线程需要访问共享资源时，它们需要某种方式来确保资源在同一时刻只有一个线程在使用。实现这一点的过程被称为同步。\n\n同步的关键是监视器（monitor）概念（也称为信号量）。监视器是一个用作互斥锁的对象。在给定时刻，只有一个线程可以拥有监视器。\n\
  \n当一个线程获取锁时，被称为进入监视器。所有其他尝试进入被锁监视器的线程将被挂起，直到第一个线程退出监视器。这些线程被称为等待监视器。拥有监视器的线程如果需要，可以重新进入同一个监视器。我们可以通过两种方式对代码进行同步：\n\
  \n(i) 使用 `synchronized` 方法\n(ii) 使用 `synchronized` 语句\n\n## 使用 synchronized 方法\n\
  \n在 Java 中，同步非常简单，因为所有对象都有与其关联的隐式监视器。要进入对象的监视器，只需调用用 `synchronized` 关键字修改过的方法。当线程在\
  \ `synchronized` 方法内部时，所有尝试调用该方法（或同一实例上的任何其他 `synchronized` 方法）的其他线程都必须 `wait()`。要退出监视器并将对象的控制权交给下一个等待的线程，监视器的所有者只需从\
  \ `synchronized` 方法返回。\n\n### 示例 12.8\n\n下面的程序说明了三个线程并发运行的同时，生成的输出会混合。\n\n```java\n\
  class A\n{\n  void display(String msg)\n  {\n    System.out.print(\"[\" + msg);\n\
  \    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n  {\n      msg = m;\n      obj = obj1;\n      t = new\
  \ Thread(this);\n      t.start();\n  }\n  public void run()\n  {\n      obj.display(msg);\n\
  \  }\n}\nclass Synch1\n{\n  public static void main(String args[])\n  {\n      A\
  \ a1 = new A();\n      B b1 = new B(a1,\"Hello\");\n      B b2 = new B(a1,\"World\"\
  );\n      B b3 = new B(a1,\"Matrix\");\n  }\n}\n```\n\n输出:\n```\n[Hello[World[Matrix]\n\
  ]\n]\n```\n\n正如我们看到的，通过调用 `sleep()`，`call()` 方法允许执行切换到另一个线程。这导致了三个消息字符串的混合输出。在这个程序中，没有任何机制可以阻止三个线程同时在同一个对象上调用同一个方法。\n\
  \n这被称为竞态条件（race condition），因为这三个线程正在相互竞争以完成该方法。这个示例使用 `sleep()` 来使效果可重复且明显。在大多数情况下，竞态条件更加微妙且不可预测，因为我们无法确定上下文切换何时发生。这可能导致程序在运行时是正确的，下次运行时又是错误的。\n\
  \n要做到这一点，我们只需要在方法 `display()` 的定义之前加上 `synchronized` 关键字。这可以防止任何线程在另一个线程正在使用 `display()`\
  \ 时进入该方法。\n\n### 示例 12.9\n\n混合问题通过简单地将 `call()` 方法声明为 `synchronized` 方法就得到了解决。\n\
  \n```java\nclass A\n{\n  synchronized void display(String msg)\n  {\n    System.out.print(\"\
  [\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n  {\n      msg = m;\n      obj = obj1;\n      t = new\
  \ Thread(this);\n      t.start();\n  }\n  public void run()\n  {\n      obj.display(msg);\n\
  \  }\n}\nclass Synch2\n{\n  public static void main(String args[])\n  {\n      A\
  \ a1 = new A();\n      B b1 = new B(a1,\"Hello\");\n      B b2 = new B(a1,\"World\"\
  );\n      B b3 = new B(a1,\"Matrix\");\n  }\n}\n```\n\n输出:\n```\n[Hello]\n[World]\n\
  [Matrix]\n```\n注意：一旦线程进入了实例上的任何同步方法，其他线程就无法进入该实例上的任何其他同步方法。然而，该实例上的非同步方法仍然可以被调用。\n\
  \n## 使用 synchronized 语句\n\n虽然在我们创建的类创建 `synchronized` 方法是实现同步的一种简单且有效的方法，但在所有情况下它都不会起。要理解为什么，请考虑以下情况。假设我们想要同步访问一个并非为多线程访问设计的类对象。也就是说，该类没有使用\
  \ `synchronized` 方法。此外，该类不是由我们创建的，而是由第三方创建的；我们无法访问代码。因此，我们无法为类内部适当的方法添加 `synchronized`\
  \ 修饰符。如何访问该类的对象呢？\n\n解决方案是在类外部通过 `synchronized` 块来调用方法：\n\n```java\nsynchronized(object)\n\
  {\n  statements\n}\n```\n这里，`object` 确保了当前线程成功进入了监视器。\n\n### 示例 12.10\n\n使用 `synchronized`\
  \ 块的程序的程序的版本：\n\n```java\nclass A\n{\n  void display(String msg)\n  {\n    System.out.print(\"\
  [\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n  {\n      msg = m;\n      obj = obj1;\n      t = new\
  \ Thread(this);\n      t.start();\n  }\n  public void run()\n  {\n    synchronized(obj)\n\
  \      {\n        obj.display(msg);\n      }\n  }\n}\nclass Synch3\n{\n  public\
  \ static void main(String args[])\n  {\n      A a1 = new A();\n      B b1 = new\
  \ B(a1,\"Hello\");\n      B b2 = new B(a1,\"World\");\n      B b3 = new B(a1,\"\
  Matrix\");\n  }\n}\n```\n\n输出:\n```\n[Hello]\n[World]\n[Matrix]\n```\n\n## 在不同对象上调用相同方法\n\
  \n### 示例 12.11\n\n线程可以在同类的不同对象上调用同一个 `synchronized` 方法，因为每个对象都有不同的锁。这再次导致混合输出。\n\
  \n```java\nclass A\n{\n  synchronized void display(String msg)\n  {\n    System.out.print(\"\
  [\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n  {\n      msg = m;\n      obj = obj1;\n      t = new\
  \ Thread(this);\n      t.start();\n  }\n  public void run()\n  {\n      obj.display(msg);\n\
  \  }\n}\nclass Synch4\n{\n  public static void main(String args[])\n  {\n      A\
  \ a1 = new A();\n      A a2 = new A();\n      A a3 = new A();\n      B b1 = new\
  \ B(a1,\"Hello\");\n      B b2 = new B(a2,\"World\");\n      B b3 = new B(a3,\"\
  Matrix\");\n  }\n}\n```\n\n输出:\n```\n[Hello[World[Matrix]\n]\n]\n```\n\n\n\n\n\n\
  # 使用静态同步方法\n\n### 示例 12.12\n\n在下面的示例中，尽管我们在不同的对象上调用了 `display()` 方法，但输出并没有混合。这是因为\
  \ `display()` 方法是 `static`（静态的），因此获取的锁是针对整个类 `A`，而不是针对单个对象。\n\n```java\nclass A\n\
  {\n    static synchronized void display(String msg)\n    {\n      System.out.print(\"\
  [\" + msg);\n      try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      System.out.println(\"\
  ]\");\n    }\n}\nclass B implements Runnable\n{\n    A obj;\n    String msg;\n \
  \   Thread t;\n    B(A obj1, String m)\n    {\n      msg = m;\n      obj = obj1;\n\
  \      t = new Thread(this);\n      t.start();\n    }\n    public void run()\n \
  \   {\n      obj.display(msg);\n    }\n}\nclass Synch5\n{\n    public static void\
  \ main(String args[])\n    {\n      A a1 = new A();\n      A a2 = new A();\n   \
  \   A a3 = new A();\n      B b1 = new B(a1,\"Hello\");\n      B b2 = new B(a2,\"\
  World\");\n      B b3 = new B(a3,\"Matrix\");\n    }\n}\n```\n\n输出:-\n```\n[Hello]\n\
  [World]\n[Matrix]\n```\n\n## 线程间通信\n\n如前所述，多线程通过将我们的任务划分为离散的逻辑单元，取代了事件循环编程。线程还证明了次要优势：它们消除了轮询（polling）。轮询通常通过一个循环实现，用于重复检查某些条件。一旦条件为真，就会采取相应的操作。\n\
  \n这浪费了 CPU 周期。例如，考虑经典的队列问题，一个线程在产生数据，另一个线程在消费这些数据。为了让问题更具交互性，假设生产者必须等待消费者完成任务后才能生成更多数据。在轮询系统中，消费者在等待生产者生产时会浪费许多\
  \ CPU 周期。一旦生产者完成，它就会开始轮询，浪费更多 CPU 周期来等待消费者完成，以此此类推。\n\n为了避免轮询，Java 通过 `wait()`、`notify()`\
  \ 和 `notifyAll()` 方法包含了一种优雅（智能）的进程间通信机制。这些方法被实现为 `Object` 类中的 `final` 方法，因此所有类都拥有这些方法。这三个方法只能在\
  \ `synchronized` 上文中调用。使用这些方法有某些规则。\n\n- `wait()` 告诉调用它的线程释放监视器并进入睡眠，直到其他某个线程进入同一个监视器并调用\
  \ `notify()`。\n- `notify()` 唤醒在同一对象上调用 `wait` 的一个线程（通常是第一个线程）。\n- `notifyAll()`\
  \ 唤醒在同一对象上调用 `wait()` 的所有线程。通常优先级最高的线程会首先运行。\n\n这些方法在 `Object` 类中声明，如下所示：\n```java\n\
  final void wait() throws InterruptedException\nfinal void notify()\nfinal void notifyAll()\n\
  ```\n\n## 示例 12.13\n\n下面的示例程序错误地实现了简单形式的生产者/消费者问题。它由四个类组成：`Q`，我们正尝试同步的队列；`Producer`，产生队列条目的线程对象；`Consumer`，消费队列条目的线程对象；以及\
  \ `PC`，创建单个 `Q`、`Producer` 和 `Consumer` 的微小类。\n\n```java\nclass Q\n{ \n    int n;\n\
  \    synchronized int get()\n    { \n      System.out.println(\"Got:\"+n);\n   \
  \   return n;\n    }\n    synchronized void put(int n)\n    {\n      this.n=n;\n\
  \      System.out.println(\"Put:\"+n);\n    }\n}\nclass Producer implements Runnable\n\
  {\n    Q q1;\n    Producer(Q q2)\n    {\n      q1=q2;\n      new Thread(\"Producer\"\
  ).start();\n    }\n    public void run()\n    { \n      int i=0;\n      while(true)\n\
  \      { \n        q1.put(++i);\n      }\n    }\n}\nclass Consumer implements Runnable\n\
  {\n    Q q1;\n    Consumer(Q q2)\n    {\n      q1=q2;\n      new Thread(\"Consumer\"\
  ).start();\n    }\n    public void run()\n    { \n      while (true)\n      { \n\
  \        q1.get();\n      }\n    }\n}\nclass PC\n{\n    public static void main(String\
  \ args[])\n    {\n      Q q1=new Q();\n      new Producer(q1);\n      new Consumer(q1);\n\
  \      System.out.println(\"Press Control-C to stop\");\n    }\n}\n```\n\n尽管 `Q`\
  \ 上的 `put()` 和 `get()` 方法是 `synchronized` 的，但没有任何东西能阻止生产者超过消费者，也没有东西能阻止消费者两次消费同一个值。因此，我们可能会如下所示的错误输出：\n\
