  );\n      Button b2=new Button(\"Click me\");\n      b1.addActionListener(new B());\n\
  \      b2.addActionListener(new C());\n      f.add(b1);\n      f.add(b2);\n    \
  \  f.setVisible(true);\n    }\n}\nclass B implements ActionListener\n{\n  public\
  \ void actionPerformed(ActionEvent ae)\n    {\n      System.out.println(\"Button\
