  9 copy.jpg](img/image045.jpg)\n\n在 Amazon.com 上搜索此书，ISBN 为 978-1500730413。\n\n![STAR-LOGO-2013](img/image024.png)\n\
  \n# 第 9 章\n\n# ∞\n\n# (接口)\n\n––––––––\n\n### 引言-\n\n接口基本上是一种类。由于和类一样，接口包含方法和变量，但有一个主要的区别。区别在于接口只定义抽象方法和最终变量（常量）。这意味着接口不编写任何实现这些方法的代码，数据字段只包含常量。\n\
  \n因此，实现接口并定义实现代码是类的责任。在实践中，这意味着我们可以定义接口，而不对其实现方式做出假设。接口的目的是分离类必须做什么，而不说如何实现。\n\n\
  \n\n\n\n嵌套接口是指声明出现在另一个类或接口体内的接口。顶层接口不是嵌套接口的接口。定义接口的语法与定义类的语法非常相似。接口定义的通用形式如下：\n\n\
  ```java\ninterface interface_name\n{\n    variable declarations;\n    methods declarations;\n\
  }\n```\n\n在这里，`interface` 是关键字，`interface_name` 是任何有效的 Java 标识符（类似于类名）。\n\n**注意：**\
  \ 当我们定义一个接口时，默认情况下它是 `public`（公共）且 `abstract`（抽象的）。\n\n### 接口修饰符\n顶层接口可以使用的修饰符只有\
  \ `abstract` 和 `public`。即使我们不使用 `abstract` 修饰符，接口也会被隐式地声明为 `abstract`，因此不需要使用 `abstract`\
  \ 修饰符。顶层接口的可见性可以是 `package`（包级）或 `public`，就像顶层类一样。如果不使用可见性修饰符，则接口的可见性假设为 `package`。\n\
  \n### 数据变量成员声明\n接口中只能定义常量。接口中的所有变量都是隐式地 `public`、`final` 和 `static` 的，这意味着它们不能被实现类更改。它们还必须用常量值初始化。\n\
  \n```java\npublic static final type variable_name=value;\n```\n\n在接口中声明的变量是 `public`、`static`\
  \ 和 `final`。这意味着它是具有 `public` 访问权限的静态变量。该变量也被声明为 `final`，这意味着它在声明时必须赋值，并且之后不能修改。`final`\
  \ 关键字类似于 C/C++ 中的 `const`。\n\n### 方法声明\n方法声明将仅包含方法列表，而不包含任何语句。它们在参数列表后以分号结束。它们本质上是\
  \ `abstract` 方法，接口中指定的任何方法都不能有默认实现。\n\n接口中的所有方法默认始终都是 `public` 和 `abstract` 修饰符。我们不能在接口中声明\
  \ `static` 方法。\n\n```java\npublic abstract return_type method_name(parameter_list);\n\
  ```\n\n```是一个包含两个变量和一个方法的接口定义示例：\n\n```java\ninterface item\n{\n    static final\
  \ int code = 1001;\n    static final String name = \"Matrix\";\n    abstract void\
  \ display( );\n}\n```\n\n**注意：** 方法的代码不包含在接口中，方法声明简单地以分号结束。\n\n另一个接口示例：\n\n```java\n\
  interface area\n{\n    float pi = 3.142f;\n    float compute (float x, float y);\n\
  \    void show( );\n}\n```\n\n### 扩展接口\n像类一样，接口也可以被扩展，即一个接口可以从其他接口派生。新接口将以类似于子类的方式继承子接口的所有成员。这通过使用\
  \ `extends` 关键字来实现，如下：\n\n```java\ninterface interface_1\n{\n    int code = 1001;\n\
  \    String name = \"Matrix\";\n}\n\ninterface interface_2 extends interface_1\n\
  {\n    void display();\n}\n```\n\n`interface_2` 将继承常量 `code` 和 `name`。\n\n**注意：**\
  \ 变量 `name` 和 `codes` 的声明方式像普通变量。这在这里是允许的，但接口中的所有变量都被视为常量、`public` 且 `static`，尽管这里没有\
  \ `public`、`static` 和 `final` 关键字。\n\n我们可以将多个接口组合成一个接口。以下声明是有效的：\n\n```java\ninterface\
  \ interface_1\n{\n    int code = 1001;\n    String name = \"Matrix\";\n}\n\ninterface\
  \ interface_2\n{\n    void display();\n}\n\ninterface interface_3 extends interface_1,\
  \ interface_2\n{\n    //\n}\n```\n\n**注意：** 始终记住接口不能扩展类。这违反了接口只能有抽象方法和常量的规则。\n\n\
  ### 实现接口\n接口被用作“超类”，其属性被类继承。因此，有必要创建一个给定接口的类。一旦定义了接口，一个或多个类就可以实现该接口。\n\n要实现接口，要在类定义中包含\
  \ `implements` 子句，然后创建接口声明的方法。实现类必须提供所有接口中所有方法的体，否则它必须被声明为 `abstract`。实现类还可以扩展一个类并实现多个接口。\n\
  \n```java\nmodifier class<class-name> implements<interface-name>\n{\n    body of\
  \ the class\n}\n```\n\n**类中实现接口的 implements 语法**\n\n```java\ninterface interface_name\n\
  {\n    //\n}\n\nclass class _name implements interface_name\n{\n    Body of class\n\
  }\n```\n\nJava 不支持多继承，但它支持多接口继承，即一个类可以实现多个接口，如下所示：\n\n```java\nmodifiers class <class-name>\
  \ implements <interface-1>,<interface-2>,<interface-3>, ....<interface-n>\n{\n \
  \   body of class\n}\n```\n\n**注意：** 当我们实现接口方法时，它必须声明为 `public`。实现接口的方法类似于重写，因此我们不能降低可见性。\n\
  \n**示例 9.1**\n```java\n1. interface interface_1\n2. {\n3.    void show(int x);\n\
  4. }\n5. class class_1 implements interface_1\n6. {\n7.    public void show(int\
  \ x)\n8.    {\n9.        //\n10.   }\n11. }\n```\n\n**示例 9.2 抽象类**\n```java\n1.\
  \ interface common\n2. {\n3.    void push(int x);\n4.    void pop( );\n5. }\n6.\
  \ abstract class stack implements common\n7. {\n8.    void pop()\n9.    {\n10. \
  \      //\n11.   }\n```\n类 `stack` 没有实现 `push()` 和 `pop()` 方法。因此我们必须将 `stack` 声明为抽象。\n\
  \n### 通过接口访问类对象\n我们可以声明使用接口而非类型的对象引用。实现接口的任何实例都可以这种变量引用。当我们通过这些引用之一调用方法时，将调用所引用实例的正确版本。这是接口的重要特性之一，允许在调用这些方法的代码之后创建类。此过程类似于使用父类引用来访问子类。由于在运行时动态查找方法与\
  \ Java 中普通方法调用相比会有巨大的开销，我们应该不要随意使用接口。\n\n**示例 9.3**\n```java\n1. interface Math_function\n\
  2. {\n3.    void display(int x);\n4. }\n5. class Sqrt implements Math_function\n\
  6. {\n7.    public void display(int x)\n8.    {\n9.        System.out.println(\"\
  sqrt of x =\"+Math.sqrt(x));\n10.   }\n11. }\n12. class Log implements Math_function\n\
  13. {\n14.    public void display(int x)\n15.    {\n16.        System.out.println(\"\
  log of x = \"+Math.log(x));\n17.   }\n18. }\n19. class Math_Demo\n20. {\n21.   \
  \ public static void main(String args[])\n22.    {\n23.        Math_function f1\
  \ = new Sqrt();\n24.        Math_function f2 = new Log();\n25.        f1.display(27);\n\
  26.        f2.display(3);\n27.        Math_function f3;\n28.        f3=f1; //多态（赋值引用）\n\
  29.        f3.display(30);\n30.    }\n31. }\n```\n\n\n\n\n\n```java\n30. f3=f2;\
  \  //多态（赋值引用）\n31. f3.display(5);\n32. }\n33. }\n```\n输出:\n![image](img/image072.png)\n\
  \n## 接口的特性：\n\n- `Interface` 是一个关键字。\n- `Interface` 可以声明为抽象的，但它默认就是抽象的，因此没有必要添加\
  \ `abstract` 关键字。\n- 所有变量始终是 `public static` 且 `final` 的。\n- 接口中的所有方法必须在类中实现。\n\
  - 实现类中实现的所有方法必须是 `public` 的。\n- `Interface` 仅包含方法的声明。\n- `Interface` 方法不能声明为 `static`（静态）的。它们总是被声明为实例方法。\n\
  - 类既不能缩小接口方法的访问权限，也不能在方法的 `throws` 子句中指定新的异常；因为尝试这样做等同于更改了接口的契约，这是非法的。重写方法的标准也适用于实现接口方法。\n\
  - 在实现类中，所有方法都需要定义为 `public`。\n- 这里允许使用 `abstract` 关键字进行部分实现。\n- 无论类直接或间接实现了多少个接口，它对于可能在接口中有多次声明的方法只提供单一的实现。\n\
  - 方法原型声明也可以像类一样进行重载。\n- 接口常量可以通过任何客户端（类或接口）使用其全限定名来访问，无论该客户端是否扩展或实现了该接口。然而，如果客户端是实现此接口的类，或扩展了此接口的接口，则客户端也可以直接访问此类常量，而无需使用全限定名。此类客户端继承了接口常量。\n\
  - 在接口常量多重继承的情况下，任何名称冲突都可以通过使用相关常量的全限定名来解决。\n\n### 接口变量\n\n接口中的所有变量始终是 `public static`\
  \ 且 `final`，因为它们是实现类访问数据类型和方法的公共部分。\n\n### 接口变量的内存管理：\n\n静态变量在程序加载时总是获取内存，它们占用独立的内存，不与任何对象的内存共享。它们也被称为常量变量。可以使用接口名和\
  \ `{.}` 点运算符直接访问。\n\n#### 示例 9.4\n\n```java\n1. interface Static_Var\n2. {\n3. \
  \  int sun=1;\n4.   int mon=2;\n5.   int tues=3;\n6.   int wed=4;\n7.   int thurs=5;\n\
  8.   int fri=6;\n9.   int sat=7;\n10. }\n11. class Week_Day implements Static_Var\n\
  12. {\n13.   public static void main(String args[])\n14.   {\n15.     System.out.println(sun);\n\
  16.     System.out.println(mon);\n17.     System.out.println(tues);\n18.     System.out.println(wed);\n\
  19.     System.out.println(thurs);\n20.     System.out.println(fri);\n21.     System.out.println(sat);\n\
  22.   }\n23. }\n```\n或者\n\n```java\n11. class Week_Day\n12. {\n13.   public static\
  \ void main(String args[])\n14.   {\n15.     System.out.println(Static_Var.sun);\n\
  16.     System.out.println(Static_Var.mon);\n17.     System.out.println(Static_Var.tues);\n\
  18.     System.out.println(Static_Var.wed);\n19.     System.out.println(Static_Var.thurs);\n\
  20.     System.out.println(Static_Var.fri);\n21.     System.out.println(Static_Var.sat);\n\
  22.   }\n23. }\n```\n输出: 1\n2\n3\n4\n5\n6\n7 \n\n#### 示例 9.5\n\n```java\n1. interface\
  \ Two_Methods\n2. {\n3.   void m1( );\n4.   void m2( );\n5. }\n6. class Three_Methods\
  \ implements Two_methods\n7. {\n8.   public void m1( )\n9.   {\n10.   body of the\
  \ m1;\n11.  }\n12.  public void m2( )\n13.  {\n14.   body of the m2;\n15.  }\n16.\
  \  public void m3( )\n17.  {\n18.   body of the m3;\n19.  }\n20. }\n21. class Methods_Demo\n\
  22. {\n23.   public static void main(String args[])\n24.   {\n25.     Two_methods\
  \ tm1 = new Three_methods();\n26.     tm1.m1();\n27.     tm1.m2();\n28.     //tm1.m3();\
  \ error\n29.     Three_Methods tm2 = new Three_Methods();\n30.     tm2.m3();\n31.\
  \   }\n32. }\n```\n注意：- 这里我们不使用接口引用调用 `m3()`，因为该方法在接口中没有声明。因此，接口引用可以访问自身块中声明的方法。否则可以调用这些方法。\n\
  \n#### 示例 9.6\n\n当类扩展了接口并在类中定义了接口中未声明的方法时。\n\n```java\n1. interface Two_Methods\n\
  2. {\n3.   void m1( );\n4.   void m2( );\n5. }\n6. interface One_Method\n7. {\n\
  8.   void m3();\n9. }\n10. class Three_Methods implements Two_Methods, One_Method\n\
  11. {\n12.   public void m1( )\n13.   {\n14.   body of the m1;\n15.  }\n16.  public\
  \ void m2( )\n17.  {\n18.   body of the m2;\n19.  }\n20.  public void m3( )\n21.\
  \  {\n22.   body of the m3;\n23.  }\n24. }\n25. class Methods_Demo\n26. {\n27. \
  \  public static void main(String args[])\n28.   {\n29.     Two_methods tm1 = new\
  \ Three_methods();\n30.     tm1.m1();\n31.     tm1.m2();\n32.     //tm1.m3(); error\n\
  33.     Three_Methods tm2 = new Three_Methods();\n34.     tm2.m3();\n35.   }\n36.\
  \ }\n```\n\n### 非接口方法\n\n当类实现了接口并在类中定义了接口中未声明的方法时，我们可以说这些方法是非接口方法。\n\n#### 示例 9.7\n\
  \n```java\n1. interface Two_Methods\n2. {\n3.   void push(int x);\n4.   int pop();\n\
  5. }\n6. class Stack implements Two_Methods\n7. {\n8.   int arr[] = new int[5];\n\
  9.   int top= -1;\n10.  public void push(int item)\n11.  {\n12.    if(top = 4)\n\
  13.      {\n14.        System.out.println(\"Overflow\");\n15.        return;\n16.\
  \      }\n17.    top++;\n18.    arr[top]=item;\n19.  }\n20.  public int pop()\n\
  21.    {\n22.    if(top = -1)\n23.      {\n24.        System.out.println(\"Underflow\"\
  );\n25.        return;\n26.      }\n27.    int item = arr[top];\n28.    top--;\n\
  29.    return (item);\n30.  }\n31.  void disp()\n32.  {\n33.    for(int i=top;i>=0;i--)\n\
  34.    {\n35.      System.out.println(arr[i]);\n36.    }\n37.  }\n38. }\n39. class\
  \ Stack_Demo\n40. {\n41.   public static void main(String args[])\n42.   {\n43.\
  \     Two_Methods t1=new Stack();\n44.     t1.pop();\n45.     for(int i=0;i<5;i++)\n\
  46.     {\n47.       t1.push(i+100);\n48.       t1.push(i+600);\n49.     }\n50.\
  \     System.out.println(\"Displaying All Item\");\n51.     t1.disp();\n52.    \
  \ System.out.println(\"Removing All the Items\");\n53.   }\n54. }\n```\n输出:\nUnderflow\n\
  Overflow\nDisplaying All Item\n100\n101\n102\n103\n104\nRemoving All the Items\n\
  104\n103\n102\n101\n100\n\n# 章节\n\n# ∞ 10 ∞\n\n# (String 和 StringBuilder)\n\n###\
  \ 引言-\n\n在 Java 中 String 是类对象，并使用 String 和 StringBuilder 两个类来实现。与 C 字符串相比，Java 字符串更加可靠和可预测。这基本上由于\
  \ C 缺乏边界检查。Java 字符串不是字符数组，也不是 NULL 终止的。\n\n\n\n\n\n该规则唯一的例外是 `+` 和 `+=` 运算符，它们会拼接两个字符串并产生一个\
  \ `String` 对象作为结果。在 Java 中，字符数组不被视为字符串。在 Java 中，`String` 类被定义用于执行所有的字符串操作。`String`\
  \ 类和 `StringBuffer` 类是 `java.lang` 包的一部分。\n\n### String 类\n\n```java\nString s1\
  \ = new String(\"matrix\");\nString s2 = \"matrix\";\nSystem.out.println(s1);\n\
  System.out.println(s1.length);\nSystem.out.println(\"matrix\".length);\n```\n\n\
  `String` 在 Java 中具有以下特性：\n\n#### (i) String 是 Java 中的一个对象：\n`String` 表示一个字符序列，但与许多将\
  \ `String` 实现为字符数组的语言不同，Java 将字符串实现为类型为 `string` 的对象。\n\n字符串操作是许多 Java 程序中最常见的部分。将字符串实现为内置对象允许\
  \ Java 能够提供全套的功能，使字符串处理变得方便。此外，字符串对象可以通过多种方式构建，以便在需要时轻松获取字符串。\n\n#### (ii) String\
  \ 是不可变的：\n`String` 是不可变的，也就是说我们无法在创建后更改字符串。然而，声明为 `String` 引用的变量可以随时更改指向其他字符串对象。\n\
  \n我们仍然可以执行所有类型的字符串操作。每当我们我们需要现有字符串的修改版本时，都会创建一个包含这些修改的新字符串对象。\n\n原始字符串保持不变。之所以使用这种方法是因为固定的、不可变的字符串可以比可变的字符串实现得更高效。\n\
  \n对于那些需要修改后的字符串的情况，有一个名为 `StringBuffer` 的伴随类，其对象包含在创建后可以被修改的字符串。\n\n#### (iii) String\
  \ 类是 final 的：\n`String` 和 `StringBuffer` 类都是 `final` 的。这意味着我们不能在任何其他类中扩展 `String`\
  \ 类。这允许某些优化来提高常用字符串操作的性能。\n\n### String 类的构造函数与方法\n\n| # | 方法 | 说明 |\n| :--- | :---\
  \ | :--- |\n| 1 | `public String() ` | 初始化新创建的 `String` 对象，使其表示一个空字符序列。`String s1\
  \ = new String();` |\n| 2 | `public String(String str)` | 初始化新创建的 `String` 对象，使其与参数具有相同的字符序列；换之，新创建的字符串是参数字符串的拷贝。`String\
  \ s1 = new String(\"Matrix\"); String s2 = new String(s1);` 字符串 `s2` 是字符串 `s1` 的拷贝。虽然内容相同，但\
  \ `s1` 和 `s2` 指向不同的字符串对象。 |\n| 3 | `public String(char ch[])` | 分配一个新的 `String`，使其表示字符数组参数中当前包含字符序列。`char\
  \ ch[] = {'a', 'b', 'c'}; String s1 = new String(ch);` // s1 将持有 \"abc\" |\n| 4\
  \ | `public String(char value[], int offset, int count)` | 分配一个新的 `String`，包含来自字符数组参数中子数组的字符。`char\
  \ ch[] = {'a', 'b', 'c', 'd', 'e', 'f'}; String s1 = new String(ch,2,3);` // s1\
  \ 将持有 \"cde\" |\n| 5 | `public String(int value[], int offset, int count)` | 分配一个新的\
  \ `String`，包含来自整数数组参数中包含字符 Unicode 的子数组的字符。`int a[] = {97, 98, 99, 100, 101, 102};\
  \ String s1 = new String(a,2,3);` // s1 将持有 \"cde\" |\n| 6 | `public String(byte\
  \ b[], int offset, int count)` | 使用平台默认字符集解码指定的字节子数组以构造一个新的 `String`。`byte b[] =\
  \ {97, 98, 99, 100, 101, 102}; String s1 = new String(b,2,3);` // s1 将持有 \"cde\"\
  \ |\n| 7 | `public String(byte[])` | 使用平台默认字符集解码指定的字节数组以构造一个新的 `String`。`byte b[]\
  \ = {97, 98, 99}; String s1 = new String(b);` // s1 将持有 \"abc\" 尽管 Java 的 `char`\
  \ 类型使用 16 位来表示 Unicode 字符集，但互联网上字符串的典型格式使用由 ASCII 字符集构建的 8 位字节数组。因为 8 位 ASCII 字符串很常见，`String`\
  \ 类提供了在给定字节数组时初始化字符串的构造函数。在上述每个构造函数中，字节到字符的转换是通过使用平台的默认编码完成的。 |\n| 8 | `public String(StringBuffer)`\
  \ | |\n| 9 | `public int length()` | 将显示字符串的字符数。 |\n| 10 | `public boolean isEmpty()`\
  \ | 如果字符串为空则显示 true，否则显示 false。`String s1 = new String(); System.out.println(s1.isEmpty());`\
  \ |\n| 11 | `public char charAt(int index)` | 返回指定索引处的 `char` 值。索引范围从 0 到 `length()–1`。序列的第一个字符值位于索引\
  \ 0。`String s1 = \"matrix\"; System.out.println(s1.charAt(0)); // 将打印 \"m\" |\n\
  | 12 | `public void getChars(int srcBegin, int srcEnd, char[] dst, int dstBegin)`\
  \ | 将字符串从 `srcBegin` 到 `srcEnd` 的字符拷贝到字符数组 `dst` 的 `dstBegin` 处。如果索引无效，则抛出 `StringIndexOutOfBoundsException`。`String\
  \ s1 = \"matrix\"; char[] dst = new char[3]; s1.getChars(0, 3, dst, 0); // dst 将持有\
  \ \"mat\" |\n| 13 | `public void getBytes(int srcBegin, int srcEnd, byte[] dst,\
  \ int dstBegin)` | 使用平台默认字符集将字符串从 `srcBegin` 到 `srcEnd` 的字符拷贝到字节数组 `dst` 的 `dstBegin`\
  \ 处。 |\n| 14 | `public byte[] getBytes()` | 使用平台默认字符集将字符串编码为字节序列，并返回字节数组。 |\n| 15\
  \ | `public boolean equals(Object obj)` | 比较调用字符串与指定的对象。仅当参数不为空且表示与调用字符串相同字符序列的\
  \ `String` 对象时，结果为 true。 |\n| 16 | `public boolean equalsIgnoreCase(String anotherString)`\
  \ | 忽略大小写比较调用字符串与另一个字符串。 |\n| 17 | `public int compareTo(String str)` | 将调用字符串与传入的字符串进行字典序比较。返回返回值：`<0`\
  \ 调用字符串小于 str，`>0` 调用字符串大于 str，`0` 两个字符串相等 |\n| 18 | `public int compareIgnoreCase(String\
  \ anotherString)` | 忽略大小写比较两个字符串。 |\n| 19 | `public boolean regionMatches(int startIndex,\
  \ String str2, int str2StartIndex, int len)` | 测试两个字符串区域是否相等。 |\n| 20 | `public\
  \ boolean regionMatches(Boolean ignoreCase, int startIndex, String str2, int str2StartIndex,\
  \ int len)` | 测试两个字符串区域是否相等。如果 `ignoreCase` 标志为 true，则忽略大小差异。 |\n| 21 | `public\
  \ boolean startsWith(String prefix, int startIndex)` | 测试字符串是否从指定索引开始于指定的前缀。该方法不返回任何异常，如果\
  \ `startIndex` 越界则返回 false。 |\n| 22 | `public boolean startsWith(String prefix)`\
  \ | 测试字符串是否以指定的前缀开头。 |\n| 23 | `public boolean endsWith(String suffix)` | 测试字符串是否以指定的后缀结尾。\
  \ |\n| 24 | `public int indexOf(char ch)` | 返回指定字符在字符串中第一次出现的索引。 |\n| 25 | `public\
  \ int indexOf(char ch, int fromIndex)` | 返回指定字符在字符串中第一次出现的索引，从指定的索引开始搜索。 |\n| 26\
  \ | `public int indexOf(String str)` | 返回指定子字符串在字符串中第一次出现的索引。 |\n\n\n\n\n\n\n| 索引\
  \ | 说明 |\n| :--- | :--- |\n| 27 | `public int indexOf(String str, int fromIndex)`;\
  \ 返回此字符串中从指定索引开始的指定子字符串首次出现的索引。 |\n| 28 | `public int lastIndexOf(int ch)`; 返回此字符串中指定字符最后一次出现的索引。\
  \ |\n| 29 | `public int lastIndexOf(int ch, int fromIndex)`; 返回此字符串中从指定索引开始向后搜索的指定字符最后一次出现的索引。\
  \ |\n| 30 | `public int lastIndexOf(String str)`; 返回此字符串中指定子字符串最后一次出现的索引。 |\n| 31\
  \ | `public int lastIndexOf(String str, int fromIndex)`; 返回此字符串中从指定索引开始向后搜索的指定子字符串最后一次出现的索引。\
  \ |\n| 31 | `public String substring(int)`; 获取从第 $n^{th}$ 个字符开始的子字符串 |\n| 32 | `public\
  \ String substring(int n, int m)`; 获取从第 $n^{th}$ 个到第 $m^{th}$ 个字符（不包括 $m^{th}$ 个）的子字符串\
  \ |\n| 33 | `public String concat(String str)`; 将字符串 `str` 拼接到调用字符串对象的末尾。 |\n| 34\
  \ | `public String replace(char x, char y)`; 将所有的 `x` 替换为 `y` |\n| 35 | `public\
  \ String replaceFirst(String, String)` | |\n| 36 | `public String replaceAll(String,\
  \ String)` | |\n| 37 | `public String toLowerCase()`; 将字符串转换为小写 |\n| 38 | `public\
  \ String toUpperCase()`; 将字符串转换为大写 |\n| 39 | `public String trim()`; 移除开头和结尾的空格\
  \ |\n| 40 | `public char[] toCharArray()`; 将调用的字符串转换为新的字符数组。提供此函数是为了方便使用，因为可以使用\
  \ `getChars()` 达到相同的结果 |\n| 41 | `public static String valueOf(Object)`; 为参数 `p`（简单类型或对象）创建一个字符串对象\
  \ |\n\n## 字符串数组\n\n我们还可以创建并使用包含字符串的数组。\n\n### 示例 10.1\n\n```java\nimport java.util.Scanner;\n\
  \nclass StringArrSort\n{\n  public static void main(String args[])\n    {\n    \
  \  Scanner sc=new Scanner(System.in);\n      System.out.print(\"Enter how many names\
  \ \");\n      int n=sc.nextInt();\n      String s[]=new String[n];\n      //input\n\
  \      for(int i=0;i<n;i++)\n      {\n        System.out.println(\"Enter name \"\
  \ + (i+1));\n        s[i]=sc.next();\n      }\n      //sorting\n      for(int i=0;i<n-1;i++)\n\
  \        for(int j=i+1;j<n;j++)\n          if(s[i].compareTo(s[j]) > 0)\n      \
  \    {\n            String t=s[i];\n            s[i]=s[j];\n            s[j]=t;\n\
  \          } \n      //output\n      for(int i=0;i<n;i++)\n        System.out.println(s[i]);\n\
  \    }\n}\n```\n\n## 字符串转换与 toString()\n\n当 Java 在拼接过程中将数据转换为其 `String` 表示形式时，它是通过调用\
  \ `String` 类定义的重载字符串转换方法 `valueOf()` 实现的。`valueOf()` 是一个静态方法，对所有简单类型和 `Object` 类型都进行了重载。\n\
  \n对于简单类型，`valueOf()` 返回一个包含调用时的值的类可读等效形式的字符串。对于对象，`valueOf()` 调用对象上的 `toString()`\
  \ 方法。\n\n每个类都继承了 `toString()`，因为它是由 `Object` 类定义的。然而，`toString()` 的默认实现很少是足够的。它显示类名，后面跟一个符号“@”，然后是对象\
  \ ID（例如 `Box@ab1342`），这通常没有用处。对于我们创建的大多数类，我们希望重写 `toString()` 并提供我们自己的字符串表示。\n\n\
  ### 示例 10.2:\n\n```java\nclass A\n{\n  private int x,y;\n  A()\n  {\n    x = y =\
  \ 0;\n  }\n  A(int x1, int y1)\n  {\n    x = x1;\n    y = y1;\n  }\n}\nclass ToStringTest\n\
  {\n  public static void main(String args[])\n    {\n      A a1 = new A(5,6);\n \
  \     System.out.println(a1); // 调用了类的 toString()\n      String s1=\"Object a1 is\
  \ \" + a1; // 对象与字符串拼接\n      // 再次调用 Object 的 toString()\n      System.out.println(s1);\n\
  \    }\n}\n```\n输出：\n`A@3e25`\n`Object a1 is A@3e25`\n\n### 示例 10.3:-\n\n```java\n\
  class A\n{\n  private int x,y;\n  A()\n  {\n    x = y = 0;\n  }\n  A(int x1, int\
  \ y1)\n  {\n    x = x1;\n    y = y1;\n  }\n  public String toString()\n  {\n   \
  \ return (x + \",\" + y);\n  }\n}\nclass ToStringTest2\n{\n  public static void\
  \ main(String args[])\n    {\n      A a1 = new A(5,6);\n      System.out.println(a1);\
  \ // 调用了类的 toString()\n      String s1=\"Object a1 is \" + a1; // 对象与字符串拼接\n   \
  \   // 再次调用了类的 toString()\n      System.out.println(s1);\n    }\n}\n```\n输出：\n`5,6`\n\
  `Object a1 is 5,6`\n\n### 示例 10.4:-\n\n```java\nimport java.util.*;\nclass FindTest\n\
  {\n  public static void main(String args[])\n    {\n      Scanner sc=new Scanner(System.in);\n\
  \      String s1,s2;\n      System.out.print(\"Enter a string\");\n      s1=sc.next();\n\
  \      System.out.print(\"Enter string to search\");\n      s2=sc.next();\n    \
  \  int ans = s1.indexOf(s2);\n      if(ans == -1)\n        System.out.println(\"\
  Not Found\");\n      else\n        System.out.println(\"found at pos \" + ans);\n\
  \    }\n}\n```\n\n## StringBuffer\n\n`StringBuffer` 是 `String` 的对等类，提供了许多 `String`\
  \ 的功能。正如我们知道的，`String` 代表固定长度的字符序列。相比之下，`StringBuffer` 代表可增长和可写的序列。`StringBuffer`\
  \ 可以在中间插入或在末尾追加字符。`StringBuffer` 会自动扩展以容纳这些添加。Java 经常使用该类，但许多程序员只处理 `String`，实际上在底层通过重载的\
  \ `+` 运算符来操作 `StringBuffer`。\n\n### 关于 StringBuffer 类的一些要点\n\n- `StringBuffer` 类似于\
  \ `Object`。\n- `StringBuffer` 类像 `String` 类一样 `final`。\n- `StringBuffer` 对象是可变的（可以修改），不像\
  \ `String` 对象。\n\n### StringBuffer 的构造函数和方法:-\n\n| 方法 | 说明 |\n| :--- | :--- |\n\
  | `public StringBuffer()` | 构造函数在不重新分配的情况下预留 16 个字符。 |\n| `public StringBuffer(int)`\
  \ | 该构造函数接受一个整数参数，显式设置缓冲区的大小。 |\n| `public StringBuffer(String)` | 该构造函数接受一个 `String`\
  \ 参数，设置 `StringBuffer` 对象的初始内容并在不重新分配的情况下预留 16 个字符。 |\n| `public synchronized int\
  \ length()` | 返回 `StringBuffer` 的当前长度。 |\n| `public synchronized int capacity()`\
  \ | 返回当前容量。容量是新插入字符的存储空间，超过此处将发生分配。 |\n| `public synchronized void ensureCapacity(int)`\
  \ | 确保容量至少等于指定的最小值。如果我们想在构造 `StringBuffer` 之后预留某些字符的空间，可以使用 `ensureCapacity()` 方法设置缓冲区的大小。如果我们预先知道将向\
  \ `StringBuffer` 追加许多小字符串，这非常有用。 |\n| `public synchronized void trimToSize()` |\
  \ 将移除额外的空闲空间。现在容量将等于长度。 |\n| `public synchronized void setLength(int newLength)`\
  \ | 设置字符序列的长度。`newLength` 必须是非负的。当我们增加缓冲区时，会在末尾添加空字符。如果我们调用的 `setLength()` 的值小于\
  \ `length()` 返回的值，则存储在该长度之外的字符将丢失。 |\n\n\n\n\n\n## 方法参考\n\n| `public synchronized\
  \ char charAt(int index)` | 返回此序列中指定索引处的 `char` 值。 |\n| `public synchronized void\
  \ getChars(int srcBegin, int srcEnd, char[] dst, int dstBegin)` | 将字符从此序列复制到目标字符数组\
  \ `dst` 中。第一个复制的字符位于索引 `srcBegin`；最后一个复制的字符位于索引 `srcEnd-1`。要复制的字符总数为 `srcEnd-srcBegin`。字符被复制到\
  \ `dst` 中从索引 `dstBegin` 开始的子数组中。注意：确保目标或目标数组足够大以便容纳指定子字符串中的字符数量。 |\n| `public synchronized\
  \ void setCharAt(int index, char ch)` | 将指定索引处的字符设置为 `ch`。如果 `index` 为负数或大于等于 `length()`，则抛出\
  \ `IndexOutOfBoundsException`。 |\n| `public synchronized StringBuffer append(Object)`\
  \ | `append` 方法将任何其他类型数据的字符串表示连接到调用者 `StringBuffer` 对象的末尾。 |\n| `public synchronized\
  \ StringBuffer delete(int start, int end)` | 从从索引 `start` 到索引 `end-1` 的字符。 |\n|\
  \ `public synchronized StringBuffer deleteCharAt(int index)` | 删除指定位置的 `char`。 |\n\
  | `public synchronized StringBuffer replace(int start, int end, String str)` | 将索引\
  \ `start` 到 `end-1` 的字符替换为指定 `String` 中的字符。 |\n| `public synchronized String substring(int)`\
  \ | 返回一个新的 `String`，包含当前此字符序列中的字符子序列。子字符串从指定的索引开始，延伸到此序列的末。 |\n| `public synchronized\
  \ String substring(int start, int end)` | 返回一个新的 `String`，包含当前此字符序列中的字符子序列。子字符串从指定的\
  \ `start` 索引开始，延伸到索引 `end-1` 处的字符。 |\n| `public synchronized StringBuffer insert(int,\
  \ Object)` | 将 `String` 插入另一个 `String` 中。它经过重载以接受所有简单类型的值以及 `Strings` 和 `Objects`。\
  \ |\n| `public int indexOf(String)` | |\n| `public synchronized int indexOf(String,\
  \ int)` | |\n| `public int lastIndexOf(String)` | |\n| `public synchronized int\
  \ lastIndexOf(String, int)` | |\n| `public synchronized StringBuffer reverse()`\
  \ | 反转 `StringBuffer` 的内容。 |\n\n### 示例 10.5\n\n```java\nimport java.util.Scanner;\n\
  \nclass SortStr\n{\n    public static void main(String args[])\n    {\n        Scanner\
  \ sc = new Scanner(System.in);\n        System.out.print(\"Enter a string\");\n\
  \        StringBuffer sb1 = new StringBuffer(sc.next());\n        //Sorting\n  \
  \      for(int i=0;i<sb1.length()-1;i++)\n            for(int j=i+1;j<sb1.length();j++)\n\
  \                if(sb1.charAt(i) > sb1.charAt(j))\n                {\n        \
  \            char t=sb1.charAt(i);\n                    sb1.setCharAt(i,sb1.charAt(j));\n\
  \                    sb1.setCharAt(j,t);\n                }\n            System.out.println(sb1);\n\
  \    }\n}\n```\n**输出：** Enter a string SHIVAM\nAHIMSV\n\n## 示例 10.6：统计给定句子中单词数的程序。\n\
  \n```java\nclass WordCnt\n{\n    public static void main(String args[])\n    {\n\
  \        String s1 = \"Mohan Das Karam Chand Gandhi\";\n        boolean flag=false;\n\
  \        int cnt=0;\n        for(int i=0;i<s1.length();i++)\n        {\n       \
  \     if(s1.charAt(i) == ' ')\n                flag = false;\n            else\n\
  \            {\n                if(flag == false)\n                {\n         \
  \           flag = true;\n                    cnt++;\n                }\n      \
  \      }\n        }\n        System.out.print(\"No. of Words=\" + cnt);\n    }\n\
  }\n```\n**输出：** No. of Words=5\n\n# 第一章：异常处理\n\n## 简介\n`Exception` 是在运行时发生并中断程序正常流的条件。当\
  \ Java 解释器遇到错误时，它会创建一个 `Exception` 对象并将其抛出。在旧的语言中，异常处理是通过 `goto` 和返回码完成的，这非常繁琐。Java\
  \ 通过使用面向对象的方法避免了这一点。\n\n### 异常基础\n`Exception` 是一个描述代码中错误条件的对象。当出现异常情况时，会创建并抛出一个\
  \ `Exception` 对象。异常可以由 Java 运行时系统生成，也可以由你的代码手动生成。这些与违反语言规则的错误有关。\n\nJava 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws`\
  \ 和 `finally`。\n- `try`：你想监控异常的语句包含在 `try` 块中。\n- `catch`：如果在 `try` 块内发生异常，在此捕获并处理。\n\
  - `throw`：用于手动抛出异常。\n- `throws`：任何抛出方法的异常必须由 `throws` 子句指定。\n- `finally`：任何在 `try`\
  \ 块完成后必须执行的代码都放在这里。\n\n**异常处理块的通用形式：**\n```java\ntry {\n    // 监控错误的代码块\n}\ncatch\
  \ (ExceptionType1 exOb) {\n    // 针对 ExceptionType1 的异常处理器\n}\nfinally {\n    //\
  \ try 结束后必须执行的代码块\n}\n```\n\n### 异常类型\n所有异常类型都是内置类 `Throwable` 的子类。因此，`Throwable`\
  \ 位于异常类层次结构的顶端。`Throwable` 之下有两个子类，它们将异常分为两个不同的分支：\n\n1. `Exception`：用于用户程序应该捕获的异常情况。你将通过派生该类来创建自定义异常类型。\n\
  2. `RuntimeException`：`Exception` 的一个重要子类，为你编写的程序自动定义，例如除以零和无效的数组索引。\n\n\n\n\n\n\
  另一个分支由 `Error` 顶层，它定义了程序在正常情况下预计不会捕获的异常。`Error` 类型的异常由 Java 运行时系统使用，表示与运行时环境本身有关的错误。栈溢出（Stack\
  \ overflow）就是此类错误的一个示例。本章将不会处理 `Error` 类型的异常，因为这些异常通常是为了响应程序通常无法处理的灾难性故障而创建的。\n\n\
  顶层异常层次结构如图所示：\n\n![image](img/image074.png)\n\n### 示例 11.1\n\n```java\nclass ErrorTest1\n\
  {\n  public static void main(String args[])\n    {\n      int a=5,b=2,c=2,d;\n \
  \     d=a/(b-c); // 发生了 ArithmeticException(Divide by zero)\n      System.out.println(d);\n\
  \      System.out.println(\"This will not be printed\");\n    }\n}\n```\n程序将在除法操作终止，不会执行剩余的语句。\n\
  \n### 示例 11.2\n\n```java\nclass A\n{\n  void display()\n    {\n      -----\n   \
  \ }\n}\nclass ErrorTest2\n{\n  public static void main(String args[])\n    {\n \
  \     A a1=null;\n      a1.display(); // 发生了 NullPointerException\n    }\n}\n```\n\
  在上面的程序中，会发生 `NullPointerException`。引用变量没有用 `new` 初始化。在这种情况下，程序也会终止。\n\n### 示例 11.3\n\
  \n```java\nclass ErrorTest3\n{\n  public static void main(String args[])\n    {\n\
  \      int a[ ] = {10,20,30};\n      System.out.println(a[3]);  // 发生了 ArrayIndexOutOfBoundsException\n\
  \    }\n}\n```\n在上面的情况下，数组的长度为 3，索引从 0 到 2，因此如果我们打印 `a[3]`，那么它就是第 4 个元素，这并不是一个有效的索引。这将产生一个异常错误。在\
  \ C/C++ 中这是允许的，但在 Java 中是不允许。\n\n#### 注意\nJDK 7 增加了一种新形式的 `try` 语句支持自动资源管理。这种新形式的\
  \ `try` 称为 `try-with-resources`，在 `Chapter` 文件中结合文件管理的背景下进行了描述，因为文件是最常使用的资源之一。\n\
  \n#### 异常的其他情况\n1. 我们尝试打开的文件可能不存在。\n2. 我们想要创建一个新对象，但没有可用内存。\n3. 我们想要加载的类文件可能丢失或格式错误。\n\
  4. 我们想要转换为数字的 `String` 包含无效字符，导致无法转换为数字。\n\n如果异常对象没有被妥善捕获和处理，解释器将显示错误消息并终止程序。如果我们希望继续执行剩余代码，则应该尝试捕获由错误条件抛出的异常对象。\n\
  \n这项任务被称为异常处理。异常处理机制目的是提供一种检测和报告“异常情况”的手段，以便采取适当的措施。该机制建议引入一套独立的错误处理代码，用于执行以下任务：\n\
  \n1. 发现问题。（发生异常）\n2. 通知错误已发生。（抛出异常）\n3. 接收错误信息。（捕获异常）\n4. 纠正措施。（处理异常）\n\nJava 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws`\
  \ 和 `finally`。\n\n我们想要监控异常的程序语句包含在 `try` 块中，每当发生错误时，异常就会被抛到 `catch` 块。我们的代码可以捕获此异常（使用\
  \ `catch`）并进行合理的处理。系统生成的异常由 Java 运行时自动抛出。\n\n要手动抛出异常，请使用关键字 `throw`。任何抛出方法的异常都必须通过\
  \ `throws` 子句指定。任何在方法返回之前必须执行的代码放在 `finally` 块中。\n\n`try` 块必须括在括号之间。可以有一个或多个 `catch`\
  \ 语句。`catch` 和 `finally` 块是可选的。即使异常没有被处理，`finally` 块也会执行。\n\n`try` 块中的代码与其他任何代码一样。如果存在\
  \ `finally` 块，执行将从 `try` 之后的语句继续。如果不存在 `finally` 块，执行将从 `catch` 之后的语句继续。\n\n如果在执行\
  \ `try` 块期间发生了某些运行时错误，JVM 会抛出一个异常。这意味着创建了一个 `Exception` 类型的对象。然后它将按顺序与 `catch` 块进行比较。如果找到匹配的\
  \ `catch` 块，异常将得到处理。如果不匹配任何 `catch` 块，它将向上层次结构移动，直到被处理或被未处理地传递给 JVM，后者将直接终止程序并显示异常详情。\n\
  \n#### 使用 try 和 catch\n虽然 Java 运行时系统提供的默认异常处理器对于调试很有用，但你通常想自己处理异常。这样做有两个益处：第一，它允许你处理错误；第二，它防止程序自动终止。如果你的程序每次发生错误时都停止运行并打印堆栈轨迹，大多数用户（至少来说）会感到困惑！幸运的是，防止这种情况非常简单。\n\
  \n为了防止并处理运行时错误，只需将你想监控的代码包含在 `try` 块中。紧接 `try` 块之后，包含一个 `catch` 子句，指定你想要捕获的异常类型。\n\
  \n为了说明如何轻松地做到这一点，以下程序包含一个 `try` 块和一个 `catch` 子句，用于处理由除零错误生成的 `ArithmeticException`：\n\
  \n```java\nclass Exc2 {\n  public static void main(String args[])\n  {\n    int\
  \ d, a;\n    try {  // 监控一段代码。\n      d = 0;\n      a = 42 / d;\n      System.out.println(\"\
  This will not be printed.\");\n    }\n    catch (ArithmeticException e)\n    {\n\
  \    // 捕获除零错误\n      System.out.println(\"Division by zero.\");\n    }\n    System.out.println(\"\
  After catch statement.\");\n  }\n}\n```\n\n该程序产生以下输出：\n\nDivision by zero.\nAfter\
  \ catch statement.\n\n注意 `try` 块内部的 `println()` 调用从未被执行。一旦抛出异常，程序控制就会从 `try` 块转移到\
  \ `catch` 块。\n\n\n\n\n换句话说，`catch` 并不是被“调用”的，因此执行永远不会从 `catch` “返回”到 `try` 块。\n\n\
  因此，“这不会打印。”这一行不会显示。一旦 `catch` 语句执行完毕，程序控制将继续执行整个 `try/catch` 机制之后的下一行代码。\n\n`try`\
  \ 及其 `catch` 语句形成一个单元。`catch` 子句的作用范围限于紧接其之前的 `try` 语句指定的语句。\n\n`catch` 语句无法捕获由另一个\
  \ `try` 语句抛出的异常（稍后描述的嵌套 `try` 语句除外）。受 `try`保护的语句必须用大括号括起来（也就是说它们必须在一个块内）。你不能对单个语句使用\
  \ `try`。\n\n大多数结构良好的 `catch` 子句的目标应该是解决异常情况，然后像错误从未发生过一样继续运行。例如，在接下来的程序中，`for` 循环的每次迭代都会获取两个随机整数。\n\
  \n这两个整数相互相除，结果用于除以值 `12345`。最终结果被放入 `a` 中。如果任何一个除法操作导致 `divide-by-zero` 错误，它会被捕获，`a`\
  \ 的值设置为零，程序继续运行。\n\n```java\n// Handle an exception and move on.\n\nimport java.util.Random;\n\
  \nclass HandleError {\n    public static void main(String args[]) {\n        int\
  \ a=0, b=0, c=0;\n        Random r = new Random();\n        for(int i=0; i<32000;\
  \ i++) {\n            try {\n                b = r.nextInt();\n                c\
  \ = r.nextInt();\n                a = 12345 / (b/c);\n            } catch (ArithmeticException\
  \ e) {\n                System.out.println(\"Division by zero.\");\n           \
  \     a = 0; // set a to zero and continue\n            }\n            System.out.println(\"\
  a: \" + a);\n        }\n    }\n}\n```\n\n### 显示异常描述\n\n`Throwable` 重写了 `toString()`\
  \ 方法（由 `Object` 定义），使其返回一个包含异常描述的字符串。你可以通过简单将异常作为参数传递给 `println()` 语句来显示此描述。例如，上述程序中的\
  \ `catch` 块可以重写为：\n\n```java\ncatch (ArithmeticException e)\n{\n    System.out.println(\"\
  Exception: \" + e);\n    a = 0; // set a to zero and continue\n}\n```\n\n当用此版本替换程序并运行时，，每个\
  \ `divide-by-zero` 错误都会显示以下消息：\n\n`Exception: java.lang.ArithmeticException: / by\
  \ zero`\n\n虽然这在这个语境下没有特殊价值，但显示异常描述的能力在其他情况下非常有价值——特别是当你正在测试异常或进行调试时。\n\n| 异常类型 |\
  \ 异常产生原因 |\n| :--- | :--- |\n| ArithmeticException | 算术错误，例如 - 除以 0 |\n| ArrayIndexOutOfBoundsException\
  \ | 数组索引越界 |\n| ArrayStoreException | 在数组中存储了错误类型的数据 |\n| FileNotFoundException\
  \ | 访问不存在的文件 |\n| IOException | 无法从文件读取 |\n| NullPointerException | 由引用空对象引起 |\n\
  | NumberFormatException | 字符串与数字之间的转换失败 |\n| OutOfMemoryException | 没有足够的内存分配新对象\
  \ |\n| SecurityException | Applet 尝试执行浏览器安全设置未允许的操作 |\n| StackOverflowException\
  \ | 系统栈空间不足 |\n| StringIndexOutOfBoundsException | 程序尝试访问字符串中不存在的字符位置 |\n\n### Java\
  \ 内置异常\n\n在标准包 `java.lang` 内部，Java 定义了几个异常类。上述示例已经使用了其中几个。这些异常中最通用的是标准类型 `RuntimeException`\
  \ 的子类。\n\n如之前解释的那样，这些异常不需要包含在方法的 `throws` 列表中。在 Java 语言中，这些被称为“未检查异常”，因为编译器不会检查方法是否处理或抛出了这些异常。表\
  \ 12 中定义的异常被称为“已检查异常”。\n\n### 多个 catch 子句\n\n在某些情况下，单段代码可能会抛出多个异常。为了处理这种类型，你可以指定多个\
  \ `catch` 子句，每个子句匹配不同的异常类型。当抛出异常时，会按顺序检查每个 `catch` 语句，并执行第一个与异常类型匹配的语句。在一个 `catch`\
  \ 语句执行后，其他的将直接跳过。\n\n```java\n// Demonstrate multiple catch statements\nclass MultipleCatches\
  \ {\n    public static void main(String args[]) {\n        try {\n            int\
  \ a = args.length;\n            System.out.println(\"a = \" + a);\n            int\
  \ b = 42 / a;\n            int c[] = { 1 };\n            c[42] = 99;\n        }\
  \ catch (ArithmeticException e) {\n            System.out.println(\"Divide by 0:\
  \ \" + e);\n        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"\
  Array index oob: \" + e);\n        }\n        System.out.println(\"After/catch blocks.\"\
  );\n    }\n}\n```\n\n如果在不带命令行参数的情况下启动此程序，它将导致除以零异常，因为 `a` 将等于零。如果你提供了命令行参数，将 `a`\
  \ 设置为大于零的数，它将从除法操作中存活。但它会导致 `ArrayIndexOutOfBoundsException`，因为数组 `c` 的长度为 1，而程序却尝试给\
  \ `c[42]` 赋值。\n\n以下是两种运行方式生成的输出：\n\n`C:\\java MultipleCatches`\na = 0\nDivide by\
  \ 0: java.lang.ArithmeticException: / by zero\nAfter/catch blocks.\n\n`C:\\java\
  \ MultipleCatches TestArg`\na = 1\nArray index oob: java.lang.ArrayIndexOutOfBoundsException:42\
  \ After/catch blocks.\n\n### 子类顺序\n\n当你使用多个 `catch` 语句时，重要的是要记住异常子类必须在它们的任何父类之前。这是因为使用父类的\
  \ `catch` 语句会捕获该类型的异常以及其任何子类的异常。因此，如果子类出现在父类之后，则永远无法被访问。此外，在 Java 中，不可达代码是一个错误。例如，考虑以下程序：\n\
  \n```java\n/* 此程序包含一个错误。\n在系列 catch 语句中，子类必须在其父类之前。\n如果不是，\n将创建不可达代码并导致编译时错误。\n\
  */\nclass SuperSubCatch {\n    public static void main(String args[]) {\n      \
  \  try {\n            int a = 0;\n            int b = 42 / a;\n        } catch(Exception\
  \ e) {\n            System.out.println(\"Generic Exception catch.\");\n        }\n\
  \        /* 此 catch 永远不会到达，因为\nArithmeticException 是 Exception 的子类。 */\n       \
  \ catch(ArithmeticException e) { // ERROR – unreachable\n            System.out.println(\"\
  This is never reached.\");\n        }\n    }\n}\n```\n\n\n\n\n如果你尝试编译此程序，你将收到一条错误信息，说明第二个\
  \ `catch` 语句是不可达的，因为异常已经被捕获。由于 `ArithmeticException` 是 `Exception` 的子类，第一个 `catch`\
  \ 语句将处理所有基于 `Exception` 的错误，包括 `ArithmeticException`。\n\n这意味着第二个 `catch` 语句将永远不会执行。要解决这个问题，请反转\
  \ `catch` 语句的顺序。\n\n## 嵌套的 try 语句\n\n`try` 语句是可以嵌套的。也就是说，一个 `try` 语句可以放在另一个 `try`\
  \ 块内部。每当进入一个 `try` 语句时，该异常的上下文就会推入栈中。\n\n如果内部的 `try` 语句没有针对特定异常的 `catch` 处理器，栈将回溯，并检查下一个\
  \ `try` 语句的 `catch` 处理器是否有匹配项。\n\n这种过程会一直持续，直到其中一个 `catch` 语句执行成功，或者所有的嵌套的 `try`\
  \ 语句执行完毕。如果没有 `catch` 语句匹配，Java 运行时系统将处理该异常。\n\n这里是一个使用嵌套 `try` 语句的示例：\n\n## 多重\
  \ catch 语句\n\n当存在多个 `catch` 语句时，被称为多重 `catch` 语句。\n\n### 多重 catch 语句示例\n\n```\n\
  try\n{\n    statement;  //产生一个异常\n}\ncatch(Exception-type-1 e)\n{\n    statement\
  \ 1;  //处理异常类型 1\n}\ncatch(Exception-type-2 e)\n{\n    statement 2;  //处理异常类型 2\n\
  }\n// ...\ncatch(Exception-type-n e)\n{\n    statement n;  //处理异常类型 n\n}\n```\n\n\
  ### 示例 11.4\n\n```java\nclass ErrorTest4\n{\n    public static void main(String\
  \ args[])\n    {\n        int a=10,b=2,c=2,d;\n        System.out.println(\"Before\
  \ Exception \");\n        d=a/(b-c);\n        System.out.println(\"After Exception\
  \ \");\n    }\n}\n```\n输出：\n![image](img/image043.png)\n\n在这里我们没有捕获异常，因此程序将在显示消息“Before\
  \ Exception”后终止。现在我们已经使用异常处理解决了这个问题。\n\n### 示例 11.5\n\n```java\nclass ErrorTest5\n\
  {\n    public static void main(String[] args)\n    {\n      int a=10,b=2,c=2,d;\n\
  \      try\n      {\n        System.out.println(\"Before Exception\");\n       \
  \ d=a/(b-c);\n        System.out.println(\"This Will Not Print\");\n      }\n  \
  \    catch(ArithmeticException e)\n      {\n      System.out.println(\"After Exception\"\
  );\n      System.out.println(\"error : Division by zero\");\n      }\n    }\n}\n\
  ```\n输出：\n![image](img/image049.png)\n\n## 异常处理的优势\n\n- 我们可以很容易地确定异常/错误将被处理的位置。异常/错误在运行时沿调用栈向上传播——首先到达包含它的\
  \ `try` 块，然后返回到调用方法——直到异常处理器 `catch` 捕获它们。\n- 异常/错误的位置是确定的，因为整个堆栈轨迹对用户可见。这对于调试非常有帮助。\n\
  - 程序员获得了从错误/异常状态中恢复的机会。\n- 错误处理代码与正常程序流分离，以提高可读性和可维护性。\n- 在 Java 中，不需要测试是否发生了异常/错误情况。添加更多的错误/异常处理器只需添加更多的\
  \ `catch` 子句，而无需触动原始程序流。\n\n## 异常类的层次结构\n\n所有 `Exception / Error` 类的根类是 `throwable`\
  \ 类，它是 `object` 类的直接子类。异常/错误在 Java 中也是对象。`Exception` 的子类都带有 `Exception` 后缀。\n\n\
  `throwable` 类有两个直接的子类：\n\n- `Error`：`Error` 类的子类基本上用于信号异常的状况，例如：\n    1. `OutOfMemoryError`\
  \ 信号 Java 虚拟机内存已耗尽，垃圾回收器无法回收任何内存。\n    2. `StackOverflowError` 信号解释器中发生栈溢出。\n  这些错误通常是不可恢复的，不应该被处理。\n\
  - `Exception`：`Exception` 类的子类通常是可恢复的。例如，`EOFException` 信号我们打开的文件没有更多数据可读。`FileNotFoundException`\
  \ 信号我们想要打开的文件不存在于系统中。\n\n错误的示例：\n![image](img/image01.png)\n\n## 异常分为两种类型\n\n###\
  \ 检查异常 (Checked Exception)\n如果必须 `catch` 异常，则它被称为检查异常。如果 `try` 块中可能发生检查异常且未被处理，程序将无法编译。编译器确保如果一个方法直接或间接地抛出检查异常，则该方法必须显式处理它。该方法要么\
  \ `catch` 异常并采取适当行动，要么将异常传递给其调用者。注意：`Exception` 及其所有子类（运行时异常除外）都是检查异常且必须被捕获。\n\n\
  ### 未检查异常 (Unchecked Exception)\n如果不必须捕获异常，则它被称为未检查异常。即使未处理未检查异常，程序也可以编译。如果程序中发生了未处理的未检查异常，程序执行将在该点终止。但如果经过了处理，程序就不会因为异常而终止。注意：`Error`\
  \ 及其所有子类都是未检查异常，不需要捕获。用户定义的 `Exception` 是检查异常。\n\n### Exception 类中的方法\n\n| 方法 |\
  \ 说明 |\n| :--- | :--- |\n| `getMessage()` | 获取与异常或错误相关的消息。 |\n| `printStackTrace()`\
  \ | 打印显示异常/错误发生位置的堆栈轨迹。 |\n| `toString()` | 显示异常名称以及 `getMessage()` 返回的消息。 |\n\n\
  ### 示例 11.6\n\n```java\nclass ErrorTest6\n{\n    public static void main(String[]\
  \ arr)\n    {\n      try\n      {\n        int a=10,b=2,c=2,d;\n        System.out.println(\"\
  Before Exception\");\n        d=a/(b-c);\n        System.out.println(\"This Will\
  \ Not Print\");\n      }\n      catch(ArithmeticException e)\n      {\n        System.out.println(\"\
  After Exception\");\n        System.out.println(\"error : Division by zero\");\n\
  \        System.out.println(e.getMessage());\n        System.out.println(e);  //调用了\
  \ toString()\n        e.printStackTrace();\n      }\n    }\n}\n```\n输出：\nBefore\
  \ Exception\nAfter Exception\nerror : Division by zero\nby Zero\njava.lang.ArithmeticException:\
  \ / by zero\njava.lang.ArithmeticException: / by zero\nat ErrorTest6.main(ErrorTest6.java:10)\n\
  \n### 示例 11.7 多重 catch\n\n```java\nclass ErrorTest7\n{\n    public static void main(String\
  \ args[])\n    {\n      try\n      {\n        int a=args.length;\n        System.out.println(\"\
  Before Exception\");\n        int b=58/a;\n        int c[] = {1};\n        c[47]=100;\n\
  \        System.out.println(\"After Exception\");\n      }\n      catch(ArithmeticException\
  \ e)\n      {\n        System.out.println(\"Divide by zero :\"+e);\n      }\n  \
  \    catch(ArrayIndexOutOfBoundsException e)\n      {\n        System.out.println(\"\
  Array Index oob :\"+e);\n      }\n      System.out.println(\"After try/catch block\"\
  );\n    }\n}\n```\n输出 1：当我们作为“java ErrorTest7”运行上述程序时：\nBefore Exception\nDivide\
  \ by zero : java.lang.ArithmeticException: / by zero\nAfter try/catch block\n\n\
  输出 2：当我们作为“java ErrorTest7 45”运行上述程序时：\nBefore Exception\nArray Index oob: java.lang.ArrayIndexOutOfBoundsException:\
  \ 47\nAfter try/catch block\n\n\n\n\n\n如果我们在另一个 `try` 块中使用 `try` 和 `catch` 语句，则被称为嵌套\
  \ try-catch。\n\n### 语法\n\n```java\ntry      //外部 try\n{\n    try      //内部 try\n\
  \    {\n        statement ;\n    }\n    catch1()    //内部 catch\n    {\n        statement\
  \ ;\n    }\n    catch2()    //内部 catch\n    {\n        statement ;\n    }\n}\ncatch()\
  \    //外部 catch\n{\n    statement ;\n}\n```\n\n### 示例 11.8 嵌套的 try 和 catch\n\n```java\n\
  class Nested\n{\n    public static void main(String args[])\n    {\n        try\n\
  \        {\n            int a=args.length;\n            int b=58/a;\n          \
  \  System.out.println(\"a= \"+a);\n            try\n            {\n            \
  \    if(a==1)\n                    a=a/(a-a);\n                if(a==2)\n      \
  \          {\n                    int c[]={1};\n                    c[42]=100;\n\
  \                }\n            }\n            catch(ArrayIndexOutOfBoundsException\
  \ e)\n            {\n                System.out.println(\"ArrayIndex oob \"+e);\n\
  \            }\n        }\n        catch(ArithmeticException e)\n        {\n   \
  \         System.out.println(e.getMessage());\n        }\n    }\n}\n```\n\n**输出\
  \ I:**\n当我们以“java ErrorTest8”运行上述程序时（除以零错误）\n\n**输出 II:**\n当我们以“java ErrorTest8\
  \ 10”运行上述程序时\na=1 / by zero\n\n**输出 III:**\n当我们以“java ErrorTest8 10 20”运行上述程序时 a=2\n\
  ArrayIndex oob java.lang.ArrayIndexOutOfBoundsException: 42\n\n### finally 语句\n\n\
  Java 支持另一种名为 `finally` 的语句，它可以用于处理未被之前的任何一个 `catch` 语句捕获的异常。`finally` 块可以用于处理 `try`\
  \ 块中生成的任何异常。无论是否发生错误，它都会被执行。它可以紧跟在 `try` 块之后，也可以跟在最后一个 `catch` 块之后，如下所示：\n\n**语法：**\n\
  \n```java\ntry\n{\n    ...\n}\ncatch(...)\n{\n    ...\n}\ncatch(...)\n{\n    ...\n\
  }\nfinally\n{\n    ...\n}\n```\n\n### 示例 11.9 finally 语句\n\n```java\nclass ErrorTest9\n\
  {\n    public static void main(String args[])\n    {\n        int a[ ] = {5,10};\n\
  \        int b=5;\n        try\n        {\n            int x=a[2]/b-a[1];\n    \
  \    }\n        catch(ArithmeticException e)\n        {\n            System.out.println(\"\
  Division By Zero\");\n        }\n        catch(ArrayIndexOutOfBoundsException e)\n\
  \        {\n            System.out.println(\"Array Index error\");\n        }\n\
  \        catch(ArrayStoreException e)\n        {\n            System.out.println(\"\
  Wrong Data Type\");\n        }\n        finally    //始终执行\n        {\n         \
  \   System.out.println(\"Always Execute\");\n        }\n        int y=a[1]/a[0];\n\
  \        System.out.println(\"y = \"+y);\n    }\n}\n```\n\n**输出:**\nArray Index\
  \ error\nAlways Execute\ny = 2\n\n### throw\n\n到目前，我们只捕获由 Java 运行时系统抛出的异常。然而，我们的程序完全可以使用\
  \ `throw` 语句显式地抛出异常，`throw` 的通用形式所示：\n\n```java\nthrow Throwableinstance;\n```\n\
  \n在这里，`Throwableinstance` 必须是 `Throwable` 类型的对象或 `Throwable` 的子类。简单类型（如 `int` 或\
  \ `char`）以及如 `String` 和 `Object` 等非 `Throwable` 类不能作为异常。我们有两种方法可以获取 `Throwable`\
  \ 对象：使用 `catch` 子句中的参数，或者使用 `new` 操作符创建一个。\n\n在执行 `throw` 语句后，执行流立即停止；任何后续语句都不会执行。程序将检查最近的嵌套\
  \ `try` 块，看它是否有与异常类型匹配的 `catch` 语句。如果找到了匹配项，控制将转移到该语句。如果没有，则检查下一个嵌套的 `try` 语句，依此类推。如果没有找到匹配的\
  \ catch，则由默认异常处理器打印堆栈跟踪信息。这里我们取了一个创建并抛出异常的程序。捕获异常的处理器将其重新抛出给外部处理器。\n\n**示例 1.10**\n\
  \n```java\nclass ErrorTest10\n{\n    int age;\n    void setAge(int a)\n    {\n \
  \       if(a>0)\n            age = a;\n        else\n        {\n            NullPointerException\
  \ e = new NullPointerException(\"Invalid Age\");\n            throw e;\n       \
  \     //throw NullPointerException(\"Invalid Age\");\n        }\n    }\n    public\
  \ static void main(String args[])\n    {\n        ErrorTest10 a1 = new ErrorTest10();\n\
  \        try\n        {\n            a1.setAge(20);\n            a1.setAge(-10);\n\
  \        }\n        catch(NullPointerException e)\n        {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n**输出:**\nInvalid Age\n\n### throws\n\n如果一个方法能够导致它未处理的异常，它就必须指定这种行为，以便调用者知晓。我们通过在方法声明中包含\
  \ `throws` 子句来实现这一点。`throws` 列出方法可能抛出的异常类型。对于受检异常，如果不这样做将会导致编译错误。这是包含 `throws` 的方法通用形式：\n\
  \n```java\ntype method-name(parameter list) throws exception-list\n{\n    //方法体\n\
  }\n```\n\n**示例 1.11**\n\n```java\nimport java.io.*;\nclass ErrorTest11\n{\n    int\
  \ age;\n    void setAge(int a) throws IOException\n    {\n        if(a>0)\n    \
  \        age = a;\n        else\n        {\n            IOException e = new IOException(\"\
  Invalid Age\");\n            throw e;\n        }\n    }\n    public static void\
  \ main(String args[])\n    {\n        ErrorTest11 a1 = new ErrorTest11();\n    \
  \    try\n        {\n            a1.setAge(20);\n            a1.setAge(-10);\n \
  \       }\n        catch(IOException e)\n        {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n**输出:**\nInvalid Age\n\n### 定义异常/Error 子类\n\n自定义异常/Error\
  \ 子类-这非常容易做到，只需定义 `Exception/Error` 类的子类。我们的子类不需要实现任何内容。`Exception/Error` 类没有定义任何方法。它当然继承了\
  \ `Throwable` 类提供的方法。\n\n尽管 Java 的内置异常处理了大多数常见情况，但你可能想要创建自己的异常类型来处理特定于应用程序的情况。这非常简单：只需定义\
  \ `Exception` 的子类（它无疑是 `Throwable` 的子类）。\n\n**示例 11.12**\n\n```java\nclass AgeException\
  \ extends Exception\n{\n```\n\n\n\n\n\n```java\nclass AgeException(String msg) {\n\
  \    super(msg);\n}\n\nclass ErrorTest12 {\n    int age;\n    void setAge(int a)\
  \ throws InvalidAgeException {\n        if (a > 0)\n            age = a;\n     \
  \   else {\n            AgeException e = new AgeException(\"Invalid Age\");\n  \
  \          throw e;\n        }\n    }\n    public static void main(String args[])\
  \ {\n        ErrorTest12 a1 = new ErrorTest12();\n        try {\n            a1.setAge(20);\n\
  \            a1.setAge(-10);\n        } catch (AgeException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n\n输出:\n`Invalid Age`\n\n以下示例声明了一个 `Exception` 的新子类，并使用该子类在方法中信号错误条件。它重写了\
  \ `toString()` 方法，允许显示经过精心定制的异常描述。\n\n![sss](img/image090.jpg)\n\n此示例定义了一个名为 `MyException`\
  \ 的 `Exception` 子类。该子类非常简单：它只有一个构造函数加上一个重写的 `toString()` 方法，该方法用于显示异常的值。\n\n`ExceptionDemo`\
  \ 类定义了一个名为 `compute()` 的方法，该方法抛出一个 `MyException` 对象。当 `compute()` 的整数参数大于 10 时，会抛出异常。`main()`\
  \ 方法为 `MyException` 设置了异常处理程序，然后用合法值（小于 10）和非法值调用 `compute()`，以展示代码的两种路径。\n\n结果如下：\n\
  ```\nCalled compute(1)\nNormal exit\nCalled compute(20)\nCaught MyException[20]\n\
  ```\n\n### 异常链\n\n异常链功能允许我们将一个异常与另一个异常关联起来。第二个第二个异常描述了第一个异常的原因。例如，想象一种情况：方法由于尝试除以零而抛出\
  \ `ArithmeticException`。然而，问题的实际原因是发生了 I/O 错误，导致除数被设置不当。\n\n尽管该方法必须抛出 `ArithmeticException`（因为这是实际发生的错误），我们可能也想让调用代码知道底层原因是\
  \ I/O 错误。\n\n为了支持异常链，Java 2 的 1.4 版本为 `Throwable` 类增加了两个构造函数和两个方法。构造函数所示：\n\n```\n\
  Throwable(Throwable causeExc)\nThrowable(String msg, Throwable causeExc)\n```\n\n\
  在第一种形式中，`causeExc` 是发生的异常。第二种形式允许我们在指定原因异常的同时指定描述。这两个构造函数也被添加到了 `Error`、`Exception`\
  \ 和 `RuntimeException` 类中。\n\n添加到 `Throwable` 类的异常链方法是 `getCause()` 和 `initCause()`：\n\
  \n```\nThrowable getCause()\nThrowable initCause(Throwable causeExc)\n```\n\n`getCause()`\
  \ 方法返回当前异常的异常。如果没有底层异常，则返回 `null`。`initCause()` 方法将 `causeExc` 与调用的异常关联并返回该异常的引用。因此，我们可以在异常创建后与其关联一个原因。然而，原因异常只能设置一次。\n\
  \n因此，每个异常对象只能调用一次 `initCause()`。此外，如果原因异常是通过构造函数设置的，那么我们不能再次使用 `initCause()` 方法来设置它。通常情况下，`initCause()`\
  \ 用于为不支持上述两个额外构造函数的旧版异常类设置原因。Java 的大多数内置异常都没有定义这些额外的构造函数。因此，如果我们需要为这些异常添加异常链，将使用\
  \ `initCause()`。异常链并不是每个程序都需要的。但在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\n#### 示例 1\n\n```java\n\
  class ErrorTest {\n    int age;\n    void setAge(int a) {\n        if (a > 0)\n\
  \            age = a;\n        else {\n            NullPointerException e = new\
  \ NullPointerException(\"Admission Failed\");\n            e.initCause(new ArithmeticException(\"\
  Age is invalid\"));\n            throw e;\n        }\n    }\n    public static void\
  \ main(String args[]) {\n        ErrorTest a1 = new ErrorTest();\n        try {\n\
  \            a1.setAge(20);\n            a1.setAge(-10);\n        } catch (NullPointerException\
  \ e) {\n            System.out.println(e.getMessage());\n            System.out.println(e.getCause());\n\
  \        }\n    }\n}\n```\n\n输出:\n```\nAdmission Failed\nAge is Invalid\n```\n![sss](img/image34.jpg)\n\
  \n在这个示例中，顶层异常是 `NullPointerException`。它添加了一个原因异常 `ArithmeticException`。当异常从 `setAge()`\
  \ 抛出时，它被 `main()` 捕获。在那里，显示顶层异常，随后是可以通过调用 `getCause()` 获取的底层异常。异常链可以延伸到任何深度。因此，原因异常本身也可以有自己的原因。请注意，过长的异常链可能表明设计不当。异常链并不是每个程序都需要的。但在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\
  \n### 三个新的 JDK 7 异常特性（更新）\n\nJDK 7 为异常系统增加了三个有趣且实用的特性。第一个是在当资源不再需要时自动释放资源（如文件）。它基于\
  \ `try` 语句的扩展形式，称为 `try-with-resources`，将在介绍文件的章节介绍。\n\n第二个新特性是 `multi-catch`，第三个有时被称为\
  \ `final rethrow` 或更精确的重抛。这两个特性在这里描述。\n\n`multi-catch` 功能允许由同一个 `catch` 子句捕获两个或多个异常。多个异常处理器使用相同的代码序列并不罕见，尽管它们响应的是不同的异常。与其需要单独捕获每个异常类型，现在可以使用单个\
  \ `catch` 子句处理所有异常，避免代码重复。\n\n要使用 `multi-catch`，用或 运算符分隔 `catch` 子句中的每个异常类型。每个 `multi-catch`\
  \ 参数都隐含为 `final`。（如果需要，可以显式指定 `final`，但没有必要。）由于每个 `multi-catch` 参数隐含为 `final`，因此它不能被赋予新值。\n\
  \n这里有一个使用 `multi-catch` 特性捕获 `ArithmeticException` 和 `ArrayIndexOutOfBoundsException`\
  \ 的 `catch` 语句：\n\n```java\ncatch(ArithmeticException | ArrayIndexOutOfBoundsException\
  \ e)\n```\n\n以下程序演示了 `multi-catch` 特性的用法：\n\n```java\n// 展示 JDK 7 的 multi-catch\
  \ 特性\nclass MultiCatch {\n    public static void main(String args[]) {\n       \
  \ int a=10, b=0;\n        int vals[] = { 1, 2, 3 };\n        try {\n           \
  \ int result = a / b; // 产生 ArithmeticException\n            // vals[10] = 19; //\
  \ 产生 ArrayIndexOutOfBoundsException\n            // 此 catch 子句捕获这两个异常。\n       \
  \ } catch(ArithmeticException | ArrayIndexOutOfBoundsException e) {\n          \
  \  System.out.println(\"捕获到异常: \" + e);\n        }\n        System.out.println(\"\
  After multi-catch.\");\n    }\n}\n```\n\n尝试除以零时，程序将产生 `ArithmeticException`。如果你注释掉除法语句并移除下一行的注释符号，则会产生\
  \ `ArrayIndexOutOfBoundsException`。这两个异常都被同一个 `catch` 语句捕获。\n\n\n\n\n更精确的重抛功能限制了可以重新抛出的异常类型，仅限于关联的\
  \ `try` 块抛出的检查异常（checked exceptions），且未被之前的 `catch` 子句处理，并是参数的子类或超类的异常。\n\n尽管这种功能可能并不频繁需要，但现在已经可以使用。为了使更精确的重抛功能生效，`catch`\
  \ 参数必须是有效 final（effectively final），这意味着它在 `catch` 块内部不能被赋值新值，或者显式声明为 `final`。\n\n\
  ## 使用异常\n\n异常处理为控制具有许多动态运行特复杂程序提供了一种强大的机制。将 `try`、`throw` 和 `catch` 视为处理程序逻辑中错误和异常边界条件的整洁方式。与其他某些使用错误返回代码来指示失败的语言不同，Java\
  \ 使用异常。因此，当一个方法可能会失败时，让它抛出异常。\n\n这是一种处理失败模式更干净的方法。最后一点：Java 的异常处理语句不应被视为非局部分支的通用机制。如果你这样做，只会混乱你的代码并使其难以维护。\n\
  \n## 理论题\n\n1. 什么是异常？\n2. 我们如何定义 `try` 块？\n3. 我们如何定义 `catch` 块？\n4. 列出 Java 中可能发生的一些常见异常类型。给出示例。\n\
  5. 捕获所有类型的异常是必要的吗？\n6. 一个 `try` 块可以使用多少个 `catch` 块。\n7. 创建可能产生三种异常的 `try` 块，然后结合必要的\
  \ `catch` 块来适当捕获并处理它们。\n8. 什么是 `finally` 块？什么时候如何使用它？给出一个合适的示例。\n9. 解释异常处理机制如何用于调试程序。\n\
