  \    f.add(tf1);f.add(tf2);f.add(tf3);f.add(tf4);\n      f.add(ta1);f.add(ta2);f.add(ta3);f.add(ta4);\n\
  \      f.add(ta5);\n      tf1.setText(\"abc\");\n      System.out.println(tf3.getText());\n\
  \      tf3.setEditable(false);\n    }\n}\n```\n*(注：提供的源代码在示例方法中缺少 `tf1`, `ta1` 等变量声明，但已根据指令保留了逻辑结构)*\n\
  \n\n\n\n\n```java\n22. f.setSize(800, 400);\n23. f.setVisible(true);\n24. }\n25.\
  \ }\n```\n\nOutput:\n\n![image](img/image076.png)\n\n### FileDialog\n\n此类表示文件打开或文件保存对话框。文件对话框是一个模式对话框，这意味着只要对话框在屏幕上可见，来自对话框父帧的输入将专门定向到对话框。当用户指定文件或点击取消按钮时，对话框会自动关闭。最有用的\
  \ File 构造函数形式如下：\n\n`FileDialog(Frame parent, String title, int mode)`\n\n对话框的父帧是对话框出现的帧。`title`\
  \ 字符串出现在对话框的标题栏中。\n\n`mode` 应该是以下之一：\n\n*   `FileDialog.LOAD` 或\n*   `FileDialog.SAVE`\n\
  \n在用户指定文件后，可以使用以下方法获取文件名或目录：\n\n`String getDirectory()`\n获取此文件对话框的选定目录。\n\n`String\
  \ getFile()`\n获取此文件对话框的选定文件。\n\n#### Example 17.20\n\n```java\nimport java.awt.*;\n\
  public class FileDialogTest\n{ \n  public static void main(String args[])\n  { \n\
  \    Frame f=new Frame( );\n    f.setLayout(new FlowLayout( ));\n    f.setSize(200,\
  \ 200);\n    f.setVisible(true);\n    FileDialog fd=new FileDialog (f, “Load file”,\
  \ FileDialog.LOAD);\n    fd.setVisible(true);\n    System.out.println(fd.getFile());\n\
  \    System.out.println(fd.getDirectory());\n  }\n}\n```\n\n### ScrollPane\n\nScrollPane\
  \ 可以包含单个组件，该组件可能比滚动面板本身更高或更宽。如果容器组件大于滚动面板，滚动面板的默认行为是根据需要获取水平和/垂直滚动条。\n\n该类有两个构造函数：\n\
  \n`ScrollPane()`\n创建一个滚动条显示策略为“按需”的新的滚动面板容器。\n\n`ScrollPane(int scrollbarDisplayPolicy)`\n\
  创建一个具有指定滚动条行为的新滚动面板容器。滚动面板的显示策略应该是以下之一：\n\n*   `ScrollPane.SCROLLBARS_AS_NEEDED`\
  \ (默认)\n*   `ScrollPane.SCROLLBARS_ALWAYS`\n*   `ScrollPane.SCROLLBARS_NEVER`\n\n\
  下面的代码创建了一个具有默认（As_NEEDED）滚动条行为的滚动面板。该滚动面板包含一个非常大的按钮；因此肯定需要滚动条。\n\n#### Example 17.21\n\
  \n```java\nimport java.awt.*;\nclass SPaneTest\n{ \n  public static void main(String\
  \ args[])\n  { \n    Frame f=new Frame();\n    f.setLayout(new GridLayout(1,2));\n\
  \    f.setSize(250, 150);\n    ScrollPane spane=new ScrollPane();\n    spane.setBackground(Color.green);\n\
