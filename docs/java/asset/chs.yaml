  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n# ∞ 19 ∞\n\n# (在 AWT 中绘图)\n\n## 引言\n\
  \n许多类型的 AWT 组件（例如按钮和滚动条）其外观是由底层窗口系统决定的。其他组件类型，特别是小程序（applets）、窗口、面板和画布，没有内在的外观。我们将这些类中的任何类简单地作为容器使用，并希望我们的组件看起来有用，那么我们必须提供实现组件外观的代码。\n\
  \n每个组件都有一个与其关联的图形上下文（graphics context）。图形上下文对应于与组件相关的缓冲区。\n\n我们可以使用图形上下文支持的方法在组件上进行绘制。在图形上下文上绘制的任何内容都会显示在组件上。\n\
  \n在任何组件上绘图的正确方法是重写它的 `paint()` 方法并提供适当的代码。\n\n`paint()` 方法有一个类型为 `Graphics` 的参数，它代表组件的图形上下文。也可以不使用\
  \ `paint()` 方法在组件上进行绘图，尽管不推荐这种方法。\n\n### paint() 方法和图形上下文\n\n在以下示例中关于窗口的一个有趣点是，没有对\
  \ `paint()` 方法进行显式调用；只需提供该方法即可。环境似乎很好地在正确的时机调用了 `paint()`。\n\n在组件上绘图是通过调用图形上下文来实现的，图形上下文是\
  \ `Graphics` 类的一个实例。图形上下文知道如何渲染到单个目标上。图形上下文可以渲染到的三个媒介是：\n\n1. 组件。\n2. 图像。\n3. 打印机。\n\
  \n任何类型的组件都可以与图形上下文关联。这种关联是永久的；上下文不能重新分配给新组件。虽然我们可以使用图形上下文在任何类型的组件上绘图，但对于已经有外观的组件这样做是不寻的。\n\
  \n按钮、选择、复选框、标签、滚动条、文本字段和文本区域通常不需要程序员级别的渲染。大多数情况下，这些组件仅使用继承自组件父类的 `paint()` 版本。该版本什么都不做；组件是由底层窗口系统渲染的。然而，有四类“空白”组件它们没有外观，除非它们被子类化并赋予\
  \ `paint()` 方法，否则它们将显示为空矩形。这四个组件类是：\n\n* Applet（小程序）\n* Canvas（画布）\n* Frame（窗口）\n\
  * Panel（面板）\n\n### 示例 19.1 扩展 Frame 类并重写 paint() 方法以改变窗口的外观。\n\n```java\nimport\
  \ java.awt.*;\npublic class SimplePaint extends Frame {\n    public static void\
  \ main (String args[]) {\n        Frame f=new SimplePaint();\n        f.setSize(200,200);\n\
  \        f.setVisible(true);\n    }\n    public void paint (Graphics g) {\n    \
  \    g.setColor(Color.white);\n        g.fillRect(0,0,300,300);\n        g.clearRect(0,0,200,200);\n\
  \        g.setColor(Color.black);\n        g.fillRect(0,0,300,300);\n        g.setColor(Color.grey);\n\
  \        g.fillOval(30,30,50,50);\n    }\n}\n```\n\n输出：\n![image](img/image051.png)\n\
  \n### graphics 类支持的操作\n\ngraphics 类（图形上下文）提供的四大类操作分类是：\n\n* 选择颜色。\n* 选择字体。\n* 绘制和填充。\n\
  * 裁剪（Clipping）。\n\n#### 选择颜色\n\n通过调用 `setColor()` 方法选择颜色。所需的参数是 `color` 类的实例。有 13\
  \ 种预定义的颜色，可以通过 color 类的静态 变量访问（这些变量本身是 color 类的实例。这让某些人感到不安，但 Java 处理这种情况没有问题）。预定义的颜色是：\n\
  \n1. `Color.black`\n2. `Color.blue`\n3. `Color.cyan`\n4. `Color.darkGray`\n5. `Color.gray`\n\
  6. `Color.green`\n7. `Color.lightGray`\n8. `Color.magenta`\n9. `Color.orange`\n\
  10. `Color.pink`\n11. `Color.red`\n12. `Color.white`\n13. `Color.yellow`\n\n如果我们需要一个不在列表中的颜色，可以自己构造。有几个版本的颜色构造函数，最简单的是\
  \ `Color(int redLevel, int greenLevel, int blueLevel)`。这三个参数是 0 到 255 范围内的强度水平。\n\
  \n如果我们想要一个不在列表中的颜色，我们可以自己构造。有几个版本的颜色构造函数，最简单的是 `Color(int redLevel, int greenLevel,\
  \ int blueLevel)`。这三个参数是 0 到 255 范围内的强度水平。\n\n我们可以使用图形上下文在任何类型的组件上绘图，但对于已经有外观的组件这样做是不寻常的。\n\
