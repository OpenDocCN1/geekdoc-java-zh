  ![11](img/image026.jpg)\n![STAR-LOGO-2013](img/image024.png)\n\n# 第 2 章 (Java 语言)\n\
  \n––––––––\n\n## 标记 (Tokens)\n\n最小的独立单元被称为标记，例如关键字、标识符、常量、字符串和运算符。\n\nA. 关键字是语言的保留名称，不能用变量、函数等的名称。\n\
  B. 标识符指的是变量、数组、函数、类、接口等的名称。\nC. 常量/字面量是指程序中我们无法更改的固定值。\nD. 运算符是可以在变量和常量上操作的特殊符号，并构成表达式。\n\
  E. 分隔符是用于分隔语句的特殊字符，如 `( )` `{ }` `[ ]` `;` `,` `.`\n\n––––––––\n\n### A. 关键字\n\n\
  `abstract`, `continue`, `goto`, `package`, `synchronized`\n`assert`, `default`,\
  \ `if`, `private`, `this`\n`boolean`, `do`, `implements`, `protected`, `throw`\n\
  `break`, `double`, `import`, `public`, `throws`\n`byte`, `else`, `instanceof`, `return`,\
  \ `transient`\n`case`, `extends`, `int`, `short`, `try`\n`char`, `final`, `static`,\
  \ `void`\n`finally`, `long`, `volatile`, `class`\n`float`, `native-native`, `super`,\
  \ `while`\n`for`, `new`, `switch`\n\n注意 1：`enum` 是保留的。\n注意 2：`goto` 和 `const` 是保留的。\n\
  注意 3：`true` 和 `false` 是保留的。\n注意 4：`null` 是保留的。\n注意 5：增加了 `assert`。\n\n### B. 标识符\n\
  \n标识符指的是变量、数组、函数、类、接口等的名称。\n\n标识符规则：\n1. 标识符必须以字母、美元符号 (`$`) 或下划线 (`_`) 开头。\n2.\
  \ 它以数字开头。\n3. 标识符的长度没有限制。\n4. Java 允许 Unicode 字符。\n5. 标识符区分大小写。\n\n### C. 常量/字面量\n\
  \n常量/字面量是指程序中我们无法更改的固定值。\n\n字面量类型：\n- **整数**: `5`, `-5`, `0x5A` (十六进制), `012` (八进制),\
  \ `5l`, `5L` (long)。\n- **浮点数**: `5.23`, `-5.23`, `5.4f`, `5.4F`, `5.4d`, `5.4D`,\
  \ `1.2E-03` (科学计数法)。\n- **字符**: `'a'`, `'A'`, `'\\n'`, `'\\141'`, `'\\u0061'`。\n\
  - **字符串**: `\"matrix\"`。\n- **布尔值**: `true`, `false`。\n\n### D. 运算符\n\n运算符是可以在变量和常量上操作的特殊符号，并构成表达式。\n\
  \n- 算术运算符：`+`, `-`, `*`, `/`, `%`。这些与 C/C++ 中。\n- `%` 运算符也可以作用于浮点数。\n- 当二元运算符应用于两个不同类型的操作数时，低类型的操作数在评估之前会被转换为高类型，结果的类型将与高类型操作数的类型相同。\n\
  \n\n\n\n\n-   对于 `int` 类型，除以零或对零取模会导致 `ArithmeticException`（运行时错误），但浮点数类型则不会。\n\
  -   当我们对 `int` 应用算术运算符且结果超出了 `int` 的范围时，多出的高阶位将被截断，并将这个新值赋值给接收结果的变量；然而对于浮点类型中，溢出将导致结果为\
  \ `Infinity` 或 `–Infinity`，下溢将导致结果为 `0`。\n\n### 递增与递减运算符 (`++`, `--`)\n\n这些运算符与\
  \ C/C++ 中的相同。\n\n```java\nint a=5,b;\nb = ++a*++a;\nSystem.out.print(b);    //42\n\
  \na = 5; \nSystem.out.print(++a*++a);  //42\n```\n\n### 关系运算符 (`<`, `>`, `<=`, `>=`,\
  \ `instance-of`)\n\n这些运算符与 C/C++ 中的相同，但 `<` `<=`、`>` `>=` 不能应用于布尔类型和引用类型。\n\n###\
  \ `instanceof` 运算符 `-:`\n\n`instanceof` 运算符用于测试对象的类。`instanceof` 运算符的通用形式为：\n\n\
  ```java\nif(object instanceof type)\n```\n\n在这里，`object` 是一个类的实例，`type` 是一个类类型。如果\
  \ `object` 是指定类型的实例，或者是指定类型任何子类的实例，则 `instanceof` 运算符返回 `true`，否则结果为 `false`。\n\n\
  ### 赋值运算符 (`=`, `+=`, `-=`, `*=`, `/=`, `%=`)\n\n这些运算符与 C/C++ 中的相同。\n\n### 等于运算符\
  \ (`==`, `!=`)\n\n这些运算符与 C/C++ 中的相同。\n\n### 逻辑运算符 (`&&`, `||`, `!`)\n\n这些运算符与 C/C++\
  \ 中的相同。\n\n### 条件运算符 (`? :`)\n\n该运算符与 C/C++ 中的相同。\n\n### 位运算运算符 (`&`, `|`, `^`,\
  \ `~`, `<<`, `>>`, `>>>`)\n\n这些运算符与 C/C++ 中的相同，移位运算符除外。移位运算符仅适用于整数类型。\n\n#### 左移\
  \ (`<<`) 运算符\n\n要获得 `<<` 运算符的结果，左侧操作数中的位将根据右侧操作数向左移动，右侧的空位将用零填充。左移 `1` 位等于乘以 2。结果的符号可能与左侧操作数的符号不同。这可能是因为符号取决于最左边的位，而该位可能会从\
  \ 0 变为 1 或从 1 变为 0，从而导致符号变化。\n\n示例 `b = a << 2;`。要获得 `b` 的值，将 `a` 中的位向左移动 2 位，并用零填充右侧\
  \ 2 位。\n\n#### 右移 (`>>`) 运算符（有符号）\n\n要获得 `>>` 运算符的结果，左侧操作数中的位将根据右侧操作数向右移动，左侧的空位用符号位填充。右移\
  \ `1` 位等于除以 2。该运算符永远改变结果的符号，即它与左侧操作数的符号相同。\n\n示例 `b = a >> 2;`。要获得 `b` 的值，将 `a`\
  \ 中的位向右移动 2 位，并用符号填充右侧 2 位（如果 `a` 为正数则填充 `0`，如果 `a` 为负数则填充 `1`）。\n\n#### 零填充右移 (`>>>`)\
  \ 运算符（无符号）\n\n要获得 `>>>` 运算符的结果，左侧操作数中的位将根据右侧操作数向右移动，左侧的空位用 `0` 填充。右移 `1` 位等于除以 2。如果发生了移位，结果将始终为正，因为最右侧位将变为零。\n\
  \n示例 `b = a >>> 2;`。要获得 `b` 的值，将 `a` 中的位向右移动 2 位，并用 `0` 填充右侧 2 位。\n\n![black_star_logo](img/image070.jpg)\n\
  ![black_star_logo](img/image070.jpg)\n![black_star_logo](img/image070.jpg)\n\n---\n\
  \n### 运算符优先级:-:\n\n| 优先级 | 运算符 | 描述 | 结合性 |\n| :--- | :--- | :--- | :--- |\n| 1\
  \ | `( ) [ ] .` | 函数调用、下标、直接成员 | 从左到右 |\n| 2 | `++—~!` | 递增、递减、位取反、逻辑取反 | 从右到左 |\n\
  | 3 | `*/%` | 乘法、除法、取模 | 从左到右 |\n| 4 | `+-` | 加法、减法 | 从左到右 |\n| 5 | `>>><<` | 位右移、位左移、符号右移、零填充右移\
  \ | 从左到右 |\n| 6 | `>>=<<=instanceof` | 大于、大于等于、小于、小于等于 | 从左到右 |\n| 7 | `== !=` |\
  \ 等于、不等于 | 从左到右 |\n| 8 | `&` | 位与 | 从左到右 |\n| 9 | `^` | 位异异 | 从左到右 |\n| 10 | `\\\
  |` | 位或 | 从左到右 |\n| 11 | `&&` | 逻辑与 | 从左到右 |\n| 12 | `\\|` | 逻辑或 | 从左到右 |\n| 13\
  \ | `?:` | 条件运算符 | 从左到右 |\n| 14 | `=` | 赋值 | 从左到右 |\n\n### 分隔符:-\n\n| 符号 | 名称 |\
  \ 目的 |\n| :--- | :--- | :--- |\n| `( )` | 括号 | 参数、调用 |\n| `.` | 点 | 包名、类 |\n| ![black_star_logo](img/image070.jpg)\
  \ | | |\n| `,` | 逗号 | 连续语句 |\n| `{ }` | 大括号 | 块 |\n| `[ ]` | 方括号 | 声明数组 |\n| `;`\
  \ | 分号 | 终止语句 |\n| `|` | | 定义 |\n\n### 数据类型\n\nJava 数据类型大致可以分为两类：\n\n#### 1. 原始数据类型\
  \ / 简单类型\nJava 是面向对象的，但原始数据类型不是对象。出于性能考虑，它们构成了所有类型的基础。\n\n##### 整数类型\n- `byte`（1\
  \ 字节）：范围 `-128` 到 `127`\n- `short`（2 字节）：范围 `-32768` 到 `32767`\n- `int`（4 字节）：范围\
  \ `-2147483648` 到 `2147483647`\n- `long`（8 字节）：范围 `-9223372036854775808` 到 `9223372036854775807`\n\
  \n包含 `byte`, `short` 的表达式会自动提升为 `int`。\n\n##### 浮点数类型\n- `float`（4 字节）：范围 `1.401298464324817E-45f`\
  \ 到 `3.40282346638528E38f`\n- `double`（8 字节）：范围 `4.9E-324d` 到 `1.7976931348623157E308d`\n\
  \n##### 布尔类型\n`boolean`\n\n##### 字符类型\n`char`（2 字节）：范围 `0` 到 `65535`\n\n注意：Unicode\
  \ 集合的前 128 个字符与 7 位 ASCII 字符集相同，前 256 个字符对应于 8 位 ISO Latin-1 字符集。Java 字符也可以用于整数表达式。\n\
  \n#### 2. 非原始数据类型 / 派生类型或引用\n引用类型也被称为派生类型，因为它们源自原始数据类型。\n\n##### 类\n- 内置/库类\n- 用户定义类\n\
  \n##### 接口\n- 内置/库类\n- 用户定义类\n\n##### 数组\n数组也被视为对象。\n\n### 变量\n变量是存储值的内存位置的名称。在存储值之前，必须声明变量。\n\
  \n有三种变量：\n\n\n\n\n\n## 局部变量\n局部变量用于块或方法内部。局部变量（也称为自动变量）默认不会初始化。局部变量在第一次使用之前必须显式初始化，否则将出现编译时错误“Variable\
  \ might not have been initialized”（变量可能未初始化）。\n\n## 示例\n```java\nint a,b=5;\n\n\
  if(b>2)\n{\n    a = b;\n}\n\nSystem.out.print(a);\n```\n在上述程序中，如果 `if` 条件为假，则 `a`\
  \ 的值未定义定义，因此编译器将给出错误“Variable a might not have been initialized”（变量 a 可能未初始化）。\n\
  \n在 Java 中，我们不能在内部块中定义与外部块同名的变量。\n\n```java\nint a=5;\n{\n    int a=7;  // 错误\n\
  }\n```\n\n## 实例变量\n实例变量用于定义对象的属性或状态。\n\n## 类变量\n类变量用于定义属性/状态，该状态对于类的所有对象都是的。\n\n\
