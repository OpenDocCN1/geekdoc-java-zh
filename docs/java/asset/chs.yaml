  \  }\n}\n\nclass SuspendResume {\n    public static void main(String args[]) {\n\
  \        A ob1 = new A(\"One\");\n        A ob2 = new A(\"Two\");\n        try {\n\
  \            Thread.sleep(1000);\n            ob1.t.suspend();\n            System.out.println(\"\
  Suspending one\");\n            Thread.sleep(1000);\n            ob1.t.resume();\n\
  \            System.out.println(\"Resuming one\");\n            ob2.t.suspend();\n\
