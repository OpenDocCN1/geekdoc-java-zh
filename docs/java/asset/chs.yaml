  \n# (Java 概览)\n\n## 简介\n`Java` 是一种由 Sun 公司于 1991 年开发的强大面向对象编程语言。`Java` 最初是为了电子设备开发的，后来转向了互联网。现在\
  \ `Java` 已成为互联网广泛使用的编程语言。`Java` 是平台无关语言（可以在世界上任何硬件或操作系统上运行）。Sun 公司（Oracle）在 1995\
  \ 年 5 月的一次大型会议上正式宣布了 `Java`。通常，这样的活动不会引起这么多关注。然而，由于对万维网的极大兴趣，`Java` 立即引起了商业界的关注\n\
  \n### Java 的需求\n`Java` 的开发是因为需要一种平台无关的语言，用于创建嵌入各种消费电子设备（如微波炉和遥控器）的软件。用 `C` 和 `C++`\
  \ 编写的程序针对特定的硬件和软件编译，程序无法在任何其他硬件或软件上运行。因此，我们需要为每种类型的硬件创建一个 `C/C++` 编译器。但创建编译器既昂贵又耗时。因此我们需要平台无关的语言。这样从该编译器编译的程序可以在任何硬件上运行。这种需求导致了\
  \ `Java` 的诞生。\n\n### Java 类库\n`Java` 程序由称为类的部分组成。类由称为方法的部分组成，方法执行任务并在完成任务时返回信息。你可以编写所需的每个部分以形成一个\
  \ `Java` 程序。然而，大多数 `Java` 程序员都会利用 `Java` 类库中现有的类的丰富集合。类库也被称为 `Java` API（应用程序接口）。\n\
  \n\n\n\n\n在本书中，我们讨论了许多类库。类库主要由编译器供应商提供，但许多类库也由独立软件供应商（ISV）提供。此外，许多类库可以通过互联网和万维网作为免费软件或共享软件获取。你可以下载免费软件产品并供免费使用，但须遵守版权所有者指定的任何限制。\n\
  \n## 典型 Java 环境的基础\n\nJava 系统通常由几个部分组成：环境、语言、Java 应用程序接口（`API`）以及各种类库。以下讨论解释了一个典型的\
  \ Java 程序开发环境，Java 程序通常需要经过五个阶段才能执行。这些阶段是：编辑、编译、加载、验证和执行。后续描述使用了 Oracle 提供的标准 `Java\
  \ SE 7 开发工具包`（`JDK 7`）。\n\n如果你正在使用不同的 Java 开发环境，你可能需要遵循不同的程序来编译和执行 Java 程序。在这种情况下，请查阅你编译器的文档获取详细信息。\n\
  \n**注意：** 如果你没有使用 `UNIX/Linux`、`Windows 95/98/ME` 或 `Windows NT/2000`，请参考您系统 Java\
  \ 环境的手手册，或询问您的导师如何在您的环境中完成这些任务（该环境可能与上述相似）。\n\n### 阶段 1：包括编辑文件\n\n这是通过编辑器程序（通常称为编辑器）完成的。程序员使用编辑器输入\
  \ Java 程序，并在必要时进行修正。当程序员指定保存编辑器中的文件时，程序会被存储在次级存储设备上，如磁盘。Java 程序文件的文件名以 `.java` 扩展名结尾。\n\
  \n`UNIX/Linux` 系统上广泛使用的两个编辑器是 `vi` 和 `emacs`。在 `Windows 95/98/ME` 和 `Windows NT/2000`\
  \ 上，简单的编辑程序如 `DOS Edit` 命令和 `Windows 记事本` 就足够了。\n\nJava 集成开发环境（`IDEs`），如 `Forte\
  \ for Java Community Edition`、`NetBeans`、`Borland’s JBuilder`、`Symantec’s Visual\
  \ Cafe` 和 IBM 的 Visual Age 都内置了集成到编程环境中的编辑器。\n\n我们假设读者知道如何编辑文件。`Java` 等语言是面向对象的——在此类语言上的编程被称为面向对象编程（`OOP`），允许设计人员将面向对象的设计实现为运行的系统。另一方面，`C`\
  \ 等语言是过程化编程语言，因此编程倾向于动作导向型。\n\n在 `C` 中，编程单元是 `function`。在 `Java` 中，编程单元是 `class`，最终从类实例化对象（“创建”的华丽术语）。`Java`\
  \ 类包含 `methods`（实现类的行为）和 `attributes`（实现类的数据）。\n\n`C` 程序员专注于编写函数。执行某些共同任务的动作组被组成函数，而函数被分组成形成程序。数据在\
  \ `C` 中无疑是重要的，但观点是数据存在主要是为了支持函数所执行的动作。系统规范中的动词帮助 `C` 程序员确定实现该系统所需的函数集。\n\n`Java`\
  \ 程序员专注于创建他们自己的自定义类型，称为 `classes`（类）和 `components`（组件）。每个 `class` 包含数据以及操作这些数据的函数集。`Java\
  \ class` 的数据组件被称为 `attributes`。\n\n`Java class` 的函数组件被称为 `methods`。正如内置类型（如 `int`）的实例被称为\
  \ `variable` 一样，自定义类型（即 `class`）的实例被称为 `object`。程序员使用内置类型作为构建自定义类型的“构建块”。\n\n`Java`\
  \ 的重点在于 `classes`（我们从中创建对象）而不是函数。系统规范中的名词帮助 `Java` 程序员确定用于创建对象的 `classes` own，这些对象将协作工作实现系统。\n\
  \n`Classes` 之于 `objects` 就像蓝图之于房屋。我们可以从一张蓝图建造许多房屋，也可以从一个 `class` 实例化许多对象。`Classes`\
  \ 也可以与其他 `classes` 建立关系。\n\n例如，在银行的面向对象设计中，“银行柜员” `class` 需要与“客户” `class` 相关。这些关系被称为\
  \ `associations`。我们将看到，当软件被封装为 `classes` 时，这些类可以在未来的软件系统中被重用。相关的 `classes` 组通常被封装为可重用的\
  \ `components`。\n\n你创建的每个新 `class` 都具有成为价值软件资产的潜力，你和其他程序员可以使用它加速并提高未来软件开发工作的质量——这是一个令人兴奋的可能性。\n\
  \n## Java 与 C、C++ 和 C# 的关系\n\n`Java` 从 `C` 派生出语法，从 `C++` 派生出面向对象的特性。它不是 `C++` 的增强版本。`Java`\
  \ 既不向上也不向下兼容 `C++`。我想告诉你们的一点重要信息是，`Java` 语言的设计并不是为了取代 `C++` 和 `C#`。微软开发的另一种用于支持\
  \ `.NET Framework` 的语言 `C#` 与 `Java` 密切相关，因为它们共享 `C++` 和 `C` 风格的语法，支持分布式编程，并使用相同的对象模型。\n\
  \n## Java 的主要目标是实现 -\n\n### 1. 安全性：\n\n在使用兼容 Java 的浏览器时，没有病毒感染的威胁。此外也没有恶意程序从本地机器收集隐私信息（如信用卡号、银行余额和密码）的威胁。`Java`\
  \ 在网络应用程序和我们的计算机之间提供了防火墙。\n\n### 2. 可移植性：\n\n`Java` 程序可以在运行不同操作系统和不同硬件的计算机之间迁移。\n\
  \n## Java 字节码\n\nJava 编译器的输出是 `bytecode` 而不是机器码（`.class` 文件）。`bytecode` 是一种高度优化的指令集，旨在由\
  \ Java 运行时系统执行，该系统被称为 `JVM`（Java 虚拟机）。\n\n`JVM` 是解释 `bytecode` 的解释器。编译后的程序运行更快，但\
  \ Java 仍然使用解释器来实现可移植性，因此 Java 程序慢一点。现在通过 Java 编译程序可以在任何环境中运行，但每个平台都需要实现 `JVM`。Java\
  \ 程序是被解释的。这也有助于安全性，因为每个 Java 程序的执行都在 `JVM` 控制之下。\n\n### JIT（即时编译）：\n\n`JIT` 是 `JVM`\
  \ 用于将 `bytecode` 翻译成实际机器码的翻译器。它不是翻译整个 `bytecodes`，而是按需翻译。\n\n## Java 各版本\n\n- `Java\
  \ 1`：`JDK 1.0`、`JDK 1.1`\n- `Java 2`：`JDK 1.2`、`JDK 1.3`、`JDK 1.4`、`JDK 1.5` 或 `JDK\
  \ 5`、`JDK 1.6` 或 `JDK 6`\n- `Java 1.7` 或 `SE 7`\n- `Java SE 8`（`Java 8`，2014 年 4\
  \ 月）\n\n**注意 1：** `JDK`（Java 开发工具包）\n**注意 2：** 旧 Java 版本的许多功能被新版本弃用，但我们仍然可以使用它们。\n\
  \n## Java 可以开发的应用程序类型\n\n1. **独立应用程序（Standalone Applications）：** 独立应用程序是运行在我们本地计算机上、在该操作系统下的程序，就像\
  \ C 或 `C++` 程序一样。\n2. **小程序（Applets）：** `applet` 是一种跨互联网传输并在客户端机器上由兼容 Java 的浏览器（如\
  \ `Internet Explorer` 或 `Netscape Navigator`）执行的小程序。\n\n`applet` 不能像独立应用程序那样执行。`applet`\
  \ 只能通过嵌入 HTML 页面来执行，就像音频文件、图像文件或视频片段一样。\n\n\n\n\n现在，这个嵌入了小程序的 HTML 页面可以在本地机器通过网络浏览器下载该\
  \ HTML 页面后运行。小程序是可以对用户输入做出响应并进行动态变化的程序。它不会重复地播放相同的动画或声音。\n\n### 1. Web 应用程序\n这些是运行在\
  \ Web 服务器上的程序。当我们通过在浏览器浏览器指定 URL（通用资源定位符）访问网站时，网络浏览器会向 Web 服务器发送针对特定网站的请求。接收到请求后，服务器会运行一个程序，该程序被称为\
  \ Web 应用程序。我们使用 `Java Servlets` 和 `JSP`（Java 服务器页）来编写此类程序。\n\n这些程序运行在服务器上，并将结果/响应发送给客户端。`JSP`\
  \ 页面可以看作 HTML 和 Java 代码的结合。Web 服务器在执行之前会将 `JSP` 页面转换为 `Java Servlets`。\n\n当客户端请求特定的\
  \ URL 且该 URL 对应于 HTML 页面时，Web 服务器直接将 HTML 页面返回给客户端，由客户端进行显示。如果 URL 对应 servlet 或\
  \ `JSP`，则在服务器上执行并将结果/响应返回给客户端，最后由客户端显示。\n\n### 2. 分布式应用程序\nJava 应用程序被分为可以在独立机器上运行的小型程序。这些程序中使用的对象可以相互通信。这些应用程序被称为分布式应用程序。这允许两台不同计算机上的对象远程执行过程。为此，使用了\
  \ `RMI`（远程方法调用）。\n\n---\n\n## Java 的特性：\n\n### 1. 简单\nJava 的语法与 `C` 和 `C++` 几乎相似，因此熟悉\
  \ `C/C++` 的程序员不需要从头开始学习语法。但 `C/C++` 中许多既复杂又导致歧义的特性在 Java 中被移除了。\n\n1. Java 不支持多继承，因为该概念比较复杂并可能导致歧义。\n\
  2. Java 不支持全局变量，这导致了 `C/C++` 程序中出现许多 bug。\n3. Java 不使用指针，也不允许指针算术，由于固有的复杂性，指针算术是\
  \ `C/C++` 程序中大多数 bug 的根源。\n4. Java 不支持运算符重载，因为可能会导致混淆。\n5. Java 中没有垃圾值的概念。我们必须在变量之前初始化变量。\n\
  \n### 2. 安全\nJava 程序运行在 `JVM`（Java 虚拟机）内部，其他部分无法访问它们。这极大地提高了安全性。由于这一特性，Java 程序很少发生挂起。这与频繁挂起的\
  \ `C/C++` 程序 截然不同。Java 的安全模型有三个主要组成部分：\n\n1. 类加载器。\n2. 字节码验证器。\n3. 安全管理器。\n\nJava\
  \ 使用不同的类加载器从本地机器和远程机器加载类文件（可执行文件）。从远程机器加载的类（如 `Applet` 类）不允许读取或写入本地机器的文件。这防止了恶意程序损坏本地文件系统。字节码验证器在类加载器完成工作后立即验证字节码。它确保字节码是有效的\
  \ Java 代码。这几乎消除了 Java 程序执行某些恶意活动（如访问 `JVM` 外部的内存）的可能性。`Security Manager` 控制许多关键操作，如删除文件、创建线程等。只有当\
  \ Java 程序具有足够权限时，才允许这些操作，否则 `Security Manager` 不允许这些操作并生成 `Security Exception`。\n\
  \n### 3. 可移植性\nJava 程序是平台无关的。它们遵循“一次编写，随运行”的策略。为 Windows 平台编写的 Java 程序只需通过拷贝字节码（`.class`\
  \ 文件）即可运行在任何其他平台（Unix、Linux、Sun Solaris 等）。不需要像 `C/C++` 程序那样复制源代码并重新编译。这一特性使得 Java\
  \ 成为一种强大的语言。只要机器具有 `JVM`，我们就可以在任何机器上运行字节码。`JVM` 本身依赖于平台，但它让 Java 代码平台无关。实际上是 `JVM`\
  \ 将字节码转换为机器码并执行它们。\n\n因此我们可以说 Java 是一种可移植的语言。让 Java 高度移植的另一个特性是原始数据类型的长度与平台无关且固定的。例如，Java\
  \ 中的 `int` 始终是 4 字节。这与 `C/C++` 不同，`int` 的大小在某些机器上可能是 2 字节，在另一些机器上可能是 4 字节。\n\n###\
  \ 4. 面对象\nJava 几乎是一种纯面向对象的语言，但为了性能考虑，它支持 `byte`、`short`、`int`、`long`、`float`、`double`、`char`、`boolean`\
  \ 等原始数据类型。\n\n### 5. 健壮性\n大多数程序失败于两个原因之一：\n1. 内存管理。\n2. 运行时的异常情况。\n\n在设计语言时，目标之一是确保\
  \ Java 程序尽可能地健壮，即它们很少失败。因此，Java 特别重视上述两个因素。\n\n在 Java 中，内存的分配和释放由语言本身处理，这消除了 `C/C++`\
  \ 中动态内存管理功能引起的许多问题。Java 还支持面向对象的异常处理特性来处理运行时发生的异常情况。这允许 Java 程序在发生异常情况后能够恢复并继续执行。\n\
  \n### 6. 多线程\nJava 的设计是为了满足创建交互式、网络化程序的现实需求。Java 提供了编写多线程程序的支持来实现这一点。这允许程序员编写可以并发执行许多任务的程序。\n\
  \n例如，一个 `GUI`（图形用户界面）应用程序可能正在监听用户事件并采取行动，一个单独线程可能正在打印，另一个单独线程可能正在从网络上的机器下载文件，这一切都是并发的这带来了更好的性能和\
  \ CPU 利用率。\n\n其他语言也可以编写多线程程序，但只能通过使用系统调用来实现，而在 Java 中，可以通过语言本身的特性来实现。\n\n### 7.\
  \ 架构中立\n程序员面临的主要问题之一是，无法保证我们今天写的程序明天还能运行——即使在同一台机器上。操作系统的升级、处理器的升级以及核心系统资源的变化可能导致程序故障。但\
  \ Java 程序的目标是“一次编写，随处运行”。\n\n### 8. 解释执行与高性能\nJava 程序是经过解释执行的，但与其他解释器相比，它们运行得更快。\n\
  \n### 9. 分布式\nJava 是为互联网的分布式环境设计的。Java 在此方面内置了各种 `TCP/IP` 协议。事实上，使用 `URL` 访问资源类似于访问本地机器上的文件。Java\
  \ 还具有远程方法调用特性，这与远程过程调用 (`RPC`) 某种相似。这允许不同计算机上的对象远程执行过程。Java 为此提供了内置 API，称为 `RMI`。\n\
  \n### 10. 动态\n每个 Java 类都是一个独立的执行单元。类仅在需要时在运行时加载。Java 中方法绑定的默认机制也是动态的（运行时绑定）。\n\n\
  ## 运行独立的 Java 应用程序\n\n当 `C` 或 `C++` 程序被编译时，它被直接翻译成特定处理器或特定平台的机器码。但运行 Java 程序是一个两步过程。在\
  \ Java 中，从源代码到可执行代码的翻译是通过两个翻译器完成的：\n\n\n\n\n\n# Java 编程概述\n\n1. **Java 编译器** - 首先，Java\
  \ 程序被编译成字节码。字节码就像机器码，但它不是针对某个特定处理器或平台的。字节码无法直接执行。\n\n2. **Java 解释器 (JVM)** - Java\
  \ 解释器通过 `JIT` 将字节码翻译成特定平台的实际机器码。\n\n**注意 1** - `C` 或 `C++` 程序只需编译一次，而 Java 字节码在我们每次执行\
  \ Java 程序时都会被翻译。因此，与 `C/ C++` 程序相比，Java 程序的运行速度稍慢。\n\n**注意 2** - 运行 Java 程序我们需要一个文本编辑器（`Notepad`\
  \ 或 `Edit`）、`JDK`（Java 开发工具包）以及 `JVM`（许多操作系统已内置）。我们也可以用 `Eclipse` 或 `JCreater` 代替\
  \ `Notepad`。\n\n## 在 win xp 上安装 Java 1.7\n\n双击 `我的电脑` $\\rightarrow$ 双击 `光驱` $\\\
  rightarrow$ 双击 `JDK1.7 Java 安装文件` $\\rightarrow$ 点击 `Next`、`Next`、`.....`\n\n##\
  \ 设置路径 (Path)\n\n如果我们设置了 Java 文件夹的路径，就可以在任何地方运行 Java 程序，否则我们必须在 Java 的 `bin` 文件夹中运行程序。\n\
