  \n* `Color(0,0,0)`（黑色）\n...\n\n#### 选择字体\n\n设置图形上下文的字体就像设置颜色，后续的的操作将使用新字体。在设置字体之前，我们必须创建一个。字体类的构造函数看起来如下：`Font(string\
  \ fontName, int style, int size)`。第一个参数是字体名称。可用性取决于平台。我们可以通过调用 toolkit 的 `getFontList()`\
  \ 方法获取可用字体列表，返回为字符串数组，如下：\n\n```java\nString fontNames[]= Toolkit.getDefaultToolkit().getFontList();\n\
  ```\n\n有三个平台无关的字体名称，我们鼓励使用：\n\n1. \"Serif\"\n2. \"Sansserif\"\n3. \"Monospaced\"\
  \n\n在 JDK 的 1.0. 版本中，它们分别被称为“TimesRoman”，“Helvetica”和“Courier”。\n\n样式参数可以发送以下任何\
  \ int 常数：\n\n1. `Font.PLAIN`\n2. `Font.BOLD`\n3. `Font.ITALIC`\n\n下面的代码片段将图形上下文\
  \ `gc` 的字体设置为 24 点加粗无衬线：\n\n```java\nFont f =new Font(\"SansSerif\",Font.BOLD,24);\n\
  gc.setFont(f);\n```\n\n我们可以通过传递样式的和来指定样式组合，例如加粗斜体字体：`Font.BOLD + Font.ITALIC`\n\n\
  #### 绘制和填充\n\ngraphics 类的所有渲染方法都指定了它们渲染形状的像素坐标，每个组件都有自己的坐标空间，原点位于组件的左上角，x 向右增加，y\
  \ 向下增加。下图显示了组件坐标系：\n\n![image](img/image031.png)\n\n图形上下文类没有大量的绘制方法。（复杂的渲染由扩展 API\
  \ 处理，如 2d、3d 和动画。）\n\n我们需要了解的图形上下文类的方法有：\n\n* `void drawLine(int x1,int y1, int\
  \ x2, int y2)` 使用当前颜色，在此图形上下文的坐标系中点 (x1,y1) 和 (x2, y2) 之间绘制一条线。\n* `void drawRect(int\
  \ x, int y, int width, int height)` 绘制指定矩形的轮廓。\n* `void fillRect (int x, int y,\
  \ int width, int height)` 填充指定的矩形。\n\n\n\n\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `void\
  \ drawOval(int x, int y, int width, int height)` | 绘制由指定矩形边界的椭圆轮廓。 |\n| `void fillOval(int\
  \ x, int y, int width, int height)` | 用当前颜色填充指定矩形边界的椭圆。椭圆由矩形边界框指定。椭圆位于边界框内，并如图像所示与框的每个侧边中点相切：要绘制圆形，请使用正方形边界框。请注意，绘画仅绘制前景像素，不绘制背景，因此边界框内但椭圆以外的空间将保持不变。这里，`x`\
  \ 和 `y` 是边界框左上角的坐标，`width` 和 `height` 是框的宽度和高度。 |\n| `void drawArc(int x, int y,\
  \ int width, int height, int startAngle, int arcAngle)` | 绘制覆盖指定矩形的圆弧或椭圆圆弧的轮廓。 |\n\
  | `void fillArc(int x, int y, int width, int height, int startangle, int arcangle)`\
  \ | 填充覆盖指定矩形的圆弧或椭圆弧。圆弧是椭圆的一部分。指定圆弧时，我们首先指定椭圆的边界框，就像 `drawOval()` 和 `fillOval()`\
  \ 一样。我们还需要指定圆弧的起点和终点，通过指定起始角度和圆弧扫描角度来实现。填充圆弧是由圆弧本身以及从椭圆中心到圆弧端点的两个半径围成的区域。 |\n| `void\
  \ drawPolygon(int[]xPoints, int[]yPoints, int nPoints)` | 绘制由 x 和 y 坐标数组定义的闭多边形。\
  \ |\n| `void fillPolygon (int[] xPoints , int[] yPoints, int nPoints)` | 填充由 x 和\
  \ y 坐标数组定义的闭多边形。多边形是具有任意数量顶点的封闭图形。顶点以两个 int 数组的形式传递给 `drawPolygon()` 和 `fillPolygon()`\
  \ 方法。第一个数组包含顶点的 x 坐标，第二个数组包含 y 坐标。第三个参数指定顶点数量。注意：终点将与第一个点连接。 |\n| `void drawPolyLine(int[]\
  \ xPoints, int[]yPoints , int nPoints)` | 绘制由 x 和 y 坐标数组定义的连接线序列。折线类似于多边形，但它是开放的而不是封闭的。没有连接最后一个顶点和第一个顶点的线段。\
  \ |\n| `void drawString(String str, int x, int y)` | 使用此图形上下文当前的字体和颜色绘制指定字符串的文本。`x`、`y`\
  \ 参数指定字符串基线的左边缘。带有下伸部字母的字符（在大多数字体中为 g, j, p, q 和 y）延伸到基线以下。文本坐标相对于基线这一点非常重要。例如，在简单的文本中，我们可能会尝试在\
  \ (0,0) 处绘制字符串，期望它出现在区域的左上角。然而，由于基线的存在，我们只能看到字符串的下伸部字母，这可能意味着我们什么也看不到。默认情况下，图形上下文使用关联组件的字体，但我们可以通过调用图形上下文的\
  \ `setFont()` 方法设置不同的字体。 |\n| `boolean drawImage (Image img, int x, int y, ImageObserver\
  \ observer)` | 绘制当前可用的指定图像。这里，`im` 是要渲染的图像，`x` 和 `y` 是目标组件中图像左上角的坐标。图像观察者必须是一个实现\
  \ `imageobserver` 接口的对象。图像是矩形像素值集合离屏表示。Java 的图像支持非常复杂。目前，假设我们通过某种方式获取了图像（即 `java.awt.image`\
  \ 类的实例），并使用特定的图形上下文将其渲染到屏幕上。此的方法是调用图形上下文的 `drawImage()` 方法。 |\n\n### 示例 19.2\n\n\
  此示例说明了如何创建一个图像并使用其图形上下文在其上绘制。然后可以使用 `drawImage()` 方法在 applet 窗口中显示图像。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n/*<applet code=\"\
  PaintImage\" width=200 height=100></applet>*/\npublic class PaintImage extends Applet\
  \ {\n    private Image im;\n    public void init() { \n      im = createImage(100,50);\n\
  \      Graphics imgc=im.getGraphics();\n      imgc.setColor(Color.gray);\n     \
  \ imgc.fillRect(0,0,100,50);\n      imgc.setColor(Color.black);\n      imgc.fillOval(0,0,50,40);\n\
  \    }\n    public void paint(Graphics g) {\n      g.drawImage(im,10,10,this);\n\
  \    }\n}\n```\n输出：\n![images/image13.png)\n\n### 示例 19.3\n\n此示例说明了如何从现有图像创建一个图像对象。然后可以使用\
