  \      new Producer(q1);\n      new Consumer(q1);\n    }\n}\n```\n\n## 死锁\n\n我们在多任务处理中特别需要避免的一种特殊错误是死锁，它发生在两个线程对一对同步对象存在循环依赖时。例如，假设一个线程进入对象\
  \ `X` 的监视器，另一个线程进入对象 `Y` 的监视器。如果 `X` 中的线程尝试调用 `Y` 的任何同步方法，它将如预期地阻塞。然而，如果 `Y` 中的线程反过来尝试调用\
  \ `X` 的任何同步方法，该线程将永远等待，因为要访问 X，它必须释放自己对 `Y` 的锁，以便第一个线程完成。死锁是一种很难调试的错误，原因有两个：\n\n\
  1. 通常情况下，它只在两个线程的时间切分恰合适的情况下稀少发生。\n2. 它可能涉及两个以上的线程和两个同步对象。\n\n## 示例 12.15\n\n```java\n\
  class A\n{\n    synchronized void foo(B b1)\n    {\n```\n\n\n\n\n\n```java\nSystem.out.println(\"\
  Method foo called and then blocked\");\n\ntry {\n    Thread.sleep(1000);\n} catch(InterruptedException\
  \ e) {\n    System.out.println(e.getMessage());\n}\nSystem.out.println(\"Trying\
  \ to call b1.last()\");\nb1.last();\n```\n\n```java\nsynchronized void last() {\n\
  \    System.out.println(\"This will not be printed\");\n}\n}\n\nclass B {\n    synchronized\
  \ void bar(A a1) {\n        System.out.println(\"Method bar called and then blocked\"\
  );\n        try {\n            Thread.sleep(1000);\n        } catch(InterruptedException\
  \ e) {\n            System.out.println(e.getMessage());\n        }\n        System.out.println(\"\
  Trying to call a1.last()\");\n        a1.last();\n    }\n\n    synchronized void\
  \ last() {\n        System.out.println(\"This will not be printed\");\n    }\n}\n\
  \nclass DeadLock implements Runnable {\n    A a1= new A();\n    B b1 = new B();\n\
  \n    DeadLock() {\n        Thread t = new Thread(this);\n        t.start();\n \
  \       a1.foo(b1);\n    }\n\n    public void run() {\n        b1.bar(a1);\n   \
  \ }\n\n    public static void main(String args[]) {\n        new DeadLock();\n \
  \   }\n}\n```\n\n输出:\nMethod foo called and then blocked\nMethod bar called and\
  \ then blocked\nTrying to call b1.last()\nTrying to call a1.last()\n\n### 在 Java\
  \ 1.1 及之前的版本中挂起、恢复和停止线程：\n\n在 Java 2 之前，`suspend()` 和 `resume()` 由 `Thread` 类定义，用于暂停和重启线程的执行。它们的格式如下：\n\
