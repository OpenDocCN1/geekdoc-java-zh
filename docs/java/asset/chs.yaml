  * `Color(192,192,192)`（灰色）\n* `Color(128,255,0)`（绿色）\n* `Color(211,211,211)`（浅灰色）\n\
  * `Color(255,0,255)`（洋红色）\n* `Color(255,165,0)`（橙色）\n* `Color(255,192,203)`（粉色）\n\
  * `Color(255,0,0)`（红色）\n* `Color(255,255,255)`（白色）\n* `Color(255,255,0)`（黄色）\n\n\
