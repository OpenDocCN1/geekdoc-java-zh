  Output:\n```\n8 , 4.5\n```\n注意：在实现你的 `clone()` 方法时，不需要声明 `CloneNotSupportedException`，也不需要实现\
  \ `Cloneable` 接口。\n\n#### 克隆的副作用\n\n克隆引起的副作用有时很难立即发现。人们很容易认为一个类对于克隆是安全的，但实际上并非如此。通常情况下，如果没有充分的理由，你不应为任何类实现\
  \ `Cloneable` 接口。\n\n#### Example20.8\n\n此示例演示了克隆的副作用。\n\n```java\n1. class TestShallow\
