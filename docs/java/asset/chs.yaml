  \n* `Color(0,0,0)`（黑色）\n...\n\n如果我们想要一个不在列表中的颜色，可以自己构造。有几个版本的颜色构造函数，最简单的是 `Color(int\
  \ redLevel, int greenLevel, int blueLevel)`。这三个参数是 0 到 255 范围内的强度水平。\n\n#### 选择颜色\n\
  \n通过调用 `setColor()` 方法选择颜色。所需的参数是 `color` 类的实例。有 13 种预定义的颜色，可以通过 color 类的静态 变量访问（这些变量本身是\
