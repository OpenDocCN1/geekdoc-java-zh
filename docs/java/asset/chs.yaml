  for(int i=0;i<r1;i++)\n{\n    for(int j=0;j<c2;j++)\n        System.out.print(m3[i][j]+\"\
  \\t\");\n    System.out.println();\n}\n}\n}\n```\n\n### 3. 变长数组\n\n数组将多维数组视为“数组的数组”，可以如下所示声明一个二维数组：\n\
  \n```java\nint arr[ ] [ ] = new int [4][ ];\narr[0] = new int [1];\narr[1] = new\
  \ int [2];\narr[2] = new int [3];\narr[3] = new int [4];\n```\n\n这意味着数组总共有 4 行，其列数从\
  \ 1 开始逐个递增。因此，它们在内存中的表示方式如下：\n\n![image](img/image021.png)\n（内存分配）\n\n**注意 1** 数组的所有元素都将自动初始化为零，但如果想用不同的值初始化数组，可以在声明时直接进行初始化。数组的声明、内存分配和初始化步骤可以合并为一步：\n\
  \n```java\nint a[][]={  {5,7,1}, {1,7,9}, {4,5,7}, {1,1,1} };\n```\n\n**注意 2** 在上面的数组\
  \ `a` 中，`a.length` 将显示行数即 4，而 `a[0].length` 将显示第 0 行的列数，即 3。\n\n### 命令行参数\n\n有时我们希望在运行程序时向程序传递信息。这是通过向\
  \ `main()` 传递命令行参数来实现。命令行参数是在程序执行时直接跟在命令行中程序名后面的信息。\n\n要在 Java 程序内部访问命令行参数，我们必须使用传递给\
  \ `main()` 的 `String` 数组。\n\n`JVM` 会调用 `main()` 方法并将命令行参数作为字符串数组传递给它。在上面的示例中，数组的长度（即命令行参数的数量）是通过属性\
  \ `length` 获取的。\n\n`for` 循环用于在控制台/显示器上显示命令行参数。\n\n#### 示例 4.6 从命令行参数输入名称的程序。\n\n\
  ```java\nclass Hello\n{\n    public static void main(String args[])\n    {\n   \
  \     for(int i=0;i<args.length;i++)\n            System.out.println(\"Hello \"\
  \ + args[i]);\n    }\n}\n```\n`javac Hello.java`\n`java Hello Ravi Ajay Vijay`\n\
  \n**输出：**\n```\nHello Ravi\nHello Ajay\nHello Vijay\n```\n\n#### 示例 4.7 打印通过命令行输入的数字之和的程序。\n\
  \n```java\nclass SumCmd\n{\n    public static void main(String args[])\n    {\n\
  \        int sum=0;\n        for(int i=0;i<args.length;i++)\n            sum+=Integer.parseInt(args[i]);\n\
  \        System.out.println(\"Sum is \" + sum);\n    }\n}\n```\n`javac SumCmd.java`\n\
  `java SumCmd 5 6`\n**输出：**\n```\nSum is 11\n```\n\n#### 示例 4.8 从命令行排序数组的程序。\n\n\
  ```java\nclass SortCmd\n{\n    public static void main(String args[])\n    {\n \
  \       int n=args.length;\n        int a[]=new int[n];\n        for(int i=0;i<n;i++)\n\
  \            a[i] = Integer.parseInt(args[i]);\n        for(int i=0;i<n-1;i++)\n\
  \            for(int j=i+1;j<n;j++)\n                if(a[i]>a[j])\n           \
  \     {\n                    int t=a[i];\n                    a[i]=a[j];\n     \
  \               a[j]=t;\n                }\n        for(int i=0;i<n;i++)\n     \
  \       System.out.print(a[i]+\"\\t\");\n    }\n}\n```\n`javac SortCmd.java`\n`java\
  \ SortCmd 5 4 1 3 2`\n**输出：** 1 2 3 4 5\n\n### 单选题：\n\n1. 如果 `MyProg.java` 被编译为应用程序，并在命令行执行\
  \ `java MyProg a b c`，那么 `args.length` 的值是：\na) 1\nb) 2\nc) 3\nd) 4\n\n2. 在上面的数组\
  \ `a` 中，`a[1].length` 的值是：\na) 0\nb) 1\nc) 2\nd) 3\n\n3. 下列哪项关于变长数组的描述是正确的？\na)\
  \ 可以在声明时指定所有列的大小\nb) 变长数组的每一行长度可以不同\nc) 数组元素会自动初始化为零\nd) 变长数组不能是多维的\n\n4. 访问命令行参数是通过哪个方法接收的？\n\
  a) `init()`\nb) `main()`\nc) `run()`\nd) `execute()`\n\n5. 在 Java 中，`new` 运算符的作用是：\n\
  a) 释放内存\nb) 分配内存并创建对象\nc) 结束循环\nd) 定义变量\n\n\n\n\n在 `s2` 中进行的任何更改都将反映在 `s1` 中。这种赋值不会进行内存分配。几步之后，如果我们在\
  \ `s1` 中赋值 `null`，那么该对象将不会被销，因为它的引用还在对象 `s2`。但如果 `s1` 和 `s2` 都被赋值为 `null`，那么该对象将由垃圾回收器销，该对象占用的内存将被释放。\n\
  \n### 示例 5.1 只包含成员变量的类。\n\n```java\nclass A\n{\n    int x;\n    int y;\n}\nclass\
  \ ClassTest1\n{\n    public static void main(String args[])\n    {\n        A a1,a2;\
  \  //引用变量\n        a1 = new A();  //创建对象\n        a2 = new A();\n        a1.x =\
  \ 10;\n        a1.y = 20;\n        a2.x = 5;\n        a2.y = 6;\n        System.out.println(a1.x\
  \ + \"\\t\" + a1.y);\n        System.out.println(a2.x + \"\\t\" + a2.y);\n    }\n\
  }\n```\n**输出：**\n```\n10  20\n5  6\n```\n\n### 示例 5.2 包含成员变量与成员方法的类。\n\n```java\n\
  class A\n{\n    private int x;\n    private int y;\n    void setdata(int x1, int\
  \ y1)\n    {\n        x = x1;\n        y = y1;\n    }\n    void display()\n    {\n\
  \        System.out.println(x + \"\\t\" + y);\n    }\n}\nclass ClassTest2\n{\n \
  \   public static void main(String args[])\n    {\n        A a1 = new A();\n   \
  \     A a2 = new A();\n        //a1.x=10;  因为 x 是私有的，会报错\n        a1.setdata(10,20);\n\
  \        a2.setdata(5,7);\n        a1.display();\n        a2.display();\n    }\n\
  }\n```\n**输出：**\n```\n10  20\n5  7\n```\n\n注- 我们可以在类外也可以在类内部声明类的对象。\n\n### 示例 5.3\
  \ 在类内部定义类的对象。\n\n```java\nclass A\n{\n    private int x;\n    private int y;\n \
  \   void setdata(int x1, int y1)\n    {\n        x = x1;\n        y = y1;\n    }\n\
  \    void display()\n    {\n        System.out.println(x + \"\\t\" + y);\n    }\n\
  \    public static void main(String args[])\n    {\n        A a1 = new A();\n  \
  \      A a2 = new A();\n        a1.setdata(10,20);\n        a2.setdata(5,7);\n \
  \       a1.display();\n        a2.display();\n    }\n}\n```\n**输出：**\n```\n10  20\n\
  5  7\n```\n\n### 类成员的修饰符/可见性标签\n\n可见性修饰符仅适用于类的成员，而不适用于局部变量。\n\n- `private`：如果我们在成员变量或方法上指定\
  \ `private` 修饰符，那么该成员在声明它的类之外是不可见的。这将使类的成员对其他类隐藏。\n- `public`：如果我们在成员变量或方法上指定 `public`\
  \ 修饰符，那么该成员对所有类都可见。该成员即使在包外部也可以访问。`main()` 方法始终被定义为 public，因为 `main()` 方法是由 JVM\
  \ 访问的，而 JVM 在定义 `main()` 方法的类之外。\n- `protected`：声明为 `protected` 的成员可以被属于同一个包的所有类访问。保护级成员也可以从其他包的任何类访问。\n\
  - `default` / 无修饰符：如果成员前没有指定任何可见性修饰符，则该成员可以被同一个包内的所有类访问。该成员在包外部无法被访问。\n\n### 类或接口的可见性修饰符\n\
  \n- `public`：如果使一个类需要对所有包的类都可见，则它必须声明为 `public`，通过在 `class` 关键字之前指定修饰符来实现。\n- `default`\
  \ / 无修饰符：如果在类之前没有任何访问/可见性修饰符，则它的可见性仅在定义它的包（类组）内有效。\n\n### `this` 关键字\n\n`this` 是一个引用变量，用于存储调用方法的对象的引用。在运行时，`this`\
  \ 的引用会被调用对象的引用所替换。有时，方法可能需要引用调用它的对象。这可以通过 `this` 来实现。`this` 可以在任何方法内部使用以引用当前对象。注：局部变量会隐藏实例变量，因此我们必须显式地使用\
  \ `this`。\n\n### 实例变量隐藏\n\n众所周知，在 Java 中同一个作用域内声明两个同名的局部变量是非合法的。但我们可以拥有与类的实例变量同名的局部变量（方法的参数）。当局部变量与实例变量同名时，局部变量会隐藏实例变量。但\
  \ `this` 允许我们在即使局部变量隐藏了它的情况下仍然可以引用实例变量。\n\n### 示例 5.4 `this` 的用法\n\n```java\nclass\
  \ A\n{\n    private int x;\n    private int y;\n    void setdata(int x, int y)\n\
  \    {\n        this.x = x;  //this.x 是类成员，x 是局部变量\n        this.y = y;\n    }\n\
  \    void display()\n    {\n        System.out.println(x + \"\\t\" + y);\n    }\n\
  }\nclass ClassTest4\n{\n    public static void main(String args[])\n    {\n    \
  \    A a1 = new A();\n        A a2 = new A();\n        a1.setdata(10,20);\n    \
  \    a2.setdata(5,7);\n        a1.display();\n        a2.display();\n    }\n}\n\
  ```\n**输出：**\n```\n10  20\n5  7\n```\n\n### 方法重载\n\n只要参数的数量、类型或顺序不同，我们可以拥有多个同名的方法。这被称为方法重载。在调用重载方法时，实际参数的类型可能与任何重载方法的形式参数不完全匹配。在这种情况下，参数会被提升到更高类型直到找到匹配为止。如果在提升参数后仍未找到匹配，则会发生编译错误。\n\
  \n### 示例 5.5 在此示例中，两个 `setdata()` 方法相同但参数不同，因此这是方法重载。\n\n```java\nclass A\n{\n \
  \   private int x,y;\n    void setdata(int x1)\n    {\n        x = y = x1;\n   \
  \ }\n    void setdata(int x1, int y1)\n    {\n        x = x1;\n        y = y1;\n\
  \    }\n    void display()\n    {\n        System.out.println(x + \"\\t\" + y);\n\
  \    }\n}\nclass ClassTest5\n{\n    public static void main(String args[])\n   \
  \ {\n        A a1 = new A();\n        a1.setdata(5);\n        a1.display();\n  \
  \      A a2 = new A();\n        a2.setdata(10,20);\n        a2.display();\n    }\n\
  }\n```\n**输出：**\n```\n5  5\n10  20\n```\n\n### 构造函数\n\n在创建后立即进行初始化是一个非常常见的需求。我们可以为此这个目的定义实例方法，但必须显式地调用。Java\
  \ 为这种需求提供了解决方案。Java 允许对象在创建时使用构造函数进行自初始化。构造函数的语法与实例方法非常相似。它们与类名相同且没有返回类型。这是因为类构造函数的隐式返回类型是类本身。\n\
  \n\n\n\n### 默认构造函数\n每个类都有一个默认构造函数（如果没有定义显式构造函数），它不接受任何参数且函数体不包含任何语句。编译器会自动生成默认构造函数。\n\
  \n一旦我们添加了自己的构造函数，编译器就会停止生成默认构造函数。当我们不在类中创建任何构造函数时，`JVM` 将创建默认构造函数并将实例变量初始化为默认值 `null`\
  \ 或零。\n\n#### 示例 5.6 默认构造函数的使用\n```java\nclass A {\n    private int x;\n    private\
  \ int y;\n    void display() {\n        System.out.println(x + \"\\t\" + y);\n \
  \   }\n}\nclass ClassTest6 {\n    public static void main(String args[]) {\n   \
  \     A a1 = new A();\n        a1.display();\n    }\n}\n```\n**输出：**\n```\n0 0\n\
  ```\n**注意：** 这里我们没有创建任何构造函数，因此 `JVM` 在创建对象后自动创建默认构造函数，并将实例变量初始化为 `0` 或 `null`。\n\
  \n### 零参数构造函数\n我们可以用自己的零参数构造函数替换默认构造函数。这允许我们将实例变量初始化为任何值。\n\n### 参数构造函数\n带有参数的构造函数被称为参数构造函数。\n\
  \n**注意：** 构造函数可以像方法一样重载。这被称为构造函数重载。\n\n#### 示例 5.7 构造函数的使用\n```java\nclass A {\n\
  \    private int x;\n    private int y;\n    A() // 零参数构造函数 {\n        x = y = 0;\n\
  \    }\n    A(int x1) // 单参数参数构造函数 {\n        x = y = x1;\n    }\n    A(int x1,\
  \ int y1) // 双参数参数构造函数 {\n        x = x1;\n        y = y1; \n    }\n    void display()\
  \ {\n        System.out.println(x + \"\\t\" + y);\n    }\n}\nclass ClassTest7 {\n\
  \    public static void main(String args[]) {\n        A a1 = new A();\n       \
  \ a1.display();\n        A a2 = new A(5);\n        a2.display();\n        A a3 =\
  \ new A(4,7);\n        a3.display();\n    }\n}\n```\n**输出：**\n```\n0 0\n5 5\n4 7\n\
  ```\n\n#### 示例 5.8:\n```java\nimport java.util.Scanner;\nclass Complex {\n    private\
  \ int real,imag;\n    Complex()// 零参数构造函数 {\n        real=imag=0;\n    }\n    Complex(int\
  \ real, int imag) {\n        this.real=real;\n        this.imag=imag;\n    }\n \
  \   void getdata() {\n        Scanner sc=new Scanner(System.in);\n        System.out.print(\"\
  Enter 实部\");\n        real=sc.nextInt();\n        System.out.print(\"输入虚部\");\n\
  \        imag=sc.nextInt();\n    }\n    void display() {\n        if(imag>=0)\n\
  \            System.out.println(real+\"+\"+imag+\"i\");\n        else\n        \
  \    System.out.println(real+\"\"+imag+\"i\");\n    }\n    Complex sum(Complex c)\
  \ {\n        Complex t=new Complex();\n        t.real=real+c.real;\n        t.imag=imag+c.imag;\n\
  \        return t;\n    }\n    Complex mult(Complex c) {\n        Complex t=new\
  \ Complex();\n        t.real=real*c.real;\n        t.imag=imag*c.imag;\n       \
  \ return t;\n    }\n    public static void main(String args[]) {\n        Complex\
  \ c1=new Complex();\n        Complex c2=new Complex();\n        Complex c3=null,c4=null;\n\
  \        c1.getdata();\n        c2.getdata();\n        c3=c1.sum(c2);\n        System.out.print(\"\
  和为 \");\n        c3.display();\n        c4=c1.mult(c2);\n        System.out.print(\"\
  乘积为 \");\n        c4.display();\n    }\n}\n```\n\n### finalize 方法\n有时对象在在销毁时需要执行某些操作。例如，如果对象持有某些非\
  \ Java 资源（如文件句柄），我们可能希望在对象被销毁之前确保这些资源被释放。为了处理这种情况，Java 提供了一种名为 finalization 的机制。通过使用\
  \ finalization，我们可以定义当对象即将被垃圾回收器回收时发生的特定操作。`finalize()` 只在垃圾回收之前被调用。它不会在对象离开范围时被调用。在\
  \ C++ 中，使用析构函数的概念用于 finalization，但它与 Java 中的 `finalize()` 不完全相同。\n\n```java\nprotected\
  \ void finalize() {\n    // 此处编写 finalization 代码\n}\n```\n**注意：** 除了 `protected`\
  \ 修饰符外，我们也可以使用 `public`。\n\n### 变量类型\nJava 有三类变量：\n\n#### 1. 实例变量\n在类中声明且在所有方法之外的变量被称为实例变量。该变量的副本数量与对象的数量相同。在\
  \ Java 中，不需要初始化实例变量，因为这些变量在对象被创建并使用 `new` 操作符分配内存时就会被初始化。变量根据其类型进行初始化。所有数值变量都自动初始化为\
  \ `0`，`Boolean` 变量初始化为 `false`，引用变量（对象）初始化为 `null`。\n\n#### 2. 局部变量\n在方法内部声明的变量是局部变量。它们不会自动初始化。\n\
  \n#### 3. 静态变量\n静态变量也声明在方法之外，与实例变量类似，但使用了 `static` 修饰符。它们对于类是可见，所有实例共享。例如，类中的静态变量\
  \ `count` 可以跟踪程序中创建的实例数量。\n\n### 方法类型\n1. 实例方法\n2. 静态方法\n\n#### 实例方法\n这些方法与 C++\
  \ 函数相同。实例方法只能通过对象调用。如果我们在同一个类的静态方法内部调用实例方法，也必须使用对象名称。\n\n#### 静态方法\n\n\n\n\n静态方法可以使用对象名也可以通过类名来调用。静态方法只能访问静态成员。在同类的静态方法中，可以直接调用（不需要对象或类名）静态方法。\n\
  \n### 示例 5.10\n\n```java\nclass A\n{\n    int x;\n    static int y;\n    static\
  \ int sum(int a, int b)\n    {\n        //y = 5; 无错误，静态方法可以访问静态变量\n        //x =\
  \ 10; 错误，静态方法无法访问实例变量\n        //A a1 = new A();\n        //a1.x = 10; 无错误，因为静态方法可以通过对象访问实例变量\n\
  \        //this.x = 10; 错误，静态方法无法访问 this 或 super 关键字\n        int c;\n        c\
  \ = a+b;\n        return(c);\n    }\n    static float avg(int a, int b)\n    {\n\
  \        return (float)(a+b)/2;\n    }\n}\nclass ClassTest9\n{\n    public static\
  \ void main(String args[ ])\n    {\n        System.out.println(A.sum(5,6)); // 静态方法可以通过类名调用\n\
  \        System.out.println(A.avg(5,6));\n        A a1 = new A();\n        System.out.println(a1.sum(5,6));\
  \ // 静态方法也可以通过对象调用\n    }\n}\n```\n**输出：**\n```\n11\n5.5\n11\n```\n\n### 初始化块与静态块\n\
  初始化块用于初始化类的实例成员变量，静态块用于初始化类的静态成员变量。但构造函数会在这些块之后被调用。\n\n### 示例 5.11\n\n```java\n\
  class A\n{\n    int x;\n    static int y;\n\n    { // 初始化实例变量的初始化块\n        x =\
  \ 10;\n    }\n\n    static // 初始化静态变量的静态块\n    {\n        y = 5;\n    }\n}\nclass\
  \ ClassTest10\n{\n    public static void main(String args[])\n    {\n        A a1\
  \ = new A();\n        System.out.println(a1.x + \"\\t\" + a1.y);\n    }\n}\n```\n\
  **输出：**\n```\n10 5\n```\n\n### final 变量\n如果变量被声明为 `final`，则我们不能改变它的值 `final (double\
  \ PI=3.14;)`。`final` 变量不会按实例占用内存。`final` 变量是一个常量变量，其值不能改变。`final` 变量的引用类型不能改变其引用。\n\
  \n### 示例 5.12\n\n```java\nclass A\n{\n    void m1()\n    {\n        System.out.println(\"\
  Inside m1()\");\n    }\n}\nclass ClassTest11\n{\n    public static void main(String\
  \ args[])\n    {\n        final int x=10; // 不能修改\n        final int y; // 变量 y\
  \ 未初始化，所以稍后可以初始化 y\n        y=20; // 现在 y 初始化，之后我们不能改变它的值\n        // y=30; 错误\n\
  \        System.out.println(x);\n        System.out.println(y);\n        final A\
  \ a1=new A(); // a1 是常量引用，所以我们不能在 f1 中赋值其他对象的引用\n        a1.m1();\n        A a2\
  \ = new A();\n        // a1 = a2; 错误\n    }\n}\n```\n**输出：**\n```\n10\n20\nInside\
  \ m1()\n```\n\n### 参数传递机制\n1. 值传递。\n2. 引用传递。\n\n当将基本数据类型（`int`、`float`、`long` 等）传递给方法时，是通过值传递的方式。对于对象，实际传递的是对象引用。对象引用也是通过值传递的方式传递的。然而，由于传递的值指向对象，该值的拷贝将指向与参数相同的同一个对象。例如，我们将存储对象引用的引用变量\
  \ `a1` 传入函数，在函数中 `a2` 是形式参数，那么 `a1` 和 `a2` 都指向同一个对象。通过 `a2` 对对象值所的任何更改都会反映在 `a1`\
  \ 中。但如果在 `a2` 中分配一个新引用，则该引用不会在 `a1` 中复制。\n\n### 示例 5.13\n\n```java\nclass Box\n\
  {\n    private int feet;\n    private int inches;\n    Box()\n    {\n        feet\
  \ = inches = 0;\n    }\n    Box(int feet, int inches)\n    {\n        this.feet\
  \ = feet;\n        this.inches = inches;\n    }\n    void display()\n    {\n   \
  \     System.out.println(\"Feet is \" + feet +\"\\n\" + \"Inches is \" + inches);\n\
  \    }\n    void swap(Box obj)\n    {\n        int t;\n        t = feet;\n     \
  \   feet = obj.feet;\n        obj.feet = t;\n        t = inches;\n        inches\
  \ = obj.inches;\n        obj.inches = t;\n    }\n}\nclass ClassTest12\n{\n    public\
  \ static void main(String args[])\n    {\n        Box b1 = new Box(5,6);\n     \
  \   Box b2 = new Box(7,4);\n        b1.swap(b2); // 对象是通过引用传递的\n        b1.display();\n\
  \        b2.display();\n    }\n}\n```\n**输出：**\n```\nFeet is 7\nInches is 4\nFeet\
  \ is 5\nInches is 6\n```\n\n### 嵌套类\n嵌套类是指在另一个类内部定义的类。嵌套类有两种类型：静态和非静态。静态嵌套类必须通过对象访问外部类的成员。然而，静态嵌套类不能直接访问外部类的成员。由于其应用了\
  \ `static` 修饰符，静态嵌套类很少使用。\n\n非静态嵌套类可以访问外部类的所有成员，包括私有成员。\n\n### 示例 5.14\n\n```java\n\
  class Outer\n{\n    class Inner\n    {\n        int member_inner=7;\n        Inner()\n\
  \        {\n            member_outer = 5;\n            System.out.println(member_outer);\n\
  \        }\n    }\n    private int member_outer;\n    Outer()\n    {\n        //\
  \ member_inner = 9; 错误\n        Inner obj = new Inner();\n        System.out.println(obj.member_inner);\n\
  \    }\n}\nclass ClassTest13\n{\n    public static void main(String args[])\n  \
  \  {\n        Outer out_obj = new Outer();\n    }\n}\n```\n**输出：**\n```\n5\n7\n\
  ```\n\n### 示例 5.15\n\n```java\nclass Outer\n{\n    static class Inner\n    {\n \
  \       int member_inner=7;\n        Inner()\n        {\n            // 注意：静态内部类无法直接访问外部类的非静态成员，此处逻辑会报错\n\
  \        }\n    }\n    private int member_outer;\n    void prn()\n    {\n      \
  \  Inner obj = new Inner();\n        System.out.println(obj.member_inner);\n   \
  \ }\n}\n```\n\n### 示例 5.16\n\n```java\nimport java.util.Random;\nclass RandomTest\n\
  {\n    public static void main(String args[])\n    {\n        Random r1 = new Random();\n\
  \        for(int i=1;i<=10;i++)\n            System.out.println(Math.abs(r1.nextInt()));\n\
  \    }\n}\n```\n\n## 理论题\n\n1. 如果我们希望一个变量在类外部完全不可访问，在声明它时变量名前面应该加什么关键字？\n2. 在 Java\
  \ 中，对象/值是如何传递的？\n3. 考虑以下代码：\n```java\npublic static void main( String args[] )\n\
  {\n    int a = 5;\n    System.out.println( cube( a ) );\n}\n\nint cube( int theNum\
  \ )\n{\n    return theNum * theNum * theNum;\n}\n```\n解释 static 关键字的重要性。当我们尝试编译并运行此代码时会发生什么？\n\
  a) 编译失败，因为 java.lang.Math 类中已经定义了 cube。\nb) 编译失败，因为 cube 不是静态的。\nc) 可以编译，但会抛出算术异常。\n\
  d) 可以完美运行并在标准输出中打印 \"125\"。\n\n\n\n\n\n## 4. 什么是静态内部类？它与任何静态成员有什么区别？\n\n## 5. 如何在\
  \ Java 中声明常量值\n\n## 6. \"final\" 关键字的含义是什么？\n\n## 7. 什么是类变量？\n\n**答案：**\n\n当我们为同一个类创建多个对象时，每个对象将共享变量的共同副本。这意味着无论创建了多少个对象，每个类都只有一个副本。类变量或静态变量在类中通过\
  \ `static` 关键字声明。\n\n这些变量存储在静态内存中。类变量主要用于常量，即其初始值永远不会改变的变量。静态变量始终通过类名调用。\n\n该变量在程序启动时创建，即它在通过\
  \ `new` 运算符创建类的实例之前就已经创建了，并在程序停止时被销毁。类变量的作用域与实例变量相同。\n\n类变量可以在类层级的任何位置使用 `static`\
  \ 关键字定义。它的初始值与实例变量相同（规则）。当类变量被定义为 `int` 时，其默认值为零；当声明为 `boolean` 时，默认值为 false；对象引用的默认值为\
  \ `null`。类变量与类相关，而不是与任何对象相关。\n\n## 8. 解释垃圾回收。\n\n**答案：** 垃圾回收是 Java 最重要的特性之一。垃圾回收也被称为自动内存管理，因为\
  \ JVM 会自动从内存中移除使用的变量/对象（值为 `null`）。用户程序无法直接从内存中释放对象，相反，由垃圾回收器自动释放不再被程序引用的对象。\n\n\
  每个类都继承自 `java.lang.Object` 的 `finalize()` 方法，当垃圾回收器确定不再有对该对象的引用存在时，就会调用 `finalize()`\
  \ 方法。\n\n在 Java 中，当变量不再使用时，显式地为变量赋值 `null` 是一个好习惯。在 Java 中，调用 `System.gc()` 和 `Runtime.gc()`\
  \ 时，JVM 会尝试回收未使用的对象，但无法保证所有对象何时会被垃圾回收。\n\n## 9. 如果一个类有多个构造函数，我们可以从一个构造函数调用另一个吗？\n\
  \n可以。使用 `this()` 从一个构造函数调用另一个构造函数。\n\n## 10. 构造函数和普通方法之间有什么区别？\n\n构造函数必须与类名相同，且没有返回值。它们只会被调用一次，而普通方法可以被调用多次，并且可以返回值或返回\
  \ `void`。\n\n## 11. 我们如何强制执行垃圾回收？\n\n垃圾回收是自动过程，无法强制执行。我们可以通过调用 `System.gc()` 来请求它。JVM\
  \ 不保证 GC 会立即启动。\n\n## 12. 下列叙述哪一个是不正确的？\n\n(a) Java 中的局部变量总是由默认值初始化。\n(b) Java 中的局部变量在使用之前必须进行初始化。\n\
  (c) 内部块中的局部变量不能与外部块中的局部变量同名名。\n(d) 同一层级的两个块中的局部变量可以同名。\n\n![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n# ∞ 6 ∞\n# (继承)\n\n## 引言\n\n当一个类的属性转移到另一个类时，就称为继承。在这种情况下，被继承的类被称为超类、基类或父类，而继承的类被称为子类、子类类或派生类。\n\
  \n继承允许我们通过添加额外功能来扩展现有的类（基类）。它鼓励代码的重用，这有助于减小代码量，尽管在某些情况下可能会导致复杂性。\n\n例如，假设我们已经完成了一个简单计算器的代码。之后我们需要开发一个科学计算器，那么我们有两种替代方案：\n\
  \n(i) 创建一个新类。（重写该类）\n(ii) 扩展该类。\n\n在大多数情况下，第二种方案是更好的选择。在这种情况下，我们只需要编写一小段代码。同时，我们不需要在调试和测试上花费大量时间，因为基类已经过测试并且已经使用了很长时间。当我们需要将一个类继承到另一个类时，必须使用\
  \ “extends” 关键字。\n\n**语法：** `class sub_class extends base_class`\n\n![image](img/image087.png)\n\
  \n类 A（超类或基类或父类）。\n类 B（子类或派生类或子类类）。\n\n子类将除了扩展类中定义的新功能外，还拥有基类的所有功能。Java 不支持多继承，但它支持多接口继承，因此子类只能继承一个基类。\n\
  \n**示例 6.1：**\n\n```java\n1.  class A\n2.  {\n3.    int x;\n4.    void setX(int\
  \ x1)\n5.    {\n6.    x = x1;\n7.    }\n8.    void displayX()\n9.    {\n10.    \
  \ System.out.println(x);\n11.    }\n12. }\n13. class B extends A\n14. {\n15.   \
  \ int y;\n16.    void setY(int y1)\n17.    {\n18.        y = y1;\n19.    }\n20.\
  \    void displayY()\n21.    {\n22.        System.out.println(y);\n23.    }\n24.\
  \ }\n25. class InheritTest\n26. {\n27.    public static void main(String args[])\n\
  28.    {\n29.        A a1 = new A();\n30.        a1.setX(5);\n31.        a1.displayX();\n\
  32.        B b1 = new B();\n33.        b1.setX(10);\n34.        b1.displayX();\n\
  35.        b1.setY(20);\n36.        b1.displayY();\n37.    }\n38. }\n```\n\n**输出：**\n\
  ```\n5\n10\n20\n```\n\n### 成员隐藏\n\n如果子类成员与父类成员具有相同的名称（方法情况下具有相同的签名），则它会隐藏父类成员。虽然两个成员在子类中都可用，但使用成员名时只能访问子类。\n\
  \n### 使用 super 关键字\n\n当子类需要引用其直接父类时，可以通过 `super` 关键字来实现。`super` 有两个通用用途：\n\n1. 调用父类的构造函数：子类可以通过形式为\
  \ `super(parameter-list);` 的调用调用超类定义的构造方法。这里 `parameter-list` 指定了父类构造函数所需的参数。事实上，`super()`\
  \ 必须是子类构造函数内部的第一条语句。\n2. 访问被子类成员隐藏的父类成员：可以使用以下形式 `super.member;` 使用关键字来访问父类的隐藏成员。这里\
  \ `member` 可以是方法，也可以是数据成员。\n\n### 方法重载与方法重写\n\n### 方法重载\n当两个或多个方法名称相同但参数不同时，被称为方法重载。方法重载用于对象执行相似任务但使用不同输入参数的情况。当我们调用方法时，Java\
  \ 首先匹配方法名，然后匹配参数的数量和类型。决定调用哪一个方法定义被称为多态。\n\n#### 方法重写\n我们已经看到父类中的方法被子类继承，并被子类创建的对象使用。方法继承允许我们在子类中重复定义和使用方法，而无需再次定义。在类层次结构中，当子类中的实例方法与其父类中的实例方法（非私有）具有相同的名称签名时，子类中的方法被称为重写了父类中的方法。当在子类内部调用重写的方法时，它将始终引用子类中定义的方法版本。父类中定义的方法版本将被隐藏。\n\
  \n\n\n\n\n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image080.jpg)\n\
  \n## 示例 6.2\n\n```java\nclass A {\n    int x;\n    void set(int x1) {\n        x\
  \ = x1;\n    }\n    void display() {\n        System.out.println(x);\n    }\n}\n\
  \nclass B extends A {\n    int y;\n    void set(int x1,int y1) // 类 B 的 set 方法没有重写类\
  \ A 的 set\n    // 方法，因为参数不同\n    {\n        set(x1);  //这将调用类 A 的 set()\n      \
  \  y = y1;\n    }\n    void display() // 类 B 的 display 方法重写了\n    // 类 A 的方法\n \
  \   {\n        //  display();  这将调用类 B 的 display\n        super.display(); // 这将调用类\
  \ A 的 display\n        System.out.println(y);\n    }\n}\nclass InheritTest2 {\n\
  \    public static void main(String args[]) {\n        B b1 = new B();\n       \
  \ b1.set(10,20);\n        b1.display();\n    }\n}\n```\n\n输出:\n```\n10\n20\n```\n\
  \nJava 支持以下继承形式：\n[1] 单继承继承。\n[2] 多级继承。\n[3] 层层级继承。\n\n### [1] 单继承继承。\n\n![image](img/image042.png)\n\
  \n## 示例 6.3:\n\n```java\nclass A {\n    private int x;\n    A() {\n        x = 0;\n\
  \    }\n    A(int x1) {\n        x = x1;\n    }\n    void display() {\n        System.out.print(x);\n\
  \    }\n}\nclass B extends A {\n    private int y;\n    B() {\n        super();\n\
  \        //x=0;  错误，因为 x 是私有的\n        y=0;\n    }\n    B(int x1, int y1) {\n  \
  \      super(x1);\n        //x = x1; 错误，因为 x 是私有的\n        y = y1;\n    }\n    void\
  \ display() {\n        super.display();\n        System.out.print(y);\n    }\n}\n\
  class InheritTest3 {\n    public static void main(String args[]) {\n        B b1\
  \ = new B();\n        b1.display();\n        B b2 = new B(10,20);\n        b2.display();\n\
  \    }\n}\n```\n\n输出:\n```\n0 0 10 20\n```\n\n---\n\n### [2] 多级继承。\n\n![image](img/image018.png)\n\
  \n---\n\n## 示例 6.4\n\n```java\nclass A {\n    private int x;\n    A() {\n      \
  \  x = 0;\n    }\n    A(int x1) {\n        x = x1;\n    }\n    void display() {\n\
  \        System.out.println(x);\n    }\n}\nclass B extends A {\n    private int\
  \ y;\n    B() {\n        super();\n        y=0;\n    }\n    B(int x1, int y1) {\n\
  \        super(x1);\n        y = y1;\n    }\n    void display() {\n        super.display();\n\
  \        System.out.println(y);\n    }\n}\nclass C extends B {\n    private int\
  \ z;\n    C() {\n        super();\n        z=0;\n    }\n    C(int x1, int y1, int\
  \ z1) {\n        super(x1,y1);\n        z = z1;\n    }\n    void display() {\n \
  \       super.display();\n        System.out.println(z);\n    }\n}\nclass InheritTest4\
  \ {\n    public static void main(String args[]) {\n        C c1 = new C();\n   \
  \     c1.display();\n        C c2 = new C(10,20,30);\n        c2.display();\n  \
  \  }\n}\n```\n\n输出:\n```\n0\n0\n0\n10\n20\n30\n```\n\n---\n\n### [3] 层层级继承。\n\n\
  ![image](img/image012.png)\n\n#### 构造函数的调用顺序：\n\n当创建一个类层次结构时，构成该层次结构的类的构造函数按照什么顺序被调用？答案是，在类层次结构中，构造函数按照派生顺序从父类到子类进行调用。\n\
  \n此外，由于 `super()` 必须是子类构造函数中执行的第一条语句；无论是否使用 `super()`，这种顺序都是相同的。如果不使用 `super()`，则将执行每个父类的默认或无参数构造函数。\n\
  \n构造函数按照派生顺序执行。因为父类对任何子类一无所知，因此它需要执行的任何初始化都是独立的，并且可能是子类执行的任何初始化的前决条件。因此，它必须首先执行。\n\
  \n关键字 `super` 在满足以下条件时使用：\n- `super()` 构造方法只能在子类的构造方法方法内部调用。\n- 对父类构造方法的调用必须作为子类构造方法的第一条语句。\n\
  - super 调用中的参数必须与父类构造函数的顺序和类型匹配。\n\n---\n\n### 动态方法绑定（动态方法调度或运行时绑定）：\n\n方法重写构成了\
  \ Java 强大概念的基础。动态方法调度是在运行时而不是编译时解析对重写实例方法的机制。动态方法调度很重要，因为这是 Java 实现运行时多态的方式。\n\n\
  父类引用可以引用子类对象。Java 利用这一事实在运行时解析对重写方法的调用。当通过父类引用调用重写方法时，Java 根据调用时对象的类型来确定执行哪个版本的方法。\n\
  \n因此，这种确定是在运行时进行的，当不同类型的对象引用不同版本的方法时。\n\n## 示例 6.5\n\n```java\nclass Shape {\n \
  \   void getdata() {\n        System.out.println(\"getdata Shape\");\n    }\n  \
  \  void area() {\n        System.out.println(\"area Shape\");\n    }\n    void display()\
  \ {\n        System.out.println(\"display Shape\");\n    }\n}\nclass Circle extends\
  \ Shape {\n    void getdata() {\n        System.out.println(\"getdata Circle\");\n\
  \    }\n    void area() {\n        System.out.println(\"area Circle\");\n    }\n\
  \    void display() {\n        System.out.println(\"display Circle\");\n    }\n\
  }\nclass Rectangle extends Shape {\n    void getdata() {\n        System.out.println(\"\
  getdata Rectangle\");\n    }\n    void area() {\n        System.out.println(\"area\
  \ Rectangle\");\n    }\n    void display() {\n        System.out.println(\"display\
  \ Rectangle\");\n    }\n}\nclass InheritTest5 {\n    public static void main(String\
  \ args[]) {\n        // 父类引用变量可以接受子类对象\n        // 动态绑定\n        Shape s[]={new\
  \ Circle(), new Rectangle()};\n        for(int i=0;i<s.length;i++) {\n         \
  \   s[i].getdata();\n            s[i].area();\n            s[i].display();\n   \
  \     }\n    }\n}\n```\n\n\n\n\n\n60. }\n\n输出:\n\n`getdata()` of Circle\n`area()`\
  \ of Circle\n`display()` of Circle\n`getdata()` of Rectangle\n`area()` of Rectangle\n\
  `display()` of Rectangle\n\n## 抽象类与抽象方法\n\n我们已经看到，通过将方法标记为 `final`，我们可以确保该方法不会在子类中被重定义。`Java`\
  \ 允许我们进行与此完全相反的操作。即我们可以指定某个方法必须在子类中被重定义，从而使重写（`overriding`）成为强制。这是通过在方法定义修饰符 `abstract`\
  \ 实现的。\n\n在某些情况下，我们希望定义一个父类，它声明某个抽象概念的结构，但不提供每个方法的完整实现。\n\n也就是说，有时我们想要创建一个父类，它只定义一个所有子类都共享的通用形式，而将细节留给每个子类去填充。\n\
  \n此类类决定了子类必须实现的方法性质。这种情况发生的一种方式是父类无法为某个方法创建有意义的实现。\n\n要声明一个抽象方法，请使用以下通用格式：\n\n`abstract\
  \ return_type name (parameter-list);`\n\n没有任何实现存在。任何包含一个或多个抽象方法的类也必须声明为 `abstract`。要声明一个类为\
  \ `abstract`，我们只需要在声明开头的 `class` 关键字前面使用 `abstract` 关键字。\n\n抽象类不能创建对象。也就是说，抽象类不能用\
  \ `new` 运算符直接实例化。这样的对象是没用的，因为抽象类没有完全定义。\n\n此外，我们不能声明 `abstract` 构造函数或 `abstract`\
  \ 静态方法。抽象类的任何子类必须实现父类中所有的抽象方法，或者本身也被声明为 `abstract`。\n\n### 示例 6.6:\n\n```java\n\
  abstract class Shape\n{\n    abstract void getdata();\n    abstract void area();\n\
  \    abstract void display();\n}\nclass Circle extends Shape\n{\n    void getdata()\n\
  \    {\n        System.out.println(\"getdata() of Circle\");\n    }\n    void area()\n\
  \    {\n        System.out.println(\"area() of Circle\");\n    }\n    void display()\n\
  \    {\n        System.out.println(\"display() of Circle\");\n    }\n}\nclass Rectangle\
  \ extends Shape\n{\n    void getdata()\n    {\n        System.out.println(\"getdata()\
  \ of Rectangle\");\n    }\n    void area()\n    {\n        System.out.println(\"\
  area() of Rectangle\");\n    }\n    void display()\n    {\n        System.out.println(\"\
  display() of Rectangle\");\n    }\n}\nclass InheritTest6\n{\n    public static void\
  \ main(String args[])\n    {\n        //父引用变量可以接受子类对象\n        //动态绑定\n        Shape\
  \ s[]={new Circle(), new Rectangle()};\n        for(int i=0;i<s.length;i++)\n  \
  \      {\n            s[i].getdata();\n            s[i].area();\n            s[i].display();\n\
  \        }\n    }\n}\n```\n\n输出:\n\n`getdata()` of Circle\n`area()` of Circle\n\
  `display()` of Circle\n`getdata()` of Rectangle\n`area()` of Rectangle\n`display()`\
  \ of Rectangle\n\n## Final 方法:-\n\n如果我们不希望一个方法被派生类方法重写，那么可以将基类方法定义为 `final`。任何重写该方法的尝试都会导致编译时错误。\n\
  \n```java\nclass A\n{\n    final void method1()\n    {\n        -----\n    }\n}\n\
  class B extends A\n{\n    void method1()  // error\n    {\n        -----\n    }\n\
  }\n```\n\n## Final 类:-\n\n有时出于安全考虑，我们可能希望防止一个类被进一步子类。不能被子类的类被称为 `final` 类。在 `java`\
  \ 中通过使用 `final` 关键字来实现：\n\n```java\nfinal class A1\n{\n    - - - - - -\n    - -\
  \ - - - -\n}\nclass B extends A    // error\n{\n    - - - - - - -\n    - - - - -\
  \ - -\n}\n```\n\n任何继承类 `A` 的尝试都会导致错误，编译器将不允许。声明类为 `final` 可以防止任何扩展。编译器还允许一些优化。\n\
  \n## 理论题：\n\n1. 什么是继承？\n2. 有多少类型的继承？\n3. 默认构造函数和参数化构造函数有什么区别？\n4. final 类和方法之间有什么区别？\n\
  5. 什么是父类？\n6. 什么是抽象类？\n7. 编译时绑定和运行时绑定有什么区别？\n8. 方法重载（method overloading）和方法重写（method\
  \ overriding）之间有什么区别？\n\n\n\n\n\n## 对象\n\n## 对象\n对象是一个物理或抽象的实体或事物，它可以与其他相似类型的对象区分来。对象具有三个特征：\n\
  \n(i) 标识性（Identification）。\n(ii) 属性（Properties）。\n(iii) 行为（Behaviors）。\n\n对象也可以被视为\
  \ `class`（类）的实例（instance），其中 `class` 就像一个内置数据类型，而对象就是 `variable`（变量）。\n\n## Class\n\
  类通过抽象化其属性和行为来表示一类对象。`class` 可以被视为创建对象的蓝图。对象具有其 `class` 定义的属性和行为。`class` 可以被视为一种用户定义的数据类型，而对象是该\
  \ `class` 所代表的数据类型的 `variable`/instance（变量/实例）。\n\n对象的属性是由 `Java` 中的数据成员/字段（data\
  \ members / fields）定义的。`class` 中的数据成员/`field` 是一个可以存储数据的 `variable`。对象的行为/操作是使用\
  \ `Java` 中的 `methods`（方法）定义的。数据成员和 `methods` 都称为 `class` 的成员。\n\n`class` 也可以被视为一种用户定义的数据类型，而对象是该数据类型的\
  \ `variable`。一旦定义了 `class`，我们就可以创建任意属于该 `class` 的对象。\n\n# 3. 三大 OOP 原则\n\n## 封装\n\
  封装是将代码及其所作用的数据结合的机制。`Java` 类支持这种机制，因为它们允许我们将代码和数据定义在一起。封装还通过将某些 `class` 成员声明为 `private`\
  \ 来帮助实现数据隐藏，这样它们就无法从不属于该类的代码中访问。\n\n## 继承\n在面向对象编程中，继承指的是一个 `class` 的属性对被称为子类（sub-classes）或派生类（derived\
  \ classes）的其他类可用。子类或派生类是从现有的 `class` 派生的。它继承了现有类的所有特征，该类也被称为 `base-class`（基类）或 `super-class`（超类）。因此，继承可以定义为从\
  \ `super-class` 或 `base-class` 派出一个 `class` 的过程。继承类不会给 `base-class`/`super-class`\
  \ 引入任何更改。与 `base-class` 相比，派生类/子类具有更大的属性和行为集合。\n\n继承的主要优势是代码的可重用。如果 `base class`\
  \ 使用了很久，并且需要添加一些额外的属性和方法，我们可以通过派生另一个类来实现。派生类将能够使用 `base class` 的代码而无需调试，因为它已经使用了很长时间。\n\
  \n### 类层次结构\n所有派生自同一个 `base class` 的类都属于一个家族并形成类层次结构。类层次结构可以与树结构相比，其中一个 `base class`\
  \ 位于根节点且没有 `super-class`。\n\n所有其他类要么派生自层次结构根节点的类，要么派生自其他类（而这些类直接或间接地派生自根类）。随着我们在树向下移动，添加的功能越来越多。由叶节点表示的类没有任何子类。以下示例展示了一些类层次结构。\n\
  \n![image](img/image088.png)\n\n## 多态\n多态是一种允许用相同的接口用于一类动作的特性。大多数面向对象的语言在以下情况使用多态：\n\
  \n* 运算符重载（Operator Overloading）。\n* 方法重载（Method Overloading）。\n* 方法重写（Method Overriding）。\n\
  \n### 运算符重载\n大多数语言对内置操作使用这种形式的多态。例如，`C/C++` 或 `Java` 中的所有算术运算符都可以用于许多类型的操作数（`int`、`long`、`float`、`double`\
  \ 等）。因此，相同的加法运算符可以用于加两个整数也可以用于加两个浮点数。\n\n`C++` 允许用户重载内置运算符。例如，我们可以重载算术运算符来处理复数。虽然\
  \ `Java` 对内置运算符使用了运算符重载，但它不允许用户重载运算符。\n\n### 方法重载\n此特性允许我们编写一个或多个具有相同名称的方法。`C++`\
  \ 和 `Java` 都具有这一特性。同名的 `methods`（`C++` 中的函数 function）根据参数（arguments）进行区分。重载的方法必须具有不同的参数数量，或者如果参数数量相同时，参数的类型必须不同。\n\
  \n如果对重载方法的调用可以在编译时解析，即如果编译器可以决定将调用哪个重载方法，则这被称为静态绑定（static binding），它是编译时多态的一个例子。\n\
  \n如果对重载方法的调用无法在编译时解析，即如果编译器无法决定将调用哪个重载方法，则这被称为动态绑定（dynamic binding），它是运行时多态的一个例子。\n\
  \n通常，`Java` 在运行时解析对重载方法的调用，但在许多情况下，重载方法的调用是在编译时解析的。\n\n### 方法重写\n子类可以定义一个与 `super\
  \ class` 中相同名称的方法，并且具有相同的参数数量和类型。这被称为方法重写（method overriding）。\n\n编译器无法解析对重写方法的调用。`Java`\
  \ 通常使用动态绑定来解析对重写方法的调用，即决策发生在运行时。\n\n# 4. 持久化\n某些面向对象的语言允许我们将程序的状态存储到/从持久化存储介质（即辅助存储等永久存储介质）。这被称为持久化（persistence）。\n\
  \n`Java` 允许我们将任何对象存储在辅助存储中并在以后检索它。如果我们尝试在对象图的顶部存储一个对象，所有其他引用的对象将被递归地定位并保存。同样，当以后检索该对象时，所有对象及其引用（即整个对象图）都会在主内存中正确创建。\n\
  \n例如，通过只需保存树的根就可以保存整个树结构。C++ 不支持此特性。\n\n## 5. 通用性\n定义一次算法（独立于任何数据类型），然后在不引入任何额外努力的情况下将该算法应用于各种数据类型的概念被称为通用性（Genericity）。`C++`\
  \ 使用模板（templates）支持这一特性。`Java` 也通过 `Object class` 支持这一特性，`Object class` 位于 `Java`\
  \ 中任何类层次结构的顶端。\n\n例如，使用此特性，我们可以实现一个通用数据类型 `stack`，使得在 `stack` 中存储任何类型的元素成为可能。这一特性在很大程度上提高了可重用性。\n\
  \n## 6. 组合 / 聚合\n对象可能由其他对象组成。这样的对象被称为组合对象（Composite）或聚合对象（Aggregate）。例如，如果将 `vehicle`\
  \ 类的对象定义为由 `Engine`、`Body`、`Axle`、`Seats` 等对象组成的组合对象，这是合适的。\n\n## 继承与组合\n从现有类派生新类有两种基本机制：继承和组合。`Bus`\
  \ 类可以通过继承 `vehicle` 类的属性来派生。在这里，`Bus` 是一种车辆，除了所有车辆共有的属性和行为外，它还有一些额外的属性/行为。\n\n换句话说，`Bus`\
  \ 类与 `vehicle` 类之间存在是（is-a）关系，因为我们可以说 `Bus` 是一辆车辆。\n\n`vehicle` 类本身可能通过组合从许多其他类派生。例如，一个\
  \ `vehicle` 类的对象可能由属于 `Engine`、`Gear Box`、`Seats`、`Driver’s Seat Body` 和 `Steering\
  \ Wheel` 等类的对象组成。\n\n\n\n\n\n在这种情况下，派生类与表示组合对象部分的类具有“整体与部分”的关系。我们不能说 `vehicle` 是一个\
  \ `Engine` 或 `Vehicle` 是一个 `Gear Box`，因为 `Vehicle` 是由许多部分组成的。\n\n## 超类与子类\n\n通常，一个类的对象也是另一个类的对象（即“是一个”关系）。`rectangle`\
  \ 无疑是一个 `quadilateral`（`squares`、`parallelograms` 和 `trapezoids` 也是如此）。因此，可以说 `Rectangle`\
  \ 类继承自 `Quadrilateral` 类。在这种语境下，`Quadrilateral` 类是超类，而 `Rectangle` 类是子类。\n\n`rectangle`\
  \ 是 `quadilateral` 的特定类型，但声称 `quadilateral` 是 `rectangle` 是错误的（`quadilateral` 可能是\
  \ `parallelogram`）。图示展示了超类和潜在子类的几个简单继承示例。继承通常会产生比其超类更多特征的子类，因此超类和子类这两个术语可能会引起混淆。\n\
  \n然而，还有另一种看待这些术语的方法，它是完全合理的。因为每个子类对象都是其超类的对象，而且一个超类可以有许多子类，所以超类所表示的对象集通常比该超类的任何一个子类所表示的对象集大。\n\
  \n例如，超类 `Vehicle` 以通的方式表示所有车辆，如 `cars`、`trucks`、`boats`、`bicycles` 等。然而，子类 `Car`\
  \ 仅代表了世界上所有 `Vehicles` 中的一小部分。继承关系形成了树状的分级结构。\n\n超类与其子类之间存在层级关系。一个类当然可以独立存在，但只有当类被用于继承机制时，它才成为为其他类提供属性和行为的超类，或者成为继承这些属性和行为的子类。经常，一个类既是子类也是超类。\n\
  \n| 超类 | 子类 |\n| :--- | :--- |\n| Student | 研究生、本科生 |\n| Shape | 圆形、三角形、矩形 |\n|\
  \ Loan | 汽车贷款、房贷贷款、教育贷款 |\n| Employee | 教师职员工、行政职员工 |\n| Account | 支票账户、储蓄账户 |\n\
  \n![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章\n\n# ∞ 8 ∞\n\n# (包)\n\n## 引言\n\n当我们编写一个项目时，我们必须将程序拆分成几个类。为了组织这些类，我们使用\
  \ `Packages`（包）。包既是一种命名机制，也是一种可见性控制机制。包是相互关联的类和接口的集合。在包的帮助下，只要它们定义在不同的包中，就可以给多个类赋予相同的名称。\n\
  \n单个包不能包含两个同名的类。\n\n`PROGRAMS` 被组织为包的集合。每个包都有自己的一组子包，这有助于防止命名冲突。顶层包只有在被声明为 `public`\
  \ 时才能在包外部访问。包的命名结构是分级化的。包的成员是类类型、接口类型和子包。`java` 中的包是一种封装机制，可以用于分组相关的类、接口和子包。\n\n\
  对于小型程序，包可以是未命名的或具有简单的名称，但如果代码要广泛发布，则应该选择唯一的包名。\n\n这可以防止冲突——如果两个开发小组恰好选择了相同的包名，并且这些包后来被用于同一个程序，就会发生冲突。如果我们没有为\
  \ `java` 类指定包，那么该类将是 Java 默认包的一部分，称为未命名包。但这要求每个类都必须有唯一的名称以避免冲突。\n\n未命名包的示例。\n\n\
  ```java\nclass A\n{\n- - - - - - -\n- - - - - - - -\n}\n\nclass A_demo\n{\n    public\
  \ static void main(String args[])\n    {\n- - - - - - -\n- - - - - - - -\n    }\n\
  }\n```\n\n## 如何定义包\n\n要创建一个包，请将 `package` 命令作为 Java 源文件中的第一条语句。在该文件中声明的任何类都属于指定的包。`package`\
  \ 语句定义了存储类的命名空间。如果我们省略了 `package` 语句，类名将被放入默认包中，该包没有名称，称为未命名包。\n\n`package` 语句具有以下语法：\n\
  \n```java\npackage package_name;\n```\n\nJava 使用文件系统目录来存储包。记住大小是敏感的，目录名必须与包名完全匹配。多个文件可以包含相同的\
  \ `package` 语句。\n\n语法：\n\n```java\npackage p1;    //包声明\n\nclass A      //类声明\n\
  {\n- - - - - - -  //类 A 体\n- - - - - - -\n}\n```\n\n`package` 是一个关键字。`p1` 是类 `A`\
  \ 要存储的包名。\n\n### 示例 8.1:\n\n```java\n1.  package p1;\n2.  class A\n3.    {\n4. \
  \   public static void main(String args[])\n5.      {\n6.        System.out.println(\"\
  First package.\");\n7.      }\n8.    }\n```\n\n我们假设当前文件夹是 `c:\\javrg\\p1>`。\n\n\
  ```bash\nC:\\javrg\\p1>javac A.java\nC:\\javrg\\p1>java A\n```\n输出：\nFirst package.\n\
  \n注意：如果我们使用 `-d c:\\javrg` 编译上述代码，将自动创建 `p1` 文件夹并将 `.class` 文件放入其中。\n\n```bash\n\
  C:\\javrg>javac -d c:\\javrg A.java\nC:\\javrg>java p1.A\n```\n\n 导入包\n\n内置类都存储在命名包中。由于类必须全限定路径，为每个类输入长路径可能会很麻烦。`import`\
  \ 语句可以将某些类或整个包引入作用域，只需使用其名称直接引用。`import` 语句紧随 `package` 语句（在任何类定义之前）。`import` 语句的通用形式：\n\
  \n```java\nimport p1.classname;\nimport p1.*;\n```\n\n### 示例 8.2:\n\n```java\n1.\
  \ //使用包类打印 10 个随机数\n2. 不使用 import 语句\n3. class RandomTest1\n4. {\n5.   public static\
  \ void main(String args[])\n6.   {\n7.     java.util.Random r1 = new java.util.Random();\n\
  8.     for(int i=1;i<=10;i++)\n9.     {\n10.      System.out.println(Math.abs(r1.nextInt()));\n\
  11.    }\n12.   }\n13. }\n```\n\n### 示例 8.3:\n\n```java\n1. //使用包类打印 10 个随机数\n2.\
  \ 使用 import 语句\n3. import java.util.Random;\n4. class RandomTest2\n5. {\n6.   public\
  \ static void main(String args[])\n7.   {\n8.     Random r1 = new Random();\n9.\
  \     for(int i=1;i<=10;i++)\n10.    {\n11.      System.out.println(Math.abs(r1.nextInt()));\n\
  12.    }\n13.   }\n14. }\n```\n\n\n\n\n如果我们从当前文件夹以外的任何其他文件夹运行上述程序，它将无法运行。默认情况下，Java\
  \ 运行时系统使用当前工作目录作为起点。\n\n因此，如果我们的包（package）在当前目录或当前目录的子目录中，它将能找到。但要从任何其他文件夹运行上述程序，我们必须在命令提示符上使用\
  \ `SET CLASSPATH=.;C:\\JAVAPRG` 命令来设置类路径。`CLASSPATH` 是一个环境变量。我们每次第一次启动电脑时都必须输入此命令。但如果我们把此命令放在`我的电脑\
  \ ➔ 属性 ➔ 高级系统 ➔ 环境变量`中，那么就不需要再反复输入此命令了。\n\n我们也可以在不设置 `CLASSPATH` 环境变量的情况下运行程序。这样做请输入：\n\
  \n```\njava –classpath c:\\javaprg p1.A\n```\n\n### 包的分级结构\n\n注意 4:-我们可以创建包的层级结构。要这样做，只需用点（`.`)将每个包名与其上一个包隔开。多级包语句的通用形式为：\n\
  \n```\npackage package_name1[.package_name2][.package_name3];\n```\n\n包层级结构必须在 Java\
  \ 开发系统的文件系统中反映。例如，包 `java.awt.Image` 需要存储在 `java\\awt\\image`（WINDOWS）或 `java/awt/image`（UNIX）或\
  \ `java:swt:image`（MACINTOSH）文件系统中。\n\n包层级结构代表了 Java 类和接口的组织方式。它并不代表类和接口的源代码组织。\n\
  \n每个 Java 源文件（也称为编译单元）可以包含零或多个类和接口的定义，但编译器会为其中的每一个生成一个包含 Java 字节码的单独类文件。类或接口可以使用包声明来指示其\
  \ Java 字节码被放在特定的包中。\n\n* `java` 包拥有子包 `awt`、`applet`、`io`、`lang`、`net` 和 `util`，但没有类或接口。\n\
  * `java.awt` 包有一个名为 `image` 的子包以及许多类和接口。\n* 因为 `java.awt` 包有一个子包 `image`，因此它不能包含名为\
  \ `image` 的类或接口类型的声明。\n* 如果一个包的全限定名为 `P`，且 `Q` 是 `P` 的子包，那么 `P.Q` 就是该子包的全限定名。\n\
  * 如果有一个名为 `mouse` 的包，且该包中有一个成员类 `Button`（这可能被称为 `mouse.Button`），那么不能存在任何全限定名为 `mouse.Button`\
  \ 或 `mouse.Button.Click` 的包。\n* 一个源文件中最多可以出现一个包语句，且它必须是 Java 源文件的第一个语句。\n\n### 类成员的可见性\n\
  \n类和包都是封装和包含变量及方法命名空间及作用域的手段。包作为类及其他从属包的容器。类作为数据和方法代码的容器。\n\n类是 Java 最小的抽象单元。由于类和包之间的相互作用，Java\
  \ 处理了类成员的五类可见性。\n\n1. 类内部的可见性。\n2. 同一包中子类中的可见性。\n3. 同一包中非子类的可见性。\n4. 不同包中子类中的可见性。\n\
  5. 既不在同一包中也不是子类的子类中的可见性。\n\n注意 1:-顶层类和接口只有两种可能的访问权限：默认（default）和 `public`。\n注意 2:-如果类被声明为\
  \ `public`，则可以通过其他代码访问。\n注意 3:-如果类具有默认访问权限，则只能由同一包内的其他代码访问。\n注意 4:-只有当类可见时成员可见性才有意义。如果类的可见性修饰符为默认，即使是类的\
  \ `public` 成员也只在包内可见。\n\n### 访问修饰符：\n\n![image](img/image085.png)\n\n### JAR 文件（Java\
  \ Archive 文件）\n\n为了压缩文件，我们使用诸如 `winzip` 等程序，Java 的 `JAR` 功能也可以用于压缩整个 Java 包的层级结构。它为安装提供了更好的便利。\n\
  \n不需要在客户位置创建文件结构。我们只需要使用 `JAR` 文件，该文件将恢复整个文件结构。所有的包、子包和类文件都将从 `JAR` 文件自动创建。\n\n\
  JAR 技术让软件的交付和安装变得容易。此外，`JAR` 文件中的元素是压缩的，这使得下载一个 `JAR` 文件比单独下载几个未压缩的文件快得多。这允许消费者确定这些元素是由特定的组织或个人产生的。\n\
  \n`JAR` 文件有以下可用选项：\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `c` | 创建一个新的归档。 |\n| `C` |\
  \ 在命令执行期间更改目录。 |\n| `f` | 文件列表的第一个元素是要创建的归档名称。 |\n| `i` | 应提供索引信息。 |\n| `m` | 文件列表的第二个元素是外部清单文件（manifest）的名称。\
  \ |\n| `M` | 不清单文件 |\n| `t` | 应列出归档内容。 |\n| `u` | 更新现有的 `JAR` 文件。 |\n| `v` | 提供详细输出。\
  \ |\n| `x` | 从归档提取文件。 |\n| `o` | 不使用压缩。 |\n\n#### 创建 JAR 文件：\n\n```\njar -cf Myjar.jar\
  \ pack1\n```\n这将创建一个名为 Myjar 的包含 `pack1` 中所有文件的 JAR 文件。\n\n#### 提取 JAR 文件：\n\n```\n\
  jar -xf Myjar.jar\n```\n此命令用于提取 JAR 文件（如解压）。\n\n#### 列出 JAR 文件内容：\n\n```\njar -tf\
  \ Myjar.jar\n```\n该命令将列出 Myjar.jar 的内容。\n\n#### 更新现有的 JAR 文件：\n\n```\njar -uf Myjar.jar\
  \ pack1\n```\n该命令用于更新 JAR 文件。\n\n#### 创建可执行 JAR 文件：\n\n```\njar -cmf mainClass Myjar.jar\
  \ pack1\n```\n其中 `mainClass` 是一个包含 `Main-Class: pack1.A` 的文本文件，保存在 `javaprg` 文件夹中。\n\
  \n#### 执行 JAR 文件：\n\n```\njava -jar Myjar.jar\n```\n\n### 题：\n\n1. 我们对包（package）有什么理解？\n\
  2. 解释所有的修饰符及其在不同包、子包、子类和其他类中的作用域。\n3. `JAR` 文件有什么用？\n4. `import` 语句有什么用？\n\n![O:\\\
