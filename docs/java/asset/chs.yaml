  8.     sum+=a[i];\n9.     System.out.println(\"Sum of numbers is \" + sum);\n10.\
  \    }\n11. }\n```\n输出：`Sum of numbers is 110`\n\n#### 示例 4.3 使用选择排序排序数组。\n```java\n\
