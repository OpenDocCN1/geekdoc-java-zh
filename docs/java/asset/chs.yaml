  \ `Edit` 命令，而是使用 `Notepad`。在输入完 Java 程序后，在另存为对话框中选择“所有文件”，然后将其保存到文件夹 `C:\\JAVAPRG`\
  \ 中。编译和运行仍需遵循上述步骤。\n\n## Java 程序语法\n\n```java\nclass <class name>\n{\n    public\
  \ static void main(String args[]) or (String [] args)\n    {\n        // ...\n \
  \   }\n}\n```\n\n## 第一个 Java 程序 - 两个数字相加程序 (Sum.Java)\n\n```java\nclass Sum\n{\n\
  \    public static void main(String args[])\n    {\n        int a,b,sum;\n     \
  \   a = 5;\n        b = 6;\n        sum = a + b;\n        System.out.print(\"Sum\
  \ is \" + sum); //输出\n    }\n}\n```\n**输出**: `Sum is 11.`\n\n## 示例 1.2 交换两个数字程序\
  \ (Swap.Java)\n\n```java\nclass Swap\n{\n    public static void main(String args[])\n\
  \    {\n        int a=5,b=7;\n        int t = a;\n        a = b;\n        b = t;\n\
  \        System.out.print(\"After Swap are \" + a + \",\" + b);\n    }\n}\n```\n\
  **输出**: `After Swap are 7,5`\n\n## 注释\n\n注释有三种：\n- 单行注释：`//`\n- 多行注释：`/* */`\n-\
  \ 文档注释：`/** */`\n\n- 每个 Java 程序必须包含一个类。\n- `main()` 方法只能定义在类内部。\n- 源文件可以包含任意数量的类和接口定义，但最多只能有一个公共类。\n\
  - 源文件可以不包含 `main()` 方法的类，但独立的 Java 程序始终从 `main()` 方法开始执行。因此，我们想要开始执行的类必须包含 `main()`\
  \ 方法。\n- `main()` 方法始终具有以下签名：`public static void main(String args[])`\n\n**注意**:\
  \ 方法原型称为签名。\n\n- `public` 关键字表示可以在任何地方访问。\n- `static` 关键字表示无需创建对象即可调用。\n- `void`\
  \ 关键字表示返回任何值。\n- `main()` 方法接收一个参数，即 `String` 数组。\n- `System` 是一个预定义类，提供系统访问，`out`\
  \ 是连接到控制台的输出流。\n- `print()` 方法可用于显示任何信息。\n\n\n\n\n\n当一个 Java 对象不再被使用时，它会被垃圾回收器收集，即为对象分配的内存被添加到空闲内存的\
  \ `pool/heap` 中并可以重用。这在很大程度上简化了程序员的任务。这还消除了许多由于不当使用指针算术和内存管理功能（如手动释放内存）引起的错误。\n\n\
