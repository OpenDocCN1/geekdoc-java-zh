  ### 裁剪 (Clipping)\n\n程序员对图形上下文进行的大多数调用涉及颜色选择或绘制和填充。不常用的操作是裁剪。裁剪简单地限制图形上下文可以修改的区域。每个图形上下文，即每个\
  \ `graphics` 类的实例都有一个裁剪区域，它定义了关联组件的全部或部分。当我们调用 `graphics` 类的某个 `drawXXX()` 或 `fillXXX()`\
  \ 方法时，只有位于图形上下文裁剪区域内的像素会被修改。\n\n图形上下文的默认裁剪区域是关联组件的可见区域。有一些方法可以获取和修改裁剪区域。考虑以下 paint\
  \ 方法。\n\n### 示例 19.4\n\n```java\nimport java.awt.*;\nclass Clip extends Frame {\n\
  \    public static void main(String args[]) { \n      Frame f=new Clip();\n    \
  \  f.setSize(300,330);\n      f.setVisible(true);\n    }\n    public void paint(Graphics\
  \ g) { \n      for(int i=0; i<300; i=i+100) {\n        for(int j=30; j<330; j=j+100)\
  \ { \n          g.fillOval(i,j,100,100);\n        }\n      }\n    }\n}\n```\n输出：\n\
  ![images/image47.png)\n\n上述程序的 `paint()` 方法绘制了一个点图案。考虑当这是一个 200*200 像素的 applet frame\
  \ 的 `paint()` 方法时会发生什么。由于循环计数器一直到 500，方法尝试在 applet 边界之外绘制。\n\n这不是问题，因为图形上下文默认的裁剪区域与\
  \ applet 本身一致。\n\n要为图形上下文设置矩形裁剪区域，我们可以调用 `setClip(x,y, width, height)` 方法，传入描述所需裁剪矩形位置和大小四个\
  \ int。例如，上述代码可以修改为：\n\n### 示例 19.5\n\n```java\nimport java.awt.*;\nclass Clip2 extends\
  \ Frame {\n    public static void main(String args[]) { \n      Frame f=new Clip2();\n\
  \      f.setSize(300,330);\n      f.setVisible(true);\n    }\n    public void paint(Graphics\
  \ g) { \n      g.setClip(50,80,200,200);\n      for(int i=0; i<300; i=i+100) {\n\
  \        for(int j=30; j<330; j=j+100) { \n          g.fillOval(i,j,100,100);\n\
  \        }\n      } \n      g.drawString (\"Hello! Kamal\", 50,50);\n    }\n}\n\
  ```\n\n\n\n\n\n```java\n21.    g.drawString (\"Bye! Kamal\", 120,150);\n22.    }\
  \ }\n```\n\nOutput:\n\n![image](img/image040.png)\n\n如所示，现在绘制内容被限制在 300 * 300 applet\
  \ 帧中心的一个 200 * 200 矩形内。\n\n裁剪（Clipping）本身是一个非常值得了解的概念。当环境需要修复组件暴露出的部分时，裁剪也会发挥作用。\n\
  \n### 关于 `paint()` 方法和图形上下文（graphics context）的总结：\n\n`Graphics` 上下文是专属于单个组件的。要在组件上进行绘制，我们调用图形上下文的\
  \ `drawXXXX()` 和 `fillXXXX()` 方法。若要更改图形操作的颜色或字体，我们分别调用图形上下文的 `setColor()` 或 `setFont()`\
  \ 方法。\n\n### GUI 线程与绘制\n\nJava 运行时环境会创建并控制其在后台运行的各个线程，其中一个线程负责 GUI 管理。\n\nGUI 线程是环境用于接收用户输入事件以及调用需要绘制的组件的\
  \ `paint()` 方法的工具。\n\n对 `paint()` 的调用并不完全由环境生成。Java 程序当然可以自己调用，可以通过直接调用，也可以通过 `repaint()`\
  \ 方法间接调用。\n\n也可以使用其图形上下文在组件上进行绘制。这种方法不需要调用 `paint()` 或 `repaint()` 方法。\n\n在组件上绘制的不同方法如下：\n\
  \n(i) 获取组件的 `Graphics` 上下文后直接绘制。\n(ii) 自发绘制（由 GUI 线程隐式/自动调用 `paint()` 方法）。\n(iii)\
  \ 显式调用 `paint()` 方法。\n(iv) 显式调用 `repaint()` 方法，随后其间接调用 `paint()` 方法。\n\n### 在获取组件的图形上下文后直接绘制\n\
  \n由于可以使用 `getGraphics()` 方法获取组件 `Graphics` 上下文的引用，人们很容易认为可以从任何方便的方法直接向组件绘图。通常情况下，这种方法存在严重的缺陷。\n\
  \n假设我们有一个 applet，想要在最近一次鼠标点击的位置画一个红点。applet 的其余部分应该是黄色的。假设该 applet 正在处理自己的鼠标事件。我们可能会考虑创建这样一个事件处理器：\n\
  \n**示例 19.6：**\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass PaintApproach\
  \ extends Frame implements MouseListener\n{\n    public static void main (String\
  \ args []) {\n      PaintApproach f = new PaintApproach ();\n      f.setSize (300,300);\n\
  \      f.addMouseListener(f);\n      f.setVisible(true);\n    }\n    public void\
  \ mouseEntered (MouseEvent e) { }\n    public void mouseExited (MouseEvent e) {\
  \ }\n    public void mousePressed (MouseEvent e) { }\n    public void mouseReleased\
  \ (MouseEvent e) { }\n    public void mouseClicked (MouseEvent e) {\n      System.out.println\
  \ (\"Mouse Clicked...\");\n      Graphics g = getGraphics ();\n      g.setColor(Color.yellow);\n\
  \      g.fillRect(0,0, getSize().width, getSize().height);\n      g.setColor (Color.Red);\n\
  \      g.fillOval(e.getX()-10, e.getY()-10,20,20);\n    }\n}\n```\n\n如果这个 applet\
  \ 曾经被覆盖并暴露，GUI 线程将隐式地调用 `paint()`，遗憾的是，`paint()` 并不知道在 `mouseClicked()` 方法中绘制的那个红圈，因此红圈不会被修复。\n\
  \n所有绘制操作的正确位置应该在 `paint()` 中，或者在从 `paint()` 出的方法中；这种技术确保了 GUI 线程能够修复暴露带来的损坏。GUI\
  \ 线程期望 `paint()` 能够在任意时刻正确地重建屏幕。\n\n实现这一点的的一种可能方法是从事件处理器和其他其他任意方法中移除所有绘制代码，并将这些代码放入\
  \ `paint()` 方法中。\n\n接下来，当某个方法需要绘制时，安排它写入描述所需绘图内容的变量，这样这些变量就可以被 `paint()` 方法访问，并可以被\
  \ `paint()` 方法用于执行绘制。\n\n现在，当 `paint()` 方法被调用时（无论是通过我们的通用方法，还是通过 GUI 线程），它都可以绘制出最初想要的内容。\n\
  \n### 自发绘制（由 GUI 线程隐式/自动调用 `paint()` 方法）\n\n“自发绘制”并不是一个正式术语，但它被使用了。例如，当 GUI 线程调用\
  \ `paint()` 方法时就会发生自发绘制：\n\n*   暴露（Exposure）。\n*   最小化还原（De-min）。\n*   首次显示。\n*\
  \   组件被覆盖后再次从最小化。\n\n### 显式调用 `paint()` 方法\n\n这发生在我们显式调用 `paint()` 方法时。例如，上一个示例中的\
  \ `mouseClicked()` 方法被重写，使得每当鼠标点击发生时，它只需修改实例变量 `mouseX` 和 `mouseY`。组件得到了修复。\n\n\
  **示例 19.7：**\n\n上一节的示例经过修改，使得组件在这些情况下会刷新，因为红点是在 `paint()` 方法中绘制的。\n\n```java\nimport\
  \ java.awt.*;\nimport java.awt.event.*;\nclass PaintApproach1 extends Frame implements\
  \ MouseListener\n{\n    int mouseX, mouseY;\n    public static void main (String\
  \ arg[]) {\n      PaintApproach1 f = new PaintApproach1 ();\n      f.setSize (300,300);\n\
  \      f.addMouseListener(f);\n      f.setVisible(true);\n    }\n    public void\
  \ mouseEntered (MouseEvent e) { }\n    public void mouseExited (MouseEvent e) {\
  \ }\n    public void mousePressed (MouseEvent e) { }\n    public void mouseReleased\
  \ (MouseEvent e) { }\n    public void mouseClicked (MouseEvent e) {\n      System.out.println\
  \ (\"Mouse Clicked...\");\n      mouseX = e.getX();\n      mouseY = e.getY();\n\
  \      Graphics g = getGraphics ();\n      paint(g);\n    }\n    public void paint(Graphics\
  \ g) {\n      g.setColor(Color.yellow);\n      g.fillRect(0,0, getSize().width,\
  \ getSize().height);\n      g.setColor(Color.Red);\n      g.fillOval(mouseX-10,\
  \ mouseY-10,20,20);\n    }\n}\n```\n\n\n\n\n\n```java\npublic void paint (Graphics\
  \ g)\n{\n  g.setColor (Color.yellow);\n  g.fillRect(0,0, getSize().width, getSize().height);\n\
  \  g.setColor(Color.red);\n  g.fillOval(mouseX–10,mouseY–10,20,20);\n}\n```\n\n\
  ### 显式调用 `repaint()` 方法\n\n显式调用 `repaint()` 方法会间间接调用 `paint()` 方法：\n\n显式调用 `paint()`\
  \ 方法可能会导致两个严重的问题。\n\n第一个问题是 GUI 线程会根据需要随时调用 `paint()` 方法。这发生在需要处理窗口暴露（exposure）时。这可能会导致线程交互问题。公平地说，我们将发现，即使使用优选的方法，可能仍然需要处理这些问题中的某些，因为\
  \ `paint()` 方法将使用我们在其他线程中正在修改的数据。然而，如果我们允许 `paint()` 只在 GUI 线程中被调用，就能最大限度地减少这个问题。\n\
  \n第二个问题是 CPU 使用率问题。考虑以下场景：我们的程序定期收到通知，要求它用动画的下一帧或类似的连续移动图形来更新显示。假设绘图是复杂且耗时的。如果我们简单地调用整个\
  \ `paint()` 方法，那么在帧触发发生时，我们可能只完成了绘图的一部分。这将导致我们的程序花费或尝试花费所有时间在绘图上。此外，绘图将越来越后于它的进度。\n\
  \n这些问题可以通过使用处理程序启动绘图的优选方法简单地解决。该思想是主程序维护一个描述应该呈现给用户的绘图的数据集，但不直接调用绘图程序。相反，程序请求 GUI\
  \ 线程运行绘图程序，这与线程在处理暴露时的方式大致相同。\n\nGUI 线程使用主程序提供的数据集来决定画什么以及如何画。\n\n为了支持这种方法，GUI 系统提供了一个名为\
  \ `repaint()`的方法。该方法定义在 `Component` 类中，因此 GUI 中的任何可见对象都可以使用。当我们调用此方法时，我们是在向 GUI\
  \ 线程发出请求，让它执行绘制系统程序。GUI 线程会在合理的时间范围内执行该操作，尽管这可能会受到其他高优先级线程活动的限制。这种方法确保了 GUI 线程与用户线程之间的线程交互降到最低。\n\
  \n当然，我们必须确保当数据处于不一致状态时，GUI 线程绝不会使用该数据集。然而，使用同步或双缓冲技术可以很容易地实现这一点。\n\n这种行为的另一个结果是，无论程序尝试进行多少绘图，系统通常与当前帧保持同步。这是因为例如，如果我们在\
  \ GUI 线程能够处理第一次调用之前，调用了十次 `repaint()` 方法，那么结果将是执行一次绘图系统程序。因此，在过载的情况下，绘图系统会跳过宿主机简单无法处理的帧。这意味着程序员可以编写出在给定平台上获得最佳可用性能，但在任何平台上运行得都尚可良好的代码。下面的代码实现了这种方案。\n\
  \n#### 示例 1.8\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\npublic class\
  \ PaintApproach2 extends Frame implements MouseListener\n{\n  int mouseX, mouseY;\n\
  \  public static void main (String args [])\n  {\n    PaintApproach2 f = new PaintApproach2();\n\
  \    f.setSize(300,300);\n    f.addMouseListener(f);\n    f.setVisible(true);\n\
  \  }\n  public void mouseEntered (MouseEvent e) {}\n  public void mouseExited (MouseEvent\
  \ e) {}\n  public void mousePressed (MouseEvent e) {}\n  public void mouseReleased\
  \ (MouseEvent e) {}\n  public void mouseClicked(MouseEvent e)\n  {\n    System.out.println\
  \ (\"Mouse Clicked ...\");\n    mouseX = e.getX();\n    mouseY = e.getY();\n   \
  \ repaint();\n  }\n  public void paint (Graphics g)\n  {\n    g.setColor (Color.white);\n\
  \    g.fillRect(0,0,getSize().width, getSize().height);\n    g.setColor (Color.gray);\n\
  \    g.fillOval(mouseX–10, mouseY–10,20,20);\n  }\n}\n```\n\n注意 `repaint()` 调用取代了对绘图的直接处理。现在，无论事件处理程序调用的多频繁，对\
  \ `paint()` 的调用都不会超过系统的绘图能力，程序也不会落后。之前的代码展示了程序启动绘图的优选方法的本质。主程序将信息存储在实例变量中，然后调用 `repaint()`\
  \ 方法。`repaint()` 方法请求 GUI 线程绘制屏幕。GUI 线程使用 `paint()` 方法进行绘图，该方法应该根据实例变量中的信息执行绘图。\n\
  \n这种方法的优点是：\n- 当环境自发调用 `paint()` 时，屏幕会得到正确修复。\n- 尝试绘图的前景线程与 GUI 线程之间的线程交互是受控且可预测的。\n\
  - 虚拟机永远不会被绘图压垮。\n- 当所有代码都这样编写时，对于试图调试代码的其他程序员来说，将没有任何惊喜。\n\n### 平滑动画\n\n重绘机制默认行为中我们可能并不总是需要的特性是：系统在准备响应我们对\
  \ `repaint()` 调用的过程中会清空我们的绘图区域。这可能导致动画和其他实时绘图产生不快的闪烁。事实证明，当我们调用 `repaint()` 时，GUI\
  \ 线程并不调用 `paint()`；相反它调用 `update()` 方法。`update()` 的默认行为是执行两件事：清除背景然后调用 `paint`。如下：\n\
  \n```java\npublic void update (Graphics g)\n{\n  g.clearRect (0,0,width, height);\n\
  \  paint(g);\n}\n```\n\n我们可能会合理地问，为什么 `repaint()` 一开始就要清除窗口，如果这会导致闪烁。嗯，在许多情况下，绘图是在背景上使用线条、矩形、椭圆等完成的。如果我们尝试制作一根旋转的杆，我们需要在绘制新线之前移除旧线。考虑此问题的另一种方式是，认为当我们尝试绘制新图形时，我们应该先擦除旧的。\n\
  \n那么，我们如何在不先清除整个显示器的情况下让新图形出现呢？我们只需要找到另一种移除旧图的方法。通方法是确保我们在每次绘制帧时都绘制整个绘图——包括背景和前景。如果我们能安排好，就不需要清除组件，闪烁就会消失。\n\
  \n为了防止组件在调用 `paint()` 之前清除，我们只需重写 `update()` 方法使其直接调用 `paint`，如下所示：\n\n```java\n\
  public void update (Graphics g)\n{\n  paint (g);\n}\n```\n\n这是一项标准技术并且运行完美，前提是我们的\
  \ `paint()` 方法确实刷新了显示器所有的像素。处理这种情况的一种特别简单的方法是在速度或内存方面并不总是最高效的，但它简单易实现，且 Java 程序员通常都能理解。这种方法是使用一个离屏图像来存储应该显示在显示器上的绘图。\n\
