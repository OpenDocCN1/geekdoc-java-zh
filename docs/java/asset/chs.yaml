  28.    System.out.println(a[i]);\n29.   }\n30. }\n```\n\n### 2. 二维数组-\n\n#### 声明\n\
  `type array_name[][]`\n或\n`type[][] array_name;`\n\n#### 内存分配\n`array_name = new\
