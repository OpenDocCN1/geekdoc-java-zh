  \n`TextField` 和 `TextArea` 类实现了用于文本输入、显示和编辑的一维和二维组件。这两个类都继承自 `TextComponent` 超父类。\n\
  \n`Object` -> `Component` -> `TextComponent` -> (`TextField, TextArea)`\n\n这两个类（`TextField`\
  \ 和 `TextArea`）都有多种构造函数，提供了指定或不指定初始字符串或首选尺寸的。未指定首选尺寸的构造函数适用于布局管理器将忽略组件首选尺寸的情况。\n\
  \n#### TextField 类的构造函数\n\n`TextField()`\n构造一个新的文本字段。\n\n`TextField(int columns)`\n\
  构造一个具有指定列数的文本字段。\n\n`TextField(String text)`\n构造一个带有指定文本的文本字段。\n\n`TextField(String\
  \ text, int columns)`\n构造一个具有指定文本和指定列数的文本字段。\n\n#### TextArea 类的构造函数\n\n`TextArea()`\n\
  构造一个新的文本区域。\n\n`TextArea(int rows, int columns)`\n构造一个具有指定行数和指定列数的文本区域。\n\n`TextArea(String\
  \ text)`\n构造一个带有指定文本的文本区域。\n\n`TextArea(int rows, int columns, String text)`\n构造一个具有指定行数、列数和指定文本的文本区域。\n\
  \n`TextArea(int rows, int columns, String text, int scrollbar)`\n构造一个具有指定行数、指定列数、指定文本和指定滚动条策略的文本区域。\n\
  \n`TextArea` 类定义了一些可以作为 `scrollbar` 参数提供的常量：\n`SCROLLBARS_BOTH`、`SCROLLBARS_VERTICAL_ONLY`、`SCROLLBARS_HORIZONTAL_ONLY`、`SCROLLBARS_NONE`。\n\
  \n#### TextField 类的方法\n\n`String selectText()`\n获取组件中的选中文本。\n\n`String getText()`\n\
  获取组件显示的文本。\n\n`void setEditable(boolean b)`\n设置此组件是否可编辑。\n\n`void setText(String\
  \ t)`\n将组件显示的文本设置为指定的文本。\n\n### 示例 17\n\n```java\nimport java.awt.*;\nclass TextFieldTest\n\
  {\n    public static void main(String args[])\n    {\n      Frame f=new Frame();\n\
