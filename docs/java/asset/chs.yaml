  \n## 静态 final 变量:\n`final` 静态变量通常用于定义命名常量，例如 `Integer.MAX_VALUE`，它是 int 的最大值。\n\n\
  ## final 方法:-\nfinal 方法是完整的（即有实现），并且不能在子类中重写。因此，子类在更改行为方面遭了限制。\n\n*   编译器能够对 final\
  \ 方法执行某些优化，因为对此类成员可以做出某些假设。\n*   当调用非静态方法时，运行时系统确定对象的实际类，将方法绑定到正确的实现上，然后调用它。\n*\
  \   对于 final 方法，我们确定子类不能重写，因此绑定是在编译时完成的。\n*   对于 final 方法，编译器可能会像宏一样将调用替换为方法的实际主体。这种机制被称为内联（inlining）。在\
  \ C++ 中，我们有选项将函数声明为 `inline`（尽管最终决定由编译器做出），但在 Java 中，由编译器做决定。\n\n## abstract 修饰符:-\n\
  `abstract` 修饰符只能用于实例方法。抽象方法没有实现，即抽象方法没有方法体，仅在类定义中提供方法原型。\n\n它的类也是抽象的（即不完整的），并且必须显式声明为\
  \ `abstract`。抽象类的子类必须提供方法实现，否则它们也是抽象的。\n\n*   抽象方法不能声明为 `private`。这是显而易见的，因为我们不能重写私有方法，而在抽象方法的情况下，方法体总是通过重写在子类提供的。\n\
  *   只有实例方法可以声明为抽象的，因为静态方法不能被重写，声明抽象静态方法没有意义并会导致编译错误。\n*   `final` 方法不能是 `abstract`，反之亦然。\n\
  *   `abstract` 关键字不能与方法的任何非访问性修饰符结合。\n*   接口中指定的方法隐式是抽象的，因为接口中只定义了方法原型。\n\n## synchronized\
  \ 修饰符:-\n`synchronized` 关键字可以用于方法和代码块。多个线程可以在程序中同时执行。它们可能会尝试在同一个对象上同时执行多个方法。如果希望同一时间只有一个线程可以执行对象中的某个方法，可以将这些方法声明为\
  \ `synchronized`。它们的执行在所有线程之间是互斥的。\n\n\n\n\n\n在任何给定时刻，任何特定对象上最多只能有一个线程在执行 `synchronized`\
  \ 方法。此讨论也适用于类的静态同步方法（static synchronized）。\n\n**注意**：`synchronized` 修饰符不适用于类或成员变量。\n\
  \n## native 修饰符\n\n`native` 修饰符只能引用方法。与 `abstract` 关键字一样，`native` 表示方法的体将在其他处找到。`native`\
  \ 方法的体完全位于 JVM 之外，位于一个库中。原生代码是用非 Java 语言编写的（通常是 `C` 或 `C++`），并针对单一目标机器类型进行编译的。因此，Java\
  \ 的平台无关性被破坏了。将 Java 移植到新平台的人员需要实现大量的原生代码，以支持 GUI 组件、网络通信以及广泛的其他特定平台的功能。然而，应用程序程序员和\
  \ Applet 程序员很少需要编写原生代码。\n\n## transient 修饰符\n\n对象可以使用序列化进行存储。序列化将对象转换为便于存储对象的输出格式。稍后可以以序列化时的相同状态检索对象，这意味着序列化中包含的所有字段将具有与序列化时相同的值。在类声明中，可以将某个字段指定为\
  \ `transient`，表示当类的对象被写入持久化存储时，其值不应被保存。对静态变量指定 `transient` 修饰符是多余的，因此不建议这样做。静态变量不是序列化对象的持久化状态的一部分。\n\
  \n```java\nExperiment implements Serializable {\n    transient int currentTemperature;\n\
  \    double mass;\n}\n```\n\n## volatile 修饰符\n\n执行期间，编译后的代码出于效率考虑可能会缓存字段的值。由于多个线程可以访问同一个字段，允许缓存在读取和写入字段值时导致不一致性是非常关重要的。`volatile`\
  \ 修饰符可以用于通知编译器不要对该字段进行优化，否则当字段被多个线程访问时，可能会导致不可预测的结果。\n\n# 第 14 章：包装类 (Wrapper Class)\n\
  \n## 引言\n\nJava 中的原始数据类型不是对象。如果我们想将这些数据类型作为对象使用，我们必须为 `java.lang` 包中提供的每个原始类型使用相应的包装类。许多内置类无法处理原始类型，因为它们只处理对象。其中一个类是\
  \ `Vector`，它用于存储元素集合。我们不能使用 `Vector` 类直接存储原始数据类型的集合，但我们可以通过存储与原始类型对应的包装类对象来实现。Java\
  \ 为每个原始类型都有对应的包装类，如下表所示：\n\n| 原始数据类型 | 包装类 |\n| :--- | :--- |\n| boolean | Boolean\
  \ |\n| char | Character |\n| byte | Byte |\n| short | Short |\n| int | Integer |\n\
  | long | Long |\n| float | Float |\n| double | Double |\n\n## Number 类\n\n抽象类 `Number`\
  \ 定义了一个超类，由包装数值类型 `byte`、`short`、`int`、`long`、`float` 和 `double` 的类实现。`Number` 类具有抽象方法，返回对象在不同数字格式下的值。这些方法是：\n\
  \n- `byteValue()` 将指定的数字作为 `byte` 返回。\n- `shortValue()` 将指定的数字作为 `short` 返回。\n-\
  \ `intValue()` 将指定的数字作为 `int` 返回。\n- `longValue()` 将指定的数字作为 `long` 返回。\n- `floatValue()`\
  \ 将指定的数字作为 `float` 返回。\n- `doubleValue()` 将指定的数字作为 `double` 返回。\n\n**注意**：由 `byteValue()`、`shortValue()`、`intValue()`、`floatValue()`\
  \ 和 `doubleValue()` 方法返回的值涉及舍入或截断。\n\n### 示例 14.1\n\n下面的示例演示了调用 `Number` 类的方法时如何发生舍入和截断。\n\
  \n```java\nclass Wrapper {\n    public static void main(String args[]) {\n     \
  \   Integer iObj = new Integer(128);\n        System.out.println(iObj.byteValue());\
  \ // 截断\n        Long lObj = new Long(12345678912345678L);\n        System.out.println(lObj);\n\
  \        System.out.println(lObj.doubleValue());\n        Float fObj = new Float(3.99f);\n\
  \        System.out.println(fObj.intValue()); // 截断\n    }\n}\n```\n\n**输出：**\n\
  ```\n128\n12345678912345678\n1.2345678912345678E17\n```\n\n## 使用包装类的构造函数将原始数字转换为对象，并将数值对象转换回数字\n\
  \n### 示例 14.2\n\n下面的示例演示了如何将原始类型封装成对象，以及如何将它们转换回原始类型。\n\n```java\nclass Convert\
  \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
  使用构造函数将原始数字转换为对象\"); \n        byte b = 105;\n        Byte bObj = new Byte(b);\n\
  \        System.out.println(bObj); // toString()\n        short s = 2015;\n    \
  \    Short sObj = new Short(s);\n        System.out.println(sObj);\n        int\
  \ i = 32717;\n        Integer iObj = new Integer(i);\n        System.out.println(iObj);\n\
  \        long l = 12345678912345678L;\n        Long lObj = new Long(l);\n      \
  \  System.out.println(lObj);\n        float f = 3.99f;\n        Float fObj = new\
  \ Float(f);\n        System.out.println(fObj);\n        double d = 3.1415;\n   \
  \     Double dObj = new Double(d);\n        System.out.println(dObj);\n        System.out.println(\"\
  转换数值对象\");\n        byte b1 = bObj.byteValue();\n        short s1 = sObj.shortValue();\n\
  \        int i1 = iObj.intValue();\n        long l1 = lObj.longValue();\n      \
  \  float f1 = fObj.floatValue();\n        double d1 = dObj.doubleValue();\n    \
  \    System.out.println(b1);\n        System.out.println(s1);\n        System.out.println(i1);\n\
  \        System.out.println(l1);\n        System.out.println(f1);\n        System.out.println(d1);\n\
  \    }\n}\n```\n\n**输出：**\n```\n使用构造函数将原始数字转换为对象\n105\n2015\n32717\n12345678912345678\n\
  3.99\n3.1415\n转换数值对象\n105\n2015\n32717\n12345678912345678\n3.99\n3.1415\n```\n\n\
  ## 使用包装类的 toString() 静态方法将原始数字转换为字符串\n\n### 示例 14.3\n\n```java\nclass ConvertPrimitiveToString\
  \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
  使用包装类的 toString() 静态方法将原始数字转换为字符串:\");\n        byte b = 105;\n        String str\
  \ = Byte.toString(b);\n        short s = 2015;\n        str = Short.toString(s);\n\
  \        int i = 32717;\n        str = Integer.toString(i);\n        long l = 12345678912345678L;\n\
  \        str = Long.toString(l);\n        float f = 3.1415f;\n        str = Float.toString(f);\n\
  \        double d = 3.1415;\n        str = Double.toString(d);\n        System.out.println(str);\n\
  \    }\n}\n```\n\n\n\n\n\n# 使用相应包装类的 `toString()` 方法将数值对象转换为字符串\n\n## 示例 14.4\n\n\
  ```java\nclass ObjectToStringDemo\n{\n    public static void main(String args[ ])\n\
  \    {\n        System.out.println(\"Converting object numbers to Strings using\"\
  \ +\n        \"toString() method of corresponding wrapper class:\");\n        byte\
  \ b=103;\n        Byte bObj = new Byte(b);\n        String str=bObj.toString();\n\
  \        System.out.println(str);   \n        short s=203;\n        Short sObj=new\
  \ Short(s);\n        str = sObj.toString();\n        System.out.println(str); \n\
  \        Integer iObj = new Integer(32000);\n        str = iObj.toString();\n  \
  \      System.out.println(str);\n        str = new Long(4544444444444l).toString();\n\
  \        System.out.println(str);\n        str = new Float(3.1444f).toString();\n\
  \        System.out.println(str);\n        str = new Double(4.1444).toString();\n\
  \        System.out.println(str);\n    }\n}\n```\n\n**输出:**\n```\nConverting object\
  \ numbers to Strings using toString() method of corresponding wrapper class:\n103\n\
  203\n32000\n4544444444444\n3.1444\n4.1444\n```\n\n## 使用相应包装类的静态 `valueOf()` 方法将字符串对象（数值字符串）转换为数值对象\n\
  \n## 示例 14.5\n\n```java\nclass StringToNumericObjectDemo\n{\n    public static void\
  \ main(String args[])\n    {\n        String str=\"30\";\n        String str2=\"\
  30.333\";\n        Byte bObj=Byte.valueOf(str);\n        System.out.println(bObj);\n\
  \        //Byte bObj1 = new Byte(str2);  //NumberFormatException\n        Short\
  \ sObj = Short.valueOf(str);\n        System.out.println(sObj);\n        Integer\
  \ iObj=Integer.valueOf(str);\n        System.out.println(iObj);\n        Long lObj=Long.valueOf(\"\
  344324232432\");\n        System.out.println(lObj);\n        Float fObj=Float.valueOf(\"\
  3.333\");\n        System.out.println(fObj);\n        Double dObj=Double.valueOf(str2);\n\
  \        System.out.println(dObj);\n    }\n}\n```\n\n**输出:**\n```\n30\n30\n30\n\
  344324232432\n3.33\n30.333\n```\n\n**注：** 如果字符串不包含可解析的数字，所有的 `valueOf()` 方法都会抛出\
  \ `NumberFormatException`。\n\n## 使用相应包装类的构造函数将字符串对象（数值字符串）转换为数值对象\n\n## 示例 14.6\n\
  \n```java\nclass StringToNumericObjectDemo1\n{\n    public static void main(String\
  \ args[])\n    {\n        String str=new String(\"30\");\n        //String str=\"\
  30\";\n        String str2=new String(\"30.333\");\n        Byte bObj = new Byte(str);\n\
  \        System.out.println(bObj);\n        //Byte bObj=new Byte(str2);   //NumberFormatException\n\
  \        Short sObj=new Short(str);\n        System.out.println(sObj);\n       \
  \ Integer iObj=new Integer(str);\n        System.out.println(iObj);\n        Long\
  \ lObj=new Long(str);\n        System.out.println(lObj);\n        Float fObj=new\
  \ Float(str);\n        System.out.println(fObj);\n        Double dObj=new Double(str);\n\
  \        System.out.println(dObj);\n    }\n}\n```\n\n**输出:**\n```\n30\n30\n30\n\
  30\n30.333\n30.333\n```\n\n**注：** 如果字符串不包含可解析的数字，上述构造函数将抛出 `NumberFormatException`。\n\
  \n## 使用相应包装类的解析方法将字符串对象（数值字符串）转换为原始类型数字\n\n## 示例 14.7\n\n```java\nclass StringToPrimitiveDemo\n\
  {\n    public static void main(String args[])\n    {\n        String str = new String(\"\
  30\");\n        //String str=\"30\";\n        String str2= new String(\"30.333\"\
  );\n        byte b = Byte.parseByte(str);\n        System.out.println(b);\n    \
  \    //byte b1=Byte.parseByte(str2);  //NumberFormatException\n        short s =\
  \ Short.parseShort(str);\n        System.out.println(s);\n        int i = Integer.parseInt(str);\n\
  \        System.out.println(i);\n        long l = Long.parseLong(str);\n       \
  \ System.out.println(l);\n        float f = Float.parseFloat(str2);\n        System.out.println(f);\n\
  \        double d = Double.parseDouble(str2);\n        System.out.println(d);\n\
  \    }\n}\n```\n\n**输出:**\n```\n30\n30\n30\n30\n30.333\n30.333\n```\n\n**注：** 如果字符串不包含可解析的数字，`parseXXXXX()`\
  \ 方法将抛出 `NumberFormatException`。\n\n### Double 和 Float 中定义的常量\n- `MAX_VALUE`\n-\
  \ `MIN_VALUE`\n- `NaN`\n- `NEGATIVE_INFINITY`\n- `POSITIVE_INFINITY`\n- `TYPE`（代表原始类型\
  \ double/float 的类实例）\n- `SIZE`（用于表示 double 值的位数）。自 J2SDK 1.5 起\n\n### Float 类中的其他方法\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `static int compare(float f1, float f2)` | 比较指定的两个\
  \ float 值 |\n| `int compareTo(Float anotherFloat)` | 数值上比较两个 Float 对象。 |\n| `boolean\
  \ equals(Object obj)` | 将此对象与指定的对象进行比较 |\n| `int hashCode()` | 返回此 float 对象的哈希码。\
  \ |\n| `boolean isInfinite()` | 如果此 Float 值在绝对值上无穷大，返回 true，否则返回 false。 |\n| `static\
  \ boolean isInfinite(float v)` | 如果指定的数字在绝对值上无穷大，返回 true，否则返回 false。 |\n| `boolean\
  \ isNaN()` | 如果此 Float 值是非数字（NaN），返回 true，否则返回 false。 |\n| `static boolean isNaN(float\
  \ v)` | 如果指定的数字是非数字（NaN），返回 true，否则返回 false。 |\n\n### Double 类中的其他方法\n`Double` 类的方法与\
  \ `Float` 类的方法相似，只是用 `double` 替换了 `float`。\n\n### Byte、Short、Integer 和 Long 中定义的常量\n\
  - `MIN_VALUE`\n- `MAX_VALUE`\n- `TYPE`（代表原始类型 byte/short/int/long 的类实例）\n- `SIZE`（用于表示\
  \ byte/short/int/long 值的补码二进制形式）\n\n### Byte 类中的其他方法\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `int compareTo(Byte anotherByte)` | 数值上比较两个 Byte 对象。 |\n| `static Byte decode(String\
  \ nm)` | 返回一个包含字符串 `nm` 指定的值的 Byte 对象。接受十进制、十六进制和八进制数字，语法如下：`DecodableString`: `[-]\
  \ 十进制`, `[-] 0x 十六进制`, `[-] 0X 十六进制`, `[-] 八进制`, `[-] 0 八进制` |\n| `boolean equals(Object\
  \ obj)` | 将此对象与指定的对象进行比较 |\n| `int hashCode()` | 返回此 Byte 对象的哈希码。 |\n\n### Short\
  \ 类中的其他方法\n`Short` 类的方法与 `Byte` 类的方法相似，只是用 `short` 替换了 `byte`。\n\n### Integer 类中的其他方法\n\
  某些方法与 `Byte` 或 `Short` 类相同。其他方法描述如下：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `static\
  \ String toBinaryString(int i)` | 返回整数作为无符号二进制形式的字符串表示。 |\n| `static String toHexString(int\
  \ i)` | 返回整数作为无符号十六进制形式的字符串表示。 |\n| `static String toOctalString(int i)` | 返回整数作为无符号八进制形式的字符串表示。\
  \ |\n\n### Long 类中的其他方法\n`Long` 类的方法与 `Integer` 类相同。\n\n### Character 类\n`Character`\
  \ 类将原始类型 `char` 值封装在对象中。\n\n### 构造函数\n`Character(char value)`\n创建一个新分配的 `Character`\
  \ 对象，其表示指定的 `char` 值。\n示例：`Character chObj = new Character('A');`\n\n### 方法\n`Character`\
  \ 类的一些方法下表所示：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `char charValue()` | 返回此 `Character`\
  \ 对象的值。 |\n| `static boolean isDefined(char ch)` | 确定 Unicode 中的指定字符是否存在。 |\n| `static\
  \ boolean isDigit(char ch)` | 判断指定的字符是否为数字。 |\n| `static boolean isJavaIdentifierPart(char\
  \ ch)` | 判断指定的字符是否可以作为 Java 标识符的一部分（除第一个字符外）。 |\n\n\n\n\n\n### 字符方法\n\n| `static\
  \ boolean isJavaIdentifierStart(char ch)` | 确定指定的字符是否可以作为 Java 标识符的首字符。 |\n| `static\
  \ boolean isLetter(char ch)` | 确定指定的字符是否为字母。 |\n| `static boolean isLetterorDigit(char\
  \ ch)` | 确定指定的字符是否为字母或数字。 |\n| `static boolean isLowerCase(char ch)` | 确定指定的字符是否为小写字母。\
  \ |\n| `static boolean isSpaceChar(char ch)` | 确定指定的字符是否为 Unicode 空字符。 |\n| `static\
  \ boolean isTitleCase(char ch)` | 确定指定的字符是否为首字母大写字符。 |\n| `static boolean isUpperCase(char\
  \ ch)` | 确定指定的字符是否为大写字母。 |\n| `static boolean isWhitespace(char ch)` | 根据 Java 判断指定的字符是否为空白字符。\
  \ |\n| `static char toLowerCase(char ch)` | 将字符参数转换为小写。 |\n| `static char toUpperCase(char\
  \ ch)` | 将字符参数转换为大写。 |\n| `static char toTitleCase(char ch)` | 将字符参数转换为首字母大写格式。\
  \ |\n| `int compareTo(Character anotherCharacter)` | 以数值形式比较两个 Character 对象。 |\n\
  | `int hashcode()` | 返回此 Character 对象的哈希码。 |\n| `boolean equals(Object obj)` | 将此对象与指定的对象进行比较。\
  \ |\n\n### Boolean 类\n`Boolean` 类将基本类型 `Boolean` 的值封装在对象中。\n\n#### 构造方法\n| `Boolean(Boolean\
  \ value)` | 分配一个表示值参数的 Boolean 对象。 |\n| `Boolean(String s)` | 如果字符串参数不为空且在忽略大小写的情况下等于字符串“true”，则分配一个表示值\
  \ true 的 Boolean 对象。 |\n\n#### Boolean 类的方法\n| `boolean booleanValue()` | 将此 Boolean\
  \ 对象的的值作为 Boolean 基本类型返回。 |\n| `int compareTo(Boolean b)` | 将此 Boolean 实例与另一个进行比较。\
  \ |\n| `boolean equals(Object obj)` | 且且仅当参数不空且与此对象表示相同布尔值的 Boolean 对象时，返回 true。\
  \ |\n| `static Boolean getBoolean(String name)` | 仅且仅当由参数命名的系统属性存在且等于字符串“true”时，返回\
  \ true。 |\n| `int hashCode()` | 返回此 Boolean 对象的哈希码。 |\n| `static boolean parseBoolean(String\
  \ s)` | 将字符串参数解析为布尔值。 |\n| `String toString()` | 返回表示此 Boolean 值的 String 对象。 |\n\
  | `static String toString(boolean b)` | 返回表示指定布尔 值的 String 对象。 |\n| `static Boolean\
  \ valueOf(boolean b)` | 返回表示指定布尔 值的 Boolean 实例。 |\n| `static Boolean valueOf(String\
  \ s)` | 返回一个由指定字符串表示值的 Boolean。 |\n\n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n\
  # ∞ 15 ∞\n# (Java 中的输入/输出)\n\n## 引言\nJava 程序通过流（streams）执行 I/O 操作。流是一种产生或消费信息的抽象。流通过\
  \ Java I/O 系统与物理设备连接。\n\n所有流的行为方式都是相同的，即使它们连接的实际物理设备有所不同。因此，相同的 I/O 类和方法可以应用于任何类型的设备。\n\
  \n这意味着输入流可以抽象许多不同类型的输入：从磁盘文件、键盘或网络套字。同样，输出流可以指向控制台、磁盘文件或网络连接。\n\n流是处理输入/输出的一种整洁方式，而不需要代码的每个部分都理解键盘和网络之间的区别（例如）。Java\
  \ 在 `java.io` 包中定义的类层次结构中实现了流。\n\n![PhotoFunia-5b0b11f_o](img/image083.jpg)\n\n\
  ### Java 程序与 I/O 设备的关系\n将数据从一个流发送到另一个流的理念（就像一根管道流向另一根管道）使得 Java 中的流成为文件处理的强有力工具。我们可以使用一系列简单的流操作构建一个复杂的文件处理序列。\n\
  \n此功能可以用于在流的流水线上对数据进行过滤，以便获得所需格式的数据。例如，我们可以使用一个流来获取二进制格式的原始数据，然后使用另一个串联的流将其转换为整数。\n\
  \n## 输入流和输出流\nJava 流分为两种基本类型：通常输入流和输出流。输入流从源提取（即读取）数据并发送到程序。\n\n![image](img/image017.png)\n\
  \n[content]程序在数据源上连接并打开输入流，然后串行读取数据。同样，程序在数据目的地连接并打开输出流，并串行写入数据。在两种情况下，程序都不知道端点的细节（即源和终点）。\n\
  \n### 字节流和字符流\nJava2 定义了两种流：字节流和字符流。字节流为处理字节的输入输出提供了方便的方法。例如，在读取或写入二进制数据时使用字节流。字符流使用\
  \ Unicode，因此可以国际化。此外，在某些情况下，字符流比字节流更高效。Java 的原始版本（Java 1.0）不包含字符流，当时所有的 I/O 都是面向字节的。\n\
  \n字符流是在 Java 1.1 中引入的，某些面向字节的类和方法被废弃了。\n\n**注意：** 在最底层，所有的 I/O 仍然是面向字节的。基于字符的仅为处理字符提供了一种方便且高效的方法。\n\
  \n这两组流可以根据其目的进一步分类。字节流类和字符流类包含专门的类，用于在不同类型的设备上独立地处理输入输出操作。\n\n我们还可以根据它们读取或写入的源或目的类型对流进行跨组分类。源（或目的可能是内存、文件或管道。\n\
  \n![images/image053.jpg](img/image053.jpg)\n![images/sss](img/sss.jpg)\n\n## Java\
  \ 流类的分类\n### 字节流类概述\n字节流类通过两个类层次结构定义。顶端是两个抽象类：\n1. `InputStream`\n2. `OutputStream`\n\
  \n每个抽象类中的都有几个具体的子类，它们处理不同设备（如磁盘文件、网络连接甚至内存缓冲区）之间的差异。\n\n#### InputStream 类\n用于读取\
  \ 8 位字节的 InputStream 类包括一个名为 `InputStream` 的超类以及若干个支持各种输入相关子类。\n\n![images/image000.jpg](img/image000.jpg)\n\
  ![images/image035.png](img/image035.png)\n![images/image081.png](img/image081.png)\n\
  \n### InputStream 类\n超类 `InputStream` 是一个抽象类，定义了执行输入功能的方法，例如：\n*   读取字节。\n*   关闭流。\n\
  *   标记流中的位置。\n*   跳过流中的部分。\n*   查找流中的字节数。\n\n#### InputStream 类的方法\n```\nint available()\
  \ // 提供输入中可用的字节数（必须由子类重写）。InputStream 类的 available 方法始终返回 0。\n\nvoid close() //\
  \ 关闭此输入流并释放与流相关的任何系统资源。InputStream 的 close 方法不执行操作。\n\nvoid mark(int readlimit)\
  \ // 标记此输入流的当前位置。InputStream 的 mark 方法不执行操作。\n\nboolean markSupported() // 测试此输入流是否支持\
  \ mark 和 reset 方法。InputStream 的 markSupported 方法返回 false。\n```\n\n\n\n\n\n# InputStream\n\
  \n| abstract int read() | 从输入流中读取下一个字节数据。子类必须提供此方法的实现。 |\n| `int read(byte[] b)`\
  \ | 从输入流中读取若干字节，并将它们存储在缓冲区数组 `b` 中。实际读取的字节数将作为整数返回。 |\n| `int read(byte[] b, int\
  \ offset, int len)` | 从输入流中读取若干字节，并将它们从参数 `off` 指定的位置开始存储在缓冲区数组 `b` 中。实际读取的字节数将作为整数返回。\
  \ |\n| `void reset()` | 将此流重新定位到在该输入流上上一次调用 `mark` 方法时所在的位置。`InputStream` 的 `reset`\
  \ 方法不执行任何操作，并始终抛出 `IOException`。 |\n| `long skip(long n)` | 跳过并丢弃此输入流中的最多 `n` 个字节数据，并返回实际跳过的字节数。\
  \ |\n\n## DataInput 接口 (The DataInput Interface)\n\n`DataInput` 是一个接口，它定义了从 `InputStream`\
  \ 读取原始数据类型的方法。\n\n### DataInput 接口的方法：\n\n| `boolean readBoolean()` | 读取一个输入字节，如果该字节非零则返回\
  \ true，如果该字节为零则返回 false。 |\n| `byte readByte()` | 读取并返回一个输入字节。 |\n| `char readChar()`\
  \ | 读取一个输入字符并返回其值。 |\n| `double readDouble()` | 读取八个输入字节并返回一个 double 值。 |\n| `float\
  \ readfloat()` | 读取四个输入字节并返回一个 float 值。 |\n| `void readFully(byte[] b)` | 从输入流中读取若干字节并将它们存储在缓冲区数组\
  \ `b` 中。如果流在读取所有字节之前到达末尾，此方法将抛出 `EOFException`。 |\n| `void readFully(byte[] b, int\
  \ off, int len)` | 从输入流中读取 `len` 个字节，并从 `off` 指定的位置开始存储在缓冲区数组 `b` 中。如果流在读取所有字节之前到达末尾，此方法将抛出\
  \ `EOFException`。 |\n| `int readInt()` | 读取四个输入字节并返回一个 `int` 值。 |\n| `String readLine()`\
  \ | 从输入流中读取下一行。 |\n| `long readLong()` | 读取八个输入字节并返回一个 `long` 值。 |\n| `short readShort()`\
  \ | 读取两个输入字节并返回一个 `short` 值 |\n| `Strig readUTF( ` | 读取一个使用修改后的 UTF-8 格式编码的字符串。\
  \ |\n| `int skipBytes(int n)` | 尝试从输入流中跳过 `n` 个字节数据并丢弃跳过的字节。返回实际跳过的字节数。 |\n\n##\
  \ InputStream 类总结 (Summary of InputStream Classes)\n\n`FilterInputStream` 包含另一个输入流，它将其作为基本数据源，并可能在处理过程中转换数据，以提供额外功能。\n\
  \n`FilterInputStream` 类本身简单地重写了 `InputStream` 的所有方法，这些重写版本会将所有请求传递给包含的输入流。`FilterInputStream`\
  \ 的子类可以进一步重写这些某些方法，并可能提供额外的方法和字段。\n\n注意，`DataInputStream` 类继承自 `FilterInputStream`\
  \ 并实现了 `DataInput` 接口。因此，`DataInputStream` 在使用 `InputStream` 类方法的基础上，还继承了 `FilterInputStream`\
  \ 并实现了 `DataInput` 中描述的方法。\n\n### InputStream 类总结：\n\n| `InputStream` | 此抽象类是所有表示字节输入流的类的超父类。\
  \ |\n| `BufferedInputStream` | `BufferedInputStream` 为另一个输入流增加了功能——即缓冲输入并支持 `mark`\
  \ 和 `reset` 方法。 |\n| `ByteArrayInputStream` | `ByteArrayInputStream` 包含一个内部缓冲区，其中包含可以从流中读取的字节。\
  \ |\n| `DataInputStream` | `DataInputStream` 包含一个可以从流中读取字节的内部缓冲区。 |\n| `FileInputStream`\
  \ | `FileInputStream` 包含一个可以从文件中读取字节的内部缓冲区。 |\n| `FilterInputStream` | `FilterInputStream`\
  \ 是过滤器输入流。 |\n| `PipedInputStream` | `PipedInputStream` 是管道输入流。 |\n| `PushbackInputStream`\
  \ | `PushbackInputStream` 是回退输入流。 |\n| `SequenceInputStream` | `SequenceInputStream`\
  \ 是序列输入流。 |\n\n\n\n\n\n| `ByteArrayOutputStream` | 该类实现了一种输出流，其中数据被写入字节数组中。 |\n\
  | `DataOutputStream` | 数据输出流允许应用程序以可移植的方式将 Java 原始数据类型写入输出流中。 |\n| `FileOutputStream`\
  \ | 文件输出流是用于向 `File` 写入数据的输出流。 |\n| `PipedOutputStream` | 管道输出流可以与管道输入流连接，以创建一个通信管道。\
  \ |\n| `FilterOutputStream` | `FilterOutputStream` 包含其他一些输出流，它将这些流作为自己的目标，并可能在此过程中对数据进行转换或提供额外的功能。\
  \ |\n| `PrintStream` | `PrintStream` 为另一个输出流增加了功能，即能够方便地打印各种数据值的表示形式。 |\n\n# 字符流类概述\n\
  \n字符流通过使用两个类层次结构定义。顶端是两个抽象类：`Reader` 和 `Writer`。这些抽象类处理 Unicode 字符流。\n\nJava 这些抽象类中的每一个都有几个具体的子类。抽象的\
  \ `Reader` 和 `Writer` 类定义了其他流类实现的几个关键方法。其中最重要的两个方法是 `read()` 和 `write()`，它们分别读取和写入字符数据。这些方法被派生的流类重写。\n\
  \n## Reader 流类\n\n`Reader` 流类设计用于从文件中读取字符。`Reader` 类是组中所有其他类的基类。这些类在功能上与输入流类非常相似，区别在于输入流使用字节作为信息的根本单位，而\
  \ reader 流使用字符。\n\n`Reader` 类包含与 `InputStream` 类中提供的相同的方法。因此，`Reader` 类可以执行输入流类实现几乎的所有功能。\n\
  \n![image](img/image059.png)\n\n(Reader 流类的层级结构)\n\n### Reader 类\n\n`Reader` 是一个抽象类，定义了\
  \ Java 的字符输入流式模型。该类中的所有方法都会抛出 `IOException`。\n\n### Reader 类的方法\n\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `abstract void close()` | 关闭流。一旦流被关闭，进一步的 `read()`、`ready()`、`mark()`\
  \ 或 `reset()` 调用将抛出 `IOException`。然而，关闭一个已经关闭的流没有影响。 |\n| `void mark()` | 标记流中的当前位置。随后的\
  \ `reset()` 调用将尝试将流重新置到此处。并不是所有的字符输入流都支持 `mark()` 操作。 |\n| `boolean markSupported()`\
  \ | 告诉该流是否支持 `mark()` 操作 |\n| `int read()` | 读取单个字符，并返回来自调用输入流的下一个可用字符的整数表示。遇到文件末尾时返回\
  \ -1。 |\n| `int read(char[] buffer)` | 尝试将多达 `buffer` 长度的字符读取到 `buffer` 中，并返回成功读取的字符数。遇到文件末尾时返回\
  \ -1。reader 子类必须实现此方法。 |\n| `abstract int read(char[] buffer, int offset, int numChar)`\
  \ | 尝试从 `buffer[offset]` 开始读取最多 `numChar` 个字符，返回成功读取的字符数。遇到文件末尾时返回 -1。reader 子类必须实现此方法。\
  \ |\n| `boolean ready()` | 告诉该流是否准备好被读取。如果下一次输入请求不会等待，则返回 true，否则返回 false。 |\n|\
  \ `void reset()` | 重置流。并不是所有的字符输入流都支持此方法。 |\n| `long skip(long n)` | 跳过最多 `n` 个字符，并返回跳过的字符数。如果\
  \ `n` 为负数，则抛出 `IllegalArgumentException`。 |\n\n### Reader 类总结\n\n| 类 | 描述 |\n| :---\
  \ | :--- |\n| `Reader` | 用于读取字符流的抽象类 |\n| `BufferedReader` | 从字符输入流中读取文本，对字符进行缓冲，以便高效读取字符、数组和行。\
  \ |\n| `CharArrayReader` | 该类实现了一个可以作为字符输入流使用的字符缓冲区。 |\n| `FileReader` | 用于读取字符文件的便利类。\
  \ |\n| `FilterReader` | 用于读取过滤字符流的抽象类。 |\n| `InputStreamReader` | `InputStreamReader`\
  \ 是从字节流到字符流的桥接：它读取字节并使用指定的字符集将它们解码为字符。 |\n| `PipedReader` | 管道字符输入流。 |\n| `PushbackReader`\
  \ | 一种允许将字符推回流中的字符流读取器。 |\n| `StringReader` | 源自字符串的字符流。 |\n\n## Writer 流类\n\n`Writer`\
  \ 流类设计用于向文件/输出设备写入字符。writer 类是一个抽象类，作为所有其他 writer 流类的基类。\n\n该基类通过定义与 `OutputStream`\
  \ 类中相同的方法，为所有输出操作提供支持。\n\n`Writer` 类包含与 `OutputStream` 类中提供的相同的方法。因此，`Writer` 类可以执行输出流类实现的几乎的所有功能。\n\
  \n![image](img/image068.png)\n\n(Writer 流类的层级结构)\n\n![C:\\Users\\Made Man Harry\\\
  Desktop\\Stars\\black_star_logo.jpg](img/image054.jpg)\n\n### Writer 类\n\n`Writer`\
  \ 是一个抽象类，定义了字符流式输出。该类中的所有方法都返回 `void` 值并在发生错误时抛出 `IOException`。\n\n### Writer 类的方法\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `abstract void close()` | 关闭流并先刷新它。 |\n| `abstract\
  \ void flush()` | 刷新流。 |\n| `void write(char[] cbuf)` | 写入字符数组。 |\n| `abstract void\
  \ write(char[] cbuf, int off, int len)` | 写入从指定偏移开始的数组部分。子类必须实现此方法。 |\n| `void write(int\
  \ c)` | 向调用输出流写入字符。注意参数是 `int`，允许写入表达式而无需将其强制转换为 `char`。 |\n| `void write(String\
  \ str)` | 写入字符串。 |\n| `void write(String str, int off, int len)` | 写入从指定偏移开始的字符串部分。\
  \ |\n\n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\Star_logo_yellow.jpg](img/016.jpg)\n\
  \n### Writer 类总结\n\n| 类 | 描述 |\n| :--- | :--- |\n| `Writer` | 用于写入字符流的抽象类 |\n| `BufferedWriter`\
  \ | 向字符输出流写入文本，对字符进行缓冲，以便高效写入字符、数组和字符串。 |\n| `CharArrayWriter` | 实现了一个可以作为 Writer\
  \ 使用字符缓冲区。 |\n| `FileWriter` | 用于写入字符文件的便利类。 |\n| `FilterWriter` | 用于过滤字符流的抽象类。\
  \ |\n| `OutputStreamWriter` | `OutputStreamWriter` 是从字符流到字节流的桥接：写入它的字符使用指定的字符集编码为字节。\
  \ |\n| `PipedWriter` | 管道字符输出流。 |\n| `PrintWriter` | 向文本输出流打印对象的格式化表示。 |\n| `StringWriter`\
  \ | 一种将其输出收集在字符串缓冲区中的字符流，然后可以使用它可以构造字符串。 |\n\n## File 类\n\n尽管 `java.io` 中定义的大多数类都是基于流的操作，但\
  \ `File` 类不是。它直接处理文件和文件系统。也就是说，file 类没有指定如何从文件中检索或在文件中存储信息。它描述的是自身的属性。\n\n`File`\
  \ 对象用于获取或操作与磁盘相关的信息，例如权限、时间、日期和目录路径，以及导航子目录层级结构。\n\n\n\n\n\n尽管出于安全考虑，在小程序（applets）中使用它们受到严格限制，但文件仍然是存储持久和共享信息的核心资源。\n\
  \n`Java` 中的目录被简单地视为一个文件，但多了一个额外的属性——一个可以通过 `list()` 方法检查的文件名列表。\n\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `public File(String);` | |\n| `public File(String, String);`\
  \ | |\n| `public File(File, String);` | |\n| `public File(URI);` | 该构造函数由 `Java2`\
  \ 版本 1.4 添加。 |\n| `public String getName();` | 返回文件或目录的名字 |\n| `public String getParent();`\
  \ | 返回来自对象创建期间指定的路径中的文件父目录；如果此路径名不是父目录，则返回 null。 |\n| `public String getPath();`\
  \ | 返回相对路径。 |\n| `public boolean isAbsolute();` | 测试此抽象路径是否为绝对路径。 |\n| `public String\
  \ getAbsolutePath( );` | 返回从根目录开始的绝对（完整）路径。 |\n| `public boolean canRead( );` |\
  \ 测试应用程序是否可以读取此抽象路径所指示的文件。 |\n| `public boolean canWrite( );` | 测试应用程序是否可以修改此抽象路径所指示的文件。\
  \ |\n| `public boolean exists( );` | 测试此抽象路径所指示的文件或目录是否存在。 |\n| `public boolean\
  \ isDirectory( );` | 测试此抽象路径所指示的文件是否为目录。 |\n| `public boolean isFile( );` | 测试此抽象路径所指示的文件是否为普通文件。\
