  tc2.c[3]=7\ntc1.c[0]=0\ntc1.c[1]=1\n```\n\n# 21 (集合框架)\n\n## 多线程环境中的有用方法\n\n除了上述讨论的方法外，`Object`\
  \ 类还通过以下方法为同步代码中的线程通信提供支持：导致当前线程等待，直到另一个线程调用该对象的 `notify()` 方法或 `notifyAll()` 方法。\n\
  \n8. `final void wait(long timeout) throws InterruptedException`\n9. `final void\
  \ wait(long timeout, long nanos) throws InterruptedException`\n\n导致当前线程等待，直到另一个线程调用该对象的\
  \ `notify()` 方法或 `notifyAll()` 方法，或者其他线程中断了当前线程，或者指定的时间已到。\n\n10. `final void notify()`\n\
  唤醒在该对象监视器上等待的单个线程。\n\n11. `final void notifyAll() `\n唤醒所有在该对象监视器上等待的线程。线程通过调用其中一个\
  \ `wait` 方法在对象的监视器上等待。\n\n线程在它持有的锁对象上调用这些方法。线程等待另一个线程的通知。\n\n## 简介言\n\nJava 集合框架标准化了程序处理对象组的方式。在\
  \ Java 2 之前，Java 提供了诸如 `Vector`、`Stack`、`Dictionary`、`Hashtable` 和 `Properties`\
  \ 等临时类，用于存储和操作对象组。\n\n尽管这些类非常有用，但它们缺乏一个核心的统一主题。我们使用 `Vector` 的方式与使用 `properties`\
  \ 类的方式不同。此外，之前的临时方法设计时并未考虑到易于扩展或适应。集合（Collections）是对这些（以及其他）问题的回答。\n\n`Collection`\
  \ 框架的设计考虑了以下目标：\n\n- 框架必须是高性能的。基础集合（动态数组、链表、树和哈希表）的实现非常高效。\n- 框架必须允许不同类型的集合以类似的方式工作，并具有高度的可操作性。\n\
  - 扩展和/或适应集合应该是容易的。\n\n为了实现上述目标，集合框架设计了以下特性：\n\n- 整个集合框架是围绕一组标准接口设计的。提供了这些接口的若干种标准实现。我们也可以实现自己的集合。\n\
  - 集合框架创建的另一个项目是 `Iterator` 接口。`Iterator` 为你提供通用的、标准化的方法来逐次访问集合中的元素。\n- 因此，`Iterator`\
  \ 提供了一种遍历集合内容的手段。因为每个集合都实现了 `Iterator`，所以可以通过 `Iterator` 定义的方法访问任何集合类中的元素。这样，只需经过很小的更改，循环遍历集合的代码也可以用于循环遍历列表（例如）。\n\
  - 除了集合之外，框架还定义了几个映射（map）接口和类。`Maps` 存储键/值对。虽然在术语使用上 map 并不是真正的“集合”，但它们与集合完全集成在一起。\n\
  - 在集合框架的语言中，我们可以获取 map 的集合视图（collection view）。这种视图包含了存储在集合中的 map 元素。因此，如果你愿意，可以像处理集合一样处理\
  \ map 的内容。\n- 集合机制被重新适配到 `java.util` 包定义的某些原始类中，以便它们也能集成到新系统中。\n- 重要的是，尽管集合的加入改变了许多原始工具类的架构，但它并没有导致任何一个类被废弃。集合仅仅为完成几项任务提供了一种更好的方法。\n\
  \n## 集合接口\n\n集合框架定义了几个接口。具体类仅提供了标准接口的不同实现。支撑集合的接口是：\n\n- **Collection**: 允许你处理对象组；它是集合层次结构的最顶端。\n\
  - **List**: 扩展 `collection` 以处理序列（对象列表）。\n- **Set**: 扩展 `collection` 以处理必须包含唯一元素的集合。\n\
  - **SortedSet**: 扩展 `collection` 以处理排序集合。\n\n除了集合接口外，集合还使用 `Comparator`、`Iterator`\
  \ 和 `RandomAccess` 接口。`Comparator` 定义了如何比较对象；`Iterator` 和 `ListIterator` 遍历集合。\n\
  \n通过实现 `RandomAccess`，列表表示它支持随机访问。为了给使用提供最大的灵活性，集合接口允许某些方法是可选的。支持这些方法的集合被称为可变的。不允许更改内容的集合被称为不可变的。如果尝试对不可变集合使用这些方法之一，则会抛出\
  \ `UnsupportedOperationException`。所有内置集合都是可变的。\n\n### Iterator 接口\n\nIterator 接口定义了以下方法：\n\
  \n- `Boolean hasNext()` 如果迭代还有更多元素，则返回 true。\n- `Object next()` 返回迭代的下一个元素。\n- `void\
  \ remove()` 从底层集合中移除迭代器返回的最后一个元素（某些情况下可能不允许）。它是一个可选操作，如果迭代器不支持此操作，则抛出 `UnsupportedOperationException`。\n\
  \n迭代器与枚举（enumeration）的区别在于：\n\n- 迭代器允许调用者在迭代期间从底层集合删除元素，具有良好的语义。\n- 方法名称得到了改进。\n\
  \n### ListIterator 接口\n\n它是 `Iterator` 的子接口。\n\n```java\npublic interface ListIterator\
  \ extends Iterator\n```\n\n它是列表的迭代器，允许程序员双向遍历列表，在迭代期间修改列表，并获取迭代器的当前位置。\n\n方法摘要：\n\
  \n- `void add(Object obj)` 将指定的元素插入列表中（可选操作）。\n- `boolean hasNext()` 如果正向遍历列表时还有更多元素，则返回\
  \ true。\n- `boolean hasPrevious()` 如果反向遍历列表时还有更多元素，则返回 true。\n- `Object next()`\
  \ 返回列表的下一个一个元素。\n- `int nextIndex()` 返回后续调用 `next()` 将返回的索引。\n- `Object previous()`\
  \ 返回列表的上一个元素。\n- `int previousIndex()` 返回后续调用 `previous()` 将返回的索引。\n- `void remove()`\
  \ 移除列表中由 `next()` 或 `previous()` 返回的最后一个元素（可选操作）。\n\n\n\n\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `void set(Object obj)` | 用指定的元素替换由 `next` 或 `previous` 返回的上一个元素（可选操作）。\
  \ |\n\n## RandomAccess 接口\n\n这是一个标记接口，由 `List` 实现类使用，用于指示它们支持随机访问。`ArrayList` 和\
  \ `Vector` 实现了此接口。\n\n## Comparator 接口\n\n比较器用于控制某些数据结构（如 `TreeSet` 或 `TreeMap`）的顺序。\n\
  \n### 方法\n\n| 返回值类型 | 描述 |\n| :--- | :--- |\n| `Int compare(Object o1,Object o2)`\
  \ | 比较两个参数的顺序。 |\n| `Boolean equal(Object obj)` | 表明其他对象是否“等于”此 `Comparator`。 |\n\
  \n## Collection 接口\n\n`collection` 接口是集合框架的基础。它声明了所有集合都将具有的核心方法。由于所有集合都实现了 `collection`\
  \ 接口，因此熟悉这些方法对于清晰理解该框架是必要的。其中某些方法可能会抛出 `UnsupportedOperationException`。当一个对象与另一个对象不兼容时（例如尝试向集合添加不兼容的对象时），会生成\
  \ `ClassCastException`。\n\n### Collection 接口中的方法\n\n| 返回值类型 | 描述 |\n| :--- | :---\
  \ |\n| `boolean add(Object obj)` | 确保此集合包含指定的元素（可选操作）。将对象添加到调用的集合中。如果元素 `obj` 已添加到集合中，则返回\
  \ true。如果元素 `obj` 已经是集合的成员且集合不允许重复，则返回 false。 |\n| `boolean addAll(Collection c)`\
  \ | 将指定集合中的所有元素添加到此集合中（可选操作）。 |\n| `void clear()` | 从此集合中移除所有元素（可选操作）。 |\n| `boolean\
  \ contain(Object o)` | 如果此集合包含指定的集合，则返回 true。 |\n| `boolean containAll(Collection\
  \ c)` | 如果此集合包含指定集合中的所有元素，则返回 true。 |\n| `boolean equal(Object o)` | 将指定的对象与此集合进行等等性比较。\
  \ |\n| `int hashCode()` | 返回此集合的哈希值。 |\n| `boolean isEmpty()` | 如果此集合不包含任何元素，则返回\
  \ true。 |\n| `Iterator iterator()` | 返回一个用于此集合中元素的迭代器。 |\n| `boolean remove(Object\
  \ o)` | 如果存在，则从集合中移除元素的单个实例（可选操作）。 |\n| `boolean removeAll(Collection c)` | 移除所有包含在指定集合中的元素（可选操作）。\
  \ |\n| `boolean retainAll(Collection c)` | 保留此集合中包含在指定集合中的元素（可选操作）。 |\n| `int size()`\
  \ | 返回集合中元素的数量。 |\n| `Object[ ] toArray()` | 返回一个包含此集合中所有元素的数组。 |\n\n可以通过调用 `equals()`\
  \ 方法来比较两个集合的等等性。“等性”的精确含义可能随集合而异。\n\n例如，你可以实现 `equals()` 以便比较集合中存储的元素的值。或者，`equals()`\
  \ 也可以比较这些元素的引用。\n\n## List 接口\n\n列表是一种有序的元素集合，称为序列。`List` 接口扩展了 `Collection` 并声明了存储元素序列的集合的行为。\n\
  \n可以使用从 0 开始的索引根据元素在列表中的位置来插入或访问元素。列表可以包含重复元素。除了 `collection` 定义的方法外，`List` 还定义了一些自己的方法。\n\
  \n### List 接口中的方法\n\n| 返回值类型 | 描述 |\n| :--- | :--- |\n| `boolean add(Object o)`\
  \ | 将指定的元素添加到此列表的末尾（可选操作）。该方法定义在 `Collection` 接口，但作为 `List` 接口的一部分，它应该实现为始终将元素添加到列表的末尾。\
  \ |\n| `void add(int index, Object element)` | 在此列表的指定位置插入指定的元素（可选操作）。插入点处或该点之后的任何现有元素都会向前移动。因此，元素不会被覆盖。\
  \ |\n| `boolean addAll(Collection c)` | 将指定集合中的所有元素添加到此列表的末尾，顺序按照指定集合 `iterator`\
  \ 返回的顺序（可选操作）。该方法定义在 `Collection` 接口，但作为 `List` 接口的一部分，它应该实现为始终将元素添加到列表的末尾。 |\n\
  | `boolean addAll(int index, Collection c)` | 在此列表的指定位置插入指定集合中的所有元素（可选操作）。如果调用列表发生变化则返回\
  \ true，否则返回 false。 |\n| `boolean addAll(int index, Collection c)` | 在此列表的指定位置插入指定集合中的所有元素（可选操作）。如果调用列表发生变化则返回\
  \ true，否则返回 false。 |\n| `Object get(int index)` | 返回此列表中指定位置的元素。 |\n| `int indexOf(Object\
  \ o)` | 返回指定元素在列表中第一次出现的索引，如果列表不包含该元素，则返回 -1。 |\n| `int lastIndexOf(Object o)` |\
  \ 返回指定元素在列表中最后一次出现的索引索引，如果列表不包含该元素，则返回 -1。 |\n| `ListIterator iterator()` | 返回一个此列表元素的列表迭代器（按正确顺序）。\
  \ |\n| `ListIterator iterator(int index)` | 返回一个从此列表指定位置开始的列表元素的列表迭代器。 |\n| `Object\
  \ remove(int index)` | 移除指定位置的元素（可选操作）并返回被删除的元素。列表将压缩。也就是说，后续元素的索引将减一。 |\n| `Object\
  \ set(int index, Object element)` | 用指定的元素替换此列表中指定位置的元素（可选操作）。 |\n| `List subList(int\
  \ fromIndex, int toIndex)` | 返回一个包含从 fromIndex 到 toIndex-1 元素的列表。返回的列表也被调用列表引用。\
  \ |\n\n注意：如果集合无法修改，这些方法中的某些可能会抛出 `UnsupportedOperationException`；当对象与集合不兼容时，会生成\
  \ `ClassCastException`。\n\n`collection` 定义的 `add(Object o)` 和 `addAll(Collection\
  \ c)` 方法的语义被 `list` 改变，变为将元素添加到列表末尾。\n\n## Set 接口\n\n`Set` 接口定义了一个集合。它扩展了 `Collection`\
  \ 并声明了不允许重复元素的集合的行为。\n\n因此，如果尝试向集合添加重复元素，`add()` 方法返回 false。它没有定义任何自己的方法。\n\n##\
  \ SortedSet 接口\n\n`SortedSet` 接口扩展了 `Set` 并声明了升序排序集合的行为。\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `Comparator comparator()` | 返回与此排序相关的比较器，如果使用元素的自然排序，则返回 null。 |\n\
  | `Object first()` | 返回此排序集合中的第一个元素。 |\n| `SortedSet headSet(Object toElement)`\
  \ | 返回此排序集合中元素严格小于 toElement 的视图。 |\n| `Object last()` | 返回此排序集合中的最后一个元素。 |\n| `SortedSet\
  \ subSet(Object fromElement, Object toElement)` | 返回此排序集合中元素范围从 fromElement（包含）到\
  \ toElement（不包含）的视图。 |\n| `SortedSet tailSet(Object fromElement)` | 返回此排序集合中元素大于或等于\
  \ fromElement 的视图。 |\n\n\n\n\n当调用的集合中不包含任何项的数组时，某些方法会抛出 `NoSuchElementException`。当对象与集合中的元素不兼容时，会抛出\
  \ `ClassCastException`。如果尝试使用 null 对象且集合不允许为 null，则会抛出 `NullPointerException`。\n\
  \n### 集合类\n\n某些集合类提供了完整的实现，可以可以直接使用。另一些类是抽象的，它们提供了骨架实现，用作创建具体集合的起点。\n\n没有任何一个集合类是同步版本的。\n\
  \n标准集合类如下：\n\n| 类 | 描述 |\n| :--- | :--- |\n| `AbstractCollection` | 实现了 `Collection`\
  \ 接口的大部分。 |\n| `AbstractList` | 继承 `AbstractCollection` 并实现了 `List` 接口的大部分。 |\n\
  | `AbstractSequenceList` | 继承 `AbstractList`，用于使用顺序而非随机访问元素的集合。 |\n| `AbstractSet`\
  \ | 继承 `AbstractCollection` 并实现了 `Set` 接口。 |\n| `LinkedList` | 通过扩展 `AbstractSequentialList`\
  \ 实现链表。 |\n| `ArrayList` | 通过扩展 `AbstractList` 实现动态数组。它使用元素的随机访问。 |\n| `HashSet`\
  \ | 继承 `AbstractSet` 并用于哈希表。 |\n| `LinkedHashSet` | 继承 `HashSet` 以允许插入顺序迭代。 |\n\
  | `TreeSet` | 继承 `AbstractSet` 并实现 `SortedSet` 接口。它使用二叉搜索树按排序存储元素。 |\n\n注意：除了集合类外，一些旧类（如\
  \ `Vector`、`Stack`、`Hashtable`）已重新设计以支持集合。\n\n### 通过 Iterator 和 ListIterator 访问集合\n\
  \n通常，你想要遍历集合中的元素。到目前为止，最简单的方法是使用迭代器，一个实现了 `Iterator` 或 `ListIterator` 接口的对象。\n\n\
  `Iterator` 允许你通过遍历集合来获取或移除元素。`ListIterator` 扩展了 `Iterator`，允许对列表进行双向遍历并修改元素。\n\n\
  在通过迭代器访问集合之前，你必须先获取它。每个集合类都提供一个 `iterator()` 方法，返回一个指向集合开头的迭代器。通过使用该迭代器对象，你可以一次访问集合中的每个元素。\n\
  \n对于实现 `List` 的集合，你也可以通过调用 `ListIterator` 获取迭代器。列表迭代器允许你以正向或反向访问集合，并且你可以修改元素。否则，`ListIterator`\
  \ 的用法与 `Iterator` 一致。\n\n### ArrayList 类\n\n`ArrayList` 类继承自 `AbstractList` 并实现了\
  \ `List` 接口。`ArrayList` 支持根据需要增长的动态数组。在 Java 中，标准数组是固定长度的。\n\n数组创建后，它们不能增长或缩小，这意味着我们必须预先知道数组将包含多少元素。但有时，在运行之前我们不知道数组的大小。为了处理这种情况，集合框架定义了\
  \ `ArrayList`。\n\n`ArrayList` 是一个对象引用的变变数组，也就是说，`ArrayList` 可以动态增加或减少大小。数组列表在创建时有一个初始大小。\n\
  \n当超过容量时，集合会自动扩大；当对象被移除时，数组可能会缩小。使用 J2SE 5 引入的泛型功能，可以限制添加到 `ArrayList` 中的元素类型。\n\
  \n注意：旧类 `Vector` 也支持动态数组。\n\n### ArrayList 类的构造函数与方法\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `public ArrayList(int)` | 构建一个具有指定初始容量的空列表。随着元素被添加到数组列表中，容量会自动增长。 |\n| `public\
  \ ArrayList()` | 构造一个初始容量为十的空列表。 |\n| `public ArrayList(Collection)` | 构造一个包含指定集合元素的列表。按照元素由集合的\
  \ `Iterator` 返回的顺序排列。 |\n| `public void trimToSize()` | 反之，如果我们想减小 `ArrayList` 对象的底层数组的大小，使其正好等于当前持有的项数，可以调用\
  \ `trimToSize()` 方法。 |\n| `public void ensureCapacity(int)` | 尽管 `ArrayList` 对象的容量在存储对象时会自动增加，但我们可以通过调用\
  \ `ensureCapacity()` 方法手动增加 `ArrayList` 对象的容量。通过在开始时增加一次容量，可以防止后续多次重新分配。因为重新分配在时间上是昂贵的，防止不必要的重新分配可以提高性能。\
  \ |\n| `public int size()` | |\n| `public Boolean isEmpty()` | |\n| `public Object\
  \ clone()` | |\n| `public Object[] toArray()` | 在与 `ArrayList` 工作时，我们有时想要获得一个包含列表内容的实际数组。我们可以通过调用\
  \ `toArray()` 方法来实现。我们可能想要将集合转换为数组有几个原因，例如：为了某些某些操作获得更快的处理时间；将数组传递给没有重载以接收集合的方法；将我们较新的基于集合的代码与不理解集合的旧代码集成。\
  \ |\n| `public Object[] toArray(Object[])` | |\n| `public Object get(int)` | |\n\
  | `public Object set(int, Object)` | |\n| `public boolean add(Object)` | |\n| `public\
  \ void add(int, Object)` | |\n| `public Object remove(int)` | |\n| `public boolean\
  \ remove(Object)` | |\n| `public void clear()` | |\n| `public boolean addAll(Collection)`\
  \ | |\n| `public boolean addAll(int, Collection)` | |\n| `public boolean contains(Object)`\
  \ | |\n| `public int indexOf(Object)` | |\n| `public int lastIndexOf(Object)` |\
