  \n### 示例 15.6\n\n```java\nimport java.io.*;\nclass RandomIO {\n    public static\
  \ void main(String args[]) throws IOException {\n        RandomAccessFile file =\
  \ null;\n        try {\n            file = new RandomAccessFile(\"rand.dat\", \"\
  rw\");\n            file.writeChar('X');\n            file.writeInt(1999);\n   \
  \         file.writeDouble(222.44);\n            System.out.println(\"File pointer\
  \ Pos:\"+file.getFilePointer());\n            file.seek(0);\n            System.out.println(file.readChar());\n\
  \            System.out.println(file.readInt());\n            System.out.println(file.readDouble());\n\
  \            System.out.println(\"File pointer Pos:\"+file.getFilePointer());\n\
  \            file.seek(2);\n            System.out.println(\"File pointer Pos:\"\
  +file.getFilePointer());\n            System.out.println(file.readInt());\n    \
  \        file.seek(file.length());\n            file.writeBoolean(false);\n    \
  \        file.seek(14);\n            System.out.println(file.readBoolean());\n \
  \           System.out.println(\"File pointer Pos:\"+file.getFilePointer());\n \
  \           System.out.println(file.readInt());//EOF Exception\n        }\n    \
  \    catch(EOFException e) {\n            System.out.println(\"Trying to read after\
  \ end of file\");\n        }\n        finally {\n            file.close();\n   \
  \     }\n    }\n}\n```\n\n**输出：**\n```\nFile pointer Pos:14\nX\n1999\n222.44\nFile\
  \ pointer Pos:14\nFile pointer Pos:2\n1999\nfalse\nFile pointer Pos:15\nTrying to\
  \ read after end of file\n```\n\n注意：如果尝试在文件末尾之后读取，则会发生 `EOFException`。\n\n### ByteArrayInputStream\n\
  `ByteArrayInputStream` 包含一个可以从流中读取的内部缓冲区。`ByteArrayInputStream` 是一个使用字节数组作为源的输入流实现。该类有两个构造函数，每个构造函数都需要一个字节数组来提供数据源。`ByteArrayInputStream`\
  \ 实现了 `mark()` 和 `reset()` 方法。但是，如果没有调用过 `mark()`，`reset()` 将将流指针置到流的起始位置。\n\n-\
  \ `public ByteArrayInputStream(byte[])`\n- `public ByteArrayInputStream(byte[],\
  \ int)`\n- `public synchronized int read()`\n- `public synchronized int read(byte[],\
  \ int)`\n- `public synchronized long skip(long)`\n- `public synchronized int available()`\n\
  - `public boolean markSupported()`\n- `public void mark(int)`\n- `public synchronized\
  \ void reset()`\n- `public void close() throws IOException`\n\n### 示例 15.7\n\n```java\n\
  import java.io.*;\nclass ByteArrayInputStreamTest {\n    public static void main(String\
  \ args[]) throws IOException {\n        String s1 = \"abcdefghijk\";\n        byte\
  \ b[] = s1.getBytes();\n        ByteArrayInputStream b1 = new ByteArrayInputStream(b);\n\
  \        int a;\n        while((a=b1.read()) != -1) {\n            System.out.print((char)Character.toUpperCase(a));\n\
  \        }\n        b1.close();\n    }\n}\n```\n**输出：**\n`ABCDEFGHIJK`\n\n### ByteArrayOutputStream\n\
  `ByteArrayOutputStream` 实现了一个输出流，数据被写入字节数组中。`ByteArrayOutputStream` 是一个使用字节数组作为目的的输出流实现。缓冲区位于\
  \ `ByteArrayOutputStream` 的 `buf` 字段中。缓冲区的大小根据需要增加。\n\n- `public ByteArrayOutputStream()`\
  \ 创建一个新的字节输出流，缓冲区初始大小为 32 字节。\n- `public ByteArrayOutputStream(int size)` 创建一个新的字节输出流，缓冲区大小为指定的字节数。\n\
  - `public synchronized void write(int)` 写入一个字节。\n- `public synchronized void write(byte[]\
  \ b, int off, int len)` 写入字节数组中的指定范围。\n- `public synchronized void write(byte[]\
  \ b)` 写入字节数组中的所有字节。\n- `public synchronized void reset()` 重置缓冲区。\n- `public synchronized\
  \ byte[] toByteArray()` 返回缓冲区内容的字节数组。\n- `public synchronized int size()` 返回已写入的字节数。\n\
  - `public void close() throws IOException`\n\n### 示例 15.8\n\n```java\nimport java.io.*;\n\
  class ByteArrayOutputStreamTest {\n    public static void main(String args[]) throws\
  \ IOException {\n        ByteArrayOutputStream b1 = new ByteArrayOutputStream();\n\
  \        b1.write('a');\n        String s1 = \"abcdefghijk\";\n        byte arr1[]\
  \ = s1.getBytes();\n        b1.write(arr1);\n        System.out.println(b1); //toString()\n\
  \        // 使用 for 循环\n        byte arr2[] = b1.toByteArray();\n        for(int\
  \ i=0; i<arr2.length; i++) {\n            System.out.print((char)arr2[i]);\n   \
  \     }\n        System.out.println();\n        // 使用 for each 循环\n        for(int\
  \ i:arr2) {\n            System.out.print((char)i);\n        }\n        b1.close();\n\
  \    }\n}\n```\n**输出：**\n```\nabcdefghijk\nabcdefghijk\nabcdefghijk\n```\n\n###\
  \ CharArrayReader\n`CharArrayReader` 是一个使用字符数组作为源的读取流实现。该类有两个构造函数，每个都需要一个字符数组来提供数据源。\n\
  \n**构造函数：**\n- `CharArrayReader(char[]buf)` 从指定的字符数组创建 `CharArrayReader`。\n- `CharArrayReader(char[]buf,\
  \ int offset, int length)` 从指定的字符数组创建 `CharArrayReader`。生成的读取器从指定的偏移量开始读取。从此读取器可以读取的字符值总数将是\
  \ `length` 或 `buf.length`。\n\n### 示例 15.9\n\n```java\nimport java.io.*;\nclass CharArrayReaderTest\
  \ {\n    public static void main(String args[]) throws IOException {\n        String\
  \ tmp = \"abcdefghijklmnopqrstuvwxyz\";\n        int length = tmp.length();\n  \
  \      char c[] = new char[length];\n        tmp.getChars(0, length, c, 0);\n  \
  \      CharArrayReader input1 = new CharArrayReader(c);\n        CharArrayReader\
  \ input2 = new CharArrayReader(c, 0, 5);\n        int i;\n        while((i=input1.read())\
  \ != -1) {\n            System.out.print((char)i);\n        }\n        System.out.println();\n\
  \        while((i=input2.read()) != -1) {\n            System.out.print((char)i);\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```java\n20. System.out.print((char)i);\n21.\
  \ }\n22. }\n23. }\n```\n输出:\n```\nabcdefghijklmnopqrstuvwxyz\nabcde\n```\n\n# CharArrayWriter\n\
  \n`CharArrayWriter` 是一个写入流的实现，它使用字符数组缓冲区作为目标目标。\n\n### 构造函数\n\n`CharArrayWriter()`\
  \ \n`CharArrayWriter(int initialSize)`\n\n在第一种形式中，会创建一个具有默认大小的缓冲区。在第二种形式中，创建的缓冲区大小与参数\
  \ `initialSize` 指定的大小相同。\n\n缓冲区存储在 `CharArrayWriter` 的 `buf` 字段中。如果需要，缓冲区的大小会自动增加。缓冲区中持有的字符数量包含在\
  \ `CharArrayWriter` 的 `count` 字段中。`buf` 和 `count` 都是受保护字段。\n\n### 示例 15.10\n\n```java\n\
  import java.io.*;\nclass CharArrayWriterTest\n{ \n  public static void main (String\
  \ args[]) throws IOException\n  { \n    CharArrayWriter f = new CharArrayWriter();\n\
  \    String s = \"This should end up in the array\";\n    char buf[] = new char[s.length()];\n\
  \    s.getChars(0,s.length(),buf,0);\n    f.write(buf);\n    System.out.println(f.toString());\n\
  \    char c[ ] = f.toCharArray();\n    for(int i=0; i<c.length;i++)\n    { \n  \
  \    System.out.print(c[i]);\n    }\n    FileWriter f2 = new FileWriter(\"test.txt\"\
  );\n    f.writeTo(f2);\n    f2.close();\n    f.reset();\n    System.out.println();\n\
  \    System.out.println(\"After reset:\"+f.toString());\n    for(int i=0;i<3;i++)\n\
  \      f.write('A');\n    System.out.println(f.toString());\n  }\n}\n```\n输出:\n\
  ```\nThis should end up in the array\nThis should end up in the array\nAfter reset:\n\
  AAA\n```\n\n# Pushback Input Stream\n\n`PushbackInputStream` 为另一个输入流增加了功能，即“推回”或“重读”一个字节的能力。缓冲的用途之一就是实现推回。\n\
  \n推回用于输入流，允许读取一个字节后将其返回到流中。除了 `InputStream` 类中常见的方法外，`PushbackInputStream` 还提供了\
  \ `unread()` 方法，在此所示：\n\n| `public java.io.PushbackInputStream(java.io.InputStream,\
  \ int);` | 创建一个具有指定大小推回缓冲区的 `PushbackInputStream`，并保存其参数（输入的输入流）以备后用。这允许将多个字节返回输入流。\
  \ |\n| `public java.io.PushbackInputStream(java.io.InputStream);` | 创建一个 `PushbackInputStream`\
  \ 并保存其参数（输入的输入流）以备后用。这允许将一个字节返回输入流。 |\n| `public int read() throws java.io.IOException;`\
  \ | |\n| `public int read(byte[], int, int) throws java.io.IOException;` | |\n|\
  \ `public void unread(int) throws java.io.IOException;` | 通过将字节拷贝到推回缓冲区的头部来推回一个字节。\
  \ |\n| `public void unread(byte[], int, int) throws java.io.IOException;` | 通过将字节数组的一部分拷贝到推回缓冲区的头部来推回部分字节数组。\
  \ |\n| `public void unread(byte[]) throws java.io.IOException;` | 通过将字节数组拷贝到推回缓冲区的头部来推回一个字节数组。\
  \ |\n| `public int available() throws java.io.IOException;` | |\n| `public long\
  \ skip(long) throws java.io.IOException;` | |\n| `public boolean markSupported();`\
  \ | `PushbackInputStream` 的副作用是会使创建它的 `InputStream` 的 `mark()` 或 `reset()` 方法失效。使用\
  \ `markSupported()` 方法检查任何你将要使用 `mark()`/`reset()` 的流。 |\n| `public synchronized\
  \ void mark(int);` | |\n| `public synchronized void reset() throws java.io.IOException;`\
  \ | |\n| `public synchronized void close() throws java.io.IOException;` | |\n\n\
  ### 示例 15.11\n\n```java\nimport java.io.*;\nclass PushbackInputStreamTest\n{\n \
  \ public static void main(String args[]) throws IOException\n  {\n    FileInputStream\
  \ fin = new FileInputStream(\"A.txt\");\n    PushbackInputStream p1=new PushbackInputStream(fin);\n\
  \    int ch=p1.read();\n    System.out.println((char)ch);\n    ch=p1.read();\n \
  \   System.out.println((char)ch);\n    ch=p1.read();\n    System.out.println((char)ch);\n\
  \    p1.unread(ch);  // 或 p1.unread(‘z’);\n    ch=p1.read();\n    System.out.println((char)ch);\n\
  \  }\n}\n```\n输出:\n```\nA.txt\nm\na\nt\n```\n`PushbackInputStream` 是一种允许将字符推回流中的流。`PushbackInputStream`\
  \ 提供 `unread()` 方法，可以将一个或多个字符返回流中。除了 `InputStream` 类中常见的方法外，`PushbackInputStream`\
  \ 提供 `unread()` 方法，在此所示：\n\n| `public java.io.PushbackInputStream(java.io.InputStream,\
  \ int);` | 创建一个具有指定大小推回缓冲区的 `PushbackInputStream`，并保存其参数（输入的输入流）以备后用。这允许将多个字节返回输入流。\
  \ |\n| `public java.io.PushbackInputStream(java.io.InputStream);` | 创建一个 `PushbackInputStream`\
  \ 并保存其参数（输入的输入流）以备后用。这允许将一个字节返回输入流。 |\n| `public int read() throws java.io.IOException;`\
  \ | |\n| `public int read(byte[], int, int) throws java.io.IOException;` | |\n|\
  \ `public void unread(int) throws java.io.IOException;` | 通过将字节拷贝到推回缓冲区的头部来推回一个字节。\
  \ |\n| `public void unread(byte[], int, int) throws java.io.IOException;` | 通过将字节数组的一部分拷贝到推回缓冲区的头部来推回部分字节数组。\
  \ |\n| `public void unread(byte[]) throws java.io.IOException;` | 通过将字节数组拷贝到推回缓冲区的头部来推回一个字节数组。\
  \ |\n| `public int available() throws java.io.IOException;` | |\n| `public long\
  \ skip(long) throws java.io.IOException;` | |\n| `public boolean markSupported();`\
  \ | `PushbackInputStream` 的副作用是会使创建它的 `InputStream` 的 `mark()` 或 `reset()` 方法失效。使用\
  \ `markSupported()` 方法检查任何你将要使用 `mark()`/`reset()` 的流。 |\n| `public synchronized\
  \ void mark(int);` | |\n| `public synchronized void reset() throws java.io.IOException;`\
  \ | |\n| `public synchronized void close() throws java.io.IOException;` | |\n\n\
  注意：当推回缓冲区满时尝试返回字符，将抛出 `IOException`。\n\n### 示例 15.12\n\n```java\nimport java.io.*;\n\
  class PushbackInputStreamTest\n{\n  public static void main(String args[]) throws\
  \ IOException\n  {\n    FileReader fr = new FileReader(\"A.txt\");\n    PushbackReader\
  \ pr=new PushbackReader(fr);\n    int ch=pr.read();\n    System.out.println((char)ch);\n\
  \    ch=pr.read();\n    System.out.println((char)ch);\n    ch=pr.read();\n    System.out.println((char)ch);\n\
  \    pr.unread(ch);\n    ch=pr.read();\n    System.out.println((char)ch);\n  }\n\
  }\n```\n\n# SequenceInputStream\n\n`SequenceInputStream` 类是一种允许你连接多个 `InputStream`\
  \ 的字节流。`SequenceInputStream` 的构造与任何其他 `InputStream` 都不同。`SequenceInputStream` 构造函数使用一对\
  \ `InputStream` 类或一个 `InputStream` 类的 `Enumeration` 作为其参数：\n\n`SequenceInputStream(InputStream\
  \ is1, InputStream is2)` 初始化一个新的 `SequenceInputStream` 并记住这两个参数，它们将按顺序首先读取 `is1`\
  \ 然后是 `is2`，以向此 `SequenceInputStream` 提供字节。\n\n`SequenceInputStream(Enumeration\
  \ e)` 初始化一个新的 `SequenceInputStream` 并记住参数，该参数必须是一个产生运行时类型为 `InputStream` 对象的 `Enumeration`。\n\
  \n在操作上，该类从第一个 `InputStream` 满足读取请求直到其耗尽，然后切换到第二个。对于 `Enumeration` 的情况，它将继续遍历所有的\
  \ `InputStream` 直到最后一个流的结束。\n\n### 示例 15.13 在下面的示例中，提供文件名作为命令行参数：\n\n```java\nimport\
  \ java.io.*;\nclass SequenceInputStreamTest\n{ \n  public static void main(String\
  \ args[]) throws IOException\n  { \n    FileInputStream f1 = new FileInputStream(args[0]);\n\
  \    FileInputStream f2 = new FileInputStream(args[1]);\n    FileOutputStream f3\
  \ = new FileOutputStream(args[2]);\n    SequenceInputStream sis = new SequenceInputStream(f1,f2);\n\
  \    int c;\n  }\n}\n```\n\n\n\n\n\n```java\nwhile((c = sis.read()) != -1)\n{\n\
  \    f3.write(c);\n}\nf3.close();f1.close();f2.close();\n}\n```\n\nOutput:\n```java\n\
  SequenceInputStreamTest A.txt B.txt C.txt\n```\n\n### PrintStream\n\n它是一个字节流类，继承自\
  \ `FilterOutputStream`。`PrintStream` 为另一个输出流添加了功能，具体来说就是能够方便地打印各种数据值的表示形式。\n\n可选情况下，可以创建一个\
  \ `PrintStream` 以实现自动刷新（flush）；这意味着在写入字节数组后、调用其中一个 `println` 方法后，或者写入换行符或字节（`\\\
  n`）后，会自动调用 `flush` 方法。\n\n`PrintStream` 打印的所有字符都将使用平台的默认字符编码转换为字节，然后写入构造函数中指定的 `OutputStream`\
  \ 或 `File` 中。\n\n`PrintStream` 支持针对所有类型（包括 `object`）的 `print()` 和 `println()` 方法。如果参数不是简单类型，`PrintStream`\
  \ 方法将调用对象的 `toString()` 方法并打印结果。\n\n### 构造函数：\n\n- `PrintStream(File file)`: 创建一个新的打印流，不带自动行刷新，指向指定的文件。\n\
  - `PrintStream(String fileName)`: 创建一个新的打印流，不带自动行刷新，指向指定的文件名。\n- `PrintStream(OutputStream\
  \ out)`: 创建一个新的指向指定 `OutputStream` 的打印流。\n- `PrintStream(OutputStream out, boolean\
  \ autoFlush)`: 创建一个新的连接到指定 `OutputStream` 的打印流。\n\n![C:\\Users\\Made Man Harry\\\
  Desktop\\Stars\\Star_logo_yellow.jpg](img/image032.jpg)\n\n#### 示例 15.14\n\n```java\n\
  import java.io.*;\nclass PrintStreamTest\n{\n    public static void main (String\
  \ args[]) throws IOException\n    {\n        PrintStream ps = new PrintStream(System.out,\
  \ true);\n        ps.println(\"This is a string\");\n        int i = -7;\n     \
  \   ps.println(i);\n        double d = 4.5e-7;\n        ps.println(d);\n    }\n\
  }\n```\n\nOutput:\n```\nThis is a string\n-7\n4.5E-7\n```\n\n#### 示例 15.15\n\n```java\n\
  import java.io.*;\nclass PrintStreamTest2\n{\n    public static void main (String\
  \ argv[]) throws IOException\n    {\n        FileOutputStream fout = new FileOutputStream(\"\
  test.dat\");\n        PrintStream ps = new PrintStream(fout, true);\n        ps.println(\"\
  This is a string\");\n        int i = -7;\n        ps.println(i);\n        double\
  \ d = 4.5e-7;\n        ps.println(d);\n    }\n}\n```\n\n### PrintWriter\n\n虽然在 Java\
  \ 中使用 `System.out` 向控制台写入内容是允许的，但主要建议将其用于调试目的或示例程序。\n\n对于实际世界的程序，使用 Java 向控制台写入内容的推荐方法是通过\
  \ `PrintWriter` 流。`PrintWriter` 是基于字符的类之一。使用基于字符的类进行控制台输出可以让程序程序更容易国际化。\n\n### 构造函数：\n\
  \n- `PrintWriter(File file)`: 创建一个新的 `PrintWriter`，不带自动行刷新，用于写入指定的文件。\n- `PrintWriter(String\
  \ fileName)`: 创建一个新的 `PrintWriter`，不带自动行刷新，用于写入指定的文件。\n- `PrintWriter(OutputStream\
  \ out)`: 创建一个新的 `PrintWriter`，不带自动行刷新，用于写入指定的 `OutputStream`。\n- `PrintWriter(OutputStream\
  \ out, boolean autoFlush)`: 创建一个新的 `PrintWriter` 用于写入指定的 `OutputStream`。\n- `PrintWriter(Writer\
  \ out)`: 创建一个新的 `PrintWriter`，不带自动行刷新，用于写入指定的 `Writer`。\n- `PrintWriter(Writer out,\
  \ Boolean autoFlush)`: 创建一个新的 `PrintWriter` 用于写入指定的 `Writer`。\n\n最常用的构造函数是：\n`PrintWriter(OutputStream\
  \ os, boolean flushOnNewLine)`\n\n这里，`os` 是 `OutputStream` 类型的对象，`flushOnNewLine`\
  \ 控制 Java 每次调用 `println()` 方法时是否刷新输出流。如果 `flushOnNewLine` 为 `true`，则会自动进行刷新。如果为\
  \ `false`，则刷新不是自动的新的。\n\n`PrintWriter` 支持针对所有类型（包括对象）的 `print()` 和 `println()` 方法。如果参数不是简单类型，`PrintWriter`\
  \ 方法将调用对象的 `toString()` 方法并打印结果。\n\n要使用 `PrintWriter` 写入控制台，请指定 `System.out` 作为输出流，并在每个新行后刷新流。例如，这行代码创建了一个连接到控制台的\
  \ `PrintWriter`：\n`pw = new PrintWriter(System.out, true)`\n\n#### 示例 15.16\n\n\
  ```java\nimport java.io.*;\nclass PrintWriterTest\n{\n    public static void main\
  \ (String argv[]) throws IOException\n    {\n        PrintWriter pw = new PrintWriter(System.out,\
  \ true);\n        pw.println(\"This is a string\");\n        int i = -7;\n     \
  \   pw.println(i);\n        double d = 4.5e-7;\n        pw.println(d);\n    }\n\
  }\n```\nOutput:\n```\nThis is a string\n-7\n4.5E-7\n```\n\n#### 示例 15.17\n\n```java\n\
  import java.io.*;\nclass PrintWriter1\n{\n    public static void main (String argv[])\
  \ throws IOException\n    {\n        FileWriter fout = new FileWriter(\"test.dat\"\
  );\n        PrintWriter pw = new PrintWriter(fout, true);\n        pw.println(\"\
  This is a string\");\n        int i = -7;\n        pw.println(i);\n        double\
  \ d = 4.5e-7;\n        pw.println(d);\n    }\n}\n```\n\n#### 示例 15.18\n\n```java\n\
  import java.io.*;\nclass PrintWriterTest2\n{\n    public static void main (String\
  \ argv[]) throws IOException\n    {\n        PrintWriter pw = new PrintWriter(System.out,\
  \ true);\n        pw.println(\"This is a string\");\n        int i = -7;\n     \
  \   pw.println(i);\n        double d = 4.5e-7;\n        pw.println(d);\n    }\n\
  }\n```\n\n### PipedInputStream 和 PipedOutputStream\n\n管道输出流可以连接到管道输入流以创建一个通信管道。管道输出流是管道的发送端。管道输入流应该连接到管道输出流；管道输入流随后提供写入管道输出流的字节。\n\
  \n通常，数据由一个线程从 `PipedInputStream` 对象读取，并由另一个线程写入相应的 `PipedOutputStream`。在单个线程中使用这两个对象是不建议的，因为这可能导致线程死锁。管道输入流包含缓冲区，在限制范围内解耦了读写操作。\n\
  \n### 构造函数：\n\n- `PipedInputStream()`: 创建一个未连接的 `PipedInputStream`。\n- `PipedInputStream(PipedOutputStream\
  \ src)`: 创建连接到输出流 `src` 的 `PipedInputStream`。\n- `PipedOutputStream()`: 创建尚未连接到管道输入流的\
  \ `PipedOutputStream`。\n- `PipedOutputStream(PipedInputStream snc)`: 创建连接到指定管道输入流的\
  \ `PipedOutputStream`。\n\n#### 示例 15.19\n\n```java\nimport java.io.*;\nclass TextGenerator\
  \ extends Thread\n{\n    OutputStream out;\n    TextGenerator(OutputStream out)\n\
  \    {\n        this.out = out;\n    }\n    public void run()\n    {\n        try\n\
  \        {\n            try\n            {\n                for(byte b = 65; b<=90;\
  \ b++)\n                    out.write(b);\n            }\n            finally\n\
  \            {\n                out.close();\n            }\n        }\n       \
  \ catch(IOException e) \n        {\n            System.out.println(e);\n       \
  \ }\n    }\n}\nclass Pipe\n{\n    public static void main(String args[]) throws\
  \ IOException\n    {\n        PipedOutputStream out = new PipedOutputStream();\n\
  \        PipedInputStream in = new PipedInputStream(out);\n        TextGenerator\
  \ data = new TextGenerator(out);\n        data.start();\n        int ch;\n     \
  \   while((ch = in.read()) != -1)\n            System.out.print((char) ch);\n  \
  \  }\n}\n```\nOutput:\n```\nABCDEFGHIJKLMNOPQRSTUVWXYZ\n```\n\n\n\n\n它们的功能与 `PipedInputStream`\
  \ 和 `PipedOutputStream` 相同，区别在于它们是字符流。\n\n### 构造函数\n\n- `PipedReader()`: 创建一个 `PipedReader`，使其处于未连接状态。\n\
  - `PipedReader(PipedWriter src)`: 创建一个 `PipedReader`，使其连接到管道写入器 `src`。\n- `PipedWriter()`:\
  \ 创建一个尚未连接到管道读取器的 `PipedWriter`。\n- `PipedWriter(PipedReader snk)`: 创建一个连接到指定 `PipedReader`\
  \ 的管道写入器。\n\n### 示例 15.20\n\n```java\nimport java.io.*;\nclass TextGenerator extends\
  \ Thread {\n  Writer out;\n  TextGenerator(Writer out) {\n    this.out = out;\n\
  \  }\n  public void run() {\n    try {\n      try {\n        for(char c = 'a'; c<='z';\
  \ c++)\n          out.write(c);\n      }\n      finally {\n        try {\n     \
  \     Thread.sleep(2000);\n        }\n        catch(Exception e) {}\n      }\n \
  \     System.out.println(\"aaaaaaaaaaaaa\");\n      if(true)\n        return; //\
  \ IOException: pipe Broken\n      out.close(); //IOException: Write end dead\n \
  \   } //OK if thread finishes after closing the pipe\n    }\n    catch(IOException\
  \ e) { System.out.println(e);}\n  }\n}\nclass Pipe2 {\n  public static void main\
  \ (String argv[]) throws IOException {\n    PrintStream ps = new PrintStream(System.out);\n\
  \    PipedWriter out = new PipedWriter();\n    PipedReader in = new PipedReader(out);\n\
  \    TextGenerator data = new TextGenerator(out);\n    data.start(); int ch;\n \
  \   while((ch = in.read()) != -1)\n      System.out.print((char) ch);\n  }\n}\n\
  ```\n\n**输出:**\n```text\nabcdefghijklmnopqrstuvwxyzaaaaaaaaaaaaa\nException in thread\
  \ \"main\" java.io.IOException: Pipe broken\nat java.io.PipedReader.read(Unknown\
  \ Source)\nat Pipe2.main(Pipe2.java:43)\n```\n\n### 过滤字节流\n\n过滤流仅仅是底层输入流或输出流的包装器，用于透明地提供某些扩展层的功能。典型的扩展包括缓冲、压缩/解压缩等。过滤字节流是\
  \ `FilterInputStream` 和 `FilterOutputStream`。它们的构造函数为：\n\n- `FilterInputStream(InputStream\
  \ in)`: 通过将参数 `in` 赋值给字段 `this.in` 来创建一个 `FilterInputStream`，以便稍后使用。\n- `FilterOutputStream(OutputStream\
  \ out)`: 创建一个构建在指定的底层输出流之上的输出流过滤器。\n\n这些类中提供的方法与 `InputStream` 和 `OutputStream`\
  \ 中的方法相同。\n\n### 缓冲字节流\n\n对于面向字节的流，缓冲流通过向 I/O 流中附加内存缓冲区来扩展过滤流类。该缓冲区允许 Java 一次处理多个一个字节的\
  \ I/O 操作，从而提高性能。\n\n由于缓冲区的可用，流的跳过、标记和重置变得可能。缓冲字节流类是 `BufferedInputStream` 和 `BufferedOutputStream`。`PushbackInputStream`\
  \ 也实现了缓冲流接口。\n\n### BufferedInputStream\n\n 缓冲 I/O 是一种非常常见的性能优化。Java 的 `BufferedInputStream`\
  \ 类允许你将任何 `InputStream` “包装”为缓冲流并实现这种性能提升。\n\n`BufferedInputStream` 有两个构造函数：\n\n\
  - `BufferedInputStream(InputStream in)`: 创建一个 `BufferedInputStream` 并保存其参数输入流 `in`\
  \ 以备稍后使用。创建了一个内部缓冲区数组并存储在 `buf` 中。\n- `BufferedInputStream(InputStream in, int size)`:\
  \ 创建一个具有指定缓冲区大小的 `BufferedInputStream` 并保存其参数输入流 `in` 以备稍后使用。\n\n缓冲输入流还提供了支持在缓冲区向后移动的基础。除了任何\
  \ `InputStream` 中实现的 `read()` 和 `skip()` 方法外，`BufferedInputStream` 还支持 `mark()`\
  \ 和 `reset()` 方法。这种支持体现在 `BufferedInputStream.markSupported()` 返回 `true` 上。\n\n\
  ![C:\\Users\\Made Man Harry\\Desktop\\Stars\\Star_logo_yellow.jpg](img/image032.jpg)\n\
  \n### 示例 15.21\n\n```java\nimport java.io.*;\nclass BufferedInputStreamTest {\n\
  \  public static void main(String args[])throws IOException {\n    FileInputStream\
  \ fin=new FileInputStream(\"A.txt\");\n    BufferedInputStream b1 = new BufferedInputStream(fin);\n\
  \    for(int i=1; i<=10; i++)\n      System.out.print((char)b1.read());\n    System.out.println();\n\
  \    if(b1.markSupported()) {\n      b1.mark(500);\n      for(int i=1; i<=10; i++)\
  \ {\n        System.out.print((char)b1.read());\n      }\n      System.out.println();\n\
  \      b1.reset();\n      for(int i=1; i<=10; i++) {\n        System.out.print((char)b1.read());\n\
  \      }\n    }\n    else\n      System.out.println(\"Marking option is not availabel\"\
  );\n      b1.close();\n    fin.close();\n  }\n}\n```\n\n**输出:**\n```text\nmatrix\n\
  ```\n**注意:** `mark(32)` 保留了后续 32 个字节（这足够读取所有内容）。`mark()` 可以指定的参数必须小于缓冲区的大小。\n\n\
  ### BufferedOutputStream\n\n与缓冲输入不同，缓冲输出不提供额外功能。它仅用于提高性能。这里有两个构造函数：\n\n- `BufferedOutputStream(OutputStream\
  \ out)`: 创建一个写入指定底层输出流的缓冲输出流。它使用大小为 12 字节的缓冲区。\n- `BufferedOutputStream(OutputStream\
  \ out, int size)`: 创建一个具有指定缓冲区大小的写入指定输出流的缓冲输出流。\n\n#### 示例 15.22\n\n```java\nimport\
  \ java.io.*;\nclass BufferedOutputStreamTest {\n  public static void main(String\
  \ args[]) throws IOException {\n    BufferedOutputStream f = new BufferedOutputStream\
  \ (System.out,100);\n    byte[] buf = \"This will be displayed without flush()\\\
  n\".getBytes();\n    f.write(buf);\n    f.write(buf);\n    System.out.println(\"\
  testing...\");\n    //f.flush();\n    //f.close();\n  }\n}\n```\n\n**输出:**\n```text\n\
  testing...\n```\n（注：由于代码开启了缓冲区，如果不调用 flush 或 close，内容可能不会显示在屏幕上。）\n\n### BufferedReader\n\
  \n`BufferedReader` 通过缓冲输入提高性能。它有两个构造函数：\n\n- `BufferedReader(Reader in)`: 创建一个使用默认大小缓冲区的字符输入流。\n\
  - `BufferedReader(Reader in, int sz)`: 创建一个使用指定大小缓冲区的字符输入流。\n\n#### 示例 15.23\n\n\
  ```java\nimport java.io.*;\nclass BufferedReaderTest {\n  public static void main(String\
  \ args[])throws IOException {\n    FileReader fr=new FileReader(\"A.txt\");\n  \
  \  BufferedReader b1 = new BufferedReader(fr);\n    for(int i=1; i<=10; i++) {\n\
  \      System.out.print((char)b1.read());\n    }\n    System.out.println();\n  \
  \  if(b1.markSupported()) {\n      b1.mark(5);\n      for(int i=1; i<=10; i++) {\n\
  \        System.out.print((char)b1.read());\n      }\n      System.out.println();\n\
  \      b1.reset();\n      for(int i=1; i<=10; i++) {\n        System.out.print((char)b1.read());\n\
  \      }\n    }\n    else\n      System.out.println(\"Marking option is not availabel\"\
  );\n      b1.close();\n    fr.close();\n  }\n}\n```\n\n\n\n\n使用 `BufferedWriter`\
  \ 可以减少数据实际物理写入输出流的次数，从而提高性能。\n\n### 构造函数\n\n- `BufferedWriter(Writer out)`：创建一个使用默认大小输出缓冲区的缓冲字符输出流。\n\
  - `BufferedWriter(Writer out, int sz)`：创建一个使用指定大小输出缓冲区的缓冲字符输出流。\n\n### 示例 15.24\n\
  \n```java\nimport java.io.*;\n\nclass BufferedWriterTest\n{ \n  public static void\
  \ main(String args[]) throws IOException\n    {\n      BufferedWriter f = new BufferedWriter(new\
  \ PrintWriter(System.out));\n      String s  = \"This will not be displayed without\
  \ flush()\\n\";\n      char buf[ ] = new char[s.length()];\n      s.getChars(0,s.length(),buf,0);\n\
  \      f.write(buf);\n      f.write(buf);\n      System.out.println(\"testing...\"\
  );\n      f.write(buf);\n      //f.flush();\n      //f.close();\n    }\n  }\n```\n\
  \n**输出：**\n```\ntesting...\n```\n\n### 使用字节流处理原始数据数据类型\n\n基础输入和输出流提供了读/写方法，这些方法只能用于读/写字节或字符。\n\
  \n如果我们想读/写整数和双精度浮等原始数据类型，可以使用过滤器类作为现有输入输出流的包装器，以过滤原始流中的数据。\n\n用于创建处理原始数据类型的“数据流”的两个过滤器类是\
  \ `DataInputStream` 和 `DataOutputStream`。这些类使用了多重继承的概念（如下所示），并实现了父类和接口中包含的所有方法。\n\
  \n![image](img/image011.png)\n\n从文件输入输入的数据流可以如下创建：\n\n```java\nFileInputStream fis\
  \ = new FileInputStream(infile);\nDataInputStream dis = new DataInputStream(fis);\n\
  ```\n\n这些语句基本上是将 `dis` 包装在 `fis` 上并将其用作“过滤器”。同样，以下语句创建了输出数据流 `dos` 并将其封装在输出文件流 `fos`\
  \ 上：\n\n```java\nFileOutputStream fos = new FileOutputStream(outfile);\nDataOutputStream\
  \ dos = new DataOutputStream(fos);\n```\n\n### 示例 15.25\n\n以下程序演示了原始数据的读取和写入。\n\n\
  ```java\nimport java.io.*;\n\nclass ReadWritePrimitive\n{ \n  public static void\
  \ main (String args[]) throws IOException\n    { \n      File primitive = new File(\"\
  prim.dat\");\n      FileOutputStream fos = new FileOutputStream(primitive);\n  \
  \    DataOutputStream dos = new DataOutputStream(fos);\n      dos.writeInt(1999);\n\
  \      dos.writeDouble(222.44);\n      dos.writeBoolean(false);\n      dos.writeChar('X');\n\
  \      dos.close();\n      fos.close();\n      FileInputStream fis = new FileInputStream(primitive);\n\
  \      DataInputStream dis = new DataInputStream(fis);\n      System.out.println(dis.readInt());\n\
  \      System.out.println(dis.readDouble());\n      System.out.println(dis.readBoolean());\n\
  \      System.out.println(dis.readChar());\n      dis.close();\n      fis.close();\n\
  \    }\n  }\n```\n\n**输出：**\n```\n1999\n222.44\nfalse\nX\n```\n\n### 定义流\n\n`System`\
  \ 类包含了三个预定义的流变量——`in`、`out` 和 `err`。这些字段在 `System` 类中声明为 `public` 和 `static`。这意味着它们可以被程序的任何部分使用，而无需引用特定对象。\n\
  \n- `System.out` 指标准输出流。默认情况下，这是控制台。`System.out` 是 `PrintStream` 类型的对象。\n- `System.in`\
  \ 指标准输入，默认情况下是键盘。`System.in` 是 `InputStream` 类型的对象。\n- `System.err` 指标准错误流，默认情况下也是控制台。`System.err`\
  \ 是 `PrintStream` 类型的对象。\n\n这些是字节流，尽管它们通常用于从控制台读写字符。如果需要，你可以将它们封装在基于字符的内部。\n\n###\
  \ InputStreamReader\n\n`InputStreamReader` 是从字节流到字符流的桥梁；它读取字节并使用指定的字符集将其解码为字符。它使用的字符集可以明确指定，也可以接受平台的默认字符集。\n\
  \n**构造函数：**\n- `InputStreamReader(InputStream in)`：创建一个使用默认字符集的 `InputStreamReader`。\n\
  - `InputStreamReader(InputStream in, String charsetName)`：创建一个使用命名字符集的 `InputStreamReader`。\n\
  \n### 示例 15.26\n\n```java\nimport java.io.*;\n\nclass InputStreamReaderTest\n{ \n\
  \  public static void main (String argv[]) throws IOException\n    { \n      char\
  \ c;\n      InputStreamReader is = new InputStreamReader(System.in);\n      System.out.println(\"\
  Enter characters, 'q' to quit\");\n      c = (char)is.read();\n      while(c!='q')\n\
  \        { \n          System.out.print(c);\n          c = (char)is.read();\n  \
  \      }\n    }\n  }\n```\n\n**输出：**\n```\nEnter characters, 'q' to quit\nabcd\n\
  q\n```\n\n### 示例 15.27\n\n对上一个示例进行了修改，利用缓冲来提高性能。\n\n```java\nimport java.io.*;\n\
  \nclass BufferedReaderTest\n{ \n  public static void main (String args[]) throws\
  \ IOException\n    { \n      char c;\n      BufferedReader br = new BufferedReader(new\
  \ InputStreamReader(System.in));\n      System.out.println(\"Enter characters, 'q'\
  \ to quit\");\n      c = (char)br.read();\n      while(c!='q')\n        { \n   \
  \       System.out.print(c);\n          c = (char)br.read();\n        }\n    }\n\
  \  }\n```\n\n**输出：**\n```\nEnter characters, 'q' to quit\nabcd\n```\n\n### 示例 15.28\n\
  \n`InputStreamReader` 不提供 `readLine()` 方法，因此 `InputStreamReader` 连接到提供 `readLine()`\
  \ 方法的 `BufferedReader`。\n\n```java\nimport java.io.*;\n\nclass BufferedReaderTest\n\
  { \n  public static void main (String argv[]) throws IOException\n    { \n     \
  \ BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n  \
  \    System.out.println(\"Enter 'stop' to quit\");\n      String str = br.readLine();\n\
  \      while(!str.equals(\"stop\"))\n        { \n          System.out.println(\"\
  Your Name:\"+str);\n          str = br.readLine();\n        }\n    }\n  }\n```\n\
  \n**输出：**\n```\nEnter 'stop' to quit\nHarry Feat\nYour Name:Harry Feat\nstop\n```\n\
  \n### OutputStreamWriter\n\n`OutputStreamWriter` 是从字符流到字节流的桥梁：写入它的字符使用指定的字符集编码为字节。它使用的字符集可以明确指定，也可以接受平台的默认字符集。\n\
  \n**构造函数：**\n- `OutputStreamWriter(OutputStream out)`：创建一个使用默认编码的 `OutputStreamWriter`。\n\
  - `OutputStreamWriter(OutputStream out, String charsetName)`：创建一个使用命名字符集的 `OutputStreamWriter`。\n\
  \n### 读取控制台输入\n\n在 Java 1.0 中，执行控制台输入的唯一方法是使用字节流，旧代码仍然存在。今天，使用字节流读取控制台输入在技术上可行，但这样做可能需要使用已弃的方法，且这种方法并不推荐。\n\
  \n在 Java 中，控制台输入通过读取 `System.in` 实现。为了获取到控制台的字符流，你需要将 `System.in` 封装在 `InputStreamReader`\
  \ 对象中，然后将其封装在 `BufferedReader` 对象中以提高性能。\n\n### 示例 15.29\n\n此示例演示了我们可以直接从 `System.in`\
  \ 读取。\n\n```java\nimport java.io.*;\n\nclass ReadFromConsole\n{ \n  public static\
  \ void main (String arg[]) throws IOException\n    { \n      char c;\n      System.out.println(\"\
  Enter characters, 'q' to quit\");\n      c = (char) System.in.read();\n      while(c!='q')\n\
  \        { \n          System.out.print(c);\n          c = (char) System.in.read();\n\
  \        }\n    }\n  }\n```\n\n\n\n\n从控制台读取的正确方法是将 `System.in` 封装在 `InputStreamReader`\
  \ 中，并进一步封装在 `BufferedReader` 中以提高性能并实现一次输入一行。相关的示例在之前关于 `InputStreamReader` 类的章节中已经介绍过。\n\
  \n## 控制台输出\n\n使用 `print()` 和 `println()` 最容易地完成控制台输出。这些方法由 `PrintStream` 类定义（它是\
  \ `System.out` 所引用的对象的类型）。尽管 `System.out` 是一个字节流，但用它来进行简单的程序输出仍然是可以的。\n\n然而，基于字符的替代方案是正确的选择。因为\
  \ `PrintStream` 是派生自 `OutputStream` 的输出流，它还实现了低级方法 `write()`。因此，可以使用 `write()` 向控制台写入内容。`PrintStream`\
  \ 定义的最简单 `write()` 形式是：\n\n```java\nvoid write(int byteval)\n```\n\n该方法将 `byteval`\
  \ 指定的字节写入流中。尽管 `byteval` 被声明为整数类型，但只有低 8 位会被写入。\n\n###  示例 15.30\n\n```java\nimport\
  \ java.io.*;\n\nclass WriteTest\n{\n  public static void main (String argv[ ]) throws\
  \ IOException\n  {\n    int b;\n    b = 'A';\n    System.out.write(b);\n    // System.out.flush();to\
  \ flush\n    System.out.write('\\n');//to flush\n  }\n}\n```\n\n输出：\n```\nA\n```\n\
  \n注意：你不会经常使用 `write()` 来执行控制台输出，因为 `print()` 和 `println()` 使用起来要简单得多。\n\n## 序列化\n\
  \n序列化是将对象的状态写入字节流的过程。当你想要将对象的状态存储到字节流时，这种方法非常有用。当你想要将程序的状态保存到持久化存储区域（如文件）时，这种方法同样有用。在以后以后，你可能可以通过反序列化过程来恢复这些对象。\n\
  \n实现 RMI 也需要序列化。RMI 允许一台机器上的 Java 对象调用另一台机器上 Java 对象的方法。对象可以作为远程方法的参数传递。发送端对对象进行序列化并转换。接收端对其进行反序列化。\n\
  \n如果你尝试对对象图顶部的对象进行序列化，所有其他引用的对象都会被递归定位并序列化。\n\n同样，在反序列化过程中，所有这些对象及其引用都会被正确存储。被声明为\
  \ `transient` 或 `static` 的变量不会被序列化机制保存。\n\n## Externalizable 接口\n\nJava 的序列化和反序列化机制的设计使得保存和恢复对象状态的大部分工作可以自动完成。\n\
  \n然而，在某些情况下，程序员可能需要对这些过程进行控制。例如，使用压缩或加密技术可能是理想的。`Externalizable` 接口是为了这些情况设计的。实现\
  \ `Externalizable` 接口的类也可以被序列化反序列化。\n\n但控制权在用户手中，即用户可以决定序列化和反序列化的部分。序列化代码写在 `readExternal()`\
  \ 方法中，反序列化代码写在 `writeExternal()` 方法中。\n\n### Externalizable 接口的方法：\n\n```java\n\
  void readExternal(ObjectInput in)\n```\n\n对象实现 `readExternal` 方法，通过调用基本数据类型的 `DataInput`\
  \ 方法以及用于对象、字符串和数组的 `readObject` 方法来恢复其内容。\n\n```java\nvoid writeExternal(ObjectOutput\
  \ out)\n```\n\n对象实现 `writeExternal` 方法，通过调用其基本值的 `DataOutput` 方法或调用用于对象、字符串和数组的\
  \ `ObjectOutput` 的 `writeObject` 方法来保存其内容。\n\n## ObjectOutput 接口\n\n`ObjectOutput`\
  \ 接口扩展了 `DataOutput` 接口并支持对象序列化。除了 `DataOutput` 接口定义的方法外，`ObjectOutput` 接口只定义了一个方法：\n\
  \n```java\nVoid writeObject(Object object)\n```\n\n该方法被用于序列化一个对象。`ObjectOutput`\
  \ 接口的所有方法在错误条件下都会抛出 `IOException`。\n\n### ObjectOutputStream\n\n`ObjectOutputStream`\
  \ 类扩展了 `OutputStream` 类并实现了 `ObjectOutput` 接口。它负责将对象写入流中。\n\n### 构造函数：\n\n```java\n\
  ObjectOutputStream(OutputStream out)\n```\n\n创建一个写入指定 `OutputStream` 的 `ObjectOutputStream`。参数\
  \ `out` 是将要写入序列化对象的输出流。\n\n### 写入对象的方法：\n\n```java\nvoid writeObject(Object obj)\n\
  ```\n\n将对象写入底层存储或流。\n\n––––––––\n\n## ObjectInput 接口\n\n`ObjectInput` 接口扩展了 `DataInput`\
  \ 接口。它支持对象序列化。除了 `DataInput` 接口定义的方法外，`ObjectInput` 接口仅定义了一个方法：\n\n––––––––\n\n\
  ```java\nObject readObject()\n```\n\n该方法被用于反序列化对象。\n\n### ObjectInputStream\n\n\
  `ObjectInputStream` 类扩展了 `InputStream` 类并实现了 `ObjectInput` 接口。`ObjectInputStream`\
  \ 负责从流中读取对象。\n\n### 构造函数：\n\n```java\nObjectInputStream(InputStream in)\n```\n\n\
  创建一个从指定的 `InputStream` 读取的 `ObjectInputStream`。参数 `in` 是应当读取序列化对象的输入流。\n\n反序列化方法为：\n\
  \n```java\nObject readObject()\n```\n\n从 `ObjectInputStream` 读取一个对象。\n\n### 示例 15.31\n\
  \n```java\nimport java.io.*;\n\nclass SerializationTest\n{\n  public static void\
  \ main (String args[]) throws IOException\n  {\n    try\n      {\n        MyClass\
  \ object1 = new MyClass(\"Hello\", 123, 1.3e3);\n        MyClass object2 = new MyClass(\"\
  Hello1\", 1, 2);\n        object3.x = 200;\n        A object5 = new A();\n     \
  \   System.out.println(object1);\n        System.out.println(object2);\n       \
  \ FileOutputStream fos = new FileOutputStream(\"serial.dat\");\n        ObjectOutputStream\
  \ oos = new ObjectOutputStream(fos);\n        oos.writeObject(object1);\n      \
  \  oos.writeObject(object2);\n        oos.flush();\n        oos.close();\n     \
  \ }\n      catch(Exception e)\n      {\n        System.out.println(e);\n      }\n\
  \      try\n      {\n        MyClass object3, object4;\n        FileInputStream\
  \ fis = new FileInputStream(\"serial.dat\");\n        ObjectInputStream ois = new\
  \ ObjectInputStream(fis);\n        object3 = (MyClass) ois.readObject();\n     \
  \   object4 = (MyClass) ois.readObject();\n        ois.close();\n        System.out.println(\"\
  After deserialization\");\n        System.out.println(object3);\n        System.out.println(object4);\n\
  \      }\n      catch(Exception e)\n      {\n        System.out.println(e);\n  \
  \    }\n  }\n}\n\nclass MyClass implements Serializable\n{\n  String s;\n  int i=100;\n\
  \  double d;\n  MyClass(String s, int i, double d)\n  {\n    this.s = s;\n    this.i\
  \ = i;\n    this.d = d;\n  }\n  public String toString()\n  {\n    return \"s =\
  \ \"+ s +\"; i = \"+ i + \" ; d = \" +d;\n  }\n}\n```\n\n输出：\n```\ns = Hello; i\
  \ = 123 ; d = 1300.0\ns = Hello1; i = 1 ; d = 2.0\nAfter deserialization\ns = Hello;\
  \ i = 123 ; d = 1300.0\ns = Hello1; i = 1 ; d = 2.0\n```\n\n注意：我们可以在一个文件中保存多个相同类型的对象，也可以在同一个文件中保存不同类型的对象。\n\
  \n### 示例 15.32\n\n此示例演示了 `transient` 和 `static` 变量在序列化过程中不会被持久化。\n\n```java\nimport\
  \ java.io.*;\n\nclass SerializationTest2\n{\n  public static void main (String args[])\
  \ throws IOException\n  {\n    try\n      {\n        MyClass object1 = new MyClass(\"\
  Hello\", 123, 1.3e3);\n        MyClass object2 = new MyClass(\"Hello1\", 1, 2);\n\
  \        object3.x = 200;\n        A object5 = new A();\n        System.out.println(object1);\n\
  \        System.out.println(object2);\n        System.out.println(object5);\n  \
  \    }\n  }\n}\n```\n\n\n\n\n```java\nFileOutputStream fos = new FileOutputStream(\"\
  serial.dat\");\nObjectOutputStream oos = new ObjectOutputStream(fos);\noos.writeObject(object1);\n\
  oos.writeObject(object3);\noos.writeObject(object5);\nobject3.x = 400;\noos.flush();\n\
  oos.close();\n}\ncatch(Exception e) {\n  System.out.println(e);\n}\ntry {\n  MyClass\
  \ object2, object4;\n  A object6;\nFileInputStream fis = new FileInputStream(\"\
  serial.dat\");\nObjectInputStream ois = new ObjectInputStream(fis);\nobject2 = (MyClass)\
  \ ois.readObject();\nobject4 = (MyClass) ois.readObject();\nobject6 = (A) ois.readObject();\n\
  ois.close();\nfis.close();\nSystem.out.println(\"After deserialization\");\nSystem.out.println(object2);\n\
  System.out.println(object4);\nSystem.out.println(object6);\n}\ncatch(Exception e)\
  \ {\n  System.out.println(e);\n}\n```\n\nclass MyClass implements Serializable {\n\
  \  String s;\n  transient private int i=100;\n  public static int x = 10;\n  double\
  \ d;\n  MyClass(String s, int i, double d) {\n    this.s = s;\n    this.i = i;\n\
  \    this.d = d;\n    x = 100;\n  }\n  public String toString() {\n    return \"\
  s = \" + s + \"; i = \"+ i + \" ;d = \" + d +\"; x = \"+ x;\n  }\n}\n\nclass A implements\
  \ Serializable {\n  public String toString() {\n    return \"Class A\";\n  }\n}\n\
  ```\n\n### 示例 15.33 使用 Externalizable\n\n```java\nimport java.io.*;\nclass SerializationTest1\
  \ {\n  public static void main (String args[]) throws IOException {\n    try {\n\
  \      MyClass object1 = new MyClass(\"Hello\", 99, 123.45);\n      System.out.println(object1);\n\
  \      FileOutputStream fos = new FileOutputStream(\"serial.dat\");\n      ObjectOutputStream\
  \ oos = new ObjectOutputStream(fos);\n      System.out.println(\"before writing\
  \ object\");\n      oos.writeObject(object1);\n      System.out.println(\"after\
  \ writing object\");\n      oos.flush();\n      oos.close();\n    }\n    catch(Exception\
  \ e) {\n      System.out.println(e);\n    }\n    try {\n      MyClass object2;\n\
  \      FileInputStream fis = new FileInputStream(\"serial.dat\");\n      ObjectInputStream\
  \ ois = new ObjectInputStream(fis);\n      System.out.println(\"before reading object\"\
  );\n      object2 = (MyClass) ois.readObject();\n      System.out.println(\"after\
  \ reading object\");\n      ois.close();\n      System.out.println(object2);\n \
  \   }\n    catch(Exception e) {\n      System.out.println(e);\n    }\n  }\n}\nclass\
  \ MyClass implements Serializable {\n  String s;\n  int i=100;\n  double d;\n  public\
  \ MyClass() {}; It is must\n  public MyClass(String s, int i, double d) {\n    this.s\
  \ = s;\n    this.i = i;\n    this.d = d;\n  }\n  public String toString() {\n  \
  \  return \"s = \"+ s +\"; i = \"+ i + \" ;d = \" +d;\n  }\n  public void writeExternal(ObjectOutput\
  \ oos) throws IOException {\n    System.out.println(\"Inside writeExternal\");\n\
  \    oos.writeObject(s);\n    oos.writeInt(i);\n    oos.writeDouble(d);\n  }\n \
  \ public void readExternal(ObjectInput ois) throws ClassNotFoundException, IOException\
  \ {\n    System.out.println(\"Inside readExternal\");\n    s = (String) ois.readObject();\n\
  \    i = ois.readInt();\n  }\n}\n```\n\n输出：\ns = Hello; i = 99 ;d = 123.45\nbefore\
  \ writing object\nafter writing object\nbefore reading object\nafter reading object\n\
  s = Hello; i = 99 ;d = 123.45\n\n**注意：**\n在反序列化过程中，对象将使用默认构造函数进行构造（与 `serializable`\
  \ 接口不同），然后进行初始化。状态的恢复应该在 `readExternal()` 中完成。同样，在序列化期间，只保存类标识。任何状态都必须在 `writeExternal()`\
  \ 中显式保存。\n\n# 章节：∞ 16 ∞ (Applet)\n\n## 简介\nApplet 是一种设计用于在互联网上传输并在如 Internet Explorer\
  \ 或 Netscape Navigator 等兼容 Java 的网络浏览器在客户端上执行的应用程序。Applet 也是 Java 程序，但它们存在（存储）在服务器上。\n\
  \nApplet 无法像独立应用程序那样执行。Applet 只能通过嵌入 HTML 页面（类似于图像或声音文件）来执行。运行 applet 需要访问一个嵌入了\
  \ applet 的 HTML 页面。当网络浏览器下载此类 HTML 页面时，随后会加载包含 applet 代码的可执行文件，然后在本地机器上执行它。\n\n\
  Applet 到达客户端后，它对资源的访问受到限制，这样它就可以不破坏数据完整性的情况下生成任意的用户界面。\n\n### Applet 架构\nApplet\
  \ 与普通程序不同：\n\n* Applet 是基于 GUI（窗口化）的程序\n* Applet 是事件驱动的\n\n当一个普通 Java 程序（非基于 GUI\
  \ 的）需要输入时，它会提示用户然后调用某些输入方法，例如 `readLine()`，即交互是由程序发起的。这并不是基于 GUI 的程序的行为方式。是用户与程序发起交互，而不是程序发起动作。例如，在文字处理软件中，用户通过点击不同的按钮发起动作，这产生一个事件并相应地执行某些代码。\n\
  \nApplet 使用 `awt` 包（抽象窗口工具包）来提供 GUI 并处理事件。之所以被称为 AWT，是因为它完全依赖于底层操作系统的功能。\n\nApplet\
  \ 类似于一组中断服务例程。Applet 会等待直到某个事件发生。`awt` 通过调用由 applet 提供的事件处理程序来通知 applet 事件。一旦发生这种情况，applet\
  \ 必须采取适当行动，然后迅速将控制权还给 AWT。这是一个关键点。在大多数情况下，我们的 applet 不应该进入一种长时间保持控制的运行“模式”。相反，它必须响应事件并执行特定操作，然后将控制权返回给\
  \ AWT 运行系统。\n\n在我们的 applet 需要自行执行重复性任务的情况下下（例如，在窗口中显示滚动滚动消息），我们必须启动一个额外的执行线程。\n\n\
  ### 编写 Applet\n所有的 applet 都是 `Applet` 类的子类。`Applet` 类位于 `java.applet` 包中。`Applet`\
  \ 类的层次结构如下：\n\n`java.lang.Object`\n|\n`java.awt.Component`\n|\n`java.awt.Container`\n\
  |\n`java.awt.Panel`\n|\n`java.applet.Applet`\n\n`Applet` 类为 applet 执行提供了所有支持，例如启动和停止。它还提供了加载和显示图像的方法。它还为所有窗口化活动提供了必要的支持。\n\
  \n我们扩展 `Applet` 类的子类必须始终声明为 `public`，因为它是由网络浏览器实例化并执行的。浏览器在实例化 applet 时使用无参数构造函数，因此必须提供具有\
  \ `public` 可见性的无参数构造函数。\n\n\n\n\n建议我们不要在 `Applet` 类中提供构造函数，因为在这种情况下编译器将提供默认的无参数构造函数。\n\
  \n我们可以利用 `init()` 方法进行初始化。在编写 applet 代码时，我们通常会重写 `Applet` 类的一些方法，这些方法会在 applet 执行期间自动被调用。\n\
  \n重写 `paint()` 方法是非常常见的。`paint()` 方法中的代码主要在 `Applet` 窗口中显示输出。\n\n### 示例 16.1 (App1.java)\n\
  以下程序演示了一个简单的 applet，它只是在窗口内显示“Hello World”。无论我们在 applet 的 `paint` 方法中绘制/显示什么内容，它都会出现在\
  \ applet 的窗口中。\n\n在接下来的示例中，applet 窗口的背景颜色设置为红色，前景颜色设置为绿色，因此背景将显示为红色，文本“Hello Word”将以绿色显示出来。\n\
  \n```java\n1. import java.awt.*;\n2. import java.applet.Applet;\n3. /*<applet code=\
  \ \"App1\" width =500 height=100></applet>*/\n4. public class App1 extends Applet\n\
  5. { \n6.   public void init()\n7.   {\n8.         setBackground(Color.red);\n9.\
  \         setForeground(Color.green);\n10.    }\n11.    public void paint(Graphics\
  \ g)\n12.    { \n13.      g.drawString(\"Hello World\",20,20);\n14.    }\n15. }\n\
  ```\n\n**输出：**\n\n![image](img/image094.png)\n\n### 执行 Applet\nApplet 不由基于控制台的 Java\
  \ 运行时解释器执行。我们有两种方法可以运行 applet。\n\n1. 在与 Java 的 Web 浏览器中执行 applet。\n2. 使用 `appletviewer`，例如标准的\
  \ SDK 工具 `appletviewer`。`appletviewer` 会在一个窗口中执行我们的 applet。这是测试我们 applet 最快且最简单的方法。\n\
  \n#### 在 Web 浏览器中执行 Applet\n我们需要编写一个短的 HTML 文本文件，其中包含适当的 `APPLET` 标签。applet 标签必须至少包含以下三个属性：\n\
  * `Code`\n* `Width`\n* `Height`\n\n属性 `code` 的值指定包含 applet 代码的类名。属性 `width` 和 `height`\
  \ 分别指定 applet 窗口的宽度和高度。\n\n这里是嵌入了 applet \"App1\" 的 HTML 文件 `RunApp.Html`。\n\n```html\n\
  <html>\n<head>\n<title>Simple Applet</title>\n</head>\n<body>\n<h1>Simple “Hello\
  \ World” Application </h1>\n<applet code= “App1” width =500 height=100>\n</applet>\n\
  </body>\n</html>\n```\n\n你可以通过在 Web 浏览器中打开文件 `RunApp.html` 来执行该 applet-applet。该文件可以存在于本地文件系统中，也可以从\
  \ Web 服务器加载。\n\n#### 使用 appletviewer 执行 Applet\n然而，存在一种更方便的方法可以让我们用来加速测试。只需在你的 Java\
  \ 源代码文件中包含一个带有该 `APPLET` 标签的注释即可。通过这样做，我们的代码就包含了必要 HTML 语句的原型文档，我们只需通过带有 Java 源代码文件启动\
  \ `appletviewer` 即可测试编译后的输出。如果我们使用这种方法，那么在编译后我们可以如下所示执行 applet：\n\n```bash\nappletviewer\
  \ SimpleApplet.Java\n```\n\n### Applet 生命周期方法\n`Applet` 重写了一组方法，这些方法提供了浏览器或 `appletviewer`\
  \ 与 applet 接口并控制其执行的基本机制。\n\n这些方法也被称为生命周期方法，因为浏览器或 applet 查看器会在 applet 生命周期的不同阶段自动调用它们。总共有五种生命周期方法：\n\
  * `public void init ()`\n* `public void start ()`\n* `public void stop ()`\n* `public\
  \ void destroy ()`\n* `public void paint (Graphics g)`\n\n这五个方法中的四个个：`init()`、`start()`、`stop()`\
  \ 和 `destroy()` 定义在 applet 类中。\n\n`paint()` 是由 `awt Component` 类定义的，并提供了所有这些方法的默认实现。Applet\
  \ 不需要重写它们没有使用的方法。然而，非常简单的 applet 不需要定义它们。\n\n#### Applet 的初始化与终止\n当 applet 开始运行时，将按顺序调用以下方法：\n\
  1. `init( `\n2. `start()`\n3. `paint()`\n\n当 applet 终止时，将发生以下方法调用序列：\n1. `stop()`\n\
  2. `destroy()`\n\n#### init() 方法\n这是第一个被调用的方法。我们在这里初始化变量并为其他初始化活动编写代码。该方法在 applet\
  \ 生命周期周期内仅在实例化后立即被调用一次。\n\n#### start() 方法\n`start()` 方法在 `init()` 之后被调用。它也被用于在\
  \ applet 停止后重启它。`init()` 在第一次加载 applet 时调用一次，而 `start()` 在每次 applet 的 HTML 文档显示在屏幕上时被调用。因此，如果用户离开网页并返回，applet\
  \ 将在 `start()` 处恢复执行。\n\n#### paint() 方法\n`paint()` 方法在 `init()` 和 `start()` 之后被调用，当\
  \ applet 开始执行时。每当 applet 窗口需要重绘时都会调用它。这种情况可能由于多种原因引起，例如窗口被覆盖或最小化后恢复。\n\n#### Stop\
  \ 方法\n`stop()` 方法在浏览器离开包含 applet 的 HTML 文档或 applet 不可见时被调用。我们可以在 `stop()` 中暂停线程。\n\
  \n#### destroy() 方法\n`destroy()` 方法在环境确定 applet 需要从内存中移除时被调用。此时，我们可以释放 applet 可能正在使用的资源。该方法在\
  \ `stop()` 之后调用。\n\n### 示例 16.2\n一个简单的 applet，将背景颜色设置为青色，前景颜色设置为红色，并显示消息，演示了 `init()`、`start()`\
  \ 和 `paint()` 方法在 applet 开始时的调用顺序。\n\n```java\n1. import java.awt.*;\n2. import\
  \ java.applet.*;\n3. /*<applet code= \"App2\" width =500 height=100></applet>*/\n\
  4. public class App2 extends Applet\n5. { \n6.   String msg=\"\";\n7.   public void\
  \ init()\n8.   { \n9.      System.out.println(\"Inside init\");\n10.      setBackground(Color.cyan);\n\
  11.      setForeground(Color.red);\n12.      msg = \"Inside init ()\";\n13.    }\n\
  14.   public void start()\n15.   { \n16.      System.out.println(\"Inside start\"\
  );\n17.      msg += \"Inside start ()\";\n18.    }\n19.   public void stop()\n20.\
  \   { \n21.      System.out.println(\"Inside stop\");\n22.      msg += \"Inside\
  \ stop ()\";\n23.    }\n24.   public void paint (Graphics g)\n25.   { \n26.    \
  \  System.out.println(\"Inside paint\");\n27.      msg += \"Inside paint ()\";\n\
  28.      g.drawString(msg,10,30);\n29.    }\n30.   public void destroy()\n31.  \
  \ {\n32.      System.out.println(\"Inside destroy\");\n33.    }\n34. }\n```\n\n\
  **输出：**\n\n![image](img/image077.png)\n\n### 动态 Applet\nApplet 窗口中显示的输出可以是动态的。例如，我们可以显示一个移动横幅。applet\
  \ 还可以用于此类应用程序：通过从服务器获取并显示板赛比分和其他统计数据；显示股票价格等。\n\n示例 16.3\n以下示例显示了一个移动横幅。它演示了使用 `repaint()`\
  \ 方法来刷新显示。该 applet 在 applet 窗口中从右向左滚动消息。\n\n由于消息滚动是一项重复性任务，它是由一个独立的线程执行的，该线程在 applet\
  \ 初始化时创建。此程序还演示了可以在 `stop()` 方法中释放资源，并在 `start()` 方法中重新获取。\n\n```java\n1. import\
  \ java.awt.*;\n2. import java.applet.*;\n```\n\n\n\n\n```java\n/*<applet code=\"\
  App3\" width=500 height=100></applet>*/\n\npublic class App3 extends Applet implements\
  \ Runnable\n{\n    String msg=\"A Simple Moving Banner.\" ;\n    Thread t = null;\n\
  \    boolean stopFlag;\n    public void init ()\n    {\n      setBackground(Color.cyan);\n\
  \      setForeground(Color.red);\n    }\n    public void start()\n    {\n      t=new\
  \ Thread(this);\n      stopFlag = false ;\n      t.start ();\n    }\n    public\
  \ void stop()\n    {\n      stopFlag=true;\n      t=null;\n    }\n    public void\
  \ paint(Graphics g)\n    {\n      g.drawString(msg,50,30);\n    }\n    public void\
  \ run()\n    {\n      for (;;)\n      {\n        repaint();\n        try\n     \
  \   {\n          Thread.sleep(250);\n        }\n        catch(InterruptedException\
  \ e)\n        {\n          System.out.println(e);\n        }\n        msg = msg.substring\
  \ (1) + msg.charAt(0);\n        if (stopFlag)\n          break;\n      }\n    }\n\
  }\n```\n\n输出：\n\n![image](img/image037.png)\n\n## 使用状态窗口\n\n除了在窗口中显示信息外，applet 还可以向运行它的浏览器窗口或\
  \ `appletviewer` 状态窗口输出消息。\n\n要实现这一点，请调用 `showStatus()` 并传入我们想要显示的字符串。状态窗口是向用户提供\
  \ applet 正在发生情况的反馈、建议选项或报告某些类型错误的好地方。\n\n状态窗口也是极佳的调试助手（帮助），因为为我们提供了一个输出 applet 信息的简单方法。\n\
  \n### 示例 16.4：以下示例演示了如何使用状态窗口。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
  /*<applet code=\"App4\" width=500 height=100></applet>*/\npublic class App4 extends\
  \ Applet\n{\n    public void init( )\n    {\n      setBackground(Color.cyan);\n\
  \    }\n    public void paint(Graphics g)\n    {\n      g.drawString(\"This is in\
  \ the applet window\",10,20);\n      showStatus(\"This is shown in the status window\"\
  );\n    }\n}\n```\n\n输出：\n\n![image](img/image055.png)\n\n## HTML 的 APPLET 标签\n\n\
  `APPLET` 标签用于从 HTML 文档和 `appletviewer` 启动 applet。\n\n`appletviewer` 会在单独窗口中执行找到的每个\
  \ `APPLET` 标签；而像 Netscape Navigator 和 Internet Explorer 这样的浏览器允许在页面上运行许多 applet。\n\
  \n标准 `APPLET` 标签的语法为：\n\n```html\n< APPLET\nCODE=applet class name\nCODEBASE=codebase\
  \ URL\nALT=alternate Text,\nNAME=appletInstancename\nWIDTH=pixels\nHEIGHT=pixels\n\
  ALIGN=alignment\nVSPACE=vertical space in pixels\nHSPACE=horizontal space in pixels\n\
  >\n\n<PARAM NAME=attributeName-1 VALUE=Attribute Value-1>\n<PARAM NAME=attributeName-2\
  \ VALUE=Attribute Value-2>\n——————\n<PARAM NAME=attributeName-N VALUE=Attribute\
  \ Value-N>\n.........在缺少 Java 的情况下显示的 HTML.........\n</APPLET>\n```\n\n### CODE\n\
  `CODE` 是一个必需属性，提供包含我们 applet 编译后的类文件的文件名。该文件相对于 applet 的 `CODEBASE` URL，`CODEBASE`\
  \ 是 html 文件所在的目录，或者是在设置了 `CODEBASE` 时指定的目录。\n\n### CODEBASE\n`CODEBASE` 是一个可选属性，用于指定\
  \ applet 代码的基础 URL，它是将在其中搜索 applet 可执行类文件（由 `CODE` 标签指定）的目录。\n\n如果未指定此属性，则使用 HTML\
  \ 文档的 URL 目录作为 `CODEBASE`。`CODEBASE` 不一定在读取 HTML 文档的主机上。\n\n### ALT\n`ALT` 标签是一个可选属性，用于指定当浏览器理解\
  \ `APPLET` 标签但当前无法运行 Java applet 时应该显示的短文本消息。这与我们为不支持 applet 的浏览器提供的备用 HTML 是不同的。\n\
  \n### NAME\n`NAME` 是一个可选属性，用于为 applet 实例指定名称。applet 必须命名，以便同一页面上的其他 applet 能够找到它们。\n\
  \n### WIDTH 和 HEIGHT\n`WIDTH` 和 `HEIGHT`：applet 以像素为单位的大小。\n\n### ALIGN\n`ALIGN`\
  \ 是可选属性，用于指定 applet 的对齐方式。\n\n### VSPACE 和 HSPACE\n`VSPACE` 和 `HSPACE`：`VSPACE`\
  \ 指定 applet 上方和下方的空间。`HSPACE` 指定 applet 两侧的空间。\n\n## PARAM 标签\n`PARAM` 标签允许我们在 HTML\
  \ 中指定参数。`PARAM` 标签有两个属性：`NAME` 和 `VALUE`。\n\n### 示例 16.5：此示例演示了如何向 HTML 页面传递参数。\n\
  \n```java\nimport java.awt.*;\nimport java.applet.*;\n/*<applet code=\"App5\" width=500\
  \ height=100>\n<param name=\"fontName\" value=\"Arial\">\n<param name=\"fontSize\"\
  \ value=\"30\">\n</applet>*/\npublic class App5 extends Applet\n{\n    String fName;\n\
  \    int fSize;\n    public void init ()\n    {\n      fName = getParameter(\"fontName\"\
  );\n      if (fName == null)\n        fName = \"Courier\";\n      fSize = Integer.parseInt(getParameter(\"\
  fontSize\"));\n      Font f1= new Font(fName, Font.PLAIN, fSize);\n      setFont(f1);\n\
  \    }\n    public void paint (Graphics g)\n    {\n      g.drawString (\"Font Name\
  \ : \" + fName, 0, 25);\n      g.drawString (\"Font Size : \" + fSize, 0, 50);\n\
  \      g.drawString (\"Hello world\", 0,75);\n    }\n}\n```\n\n## 获取 DocumentBase\
  \ 和 CodeBase\n通常，我们会创建需要显式加载媒体和文本的 applet。Java 允许 applet 从 HTML 文件所在的目录（文档基）加载数据。这些目录以\
  \ `URL` 对象的形式返回。它们可以与要加载的文件字符串拼接。为了实际加载另一个文件，我们将使用由 Applet 上定义的 `showdocument()`\
  \ 方法。\n\n### 示例 16.6：以下示例演示如何在 applet 代码中获取文档基和代码基。\n\n```java\nimport java.awt.*;\n\
  import java.applet.*;\nimport java.net.URL;\npublic class App6 extends Applet\n\
  {\n    public void paint (Graphics g)\n    {\n      URL u1 = getCodeBase( );\n \
  \     g.drawString (\"Code base:-\" + u1, 10,20);\n      URL u2 = getDocumentBase();\n\
  \      g.drawString (\"Document base:-\"+u2, 10,40);\n    }\n}\n```\n\nApp6.html\n\
  ```html\n<html>\n<body>\n<applet code=\"App6\" width=500 height=200></applet>\n\
  </body>\n</html>\n```\n\n## AppContext 和 Show Document()\nJava 的应用之一是使用活动图像和动画提供一种图形化的网页导航方式，比超文本使用的下划线字更有趣。为了允许我们的\
  \ applet 将控制权转移到另一个 URL，我们必须使用 Applet Context 接口定义的 `showDocument()` 方法。\n\n`Applet`\
  \ 是一个接口，允许从 applet 的执行环境中获取信息。当前执行 applet 的上下文通过调用 applet 类定义的 `getAppletContext()`\
  \ 方法获得。\n\n\n\n\n\n在一个 applet 中，一旦我们获取了 applet 的上下文（context），就可以通过调用 `showDocument()`\
  \ 方法将另一个文档显示出来。该方法没有返回值，如果执行失败也不会抛出异常，因此请谨慎使用。共有两个 `showDocument()` 方法。\n\n`void\
  \ ShowDocument(URL url)`\n用给定的 `URL` 替换当前查看的网页。\n\n`void ShowDocument (URL url,\
  \ String where)`\n在浏览器窗口的指定位置显示指定的文档。“where”的有效参数有：\n\n* `“_self”（在当前帧中显示）\n* `“_parent”`（在父帧中显示）\n\
  * `“_top”`（在最顶层帧中显示），以及\n* `“_blank”（（在新浏览器窗口中显示）\n\n### 示例 16.7\n\n下面的 applet 演示了\
  \ `Applet Context` 和 `showDocument()` 的用法。执行执行同时，它会获取当前的 applet 上下文，并使用该上下文将控制转移到名为\
  \ `A.html` 的文件。该文件必须与 applet 位于同一目录下。`Test.html` 可以包含任何你喜欢的有效超文本。\n\n```java\nimport\
  \ java.awt.*;\nimport java.applet.*;\nimport java.net.*;\npublic class App7 extends\
  \ Applet\n{ \n    AppletContext ac;\n    URL u1;\n    public void init()\n    {\n\
  \      setBackground(Color.cyan);\n    }\n    public void start( )\n    {\n    ac\
  \ = getAppletContext();\n    u1 = getCodeBase();\n    try\n    {\n      Thread.sleep(3000);\n\
  \      ac.showDocument(new URL(u1 + \"A.html\"),\"_blank\");\n    }\n    catch(MalformedURLException\
  \ e)\n    { \n      showStatus(\"Invalid URL\");\n      e.printStackTrace() ;\n\
  \    }\n    catch(InterruptedException e)\n    { \n      showStatus(\"Invalid URL\"\
  );\n      e.printStackTrace () ;\n    }\n  }\n  public void paint (Graphics g)\n\
  \    {\n    g.drawString(u1+\"A.html\",20,20);\n    try\n    {\n      Thread.sleep(3000);\n\
  \    }\n    catch(InterruptedException e)\n    {\n      System.out.println(e);\n\
  \    }\n  }\n}\n```\n\n**App7.html**\n```html\n<html>\n  <head>\n    <Title>Applet\
  \ Context Demo</Title>\n  </head>\n  <body>\n    <applet code=\"App7\" width=200\
  \ height=200></applet>\n  </body>\n</html>\n```\n\n**A.html**\n```html\n<html\n\
  \  <head>\n    <title>New Page</title>\n  </head>\n  <body bgcolor=blue text=red>\n\
  \    <h1>matrix</h1>\n  </body>\n</html\n```\n\n### 示例 16.8\n\n```java\nimport java.applet.*;\n\
  import java.awt.*;\nimport java.awt.event.*;\n/*<Applet code=\"CopyApp\" width=500\
  \ height=200></applet>*/\npublic class CopyApp extends Applet implements ActionListener\n\
  {\n    TextField tf1,tf2;\n    Button b1;\n    public void init()\n    {\n     \
  \ setForeground(Color.red);\n      Font f1=new Font(\"Arial\",\n      Font.BOLD+Font.ITALIC,20);\n\
  \      tf1=new TextField(8);\n      tf2=new TextField(8);\n      tf1.setFont(f1);\n\
  \      tf2.setFont(f1);\n      b1=new Button(\"Copy\");\n      b1.addActionListener(this);\n\
  \      b1.setFont(f1);\n      add(tf1);\n      add(tf2);\n      add(b1);\n    }\n\
  \  public void paint(Graphics g)\n    {\n      g.drawString(\"Matrix\",0,150);\n\
  \    }\n  public void actionPerformed(ActionEvent ae)\n    {\n      String s1=tf1.getText();\n\
  \      tf2.setText(s1);\n    }\n}\n```\n输出：\n![image](img/image10.png)\n\n### 示例\
  \ 16.9 使用 Applet 计算两个数字之和\n\n```java\nimport java.applet.*;\nimport java.awt.*;\n\
  import java.awt.event.*;\n/*<applet code \"SumApplet\" width=400 height=400></applet>\
  \ */\npublic class SumApplet extends Applet implements ActionListener\n{\n    TextField\
  \ tf1,tf2,tf3;\n    Label l1,l2,l3;\n    Button b1;\n    public void init()\n  \
  \  {\n      setLayout(new GridLayout(4,2));\n      l1 = new Label(\"No. 1\");\n\
  \      l2 = new Label(\"No. 2\");\n      l3 = new Label(\"Result\");\n      tf1\
  \ = new TextField(8);\n      tf2 = new TextField(8);\n      tf3 = new TextField(8);\n\
  \      b1 = new Button(\"Sum\");\n      b1.addActionListener(this);\n      add(l1);add(tf1);\n\
  \      add(l2);add(tf2);\n      add(l3);add(tf3);\n      add(b1);\n    }\n  public\
  \ void actionPerformed(ActionEvent ae)\n    {\n      Button abc = (Button)ae.getSource();\n\
  \    }\n  }\n```\n\n# 第 17 章\n# AWT（抽象窗口工具包）\n\n## 引言\nJava 提供了许多类来帮助我们设计图形界面（GUI）。这些类大多属于\
  \ `java.awt` 包，统称为抽象窗口工具包（AWT）。我们熟悉如 MS-WORD、MS-EXCEL 等软件，它们具有 GUI。AWT 帮助设计用户界面的三个重要部分是：\n\
  * 组件（Components）\n* 容器（Containers）\n* 布局管理器（Layout Managers）\n\n以上均起着重要作用。\n\n###\
  \ 组件\n组件是创建 GUI 的构建模块。组件是可以在屏幕上显示并与用户交互的对象。组件示例包括按钮、复选框和滚动条。`java.awt.Component`\
  \ 类是非菜单相关组件的抽象父类。也可以扩展创建量级组件。量级组件与原生窗口无关。\n\n某些组件类型（如按钮和滚动条）直接用于 GUI 控制。其他继承自 `Container`\
  \ 类的组件提供了特殊的组织方式。而 `TextField`、`TextArea`、`List` 等组件用于接收输入。`label` 是另一种类型的组件，其目的是为了给其他组件显示合适的标签。\n\
  \nJava 组件由 `java.awt.Component` 和 `java.awt.Menu` 超类的许多子类实现。组织这些大量类的一种方法是将它们分为：\n\
  * 可视化组件\n* 容器组件\n* 菜单组件\n\n组件层次结构：下图显示了 AWT 组件层次结构。\n![image](img/image27.png)\n\
  \n### 容器\n下图描述了容器层次结构：\n![image](img/image62.png)\n\n所有的窗口应用程序都始于屏幕上的顶级窗口。同样，所有基于\
  \ GUI 的应用程序也始于顶级窗口，这在 Java 术语中被称为顶级容器。\n\n容器也是包含其他组件的 Java 组件。组件只有通过添加到容器或放入容器内部才能变得可见。所有的\
  \ Java GUI 都存在于 applet 或 `Frame` 中。applet 和 frame 是两个顶级容器。\n\napplet 是 applet 的顶级容器，因此组件必须添加到其中。同样，frame\
  \ 是独立应用程序的顶级组件。对于更复杂的 GUI，将 applet 或 frame 划分为较小的区域是方便的。这些区域可能构成工具栏或单选按钮矩阵。在 Java\
  \ 中，GUI 子区域通常使用 `panel` 容器来实现。\n\n\n\n\n面板（Panels）就像小程序（applets）和框架（frames）一样，可以包含按钮、画布、复选框、滚动条、滚动面板、文本区域、文本字段和其他面板。\n\
  \n复杂的 GUI 有时会有非常复杂的面板嵌套层级，即面板中嵌套面板，以此类推，穿过许多层嵌套。\n\n由于容器也是组件，因此由于继承关系，组件所拥有的方法也同样适用于容器。\n\
  \n容器最常用的方法是 `add()` 方法，通过该方法将组件添加到容器中，其通用形式如下：\n\n```java\nvoid add (Component comp);\n\
  ```\n\n所有组件都是 `component` 类的子类，因此任何组件都可以使用 `add()` 方法添加到容器中。\n\n### 布局管理器（Layout\
  \ Manager）\n\n在向容器中添加组件时，一个重要的问题是关于组件的位置和大小的。组件的位置可以通过两种方式指定：\n\n(i) 绝对定位。\n\n(ii)\
  \ 相对定位。\n\n在绝对定位中，我们指定组件应该被添加的精确位置。这种方法为我们提供了精细的控制，如果我们仅为单一平台设计 GUI，这可能是最佳选择。\n\n\
  例如，可以通过指定组件左上角的坐标，将组件添加到容器水平方向的中间位置。\n\n我们可以根据容器的宽度和组件的宽度来计算这些坐标。但如果容器宽度发生或组件大小改变，组件将不会保持在中间。\n\
  \n另一种方法是相对定位，它可能不允许我们指定组件的精确位置，但在我们希望组件始终位于容器水平方向的中间位置这种情况下，这种方法可能更合适。\n\n我们可以通过指定组件的相对位置（如左、右、居中等）来实现这一点。在文字处理器中，将文档标题居中是非常常见的。即使页面宽度发生变化，标题仍保持居中，这就是相对定位的一个示例。\n\
  \n在 Java 中可以使用绝对定位，但并不建议这样做。`AWT` 的设计初衷是使用相对定位。我们可以通过相对规范来指定组件布局，例如：组件将添加到上一个组件的右侧、组件将添加到某些其他组件下方、组件将出现在顶部、组件的大小将是容器宽度的\
  \ `¼^(th)` 等，即使在不知道组件尺寸的情况下，这些规范也是非常有用的。\n\nJava 鼓励相对定位，是因为它是平台无关的，相同的 GUI 可以在不进行任何修改的情况下在各种平台上运行。\n\
  \n名为布局管理器的内置 Java 类负责处理将相对位置映射到实际/物理位置的任务。Java 支持许多类型的布局管理器，我们将讨论以下布局管理器：\n\n1.\
  \ `FlowLayout`\n2. `GridLayout`\n3. `BorderLayout`\n4. `CardLayout`\n5. `GridBagLayout`\n\
  \n#### 使用布局管理器时的注意事项：\n\n- 我们不必承担指定每个组件的精确位置和尺寸的负担。\n- 我们不再拥有指定每个组件精确位置和尺寸的绝对权力。\n\
  \n### 为什么 Java 使用布局管理器？\n\n原因有两个：\n\n1. 理论上的原因在于，精确布局（即按像素指定每个组件的大小和位置）是一项重复且经常执行的任务；因此，根据面向对象编程（OOP）的原则，布局功能应当被封装在一个或多个类中，以实现任务的自动化。\n\
  \n显然，布局管理器消除了许多开发上的繁琐。许多程序员起初并不喜欢布局管理器的想法，但随着繁琐选择的消除，他们变得越来越欣赏它们。\n\n2. 使用布局器的实际原因源于\
  \ Java 的平台无关性。在 Java 中，AWT 组件的行为借用自运行 `JVM` 的底层硬件的窗口系统。\n\n因此，在 Macintosh 上，AWT\
  \ 按钮就像任何其他 Mac 按钮一样；在 Motif 平台上，Java 按钮看起来就像任何其他 Motif 按钮，以此类推。这里的问题是，按钮和其他组件在不同平台上实例化时会有不同的尺寸。\n\
  \n如果 Java 鼓励精确的像素级尺寸控制和定位，那么会有大量的 Java GUI 在其源平台上看起来精美，但在其他平台上却非常糟糕甚至无法使用。\n\n如上所述，布局管理器通过使用相对定位解决了这个问题。\n\
  \n### 布局策略（Layout policy）\n\n每个 Java 组件都有一个首选尺寸（preferred size）。首选尺寸表示了在不与布局管理器冲突的情况下，组件希望有多大。首选尺寸通常是能够以在视觉上有意义的方式渲染组件所需的最小尺寸，例如，一个按钮的首选尺寸是其标签文本的大小，加上文本周围的一小圈空白边框，再加上标记按钮边界的阴影装饰，因此按钮的首选尺寸是“恰好足够”。首选尺寸取决于平台，因为组件边界的装饰会随系统而异。\n\
  \n当布局管理器布局其容器的子组件时，它必须平衡两个考量：\n\n(i) 布局策略和\n(ii) 每个组件的首选尺寸\n\n首要任务是执行布局策略。如果遵循一个组件的首选尺寸意味着违反布局策略，那么布局管理器将覆盖该组件的首选尺寸。理解布局管理器意味着理解它将组件放在哪里，以及它将如何处理组件的首选尺寸。\n\
  \n#### 1. FlowLayout（流布局）\n\n流管理器的功能封装在 `java.awt.FlowLayout` 类中。\n\n流布局管理器将组件按水平行排列。它是面板和小型程序的默认布局管理器类型。\n\
  \n流布局管理器尽可能将多个组件拟合到第一行，并将其他组件移动到第二行。如果第二行没有剩余空间，组件将移动到第三行，以此此类推。这与在文档中输入文本非常相似。\n\
  \n当我们到达当前行尾时，下一个单词将移动到下一行，以此此类推。如果我们更改文档的宽度或高度，整个文档将重新格式化。\n\n组件始终按照它们被添加到容器的顺序从左到右出现。\n\
  \n默认情况下，流布局管理器在水平和垂直方向上组件之间留五个像素的间隙。可以通过调用 `FlowLayout` 构造函数的重载版本并传入所需的水平和垂直间隙来更改此默认值。\n\
  \n在每一行内，组件间距均匀，且组件簇是居中的。簇的对齐（有时称为“对端”）可以通过向流布局构造函数传递参数来控制。可能的值为：\n\n- `FlowLayout.LEFT`\n\
  - `FlowLayout.CENTER`\n- `FlowLayout.RIGHT`\n\n示例 17.1：\n\n```java\n1. import java.awt.*;\n\
  2. class MyFrame1\n3. { \n4.   public static void main(String args[ ])\n5.   { \n\
  6.     Frame f=new Frame();\n7.     FlowLayout flow=new FlowLayout();\n8.     f.setLayout(flow);\n\
  9.     Label l1 = new Label(\"Name : \");\n10.    f.add(l1);\n11.    TextField tf1=new\
  \ TextField(\"Matrix\");\n12.    f.add(tf1);\n13.     tf1.setBackground(Color.green);\n\
  14.     tf1.setForeground(Color.red);\n15.     Button b1 = new Button(\"ok\");\n\
  16.     Font f1 = new Font(\"Arial\", Font.BOLD, 24);\n17.     b1.setFont(f1); \n\
  18.     f.add(b1);\n19.     f.setSize(500,100);\n20.     f.setVisible(true);\n21.\
  \   }\n22. }\n```\n\n\n\n\n\n注意：如果我们减小了上述窗口的大小，并且三个组件无法放入单行内，则组件将从最后一个组件开始移动到下一行。\n\
  \n输出：\n\n![image](img/image082.png)\n\n### 示例 17.2\n\n```java\nimport java.awt.*;\n\
