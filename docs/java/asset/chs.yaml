  \ |\n\n## 示例\n```java\nFile f1 = new File(/”);\nFile f2 = new File(/”,”autoexec.bat”);\n\
  File f3 = new File(f1,”autoexec.bat”);\n```\n\n### 注意事项\nJava 在处理 UNIX 和 Windows\
  \ 规范之间的路径分隔符时是非常正确的。如果你在 Windows 版本的 `java` 上使用正斜杠（`/`），路径仍然可以正确解析。\n\n请记住，如果你在字符串中使用\
  \ Windows 规范（`\\\\`），`Java` 的规范是使用 UNIX 和 URL 风格的正斜杠作为路径分隔符。\n\n`File` 定义了许多获取 `File`\
  \ 对象标准属性的方法。然而，`File` 类并不是对称的。这意味着虽然有允许你检查简单文件对象属性的主要方法，但没有对应的函数来更改这些属性。\n\n###\
  \ 示例 15.1\n以下示例演示了 `File` 类的几个方法。\n\n```java\nimport java.io.*;\nclass FileTest\n\
  {\n    public static void main(String args[]) throws IOException\n    { \n     \
