  Toolbar\"));\n      f.add(toolbar,BorderLayout.NORTH);\n      TextField status=new\
  \ TextField(\"Status.\");\n      status.setFont(new Font(\"Monospaced\",Font.BOLD,48));\n\
  \      f.add (status,BorderLayout.SOUTH)    \n      f.setSize(300,300);\n      f.setVisible(true);\n\
  \    }\n}\n```\n\n输出:\n![image](img/image096.png)\n\n### 卡片布局 (CardLayout)\n\n在\
  \ `CardLayout` 中，我们可以存储许多卡片，但一次只会显示一张。一次只有一张卡片可见，但你可以从一张卡片翻到另一张。这里的卡片指的是 `Panel`。如果我们想同时显示两张卡片，我们需要为每张卡片创建两个\
  \ `Panel`，以及一个包含这些卡片的主 `Panel`。这对于具有可选组件的用户界面非常有用，可以根据用户输入动态启用或禁用。\n\n### 构造函数\n\
  \n- `CardLayout()` 创建间隙为 0 的新卡片布局。\n- `CardLayout(int, int)` 创建具有指定水平和垂直间距的新布局。水平间距放在左右，垂直间距放在上下。\n\
  \n### 方法\n\n- `first()` 显示第一张卡片。\n- `next()` 切换到下一张卡片。\n- `previous()` 切换到上一个卡片。\n\
  - `last()` 显示最后一张卡片。\n- `show(Container target, String name)` 显示指定为 `name` 的卡片。\n\
  \n使用 `CardLayout` 的步骤：\n1. 创建一个 `CardLayout` 实例。\n2. 创建一个容器（如 `Panel`），并将其布局设置为\
  \ `CardLayout`。\n3. 创建多个卡片（如多个 `Panel`），并将它们添加到容器中，同时为每个卡片指定一个名称。\n4. 使用 `first()`、`next()`、`previous()`、`last()`\
  \ 或 `show()` 方法在卡片之间切换。\n\n#### 示例 17.10\n\n```java\nimport java.awt.*;\nimport\
  \ java.awt.event.*;\nimport java.applet.*;\n/*applet code=\"CardLayout\" width=500\
  \ height=100*/\npublic class CardLayoutTest extends Applet implements ActionListener,\
  \ MouseListener\n{\n    Panel mp;\n    CardLayout c1;\n    public void init()\n\
  \    {\n      Button b1=new Button(\"First\");\n      Button b2=new Button(\"Second\"\
  );\n      b1.addActionListener(this);\n      b2.addActionListener(this);\n     \
  \ add(b1);\n      add(b2);\n      Panel p1=new Panel();\n      Label l1=new Label(\"\
  INDIA\");\n      p1.add(l1);\n      Panel p2=new Panel();\n      Label l2=new Label(\"\
  USA\");\n      p2.add(l2);\n      mp=new Panel();\n      c1=new CardLayout();\n\
  \      mp.setLayout(c1);\n      mp.add(p1,\"Country1\");\n      mp.add(p2,\"Country2\"\
  );\n      add(mp);\n      addMouseListener(this);\n    }\n    public void actionPerformed(ActionEvent\
  \ ae)\n    {\n      Button b=(Button)ae.getSource();\n      if(b.getLabel().equals(\"\
  First\"))\n        c1.show(mp,\"Country1\");\n      else\n        c1.show(mp,\"\
  Country2\");\n    }\n    public void mousePressed(MouseEvent me)\n    {\n      c1.next(mp);\n\
  \    }\n    public void mouseReleased(MouseEvent me){}\n    public void mouseClicked(MouseEvent\
  \ me){}\n    public void mouseEntered(MouseEvent me){}\n    public void mouseExited(MouseEvent\
  \ me){}\n}\n```\n\n（注：此处省略输出）\n\n### 网格布局布局 (GridBagLayout)\n\n`GridBagLayout` 是标准布局管理器中最复杂且灵活的。尽管它听起来应该是\
  \ `GridLayout` 的子类，但它完全不同。在 `GridLayout` 中，元素按...\n\n### 示例 17.11\n\nAWT 组件可以分类为：\n\
  1. 视觉组件。\n2. 容器组件。\n3. 菜单组件。\n\n视觉组件和容器组件都属于从 `java.awt.Component` 开始的组件层次。（菜单组件扩展了\
  \ `java.awt.MenuComponent`，因此它们没有相同的父类功能）。\n\n#### java.awt.Component 类的方法\n\n所有视觉和容器组件通过继承\
  \ `java.awt.component` 都实现了若干方法。这些方法如下：\n\n- `getSize()` 以 `Dimension` 对象的形式返回组件的大小，它具有类型为\
  \ `int` 的公共数据成员 `height` 和 `width`。\n- `setBackground(Color c)` 设置组件的背景颜色。通常背景颜色用于渲染组件的非文本区域。\n\
  - `setForeground(Color c)` 设置组件的前景颜色。通常组件的前景颜色用于渲染文本。如果我们没有显式设置组件的前景或背景颜色，组件将使用其直接容器的前景和背景颜色。\n\
  - `setFont(Font f)`\n\n\n\n\n\n`setFont()` 方法决定了组件在渲染其需要显示的任何文本时使用的字体。如果我们没有显式设置组件的字体，则组件将使用其容器的字体。\n\
  \n```java\nvoid setEnabled(Boolean b)\n```\n如果参数为 `true`，则组件具有正常外观。如果参数为 `false`，则组件将显示为灰色且不对用户输入做出响应。\n\
  \n```java\nvoid setSize(Dimension d)\n```\n设置组件的大小。\n\n```java\nvoid setSize(int\
  \ width, int height)\n```\n设置组件的大小。\n\n```java\nvoid setBounds(int x, int y, int\
  \ width, int height)\n```\n尝试移动并调整组件的大小。左上角的新位置由 `x` 和 `y` 指定，新大小由 `width` 和 `height`\
  \ 指定。\n\n```java\nvoid setVisible(Boolean b)\n```\n此方法接受一个布尔值参数，用于决定组件是否在屏幕上显示。此方法通常用于框架（frames）。\n\
  \n#### 注意\n如果我们尝试过调用 `setSize()` 或 `setBounds()` 方法，就会知道这通常是徒劳的。我们试图给组件设置的大小和位置会被布局管理器（layout\
  \ manager）覆盖。\n\n事实上，这两个方法的存在很大程度上是为了供布局管理器使用的。该规则的一个主要例外是 `Frame` 类，它不受布局管理器的控制，并且完全乐意让我们设置其的大小或边界。\n\
  \n### 视觉组件\n视觉组件是用户用户可以直接看到并与之交互的组件。AWT 支持以下视觉组件：\n\n* `Button`\n* `Canvas`\n* `Checkbox`\n\
  * `Choice`\n* `FileDialog`\n* `Label`\n* `List`\n* `ScrollPane`\n* `Scrollbar`\n\
  * `TextArea`\n* `TextField`\n\n在 GUI 中使用这些组件之一时，我们首先通过调用相应的构造函数创建一个实例。然后将组件添加到容器中。\n\
  \n### 按钮 (Button)\n`Button` 类实现了一个推按钮。\n\n### 构造函数\n* `Button()`\n* `Button(String)`\n\
  构造函数接受一个字符串参数，用于指定按钮标签的文本。当按钮被按下时，它会发送一个 Action 事件。\n\n### 方法\n* `String getLabel()`\n\
  获取此按钮的标签。\n* `void setLabel(String label)`\n将按钮的标签设置为指定的字符串。\n* `void addActionListener(ActionListener\
  \ l)`\n添加指定的 action 监听器以接收来自此按钮的 action 事件。\n\n#### 示例 17.12\n```java\nimport java.awt.*;\n\
  class ButtonTest\n{\n  public static void main(String args[])   {\n      Frame f=new\
  \ Frame(\"Testing Button Component\");\n      f.setLayout(new FlowLayout());\n \
  \     Font f1=new Font(\"Arial\",Font.BOLD,40);\n      Color c1=new Color(255,0,0);\n\
  \      Color c2=new Color(0,255,0);\n      Button b1 = new Button();\n      Button\
  \ b2 = new Button(\"Cancel\");\n      b1.setForeground(c1);\n      b2.setForeground(c1);\n\
  \      b1.setBackground(c2);\n      b2.setBackground(c2);\n      b1.setFont(f1);\n\
  \      b2.setFont(f1);\n      b1.setLabel(\"Ok\");\n      System.out.println(b2.getLabel());\n\
  \      f.add(b1);\n      f.add(b2); \n      f.setSize(500,200);\n      f.setVisible(true);\n\
  \  }\n}\n```\n输出：\n![image](img/image064.png)\n\n### 画布 (Canvas)\n`Canvas` 是一种组件，它没有默认外观或行为。我们可以子类\
  \ `canvas` 来创建自定义的绘制区域、工作区域、组件等。画布接收来自鼠标和键盘的输入事件，由程序员将这些输入转换为有意义的外观和感受。\n\n画布的默认大小（或更准确地说，首选大小）小得毫无用处。处理这个问题的方法之一是使用布局管理器来调整画布的大小。另一种方法是我们自己对画布调用\
  \ `setSize()`，画布是这种可能有效的罕见情况，因为我们传递到 `setSize()` 方法的值将变成画布的首选大小。\n\n#### 示例 17.13\n\
  ```java\nimport java.awt.*;\nclass CanvasTest\n{ \n  public static void main (String\
  \ args [])  {\n      Frame f = new Frame() ;\n      f.setLayout(new FlowLayout());\n\
  \      Canvas c=new Canvas();\n      c.setSize(100,100);\n      f.add(c) ;\n   \
  \   f.setSize(300,300);\n      f.setVisible(true);\n  }\n}\nclass MyCanvas extends\
  \ Canvas\n{\n  public void paint(Graphics g )  {\n      setBackground(Color.green);\n\
  \      g.setColor(Color.red);\n      g.drawLine(0, 0, 99, 99);\n  }\n}\n```\n输出：\n\
  ![image](img/image073.png)\n\n### 复选框 (Checkbox)\n复选框是一个双状态按钮。两个状态为 `true`（已选中）和\
  \ `false`（未选中）。复选框构造器的三种基本形式为：\n\n### 构造函数\n* `Checkbox()`\n创建一个标签为空字符串的复选框。\n*\
  \ `Checkbox(String label)`\n创建一个带有指定标签的复选框。\n* `Checkbox(String label, boolean state)`\n\
  创建一个带有指定标签和状态的复选框。如果不指定状态，默认为 `false`。\n\n### 方法\n* `String getLabel()`\n获取此复选框的标签。\n\
  * `void setLabel(String label)`\n将复选框的标签设置为指定的字符串。\n* `boolean getState()`\n确定复选框是“开启”还是“关闭”状态。\n\
  * `void setState(boolean state)`\n将此复选框的状态设置为指定的状态。\n* `void addItemListener(ItemListener\
  \ l)`\n添加 item 监听器以接收来自此复选框的 item 事件。\n\n#### 示例 17.14\n```java\nimport java.awt.*;\n\
  class CheckboxTest\n{\n  public static void main(String args[])  {\n      Frame\
  \ f = new Frame(\"Testing Checkbox\");\n      f.setLayout(new GridLayout(3,1));\n\
  \      Checkbox c1=new Checkbox();\n      Checkbox c2=new Checkbox(\"Lunch\",true);\n\
  \      Checkbox c3=new Checkbox(\"Dinner\");\n      c1.setLabel(\"BreakFast\");\n\
  \      c3.setState(true);\n      f.add(c1);f.add(c2);f.add(c3);\n      if(c1.getState())\n\
  \        System.out.println(c1.getLabel());\n      if(c2.getState())\n        System.out.println(c2.getLabel());\n\
  \      if(c3.getState())\n        System.out.println(c3.getLabel());\n      f.setSize(100,100);\n\
  \      f.setVisible(true);\n  }\n}\n```\n输出：\n![image](img/image023.png)\n\n####\
  \ 另一个示例\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass CheckboxTest\
  \ extends Frame implements ItemListener\n{\n  Checkbox c1;\n  TextField tf1;\n \
  \ CheckboxTest()\n  {\n      setLayout(new GridLayout(2,1));\n      c1=new Checkbox(\"\
  Red\");\n      c1.addItemListener(this);\n      add(c1);\n      tf1=new TextField();\n\
  \      add(tf1);\n      setSize(100,100);\n      setVisible(true);\n  }\n  public\
  \ static void main(String args[])\n  {\n      new CheckboxTest();\n  }\n  public\
  \ void itemStateChanged(ItemEvent ie)\n  {\n      if(c1.getState())\n        tf1.setBackground(Color.red);\n\
  \      else\n        tf1.setBackground(Color.white);\n  }\n}\n```\n\n### 单选按钮 (Radio\
  \ button)\n复选框可以组合成单选框组，具有单选行为。在单选行为下，复选框组中任何时间只有一个成员为 `true`；选择新成员将将先选成员的状态更改为\
  \ `false`。许多窗口系统（例如 Motif）将单选组作为组件实现。\n\n我们可以通过创建多个复选框并使用 `java.awt.Checkbox Group`\
  \ 类将其分组来实现单选行为。在 Java 中，`java.awt.CheckboxGroup` 类不是组件；它仅仅是一个组织复选框的非可见类。这意味着 Java\
  \ 对复选框组成员之间的空间关系没有加任何限制。\n\n\n\n\n\n如果我们愿意，可以将一个组中的一个成员放在框架的左上角，另一个成员放在右下角，而将第三个成员放在完全不同的框架中。当然，结果很可能违背理智以及大多数\
  \ GUI 样式指南。\n\n## 复选框组 (Checkbox Group)\n\n`CheckboxGroup` 类有两种方法支持获取和设置当前选中的成员或该组。\n\
  \n`Checkbox getSelectedCheckbox()`\n从此复选框组获取当前的选择。\n\n`void setSelectedCheckbox(Checkbox\
  \ box)`\n将此组中当前选中的复选框设置为指定的复选框。\n\n### 示例 17.15\n\n```java\nimport java.awt.*;\n\
  class CheckboxGroupTest\n{\n  public static void main(String args[])\n  {\n    Frame\
  \ f = new Frame(\"Testing RadioButton Component\");\n      f.setLayout(new GridLayout(3,1));\n\
  \      CheckboxGroup cbg=new CheckboxGroup();\n      Checkbox c1=new Checkbox(\"\
  BreakFast\",false,cbg);\n      Checkbox c2=new Checkbox(\"Lunch\",true,cbg);\n \
  \     Checkbox c3=new Checkbox(\"Dinner\",false,cbg);\n      c3.setState(true);\n\
  \      f.add(c1);f.add(c2);f.add(c3);\n\n      if(c1.getState())\n        System.out.println(c1.getLabel());\n\
  \      else if(c2.getState())\n        System.out.println(c2.getLabel());\n    \
  \  else if(c3.getState())\n        System.out.println(c3.getLabel());\n\n      f.setSize(100,100);\n\
  \      f.setVisible(true);\n  }\n}\n```\n\n输出：\n![image](img/image041.png)\n\n---\n\
  \n## 选择列表 (Choice)\n\nChoice 是一个拉式/下拉列表。\n\n### 方法\n\n`void add(String item)`\n\
  向此 Choice 菜单中添加一个项。\n\n`void addItemListener(ItemListener i)`\n添加指定的项监听器以接收来自此选择菜单的项事件。\n\
  \n`String getItem(int index)`\n获取此 Choice 菜单中指定索引处的字符串。\n\n`int getItemCount()`\n\
  返回此 Choice 菜单中项的数量。\n\n`int getSelectedIndex()`\n返回当前选中项的索引。\n\n`String getSelectedItem()`\n\
  以字符串形式获取当前选择。\n\n`void insert(String item, int index)`\n将项插入到选择列表中指定位置的项。\n\n`void\
  \ remove(int position)`\n从选择菜单中删除指定位置的第一个项。\n\n`void remove(String item)`\n从 Choice\
  \ 菜单中删除第一个出现的指定项。\n\n`void removeAll()`\n从选择菜单中删除所有项。\n\n`void select(int pos)`\n\
  将此 Choice 菜单中的选中项设置为指定位置处的项。\n\n`void select(String Str)`\n将此 Choice 菜单中的选中项设置为名称与指定字符串相等的项。\n\
  \n### 示例 17.16\n\n```java\nimport java.awt.*;\nclass ChoiceTest\n{\n  public static\
  \ void main(String args[]) throws InterruptedException\n  {\n    Frame f = new Frame(\"\
  Testing Choice Component\");\n    f.setLayout(new FlowLayout());\n      f.setSize(100,100);\n\
  \      f.setVisible(true);\n      Choice c1=new Choice();\n      c1.add(\"BreakFast\"\
  );\n      c1.add(\"Lunch\");\n      c1.add(\"Dinner\");\n      f.add(c1);\n    \
  \  c1.select(\"Dinner\"); // c1.select(2);\n      Thread.sleep(1000);\n      System.out.println(c1.getSelectedItem());\n\
  \      System.out.println(c1.getSelectedIndex());\n      System.out.println(c1.getItemCount());\n\
  \      System.out.println(c1.getItem(0));\n      c1.insert(\"Brunch\",1);\n    \
  \  c1.remove(2); // c1.remove(\"Lunch\");\n  }\n}\n```\n\n输出：\n![image](img/image028.png)\n\
  \n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass CheckboxItemTest\
  \ extends Frame implements ItemListener\n{\n  TextField tf1;\n  Choice c1;\n  CheckboxItemTest()\n\
  \  {\n    setLayout(new FlowLayout());\n    c1=new Choice();\n    c1.add(\"red\"\
  );\n    c1.add(\"green\");\n    c1.add(\"blue\");\n    tf1 = new TextField(8);\n\
  \    tf1.setBackground(Color.red);\n    c1.addItemListener(this);\n    add(c1);\n\
  \    add(tf1);\n    setSize(200,200);\n    setVisible(true);\n  }\n  public static\
  \ void main(String args[])\n  {\n    new CheckboxItemTest();\n  }\n  public void\
  \ itemStateChanged(ItemEvent ie)\n  {\n    String s=(String)ie.getItem();\n    if(s.equals(\"\
  red\"))\n      tf1.setBackground(Color.red);\n    else if(s.equals(\"green\"))\n\
  \      tf1.setBackground(Color.green);\n    else if(s.equals(\"blue\"))\n      tf1.setBackground(Color.blue);\n\
  \  }\n}\n```\n\n---\n\n## 标签 (Label)\n\n最简单的可见 AWT 组件是 label。Label 通常不响应用户输入或发送事件。\n\
  \n### 构造函数\n\n`Label()`\n构造一个空标签。\n\n`Label(String text)`\n构造一个带有字符串文本的新标签，并左对齐。\n\
  \n`Label(String text, int alignment)`\n构造一个以指定对齐方式显示指定文本的新标签。标签的默认对齐方式是左对齐。要设置对齐方式，请使用构造函数的第三参数并传入以下值：\n\
  * `Label.LEFT`\n* `Label.CENTER`\n* `Label.RIGHT`\n\n### 方法\n\n`String getText()`\n\
  获取此标签的文本。\n\n`void setText(String text)`\n将此标签的设置为指定的文本。\n\n### 示例 17.17\n\n```java\n\
  import java.awt.*;\nclass LabelTest\n{\n  public static void main(String args[])\n\
  \  {\n    Frame f = new Frame(\"Testing Label Component\");\n      f.setLayout(new\
  \ GridLayout(3,3));\n      f.setFont(new Font(\"Arial\",Font.PLAIN, 20));\n    \
  \  Label l1 = new Label(\"India\",Label.LEFT);\n      Label l2 = new Label(\"Pakistan\"\
  ,Label.LEFT);\n      Label l3 = new Label(\"UK\",Label.LEFT);\n      Label l4 =\
  \ new Label(\"India\",Label.CENTER);\n      Label l5 = new Label(\"Pakistan\",Label.CENTER);\n\
  \      Label l6 = new Label(\"UK\",Label.CENTER);\n      Label l7 = new Label(\"\
  India\",Label.RIGHT);\n      Label l8 = new Label(\"Pakistan\",Label.RIGHT);\n \
  \     Label l9 = new Label(\"UK\",Label.RIGHT);\n      l3.setText(\"USA\");\n  \
  \    System.out.println(l1.getText());\n      f.add(l1);f.add(l4);f.add(l7);\n \
  \     f.add(l2);f.add(l5);f.add(l8);\n      f.add(l3);f.add(l6);f.add(l9);\n   \
  \   f.setSize(500,200);\n      f.setVisible(true);\n  }\n}\n```\n\n输出：\n![image](img/image086.png)\n\
  \n---\n\n## 列表 (List)\n\nList 是垂直排列的文本项集合。如果列表包含的项多于其显示范围，它会自动获取滚动条。\n\n### 构造函数\n\
  \n`List()`\n构造一个滚动列表。此构造函数未指定行数，但会产生四行的默认高度。当然，在许多情况下，列表的实际高度将由布局管理器决定。\n\n`List(int\
  \ rows)`\n构造一个初始化为指定可见行数的滚动列表。\n\n`List(int rows, boolean multipleMode)`\n创建一个新的滚动列表，初始化为显示指定行数并允许多项选择。\n\
  \n### 示例 17.18\n\n```java\nimport java.awt.*;\nclass ListTest\n{\n  public static\
  \ void main(String args[])\n  {\n    Frame f = new Frame( ) ;\n      f.setLayout(new\
  \ FlowLayout ());\n      List l1=new List(3,true);\n      l1.add(\"India\");\n \
  \     l1.add(\"Nepal\");\n      l1.add(\"Shri Lanka\");\n      l1.add(\"USA\");\n\
  \      l1.add(\"UK\");\n      f.add(l1);\n      System.out.println(l1.getRows());\n\
  \      f.setSize(300, 300);\n      f.setVisible(true);\n  }\n}\n```\n\n输出：\n![image](img/image002.png)\n\
  \nList 有五个项，但只有 3 行可见行，因此会自动提供滚动条以访问底部两行。\n\n注意：在列表中选择某项会导致列表发送 Item 事件；双击某项会发送\
  \ Action 事件。\n\n`void add(String item)`\n将指定的项添加到滚动列表的末尾。\n\n\n\n\n\n### 列表方法\n\n\
  `void add(String item, int index)`\n将指定的项添加到由 `index` 指明的位置的滚动列表中。\n\n`void addActionListener(ActionListener\
  \ i)`\n添加指定的动作监听器，以接收来自此列表的动作事件。\n\n`void addItemListener(ItemListener i)`\n添加指定的项目监听器，以接收来自此列表的项目事件。\n\
  \n`String getItem(int index)`\n获取与指定的 `index` 相关的项。\n\n`int getItemCount()`\n获取列表中的项数。\n\
  \n`String[] getItems()`\n获取列表中的所有项。\n\n`int getRows()`\n获取此列表中可见的行数。\n\n`int getSelectedIndex()`\n\
  获取列表中被选中项的索引。\n\n`int[] getSelectedIndexes()`\n获取列表中的被选中索引。\n\n`String getSelectedItem()`\n\
  获取此滚动列表中的被选中项。\n\n`String[] getSelectedItems()`\n获取此滚动列表中的被选中项。\n\n`void remove(int\
  \ position)`\n从此滚动列表中移除指定位置的项。\n\n`void remove(String item)`\n从列表中移除第一个出现的项。\n\n\
  `void removeAll()`\n移除列表中的所有项。\n\n`void replaceItem(String newValue, int index)`\n\
  用新字符串替换滚动列表中指定 `index` 处的项。\n\n`void select(int index)`\n选中滚动列表中指定 `index` 处的项。\n\
  \n`void setMultipleMode(boolean b)`\n设置标志，以决定此列表是否允许多项选择。\n\n### 示例代码\n\n```java\n\
