  \ 方法\n\n| 签名 | 描述 |\n| :--- | :--- |\n| `public FileOutputStream(File) throws FileNotFoundException;`\
  \ | 创建一个文件输出流，用于写入指定的 `File` 对象所的文件。 |\n| `public FileOutputStream(File, boolean)\
  \ throws FileNotFoundException;` | 创建一个文件输出流，用于写入指定的 `File` 对象所的文件。 |\n| `public\
  \ native void write(int) throws java.io.IOException;` | |\n| `public void write(byte[\
  \ ]) throws java.io.IOException;` | |\n| `public void write(byte[ ], int, int) throws\
  \ java.io.IOException;` | |\n| `public void close( ) throws java.io.IOException;`\
  \ | |\n\n### 示例 15.2\n\n```java\nimport java.io.*;\nclass FileRead\n{\n  public\
  \ static void main(String args[])\n  {\n      FileInputStream fin=null;\n      int\
  \ a;\n      try\n      {\n        fin=new FileInputStream(args[0]);\n        System.out.println(\"\
  No. of characters to read=\"+fin.available());\n        fin.skip(3);\n        a\
  \ = fin.read();\n        while(a != -1)\n        {\n          System.out.print((char)a);\n\
  \          a = fin.read();\n        }\n        System.out.println(\"No. of characters\
  \ to read=\"+fin.available());\n        fin.close(); \n      }\n      catch(ArrayIndexOutOfBoundsException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      catch(FileNotFoundException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      catch(IOException\
  \ e)\n      {\n        System.out.println(e);\n      }\n  }\n}\n```\n\n**输出:**\n\
  ```\njava FileRead A.txt\nNo. of characters to read=20\nMatrix Computers\nNo. of\
  \ characters to read=0\n```\n\n### 示例 15.3\n\n```java\nimport java.io.*;\nclass\
  \ FileCopy\n{\n  public static void main(String args[]) throws IOException\n  {\n\
  \      FileInputStream fin=null;\n      FileOutputStream fout=null;\n      fin=new\
  \ FileInputStream(args[0]);\n      fout=new FileOutputStream(args[1]);\n      int\
  \ a;\n      a = fin.read();\n      while(a != -1)\n      {\n        fout.write(a);\n\
  \        a = fin.read();\n      }\n      fin.close();fout.close();\n  }\n}\n```\n\
  \n### 示例 15.4\n\n```java\nimport java.io.*;\nclass CopyFile\n{\n  public static\
  \ void main(String args[]) throws IOException\n  { \n      int n;\n      FileInputStream\
  \ fin = new FileInputStream(\"A.txt\");\n      FileOutputStream fout = new FileOutputStream(\"\
  B.txt\");\n      byte b[ ]= new byte[10];\n      n = fin.read(b);\n      while(n\
  \ != -1)\n      { \n        fout.write(b,0,n);\n        n = fin.read(b);\n     \
  \ }\n      fin.close();\n      fout.close();\n  }\n}\n```\n\n## FileReader\n\n`FileReader`\
  \ 类创建一个 `Reader`，你可以用它来读取文件的内容。它的两个常用构造函数如下：\n\n- `FileReader(File file)`: 创建一个\
  \ `FileReader` 流，从指定的文件读取内容。\n- `FileReader(String fileName)`: 创建一个 `FileReader`\
  \ 流，从指定的文件读取内容。\n\n**注意：** 如果文件不存在、是一个目录而不是普通文件，或者由于某些原因无法打开读取，这两个构造函数都可能抛出 `FileNotFoundException`。\n\
  \n## FileWriter\n\n`FileWriter` 类创建一个 `writer`，你可以用它来写入文件。它的两个常用构造函数如下：\n\n- `FileWriter(File\
  \ file)`: 一个用于写入指定文件的 `FileWriter` 对象。\n- `FileWriter(String fileName)`: 一个用于写入指定文件的\
  \ `FileWriter` 对象。\n- `FileWriter(File file, boolean append)`: 一个以 `append` 模式写入指定文件的\
  \ `FileWriter` 对象。\n- `FileWriter(String filename, boolean append)`: 一个以 `append`\
  \ 模式写入指定文件的 `FileWriter` 对象。\n\n如果使用前两个构造函数，将创建一个新文件。如果同名文件存在，则会被覆盖。如果使用后两个构造函数且\
  \ `append` 标志为 `false`，它们的行为与前两个相同。如果 `append` 标志为 `true`，文件指针将置于文件末尾；如果文件不存在，则创建一个新文件。\n\
  \n**注意：** 如果文件存在但是一个目录而不是普通文件、无法创建或由于其他任何原因无法打开，这些构造函数可能会抛出 `IOException`。例如，当你尝试打开一个只读文件时，将抛出\
  \ `IOException`。\n\n### 示例 15.5\n\n```java\nimport java.io.*;\nclass FileCopy\n\
  {\n  public static void main(String args[]) throws IOException\n  {\n      FileReader\
  \ fin=null;\n      FileWriter fout=null;\n      fin=new FileReader(args[0]);\n \
  \     fout=new FileWriter(args[1]);\n      int a;\n      a = fin.read();\n     \
  \ while(a != -1)\n      {\n        fout.write((char)a);\n        a = fin.read();\n\
  \      }\n      fin.close();\n      fout.close();\n  }\n}\n```\n\n## RandomAccessFile\n\
  \n`RandomAccessFile` 封装了一个随机访问文件。它允许你在文件中的任何位置读取或写入字节、原始数据类型，并支持 `DataInput` 和 `DataOutput`\
  \ 接口，这意味着你可以定位文件中的任何位置。`mode` 参数指定文件的打开模式如下：\n\n| 值 | 含义 |\n| :--- | :--- |\n| `\"\
  r\"` | 只读。调用该对象的任何写入方法将抛出 `IOException`。 |\n| `\"rw\"` | 可读写。如果文件不存在，将尝试创建。 |\n\
  | `\"rws\"` | 可读写，且要求文件内容同步写入到存储设备。 |\n| `\"rwd\"` | 可读写，且要求文件数据同步写入到存储设备。 |\n\n\
  ### RandomAccessFile 方法\n\n除了 `DataInput` 和 `DataOutput` 接口的方法，该类的一些常用方法如下：\n\n\
  | 签名 | 描述 |\n| :--- | :--- |\n| `public RandomAccessFile(String, String) throws\
  \ FileNotFoundException;` | 创建一个随机访问文件流，从指定的文件名读取并可选写入。 |\n| `public RandomAccessFile(File,\
  \ String) throws FileNotFoundException;` | 创建一个随机访问文件流，从 `File` 参数指定的文件读取并可选写入。\
  \ |\n| `public native int read() throws java.io.IOException;` | |\n| `public int\
  \ read(byte[], int, int) throws java.io.IOException;` | |\n| `public int read(byte[])\
  \ throws java.io.IOException;` | |\n| `public int skipBytes(int) throws java.io.IOException;`\
  \ | |\n| `public native void write(int) throws java.io.IOException;` | |\n| `public\
  \ void write(byte[]) throws java.io.IOException;` | |\n| `public void write(byte[],\
  \ int, int) throws java.io.IOException;` | |\n| `public native long getFilePointer()\
  \ throws java.io.IOException;` | 返回下一次读取或写入发生的文件偏移量（字节）。 |\n| `public native void\
  \ seek(long) throws java.io.IOException;` | 此处，`newPos` 指定文件指针从文件开始的新位置（字节）。调用 `seek()`\
  \ 后，下一次读取或写入操作将在新的文件位置进行。 |\n| `public native long length() throws java.io.IOException;`\
  \ | |\n| `public native void setLength(long) throws java.io.IOException;` | 设置文件的长度。此方法可用于延长或缩短文件。如果延长文件，增加的部分是未定义的。\
  \ |\n| `public void close() throws java.io.IOException;` | |\n| `public final boolean\
  \ readBoolean() throws java.io.IOException;` | |\n\n\n\n\n\n| `public final byte\
  \ readByte() throws java.io.IOException;` |\n| `public final int readUnsignedByte()\
  \ throws java.io.IOException;` |\n| `public final short readShort() throws java.io.IOException;`\
