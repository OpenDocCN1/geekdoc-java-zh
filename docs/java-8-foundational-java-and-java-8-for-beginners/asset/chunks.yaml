  trans: "\n类不继承接口，而是实现一个或多个接口。一个类一次只能继承一个类，这使得接口在应用中更具活性和多态性。根据标准，接口使用形容词形式命名，并使用\
    \ `interface` 关键字创建。如果接口存在成员变量，则被声明为 `public` 和 `static`，其成员方法默认声明为 `public` 和\
    \ `abstract`。总而言之，接口只能有常量、抽象方法和默认方法作为其成员变量和方法。创建的语法如下所示：\n\n```java\ninterface\
    \ interface_name{\n\nStatic variables ;\n\nabstract method declarations;\n\ndefault\
    \ method declaration;\n\n}\n```\n\n程序列表 4.3 演示了默认接口方法 `myMessage()` 的声明，并提供了该默认方法的默认实现，请享用。\n\
    \n程序列表 4.3：\n\n```java\npublic class FunctionalInterface\n{\n\n    public static\
    \ void main(String[] args){\n\n      Confidential toMum = new Confidential( );\n\
    \      MyMessage toCarthy = new MyMessage( );\n      System.out.println(\"\\n\
    \ My message to mum: \" + toMum.myMessage( ));\n      System.out.println(\"\\\
    n My message to Carthy: \" + toCarthy.myMessage( ));\n\n  }\n}\n\n//The Message\
    \ interface\ninterface Messaging{\n\n  default String myMessage( ){\n\n    return\
    \ \"Sorry, I am out of the office at the moment.\";\n\n  }\n}\n\nclass MyMessage\
    \ implements Messaging {\n\n  //Fails to implement myMessage( ) interface  method.\n\
    \n  }\nclass Confidential implements Messaging {\n\n    public String myMessage(){\n\
    \n    return \"See you soon mum. Love you.\";\n\n  }\n}\n```\n\n接口使用 `interface`\
    \ 关键字定义。如果一个接口有一个默认方法，而实现类没有实现该默认方法，那么在实现类中调用该方法时，将执行该默认方法，如图 4.3 所示，下方程序列表 4.3\
    \ 的程序输出：\n\n![](img/00010.jpeg)\n\n图 4.3 上述程序列表 4.3 的输出。\n\n对 `Confidential` 类对象\
    \ `toMum` 的调用（该类实现了接口 `Messaging` 中的默认方法 `myMessage`）给妈妈提供了一个自定义消息。而对 `MyMessage`\
    \ 类对象 `toCarthy` 的类似调用（该类也实现了相同的接口，但与 `Confidential` 未实现其默认方法 `myMessage`）则产生了默认的离开消息。更高级的接口实现将在后续第\
    \ 4.8 节讨论。\n\n## 4.8 接口实现\n\n现在，为了给程序列表 4.1 中 `AutomaticVehicle` 和 `ManualVehicle`\
    \ 类中的通用方法名 `applyGear()` 定义一个接口，我们编写了以下 Java 代码：\n\n```java\ninterface AutoManual{\n\
    \n  public void operateGear(MotorVehicle motor);\n\n}\n```\n\n注意 `AutoManual`\
    \ 接口中 `operateGear()` 抽象方法声明的参数类型是抽象类 `MotorVehicle`，`AutomaticVehicle` 和 `ManualVehicle`\
    \ 类都继承自该类。因此，任何实现 `AutoManual` 接口的类必须实现 `operateGear()` 抽象方法（因为该方法不是默认方法），并且可以操作任何自动或手动汽车对象。实现类所示：\n\
    \n```java\nclass AutoManualOperator implements AutoManual{\n\n    public void\
    \ operateGear(MotorVehicle m){\n\n        m.applyGear();\n\n    }\n}\n```\n\n\
    这是非常有多态性的，这正是接口的作用。我在程序列表 4.3 中通过改进程序列表 4.2 中的公类 `CarMart` 这一点，使其拥有一个新的公类 `CarMartInterface`，如下所示：\n\
    \n程序列表 4.3：\n\n```java\n/* 导入 JOptionPane 类以创建视觉输入面板。 */\nimport javax.swing.JOptionPane;\n\
    \npublic class CarMartInterface\n{\n  public static void main(String[] args){\n\
    \  AutomaticVehicle myAutomaticCar = new AutomaticVehicle( );\n   ManualVehicle\
    \ myManualCar = new ManualVehicle( );\n AutoManualOperator operator = new AutoManualOperator(\
    \ );\n\n    /* 使用导入的 JOptionPlane 类的方法读取所需的车辆类型 */\n    String m = JOptionPane.showInputDialog(\"\
    Enter (1) for a Manual vehcice (2) for an automatic one \");\n\n    if(Integer.parseInt(m)\
    \ == 1 )\n        //myManualCar.applyGear( )\noperator.operateGear(myManualCar);\n\
    \n    else\n      //myAutomaticCar.applyGear( );      \noperator.operateGear(myAutomaticCar);\n\
    \n  }\n  }\nabstract class MotorVehicle{\n  public abstract void applyGear( );\n\
    }\nclass ManualVehicle extends MotorVehicle{\n  String gearType;\n  public ManualVehicle(\
    \ ){\n  gearType = \"A manual gearing system.\";\n  }\n\n  @Override public void\
    \ applyGear( ){\n    System.out.println(\"\\n Manually change the gear by applying\
    \ the clutch.\" );\n  }\n  String displayGearType( ){\n  return gearType;\n  }\n\
    }\nclass AutomaticVehicle extends MotorVehicle{\n  String gearType;\n  public\
    \ AutomaticVehicle( ){\n  gearType = \"An automatic gearing system.\";\n  }\n\n\
    \  @Override public void applyGear( ){\n    System.out.println(\"\\n Change the\
    \ gear by gently pushing or pulling the lever.\" );\n  }\n\n  String displayGearType(\
    \ ){\n  return gearType;\n  }\n}\n```\n"
- fmt: "\nThe parenthesis are optional and the also the braces. If you have more than\
    \ one statement at the right side you may enclose you statement in braces as described\
    \ above, and if you have more than one parameter at the left side you may also\
    \ enclose them in parentheses. The type declaration is also optional; the compiler\
    \ can infer it from the supplied parameter. Also the `return` keyword is not required.\
    \ The followings are examples of valid lambda expressions:\n\n```\n(a)->a *a;\n\
    ```\nTakes an argument `a` multiplies it by itself and returns the result.\n\n\
    ```\na -> a + a;\n```\nTakes an argument `a` add it together and return the result.\n\
    \n```\n(int a, int b) -> a – b;\n```\nTakes arguments `a` and `b` at the left\
    \ side of the indirection, minus the value of argument `b` from argument `a` and\
    \ returns the result.\n\n```\n(String t) -> System.out.println(t);\n```\nThe lambda\
    \ expression prints out the content of string `t` to the console.\n\n### 4.9.2\
    \ Using Lambda Expressions with a Functional Interface\n\nThe following program\
    \ listing illustrates the use of lambda expression in carrying out mathematic\
    \ calculations through the use of a functional interface:\n\n```java\ninterface\
    \ multiplier{\n  float processMyNumber(float r);\n}\n```\nEarlier defined in section\
    \ 4.8.1 above.\n\nProgram listing 4.4:\n\n```java\npublic class LambdaOperator\n\
    {\n  public static void main(String[] args){\n    Result res = new Result( );\n\
    \    float n=8;\n    multiplier square = (a) -> a * a;\n    multiplier doubler\
    \ = a -> a + a;\n    System.out.printf(\"\\nResult of squaring %f is %f \", n,\
    \ res.numberNSquare(n,square));\n    System.out.printf(\"\\nResult of doubling\
    \ %f is %f \", n, res.numberNSquare(n,doubler));\n  }\n}\n\ninterface multiplier{\n\
    \  float processMyNumber(float r);\n}\n\nclass Result {\n  float hold;\n  void\
    \ result(){\n    hold =0;\n  }\n  float numberNSquare(float n, multiplier squaredNo){\n\
    \    return (squaredNo.processMyNumber(n));\n  }\n}\n```\n\nThe output from program\
    \ listing 4.4 above is as shown in figure 4.4 below:\n\n![](images/00011.jpeg)\n\
    \nFigure 4.4 The output from program listing 4.4.\n\nThe `square` and the `doubler`\
    \ lambda expressions implicitly implemented the only abstract method `processMyNumber`\
    \ of the interface `Multiplier`. The interface `Multiplier` was declared as a\
    \ second argument to the method `numberNSquare(int, Multiplier )` of class `Result`,\
    \ and with this the method `numberNSquare` would accept any object type of the\
    \ interface. So we were able to pass in the lambda expressions into the method\
    \ `numberNSquare` as required. This greatly simplified the codes and making it\
    \ more polymorphic.\n\nBefore I round up this chapter, one final note, an interface\
    \ can extend another interface. Give it a try and let’s meet again in the next\
    \ chapter to discuss program loops and arrays. Thank you for being there.\n\n\
    # Chapter 5\n\n# Program Control Loops and ForEach Loop\n\nProgram loops are program\
    \ statements that execute blocks of statements for repeated number of times. We\
    \ have three basic types of control loop statements; the `for` loop statement,\
    \ the `while` loop statement, and the `do` statement. We shall be looking at each\
    \ in turn in this chapter.\n\n## 5.1 The For Loop Statement\n\nThe `for loop statement`\
    \ executes a block of program statements or a single program statement within\
    \ an opening and closing braces for a specific number of times. The general syntax\
    \ for a `for loop` statement is as shown below:\n\n```java\nfor( loop_variable;\
    \ loop_conditional_expr ; loop_incremental_stmt ){\n   loop statements\n}\n```\n\
    \nThe loop variable set the initial value for the incremental statement variable.\
    \ The execution of a `for loop statement` starts with the loop variable initialization.\
    \ There may be more than one loop variables so long as they are separated with\
    \ commas all should be fine. After the loop variable is initialized, the loop\
    \ conditional expression is evaluated, and if it evaluates to a true value the\
    \ loop statement is executed and the increment statement is executed for another\
    \ iteration. And if the conditional expression does not evaluate to a value true\
    \ the loop is exited. For an illustration, program listing 5.1 prints out a set\
    \ of numbers from 1 to 10 on the console by using a for loop statement.\n\nProgram\
    \ listing 5.1:\n\n```java\npublic class ForLoop\n{\n  public static void main(String[]\
    \ args){\n    for(int i=1; i < 11 ; ++i)\n      System.out.println(i);\n  }\n\
    }\n```\n\nThe output from program listing 5.1 is shown in figure 5.1 below:\n\n\
    ![](images/00012.jpeg)\n\nFigure 5.1 Output from program listing 5.1.\n\nThe for\
    \ loop statement in program listing 5.1 started with the initialization of variable\
    \ `i` to 1 in the loop variable statement (`i = 1`). It then evaluated the loop\
    \ conditional statement (`i<10`) to test if variable `i` was still less than 10\
    \ and if true the for loop statement body is executed. You can omit the loop statement\
    \ opening and closing braces if you have a single line of statement in your for\
    \ loop block.\n\n## 5.2 The Nested For Loop\n\nA nested for loop represents an\
    \ occurrence of an iterative event for a specific number of times. It is a `for\
    \ loop` inside another for loop. The syntax for a `for loop` is as follows:\n\n\
    ```java\nfor(loop_var1; conditional_expr; incremental_stmt1)\n   for(loop_var2;\
    \ conditional_expr2; incremental_stmt2)\n```\n\nFor an illustration, program listing\
    \ 5.2 generates a set of multiplication tables from 1 to 4 using nested loop.\n\
    \nProgram listing 5.2:\n\n```java\npublic class NestedForLoop\n{\n  public static\
    \ void main(String[] args){\n    for(int i=1; i < 5 ; ++i){\n      System.out.println(\"\
    \\n\" + i + \" Series Table\");\n      for(int j=1; j < 4 ; ++j)\n        System.out.println(\
    \ i + \" * \" + j + \" = \" + (i*j) );\n    }\n  }\n}\n```\n\nThe output from\
    \ program listing 5.2 is as shown in figure 5.2:\n\n![](images/00013.jpeg)\n\n\
    Figure 5.2 The output from program listing 5.2.\n\nPlease note that you cannot\
    \ re-use variable names already used in the outer loop in the inner loop. This\
    \ is because the scope rule applies here. The inner and outer loops are in same\
    \ block.\n\n## 5.3 The Enhanced For Loop\n\nThe enhanced for loop is often used\
    \ with the array and its general syntax of usage is as shown below:\n\n```java\n\
    for( data_type element: array_name )\n```\n\nMore on the enhanced for loop later\
    \ in the array section.\n\n## 5.4 The Lambda Loop\n\nThe lambda foreach is introduced\
    \ into java 8 SE with the inclusion of `stream` class to the `java.util.Collections`\
    \ package of the core API. The `stream` class comes with some utility methods\
    \ of its own like `min`, `max`, `filter`, `findFirst`, and many others. Now, `stream`\
    \ can be used in combination with the lambda foreach loop to simplify the enhanced\
    \ for loop to the following statement:\n\n```java\ncollection_name.stream().forEach((object)\
    \ -> {\n  statement;\n})\n```\n\nCollections like `ArrayLists` can now use the\
    \ method `stream` with `forEach` functional statement to process their collections.\
    \ An array is a collection of objects of the same type e.g. a set of integer numbers\
    \ from 1 to 10, while an `arraylist` is a collection of objects of the same type.\
    \ We discuss more on this in sections 5.7 and 7.8b of this chapter and chapter\
    \ seven of this book. The following program listing 5.3 illustrates the use of\
    \ for each Loop by converting an array into an arraylist and then list out the\
    \ contents of the array with the `forEach` functional lambda expression.\n\n```java\n\
    import java.util.Arrays;\nimport java.util.ArrayList;\n\npublic class FilterLoop\n\
    {\n  public static void main(String[] args){\n    // Declaring and initializing\
    \ an arraylist counter with odd numbers\n    ArrayList<Integer> counter = new\
    \ ArrayList<Integer>(Arrays.asList(1,3,5,7,9));\n    System.out.println(\"\\n\
    \ A list of Odd numbers: \");\n    // Using the forEach inline statement to print\
    \ out a list of odd numbers\n    counter.stream().forEach((num) -> System.out.println(num));\n\
    \  }\n}\n```\n"
