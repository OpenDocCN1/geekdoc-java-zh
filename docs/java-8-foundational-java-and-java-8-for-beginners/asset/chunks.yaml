- fmt: "\ne) Also wrote the String representation to a file\n\nThese are the standard\
    \ steps to take when writing an xml document with the DOM objects. Next we discuss\
    \ how to read an xml document with java.\n\n## 10.2 Reading XML with Java\n\n\
    XML documents can be read with the `DOM` or `SAX` in java. However the `DOM` requires\
    \ that the whole document be read into the computer memory therefore it is memory\
    \ intensive. While the `SAX` would only read an element into memory at a time\
    \ and therefore uses less memory and can process any length of xml document. For\
    \ this reason the `SAX` method is preferred and discussed in this book (considering\
    \ book length and other factors).\n\nThe idea on which a SAX reader is developed\
    \ is that SAX exposes an interface called `contentHandler` with some utility default\
    \ methods like the `startDocument()`, `startElement()`, `endElement()` and `endDocument()`\
    \ methods for triggering a start of document, a start of element, an end of element\
    \ and an end of document event as the names of the methods implied. The methods\
    \ are default implementations simply do nothing.\n\nTherefore the `contentHandler()`\
    \ interface must be implemented and its necessary methods overridden to suit your\
    \ purpose. This was done in program listing 10.3 by the class `Xmlhandler`. Next\
    \ the reader object of the type `XmlReader` uses SAX and the `Xmlhandler` object\
    \ to read the xml file content and print them to the standard output. It is really\
    \ as simple as that. Please take your time to go through the program listing.\
    \ The listing can be as short or as long as you desire depending on your purpose\
    \ again.\n\nProgram listing 10.3 shows how to read the xml document (`drinks.xml`)\
    \ created in program listing 10.2 with SAX above.\n\nProgram listing 10.3:\n\n\
    ```java\npackage xmlapplication3;\n\nimport javax.xml.parsers.SAXParser;\nimport\
    \ javax.xml.parsers.ParserConfigurationException;\nimport javax.xml.parsers.SAXParserFactory;\n\
    import org.xml.sax.SAXException;\nimport org.xml.sax.Attributes;\nimport org.xml.sax.helpers.DefaultHandler;\n\
    import java.io.File;\nimport java.io.IOException;\n\n/**\n*\n* @author Dosunmu\n\
    */\npublic class XmlSaxReader {\n    /**\n     * @param args the command line\
    \ arguments\n     */\n    public static void main(String[] args) {\n        String\
    \ xmlFile = \"C:\" + File.separator + \"practice\" + File.separator + \"drinks.xml\"\
    ;\n        XmlReader reader =new XmlReader();\n        reader.readXmlContents(xmlFile);\n\
    \    }\n}\n\nclass Xmlhandler extends DefaultHandler{\n    //Detect and handle\
    \ the event of locating the start of the document\n    int endingElementFlag;\n\
    \    String elementName;\n\n    void xmlhandler() {\n        endingElementFlag\
    \ = 0;\n        elementName= null;\n    }\n\n    @Override\n    public void startDocument()\
    \ {\n        System.out.println(\"Found the beginning of the document\");\n  \
    \  }\n\n    //Detect and handle the event of locating a starting element tag\n\
    \    @Override\n    public void startElement(String url,String lName,String eleName,\
    \ Attributes attr) throws SAXException {\n        endingElementFlag = 0;\n   \
    \     elementName= eleName;\n        StringBuilder content = new StringBuilder();\n\
    \        content.append(\"A starting element tag \" +\"\\\"\" +eleName +\"\\\"\
    \"+\" is located\");\n        //Process elemeent's attributes if any\n       \
    \ if(attr.getLength() >0 ){\n            content.append(\" with the following\
    \ attribute(s); \");\n            for(int t=0; t < attr.getLength(); t++){\n \
    \               content.append ( \"\\\"\"+attr.getLocalName(t)+\"\\\"\");\n  \
    \              content.append(\" with a value \" +\"\\\"\"+ attr.getValue(t)+\"\
    \\\"\"+\"\\n\");\n            }\n        }\n        //Print discovered element\
    \ to the conseole\n        System.out.println(content.toString());\n    }\n\n\
    \    //Processing the content of the element\n    @Override\n    public void characters(char[]\
    \ ele_content, int start_position, int content_length) throws SAXException {\n\
    \        String elemNm= new String(ele_content,start_position, content_length);\n\
    \        if(endingElementFlag== 0 && (!(elementName.equalsIgnoreCase(\"Drink\"\
    ) ||elementName.equalsIgnoreCase(\"Soft_Drinks\"))) {\n            System.out.println(\"\
    with a content: +\"\\\"\" + new String(ele_content,start_position, content_length)+\"\
    \\\"\");\n        }\n    }\n\n    //Detect and handle an element ending\n    @Override\n\
    \    public void endElement (String ele, String lName, String eleName) throws\
    \ SAXException {\n        endingElementFlag=1;\n        System.out.println (\"\
    An Element tag \" +\"\\\"\" + eleName + \"\\\" is found.\");\n    }\n\n    //Detect\
    \ and handle a document's ending\n    @Override\n    public void endDocument()\
    \ throws SAXException {\n        System.out.println(\"End of document.\");\n \
    \   }\n}\n\nclass XmlReader{\n    void readXmlContents(String xmlDoc) {\n    \
    \    try {\n            //create an xmlHandler instance\n            Xmlhandler\
    \ xhandler = new Xmlhandler();\n            //Create parser factory instance\n\
    \            SAXParserFactory sxFactory = SAXParserFactory.newInstance();\n  \
    \          // Create a parser using the parser factory\n            SAXParser\
