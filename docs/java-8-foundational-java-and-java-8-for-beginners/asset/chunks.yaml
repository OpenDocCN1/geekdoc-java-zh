    \ expression){\n    Program statement;\n    Loop expression;\n}\n```\n\n例如，为了生成一个在\
    \ 0 到 10 之间的奇数列表，我们需要一个 while 循环，因为在开始计数之前，我们可能不知道有多少个奇数。因此，我们做的只是为程序设置一个限制，让程序为我们列出奇数，无论是在\
    \ 0 到 10 的范围还是 0 到 1000 的范围。程序列表 5.4 生成了 0 到 10 范围内的奇数列表：\n\n程序列表 5.4：\n\n```java\n\
