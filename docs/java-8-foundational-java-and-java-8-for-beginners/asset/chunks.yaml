    result = value1 + value2;\n```\n\n#### 算术乘法二元运算符 (`*`)\n\n乘法二元运算符在大多数编程语言中用星号表示。它将两个数值或数值变量相乘。用法语法如下：\n\
    \n```\nresult = value1 * value2;\n```\n\n#### 算术减法二元运算符 (`-`)\n\n减法二元运算符作用于两个操作数。它返回左侧数值或内容减去右侧数值或内容的结果。用法语法如下：\n\
    \n```\nresult = value1 - value2;\n```\n\n#### 算术除法二元运算符 (`/`)\n\n除法二元运算符也作用于两个操作数，在大多数语言中用斜杠表示。它返回分子（左侧）除以分母（右侧）的结果。用法语法如下：\n\
