    Binary operators process two operands at the same time. They are the addition,
    subtraction, multiplication, division and the modulus operator as enumerated below:


    The Arithmetic Addition Binary Operator (+)


    The addition binary operator is represented with the plus sign. It adds the contents
    of numeric values or numeric variables. The syntax of usage in java programming
    is as described below:


    result = value1 + value2;


    The Arithmetic Multiplication Binary Operator (*)


    The multiplication binary operator is represented by the asterisk symbol in most
    programing languages including java. It multiplies two numeric values or numeric
    variable contents together. The syntax of usage is as described below:


    result = value1 * value2;


    The Arithmetic Subtraction Binary Operator (-)


    The arithmetic subtraction operator subtracts operates on two operands. It returns
    the result of subtracting the numeric value or content of the right operand from
    the numeric value or content of the left operand. The syntax of usage is as described
    below:


    result = value1 – value2;


    The Arithmetic Division Binary Operator (/)


    The arithmetic division binary operator also acts on two operands and it is represented
    by the forward slash in most programming languages. It returns the result of dividing
    the numerator or the left side operand with the denominator or the right side
    operand. The syntax of usage is as described below:


    result = value1 / value2;


    The Arithmetic Modulus Binary Operator (%)


    The arithmetic modulus binary operator acts on two numeric operands and is represented
    by the percentage symbol in most programming languages including java. It returns
    the remainder of the normal division operation. The usage syntax is as described
    below:


    result = value1 % value2;


    Program listing 2.2 below illustrates the application of the various binary arithmetic
    operators earlier discussed.


    Program listing 2.2


    public class BinaryOperators


    {


      public static void main(String[] args){


      float result, leftOperand, rightOperand;


      leftOperand = 68;


      rightOperand = 10;


        System.out.println("\n" );


        result = leftOperand + rightOperand;


        System.out.println( leftOperand + " + " + rightOperand + " = " + result);


        result = leftOperand - rightOperand;


        System.out.println( leftOperand + " - " + rightOperand + " = " + result);


        result = leftOperand * rightOperand;


        System.out.println( leftOperand + " * " + rightOperand + " = " + result);


        result = leftOperand / rightOperand;


        System.out.println( leftOperand + " / " + rightOperand + " = " + result);


        result = leftOperand % rightOperand;


        System.out.println( leftOperand + " % " + rightOperand + " = " + result);


      }


    }


    The output from program listing 2.2 above is presented in figure 2.2 below:


    ![](images/00003.jpeg)


    Figure 2.2\. The output from program listing 2.2.


