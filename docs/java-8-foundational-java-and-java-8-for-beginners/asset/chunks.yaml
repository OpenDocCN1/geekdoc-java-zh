    `java class`，并以类名命名、扩展名为 `.java` 保存到计算机系统中的任意目录来开发 Java 应用程序。前提是你已经在计算机上下载并安装了
    `jdk`（Java 开发工具包）。稍后详细介绍。


    ### 1.2.2 Java Applets


    Java applets 是嵌入在 Web 文（超文本标记文档，如 `HTML5`）`applet` 标签中的 Java 程序。你可以通过在记事本等文本编辑器中编写
    `java class`，并以类名命名、扩展名为 `.java` 保存到计算机系统中的任意目录来开发 Java 应用程序。前提是你已经在计算机上下载并安装了
    `jdk`（Java 开发工具包）。稍后详细介绍。


