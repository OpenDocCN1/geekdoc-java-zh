    \nThe string data type is an object in `java` programming language. A string is\
    \ represented as an unlimited combination of characters within double quotes.\
    \ For example “John” is a string literal. Now you can define the string variable\
    \ `firstname` as pointing to the string literal “John” with the following statement:\n\
    \n```java\nString firstName = “John”;\n```\n\nNote that string content cannot\
    \ be changed once assigned to a variable as done above, though the reference to\
    \ the string can be changed to another in the variable. For example, when you\
    \ try to modify the string variable `firstName`’s content to a new value “Johnson”\
    \ by using the plus sign for string concatenation as shown below:\n\n```java\n\
    firstName = firstName + “son”;\n```\n\nWhen the compiler encounters such a statement\
    \ as above, it uses its core API `stringBuffer` method `append()` to rewrite the\
    \ statement as shown below:\n\n```java\nfirstName = new StringBuffer(firstName).append(“son”).toString();\n\
    ```\n\nand produce the output: Johnson\n\nSimilar process occur when you use string\
    \ modifying methods like the `toLowerCase()` and the `trim()` string methods.\
    \ We shall be discussing more on this in the following section. Array contents\
    \ can also be converted to strings by the `toString()` `Array` class method. For\
