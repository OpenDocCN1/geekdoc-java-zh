    # Introduction


    This is a special java book. It aims to allay the fear associated with Java programming
    that is usually experienced by new java programmers, by explaining in simple terms
    object oriented programming concepts, by building solid foundations for a deep
    and easy understanding of design patterns theory in software design and development
    with the ultimate goal of passing on a lasting java legacy, by working with the
    core Java APIs, avoiding as much as possible the version insanity syndrome, discussing
    only the necessary additions that are relevant to the developer, showing how the
    additions became necessary and their applications.


