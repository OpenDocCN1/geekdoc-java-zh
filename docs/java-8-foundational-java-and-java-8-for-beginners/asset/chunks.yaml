    ### 3.2.3 Protected Access Modifier


    The protected access modifier is applicable to class member variables and methods.
    The protected members are accessible within their own class hierarchy only. That
    is, a protected class member variable or method is accessible through sub classes
    in the same package and to subclasses in other packages. Protected access modifiers
    are applied to member methods that are created to be inherited or overridden by
    sub classes.


    ### 3.2.4 Private Protected Modifier


    A private protected class member can be accessed through inheritance by classes
    in other packages. While private protected class members may not be accessed by
    any other non-sub classes in the same package but by subclasses in the same package.


    ### 3.2.5 The Default Access Modifier


    A class with no specified access modifier is assigned a default access modifier
    by default. Note that the default access modifier has no keyword to represent
    it. The default access modifier only gives access to other classes in the same
    package.


    ### 3.2.6 The Abstract Modifier


    A class that is modified with the abstract keyword is called an abstract class,
    which means that the class contains one or more un-implemented methods. An un-implemented
    method contains no body and therefore must be overridden in a sub class, this
    and more to be discussed later in the book.


    ### 3.2.7 The Static Modifier


    A class member that is modified with the static access modifier belongs only to
    the class. It is unique and does not have instance copies. Normally, when instance
    objects are created from a class the objects get their own copies of the class
    member. But with the static modifier there is only one copy of such a class member
    variable.


    A static member is accessed by using the class name followed by a dot, and it
    can be accessed before the creation of the class object. For this reason, static
    member variable must be initialized because they must have a value, and static
    methods must be defined. Member methods and variables can be declared as static.
    More importantly, the static keyword cannot be used in the class methods.


    ### 3.2.8 The Final Modifier


    The final modifier can be used with a class, a method, or a member variable with
    different implications which are as explained below:


    a) The Final Class


    The keyword “final” when used as a class modifier renders the class un-inheritable.
    The syntax of usage is as described below:


    final Book{


    // class body


    }


    b) The Final Method


    A method modified with the final key word is not overridable by inheriting or
    subclasses. The syntax of usage is as described below:


    class book {


      final borrowBook( ){


          //body of method


      }


    }


    This acts just like the private access modifier.


    c) The Final Variable


    A variable modified with the final keyword becomes a constant whose value cannot
    be altered or updated after being initialized. The syntax of usage is as described
    below:


    final String bookTitle;


    ## 3.3 Class Objects


    An object is an instance of a class and do have characteristics which are the
    followings; identity, state, type and behavior. These characteristics are as further
    explained below:


    ### 3.3.1 An Object’s Type


    The word “object” is a generic word for anything that can be named. An object
    must therefore belong in a category which may be a concept (an idea, knowledge
    or a method), a place, a thing, an animal or human. Therefore we say that an object
    has a type. Since an object will always belong in a category. For example the
    following java codes create an object of the type birds in the animal category.


    Bird sparrow = new Bird( );


    The word “Bird” at the left declares sparrow as a type Bird and the new keyword
    at the right allocated the needed memory space for the type Bird as defined by
    the Bird class and assigned the memory space address to the sparrow object. To
    use the above statement, you must have earlier created a class Bird somewhere
    in the program and the class may look like written below:


       class Bird{


        private int flightStatus;


        public Bird( ){


          flightStatus= 0;


        }


        void setFlightStatus(int flightHieght ){


          flightStatus = flightHieght;


        }


        int tellHeight( ){


          return flightStatus;


        }


      } 


    ### 3.3.2 An Object’s State


    An Object has properties and these properties can be the object’s color, shape,
    weight, position, or size. An object’s property is always an attribute than can
    be measured and the value of this measurement determines the object’s state at
    any point in time. For example, the object sparrow has the property “flightStatus”
    which can be used to determine the flight status of the bird, whether in flight
    (when “flightStatus” is greater than 0) or perched (when flightStatus is 0).


    ### 3.3.3 An Object’s Identity


    An object maintains a unique identity and is different to similar objects. For
    example, another object sparrow cannot be created in the same program block as
    long as the earlier created object sparrow is still in use and undeleted from
    the memory, but a similar type sparrow2 or eagle may be created. For this reason
    the following program statements are legal:


    Bird sparrow2 = new Bird( );


    Bird sparrow = new Bird( );


    Bird eagle = new Bird( );


    While the following declaration statements are not legal:


    Bird sparrow = new Bird( );


    Bird sparrow = new Bird( );


    ### 3.3.4 An Object’s Behavior


    Since objects like bird, kite and plane can fly. Objects like robots and cameras
    can move and see, and objects like fish and submarines can swim. You would agree
    with me that objects have behaviors which are closely linked to their types. This
    phenomenon is what is defined in the class definition as object methods.


    These methods (behaviors) are usually named with action words (verbs). For example,
    the “setFlightStatus( )” method of the class Bird is a general behavior of all
    objects in the category bird as a bird may decide to fly so high into the sky
    by setting its flight status to a value thousands of feet above sea level, or
    may decide to perch somewhere at the sea level, at zero foot above sea level.
    The following program listing 3.1 brings this concept to life.


    Program listing 3.1


    /* Importing the JOption class to create a visual input pane. */


    import javax.swing.JOptionPane;


    public class BirdObject


    {


      public static void main(String[] args){


         Bird eagle = new Bird( );


      /*Reading a height value with the imported JOptionPlane class''s method */


        String m = JOptionPane.showInputDialog("Enter a height in figure ");


        /*Setting eagle''s flight behavior with the method setFlightStatus.*/


        eagle.setFlightStatus(Integer.parseInt(m));


        System.out.println("\n" );


        if(eagle.tellHeight() > 0 )


            System.out.println("Eagle is in flight mode. " );


        else


            System.out.println("Eagle has perched. " );        


       }


      }


       class Bird{


        private int flightStatus;


        public Bird( ){


          flightStatus= 0;


        }


        void setFlightStatus(int flightHieght ){


          flightStatus = flightHieght;


         }


        int tellHeight( ){


          return flightStatus;


        }


      }


