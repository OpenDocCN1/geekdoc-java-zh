    \ 读取 XML 文档。\n\n## 10.2 使用 Java 读取 XML\n\n在 Java 中，可以使用 `DOM` 或 `SAX` 读取 XML 文档。然而，`DOM`\
    \ 要求将整个文档读取到计算机内存中，因此它是内存密集型的。而 `SAX` 每次只将一个元素读入内存，因此内存占用更少，可以处理任何长度的 XML 文档。出于这个原因，本书更倾向于并讨论\
    \ `SAX` 方法（考虑到书籍长度和其他因素）。\n\n开发 SAX 读器的理念是：SAX 暴露了一个名为 `contentHandler` 的接口，并带有了一些实用的默认方法，如\
    \ `startDocument()`、`startElement()`、`endElement()` 和 `endDocument()` 方法，正如方法名所示，它们用于触发文档开始、元素开始、元素结束和文档结束事件。这些方法的默认实现简单地什么都不做。\n\
    \n因此，必须实现 `contentHandler()` 接口并重写其必要方法以适应你的需求。在程序列表 10.3 中，通过 `Xmlhandler` 类实现了这一操作。接下来，类型为\
    \ `XmlReader` 的读者对象使用 SAX 和 `Xmlhandler` 对象来读取 XML 文件内容并将其打印到标准输出。其实就这么简单。请花时间仔细该程序列表。根据你的目的，列表的长度可以短也可以长。\n\
    \n程序列表 10.3 显示了如何使用上述 SAX 读取程序列表 10.2 创建的 XML 文档（`drinks.xml`）。\n\n程序列表 10.3：\n\
    \n```java\npackage xmlapplication3;\n\nimport javax.xml.parsers.SAXParser;\nimport\
    \ javax.xml.parsers.ParserConfigurationException;\nimport javax.xml.parsers.SAXParserFactory;\n\
    import org.xml.sax.SAXException;\nimport org.xml.sax.Attributes;\nimport org.xml.sax.helpers.DefaultHandler;\n\
    import java.io.File;\nimport java.io.IOException;\n\n/**\n*\n* @author Dosunmu\n\
    */\npublic class XmlSaxReader {\n    /**\n     * @param args the command line\
    \ arguments\n     */\n    public static void main(String[] args) {\n        String\
    \ xmlFile = \"C:\" + File.separator + \"practice\" + File.separator + \"drinks.xml\"\
    ;\n        XmlReader reader =new XmlReader();\n        reader.readXmlContents(xmlFile);\n\
    \    }\n}\n\nclass Xmlhandler extends DefaultHandler{\n    //检测并处理定位到文档开始的事件\n\
    \    int endingElementFlag;\n    String elementName;\n\n    void xmlhandler()\
    \ {\n        endingElementFlag = 0;\n        elementName= null;\n    }\n\n   \
    \ @Override\n    public void startDocument() {\n        System.out.println(\"\
    Found the beginning of the document\");\n    }\n\n    //检测并处理定位到起始元素标签的事件\n  \
    \  @Override\n    public void startElement(String url,String lName,String eleName,\
    \ Attributes attr) throws SAXException {\n        endingElementFlag = 0;\n   \
    \     elementName= eleName;\n        StringBuilder content = new StringBuilder();\n\
    \        content.append(\"A starting element tag \" +\"\\\"\" +eleName +\"\\\"\
    \"+\" is located\");\n        // 如果有属性，则处理元素的属性\n        if(attr.getLength() >0\
    \ ){\n            content.append(\" with the following attribute(s); \");\n  \
    \          for(int t=0; t < attr.getLength(); t++){\n                content.append\
    \ ( \"\\\"\"+attr.getLocalName(t)+\"\\\"\");\n                content.append(\"\
    \ with a value \" +\"\\\"\"+ attr.getValue(t)+\"\\\"\"+\"\\n\");\n           \
    \ }\n        }\n        // 将发现的元素打印到控制台\n        System.out.println(content.toString());\n\
    \    }\n\n    // 处理元素的内容\n    @Override\n    public void characters(char[] ele_content,\
    \ int start_position, int content_length) throws SAXException {\n        String\
    \ elemNm= new String(ele_content,start_position, content_length);\n        if(endingElementFlag==\
    \ 0 && (!(elementName.equalsIgnoreCase(\"Drink\") ||elementName.equalsIgnoreCase(\"\
    Soft_Drinks\"))) {\n            System.out.println(\"with a content: +\"\\\"\"\
    \ + new String(ele_content,start_position, content_length)+\"\\\"\");\n      \
    \  }\n    }\n\n    // 检测并处理元素结束\n    @Override\n    public void endElement (String\
    \ ele, String lName, String eleName) throws SAXException {\n        endingElementFlag=1;\n\
    \        System.out.println (\"An Element tag \" +\"\\\"\" + eleName + \"\\\"\
    \ is found.\");\n    }\n\n    // 检测并处理文档的结束\n    @Override\n    public void endDocument()\
    \ throws SAXException {\n        System.out.println(\"End of document.\");\n \
    \   }\n}\n\nclass XmlReader{\n    void readXmlContents(String xmlDoc) {\n    \
    \    try {\n            // 创建 xmlHandler 实例\n            Xmlhandler xhandler =\
    \ new Xmlhandler();\n            // 创建解析器工厂实例\n            SAXParserFactory sxFactory\
    \ = SAXParserFactory.newInstance();\n            // 使用解析器工厂创建解析器\n           \
    \ SAXParser sxParser = sxFactory.newSAXParser();\n            // 处理器传递 xml 文件\n\
    \            sxParser.parse(xmlDoc, xhandler);\n        } catch (SAXException\
    \ e) {\n            System.out.println(\"Could not parse the XML document-> \"\
    + e.getMessage());\n        } catch (IOException e) {\n            System.out.println(\"\
    Could not open path.\"+xmlDoc);\n        } catch (ParserConfigurationException\
    \ e) {\n            System.out.println(\"Unable to create a parser-> \"+ e.getMessage());\n\
    \        }\n    }\n}\n```\n\n并且上述程序列表 10.3 的输出如图 10.3 所示：\n\nFound the beginning\
    \ of the document\nA starting element tag \"Soft_Drinks\" is located with the\
    \ following attribute(s); \"type\" with a value \"soft_drink\"\nA starting element\
    \ tag \"Drink\" is located\nA starting element tag \"Name\" is located\nwith a\
    \ content: \"CocaCola\"\nAn Element tag \"Name\" is found.\nA starting element\
    \ tag \"Price\" is located\nwith a content: \"0.32\"\nAn Element tag \"Price\"\
    \ is found.\nAn Element tag \"Drink\" is found.\nA starting element tag \"Drink\"\
    \ is located\nA starting element tag \"Name\" is located\nwith a content: \"Fanta\"\
    \nAn Element tag \"Name\" is found.\nA starting element tag \"Price\" is located\n\
    with a content: \"0.32\"\nAn Element tag \"Price\" is found.\nAn Element tag \"\
    Drink\" is found.\nA starting element tag \"Drink\" is located\nA starting element\
    \ tag \"Name\" is located\nwith a content: \"Limca\"\nAn Element tag \"Name\"\
    \ is found.\nA starting element tag \"Price\" is located\nwith a content: \"0.3\"\
    \nAn Element tag \"Price\" is found.\nAn Element tag \"Drink\" is found.\nAn Element\
    \ tag \"Soft_Drinks\" is found.\nEnd of document.\nBUILD SUCCESSFUL (total time:\
    \ 2 seconds)\n\n图 10.3。上述程序列表 10.3 的输出。\n\n我们确实走了一段很长的路。我希望你理解了这些程序列表，如果是的话，祝贺你。如果还没有，请休息一下后再尝试。在此期间，即使你理解了列表，我仍然希望你通过下载此书获取一些启发性的剂：“[Best\
    \ Inspirational Quotes for Success; a subject by subject inspiration for life.](http://www.amazon.co.uk/dp/B00OBDHMSA)”来自西奥德·罗斯福、杰克·坎菲尔德、德圣母、齐格·齐格拉、亨利·福特、亚伯拉罕·林肯、本·卡森以及许多狮子般的人。\n\
    \n"
- fmt: "\nBelieve me you will always need this success quotes to keep you going when\
    \ things get tough as it often does in the world of programming. So I have compiled\
    \ these for you to also help make you a psychologically sound programmer. Just\
    \ keep holding on and you will soon see the light. Thank you once again for the\
    \ effort and determination.\n\n# Chapter 11\n\n## Java Applets\n\nApplets are\
    \ mainly used for animations and game creations. They are embedded in hypertext\
    \ markup language documents. Therefore you need a foundational knowledge of [HTML5](http://www.amazon.co.uk/dp/B00PIMD5P2)\
    \ to use applets. The basic structure of an HTML5 document is as described in\
    \ listing 11.1 below:\n\nListing 11.1:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title> My First HTML5 Web Page </title>\n<meta charset=\"UTF-8\">\n</head>\n\
    <body>\n       <header ><em ><u> MY APPLET PROJECT.</u></em><br/> </header>\n\
    \       <nav><a href=\"#\">Home</a> |<a href=\"#\">Exit</a>  </nav><br/><br/>\n\
    \       <header ><i> My Applet Image Section</i> </header><br/>\n       <section\
    \ id=”image_applet”>\n       </section><br/>\n       <footer> &copy copyright\
    \ August 2015</footer>\n</body>\n</html>\n```\n\nThe `<!DOCTYPE html>` element\
    \ element describes the document as a HTML5 document to the browser. The `<html>`\
    \ element acts as the parent container for the html document. The `<head>` element\
    \ acts as the head of the document containing the followings; `<title>` element\
    \ for displaying the document’s title in the web browser, the character encoding\
    \ for the page described in the `<meta >` element tag, and the in some cases the\
    \ page style sheet- included by the `<style>` element.\n\nAfter the head element\
    \ comes the `<body>` element which contains the body of the html document that\
    \ includes the `<header>` elements for displaying the various sections’ titles\
    \ enclosed in `<section>` elements across the page, the page footer element for\
    \ displaying footer information like the copyright and the address information,\
    \ and various other minor text editing elements like the `<br/>` singleton element\
    \ for inserting new lines, `<u>` element for text underlining, `<em>` element\
    \ for creating emphatic texts. The major elements must be in the order described\
    \ or you end up with a malformed html document.\n\nWhen you save listing 11.1\
    \ in a text document with an extension `.html` and as type `ALL Files`. You can\
    \ double click the file to have it displayed in your browser as shown in figure\
    \ 11.1 below:\n\n![](images/00036.jpeg)\n\nFigure 11.1. The output of program\
    \ listing 11.1 above.\n\nSure this is just a basic html5 web page devoid of any\
    \ [CSS](http://www.amazon.co.uk/dp/B00QZ2S2JI) styling, though sufficient for\
    \ our discussion in this chapter. I recommend that you download the book titled\
    \ “[HTML5; simplified beginners to intermediate level](http://www.amazon.co.uk/dp/B00PIMD5P2)`,\
    \ if you are not already familiar with html or has not upgraded to the new html5\
    \ for a serious applet web development project, and the book titled “[CSS3; CSS2\
    \ and 3 from beginners’ level up (Two in one)](http://www.amazon.co.uk/dp/B00QZ2S2JI)”\
    \ for html page outlaying and styling for a professional looking web page. Both\
    \ from amazon kindle book store, by clicking on the links or by typing the book\
    \ titles into the search box. Thank you as you do so.\n\n### 11.1 The Applet Element\n\
    \nAn applet is embedded into an html document with the applet element. The applet\
    \ element is as described below:\n\n```html\n<applet code=”applet.class” width=200\
    \ height=100 > </applet>\n```\n\nThe `code` attribute specifies the applet byte\
    \ code (applet class) gotten by compiling the applet source file while the `width`\
    \ and `height` set the width and height of the applet. The applet is compiled\
    \ in the same way as a java application is compiled with the `javac` command after\
    \ which it can be run with the `appletviewer` command. And if your applet would\
    \ require some parameters, the parameter can be gotten from the web page with\
    \ the `param` element as shown below:\n\n```html\n<applet code=”applet.class”\
    \ width=200 height=100 >\n<param name=sex value=”Male” >\n</applet>\n```\n\nThe\
    \ `param` element’s attribute `name` is used for specifying the name of the parameter,\
    \ while the attribute `value` is used for supplying the parameter’s value.\n\n\
    ### 11.2 An Applet’s Structure\n\nAn applet does not have a static public main\
    \ method common to java applications, instead what it has is the public `init()`\
    \ method which initializes the applet upon starting. Java applets have no need\
    \ of a required method. The methods are invoked by the browser as required by\
    \ the java virtual machine. The following methods of the `Applet` class (that\
    \ extends the `Panel` class) are important for the implementation of an applet.\n\
    \na) `public void init()`: Used by the web browser for applet initializations\n\
    b) `pubic void start()`: Used by the web browser for starting the applet after\
    \ initialization. Called as many times as the embedding page is loaded\nc) `public\
    \ void stop()`: Invoked by the web browser to stop an applet whenever the embedding\
    \ page is minimized, the user browses away, or the applet is stopped\nd) `public\
    \ void destroy()`: The destroy method is invoked by the web browser to destroy\
    \ the applet by clearing it out of its memory\n\nThe containing `Applet` class\
    \ for the above listed methods must be imported for your applets to be able to\
    \ use them. The containing `Applet`’s class hierarchy is as described in figure\
    \ 11.2 below:\n\n![](images/00037.jpeg)\n\nFigure 11.2. The Applet’s class inheritance\
    \ hierarchy tree.\n\nAccording to the hierarchical Applet’s family tree, the class\
    \ `applet` inherited from its parent class `Panel` which inherited from its parent\
    \ class `Container` also inheriting from the parent class `Component` which inherited\
    \ from the mother of all classes, the `Object` class. Thus the `Applet` class\
    \ is seriously enriched. However, there is still an important method not of the\
    \ applet class’s hierarchy; the `public void paint( )` method of the `java.awt.Grahphics`\
    \ class, used for painting the applet in the browser. Without you overriding these\
    \ methods the applet does nothing. Next let’s create an example applet that overrides\
    \ the applet’s `paint` method.\n\n### 11.3 An Example Applet\n\nThe following\
    \ example applet in program listing 11.2 displays the current time when started\
