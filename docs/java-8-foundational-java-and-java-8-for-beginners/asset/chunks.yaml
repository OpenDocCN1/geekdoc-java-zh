  trans: "\n程序列表 7.9 展示了 `Iterator` 接口的使用，通过在 `while` 循环表达式中使用 `Iterator` 接口的 `hasNext()`\
    \ 方法来测试列表是否为空，然后使用 `next()` 方法从列表中获取下一个对象元素。这再次带我们来到了另一个关于 Java 数组的启发性章节的结尾。我希望你在整理这一章节时和我一样过得愉快。请随我进入下一个章节，我们将对\
    \ `Strings` 进行更简短的讨论。\n\n# 第 8 章：字符串与正则表达式\n\n字符串数据类型在 `java` 编程语言中是一个对象。字符串表示为双引号内字符的无限组合。例如，“John”\
    \ 是一个字符串字面量。现在你可以通过以下语句将字符串变量 `firstname` 定义为指向字符串字面量 “John”：\n\n```java\nString\
    \ firstName = “John”;\n```\n\n注意，一旦像上面那样将字符串内容赋值给变量，其内容就不能再更改，但变量中的字符串引用可以更改为另一个。例如，当你尝试使用加号进行字符串拼接（如下所示）来将字符串变量\
    \ `firstName` 的内容修改为新值 “Johnson”时：\n\n```java\nfirstName = firstName + “son”;\n\
    ```\n\n当编译器遇到上述这样的语句时，它使用其核心 API `stringBuffer` 方法 `append()` 将该语句重写如下所示：\n\n\
    ```java\nfirstName = new StringBuffer(firstName).append(“son”).toString();\n```\n\
    \n并产生输出：Johnson\n\n当你使用 `toLowerCase()` 和 `trim()` 等字符串修改方法时，也会发生相似的过程。我们将在下一节中对此进行讨论。数组内容也可以通过\
    \ `Array` 类的 `toString()` 方法转换为字符串。例如，你可以通过以下语句在标准输出设备上显示数组 `ballsCopy` 的内容：\n\
    \n```java\nSystem.out.println(Arrays.toString(ballsCopy));\n```\n\n在下一节中将讨论许多可用的字符串类方法。\n\
    \n## 8.1 字符串类方法\n\n字符串类有许多工具方法，例如用于返回字符串长度的 `length()` 方法，`charAt(int)` 返回字符串中指定位置的字符，`compareTo(string)`\
    \ 用于比较两个字符串的相似性，如果字符串相似则返回整数值 0；如果比较的字符串位于提供的参数之前，则返回小于 0 的整数；如果比较的字符串位于提供的方法参数之后，则返回\
    \ 1。\n\n与 `compareTo(string)` 方法类似的方法是 `compareToIgnoreCase(String)`，区别在于它执行的是不区分大小写的比较。`trim()`\
    \ 方法移除字符串开头和结尾的空格，`toLowerCase()` 将字符串转换为小写。下面的程序列表 8.1 阐了字符串类方法的使用。\n\n程序列表 8.1：\n\
    \n```java\nimport java.util.*;\n\npublic class StringMethods\n{\n  public static\
    \ void main(String[] args){\n  String name = \"Feyisayo Dosunmu\";\n  String nameUpper\
    \ = \"FEYISAYO DOSUNMU\";\n  //Method length( ) 返回字符串的长度\n  System.out.printf(\"\
    \\n The lenght of name (name.length()) is %d \",name.length( ));\n  //Method toLowerCase(\
    \ ) 返回字符串的小写形式\n  System.out.printf(\"\\n nameUpper in lowercases (name.toLowerCase())\
    \ is %s \",name.toLowerCase( ));\n  //Method charAt(int) 返回指定位置的字符\n  System.out.printf(\"\
    \\n The character in position 3 counting from 0 (name.charAt(3)) is %c \",name.charAt(3));\n\
    \  //Method compareTo(string) 返回字符串比较的结果\n  System.out.printf(\"\\n The result\
    \ of comparing with (name.compareTo(nameUpper) ) is %d \",name.compareTo(nameUpper));\n\
    \  //Method compareToIgnoreCase(string) 返回字符串比较的结果\n  System.out.printf(\"\\n\
    \ The result of comparing with (name.compareToIgnoreCase(nameUpper) ) is %d \\\
    n\",name.compareToIgnoreCase(nameUpper));\n  }\n}\n```\n\n程序列表 8.1 的输出在图 8.1 所示：\n\
    \n![](img/00029.jpeg)\n\n图 8.1 程序列表 8.1 的输出。\n\n## 8.2 正则表达式\n\n正则表达式是用于验证程序输入的字符串模式。虽然\
    \ `java` 已经了一些输入检查方法（如 `Scanner` 类提供的方法），但这些方法在大多数输入验证场景中并不十分有效。例如，你可能需要创建自己的方法来验证电话号码或特定的安全代码数字。这时，你需要创建自己的唯一模式来验证用户的输入，而这就是通过正则表达式来完成的。\n\
    \n## 8.3 正则表达式的公式化\n\n正则表达式是通过使用可选量符和具有隐含含义的字符组合制而成的。某些字符和量符的表格如下方的 8.2 和 8.3\
    \ 所示：\n\n| 正则表达式字符 | 含义 |\n| :--- | :--- |\n| `\\d` | 代表数值输入并匹配单个数字，例如 1 |\n|\
    \ `\\D` | 代表非数值输入并匹配单个字符输入，例如 “a” |\n| `\\w` | 代表单个字母数字字符，匹配 0 – 9, a – z 和 A\
    \ – Z 范围内的单个输入，包括下划线 |\n| `/…/` | 包裹正则表达式模式 |\n| `\\[…]` | 代表字符集或范围 |\n\n图 8.2\
    \ 某些正则表达式字符及其含义的表格。\n\n| 量符 | 含义 |\n| :--- | :--- |\n| `?` | 0 次或 1 次出现 |\n| `*`\
    \ | 0 次或多次 |\n| `+` | 1 次或多次 |\n\n图 8.3 正则表达式量符的表格。\n\n现在，为了创建一个用于验证无限长度、可能以大小写字母开头的名称输入的正则表达式，我们采取以下步骤：\n\
    \n步骤 1：创建一个从 A 到 Z 的大写字母范围表示起始字母，所示：`[A–Z]`\n\n步骤 2：考虑该范围的量符。在这种情况下，量符是问号，代表 0\
    \ 次或 1 次出现。这适用于名称可能以大写字母开头。因此，新的表示方式所示：`[A– Z]?`\n\n步骤 3：创建一个小写字母范围，所示：`[a–z]`\n\
    \n步骤 4：确定创建的小写字母范围的量符。在这里，由于我们可以有无限的小写组合，合适的量符是加号（`+`），表示一次或多次出现，所示：`[a–z]+`\n\
    \n步骤 5：现在将起始字母和后续的小写组合字母结合，形成所示名称正则表达式：`[A-Z]?[a-z]+`\n\n是的，你做到了。你有一个用于验证名称输入的正则表达式。但过程并不总是如此简单，例如，制定用于有效的电子邮件地址、世界各地电话号码、万事卡号等的正则表达式并不简单。但作为一名专业的软件开发人员，你应该能够完成这些。\n"
- fmt: "\nHowever, this book cannot cover regular expression in full details as that\
    \ would be clearly beyond its scope, as regular expression is a subject in its\
    \ own right and deserves its own book. Therefore the author recommends that you\
    \ download the book on regular expressions titled “[[Regular Expressions; for\
    \ beginners and advanced level programmers](http://www.amazon.co.uk/dp/B00U4VPZ5U).”\
    \ Also by the author, for a deeper understanding of the subject. You can download\
    \ this book from Amazon by clicking on the link or by typing the title into the\
    \ search box in the kindle books store. Thank you as you do so.\n\n## 8.4 Regular\
    \ Expressions Application\n\nThe `string` class provides a `matches(string)` method\
    \ that matches a string against a provided regular expression argument and returns\
    \ a `Boolean` `true` if the string matches the regular expression or `false` if\
    \ it does not. Next, program listing 8.4 uses our previously created name regular\
    \ expression pattern created in section 8.3 above to validate a name input. Please\
    \ enjoy.\n\nProgram listing 8.4:\n\n```\nimport javax.swing.JOptionPane;\n\npublic\
    \ class RegularExp\n{\n  public static void main(String[] args){\nString nam =\
    \ JOptionPane.showInputDialog(\"Please enter a name -> \");\n  StringRegex name\
    \ = new StringRegex(nam);\n  if(name.validateName( ))\n    System.out.println(\"\
    \\n You entered a valid name.\" );\n  else\n    System.out.println(\"\\n You entered\
    \ an invalid name.\");     \n  }\n}\nclass StringRegex{\n  String namToValidate;\n\
    \  public StringRegex(String n){\n    namToValidate= n;\n  }\n  public StringRegex(\
    \ ){\n    namToValidate= \" \";\n  }\n  boolean validateName( ){\n    String RegPattern\
    \ = \"[A-Z]?[a-z]+\";\n return namToValidate.matches(RegPattern);\n  }\n  }\n\
    ```\n\nThe input and output of program listing 8.4 is shown in figure 8.4a and\
    \ 8.4b below:\n\n![](images/00030.jpeg)\n\nFigure 8.4a Input pane with a name\
    \ input for program listing 8.4.\n\n![](images/00031.jpeg)\n\nFigure 8.4b The\
    \ output from program listing 8.4 above.\n\nI want to thank you for being there\
    \ once again as another chapter comes to an end. Things are getting better; from\
    \ here on, we move on to a cooler level of exception handling, can’t wait to meet\
    \ you there. Thanks for hanging on.\n\n# Chapter 9\n\n# Exception Handling\n\n\
    Exceptions are abnormal program flow interruptions that affect the smooth execution\
    \ of computer programs. These disruptions are program errors that are undetectable\
    \ by the compiler at compilation times but become mysteriously unavoidable at\
    \ run times.\n\nSome of these exceptions are the followings; `FileNotFoundException`\
    \ - a file you wanted to open suddenly became unavailable due to a mysterious\
    \ deletion operation or an unclosed disk drive; division by zero exception - when\
    \ a divisor suddenly turn zero due to an illegal operation. To avoid these ugly\
    \ and sometimes unavoidable situations the `try..catch` exception handling statement\
    \ structure was introduced to handle statement blocks that are at risk of generating\
    \ exceptions.\n\n## 9.1 The `try..catch` Statement Model\n\nProgramming exceptions\
    \ are caught and handled within the `try..catch` statement block just like done\
    \ in c++ and C#. The general syntax for a `try..catch` statement is as stated\
    \ below:\n\n```\ntry{\n  A statement block at risk of throwing an exception;\n\
    }\ncatch(Exception_type exception_obj){\n  Exception handling statements;\n}\n\
    finally{\n  Statements to be executed after an exception or not;\n}\n```\n\nThe\
    \ `catch` statement block handles a generated exception if any and the `finally`\
    \ statement block contains a statement block that must be executed if there was\
    \ an exception or not.\n\n## 9.2 Benefits of Exception Handling\n\nBenefits of\
    \ using the `try..catch` statement structure is easily noticeable with the lack\
    \ of need for the `if` statement in the handling of the caught exceptions; if\
    \ there is a need to catch more exceptions all you need to do is provide more\
    \ `catch` statement block to handle such previously uncaught exceptions. This\
    \ is done as described below:\n\n```\ntry{\n  A statement block at risk of throwing\
    \ an exception;\n}\ncatch(Exception_type exception_obj){\n  Exception handling\
    \ statements;\n}\ncatch(Exception_type exception_obj2){\n  Exception handling\
    \ statements;\n}\ncatch(Exception_type exception_obj3){\n  Exception handling\
    \ statements;\n}\nfinally{\n  Statements to be executed after an exception or\
    \ not;\n}\n```\n\nThis naturally leads to a robust program design that enables\
    \ readability and easy program maintainability.\n\nThe second benefit of using\
    \ the `try..catch` statement structure is that you can determine at which level\
    \ you want the caught exception to be handled; at the point of generation or higher\
    \ up at the method calling level somewhere in the program. This is possible because\
    \ exceptions do travel up the call stack starting from the point of generation\
    \ up to the calling method until caught and handled by an exception handler.\n\
    \nIf the programmer is interested in catching an exception at the method calling\
    \ level, he or she would write the calling statement within a `try..catch` statement\
    \ and the method must be declared with the `throws` clause, where a `throw` clause\
    \ is the `throws` keyword followed by the exception type, for example;\n\nThrows\
    \ an `ArrayIndexOutOfBoundsException` if the method tries to access a location\
    \ outside the array boundary as illustrated in program listing 9.1:\n\n```\nimport\
    \ javax.swing.JOptionPane;\n\npublic class OutOfBound\n{\n  public static void\
    \ main(String[] args){\n    House sheraton = new House( );\n    try{\n      String\
    \ roomNum = JOptionPane.showInputDialog(\"Please enter a number -> \");\n    \
    \  int room = Integer.parseInt(roomNum) % 10;\n      int floor = Integer.parseInt(roomNum)\
    \ / 10;\n      int vacancy = sheraton.isVacant(floor,room);\n      if(vacancy\
    \ == 0)\n        System.out.printf(\"\\n room is vacant.\");\n      else\n   \
    \     System.out.printf(\"\\n room is not vacant.\");\n    } catch(ArrayIndexOutOfBoundsException){\n\
    \      System.out.printf(\"\\n Room out bound.\");\n    }\n  }\n}\n\nclass House{\n\
    \  private int[][] rooms = new int[2][10];\n  void House( ){\n    for(int floor=0;\
    \ floor < rooms.length; ++floor)\n      for(int room_no=0; room_no < 10; ++room_no)\n\
    \        rooms[floor][room_no] = 0;\n  }\n  int isVacant(int floor, int room)\
    \ throws ArrayIndexOutOfBoundsException{\n    return rooms[floor][room];\n  }\n\
    }\n```\n\nThe input and output of program listing 9.1 above is listed in figures\
    \ 9.1a and 9.1b:\n\n![](images/00032.jpeg)\n\nFigure 9.1a Input into program listing\
    \ 9.1.\n\n![](images/00033.jpeg)\n\nFigure 9.1b The output from program listing\
    \ 9.1.\n\nProgram listing 9.1 reserves twenty rooms in a two story building of\
    \ just one floor. The ground floor rooms started from room 0 as to room 9, and\
    \ the first floor started from room 10 to room 19. When a user enters any room\
    \ number outside of the range 0 to 19 the user shall be accessing a location outside\
    \ the array boundary. This will surely generate an `ArrayIndexOutOfBounds` exception\
    \ as we have witnessed in this instance.\n\n## 9.3 Catching Two or More Exceptions\
    \ in a Catch Statement\n\nJava 7 makes it possible to catch two or more exceptions\
    \ with a catch statement. This is achieved by separating the exception types with\
    \ vertical bars. The usage syntax is as described below:\n\n```\ntry{\n  A statement\
    \ block at risk of throwing an exception;\n}\ncatch(Exception_type_1 | Exception_type_2\
    \ exception_obj){\n  Exception handling statements;\n}\nfinally{\n  Statements\
    \ to be executed after an exception or not;\n}\n```\n\nFor example, program listing\
    \ 9.1 can also test for a division by zero mathematics exemption and get it reported\
    \ all in one catch statement block as done by an updated version program listing\
    \ 9.2:\n\n```\nimport javax.swing.JOptionPane;\n\npublic class TwoExceptions\n\
    {\n  public static void main(String[] args){\n    House sheraton = new House(\
    \ );\ntry{\n```\n"
