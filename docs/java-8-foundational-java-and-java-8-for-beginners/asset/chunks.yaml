    # Chapter 5


    # Program Control Loops and ForEach Loop


    Program loops are program statements that execute blocks of statements for repeated
    number of times. We have three basic types of control loop statements; the for
    loop statement, the while loop statement, and the do statement. We shall be looking
    at each in turn in this chapter.


    ## 5.1 The For Loop Statement


    The “for loop statement” executes a block of program statements or a single program
    statement within an opening and closing braces for a specific number of times.
    The general syntax for a “for loop” statement is as shown below:


    for( loop_variable; loop_conditional_expr ; loop_incremental_stmt ){


       loop statements


    }


    The loop variable set the initial value for the incremental statement variable.
    The execution of a “for loop statement” starts with the loop variable initialization.
    There may be more than one loop variables so long as they are separated with commas
    all should be fine. After the loop variable is initialized, the loop conditional
    expression is evaluated, and if it evaluates to a true value the loop statement
    is executed and the increment statement is executed for another iteration. And
    if the conditional expression does not evaluate to a value true the loop is exited.
    For an illustration, program listing 5.1 prints out a set of numbers from 1 to
    10 on the console by using a for loop statement.


    Program listing 5.1:


    public class ForLoop


    {


      public static void main(String[] args){


         for(int i=1; i < 11 ; ++i)


         System.out.println(i);


       }


    }


    The output from program listing 5.1 is shown in figure 5.1 below:


    ![](images/00012.jpeg)


    Figure 5.1 Output from program listing 5.1.


    The for loop statement in program listing 5.1 started with the initialization
    of variable i to 1 in the loop variable statement (i = 1). It then evaluated the
    loop conditional statement (i<10) to test if variable "i” was still less than
    10 and if true the for loop statement body is executed. You can omit the loop
    statement opening and closing braces if you have a single line of statement in
    your for loop block as in program listing 5.1 above.


    ## 5.2 The Nested For Loop Statement


    A nested for loop represents an occurrence of an iterative event for a specific
    number of times. It is a “for loop” inside of another for loop’s block. The syntax
    for a “for loop” statement is as described below:


    for (loop_var1; conditional_expr; incremental_stmt1)


       for(loop_var2; conditional_expr2; incremental_stmt2)


         loop statement;


    For an illustration, program listing 5.2 generates a set of multiplication tables
    from 1 to 4 using a nested for loop program structure.


    Program listing 5.2:


    public class NestedForLoop


    {


      public static void main(String[] args){


        for(int i=1; i < 5 ; ++i){


            System.out.println( "\n" + i + " Series Times Table" + "\n" );


           for(int j=1; j < 4 ; ++j)


              System.out.println( i + " * " + j + " = " + (i*j) );


           }


      }


    }


    The output from program listing 5.2 is as shown in figure 5.2 below:


    ![](images/00013.jpeg)


    Figure 5.2 the output from program listing 5.2\.


    Please not that you cannot re-use variable names already used in the outer loop
    again in the inner for loop. This is because the scope rule also applies here.
    The inner and outer loops are in same program block and therefore have the same
    scope.


    ## 5.3 The Enhanced For Loop


    The enhanced for loop is often used with the array and its general syntax of usage
    is as shown below:


    for( data_type element: array_name )


              program stament;


    More on the enhanced for loop later in the array section.


    ## 5.4 The Lambda foreach Loop


    The lambda foreach is introduced into java 8 SE with the inclusion of the stream
    class to the java utility’s Collections package (java.util.Collections) of the
    core API. The stream class comes with some utility methods of its own like the
    min, max, filter, findFirst, and many others. Now, stream can be used in combination
    with the lambda for foreach loop to simplify the enhanced for loop to the following
    statement:


    collection_name.stream  ().forEach((object) -> {


    statement;  })


    Collections like arrayLists can now use the method stream with forEach functional
    statement block to process their collections. An array is a collection of objects
    of the same type e.g. a set of integer numbers from 1 to 10, while an arraylist
    is a collection of objects of the same type.  We discuss more on this in sections
    5.7 and 7.8b of this chapter and chapter seven of this book. The following program
    listing 5.3 illustrates the use of for each Loop by converting an array into an
    arraylist and then list out the contents of the array list with the “forEach”
    functional lambda expression.


    Program listing 5.3:


    import java.util.Arrays;


    import java.util.ArrayList;


    public class FilterLoop


    {


      public static void main(String[] args){


       //Declaring and initializing an arraylist counter with odd numbers


      ArrayList<Integer> counter = new ArrayList<Integer>(Arrays.asList(1,3,5,7,9));


      System.out.println("\n A list of Odd numbers: ");


    //Using the forEach inline statement to print out a list of odd numbers


       counter.stream().forEach((num) -> System.out.println(num));


         }


      }'
