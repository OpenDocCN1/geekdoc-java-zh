    The output from program listing 7.2 above is shown in figure 7.2 below:\n\n![](images/00022.jpeg)\n\
    \nFigure 7.2 The output from program listing 7.2.\n\n## 7.5 ArraySorting\n\nThe\
    \ java `Arrays` class of the `java.util` package has many static methods for frequently\
    \ performed operations on arrays like array sorting. For example, the `balls`\
    \ array can be sorted by the application of the `Arrays’ utility method `sort()`\
    \ like demonstrated in program listing 7.3 below:\n\nProgram listing 7.3:\n\n\
    ```java\nimport java.util.*;\n\npublic class ArraySorter\n{\n  public static void\
    \ main(String[] args){\n    String[] balls = {\"Basket ball\", \"Base ball\",\
    \ \"Volley Ball\", \"Foot ball\" };\n    System.out.println(\"\\n A list of array\
    \ balls' content before sorting -> \\n\");\n    for(String ball : balls)\n   \
    \   System.out.println(ball);\n    Arrays.sort(balls);\n    System.out.println(\"\
    \\n A list of array balls' content after sorting ->\\n\");\n    for(String ball\
    \ : balls)\n      System.out.println(ball);\n  }\n}\n```\n\nThe output from program\
    \ listing 7.3 is shown in figure 7.3 below:\n\n![](images/00023.jpeg)\n\nFigure\
    \ 7.3 Output from program listing 7.3.\n\n## 7.5b Parallel Array Sorting\n\nThe\
    \ new java8 has introduced the concept of parallel array sorting that has improved\
    \ the java sorting programs efficiency by about thirty percent (30%). The technology\
    \ is designed for sorting on dual or quad core computers and the only drawback\
    \ is that the system would require another memory space equivalent to the array\
    \ size to be sorted. The newly added `parallelSort()` method to the `java.util.Arrays`\
    \ package and its constructor variants are as described and applied in program\
    \ listing 7.4 below:\n\nProgram listing 7.4:\n\n```java\nimport java.util.Collections;\n\
    import java.util.Arrays;\n\npublic class ArraySorter\n{\n  public static void\
    \ main(String[] args){\n    String[] balls = {\"Basket ball\", \"Base ball\",\
    \ \"Volley Ball\", \"Foot ball\" };\n    System.out.println(\"\\n A list of array\
    \ balls' content before sorting -> \\n\");\n    for(String ball : balls)\n   \
    \   System.out.println(ball);\n    System.out.println(\"\\n Array balls with 1st\
    \ and 2nd contents sorted in ascending order ->\\n\");\n    Arrays.parallelSort(balls,0,2);\n\
    \    for(String ball : balls)\n      System.out.println(ball);\n    System.out.println(\"\
    \\n Array balls contents sorted in ascending order with parallel sorting->\\n\"\
    );\n    Arrays.parallelSort(balls);\n    for(String ball : balls)\n      System.out.println(ball);\n\
    \    System.out.println(\"\\n Array balls with 1st and 2nd contents sorted in\
    \ descending order ->\\n\");\n    Arrays.parallelSort(balls,0,2, Collections.reverseOrder());\n\
    \    for(String ball : balls)\n      System.out.println(ball);\n  }\n}\n```\n\n\
    The output from program listing 7.4 above is shown in figure 7.4 below:\n\nrun:\n\
    A list of array balls' content before sorting ->\nArray balls with 1st and 2nd\
    \ contents sorted in ascending order ->\nArray balls contents sorted in ascending\
    \ order with parallel sorting->\nArray balls with 1st and 2nd contents sorted\
    \ in descending order ->\n\nSUCCESSFUL (total time: 0 seconds)\n\n## 7.6 Copying\n\
    \nThe content of one array can be copied into another of similar type through\
    \ the usage of the `arraycopy` method of the java language. To illustrate this,\
    \ program listing 7.5:\n\nProgram listing 7.5:\n\n```java\nimport java.util.*;\n\
    \npublic class ArraySorter\n{\n  public static void main(String[] args){\n   \
    \ String[] balls = {\"Basket ball\", \"Base ball\", \"Volley Ball\", \"Foot ball\"\
    \ };\n    System.out.println(\"\\n A list of array balls' content before sorting\
    \ -> \\n\");\n    for(String ball : balls)\n      System.out.println(ball);\n\
    \    Arrays.sort(balls);\n    System.out.println(\"\\n A list of array balls'\
    \ content after sorting ->\\n\");\n    for(String ball : balls)\n      System.out.println(ball);\n\
    \    String[] ballsCopy = new String[balls.length];\n    System.arraycopy(balls,0,ballsCopy,0,2);\n\
    \    System.out.println(\"\\n A list of ballsCopy's content after copy operation\
    \ ->\\n\");\n    for(String ball : ballsCopy)\n      System.out.println(ball);\n\
    \  }\n}\n```\n\n`arraycopy()` takes as its first argument the source array, as\
    \ its second argument the starting position in the source array, as its third\
    \ argument the destination array and as its fourth argument the number of elements\
    \ to be copied. In program listing 7.5 above, the `arraycopy()` method was supplied\
    \ value 2 as the number of elements to be copied into `ballsCopy` which has a\
    \ length four, from `balls`. Therefore, on listing the content of `ballsCopy`\
    \ it gave out the last two slots value as null. The reason for this is that primitive\
    \ addresses that have not been initialized with values are assigned null values\
    \ by the compiler.\n\n## 7.7 An ArrayList\n\nAn `ArrayList` in java performs basically\
    \ the same functions as an array, but an `ArrayList` stores only a list of objects\
    \ while an array can store both the primitive types and objects. An `ArrayList`\
    \ does not have a fix length like an array does. Its size can be changed to accommodate\
    \ new element addition and a deletion. The `size()` method is used to retrieve\
    \ its new length much like using the `length` field of the array. More, the array\
    \ belongs to the core java API, while the `ArrayList` class belongs in the java\
    \ utility package (`java.util.ArrayList`) that must be imported before you can\
    \ use the `ArrayList` class in your java programs. The declaration syntax for\
    \ an `ArrayList` is as described below:\n\n```java\nArrayList array_name = new\
    \ ArrayList();\n```\n\nYou can also use generics with `ArrayList` as described\
    \ below:\n\n```java\nArrayList<data_type> array_name = new ArrayList<data_type>();\n\
    ```\n\nFor an example, you can define an `ArrayList` that can accept all string\
    \ object types using generics like done below:\n\n```java\nArrayList<String> softDrinks\
    \ = new ArrayList<String>();\n```\n"
