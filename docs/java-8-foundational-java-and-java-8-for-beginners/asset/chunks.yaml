    \ <header ><i> 我的本地时间 Applet 区域</i> </header><br/>\n       <section id=”Local\
    \ Time_applet”>\n       </section><br/>\n       <footer> &copy 版所有 2015 年 8 月</footer>\n\
    </body>\n</html>\n```\n\n"
