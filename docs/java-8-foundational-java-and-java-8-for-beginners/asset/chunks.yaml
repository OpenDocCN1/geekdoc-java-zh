    ## 3.6 Returning Class Parameter Names at Runtime


    Two types of parameter passing techniques are available in programming languages;
    positional parameter passing- where parameters are received according to their
    positions in the parameter list, and the nominal parameter passing- where a name-value
    pair is passed to the receiving method or function.


