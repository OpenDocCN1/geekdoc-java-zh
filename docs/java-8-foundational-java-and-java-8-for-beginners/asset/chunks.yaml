    # Chapter 6


    # Program Decision Statements


    Computers are considered intelligent because of their inherent ability to make
    intelligent decisions. The ability comes from the decision statements in computer
    programs. Decision statements help computers programs make intelligent decisions
    based on some criteria in their conditional expressions that are evaluated during
    execution.


    There are basically three types of decision statements; the “if” statement, the
    “if.. else” statement, and the “switch case”. In this chapter we shall be looking
    into each one in turn, starting with the simplest of all, the “if” statement.


    ## 6.1 The if statement


    The “if” statement executes its statement block only if its conditional expression
    evaluates to a Boolean value true and transfers the flow of control to the program
    statement immediately after the “if block” if a false Boolean value is returned.
    The general syntax of an “if” statement is as described below:


    if (conditional_expression){


      Program statement;


    }


    Below is a segment of program listing 5.3 where the “if” statement was used to
    test a numeric counter value for oddness.


    if ((counter % 2) != 0)


         System.out.println(counter);


    ## 6.2 The if else Statement


    The “if else” statement is a compound if statement. In addition to having the
    if program block it also has the else program block, which is processed when the
    outcome of the evaluation of its conditional expression is a Boolean value “false”.
    The syntax for the “if else” statement is as described below:


    if ( conditional_expression ){


       // if statement block


    }


    else{


       //else statement block


    }


    The opening and closing braces may be omitted from the “if block” if only a program
    statement is available in the “if block”. The same exception applies to the else
    block. For a short illustration of the “if else” statement program listing 6.1
    tests that an integer input is provided:


    Program listing 6.1:


    import javax.swing.JOptionPane;


    import java.util.Scanner;


    public class IfElse


    {


      static Scanner inc = new Scanner(System.in);


      public static void main(String[] args){


        System.out.print("\n Please enter a value-> ");


          if( inc.hasNextInt( ) )


             System.out.println("You entered an integer");


          else


             System.out.println("\n You entered a non integer");


       }


      }


    Program listing 6.1 makes use of the Scanner class that is available in the java
    utility package. To use the Scanner methods for reading inputs, you need to import
    the class and this was done with the import statement in the second line of the
    program listing. The program uses the “hasNextInt( )” method of the “Scanner”
    class to test if an input is an integer value, it returns the Boolean value “true”
    if the input is an integer and Boolean value “false” if otherwise, and the if
    statement block makes the appropriate decision based on the returned value. The
    input and output from listing 6.1 is as shown in figure 6.1 below:


    ![](images/00017.jpeg)


    Figure 6.1 Inputs and outputs of program listing 6.1.


    ## 6.3 The Ternary Operator


    The ternary operator is another form of the “if else” statement that can be compactly
    used to perform the same decision making function of the ”if else” construct in
    some cases. The symbols used to denote the ternary operator are the question mark
    (?) and the full colon (:). The general syntax of usage is as described below:


    conditional_expression ? expression-1 : expression-2;


    If the conditional expression returns a Boolean value “true” expression-1 is executed
    and if otherwise expression-2 is executed and returned. Program listing 6.2 illustrates
    the use of the ternary operator.


    Program listing 6.2:


    public class TernaryOperator


    {


      public static void main(String[] args){


        int num=-9;


    System.out.println( num < 0 ? 0 : 1 );


      }


    }


    The ternary statement tested its conditional expression to know if the value in
    variable num is less than zero, if so its returns 0 else it returns value 1\.
    The output from program listing 6.2 as shown in figure 6.2 below:


    ![](images/00018.jpeg)


