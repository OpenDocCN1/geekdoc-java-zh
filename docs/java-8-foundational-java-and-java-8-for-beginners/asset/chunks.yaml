    These are the standard steps to take when writing an xml document with the DOM
    objects. Next we discuss how to read an xml document with java.


    ## 10.2 Reading XML with Java


    XML documents can be read with the DOM or SAX in java. However the DOM requires
    that the whole document be read into the computer memory therefore it is memory
    intensive. While the SAX would only read an element into memory at a time and
    therefore uses less memory and can process any length of xml document. For this
    reason the SAX method is preferred and discussed in this book (considering book
    length and other factors).


    The idea on which a SAX reader is developed is that SAX exposes an interface called
    contentHandler with some utility default methods like the startDocument(), startElement(),
    endElement() and endDocument() methods for triggering a start of document, a start
    of element, an end of element and an end of document event as the names of the
    methods implied. The methods are default implementations simply do nothing.


    Therefore the contentHandler() interface must  be implemented and its necessary
    methods overridden to suit your purpose. This was done in program listing 10.3
    by the class “Xmlhandler”. Next the reader object of the type “XmlReader” uses
    SAX and the “Xmlhandler” object to read the xml file content and print them to
    the standard output. It is really as simple as that. Please take your time to
    go through the program listing. The listing can be as short or as long as you
    desire depending on your purpose again.


    Program listing 10.3 shows how to read the xml document (drinks.xml) created in
    program listing 10.2 with SAX above.


    Program listing 10.3:


    package xmlapplication3;


    import javax.xml.parsers.SAXParser;


    import javax.xml.parsers.ParserConfigurationException;


    import javax.xml.parsers.SAXParserFactory;


    import org.xml.sax.SAXException;


    import org.xml.sax.Attributes;


    import org.xml.sax.helpers.DefaultHandler;


    import java.io.File;


    import java.io.IOException;


    /**


    *


    * @author Dosunmu


    */


    public class XmlSaxReader {


        /**


         * @param args the command line arguments


         */


        public static void main(String[] args) {


            String xmlFile = "C:" + File.separator + "practice" + File.separator +
    "drinks.xml";


            XmlReader reader =new XmlReader();


            reader.readXmlContents(xmlFile);


        }


    }


    class Xmlhandler extends DefaultHandler{


       //Detect and handle the event of locating the start of the document


        int endingElementFlag;


        String elementName;


        void xmlhandler(){


            endingElementFlag = 0;


            elementName= null;


        }


        @Override


        public void startDocument(){


            System.out.println("Found the beginning of the document");


        }


        //Detect and handle the event of locating a starting element tag


       @Override


        public void startElement(String url,String lName,String eleName, Attributes
    attr)


                throws SAXException{


            endingElementFlag=0;


            elementName= eleName;


            StringBuilder content = new StringBuilder();


            content.append("A starting element tag " +"\"" +eleName +"\""+" is located");


            //Process elemeent''s attributes if any


            if(attr.getLength() >0 ){


                content.append(" with the following attribute(s); ");


                for(int t=0; t < attr.getLength(); t++){


                 content.append ( "\""+attr.getLocalName(t)+"\"");


                 content.append(" with a value " +"\""+ attr.getValue(t)+"\""+"\n");


                }


            }


            //Print discovered element to the conseole


            System.out.println(content.toString());


        }


        //Processing the content of the element


        @Override


        public void characters(char[] ele_content, int start_position, int content_length)throws
    SAXException{


            String elemNm= new String(ele_content,start_position, content_length);


            if(endingElementFlag== 0 && (!(elementName.equalsIgnoreCase("Drink") ||(elementName.equalsIgnoreCase("Soft_Drinks")))
    ) )


              System.out.println("with a content: " +"\"" + new String(ele_content,start_position,
    content_length)+"\"" );


        }


        //Detect and handle an element ending 


        @Override


        public void endElement  (String ele, String lName, String eleName)throws SAXException{


            endingElementFlag=1;


            System.out.println ("An ending Element tag " +"\"" + eleName + "\"" +
    " is found.\n ");


        }


        //Detect and handle a the document''s ending


        @Override


        public void endDocument()throws SAXException{


            System.out.println("End of document reached.");


        }


    }


    class XmlReader{


        void readXmlContents(String xmlDoc){


            try{


                //create an xmlHanlder instance


                Xmlhandler xhandler = new Xmlhandler();


                //Create a parser factory instance


                SAXParserFactory sxFactory = SAXParserFactory.newInstance();


                // Create a parser using the parser factory instance


                SAXParser sxParser = sxFactory.newSAXParser();


                //Passing the xml file with the handler


                sxParser.parse(xmlDoc, xhandler);


            }


            catch(SAXException e){


               System.out.println("Could not parse the XML document-> "+ e.getMessage());


            }


            catch(IOException e){


               System.out.println("Could not open path."+xmlDoc);


            }


            catch(ParserConfigurationException e){


               System.out.println("Unable to create a parser-> " + e.getMessage());


            }


        }


    }


    And the output of program listing 10.3 above is a presented in figure 10.3 below:


