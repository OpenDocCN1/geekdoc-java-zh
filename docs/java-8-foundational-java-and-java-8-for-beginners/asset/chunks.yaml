    # 引言


    这是一本特殊的 Java 书。它的目标是通过通简单的语言解释面向对象编程概念，消除新 Java 程序员通常会对 Java 编程的恐惧；为深入且轻松地理解软件设计开发中的设计模式理论打下坚实的基础，最终目标是传承持久的
    Java 遗产；同时，通过与核心 Java API 交互，尽可能避免版本狂热症，只讨论与开发者相关的必要新增，并展示这些新增是如何变得必要的以及它们的应用。


    万变皆变，其道不变。虽然在 Java 中事物几乎没有变化，但新功能总是层出不断（版本狂热）。最新的新增是由于多核计算机的发展（双核甚至四核）所需的，这使得改进核心
    API 变得至关重要，从而产生了带有 lambda 表达式的更智能的 Java 代码，以便它们可以在多个处理器上运行，节省时间并提高效率。这导致了书中介绍的
    Java 8 的问世。尽管如此，这本书将将保持常青，并成为一本可以一直作为参考指南的宝书。


    在此刻，我想第一个祝贺你发现了这本书，因为作为一名认证的软件开发人员和微软认证技术专家，我非常乐意与你分享我对编程、尤其是对 Java 编程的热爱。请关注我，先不要急着丢掉移动设备，因为这是一个非常特别的开始。


    谢谢。


    # 第 1 章：Java 编程简介


    回到 20 世纪 90 年代初，在 Sun Microsystems 工作的 James Gosling 被要求开发一种更好、更易移植的编程语言，这种语言在内存管理和系统移植性方面要优于
    C++，用于嵌入式系统的开发。


    James 改进了 C++ 在内存管理方面的缺点，通过垃圾回收（将不再使用的内存槽返回给系统）以及通过他开发的新编程语言 Oak 引入虚拟机，使嵌入式系统的平台独立性成为可能。


    Oak 在 1994 年很快被发现是 Web 应用开发的完美工具，并被更名为 HotJava，最终在明年（1995 年），HotJava 被更名为 Java。1996
    年，第一个 Java 编译器发布，从那以后，Java 变得无处不在，在互联网上和世界各地。


    非常感谢 James Gosling 和 Sun Microsystems，他们一直支持 Java 直现在。你可以访问 sun 的网站获取最新版本的 Java
    开发工具，：`http://java.sun.com`。


