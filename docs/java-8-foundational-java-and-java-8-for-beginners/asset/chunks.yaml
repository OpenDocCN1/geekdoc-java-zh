    # Chapter 11


    # Java Applets


    Applets are mainly used for animations and game creations. They are embedded in
    hypertext markup language documents. Therefore you need a foundational knowledge
    of [HTML5](http://www.amazon.co.uk/dp/B00PIMD5P2) to use applets. The basic structure
    of an HTML5 document is as described in listing 11.1 below:


    Listing 11.1:


    <!DOCTYPE html>


    <html>


    <head>


    <title> My First HTML5 Web Page </title>


    <meta charset="UTF-8">


    </head>


    <body>


        <header ><em ><u> MY APPLET PROJECT.</u></em><br/> </header>


        <nav><a href="#">Home</a> |<a href="#">Exit</a>  </nav><br/><br/>


        <header ><i> My Applet Image Section</i> </header><br/>


        <section id=”image_applet”>


        </section><br/>


        <footer> &copy copyright August 2015</footer>


    </body>


    </html>


    The “<!DOCTYPE html>” element describes the document as a HTML5 document to the
    browser. The “<html>” element acts as the parent container for the html document.
    The “<head>” element acts as the head of the document containing the followings;
    “<title>” element for displaying the document’s title in the web browser, the
    character encoding for the page described in the “<meta >” element tag, and the
    in some cases the page style sheet- included by the “<style>” element.


    After the head element comes the “<body>” element which contains the body of the
    html document that includes the “<header>” elements for displaying the various
    sections’ titles enclosed in “<section>” elements across the page, the page footer
    element for displaying footer information like the copyright and the address information,
    and various other minor text editing elements like the “<br/>” singleton element
    for inserting new lines, <u> element for text underlining, <em> element for creating
    emphatic texts. The major elements must be in the order described or you end up
    with a malformed html document.


    When you save listing 11.1 in a text document with an extension “.html” and as
    type “ALL Files”. You can double click the file to have it displayed in your browser
    as shown in figure 11.1 below:


    ![](images/00036.jpeg)


    Figure 11.1\. The output of program listing 11.1 above.


    Sure this is just a basic html5 web page devoid of any [CSS](http://www.amazon.co.uk/dp/B00QZ2S2JI)
    styling, though sufficient for our discussion in this chapter. I recommend that
    you download the book titled “[HTML5; simplified beginners to intermediate level](http://www.amazon.co.uk/dp/B00PIMD5P2)”,
    if you are not already familiar with html or has not upgraded to the new html5
    for a serious applet web development project, and the book titled “[CSS3; CSS2
    and 3 from beginners’ level up (Two in one)](http://www.amazon.co.uk/dp/B00QZ2S2JI)”
    for html page outlaying and styling for a professional looking web page. Both
    from amazon kindle book store, by clicking on the links or by typing the book
    titles into the search box.  Thank you as you do so.


    ## 11.1 The Applet Element


    An applet is embedded into an html document with the applet element. The applet
    element is as described below:


    <applet code=”applet.class” width=200 height=100 > </applet>


    The code attribute specifies the applet byte code (applet class) gotten by compiling
    the applet source file while the width and height set the width and height of
    the applet. The applet is compiled in the same way as a java application is compiled
    with the “javac” command after which it can be run with the “appletviewer” command.
    And if your applet would require some parameters, the parameter can be gotten
    from the web page with the “param” element as shown below:


    <applet code=”applet.class” width=200 height=100 >


    <param name=sex value=”Male” >


    </applet>


    The “param” element’s attribute “name” is used for specifying the name of the
    parameter, while the attribute “value” is used for supplying the parameter’s value. 


    ## 11.2 An Applet’s Structure


    An applet does not have a static public main method common to java applications,
    instead what it has is the public “init()” method which initializes the applet
    upon starting. Java applets have no need of a required method. The methods are
    invoked by the browser as required by the java virtual machine. The following
    methods of the Applet class (that extends the Panel class) are important for the
    implementation of an applet.


    a) public void init(): Used by the web browser for applet initializations


    b) pubic void start(): Used by the web browser for starting the applet after initialization.
    Called as many times as the embedding page is loaded


    c) public void stop(): Invoked by the web browser to stop an applet whenever the
    embedding page is minimized, the user browses away, or the applet is stopped


    d) public void destroy(): The destroy method is invoked by the web browser to
    destroy the applet by clearing it out of its memory


    The containing Applet class for the above listed methods must be imported for
    your applets to be able to use them. The containing Applet’s class hierarchy is
    as described in figure 11.2 below:


    ![](images/00037.jpeg)


    Figure 11.2\. The Applet’s class inheritance hierarchy tree.


    According to the hierarchical Applet’s family tree, the class applet inherited
    from its parent class Panel which inherited from its parent class Container also
    inheriting from the parent class Component which inherited from the mother of
    all classes, the Object class. Thus the Applet class is seriously enriched. However,
    there is still an important method not of the applet class’s hierarchy; the public
    void paint( ) method of the java.awt.Grahphics class, used for painting the applet
    in the browser. Without you overriding these methods the applet does nothing as
    the default behavior is to do nothing. Next let’s create an example applet that
    overrides the utility applet’s paint(Graphics )  method.


    ## 11.3 An Example Applet


    The following example applet in program listing 11.2 below displays the current
    time in the embedding web page when started by the browser.


    Program listing 11.2:


    import java.applet.Applet;


    import java.awt.Graphics;


    import java.time.LocalTime;


    /**


    *


    * @author Dosunmu


    */


    public class LocalTimeApplet extends Applet {


        /**


         * Initialization method that will be called after the applet is loaded into


         * the browser.


         */


        @Override


        public void init() {


            // TODO start asynchronous download of heavy resources


        }


        @Override


        public void paint(Graphics t){


          t.drawString("The time is " + LocalTime.now(), 100,90); 


        }


        // No need to overwrite start(), stop() and destroy() methods


    }


    There is no need to override the start(), stop() and destroy methods as the browser
    will automatically invoke the default start() method when the applet comes into
    view in the browser, invoke the default stop() method when it goes out of view
    and invoke the default destroy() method when the page is remove from the browser.


    The above applet can be compiled the same way a java code is compiled with the
    javac command or in netbeans for produce the byte codes which can then be embedded
    in a web document such as described in program listing 11.1 above. The embedding
    is done as described in the modified program listing 11.1 (11.3) below;


    Program listing 11.3:


    <!DOCTYPE html>


    <html>


    <head>


    <title> My First HTML5 Web Page </title>


    <meta charset="UTF-8">


    </head>


    <body>


        <header ><em ><u> MY APPLET PROJECT.</u></em><br/> </header>


        <nav><a href="#">Home</a> |<a href="#">Exit</a>  </nav><br/><br/>


        <header ><i> My Local Time Applet Section</i> </header><br/>


        <section id=”Local Time_applet”>'
