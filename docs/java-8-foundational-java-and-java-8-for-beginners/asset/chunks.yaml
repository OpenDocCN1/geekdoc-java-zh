    # Chapter 3


    # Java Classes, Objects and Access Modifiers


    Java as an object oriented programming language has its basic building block as
    the objects. This is the reason why a solid understanding of java classes and
    objects is paramount to the understanding and mastering of java programming.


    An object is an instance of a class, where a class is the definition of a place,
    a thing, or a concept. In object oriented programming parlance, a class is usually
    a noun.


    ## 3.1 Class Definition


    A class definition is made up of member variables and member methods with optional
    access modifiers. It may also include the constructor functions for class initialization
    purposes. The general syntax of a class definition is as described below:


    [access modifier] class class_name {


                [access modifier] data-type member_variable-1;


                [access modifier] data-type member_variable-2;


                [access modifier] class_name( ){  //class constructor


                  //class constructor body


                }


                [access modifier] class_method-1( ){  //class method


                  //class method body


                }


      }


    The usage of access modifiers with the class member variables and method is optional
    except with the main method which must have the public access modifier to enable
    the machine have access to it at execution time. However, any member function
    or variable with no access modifier shall be automatically assigned a default
    access modifier. There are seven major access modifiers in java, though we have
    more than seven modifiers which you shall be made aware of with time. Next, we
    discuss and describe the usage of these major access modifiers.


    ## 3.2 Access Modifiers


    The seven major access modifiers are the followings; public, private, protected,
    private protected, abstract, static and final.  They are applied to classes, class
    member variables and methods. For example, to define a class for an object book,
    the class definition may be written as shown below:


       class Book{


        private String bookTitle, bookAuthors;


        private int noOfPages;


        public Book(String booktitle, String bookAuthors, int pages ){


          bookTitle= booktitle;


          bookAuthors= bookAuthors;


          noOfPages= pages;


        }


    }


    Here the Book class has no access modifier, and for this reason it is assigned
    a default modifier by the compiler, and the default modifier lacks a keyword.
    This means that the class is accessible only to other classes in its package or
    same directory. The class has a public constructor function with arguments bookTitles,
    bookAuthors and pages for initializing the private member variables with private
    access modifiers upon a book object declaration.


    A class may have more than one constructor functions as long as they have different
    signatures this concept is what is termed polymorphism in object oriented programming,
    and for this reason another public class constructor with no arguments list can
    also be written for the class as shown below:


        public Book( ){


          bookTitle="No title yet";


          bookAuthors= "No author yet";


          noOfPages= 0;


        }


    Public members of a default class are accessible to other classes in the same
    package, for this reason the constructors were provided with public access modifiers
    to allow access to all other classes within the same package. The function of
    the constructor is to help initialize the class member variables upon declaration.
    It is not compulsory that you provide a constructor for your class, if you do
    not, the compiler would provide a default one, but it’s a good practice to write
    one yourself in order to have the control in your own hands, because if you do
    not, in an instance where your class member variable is not of the primitive type
    the compiler would make the variable null instead of initializing it.


    The private member variables “bookTitle”, “bookAuthors”, “noOfPages” with the
    private access modifiers are not accessible by any other classes except the declaring
    class itself (Book). Therefore there is a need to provide public accessor methods
    “getBookTitle()” and “getBookAuthors()” to help retrieve this information. These
    methods may be written as described below:


        public String getBookTitle( ){


          return bookTitle;


         }


        public String getBookAuthors( ){


          return bookAuthors;


         }


    The above java codes defined public class member methods that return string objects
    to the calling methods.  This is of course an overview of the need and functions
    of the access modifiers. The following sub sections enumerate further on access
    modifiers.


    ### 3.2.1 Public Access Modifier


    A class with a public access modifier (a public class) is accessible to all other
    classes. Therefore there can only be one public class in a file, which serves
    as the only entry and starting point into the application for the executing machine.
    As earlier said a class with no access modifier is not a public class but a default
    class and is only accessible to other classes in the same package. For example,
    to define a public class for a library object, the class definition may be written
    as done below:


    public class BookLibrary


    {


         public static void main(String[] args){


          Book myBook = new Book("Java Programming", "Feyisayo Dosunmu", 312);


          }


      }


    The public class BookLibrary declares an object mybook of the type Book with the
    statement;


    Book myBook = new Book(“Java Programming”, “Feyisayo Dosunmu”, 312);


    Remember that the class Book is a default class so it can be stored in the same
    file with the class BookLibrary, now the compiler knows to look for the static
    main method in the only public class BookLibrary.


    ### 3.2.2 Private Access Modifiers


