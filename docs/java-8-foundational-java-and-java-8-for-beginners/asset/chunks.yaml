    \ device with the following statement:\n\n```java\nSystem.out.println(Arrays.toString(ballsCopy));\n\
    ```\n\nThere are a number of available string class methods that shall be discussed\
    \ about in the following section.\n\n## 8.1 String Class Methods\n\nThe string\
    \ class has many utility method such as the `length()` method for returning the\
    \ length of a string, `charAt(int)` for returning the character at a given position\
    \ in a string, `compareTo(string)` for comparing two strings for similarity, returning\
    \ an integer value 0 if the strings are similar, an integer value less than 0\
    \ if compared string comes before the supplied string argument and 1 if compared\
    \ string comes after the supplied string argument to the method.\n\nA similar\
    \ method to the `compareTo(string)` method is the `compareToIgnoreCase(String)`\
    \ the difference is that it carries out a case insensitive comparison. The `trim()`\
    \ method removes leading and trailing spaces from a string and the `toLowerCase()`\
    \ converts a string to the lowercase. Program listing 8.1 below illustrates the\
    \ use of the string class methods.\n\nProgram listing 8.1:\n\n```java\nimport\
    \ java.util.*;\n\npublic class StringMethods\n{\n  public static void main(String[]\
    \ args){\n  String name = \"Feyisayo Dosunmu\";\n  String nameUpper = \"FEYISAYO\
    \ DOSUNMU\";\n  //Method length( ) returns a string's length\n  System.out.printf(\"\
    \\n The lenght of name (name.length()) is %d \",name.length( ));\n  //Method toLowerCase(\
    \ ) returns a string's length\n  System.out.printf(\"\\n nameUpper in lowercases\
    \ (name.toLowerCase()) is %s \",name.toLowerCase( ));\n  //Method charAt(int)\
    \ returns the character in the supplied position\n  System.out.printf(\"\\n The\
    \ character in position 3 counting from 0 (name.CharAt(3)) is %c \",name.charAt(3));\n\
    \  //Method compareTo(string) returns the result of Strings Comparison\n  System.out.printf(\"\
    \\n The result of comparing with (name.compareTo(nameUpper) ) is %d \",name.compareTo(nameUpper));\n\
    \  //Method compareToIgnoreCase(string) returns the result of Strings Comparison\n\
    \  System.out.printf(\"\\n The result of comparing with (name.compareToIgnoreCase(nameUpper)\
    \ ) is %d \\n\",name.compareToIgnoreCase(nameUpper));\n  }\n}\n```\n\nThe output\
    \ from program listing 8.1 is shown in figure 8.1 below:\n\n![](images/00029.jpeg)\n\
    \nFigure 8.1 Output from program listing 8.1.\n\n## 8.2 Regular Expressions\n\n\
    Regular expressions are string patterns that are created for the validation of\
    \ program inputs. Though `java` provided some input checking methods like those\
    \ provided by the `Scanner` class but this method are not that effective in most\
    \ cases of input validation. For example, you may need to create your own method\
    \ for validating a phone number or a particular security code number. Then you\
    \ would need to create your own unique pattern for validating the users’ input\
    \ and you do this with regular expressions.\n\n## 8.3 Regular Expression Formulation\n\
    \nRegular expressions are formulated by using optional quantifiers and character\
    \ combinations with implied meanings. The tables of some characters and quantifiers\
    \ are as provided in figures 8.2 and 8.3 below:\n\n| Regular expression character\
    \ | Meaning |\n| :--- | :--- |\n| `\\d` | Represents a numerical input and matches\
    \ a single digit e.g 1 |\n| `\\D` | Represents a non-numerical input and matches\
    \ a single character input e.g. “a” |\n| `\\w` | Represents a single alpha-numeric\
    \ character and matches a single input in the ranges 0 – 9, a – z and A – Z including\
    \ the underscore |\n| `/…/` | Encloses a regular expression pattern |\n| `\\[…]`\
    \ | Represents a character set or a range |\n\nFigure 8.2 A table of some regular\
    \ expression characters and their meanings.\n\n| Quantifiers | Meaning |\n| :---\
    \ | :--- |\n| `?` | 0 or 1 occurrence |\n| `*` | 0 or more occurrence |\n| `+`\
    \ | 1 or more occurrence |\n\nFigure 8.3 A table of regular expression quantifiers.\n\
    \nNow to create a regular expression for validating a name input of unlimited\
    \ character length that may begin with an upper or case letter, we take the following\
    \ steps:\n\nStep 1: Create a range for the set of upper case letters from A to\
    \ Z to represent the starting letter as done below: `[A–Z]`\n\nStep 2: Consider\
    \ the right quantifier for the range. In this case the quantifier is the question\
    \ mark, which represents a 0 or 1 occurrence. This is applicable since the name\
    \ may or not start with a capital letter. Therefore the new representation is\
    \ as shown below: `[A– Z]?`\n\nStep 3: Create a range for the set of lower case\
    \ letters as done below: `[a–z]`\n\nStep 4: Determine the quantifier for the created\
    \ lower case letter range. In this case, since we may have an unlimited combination\
    \ of lower case letters, the eligible quantifier would be the addition symbol\
    \ (`+`) for one or more occurrences as shown below: `[a–z]+`\n\nStep 5: Now bring\
    \ the starting letter and the following lower case combinational letters together\
    \ to form a name regular expression as shown below: `[A-Z]?[a-z]+`\n\nYeah, you’ve\
    \ done it. You have a regular expression for validating a name input. But the\
    \ process may not always be this simple, for example, it is not this simple to\
    \ formulate a regular expression for valid email addresses, phone numbers for\
    \ different regions of the world, master card numbers and so on. But these you\
    \ should be able to do as a professional software developer.\n"
  raw: 'Program listing 7.9 demonstrated the use of the Iterator interface by using
    the “hasNext()” method of the Iterator interface in the while loop expression
    to test for a non-empty list and then used the “next()” method to retrieve the
    next object element from the list. This brings us again to the end of another
    illumining chapter on java arrays. I hope you had a wonderful time as I had putting
    this chapter together. Please come with me to the next chapter for a shorter discussion
    on Strings.


    # Chapter 8


    # Strings and Regular Expressions


    The string data type is an object in java programming language. A string is represented
    as an unlimited combination of characters within double quotes. For example “John”
    is a string literal. Now you can define the string variable “firstname” as pointing
    to the string literal “John” with the following statement:


    String firstName = “John”;


    Note that string content cannot be changed once assigned to a variable as done
    above, though the reference to the string can be changed to another in the variable.
    For example, when you try to modify the string variable firstName’s content to
    a new value “Johnson” by using the plus sign for string concatenation as shown
    below:


    firstName = firstName + “son”;


    When the compiler encounters such a statement as above, it uses its core API stringBuffer
    method “append()” to rewrite the statement as shown below:


    firstName = new StringBuffer(firstName).append(“son”).toString();


    and produce the output: Johnson


    Similar process occur when you use string modifying methods like the “toLowerCase()”
    and the “trim()” string methods. We shall be discussing more on this in the following
    section. Array contents can also be converted to strings by the “toString()” Array
    class method. For example, you can display the contents of array balls on the
    standard output device with the following statement:


    System.out.println(Arrays.toString(ballsCopy));


    There are a number of available string class methods that shall be discussed about
    in the following section.


    ## 8.1 String Class Methods


    The string class has many utility method such as the “length( )” method for returning
    the length of a string, “charAt(int)” for returning the character at a given position
    in a string, compareTo(string) for comparing two strings for similarity, returning
    an integer value 0 if the strings are similar, an integer value less than 0 if
    compared string comes before the supplied string argument and 1 if compared string
    comes after the supplied string argument to the method.


    A similar method to the “compareTo(string)” method is the “compareToIgnoreCase(String)”
    the difference is that it carries out a case insensitive comparison. The “trim()”
    method removes leading and trailing spaces from a string and the “toLowerCase()”
    converts a string to the lowercase.Program listing 8.1 below illustrates the use
    of the string class methods.


    Program listing 8.1:


    import java.util.*;


    public class StringMethods


    {


      public static void main(String[] args){


      String name = "Feyisayo Dosunmu";


      String nameUpper = "FEYISAYO DOSUNMU";


      //Method length( ) returns a string''s length


       System.out.printf("\n The lenght of name (name.length()) is %d ",name.length(
    ));


      //Method toLowerCase( ) returns a string''s length


       System.out.printf("\n nameUpper in lowercases (name.toLowerCase()) is %s ",name.toLowerCase(
    ));


      //Method charAt(int) returns the character in the supplied position


       System.out.printf("\n The character in position 3 counting from 0 (name.CharAt(3))
    is %c ",name.charAt(3));


      //Method compareTo(string) returns the result of Strings Comparison


       System.out.printf("\n The result of comparing  with (name.compareTo(nameUpper)
    ) is %d ",name.compareTo(nameUpper));


      //Method compareToIgnoreCase(string) returns the result of Strings Comparison


       System.out.printf("\n The result of comparing with (name.compareToIgnoreCase(nameUpper)
    ) is %d \n",name.compareToIgnoreCase(nameUpper));


      }


    }


    The output from program listing 8.1 is shown in figure 8.1 below:


    ![](images/00029.jpeg)


    Figure 8.1 Output from program listing 8.1.


    ## 8.2 Regular Expressions


    Regular expressions are string patterns that are created for the validation of
    program inputs. Though java provided some input checking methods like those provided
    by the Scanner class but this method are not that effective in most cases of input
    validation. For example, you may need to create your own method for validating
    a phone number or a particular security code number. Then you would need to create
    your own unique pattern for validating the users’ input and you do this with regular
    expressions.


    ## 8.3 Regular Expression Formulation


    Regular expressions are formulated by using optional quantifiers and character
    combinations with implied meanings. The tables of some characters and quantifiers
    are as provided in figures 8.2 and 8.3 below:


    | Regular expression character | Meaning |


    | \d | Represents a numerical input and matches a single digit e.g 1 |


    | \D | Represents a  non-numerical input and matches a single character input
    e.g. “a” |


    | \w | Represents  a single alpha-numeric character and matches a single input
    in the ranges 0 – 9, a – z and A – Z including the underscore |


    | /…/ | Encloses a regular expression pattern |


    | […] | Represents a character set or a range |


    Figure 8.2 A table of some regular expression characters and their meanings.


    | Quantifiers | Meaning |


    | ? | 0 or 1 or occurrence |


    | * | 0 or more occurrence |


    | + | 1 or more occurrence |


    Figure 8.3 A table of regular expression quantifiers.


    Now to create a regular expression pattern for validating a name input of unlimited
    character length that may begin with an upper or lower case letter, we take the
    following steps:


    Step 1: Create a range for the set of upper case alphabetic letters from A to
    Z to represent the starting letter as done below:


    [A –Z]


    Step 2: Consider the right quantifier for the range. In this case the quantifier
    is the question mark, which represents a 0 or 1 occurrence. This is applicable
    since the name may or may not start with a capital letter. Therefore the new representation
    is as shown below:


    [A – Z]?


    Step 3: Create a range for the set of lower case letters as done below:


    [a – z]


    Step 4: Determine the quantifier for the created lower case letter range. In this
    case, since we may have an unlimited combination of lower case letters, the eligible
    quantifier would be the addition symbol (+) for one or more occurrences as shown
    below:


    [a – z]+


    Step 5: Now bring the starting letter and the following lower case combinational
    letters together to form a name regular expression as shown below:


    [A-Z]?[a-z]+


    Yeah, you’ve done it. You have a regular expression for validating a name input.
    But the process may not always be this simple, for example, it is not this simple
    to formulate a regular expression for valid email addresses, phone numbers for
    different regions of the world, master card numbers and so on. But these you should
    be able to do as a professional software developer.


    I do not have to say that you need to be armed with the knowledge of regular expression
    formulation. A day is surely coming in your career that you would need it as a
    programmer, so it is better you understand the concepts now when it is not desperately
    needed, than to wait until it is desperately needed, and having to master the
    concept in a hurry. It’s sure not going to be as easy then (we prepare for war
    in times of peace).'
