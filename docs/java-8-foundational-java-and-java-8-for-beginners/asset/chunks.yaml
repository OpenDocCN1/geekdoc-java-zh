    # Chapter 2


    # Java Data types and Operators


    Java as an object oriented programming language comes with its own data types
    and operators that help with expression creation, access modifiers for classes
    and class member variables and methods. Since the building blocks of `java` programs
    are the classes which are the definition for the objects of interest. The classes
    cannot do without the primitive data types, which also have their own wrapper
    classes. We therefore begin this chapter with the description of the primitive
    data types.


    ## 2.1 Primitive Data types


    The primitive data types are the `java` built in data types that the compiler
    recognizes without any reference to any package in the core application programming
    interface (API). They are classified into three subsets; the numeric, character
    and Boolean. The following table 2.1 lists the primitive data types with their
    descriptions.


    | Primitive Data types | Size | Description |

    | :--- | :--- | :--- |

    | `int` | 32 bits | An integer constant which is a sequence of one or more digits.
    It can be positive or negative if preceded by a minus sign. It’s in the range
    -2147483648 to 2147483647 |

    | `short` | 16 bits | A short integer which takes up half the storage size of
    an integer constant. It is represented in the range -32768 to 32767 |

    | `long` | 64 bits | A long integer constant with an extended precision which
    takes up a double storage size of an integer |

    | `byte` | 8 bits | A tiny integer constant with restricted precision in the range
    -128 to 127 |

    | `float` | 32 bits | Values with decimal points .e.g. 8.0, 1.23 |

    | `double` | 64 bits | A floating type that can store twice as much value as the
    float type |

    | `boolean` | | A variable type that holds a ‘true’ or ‘false’ value |

    | `char` | 16 bits | A variable type that holds a single character |


    Table 2.1 The Numeric Primitive Data types.


    ## 2.2 Wrapper Classes for the Primitive Data types


    It is worthy of mentioning that the above described primitive data types also
    have classes defined for them in the `java.lang` package stored in the core API.
    We call these classes the wrapper classes. The objective is to make the primitive
    class behave like objects and align with the founding concept of java programming.
    Table 2.2 below lists the primitive data types and their corresponding wrapper
    classes.


    | Numeric Primitive Data types | Corresponding Wrapper Class |

    | :--- | :--- |

    | `int` | `Integer` |

    | `byte` | `Byte` |

    | `short` | `Short` |

    | `long` | `Long` |

    | `float` | `Float` |

    | `double` | `Double` |

    | `boolean` | `Boolean` |

    | `char` | `Character` |


    Table 2.2 Wrapper classes for the numeric primitive data types.


    ## 2.2b Converting to String with Wrapper Classes


    Data types can be converted to `String` type with the `toString()` method of wrapper
    classes, the syntax of usage is as described below:


    ```java

    String s = wrapper_class.toString(variable_name);

    ```


    For example, to convert a `double` variable type `price` of value 0.32 to a `String`
    type use the following statement:


    ```java

    String s= Double.toString(price);

    ```


    ## 2.2c Converting from String with Wrapper Classes


    You can also convert back from `String` type to the primitive data types by using
    the various parse methods of the wrapper classes. For example, to convert the
    `String s` type back to its original `Double` type you can use the following statement:


    ```java

    double price = Double.parseByte(s);

    ```


    The `parseByte(String)` methods is also applicable to the following wrapper classes;
    `Float` and `Byte`. Others include `parseInt(String)`, `parseLong(String)`, `parseShort(String)`,
    and `parseBoolean`, for `Integer`, `Long`, `Short` and `Boolean` wrapper classes
    accordingly.


    ## 2.3 The String Data Type


    The string data type is not a primitive data type. It is an object of the class
    `java.lang.String` in the `java` core API (Application Programming Interface).
    A string literal is a combination of characters to any length which is enclosed
    in double quotes. For example, “Feyisayo Dosunmu” is a string and you can assign
    a reference to a string as described below:


    ```java

    String name = “Feyisayo Dosunmu”;

    ```


    In `java` programming a statement is terminated with a semi colon (`;`). The reference
    to the storage location of the string “Feyisayo Dosunmu” is stored in the variable
    `name`.


    ## 2.4 Variable Declaration


    The variable declaration operation is the process of declaring a variable type
    to the compiler in order for the compiler to create the required memory space
    for the variable. Variable declaration syntax specifies the data type, the variable
    name and optionally the default data as described:


    ```java

    Data_type Variable_name = Default_value;

    ```


    Or


    ```java

    Data_type Variable_name;

    ```


    For example to declare a string variable `surname` with a default value “Dosunmu”
    the following java statement is appropriate:


    ```java

    String surname = “Dosunmu”;

    ```


    A variable must be declared in java programming before its usage and can be located
    in any part of the program.


    ## 2.5 The Final Declaration Modifier


