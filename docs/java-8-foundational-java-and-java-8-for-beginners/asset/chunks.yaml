    would notice the method modifier “@override”. The method “@override” modifier
    is not mandatory but helps with program readability and compiler checking, as
    you can easily see which method has been overridden in the parent class, and the
    compiler will quickly help you know if you have not actually overridden a method
    thinking in error that you have.


