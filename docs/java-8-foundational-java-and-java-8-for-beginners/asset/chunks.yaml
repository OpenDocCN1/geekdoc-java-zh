    \    }\n\n    public String getBookTitle( ){\n        return bookTitle;\n    }\n\
    \n    public String getBookAuthors( ){\n        return bookAuthors;\n    }\n}\
    \ \n``` \n\n运行上述程序列表 3.1 的输出如附 3.1 所示：\n\n![](img/00004.jpeg)\n\n图 3.1 程序列表 3.1\
    \ 的输出。\n\n### 3.2.3 访问修饰符\n\n`protected` 访问修饰符适用于类成员变量和方法。`protected` 成员仅在其类层次结构内部可访问。也就是说，`protected`\
    \ 类成员变量或方法可以通过同一包中的子类以及其他包中的子类进行访问。`protected` 访问修饰符应用于设计用于被子类继承或重写的成员方法。\n\n\
    ### 3.2.4 私有保护修饰符\n\n`private` `protected` 类成员可以通过继承被其他包中的类访问。虽然 `private` `protected`\
    \ 类成员可能无法被同一包中的任何其他非子类访问，但可以被同一包中的子类访问。\n\n### 3.2.5 默认访问修饰符\n\n一个没有指定访问修饰符的类会被分配一个默认访问修饰符。请注意，默认修饰符没有表示它的关键字。默认访问修饰符只允许访问同一包中的其他类。\n\
    \n### 3.2.6 抽象修饰符\n\n使用 `abstract` 关键字修饰的类被称为 `abstract` 类，这意味着该类包含一个或多个未实现的方法。未实现的方法没有方法体，因此必须在子类中被重写，这更多内容将在本书后进行讨论。\n\
    \n### 3.2.7 静态修饰符\n\n使用 `static` 访问修饰符修饰的类成员仅属于类本身。它是唯一的，没有实例副本。通常，当从类创建实例对象时，对象将获得该类成员的副本。但如果使用\
    \ `static` 修饰符，该类成员变量只有一个副本。\n\n`static` 成员通过类名后接点运算符 `.` 来访问，并且可以在创建类对象之前进行访问。因此，`static`\
    \ 成员变量必须初始化（因为它们必须有值），且 `static` 方法必须被定义。成员方法和变量可以声明为 `static`。更重要的是，`static`\
    \ 关键字不能在类方法中使用。\n\n### 3.2.8 最终修饰符\n\n`final` 修饰符可以用于类、方法或成员变量，具有不同的含义，下文所示：\n\
    \n#### a) 最终类\n\n当 `final` 关键字作为类修饰符使用时，使该类变得不可继承。其用法语法如下：\n\n```java\nfinal Book{\n\
    \    // 类体\n}\n```\n\n#### b) 最终方法\n\n使用 `final` 关键字修饰的方法不能通过继承或子类重写。其用法语法如下：\n\
    \n```java\nclass book {\n    final borrowBook( ){\n        // 方法体\n    }\n}\n\
    ```\n\n它的作用类似于 `private` 访问修饰符。\n\n#### c) 最终变量\n\n使用 `final` 关键字修饰的变量变为常量，其值在初始化后无法更改或更新。其用法语法如下：\n\
    \n```java\nfinal String bookTitle;\n```\n\n## 3.3 类对象\n\n对象是类的实例，具有以下特征：标识性、状态、类型和行为。这些特征在下文中将进一步解释：\n\
    \n### 3.3.1 对象的类型\n\n“对象（object）”是任何可以命名的事物的通用术语。因此，对象必须属于某个类别，该类别可以是一个概念（想法、知识或方法）、地点、一个物品、动物或人类。因此，我们说对象具有类型。由于对象总是属于某个类别，例如下面的\
    \ Java 代码在动物类别中创建了一个类型为 `birds` 的对象：\n\n```java\nBird sparrow = new Bird( );\n\
    ```\n\n左侧的 `Bird` 将 `sparrow` 声明为 `Bird` 类型，右侧的 `new` 关键字为 `Bird` 类定义的 `Bird`\
    \ 类型分配了所需的内存空间，并将内存地址分配给 `sparrow` 对象。要使用上述语句，你必须在程序的其他地方先创建了 `Bird` 类，该类的形式如下所示：\n\
    \n```java\nclass Bird{\n    private int flightStatus;\n    public Bird( ){\n \
    \       flightStatus= 0;\n    }\n    void setFlightStatus(int flightHieght ){\n\
    \        flightStatus = flightHieght;\n    }\n    int tellHeight( ){\n       \
    \ return flightStatus;\n    }\n}\n```\n\n### 3.3.2 对象的状态\n\n对象具有属性，可以是颜色、重量、位置或大小。对象的状态是一个可以测量的属性，该属性的值决定了对象在任何时刻的状态。例如，可以使用\
    \ `flightStatus` 来判断它是处于飞行状态（当 `flightStatus` 大于 0 时）还是栖息状态（当 `flightStatus` 为\
    \ 0 时）。\n\n### 3.3.3 对象的标识性\n\n对象保持一个唯一的标识，并与相似的对象不同。例如，只要之前的对象仍在在使用，在同一个代码块中无法创建另一个对象，但可以创建相似类型的对象。因此，以下语句是合法的：\n\
    \n```java\nBird sparrow2 = new Bird( );\neagle = new Bird( );\n```\n\n### 3.3.4\
    \ 对象的行为\n\n由于鸟和飞机等对象可以飞行，机器人和摄像头可以移动，而鱼和潜艇可以游泳，因此行为与其类型紧密相关。这些方法通常以动词（动作词）命名。例如，该类的\
    \ `setFlightStatus()` 方法是该类别中所有对象的通用行为，因为鸟可能会决定飞向高空，或栖息在海平面某处。下面的程序列表 3.1 让这一概念生动起来。\n\
    \n```java\nimport javax.swing.JOptionPane;\n\npublic class BirdObject{\n    public\
    \ static void main(String[] args){\n        Bird eagle = new Bird( );\n      \
    \  /* 使用导入的 JOptionPane 类的方法读取高度值 */\n        String m = JOptionPane.showInputDialog(\"\
    Enter a height in figure \");\n        /* 使用 setFlightStatus 方法设置鹰的飞行行为 */\n \
    \       eagle.setFlightStatus(Integer.parseInt(m));\n        System.out.println(\"\
    \\n\" );\n        if(eagle.tellHeight() > 0 )\n            System.out.println(\"\
    Eagle is in flight mode. );\n        else\n            System.out.println(\"Eagle\
    \ has perched. \" );\n    }\n}\n```\n\n"
