    \ in the following section 4.8\\.\n\n## 4.8 Interface Implementation\n\nNow to\
    \ define an interface for the common methods names “applyGear()” in classes “AutomaticVehicle”\
    \ and “ManualVehicle” of program listing 4.1 above, we write the following java\
    \ codes:\n\ninterface AutoManual{\n\n   public void operateGear(MotorVehicle motor);\n\
    \n}\n\nNotice that the argument type declared for the “operateGear()” abstract\
    \ method of “AutoManual” interface is the abstract class “MotorVehicle” from which\
    \ the “AutomaticVehicle” and “ManualVehicle” classes inherited. Therefore any\
    \ other class that implements the “AutoManual” interface must implement the “operateGear(\
    \ )” abstract method (since this method is not defaulted) and can operate any\
    \ motor car object whether automatic or manual. The implementing class is as shown\
    \ below:\n\nclass AutoManualOperator implements AutoManual{\n\n    public void\
    \ operateGear(MotorVehicle m){\n\n       m.applyGear();\n\n    }\n\n}\n\nThis\
    \ is seriously polymorphic and this is what interfaces do. I demonstrate this\
    \ in program listing 4.3 by improving on the public class CarMart of program listing\
    \ 4.2 to have a new public class CarMartInterface as shown below:\n\nProgram listing\
    \ 4.3:\n\n/* Importing the JOption class to create a visual input pane. */\n\n\
    import javax.swing.JOptionPane;\n\npublic class CarMartInterface\n\n{\n\n  public\
    \ static void main(String[] args){\n\n  AutomaticVehicle myAutomaticCar = new\
    \ AutomaticVehicle( );\n\n   ManualVehicle myManualCar = new ManualVehicle( );\n\
    \n AutoManualOperator operator = new AutoManualOperator( );\n\n    /*Reading the\
    \ desire vehicular type with the imported JOptionPlane class's method */\n\n   \
    \ String m = JOptionPane.showInputDialog(\"Enter (1) for a Manual vehcice (2)\
    \ for an automatic one \");\n\n    if(Integer.parseInt(m) == 1 )\n\n       //myManualCar.applyGear(\
    \ );\n\n operator.operateGear(myManualCar);\n\n    else\n\n       //myAutomaticCar.applyGear(\
    \ );     \n\n operator.operateGear(myAutomaticCar);\n\n  }\n\n  }\n\nabstract\
    \ class MotorVehicle{\n\n   public abstract void applyGear( );\n\n}\n\nclass ManualVehicle\
    \ extends MotorVehicle{\n\n  String gearType;\n\n  public ManualVehicle( ){\n\n\
       gearType = \"A manual gearing system.\";\n\n  }\n\n   @Override public void\
    \ applyGear( ){\n\n    System.out.println(\"\\n Manually change the gear by applying\
    \ the clutch.\" );\n\n  }\n\n  String displayGearType( ){\n\n   return gearType;\n\
    \n  }\n\n}\n\nclass AutomaticVehicle extends MotorVehicle{\n\n  String gearType;\n\
    \n  public AutomaticVehicle( ){\n\n   gearType = \"An automatic gearing system.\"\
    ;\n\n  }\n\n   @Override public void applyGear( ){\n\n    System.out.println(\"\
    \\n Change the gear by gently pushing or pulling the gear lever.\" );\n\n  }\n\
    \n  String displayGearType( ){\n\n   return gearType;\n\n  }\n\n}\n\ninterface\
    \ AutoManual{\n\npublic void operateGear(MotorVehicle motor);\n\n}\n\nclass AutoManualOperator\
    \ implements AutoManual{\n\n    public void operateGear(MotorVehicle m){\n\n      \
    \ m.applyGear();\n\n    }\n\n}\n\nNotice that the method “operateGear()” of class\
    \ AutoManualOperator accepted different objects “myAutomaticCar” and “myManualCar”\
    \ without any problem. The method “operatorGear()” is therefore an interface and\
    \ serves as an interface between the two classes. I have also been using the “if\
    \ statement”, please pardon me for now, it is just that I couldn’t have avoided\
    \ its usage at this time. The idea is that if the expression in the “if statement”\
    \ is true then the interpreter executes its code block and avoid the else’s code\
    \ block, but if not, does not execute the “if statement” block but executes the\
    \ else’s. I hope you got the idea. Decision statements shall be treated later\
    \ in another chapter in this book, trust me. The double forward slashes (//) are\
    \ used for line comments. This slashes were used to comment out previous non interfacing\
    \ program statement of program listing 4.1\\.\n\nWhen executed program listing\
    \ 4.2 has the same output with that of 4.1 but do not have to deal with two different\
    \ methods to operate the car gear system whether manual or automatic. The program\
    \ knows how to do this itself. That is true automation and that is what interfaces\
    \ do.\n\n### 4.8.1 A functional Interface\n\nA functional interface is an interface\
    \ with only a single abstract method. The following interface definition is a\
    \ functional interface:\n\ninterface multiplier{\n\n  float processMyNumber(float\
    \ r);\n\n}\n\nA functional interface is a good candidate for lambda expression,\
    \ the newly introduced short hand of writing inline functions in java. As a matter\
    \ of fact polymorphism is taken to the next level with lambda expressions. The\
    \ following section discusses lambda expressions and functional interfaces.\n\n\
    ## 4.9 Lambda Expressions and Functional Interfaces\n\nLambda expressions are\
    \ functions in mathematics and also in computing. They are better replacements\
    \ for anonymous functions in java 8 and very useful with functional interfaces.\
    \ Whenever you find yourself dealing with an interface having a single abstract\
    \ function you can safely use lambda expressions to simplify your codes.\n\n###\
    \ 4.9.1 Lambda Expressions\n\nThe following are the basic syntax of lambda expressions:\n\
    \nparameter -> expression\n\nor\n\n(type_declaration parameter) -> expression\n\
    \nor\n\n(parameters) -> expression\n\nor\n\n(type_declaration1 parameter, type_declaration2\
    \ parameter) -> {statements}"
