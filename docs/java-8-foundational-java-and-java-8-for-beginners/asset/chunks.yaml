    \n```java\nabstract class class_name{\n  public abstract method_name(optional\
    \ parameter_list);\n}\n```\n\n抽象方法被隐式声明为 `public`。\n"
- fmt: "\nA class does not extend an interface but implements one or more interfaces.\
    \ A class can only extend one class at a time making interfaces lot more flexible\
    \ and polymorphic in application. An interface is given an adjective name by standard\
    \ and created with the `interface` keyword. An interface member variable is declared\
    \ as `public` and `static` if present, and its member methods are declared as\
    \ `public` and `abstract` by default. In summary an interface can only have constants,\
    \ abstract and default methods as its member variables and methods. The syntax\
    \ of creation is as described below:\n\n```java\ninterface interface_name{\n\n\
    Static variables ;\n\nabstract method declarations;\n\ndefault method declaration;\n\
    \n}\n```\n\nProgram listing 4.3 illustrates the declaration of a default interface\
    \ method `myMessage()` and provides a default implementation of the default method,\
    \ please enjoy.\n\nProgram listing 4.3:\n\n```java\npublic class FunctionalInterface\n\
    {\n\n    public static void main(String[] args){\n\n      Confidential toMum =\
    \ new Confidential( );\n      MyMessage toCarthy = new MyMessage( );\n      System.out.println(\"\
    \\n My message to mum: \" + toMum.myMessage( ));\n      System.out.println(\"\\\
    n My message to Carthy: \" + toCarthy.myMessage( ));\n\n  }\n}\n\n//The Message\
    \ interface\ninterface Messaging{\n\n  default String myMessage( ){\n\n    return\
    \ \"Sorry, I am out of the office at the moment.\";\n\n  }\n}\n\nclass MyMessage\
    \ implements Messaging {\n\n  //Fails to implement myMessage( ) interface  method.\n\
    \n  }\nclass Confidential implements Messaging {\n\n    public String myMessage(){\n\
    \n    return \"See you soon mum. Love you.\";\n\n  }\n}\n```\n\nAn interface is\
    \ defined with the keyword `interface`. If an interface has a default method and\
    \ the implementing class did not implement the defaulted method then the defaulted\
    \ method shall be implemented when a call to that method is made in the implementing\
    \ class as shown in figure 4.3, the program output of program listing 4.3 below:\n\
    \n![](images/00010.jpeg)\n\nFigure 4.3 An output from program listing 4.3 above.\n\
    \nThe call to the object\" `toMum` of class `Confidential` which implemented the\
    \ defaulted method `myMessage` in the implemented interface `Messaging` gave a\
    \ customized message to mum. While a similar call to the object `toCarthy` of\
    \ class `MyMessage` also implementing the same interface with class `Confidential`,\
    \ but failing to implement its defaulted method `myMessage` produced a default\
    \ out of office message. A more advance interface implementation is discussed\
    \ in the following section 4.8.\n\n## 4.8 Interface Implementation\n\nNow to define\
    \ an interface for the common methods names `applyGear()` in classes `AutomaticVehicle`\
    \ and `ManualVehicle` of program listing 4.1 above, we write the following java\
    \ codes:\n\n```java\ninterface AutoManual{\n\n  public void operateGear(MotorVehicle\
    \ motor);\n\n}\n```\n\nNotice that the argument type declared for the `operateGear()`\
    \ abstract method of `AutoManual` interface is the abstract class `MotorVehicle`\
    \ from which the `AutomaticVehicle` and `ManualVehicle` classes inherited. Therefore\
    \ any other class that implements the `AutoManual` interface must implement the\
    \ `operateGear()` abstract method (since this method is not defaulted) and can\
    \ operate any motor car object whether automatic or manual. The implementing class\
    \ is as shown below:\n\n```java\nclass AutoManualOperator implements AutoManual{\n\
    \n    public void operateGear(MotorVehicle m){\n\n        m.applyGear();\n\n \
    \   }\n}\n```\n\nThis is seriously polymorphic and this is what interfaces do.\
    \ I demonstrate this in program listing 4.3 by improving on the public class `CarMart`\
    \ of program listing 4.2 to have a new public class `CarMartInterface` as shown\
    \ below:\n\nProgram listing 4.3:\n\n```java\n/* Importing the JOption class to\
    \ create a visual input pane. */\nimport javax.swing.JOptionPane;\n\npublic class\
    \ CarMartInterface\n{\n  public static void main(String[] args){\n  AutomaticVehicle\
    \ myAutomaticCar = new AutomaticVehicle( );\n   ManualVehicle myManualCar = new\
    \ ManualVehicle( );\n AutoManualOperator operator = new AutoManualOperator( );\n\
    \n    /*Reading the desire vehicular type with the imported JOptionPlane class's\
    \ method */\n    String m = JOptionPane.showInputDialog(\"Enter (1) for a Manual\
    \ vehcice (2) for an automatic one \");\n\n    if(Integer.parseInt(m) == 1 )\n\
    \        //myManualCar.applyGear( );\noperator.operateGear(myManualCar);\n\n \
    \   else\n      //myAutomaticCar.applyGear( );      \noperator.operateGear(myAutomaticCar);\n\
    \n  }\n  }\nabstract class MotorVehicle{\n  public abstract void applyGear( );\n\
    }\nclass ManualVehicle extends MotorVehicle{\n  String gearType;\n  public ManualVehicle(\
    \ ){\n  gearType = \"A manual gearing system.\";\n  }\n\n  @Override public void\
    \ applyGear( ){\n    System.out.println(\"\\n Manually change the gear by applying\
    \ the clutch.\" );\n  }\n  String displayGearType( ){\n  return gearType;\n  }\n\
    }\nclass AutomaticVehicle extends MotorVehicle{\n  String gearType;\n  public\
    \ AutomaticVehicle( ){\n  gearType = \"An automatic gearing system.\";\n  }\n\n\
    \  @Override public void applyGear( ){\n    System.out.println(\"\\n Change the\
    \ gear by gently pushing or pulling the lever.\" );\n  }\n\n  String displayGearType(\
    \ ){\n  return gearType;\n  }\n}\n```\n"
