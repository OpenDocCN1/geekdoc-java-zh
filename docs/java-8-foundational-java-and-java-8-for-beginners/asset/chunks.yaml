    ## 4.5 函数重载\n\n当编写了另一个名称相似但签名（signature）不同的函数时，该函数就被重载了，一个很好的例子是 `SmartPhone`\
    \ 的构造函数。这两个构造函数的名称相似，但参数列表不同。第一个完全不接受任何参数，而第二个接受一个字符串参数（`nmodel`），编译器根据不同的签名知道应该调用哪一个构造函数。\n\
    \n## 4.6 抽象类\n\n抽象类是至少包含一个未实现方法（抽象方法）并带有 `abstract` 修饰符的类。抽象方法是一种没有实现但具有签名（方法名及其可选参数列表）的方法。下方的用法语法所示：\n\
