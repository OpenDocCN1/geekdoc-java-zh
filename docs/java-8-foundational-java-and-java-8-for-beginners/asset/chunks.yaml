    ## 4.5 Function Overloading


    A function is overloaded when another function of similar name but with a different
    signature is written, a good example are the “SmartPhone” constructors. The two
    constructors have similar names but differ in parameter list. The first accepted
    no parameter at all, while the second accepted a string parameter (nmodel), and
    the compiler knew which constructor to call based on the differing signatures.


    ## 4.6 Abstract Classes


    An abstract class is a class with at least an un-implemented method (abstract
    method) and has an abstract modifier. An Abstract method is a method with no implementation
    but with a signature (method name with its optional parameter list). This is as
    shown in the syntax of usage below:


    Public abstract method_name(optional parameter_list);


    Since an abstract class has at least one abstract method, no instance of such
    a class can be created. Such a class is only good for inheritance purposes only,
    and a subclass must inherit and provide the required implementation for the inherited
    abstract method, if not, the subclass becomes an abstract class too. The syntax
    for an abstract class is described below:


    abstract class class_name{


      public abstract method_name(optional parameter_list);


    }


    The abstract method is implicitly declared as public for it to be implementable
    by an inheriting class and if not implemented by the inheriting class the class
    also become abstract as earlier said.


    The concept is illustrated with a “MotorVehicle” class. All types of cars inherit
    from their parent “MotorVechicle” class and all kinds of cars perform similar
    tasks and their interface is used in the same way (a car steering wheel is used
    in the same way for all cars), the difference is in the technology applied for
    efficiency in performance (power steering wheels). But there is an exception to
    the rule, the gearing system in an automatic car is different both in appearance
    and usage to the gearing system in a manual car.


    For this reason we cannot have a generic parent class “MotorVehicle” with all
    its method fully implemented for overriding when necessary in its sub classes
    as we did with the “MobilePhone” class in program listing 4.1 because we do not
    know for sure what kind of vehicle (automatic or manual) would be inheriting from
    the class “MotorVehicle”. It is therefore wise to leave the implementation of
    the gearing system method to the implementing class by making the method an abstract
    one in the parent class. This action ultimately turned the parent class into an
    abstract class. The definition is therefore as written below:


    abstract class MotorVehicle{


       public abstract void applyGear( );


    }


    Now the manual vehicle class can inherit the abstract “MotorVehicle” class and
    implement its own version of the applyGear( ) method as shown below:


    class ManualVehicle extends MotorVehicle{


      String gearType;


      public ManualVehicle( ){


       gearType = "A manual gearing system.";


      }


      @Override public void applyGear( ){


        System.out.println("\n Manually change the gear by applying the clutch." );


      }


      String displayGearType( ){


       return gearType;


      }


    }


    Also the automatic vehicle class can implement its own version of the gearing
    system method by implementing the abstract “applyGear( )” method inherited from
    the MotorVehicle class as shown below:


    class AutomaticVehicle extends MotorVehicle{


      String gearType;


      public AutomaticVehicle( ){


       gearType = "An automatic gearing system.";


      }


      @Override public void applyGear( ){


        System.out.println("\n Change the gear by gently pushing or pulling the gear
    lever." );


      }


      String displayGearType( ){


       return gearType;


      }


    }


    The sub classes can now be utilized in a CarMart main class as described below
    in program listing 4.2 below:


    Program listing 4.2:


    /* Importing the JOption class to create a visual input pane. */


    import javax.swing.JOptionPane;


    public class CarMart


    {


      public static void main(String[] args){


       AutomaticVehicle myAutomaticCar = new AutomaticVehicle( );


       ManualVehicle myManualCar = new ManualVehicle( );


        /*Reading the desire vehicular type with the imported JOptionPlane class''s
    method */


        String m = JOptionPane.showInputDialog("Enter (1) for a Manual vehcice (2)
    for an automatic one ");


        if(Integer.parseInt(m) == 1 )


           myManualCar.applyGear( );


        else


           myAutomaticCar.applyGear( );     


      }


      }


    Program listing 4.2 input and output upon execution are as shown in figure 4.2
    below:


    ![](images/00008.jpeg)


    Figure 4.2a the input pane for program listing 4.2.


    ![](images/00009.jpeg)


    Figure 4.2b the output from running program listing 4.2\.


    We haven’t exhausted the advantages of using abstract classes just yet. You would
    notice that the class “AutomaticVehicle” and “ManualVehicle” have similar “applyGear()”
    methods in common, these methods expose an interface opportunity between the two
    classes. This is also an opportunity for implementing polymorphism since a method
    that accepts a class as an argument would also accept all sub types of that class.
    This takes us to another object oriented programming concept “interface”.


    ## 4.7 Interfaces


    Abstract classes lead naturally to the creation of interfaces between classes.
    Interfaces aid polymorphism in programming just like abstract classes do, but
    the difference is that abstract classes do this through inheritance as earlier
    described and interfaces achieve this through parameters.


    In previous versions of java up to java 7, an interface does not implement any
    of its methods. The methods are left to the implementing classes as contracts
    that must be implemented. But in java 8 there is an improvement to java, which
    allows for a default implementation of the interface methods in the interface
    itself. Therefore an implementing class is no longer enforced to implement the
    defaulted method.'
