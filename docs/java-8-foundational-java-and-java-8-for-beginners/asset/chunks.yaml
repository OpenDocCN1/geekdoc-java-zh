    # Chapter 7


    # Array and ArrayList and Parallel Sorting


    An array is a collection of similar data types that share an indexed group name.
    It is considered to be an object in java and always passed as a reference to receiving
    methods, and never by value as done with variable names.


    ## 7.1 Array Declaration


    The syntax for an array declaration is as described below:


    Data_type[] array_name;


    For example, to declare a String array “balls” that holds a collection of different
    types of balls, the following java statement is written:


    String[] balls;


    However, declaring a variable name as an array does not automatically allocate
    the required memory space to the array name. To make the compiler do this you
    need to use the new keyword as done below:


    balls = new String[4];


    Or you may have declaration and memory space allocation on a single line like
    done below:


    String[] balls = new String[4];


    The phrase “new String[4]” phrase allocated four contiguous memory spaces of size
    String in the heap memory area of the computer system to the array variable name
    balls. Now array balls can store four different balls names.


    ## 7.2 Array Assignment


    Array memory slots can be initiated with preset values at creation like shown
    below:


    String[] balls = {"Basketball", "Baseball", "Volley Ball", "Football" };


    Also an array slot may be assigned with a value through an assignment like shown
    below:


    balls[0] = "Basketball";


    However, the assignment can only be done after memory space allocation is done
    for an array. You must also note that an array index starts from 0 in java, C,
    C++ and C#. Also an array object in java has a public field “length” that you
    can always use to return the length of an array object. For example to determine
    the length of the array “balls” the following statement is applicable.


    int array_length = balls.length;


    ## 7.3 Multi-dimensional Arrays


    A multi-dimensional array is an array of arrays. For example, the following statement
    declares a two dimensional array “rooms” that holds the available rooms in a two
    story house.


    int[][] rooms;


    You can allocate the necessary memory space for a two story building with ten
    rooms on each floor (an array of two arrays with ten slots each) with the following
    statement:


    rooms = new int[2][10];


    or you may have the two statements together as shown below:


    int[][] rooms = new int[2][10];


    You can now assign values to the rooms’ slots to indicate their availability.
    That is, you may assign a value 1 to a room that is occupied and a value 0 to
    a vacant room’s slot. This is as described in the code statement below:


    rooms[1][4] = 0;


    The above statement assigns a value 0 to room five on the second floor of the
    house. Remember that our index will always start from 0\. An easier way of initiating
    all rooms to a value 0 is to use a nested for loop statement as described below:


        for(int floor=0; floor < rooms.length; ++floor)


          for(int room_no=0; room_no < 10; ++room_no)


                    rooms[floor][room_no] = 0;


    The first “for” statement’s initialization expression initialized the floor variable
    to 0, setting it to the beginning of the two dimensional array (first floor),
    and the conditional expression uses the length public array field to retrieve
    the length of the two dimensional array which is 2\. The second for statement
    loops through the rooms on each floor. 


    ## 7.4 The Enhanced For Loop


    The enhanced for loop was introduced with java5\. It can be used for accessing
    the contents of an array without you having to worry about the array index or
    checking the array length. It is a more compact statement and its syntax of usage
    is as described below:'
