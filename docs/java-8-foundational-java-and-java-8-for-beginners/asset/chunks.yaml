    \ 7.7 所示：\n\n![](img/00026.jpeg)\n\n图 7.7。程序列表 7.7 的输出。\n\n程序列表 7.7 使用 `printf`\
    \ 方法将程序的输出打印到标准输出设备。`printf` 方法在其消息字符串中使用字符格式 `%d` 用于整数数据，`%f` 用于浮点数，`%s` 用于字符串，如上面程序列表\
    \ 7.7 所示，表示消息字符串中要替换的参数。\n\n## 7.8b 使用 Lambda 进行 ArrayList 迭代\n\n如本书第 4 章第 4.5\
    \ 节所述，引入 `Collections` 包和 `stream` 方法使得 java8 中集合的处理对于底层硬件来说变得更加简单和快速。为了说明这一点，对上面的程序列表\
    \ 7.7 进行了修改，使用 `foreach` 函数语句来迭代 `softDrinks` `ArrayList` 的内容，用 lambda 的 `foreach`\
    \ 语句替换了增强型 for 循环。此修改如下程序列表 7.8 所示。请享用。\n\n**程序列表 7.8：**\n\n```java\nimport java.util.ArrayList;\n\
    import java.util.Collections;\n\npublic class ArrayListLambda\n{\n  public static\
    \ void main(String[] args){\n      ArrayList<String> softDrinks = new ArrayList<String>(\
    \ );\n      softDrinks.add(\"Coca Cola\");\n      /* 增强型 for 循环被注释掉了 */\n    \
    \  //for (String t : softDrinks)\n      //System.out.printf(\"\\n Index is %d\
    \ for the element object %s \", softDrinks.indexOf(t),t);\n    /* 增强型 for 循环现在被\
    \ forEach 循环替换 */\n     softDrinks.stream().forEach((t) -> {\n      System.out.printf(\"\
    \\n Index is %d for the element object %s \\n\", softDrinks.indexOf(t),t);\n \
    \  });\n  }\n}\n```\n\n程序的输出如图 7.8 所示：\n\n![](img/00027.jpeg)\n\n图 7.8 程序输出。\n\
    \n## 7.9 删除 ArrayList 对象\n\n可以使用 `ArrayList` 的 `clear()` 方法从 ArrayList 中删除所有对象。用法语法如下：\n\
    \n```java\narraylist_object.clear();\n```\n\n例如，要从 arraylist `softDrinks` 中删除所有元素，可以使用以下语句：\n\
    \n```java\nsoftDrinks.clear();\n```\n\n而要从 arraylist 删除特定的对象元素，可以使用以下语法：\n\n```java\n\
    arraylist_object.remove(object_element);\n```\n\n例如，要从 arraylist `softDrinks`\
    \ 中移除第一个对象，可以使用以下语句：\n\n```java\nsoftDrinks.remove(0);\n```\n\n## 7.10 Iterator\
    \ 接口：\n\n`ArrayList` 类实现了 `iterator` 接口，该接口具有以下方法：`next()`、`hasNext()` 和 `remove()`。`next()`\
    \ 方法返回 arraylist 中的下一个对象元素。`hasNext()` 方法检查 `ArrayList` 中是否还有可用的对象元素，`remove()`\
    \ 方法从列表中删除当前对象。在 java 程序中使用 `iterator` 接口，你必须从 java 工具包导入 `Iterator` 类（`java.util.Iterator`），或者使用语句\
    \ `java.util.*` 一次性导入工具包中的所有类，如下方的程序列表 7.9 所示：\n\n```java\nimport java.util.ArrayList;\n\
    import java.util.Iterator;\n\npublic class IteratorProg\n{\n  public static void\
    \ main(String[] args){\n      ArrayList<String> softDrinks = new ArrayList<String>(\
    \ );\n      String t;\n      softDrinks.add(\"Coca Cola\");\n      softDrinks.add(\"\
    Fanta\");\n      softDrinks.add(\"Pepsi\");\n      Iterator itr =  softDrinks.iterator(\
    \ );\n      while (itr.hasNext( ){\n        t= (String) itr.next( );\n       \
    \ System.out.printf(\"\\n Index is %d for the element object %s \", softDrinks.indexOf(t),t);\n\
    \      }\n  }\n}\n```\n\n"
- fmt: "\nProgram listing 7.9 demonstrated the use of the `Iterator` interface by\
    \ using the `hasNext()` method of the `Iterator` interface in the while loop expression\
    \ to test for a non-empty list and then used the `next()` method to retrieve the\
    \ next object element from the list. This brings us again to the end of another\
