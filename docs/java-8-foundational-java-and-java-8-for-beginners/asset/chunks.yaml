    \n要在命令行提示符中运行 applet，请使用 `appletviewer` 命令执行下方图 11.3 所示的 html 文档：\n\n```bash\n\
    C:\\practice>appletviewer LocalTimeApplet.htm\n```\n\n程序在命令行提示符中甚至在 Netbeans IDE\
    \ 中执行时，输出结果如图 11.3 所示：\n\n![](img/00038.jpeg)\n\n图 11.3。程序列表 11.2 (applet) 的输出。\n\
    \n`Graphics` 类主要用于在系统输出设备上绘制对象。以下是常用的 `Graphics` 类方法：\n\na) `public abstract void\
    \ drawLine (int x, int y, int x2, int y2);` 用于从点(x, y) 到点 (x2, y2) 绘制一条线。\n\n\
    b) `public abstract void drawImage(Image img, int x, int y, ImageObserver obs);`\
    \ 用于将给定图像绘制到输出设备。\n\nc) `public abstract void drawArc(int x, int y, int width,\
    \ int height, int startAngle, arcAngle);` 用于向输出设备绘制一个弧。\n\nd) `public abstract\
    \ void drawOval(int x, int y, int width, int height);` 用于向输出设备绘制一个椭圆形。\n\ne) `public\
    \ abstract void drawRect(int x, int y, int width, int height);` 用于向输出设备绘制并输出一个矩形。\n\
    \nf) `public abstract void drawstring(String str, int x, int y);` 用于向输出设备输出字符串。\n\
    \ng) `public abstract void fillArc(int x, int y, int width, int height, int startAngle,\
    \ arcAngle);` 用指定的定的颜色填充绘制的弧。\n\nh) `public abstract void fillOval(int x, int\
    \ y, int width, int height);` 用设定的颜色填充绘制的椭圆形。\n\ni) `public abstract void fillRect(int\
    \ x, int y, int width, int height);` 用于用指定的颜色填充绘制的矩形。\n\nj) `public abstract void\
    \ setColor(Color c);` 用于设置图形当前的填充颜色。\n\n例如，下方程序列表 11.3 中的以下 applet 代码负责使用 `Graphics`\
    \ 和 `Color` 类在输出设备上绘制一个填充为粉红色的矩形对象。\n\n程序列表 11.3：\n\n```java\nimport java.applet.Applet;\n\
    import java.awt.Color;\nimport java.awt.Graphics;\n\n/**\n*\n* @author Dosunmu\n\
    */\npublic class FilledRectangle extends Applet {\n    /**\n     * 在 applet 加载到浏览器后调用的初始化方法。\n\
    \     */\n    @Override\n    public void init() {\n        // TODO start asynchronous\
    \ download of heavy resources\n    }\n    @Override\n    public void paint(Graphics\
    \ p){\n      p.setColor(Color.pink);\n      p.drawRect(140, 70, 45, 60); \n  \
    \    p.fillRect(140, 70, 45, 60);\n    }\n}\n```\n\n程序列表 11.3 的输出如图 11.4 所示：\n\
    \n![](img/00039.jpeg)\n\n图 11.4。上方程序列表 11.3 的输出。\n\n然而，applets 也有自己的缺点和局限性，如下：\n\
    \na) 它们需要插件才能在浏览器中执行\n\nb) 浏览器的安全设置可能会阻止你的 applet 执行\n\n尽管如此，applets 也有自己的优势，因为它们更安全、速度更快（因为它们在客户端执行），并且一旦安装了\
    \ Java 运行时环境，就可以各种平台上运行。\n\n总之，applets 并不是构建优秀网站和用户体验的最佳方式，在达到那个水平时，servlets 提供了更好的前景。从这里开始，你可以轻松理解你所选的任何其他关于\
    \ Java 8 编程和 servlet 开发的高级书籍，因为尽管我想继续写下去，但我必须在此停笔。如果需求需要，我可以在本书的后续系列中包含关于 servlet\
    \ 和数据库操作的内容。\n\n我知道你最初下载这本书是有原因的，首先，我希望你的目的得以实现；其次，有一个带你来到这里的动力，这可能是因为你有一个即将启动的项目，或者你正处于某个项目的中间。如果是这样，我建议你也下载我的另一本被高度推荐的书，名为[“文献综述写作：一种简化方法”。](http://www.amazon.co.uk/dp/B00OG1YACS)\
    \ 它将极大地简化你的项目；它将成为你值得收藏的珍宝。谢谢。\n\n# 结论\n\n我们从最简单的 Java 开发概念开始，到最先进且实用的 XML 技术，再到最新的\
    \ Java 8 新特性。尽管你可能是一个初学者，但我们在上帝的保佑下的软件开发经验使得这本书成为可能。\n\n如果你在某种程度上获得了福报，无论多么微小，请也通过对这项作品提供你自己的评价来贡献你的一薄之力，这样其他人也能发现这本书并从中受益。你只需移动到这本书的评论页面即可给出五星好评。只要你继续前进，就能到达那里。感谢你的评价。\n\
    \n在我离开之前，来点一点分散注意力的事情如何？正如人们所说，只工作不玩耍会让人变得无呆。现在带着这个小珍宝度过剩下的时光吧：\n\n![](http://www.amazon.co.uk/dp/B00ZFVZ0K4)\n\
