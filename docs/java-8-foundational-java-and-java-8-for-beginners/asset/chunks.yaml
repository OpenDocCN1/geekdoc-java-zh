    \ 开发项目，我建议你下载名为“[HTML5; 从入门到中级的简化版](http://www.amazon.co.uk/dp/B00PIMD5P2)”的书，以及名为“[CSS3;\
    \ 从入门水平开始的 CSS2 和 3（二合一）](http://www.amazon.co.uk/dp/B00QZ2S2JI)”的书，用于专业网页的 html\
    \ 页面布局和样式设计。这两本书都在亚马逊 Kindle 书店，可以通过点击链接或在搜索框中输入书名购买。感谢你的支持。\n\n### 11.1 Applet\
    \ 元素\n\napplet 通过 applet 元素嵌入到 html 文档中。applet 元素的描述如下所示：\n\n```html\n<applet\
    \ code=”applet.class” width=200 height=100 > </applet>\n```\n\n`code` 属性指定通过编译\
    \ applet 源文件得到的 applet 字节码（applet 类），而 `width` 和 `height` 设置 applet 的宽度和高度。applet\
    \ 的编译方式与使用 `javac` 命令编译 java 应用程序的方式相同，之后可以使用 `appletviewer` 命令运行它。如果你的 applet\
    \ 需要某些参数，可以如下所示，通过 `param` 元素从网页中获取参数：\n\n```html\n<applet code=”applet.class”\
    \ width=200 height=100 >\n<param name=sex value=”Male” >\n</applet>\n```\n\n`param`\
    \ 元素的属性 `name` 用于指定参数名称，而属性 `value` 则用于提供参数值。\n\n### 11.2 Applet 的结构\n\napplet\
    \ 没有 java 应用程序中通用的静态 public main 方法，相反，它拥有的是公有的 `init()` 方法，用于在启动时初始化 applet。Java\
    \ applets 不需要强制的方法。这些方法由浏览器根据 Java 虚拟机的要求调用。`Applet` 类（自 `Panel` 类）的以下方法对于实现 applet\
    \ 至关重要：\n\na) `public void init()`：被浏览器用于 applet 的初始化\nb) `pubic void start()`：被浏览器用于在初始化后启动\
    \ applet。在页面加载时调用\nc) `public void stop()`：被浏览器用于在页面离开时停止 applet\nd) `public void\
    \ destroy()`：由浏览器用于销毁 applet 并清理内存\n\n上述 `Applet` 类的方法必须导入才能使用它们。applet 类的继承关系如图\
    \ 11.2 所示：\n\n![](img/0037.jpeg)\n\n图 11.2. Applet 类的继承树。\n\n根据 Applet 的层次结构，`applet`\
    \ 类继承自 `Panel` 类，其继承自 `Container` 类，再继承自 `Component` 类，最后继承自 `Object` 类。诚然，`applet`\
    \ 类被丰富了。然而，applet 类的 `public void paint( )` 方法用于在浏览器中绘图。让我们创建一个重写了 `paint` 方法的示例\
    \ applet。\n\n### 11.3 示例 Applet\n\n列表 11.2 中的以下示例 applet 在浏览器启动时显示当前时间。\n\n列表\
    \ 11.2：\n\n```java\nimport java.applet.Applet;\nimport java.awt.Graphics;\nimport\
    \ java.time.LocalTime;\n\n/**\n* 作者 Dosunmu\n*/\npublic class LocalTimeApplet\
    \ extends Applet {\n\n/**\n* 在浏览器加载 applet 后调用的方法\n */\n    @Override\n    public\
    \ void init() {\n        // TODO 异步下载资源\n    }\n\n    @Override\n    public void\
    \ paint(Graphics t){\n        t.drawString(\"当前时间为：\" + LocalTime.now(), 100,90);\n\
    \    } // 不需要重写 start(), stop() 和 destroy 方法\n}\n```\n\n不需要重写 `start()`、`stop()`\
    \ 和 `destroy()` 方法，因为浏览器会在 applet 进入视野时自动调用 `start()` 方法，在离开视野时调用 `stop()` 方法，并在页面从浏览器移除时调用\
    \ `destroy()` 方法。\n\n上面的 applet 可以像编译 java 代码一样，使用 `javac` 命令或在 netbeans 中编译生成字节码，然后将其嵌入到如列表\
    \ 11.1 所示的 Web 文档中。嵌入方式如下文修改后的列表 11.1 (11.3) 所示：\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title> 我的第一个 HTML5 网页 </title>\n<meta charset=\"UTF-8\">\n</head>\n\
    <body>\n       <header ><em ><u> 我的 APPLET 项目。</u></em><br/> </header>\n      \
