    b) public abstract void drawImage(Image img, int x, int y, ImageObserver obs);
    for drawing an a given image to the output device


    c) public abstract void drawArc(int x, int y, int width, int height, int startAngle,
    int arcAngle); for drawing an acr to the output device


    d) public abstract drawOval(int x, int y, int width, int height); for drawing
    an oval shape to the output device


    e) public abstract void drawRect(int x, int y, int width, int height); for drawing
    and outputting a rectangle to the output device


    f) public abstract void drawstring(String str, int x, int y); for outputting a
    string to the output device


    g) public abstract void fillArc(int x, int y, int width, int height, int startAngle,
    int arcAngle); for filling a drawn arc with a set color


    h) public abstract void fillOval(int x, int y, int width, int height); for filling
    a drawn oval shape with a set color


    i) public abstract void fillRect(int x, int y, int width, int height); use for
    filling a drawn rectangle with a set color


    j) public abstract void setColor(Color c); use for setting graphic current filling
    color


    For example, the following applet code in program listing 11.3 below is responsible
    for drawing a rectangular object filled with color pink to the output device with
    the use of the Graphics and the Color class.


    Program listing 11.3:


    import java.applet.Applet;


    import java.awt.Color;


    import java.awt.Graphics;


    /**


    *


    * @author Dosunmu


    */


    public class FilledRectangle extends Applet {


        /**


         * Initialization method that will be called after the applet is loaded into


         * the browser.


         */


        @Override


        public void init() {


            // TODO start asynchronous download of heavy resources


        }


        @Override


        public void paint(Graphics p){


          p.setColor(Color.pink);


          p.drawRect(140, 70, 45, 60); 


          p.fillRect(140, 70, 45, 60);


        }


    }


    The output of program listing 11.3 is as shown in figure 11.4 below:


    ![](images/00039.jpeg)


    Figure 11.4\. The output from program listing 11.3 above.


    However, applets have their own short comings and limitations which are as listed:


    a) They require plugins to be able to execute in the client browser


    b) The browser security setting may forbid your applet from executing


    Still with these, applets also have their own advantages in the sense that they
    are more secure, faster because they execute on the client side and can run on
    varieties of platforms once the java runtime environment is installed.


    In conclusion applets are not the best way to building great websites and user
    experiences, servlets make better promises when it gets to that level. From here
    on, you can easily understand any other advance book you pick up on java 8 programming
    and servlet development as I shall have to come to a stop here in as much as I
    love to continue writing on. I may include the treatment of servlet and database
    manipulation in the next series of this book if the demand requires them.


    I know you have a reason for downloading this book in the first instance, in the
    first instance I hope that the purpose is met, and in the second instance a motivating
    purpose that brought you to this end, which may be that you have an impending
    project, or that you are in the middle of one. If this is the reason, I suggest
    that you also download another of my highly recommended book titled [“Literature
    Review Writing; a simplified approach.](http://www.amazon.co.uk/dp/B00OG1YACS)”
    It will simplify your project for you a great deal; more it is going to be a treasure
    for your keeping. Thank you.


    # Conclusion


    We started from the very simple of java development concept to the most advanced
    and ever useful XML technology to the latest java 8 additions. Though you may
    be a beginner but our experience in software development with God on our side
    have made this book a possibility.


    If you have been blessed one way or the other no matter how little, please also
    contribute your own little quota by giving your own review of appreciation for
    this work, so others may also find this book and benefit from it. You can give
    your five star reviews by simply moving to the review page of this book. You will
    get there if you keep moving on. Thank you for your review.


    Before I take my leave, how about a little distraction, afterall all work and
    no play, they say makes Jack a dull boy. Now enjoy the rest of the day with this
    little treasure:


    [![](images/00040.jpeg)](http://www.amazon.co.uk/dp/B00ZFVZ0K4)


    Learn to make beautiful gift boxes and present your gifts in your heart desired
    way in style by downloading the above book. Till will meet again, lots of thanks
    and keep safe. Bye for now.'
