    java 中的 `ArrayList` 在功能上与数组基本相同，但 `ArrayList` 只存储对象列表，而数组可以存储原始类型和对象。`ArrayList`\
    \ 不像数组那样具有固定长度。它的大小可以改变以适应新元素的添加和删除。使用 `size()` 方法获取其新长度就像使用数组的 `length` 字段。此外，数组属于核心\
    \ java API，而 `ArrayList` 类属于 java 工具包（`java.util.ArrayList`），在 java 程序中使用 `ArrayList`\
    \ 类之前必须先导入。`ArrayList` 的声明语法如下所示：\n\n```java\nArrayList array_name = new ArrayList();\n\
    ```\n\n你也可以如下所示配合泛型使用 `ArrayList`：\n\n```java\nArrayList<data_type> array_name\
    \ = new ArrayList<data_type>();\n```\n\n例如，你可以使用泛型定义一个可以接受所有字符串类型的 `ArrayList`，如下所示：\n\
    \n```java\nArrayList<String> softDrinks = new ArrayList<String>();\n```\n\n"
