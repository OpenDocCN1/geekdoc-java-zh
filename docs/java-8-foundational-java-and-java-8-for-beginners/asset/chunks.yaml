    \ `return` 关键字。以下是有效的 lambda 表达式示例：\n\n```\n(a)->a *a;\n```\n接收一个参数 `a`，将其与自身相乘并返回结果。\n\
    \n```\na -> a + a;\n```\n接收一个参数 `a`，将它们相加并返回结果。\n\n```\n(int a, int b) -> a –\
    \ b;\n```\n在间接引用左侧接收参数 `a` 和 `b`，从参数 `a` 中减去参数 `b` 的值并返回结果。\n\n```\n(String t)\
    \ -> System.out.println(t);\n```\n该 lambda 表达式将字符串 `t` 的内容打印到控制台。\n\n### 4.9.2\
    \ 在函数接口中使用 Lambda \n\n下面的程序列表演示了如何通过使用函数接口进行数学计算来使用 lambda 表达式：\n\n```java\ninterface\
    \ multiplier{\n  float processMyNumber(float r);\n}\n```\n上文 4.8.1 节已定义。\n\n程序列表\
    \ 4.4：\n\n```java\npublic class LambdaOperator\n{\n  public static void main(String[]\
    \ args){\n    Result res = new Result( );\n    float n=8;\n    multiplier square\
    \ = (a) -> a * a;\n    multiplier doubler = a -> a + a;\n    System.out.printf(\"\
    \\nResult of squaring %f is %f \", n, res.numberNSquare(n,square));\n    System.out.printf(\"\
    \\nResult of doubling %f is %f \", n, res.numberNSquare(n,doubler));\n  }\n}\n\
    \ninterface multiplier{\n  float processMyNumber(float r);\n}\n\nclass Result\
    \ {\n  float hold;\n  void result(){\n    hold =0;\n  }\n  float numberNSquare(float\
    \ n, multiplier squaredNo){\n    return (squaredNo.processMyNumber(n));\n  }\n\
    }\n```\n\n上述程序列表 4.4 的输出如图 4.4 所示：\n\n![](img/00011.jpeg)\n\n图 4.4 程序列表 4.4 的输出。\n\
    \n`square` 和 `doubler` lambda 表达式隐式地实现了 `Multiplier` 接口的唯一抽象方法 `processMyNumber`。`Multiplier`\
    \ 接口被声明为 `Result` 类方法 `numberNSquare(int, Multiplier )` 的第二个参数，通过这种方式，`numberNSquare`\
    \ 方法可以接受接口的任何对象类型。因此，我们可以根据需要将 lambda 表达式传递到 `numberNSquare` 方法中。这极大地简化了代码并更具多态性。\n\
    \n在本章结束之前，最后一点说明：接口可以扩展另一个接口。尝试一下吧，我们下章见，讨论程序循环和数组。感谢大家的关注。\n\n# 第 5 章\n\n# 程序控制循环和\
    \ ForEach 循环\n\n程序循环是重复执行特定次数语句块的程序语句。我们有三种基本的控制循环语句：`for` 循环语句、`while` 循环语句和\
    \ `do` 语句。我们将在本章逐一查看它们。\n\n## 5.1 For 循环语句\n\n`for 循环语句` 在开启和关闭的大括号内按指定的次数执行一组程序语句或单个程序语句。`for\
    \ 循环`语句的通用语法如下所示：\n\n```java\nfor( loop_variable; loop_conditional_expr ; loop_incremental_stmt\
    \ ){\n   loop statements\n}\n```\n\n循环变量为增量语句变量设置了初始值。`for 循环语句`的执行从循环变量初始化开始。可以有多个循环变量，只要它们用逗号隔开都没有问题。在循环变量初始化后，会评估循环条件表达式，如果它的求值为真值，则执行循环语句，并执行增量语句进行下一次迭代。如果条件表达式的求值不是真值，则退出循环。为了说明，程序列表\
    \ 5.1 使用 `for` 循环语句在控制台上打印出从 1 到 10 的一组数字。\n\n程序列表 5.1：\n\n```java\npublic class\
    \ ForLoop\n{\n  public static void main(String[] args){\n    for(int i=1; i <\
    \ 11 ; ++i)\n      System.out.println(i);\n  }\n}\n```\n\n程序列表 5.1 的输出如图 5.1 所示：\n\
    \n![](img/00012.jpeg)\n\n图 5.1 程序列表 5.1 的输出。\n\n程序列表 5.1 中的 `for` 循环语句从循环变量语句中的变量\
    \ `i` 初始化为 1 开始（`i = 1`）。然后它评估循环条件语句（`i<10`）以测试变量 `i` 是否仍然小于 10，如果是，则执行 `for`\
    \ 循环体。如果你在 `for` 循环块中只有一行语句，可以省略循环语句的开启和关闭括号。\n\n## 5.2 嵌套 for 循环\n\n嵌套 for 循环表示发生特定次数的迭代事件。它是另一个\
    \ `for loop` 内部的 `for loop`。`for loop` 的语法如下：\n\n```java\nfor(loop_var1; cond1;\
    \ inc1) {\n   for(loop_var2; cond2; inc2)\n```\n\n为了说明，程序列表 5.2 使用嵌套循环生成了从 1 到\
    \ 4 的乘法表。\n\n程序列表 5.2：\n\n```java\npublic class NestedFor\n{\n  public static\
    \ void main(String[] args){\n    for(int i=1; i < 5 ; ++i){\n      System.out.println(\"\
    \\n\" + i + \" Series Table\");\n      for(int j=1; j < 4 ; ++j)\n        System.out.println(\
    \ i + \" * \" + j + \" = \" + (i*j) );\n    }\n  }\n}\n```\n\n程序列表 5.2 的输出如图 5.2\
    \ 所示：\n\n![](img/00013.jpeg)\n\n图 5.2 程序列表 5.2 的输出。\n\n请注意，你不能在内层循环中重用外层循环使用的变量名。这是因为这里适用作用域规则。\n\
    \n## 5.3 增强型 For 循环\n\n增强型 for 循环通常用于数组，其通用语法如下：\n\n```java\nfor( data_type element:\
    \ array_name )\n```\n\n稍将在数组部分介绍增强型 for 循环。\n\n## 5.4 Lambda 循环\n\nlambda foreach\
    \ 随着 `stream` 类引入 `java.util.Collections` 包被引入到 Java 8 SE。`stream` 类自带了一些工具方法，如\
    \ `min`、`max`、`filter`、`findFirst` 等。现在，`stream` 可以与 lambda foreach 循环结合使用，将增强型\
    \ for 循环简化为以下语句：\n\n```\ncollection_name.stream().forEach((object) -> {\n  statement;\n\
    })\n```\n\n`ArrayList` 等集合现在可以使用 `stream` 方法配合 `forEach` 语句来处理它们的集合。数组是相同类型对象的集合（例如从\
    \ 1 到 10 的一组整数），而 `arraylist` 是相同类型对象的集合。我们将在本章的 5.7 节和本书第七章的 7.8b 节讨论这一点。下面的程序列表\
    \ 5.3 演示了通过将数组转换为 arraylist，然后使用 `forEach` 功能 lambda 表达式列出数组的内容。\n\n```java\n\
    import java.util.Arrays;\nimport java.util.ArrayList;\n\npublic class FilterLoop\n\
    {\n  public static void main(String[] args){\n    // 声明并初始化一个包含奇数的 arraylist 计数器\n\
    \    ArrayList<Integer> counter = new ArrayList<Integer>(Arrays.asList(1,3,5,7,9));\n\
    \    System.out.println(\"\\n A list of Odd numbers: \");\n    // 使用 forEach 内联语句打印出奇数列表\n\
    \    counter.stream().forEach((num) -> System.out.println(num));\n  }\n}\n```\n\
    \n"
