    \ `MobilePhone` 类中有两个构造函数，编译器只会执行无参数的那个，即默认构造函数。\n\n## 4.4 super 和 this 关键字\n\n\
    `super` 关键字用于引用父类并执行父类函数。例如，你可以使用以下语句执行带有参数的 `MobilePhone` 类第二个构造函数：\n\n```java\n\
    \npublic SmartPhonePhone\n\n    super(\"Nokiaokia\");\n    textMessage= \" \"\
    ;\n    model= \" \";\n    }\n```\n\n你现在可以使用 `super` 来访问 `SmartPhone` 类中的父类方法，如下：\n\
    \n```java\n  public String get getModel(\n        return super..\n\n  }\n```\n\
    \n`this` 用于类对象，如下：\n\n```java\n     SmartPhone(\n    super(\"Blackberry Old\"\
    );\n    textMessage= \" \";\n    model= \" \";\n  }\n```\n\n参数构造函数 `SmartPhone(String\
    \ nmodel)` 中的语句 `this();` 指向当前类的无参数构造函数 `SmartPhone()`。因此，该构造函数会在参数构造函数的体之前执行。请注意，如果你打算使用\
    \ `this` 和 `super` 关键字来执行构造函数，它们必须是你在构造函数中写的第一个语句，以确保默认和基构造函数在任何其他构造函数之前执行。\n\n"
