    previously stated. The compiler would issue an error message “method does not
    override or implement a method from a super type”. More importantly if you changed
    the parent class later the compiler ensures that you also update the overridden
    method in the sub class too. Therefore the “@override” method modifier should
    be used in the following cases:


    a) When a method in a subclass overrides a method in the parent class


    b) When a class implements an interface and implements the virtual interface’s
    method


    c) When a class extends an abstract class and implements its abstract method


    d) When a sub interface extends another interface


