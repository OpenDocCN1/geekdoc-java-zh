- "# Java 8：Java 基础与 Java 8 初学者指南\n\n\n\n![](img/00041.jpeg)\n\n\n\n\n## 致谢\n\n我要特别感谢我亲爱的妻子\
  \ Omolabake，感谢她的坚实支持；同时也感谢所有在本书创作过程中提供巨大帮助的人们，并感谢多年来一直忠诚的读者们。这本书是我对这种坚定不移的支持的感激。\n\
  \n向大家表示感谢。\n\n\n\n\n\n\n\n\n## 献词\n\n本书首先献给全能的神，万物的施予者，他赋予我创作的灵感，并承诺如果我继续努力，他将为我推开那沉重的石头。其次，献给每一个相信知识就是光、相信有了知识黑暗就会消散、真光将穿透出来的人。\n\
  \n- 第 6 章\n    - 程序选择语句\n    - 6.1 if 语句\n    - 6.2 if else 语句\n    - 6.3 三元运算符\n\
  \    - 6.4 else if 语句\n    - 6.5 Switch 语句\n- 第 7 章\n    - 数组、ArrayList 和并行排序\n\
  \    - 7.1 数组声明\n    - 7.2 数组赋值\n    - 7.3 多维数组\n    - 7.4 增强型 For 循环\n    - 7.5\
  \ 数组排序\n    - 7.5b 并行排序\n    - 7.6 数组复制\n    - 7.7 ArrayList\n    - 7.8a ArrayList\
  \ 赋值和增强型 for 循环\n    - 7.8b 使用 Lambda 迭代 ArrayList\n    - 7.9 删除数组列表元素\n    - 7.10\
  \ Iterator 接口\n- 第 8 章\n    - 字符串与正则表达式\n    - 8.1 String 类方法\n    - 8.2 正则表达式\n\
  \    - 8.3 正则表达式构造\n    - 8.4 正则表达式应用\n- 第 9 章\n    - 异常处理\n\n\n\n\n\n## 9.1 `try..catch`\
  \ 语句模型\n## 9.2 异常处理的好处\n## 9.3 在 Catch 语句中捕获两个或多个异常\n# 9.4 异常层次\n\n# 第 10 章 XML\
  \ 处理\n## 10.1 使用 Java 创建 XML\n## 10.2 使用 Java 读取 XML\n\n# 第 11 章 Java Applets\n\
  ## 11.1 Applet 元素\n## 11.2 Applet 的结构\n## 11.3 示例 Applet\n\n# 结论\n\n# 引言\n\n这是一本特殊的\
  \ Java 书。它的目标是通过通简单的语言解释面向对象编程概念，消除新 Java 程序员通常会对 Java 编程的恐惧；为深入且轻松地理解软件设计开发中的设计模式理论打下坚实的基础，最终目标是传承持久的\
  \ Java 遗产；同时，通过与核心 Java API 交互，尽可能避免版本狂热症，只讨论与开发者相关的必要新增，并展示这些新增是如何变得必要的以及它们的应用。\n\
  \n万变皆变，其道不变。虽然在 Java 中事物几乎没有变化，但新功能总是层出不断（版本狂热）。最新的新增是由于多核计算机的发展（双核甚至四核）所需的，这使得改进核心\
  \ API 变得至关重要，从而产生了带有 lambda 表达式的更智能的 Java 代码，以便它们可以在多个处理器上运行，节省时间并提高效率。这导致了书中介绍的\
  \ Java 8 的问世。尽管如此，这本书将将保持常青，并成为一本可以一直作为参考指南的宝书。\n\n在此刻，我想第一个祝贺你发现了这本书，因为作为一名认证的软件开发人员和微软认证技术专家，我非常乐意与你分享我对编程、尤其是对\
  \ Java 编程的热爱。请关注我，先不要急着丢掉移动设备，因为这是一个非常特别的开始。\n\n谢谢。\n\n# 第 1 章：Java 编程简介\n\n回到 20\
  \ 世纪 90 年代初，在 Sun Microsystems 工作的 James Gosling 被要求开发一种更好、更易移植的编程语言，这种语言在内存管理和系统移植性方面要优于\
  \ C++，用于嵌入式系统的开发。\n\nJames 改进了 C++ 在内存管理方面的缺点，通过垃圾回收（将不再使用的内存槽返回给系统）以及通过他开发的新编程语言\
  \ Oak 引入虚拟机，使嵌入式系统的平台独立性成为可能。\n\nOak 在 1994 年很快被发现是 Web 应用开发的完美工具，并被更名为 HotJava，最终在明年（1995\
  \ 年），HotJava 被更名为 Java。1996 年，第一个 Java 编译器发布，从那以后，Java 变得无处不在，在互联网上和世界各地。\n\n非常感谢\
  \ James Gosling 和 Sun Microsystems，他们一直支持 Java 直现在。你可以访问 sun 的网站获取最新版本的 Java 开发工具，：`http://java.sun.com`。\n\
  \n## 1.2 Java 变体（应用程序、applets 和 servlets）\n\nJava 有三种变体：应用程序、applets 和 servlets。下面列举如下：\n\
  \n### 1.2.1 Java 应用程序\n\nJava 应用程序是嵌入在消费电子设备（如相机、微波炉、电视机）中的 Java 程序，以及通过计算机命令提示符执行的\
  \ Java 程序（仅举例）。你可以通过在记事本等文本编辑器中编写 `java class`，并以类名命名、扩展名为 `.java` 保存到计算机系统中的任意目录来开发\
  \ Java 应用程序。前提是你已经在计算机上下载并安装了 `jdk`（Java 开发工具包）。稍后详细介绍。\n\n### 1.2.2 Java Applets\n\
  \nJava applets 是嵌入在 Web 文（超文本标记文档，如 `HTML5`）`applet` 标签中的 Java 程序。你可以通过在记事本等文本编辑器中编写\
  \ `java class`，并以类名命名、扩展名为 `.java` 保存到计算机系统中的任意目录来开发 Java 应用程序。前提是你已经在计算机上下载并安装了\
  \ `jdk`（Java 开发工具包）。稍后详细介绍。\n\n### 1.2.3 Java Servlets\n\nJava servlets 是基于 Web\
  \ 的 Java 程序版本。\n\n## 1.3 Java API（应用程序编程接口）和 JDK\n\n应用程序编程接口是一组称为库的成品工具，可以执行如 `java.lang`\
  \ 等某些操作。要了解更多关于 Java API 的信息，请访问链接 `docs.oracle.com/javase/8/api/index.html`\n\n\
  ## 1.4 下载和安装 Java 工具\n\n在书中，我们将从 Java 应用程序开始，平稳过渡到基础概念和 Java 8 对 applet 的新增，最后总结于\
  \ servlets 的开发和应用。Java Netbeans 是一个集成开发环境，用于开发 Java 应用程序、applets 和 servlets。\n\n\
  ### 1.4.1 下载和安装 Java 开发包\n\n可以通过访问链接下载 Java 开发包：`http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html`。下载最新版本的\
  \ `jdk`。要获取完整的 Java 开发工具，将 `jdk` 下载到你的计算机并运行可执行文件将其安装在机器上。安装后，你需要为命令行工具设置路径，以便操作系统在调用它们时能找到它们。你可以通过以下步骤实现：\n\
  \n步骤 1：如果可用，右键点击桌面上的“电脑”图标；如果没有，则左点击开始菜单并右键点击“电脑”。\n\n步骤 2：在弹出的菜单中，左点击“属性”菜单。\n\n\
  步骤 3：在弹出的系统页面板中，左点击“高级系统设置”。\n\n步骤 4：在弹出的系统属性窗口中点击“环境变量”按钮。\n\n步骤 5：在弹出的“环境变量”对话框中，向下滚动“系统变量”列表，并选择“变量”列下的\
  \ `path`。\n\n步骤 6：点击弹出的“编辑系统变量”对话框中的“编辑”按钮，将光标移动到内容的末尾，输入你的 jdk bin 文件夹路径，首先输入一个分号以将要添加的路径与列表中的最后一个路径隔开，如下所示：\n\
  \n```\n%\\system32\\windowsPowerShell\\V1.0\\;c\\program files\\java\\jdk1.8.0_51\\\
  bin\n```\n\n步骤 7：点击“编辑系统变量”对话框的确定按钮。\n\n步骤 8：\n\n\n\n\n\n点击“环境变量”对话框的确定按钮。\n\n###\
  \ 第 9 步\n点击“系统属性”弹出框的确定按钮以最终设置路径。\n\n### 第 10 步\n你可以通过在提示符中运行下面的 `set path` 命令来确认路径已成功设置：\n\
  \n```cmd\nC:\\> set path\n```\n\n在提示符中运行此命令的输出应如下图 1.1 所示：\n\n![](img/00001.jpeg)\n\
  \n图 1.1. 在命令提示符中运行 `set path` 命令的输出。\n\n你应该能在路径列表中看到你的 jdk 路径。如果没有，请关闭 `cmd` 窗口并重新打开。\n\
  \n### 1.4.2 下载并安装 Java Netbeans IDE 开发工具\n\n要下载 Netbeans IDE，请访问链接 [`www.netbeans.org/downloads/index.html`](http://www.netbeans.org/downloads/index.html)\
  \ 并下载最新版本。下载完成后，将其安装到你的电脑上。使用 Netbeans 集成开发环境处理 `java` 数据库会方便得多，稍后会详细介绍。你现在已经准备好进行书中的练习了，现在可以休息一下，等准备好后一起开始这段旅程。\n\
  \n# 第 2 章\n\n# Java 数据类型与运算符\n\nJava 作为一种面向对象的编程语言，拥有自己的数据类型和运算符，这些有助于创建表达式、类以及类成员变量和方法的访问修饰符。由于\
  \ `java` 程序的构建模块是类，而类是感兴趣对象的定义，类离不开基本数据类型，基本数据类型也有它们自己的包装类。因此，我们本章从基本数据类型的描述开始。\n\
  \n## 2.1 基本数据类型\n\n基本数据类型是 `java` 内置的数据类型，编译器无需引用核心应用程序编程接口（API）中的任何包即可识别。它们被分为三个子集：数值型、字符型布尔型。表\
  \ 2.1 列出了基本数据类型及其描述。\n\n| 基本数据类型 | 大小 | 描述 |\n| :--- | :--- | :--- |\n| `int` |\
  \ 32 位 | 整数常量，由一个或多个数字组成。如果前面有负号，它可以可以是正数也可以是负数。它的范围是 -2147483648 到 2147483647 |\n\
  | `short` | 16 位 | 短整数，占据整数常量存储大小的一半。它表示的范围是 -32768 到 32767 |\n| `long` | 64 位 |\
  \ 具有扩展精度的长整数常量，占据整数存储大小的两倍 |\n| `byte` | 8 位 | 极小的整数常量，精度范围限制在 -128 到 127 之间 |\n\
  | `float` | 32 位 | 带有小数点的值，例如 8.0, 1.23 |\n| `double` | 64 位 | 浮点类型，可以存储是 `float`\
  \ 类型两倍的值 |\n| `boolean` | | 持有“true”（真）或“false”（假）值的变量类型 |\n| `char` | 16 位 | 保存单个字符的变量类型\
  \ |\n\n表 2.1 数值型基本数据类型。\n\n## 2.2 基本数据类型的包装类\n\n值得提到，上述描述的基本数据类型在核心 API 的 `java.lang`\
  \ 包中也有对应的类定义。我们称这些类为包装类。目的是让基本类表现得像对象，并与 Java 编程的基础理念保持一致。表 2.2 列出了基本数据类型及其对应的包装类。\n\
  \n| 数值型基本数据类型 | 对应的包装类 |\n| :--- | :--- |\n| `int` | `Integer` |\n| `byte` | `Byte`\
  \ |\n| `short` | `Short` |\n| `long` | `Long` |\n| `float` | `Float` |\n| `double`\
  \ | `Double` |\n| `boolean` | `Boolean` |\n| `char` | `Character` |\n\n表 2.2 数值型基本数据类型。\n\
  \n\n\n\n\n| 常量变量 | 常量变量名称的每个字母都应该大写，单词之间用下划线分隔 | `LAST_MONTH` |\n| :--- | :--- |\
  \ :--- |\n| 类 | 类名的每个首字母都要大写。类名最好是名词。请避免使用 API 类名 | `ScrewDriver` |\n\n表 2.3. 标识符命名规范。\n\
  \n## 2.7 Java 运算符与表达式\n\n运算符是 `java` 表达式的构建块，表达式始终以分号结束。运算符类型包括一元运算符、二元运算符、赋值运算符、关系运算符逻辑运算符。我们将从运算符开始。\n\
  \n### 2.7.1 赋值运算符 (`=`)\n\n赋值运算符是所有编程语言中非常常用的运算符。它用于在 `java` 编程中为变量赋值。其用法语法如下所示：\n\
  \n```\nVariable_name = some_value;\n```\n\n例如，在 java 编程中，将数值 `7` 赋值给变量 `monthJuly`，可以使用以下程序语句：\n\
  \n```\nmonthJuly = 7;\n```\n\n但必须注意的是，java 编程中有两种赋值操作：值赋值和引用赋值。值赋值在前面已经解释过。引用赋值是指将内存位置的地址赋值给变量而不是真实值。当将对象或字符串赋值给变量名时，就会发生这种情况，如下所示：\n\
  \n```\nmyName = “Feyisayo Dosunmu”;\n```\n\n### 2.7.2 一元运算符\n\n一元运算符作用于单个操作数。它们是递减、递增和否定运算符。递增运算符的符号是双加号\
  \ (`++`)，其用法语法如下：\n\n```\n++variable_name;\n```\n\n递减运算符的符号是双减号 (`--`），其用法语法同样如下：\n\
  \n```\n--variable_name;\n```\n\n否定运算符的符号是减号 (`-`)，它根据变量的初始符号反转值的符号。相乘规则所示：\n\na)\
  \ `- * - = +`\n\nb) `- * + = -`\n\nc) `+ * - = -`\n\nd) `+ * + =+`\n\n根据上述符号相乘规则，在负值上应用否定运算符将得到正值，在正值上应用否定运算符将得到负值。以下程序列表\
  \ 2.1 展示了一元运算符和赋值运算符的使用。\n\n程序列表 2.1：\n\n```\npublic class UnaryOperators {\n  public\
  \ static void main(String[] args){\n  int monthJuly, monthValue, followingMonth,\
  \ prevMonth;\n  monthJuly = 7;\n  monthValue = monthJuly;\n  followingMonth = (++monthValue);\n\
  \  monthValue = monthJuly;\n  prevMonth = (--monthValue);\n    System.out.println(\"\
  \\n\" );\n    System.out.println(\"The Month of June is the \" + prevMonth + \"\
  th month of the year. \\n\" );\n    System.out.println(\"The Month of July is the\
  \ \" + monthJuly + \"th month of the year. \\n\" );\n    System.out.println(\"The\
  \ Month of August is the \" + followingMonth + \"th month of the year. \\n\" );\n\
  \  }\n}\n```\n\n要运行上面的程序列表 2.1，请按照之前的建议下载 Java 开发工具包，并按照本书第 1.4.1 节列出的步骤设置操作系统路径。你可以在文本编辑器中输入代码，并使用类名存储在计算机的任何选择目录下，但扩展名为\
  \ `.java` (`UnaryOperators.java`)。接下来，切换到命令行将代码编译为 java 字节码（在 Windows 中通过选择开始菜单、所有程序、附件、运行，并在打开的文本字段中输入\
  \ `cmd` 并点击确定）。在命令行窗口中使用 `cd` 命令切换到程序源码目录 (`cd\\program_folder_path`)，然后在提示符处输入以下\
  \ java 命令：\n\n```\nProgram_folder> javac UnaryOperators.java\n```\n\n如果程序编译成功，将不会收到任何错误信息；如果有任何错误信息，请检查输入的代码，修正拼写错误并重试。编译完成后，你可以在提示符处输入以下\
  \ java 命令运行字节码：\n\n```\nProgram_folder> Java UnaryOperators\n```\n\n如下图 2.1 所示，图中包含了上述程序列表\
  \ 2.1 的输出：\n\n![](img/00002.jpeg)\n\n图 2.1. 程序列表 2.1 的输出。\n\n该应用通过将变量 `monthJuly`、`monthValue`、`followingMonth`\
  \ 和 `prevMonth` 声明为整数开始。接着它将 `monthJuly` 的值拷贝到 `monthValue`，因为递增和递减运算符的效果是真实的，通过此我们可以使用\
  \ `monthJuly` 的值重新初始化 `monthValue` 的值。\n\n### 2.7.3 二元算术运算符\n\n二元运算符同时处理两个操作数。它们是下面列举的加、减、乘、除和取模运算符：\n\
  \n#### 算术加法二元运算符 (`+`)\n\n加法二元运算符用加号表示。它将数值或数值变量的内容相加。java 编程中的用法语法如下所示：\n\n```\n\
  result = value1 + value2;\n```\n\n#### 算术乘法二元运算符 (`*`)\n\n乘法二元运算符在大多数编程语言中用星号表示。它将两个数值或数值变量相乘。用法语法如下：\n\
  \n```\nresult = value1 * value2;\n```\n\n#### 算术减法二元运算符 (`-`)\n\n减法二元运算符作用于两个操作数。它返回左侧数值或内容减去右侧数值或内容的结果。用法语法如下：\n\
  \n```\nresult = value1 - value2;\n```\n\n#### 算术除法二元运算符 (`/`)\n\n除法二元运算符也作用于两个操作数，在大多数语言中用斜杠表示。它返回分子（左侧）除以分母（右侧）的结果。用法语法如下：\n\
  \n```\nresult = value1 / value2;\n```\n\n#### 算术取模二元运算符 (`%`)\n\n取模二元运算符作用于两个数值操作数，包括\
  \ java 在内的大多数语言中用百分号表示。它返回普通除法的余数。用法语法如下：\n\n```\nresult = value1 % value2;\n```\n\
  \n程序列表 2.2 展示了前面过的过的算术运算符的应用。\n\n程序列表 2.2\n\n```\npublic class BinaryOperators\n\
  {\n  public static void main(String[] args){\n  float result, leftOperand, rightOperand;\n\
  \  leftOperand = 68;\n  rightOperand = 10;\n    System.out.println(\"\\n\" );\n\
  \    result = leftOperand + rightOperand;\n    System.out.println( leftOperand +\
  \ \" + \" + rightOperand + \" = \" + result);\n    result = leftOperand - rightOperand;\n\
  \    System.out.println( leftOperand + \" - \" + rightOperand + \" = \" + result);\n\
  \    result = leftOperand * rightOperand;\n    System.out.println( leftOperand +\
  \ \" * \" + rightOperand + \" = \" + result);\n    result = leftOperand / rightOperand;\n\
  \    System.out.println( leftOperand + \" / \" + rightOperand + \" = \" + result);\n\
  \    result = leftOperand % rightOperand;\n    System.out.println( leftOperand +\
  \ \" % \" + rightOperand + \" = \" + result);\n  }\n}\n```\n\n上述程序列表 2.2 的输出在下方的图\
  \ 2.2 中：\n\n![](img/00003.jpeg)\n\n图 2.2. 程序列表 2.2 的输出。\n\n\n\n\n\n关系运算符在某种程度上类似于二元运算符，因为它们也同时作用于两个操作数，不同在于它们被用于测试受影响的操作数中是否存在某些条件。可用的关系运算符及其解释如表\
  \ 2.4 所示：\n\n| 关系运算符 | 解释 | 使用语法 |\n| :--- | :--- | :--- |\n| == | 等于 | `a == b`\
  \ |\n| != | 不等于 | `a != b` |\n| < | 小于 | `a < b` |\n| > | 大于 | `a > b` |\n| <= |\
  \ 小于等于 | `a <= b` |\n| >= | 大于等于 | `a >= b` |\n\n表 2.4 关系运算符及其解释。\n\n关系运算符通常用于为条件语句创建测试表达式，例如稍后将讨论的“if”语句和“while”语句。关系运算符的优先级低于算术运算符。例如，\n\
  \n```\nsum < value1 * value2\n```\n\n编译器将对其求值为：\n\n```\nsum < (value1 * value2)\n\
  ```\n\n## 2.8 Lambda 间接运算符 (->)\n\n新引入的 lambda 间接运算符看起来非常像经典的 C/C++ 编程指针运算符，它执行的操作与赋值运算符\
  \ (=) 非常相似。例如，以下表达式；\n\n```\ny -> y * y\n```\n\n它获取左侧变量 `y` 的内容，按照间接运算符右侧的指示与其自身相乘并返回结果。关于此点的更多信息，请参本书的第四章，将在“面向对象编程”标题下讨论接口的概念。\n\
  \n# 第 3 章：Java 类、对象和访问修饰符\n\nJava 作为一种面向对象的编程语言，其基本构建单元是对象。这就是为什么深入理解 Java 类和对象对于理解和掌握\
  \ Java 编程至关重要的原因。\n\n对象是类的实例，而类是对一个地方、事物或概念的定义。在面向对象编程的术语中，类通常是一个名词。\n\n## 3.1 类定义\n\
  \n类定义由成员变量和带有可选访问修饰符的成员方法组成。它还可以包括用于类初始化的构造函数。类定义的通用语法如下：\n\n```java\n[访问修饰符] class\
  \ 类名 {\n    [访问修饰符] 数据类型 成员变量-1;\n    [访问修饰符] 数据类型 成员变量-2;\n    [访问修饰符] 类名( ){ \
  \ //类构造函数\n        //类构造函数体\n    }\n    [访问修饰符] 类方法-1( ){  //类方法\n        //类方法体\n\
  \    }\n}\n```\n\n类成员变量和方法的访问修饰符的使用是可选的，主方法除外，主方法必须具有 `public` 访问修饰符，以便机器在执行时访问它。然而，任何没有访问修饰符的成员函数或变量将自动分配一个默认访问修饰符。Java\
  \ 中有七种主要的访问修饰符，尽管随着时间的推移，你将了解到更多修饰符。接下来，我们将讨论并描述这些主要访问修饰符的使用。\n\n## 3.2 访问修饰符\n\n\
  七种主要的访问修饰符如下：`public`、`private`、`protected`、`private protected`、`abstract`、`static`\
  \ 和 `final`。它们应用于类、类成员变量和方法。例如，为对象 `book` 定义一个类，类定义可以如下所示：\n\n```java\nclass Book{\n\
  \    private String bookTitle, bookAuthors;\n    private int noOfPages;\n    public\
  \ Book(String booktitle, String bookAuthors, int pages ){\n      bookTitle= booktitle;\n\
  \      bookAuthors= bookAuthors;\n      noOfPages= pages;\n    }\n}\n```\n\n在这里，`Book`\
  \ 类没有访问修饰符，因此编译器为它分配了一个默认修饰符，且默认修饰符没有关键字。这意味着该类仅对同一包或相同目录下的其他类可见。该类有一个公共的构造函数，带有参数\
  \ `bookTitles`、`bookAuthors` 和 `pages`，用于在声明书籍对象时初始化带有 `private` 访问修饰符的私有成员变量。\n\
  \n类可以有多个构造函数，只要它们的签名不同即可，这一概念在面向对象编程中被称为**多态性**，因此，还可以为该类编写另一个没有参数列表的公共类构造函数，如下所示：\n\
  \n```java\n    public Book( ){\n      bookTitle=\"No title yet\";\n      bookAuthors=\
  \ \"No author yet\";\n      noOfPages= 0;\n    }\n```\n\n默认类的公共成员对同一包中的其他类可见，因此为构造函数提供了\
  \ `public` 访问修饰符，以便访问同一包内的所有其他类。构造函数的作用是帮助在声明时初始化类成员变量。你不必为类提供构造函数，如果不提供，编译器将提供一个默认的，但自己编写一个是一个良好的习惯，以便将控制权掌握在手中，因为如果不这样做，在类成员变量不是原始类型的情况下，编译器会将变量设为\
  \ `null` 而不是初始化它。\n\n带有 `private` 访问修饰符的私有成员变量 `bookTitle`、`bookAuthors`、`noOfPages`\
  \ 除了声明类本身（`Book`）之外，任何类无法访问。因此，需要提供公共访问方法 `getBookTitle()` 和 `getBookAuthors()`\
  \ 来帮助检索这些信息。这些方法可以如下所示编写：\n\n```java\n    public String getBookTitle( ){\n     \
  \ return bookTitle;\n    }\n    public String getBookAuthors( ){\n      return bookAuthors;\n\
  \    }\n```\n\n上述 Java 代码定义了返回字符串对象的给调用方法的公共方法。这只是访问修饰符需求和功能的概述。接下来的章节将进一步阐述修饰符。\n\
  \n### 3.2.1 公共修饰符\n\n带有 `public` 访问修饰符的类（公共类）对所有其他类可见。因此，文件中只能有一个公共类，它作为执行应用程序的唯一入口和起点。如前所述，没有访问修饰符的类不是公共类，而是默认类，仅对同一包中的类可见。例如，为书籍对象定义一个公共类，类定义可以如下所示：\n\
  \n```java\npublic class BookLibrary\n{\n  public static void main(String[] args){\n\
  \    Book myBook = new Book(\"Java Programming\", \"Feyisayo Dosunmu\", 312);\n\
  \  }\n}\n```\n\n公共类 `BookLibrary` 使用语句声明了一个类型为 `Book` 的对象 `myBook`：\n\n```\nBook\
  \ myBook = new Book(\"Java Programming\", \"Feyisayo Dosunmu\", 312);\n```\n\n记住\
  \ `Book` 类是一个默认类，它可以与 `BookLibrary` 类存储在同一个文件中，现在编译器要在唯一的公共类 `BookLibrary` 中查找 `static\
  \ main` 方法。\n\n### 3.2.2 私有修饰符\n\n`private` 访问修饰符可以应用于类成员变量和方法。私有成员和方法仅供其类成员访问，同一包内的其他类和子类无法访问。例如，成员变量\
  \ `bookTitle`、`bookAuthors` 和 `noOfPages` 被设为 `Book` 类的私有，以确保良好的封装，因此使得同一包的其他类无法访问。完整的程序列表如下方的程序\
  \ 3.1 所示：\n\n程序 3.1\n\n```java\npublic class BookLibrary\n{\n  public static void\
  \ main(String[] args){\n    Book myBook = new Book(\"Java Programming\", \"Feyisayo\
  \ Dosunmu\", 312);\n    System.out.println(\"\\n\" );\n  }\n}\n```\n\n\n\n\n\n```java\n\
  System.out.println(\"The title of my book is \" + myBook.getBookTitle() );\n}\n\n\
  class Book{\n    private String bookTitle, bookAuthors;\n    private int noOfPages;\n\
  \n    public Book(String booktitle, String bookAuthors, int pages ){\n        bookTitle=\
  \ booktitle;\n        bookAuthors= bookAuthors;\n        noOfPages= pages;\n   \
  \ }\n\n    public Book( ){\n        bookTitle=\"No title yet\";\n        bookAuthors=\
  \ \"No author yet\";\n        noOfPages= 0;\n    }\n\n    public String getBookTitle(\
  \ ){\n        return bookTitle;\n    }\n\n    public String getBookAuthors( ){\n\
  \        return bookAuthors;\n    }\n} \n``` \n\n运行上述程序列表 3.1 的输出如附 3.1 所示：\n\n\
  ![](img/00004.jpeg)\n\n图 3.1 程序列表 3.1 的输出。\n\n### 3.2.3 访问修饰符\n\n`protected` 访问修饰符适用于类成员变量和方法。`protected`\
  \ 成员仅在其类层次结构内部可访问。也就是说，`protected` 类成员变量或方法可以通过同一包中的子类以及其他包中的子类进行访问。`protected`\
  \ 访问修饰符应用于设计用于被子类继承或重写的成员方法。\n\n### 3.2.4 私有保护修饰符\n\n`private` `protected` 类成员可以通过继承被其他包中的类访问。虽然\
  \ `private` `protected` 类成员可能无法被同一包中的任何其他非子类访问，但可以被同一包中的子类访问。\n\n### 3.2.5 默认访问修饰符\n\
  \n一个没有指定访问修饰符的类会被分配一个默认访问修饰符。请注意，默认修饰符没有表示它的关键字。默认访问修饰符只允许访问同一包中的其他类。\n\n### 3.2.6\
  \ 抽象修饰符\n\n使用 `abstract` 关键字修饰的类被称为 `abstract` 类，这意味着该类包含一个或多个未实现的方法。未实现的方法没有方法体，因此必须在子类中被重写，这更多内容将在本书后进行讨论。\n\
  \n### 3.2.7 静态修饰符\n\n使用 `static` 访问修饰符修饰的类成员仅属于类本身。它是唯一的，没有实例副本。通常，当从类创建实例对象时，对象将获得该类成员的副本。但如果使用\
  \ `static` 修饰符，该类成员变量只有一个副本。\n\n`static` 成员通过类名后接点运算符 `.` 来访问，并且可以在创建类对象之前进行访问。因此，`static`\
  \ 成员变量必须初始化（因为它们必须有值），且 `static` 方法必须被定义。成员方法和变量可以声明为 `static`。更重要的是，`static` 关键字不能在类方法中使用。\n\
  \n### 3.2.8 最终修饰符\n\n`final` 修饰符可以用于类、方法或成员变量，具有不同的含义，下文所示：\n\n#### a) 最终类\n\n当\
  \ `final` 关键字作为类修饰符使用时，使该类变得不可继承。其用法语法如下：\n\n```java\nfinal Book{\n    // 类体\n}\n\
  ```\n\n#### b) 最终方法\n\n使用 `final` 关键字修饰的方法不能通过继承或子类重写。其用法语法如下：\n\n```java\nclass\
  \ book {\n    final borrowBook( ){\n        // 方法体\n    }\n}\n```\n\n它的作用类似于 `private`\
  \ 访问修饰符。\n\n#### c) 最终变量\n\n使用 `final` 关键字修饰的变量变为常量，其值在初始化后无法更改或更新。其用法语法如下：\n\n\
  ```java\nfinal String bookTitle;\n```\n\n## 3.3 类对象\n\n对象是类的实例，具有以下特征：标识性、状态、类型和行为。这些特征在下文中将进一步解释：\n\
  \n### 3.3.1 对象的类型\n\n“对象（object）”是任何可以命名的事物的通用术语。因此，对象必须属于某个类别，该类别可以是一个概念（想法、知识或方法）、地点、一个物品、动物或人类。因此，我们说对象具有类型。由于对象总是属于某个类别，例如下面的\
  \ Java 代码在动物类别中创建了一个类型为 `birds` 的对象：\n\n```java\nBird sparrow = new Bird( );\n```\n\
  \n左侧的 `Bird` 将 `sparrow` 声明为 `Bird` 类型，右侧的 `new` 关键字为 `Bird` 类定义的 `Bird` 类型分配了所需的内存空间，并将内存地址分配给\
  \ `sparrow` 对象。要使用上述语句，你必须在程序的其他地方先创建了 `Bird` 类，该类的形式如下所示：\n\n```java\nclass Bird{\n\
  \    private int flightStatus;\n    public Bird( ){\n        flightStatus= 0;\n\
  \    }\n    void setFlightStatus(int flightHieght ){\n        flightStatus = flightHieght;\n\
  \    }\n    int tellHeight( ){\n        return flightStatus;\n    }\n}\n```\n\n\
  ### 3.3.2 对象的状态\n\n对象具有属性，可以是颜色、重量、位置或大小。对象的状态是一个可以测量的属性，该属性的值决定了对象在任何时刻的状态。例如，可以使用\
  \ `flightStatus` 来判断它是处于飞行状态（当 `flightStatus` 大于 0 时）还是栖息状态（当 `flightStatus` 为 0\
  \ 时）。\n\n### 3.3.3 对象的标识性\n\n对象保持一个唯一的标识，并与相似的对象不同。例如，只要之前的对象仍在在使用，在同一个代码块中无法创建另一个对象，但可以创建相似类型的对象。因此，以下语句是合法的：\n\
  \n```java\nBird sparrow2 = new Bird( );\neagle = new Bird( );\n```\n\n### 3.3.4\
  \ 对象的行为\n\n由于鸟和飞机等对象可以飞行，机器人和摄像头可以移动，而鱼和潜艇可以游泳，因此行为与其类型紧密相关。这些方法通常以动词（动作词）命名。例如，该类的\
  \ `setFlightStatus()` 方法是该类别中所有对象的通用行为，因为鸟可能会决定飞向高空，或栖息在海平面某处。下面的程序列表 3.1 让这一概念生动起来。\n\
  \n```java\nimport javax.swing.JOptionPane;\n\npublic class BirdObject{\n    public\
  \ static void main(String[] args){\n        Bird eagle = new Bird( );\n        /*\
  \ 使用导入的 JOptionPane 类的方法读取高度值 */\n        String m = JOptionPane.showInputDialog(\"\
  Enter a height in figure \");\n        /* 使用 setFlightStatus 方法设置鹰的飞行行为 */\n   \
  \     eagle.setFlightStatus(Integer.parseInt(m));\n        System.out.println(\"\
  \\n\" );\n        if(eagle.tellHeight() > 0 )\n            System.out.println(\"\
  Eagle is in flight mode. );\n        else\n            System.out.println(\"Eagle\
  \ has perched. \" );\n    }\n}\n```\n\n\n\n\n\n![](img/00005.jpeg)\n\n图 3.1 程序列表\
  \ 3.1 JOption 输入面板。\n\n![](img/00006.jpeg)\n\n图 3.2. 程序列表 3.1 的输出。\n\n程序列表 3.1 通过导入\
  \ `JOptionPane` 类开始，以便能够使用“JOptionPane”输入方法 `showInputDialog()`，这将使我们在程序后部分能够输入一个表示鸟类海拔高度的数字。此操作有助于我们更改对象（`eagle`）的飞行状态。`import`\
  \ 关键字帮助我们导入可能需要的称为应用程序编程接口（`API`）的工具类和包，而且这类有很多。我们可用的有 `input`、`maths`、`string`\
  \ 等，如需查看 `core API` 类的完整文档，请访问以下链接：[`docs.oracle.com/javase/8/docs/api/index.html`](http://docs.oracle.com/javase/8/docs/api/index.html)\n\
  \n接下来定义了一个 `public class BirdObject`，这是主类，并且一个 java 文件中只能有一个这样的类。\n\n`public class`\
  \ 是解释器将引用的内容，执行的起点始终是 `public class` 的 `static main` 函数。因此，每个 java 应用程序都必须有一个 `static\
  \ main` 函数，其签名如下所示：\n\n```java\npublic static void main(String[ ] args){ }\n```\n\
  \n`args` 字符串数组由命令行提示符提供的参数集（如果有的话）进行填充。创建一个对象 `eagle` 并调用一个输入对话框对象来获取高度信息，并此设置 `eagle`\
  \ 的状态。之后，我们就可以通过其行为方法 `tellFlightStatus()` 确定老鹰的飞行状态。要运行此应用程序，您需要将程序列表 3.1 复制到文本编辑器中保存为\
  \ `BirdObject.java`。如果您还没有下载并安装 Java 开发工具包（JDK），请参本书的第 1.4.1 节以获取如何下载、安装和设置 `JDK`\
  \ 路径的完整指南。\n\n## 3.4 使用 JDK 编译和运行应用程序\n\n`java` 命令行工具用于在命令行提示符中编译和运行您的 java 源代码。要将程序列表\
  \ 3.1 编译并运行成可任何 java 虚拟机执行的字节码，只需进入计算机的命令行提示符，使用 `cd`（更改目录）命令切换到保存程序文件的文件夹，并输入 `javac`\
  \ 命令，后接应用程序的文件名如下文所示：\n\n```bash\nC:\\users\\computer name> cd\\my_java_folder\n\
  C:\\my_java_folder>javac BirdOBject.java\n```\n\n这假设您的程序列表存储在 C 盘的 `my_java_folder`\
  \ 文件夹中。在输入 `javac` 命令后，如果编译成功，将不会显示任何内容，`BirdObject` 类的字节码将作为 `BirdObject.class`\
  \ 创建在目录中，现在可以使用任何安装了 java 虚拟机的机器执行它。\n\n## 3.5 运行 Java 类文件（字节码）\n\n可以使用 `java` 命令在任何\
  \ java 虚拟机上执行 java 类文件，使用 java 类名并省略 `.java` 后缀，如下所示：\n\n```bash\nC:\\my_java_folder>java\
  \ BirdObjects\n```\n\n执行的预期输出如图 3.2 所示。请注意，输出中使用的目录路径与解释中使用的路径不同。这是为了让您知道，只要在切换到源代码目录后应用\
  \ `javac` 和 `java` 命令，您可以自由地将源代码保存在选择的任何目录中，一切正常。\n\n## 3.6 在运行时返回类参数名\n\n编程语言中有两种参数传递技术：位置参数传递——根据参数在参数列表中的位置来接收参数；以及命名参数传递——将键值对传递给接收的方法或函数。\n\
  \nJava 使用位置参数传递技术，当与其它命名编程语言进行交互时，这通常会成为一个挑战，因为在早期的 java 版本（包括 java 7）中没有检索类参数名的标准方法。这在\
  \ java 8 中得到了处理，通过在核心反射包中添加 `Parameter` 类，使得通过类构造器方法更容易地返回类参数名。因此，要使用参数类，您需要使用以下语句导入该类：\n\
  \n```java\nimport java.lang.reflect.Parameter;\n```\n\n您还可以通过以下导入语句导入 `Method` 类的父类\
  \ `Executable`，以便获取参数对象数组：\n\n```java\nimport java.lang.reflect.Executable;\n```\n\
  \n有了这些添加，现在可以在 java 8 中访问类参数名了。实现方式如下所示程序列表 3.2 所示。请享受。\n\n程序列表 3.2：\n\n```java\n\
  import java.lang.reflect.Parameter;\nimport java.lang.reflect.Executable;\n\npublic\
  \ class Courier {\n  public static void main(String[] args){\n    Letter myLetter\
  \ = new Letter(\"London\", \"United State\", \"intransit\" );\n    myLetter.TellParameterNames(\
  \ );\n  }\n}\n\nclass Letter{\n  private String deliveryAddr, senderAddr, status;\n\
  \  public Letter( ){\n    deliveryAddr= \" \";\n    senderAddr= \" \";\n    status=\
  \ \" \";   \n  }\n  public Letter(String addr, String sender, String stat ){\n \
  \   deliveryAddr= addr;\n    senderAddr= sender;\n    status= stat;\n  }\n  void\
  \ TellParameterNames( ){\n    Parameter[] letterParameters;\n    try{\n      letterParameters\
  \ = Letter.class.getConstructor(String.class, String.class, String.class).getParameters();\n\
  \      for(Parameter paraName : letterParameters){\n        if(paraName.isName()){\n\
  \          System.out.println(\"parameters\" +paraName.getName());\n        }\n\
  \      }\n    } catch(NoSuchMethodException | SecurityException e ){\n      System.out.println\
  \ (\"Exception\");\n    }\n  }\n}\n```\n\n程序列表 3.2 的输出如下所示：\n\n```\nParameters deliveryAddr\n\
  Parameters senderAddr\nParameters status\n```\n\n为了获得此输出，您需要在命令行提示符中使用 –parameters\
  \ 选项编译程序：\n\n```bash\nC:\\java_codes> javac –parameters Courier.java\n```\n\n话此此。我们来到了另一个有趣的章节。接下来的章节将更有趣，因为它将更多地讨论对象行为的概念，即面向对象编程。在那里见。感谢关注。\n\
  \n# 第 4 章\n\n# 面向对象编程与默认接口方法\n\n面向对象编程概念增强了代码的可用性、可读性和程序的可维护性。面向对象的程序员编写的代码更少，需要记忆的方法也少。面向对象编程的核心概念是对象继承、抽象类、接口和方法重载共同工作，使得多态成为可能。多态方法和函数可以接受父类的任何参数类型并按预期执行。我们从继承概念开始开启面向对象世界的之旅。\n\
  \n## 4.1 类继承\n\n子类可以通过 `extends` 关键字从 java 中的父类继承成员函数（方法）和变量（属性）。继承的语法如下所示：\n\n\
  ```java\nclass SubclassClassName extends ParentClassName {\n  // Sub 类体\n}\n```\n\
  \n例如，子类 `SmartPhone` 可以继承父类 `MobilePhone`，其中 `MobilePhone` 类定义如下：\n\n```java\nclass\
  \ MobilePhone{\n  String textMessage, model;\n  public MobilePhone(String phoneModel\
  \ ){\n    textMessage= \" \";\n    model= phoneModel;\n  }\n  public MobilePhone(\
  \ ){\n    textMessage= \" \";\n    model= \"Nokia 310\";\n  }\n  public String getModel(\
  \ ){\n    return model;\n  }\n  public String getTextMessage( ){\n}\n```\n\n\n\n\
  ```java\n      return textMessage;\n\n    }\n\n    void receiveACall( ){\n     \
  \ System.out.println(\"Receiving a call.\" );\n    }\n\n    void makeACall( ){\n\
  \      System.out.println(\"Making a call.\" );\n    }\n\n    void receiveTextMessage(\
  \ ){\n      System.out.println(\"Receiving a text message.\" );\n    }\n\n    void\
  \ playAGame( ){\n      System.out.println(\"Playing a 2D game.\" );\n    }\n  }\n\
  ```\n\n子类 `SmartPhone` 通过以下 Java 代码继承了 `MobilePhone` 类（父类）的属性和方法：\n\n```java\nclass\
  \ SmartPhone extends MobilePhone {\n\n  String textMessage;\n  String model;\n \
  \ public SmartPhone( ){\n    super(\"Nokia Old\");\n    textMessage= \" \";\n  \
  \  model= \" \";\n    }\n\n  public SmartPhone(String nmodel ){\n    this( ); //调用\
  \ SmartPhone( ) 构造函数\n    model= nmodel;\n  }\n\n  @Override public String getModel(\
  \ ){\n    return model;\n  }\n\n  public String getOldModel( ){\n    return super.model;\n\
  \  }\n\n  @Override public String getTextMessage( ){\n    return textMessage;\n\
  \  }\n\n  @Override void playAGame( ){\n    System.out.println(\"Play a 2D or 3D\
  \ game.\" );\n  }\n\n  void browse( ){\n    System.out.println(\"Browsing the net.\"\
  \ );\n  }\n\n  void snapAPicture( ){\n    System.out.println(\"Taking a picture.\"\
  \ );\n  }\n\n  void scan_system( ){\n    System.out.println(\"Scanning phone for\
  \ possible damage.\" );\n  }\n}\n```\n\n现在，`SmartPhone` 类除了自身定义的方法外，还继承了其父类 `MobilePhone`\
  \ 的方法。智能手机对象将继承手机对象的所有属性，程序员不需要重新编写用于接收电话的 `receiveACall()`、用于打电话的 `makeACall()`、以及接收和发送短信的\
  \ `receiveTextMessage()` 和 `sendTextMessage()`，这些都是手机的基本功能。\n\n可以使用以下 Java 语句在任何智能手机上执行这些基础功能：\n\
  \n```java\nSmartPhone nokia = new SmartPhone( );\nnokia.makeACall();\n```\n\n程序语句\
  \ `nokia.makeACall();` 使用了父类 `MobilePhone` 中定义的基方法 `makeACall()`。这是由于这两个类之间的继承关系所实现的。子类也可以通过定义具有相同名的变量和方法来重写父类中的变量和方法。这被称为变量或方法重写。\n\
  \n## 4.2 变量和方法重写\n\n可以通过在子类中定义一个名称相似的成员变量来重写变量。在需要在子类中处理相似属性的情况下，这样做是必要的，因为类方法只能处理其所属类的成员变量或属性。\n\
  \n同样，可以通过在子类中定义一个名称相似的方法，并遵循以下函数重写（覆盖）规则来重写基类方法：\n\na) 子类必须继承自一个具有同名方法的父类\nb) 重写的方法签名与父类中要重写的方法签名相似\n\
  \n例如，父类 `MobilePhone` 的 `playAGame()` 方法在子类 `SmartPhone` 中通过定义具有相同签名的方法进行了重写，如下所示：\n\
  \n```java\n  @Override void playAGame( ){\n    System.out.println(\"Play a 2D or\
  \ 3D game.\" );\n  }\n```\n\n区别在于，`SmartPhone` 类的 `playAGame()` 方法在功能上优于 `MobilePhone`\
  \ 类，由于其卓越的用户界面和显示屏幕，它可以允许用户玩 2D 或 3D 。你会注意到方法修饰符 `@override`。`@override` 修饰符不是强制性的，但它有助于程序的可读性和编译器检查，因为你可以轻松看到父类中哪些方法被重写了，而且如果你错误地认为自己重写了某个方法但实际上并没有，编译器会快速提醒你。\n\
  \n`@override` 修饰符不是强制性的，但有助于程序的可读性和编译器检查，因为你可以轻松看到父类中哪些方法被重写了，而且如果你错误地认为自己重写了某个方法但实际上并没有，编译器会快速提醒你。\n\
  \n## 4.3 构造函数\n\n构造函数具有在声明时初始化成员变量的功能。它的定义方式与类相似，但它没有返回类型。该函数必须在声明时执行。\n\n你会注意到\
  \ `MobilePhone` 类中有两个构造函数，编译器只会执行无参数的那个，即默认构造函数。\n\n## 4.4 super 和 this 关键字\n\n\
