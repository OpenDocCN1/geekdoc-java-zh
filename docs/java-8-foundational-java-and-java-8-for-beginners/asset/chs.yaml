  \ Java 读取 XML 文档。\n\n## 10.2 使用 Java 读取 XML\n\n在 Java 中，可以使用 `DOM` 或 `SAX` 读取 XML\
  \ 文档。然而，`DOM` 要求将整个文档读取到计算机内存中，因此它是内存密集型的。而 `SAX` 每次只将一个元素读入内存，因此内存占用更少，可以处理任何长度的\
  \ XML 文档。出于这个原因，本书更倾向于并讨论 `SAX` 方法（考虑到书籍长度和其他因素）。\n\n开发 SAX 读器的理念是：SAX 暴露了一个名为 `contentHandler`\
  \ 的接口，并带有了一些实用的默认方法，如 `startDocument()`、`startElement()`、`endElement()` 和 `endDocument()`\
  \ 方法，正如方法名所示，它们用于触发文档开始、元素开始、元素结束和文档结束事件。这些方法的默认实现简单地什么都不做。\n\n因此，必须实现 `contentHandler()`\
  \ 接口并重写其必要方法以适应你的需求。在程序列表 10.3 中，通过 `Xmlhandler` 类实现了这一操作。接下来，类型为 `XmlReader` 的读者对象使用\
  \ SAX 和 `Xmlhandler` 对象来读取 XML 文件内容并将其打印到标准输出。其实就这么简单。请花时间仔细该程序列表。根据你的目的，列表的长度可以短也可以长。\n\
  \n程序列表 10.3 显示了如何使用上述 SAX 读取程序列表 10.2 创建的 XML 文档（`drinks.xml`）。\n\n程序列表 10.3：\n\n\
  ```java\npackage xmlapplication3;\n\nimport javax.xml.parsers.SAXParser;\nimport\
