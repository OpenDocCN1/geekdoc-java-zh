  ## 4.5 函数重载\n\n当编写了另一个名称相似但签名（signature）不同的函数时，该函数就被重载了，一个很好的例子是 `SmartPhone` 的构造函数。这两个构造函数的名称相似，但参数列表不同。第一个完全不接受任何参数，而第二个接受一个字符串参数（`nmodel`），编译器根据不同的签名知道应该调用哪一个构造函数。\n\
  \n## 4.6 抽象类\n\n抽象类是至少包含一个未实现方法（抽象方法）并带有 `abstract` 修饰符的类。抽象方法是一种没有实现但具有签名（方法名及其可选参数列表）的方法。下方的用法语法所示：\n\
  \n`public abstract method_name(optional parameter_list);`\n\n由于抽象类至少有一个抽象方法，因此无法创建此类类的实例。此类类仅适用于继承目的，子类必须继承并为所继承的抽象方法提供所需的实现，否则子类也将成为一个抽象类。抽象类的语法描述如下：\n\
  \n```java\nabstract class class_name{\n  public abstract method_name(optional parameter_list);\n\
  }\n```\n\n抽象方法被隐式声明为 `public`。\n\n\n\n类不继承接口，而是实现一个或多个接口。一个类一次只能继承一个类，这使得接口在应用中更具活性和多态性。根据标准，接口使用形容词形式命名，并使用\
  \ `interface` 关键字创建。如果接口存在成员变量，则被声明为 `public` 和 `static`，其成员方法默认声明为 `public` 和 `abstract`。总而言之，接口只能有常量、抽象方法和默认方法作为其成员变量和方法。创建的语法如下所示：\n\
  \n```java\ninterface interface_name{\n\nStatic variables ;\n\nabstract method declarations;\n\
  \ndefault method declaration;\n\n}\n```\n\n程序列表 4.3 演示了默认接口方法 `myMessage()` 的声明，并提供了该默认方法的默认实现，请享用。\n\
  \n程序列表 4.3：\n\n```java\npublic class FunctionalInterface\n{\n\n    public static\
  \ void main(String[] args){\n\n      Confidential toMum = new Confidential( );\n\
  \      MyMessage toCarthy = new MyMessage( );\n      System.out.println(\"\\n My\
  \ message to mum: \" + toMum.myMessage( ));\n      System.out.println(\"\\n My message\
  \ to Carthy: \" + toCarthy.myMessage( ));\n\n  }\n}\n\n//The Message interface\n\
  interface Messaging{\n\n  default String myMessage( ){\n\n    return \"Sorry, I\
  \ am out of the office at the moment.\";\n\n  }\n}\n\nclass MyMessage implements\
  \ Messaging {\n\n  //Fails to implement myMessage( ) interface  method.\n\n  }\n\
  class Confidential implements Messaging {\n\n    public String myMessage(){\n\n\
  \    return \"See you soon mum. Love you.\";\n\n  }\n}\n```\n\n接口使用 `interface`\
  \ 关键字定义。如果一个接口有一个默认方法，而实现类没有实现该默认方法，那么在实现类中调用该方法时，将执行该默认方法，如图 4.3 所示，下方程序列表 4.3\
  \ 的程序输出：\n\n![](img/00010.jpeg)\n\n图 4.3 上述程序列表 4.3 的输出。\n\n对 `Confidential` 类对象\
  \ `toMum` 的调用（该类实现了接口 `Messaging` 中的默认方法 `myMessage`）给妈妈提供了一个自定义消息。而对 `MyMessage`\
  \ 类对象 `toCarthy` 的类似调用（该类也实现了相同的接口，但与 `Confidential` 未实现其默认方法 `myMessage`）则产生了默认的离开消息。更高级的接口实现将在后续第\
  \ 4.8 节讨论。\n\n## 4.8 接口实现\n\n现在，为了给程序列表 4.1 中 `AutomaticVehicle` 和 `ManualVehicle`\
  \ 类中的通用方法名 `applyGear()` 定义一个接口，我们编写了以下 Java 代码：\n\n```java\ninterface AutoManual{\n\
  \n  public void operateGear(MotorVehicle motor);\n\n}\n```\n\n注意 `AutoManual` 接口中\
  \ `operateGear()` 抽象方法声明的参数类型是抽象类 `MotorVehicle`，`AutomaticVehicle` 和 `ManualVehicle`\
  \ 类都继承自该类。因此，任何实现 `AutoManual` 接口的类必须实现 `operateGear()` 抽象方法（因为该方法不是默认方法），并且可以操作任何自动或手动汽车对象。实现类所示：\n\
  \n```java\nclass AutoManualOperator implements AutoManual{\n\n    public void operateGear(MotorVehicle\
  \ m){\n\n        m.applyGear();\n\n    }\n}\n```\n\n这是非常有多态性的，这正是接口的作用。我在程序列表 4.3\
  \ 中通过改进程序列表 4.2 中的公类 `CarMart` 这一点，使其拥有一个新的公类 `CarMartInterface`，如下所示：\n\n程序列表 4.3：\n\
  \n```java\n/* 导入 JOptionPane 类以创建视觉输入面板。 */\nimport javax.swing.JOptionPane;\n\n\
  public class CarMartInterface\n{\n  public static void main(String[] args){\n  AutomaticVehicle\
  \ myAutomaticCar = new AutomaticVehicle( );\n   ManualVehicle myManualCar = new\
  \ ManualVehicle( );\n AutoManualOperator operator = new AutoManualOperator( );\n\
  \n    /* 使用导入的 JOptionPlane 类的方法读取所需的车辆类型 */\n    String m = JOptionPane.showInputDialog(\"\
  Enter (1) for a Manual vehcice (2) for an automatic one \");\n\n    if(Integer.parseInt(m)\
  \ == 1 )\n        //myManualCar.applyGear( )\noperator.operateGear(myManualCar);\n\
  \n    else\n      //myAutomaticCar.applyGear( );      \noperator.operateGear(myAutomaticCar);\n\
  \n  }\n  }\nabstract class MotorVehicle{\n  public abstract void applyGear( );\n\
  }\nclass ManualVehicle extends MotorVehicle{\n  String gearType;\n  public ManualVehicle(\
  \ ){\n  gearType = \"A manual gearing system.\";\n  }\n\n  @Override public void\
  \ applyGear( ){\n    System.out.println(\"\\n Manually change the gear by applying\
  \ the clutch.\" );\n  }\n  String displayGearType( ){\n  return gearType;\n  }\n\
  }\nclass AutomaticVehicle extends MotorVehicle{\n  String gearType;\n  public AutomaticVehicle(\
  \ ){\n  gearType = \"An automatic gearing system.\";\n  }\n\n  @Override public\
  \ void applyGear( ){\n    System.out.println(\"\\n Change the gear by gently pushing\
  \ or pulling the lever.\" );\n  }\n\n  String displayGearType( ){\n  return gearType;\n\
  \  }\n}\n```\n\n\n\n\n括号是可选的，大括号也是可选的。如果你在右侧有多个语句，你可以像上面描述的那样将语句封装在大括号中；如果你在左侧有多个参数，也可以将它们封装在括号中。类型声明也是可选的；编译器可以从提供的参数中进行推断。此外，不需要\
  \ `return` 关键字。以下是有效的 lambda 表达式示例：\n\n```\n(a)->a *a;\n```\n接收一个参数 `a`，将其与自身相乘并返回结果。\n\
  \n```\na -> a + a;\n```\n接收一个参数 `a`，将它们相加并返回结果。\n\n```\n(int a, int b) -> a – b;\n\
  ```\n在间接引用左侧接收参数 `a` 和 `b`，从参数 `a` 中减去参数 `b` 的值并返回结果。\n\n```\n(String t) -> System.out.println(t);\n\
  ```\n该 lambda 表达式将字符串 `t` 的内容打印到控制台。\n\n### 4.9.2 在函数接口中使用 Lambda \n\n下面的程序列表演示了如何通过使用函数接口进行数学计算来使用\
  \ lambda 表达式：\n\n```java\ninterface multiplier{\n  float processMyNumber(float r);\n\
  }\n```\n上文 4.8.1 节已定义。\n\n程序列表 4.4：\n\n```java\npublic class LambdaOperator\n{\n\
  \  public static void main(String[] args){\n    Result res = new Result( );\n  \
  \  float n=8;\n    multiplier square = (a) -> a * a;\n    multiplier doubler = a\
  \ -> a + a;\n    System.out.printf(\"\\nResult of squaring %f is %f \", n, res.numberNSquare(n,square));\n\
  \    System.out.printf(\"\\nResult of doubling %f is %f \", n, res.numberNSquare(n,doubler));\n\
  \  }\n}\n\ninterface multiplier{\n  float processMyNumber(float r);\n}\n\nclass\
  \ Result {\n  float hold;\n  void result(){\n    hold =0;\n  }\n  float numberNSquare(float\
  \ n, multiplier squaredNo){\n    return (squaredNo.processMyNumber(n));\n  }\n}\n\
  ```\n\n上述程序列表 4.4 的输出如图 4.4 所示：\n\n![](img/00011.jpeg)\n\n图 4.4 程序列表 4.4 的输出。\n\n\
  `square` 和 `doubler` lambda 表达式隐式地实现了 `Multiplier` 接口的唯一抽象方法 `processMyNumber`。`Multiplier`\
  \ 接口被声明为 `Result` 类方法 `numberNSquare(int, Multiplier )` 的第二个参数，通过这种方式，`numberNSquare`\
  \ 方法可以接受接口的任何对象类型。因此，我们可以根据需要将 lambda 表达式传递到 `numberNSquare` 方法中。这极大地简化了代码并更具多态性。\n\
  \n在本章结束之前，最后一点说明：接口可以扩展另一个接口。尝试一下吧，我们下章见，讨论程序循环和数组。感谢大家的关注。\n\n# 第 5 章\n\n# 程序控制循环和\
  \ ForEach 循环\n\n程序循环是重复执行特定次数语句块的程序语句。我们有三种基本的控制循环语句：`for` 循环语句、`while` 循环语句和 `do`\
  \ 语句。我们将在本章逐一查看它们。\n\n## 5.1 For 循环语句\n\n`for 循环语句` 在开启和关闭的大括号内按指定的次数执行一组程序语句或单个程序语句。`for\
  \ 循环`语句的通用语法如下所示：\n\n```java\nfor( loop_variable; loop_conditional_expr ; loop_incremental_stmt\
  \ ){\n   loop statements\n}\n```\n\n循环变量为增量语句变量设置了初始值。`for 循环语句`的执行从循环变量初始化开始。可以有多个循环变量，只要它们用逗号隔开都没有问题。在循环变量初始化后，会评估循环条件表达式，如果它的求值为真值，则执行循环语句，并执行增量语句进行下一次迭代。如果条件表达式的求值不是真值，则退出循环。为了说明，程序列表\
  \ 5.1 使用 `for` 循环语句在控制台上打印出从 1 到 10 的一组数字。\n\n程序列表 5.1：\n\n```java\npublic class\
  \ ForLoop\n{\n  public static void main(String[] args){\n    for(int i=1; i < 11\
  \ ; ++i)\n      System.out.println(i);\n  }\n}\n```\n\n程序列表 5.1 的输出如图 5.1 所示：\n\n\
  ![](img/00012.jpeg)\n\n图 5.1 程序列表 5.1 的输出。\n\n程序列表 5.1 中的 `for` 循环语句从循环变量语句中的变量\
  \ `i` 初始化为 1 开始（`i = 1`）。然后它评估循环条件语句（`i<10`）以测试变量 `i` 是否仍然小于 10，如果是，则执行 `for` 循环体。如果你在\
  \ `for` 循环块中只有一行语句，可以省略循环语句的开启和关闭括号。\n\n## 5.2 嵌套 for 循环\n\n嵌套 for 循环表示发生特定次数的迭代事件。它是另一个\
  \ `for loop` 内部的 `for loop`。`for loop` 的语法如下：\n\n```java\nfor(loop_var1; cond1;\
  \ inc1) {\n   for(loop_var2; cond2; inc2)\n```\n\n为了说明，程序列表 5.2 使用嵌套循环生成了从 1 到 4\
  \ 的乘法表。\n\n程序列表 5.2：\n\n```java\npublic class NestedFor\n{\n  public static void\
  \ main(String[] args){\n    for(int i=1; i < 5 ; ++i){\n      System.out.println(\"\
  \\n\" + i + \" Series Table\");\n      for(int j=1; j < 4 ; ++j)\n        System.out.println(\
  \ i + \" * \" + j + \" = \" + (i*j) );\n    }\n  }\n}\n```\n\n程序列表 5.2 的输出如图 5.2\
  \ 所示：\n\n![](img/00013.jpeg)\n\n图 5.2 程序列表 5.2 的输出。\n\n请注意，你不能在内层循环中重用外层循环使用的变量名。这是因为这里适用作用域规则。\n\
  \n## 5.3 增强型 For 循环\n\n增强型 for 循环通常用于数组，其通用语法如下：\n\n```java\nfor( data_type element:\
  \ array_name )\n```\n\n稍将在数组部分介绍增强型 for 循环。\n\n## 5.4 Lambda 循环\n\nlambda foreach\
  \ 随着 `stream` 类引入 `java.util.Collections` 包被引入到 Java 8 SE。`stream` 类自带了一些工具方法，如\
  \ `min`、`max`、`filter`、`findFirst` 等。现在，`stream` 可以与 lambda foreach 循环结合使用，将增强型\
  \ for 循环简化为以下语句：\n\n```\ncollection_name.stream().forEach((object) -> {\n  statement;\n\
  })\n```\n\n`ArrayList` 等集合现在可以使用 `stream` 方法配合 `forEach` 语句来处理它们的集合。数组是相同类型对象的集合（例如从\
  \ 1 到 10 的一组整数），而 `arraylist` 是相同类型对象的集合。我们将在本章的 5.7 节和本书第七章的 7.8b 节讨论这一点。下面的程序列表\
  \ 5.3 演示了通过将数组转换为 arraylist，然后使用 `forEach` 功能 lambda 表达式列出数组的内容。\n\n```java\nimport\
  \ java.util.Arrays;\nimport java.util.ArrayList;\n\npublic class FilterLoop\n{\n\
  \  public static void main(String[] args){\n    // 声明并初始化一个包含奇数的 arraylist 计数器\n\
  \    ArrayList<Integer> counter = new ArrayList<Integer>(Arrays.asList(1,3,5,7,9));\n\
  \    System.out.println(\"\\n A list of Odd numbers: \");\n    // 使用 forEach 内联语句打印出奇数列表\n\
  \    counter.stream().forEach((num) -> System.out.println(num));\n  }\n}\n```\n\n\
  \n\n\n输出如下方的 5.3 图所示：\n\n![](img/00014.jpeg)\n\n图 5.3 程序列表 5.3 的输出。\n\n不要过于担心数组和\
  \ `arraylist`，它们将在本书的第 7 章中进行详细讨论，目前只需按照呈现的形式理解即可。\n\n## 5.5 While 语句\n\nwhile 循环用于我们需要根据条件表达式的求值结果来执行程序语句或语句块的情况。while\
  \ 语句的语法如下所示：\n\n```java\nWhile (conditional expression){\n    Program statement;\n\
  \    Loop expression;\n}\n```\n\n例如，为了生成一个在 0 到 10 之间的奇数列表，我们需要一个 while 循环，因为在开始计数之前，我们可能不知道有多少个奇数。因此，我们做的只是为程序设置一个限制，让程序为我们列出奇数，无论是在\
  \ 0 到 10 的范围还是 0 到 1000 的范围。程序列表 5.4 生成了 0 到 10 范围内的奇数列表：\n\n程序列表 5.4：\n\n```java\n\
  public class WhileLoop\n{\n  public static void main(String[] args){\n    int counter\
  \ = 10;\n    System.out.println(\"\\n A list of Odd numbers: \");\n    while (counter\
  \ > 0 ){\n      if( (counter % 2 ) != 0 )\n          System.out.println(counter);\n\
  \      --counter;\n        }\n  }\n}\n```\n\nwhile 循环迭代地执行“if 程序块”，递减变量 `counter`\
  \ 中的值，直到 `counter` 变为 0 时 while 循环终止。`if` 语句的条件表达式通过使用模运算符（`%`）除 `counter` 来测试变量\
  \ `counter` 的值是否为奇数，该运算符返回除法的余数。如果 `if` 条件表达式返回大于 0 的值，则所涉及的操作数为奇数，并且该值被打印到输出中。程序列表\
  \ 5.4 执行的输出如下方的 5.4 图所示：\n\n![](img/00015.jpeg)\n\n图 5.4 程序列表 5.4 的输出。\n\n## 5.6\
  \ Do 语句\n\ndo 语句是 while 语句的一种变体。它用于我们希望程序语句或语句块至少执行一次的情况。do 语句的语法描述如下：\n\n```java\n\
  do{\nprogram statement;\n}\nWhile(conditional _expression);\n```\n\ndo 循环语句块在条件表达式被求值之前执行。\n\
  \n## 5.7 流“filter” 方法\n\nJava 8 SE 中新引入的流的 `filter` 方法可以与 `forEach`  表达式结合使用，在处理集合时替换\
  \ while 循环，为了简单起见，如下方的程序列表 5.5 所示：\n\n程序列表 5.5：\n\n```java\nimport java.util.Arrays;\n\
  import java.util.ArrayList;\npublic class FilterLoop\n{\n  public static void main(String[]\
  \ args){\nArrayList<Integer> counter = new ArrayList<Integer>(Arrays.asList(0,1,2,3,4,5,6,7,9));\n\
  System.out.println(\"\\n A list of Odd numbers: \");\n  counter.stream().filter((num)\
  \ -> ((num % 2 ) != 0 )).forEach((num) -> System.out.println(num));\n  }\n}\n```\n\
  \n程序列表 5.5 的输出如下方的 5.5 图所示：\n\n![](img/00016.jpeg)\n\n图 5.5 上述程序列表 5.5 的输出。\n\n\
  在此，我们结束另一个章节，开始另一个关于决策语句的章节。感谢你的陪伴，希望你拥有一段美好的编程体验。\n\n# 第 6 章\n\n# 程序决策语句\n\n计算机被认为是智能的是因为它们具有内在做出智能决策的能力。这种能力源于计算机程序中的决策语句。决策语句帮助计算机程序根据执行期间评估的条件表达式中的某些标准做出智能决策。\n\
  \n决策语句基本上有三种类型：`if` 语句、`if.. else` 语句和 `switch case`。在本章中，我们将逐一研究每一种，从最简单的 `if`\
  \ 语句开始。\n\n## 6.1 if 语句\n\n`if` 语句仅在其条件表达式求值为布尔值 true 时才执行其语句块，如果返回布尔值 false，则将控制流转移到“if\
  \ 块” 后的程序语句。`if` 语句的一般语法描述如下：\n\n```java\nif (conditional_expression){\n  Program\
  \ statement;\n}\n```\n\n下面是程序列表 5.3 的片段，其中使用 `if` 语句测试数值计数器值是否为奇数。\n\n```java\n\
  if ((counter % 2) != 0)\n    System.out.println(counter);\n```\n\n## 6.2 if else\
  \ 语句\n\n`if else` 语句是一种复合 `if` 语句。除了有 if 程序块外，它还有一个 else 程序块，当条件表达式的结果为 false 时会处理该\
  \ else 块。`if else` 的语法为：\n\n```java\nif (conditional_expression){\n  program statement;\n\
  }\nelse{\n  program statement;\n}\n```\n\n为了说明 `if else` 语句，程序列表 6.1 测试一个是否为整数：\n\
  \n```java\nimport javax.swing.JOptionPane;\nimport java.util.Scanner;\npublic class\
  \ IfElse\n{\n  static Scanner inc = new Scanner(System.in);\n  public static void\
  \ main(String[] args){\n    System.out.print(\"\\n Please enter a value-> \");\n\
  \    if( inc.hasNextInt() )\n      System.out.println(\"You entered an integer\"\
  );\n    else\n      System.out.println(\"\\nYou entered a non integer\");\n  }\n\
  }\n```\n\n## 6.3 三元运算符\n\n三元运算符是 `if` 语句的另一种形式，可以紧凑地执行 `if else` 结构的相同决策功能。表示三元运算符的符号是问号（`?`）和冒号（`:`）。用法如下：\n\
  \n```java\nconditional_expression ? expression-1 : expression-2;\n```\n\n如果条件表达式返回布尔值\
  \ true，则执行 `expression-1`，否则执行并返回 `expression-2`。程序列表 6.2 展示了三元运算符的使用。\n\n```java\n\
  public class TernaryOperator\n{\n  public static void main(String[] args){\n   \
  \ int num=-9;\n    System.out.println( num < 0 ? 0 : 1 );\n  }\n}\n```\n\n三元语句测试其条件表达式以确定变量\
  \ `num` 的值是否小于零，如果是则返回 0，否则返回值 1。\n\n## 6.4 else if 语句\n\n`else if` 语句是另一种复合 `if`\
  \ 语句，可以测试多个备选条件表达式的返回的布尔结果，并根据返回结果执行相应的 if 块。`else if` 语句的用法描述如下：\n\n```java\nif(conditional_expression1){\n\
  \  program statement;\n}\nelse if (conditional_expression2){\n  program statement;\n\
  }\n```\n\n\n\n\n\n```java\nelse if (conditional_expression3){\n    program statement;\n\
  }\nelse{\n    Program statement;\n}\n```\n\n`else if` 语句可以处理多个条件表达式选项。程序列表 6.3 演示了一个可以判断输入数据类型的程序。\n\
  \n程序列表 6.3：\n\n```java\nimport javax.swing.JOptionPane;\nimport java.util.Scanner;\n\
  \npublic class ElseIf\n{\n  static Scanner inc = new Scanner(System.in);\n  public\
  \ static void main(String[] args){\n    System.out.print(\"\\n Please enter a value->\
  \ \");\n      if( inc.hasNextInt( ) )\n          System.out.println(\"You entered\
  \ an integer. \");\n      else if ( inc.hasNextFloat( ) )\n          System.out.println(\"\
  \\n You entered a floating point number.\");\n      else if ( inc.hasNextDouble(\
  \ ) )\n          System.out.println(\"\\n You entered a double data type.\");\n\
  \      else if ( inc.hasNextBoolean( ) )\n          System.out.println(\"\\n You\
  \ entered a booleann value.\");\n      else if ( inc.hasNextByte( ) )\n        \
  \  System.out.println(\"\\n Your entered data is in bytes.\");\n      else if (\
  \ inc.hasNextShort( ) )\n          System.out.println(\"\\n You entered a short\
  \ integer value.\");\n      else if ( inc.hasNextLong( ) )\n          System.out.println(\"\
  \\n You entered a long integer value.\");\n      else\n          System.out.println(\"\
  \\n You entered other type of data.\");\n  }\n}\n```\n\n程序列表 6.3 利用 `Scanner` 类的方法在它的条件表达式中比较输入类型，以确定数据输入类型，并将该类型打印到标准输出。\n\
  \n`else-if` 语句中的条件表达式与 `if-else` 语句非常相似，必须返回 `Boolean` 类型的真或假值才合法。值 0 和 1 不能代替布尔值\
  \ `false` 和 `true`，这意味着条件表达式不能求值为一个整数或 `char` 值。\n\n## 6.5 Switch 语句\n\n`switch`\
  \ 语句的工作原理与 `else-if` 语句非常相似，不同在于表达式必须求值为一个整数、`String` 或枚举类型，并将其与 `switch` 的 case\
  \ 值进行比较，以确定执行哪个 case 块。因此，在需要根据给定的 `char`、`int` 或枚举输入值执行备选代码块的情况下，`switch` 语句是最合适的语句结构选项。`switch`\
  \ 语句的通用语法如下：\n\n```java\nswitch (expression)\n  case value-1:\n      program statement;\n\
  \  break;\n  case value-2:\n      program statement;\n  break;\n  case value-3:\n\
  \      program statement;\n  break;\n  default:\n      default program statement;\n\
  \  break;\n}\n```\n\ncase 块不需要大大括号。case 块用如上所述的 `break` 语句终止，如果省略了 `break` 语句，程序执行将继续进行到下一个\
  \ case 块，以此类推，直到遇到 `break` 语句或到达 `switch` 语句的结束。下面的程序列表 6.4 演示了 `switch` 语句的使用：\n\
  \n程序列表 6.4：\n\n```java\nimport javax.swing.JOptionPane;\npublic class SwitchStatement\n\
  {\n  public static void main(String[] args){\n    /*Presenting the menu */\n   \
  \ String m = JOptionPane.showInputDialog(\"What would you prefer for breakfast;\
  \ Enter (1)for chicken and chips (2) for porridge and (3) for bread and tea \");\n\
  \    switch(Integer.parseInt(m)) {\n      case 1:\n        System.out.println(\"\
  \\n You selected chicken and chips for breakfast\");\n      break;\n      case 2:\n\
  \        System.out.println(\"\\n You selected porrage for breakfast\");\n     \
  \ break;\n      case 3:\n        System.out.println(\"\\n You selected bread and\
  \ tea for breakfast\");\n      break;\n      default:\n        System.out.println(\"\
  \\n You entered other type of data.\");\n    }\n  }\n}\n```\n\n## 7 数组与排序\n\n数组是共享名称的相似类型集合。\n\
  \n### 7.1 数组声明\n\n声明数组的语法为：\n\n`data_type[] array_name`\n\n例如，声明一个数组：\n\n`data_type[]\
  \ array_name`\n\n然而，声明数组不会自动分配内存。要分配内存空间，你需要使用 `new` 关键字：\n\n`data_type[] array_name\
  \ = new data_type[size]`\n\n或者你可以在单行中合并声明语句：\n\n`data_type[] array_name = new data_type[size]`\n\
  \n### 7.2 数组赋值\n\n数组槽可以在创建时用预设值初始化：\n\n`data_type[] array_name = {value1, value2,\
  \ ...}`\n\n此外，可以通过以下方式进行数组赋值：\n\n`array_name[index] = value`\n\n你还必须注意，数组索引从 0 开始。\n\
  \n### 7.3 多维数组\n\n多维数组是数组的数组。例如，以下语句声明了一个二维数组：\n\n`data_type[][] array_name;`\n\n\
  你可以为二维数组分配必要的内存空间：\n\n`array_name = new data_type[size1][size2];`\n\n或者你可以将这两条语句写在一起：\n\
  \n`data_type[][] array_name = new data_type[size1][size2];`\n\n你现在可以为槽位赋值值：\n\n\
  `array_name[index1][index2] = value;`\n\n### 7.4 增强型 for 循环\n\n增强型 for 循环是随 java5\
  \ 引入的。它可以用于访问数组的内容，而你无需担心数组索引或检查数组长度。\n\n\n\n\n\n```\nfor (data_type slot_identifier\
  \ : array_name) {\n    program statement;\n}\n```\n\n例如，如果我们想要显示 `balls` 数组的内容，我们可以通过下方程序列表\
  \ 7.1 所示的以下增强型“for 循环”语句来实现：\n\n程序列表 7.1：\n\n```java\npublic class ArrayTester\n\
  {\n  public static void main(String[] args){\n    String[] balls = {\"Basket ball\"\
  , \"Base ball\", \"Volley Ball\", \"Foot ball\" };\n    for(String ball : balls)\n\
  \      System.out.println(ball);\n  }\n}\n```\n\n程序列表 7.1 的输出如下方图 7.1 所示：\n\n![](img/00021.jpeg)\n\
  \n图 7.1 程序列表 7.1 的输出。\n\n你也可以通过下方程序列表 7.2 所示的增强型 for 循环语句来显示二维数组 `rooms` 的内容：\n\n\
  程序列表 7.2：\n\n```java\npublic class ArrayTester\n{\n  public static void main(String[]\
  \ args){\n    int[][] rooms = new int[2][10];\n    for(int floor=0; floor < rooms.length;\
  \ ++floor)\n      for(int room_no=0; room_no < 10; ++room_no)\n        rooms[floor][room_no]\
  \ = 0;\n    //The enhanced for loop statement\n    for(int[] flr: rooms)\n     \
  \ for(int rm : flr)\n        System.out.printf(\" %d\", rm);\n  }\n}\n```\n\n上述程序列表\
  \ 7.2 的输出如下方图 7.2 所示：\n\n![](img/00022.jpeg)\n\n图 7.2 程序列表 7.2 的输出。\n\n## 7.5 数组排序\
  \ (ArraySorting)\n\n`java.util` 包中的 java `Arrays` 类拥有许多静态方法，用于对数组执行频繁的操作，例如数组排序。例如，可以通过下方程序列表\
  \ 7.3 所示的应用 `Arrays` 工具方法 `sort()` 对 `balls` 数组进行排序：\n\n程序列表 7.3：\n\n```java\nimport\
  \ java.util.*;\n\npublic class ArraySorter\n{\n  public static void main(String[]\
  \ args){\n    String[] balls = {\"Basket ball\", \"Base ball\", \"Volley Ball\"\
  , \"Foot ball\" };\n    System.out.println(\"\\n A list of array balls' content\
  \ before sorting -> \\n\");\n    for(String ball : balls)\n      System.out.println(ball);\n\
  \    Arrays.sort(balls);\n    System.out.println(\"\\n A list of array balls' content\
  \ after sorting ->\\n\");\n    for(String ball : balls)\n      System.out.println(ball);\n\
  \  }\n}\n```\n\n程序列表 7.3 的输出如下方图 7.3 所示：\n\n![](img/00023.jpeg)\n\n图 7.3 程序列表 7.3\
  \ 的输出。\n\n## 7.5b 并行数组排序 (Parallel Array Sorting)\n\n新的 java8 引入了并行数组排序（parallel\
  \ array sorting）的概念，这使 java 排序程序的效率提高了约百分之三十（30%）。该技术专为双核或四核计算机设计，唯一的缺点是系统需要另一个等于待排序数组大小的内存空间。新添加到\
  \ `java.util.Arrays` 包中的 `parallelSort()` 方法及其构造函数变体如下方程序列表 7.4 所示描述和应用：\n\n程序列表\
  \ 7.4：\n\n```java\nimport java.util.Collections;\nimport java.util.Arrays;\n\npublic\
  \ class ArraySorter\n{\n  public static void main(String[] args){\n    String[]\
  \ balls = {\"Basket ball\", \"Base ball\", \"Volley Ball\", \"Foot ball\" };\n \
  \   System.out.println(\"\\n A list of array balls' content before sorting -> \\\
  n\");\n    for(String ball : balls)\n      System.out.println(ball);\n    System.out.println(\"\
  \\n Array balls with 1st and 2nd contents sorted in ascending order ->\\n\");\n\
  \    Arrays.parallelSort(balls,0,2);\n    for(String ball : balls)\n      System.out.println(ball);\n\
  \    System.out.println(\"\\n Array balls contents sorted in ascending order with\
  \ parallel sorting->\\n\");\n    Arrays.parallelSort(balls);\n    for(String ball\
  \ : balls)\n      System.out.println(ball);\n    System.out.println(\"\\n Array\
  \ balls with 1st and 2nd contents sorted in descending order ->\\n\");\n    Arrays.parallelSort(balls,0,2,\
  \ Collections.reverseOrder());\n    for(String ball : balls)\n      System.out.println(ball);\n\
  \  }\n}\n```\n\n上述程序列表 7.4 的输出如下方图 7.4 所示：\n\nrun:\nA list of array balls' content\
  \ before sorting ->\nArray balls with 1st and 2nd contents sorted in ascending order\
  \ ->\nArray balls contents sorted in ascending order with parallel sorting->\nArray\
  \ balls with 1st and 2nd contents sorted in descending order ->\n\nSUCCESSFUL (total\
  \ time: 0 seconds)\n\n## 7.6 复制 (Copying)\n\n通过使用 java 语言的 `arraycopy` 方法可以将可以将数组的内容复制到另一个相似类型的数组中。为了说明这一点，见程序列表\
  \ 7.5：\n\n程序列表 7.5：\n\n```java\nimport java.util.*;\n\npublic class ArraySorter\n\
  {\n  public static void main(String[] args){\n    String[] balls = {\"Basket ball\"\
  , \"Base ball\", \"Volley Ball\", \"Foot ball\" };\n    System.out.println(\"\\\
  n A list of array balls' content before sorting -> \\n\");\n    for(String ball\
  \ : balls)\n      System.out.println(ball);\n    Arrays.sort(balls);\n    System.out.println(\"\
  \\n A list of array balls' content after sorting ->\\n\");\n    for(String ball\
  \ : balls)\n      System.out.println(ball);\n    String[] ballsCopy = new String[balls.length];\n\
  \    System.arraycopy(balls,0,ballsCopy,2);\n    System.out.println(\"\\n A list\
  \ of ballsCopy's content after copy operation ->\\n\");\n    for(String ball : ballsCopy)\n\
  \      System.out.println(ball);\n  }\n}\n```\n\n`arraycopy()` 的第一个参数是源数组，第二个参数是源数组的起始位置，第三个参数是目标数组，第四个参数是要复制的数量。在上述程序列表\
  \ 7.5 中，`arraycopy()` 方法提供了 2 作为要复制元素的数量到长度为 4 的 `ballsCopy` 中。因此，在列出 `ballsCopy`\
  \ 的内容时，最后两个槽位给出了 null 值。这种现象的原因是未赋值的原始类型地址被分配了 null 值。\n\n## 7.7 ArrayList\n\njava\
  \ 中的 `ArrayList` 在功能上与数组基本相同，但 `ArrayList` 只存储对象列表，而数组可以存储原始类型和对象。`ArrayList` 不像数组那样具有固定长度。它的大小可以改变以适应新元素的添加和删除。使用\
  \ `size()` 方法获取其新长度就像使用数组的 `length` 字段。此外，数组属于核心 java API，而 `ArrayList` 类属于 java\
  \ 工具包（`java.util.ArrayList`），在 java 程序中使用 `ArrayList` 类之前必须先导入。`ArrayList` 的声明语法如下所示：\n\
  \n```java\nArrayList array_name = new ArrayList();\n```\n\n你也可以如下所示配合泛型使用 `ArrayList`：\n\
  \n```java\nArrayList<data_type> array_name = new ArrayList<data_type>();\n```\n\n\
  例如，你可以使用泛型定义一个可以接受所有字符串类型的 `ArrayList`，如下所示：\n\n```java\nArrayList<String> softDrinks\
  \ = new ArrayList<String>();\n```\n\n\n\n\n\n```java\nclass customerNames{\n  String\
  \ firstName, lastName;\n  public customerNames(String firstNm, String lastNm){\n\
  \    firstName = firstNm;\n    lastName = lastNm;\n  }\n  String getFirstName( ){return\
  \ firstName;}\n  String getLastName( ){return lastName;}\n}\n```\n\n我可能会声明以下客户对象：\n\
  \n```java\ncustomerNames customer1 = new customerNames(\"Feyisayo\", \"Dosunmu\"\
  );\ncustomerNames customer2 = new customerNames(\"Brian\", \"Tracy\");\ncustomerNames\
  \ customer3 = new customerNames(\"Zig\", \"Ziglar\");\ncustomerNames customer4 =\
  \ new customerNames(\"Ben\", \"Carson\");\n```\n\n然后使用以下语句将它们存储在 `ArrayList` 中以便进行后续处理：\n\
  \n```java\nArrayList<customerNames> customers = new ArrayList<customerNames>(Arrays.asList(customer1,customer2,customer3,\
  \ customer4));\n```\n\n随后可以使用以下增强型 for 循环生成所有客户的 own：\n\n```java\nfor (customerNames\
  \ t : customers)\n  System.out.printf(\"\\n Index is %d for the element object %s\
  \ \", customers.indexOf(t),t.getFirstName());\n```\n\n所有内容整合在下面的程序列表 7.6 中：\n\n\
  **程序列表 7.6：**\n\n```java\nimport java.util.*;\n\npublic class ArrayListObjs\n{\n\
  \  public static void main(String[] args){\n  customerNames customer1 = new customerNames(\"\
  Feyisayo\", \"Dosunmu\");\n  customerNames customer2 = new customerNames(\"Brian\"\
  , \"Tracy\");\n  customerNames customer3 = new customerNames(\"Zig\", \"Ziglar\"\
  );\n  customerNames customer4 = new customerNames(\"Ben\", \"Carson\");\nArrayList<customerNames>\
  \ customers = new ArrayList<customerNames>(Arrays.asList(customer1,customer2,customer3));\n\
  \  for (customerNames t : customers)\n    System.out.printf(\"\\n Index is %d for\
  \ the element object %s \",   customers.indexOf(t),t.getFirstName());\n  }\n}\n\
  class customerNames{\n  String firstName, lastName;\n  public customerNames(String\
  \ firstNm, String lastNm){\n    firstName = firstNm;\n    lastName = lastNm;\n \
  \ }\n  String getFirstName( ){return firstName;}\n  String getLastName( ){return\
  \ lastName;}\n}\n```\n\n程序列表 7.6 执行时的输出如图 7.6 所示：\n\n![](img/00025.jpeg)\n\n图 7.6\
  \ 上述程序列表 7.6 的输出。\n\nArraylists 通过在声明中使用泛泛型来确保类型安全。\n\n## 7.8a 使用增强型 for 循环进行 ArrayList\
  \ 赋值和迭代\n\n当然，你可以使用赋值运算符如之前描述的那样为数组元素赋值，但你不能对 `ArrayList` 这样做，`ArrayList` 的 `add`\
  \ 方法用于将新元素插入到 `ArrayList` 对象中。因为要插入元素的内存空间是根据请求动态创建的，而数组则已经创建了所有需要的元素槽并将其初始化为 null\
  \ 值。以下语句向 `softDrinks` arraylist 对象中添加了一个元素：\n\n```java\nsoftDrinks.add(\"Coca Cola\"\
  );\n```\n\n你也可以结合 `ArrayList` 的 `get()` 方法和 `for loop` 语句来检索 `ArrayList` 的元素或内容，其用法语法如下文所示：\n\
  \n```java\narraylist_object.get(element_index);\n```\n\n例如，要检索 arraylist `softDrinks`\
  \ 中的第一个对象，可以使用以下语句：\n\n```java\nsoftDrinks.get(0);\n```\n\n对象的索引可以通过 `arraylist`\
  \ 类的 `indexof` 方法获取。这与增强型 for 循环语句结合使用，如下方的列表 7.7 所示：\n\n**程序列表 7.7：**\n\n```java\n\
  import java.util.ArrayList;\n\npublic class ArrayListProg\n{\n  public static void\
  \ main(String[] args){\n      ArrayList<String> softDrinks = new ArrayList<String>(\
  \ );\n      softDrinks.add(\"Coca Cola\");\n      for (String t : softDrinks)\n\
  \        System.out.printf(\"\\n Index is %d for the element object %s \", softDrinks.indexOf(t),t);\n\
  \  }\n}\n```\n\n程序列表 7.7 的输出如图 7.7 所示：\n\n![](img/00026.jpeg)\n\n图 7.7。程序列表 7.7\
  \ 的输出。\n\n程序列表 7.7 使用 `printf` 方法将程序的输出打印到标准输出设备。`printf` 方法在其消息字符串中使用字符格式 `%d`\
  \ 用于整数数据，`%f` 用于浮点数，`%s` 用于字符串，如上面程序列表 7.7 所示，表示消息字符串中要替换的参数。\n\n## 7.8b 使用 Lambda\
  \ 进行 ArrayList 迭代\n\n如本书第 4 章第 4.5 节所述，引入 `Collections` 包和 `stream` 方法使得 java8 中集合的处理对于底层硬件来说变得更加简单和快速。为了说明这一点，对上面的程序列表\
  \ 7.7 进行了修改，使用 `foreach` 函数语句来迭代 `softDrinks` `ArrayList` 的内容，用 lambda 的 `foreach`\
  \ 语句替换了增强型 for 循环。此修改如下程序列表 7.8 所示。请享用。\n\n**程序列表 7.8：**\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.Collections;\n\npublic class ArrayListLambda\n{\n  public static\
  \ void main(String[] args){\n      ArrayList<String> softDrinks = new ArrayList<String>(\
  \ );\n      softDrinks.add(\"Coca Cola\");\n      /* 增强型 for 循环被注释掉了 */\n      //for\
