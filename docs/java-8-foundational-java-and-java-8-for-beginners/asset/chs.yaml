  import org.xml.sax.SAXException;\nimport org.xml.sax.Attributes;\nimport org.xml.sax.helpers.DefaultHandler;\n\
  import java.io.File;\nimport java.io.IOException;\n\n/**\n*\n* @author Dosunmu\n\
  */\npublic class XmlSaxReader {\n    /**\n     * @param args the command line arguments\n\
  \     */\n    public static void main(String[] args) {\n        String xmlFile =\
  \ \"C:\" + File.separator + \"practice\" + File.separator + \"drinks.xml\";\n  \
  \      XmlReader reader =new XmlReader();\n        reader.readXmlContents(xmlFile);\n\
  \    }\n}\n\nclass Xmlhandler extends DefaultHandler{\n    //检测并处理定位到文档开始的事件\n \
  \   int endingElementFlag;\n    String elementName;\n\n    void xmlhandler() {\n\
  \        endingElementFlag = 0;\n        elementName= null;\n    }\n\n    @Override\n\
  \    public void startDocument() {\n        System.out.println(\"Found the beginning\
  \ of the document\");\n    }\n\n    //检测并处理定位到起始元素标签的事件\n    @Override\n    public\
  \ void startElement(String url,String lName,String eleName, Attributes attr) throws\
  \ SAXException {\n        endingElementFlag = 0;\n        elementName= eleName;\n\
  \        StringBuilder content = new StringBuilder();\n        content.append(\"\
  A starting element tag \" +\"\\\"\" +eleName +\"\\\"\"+\" is located\");\n     \
  \   // 如果有属性，则处理元素的属性\n        if(attr.getLength() >0 ){\n            content.append(\"\
  \ with the following attribute(s); \");\n            for(int t=0; t < attr.getLength();\
  \ t++){\n                content.append ( \"\\\"\"+attr.getLocalName(t)+\"\\\"\"\
  );\n                content.append(\" with a value \" +\"\\\"\"+ attr.getValue(t)+\"\
  \\\"\"+\"\\n\");\n            }\n        }\n        // 将发现的元素打印到控制台\n        System.out.println(content.toString());\n\
  \    }\n\n    // 处理元素的内容\n    @Override\n    public void characters(char[] ele_content,\
  \ int start_position, int content_length) throws SAXException {\n        String\
  \ elemNm= new String(ele_content,start_position, content_length);\n        if(endingElementFlag==\
  \ 0 && (!(elementName.equalsIgnoreCase(\"Drink\") ||elementName.equalsIgnoreCase(\"\
  Soft_Drinks\"))) {\n            System.out.println(\"with a content: +\"\\\"\" +\
  \ new String(ele_content,start_position, content_length)+\"\\\"\");\n        }\n\
  \    }\n\n    // 检测并处理元素结束\n    @Override\n    public void endElement (String ele,\
  \ String lName, String eleName) throws SAXException {\n        endingElementFlag=1;\n\
  \        System.out.println (\"An Element tag \" +\"\\\"\" + eleName + \"\\\" is\
  \ found.\");\n    }\n\n    // 检测并处理文档的结束\n    @Override\n    public void endDocument()\
  \ throws SAXException {\n        System.out.println(\"End of document.\");\n   \
  \ }\n}\n\nclass XmlReader{\n    void readXmlContents(String xmlDoc) {\n        try\
  \ {\n            // 创建 xmlHandler 实例\n            Xmlhandler xhandler = new Xmlhandler();\n\
  \            // 创建解析器工厂实例\n            SAXParserFactory sxFactory = SAXParserFactory.newInstance();\n\
  \            // 使用解析器工厂创建解析器\n            SAXParser sxParser = sxFactory.newSAXParser();\n\
  \            // 处理器传递 xml 文件\n            sxParser.parse(xmlDoc, xhandler);\n  \
  \      } catch (SAXException e) {\n            System.out.println(\"Could not parse\
  \ the XML document-> \"+ e.getMessage());\n        } catch (IOException e) {\n \
  \           System.out.println(\"Could not open path.\"+xmlDoc);\n        } catch\
  \ (ParserConfigurationException e) {\n            System.out.println(\"Unable to\
  \ create a parser-> \"+ e.getMessage());\n        }\n    }\n}\n```\n\n并且上述程序列表 10.3\
