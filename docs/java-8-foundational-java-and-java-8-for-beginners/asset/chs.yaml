  \n# 第 11 章\n\n## Java Applets\n\nApplets 主要用于动画和游戏制作。它们被嵌入在超文本标记语言文档中。因此，要使用 applet，你需要具备\
  \ [HTML5](http://www.amazon.co.uk/dp/B00PIMD5P2) 的基础知识。HTML5 文档的基本结构如下文列表 11.1 所示：\n\
  \n列表 11.1：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title> 我的第一个 HTML5 网页 </title>\n\
  <meta charset=\"UTF-8\">\n</head>\n<body>\n       <header ><em ><u> 我的 APPLET 项目。</u></em><br/>\
  \ </header>\n       <nav><a href=\"#\">首页</a>a> |<a href=\"#\">退出</a>a>� </nav><br/><br/>\n\
  \       <header ><i> 我的 Applet 图像区域</i> </header><br/>\n       <section id=”image_applet”>\n\
  \       </section><br/>\n       <footer> &copy 版所有 2015 年 8 月</footer>\n</body>\n\
  </html>\n```\n\n`<!DOCTYPE html>` 元素向浏览器描述该文档为 HTML5 文档。`<html>` 元素作为 html 文档的父容器。`<head>`\
  \ 元素作为文档的头部，包含以下内容：用于在浏览器中显示文档标题的 `<title>` 元素、`<meta>` 标签中描述页面字符编码，以及某些情况下由`<style>`\
  \ 元素包含的页面样式表。\n\n在头部元素之后是 `<body>` 元素，它包含 html 文档的正文，包括用于显示跨页面 `<section>` 元素封装的各个部分标题的\
  \ `<header>` 元素、用于显示版权和地址信息等页脚信息的页面页脚元素，以及各种其他微小的文本编辑元素，如用于插入新行的 `<br/>` 单单元元素、用于文本下划线的\
  \ `<u>` 元素、用于创建强调文本的 `<em>` 元素。主要元素必须按照描述的顺序排列，否则将导致一个格式错误的 html 文档。\n\n当你将列表 11.1\
  \ 保存为扩展名为 `.html` 的文本文档并将类型指定为 `所有文件` 时，你可以双击该文件使其在浏览器中显示，如下图 11.1 所示：\n\n![](img/00036.jpeg)\n\
  \n图 11.1 上述程序列表 11.1 的输出。\n\n诚然，这只是一个没有任何 [CSS](http://www.amazon.co.uk/dp/B00QZ2S2JI)\
  \ 样式的基础 html5 网页，但对于我们本章的讨论来说足够了。如果你还不熟悉 html，或者还没有升级到新的 html5 来进行严肃的 applet Web\
  \ 开发项目，我建议你下载名为“[HTML5; 从入门到中级的简化版](http://www.amazon.co.uk/dp/B00PIMD5P2)”的书，以及名为“[CSS3;\
  \ 从入门水平开始的 CSS2 和 3（二合一）](http://www.amazon.co.uk/dp/B00QZ2S2JI)”的书，用于专业网页的 html\
  \ 页面布局和样式设计。这两本书都在亚马逊 Kindle 书店，可以通过点击链接或在搜索框中输入书名购买。感谢你的支持。\n\n## 11.1 Applet 元素\n\
  \napplet 通过 applet 元素嵌入到 html 文档中。applet 元素的描述如下所示：\n\n```html\n<applet code=”applet.class”\
  \ width=200 height=100 > </applet>\n```\n\n`code` 属性指定通过编译 applet 源文件得到的 applet\
  \ 字节码（applet 类），而 `width` 和 `height` 设置 applet 的宽度和高度。applet 的编译方式与使用 `javac` 命令编译\
  \ java 应用程序的方式相同，之后可以使用 `appletviewer` 命令运行它。如果你的 applet 需要某些参数，可以如下所示，通过 `param`\
  \ 元素从网页中获取参数：\n\n```html\n<applet code=”applet.class” width=200 height=100 >\n<param\
  \ name=sex value=”Male” >\n</applet>\n```\n\n`param` 元素的属性 `name` 用于指定参数名称，而属性 `value`\
  \ 则用于提供参数值。\n\n## 11.2 Applet 的结构\n\napplet 没有 java 应用程序中通用的静态 public main 方法，相反，它拥有的是公有的\
  \ `init()` 方法，用于在启动时初始化 applet。Java applets 不需要强制的方法。这些方法由浏览器根据 Java 虚拟机的要求调用。`Applet`\
  \ 类（自 `Panel` 类）的以下方法对于实现 applet 至关重要：\n\na) `public void init()`：被浏览器用于 applet\
  \ 的初始化\nb) `pubic void start()`：被浏览器用于在初始化后启动 applet。在页面加载时调用\nc) `public void stop()`：被浏览器用于在页面离开时停止\
  \ applet\nd) `public void destroy()`：由浏览器用于销毁 applet 并清理内存\n\n上述 `Applet` 类的方法必须导入才能使用它们。applet\
  \ 类的继承关系如图 11.2 所示：\n\n![](img/0037.jpeg)\n\n图 11.2. Applet 类的继承树。\n\n根据 Applet\
  \ 的层次结构，`applet` 类继承自 `Panel` 类，其继承自 `Container` 类，再继承自 `Component` 类，最后继承自 `Object`\
  \ 类。诚然，`applet` 类被丰富了。然而，applet 类的 `public void paint( )` 方法用于在浏览器中绘图。让我们创建一个重写了\
  \ `paint` 方法的示例 applet。\n\n## 11.3 示例 Applet\n\n列表 11.2 中的以下示例 applet 在浏览器启动时显示当前时间。\n\
  \n列表 11.2：\n\n```java\nimport java.applet.Applet;\nimport java.awt.Graphics;\nimport\
  \ java.time.LocalTime;\n\n/**\n* 作者 Dosunmu\n*/\npublic class LocalTimeApplet extends\
  \ Applet {\n\n/**\n* 在浏览器加载 applet 后调用的方法\n */\n    @Override\n    public void init()\
  \ {\n        // TODO 异步下载资源\n    }\n\n    @Override\n    public void paint(Graphics\
  \ t){\n        t.drawString(\"当前时间为：\" + LocalTime.now(), 100,90);\n    } // 不需要重写\
  \ start(), stop() 和 destroy 方法\n}\n```\n\n不需要重写 `start()`、`stop()` 和 `destroy()`\
  \ 方法，因为浏览器会在 applet 进入视野时自动调用 `start()` 方法，在离开视野时调用 `stop()` 方法，并在页面从浏览器移除时调用 `destroy()`\
  \ 方法。\n\n上面的 applet 可以像编译 java 代码一样，使用 `javac` 命令或在 netbeans 中编译生成字节码，然后将其嵌入到如列表\
  \ 11.1 所示的 Web 文档中。嵌入方式如下文修改后的列表 11.1 (11.3) 所示：\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<title> 我的第一个 HTML5 网页 </title>\n<meta charset=\"UTF-8\">\n</head>\n<body>\n\
  \       <header ><em ><u> 我的 APPLET 项目。</u></em><br/> </header>\n       <nav><a\
  \ href=\"#\">首页</a>a> |<a href=\"#\">退出</a>a> </nav><br/><br/>\n       <header ><i>\
  \ 我的本地时间 Applet 区域</i> </header><br/>\n       <section id=”Local Time_applet”>\n\
  \       </section><br/>\n       <footer> &copy 版所有 2015 年 8 月</footer>\n</body>\n\
  </html>\n```\n\n\n\n\n\n<applet code=\"LocalTimeApplet.class\" width=300 height=100>\
  \ </applet>\n\n要在命令行提示符中运行 applet，请使用 `appletviewer` 命令执行下方图 11.3 所示的 html 文档：\n\
  \n```bash\nC:\\practice>appletviewer LocalTimeApplet.htm\n```\n\n程序在命令行提示符中甚至在 Netbeans\
  \ IDE 中执行时，输出结果如图 11.3 所示：\n\n![](img/00038.jpeg)\n\n图 11.3。程序列表 11.2 (applet) 的输出。\n\
  \n`Graphics` 类主要用于在系统输出设备上绘制对象。以下是常用的 `Graphics` 类方法：\n\na) `public abstract void\
  \ drawLine (int x, int y, int x2, int y2);` 用于从点(x, y) 到点 (x2, y2) 绘制一条线。\n\nb)\
  \ `public abstract void drawImage(Image img, int x, int y, ImageObserver obs);`\
  \ 用于将给定图像绘制到输出设备。\n\nc) `public abstract void drawArc(int x, int y, int width, int\
  \ height, int startAngle, arcAngle);` 用于向输出设备绘制一个弧。\n\nd) `public abstract void\
  \ drawOval(int x, int y, int width, int height);` 用于向输出设备绘制一个椭圆形。\n\ne) `public\
  \ abstract void drawRect(int x, int y, int width, int height);` 用于向输出设备绘制并输出一个矩形。\n\
  \nf) `public abstract void drawstring(String str, int x, int y);` 用于向输出设备输出字符串。\n\
  \ng) `public abstract void fillArc(int x, int y, int width, int height, int startAngle,\
  \ arcAngle);` 用指定的定的颜色填充绘制的弧。\n\nh) `public abstract void fillOval(int x, int y,\
  \ int width, int height);` 用设定的颜色填充绘制的椭圆形。\n\ni) `public abstract void fillRect(int\
  \ x, int y, int width, int height);` 用于用指定的颜色填充绘制的矩形。\n\nj) `public abstract void\
  \ setColor(Color c);` 用于设置图形当前的填充颜色。\n\n例如，下方程序列表 11.3 中的以下 applet 代码负责使用 `Graphics`\
  \ 和 `Color` 类在输出设备上绘制一个填充为粉红色的矩形对象。\n\n程序列表 11.3：\n\n```java\nimport java.applet.Applet;\n\
  import java.awt.Color;\nimport java.awt.Graphics;\n\n/**\n*\n* @author Dosunmu\n\
  */\npublic class FilledRectangle extends Applet {\n    /**\n     * 在 applet 加载到浏览器后调用的初始化方法。\n\
  \     */\n    @Override\n    public void init() {\n        // TODO start asynchronous\
  \ download of heavy resources\n    }\n    @Override\n    public void paint(Graphics\
  \ p){\n      p.setColor(Color.pink);\n      p.drawRect(140, 70, 45, 60); \n    \
  \  p.fillRect(140, 70, 45, 60);\n    }\n}\n```\n\n程序列表 11.3 的输出如图 11.4 所示：\n\n![](img/00039.jpeg)\n\
  \n图 11.4。上方程序列表 11.3 的输出。\n\n然而，applets 也有自己的缺点和局限性，如下：\n\na) 它们需要插件才能在浏览器中执行\n\n\
  b) 浏览器的安全设置可能会阻止你的 applet 执行\n\n尽管如此，applets 也有自己的优势，因为它们更安全、速度更快（因为它们在客户端执行），并且一旦安装了\
  \ Java 运行时环境，就可以各种平台上运行。\n\n总之，applets 并不是构建优秀网站和用户体验的最佳方式，在达到那个水平时，servlets 提供了更好的前景。从这里开始，你可以轻松理解你所选的任何其他关于\
  \ Java 8 编程和 servlet 开发的高级书籍，因为尽管我想继续写下去，但我必须在此停笔。如果需求需要，我可以在本书的后续系列中包含关于 servlet\
  \ 和数据库操作的内容。\n\n我知道你最初下载这本书是有原因的，首先，我希望你的目的得以实现；其次，有一个带你来到这里的动力，这可能是因为你有一个即将启动的项目，或者你正处于某个项目的中间。如果是这样，我建议你也下载我的另一本被高度推荐的书，名为[“文献综述写作：一种简化方法”。](http://www.amazon.co.uk/dp/B00OG1YACS)\
