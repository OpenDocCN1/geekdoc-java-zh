  \ object %s \", softDrinks.indexOf(t),t);\n    /* 增强型 for 循环现在被 forEach 循环替换 */\n\
  \     softDrinks.stream().forEach((t) -> {\n      System.out.printf(\"\\n Index\
  \ is %d for the element object %s \\n\", softDrinks.indexOf(t),t);\n   });\n  }\n\
  }\n```\n\n程序的输出如图 7.8 所示：\n\n![](img/00027.jpeg)\n\n图 7.8 程序输出。\n\n## 7.9 删除 ArrayList\
  \ 对象\n\n可以使用 `ArrayList` 的 `clear()` 方法从 ArrayList 中删除所有对象。用法语法如下：\n\n```java\n\
  arraylist_object.clear();\n```\n\n例如，要从 arraylist `softDrinks` 中删除所有元素，可以使用以下语句：\n\
  \n```java\nsoftDrinks.clear();\n```\n\n而要从 arraylist 删除特定的对象元素，可以使用以下语法：\n\n```java\n\
  arraylist_object.remove(object_element);\n```\n\n例如，要从 arraylist `softDrinks` 中移除第一个对象，可以使用以下语句：\n\
  \n```java\nsoftDrinks.remove(0);\n```\n\n## 7.10 Iterator 接口：\n\n`ArrayList` 类实现了\
  \ `iterator` 接口，该接口具有以下方法：`next()`、`hasNext()` 和 `remove()`。`next()` 方法返回 arraylist\
  \ 中的下一个对象元素。`hasNext()` 方法检查 `ArrayList` 中是否还有可用的对象元素，`remove()` 方法从列表中删除当前对象。在\
  \ java 程序中使用 `iterator` 接口，你必须从 java 工具包导入 `Iterator` 类（`java.util.Iterator`），或者使用语句\
  \ `java.util.*` 一次性导入工具包中的所有类，如下方的程序列表 7.9 所示：\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.Iterator;\n\npublic class IteratorProg\n{\n  public static void\
  \ main(String[] args){\n      ArrayList<String> softDrinks = new ArrayList<String>(\
  \ );\n      String t;\n      softDrinks.add(\"Coca Cola\");\n      softDrinks.add(\"\
  Fanta\");\n      softDrinks.add(\"Pepsi\");\n      Iterator itr =  softDrinks.iterator(\
  \ );\n      while (itr.hasNext( ){\n        t= (String) itr.next( );\n        System.out.printf(\"\
  \\n Index is %d for the element object %s \", softDrinks.indexOf(t),t);\n      }\n\
  \  }\n}\n```\n\n\n\n\n程序列表 7.9 展示了 `Iterator` 接口的使用，通过在 `while` 循环表达式中使用 `Iterator`\
  \ 接口的 `hasNext()` 方法来测试列表是否为空，然后使用 `next()` 方法从列表中获取下一个对象元素。这再次带我们来到了另一个关于 Java\
  \ 数组的启发性章节的结尾。我希望你在整理这一章节时和我一样过得愉快。请随我进入下一个章节，我们将对 `Strings` 进行更简短的讨论。\n\n# 第 8\
  \ 章：字符串与正则表达式\n\n字符串数据类型在 `java` 编程语言中是一个对象。字符串表示为双引号内字符的无限组合。例如，“John” 是一个字符串字面量。现在你可以通过以下语句将字符串变量\
  \ `firstname` 定义为指向字符串字面量 “John”：\n\n```java\nString firstName = “John”;\n```\n\n\
  注意，一旦像上面那样将字符串内容赋值给变量，其内容就不能再更改，但变量中的字符串引用可以更改为另一个。例如，当你尝试使用加号进行字符串拼接（如下所示）来将字符串变量\
  \ `firstName` 的内容修改为新值 “Johnson”时：\n\n```java\nfirstName = firstName + “son”;\n\
  ```\n\n当编译器遇到上述这样的语句时，它使用其核心 API `stringBuffer` 方法 `append()` 将该语句重写如下所示：\n\n```java\n\
  firstName = new StringBuffer(firstName).append(“son”).toString();\n```\n\n并产生输出：Johnson\n\
  \n当你使用 `toLowerCase()` 和 `trim()` 等字符串修改方法时，也会发生相似的过程。我们将在下一节中对此进行讨论。数组内容也可以通过 `Array`\
  \ 类的 `toString()` 方法转换为字符串。例如，你可以通过以下语句在标准输出设备上显示数组 `ballsCopy` 的内容：\n\n```java\n\
  System.out.println(Arrays.toString(ballsCopy));\n```\n\n在下一节中将讨论许多可用的字符串类方法。\n\n\
  ## 8.1 字符串类方法\n\n字符串类有许多工具方法，例如用于返回字符串长度的 `length()` 方法，`charAt(int)` 返回字符串中指定位置的字符，`compareTo(string)`\
  \ 用于比较两个字符串的相似性，如果字符串相似则返回整数值 0；如果比较的字符串位于提供的参数之前，则返回小于 0 的整数；如果比较的字符串位于提供的方法参数之后，则返回\
  \ 1。\n\n与 `compareTo(string)` 方法类似的方法是 `compareToIgnoreCase(String)`，区别在于它执行的是不区分大小写的比较。`trim()`\
  \ 方法移除字符串开头和结尾的空格，`toLowerCase()` 将字符串转换为小写。下面的程序列表 8.1 阐了字符串类方法的使用。\n\n程序列表 8.1：\n\
  \n```java\nimport java.util.*;\n\npublic class StringMethods\n{\n  public static\
  \ void main(String[] args){\n  String name = \"Feyisayo Dosunmu\";\n  String nameUpper\
  \ = \"FEYISAYO DOSUNMU\";\n  //Method length( ) 返回字符串的长度\n  System.out.printf(\"\
  \\n The lenght of name (name.length()) is %d \",name.length( ));\n  //Method toLowerCase(\
  \ ) 返回字符串的小写形式\n  System.out.printf(\"\\n nameUpper in lowercases (name.toLowerCase())\
  \ is %s \",name.toLowerCase( ));\n  //Method charAt(int) 返回指定位置的字符\n  System.out.printf(\"\
  \\n The character in position 3 counting from 0 (name.charAt(3)) is %c \",name.charAt(3));\n\
  \  //Method compareTo(string) 返回字符串比较的结果\n  System.out.printf(\"\\n The result of\
  \ comparing with (name.compareTo(nameUpper) ) is %d \",name.compareTo(nameUpper));\n\
  \  //Method compareToIgnoreCase(string) 返回字符串比较的结果\n  System.out.printf(\"\\n The\
  \ result of comparing with (name.compareToIgnoreCase(nameUpper) ) is %d \\n\",name.compareToIgnoreCase(nameUpper));\n\
  \  }\n}\n```\n\n程序列表 8.1 的输出在图 8.1 所示：\n\n![](img/00029.jpeg)\n\n图 8.1 程序列表 8.1\
  \ 的输出。\n\n## 8.2 正则表达式\n\n正则表达式是用于验证程序输入的字符串模式。虽然 `java` 已经了一些输入检查方法（如 `Scanner`\
  \ 类提供的方法），但这些方法在大多数输入验证场景中并不十分有效。例如，你可能需要创建自己的方法来验证电话号码或特定的安全代码数字。这时，你需要创建自己的唯一模式来验证用户的输入，而这就是通过正则表达式来完成的。\n\
  \n## 8.3 正则表达式的公式化\n\n正则表达式是通过使用可选量符和具有隐含含义的字符组合制而成的。某些字符和量符的表格如下方的 8.2 和 8.3 所示：\n\
  \n| 正则表达式字符 | 含义 |\n| :--- | :--- |\n| `\\d` | 代表数值输入并匹配单个数字，例如 1 |\n| `\\D` | 代表非数值输入并匹配单个字符输入，例如\
  \ “a” |\n| `\\w` | 代表单个字母数字字符，匹配 0 – 9, a – z 和 A – Z 范围内的单个输入，包括下划线 |\n| `/…/`\
  \ | 包裹正则表达式模式 |\n| `\\[…]` | 代表字符集或范围 |\n\n图 8.2 某些正则表达式字符及其含义的表格。\n\n| 量符 | 含义\
  \ |\n| :--- | :--- |\n| `?` | 0 次或 1 次出现 |\n| `*` | 0 次或多次 |\n| `+` | 1 次或多次 |\n\
  \n图 8.3 正则表达式量符的表格。\n\n现在，为了创建一个用于验证无限长度、可能以大小写字母开头的名称输入的正则表达式，我们采取以下步骤：\n\n步骤 1：创建一个从\
  \ A 到 Z 的大写字母范围表示起始字母，所示：`[A–Z]`\n\n步骤 2：考虑该范围的量符。在这种情况下，量符是问号，代表 0 次或 1 次出现。这适用于名称可能以大写字母开头。因此，新的表示方式所示：`[A–\
  \ Z]?`\n\n步骤 3：创建一个小写字母范围，所示：`[a–z]`\n\n步骤 4：确定创建的小写字母范围的量符。在这里，由于我们可以有无限的小写组合，合适的量符是加号（`+`），表示一次或多次出现，所示：`[a–z]+`\n\
  \n步骤 5：现在将起始字母和后续的小写组合字母结合，形成所示名称正则表达式：`[A-Z]?[a-z]+`\n\n是的，你做到了。你有一个用于验证名称输入的正则表达式。但过程并不总是如此简单，例如，制定用于有效的电子邮件地址、世界各地电话号码、万事卡号等的正则表达式并不简单。但作为一名专业的软件开发人员，你应该能够完成这些。\n\
  \n\n\n然而，本书无法详尽地介绍正则表达式，因为这显然超出了它的涵盖范畴，因为正则表达式本身是一门学科，值得专门用一本书来说。因此，作者建议你下载标题为“[[正则表达式：初级及高级程序员进阶](http://www.amazon.co.uk/dp/B00U4VPZ5U)”的正则表达式书籍。这也是作者的另一作，有助于对该主题有更深入的理解。你可以通过点击链接或在\
  \ Kindle 书店的搜索框中输入标题从亚马逊下载此书。感谢你的支持。\n\n## 8.4 正则表达式的应用\n\n`string` 类提供了一个 `matches(string)`\
  \ 方法，该方法将字符串与提供的正则表达式参数进行匹配，如果字符串匹配正则表达式，则返回 `Boolean` 值 `true`，否则返回 `false`。接下来，程序列表\
  \ 8.4 使用了我们之前在上方 8.3 节中创建的名称正则表达式模式来验证名称输入。请享用。\n\n程序列表 8.4：\n\n```\nimport javax.swing.JOptionPane;\n\
  \npublic class RegularExp\n{\n  public static void main(String[] args){\nString\
  \ nam = JOptionPane.showInputDialog(\"Please enter a name -> \");\n  StringRegex\
  \ name = new StringRegex(nam);\n  if(name.validateName( ))\n    System.out.println(\"\
  \\n You entered a valid name.\" );\n  else\n    System.out.println(\"\\n You entered\
  \ an invalid name.\");     \n  }\n}\nclass StringRegex{\n  String namToValidate;\n\
  \  public StringRegex(String n){\n    namToValidate= n;\n  }\n  public StringRegex(\
  \ ){\n    namToValidate= \" \";\n  }\n  boolean validateName( ){\n    String RegPattern\
  \ = \"[A-Z]?[a-z]+\";\n return namToValidate.matches(RegPattern);\n  }\n  }\n```\n\
  \n程序列表 8.4 的输入和输出所示方的图 8.4a 和 8.4b 中：\n\n![](img/00030.jpeg)\n\n图 8.4a 程序列表 8.4\
  \ 的名称输入面板。\n\n![](img/00031.jpeg)\n\n图 8.4b 上述程序列表 8.4 的输出。\n\n再次感谢你的陪伴，另一个章节又要结束了。情况正在变得越来越好；从这里，我们将进入更酷的异常处理层次，迫待在那里与你相。感谢你的坚持。\n\
  \n# 第 9 章\n\n# 异常处理\n\n异常是影响计算机程序平稳执行的异常程序流中断。这些中断是编译器在编译时无法检测到的程序错误，但在运行时会变得诡异地不可避免。\n\
  \n这些异常包括以下几种：`FileNotFoundException` - 你想要打开的文件由于神秘的删除操作或磁盘驱动未关闭而突然不可用；除以零异常 - 当除数因非法操作突然变为零时。为了避免这些难陋且有时不可避免的情况，引入了\
  \ `try..catch` 异常处理语句结构，用于处理可能产生异常的语句块。\n\n## 9.1 `try..catch` 语句模型\n\n与 C++ 和 C#\
  \ 中的一样，编程异常在 `try..catch` 语句块内被捕获并处理。`try..catch` 语句的通用语法如下：\n\n```\ntry{\n  一个可能抛出异常的语句块；\n\
  }\ncatch(Exception_type exception_obj){\n  异常处理语句;\n}\nfinally{\n  无论是否发生异常后都要执行的语句;\n\
  }\n```\n\n`catch` 语句块在产生任何异常时会处理该异常，而 `finally` 语句块包含一个无论是否发生异常都必须执行的语句块。\n\n##\
  \ 9.2 异常处理的益处\n\n使用 `try..catch` 语句结构的益处显而易见，因为在处理捕获的异常时不需要 `if` 语句；如果需要捕获更多异常，你只需要提供更多的\
  \ `catch` 语句块来处理这些之前未被捕获的异常即可。具体操作方法如下文所示：\n\n```\ntry{\n  一个可能抛出异常的语句块；\n}\ncatch(Exception_type\
  \ exception_obj){\n  异常处理语句;\n}\ncatch(Exception_type exception_obj2){\n  异常处理语句;\n\
  }\ncatch(Exception_type exception_obj3){\n  异常处理语句;\n}\nfinally{\n  无论是否发生异常后都要执行的语句;\n\
  }\n```\n\n这自然导致了健壮的程序设计，使程序具有可读性和易于维护性。\n\n使用 `try..catch` 语句结构的第二个益处是，你可以决定在哪个层级处理捕获的异常；是在产生点，还是在程序中更高级的方法调用层级。这是可能的，因为异常会从产生点开始沿着调用栈向上传递，直到调用方法，直到被异常处理器捕获并处理。\n\
  \n如果程序员感兴趣在方法调用层级捕获异常，他或她会在 `try..catch` 语句内编写调用语句，并且该方法必须使用 `throws` 子句进行声明，其中\
  \ `throw` 子句是 `throws` 关键字后跟异常类型，例如：\n\n如程序列表 9.1 所示，如果方法尝试访问数组边界之外的位置，则抛出 `ArrayIndexOutOfBoundsException`：\n\
