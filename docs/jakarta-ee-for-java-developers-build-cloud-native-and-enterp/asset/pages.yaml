  md: '# Creating a consumer to topic


    The main difference between a topic and a queue is noted from the consumer’s perspective.
    From the producer’s perspective, both are very similar, and the developer will
    use similar codes. As we said earlier, the topic works with a subscription and
    one subscription can have many consumers. Thus, first the subscription is created
    and then the consumer is associated with the subscription.


    A subscription can be nondurable or durable. In a nondurable subscription, the
    life scope of the subscription depends on some active consumer. It means that
    the nondurable subscription will exist while it has some active consumer. In the
    durable subscription, the subscription exists even if it does not have any active
    consumer. It means that the consumer, when associated with the durable subscription,
    will be able to read all the messages produced to the topic while the subscription
    exists. Furthermore, the subscription can be unshared or shared. In the unshared
    subscription, only one consumer is allowed to be associated with the subscription,
    whereas in the shared, the subscription can be associated with multiple consumers.
    So, now we will create a durable, nondurable, shared, and unshared subscription.
    Note that our goal here is not about the business logic, but it is possible that
    you will see some strange things from the business perspective. The goal here
    is to show you how to create the consumer topic and explore the possibilities
    of this feature.'
