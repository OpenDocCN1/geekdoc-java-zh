  md: '# Creating a CDI interceptor


    When we are developing an application, many times, we need to work with some cross-cutting
    tasks (such as logging, authorization, or auditing). Working with cross-cutting
    tasks is not so easy, because it is harder to provide a good separation of responsibility
    and code reuse. One approach to solve it is Aspect-Oriented Programming that allows
    the separation of the cross-cutting concerns. But how can we use the AOP with
    CDI and create a cross-cutting task in these cases?


    CDI Interceptor is a feature that provides a way to use the AOP based on the interceptors.
    With this, we can separate the cross-cutting concepts from the business logic
    and put them inside an interceptor that is configured to intercept some methods
    or classes and execute its tasks.


    A CDI interceptor is a class that wraps the call to a method this method is called
    a target method — runs its logic and proceeds the call either to the next CDI
    interceptor, if it exists, or the target method. A targeting method could have
    many CDI interceptors and these interceptors can be configured to run in a specific
    order. The following are the steps to create a CDI interceptor:


    Create an @InterceptorBinding to bind the interceptor.'
