  md: '# Conclusion


    The Jakarta Messaging specification is a very important specification, mainly
    in this era as we see the Cloud Native Application concept grow up rapidly. The
    Jakarta Messaging permits a low coupling between the applications, as it promotes
    an asynchronous communication and the consumer should not know about the producer
    and the producer should not know about the consumer. The consumer and the producer
    follow a logical contract regarding the data and it is just what is needed. In
    this chapter, we understood the basics of the Jakarta Messaging, and you are able
    to use this specification in a Jakarta Application.


    In the next chapter, we will talk about Jakarta Security and how to use it.'
