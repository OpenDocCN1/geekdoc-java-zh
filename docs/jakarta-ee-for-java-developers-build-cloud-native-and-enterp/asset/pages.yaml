  md: '# Preface


    The Java ecosystem has had many changes in its tools and approaches, generated
    by new challenges that came from Cloud Computing. Cloud Computing did force the
    developer to rethink its processes to developer application, its architectures,
    and approaches, and came to a new concept called Cloud Native Application. With
    this, the Java ecosystem needs the be rethinking as well, and the communities
    and companies started a big change in the Java ecosystem. One of these updates
    was the rebrand of Java EE to Jakarta EE and its new process to evolve this specification
    over the Eclipse Foundation.


    In this book, we explain the rebrand of the Java EE to Jakarta EE, and how the
    new evolve process works. It is very important to understanding the Jakarta EE
    moment and to know what is expected by this specification. Furthermore, we talk
    about the changes applied between the Java EE 8 over Oracle or the Jakarta EE
    9 over Eclipse Foundation.


    This book has a practical approach and you will create one project per chapter.
    It enables you to read just the chapter you want to read because the chapters
    do not have a dependence between them. Each chapter is focused on one specification.
    Thus, this book can help you in many kinds of projects using Spring, Quarkus,
    Micronaut, or others that use some Jakarta EE specification.'
  merge: -1
  pgno: 8
