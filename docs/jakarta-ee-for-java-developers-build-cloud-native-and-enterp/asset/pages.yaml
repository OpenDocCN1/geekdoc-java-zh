  md: '# Understanding Jakarta Security


    Security is a wide concept and can appear with different approaches according
    to the context it is being used in. Security can tell us about the network''s
    security, user''s security, OS''s security, and so on. All of these kinds of security
    can impact the business rule, but the scope of the Jakarta Security specification
    does not provide a solution to all these approaches. Actually, the scope of this
    specification is to provide a user''s security mechanism managed by the Jakarta
    context. It is very important to understand as the name can lead the developer
    to think that all the security approaches are inside the Jakarta Security. This
    raises the question, what does the user need as security in general?


    As we have said earlier, the Jakarta EE specifications provide a pattern solution
    to the enterprise problems. It means that the specification should provide a solution
    to the common problems. If it has a rare problem, the specification doesn''t need
    to care about it. With this, inside the user''s authentication scenario, the most
    common problems are about authentication and authorization.


    The Jakarta Security specification provides a set of solutions to provide authentication
    and authorization solutions managed by the Jakarta context. It means that the
    Jakarta EE has many abstractions to facilitate the developer to make authentication
    and'
  merge: -1
  pgno: 475
- img_proc: true
  md: 'authorization of the users. This specification provides a plug-in interface
    for the authentication and identity store — which has information about the user,
    that is used to validate the user — and can be used with annotation or programmatically.
    The Jakarta Security has four main features provided by the API, which are as
    follows:


    # HTTP authentication mechanism


    Identify store


    Credential


    Security context'
