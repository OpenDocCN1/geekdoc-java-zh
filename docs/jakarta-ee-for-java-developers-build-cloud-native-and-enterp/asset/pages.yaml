  md: 'The Servlet should be able to respond to multiple concurrent requests sent
    to them. To do it, the Jakarta EE web container creates one thread for each request
    and these threads share the objects stored in the Servlet context, objects stored
    in the HTTP session, and any resource that is in the instance variables of the
    servlet. The resources, objects, or values that are inside the requests or response
    instances are not shared between the requests. Thus, the developer should pay
    attention to the questions about concurrency to avoid the side effects. Therefore,
    if we create or access an instance variable of the servlet [sic: servlet] inside
    any of the HTTP methods of the servlet mentioned earlier, such as **doGet** and
    we must be aware that the very same servlet instance is reused between all the
    requests hitting the servlet. As a tip for the best practice, avoid assigning
    the request or session scoped variables as the instance variables of the servlet.'
