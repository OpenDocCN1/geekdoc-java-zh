  md: '# Understanding how the Jakarta Enterprise Bean manages the transaction


    In the real world, many applications should execute the processes as a transaction,
    which means that it should execute the processes as a unique and isolated unit.
    In case of any error, all the steps done should be undone. The relational database
    provides a way to execute the write operations inside a transaction, and the database
    manages the consistency and isolation. The relational databases work with the
    ACID transactions, which means Atomicity, Consistency, Isolation, and Durability.
    The ACID concept is described as follows:


    It is the everything or nothing concept. Either all the steps of the process inside
    the transaction are executed or nothing is executed.


    It guarantees that the data are consistent according to the data roles. In case
    of any inconsistency detected, the entire transaction is undone (or rolled back).


    A running transaction should not be interfered by another transaction. In case
    of multiple transactions running concurrently, it should be serialized, and one
    transaction should not interfere with another one.


    The data already validated should be persisted and could not be lost in case of
    fails. Once the data is persisted, it should be kept'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'even in case of error.


    The Jakarta EE extends this concept to the other Jakarta resources such as Jakarta
    messaging, permitting another Jakarta resource to participate in a transaction
    in an easier way. It is provided by the Jakarta Enterprise Bean has a way to abstract
    the transaction management from the developer. It means that the developer does
    not need to manage the transaction by yourself but can delegate it to the Jakarta
    container.


    The Jakarta Enterprise Bean has two ways to manage the transactions, that is the
    Container-Managed Transaction or Bean-Managed Transaction In this chapter, we''ll
    focus on the CMT as it is more common to be used, but we''ll show you how to use
    the BMT as well.


    As the name suggests, in the CMT, the transactions are managed by the Jakarta
    container and the developer does not need to apply commit and rollback, nor start
    the transaction. In the BMT, the transactions are managed by the developer and
    apply the commit or roll back. Note that to us, the transaction management means
    to define the scope of the transaction and decide if the changes should be persisted
    or not.'
