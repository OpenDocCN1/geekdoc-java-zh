  md: '# Using_producer_method, producer_field, and dispose_method


    The example exposed here was about injecting simple Java classes as a CDI bean,
    but in the real world, we have some cases where we need to inject a complex Java
    class. In other words, we have a class that should execute a process to create
    and destroy an instance. As an example, we can create an instance of the class
    to represent a database connection. With this, this instance needs to execute
    a process to connect to the database and then create this instance to represent
    this connection. Similarly, it should end the real connection when the instance
    is destroyed. One pattern that can be used to do it is the method factory, to
    create the instance, but how can we do that using the CDI mechanism?


