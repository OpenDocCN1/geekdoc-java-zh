  md: '# Using JPQL


    In the relational database, the SQL is the language used to apply the read and
    write operations. It is a declarative and powerful language, as you just declare
    what you want and the mechanism creates the execution plan to deliver it. However,
    in Java, we work with OOP, and the SQL is not OOP based. Thus, the Jakarta Persistence
    Query Language that is a language search data against the persistent entities.
    The main difference is that the database works with tables, thus the SQL applies
    searches against tables, and the Jakarta Persistence works with entities. Thus,
    the SQL is not good to work inside the Jakarta Persistence as it can generate
    more complexities. In the preceding example, we saw the findAll method that has
    the JPQL a from Author As you can see, you specify the entity to provide an alias
    to this entity and ask to select the operation you want to return the alias. The
    following is a generic explanation of JPQL:


    ```

    select {alias_entity} from {entity} {alias_entity}

    ```


    If you want to use the where clause, you can use the following:


    ```

    select {alias_entity} from {entity} {alias_entity} where {alians_entity}.{property}

    ```


    Look at the following example:'
  merge: -1
  pgno: 374
- img_proc: true
  md: '```

    select a from Author where a.name="Rhuan";

    ```


    Note that in the JPQL, we navigated throughout the entity as you do navigating
    throughout some object in the Java language. It is the main difference between
    the SQL and JPQL. The same happens when you are navigating through the entities
    that have a relationship. In the SQL, you should use the JOIN to read from multiple
    tables that have a relationship, and you want to filter by some parameter of the
    other table. In the JPQL, you just navigate according to the relationship declared
    inside the entities. Look at the example as follows:


    ```

    select b from Book b where b.authors.name="Rhuan";

    ```


