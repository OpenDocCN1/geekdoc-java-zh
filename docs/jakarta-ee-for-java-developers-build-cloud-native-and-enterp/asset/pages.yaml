  md: '# Commit and rollback


    The transaction is rolled back or committed when the method that started the transaction
    ends the processing. Thus, when the method ends, the Jakarta Enterprise Bean context
    define if the transaction should be committed or rolled back. To define it, the
    Jakarta Enterprise Bean checks if the executing has generated some exception,
    and if generated, what is the type of exception.


    In Java, we have two types of exceptions, i.e., checked exceptions and unchecked
    exceptions. In practice, the unchecked exception extends RuntimeException and
    the checked exception does not extend it. When the system generates an unchecked
    exception, the transaction is rolled back at the end of the method''s execution.
    Otherwise, it commits the transaction. The other scenario of the rollback is in
    the case of some issue to commit, such as a timeout or some problem or unavailability
    of the database or resource. Thus, all RuntimeException generates a rollback.
    Note that the rollback is applied when the unchecked exception is generated and
    not treated. If the exception is treated in a then transaction should be committed.
    We can change this behavior and annotate the exception class with the If you annotate
    a checked exception with this annotation and configure the rollback attribute
    to true, the exception will generate a rollback as well.'
  merge: -1
