  md: '# Jakarta EE profiles


    Jakarta EE works with the concept of profiles, and nowadays, it has two profiles
    to work on, but in the future, we can see new profiles being born in Jakarta EE.
    You may ask, what are the Jakarta EE profiles?


    The Jakarta EE profiles are a collection of the Jakarta EE technologies and APIs
    that attend to a specific application type. Thus, the developer can choose the
    profile that is better for the application and avoiding making the imports or
    starting the Jakarta EE technologies and APIs that won''t be used by the application.
    The Jakarta EE profile are as follows:


    Web Profile


    Full Profile


    The web profile is a profile for the web applications that do not need to use
    the specification from the business tiers. This profile contains the web technologies
    and is focused on providing the solutions to the web problems.


    The full profile is a profile to create the heavy-weight applications that need
    to use the specifications from the business tier to solve many problems. This
    profile contains all the technologies and APIs from Jakarta EE and should be used
    only when needed.'
  merge: -1
  pgno: 50
- img_proc: true
  md: Note that the Jakarta EE profile and the tiers are not the same, but that it
    has a relation. When we talk about the tiers, we are talking about how the application
    is divided and each tier can be in one machine. But when we talk about the Jakarta
    EE profiles, we are talking about the dependencies needed by the application and
    what the technologies used by the application are.
