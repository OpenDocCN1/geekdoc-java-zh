  md: '# Creating a custom constraint


    The Jakarta Bean Validation provides some good constraints out-of-box, as described
    earlier in this chapter; however, sometimes we need a constraint that the specification
    does not provide. It is very common in the real world, and to some, that specification
    provides a way to create custom constraints. Thus, we can create our constraints
    and reuse them in any part of the application.


    To create a custom constraint, we need the annotation to bind the constraint to
    the attribute or method, and the code to be executed, and apply the validation.
    To show you an example of custom constraint, we''ll create a scenario where we
    want to validate whether a number received via POST is even or odd. To do this,
    we will first create the annotation that will be used to declare the constraint.
    Look at the following example:


    ```

    import java.lang.annotation.ElementType;

    ```


    ```

    import java.lang.annotation.Retention;

    ```


    ```

    import java.lang.annotation.RetentionPolicy;

    ```


    ```

    import java.lang.annotation.Target;

    ```'
