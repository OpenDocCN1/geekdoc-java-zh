  md: '# Creating fetch_plans and entity_graphs


    The Jakarta Persistence defines the entity properties — properties that represent
    a relationship and its type is another entity — as fetch lazy. It means that these
    properties are fetched just when needed, that is, when an operation (get) is done
    to this entity. It is good to improve the performance, as at some point, we''ll
    not need these data, thus these need to be fetched. However, at some point, it
    is better to fetch these data together as an eager fetch to avoid N+1 Query and
    some kind of performance issue.


    # N+1 Query


    In the Jakarta Persistence, the N+1 Query is a well-known scenario where multiple
    queries are applied to mount the entire entity needed. This name is such because
    it applies one query to read the main entity, and for each entity returned, a
    new query is applied to read the relationships. Look at the following example:


    Imagine we are querying the Book entity, and for each Book entity, we need to
    see the authors. Thus, the first consult retrieves 10 entities, which means, Thus,
    the number of queries will be 11 as In an overview, it is the N+1 Query. Thus,
    we should be able to define a fetch plan to our queries, and change it when needed
    in runtime.'
