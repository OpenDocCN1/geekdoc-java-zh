  md: '# Persistent schedule


    The Jakarta Enterprise Bean timer can be of two types, persistent and non-persistent.
    In the persistent timer, that is the default, the timer is persisted in the disk
    or database and the timer survives to restart. Thus, in a persistent timer, if
    the task is scheduled and the server is restarted, the task will not be lost and
    will be executed. In the non-persistent timer, the time is kept in the memory,
    and in case of restart, the task is lost.'
