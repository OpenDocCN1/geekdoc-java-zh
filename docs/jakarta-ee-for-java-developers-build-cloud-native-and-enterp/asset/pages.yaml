  md: '# Message


    The message is represented by an object that can be of these types — and These
    messages consist of a header, properties, and a body. The header message contains
    information about the identity and route, properties are additional fields that
    can be added to the message, and the body contains the content that the client
    sent to the provider.


    When a client wants to send a message to a queue/topic, it creates a producer
    and the message. Then the message is sent using the producer. Thus, the client
    that to consume the message should create a consumer and read the message. The
    message will be of the type described earlier. The messages are read-only, which
    means it cannot be modified after being sent. The same message can be sent multiple
    times.


    To show a clear example of Jakarta Messaging uses, we''ll create a scenario of
    sending an email. We''ll have one producer that will produce the message of an
