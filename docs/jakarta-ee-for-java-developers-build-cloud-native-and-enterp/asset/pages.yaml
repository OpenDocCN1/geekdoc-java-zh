  md: '# Creating a schedule


    Many times, the application needs to execute some task periodically (per hour,
    day, month, or year) and this task is not started by the user, but by the application.
    With this, we need a way to schedule a task to be executed according to a time,
    but executing the tasks have many questions that the developer should think about.
    – What is done in case of failure? How to treat concurrency?


    In general, the tasks scheduled are long-running tasks and it is possible that
    the other task can be started before the previous task finishes. It must be thought
    out.


    The Jakarta Enterprise Bean has a feature called Timer that permits us to schedule
    the tasks to be executed and the execution is managed by the Jakarta container.
    Furthermore, it can be executed as a singleton bean, taking the advantage of the
    lock of singleton. With this, the Jakarta container will manage the concurrency
    as well. The Jakarta Enterprise Bean provides a way to create a schedule using
    the annotation approach or programmatically. To show this feature, we will create
    a schedule that generates a simple log in every 10 minutes. The following is the
    class HelloSchedule that has the method logHello and is scheduled to execute in
    every 10 minutes:


    ```

    import jakarta.ejb.Schedule;

    ```'
