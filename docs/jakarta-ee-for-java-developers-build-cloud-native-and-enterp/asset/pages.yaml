  md: '# Validating_persistence


    The Jakarta Bean Validation has a nice integration to Jakarta Persistence and
    permits us to declare the constraints to the entities that are validated when
    these entities are persisted. In the case of tables autogenerated by the Jakarta
    Persistence, these tables generate the database constraints according to the constraints
    defined at the entity. As an example, if we define an attribute as not null, the
    column will not be null in the database as well.


