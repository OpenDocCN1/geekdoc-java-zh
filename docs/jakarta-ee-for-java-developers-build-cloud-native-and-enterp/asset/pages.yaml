  md: '# Understanding what Jakarta EE is


    Basically, Jakarta EE is an umbrella project with a set of technologies for the
    enterprise Java applications, with an aim to provide the technologies and APIs
    to facilitate the development of the enterprise Java applications to the cloud
    computing world. This project came from the Java EE project, which was migrated
    from Oracle to Eclipse and is now evolving under the Jakarta EE brand. But to
    really understand what Jakarta EE is, we should take a look at their antecessors,
    Java EE and J2EE, and the current enterprise challenges. So, let''s go!'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# J2EE and Java EE


    In 1999, the Sun Microsystem was releasing the J2EE starting in its 1.2 version
    and taking the first step to put Java in the web world. The main goal of J2EE
    was to create an umbrella project based on the specifications, where these specifications
    describe the details of how some sets of technologies to the enterprise systems
    would work. With this, many vendors can create an implementation of these specifications
    and the developer can develop the enterprise Java application decoupled of the
    vendor and choose any vendor that follows the J2EE specifications and change the
    vendor as well. Thus, the J2EE came as a good solution to create the Java applications
    for the enterprise world, providing a set of robust technologies and more security
    to the business — now companies can create robust solutions without creating a
    dependency on any vendor.


    J2EE was focused on the enterprise world and it has four elements in its architecture,
    these are described in the order of importance as follows:


    J2EE It is a standard platform that follows the J2EE specifications and is the
    host to J2EE applications. It is known as an application server.


    J2EE Compatibility Test A set of tests to verify if an implementation of J2EE
    follows the J2EE specifications.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# J2EE Reference Each specification should have a reference implementation
    to demonstrate how the specification works.


    Sun Blueprints Design Guidelines for It describes the standard programming model
    for the development of the multi-tier applications.


    The first J2EE version came with these specifications – Enterprise JavaBeans Java
    Servlet, Java Naming and Directory Interface JavaServer Pages Java Transaction
    Database Connectivity JavaMail. All these specifications exist and is part of
    Jakarta EE today, but with many improvements.


    The J2EE had many evolutions in its versions J2EE 1.3 and J2EE 1.4, and then in
    2006, its name was changed to Java EE starting with Java EE 5, after evolving
    to Java EE 6. Java EE 6 was the last version of Java EE under Sun Microsystem,
    because in 2010, Oracle bought Sun Microsystem and got the Java EE''s rights.
    Java EE 6 was very important because it came after many evolutions to EJB, making
    its use easier, and it came to the Context and Dependency Injection that is the
    mechanism to dependencies control of Java EE. Java EE under the Oracle control
    had two versions released – Java EE 7 released in 2013 and Java EE 8 released
    in 2017.


    As you can see, J2EE/Java EE is 20 years old and the enterprise world has evolved
    a lot in these years, and new challenges have emerged at the enterprise environment.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Cloud computing


    The complexity of the enterprise world has grown very fast and new needs emerged
    with this. As the main necessities, we can quote the fault tolerance and elasticity
    of the business. In other words, the business needs to be able to respond effectively
    to the the increasing demand, and it needs to do that with smaller risks as possible.
    Today, the business innovation basis is the technology, and the technological
    world has been worked on to provide a set of models, approaches, and techniques
    to supply these needs. Cloud computing came as one of these solutions.


    Cloud Computing is a set of techniques and approaches to serving a computational
    resource as a service with a better and easier way for the end-user. With cloud
    computing, we can have only a computational resource — such memory, disk, CPU,
    node amount — that we really need and can scale up or down when needed. With this,
    the business can save money and generate a faster and more effective response
    to the increasing demand. Using cloud computing, we can have many types of services
    like Platform as a Service Infrastructure as a Service Software as a Service Function
    as a Service and others.


    Cloud computing provides many benefits to the business, which are as follows:


    Pay per The end-user pays only for the resources used. It can save a lot of money
    for the business.'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'The environment can recover after a failure.


    **Self-service** The computational resource can be scaled up according to the
    demands in an easier and faster way, using an interface, eliminating the need
    for the IT administrators to provision and manage to compute resources.


    The computational resource can be scaled up or down at any time.


    **Fault** As the environment can be run in many local areas, across many global
    regions, this environment has more fault tolerance.


    Clearly, cloud computing comes with many benefits to the business world, but to
    take advantage of this, the application needs to be prepared to work in the cloud
    computing approach. But what does it mean?


    The old approach used for a long time in the technological world has used a monolith
    architecture — all business domains or many business domains inside the same application
    — to develop the application. The result is a big application that has many responsibilities.
    Figure 1.1 illustrates this as follows:'
  merge: -1
  pgno: 29
- img_proc: true
  md: '![](img/7a61072ef5e448b7808b9a303cdcfe41_30_0.png)


    # Figure 1.1: Monoliths


    The monolith architecture has worked very well and works very well today, but
    outside a cloud computing environment. The monolith is not adequate to take advantage
    of cloud computing, because if you need to scale up this application, you''ll
    scale all monolith, that is, you will scale all business domains inside monolith,
    and the benefit of pay only for the resources used will be lost. The resolution
    of this problem was rethinking how to architect the applications.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Microservice architecture


    Rethinking about the architecture, the software engineers and architects noticed
    that to take advantage of cloud computing, he will have to break the monolith
    into the smallest parts with fine granularity to permit scaling the only part
    that really needs to be scaled. But how can it be broken? What are the metrics
    to define the boundaries of each part?


    The microservice architecture breaks the monoliths into many small parts called
    microservice, which generally are broken according to the business domain, that
    is, each microservice has the responsibility to care about one business domain.
    Thus, the business domain is used to define the boundaries of the microservice.
    The use of the business domain as a base to define the microservices boundary
    is the approach widely used, but you can use another according to your scenario.
    But keep in mind that you should decompose to improve the ability to scale. Figure
    1.2 illustrates this architecture as follows:'
  merge: -1
  pgno: 31
- img_proc: true
  md: '![](img/7a61072ef5e448b7808b9a303cdcfe41_32_0.png)


    In a microservice architecture, each microservice has low-coupling with each other,
    and they are independent and deployable. In other words, microservices are a small
    application that runs without the need for another microservice to do that. Those
    microservices integrate with each other when needed, to provide a response to
    the end-user. It is very good, but now the software engineers and architects have
    other problems. How will those microservices be managed and how will those applications
    be integrated with each other without becoming chaos? How to discover a new microservice
    when a new microservice service is born? How to load-balance those microservices
    and how will those microservices be scaled up and down without a side effect?'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Twelve-factors


    The twelve-factors is a methodology that defines a set of steps (twelve steps)
    to building the software-as-a-service apps. Basically, when we create the microservices
    apps and run them in a cloud environment, we are creating a software-as-a-service
    because our software is exposed as a service to the end-user. An application totally
    compliant with the cloud is called a cloud-native application.


    The twelve-factors is a guide to develop the applications capable to take advantage
    of cloud computing. In other words, when we follow all the steps of the twelve-factors
    guide, our applications microservices are a cloud-native application and is totally
    compliant with the cloud computing approach. The following are the twelve factors:


    One codebase is tracked in the revision control, while many deploy.


    Explicitly declare and isolate dependencies.


    Store config in the environment.


    **Backing** Treat the backing services as attached resources.


    **Build, release,** Strictly separate the build and run stages.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Execute the app as one or more stateless processes.


    Export the services via port binding.


    Scale-out via the process model.


    Maximize robustness with a fast startup and graceful shutdown.


    **Dev/prod** Keep development, staging, and production as similar as possible.


    Treat logs as event streams.


    **Admin** Run admin/management tasks as one-off processes.


    In this chapter''s stage, you can note that we had many changes about how to architect
    the software. The applications have needed to make communication with each other
    and improving their management. But, coming back to Java EE, how does Java EE
    behave in these new scenarios?


    Java EE had many gaps with those changes, because although Java EE has many strong
    specs, it does not have the specs to solve the problems about cloud computing
    and microservices. So, Java EE needed change.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Jakarta EE Goals


    Java EE 8 was migrated to Eclipse Foundation and is now Jakarta EE with new goals
    and a new process to evolve.


    Jakarta EE has a goal to accelerate the business application development for cloud
    computing, promoting many solutions based on the specifications worked by many
    vendors. Basically, Jakarta EE is a set of specifications with its **Technology
    Compatibility Kit** to test if an implementation is compliant with the specification.
    With this, all the vendors that create an implementation to Jakarta EE will only
    be granted compliance to Jakarta EE if it is approved on test with TCK.


    The first changed applied to Jakarta EE was the process of evolving. Java EE works
    with the **Java Community Process** to improve its features, but JCP is not compatible
    to attend to the changes promoted by cloud computing, because the changes in cloud
    computing happen fast and JCP''s speed cannot keep up. Thus, Jakarta EE works
    with another process called **Jakarta EE Specification Process**'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Jakarta EE Specification Process


    Jakarta EE 8 started Jakarta EE in a new process called Jakarta EE Specification
    Process The JESP is the process used by the Jakarta EE Working Group — responsible
    for managing the changes and improvements on Jakarta EE — to evolve Jakarta EE.
    This process is based on Eclipse Foundation Specification Process with some changes.
