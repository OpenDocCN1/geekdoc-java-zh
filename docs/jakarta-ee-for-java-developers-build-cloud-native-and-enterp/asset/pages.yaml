    in a declarative way, by annotations. It means that you can define the constraints
    to the objects and their properties and methods just by annotating the method
    with an annotation that represents the constraint you want. The code to validate
    the input can be abstracted from the business codes. Furthermore, the code to
    validate can be reused without a problem in many objects. You can call the validation
    programmatically as well, without using an annotation. Look at the following example:


