  md: '# Server_applications


    The Jakarta EE application generally is a system that is accessed by HTTP and
    makes the integrations with the other applications — Jakarta EE applications or
    not — Thus, Jakarta EE has the server application, and the Jakarta EE applications
    are deployed in a server application to process its tasks and be able to be accessed
    by the uses and systems. But what does the Jakarta EE''s server application have,
    that is special and different from the other servers?


    The server applications in Jakarta EE are servers that implement the Jakarta EE
    platform API and provides the standard Jakarta EE services. In other words, the
    server applications provide the implementations of each specification, meeting
    the TCK tests. Besides that, the server application provides the Jakarta EE container
    that is the Jakarta EE''s heart.


    The Jakarta EE container is responsible for providing many abstractions, where
    the developer does not need to care about many things because the Jakarta EE container
    already cares for him. As examples of things that can be cared for by the Jakarta
    EE container are transactions, bean life-cycle, and others.


    The Jakarta EE container is divided into three types, which are as follows:'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'Jakarta EE web container


    Jakarta EE application client container


    Jakarta EE enterprise beans container


    The Jakarta EE container is the interface between the web components and the webserver,
    and it promotes many abstractions to work with the web components and web resources.
    The CDI bean life cycle is managed by this container.


    The Jakarta EE application client container is the interface between the Jakarta
    EE application clients and the Jakarta EE server. This is used less nowadays because
    it was used more by the Enterprise Beans clients that consumed the Enterprise
    Beans service.


    The Jakarta EE enterprise beans container is the interface between the enterprise
    beans and the Jakarta EE server. This container manages the executions, life cycle,
    transaction, and the others from the Enterprise Beans components. Throughout this
    book, we will see many of these abstractions in practice.


    When we start up a server application, the server application starts each Jakarta
    EE container and resources and makes them available to the deployed applications.
    Furthermore, the server application manages many questions about clustering a
    Jakarta EE application and provides the facilities when we want to make a cluster
    of the Jakarta EE applications.'
  merge: -1
