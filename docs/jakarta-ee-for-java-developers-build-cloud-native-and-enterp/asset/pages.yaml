  md: '# Understanding Forward and RequestDispatcher


    The **RequestDispatcher** is a useful feature that provides support to forward
    or include another resource to make a response. Basically, the Servlet has an
    object from **RequestDispatcher** and it has the methods, **include** and to call
    these functionalities.


    # Forward


    The **forward** is used when we want to transfer the control of the processing
    to another web component to generate the response. In other words, the responsibility
    to generate a response is of the servlet forwarded.


    # Include


    The **include** is used when we want to include another web component in the response,
    but the control of the processing still is of the servlet that makes the include.


    When we apply a forward or include, the attributes of the request is shared between
    the web components. So, the attributes will be exactly the same. Look at the following
    example where we have a servlet that makes an include or forward according to
    the parameter sent:


