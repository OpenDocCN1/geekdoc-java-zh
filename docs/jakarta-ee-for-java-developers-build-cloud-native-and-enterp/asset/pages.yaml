  md: '# From Java EE to Jakarta EE


    The migration for Java EE from Oracle to Eclipse Foundation was not simple, because
    many questions emerged at this stage, and the community needed a lot of work to
    respond to these questions in a satisfactory manner. The main question that emerged
    was the Java name because Oracle gave in the Java EE to the community, but the
    trademark Java still belonged to Oracle. It meant the Eclipse Foundation or the
    community could not use Java in the project''s names or namespaces, but the Java
    EE had Java in its name and it had the javax in the namespace. So, the community
    needed work to solve it and change all the namespace containing javax.


    With this, the first change in the migration of Java EE to Jakarta EE was to create
    a new process to evolve as discussed previously, and to update the namespace from
    javax.* to jakarta.* Jakarta EE 8 was released without changing the namespaces
    because this version only focused on the update of the process. The update in
    the namespaces was applied on Jakarta EE 9.'
  merge: -1
  pgno: 43
