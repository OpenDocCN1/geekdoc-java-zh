    method, we should configure this method with the @Produces annotation. When an
    application has many producer methods, the application should know what the producer
    method is used to call. To make this differentiation, we create a qualifier. We''ll
    see it in the example covered in the following section. In the preceding example,
    we will have a class called MessageWriter'
