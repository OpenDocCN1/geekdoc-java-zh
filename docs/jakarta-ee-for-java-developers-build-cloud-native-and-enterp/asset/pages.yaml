  md: '# Jakarta RESTful web service


    To understand what the Jakarta RESTful web service is, we need to understand what
    the Representational State Transfer is, and what is the problem it resolves. Nowadays,
    integration between applications have become more of a necessity. With this, the
    manner in which these applications integrate has also evolved a lot. These evolutions
    brought us the Application Programming Interface across the internet that permits
    us to expose functionalities to be accessed in a decoupled and easier way. In
    this chapter, we''ll not explain in depth the API concepts nor the REST concept,
    because it is a subject that can generate another book, but we will explain how
    to implement it using the Jakarta EE approach. However, we need at least a brief
    introduction about REST. So, let go.REST is an architectural style that is very
    used to building API to make the communication between applications and/or between
    the backend and the frontend. This architecture provides a loosely coupled, lightweight,
    and stateless communication. It is provided over the HTTP protocol that is a stateless
    protocol, which is ideal to the REST style. In the REST, data and functionalities
    are exposed as a resource that can be accessed via Uniform Resource Identifiers
    These resources have a contract that must be satisfied to work correctly. A contract
    means a well-known pattern to consume the resource, which is known by the consumer
    (client). As it is very lightweight, the contract, in general, is very simple
    and around the data and URI, and does not have another complexity as the old remote
    EJB or SOAP.'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'Each functionality is a resource, and each resource has a URI. A resource is
    self-descriptive and can be exposed in many formats (JSON, XML and others). Furthermore,
    it has a uniform interface that can expose the create, read, update, and delete
    operations, and provide a stateless communication.


    In the frontend and backend communication, when we use REST to provide the communication,
    it turns the backend and frontend loosely coupled. When used to integrate applications,
    it turns these applications loosely coupled as well. It is very common to use
    REST in both the cases.


    Okay, we understood that the functionalities are resources and resources are accessed
    by a URI, providing a loosely coupled with who is accessing it, but we are yet
    to understand how the REST approach is implemented by Jakarta RESTful Web Service,
    and how we can use this interesting style using the Jakarta EE approach?


