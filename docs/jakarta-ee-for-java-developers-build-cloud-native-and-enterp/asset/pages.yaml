    application. This pattern is implemented by the Jakarta Enterprise Bean, which
    guarantees just one instance by the application. The singleton bean works similar
    to the stateless bean regarding the reuse of the instances, but the difference
    is that the stateless bean has many instances and the singleton has just one instance.
    Thus, we can say that the singleton bean implements the singleton pattern, and
