  md: '# Creating a CDI decorator


    When we are developing an application, sometimes it is interesting to add the
    behavior related to the business logic to some class, but without changing the
    class. If we analyze, we can do it by using the CDI interceptor, which was covered
    previously, but it is not the correct approach. The CDI interceptor was created
    to work with the cross-cutting concepts, and in this case, we want to add the
    behaviors that are not a cross-cutting concept but a business logic.


    The CDI decorator permits us to add new behaviors to some bean without changing
    the bean but by creating a class that will intercept this bean and perform the
    auditioning of the behavior.


