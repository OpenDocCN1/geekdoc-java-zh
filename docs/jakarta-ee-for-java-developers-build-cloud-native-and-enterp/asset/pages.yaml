  md: '# Understanding how to use server-sent events


    The HTTP protocol is a stateless protocol. It means the client sends a request,
    the server responds the request, and the connection is closed at the response''s
    end. But what can we do to keep the connection open? How can we receive messages
    from the server without sending another request to ask the server about new information?
    One good scenario of this problem is a chat app. When a user sends a message,
    all the users registered to the listener message needs to be notified about the
    new message. How to do that using the HTTP protocol?


    In the past, the common solution was implementing the long pooling approach in
    the server and keep the connection open. Later, the WebSocket came to solve this
    problem, but it is not an HTTP solution, and it can impact many points that are
    expecting an HTTP conversation. One example is, when you are using the reverse
    proxy or/and load balancer in front of your application, you''ll need a special
    configuration to use WebSocket. Thinking in it the Server-Sent Events was created.


    The SSE permit registering clients to listener events from the server. The SSE
    permit the client to open a connection and keep it opened to listen to all event
    or messages from the server. With this, using the example of the chat app, the
    SSE permits a client to register to receive messages from the server, without
    make a new request to the server. It is very good, but how can we use the SSE
    with Jakarta RESTful Web Service?'
