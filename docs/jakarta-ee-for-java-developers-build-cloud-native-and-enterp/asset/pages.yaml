  md: '# Using CDI event


    We can develop an application in many ways using many approaches and paradigms
    according to the need. One of these approaches is reactive programming, which
    permits us to develop the codes that react to a data stream and perform some tasks
    in an asynchronous way. With this, we generate an event as a data stream and some
    observers react to these events.


    The CDI Event is a feature from CDI that permits us to use the reactive programming
    approach using CDI. This feature is based on the Observer pattern, which creates
    an observer to observe some event and react to them. It can work both in a blocking
    and a non-blocking way. In a blocking way, the event launcher and observer are
    executed in the same thread, and in the non-blocking, the event launcher and the
    observer are executed in different threads.


