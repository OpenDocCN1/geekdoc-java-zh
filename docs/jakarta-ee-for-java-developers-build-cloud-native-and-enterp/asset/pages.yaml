  md: '# Conclusion


    The Jakarta Bean Validation is a very useful specification from Jakarta EE. It
    has the integration with many other specifications from Jakarta EE like Jakarta
    Persistence and Jakarta RESTful, which makes it easier to use them. Providing
    validation can be a boring task and ruin the code. The Jakarta Bean Validation
    avoids these problems and provides an easy mechanism to validate the data. This
    specification is very commonly used inside the Java ecosystem, by the Jakarta
    application, and others like Spring, Quarkus, and others.'
