- img_proc: true
  md: '# Understanding the Jakarta Enterprise Bean


    As written in Chapter 1, Introduction to Jakarta EE is multitier, and in general,
    it has three tiers – presentation tier, business tier, and integration tier. The
    business tier is the tier that has the business logic or business rule. The Jakarta
    Enterprise Bean, denoted in the past as EJB, is the Jakarta component provided
    to care about the business aspect and separate the business rule from the other
    tiers. The Jakarta Enterprise Beans provides many features to treat the business
    rule. As an example, we can quote the transaction. Generally, a business rule
    should run as a transaction implementing the all-or-nothing concept. Note that
    when I''m talking about the transaction, I''m not talking about just the database
    transactions, but the transactions that can include the other components, like
    messaging.


    The Jakarta Enterprise Bean has a container that provides many kinds of abstractions,
    permitting us to delegate some questions that are not related to the business
    rules to the container. With this, we can care more about the business rules.
    Another example is when we need to schedule a task to execute. Without the Jakarta
    Enterprise Bean, we need to create some schedule using something like cron and
    make the logic to treat the concurrency using the file system. Using the Jakarta
    Enterprise Bean, we can create the schedule using just an annotation and we can
    create the class as a singleton bean. Thus, the Jakarta Enterprise Bean will manage
    the calls and the concurrency. As you can see, the'
  merge: -1
  pgno: 271
- img_proc: true
  md: Jakarta Enterprise Bean has many interesting features that will be explained
    in more detail throughout this chapter.
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Session beans


    The session beans are the classes managed by the Jakarta Enterprise Bean container
    that encapsulates the business logic that can be invoked by a client (another
    Jakarta EE component or simple classes). The session bean can be of three types
    – stateless, stateful, and singleton.


    The stateless session bean does not keep the conversation state. Thus, the developer
    should not keep the states in this kind of session bean, mainly because the instances
    of the stateless are pooled and it can cause some problems. We''ll talk a little
    more about the stateless in the following section.


    The stateful, different than stateless, is used when the developer wants to keep
    the conversation state between the client and the session bean. Note that the
    concept of the client here is a Jakarta EE component or simple classes that invoke
    the session bean. The conversation state will be kept while the client has the
    reference to the instance of the session bean. We''ll talk a little more about
    the stateful in the following section.


    The singleton is an interesting kind of session bean because it implements the
    singleton pattern, which means it will be only one instance in the entire application.
    Throughout this chapter, we''ll see that the singleton is very similar to the
    stateless when we are talking about the functionality, but the difference is that
    the'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'singleton has only one instance of the session bean to the entire application.


    Note that the session bean scope is managed by the Jakarta Enterprise Bean container
    and the developer does not keep it, but the developer should know it to use the
    session bean in a better way.


    Now that we have overviewed the session bean, you can question about the message-driven
    beans. Why don''t we quote the message-driven bean as a session bean? Is the message-driven
    bean a session bean? The answer is no, it is not a session bean. Different from
    the session bean, the message-driven beans are not called by a client. We''ll
    see it in more detail throughout the chapter as well, but the main information
    here is, using the session bean, the client invokes it programmatically. Thus,
    the message-driven bean is called by the container, and it cannot be looked up
    using Java Naming and Directory Interface nor using the CDI.'
  merge: -1
