    # Configuring a CDI application


    The CDI provides a way to configure the CDI application using a deployment descriptor
    called beans.xml. This deployment descriptor is optional, and the CDI is able
    to work without this file. Similar to the other deployment descriptors used in
    Jakarta EE, the configurations inside the **beans.xml** are used as an additional
    configuration to the annotation configurations. In case of a conflict of configuration
    between the annotation and the **beans.xml** overrides the annotation settings.
    A CDI application can be either an implicit bean archive or an explicit bean.
    The following is an explanation of these two CDI application types:


    **Implicit bean** It is an archive (JAR, WAR, EAR, and others) that either does
    not contain the beans.xml, but contains some beans annotated with a CDI scope,
    or contains the beans.xml with the bean-discovery-mode set to be annotated. In
    this type, only the annotated beans with a CDI scope will be managed and injected.


    **Explicit bean** It is an archive (.JAR, .WAR, .EAR, and others) containing a
    **beans.xml** with the bean-discovery-mode attribute set'
