  md: '# Understanding what is Jakarta Servlet


    The Jakarta Servlet is a technology that provides support to the network communications
    in a request response way. In other words, Servlet permits communications where
    a requester applies a request to the server and the server sends back a response.
    It can support any protocol, but the Servlet specification requires HTTP support
    because HTTP is the most commonly used protocol. With this, in this book, we will
    only work with Servlet over HTTP.


    In the Jakarta Servlet, we create a Servlet class that is responsible to process
    the requests and send a response to the requester. Each Servlet class is responsible
    to process the request according to the listener configuration. A listener configuration
    can be provided by annotation or by deployment descriptor Throughout this chapter,
    we''ll see what a listener configuration is and how we can create it. For now,
    you don''t need to think about it.


    A Servlet class extends the jakarta.servlet.http.HttpServlet class and has the
    methods to handle each HTTP method, and we can override them when we want to insert
    a behavior to a respective HTTP method request. The following are the methods:


    ```

    doGet(HttpServletRequest req, HttpServletResponse resp)

    ```


    ```

    doHead(HttpServletRequest req, HttpServletResponse resp)

    ```'
  merge: -1
  pgno: 62
- img_proc: true
  md: '```

    doPost(HttpServletRequest req, HttpServletResponse resp)

    ```


    ```

    doPut(HttpServletRequest req, HttpServletResponse resp)

    ```


    ```

    doDelete(HttpServletRequest req, HttpServletResponse resp)

    ```


    ```

    doOptions(HttpServletRequest req, HttpServletResponse resp)

    ```


    ```

    doTrace(HttpServletRequest req, HttpServletResponse resp)

    ```


    Besides that, the Servlet class has the service method that is the method called
    when a request is received, and this method calls one of the methods described
    earlier, according to the request''s HTTP method. Generally, when we create one
    code to be executed in all the requests independently from the HTTP method, we
    override the service method, writing the logic code there. We will see it soon.


    # Servlet lifecycle


    A Servlet has a well-defined life cycle that is managed by the Jakarta EE container;
    thus, the developer does not need to care about the life cycle. Besides that,
    the developer can write some actions or behaviors to be executed in each step.
    Thus, when a request is mapped to some Servlet, the Jakarta EE container executes
    the following steps:'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'If an instance of the servlet class does not exist, then the container creates
    the instance. The servlet can be started either when the container is started
    or when the container detects that the servlet is needed.


    The servlet is initialized by calling the **init** method. In case the developers
    want to insert some actions or behaviors at initialization time, he can override
    the **init** method.


    After the servlet was initialized, the servlet is able to treat the requests.
    When a request is sent, the **service** method is called which is responsible
    for handling the request. The service method receives **ServletRequest** and **ServletResponse**
    instances that represent the request and response respectively. In a **service**
    method delegates the execution to a HTTP method or others described earlier) according
    to the HTTP protocol. If the developer wants to write one action for all the HTTP
    methods, he can override the **service** method.


    When the servlet is removed, the **destroy** method is called. Thus, if the developer
    wants to write one action to be executed at the remove time, he can override the
    **destroy** method.


    These are the steps of the servlet life cycle, and each step executed by the Jakarta
    EE web container.


    # Multithreading'
