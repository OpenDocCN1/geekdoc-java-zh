  md: '# Understanding the Jakarta EE Tiers


    The Jakarta EE has a distributed multitier application model, but it has three
    well-known and widely used tiers, which are – presentation tier, business tier,
    and integration tier. In the past, it was very common to use the presentation
    tier and the business tier in different packages and a lot of the time went in
    running the different hosts. Over time, this approach was no longer used and these
    tiers were put together in the same package inside an EAR project and WAR project.
    Nowadays, the application that uses this approach, in general, is a legacy project.


    Jakarta EE is built based on the components and these components are a self-contained
    unit that can communicate with each other’s components. Each component is related
    to one tier, although some components work in multiples tiers, [such as Jakarta
    Contexts and Dependency Injection each component is native to one-tier. Thus,
    the component from the presentation tier is known as web components and the components
    from the business tier are known as business Figure 1.3 illustrates these tiers
    as follows:'
