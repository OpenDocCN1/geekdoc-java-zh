  md: '# Using Nonblocking I/O


    Asynchronous processing is a good servlet feature to improve the performance of
    the servlet threads and permit a thread to be available to respond to the other
    requests. But, imagine you are receiving a request and the network is very slow.
    The receiver will read the data faster than the requester can write and the result
    will be a momentarily sitting idle of the receiver. Thus, even with the asynchronous
    processing, the servlet thread will be kept for a long time and will decrease
    the performance. Note that we are talking about the input/output stream between
    the client and the server.


    To solve this problem, the servlet has the Nonblocking I/O feature that permits
    reading and writing the data asynchronously to a listener when the data is available.
    This mechanism creates a separated thread-safe to read and write the data. As
    a result, the servlet thread responsible for receiving the requests won''t wait
    for the read/write to finish to be available for the other requests.


    To use the Nonblocking I/O, you should enable the async request processing in
    the servlets and filters, like in the asynchronous processing. The following is
    an example of Nonblocking IO:


