  md: '# EntityManager


    The EntityManager is the main element to apply the operations of reading and writing
    to the database and manage the entities. The EntityManager has a persistence-unit
    context that a set of entities can participate in. The persistence context can
    be configured by the persistence-unit, which we will see soon in this chapter.
    Thus, each EntityManager is associated with a persistence-unit that has a set
    of configurations to the persistence context. The set of configuration is defined
    by the persistence.xml inside the METAINF folder. It is very important to note
    that the Jakarta Persistence specification does not provide a way to externalize
    this configuration. It should change in the future as the externalization of configuration
    is important to the Cloud-Native Application. For now, the persistence.xml should
    be in META-INF. Thus, it should be placed as src/main/resources/META-INF or


    To build an instance of the Jakarta Persistence has the EntityManagerFactory to
    read the persistence-unit and create an instance of The following is an example
    of building an EntityManager''s instance using


    ```

    EntityManager factory = Persistence

    ```


    ```

    EntityManager entityManager =factory.createEntityManager();

    ```'
