    if the user makes a wrong input to these applications?


    In the real world, the applications need to predict the scenarios of a wrong input
    — like an empty input or invalid data — and provide the treatment to these cases.
    In general, however, it can ruin the business codes with many codes that are not
    necessarily from the business logic. Depending upon the validation, the code can
    be very large. One example is the validation regarding the CPF number — number
    of a Brazilian document — that calculates the 11''s module to tell if it is a
    valid number.


