  md: '# Controlling concurrent access to entity data


    In the real world, an application could manage many transactions that operate
    concurrent writes to the database. Though it serializes the operations and isolates
    them, you can have a problem with dirty reading. Thus, it can generate problems
    for the business rule. Table 6.2 shows you an example of dirty reading as follows:


    | follows: follows: |

