    Knowing how these session beans work is very important in creating a good project
    using the Jakarta Enterprise Bean. The first thing to know about the session beans
    is that these are managed by the Jakarta Enterprise Bean''s container, which means,
    it should not be managed by another mechanism. It''s the motive that you should
    not use the session bean as a class to be persisted or used as an entity. The
    session bean should be just a wrap of the business logic and be managed by the
    Jakarta Enterprise Bean''s container.


