- img_proc: true
  md: '# Understanding the Jakarta Persistence


    In the real world, almost all applications integrate into some database. In the
    past, these databases were relational databases, and although this has decreased
    because NoSQL has increased in the market, the relational database is still widely
    used. We know that the relational database works with the tables and relations
    between these tables, the Java applications work in the Object-Oriented Programming
    paradigm, which is different from the relational paradigm. It generates the object-relational
    impedance mismatch.


    Thus, it is very common to see a class of frameworks called Object-Relational
    Mapping that works as an adapter between these paradigms, mapping the tables and
    their relationships to the objects called Many languages have the ORM frameworks
    to solve it, and in the Jakarta umbrella, it has Jakarta Persistence.


    The Jakarta Persistence is a specification to the ORM framework that provides
    a set of features to mapping, reading, and writing the data from the relational
    databases abstracting many difficulties of these operations. Because of this,
    the developer does not need to care about implementing these things and can therefore,
    care more about the business rule. Furthermore, in some cases, the use of Jakarta
    Persistence can improve the performance of the access to data, as it works with
    the first-level cache and secondlevel cache. It has done good work regarding the
    prepared'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'statement as well, caching the prepared statement to reuse. Although the Jakarta
    Persistence is a good solution and improves the performance in some cases, the
    developer should pay attention when they are using it and creating the mapping,
    because an issue in the mapping can decrease the performance a lot. Thus, I suggest
    you study this chapter carefully.


    The Jakarta Persistence is a tier over the JDBC, thus, in the background, the
    Jakarta Persistence executes the JDBC, but it is abstracted to the developer.
    Thus, we can split the Jakarta Persistence into three parts, which are as follows:


    Entity


    EntityManager


    JDBC Driver


    Although the JDBC is not provided and maintained by Jakarta Persistence, it is
    listed here because Jakarta Persistence uses it and you should select the JDBC
    driver according to the database. It is the JDBC driver that makes the communication
    with the database.'
  merge: -1
