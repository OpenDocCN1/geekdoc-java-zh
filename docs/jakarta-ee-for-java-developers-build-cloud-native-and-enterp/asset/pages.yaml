  md: '# Asynchronous_processing


    In the Jakarta EE platform, each request stay done to a Servlet is processed by
    a thread. These threads stay in a pool of container threads and after processing
    a request, it is returned to the pool of container threads. With this, the request
    processing needs to be very fast to release the thread to another request processing.
    It is very important, because it can boost or degree the application performance
    a lot according to the use of these threads. But, sometimes we need a long-term
    process to execute some kind of hard process. In these cases, we can use the asynchronous
    processing disposed on the Jakarta Servlet.


    The asynchronous processing in the servlet permits us to delegate the execution
    to an asynchronous process managed by the context that will generate the response
    to the client. Note that the client will keep waiting to respond, but the difference
    is that the execution will happen in another thread, permitting the servlet thread
    to be released to execute another request. As an example, we will create a servlet
    class called that will emulate the behavior of creating reports. Look at the following
