  md: '# Stateless bean


    As said earlier, the stateless beans are session beans created to process the
    task that does not keep the states in the class. You can create some properties
    in the session bean and keep the states, but the stateless does not guarantee
    that all the calls to the stateless bean will be processed in the same instance.
    With the stateless bean, each call can be processed by different instances, that
    are pooled to wait for the next call. Besides, it does not guarantee the same
    state to the same client, the state of the stateless can be shared by multiples
    clients. It is dangerous. So, never keep the states in a stateless bean.


    When we create a stateless bean, the Jakarta Enterprise Bean creates the instances
    of the stateless on demand by the container and puts these to a pool of instances
    to be reused. These instances keep waiting for the call to process the tasks.
    After the call, the stateless comes back to the pool of instance, to be reused
    by another client. This makes sense, as the stateless are built to be used when
    the developer doesn''t want to keep the states. A motive to keep the instances
    in a pool is the performance, as the instance will be reused, and the application
    does not need to initialize a new instance. Furthermore, it avoids as you know
    the exact amount of instance will be created. Thus, instead of an overload generating
    an probably it will generate a performance issue, that tends to be less serious.'
