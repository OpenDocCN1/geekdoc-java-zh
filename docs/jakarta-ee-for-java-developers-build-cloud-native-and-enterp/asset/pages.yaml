  md: '# Jakarta NoSQL


    When we are writing a new application, we''ll probably need to write a persistence
    module, because almost all applications integrate into the databases to persist
    the data. So, integrating to the database is a common problem in the enterprise
    application and Java EE created the Java Persistence API that is a Java EE solution
    to this common problem about database integration. In the past, almost all applications
    have used a relational database, so JPA was built with the relational databases
    in mind.


    Now, in Jakarta EE, the Java persistence API became Jakarta persistence, but as
    we said, this specification was built with relational databases in mind. But,
    when the cloud computing concept grew, the NoSQL database''s uses grew as well,
    because the NoSQL databases, in general, are very easy to scale, which is very
    useful to the cloud computing environment. Thus, Jakarta EE needed to provide
    an improvement to provide a common solution to the NoSQL databases.


    Jakarta NoSQL is the answer of Jakarta EE to the problems about integration with
    the NoSQL database and is the first specification to be born inside Jakarta EE.
    But why not improve Jakarta persistence to attempt to the NoSQL database instead
    of creating a new specification? To respond to that, we''ll need to take a closer
    look at the NoSQL database concepts and the challenges to work with them. In this
    book, we''ll not dive deep into the NoSQL'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'database concepts, but we will have a small overview of these concepts only
    to understand the Jakarta NoSQL goals.


    The first thing to know about the NoSQL database is that there is no standard
    for these databases. This means that each NoSQL database can work in a particular
    manner and can have its own features that differ from each other. Although NoSQL
    database does not have a standard, these are classified into four categories,
    which are as follows:


    Column


    Document


    Key-Value


    Graph


    Another characteristic between almost all the NoSQL databases is that they do
    not work with transactions like a relational database, and the developer needs
    to care of that when the application needs a transaction.


    At this point, we can already see a big difference between the NoSQL database
    and the relational database, and we can understand why it was needed to create
    a new specification to work with the NoSQL database. Now, we can explain more
    about the Jakarta NoSQL goals.'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'Jakarta NoSQL has a goal of providing an API to integrate the Java applications
    to the different NoSQL databases, with a common API to work with the different
    types of NoSQL databases. With this, in Jakarta EE, you will have a standard way
    to integrate with many NoSQL databases. To each category of the NoSQL database,
    the Jakarta NoSQL will have a module to work with this category. So, Jakarta NoSQL
    will have the following:


    Column communication API


    Document communication API


    Key-value communication API


    Graph communication API


    Mapping API


    Note that we have the mapping API module. This module is not related to the communication
    but is a layer based on annotations and CDI to preserve the integration with the
    other Jakarta EE specifications.


    Each module will have its own TCK, which means, we can have a vendor that is totally
    compliant to one module but is not compliant with another module.'
  merge: -1
  pgno: 40
- img_proc: true
  md: Jakarta NoSQL brings a big advantage to the developers because it creates a
    standard API built, with the workings of many vendors, promoting a stable solution
    to the NoSQL database integration. Furthermore, the developers do not need to
    care about the specific details of the NoSQL database, because Jakarta NoSQL creates
    an abstraction layer that abstracts the details of the NoSQL database from the
    developers. This specification is expected for Jakarta EE 10.
