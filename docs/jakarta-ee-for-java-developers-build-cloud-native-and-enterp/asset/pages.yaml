- img_proc: true
  md: '# Understanding the Jakarta Messaging


    When we develop an enterprise application, in general, this application communicates
    with the other applications. Thus, many times, the enterprise application needs
    to send the messages to each other in a loosely coupled and asynchronous way.
    With this, the enterprise application should have some known way to send the messages
    between these applications. The applications that will make a communication should
    know the message pattern and how to send and receive the messages. important to
    integrate the applications in a good way because if all the applications know
    the message''s patterns, all the applications will know how to send and receive
    the messages. With this, the Jakarta EE is the Jakarta Messaging to provide a
    solution based on the specification and to treat the integration between the Jakarta
    applications using the messaging approach. The specification at


    https://jakarta.ee/specifications/messaging/3.0/jakarta-messaging-spec-3.0.pdf
    describes the following aims to Jakarta Messaging:


    objectives of Jakarta Messaging are:


    +   to provide Java applications with the messaging functionality needed to implement
    sophisticated enterprise applications


    +   to define a common set of messaging concepts and facilities'
  merge: -1
  pgno: 416
- img_proc: true
  md: 'to minimize the concepts a Java language programmer must learn to use enterprise
    messaging products


    to maximize the portability of Java messaging applications between different messaging
    products."


    Jakarta Messaging defines the producer that produces the message and sends it
    to a queue or topic. It defines the consumer as well, that consumes the message
    from the queue or topic. Throughout this chapter, we will explain the difference
    between a queue and a topic, but work with the First In First Out Out approach.
    The producer and consumer can be in different applications or in the same application.
    Although, for the most part, they are in different applications.


    Jakarta Messaging has a good integration with Jakarta Enterprise Bean and Jakarta
    Transaction API. It means that Jakarta Messaging can participate in the transaction
    and can take advantage of the container-managed transaction from Jakarta Messaging.
    It also means that if the Jakarta Messaging is being used inside the session bean
    of Jakarta Enterprise Bean, the rollback of the sending message can be called
    in case of any unchecked exception, without the action of the developer. Even
    if the message was sent and the transaction was not committed, the message can
    be rolled back.'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# Queue


    The queue approach allows the application to send a message to a queue and the
    other client gets this message from the queue. It is called a point-to-point messaging
    style as well. In case if a client gets the message from the queue, another client
    will not be able to get the same message, but will get the next. The queue retains
    a message until this message is consumed or when it expires. Thus, if we have
    many clients getting the message from the queue, it does not guarantee which client
    will get the message. Each message is consumed by only one client. The queue approach
    should be used when the message should be read and processed by only one client.'
  merge: -1
  pgno: 418
- img_proc: true
  md: '# Topic


    In the topic approach, which is known as the Publish/Subscribe messaging style
    as well, the message is read and processed by all the clients subscribed to the
    topic. As the name shows, the topic works with a publisher that sends the message
    to the topic, and the subscribers read the message from the topic and process
    it. The main difference between a queue and a topic is that the topic can have
    multiple consumers and all the consumers subscribed will receive the messages.
    By default, the consumer just receives the messages sent after subscribing, but
    Jakarta Messaging provides a way to allow the consumer to consume messages sent
    to the topic before subscribing to this topic. To do that, use the PERSISTENT
    delivery mode for the publishers and a durable subscription for the subscribers.


    Note that the subscription and the consumer are not the same thing. The topic
    has the subscription that receives all the messages sent to the topic, according
    to the configuration, and the consumer that is associated with the subscription.
    One subscription can have multiple consumers and this is called shared or you
    can have a subscription with just one consumer, that is called an unshared subscription.
    Throughout this chapter, we''ll explore more of these subscriptions.


    In Jakarta Messaging, the messages can be consumed synchronously or asynchronously.
    In a synchronous way, the consumer calls the receive method to get a message and
    it''ll'
  merge: -1
  pgno: 419
- img_proc: true
  md: 'block until a message arrives or it takes a time out. In an asynchronous way,
    a message listener, or a Message-Driven Bean is registered to the listener of
    the messages.


    The Jakarta Messaging has two parts – the connection factory and the destinations.
    The connection factory encapsulates the logic and its configurations to create
    the connections. The connection factory is an instance of the TopicConnectionFactory
    interface. The ConnectionFactory can be injected using CDI, shown as follows:


    ```

    @Resource(lookup = "java:jboss/Default/MSConnectionFactory")

    private static ConnectionFactory connectionFactory;

    ```


    The Wildfly provides but you can create new ones.


    A destination is an object that represents the target of the message that will
    be sent. In case of the queue, the object will be of and in case of a topic, the
    object will be of The destination can be injected using CDI as well, shown as
    follows:


    ```

    @Resource(lookup = "java:jms/queue/MyQueue")

    private static Queue queue;

    @Resource(lookup = "java:jms/topic/MyTopic")

    private static Topic topic;

    ```'
