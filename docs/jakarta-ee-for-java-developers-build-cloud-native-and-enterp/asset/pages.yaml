  md: '# Credential


    To authenticate a user to the application, the user needs to inform the credential
    information. It can be a token or some user information like the username and
    password. Jakarta Security provides an interface called Credential to represent
    the credential information. Each implementation of this interface represents a
    kind of credential. The IdentiySStore could work with any credential implementation.


    The credential''s information represents that the credential implementation is
    used by IdentifyStore to validate whether the user can be authenticated or not.'
