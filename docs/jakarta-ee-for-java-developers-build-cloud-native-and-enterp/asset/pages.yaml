  md: '# Using Server Push


    The HTTP/2 has a feature called Server Push and the servlet permits you to use
    this feature from HTTP/2. But what is this feature?


    Imagine you have many static contents (images, css, javascript) that you want
    to render in an HTML page in the browser. These contents don''t need to be built
    by some processing. With this, we can anticipate these contents to the browser
