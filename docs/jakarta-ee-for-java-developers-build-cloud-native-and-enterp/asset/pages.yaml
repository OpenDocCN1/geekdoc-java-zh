  md: '# Introduction


    The Java ecosystem has been used in many companies for many years and has provided
    several kinds of solutions to any environment. One of these environments is the
    enterprise environment, which has its particular necessities and challenges to
    be overcome. Thus, the Java ecosystem, by Sun — after being acquired by Oracle
    promoted a project called J2EE, which is a project to provide well-known solutions
    to the common enterprise problems. Over time, its name changed to Java EE, and
    now it is Jakarta EE, which is maintained by the Eclipse Foundation now. This
    chapter will show you what the Jakarta EE is and what are its goals. Throughout
    this chapter, we''ll walk through each main point of this project, analyzing the
    why for some changes and what we can expect from Jakarta EE. Besides that, we''ll
    show you what a server application is, what its importance to the Jakarta EE ecosystem
    is, and what we need to work with Jakarta EE.'
