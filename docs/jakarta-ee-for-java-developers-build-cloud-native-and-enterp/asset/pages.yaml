  md: '# Creating a Jakarta RESTful client


    Earlier we explained how to expose a RESTful resource using the Jakarta EE approach,
    but now we want to know how we can consume a resource or API inside our application.
    One very common characteristic of almost all web applications is needing some
    kind of integration. The applications need to integrate with the other applications
    to perform their tasks. In the past, these integrations were done in many ways
    like CORBA, remote EJB, and SOAP. These integrations don''t attempt the contemporaneous
    necessities, as these are very coupled approaches, mainly the CORBA and the remote
    EJB. Thus, the approach closer to the contemporaneous necessities are the APIs
    using RESTful styles as shown in the examples earlier. However, how does the Jakarta
    EE provide a way to consume it? How does it provide a way to integrate a Jakarta
    EE application to another application?


    The Jakarta RESTful client is a feature from the Jakarta RESTful Web Service that
    permits us to consume an API in an easier way. To expose an example of how to
    use the Jakarta RESTful client, we''ll create a scenario where we have an application
    that reads the user from the first one created by us in the example earlier, and
    then sends an email to this user. With this, we will create a new project with
    the following maven command:


    ```

