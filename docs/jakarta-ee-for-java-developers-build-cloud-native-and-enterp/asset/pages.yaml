    As you can see, the rollback backs the data to Thus, the operation in O3 read
    the João, but the O4 rollbacks the transaction 2 and the author is named Rhuan
    again. Transaction has the old data generating the dirty reading. Thus, the Jakarta
    Persistence provides the two ways to working with the concurrent access to the
    entity''s data – these are the optimistic locking and the pessimistic locking.
    In the following sections, we''ll explain more about these lock modes.


