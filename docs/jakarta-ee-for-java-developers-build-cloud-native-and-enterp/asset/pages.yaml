  md: '# HTTP authentication_mechanism


    Modern applications provide a communication interface using the HTTP protocol.
    In the past, it was common to have the Java applications using the EJB clients
    or CORBA to make the communications without using the HTTP protocol. However,
    it is very different, and the HTTP is the protocol that is widely used. With this,
    Jakarta Security brings the HTTP authentication mechanism, to provide a solution
    to the applications that need to use the authentication using the HTTP protocol.


    The Jakarta Security provides the HttpAuthenticationMechanism interface. It works
    as a contract and the application can implement its authentication mechanism using
    this interface. Furthermore, Jakarta Security already provides the implementations
    to three mechanism types, which are – basic HTTP authentication, form-based authentication,
    and a customized form-based authentication. These implementations can be used
    by using the annotation and @CustomFormAuthenticationMechanismDefinition respectively.
    We''ll read more about it in this section.


    These annotations are used to configure the authentication mechanism to the application.
    Thus, we just need to annotate a CDI bean with one of these annotations and the
    application will be configured. The implementation of these mechanisms is a built-in
    bean that has the scope Thus, it can be configured in a CDI bean, but I recommend
    you create a CDI bean responsible'
