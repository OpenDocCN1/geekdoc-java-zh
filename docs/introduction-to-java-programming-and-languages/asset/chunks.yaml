  trans: "\n\n这种方法在某种程度上足够灵活，因为 Java 应用程序与数据库的详细交互分离开了。数据库只需要提供某些 `JDBC` 接口的实现——为了兼容性，以便能够与\
    \ Java 应用程序兼容。\n\n`JDBC` 类和接口托管在 `java.sql` 包中。关于 `JDBC` 技术的更多信息可以在书籍 [4, 5] 中找到。\n\
    \n### 10.2. 数据库驱动程序\n要连接到数据库，必须首先加载与所用数据库对应的驱动程序。Java 的标准发行版仅包含这样一个驱动程序 - `JDBC`\
    \ ODBC 桥。该驱动程序充当了 `JDBC` 接口与连接 Microsoft 数据库的 ODBC（开放数据库连接）标准接口之间的桥梁。这种方法是充分的且通用的，因为对于大多数数据库都有相应的\
    \ ODBC 驱动。然而，首选的连接方式仍然被认为是使用特定数据库的 `JDBC` 驱动，因为此类驱动通常比 `JDBC-ODBC Bridge` 功能更强、速度更快。此外，它们还可以提供跨平台的可变性（使用\
    \ `ODBC` 通常仅在 MS Windows 上可用）。在大多数现有 DBMS 的交付物中，或者可以通过以下地址找到 `JDBC` 驱动：\n\n`JDBC`\
    \ 驱动通常以 `jar` 归包的形式提供，必须放在 `CLASSPATH` 中列出的任何目录中（cm. P. 3.9），以便 JVM 能够找到所需的驱动程序。\n\
    \n加载驱动程序通过调用方法来实现：\n\n```java\nstatic void forName(String classname) throws ClassNotFoundException\n\
    ```\n\n示例：\n\n```java\nClass.forName(\"sun.jdbc.odbc.JdbcOdbc\");\nClass.forName(\"\
    com.mysql.jdbc.Driver\");\n```\n\n### 10.3. 连接\n连接是通过调用以下方法执行的：\n\n```java\nstatic\
    \ Connection getConnection(String url, String user, String password) throws SQLException\n\
    ```\n\n`DriverManager` 类实现了连接功能。为了创建连接，使用静态方法：\n\n```java\nstatic Connection getConnection(String\
    \ url, String user, String password) throws SQLException\n```\n\n这里，`url` 参数定义了连接的格式：\n\
    \n```java\nString url = \"jdbc:mysql://localhost:3306/database\";\n```\n\n` 驱动程序通常以\
    \ `jar` 归包的形式提供，必须放在 `CLASSPATH` 中列出的任何目录中，以便 JVM 能够找到所需的驱动程序。加载驱动程序通过调用方法 `forName(String\
    \ classname) throws ClassNotFoundException` 实现。\n\n```java\nClass.forName(\"sun.jdbc.odbc.JdbcOdbc\"\
    );\nClass.forName(\"com.mysql.jdbc.Driver\");\n```\n\n### 10.4. 结果集\n结果集是实现 `ResultSet`\
    \ 接口的类，封装了查询执行的结果。为了创建结果集，使用：\n\n```java\nResultSet rs = stmt.executeQuery(\"\
    SELECT * FROM people\");\n```\n\n遍历结果集时可以使用以下方法：\n\n```java\nwhile (rs.next())\
    \ {\n    // 处理数据\n}\n```\n\n处理完成后，应通过 `close()` 关闭结果集。如果结果集被创建，它会自动关闭。以下示例展示了如何通过\
    \ SQL 查询来操作：\n\n```java\nResultSet rs = stmt.executeQuery(\"SELECT name FROM people\"\
    );\nwhile (rs.next()) {\n    System.out.println(rs.getString(\"name\"));\n}\n\
    rs.close();\n```\n\n"
