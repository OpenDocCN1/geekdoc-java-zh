    ### 8.4. 对象的排序 (Ordering of objects)


    许多容器处理任务与对象的某种排序有关。为了这一点，需要为对象定义某种操作，以便能够判断一个对象比另一个大还是小。Java 有两种标准方法来定义这种操作。第一种是需要排序的类实现
    `Comparable<T>` 接口。类型参数 T 必须替换为实现该接口的类名。例如：


    ```java

    class MyClass implements Comparable<MyClass>

    ```


    `Comparable<T>` 接口定义了方法


    ```java

    int compareTo(T obj)

    ```


    比较调用它的对象（this）与传递给该方法的对象，如果 this 大于对象 obj，则返回小于零的值；如果 this.equals(obj) 为 true，则返回零；如果
    obj 大于 this，则返回大于零的值。“大于”关系本身可以是任意的，并对应相应的准则。


    例如，如果有一个具有两个实部字段 re 和 im 的“复数”类，并且需要按照对应复数的模的升序或降序对该类对象进行排序，则可以如下定义 compareTo
    操作：


    ```java

    class ComplexNumber implements Comparable<ComplexNumber>


    {


    public double re, im;


    public ComplexNumber(double re, double im)


    {


    this.re = re; this.im = im;


    }


    }

    ```


