  trans: "\n赋值操作是一种二元操作，它将第二个参数的值赋值给第一个参数。第一个参数 `operations` `assignments` 必须是 `lvalue`（左值），即“允许被赋值的”。赋值操作的结果等于其第二个参数的值。例如，接下来的操作\n\
    \n```\nx = y = ten\n```\n\n将值 `10` 赋值给变量 `y`，之后将该操作的结果（即 `ten`）赋值给变量 `x`。\n\n\
    `expression` `operator` 它的语法如下：\n\n```\nexpression ;\n```\n\n因此，在任何表达式后添加分号都会将其转换为\
    \ `operator` 语句；这种在一个表达式中组合多个操作的可能性允许一个运算符同时更改多个变量，这在使用 `assignments` 运算符时是不可能的。\n\
    \n与 C++ 不同，Java 还有一个额外要求，即运算符表达式中的最后一个操作必须更改其操作数，以防止程序中出现无效代码（无影响的代码）。例如，`operator`\n\
    \n```cpp\nx + 1;\n```\n\n在 C++ 中是有效的，但在 Java 中是无效的，因为它没有改变任何变量的值。\n\n## 2.7. 控制语句\n\
    \n当前的控制运算符包括：条件语句 `if`、选择语句 `case`、循环运算符 `while`、`do-while` 和 `for`、提前退出循环的运算符\
    \ `break` 以及跳转到下次迭代的 `continue`，以及返回函数的运算符 `return`。这些运算符的语法与 C++ 相似，但有细微修改。特别是所有执行验证条件的运算符，都要求条件的类型为\
    \ `boolean`。这意味着，与 C++ 不同，`if (n)` 和 `if (n != 0)` 结构是不等价的，如果变量 `n` 的类型不是 `boolean`，则第一个结构在语法上是错误的。对于\
    \ `for` 语句，就像 C++ 一样，可以在其中声明多个变量。例如\n\n```java\nfor (int i = 0; i < N; ++i)\n\
    ```\n\n以此方式声明的变量仅在循环内部有效。你可以在 `for` 运算符的头部中使用多个表达式，并用逗号分隔：\n\n![](img/image00479.jpeg)\n\
    ```java\nfor (i = 0, j = 0; i + j < 20; ++i, ++j)\n```\n\n`case` 语句中的控制表达式必须是\
    \ `integer` 类型之一。\n\nJava 不包含 `goto` 语句。相反，可以通过扩展的 `break` 语句和 `continue` 语句来退出多层嵌套循环。它们并不常见，因此在这里不作考虑。需要注意的是，Java\
    \ 禁止在程序中存在不可达代码（例如，`return` 语句之后的代码），这会导致编译错误。\n\n# 3. 类与对象\n\n## 3.1. 面向对象编程的主要概念\n\
    \nJava 语言支持面向对象编程（OOP）范式。OOP 的核心概念是 `class`（类）。`class` 是由用户定义的数据类型。`class` 可以包含\
    \ `fields`（字段）和 `methods`（方法）。每个对象都有自己的 `fields`，它们决定了对象在任何时刻的状态。`methods` 决定了所有`objects`的行为。要注意，`fields`\
    \ 和 `methods` 都不存在于 `class` 。\n\n`class` 的概念可以被视为数据类型。`methods` 提供了对 `class` 内部\
    \ `data` 的访问。\n\n## 3.2. 类声明\n\n以下用于声明 `class`：\n\n```java\n[access_spec] class\
    \ name\n{\n    [access_spec] datatype fieldname = [initial_value];\n    [access_spec]\
    \ datatype method_name (argument_list)\n    {\n        method_body\n    }\n}\n\
    ```\n\n在 `class` 中声明 `fields` 和 `methods` 的顺序可以是任意的。可能的访问修饰符见 3.1 节。\n\n## 3.3.对象的创建\n\
    \n在 Java 中，所有对象都是动态创建的。C++ 中那种意义上的“变量对象”在 Java 中不存在；某种类型的变量实际上并不是对象，而是指向这些对象的引用（对象引用）。例如\n\
    \n```java\nMyClass myObject;\n```\n\n这声明了一个类型为 `MyClass`、名为 `myObject` 的对象引用，并没有创建对象本身。对象的实际创建是通过\
    \ `new` 运算符完成的：\n\n```java\nmyObject = new MyClass();\n```\n\n也可以同时声明对象引用并初始化：\n\
    \n```java\nMyClass myObject = new MyClass();\n```\n"
- fmt: "\n### 3.4. Access to fields and methods\nOnce the object has been created,\
    \ access to its fields and methods is carried out through operations (`.`):\n\n\
    ```\nmyObject.someMethod();\n```\n\nWhen accessing a field or method of an object\
    \ from a method called on the same object, the name of the object can be omitted\
    \ or replaced by the `this` keyword. The `this` keyword is also used to call the\
    \ constructor of the class from another constructor (cm. example below). In the\
    \ latter case, such a call must be the first statement in the `constructor`.\n\
    \n### 3.5. Example\nAs an example, consider the class `Box` (\"box\"), storing\
    \ the dimensions of some box (three integers). The `Box` class contains overloaded\
    \ constructors with different arguments, as well as the `volume()` method, which\
    \ calculates the volume of the box. `SimpleBoxDemo` class demonstrates creation\
    \ and usage of copies of `box` class. To simplify the example, access control\
    \ (see [3.10](#part0007.xhtml__bookmark27)) is not used. In practice, this approach\
    \ should not be used by anyone!\n\n```java\n/** Class \"Box\" */\nclass Box {\n\
    \    /** Dimensions drawer */\n    int width, height, depth;\n\n    /** Constructor\
    \ on default */\n    Box() { width = height = depth = 0; }\n\n    /** Basic constructor\
    \ */\n    Box(int width, int height, int depth) {\n        this.width = width;\n\
    \        this.height = height;\n        this.depth = depth;\n    }\n\n    Box(int\
    \ size) {\n        this(size, size, size); // width = height = depth = size;\n\
    \    }\n\n    /** Method calculations volume */\n    int volume() { return width\
    \ * height * depth; }\n}\n\npublic class SimpleBoxDemo {\n    static void main(String[]\
    \ args[]) {\n        Box b1 = new Box(5), b2 = new Box(5, 10, 20);\n        b1.width\
    \ = 10;\n        System.out.println(b1.volume() + \"\\n\" + b2.volume());\n  \
    \  }\n}\n```\n\n### 3.6. Removal objects\nThe operation of removing objects in\
    \ Java is not manually looked for. Its mechanism is automatic garbage collection.\
    \ To ensure this mechanism works, the `JVM` (Java Virtual Machine) keeps track\
    \ of the number of object references to each created object, etc., and as soon\
    \ as there is no reference left to the object, it becomes a candidate for removal.\
    \ Object removal is carried out periodically and only in the case when the amount\
    \ of memory that needs to be released is provided in Java. Since the release of\
    \ memory is implemented by the `JVM`, the need for them arises not too often.\
    \ If they are still needed, you should define your own methods and call them explicitly.\
    \ An example here is the `close()` method in Java classes, exercising closing\
    \ of I/O flow.\n\n### 3.7. Static fields and methods\nStatic fields and existing\
    \ methods exist in a single instance for each class, that is, they are shared\
    \ for all copies of this class.\n\nTo declare static fields and methods, a special\
    \ modifier `static`:\n\n```java\nstatic int static_field = ten;\n```\n\nStatic\
    \ fields are initialized at class load time, either with the value specified in\
    \ the declaration (see the example of paragraph [3.5](#part0005.xhtml__bookmark22)),\
    \ or in a special `static` block.\n\nStatic methods cannot (without explicitly\
    \ specifying an object) access non-static fields and non-static methods of the\
    \ class.\n\nCalling static fields and methods can be carried out without creating\
    \ an instance of a class. In this case, instead of the instance name, the class\
    \ name is used in most cases. For example:\n\n```java\ndouble x = Math.sqrt(2.0);\n\
    ```\n\nThe `main()` method, which is the entry point in all Java programs, should\
    \ be declared `static` (cm. example P. [3.5](#part0005.xhtml__bookmark22)).\n\n\
    ### 3.8. Broadcast arguments methods and peculiarities of object links\nAn object\
    \ reference behaves like a pointer in C, so assigning one object reference to\
    \ another does not result in copying an object. To perform copying of objects,\
    \ a class usually implements a copy constructor and, possibly, the `clone()` method.\n\
    \nPrimitive types are passed to methods by value. This applies to object references\
    \ as well, so the objects themselves are passed by reference (similar to copying\
    \ a pointer in C).\n\nLet's consider a typical mistake when using object references.\
    \ Let class `Point` be available in the next implementation:\n\n```java\nclass\
    \ point {\n    public double x, y;\n    public Coords(double _x, double _y) {\n\
    \        x = _x;\n        y = _y;\n    }\n}\n```\n\nLet it be required to implement\
    \ a method that performs the exchange of two objects. In the `point` class, as\
    \ far as the `point` objects are passed by reference, the implementation might\
    \ be:\n\n```java\nstatic void swap(Coords c1, Coords c2) {\n    Coords s = c1;\n\
    \    c1 = c2;\n    c2 = s;\n}\n```\nThis is incorrect because it only swaps the\
    \ local references. To exchange the actual objects, we should swap their content.\
    \ Here is an example of the implementation:\n\n```java\nstatic void swap(Coords\
    \ c1, Coords c2) {\n    double temp = c1.x;\n    c1.x = c2.x;\n    c2.x = temp;\n\
    \    double tempY = c1.y;\n    c1.y = c2.y;\n    c2.y = tempY;\n}\n```\n\nFinally,\
    \ when passing object references as an argument to a method, the object itself\
    \ can be modified.\n\n### 3.9. Packages and structure of translation module\n\
    Packages are means of grouping types (classes and interfaces) in Java programs.\
    \ Each package may contain one or more classes, as well as other packages. Distribution\
    \ of classes by packages allows solving the problem of name conflicts, as well\
    \ as more efficient access control.\n\nTo refer to elements of a package, the\
    \ full path is used, consisting of a set of subpackages separated by dots (e.g.,\
    \ `java.util`). To refer to classes in the same package, you can simply use their\
    \ names, omitting the package name.\n\nThe translation unit in Java is a file.\
    \ Each translation may begin with a `package` statement that defines the package\
    \ to which classes described in the module belong. For example:\n\n```java\npackage\
    \ package.mysubpackage;\n```\n\nIf a `package` statement is absent, the classes\
    \ belong to a default package that has no name, cannot have sub-packages and is\
    \ not visible from other packages.\n\nA translation module may contain one or\
    \ more `import` statements that allow package names to be omitted when referring\
    \ to classes. For example, if the following line is present in the module:\n\n\
    ```java\nimport java.util.*;\n```\n\nthen all classes of the `java.util` package\
    \ (but not the classes of its subpackages!) can be addressed using short names.\
    \ For importing a single class from a package, example:\n\n```java\nimport java.util.HashSet;\n\
    ```\n\nThe translation module must contain the source text of the `main` class\
    \ (or interface) module. The name of this class should match the name of the translation\
    \ module file. This class is the only translation module class that can be declared\
    \ `public`. The module may also contain some auxiliary classes.\n"
