    \ value)`。此外，除 `Character` 之外，所有的包装类都有带有 `String` 类型参数的构造函数。它们执行到对应基本类型的转换并封装生成的结果。所有包装类都重新定义了\
    \ `equals()`、`toString()`（参见第 3.12 页），并实现了 `Comparable<T>` 接口（参见第 8.4 页）。\n\n\
    执行从包装对象到基本类型的反转换，在相应对象上使用 `byteValue()` `shortValue()` `intValue()`。从 Java 1.5\
    \ 版本开始，大多数转换都是自动完成的。所有包装类都是不可变的（immutable）。\n\n包装类还包含静态方法：\n\n```java\nstatic\
    \ byte parseByte(String s)\nstatic short parseShort(String s)\nstatic int parseInt(String\
    \ s)\n```\n\n这些方法可以用于转换到基本类型。如果转换失败，将抛出 `NumberFormatException` 异常。\n\n# 4. 继承与多态\n\
    \n4.1. 继承。继承是一种基于现有类构建新类的机制。同时，类的继承者（子类）获得父类（超类）的属性和功能，并有机会进行更改和扩展。继承机制用于创建与父类相比更私有的、更专门的类。\n\
    \n为了声明某个类是另一个类的继承类，使用 `extends` 关键字，后跟被继承类的名，并添加到类声明中：\n\n![](img/image00479.jpeg)`[\
    \ 访问修饰符 ] class 子类名 extends 父类名`\n\nJava 只允许从一个类继承。子类继承父类所有的字段和方法，但那些使用访问修饰符 `private`\
    \ 声明以及默认声明的（后者仅当子类位于包含子类第一个类的包之外时）成员，对子类是不可访问的。\n\n子类可以重写父类的字段和方法。在这种情况下，对父类字段和方法的访问被关闭，只能通过子类方法通过\
    \ `super` 关键字执行，其语法与通过 `this` 显式访问当前实例元素的语法相同。例如，下面的代码段显示了对子类中同名方法 `overridenMethod`\
    \ 的调用。\n\n```java\npublic void overridenMethod()\n{\n    super.overridenMethod();\n\
    \    // ...\n}\n```\n\n在重定义字段和方法时，可能会将访问范围改为更宽（从 `private` 改为其他；从默认改为其他，除 private\
    \ 外）。\n\n构造函数是不继承的，但子类构造函数必须调用父类。这可能显式发生（为此，构造函数的第一个语句必须通过 `super` 调用父类的构造函数）或隐式发生（在这种情况下默认调用构造函数）。父类的构造函数调用是在继承树自上下进行的。在下一个基于\
    \ \"box\" 的示例中：\n\n```java\nclass box {\n    protected int width, height, depth;\n\
    \n    public int getWidth() { return width; }\n    public int getHeight() { return\
    \ height; }\n    public int getDepth() { return depth; }\n\n    public Box(int\
    \ w, int h, int d) {\n        width = w;\n        height = h;\n        depth =\
    \ d;\n    }\n\n    public Box(int size) {\n        this(size, size, size);\n \
    \   }\n\n    public int volume() {\n        return width * height * depth;\n \
    \   }\n}\n\nclass BoxWeight extends box {\n    protected int weight;\n\n    public\
    \ int getWeight() { return weight; }\n\n    public BoxWeight(int w, int h, int\
    \ d, int wg) {\n        super(w, h, d);\n        weight = wg;\n    }\n\n    public\
    \ BoxWeight(int size, int wg) {\n        super(size);\n        weight = wg;\n\
    \    }\n}\n```\n\n4.2. 限制与强制继承。如果方法 `volume` 使用 `final` 修饰符声明，则禁止对其重定义。如果使用相同的修饰符\
    \ `final` 声明 `Class`，则禁止从该类继承。\n\n单个类方法可以被声明为抽象的。在这种情况下，它们使用 `abstract` 修饰符声明且没有方法体：\n\
    \n![](img/image00479.jpeg)`abstract void abstractMethod();`\n\n此类方法在子类中必须被重写。如果一个类包含至少一个抽象方法，它也必须被声明为抽象类。在这种情况下，禁止创建该类的对象。为了能够实例化此类类的子类，必须在它们中实现所有的抽象方法。如果子类没有实现父类所有的抽象方法，它也必须声明为抽象的。\n\
    \n"
- fmt: " own## 4.3. Polymorphism\n\nPolymorphism is a mechanism, which allows you\
    \ to refer to objects inherited from the same class as objects of this class.\
    \ With this access to objects of subclasses, they react in the manner defined\
    \ in the corresponding subclass methods, not in the parent class. In this case,\
    \ the methods defined in the superclass form a single data access interface for\
    \ all subclasses. Polymorphism is one of the most powerful means of project-oriented\
    \ programming, insofar as it allows to uniformly process sets of objects belonging\
    \ to different classes, and the choice of the implementation of a particular operation\
    \ happens automatically on the basis of data object type. Implementation polymorphism\
    \ in Java is founded on the next rules:\n\n1. A reference to a class object can\
    \ be cast to a reference to an object of any of the classes above the given one\
    \ in the inheritance hierarchy. This transformation is expanding and can be done\
    \ automatically. The reverse transformation can maybe be produced, but it is performed\
    \ always obviously. At attempt to cast an object reference to an invalid type,\
    \ no error is thrown. To check the admissibility of the transformation, the `instanceof`\
    \ operation should be used:\n\n![](Images/image00482.jpeg)\n\n```\nif(myObject\
    \ instanceof MyClass)\n    ((MyClass)myObject).doSomethingSpecificForMyClass();\n\
    ```\n\n2. If some of the superclass methods have been overridden in subclass,\
    \ then when accessing these methods, even through references to the superclass\
    \ object, the overridden methods will be called exactly once. This differs from\
    \ the implementation of polymorphism in C++, where the call to overridden methods\
    \ in the described situation will occur only if relevant methods were announced\
    \ virtual. Consider an example. Let there be a base class \"geometric figure.\"\
    \ He contains method `area()`, designed for calculations of the figure. Each of\
    \ the subclasses of the \"shape\" class overrides this method in such a way that\
    \ the area of the corresponding shape figures is calculated. Links to created\
    \ instances of classes of specific figures are stored in an array of links of\
    \ type \"shape\", and then unified processed differently: for each figure, its\
    \ area is displayed. This does not require any shape type checks, for each shape\
    \ the required method is automatically called.\n\n3.\n\n```java\n/** Abstract\
    \ Class \"Geometric figure\" */\nabstract class figure {\n    /** Method calculations\
    \ area figures */\n    abstract public double area();\n}\n\n/** Class \"Rectangle\"\
    \ */\nclass Rectangle extends figure {\n    private double a, b;\n    public Rectangle(double\
    \ a, double b) {\n        this.a = a;\n        this.b = b;\n    }\n    public\
    \ double area() {\n        return a * b;\n    }\n}\n\n/** Class \"круг\" */\n\
    class Circle extends Figure {\n    private double r;\n    public Circle(double\
    \ r) {\n        this.r = r;\n    }\n    public double area() {\n        return\
    \ Math.PI * r * r;\n    }\n}\n\n/** Class \"triangle\" */\nclass triangle extends\
    \ figure {\n    private double a, b, c;\n    public Triangle(double a, double\
    \ b, double c) {\n        this.a = a;\n        this.b = b;\n        this.c = c;\n\
    \    }\n    public double area() {\n        double p = (a + b + c) / 2;\n    \
    \    return Math.sqrt(p * (p - a) * (p - b) * (p - c));\n    }\n}\n\npublic class\
    \ FiguresPolymorphism {\n    public static void main(String args[]) {\n      \
    \  figure f[] = new Figure[3]; // array objective links\n        f[0] = new Rectangle(2,\
    \ 3);\n        f[1] = new Triangle(3, 4, 5);\n        f[2] = new Circle(1);\n\
    \        for(int i = 0; i < f.length; ++i)\n            System.out.println(f[i].area());\n\
    \    }\n}\n```\n\n## 4.4. interfaces\n\nIn Java inheritance of one class from\
    \ several is not allowed. However, exists a limited analogue of multiple inheritance\
    \ in the form of multiple implementation of one class by several interfaces. Functional\
    \ interfaces are close to abstract classes with certain restrictions (allowed\
    \ only abstract methods and only static fields), but any Class can implement (analogue\
    \ inheritance) some interfaces.\n\nFor ads interface the next syntax is used:\n\
    \n```\ninterface interface name [extends list_of_interface_ancestors_names]\n\
    ```\n\nAll methods interface implicitly receive the specifier `abstract public`,\
    \ and all interface variables are the `final static public` specifier and must\
    \ be initialized immediately. Usage of other specific access modifiers in interfaces\
    \ is not allowed.\n\nAny Class can implement any interface.\n\n## 4.5. Interface\
    \ links\n\nLike casting a reference to a class object to a reference to an object\
    \ of its superclass, it is possible to cast such a reference to a reference to\
    \ any of the interfaces that the class implements. For example:\n\n```java\ninterface\
    \ Ifc1 {\n    void f();\n}\n\ninterface Ifc2 {\n    void g();\n}\n\nclass MyClass\
    \ implements Ifc1, Ifc2 {\n    public void f() {}\n    public void g() {}\n}\n\
    \npublic class InterRef {\n    public static void main(String args[]) {\n    \
    \    MyClass m = new MyClass();\n        Ifc1 ir = m; // cast to interface link\n\
    \        ir.f(); // call method through interface link\n        ((MyClass)ir).g();\
    \ // reverse transformation to MyClass\n    }\n}\n```\n\n## 4.6. Guidelines for\
    \ Using Inheritance and Polymorphism\n\nWhen developing hierarchy, classes should\
    \ be built in accordance with the principle: a subclass is a more private, specialized\
    \ class in relation to the superclass. Non-compliance with this principle leads\
    \ to serious design errors, manifested in the strong coupling of classes and the\
    \ difficulty of designing for subsequent stages. Despite the obvious similarity\
    \ between abstract classes and interfaces, their purpose, generally speaking,\
    \ is somewhat different. An abstract class is an abstract entity, the details\
    \ of which are not fully described due to its generality. Unlike, an interface\
    \ is not an entity, but rather a collection of potential features that can be\
    \ implemented by different classes, having nothing general between them. Inheritance\
    \ supports polymorphism genetically for general methods. Method polymorphism,\
    \ which is of a different nature, must be implemented through interfaces. An example\
    \ would be the `Comparable<T>` interface (see Section 8.4).\n\n# 5. Treatment\
    \ exceptions\n\n## 5.1. Concept exceptions\n\nExceptions present an object-oriented\
    \ mechanism for handling exceptional situations during the execution of the program.\
    \ This mechanism allows processing such situations in a more simple and conceptually\
    \ clear way compared to traditional error handling methods such as returning special\
    \ values or using the `setjmp()` and `longjmp()` functions in C.\n"
