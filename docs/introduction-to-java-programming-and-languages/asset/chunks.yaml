  trans: "\n有时候有必要过早终止线程并可能在将来恢复其执行。为了实现这一点，`Thread` 类中引入了 `stop()`、`suspend()` 和\
    \ `resume()` 方法，但它们后来被认为是不安全的，因为它们允许在停止线程之前不执行如（例如）释放指定的资源等的某些操作，因此可能导致程序挂起或运行异常。在新程序中不应使用这些方法。控制流的另一种替代方法是使用\
    \ `Thread` 类中的一个特殊标记 `interrupted`（中断）。为了中断当前的执行流，使用了 `setInterrupted()` 方法。如果此时流处于挂起状态（调用了\
    \ `sleep()`、`join()` 等方法），那么当它恢复工作时，在相应的方法调用处会抛出一个异常。否则，将设置特殊的标记 `interrupted`。线程必须通过调用\
    \ `isInterrupted()` 方法来自行检查该标记的状态，并在其被置为真时停止工作。例如：\n\n```java\nvoid run()\n{\n\
    \    boolean done = false ;\n\n    while (!done)  // 主循环流\n    {\n        if (isInterrupted())\n\
    \        {\n            // 执行最终操作\n            return ;\n        }\n    }\n}\n\
    ```\n\n每次调用 `isInterrupted()` 方法都会重置标记 `interrupted`。请注意，如果流不检查标记 `interrupted`，可能会出现在它上被禁止的情况下停止的情况。\n\
    \n下面的示例演示了 `Thread` 类中各种方法的使用。在这个示例中，主线程实例化了 `helloThread` 类，在独立的执行流上在屏幕上输出“Hello,\
    \ world!”字符串，并在完成前制造一个延迟。主线程则等待子线程的完成，之后它显示一条消息，表示子线程已完成。\n\n```java\nclass hello\
    \ thread extends Thread\n{\n    /** 流的入口点 */\n    public void run()\n    {\n \
    \       System.out.println(\"Hello, world!\");\n        try\n        {\n     \
    \       sleep(1000);\n        }\n        catch(InterruptedException e)\n     \
    \   {\n            System.err.println(\"线程 MyHelloThread 被中断了\");\n        }\n\
    \    }\n}\n\npublic class SimpleThreadsExample\n{\n    public static void main(String\
    \ args[])\n    {\n        Thread t = new HelloThread(); t.start();  // 启动流\n \
    \       try\n        {\n            t.join();  // 等待流完成\n        }\n        catch\
    \ (InterruptedException e)\n        {\n            System.err.println(\"主流被中断\"\
    );\n        }\n        System.out.println(\"流 MyHelloThread 结束\");\n    }\n}\n\
    ```\n\n## 9.2. 接口 `runnable`\n\n有时候需要将 `Thread` 类的功能添加到已有的类中。直接继承 `Thread` 类是不允许的，因为该\
    \ `Class` 已经是其他类的子类。在这种情况下，可以使用 `Runnable` 接口。该接口定义了唯一的方法：\n\n```java\nvoid run()\n\
    ```\n\n与 `thread` 类的同义方法类似。\n\n实现 `runnable` 接口的类如下所示使用：创建该类的实例，并将其传递给 `thread`\
    \ 类的构造函数：\n\n```java\nMyRunnableClass r = new MyRunnableClass();\nThread t = new\
    \ Thread(r);\nt.start();\n```\n\n有时 `Thread` 类对象直接放置在实现 `Runnable` 接口的类内部，并在该类的构造函数中初始化：\n\
    \n```java\nclass MyRunnableClass implements runnable\n{\n    private Thread thread;\n\
    \    /** 构造函数：创建 Thread 类对象并启动它 */\n    public MyThread()\n    {\n        thread\
    \ = new Thread( this ); thread.start();\n    }\n\n    /** 流的入口点 */\n    public\
    \ void run()\n    {\n        // . . .\n    }\n}\n```\n\n\n## 9.3. 同步\n\n多线程应用程序通常不需要同一个对象或方法只被一个线程使用。为了提供这种可能性，使用了\
    \ `sync` 机制。\n\n考虑一个可能需要同步的原型示例。\n\n```java\n/** 构造函数（保存名称流并启动流） */\npublic MyThread(String\
    \ name) { super (name); start(); }\n/** 流的入口点 */\npublic void run()\n{\n    try\n\
    \    {\n    }\n    System.out.print(\"[\"); Thread.sleep(1); System.out.print(getName());\
    \ Thread.sleep(1); System.out.print(\"]\");\n}\ncatch(InterruptedException e)\n\
    {\n    System.err.println(\"线程 \" + getName() + \" 被中断了\");\n}\n}\n}\n\npublic\
    \ class SyncExample\n{\n    public static void main(String args[])\n    {\n  \
    \      for (int i = 0; i < ten; ++i)\n            new MyThread(String.valueOf(i));\n\
    \    }\n}\n```\n\n这个示例创建了 10 个线程，每个线程输出方括号中的数字：\n\n![Images/image0479.jpeg](img/image0479.jpeg)\n\
    \n在这种情况下，第一个进入 `System.in` 监视器的线程会挂起所有尝试进入同一个监视器的线程，并在完全执行结论后才释放监器。然后下一个流进入监器，依此类推。\n\
    \n同步的核心概念是监器（monitor）。监器是一个用于互斥阻塞的（隐式）对象。在 Java 中，每个对象都有自己的监器。当一个线程进入监器时，相应的块就会被检查。如果此时另一个线程尝试进入同一个监器，它将暂停，直到第一个线程离开监器。\n\
    \nJava 中有两种同步类型：同步方法和同步块。\n\n要使方法同步同步，只需在其头部添加 `synchronized` 关键字。同步块（有时称为临界区域）具有以下语法：\n\
    \n```java\nsynchronized (object_name)\n{\n    // . . .\n}\n```\n\n特别地，在上面的示例中可以将\
    \ `try` 块放在同步块中：\n\n```java\nsynchronized (System.in)\n{\n    System.out.print(\"\
    [\"); Thread.sleep(1); System.out.print(getName()); Thread.sleep(1); System.out.print(\"\
    ]\");\n}\n```\n\n"
