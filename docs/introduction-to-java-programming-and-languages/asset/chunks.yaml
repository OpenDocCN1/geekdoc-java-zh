  trans: "\n\n```java\n`FileInputStream(String fileName) throws FileNotFoundException`\n\
    `FileOutputStream(String fileName) throws FileNotFoundException`\n`FileOutputStream(String\
    \ fileName, boolean append) throws FileNotFoundException`\n```\n\n所有构造函数都尝试打开作为参数传递给它们的文件。如果在创建输出流时，现有文件已经存在，它将被截断为零长度。然而，如果你使用上述第三种构造函数并将\
    \ `append` 参数的值设置为 `true`，则文件将在追加模式下打开。\n\n### 7.3. 字节流的字符流包装器\n\n由于 Java 中所有的字符信息都以\
    \ Unicode 形式表示，而作为外部数据的时间时通常以其他编码呈现，因此为了让 Java 与外部世界有效通信，需要进行编码转换。此操作由符号包装流完成的。它们可以连接任何字节流（“包装”它），并允许接收到的流被视为符号流，执行所有必要的转换。\n\
    \n这些流对应于类 `InputStreamReader`（将从字节流读取的数据转换为 Unicode）和 `OutputStreamWriter`（将输出的字符数据从\
    \ Unicode 转换为字节流）。创建类对象使用以下构造函数：\n\n```java\n`InputStreamReader(InputStream in)`\n\
    `InputStreamReader(InputStream in, String charSet)`\n`OutputStreamWriter(OutputStream\
    \ out)`\n`OutputStreamWriter(OutputStream out, String charSet)`\n```\n\n所需的编码由参数\
    \ `charSet` 决定。如果未指定，则使用系统区域的编码。\n\n### 7.4. 与文件相关的字符流\n\n与文件相关的符号流设计用于处理文本文件。事实上，它们是字节流和执行转换的字符包装流的结合。在这种情况下，总是使用系统区域的编码。\n\
    \n这些流对应于 `FileReader` 和 `FileWriter` 类，具有以下构造函数：\n\n```java\n`FileReader(String\
    \ filename) throws FileNotFoundException`\n`FileWriter(String filename) throws\
    \ FileNotFoundException`\n`FileWriter(String filename, boolean append) throws\
    \ FileNotException`\n```\n\n它们的使用方式与字节流构造函数相同。与文件相关的流（见第 7.2）。\n\n### 7.5. 字符打印流\n\
    \n字符打印流（对应的类是 `PrintWriter`）是另一个字符流的包装流，它为输出添加了格式化功能——方法 `print()` 和 `println()`。它们为所有原始类型和类型\
    \ `Object` 的参数定义。在后一种情况下，在流输出字符串性能对象（见第 6.3）。\n\n创建 `PrintWriter` 对象使用以下构造函数：\n\
    \n```java\n`PrintWriter(Writer out)`\n`PrintWriter(Writer out, boolean autoFlush)`\n\
    ```\n\n注意，`PrintWriter` 类不提供在符号转换字符串出现时自动刷新文件中的缓冲区。自动重置只有通过使用 `println()` 方法实现，前提是在创建对象时，参数\
    \ `autoFlush` 的值被设置为 `true`。\n\n在较新的 Java 版本中，`PrintWriter` 类包含了允许你连接字节流甚至文件字节流的构造函数：\n\
    \n```java\n`PrintWriter(OutputStream out)`\n`PrintWriter(OutputStream out, boolean\
    \ autoFlush)`\n`PrintWriter(String filename) throws FileNotFoundException`\n`PrintWriter(String\
    \ filename, String charset)`\n```\n\n这些构造函数简单地创建中间类型 `InputStreamWriter` 和 `FileInputStream`\
    \ 的对象，并与之连接。\n\n注意，除了 `PrintWriter` 类外，还存在具有相似功能的 `PrintStream` 类。在新的 Java 程序中，不建议创建此类类的对象，然而这种类型拥有对象\
    \ `System.out`（标准流输出）和 `System.err`（标准错误流）。这是由于历史原因我们。\n\n### 7.6. 缓冲流\n\n缓冲流是其他流的包装器。它们通过后台缓冲提高了\
    \ I/O 活动的效率。缓冲流的功能由类 `BufferedInputStream`、`BufferedOutputStream`（带有缓冲功能的输入和输出字节流）、`BufferedReader`\
    \ 和 `BufferedWriter`（类似的字符流）提供。创建这些类的对象使用构造函数，将被包装的流作为质量参数传递：\n\n![](img/image00495.jpeg)\
    \ \n```java\n`BufferedInputStream(InputStream in)`\n`BufferedOutputStream(OutputStream\
    \ out)`\n`BufferedReader(Reader in)`\n`BufferedWriter(Writer out)`\n```\n\n此外，缓冲输入字符流增加了方法\n\
    \n![](img/image00479.jpeg)\n```java\n`String readLine() throws IOException`\n\
    ```\n\n该方法用于从输入符号流中读取一行。在到达文件末尾时，该方法返回 `null`。\n\n### 7.7. 控制台 I/O\n\n标准输出流和错误流在\
    \ Java 中由 `System.out` 和 `System.err` 对象表示，它们的类型为 `PrintStream`（见第 7.5）。功能上，它们类似于符号打印流，因此输出时通常使用：\n\
    \n```\n`System.err.println(\"This line output\")`\n```\n\n# 8. 容器\n\n### 8.1.\
    \ 容器概述\n\n容器是存储其他对象的对象。它们在组织方式、执行基本操作（添加、提取和删除元素）的时间以及支持的方法方面有所不同。每种容器。\n\nJava\
    \ 中的容器可以分为三组：数组、集合和关联数组。数组在第 1.5 节讨论过。它们的显著特征是创建后无法调整大小。Java 中的所有其他容器在添加和删除元素时动态更改大小。\n\
    \n集合组成了最大的组。Java 中所有的集合类都是泛化类型（泛型）。泛化类型是带有类或接口。泛参数是在创建对象时必须指定的类型名称。泛化类型类似于 C++\
    \ 模板，最初引入是为了在编译时确保正确的类型保真性。它们代表了非常灵活且同时复杂的机制，详细考虑超出了本手册的范围。有关泛化类型的详细信息可以在文章 11\
    \ 中找到。\n\nJava 集合类的参数是它可以存储的对象类型（在此处及下，该类型由字母 E 表示）。参数可以是类或接口。对于集合中的存储，原始类型应使用类-包装器（见第\
    \ 3.13）。\n\n"
