    \n### 10.8. 事务管理\n\n默认模式是自动提交事务。这意味着对数据库的每一个请求都 true 视为一个独立的自动提交的事务。然而，这种模式可以被禁用，通过方法\n\
    \n![](img/image00479.jpeg)\n`void setAutoCommit(boolean autocommit) throws SQLException`\n\
    \n在这种情况下，所有事务必须通过调用以下方法显式地提交：\n\n![](img/image00479.jpeg)\n`void commit() throws\
    \ SQLException`\n\n或者通过调用方法进行回滚：\n\n![](img/image00479.jpeg)\n`void rollback()\
    \ throws SQLException`\n\n如果在执行事务期间发生错误，事务将自动被拒绝。\n\nJDBC 不需要你显式定义事务的开始。事务首先在调用\
    \ `setAutoCommit()` 方法的时刻开始，随后的所有事务在调用 `commit()` 或 `rollback()` 方法提交或回滚之前的事务后直接开始。\n\
    \n# 11. 网络编程\n\n### 11.1. 网络编程手段综述\n\nJava 支持开发网络应用程序的各种工具和技术。这包括：使用 TCP 和 UDP\
    \ 协议进行直接数据传输的方法、应用层协议（http, https, ftp 等）的协议支持工具、扩展客户端网页功能的技术（applets）、以及 Web\
    \ 服务器功能（servlets 和 jsp）、远程过程调用技术 RMI（远程方法调用），以及构建分布式应用的 Enterprise Java beans\
    \ 技术。\n\n本章仅对 Java 网络编程进行简要介绍。它考虑了通过 TCP/IP 套接进行相互交互的方法，以及使用应用层协议获取网络资源的工具。它们都放置在\
    \ `java.net` 包中。\n\n关于开发网络应用程序技术的详细描述可以在书籍  [1 , 3 , 4 , 5 ] 中找到。\n\n### 11.2.\
    \ InetAddress 类\n\n`InetAddress` 类封装了 IP 地址和主机域名。它没有可见的（公有的）构造函数，要创建此类的实例，请使用以下静态工厂方法：\n\
    \n![](img/image00516.jpeg)\n`static InetAddress getByName(String host) throws\
    \ UnknownHostException static InetAddress getByAddress(byte[] addr) throws UnknownHostException\
    \ static InetAddress getLocalHost() throws UnknownHostException`\n\n第一个通过主机名创建实例（例如\
    \ \"www.google.com\"），第二个通过字节数组创建实例，第三个获取本地主机的地址（通常是 127.0.0.1）。如果使用域名创建实例时未找到该主机，将抛出\
    \ `UnknownHostException` 异常。\n\n### 11.3. 套接字 (Socket)\n\n套接字是 TCP/IP 网络中的一种抽象，用于连接主机的“电缆”。由于同一个主机可以提供各种服务，因此使用端口号来识别特定的服务，1024\
    \ 之前的端口留给系统服务。\n\n`Socket` 类是用于连接远程或本地主机的套接字类。创建此类可以使用以下构造函数：\n\n```java\nSocket(String\
    \ host, int port) throws UnknownHostException, IOException\nSocket(InetAddress\
    \ address, int port) throws IOException\n```\n\n构造函数的参数是主机名字符串，或封装其 IP 地址的 `InetAddress`\
    \ 对象，以及要连接的端口。创建 socket 对象时，会立即尝试与指定的主机建立连接。如果失败，将抛出异常。\n\n连接建立后，可以使用以下方法\n\n\
    ![](img/image00517.jpeg)\n`InputStream getInputStream() throws IOException OutputStream\
    \ getOutputStream() throws IOException` 返回输入和输出字节流，用于接收和发送主机数据。\n\n在使用后必须调用方法关闭\
    \ socket：\n\n![](img/image00479.jpeg)\n`void close() throws IOException`\n\n###\
    \ 11.4. 服务端的连接建立\n\n服务器端的交互通常包括以下步骤：监听某个端口（客户端可以通过该端口连接服务器）、建立连接以及与客户端交换数据。这些任务中的第二个由上述\
    \ `Socket` 类执行（如前所述，客户端和服务器套接字之间没有区别），第三个是输入/输出流类。对于第一个任务，使用了特殊的 `ServerSocket`\
    \ 类。\n\n```java\nServerSocket(int port)\n```\n\n在入口端口上接收监听。`ServerSocket` 类的一个新方法是\n\
    \n![](img/image00479.jpeg)\n`Socket accept() throws IOException`\n\n"
