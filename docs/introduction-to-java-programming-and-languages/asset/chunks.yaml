  trans: "\n## 4.3. 多态\n\n多态是一种机制，允许你将继承自同一类的对象视为该类的对象。通过这种对子类对象的访问，它们将按照相应子类方法中定义的方式做出反应，而不是按照父类中的。在这种情况下，父类中定义的方法为所有子类形成了一个单一的数据访问接口。多态是面向对象编程中最强大的手段之一，因为它允许以统一的方式处理属于不同类的对象集合，并且特定操作的实现选择根据数据对象的类型自动完成。Java\
    \ 中多态的实现基于以下规则：\n\n1.  类对象的引用可以转换为继承层次结构中给定类之上的任何一个类的对象的引用。这种转换是扩展性的，并且可以自动完成。反向转换也可能产生，但它总是以显而易见的方式执行。当尝试将对象引用转换为无效类型时，不会抛出错误。要检查转换的有效性，应使用\
    \ `instanceof` 操作：\n\n![](img/image00482.jpeg)\n\n```\nif(myObject instanceof\
    \ MyClass)\n    ((MyClass)myObject).doSomethingSpecificForMyClass();\n```\n\n\
    2.  如果父类方法的某些在子类中被重写，那么在访问这些方法时（即使通过父类对象的引用），重写的方法将被精确地调用一次。这与 C++ 中多态的实现不同，在描述描述的情况下，只有当相关方法被声明为虚函数（virtual）时，才会调用重写的方法。考虑一个例子。假设有一个基类“geometric\
    \ figure”。它包含一个用于计算图形面积的 `area()` 方法。“shape”类的每个子类都重写了该方法，以计算相应图形的面积。指向特定图形类实例的链接存储在“shape”类型的链接数组中，然后以不同的方式统一处理：对于每个图形，显示其面积。这不需要任何对形状类型的检查，因为对于每个形状都会自动调用所需的方法。\n\
    \n3.  \n\n```java\n/** 抽象类 \"Geometric figure\" */\nabstract class figure {\n\
    \    /** 计算图形面积的方法 */\n    abstract public double area();\n}\n\n/** 类 \"Rectangle\"\
    \ */\nclass Rectangle extends figure {\n    private double a, b;\n    public Rectangle(double\
    \ a, double b) {\n        this.a = a;\n        this.b = b;\n    }\n    public\
    \ double area() {\n        return a * b;\n    }\n}\n\n/** 类 \"круг\" */\nclass\
    \ Circle extends Figure {\n    private double r;\n    public Circle(double r)\
    \ {\n        this.r = r;\n    }\n    public double area() {\n        return Math.PI\
    \ * r * r;\n    }\n}\n\n/** 类 \"triangle\" */\nclass triangle extends figure {\n\
    \    private double a, b, c;\n    public Triangle(double a, double b, double c)\
    \ {\n        this.a = a;\n        this.b = b;\n        this.c = c;\n    }\n  \
    \  public double area() {\n        double p = (a + b + c) / 2;\n        return\
    \ Math.sqrt(p * (p - a) * (p - b) * (p - c));\n    }\n}\n\npublic class FiguresPolymorphism\
    \ {\n    public static void main(String args[]) {\n        figure f[] = new Figure[3];\
    \ // 对象引用数组\n        f[0] = new Rectangle(2, 3);\n        f[1] = new Triangle(3,\
    \ 4, 5);\n        f[2] = new Circle(1);\n        for(int i = 0; i < f.length;\
    \ ++i)\n            System.out.println(f[i].area());\n    }\n}\n```\n\n## 4.4.\
    \ 接口\n\nJava 不允许一个类继承多个类。然而，存在多重继承的局限替代形式，即通过多个接口对一个类进行多次实现。函数式接口类似于带有某些限制的抽象类（只允许抽象方法和静态字段），但任何类都可以实现（等同于继承）某些接口。\n\
    \n对于接口（interface），使用以下语法：\n\n```\ninterface interface name [extends list_of_interface_ancestors_names]\n\
    ```\n\n接口的所有方法隐式地接收 `abstract public` 修饰符，所有接口变量都是 `final static public` 修饰符，并且必须立即初始化。接口中不允许使用其他特定的访问修饰符。\n\
    \n任何类都可以实现任何接口。\n\n## 4.5. 接口链接\n\n就像将类对象的引用转换为其父类对象的引用一样，也可以将此类引用转换为该类所实现的任何接口的引用。例如：\n\
    \n```java\ninterface Ifc1 {\n    void f();\n}\n\ninterface Ifc2 {\n    void g();\n\
    }\n\nclass MyClass implements Ifc1, Ifc2 {\n    public void f() {}\n    public\
    \ void g() {}\n}\n\npublic class InterRef {\n    public static void main(String\
    \ args[]) {\n        MyClass m = new MyClass();\n        Ifc1 ir = m; // 转换为接口链接\n\
    \        ir.f(); // 通过接口链接调用方法\n        ((MyClass)ir).g(); // 反向转换到 MyClass\n\
    \    }\n}\n```\n\n## 4.6. 继承与多态的使用指南\n\n在开发层次结构时，类的构建应遵循原则：子类相对于父类是一个更私有的、更专门的类。不遵守这一原则会导致严重的设计错误，表现为类之间的强耦合以及后续阶段设计的困难。尽管抽象类和接口之间有明显的相似之处，但通常来说，它们的目的是不同的。抽象类是一个抽象实体，由于其通用性，细节并没有被完全描述。不同的是，接口不是实体，而是可以由不同类实现的潜在特征集合，它们之间没有任何通用性。继承在遗传上支持通用方法的多态。而方法多态的性质不同，必须通过接口来实现。一个例子是\
    \ `Comparable<T>` 接口（见第 8.4 节）。\n\n# 5. 异常处理\n\n## 5.1. 异常概念\n\n异常提供了一种面向对象的机制，用于处理程序执行期间的异常。与传统的错误处理方法（如返回特殊值或在\
    \ C 中使用 `setjmp()` 和 `longjmp()` 函数）相比，这种机制允许以更简单、概念更清晰的方式处理此类情况。\n"
