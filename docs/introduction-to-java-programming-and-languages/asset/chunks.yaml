    }\n```\n\n```一种基于特定方式的比较操作对对象进行排序的方法，在 `Java` 中被称为自然排序（natural ordering）。每个类最多可以定义一种自然排序方式。\n\
    \n另一种排序方法是定义一个外部类（`comparator` 比较器），该类将实现所需类的比较对象。`Comparator` 类必须实现 `Comparator<T>`\
    \ 接口，其中参数 `T` 定义了该比较器所比较的对象类型。`Comparator<T>` 接口定义了方法：\n\n![](img/image00479.jpeg)\n\
    ```java\nint compare(T o1, T o2)\n```\n\n它比较作为参数传递给它的两个对象，并返回正、负或零作为比较结果，这与 `Comparable<T>`\
    \ 接口中的 `compare()` 方法类似。\n\n因此，在示例中，对于给定的类，除了实现 `compareTo()` 方法，还可以通过以下方式实现比较器：\n\
    \n```java\nclass ComplexNumberLenComp implements Comparator<ComplexNumber> {\n\
    \    public int compare(ComplexNumber c1, ComplexNumber c2) {\n        double\
    \ diff = (c1.re * c1.re + c1.im * c1.im) - (c2.re * c2.re + c2.im * c2.im);\n\
    \        return ( int )(Math.sign(diff));\n    }\n}\n```\n\n很容易看出，对于一个类可以定义任意数量的比较器，因此这种方法通常用于程序对对象使用不同排序标准的情况。许多标准容器处理算法以及自包含容器都需要你定义如何对对象进行排序。在存储研究机构和处理迁入数据时使用各种排序方法的示例参见\
    \ `P.` 8.8。\n\n### 8.5. 集合与有序集合\n\n`Sets` 集合和有序集合是提供快速添加和删除元素的集合，但不允许你按照顺序对它们进行排列并保留重复元素。\n\
    \n`Set<E>` 接口以及实现它的包装类 `HashSet<E>`。它们与 `Collection<E>` 接口相比，没有添加任何新方法。存储器类 `HashSet<E>`\
    \ 使用哈希表，因此存储在集合中的对象必须实现 `equals()` 和 `hashCode()` 方法。得益于哈希表，执行基本操作（添加、删除和检查元素在集合中的出现情况）的时间实际上不依赖于集合的大小。迭代器遍历集合元素的顺序被认为是任意的，因为它是由元素的哈希值决定的。创建副本的类\
    \ `HashSet<E>` 使用以下构造函数：\n\n![](img/image00479.jpeg)\n```java\nHashSet()\n```\n\
    \n![](img/image00479.jpeg)\n```java\nHashSet(Collection<? extends E> c)\n```\n\
    \n有序集合由 `SortedSet` 接口表示，并用 `TreeSet<E>` 类实现它。后者使用平衡二叉树进行存储，这可以保证迭代器遍历集合的顺序是升序的。在集合中添加、删除和检查元素出现次数的时间复杂度为\
    \ N log N。\n\n用于创建副本的类 `TreeSet<E>` 使用以下构造函数：\n\n![](img/image00499.jpeg)\n```java\n\
    TreeSet()\n```\n```java\nTreeSet(Collection<? extends E> c)\nTreeSet(SortedSet<E>\
    \ s)\nTreeSet(Comparator<? super E> c)\n```\n\n最后一种允许你创建任意顺序排序的集合，该顺序由传递给构造函数的比较器决定（参见章节\
    \ 8.4）。在所有其他情况下，集合的排序按自然顺序排列。在这种情况下，集合元素类必须实现 `Comparable<T>` 接口。\n\n### 8.6.\
    \ 关联数组\n\n如所述，关联数组可以被视为使用任意对象代替索引的数组。我们可以假设它们将一组键对象集合映射为一组值对象集合。它们不是意义上的集合，因为它们没有实现\
    \ `Collection<E>` 接口。取而代之的是 `Map<K, V>` 接口，它有两个选项。第一个定义关联数组的键的数据类型，第二个是其值的类型。基本接口方法\
    \ `Map<K, V>` 见表 8.3。\n\n关联数组用于存储键值对。因此，两者的层次结构和属性都匹配：分别是 `HashSet` 和 `HashMap`\
    \ 类、`HashSet` 和 `TreeMap` 类，以及 `SortedSet` 和 `SortedMap` 接口。关联列表没有自己的迭代器。遍历它们时使用其键的迭代器。\n\
    \n表 8.3. `Map<K, V>` 的主要方法\n```java\nTreeMap<String, String> capitals = new TreeMap<>();\n\
    capitals.put(\"Russia\", \"Moscow\");\ncapitals.put(\"France\", \"Paris\");\n\
    capitals.put(\"Italy\", \"London\"); // 不对\ncapitals.put(\"Italy\", \"Rome\");\
    \ // 修正\nSystem.out.println(\"Capital Italy - \" + capitals.get(\"Italy\"));\n\
    \nfor (String s : capitals.keySet()) System.out.println(s + \": \" + capitals.get(s));\n\
    ```\n\n### 8.7. 继承（旧）容器类\n\n除了 `ArrayList<E>`、`HashSet<E>` 和 `HashMap<E>` 类外，还有功能类似的\
    \ `Vector<E>`、`Hashtable<E>` 和 `Dictionary<E>` 类。这些是旧版本库中的遗留类。它们的主要目的是提供向后兼容性。虽然它们没有被认为过时，但可能在新程序中最好避免使用它们。\n\
    \n### 8.8. 标准容器处理算法\n\nJava 标准库包含了标准的容器处理算法，以及一些辅助操作。所有这些都以 `Collections` 类（用于集合和关联列表）和\
    \ `Arrays`用于数组）静态方法的形式给出。相关方法见表 8.4、8.5。特别注意返回不可变容器封装的方法（`unmodifiableCollection()`、`unmodifiableList()`\
    \ 等）。这些方法返回一个实现相应容器类型的对象。在使用返回对象的估计和获取值的方法时，后者的行为与原始对象完全相同。尝试调用任何容器更改方法都会抛出类型为\
    \ `UnsupportedOperationException` 的异常。\n\n以下示例展示了在本章描述的工具的能力。\n\n```java\nvoid\
    \ sort(int[] a)\n```\n"
