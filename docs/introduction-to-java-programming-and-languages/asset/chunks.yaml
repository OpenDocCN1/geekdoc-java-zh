  trans: "\n\n该数据集包含一个游标，允许你在该集合的行之间移动。使用游标的技术在很大程度上类似于使用集合迭代器的技术（请参见第 8.2 节）。首先，初始标初始放置在第一个字符串集数据之前。\n\
    \n## 挑战方法\n\n![](img/image00510.jpeg)\n```java\nboolean next() throws SQLException\n\
    boolean previous() throws SQLException\n```\n\n允许分别在字符串集上向前和向后移动（游标保持在行之间！）。方法\n\
    \n![](img/image00511.jpeg)\n```java\nboolean relative ( int rows) throws SQLException\n\
    boolean absolute ( int row) throws SQLException\n```\n\n| 含义 | 描述 |\n| :--- |\
    \ :--- |\n| 参数 `rsType` | |\n| `TYPE_FORWARD_ONLY` (默认后), `TYPE_SCROLL_INSENSITIVE`,\
    \ `TYPE_SCROLL_SENSITIVE` | 数据是单向懒加载的；游标可能只能在数据集上向前移动；允许游标在任意方向移动，同时也对数据集内容进行任意访问；允许游标在随机方向移动，并对数据集内容进行随机访问；当数据库内容更改时，结果中的内容会自动更新，以满足其他请求的结果\
    \ |\n| 参数 `rsConcurrency` | |\n| `CONCUR_READ_ONLY` (默认), `CONCUR_UPDATABLE` |\
    \ “仅可读”模式；禁止更改数据集数据，允许更改数据；这些更改将自动在数据库中生效 |\n| 参数 `rsHoldability` | |\n| `HOLD_CURSORS_OVER_COMMIT`,\
    \ `CLOSE_CURSORS_AT_COMMIT` (默认后) | 事务提交后数据集保持打开，且其中的游标在事务提交后被保留；事务提交后数据集关闭 |\n\
    \n表 10.1. 数据集参数的值。所有值均为 `ResultSet` 类的常量。\n\n允许在数据集中对游标进行相对和绝对定位。指定的方法如果移动成功则返回值\
    \ `true`，如果请求的元素不存在则返回 `false`。注意记录的编号是以**为单位实现的！为了将游标定位在第一个元素之前和最后一个元素之后，使用了以下方法\n\
    \n| SQL 数据类型 | Java 数据类型 | SQL 数据类型 | Java 数据类型 |\n| :--- | :--- | :--- | :---\
    \ |\n| BOOLEAN | boolean | DOUBLE | double |\n| TINYINT | byte | VARCHAR | String\
    \ |\n| SMALLINT | short | NUMERIC | BigDecimal |\n| INTEGER | int | DATE | Date\
    \ |\n| BIGINT | long | TIME | Time |\n| FLOAT | float | BLOB | blob |\n\n表 10.2.\
    \ SQL 数据类型与 Java 类型的对应关系\n\n![](img/image00512.jpeg)\n```java\nvoid beforeFirst()\
    \ throws SQLException\nvoid afterLast() throws SQLException\n```\n\n所有列出的高级方法除\
    \ `next()` 方法外，仅在数据集不是单向的情况下工作（即读取参数 `rsType` 不等于 `TYPE_FORWARD_ONLY`）。\n\n为了接收数据集最后几行的字段值，即在任何定位方法移动（`next()`、`previous()`\
    \ 等）后，使用了以下方法\n\n![](img/image00513.jpeg)\n```java\n*** get***(int columnIndex)\
    \ throws SQLException\n*** get***(String columnName) throws SQLException\n```\n\
    \n在这里，替换名称的 Java 数据类型对应参数的 SQL 数据类型（参见表 10.2）。所需的字段通过其在数据库中的名称或请求中的编号指定（字段编号从一开始！）。除了\
    \ `get***` 方法，你可以使用通用方法\n\n```java\nObject getObject(int columnIndex) throws SQLException\n\
    Object getObject(String columnName) throws SQLException\n```\n\n它将请求字段的值作为相应现有类型的一个一个对象返回（参见表\
    \ 10.2）。如果该类型是基本类型，则会变为其包装类（例如用 `Integer` 代替 `int` 等；另请参见 P. 3.13）。\n\n以下方法在屏幕上显示任意表的内容。作为参数传递给方法的名称。在示例中，使用了\
    \ `ResultSetMetadata` 类的对象，允许你获取数据集字段的数量和名称。关于此类的更多信息可以在 JDBC 文档中找到。\n\n```java\n\
    /** 打印数据库表内容 */\npublic static void printDB(Connection conn, String tableName)\
    \ {\n    Statement s = conn.createStatement();\n    ResultSet r = s.executeQuery(\"\
    SELECT * FROM \" + tableName);\n    ResultSetMetaData md = r.getMetaData();\n\
    \    while (r.next()) {\n        for (int i = 1; i <= md.getColumnCount(); i++)\
    \ {\n            System.out.print(r.getObject(i) + \"\\t\");\n        }\n    }\n\
    \    s.close();\n}\n```\n\n## 10.6. 可修改数据集\n\n如果数据集持有主键且 `rsConcurrency` 选项设置为\
    \ `CONCUR_UPDATABLE`，则可以使用调用方法来修改表\n\n```java\nvoid update***(int columnIndex,\
    \ *** x) throws SQLException\nvoid update***(String columnName, *** x) throws\
    \ SQLException\n```\n\n更改通过调用（Images/image00514.jpeg）记录在数据库中\n\n```java\nvoid\
    \ updateRow() throws SQLException\n```\n\n要删除数据集的当前记录，使用方法（Images/image0479.jpeg）\n\
    \n```java\nvoid deleteRow() throws SQLException\n```\n\n为了将游标返回到插入之前的位置，使用了方法\n\
    \n```java\nvoid moveToCurrentRow() throws SQLException\n```\n\n然后使用方法填充添加的记录（Images/image0479.jpeg）\n\
    \n```java\nvoid insertRow() throws SQLException\n```\n\n下一个示例从 P. [10.4] 数据修改数据库：\n\
    \n```java\nStatement s = conn.createStatement(ResultSet.TYPE_SCROLL_INSENSITIVE,\
    \ ResultSet.CONCUR_UPDATABLE);\nResultSet r = s.executeQuery(\"SELECT Id, Name,\
    \ Telephone, Age FROM people\");\n\n// 为所有人年龄加 1\nwhile (r.next()) {\n    r.updateInt(4,\
    \ r.getInt(4) + 1);\n    r.updateRow();\n}\n\n// 添加新记录\nr.moveToInsertRow();\n\
    r.updateString(\"Name\", \"Smirnov\");\nr.updateObject(\"Telephone\", \"26-08-58\"\
    );\nr.updateInt(\"Age\", 43);\nr.insertRow();\nr.moveToCurrentRow();\ns.close();\n\
    ```\n\n## 10.7. 使用预编译查询\n\n在这些情况下，当执行大量相似的数据库请求且仅参数不同时，为了提高性能，你可以使用预编译查询。预编译请求对应于实现\
    \ `PreparedStatement` 接口的对象。通过以下方法创建此类对象\n\n```java\nPreparedStatement prepareStatement(String\
    \ sql) throws SQLException\nPreparedStatement prepareStatement(String sql, int\
    \ resultSetType, int resultSetConcurrency, int resultSetHoldability) throws SQLException\n\
    ```\n\n在连接对象上调用。这些方法接受请求模式字符串，其中包含参数位置的问号，例如：\n\n```sql\nINSERT INTO people(Name,\
    \ phone, age) VALUES (?, ?, ?)\n```\n\n参数值通过调用方法给出\n\n```java\nvoid set***(int\
    \ parameterIndex, *** x) throws SQLException\nvoid set***(String columnName, ***\
    \ x) throws SQLException\n```\n\n"
