    | :--- | :--- | :--- |

    | `byte` | one | –128 to 127 |

    | `short` | 2 | –32768 to 32767 |

    | `int` | 4 | –2147483648 to 2147483647 |

    | `long` | eight | $-2^{63}$ to $2^{63} -1$ |

    | `float` | eight | $1.4 \times 10^{-45}$ to $3.4 \times 10^{38}$ |

    | `double` | 16 | $1.7 \times 10^{-324}$ to $4.9 \times 10^{308}$ |

    | `char` | 2 | 0 to 65535 |

    | `Boolean` | — | true, false |


    Table 1.1. Primitive types data in Java


    Symbolic literals are limited to single quotes. So hexadecimal representation
    in Unicode is also possible. In the latter case, the literal is written as a sequence
    of four hexadecimal digits prefixed with `\u`. For example, the literal `'' yu
    ''` may be presented in form `''\u...''`.


    String literals are limited quotation marks. Two boolean literals `true` and `false`
    are defined that are not equal to an integer.


    ## 1.3. Variables


    Declaring variables in Java is similar to C++. Any variable can be initialized
    at the time of description. The action and lifetime of a local variable is limited
    by the block in which is described.


    Unlike C++, no declaration is allowed in inner block with the same name as the
    outer block. Variables declared with the `final` specifier are unchangeable (constant).
    For example:


    ```java

    final double PI = 3.141592653589793;

    ```


    ## 1.4. Type conversions


    Type conversions in Java are divided on implicit and explicit. Implicit transformations
    are carried out automatically. Rules for Automatic Casting in Java are much more
    rigid than C++. Unlike C++ implicit conversions in Java are performed only when
    possibly guarantee what no loss of significance. For example, the following line,
    which is correct from the point of view of the C++ language, in Java it will cause
    a compilation error:


    ```java

    int x = 2.5; // try implicit conversion from double to int

    ```


    Let us give more formal rules for implicit conversion. Automatic type conversion
    when assigning found, if fulfilled the following conditions:


    - required cast integer type or type `char` to some numerical type or real;

    - type, to whom required cast, It has more the size, how original.


    Automatic transformation types in expressions carried out for arguments operations
    concatenation lines:


    - if one from arguments binary operations It has type `double`, second is given
    to type `double`;

    - otherwise: if one from arguments It has type `float`, second is given to type
    `float`;

    - otherwise: if one from arguments It has type `long`, second is given to type
    `long`;

    - otherwise both argument are given to type `int`.


    The last point should be noted here. In some cases it application may lead to
    unnatural results. For example, the following snippet is wrong in terms of language:


    ```java

    short a = 5;

    short b = a + 1; // error: short is required, not int

    ```

