    # 1. Types data, literals, variables


    ## 1.1. Primitive data types


    Java defines 8 primitives types. The main feature of primitive data types in Java
    is that variables of these types are not objects. All other types, including arrays
    and string type `String`, are object references. More fractional they will be
    considered in P.


    These include four integer `byte`, `short`, `int`, `long`, two real floats and
    `double`, character `char` and logical `boolean`. Their main characteristics are
    given in table.


    ## 1.2. Literals


    Integer literals can be specified in ten, octal and hexadecimal form. Literals
    in decimal form are written directly, for the rest they are used prefixes similar
    to prefixes in the C language: `0` - for octal and `0x` for hexadecimal literals.
    For example, the literal `47` can be represented as `47`, `057`, or `0x2F`. All
    integers literals are automatically given to minimum possible type, but not higher
