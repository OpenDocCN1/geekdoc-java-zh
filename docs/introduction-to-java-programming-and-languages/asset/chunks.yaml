    \n```java\nimport java.io.*;\nimport java.net.*;\n\n/** \"Mathematical server\"\
    \ 类 */\npublic class MathServer\n{\n    /**  端口号，监听器监听的端口 */\n    public static\
    \ final int PORT = 21370;\n\n    /** 程序的入口 */\n    public static void main(String[]\
    \ args) throws IOException\n    {\n        ServerSocket serv = new ServerSocket(PORT);\n\
    \        try\n        {\n            // 服务器主循环\n            while ( true )\n \
    \           {\n                // 组合发送与接收流 I/O\n                Socket s = serv.accept();\n\
    \                try\n                {\n                    BufferedReader in\
    \ = new BufferedReader(\n                        new InputStreamReader(s.getInputStream()));\n\
    \                    PrintWriter out = new PrintWriter(\n                    \
    \    new OutputStreamWriter(s.getOutputStream()),\n                        true);\n\
    \                    // 接收数据、处理并返回结果\n                    try\n              \
    \      {\n                        if (!in.ready())\n                         \
    \   throw new NumberFormatException();\n                        int a = Integer.parseInt(in.readLine());\n\
    \                        if (!in.ready())\n                            throw new\
    \ NumberFormatException();\n                        int b = Integer.parseInt(in.readLine());\n\
    \                        out.println(a + b);\n                        in.close();\n\
    \                        out.close();\n                    }\n               \
    \     catch (NumberFormatException e)\n                    {\n               \
    \         out.println(\"Invalid format input data\");\n                    }\n\
    \                }\n                catch (Exception e)\n                {\n \
    \                   System.err.println(\"Error I/O\");\n                }\n  \
    \              finally\n                {\n                    s.close(); // 保证关闭客户端\
    \ socket\n                }\n            }\n        }\n        finally\n     \
    \   {\n            serv.close(); // 保证关闭监听端口\n        }\n    }\n}\n```\n\n服务器打开\
    \ `21370` 端口，随后进入无限循环服务客户端（在实际服务器中应提供全天候工作完成）。当客户端到达请求时，`accept()` 方法打开相应的 socket。服务器处理客户端传输的数字，计算它们的和并返回给客户端。如果客户端发送的数据格式错误（例如，只有一个数字而不是两个，或者传输的不是数字），服务器将向客户端发送错误消息。如果在输入/输出过程中发生错误，服务器将在标准错误流中显示消息。无论是否发生错误，客户端\
    \ socket 都会关闭，服务器将等待下一个请求。如果端口未打开或 `accept()` 方法失败，则相关异常将被处理器拦截，服务器任务将结束。\n\n\
    “数学服务器”客户端是一个控制台程序。输入数据通过命令行参数传递给客户端。假设客户端运行在服务器相同的机器上，但通过修改 `getByName()` 方法传输的地址可以轻松更改这种行为。\n\
    \n```java\nimport java.io.*;\nimport java.net.*;\n\n/** \"Customer mathematical\
    \ server\" 类 */\npublic class MathClient\n{\n    public static void main(String[]\
    \ args) throws IOException\n    {\n        if (args. length != 2)\n        {\n\
    \            System.out.println(\"Invalid call programs\");\n            return\
    \ ;\n        }\n        // 组合发送与接收流 I/O\n        InetAddress addr = InetAddress.getByName(\"\
    127.0.0.1\");\n        Socket s = new Socket(addr, MathServer.PORT);\n       \
    \ try\n        {\n            BufferedReader in = new BufferedReader(\n      \
    \          new InputStreamReader(s.getInputStream()));\n            PrintWriter\
    \ out = new PrintWriter(\n                new OutputStreamWriter(s.getOutputStream()),\
    \ true);\n            // 发送数据给服务器\n            out.println(args[0] + \"\\n\" +\
    \ args[1]);\n            // 接收响应并显示在屏幕上\n            System.out.println(in.readLine());\n\
    \        }\n        finally\n        {\n            s.close(); // 保证关闭客户端 socket\n\
    \        }\n    }\n}\n```\n\n### 11.6 对应用层协议的支持\n\n支持网络协议底层最重要的类之一是 `URL` 类。它封装了万维网\
    \ URL 资源，并允许通过以下协议获取该资源的内容：http, https, ftp, file, jar。\n\n要创建类的实例，通常上使用构造函数：\n\
    ```java\nURL(String url) throws MalformedURLException\n```\n\n为了建立连接并发现输入流，绑定到所需的资源，使用了方法：\n\
    ```java\nInputStream openStream() throws IOException\n```\n它返回一个可以获取所请求资源的流。\n\
    \n下面的示例演示了 `URL` 类的用法。它读取 URL 指定资源的内容并写入文件。URL 资源和文件名是输入的两个参数。\n\n```java\nimport\
    \ java.io.*;\nimport java.net.*;\n\nclass getfile\n{\n    public static void main(String[]\
    \ args)\n    {\n        if (args. length != 2)\n        {\n        }\n       \
    \ try\n        {\n            System.out.println(\"Invalid call programs\");\n\
    \            return ;\n            URL url = new URL(args[0]);\n            String\
    \ filename = args[1];\n            InputStream in = url.openStream();\n      \
    \      FileOutputStream out = new FileOutputStream(filename);\n            int\
    \ b;\n            while ((b = in.read()) != -one) out.write(b);\n            in.close();\n\
    \            out.close();\n        }\n        catch (IOException e)\n        {\n\
    \            System.err.println(\"Error I/O\");\n        }\n    }\n}\n```\n"
