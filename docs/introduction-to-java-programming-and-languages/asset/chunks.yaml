  trans: "\n异常 — 一个在发生异常时被抛出的对象。它通常封装了该情况的描述信息。被抛出的异常会被某个异常处理器（一个处理异常情况的软件块）捕获。在执行处理器后，控制权将转移到紧随处理器之后的语句。通过这种方式，程序的一个部分跳转到另一个部分，并执行封装在异常情况形式中的某些特殊操作。\n\
    \n## 5.2. 抛出和处理异常。\n\n为了抛出异常，您使用以下语法：\n\n```java\nthrow exception object;\n```\n\
    \n通常 `exception object` 直接在 `throw` 操作符中创建，例如：\n\n```java\nthrow new NullPointerException();\n\
    ```\n\n抛出异常的语句必须位于特殊的 `try` 块内部，其后紧跟异常异常处理器：\n\n```java\ntry\n{\n    exception-throwing-operators\n\
    }\ncatch ( exception_class_name variable_name)\n{\n    exception_handler_body\n\
    }\n[ finally\n{\n    operators\n}]\n```\n\n如果 `try` 块中的某个语句抛出了异常，则该块中的所有后续操作将不再执行，并开始搜索处理器。处理器的头部包含一个与抛出的异常对象类型匹配的类型，或者其父类类型（不一定是直接父类）。搜索按照以下规则进行：\n\
    \n- 如果抛出异常的语句不在 `try`-块中，则方法将退出，并在调用方法中继续搜索（这可能会重复多次），直到调用该方法的语句之一位于 `try` 块中；\n\
    - 在紧随数据 `try`-块 后的 `catch` 块中搜索处理器；\n- 如果没有找到合适的处理器，搜索继续在与嵌套 `try` 块相关的 `catch`\
    \ 块中进行（此时也可能发生从一个或多个方法的输出）；\n- 如果完全没有找到合适的处理器，异常会被默认处理器捕获，该处理器会打印异常描述、堆栈跟踪并结束程序工作。如果找到了合适的处理器，它将被执行，异常对象将作为参数传递给处理器。在处理器执行结束，控制权将转移到处理完异常的块之后的所有\
    \ `catch` 块之后的操作符。\n\n子类异常处理器必须在被处理之前存在。父类异常也是，否则所有此类异常将由父类异常处理器处理，导致代码中不可用。\n\
    \n在 `finally` 块可用时，该块的执行不取决于是否抛出了异常：\n\n- 如果发生了异常并被处理，则 `finally` 块在异常处理器执行后执行；\n\
    - 如果没有找到处理器，则 `finally` 块在包含块内搜索处理器之前执行；\n- 如果 `try`-块的输出通过 `return` 操作符完成，则 `finally`\
    \ 块在离开方法之前执行。\n\n## 5.3. 示例。\n\n考虑一个对段落 3.11 内容进行改进的示例。这个“整数栈”类的实现执行了对栈栈操作的正确性检查，并在发生错误时抛出相应的异常。\n\
    \n```java\n/** \"整数栈\" 类 */\nclass IntStack\n{\n    private final int MAXLEN =\
    \ 64; // 栈的最大尺寸\n    private int s[] = new int [MAXLEN], size = 0;\n\n    /**\
    \ 获取栈的大小 */\n    public int getSize() {\n        return size;\n    }\n\n    /**\
    \ 在栈中压入元素 */\n    public void push(int e)\n    {\n        if (size < MAXLEN) s[size++]\
    \ = e;\n        else\n            throw new RuntimeException(\"栈溢\");\n    }\n\
    \n    /** 从栈中弹出元素 */\n    public int pop()\n    {\n        if (size != 0) return\
    \ s[--size];\n        throw new RuntimeException(\"栈中没有元素\");\n    }\n\n    /**\
    \ 检查栈是否为空 */\n    public boolean isEmpty() {\n        return size == 0;\n    }\n\
    }\n\npublic class IntStackExample\n{\n    /** 从栈顶移除 n 个元素并在屏幕上输出 */\n    static\
    \ void popAndPrint(IntStack st, int n)\n    {\n        for (int i = 0; i < n;\
    \ ++i) System.out.println(st.pop());\n    }\n\n    /** 程序入口 */\n    public static\
    \ void main(String args[])\n    {\n        IntStack st = new IntStack();\n   \
    \     try\n        {\n            st.push(3); st.push(5); st.push(7); popAndPrint(st,\
    \ 4);\n        }\n        catch (RuntimeException e)\n        {\n            System.out.println(\"\
    抛出的异常: \" + e);\n        }\n    }\n}\n```\n\n## 5.4. 异常和错误的类层次结构。\n\nJava 中的所有异常对象必须属于一个类，该类继承自\
    \ `Throwable` 类，而该类有两个子类：`Exception` 和 `Error`。`Error` 类型的异常是由 JVM 在发生严重错误时抛出的。按照惯，程序员既不应该抛出也不应该处理此类异常。所有剩余的异常都是\
    \ `Exception` 类及其子类的实例。此外，还有一组特殊的异常，由类 `RuntimeException` 及其子类表示。由于 `Exception`\
    \ 类是所有抛出异常（无论其类型如何）的父类，可以使用以下构造结构：\n\n```java\ncatch(Exception e)\n{\n    // .\
    \ .\n}\n```\n\n关于异常有一项重要特性，即 `Exception` 类及其子类的实例，但 `RuntimeException` 类及其子类除外。如果一个此类异常从方法抛出，则必须在断言中指定其类型。在方法头部中声明\
    \ throws：\n\n`[访问修符] 返回类型 方法名 ( 参数列表 ) [throws 方法抛出的异常类名列表]`\n\n所有引起此类异常但未对异常进行处理的方法也必须在\
    \ `throws` 处声明。否则，编译器将给出错误信息。这样做是为了引起程序员对需要强制处理的异常情况的注意。在标准库中此类异常包括：I/O 错误 (`IOException`)、数据库访问错误\
    \ (`SQLException`) 以及其他。当抛出是 `RuntimeException` 类及其子类实例的异常时，不需要特殊的声明。在库中，这些异常包括：实现中不可接受的数学运算\
