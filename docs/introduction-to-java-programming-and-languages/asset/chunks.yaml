  trans: "\n\n### 3.4. 访问字段和方法\n一旦创建了对象，就可以通过操作符（`.`）访问其字段和方法：\n\n```\nmyObject.someMethod();\n\
    ```\n\n当从同一对象上调用的方法访问该对象的字段或方法时，可以省略对象的名称，或者用 `this` 关键字替换它。`this` 关键字也用于从另一个构造函数调用类的构造函数（参见下文示例）。在后一种情况下，此类调用必须是\
    \ `constructor` 中的第一条语句。\n\n### 3.5. 示例\n作为一个示例，考虑类 `Box`（意为“盒子”），它用于存储某些箱子的尺寸（三个整数）。`Box`\
    \ 类包含具有不同参数的重载构造函数，以及一个计算箱子体积的 `volume()` 方法。`SimpleBoxDemo` 类演示了 `box` 类副本的创建和使用。为了简化示例，此处没有使用访问控制（参见\
    \ 3.10 访问控制）。在实践中，任何人都不应该使用这种方法！\n\n```java\n/** Class \"Box\" */\nclass Box {\n\
    \    /** 尺寸字段 */\n    int width, height, depth;\n\n    /** 默认构造函数 */\n    Box()\
    \ { width = height = depth = 0; }\n\n    /** 基本构造函数 */\n    Box(int width, int\
    \ height, int depth) {\n        this.width = width;\n        this.height = height;\n\
    \        this.depth = depth;\n    }\n\n    Box(int size) {\n        this(size,\
    \ size, size); // width = height = depth = size;\n    }\n\n    /** 计算体积的方法 */\n\
    \    int volume() { return width * height * depth; }\n}\n\npublic class SimpleBoxDemo\
    \ {\n    static void main(String[] args[]) {\n        Box b1 = new Box(5), b2\
    \ = new Box(5, 10, 20);\n        b1.width = 10;\n        System.out.println(b1.volume()\
    \ + \"\\n\" + b2.volume());\n    }\n}\n```\n\n### 3.6. 删除对象\nJava 中的删除对象操作不需要手动查找。它的机制是自动垃圾回收。为了确保该机制运行，`JVM`（Java\
    \ 虚拟机）会跟踪每个被创建对象的引用计数等，一旦某个对象没有引用，它就会成为删除的候选对象。对象的删除是定期执行的，并且仅在 Java 中提供了需要释放的内存时才会进行。由于内存释放是由\
    \ `JVM` 实现的，因此这种操作的需求并不频繁。如果仍然需要它们，你应该定义自己的方法并显式地调用它们。这里的例子是 Java 类中的 `close()`\
    \ 方法，用于执行 I/O 流的关闭。\n\n### 3.7. 静态字段和方法\n静态字段和现有方法在每个类中只存在一个实例，也就是说，它们被该类的所有副本共享。\n\
    \n声明静态字段和方法需要使用特殊的修饰符 `static`：\n\n```java\nstatic int static_field = ten;\n```\n\
    \n静态字段在类加载时初始化，值可以是声明中指定的（参见段落 3.5 的示例），也可以在特殊的 `static` 块中初始化。\n\n静态方法不能（在不显式指定对象的情况下）访问类的非静态字段和非静态方法。\n\
    \n调用静态字段和方法可以在不创建类实例的情况下进行。在这种情况下，在大多数情况下使用类名而不是实例名。例如：\n\n```java\ndouble x =\
    \ Math.sqrt(2.0);\n```\n\n作为所有 Java 程序的入口的 `main()` 方法应该声明为 `static`（参见段落 3.5\
    \ 的示例）。\n\n### 3.8. 引用传递方法与对象链接的特殊性\n对象引用的行为类似于 C 语言中的指针，因此将一个对象引用赋值给另一个不会导致对象的复制。要执行对象的复制，类通常会实现一个拷贝构造函数，以及可能的\
    \ `clone()` 方法。\n\n基本类型通过值传递给方法。这同样适用于对象引用，因此对象本身是通过引用传递的（类似于在 C 中拷贝指针）。\n\n让我们考虑使用对象引用时的典型错误。假设在以下实现中有\
    \ `Point` 类：\n\n```java\nclass point {\n    public double x, y;\n    public Coords(double\
    \ _x, double _y) {\n        x = _x;\n        y = _y;\n    }\n}\n```\n\n假设需要实现一个交换两个对象的方法。在\
    \ `point` 类中，由于 `point` 对象是通过引用传递的，实现可能是：\n\n```java\nstatic void swap(Coords\
    \ c1, Coords c2) {\n    Coords s = c1;\n    c1 = c2;\n    c2 = s;\n}\n```\n这是错误的，因为它只交换了局部引用。要交换实际的对象，我们应该交换它们的内容。这里是实现的一个示例：\n\
    \n```java\nstatic void swap(Coords c1, Coords c2) {\n    double temp = c1.x;\n\
    \    c1.x = c2.x;\n    c2.x = temp;\n    double tempY = c1.y;\n    c1.y = c2.y;\n\
    \    c2.y = tempY;\n}\n```\n最后，当将对象引用作为参数传递时，对象本身是可以被修改的。\n\n### 3.9. 包与类的结构\n\
    包是 Java 程序中类型（类和接口）的分组。每个包可以包含一个或多个类以及其他包。通过包划分类有助于解决命名冲突并实现更高效的访问控制。\n\n引用包的元素时，使用完整路径，该路径由点分隔的子包组成（例如\
    \ `java.util`）。引用同一包中的类时，可以直接使用它们的名称。\n\nJava 的翻译单元是一个文件。每个翻译单元以 `package` 语句开头，定义这些类所属的包。\n\
    \n```java\npackage package.mysubpackage;\n```\n\n如果没有 `package` 语句，类将属于一个没有名称的默认包，该包没有子包且对其他包可见。\n\
    \n翻译单元可以包含多个 `import` 语句，允许在引用类时省略包名。例如，如果模块中存在以下行：\n\n```java\nimport java.util.*;\n\
    ```\n\n那么 `java.util` 包中的所有类（但不包括子包中的类！）都可以使用短名进行访问。从包导入单个类的示例为：\n\n```java\n\
    import java.util.HashSet;\n```\n\n"
