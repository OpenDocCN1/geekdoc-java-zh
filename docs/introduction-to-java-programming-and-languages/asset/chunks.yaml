    \n# 2. 运算与运算符\n\n### 2.1. 运算的一般特征\n大多数 Java 运算与 C++ 运算相似，尽管某些运算的功能略有不同。由于 Java\
    \ 中没有指针，因此自然没有获取地址（`&`）、引用（`*`）和间接寻址（`->`）的操作。Java 中的 `.`（点）用于通过对象引用访问对象的字段和方法（更多细节参见\
    \ P. 3.3）。\n\n接下来的段落描述了基本的 Java 运算。优先级运算见表 2.1。\n\n### 2.2. 算术运算\n算术运算包括以下运算：保持和改变符号的一元运算（`+`\
    \ 和 `-`）；一元递增递减运算符（`++` 和 `--`）；加、减、乘、除和取余的二元运算（`+`、`-`,``*`、`/`,`%`）。加、减、乘、除和取余的二元运算（`+`、`-`,``*`、`/`,`%`）、带赋值的一元运算（`+=`、`-=`、`*=`、`/=`、`%=`）使用\
    \ `int` 和 `long`。兼容类型的显式转换执行如下：转换规则：\n\n| 运算 |  |\n| :--- | :--- |\n| `+` | ...\
    \ |\n| `-` | ... |\n| `*` | ... |\n| `/` | ... |\n| `%` | ... |\n| `+=` | ...\
    \ |\n| `-=` | ... |\n| `*=` | ... |\n| `/=` | ... |\n| `%=` | ... |\n| `++` |\
    \ ... |\n| `--` | ... |\n| `<<` | ... |\n| `>>` | ... |\n| `>>>` | ... |\n| `&`\
    \ | ... |\n| `\\|` | ... |\n| `^` | ... |\n| `==` | ... |\n| `!=` | ... |\n| `<`\
    \ | ... |\n| `>` | ... |\n| `<=` | ... |\n| `>=` | ... |\n\n算术运算使用 `int` 和 `long`。兼容类型的显式转换执行如下：转换规则：\n\
    \n- 通过`截断`产生的收缩整数类型的旧位\n- 将实数类型赋值给整数结果时，其`截断`是通过丢弃小数部分并应用之前的`future` 项完成的。\n\n\
    显式类型转换的语法与 `C` 中的强制类型转换相同（参见示例）。\n\n最后，某些类型转换是无效的——例如，此类转换包括：任何两个 `Boolean` 类型之间的转换、类到原始类型的转换、以及原始类型到类的转换（某些例外除外）等。尝试执行此类转换会导致编译阶段错误。\n\
    \n### 2.3. 比较运算\n比较运算包括 `==`、`!=`、`<`>`。与对应的 C++ 运算唯一区别在于其结果总是 `Boolean`。\n\n\
    ### 2.4. 逻辑运算\n逻辑运算适用于 `Boolean` 参数并产生 `Boolean` 结果。包括：一元“非”运算（`!`）、二元“与”运算（`&&`、`&`）、“或”运算（`|`、`||`）以及“异或”运算（`^`），以及类似的赋值运算（`&=`、`|=`、`^=`）。\n\
    \n`&&` 和 `||` 只在结果可能的情况下计算第二个参数的值。相比之下，`&` 和 `|` 总是计算两个参数的值。例如：\n\n```java\nint\
    \ x = 10, y = 10;\nif(x == 10 || ++y == 10) System.out.println(y);\n```\n输出“ten”，所以没有计算第二个参数运算。\n\
    \n```java\nint x = 10, y = 10;\nif(x == 10 | ++y == 10) System.out.println(y);\n\
    ```\n结果将是“eleven”。\n\n### 2.5. 条件运算\nJava 有类似于 C++ 的条件运算 `?:`。其语法为：如果条件为真，则该运算的结果为表达式\
    \ `expression1`，否则为 `expression2`。在这种情况下，不是运算结果的表达式不会被求值。重要的是，Java 中的条件必须是 `boolean`\
    \ 类型（另见 P. 2.7）。\n\n### 2.6. 赋值运算符与表达式运算符\n所有的 Java 语言语句（与所有其他语言一样）都有返回值。然而，除此之外，它们（在\
    \ C、C++ 中是，但在其他语言中不是）还可以改变其操作数。此类运算包括 `++`、`--`、=` 以及所有赋值运算。\n\n"
