    \ 库的目录。源文件通常也按照包的层级结构位于文件系统中。\n\n### 3.10. 访问控制与封装。\n\n访问控制用于：一方面，防止由于误用或恶意使用导致对象中包含的数据发生未经授权的更改；另一方面，将类的接口与其实现分离（（隐藏实现）。使用该类的程序员只能看到它的接口（具有\
    \ public 权限的字段和方法），而可能对该类的内部结构一无所知。后者允许你更改类的实际实现，而对程序员来说是透明的。例如，你可以将实现替换为更高效的、完全重构的内部类设备，而使用该类的程序将在不进行任何更改的情况下与新版本的类工作。\n\
    \n将字段和方法放在类内部并隐藏实现被称为封装。封装是面向对象编程的一个特征属性。\n\n访问控制通过在类、字段和方法的描述中设置某些访问修饰符来实现。在\
