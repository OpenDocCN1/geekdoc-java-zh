  md: '![](img/d64f835c7d886ce126e71e676350034c_126_0.png)


    Figure 6.5: ZGC process mapping


    Dynamic memory allocation, a common practice in programming, contributes to memory
    fragmentation over time. When objects are allocated and deallocated, free spaces
    can emerge in the memory layout. Over time, these gaps accumulate, leading to
    fragmentation, wherein the memory resembles a chessboard with alternating areas
    of free and used space. To address this, there are two main strategies.


    One approach involves periodically scanning the memory for free space large enough
    to accommodate the desired object. This method, while feasible, resource-intensive,
    especially if performed frequently. Additionally, it not entirely eliminate fragmentation,
    as finding an exact match for the required space size can be challenging, leaving
    gaps between objects.


    The alternative strategy is to periodically relocate objects from fragmented memory
    areas to a more compact format. It involves dividing the memory into blocks and
    relocating entire blocks of objects simultaneously. By doing so, the allocation
    of memory becomes faster, as known empty blocks are available. This strategy helps
    manage fragmentation more efficiently, balancing the need for dynamic allocation
    and the desire for a more contiguous and organized memory layout.


    Trade-offs are inherent in garbage collection strategy, and ZGC is no exception.
    While it excels in reducing pause times, it may not achieve the same throughput
    as collectors optimized for throughput at the expense of latency. Additionally,
    ZGC might not be optimal for applications with extremely large heaps, as its concurrent
    approach may introduce some overhead. However, for scenarios where low latency
    is priority, and the application''s responsiveness takes precedence over maximum
    throughput, ZGC emerges as a powerful solution.


    Another notable feature of ZGC is its ability to resize the heap dynamically.
    ZGC adapts the heap size to the application''s demand, allowing it to manage memory
    in response to changing workloads'
