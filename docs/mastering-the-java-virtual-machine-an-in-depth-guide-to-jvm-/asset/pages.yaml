  md: '# Platform threads and virtual threads


    In the evolving landscape of Java concurrency, the role of threads takes center
    stage, influencing the performance and responsiveness of our applications. With
    the release of version 21, the Java platform introduces a groundbreaking shift
    – the coexistence of two distinct thread types, platform threads and the revolutionary
    virtual threads.


    Traditionally, every instance of java.lang.Thread in the JDK has been a platform
    thread. This thread runs Java code on an underlying OS thread, monopolizing that
    thread for the entirety of the code''s execution. The number of platform threads
    is limited by the number of available OS threads, leading to potential bottlenecks
    in resource utilization.


    Virtual threads mark a paradigm shift in the concurrency landscape. Unlike their
    platform counterparts, virtual threads run Java code on an underlying OS thread
    without capturing it for the code''s entire lifetime. While multiple virtual threads
    can efficiently share the same OS thread, offering a lightweight and scalable
    approach to concurrency. In contrast to the limited number of platform threads,
    the flexibility of virtual threads allows for a much larger pool, making them
    a powerful tool for optimizing resource usage.


    Virtual threads introduce the M:N scheduling concept, a departure from the traditional
    1:1 scheduling of platform threads. In this new paradigm, a substantial (M) of
    virtual threads can be scheduled to run on a smaller number (N) of OS threads.
    This approach mirrors the success of user-mode threads in other languages, such
    as goroutines in Go and processes in Erlang. It harks back to Java''s early days
    when green threads, albeit sharing a single OS thread, laid the foundation for
    what would become the larger threads we have today.


    As we navigate the cityscape of the JVM, the synergy of both platform threads
    and virtual threads becomes pivotal. The efficiency gains and scalability offered
    by virtual threads are transformative, especially in scenarios where resource
    optimization is paramount. Whether you''re orchestrating complex concurrent operations
    or aiming for more responsive applications, understanding the nuances of these
    thread types equips you to make informed choices.


    In this dynamic era of Java concurrency, there are no longer one-size-fits-all,
    the ability to leverage both platform and virtual threads empowers developers
    to navigate the complex terrain of modern application development. As you delve
    into the intricacies of M:N scheduling and lightweight concurrency, seize the
    opportunity to enhance the responsiveness and efficiency of your Java applications
    in the era of virtual threads.


    # Summary'
