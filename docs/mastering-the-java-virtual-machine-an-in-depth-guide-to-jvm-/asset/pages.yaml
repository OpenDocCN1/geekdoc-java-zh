  md: 'A runtime instance of the JVM has a specific and well-defined life cycle. Its
    mission is clear—to run a single Java application. Here’s a breakdown of the JVM
    life cycle:


    +   1. Instance birth: When a Java application is launched, a runtime instance
    of the JVM is created. This instance is responsible for executing the application''s
    bytecode and managing its runtime environment.


    +   2. Execution: The JVM instance starts the Java application by invoking the
    main () method of a designated initial class. This main () method serves as the
    entry point for the application and must meet specific criteria: it should be
    public, static, return void, and accept a single parameter, which is an array
    of strings (String[]). As of the time of writing, it’s important to note that
    the main () method may evolve, a preview version in Java 21 shows potential simplifications.
    Therefore, developers should stay informed about the latest language updates and
    best practices regarding the main () method''s signature. Any class with a main
    () method can serve as the starting point for a Java application.


    +   3. Application execution: The JVM executes the Java application, processing
    its instructions and managing memory, threads, and other resources as needed.


    +   4. Application completion: Once the Java application is executed, the JVM
    is no longer needed. And so, the JVM instance dies.


    It’s important to note that the JVM follows one application per instance model.
    Suppose you start multiple Java applications concurrently on the same computer,
