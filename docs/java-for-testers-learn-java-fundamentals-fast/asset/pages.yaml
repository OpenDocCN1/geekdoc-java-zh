    # # Set


    We described set in the earlier collection chapter.


    In this chapter we will build on Set and consider the SortedSet.


    # # SortedSet


    The SortedSet, like the Set strips out duplicates if you try to add them.


    The SortedSet also:


    +   * guarantees the order of the elements based on a Comparator or the compare
    method of the elements


    The sorted relies on the elements in the set to implement a comparable interface
    which mandates the implementation of a compareTo method. Or you can provide a
    Comparator to the SortedSet implementation at instantiation, and the Comparator
    knows how to compare the objects.


    For the examples I will mainly use String but will also provide a short overview
    of the Comparator.


    +   * first - return the first item

    * last - return the last item

    * headSet(e) - return the SortedSet of elements, before element e

    * tailSet(e) - return the SortedSet of elements after and including element e

    * subSet(e1, e2) - the SortedSet from (and including) element e1, to (but excluding)
    e2'
