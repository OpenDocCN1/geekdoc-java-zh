    \ is met, in this case while we are still accessing an item in the array - there\
    \ are 5 items in the array. Remember array index starts at 0 so the last item\
    \ is 4. Index 5 is out of bounds, so we use <5.\n* i++ increment the value of\
    \ the index\n\nThe more generic explanation of a for loop is actually:\n\n```\n\
    for ( initialize statement executed once; loop condition; executed after each\
    \ loop){\n// do something\n```\n\nSo I could have written the loop:\n\n```\nint\
    \ i=0;\nfor(i<5; i++){\n   days = days + \"|\" + workdays[i];\n}\n```\n\nWhere\
    \ the variable is initialized outside the loop and my initialize statement is\
    \ empty.\n\nAlso:\n\n```\nint i=0;\nfor(i<5) {\n   days = days + \"|\" + workdays[i];\n\
    \   i++;\n}\n```\n\nAnd even\n\n```\nint i=0;\nfor(; ) {\n   days = days + \"\
    |\" + workdays[i];\n   i++;\n   if(i>=5) break;\n}\n```\n\nIn above code I'm using\
    \ the break statement which we saw in the switch section, to break out of the\
    \ loop.\n\n# break\n\nbreak is a generic keyword to end control statement execution.\
    \ break can exit an if, switch, and for later iteration constructs while, do...while\n\
    \nGenerally, keeping to the traditional example shown at the start of this section\
    \ makes your code more readable and maintainable. e.g.\n\n```\nfor(int i=0; i<5;\
    \ i++){\n   days = days + \"|\" + workdays[i];\n}\n```\n\nYou can see each of\
    \ the variants that when even one of the statements for(...) are missing, you\
