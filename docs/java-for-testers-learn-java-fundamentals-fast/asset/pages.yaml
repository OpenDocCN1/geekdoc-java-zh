- pgno: 94
  md: "Once declared, you can find the size of an array using the length method:\n\
    \n```\nassertEquals(5, weekdays.length);\n```\n\nThe typical use for the length\
    \ method is in a loop condition e.g.\n\n```\nfor(int i=0; i<weekdays.length; i++)\
    \ {\n    days = days + \",\" + weekdays[i];\n}\n```\n\nSince the length of an\
    \ array is always the index of the next item to add in the array, make sure that\
    \ we use < array.length in the loop condition.\n\n# Useful methods in the Arrays\
    \ class\n\nJava provides an Arrays class in java.util.\nIn order to use Arrays,\
    \ you need to import it.\n\n```\njava.util.Arrays;\n```\n\nThe Arrays class provides\
    \ a number of useful static methods.\nWe will cover a subset of the methods here.\
    \ You can see the full range of methods in the official documentation.\n\n+  \
    \ - copyOf - create a copy of an array, and resize if desired\n- copyOfRange -\
    \ create a copy of part of the array\n- fill - fill the array, or part of the\
    \ array with a single value\n- sort - sort the array\n\nThe sections below refer\
    \ to the weekdays array:\n\n```\nString[] weekdays = (\"Monday\", \"Tuesday\"\
    , \"Wednesday\", \"Thursday\", \"Friday\");\n```\n\nUse copyOf() to copy and resize\
    \ an Array\n\n```\nString[] weekdays = weekdays;\nweekdays = Arrays.copyOf(weekdays,\
    \ 7);\n```\n\nUsing the static method copyOf on Array we can create a copy of\
    \ an array, and optionally resize it.\n\nThe copyOf method takes two arguments:\n\
    \n```\nArrays.copyOf( arrayToCopy, length );\n```\n\nThis is typically used to\
    \ create a copy and increase the size. When we increase the size, the values in\
    \ the array, which were not in the original array, are set to the default value\
    \ for that data type e.g. for integer and null for String.\n\nIn our example we\
    \ create a copy of weekdays and resize it from 5 to 7 then the last two indices\
    \ contain null.\n\n```\nassertEquals(null, weekdays[5]);\nassertEquals(null, weekdays[6]);\n\
    ```\n\nTherefore we should set the values on the new array if we want to control\
    \ the contents."
