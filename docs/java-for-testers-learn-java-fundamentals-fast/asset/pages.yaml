  md: "# Chapter Thirteen - More Exceptions\n\n# Create an InvalidPassword exception\n\
    \nPart of ‘helping’ people use the user domain object to alert them to validation\
    \ and exceptions they might encounter using the class. We can do this through\
    \ documentation, and we can do this through custom exceptions.\n\nBy creating\
    \ an InvalidPassword exception we alert people to the validation rules setting\
    \ the password on a user.\n\nAs you saw in the class, I create a class with the\
    \ code for an InvalidPassword:\n\n```\npublic class InvalidPassword extends Exception\
    \ {\n    public InvalidPassword(String message) {\n        super(message);\n \
    \   }\n}\n```\n\nIn My class, I make the setPassword method throw the InvalidPassword\
    \ when it fails the password length check:\n\n```\npublic void setPassword(String\
    \ password) throws InvalidPassword {\n    if (password.length() < 7) {\n     \
    \   throw new InvalidPassword(\"Password must be > 6 chars\");\n    }\n\n    this.password\
    \ = password;\n}\n```\n\nYou can see in the code that I pass a message to the\
    \ InvalidPassword exception to describe the circumstances under which the exception\
    \ was.\nin order to check all of this, I create a class with @Test methods which\
    \ will check:\n\n+   * The InvalidPassword exception is thrown in the constructor\n\
    * The InvalidPassword exception is not thrown in the default constructor\n* The\
    \ error message thrown by the exception contains the text “Password must be >\
    \ 6 chars\"\n* The InvalidPassword exception is thrown on setPassword\n\nTo check\
    \ that the InvalidPassword exception is thrown in the constructor, I use the expected\
    \ parameter to check for the exception. Since the exception is a checked exception\
    \ I have to add throws keyword in the method declaration:\n\n```\n@Test(expected\
    \ = InvalidPassword.class)\npublic void createUserWithException() throws InvalidPassword\
    \ {\n    User aUser = new User(\"username\", \"password\");\n}\n```\n\nTo check\
    \ that the constructor does not throw an exception, all I do create the user and\
    \ assert that the password was created.\n\n```\n@Test\npublic void createDefaultUserWithNoThrowsInvalidPasswordException()\
    \ {\n    User aUser = new User();\n}\n```"
