    +   1. I use regular-expressions.info to help me remember the syntax

    2. I use on-line tools like regexpal.com to construct and check the regular expression

    against sample text

    3. I use desktop tools like RegexBuddy (regexbuddy.com) to help me construct and

    check the regular expression. RegexBuddy also builds snippets to use.

    4. I write JUnit tests to check my regular expression works

    5. I use JUnit tests around the code using the regular expression e.g. to test
    the

    setPassword method


    Regular expressions are a tremendous tool when you get to them. As you grow more

    experienced with Java and start using the java.util.regex package you can use
    regularnexpressions to parse strings and pull substrings using regular expressions.

