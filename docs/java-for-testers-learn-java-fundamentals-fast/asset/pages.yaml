  md: "# Chapter Ten - Introducing Collections\n\nWe have already seen the basic collection\
    \ concept in action with Arrays. I presented Arrays first so that you would understand\
    \ the concept and the basics of iterating over a collection.\n\nCollections are\
    \ a good place to consider other looping constructs like while, do. And we will\
    \ also introduce the concept of Interfaces.\n\n# Chapter Summary\n\nIn this chapter\
    \ you will learn the main collection classes. These offer more flexibility and\
    \ power to you in your development work.\n\n+   * For Each Loop - iterate over\
    \ each individual element in a collection\n* Conversion - converting collections\
    \ to arrays and arrays to collections\n* while and do...while - additional looping\
    \ constructs you can use\n* Interfaces - Collections are organized by interfaces\
    \ and each interface has multiple implementations\n* Generics - you will learn\
    \ the basics of Generics to help you declare collections\n* Collections - Core\
    \ interfaces: List, Set, Map\n* Core Implementations - Core collection implementations:\
    \ ArrayList, HashSet, HashMap\n\nThis is one of the longest chapters in this book.\
    \ I know it can seem overwhelming. So I will start the chapter with a simple introduction,\
    \ comparing arrays to a specific type of collection called a List, then covering\
    \ over collections, and then the different interfaces and implementations for\
    \ collections.\n\n# A Simple Introduction\n\nTo introduce collections, I will\
    \ show you a simple example comparing use of a collection to use of an array.\n\
    \n```\n@Test\npublic void simpleArrayExample(){\n  String[] numbers0123 = {\"\
    zero\", \"one\", \"two\", \"three\"};\n\n  for(String NumberText : numbers0123){\n\
    \    System.out.println(numberText);\n  }\n\n  assertEquals(\"zero\", numbers0123[0]);\n\
    \  assertEquals(\"three\", numbers0123[3]);\n}\n```\n\nThe above is code you have\
    \ seen before.\n\nThe following is the above code, rewritten to be a Collection.\n\
    \n```\n@Test\npublic void simpleCollectionExample(){\n  String[] numbers0123Array\
    \ = {\"zero\", \"one\", \"two\", \"three\"};\n  List<String> numbers0123 = Arrays.asList(numbers0123Array);\n\
    ```"
