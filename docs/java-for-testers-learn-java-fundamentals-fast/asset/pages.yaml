    # # Collection Interface


    A collection is a group of objects. Where each object is referred to as an element.
    The collection interface provides the basicet of methods.


    +   - add - to add an element to a collection

    - remove - to remove an element from a collection

    - size - to return the number of elements in the collection

    - isEmpty - check if a collection is empty

    - addAll - to add every element of another collection into the collection

    - removeAll - remove every element of another collection from the collection

    - retainAll - remove every element in the collection which is not in another collection

    - clear - remove all elements if an object is in the collection

    - contains - to check if an object is in the collection

    - containsAll - to check that one collection contains all the elements of another

    - toArray - to convert a collection to an array


    Instantiating a collection


    We cannot instantiate a Collection because a Collection is an interface. There
    are classes which implement the interface, e.g. ArrayList. We declare our variables
    as collection and instantiate them as class which implements the interface.


    ```

    Collection workdays;

    workdays = new ArrayList();

    ```


    In the above code we have used a variable called workdays. But a collection can
    contain any object, and since we didn''t specify what the collection will contain
    it defaults to object. This will become an annoyance later when when we try and
    iterate through the collection and have to cast the elements from object to String.'
