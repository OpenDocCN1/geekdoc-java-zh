  md: '+   - public


    This method is declared as public meaning that any class that can use MyFirstTest
    can call the method.


    When we use JUnit, any method that we want to use as a JUnit test should be declared
    as public.


    +   - void


    The void means that the method does not return a value when it is called. We will
    cover this in detail later, but as a general rule, if you are going to make a
    method a JUnit test, you probably want to declare it as void.


    +   - ()


    +   - {}


    In order to write code in a method we add it in the code block of the method body
    i.e. inside the opening and closing braces.


    We haven''t written any code in the method yet, so the code block is empty.


    # Naming JUnit Test` Methods


    > A lot of people don''t give enough to JUnit test method names. And use names
    like addTest or addNumbers. I try to write names that:


    +   - explain the purpose of the method without writing additional comments

    - describe the capability or function we want to check

    - show the scope of what is being checked


    # Make the method a JUnit test


    We can make the method a JUnit test. By annotating it with @Test.


    In this book we will learn how to use annotations. We rarely have to create custom
    annotations when automating, so we won''t cover how to create your own annotations
    in this book.


    JUnit implements a few annotations that we will learn. The first, and most fundamental,
    is the @Test annotation. JUnit only runs the methods which are annotated with
    @Test as JUnit tests. We can have additional methods in our classes without the
    annotation, and JUnit will not try and run those.'
