    \ clues telling me what should happen, and in some cases I might even have to\
    \ add a comment in the code to explain what the assert does.\n```\n\nI try to\
    \ remember to add a message when I use the JUnit assert methods because it makes\
    \ the code easier to read and helps when asserts do fail.\nNote in both forms,\
    \ the **expected result** is the parameter, before the **actual result**.\nIf\
    \ you get the wrong way round JUnit won't throw an error, it doesn't know what\
    \ you intended, but the output from a failed assert would mislead you. e.g. if\
    \ I accidentally wrote 2+3 when initializing the int *answer*, and I put the **expected**\
    \ and **actual** result the wrong way, then the output would say something like:\n\
    `java.lang.AssertionError: 2+2=4 expected:<5> was:<4>`\nAnd would confuse me,\
    \ because I would expect 2+2 to equal 4.\n\n# Assertion Tips\n\nTry to remember\
