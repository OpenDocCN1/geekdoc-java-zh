  md: 'comparator returns the Comparator object which the SortedSet is using for comparisons.

    Therefore we should learn how to create a Comparator.


    I have chosen to expand on Comparator but not hashSet and equals because I think
    thenComparator offers more re-use potential and likelihood of you implementing
    it.


    To illustrate this functionality we are going to create a SortedSet of the User
    domain

    object that we created earlier.


    In the below example, our first attempt at creating a SortedSet of the User objects
    would fail

    with a ClassException. The ClassException would be thrown as soon as we

    try to add the user "Bob" to the SortedSet. Because our User object does not

    implement the comparable interface.


    ```

    User bob = new User("Bob", "pAS5Word"); // 11

    User tiny = new User("TinyTim", "hello"); // 12

    User rich = new User("Richie", "RichieRichie"); // 22

    User sum = new User("sum", "tzu"); // 6

    User MrBaer = new User("Stafford", "sys"); // 11

    ```


    ```

    SortedSet<User> sortedList = new TreeSet<User>();

    ```


    ```

    userSortedList.add(bob);

    ```


    Our immediate thought might be implementing the Comparable interface on the User
    class.

    But sometimes we don''t have control over all the classes we use, and sometimes
    we don''t\want to implement that interface for all our domain objects. We might
    only want to sort\once or twice.


    Creating a custom Comparator can be very useful. We also might want to sort them
    in

    different ways, at different times, and embedding the comparison code in the object
    itself

    might not give us that flexibility.


    In this book I will take the approach of using a Comparator. The UserComparator

    a class which will compare User objects.


    In the @Test method where I want to create the SortedSet I instantiate the TreeSet

    follows:


    ```

    SortedSet<User> sortedList = new TreeSet<User>(new UserComparator());

    ```


    Here I create a new Comparator and pass it as an argument to the TreeSet

    constructor. This provides flexibility if I want to sort or compare the objects
    in

    different ways then I can construct the TreeSet with a different Comparator object.


    So that you understand the comparison that I want to use, I will show you the
    full method

    code:


    ```

    @Test

    public void sortedSetWithComparatorUser(){

    User bob = new User("Bob", "pAS5Word"); // 11

    User tiny = new User("TinyTim", "hello"); // 12

    User rich = new User("Richie", "RichieRichRich"); // 22

    User sum = new User("sum", "tzu"); // 6

    User MrBaer = new User("Stafford", "sys"); // 11

    }

    ```'
