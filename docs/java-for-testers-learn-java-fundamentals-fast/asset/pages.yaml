  md: '# # Chapter Eleven - Introducing Exceptions


    Chapter Summary

    In this chapter you will learn about exceptions:

    * an exception is an unexpected event which can interrupt our code execution

    * understand the stack trace on an exception

    * how to handle an exception using try and catch and finally

    * trigger a NullPointerException and how to catch them

    * throwing exceptions from your own code

    * using methods on the exception e.g. getMessage, getStackTrace

    * catching multiple exceptions

    * JUnit''s expected parameter @Test


    An exception is something that happens to you when you least expect it. Often
    because you have written code compiles, but has an error at runtime e.g. you try
    to access a file that does not exist, or access a variable that has not been set.
    And sometimes something untoward happened on the machine you were executing e.g.
    the system runs out of memory.


    A very important part of learning to write automation involves handling and processing
    exceptions.


    # ## What is An exception?


    An exception is an object raised which interrupts the flow of execution in an
    application.


    We are using automation to support our testing, we should expect our automation
    code to trigger anomalous and exceptional behaviour. Our automation code will
    encounter bugs and unexpected situations and we have to be able to handle them.


    We also use exceptions in our abstractions to let the calling automation code
    know that something unexpected has happened.


    Automation code is very different from automation code that we often want exceptions
    to show themselves and cause us @Test methods to fail.


    In application code we rarely want exceptions to manifest because they slow the
    whole system down and create a poor user experience.


    # ## What is an exception?


    Normally Java code proceeds from one statement to the next e.g.


    ```

    String ageString = age.toString();

    ```'
