- pgno: 51
  md: 'I set the constants to the the string values that we passed back originally
    in the getUrl method.


    If we run our @Test methods, they should pass.


    # Now Refactor


    An important element of TDD, and all programming, is to refactor.


    This means going back. Looking at our code. Identifying waste and improvements.
    And changing the code, such that the @Test annotated methods continue to pass,
    and no external interface to the code is amended.


    In our case, this means that we can change any of the code in our TestAppEnv so
    long as we still have two fields named DOMAIN and PORT and a method getUrl which
    returns the same string objects as that checked by the assertions.


    The obvious thing to change is that we have repeated String literals in our domain
    object since our domain string and PORT string are repeated as part of the hard
    coded String in getUrl. i have the following line


    ```

    return "http://192.123.0:67";

    ```


    # A little string concatenation


    Since the values of the DOMAIN constant and the PORT constant are part of the
    hard coded String in getUrl we really want to build the String passed back from
    getUrl using the DOMAIN and PORT constants, that if the environment details change
    then we only have to amend the fields, and not the String in the methods.


    String concatenation is something we do a lot when building automation code e.g.:


    +   - creating messages to send to systems

    - generating input data

    - creating log messages

    - etc.


    I''m going to quickly show the simplest way of concatenating Strings. And in fact
    you''ve already seen the code we need to use.


    +


    Yes, the ''plus'' can join the values of String objects together.


    I can amend the getUrl method so that it uses DOMAIN and PORT


    ```

    return "http://" + DOMAIN + ":" + PORT;

    ```


    By doing this, I have reduced the duplicated code and only have to change a single
    line of code in the abstraction layer if I want to change the environment details
    used by the @Test methods.


    Run the JUnit test class and make sure that the @Test methods still pass.'
