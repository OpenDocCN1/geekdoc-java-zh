  md: "# # Chapter Nineteen - Files\n\n# ## Chapter Summary\n\nIn this chapter you\
    \ will learn how to use the basic Java file handling classes\n\n+   * File the\
    \ general wrapper for a file\n    * createTempFile - create a temporary file\n\
    \    * createNewFile - create the file\n    * delete - delete the file now\n \
    \   * deleteExit - delete the file when the application closes\n    * getName\
    \ - return the filename or directory name\n    * getPath - return the path of\
    \ the parent directory\n    * getAbsolutePath - return the unique full filename\
    \ and path\n    * getCanonicalPath - return the unique full representation of\
    \ the File\n    * mkdir - creates a directory and all necessary directories in\
    \ the path\n    * isDirectory, isFile determining type of physical File\n    *\
    \ separator, pathSeparator - for files e.g. '\\' and Path e.g. ';'\n    * listRoots\
    \ - returns an array of roots in the file system\n    * length - the length of\
    \ the file in bytes\n    * getFreeSpace, getTotalSpace, usableSpace - disk space\n\
    \    * rename - rename a file\n* Directory methods\n    * list - list of the filenames\
    \ as String\n    * listFiles - list of File objects for each file and directory\n\
    * Attribute methods\n\n+   * canWrite, write, canExecute, lastModified\n    *\
    \ setExecutable, setReadable, setWritable\n    * setReadOnly, setLastModified\n\
    \n+   * Classes with static methods to copy and move a file or directory\n* PrintWriter\
    \ - has methods to make writing easier e.g. print, println\n* FileWriter - write\
    \ to character based files\n* BufferedWriter, BufferedReader - buffer output and\
    \ input for efficiency\n* FileReader - read from an input stream\n\nI intend to\
    \ keep my file code as simple as possible, because my use cases are usually simple:\n\
    \n+   * reading files that other people have written - sometimes to check validity\
    \ of the data\n* reading simple CSV or tab delimited files - often as input to\
    \ data driven checks\n* copying files - to keep a folder of data used during automation,\
    \ or for setup data\n* creating directories - to make my work-flow simpler\n*\
    \ moving files - screen shot images, log files\n* deleting files\n* writing report\
    \ - simple log files or HTML report output\n\nIn this chapter I'll cover the basic\
    \ classes and approaches for implementing the above use cases."
