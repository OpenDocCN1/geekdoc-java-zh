    # Sort to QuickSort an Array


    Java provides an implementation of QuickSort. To quickly sort an array.

    Arrays.sort( array );


    e.g. If I have an array of integers in the wrong order, then I can quickly sort
    them.


    ```

    int[] outOrder = {2,4,3,1,5,0};


    Arrays.sort(outOrder);

    ```


    ```

    assertEquals(0, outOrder[0]);

    assertEquals(1, outOrder[1]);

    assertEquals(2, outOrder[2]);

    assertEquals(3, outOrder[3]);

    assertEquals(4, outOrder[4]);

    assertEquals(5, outOrder[5]);

    ```


    You can also sort String, or other objects. Although with strings remember that
    uppercase letters have lower Unicode values than lowercase letters, so you might
    want to make the strings consistent with case usage before you sort them.'
