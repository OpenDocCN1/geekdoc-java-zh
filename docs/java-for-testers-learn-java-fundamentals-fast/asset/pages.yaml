    # add an element at a specific index


    With a Collection we can add elements, but they are just in the collection, they
    could be anywhere, we don''t care.


    With an array, we have to resize the array if we want to add new elements.


    With a List we can add elements at specific points in the List.


    In this example, I start with a partial list of days.


    ```

    List<String> days = new ArrayList<String>();

    ```


    ```

    days.add("Tuesday");

    days.add("Thursday");

    days.add("Saturday");

    ```


    I need to add a few days to this list:


    ```

    days.add(0, "Monday");

    days.add(2, "Wednesday");

    days.add(4, "Friday");

    days.add(6, "Sunday");

    ```


    If I add "Monday" to the start of the list, then "Wednesday" and "Friday" into
    the middle of the list, and "Sunday" to the end of the list.


    You can see that when I add an element in the middle or at the start, that doesn''t
    overwrite the element that is already there, it inserts the element and moves
    everything else in the list to a new index.


    # Adding to the end


    When adding to the end of the List you can only add to the end, you can''t add
    beyond the size of the List and expect to resize.


    i.e. if I have 3 elements in my List then I can add another one at index 3. Index
    3 doesn''t exist until I add it (I can''t get(3)), but I can increase the size
    of the list by adding to the end. If I cannot add an element to index 20, Java
    would throw an IndexOutOfBoundsException.


    I could also use the add(e) method, because adding an element to a List adds to
    the end of the List.


    # addAll elements in a collection at a specific index


    With a Collection the addAll adds elements somewhere in the collection. With a
    List we can control exactly where we insert the elements in the collection.


    For example, if I created a List for days:'
