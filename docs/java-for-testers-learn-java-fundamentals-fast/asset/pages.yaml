    - 1 if the BigDecimal is greater than value\n\nThe official documentation suggests\
    \ the following usage\n\n```\nBigDecimal.TEN.compareTo(BigDecimal.ONE) > 0\n```\n\
    \nWhich would be equivalent to:\n\n```\nBigDecimal.TEN > BigDecimal.ONE\n```\n\
