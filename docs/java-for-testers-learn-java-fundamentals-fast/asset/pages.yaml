- pgno: 16
  md: '# Chapter Two - Install the Necessary Software


    | Chapter Summary |

    | In this chapter you will learn the tools you need to program in Java, and how
    to install them. You will also find links to additional FAQs and Video tutorials,
    you should get stuck.


    The tools you will install:

    * Java Development Kit

    * Maven

    * An Integrated Development Environment (IDE)


    You will also learn how to create your first project.

    When you finish this chapter you will be ready to start coding. |


    *I suggest you first, read this whole chapter, and then work through the chapter
    from the beginning and follow the steps listed.*


    # Introduction


    Programming requires you to setup a bunch of tools to allow you to work.

    For Java, this means you need to install:


    +   * JDK - Java Development Kit

    * IDE - Integrated Development Environment


    For this book we are also going to install:


    +   * Maven - a dependency management and build tool


    Installing Maven adds an additional degree of complexity to the setup process,
    but trust it. It will make the whole process of building projects and taking your
    Java to the next level a lot easier.

    I have created a support page for installation, with videos and links to troubleshooting
    guides.


    +   * JavaForTesters.com/install


    If you experience any problems that are not covered in this chapter, or on the
    support pages, please let me know so I can try to help, or amend this chapter,
    and possibly add new resources to the support page.


    # Do you already have JDK or Maven installed?'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Some of you may already have these tools installed with your machine. The first
    thing we should learn how to check if they are installed or not.


    # Java JDK


    Many of you will already have a JRE (Java Runtime Environment), but developing
    with Java we need to use a JDK.


    If you type javac -version at your command line and get an error saying that javac
    can not be found (or something similar). Then you need to install and configure
    a JDK.


    If you see similar to:


    ```

    javac 1.7.0_10

    ```


    Then you have a JDK installed. It is worth noting the instructions below to check
    if your installed JDK is up to date, but if you have a 1.7.x JDK (or higher) installed
    then you have a good enough version to work through this book without amendment.
    If your JDK is 1.6 then some of the code examples will not work.


    ![](img/3571bcaadac59e6bb801bc317a52cb1e_17_0.png)


    # Java Has Multiple Versions


    The Java improves over time. With each new version adding new features. If you
    are unfortunate not to be able to install Java 1.7 at work (then I suggest you
    work through this book at home, or on a VM), then parts of the source code will
    not work and the code you download for this book will throw errors.


    Specifically, we cover the following features introduced in Java 1.7:


    +   - The Diamond operator <> in the Collections chapters

    - Binary literals eg. 0b01001

    - Underscores in literals eg.g. 0_000_000_000L

    - switch statements using Strings


    The above statements may not make sense yet, but if you are using a version of
    Java lower than 1.7 then you can expect to see these concepts throw errors with
    JDK 1.6 or below.


    # Install Maven


    Maven requires a version of Java installed, so if you checked for Java and it
    wasn''t there you will need to install Maven.


    If you type mvn -version at your command line, and receive an error that mvn can
    be found (or something similar). Then you need to install and configure Maven
    before you follow the text in this book.


    If you see similar to:


    ```

    Apache Maven 3.0.4 (r1232337; 2012-01-17 08:44:56+0000)

    Maven home: C:\maven\maven-3.0.4

    Java home: 1.7.0-Program Files\Java\jdk1.7.0_10\jre

    Default locale: en_GB, platform encoding: Cp1252

    OS name: "windows", version: "6.2", arch: "amd64", family: "windows"

    ```


    ![](img/3571bcaadac59e6bb801bc317a52cb1e_17_1.png)'
  merge: -1
  img_proc: true
