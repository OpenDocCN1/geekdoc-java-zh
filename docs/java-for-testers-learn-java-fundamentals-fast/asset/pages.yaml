  md: "If I want to throw an unchecked exception I will first of all try and use one\
    \ of the standard java.lang unchecked exceptions.\n\nFor example you saw the use\
    \ of a java.lang unchecked exception when we added the exception to the password\
    \ validation in User used the IllegalArgumentException because I was validating\
    \ a parameter to a method.\n\nIt might be appropriate to create my own unchecked\
    \ exceptions if I want to allow to distinguish between exceptions the abstraction\
    \ layer has thrown at runtime, and those exceptions thrown by the Java runtime.\n\
    \n# Checked Exceptions\n\nYou will be informed about the need to handle checked\
    \ exceptions at compile time because a checked exception will be declared as being\
    \ thrown by the method declaration.\n\nFor example, I could declare the setPassword\
    \ method on User as throwing an InvalidPassword (assuming that InvalidPassword\
    \ existed, which it doesn't, but when I come to the ‘Create your own Exception\
    \ class’ section later in this chapter):\n\n```\npublic void setPassword(String\
    \ password) throws InvalidPassword {\n```\n\nThen, in the code that I use the\
    \ setPassword method I either have to:\n\n+   - handle the exception, as we saw\
    \ before in a try catch block, or\n- ignore the Exceptions and allow it to propagate\
    \ upwards\n\n# Ignoring Checked Exceptions\n\nThe way that we allow an exception\
    \ to propagate upwards is to declare the method that we are ‘ignoring’ the method\
    \ in, as that particular exception.\n\nFor example, since the User constructor\
    \ calls setPassword, I either have to handle the exception or, as shown below,\
    \ allow it to propagate upwards:\n\n```\npublic User(String username, String password)\
    \ throws InvalidPassword {\n    this.username = username;\n    setPassword(password);\n\
    }\n```\n\n# Handling checked exceptions in default constructor\n\nIf I call a\
    \ constructor from another constructor e.g.\n\n```\nthis(\"username\", \"password\"\
    );\n```\n\nThen the first statement in the constructor has to be this call. Which\
    \ means that I cannot wrap that with a try catch.\n\nI have to find a different\
    \ way of delegating the construction call. In this code I chose to change the\
    \ default constructor so that it calls a private constructor.\n\n```\npublic User()\
    \ {\n    this(\"username\", \"password\", false);\n}\nprivate User(String username,\
    \ String password, boolean b) {\n```"
