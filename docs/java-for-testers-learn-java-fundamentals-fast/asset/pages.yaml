    \ by e.g. -= 2 would subtract two\n- *= to multiply the variable by e.g. *= 2\
    \ would multiply by two\n- /= to divide the variable by e.g. /= 2 would divide\
    \ by two\n- %= to calculate and assign the modulus by value e.g. %= 3 would assign\
    \ the modulus\n\n```\n@Test\npublic void assignmentOperatorsExplored(){\n  String\
    \ ab = \"ab\";\n  assertEquals(\"ab\", ab);\n\n  int num = 10;\n  assertEquals(10,\
    \ num);\n\n  num += 2;\n  assertEquals(\"+= increments by\", 12, num);\n\n  num\
    \ -= 4;\n  assertEquals(\"-= decrements by\", 8, num);\n\n  num *= 2;\n  assertEquals(\"\
    *= multiplies by\", 16, num);\n\n  num /= 4;\n  assertEquals(\"/= multiplies by\"\
    , 4, num);\n\n  num%=3;\n  assertEquals(\"%= modulus of\", 1, num);\n}\n```\n\n\
    # Increment and Decrement\n\nYou can increment and decrement a variable using\
    \ ++ and -- e.g. ++num would return num incremented by 1\n\nYou can put ++ and\
    \ -- before or after the variable.\n\n+   - Putting ++ or -- before the variable\
    \ means that you want to amend it after using it. (prefix)\n- Putting ++ or --\
    \ after the variable means that you want to use it and then increment it. (postfix)\n\
    \ne.g.\n\n```\n@Test\npublic void incrementDecrementOperatorsExplored(){\n  int\
    \ num = 10;\n  assertEquals(11, ++num);\n  assertEquals(10, --num);\n  assertEquals(10,\
    \ num++);\n  assertEquals(11, num);\n  assertEquals(11, num--);\n```"
