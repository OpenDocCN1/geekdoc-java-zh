  md: "Most of our Exceptions will derive from either Exception or a class that already\
    \ extends Exception. We will rarely derive from Throwable and never derive from\
    \ Error\n\n# Create your own Exception class\n\nThroughout this chapter you have\
    \ seen reference to a custom exception called InvalidPassword.\n\nThere is no\
    \ magic around this class and it is a very small piece of code which implements\
    \ a class that extends Exception.\n\n```\npublic class InvalidPassword extends\
    \ Exception {\n    public InvalidPassword(String message) {\n        super(message);\n\
    \    }\n}\n```\n\nCreating your own exception allows you to aggregate multiple\
    \ Java exceptions into a single context exception.\n\nFor example, I could catch\
    \ IllegalArgumentException, NullPointerException, etc. and throw an IllegalStateException\
    \ so that using my abstraction layer only has to handle a small set of exceptions.\n\
    \n# Exercise: Create an InvalidPassword exception\n\nTo help people use the domain\
    \ object:\n\n+   - create the InvalidPassword exception\n- make the InvalidPassword\
    \ exception describe the validation rules around password i.e. \"Password must\
    \ be > 6 chars\"\n- write @Test methods that check:\n    - the InvalidPassword\
    \ exception is thrown on setPassword\n    - the InvalidPassword exception is thrown\
    \ in the constructor\n    - the InvalidPassword exception is not thrown in the\
    \ default constructor\n    - the error message thrown by the exception contains\
    \ the text \"Password must be > 6 chars\"\n\n# Summary\n\nIn this chapter you\
    \ saw how to create and throw a custom exception. Custom exceptions are useful\
    \ when creating abstraction layers because we do not need to create a lot of return\
    \ codes, we can throw exceptions instead.\n\nCustom exceptions 'help' people using\
    \ our classes, to alert them to validation and exceptions that they might encounter\
    \ using the class. We can do this through documentation, and we can do this through\
    \ custom Checked exceptions.\n\nBy creating a checked exception we alert people\
    \ as they write the code, to the validation and usage rules of our class. If we\
    \ create a custom RuntimeException then we need to rely on documentation to alert\
    \ the user.\n\nThe fail method is very useful when writing checks for custom exceptions\
    \ because we need to make sure that checks do not pass because the exception was\
    \ not thrown in our"
