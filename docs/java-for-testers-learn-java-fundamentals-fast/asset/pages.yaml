    \ getPassword.\n\n```\npublic String getUsername() {\n    return username;\n}\n\
    ```\n\n```\npublic String getPassword() {\n    return password;\n}\n```\n\n# Setters\n\
    \nWe also want the ability to amend or set field values in a class. We do this\
    \ through setter methods.\n\nFor our code we want to have the ability to amend\
    \ the password but not the username. Once our username has been set via a constructor\
    \ invocation, we never want to allow any calling classes to amend the username,\
    \ but we want to allow amending the password.\n\nTo amend the password we will\
    \ write a setter method (setPassword), which we use as @Test in this code:\n\n\
    ```\n@Test\npublic void setPasswordAfterConstructed() {\n    User user = new User();\n\
    \n    user.setPassword(\"PazZwor6\");\n\n    assertEquals(\"setter password expected\"\
    , \"PazZwor6\",\n        user.getPassword());\n}\n```\n\nAnd the actual setter\
    \ method in the User class looks like this:\n\n```\npublic void setPassword(String\
    \ password) {\n    this.password = password;\n}\n```\n\nAgain you can see the\
    \ use of this keyword to distinguish between the field and the local variable\
    \ defined by the String password parameter.\n\nWrite the code, and run the @Test\
    \ methods to make sure all our assertions still pass."
