  md: '```

    step1 = OPEN_APP

    step2 = TYPE 12345

    step3 = CLICK_ENTER

    step4 = CLOSE_APP

    ```


    You can probably guess that the above example is a simple keyword driven script.
    I don''t recommend this approach, I''m just pointing out that when I was learning
    Java, I used the basic knowledge that I had to get things done, without worrying
    too much about the ''best'' way of doing it. And Properties, with associated property
    files, made certain things easy.


    # Properties Basics


    The Java Properties object in java.util.Properties is the main class we will use
    for working with Properties.


    It works much like a hash map, with a "key, value" pair, where both key and value
    are String objects.


    Properties also has additional methods for loading and saving the properties to
    files.


    > Warning: Don''t go crazy

    When I first learned about Properties I think I went bit crazy and used it everywhere.
    I used instead of using a Map. Instead of defining all parameters in methods,
    I just stuck everything in a Properties object and put that in to the method.
    I don''t do this anymore. And neither should you since you you already know how
    to use the collection classes.


    # Creating new Properties


    We create new Properties objects using the Properties class from java.util.Properties


    ```

    Properties = new Properties();

    ```


    The above will give us a Properties object with no properties. i.e. size of 0

    assertThat(properties.size(), is(0));


    # Setting and Getting Properties values


    Use the setProperty and getProperty methods to set and get property values:


    ```

    properties.setProperty("browser", "firefox");

    properties.setProperty("port", "80");

    ```


    setProperty will create the property if it does not exist, or overwrite the value
    of the property if it already exists.


    getProperty returns the value for the property:


    ```

    assertThat(properties.getProperty("browser"));

    nis("firefox"));

    assertThat(properties.getProperty("port"));

    nis("80"));

    ```


    If the property key we provide to getProperty does not exist then null will be
    returned.'
