    \ what we've been doing: one statement, following another statement.\nSelection,\
    \ is making decisions, and choosing to do one thing, or another, depending on\
    \ a particular condition.\n\nIteration, where we repeat actions until we have\
    \ done what we needed.\nThis chapter is going to look at Selection. Or Conditional\
    \ Statements\n\n# Ternary Operators\n\nYou have already seen the Ternary operator.\n\
    \n```\nx = 4-3 ? 2 : 1;\n```\n\nx is set to 2, if 4 is greater than 3, otherwise\
    \ x is set to 1\nIn the ternary operator, the condition is evaluated and:\n\n\
