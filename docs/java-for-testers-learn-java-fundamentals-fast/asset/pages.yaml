- pgno: 72
  md: "Each primitive has an associated Class e.g. Byte, Short, Integer, Long. These\
    \ can be used for conversions and have other methods. They also have the MIN_VALUE\
    \ and MAX_VALUE constants for each primitive.\n\nVarious Java syntax exists for\
    \ representing literals as specific primitives:\n\n+   - represent an integer\
    \ literal as long by adding the suffix L\n- represent a hex value with the prefix\
    \ 0x (zero x)\n- represent an octal value with the prefix 0 (zero)\n- represent\
    \ a binary value with the prefix 0b (zero b) (Java 1.7)\n- make numbers readable\
    \ by adding _e.g. 0_000_000 (underscore) (Java 1.7)\n\nExamples of the above,\
    \ can be seen below:\n\n```\n@Test\npublic void IntegerTypes(){\n    byte byteHas1Byte;\n\
    \    short asHas2Bytes;\n    int anIntHas4Bytes;\n    long longHas8Bytes;\n\n\
    \    System.out.println(\" *short' range: \" + \n        Byte.MIN_VALUE + \" to\
    \ \" + \n        Byte.MAX_VALUE);\n\n    System.out.println(\" *int' range: \"\
    \ + \n        Integer.MIN_VALUE + \" to \" + \n        Integer.MAX_VALUE);\n\n\
    \    System.out.println(\" *long' range: \" + \n        Long.MIN_VALUE + \" to\
    \ \" + \n        Long.MAX_VALUE);\n\n    longHas8Bytes = 0L; //suffix L for long\n\
    \    assertEquals(0, longHas8Bytes);\n\n    byteHas1Byte = 0xA; //add prefix 0x\
    \ for Hex\n    assertEquals(10, byteHas1Byte);\n\n    anIntHas4Bytes = 010; //add\
    \ 'zero' prefix for Octal\n    assertEquals(8, anIntHas4Bytes);\n\n    byteHas1Byte\
    \ = 0b0001; // Java 1.7 added 0b 'zero' b for binary\n    assertEquals(byteHas1Byte,\
    \ 2);\n\n    // Java 1.7 allows underscores for readability\n    longHas8Bytes\
    \ = 9_000_000_000L; // 9 000 million\n    assertEquals(9000000000L, longHas8Bytes);\n\
    }\n```\n\n# Floating-point Types"
