    \ (and £).\n\nAfter this first letter, the variable name can contain any of the\
    \ letters, or digits.\n\nCase is significant so aMount is not the same as Amount.\n\
    \nNames tend to use camel case and start with a lowercase letter. Constants tend\
    \ to be uppercase, with '_' to delimit words.\n\nA variable name can be very long,\
    \ and you can use a wide range of characters in the name, but do try and keep\
    \ the names readable, and capable of being read aloud.\n\n```\n@Test\npublic void\
    \ variableNaming(){\n    String $aString=\"bob\";\n    float £owed=0;\n    int\
    \ aMount=4;\n    long Amount=5;\n    String A0123456789bcdf=\"ugh\";\n\n    assertEquals(4,\
    \ Amount);\n    assertEquals(10.0, £owed, 0);\n    assertEquals(\"bob\", $aString);\n\
    \    assertEquals(\"ugh\", A0123456789bcdf);\n}\n```\n\n# Public Static Final\n\
    \npublic static final fields are often known as constants, because once assigned\
    \ a value, the value can not be changed. This makes them useful for exposing constant\
    \ values to other classes.\n\n> public static final String CONSTANT = \"a constant\
    \ string\";\n\nTypically you will see the value assignment in the declaration,\
    \ as shown in the example above, but it could also be set from a method call,\
    \ which allows you to read constants from files or property values.\n\n# Final\n\
    \nNote that final does not have to have public static scope. Any of the scoping\
    \ keywords can be used with final e.g. private final\nsimply means that once assigned\
