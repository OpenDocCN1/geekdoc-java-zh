- pgno: 186
  md: 'In practice, I tend to setup dates as I need them, retrieve dates, and then
    move dates forward and backwards in time. Which we will cover next.


    # add and subtract to roll dates through time


    There are two main mechanisms with the Calendar Object for moving the time in
    a relative fashion:


    +   - add - add or subtract an amount from a field

    - roll - change a single field without affecting others


    We can use add to increment or decrement field values. For example I could take
    a Calendar of 2339 and decrement the hour of the time:


    ```

    cal.add(Calendar.HOUR_OF_DAY, -1);

    assertThat(cal.get(Calendar.HOUR_OF_DAY), is(22));

    ```


    Similarly I could increment the minutes on the time:


    ```

    cal.add(Calendar.MINUTE, 10);

    assertThat(cal.get(Calendar.MINUTE), is(49));

    ```


    # Exercise: Increment and Decrement other Fields


    Experiment with the add method and change the fields in different ways to move
    the date from 23 December 2013 to 3rd June 2011.


    With the roll method I can change a single field, without affecting any of the
    larger units e.g. given the date 15th December 2013, I can roll forward 17 Days
    of the month to roll over to the 1st, and it will still be December 2013. If I
    were to do this with an add date would become 1st January 2014 the other fields
    would advance as well to keep the valid date.


    ```

    cal.roll(Calendar.DAY_OF_MONTH, 17);

    assertThat(cal.get(Calendar.YEAR), is(2013));

    assertThat(cal.get(Calendar.MONTH), is(Calendar.DECEMBER));

    assertThat(cal.get(Calendar.DAY_OF_MONTH), is(1));

    ```


    # Exercise: Confirm add Moves the Year


    Write an @Test method that demonstrates adding 17, to 23rd of December 2013, instead
    of rolling moves the date to 1st January 2014.


    # Summary


    In the production environment, in the main application, we very often use the
    Joda-Time library. I’m trying to keep coverage of ‘libraries’ out of scope, to
    make it easier for you to get started, and to help you build knowledge and experience
    with the in-built features.'
