  md: "# Why Setters and Getters?\n\nBy creating a setter method we gain the ability\
    \ to control the values that are assigned to the fields e.g.\n\n+   - we could\
    \ add code for validation and make sure we can't assign incorrect passwords\n\
    - if a password had to be minimum length we could write code to add it to the\
    \ correct length if we needed to\n\nWe can use getter methods to hide the implementation,\
    \ e.g. we might ‘calculate’ the return value, rather than always return something\
    \ which has been set.\n\nThere are occasionally times where we want to loosen\
    \ control over the object fields and make them public, so people can amend them\
    \ and access them whenever, and however they want. But we are much more likely\
    \ to use setter and getter methods to control access and allow us the flexibility\
    \ in the future to change implementation details.\n\n# Summary\n\nYou should now\
    \ know how to:\n\n+   - create a no-argument constructor by creating a public\
    \ scope method with no return type which has the same name as the class\n- create\
    \ a constructor that takes parameters\n- have parameters named the same as fields,\
    \ and use them in the same method body\n- call a constructor from another constructor\n\
    - create getter methods which return values\n- create setter methods to amend\
    \ field variables\n- use the this keyword to distinguish between object fields\
    \ and method parameters\n\nAnd you should also understand:\n\n+   - the basics\
    \ of field and method scoping public, private and with no explicit scope (package).\n\
    \n# user class code\n\nFor your reference and comparison, we created the following\
    \ user class, in this chapter:\n\n```\npackage com.javaforeters.domainentities;\n\
    public class User {\n    private String username;\n    private String password;\n\
    \\    public User(){\n        this(\"username\", \"password\");\n    }\n\n   \
    \ public User(String username, String password) {\n        this.username = username;\n\
    \    }\n```"
