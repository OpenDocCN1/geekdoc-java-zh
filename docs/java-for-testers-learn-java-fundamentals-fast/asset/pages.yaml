- pgno: 243
  md: 'You can force a start of code completion if you close the pop-up menu by pressing:


    +   - ctrl + space


    # Navigating Source Code


    ```

    ctrl + click

    ```


    For any method in your code, either a built in method, or a library method, or
    even one that you have written. You can hold down ctrl and left mouse click on
    the method name to jump to the source of that method.


    You might be prompted to allow IntelliJ to download the source for external libraries.
    This can help when working with the example source code for this book as you can
    navigate to the domain objects from within the @Test method code.


    # Finding Classes and Symbols


    If in this book you use a method name or a class name, but don''t know where to
    find it in the source code then you can use the find functionality in IntelliJ
    to help.


    To find a class name, use the keyboard shortcut:


    +   - ctrl + n


    This can perform partial matching, so you don''t have to type in the full name
    of the class. If you want to find a ''file'' in the project then use the keyboard
    shortcut:


    +   - ctrl + shift + n


    If you want to find a method name, or variable name (symbol) then use the keyboard
    shortcut:


    +   - ctrl + shift + alt + n


    # Running a JUnit Test


    Annotating methods with @Test makes it easy for us to ''run'' the methods we write.
    You can right click on the method name or class and choose to Run as JUnit test.
    Or use shortcut:


    +   - ctrl + shift + F10


    # Loading Project Source


    The easiest way to load a project into IntelliJ, and this applies to the book
    example code, is to use:


    +   - File \ Open and select the pom.xml file.'
