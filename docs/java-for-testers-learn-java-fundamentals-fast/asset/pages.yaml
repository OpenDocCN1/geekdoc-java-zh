  md: '+   - docs.oracle.com/javase/tutorial/reflect


    # Annotations


    You used annotations when you put @Test atop your method code.


    Annotations are meta-data. They are used by the compiler and when your code is
    accessed at runtime using Reflection.


    I have in the past used annotations when trying to find ways of reporting on execution
    coverage and creating custom JUnit runners.


    Important to know about, but I imagine you will not use them very often.


    # Research Links:


    +   - docs.oracle.com/javase/tutorial/java/annotations


    # Design Patterns


    Design Patterns are those statements that you hear on the project that everyone
    assumes that everyone understands and never explains, e.g.


    +   - Singleton

    - Observer

    - Visitor

    - Factory

    - Proxy

    - etc.


    These are common approaches to solving common problems. The famous book “Design
    Patterns” by Gamma, Helm, Johnson and Vlissides lists 23 common patterns and some
    solutions.


    Some familiarity with them is important because they offer approaches to problems
    that other people have solved. They will also help you understand what developers
    are talking about when they explain their code to you.


    # Research Links:


    +   - c2.com/cgi/wiki?DesignPatternsBook

    - oodesign.com/


    # Concurrency


    Concurrency is important in Java. It allows you to run code in multiple threads
    and potentially achieve some results faster, or run more than one @Test method
    at the same time.


    You will often read that certain classes are not “Thread Safe” which means they
    should be used when you try and use concurrency.'
  merge: -1
  img_proc: true
- pgno: 234
  md: "There are different approaches to concurrency, ranging from simple use of synchronized\
    \ means that a method can only be called by a single thread at a time. To full\
    \ non-blocking concurrency.\n\nThis topic is far to advanced for this book. Unfortunately\
    \ many testers try and tackle this early they want to run their @Test methods\
    \ in parallel. Often there is even a compelling need to check cases in parallel.\n\
    \nConcurrency is a very interesting part of Java to study, and I had to create\
    \ automation abstractions that were used in a multi-threaded manner. But not early\
    \ when I was learning Java. I recommend you read about it, but don't try and do\
    \ any concurrent programming until you are very comfortable understanding how\
    \ your application works. Otherwise you may create some code that fails intermittently\
    \ that is hard to debug and fix.\n\nI primarily added Concurrency in this section\
    \ when you are off trying to use it too quickly.\n\n# Research Links:\n\n+   -\
    \ docs.oracle.com/javase/tutorial/essential/concurrency\n\n# Additional File considerations\n\
    \nIn the file chapter I skipped over a lot of information, to try and create example\
    \ code and basic information that will cover many of your initial file processing\
    \ needs.\n\nI also covered most of the things I use files for. I rarely have to\
    \ work with the basic file blocks: streams and channels.\n\nI rarely worry about\
    \ File encoding, because most of my files are created and read from the same JUnit\
    \ test class, and because they are temporary, they get deleted after the @test\
    \ finishes.\n\nI include the links below as research items in case you need them\
    \ in your environment.\n\n# Research Links:\n\n+   - Streams\n  - docs.oracle.com/javase/tutorial/i18n/text/stream.html\n\
    - File IO\n  - docs.oracle.com/javase/tutorial/essential/io/file.html\n\n# Summary\n\
    \nI know this chapter has very few examples. The main purpose was to make you\
    \ aware of additional areas of functionality available in Java.\n\nI did not explain\
    \ any in detail because these are areas that could have entire books dedicated\
    \ to them, and in some cases books do exist dedicated to them, and I mention some\
    \ of those books in the next chapter.\n\nI've tried to make you aware of the circumstances\
    \ that will lead you to the concepts. But I hope you follow and read the provided\
    \ research links so you have a basic memory of the capability, even if you haven't\
    \ used it, or don't yet understand it."
