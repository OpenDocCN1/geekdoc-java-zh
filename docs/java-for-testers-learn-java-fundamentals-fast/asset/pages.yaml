  md: 'Java has a concept of an interface. By interface, I mean the methods they expose
    the API that we use to work with the classes, i.e. an interface defines what you
    can do.


    A class can implement a number of interfaces, in which case it must implement
    the methods that are defined in all of those interfaces.


    Java provides a number of interfaces for collections:


    +   - Collection - a generic collection that you can add objects

    - Set - a collection that does not allow duplicates

    - List - a collection you can access and add elements at specific index positions

    - Map - a "key, value" pair where you store an object in the collection, but can
    access it with a unique key


    The Collection interfaces are all in java.util


    # Important Interfaces


    I have only listed above, what I consider the most important interfaces above,
    i.e. the ones that I use most often.


    This demonstrates my biases, and the needs of the code I write.


    Over time you will identify the interfaces, and implementation that you use a
    lot. Learn those in detail so that you understand them well. But make sure you
    learn the capabilities of the other interfaces and implementations so you know
    when to use them, and don''t use a single collection type, as another would fit
    your needs.


    # Declare as Interfaces, Instantiate Interfaces


    An Interface on its own cannot be used to do anything. Other classes implement
    interfaces and so we declare variables as the interface but have to instantiate
    them with implementations. e.g.


    ```

    Collection weekdays;

    workdays = new ArrayList();

    ```


    Here I have declared a variable called as a Collection because I only need to
    use the methods that the collection interface provides. But I have to instantiate
    it as an ArrayList which is a class that implements the Collection interface.


    The ArrayList exposes many more methods than the Collection interface. Had I declared
    the variable weekdays as an ArrayList I would gain access to methods indexOf,
    trimToSize, and get.


    When I only need to access the methods on Collection then I should declare my
    variables at the minimum level of functionality needed.


    By coding to interfaces like this, we have the ability to swap in and out the
    implementation class; if we discover that one implementation is faster than another,
    or takes less memory. But we don''t have to change the body of the method code
    when we swap a different one in.'
