  md: "# Calculate the time that a task takes\n\nTo calculate the time that a task\
    \ takes, I would :\n\n+   - instantiate a startTime\n- perform the task\n- instantiate\
    \ an endTime\n- calculate the totalTime as endTime - startTime\n\nFor example\
    \ of how long it takes to output the currentTimeMillis to the console\nten times,\
    \ I can write code like the following:\n\n```\n@Test\npublic void currentTimeMillis()\
    \ {\n  long startTime = System.currentTimeMillis();\n\n  for (int x = 0; x < 10;\
    \ x++) {\n    System.out.println(\"Current Time \" + System.currentTimeMillis());\n\
    \  }\n\n  long endTime = System.currentTimeMillis();\n  System.out.println(\"\
    Total Time \" + (endTime - startTime));\n}\n```\n\nWhen I run this I get a general\
    \ total value of around 1, but sometimes I will get a\ntotal value of 0 because\
    \ the end task takes place within the same ‘millisecond’ as\ncalibrated by currentTimeMillis.\n\
    \nThe resolution of values represented by currentTimeMillis can vary when operating\n\
    systems, it is not guaranteed to be a ‘millisecond’, it might be more e.g. tens\
    \ of\nmilliseconds. As this isn't a great method for exact time, but it very often\
    \ good\nenough for automation timings, particularly if you are rounding up to\
    \ the nearest second\nanway.\n\nWhat is it good for, for unique numbers or values,\
    \ assuming that you don't reset your\ncomputer clock into the past.\n\n> Exercise:\
    \ Re-write the timing @Test method using nanoTime\n\nRe-write the millis@Test\
    \ method above using nanoTime and see the difference in output.\n\nWhen using\
    \ nanoTime, again the resolution is determined by the underlying opernsystem,\
    \ but is reported in nanoseconds.\n\n+   - nanoTime is much better for calculating\
    \ the time duration of an activity which runs\nquickly, and for which you want\
    \ a more accurate measurement.\n- nanoTime is not useful for creating unique numbers\
    \ because you don't really know\nthe basis for the JVM time.\n\n# Create unique\
    \ values with currentTimeMillis"
