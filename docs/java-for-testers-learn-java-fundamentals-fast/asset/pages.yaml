  md: 'The tailSet creates a subset, but this the set of all elements in the set which
    are greater than or equal to the element, so the subset also includes the element
    itself.

    This is illustrated by the example:


    ```

    @Test

    public void sortedSetReturnTailSet() {

    ```


    ```

    SortedSet<String> alphabet = new <TreeSet>();


    alphabet.add("c");

    alphabet.add("d");

    alphabet.add("b");

    alphabet.add("a");


    SortedSet<String> subset = alphabet.tailSet("c");


    assertEquals(2, subset.size());


    String[] alphas = new String[subset.size()];

    subset.toArray(alphas);


    assertEquals("c", alphas[0]);

    assertEquals("d", alphas[1]);


    ```


    # subset between two elements


    The Set contains a subset from, including the first element, to but excluding
    the second element argument. e.g. given "a", "b", "c", "d" then a subset("b",
    "d") would be from including "b", (but excluding) "d", giving "b", "c".

    This is illustrated by the example:


    ```

    @Test

    public void sortedSetReturnSubset() {

    ```


    ```

    SortedSet<String> alphabet = new <TreeSet>();


    alphabet.add("c");

    alphabet.add("d");

    alphabet.add("b");

    alphabet.add("a");


    SortedSet<String> subset = alphabet.subset("b", "d");


    assertEquals(2, subset.size());


    String[] alphas = new String[subset.size()];

    subset.toArray(alphas);


    assertEquals("b", alphas[0]);

    assertEquals("c", alphas[1]);


    ```


