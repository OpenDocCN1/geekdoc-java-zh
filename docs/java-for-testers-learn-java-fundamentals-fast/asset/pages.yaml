    \ evaluated in left to right order\n* Assignment operators are evaluated right\
    \ to left\n\nIn the table below, operators are listed in precedence order, and\
    \ where more than one operator is on the same row, they are of equal precedence.\n\
    \n# Operator\n\n```\nx++ x --\n++x -- +x -x ~ =\n* / %\n+-\n>> >>>\n< > <= ==\n\
    = !!\n&\n^^\n&&\n||\n?:\n+= - -= *= /= %= &= |= |= <= <= >>>=\n```\n\n# Strings\n\
    \nA string is a class in java.lang so you don't need to import it to use it.\n\
    \nStrings are immutable so they can't change. All commands that look like they\
    \ change the values of strings, actually return a new string with the amendments.\n\
    \n# String Concatenation\n\nStrings can be concatenated using the + operator.\n\
    \n```\n@Test\npublic void stringsConcatenated(){\n  assertEquals(\"123456\", \"\
    12\" + \"34\" + \"56\");\n}\n```\n\n# String methods\n\nThe String class provides\
    \ static methods that can be used without instantiating a String object variable:\n\
    \n+   * length the number of characters in the string\n* charAt returns the character\
    \ at a specific index\n* contains returns true if a substring is contained\n*\
    \ etc."
