  md: "# Exercise: Fix the NullPointerException in the code\n\nAmend the code to assign\
    \ 18 to the age and check the code runs successfully without throwing an exception.\n\
    \n# Catching Exceptions\n\nThere are situations where we know in advance that\
    \ an exception might happen, we want to catch the exception and take action to\
    \ handle the exception. e.g. we try to open a file, but it doesn't exist, so we\
    \ catch the exception and then create the file.\n\nThis is where the try and catch\
    \ keywords in Java help us.\n\n```\nInteger age=null;\nString ageAsString;\nntry{\n\
    \    ageAsString = age.toString();\n}catch(NullPointerException e){\n    age =\
    \ 18;\n    ageAsString = age.toString();\n}\n```\n\nI made a few changes to the\
    \ code to use the try catch:\n\n+   * declare String ageAsString; before the try\n\
    * declare the type of exception to catch, in this case a NullPointerException.\n\
    * take action to handle the exception in the catch block. i.e. I assigned a value\
    \ to the Integer age.\n\nI have to declare String ageAsString; before the try.\
    \ You can see that there has a code block delimited with { }. If I declared ageAsString\
    \ within that code block it would only be accessible for code within the code\
    \ block's { }, and not available to code in the catch block or after the try and\
    \ catch blocks.\n\nIn the catch I have to declare what type of exception I will\
    \ catch. In this case I only want to catch NullPointerException so declare a e\
    \ as a NullPointerException.\n\nIn the catch block, I assume that I have reached\
    \ this code because age was null, so I assign a value to it and repeat the Integer\
    \ to String conversion. So I use the catch block to fix the cause of the exception\
    \ and take action to allow the rest of the code to run to completion.\n\n# try\
    \ catch Notes\n\n+   * Code in the try block will always run.\n* The catch block\
    \ will execute only if the declared exception is thrown.\n* Exceptions that are\
    \ thrown in the catch block will propagate up the stack i.e. to calling methods."
