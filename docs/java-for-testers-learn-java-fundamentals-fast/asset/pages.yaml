  md: "# Inherit from Interfaces and Abstract Classes\n\nIn production Java code,\
    \ a common recommendation is to *code to Interfaces*. Rather than Inheritance.\n\
    \nWe haven't covered Interfaces in detail in this book, because I'm trying to\
    \ get you up and running fast.\n\nBut you saw this concept when using Collections.\n\
    \nCollections are based around interfaces.\n\nThe Collections themselves implement\
    \ interfaces, and extend Abstract Classes.\n\nSince you don't really need to worry\
    \ about this until you have a larger code base, and more familiarity with Java,\
    \ I have discussed this in the \"Advancing Concepts\" chapter towards the end\
    \ of the book.\n\n# Summary\n\nInheritance can be used as a ‘code re-use’ tool,\
    \ but it is better to construct objects which have an ‘is a’ relationship.\n\n\
    When we re-implementation a method from the ‘super’ class that we extend then\
    \ we annotate the method with `@override` to make clear to other people what we\
    \ have done, and gain some prime time checking of our actions.\n\nWe can add new\
    \ methods into the class which is inheriting and these will not be added to the\
    \ super class.\n\nAny new methods in the super class will automatically be made\
    \ available to the *extending* class.\n\nPrivate methods and fields are not accessible\
    \ through inheritance, only the super class's protected and public fields and\
    \ methods are accessible through inheritance.\n\n# References and Recommended\
    \ Reading\n\n+   * Object Oriented Design Concepts\n    * docs.oracle.com/javase/tutorial/java/concepts\n\
    * Inheritance or Composition Discussion\n    * en.wikipedia.org/wiki/Composition_over_inheritance\n\
    * Object Oriented Programming Concepts\n    * en.wikipedia.org/wiki/Object-oriented_programming"
