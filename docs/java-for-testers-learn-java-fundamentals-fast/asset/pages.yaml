  md: '# # Chapter Twelve - Introducing Inheritance


    | Chapter Summary

    In this chapter you will learn a brief overview of Inheritance:

    * An Object can inherit from another Objects to reuse code

    * An Object can re-implement inherited methods

    * You can re-use code through composition, as well as inheritance

    * use the keywords in Java to inherit from a Class |


    Before we provide more information about Exceptions we will have to provide an
    overview of Inheritance and how you use Java to extend other classes.


    # ## Inheritance


    Inheritance is an Object-Oriented Design concept. Java provides an implementation
    of some inheritance features. In this chapter you will receive a brief overview
    of inheritance, mainly so that you understand some of the mechanisms Java provides,
    and to help you understand some of the more advanced sections as we work through
    the book.


    I have covered inheritance late in the book because you don''t really need it
    for the early parts of this book. The book started by having you ''use'' Java.
    You didn''t really need to extend any classes.


    When we start creating our Exception classes, then we will need to extend other
    classes, so we need to understand the Java concept of Inheritance.


    You have seen that Java Classes have methods and fields. And that methods and
    fields could be public or private.


    Inheritance provides one way of allowing us to re-use those methods in other classes.


    We make one object inherit from another use of the extends keyword.


    ```

    import com.javaforsters.domainidentities.User;

    public class EmptyUser extends User {

    }

    ```


    In the above example, the EmptyUser object inherits from the User object.


    Any public methods on the User object, are ''inherited'' by the EmptyUser object,
    so you, as a programmer, do not have to write those methods.


    If you want the EmptyUser to have a different implementation of any of those methods
    then you can implement the method in EmptyUser and override the method inherited
    from User.'
