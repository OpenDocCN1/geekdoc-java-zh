    Arrays provides a static method called fill which we can use to fill an array
    with

    specific value, or fill a range of indices in the array.


    To fill every item in the array with the same value we make a simple call to fill

    Arrays.fill( array , value );


    e.g. to fill an array of integers with the value minus (-1), I can do the following:'
