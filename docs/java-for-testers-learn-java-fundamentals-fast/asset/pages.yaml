  md: "# Java's System Properties\n\n# Reading System Properties\n\nJava's System\
    \ object has a set of properties that come in very hand when when writing automation\
    \ code.\n\ne.g. \"user.dir\" returns the working directory for the running application\n\
    \n```\nString workingDirectory = System.getProperty(\"user.dir\");\n```\n\nI can\
    \ use this for accessing data files that I want to use in my automation e.g. if\
    \ I create a directory in my project called property_files under /src/test/resources/\
    \ then I could build the full path by prefixing the current working directory:\n\
    \n```\nString resourceFilePath = workingDirectory +\n    \"/src/test/resources/\"\
    \ +\n    \"property_files/\" +\n    \"static_example.properties\";\n```\n\nYou\
    \ can work directly with the Properties object on System, by using the Properties\
    \ method.\n\nFor example I wanted to list the System properties then I can use\
    \ the following code:\n\n```\nProperties sys = System.getProperties();\nsys.list(SystemOut);\n\
    ```\n\nA partial of the above command is shown below:\n\n+   - listing properties\n\
    java.runtime.name=Java(TM) Runtime Environment\nsun.boot.library.path=C:\\Program\
    \ Files\\Java\\jdk1.7.0_10\\jre... \njava.vm.version=23.6-b04\njava.vm.vendor=Oracle\
    \ Corporation\njava.vendor.url-http=http://java.oracle.com/\npath.separator=\\\
    njava.vm.name=Java HotSpot(TM) 64-Bit Server VM\n\n# Execute: Output the System\
    \ Properties object\n\n> Write An @Test annotated which will list the contents\
    \ of the System Properties\nRead the System Properties documentation so you understand\
    \ the range of properties available for your use by default.\n\n+   - docs.oracle.com/javase/tutorial/essential/environment/sysprop.html\n\
    \nSystem properties I use most often are:\n\n+   - user.dir - current working\
    \ directory for the code\n- user.home - home directory of current user\n- line.separator\
    \ - end of new line string\n- file.separator - character separator for directory\
    \ paths e.g. \\ on windows, / linux\n- java.io.tmpdir - location of the current\
