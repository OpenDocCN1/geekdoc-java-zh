  md: "```\nassertEquals(\"F\", likelyGenderIs(\"ms\"));\nassertEquals(\"F\", likelyGenderIs(\"\
    lady\"));\nassertEquals(\"F\", likelyGenderIs(\"madam\"));\n}\n```\n\n```\npublic\
    \ String likelyGenderIs(String title){\n  String likelyGender;\n  switch(title.toLowerCase(){\n\
    \    case \"sir\":\n      likelyGender = \"M\";\n      break;\n    case \"mr\"\
    :\n      likelyGender = \"M\";\n      break;\n    case \"master\":\n      likelyGender\
    \ = \"M\";\n      break;\n    default:\n      likelyGender = \"F\";\n      break;\n\
    \  }\n  return likelyGender;\n}\n```\n\n+   * The switch statement takes an expression\
    \ to check.\n* The switch block has a series of end case.\n* The break statement\
    \ is important to end each case.\n* The last case should be a default which is\
    \ executed if no other case matches.\n* default does not require a break, but\
    \ I usually add one\n\nNote: you need to use Java 1.7 or above if you want to\
    \ have string literals in your case statements.\n\nBe Careful. If you forget the\
    \ break then the case will fall through to the next one. e.g.\nI have written\
    \ the switch like this:\n\n```\nswitch(title.toLowerCase(){\n  case \"sir\":\n\
    \  case \"mr\":\n    case \"master\":\n      likelyGender = \"M\";\n      break;\n\
    \    default:\n      likelyGender = \"F\";\n      break;\n}\n```\n\nWhen written\
    \ deliberately, the fall through can make code easy to read. Beware that it is\
    \ a simple mistake to make and forget the break statement and it can easily introduce\
    \ bugs into your code."
