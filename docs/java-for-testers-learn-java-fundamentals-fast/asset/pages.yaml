  md: "# # Chapter Eight - Properties and Property Files\n\n#  Chapter Summary\n\n\
    In this chapter you will learn how to use the Properties class\n\n+   - A property\
    \ file has \"key, \"value\" pairs on each line\n- Properties class makes it easy\
    \ to load and save \"key, \"value\" pair data\n- setProperty method to add a property\
    \ key and value\n- getProperty method to get the value for a property key\n- size\
    \ method to return the number of property keys\n- Iterate through properties using\
    \ stringPropertyNames\n- list to display properties to output\n- containskey check\
    \ if a property key exists\n- An introduction to Java System properties\n  - user.dir\
    \ - current working directory for the code\n  - user.home - home directory of\
    \ current user\n  - line.separator - end of new line string\n  - file.separator\
    \ - character separator for directory paths\n  - java.io.tmpdir - location of\
    \ the current temporary directory\n- Loading and Saving Properties files\n  -\
    \ store to save property files\n  - load property files in combination with a\
    \ FileReader\n\nOne of the early problems I had when working with Java, was working\
    \ with files for my data. Files aren't really that hard, and we'll cover them\
    \ in a later chapter, but my initial workaround was to use property files, via\
    \ the Properties class.\n\nProperty files are those very simple files you see\
    \ many tools use for configuration, with key=value e.g.\n\n```\n# Define the browsers\
    \ to use\nbrowser=chrome\nport=8080\n```\n\n+   - A property file treats lines\
    \ starting with # as comments.\n- Blank lines are ignored.\n- Lines with content\
    \ are treated as \"key, \"value\" pairs separated by an = = sign.\n- If a property\
    \ file has multiple entries with the same key, then the last one will be used\n\
    - trailing and leading spaces before and after either the key or the value are\
    \ ignored, e.g. the following entries are equivalent\n\n```\nbrowser = chrome\n\
    browser=chrome = \nbrowser = chrome\n```\n\nIn the early days I would often use\
    \ Property files as input files which I didn't have to struggle to parse e.g."
