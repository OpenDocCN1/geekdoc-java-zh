    ;\n```\n\nWe then need to create the properties that we will store to the file:\n\
    \n```\nProperties saved = new Properties();\nsaved.setProperty(\"prop1\", \"Hello\"\
    );\nsaved.setProperty(\"prop2\", \"World\");\n```\n\nWe need to create an OutputStream\
    \ to store the properties into, and write them with the store method. The store\
    \ method allows the OutputStream open so we have to close it when we are finished\
    \ with it.\n\nNote that the store method takes two parameters:\n\n+   - the OutputStream\
    \ that we write the details to\n- a comment String\n\nThe String comment is written\
    \ to the OutputStream prior to the properties, and in addition a Timestamp when\
    \ the properties are written is added to the file.\n\nSo the final file output\
    \ from the above method execution looks as follows:\n\n```\n#Hello There World\n\
    #Mon Aug 05 15:12:24 BST 2013\n3 prop2-World\n4 prop1-Hello\n```\n\nNote that\
    \ the property ordering is not retained when writing to the file.\n\n# Load\n\n\
    Since I have already created a file in my project (using the store method), all\
    \ I have to load it from the directory I saved it to.\n\nI can use either an InputStream\
    \ or a FileReader for this. We will cover these in more detail in the Files Chapter.\
    \ But for now, we will use a FileReader.\n\n```\nFileReader propertyReader =\n\
    \  new FileReader(tempResourceFile);\nProperties loaded = new Properties();\n\
    try{\n  loaded.load(propertyReader);\n}finally(\n```"
