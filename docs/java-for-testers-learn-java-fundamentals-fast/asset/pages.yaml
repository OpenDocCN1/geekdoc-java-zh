    # Using Random Numbers to generate Random Strings


    A crude way to generate random strings is to build a String by randomly adding
    a valid character to the String.


    For Example if I want to build a String from the uppercase letters and space:


    ```

    String validValues = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    ```


    Then I can randomly select a character from that String:


    ```

    int rndIndex = random.nextInt(validValues.length());

    char chr = validValues.charAt(rndIndex);

    ```


    If I loop around this generation process and concatenate the results then I can
    generate a random String.


    # Exercise: Generate a Random String 100 chars long


    Generate a random string, 100 characters long, containing the characters '' ''
    (space) and ''A'' to ''Z'',


    # Discussion random data in automation


    Many people do not like to add random data to their automation.


    I do.


    I view automated checks as exercising a particular path through the system, with
    variable data.


    Some data, is needed in order to control the path, and if I vary that data then
    I run a different path.


    For Example: If I am only asked for my passport number when I am 65, if I create
    a user who is not 65, I can''t cover that path. But if I am asked for a passport
    number when I am 65 or over, then I have an equivalence class. And if I randomly
    generate an age which is 65 or older I can cover that. It should have no difference
    to the @Test methods, so I can vary the data. If I vary the data and the @Test
    method does not run as expected I may have found a bug with our understanding
    of the equivalence class, but I might also have found a bug related to the way
    the application processes a particular age.


    I use randomness to generate data for equivalence classes, and control the data
    which needs to be static for the execution path preconditions to be met.


    # Importance of Logging when using Random data


    When I use random data, I need to log it.'
