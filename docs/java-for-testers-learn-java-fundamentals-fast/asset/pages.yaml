  md: "# Chapter Four - Work with Other Classes\n\nChapter Summary\nIn this chapter\
    \ you will learn:\n\n* How to use static methods of another class\n* How to instantiate\
    \ a class to an object variable\n* How to access static fields and constants on\
    \ a class\n* The difference between Integer value and instantiation\n\nIn this\
    \ chapter you are going to learn how to use other classes in your @Test method\
    \ code. Eventually these will be classes that you write, but for the moment we\
    \ will use other classes that are built in Java.\n\nYou have already done this\
    \ in the previous chapter. Because you used the JUnit Assert class to check conditions,\
    \ but we imported it statically, so you might not have noticed. (I'll explain\
    \ what static import means in the next chapter).\n\nBut first, some guidance on\
    \ how to learn Java.\n\n# Use @Test methods to understand Java\n\nWhen I work\
    \ with people learning Java, I encourage them to write methods and assertions\
    \ which help them understand the Java libraries they are using.\n\nFor example,\
    \ you have already seen a primitive type called an int.\n\nJava also provides\
    \ a class called Integer.\n\nBecause Integer is a class, it has methods that we\
    \ can call, and we can instantiate an object variable as an Integer.\n\nWhen I\
    \ create an int variable, all I can do with it, is store a number in the variable,\
    \ and retrieve the number.\n\nIf I create an Integer variable, I gain access to\
    \ a lot of methods on the integer e.g.\n\n+   * compareTo - compare it to another\
    \ integer\n* intValue - return an int primitive\n* longValue - return a long primitive\n\
    * shortValue - return a short primitive\n\n# Explore the Integer class with @Test\
    \ methods\n\nIn fact you can see for yourself the methods available to an integer.\n\
    \n+   * Create a new package:\n    * com.javafortesters.chap04@testwithotherclasses.examples"
