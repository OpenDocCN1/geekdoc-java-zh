- pgno: 54
  md: '# Exercise: Convert from Static Usage to Static Import


    Experiment with the static import in your TestAppEnvironmentTest.


    +   - Convert the assertEquals static to an import of the Just and amend the @Test
    methods accordingly so you prefix each usage of assertEquals with Assert.

    - Convert the import of TestEnv to an static import of the DOMAIN and the PORT,
    and convert the @Test methods you use without the prefix.

    - Convert the import to static import of everything in TestAppEnv and convert
    the @Test methods so the constants have no prefix.


    As you make changes, reflect on: how does the automation code look? is it maintainable?


    # How to decide what to static import


    Deciding what to import statically might be made for you through organizational
    coding standards. i.e. some teams always write assertEquals


    I usually make the decision based on my standards of readability, so I generally
    import the static methods I use. But I would not import the TestAppEnv constants
    since I don''t think using DOMAIN or PORT in the @Test methods gives enough information
    and I''d wonder "which domain?” and "which port?”, but I rarely wonder "which
    assertEquals?"


    Overuse of import static can make your code less readable because people might
    confuse your statically imported method, or constant, as one which is locally
    defined.


    The important point at the moment is to know you:


    +   - have a choice over how you statically import.

    - decide which approach to use on a case by case basis (or follow your organizational
    standards).

    - can make code less readable and maintainable if you import static too many methods
    and constants, so use this power sparingly.


    # Summary


    Again, I''ve tried to condense a bunch of learning into a single chapter. I hope
    you managed to follow along. If not, go back through this chapter and try again,
    or copy your code to the main Github source (or included above).


    We covered a lot of fundamental concepts, and actually done the work, by typing
    it into your IDE, you will have learned more than you may realize:


    +   - We managed to easily amend the environment location.

    - We abstracted the code away from the @Test methods so that our abstraction can
    change without requiring any other code changes in the test branch.

    - We now know how to create static methods.

    - We now know how to create static constant fields.

    - We now know a little refactoring.

    - We know a little String concatenation.'
