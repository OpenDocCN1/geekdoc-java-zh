    # Bit Shift Operators


    You can perform binary arithmetic and shift operations on Integer data types.


    +   << shift to the left e.g. <<3 3 to the left

    * >> signed shift to the right

    * >>> unsigned right shift (shift a zero into leftmost position)


    The shift operators can also be used by assignment.


    ```

    @Test

    public void bitwiseShiftOperatorsExpanded(){

    int x = 56;


    assertEquals(x*2, x<<1);

    assertEquals(x*4, x<<2);

    assertEquals(x*8, x<<3);


    x <<=3;

    assertEquals(56*8, x);


    x = Integer.MAX_VALUE;

    assertEquals(Integer.MAX_VALUE/2, x>>1);

    assertEquals(Integer.MAX_VALUE/4, x>>2);

    assertEquals(Integer.MAX_VALUE/8, x>>3);


    x = Integer.MIN_VALUE; // -ve

    assertEquals((Integer.MAX_VALUE/2)+1, x>>1);

    }

    ```


    # Operator precedence


    The operator precedence is listed on the Java documentation page:


    docs.oracle.com/javase/tutorial/java/nutsandbolts/operators.html


    While it is worth understanding the operator precedence, it is generally easier
    to read the intent behind a complex statement the order of precedence is made
    clear by using parenthesis, () since nested operations are executed first.


    e.g. compare the asserts:


    ```

    @Test

    public void operatorPrecedence(){

    assertEquals(8, 4+2/6 );

    assertEquals(12, ((4+2)*6/3) );

    }

    ```


    Therefore try and use precedence, (), to control the order of precedence, as it
    will make the code easier to read and maintain.'
