    # Create a Class


    Click on TestAppEnv and press the alt + enter (Intelli''J Intention Actions shortcut
    key) and you will see a small pop up menu of fix options. Something like:


    +   * Create local variable ''TestAppEnv''

    * Create class ''TestAppEnv''

    * Create field ''TestAppEnv''

    * Create inner class ''TestAppEnv''

    * Create parameter ''TestAppEnv''

    * etc.


