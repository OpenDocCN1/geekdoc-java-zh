- pgno: 24
  md: '# Chapter Three - Writing Your First Java Code


    Chapter Summary

    In this tutorial you will follow along with the text and create your first JUnit
    test. You will learn:


    +   * To organize your code and import other classes

    * Creating classes and naming classes as JUnit tests

    * Making Java methods run as JUnit tests

    * Adding asserts to report errors during the execution

    * How to run JUnit tests from the IDE and the command line

    * How to write basic arithmetic statements in Java

    * About Java comments


    Follow along with the text, and use the example code as a guide. If you have issues
    then compare the code you have written carefully against the code in the book.


    In this chapter we will take a slightly different approach. We will advance step-by-step
    through the chapter and we will write a simple method which we will run as a JUnit
    test.


    # My First JUnit Test


    The code will calculate the answer “2+2”, and then assert that the answer is “4”.


    The code we write will be very simple, and will look like the following:


    ```

    1 package com.javafortesters.chap003myfirsttest.examples;

    2 import org.junit.Test;

    3 import static org.junit.Assert.assertEquals;

    4

    5 public class MyFirstTest {

    6

    7 @Test

    8 public void addTwoPlusTwo() {

    9     int answer = 2+2;

    10    assertEquals("2+2=4", 4, answer);

    11 }

    12 }

    ```


    I''m showing you this now, so you so have an understanding of what we are working
    towards. If you get stuck, you can refer back to this final state and compare
    it with your current state to help resolve any problems.


    # Prerequisites


    I''m assuming that you have followed the setup chapter and have the following
    in place:


    +   * JDK Installed

    * IDE Installed

    * Maven Installed

    * Created a project'
  merge: -1
  img_proc: true
- pgno: 25
  md: '+   * Added JUnit to the project pom.xml


    We are going to add all the code we create in this book to the project you have
    created.


    # Create A JUnit Test Class


    The first thing we have to create is a class, to which we will add our JUnit test
    method.

    A class is the basic building block for our Java code. So we want to create a
    class named MyFirstTest.

    The name MyFirstTest has some very important features.


    +   * It starts with an uppercase letter

    * It has the word Test at the end

    * It uses camel case


    It starts with an uppercase letter because, by convention, Java classes start
    with an uppercase letter. By convention means that it doesn''t have to. You won''t
    see Java throw any errors if you name the class myFirst with a lowercase letter.
    When you run the code, Java won''t complain.


    But everyone that you work with will.


    We expect Java classes to start with an uppercase letter because they are proper
    names.

    Trust me.


    Get the habit of naming your classes with the first letter in uppercase. Then
    when you read code you can tell the difference between a class and a variable,
    and you''ll expect the same from code that other people have written.


    It has the word Test at the end. We can take advantage of the ''out of the box''
    Maven functionality to run our JUnit tests from the command line, instead of the
    IDE, by typing mvn test. This might not seem important now, but at some point
    we are going to run our code automatically as part of a build process. And we
    can make that easier if we add Test in the Class name, either as the start of
    the class name, or at the end. By naming our classes in this way, Maven will automatically
    run our JUnit test classes at the appropriate part of the build process.


    > Incorrectly Named Classes Will Run From the IDE


    Very often we run our JUnit test code from the IDE. And the IDE will run the methods
    in JUnit test classes even if they are not named as Maven requires. If we do not
    name a class correctly then it will not run from the command line when we type
    mvn test because we saw it run in the IDE, we believe it is running.


    This leaves us thinking we have more coverage than we actually do.


    It uses camel case where each ''word'' in string of concatenated words starts
    with an uppercase letter. This again is a Java convention, it is not enforced
    by the compiler. By people reading your code will expect to see it written like
    this.'
