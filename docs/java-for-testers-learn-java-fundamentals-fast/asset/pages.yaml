    elements of the String replaced with other characters.


    +   * .replace - replace all matching substrings with a new substring

    * .replaceAll - replace all substrings that match a regular expression with a
    new

    substring

    * .replaceFirst - replace the first substring matching the regular expression
    with a

    substring


    ```

    String hello = "Hello fella fella fella";

    assertThat(hello.replace("fella", "World");

    nis("Hello World World World"));

    ```


    You might wonder why there is no replaceFirst for normal Strings, rather than
    just

    using regular expressions. And the reason is that a ''normal'' string, is a regular
    expression,

    but one only matches that String.

    This allows me to use replaceFirst to replace the first occurrence of fella with
    world:


    ```

    assertThat(hello.replaceFirst("fella"

    ```'
