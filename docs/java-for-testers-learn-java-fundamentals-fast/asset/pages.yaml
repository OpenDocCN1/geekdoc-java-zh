    # compareTo & compareToIgnoreCase


    compareTo compares the String you call the method on, with a String parameter:

    If the two Strings are equal then compareTo returns


    ```

    String hello = "Hello"

    assertThat(hello.compareTo("Hello"), is(0));

    ```


    If the argument is smaller than the String then compareTo returns a number


    If the argument is larger than the String then compareTo returns a positive number


    That larger means both longer length, or a character difference. Similarly smaller
    means length, or a character difference.

    compareToIgnoreCase uses the same logic as compareTo but the case of the letters
    is ignored e


    ```

    assertThat(hello.compareToIgnoreCase("hello"), is(0));nassertThat(hello.compareToIgnoreCase("Hello"),
    is(0));nassertThat(hello.compareToIgnoreCase("Hello"), is(0));

    ```


    # contains


    The method contains return true if the parameter String is contained within the
    String. The value will also be returned if the parameter String equals the String.


    ```

    String hello = "Hello"

    assertThat(hello.contains("He"), is(true));nassertThat(hello.contains("Hello"),
    is(true));

    ```


    Case is important when using:


    ```

    assertThat(hello.contains("he"), is(false));

