  md: 'As a recommendation, same type you work with a collection, and the objects
    to be stored in the collection are all of the same type then declare the collection
    as a collection of type e.g.


    ```

    Collection<String> weekendDays = new <ArrayList>();

    Collection<String> daysOfWeek = new <ArrayList>();

    ```


    In the above code I declare the collection as a collection of <String>. Which
    I instantiate an ArrayList that will only contain <String>.


    This provides a number of benefits:


    +   - It makes the code clear as to contents of the collection

    - It makes the collections strongly typed which helps with code completion later


    Try to get in the habit of declaring the type of the contents of the collection
    when you know that the collection will only contain one type of element.


    ![](img/3571bcaadac59e6bb801bc317a52cb1e_108_0.png)


    # Generics


    The <String> notation, is a usage of Java Generics which is a way of declaring
    classes to a particular type of object, but only defining the type at compile
    time.


    A full discussion of generics is beyond the scope of this book, but it is important
    to recognize the usage of it, and how to take advantage of it with the classes
    you use. At the moment you have only seen Generics in the context of collections.


    Read the references on generics if you want to self-study generics in more detail.


    For now, understand that <String> declares the type of elements in the collection
    and implementation Class.


    ![](img/3571bcaadac59e6bb801bc317a52cb1e_108_1.png)


    # Generic Syntax


    In most of the examples in this book I will use the syntax like the following:

    Collection<String> weekendDays = new <ArrayList>();


    It is also possible to leave out the <String> on the ArrayList and use <> and
    the Java compiler will use the <Generic value from the interface declaration e.g.

    collection<String> weekendDays = new ArrayList<>();


    The syntax is shorter and sometimes your IDE will code complete in the above format
    for you.

    The reason I don''t use it, is simply because it''s not used to using it, think
    it about in Java 1.7


    The following syntax for generics are equivalent:


    ```

    Collection<String> cola = new ArrayList<String>();

    Collection<String> colb = new <String-ArrayList>();

    Collection<String> colc = new ArrayList<>();

    ```


