    # Capacity Management


    Since StringBuilder maintains an internal representation of the String it allocates
    a particular capacity for memory for internal representation. When items are appended
    to the StringBuilder the capacity is automatically increased.


    By default, if you use the no-argument constructor, the capacity is 16.


    ```

    StringBuilder builder = new StringBuilder();

    asertThat(builder.capacity(), is(16));

    ```


    You can find out the current capacity size using the capacity method.


    You can construct a StringBuilder with a specific capacity if you want.


    ```

    StringBuilder sblen = new StringBuilder(512);

    asertThat(sblen.capacity(), is(512));nasertThat(sblen.toString().length(), is(0));

    ```


    For automation we typically don''t worry about the capacity, but if you are writing
    code that needs to be fast then you might size the StringBuilder to avoid too
    much capacity re-allocation.


    You can size the StringBuilder after construction using the ensureCapacity method.


    ```

    builder.ensureCapacity(600);

    ```


    If you have amended the capacity, or deleted a lot of string then you can set
    the capacity to the minimum necessary to hold the string characters by issuing:


    ```

    builder.trimToSize();

    ```


