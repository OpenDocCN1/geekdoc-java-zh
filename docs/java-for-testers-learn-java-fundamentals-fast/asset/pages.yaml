    # Date


    The Date class exposes a small set of methods.


    ```

    Date date = new Date();

    ```


    Methods that date provides:


    +   - after - return true if the parameter date is after the Date object

    - before - return true if the parameter date is before the Date object

    - compareTo - returns 0 if the Date objects are equal, negative if the Date object
    is less than parameter and if the Date object is greater than the parameter

    - equals - return true if the parameter and Date represent the same time and date

    - setTime - set the time represented by the Date to a specific millisecond value

    - getTime - return the number of milliseconds after midnight, January 1 1970 the
    Date represents

    - toString - return a String representation of the date


    Instantiating Date without a parameter will default the time represented by the
    Date to the same value as System.currentTimeMillis().


    The following two statements are essentially equivalent:


    ```

    Date equivDate1 = new Date();

    Date equivDate2 = new Date(System.currentTimeMillis());

    ```


    The toString method provides a simple method of outputting a String representation
    of the date.


    ```

    System.out.println(date.toString());

    ```


    On my machine toString outputs the following format:


    +   - Thu Jun 20 12:18:04 BST 2013'
