  md: "The simplest logging mechanism to start with is System.out.println if my @Test\
    \ methods write to the console an output of data they have used, then I can recreate\
    \ the run later by using the output logs. Because the methods may have failed\
    \ to the specific combination of random values, and I need to recreate any assertion\
    \ with that particular data.\n\nI may need to create a mechanism to rerun methods\
    \ with particular data, in which case seeding the random mechanism, and logging\
    \ the seed value, might be an appropriate solution.\n\nI have managed to get by\
    \ in most of my production use of randomization by logging the output of the random\
    \ generation to System.out.println. The log appears in System.out when the code\
    \ runs as part of continuous integration and if an assertion fails due to data\
    \ then we can look the log and use the seed, or data, to recreate the execution,\
    \ or re-running the @Test manually with the generated data.\n\nStart simple with\
    \ your automation.\n\nDon't think that you've started using random data you need\
    \ the ability to recreate all the runs exactly and see your data in the continuous\
    \ integration environment. probably don't. You probably need to start with the\
    \ ability to see what data you have used so that you can re-run failing methods\
    \ manually and determine if the random data combination you used, triggered a\
