- pgno: 9
  md: '# Introduction


    This is an introductory text. At times it takes a tutorial approach and adopts
    step by step instructions to coding. Some people more familiar with programming
    might find this slow. This book is not aimed at those people.


    This book is aimed at people who are approaching Java for the first time, specifically
    with a view to adding automation to their test approach. I do not cover automation
    tools in this book.


    I do cover the basic Java knowledge needed to write and structure code when automating.


    I primarily wrote this book for software testers, and the approach to learning
    is oriented around writing automation code to support testing, rather than writing
    applications. As much it might be useful for anyone learning Java, who wants to
    learn from a “test first” perspective.


    Automation to support testing is not limited to testers anymore, but this book
    is suitable for anyone wanting to improve their use of Java in automation: managers,
    business analysts, users, and of course, testers.


    # Testers use Java differently


    I remember when I started learning Java from traditional books, and I remember
    that I was unnecessarily confused by some of the concepts that I had to use e.g.
    creating manifest files, and compiling from the command line.


    Testers use Java differently.


    Most Java books start with a ‘main’ class and show how to compile code and write
    simple applications from the command line, then build up into more Java constructs
    and GUI applications. When I write Java, I rarely compile it to a standalone application,
    I spend a lot of time in the IDE, writing and running small checks and refactoring
    to abstraction layers.


    By learning the basics of Java presented in this book, you will learn how to read
    and understand existing code base, and write simple checks using JUnit. You will
    not learn how to build and structure an application. That is useful knowledge,
    but it can be learned after you know how to contribute to the Java code base with
    JUnit tests.


    My aim is to help you start writing automation code using Java, and have the basic
    knowledge you need to do that. This book focuses on core Java functionality rather
    than a lot of additional libraries, since once you have the basics, picking up
    a library and learning how to use it becomes a matter of reading the documentation
    and sample code.


    # Exclusions'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'This is not a ''comprehensive'' introduction. This is a ''getting started''
    guide. Even though I concentrate on Java, there are still aspects of Java that
    I haven''t covered in detail, I have covered ''just enough'' to understand. E.
    inheritance, interfaces, enums, inner classes, etc.


    Some people may look disparagingly to the text based on the exclusions. So consider
    this an opinionated introduction to Java because I know that I did not need to
    use many of those exclusions for the first few years of automation programming.


    I maintain that there is a core set of Java that you need in order to start writing
    automation code and start adding value to automation projects. I aim to cover
    this in book.


    Essentially, I looked at the Java I needed when I started writing automation to
    support my testing, and even as scope for this book. While knowledge of Interfaces,
    Inheritance, and enums, all help make my automation abstractions more readable
    and maintainable; I did not use those constructs with my early automation.


    I also want to keep the book small, and approachable, so that people actually
    read it and work through it, rather than buying and leaving on their shelf because
    they were too intimidated to pick it up. And that means leaving out the parts
    of Java, which you can pick up yourself, once you have mastered the concepts in
    this book.


    This book does not cover any Java 1.8 functionality. The highest version of Java
    required to work with this book is Java 1.7. The code in this book will work with
    Java 1.8, I simply don''t cover any of the new functionality added in Java 1.8
    I want you to learn the basics, and start being productive quickly. After you
    complete this book, you should be able to pick up the new features in Java 1.8
    when you need them.


    # Supporting Source Code


    You can download the source code for this book from github.com. The source contains
    the examples and answers to exercises.


    I suggest you work through the book and give it your best shot before consulting
    the source code.


    +   - github.com/eviltester/javaForTestersCode


    The source code has been organized into two high level source folders: main and
    test. The full significance of these will be explained in later chapters. But
    for now, the test folder contains all the JUnit tests that you use in this book.
    Each chapter has a package and beneath that an exercises and examples folder:


    +   - The main folder for Chapter 3 is:


    +     - src\test\java\com\javaforter\chap003myfirsttest


    +   - it contains an examples folder with all the code used in the main body of
    the text


    +   - it contains an exercises folder with all the code for the answers I created
    for the exercises in Chapter 3'
  merge: -1
  img_proc: true
