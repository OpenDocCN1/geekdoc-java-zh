- pgno: 229
  md: '# Chapter Twenty Two - Advancing Concepts


    | Chapter Summary |

    | --- |

    | This chapter provides a brief overview... (list follows) |


    This chapter provides a brief overview of each of the following areas, with links
    for you to start conducting your research on the topic.


    +   - Interfaces

    - Abstract Classes

    - Generics

    - Logging

    - Enum

    - Regular Expressions

    - Reflection

    - Annotations

    - Design Patterns

    - Concurrency

    - Additional File considerations


    And we are almost finished now.


    The original intent behind this book was to cover the basics of Java that you
    need to understand, in an order that allowed you to use the concepts quickly,
    without being distracted by too much additional overhead.


    This chapter provides an overview of ‘advancing’ concepts which are not necessarily
    to be functional in Java, but it is important to know they exist, and give you
    something to research in your next steps.


    You probably won’t need these concepts for writing simple JUnit tests.


    You may need these when you start building a lot of code that has hang together
    well, and when the Java code itself needs to embody good design principles.


    For the first 3 or 4 years of my writing automation code, I probably didn’t use
    any of the concepts very much at all.


    +   - I used composition to re-use code, without using Interfaces.

    - I rarely used Inheritance.

    - I never used Abstract Classes.

    - I didn’t really know what an enum was

    - etc.


    My code was simple, but didn’t design principles holding it together. Which is
    why I think of these as “Advancing Concepts”.


    They are not ‘advanced’ since they are fundamental to the way that Java and good
    programming works. But in terms of your usage of them, they only need to become'
  merge: -1
  img_proc: true
- pgno: 230
  md: "relevant when you are “Advancing” your understanding of Java and the robustness\
    \ of your abstraction layers.\n\n# Interfaces\n\nIn earlier sections of the book\
    \ we used Interfaces without actually explaining much about them.\n\nAn Interface\
    \ declares a set of methods that a Class must implement. Anywhere in our code\
    \ that we only want to use the set of interface methods, we can cast objects to\
    \ the interface, or declare objects as, that interface, rather than working with\
    \ concrete classes.\n\ne.g use a List rather than an ArrayList\n\nEach object\
    \ that implements an interface then has freedom to decide how to implement the\
    \ methods on that interface, that they are appropriate to that particular object.\n\
    \nI tend to introduce interfaces into my code when I start to see similar usage\
    \ patterns of the objects.\n\nAs an example. When animating a web site I create\
    \ objects to represent each Page on the site. Pages on the site tend have similar\
    \ components e.g. header or footer. Early in my code I might have a getHeader\
    \ on some pages, but not others and I might have repeated code as a result.\n\n\
    When I spot this, I can create an interface called Header and this might force\
    \ the page to implement the getHeader method. And I can write methods that operate\
    \ on a Header of a page which take a Header as a parameter instead of individual\
    \ page objects, or a generic object.\n\nResearch Interfaces so you understand\
    \ their capabilities. And use them to help you organize your abstraction layers.\n\
    \n# Research Links:\n\n+   - Interface Definition\n  - docs.oracle.com/javase/tutorial/java/concepts/interface.html\n\
    - How to create an Interface\n  - docs.oracle.com/javase/tutorial/java/lang/createinterface.html\n\
    \n# Abstract Classes\n\nAbstract classes are classes which you can extend, but\
    \ can't instantiate directly since all the methods in the Abstract class will\
    \ have been implemented in the Abstract Class.\n\nI rarely use Abstract Classes.\
    \ I tend to use interfaces and delegate out to other concrete classes. I do this\
    \ because I know my abstraction classes are likely to change frequently and I\
    \ need a lot of flexibility in my code.\n\n# Research Links:\n\n+   - Abstract\
    \ Classes Offical Documentation\n  - docs.oracle.com/javase/tutorial/java/lang/abstract.html"
  merge: -1
