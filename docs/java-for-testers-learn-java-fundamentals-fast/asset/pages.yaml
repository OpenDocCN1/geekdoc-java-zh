  md: '# Chapter Seven - Basics of Java Revisited


    Chapter Summary

    In this chapter you will receive an overview of:


    +   * Java Comments

    * Java naming conventions

    * Working with packages

    * Scope of fields, methods and classes

    * the final keyword

    * Data Types: boolean, floating point, integer, boolean and their wrapper classes

    * BigDecimal

    * Operators: Arithmetic, Assignment, Boolean, Conditional, Ternary and Bitwise

    * Operator Precedence

    * String concatenation and static methods


    This chapter will quickly reinforce the topics covered in the previous tutorial
    chapters. You will also see reference to concepts you have not yet covered e.g.
    BigDecimal, we mention these because it makes sense in context, but we will cover
    the details later.


    There are no specific exercises in this chapter, although you should read through
    the example code to make sure you understand it. I also recommend that you write
    @Test methods to experiment with your own examples and verify the statements made
    in this chapter.


    You can use this as a reference chapter for later study. Rest assured that we
    continue to build on this information in later chapters, so don''t worry if you
    don''t absorb it all on reading.


    # Comments


    Comments are non-executable statements in the code.

    There are 3 types of comments:


    +   * comments that run to the end of the line //

    * comments that mark out blocks starting /* and ending */

    * JavaDoc comments starting with /** and ending /*


    When we want small comments we can add them after statements and anything after
    // will be treated as a comment. These comments are useful for quick explanations.


    ```

    assertTrue(true); // comment till end of line

    ```


    To comment out a block of code, or have a larger descriptive text we use a block
    comment which starts with /* and ends with /. These comments can span lines and
    start and end in the middle of lines.'
