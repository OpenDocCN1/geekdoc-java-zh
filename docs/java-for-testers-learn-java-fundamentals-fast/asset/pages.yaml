    \ {\ntry {\n    User aUser = new User(\"\", \"wrong\");\n    fail(\"An exception\
    \ should have been thrown\");\n} catch (InvalidPassword invalidPassword) {\n \
    \   assertTrue(\"The exception was thrown\", true);\n}\n```\n\nNote that in the\
    \ code I used from JUnit to use the @Test method to find if we did not throw an\
    \ assertion after creating the user. Without the fail, the method would have passed\
    \ if an exception had not been thrown, even though the method had actually failed.\
    \ Be very careful when working with exceptions as you need to make sure that you\
    \ don't have 'false positives' i.e. at an @Test passing, when it should have failed.\n\
    \n# Difference between Exception, Error and Throwable\n\nJava has an Exception\
    \ hierarchy:\n\n+   * Throwable\n  * Error\n  * Exception\n    * RuntimeException\n\
    \nThe root object is Throwable, and both Error and Exception extend this. Error\
    \ is reserved for serious Java platform errors. The general guidance provided\
    \ to Java programmers is \"never catch a Java Error\", which also means we should\
    \ not catch a Throwable.\n\nIf we want to catch a generic runtime exception then\
    \ we should catch RuntimeException because any runtime exceptions we raise will\
    \ derive from RuntimeException."
