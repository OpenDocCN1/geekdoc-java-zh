  md: "It creates a new instance of the class user and stores it in the variable user.\
    \ But we did not create a constructor on the user class, therefore no code in\
    \ the User class is executed\nNow we shall add some code that executes when the\
    \ class is instantiated, by writing a constructor, in the User class, that doesn't\
    \ take any arguments, known as a no-argument constructor.\n\n# Default Constructor\n\
    \nIf you don't write a constructor, then Java automatically creates one which\
    \ sets all your fields to their default values and calls the default constructor\
    \ for any superclass. (we haven't covered superclass yet, so this will make sense\
    \ later)\n\n# No-argument Constructor\n\nIf we have particular defaults in mind\
    \ for fields on the class then a good place to initialize them is in a no-argument\
    \ constructor.\n\nI want to have a username field and a password field and have\
    \ them default to \"username\" and \"password\".\n\nI could just go to the User\
    \ class and create code to set this up, but I want to get in the habit of creating\
    \ @Test methods first.\n\nTo help maintain that habit, I'm going to create an\
    \ @Test method which creates an object and then gets the username and password\
    \ and asserts they have been set to my desired values.\n\nI do this by creating\
    \ an @Test method which looks like this:\n\n```\n@Test\npublic void userHasDefaultUsernameAndPassword(){\n\
    \    User user = new User();\n    assertEquals(\"default username expected\",\n\
    \"username\",\n        user.getUsername());\n    assertEquals(\"default password\
    \ expected\",\n\"password\",\n        user.getPassword());\n}\n```\n\nThe getUsername\
    \ and getPassword methods do not exist so I have to create them. My IDE can create\
    \ the basic methods for them, but I don't have any username or password to return.\
    \ Which means it is now time to add username and password as fields in my user\
    \ class.\nI create a constructor in user that takes no arguments. And assign default\
    \ values to the fields username and password. Demonstrated by the following code:"
