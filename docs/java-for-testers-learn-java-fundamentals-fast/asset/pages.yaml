    # StringBuilder Summary


    StringBuilder is a very powerful class that prevents needing to use a lot of Strings
    and constantly concatenating them. The use of StringBuilder is also very efficient
    since it uses an internal representation rather than constructing new String objects
    on each method call.


    For efficiency we could maintain the capacity ourselves, and size the StringBuilder
    appropriately for the task at hand, rather than have the StringBuilder resize
    on the fly with each method.


    StringBuilder has other methods that we haven''t covered here, this has been an
    overview of the main StringBuilder functionality that you will use often.


    I find that I use StringBuilder for String construction, so mainly the append
    and insert methods. I rarely use the replace, and sub string methods, preferring
    to replace and work with substrings directly with the String class.


    You will develop your own style, and work with the classes that make most logical
    sense to you.


    For full documentation, all the methods, see the link in the References or use
    code completion in your IDE. Remember in IntelliJ pressing ctrl + q (on Windows)
    or ctrl + j (on Mac) the code completion pop-up shows the JavaDoc documentation
    for the method.


    # Concatenation, .format, Or StringBuilder


    How do you choose the right way to build Strings?


    We have seen many different ways to construct Strings:


    +   - simple concatenation either with + concat

    - simple templates using String.format

    - StringBuilder flexibility with inserts, appends and deletes


    So which is best?


    Well, I use them all.


    For simple string building I use concatenation.


    I use formats when I have too many concatenations and the code become hard to
    read and maintain, or when I want to reuse the format string in multiple places.
    I try to remember use String.format more, even when I have a small set of concatenations,
    but sometimes I get lazy and concatenate Strings together.'
