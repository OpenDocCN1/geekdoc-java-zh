  md: 'Map has some methods in common with Collection:


    +   * size

    * clear

    * isNotEmpty


    Which means you already know what those methods do.


    And some methods that have a very similar counterpart: containsKey and containsValue
    are similar to the Collection method contains.


    +   * put(k, v) to add "key, value" pairs to the map

    * remove(k) to remove the element with that key

    * entrySet(v) to return a Set of all elements as Map.Entry objects

    * get(k) to retrieve the element based on the key

    * containsKey(k) returns true if the key is in the Map

    * containsValue(v) returns true if the value is in Map

    * values returns a Collection of all the values

    * keySet returns a Set of all the keys

    * putAll(m) adds a Map (m) to the Map object


    I intend to use HashMap as my default implementation. And below you can see examples
    of the declaration and initialization code:


    ```

    Map<String, User> map = new HashMap<>();

    Map<String, User> mapb = new HashMap<>();

    Map<String, User> mapc = new <String, HashMap>();

    ```


    In the above code you can see that a Map is declared with two values Map<Key,
    Value> so in the above code I declare the Map variables as having a String key,
    and a User value. I would use the Map to store User objects.


    put(k,v)


    Add "key, value" pairs to a Map with the put method.


