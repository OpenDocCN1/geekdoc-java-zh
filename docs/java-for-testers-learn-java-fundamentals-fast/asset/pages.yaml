  md: '# Chapter Thirteen - More About Exceptions


    Chapter Summary

    In this chapter you will learn more about exceptions:

    * Unchecked Exception

    * Checked Exception

    * The Exception Inheritance hierarchy

    * How to create your own Exception


    After this chapter you will be able to use code that other people have written
    which throw exceptions and create your own exceptions to add into your own abstraction
    layers.


    # Unchecked and Checked Exceptions


    All the examples you have seen so far in the book have been unchecked exceptions.


    +   * An Unchecked exception is one that can be thrown, by a method, without having
    to declare that the exception will be thrown.

    * A checked exception, has to be declared, and generally represents a particular
    use case, while ‘exceptional’ still has to be explicitly handled, or deliberately
    ignored by the calling code.


    # Unchecked Exceptions


    Unchecked exceptions can bite without knowing they will occur. You saw an example
    of this in the earlier chapters with the NullPointerException.


    An Unchecked Exception is also known as a Runtime Exception, as you are only made
    aware of them at run time.


    If you want to create an Unchecked exception you extend RuntimeException or any
    of the classes which already extend it.


    e.g.


    +   * IllegalArgumentException

    * ArithmeticException

    * NoSuchElementException

    * etc.


    I don''t think I have ever created a custom exception that extended an Unchecked
    exception. Generally when I create custom exceptions I want people to be aware
    of and handle them in their code.'
