  md: "# Chapter Nine - Arrays and For Loop Iteration\n\nChapter Summary\nIn this\
    \ chapter you will learn, a simple way of collecting things, accessing them, and\
    \ looping over them using: \n\n* Arrays - a fixed size collection of 'things'\n\
    * Array indexing - access individual items in an array\n* For Each Loop - iterate\
    \ over each item in the array\n* For Loop - iterate through a loop using indices\n\
    * Arrays of Arrays - Arrays can contain other arrays\n* Ragged Arrays - An array\
    \ of arrays with different sizes\n* java.util.Arrays - A utility class for working\
    \ with e.g. fill, sort, copy\n\nIn previous chapters you have seen how to create\
    \ individual variables to store objects strings.\n\nIf you wanted to create a\
    \ collection of Domain Objects at the moment, then you would create an individual\
    \ variable for each one: user1, user2, user3, etc.\n\nIdeally, we want some sort\
    \ of object that collects all these together for us and allows us access each\
    \ item individually. We also want to loop through them to process each in different\
    \ ways.\n\nArrays, provide us with a simple way of doing exactly this.\n\n# Arrays\n\
    \nArrays are the first collection data type we are going to learn.\n\nAn array\
    \ represents a collection of items, all of the same type.\n\nArrays are fixed\
    \ size. In future chapters we will learn about collections that can adjust their\
    \ size as we add more items. But, because arrays are a fixed size, we simple them\
    \ to understand.\n\nA quick example:\n\n```\n@Test\npublic void simpleArrayExample(){\n\
    \  String[] numbers0123 = {\"zero\", \"one\", \"two\", \"three\"};\n\n  for(String\
    \ numberText : numbers0123){\n    System.out.println(numberText);\n  }\n\n  assertEquals(\"\
    zero\", numbers0123[0]);\n  assertEquals(\"three\", numbers0123[3]);\n}\n```\n\
    \nThe above code:"
