    \ The opening brace { delim the start of a block, and the closing brace } delim\
    \ the end of a block.\n\nAll the code that we write for a class has to go between\
    \ the opening and closing block that represents the class body.\n\nIn this case\
    \ the class body is empty, because we haven't written any code yet, but we still\
