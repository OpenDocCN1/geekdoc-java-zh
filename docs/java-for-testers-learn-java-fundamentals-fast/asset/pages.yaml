  md: "# static importing\n\nThe main way you have seen JUnit assertions used so far\
    \ is by statically importing the method from JUnit:\n\nimport static org.junit.Assert.assertEquals;\n\
    \nSo that in the @Test method code we can write the assertion directly:\n\n```\n\
    @Test\npublic void addTwoPlusTwo(){\n    int answer = 2+2;\n    assertEquals(\"\
    2+2=4\", 4, answer);\n}\n```\n\nAnother style of using JUnit assertions that you\
    \ might see, or choose to adopt:\n\n```\nAssert.assertEquals(\"2+2=4\", 4, answer);\n\
    ```\n\nIn the usage I have imported the Assert class rather than a single method.\n\
    \nimport org.junit.Assert;\n\nIn the context of the @Test method it would look\
    \ like:\n\n```\n@Test\npublic void addTwoPlusTwo(){\n    int answer = 2+2;\n \
    \   assertEquals(\"2+2=4\", 4, answer);\n}\n```\n\nYour preference may vary.\n\
    \nI think the first approach without the Assert. prefix is often more readable.\
    \ But by using the Assert. prefix often aids me when coding because I can see\
    \ the full range of assertions available to me when I use IDE code completion.\n\
    \n# Summary\n\nJUnit offers multiple assertion methods. Try to use the range available\
    \ to make your assertions expressive, although it is often possible to write all\
    \ of your assertions as assertTrue and assertFalse. This means people reading\
    \ your code to parse the entire assertion condition, rather than use the assert\
    \ method itself to help them understand your intent.\n\nWe can stick with those\
    \ assertions offered by default JUnit, or we can choose to use those provided\
    \ by the Hamcrest imports via the assertThat assertion.\n\nHamcrest offers more\
    \ matchers than those listed in this chapter, so once you are familiar with the\
    \ use of assertThat in your code, read through the Hamcrest website and experiment\
    \ with the additional features in Hamcrest.\n\nIdeally we would write code which\
    \ does more than simply assert. It should also make the intent behind those assertions\
    \ easy to read and understand from the code. And we can do this by using a combination\
    \ of assertion and matcher methods."
