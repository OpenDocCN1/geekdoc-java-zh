  md: "# # Appendix - IntelliJ Hints and Tips\n\nThroughout the book I mentioned hints\
    \ and tips, and shortcuts for using IntelliJ. I collate all of those in this appendix\
    \ for easy reference, and add some additional information on IntelliJ with this\
    \ book.\n\n# ## Shortcut Keys\n\nThis table contains the shortcut keys that I\
    \ use most often.\n\n| Function | Windows | Mac |\n|---|---|---|n| Create New\
    \ | alt + insert | ctrl + n |\n| Intention | alt + enter | alt + enter |\n| Actions\
    \ | alt + return | alt + return |\n| Run Unit Test | ctrl + shift + F10 | ctrl\
    \ + shift + F10 |\n| Show Parameters | ctrl + p | cmd + p |\n| Show Java | ctrl\
    \ + q | ctrl + j |\n| Code Completion | ctrl + space | ctrl + space |\n| Find\
    \ by class | ctrl + n | ctrl + n |\n| Find by filename | ctrl + shift + n | ctrl\
    \ + shift + n |\n| Find by symbol | ctrl + shift + alt + n | ctrl + shift + alt\
    \ + n |\n\nJetBrains IntelliJ has supporting documentation on our website:\n\n\
    +   * Reference pdf for Windows and Linux\n  * jetbrains.com/idea/docs/IntelliJIDEA_ReferenceCard.pdf\n\
    * Reference pdf for Mac OS X\n  * jetbrains.com/idea/docs/IntelliJIDEA_ReferenceCard_Mac.pdf\n\
    \nAnd the help files have “Keyboard shortcuts you cannot miss”\n\n+   * jetbrains.com/idea/help/keyboard-shortcuts-you-cannot-miss.html\n\
    \n# ## Code Completion\n\nCode completion is your friend. You can use it to explore\
    \ APIs and Libraries. All you do is start typing and the after . you will see\
    \ specific items you can use."
