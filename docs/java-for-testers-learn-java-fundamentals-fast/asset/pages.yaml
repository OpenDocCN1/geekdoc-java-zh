- pgno: 249
  md: "But the User class has no control over its data. Later we add checks on the\
    \ setter and getter methods so that we can add invalid data to the object. If\
    \ you makes the fields public then you don't have those safeguards.\n\n```\n@Test\n\
    public void canConstructWithUsernameAndPassword() {\n    User user = new User();\n\
    \    user.username = \"bob\";\n    assertEquals(\"not default username\", \"bob\"\
    ,\n    user.username);\n}\n\n```\n\n```\n@Test\npublic void setNameToInvalidValue()\
    \ {\n    User user = new User();\n    user.username = \"12345$%%\";\n    assertEquals(\"\
    invalid username\", \"12345$%%%\",\n    user.username);\n}\n\n```\n\n# Experiment\
    \ with the field and parameter names\n\nWhen you remove this, from the *constructor*:\n\
    \n```\npublic User(String username, String password) {\n    username = username;\n\
    \    password = password;\n}\n```\n\nWhen Java sees the line:\n\n```\nusername\
    \ = username;\n```\n\nIt executes it, but assigns the value passed in the *parameter*\
    \ to the *parameter*, and not to the *field*, our *field* called username is never\
    \ assigned a value and is null, as reported by the assertion message:\n\njava.lang.AssertionError:\
    \ given username expected expected:<admin> but was: <null>\n\nWhen we rename the\
    \ parameters:\n\n```\npublic User(String a, String aPassword) {\n    username\
    \ = aUsername;\n    password = aPassword;\n}\n```\n\nThen we do not need this\
    \ keyword. The *parameters* and *fields* have different names, so they will not\
    \ clash.\n\nIt is up to which style you choose to adapt for your coding.\n\nI\
    \ use both and switch between them at different times. By naming the *parameter*\
    \ the same as the *field*, and using this keyword to بمعنى them, when I use code\
    \ completion in the constructor, the code completion shows me username and password\
    \ making it easy for me to see what the *parameters* refer to. This code completion\
    \ use case is the main"
