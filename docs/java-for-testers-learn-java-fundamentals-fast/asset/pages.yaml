  md: 'We will learn how to control the output of a Date in the next section.


    We can also instantiate a Date with a long, in order to set the Date to a specific
    time.


    For example, I could create a Date 7 days in the future from one Date by manipulating
    the long that I instantiate with the Date:


    ```

    long oneWeekFromNowTime = date.getTime();

    oneWeekFromNowTime = oneWeekFromNowTime + (1000 * 60 * 60 * 7);

    Date oneWeekFromNow = new Date(oneWeekFromNowTime);

    System.out.println(oneWeekFromNowTime.toString());

    ```


    In the above code I take the time from one Date then add 7 days worth of milliseconds
    to the long value, and instantiate a new Date from milliseconds value. Resulting
    in the following output:


    +   - Thu Jun 27 12:18:04 BST 2013


    We use the setTime to set the time value of a date after constructing it, so I
    can create a duplicate time by using the constructor or the setTime method:


    ```

    Date sameDate = new Date();

    sameDate.setTime(date.getTime());

    assertThat(date.equals(sameDate), is(true));

    assertThat(date.compareTo(sameDate), is(0));

    ```


    # # SimpleDateFormat


    SimpleDateFormat allows us to output the value of a Date object as a String, in
    a format that we choose.


    ```

    SimpleDateFormat sdf = new SimpleDateFormat();

    ```


    So if I instantiate a Date to the 1st of January 1970:


    ```

    SimpleDateFormat sdf = new SimpleDateFormat();

    ```


    Then the following table shows example patterns and the associated generated output,


    | Pattern | Output |

    |---|---|

    | "MM/dd/yyyy" | "01/01/1970" |

    | "MMM/dd/yyyy" | "Jan/01/1970" |

    | "MMMM/d/yyyy" | "January/1/1970" |


    I can use the applyPattern method to set the pattern for a SimpleDateFormat and
    use the pattern on the date with the format method.


    ```

    sdf.applyPattern("MM/dd/yyyy");

    assertThat(sdf.format(date), is("01/01/1970"));

    ```


    +   - applyPattern - set the pattern that the next format will use

    - format - set the given date with the defined pattern


    I also instantiate SimpleDateFormat with the pattern that I want to use e.g. "year"
    month day 24hour:minutes:seconds.milliseconds" shown below'
