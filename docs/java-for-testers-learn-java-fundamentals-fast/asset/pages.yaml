- pgno: 244
  md: '# Help Menu


    The help menu does more than offer a link to a help file.


    # Find Action


    The menu option Help \ Find Action allows you to type an action and IntelliJ will
    provide menu options and short cut keys to help.

    e.g.


    +   * Select Help \ Find Action

    * type "unit" and you will see a list of ‘settings’ you can use to help configure
    JUnit in IntelliJ

    * type "run" and you will see a list of options for running code, or tests


    The list isn''t just for information, you can click on the items in the list and
    you will be taken to the functionality in IntelliJ or run the command.


    # Productivity Guide


    The Help \ Productivity Guide menu option shows a dialog with common productivity
    improvements.


    You can click on the items in the list to see what it does, and you can also see
    which ones you have used, and which you haven''t.


    This can help you learn the basics of IntelliJ very quickly.


    # Summary


    IntelliJ offers a lot of flexibility in how we work with code. Over time you will
    learn to make your work with Java faster as you learn more about the IDE.


    Over time I will add videos and information to JavaForTesters.com to demonstrate
    functionality with IntelliJ that I do not have space to add to this book.'
  merge: -1
  img_proc: true
