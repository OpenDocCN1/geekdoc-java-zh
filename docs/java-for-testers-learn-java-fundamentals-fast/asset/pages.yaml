    \ this case the variable is a String called workday\n    - the collection is the\
    \ array workdays\n- the code iterates through the loop, and each item in the array\
    \ is assigned to the variable workday\n- so the first time through the loop the\
    \ variable workday is assigned the [0] indexed value from the array workdays which\
    \ is \"Monday\"\n- the second time through the loop the variable workday is assigned\
    \ the [1] indexed value from the array workdays which is \"Tuesday\", etc.\n-\
    \ the loop iterates every item in the array\n- the loop stops when there are no\
    \ more items in the array to iterate over\n\nThis looping construct means that\
    \ we can iterate every item in the array and not miss any. Thereby avoiding the\
    \ off by one errors that traditional boundary value analysis is so fond of trying\
    \ to detect.\n\n# Exercise: Iterate over the Array of Users\n\nUsing your array\
    \ of user objects created in the previous exercise.\nIterate the array and System.out.println(the\
    \ name of each user.\n\n# For loop\n\nThe for loop gives us more control over\
    \ the looping. We setup the initial variable we use for looping, then a condition\
    \ which decides if we end the for loop, then we have a statement which sets up\
    \ the next iteration of the loop.\n\n```\nfor ( variable ; loop_condition ; iterator\
    \ ) {\n    // do something\n}\n```\n\ne.g. the traditional use of a for loop\n\
    \n```\nString days=\"\";\nfor(int i=0; i<5; i++){\n    days = days + \"|\" + workdays[i];\n\
    }\nasertEquals(\"Monday|Tuesday|Wednesday|Thursday|Friday\", days);\n```"
