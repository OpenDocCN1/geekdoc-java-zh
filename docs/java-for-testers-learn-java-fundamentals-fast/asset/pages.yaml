    \ declare a class before we use it. And when we do so, we are also defining the\
    \ rules about how other classes can use it too.\n\nHere the class has public scope.\
    \ This means that any class, in any package, can use this class if they import\
    \ it.\n\n# Java has more scope declarations\n\n> Java has other scope declarations,\
    \ like private and protected but we don't have to concern ourselves with those\
