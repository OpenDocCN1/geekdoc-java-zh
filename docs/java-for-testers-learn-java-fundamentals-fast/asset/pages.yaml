- pgno: 53
  md: 'One thing to point out, now that we have examples, is the difference between
    ''Static Usage'' and ''Static Import''.


    You can see examples of both in the TestEnvironmentTest code.


    # Static Usage


    We use the static constants from TestAppEnv. So we import the TestAppEnv class:


    ```

    import com.javafortesters.domainobject.TestAppEnv;

    ```


    And every time we use the static constants DOMAIN or PORT, we prefix them with
    the class that they are, i.e. TestAppEnv, as shown in the code below:


    ```

    TestAppEnv.DOMAIN;

    ```


    # Static Import


    We statically import the assertEquals from JUnit.


    ```

    import static org.junit.Assert.assertEquals;

    ```


    This means we can type assertEquals in our code without having to prefix it with
    Assert in the same way that we do for the DOMAIN and PORT constants from TestAppEnv
    e.g.,


    ```

    assertEquals("Returns Hard Coded URL",

    "http://192.123.0:67",

    TestAppEnv.getUrl());

    ```


    # The only difference is the import


    Both the assertEquals method, and the constants DOMAIN and PORT, are declared
    as static and public, in their respective classes.


    The only difference in our JUnit test code, is how we imported them.


    Had imported the JUnit assert in a non-static manner i.e. the same way I imported
    TestAppEnv:


    ```

    import org.junit.Assert;

    ```


    Then I would not be able to write assertEquals in my code, I would have to prefix
    it with Assert e.g.


    ```

    assertEquals("Returns Hard Coded URL",

    "http://192.123.0:67",

    TestAppEnv.getUrl());

    ```


    Similarly, I have imported the TestAppEnv constants DOMAIN and PORT statically,
    and then avoided the prefix TestAppEnv on each usage.


    I could import static the DOMAIN and PORT as separate imports, or just import
    everything from TestAppEnv, and then I wouldn''t have to prefix calls to getUrl
    e.g.


    ```

    import static com.javafortesters.domainobject.TestAppEnv;

    ```'
