  md: "Now we have a working @Test method, we can start to refactor the object and\
    \ make it more suitable for our needs.\n\nImmediately though, if we used the String\
    \ \"http://192.123.0:67\" anywhere in our code, we could replace it with TestAppEnv.getUrl()\
    \ and gain the benefits of abstraction and maintenance.\n\nI'm going to add a\
    \ few more requirements so that we can learn a little more Java and amend our\
    \ class.\n\nSometimes in our automation code we don't always want to get the full\
    \ URL, sometimes we want, just the Domain or just the Port.\n\nMy initial idea\
    \ is that we want to be able to do the following:\n\n```\n@Test\npublic void getDomainAndPortStatically(){\n\
    \    assertEquals(\"Just the Domain\",\n               \"192.123.0.3\",\n    \
    \           TestAppEnv.DOMAIN);\n\n    assertEquals(\"Just the port\",\n     \
    \          \"67\",\n               TestAppEnv.PORT);\n}\n```\n\nNotice, again,\
    \ I'm thinking through the usage and the code with an @Test method. By writing\
    \ the code I want to see, I can experiment with different concepts before actually\
    \ writing any implementation code to make the @Test method pass.\n\nAll we have\
    \ to do now is implement the new Constant Fields DOMAIN and PORT.\n\nType in the\
    \ @Test method code, and use IntelliJ Quick fix function to create these Constant\
    \ Fields.\n\n# Fields\n\nA field is a Java variable that is at the class level\
    \ rather than local to a method.\nConstant means that it won't change once a value\
    \ has been assigned.\nFields are located within the class code block. And, by\
    \ convention, before any others.\n\nYou should end up with code like in your TestAppEnv\
    \ object.\n\n```\npublic static final String DOMAIN = \"192.123.0.3\";\npublic\
    \ static final String PORT = \"67\";\n```\n\n+   - the field can be accessed by\
    \ any code that imports the TestAppEnv class\n* static - TestAppEnv does not need\
    \ to be instantiated with new before usage\n* final - the variable can not change\
    \ once a value has been assigned\n* String - declares the variable as a String\
    \ object\n* DOMAIN, PORT - by convention constants are written in uppercase, with\
    \ multiple words delimited by _ underscore"
