    # JUnit Assertions


    JUnit has its assertions built in:


    ```

    import static org.junit.Assert.*;

    ```


    JUnit assertions mostly take the form of a method name, with a parameter for the
    expected result and then a parameter for the actual result, some only an actual
    value as the expected is in the name of the assert e.g. assertNull


    ```

    assertEquals(6, 3 + 3);

    ```


    With JUnit assertions you can add an optional message to describe the assertion:


    ```

    assertEquals("3 + 3 = 6", 6, 3 + 3);

    ```


    If the assertion fails then the message is written as part of the message to make
    it easier to identify the e.g.


    ```

    java.lang.AssertionError: 3 + 3 = 6 expected:<7> but:<6>

    ```


    JUnit provides the following assertions:


    +   - assertEquals - check expected and actual are equal

    - assertFalse - check actual is false

    - assertTrue - check actual is true

    - assertEquals - check expected and actual arrays are equal

    - assertNull - check actual is not null

    - assertNotSame - check expected and actual are different

    - assertNull - check actual is null

    - assertSame - check expected and actual are the same


    If I use JUnit asserts in my automation code, I mainly use assertEquals, assertFalse
    and assertTrue.


    > Exercise: Create an @Test method which uses all of the asserts


    Experiment with the JUnit asserts by creating an @Test annotated method which
    passes, with all of the above asserts in it.


    JUnit also provides an assertThat assertion for use with matchers.


    # Asserting with Hamcrest Matchers and assertThat


    You can use the assertThat method in conjunction with matchers, e.g. from Hamcrest,
    to make your code more readable.'
