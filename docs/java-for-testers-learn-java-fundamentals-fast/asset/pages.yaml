    \ you can use two imports. A static import for the assertEquals method and an\
    \ import for the Assert class.\n\nWhen we use the static import of assertEquals,\
    \ I can use the assertEquals method directly in my code e.g.\n\n```\nassertEquals(6,3+3);\n\
    ```\n\nWhen I do not use the static import, I have to access the static method\
    \ from the class itself e.g.\n\n```\nAssert.assertEquals(5,3+2);\n```\n\n# Data\
    \ Types\n\nEvery variable in Java must have a type declared, either as a *primitive*,\
    \ or an *object* class.\n\n# Boolean Type\n\nA boolean has two constants true\
    \ and false.\n\nThere is also an associated Boolean object.\n\n```\n@Test\npublic\
    \ void BooleanType(){\n    boolean truthy = true;\n    boolean false = false;\n\
    \n    assertTrue(truthy);\n    assertFalse(false);\n\n    truthy = Boolean.TRUE;\n\
    \    false = Boolean.FALSE;\n\n    assertTrue(truthy);\n    assertFalse(false);\n\
    }\n```\n\n# Integer Types\n\n+   * byte range: -128 to 127\n* short range: -32768\
    \ to 32767\n* int range: -2147483648 to 2147483647\n* long range: -9223372036854775808\
    \ to 9223372036854775807"
