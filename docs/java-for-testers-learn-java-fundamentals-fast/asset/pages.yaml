    # Use copyOfRange to copy a subset of an Array


    The copyOfRange copies a subset of an array into a new array of the size of the
    subset.

    Assert.copyOfOfRange(arrayToCopy, startIndex, endIndex);


    The startIndex is the first item in the array that you want to copy.

    The endIndex is the index + 1 that you want to copy.


    e.g. if I want to copy items 3 to 5 inclusive ("Wednesday", "Thursday", "Friday"),
    then I

    would start the copy from 2 (the index of the third item), and end the copy on
    5 (even

    though the index of the fifth is 4).


    Example code might:


    ```

    String[] weekDays = Arrays.copyOfRange(workdays, 2, 5);

    ```


    ```

    assertEquals(3, weekDays.length);

    assertEquals("Wednesday", weekDays[0]);

    assertEquals("Thursday", weekDays[1]);

    assertEquals("Friday", weekDays[2]);

    ```


    ```

    assertEquals(weekDays[0], workdays[2]);

    assertEquals(weekDays[1], workdays[3]);

    assertEquals(weekDays[2], workdays[4]);

    ```


    We can also use copyOfRange to increase the size of the array, much like we would
    do with

    copyOf. To do this we use an endIndex greater than the array size. e.g.


    ```

    String[] weekDays = Arrays.copyOfRange(workdays, 2, 7);

    ```


    ```

    assertEquals(5, weekDays.length);

    assertEquals("Wednesday", weekDays[0]);

    assertEquals("Thursday", weekDays[1]);

    assertEquals("Friday", weekDays[2]);

    assertEquals(null, weekDays[3]);

    assertEquals(null, weekDays[4]);

    ```


