  md: 'We could implement the above conditions using the indexOf operator and loop
    over digits or upper case letters and find them in the String. But that would
    be the hard way, it would require a complicated loop and could lead to buggy code.


    Or, we could build a regular expression that only matches each of those conditions
    is correct.


    For example, I can write a regular expression of matching a String and check that
    it includes a digit ".*[0123456789].*".


    At a high level the above regular expression means:


    +   * - match 0 or more characters

    * [0123456789]+ - until we find 1 or more of the following characters “0123456789"

    * .* - which can be followed by 0 or more characters


    To detail it further:


    +   * matches any single character

    * - matches 0 or more of the preceding element

    * [] - matches any single character contained in the brackets

    * + - matches 1 or more of the preceding element


    I can use it in my Java code as follows:


    ```

    String mustIncludeDigit = ".*[0123456789].*";

    ```


    I assigned the regular expression into a variable for re-use.


    I call the methods on a String and find in the regular expression as a parameter,
    and if the regular expression matches the String it matches true.


    If the match fails then false is returned.


    ```

    assertThat("123456789").matches(mustIncludeDigit), is(true));

    assertThat("invalid").matches(mustIncludeDigit), is(true));

    ```


    I can write a similar regular expression to match uppercase letters:


    ```

    String mustIncludeUppercase = "[A-Z].*";

    ```


    I used one additional condition to build the regular expression:


    +   * A-Z in [A-Z] - matches any character between A-Z, a-z so I could do a


    ```

    assertThat("Valid").matches(mustIncludeUppercase), is(true));

    assertThat("valid").matches(mustIncludeUppercase), is(true));

    ```


    # Exercise: Regular Expressions for user set


    Add the regular expression to the setPassword method on User so that an IllegalPassword
    exception is thrown if the password does not contain a digit, or does not contain
    an upper letter.'
