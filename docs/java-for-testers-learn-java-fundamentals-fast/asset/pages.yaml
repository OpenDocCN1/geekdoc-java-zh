- pgno: 68
  md: 'Because the class is public, it can be used by another class, so long as they
    import it, or if they are if I didn''t add the public then the class would have
    package scope and is only available to other classes in the same package.


    # Static methods and fields


    A class can expose static methods and fields, which allow you to use them without
    instantiating a new instance object of the class.


    You have seen this when using any of the asserts in JUnit, these are all static
    methods in the Assert class.


    # Instantiating Classes


    Most classes need to be instantiated before they can be used.


    ```

    ClassExample instance = new ClassExample("bob");

    ```


    When we instantiate a class, we use the new keyword, and call one of the class''s
    constructors.


    # Field and Method Scope


    The scope of a field or method is defined by public, protected, private or package-private
    (no modifier).


    +   - public accessible to any class that imports the parent class

    - protected accessible to any class in the same package, or any subclass

    - private accessible to the methods in the class

    - package-private - when no modifier is used then the field or method is accessible
    to the class and any class in the same package (this is the default)


    Additional field and method modifiers:


    +   - static - the field or method exists at the class level, the instance level,
    so is shared by all instances and can be accessed without needing to have an instantiated
    class variable.


    # Fields & Variables


    Fields are variables that are accessible by any method in the class and, depending
    on the scope, possibly to other classes.


    Field typically refers to variables declared at the class level and local variable
    refers to variables created in a method.


    Additional field modifiers are:


    +   - final - once the field has a value it cannot be changed


    Examples of combinations and nuances of scope and modifiers are explained below.


    # Naming'
  merge: -1
