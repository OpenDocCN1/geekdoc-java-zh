  md: "# # Chapter Sixteen - Random Data\n\n# Chapter Summary\n\nIn this chapter you\
    \ will learn how to use Java's Random functionality to create Random Data:\n\n\
    +   - Math.random - easy to use static random generator to generate a random double\
    \ between 0.0 and 1.0\n- java.util.random - the main Java random package:\n  -\
    \ nextBoolean - return either true or false\n  - nextLong - return a random value\n\
    \  - nextInt - random within the range of all Integer values\n  - nextInt(int\
    \ bound) - random greater than or equal to bound and less than\n  - nextDouble\
    \ - distribution where each value between 0.0 and 1.0 has equal chance of being\n\
    \  - nextGaussian - a Gaussian distribution with a mean of 0.0 and a standard\
    \ deviation of 1.0, meaning about 70% values hovering around the 0.0 mark (+ or\
    \ -1.0)\n  - nextFloat - random float greater than or equal to 0.0 and less than\
    \ 1.0\n  - nextBytes - fill a given byte[] with random bytes\n seeding random\
    \ number generation with new Random(seed)\n- Generating random strings\n\nRandom\
    \ data in automation is a contentious subject. Some people argue that automation\
    \ should be completely deterministic and always run the same way - implying that\
    \ we always use the same data. I prefer to vary data that is not important to\
    \ the conditions checked, i.e. data that should be part of an equivalence class.\
    \ By doing this we increase the data coverage of the automation, and increase\
    \ the possibility that the automated check will reveal a bug.\n\nJava has a very\
    \ simple set of random methods and classes.\n\n+   - java.util.random\n- Math.random()\n\
    \nJava, as part of the Security packages has a SecureRandom class, which exposes\
    \ the same methods as we discuss in this chapter. I do not cover SecureRandom\
    \ in this book because:\n\n+   - I have never used it in production automation\
    \ code,\n- It is slightly slower to instantiate,\n- It is slightly harder to use\
    \ well.\n\nMost of the randomness you need in your automation code you can achieve\
    \ with:\n\n+   - java.util.random\n\n# Math.random\n\nThe static random method\
    \ on Math provides a 'pseudo random' number."
