    # Calculate the sum


    To actually calculate the sum 2+2 I will need to create a variable, then I can
    store the result

    of the calculation in the variable.


    ```

    int answer = 2+2;

    ```


    Variables are a symbol which represent some other value. In programming, we use
    them to

    store values: strings, integers, etc so that we can use them and amend them during
    the

    program code.


    I will create a variable called answer.


    I will make the variable an ''int'' declares the type of variable. int is short
    for integer

    d and is a primitive type, so it doesn''t have a lot of functionality other than
    storing an integer

    value for us. Int is not a class so it doesn''t have any methods.


    The symbol 2 in the code is called a numeric literal, or an integer literal.


    ![](img/3571bcaadac59e6bb801bc317a52cb1e_31_1.png)


    # An int has limits


    An int can store values from -2,147,483,648 to 2,147,483,647. e.g.


    ```

    int minimumInt = -2147483648;

    int maximumInt = 2147483647;

    ```


    When I create the variable I will set it to 2+2.'
