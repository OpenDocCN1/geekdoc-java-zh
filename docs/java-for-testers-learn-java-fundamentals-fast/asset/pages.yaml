  md: "# Setting System Properties\n\nYou can set system properties, the same as you\
    \ can with a normal Properties object using the `setProperty` command.\n\nI frequently\
    \ do this if I want to control some environmental configuration from within my\
    \ running code.\n\nAs an example, when using WebDriver and working with Chrome,\
    \ I have to set a System property, so that the Chrome driver knows where to find\
    \ the ChromeDriver.exe that it uses to control the Chrome browser.\n\n+   - webdriver.chrome.driver\n\
    \nI generally don't add ChromeDriver.exe into version control and have a convention\
    \ that it is located in a relative directory to my working directory. I set the\
    \ property relative to my working directory.\n\nSince this is a property that\
    \ might have been set already before I overwrite it. I intend to check if it has\
    \ been set outside the running application before I overwrite it. Leading to code\
    \ like the following:\n\n```\nif(System.getProperties().containsKey(\"webdriver.chrome.driver\"\
    )) {\n    String currentDir = System.getProperty(\"user.dir\");\n    String ChromeDriverLocation\
    \ = currentDir + \"/../tools/chromedriver/chromedriver.exe\";\n    System.setProperty(\"\
    webdriver.chrome.driver\", ChromeDriverLocation);\n}\n```\n\nIn the above code\
    \ I first check if the property is set, if it is then I don't overwrite it. If\
    \ I use the `user.dir` and set the path relative to that working directory.\n\n\
    # Working with Property files\n\nIn this section we are going to look at the methods\
    \ on the Properties Object associated loading and saving files.\n\n# Save\n\n\
    Properties has a save method, but this is deprecated because it does not throw\
    \ IOException.\n\n> Deprecated\nDeprecated that the method should not be used,\
    \ and that method may be removed in future versions of Java. The method will work,\
    \ but your code may fail in the future when you update the Java library or SDK\
    \ you are using.\n\nInstead we use the store method, which writes the file to\
    \ a Writer or OutputStream. Because I will create a file that I'm only using as\
    \ part of the @Test method execution, I'm going to create it as a temporary file."
