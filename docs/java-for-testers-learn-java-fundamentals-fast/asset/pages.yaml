- pgno: 59
  md: "```\nprivate String username;\nprivate String password;\n\npublic User(){\n\
    \    username = \"username\";\n    password = \"password\";\n}\n```\n\nIn this\
    \ snippet, you can see that I created a String variable username and a String\
    \ password. Because these variables are declared in the body of the class, rather\
    \ than in a method, they are known as fields or field variables.\n\nI have declared\
    \ them private so that they are only accessible to methods in the User class itself,\
    \ and not from any classes that import the User class.\n\nThe constructor I have\
    \ written takes no arguments. You know it is a constructor because it does not\
    \ have a return type in the declaration and the name is exactly the same as that\
    \ of the class, complete with uppercase letter.\n\nI assign default values to\
    \ the username and password in the body of the constructor. Any method in a class\
    \ can amend, and access, the field variables declared in that class.\n\nI can\
    \ then write the methods that return the username and password, so that the @Test\
    \ method can pass.\n\n```\npublic String getUsername() {\n    return username;\n\
    }\n\npublic String getPassword() {\n    return password;\n}\n```\n\nThe code should\
    \ pass now. Write the code, and run the @Test method to see this for yourself.\n\
    \nA few notes on the User class\n\nThe getusername and getPassword methods are\
    \ known as accessor or getter methods because they allow us to 'access', or 'get'\
    \ the value of a field. They take no parameters, and return the values of the\
    \ field variables.\n\nThe combination of the field username, and the getter method\
    \ getUsername, is sometimes known as a 'property'.\n\nBecause we declared the\
    \ field variables as private, we need to create methods which allow other classes\
    \ to access the values of those variables.\n\nI could have made the field variables\
    \ public, and then I would not have needed to create an accessor method, but then\
    \ I reduce the amount of control that we have over the values because other classes\
    \ could amend the values of those fields at any point."
