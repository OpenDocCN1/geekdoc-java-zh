- pgno: 232
  md: "These constants can also have methods making them very flexible, and might\
    \ even remove the need to put them in a switch statement, and instead use the\
    \ enum's method itself.\n\n# Research Links:\n\n+   - Official Enum Documentation\n\
    \  - docs.oracle.com/javase/tutorial/javaOO/enum.html\n\n# Regular Expressions\n\
    \nWe briefly touched upon regular expressions in the main text.\n\nRegular Expressions\
    \ provide a massive amount of power and flexibility for parsing and processing\
    \ input.\n\nWhen your code starts to look complicated, and you have a series of\
    \ nested if statements, or complicated transformations. Then it might be to graduate\
    \ to the use of Regular Expressions.\n\n# Research Links:\n\n+   - docs.oracle.com/javase/tutorial/essential/regex/\n\
    \n# Reflection\n\nMost of our programming work uses specific objects, and we know\
    \ the methods and interfaces available at the time of coding.\n\nReflection means\
    \ querying the class at runtime to find information about the object, e.g. finding\
    \ out which methods are on the object, what are their parameters, what annotations\
    \ exist etc.\n\nYou can also add the method signatures to allow you to call private\
    \ methods, or access private variables etc.\n\nMost programmers I know spurn reflection.\
    \ And indeed most of the time in an application it's used, it can be slow, and\
    \ it can be dangerous to perform these actions at Runtime.\n\nSome of the problems\
    \ I've faced in the past however, could only be solved using reflection:\n\n+\
    \   - Trying to use libraries without documentation\n- Using pieces of functionality\
    \ out of sequence\n- Working around limitations in abstraction layers\n\nSome\
    \ of the tools we use e.g. JUnit, can only work because of reflection, and all\
    \ the annotations you added to your code are accessed via reflection.\n\nLearn\
    \ about reflection so that you know what it is capable of. Then you can try and\
    \ use it when you encounter a problem that you see no other way to solve.\n\n\
    # Research Links:"
