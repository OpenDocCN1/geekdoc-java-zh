  md: '# Declare an Empty Array


    You can declare an array of zero length, using the syntax presented below:


    ```

    int[] zeroLength = {};nint[] moreZeroLength = new int[];

    ```


    # Declare an Array for Later Initialization


    If you want to, you can declare an array and initialize it later. For example,
    this code declares an array but does not initialize it.


    ```

    int[] uninitializedArray;

    ```


    I prefer to initialize it at declaration, or initialize it as an empty array.


    If you want to allocate a new array to an existing array variable then you can
    use the syntax you saw in the declaration i.e.


    ```

    uninitializedArray = new int[10];

    ```


    Or you also use the following syntax, which creates an anonymous array and allocates
    it to an existing variable:


    ```

    uninitializedArray = new int[]{100, 200, 300};

    ```


    # Access items in an array


    You can access the items in an array by using the [i] notation, where i is the
    index you want.


    Arrays indexed starting at 0 the first item in an array is at [0].


    ```

    String[] weekdays = {"Monday", "Tuesday", "Wednesday",n"Thursday", "Friday"};


    assertEquals("Monday", weekdays[0]);

    assertEquals("Friday", weekdays[4]);

    ```


