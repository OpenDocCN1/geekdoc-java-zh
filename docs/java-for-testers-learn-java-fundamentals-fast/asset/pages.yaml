  md: "In the above code snippet, the catch blocks will handle either a NullPointerException\
    \ or an IllegalArgumentException.\n\n# JUnit and Exceptions\n\nJUnit has a handy\
    \ feature to allow us to check for thrown exceptions.\n\n```\n@Test(Expected =\
    \ NullPointerException.class)\n```\n\nWe can tell the @Test annotation to expect\
    \ an exception of a particular class to be thrown.\n\nThe above code tells JUnit\
    \ to expect to have an exception of type NullPointerException thrown during the\
    \ execution.\n\nIf no NullPointerException is thrown then the method will fail.\n\
    \nIf a NullPointerException is thrown then the method will pass.\n\nFor example,\
    \ the method passes reason because a NullPointerException is thrown:\n\n```\n\
    @Test(expected = NullPointerException.class)\npublic void nullPointerExceptionExpected(){\n\
    \    Integer age=null;\n    age.toString();\n}\n```\n\nBe careful with this parameter\
    \ as the exception could be thrown anywhere in the method and your code would\
    \ still pass, so when you use this parameter make sure that your code is as small\
    \ as possible to trigger the exception and you have other @Test methods which\
    \ ensure the setup code works. After all, if your setup code threw a NullPointerException\
    \ then the method would pass, but would not have checked what you wanted.\n\n\
    # Throwing an Exception\n\nWe are not limited to catching the exceptions from\
    \ code that other people have written. We can also throw exceptions when we need\
    \ to.\n\nAs an example of this I will revisit the abstraction layer we have for\
    \ users, where we can construct a user by passing the username and password.\n\
    \nI will intend so that the password is checked and the constructor will throw\
    \ an exception if the password is less than 7 characters in length.\n\nI'll re-use\
