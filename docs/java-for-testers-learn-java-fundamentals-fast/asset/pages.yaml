- pgno: 231
  md: "+   - Abstract Classes vs. Interfaces\n  - javaworld.com/javaqa/2001-04/03-qa-0420-abstract.html\n\
    \n# # Generics\n\nIn the main body of this book you saw Generics used when instantiating\
    \ Collections and we declared the type of objects that the collection would hold.\n\
    \nYou can use Generics when creating your own objects and methods, such that you\
    \ don't know exactly what object they will use.\n\nThis is a very powerful coding\
    \ style, to make your automation abstractions flexible, but one that I tend not\
    \ to have to use often.\n\n# # Research Links:\n\n+   - Official Java Tutorial\
    \ on Generics\n  - docs.oracle.com/javase/tutorial/java/generics\n\n# # Logging\n\
    \nWe didn't cover logging in this book. The closest we came was writing information\
    \ out to a File, and using System.out.println to the console.\n\nFor most of my\
    \ automation code I can get away with logging messages to System.out since they\
    \ will be displayed in continuous integration systems, and we rarely have to configure\
    \ the level of logging when running automation.\n\nJava logging allows you to\
    \ write code that outputs log messages e.g. warnings, errors, etc. The level of\
    \ logging output when running the code can be configured externally to the application\
    \ by the user running the application.\n\nWhen you need this level of flexibility,\
    \ it is time to learn about logging frameworks.\n\nJava has a built-in logging\
    \ framework. And a lot of external frameworks which increase the use of ease,\
    \ or flexibility of configuration.\n\n# # Research Links:\n\n+   - Official Java\
    \ Logging Overview\n  - docs.oracle.com/javase/7/docs/technotes/guides/logging/overview.html\n\
    - Tutorial by Lars Vogel\n  - vogella.com/articles/Logging/article.html\n\n# #\
    \ Enum\n\nAn enum can be thought of as a set of predefined constants. Useful when\
    \ organizing constants in your abstraction layers.\n\nAn enum can be used as the\
    \ argument in a switch statement. This can lead to readable and simple code."
