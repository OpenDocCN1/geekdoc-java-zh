  md: '# Using BigDecimal


    If you start working with BigDecimal then read the official documentation or using
    code completion in your IDE to see the additional range of methods offered. In
    this chapter we covered a small subset of BigDecimal methods to help you get started,
    and to help you understand the difference between BigDecimal and the earlier primitives
    double and float.


    BigDecimal supports different rounding methods which you can use in conjunction
    with the arithmetic operations. You can also provide a "scale" to work at different
    powers of ten. Java also offers a BigInteger object in the java.math package which
    works with greater than 64 bits. The normal operators and functions associated
    with an int or long, are accessible via methods on BigInteger.


    You can also convert from BigDecimal using floatValue, doubleValue, intValue,
    longValue etc. This is useful when you want to use some of the methods in the
    Math class after a series of calculations.


    # Math


    The java.lang.Math class provides a range of mathematical methods for working
    with float or double


    The official documentation lists the set of methods available so you can find
    the range easily enough on-line or in your IDE

    The methods on the class are all static, so are used without instantiating a Math
    object, and you will not need to import the Math package.


    e.g. to find the maximum of two values:


    ```

    assertThat(Math.max(23.0, 42.0), is(42.0));

    ```


    I''ve described a small set of methods I have found useful in the past below.

    nThe following methods operate on int, long, double or float:


    +   * max - compare two values and return the larger

    * min - compare two values and return the smaller

    * abs - return the absolute value

    * random - return a random number >= 0.0 and < 1.0


    You also have trigonometric functions: sin, cos, tan, asin, acos, atan, toDegrees,
    toRadians.


    I do not intend to cover all the methods in this book. I simply want to make you
    aware of the built in Math class. And now, when you start working with mathematical
    functionality in your tests, going beyond the typical arithmetic operations, you
    can examine the Math class in more detail to see if it has existing methods that
    meet your needs.


    # Summary


    This was a chapter introducing two important classes at a very high level:'
