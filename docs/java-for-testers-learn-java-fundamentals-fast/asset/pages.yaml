  md: "You should see a pop-up showing you all the forms constructor can take. In\
    \ the case of an Integer it can accept an int or a String.\n\nCheck that intValue\
    \ returns the correct int\n\nWe know that the Integer class has a method intValue\
    \ which returns an int, so we can create an assertion to check the returned value.\n\
    \nAfter the statement that instantiates the Integer.\n\nAdd a new statement that\
    \ asserts that intValue returns an int with the value 4.\n\n```\nassertEquals(\"\
    intValue returns 4\",\n    four.intValue());\n```\n\nWhen you run this method\
    \ it should pass.\n\n# Instantiate an Integer with a String\n\nWe saw that one\
    \ of the constructors for Integer can take a String, so lets write some code to\
    \ experiment with that.\n\n+   - Instantiate a new Integer variable, calling the\
    \ Integer constructor with the String \"5\"\n- Assert that intValue returns the\
    \ Integer 5\n\n```\nInteger five = new Integer(\"5\");\nassertEquals(\"intValue\
    \ returns 5\",\n    five.intValue());\n```\n\n# Quick Summary\n\nIt might not\
    \ seem like but we just covered some important things.\n\n+   - Did you notice\
    \ that you didn't have to import the Integer class?\n    - Because the Integer\
    \ class is built into the language, we can just use it. There are a few classes\
    \ like that, String is another one. The classes exist in a package structure,\
    \ they are in java.lang, but you don't have to import them to use them.\n- We\
    \ learned that to use an object of a class, that someone has provided, or that\
    \ we write, we have to instantiate the object variables using the new keyword.\n\
    - Use ctrl + p to have the IDE show what parameters a method can take (cmd + p\
    \ on a Mac).\n- When we instantiate a class with the new keyword, a constructor\
    \ method on the class is called automatically.\n\n# AutoBoxing\n\nIn the versions\
    \ of Java that we will be using, we don't actually need to instantiate the Integer\
    \ class with our new keyword.\n\nWe can take advantage of a Java feature 'autoboxing'\
    \ which was introduced in Java version 1.5. Autoboxing will automatically convert\
    \ from a primitive type to the associated class automatically."
