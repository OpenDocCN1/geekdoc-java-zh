    \nimport org.junit.Test;\n\npublic class IntegerExamplesTest {\n\n    @Test\n\
    \    public void integerExploration(){\n    }\n}\n```\n\nWe can use this reader,\
    \ this is called experimenting with the Integer class.\n\n# Instantiate an Integer\
    \ Class\nThe first thing we need to do is create a variable of type Integer.\n\
    \n```\nInteger four = new Integer(4);\n```\n\nBecause Integer is a class, this\
    \ is called instantiating a class and the variable is an object variable.\n\n\
    +   * int was a primitive type.\n* Integer is a class.\n* To use a class we instantiate\
    \ it with the new keyword\n* The new keyword creates a new instance of a class\n\
    * The new instance is referred to as an object or an instance of a class\n\nYou\
    \ can also see that I passed in the literal 4 as a parameter. I did this because\
    \ the Integer class has a constructor method which takes an int as a parameter\
    \ so the object has a value of 4.\n\n# What is a Constructor?\n\n> A constructor\
    \ is a method on a class which is called when a new instance of the class is created.\n\
    A constructor can take parameters, but never returns a value and is declared without\
    \ a return type. e.g. public Integer(int value){...}\nA constructor has the same\
    \ name as the class starting with an uppercase letter.\n\nThe Integer class actually\
    \ has more than one constructor. You can see this for yourself.\n\n+   * Type\
    \ in the statement to instantiate a new Integer object with the value 4\n* Click\
    \ inside the parentheses where the 4 is, as if you were about to type a new parameter,\n\
    * press the keys ctrl + p (cmd + p on a Mac)"
