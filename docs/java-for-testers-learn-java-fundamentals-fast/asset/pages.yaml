- pgno: 196
  md: "# Example of reading and writing a file\n\nI will quickly show you code that\
    \ writes a file, and reads the same file.\nIf you want to immediately experiment\
    \ then feel free. The rest of the chapter will work through the various methods\
    \ and classes used, explaining them in more detail.\n\n# Write a Temp File\n\n\
    ```\nprivate File writeTestDataFile() throws IOException {\n    File outputFile\
    \ = File.createTempFile(\"Reading\", null);\n    BufferedWriter print = new BufferedWriter(\n\
    \        new FileWriter(outputFile));\n\n    for (int lineNumber = 1; lineNumber\
    \ < 6; lineNumber++){\n        print.println(\"line \" + lineNumber);\n    }\n\
    \n    print.close();\n    return outputFile;\n}\n```\n\nThe above code, creates\
    \ a temporary file, in the system ‘Temp’ directory.\ne.g. forReading253645339676632859.\
    \ temp in %TEMP% (on Windows)\n\nIt uses 3 classes to wrap around the file: FileWriter,\
    \ BufferedWriter and PrintWriter.\nThen prints 5 lines of text to the file, closes\
    \ the file, and returns the File to the calling method.\n\n# Read the temp file\n\
    \n```\n@Test\npublic void outputToFileSystemOutBufferedReader() throws IOException\
    \ {\n    File inputFile = writeTestDataFile();\n    BufferedReader reader = new\
    \ BufferedReader(new FileReader(inputFile));\n\n    try{\n        String line;\n\
    \        while ((line = reader.readLine())!=null){\n            System.out.println(line);\n\
    \        }\n    } finally{\n        reader.close();\n    }\n}\n```\n\nThe code\
    \ above, calls the writeTestDataFile method to create a temporary file.\nit returns\
    \ the File, and wraps it with a FileReader and a BufferedWriter, then\nreads each\
    \ line and prints it out.\n\nIt wraps the reading code in a try/finally block\
    \ when reading to make sure that the file actually closes if an exception is thrown.\n\
    \n# Basic Notes"
  merge: -1
  img_proc: true
- pgno: 197
  md: "It seems like a lot of classes involved there. But as you will see later, they\
    \ build on each other to make the reading and writing of files easy for you.\n\
    \nIf you start by copying the code above, and amending it slightly, you can probably\
    \ meet at least 3 of the use cases I mentioned at the top of this chapter as my\
    \ common use cases.\n\nAnd you could probably figure out the other use cases by\
    \ reading the context sensitive code completion on the classes.\n\nThe remainder\
    \ of this chapter will cover each the classes involved in more detail.\n\n# File\n\
    \nThe File class provides the main class to represent a 'file' or 'directory'\
    \ and methods for creating directories and other local file actions.\n\nThe File\
    \ class also provides a set of static methods that can help us.\n\nFile is in\
    \ the java.io package.\n\n# Static Methods\n\n+   * createTempFile\n  - create\
    \ a temporary file in the system's temporary directory (on Windows this %TEMP%)\n\
    * separator\n  - the separator for file values e.g. '\\'\n* pathSeparator\n  -\
    \ the system separator in the Path e.g. ';'\n* listRoots\n  - an array of the\
    \ root paths in the file system\n\nI really use the createTempFile and separator\
