  md: '# You could also use int or long


    If you use an int then you don''t worry about rounding, particularly when doing
    a calculation like the example which actually represents 10 pence, plus 73 pence.
    ie 0.1 pounds + 0.73 pounds. I could have done the calculation in pennies and
    be free.


    # BigDecimal


    BigDecimal is imported using the java.math package.


    ```

    import java.math.BigDecimal;

    ```


    BigDecimal is not a primitive, so is a little clumsier to work with, and will
    perform slowly than the primitives.


    ```

    BigDecimal btotal = new BigDecimal("0.1").add(new BigDecimal("0.73"));

    assertThat(btotal, is(new BigDecimal("0.83")));

    ```


    BigDecimal maintains the decimal point precision. Particularly useful for financial
    calculations


    So if, as a tester working in finance, you need to read values from a file and
    compare the calculations produced from some other system. You are likely to use
    BigDecimal to ensure that your calculations are as accurate as you can make them.


    You could use int or long and manage the rounding yourself. Or take the easy route
    and use BigDecimal when you want to maintain the precision.


    Joshua Bloch, the author of “Effective Java”, summarizes the situation as “If
    the quantities don’t exceed nine decimal digits, you can use int; if they don’t
    exceed eighteen digits, you can use long. If the quantities might exceed eighteen
    digits, you must use BigDecimal”.


    Be aware of the choices now, so you don’t raise defects against systems when the
    bugs are actually in your math calculation code.'
