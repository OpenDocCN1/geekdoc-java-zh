- pgno: 42
  md: 'But... experienced developers will be worried that you start using Integer
    in your code, and worry, instantiating new integers in your code e.g. new Integer
    (0)


    They worry because while an int equals an int, an Integer does not always equal
    an Integer.


    I''m less worried because:


    +   - I trust you,

    - Automation code has slightly different usages than production code and you''ll
    more likely use the Integer static methods

    - I''m using this as an example of instantiating a class and using static methods,

    - This is only "Chapter 4" and we still have a way to go


    I''ll illustrate with a code example, why the experienced developers were concerned.
    You might not understand the next few paragraphs, but I just want to give you
    a detail as to why one Integer, or one Object, does not always equal another Object.


    e.g. if the following assertions were in an @Test method then they would pass:


    ```

    assertEquals(4,4);

    assertTrue(4==4);

    ```


    Note that "==" is the Java operator for checking if one thing equals another.


    If the following code was in a @Test, then the second assertion would fail:


    ```

    Integer firstFour = new Integer(4);

    Integer secondFour = new Integer(4);


    assertEquals(firstFour, secondFour);

    assertTrue(firstFour==secondFour);

    ```


    Specifically, the following assertion would fail:


    ```

    assertTrue(firstFour==secondFour);

    ```


    Why is this?


    Well, primitives are simple and there is no difference between value and identity
    for primitives. Every 4 in the code refers to the same 4.


    Objects are different, we instantiate them, so the two Integer variables (firstFour
    and secondFour) both refer to different objects. Even though they have the same
    ''value'', they are different objects.


    When I do an assertEquals, JUnit uses the equals method on the object to compare
    the ''value'' or order (i.e. 4 in this case). When we use the "=" operator, Java
    is checking if the two objects refer to the same instantiation, and they don''t,
    they refer to two independently instantiated objects.


    So the assertEquals is actually equivalent to:


    ```

    assertTrue(firstFour.equals(secondFour));

    ```


    Don''t worry if you don''t understand this yet. It will make sense later.


    For now, recognize that:'
  merge: -1
  img_proc: true
