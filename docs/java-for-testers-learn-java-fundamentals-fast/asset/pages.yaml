  md: 'Java will do the calculation for us I have used the + operator. The + operator
    will act on two int operands and return a result. i.e. it will add 2 and 2 and
    return the value 4 which will be stored in the int variable answer.


    # Java Operators


    Java has a few obvious operators we can use:


    +   * to add

    * to subtract

    * to multiply

    * / to divide


    There are more, but we will cover those later.


    # Assert the value


    The next thing we have to do is assert the value.


    ```

    assertEquals("2+2=4", 4, answer);

    ```


    When we write @Test methods we have to make sure that we assert something because
    we want to make sure that our code reports failures to us automatically.


    Assert is a special type of check:


    +   * If the check fails then the assert throws an assertion error and our method
    will fail.

    * If the check passes then the assert doesn''t have any side-effects


    The asserts we will initially use in our code from the JUnit Assert package.


    When I type the assert, IntelliJ will show the statement as being in error, because
    I haven''t imported the assertEquals method or Class from JUnit.


    To fix the error alt + return on the assertEquals statement and choose to:


    static import method...


    Assert.assertEquals in the org.junit package


    IntelliJ will then add the correct import statement into my code.


    ```

    import static org.junit.Assert.assertEquals;

    ```


    The assertEquals method is polymorphic. Which simply means that it can be used
    with different types of parameters.


    I chosen to use a form of:


    ```

    assertEquals("2+2=4", 4, answer);

    ```


    Where:


    +   * assertEquals is an assert that checks if two values are equal'
