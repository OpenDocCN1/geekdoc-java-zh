  md: '# Useful Checks


    For a particular File object, you can check if it is a file or directory using
    the following methods:


    +   - isDirectory returns true if the File object is a directory

    - isFile returns true if the File object is a file


    # Exercise: Check that the Temp Directory is a Directory


    Create a File object that represents the temporary directory.

    System.getProperty("java.io.tmpdir")

    Assert that isDirectory returns true and isFile returns false.


    # Writing And Reading Files


    # Writing Text Files


    Java provides with wrapper classes which hide lower level input and output classes
    to make reading and writing files easier.


    You saw the use of those in the initial examples in the chapter.


    +   - FileWriter is a wrapper around OutputStream for character based files. e.g.
    text files.

    - BufferedWriter makes writing more efficient by waiting until the buffer is full
    then flushing the buffer to the writer. For file writing this queues the writing
    of bytes to the file.

    - PrintWriter provides convenience methods for writing lines to files for human
    readable output. e.g. println,n


    For example:


    ```

    File outputFile = File.createTempFile("printWriter", null);

    FileWriter writer = new FileWriter(outputFile);

    BufferedWriter buffer = new BufferedWriter(writer);

    PrintWriter print = new PrintWriter(buffer);

    ```


    You can append to files by creating the FileWriter with an append parameter to
    true.


    ```

    writer = new FileWriter(outputfile, true);

    ```


    # Writing with a PrintWriter


    Using a PrintWriter is the same as using the System.out.println that you have
    seen throughout the book.


    We can write a line to the file by using println


    ```

    print.println("Simple Print to Buffered Writer");

    print.println("=================================");

    ```'
