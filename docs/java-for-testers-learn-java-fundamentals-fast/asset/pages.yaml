  md: "# # Chapter Seventeen - Dates and Times\n\n### Chapter Summary\nIn this chapter\
    \ you will learn to use Java's native Date functionality\n\n* System.currentTimeMillis\
    \ - current system time in milliseconds since midnight January 1st, 1970\n* System.nanoTime\
    \ - current JVM time source in nanoseconds\n* The native classes associated with\
    \ dates:\n    * Date - simple class for comparison and working from milliseconds\n\
    \    * SimpleDateFormat - create a String from a Date using a format pattern\n\
    \    * Calendar - a wrapper for Date to allow working with days, months, etc.\n\
    \nDates in Java are handled a little rough and ready, as a result, many Java developers\
    \ external libraries like 'Joda-Time'. External libraries are beyond the scope\
    \ of this book, and while the internal classes may not offer the flexibility as\
    \ 'Joda-Time', they are still very powerful.\n\nIn addition to working with dates,\
    \ I also use the Date/Time functionality to:\n\n+   * seed random numbers\n* generate\
    \ unique data e.g. filenames, and user ids\n\n# currentTimeMillis and nanoTime\n\
    \n+   * System.currentTimeMillis - returns current system time in milliseconds\
    \ since midnight January 1st, 1970\n* System.nanoTime - returns current JVM time\
    \ source in nanoseconds\n\nSystem.currentTimeMillis returns a long which represents\
    \ the current time on your local machine. The time is represented as the number\
    \ of milliseconds since midnight of the January 1st, 1970.\n\n```\nlong startTime\
    \ = System.currentTimeMillis();\n```\n\nSystem.nanoTime returns a long which represents\
    \ the current nanoseconds as calculated by the current JVM. This doesn't necessarily\
    \ map on the current system time, but the difference between two calls to nanoTime\
    \ represents the passage of time (in nanoseconds) between the two calls.\n\n```\n\
    long startTime = System.nanoTime();\n```\n\nA nanosecond is one thousand-millionth\
    \ of a second.\nI typically use these methods to:\n\n+   * calculate the time\
    \ that a task has taken\n* create unique ids and filenames"
