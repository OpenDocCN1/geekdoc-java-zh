  md: '# # Chapter One - Basics of Java Revealed


    Chapter Summary

    An overview of Java code to set the scene:

    * class is the basic building block

    * a class has methods.

    * method names start with lowercase letters

    * class names start with uppercase letters

    * a JUnit test is a method annotated with @Test

    * JUnit tests can be run without creating an application


    In this first chapter I will show you Java code, and the language I use to describe
    it, with little explanation.


    I do this to provide you with some context. I want to wrap you in the language
    typically used to describe Java code. I don''t expect you to understand it yet.
    Just read the pages which follow, look at the code, soak it in, accept that it
    works, and is consistent.


    Then in later pages, I will explain the code constructs in more detail, you will
    write some code, and I will reinforce the explanations.


    # ## Java Example Code


    > > Remember - just read the following section


    Just read the following section, and don''t worry if you don''t understand it
    all immediately. I explain it in later pages. I have emphasized text which I will
    explain later: So if you don''t understand what an emphasized word means, then
    you will in a few pages time.


    # ## An empty class


    A class is the basic building block that we use to build your Java code base.


    All the code that we write to do stuff, we write inside a class. I have named
    this class AnEmptyClass.


    ```

    1 package com.javaforstesters.chap001basicsofjava.examples.classes;

    3 public class AnEmptyClass {

    4 }

    ```


    Just like your name, Class names start with an uppercase letter in Java. I''m
    using something called Camel Case to construct the names, instead of spaces to
    separate words, we write the first letter of each word in uppercase.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'The first line is package that I added to the class. A package is like a directory
    on the file system, this allows us to find, and use, the Class in the rest of
    our code.


    # A class with a method


    A class, on its own, doesn''t do anything. We have to add methods to the class
    before we can do anything. Methods are the commands we can call, to make something
    happen.


    In this example I have created a new class AClassWithMethod, and this class has
    a method called aMethodOnClass which, when called, prints out "Hello World" to
    the console.


    ```

    1 package.javafortesters.chap01basicsofjava.examples.classes;

    2

    3 public class AClassWithMethod {

    4

    5     public void aMethodOnClass(){

    6         System.out.println("Hello World");

    7     }

    8 }

    ```


    Method names start with lowercase letters.


    When we start learning Java we will call the methods of our classes from within
    JUnit tests.


    # A JUnit Test


    For the code in this book we will use JUnit. JUnit is a commonly used library
    which makes it easy for us to write and run code assertions.


    A JUnit test is simply a method in a class which is annotated with @Test (i.e.
    we write @Test before the method declaration).


    ```

    1 package com.javafortesters.chap01junit;

    2

    3 import com.javafortesters.chap01basicsofjava.examples.classes.AClassWithMethod;

    4 import org.junit.Test;

    5

    6 public class ASoutJUnitTest {

    7

    8     @Test

    9     public void canOutputToConsole(){

    10        AClassWithMethod myClass = new AClassWithMethod();

    11        myClass.aMethodOnClass();

    12    }

    13 }

    ```


    In the above code, we instantiate a variable of type AClassWithMethod (which is
    the name I gave to the class earlier). I had to import the class and package before
    I could use it, and I did as one of the first lines in the file.


    I can run this method from the IDE without creating a Java application because
    I have used JUnit and annotated the method with @Test.


    When I run this method then I will see the following text printed out to the Java
    console in my IDE:'
