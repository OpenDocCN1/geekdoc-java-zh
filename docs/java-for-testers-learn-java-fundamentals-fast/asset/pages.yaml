- pgno: 44
  md: '# Chapter Five - Working with Our Own Classes


    ### Chapter Summary

    In this chapter you will learn to:


    * Write your own class

    * Write @Test annotated methods to help check your class method functionality

    * Call the methods on the class

    * Create static methods and static constants

    * See the difference between static and non-static

    * Use the IDE to write much of your code for you


    And you will learn to do all of this using Test Driven Development.


    When we write code using TDD (Test Driven Development) we write @Test methods
    and assertions, and then write the code to make the assertions pass.


    I like to do this when I’m writing code because I use the IDE’s features to help
    me type less and write code with fewer syntax errors.


    # Context


    Throughout this book I want to use examples and code which prepare you for using
    Java in the real world when we are going to be building different types of examples
    than we would in a Normal Java book.


    We are going to start small, and I want to introduce you to the concept of a ‘domain’
    object. A ‘domain’ object is an object instantiated from a Class which represents
    something in the ‘domain’ you are working in e.g. if you work on a banking application
    then you might have ‘domain’ objects such as account, balance, transaction, etc.


    When we build automation code we need to build a library of supporting objects
    to us. We do so that:


    +   * our code is maintainable,

    * our code become more readable,

    * our code is faster to write, because we have higher level abstractions to help,

    * we avoid repeating code.


    All of the above are normal coding goodness. Because when we write automation
    code for a production application, we are writing production code, and it must
    stand up to the same scrutiny we apply to the live production code.


    We have a number of possible object groupings when writing automation code, the
    following is one I use a lot:


    +   * Physical'
  merge: -1
  img_proc: true
- pgno: 45
  md: "+   * Application\n  - e.g. login page, navigation menu\n* Environmental\n\
    \  - e.g. installed URI, port\n* Logical\n  - Domain Entities\n  - e.g. user,\
    \ account\n\nEssentially you can build many categorizations and modeling levels\
    \ as you need, in order to effectively model your system. I recommend the book\
    \ ‘Domain Driven Design’ by Eric Evans, if you want to learn more about domain\
    \ modeling.\n\nFor the examples in this chapter we are going to look at an environmental\
    \ domain object called TestAppEnv which represents the test environment we run\
    \ our automation and assertions.\n\nImagine that you have an application under\
    \ test, and you have installed it on a number of test environments, and you want\
    \ to run your automation code on any of those environments (and possibly on live).\n\
    \nYou don't have to change your automation code every time you use a different\
    \ environment, so you want to abstract away the actual environment configuration\
    \ behind an object that will handle that for you.\n\nSo of writing it at @Test\
    \ method like the following:\n\n```\n@Test\npublic void checkTitleCorrectOnApp(){\n\
    \tFirefoxDriver driver = new FirefoxDriver();\n\tdriver.get(\"http://192.123.0:67\"\
    );\n\tassertEquals(\"Title should match\",\n\t\"Test App\", driver.getTitle());\n\
    }\n```\n\nNote: the above sample code uses the WebDriver API, so it won't work\
    \ if you type it in. What it is: says Firefox browser, open the URL \"http://192.123.0:67\"\
    \ and check the page title is \"Test App\".\n\nYou could abstract away the connection\
    \ details into an environment domain object, e.g. TestAppEnv.\n\n```\n@Test\n\
    public void checkTitleCorrectOnAppDomainObject(){\n\tFirefoxDriver driver = new\
    \ FirefoxDriver();\n\tdriver.get(TestAppEnv.getUrl());\n\tassertEquals(\"Title\
    \ should match\",\n\t\"Test App\", driver.getTitle());\n}\n```\n\nBy doing this,\
    \ instead of having a hard coded string literal \"http://192.123.0:67\" in all\
    \ your @Test methods, you make a call to an object TestAppEnv.getUrl()."
  merge: -1
