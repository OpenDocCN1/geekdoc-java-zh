  md: 'The above sets the date to 17th January 2013. Feel free to double check this
    on an actual calendar.


    # get details from the Calendar


    Just as we use the Calendar constants to set values in a Calendar we can use the
    same constants to get information from the Calendar.


    Given a Calendar set to 15th December 2013, at 23:49 and 54 seconds:


    ```

    cal.set(2013, Calendar.DECEMBER, 15, 23, 39, 54);

    ```


    We can use the constants to assert that the Calendar has been created as we expected:


    ```

    assertThat(cal.get(Calendar.MONTH), is(Calendar.DECEMBER));

    ```


    # Exercise: Use the other Calendar constants


    Write an @Test method which initiates a calendar, and assert on the values you
    expect for the following constants:


    Use a calendar set to 15th December 2013, at 23:49 and 54 seconds.


    Assert on the values you expect for:


    +   * MONTH

    * YEAR

    * DAY_OF_MONTH

    * HOUR_OF_DAY

    * MINUTE

    * HOUR - AM/PM hour

    * AM_PM - Calendar.AM or Calendar.PM


    # Exercise: Experiment with other constants


    Experiment with the other constants to make sure you are sure you understand them.
    e.g. confirm the following for the 15th December 2013:


    +   * it is a Sunday

    * it is in the 3rd week in the month (0 index based, so 0 is the first week)

    * it is the 1st day in the week

    * it is in the 50th Week of the year

    * it is the 349th day in the year


    # get more information from Calendar


    +   * getTime - returns the Calendar as a Date object

    * getTimeInMillis - returns the Calendar as a Date object


    There are other methods on Calendar to retrieve more information about the calendar,
    but I suggest you read the on-line documentation or code completion to help you
    understand the scope of all the information you can retrieve from this Object.'
