  md: '# Map


    We described Map in the earlier collection chapter.

    In this chapter we will build on Map and consider the SortedMap.


    # SortedMap


    SortedMap is to Map, as SortedSet is to Set. And the interface and function of
    the methods of SortedMap are almost the same as SortedSet. So it won''t take long
    for you to figure out how SortedMap works.


    +   - A SortedMap is ordered on its keys, not its values.

    - The comparator is used to determine the ordering, or the compareTo method on
    the key


    The methods should be familiar as they are almost the same as SortedMap


    +   - firstKey - the first key based on the sort order

    - lastKey - the last key based on the sort order

    - headMap(k) - the SortedMap containing "key", "value" pair before key k

    - tailMap(k) - the SortedMap containing every "key", "value" pair after and including
    the key k

    - subMap(k1, k2) - the SortedMap containing "key", "value" pair between k1 and
    k2 (including k1, excluding k2)

    - comparator - the comparator used to determine the sort order of the keys


    For the sake of brevity, since we covered the SortedSet in detail, and SortedMap
    is much the same, I will use examples to explain SortedMap rather than a lot of
    descriptive text. All the methods we use the following Map declaration and instantiation:


    ```

    SortedMap<String, String> map = new TreeMap<>();


    map.put("key1", "value1");

    map.put("key3", "value3");

    map.put("key2", "value2");

    map.put("key5", "value5");

    map.put("key4", "value4");

    ```


    firstKey & lastKey to retrieve key keys


    firstKey and lastKey respectively return the first and last keys in the map:


    ```

    assertEquals("key1", map.firstKey());

    assertEquals("key5", map.lastKey());

    ```


    Create sorted extracts with headMap, tailMap and subMap


    headMap(k) returns a SortedMap containing every key, value pair before the key
    passed as argument.


    ```

    SortedMap<String, String> headMap;

    headMap = map.headMap("key3");

    ```'
