- pgno: 237
  md: 'Now, to justify my selections...


    # Effective Java


    "Effective Java" by Joshua Bloch, at the time of writing in its 2nd Edition. This
    book works for beginners and advanced programmers.


    Java developers build up a lot of knowledge about their language from other developers.

    "Effective Java" helps short cut that process.


    It has 78 chapters. Each, fairly short, but dense in their coverage and presentation.


    When I first read it, I found it quite heavy, because I didn''t have enough experience
    or knowledge to understand it. But I re-read it, and have continued to re-read
    it over the time I have developed my Java experience. And each time I read it,
    I find a new nuance, or a deeper understanding of the concepts.


    Because each chapter is short, I return to this book to refresh my memory of certain
    topics.

    This was also the book that helped me understand enum enough to use them and helped
    me understand concurrency well enough to then read, and understand, “Concurrency
    in Practice".


    I recommend that you read and buy this book early in your learning. If you don''t
    understand it all, read it all. Then come back to it again and again. It concentrates
    on very aspects of the Java language and can boost your real-world effectiveness
    tremendously.


    You can find a very good overview of the book, in the form of a recording of a
    Joshua Bloch at "Google I/O 2008 - Effective Java Reloaded" on YouTube:


    +   - youout.be/pi_I7oD_uGI


    # Implementation Patterns


    Another book that benefits from repeated reading. You will take different information
    from it with each reading, depending on your experience level at the time.


    "Implementation Patterns" by Kent Beck explains some of the thought processes
    involved in professional coding.


    This book was one of the books that helped me:


    +   - concentrate on keeping my code simple,

    - decide to learn the basics of Java (and know how to find information when I
    needed it),

    - try to use in built features of the language, before bringing in a new library
    to my code.


    The book is thin and, again dense. Most complaints I see on-line seem to stem
    from the length of the book and the terseness of the coverage. I found beneficial,
    it meant little padding and waste. I have learned, or re-learned, something from
    this book every time I read it.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'Other books that cover similar topics include “Clean Code” by Robert C. Martin,

    “The Pragmatic Programmer” by Andrew Hunt and David Thomas. But I found

    “Implementation Patterns” far more useful and applicable to my work.


    For more information on Kent Beck’s writing and work, visit his web site:


    +   - threereiversinststitute.org


    # Growing Object-Oriented Software


    Another book I benefited from reading when I wasn’t ready for it. I was able to
    re-read it

    and learn more. I still gain value from re-reading it.


    +   - “Growing Object-Oriented Software, Guided by Tests”, by Steve Freeman and
    Nat

    Pryce


    Heavily focused using @Test method to write and understand your code. It also

    covers mock objects very well.


    This book helped change my coding style, and how I approach the building of abstraction

    layers.


    The official homepage for the book is growing-object-oriented-software.com


    # Covert Java


    “Covert Java : Techniques for Decompiling, Patching and Reverse Engineering”,
    by Alex

    Kalinovovsky starts to show out its new age as it was written in 2004. But highlights
    some of the

    ways of working with Java libraries that you really wouldn’t use if you were a

    programmer.


    But sometimes as a tester we have to work with pre-compiled libraries, without
    source

    code, and use parts of the code out of context.


    I found this very useful book for learning about reflection and other practices
    related to

    taking apart Java applications.


    You can usually pick this up quite cheaply second hand. There are other books
    the cover

    de-compiling, reverse engineering and reflection. But this one got me started,
    and I still

    find it clear and simple.


    # Java Concurrency in Practice


    Concurrency is not something I recommend trying to work with when you are starting
    out

    with Java.


    But at some point you will probably want to run your code in parallel, or create
    some

    threads to make your code perform faster. And you will probably fail, and not
    really

    understand why.


    I used “Effective Java” to help me get started. But “Java Concurrency in Practice”
    by

    Brian Goetz, is the book I read when I had to make my automation abstraction

    layer work with concurrent code.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Core Java: Volume 1


    The Core Java books are massive, over 1000 pages. And if you really want to understand
    Java in depth then these are the books to read.


    I find them to be hard work and don''t read them often. I tend to use the JavaDoc
    for the Java libraries and methods themselves.


    But, periodically, I want to have an overview of the language and understand the
    scope of the built in-built features that I don''t use, and that I would otherwise
    turn to an external library for.


    Every time I''ve flicked through “Core Java”, I have discovered a nuance and a
    new set of features, but I don''t do it.


    # Mastering Regular Expressions


    We didn''t cover the full power of Regular Expressions in this book.


    I tend to try and keep my code simple and readable so I''ll use string manipulation
    to start with.


    But over time, I find that I can replace a series of if blocks and string transformations
    with a regular expression.


    Since I don''t use regular expressions often I find that each time, I have to
    re-learn them and I still turn to “Mastering Regular Expressions” by Jeffrey E.F.
    Friedl.


    As an alternative to consider: “Regular Expressions Cookbook” by Jan Govaerts,
    which is also very good.


    I sometimes use the tool RegexMagic regexmagic.com, written by Jan Govaerts when
    writing regular, lets me test out the regular expression across a range of example
    data, and generate sample code for a lot of different languages.


    Jan also maintains the web regular-expressions.info with a lot of tutorial information
    on it.


    # Recommended Videos


    The videos produced by John Purcell at caveofprogramming.com have been recommended
    by my testers.


    I''ve looked through some of them, and John provides example coding for many of
    the items covered in this book, and in the “Advancing Concepts” section.


    John’s approach is geared around writing programs, and I think that if you have
    now finished this book, you will benefit from the traditional programmer based
    coverage that John provides.


    # Recommended Web Sites


    For general Java news, and up to date conference videos, I recommend the following
    web sites.'
  merge: -1
