  md: '```

    String yourAge = " + ageAsString + " years old";

    ```


    In the above code Java would:


    +   - call the method to toString on the age variable

    - assign the return value from toString to the ageAsString variable

    - build a String from the constant "You are \ the variable ageAsString, and the
    constant "years old"

    - assign that String to yourAge variable


    All of the above code execution would in sequence.


    An exception is a way of interrupting the normal flow of execution when something
    goes wrong.


    When an exception occurs the current statement is terminated and the execution
    flow stops. If there is no program code to catch and handle the exception anywhere
    in the sequence of calling then the exception will terminate the program.


    # What does an exception look like?


    The simplest way of understanding an exception is to see one in action.


