- pgno: 60
  md: "# Experiment with private and public fields\n\nTry it for yourself. Make the\
    \ fields public and in @Test method, set username and password to a new value,\
    \ and get the value just by accessing the field.\n\n```\ne.g.\nUser auser = new\
    \ User();\nauser.username = \"bob\"\naertEquals(\"default username\", \"bob\"\
    , auser.username);\n```\n\n# A Constructor with arguments\n\nAt the moment we\
    \ have no way of changing the username and password on a User. So we will write\
    \ a constructor which allows us to create a User object and set the username and\
    \ password at the same time.\n\nAs demonstrated in the following code, you can\
    \ see that I create a User with a username and password of \"pA55w0RD\":\n\n```\n\
    @Test\npublic void canConstructWithUsernameAndPassword() {\n  User user = new\
    \ User(\"admin\", \"pA55w0RD\");\n  assertEquals(\"given username expected\",\
    \ \"admin\", user.getUsername());\n  assertEquals(\"given password expected\"\
    , \"pA55w0RD\", user.getPassword());\n}\n```\n\nTo make this @Test method pass,\
    \ we have to create a new constructor in User, this time a constructor which takes\
    \ two parameters, the username and password we want to assign to the User. This\
    \ constructor is shown below:\n\n```\npublic User(String username, String password)\
    \ {\n  this.username = username;\n  this.password = password;\n}\n```\n\nNote\
    \ that the constructor now has two parameters: String username and String password.\n\
    \nBecause these parameters have the same name as the fields, I have to use the\
    \ this keyword, when I want to access the username and password field on the current\
    \ object. If I did not add this, then Java would not be able to distinguish the\
    \ field and the parameter.\n\nI could have renamed the parameters aUsername aPassword\
    \ to avoid a naming clash. But I want to minimize the documentation I have to\
    \ produce, and keeping the parameter names self-documenting helps long term maintenance.\
    \ Also this gives us the opportunity to introduce you to the this keyword."
