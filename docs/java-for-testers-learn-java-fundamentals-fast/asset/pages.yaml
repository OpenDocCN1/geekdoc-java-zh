    }\n```\n\nNote in the above I add a fail statement in the try block:\n\n+   -\
    \ I do this because the exception is supposed to have been thrown and this fail\
    \ statement should never be reached.\n- If the fail statement is reached then\
    \ the exception was not thrown and I need to force an @Test failure.\n- If I did\
    \ not add the fail statement and an exception was not thrown then the @Test method\
    \ would pass, but for the wrong reasons.\n\nI also make sure that the setPassword\
    \ method throws the exception.\n\n```\n@Test\npublic void setPasswordWithInvalidPasswordExceptionMessages(){\n\
