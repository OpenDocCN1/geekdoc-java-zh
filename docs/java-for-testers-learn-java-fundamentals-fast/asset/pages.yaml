  md: '# Introduction to Comments In Java


    /* Comments created with forward slash asterisk

    span multiple lines */


    # Add the class to a package


    IntelliJ will have created an empty class for u.g.


    ```

    public class MyFirstTest {

    }

    ```


    And since we didn''t specify a package, it will be at the root level of our test\java
    hierarchy.


    We have two ways of creating a package and moving the class into it:


    +   - Manually create the package and drag and drop the class into it

    - Add the package statement into our code and have IntelliJ move the class


    Manually create the package and drag and drop the class into it by right clicking
    on the java folder under test and selecting New \ Package, then enter the package
    name you want to create.


    For this book, I''m going to suggest that you use the top level package structure:


    +   - com.javafortesters


    And then name any sub structures as required. So for this class we could create
    a package called com.javafortesters.chap003myfirsttest.examples. You don''t have
    to use the chap003 prefix, but it might help you trace your code back to the chapter
    in the book. I use this convention to help you find the example and exercise source
    code in the source download.


    # Package Naming


    In Java, package names tend to be all lowercase, and not use camelCase.


    If we want, we can add the package statement into our code and have IntelliJ move
    the class:


    Add the following line as the first line in the class:'
