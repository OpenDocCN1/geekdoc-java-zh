  md: "Floating point types have two different precisions, which controls the size\
    \ of value they\nstore:\n\n+   - float: single precision 32 bit number\n- double:\
    \ double precision 64 bit number\n\nRanges:\n\n+   - float range: 1.4E-45 to 3.4028235E38\n\
    - double range: 4.9E-324 to 1.7976931348623157E38\n\nSuffixes:\n\n+   - represent\
    \ a float with the suffix F\n- represent a double with the suffix D, or if you\
    \ use a decimal point e.g. 20.0 out then\nnumber with default to a double\n\n\
    The official documents recommend using the java.math.BigDecimal class if you want\n\
    precise values e.g. currency. BigDecimal helps avoiding errors.\n\nThese primitive\
    \ types also have an associated Class e. Float and Double\n\n```\n@Test\npublic\
    \ void FloatingPointType(\n    float singlePrecision32bit;\n    double doublePrecision64bit;\n\
    \n    System.out.println(\" + \"float range: \" + +\n        Float.MIN_VALUE +\
    \ \" to \" + +\n        Float.MAX_VALUE);\n\n    System.out.println(\" + \"double\
    \ range: \" + +\n        Double.MIN_VALUE + \" to \" + +\n        Double.MAX_VALUE);\n\
    \n    singlePrecision32bit = 10.0F; // suffix F to get a float\n    assertEquals(10F,\
    \ singlePrecision32bit, 0);\n\n    doublePrecision64bit = 20.0; // default to\
    \ double\n    assertEquals(20D, doublePrecision64bit, 0);\n)\n```\n\n# Character\
    \ Type\n\nThe char data type is used to represent an individual character e.g.\
    \ 'a', it is a 16 bit\nUnicode character.\n\nA char is not a String.\n\nYou can\
    \ represent a unicode character as \\u0026. e. \\u followed by the 4 character\
    \ hex\nvalue of the Unicode character. \\u0026 is &\n\nJava also has some special\
    \ characters represented by escape sequences e.g.\n\n+   - \\t - a tab character"
