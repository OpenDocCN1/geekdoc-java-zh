  md: "So we instead simply assign an int to an Integer and autoboxing will take care\
    \ of the conversion for us e.g.\n\n```\nInteger six = 6;\nasertEquals(\"autoboxing\
    \ assignment for 6\",\n      6, six.intValue());\n```\n\n# Static methods on the\
    \ Integer class\n\nAnother feature that classes provide static methods.\n\nYou\
    \ already used static methods on the Assert class from JUnit. i.e. assertEquals\
    \ A static method operates at the class level, rather than the instance or object\
    \ level. Which means we don't have to instantiate the class into a variable in\
    \ order to call a static method.\n\ne.g. Integer provides static methods like:\n\
    \n+   * Integer.valueOf(String s) - returns an Integer initialized with the value\
    \ of the String\n* Integer.parseInt(String s) - returns an int initialized with\
    \ the value of the String\n\nYou can see all the static methods by looking at\
    \ the documentation for Integer, or in your code write Integer. then immediately\
    \ after typing . the IDE show you the code completion for all the static methods.\n\
    \nFor each of these methods, if you press ctrl + q (ctrl + j on a Mac) you should\
    \ see the help file information for that method.\n\n# Exercise: Convert an int\
    \ to Hex:\n\nInteger has a static method toHex which takes an int as parameter,\
    \ returns the int as String formatted in hex.\n\nWrite an @Test annotated method\
    \ which uses toString and asserts:\n\n+   * 11 becomes b\n* 10 becomes a\n* 3\
    \ becomes 3\n* 21 becomes 15\n\n# Public Constants on the Integer class\n\nIt\
    \ is possible to create variables at a class level (these are called fields) which\
    \ are also static. These field variables are available without instantiating the\
    \ class. The Integer class exposes few of these but the most important ones are\
    \ MIN_VALUE and MAX_VALUE.\n\nIn addition to being static fields, these are also\
    \ constants, in that you can't change them. (We'll cover how to do this in a later\
    \ chapter). The naming convention for constants is to use only uppercase, with\
    \ _ as the delimiter."
