    and Position of Women'', although useful, follows more of a narrative style and
    deals largely with the early medieval period.


    The latest publication of Hembala Bhargav, Royalty, Feudalism and Gender, as Portrayed
    by Foreign Travelers, does tackle the topic of marriage in Chapter 2. This is
    merely a general survey of social institutions and trends rather than a work of
    historical rigor based on sufficient evidence. Chapter 3, ‘Gender and Status of
    Women’, follows the same pattern. Although dealing largely with the eighteenth
    and nineteenth centuries, it does not throw any new light on either marriage or
    the status of women. Also, important issues as sati and jauhar have just been
    touched.


    Here, would not be out of place to go into the European writings on the history
    of marriage. History of marriage has been long characterized by the great variety
    of approaches made to it. Why has the study of the history of marriage become
    so popular in the West? This results largely from the search for relevance in
    history. The rapid and sensational changes in Western marriage customs and domestic
    upheavals have turned historians to look at the past. This obviously helps in
    putting the present world into perspective.


    Social and cultural history plays the role of a master link between the various
    elements in what is now a diverse discipline. We have long been aware of the fascinating
    parallel studies of marriage by anthropologists. In recent years, an eminent anthropologist
    Jack Goode has brought these studies into the historical area in his fundamental
    work, The Development of Family and Marriage, in Europe.


    From Mary Wollstonecraft onwards, one can discern a stream of critical feminist
    writing, focusing successively on married women’s property rights, access to divorce,
    and right to work and vote. Professor Stone’s work, Family, Sex and Marriage in
    England 1500–1800 (London), was a monumental work, vivid in style but with relative
    absence of investigation.


    The study of the history of marriage has been particularly illuminated in two
    recent books by George Duby, Medieval Marriage and The Knight, the Lady and the
    Priest. They are among the most influential works of one of the best known social
    and economic historians. His books are enchanting, full of rich and brilliantly
    presented evidence.


    Of course, for the English and French historians, the evidence and material is
    vast and is almost readily available in a chronological order,'
  merge: -1
