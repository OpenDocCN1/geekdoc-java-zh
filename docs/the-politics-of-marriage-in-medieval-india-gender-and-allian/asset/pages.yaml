  md: '# Introduction


    whereas, for us, the material is extremely scattered. But these limitations can
    be turned into an advantage when one realizes that there is sufficient material
    to turn scattered evidence into reconstructing some orderly picture of the past.


    The institution of marriage has to be viewed by examining such things as the hallmark
    of medieval marriage. What were the political and economic considerations and
    cultural determinants of the marriage practices of our period, reflecting the
    style of life, behaviour, norms, etiquette, and so on?


    This work has been divided into five chapters in which I have tried to deal with
    various significant aspects of marriage. In the first chapter, a study has been
    made of the political and social structure of medieval Rajasthan. Social and cultural
    history has to be related to the political structure, as these changes led to
    changes in society. I have handled the phenomenon of emergence of Rajputs, as
    they have contributed significantly to the distinctiveness of Rajasthan. Also,
    I have examined how the emergence of the early Rajput clans led to the redefining
    and reorganization of the political and social structure. State formation being
    an ongoing process developed through distinct stages, and these developments affected
    the social substructure of the region. These developments helps us understand
    the marriage network among the clans.


    The process of integration and transformation continued right up to the fourteenth
    and fifteenth centuries, with the possibility of the resurgence of erstwhile groups
    as well as their kinsmen always remaining. Besides, the rulers of various kingdoms
    also had to deal with the Muslim rulers of Gujarat, Sultans of Delhi, and finally
    with the Mughals, who conquered and reconciled them. To what extent this altered
    the state structure has also been looked into. Whereas during the early period
    of state formation, caste boundaries were quite blurred, by the fifteenth–sixteenth
    centuries, caste distinctions acquired importance for marriage purposes and for
    systematization of administration as reflected in the land revenue system.


    A study of the caste structure of this region makes it clear that it cannot be
    seen in terms of the fourfold *varnas*. For the Rajputs, it was the clan structure
    that was more significant and this governed the marriage rules. Besides the Rajputs,
    the other dominant castes such as Brahmins, Bhats, and Charans have been studied.
    The significance'
