  md: '# Introduction


    xxiii


    of medieval Rajput states since their origin, Khyat contains valuable information
    about the social structure and polity of the seventeenth-century Rajput states
    of Rajasthan.


    Naisi rose to the position of pradhan (village official) in 1658. But he was less
    remembered as an able administrator and for the texts he penned. These are as
    Munhot-Naisi ki Khyat (completed 1665) and Marwar-ra-Pargana-ri-Vigat. In fact,
    the Khyat is an unparalleled text in throwing light on the royalty of Rajasthan.
    In the Khyat, Naisi has given sometimes detailed and sometimes summarized description
    of Mewar, Dungarpur, Banswara, Devaliya (Pratapgarh), Marwar, Bundi, Jaisalmer,
    and Sirohi, and of the Rajput families associated with them. Out of these, the
    post-fourteenth century descriptions are more reliable than the earlier period.
    But as the Rathore clan of Jodhpur it neither gives a chronological history nor
    does it throw light on all rulers. But this is done in the Vigat (literary account
    of the past, a kind of a gazetteer.


    There was also a tradition of writing Vigat in Marwar. The first work of this
    nature, Marwar ra Pargana ri Vigat, was written by Muhnot Naisi in the latter
    half of the seventeenth century during the reign of Raja Jaswant Singh. There
    is no doubt that this work was written on the pattern of Ain-i-Akbari. Besides
    recording a systematic paganwise account of Marwar, he gives details of the history
    of his ruling families. As the Khyat does not provide complete chronological history
    of Dodhpur, this lacuna is more than made up by the information provided in the
    Marwar ra Pargana ri Vigat in three volumes—an incomparable piece of work. It
    is a gazetteer of Rajasthan in which details of various villages in a pargana
    are given in such a way that it is not available even in a modern gazetteer. The
    geographical, historical, economic, and political and social information that
    we find here is not only useful from a historical perspective but is also helpful
    in the study of several modern problems.


    As extensively from the Khyat and Vigat, I feel it necessary to provide some more
    details about Naisi and the perspective with which he has written his work. Naisi
