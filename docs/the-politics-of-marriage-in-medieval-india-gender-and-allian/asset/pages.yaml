    barriers standing on the way, it fell successively under the sphere of Saka, Kusana,
    and Gupta political influence, which can be seen in the terracotta sculptures
    of Rajasthan. The resistance put up by the Rajput rulers against the rulers of
    Delhi was as much to the nature of the land they inherited as fighting capabilities.
    The secluded mountain areas also enabled the Bhils and Mers to survive and retain
    their distinctive culture. It might be relevant to consider the established notion
    of isolation of Rajasthan because of its harsh climatic and geographic realities
    imposed by the vast Thar desert. Rajasthan has long been viewed as providing a
    safe refuge in the face of invasions, but this is only one truth. That it was
    an isolated backwater needs to be amended, as the imperial Gurj Pratihara began
    from Bhirmala and Jalor, both in the arid part of Rajasthan, before spreading
    out to make the ancient city of Kanauj its capital.


    Many features commonly identified with Rajasthan today are present over more extensive
    areas of north and west India. Although it was in Rajasthan that the Rajputs first
    appeared on the Indian scene during the early medieval period, they rapidly extended
    their political control, over much of North India in the following centuries.
    Yet, it is Rajasthan which is consistently identified with Rajputs and Rajput
    ethos.


    Deeply set in the minds of historians of all hues is the association of medieval
    Rajasthan with the Rajput. This is so deeply indeed that one tends to forget that
    the earliest reference to the Rajputra, in a sense other than that of a prince,
