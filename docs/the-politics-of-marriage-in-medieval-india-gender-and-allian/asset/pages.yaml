    Sati as a voluntary act seems to have spread slowly throughout India from the
    third century onward and become more prevalent and popular after the eighth century,
    and in the later Smriti literature between ninth and eleventh centuries, to be
    more specific, it seems to have acceptance. How did this come to be? This is indeed
    a problem of historical research.


    When we examine issues like sati and widowhood, another problem that needs to
    be taken into account is the British sensationalized sati. They wanted to show
    it that the British stamped out such horrid rites and that India was to lapse
    into barbarism again if the British were to leave India. In seeking a psychological
    advantage, the British attempted to demonstrate their moral superiority over their
    colonial subject in most subtle and no subtle ways. One of these not-so-subtle
    ways was the area of gender relations. The higher morality of the imperial masters
    could be effectively established by highlighting the low status of women among
    the subject population.


    It was an issue by the inferiority of the subject people could be simultaneously
    demonstrated. The question of ''women'' was crucial to colonial ideology and was
    one of the first areas in which the British intervened. Social practices pertaining
    to women formed the first foci of the colonial master reformist zeal, starting
    with the most visibly socially oppressive custom, sati or the self-immolation
    of widows, banned in 1829.


    This was followed by legislative provision for remarriage of widows and raising
    the age of consent. By any absolute standard, these were progressive legislations
    and had the support of a section of the subject people. But it was also characterized
    as a case of ''white men saving brown women from brown men''. In any case, intervention
    set the framework for the women''s question, which became the focus of cultural
    conflict between the ruler and the subject. History, therefore, came to play a
    major role in the cultural battlefield between rulers and ruled. It was in this
    context that the construction of the past became so obsessively concerned with
    the cultural question in which women have an integral part.⁵


    > ⁵ Uma Chakravarti and Kum Kum Roy, ‘Breaking Out of Invisibility: Rewriting
    History of Women in Ancient India’, in Retrieving Women’s History'
