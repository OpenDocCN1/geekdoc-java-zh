    The castes which permit remarriage, unlike the Brahmins, do not look upon marriage
    as indissolution. Presence of remarriage of widows, or remarriage even when the
    husband was still alive, was very much prevalent among different castes. In fact,
    the agricultural and artisanal castes, widow remarriage was not only permissible
    but completely honourable. The rituals of the second marriage were distinct from
    the first marriage, which was properly conducted according to the Shastras. A
    widow’s remarriage was performed without fanfare either to scourge on bride price
    or to consolidate the family property.


    Gharecha, nata, and gharijana (remarriage) are not confined just to widow remarriage
    but also refers to the second marriage in the lifetime of the partner. Naisi specifically
    mentioned that gharecha staying with someone else after widowhood or to leave
    one’s husband and go and live in another man’s house as his wife. We come across
    examples of not only Rajput widows remarrying, but also leaving their husbands
    when they were still alive. Widow remarriage, though not common, was not prohibited
    either. It is not clear during what period prohibitions on widow remarriage of
    upper caste Rajput appear. But the Khyats, one hardly finds gharecha examples
    of widow remarriage during the post-Mughal period. In the pre-Mughal period, we
    found that the clan order of the Rajputs was quite flexible and there was a degree
    of openness. In the formative years, the Rajput clan structure was more accommodating
    and there was less-female segregation. Changes occurred after the political and
    administrative paramountcy of the Mughals, however, the clan character of the
    Rajputs did not undergo substantial changes. The Mughal preferred them because
    of their clan following. The Position of women was affected when Sur Singh reorganized
    the Zanani Deorhi. Thereafter, no male above the age of five was allowed to enter
    the Zenana.


    The Mughals were so particular about the chastity of their women that during Akbar’s
    reign, when Rao Kalla, was suspected of having come in contact with a lady of
    the Zenata, it was considered ground enough for Akbar to have him killed. This
    obsession with chastity perhaps translated into an attitude against widow remarriage.


