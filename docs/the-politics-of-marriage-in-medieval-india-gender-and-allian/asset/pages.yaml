    over ritual, rank, economic status, and authority shaped relationships within
    the Rajput family and impacted masculine identities. Also, the structure and working
    of Rajput polity, coupled with inter- and intra-clan rivalries, led to the weakening
    of central authority in a Rajput state, making the position of Rajputs vulnerable,
    and they so faltered before superior arms and organized force, especially those
    of the Mughals. Both the Mughals as well as the Rajputs benefited from their alignment
    with each other. Rajput–Mughal history, therefore, discloses both cooperation
    as well as opposition to one another.


    The systematization of the Rajput order was done on the basis of the traditional
    pattern of the caste structure and which is reflected in the land revenue system,
    to which different rates were applied on various castes. Caste distinction acquired
    importance during this period for marriage purposes too. Though we get examples
    of inter-case marriages in the initial years of state formation, it gradually
    disappeared and eventually the state started projecting itself as regulator of
    the Brahminic order and became rigid over inter-case marriages. One can see a
    origin of the marriage network pattern, in which the supposed origin of the family
    plays an important role. The process of state formation was further buttered by
    advantageous matrimonial alliances. Political and social linkages played an important
    role in the exercise of power.


    A study of the caste structure of this region and the emergence of the Rajputs
    indicates deviations from the theoretical concept of caste. Although the Rajputs
    in Rajasthan evolved along the model of the Kshatriya ruling class, it was their
    clan structure that significantly affected their customs and practices. Although
    Rajputs were divided into 36 clans, each clan was regarded as a single unit for
    the purpose of marriage and clan exogamy was strictly adhered to. However, Rajput
    families and households were not fixed magnitudes but shaped by fundamental and
    broader social, political, and economic processes.


    Studies on the Brahmins shows that they were a heterogeneous category. The priestly
    class among them was invariably present on all important social and religious
    functions including marriage. Although they were highly sought after as of the
    royal children, they were also open to manipulation. In our region, we find Brahmins
    also holding political, administrative, and military positions and are'
