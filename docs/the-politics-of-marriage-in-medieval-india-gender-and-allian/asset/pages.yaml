  md: '# Conclusion


    The study of the institution of marriage in relation to the political and social
    structure of medieval Rajasthan reflects how the process of state formation impacted
    the social substructures and institutions such as the caste system and altering
    marriage patterns during this period. We witness the political and social structure
    of Rajasthan going through intense historical changes, altering the institution
    of marriage and its customs and practices.


    In the early medieval period, the basis of state formation was the emergence of
    the lineage power of the ruling elite, who continued to seek various symbols for
    legitimization of their newly acquired power. The Rajput clan states were formed
    by colonizing land with potential subordinate peasants and also by acquiring areas
    at the expense of erstwhile tribal settlement. Right from the eighth to the fourteenth
    centuries, we see various states of Rajasthan emerging after replacing either
    the Bhils, Mers, Meenas, or even the Jats. These groups accepted the superiority
    of the Rajputs and agreed to pay land revenue to them, but after that, they continued
    to enjoy their superior rights on land. However, the possibility of the resurgence
    of the lineage groups against them always remained.


    The process of land distribution among the leading members of the ruling clan
    had led to the fragmentation of authority and emergence of parallel centres of
    authorities within the clan state. The Rajput clan states of Rajasthan remained
    an assemblage of individuals, often warring kingdoms, each pursuing its own interest
    and displaying degree of hostility or dependence in its relation to the central
    power. The glory, the valour, and the tensions of war were associated with a highly
    distinctive social and cultural personality. Friction and strife'
  merge: -1
