- img_proc: true
  md: '# Conclusion


    Widows who did not belong to aristocratic families had a right over the land and
    the house of their husbands. Although the widows were open to harassment by family
    members and others regarding their share in the property, they were very aware
    of their property rights and petitioned the state as when their property rights
    were violated. Also, most of the examples refer to Brahmin widows, and their condition
    certainly does not correspond to the socially marginalized Brahmin widows of the
    Dharmashastras.


    So, the argument that the practice of sati was shaped by such considerations in
    a society where a widow was regarded as a marginal entity, as the lowest stage
    in the life of a woman, does not seem very tenable for our region. For was not
    a matter of either the glory of the act or the life of a miserable widow but a
    number of combined factors that contributed to the existence of the institution
    of sati.


    Coming to the marital sexual morality of medieval Rajasthan, our studies reveal
    how sexuality is defined by the society and culture. There is no one standard
    by which sexual and marital morality can be judged. Evidence suggests that there
    is a great degree of pluralism in the perception of morality. On examining the
    question of fidelity apro the elite Rajputs, we can see how the institution of
    polygamy and differences in age were responsible for cases of infidelity within
    and outside the family, as indicated in Nair ri Khat. Since the Rajput aristocratic
    households were vast, the possibility of illicit sexual encounters was always
    present. Though in the pre-Mughal times, there was more openness in the organization
    of the Zenana, over Sur Singh reorganized the Zenana on the Mughal pattern, the
    possibility may have reduced.


    Yet, premarital or post-marital chastity, thus valued, was not something, the
    lack thereof would make a social outcast of the woman. It is difficult to say
    at what point feminine chastity became an obsession, but notably the tightening
    of control over women at the imperial level can be seen from the period of Akbar
    and in this affected the Rajput ruling classes of our region too. However, this
    whole phenomenon cannot be explained only in terms of cultural seepage, rather
    it be related more to the increasing power of the state. Patriarchal authority
    is widely believed to be the subjective symbolic counterpart of political authority,
    and, in our region, we do witness a correspondence in familial authority and political
    authority.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Conclusion 263


    If we examine the injunctions and guidelines of morality, we find the state playing
    an active role as a regulatory body. The study of the ''Adsats'' reveal cases
    of chamchori were handled by the state, whether the case was between a member
    of the same caste or a lower caste woman with the higher caste man and vice versa.
    Imposing monetary fine seemed to be the standard way in which the state dealt
    with cases of chamchori. The amount of fine levied varied according to the gravity
    of the crime as perceived by the state although at times the fine appeared to
    be arbitrary.


    Despite a certain amount of arbitrariness, the state did not try to soft-ped the
    issue. In general, we also find that the state did not display any communal bias
    in meeting punishments for such cases. Remarkably, in most cases, it was men than
    women who were punished. Although all cases were equally punished by imposition
    of a fine on them, the upper castes seem to have paid lesser amount than the middle
    castes—an indication of caste bias of the state that is revealed even in revenue
    administration.


    A study of the cases of chamchori reflects that it was more pervasive among the
    Brahmin women and Bani women. Among the Baniyas, it can be explained in terms
    of the practice of the husband to travel for trading purposes, resulting in both
    men and women meeting their emotional and sexual needs outside marriage. As to
    why Brahmin women and women of other upper castes could not remarry, women were
    involved to a greater degree, one can conjecture that as Brahmin widows and women
    of other upper castes they indulged in this kind of sexual behaviour. What it
    reflects is that these upper caste women did not remarry, they did not lead the
    life of a celibate widow or a tapsasini.


    In medieval Rajasthan, the cases of chamchori within the family were generally
    heavily fined, but within there seems to be some variation. It is clear that there
    was frequent prevalence of illicit sex and rape within the family.Despite the
    severity of the fine imposed, the number of cases of chamchori reported were quite
    high. If we go by the large number of reported cases, it seems that chamchori
    were rampant in society, at one time going up to 50 cent of the reported cases.
    There may have been a large number of unreported instances too. If notions of
    family honour and chastity had been so strongly related to women’s fidelity and
    chastity, such matters would probably not have been reported.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Conclusion


    The state did not allow the priestly class to play a significant role as the upholder
    of social and marital morality. The state had its own ideology by way of which
    it meted punishment to the people. But there always existed a difference between
    the idealized family life and marital morality of the state and the actual ground
    reality.


    The state not only settled matters relating to chamchori, but also relating to
    marital disputes. Thus, the institution of marriage occupied a key position in
    the state ideology; it was an edifice through which social order could be maintained.
    In the absence of any textual injunction, the state did arbitrarily in certain
    cases. Also, different states may have perceived the offence differently. Besides
    the state, the village and caste panchayats were seen to be regulating the norms.
    Mostly, the relationship between the local panchas and the state was complementary,
    yet the final arbitrator was the state.Therefore, there was a degree of fluidity
    and flexibility as the marital norms of this region were concerned, as they were
    not regulated by any textual injunction or Brahmins.


    In cases of domestic violence among the elite, the women protested in their own
    way, by deserting the husband or inciting their brother or father to avenge their
    humiliation. For the other sections of society, it is difficult to come to any
    conclusion on the basis of stray reports. Physical violence was prevalent, yet
    it may not have been reported as was not perceived and the state does seem have
    paid inadequate attention to this issue.


    Therefore, the study of marital morality of Rajasthan, besides high-lighting the
    multicultural ethos of India also reveals variations within a region. It raises
    question on the application of the norms of the Dharmashastras in a pan-Indian
    sense. Whatever textual injunctions were related to women of upper sections, we
    can see the reality being different from the norms that were laid down. We come
    across several examples of upper-caste women not adhering to the norms.


    Finally, what becomes clear is that there is always tension surrounding the definitions
    of gender roles. Obviously individuals at all times and in all cultures have experienced
    a varied degree of difficulty in assimilating the prescriptions of expected behaviour
    whether it is related to marital fidelity, sati, or the behaviour of a widow.
    We cannot interpret history in monolithic universal terms, ignoring the differences
    in culture. Needs of women who live in different countries are dissimilar and
    conditioned by several factors—familial, societal, racial, marital, economic,
    cultural, and individual consciousness.'
