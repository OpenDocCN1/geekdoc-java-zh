    denotes illegitimate sex, whether it is marital or extramarital, and deviant form
    of sex as rape, homosexual encounters, and incest. There are instances when the
    term journeys (rape) is also used. ‘The Sanad Parwana Bahi’ also gives us information
    of cases of illegitimate sex among various caste categories. Another source of
