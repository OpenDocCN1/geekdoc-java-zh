  md: '# Political and Social Structure of Medieval Rajasthan


    by the different Rajput royal houses. In fact, mighty claims by the Rajput ruling
    families may be seen as an attempt to get away from the actual origin rather than
    reveal it. The new social groups continued to seek various symbols for legitimization
    of their newly acquired power. After all, category of Rajput such as other varna
    categories have been assimilative in time and space.9


    In medieval period the continuing process of formations of Rajput clans was through
    the acquisition of political power. Apart from the subdivision of major clans,
    the emergence of various minor clans was another important aspect of the proliferation
    of the Rajputs. All these clans were drawn up into Rajput political network in
    a variety of ways.


    The bardic chronicles of Marwar state that Dharanivaha of the Parmara dynasty
    of Abu himself master of the Navkot Marwar he divided among his nine brothers—Mandover
    to one brother, Ajmer to the second, and so on. The Chahmans of Shakambhari branched
    off Chahmans of Mandal, Jalor, Satapura, and Abu. During the five centuries of
    their rule, they exercised control over a vast region in West Rajasthan and Gujarat.
    Mandovar, the capital of the Parihar was the chief city of Marwar. The Rathore
    emigrant of Kannauj found asylum with the Parihas. They repaid it by treachery
    and Chuda, a name celebrated in the Rathore annals who dispossessed the last of
    Parihas and pitched the flag of Rathore in Mandawar.10


    The post tenth-century scene in central and western India saw the rise of numerous
    powers, who claimed to be Rajputs and many of whom were feudatories of the Gurjaras
    and Prathiharas.The emergence of these Rajput families is linked with an increase
    in land grants and consequent new land relationships. They were also the production
    of fusion of foreign and local elements. The different Rajput clans constructed
    their fortresses on a large scale, which was a symbol of their power. Inter-clan
    marriages amongst some of these Rajput families led to social and political implications.


