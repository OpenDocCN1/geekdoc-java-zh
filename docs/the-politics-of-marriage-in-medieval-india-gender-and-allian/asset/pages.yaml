    A fundamental question regarding the practice of sati in medieval India is whether
    it was voluntary or obligatory. Whether the wives willingly sacrificed their lives
    or were forced to do so. Can we consider their act in terms of ‘options’ bound
    as they were by religious, economic, and social constraints? The specific reasons
    for their sacrifice cannot be fully determined from their perspective because
    their voices are not present in the historical documents.


    Contradictory evidence furnished by foreign travellers as well as other historical
    documents makes it difficult for us to pronounce a definitive answer. Abu Fazal
    divides sati into different categories: those who of sheer love for their husband
    consigned themselves into the flame, those from fear of reproach consented to
    burn, those who were swayed by family considerations and customs, and finally
    those who were actually forced to burn with their deceased husband.^46


    In our region, we come across numerous instances of voluntary sati being committed.
    According to the medieval custom, sati was not permissible under certain circumstances.
    Nevertheless, we women devising Pabuji’ wife, Sodhi was seven months pregnant
    when her husband died. She was advised not to commit sati on account of this,
    but she took the child out from her womb and gave it in the care of a Charan and
    became sati.^47 Although there is an element of exaggeration in this, the point
    to be noted is that the Rani was determined to become sati despite being dissuaded.


