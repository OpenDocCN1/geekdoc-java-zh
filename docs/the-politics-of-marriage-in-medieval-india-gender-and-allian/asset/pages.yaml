  md: '# Introduction


    cover a period between eighth and seventeenth centuries, almost the entire period
    that I have taken up for study. Covering such a vast time frame means that considerable
    part of the work must be based on hearsay and partly on experience. But the salvaging
    factor is that Nainsi is clear about the information that he gives, whether it
    is hearsay, *parampara* (tradition), or historical fact.


    Also, Nainsi wrote for self-satisfaction rather than royal patronage, therefore
    to a large degree, the information that he gives us objective. He does not hesitate
    to uncover or highlight the dark facts of Rajput life either. We must remember
    that when Abu Fazal wrote his text, he had several texts at his disposal which
    he could study and write, whereas Nainsi was largely busy with administrative
    tasks.


    The *Khyats* of Nainsi are extremely significant as they describe numerous incidents
    pertaining to the Rajput elite family. Beside, there is also discussion on the
    political activities in the *Khyats*. There is information on polygamy among the
    rulers, the rivalry between co-wives, on sati and widow remarriage, and on sexual
    morality. Although Nainsi basically confined himself to the Rajput aristocracy
    and their customs and practices, he does give reasonable information about the
    other sections of the society. In fact, his *Khyat* is in the form of a catalogue,
    and it is for us to analyse his narrative.


    Another important source is the ‘Report Mardumhumari’, which is an official compilation
    of customs and practices prevalent among various castes and communities, including
    the tribes, who were residing in Marwar. This was written in the beginning of
    nineteenth century. Although it is not contemporary, it is very useful and reliable
    information on various customs and practices followed by each and every caste
    residing in the state of Marwar. It also contains plenty of information on *nata*
    and *gharecha* (remarriages).


    Tod, the first British agent to Marwar, towards which he was favourably inclined,
    is known as the chronicler of Rajput history, but it is the Nainsi interpretation
    of *Rajput-Mughal* relationship that is reflected in his monumental volumes, *Annals
    and Antiquities of Rajasthan*. Tod''s account of the legend of Rana Pratap reflects
    the literary sources and oral traditions in Marwar in the early nineteenth century.
    The *Annals* contain a stringent denunciation of those Rajputs who bartered away
    their daughters and their ‘honour’ for Mughal power and wealth. Rana Pratap by
