    fidelity between husband and wife, I have also looked into the cases of domestic
    violence, rape, and incest. The cases of deviant sexual behaviour were generally
    referred to as chamchori (deviant sexual behaviour) and an attempt has been made
    to study cases of chamchori between same caste people, men of upper caste with
