    of the role played by the trading community in this region throughout the period
    has been examined. Role of other caste groups such as the Jats and Kayasthaas
    has also been examined and so has the role of the tribals such as the Bhils and
    the Meenas. Ultimately, how the state emerged stronger and started playing a significant
    role in maintaining the caste boundaries of the society evident.


    In Chapter 2, ‘Socio-Political and Economic Aspects of Marriage’, the motive behind
    marriage has been investigated, as this can change from one historical period
    to another. This chapter largely pertains to the elite and ruling class, for whom
    the motive behind marriage was largely political. The political aspect of marriage
    was most dominant as compared to the socio-economic aspect. Throughout the period
    we get examples of political marriages, although in the initial period of state
    formation, when marriages were used for enlarging one’s territory, ending enmity,
    and for increasing power and status, this aspect was more evident. The reaction
    of women to such alliances, to what extent familial relations were subordinated
    to political considerations, and how such considerations led to the institutionalization
    of the practice of polygamy have also been looked into. Also, we look into how
    in a period of incessant warfare, the victor compelled wills and other women of
    the subjugated family to marry them—a way of exercising power. How far did the
    notions of honour motivate alliances? What motivated the families to give their
    daughters to the Muslim rulers despite the fact that they had started adhering
    to strict caste endogamy? How did political marriages come to play a significant
    role in the consolidation of Mughal rule? Lastly, what was the degree of social
    acceptability of these marches, and here the notion of honour played an important
    part in the degree of opposition to the Mughal alliance. The major source that
    I have used for this chapter is the Vat and Khiyat (chronicles) which largely
    focus on the Rajputs. This has been done not by choice, but by the nature of information
    available. Sources for the alternate castes are not available.


    Despite the predominance of political motives, the rituals were always observed.
    Chapter 3 has been divided into separate sections under different headings as
    ‘Interpretation of Marriage Rituals in Medieval Rajasthan’. Under this, I have
    tried to examine how the ceremonies and rituals of marriage helped in maintaining
    the caste identity of the families, how the authority and superiority of a particular'
