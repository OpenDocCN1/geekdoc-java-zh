    by Sawant Singh, the Bhomia of that village.^83


    Also, for a long time sociological and historical works have seen the performance
    of the act of sati between two options—either the glory of sati or the wretched
    life of a widow. This is reflected not only in the Dharamashastras, but also in
    modern sociological works. According to the Dharamashastras, the view towards
    widow is diametrically opposite to that of sati. The traditional view of the widow
    was that of a tapasvini (ascetic). The word tapasini idiomatically used to connote
    an unfortunate female. The *vidhua* (widow) was considered to be inausicious.
    Thus, widowhood of a woman entailed spiritual misfortune and implied the temporary
    absence of dharma in relation to the family. The lineage and community too had
    to share the blame for this *adharma* (unrighteous).^84


    Sati and widowhood did not constitute equals. From the moment of decision, the
    sati was considered auspicious, and the widow, from the moment of her husband''s
    death became inauspicious. Everyone in the village gathered to witness a sati''s
    holiness, whereas everyone considered the sight of the widow as inauspicious.^85


    Most works have assumed that a third option, of widow remarriage, was not open
    especially to the women of upper caste. We find that in our region the word that
    used for widow is rand which is also a derogatory word, used for women who are
    perceived of loose morals and the little proverb portrays that for a married woman
    there is no bigger curse than to be a widow.^86


    Our archival sources, however, indicate that widow remarriage was a well-established
    practice in our region for the middle and lower caste.


