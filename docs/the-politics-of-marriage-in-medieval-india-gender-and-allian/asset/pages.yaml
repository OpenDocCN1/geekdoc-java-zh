    by the state, caste panchayat, and local community rather than by Brahmins or
    any textual injunctions. The state viewed marriage as sacred, as a unit for maintaining
    social stability. Therefore, any deviance was punished by imposing fine and dissolution
    of marriage was generally not allowed.


    Of course we find the state acting arbitrarily in certain cases, although it does
    not reflect any caste in dealing with cases of marital dispute. However, cases
    of adultery and infidelity by large did not lead to a marital breakdown as it
    did in Europe, not only because the state did not allow it, but also because society
    did not view it as something insufferable whereas the chastity of the women had
    defiled. Therefore, one cannot really talk of a pan-Indian morality which feminists
    talk of the treatment of Sita. Also, morality and values remained flexible from
    time to time meant different things for different section of the society. Also,
    different states had different set of laws to deal with deviances in marital morality
    and were not based on the textual injunctions.


    Besides the state, the village panchayat and caste panchayat were seen to be regulating
    the marital norms. The relationship between the state and the caste panchayat
    was interactive in the sense that the state would seek the assistance of the pancha
    on matters. Alternately, when the local community was not able to handle a matter,
    they would appeal to the state.


    The relationship between the state and local panas was complementary rather than
    competitive. But the final arbitrator was the state The role of the state was
    not limited to maintenance of law and order collection of revenue; it exercised
    effective control over societal matters too. Ultimately the gender and moral codes
    were not merely an arrangement of the society but were also reinforced by the
    state power. It is not in vain that Louis Althausar proclaimed family to be one
    of the most prominent ideological state apparatuses. The family is able to adapt
    to society by ensuring that the function necessary for maintaining societal power
    structure are performed within it.'
