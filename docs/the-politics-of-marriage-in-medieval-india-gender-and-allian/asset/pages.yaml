    I have examined the concept of stridhan (gifts given to the bride) and dowry and
    the effect these practices had on women in the subsection on ‘Dowry’. I have tried
    to understand the complexity of the mar-riage gift in its historical perspective.
    What are the changes that have occurred in the concept of dowry? What were the
    actual things given as dowry, as it must have varied according to the status of
    the family? Did the amount of dowry affect the status of the woman at in-laws’
    place? What happened in cases of inability to pay dowry? Why did dowry keep increasing
    popularity? Another significant aspect I have looked into is the tension and conflict
    that the payment of dowry may have generated within the family of the bride, taking
    it to the realm of interpersonal relationships. Besides this, the other cus-toms
    and practices which have been examined, with special emphasis on the ruling class
    (that is, Rajputs), are practices such as ‘hypergamy, polygamy, and concubinage.
    What were the factors that were linked to it and what were the various implications
    of such practices?


    No work on the institution of marriage in Rajasthan would be complete without
    reference to the practice of sati and widowhood as, today, Rajasthan continues
