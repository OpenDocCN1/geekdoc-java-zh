  md: '# Introduction XXV


    face of adversity or temptation to sacrifice the independence of Mewar or to submit
    to the degradation of uniting his family to the Tarter. The intensity of the moral
    feeling in Mewar had to be associated with the issue of Mughal Rajput marriages
    as well, reflecting in Tod''s gloating account of Mewar''s renewal of marriage
    alliances with Jodhpur and Amber.^3


    It is ironic that ever since their publication in 1829–32, Tod''s Annals which
    were translated into Hindi in 1025 and are very widely known in Rajasthan, have
    been regarded as a primary source concerning Rajput history and tradition. The
    pervasive inaccuracy of Tod''s historical account usually is not recognized, nor
    is the Mewar orientation of the Annals generally perceived as such. The continued
    influence of the Annals is a major factor shaping twentieth-century Rajput attitude
    towards the Mughal–Rajput alliances.


    The Mewar tradition also shapes the writing of Vir Vinod by Shyamaldas, often
    termed the first modern historian of Rajasthan, for its use of contemporary documents.^4
    However, Shyamaldas was also an official in the Mewar court and tried his best
    to get information from other Rajput states. He also drew heavily (and uncritically)
    from the literary sources, and incorporated the legend of Rana Pratap and similar
    material extensively into his volumes. Shyamaldas''s discussion of Mughal–Rajput
    marriages is defensive and not entirely consistent.


    So long as the Rajputs and those who identify with them consider events of sixteenth
    century to have a direct bearing on their own standing, and so long as the marriage
    of their daughters to Muslims is seen as dishonurable, the successful diplomacy
    of the Amber, Bikaner, or Jodhpur Rajas, who were Akbar''s contemporaries, is
    likely to have few Rajput defenders, even among the direct descendants of Rajasthan.
    In such circumstances, a dispassionate examination and interpretation of the historical
    record is difficult. The facts are grounded too firmly to be denied entirely,
    but no matter how extensive the documentation, there will still be many who regard
    the Mughal–Rajput marriage alliances as shameful skeletons in the closet of Rajput
    history


