    # HYPERGAMY, POLYGAMY, AND CONCUBINAGE


    We find the institution of marriage going through different stages of development
    along with historical evolution. At certain stages of historical development,
    certain aspects of marriage developed more importance than others. In the agricultural
    stage of social evolution, marriage was an extreme necessity in every group of
    individuals for economic and social stability. Society then was in need of manpower.
    The importance of male children had grown to such an extent that all male children,
    including illegitimate ones, were accepted by the society. In RigVeda, there is
    mention of the procurement of immortality through son. The desire for male progeny
    is equally true of medieval Rajasthan. Among the Rajput aristocracy, this preference
    was due to a different set of factors. We have seen the rulers, chieftains, and
    vassals were constantly busy in warfare, either in defence or in expansion of
    their territories, and there were occasions when three generations were killed
    in a single war. Therefore, for the elite Rajputs the institution of marriage
    was necessary to produce warriors for future battles. As a result of this, women’s
    reproductive role in medieval Rajasthan society—especially among the Rajputs—was
    extremely important. Also, when other considerations of marriage were completely
    subordinated to political motives, it did not really matter that the groom already
    had other wives. Polygamous marriages of most Rajput rulers and chiefs were one
    way of maintaining political network of sagas which could always be called upon
    in an emergency.


    Among the aristocracy we find the practice of polygamy right from the ancient
    to the medieval period, although it may have existed in different periods for
    different reasons. Although the Vedic ideal of favoured monogamy, in spite of
    this ideal we find the royal marriages having more than one wife. In the post-Vedic
