    mind and the body. In the early and central Middle Ages, clerical moralists reckoned
    sexual union nearly always had some element of sin in it, that it was only justified
    by the desire to have children. That it was moral so long as there was no pleasure
    in it. In the middle and late Middle Ages, the whole atmosphere slowly changed,
    the union of marriage came to be much more sacramental in the eyes of the theologians,
    and sexual union was more readily accepted as the essence of marriage.^1


    The Indian and Chinese cultures have held sexual relationship between male and
    female as primary manifestation of the universal union of opposites from which
    all existence is created.Therefore, we have the concept of ''Shiv'' and ''Shakti''
    and the Chinese yin and yang. Our understanding of sex and sexuality comes primarily
    from the ''Kamasutra'', ''Tantric traditions'', and ''Ayurved''. In the Kamasutra,
    kama (earthly pleasure or passion) or desire is stated as one of the three great
    aims of life, but must always be pursued in harmony with the other dharma (duty
    or righteousness) and artha (pursuit of economic benefits). Although, the realities
    may have been different as sexual morality continued to change over a period of
    time.


    It is in this context that I would like to examine the sexual norms and mores
    present in the society of medieval Rajasthan. What were the perceptions of pre-marital
    and extramarital sex? What were the ideas of shame and honour linked to the women''s
    bodies? What was the degree of domestic violence against women? How did the state
    and society perceive incest? Marital relations between blood relatives may be
    a taboo in one community, although the same does not transgress any barrios in
    a number of other communities.What was the regulating agency as far as these norms
    were concerned and what happened to people if such norms were flouted? Was there
    any textual injunctions laying down such norms.What was the role of religion?
    As in medieval Europe, we see the church playing a major role in regulating such
    norms.Was there any sexual egalitarianism or was patriarchal dominance present?
    It is in the resolution of such questions that attitudes to such social forms
