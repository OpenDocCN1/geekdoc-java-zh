    Under the subheading of ‘Marriage Customs and Practices in Medieval Rajasthan’,
    the significance of the engagement ceremony has been looked into, such notions
    of honour attached to it, especially among the Rajputs, and how breaking of the
    engagement was per- ceived by the people of different communities. I have also
    examined the age of marriage in medieval Rajasthan, which has consid- ably from
