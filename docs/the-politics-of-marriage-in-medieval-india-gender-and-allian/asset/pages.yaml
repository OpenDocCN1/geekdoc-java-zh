  md: '# 3 Interpretation of Marriage Rituals in Medieval Rajasthan


    In the previous chapter we have shown the practical side of marriage which was
    hardly a sacrament but a way to realize political ambition. Yet, the religious
    rituals always followed. Therefore, in the writing of any social history, the
    study and analyses of rituals becomes essential to understanding society, as rituals
    arise out of society’s collective history and culture. Ritual hold subtle meanings
    and reflect beliefs about world. Certain beliefs and customs are ritualized, thus
    preserving them as aspects of culture, and become means of reconstructing realities.
    Marriage rituals replete with its essential features constitute a socially integrative
    function helping to cement and unify the bonds of belonging and brotherhood, forging
    a shared identity while also contributing to the continuation of the tradition.


    Study of specific rituals also throw light on the possible connection between
    gender and other forms of social differentiation. Rituals become status-confring
    activities. For example, the Upanayans (wearing of the sacred thread) rite in
    the Dharmashastras reiterated the hierarchical nature of the varna-based society.
    This is apparent from the variations found in the rituals on the basis of varna.
    While all who performed the rite acquired dva (twice-born, referring to the upper
    caste) status, not all dvjas were equal. Hierarchical ideals are also manifest
    through the exclusion of women and shudras from access to the rite. Many of crucial
    statements about ideal relationships and power were communicated through the Upanayans—between
    men and women, between older and younger, and between men belonging to various
    varnas.'
