  md: '# 206 The Politics of Marriage in Medieval India


    more in the attitude towards sex than any particular political ideology. It seems
    to be one of the characteristics of people faced with rapid social change to yearn
    for a return to a supposedly golden age of decency, discipline, and propriety.
    It provides a yardstick with which to judge the present, usually revealing, more
    of our present discontent than the past realities.


    Also, the very mobility of sexuality, what that for one might be a source of warmth
    and attraction for another might be of fear and hate, makes it a peculiarly sensitive
    conductor of cultural influence, hence of social and political divisions. Not
    surprisingly therefore, especially during the past century, sexuality has become
    the focus of fierce ethical and political divisions, between traditional moralists
    (of various religious hues) and liberals, between the high priests of sexual restraint
    and the advocates of sexual liberation, between the defenders of male privileges
    and feminists who challenge it. Increasingly over the past decades, sexual issues
    have moved closer to the centre of political concerns, where on one hand one political
    group mobilizes political energies through its emphasis such as an affirmation
    of the sanctity of life, hostility to homosexuality and sexual deviance, opposition
    to sex education, and reassertion of ''traditional values''.


    On the other hand are the feminist and other radical sexual movements challenging
    many of the received norms of sexual behaviour, identities, and relationships.


    The increasing politicization of sex in the past century offers new possibilities
    and consequent challenges, not just of moral control and its inevitable converse
    sexual deviance, but of political analysis, opposition, and change. This makes
    it all the more necessary that we know what we are talking about when we speak
    of sexuality, to clarify the meaning (or more accurately meanings) of this complex
    phenomenon. Sexuality being a product of social and historical forces, what we
    define sexuality as a historical construction, which brings a host of different
    biological and mental possibilities—gender identities, bodily differences, reproductive
    capacities, needs, desires, and fantasies.


