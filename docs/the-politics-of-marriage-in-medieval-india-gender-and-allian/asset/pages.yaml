    # MARRIAGE CUSTOMS AND PRACTICES


    The customs and practices followed in Rajasthan may have at times varied from
    one state to another but the general customs related to marriage were quite similar.
    Most of these customs and practices were either based on local traditions and
    were largely regulated by the village panchatsats the local Bhomias, as well as
    the state.


    The ritual concerned with engagement has already been discussed earlier. The system
    of having engagement before marriage seems to have been prevalent among all the
    classes. As marriage was considered a sacrament (at an ideal level) among the
    ‘Hindus’, and therefore insoluble, perhaps engagement brought about an element
    of flexibility before the finality of marriage. They may have helped in sorting
    out differences between two families and in the worst case, by breaking an engagement,
    marriage could be saved. But at the same time breaking of engagement was neither
    frequent—as in Europe—and in the medieval Rajasthan society we found that it was
    frowned upon by all sections of society.


