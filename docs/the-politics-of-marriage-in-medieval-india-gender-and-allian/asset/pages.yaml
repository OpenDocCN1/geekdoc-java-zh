    There is no mention of sati in Manu (a Smriti) which otherwise has a disparaging
    view of women). Further, suicide is a sin as also is the killing of women. The
    widow who lived a celibrate life and prescribed sacrifices for the dead husband
    was living according to the injunctions of the Smritis. Yet, the earliest reference
    of the practice in the Sanskrit texts may be found in the Mahabharata. An account
    is also given in the first century BC by the Greek author Diodrus Sicules who
    wrote the history of Punjab in the fourth century BC. Sati stones (memorial to
    women who died in this way), may be found all over India dating from as early
    as 510 BC.³


    The term ‘sati’ has a wide semantic range, encompassing the action of a woman’s
    immolation following the death of her husband, to the woman herself, or to sati
    as a goddess. In English, the first meaning is defining; deining English usage
    sometimes makes sati the object of the verb ‘to perform’ or the verb ‘to commit’.
    In its origin, sati is a Sanskrit feminine derived from the verb ‘to be’. Hence,
    sati is a good woman; and, according to classical Hindu formulations, a good woman
    is devoted to her husband, sati came to mean a truly faithful wife. The concept
    is that the true devotion of a wife to her husband, her moral ‘truth’ (satisaty)
    becomes pregnant at the moment when she becomes a sati, though the virtue existed
    long before. This is the moment at which virtue becomes fully visible. Thus, in
    Indian languages one generally speaks of ‘being’ or ‘becoming’ sati and not ‘performing’
    or ‘doing’ sati. In Sanskrit, the practice and the person are generally differentiated;
    the words sagagamana (going together with) or anagamana (following after or dying
    after) denoting the practice, and the word the person.⁴


    Besides sati has a third dimension, in that also refers to the goddess. On the
    one hand, sati is the wife of Siva, who immolated herself in the sacrificial fire
    of her father Daksha. But those referring to sati as a goddess are not generally
    referring to the goddess sati, but are using the term to refer to ‘real’


