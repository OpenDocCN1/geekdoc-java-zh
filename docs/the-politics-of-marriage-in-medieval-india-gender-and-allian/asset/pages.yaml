  md: '# Introduction


    The history of marriage must be viewed at two levels. It is a piece of social
    history related to the whole pattern of customs, laws, relations, and aspirations
    that lie at the centre of the history of family life. But it is at every point
    deeply affected by the inner life full of variety—tragic and comic, romantic and
    very unromantic, and a tale of joy, suffering, and humdrum—most of it hidden from
    the historian''s eye. Therefore, for the study of the institution of marriage,
    there are varied aspects that need to be looked into, which will help reconstruct
    social structures and cultures. The specificity of regional social reality persists,
    adapts, and innovates, despite textual normative ordering and historical upheavals.
    Two dimensions clearly emerge in this process. First, we need to focus on the
    regional construction as distinct, but as a part of wider holistic constructs
    of Indian society. Second, we need to look at the significance of constructing
    a history based on actual folk reality and actual documents, revealing the ongoing
    process of different social groups of intra- and inter-regional levels.


    Also, the time frame for defining ''medieval'' needs an specific dates that can
    be used for earmark the beginning and end of the period, as social and cultural
    histories cannot be defined by specific dates. But by medieval India, I largely
    mean the India contemporaneous to the pre-Sultanate and Sultanate, Mughal and
    post-Mughal period. Therefore it would approximately date from the eighth to the
    eighteenth centuries.


    One of the most significant cultural legacies of around a thousand years stretches
    in Indian history between the seventh and eighteenth century. Medieval India,
    as it is constituted now, is a large number of histories. The tripartite division
    of Indian history based largely on dynastic history to the debate on feudalism
    with conceptualization of early medieval India, in some ways, expands the temporal
    domain of medieval India, but more importantly, emphasizes the search for transition
    in the socio-economic sphere. Important and comprehensive developments during
    this period laid the foundation of what was to characterize medieval Indian social
    and economic structures and to a large extent even state formation. The 1990s
    brought Indian historiography on the verge of another threshold with emphasis
    on social and cultural profiles, power relations manifest in everyday life within
    the family, interpersonal relationships, ideas about gender, and the study of
    space and time in historical contexts.'
