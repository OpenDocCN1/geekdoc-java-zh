  md: '# Political and Social Structure of Medieval Rajasthan


    ideology was highly responsive to economic and political conditions. In most societies,
    new elites and new classes adopted the conservative styles of thought of the old
    order.^{128}


    Therefore, we can see that the problem of understanding the structure of the medieval
    Rajasthan polity and society from the early medieval period to the later period
    remains quite acute. The emergence of a large numbers of ruling classes conceptualized
    through the use of Kshatrizat and Rajputization explains the link between the
    Brahmanical ideology, emerging reality, and invocation of the normative order.
    Once the new state emerged, it started regulating the social institutions such
    as caste by laying down rules against inter-caste marriages, establishing a two
    way between different levels of polity from the village society to the apex power.


    On the basis of the reconstruction of the political and social history of Rajasthan,
    one can see that there were different stages of expansion of political power and
    the stages in which various classes to ancestral respectability were made. Local-level
    ruling class families developed into regional dynasties through the process of
    integration of local chiefs and other prominent social groups into the emerging
    political structure. Clans and lineages were open and fluid social networks, especially
    at the lower end, in a continual process of renewal through interaction and matrimonial
    alliances with different castes and in their search for power and resources especially
    after the conquest of new zones. The historical process of Rajasthan indicates
    that the structure of society was constantly in a flux and was certainly not based
    on the traditional alliances of the varnas. There was an emergence of numerous
    castes and sub castes based on birth, heredity, occupation, and class privileges.
    These features rendered the social organization, a complex and compacted framework,
    built around the traditional caste system.


