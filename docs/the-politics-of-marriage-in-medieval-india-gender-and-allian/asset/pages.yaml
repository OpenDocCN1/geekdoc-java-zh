    of Rajput society.7


    I have also gone into the local sayings, that, Rajasthani Khawate. Although one
    cannot situate the sayings and proverbs in a specific time frame, they remain
    extremely significant as they give us an idea of a specific region, its people,
    traditions and customs, and ideals and social organization.


    Besides these, there is also the folklore or folk literature, which help us to
    join the past with the present. Rajasthan Virnatamak Paravehe Sarachana Ewam Lok
    Parampara by Usha Kastariya mirrors the culture of that period and region. The
    main stream in the story is average incidents and traditions. Any one historical
    event can absorb many geographical local and cultural changes and then reach its
    present shape. What in England can be called folklore in Rajasthan. Lokvarta,
    however, is clearer in the picture it presents and is more emotive.


    In fact, the Paravehes can somewhat compared to the English ballad, basically
    meaning songs that were sung with dancing. Paravehes can also be sung but their
    story line is not simple and has several stories strung together, therefore they
    are lengthy. In fact, some Paravehes are so long that they are even called Lok
    Mahavakya. The main points of the Paravehes are historical and because it was
    a part of oral tradition, some historical facts were added to it. When dealing
    with women, centrality is given to her sattiva (loyalty to her husband). Most
    of the stories resolve around sacrifices made by the women. The newly-wed wife
    of Galangal, Gogahi''s wife Kelande, and Sultan''s wife Nehalde are unforgettable
    characters. In fact, the story of Tultan and Nehalde belongs to the fourteenth
    century when Muslim names became prevalent among the Hindus and are all mentioned
    in the Paravehe. The new sources and the reinterpretation of the old has enabled
    us to know about the marriage practices of a wider social group.


