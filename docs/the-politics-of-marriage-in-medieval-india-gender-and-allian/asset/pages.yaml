    The four centuries between eleventh and sixteenth century saw a great explosion
    of the Jat population. Apart from the development of the irrigation technology,
    the kings in Rajputana also contributed to the expansion of Jat settlements. The
    ''Bahis'', especially the ''Patta Bahis'' and ''Sanad Parvana Bahis'', provide
    a great deal of information pertaining to the settlement efforts of the state.
    The Marwar ta Pangana Virigat is replete with documents accounting for the settlements
    of Jats in parts of Western Rajasthan. Thus, in Western Rajasthan the process
    of colonization by land wents emerged simultaneously with the process of state
    formation. Jats being good agriculturists flourished in numbers. Necessity led
    to the development of a symbiotic relationship between the Jats and the state.
    The state required the Jats for colonization of land and the Jats needed the state
    to legitimize their claims over land, which the state could do by granting patta
    of the land. Generally, the Jats emerged as primary cultivators and a vital caste
    in the rural social structure of Western Rajasthan, where they were numerically
    dominant as compared to the Eastern and Southern portions of Rajasthan. Due to
    the lower ritual rank in the caste hierarchy, the Jats were exploited by the Rajputs
    and in this turn made the Jats sensitive to their caste identity.99 This caste
    had its own peculiar customs regarding commensability, marriage rules related
    to widows, and so on. Being numerically superior, Jats were regarded as at the
    middle and lower end of the caste hierarchy and as mentioned earlier, the Rajputs
    were also depressed into cultivating castes. During the period of state formation,
    the Jats and the Ahirs were invited from other areas to settle in Marwar and were
    also appointed ''desh chaudhries'' from fifteenth century onwards. There were
    numerous of territories which were unhabited and called Khalidesh. Therefore,
    state formation was partly through conquest and partly through colonization.


