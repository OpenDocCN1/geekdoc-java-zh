  md: '# The Politics of Marriage in Medieval India


    Although not on a large scale, we get examples of women of castes other than Rajput
    committing sati, and the factor responsible was certainly not the lack of widow
    remarriage. In fact, remarriage was such a well-established norm that the state
    derived an income by taxing these marriages.The''Asattasa'' are full of references
    to hasil garecha (tax on remarriage) from various parganas. Gharecha, nata, palla
    lagana or gharvasa, the terms used for remarriage, is found to be prevalent among
    all the middle and low castes of Rajasthan. We find instances of nata among the
    Jats, Bishnois (agricultural castes) among bangle makers, utensil makers, calico
    printers, goldsmiths, and also the menial castes.


    Also, we can view a distinction between primary and secondary marriage. Primary
    marriage connotes a marriage with full rights of a virgin with a man from an appropriate
    caste group. A woman goes through such marriage only once in her life. Her subsequent
    marriage may have social status and she may continue to use all the signs of a
    married state but she has permanently stepped outside the bounds of primary marriage.
    These unions were not solemnized through full-blown rituals but socially declared
    through symbolic or truncated ceremony which included presentation of glass bangle
    or nose ring to a woman''s head, symbolic of the woman now being protected by
    a man. We can see that throwing of cloth over woman''s head signifies marriage
    status that only notional marriage rituals were followed. The term used for remarriage
    can be any of these: chadar dalana, ghar mein bithana, palla lagana, nata karana,
    or gharecha and gharwasa as is often used in our region.


    The distinction between primary and secondary marriage again can be gleaned from
    the popular proverbs of this region, which reflects that remarriages or nata not
    really seen as an ideal situation, especially when all the Vedic customs had not
    been followed.87 But, as we already know, there was always a difference between
    what was ideal and what was practically feasible. This distinction probably centres
    on the concern with family purity and management of female sexuality. It is sought
    to be bestowed by special value to primary marriage and a low status to a secondary
    union. It was considered a concession to human weakness without seriously undermining
    the boundaries of caste.


