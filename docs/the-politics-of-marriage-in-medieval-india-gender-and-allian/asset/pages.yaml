  md: '# Introduction


    These problems by their very nature defy tight, temporal straitjacket. Explanations
    along these lines may lead to a far more effective questioning of the tripartite
    division as has hitherto been possible. Also, historical changes are not uniform
    or identical in space and time. Therefore, it not requires us to re-examine our
    notions of periodization, but it also does not allow any periodization. Transitions
    often carried over features from one society to another. Therefore, generalization
    about the nature of society in any given area is a very complex matter. Hence,
    regional studies as well as studies covering variations within the region are
    important.


    The existing historiography regarding the social history of this period is extremely
    meagre. In fact, no work has been done on the institution of marriage as such.
    There are some works in which references have been made to marriage practices.
    As far as the secondary sources concerned, reference can be made to G.N. Sharma''s
    *Social Life in Medieval Rajasthan 1500–1800*, the only modern work where a broader
    study of the society of this region is attempted. But his work is more of a simple
    portrayal of social life based on caste. Besides, the author hardly throws any
    light on the middle and lower castes. He has made some general statements, which
    are not empirically corroborated. Moreover, his account of marriage is quite sketchy
    and therefore not very useful.


    Shashi Arora''s *Rajasthan mein Nari ki Stithi (1600–1800)* is an attempt to study
    the position of women of various sections of the society. She has used copious
    archival data as corroborating evidence. Despite this, she has tended to accept
    what G.N. Sharma has say and has not put any new concepts. She certainly has dealt
    with marriage in a detailed manner, but only so far as it affected the position
    of women, and does not go into the details of other aspects of the institution
    of marriage.


    Rekha Mishra''s *Women in Mughal India 1526–1748* has also touched on some aspects
    of marital alliances. Although she devoting one chapter to the position of middle-
    and lower-class women, her main emphasis is on the upper-class women, and the
    information available to her is not very satisfactory.


    Another work on Rajasthan dealing somewhat with this aspect is the book by Shanta
    Rani Sharma, *Society and Culture in Rajasthan c. 700–900*. Her chapter, ‘Social
    Structure and Family, Marriage'
  merge: -1
  pgno: 12
