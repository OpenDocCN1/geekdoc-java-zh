  md: '# The Politics of Marriage in Medieval India


    The feudal model has been perceived as a highly decentralized and fragmented political
    structure in the post-Gupta period. The multiplicity of regional powers and the
    absence of power of pan-Indian stature have been explained as a part of feudal
    social formation. A major departure from the base formulation was offered through
    the application of the idea of ‘integrative polity’ to the study of state formation
    and structure, essentially looking at the model of state formation as processual.^7


    Kulke questioned the very basis of political decentralization of the post-Gupta
    period, which fails to explain the growth of the great regional kingdoms and long
    duration of the rule in certain cases. He rightly observed that the period of
    decentralization in northern India coincided with a very intensive process of
    state formation on the local, sub-regional, and regional level in some parts of
    Northern India, in many parts of Central India, and in most parts of South India.


    B.D. Chattopadhyay who noted the two bases of formation in early medieval India,
    illuminating the composition of the so-called feudatories. The emergence of the
    overlord or feudary had its basis mostly in the power of local ruling elites,
    the transformation of the lineage into regional power was through the command
    of the military resources and other forms of support from other lineages.


    Secondly and more significantly the command of military resources and allegiance
    not only called for a system of ranking, which was based on service and ranks
    in the Samanta hierarchy. The political basis of integration was brought about
    by the inner lineage and intra lineage network of power. These political processes
    operated simultaneously with parallel contemporary economic, social, and religious
    processes.^8


    The important characteristics of political development of early medieval India
    was reflected in the exaggerated genealogies of the small kingdoms which find
    parallel in inflated clans of origin made


