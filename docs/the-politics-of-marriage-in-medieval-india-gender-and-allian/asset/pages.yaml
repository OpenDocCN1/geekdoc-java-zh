    Among the Rajputs clan exogamy was strictly emphasized. By this system, certain
    groups of people who were related or believed themselves to be related by blood
    or kinship were forbidden to intermary.¹¹⁸ The groups involved in this case are
    family, prohibited kin, *gotra* (lineage), and *sapinda* (related in direct line
    of ascent or descent). Each of these is bound by inquest taboo. The men that married
    in each of these groups would avoid marrying girls in their respective groups
    and seek partners from other groups.¹¹⁹


    The group of individuals belonging to the same clan traced their descents and
    origin to common ancestors so they were all bound by kinship ties. Therefore,
    all the people belonging to the same clan were considered brother and sister.
    They were part of the extensive family having common ancestors whether they were
    directly related to each other or not. The entire Rajput caste category was divided
    into a large number of clans. The rule of clan exogamy restricted the marriage
    of males and females of the same clan. For example, a boy of Rathore could not
    marry a girl of the same clan. Intra-clan marriage was regarded as incestuous
    among Rajputs. There is a basic contradiction in this when we regard it vis-à-vis
    practice among Kayastha and Brahmins, where marriages were rearranged in the same
    caste.


