    # DOWRY


    Another practice, which persists even today in India, is the phenomenon of dowry.
    Dowry is not a chance event but a product of emergence and development of social
    forces over a period of time. Scholars are increasingly becoming aware of dowry’s
    significance. Numerous anthropologists have studied dowry and bride wealth and
    even those of Western society have recently begun to investigate this essential
    side of the bargain, as the phenomenon of dowry is not only peculiar to Indian
    marriages, but is also prevalent in Western society. A focus on dowry can also
    provide social historians with the tools with which to approach political and
    economic history. Studies of dowry address status of women, their role in the
    family, the family economy, and the economy at large.


    As already mentioned earlier, the Hindu textual laws recognized eight forms of
    marriage. Out of these, the first four forms were approved and the rest were unapproved.
    The approved ones were Brahma, Daiva, Arsa, and Prjapapatya; the unapproved ones
    the Gandharva, Asura, Rakshasa, and Paisacha forms. Today, the most prevalent
    form of marriage is the Brahma form. Here the parents or guardian of the bride
    offer her as a gift in marriage to the bridegroom, without receiving compensation
    from him. In early times, this type of marriage was confined to Brahmins only,
    but later Hindus belonging to any caste could marry in accordance with the Brahma
    form. The ancient sages who were the conscience keepers


