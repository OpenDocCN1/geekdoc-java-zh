  md: '# Introduction


    medieval Rajasthan. The emergence of archival records from the mid-seventeenth
    century onwards for the first time, including sustained village-level revenue
    data, has been very helpful in reconstructing the history of the period. Of course
    there are gaps that remain, given the wide time frame and scope and nature of
    the work.Yet, it has been possible, to some extent, to construct a picture of
    the institution of marriage during our period.


    The archival material consists of the ‘Byah Bahis’, which record the marriage
    of Rajput princess and aristocracy of all the states of Rajasthan except for Jaipur.
    the bahis maintained by the merchant community also record the marriage practices.
    These Byah Bahis are important sources of direct evidence. The Kagad Bahis record
    what was happening in the village and was reported to the state. Any offence being
    committed in the villages including deviations from the norms of marriage were
    reported.


    The ‘Chithiyats’ are official letters, which contain information on many matters
    including marriage negotiations and disputes. While reporting disputes, the genesis
    of the dispute is also mentioned and, hence, it is extremely useful in constructing
    a more detailed picture.


    The ‘Sanad Parwana Bahis, Jodhpur’ contains official orders passed on various
    matters reported to the state and they contain decisions on important social issues
    including marriage. Whereas the ‘Adsats’give us limited information, the ‘San
    Parwana Bahis’ go into details of these issues and we get a wider range of information.
    Jodhpur Rajya ki Dastur Mahi, published and edited by Vikram Singh Rathore, is
    also rich in information. This gives us a great deal of information on marriage
    customs and practices.


    Besides these archival documents, there are several works of literature, which
    can be used in order to reconstruct the history of the period. But the use of
    literature as historical evidence is not safe unless one has meditated a little
    on their nature and purpose and studied their'
