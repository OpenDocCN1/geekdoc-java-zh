  md: '# Glossary


    | Aarti | A welcoming ritual/ceremony |

    | Adharma | Unrighteous |

    | Agnikula | Tracing lineage from fire |

    | Ahir | Herdsmen |

    | Akha Teej | A day considered auspicious |

    | Anil | Revenue Collector |

