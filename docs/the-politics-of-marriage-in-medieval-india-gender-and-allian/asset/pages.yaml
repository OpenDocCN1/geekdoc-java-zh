    of their foreign origin—from the Hun (V.A. Smith) of Khazars (D.R. Bhandarkar)
    and inevitably from Vedic Aryans (C.V. Vadiya). If D. Sharma eschews the attraction
    of blue-blooded ancestry, he evokes modern nationalism by alleging that Brahmins
    like Chaman and other non-Kshatriyas, forced by the Arab invasion, came together
    abandoning their own varna professions to willingly shoulder the Kshatriya duty
    of fighting for the land as well as their people and culture.³For this view to
    be sustained, it becomes important to attribute an exaggerated gravity to the
    threat from Arab-ruled Sind, a picture not at sustained by any serious study of
    sources relating to Arab power in Sind.⁴


    Rajput states have either been viewed as mere dynamic houses with endless military
    achievements or as post-tribal feudal states,⁵ or as of small kingdoms. G.D. Sharma’s,
    Rajput Polity provides a detailed analysis of the historical process of emergence
    of Rajput polity in the Marwar region. It highlighted the shift from the bhai-bant
    (distribution of land among kinsmen), which is the governing polity till Maldeo
    to the system of pattadari (system of assigning revenue or land) for fixing the
    service obligations towards the clan chief. It shattered the myth of an egalitarian
    structure fostered by James Tod by tracing the swing towards hierarchical principles
    in Rajput polity. It also showed that the degree of Mughal control on the ancestral
    domains of the Rajput chief was considerable, implying that they were less autonomous
    than envisaged hitherto.⁶


    In order to understand the political structure of Rajasthan, one has to go into
    how state formation took place. One finds the political and social structure going
    through intensive historical changes through time, before finally being integrated.
    Therefore the nature and role of the state also kept varying. The reconstruction
    of medieval Indian political structures have broadly followed three lines of enquiry—‘feudal’
    polity, ‘segmentary’ state, and ‘integrative’ polity.


