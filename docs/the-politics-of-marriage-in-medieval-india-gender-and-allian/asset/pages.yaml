  md: '# #1 Political and Social Structure of Medieval Rajasthan


    To understand the social and political structure of medieval Rajasthan in all
    its uniqueness, one needs to begin by studying its geographical features and how
    they affected the historical development and the evolution of its political structure.
    We are so familiar with Rajasthan as the name of a state, with distinct boundaries
    going back through British Rajputana to the Mughal Suba of Ajmer, that we tend
    to forget that it does not make a natural geographical region. In fact, differences
    in geographical features give rise to variation in the human organization which
    became significant historically.


    As as the geographical features are concerned, the most striking feature of Rajasthan
    is the Arawali range of hills, which running from northeast to southwest divides
    into two distinct natural regions. To its west and northwest lie Bikaner, Jaisalmer,
    Marwar, and Shekhawati region of the former Ajipur state—mostly arid and sandy.
    On the east and southeast are the alluvial plains and the plateau region covering
    Mewar, Kota, Bundi, and Jaipur excluding Shekhawati. To the west of the Arawali
    are deserts and to its east the plateau region from Chittor to Bijolia, Mandalgarh,
    Bundi, and Kota. Locally known as the Uparmal, this area is comparatively well
    watered and fertile with black soil on the flat hillock.


    This distinctive feature of Rajasthan exerted profound influence on its history.
    The arid and dry desert served as an effective obstacle to invasions from the
    western side. The inaccessible hills and sands provided a means of defence, which
    was lacking in the plains. But the region east of the Arawalis was easily approachable
    and with no natural


