  md: '# Political and Social Structure of Medieval Rajasthan


    power through a variety of motifs.Thus, the Guhilas of Mewar were not dynastic
    entities alone, nor the Guhil state a breakaway feudatory power of Pratihara.
    Neither did it represent a decentralized political structure, feudal or bhai-bant.
    Through the process of incorporation, the Guhil state grew into the royal state
    of Mewar. Many local traditions and as well as genealogical tables refer to the
    overthrow of numerous indigenous chiefs and rulers, usually Bhils or Meenas, or
    sometimes Mers, by different dynasty finding non-Kshatriya clans; the latter are
    generally described as having entered territories or tracts hitherto unfamiliar
    to them as refugees or invaders, and quickly established their own dominion over
    these territories. As their traditional land was wrested from them, these Bhil
    or Meena groups retired to inaccessible sanctuaries within the thickly forested
    hill, or to come to some kind of an understanding with incoming people.


