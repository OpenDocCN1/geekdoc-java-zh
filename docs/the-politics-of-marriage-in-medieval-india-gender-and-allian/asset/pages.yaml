    widow remarriages among the Rajputs did not follow any rigid patterns. But once
    state power was consolidated, this power was also used to control women, and widow
    remarriages among the Rajputs declined. Although it is true that Rajput women
    had claim over their husbands'' property, a particular amount of money was fixed
    for the expenditure of the widows and they were also granted patas of villages,
    which brought them regular income. Among the higher castes, we do not come across
    any reference of remarriages among the Bania and there exist rare examples of
    remarriage among the Brahmins. The fact that remarriage was prevalent among the
    Rajputs is again due to their clan structure, rather than the norms of traditional
    caste hierarchy being followed.'
