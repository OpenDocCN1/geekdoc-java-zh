    society was based on numerous castes and sub-castes which were, in turn, based
    on birth, heredity, occupation, and caste privileges.


    The nature of the polity and process of the state formation affected marriage
    alliances of this region. Matrimonial alliances were one of the major mechanisms
    for reinforcing support and loyalty. We come across several instances of marriages
    being transacted with the specific purpose of acquiring or enlarging one\u20s
    territory, enhancing one’s prestige, and using marriage as an instrument for ending
    enmity and hostility between two sides. This also contributed to the raising of
    power and status of both sides. The medieval period with the ‘feudal’ ethos of
    male honour made women into marginal figures who could be ‘used’ to end old enmity
    between two houses of royal family. This was one of the factors that led to the
    institutionalization of polygamy, as daughters would be given away without bothering
    about the number of wives the man already had.


    But establishing matrimonial relations did not always mean an end to the hostilities
    and at times we found these relationships being completely subordinated to financial
    and political considerations. We come across cases where the father-in-law was
    to kill the son-in-law, regardless of the impact it may have on the daughter''s
    life. The fact that state formation was an ongoing process and there was constant
    integration of new territories into the polity meant marriage alliances were used
    to buttress the political incorporation of a particular area. Social relations
    were also maintained with areas that had strategic or political or military significance.
