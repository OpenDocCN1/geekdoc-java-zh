  md: '# 5 Marital and Sexual Morality in Medieval Rajasthan


    When we talk about marital morality, we need to broadly examine two aspects—one
    concerned with the sexual behaviour and the other with social morality. If the
    sex lives of husbands and wives were subject to surveillance, it was because by
    getting married they had entered the regulatory arena of society. Every human
    society has certain rules and rituals surrounding sexual and marital morality,
    the most obvious being that sex is legitimate only within the institution of marriage.
    In certain parts of the world, this has been challenged, which again shows how
    human societies define the limits of valid and natural sex. Also, sex has been
    closely linked to procreation in some periods and to pleasure in others. In some
    societies, adultery invites a slow, painful, and completely legal execution, while
    in others it does not merit a raised eyebrow. Also, many things that were earlier
    unacceptable have become acceptable with the passage of time.


    When we talk of marital morality, besides sexual morality and the question of
    fidelity between husband and wife, what we need to look into are also cases of
    domestic violence, rape and incest, and other forms of sexual behaviour. Also,
    there are no common standards by which sexual/marital morality can be judged,
    as moral standards are different in different groups. There are several class
    moralities. Again, beneath this perception of class morality, there is a great
    degree of pluralism, and there is growing sociological and historical evidence
    to suggest this, which is reflected in the study of marital morality of medieval
    Rajasthan.


    Sexual morality has become a big issue today. It is said that Indian culture is
    being blown apart by foreign influences, and this is seen


