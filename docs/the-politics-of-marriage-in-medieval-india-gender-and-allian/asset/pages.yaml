    In order to facilitate the smooth functioning of the administrative machinery,
    the king and his advisors placed a team of intermediaries who could help them
    not only in running the affairs of the state, but also to work as a link between
    the ruler and his people. The administration broadly followed the policy of three
    different courses to deal with various sections of the society, including the
    Rajputs. The first course was related to the question of rights and privileges
    of the people of the erstwhile Rajput ruling family.¹²⁵


    Clan was the most important social institution in the continuation of one dynasty.
    When a dynasty occupied a territory, they involved a specific political system
    based on kinship ties. Thus, polity and kinship system were intertwined which
    led to the empowerment of familial ties. The structure was hierarchical and got
    institutionalized with the passage of time. At the top was the ruler, then came
    the thikanars (nobles) who were their brethren or sagas and then came the jagirdars.
    There was a well-defined mode and pattern of relationship among them.


    The fact that medieval period in Rajasthan is characterized by continuous battle,
    wherein the ruler was either defending or expanding his territory, it led to the
    formation of distinct social institutions, value system, gender relations, political
    alliance, and economy. The ruler needed continual preparedness for battle, loyalty
    amidst intrigues, and a support system through procurement of soldiers. Thus,
    the army was organized by clan relationships and members of the clan lineage were
    provided with territories which later came to be known as thikanas. Basically,
    thikanas were given to brothers in lieu of military service. Grant of thikanas
    was a pragmatic mechanism of exchange.²⁶


