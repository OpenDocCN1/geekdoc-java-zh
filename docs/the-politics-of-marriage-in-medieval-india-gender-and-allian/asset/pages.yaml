  md: '# Introduction


    This work has been created against the backdrop of constructs of monolithic cultural
    unity, political equilibrium, and the traditionalization of Indian culture. It
    is also in the context of certain political hues that project an essentialist
    view of Indian culture and try to valorize ‘indigenous’ society in a variety of
    ways without looking closely at the relation between caste, gender, and the state.


    The Politics of Marriage in Medieval India: Gender and Alliance in Rajasthan:
    the title of this book requires an explanation of mainly two aspects—the significance
    of studying the institution of marriage and the time frame of marriage as I understand
    and use this category.


    The study of marriage as an institution helps us understand some basic aspects
    of society. It is an institution that defines much about a person’s present and
    future. In fact, marriage practices are revealing of various aspects of the society
    and its attitudes, as marriage is a social act, involving more than two individuals
    hedged by laws and customs. These laws and customs are never static and undergo
    subtle transformations all the time. Both marriage and family are near universal
    social arrangements that vary from group to group and change over time. Since
    marriage carries many social and legal consequences, it simply must be a public
    act and cannot be a private pact between husband and wife.


    It may seem that there is nothing more natural than the family as a social unit.
    But if that indeed the case, we would have stayed in an immutable format throughout
    history. Instead, we have seen the structure of the family change from clan to
    joint to parent. Some societies like the Spartans dispensed with the family altogether,
    with the children and the elderly becoming a collective responsibility.


    The Politics of Marriage in Medieval India: Gender and Alliance in Rajasthan.

    Sabina Singh, Oxford University Press (2019). © Oxford University Press.

    DOI: 10.1093/oso/9780199414522.001.001'
