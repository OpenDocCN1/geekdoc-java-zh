    There is a need to see women not only as passive victims of an oppressive ideology,
    but also (perhaps primarily) as the active agents of their own positive constructs.
    It is in this context that the interpretation of religion and ritual texts become
    as important as the evaluation of religious experiences of the women. Such choices
    are being made by women (given the cultural restraints within which they are working)
    who themselves not only as the victim of their culture, but as active agents in
    the creation of their own identities and identities of their daughters. Hence,
    the inability to question the model of women as negative, passive, and powerless
    needs to be investigated, as this may not always be the case.¹⁶


    As we have seen in Chapter 1, the territories of Rajasthan during the early medieval
