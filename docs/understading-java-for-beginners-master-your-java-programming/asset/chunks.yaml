    Unlike many other programming languages including C and C++, when Java is compiled,
    it is not compiled into platform-specific machine code, rather into platform-independent
    byte code. This byte code is distributed over the web and interpreted by the Virtual
    Machine (`JVM`) on whichever platform it is being run on.


    Java is platform independent because it is different from other languages like
    C, C++, etc. which are compiled into platform-specific machines while Java is
    a write once, run anywhere language. A platform is the hardware or software environment
    in which a program runs.


    There are two types of platforms: software-based and hardware-based. Java provides
    a software-based platform.


    The Java platform differs from most other platforms in the sense that it is a
    software-based platform that runs on the top of other hardware-based platforms.
    It has two components:


    * Runtime Environment

    * API (Application Programming Interface)


    Java code can be run on multiple platforms, for example, Windows, Linux, Sun Solaris,
    Mac/OS, etc. Java code is compiled by the compiler and converted into bytecode.
    This bytecode is a platform-independent code because it can be run on multiple
    platforms, i.e., Write Once and Run Anywhere (WORA).


    ## 3. Simple


    Java is designed to be easy to learn. If you understand the basic concept of OOP
    Java, it would be easy to master. Java is very easy to learn, and its syntax is
    simple, clean and easy to understand. According to Sun, Java language is a simple
    programming language because:


    * Java syntax is based on C++ (so easier for programmers to learn it after C++).

    * Java has removed many complicated and rarely-used features, for example, explicit
    pointers, operator overloading, etc.

    * There is no need to remove unreferenced objects because there is an Automatic
    Garbage Collection in Java.


    ## 4. Secure


    With Java''s secure feature it enables to develop virus-free, tamper-free systems.
    Authentication techniques are based on public-key encryption. With Java, we can
    develop virus-free systems. Java is secured because:


    * No explicit pointer

    * Java Programs run inside a virtual machine sandbox.

    * ClassLoader: ClassLoader in Java is a part of the Java Runtime Environment (`JRE`)
    which is used to load Java classes into the Java Virtual Machine dynamically.
    It adds security by separating the package for the classes of the local file system
    from those that are imported from network sources.

    * BytecodeVerifier: It checks the code fragments for illegal code that can violate
    access right to objects.

    * Security Manager: It determines what resources a class can access such as reading
    and writing to the local disk.


    Java language provides these securities by default. Some security can also be
    provided by an application developer explicitly through `SSL`, `JAAS`, `Cryptography`,
    etc.


    ## 5. Architecture-neutral


    Java compiler generates an architecture-neutral object file format, which makes
    the compiled code executable on many processors, with the presence of Java runtime
    system. Or example, the size of primitive types is fixed. In C programming, `int`
    data type occupies 2 bytes of memory for 32-bit architecture and 4 bytes of memory
    for 64-bit architecture. However, it occupies 4 bytes of memory for both 32 and
    64-bit architectures in Java.


    ## 6. Portable


    Being architecture-neutral and having independent aspects of specification makes
    Java portable. The compiler in Java is written in ANSI C with a boundary which
    is a POSIX subset.


    ## 7. Robust


    Java makes an effort to eliminate error-prone situations mainly on compilation
    and runtime checking. Robust means Java is strong:


    * It uses strong memory management.

    * There are no pointers that are not used.

    * There is automatic garbage collection in Java which runs on the Java Virtual
    Machine.

    * There are exception handling and type checking in Java. All these make Java
    robust.


    ## 8. Multi threaded


    With Java''s multthreaded feature it is possible to write programs that can perform
    many tasks simultaneously. This design allows developers to construct applications
    that run smoothly.


    ## 9. Interpreted


    Java byte code is translated into native machine instructions and is not stored
    anywhere. The development is faster and linking is incremental and lightweight.


    ## 10. High Performance


    With the Just-In-Time compiler, Java enables high performance.


    ## 11. Distributed


    Java is designed for the environment of the internet. Java is distributed because
    it facilitates users to distributed applications. `RMI` and `EJB` are used for
    constructing distributed applications. This feature of Java allows to access methods
    from any machine on the internet.


    ## 12. Dynamic


    Java is considered more dynamic than C or C++ because it is designed for dynamic
    environments. Java programs can carry an extensive amount of runtime information
    that can be used to verify and resolve objects at runtime.


    # JAVA And C++


    ### 1. Platform Independence

    C++ is a platform dependent language. The source code written in C++ needs to
    be compiled on every platform. Java is platform independent and once compiled
    into bytecode, it can be executed on any platform.


    ### 2. Compiler and Interpreter

    C++ is a compiled language. The source program written in C++ is compiled into
    an object code which can then be executed to produce an output. Java is a compiled
    as well as interpreted language. The compiled output of Java source code is bytecode
    which is platform independent.


    ### 3. Cross-platform apps

    A C++ program compiled on an operating system will not run on a different operating
    system. You need to recompile the program for different operating system in order
    for it to run. On the contrary, a Java program will run on any platform where
    `JVM` is installed, recompilation is not required.


    ### 4. Memory safety

    C++ is not a memory-safe language. You can perform memory management, which is
    a great advantage. But memory errors may occur and serious issues like crashes
    may take place at the time of the program’s execution. On the other hand, Java
    doesn’t allow memory manipulation, it’s system-controlled. So this kind of issues
    will not appear. Memory management in C++ is manual. We need to allocate/deallocate
    memory manually using the `new`/`delete` operators. Java is a memory-safe language.
    In Java the memory management is system-controlled.


    ### 5. Pointers

    C++ has full pointer support. Java has a limited pointer support. Java has limited
    support for pointers. Initially, Java was completely without pointers but later
    versions started providing limited support for pointers. We cannot use pointers
    in Java as leisurely as we can in C++.


    ### 6. Threads

    C++ doesn’t support threads but Java does. Java has built-in thread support with
    a class. We can inherit class and then override the `run()` method.


    ### 7. Performance

    C++ programs are generally faster as they do not need to be interpreted. On the
    other hand, Java are not that fast as they need to be interpreted first and it
    takes time. But keep in mind that `JVM` optimizes your code. This increases the
    program performance. So a Java program can run faster than a C++ program if the
    C++ program is not optimized for performance. But if it’s greatly optimized for
    performance, it will be a lot faster than Java code.


    ### 8. Closeness to the hardware

    When compared to Java, C++ is a low-level language, it’s closer to the hardware.
    Java is not close to the hardware.


    ### 9. Scope resolution operators

    C++ supports scope resolution operators whereas Java doesn’t have these operators.
    Scope Resolution Operator

