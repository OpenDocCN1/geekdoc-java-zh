    # 引言


    Java 是世界上最流行的编程语言之一，主要源于它的多功能性和兼容性。Java 可用于许多领域，包括软件开发、移动应用程序和大型系统开发。截至 2019 年，88%
    的智能手机市场份额运行在 Android 上，而该移动操作系统是用 Java 编写的。对于开发者来说，了解 Java 将为你开启很多大门。


    # 什么是 Java？


    Java 是一种流行的编程语言，创建于 1995 年。它由 Oracle 所有，有超过 30 亿台设备运行 Java。


    它被用于：


    * 移动应用程序（特别是 Android 应用）

    * 桌面应用程序

    * Web 应用程序

    * Web 服务器和应用服务器

    * 游戏

    * 数据库连接


    还有更多、更多！


    ## 为什么使用 Java？


    * Java 可以在不同的平台（Windows, Mac, Linux, Raspberry Pi 等）上

    * 它是世界上最流行的编程语言之一

    * 它易于学习且简单易

    * 它是开源免费的

    * 它安全、快速且强大

    * 它拥有庞大的社区支持（数千名开发者）

    * Java 是一种面向对象的语言，提供了清晰的结构并允许代码重用，降低了开发成本

    * 由于 Java 与 C++ 和 C# 相似，程序员很容易切换到 Java


    # Java 历史


    Java 创建于太阳物系统公司（Sun Microsystems），当时 James Gosling 领导着研究人员小组，试图创建一种允许消费级设备相互交互的新语言。该语言的工作始于
    1991 年，不久后团队的重心转向了一个新的空白领域——万维网。Java 直于 1995 年首次发布，其交互能力表明它特别适用于 Web。


    Java 与其他编程语言的工作方式的区别是革命性的。其他语言的代码首先由编译器翻译成特定类型计算机的指令。而 Java 编译器将代码转换为被称为字节码（Bytecode）的内容，然后由称为
    Java 运行环境（`JRE`）或 Java 虚拟机软件解释。`JRE`充当虚拟计算机，解释字节码并将其翻译给主机计算机。因此，Java 代码可以在多个平台上以相同的方式编写（“编写一次，到处运行”），这有助于它在互联网上流行，因为互联网上许多不同类型的计算机可能会获取同一个
    Web 页面。


    目前，Java 用于网络编程、移动设备、游戏、电子商务解决方案等。以下是描述 Java 历史的要点。


    ### 从 Oak 到 Java 的历史


    1) James Gosling、Mike Sheridan 和 Patrick Naughton 于 1991 年 6 月启动了 Java 语言项目。这个工程师小组被称为
    Green Team（绿色小组）。

    2) 最初设计用于电子应用中机顶盒的小型嵌入式系统。

    3) 最初，它被 James Gosling 称为 "Greentalk"，文件扩展名为 `.gt`。

    4) 之后，它被称为 Oak，并作为 Green 项目的一部分进行开发。


    ### 为什么 Java 名为 "Oak"？


    5) 为什么是 Oak？Oak 是力量的象征，被选为美国、法国、德国等许多国家的国树。

    6) 1995 年，Oak 被更名为 Java，因为它是根据 Oak 命名的。


    ### 为什么 Java 名为 "Java"？


    为什么他们选择 Java 作为语言？团队聚集在一起选择新名字。建议的词有 "Relay"、"Silk"、"Stalk"。他们希望反映互联网：Relay、Mocha、Java，并且简单易读。根据
    James Gosling 的说法，“Java 是和 Stalk 一样热门的选择”。由于 Java 是独特的，大多数团队成员倾向于 Java。


    8) Java 是印度尼西亚的一个岛屿，那里是产第一批咖啡的地方（被称为 java）。它是一种咖啡豆。Java 这个名字是 James Gosling 在办公室附近喝咖啡时选定的。

    9) 注意，Java 只是一个名字，而不是一种语言。

    10) 最初由 James Gosling 在太阳物系统公司（现为 Oracle 公司的子公司）开发，并于 1995 年发布。

    11) 1995 年，《时代》杂志将 Java 称为 1995 年最佳产品之一。

    12) `JDK 1.0` 发布（1996 年 1 月 23 日）。在 Java 首次发布后，该语言增加了许多功能。现在 Java 已用于 Windows
    应用程序、Web 应用程序、企业应用程序、移动应用程序等。每个版本都为 Java 增加了新功能。


    尽管名称相似，设计在 Web 浏览器中运行的 JavaScript 语言并不是 Java 的一部分。JavaScript 于 1995 年在 Netscape
    公司开发，被构想为 Java 的伙伴。在 Netscape 获得 Sun 的营销许可之前，最初被称为 Mocha，然后是 Live。


    ### Java 版本历史


    目前已发布了许多 Java 版本。Java 目前稳定版本是 Java SE 10。


    * JDK Alpha 和 Beta (1995)

    * `JDK 1.0` (1996 年 1 月 23 日)

    * `JDK 1.1` (1997 年 2 月 19 日)

    * `J2SE 1.2` (1998 年 12 月 8 日)

    * `J2SE 1.3` (2000 年 5 月 8 日)

    * `J2SE 1.4` (2002 年 2 月 6 日)

    * `J2SE 5.0` (2004 年 9 月 30 日)

    * `Java SE 6` (2006 年 12 月 11 日)

    * `Java SE 7` (2011 年 7 月 28 日)

    * `Java SE 8` (2014 年 3 月 18 日)

    * `Java SE 9` (2017 年 9 月 21 日)

    * `Java SE 10` (2018 年 3 月 20 日)


