  trans: "\n\n# Java 变量示例：收缩（强制转换）\n\n```java\nclass Simple{\n    public static void\
    \ main(String[] args){\n        float f=10.5f;\n        //int a=f;//编译时错误\n  \
    \      int a=(int)f;\n        System.out.println(f);\n        System.out.println(a);\n\
    \    }\n}\n```\n\n输出：\n```\n10.5\n10\n```\n\n变量名称（唯一标识符）的通用规则如下：\n\n*   名称可以包含字母、数字、下划线和美元符号\n\
    *   名称必须以字母开头\n*   名称应该以小写字母开头，且不能包含空格\n*   名称也可以以 `$` 和 `_` 开头（但在本教程中不会使用它们）\n\
    *   名称是区分大小写的（\"myVar\" 和 \"myvar\" 是不同的变量）\n*   不能使用保留字（如 Java 关键字，如 `int` 或\
    \ `boolean`）作为名称\n\n## JAVA 中的数据类型\n\n数据类型定义了变量可以取的值，例如，如果一个变量的数据类型为 `int`，它就只能取整数值。在\
    \ Java 中，我们将数据类型分为两类：\n\n1) 基本数据类型\n2) 非基本数据类型 – 数组（Arrays）和 `Strings` 是非基本数据类型，我们将在后面的教程中讨论它们。在这里我们将讨论\
    \ Java 中的基本数据类型和字面量。\n\nJava 是一种静态类型语言。如果变量的数据类型在编译时已知，则该语言是静态类型的。这意味着在在使用变量之前必须指定变量的类型（声明变量）。\n\
    \n## Java 基本数据类型\n\n在 Java 语言中，基本数据类型是数据操作的构建块。这些是 Java 语言中提供的基础数据类型。\n\n共有 8\
    \ 种基本数据类型：\n\n*   `boolean` 数据类型\n*   `byte` 数据类型\n*   `char` 数据类型\n*   `short`\
    \ 数据类型\n*   `int` 数据类型\n*   `long` 数据类型\n*   `float` 数据类型\n*   `double` 数据类型\n\
    \n### Boolean 数据类型\n\nBoolean 数据类型仅存储两个可能的值：`true` 和 `false`。该数据类型用于跟踪真/假状态的简单标志位。`Boolean`\
    \ 数据类型指定了一位信息，但其“大小”无法精确定义。\n\n示例：`boolean one = false`\n\n语法：\n```java\nboolean\
    \ booleanVar;\n```\n大小：取决于虚拟机\n值：`true`, `false`\n默认值：`false`\n\n### 2. byte\n\
    \n`byte` 数据类型是 8 位的符号补码整数。`byte` 数据类型有助于在大型数组中节省内存。它可以存储 -128 到 127 之间的整数。主要用于节省内存，以及当你确定数字一定会在\
    \ `byte` 数据类型指定的范围内时使用。\n\n该数据类型的默认大小：1 字节\n默认值：0\n\n语法：\n```java\nbyte byteVar;\n\
    ```\n大小：1 字节（8 位）\n值：-128 到 127\n默认值： 0\n\n### 3. char\n\n存储字符。`char` 数据类型是单个\
    \ 16 位 Unicode 字符。它的取值范围在 `'\\u0000'`（或 0）到 `'\\uff'`（或 65535）之间。`char` 数据类型用于存储字符。\n\
    \n大小：2 字节\n```java\nclass JavaExample {\n    public static void main(String[]\
    \ args) {\n        char ch = 'Z';\n        System.out.println(ch);\n    }\n}\n\
    ```\n输出：`Z`\n\n### Short 数据类型\n\n`short` 数据类型是 16 位的符号补码整数。它的取值范围在 -32768 到 32767\
    \ 之间。它的最小值为 -32768，最大值为 32767。它的默认值为 0。`short` 数据也可以像 `byte` 数据一样节省内存。`short`\
    \ 数据比 `int` 小 2 倍。\n\n示例：`short s = 10000`, `short r = -5000`\n\n### int\n当 `short`\
    \ 不足以容纳该数字时使用：\n```java\nclass JavaExample {\n    public static void main(String[]\
    \ args) {\n        short num;\n        num = 150;\n        System.out.println(num);\n\
    \    }\n}\n```\n输出：`150`\n\n### 4. long\n\n当 `int` 不大以容纳该值时使用，它的范围比 `int` 数据大，范围从\
    \ -9223372036854775808 到 9223372036854775807。\n大小：8 字节\n默认值：0\n\n示例：\n```java\n\
    class JavaExample {\n    public static void main(String[] args) {\n        long\
    \ num = -123325262L;\n        System.out.println(num);\n    }\n}\n```\n输出：`-123325262`\n\
    \n### 5. double\n\n足够容纳 15 位小数。\n大小：8 字节。\n\n示例：\n```java\nclass JavaExample {\n\
    \    public static void main(String[] args) {\n        double num = -4293737.9;\n\
    \        System.out.println(num);\n    }\n}\n```\n输出：`-4293737.9`\n\n### 6. float\n\
    \n足够容纳 6 到 7 位小数。\n大小：4 字节。\n```java\nclass JavaExample {\n    public static void\
    \ main(String[] args) {\n        float num = 19.98f;\n        System.out.println(num);\n\
    \    }\n}\n```\n输出：`19.98`\n\n# Java 运算符\n\nJava 运算符用于执行操作。例如：`+`、`-`、`*`、`/`\
    \ 等。Java 中有很多类型的运算符，如下：\n\n*   一元运算符\n*   算术运算符\n*   移运算符\n*   关系运算符\n*   位运算符\n\
    *   逻辑运算符\n* 三元运算符\n*   赋值运算符\n\n## 一元运算符\n\nJava 元运算符只需要一个操作数。元运算符用于执行各种操作，例如：\n\
    \n* 递增/递减值\n* 取反表达式\n* 取反值\n\n### 一元运算符示例：++ 和 --\n```java\nclass OperatorExample\
    \ {\n    public static void main(String[] args) {\n        int x = 10;\n     \
    \   System.out.println(x++); // 10\n        System.out.println(++x); // 12\n \
    \       System.out.println(x--); // 11\n        System.out.println(--x); // 10\n\
    \    }\n}\n```\n输出：\n```\n10\n12\n11\n10\n```\n\n### 一元运算符示例 2：++ 和 --\n```java\n\
    class OperatorExample {\n    public static void main(String[] args) {\n      \
    \  int a = 10;\n        int b = 10;\n        System.out.println(a++ +a); // 22\n\
    \        System.out.println(b++); // 21\n    }\n}\n```\n输出：\n```\n22\n21\n```\n\
    \n### 一元运算符：~ 和 !\n```java\nclass Operator {\n    public static void main(String[]\
    \ args) {\n        int a = 10;\n        int b = -10;\n        boolean c = true;\n\
    \        boolean d = false;\n        System.out.println(~a); // -11\n        System.out.println(~b);\
    \ // 9\n        System.out.println(!c); // false\n        System.out.println(!d);\
    \ // true\n    }\n}\n```\n输出：\n```\n-11\n9\nfalse\ntrue\n```\n\n## 算术运算符\n\n算术运算符用于执行数学运算。\n\
    \n| 运算符 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `+` | 相加 | `x + y` |\n| `-` | 从另一个值中减去一个\
    \ | `x - y` |\n| `*` | 两个值相乘 | `x * y` |\n| `/` | 一个值除以另一个 | `x / y` |\n| `%`\
    \ | 返回余数 | `x % y` |\n| `++` | 变量加 1 | `++x` |\n| `--` | 变量减 1 | `--x` |\n\n###\
    \ 左移运算符\n\nJava 左移运算符 `<<` 用于将值中的所有位左移指定的次数。\n\n```java\nclass OperatorExample\
    \ {\n    public static void main(String[] args) {\n        System.out.println(10<<2);\
    \ // 10*2²=40\n        System.out.println(10<<3); // 10*2³=80\n        System.out.println(20<<2);\
    \ // 20*2²=80\n        System.out.println(15<<4); // 15*2⁴=240\n    }\n}\n```\n\
    输出：\n```\n40\n80\n80\n240\n```\n\n### 右移运算符\n\nJava 右移运算符 `>>` 用于将左操作数的值右移右操作数所指定的位数。\n\
    \n```java\nclass OperatorExample {\n    public static void main(String[] args)\
    \ {\n        System.out.println(10>>2); // 10/2²=2\n        System.out.println(20>>2);\
    \ // 20/2²=5\n        System.out.println(20>>3); // 20/2³=2\n    }\n}\n```\n输出：\n\
    ```\n2\n5\n2\n```\n\n### Java 移位运算符示例：>> vs >>>\n\n```java\nclass OperatorExample\
    \ {\n    public static void main(String[] args) {\n        // 对于正数，>> 和 >>> 效果相同\n\
    \        System.out.println(20>>2);\n        System.out.println(20>>>2);\n   \
    \     // 对于负数，>>> 将符号位（最高位）更改为 0\n        System.out.println(-20>>2);\n      \
    \  System.out.println(-20>>>2);\n    }\n}\n```\n输出：\n```\n5\n5\n-5\n1073741819\n\
    ```\n\n"
- fmt: "\n# Java AND Operator Example: Logical && and Bitwise &\n\nThe logical `&&`\
    \ operator doesn't check second condition if first condition is false. It checks\
    \ second condition only if first one is true.\n\nThe bitwise `&` operator always\
    \ checks both conditions whether first condition is true or false.\n\n```java\n\
    class OperatorExample {\n    public static void main(String args[]) {\n      \
    \  int a=10;\n        int b=5;\n        int c=20;\n        System.out.println(a<b&&a<c);\
    \ // false && true = false\n        System.out.println(a<b&a<c); // false & true\
    \ = false\n    }\n}\n```\n\n**Output:**\n```\nfalse\nfalse\n```\n\n# Java AND\
    \ Operator Example: Logical && vs Bitwise &\n\n```java\nclass OperatorExample\
    \ {\n    public static void main(String args[]) {\n        int a=10;\n       \
    \ int b=5;\n        int c=20;\n        System.out.println(a<b&&a++<c); // false\
    \ && true = false\n        System.out.println(a); // 10 because second condition\
    \ is not checked\n        System.out.println(a<b&a++<c); // false && true = false\n\
    \        System.out.println(a); // 11 because second condition is checked\n  \
    \  }\n}\n```\n\n**Output:**\n```\nfalse\n10\nfalse\n11\n```\n\n# Java OR Operator\
    \ Example: Logical || and Bitwise |\n\nThe logical `||` operator doesn't check\
    \ second condition if first condition is true. It checks second condition only\
    \ if first one is false.\n\nThe bitwise `|` operator always checks both conditions\
    \ whether first condition is true or false.\n\n```java\nclass OperatorExample\
    \ {\n    public static void main(String args[]) {\n        int a=10;\n       \
    \ int b=5;\n        int c=20;\n        System.out.println(a>b||a<c); // true ||\
    \ true = true\n        System.out.println(a>b|a<c); // true | true = true\n  \
    \      // || vs |\n        System.out.println(a>b||a++<c); // true || true = true\n\
    \        System.out.println(a); // 10 because second condition is not checked\n\
    \        System.out.println(a>b|a++<c); // true | true = true\n        System.out.println(a);\
    \ // 11 because second condition is checked\n    }\n}\n```\n\n**Output:**\n```\n\
    true\ntrue\ntrue\n10\ntrue\n11\n```\n\n## JAVA Keywords\n\nJava keywords are also\
    \ known as reserved words. Keywords are particular words which acts as a key to\
    \ a code. These are predefined words by Java so it cannot be used as a variable\
    \ or object name.\n\n### List of Java Keywords\n\nA list of Java keywords or reserved\
    \ words are given below:\n\n- `abstract`: Java `abstract` keyword is used to declare\
    \ abstract classes. Abstract class can provide the implementation of interface.\
    \ It can have abstract and non-abstract methods.\n- `boolean`: Java `boolean`\
    \ keyword is used to declare a variable as boolean type. It can hold True and\
    \ False values.\n- `break`: Java `break` keyword is used to break loop or switch.\
    \ It breaks the current flow of the program at specified condition.\n- `byte`:\
    \ Java `byte` is used to declare a variable that can hold an 8-bit data.\n- `case`:\
    \ Java `case` is used with switch statements to mark blocks of text.\n- `catch`:\
    \ Java `catch` is used to catch exceptions generated by statements. It must be\
    \ used after the try block.\n- `char`: Java `char` is used to declare a variable\
    \ that can hold unsigned 16-bit characters.\n- `class`: Java `class` is used to\
    \ declare a class.\n- `continue`: Java `continue` is used to continue the loop.\
    \ It continues the current flow of the program and skips the remaining code at\
    \ specified condition.\n- `default`: Java `default` keyword is used to specify\
    \ the default block in switch statement.\n- `do`: Java `do` is used in control\
    \ statement to declare a loop. It can iterate part of program several times.\n\
    - `double`: Java `double` is used to declare a variable that can hold 64-bit floating\
    \ point numbers.\n- `else`: Java `else` is used to indicate alternative branches\
    \ in an if statement.\n- `enum`: Java `enum` is used to define a fixed set of\
    \ constants. Enum constructors are always private or default.\n- `extends`: Java\
    \ `extends` is used to indicate that a class is derived from another class or\
    \ interface.\n- `final`: Java `final` is used to indicate that a variable holds\
    \ a constant value. It is applied with a variable. It is used to restrict the\
    \ user.\n- `finally`: Java `finally` indicates a block of code in a try-catch\
    \ structure. This block is always executed whether exception is handled or not.\n\
    - `float`: Java `float` is used to declare a variable that can hold 32-bit floating\
    \ point number.\n- `for`: Java `for` is used to start a for loop. It is used to\
    \ execute a set of instructions/functions repeatedly when some conditions become\
    \ true. If the number of iteration is fixed, it is recommended to use for loop.\n\
    - `if`: Java `if` tests the condition. It executes the if block if condition is\
    \ true.\n- `implements`: Java `implements` is used to implement an interface.\n\
    - `import`: Java `import` makes classes and interfaces available and accessible\
    \ to the current code.\n- `instanceof`: Java `instanceof` is used to test whether\
    \ an object is instance of a class or interface.\n- `int`: Java `int` is used\
    \ to declare a variable that can hold 32-bit integer.\n- `interface`: Java `interface`\
    \ is used to declare an interface. It can have abstract methods.\n- `long`: Java\
    \ `long` is used to declare a variable that can hold 64-bit integer.\n- `native`:\
    \ Java `native` is used to specify that a method is native code using JNI (Java\
    \ Native).\n- `new`: Java `new` is used to create objects.\n- `null`: Java `null`\
    \ is used to indicate that a reference does not refer to anything. It represents\
    \ garbage value.\n- `package`: Java `package` is used to declare a package that\
    \ includes classes. own- `private`: Java `private` is an access modifier. It is\
    \ used to indicate that a method or variable accessible only in the class. own-\
    \ `protected`: Java `protected` is access modifier. It can accessible within package\
    \ and outside the package through inheritance. It can't be applied on the class.\n\
    - `public`: Java `public` is an access modifier. It is used to indicate that item\
    \ is accessible everywhere. It has the widest scope among others modifiers.\n\
    - `return`: Java `return` is used to return from a method when its execution is\
    \ complete.\n- `short`: Java `short` is used to declare a variable that can hold\
    \ 16-bit integer.\n- `static`: Java `static` is used to indicate that a variable\
    \ or method is a class method. The `static` keyword in Java is used for memory\
    \ management mainly.\n- `strictfp`: Java `strictfp` is used to restrict the floating\
    \ point calculations to ensure portability.\n- `super`: Java `super` is a reference\
    \ variable that is used to refer parent class object. It can be used to invoke\
    \ immediate parent class method.\n- `switch`: The Java `switch` keyword contains\
    \ a switch statement that executes code based on test value. The switch statement\
    \ tests the equality of a variable against multiple values.\n- `synchronized`:\
    \ Java `synchronized` is used to specify the critical sections or methods in multithreaded\
    \ code.\n- `this`: Java `this` keyword can be used to refer the current object\
    \ in a method or constructor.\n- `throw`: The Java `throw` keyword is used to\
    \ explicitly throw an exception. The `throw` keyword is mainly used to throw custom\
    \ exception. It is followed by an instance.\n- `throws`: The `throws` keyword\
    \ is used to declare an exception. Checked exception can be propagated with throws.\n\
    - `transient`: Java `transient` keyword is used in serialization. If you define\
    \ any data member as transient, it will not be serialized.\n- `try`: Java `try`\
