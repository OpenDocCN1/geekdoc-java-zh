    # Introduction


    Java is among the most popular programming languages out there, mainly because
    of how versatile and compatible it is. Java can be used for a large number of
    things, including software development, mobile applications, and large systems
    development. As of 2019, 88% market share of all smartphones run on Android, the
    mobile operating system written in Java. Knowing Java opens a great deal of doors
    for you as a developer.


    # What is Java?


    Java is a popular programming language, created in 1995. It is owned by Oracle,
    and more than 3 billion devices run Java.


    It is used for:


    * Mobile applications (specially Android apps)

    * Desktop applications

    * Web applications

    * Web servers and application servers

    * Games

    * Database connection


    And much, much more!


    ## Why Use Java?


    Java works on different platforms (Windows, Mac, Linux, Raspberry Pi, etc.)


    It is one of the most popular programming language in the world


    It is easy to learn and simple to use


    It is open-source and free


    It is secure, fast and powerful


    It has huge community support (thousands of developers)


    Java is object oriented language which gives a clear structure and allows code
    to be reused, lowering development costs


    As Java is close to C++ and C#, it makes it easy for programmers to switch to
    Java


    # History of Java


    Java was created at Sun Microsystems, where James Gosling led a team of researchers
    in an effort to create a new language would allow consumer devices to interact
    with each other. Work on the language began in 1991, and before long the team’s
    focus changed to a new niche, the World Web. Java was first released in 1995 and
    Java’s ability to interact showed that it was particularly suited for the Web.


    The difference between the way Java and other programming languages worked was
    revolutionary. Code in other languages is first translated by compiler into instructions
    for a specific type of computer. The Java compiler instead turns code into something
    called Bytecode, which is then interpreted by software called the Java Runtime
    Environment (`JRE`), or the Java virtual machine. The `JRE` acts as a virtual
    computer that interprets Bytecode and translates it for the host computer. Because
    of this, Java code can be written the same way for many platforms (“write once,
    run anywhere”), which helped to its popularity on the Internet, where many different
    types of computers may retrieve the same Web page.


    Currently, Java is used in internet programming, mobile devices, games, e-business
    solutions, etc. There are given significant points that describe the history of
    Java.


    ### Java History from Oak to Java


    1) James Gosling, Mike Sheridan, and Patrick Naughton initiated the Java language
    project in June 1991. The small team of engineers called Green Team.

    2) Initially designed for small, embedded systems in electronic applications like
    set-top boxes.

    3) Firstly, it was called "Greentalk" by James Gosling, and the file extension
    was `.gt`.

    4) After that, it was called Oak and was developed as a part of the Green project.


    ### Why Java named "Oak"?


    5) Why Oak? Oak is a symbol of strength and chosen as a national tree of many
    countries like the U.S.A., France, Germany, etc.

    6) In 1995, Oak was renamed as Java because it was named after Oak.


    ### Why Java named "Java"?


    Why had they chosen Java for language? The team gathered to choose a new name.
    The suggested words were "Relay", "Silk", "Stalk", "DNA". They wanted to reflect
    the internet: Relay, Mocha, Java, and easy to say. According to James Gosling,
    "Java was one of the top choices along Stalk". Since Java was unique, most of
    the team favored Java.


    8) Java is an island of Indonesia where the first coffee was produced (called
    java). It is a kind of bean. Java name was chosen by James Gosling while having
    coffee near his office.

    9) Notice that Java is just a name, not language.

    10) Initially developed by James Gosling at Sun Microsystems (which is now a subsidiary
    of Oracle Corporation) and released in 1995.

    11) In 1995, Time magazine called Java one of the Best Products of 1995.

    12) `JDK 1.0` released(January 23, 1996). After the first release of Java, there
    have been many features added to the language. Now Java is being used in Windows
    applications, Web applications, enterprise applications, mobile applications,
    etc. Each version adds new features in Java.


    Despite the similar names, the JavaScript language that was designed to run in
    Web browsers is not part of Java. JavaScript was developed in 1995 at Netscape
    Corp. and was conceived as a companion to Java. It was originally called Mocha
    and then Live before Netscape received a marketing license from Sun.


    ### Java Version History


    Many Java versions have been released till now. The current stable release of
    Java is Java SE 10.


    * JDK Alpha and Beta (1995)

    * `JDK 1.0` (23rd Jan 1996)

    * `JDK 1.1` (19th Feb 1997)

