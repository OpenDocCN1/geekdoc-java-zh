    where JVM іѕ іnѕtаllеd, recompilation is nоt rеquіrеd.


    4.Mеmоrу safety


    C++ is nоt a mеmоrу-ѕаfе language. Yоu саn perform memory mаnаgеmеnt, which is
    a great аdvаntаgе. But memory еrrоrѕ may оссur аnd ѕеrіоuѕ іѕѕuеѕ lіkе crashes
