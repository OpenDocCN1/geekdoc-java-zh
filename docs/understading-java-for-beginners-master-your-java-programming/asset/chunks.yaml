  trans: "\n作用域解析运算符用于访问全局变量和在类外部定义方法。\n\nC++ 支持作用域解析运算符，因为它使用它来访问全局变量。它还允许我们在类外部定义函数，并使用作用域解析运算符访问它们。\n\
    \n相比之下，Java 不支持作用域解析运算符。Java 也不允许在外部定义函数。与程序相关的...\n\n## 10. 默认参数\n\n在 C++ 中你可以拥有默认参数，而在\
    \ Java 中没有这种东西。\n\n## C++ 和 Java 的相似之处\n\n这两种语言在语法和语言特性方面非常相似。它们如此相似，如果你向你展示项目中的部分\
    \ C++ 代码并问它是 C++ 还是 Java 代码，你可能会感到困惑。\n\n执行：在编译时，Java 源代码或 `.java` 文件转换为字节码或 `.class`\
    \ 文件。在运行时，JVM（Java 虚拟机）会加载 `.class` 文件并在解释器的帮助下将其转换为机器码。对方法调用进行编译（使用即时编译 de JIT\
    \ 编译器）后，JVM 将执行优化后的代码。因此，Java 既是编译型语言也是解释型语言。\n\n另一方面，C++ 仅使用编译器执行代码。C++ 编译器将源代码编译转换为机器码。这就是为什么\
    \ `c++` 比 Java 快，但它不是平台无关。\n\n特性：C++ 和 Java 都具有多种面向对象的编程特性，提供了许多实用的编程功能。某些特性由一种支持，而另一些不支持。\n\
    \n下表显示了两种编程语言支持和不支持的功能：\n\n应用：C++ 和 Java 都有广泛的应用领域。以下是这两种语言的应用：\n\n### C++ 编程语言的应用\n\
    \n- 适用于开发大型软件（如，客运系统）。\n- `MySQL` 是用 C++ 编写的。\n- 对于游戏，C++ 主要用于游戏开发。\n- Google\
    \ Chrome 浏览器、文件系统、播放器都是用 C++ 编写的。\n- Adobe Photoshop、Illustrator 这些流行的应用程序使用 C++\
    \ 编写脚本。\n- 高级计算和图形学——实时仿真、高性能计算。C++ 用于如 MRI 机等先进医疗设备。\n\n### Java 编程语言的应用\n\n\
    - 桌面 GUI 应用开发。\n- Android 和移动应用开发。\n- Java 在嵌入式系统中的，如 SIM 卡、磁盘等。\n- Java EE（企业级）为运行大型软件提供了\
    \ API 和环境。\n- 网络应用和 Web 服务，如互联网、Web 开发。\n\n环境：C++ 是依赖平台的，而 Java 是平台无关的。你必须在相同的平台上编写和运行\
    \ C++ 代码。Java 具有 WORA（一次编写，随运行）特性，我们可以在这里编写代码并在任何地方运行。\n\n## 如何在 Java 中设置路径\n\n\
    设置 `java` 等工具需要设置路径。如果你将 Java 源文件保存在 `bin` 目录内，则不需要设置路径，因为工具在当前目录中可用。然而，如果你的 Java\
    \ 文件在 `bin` 文件夹之外，则有必要设置 JDK 的路径。\n\n在 Java 中设置路径有两种方法：\n- 临时\n- 永久\n\n### 1)\
    \ 如何在 Windows 中设置 JDK 的临时路径\n\n要设置 JDK 的临时路径，你需要遵循以下步骤：\n- 打开命令提示符。\n- 复制 JDK\
    \ `bin` 目录的路径。\n- 在命令提示符中输入：`set path=copied_path`\n\n### 2) 如何在 Windows 中设置 JDK\
    \ 的永久路径\n\n要设置 JDK 的永久路径，你需要遵循以下步骤：\n转到此电脑属性 -> 高级选项卡 -> 环境变量 -> 用户变量新建 -> 在变量名中输入路径\
    \ -> 在变量值中输入 `bin` 文件夹的路径 -> 确定 -> 确定 -> 确定\n\n**示例：**\n1. 转到此电脑属性。\n2. 点击高级选项卡。\n\
    3. 点击环境变量。\n4. 点击用户变量新建。\n5. 在变量名中输入路径。\n6. 复制 `bin` 文件夹的路径。\n7. 将 `bin` 文件夹的路径粘贴到变量值中。\n\
    8. 点击确定按钮。\n9. 点击确定按钮。\n\n现在你的永久路径已设置。你现在可以任何驱动器执行任何 Java 程序。\n\n### 为 Linux 设置\
    \ JAVA 路径\n\n1. 登录你的账户并打开 `.bash_profile` 文件。\n2. 使用语法 `export JAVA_HOME=<path-to-java>`\
    \ 设置 `JAVA_HOME`。如果你的路径设置为 `/usr/java/jdk1.5.0_07/bin/java`，则如下设置：\n```bash\n\
    export JAVA_HOME=/usr/java/jdk1.5.0_07/bin/java\n```\n3. 如下设置 `PATH`：\n```bash\n\
    export PATH=$PATH:/usr/java/jdk1.5.0_07/bin\n```\n请随意替换 `/usr/java/jdk1.5.0_07`\
    \ 为你的设置值并重新登录以使更改。或者，使用以下命令激活路径设置：\n```bash\nsource ~/.bash_profile\n```\n或\n\
    ```bash\n. ~/.bash_profile\n```\n验证新设置：\n```bash\necho $JAVA_HOME\necho $PATH\n\
    ```\n\n## Java 中的数据类型和变量\n\nJava 中的变量是在程序执行期间存储数据的容器。变量被分配了类型和它可以容纳的值数量。变量是数据内存位置的名称。Java\
    \ 变量有类型：局部、实例和静态。\n\n在 Java 中，有不同类型的变量，例如：\n- `String`：存储文本如 \"Hello\"。String\
    \ 值被包围。\n- `int`：存储整数（不带小数）如 123。\n- `float`：存储带有小数的浮点数，如 19.99。\n- `char`：存储单个字符，如\
    \ 'A' 或 'B'。Char 值被包围。\n- `boolean`：存储具有两种状态的值：true 或 false\n\n为了在程序中使用变量，你需要执行两个步骤：\n\
    - 变量声明\n- 变量初始化\n\n### 变量声明\n`type variable = value;`\n`type` 是 Java 类型之一（如 `int`\
    \ 或 `String`），`variable` 是变量的名称（如 `x` 或 `name`）。等号用于给变量赋值。\n\n**示例**\n创建一个类型为\
    \ `String` 名为 `name` 的变量并赋值为 \"John\"：\n```\nString name = \"John\";\nSystem.out.println(name);\n\
    ```\n\n## 变量的类型\n\n在 Java 中，三种变量：\n- 局部变量\n- 实例变量\n- 静态变量\n\n### 1) 局部变量\n在方法体内部定义的变量称为局部变量。你只可以在该方法中使用此变量，类中的其他方法甚至不知道该变量的存在。局部变量不能用\
    \ \"static\" 关键字定义。\n\n### 2) 实例变量\n在类内部但在方法体外部定义的变量称为实例变量。它没有被为静态。它被称为实例是因为它的值是实例特定的，并且不在实例之间共享。\n\
    \n### 3) 静态变量\n声明为 `static` 的变量称为静态变量。它不能是局部。你可以创建一个静态变量的副本并在类的所有实例之间共享。静态变量的内存分配只在类加载到内存时发生一次。\n\
    \n**理解 Java 变量类型的示例**\n```java\nclass A{\n    int data=50;//实例变量\n    static int\
    \ m=100;//静态变量\n    void method(){\n        int n=90;//局部变量\n    }\n}//类的结束\n\
    ```\n"
- fmt: "\n# Java Variable Example: Narrowing (Casting)\n\n```java\nclass Simple{\n\
    \    public static void main(String[] args){\n        float f=10.5f;\n       \
    \ //int a=f;//Compile time error\n        int a=(int)f;\n        System.out.println(f);\n\
    \        System.out.println(a);\n    }\n}\n```\n\nOutput:\n```\n10.5\n10\n```\n\
    \nThe general rules for constructing names for variables (unique identifiers)\
    \ are:\n\n* Names can contain letters, digits, underscores, and dollar signs\n\
    * Names must begin with a letter\n* Names should start with a lowercase letter\
    \ and it cannot contain white space\n* Names can also begin with `$` and `_` (but\
    \ we will not use it in this tutorial)\n* Names are case sensitive (\"myVar\"\
    \ and \"myvar\" are different variables)\n* Reserved words (like Java keywords,\
    \ such as `int` or `boolean`) cannot be used as names\n\n## Data types in JAVA\n\
    \nData type defines the values that a variable can take, for example if a variable\
    \ has `int` data type, it can only take integer values. In java we have two categories\
    \ of data type:\n\n1) Primitive data\n2) Non-primitive data types – Arrays and\
    \ `Strings` are non-primitive data types, we will discuss them later in the coming\
    \ tutorials. Here we will discuss primitive data types and literals in Java.\n\
    \nJava is a statically typed language. A language is statically typed, if the\
    \ data type of a variable is known at compile time. This means that you must specify\
    \ the type of the variable (Declare the variable) before you can use it.\n\n##\
    \ Java Primitive Data Types\n\nIn Java language, primitive data types are the\
    \ building blocks of data manipulation. These are the most basic data types available\
    \ in Java language.\n\nThere are 8 types of primitive data types:\n\n* `boolean`\
    \ data type\n* `byte` data type\n* `char` data type\n* `short` data type\n* `int`\
    \ data type\n* `long` data type\n* `float` data type\n* `double` data type\n\n\
    ### Boolean Data Type\n\nThe Boolean data type is used to store only two possible\
    \ values: `true` and `false`. This data type is used for simple flags that track\
    \ true/false conditions. The `Boolean` data type specifies one bit of information,\
    \ but its \"size\" can't be defined precisely.\n\nExample: `boolean one = false`\n\
    \nSyntax:\n```java\nboolean booleanVar;\n```\nSize: virtual machine dependent\n\
    Values: `true`, `false`\nDefault Value: `false`\n\n### 2. byte\n\nThe `byte` data\
    \ type is an 8-bit signed two’s complement integer. The `byte` data type is useful\
    \ for saving memory in large arrays. This can hold whole number between -128 and\
    \ 127. Mostly used to save memory and when you are certain that the numbers would\
    \ be in the limit specified by `byte` data type.\n\nDefault size of this data\
    \ type: 1 byte\nDefault value: 0\n\nSyntax:\n```java\nbyte byteVar;\n```\nSize:\
    \ 1 byte (8 bits)\nValues: -128 to 127\nDefault Value: 0\n\n### 3. char\n\nholds\
    \ characters. The `char` data type is a single 16-bit Unicode character. Its value-range\
    \ lies between `'\\u0000'` (or 0) to `'\\uff'` (or 65535). The `char` data type\
    \ is used to store characters.\n\nSize: 2 bytes\n```java\nclass JavaExample {\n\
    \    public static void main(String[] args) {\n        char ch = 'Z';\n      \
    \  System.out.println(ch);\n    }\n}\n```\nOutput: `Z`\n\n### Short Data Type\n\
    \nThe `short` data type is a 16-bit signed two’s complement integer. Its value-range\
    \ lies between -32768 to 32767. Its minimum value is -32768 and maximum value\
    \ is 32767. Its default value is 0. `short` data can also be used to save memory\
    \ just like `byte` data. A `short` data is 2 times smaller than `int`.\n\nExample:\
    \ `short s = 10000`, `short r = -5000`\n\n### int\nUsed when `short` is not enough\
    \ to hold the number:\n```java\nclass JavaExample {\n    public static void main(String[]\
    \ args) {\n        short num;\n        num = 150;\n        System.out.println(num);\n\
    \    }\n}\n```\nOutput: `150`\n\n### 4. long\n\nUsed when `int` is not large to\
    \ hold the value, it has a range than `int` data, ranging from -9223372036854775808\
    \ to 9223372036854775807.\nSize: 8 bytes\nDefault value: 0\n\nExample:\n```java\n\
    class JavaExample {\n    public static void main(String[] args) {\n        long\
    \ num = -123325262L;\n        System.out.println(num);\n    }\n}\n```\nOutput:\
    \ `-123325262`\n\n### 5. double\n\nSufficient for holding 15 decimal digits.\n\
    Size: 8 bytes.\n\nExample:\n```java\nclass JavaExample {\n    public static void\
    \ main(String[] args) {\n        double num = -4293737.9;\n        System.out.println(num);\n\
    \    }\n}\n```\nOutput: `-4.2937379E7`\n\n### 6. float\n\nSufficient for holding\
    \ 6 to 7 decimal digits.\nSize: 4 bytes.\n```java\nclass JavaExample {\n    public\
    \ static void main(String[] args) {\n        float num = 19.98f;\n        System.out.println(num);\n\
    \    }\n}\n```\nOutput: `19.98`\n\n# Operators in Java\n\nOperator in Java is\
    \ a symbol which is used to perform operations. For example: `+`, `-`, `*`, `/`\
    \ etc. There are many types of operators in Java which are given below:\n\n* Unary\
    \ Operator\n* Arithmetic Operator\n* Shift Operator\n* Relational Operator\n*\
    \ Bitwise Operator\n* Logical Operator\n* Ternary Operator and Assignment Operator\n\
    \n## Java Unary Operator\n\nThe Java unary operators require only one operand.\
    \ Unary operators are used to perform various operations i.e.:\n\n* incrementing/decrementing\
    \ a value by one\n* negating an expression\n* inverting the value of a boolean\n\
    \n### Java Unary Operator Example: ++ and --\n```java\nclass OperatorExample {\n\
    \    public static void main(String[] args) {\n        int x = 10;\n        System.out.println(x++);\
    \ // 10 (1)\n        System.out.println(++x); // 12\n        System.out.println(x--);\
    \ // 12 (1)\n        System.out.println(--x); // 10\n    }\n}\n```\nOutput:\n\
    ```\n10\n12\n12\n10\n```\n\n### Java Unary Operator Example 2: ++ and --\n```java\n\
    class OperatorExample {\n    public static void main(String[] args) {\n      \
    \  int a = 10;\n        int b = 10;\n        System.out.println(a++ + ++a); //\
    \ 10+12=22\n        System.out.println(b++ + b++); // 10+11=21\n    }\n}\n```\n\
    Output:\n```\n22\n21\n\n### Java Unary Operator: ~ and !\n```java\nclass Operator\
    \ {\n    public static void main(String[] args) {\n        int a = 10;\n     \
    \   int b = -10;\n        boolean c = true;\n        boolean d = false;\n    \
    \    System.out.println(~a); // -11 (negative of total value starts from 0)\n\
    \        System.out.println(~b); // 9 (positive of total starts from 0)\n    \
    \    System.out.println(!c); // false (of boolean)\n        System.out.println(!d);\
    \ // true\n    }\n}\n```\nOutput:\n```\n-11\n9\nfalse\ntrue\n```\n\n## Arithmetic\
    \ Operators\n\nArithmetic operators are used to perform mathematical operations.\n\
    \n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| `+` | Adds together\
    \ values | `x + y` |\n| `-` | Subtracts one value from another | `x - y` |\n|\
    \ `*` | Multiplies two values | `x * y` |\n| `/` | Divides one value by another\
    \ | `x / y` |\n| `%` | Returns the division remainder | `x % y` |\n| `++` | Increases\
    \ the value of a variable by 1 | `++x` |\n| `--` | Decrements the value of a variable\
    \ by 1 | `--x` |\n\n### Left Shift Operator\n\nThe Java left shift operator `<<`\
    \ is used to shift all of the bits in a value to the left of a specified number\
    \ of times.\n\n```java\nclass OperatorExample {\n    public static void main(String[]\
    \ args) {\n        System.out.println(10<<2); // 10*2^2=40\n        System.out.println(10<<3);\
    \ // 10*2^3=80\n        System.out.println(20<<2); // 20*2^2=80\n        System.out.println(15<<4);\
    \ // 15*2^4=240\n    }\n}\n```\nOutput:\n```\n40\n80\n80\n240\n```\n\n### Right\
    \ Shift Operator\n\nThe Java right shift operator `>>` is used to move left operands\
    \ value to right by the number of bits specified by the right operand.\n\n```java\n\
    class OperatorExample {\n    public static void main(String[] args) {\n      \
    \  System.out.println(10>>2); // 10/2^2=2\n        System.out.println(20>>2);\
    \ // 20/2^2=5\n        System.out.println(20>>3); // 20/2^3=2\n    }\n}\n```\n\
    Output:\n```\n2\n5\n2\n```\n\n### Java Shift Operator Example: >> vs >>>\n\n```java\n\
    class OperatorExample {\n    public static void main(String[] args) {\n      \
    \  // For positive number, >> and >>> works same\n        System.out.println(20>>2);\n\
    \        System.out.println(20>>>2);\n        //For negative number, >>> changes\
    \ parity bit (MSB) to 0\n        System.out.println(-20>>2);\n        System.out.println(-20>>>2);\n\
    \    }\n}\n```\nOutput:\n```\n5\n5\n-5\n1073741819\n```\n"
