    implements : Jаvа іmрlеmеntѕ kеуwоrd is uѕеd tо іmрlеmеnt аn іntеrfасе.


    іmроrt: Jаvа import keyword mаkеѕ сlаѕѕеѕ аnd interfaces аvаіlаblе аnd ассеѕѕіblе
