    \ |\n        System.out.println(a>b||a++<c); // true || true = true\n        System.out.println(a);\
    \ // 10 因为第二个条件没有被检查\n        System.out.println(a>b|a++<c); // true | true =\
    \ true\n        System.out.println(a); // 11 因为第二个条件被检查了\n    }\n}\n```\n\n**输出：**\n\
    ```\ntrue\ntrue\ntrue\n10\ntrue\n11\n```\n\n## JAVA 关键字\n\nJava 关键字也称为保留字。关键字是作为代码关键标识的特定单词。这些是\
    \ Java 预定义的单词，因此不能用作变量或对象名。\n\n### Java 关键字列表\n\n下面列出了 Java 关键字或保留字的列表：\n\n- `abstract`:\
    \ Java `abstract` 关键字用于声明抽象类。抽象类可以提供接口的实现。它可以包含抽象方法和非抽象方法。\n- `boolean`: Java\
    \ `boolean` 关键字用于将变量声明为布尔类型。它可以持有 True（真）和 False（假）值。\n- `break`: Java `break`\
    \ 关键字用于跳出循环或 switch 语句。它在指定的条件下中断程序的当前流。\n- `byte`: Java `byte` 用于声明可以持有 8 位数据的变量。\n\
    - `case`: Java `case` 与 switch 语句配合使用，标记文本块。\n- `catch`: Java `catch` 用于捕获语句生成的异常。它必须在\
