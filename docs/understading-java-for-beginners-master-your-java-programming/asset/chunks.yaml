  trans: "\n\n# Java AND 运算符示例：逻辑 && 与按位 &\n\n逻辑运算符 `&&` 在第一个条件条件为假时，不会检查第二个条件。它只在第一个条件为真时才会检查第二个条件。\n\
    \n按位运算符 `&` 无论第一个条件为真为假，都会检查两个条件。\n\n```java\nclass OperatorExample {\n    public\
    \ static void main(String args[]) {\n        int a=10;\n        int b=5;\n   \
    \     int c=20;\n        System.out.println(a<b&&a<c); // false && true = false\n\
    \        System.out.println(a<b&a<c); // false & true = false\n    }\n}\n```\n\
    \n**输出：**\n```\nfalse\nfalse\n```\n\n# Java AND 运算符示例：逻辑 && 对比按位 &\n\n```java\n\
    class OperatorExample {\n    public static void main(String args[]) {\n      \
    \  int a=10;\n        int b=5;\n        int c=20;\n        System.out.println(a<b&&a++<c);\
    \ // false && true = false\n        System.out.println(a); // 10 因为第二个条件没有被检查\n\
    \        System.out.println(a<b&a++<c); // false && true = false\n        System.out.println(a);\
    \ // 11 因为第二个条件被检查了\n    }\n}\n```\n\n**输出：**\n```\nfalse\n10\nfalse\n11\n```\n\
    \n# Java OR 运算符示例：逻辑 || 与按位 |\n\n逻辑运算符 `||` 在第一个条件为真时，不会检查第二个条件。它只在第一个条件为假时才会检查第二个条件。\n\
    \n按位运算符 `|` 无论第一个条件为真为假，都会检查两个条件。\n\n```java\nclass OperatorExample {\n    public\
    \ static void main(String args[]) {\n        int a=10;\n        int b=5;\n   \
    \     int c=20;\n        System.out.println(a>b||a<c); // true || true = true\n\
