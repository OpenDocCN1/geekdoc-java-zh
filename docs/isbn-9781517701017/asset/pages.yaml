    # 11.2 Abstract Classes


    Traditional classes (e. g. the Infant class), and interfaces represent two extremes
    in Java. A traditional class defines a full set of attributes and set of behaviors,
    with their implementations, for a particular concept. An interface, on the other
    hand, provides constants and behavior names, but by design avoiding any implementation.
    Java has an intermediate notion between these: the abstract class. An abstract
    class provides some implementation for some class methods, but generally marks
    at least one method as abstract. An abstract class is like an interface in that
    it cannot be instantiated (you cannot make an abstract class object).


    When a method is abstract, its header includes the keyword abstract, and its header
    line has the form of an interface header line, in the example below:


    ```

    public double doSomething(String s);

    ```


    Below we''ve created the abstract class LineReader, which duplicates Echo, except
    that we''ve left processLine unspecified, that is, abstract:


    Notice that we''ve done this by making the class abstract in its header line (line
    4), and also by making processLine abstract (line 19). Even though LineReader
    has a constructor, the constructor cannot be used to make LineReader objects:
    as we''ve indicated, abstract classes cannot be instantiated.'
