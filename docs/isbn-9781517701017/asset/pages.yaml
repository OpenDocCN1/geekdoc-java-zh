  md: "# #6.0 Introduction\n\nThe principal topic of this chapter is the **while loop**.\
    \ Java's second main looping construct. Java's **switch** statement, a generalized\
    \ conditional statement, is also introduced. Next, the notion of a **wrapper**\
    \ class is introduced. Wrapper classes provide a way of treating primitives, such\
    \ as int and double numbers, as objects. Last, the chapter provides a first glimpse\
    \ at graphics in Java, by introducing the GridPane class.\n\n# ## Chapter Outline\n\
    \n+   * 6.1 While Loops\n* 6.2 Wrapper Classes and Graphical Input\n* 6.3 Worked\
    \ Example: Pi Estimate\n* Chapter Summary\n\n# ## 6.1 While Loops\n\nJava has\
    \ a second important looping construct, the while loop. Although **while** loops\
    \ and **for** loops are equivalent in power, certain constructions are more natural\
    \ in one than the other. Let's start with a very simple **while** loop. Use our\
    \ Code Stepper to see that it prints 1-2-3-4-5 in a column:\n\n```\nint j = 1;\n\
    while (j <= 5) {\n    System.out.println(j);\n    j = j + 1;\n}\n```\n\nvariable\
    \ j\n\nvalue\n\nComments:\n\nClick the Step button to begin.\n\noutput:\n\nThe\
    \ **int j** is the control variable of the loop. It changes as the loop iterates,\
    \ and the condition (**j <= 5**) is **true** or **false** depending on the value\
    \ of **j**. The loop test must always return a **boolean** value. The loop body\
    \ is the two-statement block that follows the loop test. **While** loops are a\
    \ bit more free-form than **for** loops; in a **for** loop, the control variable\
    \ declaration(s), termination test, and loop variable increment pattern fit neatly\
    \ into slots separated by semicolons in the **for** control line.\n\nIn the example,\
    \ **j** is initialized first. Then the test is performed. Because **j** is initially\
    \ 1 the test is **true**, so **value - 1** is printed. Then **j** is incremented\
    \ to 2. Now the **while** test is applied. Since (**2 <= 5**) is still **true**\
    \ the loop continues. Several iterations later **j** is incremented from 4 to\
    \ 5. **j** passes the test, so 5 is printed. But then **j** is incremented to\
    \ 6. Now the loop test is **false**. This terminates the loop, and program execution"
