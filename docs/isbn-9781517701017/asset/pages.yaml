    It''s important to clarify one other aspect of this example. In general, when
    a Java method is called, we think of the method call as a discrete episode: the
    method is entered, some statements are executed; and then the method is exited,
    ending that call. Call behavior in a recursive setting is a bit more complex.
    In a first call with parameter list (0,1,3), However, before this call is exited,
    a second call, the one with parameter list (-1,-1,-34) is made. This call quickly
    exits with a return value of false. Then another call, the (0,0,-1), is entered.
    It too exits with a value of false. Finally, the (0,1,3) call can exit and return
    a value, and that value is false. This pattern of nested method calls, all to
    the same method, is very typical of recursive processing.


    Technical Note: In Java, the logical OR and AND operators, && and || respectively,
    will not evaluate the second term under certain conditions, in effect performing
    shortcuts. For example, consider this statement: A || B. The second term, B, will
    not be evaluated if the first term, A, is found to be true. Now consider the statement
    A && B. The second term, B, will not be evaluated if the first term, A, is found
    to be false.


