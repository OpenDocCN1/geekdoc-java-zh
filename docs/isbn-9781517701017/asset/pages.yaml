    # 13.2 Graphical Layout Tools and Techniques


    In the last section we showed how to use the mouse to drive activities in graphical
    programs. Now that we have built up a repertoire of graphical components, it is
    time to examine techniques that will allow us to configure complicated graphical
    user interfaces. Layout styles matter because user interfaces can be very complex,
    and thus thoughtful component placement in a window can make the difference between
    a pleasing, straightforward interface and hard-to-clunky one. First we will consider
    some of Java''s layout manager classes. A layout manager is a particular style
    for the components that appear in a GUI. For the next examples we''ll work with
    GUI hardware that would be suitable for building an "electronic" pocket calculator.
    However, we won''t bother to build a working calculator; instead we''ll focus
    on using necessary calculator hardware for demonstrating some of Java''s layout
    techniques. Here, then, is a particular calculator layout.


    ![](img/ef1bdaf694d32c0fef5d3db4e1db57b0_223_0.png)


    As you can see, our calculator has buttons for four arithmetic operations, as
    well as an "enter." label, a text field for numerical submission, a label for
    displaying answers, and a Quit button. This is an example of a Flowlayout, Java''s
    simplest layout scheme. It simply places components in rows. When a row fills,
    the layout continues on another line. As you might expect, FlowLayout is a Java
    class, and a FlowLayout object is a geometric receptacle that can hold other GUI.


    Here is the code for this arrangement:


    ```

