    This chapter begins with an in-depth discussion of Java objects, and their relationship
    to Java methods - Java''s realization of actions that can be taken on behalf of
    an object. Next, class definitions - the blueprints for objects, are presented.
    Lastly Java variables are introduced, and the notion of the assignment statement
    is developed.


    # Chapter Outline


    +   - 2.1 Simple Objects

