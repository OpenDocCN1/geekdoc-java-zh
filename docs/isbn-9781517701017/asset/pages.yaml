    # 3.3 Java Primitives


    While we have identified objects as the principal currency of Java, eight primitive
    types, which are not objects, are also present in the language. These include
    four integer types: byte, short, int, and long; two real number types, float and
    double; the character type char; and the true/false type boolean. Among the integer
    types, int and long are the most used. The type double is preferred for decimal
    numbers. Both the type char and the type boolean play important roles in specialized
    settings in Java, and we will note these as they come up.


    The table below describes these eight types and their various characteristics.


    | Type | Bits | Range | Comment |

    | byte | 8 | -128 to 127 | used when only small whole numbers are considered |

    | short | 16 | -32,768 to 32,767 | used for whole numbers |

    | int | 32 | -2,147,483,648 to 2,147,483,647 | common type for whole numbers |

    | long | 64 | ~9x10¹⁸ to +9x10¹⁸ | also common; used when large integers are possible
    |

    | float | 32 | ~-3x10³⁸ to +3x10³⁸ | represents decimal numbers |

    | double | 64 | ~-1.7x¹⁰³⁸ to +1.7x¹⁰³⁸ | common representation for decimal numbers
    |

    | char | 16 | represents characters | supports 65,536 distinct characters |

    | boolean | 1 | true or false | especially important for testing role in control
    statements |


    Having these eight types as primitives and not objects is awkward. In the next
    chapter we''ll look at Java''s wrapper classes for these types. Wrapper classes
    give us a way to treat primitives as objects when appropriate. For example, we''ll
    consider a class called integer, which is the object form of the int class.'
