    # 10.1 File I.O.


    Our development of Java so far lacks one very important element: the ability to
    read from and write to external files. This facility allows you to store data
    permanently in files on your computer, or retrieve stored data from files on hard
    drive. Java has extensive machinery for handling two distinct kinds of files -
    files that hold byte-oriented data (for example, .class files, such as Infant.class),
    and files that hold character data (for example, a novel, stored electronically,
    or a .java file, such as Infant.java). In this introductory chapter on handling
    file we''ll need to focus exclusively on reading and writing text files.


    You can retrieve data stored in a file using the Scanner class. Program DisplayFile,
    below, echoes, or writes to the console, the contents of any text file on your
    computer.


    Because this program involves i/o (input/output), we need to import Java''s io
    package, which we do on line 2. Notice that on line 5 we define the phrase "IOException
    to the header name of line. We''ll explain in detail why this is necessary in
    Section 10.2. We use the Scanner object nameReader on line 10 to read from the
    keyboard (the (String) name of the file we want to display. Then, on line 11 we
    set up a different Scanner object, scan, which will do the actual reading of the
    file associated with filename. The object scan is built in two steps: first we
    associate a parameter to the Scanner constructor—a FileReader object—and then
    for the purpose of making scan. Notice that we leave unnamed the FileReader object
    inside the argument to the Scanner constructor on line 11. We could have used
    an intermediate name, like:


    ```

    FileReader fr = new FileReader(fileName);

    ```


    and then


    ```

    Scanner scan = new Scanner(fr);

    ```


    But supplying a name for the FileReader object would have accomplished little
    - the object''s only role is to provide an appropriate FileReader object for the
    to-be-constructed Scanner object. Instead of naming it we simply create it as
    part of the constructor, where it is handled immediately by the Scanner constructor.


    We''ve seen Scanner in action only one way so far - reading from the keyboard,
    that is reading from System.in. But Scanner works just as well if you hand it
    a FileReader object, as we''ve done here.


    On lines 12 and 13, we do the reading: while more lines are available, we read
    the next line by calling scan.nextLine(), which we print to the console.


    Finally, on line 15 we close the Scanner object scan, which is associated with
    the external file.'
