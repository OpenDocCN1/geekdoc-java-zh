    int len = s.length();

    ```


    These statements store the value 4 in the int variable len. Notice, by the way,
    s.length() conforms to our standard view of method application: s is a (String)
    object, and length is a String method. length() serves the String s. note length()
    includes the characteristic parenthesis pair following the method name. they must
    always be present. Since the length method simply reports the length of the calling
    String(above), no outside information is needed by the method, and hence no information
    is passed via a parameter. So length method has no parameter list.


    It''s useful to think of String as a group of primitive char elements that have
    been glued together in a row. So glued, each primitive character has a position
    or index in the row, and in Java these positions are integers with 0. Here, for
    example is the String "Mt. Etna" with characters in the String identified by position:


    ```

