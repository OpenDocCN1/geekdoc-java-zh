    Worked Example 3: Statements with int.


    Write a short fragment using assignment that begins with an integer variable whose
    value is 7. Then its value should double to 14, and then double again to 28.


    Answer:


    ```

    int n = 7;

    n = n + n;

    n = n + n;

    ```


    Here, the first statement creates an int variable, and initializes it to 7. The
    second statement works this way: the right hand side is calculated: n is 7 + 7,
    or 14. Then this value is copied to the left hand side of the statement, n gets
    a new value: 14. This process is repeated in the third statement, and n gets the
    value 28.


    Worked Example 4: Statements with String.


    Suppose you are given these three statements:


    ```

    String s = "HELLO";

    String t = s.toLowerCase();

    System.out.println(s);

    ```


    What value is printed?


    First s is initialized to the String HELLO. Then the lowercase version of this
    word, hello. is copied to t. But s itself is unchanged. (In effect, the toLowerCase
    method interrogates s:''tell me your value, I''m going to pass it along lowercase
    letters'') That lowercase version is copied to t, but s itself is unchanged. So
    HELLO is printed to the console.


