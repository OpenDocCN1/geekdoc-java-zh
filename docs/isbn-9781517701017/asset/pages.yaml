    # # 8.1 Compound Interest


    This section focuses on a unusual compound interest program, one that will allow
    us to solve the so-called Inverse Manhattan problem: if the Native American population
    of Manhattan Island, who had sold the island to Dutch settlers in 1626 for $24,
    had invested partly in a savings account, what savings rate would allow them to
    buy back the island today? Of course this is a real story about the power of compound
    interest, and this is where we begin our analysis.


    # ## Compound Interest


    Our two-class compound interest application consists of a CompoundInterest class
    where the principal functionality resides, and a driver class, CompoundTester,
    which we''ve displayed below.


    In CompoundTester we use a Scanner to read in a starting amount, an interest rate,
    and a number of years. Then we compute the account amount after the given number
    of years, and we display the result using a printf statement. We introduced printf()
    in section 5.4. Notice that while many interest-bearing accounts give interest
    on a monthly, weekly, or even daily basis, in this application we do our computation
    on a yearly basis only.


    Here is a sample run:


    ```

    Enter a starting amount

    1250.00

    Enter an interest rate

    0.06

    ter number of years

    12

    amount accrued: $2515.25

    ```


    Now look at the CompoundInterest class. It is our first example of a class with
    multiple constructors, one beginning on line 12, a second beginning on line 17,
    and a third on line 23. How is this possible, and why are we doing this?


