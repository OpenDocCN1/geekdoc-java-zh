  md: '# # 1.4 First Programs


    Now that we''ve had a rather thorough look at print statements, let''s look at
    Java programs. To do this we need to return to objects, Java''s fundamental currency,
    and to Java classes, the source code or textual blueprint for those objects. The
    diagram below loosely depicts a typical Java program.


    ![](img/ef1bdaf694d32c0fef5d3db4e1db57b0_14_0.png)


    Multiple classes participate in the application; here we''ve identified five.
    Exactly one of those classes includes a special piece of code (a special method)
    called main. This main method consists of statements that start the execution
    of the program. Here, for example, there might be a statement that makes an object
    as specified in the "A" class definition, there might be a print statement that
    B object is made. Following this, A and B might communicate information, then
    a C object is made, Finally, an E class method might print a report about all
    the work that the participating objects have. Of course picture is completely
    generic. Many programs involve dozens or even hundreds or thousands of participating
    classes.


    By the time you finish this book, a program directly involving five or six participating
    classes will easily be within your range.


    We won''t start with such complex programs. In this section we''ll look at the
    simplest ones, with this structure:


    ![](img/ef1bdaf694d32c0fef5d3db4e1db57b0_14_1.png)


    In fact we''ll look at classes of this form where main is made up only of print
    statements, like the class Greetings, below:


    The Greetings class is only source code, and thus is unusable until it''s translated
    into machine code. We''ll consider this issue in a minute, but first let''s look
    at the structure of the text that make up Line 1 is the header line. It identifies
    Greetings as a class, and marks the class as public, which means that Greetings
    is available to anyone who wants to use it. Later we''ll talk about opposite,
    private. Java has other visibility qualifiers as well, but we won''t discuss them
    here.'
