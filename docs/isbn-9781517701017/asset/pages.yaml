    # 3.7 Worked Example: Java Statements


    Worked Example 1: Statements with char.


    What''s wrong with these statements?


    ```

    char ch = ''a'';

    char ch = ''z'';",

    ```


    Answer. Suppose these statements appear together in a body of code, for example,
    inside a main method. The first statement is: it assigns the character to the
    char variable ch. However the second statement redeclares ch to a (char) variable
    - this is not allowed. You might see this message:


    ```

    > char ch = ''a'';

    > char ch = ''z'';

    Error: Redefinition of ''ch''

    ```


    On the other hand, this sequence of statements is legal:


    ```

    char ch = ''a'';

    ch = ''z'';

    ```


    First ch is assigned the character value ''a''; then it is reassigned the value
    ''z''.


