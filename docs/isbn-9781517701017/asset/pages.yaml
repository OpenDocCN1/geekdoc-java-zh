  md: "And here is a driver class that reads a possible palindrome using a Scanner\
    \ object:\n\nLook carefully at the palCheck method - this is the key component\
    \ of the class. Notice that its return type is boolean. We are interested in a\
    \ true or false decision: either phrase is a palindrome, or it isn't. The body\
    \ of the method realizes the most complex looking code we've seen so far. We summarize\
    \ the method code in \"story\" mode this way.\n\nAssume that the phrase you're\
    \ considering is a palindrome until you discover evidence to the contrary. Start\
    \ simultaneously at the left and right ends of the phrase. Compare the characters\
    \ at these positions. If there's a mismatch, you're done - the phrase isn't a\
    \ palindrome. Otherwise move one character toward the center on both ends, and\
    \ compare these new characters. Continue in this fashion until the left character\
    \ reference and the right character reference \"cross\". Report false if you see\
    \ any mismatches; otherwise report true.\n\nWe implement this informal algorithm\
    \ using a while loop and two references, one called left, starting at the left\
    \ end of the phrase, and another called right starting at the right end. We use\
    \ a boolean variable ok to monitor the progress of the comparisons. This variable\
    \ starts as true, but is set to false if a mismatch is encountered.\n\nNotice\
    \ how left and right sweep across the phrase: They move in lockstep, simultaneously\
    \ taking one step toward the center for each iteration of the loop.\n\nFrom an\
    \ efficiency point of view there's a clear defect in the algorithm. Suppose the\
    \ phrase we're considering is\n\n> \"I don't want any monkey business - do you\
    \ understand?\"\n\nThis is an immediate non-palindrome, the characters on the\
    \ ends 'I' and '?' dont match up. Nevertheless the entire phrase is scanned, and\
    \ ok is set to false over and over again. Let's look at two ways to correct this\
    \ defect. First, we can adapt the code as follows:\n\n```\npublic boolean palCheck(){\n\
    \    int left = 0;\n    int right = letters.length() - 1;\n    boolean ok = true;\n\
    \    while(left < right && ok) {\n        if (letters.charAt(left) != letters.charAt(right))\
    \ {\n            ok = false;\n        }\n        left++;\n        right--;\n \
    \   }\n    return ok;\n}\n```\n\nThat is, we've changed the while test so that,\
    \ for the loop to continue, left must be less than right and also the boolean\
    \ variable ok must be true. This means that as soon as we discover a mismatch,\
    \ ok will be set to false in the body, and on the next iteration it will fail,\
    \ ending the loop.\n\nWe can also end the loop prematurely in another way. Java's\
    \ break statement causes a program to exit the current looping statement as it's\
    \ encountered. Here, as soon as the program detects that ok is false, the loop\
    \ is exited. This is useful for while, for loops, and for switch statements, a\
    \ kind of generalized conditional statement we call in a moment.\n\n```\npublic\
    \ boolean palCheck(){\n    int left = 0;\n    int right = letters.length() - 1;\n\
    \    boolean ok = true;\n    while(left < right) {\n        if (letters.charAt(left)\
    \ != letters.charAt(right)) {\n            ok = false;\n            break;\n \
    \       }\n        left++;\n        right--;\n    }\n    return ok;\n}\n```"
