    # 2.3 Identifiers, Variables and Assignment


    In Java there are many opportunities for naming things, such as classes or variables.
    Such names are officially called identifiers. Not all strings of characters are
    legal identifiers. Infant and myKid are ok, but chickenLicken-14 is unacceptable.
    Here are the rules.


    An identifier must consist of letters, digits or the underscore character _ An
    identifier may not begin with a digit. Finally, under certain circumstances, identifiers
    may contain $ . Here is a list of valid and invalid identifiers.


    chickenLicken-14 invalid (contains a "dash")


    chickenLicken-14 valid


    R2D2 valid


    hello_12 valid


    3cpo invalid (starts with a digit)


    Another point, and this is VERY IMPORTANT. Java is case-sensitive. If you write
    these two lines of code:


    ```

    Infant myKid = new Infant("Jill", 3); // declares variable myKid mykid()

    ```


    you will get an error: the identifier mykid (lower case k) is different from the
    identifier myKid (upper case k), and myKid has never been declared.


    Finally, declarations for a particular variable can only happen once. These two
    statements:


    ```

    Car stacyCar = new Car("Honda", 12.0.4.5), stacyCar = new Car("Saturn", 15.0,
    10.0);

    ```


    are completely acceptable (Stacy gets a new car). However, the statements below,
    one after the other, are invalid and you''ll get an error if you write them in
    a class and then to compile that class:


    ```

    Car stacyCar = new Car("Honda", 12.0.4.5),

    stacyCar = new Car("Saturn", 15.0, 10.0);

    ```


    The problem is that the variable stacyCar has been retyped.'
