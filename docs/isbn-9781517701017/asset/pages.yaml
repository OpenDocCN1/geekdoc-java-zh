    # Java''s for-each Construction


    Java includes one more loop construction, called for-each, or extended for, which
    is particularly useful when working with arrays, or other related structures.


    Suppose nums is an array of ints. Then the for-each loop will print the values
    in nums in a column.


    ```

    for(int value : nums)System.out.println(value);

    ```


    Out loud, you would read this as "for each value in nums, print that value."


    Syntactically, this form of array statement provides a type(int), then a variable
    (value), and after a colon, the structure (nums) allows the variable to range
    across array. With a traditional for loop, the for body can be either a single
    statement or a block of statements wrapped in braces.


    Notice how this simplifies the standard for loop framework, where you would write:


    ```

    for(int j = 0; j < nums.length; j++)

    System.out.println(nums[j]);

    ```


    In the standard for loop version, you identify a variable (j) whose value advances
    in steps across the cell indices of the array. In the for-each case, by contrast,
    no index variable is mentioned at all. In our example, the variable value takes
    the values of the successive array cells directly. This highlights an important
    characteristic of the for-each loop: this kind of looping is only appropriate
    for code that traverses an entire array, from front to back.


    Here is another for-each example. We use it to write a method that computes the
    average of an array of double


    ```

    public static double average(double[] nums)

    double total = 0;

    for(double d : nums) total = total + d;

    return total/nums.length;

    }

    ```


    The for-each construction comes with a significant restriction: you can''t use
    it to alter an array directly. Consider this fragment:


    ```

    int[] nums = {10, 20, 30};

    for(int i : nums)nums[i]++

    for(int i : nums)System.out.println(nums[i]);

    ```


