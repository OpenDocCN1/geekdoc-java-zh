    # 5.4 Algorithms


    An algorithm is a systematic way of doing some job. Algorithms are often described
    informally. A recipe is an algorithm. So are the directions to your local airport,
    and so are the pattern of folds you need to make in order to construct an origami
    crane.


    Algorithms are crucial in computing; their realization, or implementation in code,
    is precisely how programming chores are accomplished. In our treatment of Java
    we''ve often distinguished between the language at the class/object level - the
    higher order of Java applications - Java at the statement level. It''s primarily
    at the statement level, inside one or several methods, where we encounter algorithmic
    thinking. In this section we''ll look over several algorithms, and we will present
    a few simple paradigms that will help you to think about algorithms and help you
    to convert algorithms to code.


    Let''s start with an example. Suppose that we are given an arbitrary integer n
    (Algorithms work this: start with some fixed but arbitrary value). How many proper
    divisors does it have? A proper divisor of n is a number less than n that divides
    it. Here''s a first rule of algorithmic thinking:


    +   * If you stuck, reach for pencil and paper.


    And here''s a second:


    +   * If things are too abstract, a special case or a concrete example.


    Putting these two rules together, we can ask: how many proper divisors does 15
    have? This is easy. Its proper divisors are 1,3,5, so 15 has 3 proper divisors.
    How about 11? 11 has 1, 1 itself. And what about 100? Because 100 is a bit larger,
    the answer isn''t automatic. So now process matters. How do I proceed systematically?
    This question gives us another rule:


    +   * Look for process - how do approach a moderately sized example systematically?


    For the proper divisor problem for the value 100 here is a way to count proper
    divisors systematically:


    +   * set divisor count at 0

    * check the numbers from 1 to 99

    * whenever a divisor is discovered, up the count by 1


    This is in fact it has some characteristics that occur so frequently that we can
    loosely assign it a name: it''s a generate and test algorithm. We generate all
    the numbers from 1 up to n, and for each we see if it divides it evenly (that
    is, has remainder 0). Then we take some action. Generate and test is especially
    pleasing because the conversion to an implementation is usually straightforward


    ```

    int count = 0;

    for(int j = 1; j < n; j++) {

    if ( n % j == 0) count++;

    ```


    Generate and test has many applications. For example, how about an algorithm for
