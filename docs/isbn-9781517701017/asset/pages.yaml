    a MouseEvent, and objects come with methods getX() and getY(), which report the
    x and y coordinates of the event. Using these methods, a location String form
    is constructed on line 20, and this location is referenced and displayed in paintComponent
    when invoked by the repaint() on line 21. One final point: the paintComponent
    code (line 14) does not begin with a super class. This means that the window is
    not cleared between mouse clicks, and so when you click times, previous locations
    are not erased.


