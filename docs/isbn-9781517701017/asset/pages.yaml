    #  Additional Swing Topics


    Swing has a very useful clock-like component called Timer (Be careful, there is
    a completely different Java class Timer in the package java.util. A Timer object
    generates ActionEvents, just like a JButton does, and these can be detected and
    acted upon inside a call to the actionPerformed method. This statement


    ```

    clock = new Timer(100, <listener>);

    ```


    creates a timer called clock, which issues an event every 100 milliseconds (every
    1/10th of a second). We say that clock has a delay of 100 milliseconds. A Listener
    for the Timer object is also identified in the constructor class. As we will see,
    Timer objects are especially useful when you want to develop an animation or less
    from scratch The class below uses a Timer object clock to change the background
    color of a JPanel every 2 seconds.


    ```

    import java.awt.*; import javax.swing.*; import java.awt.*; public class TimerExample
    extends JPanel implements ActionListener{private boolean colorToggle = true; private
    Timer clock = new Timer(2000,this); public TimerExample(){setPreferredSize(new
    Dimension(500,500)); clock.start();} public void paintComponent(Graphics g){if
    (colorToggle) setBackground(Color.green); else setBackground(Color.red);} public
    void actionPerformed(ActionEvent e){if(e.getSource() == clock){colorToggle = !colorToggle;
    repaint();}}

    ```


    The Timer class has a variety of methods for manipulating Timer objects. If there
    is a Timer object, then


    ```

    t.stop()

    ```


    stops t


    ```

    t.setDelay(1500)

    ```


    sets t''s delay to 1500, and


    ```

    t.getDelay()

    ```'
