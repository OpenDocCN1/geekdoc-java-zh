  md: '# Conventions


    Java also comes with a number of conventions that most Java programmers respect,
    even though they are not officially part of the language. The first letter of
    class names are capitalized. This is the Infant class and the Var class. On the
    other hand variable names begin with a lower case, as in jillsCar. And finally
    identifiers that are compounds, such as myKid, uncleHenryMonster, and jillsOtherCar,
    follow the convention that leads in all embedded words are capitalized.


    Identifiers should convey as much information as possible. Calling Dana''s new
    baby "x" instead of damesBaby is foolish. Real programs are not throwaway, but
    are instead artifacts that will be studied, corrected, modified, over a period
    of months or years. This makes the clarity of your program text, and in particular
    the names you use for important program elements as variables and methods, extremely
    important.


    ![](img/ef1bdaf694d32c0fef5d3db4e1db57b0_27_0.png)


    The length of an identifier should be inversely proportional to its frequency
    of use - which is a long-winded way of saying if you expect to use an identifier
    frequently, make it short. Here is an example. Suppose you are writing a geometry
    program, and you want to create your own Point class. Each point will have x and
    y coordinates as attributes. You could start out your class declaration this way:


    ```

    public class Point { int xVal; int yVal; .. }

    ```


    or you might do this way:


    ```

    public class Point { int _x_coordinate; int _y_coordinate; .. }

    ```


    Both are legitimate. However, since your class will refer to the x and y values
    of a point over and over again, the shorter form is greatly preferred.


    # Assignment Statements


    We think of Java as operating at several levels, an object level the primary subject
    of this chapter, and a statement level, the level of statements such as point
    and assignment commands, where atomic chomping chores are done. Let''s work at
    the statement level now and look more systematically at assignment statements.
    So far we''ve seen assignments that involve numbers:


    ```

    int age = 11;

    ```


    ```

    double mpg = 31.7;

    ```


    We''ve also seen assignments that involve objects, like this one:


    ```

    Car stacysCar = new Car("Honda", 12.0, 4.5);

    ```


    In each case we have associated the variable on the left-hand side of the assignment
    with a computed value (or constant value) on the right-hand side. Sometimes assignment
    statements can be confusing, as with


    ```

    age = age + 1;

    ```'
