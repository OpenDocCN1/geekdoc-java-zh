    Let''s make this more concrete by revisiting the “cell” model of variables we
    introduced in the last section. Since age is an integer attribute, there is a
    cell in memory labeled (and here with the object myKid) that literally holds the
    value 4. When you write the assignment statement age += 1; Java evaluates the
    right hand side of this expression by first looking in the age cell to find the
    value of age (4); then, on sort of scratchpad, Java adds 1 to this value to get
    the value 5, and finally Java assigns this new value to age by literally copying
    5 from the scratchpad to the age cell, in process overwriting the old value stored
    there - the 4.


