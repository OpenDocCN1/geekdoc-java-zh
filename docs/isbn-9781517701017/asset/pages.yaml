    button. Here, though, there is no button: the source of the event - is always
    present, and so we don''t have to identify it, except by


    addMouseListener(this);


    Now we need to describe the MouseListener interface. It consists of five methods.
    (Recall that the ActionListener interface identified only one method, actionPerformed.)
    However, the Locator class uses only one of the methods: mouseClicked. Still,
    while the other four are not used, we are required by the terms of the interface
    to provide bodies for each of them. We do this at the end of the class by making
    empty bodies (lines 24-27). These are alive, but do nothing.


