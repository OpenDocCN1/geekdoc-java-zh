  md: '# 2.2 Class Definitions


    Where do infants come from (in Java, anyway)? While we have described how to make
    Infant objects, how to query them, modify them, and print information about them,
    we have yet to say how these mechanisms originate. The needed support machinery
    operates in two phases. First we write a definition for the Infant class. Then
    we must compile this class. The definition serves as the blueprint for the objects
    in the class. Here is the Infant definition.


    Some general observations. First, the text class must reside in a file, and that
    file must be called Infant.java (a file must have the same name as the class,
    followed by the java file extension). This file is called the Infant class source
    file. It is useless unless it is compiled. If compilation is successful, the resulting
    object file has the name Infant.class. Finally, in the last section we discussed
    the InfantTester class, which included main, and which makes extensive use of
    the Infant class. Its only work if there is a compiled version of the infant class
    in the same folder or directory as the object file InfantTester.class.


    The InfantTester makes an Infant object, called mykid, and then proceeds to take
    various actions with regard to mykid, such as retrieve mykid using the getAge
    method. It may seem perfectly natural to retrieve mykid''s height, doing something
    like mykid.getHeight() - you can''t do it. As written, the infant class has no
    method getHeight(), and has no height attribute at all. We can work with a class
    that uses that class''s attributes and methods only, if there is no getHeight()
    method, and no height attribute, we''re stuck.


    Let''s look at the Infant class source file more closely (again, line numbers
    should not appear in java source files). Line 1 gives the name of the class. By
    convention Java class names are required, and the qualifier (sometimes called
    access specifier) public says that this class is available to any other application
    (or the use of qualifiers like public and private later). The " " on line 1 matches
    up with the " " on line 16; these paired symbols enclose the body of the class
    definition.


    The class attributes name and age are identified at the beginning of the class
    definition, on lines 3 and 4. The phrase "age in months" that preceded by // on
    line 4 is a comment. Java ignores comments, but comments provide valuable information
    to programmers about the meaning and intention of parts of the code definition


    The constructor begins on line 6. It has two formal parameters, called who (a
    String) and months (an int). The type tags (String and int) are obligatory. The
    constructor definition is closely linked to the format of the constructor call,
    as it appears in the class InfantTester.


    Infant mykid = new Infant("Lizzie", 4).


    When you say


    new Infant("Lizzie", 4),


    you are invoking the constructor. "Lizzie" is associated with who in the constructor
    header line, and 4 is associated with main loop. Via the assignment statements
    on lines 7 and 8, "Lizzie" and 4 become the values of the attributes - name and
    age of the newly created Infant object mykid.


    Similarly, if you say


    Infant thatKid = new Infant("Jan", 8);'
