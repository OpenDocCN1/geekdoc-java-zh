  md: 'To print these tokens in a column:


    Ever,

    ever

    try

    kale??


    we execute this expression:for(String v : w) System.out.println(v);


    One complication. Consider this sentence:


    ```

    String t = "hi       there";

    ```


    There are four spaces between "hi" and "there". Now if you run the split code:",


    ```

    String[] z = t.split("  ");

    ```


    z has five cells, for "hi", one for "there", and three empty cells in the middle.


    | | | | | |

    |---|---|---|---||

    | hi | | | there |

    | 0 | 1 | 2 | 3 | 4 |


    With split, when there are multiple delimiters in a row, the array returned has
    extra empty cells. If there are four delimiters in a row three empty cells are
    produced; with ten in a row, nine empty cells are produced. To sidestep this peculiarity,
    we might use this code to print just the non-empty tokens in a column:


    for(String v :z) if(v.length()>0) System.out.println(v);


    Lastly need to deal with multiple delimiters, which will allow us to throw away
    punctuation. With regular expressions, to indicate that any several characters
    can be a delimiter we use bracket notation: []. This [?.], appropriately presented
    as an argument to split, means that a string should "break" at a space, a question
    mark, or a period, comma, or an exclamation point. Look at these two statements:


    ```

    String s = "Ever, ever try kale??";

    String[] w = s.split("[, ]+");

    ```


    The split expression -a String, via the quotes - treats blanks and commas as delimiters.
    Either symbol will induce a break in the calling string. Moreover because there
    are now two consecutive delimiters (comma, then blank) after "Ever", there will
    also be an empty cell in the array returned by split:


    | | | | |

    |---|---|---||

    | Ever | try | kale?? |

    | 0 | 1 | 2 | 3 | 4 |


