    # The anotherMonth Method


    Each month an infant''s age goes up by 1. We can capture this fact with a different
    kind of method, a mutator method called anotherMonth(). It''s used on line 7 in
    the InfantTester code, above, and repeated here:


    ```

    myKid.anotherMonth();

    ```


    When we created myKid with Lizzie, she was 4 months old. Executing this statement
    increases the age to 5.


    Generally we can track the age of an object in a certain state, and that state
    is just the values of its attributes, nothing more, nothing less. For example,
    the initial state of myKid is "Lizzie" and 4.


    The method anotherMonth() changes an Infant state. In the case of the myKid object,
    the state changes from "Lizzie" and 4 to "Lizzie" and 5 — the method changes values
    of the attributes that make the object. This is very important. Java is built
    around an object model because objects are a good mechanism for modeling the world.
    Items in the world change over time — get older, cars run out of gas, bath water
    cools off., operating systems on new jobs. We want objects that model such items
    to be able to reflect these changes, and mutator methods are Java''s way of doing
    this.


