    Let''s begin with this simple String:


    ```

    String s = "Ever, ever try kale";

    ```


    And now lets apply the split method:


    ```

    String[] w = s.split(" ");

    ```


    As you can see, split returns an array of strings, here called w. This array holds
    the individual words in s, with punctuation included. The argument to split is
    the String of length consisting of the single space character. In general case
    the single character argument can specify any character or characters as delimiters;
    in this case the result is that s is split into tokens that are separated by simple
