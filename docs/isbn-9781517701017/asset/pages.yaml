    ```


    We begin with a mathematical account of how we''ll set up the program. In the
    diagram below, we''ve drawn a

    circle of radius 1.0. Since the area of this circle is pi*r² = pi*(1.0)² = pi,
    if we can estimate its area using random

    points, we will have our desired pi estimate.


    Area of quarter circle = pi/4


    ![](img/ef1bdaf694d32c0fef5d3db4e1db57b0_113_0.png)


    Area of circle = pi * 1.0 * 1.0 = pi = 3.14159'
