    # Type Conversion


    Suppose you want to compute the average of two integers, say a and b. The expression
    (a+b)/2 won''t divide because it is integer division, so that if, for example,
    a is 3 and b is 6 you''ll get 4 for an answer instead of the desired answer of
    4. But if you write the expression as (a+b)/2.0 Java will automatically treat
    the numerator as a decimal point, and you''ll get the desired answer. In general,
    if you perform an arithmetic operation in which one of the operands is float or
    double and the other operand is an integer type, the result will be float or double.


    ```

    (2.0 + 3)/2 = (2 + 3.0)/2 = (2 + 3) / 2.0 = 2.5

    ```


    You can also perform an explicit cast. When you cast in Java, you convert a value
    in one type to a value in another, related type. Thus


    ```

    (double)(2 + 3) / 2 = 2.5

    ```


    That is, the cast expression (double) explicitly converts the numerator from 5
    to 5.0.


    Here are some additional examples of implicit and explicit casts, correctly and
    incorrectly applied.'
