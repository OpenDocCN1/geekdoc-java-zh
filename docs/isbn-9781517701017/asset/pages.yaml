    really want to do is to take the square root of a primitive item, a number.


    Java''s remedy for this is the notion of a static method. A static method is a
    method that doesn''t serve an object but instead serves an entire class. The methods
    in Java''s Math class are all static. These methods are involved with mathematical
    computations involving numbers. They represent common mathematical functions like
    sqrt. The Math class also includes static constants that represent important mathematical
    quantities, such as pi. Note the Math class is a standard class in java.lang,
    and as such is automatically loaded and does not require a special import statement.


