  md: '# 7.0 Introduction


    The principal topic of this chapter is the **array**. An array is a Java object
    that represents a collection of commonly named variables that are used to model
    groups of similar items in the world, such as seats in an auditorium. Both arrays
    of primitives and arrays of objects are discussed. Along the way an extended for
    loop, the **for-each** construction, is introduced.


    # Chapter Outline


    +   - 7.1 Arrays

    - 7.2 Arrays of Objects

    - 7.3 Supplement: 2Arrays

    - 7.4 Worked Example: The Infant Class

    - 7.5 Supplement: ArrayLists

    - Chapter Summary


    # 7.1 Arrays


    Think about students in a class, or seats on an airplane, or rooms at a motel.
    Each of these examples, if modeled in Java, would require dozens, hundreds, of
    similar but distinct variables. Given only what we know so far, dealing with many
    variables would be very awkward. For example, suppose you want to print out the
    names of the occupants of each seat on airplane. With 300 seats, 300 separate
    variables would be required. Even though the seats are identical except for seat
    number order, there''s no way to loop through them systematically to print the
    passenger list. Arrays, of this chapter addresses this shortcoming directly. Arrays
    allow you to link similar variables together - students, seats, or motel rooms
    - with a common name, so that, for example, a sweep through (the variables representing)
    the seats, in order to print a passenger list, could be accomplished with a single
    `for` loop.


    Here is a simple first example application. It creates 10 arrays of type `int`
    with a common name, `firstName`. The individual variables are called `firstName[0]`,
    `firstName[1]`, and so forth, up to `firstName[9]`. These variables have a common
    name, but they differ by index - the boxed value following the the name. The individual,
    indexed variables are sometimes called *components* of the array. This program
    places in each component variable the square of its index - so `firstName[2]`
    stores 4, `firstName[3]` stores 9 and so. Then the final loop in the program prints
    these stored values in a column.


    The declaration on line 6 creates an array of 10 int variables named `firstName[0]`
    through `numbers[9]`. In a similar way we could create 5 double variables named
    `numbers[0]` through `numbers[4]:


    ```

    double[] numbers = new double[5];

    ```


    or 31 boolean variables named visitingDays[0] through visitingDays[30]:


    ```

    boolean[] visitingDays = new boolean[31];

    ```


    or 20 Infant variables named kids through kids[19]:


    ```

    Infant[] kids = new Infant[20];

    ```


    Note: In mathematics, subscripts are often used to name distinct variables, for
    example: $x_0, x_1, \dots, x_n$. You can think of the notation `firstName[7]`,
    `numbers[j]`, and `kids[k]`, as long versions of this subscript form `firstName[]`,
    `numbers[]`, and `kids[]`.'
