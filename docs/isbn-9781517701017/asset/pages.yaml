  md: 'The explanation of this peculiar behavior leads us to the java class Object.
    The class Object is the ultimate base class: all java classes are each derived
    directly from it, or are derived from classes that are derived from it. Indeed,
    we can draw the following diagram to describe the derivation of the class Drunk,
    from the last section:


    ![](img/ef1bdaf694d32c0fef5d3db4e1db57b0_172_0.png)


    That is, Random extends Object, Chance extends Random, and Drunk extends Chance.


    Having a single root class like Object has a number of advantages, and here we''ll
    take up one in particular. Object comes with a number of built-in methods, one
    of which is toString. The toString method in Object isn''t very useful, but it''s
    always there. When we wrote i.toString(), above, we asked the Infant object i
    to call the Infant version of toString. Since we never wrote one, Java goes to
    Infant''s super class and uses that instead. Infant''s super class is Object.
    (Notice that we didn''t explicitly extend any class when we created Infant; Java
    recognized it, and automatically made Infant extend Object behind the scenes.)
    Calling i.toString() amounts to calling Object''s (universal but very useful)
    toString() method. And here''s what it does: it returns the name of the class,
    followed by the memory address where the object in question (here: ) is stored.


    When you add a toString method to a class, you''re not really creating the method
    from scratch; instead, you''re actually overriding the toString method in the
    super class, which is often the class Object.


    We''ll see another use of Object later in the text, but for now it''s sufficient
    just to know that it''s there, and that it represents the ultimate base class.


