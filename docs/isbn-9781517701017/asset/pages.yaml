    # 2.1 Simple Objects


    In the last chapter we looked at a simple application called Greetings. It had
    this structure:


    ![](img/ef1bdaf694d32c0fef5d3db4e1db57b0_19_0.png)


    The main method lives inside the Greetings class. We saw that inside main we can
    have one or several statements. So far these statements have all been print or
    println commands.


    Now we want to expand on our idea of main. We can think of main as a sort of "stage"
    - a main stage at a theater you will - on which actors, called objects in Java,
    play out their roles. As weve indicated, objects are the main currency of Java.
    While the language includes other entities, such as numbers, characters, and true-false
    values, objects are Java''s core concept, and the mechanisms for their organization
    and manipulation frame the central organizing principles in the language.


    Let''s set the stage first. This diagram shows the classes that will participate
    in our next example:


