  md: '# # Preface


    This online book represents a new approach to programming language instruction.
    The Interactive Java system includes a traditional narrative - the ''story of
    Java'', if you will - but the narrative is punctuated by a variety of interactive
    materials and activities, including short videos, interactive execution traces,
    drill units with randomly generated examples, worked examples, running programs,
    and most significantly, almost 200 embedded problems, mostly involving programming.
    These ancillary materials are aimed at enhancing the experience of reading and
    learning from a textbook. The embedded problems are generally pretty, and serve
    as a kind of practice as you learn. It automatically checks correctness in real
    on a remote server. If you are using Interactive Java in a formal class, the embedded
    problems, as well as the 200 or so, somewhat harder automatically generated end-of-chapter
    problems, will come with due dates and point valuations. The text assumes no programming
    knowledge.


    # ## Philosophy


    While I consider the text to be an objects-first approach to Java instruction,
    the book has been conceived with a different principle in mind. In the particular
    the text is problem-driven, rather than driven by the object-oriented metaphor.
    While the first three chapters focus closely on object-oriented principles, the
    material in the six chapters that follow are developed with an eye towards presenting
    interesting examples. This is design in our framework, as well as the inclusion
    of extensive statement level commands - looping, random number generation, keyboard
    interaction - present to support a variety of interest, and at times valuable,
    simple programs. Graphical user interfaces, including motion interaction, and
    animation, are provided in the last two chapters in an intellectually honest way
    (that is, after a proper introduction to inheritance and interfaces).


    # ## Textbook Materials


    In addition to embedded problems that are integrated in the text and chapter exercises
    at the ends of chapters, Interactive Java also includes programming projects.
    These must be graded by hand, although projects in the text are generally instrument
    so that that output on student submissions can be easily compared against output
    from a master solution. In addition, unvaluated materials in the text include:


    +   * Program reading dialogues. These are intended to help students learn to
    read code.

    * Worked examples.

    * Code stepper examples. These examples cannot traces of sample programs.

    * Short videos on selected topics.

    * Longer videos that summarize actual delivered lectures on Java programming.

    * Code mouse-over narrations.

    * Simple coding and execution drills involving randomly generated examples.


    The text also includes three optional sections, on 2D arrays, array lists, and
    regular expressions. These are interesting extra topics that don''t fit into a
    14 week class for beginners. As has often been said, there is too much Java, and
    too little time.


    # ## Prerequisites


    Previous programming experience is not required for using Interactive Java; in
    our UMass classes, fewer than 50% of students have ever programmed before. Mathematics
    sophistication is not a requirement, but some mathematical skill is necessary.
    Roughly speaking, you need to be comfortable with concepts like interest, basic
    probability (e.g. for coin flipping), simple number theory ideas, such as divisibility,
    and basic ideas from elementary geometry. If you are comfortable with the ideas
    in the second year of a decent high school algebra course, then the mathematical
    content of Interactive Java should present no problems.'
