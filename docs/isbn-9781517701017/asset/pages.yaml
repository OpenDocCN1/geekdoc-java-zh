    # Priority Classes for Operators


    When arithmetic expressions involve parentheses, parenthesized expressions are
    evaluated first. ((4+5)*2) has value 18. However, when an expression is not fully
    parenthesized, as as in (4+5*2), special rules determine evaluation order. Java''s
    operators are stratified into priority classes. *, / make up one priority class,
    and +, make up the other. The operators *, /, and have higher priority, and so
    they are performed first. Thus the value of (4+5*2) is 14, since * has higher
    priority than +, and so multiplication is the first operation performed. Important:
    when operators have the same priority, they are applied left to right. Thus, (8*3/4)
    = (24/4) = 6.


    Here are some other examples.


    ```

    (2+3+4*2 - 5)

    ```


    ```

    (2+4) * / -

    ```'
