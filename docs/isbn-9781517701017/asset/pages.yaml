- img_proc: true
  md: 'The first statement''s output is certainly believable, but in the case of the
    second, it''s important to understand that the print statement evaluates its argument
    (the stuff inside the parentheses) before it prints, which is to say, it calculates
    the first sum, and then prints. How


    System.out.print("3 + 5");


    When you make a literal string - that is, when you wrap characters in double quotes,
    you are creating something whose value is "itself", literally. Now the plus sign
    is just another character - it doesn''t do anything. So the statement above prints


    +   : 5


    # The Nature of +


    Plus is more complicated than you might think. It''s true that 3+5 is 8, but it''s
    also true


    System.out.print("Hi " + "there");


    prints


    Hi there


    In other words, + does addition when its operands are numbers, but when its operands
    are Strings, enclosed between quotes, + is a "glue" operator, pasting the two
    strings together to make a new literal String.


    What about mixed expressions, like these:


    ```

    System.out.print("the sum is " + 3 + 5");

    System.out.print("the sum is " + (3 + 5)");

    ```


    Here''s the rule: Expressions inside parentheses are always done first. Then,
    starting at the left, + looks at its operands. If both are Strings, it pastes;
    if both are numbers, it adds; and if one is a String and one is a number, it pastes,
    making a new String. The first example above prints


    the sum is 35


    because first it pastes 3 on the end of the phrase making the string "the sum
    is 3", and then it pastes 5 on that result. By contrast, the second statement
    evaluates the parenthesized expression first, and then pastes, giving:


    the sum is 8


    This dual use for the plus operator is a feature of many languages. It''s called
    operator overloading.


    Now this problem:


    ![](img/ef1bdaf694d32c0fef5d3db4e1db57b0_13_0.png)'
