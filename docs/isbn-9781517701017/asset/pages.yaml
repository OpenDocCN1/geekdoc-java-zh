    Palindromes

    A palindrome is a text (a phrase) that is the same forwards and backwards. Most
    written languages have oddball palindromes. In English, the phrase "A man a plan
    a canal Panama" is considered a palindrome; as is the Finnish word for salesman
    "saippuakauppias". For now we assume a very strict definition: a string is a palindrome
    regardless of its reverse. "Sakkaukauppias" passes the test. "A man named Panama"
    fails because the second character in the string is blank, while the next to the
    last is "Otto" doesn''t work according to this definition either, because O and
    o are different characters.


    We''ll look shortly at handles palindromes that satisfy the most restrictive definition,
    and we''ll put off until later handling examples with spaces, non-letter symbols,
    and capital letters, like the zingers below:


    Live dirt a sidetracked carted is a putrid evil


    Doc, note: I dissent. A fast never prevents a fatness. I diet on cod.


