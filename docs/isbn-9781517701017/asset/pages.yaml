  md: '# 1.3 Starting Java


    Now we''re ready to start programming. Despite our discussion in the last section
    about the role of objects as Java''s organizing principle, Java includes a more
    primitive notion: the notion of a statement. A statement is one line of code that
    does something - although sometimes one line can go on for a while. The easiest
    statements to understand are print statements:


    ```

    System.out.print("Hi");

    ```


    This simply prints "Hi" to the console (your screen). Note: a sequence of characters
    wrapped in double quotes is called a String.


    The print command has a cousin, println:


    ```

    System.out.println("Hi");

    ```


    This statement also writes "Hi" to the console, but because of that "In" ending
    - it advances to the next line after finishes printing the "Hi" String.


    The effect works like this:


    ```

    System.out.print("Hi");

    System.out.print("There");

    ```


    prints


    HiThere


    whereas


    ```

    System.out.println("Hi");

    System.out.println("There");

    ```


    prints


    HiThere


    By the way, to get "Hi There" as output, leave a space after the i:


    ```

    System.out.print("Hi ");

    System.out.print("There");

    ```


    To summarize: print a message to the screen, enclose it in double quotes to make
    it a String; then use one of the two print commands we identified to do the printing.


    Print statements can print more than literal strings. This statement prints 8:


    ```

    System.out.print(8);

    ```


    As does this one:


    ```

    System.out.print(3 + 5);

    ```'
