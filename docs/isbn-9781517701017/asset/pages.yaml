    # 12.2 Graphics and the Event Model


    Think about how the mouse works with this web page. If you click here -> nothing
    happens. But if you click on the any of the live icons, buttons, arrows, etc,
    that appear around the page, things do a small window pop up, you might jump to
    another web page, or you might kill the window altogether. What''s more, the sequence
    of mouse-clicks is driven by your whims and interests, and not by a sort of script
    that determines keyboard interaction with a Scanner; object.


    A mouse click on your computer screen is considered an event in Java. While some
    clicks - like the one on the X, above, fall de ears - as we''ve indicated - really
    matter. In this section we''ll discuss event-driven programming. This is a programming
    idiom which user interaction (mostly) mouse-controlled events directs applications.


    Our initial focus will be on buttons, or more properly the JButton JButton is
    a Swing class, and objects of this class look like in a GUI program. When you
    click on the X above, nothing happens, because no one is listening; when you click
    on a deployed JButton object, something will happen, because the button you''ve
    created is associated with an object that is functioning as a listener for the
    button. And this is the fundamental idea behind buttons and, similar JButton components:
    each live object is paired with a listening object, and, as we''re about to clarify,
    that listening object will be designed to take an appropriate action when it hears
    from its associated component.


