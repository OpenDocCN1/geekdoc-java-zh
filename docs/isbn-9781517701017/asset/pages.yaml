  md: 'An array is a collection of linked Java variables with a common name. The variables
    are distinguished by subscripts, which are written in Java using bracket notation:
    kid[0], kid[1], kid[2], and so forth.


    # ArrayList


    A Java class in the package java.util represents a list of items using an unbounded
    array-like structure. ArrayList is part of Java''s Collections Framework.


    # array index


    An array index is a non-negative integer that identifies a particular array variable.
    kid[3] identifies the third kid variable. Note: array indexing in Java is always
    zero-based, which means that the initial variable in any array array has index
    0, e.g. kid[0].


    # array length


    The length of a Java array is the number of variables in the array. If kid is
    an array of Infant objects, then kid.length is the number of variable or components
