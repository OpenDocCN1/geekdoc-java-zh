  md: '# Source Code


    ![](img/ef1bdaf694d32c0fef5d3db4e1db57b0_11_0.png)


    # COMPILER


    # Byte Code


    # INTERPRETER


    # Object Code


    Java''s approach isn''t perfect. At first, Java programs were very slow, although
    this problem has been largely overcome. Also, for certain programs, those involving
    complex graphics, the model can still be quirky. Still, the approach has been
    successful to a considerable extent.


    A third important aspect of Java is its general rigor in adhering to the object-oriented
    model of programming. To understand this, it''s important first of all to recognize
    that many concrete or conceptual systems of thinking and modeling are built around
    a common-currency - a base unit that underlies most interactions in the system.
    Economics is an obvious example: a country''s monetary system - literally, its
    currency - underlies all financial transactions. There are other examples. The
    underlying currency of forestry is the tree; the underlying currency of the modern
    shipping industry is the container, and the underlying currency of a computer''s
    operating system is the file. In Java, the underlying currency is the object.


    In just about everything is an object, an organizing framework with three important
    aspects: objects have characteristics or attributes; objects have construction
    schemes called constructors; and objects with a set of actions called methods.
    A object might have these attributes: owner, manufacturer, and model. A constructor
    might make (conceptually, on your computer) a object with attributes: Dana (owner),
    Ford (manufacturer); and Fusion (model). A way method might be called sellCar.


    Where do objects come from? What an object looks like in a body of code called
    a class definition. Then, the class is defined by its specification of the class,
    and this definition serves as a blueprint for Car objects. Class definitions are
    written down in text files with the extension .java, so Car.java You can open
    a class in any text editor and see the text of the class. Class definitions are
    also called source code - class definitions - that is translated into bytecode,
    as indicated in the diagram above.


    Why does this make Java popular? Java''s system allows for the existence of libraries
    of classes (that is, blueprints) for thousands of different kinds of objects.
    Most of these have general applicability, and much of Java''s effectiveness as
    a language is attributable to its strength as an engine for code recycling. In
    other words, if you know your way around Java''s libraries, then large parts of
    a programming job can be handed off to objects framed by blueprints that have
    already been created by experienced programmers, and which are therefore generally
    reliable and easy to use.'
