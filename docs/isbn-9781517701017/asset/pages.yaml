  md: 'Confusion arises because you''re new to programming, you''re tempted to view
    assignment as a kind of equality in which this case is impossible. Remember that
    with assignment, always do the right-hand calculation in its entirety first, and
    then copy or assign the calculated value to the variable named on the left hand
    side.


    A word of caution: this statement


    ```

    myAge + 5 = yourAge + 3;

    ```


    is illegal. The left-hand side of an assignment must be an unadorned identifier,
    possibly with a type specifier. It can never be a complex expression.


    Assignment statements sometimes come in groups, like this:


    ```

    int months;

    months = 3;

    days = 4;

    days = (30 * months) + days;

    ```


    Here months is declared to be an integer, but if you want it to be 0, say in the
    declaration), then months is initialized to the value 3. Next days is declared
    and initialized to 4 in a single statement. And finally days is recomputed according
    to the expression on the right-hand side of the final statement. Since (30)*3+4
    is 94, this is the value days holds when these statements finish executing.


    # Swapping Values


    Suppose m and n are variables that hold numerical values, and suppose you want
    to swap these values. Here is one pair of Java statements that won''t work:


    ```

    m = n;

    n = m;

    ```


    If m holds 5 and n holds 9 before execution, then after execution both hold 9.
    (Make sure you understand why this is so). What''s needed here is a temporary
    variable - a variable in your code whose only job is hold a value temporarily
    while other code executes. We''ll simply call it temp. It will be assigned the
    original value of m before that value is overwritten when m is assigned the value
    n.


    ```

    int temp;

    temp = m;

    m = n;

    temp = n;

    ```


    And does the trick: temp''s value is saved in temp, and then temp is used to put
    m''s original value into n. Important: before you attempt this exercise, with
    pencil and paper draw three boxes, labeled m, n and temp, put the value 3 in the
    m box and 5 in the n box and "execute" the statements in the code fragment above
    by doing the indicated assignments. You''ll need a similar diagram to work the
    next problem.


