    \ about these primitive types here: Java's\n\n# 3.4 The String Class\n\nThe String\
    \ class is not a primitive data type. Strings are objects. Because Strings are\
    \ important, Java endows the class with extensive functionality (that is, it comes\
    \ with a rich set of methods), which makes Strings easy to work with.\n\nWe've\
    \ already seen examples like this:\n s = \"Hilda likes\"; s = s + \"Ivan\"; System.out.println(s);\n\
    \nThe first statement creates a String object s, and initializes it to the String\
    \ value \"Hilda likes\". The right hand side of the second statement appends the\
    \ String \"Ivan\" to s, creating a new String. Then the new value is assigned\
    \ to s. Thus s holds the value \"Hilda likes Ivan\" (we'll say more about the\
    \ sense in which s \"holds\" a value). The third statement prints the current\
    \ value of s, named \"Hilda likes Ivan\".\n\nRecall that the + operator is overloaded:\
    \ when one of its operands is a String, it doesn't addition, but instead pastes\
    \ its operands together to form a new String. Overloading also happens when one\
    \ operand is a String and another is a char. Suppose t is a String variable.\n\
    t = \"donkey\"; t = t + 's'; // String and char combine to form a new\n\nnow assigns\
    \ to: the String \"donkeys\" (remember to calculate the right hand side value\
