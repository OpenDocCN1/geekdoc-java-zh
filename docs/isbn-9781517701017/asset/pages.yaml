    # 4.3 Boolean Expressions


    Earlier we introduced Java''s primitive type boolean. This type, is named after
    the 19th century English mathematician and logic George Boolean, has exactly two
    elements: true and false. Despite its small size this primitive type is critical,
    since true/false judgments are as important in Java as they are in everyday life.


    Creating variables of type boolean is both useful and common:


    +   - boolean fairway = true;

    - boolean okSoFar = false;

    - boolean paidDues;

    - boolean petOwner;


    It''s also possible and common to combine boolean variables into more complex
    expressions using Java''s boolean operators, which represent the logical connections
    of everyday speech, "and", "or", and "not".


    | English Name | Java Symbol | Example |

    |---|---|---|

    | and | && | safe && sound |

    | or | || | paidDues || hasQuit |

    | not | ! | lokSoFar |


    As we develop the main ideas of this chapter we''ll see more examples of these
    operators at work.


    Java also includes standard relational operators. Operators like "<" are, an important
    part of the language. They return boolean values (true or false is: 4*4 < 3*5?).
    The table below lists these operators.


    | English Name | Java Symbol | Example |

    |---|---|---|

    | less than | < | (a < b) |

    | less than or equal | <= | (a <= b) |


