  md: '# 6.2 Wrapper Classes and Graphical Input


    What can you do with an expression like this one?


    String numString = "123",


    As it happens, expressions like this — strings made up of digits — are far from
    uncommon. However, they pose a problem for Java. Strings are objects - Java''s
    main currency - but we often have to handle strings of digits as numbers. Java''s
    answer for this difficulty is to create a kind of shadow class, a wrapper class,
    for ints, and in fact for each Java''s primitive types. Wrapper classes provide
    mechanisms for handling difficulties like the "123" problem above. The most common
    of the wrapper classes are: Integer, the wrapper for int; Double, the wrapper
    for double; and Character, the wrapper for char.


    Let''s focus on Integer. To turn 45 into an integer object you simply use the
    Integer constructor:


    ```

    Integer num = new Integer(45);

    ```


    To convert num back to its int form, you simply do assignment:


    ```

    int k = num;

    ```


    Here Java does the conversion automatically.

    The String numString at the top of the page can be converted to its "natural"
    value this way:


    ```

    int j = Integer.parseInt(numString);

    ```


    That is, the Integer wrapper class includes the static method parseint, which
    takes a String of digits and returns the int it digits represent. If the parseInt
    method is passed a String that includes non-digits, an error is signaled.


    The Double class has an analogous method, parseDouble. This given


    ```

    String myTemperature = "99.1";

    ```


    its double value can be extracted this way:


    ```

    double myFever = Double.parseDouble(myTemperature);

    ```


    The Character class is the wrapper for the char primitive type, and it has particularly
    useful static methods. This assignment:


    ```

    boolean alpha = Character.isLetter(w); assigns alpha value true, since w is a
    letter. On the other hand

    boolean numerical = Character.isDigit(w); assigns numerical value false, since
    w is not one of the digits 0-9.

    ```'
