    # #4.1 Arithmetic in Java


    Simple arithmetic is an important part of all programming languages, including
    Java. Most of the ideas in this section have been a part of computing since the
    1950''s.


    The four basic arithmetic operators: -, *, /, behave almost - but not quite -
    the way they behave in behavioral pencil-and-paper arithmetic. First let''s consider
    these statements:


    ```

    int a = 5; int b = 2; int c = 8;

    int d = a - b;

    int e = a - c;

    int x = a * b;

    ```


    After these statements are executed, d holds 7, e holds 3, and x holds 10.


    However, arithmetic involving division is different. With a = 5 and b = 2, the
    statement


