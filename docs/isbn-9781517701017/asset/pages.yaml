  md: '# # 1.0 Introduction


    This chapter begins with such a discussion of hardware and software, and continues
    with a discussion of the role of high-level languages such as Java in computing.
    Then compilation is discussed, and Java''s unusual two-stage compilation process
    is described. Next, Java''s basic print statements are introduced, along with
    Java''s multi-use + operator. Lastly the concept of a Java program, or application,
    is presented.


    # ## Chapter Outline


    +   * 1.1 Hardware, Software, and Languages

    * 1.2 The Nature of Java

    * 1.3 Starting Java

    * 1.4 First Programs

    * 1.5 Worked Example: String Literals

    * Chapter Summary


    # ## 1.1 Hardware, Software, and Languages


    Knitting is a great model for programming, and more specifically for the notions
    of software and hardware that seem so mysterious to many. The hardware of knitting
    consists of your needs and your yarn. Your software is the pattern you follow
    when you knit. The knitter - are a bit like the central processing unit, or CPU,
    of the knitting "machine" you read a particular "instruction" from the pattern,
    and then you direct the hardware to enter the stitch in the scarf you''re making.


    Of course the knitting machine only knits, whereas computers are universal machines:
    they can knit (if you hook them to needs), or can do weather forecasting, or can
    run on the surfaces of Mars. How they do these jobs, and more particularly how
    you can learn to create directions for doing these jobs, is the subject of this
    book.


    The range of activities possible for a computer is so varied precisely because
    computer hardware is fundamentally simple and uniform. Indeed, it can be deployed
    to do almost anything (by contrast how job-specific knitting needles are - you
    can''t change a flat tire with them, for example).


    The basic elements of a computer include:


    +   * Memory - measured in bytes

    * CPU - where instructions are executed

    * Secondary storage - your hard drive

    * IO (input/output) devices - mouse, keyboard, speakers


    The basic units of memory are bits and bytes. A byte is a group of eight bits.
    A byte is not just a pattern of switches; the pattern can also stand for a (binary)
    number: 10011010 = 154, or a letter 01100001 = A. Several bytes can stand for
    a basic computer operation, e. g.


    ```

    01000110 01101001 11110000 01010101

    ```


    might add two numbers. Such operations, or instructions, make up the fundamental
    primitive core of computing. Put most simply, a computer program is a sequence
    of instructions that operates on data to achieve some outcome.


    A computer''s central processing unit is the hardware element where instructions
    are executed.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'A computer''s memory is volatile - it is erased when the power is off. By contrast,
    secondary storage elements such as your hard drive or cloud storage are permanent,
    making them suitable for storing files that hold your resume, personal letters,
    your Java files.


    I/O devices such as a mouse or keyboard allow you to communicate with your computer
    directly in a straightforward, human-like way.


    Computer memory is laid out in a regular pattern, one after another, and every
    location in memory comes with an address. This address is a number, and the computer
    uses this addressing system to keep track of where information is located. We''ve
    already pointed out that a byte or group of bytes can hold a number, a letter,
    or a code for instruction. A group of bytes can be used to hold the address of
    another location in memory.


    The two byte addition example above is instructive, while it''s designed to do
    simple arithmetic, it''s obscure that it''s difficult to see how to use it directly
    as a mechanism for getting work done. To handle this problem, computer scientists
    have invented languages, and in particular level languages, that instructing a
    computer to perform various actions is friendlier and more like humans.


    In the last half dozens of such languages have been created, and all one with
    defining characteristic: programmers can write (source code) in a more-less-readable
    style. However there''s a price for their readability: such languages must be
    accompanied by a translator, a program that converts the language''s more high-level
    instructions into primitive bit patterns that are compatible with hardware execution.
    This primitive computer language is machine language. Translators come in two
    styles: speaking, a compiler translates into machine language by taking the entire
    program and translating it all at once, much as a human translator might translate
    and then publish a novel in another language. An interpreter, on the other hand,
    does translation by command, in the manner of a simultaneous translator at the
    U.S. As we see, Java uses both translation methods.


    # 1.2 The Nature of Java


    A number of characteristics account for Java''s importance and popularity.


    Java is an important language for programming for the world web. Java programs
    come in two forms applications, which are traditional programs and the primary
    focus of this: applets, special programs that are meant to be run inside a web
    browser. Java''s early success comes from its applet feature.


    A important feature: Java is (largely) portable. Historically many high level
    languages have come in significantly different versions: Macisp and Interisp -
    different of the List language - different that any significant program created
    in one couldn''t run on the other system. Even when a language has come with a
    clear standard, the same program might behave differently on different systems
    because of hardware differences between computers.


    Java has lately successful in avoiding these difficulties by using a hybrid model
    of translation from source to machine code. First, Java''s developers proposed
    a universal intermediate programming language called bytecode. This language is
    a kind of primitive Esperanto that is similar to every machine''s machine language
    Java comes with a compiler that translates every Java program to bytecode. Then
    comes a second phase. For every distinct machine with a distinct architecture,
    there is a final, interpreter-driven translation phase. A different phase has
    been written for every variety of computer. This final phase deals with the differences
    between machines. The diagram below illustrates this two-phased approach to Java
    compilation.'
