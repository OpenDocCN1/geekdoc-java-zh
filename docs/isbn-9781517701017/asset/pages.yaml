  md: "# Chained if-else statements\n\nMultiple selection using a switch statement\
    \ has limitations. In particular switch control variables are restricted to be\
    \ of type int or type char and even then switch cannot easily capture cases that\
    \ cover large intervals.\nConsider for example a statement that classifies a person\
    \ by age information: if you're under the age of 13 you're a kid; 13-19 and you're\
    \ a teen; 20-69 and you're an adult; and 70 and older you're a senior There is\
    \ no obvious way to capture this classification with a switch statement without\
    \ writing about 70 separate cases This is where the chained if-else construction\
    \ comes in. The chained if-else (sometimes called an if-else ladder) elaborates\
    \ cases in a regular way, always choosing the first true branch, and then exiting.\
    \ Here is the age classifier described above as a chained if-else.\n\n```\nif\
    \ (age < 13)\n    System.out.println(\"kid\");\nelse if (age < 20)\n    System.out.println(\"\
    teen\");\nelse if (age < 70)\n    System.out.println(\"adult\");\nelse\n    System.out.println(\"\
    senior\");\n```\n\nHere, if age is 10, kid is printed and the full statement ends\
    \ execution, if age is 50, the first two tests are false but (age < 70) is true,\
    \ so adult is printed and execution ends; and if age is large, say 101, it's the\
    \ final else that functions as a default, and senior is printed. Of course in\
    \ this example the actions taken are all single print statements, but in general\
    \ cases can be arbitrarily complex statement blocks.\n\n![](img/ef1bdaf694d32c0fef5d3db4e1db57b0_110_0.png)\n\
    \n# The do statement\n\nFor completeness we mention Java's third looping construct,\
    \ the do statement. This statement is unusual in that its termination test comes\
    \ at the end of the loop. Here is a simple example:\n\n```\nint k = 0;\ndo {\n\
    \    k = k + 1;\n    System.out.println(k);\n} while (k < 5);\n```\n\nThis loop\
    \ prints 1-2-3-4-5 in a column. The value 5 is printed because the increment from\
    \ 4 to 5 and the statement prints k when k is 5 happens before the (k < 5) test\
    \ is applied.\n\nThe do statement is often useful as a way to force particular\
    \ kinds of inputs. For example, the following loop, involving a Scanner object,\
    \ continues until a user types a non-zero value:\n\n```\nint k = 0;\ndo {\n  \
