  md: '# iJava Glossary


    A


    abstract class

    A Java class that contains abstract elements, such as methods, and so cannot be
    instantiated. A method is abstract if it is marked as abstract, which generally
    means that it has a header line, but no body.


    accessor method

    A method that retrieves the value of an object''s attributes.


    actual parameter

    A value or expression that is associated with a formal parameter in a method call
    or constructor invocation. In a mathematical definition like f(x) = 3x, x is the
    formal parameter, and when you say f(3), you are associating the actual parameter,
    3, with the formal parameter, x, when you go to evaluate the body of the function
    definition.


    algorithms

    A systematic mechanism for doing some job. The word comes from the name of the
    9th century Baghdad mathematician Al-Khwarizmi, who was also responsible for giving
    us the word algebra.


    API

    API stands for Application Programming Interface. The API for a class tells what
    a class does, without disclosing its implementation details. It should be possible
    to use a class just on the basis of its API.


    applets

    A kind of Java program that is suitable for execution on a web page. Classes that
    make up an applet do not contain a main method.


    applications

    A Java application is the standard kind of Java program. An application consists
    of several Java classes, exactly one which contains a main method.


    arithmetic operators

    Java''s special operator symbols, +, -, *, /, % for performing mathematical operations.


    array'
