  md: '# # 13.0 Introduction


    This chapter first discusses how your computer''s mouse can be an active component
    in programs you write. Mouse behavior - clicking and dragging, for example - have
    a special, particular interpretation in Java''s event model Graphical User Interfaces,
    or GUIs, can become quite complex - for simple Java applications. The last section
    in the chapter considers Layout Managers - software frameworks for carving up
    window real estate on you so that GUIs are easier to create and more pleasing
    to look at.


    # ## Chapter Outline


    +   * 13.1 Advanced Graphics Topics

    * 13.2 Graphical Layout Tools and Techniques

    * Chapter Summary


    # ## 13.1 Advanced Graphics Topics


    In the last chapter we introduced Java''s event model. Our main focus was the
    JButton, and we looked at examples that allowed us to control program behavior
    by "pressing" buttons with a computer''s mouse. In this section we''ll consider
    events that are tied directly to mouse activities. In particular we''ll see how
    to design graphical programs that respond directly to mouse clicks and mouse dragging.


    Once we''ll rely on a listener interface model. We''ll begin with a simple example
    that rely on the MouseListener interface, which differs slightly from the ActionListener
    interface used for JButtons. A reminder: we''ll continue to use the structure
    we developed in the last chapter. There we presented a style in which we separated
    the holder window - a specialized JFrame class called BrowserWindow, from a JPanel
    extension that functioned as our principal drawing and writing surface. Here is
    a pictorial summary of the structure we''ll work with:


    ![](img/ef1bdaf694d32c0fef5d3db4e1db57b0_220_0.png)


    In summary, the main method in the driver will make a general purpose BrowserWindow
    and a specific JPanel extension. The panel, which may hold additional components
    such as buttons and labels, will be added to the BrowserWindow. Then the BrowserWindow
    and its embedded components will be displayed. In this chapter we''ll see how
    direct mouse-based interactions can be incorporated into this scheme.


    Here is a simple mouse-based application. It works this way: you click the mouse,
    and the application prints the location of the click, at the location of the click.
    Try it first, below.'
