    # Nested if statements


    "If you''re Canadian, then you''re a man you can expect to be 81; if you''re a
    woman 84". You hear statements all the time, and of course Java needs to be able
    to model them. Here are two versions:


    ```

    if(canadian == true)

    if (man == true) lifespan = 81;

    else lifespan = 84;

    ```


    or


    ```

    if(canadian == true)

    if (man == true) lifespan = 81;

    else lifespan = 84;

    ```


    As it happens, the second version avoids the so dangling else, and so is much
    preferred. In the first version, does the else part go with the first, or the
    else if (that both are plausible making this dangling construction?) If the else
    part goes with the first, the statement would be saying, "if your Canadian, then
    you a man, life span is 81; if you''re not Canadian, your life span is 84" - not
    a completely unreasonable statement. Java has this rule: An else clause goes with
    the nearest if.


    But don''t rely on thinking about it: if an if expression is nested, always wrap
    the embedded if statement in braces - that is, make it a block. There is no possible
    ambiguity.


