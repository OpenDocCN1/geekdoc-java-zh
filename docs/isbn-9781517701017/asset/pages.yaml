    # ## 11.1 Interfaces


    We have already encountered the notion of an *interface* before. The Java API,
    or Application Program Interface, is the collection of interfaces for all of the
    public classes in the Java standard libraries. When you visit the Java API entry
    for the `Scanner` class, for example, and look at its `nextInt()` method, it''s
    important to notice what you see and what you don''t. You certainly see the header
    line for the method: its return type, its parameters and its name, but you do
    not see any information that describes its implementation. That is, you get a
    description of what `nextInt()` does, but not how it does. Thus the interface
    embodied in the Java API reflects the commitment of Java''s implementors to *the
    principle of encapsulation* to the greatest extent possible, keep class implementation
    details private and unavailable.


    The interface is a conceptual construction in Java. In essence, it is a collection
    of useful method headers and constants. All entries in an interface are always
    public. We say that a class *implements* an interface when it provides implementations
    for the disembodied methods of the interface.


    Here is a simple interface example, called *Scoring*:


    The `Scoring` interface, which we must compile to (into a `Scoring.class` file),
    gives a simple characterization of the activity of scoring. In keeping with the
    "no details" principle outlined above, entries in the interface definition consist
    of headers only, ending with a semicolon. It should be clear that you can''t make
    a `Scoring` object.


    When we create a class, we declare that it implements the `Scoring` interface
    by writing


    or


    ```

    public class CookieSeller implements Scoring

    ```


    In each of these cases, the "implements Scoring" addition to the class header
    means that you, as class designer, promise to provide implementations for the
    two methods in the interface. Here, for example, is the `CookieSeller` class:


