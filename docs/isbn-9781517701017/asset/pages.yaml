    The definition of the setter method is little less straightforward. First of all
    its return type is void, which means that it neither prints values to the console,
    nor change the state (that is, the attribute values) of an object. The setter
    body - the statement or statements that follow the method header line - consists
    of a single argument, age +=1. Remember that another makes sense when invoked
    by some constructor object, like myKid. That object has actual values for its
    attributes. Initially, for example, the age for myKid is 4. This means that when
