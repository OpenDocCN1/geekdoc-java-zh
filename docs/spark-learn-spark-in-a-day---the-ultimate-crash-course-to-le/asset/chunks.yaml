    sc


    Explain the output.


    ### Exercise 2


    Try out the example word count application described in this chapter and describe
    its behavior.


    ### Exercise 3


    Study on the implementation of decision tree prediction algorithm implementation
    given in the chapter and try out the example implementation. Write the implementation
    of decision tree classification algorithm in Apach Spark REPL environment.


    # Chapter 9: Spark Vs Hadoop


    ## As mentioned in previous chapters, Spark and Hadoop are two different frameworks,
    which have similarities and differences. Also, both of them have their unique
    pros and cons. So, which one is better; Spark or Handoop? There is no exact answer,
    because, these platforms are different for comparison, and everyone may find some
    new and useful features in both of them. So let’s start from history of developing
    of these two.


    Spark and Hadoop are frameworks and the main purposes are analytics of general
    data and distribution of cluster of computer. Memory computations are provided
    for speed increasing and processing of data. Spark is run on the top of clusters
    of Hadoop and also is accessed to data store of Hadoop (HDFS).


    What about Hadoop? The main aim of Hadoop is running map / reduce jobs so it is
    a paralleled structured data processing framework. So, main purpose of using Hadoop
    is framework, that has a support of multiple models, and Spark is only an alternative
    form of Hadoop MapReduce, but not the replacement of Hadoop.


    ## What to Choose: Spark or Hadoop


    As we said above, both of Spark and Hadoop have advantages and disadvantages,
    but there are some properties, that you should note. The first and main difference
    is capacity of RAM and using of it. Spark uses more Random Access Memory than
    Hadoop, but it “eats” less amount of internet or disc memory, so if you use Hadoop,
    it’s better to find a powerful machine with big internal storage. This small advice
    will help you to make your work process more comfortable and convenient. But also,
    don’t forget, that you may change your decision dynamically; all depends on your
    preferences.


    The next difference between Apache Spark and Hadoop Mapreduce is that all of Hadoop
    data is stored on disc and meanwhile in Spark data is stored in-memory. The third
    one is difference between ways of achieving fault tolerance. Spark uses Resilent
    Distributed Datasets (RDD) that is data storage model which provides you with
    guaranteeing fault tolerance, that’s why it minimizes your network I/O. If you
    want to find more info about Resilient Distributed Datasets, please, re-read previous
    chapters.


    ## What’s Better to Learn First: Hadoop or Spark?


    I think that this question isn’t correct. If you learn one of it perfectly, you
    will not have problems to learn another one. But there are two different views
    on this problem.


    The first says: “It’s better to learn Hadoop, because it’s a fundamental”. Yes,
    sure, learning of Hadoop technologies will give you a lot of fundamental knowledge,
    theory and practice skills. Also you may find something new using it.


    But the second view says “It’s better to learn Spark, because it’s modern”. And
    yes, it’s true, Spark has a lot of interesting features that will be explained
    and listed in next paragraphs. Also, don’t forget, that Spark is only framework
    that runs on top of HDFS.


    If you are developer, maybe, you will not feel the differences between Hadoop
    and Spark. Spark is a framework which includes enabled parallel commutation using
    function calls, Hadoop is a library, where you have a possibility for writing
    map / reduce jobs by Java classes.'
