    \ 中对其进行配置（其中之一是 `yarn.modemanager.local-dirs`）。如果指定了 `spark.local.dir`，YARN 将忽略它。\n\
    * Hadoop 支持归档文件的特殊文件名和 `--files` 选项。你可以指定 `--archives localtest.txt#appSees.txt`，然后它会将已位于名为\
    \ `localhost.txt` 文件中的归档或文件上传到 HDFS，并链接到 `appSees.txt`，因此在后续过程中，你的应用程序在 YARN 上运行时将使用此文件名。\n\
    * 使用由 `--jars` 允许的 `SparkContext.addJar` 非常简单。它可以帮助你在运行 YARN 集群时使用本地文件。但现在在处理\
    \ HTTP、HTTPS 或 FTP 时，没有机会使用它。\n\n## 作业\n\n### 练习 1\n1. 在你的本地机器上安装 Apache Spark。\n\
    2. 安装后，处理至少 5-10 个 Spark 命令和属性，然后记录你的观察结果。\n\n### 练习 2\n1. 创建自己的 Spark 容器。尝试在两种不同的部署模式下完成。\n\
    2. 尝试使用特殊函数如 `SparkContext.addJar()`。\n\n# 第 8 章：带有 Spark Shell 的 REPL\n\n在本章中，我们将讨论\
    \ Apache Spark 的一个有效特性，使其成为调查性和**操作性分析的便利工具。它是 Scala 版本的 Spark Shell 中的读取-评估-打印循环（REPL）环境。我们将通过示例讨论它对不同分析任务的有用之处。\n\
    \n## REPL：读取-评估-打印循环环境\n\n如果你熟悉 LISP 或 Haskell 等任何函数式编程语言，你可能听过上述术语。它是一个编程环境，以表达式的形式接受单个用户的输入（命令），评估命令并打印结果。像\
    \ MS DOS 这样的命令行界面（CLI）以及像 Python、BASH shell 等脚本语言都是此类环境的示例。REPL 一词起源于对 LISP 原生函数的描述。\n\
    \n在 REPL 环境中运行时，代码不需要编译和执行。用户可以输入表达式进行评估，REPL 将在评估表达式的同时显示结果。“Read（读取）”指的是将表达式作为输入，并将其解析为内部数据结构并存储在内存中。“Eval（评估）”指的是遍历数据结构并评估正在被调用的函数。“Print（打印）”指的是将结果显示给用户，在需要时对其进行格式化打印。它在“Loop（循环）”中迭代，返回读取状态并在程序退出时终止循环。\n\
    \nREPL 环境对于表达式的即时评估和调试非常有用。由于不需要为每次修改都进行编辑-编译并运行，REPL 函数运行更快。\n\n## 带有 Apache\
    \ Spark 的 REPL\n\n就数据分析而言，我们执行两类任务：调查性（investigative）和操作性（operational）分析。调查性分析使用\
    \ R 或 Python 等工具，这些工具适用于快速找到答案并交互式地提供系统的快速见解。操作性分析指的是为大型应用设计和实现模型，通常在 Java 或 C++\
    \ 等高级语言中完成。\n\n因此显然，虽然某个工具非常适合即时分析，但在某些环境中可能无法扩展，反之亦然。如果有一个工具能同时支持这两种，那有多好呢？事实上，我们有这样的工具，那就是\
    \ Apache Spark。\n\nApache Spark 不仅支持在 R 或 Python 这样的 REPL 环境中进行调查性分析，还支持操作分析，为大型应用提供分布式且可扩展的解决方案。\n\
    \nApache Spark 引人注目的特性之一是它在 SCALA 中提供了一个交互式 REPL 环境，并允许在 SCALA 中使用 Java 库。你还可以使用此环境交互式地学习\
    \ Spark API。\n\n在第 1 章中，我们上手了 Spark 交互式 shell。让我们看更多示例，以见证 Scala 中 Spark REPL\
    \ 环境在调查性和操作性分析中的用法，及其对调试的支持。所有这些示例都可以在你的机器上使用以下命令启动 Spark Shell 后运行。\n\n```bash\n\
    spark-shell –master local[*]\n```\n\n将 `*` 替换为你机器上的核心数。\n\nshell 中一些实用的命令有：\n\n\
    * `:help:` 用于显示支持的函数的用法\n* `:history` 用于显示之前使用过但你忘记的变量或函数名\n* `:paste` 用于将复制到剪贴板的数据粘贴到\
    \ shell 中\n\n在 Spark 上运行的任何应用程序都由 `SparkContext` 对象启动，该对象处理 Spark 作业的执行。此 `SparkContext`\
    \ 对象在 Spark REPL 环境中简称为 `sc`。\n\n### 示例应用程序\n\n以下是我们在 Spark Shell 中运行词频计数程序：\n\
    \n![](img/00012.jpeg)\n\n```scala\nval inputFile = sc.textFile(\"spark_examples/words.md\
    \ \")\nval wordcount = inputFile.flatMap(line => line.split(\" \"))\n```\n\n 接下来，我们将看到某些机器学习算法的实现：\n\
    \n### K-means 算法\n\n![](img/00013.jpeg)\n\n```scala\n// 读取数据\nval dataFile = sc.textFile(\"\
    spark_examples/words.md \")\nval data = dataFile.map(line => line.split(\" \"\
    ))\n\n// k = 4 的聚类\nval numberOfClusters = 4\nval count = 20\nval clusters = KMeans.train(data,\
    \ numberOfClusters)\n```\n\n![](img/00014.jpeg)\n\n```scala\nval WISetSquaredError\
    \ = clusters.computeCost(data)\nprintln(\"Within Set of Squared Errors for 4 =\
    \ \" + WISetSquaredError)\n```\n\n### 线性回归算法\n\n线性回归算法的实现如下：\n\n![](img/00015.jpeg)\n\
    \n```scala\n// 从文件读取数据\nval dataFile = sc.textFile(\"spark_example/linear_regression_data_sample\"\
    )\nval data = dataFile.map(lineRead => lineRead.split(','\n```\n\n![](img/00016.jpeg)\n\
    \n```scala\n// 模型构建\nval count = 40\nval model = LinearRegressionWithSGD.train(data,\
    \ count)\n\n// 使用测试数据 - 可以评估模型以找出误差\nval predictedVals = data.map { modelElement\
    \ =>\n  val predictedValue = model.predict(modelElement.features)\n  (modelElement.label,\
    \ predictedValue)\n}\n\nval MeanSquareError = predictedVals.map{ case(w, pow)\
    \ => math.pow((w - pow), 2)}.reduce(_ + _)/predictedVals.count\n```\n\n"
