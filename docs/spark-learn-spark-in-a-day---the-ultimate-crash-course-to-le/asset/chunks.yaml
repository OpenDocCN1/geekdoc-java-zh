    对于既不了解 Scala 也不 Python 的初学者来说，学习 Python 比学习 Scala 更容易。虽然 Scala 也非常友好且易上手，但学习 Python
    仍然比学习 Scala 更容易。当你想要使用高级面向对象概念时，Scala 的困难之处就显而易见。如果你已经有了 Java 知识，学习 Python 也会非常容易。Python
    还拥有一个非常大的社区，你可以随时从中寻求帮助。这意味着 Python 还拥有更多资源，包括书籍和视频，你可以轻松获取并学习。然而，Scala 本身仍然是一门发展中的语言，Scala
    社区也仍在发展中。Scala 还有一些语法糖，在学习和使用时都必须小心。因此，从学习曲线来看，Python 具有优势。


    ### 易用性

    Spark 是使用 Scala 构建的。这使得与包括 Python 在其他语言相比，你在 Spark 中使用 Scala 更加容易。你对 Scala 的了解将让你拥有优势，能够确切知道
    Spark 的工作原理以及其背后的机制。如果你没有 Spark 的知识，可能你想要实现的一些任务在 Spark 中是永远无法完成的。一个很好的例子是你需要一种新类型的弹性分布式数据集（`RDD`）。就像许多开源文档一样，Spark
    的文档并不完美。因此，Spark 的真实文档是它的代码。你能够理解这些代码的唯一方法就是对编写它的编程语言（Scala）有良好的了解。因此，学习 Scala
    将让你能够完全理解 Spark 并在 Spark 中实现任何功能。然而，如果没有 Scala，你运行某些代码时，将无法理解代码在运行时后台到底发生了什么。因此，从易用性来说，Scala
    具有优势。


    ### 库

    Python 在自然语言处理（NL）和机器学习（ML）方面的库数量更多多 且质量也优于 Spark，尽管这些库并不是专门面向大数据的库。Spark 的 ML
    库算法虽然较少，但实际上是为大数据而编程的。然而，Scala 并没有像 Python 那样拥有大量的数据科学工具和库。Scala 既没有良好的本地数据，也没有良好的可视化。此外，Scala
    还缺乏高质量的本地工具。这使得许多 Spark 用户更倾向于使用 R 的 Python 核心部分。这让他们能够直接从 Python 调用 R。这部分在 Scala
    中确实非常匮乏。Scala 的库很少，在数量和质量上远落后于 Python，尤其是与 Python 相比时。庞大的 Python 社区是许多库的主要贡献者，并且更多库仍在开发中。因此，使用
    Python 将让你可以使用许多可以加速你工作的库。例如：Databricks 的专有服务是基于 Python 而不是 Scala。因此，在库方面，Python
    具有优势。


    ### 总结

    在性能和易用性方面，Python 在学习易用性和库方面具有优势。然而正如前面提到的，随着机器数量的增加，性能差异（特别是速度方面）可以被消除。但 Spark
    本身是用 Scala 编写的。这意味着如果你对 Scala 有良好的了解，你就可以重新编写 Spark。因此，学习 Scala 让你拥有关于 Scala 全面知识的优势。


    最后，如果你对 Spark 中 Python 或 Scala 的需求是进行不复杂的分析，那么你可以轻松选择 Python 并且是没问题的。但如果你想在 Spark
    上创建生产系统，那么你就必须学习 Scala。如果你想最充分利用 Spark 并在其上实现非常复杂的程序，你需要对 Scala 和 Python 都有全面的了解。


    ### 作业

    #### 练习 1

    与 Scala 相比，Python 为什么易用且易学？请给出详细答案。


    # 第 5 章：为什么开发者喜欢使用 Apache Spark？


    ## 自开发以来，Spark 一直被腾讯、百度、雅虎等知名机构视为首选。这些大型组织采用 Apache Spark 是因为它具有几个卓越的优势。Spark
    能够处理交互式算法和交互式查询。交互式算法和查询是它的主要关注，因为批处理框架无法提供足够的支持。这就是为什么 Spark 从开发那一刻起就受到了认可。它的人气迅速上升，因为它简单、快速、统一且具有广泛的兼容性。Spark
    现在处于其人气的巅峰，物有所值。


    本章将讨论 Spark 的一些特殊特性。这些正是让使用 Spark 进行开发变得愉悦的品质。


    ## 语言灵活性

    语言灵活性是 Apache Spark 最受欢迎的组件之一。这一特性提升了 Spark 在众多开发者中的人气。Spark 为许多开发语言提供卓越的支持，其中
    Python、Java 和 Scala 备受推崇。语言灵活性极地提升了开发体验。


    这些语言彼此之间不同，但它们维持了一个关键事实：所有语言都使用 lambda 函数和闭包（closures）来表示操作。为了在核心逻辑中对函数进行分类，开发者使用了闭包。这同时也保护了应用并提供了良好的代码。下面演示了在
    Apache Spark 中 `java`、`python` 和 `scala` 的闭包：


    ### Apache Spark 中的 Java 闭包

    ![](img/00002.jpeg)


    ### Apache Spark 中的 Python 闭包

    ![](img/00003.jpeg)


    ### Apache Spark 中的 Scala 闭包

    ![](img/00004.jpeg)


    Spark 尽一切让这些语言能够在 Spark 引擎上运行。随着时间的推移，它取得了成功。现在，允许在 Spark 引擎上运行这些语言。它减轻了开发者的负担，也提供了整洁的外观。这种体验非常流畅，开发者热爱使用
    Spark。


    ## 匹配用户目标的 API

    Spark 远不止于此。你可以说它是最核心且著名的功能的组合。假设你在使用 MapReduce。由于没有内置功能，你必须考虑自定义的 Mapper/Reducer
    任务。这就是高级 API 发挥用场的地方。你的 MapReduce 任务需要这些 API。如果你在 Apache Spark 中工作，你就很幸运了。Spark
    为这种情况提供了解决方案。


    尽管这些似乎已经足够了，但并不是终点。Spark 真正非常丰富，在 Apache Spark 中发现了八十多个运算符。如果你使用这些运算符，就可以轻松地维护
    MapReduce 类型的操作。另一方面，Spark 还提供了对 Apache Pig 等框架的访问。这些框架也允许一些顶级的运算符。如果你使用 `functions`（函数）、`classes`（类）和
    `control statements`（控制语句），这种组合可以为精英开发提供极佳的氛围。这意味着你在 Spark 中拥有完成任务所需的一切，但如果你仍然需要某些东西，只需通过访问其他框架来品尝一下。简而言之，如果你与
    Apache Spark 协作，你就不再需要担心。你已经拥有了所需的一切。


    ## 复杂流的自动并行化


    '
- fmt: '

    Parallelizing the correct sequence of complex pipeline of MapReduce task solely
    depends on you. You will require a scheduler tool if you decide to construct sequences
    carefully. In `Apache Spark`, you will find a series of tasks that express a single
    program flow. This program is ideally evaluated to offer the system a complete
    view of the execution graph. This becomes simple for the system and allows the
    scheduler to map the dependencies over different stages of the application. This
    also parallelize the operators flow automatically and without user interference.
    You can also enable certain optimizations to the system and this will reduce the
    burden too.


    ## Example


    ![](images/00005.jpeg)


    Though this is a simple application, it is a six stages complex flow and the actual
    flow is hidden. `Apache Spark` is capable of understanding this flow and constructs
    the graph correctly using the correct parallelization. But if you were using other
    system, you had to do this complex task manually. If you are trying to complete
    this manually this will kill huge time and there is also chances of mistakes.
    This is one of the reasons that attracts developer towards `Apache Spark`. Sparks
    has figured out everything and offering the best possible services.


    ## Interactive Shell


    Spark has specialized shell for `Python` and `Scala`. This shell is simple and
    allows developer to access datasets. This allows developers to access and manipulate
    datasets easily and without writing an end-to-end application. In short, you are
    allowed to taste program even before it is written. All you need is open the shell
    and write a few codes. You are good to go. This is one of the tremendous functions
    of `Apache Spark`.


    ## Performance


    `Apache Spark` is dedicated to efficiency and programmability. It has every quality
    that can attract a developer. But mostly, developers are attracted by `Apache
    Spark` because of its superior performance. Actually `Apache Spark` is admired
    all over the world just for its performance.


    During the development of any application, it is required to run that application
    several times. Developers require working on full or partial data sets. They need
    to flow the develop-test-debug cycle too. If you have vast data sets, these mandatory
    routine tasks can be tedious and they take hours to execute. But this experience
    has become enjoyable with `Apache Spark`. Spark''s performance is superior and
    thus it’s allows developer to complete their routine cycle in a few moments.


    In short you are getting the exact output with less time and effort. This is why
    developers love spark as they can now work faster than ever. There are some facts
    with Spark that elevate its performances and they are as follows:


    ### Speed


    Spark possess advanced `DAG` execution system. It allows in memory computing and
    cyclic data flow. All these allow Spark to run programs tremendously fast. To
    be exact, speed is not a problem anymore. Programming is much faster and easier
    with Spark.


    ### Ease of Use


    Spark has more than eighty operators. These operators are among the best and they
    can serve a developer efficiently. Using these operators you can conduct complex
    task easily and quickly. This allows to write application in `Java`, `Python`
    and `Scala` more efficiently. In short, Spark lessen the burden of developer in
    an advanced way.


    ### Compatibility


    Spark runs everywhere. You can run it on `Standalone`, `Mesos`, `Cloud` or even
    on `Hadoop`. Its compatibility is admirable and it has opened a new era for developers.


    ### Generality


    Spark powers `MLlib`, `SQL` and `Data Frames` for `Spark Streaming` and `GraphX`.
    It also powers several other libraries too. These libraries can be combined too
    in a single application.


    ## Summary


    Spark is one of the best engine in the development arena. It is complex itself
    but offers simplicity to the developers and users. It can handle everything but
    it handles them efficiently and swiftly. Spark''s compatibility is beyond imagination
    and it is assisting the developers in numerous ways. Functionality like `API`,
    `Shell`, `Parallelization` and `Language Flexibility` has made Spark a top notch
    system. Spark was invented due to the incapability of systems of that time. It
    was a necessity. Spark''s invention has uplifted the development experience excellently.
