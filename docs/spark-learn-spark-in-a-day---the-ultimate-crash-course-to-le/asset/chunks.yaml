  trans: "\n在上方，我们看到了对 `DStreams` 的输入操作。类似地，`DStreams` 的输出操作可用于将生成的结果转发到数据存储中，例如文件系统或数据库。`DStreams`\
    \ 上所有转换的实际执行将通过输出操作的调用来启动，因为这是从外部源读取结果的时候。输出操作的详细信息如下：\n\n对于每个 `RDD`（函数）：此操作在每个\
    \ `RDD` 上执行给定的函数，并将结果数据转发到外部存储。例如，传递的函数可以是通过网络写入数据库，也可以保存到文件等。\n\n`Print()`：可用于调试和开发目的，在主应用程序上显示\
    \ `DStream` 中每组数据的前十个项目。\n\n![](img/00045.jpeg)\n\n被调用的 `DStream` 的内容将保存到文本文件中。在每个时间间隔生成的文本文件，其名称将以“前缀-毫秒级时间\
    \ [后缀]”的形式存在。\n\n## 示例应用程序 – 实时 Twitter 数据\n\n有了这些工具，让我们来构建一个应用程序，从 Twitter 数据流中收集数据吧：\n\
    \n此示例应用程序演示了我们如何从 Twitter 数据流中读取数据，并处理并将收集到的推文写入文件。收集到的推文将以 JSON（JavaScript 对象表示）格式写入。\n\
    \n以下是 Scala 的实现：\n\n```scala\npackage com.spark.examples.twitterdata\n\n![](img/00046.jpeg)\n\
    \n/**\n* 收集指定数量的推文并写入文本文件。\n* The twee\n*/\nobject TweetCollector {\n\n  private\
    \ var numofPartitions = 0\n  private var collectedTweetsCount = 0L\n  private\
    \ var gson = new Gson()\n\n  def main(args: Array[String]) {\n    // 从应用程序参数读取并相应赋值\n\
    \    if (args.length < 3) {\n      System.err.println(\"Arguments to \" + this.getClass.getSimpleName\
    \ +\n        \"should be in the form of <resultsDirectory><numOfTweetsToRead><timeIntervalInSecs><outPutFileCountInEachInterval>\"\
    )\n      System.exit(1)\n    }\n\n    val Array(resultsDirectory, Utils.IntParam(numOfTweetsToRead),\n\
    \      Utils.IntParam(timeIntervalInSecs), Utils.IntParam(outPutFileCountInEachInterval))\
    \ =\n      Utils.parseCommandLineWithTwitterCredentials(args)\n\n    val outputDirectory\
    \ = new File(resultsDirectory.toString)\n    if (outputDirectory.exists()) {\n\
    \      System.err.println(\"ERROR - %s Directory exists already,Provide another\
    \ directory or delete the existing\".format(\n        resultsDirectory))\n   \
    \   System.exit(1)\n    }\n\n    outputDirectory.mkdirs()\n    val configuration\
    \ = new SparkConf().setAppName(this.getClass.getSimpleName)\n    val streamingContextObject\
    \ = new StreamingContext(configuration, Seconds(timeIntervalInSecs))\n    val\
    \ tweetsDataStream = TwitterUtils.createStream(streamingContextObject, Utils.getAuth)\n\
    \      .map(gson.toJson(_))\n\n    tweetsDataStream.foreachRDD((rddElement, time)\
    \ => {\n        val inputsCount = rddElement.inputsCount()\n        if (inputsCount\
    \ > 0) {\n        val resutlRDD = rddElement.repartition(outPutFileCountInEachInterval)\n\
    \        resutlRDD.saveAsTextFile(resultsDirectory + \"/tweetsRead_\" + time.milliseconds.toString)\n\
    \        collectedTweetsCount += inputsCount\n        if (collectedTweetsCount\
    \ > numOfTweetsToRead) {\n            System.exit(0)\n        }\n        }\n \
    \   })\n    streamingContextObject.start()\n    streamingContextObject.awaitTermination()\n\
    \  }\n}\n```\n\n## 总结\n\n因此，你已经学习了 Spark Streaming 用于读取和处理大规模流式数据以及各种形式的结果存储方法。Spark\
    \ Streaming 还支持图处理并在这些数据流上进行机器学习。你还学习了各种依赖关系以及如何将它们与 Spark 链接起来。\n\n现在你也知道使用 `StreamingContext`\
    \ 可以帮助初始化 Spark Streaming 应用程序以及我们可以推入结果结果各种数据存储。Spark Streaming 应用程序涉及的核心组件包括：\n\
    \n* `DStreams`\n* 转换 (Transformations)\n* 输出操作 (Output Operations)\n\n一个演示使用 Spark\
    \ Streaming 进行 Twitter 数据分析的示例应用程序。\n\n## 作业\n\n### 练习 1\n\n1. 识别 Spark Streaming\
    \ 用于读取和处理大规模流式数据以及各种形式的结果存储方法。\n\n### 练习 2\n\n1. 识别 Spark Streaming 用于读取和处理大规模流式数据以及各种形式的结果存储方法。\n\
    2. 识别 Spark Streaming 用于读取和处理大规模流式数据以及各种形式的结果存储方法。\n3. 识别 Spark Streaming 用于读取和处理大规模流式数据以及各种形式的结果存储方法。\n\
    \n# 第 14 章：让我们借助 Spark 构建 Lambda 架构\n\n## 在设计设计出一个概念并实现它后，你可能会会有一些观察结果。你可能也喜欢即使在数据到达和算法改变时，数据也可以被自动处理的特性。延迟一小时的主要原因是过滤掉不干净的数据，从而提高系统的效率。然而，在某些情况下，你可能希望在数据到达的瞬间就获得它们（无论干净与否），以便能够尽快做出响应。因此，你可能想要包含一个实时组件，这样会更容易。\n\
    \n延迟问题是一种被称为 Lambda 架构（lambda architecture）的特性。该特性将实时和批处理组合在一起。你需要这两个组件是因为实时数据的到达总是包含根本问题。你无法保证单个事件会一次性接收。此外，数据可能会重复，这会对数据造成某种干扰。由于服务器不稳定或网络问题，也可能导致数据延迟到达的问题。专家们提出了一种解决方案，让你能够立即获得快速但可能不可靠的数据，而缓慢且可靠的数据稍后到达。\n\
    \n## 为什么你应该使用 Spark？\n\n使用 Lambda 架构方法会带来成本。相同的业务逻辑必须在两个不同的系统中实现和维护。使用 Apache\
    \ Storm 实现实时系统，使用 Apache Pig 或 Apache Hive 实现批处理系统，将导致在 Java 和 SQL 中重写相关的聚合逻辑。这种情况很快就会导致维护维护噩梦。\n\
    \n但如果你想使用 Lambda 架构，建议使用 Spark。这是因为如果系统是用 Storm 开发的，你将不得不用 Storm 重新实现整个逻辑聚合。\n\
    \nSpark 以可用于机器学习的结构而闻名。但它也完全胜任 ETL 任务。Spark 的 API 易于使用且整洁。你可以轻松阅读它们，而且与 MapReduce\
    \ 相比，它们的样板代码更少。你还可以使用 REPL 接口快速进行逻辑原型设计。与 MapReduce 相比，这使得执行速度更快。\n"
- fmt: '

    Spark Streaming, however, happens to be the best advantage of Spark. Spark streaming
    would allow you to use aggregates which are same with the ones you used as a data
    stream in real-time for your batch application as well. You would thus not need
    to do a business logic re-implementation or maintain and test a base for second
    code. It is thus much easier and faster to achieve a component that is real-time
    on your system. This would not only be appreciated by the management of the developers
    and the developers but also by the users.


    ## Do it Yourself


    This is a simple and quick example you can follow to implement the Lambda Architecture.
    To make it easier the grasp, the only included steps are the required ones.


    1. You first of all, write a function for business logic implementation. For this
    instance, we want the quantity of errors for a day to be counted and collected
    in an events log. The event logs would be composed of the time and date as well
    as the level of the log, the process of the logging and the message itself:


    ![](images/00047.jpeg)


    To be able to get the number of errors recorded in a day, you will have to filter
    the log level before counting the amount of messages you got for the day:


    ![](images/00048.jpeg)


    From the function, you notice that the lines that had “ERROR” were filtered, then
    use the function, map to place the line’s first word (which is the date) to be
    the key. You then use the reduced by key function to get the quantity of errors
    which you got for the day.


    You would thus, observe that the `RDD` is transformed by the function into another.
    The main data framework of Spark are `RDDs` which are partitioned essentially,
    the collections are replicated. You would not be able to see the complex distributed
    collection handling as Spark is able to hide it. Just like any of the remaining
    collection, you can easily work with them.


    2. Data can be read to an `RDD` from the HDFS using a function during the process
    of the Spark ETL. Furthermore they can also be used to count the number of errors
    and the results saved to the HDFS:


    ![](images/00049.jpeg)


    In this instance, a code was executed within a Cluster in Spark by initializing
    a `SparkContext`. (You should note that the initialization will not be required
    if you are using REPL in Spark, as `SparkContext` initialization is automatic
    in this case. Once the initialization of the `SparkContext` has been achieved,
    there is the need for lines to be read into an `RDD` from the file before the
    function for the error count is executed and the result is saved into the file.


    The Uniform Resource Locators in the `errCount.saveAsTextFile` and `spark.textFile`
    can be kept in the HDFS through the use of `hdfs://….`.Another alternative is
    Amazon S3 or local filesystem files amongst others.


    3. In the event that you don’t have the luxury of a whole day before you would
    need the number of errors as you would prefer to document the results on a per
    minute basis. It would not be necessary for you to do an aggregation re-implementation.
    All you will need to do is to just use the code for streaming again.


    ![](images/00050.jpeg)


    You would have to do a context initialization once more. In this case, an event
    stream (which would be gotten from socket in a network; Apache Kafka, which is
    a service that is reliable will also be used by production architecture) would
    be taken from `StreamingContext` and converted into an `RDD` stream.


    One of the stream’s micro-batching will be represented by each `RDD`. The time
    frame is configurable for each of the micro-batch (which are batches in 60-second
    in this instance) which can be used as a balance among the larger batches known
    as throughout and the smaller batches known as latency.


    On the `DStream`, you will perform a map job run, using the function, `countErrors`,
    to convert each of the `RDD` of the lines to `RDD` in the form `(date, errorCount)`
    from the stream.


    For each of the `RDD`, we would display the number of error for the particular
    batch, and then you can perform a stream update with the counts of the totals
    that are running using the same `RDD`. The running totals would be printed by
    this stream.


    For ease of use, you could display the output on the screen, while you further
    save it in the HDFS, Kafka, or Apache HBase where it can be used by real-time
    users and applications.


    ## Summary


    Lambda Architecture allows you to create a component that is real-time on your
    system which will allow immediate display of collected data on the dashboard.
    It is possible to re-implement the function for business logic on the process
    for the batch ETL. This gives you the ability to quickly create a component that
    is real-time for a batch-processing system. You will have the advantage of getting
    data immediately they are collected and responding to them appropriately while
    a more reliable data would be sent in batches. You would thus be able to build
    a system that would impress both your users and the management.


