    ## Lambda Architecture and Resolving of Big Data Errors

    Lambda Architecture was built to basically accept that hardware was going to fail,
    and in order to accept that, it had to solve it via software. When we look at
    a platform, we’ve got a platform that can scale; we have built fault tolerance
    into the platform via the software. But what happens when you get to the development
    of the software you want to run on this platform. There is a probability that
    an update in a database could lead to part of the database been deleted mistakenly.
    Lambda architecture was developed to fix this type of problem by having human
    fault tolerance. So as the system grows more complex, you will need to have an
    understanding that mistakes are going to be made, it’s inevitable, so you have
    to deal with it. You have to put in place measures that would make you not to
    go through too much stress in the event that you mistakenly delete something important
    or when an error occurs.


    This is where fault tolerance comes in. As earlier discussed, even big companies
    sometimes have some errors that are disastrous and have to be solved as soon as
    possible. Now, the Lambda architecture concept isn’t brand new, but it was just
    recently documented. So the concept as a whole has being around, but Nathan Marz
    came along and wrote that very succinctly. He clarified it, he gave it a name
    and he gave something that pretty much anybody should be able to easily understand
    and implement. He created storm which is really substantial in fault tolerance.
    His experience at that time and when he became part of twitter really gave way
    to understanding and absorbing that we have to protect against hardware failures
    and human errors. So when you’ve pushed bad configuration file out of configuration,
    how do you recover. What you will need in enterprise application platforms and
    support operations is to make sure you have support for both that and low frequency.
    You could build Lambda architecture of low latency, OLAP or OLTP. You would have
    to build a relational database, put index in certain places that will support
    the way certain types of queries are created.


    You will have data going into your Lambda architecture as well as your batch layer.
    You would also have to add updates to your database. Furthermore, you would also
    have to decide how long you want to keep data, perhaps for 7 years. You would
    then have to build a reliable mater distributed data set in your batch layer.
    You also have to build it in a way that would support low latency for usage of
    data as well as a history of click events. You could also have data streaming
    for your database. The major factor of the Lambda architecture is that whenever
    you have a bug, you could go into your batch side and fix your bug. You can also
    recreate all the crapped records that were affected. It gives you a way as an
    enterprise to recover from failure, recover from bugs, and it protects you from
    all of the headaches that may come on your way.


    For example, if you have a flight data, you would have your immutable data set
    which have stored in your batch layer. Over time, you are going to add different
    events that have occurred, take-offs, landings, etc. Your data will grow as the
    days go by and you are going to be prepared for this. You can understand what
    all of this different scaling practices are. But you are going to have the ability
    to come in here and start asking questions in building queries that you care about.
    So, how many planes are airborne right now, how many are airborne per airline,
    how many planes are currently sitting at the tarmac of every single airport, these
    are simple questions, The important thing here however, is that simple questions
    fall into either category, you can have a batch, you can have a streaming.


