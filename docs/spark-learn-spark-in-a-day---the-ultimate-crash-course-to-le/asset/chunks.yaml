    有很多不同的技术可以应用到这个技术栈中，并且它们可以遵循不同的路径。其中的某些组件可以分层满足需求。然而，对你来说，了解有哪些技术是一个很好的点。因此，你需要一种存储历史数据、生成查询、查看数据并支持流处理的方法。你还需要一个可靠的批处理流，以便你修复错误和
    Bug。为了实现这一点，你可以使用如 `Kafka`、`Storm` 和 `HBase` 等平台。你可能会认为有很多需要学习和使用的技术。然而，这只是在向你展示如何防止你自己陷入失误。所以，如果你接受了这一点，你现在可以说你可以把
    `Spark` 引入这里。但你也有理由不想在某些地方使用 `Spark`，或者在其他情况下你恰恰只想使用 `spark` 而不使用其他技术。你可能有一堆 2
    到 3 年前写的遗留代码，它们在你的数据中心运行，而你又不想花精力去替换它们。这就是 `Spark` 的优势之一。所以，当你从整合的角度来看这些技术时，会有一种软趋势：Twitter
    发布了一些东西，有一个名为 `lamp dupe` 的项目，它不仅交付了 lambda 架构，而且正在朝着目标努力。它还修补了 `spark`。修补后的 `spark`
    从根本上交付了满足 lambda 架构的所有部分。因此，希望这里的大多数人收获的应该是：你可以通过 `spark` 简单实现 lambda 架构。


    ### Spark 会成为你 Lambda 实现的每一个方面吗？


    可能会，也可能不会！它并没有规定这一点，它恰恰拥有了你扩展用例所需的所有组件。你可以生成 `spark sequel` 的视图，并使用 `spark streaming`
    扩展速度层，因为你拥有了 `spark` 执行引擎。现在从 `MapR` 的角度来看，你实际上可以有一个思科的客户，他们使用 `Spark` 有效实现了 lambda
    架构。因此，你可以用它进行安全分析和其他安全相关的内容。再次，这种技术栈（这种架构）的好处是可以为你节省恐慌。


    ## 总结


    数据库系统很容易出错，尤其是当它们变得很大时。这些错误的处理成本很高，而且在大多数情况下，它们发生时只持续几分钟。如果没有对错误以及如何修复它们做好准备，这些错误可能会变得糟糕。通过
    Lambda 架构，修复错误变得简单且快速。Lambda 架构允许你快速恢复到系统的上一个稳定版本并从那里继续。


    Lambda 架构可以通过 `Spark` 实现。


