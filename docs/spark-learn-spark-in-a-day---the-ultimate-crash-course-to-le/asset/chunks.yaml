    actually led to the error was that a system which automatically verifies configurations
    caused more problems than it solved. In lay man terms, what actually happens is
    that the automatic system checks for an invalid configuration value. In the event
    that it finds any, it automatically replaces it with a valid configuration value
    from the persistent store. For as long as the persistent store is valid however,
    the system would always function perfectly. However, in the event that the persistent
    store is invalid, the system would not be able to get a valid value to replace
    the invalid configuration value. This was what led to the error that made facebook
    to go offline. To overcome the problem, they had to restart the entire Facebook
    site, which implies that they had to go back to the last reliable batch of data.


    ### Twitter

    Twitter suffered a similar fate on the 21st of June, 2012. On this particular
    day, Twitter crashed and the site could not display anything to the users at all.
    The problem that led to the task was termed as a cascaded bug. What actually happened
    was that a set of characters developed fault and sort of like a wave effect, the
    faulty characters started to affect other characters which also developed faults.
    That was why it was called a cascading bug, meaning one failure affecting a functional
    part making it faulty. This new set of faulty characters also affected another
