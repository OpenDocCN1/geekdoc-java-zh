    ## Deep Dive in to Spark SQL Catalyst Optimizer


    Spark SQL is one of the latest and most precisely involved mechanisms of Spark.
    It powers both SQL query and the novel DataFrame API. At the center of Spark SQL
    is the Catalyst optimizer, which leverages superior programming language feature
    in a novel method to build an extensible inquiry optimizer.


    Unlike the keenly evaluated data frames in R as well as Python, Data Frames in
    Spark have their implementation mechanically optimized by an inquiry optimizer.
    Previous to any calculation on a DataFrame start, the Catalyst optimizer compiles
    the operations that were used to construct the DataFrame in to a physical plan
    for implementation. Because the optimizers understand the semantics of operation
    and constitution of the data, it could make intelligent decision to speed up calculation.


    At a high height, there are two kinds of optimizations. First, Catalyst applies
    logical optimization for example predicate push down. The optimizer could push
    filter predicates down into the data source that enables the physical implementation
    to skip immaterial data. In the case of Parquet files, whole blocks could be skipped
    and comparison on strings could be turned into cheaper integer comparison via
    dictionary encoding. In the case of relational database, predicates are pressed
    down into the outside databases to decrease the quantity of data traffic.


    Second, Catalyst compiles operation into physical tactics for execution as well
    as generates JVM bytecodes for those tactics that is frequently more optimized
    than hand-written code. For instance, it can decide intelligently among broadcast
    joins as well as shuffle joins to decrease network traffic. It might also perform
    low level optimization such as elimination of expensive object allocation and
    dropping virtual function call. As a consequence, we anticipate performance improvement
    for presented Spark programs while they transfer to Data Frames.


