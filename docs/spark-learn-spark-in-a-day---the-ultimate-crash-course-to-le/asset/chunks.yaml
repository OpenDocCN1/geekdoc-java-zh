    # Chapter 8: REPL with Apache Spark Shell


    ## In this chapter, we will discuss about one effective feature of Apache Spark,
    which makes it a convenient tool for both investigative and operational analytics.
    It is the Read Evaluate Print Loop – REPL environment of Spark Shell, in Scala.
    We will discuss how it is useful for different analysis tasks with examples.


    ## REPL: Read Eval Print Loop environment


    If you are familiar with any functional programing language like LISP or Haskell,
    you could have heard above term.  It is a programming environment, which accepts
    inputs (commands) from a single user in the form of an expression, evaluates the
    command and prints the result. Command Line Interfaces (CLIs) like MS DOS and
    scripting languages like Python, BASH shell, etc. are examples of such environments.
    The term REPL, was originated to refer to the behavior of LISP primitive functions.


    To be run in REPL, environment, and the code need not be compiled and executed.
    User can enter expressions to be evaluated and REPL will display the result after
    evaluating the expression, as it goes. The ‘Read’ refers to reading the expression
    as an input and parsing it to an internal data structure and storing it in memory.
    ‘Eval’ refers to traversing the data structure and evaluating the functions being
    called. ‘Print’ refers to displaying the results to the user, pretty printing
    them if needed. It iterates in a ‘Loop’, going back to read state and terminates
    the loop upon program exit.


    REPL environment is quite useful for instant evaluation of expressions and for
    debugging. Since it does not have to be edited-compiled and run for each modification,
    REPL functions are faster.


    ## REPL with Apache Spark


    As far as data analysis is considered, we perform two types of tasks as investigative
    and operational. Investigative analysis is done using tools like R or Python,
    which are suitable for finding answers fast and interactively providing quick
    insights on the system. Operational analysis refers to the design and implementation
    of models for large-scale application and are mostly done in high level language
    like Java or C++.


    So it is apparent that while one tool is quite suitable for an ad-hoc analysis,
    it may not be feasible to scale in certain environments and vice versa. How good
    it could be if there is one utility supporting both of them? In fact we do and
    that is Apache Spark.


    Not only Apache Spark supports investigative analysis in a REPL environment like
    R or Python, but also enables operational analysis, supporting distributed and
    scalable solutions for large-scale applications.


    One of the eye catching feature of Apache Spark is that it provides an interactive
    REPL environment in SCALA and also enables to use Java libraries within SCALA.
    You can also use this environment to learn the Spark API interactively.


    In Chapter 1, we got hands on in with Spark interactive shell.  Let us see some
    more examples to witness the use of Spark REPL environment in Scala, both in investigative
    and operational analysis and its support for debugging. All these examples can
    be run, after launching the Spark shell with below command in your machine.


    spark-shell –master local[*]


    Replace * with the number of cores in your machine.


    Some of the useful commands in the shell are:


    :help: For displaying usage of supported functions


    :history : For displaying names of variables or functions previously used, but
    you forgot.


    :paste : Paste data to the shell, copied to clip board


    Any application being run on Spark is initiated by SparkContext object, which
    handles the Spark job execution. This SparkContext object is referred by sc in
    the Spark REPL environment.


