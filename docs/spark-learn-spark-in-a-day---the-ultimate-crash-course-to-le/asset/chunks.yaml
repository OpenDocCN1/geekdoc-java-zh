    `Apache Spark` 是 `MapReduce` 之后最著名的 `Apache YARN` 应用程序。在 `Cloudera`，我们努力平衡 `Spark-on-YARN`
    (`SPARK-1101`)，`CDH 5.0.0` 包含了对 Spark YARN 组的支持。


