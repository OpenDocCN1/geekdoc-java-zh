    ## Using Third Party Libraries in Spark Shell


    Third party libraries can be conveniently used within Spark shell. To do this,
    we need to have the required jar file added to the classpath. The classpath configuration
    can be done when invoking the spark shell with the option “--driver-class-path”
    as below.


    /bin/spark-shell –other_options_as_key_value --driver-class-path path_to_the_library


    ## REPL and Compilation Tradeoff


    As we saw above, we can perform many data analytics, without having compiled code
    and use of build tool like maven or sbt. So how can we decide when to use which?


    Most of the time, Spark REPL would be sufficient to run your entire application
    from the beginning. It provides faster execution, quick response and enables to
    prototype the application quickly. Still, as the application grows with size and
    complexity and the sequence of code becomes largest, the execution time may increase.
    Also if you are working with a large amount of data, this may also lead to program
    fault, wiping out all the variables and functions being used in the current shell,
    which will lead to cumbersome rework. Therefore, as you forward with the application,
    it is better to make a hybrid use of both.


    At the initial stages with less amount of complex code use SPARK REPL environment
    for quick analysis and debugging, and as the application expands in data size
    and complexity, move the implementation to a compiled library and use it in the
    shell. We have seen above, how we can import compiled libraries to Spark Shell.
    With this approach, given that compiled library will not need frequent editing
    and recompiling, running the application in Spark REPL environment will produce
    faster results.


    ## Summary


    In this chapter, we looked into the details of Apache Spark interactive shell.
    We discussed how we can utilize the REPL environment in SCALA for faster implementations
    and efficient execution of the application. We looked into the advantages of REPL
    environment and implementation of some commonly used machine learning algorithms
    in the Spark shell. Finally, we discussed on use of compiled libraries in Spark
    shell and how to decide between the two approaches.


    ## Assignment


