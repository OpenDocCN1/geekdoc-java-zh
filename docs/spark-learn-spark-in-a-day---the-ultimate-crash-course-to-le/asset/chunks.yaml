    ## Getting Started: How to Launch Spark on Yarn


    For a start, it is necessary to make sure that `YARN – CONF – DIR` or `HADOOP
    – CONF – DIR` indicates needed a directory which stores files for configuration
    in the cluster Hadoop Later. These configurations will be used to write the Apache
    Spark in HDFS and will establish direct connection to Resource Manager `YARN`.
    Configurations from this directory are supposed to be distributed on a cluster,
    that''s because all the containers located within the boundaries of the application
    also use these configurations. All of configurations that are referred to Java
    system environment variables also need to be set in Apache Spark for its correct
    usage.


    Also `YARN` uses two different deploy modes for loading Spark applications on
    it. The first is YARN cluster mode that provides Spark drivers a possibility to
    run inside applications that YARN manages on cluster, so client may go away once
    the initialization of processes in the app is done.


    The second one is a Mesos mode that uses specifications of master’s address like
    a parameter. So, there are some differences between YARN mode and Mesos mode,
    because the first one is taken from configuration of Hadoop. Below is program
    code for loading cluster-mode YARN:


    ![](images/00006.jpeg)


    More examples:


