- fmt: '

    Spark processing pipeline, includes two main components as `SparkStreaming` and
    `Spark Engine`. Receivers objects in `SparkStreaming` divide the data streams
    into input data batches of small time frames and `Spark Engine` processes these
    batches send the results to required data storages. We will dig into main components
    in `SparkStreaming` model and the application development and deployment.


    First, let us look into above components in detail and the fundamentals of big
    streaming data analysis application with `SparkStreaming`.


    ### DStreams: Distretized Streams


    Distretized Streams shortened as `Dstreams` are the core representation of a stream
    of data in `SparkStreaming`. A `DStream` can refer to either the stream of input
    data or the results generated after processing.


    A `DStream` is nothing but an infinite sequence of `RDDs` providing an abstraction
    to handle large stream data. A given `RDD` in a `DStream`, holds the data for
    a given time step in the continuous stream. `DStream` API is similar to the `RDD`
    API we discussed in chapter 1. Any function called upon a `DStream` will be converted
    to a transformation on its `RDDs`. This transformation is handled by the `SparkEngine`.
    With this design, `DStream` API provides a convenient high level abstraction for
    the developer.


    Let us further see details on input data streams, transformations and output operations.


    ### Input DStreams, Receivers and Streaming Resources


    `DStreams` objects which hold information on received stream of data are termed
    as `Input DStreams`. Associated with each `Input DStream` except streams from
    files, there is an object which handles buffering the data into Spark memory,
    chopping them into batches of data for processing.


    An input source to `SparkStreaming` can be of two forms:


    1. Basic Source

    2. Advanced Source


    Basic Sources are the input sources which can be directly accessed using `SparkContext`
    API. Examples are sockets, file systems and `AKKA` actors. Accessing Advanced
    Sources, require using additional supporting utilities or dependencies which should
    be explicitly linked with the application. Examples are Twitter, `Kaffka` and
    `Flume`, etc.


    Users can use multiple forms of above inputs by creating multiple input `DStreams`.
    Multiple receivers will be generated in this case, which will simultaneously handle
    the multiple inputs.


    Spark analysis pipeline utilizes, one core of the cores allocated for `SparkStreaming`
    for its execution. Therefore, Special note should be taken that, `SparkStreaming`
    application should have enough cores allocated to it for both data processing
    and running the receivers.


    ### Basic Sources


    `StreamingContext` API comes with methods for handling these sources. They are
    file streams, `Akka` Actors and socket connections.


    Let’s consider filestreams first. A `DStream` object to read input from an `HDFS`
    API compatible file system such as `HDFS`, `NFS`, `S3`, etc. can be instantiated
    as below.


    ```

    var dStreamobj = sstreamingContextObj.filestream[keyClass, valueClass, InputFormatClass](inputDataDirectory)

    ```


    Above tells the Spark Streaming to monitor the input `DataDirectory` and process
    as files are being created in it. It should be noted that, files within nested
    directories cannot be monitored, file should be in same format. Renaming or moving
    the files to input DataDirectory should be an atomic operation and any modification
    done after moving the file, would not take effect as files are read continuously.


    Alternative method to access text files is `text FileStream` which can be called
    simply as below:


    ```

    var dStreamTxtobj = streamingContextObj.textFilestream(inputDataDirectory)

    ```


    It is not necessary to allocate additional cores for receivers since filstreams
    don’t need any receivers.


    Connection to a stream of data from a socket is done as below:


    ```

    var dStreamobj = streamingContextObj.socketTextStream(“host_name”,port)

    ```


    The method `actorStream(actorProps, actor-name)` can be used to create a`DStream`
    object , receiving data from custom actors such as Akka actors. Actors are supported
    in Java and Scala only. Hence this method is not available for Python.


    There is also an option available for reading a-queue of `RDDs` into a `DStream`
    object, which can be useful to perform tests on an application with various test
    data. This can be done as below:


    ```

    var testDStreamobj = streamingContextObj.queuestream(RDDqueue)

    ```


    As `RDDs` are being pushed to the queue continuously, it will be received and
    processed similar to a stream.


    Those are the categories which fall under, basic sources, supported by `SparkContextAPI`.


    ### Advanced Sources


    Sources sending input data from, sources not supported by Spark core and should
    be interfaced with external APIs are termed as advanced sources. Since they are
    not part of Spark and the interfaces may vary with new releases, handling the
    dependencies and instantiating the `DStreams` are to be done through external
    supporting library, which can be linked and imported into the application as needed.
    Examples are sources from Kafka, Flume or Twitter. In these cases, the necessary
    libraries should be linked as dependencies, `DStream` object should be instantiated
    importing necessary utilities and the dependency libraries should be bundled in
    the final uber jar when deploying. Still, these applications cannot be executed
    on Spark Shell and hence we cannot test them on Shell.


    In addition to above main two sources, we can also work with `DStreams` to read
    data from custom inputs with custom receivers being implemented to read data from
    input and forward it to Spark.


    ### Reliable and Unreliable Receivers


    Depending on their reliability, data sources can be of two kinds. Some data sources
    (for an example Flume and Kafka) supports acknowledging the data receipt. If the
    correct data receipt can be acknowledged by the receiver, it ensures that, all
    the data will be received without any loss. Depending on receiver’s ability to
    send the acknowledgement they are of two kinds as reliable receivers and unreliable
    receivers.


    Reliable receiver can acknowledge properly to the source, once the data is received
    and buffered in Spark application. Unreliable receiver will not acknowledge the
    data receipt. In case you don’t want to mess with the complexity involved in acknowledgement
    or are working with an unreliable source which does not support the acknowledgement,
    an unreliable receiver could be used.


    ### DStream Transformations


    Data stored in `DStream` object could be modified through transformations. Both
    `RDD` and `DStreams` share many similar transformations. In this section, we will
    see details on quite frequently used set of transformations.


    - `Map(function)`: This transformation, calls the given function upon source `DStream`
    and returns a `DStream`

    - `FlatMap(function)`: Functions similar to above, but can map each item in the
    input `DStream` to zero or more outputs.

    - `Reduce(function)`: Aggregates elements in source `DStream` based on an associative
    function computable in parallel and returns a new `DStream` with the result.

    - `Repartition (Number Of Partitions)`: Decreases or increases the number of partitions,
    hence changing the paralleled operations by `DStream` object.

    - `Union (Other DStream)`: Returns a `DStream` containing elements from both source
    and `DStreams` (taking a union).

    - `Filter(function)`: Filters items from the `DStream`, based on the function
    passed as argument and returns a `DStream` with filtered data.

    - `Join(other DStream, [number Of Tasks])`: From the source `DStream` and other
    `DStream` of the form `(key,value1)`, `(key, value2)`, returns a `DStream` object
    in the form `(key,(value1,value2))` .

    - `Transform(function)`: Applies the function in the form of `RDD->RDD`, to each
    element of the source `DStream`. Any `RDD` operation can be performed-DStream
    using this transformation.

    - `Count()`: Returns a `DStream` of one `RDD` holding the count of the elements
    in source `DStream`.


    From the input `DStreams`, let us now see the operations on output `DStreams`:

