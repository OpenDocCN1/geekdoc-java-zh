    - `Yarn-client`: 作为客户端连接到 Yarn 集群。集群的位置需要使用 `HADOOF_CONF_DIR` 变量进行配置。

    - `Yarn-cluster`: 作为集群连接到 Yarn 集群。集群的位置需要使用 `HADOOF_CONF_DIR` 变量进行配置。


    ## 共享变量


    在 Apache Spark 中可以使用两种类型的共享变量来加速运行在集群上的应用程序。


    - `广播变量（Broadcast Variables）`: 这些变量可以用于在每台机器上本地缓存只读值，这样对于每个任务来说，就不需要再次发送该值的副本。这使得能够在集群节点之间高效地交换大型数据集。下面是在
    Scala 提示符中使用广播变量的一个示例用方法。


    ```scala

    // 初始化广播变量

    valbroadCastElement = sc.broadcast(Array(‘Nirman’, ‘Shan’, ‘Srini’))


    // 使用广播变量

    broadCastElement.value

    ```


    - `累加器（Accumulators）`: 累加器变量始终通过关联操作进行“相加”。因此，它们非常适合并行运行的实现，例如计数器或求和。一旦使用给定的初始值创建了累加器，集群上的任务就可以使用
    `add` 命令向变量添加。但它的值只能由驱动程序读取，而对运行在集群上的任务不可用。


    下面是在 Scalap 提示符中使用累加器的一个示例用方法。


    ```scala

    // 累加器变量的使用

    ValaccumuatorVar = sc.accumulator(0, "Examle Accumulator Variable") sc.parallelize(Array(‘Nirman’,
    ‘Shan’, ‘Srini’)).foreach(i =>accumuatorVar += i)

    accumuVar.value

    ```


    有了这些工具，让我们把这些部分整合起来，构建我们的简单单词计数应用程序。


    ## 使用 Apache Spark 构建单词计数应用程序


    使用 Spark API，可以轻松地从文本文件中读取并处理数据。通过下面的 Scala shell 示例，我们将看到如何使用它们。


    要在 Scala shell 中运行传统的单词计数应用程序，请运行下方的命令。


    ```scala

    importorg.apache.spark.SparkContext

    importorg.apache.spark.SparkContext._

    valtextFileRead = "sample_data.md"

    valtextFileData = sc.textFile(textFileRead)

    textFileData.cache()

    ```


    调用 `cache()` 会将 RDD 存储在缓存中，并在后续查询中轻松读取。`cache()` 是惰性求值的，这意味着它不会立即存储数据，而是当对 RDD
    调用任何操作时才会存储。


    要读取文本文件的行数，请运行下面的命令。


    ```scala

    textFileData.count()

    ```


    现在，可以像下面这样打印出文件中每个单词旁边的单词计数。


    ```scala

    valwordCountData= textFileData.flatMap(list =>list.split(" ")).map(word => (word,
    1)).reduceByKey(_ + _)

    wordCountData.collect().foreach(println)

    ```


