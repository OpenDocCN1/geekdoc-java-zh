    *   SparkSQL: SQL engine on top of Spark. As we have already seen, Spark has almost
    everything needed for this, other than storage, index and its statistics. This
    seriously hampers the optimization, but the team SparkSQL claims that they are
    establishing a new optimization framework, as well as AMP LAB (Laboratory where
    grown Spark) is not going to give up the project Shark - complete replacement
    of Apache HIVE'
