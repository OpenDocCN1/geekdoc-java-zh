  trans: '

    如上所述，该模型的优势在于其完成过程的速度：作业可以快速启动并处理内存中的信息。缺点是资源管理粒度较粗。随着应用程序中代理（agent）数量的变化，且由于每个代理都有固定的资源分配，应用程序在运行的整个生命周期内都会占用相同数量的资源。（在
    YARN 帮助堆栈缩放时，我们计划在 Spark 中利用它来强有力地获取和归还资源。）


    ### 动态驱动器 (Dynamic Driver)


    为了处理任务流和调度分配，Spark 依赖于动态驱动器程序。通常，该驱动器程序与启动任务的客户端程序相同，但在 YARN 模式下，驱动器可以保持在集群上运行。相反，在
    MapReduce 中，客户端程序可以退出，而任务可以继续运行。在 Hadoop 1.x 中，`JobTracker` 负责作业调度，而在 Hadoop 2.x
    中，`MapReduce` 进程客户端接管了这一职责。


    ### 可插的资源管理 (Pluggable Resource Management)


    Spark 增强了可插的批处理管理。批管理员负责启动执行器（executor）任务。Spark 应用程序开发者无需为运行 Spark 的批管理员感到压力。


    Spark 支持 `YARN`、`Mesos` 及其自身的“独立”批处理管理员。这三个系统中的每一个都包含两个部分。主客户端管理（`YARN Resource
    Manager`、`Mesos` 核心或 `Spark` 独立客户端）选择获得运行代理机会的应用程序，并决定它们在何处以及何时运行。运行在每个节点（hub）上的从节点（`YARN
    Node Manager`、`Mesos` 服务器或 `Spark` 独立服务器）真正启动执行器任务。它们还可能监控它们的能量和资源利用率。


    ## 为什么在 YARN 上执行？


    利用 `YARN` 作为 Spark 的批管理员相比 Spark 独立模式和 Mesos 具有几个优势：


    *   `YARN` 允许你在所有运行在 `YARN` 上的系统之间积极共享和安排同一组批处理资源。你可以将整个批作业交给一个 `MapReduce` 作业，然后将其中的部分用于
    `Impala` 查询，另一部分用于 Spark 应用程序，而无需调整配置。

    *   你可以利用 `YARN` 调度器的每一个组件来对负载进行排序、断开和组织。

    *   Spark 独立模式要求每个应用程序在组中的每个节点上运行一个执行器，而使用 `YARN` 时，你可以选择使用的执行器数量。

    *   最后，`YARN` 是 Spark 的主批管理员，并提供了安全性支持。通过 `YARN`，Spark 能够针对开启了 Kerberos 化的 Hadoop
    作业保持运行，并在其程序之间使用安全验证。


    ### 在 YARN 上执行


    在 `YARN` 上执行 Spark 时，每个 Spark 执行器都作为一个 `YARN` 堆栈保持运行。`MapReduce` 为每项任务规划一个容器并启动一个
    `JVM`，而 Spark 在同一个容器内处理不同的任务。这种方法使得某些请求具有更快的任务启动时间。


    Spark 支持两种在 YARN 上运行的模式：`yarn-batch` 模式和 `yarn-Master/client` 模式。通常情况下，`yarn-group`
    模式适用于生成任务，而 `yarn-customer` 模式适用于需要快速查看应用程序结果的交互性和探索性应用。


    理解这种区别需要理解 `YARN` 的应用程序客户端（Application Client）概念。在 `YARN` 中，每个应用程序实例都有一个应用程序客户端程序，这是该应用程序启动的第一个容器。应用程序负责向
    `Resource Manager` 请求资源，并在分配资源后，通知 `Node Managers` 为其启动容器。`Application Masters`（应用程序主节点）消除了对动态客户端的需求——启动应用程序的程序可以退出，协调工作由集群上由
    YARN 管理的程序进行。


    在 `yarn-group` 模式下，驱动器在 `Application Master` 中运行。这意味着同一个程序同时负责驱动应用程序和从 `YARN`
    请求资源，且该程序保持在 `YARN` 容器内部运行。启动应用程序的客户端不需要在其整个生命周期内留守。


    `yarn-group` 模式不适用于交互式使用 Spark。需要客户端信息的 Spark 应用程序（例如启动 shell 和 `PySpark`）需要 Spark
    驱动器在启动 Spark 应用程序的客户端进程内部运行。在 `yarn-customer` 模式下，`Application Master` 仅用于从 `YARN`
    请求代理容器。客户端在启动任务后与这些容器通信以进行调度工作。


    驱动器平台：


    *   `YARN Batch`: 应用程序客户端

    *   `Yarn Master`: 主节点 (Master)

    *   `Independent Spark`: 主节点 (Master)


    资源请求执行者：


    *   `YARN Batch`: 应用程序客户端

    *   `Yarn Master`: 应用程序客户端

    *   `Independent Spark`: 主节点 (Master)


    谁启动执行器进程？


    *   `YARN Batch`: YARN 节点管理器

    *   `Yarn Master`: YARN 节点管理器

    *   `Independent Spark`: Spark 服务器


    请求服务：


    *   `YARN Batch`: YARN 资源管理器和节点管理器

    *   `Yarn Master`: YARN 资源管理器和节点管理器

    *   `Independent Spark`: Spark 客户端和服务器


    支持 Spark 提交吗？


    *   `YARN Batch`: 否

    *   `Yarn Master`: 是

    *   `Independent Spark`: 是


    ## 总结


    *   应用程序：这可能是一个单一任务、一系列任务、一个根据需要发布新指令的长运行管理程序或一个交互式探索会话。

    *   Spark Driver：Spark 驱动器是运行 Spark 环境的程序（对应应用程序会话）。该驱动器负责将应用程序转换为在集群上执行的各个步骤的指导图。每个应用程序都有一个驱动器。

    *   Spark Application Master：Spark Application Master 负责根据驱动器向 `YARN` 安排资源需求，并寻找合适的主机/容器配置来运行
    Spark 应用程序。每个应用程序都有一个 Application Master。

    *   Spark Executor：运行在节点上的单个 JVM 实例，为单个 Spark 应用程序提供服务。代理在其生命周期内运行不同的任务，并同时处理多项任务。一个节点可能有几个
    Spark 代理，并且有许多节点为每个客户端应用程序运行 Spark 执行器。

    *   Spark Task：一个 Spark Task 代表对分布式数据集某一部分进行尝试的单元。


    因此，你已经学习了 Spark 和 MapReduce 如何在 YARN 和应用程序下管理批资源。在 Spark 应用程序中，你学习了 Spark 应用程序的结构规划、执行器（Executors）、动态驱动器（Dynamic
    drivers）和可插的资源管理。我们还讨论了为什么选择 YARN 执行以及如何在 YARN 上执行。


