    In addition to its core, Spark also provides some useful set of libraries for
    huge data analytics. A summary of some important libraries is presented in the
    table below.


    | Apache Spark Library | Usage |

    | :--- | :--- |

    | Spark Streaming | Facilitates real time streamed data processing in a micro
    batch analysis manner, using a `DStream`: A series of realtime Resilient Distributed
    DataSets(`RDD`) |

    | Spark SQL | Enables to execute queries on structured data within Spark application
    itself or through `JDBC` and `ODBC` connectors if necessary. It also enables working
    with data in different formats such as `JSON`, `Apache Parquet`, etc. to perform
    a query. |

    | Spark MLlib | A comprehensive collection of common machine learning algorithm
    implementations and utilities to perform related operations such as collaborative
    filtering, regression, classification, clustering, underlying optimization primitives
    and dimensionality reduction. |

    | Spark Graph – X | An extensive solution for graphs & computations involving
    graphs. Extending the functionalities from Spark `RDD`, this has introduced a
    new multi-graph that comes with properties connected to each and every vertex/edge,
    called as Resilient Distributed Property Graph. In addition to supporting basic
    graph handling operators such as `join Vertices`, `aggregate Messages` and `subgraphs`.
    And providing an optimized version of the `Pregel API`, this has a complete set
    of solution for analyzing graph data with builders and graph algorithms. |

    | Integration Adaptors: Spark Cassandra, Spark R | Acts as adaptors and facilitates
    working with data in `Cassandra` or `R` |


    On top of the above, comes a vast set of libraries providing various exciting
    functionalities. One such is the approximate query engine `Blink DB` which enables
    to execute `SQL` queries upon a huge amount of data in an interactive manner,
    to view clear interpretation of the results with error bars and select between
    query accuracy and response time. Another is [Tachyon](http://tachyon-project.org/index.html),
    a distributed file system which speeds up the file sharing among different frameworks
    such as Spark and `Hadoop`, performing in-memory operations so that, frequently
    read data sets can be cached and accessed quickly. |


    # Building Blocks of Apache Spark


    In this section, we will discuss on Apache Spark architecture and its core components.


    Apache spark is built upon 3 main components as `Data Storage`, `API` and `Resource
    Management`. In this section, we will discuss about these 3 building blocks of
    the framework.


    ## Core Components


    As per `Data Storage`, Spark is built upon an `HDFS` file system and capable of
    handling data from `HBase` or `Cassandra` systems as well. Spark `API` consists
    of interfaces to develop applications based on it in `Java`, `Python` and `Scala`
    languages. Using Spark, resource management can be done either in a single server
    instance or using a framework such as `Mesos` or `YARN` in a distributed manner.


    ## Resilient Distributed Data Set


    Apache Spark is built upon `RDD` (Resilient Distributed Data Set) concept. Similar
    to a table in a database, an `RDD` can hold data in various formats and is an
    immutable distributed collection of records. Spark can alternatively execute multiple
    programs between `RDDs` and `RDD` can recover faults efficiently through recomputing
    lost partitions upon a failure.


    If you call any transformation upon an `RDD`, new `RDD` will be returned, while
    the original remains unmodified, since `RDDs` are immutable objects.


    An `RDD` has 2 sets of parallel operations as `Transformation` and `Action`. A
    `Transformation` operation will always return an `RDD`, not a value and no evaluation
    happens in that case. Example Transformation operations are `map`, `filter`, `flatMap`,
    `groupByKey`, `reduceByKey`, `sample`, `union`, etc.


    An `Action` operation, evaluates called functions on `RDDs` they are called upon,
    executing the queries and returns a value as the result. Example Action operations
    are `count`, `reduce`, `collect`, `take`, etc.


    # Getting Hands Dirty with Spark


    Let us now install Apache spark and run a simple word count application.


    You can either use Spark setups available from vendors like `Cloudera`, `MapR`
    or `HortonWorks` or use it in the cloud. Spark needs `Java` installed on the system
    for it to run on your local machine. Hence we will first set up `Java Development
    Kit`. The steps described below are for a machine running Windows operating system.
    Note that, steps to set up Apache Spark on Linux or Mac OS will be similar but,
    the manner of setting up the environment variables may differ.


    ### Installing Java


    Installing `JDK` is quite straightforward. Download the `JDK` (Version 1.7 recommended)
    from the official vendor (`Oracle`) website and run the installer. Once installation
    is completed, verify successful completion by running below in the command line.
    Upon successful installation, it will show the Java version.


    ```bash

    java -version

    ```


    Now let us install Spark.


    ### Installing Spark


    To install Spark on the system, navigate to the official Apache Spark website,
    download the latest version, unzip the file if necessary and move it to a convenient
    location. Move to that folder and launch the `Spark Shell`. An example is shown
    below, assuming it has been extracted to the location: `C:\spark_setup`.


    ```bash

    C:

    cd C:\spark_setup\ spark-1.4.0-bin-hadoop2.1

    bin\spark-shell

    ```


    If you see the below prompt, Whola!! You have installed Spark successfully.


    ```text

    15/07/21 13:15:32 INFO Http-Server:- Starting HTTP-Server

    15/07/21 13:15:32 INFO Utils:- service is successfully in progress ''HTTP-class_
    server'' on the port of 58132.

    ```


    Welcome:


    ![](images/00001.jpeg)Making Use of Scala (version is 2.10.4) (Java HotSpot)


    Enter the expressions to evaluate them. Type:- Taking help to find info.


    ```text

    15/07/21 13:15:41 INFO BlockManagerMaster: Registered BlockManager

    15/07/21 13:15:41 INFO Spark-I Loop: Spark-context is created..

    ```


    Spark-context can be made available – as sc. To verify whether Spark shell executes
    properly, try below commands.


    ```scala

    sc.version

    sc.appName

    ```


    To quit the shell, use below command.


    ```scala

    quit

    ```


    Windows does not come with Python interpreter and hence, to run the Spark Python
    shell, we need to setup Python in our environment. Python official website provides
    an installer for Windows or we can use a package like Anaconda, which comes with
    added collection of computational tools written in Python.


    Once python has been installed, you can launch the Spark Python Shell by executing
    `pyspark` in Spark installation directory. An example is given below:


    ```bash

    C:

    cd C:\spark_setup\ spark-1.4.0-bin-hadoop2.1

    bin\pyspark

    ```


    That is all we need to run Apache interactive shell in Scala or Python. It also
    comes with a web console. Let us see how to use Apache Spark web console.


    ### Using Apache Spark web Console


    While working with Spark, to view analysis results and other information, navigate
    to below URL. MasterURL for different modes:


    Connection to Spark engine can be done in different modes. When running Spark
    locally or on cloud, this is done configuring the `MasterUrl` parameter as per
    below.


    Setting `MasterUrl` parameter to:


    *   `Local`: Runs Spark as one process with no threads in the local machine.

    *   `Local[n]`: `n` refers to the number of threads to be run on parallel. It
    is recommended to set `n` to the number of cores in the local machine.

