    And if you are operator, who runs a clusters, the only difference, that you should
    notice is in deployment of code or configuration monitoring.


    ## Original Features of Apache Spark that Hadoop Doesn’t Have


    When we start to talk about decisions, it’s better to note some very specific
    features of Spark that may help you to decide, what framework suits better to
    you: Apache Spark or Hadoop Mapreduce. So let’s go through the greatest features
    of the modern framework (also, there are a lot of features that are described
    in official site of Apache Spark):


    ### Speed


    It is really the main feature of Spark. It enables apps to run faster for 100x
    (!) in-memory and for 10 times faster, if it is even launched in disc memory.
    Also, there is a possibility in Spark that allows reducing the number of read/write
    on a disc. And the next feature is that Spark stores this intermediate processing
    data in-memory. As we mentioned earlier Apache Spark uses Resilent Distributed
    Database (`RDD`) technology that may help to store data transparently in memory,
    without using disc storage at all or using it only when it will needed. It also
    helps to reduce dics read/write, because processing of data is the most time consummator.


    ### Simple to Learn


    Spark provides you a possibility to develop applications based on `Java`, `Python`
    and `Scala`. So now, it is more comfortable to run and create apps, which were
    written in familiar programming languages and building of parallel applications
    become more convenient. Also, you have a set of 80 high-level operators available
    that are built in package of framework.


    ### Combination of Old and New Features


    New version of Apache Spark has some new features in addition to trivial `map/reduce`.
    New ones are `SQL`, `streaming` and complex analytics. Also, you have a possibility
    to combine all of these features in the one single workflow.


    ### Running Everywhere


    Apache spark now supports `Hadoop`, `Mesos`, standalone and cloud technologies.


    ## Application Area of These Frameworks


    ### Hadoop


    Hadoop is used to process the big data and fast-growth data and is intended for
    processing unstructured data. Before using it you need to take into that it does
    not give access to the data in real timethat by itself, entire array data is processed
    during the formation of requests.


    Hadoop is used to build a global intelligence systems, machine learning, correlation
    analysis of various data, statistical systems. Hadoopcannot be used itself as
    an operational database. Typically, in a corporate environment Hadoop is used
    in conjunction with relational databases. To eliminate the basic disadvantages
    of the framework additional modules and external applications are used.


    ### Spark in Memory Database


    Spark in memory database is a specialized distributed system to speed up data
    in memory. Integrated with `Hadoop` and compared with the mechanism provided in
    the `Hadoop MapReduce`, Spark provides a 100 times better performance when processing
    data in the memory and 10 times when placing the data on the disks. The engine
    can run on both nodes in the cluster using `Hadoop`, `Hadoop YARN`, and in a separate
    operation. Supports data processing in storage `HDFS`, `HBase`, `Cassandra`, `Hive`
    and any format input Hadoop (`InputFormat`). Unlike `MapReduce` Spark does not
    store intermediate result sets in disk (if they are not too big to fit in RAM).
    Spark creates `RDDs` (`Resilient Distributed Datasets`), which can be stored and
    processed in memory full or in part. `RDDs` have no rigid format.


    The system is positioned as a quick tool to work with data stored in the cluster
    `Hadoop`.


    ## Summary


    Here you got some important tips that will make your work process easier and more
    convenient. And don’t forget to understand all reasons of your further actions:
    it’s better to re-read previous chapters and headings, if you can’t understand
    some information.


    Spark is superfast, modern and convenient tool, but it is also based on `Hadoop`,
    so is there something new for you?


    Spark is getting more popular day-to-day. Twenty percent of instances that use
    Spark run on `Cassandra`, 42 percent on `Hadoop YARN` and 26 percent on `Apache
    Mesos`. But the only problem is that a lot of people know nothing about Spark
    and their new awesome technologies.


    Certainly, Hadoop will never be removed completely, because there are a lot of
    old-fags, that wouldn’t change their framework for something new, even if it’s
    100 times faster and better. But Spark is a new era in technologies of massive
    storage. Maybe, in 4-5 years, it would have more than 50% percent of all of instances
    that use similar frameworks.


    Spark is a small a component of big complex `Hadoop` ecosystem, so it’s normal
    behavior, when new projects start to make their own “career”.


    And also, the main advantage of Spark is its simplicity, because now developers
    have more tools for creating awesome applications and it is easier to “plug in”
    work, using user friendly interface of new Apache’s product.


    If you see the technical side of problem – Spark provides users more opportunities
    and great performance, because of powerful executor engine.


    So below are listed all of advantages of Spark:


    *   Iterative and easy algorithms

    *   Cool and user-friendly data mining and processing

    *   Possibility for stream processing

    *   Possibility for sensor data processing

    *   Speed rate, that is 100 time faster than Hadoop


    ## Assignment


    ### Exercise


    1) Install `Hadoop` and `Spark` frameworks on your local machine

    2) Try to find differences and similarities between both (`Hadoop` and `Spark`)
    and note it to scrapbook

    3) Try to do basic commands on both of frameworks.


    # Chapter 10: Faster Application Development with Apache Spark


    As we noted, in previous chapters, Apache Spark comes as a comprehensive framework
    for large-scale data analytics. With various supporting utilities, developers
    can develop, build and deploy their applications on Spark faster. In this chapter,
    we will see the different forms of Spark applications and how we can build and
    run them using a build tool.


    An Apache Spark application can be run within the interactive shell or submitted,
    either in the local machine or on a cluster in a distributed manner. In the following
    sections, we will discuss further on these two methods.


    ## Data Analysis with Spark Interactive Shell


    We saw an example of how to run the word count application with Spark interactive
    shell, in chapter 1. Let’s now see how to build, develop, and run an application
    in `Scala` with a build tool.


    ### sbt : Simple Build Tool


    `sbt` is a build tool developed in `Scala` and can be used to buid applications
    in Spark shell. Moving forward from the word count application,let us develop
    an application to return how many lines are there with the word ‘and’. With Apache
    Spark already setup in the machine, we also need to have `sbt` installed in our
    system for this. The preferred sbt installer can be downloaded from their official
    website and must be installed, before trying out below commands.


    In order to build Apache Spark, in a command prompt, move to Spark installation
    folder and execute the following:


    ```

    ![](images/00028.jpeg)

    ```


    Now that we have built Spark, create a new folder with a preferred name for our
    application. We will name it as `SparkLineCountApplication`.


    Move to the project folder and create a file as below and save it with a preferred
    name, making sure it is saved in `.sbt` extension.


    Below, will be the content of `SparkLineCountApplication/lineCount.sbt`


    ```

    name := " SparkLineCountApplication "

    ```


    ```

    ![](images/00029.jpeg)

    ```


    The parameter `resolvers` above refer to the repositories, we may need to refer
