    除了核心功能外，Spark 还提供了一些用于海量数据分析实用库。下表列了一些重要库的摘要。


    | Apache Spark 库 | 用途 |

    | :--- | :--- |

    | Spark Streaming | 以微批（micro batch）分析的方式促进实时流数据处理，使用 `DStream`：这是一系列实时的弹性分布式数据集（`RDD`）。
    |

    | Spark SQL | 允许在 Spark 应用程序内部或在需要时通过 `JDBC` 和 `ODBC` 连接器对结构化数据执行查询。它还允许处理如 `JSON`、`Apache
    Parquet` 等不同格式的数据以执行查询。 |

    | Spark MLlib | 常用机器学习算法实现和工具的全面合集，用于执行相关操作，如协同过滤、回归、分类、聚类、底层优化原语和维度降维。 |

    | Spark Graph – X | 一种针对图及涉及图计算的广泛解决方案。扩展了 Spark `RDD` 的功能，它引入了一种新的多图，带有与每个顶点/边相连的属性，称为弹性分布式属性图（Resilient
    Distributed Property Graph）。除了支持基础图处理算子（如 `join Vertices`、`aggregate Messages`
    和 `subgraphs`）外，它还提供了优化版本的 `Pregel API`，拥有一套使用构建器和图算法分析图数据的完整解决方案。 |

    | 集成适配器：Spark Cassandra, Spark R | 作为适配器使用，便于处理 `Cassandra` 或 `R` 中的数据。 |


    在上述内容之上，还有大量的库提供了各种令人兴奋的功能。其中之一是近似查询引擎 `Blink DB`，它能够以交互方式对海量数据执行 `SQL` 查询，查看带有误差棒的结果清晰解释，并在查询准确性和响应时间之间进行选择。另一个是
    [Tachyon](http://tachyon-project.org/index.html)，它是一个分布式文件系统，通过加速 Spark 和 `Hadoop`
    等不同框架之间的文件共享，执行内存操作，使得频繁读取的数据集可以缓存并快速访问。 |


    # Apache Spark 的构建模块


    在本节中，我们将讨论 Apache Spark 架构及其核心组件。


    Apache Spark 构建在三个主要组件之上：`Data Storage`（数据存储）、`API` 和 `Resource Management`（资源管理）。在本节中，我们将讨论该框架的这三个构建模块。


    ## 核心组件


    根据 `Data Storage`，Spark 构建在 `HDFS` 文件系统之上，并能够处理来自 `HBase` 或 `Cassandra` 系统的数据。Spark
    `API` 包含接口，允许用户使用 `Java`、`Python` 和 `Scala` 语言基于它开发应用程序。使用 Spark，资源管理可以在单服务器实例中进行，也可以使用如
    `Mesos` 或 `YARN` 等框架以分布式方式进行。


    ## 弹性分布式数据集


    Apache Spark 构建在 `RDD`（Resilient Distributed Data Set，弹性分布式数据集）概念之上。类似于数据库中的表，`RDD`
    可以以各种格式存储数据，是不可变的分布式记录集合。Spark 可以在 `RDDs` 之间执行多个程序，且 `RDD` 可以在故障时通过重新计算丢失的分区来高效地恢复故障。


    如果你对 `RDD` 调用任何转换（transformation），将返回一个新的 `RDD`，而原始对象保持不变，因为 `RDDs` 是不可变对象。


    一个 `RDD` 有两类并行操作：`Transformation`（转换）和 `Action`（动作）。`Transformation` 操作始终返回一个
    `RDD` 而不是值，且在这种情况下不会发生评估。示例转换操作包括 `map`、`filter`、`flatMap`、`groupByKey`、`reduceByKey`、`sample`、`union`
    等。


    `Action` 操作会在调用的 `RDDs` 上评估调函数，执行查询并返回结果作为值。示例动作操作包括 `count`、`reduce`、`collect`、`take`
    等。


    # 实际上手 Spark


    现在让我们安装 Apache Spark 并运行一个简单的词汇计数应用程序。


    你可以使用 `Cloudera`、`MapR` 或 `HortonWorks` 等供应商提供的 Spark 设置，也可以在云端使用。Spark 需要系统安装
    `Java` 才能在你的本地机器上运行。因此，我们首先设置 `Java Development Kit`（Java 开发工具包）。下述步骤适用于运行 Windows
    操作系统的机器。请注意，在 Linux 或 Mac OS 上设置 Apache Spark 的步骤类似，但设置环境变量的方式可能不同。


    ### 安装 Java


    安装 `JDK` 非常简单。从官方供应商（`Oracle`）网站下载 `JDK`（推荐版本 1.7）并运行安装程序。安装完成后，在命令行中运行以下命令验证是否成功。安装成功后，将显示
    Java 版本。


    ```bash

    java -version

    ```


    现在让我们安装 Spark。


    ### 安装 Spark


    要在系统上安装 Spark，请访问官方 Apache Spark 网站，下载最新版本，如有必要解压文件并将其移动到方便的位置。进入该文件夹并启动 `Spark
    Shell`。下所示所示，假设它已解压到位置：`C:\spark_setup`。


    ```bash

    C:

    cd C:\spark_setup\ spark-1.4.0-bin-hadoop2.1

    bin\spark-shell

    ```


    如果你看到下面的提示，太好了！！你成功安装了 Spark。


    ```text

    15/07/21 13:15:32 INFO Http-Server:- Starting HTTP-Server

    15/07/21 13:15:32 INFO Utils:- service is successfully in progress ''HTTP-class_
    server'' on the port of 58132.

    ```


    欢迎：


    ![](img/00001.jpeg)Making of Scala (version is 2.10) (Java HotSpot)


    输入表达式进行评估。Type:- Taking help to find info.


    ```text

    15/07/21 13:15:41 INFO BlockManager: Registered BlockManager

    15/07/21 13:15:41 INFO Spark-context is created..


    ```


    Spark 可用。要验证 Spark shell 执行正常，尝试以下命令。


    ```scala

    sc.version

    sc.appName

    ```


    退出 shell，使用以下命令。


    ```scala

    quit

    ```


    Windows 不带 Python 解释器，因此为了运行 Python shell，我们需要在环境中设置 Python。Python 官方网站提供了 Windows
    安装程序，或者我们可以使用像 Anaconda 这样的包，它自带许多 Python 计算工具。


    一旦安装了 Python，可以在 Spark 安装目录下执行 `pyspark` 来启动 Spark Python Shell。示例所示：


    ```bash

    C:

    cd C:\spark_setup\ spark-1.4.0-bin-hadoop2.1

    bin\pyspark

    ```


    这就是在 Scala 或 Python 中运行 Apache 交互式 shell 的全部。它还带有一个 Web 控制台。让我们看看如何使用 Apache Spark
    Web 控制台。


    ### 使用 Apache Spark Web 控制台


    在使用 Spark 时，要查看结果和其他信息，请导航到以下 URL。不同模式的 MasterURL：


    连接 Spark 引擎可以有多种方式。在本地或云端运行时，通过如下所示配置 `MasterUrl` 参数来实现。


    将 `MasterUrl` 设置为：


    *   `Local`：在本地机器上以无线程进程运行 Spark。

    *   `Local[n]`：`n` 指并行运行线程数。建议将 `n` 设置为本地机器的核心数。

    *   `Local[*]`：创建与本地逻辑核心数相同的线程。

    *   `Spark://host_name:port_number`：在指定的端口号上运行指定的 Spark 集群(`host_name`）。在大多数系统中，端口号为
    7077。

    *   `Mesos://host_name:port_number`：在指定的端口号上运行指定的 Mesos 集群(`host_name`）。在大多数系统中，端口号为
    5050。注意，如果集群使用 Zookeeper，则可能需要更改如下。


    ```text

    mesos://zk: host_name:port_number

    ```


