    As regards solving the problem of metadata accumulation, there are two alternatives.
    The first alternative is to use automatic cleanup parameters which can be triggered
    with `spark.cleaner.ttl`. It can however cause problems as it would also clean
    any RDDs that is still persisting. The second alternative which is recommended
    is to use batches to divide jobs that run for a long time. This allows you to
    run every batch of job on a new environment which would not have any accumulated
    metadata.


    ### Lesson 2: Evade Movement of Data


    Minimizing data transfer and evading shuffles would lead to faster running and
    more reliable programs. You should however note that once in a while, shuffling
    of data can help.


    So how do you evade data shipping? The straightforward way is to evade data shuffling
    operations such as `coalesce` and `repartition`. You should also avoid join operations
    like `join` and `cogropu` as well as `ByKey` operations such as `reduceByKey`
    and `groupBy`. The only `ByKey` operation that would not trigger shuffling is
    for counting.


    Two mechanisms provided by Spark to help include `Broadcast` variables and `Accumulators`.


    ### Lesson 3: Evading Movement of Data is Difficult.


    Using the mechanisms listed above can be challenging. This is because you need
    to first `collect()` an RDD from the driver node before you can broadcast it.
    You would also need the data to be serialized and aggregated at the driver before
    the results of the execution distribution can be accumulated. This results in
    memory pressure increase at the driver. This could result in running out of memory
    quickly on the driver. It is however possible to increase the allocated memory
    by using the `spark.driver.memory`, but its effect is limited.


    You would also require a good understanding of your data and how they come together
    to be able to manage partition increases and how Akka is used by Spark for messaging.
    The default buffer for Akka is 10MB. This can however be evaded by using the `akka.frameSize`
    operation.


    ### Lesson 4: Speed


    Proper understanding of the three lessons initially discussed would lead to program
    stability. This lesson would however help to improve the performance of your program.


    Firstly, you must use your caching liberally. This is especially due to the fact
    that your cache memory is limited. Instead of using a data twice, place it in
    a cache memory.


    Secondly, broadcast variables are very helpful. You can use utilize them for lookup
    tables and large maps.


    Lastly, you might have to execute Spark programs in a parallel way. Using one
    key at a time could lead to terrible utilization of resources. Using this method
    would also deny you the advantages of the in-built parallelism of Spark.


    Spark can thus only be useful to you as much as you are able to aid it to be functional.


    ## Summary


    The lessons and concept of Spark have been discussed to some extent. It will aid
    to develop an understanding of the different mechanisms including those you would
    need in knowing how to configure and make use of the advanced features of Spark.


