    Spark 处理流水线包含两个主要组件：`SparkStreaming` 和 `Spark Engine`。`SparkStreaming` 中的接收器（Receiver）对象将数据流分为小时间窗口的输入数据批次，而
    `Spark Engine` 则处理这些批次并将结果发送到所需的数据存储中。我们将深入研究 `SparkStreaming` 模型中的主要组件以及应用程序的与部署。


    首先，让我们详细了解上述组件，以及使用 `SparkStreaming` 进行大数据流式数据分析应用的基础。


    ### DStreams：离散流（Discretized Streams）


    离散流（Discretized Streams，简称为 `Dstreams`）是 `SparkStreaming` 中数据流的核心表示。一个 `DStream`
    可以指输入数据流，也可以指处理后生成的的结果。


    `DStream` 无质上是 `RDDs` 的无限序列，为处理大规模流式数据提供了抽象。`DStream` 中的给定 `RDD` 存储了连续流中特定时间步的数据。`DStream`
    API 与我们在第 1 章讨论的 `RDD` API 类似。任何在 `DStream` 上调用的函数都将转换为对其 `RDDs` 的转换操作。这种转换由 `SparkEngine`
    处理。通过这种设计，`DStream` API 为开发者提供了一个方便的高层抽象。


    让我们进一步查看有关输入数据流、转换和输出操作的细节。


    ### 输入 DStreams、接收器与流式资源


    持有接收到的数据流信息的 `DStreams` 对象被称为 `Input DStreams`（输入 DStreams）。对于每个 `Input DStream`（除文件流外），都有一个对象将数据缓冲到
    Spark 内存中，并将其切分为处理的数据批次。


    `SparkStreaming` 的输入源有两种形式：


    1. 基础源（Basic Source）

    2. 高级源（Advanced Source）


    基础源是可以使用 `SparkContext` API 直接访问的输入源。例如接字、文件系统和 `AKKA` 节点。访问高级源需要使用额外的辅助工具或依赖，这些工具应该显式地链接到应用程序中。例如
    Twitter、`Kaffka` 和 `Flume` 等。


    用户可以通过创建多个输入 `DStreams` 来使用上述输入的多种形式。在这种情况下，将生成多个接收器，它们同时处理多个输入。


    Spark 分析流水线利用分配给 `SparkStreaming` 执行的核心之一进行运行。因此，应该特别注意，`SparkStreaming` 应用程序应分配足够的核心，以便用于数据处理和运行接收器。


    ### 基础源


    `StreamingContext` API 提供了处理这些源的方法。它们是文件流、`Akka` 节点和接字连接。


    让我们先考虑文件流。可以如下实例化一个从兼容 `HDFS` API 文件系统（如 `HDFS`、`NFS`、`S3` 等）读取输入的 `DStream` 对象：


    ```

    var dStreamobj = sstreamingContextObj.filestreamkeyClass, valueClass, InputFormatClass

    ```


    上述代码告诉 Spark Streaming 监控输入 `DataDirectory`，并在其中创建文件时对其进行处理。需要注意的是，嵌套目录中的文件无法被监控，文件应保持相同格式。将文件重命名或移动到输入
    DataDirectory 应该是一个原子操作，在移动文件后进行的任何修改都不会生效，因为文件是持续读取的。


    访问文本文件的备用方法是 `text FileStream`，可以简单如下所示调用：


    ```

    var dStreamTxtobj = streamingContextObj.textFilestream(inputDataDirectory)

    ```


    不需要为接收器分配额外的核心，因为文件流不需要任何接收器。


    从接字到数据流的连接如下：


    ```

    var dStreamobj = streamingContextObj.socketTextStream(“host_name”,port)

    ```


    可以使用 `actorStream(actorProps, actor-name)` 方法创建一个 `DStream` 对象，接收来自自定义节点（如 Akka
    节点）的数据。仅在 Java 和 Scala 中支持节点（Actors）。因此，该方法在 Python 中不可用。


    还有一种选项可以将 `RDDs` 队列读取到 `DStream` 对象，这对于使用各种测试数据对应用程序进行测试非常有用。可以如下所示：


    ```

    var testDStreamobj = streamingContextObj.queuestream(RDDqueue)

    ```


    由于 `RDDs` 被不断推送到队列中，它们将像流一样被接收和处理。


    这些就是受 `SparkContextAPI` 支持的基础源类别。


    ### 高级源


    从 Spark 核心不支持的、需要与外部 API 接口的源发送输入数据的源被称为高级源。由于它们不是 Spark 的一部分，且接口可能会随着新版本的发布而变化，因此依赖的处理和
    `DStreams` 的实例化必须通过外部支持库完成，这些库可以根据需要链接并导入应用程序中。例如来自 Kafka、Flume 或 Twitter 的源。在这些情况下，应将必要的库作为依赖链接，在导入必要的工具时实例化
    `DStream` 对象，并在部署时将依赖库封装在最终的 uber jar 中。尽管如此，这些应用程序在 Spark Shell 上执行，因此我们无法在 Shell
    上测试它们。


    除了上述两个主要源外，我们还可以使用 `DStreams` 从自定义输入读取数据，并实现自定义接收器来从输入读取数据并将其转发到 Spark。


    ### 可靠与不可靠的接收器


    根据可靠性，数据源可分为两种。某些数据源（例如 Flume 和 Kafka）支持确认数据接收。如果接收器能够确认正确的数据接收，则确保所有数据都会被接收且无任何丢失。根据接收器发送确认的能力，它们分为可靠接收器和不可靠接收器。


    可靠接收器在数据接收并缓冲到应用程序后，可以向源发送确认。不可靠接收器不会确认数据接收。如果你不想处理确认相关的复杂性，或者正在与不支持确认的不可靠源工作，则可以使用不可靠接收器。


    ### DStream 转换


    存储在 `DStream` 对象中的数据可以通过转换进行修改。`RDD` 和 `DStreams` 共享许多转换。在本节中，我们将详细介绍一组经常使用的转换。


    - `Map(function)`：此转换在源 `DStream` 上调用给定函数并返回一个 `DStream`。

    - `FlatMap(function)`：与上述类似，但可以将输入 `DStream` 中的每个项映射到零或多个输出。

    - `Reduce(function)`：根据可并行计算的关联函数对 `DStream` 中的元素进行聚合，并返回带有结果的新 `DStream`。

    - `Repartition (Number Of Partitions)`：减少或增加分区数量，从而更改 `DStream` 对象的并行操作。

    - `Union (Other DStream)`：返回包含源和其他 `DStreams` 中元素的 `DStream`。

    - `Filter(function)`：根据传递的参数过滤 `DStream` 中的项，并返回带有过滤后数据的 `DStream`。

    - `Join(other DStream, [number Of Tasks])`：从源 `DStream` 和格式为 `(key,value1)`, `(key,
    value2)` 的其他 `DStream` 返回格式为 `(key,(value1,value2))` 的 `DStream` 对象。

    - `Transform(function)`：将格式为 `RDD->RDD` 的应用于源 `DStream` 的每个元素。可以使用此转换执行任何 `RDD`
    操作。

    - `Count()`：返回一个一个 `RDD` 的 `DStream`，该 `RDD` 持有源 `DStream` 中元素的计数。从输入 `DStreams`
    开始，现在让我们查看输出 `DStreams` 的操作：


