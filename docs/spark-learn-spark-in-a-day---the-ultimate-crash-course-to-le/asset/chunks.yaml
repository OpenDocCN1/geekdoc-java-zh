    # Chapter 2: Time to Stop Worrying – Lets Play the Magic with Apache Spark


    The very first purpose for which Spark was used by Capital One was to generate
    product recommendations for 10 million products and 25 million users. This is
    one of the biggest sets of data for this modeling type. Furthermore, there was
    also the aim to put into consideration all the products possible including the
    products that were not always purchased by customers. This makes the issue more
    difficult as you will have 250e12 different combinations in order to achieve all
    the possible pairings of products and users. This information cannot be stored
    on a memory due to its size. It is thus important to learn how to configure Spark
    properly and utilize its API in a way that things won’t break. Spark allows you
    to work without really bothering about what happens at the background. You would
    however, need the knowledge of the background working to write functional and
    effective codes in Spark.


    ## The Pieces


    We are going to first review the major players in the infrastructure of Spark.
    While we won’t discuss every component, we will cover some of the basics. They
    include caching, shuffle, serialization and partitioning operation.


    ### Caching


    Caching is a component in Spark that can help to enhance performance. This is
    something very special to be utilized so if you have a frequently used data structure
    e.g. a lookup table. It could however be challenging if you have many caches as
    they always consume a large memory chunk.


    ### Shuffle


    You would need to move data around in some cases, even it is an expensive process.
    For instance, you might need to perform a certain operation that would require
    a single node consolidated data to make it possible to co-locate it in the memory.
    An example of this operation is a reduction operation on all values which are
    linked to a certain key using key-value RDD (reduce By Key()). This expensive
    data reorganization is called shuffle.


    ### Serialization


    In computing distribution, there is the need to evade the expensive back and forth
    data writing. The easiest way to achieve this is to be able to use different code
    on the same data which has led to using JVM on a lot of frameworks. The process
    of code translation to a format compressed ideally for transfer efficiency through
    the network is called Serialization.


    ###               Partitions


    Resilient Distributed Dataset also known as RDD is the basic abstraction of Spark.
    Complex operations such as groupBy or join are simplified through the RDD in Spark.
    This also covers the fragmented data that you are working with behind the scene.


    ## Lessons


    We will now discuss the combination of these components in writing a program in
    Spark:


    ### Lesson 1: Memory Spark Gorges


    One of the ability of Spark is memory caching. The disadvantage of memory caching
    is that it consumes a lot of memory. In the first instance, if you use YARN and
    JVM, they take up a good chunk of memory. This reduces significantly, the amount
    of memory you will have for other operation such as caching and movement of data.
    Furthermore, metadata could be a result of shuffle operations accrue on the driver
    which could lead to problems on jobs that run for a very long time. Lastly, overhead
    might also be introduced by Scala or Java classes in your RDDs. Up to 60 bytes
    can be consumed by a Java string that is 10-character long.


    It is therefore advisable to first of all tackle this issue. It is therefore important
    to apply wisdom in partitioning especially if you are a starter. This will help
    in memory management pressure and to make sure resource utilization is complete.
    Furthermore, you should always know the details of your data including types,
    size and distribution. This is to avoid the data being distributed in a skewed
    way. A custom partitioner can be used to solve this problem. Finally, as earlier
    mentioned, it is more efficient and faster to use Kryo serialization.'
