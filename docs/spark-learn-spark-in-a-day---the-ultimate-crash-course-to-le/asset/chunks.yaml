    ## Submitting Data Analysis Tasks in Spark


    We can submit an application in Spark, to run on a cluster and needs a cluster
    manager supporting Spark. There are vendors like Cloudera which provide cluster
    managers. For submitting an application, the `spark-submit` script in `bin` folder
    of Spark installation, is used. If there are any dependencies for the application,
    they should be bundled together in one package created as an assembly (also termed
    “uber”) jar before forwarding to clusters. The packaging can be done, using a
    build tool like `sbt` or `Maven`.


    ### Running Tasks with Spark-submit


    Once, packaged with dependencies, applications can be submitted using `spark-submit`.
    The additional parameters to the script, are passed in `--key value` format. Below
    is an example of using `spark-submit`.


    ![](images/00032.jpeg)


    [arguments-for-application]


    Let us see frequently used arguments with `spark-submit` refer to:


    - `Class`: The main class of your application.(such as `example.src.main.ApplicationMain`)

    - `Master`: Master URL (discussed in Chapter)

    - `Deploy mode`: The value of this could be either ‘cluster’ or ‘client’ which
    refers to where the driver should be deployed, either on worker nodes or locally.
    The default value of this option is `client` meaning to run as the external client.

    - `Conf`: Any other conofurations of Spark, specified in `key=value` format. If
    values have spaces within them, it should be wrapped within the quotes as `“key=value”`.

    - `Application-jar`: Location of the jar in which the application and and its
    dependencies have bundled. This location should be visible globally to the cluster.

    - `Arguments-for-application`: Arguments to be passed for `key` method of the
    main class of the application.


    ## Summary


    In this chapter, we discussed on two methods of running an Apache Spark application.
    We also saw with an example, how we can build, deploy Spark applications with
    a build tool like `sbt`. Apache Spark applications can be run on clusters, and
    we discussed how an application is submitted.


