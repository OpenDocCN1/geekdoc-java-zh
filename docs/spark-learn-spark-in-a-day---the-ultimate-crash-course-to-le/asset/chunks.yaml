    Distributed File System and has achieved improved performance over the existing,
    while providing added functionalities. With its functions implemented using Directed
    Acyclic Graphs, Spark enables to develop pipelines involving multiprocessing of
    the data. It shares the data across these data structures in-memory and allows
    to process the same set of data in parallel. Spark comes with utilities to develop
    applications including different types of data analysis and processing and hence
    comes as a comprehensive solution as illustrated in the next section.


