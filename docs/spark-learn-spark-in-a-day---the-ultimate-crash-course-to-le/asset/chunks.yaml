    # 第 12 章：借助 Spark SQL 处理结构化数据


    `Spark` 提供了一个更快速且通用的数据处理阶段。`Spark` 让你在内存中运行程序比 `Hadoop` 快 100 倍，或者在磁盘上快 10 倍。去年，`Spark`
    通过在十分分之一的机器数量上完成 100 字节的 Daytona GraySort 竞赛快 3 倍，接管了 `Hadoop`，这使其成为排序 PB 级数据的最大的开源引擎。


    学习如何使用 `Apache Spark` 的另一个重要方面是交互式 shell (`REPL`)，因为其提供了开箱即用的功能。通过 `REPL`，人们可以在不需要初始规则和执行整个任务的情况下测试每行代码的结果。因此，通向功能代码的路径短得多，而且即时数据检查变得可能。


    `Spark` 的其他主要功能包括：


    * 目前提供 `Java`、`Scala` 以及 `Python` 的 API，并在未来支持其他语言（例如 `R`）

    *完美集成 `Hadoop` 生态系统和数据源（`HDFS`、`Hive`、`Cassandra`、`HBase`、`Amazon S3` 等）

    * 可以运行在由 `Hadoop YARN` 或 `Apache Mesos` 管理的集群上，也可以独立运行


    `Spark` Core 由一组影响力的高级库平衡，这些库可以在相似的应用中完美使用。这些库目前包括 `SparkSQL`、`MLlib`、`Spark Streaming`
    以及 `GraphX`。新增的 `Spark` 库和扩展目前也在开发中。


    ## Apache Spark 的特性


    #### 让我们来看看 `Spark` 的某些在大数据世界中真正脱显的特性！


    #### 结合了流处理、SQL 和复合分析：除了简单的“map”和“reduce”操作外，`Spark` 开箱即支持 `SQL` 查询、流式数据以及复杂的分析（例如机器学习和图算法）。不仅如此，用户可以在独特的工作流中完美地整合所有这些能力。


    #### 易用性：`Spark` 让你用 `Scala`、`Java` 或 `Python` 快速编写应用程序。它帮助开发者在其熟悉的编程语言上生成并运行应用程序，并轻松构建等效应用。这得益于内置的超过
    80 多个高级算符。我们可以交互式地在 shell 中它查询数据。


    ## Spark Core


    `Spark Core` 是大规模等效及分布式数据处理的支持引擎。它负责：


    * 内存管理加故障恢复

    * 在集群上预测、分配和监控作业

    * 与存储空间系统交互


    `Spark` 引入了 `RDD` (`Resilient Dispersed Dataset`) 的概念，这是一种不可容错的分布式对象集合，可以在等效上进行操作。`RDD`
    可以包含任何类型的内容，由外部数据集加载或从驱动程序调度编译决定。


    ### RDD 支持两种类型的操作


    变换（Transformations）是操作（如 `map`、`join`、`union`、`filter` 等），在 `RDD` 上执行并产生一个新的 `RDD`。


    动作（Actions）是操作（如 `count`、`first`、`reduce` 等），在 `RDD` 上运行计算后返回一个值。


    `Spark` 中的变换是“惰性”的，这意味着它们不会立即计算结果。相反，它们会“记住”要执行的操作以及要处理的数据集。只有当调用动作时，变换才会实际计算并将结果返回给驱动程序。这些设计使得
    `Spark` 运行高效。例如，如果对一个大文件进行了多种方式修改并请求第一个结果，`Spark` 只会处理第一行，而不是处理整个文件。


    默认情况下，每个更改的 `RDD` 在每次运行动作时都会重新计算。不过，你也可以通过 `persist` 或 `cache` 技术在内存中保留 `RDD`，这将使
    `Spark` 在下次查询时保留该元素。


    ## SparkSQL


    `Spark SQL` 是 Spark 的组件，支持通过 `SQL` 或 `Hive` 查询语言查询数据。它起源于 `Apache Hive` 的移植，运行在
    `Spark`（而非 `Map Reduce`）之上，并已包含在 Spark 栈中。除了对多种数据源的支持，它还让 `SQL` 查询与代码转换相结合成为一种非常强大的工具。


    ## Spark Streaming


    `Spark Streaming` 支持流式数据的实时处理，例如网络服务器日志文件（如 `HDFS/S3`）、社交媒体（如 `Twitter`）以及各种消息队列（如
    `Kafka`）。在底层，`Spark stream` 接收输入数据流并将其划分为批。之后，由 `Spark` 引擎处理并生成批处理的最终结果流，如下。


    ## MLlib


    `MLlib` 是机器学习记录，提供了多种旨在处理分类、协作过滤、聚类、回归等的算法。`Apache Mahout` 现在已转离 `Map Reduce`
    并加入了 `Spark MLlib` 的行列。


    ## Spark 大数据框架强大的快速分析


    `Spark stream API` 与 `Spark Core` 紧密匹配，让程序员可以在批处理和流数据世界中轻松地工作。


