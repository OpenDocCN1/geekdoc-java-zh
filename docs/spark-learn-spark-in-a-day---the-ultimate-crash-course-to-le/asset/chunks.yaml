    # 第 3 章：在集群上安装 Apache Spark


    ## Spark 提供了一种基本的独立运行模式。你可以手动调度一个独立的批次，通过手动启动客户端和服务器，或者利用给定的启动/停止脚本。同样，也可以在单机上运行这些守护进程以进行测试。


    ## 在批次中安装独立 Spark


    要引入独立 Spark 模式，你基本上是将编译好的 Spark 版本放在批次中的每个节点上。你可以在每个发布版本获取预编译的 Spark 版本。


    ### 手动启动批次


    你可以通过执行以下命令启动一个独立的客户端服务器：


    ```

    ./sbin/begin client.sh

    ```


    一旦启动，客户端将打印出自己的 `flash://HOST:PORT` URL，你可以用它来连接服务器，或者将其作为 `SparkContext` 的“client”参数。你也可以在客户端的
    Web UI 上发现此 URL，理所当然是 `http://localhost:8080`。


    此外，你还可以通过以下方式启动一个或多个服务器并将它们加入客户端：


    ```bash

    ./sbin/begin server.sh <client-sparkle URL>

    ```


    当你启动了一个服务器站后，查看客户端的 Web UI（默认为 `http://localhost:8080`）。你应该能在那里看到记录的新节点，以及它的 CPU
    数量和内存（留出 1GB 给操作系统）。


    ### 批次级启动/停止脚本


    要使用启动/停止脚本启动/停止独立 Spark 批次，你需要在 Spark 根目录下创建一个名为 `conf/servers` 的文件，该文件必须包含你打算启动
    Spark 服务器的大量机器的主机名，每行一个。如果 `conf/servers` 不存在，调度脚本将默认为独立机器（`localhost`），这对于测试很有帮助。注意客户端机器通过
    `ssh` 访问每台服务器机器。当然，`ssh` 保持并行运行，并要求设置无密访问（使用私钥）。如果你没有设置无密访问，可以设置环境变量 `SPARK_SSH_FOREGROUND`
    并逐个为每个服务器提供密码。


    注意，这些脚本必须在你需要运行 Spark 的机器上执行，而不是在你的本地机器上执行。


    你也可以通过在 `conf/sparkle env.sh` 中设置环境变量来安排批次。通过从 `conf/sparkle env.template` 开始创建此文件，并将其复制到所有服务器机器以产生设置。请注意这些设置是可用的。


    ### 将应用程序关联批次


    要在批次上运行应用程序，基本上将客户端的 `flash://IP:PORT` URL 传递给 `SparkContext` 构造函数。


    要在批次上运行交互式 Spark shell，运行相应的：


    ```bash

    ./bin/sparkle shell - client flash://IP:PORT```


    你也可以传递 `- all cores <numCores>` 参数来控制 shell 使用的核心数。


    ## 启动 Spark 应用


    `spark-submit` 脚本提供了将 Spark 应用程序提交批次的最清晰方法。对于独立批次，Spark 目前支持两种运行模式。在客户端模式下，driver
    与提交应用程序的客户端在同一个进程中启动/停止。在提交模式下，driver 从批次内的一个 Worker 节点启动/停止，客户端程序在完成提交应用程序的任务后就会离开，无需等待应用程序完成。


    只是，如果你的应用程序是通过 `Spark submit` 启动的，那么应用程序 jar 会分发到所有节点。对于应用程序依赖的任何额外 jar，你应该通过
    `- jars` 参数使用逗号作为分隔符指定它们（例如 `- jars jar1,jar2`）。


    ## 资源管理


    独立组模式可以跨应用程序管理一个简单的 FIFO 调度器。它允许不同的客户端同时运行，尽管你可以控制每个应用程序将使用的最大资源。理所当然，它将获取批次中的所有核心，这在你只运行一个应用程序时非常好。你可以通过在
    `SparkConf` 中设置 `spark.cores.max` 来限制核心数量。


