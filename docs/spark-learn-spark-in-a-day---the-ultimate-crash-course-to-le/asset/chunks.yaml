    # Chapter 15: When Things Go Wrong – Get Help of Spark (Lambda Architecture)


    It can be very challenging to build a reliable, well-designed and functional application
    for big data that serves different requirements for end-user latency. It is already
    intimidating to keep pace with quickly changing innovations in technology. The
    challenge however increases as it is required to build software that would serve
    for the current problem. It is thus better to begin slowly and create software
    applications one on one, especially as a beginner. Many architectural data designs
    have also been built to allow beginners to be able to picture how different types
    of software work together in a big data structure. Some of the architectural designs
    and technologies as well as their functions have also been explained.


    Some of the major things you will need to construct the architecture are:


    *   Human errors and hardware failure fault-tolerance.

    *   Support and updates for different use cases including querying for low latency.

    *   Capabilities for linear scale-out which implies that the job could be done
    by adding more machines to solve the problem.

    *   Ability to extend to make it easy for new features to be easily added to the
    system.


    One of the major uses of Lambda architecture, therefore, is to solve human errors
    and hardware failures. The 3 major parts of Lambda architecture include batch
    layer, serving layer and speed layer. For example, the datasets for the batch
    layer could be in a file-system that is distributed. MapReduce on the other hand
    can be applied in creating views for batches which could be sent to the layer
    for serving. This chapter would discuss errors from big data companies that were
    solved through Lambda architecture or something similar to Lambda Architecture.


    ## Examples of Errors from Big Data Companies


    Many big data companies in the past have encountered problems in the past which
    led to a shutdown of their database. These big data companies include Facebook,
    Twitter, RBS and Google.


    ### Facebook

