    # Chapter 14: Let’s Build Lambda Architecture with the Help of Spark Streaming


    ## After designing a data concept’s proof ingest pipeline and implementing it,
    you would most likely make some observations. The observations would include liking
    the design and how validation of data is done as soon as they arrive. You might
    also like the fact that raw data can be stored for explorative analysis and the
    ability to give aggregates that are pre-computed to business analysts which will
    result to response times that would be faster. You would also admire the fact
    that data can be handled automatically even when they arrive late and that the
    data algorithms and structures would be automatically changed. You might however
    wish that a component that is real-time is available to eliminate the delay of
    about one hour that occurs after data is received before it is accessible on the
    dashboards. The major reason for the one hour delay is so that unclean data can
    be filtered out which would lead to the efficiency of the system being improved.
    There are however, some cases whereby you would prefer to have new data the moment
    they come in, clean or unclean so that you can respond to them as soon as possible.
    You might thus want to include a component for real-time so that it would be easier
    to impress your users.


    The solution to the one hour delay problem is a feature known as lambda architecture.
    The feature puts together the real-time and batch components. You would need the
    2 components due to the fact that real time data arrival always contains fundamental
    problems. You do not have the assurance that an individual event will be received
    all at once. Furthermore, the data could have double that would be a sort of distraction
    for the data. There is also the probability that due to server instability or
    network, problems might arise as a result of a data arriving late. Experts came
    up with a solution, whereby you are able to get your fast and probably unreliable
    data immediately, while the slow and reliable one arrives later.


    ## Why You Should Use Spark?


    There is a cost that comes with using the Lambda Architecture approach. The same
    logic of business would have to be implemented and maintained on two systems that
    are different. Using Apache Storm to implement your system that is real time and
    Apache Pig or Apache Hive to implement batch system will result in re-writing
    related aggregates in Java and in SQL. The situation could however lead to a maintenance
    nightmare very quickly as noted by some experts.


    If you want to use Lambda Architecture however, it would be advisable to use Apache
    Spark. This is because if the system had been developed with Storm, you would
    have to do a re-implementation of the whole logical aggregation with storm.


    Spark is famous as a structure that can be used to learn machine. It is however
    quite capable of also undertaking ETL tasks. The APIs for spark can be used easily
    and they are clean. You can easily read them, and when compared to MapReduce,
    they have lower boilerplace code. You can also quickly do a logic prototyping
    quickly using the REPL interface with business operators. This leads to a faster
    execution of the system when compared with MapReduce.'
