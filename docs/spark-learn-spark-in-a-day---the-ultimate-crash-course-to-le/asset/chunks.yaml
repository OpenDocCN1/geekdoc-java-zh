    事实上，它是一个可靠的分布表（实际上 `RDD` 包含一个任意集合，但最好对关系表中的元组进行操作）。`RDD` 可以是完全虚拟的，只需要知道它是如何生成的，例如在节点发生故障时如何恢复。它也可能是物化的——即在内存或磁盘上进行分布（或者在磁盘上置换的内存中）。此外，`RDD`
    内部被划分为多个分区（partitions）——这是 `RDD` 的最小单元，将由每个工作单元进行处理。


    所有的趣味都发生在 Spark 中，通过 `RDD` 的操作实现。任何 Spark 应用开发通常都有一个标准的结构——创建 `RDD`（例如从 HDFS 提取数据）、对其操作（`map`、`reduce`、`join`、`groupBy`、`aggregate`、`reduce`
    等）以及对结果进行处理——例如写回 HDFS。


    这种理解的基础应该是将 Spark 视为一个用于复杂分析任务的并行环境，特别是当存在一个协调任务的主节点（master）以及许多参与执行的运行单元时。


    ## 入门：如何在 Yarn 上启动 Spark


    首先，必须确保 `YARN – CONF – DIR` 或 `HADOOP – CONF – DIR` 指向所需的目录，该目录存储了后续 Hadoop 集群所需的配置文件。这些配置将用于将
    Apache Spark 写入 HDFS，并建立与资源管理器 `YARN` 的直接连接。此目录的配置将被分发到整个集群中，这是因为位于应用边界内的所有容器（containers）也会使用这些配置。所有引用
    Java 环境变量的配置也需要在 Apache Spark 中设置，以确保其正确使用。


    此外，`YARN` 使用两种不同的部署模式在其上面加载 Spark 应用。第一种是 YARN 集群模式（cluster mode），它为 Spark 驱动提供了在
    YARN 管理的集群应用运行的可能性，因此一旦应用进程初始化完成，客户端就可以离开。第二种是 Mesos 模式，它将主节点地址作为参数。因此，YARN 模式和
    Mesos 模式之间存在差异，因为前者来源于 Hadoop 的配置。以下是加载集群模式 YARN 的程序代码：


    ![](img/00006.jpeg)


    更多示例：


    ![](img/00007.jpeg)


    程序代码开始运行默认的应用程序主节点（Application-Master），它是 Apache Spark 的组件之一。加载完成后，AM 会作为子线程运行
    `SparkPi`。传统上，客户端状态会定期更新，控制台会显示结果。此外，如果客户端退出会话，应用将结束。当你需要以 Yarn Client 模式启动 Spark
    时，也必须执行相同的操作。不过，不要忘记将 yarn cluster 切换为 yarn client。因此，如果你想启动它，只需运行此代码：


    ![](img/00008.jpeg)


    ## 使用额外的 JAR 包完成任务


    如上所述，Apache Spark 有 2 种模式，让我们谈谈第一种，即 YARN 集群模式。在这种模式下，客户端和驱动（driver）运行在不同的机器上，因此名为
    `SparkContext.addJar` 的 jar 包之一将无法启动，因为它没有存储在客户端本地仓库的本地文件中。因此，为了解决这个问题，你应该将此 jar
    文件添加到仓库中供客户端使用，并包含 `--jars` 选项：


    ![](img/00009.jpeg)


    执行此命令后，`SparkContext.addJar` 将加载到客户端侧


    ## 在此之前更好的做法


    如果你想在 Yarn 上运行 Spark —— 最好预先安装支持 YARN 的二进制发行版 Spark。该包也可以从 Spark 官方网站下载。


    ## 安装与配置


    当完成上述所有操作后，下一步是配置 Apache Spark。对于 YARN Spark 来说，许多配置是相似的，因此安装此软件并不困难。但，最好浏览 Spark
    网站上的配置页面，以查找有关配置的额外信息。请注意，所有这些配置仅适用于 Spark 的 YARN 版本。


    ## 应用调试


    有一些特殊的定义，告诉我们应用所有的应用程序主节点（application masters）和执行器（executors）都运行在“容器”（containers）中。此外，我们已经知道
    YARN 用于处理容器日志的两种不同部署模式。如果你开启了日志聚合（aggregation log），所有容器日志将被复制到 HDFS，然后从本地机器删除。以下是此类命令的示例：


    ![](img/00010.jpeg)


    该命令将显示应用中使用的所有容器的日志文件。此外，你还可以查看 HDFS 中的日志文件，或使用 API 或 HDFS Shell。若要查找保存配置的本地目录，只需查看
    `config-name` 路径。


    另一种方案是禁用日志聚合。在这种情况下，所有日志都保存在本地机器的 `YARN APP (LOGS – DIR)` 下，即通常的临时日志目录 tmp-logs。然而，这取决于
    Hadoop 的版本和你的安装偏好。因此，若要查看容器日志，你应该进入这些日志所在的 localhost 并在给定目录下查看。你应该注意到，日志按容器 ID
    或应用 ID 组织在子目录中。


    有一个功能可以查看每个容器的启动情况。由于进程延迟非常小，你应该将此属性改为较大的值。但这不是终点：你应该通过 `yarn – node_manager –
    local.dirs` 访问应用缓存。这在需要调试问题时非常有用。但不要忘记，你必须拥有管理员权限才能操作。


    如果你想使用自定义的 log4j 配置，为你提供了两种后续方案：


    *   上传自定义属性。如果你选择此选项，应在用 `spark_submit` 时上传 log4j 属性，然后通过 `--files` 添加到文件列表中。

    *   在日志中添加新属性。你应该在 `spark.executor.extraOptions`（针对执行器）或 `spark.driver.extraOptions`（针对驱动）中更改
    `-Dlog4j.configuration=<配置文件路径>`。此外，你应该注意，你必须显式提供文件协议，文件将自动存在所有本地机器上。


    有时，你需要获取将日志放入 YARN 的正确位置引用，YARN 已经为你提供了选项。只需执行这些命令：


    ![](img/00011.jpeg)


    如果你想流化应用，只需配置 `RollingFileAppender`，但解决的主要问题是磁盘溢出，因此最好清理不需要的缓存和文件。


    有很多 Spark 属性可以在未来使用。如果你想了解更多信息，只需浏览 Spark 官方网站并找到 Spark 属性页面。你会找到相关信息，包括属性名称、默认值以及该属性功能的描述。


    ## Apache Spark 的扩展


    *   `SparkSQL`: Spark 之上的 SQL 引擎。正如我们之前所见，Spark 几乎包含了所需的一切，除了存储、索引及其统计信息。这严重阻碍了优化，但
    `SparkSQL` 团队声称正在建立一个新的优化框架，同时 `AMP LAB`（诞生 Spark 的实验室）也不会放弃 `Shark` 项目 —— 完全替代
    Apache HIVE

