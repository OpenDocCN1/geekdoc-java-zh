    Spark 是构建在 HDFS 之上的，现有的 Hadoop 设置可以轻松与 Spark 合并共同工作。

    - 我们讨论了 Apache Spark 架构的各种组件，并看到它不仅为 MapReduce，还为其他机器学习和数据处理任务提供了全面的解决方案。随着框架的进一步扩展以提供更好的安全性以及对
    BI 工具的支持，Apache Spark 将成为大数据处理领域极具前景的解决方案。事实上，我们可以构建让 Spark、Kafka 和 Cassandra
    共同运行的系统。例如，在这样的系统中，Kafka 将流式传输输入数据，Spark 将执行必要的计算，而 Cassandra 可用于将结果存储在 NoSQL
    数据库中。


