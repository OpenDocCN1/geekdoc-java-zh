    如果你是运行集群的运维人员，唯一需要注意的区别在于代码部署或配置监控方面。


    ## Hadoop 不具备的 Apache Spark 原始特性


    当我们开始讨论决策时，最好注意 Spark 的一些非常具体的特性，这些特性可能帮助你决定哪个框架更适合你：Apache Spark 还是 Hadoop Mapreduce。因此，让我们来看看这个现代框架的许多卓越特性（此外，Apache
    Spark 官方网站也描述了许多特性）：


    ### 速度


    这确实是 Spark 的核心特性。它使应用程序在内存中的运行速度快 100 倍（!），即使在磁盘内存中启动，速度也快 10 倍。此外，Spark 具有一种减少磁盘读写次数的可能性。下一个特性是
    Spark 将这些中间处理数据存储在内存中。正如我们之前提到的，Apache Spark 使用弹性分布式数据集（`RDD`）技术，这可以帮助将数据透明地存储在内存中，完全不使用磁盘存储或仅在需要时使用它。它还有助于减少磁盘读写，因为数据处理是最耗时的部分。


    ### 易于学习


    Spark 为你提供了基于 `Java`、`Python` 和 `Scala` 开发应用程序的可能性。因此，现在运行和创建用熟悉的编程语言编写的应用程序更加舒适，构建并行应用程序也变得更加方便。此外，你还有一组框架包中内置的
    80 个高级操作符可用。


    ### 新旧特性的结合


    Apache Spark 的新版本除了简单的 `map/reduce` 之外，还有一些新特性。新特性包括 `SQL`、`streaming`（流）和复杂分析。此外，你可以将所有这些特性组合在单个工作流中。


    ### 随处运行


    Apache Spark 现在支持 `Hadoop`、`Mesos`、独立模式和云技术。


    ## 这些框架的应用领域


    ### Hadoop


    Hadoop 用于处理大数据和快速增长的数据，旨在处理非结构化数据。在使用它之前，你需要意识到它本身不能提供实时数据访问，在请求形成期间会处理整个数据数组数据。


    Hadoop 用于构建全球智能系统、机器学习、各种数据的关联分析、统计系统。Hadoop 本身不能作为操作数据库。通常，在企业环境中，Hadoop 与关系型数据库结合使用。为了消除框架的基本缺点，会使用额外的模块和外部应用程序。


    ### 内存数据库中的 Spark


    Spark 内存数据库是一种加速内存中数据的特殊分布式系统。与 `Hadoop` 集成并与 `Hadoop MapReduce` 提供的机制相比，Spark
    在内存中处理数据时提供了 100 倍的性能，将数据放在磁盘上时提供了 10 倍。该引擎可以在 `Hadoop`、`Hadoop YARN` 集群节点上运行，也可以单独运行。支持在存储
    `HDFS`、`HBase`、`Cassandra`、`Hive` 以及任何 Hadoop 输入格式（`InputFormat`）中处理数据。与 `MapReduce`
    不同，Spark 不在磁盘中存储中间结果（如果它们不是大到无法放入内存）。Spark 创建 `RDDs`（弹性分布式数据集），它们可以在内存中完全或部分存储和处理。`RDDs`
    没有固定格式。


    该系统定位为处理存储在集群 `Hadoop` 中的数据的快速工具。


    ## 总结


    在这里你获得了一些重要的提示，会让你的工作流程变得更容易更方便。不要忘记理解你后续行动的所有原因：如果你无法理解某些信息，最好重读之前的章节和标题。


    Spark 是超快速、现代且方便的工具，但它也基于 `Hadoop`，所以对你来说有什么新奇的吗？


    Spark 变得越来越流行。20% 使用 Spark 的实例运行在 `Cassandra` 上，42% 运行在 `Hadoop YARN` 上，26% 运行在
    `Apache Mesos` 上。但唯一的问题是很多人对 Spark 及其新的优秀技术一无所知。


    无疑，Hadoop 永远不会被完全取代，因为有很多老古董不会为了新事物而改变他们的框架，即使新事物快 100 倍且更好用。但 Spark 是海量存储技术的一个新时代。也许在
    4-5 年后，使用类似框架的实例将超过总实例的 50%。


    Spark 是大型复杂 `Hadoop` 生态系统的一个小组件，因此当新项目开始开启自己的“事业”时是正常行为。


    此外，Spark 的主要优势是它的简单性，因为现在开发者有更多工具来创建出色的应用程序，并且使用新 Apache 产品的友好用户界面可以更容易“插拔”工作。


    如果你从技术角度看问题——Spark 为用户提供了更多机会和极佳性能，因为有强大的执行器引擎。


    所以下面列出了 Spark 的所有优势：


    *   迭代且易的算法

    *   酷且用户友好的数据挖掘和处理

