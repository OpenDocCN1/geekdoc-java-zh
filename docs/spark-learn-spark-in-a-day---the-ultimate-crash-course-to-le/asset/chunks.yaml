    这些是行数应用程序所需的两个文件。要构建并运行该应用程序，请进入 `SparkLineCountApplication` 项目文件夹，运行以下命令。


    ```bash

    sbt package

    sbt run

    ```


    ## 在 Spark 中提交数据分析任务


    我们可以在 Spark 中提交应用程序以便在集群上运行，这需要一个支持 Spark 的集群管理器。像 Cloudera 这样的供应商提供了集群管理器。提交应用程序时，使用
    Spark 安装目录下 `bin` 文件夹中的 `spark-submit` 脚本。如果应用程序有任何依赖项，在转发到集群之前，应该将其打包成一个名为 assembly（也称为“uber”）的
    jar 包中。可以使用 `sbt` 或 `Maven` 等构建工具完成打包。


    ### 使用 Spark-submit 运行任务


    一旦使用依赖项打包，可以使用 `spark-submit` 提交应用程序。脚本的额外参数以 `--key value` 格式传递。以下是使用 `spark-submit`
    的示例。


    ![](img/00032.jpeg)


    [应用程序参数]


    让我们来看看 `spark-submit` 频繁使用的参数，如下：


    - `Class`: 应用程序的主类。（例如 `example.src.main.ApplicationMain`）

    - `Master`: 主节点 URL（在章节中讨论）

    - `Deploy mode`: 此值可以是‘cluster’或‘client’，取决于驱动程序应该部署在何处，是在工作节点上还是本地。该选项的默认值为 `client`，意味着作为外部客户端运行。

    - `Conf`: Spark 的任何其他配置，，以 `key=value` 格式指定。如果值内部包含空格，应封装在引号中，如 `“key=value”`。

    - `Application-jar`: 包含应用程序及其依赖项的 jar 包所在位置。该位置对集群全局应该是可见的。

    - `Arguments-for-application`: 传递给应用程序主类 `key` 方法的参数。


    ## 总结


    在本章中，我们讨论了运行 Apache Spark 应用程序的两种方法。我们通过示例查看了如何使用像 `sbt` 这样的构建工具来构建和部署 Spark 应用程序。Apache
    Spark 可以在集群上运行，我们讨论了如何提交应用程序。


