    的应用程序的默认值更改为非无限大的数值。通过向 `conf/sparkle env.sh` 中添加相应的配置来实现。


    这对于共享组非常有价值，因为在这些组中客户端可能无法独占最大数量的资源。


    ## 监控与日志


    Sparkle 的独立模式提供了一个电子客户端界面来监控集群。`Client` 和每个执行器都有自己特定的 Web UI，用于显示集群和作业测量。理所当然地，你可以通过端口
    `8080` 访问 `Client` 的 Web UI。该端口可以在配置文件中更改，也可以通过命令行选项进行更改。


    此外，每个作业的详细日志输出还会汇集到每个服务器节点的工作目录（默认为 `SPARK HOME/work`）。你会为每个作业看到两个文件，`stdout`
    和 `stderr`，其中包含了其写入控制台的所有结果输出。


    ## 在 Hadoop 上执行


    你只需通过在相同的机器上作为不同的服务启动 Spark，就可以在你当前的 Hadoop 集群附近执行它。要从 Spark 获取 Hadoop 信息，只需利用
    `hdfs://URL`（通常为 `hdfs://<namenode>:9000/way`，不过你也可以在你的 Hadoop Namenode 的 Web
    UI 上找到权限 URL）。另一方面，你可以为 Spark 设置一个不同的集群，并仍然让它通过系统访问 HDFS；这会比本地访问慢，但如果你运行在同一个区域内（例如，你在每个运行
    Hadoop 的机架上放置了几个 Spark 机器），则可能不需要担心。


    ## 为网络安全设计端口


    Spark 大量利用系统资源，在某些情况下对使用严格的防火墙设置有严格的先决条件。要获得设计端口列表，你必须了解其安全措施。


    ## 高可用性


    理所当然地，独立调度集群对 Worker 故障具有容错性（因为 Spark 本身可以通过移动任务到不同的执行器来防止任务丢失）。另一方面，调度器利用 `Client`
    来决定调度选择，这（理所当然地）导致了单点故障：如果 `Client` 崩溃，将无法创建新的应用程序。考虑到绕过此点的目标，我们提供了两种高可用方案，详细说明如下。


    ### 使用 ZooKeeper 的额外客户端系统


    使用 `ZooKeeper` 进行主备选举和状态存储，你可以在集群中启动与相同 `ZooKeeper` 实例关联的不同 `Clients`。其中一个会被选为“主节点”，其他的将保持备用模式。如果当前主节点失效，另一个
    `Client` 将被选中，恢复旧 `Client` 的状态，然后恢复调度。整个恢复过程（从第一个主节点宕机开始）大约需要 1 到 2 分钟。注意，这种延迟仅影响新应用程序的调度——在
    `Client` 故障转移期间运行的应用程序不受影响。


    在你设置好 `ZooKeeper` 集群后，启用高可用性就非常简单。基本上只需在不同的节点上启动具有相同 `ZooKeeper` 配置（ZooKeeper
    URL 和目录）的多个 `Client` 进程即可。可以根据需要添加或移除专家。


    考虑到调度新应用程序或向集群中添加 Worker 的目标，它们必须知道当前主节点的 IP 位置。这通过进入你以前输入单个客户端的 Clients 列表就可以轻松实现。例如，你可以在启动
    `SparkContext` 时指定 `sparkle://host1:port1,host2:port2`。这将使你的 `SparkContext` 尝试向两个
    `Clients` 注册——如果 `host1` 宕机，此设计目前是正确的，我们将找到新的主节点 `host2`。


    “注册 Client”与典型操作之间有一个关键的区别。在启动时，应用程序或 Worker 应该具备发现并与当前主 `Client` 注册的能力。然而，当它成功注册后，它就“在框架内”（即存储在
    ZooKeeper 中）。如果发生故障转移，新的主节点将联系所有先先注册的应用程序和 Worker，告知它们权限发生了变更，因此它们在启动时甚至不需要知道新
    `Client` 的存在。


    由于这种属性，可以随时创建新的 `Clients`，你主要关注的是当它成为主节点时，新的应用程序和 Worker 能够发现并进行注册。


