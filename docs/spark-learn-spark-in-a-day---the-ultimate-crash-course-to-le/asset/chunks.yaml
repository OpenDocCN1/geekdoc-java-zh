    # 第 11 章：Spark GraphX 及其重要性


    图的使用在每个领域都变得非常重要。无论是定向广告还是社交网络，图都已成为强制性。尽管对图的需求巨大，但很难找到运行高效的工具。这就是为什么图计算任务变得令人乏味且难以维护。对于开发者来说，这只是负担的另一个代名词。这种必要性促使
    Spark 启动了 GraphX。它是处理极其艰巨任务的最佳工具之一。


    Spark 从其旅程开始就证明了它的高效性。Spark GraphX 只是其效率的另一个证明。GraphX 是 Spark 针对社交网络和网页图等图的新 API。对于协同过滤和
    Page Rank 等图并行计算来说也极其重要。GraphX 通过简单地启动弹性分布式属性图（Resilient Distributed Property
    Graph），在极高层面提取了 Spark `RDD` 抽象。弹性分布式属性图表示一个每个边和顶点都附有属性的有向多幅图。GraphX 暴露了一些基础算符，如
    `mapReduce Triplets`、`joinVertics` 和 `subgraph`，以及优化过的 `Pergel API` ，以加强图计算。Graphx
    还包含了一系列卓越的图构建器和算法。GraphX 能够胜任预期的任何可能任务。它将像既往一样为你提供卓越的速度、效率和性能。简而言之，它是一个真正服务于目的完整包。


