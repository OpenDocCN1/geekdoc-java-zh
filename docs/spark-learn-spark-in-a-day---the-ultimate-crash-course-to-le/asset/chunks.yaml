    # Chapter 1: Ignite Solutions with Apache Spark – An Introduction


    Millions and millions of people are communicating through massively connected
    networks, generating vast amounts of data daily. With the advancement of technologies,
    researchers can now extract a huge amount of sample data within a few hours. These
    kind of applications leave us with one major concern. How we are supposed to process
    and analyse such a vast amount of large-scale data and co-op up with their speed
    to provide better and faster solutions?


    In this chapter, let us get introduced to Apache Spark: an open source framework
    for big data analysis, look upon what features it comes with and install and perform
    a simple analysis with the framework as an example.


    ## How Spark Ignited

    Originated in the AMP lab of the University of California, Berkley in 2009 and
    merged with Apache projects in a year later, Apache Spark emerged as a fast and
    convenient solution to perform complex analysis of large-scale data. A significant
    advantage of Apache Spark over already existing technologies like Hadoop and Storm
    is that it comes as a complete solution to analyze data coming from different
    sources like real time or batch processing in various formats such as images,
    texts, graphs, etc. We will be comparing it with Hadoop: an already existing solution
    for Mapreduce later in this chapter.


    Not only MapReduce procedures, Spark framework comes with tools for machine learning,
    data streaming, processing graph data and also running SQL queries. These functions
    can be either performed individually or combined to be run in a pipeline, according
    to user requirement.


    Some of the eye catching features of Apache Spark are that it enables users to
    query data easily with its inbuilt set of high level operators which is over 80
    in number and allows programming in Java, Python or Scala. It can also speed up
    an application running in a Hadoop cluster in 100 times in-memory and 10 times
    on disk.


    Next, Let us see more details about interesting features Spark brings to the users.


    ## Apache Spark Support for Large-scale Data Analysis

    Compared to existing technologies, Spark significantly speeds up the analysis
    and generates results in real time while effectively storing data in-memory. Spark
    can perform both in-memory and on-disk and hence will effectively handle the cases
    of where in-memory is insufficient to handle complete data set or they do not
    fit in the. Execution in-memory or on-disk can be adjusted according to your application
    requirements. Since Spark performs many operations, keeping intermediate results
    in-memory, it enables to achieve improved performance if you are constantly using
    the same set of data.


    Spark was originally written in Scala language and runs inside a Java Virtual
    Machine (`JVM`). A command line tool is available for Scala and Python and it
    provides programming interfaces in Scala, Java and Python. In addition to these
    three languages, applications running with Spark framework can be also implemented
    in R and Clojure.


    ## Comparison with Hadoop

    As far as big data analysis is considered, Hadoop has been a promising solution
    for over a decade. With its added features and optimizations, Apache Spark comes
    as a promising alternative for HadoopMapReduce.


    Hadoop would be a perfect for a solution including sequential data processing,
    where each step would consist of a Map and a Reduce function with a single pass
    over the input. But for certain applications involving several passes over the
    input, it comes with the cost of maintaining the MapReduce operations at each
    step of the computation. This workflow of Hadoop MapReduce requires constant writing
    to and reading from the cluster memories and may significantly slow down the system
    with added time taken for these memory operations. Some other considerations which
    make using Hadoop painful are the complexity of configuring and maintaining the
    clusters and integration of different third party tools based on what the application
    includes, whether it includes machine learning or processing of streamed data,
    etc.


