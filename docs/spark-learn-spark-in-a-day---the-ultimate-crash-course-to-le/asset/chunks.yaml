    2010 年 9 月 23 日，Facebook 离线了近 2.5 小时，他们将此故障解释为对错误条件的处理不当。导致该错误的真实原因是：一个自动验证配置的系统产生的问题比它解决的问题还要多。用通俗的话说，实际发生的情况是：自动系统会检查无效的配置值。一旦发现任何无效值，它就会从持久化存储中自动提取一个有效的配置值进行替换。然而，只要持久化存储是有效的，系统就能一直完美运行。但是，当持久化存储失效时，系统将无法获取有效值来替换无效的配置值。这就是导致
    FacebookFacebook 离线的错误原因。为了解决这个问题，他们必须重启整个 Facebook 网站站点，这意味着他们必须回溯上一个可靠的数据批。


    ### Twitter

    Twitter 在 2012 年 6 月 21 日遭遇了类似的命运。在这一特定天，Twitter 崩溃了，网站完全无法向用户显示任何内容。导致这一任务的问题被称为“级联故障”（cascaded
    bug）。实际发生的情况是：一组字符发生了故障，并且像波浪效应一样，故障字符开始影响其他也发生故障的字符。这就是为什么它被称为级联故障，意味着一个故障影响了一个功能部分并使其产生故障。这组新的故障字符又影响了另一个功能部分，直到整个系统崩溃。整个事件的讽刺之处在于，Twitter
    的新总部就在 2 天前刚刚举办了一场工程可靠性开放日。为了也解决这个问题，Twitter 网站被回滚到了上一个稳定的网站版本。


    ### RBS

    2012 年 6 月，RBS 也因为升级过程导致了技术故障。该银行声称，该错误为公司造成了约 1.25 亿英镑的损失。故障影响了他们的超过百万客户，持续了一整一周。在问题被识别并纠正后，仍需要在复杂的自动化批处理环境中进行人工干预。这导致了大量的每日数据积压和信息处理压力。然而，如果初始软件使用了
    Lambda 架构，这个问题本可以更容易解决。人工干预将是不必要的，或者程度会降到最低，因为他们可以立即回滚到最新的稳定版本。这进一步导致该机构报告该季度总损失达
    15 亿英镑。


    ### Google

    2014 年 1 月 24 日，Google 及其所有其他站点（包括 Gmail、文档、日历和 Google+）无法访问约 25 分钟。对于其他一些用户来说，他们在大约
    55 分钟后才能访问任何 Google 服务。该问题是由一个负责向其他系统发送操作指令的系统软件漏洞引起的。该漏洞导致系统在约 15 分钟内向其他系统发送了错误消息。这些错误信息导致用户的数据请求被忽略，从而引发了错误。这些的影响从上午
    11 点约 2 分钟后开始出现。原始错误随后被移除，现在开始生成正确的消息，直到影响开始消退，Google 服务得以恢复。Lambda 架构也可以在发现故障后立即恢复
    Google 服务起到类似的作用。


    ## Lambda 架构与大数据错误的解决

    Lambda 架构的构建本质上是为了接受硬件将会发生故障的现实，为了接受这一点，它必须通过软件来解决它。当我们观察一个平台时，我们拥有一个可以扩展的平台；我们通过软件在平台中内置了容错机制。但当你开发要在该平台上运行的软件时，会发生什么呢？数据库的更新可能会导致部分数据库被误删。Lambda
    架构的开发是为了通过引入“人工容错”来修复这类问题。因此，随着系统变得越来越复杂，你需要理解错误是避免的，这是不可避免的，所以你必须处理它。你必须建立相应的措施，以便在不小心删除了重要内容或发生错误时，不至于承受巨大的压力。


    这就是容错发挥用场的地方。正如之前讨论的，即使是大公司有时也会出现灾难性的错误，并且必须尽快解决。Lambda 架构的概念并不新鲜，它只是最近才被记录下来。所以整个概念其实一直存在，但
    Nathan Marz 出现并非常简洁地写下了它。他对其进行了阐明，给它命名，并提供了一个几乎任何人都能轻松理解并实现的东西。他创建了 Storm，这在容错方面非常有意义。他那时的经历以及加入
    Twitter 后的经历，让他真正理解并吸收了我们必须防止硬件故障和人为错误。所以，当你发布了错误的配置文件后，如何恢复？你在企业级应用平台和支持运营中需要的是确保你对这种情况以及低频发情况都有支持。你可以构建低延迟、OLAP
    或 OLTP 的 Lambda 架构。你必须构建关系型数据库，在某些位置放置索引，以支持某些类型查询的创建方式。


    会有数据进入你的 Lambda 架构以及你的批处理层。你还需要向数据库添加更新。此外，你还需要决定想保留数据多久，也许是 7 年。然后你必须在批处理层中构建一个可靠的、分布式的数据集。你构建的方式还需要支持数据使用的低延迟，以及点击事件的历史记录。你也可以为数据库建立数据流。Lambda
    架构的主要因素是，每当你遇到漏洞时，你都可以进入批处理侧修复漏洞。你还可以重建所有受影响的损坏记录。它为企业提供了一种从故障中恢复、从漏洞中恢复的方法，并保护你免受沿途中可能遇到的所有烦恼。


    例如，如果你有飞行数据，你有一个存储在批处理层中的不可变数据集。随着时间的推移，你会添加发生的不同事件，起飞、降落等。你的数据会随着日期的增长而增长，你对此做好了准备。你可以理解所有这些不同的扩展实践。但你将能够在这里开始构建你关心的查询并提问。例如，现在有多少架飞机在空中？每家航空公司有多少架飞机在空中？每个机场停机坪上目前停了多少架飞机？这些都是简单的问题。然而，这些简单的问题属于两类之一：你可以有批处理，也可以流处理。


    ### Spark 的作用


    '
- fmt: '

    There are a lot of different technologies that would fit on this stack and they
    could follow different places. Some of these components, they can meet the needs
    in layers. It is however, a good point for you to understand what technologies
    are out there. So you need to have a way to store historic data, generate queries,
    view the data and support streaming. You also need to have a reliable batch stream
    that you can use to fix errors and bugs. To achieve this, you can use platforms
    such as `Kafka`, `Storm` and `HBase` amongst others. You might see it as a lot
    of technology to learn and use. However, this is just showing you how to protect
    yourself from yourself. So, if you take it at that, you can now say that you can
    throw `Spark` in here. But you have reasons why you don’t want `Spark` in certain
    places or maybe those reasons why you want `spark` in other situations and no
    other technologies. You might have a whole bunch of legacy codes that were written
    2 to 3 years ago, sitting at your data center, running operations and you don’t
    want to go through the effort to replace it. This is one of the advantages of
    `Spark`. So, when you look at these technologies in an integrated approach, there
    is a soft authority out there, twitter released something, there is a project
    called `lamp dupe` that has not delivered only lambda architecture but its working
    towards that. And it also patches `spark`. A patched `spark`, fundamentally delivers
    all of the pieces necessary to satisfy the lambda architecture. So, hopefully,
    to take away from most people here is you can implement the lambda architecture,
    simply, with `spark`.


    ### Is Spark Going to Be Every Single Facet of Your Lambda Implementation?


    Maybe or maybe not! It doesn’t dictate that, it just happens to have all the pieces
    necessary for you to sprout your used cases. You can generate views of `spark
    sequel` and you can sprout the speed layer with `spark streaming` as you have
    the `spark` to execution engine. Now from `MapR` perspective, you can actually
    have a customer in Cisco who who has effectively implemented lambda architecture
    with `Spark`. You can thus use them for security analysis and other security related
    stuffs. Now again, the benefits of this technology stack, this architecture is
    to save you panics.


    ## Summary


    Database systems are prone to errors, especially as they get larger. These errors
    are costly to deal with, in most cases when they occur for a very few minutes.
    These errors could be worse off when provisions are not made for errors and how
    to fix it. With Lambda architecture, it is easy and fast to fix errors. The Lambda
    architecture allows you to quickly reverse to the last stable version of your
    system and continue from there.


    Lambda Architecture can be achieved with `Spark`.


