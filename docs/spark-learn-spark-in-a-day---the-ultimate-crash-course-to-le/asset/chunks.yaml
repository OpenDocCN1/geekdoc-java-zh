    Spark 大数据分布式计算框架通常受到数据工程师的关注，然而到目前为止，这种关注主要局限于其需求所在的地方。不过，用户表示它有一个核心特性，能够帮助它赢得更广泛的需求。


    企业正逐渐转向操作趋于简单的自服务分析类应用程序。易用性自然被视为全范围内采纳的主要因素之一。


    虽然在后端运行 Spark 集群可能需要深厚的技术技能，但在前端，开源技能相对容易掌握。Apache Spark 自带一个 `Spark SQL` 库，为用户提供了工具使用
    `SQL`、`Java` 以及 `R` 分析语言对多样化的数据存储进行查询。此外，开发者还可以使用这些工具创建运行在 Spark 之上的更基础的前端应用程序。


    ## 深度解析 Spark SQL Catalyst 优化器


    `Spark SQL` 是 Spark 中最新且参与最密的机制之一。它驱动了 SQL 查询和新颖 DataFrame API。`Spark SQL` 的核心是
    Catalyst 优化器，它通过新颖的方法利用优秀的编程语言特性来构建可扩展的查询优化器。


    与 `R` 或 `Python` 中备受评估的数据帧不同，Spark 中的 Data Frames 的实现由查询优化器进行机械化优化。在对 DataFrame
    进行任何计算开始之前，Catalyst 优化器会将用于构建 DataFrame 的操作编译成用于执行的物理计划。由于优化器理解操作的语义和数据的结构，因此它可以做出智能决策以加速计算。


    在高级层次，有两种优化方式。首先，Catalyst 应用了逻辑优化，例如谓词下推（predicate push down）。优化器可以将过滤谓词下推到数据源中，使得物理实现能够跳过无关数据。在
    `Parquet` 文件的情况下，可以跳过整个块，并通过字典编码将字符串比较转换为更廉价的整数比较。在关系数据库的情况下，谓词被下推到外部数据库以减少数据流量量。


    其次，Catalyst 将操作编译成用于执行的物理策略，并为这些策略生成 JVM 字节码，这通常比手写代码更经过优化。例如，它可以智能地在广播连接（broadcast
    joins）和洗牌连接（shuffle joins）之间做出决策以减少网络流量。它还可能执行低级优化，例如消除昂贵的对象分配和删除虚拟函数调用。因此，我们预计当
    Spark 程序迁移到 Data Frames 时，性能将得到提升。


    ## 总结


    Apache Spark 是一个用于大规模数据处理的快速通用引擎。它支持在数据集或流数据上日益增加的自定义分析处理应用程序。由于它具有在内存中缓存中间结果并调度计算
    DAG 的能力，Spark 程序的运行速度可以比相应的 Hadoop Map Reduce 任务快 `100 倍`。Spark 应用易扩展、并行、快速且对故障具有韧性，此外它们可以在来自内存集合、本地文件、Hadoop
    兼容文件系统或多种流源的统计数据上操作。Spark 还包含了分布式机器学习和图算法的库。


    ## 作业


    ### 练习 1


    1. 在 Spark 中编写一个独立的应用程序，统计常规流中的单词数。

    2. 扩展代码以对过去 30 秒的统计进行词频，并每 10 秒重复一次计算。


    ### 练习 2


    1. 为流中的所有终端维护一个持续更新的词频。


    # 第 13 章：使用 Apache Spark 处理大“流”数据


    ## 我们如何检测从安装在发电厂内用于测量温度变化的嵌入式设备传输的传感器数据流故障？在 Twitter 等社交媒体上，视频变得比单一文本帖子更流行，我们如何利用这些流数据进行市场分析？显而易见，我们使用的流数据量正在增加，Apache
    Spark Streaming 作为 Spark 核心的扩展，作为一种处理大规模流数据的有力工具出现。在本章中，我们将介绍涉及的基础知识，并查看使用 Spark
    的日志分析器示例。


    ## 流数据分析


    流数据处理流水线包含三个主要步骤：


    1. **数据摄取 (Ingesting Data)**：流数据在处理之前应该被接收并缓冲。数据可能来自 `Twitter`、`Kaffka` 或 `TCPSockets`
    等源。

    2. **数据处理 (Processing Data)**：应该对捕获的数据进行清洗，提取必要信息并转换为结果。Spark 支持的算法可以有效用于这一步的机器学习和图处理等复杂任务。

    3. **数据存储 (Storing Data)**：生成的结果数据应被存储以便消费。数据存储系统可以是数据库、文件系统（如 `HDFS`）甚至是仪表板。


    ## 开发与部署考虑


    在进入 SparkStreaming API 细节之前，让我们先看看它的依赖链接和 `StreamingContextAPI`，这是任何 SparkStreaming
    应用程序的入口点。


    ### 链接 Spark Streaming


    Spark 和 Spark Streaming 都可以从 Maven 仓库导入。在编写任何 Spark Streaming 应用程序之前，应该在 Maven
    项目中按如下配置依赖。


    ![](img/00044.jpeg)


    或者，对于 `sbt` 如下。


    ```

    libraryDependencies += "org.apache.spark" % "spark-streaming_2.12" % "1.3.1"

    ```


    如果应用程序将从 `Kafka`、`twitter` 等外部源读取输入，则应相应添加处理数据接收和缓冲的相关库。


    ### Streaming Context 对象


    任何 Spark Streaming 应用程序的第一步都是从 `SparkConf` 对象初始化一个 `StreamingContext` 对象。


    一旦初始化，应用程序的正常流程将是：


    1. 创建输入 `DStreams` 以定义输入源。

    2. 在 `DStream` 上应用转换和输出操作，以定义必要的计算。

    3. 通过在初始化的 `StreamingContext` 对象上调用 `start()` 方法接收并处理数据。

    4. 等待处理由于错误结束或通过在初始化的 `StreamingContext` 对象上调用 `stop()` 函数结束。这种等待通过在同一对象上调用 `awaitTermination`
    函数完成。


