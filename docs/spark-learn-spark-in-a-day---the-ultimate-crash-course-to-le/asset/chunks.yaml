    # 第 4 章：对于 Apache Spark，Scala 比 Python 更好吗？


    随着你对 Spark 使用的深入，你将需要配置 Spark 并使用其 API。为了能够对 Spark 进行后台更改，你需要 Scala、Python 或是结合
    Scala 和 Python 的知识来实现这一目标。然而，如果你决定选择其中一种，本文将尝试讨论 Scala 相比 Python 的优势以及反之。但学习哪一个或先学习哪一个最终选择权取决于你，因为两者都可以很好工作。然而，没有哪一个比另一个完全方便。这完全取决于用户他/她对哪一个更熟悉。因此，本章将讨论通用编程特性，并解释
