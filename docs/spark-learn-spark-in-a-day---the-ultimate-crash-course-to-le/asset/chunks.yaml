    \ 完成类路径配置：\n\n```bash\n/bin/spark-shell --other_options_as_key_value --driver-class-path\
    \ path_to_the_library\n```\n\n## REPL 与编译的权衡\n\n正如我们上面所看到的，我们可以进行许多数据分析，而无需编译代码，也不需要使用\
    \ maven 或 sbt 等构建工具。那么，我们如何决定何时使用哪一个呢？\n\n大多数情况下，Spark REPL 足够从头运行你的整个应用程序。它提供了更快的执行速度、快速的响应，并能够快速构建原型。然而，随着应用程序规模和复杂性的增加以及代码序列变得巨大，执行时间可能会增加。此外，如果你正在处理大量数据，这可能导致程序故障，清除当前\
    \ shell 中正在使用的所有变量和函数，从而导致繁琐的重复工作。因此，随着应用程序的推进，最好混合使用两者。\n\n在复杂代码较少的初始阶段，使用 SPARK\
    \ REPL 环境进行快速分析和调试；随着应用程序数据量和复杂性的扩大，将实现移动到编译后的库中并在 shell 中使用它。我们上面已经了了如何将编译后的库导入到\
    \ Spark Shell 中。通过这种方法，鉴于编译后的库不需要频繁的编辑和重新编译，在 Spark REPL 环境中运行应用程序将产生更快的结果。\n\n\
    ## 总结\n\n在本章中，我们研究了 Apache Spark 交互式 shell 的细节。我们讨论了如何利用 SCALA 中的 REPL 环境来实现更快的实现和高效的应用程序执行。我们研究了\
    \ REPL 环境的优势以及在 Spark shell 中一些常用机器学习算法的实现。最后，我们讨论了在 Spark shell 中使用编译后的库，以及如何在两种方法之间做出选择。\n\
    \n## 作业\n\n### 练习 1\n\n运行 Spark Shell 提示符中输入以下内容。\n\n```bash\nsc\n```\n\n解释输出结果。\n\
    \n### 练习 2\n\n尝试在本章描述的示例单词计数应用程序，并描述其行为。\n\n### 练习 3\n\n学习本章提供的决策树预测算法实现，并尝试示例实现。在\
    \ Apache Spark REPL 环境中编写决策树分类算法的实现。\n\n# 第 9 章：Spark Vs Hadoop\n\n## 如前面的章节所示，Spark\
    \ 和 Hadoop 是两个不同的框架，它们既有相似之处也有不同。此外，它们都有自己的优缺点。那么，哪一个更好？Spark 还是 Hadoop？没有准确的答案，因为这些平台比较的维度不同，每个人都可能发现一些新颖实用的东西。所以，让我们从这两个框架的历史开始吧。\n\
    \nSpark 和 Hadoop 都是框架，主要目的是集群分布。为了速度提供了内存计算，同时也涉及数据。那么 Hadoop 呢？Hadoop 的主要目的是运行\
    \ map / reduce，因此它是一个并行结构框架。\n\n## 如何选择：Spark 还是 Hadoop\n\n正如我们上面所说，Spark 和 Hadoop\
    \ 都有优缺点，但有些属性是你需要这些。第一个也是主要的区别是 RAM 的容量。Spark 使用的随机存取内存比 Hadoop 多，但它“消耗”的带宽或磁盘较少，所以如果你使用\
    \ Hadoop，最好找一台具有大内部存储的强大机器。但不要忘记，你可以动态地改变决定；这完全取决于你的偏好。\n\nApache Spark 和 Hadoop\
    \ Mapreduce 的下一个区别是所有数据都存储在磁盘上，而 Spark 中的数据存储在内存中。第三点区别是实现容错机制的方式不同。Spark 使用弹性分布式数据集（RDD），这是一种数据存储模型，可以为你提供容错保证，这就是为什么它最小化了网络\
    \ I/O。如果你想找到更多关于弹性分布式数据集的信息，请重读之前的章节。\n\n## 先学哪种更好：Hadoop 还是 Spark？\n\n我认为这个问题并不正确。如果你完美地学习了其中一个，学习另一个时就不会有问题。但对于这个问题，有两种不同的观点。\n\
    \n第一种观点认为：“学习 Hadoop 更好，因为它是基础”。是的，当然，学习 Hadoop 技术将带给你大量的基础知识、理论和实践技能。你也可以在使用它时发现一些新东西。\n\
    \n但第二种观点认为：“学习 Spark 更好，因为它更现代”。是的，这是真的，Spark 有许多有趣的特性，将在下面的段落中进行解释和列出。\n\n如果你是开发者，可能感觉不到\
    \ Hadoop 和 Spark 之间的差异。Spark 是一个通过函数调用启用并行通信的框架，而 Hadoop 是一个库，你可以通过 Java 类编写 map\
    \ / reduce 任务。\n\n"
