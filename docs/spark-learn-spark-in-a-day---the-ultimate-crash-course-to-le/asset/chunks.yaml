    as a child-thread. Then traditionally the client’s status updates with some period
    and console displays the result. Also, if client exits from session, application
    would be finished. You also have to do the same when you require launching the
    Spark in the Mode of Yarn Client. However don’t forget to swap the yarn cluster
    with the yarn client. So if you want to start it, just run this code:


    ![](images/00008.jpeg)


    ## Using Additional JARs for Completing


    As mentioned above, Apache Spark has 2 different modes, so let’s talk about the
    first one which is YARN-clustered. In this mode client and driver run different
    machines, so one of jars which is `SparkContext.addJar` wouldn’t be launched,
    because it is not stored in local files of needed repository on client side. So,
    to solve the problem you should add this jar-file to repository for making it
    available by client and include `--jars` option:


    ![](images/00009.jpeg)


    After this command `SparkContext.addJar` will be loaded on client-side


    ## Something That’s Better to Do Before


    If you want to run Spark on Yarn – it’s better to pre-install package with binary
    distributed Spark, which has a support of YARN. This package can be also downloaded
    from official Spark web-site.


    ## Installation and Configuration


    When all of actions, that are written above are done, your next step is configuration
    of Apache Spark. A lot of configurations are similar for YARN Spark, so it shouldn’t
    be difficult to set this software on. But also, it’s better to look through configuration
    page on Spark web-site to find additional information about configs. All of these
    configurations are only specified on YARN version of Spark, please, notice this
    fact.


    ## Application Debug


    There are some special determinations, which say us that all of application masters
    and executers of application run in “containers”. Also, we already know about
    two different deploy modes that YARN uses for handling logs of container. If you
    turned aggregation log on, all of logs of container will be copied into HDFS,
    and then will be erased from local machine. Also, below is example of such command:


    ![](images/00010.jpeg)


    This command will display all log-files in all containers, which are used in application.
    Also, you have at a possibility to review files of log in HDFS or to use API or
    HDFS Shell. In reason to find the local directory, where configs are saved, you
    can simply view on `config-name` path.


    The next variant is disabled log aggregation. In this way, all of logs are saved
    on local machines under the `YARN APP (LOGS – DIR)`, that is normally constituted
    to the tmp-logs. However, it depends on version of Hadoop and your installation
    preferences. So, in reason to review the container logs, you should go on localhost,
    where these logs are contained and review them in given directory. You should
    notice that logs are organized by container ID or application id in subdirectories.


    There is a feature for reviewing launching of per-container. Because of delay
    of process is pretty small, you should change this property to large amount. But
    this is not the end: you should get access the cache of application through the
    `yarn – node_manager – local.dirs`. It is very useful when there is a reason to
    debug problems. But don’t forget, that you should have admin privileges to do
    it.


    If you want to utilize a custom configuration log4j, you’ll be provided with two
    variants of further continuation:


    *   Uploading custom properties. If you choose this option, you should upload
    log4j properties while using `spark_submit`, and then add `--files` to the file-lists,
    which are uploaded using the app.

    *   Adding new properties in log. You should change `-Dlog4j.configuration=<location
    of configuration file>` in `spark.executor.extraJavaOptions` (for executors) or
    `spark.driver.extraJavaOptions` (for the driver). Also, you should note, that
    you have to explicitly provide file protocol and files will exist automatically
    on all local machines.


    Sometimes, you have situations, when you need to get some references of proper
    location for putting files of log into YARN, and you are already provided for
    this option by YARN. Just execute these commands:


    ![](images/00011.jpeg)


    If you want to stream an application just configure `RollingFileAppender`, but
    the main problem that you should solve is disk overflow, so it’s better to clean
    cache and files, that you don’t need.


    There are a lot of Spark properties, which you may use in future. If you want
    to know more about it, just look through official Spark web-site and find page
    with Spark properties. You’ll find proper information, which includes Property
    Name, Default Value and Description of what this property does.


