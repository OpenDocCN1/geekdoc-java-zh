    \        System.out.println(\"\\nExample - noneMatch\\n\");\n        //noneMatch\
    \ - check if length of each string is greater than 6.\n        System.out.println(\"\
    Length > 6: \" + stringList.stream().noneMatch(s -> { return s.length() > 6;}));\n\
    \n        System.out.println(\"\\nExample - collect\\n\");\n        System.out.println(\"\
    List: \" + stringList.stream().filter(s -> { return s.length() > 3;}).collect(Collectors.toList()));\n\
    \n        System.out.println(\"\\nExample - count\\n\");\n        System.out.println(\"\
    Count: \" + stringList.stream().filter(s -> { return s.length() > 3;}).count());\n\
    \n        System.out.println(\"\\nExample - findAny\\n\");\n        System.out.println(\"\
    findAny: \" + stringList.stream().findAny().get());\n\n        System.out.println(\"\
    \\nExample - findFirst\\n\");\n        System.out.println(\"findFirst: \" + stringList.stream().findFirst().get());\n\
    \n        System.out.println(\"\\nExample - forEach\\n\");\n        stringList.stream().forEach(System.out::println);\n\
    \n        System.out.println(\"\\nExample - min\\n\");\n        System.out.println(\"\
    min: \" + stringList.stream().min((s1, s2) -> { return s1.compareTo(s2);}));\n\
    \n        System.out.println(\"\\nExample - max\\n\");\n        System.out.println(\"\
    min: \" + stringList.stream().max((s1, s2) -> { return s1.compareTo(s2);}));\n\
    \n        System.out.println(\"\\nExample - reduce\\n\");\n        System.out.println(\"\
    reduced: \" + stringList.stream().reduce((s1, s2) -> { return s1 + \", \"+ + s2;}).get());\n\
    \    }\n}\n```\n\n### Output\n\n```\nExample - anyMatch\nTwo is present: true\n\
    \nExample - allMatch\nLength > 2: true\n\nExample - noneMatch\nLength > 6: true\n\
    \nExample - collect\nList: [Three, Four, Five]\n\nExample - count\nCount: 3\n\n\
    Example - findAny\nfindAny: One\n\nExample - findFirst\nfindFirst: One\n\nExample\
    \ - forEach\nOne\nTwo\nThree\nFour\nFive\nOne\n\nExample - min\nmin: Optional[Five]\n\
    \nExample - max\nmin: Optional[Two]\n\nExample - reduce\nreduced: One, Two, Three,\
    \ Four, Five, One\n```\n\n# Functional Programming - Infinite Streams\n\nCollections\
    \ are in-memory data structure which have all the elements present in the collection\
    \ and we have external iteration to iterate through collection whereas `Stream`\
    \ is a fixed data structure where elements are computed on demand and a `Stream`\
    \ has inbuilt iteration to iterate through each element. Following example shows\
    \ how to create a `Stream` from an array.\n\n```java\nint[] numbers = {1, 2, 3,\
    \ 4};\nStream numbersFromArray = Arrays.stream(numbers);\n```\n\nWe can create\
    \ a `Stream` using `Stream.iterate()` or `Stream.generate()` method which can\
    \ pass a condition. Consider the case, where we need list of numbers multiple\
    \ of 3.\n\n## Example - Infinite Stream\n\n```java\nimport java.util.stream.Stream;\n\
    \npublic class FunctionTester {\n    public static void main(String[] args) {\n\
    \        //create a stream of numbers which are multiple of 3\n        Stream<Integer>\
    \ numbers = Stream.iterate(0, n -> n + 3);\n        numbers.limit(10)\n      \
    \         .forEach(System.out::println);\n    }\n}\n```\n\n### Output\n\n```\n\
    0\n3\n6\n9\n12\n15\n18\n21\n24\n27\n```\nIn order to operate on infinite stream,\
    \ weve used `limit()` method of `Stream` to restrict the iteration of numbers\
    \ when count become 10.\n\n# Functional Programming - Fixed length Streams\n\n\
    There are multiple ways using we can create fix length streams.\n\n- Using `Stream.of()`\
    \ method\n- Using `Collection.stream()` method\n- Using `Stream.builder()` method\n\
    \nFollowing example shows all of above ways to create a fix length stream.\n\n\
    ## Example - Fix Length Stream\n\n```java\nimport java.util.Arrays;\nimport java.util.List;\n\
    import java.util.stream.Stream;\n\npublic class FunctionTester {\n    public static\
    \ void main(String[] args) {\n        System.out.println(\"Stream.of():\");\n\
    \        Stream<Integer> stream = Stream.of(1, 2, 3, 4, 5);\n        stream.forEach(System.out::println);\n\
    \n        System.out.println(\"Collection.stream():\");\n        Integer[] numbers\
    \ = {1, 2, 3, 4, 5};\n        List<Integer> list = Arrays.asList(numbers);\n \
    \       list.stream().forEach(System.out::println);\n\n        System.out.println(\"\
    StreamBuilder.build():\");\n        Stream.Builder<Integer> streamBuilder = Stream.builder();\n\
    \        streamBuilder.accept(1);\n        streamBuilder.accept(2);\n        streamBuilder.accept(3);\n\
    \        streamBuilder.accept(4);\n        streamBuilder.accept(5);\n        streamBuilder.build().forEach(System.out::println);\n\
    \    }\n}\n```\n\n### Output\n\n```\nStream.of():\n1\n2\n3\n4\n5\n\nCollection.stream():\n\
    1\n2\n3\n4\n5\n\nStreamBuilder.build():\n1\n2\n3\n4\n5\n```\n"
