    # Optionals and Monads


    Monad is a key concept of Functional Programming. A Monad is a design pattern
    which helps to represent a missing value. It allows to wrap a potential null value,
    allows to put transformation around it and pull actual value if present. By definition,
    a monad is a set of following parameters.


    *   **A parametrized Type** − M<T>


    *   **A unit Function** − T −> M<T>


    *   **A bind operation** − M<T> bind T −> M<U> = M<U>


    ## Key Operations


    *   **Left Identity** − If a function is bind on a monad of a particular value
    then its result will be same as if function is applied to the value.


    *   **Right Identity** − If a monad return method is same as monad on original
    value.


    *   **Associativity** − Functions can be applied in any order on a monad.


    ## Optional Class


    Java 8 introduced Optional class which is a monad. It provides operational equivalent
    to a monad. For example **return** is a operation which takes a value and return
    the monad. Optional.of() takes a parameters and returns the Optional Object. On
    similar basis , **bind** is operation which binds a function to a monad to produce
    a monad. Optional.flatMap() is the method which performs an operation on Optional
    and return the result as Optional.


    *   **A parametrized Type** − Optional<T>


    *   **A unit Function** − Optional.of()


    *   **A bind operation** − Optional.flatMap()


    ### Example − Left Identity


    Following example shows how Optional class obeys Left Identity rule.


    import java.util.Optional;


    import java.util.function.Function;


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    Function<Integer,  Optional<Integer>> addOneToX


    = x −>  Optional.of(x +  1);


    System.out.println(Optional.of(5).flatMap(addOneToX)


    .equals(addOneToX.apply(5)));


    }


    }


    ### Output


    true


    ### Example − Right Identity


    Following example shows how Optional class obeys Right Identity rule.


    import java.util.Optional;


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    System.out.println(Optional.of(5).flatMap(Optional::of)


    .equals(Optional.of(5)));


    }


    }


    ### Output


    true


    ### Example - Associativity


    Following example shows how Optional class obeys Associativity rule.


    import java.util.Optional;


    import java.util.function.Function;


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    Function<Integer,  Optional<Integer>> addOneToX


    = x −>  Optional.of(x +  1);


    Function<Integer,  Optional<Integer>> addTwoToX


    = x −>  Optional.of(x +  2);


    Function<Integer,  Optional<Integer>> addThreeToX


    = x −> addOneToX.apply(x).flatMap(addTwoToX);


    Optional.of(5).flatMap(addOneToX).flatMap(addTwoToX)


    .equals(Optional.of(5).flatMap(addThreeToX));


    }


    }


    ### Output


    true


    # Functional Programming with Java – Closure


    A closure is a function which is a combination of function along with its surrounding
    state. A closure function generally have access to outer function''s scope. In
    the example given below, we have created a function getWeekDay(String[] days)
    which returns a function which can return the text equivalent of a weekday. Here
    getWeekDay() is a closure which is returning a function surrounding the calling
    function''s scope.


    Following example shows how Closure works.


    import java.util.function.Function;


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    String[] weekDays =  {"Monday",  "Tuesday",  "Wednesday",  "Thursday",


    "Friday",  "Saturday",  "Sunday"  };


    Function<Integer,  String> getIndianWeekDay = getWeekDay(weekDays);


    System.out.println(getIndianWeekDay.apply(6));


    }


    public  static  Function<Integer,  String> getWeekDay(String[] weekDays){


    return index -> index >=  0  ? weekDays[index %  7]  :  null;


    }


    }


    ### Output


    Sunday


    # Functional Programming with Java – Currying


    Currying is a technique where a many arguments function call is replaced with
    multiple method calls with lesser arguments.


    See the below equation.


    (1  +  2  +  3)  =  1  +  (2  +  3)  =  1  +  5  =  6


    In terms of functions:


    f(1,2,3)  = g(1)  + h(2  +  3)  =  1  +  5  =  6


    This cascading of functions is called currying and calls to cascaded functions
    must gives the same result as by calling the main function.


    Following example shows how Currying works.


    import java.util.function.Function;


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    Function<Integer,  Function<Integer,  Function<Integer,  Integer>>>


    addNumbers = u -> v -> w -> u + v + w;


    int result = addNumbers.apply(2).apply(3).apply(4);


    System.out.println(result);


    }


    }


    ### Output


    9


    # Functional Programming with Java – Reducing


    In functional programming, reducing is a technique to reduce a stream of values
    to a single result by apply a function on all the values. Java provides reduce()
    function in a Stream class from Java 8 onwards. A stream has inbuilt reducing
    methods like sum(), average(), count() as well which works on all elements of
    the stream and returns the single result.


    Following example shows how Reducing works.


    import java.util.stream.IntStream;


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    //1 * 2 * 3 * 4 = 24


    int product =  IntStream.range(1,  5)


    .reduce((num1, num2)  -> num1 * num2)


    .orElse(-1);


    //1 + 2 + 3 + 4 = 10


    int sum =  IntStream.range(1,  5).sum();


    System.out.println(product);


    System.out.println(sum);


    }


