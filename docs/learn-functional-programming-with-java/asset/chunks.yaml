  trans: "\n\n纯函数不会修改任何全局变量，也不会修改作为参数传递给它的引用。因此，它没有副作用。当用相同的参数调用时，它总是返回相同的值。这类函数非常有用并且是线程安全的。在示例中，`sum`\
    \ 是一个纯函数。\n\n```java\npublic class FunctionTester {\n    public static void main(String[]\
    \ args) {\n        int a, b;\n        a = 1;\n        b = 2;\n        System.out.println(sum(a,\
    \ b));\n    }\n    private static int sum(int a, int b){\n        return a + b;\n\
    \    }\n}\n```\n\n### 输出\n3\n\n# Java 函数式编程 – 组合\n\n函数组合是指是一种将多个函数组合成单个函数的技术。我们可以组合\
    \ lambda 表达式组合。Java 通过 `Predicate` 和 `Function` 类提供了内置支持。以下示例展示了如何使用谓词方法组合两个函数。\n\
    \n```java\nimport java.util.function.Predicate;\n\npublic class FunctionTester\
    \ {\n    public static void main(String[] args) {\n        Predicate<String> hasName\
    \ = text -> text.contains(\"name\");\n        Predicate<String> hasPassword =\
    \ text -> text.contains(\"password\");\n        Predicate<String> hasBothNameAndPassword\
    \ = hasName.and(hasPassword);\n        String queryString = \"name=test;password=test\"\
    ;\n        System.out.println(hasBothNameAndPassword.test(queryString));\n   \
    \ }\n}\n```\n\n### 输出\ntrue\n\n`Predicate` 提供了 `and()` 和 `or()` 方法来组合函数。而 `Function`\
    \ 提供了 `compose` 和 `andThen` 方法来组合函数。以下示例展示了如何使用 Function 方法组合两个函数。\n\n```java\n\
    import java.util.function.Function;\n\npublic class FunctionTester {\n    public\
    \ static void main(String[] args) {\n        Function<Integer, Integer> multiply\
    \ = t -> t * 3;\n        Function<Integer, Integer> add = t -> t + 3;\n      \
    \  Function<Integer, Integer> FirstMultiplyThenAdd = multiply.compose(add);\n\
    \        Function<Integer, Integer> FirstAddThenMultiply = multiply.andThen(add);\n\
    \        System.out.println(FirstMultiplyThenAdd.apply(3));\n        System.out.println(FirstAddThenMultiply.apply(3));\n\
    \    }\n}\n```\n\n### 输出\n18\n12\n\n# 饿求值 vs 懒求值\n\n饿求值意味着表达式在遇到时立即求值，而懒求值是指在需要时对表达式进行求值。查看以下示例以理解该概念。\n\
    \n```java\nimport java.util.function.Supplier;\n\npublic class FunctionTester\
    \ {\n    public static void main(String[] args) {\n        String queryString\
    \ = \"password=test\";\n        System.out.println(checkInEagerWay(hasName(queryString),\
    \ hasPassword(queryString)));\n        System.out.println(checkInLazyWay(() ->\
    \ hasName(queryString), () -> hasPassword(queryString)));\n    }\n    private\
    \ static boolean hasName(String queryString) {\n        System.out.println(\"\
    Checking name: \");\n        return queryString.contains(\"name\");\n    }\n \
    \   private static boolean hasPassword(String queryString) {\n        System.out.println(\"\
    Checking password: \");\n        return queryString.contains(\"password\");\n\
    \    }\n    private static String checkInEagerWay(boolean result1, boolean result2)\
    \ {\n        return (result1 && result2) ? \"all conditions passed\": \"failed.\"\
    ;\n    }\n    private static String checkInLazyWay(Supplier<Boolean> result1,\
    \ Supplier<Boolean> result2) {\n        return (result1.get() && result2.get())\
    \ ? \"all conditions passed\": \"failed.\";\n    }\n}\n```\n\n### 输出\nChecking\
    \ name:\nChecking password:\nfailed.\nChecking name:\nfailed.\n\n在这里 `checkInEagerWay()`\
    \ 函数首先评估参数然后执行其语句。而 `checkInLazyWay()` 执行其语句并根据需要评估参数。由于 `&&` 是短路运算符，`checkInLazyWay`\
    \ 只评估了第一个为 false 的参数，完全没有评估第二个参数。\n\n# 持久化数据结构\n\n如果一个数据结构能够将其之前的更新作为独立版本维护，并且每个版本都可以相应地访问和更新，则称它是持久化的。这使得数据结构变得不可变且线程安全。例如，Java\
    \ 中的 `String` 类对象是不可变的。当我们对字符串进行任何更改时，JVM 都会创建一个新的字符串对象，分配新值并保留旧值作为旧字符串对象。\n\n\
    持久化数据结构也称为函数式数据结构。考虑以下情况——\n\n## 非持久化方式\n```java\npublic static Person updateAge(Person\
    \ person, int age) {\n    person.setAge(age);\n    return person;\n}\n```\n\n\
    ## 持久化方式\n```java\npublic static Person updateAge(Person pPerson, int age) {\n\
    \    Person person = new Person();\n    person.setAge(age);\n    return person;\n\
    }\n```\n\n# Java 函数式编程 – 递归\n\n递归是在函数中调用同一个函数，直到满足某些条件。它有助于将大问题分解为较小的问题。递归也让代码更具读性和表达力。\n\
    \n## 过程式 vs 递归\n\n以下示例展示了使用这两种技术计算自然数的和。\n\n```java\npublic class FunctionTester\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Sum using imperative way. Sum(5) : \" + sum(5));\n        System.out.println(\"\
    Sum using recursive way. Sum(5) : \" + sumRecursive(5));\n    }\n    private static\
    \ int sum(int n) {\n        int result = 0;\n        for (int i = 1; i <= n; i++)\
    \ {\n            result += i;\n        }\n        return result;\n    }\n    private\
    \ static int sumRecursive(int n) {\n        if (n <= 0)\n            return 0;\n\
    \        else\n            return n + sumRecursive(n - 1);\n    }\n}\n```\n###\
    \ 输出\nSum using imperative way. Sum(5) : 15\nSum using recursive way. Sum(5) :\
    \ 15\n使用递归，我们通过 n-1 的自然数来得到所需的结果。\n\n## 尾递归\n\n尾递归是指递归调用应该位于末尾。以下示例展示了使用尾递归打印序列。\n\
    \n```java\npublic class FunctionTester {\n    public static void main(String[]\
    \ args) {\n        printTailRecursion(5);\n    }\n    public static void printTailRecursion(int\
    \ n) {\n        if (n == 0)\n            return;\n        else\n            System.out.println(n);\n\
    \            printTailRecursion(n - 1);\n    }\n}\n```\n### 输出\n5\n4\n3\n2\n1\n\
    \n## 头递归\n\n头递归是指递归调用位于代码开头。以下示例展示了使用头递归打印数字序列。\n\n```java\npublic class FunctionTester\
    \ {\n    public static void main(String[] args) {\n        printHeadRecursion(5);\n\
    \    }\n    public static void printHeadRecursion(int n) {\n        if (n == 0)\n\
    \            return;\n        else {\n            printHeadRecursion(n - 1);\n\
    \            System.out.println(n);\n        }\n    }\n}\n```\n### 输出\n1\n2\n\
    3\n4\n5\n\n# Java 函数式编程 – 并行\n\n并行是函数式编程的核心概念，通过将大任务分解为较小的独立任务，然后以并行方式完成这些小任务，最后组合完整结果。随着多核处理器的出现，这种技术有助于加快代码执行。Java\
    \ 有基于线程的并行处理支持，但学习非常困难且难以实现 Bug。Java 8 之后，stream 提供了 `parallel()` 方法，集合 提供了 `parallelStream()`\
    \ 方法来并行方式完成任务。查看下例：\n\n```java\nimport java.util.ArrayList;\nimport java.util.Arrays;\n\
    import java.util.List;\n\npublic class FunctionTester {\n    public static void\
    \ main(String[] args) {\n        Integer[] intArray = {1, 2, 3, 4, 5, 6, 7, 8};\n\
    \        List<Integer> listOfIntegers = new ArrayList<>(Arrays.asList(intArray));\n\
    \        System.out.println(\"List using Serial Stream:\");\n        listOfIntegers\n\
    \            .stream()\n            .forEach(e -> System.out.print(e + \" \"));\n\
    \        System.out.println(\"\");\n\n        System.out.println(\"List using\
    \ Parallel Stream:\");\n        listOfIntegers\n            .parallelStream()\n\
    \            .forEach(e -> System.out.print(e + \" \"));\n        System.out.println(\"\
    \");\n\n        System.out.println(\"List using Another Parallel Stream:\");\n\
    \        listOfIntegers\n            .stream()\n            .parallel()\n    \
    \        .forEach(e -> System.out.print(e + \" \"));\n        System.out.println(\"\
