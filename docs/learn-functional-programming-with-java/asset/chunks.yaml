    # Functional Programming - Overview


    In functional programming paradigm, an application is written mostly using pure
    functions. Here pure function is a function having no side effects. An example
    of side effect is modification of instance level variable while returning a value
    from the function.


    Following are the key aspects of functional programming.


    *   **Functions** − A function is a block of statements that performs a specific
    task. Functions accept data, process it, and return a result. Functions are written
    primarily to support the concept of re usability. Once a function is written,
    it can be called easily, without having to write the same code again and again.


    Functional Programming revolves around first class functions, pure functions and
    high order functions.


    *   A **First Class Function** is the one that uses first class entities like
    String, numbers which can be passed as arguments, can be returned or assigned
    to a variable.


    *   A **High Order Function** is the one which can either take a function as an
    argument and/or can return a function.


    *   A **Pure Function** is the one which has no side effect while its execution.


    *   **Functional Composition** − In imperative programming, functions are used
    to organize an executable code and emphasis is on organization of code. But in
    functional programming, emphasis is on how functions are organized and combined.
    Often data and functions are passed together as arguments and returned. This makes
    programming more capable and expressive.


    *   **Fluent Interfaces** − Fluent interfaces helps in composing expressions which
    are easy to write and understand. These interfaces helps in chaining the method
    call when each method return type is again reused. For example −


    LocalDate futureDate =  LocalDate.now().plusYears(2).plusDays(3);


    *   **Eager vs Lazy Evaluation** − Eager evaluation means expressions are evaluated
    as soon as they are encountered whereas lazy evaluation refers to delaying the
    execution till certain condition is met. For example, stream methods in Java 8
    are evaluated when a terminal method is encountered.


    *   Persistent Data Structures


    − A persistent data structure maintains its previous version. Whenever data structure
    state is changed, a new copy of structure is created so data structure remains
    effectively immutable. Such immutable collections are thread safe.


    *   **Recursion** − A repeated calculation can be done by making a loop or using
    recursion more elegantly. A function is called recursive function if it calls
    itself.


    *   **Parallelism** − Functions with no side effects can be called in any order
    and thus are candidate of lazy evaluation. Functional programming in Java supports
    parallelism using streams where parallel processing is provided.


    *   **Optionals** − Optional is a special class which enforces that a function
    should never return null. It should return value using Optional class object.
    This returned object has method isPresent which can be checked to get the value
    only if present.


    # Functional Programming with Java – Functions


    A function is a block of statements that performs a specific task. Functions accept
    data, process it, and return a result. Functions are written primarily to support
    the concept of re usability. Once a function is written, it can be called easily,
    without having to write the same code again and again.


    Functional Programming revolves around first class functions, pure functions and
    high order functions.


    *   A **First Class Function** is the one that uses first class entities like
    String, numbers which can be passed as arguments, can be returned or assigned
    to a variable.


    *   A **High Order Function** is the one which can take a function as an argument
    and/or can return a function.


    *   A **Pure Function** is the one which has no side effect while its execution.


    ## First Class Function


    A first class function can be treated as a variable. That means it can be passed
    as a parameter to a function, it can be returned by a function or can be assigned
    to a variable as well. Java supports first class function using lambda expression.
    A lambda expression is analogous to an anonymous function. See the example below
    −


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    int[] array =  {1,  2,  3,  4,  5};


    SquareMaker squareMaker = item -> item * item;


    for(int i =  0; i < array.length; i++){


    System.out.println(squareMaker.square(array[i]));


    }


    }


    }


    interface  SquareMaker  {


    int square(int item);


    }


    ### Output


    1


    4


    9


    16


    25


    Here we have created the implementation of square function using a lambda expression
    and assigned it to variable squareMaker.


    ## High Order Function


    A high order function either takes a function as a parameter or returns a function.
    In Java, we can pass or return a lambda expression to achieve such functionality.


    import java.util.function.Function;


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    int[] array =  {1,  2,  3,  4,  5};


    Function<Integer,  Integer> square = t -> t * t;


    Function<Integer,  Integer> cube = t -> t * t * t;


    for(int i =  0; i < array.length; i++){


    print(square, array[i]);


    }


    for(int i =  0; i < array.length; i++){


    print(cube, array[i]);


    }


    }


    private  static  <T, R>  void  print(Function<T, R>  function, T t )  {


    System.out.println(function.apply(t));


    }


    }


    ### Output


    1


    4


    9


    16


    25


    1


    8


    27


    64


    125


