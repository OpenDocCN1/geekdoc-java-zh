    \ 3 as parameters at different times and has no side effects.\n\n## Example- Impure\
    \ Function\n\n```java\npublic class FunctionTester {\n    private static double\
    \ valueUsed = 0.0;\n\n    public static void main(String[] args) {\n        double\
    \ result = randomSum(2.0,3.0);\n        System.out.println(result);\n        result\
    \ = randomSum(2.0,3.0);\n        System.out.println(result);\n    }\n\n    static\
