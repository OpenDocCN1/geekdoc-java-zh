    \ - 无限流\n- 函数式编程 - 固定长度流\n\n# 函数式编程 - 概述\n\n在函数式编程范式中，应用程序主要使用纯函数编写。这里的纯函数是指没有副作用的函数。副作用的一个示例是从函数返回值时修改实例级变量。\n\
    \n以下是函数式编程的关键方面。\n\n- **函数 (Functions)** – 函数是执行特定任务的语句块。函数接受数据、处理数据并返回结果。编写函数主要是为了支持重用性概念。一旦写好函数，就可以轻松地调用它，而无需反复编写相同的代码。\n\
    \n函数式编程围绕一等函数、纯函数和高阶函数展开。\n\n- **一等函数（First Class Function）**是指使用一等实体（如 `String`、数字）的函数，这些实体可以作为参数传递、返回或赋值给变量。\n\
    - **高阶函数（High Order Function）**是指既可以接受函数作为参数，也可以返回一个函数的函数。\n- **纯函数（Pure Function）**是指在执行过程中没有副作用的函数。\n\
    - **函数组合（Functional Composition）** – 在命令式编程中，函数被用于组织可执行的代码，重点在于代码的组织。但在函数式编程中，重点在于函数是如何组织和组合的。数据和函数通常作为参数传递并返回。这使得编程更具能力和表现力。\n\
    - **链式接口（Fluent Interfaces）** – 链式接口有助于组合易于编写和理解的表达式。这些接口在每个方法的返回类型再次被重用时有助于方法的链式调用。例如\
    \ –\n\n```java\nLocalDate futureDate = LocalDate.now().plusYears(2).plusDays(3);\n\
    ```\n\n- **及早求值与惰性求值（Eager vs Lazy Evaluation）** – 及早求值意味着表达式一旦遇到就会求值，而惰性求值是指延迟执行直到满足特定条件。例如，Java\
    \ 8 中的函数式编程支持流。\n- **持久性数据结构（Persistent Data Structure）** – 持久性数据结构维护其版本。每当数据更改时，都会创建一个新副本因此是不可变的。此类集合是线程安全的。\n\
    - **递归（Recursion）** – 函数可以通过调用自己来实现。Java 的函数式编程支持递归。\n- **并行（Parallelism）** 没有副作用的函数可以任何顺序调用，因此是并行的。\n\
    - **Optionals** – Optional 是一个永远不返回 null 的特殊类。返回的对象具有 `isPresent()` 方法。\n\n# Java\
    \ 函数式编程 – 函数\n\n函数是执行特定任务的语句块。函数接受数据、处理数据并返回结果。编写函数主要是为了支持重用性。\n\n函数式编程围绕一等函数、纯函数和高阶函数展开。\n\
    \n- **一等函数（First Class Function）**是指使用一等实体（如 `String`、数字）的函数，这些实体可以作为参数传递、返回或赋值给变量。\n\
    - **高阶函数（High Order Function）**是指既可以接受函数作为参数，也可以返回一个函数的函数。\n- **纯函数（Pure Function）**是指在执行过程中没有副作用的函数。\n\
    \n## 一等函数 (First Class Function)\n\n一等函数可以被视为变量。这意味着它可以作为参数传递给函数、由函数返回或赋值给变量。Java\
    \ 使用 Lambda 表达式支持一等函数。Lambda 表达式类似于匿名函数。见下例：\n\n```java\npublic class FunctionTester\
    \ {\n    public static void main(String[] args) {\n        int[] array = {1, 2,\
    \ 3, 4, 5};\n        SquareMaker squareMaker = item -> item * item;\n        for(int\
    \ i = 0; i < array.length; i++){\n            System.out.println(squareMaker.square(array[i]));\n\
    \        }\n    }\n}\n\ninterface SquareMaker {\n    int square(int item);\n}\n\
    ```\n\n### 输出\n1\n4\n9\n16\n25\n\n在这里我们使用 Lambda 表达式创建了平方函数的实现并赋值给变量 `squareMaker`。\n\
    \n## 高阶函数 (High Order Function)\n\n高阶函数要么接受函数作为参数，要么返回一个函数。在 Java 中，我们可以传递或返回\
    \ Lambda 表达式来实现这种功能。\n\n```java\nimport java.util.function.Function;\n\npublic\
    \ class FunctionTester {\n    public static void main(String[] args) {\n     \
    \   int[] array = {1, 2, 3, 4, 5};\n        Function<Integer, Integer> square\
    \ = t -> t * t;\n        Function<Integer, Integer> cube = t -> t * t * t;\n \
    \       for(int i = 0; i < array.length; i++){\n            print(square, array[i]);\n\
    \        }\n        for(int i = 0; i < array.length; i++){\n            print(cube,\
    \ array[i]);\n        }\n    }\n\n    private static <T, R> void print(Function<T,\
    \ R> function, T t) {\n        System.out.println(function.apply(t));\n    }\n\
    }\n```\n\n### 输出\n1\n4\n9\n16\n25\n1\n8\n27\n64\n125\n\n"
- fmt: "\nA pure function does not modify any global variable or modify any reference\
    \ passed as a parameter to it. So it has no side-effect. It always returns the\
    \ same value when invoked with same parameters. Such functions are very useful\
    \ and are thread safe. In example below, `sum` is a pure function.\n\n```java\n\
    public class FunctionTester {\n    public static void main(String[] args) {\n\
    \        int a, b;\n        a = 1;\n        b = 2;\n        System.out.println(sum(a,\
    \ b));\n    }\n    private static int sum(int a, int b){\n        return a + b;\n\
    \    }\n}\n```\n\n### Output\n3\n\n# Functional Programming with Java – Composition\n\
    \nFunctional composition refers to a technique where multiple functions are combined\
    \ together to a single function. We can combine lambda expression together. Java\
    \ provides inbuilt support using `Predicate` and `Function` classes. Following\
    \ example shows how to combine two functions using predicate approach.\n\n```java\n\
    import java.util.function.Predicate;\n\npublic class FunctionTester {\n    public\
    \ static void main(String[] args) {\n        Predicate<String> hasName = text\
    \ -> text.contains(\"name\");\n        Predicate<String> hasPassword = text ->\
    \ text.contains(\"password\");\n        Predicate<String> hasBothNameAndPassword\
    \ = hasName.and(hasPassword);\n        String queryString = \"name=test;password=test\"\
    ;\n        System.out.println(hasBothNameAndPassword.test(queryString));\n   \
    \ }\n}\n```\n\n### Output\ntrue\n\n`Predicate` provides `and()` and `or()` method\
    \ to combine functions. Whereas `Function` provides `compose` and `andThen` methods\
    \ to combine functions. Following example shows how to combine two functions using\
    \ Function approach.\n\n```java\nimport java.util.function.Function;\n\npublic\
    \ class FunctionTester {\n    public static void main(String[] args) {\n     \
    \   Function<Integer, Integer> multiply = t -> t * 3;\n        Function<Integer,\
    \ Integer> add = t -> t + 3;\n        Function<Integer, Integer> FirstMultiplyThenAdd\
    \ = multiply.compose(add);\n        Function<Integer, Integer> FirstAddThenMultiply\
    \ = multiply.andThen(add);\n        System.out.println(FirstMultiplyThenAdd.apply(3));\n\
    \        System.out.println(FirstAddThenMultiply.apply(3));\n    }\n}\n```\n\n\
