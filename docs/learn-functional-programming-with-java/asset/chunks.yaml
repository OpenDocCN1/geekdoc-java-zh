    \        return valueUsed + a + b;\n    }\n}\n```\n\n### Output\n\n```\n5.919716721877799\n\
    5.4830887819586795\n```\n\nHere `randomSum()` is an impure function as it return\
    \ different results when passed 2 and 3 as parameters at different times and modifies\
    \ state of instance variable as well.\n\n# Functional Programming - Type Inference\n\
    \nType inference is a technique by which a compiler automatically deduces the\
    \ type of a parameter passed or of return type of a method. Java 8 onwards, Lambda\
    \ expression uses type inference prominently.\n\nSee the example below for clarification\
    \ on type inference.\n\n## Example- Type Inference\n\n```java\npublic class FunctionTester\
    \ {\n    public static void main(String[] args) {\n        Join<Integer,Integer,Integer>\
    \ sum = (a,b) -> a + b;\n        System.out.println(sum.compute(10,20));\n   \
    \     Join<String, String, String> concat = (a,b) -> a + b;\n        System.out.println(concat.compute(\"\
    Hello \",\"World!\"));\n    }\n\n    interface Join<K,V,R> {\n        R compute(K\
    \ k , V v);\n    }\n}\n```\n\n### Output\n\n```\n30\nHello World!\n```\n\nA lambda\
    \ expression treats each parameter and its return type as Object initially and\
    \ then inferred the data type accordingly. In first case, the type inferred is\
    \ Integer and in second case type inferred is String.\n\n# Exception Handling\
    \ in Lambda Expressions\n\nLambda expressions are difficult to write when the\
    \ function throws a checked expression. See the example below −\n\n```java\nimport\
    \ java.net.URLEncoder;\nimport java.util.Arrays;\nimport java.util.stream.Collectors;\n\
    \npublic class FunctionTester {\n    public static void main(String[] args) {\n\
    \        String url = \"www.google.com\";\n        System.out.println(encodedAddress(url));\n\
    \    }\n\n    public static String encodedAddress(String... address) {\n     \
    \   return Arrays.stream(address)\n            .map(s -> URLEncoder.encode(s,\
    \ \"UTF-8\"))\n            .collect(Collectors.joining(\",\"));\n    }\n}\n```\n\
    \nThe above code fails to compile because `URLEncode.encode()` throws `UnsupportedEncodingException`\
    \ and cannot be thrown by `encodeAddress()` method.\n\nOne possible solution is\
    \ to extract `URLEncoder.encode()` into a separate method and handle the exception\
    \ there.\n\n```java\nimport java.io.UnsupportedEncodingException;\nimport java.net.URLEncoder;\n\
    import java.util.Arrays;\nimport java.util.stream.Collectors;\n\npublic class\
    \ FunctionTester {\n    public static void main(String[] args) {\n        String\
    \ url = \"www.google.com\";\n        System.out.println(encodedAddress(url));\n\
    \    }\n\n    public static String encodedString(String s) {\n        try {\n\
    \            URLEncoder.encode(s, \"UTF-8\");\n        } catch (UnsupportedEncodingException\
    \ e) {\n            e.printStackTrace();\n        }\n        return s;\n    }\n\
    \n    public static String encodedAddress(String... address) {\n        return\
    \ Arrays.stream(address)\n            .map(s -> encodedString(s))\n          \
    \  .collect(Collectors.joining(\",\"));\n    }\n}\n```\n\nBut above approach is\
    \ not good when we have multiple such methods which throws exception. See the\
    \ following generalized solution using functional interface and a wrapper method.\n\
    \n```java\nimport java.net.URLEncoder;\nimport java.util.Arrays;\nimport java.util.function.Function;\n\
    import java.util.stream.Collectors;\n\npublic class FunctionTester {\n    public\
    \ static void main(String[] args) {\n        String url = \"www.google.com\";\n\
    \        System.out.println(encodedAddress(url));\n    }\n\n    public static\
    \ String encodedAddress(String... address) {\n        return Arrays.stream(address)\n\
    \            .map(wrapper(s -> URLEncoder.encode(s, \"UTF-8\")))\n           \
    \ .collect(Collectors.joining(\",\"));\n    }\n\n    private static <T, R, E extends\
    \ Exception> Function<T, R>\n    wrapper(FunctionWithThrows<T, R, E> fe) {\n \
    \       return arg -> {\n            try {\n                return fe.apply(arg);\n\
    \            } catch (Exception e) {\n                throw new RuntimeException(e);\n\
    \            }\n        };\n    }\n}\n\n@FunctionalInterface\ninterface FunctionWithThrows<T,\
    \ R, E extends Exception> {\n    R apply(T t) throws E;\n}\n```\n\n### Output\n\
    \n```\nwww.google.com\n```\n\n# Intermediate Methods\n\nStream API was introduced\
