  trans: "\n通常，终端操作方法返回单个值，并在流的每个元素上调用。以下是 `Stream` 接口中一些重要的终端操作方法。每个终端函数接收一个谓词函数，启动元素的迭代，并对每个元素应用该谓词。\n\
    \n- `anyMatch` — 如果任意一个元素满足谓词（返回 true），则返回 true。如果没有元素匹配，则返回 false。\n- `allMatch`\
    \ — 如果任意一个元素不满足谓词（返回 false），则返回 false。如果所有元素都匹配，则返回 true。\n- `noneMatch` — 如果没有元素匹配，则返回\
    \ true，否则返回 false。\n- `collect` — 将每个元素存储到传入的集合中。\n- `count` — 返回通过中间方法的元素计数。\n\
    - `findAny` — 返回包含任意一个元素的 `Optional` 实例，或者返回空实例。\n- `findFirst` — 在 `Optional`\
    \ 实例下返回第一个元素。对于空流，返回空实例。\n- `forEach` — 在每个元素上应用消费者函数。用于打印流的所有元素。\n- `min` — 返回流中最小的元素。根据传递的比较器谓词对元素进行比较。\n\
    - `max` — 返回流中最大的元素。根据传递的比较器谓词对元素进行比较。\n- `reduce` — 使用传递的谓词将所有元素还原为单个元素。\n- `toArray`\
    \ — 返回流元素的数组。\n\n## 示例 - 终端方法\n\n```java\nimport java.util.Arrays;\nimport java.util.List;\n\
    import java.util.stream.Collectors;\n\npublic class FunctionTester {\n    public\
    \ static void main(String[] args) {\n        List<String> stringList = Arrays.asList(\"\
    One\", \"Two\", \"Three\", \"Four\", \"Five\", \"One\");\n\n        System.out.println(\"\
    Example - anyMatch\\n\");\n        //anyMatch - 检查 Two 是否存在?\n        System.out.println(\"\
    Two is present: \" + stringList.stream().anyMatch(s -> { return s.contains(\"\
    Two\");}));\n\n        System.out.println(\"\\nExample - allMatch\\n\");\n   \
    \     //allMatch - 检查每个字符串的长度是否大于 2.\n        System.out.println(\"Length > 2:\
    \ \" + stringList.stream().allMatch(s -> { return s.length() > 2;}));\n\n    \
    \    System.out.println(\"\\nExample - noneMatch\\n\");\n        //noneMatch -\
    \ 检查每个字符串的长度是否大于 6.\n        System.out.println(\"Length > 6: \" + stringList.stream().noneMatch(s\
    \ -> { return s.length() > 6;}));\n\n        System.out.println(\"\\nExample -\
    \ collect\\n\");\n        System.out.println(\"List: \" + stringList.stream().filter(s\
    \ -> { return s.length() > 3;}).collect(Collectors.toList()));\n\n        System.out.println(\"\
    \\nExample - count\\n\");\n        System.out.println(\"Count: \" + stringList.stream().filter(s\
    \ -> { return s.length() > 3;}).count());\n\n        System.out.println(\"\\nExample\
    \ - findAny\\n\");\n        System.out.println(\"findAny: \" + stringList.stream().findAny().get());\n\
    \n        System.out.println(\"\\nExample - findFirst\\n\");\n        System.out.println(\"\
    findFirst: \" + stringList.stream().findFirst().get());\n\n        System.out.println(\"\
    \\nExample - forEach\\n\");\n        stringList.stream().forEach(System.out::println);\n\
    \n        System.out.println(\"\\nExample - min\\n\");\n        System.out.println(\"\
    min: \" + stringList.stream().min((s1, s2) -> { return s1.compareTo(s2);}));\n\
    \n        System.out.println(\"\\nExample - max\\n\");\n        System.out.println(\"\
    min: \" + stringList.stream().max((s1, s2) -> { return s1.compareTo(s2);}));\n\
    \n        System.out.println(\"\\nExample - reduce\\n\");\n        System.out.println(\"\
    reduced: \" + stringList.stream().reduce((s1, s2) -> { return s1 + \", \"+ + s2;}).get());\n\
    \    }\n}\n```\n\n### 输出\n\n```\nExample - anyMatch\nTwo is present: true\n\n\
    Example - allMatch\nLength > 2: true\n\nExample - noneMatch\nLength > 6: true\n\
    \nExample - collect\nList: [Three, Four, Five]\n\nExample - count\nCount: 3\n\n\
    Example - findAny\nfindAny: One\n\nExample - findFirst\nfindFirst: One\n\nExample\
    \ - forEach\nOne\nTwo\nThree\nFour\nFive\nOne\n\nExample - min\nmin: Optional[Five]\n\
    \nExample - max\nmin: Optional[Two]\n\nExample - reduce\nreduced: One, Two, Three,\
    \ Four, Five, One\n```\n\n# 函数式编程 - 无限流\n\n集合（Collections）是内存数据结构，包含集合中的所有元素，我们通过外部迭代来遍历集合；而\
    \ `Stream` 是一种固定数据结构，元素按需计算，`Stream` 具有内置迭代来遍历每个元素。下面的示例显示了如何从数组创建 `Stream`。\n\
    \n```java\nint[] numbers = {1, 2, 3, 4};\nStream numbersFromArray = Arrays.stream(numbers);\n\
    ```\n\n可以使用 `Stream.iterate()` 或 `Stream.generate()` 方法创建 `Stream`，这些方法可以传递条件。考虑我们需要\
    \ 3 的倍数列表的情况。\n\n## 示例 - 无限流\n\n```java\nimport java.util.stream.Stream;\n\npublic\
    \ class FunctionTester {\n    public static void main(String[] args) {\n     \
    \   //创建一个 3 的倍数的流\n        Stream<Integer> numbers = Stream.iterate(0, n -> n\
    \ + 3);\n        numbers.limit(10)\n               .forEach(System.out::println);\n\
    \    }\n}\n```\n\n### 输出\n\n```\n0\n3\n6\n9\n12\n15\n18\n21\n24\n27\n```\n为了对无限流进行操作，我们使用了\
    \ `Stream` 的 `limit()` 方法，当计数达到 10 时限制数字迭代。\n\n# 函数式编程 - 固定长度流\n\n有多种方法可以创建固定长度流。\n\
    \n- 使用 `Stream.of()` 方法\n- 使用 `Collection.stream()` 方法\n- 使用 `Stream.builder()`\
    \ 方法\n\n下面的示例显示了所有创建固定长度流的方法。\n\n## 示例 - 固定长度流\n\n```java\nimport java.util.Arrays;\n\
    import java.util.List;\nimport java.util.stream.Stream;\n\npublic class FunctionTester\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Stream.of():\");\n        Stream<Integer> stream = Stream.of(1, 2, 3, 4, 5);\n\
    \        stream.forEach(System.out::println);\n\n        System.out.println(\"\
    Collection.stream():\");\n        Integer[] numbers = {1, 2, 3, 4, 5};\n     \
    \   List<Integer> list = Arrays.asList(numbers);\n        list.stream().forEach(System.out::println);\n\
    \n        System.out.println(\"StreamBuilder.build():\");\n        Stream.Builder<Integer>\
    \ streamBuilder = Stream.builder();\n        streamBuilder.accept(1);\n      \
    \  streamBuilder.accept(2);\n        streamBuilder.accept(3);\n        streamBuilder.accept(4);\n\
    \        streamBuilder.accept(5);\n        streamBuilder.build().forEach(System.out::println);\n\
    \    }\n}\n```\n\n### 输出\n\n```\nStream.of():\n1\n2\n3\n4\n5\n\nCollection.stream():\n\
    1\n2\n3\n4\n5\n\nStreamBuilder.build():\n1\n2\n3\n4\n5\n```\n\n"
