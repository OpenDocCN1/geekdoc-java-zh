  raw: 'A pure function does not modify any global variable or modify any reference
    passed as a parameter to it. So it has no side-effect. It always returns the same
    value when invoked with same parameters. Such functions are very useful and are
    thread safe. In example below, sum is a pure function.


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    int a, b;


    a =  1;


    b =  2;


    System.out.println(sum(a, b));


    }


    private  static  int sum(int a,  int b){


    return a + b;


    }


    }


    ### Output


    3


    # Functional Programming with Java – Composition


    Functional composition refers to a technique where multiple functions are combined
    together to a single function. We can combine lambda expression together. Java
    provides inbuilt support using Predicate and Function classes. Following example
    shows how to combine two functions using predicate approach.


    import java.util.function.Predicate;


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    Predicate<String> hasName = text -> text.contains("name");


    Predicate<String> hasPassword = text -> text.contains("password");


    Predicate<String> hasBothNameAndPassword = hasName.and(hasPassword);


    String queryString =  "name=test;password=test";


    System.out.println(hasBothNameAndPassword.test(queryString));


    }


    }


    ### Output


    true


    **Predicate** provides and() and or() method to combine functions. Whereas **Function** provides
    compose and andThen methods to combine functions. Following example shows how
    to combine two functions using Function approach.


    import java.util.function.Function;


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    Function<Integer,  Integer> multiply = t -> t *3;


    Function<Integer,  Integer>  add  = t -> t +  3;


    Function<Integer,  Integer>  FirstMultiplyThenAdd  = multiply.compose(add);


    Function<Integer,  Integer>  FirstAddThenMultiply  = multiply.andThen(add);


    System.out.println(FirstMultiplyThenAdd.apply(3));


    System.out.println(FirstAddThenMultiply.apply(3));


    }


    }


    ### Output


    18


    12


    # Eager vs Lazy Evaluation


    Eager evaluation means expression is evaluated as soon as it is encountered where
    as lazy evaluation refers to evaluation of an expression when needed. See the
    following example to under the concept.


    import java.util.function.Supplier;


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    String queryString =  "password=test";


    System.out.println(checkInEagerWay(hasName(queryString)


    , hasPassword(queryString)));


    System.out.println(checkInLazyWay(()  -> hasName(queryString)


    ,  ()  -> hasPassword(queryString)));


    }


    private  static  boolean hasName(String queryString){


    System.out.println("Checking name: ");


    return queryString.contains("name");


    }


    private  static  boolean hasPassword(String queryString){


    System.out.println("Checking password: ");


    return queryString.contains("password");


    }


    private  static  String checkInEagerWay(boolean result1,  boolean result2){


    return  (result1 && result2)  ?  "all conditions passed":  "failed.";


    }


    private  static  String checkInLazyWay(Supplier<Boolean> result1,  Supplier<Boolean>
    result2){


    return  (result1.get()  && result2.get())  ?  "all conditions passed":  "failed.";


    }


    }


    ### Output


    Checking name:


    Checking password:


    failed.


    Checking name:


    failed.


    Here checkInEagerWay() function first evaluated the parameters then executes its
    statement. Whereas checkInLazyWay() executes its statement and evaluates the parameter
    on need basis. As && is a short-circuit operator, checkInLazyWay only evaluated
    first parameter which comes as false and does not evaluate the second parameter
    at all.


    # Persistent Data Structure


    A data structure is said to be persistent if it is capable to maintaining its
    previous updates as separate versions and each version can be accessed and updated
    accordingly. It makes the data structure immutable and thread safe. For example,
    String class object in Java is immutable. Whenever we make any change to string,
    JVM creates another string object, assigned it the new value and preserve the
    older value as old string object.


    A persistent data structure is also called a functional data structure. Consider
    the following case −


    ## Non-Persistent way


    public  static  Person updateAge(Person person,  int age){


    person.setAge(age);


    return person;


    }


    ## Persistent way


    public  static  Person updateAge(Person pPerson,  int age){


    Person person =  new  Person();


    person.setAge(age);


    return person;


    }


    # Functional Programming with Java – Recursion


    Recursion is calling a same function in a function until certain condition are
    met. It helps in breaking big problem into smaller ones. Recursion also makes
    code more readable and expressive.


    ## Imperative vs Recursive


    Following examples shows the calculation of sum of natural numbers using both
    the techniques.


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    System.out.println("Sum using imperative way. Sum(5) : "  + sum(5));


    System.out.println("Sum using recursive way. Sum(5) : "  + sumRecursive(5));


    }


    private  static  int sum(int n){


    int result =  0;


    for(int i =  1; i <= n; i++){


    result = result + i;


    }


    return result;


    }


    private  static  int sumRecursive(int n){


    if(n ==  1){


    return  1;


    }else{


    return n + sumRecursive(n-1);


    }


    }


    }


    ### Output


    Sum using imperative way. Sum(5) : 15


    Sum using recursive way. Sum(5) : 15


    Using recursion, we are adding the result of sum of n-1 natural numbers with n
    to get the required result.


    ## Tail Recursion


    Tail recursion says that recursive method call should be at the end. Following
    examples shows the printing of a number series using tail recursion.


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    printUsingTailRecursion(5);


    }


    public  static  void printUsingTailRecursion(int n){


    if(n ==  0)


    return;


    else


    System.out.println(n);


    printUsingTailRecursion(n-1);


    }


    }


    ### Output


    5


    4


    3


    2


    1


    ## Head Recursion


    Head recursion says that recursive method call should be in the beginning of the
    code. Following examples shows the printing of a number series using head recursion.


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    printUsingHeadRecursion(5);


    }


    public  static  void printUsingHeadRecursion(int n){


    if(n ==  0)


    return;


    else


    printUsingHeadRecursion(n-1);


    System.out.println(n);


    }


    }


    ### Output


    1


    2


    3


    4


    5


    # Functional Programming with Java – Parallelism


    Parallelism is a key concept of functional programming where a big task is accomplished
    by breaking in smaller independent tasks and then these small tasks are completed
    in a parallel fashion and later combined to give the complete result. With the
    advent of multi-core processors, this technique helps in faster code execution.
    Java has Thread based programming support for parallel processing but it is quite
    tedious to learn and difficult to implement without bugs. Java 8 onwards, stream
    have parallel method and collections has parallelStream() method to complete tasks
    in parallel fashion. See the example below:


    import java.util.ArrayList;


    import java.util.Arrays;


    import java.util.List;


    public  class  FunctionTester  {


    public  static  void main(String[] args)  {


    Integer[] intArray =  {1,  2,  3,  4,  5,  6,  7,  8  };


    List<Integer> listOfIntegers =  new  ArrayList<>(Arrays.asList(intArray));


    System.out.println("List using Serial Stream:");


    listOfIntegers


    .stream()


    .forEach(e ->  System.out.print(e +  " "));


    System.out.println("");


    System.out.println("List using Parallel Stream:");


    listOfIntegers


    .parallelStream()


    .forEach(e ->  System.out.print(e +  " "));


    System.out.println("");


    System.out.println("List using Another Parallel Stream:");


    listOfIntegers


    .stream()


    .parallel()


    .forEach(e ->  System.out.print(e +  " "));


    System.out.println("");


    System.out.println("List using Parallel Stream but Ordered:");


    listOfIntegers


    .parallelStream()'
