    # Functional Programming - Terminal Methods


    When a terminal method in invoked on a stream, iteration starts on stream and
    any other chained stream. Once the iteration is over then the result of terminal
    method is returned. A terminal method does not return a Stream thus once a terminal
    method is invoked over a stream then its chaining of non-terminal methods or intermediate
    methods stops/terminates.'
