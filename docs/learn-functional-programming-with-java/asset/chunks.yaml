    \ = item -> item * item;\n        for(int i = 0; i < array.length; i++){\n   \
    \         System.out.println(squareMaker.square(array[i]));\n        }\n    }\n\
    }\n\ninterface SquareMaker {\n    int square(int item);\n}\n```\n\n### Output\n\
