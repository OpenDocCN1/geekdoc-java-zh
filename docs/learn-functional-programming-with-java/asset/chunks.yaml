- fmt: "\nGenerally, terminal methods returns a single value and are invoked on each\
    \ element of the stream. Following are some of the important terminal methods\
    \ of `Stream` interface. Each terminal function takes a predicate function, initiates\
    \ the iterations of elements, apply the predicate on each element.\n\n- `anyMatch`\
    \ — If predicate returns true for any of the element, it returns true. If no element\
    \ matches, false is returned.\n- `allMatch` — If predicate returns false for any\
    \ of the element, it returns false. If all element matches, true is returned.\n\
    - `noneMatch` — If no element matches, true is returned otherwise false is returned.\n\
    - `collect` — each element is stored into the collection passed.\n- `count` —\
    \ returns count of elements passed through intermediate methods.\n- `findAny`\
    \ — returns `Optional` instance containing any element or empty instance is returned.\n\
    - `findFirst` — returns first element under `Optional` instance. For empty stream,\
    \ empty instance is returned.\n- `forEach` — apply the consumer function on each\
    \ element. Used to print all elements of a stream.\n- `min` — returns the smallest\
    \ element of the stream. Compares elements based on comparator predicate passed.\n\
    - `max` — returns the largest element of the stream. Compares elements based on\
    \ comparator predicate passed.\n- `reduce` — reduces all elements to a single\
    \ element using the predicate passed.\n- `toArray` — returns arrays of elements\
    \ of stream.\n\n## Example - Terminal Methods\n\n```java\nimport java.util.Arrays;\n\
    import java.util.List;\nimport java.util.stream.Collectors;\n\npublic class FunctionTester\
    \ {\n    public static void main(String[] args) {\n        List<String> stringList\
    \ = Arrays.asList(\"One\", \"Two\", \"Three\", \"Four\", \"Five\", \"One\");\n\
    \n        System.out.println(\"Example - anyMatch\\n\");\n        //anyMatch -\
    \ check if Two is present?\n        System.out.println(\"Two is present: \" +\
    \ stringList.stream().anyMatch(s -> { return s.contains(\"Two\");}));\n\n    \
    \    System.out.println(\"\\nExample - allMatch\\n\");\n        //allMatch - check\
