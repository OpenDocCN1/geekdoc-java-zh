    \ − 如果一个函数在一个特定值的 monad 上进行 bind，那么其结果将与函数作用于该值的结果相同。\n*   `右恒等 (Right Identity)`\
    \ − 如果 monad 的返回方法与原始值的 monad 相同。\n*   `结合律 (Associativity)` − 函数可以按任何顺序应用于 monad\
    \ 上。\n\n## Optional 类\n\nJava 8 引入了作为 monad 的 `Optional` 类。它提供了与 monad 等效的操作。例如，`return`\
    \ 是一个接收值并返回 monad 的操作。`Optional.of()` 接收参数并返回 `Optional` 对象。在类似的基础上，`bind` 是将函数绑定到\
    \ monad 以产生新 monad 的操作。`Optional.flatMap()` 是在 `Optional` 上执行操作并将结果作为 `Optional`\
