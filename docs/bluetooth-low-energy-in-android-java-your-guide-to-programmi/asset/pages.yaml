  md: 'The peripheral will advertise its name and other data over one channel and
    then another. This is called frequency hopping (Figure 4-1).


    ![](img/569bba23711611c20b6748d47fc1c944_79_0.png)


    **Figure 4-1. Advertise and scan processes**


    Similarly, the Central listens for advertisements first on one channel and then
    another. The Central hops frequencies faster than the Peripheral, so that the
    two are guaranteed to be on the same channel eventually.


    Peripherals may advertise from 100ms to 100 seconds'
