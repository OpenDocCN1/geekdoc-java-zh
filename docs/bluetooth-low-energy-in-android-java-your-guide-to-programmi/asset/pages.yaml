    # Programming the Central


    The Central can be programmed to read the GATT Profile of the Peripheral after
    connection.


    This is done by attaching a callback function to the connection gets called when
    the Central successfully connects to the Peripheral. When that happens, the Central
    requests the Service listing from the connected Peripheral, using the following
    command:


    ```

    mBluetoothGatt.discoverServices();

    ```


    This will prompt the Central to begin scanning the Peripheral for Services. The
    same BluetoothGattCallback used to handle the connection state change offers a
    callback specifically for discovered Services. This callback is executed when
    the Services are discovered.


    Table 6-2. BluetoothGattCallback'
