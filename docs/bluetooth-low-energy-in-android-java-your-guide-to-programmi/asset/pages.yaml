  md: 'Figure 14-1. How a Remote Control LED works


    In all the other examples, text was being sent between Central and Peripheral.


    In order for the Central and Peripheral to understand each other, they need shared
    language between them. In this case, a data packet format.


    # Sending Commands to Peripheral


    When the Central sends a message, it should be able to specify if it is sending
    a command or an error. We can do this in two bytes, like this (Figure 13-2).


    | 0 | 1 |

    |---|---|

    | Command | Footer |


    Figure 13-2. Packet structure for commands


    The Peripheral reads the footer byte of the incoming'
