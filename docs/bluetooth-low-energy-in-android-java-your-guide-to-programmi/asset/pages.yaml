- img_proc: true
  md: '```

    private double getDistanceFromRSSI(

    int rssi, int referenceRssi, float propagationConstant) {

    float exponent = (referenceRssi - rssi)/(10*propagationConstant);

    double distance = Math.pow(10, exponent);

    return distance;

    }

    ```


    Due to radio interference and absorption from surrounding items, the radio propagation
    constant, n, varies a lot from environment to environment and even step to step.
    This makes it very difficult to know the exact distance between a Central and
    an iBeacon. The radio propagation constant can be approximated by testing the
    iBeacon’s RSSI at 1 meter in conditions similar to what is expected in the field.


