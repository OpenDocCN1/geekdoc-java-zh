  md: '# API Compatibility


    Android phones were first created by Google in 2008. Periodically, Google periodically
    releases updates that enable newer or more advanced features to be programmed.
    Each feature release is called an API level. Higher API levels have newer and
    more improved features but take time before users adopt them. Therefore, not every
    user has access to the newest features.


    Bluetooth Low Energy was implemented in Android API level 18. At the time of this
    writing, the latest API level is 23, which corresponds to user version 6, Android
    “Marshmallow.” Bluetooth Central mode is supported on most devices with API level
    18 or higher.


    Bluetooth Peripheral mode is only supported in API level 21 (Android 5) or greater.
    Even with this API level, many phones do not have hardware support. A non-exhaustive
    list of supported hardware is available in Appendix VII: Android Peripheral Mode
    Support.


    When the latest API level is used for development fewer people can use the program.
    When an older API level is used, more people can use the program but fewer features'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'are supported. For this reason, choosing an API level is a tension between
    supporting more users and supporting more features.


    We will support support Android API level 18 and higher for Central mode, and
    API level 21 or higher for Peripheral mode. These are the oldest version of the
    Android API that supports Bluetooth Low Energy but has the most compatible devices.


    As you can see from the graph below, nearly 75% of Android users have phones that
    support API level 18 or higher as of February 2016 (Figure 2-4).'
