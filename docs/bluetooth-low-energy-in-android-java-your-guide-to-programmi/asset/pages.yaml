  md: '# Glossary


    The following is a list of Bluetooth Low Energy terms and their meanings.


    **Android** - An open-source operating system used for smartphones and tablet
    computers


    **Attribute** - An unit of a GATT Profile which can be accessed by a Central,
    such as a Service or a Characteristic.


    **Beacon** - A Bluetooth Low Energy Peripheral which continually Broadcasts so
    that Centrals can discern their location from information gleaned from the properties
    of the broadcast.


    **Bluetooth Low Energy (BLE)** - A low power, short range wireless protocol used
    on micro electronics.


    **Broadcast** - A feature of Bluetooth Low Energy where a Peripheral outputs a
    name and other specific data about itself'
  merge: -1
  pgno: 1065
- img_proc: true
  md: 'Central - A Bluetooth Low Energy device that can connect to several Peripherals.


    Channel - A finely-tuned radio frequency used for Broadcasting or data transmission.


    Characteristic - A port or data endpoint where data can be read or written.


    Descriptor - A feature of a Characteristic that allows for some sort of data interaction,
    such as Read, Write, or Notify.


    E0 - The encryption algorithm built into Bluetooth Low Energy.


    Generic Attribute (GATT) Profile - A list of Services and Characteristics which
    are unique to a Peripheral and describe how data is served from the Peripheral.
    GATT profiles are hosted by a Peripheral


    iBeacon - An Apple compatible Beacon which allows a Central to download a specific
    packet of data to inform the Central of its absolute location and other properties.


    Notify - An operation where a Peripheral alerts a Central of a change in data.'
  merge: -1
  pgno: 1066
- img_proc: true
  md: 'Peripheral - A Bluetooth Low Energy device that can connect to a single Central.
    Peripherals host a Generic Attribute (GATT) profile.


    Read - An operation where a Central downloads data from a Characteristic.


    Scan - The process of a Central searching for Broadcasting Peripherals.


    Scan Response - A feature of Bluetooth Low Energy which allows Centrals to download
    a small packet of data without connecting.


    Service - A container structure used to organize data endpoints. Services are
    hosted by a Peripheral.


    Universally Unique Identifier (UUID) - A long, randomly generated alphanumeric
    sting that is unique regardless of where it''s used. UUIDs are designed to avoid
    name collisions that may happen when countless programs are interacting with each
    other.


    Write - An operation where a Central alters data on a Characteristic.'
  merge: -1
