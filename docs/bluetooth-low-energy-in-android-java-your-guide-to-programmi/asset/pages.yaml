    # Programming the Peripheral


    The Echo Server will handle incoming writes on one Characteristic (0x2a57) and
    echo back messages on another Characteristic (0x2a56).


    It will also host a minimal GATT Profile that includes a battery percentage, device
    name, model number, and serial number.


    # Permissions


    To work with Bluetooth Low Energy, in Android, first enable the manifest section
    of the Android Manifest:


    ```

    <uses-permission android:name="android.permission.BLUETOOTH"/>

    ```


    ```

    <uses-feature android:name="android.hardware.bluetooth_le"

    ```


    ```

    android:required="true" />

    ```'
