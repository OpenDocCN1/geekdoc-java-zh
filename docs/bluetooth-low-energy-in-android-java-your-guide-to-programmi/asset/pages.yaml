    # Programming the Peripheral


    Often, battery life is at a premium on Bluetooth Peripherals. For this reason,
    it is useful to notify a connected Central when a Characteristic’s value has changed,
    but not send the new data to the Central. Waking up the Bluetooth radio to send
    one byte consumes less battery than sending 20 or more bytes.


    Notifications can be enabled in a Characteristic by creating the Client Characteristic
    Configuration (0x2902) Descriptor and giving the Characteristic Descriptors PERMISSON_WRITE
    permission.


    For example, this Characteristic supports both read access and notifications


    ```

    public static final UUID CHARACTERISTIC_UUID = \

    UUID.fromString("00002a56-0000-1000-8000-00805f9b34fb");

    ```'
