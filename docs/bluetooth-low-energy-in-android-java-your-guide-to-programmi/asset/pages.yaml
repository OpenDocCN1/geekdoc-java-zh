    # Programming the Central


    The previous chapter’s App showed how to discover nearby Peripherals. Using the
    MAC address of a known Peripheral, Android can connect to that Peripheral when
    in range.


    Connecting to the device is as simple as grabbing the Peripheral’s MAC address
    and sending a connection request, like this:


    ```

    String deviceAddress = "00:A0:C9:14:C8:3A";

    BluetoothDevice device = bluetoothAdapter.getRemoteDevice(deviceAddress);

    device.connectGatt(context, false, gattCallback);

    ```


    Connecting to the Bluetooth Device will expose a lot of potential events, from
    connection and disconnection, to read and write events. These are packaged in
    the BluetoothGattCallback class, which must be implemented to respond to events
    triggered by the Bluetooth device.'
