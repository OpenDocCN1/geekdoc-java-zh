    # Permissions


    To work with Bluetooth Low Energy, in Android, first enable the manifest section
    of the Android Manifest:


    ```

    <uses-permission android:name="android.permission.BLUETOOTH"/>

    ```


    ```

    <uses-feature android:name="android.hardware.bluetooth_le"

    android:required="true" />

    ```


    To turn on the Bluetooth radio programmatically, also enable Bluetooth admin permissions:


    ```

    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>

    ```


    Additionally, since this app controls the camera flash, permissions must be requested
    for those features as well:


    ```

    <uses-permission android:name="android.permission.CAMERA" />

    ```'
