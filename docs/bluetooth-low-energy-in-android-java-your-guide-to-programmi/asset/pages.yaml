    # Programming the Peripheral


    This chapter will show how to handle connections from a nearby Central. When a
    Central connects or disconnects, the Peripheral is notified through an event callback.


    It is important to know that Android peripherals have a bug that causes the MAC
    address to change between connections.


    This callback exposes a lot of potential events, from connection and disconnection,
    to read and write events. These are packaged in the BluetoothGattServerCallback
    class, which must be implemented to respond to events triggered by the Bluetooth
    device.


    Those events include:


    Table 4-2. BluetoothGattServerCallback


    | Event | Desc |

    |---|---|'
