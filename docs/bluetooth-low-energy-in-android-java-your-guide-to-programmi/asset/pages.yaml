  md: '# Introduction


    In this book you will learn the basics of how to program Central and Peripheral
    devices that communicate over Bluetooth Low Energy using Java on Android. These
    tutorials will culminate in three projects:


    +   - A Beacon and Scanner

    - A Echo Server and Client

    - A Remote Controlled Device


    Through the course of the book you will learn important concepts that relate to:


    How Bluetooth Low Energy works,

    How data is sent and received


    Common paradigms for handling data'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'This book is an excellent read for anyone familiar with Android programming,
    who wants to build an Internet of Things device or a tool that communicates with
    a Bluetooth device.


    # Overview


    Bluetooth Low Energy (BLE) is a digital radio protocol. Very simply, it works
    by transmitting radio signals from one computer to another.


    Bluetooth supports a hub-and-spoke model of connectivity. One device acts as a
    hub, or “Central” in Bluetooth terminology. Other devices act as “Peripherals.”


    A Central may hold several simultaneous connections with a number of peripherals,
    but a peripheral may only hold one connection at a time (Figure 1-1). Hence the
    names Central and Peripheral.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '![](img/569bba23711611c20b6748d47fc1c944_14_0.png)


    Figure 1-1. Bluetooth network topology


    For example, your smartphone acts as a Central. It may connect to a Bluetooth
    speaker, lamp, smartwatch, and fitness tracker. Your fitness tracker and speaker,
    both Peripherals, can only be connected to one smartphone at a time.


    The Central has two modes: scanning and connected. The Peripheral has two modes:
    advertising and connected. The Peripheral must be advertising for the Central
    to see it.


    # # Advertising'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'A Peripheral advertises by advertising its device name and other information
    on one radio frequency, then on another in a process known as frequency hopping.
    In doing so, it reduces radio interference created from reflected signals or other
    devices.


    # Scanning


    Similarly, the Central listens for a server’s advertisement first on one radio
    frequency, then on another until it discovers an advertisement from a Peripheral.
    The process is not unlike that of trying to find a good show to watch on TV.


    The time between radio frequency hops of the scanning Central happens at a different
    speed than the frequency hops of the advertising Peripheral. That way the scan
    and advertisement will eventually overlap so that the two can connect.


    Each device has a unique media access control address (MAC address) that identifies
    it on the network. Peripherals advertise this MAC address along with other'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'information about the Peripheral’s settings.


    # Connecting


    A Central may connect to a Peripheral after the Central has seen the Peripheral’s
    advertisement. The connection involves some kind of handshaking which is handled
    by the devices at the hardware or firmware level.


    While connected, the Peripheral may not connect to any other device.


    # Disconnecting


    A Central may disconnect from a Peripheral at any time. The Peripheral is aware
    of the disconnection.


    # Communication'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'A Central may send and request data to a Peripheral through something called
    a “Characteristic.” Characteristics are provided by the Peripheral for the Central
    to access. A Characteristic may have one or more properties, for example READ
    or WRITE. Each Characteristic belongs to a Service, which is like a container
    for Characteristics. This paradigm is called the Bluetooth Generic Attribute Profile
    (GATT).


    The GATT paradigm is laid out as follows (Figure 1-2).


    ![](img/569bba23711611c20b6748d47fc1c944_17_0.png)


    Figure 1-2. Example GATT Structure'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'To transmit or request data from a Characteristic, a Central must first connect
    to the Characteristic’s Service.


    For example, a heart rate monitor might have the following GATT profile, allowing
    a Central to read the beats per minute, name, and battery life of the server (Figure
    1-3).


    ![](img/569bba23711611c20b6748d47fc1c944_18_0.png)


    Figure 1-3. Example GATT structure for a heart monitor


    In order to retrieve the battery life of the Characteristic, the Central must
    be connected also to the Peripheral’s'
  merge: -1
  pgno: 18
- img_proc: true
  md: '“Device Info” Service.


    Because a Characteristic is provided by a Peripheral, the terminology refers to
    what can be done to the Characteristic. A “write” occurs when data is sent to
    the Characteristic and a “read” occurs when data is downloaded from the Characteristic.


    To reiterate, a Characteristic is a field that can be written to or read from.
    A Service is a container that may hold one or more Characteristics. GATT is the
    layout of these Services and Characteristics. Characteristic can be written to
    or read from.


    # Byte Order


    Bluetooth orders data in both Big-Endian and Little-Endian depending on the context.


    During advertisement, data is transmitted in Big Endian, with the most significant
    bytes of a number at the end (Figure 1-4).'
  merge: -1
  pgno: 19
- img_proc: true
  md: '0-255 256-511 512-767 768-1023 1024-1279 1280-1535 1536-1791 1792-2047

    int F5 A3 01 00 00 00 00 00


    ![](img/569bba23711611c20b6748d47fc1c944_20_0.png)


    **Figure 1-4. Big Endian byte order**


    Data transfers inside the GATT however are transmitted in Little Endian, with
    the least significant byte at the end (Figure 1-5).


    1792-2047 1536-1791 1280-1535 1024-1279 768-1023 512-767 256-511 0-255

    int 00 00 00 00 00 00 01 A3 F5


    ![](img/569bba23711611c20b6748d47fc1c944_20_1.png)


    **Figure 1-5. Little Endian byte order**'
  merge: -1
