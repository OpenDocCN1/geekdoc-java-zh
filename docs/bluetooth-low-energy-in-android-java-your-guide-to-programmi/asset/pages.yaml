- img_proc: true
  md: 'iBeacons are beacons that advertise information about their location and advertise
    intensity using the Scan Result feature of Bluetooth Low Energy.


    The Scan Result allows a Central to read information from a Peripheral without
    connecting to it, in much the same way that the Device name is advertised.


    There are only two tricks to creating an iBeacon client in Android:


    iBeacons are identified by their network (MAC) address instead of name, because
    all iBeacons for the same location service have the same name.


    The distance to the iBeacon is calculated based on the RSSI.


    iBeacons do this by advertising certain data that can be referenced when looking
    up where the iBeacons are located.


    # Table 11-1. iBeacon Advertised data


    | Data | Position | Length | Des |

    | --- | --- | --- | --- |'
