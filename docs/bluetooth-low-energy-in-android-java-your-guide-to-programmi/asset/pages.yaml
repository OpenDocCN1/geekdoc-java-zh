    to a Characteristic


    In order to support notifications, a Characteristics must have the Client Characteristic
    Configuration (0x2902) Descriptor, which must be writable. Centrals can subscribe
    to notifications by setting the Descriptor value:


    Table 9-1. Client Characteristic Configuration Descriptor values


    | Value | Description |

    | --- | --- |

    | 0x0100 | Enable notifications |

    | 0x0000 | Disable notifications |


