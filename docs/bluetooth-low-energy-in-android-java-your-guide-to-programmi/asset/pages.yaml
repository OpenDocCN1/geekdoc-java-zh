    | --- | --- |

    | onConnectionStateChange | Triggered when a device connects or disconnects |

    | onServicesDiscovered | Triggered when GATT are discovered |

    | onCharacteristicRead | Triggered when data is downloaded from a Characteristic
    |

    | onCharacteristicWrite | Triggered when data is uploaded to a Characteristic
    |

    | onCharacteristicChanged | Triggered when a Characteristic''s data changes |


    There are Primary Services and Secondary services. Secondary Services are contained
    within other Services; Primary Services are not. The type of Service can be discovered
    by inspecting the SERVICE_TYPE_PRIMARY flag.


