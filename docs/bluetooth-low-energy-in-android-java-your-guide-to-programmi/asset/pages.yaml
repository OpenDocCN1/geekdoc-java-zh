  md: 'message to determine the type of message, i.e., an error or a command. For
    example, define the message types as:


    # Table 13-1. Footer Values


    | Name | Value | Description |

    | --- | --- | --- |

    | bleResponseError | 0 | The Central error |

    | bleResponseConfirmation | 1 | The Central confirmation |

    | bleResponseCommand | 2 | The Central command |


    The Peripheral reads the first byte to determine the type of error or command.
    For example, define the commands as:


    # Table 13-2. Command Values


    | Name | Value | Description |

    | --- | --- | --- |

    | bleCommandLedOff | 1 | Turn off the Peripheral |'
