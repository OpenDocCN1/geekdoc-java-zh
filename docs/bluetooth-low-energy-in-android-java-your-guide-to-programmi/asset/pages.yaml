  md: '# Calculate Distance Between iBeacons


    Calculate the distance between iBeacons P1 and P2 using Pythagorean Theorem (Figure
    11-8).


    ![](img/569bba23711611c20b6748d47fc1c944_578_0.png)


    Figure 12-8. Derived distance from iBeacon 1 to iBeacon 2


    d=|P2-P1|


    Which is short-hand for this:


    d=(P2x-P1x)2+(P2y-P1y)2


    This is expressed in code as follows:


    ```

    double adjacent = p2.getX() - p1.getX();

    ```


    ```

    double opposite = p2.getY() - p1.getY();

    ```


    ```

    double d = Math.sqrt(adjacent * adjacent + opposite * opposite);

    ```'
