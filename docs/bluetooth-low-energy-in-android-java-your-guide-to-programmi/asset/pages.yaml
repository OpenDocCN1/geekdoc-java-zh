  md: 'Figure 7-1. The process of a Central reading data from a Peripheral


    A Central can read a Characteristic repeatedly, regardless if Characteristic’s
    value has changed.


    # # Programming the Central


    Before reading data from a connected Peripheral, it may be useful to know if a
    Characteristic provides read permission. Read permission can be read by getting
    the Characteristic property bit map and isolating the read property from it, like
    this:


    ```

    int permissions = characteristic.getProperties(); // fetch permissions

    ```


    ```

    boolean isReadable = permissions &

    BluetoothGattCharacteristic.PROPERTY_READ;

    ```


    Once the Central has a Bluetooth GATT connection and has access to a Characteristic
    with which to communicate with a connected Peripheral, the Central can request
    to read data from that Characteristic like this:'
  merge: -1
  pgno: 328
- img_proc: true
  md: '```

    bluetoothGatt.readCharacteristic(characteristic);

    ```


    This will initiate a read request from the Central to the Peripheral.


    When the Central finishes reading data from the Peripheral’s Characteristic, the
    onCharacteristicRead method is triggered the BluetoothGattCallback object.


    Table 7-1. BluetoothGattCallback


    | Event | Description |

    | --- | --- |

    | onConnectionStateChange | Triggered when a Peripheral connects or disconnects
    |

    | onServicesDiscovered | Triggered when GATT services are discovered |

    | onCharacteristicRead | Triggered when data is downloaded from a Characteristic
    |

    | onCharacteristicWrite | Triggered when data is uploaded to a GATT Characteristic
    |'
