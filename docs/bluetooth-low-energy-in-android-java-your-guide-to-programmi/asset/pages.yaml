    | Manufacturer ID | 6 | 2 | A numeric va represents the |

    | UUID | 9 | 16 | All iBeacons have the same |

    | Major | 25 | 2 | A top level nu |

    | Minor | 27 | 2 | A numeric id Major numbe |

    | Transmission Power | 29 | 1 | Tells what the power is in m |


    This data stored as binary in the Peripheral''s advertising data. Unlike other
    data in Bluetooth Low Energy, numeric values in this packet are stored in big
    endian format (Figure 11-4).'
