- img_proc: true
  md: '# # Programming the Central


    Before attempting to write data a Characteristic, it is useful to know if the
    Characteristic has “write” permissions. Write permissions can be read by accessing
    a Characteristic’s properties and isolating the Write properties:


    ```

    int permissions = characteristic.getProperties(); // fetch permissions


    boolean isWriteable = permissions &


    (BluetoothGattCharacteristic.PROPERTY_WRITE | BluetoothCharacteristic.PROPERTY_WRITE_NO_RESPONSE);

    ```


    To send data to the peripheral, the Central must set the local Characteristic
    cache, then push the update to the Peripheral:


    ```

    characteristic.setValue(message); // set local cache

    bluetoothGatt.writeCharacteristic(characteristic); // update remote Peripheral

    ```


    The message can be an int, String, or by byte array. When working with complex
    or long data, it may be easier to'
  merge: -1
  pgno: 406
- img_proc: true
  md: 'convert the data to a byte array. As a trivial example, a String can be converted
    to a byte array like this:


    ```

    byte[] temp = message.getBytes();

    ```


    Just as when reading numbers from a Characteristic, the endianness of the number
    must be changed to Little-Endian before transmitting over Bluetooth. For example,
    this is how to write an Integer to a Characteristic:


    ```

    ByteBuffer byteBuffer = ByteBuffer.wrap(bytes, ByteOrder.BIG_ENDIAN);

    ```


    ```

    byteBuffer.order(ByteOrder.LITTLE_ENDIAN); // switch to little-endian

    ```


    ```

    int message = byteBuffer.getInt();

    ```


    ```

    characteristic.setValue(message); // set local cache

    ```


    ```

    bluetoothGatt.writeCharacteristic(characteristic); // update remote Peripheral

    ```


    When the Central has been successfully written to, the onCharacteristicWrite event
    gets triggered in the BluetoothGattCallback.


