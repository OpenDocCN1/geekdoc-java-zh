    The Scan Result allows a Central to read information from a Peripheral without
    connecting to it, in much the same way that the advertising name is read.


    Although Android supports iBeacon scanning, it does not support iBeacon advertising.
    Therefore it is possible to build an app that discovers iBeacons but not possible
    to create an iBeacon in Android'
