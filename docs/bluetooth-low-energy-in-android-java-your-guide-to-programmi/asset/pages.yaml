  md: 'Service that is within another Service is called a Secondary Service.


    Characteristics have a maximum value length of 20 bytes and have internal settings
    called Descriptors that can be modified. Descriptors are identified with UUIDs
    One important Descriptor that will be talked about later is the Client Characteristic
    Configuration (0x2902), which allows a connected Central to subscribe to change
    notifications from that Characteristic.


    For a list of reserved Descriptors, see **Appendix V: GATT Descriptors.**


    # Table 6-1. Characteristic Permissions


    | Descriptor | Description |

    |---|---|

    | Read | Central can read this Characteristic and set the value. |

    | Write | Central can write to this Characteristic Peripheral will be notified
    when Characteristic value changes and write operation occurs. |'
  merge: -1
