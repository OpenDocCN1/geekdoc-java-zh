  md: '# Advertise


    A feature of Bluetooth Low Energy where a Peripheral outputs a name and other
    specific data about itself


    # Attribute


    A unit of GATT Profile which can be accessed by a Central, such as a Service or
    a Characteristic.


    # Beacon


    A Bluetooth Low Energy Peripheral which continually Advertises so that Centrals
    can discern their location from information gleaned from the properties of the
    advertise.


    # Big-endian


    A mechanism for storing numbers in binary, where the most significant value of
    the number is stored first, typically represented towards the right of the screen.


    # Bluetooth Low Energy (BLE)


    A low-power, short-range wireless protocol for use with micro electronics.


    # Central


    A Bluetooth Low Energy device that can connect to several Peripherals.


    # Channel


    A finely-tuned radio frequency used for Advertising or data transmission.


    # Characteristic


    A port or data endpoint where data can be read or written.


    # Descriptor


    A feature of a Characteristic that allows for some sort of data interaction, such
    as Read, Write, or Notify.


    # E0


    The encryption algorithm built into Bluetooth Low Energy.


    # Generic Access Profile (GAP)


    Identifying information about a Peripheral that identifies the Peripheral by name,
    service listing, connectability, or other custom data. This data is accessible
    after connection and is stored in big endian format.


    # iBeacon


    An Apple-compatible Beacon which allows a Central to download a specific packet
    of data to inform the Central of its absolute location and other properties.'
  merge: -1
  pgno: 1076
- img_proc: true
  md: '# Little-Endian


    A mechanism for storing numbers in binary, where the least significant values
    of the number are store first, typically represented towards the right of the
    screen.


    # Notify


    An operation where a Peripheral alerts a Central of a change in data.


    # Peripheral


    A Bluetooth Low Energy device that can connect to a single Central. Peripherals
    host a Generic Attribute (GATT) profile.


    # Read


    An operation where a Central downloads data from a Characteristic.


    # Scan


    The process of a Central searching for Advertising Peripherals.


    # Scan Response


    A feature of Bluetooth Low Energy which allows Centrals to download a small packet
    of data without connecting.


    # Service


    A container structure used to organize data endpoints. Services are hosted by
    a Peripheral.


    # Universally Unique Identifier (UUID)


    A long, randomly generated alphanumeric string that is unique regardless of where
    it''s used. UUIDs are designed to avoid name collisions that may happen when countless
    programs are interacting with each other.


    # Write


    An operation where a Central alters data on a Characteristic.


    # Android


    An open-source operating system used for smartphones and tablet computers'
