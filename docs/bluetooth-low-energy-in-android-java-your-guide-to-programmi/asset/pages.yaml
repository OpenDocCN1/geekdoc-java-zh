- img_proc: true
  md: 'Bluetooth has a 20-byte maximum packet size. Longer messages must be divided
    and sent in parts. Both the client and server need a way to know if the data being
    transmitted belongs to part of a larger transmission.


    One easy way to do this with text is to append a newline character to the end
    of the outbound transmission.


    ```

    String sendText = "Hello World";

    ```


    ```

    String message = sendText.getText().toString()+"\n"

    ```


    When the message is broken apart for transmission, the parts are reassembled properly
    and the new line at the end separates new messages into new lines.


    Everything else works the same way as any other Bluetooth app.


