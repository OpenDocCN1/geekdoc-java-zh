    tree-like structure for organizing Bluetooth I/O.


    These Services UUIDs have been reserved for special contexts, such as Device Information
    (0x180A) Which may contain Characteristics that communicate information about
    the Peripheral''s name, version number, or settings.


    Note: All Bluetooth Peripherals should have a Battery Service (0x180F) Service
    containing a Battery Level (0x2A19) Characteristic.


