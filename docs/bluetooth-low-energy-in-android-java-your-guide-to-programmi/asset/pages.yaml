  md: '# Project: iBeacon


    Beacons can be used for range finding or spacial awareness. iBeacons are a special
    type of Beacon that is widely supported by the industry. It supports certain data
    that identifies the iBeacons to makes range finding and spacial awareness easier
    across platforms.


    Due to the nature of how radio signals diminish intensity with distance, Bluetooth
    Peripherals can be used both for range finding and spacial awareness.


    # Range Finding


    Bluetooth signals can be used to approximate the distance between a Peripheral
    and a Central because the radio signal quality drops off in a predictable way
    with distance. The diagram below shows how the signal might drop as distance increases
    (Figure 11-1).'
  merge: -1
  pgno: 564
- img_proc: true
  md: '![](img/569bba23711611c20b6748d47fc1c944_565_0.png)


    Figure 11-1. Distance versus Bluetooth Signal Strength


    This drop-off rate, known as the Inverse-Square Law, is universal with electromagnetic
    radiation.


    Due to radio interference and absorption from surrounding items, the radio signal
    propagation varies a lot from environment to environment, and even step to step.
    This makes it very difficult to know the precise distance between a Central and
    an iBeacon.


    One or more Centrals can approximate their distance from a single iBeacon without
    connecting.'
  merge: -1
  pgno: 565
- img_proc: true
  md: '# Spacial Awareness


    A Central can approximate its position in space using a process called trilateration.
    Trilateration works by a computing series of equations when both the distance
    from and location of nearby iBeacons are known (Figure 11-2).


    ![](img/569bba23711611c20b6748d47fc1c944_566_0.png)


    Figure 11-2. Example Central and iBeacon positions in a room


    This is a pretty math-intensive process, but it’s all based on the Pythagoras
    Theorem. By calculating the shape of the triangles made from the relative positions
    of all the iBeacons and the Central, one can determine the location of the Central
    (Figure 11-3).'
  merge: -1
