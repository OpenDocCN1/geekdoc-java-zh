  md: '# About this Book


    This book is a practical guide to programming Bluetooth Low Energy for Android
    phones and Tablets


    In this book, you will learn the basics of how to program an Android device to
    communicate with any Central or Peripheral device over Bluetooth Low Energy. Each
    chapter of the book builds on the previous one, culminating in three projects:


    +   - A Beacon and Scanner

    - An Echo Server and Client

    - A Remote Controlled Device


    Through the course of the book you will learn important concepts that relate to:


    +   - How Bluetooth Low Energy works

    - How data is sent and received'
