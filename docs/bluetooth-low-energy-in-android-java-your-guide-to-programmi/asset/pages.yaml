  md: '# Streaming Data


    The maximum packet size you can send over Bluetooth Low Energy is 20 bytes. More
    data can be sent by dividing a message into packets of 20 bytes or smaller, and
    sending them one at a time


    These packets can be sent at a certain speed.


    Bluetooth Low Energy transmits at 1 Mb/s. Between the data transmission time and
    the time it may take for a Peripheral to process incoming data, there is a time
    delay between when one packet is sent and when the next one is ready to be sent.


    To send several packets of data, a queue/notification system must be employed,
    which alerts the Central when the Peripheral is ready to receive the next packet.


    There are many ways to do this. One way is to set up a Characteristic with read,
    write, and notify permissions, and to flag the Characteristic as “ready” after
    a write has'
  merge: -1
  pgno: 527
- img_proc: true
  md: 'been processed by the Peripheral. This sends a

    notification to the Central, which sends the next packet.

    That way, only one Characteristic is required for a single

    data transmission.


    This process can be visualized like this (Figure 10-1).'
