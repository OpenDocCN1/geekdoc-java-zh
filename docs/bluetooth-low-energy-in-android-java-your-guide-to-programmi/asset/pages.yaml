  md: 'In this way, a common language is established between the Central and the Peripheral.


    # Gatt Profile


    The Bluetooth Low Energy specification provides a special Service, the Automation
    IO Service (0x1815), specifically for remote control devices such as this.


    It is a best practice to use each Characteristic for a single purpose. For this
    reason, Characteristic 0x2a56 will be used for sending commands to the Peripheral
    and Characteristic 0x2a57 will be used for responses from the Peripheral:


    Table 13-4. Characteristic Purposes


    | UUID | Purpose |

    |---|---|

    | 0x2a56 | Send commands from Central |

    | 0x2a57 | Send responses from Peripheral |'
