    # Programming the Peripheral


    The Peripheral can be programmed to host a GATT Profile - the tree structure of
    Services and Characteristics that a connected Central will use to communicate
    with the Peripheral.


    Services are created and added to the Peripheral''s GATT Server via the BluetoothGattServer
    class. Instantiation requires the definition of a BluetoothGattServerCallback,
    which triggers callbacks when Characteristics are read from or written to.


    New services are created and added to the Peripheral like this:


    ```

