    # Challenge


    # Challenge 7.0: Fizz Buzz


    Fizz Buzz is a common programming job interview question. It is easy to know the
    different parts of a language, such as for a loop, and if a statement. But this
    challenge is designed to test if a programmer is able to put the mechanisms together
    into a coherent working program.


    The objective of this challenge is to print the numbers from 1 to 100 using print,
    except:


    +   Every number is evenly divisible by three, we should print "Fizz" instead
    of the number.


    +   Every number is evenly divisible by five, we should print "Buzz" instead of
    the number.


    The output of your program should be as follows:


    ```

    1 2 4 Fizz! 7 8 Fizz! Buzz! 11 13 14 Fizz!Buzz! 16 17 Fizz! 19

    Buzz Fizz! 22 23 Fizz! Buzz! 26 Fizz! 28 29 Fizz!Buzz! 31 32 Fizz! 34 Buzz! Fizz!
    37

    38 Fizz! 41 Fizz! 44 Buzz! Fizz! 46 47 Fizz! 49 Buzz! 52 53 Fizz! Buzz!

    56 Fizz! 58 59 Fizz! 61 62 Fizz! 64 Buzz! Fizz! 67 68 Fizz! 71 Fizz! 73 74

    Fizz!Buzz! 76 77 Fizz! 79 Buzz! Fizz! 82 83 Fizz! Buzz! 86 Fizz! 88 89 Fizz!Buzz!
    91

    92 Fizz! 94 Buzz! Fizz! 97 98 Buzz!

    ```


    > Tip: In order to discover if an integer j is divisible by another integer q,
    check if the remainder after division is 0 with the modulus operator. If the result
    of j%q is equal to 0, means j is evenly divisible by q. example,20%4=0 20 is divisible
    by 4, but 81%6=3, and 3 is not 0, which means 81 is not divisible by 6. And, if
    an integer j is divisible by two integers, q and p, then j%(q*p)=0.'
