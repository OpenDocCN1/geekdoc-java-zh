    # Java source code


    Source code is a term meaning the text of a particular computer programming language.
    Java source code is typed into plain text files that we add to our projects as
    classes. The Java Compiler (a program called javac was installed with the Java
    SDK after Eclipse), reads the source code files in a project and converts them
    into machine code. The machine code can be understood and executed as an application
    by the JVM.


    Before we do anything else, we want to add a new Java class to our project. We
    will explore the meaning of the term "class" when we look at object-oriented programming.
    For now, our class will give us a starting point for our application. In the package
    explorer, right-click the src folder and select New and Class from the context
    menu that opens, as per Figure 12. The src folder is the main folder for storing
    our source code files.'
