  md: '# Chapter 6 Operators and Expressions


    Computers can add, subtract, multiply, and divide numbers extremely quickly. But
    basic numerical arithmetic is only one of the types of computation that computers
    do well. In this section, we will look at some various methods for computing results
    and calculating other values for variables by using operators and expressions.


    We will also look at some very important differences between the way computers
    perform arithmetic and the way that arithmetic works in mathematics.


    # Operators and operands


    Operators are used to indicate some specific action between one or two operands
    (in Java


    Operands are the parameters or the data for operators. Each operator requires
    some predefined operands. For instance, addition requires two numbers, such as
    5+6. Operands can be variables, objects, or literals (depending on exactly what
    the operator is). Operator specifies the data that an operator operates on. The
    JVM reads the operands and the operator, it performs some manipulations based
    on the specifications of the operator, and this results in some value—for example,
    5+6 results in the value 11.


    Operands and operators are combined together with brackets (" and ") to form expressions.
    Expressions are similar to basic arithmetic, but in Java we have a lot more flexibility
    than basic arithmetic. We can form arithmetic, logical, Boolean, and string expressions.


    Each operator has a precedence that dictates the order in which the operators
    should be executed when they are combined in an expression, and brackets are used
    to override the normal precedence rules of the operators.


    The general system we use in arithmetic and Java programming is called Infix Notation.
    In this system, operators with a higher precedence are performed first, followed
    by the operators with a lower precedence. For instance, 4+5*3 is an expression
    equaling 19. The precedence of the multiplication operator is higher than the
    precedence for the addition operator, so we perform 5*3 first, then add the 4,
    results in 19. Infix Notation, any operation surrounded by brackets occurs first,
    regardless of the precedence of the operators. So, we could write (4+5)*3, which
    has the same operators as before, but because of the brackets, the 4+5 is performed
    first and the final result is 27.'
