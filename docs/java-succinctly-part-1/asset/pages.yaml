  md: '# Assignment operators


    The assignment operators are used to alter or set the values of the variables.
    The most common assignment operator is the assignment operator itself, which is
    represented in Java by a single equals sign, "=\ This is very different from the
    double equals sign, "==", which is a conditional operator and asks if two values
    are equal. If we want to set a variable called someVariable to the integer 78,
    we would use `someVariable = 78`;


    After the equals operator, the remaining assignment operators (+=, -=, *=, /=,
    &=, ^= and ^=) are provided for convenience. They are sometimes called compound
    assignment operators, and they are a shorthand for a particularly common form
    of expression. When we have a variable, we need to perform some operation on it
    and store the resulting back into the same variable. This does not make sense
    mathematically, but it is perfectly normal in a programming language. Here is
    an example of a compound assignment operator:


    ```

    Var1 += 1;

    ```


    The above statement expands to mean:


    ```

    Var1 = Var1 + 1;

    ```


    So, the value of Var1 has added 1 to it. If Var1 begins with the value of 25,
    it will be set to 26 after The other assignment operators are similar only if
    the operation is specific to each operator. Instead of adding, -= subtracts from
    the variable and ^= perform bitwise exclusive OR, etc. Code Listing 6.7 shows
    some examples of compound assignment operators.


    > Code Listing 6.7: Compound Operators


    | Var1 -= 7; // Means Var1 = Var1 - 7 |

    | Var1 ^= 7; // Means Var1 = Var1 ^ 7 |

    | Var1 /= 7; // Means Var1 = Var1 / 7 |


    We will look at the exact meaning of each of the unadorn versions of these operators
    (i.e. ^ as opposed to the assignment version ^=). We can use the compound assignment
    operators with expressions, too:


    ```

    Var1 += 5 + (2*Var2);

    ```


    The above line of code will expand to the Var1 = Var1 + 5 + (2* Var2); If Var1
    is 10 and Var2 is 5, then Var1 will become 10+5+(2*5) or 25.'
