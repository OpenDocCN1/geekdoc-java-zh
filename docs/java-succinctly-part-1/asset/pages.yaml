  md: "The continue keyword is used to jump to the top of the loop. It is useful when\
    \ you do not want the remainder of the loop's body to execute during some particular\
    \ iteration.\n\nBreak and continue always operate on the innermost loop when loops\
    \ are nested.\n\n# While and do loops\n\nThere are two types of while loop—the\
    \ while loop itself and the do while loop. The only difference is that the do\
    \ while loop checks the condition after executing the body and is therefore guaranteed\
    \ to run the loop's body at least once. Whereas the while loop checks the condition\
    \ before running the body of the loop, and if the condition is false to begin\
    \ with, the body of the loop will not execute at all. Code Listing 7.8 shows the\
    \ basic syntax for these loops.\n\n> Code Listing 7.8: Nested For Loops\n\n```\n\
    while(condition) {\n  // Body of the loop\ndado {\n  // Body of the loop\n} while(condition);\n\
    ```\n\nThe condition can be any boolean statement (i.e. any logical expression\
    \ that results in a boolean value). The loop will continue to execute when the\
    \ condition evaluates to true. When the condition becomes false, the loop terminates.\n\
    \n> Code Listing 7.9: While and Do Loops\n\n```\nint counter = 0;\nwhile(counter\
    \ < 10) {\n  System.out.println(\"Counter in while: \" + counter);\n  counter++;\n\
    }\ndo {\n  System.out.println(\"Counter in do ... while: \" + counter);\n  counter++;\n\
    } while(counter < 10);\n```\n\nCode Listing 7.9 shows an example of using a while\
    \ and do while loop. First, in the while loop, the counter variable will increment\
    \ from 0 to 9. When the counter variable reaches 10, the condition of the while\
    \ loop will fail. This particular while loop is very similar to a for loop, and\
    \ in fact there is no while loop that could not also be written as a for loop\
    \ and versa.\n\nThe do while loop has the same condition as the while loop. After\
    \ the program executes the while loop, it will increment the counter variable\
    \ to 10. The do while loop's condition is false"
