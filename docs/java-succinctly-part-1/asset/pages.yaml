    MY_CONSTANT, _uniqueInstance.


    In Java, developers use a technique called Camel Case for naming our identifiers.
    In Camel Case, the first letter of each word is uppercase—except for the first
    letter. For instance, a function for computing a score might be computeScore,
    and a variable for summing a total of ages might be totalAges.


    An exception to this rule is thumb is naming classes. When naming classes, Java
    programmers use uppercase for the first letter of all words, including the first.
    A class for holding an automaton''s generation would be AutomationGrid. This makes
    variables and classes easy to distinguish in the code. In Listing 3.1, the identifiers
    MainClass, System, and String are all classes, which means they begin with an
