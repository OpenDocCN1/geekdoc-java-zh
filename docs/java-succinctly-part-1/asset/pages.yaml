  md: "# Nested loops\n\nWe can place a loop in the body of another for loop. This\
    \ is useful for traversing multidimensional arrays.\n\nCode Listing 7.7: Nested\
    \ For Loops\n\n```\nfor(int outerCounter = 0; outerCounter < 5; outerCounter++)\
    \ {\n    for(int innerCounter = 0; innerCounter < 3; innerCounter++) {\n     \
    \   System.out.println(\"Outer Counter: \" + outerCounter +\n              \"\
    \ Inner Counter: \" + innerCounter);\n    }\n}\n```\n\nCode Listing 7.7 shows\
    \ nested for loops. The outer counter counts from 0 up to and including 4. In\
    \ the body of the outer loop, the inner loop counts from 0 up to including 2.\
    \ The outer loop will execute five times, and each time it executes, the inner\
    \ loop will execute three times. Therefore, the body of the inner loop will execute\
    \ a total of 3*5 times, or 15. The output of this code is follows:\n\n+   Outer\
    \ Counter: 0 Inner Counter\nOuter Counter: 0 Inner Counter\nOuter Counter: 0 Inner\
    \ Counter\nOuter Counter: 1 Inner Counter\n...\nOuter Counter: 3 Inner Counter\n\
    Outer Counter: 4 Inner Counter\nOuter Counter: 4 Inner Counter\nOuter Counter:\
    \ 4 Inner Counter\n\nNotice that theouterCounter remains the same for exactly\
    \ three iterations of the inner loop. Then it counts up one, the outerCounter,\
    \ the innerCounter counts 0, 1, then 2. You can nest loops arbitrarily deep. We\
    \ could have another loop for the body of the inner loop in Code Listing 7.7 and\
    \ another loop in the body of that.\n\n# Break and continue keywords\n\nThe break\
    \ keyword is used in the body of several control structures (for, while, do while,\
    \ and switch as well). It causes the program to immediately jump to the next statement\
    \ outside the body of the control structure. This is useful for stopping infinite\
    \ loops (such as while(true), which typically would never terminate) and for terminating\
    \ the loop early."
