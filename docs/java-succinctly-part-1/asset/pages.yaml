  md: 'For example, if x begins as 7:


    +   - is odd, multiply by 3 and increment to get x = 22.

    - 22 is even, divide it by 2 to get x = 11.

    - 11 is odd, multiply by 3 and increment to get x = 34.

    - 34 is even, divide it by 2 to get x = 17.

    - 17 is odd, multiply by 3 and increment to get x = 52.

    - 52 is even, divide it by 2 to get x = 26.

    - 26 is even, divide it by 2 to get x = 13.

    - 13 is odd, multiply by 3 and increment to get x = 40.

    - 40 is even, divide it by 2 to get x = 20.

    - 20 is even, divide it by 2 to get x = 10.

    - 10 is even, divide it by 2 to get x = 5.

    - 5 is odd, multiply by 3 and increment to get x = 16.

    - 16 is even, divide it by 2 to get x = 8.

    - 8 is even, divide it by 2 to get x = 4.

    - 4 is even, divide it by 2 to get x = 2.

    - 2 is even, divide it by 2 to get x = 1.


    At this point, the value of x is 1, and the series for x = 7 terminates. We could
    continue the sequence after we reach 1, but the value of x begins to loop through
    the sequence 1, 4, 2, 1, 2... and never stops.


    This game is very simple, but it brings up a question that has far thwarted all
    attempts at answering: Are there any starting values for x that do not lead to
    1? Could we set x to some positive integer that it forms some loop that does not
    involve 1, or so that the values of x do not loop but increase infinity without
    any boundary?


    At present, the answer to the preceding question is not known. Mathematicians
    state this as a conjecture (i.e. an unproven statement): There are no starting
    values for x that do not lead to 1. For more information, visit the Wikipedia
    page on the Collatz conjecture: https://en.wikipedia.org/wiki/Collatz_conjecture).


