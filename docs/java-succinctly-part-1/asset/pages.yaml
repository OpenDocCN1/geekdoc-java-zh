    # Switch statements\n\nA switch statement is simply another way of coding a collection\
    \ of if statements. In order to convert a collection of if statements into a switch,\
    \ the conditions in the if and the else if statements all address the same variable.\
    \ In the following example (Code Listing 7.10), all of the conditions address\
