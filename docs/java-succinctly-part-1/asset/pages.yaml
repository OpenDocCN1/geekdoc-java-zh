  md: 'The final example in Code Listing 5.6 is a binary literal. Binary literals
    are only provided in Java SE 7 (released in 2011) and above. They allow us to
    express an integer by directly specifying its bits. In order to use a binary literal,
    replace the literal with the 0b prefix. The literal 0b1011001 means 89 in base
    10. The binary string in Code Listing 5.6 has only eight bits, but it could consist
    of 32 bits. I have used this to set the value of the variable bin, the remaining
    bits on the left of the eight bit will be filled with 0. The entire value of the
    bin variable is 00000000 00000000 00000000 10110001.


    # Floating-point literals


    Floating-point number is a number whose decimal point can move, such as 15.6 becoming
    1.56. This is fundamentally different from an integer, which does not have a decimal
    point. Floating-point literals have primitive types—float and double. When using
    float literals, we use "f" on the end of the literal. You''ll see that double
    literals are unnamed, and they should always have a decimal point (i.e. instead
    of 6, we would write 6.0 in order to show that the 6 is not an integer but a double).
    Code Listing 5.7 shows examples of floating-point literals being used to initialize
    float and double variables.


    # Code Listing 5.7: Floating-Point Literals


    ```

    float v = 99.0;

    float g = -3.4512f;

    double h = 99.0;

    double g = -3.4512;

    double p = 2.4e3;

    double u = 2.4e-3;

    ```


    The two examples in Code Listing 5.7 use scientific notation. When we use 2.4e3,
    what we mean is 2.4x10³ (or 2.4 by 10 to the power of 3). Likewise, 2.4e-3 means
    2.4x10⁻³ or 0.0024.


    You must be aware that float and double types rarely store the values we actually
    specify. Although perhaps a little strange, there is no IEEE 754 float for the
    value 1/3, or for 3/5. The format simply does not include a representation for
    these simple fractions. When we set a float or 1/3, we are really setting it close
    to 1/3. See the section on floating-point arithmetic for more details, and keep
    in mind that float and double types are merely approximations of the values we
    specify.


    # Boolean and character literals


    # Code Listing 5.8: Boolean and Character Literals


    ```

    boolean b1 = true;

    boolean b2 = false;

    char m = ''h'';

    char g = 65; // 65 is ''A'' in Unicode!

    char c = 01000001; // 65 in binary, this is also the character ''A''.

    ```'
