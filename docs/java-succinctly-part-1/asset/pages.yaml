  md: '# Detour: binary numbers


    Before we look at the bitwise operators, we will take a brief detour and look
    at the way computers store integers. Computers perform all computation on collections
    of 0s and 1s. The smallest amount of memory in the computer is a bit that can
    be set to 0 or 1 and constitutes a single digit in binary. Variables, such as
    int and byte (even double and float) are made up of a collection of bits in binary.


    Byte containing the decimal number 50 in binary


    ![](img/d6e922df0109ee8e372f5019b6a2a192_72_0.png)


    Figure 40: Byte Containing 50


    Figure 40 illustrates a byte containing the decimal integer 50. The bits are blue
    boxes, and each bit is set to 1 or 0 (the values inside the blue boxes). Each
    bit has an index. Bit 7, on the left, is the most significant bit and bit zero,
    on the right, is the least significant. This is exactly the same as with decimals—if
    we have a decimal number such as 345, the 3 on the left is more significant than
    the 5 on the right.


    In order to work out the exact numerical value of a binary number, you must sum
    each power of 2 that corresponds to a 1 in the position. In Figure 40, there is
    a 1 in the 2^5 position, another in the 2^4 position, and another in the 2^1 position.
    Therefore, this bit sequence represents 50, which is the result of adding the
    powers: 2^5+2^4+2^1=50. This is the same in decimal except that the base of the
    powers in decimal is 10 rather than 2.


    Negative numbers are slightly more complicated than positives. Java uses two-complement
    (2''s complement). This means that if the left-most bit is set to 1, the number
    is negative. The value of the negative number is the bitwise complement 1—e.g.,
    the bit sequence 10000011 in a byte would normally be 2^7+2^1, but because bit
    7 is the sign bit in a byte, and because it is set to 1, the actual value is the
    complement +1. The complement is the string with every bit flipped (the ~ operator
    below). Therefore, 10000011 is 01111100+1=01111101, or -125 in decimal. The left-most
    bit in each of the integer data types is called the sign bit for this reason.
    For byte, this left-most bit is bit 7, and in short it''s bit 15. In int, it is
    bit 31, and in long it is bit 63.


    # Bitwise operators


    Several operators in Java are designed to directly manipulate the bits of our
    variables. The operators are often grouped together and called the bitwise operators.
    The bitwise operators are'
