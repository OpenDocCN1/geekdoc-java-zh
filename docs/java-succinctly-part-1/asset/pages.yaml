    \nJava is a big language, and we have only scratched the surface, but the reality\
    \ is this—even beginner computer programmers have a rare power at their fingertips.\
    \ In this section, we will look at a small program that might be employed by a\
    \ mathematician to write a journal paper. We will explore one of the many unsolved\
    \ problems in mathematics and examine how easy it is to explore fascinating worlds\
    \ of thought with minimal Java syntax.\n\nThe 3x+1 is a famous unsolved mathematical\
    \ conjecture. It is a question relating to a simple game involving integers. The\
    \ game is as follows:\n\nStarting with a positive integer x, we must perform the\
    \ following:\n\n+   * If x is odd, divide it by 2.\n\n+   * If x is odd, multiply\
    \ it by 3 and add 1.\n\nRepeat the above steps until x reaches the number 1."
