  md: '# Chapter 5 Data Types and Variables


    # Memory


    In Java, as with all computer programming languages, we can read and write data
    to various memory spaces. A memory space is simply an area in which we can save
    and retrieve information. One of the most useful memory spaces that we can read
    and write to is called RAM. Random Access Memory is a type of volatile memory
    used for temporary storage (volatile means it is cleared when the system reboots).


    RAM is nothing more than a string of 0s and 1s. The 0s and 1s are organized into
    bytes of 8 bits each (a bit is short for binary digit—it is a single 0 or 1):
    See Figure 35 for an illustration of several bytes in RAM.


    | 02AC | 02AB | 02AA | 02A9 | 02A8 | 02A7 | 02A6 |

    |---|---|---|---|---|---|--|

    | 14 | 26 | 200 | 117 | 17 | 4 | 91 |


    ![](img/d6e922df0109ee8e372f5019b6a2a192_48_0.png)


    Figure 35 shows seven bytes in RAM. Each byte in RAM has an address written above
    the boxes (real addresses on modern computers have 16 hexadecimal digits instead
    of the four I''ve used in the illustration). The addresses are consecutive numbers
    counting up as we move through RAM from left to right. The addresses are written
    in hexadecimal (so we use 02A8 instead of 680—hexadecimal is not important at
    the moment).


    > Note: In Java, we do not have access to the addresses in RAM. This is one of
    the biggest differences between Java and related languages C and C++. Accessing
    RAM directly with addresses can be dangerous—it is easy to accidentally access
    the wrong bytes and cause bugs in our programs. So, Java does not allow direct
    access to RAM.


    Along with an address, each byte in RAM has a value (such as 14, 100, or 117 in
    Figure 35). As you can see, RAM is a collection of bytes, each with an address
    so that we can reference the bytes, and a value, so that we can read and write
    some information.'
