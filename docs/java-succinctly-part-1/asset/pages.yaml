    \ Switch\n\n```\nif(i == 0) // Do something\n if(i == 1) // Do somethingElse\n\
    \ if(i == 2) // Do somethingElse\nelse // Do the default\n\nswitch (i) {\n  case\
    \ 0: { Do something; break; }\n  case 1: { Do somethingElse; break; }\n  case\
    \ 2: { Do somethingElse; break; }\n  default: { Do the default; break; }\n};\n\
    ```\n\nIn a switch statement, we follow the switch keyword with a variable (i\
    \ in the preceding example). Next, inside a code block, we provide a series of\
    \ cases, each marked with the keyword. When it matches a particular case, the\
    \ code block for that case is executed.\n\nIn the switch example, each of the\
    \ case code ends with the break keyword. This means that once a particular case\
    \ has been executed, the program will break out of the switch. If none of the\
    \ previous cases are executed, the program will eventually find the case marked\
    \ with the default keyword. The default case executes only if the previous cases\
    \ did not. The default case is optional.\n\n+   Tip: The break keywords in a switch\
    \ are not mandatory. If you do not place a break in the cases, the program will\
    \ continue and find additional cases to execute. This functionality is seldom\
    \ used, and I recommend that you always use break in every switch statement to\
    \ avoid confusion when other programmers (or you) read the code.\n\nCode Listing\
