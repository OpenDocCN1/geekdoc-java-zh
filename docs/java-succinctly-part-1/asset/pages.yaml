  md: 'case: case is a selection mechanism. It is used with the switch keyword to
    create a list of possible cases in which the program might execute. Each case
    in a switch/case block is typically paired with a break, which means that program
    executes only a single case from a series of possibilities.


    catch: catch is used in conjunction with the try keyword to specify a block of
    code that should be executed when a try block throws an exception.


    char: char is a primitive data type. This keyword is used to declare variables
    and to cast to the char type. The char type is used for characters—for example,
    A & &.


    class: The class keyword signifies that the following code block is the declaration
    of a class.


    continue: The continue keyword is used inside loops. When the program encounters
    continue, it will immediately jump to the top of the loop without executing any
    remaining code in the code block.


    default: The default keyword is used in place of the final case in a switch/case
    block. If none of the previous case blocks execute, and a final default block
    is supplied, the default block will always execute.


    do: The do is used to signify a do loop. The while loop is usually followed by
    a code block that forms the code to execute in a loop. The code of a while loop
    ends with the term "while", followed by a condition. While loops are identical
    to loops loops that are guaranteed to execute at least once


    double: double is a primitive data type. This keyword is used to declare double
    variables and cast to the double type. The double type is a 64-bit floating-point
    data type—it is used to represent approximations of numbers with a fractional
    part. The double has greater precision than a float, but it is twice the size
    in RAM.


    enum: The enum keyword indicates that the following code block signifies an enumeration.
    Enumerations are a special type of class, specifically designed to represent sequential
    data such as the days of the week or colors in the spectrum.


    extends: The extends keyword is used in a class declaration to signify that the
    present class inherits from a parent class. See the section on object-oriented
    programming for more details.


    false: The false keyword and the true keyword form the only two possible options
    for boolean variables and expressions.


    final: The final keyword is used to signify that the following item will only
    be defined once. The final keyword is used to define constants—e.g., variables
    that we cannot change once they are set to some particular value.'
