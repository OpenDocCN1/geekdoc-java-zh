    import: The import keyword is used to import classes from an external package.


    instanceof: The instanceof keyword is used to test whether or not an object is
    an instance of some particular class. See the section on object-oriented programming
    for more details on the instanceof keyword.


    int: int is a primitive data type. This keyword is used to declare int variables
    and to cast to the int type. The int is a 32-bit number. See the section on variables
    and data types for more information on int.


    interface: The interface keyword is used to signify that the following code block
    declares an interface.


    long: long is a primitive data type. This keyword is used to declare long variables
    and to cast to the long type. The long is a 64-bit number. See the section on
    variables and data types for more information on long.


    native: The native keyword is used to connect a Java program to external, native
    code. Using native, we can execute code that is compiled in different languages,
    such as C or Assembly language. This keyword is rarely used.


    new: The new keyword is used to create objects from classes. See the section on
    object-oriented programming for more information on the use of the new keyword.


    null: The null keyword is used to set an object without creating one. It is technically
    not a keyword but rather a literal. There are times when we might or not have
    constructed an object from some class. We can use null to test if an object has
    been created or not.'
