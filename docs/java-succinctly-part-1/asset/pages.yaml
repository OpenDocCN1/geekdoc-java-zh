    \ of 500, and the program would output Yeah right? Are you a giraffe? Note that\
    \ if the input is greater than or equal to 100 and also less than or equal to\
    \ 30, no output will be displayed.\n\nWhen our code block consists of a single\
    \ line of code (as in both the examples from Code Listing 7.0, the curly brackets\
    \ are optional). This is why the second if statement in Code Listing 7.0 is missing\
    \ the curly brackets.\n\nCombining several conditions together into logical expressions\
    \ is often convenient. This is exactly what the Boolean operators || &&, and !\
    \ are used for. When we use || between two or, any true statement will cause the\
    \ entire expression to be true.\n\n# Code Listing 7.1: Using Boolean\n\n```\n\
    int password = 25;\nString userName = \"Sam\";\nif(password == 10 || userName\
    \ == \"Sam\") {\n    System.out.println(\"That is the correct password or User\
    \ Name!\");\n}\n```\n\nIn Code Listing 7.1, the expression in the statement is\
    \ true if password is 10 or if the userName is Sam. This is Boolean OR, so it\
    \ is also true when both of these conditions are true (unlike English \"or,\"\
    \ which applies apples or oranges means one or the other but not both). The logical\
    \ OR combines the two statements password=10, and userName=\"Sam\" into a single\
    \ boolean value. The operator returns true if either of the conditions is true\
    \ or if both are true. Typically, when we check a user name and password, we need\
    \ both of them to be correct, so Boolean OR is not a good choice in this particular\
    \ circumstance. Code Listing 7.2 shows the use of Boolean.\n\n# Code Listing 7.2:\
    \ Using Boolean AND\n\n```\nint password = 25;\nString userName = \"Sam\";\nif(password\
    \ == 10 && userName == \"Sam\") {\n    System.out.println(\"That is the correct\
    \ password AND User Name!\");\n}\n```\n\nThe && combines two Boolean statements,\
    \ and both must be true or the operator return false. In the code, if the password\
    \ is 10 and the userName is set to Sam, then the System.out.println will be executed.\
    \ However, if you change the password to 18, the println will execute because\
    \ both conditions for the && operator are true.\n\nIf you want to check multiple\
    \ possible conditions using the same variable, remember to use the variable name\
    \ twice:"
