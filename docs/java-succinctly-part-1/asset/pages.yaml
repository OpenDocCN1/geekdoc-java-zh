    new lines). Identifier names must be a single, unbroken word. Identifier names
    can contain letters, digits, the dollar sign $, or underscores _, but they cannot
    begin with a digit. The compiler sees any token beginning with a digit as a numerical
    literal, it will not allow us to name our identifiers things such as 67Hello this
    would mean the 67 with the meaningless suffix Hello.


    Identifier names are case sensitive, which means the identifiers patientData,
    PATIENTData, and patientdata are all distinct by the compiler. Naming multiple
    identifiers differ only in case is not recommended because this can lead to confusion
    and difficult-to-read-code, although the compiler will have no trouble differentiating
    them.


