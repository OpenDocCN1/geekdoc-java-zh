    so they begin with a lowercase letter.


    In addition to Camel Case, it is common to name final variables (similar to constants
    in other languages) with all capital letters. A final variable is simply a named
    value that cannot be changed, as the mathematical variables PI or E. Because programmers
    when naming constants, it is common to split the words by using the underscore
    for spaces. A final variable for seconds per hour might be SECONDS_PER_HOUR, or
