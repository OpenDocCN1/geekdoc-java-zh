    # # Do-nothing program


    At the moment, we have a project, but it has no entry point. There is no place
    for the JVM to begin executing our code. The default entry point for a Java application
    is called the main method. It consists of a public, static method called main
    that takes an array of strings as parameters. We will look at exactly what this
    means later. For now, in order to include a main method we need to type the declaration
    of the method and add braces for the body inside MainClass (see Code Listing 2.0).'
