  md: "operator is a shorthand for a particularly common if statement; and the instanceof\
    \ operator is a mechanism for testing whether or not an object is an instance\
    \ of a particular class.\n\n# Conditional operator\n\nThe conditional operator\
    \ (sometimes called the ternary operator) is a shorthand way of writing a condition\
    \ with two possible outcomes. In the chapter on control structures, we will see\
    \ how to write if statements that perform exactly the same function as the functional\
    \ operator. However, for now note that the conditional operator requires less\
    \ code.\n\n> Code Listing 11.61: Conditional Operator\n\n```\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        int a = 25, b = 60;\n\
    \        int larger = (a > b) ? a : b;\n        System.out.println(larger);\n\
    \    }\n}\n```\n\nCode Listing 11.61 shows the use of the conditional operator.\
    \ The line int larger = (a > b) ? a : b; is the invocation of the operator. The\
    \ operator has three parts—a condition, a value when the condition is true, and\
    \ a value when the condition is false. The operator will return either a or b,\
    \ depending on the result of the condition (a>b). In order to use the operator,\
    \ we follow a conditional expression with a question mark, place the outcome when\
    \ the condition is true. After this, we use a colon, :, and place the outcome\
    \ when the condition is false.\n\nIf we run the preceding program, we will see\
    \ that the condition (a > b) is actually returned because a is 25 and b is 60,\
    \ which is not greater than 60. Therefore, the value returned by the operator\
    \ will be the larger variable and subsequently print to the screen.\n\nThe conditional\
    \ operator could easily be written out as an if statement, as in Code Listing\
    \ 6.12 (we will look at in the section on control structures).\n\n> Code Listing\
    \ 11.62: Equivalent If Statement\n\n```\npublic class MainClass {\n    public\
    \ static void main(String[] args) {\n        int a = 25, b = 60;\n\n        int\
    \ larger;\n\n        if(a > b)\n            larger = a;\n        else\n      \
    \      larger = b;\n    }\n}\n```"
