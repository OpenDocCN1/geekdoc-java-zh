    # Logical operators


    The logical operators (sometimes called Boolean operators) work with boolean arguments.
    They are used to form logical statements. Each logical operator takes two operands,
    and both operands are boolean. We usually use logical operators in conjunction
    with if statements, loops, and other circumstances in which conditions are necessary.


    The three logical operators are AND, represented by the symbol &&; OR, represented
    by the symbol ||; and NOT, represented by the exclamation point symbol ! The logical
    operators are used to string together simple boolean conditions in order to create
    complex expressions. Each of the logical operators works exactly the same way
    as the Boolean truth tables for AND, OR, and NOT that we looked at for the bitwise
    operators. The only difference between the logical operators and the bitwise operators
    is that the logical operators are strictly for boolean parameters, whereas the
    bitwise operators are designed to work with 32 bits of int, or 64 bits of a long.


    As a short example of how we use the logical operators, imagine that we have a
    circumstance on which we wish to model in our program. We are in control of a
    garage door. The door can be open or closed. Now the door should be closed in
    order to prevent blurs, but if it is raining, the door should be closed so that
    the rain doesn''t get into the garage.


    You could model the system above with a few variables: boolean doorClosed; boolean
    nightTime; and boolean raining.


    In order to determine whether or not the door should be closed, we might say something
    like doorOpen = nightTime || raining.'
