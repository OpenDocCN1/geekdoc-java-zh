  md: '# # Chapter 8 Object-Oriented Programming


    # ## Classes and objects


    Java is an object-oriented language. It contains mechanisms that allow us to program
    hierarchies of our own data types called classes. A class is a blueprint—it is
    a description of a type of object in terms of which variables the objects own
    and which methods (functions) the objects are able to perform. We can create objects
    from these class blueprints—the objects are called instances of the class. Objects
    are a collection of variables called member variables and methods called member
    methods. For instance, you can create a Circle class with radius as a variable.
    And the methods might compute things such as computePerimeter and computerArea.


    There are three key concepts for understanding the basics of classes and objects
    in Java:


    +   - Member variables: describe what an object or class **has**.

    - Member methods: describe what an object or class **does**.

    - Inheritance: describes what an object **is**; what it inherits from parent classes.


    # ## Class keyword


    In order to begin describing a new class, add it to your project in the same way
    we added the MainClass to your first project (click the File > New > Class). You
    must give your class a unique name in the New Java Class dialog box. We will first
    build a simple circle class, and I have named my class Circle in Code Listing
    8.0. Note that the name of the class should match the name of the file, which
    means the file for this particular class is Circle.java (this will be automatic
    when we use the class wizard to add our classes to our projects).


    > Code Listing 8.0: Empty Circle Class


    ```

    public class Circle {

    }

    ```


    # ## Local vs. member variables


    We have defined many variables already, but in each case we have defined inside
    a method (specifically, inside the main method). Such variables have a scope (or
    visibility) that only lasts for a code block of the method. Variables that are
    defined inside a method and that have a scope that only lasts for the duration
    of the method are called local variables. In contrast to local variables, member
    variables have a scope that lasts for the lifetime of the object.'
