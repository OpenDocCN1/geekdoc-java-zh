  md: "# Chapter 7 Control Structures\n\nTypically, computers execute one line at\
    \ a time from top to bottom. Control structures allow us to specify other orders\
    \ of execution, such as branching and repeating loops of code. In Java, the available\
    \ control structures are if statements, for loops, while loops, do while loops,\
    \ switch statements, for each loops, and try/catch blocks.\n\n# If statements\n\
    \nIf statements allow us to execute a block of code when a particular condition\
    \ is true, otherwise the code block is skipped. The basic syntax to an if statement\
    \ is listed in Code Listing 7.0.\n\n> Code Listing 7.0: Basic If Statements\n\n\
    ```\nimport java.util.Scanner;\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Scanner scanner = new Scanner(System.in);\n        int height\
    \ = 0;\n        System.out.print(\"How tall are you (in cm)?\");\n        height\
    \ = Integer.parseInt(scanner.nextLine());\n\n        if(height < 100) {\n    \
    \        System.out.println(\"Wow! Are you a quokka?\");\n        }\n        if(height\
    \ > 300) {\n            System.out.println(\"Yeah right? Are you a giraffe?\"\
    );\n        }\n    }\n}\n```\n\nCode Listing 7.0 shows if statements. First, the\
    \ listing shows a prompt to users asking for their height. The variable's value\
    \ is read as a string, using the scanner and parsed to an int with the Integer.parseInt\
    \ method not our primary focus, but this is an example of how it is done. If statements\
    \ begin with the if keyword and are followed by a boolean expression in brackets:\
    \ (height < 100) in the first statement, and (height > 300) in the second statement\
    \ (remember the relational operators < and > always return a boolean value). When\
    \ the program evaluates the expressions, they will either be true or they will\
    \ be false. When the statement evaluates to true, the code blocks following the\
    \ if statement are executed. When the expression evaluates to false, the block\
    \ is skipped and the program will resume executing code after the if statement's\
    \ code block."
