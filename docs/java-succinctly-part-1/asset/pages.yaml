  md: '# Arithmetic operators


    Table 2: Arithmetic Operators


    | Name | Symbol | Operands | Precedence |

    | Addition | + | 2 | 1 |

    | Subtraction | - | 2 | 1 |

    | Postfix Increment | ++ | 1 | 1 |

    | Postfix Decrement | -- | 1 | 1 |

    | Multiplication | * | 2 | 2 |

    | Division | / | 2 | 2 |

    | Modulus | % | 2 | 2 |

    | Unary Negative | -i | 1 | 3 |

    | Unary Positive | +i | 1 | 3 |

    | Prefix Increment | ++i | 1 | 4 |

    | Prefix Decrement | --i | 1 | 4 |


    Table 2 shows the arithmetic operators available in Java. Many will be familiar
    from regular arithmetic, but some require more explanation. First, I have included
    a dummy variable name i for the operators that require a variable in a certain
