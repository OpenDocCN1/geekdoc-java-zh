  md: '# # Chapter 3 Writing Output


    Code Listing 3.0 shows the code to a basic "Hello, World! application. The program
    prints some text to the console, then it exits. The numbers on the left side are
    indexed for reference and should not be typed into your code. Type or paste this
    code over the code in the MainClass.java we created earlier.


    # Code Listing 3.0: Printing Output


    ```

    1: public class MainClass { // Definition of MainClass

    2: public static void main(String[] args) { // main method entry point

    3:     System.out.println("This is a test application!");

    4: } // Close brace for main method.

    5: } // Close brace for MainClass.

    ```


    When we execute this code with Debugging or Running (use keys F11 or Ctrl+F11,
    or click the debug or run buttons), the program will print "This is a test application!
    to the system output.


    **Line 1**: public class MainClass. This line declares a class called MainClass.
    The class is marked with the public modifier, which means it is visible to all
    other entities and packages in the application. After the public modifier, we
    use the keyword class, then we supply a name for our class—MainClass, in instance.
    This is followed by a curly brace, {, that indicates the beginning of the class.
    Line 5 contains the matching closing brace, that marks the end of the body of
    this class.


    **Line 2**: On line 2 we declare a static method called main. The method is marked
    public, so that classes outside of this one are able to call it. The method marked
    static, means it belongs to the class rather than any particular instance of the
    class. The method does not return any value to the caller, so the return type
    is void. In the brackets, the String[] args is the parameter name. This means
    an array of strings will be passed to this method when it is invoked. The strings
    are the command-line argument—when we run a program from the command line, we
