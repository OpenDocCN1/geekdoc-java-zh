    # # Projects and workspaces


    A Java project is a collection of classes, files, and other resources that collectively
    form a coherent application. A workspace is a collection of Java projects in a
    folder on the developer''s machine. In this section, we will look at creating
    a new Java project in Eclipse, adding a main class and an application point entry.
    Our program will not do anything visible at point.


    # # Workspaces


    Eclipse organizes projects into folders called Workspaces. You can create a new
    workspace for each project, or you can use a single workspace for several projects,
    such as libraries and a front end that they use. When you first run Eclipse, you
    will be asked to specify the workspace in which you would like to store your applications
    while you develop. You can create more workspaces later, but for now let''s use
    the default workspace—located in the user''s folder (C:\Users\Chris in my case)
    and in a subfolder "workspace" (see Figure 8).'
