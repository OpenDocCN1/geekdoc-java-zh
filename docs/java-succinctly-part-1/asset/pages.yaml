    # Shift operators


    In addition to the bitwise operations we can also perform shifts in Java. The
    shifts are considered to be bitwise operators because they give us direct access
    to the bits of the variables. There are three shifts available in Java—shift left
    (the operator symbol <<), shift right (the operator symbol is >>), and shift right
    with zero (the operator is >>>).


    The shifts each take two operands. They shift the bits in the first operand to
    the left or right (depending on the operator) by the amount specified in the second
    operand. For instance, a variable a can shift the bits one space to the right
    by using the statement: a = a << 1.


    The effect of shifting the bits of integer to the left is the same as multiplying
    the value of the integer by the corresponding power of two. For instance, if we
    take the bit pattern three and we store it in a byte variable a:


    ```

    a = 3 << 4;// multiply 3 by 2 to the power 4, or a will become 00110000.

    ```


