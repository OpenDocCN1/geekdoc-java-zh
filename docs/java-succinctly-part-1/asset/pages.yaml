  md: "The body of the for loop has a single statement, we do not need the curly braces.\n\
    \n**Init:** The initialization is where we declare the counter variable and set\
    \ its initial value.\n\n**Condition:** The condition is a Boolean expression,\
    \ just like an if statement. The code block of the for loop will repeat until\
    \ the condition evaluates to true.\n\n**Increment:** The increment section allows\
    \ us to increment or decrement our counter.\n\n# Code Listing 7.5: For Loop Counting\
    \ from 0 to 9\n\n```\nfor(int j = 0; j < 10; j++) {\n    System.out.println(j);\n\
    }\n```\n\nCode Listing 7.5 shows a for loop that iterates 10 times and counts\
    \ from 0 to 9. The initialization of this loop declares an integer variable called\
    \ j, setting its initial value to 0. The condition is \"j < 10\", meaning \"while\
    \ j is less than 10\". The increment is \"++\", which means \"every time the loop's\
    \ body is executed, the j will count up\". After executing the loop body 10 times,\
    \ the j will increment to 10 and the condition \"j < 10\" will evaluate to false.\
    \ The loop will terminate, and the program will continue to execute the code loop.\n\
    \n> Note: Code 7.5 shows a very common method for instructing the computer to\
    \ loop 10 times. But notice that although the loop body is executed 10 times,\
    \ the program counts from 0 to 9, not from 1 to 10. If you need for your loop\
    \ to count as a human does, from 1 to 10, use something like the following instead:\
    \ for(int j = 1; j <= 10; j++);\n\n# Code Listing 7.6: Counting Backwards with\
    \ a For Loop\n\n```\nfor(int j = 10; j > 0; j--) {\n    System.out.println(j);\n\
    }\n```\n\nThe loop in Code Listing 7.6 counts backward from 10 and counting to\
    \ 1. It could be read \"for j = 10, while j is greater than 0, decrement j\".\
    \ This is like a loop that counts up, but the \"increment\" part of the loop has\
    \ \"--\",, which will cause the variable j to count downwards. Also, note that\
    \ the starting value and the condition are switched—at 10 and loop while greater\
    \ than 1.\n\n> Note: There is a special type of for loop used to iterate the items\
    \ in a collection, such as an array. The loop is commonly called a for each loop.\
    \ For more information on the each loop, visit http://docs.oracle.com/java/1.5.0/docs/guide/language/foreach.html."
