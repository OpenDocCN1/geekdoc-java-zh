  md: "# Chapter 9 Example Programs and Conclusion\n\nOur final chapter provides two\
    \ case studies—Nim and the 3x+1. Each consists of complete, useful, and interesting\
    \ programs that we can create with minimal understanding of Java. The main difficulty\
    \ in learning a computer language is gaining the skills to put together the mechanisms\
    \ of the language into a coherent program. Finding complete, useful programs that\
    \ only use the smallest subset of the mechanisms of a language is not easy. But\
    \ the two examples in this chapter show that we do not need anything more than\
    \ what we have seen far—we can easily create useful programs.\n\nIn fact, while\
    \ the game of Nim is a bit of fun, the 3x+1 program illustrates that we are already\
    \ capable of exploring some of the most difficult unsolved problems in mathematics\
    \ and computer science. We might know only a tiny portion of Java, but the power\
    \ that this language gives us is utterly extraordinary.\n\nI have purposely left\
    \ out the object-oriented mechanisms we looked at in the previous chapter. Object-oriented\
    \ programming comes in its own when we use polymorphism, which we will cover in\
    \ Java Succinctly Part 2.\n\n# The game of Nim\n\nThe game presented here is a\
    \ version of a simple and popular strategy game called Nim (for more variants\
    \ of Nim, visit https://en.wikipedia.org/wiki/Nim). You'll find a collection of\
    \ sticks (the number begins at 37 in the program), and players takes turns (beginning\
    \ with the human player) to take one, two, or three sticks from the collection,\
    \ reducing the collection of sticks for the next player. The objective of the\
    \ game is to take the final stick.\n\nA fun question might be—is there a strategy\
    \ for beating the computer every?\n\n(Hint: Yes, there is! Upon careful inspection\
    \ of how the computer selects its moves, you might be able to discover how to\
    \ win against the computer every time.)\n\nCode Listing 9.0: Nim Source Code\n\
    \n```\nimport java.util.Scanner;\n\npublic class MainClass {\n    public static\
    \ void main(String[] args) {\n\n        // Declare local variables.\n        Scanner\
    \ scanner = new Scanner(System.in); // For reading input.\n        String playerInput\
    \ = \"\"; // Variable for reading player input.\n        int sticks = 37; // Current\
    \ number of sticks left.\n```"
