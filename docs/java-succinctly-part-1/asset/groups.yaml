    # # Stepping Over and Into code


    Stepping through code can be done in two ways:


    +   - Step Over

    - Step Into


    When the program is paused, we can look very closely at exactly what is happening
    to all the variables while it executes one line at a time. We do this by employing
    the Step Over and Step Into buttons (see Figure 33). You will find these buttons
    at the top of Eclipse when the program is paused.'
