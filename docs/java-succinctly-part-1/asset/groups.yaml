    ### Code Listing 3.0: Printing Output


    ```

    1: public class MainClass { // Definition of MainClass

    2: public static void main(String[] args) { // main method entry point

    3:     System.out.println("This is a test application!");

    4: } // Close brace for main method.

    5: } // Close brace for MainClass.

    ```


    When we execute this code with Debugging or Running (use keys F11 or Ctrl+F11,
    or click the debug or run buttons), the program will print "This is a test application!"
    to the system output.


    **Line 1**: `public class MainClass`. This line declares a class called MainClass.
    The class is marked with the public modifier, which means it is visible to all
    other entities and packages in the application. After the public modifier, we
    use the keyword class, then we supply a name for our class—MainClass, in instance.
    This is followed by a curly brace, {, that indicates the beginning of the class.
    Line 5 contains the matching closing brace, that marks the end of the body of
    this class.


    **Line 2**: On line 2 we declare a static method called main. The method is marked
    public, so that classes outside of this one are able to call it. The method marked
    static, means it belongs to the class rather than any particular instance of the
    class. The method does not return any value to the caller, so the return type
    is void. In the brackets, `String[] args` is the parameter name. This means an
    array of strings will be passed to this method when it is invoked. The strings
    are the command-line argument—when we run a program from the command line, we
    can optionally supply extra arguments. When we use the command line, and this
    array will be empty in the example programs. After the parameter list, we use
    an open brace, {, that marks the beginning of the body for this method. The matching
    close brace for the main method is on line 4.


    **Line 3**: This line invokes the `println` method, which belongs to the `System.out`
    class. System is a class, and `println` is a public static method belonging to
    the class. The method takes a String parameter and prints the string to the console
    output. The string is enclosed in brackets that indicate that it is a parameter
    to the method call. The parameter is a String because it is enclosed in double
    quotes. The line ends with a semicolon ";" that indicates that the statement is
    finished. All statements in Java have a semicolon.


    **Line 4**: This is the matching close brace for the main method. The opening
    brace appeared on line 2. This brace indicates that we have finished describing
    the method.


    **Line 5**: This is the matching closing brace for the MainClass class. The opening
    brace appeared on line 1. This brace indicates that the description of the MainClass
    is finished.


    Don''t worry if some of these previous descriptions are too brief. We will look
    further into each of the keywords and other mechanisms as we progress through
    this book. Initially, Java has a fairly steep learning curve. In order to begin
    programming Java, even the most basic program contains a lot of syntax (syntax
    is the grammar of a programming language—the rules, spelling, and punctuation).


    The name of the class can be any valid identifier. Valid identifier names contain
    letters and digits, but they cannot begin with a digit. Identifiers must be a
    single word (no spaces, tabs, or punctuation of any kind is allowed), but you
    are able to use the underscore character, e.g., Main_Class is a legal identifier,
