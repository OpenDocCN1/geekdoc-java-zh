    \ just print the number itself.\n        else System.out.print(i + \" \");\n \
    \   }\n}\n}\n```## Chapter 8 Object-Oriented Programming\n\n## Classes and objects\n\
    \nJava is an object-oriented language. It contains mechanisms that allow us to\
    \ program hierarchies of our own data types called classes. A class is a blueprint—it\
    \ is a description of a type of object in terms of which variables the objects\
    \ own and which methods (functions) the objects are able to perform. We can create\
    \ objects from these class blueprints—the objects are called instances of the\
    \ class. Objects are a collection of variables called member variables and methods\
    \ called member methods. For instance, you can create a Circle class with radius\
    \ as a variable. And the methods might compute things such as computePerimeter\
    \ and computeArea.\n\nThere are three key concepts for understanding the basics\
    \ of classes and objects in Java:\n\n- Member variables: describe what an object\
    \ or class **has**.\n- Member methods: describe what an object or class **does**.\n\
    - Inheritance: describes what an object **is**; what it inherits from parent classes.\n\
    \n## Class keyword\n\nIn order to begin describing a new class, add it to your\
    \ project in the same way we added the MainClass to your first project (click\
    \ the File > New > Class). You must give your class a unique name in the New Java\
    \ Class dialog box. We will first build a simple circle class, and I have named\
    \ my class Circle in Code Listing 8.0. Note that the name of the class should\
    \ match the name of the file, which means the file for this particular class is\
    \ Circle.java (this will be automatic when we use the class wizard to add our\
    \ classes to our projects).\n\n> Code Listing 8.0: Empty Circle Class\n\n```java\n\
    public class Circle {\n}\n```\n\n## Local vs. member variables\n\nWe have defined\
    \ many variables already, but in each case we have defined inside a method (specifically,\
    \ inside the main method). Such variables have a scope (or visibility) that only\
    \ lasts for a code block of the method. Variables that are defined inside a method\
    \ and that have a scope that only lasts for the duration of the method are called\
    \ local variables. In contrast to local variables, member variables have a scope\
    \ that lasts for the lifetime of the object.\n\n## Member variables\n\nEach of\
    \ the objects built from a class member inside the class's body but outside of\
    \ any access modifier. In addition having a data type and name, member variables\
    \ can also have an access modifier. Access modifiers describe the visibility for\
    \ the member variable to the outside world, i.e. they define whether objects can\
    \ access this member variable or whether it is private.\n\n> Code Listing 8.1:\
    \ Circle Class Member Variables\n```java\npublic class Circle {\n    public float\
    \ radius;\n    private String name;\n    protected float lineWidth;\n    private\
    \ static int setCount;\n}\n```\n\nIn Code Listing 8.1, there are four member variables\
    \ defined for our Circle class notice. Notice that there are terms next to the\
    \ data types public, private, protected, and static. These are the access modifiers.\
    \ They are placed to the left of the data type.\n\n**public:** All classes have\
    \ access to member variables and methods marked public.\n\n**protected:** Classes\
    \ and objects that belong to the same package are allowed access to protected\
    \ member variables.\n\n**private:** Member variables marked private are only accessible\
    \ by members of the class itself—that is objects built from the class.\n\n**static:**\
    \ Members marked as static to the class rather than the objects created from the\
    \ class. If we mark a member variable as static, there will be one copy of the\
    \ variable shared by all objects in the class. Members marked as static can also\
    \ be referenced with the class instead of an object, as we will see.\n\n> Note:\
    \ The keyword *final* is another access modifier. Members and local variables\
    \ marked *final* can have their value specified once. The *final* keyword is useful\
    \ for defining constants such as the mathematical constants PI and E. variables\
    \ are usually named with all capital letters, such as PI and DAYS_JUNE. For more\
    \ information on the final keyword, https://docs.oracle.com/javase/tutorial/java/javaOO/classvars.html.\n\
    \n# Instantiating an object\n\nWe have defined a class Circle, and we can now\
    \ constructing objects from it. Move back to the MainClass.java file in your project.\
    \ Code Listing 8.2 shows how to create an object from our Circle class using the\
    \ new operator.\n\n> Code Listing 8.2: Creating an Object from a Class\n\n```\n\
    public class MainClass {\n    public static void main(String[] args) {\n     \
    \   Circle c = new Circle();\n        c.radius = 100.0f;\n        System.out.println(\"\
    Circle radius is \" + c.radius);\n    }\n}\n```\n\nThe most important line in\
    \ Code Listing 8.2 is Circle c = new Circle(); This creates a New object from\
    \ our class blueprint and assigns it to the object c. We begin with the class\
    \ name, Circle, followed by the name we want for, c. Next, we use the assignment\
    \ operator, = followed by the keyword. The new keyword is followed by what looks\
    \ like a function call, but this is actually a special function. Circle() is a\
    \ function used to initialize an object from a class. We did not supply any constructors\
    \ in our Circle class, so Java has provided us with the default (we will define\
    \ some constructors in member).\n\nThe object c is an instance of the Circle class.\
    \ It owns a copy of the member variables specified in the Circle class. We can\
    \ change the public member variables of c. In order to change the object's radius\
    \ member variable, we use \"c.radius=100.0f\". The period after the object's name\
    \ means that the radius belongs to the instance. We can set the radius variable\
    \ as illustrated in Code Listing 8.2, but we cannot set the name or the circleCount\
    \ member variables. If we try to, with \"c.name = \"Sirkli\"\" or \"c.circleCount=100\"\
    , you will notice that Eclipse declines and states that these members are not\
    \ visible because they are marked private and the main method is not part of the\
    \ Circle class, therefore it cannot set these member variables.\n\n> Note: The\
    \ main method is within the same package as the Circle class, so you will find\
    \ that altering the linewidth member variable is perfectly legal with \"c.linewidth=23\"\
    ; This is different from the protected modifier in C++ that means visible to classes.\n\
    \nWe can create many objects from a class. If we create a second Circle and call\
    \ it b, the Circle and the b Circle both have their own member variables (see\
    \ Code Listing 8.3).\n\n# Code Listing 8.3: Creating Multiple Instances\n\n```\n\
    public class MainClass {\n    public static void main(String[] args) {\n     \
    \   Circle c = new Circle();\n        Circle b = new Circle();\n        c.radius\
    \ = 100.0f;\n        b.radius = 900.0f;\n        System.out.println(\"Radius of\
    \ c: \" + c.radius); // Prints 100\n        System.out.println(\"Radius of b:\
    \ \" + b.radius); // Prints 900\n    }\n}\n```\n\nCode Listing 8.4 shows that\
    \ we can quickly create an entire array of object instances from our class. Note\
    \ that when we declare an array of type Circle, all elements of the array are\
    \ initialized to null. We must call the constructor for each instance in order\
    \ to instantiate the objects.\n\n# Code Listing 8.4: Creating an Array of Objects\n\
    \n```\npublic class Main {\n    public static void main(String[] args) {\n   \
    \     // Declare array of 100 Circles objects.\n        Circle[] circleArray =\
    \ new Circle[100];\n\n        // Use a loop to call new and set radiuses.\n  \
    \      for(int i = 0; i < 100; i++) {\n            circleArray[i] = new Circle();\n\
    \            circleArray[i].radius = (float)i;\n        }\n        // Print out\
    \ radius as an example.\n        System.out.println(\"circleArray[20] Radius:\
    \ \" + circleArray[20].radius);\n    }\n}\n```\n\n# Member methods\n\nMember methods\
    \ are functions of a class. A function is a reusable block of code that we can\
    \ invoke or call. In Code Listing 8.5, I have changed all the member variables\
    \ to private. Marking all member variables as private and providing getters and\
    \ setters as member methods (which enables us to alter the inner workings of the\
    \ member variables with the knowledge that no external classes are accessing them\
    \ directly) is common practice. The circle class has also been expanded to include\
    \ a number of member methods. The methods included in Code Listing 8.5 are setRadius,\
    \ getRadius, print, zeroCount, and setLineWidth.\n\n# Code Listing 8.5: Member\
    \ Methods\n\n```\npublic class Circle {\n    private float radius;\n    private\
    \ String name;\n    private float linewidth;\n    private static int circleCount;\n\
    \n    // Constructors:\n    // Default Constructor\n    public Circle() {\n  \
    \      this.radius = 0.0f;\n        this.name = \"No name\";\n    }\n}\n```\n"
