    ## White space


    White space is the use of space within code. This includes new lines, spaces,
    and tabs. Generally speaking, the Java compiler ignores white space, and programmers
    can lay out code however they wish. There are exceptions to this rule—for instance,
    in Strings, the compiler preserves the spaces because there is a big difference
    between the two.


