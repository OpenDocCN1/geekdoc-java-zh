    \ the program encounters the else. The else block will always execute if the program\
    \ encounters it, so with i set to 17, the program will print \"i is not divisible\
    \ by...\n\n# Loops\n\nFor loops allow to execute a block of code a specified number\
    \ of times. We often use a counter and execute the code until the counter reaches\
    \ some value. This allows us to execute a code block specific number of times.\
    \ The syntax is as follows:\n\n```java\nfor ([init]; [condition]; [increment])\
    \ {\n    // Body of the loop\n}\n```\n\n```java\nfor([init]; [condition]; [increment])\
    \ {\n    // Some simple statement!\n```\n\nThe body of the for loop has a single\
    \ statement, we do not need the curly braces.\n\n**Init:** The initialization\
    \ is where we declare the counter variable and set its initial value.\n\n**Condition:**\
    \ The condition is a Boolean expression, just like an if statement. The code block\
    \ of the for loop will repeat until the condition evaluates to true.\n\n**Increment:**\
    \ The increment section allows us to increment or decrement our counter.\n\n#\
    \ Code Listing 7.5: For Loop Counting from 0 to 9\n\n```java\nfor(int j = 0; j\
    \ < 10; j++) {\n    System.out.println(j);\n}\n```\n\nCode Listing 7.5 shows a\
    \ for loop that counts from 0 to 9. The initialization declares an integer variable\
    \ j, setting its value to 0. The condition is \"j < 10\", which means the loop\
    \ will execute as long as this is true. The increment part \"j++\" increments\
    \ j by one after each iteration. The body of the loop is \"System.out.println(j)\"\
    , which prints the value of j. The loop will execute 10 times, printing numbers\
    \ 0 through 9.\n\n# Code Listing 7.6: Counting Backwards with For Loop\n\n```java\n\
    for(int j = 10; j > 0; j--) {\n    System.out.println(j);\n}\n```\n\nThe loop\
    \ in Code Listing 7.6 counts backwards from 10 to 1. The starting value is 10,\
    \ the condition is \"j > 0\", and the increment is \"j--\", which decrements j.\n\
    \n> Note: There is a special type of for loop used to iterate the collection,\
