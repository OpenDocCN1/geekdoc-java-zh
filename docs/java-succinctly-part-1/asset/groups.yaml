    We will now take a detour into a completely different but very useful aspect of
    programming—debugging code.


    # Detour: debugging code


    The ability to debug and maintain code is one of the most important attributes
    a programmer can have. With this in mind, when you first test your program in
    Eclipse, select the Debug icon, instead of the Run icon.


    # Printing out values


    We often need to know the value of variables while our program runs. The most
    basic form of discerning the value of a variable is to output this value to the
    screen. We can use System.out.println to do this, using System.out.println("The
    value of i is " + i); This is a very primitive method for debugging, but in many
    circumstances it is all we need. Generally, it is better to place a breakpoint
    and a watch on the variable, as described in the following section.


    # Setting breakpoints


    A breakpoint is a position in the code at which we want the program to pause and
    give us control so when a program pauses at a breakpoint, we can inspect the values
    of variables and step through the code—one line at a time. To set a breakpoint,
    right-click in the margin of the code view in Eclipse. This will bring up a context
    menu with the option Toggle Breakpoint, as per Figure 27.'
