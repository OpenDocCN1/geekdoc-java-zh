    \ they store. For example, the number 3 could theoretically be stored using only\
    \ two bits, 11, in binary. But, if we store 3 in the int: 00000000 00000000 00000000\
    \ 00000011, it will be padded with many zeros to take up the remaining bits.\n\
    \n# Variables\n\nA variable is a named, primitive data type. Each variable is\
    \ a collection of bytes acting as one of the primitive data types from Table 1,\
    \ and which we have given a name. We refer to variables by their name (instead\
    \ of their addresses in RAM) and can read or change their values in RAM using\
    \ the variable names as our references. A variable stores information, such as\
    \ the number 3 or the name Jane.\n\n# Variable declaration and definition\n\n\
    To declare a variable is to state that it exists. We give the data type and a\
    \ name—that is, an identifier. To define a variable is to specify for it a value.\
    \ Variables must be declared and defined before they are used.\n\nInitialization\
    \ comes when we define a variable's value for the first time. A variable that\
    \ is declared but not defined is called uninitialized, and the variable cannot\
    \ be used in computation until it is initialized. In Java, we can declare and\
    \ initialize a variable in a single line of code using the assignment operator\
    \ \"=\" (see the section on operators for more information on the assignment operator).\n\
    \nCode Listing 5.0 shows various declarations and definitions of variables.\n\n\
    Code Listing 5.0: Declaring and Defining Variables\n\n```java\npublic class MainClass\
    \ {\n    public static void main(String[] args) {\n        int i = 100; // Declare\
    \ and initialize an int.\n        int b = 10, c = 5;// Declare and initialize\
    \ two variables.\n        boolean mb = false; // Declare and define a Boolean.\n\
    \n        char myLetter; // Declare a character.\n        myLetter = 'h'; // Define/set\
    \ the character to be 'h'.\n        byte hp, bp, sp; // Declare 3 byte variables.\n\
    \        hp = bp = sp = 0; // Set all 3 bytes to 0.\n        short ss = 189; //\
    \ Declare and define a short integer.\n        long p = ss; // Declare and define\
    \ a long with the value of ss.\n        double myDouble = 100.0; // Declare and\
    \ define a double.\n        float f = 0.1f; // Declare and define a float.\n \
    \   }\n}\n```\n\nWhen declaring a variable, the data type comes first, followed\
    \ by the name of the variable, and optionally followed by the initial setting\
    \ for the variable. Variables can be defined on the same line as the declaration\
    \ (such as the int variables, b, and c in Code Listing 5.0) or on a separate line\
    \ (such as char myLetter in Code Listing 5.0). You can declare and define more\
    \ than one variable of the same type by separating each variable with a comma.\
    \ The numbers in Code Listing 5.0, such as 189 and 0, as well as the character\
    \ 'h' and the boolean value false, are called literals. We will examine them later.\n\
    \nYou can also use mathematical and logical statements to initialize a variable.\
    \ For example: int Integer = 10+1. This will set the variable Integer to 11.\n\
    \n> Tip: Name your variables clearly Selecting can greatly increase the readability\
    \ of code. In general, a programmer should name variables succinctly. Consider\
    \ \"s\" as a variable to store employee's salary, or the more appropriately \"\
    employeeSalary.\" Calling the variable \"employeeSalary\" is much more descriptive\
    \ than the letter \"s\".\n\nNote: As mentioned, many programmers use a technique\
    \ called Camel Case to name identifiers in Java (and other languages). The first\
    \ word of a member method or variable's name is lowercase, and all subsequent\
    \ words begin with an uppercase letter. For example, \"myVariable\" and \"vehiclesPerHour.\"\
    \ But class names begin with an uppercase letter—\"MyClass\" and \"UserInformation\"\
    \n\n# Detour: strings\n\nBefore we move on describing literals, let's take a brief\
    \ detour to examine a data type that is not primitive. String is not primitive,\
    \ but is so commonly used that it can be introduced with the other data types.\
    \ A String is an array (see the section on arrays) or sequence of characters,\
    \ one after the other. A String can be used to represent text, numbers, or sequences\
    \ of Unicode symbols (a String is literally a string of char variables). We surround\
    \ text with double quotes to indicate that it is a String.\n\n```java\nString\
    \ str = \"This is a string variable\"\n```\n\nWe can define a String on multiple\
    \ lines using the + operator to connect more than one String together (Code Listing\
    \ 5.1).\n\nCode Listing 5.1: Multiple-Line String\n\n```java\nString description\
    \ = \"Strings can \" + \n\"be defined on multiple \" + \n\"lines with the + operator!\"\
    ;\n```\n"
