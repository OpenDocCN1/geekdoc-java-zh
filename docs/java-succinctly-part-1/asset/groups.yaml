    \ = numerator / denominator;\n        int fractionalResult = numerator % denominator;\n\
    \        System.out.println(\"The result is \" + wholeResult + \" \" + fractionalResult\
    \ + \" /\" + denominator);\n    }\n}\n```\n\n# Floating-point arithmetic: rounding\
    \ error\n\nFloating-point variables (double and float) can seem limitless because\
    \ they have a very large range, and can seemingly represent very precise fractional\
    \ values. But floating-point variables are as limited as integers, and, with it,\
    \ you should be aware of several caveats regarding floating-point arithmetic.\
    \ The most important thing to keep in mind when using floating-point arithmetic\
    \ is this—the more operations performed on floating-point values, the more error\
    \ will be in the result.\n\nFloating-point variables can store only a specific\
    \ set of rational numbers. We assume that any real number can be stored in a float\
    \ or double, but this is not true. The only numbers a float or double can store\
    \ are sums of powers of two and the zero (0). Numbers such as 256, 1/4 or 4096.175\
    \ are all stored perfectly with no rounding in floating-point variables. Others\
