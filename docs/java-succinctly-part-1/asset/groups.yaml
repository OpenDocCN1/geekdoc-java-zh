    \ into a primitive int is called Unboxing. For more information on Boxing and\
    \ Unboxing, visit Oracle at https://docs.oracle.com/tutorial/java/data/autoboxing.html.\n\
    \n## Literals\n\nLiteral is a value written in the code, such as 27, the character\
