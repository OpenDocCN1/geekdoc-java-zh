    \ conditions will have its code executed. The computer will check the if and else\
    \ from top to bottom. The variable is set to 25, which is an odd number but not\
    \ divisible by 5. Therefore, the second else will print \"i is divisible by 5\"\
    . No other blocks will execute after this.\n\nIf, instead of 25, we set the variable\
