    \nIn Java, as with all computer programming languages, we can read and write data\
    \ to various memory spaces. A memory space is simply an area in which we can save\
    \ and retrieve information. One of the most useful memory spaces that we can read\
    \ and write to is called RAM. Random Access Memory is a type of volatile memory\
    \ used for temporary storage (volatile means it is cleared when the system reboots).\n\
    \nRAM is nothing more than a string of 0s and 1s. The 0s and 1s are organized\
    \ into bytes of 8 bits each (a bit is short for binary digit—it is a single 0\
    \ or 1): See Figure 35 for an illustration of several bytes in RAM.\n\n| 02AC\
    \ | 02AB | 02AA | 02A9 | 02A8 | 02A7 | 02A6 |\n|---|---|---|---|---|---|---||\n\
    | 14 | 26 | 200 | 117 | 17 | 4 | 91 |\n\n![](img/d6e922df0109ee8e372f5019b6a2a192_48_0.png)\n\
    \nFigure 35 shows seven bytes in RAM. Each byte in RAM has an address written\
    \ above the boxes (real addresses on modern computers have 16 hexadecimal digits\
    \ instead of the four I've used in the illustration). The addresses are consecutive\
    \ numbers counting up as we move through RAM from left to right. The addresses\
    \ are written in hexadecimal (so we use 02A8 instead of 680—hexadecimal is not\
    \ important at the moment).\n\n> Note: In Java, we do not have access to the addresses\
    \ in RAM. This is one of the biggest differences between Java and related languages\
    \ C and C++. Accessing RAM directly with addresses can be dangerous—it is easy\
    \ to accidentally access the wrong bytes and cause bugs in our programs. So, Java\
    \ does not allow direct access to RAM.\n\nAlong with an address, each byte in\
    \ RAM has a value (such as 14, 100, or 117 in Figure 35). As you can see, RAM\
    \ is a collection of bytes, each with an address so that we can reference the\
    \ bytes, and a value, so that we can read and write some information.\n\nIn Figure\
    \ 35, the byte at address 02A9 is zoomed in, and we can see the individual bits\
    \ that make up the number 117 written out in the binary counting system. In binary,\
    \ bits are read from left to right, the same way we read decimal numbers. So,\
    \ the bit on the left is the most significant (as in the 6 in 684), and the bit\
    \ on the right is the least significant (as in the 4 in 684).\n\nProgramming a\
    \ computer is difficult when we reference RAM by addresses (and Java does not\
    \ allow us direct access to bytes by their addresses). Addresses are simply hexadecimal\
    \ numbers, and they do not appear meaningful to humans.\n\nAs programmers, we\
    \ need to manipulate and control hundreds, thousands, and even millions of bytes\
    \ in RAM, and doing with so is extremely difficult. Therefore, instead of referencing\
    \ RAM by addresses, we name certain points in RAM and use the names instead of\
    \ addresses. These named points in RAM are called variables. A variable is literally\
    \ a point that we have named and which we can read and write in RAM. Variables\
    \ often contain multiple bytes—for instance, int in Java is built from four consecutive\
    \ bytes and can store larger numbers than a single byte can store.\n\nThe floating-point\
    \ types are used to represent approximations to fractions. The format of floats\
    \ and doubles in Java follows the IEEE 754 Standard, which is a scientific notation\
    \ for representing fractions in binary.\n\n## Primitive types\n\nThe primitive\
    \ data types are the building blocks of Java. There are only two types of primitives:\
    \ Integer and Floating-point.\n\nTable 1: Primitive Data Types\n\n| Name | Type\
    \ | Size (Bytes) | Size (Bits) | Minimum | Maximum |\n|---|---|---|---|---|---|\n\
    | byte | Integer | 1 | 8 | -128 | 127 |\n| short | Integer | 2 | 16 | -32768 |\
    \ 32767 |\n| int | Integer | 4 | 32 | -2147483648 | 2147483647 |\n| long | Integer\
    \ | 8 | 64 | -9223372036854775808 | 9223372036854775807 |\n| float | Float | 4\
    \ | 32 | -3.4E+38 | 3.4E+38 |\n| double | Float | 8 | 64 | -1.7E+308 | 1.7E+308\
    \ |\n| boolean | Boolean | 1 | 8 | false | true |\n\nThe boolean type is unique\
    \ because it can only have two values: true or false. When we print a boolean,\
    \ we will get true or false instead of 1 or 0 (even though the underlying data\
    \ is an integer). The character type is used to store Unicode characters, and\
    \ when we print a char, Java will print out the symbol that corresponds to the\
    \ integer value.\n\nFigure 36: Primitive Data Type Sizes\n\n| Name | Type | Size\
    \ (Bytes) | Size (Bits) |\n|---|---|---|---|---||\n| char | Character | 2 | 16\
    \ | Unicode |\n\n![](img/d6e922df0109ee8e372f5019b6a2a192_50_0.png)\n\nThe fourth\
    \ column shows how many bits (binary digits) each primitive takes up in RAM. This\
    \ will always be a multiple of eight because RAM is a series of bytes, and bytes\
    \ are eight bits. The exact workings of binary are not important at this point\
    \ (we will look into some detail at binary when we look at the bitwise operators),\
    \ but it is easy to represent any number in binary that can represent in base\
    \ 10. For instance, the number 219 in binary is the same as 11011011 in binary.\n"
