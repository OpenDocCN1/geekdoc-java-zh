    \ Output from Code Listing 4.1 Code blocks and curly braces\n\nThe program is\
    \ intended as a study in code blocks. Java inherits from a very old language C.\
    \ The languages are collectively called curly brace languages because they use\
    \ { } to designate areas of code (these languages are also sometimes called C-like).\
    \ Each opening brace, {, has a matching brace, }, and each pair contains one or\
    \ more lines of code, which is called a code block. You can open and close a block\
    \ for no reason at almost anywhere in Java source code, but code blocks are usually\
    \ a mechanism for joining several lines of code into a unit for specific purpose.\
