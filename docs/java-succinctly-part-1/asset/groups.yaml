    # Figure 27: Toggle Breakpoint


    When a breakpoint is active (i.e. if the program will when it reaches the breakpoint),
    you will see a small breakpoint symbol in the margin of the code window, as illustrated
    in Figure 28.


    # Figure 28: Active Breakpoint


    When the breakpoint indicator is blue, in Figure 28, it means the breakpoint is
    active. You can disable a breakpoint by right-clicking the breakpoint symbol and
    selecting Disable Breakpoint from the context menu. When a breakpoint is disabled,
    the circle is white and the program will not pause when it reaches the breakpoint.


    # Debug perspective in Eclipse


    When the program reaches an active breakpoint, it pauses and gives us control.
    The first time you break in Eclipse, you might get a message box, as shown in
    Figure 29. Eclipse is designed to offer several extra tools specific to debugging,
    and it offers to change the view to the Debug perspective. Click the box marked
    “Remember my decision” and select “Yes” to enter the Debug perspective.'
