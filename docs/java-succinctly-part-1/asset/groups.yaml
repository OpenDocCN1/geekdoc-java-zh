    # Chapter 4 Reading Input


    # Reading System.in


    The program in Code Listing 4.0 illustrates how to read input from the user. Specifically,
    we ask users for their names and to read some text that they type at the keyboard.


    Code Listing 4.0: Reading Input


    ```

    1: import java.util.Scanner;

    2: public class MainClass {

    3:     public static void main(String[] args) {

    4:     Scanner scanner = new Scanner(System.in);

    5:     System.out.println("What is your name?");

    6:     String str = scanner.nextLine();

    7:     System.out.println("Nice to meet you, " + str + "!");

    8:     }

    9: }

    ```


    Line 1 imports Scanner class from the java.util package. A Scanner scans a stream,
    waiting for and reading data. There are thousands of prewritten tools included
    with Java that we can import in a similar way if we wish to use them. Code Listing
    4.0 uses a scanner to scan System.in, which is a stream of bytes representing
    the data user types to the console.


    Line 2 is the opening declaration for the MainClass.


    Line 4 is where we declare a java.util.Scanner object. We specify that our scanner
    is to scan the System.in. The Scanner class has a constructor that takes a stream
    as a parameter (a constructor is a special method used to create an instance of
    a class). A scanner object (called scanner with a lowercase s because it is an
    object, not a class) is created when we use the new operator to call the constructor.
    We will look at exactly what this line does in a lot more detail when we cover
    the new operator in object-oriented programming. For the moment, this line means
    we create a Scanner object called scanner and we can input it stream.in.


    Line 5 prints a prompt to the console asking for the user''s name.


    Line 6 is where we read text from the keyboard. We do this by calling the scanner
    object''s nextLine method. The method takes no parameters, so we supply empty
    brackets ( and ). This line will read text until the newline symbol is read (i.e.
    until the user hits enter or return on the keyboard). Scanner.nextLine() will
    return the text user typed as a String that we assign to the String variable str
    with the assignment operator str =.'
