    and a small collection of nonlocal terms called keywords. And Java has a series
    of rules for how to use these elements (i.e it has a grammar). In Eclipse we can
    identify keywords in our code because they are highlighted in dark purple, and
    they are bold, as class and public in Code Listing 3.1.


    Keywords form the main backbone of the Java works. Keywords are reserved for specific
    uses in Java, and they cannot be used as identifier names. See the Appendix for
    a reference on the available keywords. The following is a list of keywords we
    have encountered so far:


    public: The public keyword is an access modifier. It means that external objects
    (objects that are not part of the class being defined) can access the methods
    or member variables.


    class: The class keyword is used to indicate that the code block that follows
    is a description of a class.


    static: The static keyword mark member methods and variables as belonging to the
    entire class rather than specific objects or instances of the class. This means
    we can access static members without creating objects from the class.


    void: The void keyword is used as a placeholder for a return type when a method
    does not return any data. All methods must have a return type or must have the
    return type of void. The only exception to this rule is constructors that have
    no return type and have the same name as the class.


    # Dot operator


    In Code Listing 3.1, line 3 reads as follows: System.out.println("This is a test
    application!"); This line contains several periods (or full stops). This is the
    dot operator (sometimes called the scope operator). It is the operator that connects
    classes to methods'
  - '[PAGE 28]


    member variables. System is a class, and out is an entity belonging to the System
    class. When we supply the terms System.out connected by the dot operator, we are
    saying, "The out entity belongs to the System class" or, in short, "System''s
    out."


    The method println belongs to the out entity. When we invoke the method by specifying
    its name, System.out.println, by a parameter list, ("This is a test application!"),
    we are really saying: Execute the code specified in the method called println,
    which belongs to the out entity, which belongs to the System class. Now how the
    dots indicate orientation from left to right—System out, and owns println.


    We will later detail in detail at object-oriented programming, but the main objective
    of object-oriented programming is to define hierarchies of objects, each owned
    by and potentially owning objects, and each capable of performing methods with
    a collection of member variables. Different classes can contain variables and
    methods with the same names. For example, we might have multiple variables called,
    one belonging to a class House and another belonging to a class Vehicle. We can
    distinguish these variables by using the code House.cost vs. Vehicle.cost.


    # Comments


    Code Listing 3.2 shows several comments, a comment is a note to the programmer.
    The computer will ignore all comments when the program executes. There are many
    applications for comments, and every programmer has a unique style of commenting
    on his or her code. Although comments do not change the way a program runs, developing
    good commenting skills is extremely important. Comments allow a programmer to
    describe exactly what the code should be doing. This means that any other programmer
    should be able to read the comments and understand the implications of complex
    code at a glance.


    In Java, there are two types of comments—single-line comments and multiline (or
    block) comments (see Code Listing 3.2).


    Code Listing 3.2: Comments


    ```

    // This is a single-line comment!

    System.out.println("Press a key to continue..."); // Single-line comment!

    /*

    This is a multiline comment. It extends from the opening symbol of a slash and

    star to the closing symbol, a star followed by a slash!

    */

    ```'
  - '[PAGE 29]


    Code Listing 3.2 shows the different types of comments. The first is the single-line
    comment. These begin with two slashes, //. All text to the right of the // is
    ignored by the computer. If a line of code begins with the //, the entire line
    is ignored, but you can also place the // after some statements, such as a println.


    The multiline comment begins with /* and extends until the */. The programmer
    can place any text inside the /* and */ including new lines. This is sometimes
    called a block comment because it enables a programmer to write blocks of text
    or to comment out blocks of code.


    In the upcoming code examples, we will see many comments included to help the
    reader identify what the different lines of code are supposed to do.


