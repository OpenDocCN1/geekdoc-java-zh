    \n## 成员变量\n\n每个在类体内部但在任何访问修饰符之外从类成员构建的对象都具有这些。除了具有数据类型和名称外，成员变量还可以有访问修饰符。访问修饰符描述了成员变量对外部的可见性，即它们定义了对象是否可以访问此成员变量，或者它是私有的。\n\
    \n> 代码列表 8.1：Circle 类成员变量\n```java\npublic class Circle {\n    public float radius;\n\
    \    private String name;\n    protected float lineWidth;\n    private static\
    \ int setCount;\n}\n```\n\n在代码列表 8.1 中，为我们的 `Circle` 类定义了四个成员变量。注意数据类型旁边有 `public`、`private`、`protected`\
    \ 和 `static` 等术语。这些是访问修饰符。它们放置在数据类型的左侧。\n\n**public:** 所有类都可以访问被标记为 `public` 的成员变量和方法。\n\
    \n**protected:** 属于同一个包的类和对象允许访问 `protected` 成员变量。\n\n**private:** 被标记为 `private`\
    \ 的成员变量仅可由类本身访问——即由该类创建的对象。\n\n**static:** 成员被标记为属于类而不是从该类创建的对象。如果我们把成员变量标记为 `static`，则将有一份被类中所有对象共享的变量副本。标记为\
