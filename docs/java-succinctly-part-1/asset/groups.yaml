    # # Chapter 2 Getting Started


    In this section, we will examine how to install the Eclipse Integrated Development
    Environment (IDE). Eclipse is a tool used to program, maintain, debug, and compile
    Java applications. An IDE is a collection of tools that make application development
    easier. Java, like many languages, can be programmed with nothing more than a
    console and a text editor (such as Notepad). However, using Notepad as an IDE
    is laborious and can lead to errors. Any functional IDE can reduce the amount
    of time it takes to solve problems in a language. Eclipse offers syntax highlighting,
    bug-fixing suggestions, single-click testing and debugging of an application,
    and literally thousands of other options for helping to make programming simpler.


    # ## Downloading and installing Eclipse


    To get the latest version of Eclipse, head over to https://eclipse.org/downloads/.


    ![](img/d6e922df0109ee8e372f5019b6a2a192_9_0.png)


