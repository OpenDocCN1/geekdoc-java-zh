- md: "\n```java\nif(age == 50 || 60) { ... // This is incorrect!\n\nif(age == 50\
    \ || age == 60) { ... // This is correct!\n```\n\nThe first example reads normally:\
    \ If age is 50 or 60 ... However, this expression evaluates to Java code. The\
    \ computer will read it with || operator, the program will lock for the next condition.\
    \ The next condition consists of the integer literal 60 itself. But 60 is not\
    \ a condition, and the program will not run. The correct way to check multiple\
    \ settings for the age variable is illustrated in the second example—we use \"\
    age == 60\" instead of 60 itself.\n\n# Nesting if statements\n\nWe can place if\
    \ statements inside the code blocks of other statements. These are called nesting\
    \ if statements.\n\n> Code List 7.3: Nested If Statements\n\n```java\nint age\
    \ = 190, price = 14;\nif(age > 50 && age < 100) {\n  if(price > 20) {\n    System.out.println(\"\
    Age: \" + age + \" Price: \" + price);\n  }\n}\n```\n\nCode List 7.3 contains\
    \ a nested statement. The first condition tests the variable \"age\" and determines\
    \ it is in the range of 51 to 100 (not inclusive). Due to the && operator, conditions\
    \ must be true. Therefore, if age is in the range from 51 to 99, the if statement's\
    \ code block will execute. The inner if statement tests whether the price is greater\
    \ than 20. This means that if the age does not fall within the range of 51 to\
    \ 99, the computer will not consider the second statement because it exists in\
    \ the code block of the first.\n\n# Else and if else\n\nWe can follow an if with\
    \ any number of else if (which translates to \"otherwise\") statements. And we\
    \ can end a set of if/else if with a final else statement. Only one code block\
    \ in a set of if/else if will execute. The code block that executes will always\
    \ be the first block in which the condition evaluates to true.\n\nIf the condition\
    \ of an if or else evaluates to false, the program will look for the next else\
    \ if or else. When one of the conditions is found to be true, the computer will\
    \ execute the associated code block for that condition, then it will drop down\
    \ the entire if/else if/else block and resume execution after the set of conditions.\
    \ We use else if to provide additional conditions. The if keyword is followed\
    \ by a condition in brackets—exactly the same as an if statement. The difference\
    \ is that an else must have an if statement before it. The else cannot stand alone.\n\
    \nThe else keyword is always the final option. When the computer reads an else\
