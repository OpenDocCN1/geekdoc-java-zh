    Table 1 shows all of the primitive data types available in Java. The first column
    shows the keywords used in Java when we declare variables (we will look at declaring
    variables shortly).


    The Type column shows the fundamental data type of each primitive. There are only
    two data types: Integer and Floating Point. Integer data types are whole numbers—they
    can be negative and positive—but they cannot have any decimal part; e.g., 6, 2378,
    or -1772. Floating-point data types are used to represent values with some fractional
    part, such as 28.7 or -1772.1671.


    The Boolean and Character types are actually integers, but there are various functions
    available in Java that treat these particular primitives differently than regular
    integers. For instance, when we print the value of a boolean, we will get true
    or false printed to the screen instead of 1 or 0 (even though the underlying data
    is an integer 0 means false and anything else means true). And when we print the
    value of a char variable, Java will print out the Unicode symbol that corresponds
    to the integer value of the char variable.


    The third column shows the sizes in bytes for each of the primitive data types.
    Figure 36 shows an illustration of the sizes of each primitive. Each box represents
    one byte of RAM. The numbers show the most common byte-order—Java is Little Endian,
    the lowest byte in a multiple-byte type, on the right side. Floats and doubles
    use a specific format that is very different from integers. The format of floats
    and doubles in Java follows the IEEE 754 Standard, which is a scientific notation
    for representing approximations to fractions in binary.


    | Name | Type | Size (Bytes) | Size (Bits) | Minimum | Maximum |

    |---|---|---|---|---|---|n| char | Character | 2 | 16 | Unicode | Unicode |


    ![](img/d6e922df0109ee8e372f5019b6a2a192_50_0.png)


    | Float | 3 2 1 0 |

    | Short | 1 0 |

    | Int | 3 2 1 0 |

    | Double | 7 6 5 4 3 2 1 0 |

    | Long | 7 6 5 4 3 2 1 0 |


    The fourth column shows how many bits (binary digits) each primitive takes up
