    # Debugging and running applications


    Let''s test our application. To debug an application is to run it in such a way
    that we are offered extra information that help us track down and eliminate bugs.
    Typically, when we develop a Java application, we test the program at intervals
    in order to make sure everything is running smoothly. As our projects become larger,
    we must examine all of the interacting components in great detail in order to
    be certain that we have not done anything wrong.


    Eclipse allows us to debug, but it also allows us to run the application. Running
    the application is like debugging, except that we get less information as to what''s
    running within the application. When we use Run, the compiler (javac) might optimize
    our code and remove all debugging information. It is recommended that an application
    is being developed, we use Debug. When you are satisfied that an application is
    complete and working properly, you can use Run to build your application first
    release.


    In order to debug your code in Eclipse, click Debug (it has a beetle icon, as
    in Figure 16). The Play button (to the right of the debug), is for your application
    without debugging.


