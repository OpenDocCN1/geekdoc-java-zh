    将函数命名为 `computeMedianOfHouses` 比将其命名为 `Doing` 或 `cabbagesWithwhippedCream` 要好（假设该函数计算房屋的位数）。如果我们不使用逻辑且易于的名称来命名标识符，其他程序员可能在理解和维护我们的代码时遇到困难。更糟的是——我们也无法理解自己的代码。令人惊讶的是，如果我们不仔细并智能地命名标识符，我们的代码变成乱码所需的时间是短得令人不可指。


    > 注意：使用逻辑且描述性的名称命名标识符有少数例外。例如，在循环中将迭代器（计数变量）称为单字母名称如 `i`、`j`、`x`、`y` 或 `z` 是常见的。这并没有说明该变量的含义，但其他程序员仍然能够理解它们的用途。此外，某些算法在描述中有特定的变量名，在编写算法实现时通常会使用这些变量的通用名称，例如
    A* 路径查找算法就使用了名称 `t` 和 `h`。


    # 关键字


    与英语等人类语言相比，计算机编程语言非常简单。Java 拥有一组很小的图形符号（如 `{ }` 大括号）和一组很小的称为关键字的非本地术语。Java 拥有一系列关于如何使用这些元素的规则（即它有一套语法）。在
    Eclipse 中，我们可以识别代码中的关键字，因为它们被高亮为深紫色，并且是**粗体**的，如代码列表 3.1 中的 `class` 和 `public`。


    关键字构成了 Java 作品的主骨干。关键字在 Java 中被保留用于特定用途，不能作为标识符名称使用。请参阅附录获取可用关键字的参考。以下是我们目前为止遇到的关键字列表：


    - public: `public` 关键字是一个访问修饰符。它意味着外部对象（不是正在定义的类部分的对象）可以访问方法或成员变量。

    - class: `class` 关键字用于指示随后的代码块是类的描述。

    - static: `static` 关键字将成员方法和变量标记为属于整个类，而不是类的特定对象或实例。这意味着我们可以在不创建类对象的情况下访问静态成员。

    - void: `void` 关键字在方法不返回任何数据时用作返回类型的占位符。所有方法必须有一个返回类型，或者返回类型必须为 `void`。该规则的唯一例外是没有返回类型且与类同名的构造函数。


    # 点操作符


    在代码列表 3.1 中，第 3 行如下：`System.out.println("This is a test application!");`。这一行包含了几个点（或句号）。这就是点操作符（有时称为作用域运算符）。它是连接类与方法成员变量的运算符。`System`
    是一个类，`out` 是属于 `System` 类的实体。当我们提供通过点操作符连接的术语 `System.out` 时，我们是在说：“out 实体属于 `System`
    类”，或者简而言之，“System 的 `out`”。


    `println` 方法属于 `out` 实体。当我们通过指定其名称 `System.out.println` 和参数列表 `("This is a test
    application!")` 调用该方法时，我们实际上是在说：执行名为 `println` 的方法指定的代码，该方法属于 `out` 实体，而该实体属于
    `System` 类。现在看点如何指示从左到右的方向性——`System out`，并且拥有 `println`。


    我们将在后的面向对象编程中详细说明，但面向对象编程的主要目标是定义对象的层级结构，每个对象都拥有并可能拥有其他对象，并且每个对象都能通过一组成员变量执行方法。不同的类可以包含相同名的变量和方法。例如，我们可能有多个名为
    `cost` 的变量，一个属于 `House` 类，另一个属于 `Vehicle` 类。我们可以通过代码 `House.cost` 对比 `Vehicle.cost`
    来区分这些变量。


    # 注释


    代码列表 3.2 显示了几个注释，注释是给程序员的备注。当程序执行时，计算机将忽略所有注释。注释有许多应用，每个程序员都有其对其代码注释的独特风格。虽然注释不会改变程序的运行方式，但培养良好的注释技巧是非常关重要的。注释允许程序员精确地描述代码应该在做什么。这意味着任何其他程序员都应该能够阅读注释并一眼理解复杂代码的含义。


    在 Java 中，有两种类型的注释——单行注释和多行（或块）注释（参见代码列表 3.2）。


    代码列表 3.2：注释


    ```

    // This is a single-line comment!

    System.out.println("Press a key to continue..."); // Single-line comment!

    /*

    This is a multiline comment. It extends from the opening symbol of a slash and

    star to the closing symbol, a star followed by a slash!

    */

    ```


    代码列表 3.2 显示了不同类型的注释。第一个是单行注释。它们以两个斜杠 `//` 开头。`//` 右侧的所有文本会被计算机忽略。如果一行代码以 `//`
    开头，整行都会被忽略，但你也可以将 `//` 放在某些语句之后，例如 `println`。


    多行注释以 `/*` 开头并延伸到 `*/`。程序员可以在 `/*` 和 `*/` 之间放置任何文本，包括换行。这有时被称为块注释，因为它允许程序员编写一段文本或注释掉一段代码。


    在接下来的代码示例中，我们将看到许多注释，以帮助读者识别不同行代码的作用。


    # 挑战


    **挑战 3.0:** 将标识符 `args` 更改为 `arguments`。程序可以编译并运行吗？


    **挑战 3.1:** 将标识符 `args` 更改为 `arguments`。程序可以编译并运行吗？


    **挑战 3.2:** 将打印到屏幕的消息更改为 "Hello"。


    **挑战 3.3:** 将类名 `MainClass` 更改为 `MyClass`。


    # 解决方案


    # 挑战 3.0


    将标识符 `args` 更改为 `arguments` 后，程序可以编译并运行。


    # 挑战 3.1


    我们将 `main` 方法的名字更改为 `mainMethod`，程序将无法编译并运行。


    # 挑战 3.2


    我们将打印到屏幕的消息更改为 "Hello"。


    # 挑战 3.3


    将类名 `MainClass` 更改为 `MyClass`。

    '
