    marked as static can be accessed via the class without instantiating an instance.


    strictfp: The strictfp keyword is used to mark a method or class as using a strict
    version of floating-point arithmetic. This is a feature designed to allow programmers
    to be certain that their floating-point computations will be exactly equal regardless
    of the machine the application is running on. The use of the strictfp keyword
    is rare.


    super: The super keyword is used to reference a child''s parent class. The parent
    class is called super, and in the child class we can call the super''s constructor
    by using super().


    switch: The switch keyword is used to introduce a switch block. It is a control
    structure that allows a single option to be selected from a series of possibilities,
    which is similar to a collection of if/else if statements.


    synchronized: The synchronized keyword is used to mark methods as being exclusive
    to a single thread at a time. Objects executing synchronized methods will always
    execute the method one at a time rather than all the threads to execute the code
    at once with multiple threads.


    this: The this keyword is used inside a method to allow an object to refer to
    itself. The keyword is often used to differentiate between a method''s parameters
    and an object''s member variables that share the same name.'
  - '[PAGE 120]


    throw: The throw keyword causes an exception to be raised. The program will look
    for a relevant catch block and can potentially exit the application with an error
    message if the exception is not handled.


    throws: The throws keyword is used to indicate that a method will potentially
    throw a particular exception. This allows the caller of the method to safely surround
    the method call with a try/catch block.


    transient: The transient keyword is used when serializing objects. To serialize
    an object is to convert it to a stream of bytes. When we make a member variable
    as transient, it does not become serialized.


    true: The true keyword and the false keyword are the only two options for boolean
    variables and expressions.


    try: The try keyword is used to surround code that could potentially throw an
    exception. We use try in conjunction with catch and finally to gracefully handle
    possible problems while our program executes.


    void: The void keyword is used to mark a method as not returning any data type.
    All methods require a return type (otherwise, they are constructors), and if a
    method does not return any data at all, the return type must be marked void.


    volatile: The volatile keyword is used to mark member variables as potentially
    being modified by multiple threads. The keyword ensures that all access to the
    variable with multiple threads is safely coordinated by blocking more than one
    thread at a time.


    while: The while keyword is used to specify a while loop, and it is also used
    to specify a while loop. These loops are blocks of code that repeat indefinitely
    until some specific condition is false.'
