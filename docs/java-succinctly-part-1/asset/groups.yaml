    # 图 1：计算机结构图


    图 1 展示了计算机的基本特征。在中心，我们有一个非常重要的硬件——中央处理单元（CPU），它是机器的大脑。它从键盘、鼠标或其他输入设备读取数字字符串形式的输入。它将数据写入显卡、打印机和音频设备。它还负责读写
    RAM 和硬盘等内存空间的数据。


    CPU 通过执行一系列指令来工作。计算机中的一切皆都是数字，甚至指令本身也是如此。指令通常非常简单——它们指示 CPU 应该执行某些任务，例如相两个数字或创建一个数字的副本。CPU
    的语言——汇编语言是计算机编程的最低层级。使用汇编语言为 CPU 是繁琐的，因为每条指令几乎什么都不做，在我们的应用程序有用之前，我们需要成千上万条指令。每个
    CPU 都有自己的汇编语言。如果我们编写了一个运行在桌面级 PC 上的应用程序，该代码无法被 iPhone 或三星平板电脑识别。


    由于用 CPU 自身的语言进行非常困难，人们发明了更接近人类语言（如英语和算术）的高级语言。Java 就是其中一种高级语言。我们不再指定一系列单独的指令，而是可以使用诸如
    `a = a + b` 这样的数学表达式。这节省了大量时间，原因有两个：


    -   它更容易编程。

    -   它更容易阅读和维护。


    # 代码列表 1.0：高级语言 vs 低级语言


    ```

    ; 汇编语言：低级语言

    mov rax, a; 读取 a 的值

    add rax, b; 将 b 的值加到 a

    mov a, rax; 将结果写入 a


    // Java: 高级语言


    a = a + b;

    ```


    代码列表 1.0 显示了高级语言（如 Java）与低级语言（如汇编语言）之间的明确区别。在低级语言中，两个值 `a` 和 `b` 的相加以及将结果存回 `a`
    需要三个步骤。必须指令计算机执行操作的每一个特定细微末节，从将值移动到内部寄存器（如 RAX）到加法运算本身。在 Java 中，我们可以将整个操作表示为单行易于读的代码，它看起来完全就像初中代数：`a
    = a + b`。这行代码的意思是：取变量 `a` 中的值，将其加上 `b` 的值，并将结果赋值回该变量。


    代码 1.0 显示了 Java 中的一个简单表达式，这个表达式在许多其他基于 C 的语言中看起来也是那样的。然而，与 C 或 C++ 相比，用 Java 编写应用程序还有一个额外的优势。Java
    程序被设计为运行在虚拟机上。图 2 展示了原生应用程序与 Java 应用程序的对比图。当我们编写原生应用程序时，必须为程序运行所需的每种系统类型编译代码。这意味着如果我们想让应用程序运行在桌面电脑和笔记本电脑上，我们需要为
    ARM CPU 创建一个版本，并为 x86 创建另一个版本的程序代码。


    在这一方面，Java 的工作方式不像 C 和 C++。在 Java 中，我们只编写一个版本的应用程序。不同的 CPU（ARM、x86 等）都运行虚拟机，再由虚拟机运行我们的应用程序。虚拟机仅仅是一个用于模拟假设的
    Java 计算机硬件的程序。这意味着我们可以编写一次程序，任何带有 Java 虚拟机模拟器（即安装了 Java）的设备都能运行我们的应用程序。这是 Java
    的巨大优势——这意味着我们的应用程序可以在大量设备上运行，而无需专门为它们进行设计。


    ![](img/d6e922df0109ee8e372f5019b6a2a192_8_0.png)


    图 2：Java虚拟机


