    \ to an integer, store in i\ndouble d = (double) 89.7f; // Cast the float 89.7f\
    \ to a double, store in d\nshort q = (short) (i * d); // Cast the integer i*d\
    \ to a short and store in q\n```\n\nCasting a floating-point value to an integer\
    \ type results in truncation, so that 7.8 becomes 7 when stored in the integer\
    \ i.\n\nThis example shows something else interesting. The expression (i*d) results\
    \ in a double. When we perform an operation and mix integers or doubles, or floats,\
    \ the integers will be temporarily changed to double or float. That is, integers\
    \ are implicitly cast to double temporarily when mixing numeric arithmetic.\n\n\
    > Note: Each of the fundamental data types also has an object version with a similar\
    \ name: Integer, Double, Short, etc. All classes are used to wrap the fundamental\
    \ data types. The classes contain useful static methods that can be used for parsing\
    \ strings to integers or doubles. Changing a fundamental data type to its class\
