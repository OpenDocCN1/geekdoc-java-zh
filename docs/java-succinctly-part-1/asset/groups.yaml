    \ (i < 5);\n```\n\n## Switch 语句\n\n`switch` 语句允许根据单个值执行多个分支。`switch` 语句通常比一系列\
    \ `if-else` 语句更具可读性。\n\n`switch` 语句的语法为：\n\n```java\nswitch (expression) {\n \
    \   case value1:\n        // 如果 expression == value1 则执行代码\n        break;\n \
    \   case value2:\n        // 如果 expression == value2 则执行代码\n        break;\n \
    \   default:\n        // 如果没有任何匹配匹配则执行代码\n        break;\n}\n```\n\n`break` 语句用于退出\
    \ `switch` 语句。如果没有 `break` 语句，程序将继续执行后续 case，无论条件是否满足。\n\n这里是一个 `switch` 语句的示例：\n\
    \n```java\nint day = 3;\nswitch (day) {\n    case 1:\n        System.out.println(\"\
