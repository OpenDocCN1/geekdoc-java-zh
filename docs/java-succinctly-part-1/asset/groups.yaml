  - '[PAGE 56]


    # Literals


    Literal is a value written in the code, such as 27, the character A, or the floating-point
    value 78.9f. We have seen many literals already. We often set the values of variables
    to literals or use literals in computations in order to produce some result, store
    it in a variable.


    # Integer literals


    Integer literals are simply numbers. Integers can be positive or negative. Negative
    integer literals have the minus sign to the left of the left-most digit (e.g.,
    -27). For positive integer literals, the plus sign, +, is optional and almost
    never used (i.e. it would be normal to use 78 rather than +78, both are legal).


    Code Listing 5.6: Integer Literals


    ```

    int i = 100;

    int j = -239;

    short p = 99;

    byte q = -55;

    long l = 67876123567651;


    int h = 0x5DD2; // Hexadecimal

    int w = 067; // Octal

    int bin = 0b10011001; // Binary literal, Java SE 7 and above

    ```


    Code Listing 5.6 shows a code snippet with several integer variables declared
    and defined using integer literals. The literals are on the right side of the
    assignment operator:: A simple integer is an unadorned number such as 100, -239,
    99, and -55 in Code Listing 5.6. Such literals are interpreted by the JVM as normal
    decimal numbers, and they are converted to binary behind the scenes.


    Long literals have an "1" appended to the end (note that this is a lowercase),
    as like "long l = 67876123567651; shows). You can use a regular int to set the
    value of a long integer, but only if the literal does not fall outside the range
    of an int. Java will automatically convert the int to a long to store in the variable
    when the variable is of type long. If the literal is too large for a standard
    int, it must have the "1" suffix.


    Typically, programmers use base 10 without specifying integer literals.ing without
    prefixes are assumed to be in base 10 (such as 100, -239, and 99 in Code Listing
    5.6) because this is the most common syntax. The final illustrated literals in
    Code Listing 5.6 show how to define integer literals using the hexadecimal (base
    16), octal (base 8), and binary (base 2) counting systems. Sometimes it is easier
    to use hexadecimal or octal because these counting systems match the binary system
    that the computer uses more closely than base 10. In order to define a hexadecimal
    integer, you begin the literal with 0x. To define an octal literal, we use a leading
    zero. This can be quite confusing, so it pays to be careful when reading literals
    in more advanced code—the number 067 is not 67 in decimal, but it is 55.'
