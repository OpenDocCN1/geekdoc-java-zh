- md: "\n# Integer arithmetic: overflow\n\nIn Java, the integers do not have an infinite\
    \ size. They wrap around when the results are too great in magnitude to fit into\
    \ the designated variable. This is a very important difference between the arithmetic\
    \ that computers use and the mathematics of the real world. And it can lead to\
    \ some strange results if we are not careful.\n\n```java\npublic class Main {\n\
    \    public static void main(String[] args) {\n        // Causing overflow of\
    \ a byte:\n        byte myByte = 127;\n        myByte++; // Results in -128\n\
    \        System.out.println(\"Byte says 127+=\" + myByte);\n        myByte = -128;\n\
    \        myByte++; // Results in 127\n        System.out.println(\"Byte says -128=\"\
    \ + myByte);\n\n        // Causing overflow of a short.\n        short myShort\
    \ = 32767; // This is the maximum for short!\n        System.out.println(\"Short\
    \ is \" + myShort + \" before ++.\");\n        myShort++;\n        System.out.println(\"\
    Short is \" + myShort + \" after ++.\");\n        myShort--;\n        System.out.println(\"\
    Short is \" + myShort + \" after --.\");\n    }\n}\n```\n\n> Code Listing 6.2:\
    \ Overflow Example\n\nIn Code Listing 6.2, we set the variable myByte to 127,\
    \ which is the largest positive value that a byte can accommodate. In the next\
    \ line, we increment the variable using the ++ operator. Incrementing a variable\
    \ to 127 will result in the answer 128. But the value 128 is outside the range\
    \ of a byte, which is -128 to 127. Therefore, the result will actually wrap around,\
    \ and what we get 127+1=-128. Unless we are aware of this wraparound behavior,\
    \ it can quickly lead to bugs in our code as we count up in positive integers\
    \ and suddenly pop out the other with a very large negative value.\n\nSimilarly,\
    \ on the next line we set the value of myByte to -128, and then we try to subtract\
    \ 1 from this variable. Again, the result would normally be -129, but -129 does\
    \ not fall within the range of the byte and the result will wrap around to positive\
    \ 127.\n\nThe output from Code Listing 6.2 is as follows:\n\nByte says 127+1=-128\n\
    \n```\nByte says -128-1=127\nShort is 32767 before ++.\nShort is -32768 after\
    \ ++.\nShort is 32767 after --.\n```\n\nThe range of byte is very limited, which\
    \ means it can be easily illustrated. But we must remember that this wrapping\
    \ around occurs when we use any integer type, even long. The range of an int is\
    \ far greater than a byte, but it is not infinite.\n\n# Integer arithmetic: truncation\n\
    \nIn addition to overflow, division of two integers will always round the result\
    \ toward zero before storing. It may seem a poor choice at first, but it is a\
    \ more useful way to perform arithmetic than regular rounding (i.e. rounding to\
    \ the nearest number). The basic rounding rule is to chop any digits of the decimal\
    \ point, which means 6.7 becomes 6, and 89.23678 becomes 89, and -2773.223 is\
    \ this type of rounded truncation.\n\n> Code 6.3: Integer Rounding\n\n```java\n\
    int a = 24/5;      // Results in 4\nint b = -24/5;     // Results in -4\n```\n\
    \nCode 6.3 illustrates the division of 24 and -24 by 5. On the first line, we\
    \ divide 24 by 5 and store the result in the variable a. The result of 24/5 is\
    \ actually 4.8—or 4 and 4/5. Because integers are integers, the 4/5 is discarded.\
    \ Notice the 4.8 is not rounded up to 5, but toward 0. The digits of the decimal\
    \ point are simply chopped off.\n\nLikewise, the second line of Code 6.3, we see\
    \ the division of -24 by 5 results in -4. Normally, the result would be -4.8,\
    \ but again, integers can only store whole numbers and the digits of the decimal\
    \ point are chopped off (or truncated).\n\nTruncation is particularly useful when\
    \ dividing integers because we have the modulus operator in conjunction with the\
    \ division. If we want to know exactly what 24/5 is, we cannot use floating-point\
    \ numbers because floating point can only represent a handful of rational numbers\
    \ accurately, and 4.8 is not one of them. But we can use division and modulus\
    \ to maintain the exact result of an integer division. Code 6.4 shows a short\
    \ example of how we maintain\n\n> Code 6.4: Integer Arithmetic and Fractions\n\
    \n```java\npublic class Main {\n    public static void main(String[] args) {\n\
