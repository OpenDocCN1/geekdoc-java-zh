    \ 的范围内，if 语句的代码块将执行。内部的 if 语句测试价格是否大于 20。这意味着，如果 `age` 不在 51 到 99 的范围内，计算机将不会考虑第二个语句，因为第二个语句存在于第一个一个语句的代码块中。\n\
    \n# Else 和 if else\n\n我们可以在一个 `if` 后面跟上任意数量的 `else if`（翻译为“否则”）语句。我们还可以用最终的 `else`\
    \ 语句结束一组 `if/else if` 结构。在一组 `if/else if` 中，只有一个代码块会被执行。执行的代码块始终将是第一个条件求值为真的代码块。\n\
    \n如果 `if` 或 `else` 的条件为假，程序将寻找下一个 `else if` 或 `else`。当发现其中一个条件为真时，计算机将执行该条件对应的代码块，然后它将跳过整个\
    \ `if/else if/else` 块，并在条件集之后恢复执行。我们使用 `else if` 来提供额外的条件。`if` 关键字后面跟着一个括号内的条件——与\
    \ `if` 语句完全相同。区别在于，`else` 之前必须有一个 `if` 语句。`else` 不能独立存在。\n\n`else` 关键字始终是最后的备选。当计算机读取到\
    \ `else` 块时，如果之前没有一个条件求值为真，则 `else` 块将始终执行。`else` 块始终放在末尾，它没有条件。\n\n# 代码列表 7.4：If\
    \ / Else If / Else 块\n\n```java\nint i = 25;\nif(i % 2 == 0) {\n    System.out.println(\"\
    i is even\");\n} else if (i % 3 == 0) {\n    System.out.println(\"i is odd, but\
    \ divisible by 3\");\n} else if (i % 5 == 0) {\n    System.out.println(\"i is\
    \ divisible by 5\");\n} else {\n    System.out.println(\"i is not divisible by\
    \ 2, 3, or 5\");\n}\n```\n\n代码列表 7.4 显示了一系列简单的 `if/else`。只有其中一个条件的代码会被执行。计算机将从上到下检查\
    \ `if` 和 `else`。变量被设置为 25，它是一个奇数，但不能被 5 整除。因此，第二个 `else` 将打印 `\"i is divisible\
    \ by 5\"`。此后不会有其他块执行。\n\n相反，如果我们把变量设置为 22 而不是 25，第一个代码块将执行，程序将在屏幕上打印 `\"i is even\"\
    `。而且，如果我们将变量 `i` 设置为 17，注意 17 不是偶数，所以第一个条件失败了。17 不能被 3 整除，所以第二个条件失败了。17 不能被 5\
    \ 整除，所以第三个条件失败了。此时，程序遇到了 `else`。如果程序遇到 `else`，`else` 块将始终执行，因此当 `i` 设置为 17 时，程序将打印\
    \ `\"i is not divisible by...`\n\n# 循环\n\n`for` 循环允许执行指定次数的代码块。我们通常使用计数器并一直执行代码，直到计数器达到某个值。这允许我们执行特定次数的代码块。其语法如下：\n\
    \n```java\nfor ([init]; [condition]; [increment]) {\n    // 循环体\n}\n```\n\n```java\n\
    for([init]; [condition]; [increment]) {\n    // 一些简单的语句！\n```\n\n`for` 循环体有一条语句，我们不需要大括号。\n\
