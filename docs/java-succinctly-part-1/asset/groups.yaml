    # Code Listing 1.0: High-Level vs. Low-Level Languages


    ```

    ; Assembly Language: Low Level Language

    \mov rax, a; Read the value of a

    \add rax, b; Add the value of b to a

    mov a, rax; Write the result to a


    // Java: High Level Language


    a = a + b;

    ```


    Code Listing 1.0 shows a clear distinction between a high-level language (such
    as Java) and a low-level language (such as Assembly Language). In the low-level
    language, the addition of two values, a and b, and the storage of the result back
    into a takes three steps. The computer must be instructed to perform every specific
    detail of operation, from moving values into internal registers, such as RAX,
    to the addition itself. In Java, we can express this entire operation as a single,
    easy-to-read line of code that looks exactly like middle school algebra: a = a
    + b. The line means: Take the value in the variable a, add it to the value of
    b, and assign the result back to the variable.


    Code 1.0 shows a simple expression in Java, and this expression would look the
    same in many other C-based languages. However, there is an additional advantage
    to programming an application in Java as opposed to C or C++. Java programs are
    designed to run on a virtual machine. Figure 2 shows an illustration of native
    applications versus a Java application. When we write native applications, we
    must compile our code for each type of system on which we need our application
    to run. This means we will need to create a version for ARM CPUs and also create
    another version of the programming for x86 if we want our application to run on
    desktops and laptops.


    Java does not work like C and C++ in this respect. In Java, we program a single
    version of our application. The different CPUs (ARM, x86, etc.) all run the Virtual
    Machine, which, in turn, runs our application. The Virtual Machine is simply a
    program written to emulate the hardware of the hypothetical Java computer. This
    means we can write our program once, and any device that has a Java Virtual Machine
    emulator (i.e. has Java installed on it) will be capable of running our applications.
    This is Java''s massive advantage—it means our applications will run on a large
    number of devices without needing to design specifically for them.'
