- md: "\nThe continue keyword is used to jump to the top of the loop. It is useful\
    \ when you do not want the remainder of the loop's body to execute during some\
    \ particular iteration.\n\nBreak and continue always operate on the innermost\
    \ loop when loops are nested.\n\n## While and do loops\n\nThere are two types\
    \ of while loop—the while loop itself and the do while loop. The only difference\
    \ is that the do while loop checks the condition after executing the body and\
    \ is therefore guaranteed to run the loop's body at least once. Whereas the while\
    \ loop checks the condition before running the body of the loop, and if the condition\
    \ is false to begin with, the body of the loop will not execute at all. Code Listing\
    \ 7.8 shows the basic syntax for these loops.\n\n> Code Listing 7.8: Nested For\
    \ Loops\n\n```\nwhile(condition) {\n  // Body of the loop\n} do {\n  // Body of\
    \ the loop\n} while(condition);\n```\n\nThe condition can be any boolean statement\
    \ (i.e. any logical expression that results in a boolean value). The loop will\
    \ continue to execute when the condition evaluates to true. When the condition\
    \ becomes false, the loop terminates.\n\n> Code Listing 7.9: While and Do Loops\n\
