    # 附录：关键字参考


    下表列出了编写时 Java 中保留的大多数关键字。Java 的未来版本偶尔会实现新的关键字。某些关键字被保留但没有用途，我没有将它们包含列表中。


    ### 表 4：Java 关键字


    | abstract | else | interface | switch |

    | assert | enum | long | synchronized |

    | boolean | extends | native | this |

    | break | false | new | throw |

    | byte | final | null | throws |

    | case | finally | package | transient |

    | catch | float | private | true |

    | char | for | protected | try |

    | class | | public | void |

    | continue | implements | short | volatile |

    | default | import | static | while |

    | do | instanceof | strictfp | |

    | double | int | super | |


    这里的大多数关键字都被频繁使用，以下是每个每个关键字功能的简要总结。某些关键字，如 `volatile`、`abstract` 和 `interface`，将在接下来的《Java
    精要：第二部分》电子书中进行详细探讨。


    **abstract:** 这是一个修饰符。它表示类中的类或方法是抽象的。这意味着该类不能被实例化对象，但可以作为父类使用。任何带有一个或多个标记为抽象方法的类本身也被标记为抽象。


    **assert:** 这是一个用于测试条件的调试关键字。该关键字后面跟着一个布尔表达式。如果该布尔表达式的值为 `false`，程序在执行 `assert`
    时将终止。这允许我们测试可能会导致代码出现错误的特定条件。


    **boolean:** `boolean` 是一种原始数据类型。该关键字用于声明布尔变量并转换为布尔类型。布尔数据类型可以设置为两个值之一——`true`
    或 `false`。


    **break:** `break` 关键字用于跳出循环（`for` 循环、`while` 循环、`do` 循环），程序将立即跳转到循环块之外的下一可执行代码。


    **byte:** 这是一种原始数据类型。该关键字用于声明 `byte` 变量并转换为 `byte` 类型。`byte` 数据类型用于 -128 到 127
    范围的小整数。


    **case:** `case` 是一种选择机制。它与 `switch` 关键字一起使用，创建一个程序可能执行的可能情况列表。switch/case 块中的每个
    `case` 通常与 `break` 配对，这意味着程序只执行一系列可能情况中的单个情况。


    **catch:** `catch` 与 `try` 关键字结合使用，指定当 `try` 块抛出异常时应该执行的代码块。


    **char:** `char` 是一种原始数据类型。此关键字用于声明变量并转换为 `char` 类型。`char` 类型用于字符——例如 A 和 &。


    **class:** `class` 关键字表示后续代码块是类的声明。


    **continue:** `continue` 关键字用于循环内部。当程序遇到 `continue` 时，它将立即跳转到循环顶部，而不执行代码块中的任何剩余代码。


    **default:** `default` 关键字用于替代 switch/case 块中的最后情况。如果之前的没有任何 `case` 块都没有执行，并且提供了了最后的
    `default` 块，则 `default` 块将始终执行。


    **do:** `do` 用于表示 `do` 循环。`while` 循环后面通常跟着一个代码块，形成循环中执行的代码。`while` 循环的代码以 "while"
    术结束，后面跟着一个条件。`while` 循环与保证执行一次的循环相同。


    **double:** `double` 是一种原始数据类型。该关键字用于声明 `double` 变量并转换为 `double` 类型。


    **enum:** `enum` 是一种特殊的类类型。它用于定义一组常量。


    **extends:** `extends` 关键字用于指示一个类继承另一个类。


    **false:** `false` 是一个表示逻辑假状态的字面量值。


    **final:** `final` 关键字用于定义常量、不能被重写的方法或不能被继承的类。


    **finally:** `finally` 关键字与 `try/catch` 结合使用，指定无论是否抛出异常始终执行的代码块。


    **for:** `for` 关键字用于指定一个 `for` 循环。


    **if:** `if` 关键字用于指定执行后续代码块的条件。


    **implements:** `implements` 关键字用于指定一个类实现一个接口。


    **import:** `import` 关键字用于从外部包导入类。


    **instanceof:** `instanceof` 关键字用于测试对象是否是某个特定类的实例。


    **int:** `int` 是一种原始数据类型。该关键字用于声明 `int` 变量并转换为 `int` 类型。


    **interface:** `interface` 关键字表示后续代码块声明了一个接口。


    **long:** `long` 是一种原始数据类型。该关键字用于声明 `long` 变量并转换为 `long` 类型。


    **native:** `native` 关键字用于将 Java 程序连接到外部原生代码。


    **new:** `new` 关键字用于从类创建对象。


    **null:** `null` 关键字用于在不创建对象的情况下设置对象。


    **package:** `package` 关键字用于定义包。


    **private:** `private` 关键字用于将成员的访问限制在类本身。


    **protected:** `protected` 关键字用于限制对类及其子类的访问。


    **super:** `super` 关键字用于引用父类对象。


    **switch:** `switch` 关键字用于创建一个可能的情况列表。


    **try:** `try` 关键字用于指定可能抛出异常的代码块。


    **throw:** `throw` 关键字用于显式抛出异常。


    **throws:** `throws` 关键字用于方法签名，指示该方法可能会抛出异常。


    **this:** `this` 关键字用于引用类的当前实例。


    **true:** `true` 是一个表示逻辑真状态的字面量值。


    **volatile:** `volatile` 关键字用于指示变量可能会被不同的线程修改。


    **while:** `while` 关键字用于指定一个 `while` 循环。


