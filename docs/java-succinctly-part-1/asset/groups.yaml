    operator (>>>) will in 0s on the left side. The shift right and zero fill operator
    is useful when we do not treat Java as numbers as being signed.


    # Relational operators


    The relational operators allow us to compare the values of numerical variables
    against other variables or literal values. For instance, we might test the integer
    variable A has a value less than 100. Or we could test if the variables B and
    C are equal to the statement B==.


    The relational operators take two operands each. They compare the operands and
    return a boolean result of true or false. The relational operators are most commonly
    used in conditional statements such as statements and loops (which will be covered
    in the Control Structures chapter). We can string many relational operators with
    parameters using the logical operators to form complex expressions (the next section
    for a description of the logical operators).


    Table 3: Relational Operators


    | Operator | Name | Example |

    | --- | --- | --- |

    | == | Equal to | A==B; // Is A equal to B? |

    | != | Not equal to | A!=B; // Is A different from B? |

    | < | Less than | A<B; // Is A less than B? |

    | > | Greater than | A>B; // Is A greater than B? |

    | <= | Less than or equal to | A<=B; // Is A less or equal to B? |

    | >= | Greater than or equal to | A>=B; // Is A greater or equal to B? |


    Table 3 shows the relational operators available in Java. Notice that the double
    equals, ==, is the relational operator. It asks if two variables have the same
    value. Whereas the single equals, =, is the assignment operator. It sets the value
    of the first operand to that of the second. Code Listing 6.9 shows some examples
    of how we can set boolean variables based on the results from logical. When we
    use relational operators in control structures, they generally do not set boolean
    variables, but they execute code blocks when the results evaluate to true.'
