    \n我们的最后一章提供了两个案例研究——Nim（尼姆游戏）和 3x+1。每个案例都包含完整、有用且有趣的程序，我们通过对 Java 的极少理解就能创建这些程序。学习计算机语言的主要困难在于获得将语言的机制组合成一个连贯程序的技能。要找到仅使用语言机制中最小子集的完整且有效的程序并不是容易的。但本章中的两个示例表明，我们不需要比目前所见内容之外的任何东西——我们可以轻松地创建实用的程序。\n\
