    }\n```\n\n代码列表 7.5 显示了一个从 0 到 9 的 `for` 循环。初始化声明了整数变量 `j` 并将其设置为 0。条件是 `j < 10`，这意味着循环将当条件为真时执行。递增部分\
    \ `j++` 在每次迭代后增加 `j` 的值。循环的主体是 `System.out.println(j)`。\n\n# 代码列表 7.6：使用 For 循环倒序计数\n\
    \n```java\nfor(int j = 10; j > 0; j--) {\n    System.out.println(j);\n}\n```\n\
    \n代码列表 7.6 从 10 开始倒序计数。初始值为 10，条件是 `j > 0`，递增是 `j--`，它会减少 `j`。\n\n> 注意：有一种特殊的\
    \ for 循环用于迭代集合，例如数组。这种循环通常被称为 each 循环。关于 each 循环的信息，请访问 http://docs.oracle.com/java/1.5.0/docs/language/foreach.html。\n\
    \n# 嵌套循环\n\n我们可以将循环放在另一个循环的体内。这对于遍历多维数组非常有用。\n\n代码列表 7.7：嵌套 For 循环\n\n```java\n\
    for(int outerCounter = 0; outerCounter < 5; outerCounter++) {\n    for(int innerCounter\
