    for which Eclipse can be used). I have used the Eclipse IDE for Java Developers
    in this ebook, the version is Mars.1 Release (4.5.1). Older and newer versions
    of Eclipse will also be fine. At time of writing, the top of the main Eclipse
    download page also offers the Eclipse installer, which is an installation wizard
    designed to make installing Eclipse simple. If you have trouble installing Eclipse
    with the manual method described here, you might try installing with the installation
    wizard.'
