    \ of which contains its own code blocks.\n\nNotice also that code blocks can be\
    \ created for many different mechanisms—classes, loops, If statements, and methods\
    \ all have associated code blocks depicted in Code Listing 4.2.\n\nWe will now\
    \ take a detour into a completely different but very useful aspect of programming—debugging\
    \ code.\n\n## Detour: debugging code\n\nThe ability to debug and maintain code\
    \ is one of the most important attributes a programmer can have. With this in\
    \ mind, when you first test your program in Eclipse, select the Debug icon, instead\
    \ of the Run icon.\n\n## Printing out values\n\nWe often need to know the value\
    \ of variables while our program runs. The most basic form of discerning the value\
    \ of a variable is to output this value to the screen. We can use System.out.println\
    \ to do this, using System.out.println(\"The value of i is \" + i); This is a\
    \ very primitive method for debugging, but in many circumstances it is all we\
    \ need. Generally, it is better to place a breakpoint and a watch on the variable,\
    \ as described in the following section.\n\n## Setting breakpoints\n\nA breakpoint\
    \ is a position in the code at which we want the program to pause and give us\
    \ control so when a program pauses at a breakpoint, we can inspect the values\
    \ of variables and step through the code—one line at a time. To set a breakpoint,\
    \ right-click in the margin of the code view in Eclipse. This will bring up a\
    \ context menu with the option Toggle Breakpoint, as per Figure 27.\n\n## Figure\
    \ 27: Toggle Breakpoint\n\nWhen a breakpoint is active (i.e. if the program will\
    \ pause when it reaches the breakpoint), you will see a small breakpoint symbol\
    \ in the margin of the code window, as illustrated in Figure 28.\n\n## Figure\
    \ 28: Active Breakpoint\n\nWhen the breakpoint indicator is blue, in Figure 28,\
    \ it means the breakpoint is active. You can disable a breakpoint by right-clicking\
    \ the breakpoint symbol and selecting Disable Breakpoint from the context menu.\
    \ When a breakpoint is disabled, the circle is white and the program will not\
    \ pause when it reaches the breakpoint.\n\n## Debug perspective in Eclipse\n\n\
    When the program reaches an active breakpoint, it pauses and gives us control.\
    \ The first time you break in Eclipse, you might get a message box, as shown in\
    \ Figure 29. Eclipse is designed to offer several extra tools specific to debugging,\
    \ and it offers to change the view to the Debug perspective. Click the box marked\
    \ “Remember my decision” and select “Yes” to enter the Debug perspective.\n\n\
    ## Confirm Perspective Switch\n\nThis kind of launch is configured to support\
    \ the Debug perspective when it suspends.\nThis Debug perspective is designed\
    \ to support application debugging. It incorporates views for displaying the debug\
    \ stack, variables and breakpoint management.\nDo you want to open this perspective?\n\
    \n- Remember my decision\n\nFigure 29: Confirm Perspective Switch\n\n![](img/d6e922df0109ee8e372f5019b6a2a192_42_0.png)\n\
    \nThe Debug perspective is illustrated in Figure 30.\n\n![](img/d6e922df0109ee8e372f5019b6a2a192_42_1.png)\n\
    \nFigure 30: Debug Perspective\n\nNotice the line highlighted in Figure 30. This\
    \ is the line that the Eclipse scene is ready to execute. At the top of the Eclipse\
    \ scene, you will see a Play button, a Pause button, and a Stop button. In order\
    \ to stop the program from executing, click Stop. In order to resume normal execution\
    \ (i.e. to begin executing again until the program finds the next breakpoint),\
    \ click Play. And, if your program is already executing and has not hit a breakpoint,\
    \ you can pause it without adding a breakpoint by using the Pause button (see\
    \ Figure 31). Depending on the circumstance, some or all of these buttons may\
    \ be greyed out (for instance, if the program is already paused at a breakpoint,\
    \ the Pause button is not available).\n\n![](img/d6e922df0109ee8e372f5019b6a2a192_43_0.png)\n\
    \n> **Tip: You can skip breakpoints by clicking the button to the left of the\
    \ Play button in Figure 29.** This is handy when you have set a lot of breakpoints\
    \ but you want to test the overall functionality.\n\nYou can switch between the\
    \ Java and Debug perspective by clicking the buttons in the top-right corner of\
    \ Eclipse, as illustrated in Figure 32.\n\n![](img/d6e922df0109ee8e372f5019b6a2a192_43_1.png)\n\
    \nFigure 32: Changing the Perspective\n\n## Stepping Over and Into code\n\nStepping\
    \ through code can be done in two ways:\n\n- Step Over\n- Step Into\n\nWhen the\
    \ program is paused, we can look very closely at exactly what is happening to\
    \ all the variables while it executes one line at a time. We do this by employing\
    \ the Step Over and Step Into buttons (see Figure 33). You will find these buttons\
    \ at the top of Eclipse.\n\n![](img/d6e922df0109ee8e372f5019b6a2a192_44_0.png)\n\
    \nFigure 33: Step Over and Step Into Buttons\n\nStep Over means the program will\
    \ execute the current line of code, then pause again. It will not jump into method\
    \ calls. Step Into means the program will execute the next line, but if the line\
    \ is a method call, it will jump to the body of the method and pause. The shortcut\
    \ key for Stepping Into is F5, and the shortcut for Stepping Over is F6.\n\n##\
    \ Watching variables\n\nAs Step Over and Step Into our code, we can view exactly\
    \ which values our variables contain by looking in the Variables tab, as in Figure\
    \ 34.\n\n![](img/d6e922df0109ee8e372f5019b6a2a192_44_1.png)\n\nFigure 34: Variables\
    \ Tab\n\nWhen the application is paused, the Variables tab shows all the variables\
    \ that are presently in scope. The variables highlighted in yellow have changed\
    \ during the last Step Over or Step Into.\n\nThis has been a very brief tour of\
