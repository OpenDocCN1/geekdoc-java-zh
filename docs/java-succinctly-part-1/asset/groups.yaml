    \ 8.0 中将类命名为 `Circle`。注意，类的名称应与文件名称匹配，这意味着该类的文件是 `Circle.java`（当我们使用类向导将类添加到项目时，这将会是完成的）。\n\
    \n> 代码列表 8.0：空的 Circle 类\n\n```java\npublic class Circle {\n}\n```\n\n## 局部变量与成员变量\n\
