    ![](img/d6e922df0109ee8e372f5019b6a2a192_44_0.png)


    Figure 33: Step Over and Step Into Buttons


    Step Over means the program will execute the current line of code, then pause
    again. It will not jump into method calls. Instead, it will execute the method
    as a single step. Step Into means the program will execute the next line, but
    if the line is a method call, it will jump to the body of the method and pause.
    The shortcut key for Stepping Into is F5, and the shortcut for Stepping Over is
    F6.


    # Watching variables


    As Step Over and Step Into our code, we can view exactly which values our variables
    contain by looking in the Variables tab, as in Figure 34.


    ![](img/d6e922df0109ee8e372f5019b6a2a192_44_1.png)


    Figure 34: Variables Tab


    When the application is paused, the Variables tab shows all the variables that
    are presently in scope. The variables highlighted in yellow have changed during
    the last Step Over or Step Into.


