    **第 1 行**：`public class MainClass`。这一行声明了一个名为 MainClass 的类。该类被标记为 `public` 修饰符，这意味着它对应用程序中的所有其他实体和包都是可见的。在
    `public` 修饰符之后，我们使用关键字 `class`，然后为我们的类提供一个名称——例如 MainClass。紧接着是一个大括号 `{`，它表示类的开始。第
    5 行包含匹配的右括号 `}`，它标记了该类主体的结束。


    **第 2 行**：在第 2 行，我们声明了一个名为 `main` 的静态方法。该方法被标记为 `public`，以便该类外部类可以调用它。方法被标记为 `static`，意味着它属于类而不是类的任何特定实例。该方法不向调用者返回任何值，因此返回类型为
    `void`。在括号中，`String[] args` 是参数名。这意味着在调用此方法时，将传递一个字符串数组。这些字符串是命令行参数——当我们从命令行运行程序时，可以选择性提供额外的参数。当我们使用命令行时，这个数组在示例程序中是空的。在参数列表之后，我们使用一个左括号
    `{`，它标记了方法主体的开始。main 方法匹配的右括号在第 4 行。


    **第 3 行**：这一行调用了 `println` 方法，该方法属于 `System.out` 类。`System` 是一个类，而 `println` 是属于该类的公共静态方法。该方法接受一个
    `String` 参数并将字符串打印到控制台输出。字符串被包含在括号中，表示它是方法调用的参数。该参数是 `String`，因为它被包含在双引号中。该行以分号
    `;` 结尾，表示语句已结束。Java 中的所有语句都有分号。


