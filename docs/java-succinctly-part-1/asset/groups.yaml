    Buzz!\");\n        // 否则，直接打印数字本身。\n        else System.out.print(i + \" \");\n\
    \    }\n}\n}\n```## 第 8 章 面面向编程\n\n## 类与对象\n\nJava 是一种面向对象的语言。它包含了一些机制，允许我们程序化自己的数据类型层次结构，这些类型被称为“类”。类是一个蓝图——它是对对象类型的描述，描述了对象拥有的变量以及对象能够执行的方法（函数）。我们可以从这些类蓝图中创建对象——这些对象被称为类的“实例”。对象是变量的集合（称为成员变量）和方法的集合（称为成员方法）。例如，你可以创建一个以\
    \ `radius` 为变量的 `Circle` 类。而方法可以计算诸如 `computePerimeter` 和 `computeArea` 等内容。\n\
    \n理解 Java 中类和对象基础的三个关键概念：\n\n- 成员变量：描述对象或类**拥有**什么。\n- 成员方法：描述对象或类**能做**什么。\n\
    - 继承：描述对象**是什么**；它从父类中继承了什么。\n\n## class 关键字\n\n为了开始描述一个新类，请按照我们将 `MainClass`\
