    \    }\n}\n```\n\n代码列表 7.7 显示了嵌套的 `for` 循环。外部计数器从 0 计数到 4。在外部循环体内，内部循环从 0 计数到\
    \ 2。外部循环将执行五次，每次执行时内部循环都会执行三次。因此，内部循环体总共将执行 3*5 次，即 15 次。代码的输出如下：\n\nOuter Counter:\
