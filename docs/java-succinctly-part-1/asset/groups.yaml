    \ `default` 关键字标记的 `case`。只有在之前的 `case` 都未执行时，才会执行 `default` 情况。`default` 情况是可选的。\n\
    \n- 提示：`switch` 中的 `break` 关键字不是强制的。如果你不在 `case` 中放置 `break`，程序将继续运行并找到额外的 `case`\
    \ 来执行。这种功能很少使用，我建议你在每个 `switch` 语句中始终使用 `break`，以避免其他程序员（或你）阅读代码时产生混淆。\n\n代码列表\
