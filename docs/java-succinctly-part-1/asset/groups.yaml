    \ 6.1 的结果也可以作为一个单一表达式，只留下字面量。\n\n## 代码列表 6.16：计算的其他解决方案\n\n## 控制结构\n\n通常，控制结构允许我们根据某些条件做出决策。最常见的控制结构是\
    \ `if` 语句，它允许代码中进行分支。如果条件为真，`if` 语句中的代码块将执行。如果为假，则跳过。\n\n其他控制结构包括循环，允许我们多次执行代码块。最常见的循环有\
    \ `for` 循环、`while` 循环和 `do-while` 循环。`for` 循环通常用于已知迭代次数。`while` 循环取决于条件是否真。`do-while`\
    \ 循环与 `while` 循环相似，但会在检查条件之前至少执行一次代码块。\n\n另一个控制结构是 `switch` 语句，允许根据单个值执行多个分支。`switch`\
    \ 语句通常比一系列 `if-else` 语句更具可读性。\n\n## If 语句\n\n`if` 语句是 Java 中最基本的控制结构。它由一个 `if`\
    \ 关键字后跟一个为真或假的条件组成。如果条件为真，`if` 语句后面的代码将执行。如果为假，则跳过。\n\n`if` 语句的语法为：\n\n```java\n\
    if (condition) {\n    // 如果条件为真执行代码\n}\n```\n\n你也可以为 `if` 语句包含 `else` 子句，以便在条件为假时执行代码。\n\
