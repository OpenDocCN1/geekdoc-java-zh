    # Appendix: Keyword Reference


    The following table lists most of the keywords reserved in Java at the time of
    writing. Future versions of Java occasionally implement new keywords. Several
    keywords are reserved but have no use, and I have not included these in the list.


    ### Table 4: Java Keywords


    | abstract | else | interface | switch |

    | assert | enum | long | synchronized |

    | boolean | extends | native | this |

    | break | false | new | throw |

    | byte | final | null | throws |

    | case | finally | package | transient |

    | catch | float | private | true |

    | char | for | protected | try |

    | class | | public | void |

    | continue | implements | short | volatile |

    | default | import | static | while |

    | do | instanceof | strictfp | |

    | double | int | super | |


    Most of the keywords here are used frequently, and the following is a brief summary
    of what each keyword does. Some keywords, such as volatile, abstract, and interface,
    will be explored in detail in the upcoming *Java Succinctly Part 2* e-book.


    **abstract:** This is a modifier. It expresses that a class or method within a
    class is abstract class. This means that the class cannot be instantiated as an
    object, but it can be used as a parent class. Any class with one or more methods
    marked as abstract itself be be marked as abstract.


    **assert:** This is a debugging keyword used to test conditions. The keyword is
    followed by a boolean expression. If the Boolean expression evaluates to false,
    the program will terminate upon asserting the assert. This allows us to test for
    particular conditions that will lead to errors in our code.


    **boolean:** boolean is a primitive data type. The keyword is used to declare
    boolean variables and to cast to the boolean type. The boolean data type can be
    set to one of two values—true or false.


    **break:** The break keyword is used to jump out of a loop (for loop, while loop,
    do loop), the program will immediately jump to the next executable line of code
    outside the loop''s code block.


    **byte:** This is a primitive data type. The keyword is used to declare byte variables
    and to cast to the byte type. The byte data type is used for small integers in
    the range from -128 to 127.


    **case:** case is a selection mechanism. It is used with the switch keyword to
    create a list of possible cases in which the program might execute. Each case
    in a switch/case block is typically paired with a break, which means that program
    executes only a single case from a series of possibilities.


    **catch:** catch is used in conjunction with the try keyword to specify a block
    of code that should be executed when a try block throws an exception.


    **char:** char is a primitive data type. This keyword is used to declare variables
    and to cast to the char type. The char type is used for characters—for example,
    A & &.


    **class:** The class keyword signifies that the following code block is the declaration
    of a class.


    **continue:** The continue keyword is used inside loops. When the program encounters
    continue, it will immediately jump to the top of the loop without executing any
    remaining code in the code block.


    **default:** The default keyword is used in place of the final case in a switch/case
    block. If none of the previous case blocks execute, and a final default block
    is supplied, the default block will always execute.


    **do:** The do is used to signify a do loop. The while loop is usually followed
    by a code block that forms the code to execute in a loop. The code of a while
    loop ends with the term "while", followed by a condition. While loops are identical
    to loops loops that are guaranteed to execute at least once.


    **double:** double is a primitive data type. This keyword is used to declare double
    variables and cast to the double type.


    **enum:** enum is a special type of class. It is used to define a set of constants.


    **extends:** The extends keyword is used to indicate that a class inherits from
    another class.


    **false:** false is a literal value representing the logical false state.


    **final:** The final keyword is used to define constants, or methods that cannot
    be overridden, or classes that cannot be inherited.


    **finally:** The finally keyword is used in conjunction with try/catch to specify
    a block of code that always executes whether an exception is thrown or not.


    **for:** The for keyword is used to specify a for loop.


    **if:** If the keyword is used to specify a condition under which the following
    code block should be executed.


    **implements:** The implements keyword is used to specify that a class implements
    an interface.


    **import:** The import keyword is used to import classes from an external package.


    **instanceof:** The instanceof keyword is used to test whether or not an object
    is an instance of some particular class.


    **int:** int is a primitive data type. This keyword is used to declare int variables
    and to cast to the int type.


    **interface:** The interface keyword is used to signify that the following code
    block declares an interface.


    **long:** long is a primitive data type. This keyword is used to declare long
    variables and to cast to the long type.


    **native:** The native keyword is used to connect a Java program to external,
    native code.


    **new:** The new keyword is used to create objects from classes.


    **null:** The null keyword is used to set an object without creating one.


    **package:** The package keyword is used to define a package.


    **private:** The private keyword is used to limit access to a member to the class
    itself.


    **protected:** The protected keyword is used to limit access to the class and
    its subclasses.


    **super:** The super keyword is used to refer to the parent-class object.


    **switch:** The switch keyword is used to create a list of possible cases.


    **try:** The try keyword is used to specify a block of code that might throw an
    exception.


    **throw:** The throw keyword is used to explicitly throw an exception.


    **throws:** The throws keyword is used in a method signature to indicate that
    the method might throw an exception.


    **this:** this keyword is used to refer to the current instance of a class.


    **true:** true is a literal value representing the logical true state.


    **volatile:** The volatile keyword is used to indicate that a variable may be
    modified by different threads.


    **while:** The while keyword is used to specify a while loop.

