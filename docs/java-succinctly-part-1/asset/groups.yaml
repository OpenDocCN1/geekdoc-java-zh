    \ Counter: 2\nOuter Counter: 1 Inner Counter: 0\nOuter Counter: 1 Inner Counter:\
    \ 1\nOuter Counter: 1 Inner Counter: 2\nOuter Counter: 2 Inner Counter: 0\nOuter\
    \ Counter: 2 Inner Counter: 1\nOuter Counter: 2 Inner Counter: 2\nOuter Counter:\
    \ 3 Inner Counter: 0\nOuter Counter: 3 Inner Counter: 1\nOuter Counter: 3 Inner\
    \ Counter: 2\nOuter Counter: 4 Inner Counter: 0\nOuter Counter: 4 Inner Counter:\
    \ 1\nOuter Counter: 4 Inner Counter: 2\n\n注意 `outerCounter` 在内部循环的精确三次迭代中保持不变。然后它增加一次，即\
    \ `outerCounter`，`innerCounter` 计数 0、1，然后是 2。你可以任意深度地嵌套循环。\n\n# Break 和 continue\
    \ 关键字\n\n`break` 关键字用于多个控制结构（`for`、`while`、`do while` 以及 `switch`）的体内。它导致程序立即跳转到控制结构体之外的下一个语句。这对于停止无限循环（例如\
