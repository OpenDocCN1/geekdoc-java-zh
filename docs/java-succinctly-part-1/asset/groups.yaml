    \ and maximum values that each primitive can store.\n\nProgrammers should become\
    \ familiar with all of the primitive data types, but in practice we tend to use\
    \ some more than others. Most programmers will use int for all numerical, whole-number\
    \ variables. The smaller integer data types, byte and short, are used to save\
    \ space in RAM when the range of values being stored is known within the much\
    \ smaller range of byte or short. The long data type is not typically used unless\
    \ the programmer has a specific reason to do so—for instance, if the programmer\
    \ needs to store values greater than 2^15 billion.\n\n> Note: If you require more\
    \ than a long can accommodate, there is a standard called \"BigInteger\" that\
    \ offers arbitrarily large integers. BigInteger is not a primitive, but instead\
    \ a class built of primitives that allows computation with very large values (used\
    \ in encryption algorithms, for example). This type of computation comes at a\
    \ cost, and BigInteger computations are much slower for the JVM to perform than\
    \ computations with int or Long. To use a BigInteger, we need to import java.math.BigInteger\
    \ and declare a BigInteger object.\n\nProgrammers often use double as the default\
    \ data type when they need to represent floating-point values. Double is twice\
    \ as large as a float (64 bits for doubles, 32 for floats), which means that if\
    \ you have a list of values (such as an array with one million elements), storing\
    \ the elements as float will make the array roughly four megabytes of RAM rather\
    \ than eight. The downside of float is that it is far less accurate. The accuracy\
    \ offered by doubles can be very important because every operation we perform\
    \ on floating-point variables (double and float) has the potential to introduce\
    \ rounding errors.\n\nThe boolean type has the only two possible states—true and\
    \ false. We use boolean variables when we know there are only two states to a\
    \ variable, and the states need not necessarily be true and false. For instance,\
    \ a boolean variable could represent a person's gender, a light switch on or off,\
    \ or the digits 0 and 1. Boolean variables are commonly used to create conditional,\
    \ logical, or relational expressions. We use a logical expression without actually\
    \ defining a variable, but then the boolean is being created and evaluated for\
    \ every logical expression (we will see many logical and conditional expressions\
    \ in the section on control structures).\n\nThe char data type is used to store\
    \ letters, digits, punctuation, and many other symbols (char represents characters\
    \ using the Unicode encoding scheme). The char data type is really just a short,\
    \ but the JVM treats it as 16 bits. For example, if you set a char to 65 and print\
    \ the results using a println the program will see 65. If you use a char variable,\
    \ set it to 65 and print the results with println 'A'. This println function is\
    \ designed to treat char data types as references to Unicode characters. The symbol\
    \ in the Unicode table at position 65 is A, therefore println prints A to the\
    \ screen instead of 65 when it sees that data type is char.\n\nchar variable types\
    \ are strung together to form strings of characters. Strings are more than just\
