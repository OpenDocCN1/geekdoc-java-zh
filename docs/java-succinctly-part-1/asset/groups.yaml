- md: "\nInside the Scanner class's nextFloat method, it checks that the value entered\
    \ by the user is actually a float. If the user enters string, e.g., ninety four,\
    \ the nextFloat method will create and throw a new InputMismatchException. Also\
    \ note that the InputMismatchException requires an import—it is a class belonging\
    \ to the java.util package.\n\nFollowing a try block, we can include as many catch\
    \ blocks as we. Each catch block can be specifically designed to catch certain\
    \ types of exceptions. The first catch blocks in a list of catch blocks should\
    \ alarm the most specific exceptions because only one catch block will execute.\
    \ In Listing 7.12, there are three catch blocks designed to catch InputMismatchException,\
    \ IllegalArgumentException, and then any other Exception object. The first catch\
    \ block will catch the exception thrown by s.nextFloat() when the user does not\
    \ input a float. The second catch block catches the IllegalArgumentException that\
    \ we throw when the user attempts to divide by zero. The third catch block will\
    \ catch any other exceptions thrown by the code that were not already caught by\
    \ the previous catch blocks.\n\nIn the body of each catch block, we have the option\
    \ of examining the exceptions that were. In the final block, I have printed the\
    \ exceptions by calling the e.getMessage() method. All exceptions have a getMessage\
    \ method that can be used to show the user some extra information about what went\
    \ wrong.\n\nThe finally block is optional. When used, it follows all the catch\
    \ blocks. The finally block is always executed, regardless of whether or not an\
    \ exception was thrown and caught—the code of the finally block will execute.\
    \ I have used the finally block to close the scanner.\n\nIf methods can potentially\
    \ throw a particular exception and we do not offer any chance of catching and\
    \ responding to the exception, we should mark the method with the keyword to indicate\
    \ to potential any other alternative code that simply means that throws exceptions\
    \ while offering no try/catch to handle them. Listing 7.13 shows an example of\n\
    \n## Code Listing 7.13: Throws Keyword\n\n```java\nimport java.util.Scanner;\n\
    import java.util.InputMismatchException;\n\npublic class MainClass {\n    public\
    \ static void main(String[] args) \n        throws InputMismatchException, IllegalArgumentException\
    \ {\n        float numerator = 0.0f;\n        float denominator = 0.0f;\n    \
    \    Scanner s = new Scanner(System.in);\n        System.out.println(\"Enter a\
    \ numerator: \");\n        numerator = s.nextFloat();\n        System.out.println(\"\
    Enter a denominator: \");\n        denominator = s.nextFloat();\n        if(denominator\
    \ == 0.0f)\n            throw new IllegalArgumentException(numerator + \" divided\
    \ by \" + denominator +);\n        System.out.println(numerator + \" divided by\
    \ \" + denominator + \" is equal to \" + (numerator / denominator));\n       \
    \ System.out.println(\"Thank you for your time.\");\n    }\n}\n```\n\nIn Code\
    \ 7.13, the important line is highlighted in yellow. We state that our method\
    \ potentially throws the two exceptions. This way, any method that calls this\
    \ might respond with their own try/catch blocks. As it happens, it is the main\
    \ method, and the JVM itself called it to our application. If this method throws\
    \ an exception, the program will crash.\n\n- **Tip**: If you want to use a method\
    \ provided by the Java libraries, such as Scanner.nextFloat(), you can hover over\
