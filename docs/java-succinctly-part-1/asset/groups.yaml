    Code Listing 5.4 shows an example of adding an integer to a String.


    # Code Listing 5.4: Adding Integers to Strings


    ```

    int idNumber = 26771;


    String desc = "The ID number is " + idNumber + ".";

    ```


    In Code Listing 5.4, we use the concatenation operator, +, to place the 26771
    in the middle of a String. Java will create the value "The ID number is 26771"
    and store this in the String desc. It is important to note that the integer idNumber
    has been converted to a normal decimal string automatically.


    # Casting


    To cast in Java means to change the value of a variable or literal to that of
    another primitive data type. To cast from one type to another, we use the primitive
    to cast in brackets. Code Listing 5.5 shows some examples of casting numerical
    data types.


    # Code Listing 5.5: Casting


    ```

    int i = (int) 7.8;               // Cast the 7.8 to an integer, store in i

    double d = (double) 89.7f; // Cast the float 89.7f to a double, store in d

    short q = (short) (i * d); // Cast the integer i*d to a short and store in q

    ```


    Casting a floating-point value to an integer type results in truncation, so that
    7.8 becomes 7 when stored in the integer i.


    This example shows something else interesting. The expression (i*d) results in
    a double. When we perform an operation and mix integers or doubles, or floats,
