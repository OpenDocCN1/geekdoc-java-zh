  mdcn: "\nString（字符串）与如 `int` 和 `float` 等数值数据类型之间存在非常重要的区别。String 与数据类型之间不可互换的，即使它们的值相同。虽然可以使用函数调用\
    \ `Integer.parseInt` 将 String 解析为整数，但在正常方式下，无法将 String 赋值给整数。代码列表 5.2 的第二行是违法的：\n\
    \n# 代码列表 5.2：字符串与数值数据类型不可互换\n\n```\nString str = \"100\";\nint j = 10 + str;\n\
    ```\n\nString 是字符数组，每个字符都有一个或或多的任意数值值（即 Unicode 字符值）。如果我们给字符 7 加上 10，得到的不是 17，而是\
    \ 65！这是因为字符 7 等同于整数 7。字符 7 的 Unicode 值为 55。由于这个原因，在不调用诸如 `Integer.parseInt` 这样的辅助函数的情况下，我们无法转换如\
    \ 1278 这样的数值字符串。\n\n代码列表 5.3 展示了如何将 String 解析为 `int` 并与整数相加，以便这些操作能够得到正常且预期的结果。我们将介绍函数调用、装箱/拆箱以及\
    \ `Integer` 类。简单来说，`Integer.parseInt(str)` 将返回 String 中字符的整数数值值。\n\n# 代码列表 5.3：解析字符串与字符\n\
    \n```java\npublic class Main {\n    public static void main(String[] args) {\n\
    \        // 将 str 设置为字符串 \"7\"\n        String str = \"7\";\n\n        // 将 j\
    \ 设置为整数 10 加上解析为 int 的 \"7\"。\n        int j = 10 + Integer.parseInt(str);\n\n\
    \        // 将 c 设置为字符 '7'\n        char c = '7';\n\n        // 将 i 设置为 10 + 7，注意我们从\
    \ '7' 中减去字符 '0'\n        // 从而从字符 '7' 得到整数 7，而不是通过解析。\n        int i = 10 + c\
    \ - '0';\n\n        // j 和 i 都被设置为 17。\n        System.out.println(\": \" + j);\n\
    \        System.out.println(\": \" + i);\n    }\n}\n```\n\n代码列表 5.4 展示了一个将整数加到\
    \ String 的示例。\n\n# 代码列表 5.4：将整数加到字符串\n\n```java\nint idNumber = 26771;\n\nString\
    \ desc = \"The ID number is \" + idNumber + \".\";\n```\n\n在代码列表 5.4 中，我们使用拼接运算符\
    \ `+` 将 26771 放在字符串的中间。Java 将创建值 \"The ID number is 26771\" 并将其存储在 String `desc`\
    \ 中。需要注意的是，整数 `idNumber` 已经自动转换为普通的十进制字符串。\n\n## 类型转换 (Casting)\n\n在 Java 中类型转换意味着将变量或字面量的值更改另一种原始数据类型的值。要从一种类型转换为另一种类型，我们在括号中使用原始类型进行转换。代码列表\
    \ 5.5 显示了数值数据类型转换的一些示例。\n\n# 代码列表 5.5：类型转换\n\n```\nint i = (int) 7.8;        \
    \       // 将 7.8 转换为整数，存储在 i 中\ndouble d = (double) 89.7f; // 将 float 89.7f 转换为\
    \ double，存储在 d 中\nshort q = (short) (i * d); // 将整数 i*d 转换为 short 并存储在 q 中\n```\n\
    \n将浮点值转换为整数类型会导致截断，因此 7.8 在存储到整数 `i` 时会变成 7。\n\n此示例展示了另一个有趣点。表达式 `(i*d)` 的结果是\
    \ `double`。当我们执行操作并混合整数或双精度浮点数时，整数会被临时转换为双精度浮点数。\n\n## 字面量 (Literals)\n\n字面量是直接在代码中编写的值。例如，`10`\
    \ 是一个整数字面量，`3.14` 是一个双精度浮点数字面量，`'A'` 是一个字符字面量，而 `\"hello\"` 是一个字符串字面量。\n"
