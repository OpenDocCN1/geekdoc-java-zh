    \n# 变量\n\n变量是一个命名的原始数据类型。每个变量都是字节的集合，充当表 1 中的某种原始数据类型之一，并且我们为它赋予了名称。我们通过变量名（而不是它们在\
    \ RAM 中的地址）来引用变量，并可以使用变量名作为引用在 RAM 中读取或更改值。变量存储信息，例如数字 3 或名字 Jane。\n\n# 变量的声明与定义\n\
    \n声明一个变量是说明它的存在。我们给出一个数据类型和一个名称——即标识符。定义一个变量是为它指定一个值。变量在使用之前必须先声明并定义。\n\n当我们第一次定义变量的值时，就发生了初始化。一个已声明但未定义的变量称为未初始化变量，该变量在初始化之前不能在计算中使用。在\
    \ Java 中，我们可以使用赋值运算符 `=` 在单行代码中声明并初始化变量（有关赋值运算符的更多信息，请参见运算符部分）。\n\n代码列表 5.0 显示了变量的各种声明和定义。\n\
    \n代码列表 5.0：变量的声明与定义\n\n```java\npublic class MainClass {\n    public static void\
    \ main(String[] args) {\n        int i = 100; // 声明并初始化一个 int。\n        int b\
    \ = 10, c = 5;// 声明并初始化两个变量。\n        boolean mb = false; // 声明并定义一个 Boolean。\n\
    \n        char myLetter; // 声明一个字符。\n        myLetter = 'h'; // 定义/设置字符为 'h'。\n\
    \        byte hp, bp, sp; // 声明 3 个字节变量。\n        hp = bp = sp = 0; // 将所有 3 个字节设置为\
    \ 0。\n        short ss = 189; // 声明并定义一个短整数。\n        long p = ss; // 声明并定义一个值为\
    \ ss 的 long。\n        double myDouble = 100.0; // 声明并定义一个 double。\n        float\
    \ f = 0.1f; // 声明并定义一个 float。\n    }\n}\n```\n\n声明变量时，数据类型在前，随后是变量名，可选的是变量的初始值。变量可以在声明的同一行（例如代码列表\
    \ 5.0 中的 int 变量 `b` 和 `c`），也可以单独占一行（例如代码列表 5.0 中的 `char myLetter`）。你可以通过逗号声明并定义多个相同类型的变量。代码列表\
    \ 5.0 中的数字（如 189 和 0）以及字符 'h' 和布尔值 false 被称为字面量。我们稍后会检查它们。\n\n你还可以使用数学和逻辑语句来初始化变量。例如：`int\
    \ Integer = 10+1`。这将变量 `Integer` 设置为 11。\n\n> 提示：清晰地命名变量可以极大提高代码的可读性。通常情况下，程序员应该简洁地命名变量。考虑使用变量\
    \ `s` 来存储薪水，或者使用更合适的 `employeeSalary`。使用 `employeeSalary` 比字母 `s` 描述性得多。\n\n注意：如所述，许多程序员在\
    \ Java（以及其他语言）中使用称为驼峰命名（Camel Case）的技术来命名标识符。成员方法或变量名的第一个单词小写，所有随后的单词均以大字母开头。例如，`myVariable`\
    \ 和 `vehiclesPerHour`。但类名以大字母开头——`MyClass` 和 `UserInformation`\n\n# 旁游：字符串\n\n\
    在我们继续描述字面量之前，让我们临时旁游检查一个不是原始类型的数据类型。`String` 不是原始类型，但由于其使用非常频繁，可以与其他数据类型一起介绍。`String`\
    \ 是一个数组（参见数组部分）或字符序列，一个接。`String` 可用于表示文本、数字或 Unicode 符号序列（`String` 实际上是一串 `char`\
    \ 变量的字符串）。我们用双引号包裹文本以表示这是一个 `String`。\n\n```java\nString str = \"This is a string\
    \ variable\"\n```\n\n我们可以使用 `+` 运算符连接多个 String 来多行定义 String（代码列表 5.1）。\n\n代码列表\
    \ 5.1：多行字符串\n\n```java\nString description = \"Strings can \" + \n\"be defined\
    \ on multiple \" + \n\"lines with the + operator!\";\n```\n"
