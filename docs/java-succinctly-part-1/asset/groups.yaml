    \n```java\nfor(int outerCounter = 0; outerCounter < 5; outerCounter++) {\n   \
    \ for(int innerCounter = 0; innerCounter < 3; innerCounter++) {\n        System.out.println(\"\
    Outer Counter: \" + outerCounter +\n              \" Inner Counter: \" + innerCounter);\n\
    \    }\n}\n```\n\nCode Listing 7.7 shows nested for loops. The outer counter counts\
    \ from 0 up to including 4. In the body of the outer loop, the inner loop counts\
    \ from 0 up to 2. The outer loop will execute five times, and each time it executes,\
