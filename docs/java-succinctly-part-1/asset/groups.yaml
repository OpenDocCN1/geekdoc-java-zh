    \ `&&`, `||`, `!`）。\n\n这里是一个使用关系运算符的 `if` 语句示例：\n\n```java\nint age = 18;\nif\
    \ (age >= 18) {\n    System.out.println(\"You are an adult.\");\n} else {\n  \
    \  System.out.println(\"You are not an adult.\");\n}\n```\n\n这是一个使用逻辑运算符的 `if`\
    \ 语句示例：\n\n```java\nboolean hasLicense = true;\nboolean hasCar = false;\nif (hasLicense\
    \ && hasCar) {\n    System.out.println(\"You can drive.\");\n} else {\n    System.out.println(\"\
    You cannot drive.\");\n}\n```\n\n## 循环\n\n循环用于多次执行代码块。Java 中有三种循环：`for` 循环、`while`\
    \ 循环和 `do-while` 循环。\n\n`for` 循环通常用于已知迭代次数。它由三部分组成：初始化、条件和增/减。\n\n```java\nfor\
    \ (initialization; condition; increment/decrement) {\n    // 重复代码\n}\n```\n\n\
    这里是一个 `for` 循环的示例：\n\n```java\nfor (int i = 0; i < 5; i++) {\n    System.out.println(\"\
    Iteration: \" + i);\n}\n```\n\n`while` 循环用于迭代次数取决于条件是否真的情况。在执行代码块之前检查条件。\n\n```java\n\
    while (condition) {\n    // 重复代码\n}\n```\n\n这里是一个 `while` 循环的示例：\n\n```java\n\
    int i = 0;\nwhile (i < 5) {\n    System.out.println(\"Iteration: \" + i);\n  \
    \  i++;\n}\n```\n\n`do-while` 循环与 `while` 循环相似，但它检查条件之前至少执行一次代码块。\n\n```java\n\
    do {\n    // 重复代码\n} while (condition);\n```\n\n这里是一个 `do-while` 循环的示例：\n\n```java\n\
