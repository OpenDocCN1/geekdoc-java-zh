    条件可以是任何布尔语句（即任何产生布尔值的逻辑表达式）。当条件求值为 `true` 时，循环将继续执行。当条件变为 `false` 时，循环终止。\n\n\
    > 代码列表 7.9: While 和 Do 循环\n\n```\nint counter = 0;\nwhile(counter < 10) {\n  System.out.println(\"\
    Counter in while: \" + counter);\n  counter++;\n}\ndo {\n  System.out.println(\"\
    Counter in do ... while: \" + counter);\n  counter++;\n} while(counter < 10);\n\
    ```\n\n代码列表 7.9 展示了使用 `while` 和 `do while` 循环的示例。首先，在 `while` 循环中，变量 `counter`\
    \ 将从 0 增加到 9。当变量 `counter` 达到 10 时，`while` 循环的条件失效。这个特定的 `while` 循环与 `for` 循环非常相似，事实上，没有\
    \ `while` 循环不能写成 `for` 循环，反之亦然。\n\n`do while` 循环与 `while` 循环具有相同的条件。在程序执行 `while`\
    \ 循环后，会将变量 `counter` 增加到 10。此时 `do while` 循环的条件为假（`counter` 不小于 10）。但 `do` 循环在终止循环之前仍会执行其循环体，因为它是在最后才检查条件。\n\
    \n## Switch 语句\n\n`switch` 语句只是编写一组 `if` 语句的另一种方式。为了将一组 `if` 语句转换为 `switch`，`if`\
    \ 和 `else if` 语句中的条件必须指向同一个变量。在接下来的示例（代码列表 7.10）中，所有条件都指向变量 `i`，因此这一系列 `if` 语句可以转换为\
    \ `switch`。下面显示了 `if/else` 组合与执行功能完全相同的 `switch` 语句的对比（注意 `switch` 示例并非实际代码，不会运行）。\n\
    \n> 代码列表 7.10: If 块 vs. Switch\n\n```\nif(i == 0) // Do something\n if(i == 1)\
    \ // Do somethingElse\n if(i == 2) // Do somethingElse\nelse // Do the default\n\
    \nswitch (i) {\n  case 0: { Do something; break; }\n  case 1: { Do somethingElse;\
    \ break; }\n  case 2: { Do somethingElse; break; }\n  default: { Do the default;\
    \ break; }\n};\n```\n\n在 `switch` 语句中，`switch` 关键字后跟着一个变量（上例中的 `i`）。接下来，在代码块内部，我们提供一系列\
    \ `case`，每个都用关键字标记。当匹配某个特定 `case` 时，执行该 `case` 的代码块。\n\n在 `switch` 示例中，每个 `case`\
