  mdcn: "\n代码列表 4.2 显示了一个高亮了代码块的程序。这个程序比我们目前看到的程序要复杂得多。关于该程序如何运行的细节，在我们以后的章节查看方法时就会变得显而易见。目前，该程序旨在说明\
    \ { } 大括号匹配和嵌套代码块。\n\n## 代码列表 4.2：代码块\n\n```java\npublic class MainClass {\n//\
    \ 返回整数 x 的最小质因数的方法。\n    private static int getLowestFactor(int x) {\n       \
    \ int sqrt = (int)Math.sqrt(x);\n        if(x % 2 == 0) {\n            return\
    \ 2;\n        }\n        for(int q = 3; q <= sqrt; q+=2) {\n            if(x %\
    \ q == 0) {\n                return q;\n            }\n        }\n        return\
    \ x;\n    }\n// 通过检查 x 是否等于其最小因数来判断 x 是否为质数。\n    private static boolean IsPrimeFactor(int\
    \ x) {\n        return getLowestFactor(x) == x;\n}\n// 此程序列出 1 到 1000 之间的数字。\n\
    public static void main(String[] args) {\n    // 局部变量。\n    int i = 2, count =\
    \ 0, countPerLine = 10;\n    System.out.println(\"Prime numbers from 1 to 1000\
    \ are: \");\n    // 寻找质数的循环。\n    while(i <= 1000) {\n        // 如果 i 是质数...\n\
    \        if(isPrime(i)) {\n            // 添加到列表...\n            System.out.print(i\
    \ + \", \");\n            // 增加计数。\n            count++;\n            // 如果这一行有\
    \ countPerLine 个元素，\n            // 打印新行。\n            if(count % countPerLine\
    \ == 0) {\n                System.out.println();\n            }\n        }\n \
    \   }\n}\n// 将 i 加到下一个数字。\ni++;\n}\n```\n\n如果你将代码列表 4.2 中的代码复制并粘贴到 Eclipse 中，你应该会得到\
    \ 1 到 1000 之间的质数列表。在代码列表 4.2 中，每一对匹配的大括号都用不同的颜色高亮显示。注意代码块嵌套在其他代码块内部。这意味着——较小的代码块在外部代码块的大括号内开始并结束。黄色的大括号包围了\
    \ MainClass 的主体，而 MainClass 包含了几个方法的代码块，每个方法又包含它自己的代码块。\n\n同样注意，代码块可以为许多不同的机制创建——类、循环、If\
    \ 语句和方法在代码列表 4.2 中都有相关的代码块描绘。\n\n我们现在将进入一个完全不同但非常实用的编程方面——调试代码。\n\n## 旁插：调试代码\n\
    \n调试和维护代码的能力是程序员可以拥有的最重要的属性之一。基于此考虑，当你第一次在 Eclipse 中测试你的程序时，请选择调试（Debug）图标，而不是运行（Run）图标。\n\
    \n## 打印值\n\n在程序运行时，我们经常需要知道变量的值。识别变量值最基本的形式是将该值输出到屏幕。我们可以使用 `System.out.println`\
    \ 来实现这一点，例如使用 `System.out.println(\"The value of i is \" + i);`。这是一种非常原始的调试方法，但在许多情况下，这就是我们所需要的。通常情况下，最好按照后续节所述，在变量上设置断点（breakpoint）和监视（watch）。\n\
    \n## 设置断点\n\n断点是代码中的一个位置，我们希望程序在该处暂停并将控制权给我们，这样当程序在断点处暂停时，我们可以检查变量的值并逐行执行代码——一次一行。要设置断点，请在\
    \ Eclipse 代码视图的侧边栏处右键点击。这将弹出一个上下文菜单，其中包含“切换断点（Toggle Breakpoint）”选项，如图 27 所示。\n\
    \n## 图 27：切换断点\n\n当断点处于激活状态时（即如果程序到达断点时将暂停），你将在代码窗口的侧边栏看到一个小小的断点符号，如图 28 所示。\n\
    \n## 图 28：激活断点\n\n当图 28 中的断点指示器为蓝色时，意味着断点是激活的。你可以通过右键点击断点符号并从上下文菜单中选择禁用断点（Disable\
    \ Breakpoint）来禁用断点。当断点被禁用时，圆圈是白色的，程序在到达断点时不会暂停。\n\n## Eclipse 中的调试视图\n\n当程序到达激活的断点时，它会暂停并将控制权给我们。第一次在\
    \ Eclipse 中中断时，你可能会收到一个对话框，如图 29 所示。Eclipse 设计用于提供几个专门用于调试的额外工具，并建议切换到调试视图（Debug\
    \ perspective）。点击标记为“记住我的决定（Remember my decision）”的框并选择“是（Yes）”以进入调试视图。\n\n这种启动配置为在挂起时支持调试视图。\n\
    此调试视图旨在支持应用程序调试。它包含了显示调试栈、变量和断点管理的视图。\n你想打开此视图吗？\n\n- 记住我的决定\n\n图 29：确认切换视图\n\n\
    ![](img/d6e922df0109ee8e372f5019b6a2a192_42_0.png)\n\n调试视图如图 30 所示。\n\n![](img/d6e922df0109ee8e372f5019b6a2a192_42_1.png)\n\
    \n图 30：调试视图\n\n注意图 30 中高亮的行。Eclipse 场景准备好执行。在 Eclipse 顶部，你会看到播放按钮、暂停按钮和停止按钮。为了停止程序执行，点击停止。为了恢复正常执行（即直到程序找到下一个断点），点击播放。如果程序正在执行而没有遇到断点，你可以通过暂停按钮来暂停它（见图\
    \ 31）。在某些情况下，这些按钮中的某些可能是灰色的（例如，如果程序已在断点暂停，暂停按钮是不可用的）。\n\n（注：此处原文未提供图31，根据上下文引用）\n\
    \n![](img/d6e922df0109ee8e372f5019b6a2a192_43_0.png)\n\n> **提示：点击图 29 中播放按钮左侧的按钮可以跳过断点。**\
    \ 这对于设置了很多断点非常有用。\n\n你可以通过点击 Eclipse 右角的按钮在 Java 视图和调试视图之间切换，如图 32 所示。\n\n![](img/d6e922df0109ee8e372f5019b6a2a192_43_1.png)\n\
    \n图 32：切换视图\n\n## 逐行执行代码\n\n逐行执行代码可以通过两种方式进行：\n\n- 逐过程（Step Over）\n- 逐入（Step Into）\n\
    \n当程序暂停时，我们可以通过查看变量来非常仔细地观察正在发生的情况。我们通过使用逐过程和逐入按钮来实现这一点（见图 33）。你可以在 Eclipse 顶部找到这些按钮。\n\
    \n![](img/d6e922df0109ee8e372f5019b6a2a192_44_0.png)\n\n图 33：逐过程和逐入按钮\n\n逐过程意味着程序执行当前行，然后再次暂停。它不会进入方法调用。逐入意味着程序将执行下一行，但如果该行是方法调用，它将进入方法体并暂停。逐入的快捷键是\
    \ F5，逐过程快捷键是 F6。\n\n## 监视变量\n\n当我们逐过程和逐入代码时，可以通过查看变量视图来确切看到变量包含哪些值，如图 34 所示。\n\
    \n![](img/d6e922df0109ee8e372f5019b6a2a192_44_1.png)\n\n图 34：变量视图\n\n当应用程序暂停时，变量视图显示了当前作用范围内的所有变量。黄色高亮的变量在上次的逐过程或逐入期间发生了变化。\n"
