    # Chapter 5 Data Types and Variables


    # Memory


    In Java, as with all computer programming languages, we can read and write data
    to various memory spaces. A memory space is simply an area in which we can save
    and retrieve information. One of the most useful memory spaces that we can read
    and write to is called RAM. Random Access Memory is a type of volatile memory
    used for temporary storage (volatile means it is cleared when the system reboots).


    RAM is nothing more than a string of 0s and 1s. The 0s and 1s are organized into
    bytes of 8 bits each (a bit is short for binary digit—it is a single 0 or 1):
    See Figure 35 for an illustration of several bytes in RAM.


    | 02AC | 02AB | 02AA | 02A9 | 02A8 | 02A7 | 02A6 |

    |---|---|---|---|---|---|--|

    | 14 | 26 | 200 | 117 | 17 | 4 | 91 |


    ![](img/d6e922df0109ee8e372f5019b6a2a192_48_0.png)


    Figure 35 shows seven bytes in RAM. Each byte in RAM has an address written above
    the boxes (real addresses on modern computers have 16 hexadecimal digits instead
    of the four I''ve used in the illustration). The addresses are consecutive numbers
    counting up as we move through RAM from left to right. The addresses are written
    in hexadecimal (so we use 02A8 instead of 680—hexadecimal is not important at
    the moment).


    > Note: In Java, we do not have access to the addresses in RAM. This is one of
    the biggest differences between Java and related languages C and C++. Accessing
    RAM directly with addresses can be dangerous—it is easy to accidentally access
    the wrong bytes and cause bugs in our programs. So, Java does not allow direct
    access to RAM.


    Along with an address, each byte in RAM has a value (such as 14, 100, or 117 in
    Figure 35). As you can see, RAM is a collection of bytes, each with an address
    so that we can reference the bytes, and a value, so that we can read and write
    some information.'
  - '[PAGE 49]


    In Figure 35, the byte at address 02A9 is zoomed in, and we can see the individual
    bits that make up the number 117 written out in the binary counting system. In
    binary, bits are read from left to right, the same way we read decimal numbers.
    So, the bit on the left is the most significant (as in the 6 in 684), and the
    bit on the right is the least significant (as in the 4 in 684).


    Programming a computer is difficult when we reference RAM by addresses (and Java
    does not allow us direct access to bytes by their addresses). Addresses are simply
    hexadecimal numbers, and they do not appear meaningful to humans.


    As programmers, we need to manipulate and control hundreds, thousands, and even
    millions of bytes in RAM, and doing with so is extremely difficult. Therefore,
    instead of referencing RAM by addresses, we name certain points in RAM and use
    the names instead of addresses. These named points in RAM are called variables.
    A variable is literally a point that we have named and which we can read and write
    in RAM. Variables often contain multiple bytes—for instance, int in Java is built
    from four consecutive bytes and can store larger numbers than a single byte can
    store.


    Each variable in Java has a data type that is an indication as to what type of
    manipulations we will perform on the particular spot in RAM or which type of information
    the bits represent. We might wish to use a variable for floating-point computations
    such as 3.4+7.8, or we might wish to perform some operation with whole numbers
    (integers) such as 3+7.


    # Primitive data types


    The most fundamental, building blocks of data types in Java are called the primitive
    data types (sometimes just primitives). They are used to build more complex data
    types such as classes and enumerations. When we declare variables in Java, we
    must state their data types. Java is a type-safe language, which means that once
    a data type is given to a variable, we cannot later change the type.


    Table 1: Primitive Data Types


    | Name | Type | Size (Bytes) | Size (Bits) | Minimum | Maximum |

    |---|---|---|---|---|---|

    | byte | Integer | 1 | 8 | -128 | 127 |

    | short | Integer | 2 | 16 | -32768 | 23767 |

    | int | Integer | 4 | 32 | -2147483648 | 2147483647 |

    | long | Integer | 8 | 64 | -²⁶³ | ²⁶-1 |

    | float | Float | 4 | 32 | -3.4x1⁰³ | 3.4x1⁰³ |

    | double | Float | 8 | 64 | -2.2x¹⁰³ | 2.2x¹⁰³ |

    | boolean | Boolean | 1* | 8* | false | true |'
