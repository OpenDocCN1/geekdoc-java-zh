  - '[PAGE 51]


    The final two columns show the available ranges of the primitives—the minimum
    and maximum values that each primitive can store.


    Programmers should become familiar with all of the primitive data types, but in
    practice we tend to use some more than others. Most programmers will use int for
    all numerical, whole-number variables. The smaller integer data types, byte and
    short, are used to save space in RAM when the range of values being stored is
    known within the much smaller range of byte or short. The long data type is not
    typically used unless the programmer has a specific reason to do so—for instance,
    if the programmer needs to store values greater than 2:15 billion.


    > Note: If you require more than a long can accommodate, there is a standard called
    "BigInteger" that offers arbitrarily large integers. BigInteger is not a primitive,
    but instead a class built of primitives that allows computation with very values
    (used in encryption algorithms, for example). This type of computation comes at
    a cost, and BigInteger computations are much slower for the JVM to perform than
    computations with int or Long. To use a BigInteger, we need to import java.math.BigInteger
    and declare a BigInteger object.


    Programmers often use double as the default data type when they need to representing
    floating-point values. Double is twice as large as a float (64 bits for doubles,
    32 for floats), which means that if you have a list of values (such as an array
    with one million elements), storing the elements as float will make the array
    roughly four megabytes of RAM rather than eight. The downside of float is that
    it is far less accurate. The accuracy offered by doubles can be very important
    because every operation we perform on floating-point variables (double and float)
    has the potential to introduce rounding errors.


    The boolean type has the only two possible states—true and false. We boolean variables
    when we know there are only two states to a variable, and the states need not
    necessarily be true and false. For instance, a boolean variable could represent
    a person''s gender, a light switch on or off, or the digits 0 and 1. Boolean variables
    are commonly used to create conditional, logical, or expressions. We use a logical
    expression without actually defining a variable, but then the scenes a boolean
    is being created and evaluated for every logical expression (we will see many
    logical and conditional expressions in the section on control structures).


    The char data type is used to store letters, digits, punctuation, and many other
    symbols (char represents characters using the Unicode encoding scheme). The char
    data type is really just a short, but the JVM treats it 16 bits. For example,
    if you set a char to 65 and print the results using a println the program will
    see 65. If you use a char variable, set it to 65 and print the results with println
    A. This println function is designed to treat char data types as references to
    Unicode characters. The symbol in the Unicode table at position 65 is A, therefore
    println prints A to the screen instead of 65 when it sees that data type is char.


    char variable types are string together to form strings of characters. Strings
    are rather than text, they are not a primitive type, and we will cover them in
    a mome.'
  - "[PAGE 52]\n\n> Note: The primitive data types always have the same size, regardless\
    \ of the value they store. All int variables consume four bytes, regardless of\
    \ the value they store. For example, the number 3 could theoretically be stored\
    \ using only two bits, 11, in binary. But, if we store 3 in the int: 00000000\
    \ 00000000 00000000 00000011, it will be padded with many zeros to take up the\
    \ remaining bits.\n\n# Variables\n\nA variable is a named, primitive data type.\
    \ Each variable is a collection of bytes acting as one of the primitive data types\
    \ from Table 1, and which we have given a name. We refer to variables by their\
    \ name (instead of their addresses in RAM) and can read or change their values\
    \ of RAM using the variable names as our references. A variable stores information,\
    \ such as the number 3 or the name Jane.\n\n# Variable declaration and definition\n\
    \nTo declare a variable is to state that it exists. We give the data type and\
    \ a name—that is, an identifier. To define a variable is to specify for it a value.\
    \ Variables must be declared and defined before they are used.\n\nInitialization\
    \ comes when we define a variable's value for the first time. A variable that\
    \ is declared but not defined is called uninitialized, and the variable cannot\
    \ be used in computation until it is initialized. In Java, we can declare and\
    \ initialize a variable in a single line of code using the assignment operator\
    \ \"=\" (see the section on operators for more information on the assignment operator).\n\
    \nCode Listing 5.0 shows various declarations and definitions of variables.\n\n\
    Code Listing 5.0: Declaring and Defining Variables\n\n```\npublic class MainClass\
    \ {\n    public static void main(String[] args) {\n        int i = 100; // Declare\
    \ and initialize an int.\n        int b = 10, c = 5;// Declare and initialize\
    \ two variables.\n        boolean mb = false; // Declare and define a Boolean.\n\
    \n        char myLetter; // Declare a character.\n        myLetter = 'h'; // Define/set\
    \ the character to be 'h'.\n        byte hp, bp, sp; // Declare 3 byte variables.\n\
    \        hp = bp = sp = 0; // Set all 3 bytes to 0.\n        short ss = 189; //\
    \ Declare and define a short integer.\n        long p = ss; // Declare and define\
    \ a long with the value of ss.\n        double myDouble = 100.0; // Declare and\
    \ define a double.\n        float f = 0.1f; // Declare and define a float.\n \
    \   }\n}\n```"
  - "[PAGE 53]\n\nWhen declaring a variable, the data type comes first, followed by\
    \ the name of the variable, and optionally followed by the initial setting for\
    \ the variable. Variables can be defined on the same line as the declaration (such\
    \ as the int variables a, b, and c in Code Listing 5.0) or on a separate line\
    \ (such as the char myLetter in Code Listing 5.0). You can declare and define\
    \ more than one variable of the same type by separating each variable with a comma\
    \ (as shown by the variables a and c in Code Listing 5.0).\n\nThe numbers in Code\
    \ Listing 5.0, such as 189 and 0if, as well as the character 'h' and the boolean\
    \ value false, are called literals. We will examine them later.\n\nYou can also\
    \ use mathematical and logical statements to initialize a variable. For example:\
    \ intInteger = 109+1. This will set the variable Integer to 91.\n\n> Tip: Name\
    \ your variables clearly Selecting can greatly increase the readability of code.\
    \ In general, a programmer should name variables succinctly. Consider \"s\" as\
    \ a variable to store employee's salary, or the more appropriately \"employeeSalary.\"\
    \ Calling the variable \"employeeSalary\" is much more descriptive than the letter\
    \ \"s\".\n\nNote: As mentioned, many programmers use a technique called Camel\
    \ Case to name identifiers with Java (and other languages). The first word of\
    \ a member method or variable's name is lowercase, and all subsequent words begin\
    \ with an uppercase letter. For example, \"myVariable\" and \"vehiclesPerHour.\"\
    \ But class names begin with an uppercase letter—\"MyClass\" and \"UserInformation\"\
    \n\n# Detour: strings\n\nBefore we move on describing literals, let's take a brief\
    \ detour to examine a data type that is not primitive. String is not primitive,\
    \ but is so commonly used that it can be introduced with the other data types.\
    \ A String is an array (see the section on arrays) or sequence of characters,\
    \ one after the other. A String can be used to represent text, numbers, or sequences\
    \ of Unicode symbols (a String is literally a string of char variables). We surround\
    \ text with double quotes to indicate that it is a String.\n\n```\nString str\
    \ = \"This is a string variable\"\n```\n\nWe can define a String on multiple lines\
    \ using the + operator to connect more than one String together (Code Listing\
    \ 5.1).\n\nCode Listing 5.1: Multiple-Line String\n\n```\nString description =\
    \ \"Strings can \" + \n\"be defined on multiple \" + +\n\"lines with the + operator!\\\
    \";\"\n```"
- md: "\nThere is a very important distinction to make between a String and numerical\
    \ data types such as int and float. A String is not interchangeable with a data\
    \ type, even if both have the same value. A String can be parsed into integers\
    \ using a function call, Integer.parseInt, but it is not possible to assign a\
    \ String to an integer in the normal way. The second line of Code List 5.2 is\
    \ illegal:\n\n# Code List 5.2: Strings and Numerical Data Types are Not Interchangeable\n\
    \n```\nString str = \"100\";\nint j = 10 + str;\n```\n\nA String is an array of\
    \ characters, and each character has a more or less arbitrary numerical value\
    \ (it is the Unicode character). If we add 10 to the character 7, we do not get\
    \ 17, but 65! This is because the character 7 is not equal to the integer 7. The\
    \ character 7 has a Unicode value of 55. For this reason, we are not able to convert\
    \ a numerical string such as 1278 without calling a helper function as Integer.parseInt.\n\
    \nCode List 5.3 shows parsing a String to an int and adding to an integer so that\
    \ these operations will give the normal, expected results. We will cover calling\
    \ functions, boxing/unboxing, and the Integer class. Let it suffice to say that\
    \ Integer.parseInt(str) will return the int, numerical value of the characters\
    \ of the String.\n\n# Code List 5.3: Parsing Strings and Characters\n\n```\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        // Set str\
    \ to the string \"7\"\n        String str = \"7\";\n\n        // Set j to the\
    \ integer 10 + \"7\" parsed to int.\n        int j = 10 + Integer.parseInt(str);\n\
    \n        // Set c to the character '7'\n        char c = '7';\n\n        // Set\
    \ i to 10 + 7, notice we subtract the\n        // character '0' from '7' to get\
    \ the int 7\n        // from the character '7' instead of parsing.\n        int\
    \ i = 10 + c - '0';\n\n        // Both j and i are set to 17.\n        System.out.println(\"\
    : \" + j);\n        System.out.println(\": \" + i);\n    }\n}\n```\n\nCode Listing\
    \ 5.4 shows an example of adding an integer to a String.\n\n# Code Listing 5.4:\
    \ Adding Integers to Strings\n\n```\nint idNumber = 26771;\n\nString desc = \"\
    The ID number is \" + idNumber + \".\";\n```\n\nIn Code Listing 5.4, we use the\
    \ concatenation operator, +, to place the 26771 in the middle of a String. Java\
    \ will create the value \"The ID number is 26771\" and store this in the String\
    \ desc. It is important to note that the integer idNumber has been converted to\
    \ a normal decimal string automatically.\n\n## Casting\n\nTo cast in Java means\
    \ to change the value of a variable or literal to that of another primitive data\
    \ type. To cast from one type to another, we use the primitive to cast in brackets.\
    \ Code Listing 5.5 shows some examples of casting numerical data types.\n\n# Code\
