    Most of the keywords here are used frequently, and the following is a brief summary
    of what each keyword does. Some keywords, such as volatile, abstract, and interface,
    will be explored in detail in the upcoming *Java Succinctly Part 2* e-book.


    **abstract:** This is a modifier. It expresses that a class or method within a
    class is abstract class. This means that the class cannot be instantiated as an
    object, but it can be used as a parent class. Any class with one or more methods
    marked as abstract itself be be marked as abstract.


    **assert:** This is a debugging keyword used to test conditions. The keyword is
    followed by a boolean expression. If the Boolean expression evaluates to false,
    the program will terminate upon asserting the assert. This allows us to test for
    particular conditions that will lead to errors in our code.


    **boolean:** boolean is a primitive data type. The keyword is used to declare
    boolean variables and to cast to the boolean type. The boolean data type can be
    set to one of two values—true or false.


