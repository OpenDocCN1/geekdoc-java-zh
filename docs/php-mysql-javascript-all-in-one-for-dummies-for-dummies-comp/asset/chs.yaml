  9.  完成后关闭浏览器窗口。\n\n新增的 `filter_var()` 验证检查会查找电子邮件地址是否符合 `name@hostname` 的正确格式。如果是的话，`filter_var()`\
  \ 函数将返回一个 `TRUE` 值，从而触发 `if…else` 语句显示数据。如果不是，则触发 `else` 代码块并显示警告，如图 4-5 所示。\n\n\
  ![image](img/9781119468387-fg040405.png)\n\n图 4-5： 输入无效电子邮件地址的结果。\n\n再次强调，这种检查并不是万无一失的——它只能检查电子邮件地址的格式。它并不会测试账户以确保其是活跃账户。但至少这是一个开始！\n\
  \n# 第 5 章\n# 面向对象的 PHP 编程\n\n## 本章内容\n\n![check](img/check.png) 定义面向对象编程\n![check](img/check.png)\
  \ 创建面向对象编程\n![check](img/check.png) 使用对象\n![check](img/check.png) 定制对象\n\n## 理解面向对象编程的基础\n\
  \n在开始学习面向对象编程之前，你需要了解它是如何运作的。OOP 需要一种与你之前使用的不同的范式。在 OOP 中，一切都被分组为对象。你使用的数据和函数都是与某个对象相关的。\n\
  \n一个 OOP 类包含成员。成员有两种类型：\n\n*   **属性（Properties）：** 类属性（也称为字段）表示对象的特征，例如汽车的重量或人的姓名。一个类可以包含多个属性。\n\
  *   **方法（Methods）：** 类方法与你之前使用的标准函数相似。方法使用类中的属性执行操作。例如，你可以创建方法从数据库中检索特定人员，或者更改现有人员的地址。每个方法都应该包含在类内部，并仅在该类中执行操作。\n\
  \n### 定义类\n\n在 PHP 中定义类与定义函数没有太大区别。要定义新类，你使用 `class` 关键字，加上类名，然后是包含在类中的语句。\n\n这是一个简单类的示例：\n\
  \n```php\nclass Product {\n    public $description;\n    public $price;\n    public\
  \ $inventory;\n    public $onsale;\n\n    public function buyProduct($amount) {\n\
  \        $this->inventory -= $amount;\n    }\n}\n```\n\n![tip](img/tip.png) 你选择的类名在程序中必须是唯一的。命名遵循\
  \ PHP 变量名的相同规则。虽然不是强制，但程序员通常用大写字母开头类名，以便在代码中区分它们。\n\n此示例定义了四个属性成员和一个方法成员。每个成员都使用三种可见性分类之一定义。成员的可见性决定了你可以在哪里使用或引用该成员。PHP\
  \ 中使用了三种可见性关键字：\n\n*   `public`：成员可以从类代码外部访问。\n*   `private`：成员只能从类代码内部访问。\n\n\n\
  \n\n\n- `protected`: 成员只能从子类中访问。（我稍后在“扩展类”章节中会详细介绍这一点。）\n\n`Product` 类示例将所有成员声明为\
  \ `public`（公共），因此你可以在 PHP 代码的任何地方引用它们。\n\n`buyProduct()` 方法在函数中使用了一个看起来奇特的变量名：\n\
  \n`$this->inventory`\n\n`$this` 变量是一个特殊的标识符，用于引用类的当前对象。在这个示例中，它指向对象的 `$inventory`\
  \ 属性。注意，在这样进行引用时，`inventory` 属性前面的美元符号被去掉了。这有助于 PHP 识别出你正在从类对象内部引用 `$inventory`\
  \ 属性，而不是类本身。\n\n这段代码定义了类的结构，但实际上并没有对它执行任何操作。下一节将向你展示如何实际使用你的类模板来创建对象。\n\n### 创建对象实例\n\
  \n要使用一个类，你必须对其进行`实例化`（instantiate）。当你实例化一个类时，你会在程序中创建该类的所谓`实例`（instance）。每个实例都代表了程序中对象的某一次出现。要在\
  \ PHP 代码中实例化对象，你使用以下格式：\n\n`$prod1 = new Product();`\n\n这使用 `Product` 类创建了一个名为 `$prod1`\
  \ 的对象。当你实例化一个对象时，你可以从程序代码直接访问该类的公共成员：\n\n`$prod1->description = \"carrot\";`\n\n\
  `$prod1->price = 1.50;`\n\n`$prod1->inventory = 10;`\n\n`$prod1->onsale = false;`\n\
  \n这段代码为对象的每个属性设置了值。注意再次使用了 `->` 符号。它告诉 PHP 你正在专门引用 `$prod1` 对象的属性和方法。\n\n变量 `$prod1`\
  \ 现在包含了为该对象设置的这些值，你可以在代码的任何地方使用它来引用属性。当你需要使用对象的公共方法时，情况也是相似的：\n\n`$prod1->buyProduct(4);`\n\
  \n这调用了类对象的 `buyProduct()` 方法，并传递了值 `4`。由于 `buyProduct()` 方法更改了对象的 `$inventory` 属性，当你下一次在代码中引用\
  \ `$prod1->inventory` 属性时，它的值将变为 `6`。\n\n你可以在程序中实例化所需的数量的类实例。只需确保每个实例使用不同的变量名即可：\n\
  \n`$prod2 = new Product();`\n\n`$prod2->description = \"eggplant\";`\n\n`$prod2->price\
  \ = 2.00;`\n\n`$prod2->inventory = 5;`\n\n`$prod2->onsale = true;`\n\nPHP 将保持两个\
  \ `Product` 类的实例完全分离，为每个实例维护属性值。按照以下步骤测试在 PHP 中创建和使用类：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<title>PHP Test</title>\n</head>\n<body>\n<h1>Testing OOP code</h1>\n\
  <?php\nclass Product {\n    public $description;\n    public $price;\n    public\
  \ $inventory;\n    public $onsale;\n\n    public function buyProduct($amount) {\n\
  \        $this->inventory -= $amount;\n    }\n}\n\n$prod1 = new Product();\n$prod1->description\
  \ = \"Carrots\";\n$prod1->price = 1.50;\n$prod1->inventory = 10;\n$prod1->onsale\
  \ = false;\necho \"<p>Just added $prod1->description</p>\\n\";\n\n$prod2 = new Product();\n\
  $prod2->description = \"Eggplants\";\n$prod2->price = 2.00;\n$prod2->inventory =\
  \ 5;\n$prod2->onsale = true;\necho \"<p>Just added $prod2->description</p>\\n\"\
  ;\necho \"<p>Now buying 4...</p>\\n\";\n$prod1->buyProduct(4);\necho \"<p>Inventory\
  \ of $prod1->description is now $prod1->inventory</p>\\n\";\necho \"<p>Inventory\
  \ of $prod2->description is still $prod2->inventory</p>\\n\";\n?>\n</body>\n</html>\n\
  ```\n\n1. 打开你喜欢的文本编辑器、程序编辑器或集成开发环境 (IDE)。\n2. 在编辑器中输入以下代码。\n3. 将文件保存为 `ooptest1.php`\
  \ 并放在你 Web 服务器的 `DocumentRoot` 文件夹中。对于 Windows 上的 XAMPP，路径为 `c:\\xampp\\htdocs`；对于\
  \ macOS 上的 XAMPP，路径为 `/Applications/XAMPP/htdocs`。\n4. 打开 XAMPP 控制面板，然后启动 Apache\
  \ Web 服务器。\n5. 打开浏览器，输入以下 URL：`http://localhost:8080/ooptest1.php`。你可能需要更改 TCP 端口以匹配你的\
  \ Web 服务器。\n6. 完成后关闭浏览器窗口。\n\n当你运行 `ooptest1.php` 文件时，你应该能看到图 5-1 所示的输出。\n\n![image](img/9781119468387-bk04ch05.xhtml_c18-fig-0001)\n\
  \n![image](img/9781119468387-bk04ch05.xhtml_c18-fig-0001)\n\n图 5-1\n\n（注：由于原文文本中包含占位符和图片链接，此处翻译时根据逻辑保留了结构，并对描述性文字进行了处理。）\n\
