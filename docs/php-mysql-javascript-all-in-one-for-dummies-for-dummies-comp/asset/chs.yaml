  \ 2 章：MySQL 管理\n\n## MySQL 管理工具\n## 用户账户管理\n\n# 第 3 章：设计与构建数据库\n\n## 管理数据\n## 创建数据库\n\
  ## 构建表\n\n# 第 4 章：使用数据库\n\n## 处理数据\n## 搜索数据\n## 数据安全操作\n\n# 第 5 章：通过 PHP 脚本与数据库通信\n\
  \n## PHP 中的数据库支持\n## 使用 mysqli 库\n## 整合一切\n\n# 第 1 章：MySQL 简介\n\n## 本章内容\n\n![check](img/check.png)\
  \ **理解为什么你需要数据库**\n\n![check](img/check.png) **了解 MySQL 的工作原理**\n\n![check](img/check.png)\
  \ **探索 MySQL 的高级特性**\n\n计算机的核心在于存储信息。然而，与你厨房里那个装满了写有名字和电话号码的碎纸条的杂物抽不同，你希望以有序的方式存储你的动态\
  \ Web 应用数据。毕竟，你可不想将天体物理实验的数据与你的保龄联赛计分混在一起！\n\n`MySQL` 数据库服务器为你提供了一个易于使用的平台来组织应用程序数据，让你能够轻松识别哪些数据属于哪个应用程序，并方便应用程序访问数据，同时保持安全性，确保只有正确的人才能访问正确的数据。本章将阐述为什么你的动态\
  \ Web 应用需要数据库，以及为什么你应该选择 `MySQL` 数据库服务器。\n\n## 了解数据库的用途\n\n通过 `PHP`，你有几种不同的选项在应用程序中存储持久化数据，以便日后检索。一种方法是使用\
  \ `PHP` 文件系统函数在服务器上创建一个标准文本文件来存储应用程序数据，然后在需要时读回这些数据。\n\n使用标准文本文件存储应用程序数据的一个缺点是很难在埋在文本文件中找到特定的数据项。标准文本文件通常被称为“扁平文件”（flat\
  \ files），因为你无法在数据中创建任何类型的关系来使特定信息的搜索更容易。你的应用程序必须打开文本文件并读取每一行，直到找到所需的数据。这对于少量数据来说没没问题，但对于大量数据，速度可能会缓慢，特别是当有数千名网站访问者试图同时从同一个文件访问他们的数据时。\n\
  \n为了解决这个问题，大多数 Web 开发者已转向使用数据库。数据库组织数据的方式使得数据库服务器更容易插入、查找、修改和删除数据。有很多不同的数据库类型可用，但最流行的之一是关系型数据库系统。本节将描述关系型数据库如何处理数据以帮助加速你的\
  \ Web 应用程序。\n\n### 数据库如何工作\n\n`Microsoft Access` 是迄为止为商业用途开发的最流行的端用户数据库工具。许多 Windows\
  \ 用户（从专业会计到保龄联赛秘书）都使用 `Access` 来跟踪数据。它提供了一个简单、直观的用户界面，让新手计算机用户能够轻松地生成查询和报告。\n\n\
  然而，尽管其易于用，但 `Access` 也有其局限性。要完全理解 `MySQL` 与 `Access` 的区别，你必须首先理解数据库系统是如何组织的。\n\n\
  数据库不仅仅是一堆数据文件。大多数数据库都包含了几层文件、程序和实用程序，它们相互作用以提供数据库体验。整个软件包被称为*数据库管理系统*（`DBMS`）。\n\
  \n整个软件包包括：\n*   数据库引擎\n*   一个或多个数据库文件\n*   查询语言\n*   界面\n\n*数据库引擎*是 `DBMS` 的核心和大脑。它控制对存储在数据库文件中的访问。\n\
  \n\n\n\n仅此项功能就让 MySQL 成为多用户数据库项目中更好的数据库选择。\n\n## 关系型数据库\n\n数据库的核心在于组织数据以便更快速地查找信息。`Relational\
  \ database theory`将数据分为三个级别：数据库、表和数据字段。\n\n### 数据库\n\n`database`（数据库）将相关数据分组到一个单一容器中。`database`是关系型数据库服务器上数据的最高层级或数据分组。服务器允许你创建多个数据库，所有数据库都可以从运行在服务器上的同一个服务器服务访问。\n\
  \n![tip](img/tip.png) 为了帮助保持条理，建议为托管在服务器上的每个应用程序创建一个单独的数据库。这有助于分离数据元素，并消除因访问错误应用程序的错误数据而导致的意外。\n\
  \n![remember](img/remember.png) 你创建的每个数据库在服务器上必须有一个唯一的名称。为了方便组织工作，通常最好以某种方式将数据库名称与应用程序的名称关联起来。\n\
  \n### 表\n\n`table`（表）是`database`中数据的子集，包含一组相似的数据项。例如，如果一家公司想要跟踪员工、客户和产品的数据，而不是只使用一组混合的数据元素，公司将创建四个独立的表来存储数据：\n\
  \n*   一个 `Employees` 表用于存储与员工相关的数据\n*   一个 `Customers` 表用于存储与客户相关的数据\n*   一个 `Products`\
  \ 表用于存储与产品相关的数据\n*   一个 `Orders` 表用于跟踪单个客户订单包含哪些产品\n\n将应用程序数据分组到表的过程被称为`data normalization`（数据归一化）。将相似的数据分组到自己的表中可以让你对数据有更多的控制。。例如，如果你有一个仅与客户订单接口的程序，你可以授予它仅访问\
  \ `Customers`、`Products` 和 `Orders` 表的权限，让 `Employees` 表免受意外泄露。\n\n### 数据字段\n\n\
  你使用`data fields`（数据字段）来存储表中的单个数据元素。例如，`Employees` 表可能包含员工 ID 号、名、姓、家庭地址、工资和入职日期的数据字段。数据字段是应用程序的核心，因为它们是应用程序实际存储数据的地方。\n\
  \n表将数据字段分组为`data records`（数据记录）。每个数据记录都是每个数据字段值的一个次出现情况。图 1-4 显示了 `Employees` 表可能的外观图。\n\
  \n![image](img/9781119468387-fg050104.png)\n\n图 1-4: `Employees` 表布局的示例。\n\n图 1-4\
  \ 显示数据字段作为表头。每个数据记录显示为表中的单行数据（在这种情况下是单个员工的信息）。因为数据在表中通常这样显示，你会经常听到人们用 `row`（行）来引用单个数据记录。\n\
  \n## 数据库数据类型\n\n就像编程语言中的变量一样，数据库需要识别每个数据字段中存储的数据类型，以便知道需要预留多少空间来存储数据，以及如何处理这些数据。表\
  \ 1-1 显示了大多数关系型数据库系统中常见的基础数据类型。\n\n| 数据类型 | 说明 |\n| --- | --- |\n| `int` |位于 –2,147,483,648\
  \ 到 2,147,483,647 之间的整数 |\n| `float` | 位于 –3.40283466E+38 到 +3.40283466E+38 之间的浮点数\
  \ |\n| `bool` | 布尔真或假值 |\n| `date` | 以 YYYY-MM-DD 格式的日期值 |\n| `datetime` | 以 YYYY-MM-DD\
  \ HH:MM:SS 格式显示的日期和时间值 |\n| `char(x)` | 长度为 `x` 个字符的固定长度字符字符串 |\n| `varchar(x)`\
  \ | 长度为 `x` 个或更少字符的变长字符字符串 |\n| `text` | 最多 65,536 个字符的变长字符字符串，以二进制值存储 |\n\n表 1-1\
  \ 标准数据库数据类型\n\n许多关系型数据库服务器提供这些标准数据类型的变体，例如小整数值或大文本值，以帮助你自定义为每个数据字段预留多少空间。遗憾的是，这些自定义数据类型在关系型数据库之间并不一定标准化。\n\
  \n## 数据约束\n\n除了数据字段名和值之外，数据字段还可以标记特殊的`data constraints`（数据约束）。关系型数据库使用数据约束来控制你如何将数据放入数据字段。最流行的数据约束是`primary\
  \ key`（主键）。\n\n`primary key` 定义了唯一标识每个记录的数据字段。例如，如果你的公司有两个名为 Smith 的员工，在尝试获取正确记录时会遇到问题。为了解决这个问题，关系型数据库允许你添加特殊的数据字段。为了这样做，你需要创建一个\
  \ ID 数据字段并为每个记录分配一个唯一的数字。\n\n另一个你经常遇到的数据约束是 `is null`。如果你为数据字段设置了 `is null` 数据约束，数据库服务器将阻止你输入空值。\n\
  \n## 结构化查询语言\n\n结构化查询语言（SQL）是一种自 70 年代初以来与关系型数据库系统交互的语言。多年来，其他数据库厂商试图模仿或用自己的查询语言取代\
  \ SQL。但尽管有这些尝试，SQL 仍然为用户和管理员提供了与任何类型的关系型数据库交互的最简单界面。\n\n1986 年，美国国家标准创建了第一个 SQL\
  \ 标准。美国政府将其采用联邦标准并命名为 ANSI SQL89。大多数数据库厂商现在使用此 SQL 标准与他们的产品进行交互。\n\n![tip](img/tip.png)\
  \ SQL 标准一直在演进，不断发布新标准以支持新的高级数据库功能。本书期间，最新的标准是 SQL:2016。\n\nSQL 语言规定了你向数据库服务器发送命令的格式。SQL\
  \ 命令格式由：\n\n*   关键字：`SQL keywords` 定义了数据库服务器根据 SQL 语句执行的操作。SQL 标准定义了用于执行不同操作的许多关键字。然而，你会发现自己在数据库编程中只使用几个标准关键字，因此记住它们并不难。表\
  \ 1-2 列出了常用的关键字。\n*   标识符：SQL 命令 `identifier`（标识符）定义了命令中使用的数据库对象。这通常是数据库名、表名或数据字段名。SQL\
  \ 标识符帮助你选择从数据库检索哪些数据元素以及从哪个表中选择它们。\n\n\n\n\n\n- **一个或多个字面量（可选）：** SQL 命令 `literals`\
  \ 定义了关键字引用的特定数据值。字面量是常量值，例如要插入表的数据值或用于在表数据中搜索的数据值。你必须将字符串字面量括在引号中（单引号或双引号均可），但数值值不需要加引号。\n\
  \n| **关键字** | **描述** |\n| --- | --- |\n| `DELETE` | 从表中删除数据记录 |\n| `DROP` | 删除表或数据库\
  \ |\n| `INSERT` | 向表中添加新的数据记录 |\n| `SELECT` | 从表中检索数据记录 |\n| `UPDATE` | 修改表中现有数据记录中的数据\
  \ |\n\n表 1-2 SQL 关键字\n\n你在 Web 应用中最常用的 SQL 命令是 `query`（查询）。查询是一个 SQL `SELECT` 语句，用于在数据库中搜索特定的数据记录。以下是\
  \ `SELECT` 语句的基本格式：\n\n`SELECT` *`datafields` `FROM` *`table`\n\n`datafields` 参数是一个你希望查询返回的数据字段名称的列表，并用逗号分隔。如果你想检索数据记录的所有数据字段值，可以使用星号\
  \ `*` 作为通配符。\n\n你还必须指定查询要搜索的特定 `table`。为了获得意义的结果，你必须将查询数据字段与正确的表相匹配。\n\n![tip](img/tip.png)\
  \ SQL 关键字在 SQL 语句中通常用大写字母标识。MySQL 允许你对关键字使用大写或小写。我在本书中使用全大写是为了帮助你识别 SQL 语句中的关键字。\n\
  \n默认情况下，`SELECT` 语句返回指定表中的所有数据记录。你可以使用一个或多个 `modifiers`（修饰符）来定义 MySQL 如何返回查询请求的数据。表\
  \ 1-3 显示了你在 SQL 查询中会遇到的常用修饰符。\n\n| **修饰符** | **描述** |\n| --- | --- |\n| `LIMIT`\
  \ | 仅显示返回的数据记录子集 |\n| `ORDER BY` | 按指定的顺序显示数据记录 |\n| `WHERE` | 显示满足特定条件的数据记录子集 |\n\
  \n表 1-3 SQL 查询修饰符\n\n`WHERE` 子句是最常用的 `SELECT` 语句修饰符。它允许你指定条件来过滤表中的数据。例如：\n\n```\n\
  SELECT lastname FROM Employees WHERE salary > 100000;\n```\n\n该 `SELECT` 语句仅返回工资超过\
  \ 100,000 美元的员工姓氏。\n\n![tip](img/tip.png) 起初，使用 SQL 与数据库服务器交互可能看起来有些无从——除了你为了构建动态\
  \ Web 应用所学习的语言外，你还必须学习一种全新的编程语言。不过不要担心。在应用程序开发过程中，你经常使用的 SQL 语句实际上只有几种。你很快就能记住它们。\n\
  \n## 介绍 MySQL\n\n我在本书中讨论的特定关系型数据库服务器是 MySQL 数据库服务器。MySQL 服务器是 Web 应用中最常用的数据库服务器——这是有原因的。接下来的章节介绍了让\
  \ MySQL 服务器如此受欢迎的特性。\n\n### MySQL 特性\n\nMySQL 数据库服务器由 David Axmark、Allan Larsson\
  \ 和 Michael Widenius 创建，作为 mSQL 数据库服务器的升级，并于 1996 年首次发布。它现在由 Oracle 所有并支持，但作为开源软件发布。\n\
  \nMySQL 最初创建是为了引入索引数据，通过使用索引顺序访问方法 (ISAM) 来加速 mSQL 数据库服务器的数据查询。它通过引入一种名为 `MyISAM`\
  \ 存储引擎的特殊数据管理算法来实现。这证明是一个巨大的成功。\n\nMySQL 最初以其数据访问速度而闻名。`MyISAM` 数据存储和索引方法被证明加速其他类型\
  \ DBMS 软件包数据访问的规则改变者。不久后，互联网世界就注意它，MySQL 成为高并发 Web 应用的首选 DBMS 包。\n\n如今，MySQL 已经进化到不仅仅是快速数据查询。开发持续进行以为\
  \ MySQL 添加新功能。特性简短列表包括：\n\n- 它用 C 和 C++ 编写，并已编译运行在许多不同的平台上。\n- 它采用了模块化设计方法来创建多层服务器设计。\n\
  - 它支持多线程，使其在可用时可以轻松扩展以包含多个 CPU。\n- 它使用基于线程的内存分配系统。\n- 它在内存中实现哈希表以提高性能。\n- 它支持客户端/服务器和嵌入服务器环境。\n\
  - 它支持多种数据存储引擎。\n- 它使用类库实现所有 SQL 函数。\n- 它包含对所有标准 SQL 数据类型的支持。\n- 它提供支持基于用户和基于主机的安全系统。\n\
  - 它包含了对超过 50 亿行大数据库的支持。\n- 它为许多编程语言（包括 PHP）提供了应用程序接口 (API)。\n- 它包含了许多不同的字符集，使其支持许多语言。\n\
  - 它提供了数据库管理的命令行和图形工具。\n\n在这些特性中，让我们仔细查看两个特定特性以展示 MySQL 的多功能性。接下来的章节将深入支持不同类型的能力，以及\
  \ MySQL 如何处理用户验证。\n\n### 存储引擎\n\n如前面的章节所示，MySQL 服务器使用模块化方法构建数据库服务器。其中一个模块就是它存储和访问数据的方式。这被称为\
  \ `storage engine`（存储引擎）。\n\n存储引擎是你数据的守门员，所有对你数据的请求都通过它。MySQL 服务器集成了不同类型的存储引擎，如\
  \ 1-4 所示。\n\n| **存储引擎** | **描述** |\n| --- | --- |\n| `Archive` | 生成一种用于插入和检索数据的特殊表，但不支持更新或删除数据。\
  \ |\n| `Blackhole` | 接受数据但不存储。用于开发测试。 |\n| `CSV` | 以逗号分隔的文件存储数据。 |\n| `Federated`\
  \ | 允许在不使用复制的情况下访问远程服务器的数据。 |\n| `Example` | 什么都不做的存储引擎。作为存储引擎开发者的模板。 |\n| `InnoDB`\
  \ | 平衡高可靠性和高性能的先进存储引擎。 |\n| `Memory` | 将所有数据存储在内存中以提高性能，但不会保留数据。 |\n| `MyISAM` |\
  \ 最初的 MySQL 存储引擎，以速度快但功能少而闻名。 |\n\n表 1-4 MySQL 存储引擎\n\n`MyISAM` 存储引擎让 MySQL 闻名，但它不再由\
  \ Oracle 开发。现在 MySQL 默认且推荐的存储引擎是 `InnoDB` 存储引擎。\n\n`InnoDB` 存储引擎支持许多商业数据库中的高级数据库功能，但最初以速度慢而闻名。开发者必须决定对他们的应用程序来说哪个更重要：性能还是高级的数据库功能。\n\
  \n然而，MySQL 开发人员所做出的工作提高了 `InnoDB` 存储引擎的性能，使其接近 `MyISAM` 存储引擎的性能。这让你兼得得失——先进的数据库功能和高性能的存储引擎。\n\
  \n\n\n\nMySQL 数据库服务器采用两层方法来处理对数据库数据的访问：\n\n* 分配给用户的用户账户\n* 用户连接到服务器的位置\n\nMySQL\
  \ 从你登录系统时使用的用户账户以及你连接的主机两个方面来考虑你的身份。这意味着，你不仅可以控制特定用户账户对数据的访问，还可以根据用户登录数据库服务器时所处的位置进行控制。例如，你可以允许一个用户账户在从本地服务器登录时拥有数据库的完全访问权限，而在其从远程服务器登录时，仅拥有数据库的受限只读权限。\n\
  \nMySQL 通过使用 `access control list` (ACL) 根据这些身份定义对数据库、表和特殊功能的权限来实现这一点的。当你在 MySQL\
  \ 中创建一个身份时，你不仅创建了一个用户账户，还指定了应用访问控制的位置。你可以使用通配符允许用户从多个位置拥有相同的权限。\n\nMySQL 使用两阶段方法来验证你的数据库连接。首先，MySQL\
  \ 根据所提供的用户 ID/密码组合以及该账户在系统上是否被锁定来接受或拒绝连接请求。然后，如果连接获得许可，MySQL 将根据数据库和表的权限来接受或拒绝访问请求。\n\
  \n用户账户可以访问数据库服务器，但并非服务器上的每个数据库都可以。你可以为在 MySQL 服务器上创建的每个应用程序数据库创建单独的用户账户。如果你的应用程序需要更多控制，你甚至可以创建仅访问同一数据库中某些表的独立用户账户！\n\
  \n作为数据库管理员，你还有权向用户账户授予系统级权限，例如创建新数据库甚至创建新用户账户的能力。\n\n![warning](img/warning.png)\
  \ MySQL 服务器有一个名为 `root` 的单一主管理员账户。如果你忘记了 root 用户账户的密码，该密码可能恢复也可能无法恢复，这取决于你的服务器设置和环境。跟踪\
  \ root 用户账户的密码始终是一个好主意，也要保护好它以便没有其他人可以使用它。如果你的系统需要多个管理员，请为他们各分配一个单独的用户账户，并授予这些账户在数据库服务器上的特权权限，以便他们根据需要创建数据库和用户账户。\n\
  \n## 高级 MySQL 特性\n\n当你在 MySQL 中使用默认的 InnoDB 存储引擎，你拥有丰富的高级数据库功能可供应用程序利用。本节将介绍 InnoDB\
  \ 存储引擎为 MySQL 世界带来的更高级的功能。\n\n### 处理事务\n\n所有的数据库服务器都允许用户输入数据库命令来查询和操作数据。优秀的数据库服务器与糟糕服务器的区别在于它们处理命令的方式。\n\
  \n数据库引擎将命令处理作为一个单一单元，称为 `transaction`（事务）。事务代表了数据库上的单次数据操作。大多数简单的数据库服务器将收到的每个命令（例如向表中添加新记录或修改表中的现有记录）都视为一个独立的事务。命令组则创建了一组事务。\n\
  \n然而，一些高级的数据库服务器（如带有 InnoDB 存储引擎的 MySQL）允许你执行更复杂的事务。在某些情况下，应用程序有必要根据单个操作的结果执行多条命令。\n\
  \n![remember](img/remember.png) 在关系型数据库中，表之间可以是相互关联的。这意味着一个表可以包含与另一个表相关的数据。在商店示例中，`Orders`\
  \ 表依赖于 `Customers` 和 `Products` 表中的数据。虽然这使得数据组织变得更容易，但也使得事务管理变得更加困难。单个操作可能需要数据库服务器更新多个不同表中的多个数据值。\n\
  \n在商店示例中，如果有新客户进入商店购买了一台笔记本电脑，数据库服务器必须修改三个表：\n\n* 在 `Customers` 表中添加新的数据记录\n* 在\
  \ `Orders` 表中添加新的数据记录\n* 修改 `Products` 表，将笔记本电脑的库存值减一\n\n为了使该操作完成，这三个操作必须全部成功。如果任何一个操作失败，数据将变得损坏。在高级数据库服务器中，你可以将所有这些操作合并为一个事务。如果任何一个操作失败，数据库服务器将回滚另外两个操作，使数据库恢复到之前的状态。这个特性对于你的\
  \ Web 应用程序来说至关重要！\n\n### 确保你的数据库符合 ACID 标准\n\n多年来，数据库专家制定了数据库应该如何处理事务的规则。所有专业数据库系统的基准都是\
  \ ACID 测试。不，我们并不是要将服务器扔进酸浴里；ACID 测试实际上是一组数据库功能的缩写，它定义了数据库服务器应如何支持事务：\n\n* 原子性 (Atomicity)\n\
  * 一致性 (Consistency)\n* 隔离性 (Isolation)\n* 持久性 (Durability)\n\n接下来的章节将检查这四个特性，并讨论\
  \ MySQL 如何实现它们。\n\n#### 原子性\n\n原子性特性规定，要认为一个事务是成功的，事务中的所有步骤都必须成功完成。要么所有步骤都应用于数据库，要么一个都不应用。不应允许事务执行。\n\
  \n为了支持原子性，MySQL 使用了一种名为 `commit and rollback`（提交和回滚）的系统。数据库操作在事务期间仅临时执行。当事务中的所有操作似乎都将成功完成时，事务会被提交（服务器将所有操作应用于数据库）。如果似乎任何一个操作可能会失败，整个事务将会被回滚（撤销之前任何成功的步骤）。这确保了事务作为一个整体完成。\n\
  \nMySQL 使用两阶段提交的方法提交事务。两阶段提交通过两个步骤（或阶段）执行事务：\n\n* **准备阶段 (Prepare phase)：** 分析事务以确定数据库是否能够提交整个事务。\n\
  * **提交阶段 (Commit phase)：** 将事务物理提交到数据库。\n\n两阶段提交允许 MySQL 在准备阶段测试所有事务命令，而无需修改实际表的数据。\n\
  \n#### 一致性\n\n一致性的概念比原子性稍微复杂。一致性特性规定，每个事务都应该让数据库处于有效状态。这里的棘手之处在于什么被认为是“有效状态”。\n\n\
  通常，该特性被应用于数据库服务器如何处理意外崩溃。如果数据库在多操作事务的提交阶段遇到断电，它能让表保持在数据合理的状态吗？\n\nMySQL 利用两个功能来实现一致性：\n\
  \n* **双写缓冲 (Double-write buffering)：** 通过双写缓冲，MySQL 在将数据写入实际表之前，会先将数据存储在缓冲区中。只有当所有事务数据写入缓冲区后，MySQL\
  \ 才会将缓冲区数据写入实际的表数据文件。\n* **崩溃恢复 (Crash recovery)：** 如果在缓冲区完全写入表文件之前发生了系统崩溃，MySQL\
  \ 可以使用崩溃恢复功能恢复缓冲区，该功能从事务日志文件中恢复已提交的事务。\n\n#### 隔离性\n\n\n\n\n\n隔离性对于多用户数据库是必须的。当有多个个人在数据库中修改数据时，可能会发生意外情况。如果两个人同时尝试修改同一个数据值，谁能确定哪个值才是最终值呢？\n\
  \n当有多个个人尝试访问相同的数据时，DBMS 必须充当交通警察的角色，引导谁先获得访问。隔离性确保每个正在运行的事务对任何其他正在运行的事务都是不可见的。DBMS\
  \ 必须允许每个事务完成，然后决定哪个事务的值是数据的最终值。它通过一种名为 `locking` 的功能来完成这项任务。\n\n锁的作用顾物其名：当事务提交到数据库时，它会对数据进行锁定。在数据被锁定期间，其他用户无法访问数据，即使是查询也不行。这防止了多个用户在数据处于锁定模式时进行查询或修改。\n\
  \nMySQL 使用两种锁定级别来支持隔离性：\n\n- **表级锁定 (Table-level locking)**：使用表级锁定，每当用户需要修改表中的数据记录时，DBMS\
  \ 都会锁定整个表，防止其他用户查看表中的数据。正如你所猜的，这对数据库性能会有不利影响，特别是在数据库数据变化频繁的环境中。早期的 DBMS 实现专门使用表级锁定。\n\
  - **行级锁定 (Row-level locking)**：为了解决表级锁的问题，许多 DBMS 实现（包括 `InnoDB` 存储引擎）现在都包含了行级锁定。使用行级锁定，DBMS\
  \ 仅锁定正在被修改的数据记录。表的其余部分仍供其他用户访问。\n\n## 持久性 (Durability)\n\n持久性特性规定，当事务提交到数据库时，它不能丢失。这听起来是一个简单的概念，但实际上，确保持久性往往比听起来要困难。\n\
  \n持久性意味着能够抵御硬件和软件故障。如果停电或服务器崩溃损害了存储在数据库中的数据，数据库就毫无用了。\n\nMySQL 通过结合多层保护来支持持久性。在一致性特性中提到的双写缓冲区和崩溃恢复功能也适用于持久性。MySQL\
  \ 将所有事务写入日志文件，将更改写入双写缓冲区区域，然后将它们写入实际数据库文件。如果系统在此过程中发生崩溃，大多数情况下 MySQL 可以恢复该过程中的事务。\n\
  \n![tip](img/tip.png) 持久性的责任也落在数据库管理员身上。为你的数据库服务器配备良好的不间断电源 (UPS) 并定期进行数据库备份，对于确保数据库表安全至关重要。\n\
  \n## 查看视图 (Examining the views)\n\nSQL 编程语言为开发者提供了创建相当复杂查询的能力，可以在单个 SQL 语句中从多个表中检索数据。然而，对于跨越几个表的查询，SQL\
  \ 语句可能会变得极其复杂。\n\n为了简化复杂的查询语句，某些 DBMS 软件包（包括 MySQL）允许管理员创建视图。`view` 允许你看到（或查看）包含在单独数据库表中的数据，就像它们存在于单个表中一样。你不需要编写子查询来从多个地方获取数据，所有数据都可以在单个表视图可用。\n\
  \n对于查询来说，视图就像任何其他数据库表。DBMS 可以像查询普通表一样查询视图。视图不占用数据库文件中的任何磁盘空间，因为当查询尝试访问数据时，DBMS 会“实时”生成视图中的数据。当查询完成后，视图数据就会消失。图\
  \ 1-5 显示了从商店数据库示例中创建的示例视图。\n\n![image](img/9781119468387-fg050105.png)\n\nFIGURE\
  \ 1-5: 客户订单信息的视图。\n\n[图 1-5] 显示的视图包含了 `Customers` 表中的某些客户数据、`Products` 表中的产品数据以及\
  \ `Orders` 表中的订单数据。查询可以访问视图中的所有字段，就好像它们属于单个表一样。\n\n![warning](img/warning.png) 你始终可以使用视图来读取数据，但你可能可以或无法使用视图来插入新数据或更新现有数据。这取决于视图中数据字段之间的关系。具有一对一关系的数据字段可以被插入或更新，但具有一对多关系的数据字段则不能。\n\
  \n## 使用存储过程 (Working with stored procedures)\n\n`stored procedure` (存储过程) 是一组通常被应用程序使用的\
  \ SQL 语句。你不需要让每个应用程序都提交多个 SQL 语句，你可以创建一个包含这些 SQL 语句的存储过程，每个应用程序只需要运行该存储过程即可。\n\n\
  存储过程还可以帮助提高应用程序性能，因为客户端和服务器之间需要传输的信息较少（特别是对于长过程）。存储过程允许你在数据库服务器中创建自己的常用函数库，供多个应用程序共享。这有助于你对查询进行性能优化，并确保所有应用程序使用相同的过程来检索数据。\n\
  \n## 使用触发器 (Pulling triggers)\n\n`trigger` (触发器) 是 DBMS 根据表中的事件执行的一组指令。可以触发指令的事件包括数据的插入、更新或删除。以下是常见的触发器：\n\
  \n- `AFTER DELETE`：在数据从表中删除后执行指令集。\n- `BEFORE DELETE`：在数据从表中删除之前执行指令集。\n- `AFTER\
  \ INSERT`：在数据插入到表中后执行指令集。\n- `BEFORE INSERT`：在数据插入到表中之前执行指令集。\n- `AFTER UPDATE`：在数据在表中更新后执行指令集。\n\
  - `BEFORE UPDATE`：在数据在表中更新之前执行指令集。\n\n触发器通过监控数据变化并在同时更改相关数据，帮助你维护数据库表内的数据完整性。\n\n\
  ## 使用大 对象 (Working with blobs)\n\n大多数数据库用户熟悉存储在数据库中的常见数据类型。这些包括整数、浮点数、布尔值、固定长度字符字符串和变长字符字符串。然而，在现代编程世界，支持许多其他数据类型也是必要的。看到用于存储和索引图片、音频剪甚至短视频的\
  \ Web 并不罕见。这种数据存储迫使许多专业数据库制定存储不同类型数据的方案。\n\nMySQL 使用名为二进制大对象 (`BLOB`) 的特殊数据类型来存储任何类型的二进制数据。你可以像处理其他数据类型一样向表中输入\
  \ `BLOB`。这允许你在应用程序中包含任何类型多媒体存储的支持，同时仍可以使用数据库的所有快速检索和索引方法。\n\n\n\n\n\n![warning](img/warning.png)\
  \ 仅仅因为你可以在表中保存大型二进制文件，并不意味着这一定是个好主意。大型二进制文件会迅速填满数据库磁盘空间并减慢正常的数据库查询。你需要分析你特定的应用程序需求，以确定是将二进制数据存储在数据库内部，还是作为标准文件存储在外部，仅在数据库中存储文件名的指针更好。\n\
  \n# 第 2 章：MySQL 管理\n\n## 本章内容\n\n![check](img/check.png) **通过命令行工作**\n![check](img/check.png)\
  \ **使用 MySQL Workbench**\n![check](img/check.png) **通过网页管理服务器**\n![check](img/check.png)\
  \ **创建用户账户**\n![check](img/check.png) **为用户分配数据库权限**\n\n如你从上一章所看到的，MySQL 数据库服务器是你动态\
  \ Web 应用程序中至关重要的组件。了解如何与 MySQL 数据库服务器交互以创建应用程序所需的数据库对象和用户账户，这一点至关重要。本章将介绍你在应用程序环境中直接与\
  \ MySQL 数据库服务器交互的不同方法。\n\n## MySQL 管理工具\n\n有很多不同的工具可用于与 MySQL 服务器交互以帮助管理你的数据库环境。多年来，有三种特定工具脱颖而出成为最受欢迎：\n\
  \n* MySQL 命令行实用程序\n* MySQL Workbench 图形工具\n* `phpMyAdmin` Web 端工具\n\n所有这些方法都允许你在服务器中创建、修改和删除数据库对象，管理用户账户和权限，并执行备份和恢复等标准的数据库维护任务。它们恰好使用了不同的环境来完成这些操作。\n\
  \n本节将介绍这些工具的基本知识，教你如何使用它们对 MySQL 数据库服务器执行基本的管理功能。\n\n### 通过命令行工作\n\n如今几乎所有东西都使用某种类型的图形界面，但\
  \ MySQL 项目仍然提供了一种在 Windows、Mac 和 Linux 环境中通过文本命令行直接与数据库交互的方法。这看起来可能很过时，但命令行通常可以提供一个快速输入命令的方便界面。在紧急情况下使用它也非常棒——你永远不知道自己何时会发现处于一个只有命令行可以操作的情境中！\n\
  \n本节将介绍如何仅使用命令行通过 MySQL 服务器执行标准的数据库管理功能。\n\n#### 命令行工具\n\nMySQL 提供了许多脚本和程序，为你提供了在命令行环境中与\
  \ MySQL 服务器交互的多种方式。表 2-1 列出了你在 MySQL 安装中找到的命令行工具。\n\n| **工具** | **描述** |\n| ---\
  \ | --- |\n| `innochecksum` | 检查损坏的 MyISAM 存储引擎文件 |\n| `l4z_decompress` | 解压 `mysqlpump`\
  \ 归文件 |\n| `myisam_ftdump` | 显示 MyISAM 文件中全文索引的信息 |\n| `myisamchk` | 修复损坏的 MyISAM\
  \ 存储引擎文件 |\n| `myisamlog` | 显示 MyISAM 日志文件的内容 |\n| `myisampack` | 压缩 MyISAM 存储引擎表文件\
  \ |\n| `mysql` | 提供与 MySQL 服务器的交互式命令行界面 |\n| `mysqld` | MySQL 数据库服务器主程序 |\n| `mysqld_multi`\
  \ | 管理服务器上的多个 `mysqld` 服务器进程 |\n| `mysqld_safe` | 用于 Linux 和 Unix 系统的 MySQL 服务器启动脚本\
  \ |\n| `mysql.server` | 用于 Mac 系统的 MySQL 服务器启动脚本 |\n| `mysqladmin` | 命令行管理工具 |\n\
  | `mysqlbinlog` | 解析二进制日志文件 |\n| `mysqlcheck` | 分析、优化和修复 MySQL 表 |\n| `mysqldump`\
  \ | 执行数据库备份 |\n| `mysqldumpslow` | 解析 MySQL 慢查询日志 |\n| `mysqlimport` | 将数据从文件加载到数据库\
  \ |\n| `mysqlpump` | 生成 SQL 文件将数据库迁移到另一个 SQL 服务器 |\n| `mysqlsh` | 用于创建脚本的 MySQL\
  \ Shell\n| `mysqlshow` | 显示数据库、表和数据字段信息 |\n| `mysqlslap` | 模拟 MySQL 服务器上的客户端负载 |\n\
  | `perror` | 显示 MySQL 错误代码的文本描述 |\n| `zlib_decompress` | 解压 `mysqlpump` 命令的压缩输出\
  \ |\n\n表 2-1 MySQL 命令行工具\n\n如你在 表 2-1 中所示，MySQL 提供了许多命令行实用程序来帮助你作为数据库管理员工作。你可能永远不会使用其中大多数工具，但了解它们的存在（以及它们的作用）是好的，以防你某时需要它们。\n\
  \n对于与 MySQL 服务器的大多数正常交互，你将使用 `mysql` 命令行程序，它将在下一节中讨论。\n\n#### 探索 MySQL 客户端工具\n\n\
  `mysql` 命令提供了一个基于文本的交互式界面（通常称为命令行界面或 CLI）用于 MySQL 服务器。当你启动该命令时，会得到一个交互提示符：\n\n```\n\
  C:\\xampp\\mysql\\bin>mysql --user=root --password\nEnter password:\n```\n\n```\n\
  Welcome to the MariaDB monitor.\nCopyright (c) 2000-2017 Oracle, MariaDB Corporation\
  \ and others.\nServer version: 10.28-MariaDB distribution\nYour connection id is\
  \ 4\n[(none)]\n```\n\n从 `>` 提示符，你可以向服务器提交 SQL 语句进行交互。`mysql` 命令提供了许多参数来自定义它的行为。你可以使用\
  \ `-?` 参数来显示所有可用参数及其作用。通常你唯一需要这些参数是 `--user` 和 `--password`。\n\n这些参数允许你在连接 MySQL\
  \ 服务器时指定用户 ID 和密码（默认情况下，`mysql` 命令尝试使用当前登录用户的账户连接到 MySQL 服务器）。如今在命令行中明文输入密码不是一个好主意。\n\
  \n偶尔你可能会发现自己需要连接到远程 MySQL 服务器的环境。如果是这种情况，添加 `--host` 参数来指定远程服务器的主名或地址。\n\n除了标准的\
  \ SQL 语句，`mysql` 命令还有许多特殊的内部命令。这些命令帮助你设置 CLI 内的特性以规范其行为。每个命令都有全称和快捷字符版本。如果你想使用快捷字符，请在快捷字符前加反斜杠。表\
  \ 2-2 列出了当前可用的命令及其快捷键。\n\n| **命令** | **快捷键** | **描述** |\n| --- | --- | --- |\n|\
  \ `charset` | `\\C` | 切换输出的另一个字符集 |\n| `connect` | `\\r` | 使用指定的数据库重新连接服务器 |\n|\
  \ `delimiter` | `\\d` | 设置 SQL 语句之间的分隔符（默认是分号） |\n| `edit` | `\\e` | 使用默认编辑器编辑命令\
  \ |\n\n\n\n\n\n| `ego` | `\\G` | 将命令发送到 MySQL 服务器并显示结果 |\n| `exit` | `\\q` | 退出命令行界面\
  \ |\n| `go` | `\\g` | 将命令发送到 MySQL 服务器 |\n| `help` | `\\h` | 显示可用命令 |\n| `nopager`\
  \ | `\\n` | 禁用分页器并将输出发送到标准输出 |\n| `notee` | `\\t` | 不将输出重定向到输出文件 |\n| `nowarning`\
  \ | `\\w` | 不显示 MySQL 警告信息 |\n| `pager` | `\\P` | 定义一个用于分页输出的程序（例如 `more`） |\n|\
  \ `print` | `\\p` | 打印当前命令 |\n| `prompt` | `\\R` | 更改命令行提示符 |\n| `quit` | `\\q`\
  \ | 退出命令行界面 |\n| `rehash` | `\\#` | 重建命令行补全哈希表 |\n| `source` | `\\.` | 执行指定的 SQL\
  \ 脚本文件 |\n| `status` | `\\s` | 从 MySQL 服务器检索状态信息 |\n| `tee` | `\\T` | 将输出重定向到指定的输出文件的同时进行显示\
  \ |\n| `use` | `\\u` | 使用另一个数据库作为默认数据库 |\n| `warnings` | `\\W` | 在每个命令后显示 MySQL\
  \ 警告 |\n\n### 表 2-2：mysql 命令\n\n在你输入命令后，`mysql` 程序会处理它并在 CLI 环境中显示结果。[图 2-1] 展示了使用\
  \ `status` 命令的输出。\n\n![image](img/9781119468387-fg050201.png)\n\n[图 2-1:] 状态命令的输出。\n\
  \n要退出 `mysql` 命令提示符环境，只需输入 `exit`。\n\n![tip](img/tip.png) 正如我的示例所示，某些一体化的 Apache/MySQL/PHP\
  \ 软件包（如 XAMPP）使用 MySQL 的姐妹应用 MariaDB，而不是使用原始的 MySQL 服务器包。MariaDB 软件包是在 Oracle 接手\
  \ MySQL 包的开发后，由原始开发者对原始 MySQL 包进行的衍生。他们创建 MariaDB 是为了完全替代 MySQL 服务器。为了保持两个软件包之间的完全兼容性，MariaDB\
  \ 开发人员使用相同的 `mysql` 命令，但在命令输出中插入了 MariaDB 签名，正如你在[图 2-1]中所看到的。\n\n### 使用 MySQL Workbench\n\
  \n从命令行工作可能会让你觉得自己像个硬核管理员，但依赖图形界面并不会让你失去一个真正管理员的身份。许多管理员更倾向于使用图形化工具，特别是当他们已经在图形化桌面环境中工作时。\n\
  \nMySQL 项目包含一个名为 Workbench 的优秀图形化管理工具。它在大多数 MySQL 安装中通常不会默认安装，但自己下载和安装并不困难。本节将介绍该过程，并向你展示图形界面中可用的一些功能。\n\
  \n#### 安装 Workbench 软件包\n\n你可以直接从 MySQL 网站（`https://dev.mysql.com/downloads/workbench`）获取\
  \ Workbench 工具。下载页面如[图 2-2]所示\n\n![image](img/9781119468387-fg050202.png)\n\n[图\
  \ 2-2:] MySQL Workbench 下载网页。\n\n滚动到页面底部即可查看下载程序安装包的部分。按照以下步骤下载并安装 Workbench：\n\n\
  1. **选择你计划运行 Workbench 的操作系统。**\n   因为它是二进制程序，你需要为计划使用的每个操作系统环境环境下载单独的程序包。\n2. **点击\
  \ Download 按钮开始下载。**\n   ![warning](img/warning.png) 如果你是 Windows 用户，请小心——这里有两个下载选项。其中一个选项会下载完整的\
  \ MySQL 服务器以及 Workbench。如果你已经安装了一体化软件包，则不需要下载 MySQL 服务器，只需下载 Workbench 客户端即可。\n\
  3. **下载完成后，运行下载包并按照分步说明在你的工作站上安装 Workbench。**\n\n![warning](img/warning.png) 如果你在\
  \ Windows 工作站上使用 Workbench，则需要安装 Microsoft .NET 4.5 和 Visual C++ 2015 重新发行程序库。你可以在微软网站上找到这两项内容。\n\
  \n#### 探索 Workbench 选项\n\n在你的工作站上安装并启动 Workbench 之后，你将看到如[图 2-3]所示的主窗口。\n\n![image](img/9781119468387-fg050203)\n\
  \n[图 2-3:] 主窗口。\n\n在开始使用数据库之前，你需要告诉 Workbench 如何连接。要这样做，请按照以下步骤操作：\n\n1. **点击 Connections（连接）标题旁边的加号添加新连接。**\n\
  \   这将打开 Setup Connection（设置连接）对话框，如[图 2-4]所示。\n2. **在 Connection Name（连接名称）中为连接输入唯一名称。**\n\
  3. **在 Hostname（主机名）中输入 MySQL 服务器的 IP 地址或主机名。**\n   如果你在工作站上运行 MySQL（例如使用 XAMPP\
  \ 时），请保留默认 IP 地址 127.0.0.1。\n4. **在 Username（用户名）中输入你登录服务器的用户账户。**\n   为了获得完全权限，请使用\
  \ `root` 用户。\n5. **点击 OK 保存连接。**\n\n![image](img/9781119468387-fg050204.png)\n\n\
  [图 2-4:] 连接对话框。\n\n创建连接后，它将作为一个选项出现在主窗口中。\n\n![warning](img/warning.png) 如果你的 MySQL\
  \ 安装不是最新版本，当你连接时 Workbench 会显示一条警告信息，告知你某些功能将不受支持。点击 Anyway 按钮继续。\n\n当 Workbench\
  \ 建立连接时，会生成主窗口，如[图 2-5]所示\n\n![image](img/9781119468387-fg050205.png)\n\n[图 2-5:]\
  \ 管理窗口。\n\n主管理窗口由五个部分组成：\n\n* **Navigation:** 提供启动/停止服务器、监控客户端连接、管理用户账户、导出/导入数据、监控数据库和表的性能，以及从系统架构中添加、修改或删除数据库和表的链接。\n\
  * **Query1:** 直接向服务器提交 SQL 查询进行测试。\n* **SQL Additions:** 提供 SQL 语句在线帮助，显示你在 Query1\
  \ 面板中输入的 SQL 语句的上下文帮助。\n* **Information:** 显示从 Query1 面板中选的连接会话或单个对象的信息。\n* **Action\
  \ Output:** 显示你提交给服务器的任何操作的状态。\n\n当你从 Query1 面板提交查询（一组查询）时，Query1 面板下方会出现一个新面板，显示事务结果。如果事务是\
  \ `SELECT` 语句，数据集中的记录将以网格形式显示，如[图 2-6]所示。\n\n![image](img/9781119468387-fg050206.png)\n\
  \n\n\n\n\nFIGURE 2-6: 使用 MySQL Workbench 提交查询。\n\n在 Workbench 界面中，你可以执行与 MySQL 命令行界面相同的所有功能，但它带有华丽的图形化界面，让管理你的\
  \ MySQL 服务器变得轻而易举！\n\n### 使用 phpMyAdmin 工具\n\n对于操作 MySQL 服务器来说，最流行的图形化工具可能是基于 Web\
  \ 的 `phpMyAdmin` 工具。顾如其名，`phpMyAdmin` 工具是一个 PHP Web 应用程序，它与 MySQL 服务器建立接口，提供丰富的管理功能，且都以你可以从任何浏览器访问的网站形式呈现！\n\
  \n`phpMyAdmin` 工具已变得非常流行，它通常在许多 Apache/MySQL/PHP 软件包（如 `XAMPP`、`MAMP` 和 `LAMP`）中默认安装，并受到大多数虚拟主机公司的的支持。由于它是一个网站，要启动\
  \ `phpMyAdmin`，你需要打开浏览器并输入指向服务器上程序包的 URL。对于大多数安装情况，它就是 `http://localhost/phpmyadmin`。如果你必须将\
  \ Apache Web 服务器移动到备端口，则需要在 URL 中包含该端口：`http://localhost:8080/phpmyadmin`。\n\n取决于你的特定环境，`phpMyAdmin`\
  \ 软件包可能被配置为启动时自动登录 MySQL 服务器（例如在 `XAMPP` 中）。如果没有，你将看到一个登录表单，要求输入 MySQL 用户账户和密码。要获得完全访问，请使用\
  \ `root` 用户账户登录。当你登录 `phpMyAdmin` 后，你将看到如图 2-7 所示的主窗口。\n\n![image](img/9781119468387-fg050207.png)\n\
  \nFIGURE 2-7: `phpMyAdmin` 主窗口。\n\n`phpMyAdmin` 主窗口在窗口左侧显示服务器上现有的数据库。顶部是导航区域，允许你选择\
  \ 12 个选项：\n\n* `Databases`：创建和管理数据库。\n* `SQL`：直接向服务器提交 SQL 语句。\n* `Status`：显示连接、服务器进程和数据库查询的状态。\n\
  * `User accounts`：创建和管理用户账户。\n* `Export`：创建一个或多个数据库的备份。\n* `Import`：恢复一个或多个数据库。\n\
  * `Settings`：管理 `phpMyAdmin` 设置。\n* `Replication`：如果已创建，则控制主副本。\n* `Variables`：管理\
  \ MySQL 服务器配置设置。\n* `Charsets`：显示服务器可用的字符集。\n* `Engines`：显示服务器可用的存储引擎。\n* `Plugins`：显示为\
  \ `phpMyAdmin` 安装的插件。\n\n如你所见，`phpMyAdmin` 还让你拥有作为 MySQL 服务器管理员所需的所有服务器功能的完全访问权限，而且都是通过一个简单的\
  \ Web 界面实现！现在你已经看到了用于操作 MySQL 服务器的三个常用的管理员界面，接下来的章节将介绍如何使用每个界面进行一些数据库管理工作。\n\n##\
  \ 管理用户账户\n\n你在 MySQL 服务器中需要执行的基础管理功能之一是创建和维护用户账户。默认情况下，MySQL 服务器安装时带有一个用户账户 `root`，它对数据库服务器上的所有内容都有完全访问权限。在\
  \ Web 应用程序中使用账户访问数据库并不是一个好主意。如果你的应用程序被攻破，攻击者将获得对数据库服务器的完全访问，这绝对会让你的一天变得糟糕。本节将介绍如何使用这三个常用工具中的每一个来创建和管理\
  \ MySQL 用户账户。\n\n### 创建账户\n\n为每个使用 MySQL 服务器的 Web 应用程序创建一个单独的用户账户通常是一个好主意。这样，你可以限制每个用户账户仅访问应用程序所使用的单个数据库，有助于防止意外的访问和修改。具体操作取决于你选择使用什么界面来与\
  \ MySQL 服务器交互。\n\n#### 通过 MySQL 命令行\n\n从 MySQL CLI 管理用户账户需要你了解一些 SQL 语句。要创建一个新用户账户，使用\
  \ `CREATE USER` 语句。其基本格式如下：\n\n```sql\nCREATE USER username@location IDENTIFIED\
  \ BY 'password';\n```\n\n正如本微书的第 1 章所示，MySQL 服务器根据用户名和用户登录服务器的位置来跟踪用户权限。`CREATE\
  \ USER` 语句在定义中列出了这两个项目项。如果你想根据应用程序运行的位置为其授予不同的权限，可以创建不同的 `user@location` 组合。要创建一个新的\
  \ MySQL 服务器用户账户，请遵循以下步骤：\n\n1. 在你的操作系统环境中打开命令行界面。对于 Windows，那是 `Command Prompt`\
  \ 工具。对于 macOS，那是 `Terminal` 实用程序。\n2. 导航到包含 MySQL 服务器程序的文件夹。如果你在 Windows 上使用 `XAMPP`\
  \ 软件包，则命令是：\n   ```bash\n   cd \\xampp\\mysql\n   ```\n   对于 macOS，命令是：\n   ```bash\n\
  \   cd /Applications/XAMPP/mysql\n   ```\n3. 输入 `mysql` 命令启动 CLI，指定 `root` 用户：\n\
  \   ```bash\n   mysql --user root --password\n   ```\n   对于 macOS 环境，你可能需要在 `mysql`\
  \ 命令前加上 `./`。\n4. 在提示符处输入 `root` 用户密码。对于 `XAMPP`，密码为空，直接按回车。\n5. 在 `>` 提示符处，输入 `CREATE\
  \ USER` 语句创建一个账户：\n   ```sql\n   CREATE USER user1@localhost IDENTIFIED BY 'MyL0ngPss';\n\
  \   ```\n6. 输入 `exit` 离开 CLI。\n7. 退出命令行会。\n\n#### 使用 Workbench\n\n由于 MySQL Workbench\
  \ 是图形化工具，你不需要了解任何 SQL 语句即可创建账户。你可以通过填写表单从图形界面创建账户。按照以下步骤操作：\n\n1. 从你的工作站启动 `Workbench`\
  \ 工具。\n2. 选择连接到你的 MySQL 服务器的选项。\n3. 从 Workbench 主窗口，点击导航面板中 `Management` 下的 `Users\
  \ and Privileges` 链接。如图 2-8 所示，`Users and Privileges` 窗口出现了。注意窗口显示了服务器可用的用户账户列表。你应该看到你从命令行创建的\
  \ `user1` 账户，以及 `root` 用户账户的条目。\n4. 要添加新用户账户，点击窗口底部的 `Add Account` 按钮。\n5. 填写表单以指定新用户的登录名为\
  \ `user2`、主机位置为 `localhost`、密码为 `MyL0ngP@ss`。图 2-9 显示了这个过程。\n6. 点击窗口底部的 `Apply`\
  \ 创建用户账户。\n7. 完成后关闭 `MySQL Workbench` 工具。\n\n\n\n\n\n# 图 2-9： 使用 Workbench 创建新用户账户。\n\
  \n通过 Workbench 创建新用户账户的操作就此结束。\n\n## 使用 phpMyAdmin\n\n由于 `phpMyAdmin` 工具也是一个图形化界面，创建新用户账户与使用\
  \ Workbench 并没有太大区别，只是运行在 Web 环境中。请按照以下步骤使用 `phpMyAdmin` 创建新用户账户：\n\n1. **打开浏览器并输入\
  \ URL 以进入你环境的 `phpMyAdmin` 工具。**\n\n   如果你正在使用 XAMPP，请输入以下 URL：\n\n   `http://localhost:8080/phpmyadmin`\n\
  \n   根据你的 Web 服务器，你可能需要使用不同的 TCP 端口。\n\n2. **点击 `phpMyAdmin` 主 页面顶部的“User Accounts”（用户账户）按钮。**\n\
  \n   这将生成“用户账户概览”页面，如图图 2-10 所示。\n\n3. **要创建新用户账户，点击“New”（新建）部分中的“Add User Account”（添加用户账户）链接。**\n\
  \n   出现“添加用户账户”页面。\n\n4. **用户名处输入 `user3`。**\n\n5. **从“Host Name”（主机名）下拉列表中选择“Local”（本地）。**\n\
  \n6. **在密码表单字段中，输入 `MyL0ngP@ssword`。**\n\n   图 2-11 显示了这些条目的样式。\n\n7. **滚动到网页底部并点击“Go”（执行）按钮。**\n\
  \n8. **点击网页顶部的“User Accounts”按钮查看用户账户列表，以验证新用户账户。**\n\n9. **点击网页左侧的“Exit”（退出）图标关闭会话，然后关闭浏览器窗口。**\n\
  \n![image](img/9781119468387-fg050210.png)\n\n图 2-10： `phpMyAdmin` 中的用户账户概览窗口。\n\
  \n![image](img/9781119468387-fg050211.png)\n\n图 2-11： 在 `phpMyAdmin` 中输入新用户账户。\n\
  \n你可以看到，在 `phpMyAdmin` 环境中创建用户账户与 Workbench 环境并没有区别，因为它们都使用相似的图形界面来为你构建并提交 `CREATE\
  \ USER` SQL 语句！\n\n## 管理用户权限\n\n为你的 Web 应用程序创建用户账户后，你需要授予它使用支持该应用程序的数据库权限。作为安全功能的一部分，MySQL\
  \ 仅授予新用户账户登录服务器的权限——默认情况下，它们无法访问服务器上的任何数据。\n\n要解决这个问题，你需要使用 `GRANT` SQL 语句，可以使用\
  \ MySQL CLI 或你刚刚学会使用的那些高级图形化工具之一。`GRANT` 语句的基本格式为：\n\n`GRANT` `privileges` `ON`\
  \ `objects` `TO` `user``;`\n\n`privileges` 列表控制用户账户对 `objects` 列表中定义的数据库对象的访问权限。MySQL\
  \ 允许根据需要为用户账户授予尽可能或尽可能少的权限，从而对数据库访问提供非常精细的控制。表 2-3 列出了你可以使用的权限。\n\n| 权限 | 说明 |\n\
  | --- | --- |\n| `ALL` | 所有权限 |\n| `ALTER` | 修改数据库或表定义的能力 |\n| `ALTER ROUTINE` |\
  \ 修改或删除存储过程的能力 |\n| `CREATE` | 在数据库中创建新数据库或表的能力 |\n| `CREATE ROUTINE` | 创建新存储过程的能力\
  \ |\n| `CREATE TABLESPACE` | 创建新数据库存储区域的能力 |\n| `CREATE TEMPORARY TABLES` | 在数据库中创建临时表的能力\
  \ |\n| `CREATE USER` | 在服务器上创建、重命名或删除用户账户的能力 |\n| `CREATE VIEW` | 创建或更改数据库视图的能力\
  \ |\n| `DELETE` | 从表中删除数据的能力 |\n| `DROP` | 删除数据库或表的能力 |\n| `EVENT` | 在事件调度器中使用事件的能力\
  \ |\n| `EXECUTE` | 运行存储过程的能力 |\n| `FILE` | 允许服务器读取或写入文件的能力 |\n| `GRANT OPTION` |\
  \ 为其他用户添加或删除权限的能力 |\n| `INDEX` | 创建或删除表索引的能力 |\n| `INSERT` | 添加新数据的能力 |\n| `LOCK\
  \ TABLES` | 锁定表的能力 |\n| `PROCESS` | 查看进程的能力 |\n| `PROXY` | 使用代理的能力 |\n| `REFERENCES`\
  \ | 创建外键关系的能力 |\n| `RELOAD` | 强制刷新的能力 |\n| `REPLICATION CLIENT` | 客户端权限 |\n| `REPLICATION\
  \ SLAVE` | 启用复制的能力 |\n| `SELECT` | 查询数据的能力 |\n| `SHOW DATABASES` | 列出数据库 |\n| `SHOW\
  \ VIEW` | 列出视图 |\n| `SHUTDOWN` | 停止服务器 |\n| `SUPER` | 超级权限 |\n| `TRIGGER` | 创建触发器的能力\
  \ |\n| `UPDATE` | 修改数据的能力 |\n| `USAGE` | 登录服务器 |\n\nMySQL 有两种级别的权限：\n\n* **全局权限：**\
  \ 适用于所有数据库\n* **本地权限：** 适用于特定数据库\n\n要从 CLI 查看现有账户的全局权限，使用 `SHOW GRANTS` 语句，如图图 2-12\
  \ 所示。\n\n图 2-12： 显示全局权限。\n\n![image](img/9781119468387-fg050212.png)\n\n输出显示 `user1`只有\
  \ `USAGE` 全局权限，因此它可以登录数据库但无法访问任何数据。\n\n要向特定数据库授予权限，你必须在 `GRANT` 语句中列出权限以及特定数据库：\n\
  \n```\nGRANT SELECT ON phpmyadmin.* TO user1@localhost;\n```\n\n```\nQuery OK, 0\
  \ rows affected (0.00 sec)\nMariaDB [(none)]>\n```\n\n列表中的通配符表示权限适用于 `phpmyadmin`\
  \ 中的所有表。现在你可以使用 `user1` 用户账户登录并访问 `phpmyadmin` 数据库：\n\n```\nC:\\xampp\\mysql\\bin>mysql\
