  \n\n\n\n\n变异器（mutator）使用两个参数：要设置的属性名称以及分配给属性的值。神奇之处在于 PHP 使用变异器的方式。在你的 PHP 应用代码中，你实际上不需要调用\
  \ `__set()` 变异器方法。你只需要通过简单的赋值语句就可以定义 `$description` 属性：\n\n```php\n$prod1->description\
  \ = \"Carrots\";\n```\n\nPHP 会自动查找类中定义的 `__set()` 变异器方法并运行它，传递相应的属性名和值。\n\n即使 `$description`\
  \ 属性的可见性被设置为 `private`（私有），通过定义变异器魔法方法，你可以允许外部程序为该属性赋值。不过，使用变异器的好处是，你可以控制外部程序使用你为类定义的属性的方式。\n\
  \n通过变异器定义，你可以放置任何所需的控制属性特征的代码，例如允许的值范围或应用到属性的允许设置。例如，你可以像这样做：\n\n```php\npublic\
  \ function __set($name,$value) {\nif ($name == \"price\" && $value < 0) {\n$this->price\
  \ = 0;\n} else {\n$this->$name = $value;\n}\n}\n```\n\n这个示例检查正在设置的属性是否为 `$price`\
  \ 属性。如果是，它会检查值是否小于 0。如果值小于 0，则价格被设置为 0 而不是提供的数值。这为你提供了一种控制从使用类对象的外部程序设置价格值的方法。\n\
  \n### 定义访问器魔法方法（Accessor magic methods）\n\n访问器魔法方法是你用于访问在类中定义的私有属性值的方法。创建特殊方法来获取当前属性值，有助于为其他程序使用你的类对象建立标准。这些方法通常被称为\
  \ getter（get 器），因为它们获取（get）了属性的值。\n\n你使用特殊的 `__get()` 方法来定义访问器：\n\n```php\npublic\
  \ function __get($name) {\nreturn $this->$name;\n}\n```\n\n就这些了！访问器方法并不复杂；它们只是返回属性的当前值。要使用它们，你只需要像往常一样引用属性名：\n\
  \n```php\necho \"<p>Product: $prod1->description</p>\\n\";\n```\n\nPHP 会自动查找访问方法来获取属性值。按照以下步骤尝试创建并使用带有变异器和访问器的类定义：\n\
  \n1. **打开你的编辑器并输入以下代码：**\n\n```php\n<!DOCTYPE html>\n<html>\n<head>\n<title>PHP\
  \ OOP Test</title>\n</head>\n<body>\n<h1>Testing PHP OOP setters and getters</h1>\n\
  <?php\nclass Product {\nprivate $description;\nprivate $price;\nprivate $inventory;\n\
  private $onsale;\npublic function __set($name, $value) {\nif ($name == \"price\"\
  \ && $value < 0) {\necho \"<p>Invalid price set<p>\\n\";\n$this->price = 0;\n} elseif\
  \ ($name == \"inventory\" && $value < 0) {\necho \"<p>Invalid inventory set: $value</p>\\\
  n\";\n} else {\n$this->$name = $value;\n}\n}\npublic function __get($name) {\nreturn\
  \ $this->$name;\n}\npublic function buyProduct($amount) {\nif ($this->inventory\
  \ >= $amount) {\n$this->inventory -= $amount;\n} else {\necho \"<p>Sorry, invalid\
  \ inventory requested:\n$amount</p>\\n\";\necho \"<p>There are only $this->inventory\n\
  left</p>\\n\";\n}\n}\n}\n$prod1 = new Product();\n$prod1->description = \"Carrots\"\
  ;\n$prod1->price = 1.50;\n$prod1->inventory = 5;\n$prod1->onsale = false;\necho\
  \ \"<p>Just added $prod1->inventory $prod1->description</p>\\n\";\necho \"<p>Now\
  \ buying 4 carrots…<p>\\n\";\n$prod1->buyProduct(4);\necho \"<p>Inventory of $prod1->description\
  \ is now $prod1->inventory</p>\\n\";\necho \"<p>Trying to set carrot inventory to\
  \ -1:</p>\\n\";\n$prod1->inventory = -1;\necho \"<p>Now trying to buy 10 carrots…</p>\\\
  n\";\n$prod1->buyProduct(10);\necho \"<p>Inventory of $prod1->description is now\
  \ $prod1->inventory</p>\\n\";\n?>\n</body>\n</html>\n```\n\n2. **将文件保存为 `ooptest2.php`，并放在\
  \ Web 服务器的 `DocumentRoot` 文件夹中。**\n\n3. **确保 Web 服务器正在运行，并访问以下 URL：** `http://localhost/ooptest2.php`\n\
  \n\n\n\n你可以指定一个魔术方法，PHP 在从内存中移除实例之前会自动尝试运行该方法。这些方法被称为析构函数（`destructors`）。\n\n对于处理文件或数据库的类，析构函数非常有用，它可以确保在系统移除类实例之前，文件或数据库连接已正确关闭。这有助于防止由于会话未正常关闭而停止导致的数据损坏。\n\
  \n你使用 `__destruct()` 魔术方法来定义在 PHP 从内存中移除类实例之前处理的任何最终语句：\n\n```php\npublic function\
  \ __destruct() {\n    // statements\n}\n```\n\n`__destruct()` 方法不允许你向方法传递任何参数。你在方法中指定的所有语句都应该是自包含的，且不能依赖于主程序的任何数据。然而，它们可以依赖类中的属性，因为当类对象被移除时，这些属性应该是可用的。\n\
  \n你也可以使用 `unset()` 函数手动从内存中移除对象的实例：\n\n```php\nunset($prod1);\n```\n\n当你运行此命令时，PHP\
  \ 将为该实例处理 `Product` 类的析构函数。\n\n![warning](img/warning.png) 虽然 PHP 通常会在从内存中移除类实例的时候尝试处理类析构函数，但并不总是成功的。如果程序因致命错误而崩溃或停止，无法保证\
  \ PHP 能够运行析构方法代码。如果你的应用程序依赖于关闭打开的文件或数据库连接，那么在使用完成后使用 `unset()` 函数手动将对象从内存中移除是一个好主意！\n\
  \n### 复制对象\n\n你可以在 PHP 中复制对象，但不能使用标准的赋值语句。相反，你需要使用 `clone` 关键字：\n\n```php\n$prod1\
  \ = new Product(\"Carrot\", 1.50, 100);\n$prod2 = clone $prod1;\n```\n\n现在，变量 `$prod2`\
  \ 包含了 `Product` 类的第二个对象实例，其属性值与 `$prod1` 实例相同。\n\n但是，你可能会遇到这样的情况：即你不希望对象的拷贝与原始对象具有所有相同的属性值。要做到，你可以在类代码中重写\
  \ `__clone()` 魔术方法：\n\n```php\npublic function __clone() {\n    $this->price = 0;\n\
  \    $this->inventory = 0;\n    $this->onsale = false;\n}\n```\n\n通过此代码，当你克隆对象时，只有\
  \ `description` 属性会被复制；所有其他属性值都将被重置。\n\n### 显示对象\n\n很可能在你的应用程序的某个时刻，你希望在网页上显示对象的属性。然而，如果你尝试使用\
  \ `echo` 语句显示对象实例，你将得到来自 PHP 的一个相当难看的错误消息：\n\n```\nRecoverable fatal error: Object\
  \ of class Product could not be converted to string\n```\n\n你可以通过在类定义中定义 `__toString()`\
  \ 魔术方法来解决这个问题。\n\n`__toString()` 魔术方法定义了当你尝试将对象作为字符串值使用（例如在 `echo` 语句中）时 PHP 如何处理属性。你只需要从属性构建字符串并将输出存储在变量中。然后使用\
  \ `return` 语句将输出变量返回主程序。代码看起来如下：\n\n```php\npublic function __toString() {\n   \
  \ $output = \"<p>Product: \" . $this->description . \"<br>\\n\";\n    $output .=\
  \ \"Price: $\" . number_format($this->price,2) . \"<br>\\n\";\n    $output .= \"\
  Inventory: \" . $this->inventory . \"<br>\\n\";\n    $output .= \"On sale: \";\n\
  \    if ($this->onsale) {\n        $output .= \"Yes</p>\\n\";\n    } else {\n  \
  \      $output .= \"No</p>\\n\";\n    }\n    return $output;\n}\n```\n\n定义了 `__toString()`\
  \ 魔术方法后，你现在可以像任何变量一样在 `echo` 语句中使用 `Product` 类的实例了：\n\n```php\necho $prod1;\n```\n\
  \n你将在网页中获得以下输出：\n\n```\nProduct: Carrots\nPrice: 1.50\nInventory: 10\nOn sale: No\n\
  ```\n\n有了 `__toString()` 魔术方法，在网页中显示你的类对象就像显示任何其他类型的变量值一样简单！\n\n### 加载类\n\n在本章开头，我提到\
  \ OOP 有助于在多个应用程序中轻松复用程序代码。当你为一个应用程序创建了 `Product` 类后，你可以在任何使用产品的应用程序中使用相同的代码来使用 `Product`\
  \ 类。\n\n然而，在每个使用它的应用程序中重新输入整个 `Product` 类代码定义可能是相当乏味的，特别是对于复杂的类来说。为了解决这个问题，你可以使用我们的朋友\
  \ `include()` 函数。\n\n只需将你的类定义保存在单独的 PHP 代码文件中；然后在任何使用这些类定义的代码中使用 `include()` 函数来包含这些文件。这使你能够包含应用程序所使用的类文件，而无需重新输入整个类代码定义！这很好，但可能仍然存在缺点。\n\
  \n复杂的应用程序可能会使用几十甚至数百个单独的类对象管理和操作应用程序中的数据。列出每个类的包含文件仍然可能是相当乏味的，而且容易出现拼写错误导致\n\n\n\
  \n\n```php\n    } else {\n        echo \"<p>Sorry, invalid inventory requested:\
  \ $amount</p>\\n\";\n        echo \"<p>There are only $this->inventory left</p>\\\
  n\";\n    }\n    }\n\n    public function putonsale() {\n        $this->onsale =\
  \ true;\n    }\n\n    public function takeoffsale() {\n        $this->onsale = false;\n\
  \    }\n}\n?>\n```\n\n2. **将文件保存为** `Product.inc.php` **（注意大小写），并于 Web 服务器的 `DocumentRoot`\
  \ 文件夹中。**\n\n3. **在编辑器中打开一个新标签页或窗口并输入以下代码：**\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<title>PHP Total OOP Test</title>\n</head>\n<body>\n<h1>Testing the PHP\
  \ class</h1>\n<?php\nspl_autoload_register(function($class) {\n    include $class\
  \ . \".inc.php\";\n});\n$prod1 = new Product(\"Carrots\", 4.00, 10, false);\necho\
  \ \"<p>Creating one product:</p>\\n\";\necho $prod1;\n$prod2 = new Product(\"Eggplant\"\
  , 2.00, 5, true);\necho \"<p>Creating one product:</p>\\n\";\necho $prod2;\necho\
  \ \"<p>Putting $prod1->description on sale:</p>\\n\";\n$prod1->price = 3.00;\n$prod1->putonsale();\n\
  echo \"<p>New product status:</p>\\n\";\necho $prod1;\n?>\n</body>\n</html>\n```\n\
  \n4. **将文件保存为** `ooptest3.php` **并于 Web 服务器的 `DocumentRoot` 文件夹中。**\n\n5. **确保 Web\
  \ 服务器正在运行，然后打开浏览器并输入以下 URL：**\n\n`http://localhost:8080/ooptest3.php`\n\n6. **完成后关闭浏览器窗口。**\n\
  \n当你运行 `ooptest3.php` 文件时，你应该应该看到图 5-3 所示的输出。\n\n![image](img/9781119468387-fg040503.png)\n\
  \n图 5-3： `ooptest3.php` 程序的输出。\n\n该代码将 `Product` 类定义代码保存在 `Product.inc.php` 文件中，然后使用自动加载器功能在需要时加载\
  \ `Product` 类的包含文件。它使用构造函数实例化了两个 `Product` 类对象并将它们显示在网页上。\n\n随后，代码使用类的变变器（mutator）更改了\
  \ `$prod1` 对象的价格，并使用 `putonsale()` 方法将产品上市。代码以 `echo` 语句结束，你可以看到对类对象所做的更改。现在事情真的开始变得高级了！\n\
  \n![warning](img/warning.png) 在命名类包含文件时要务必小心。如果你使用的服务器对文件名大小写敏感（例如 Linux 或 macOS），则包含的文件名必须与类名的大小写一致。\n\
  \n## 扩展类\n\n不，我不是在说让你留校加班！OOP 提供了一种通过向现有类中添加额外成员来扩展现有类的方法。这就是 OOP 的全部妙处所在：你可以直接获取类并使用它们，也可以只修改你需要的部分以适应你的特定应用程序。\n\
  \n定义一个作为另一个类扩展的新类被称为*继承*（inheritance）。新类（称为*子类*）从原始类（称为*父类*）继承所有的公共或受保护的成员。然后你可以向子类添加新的成员，并甚至可以重写父类的成员。如果你使用了重写的成员，子类的的优先级将高于父类成员。\n\
  \n![warning](img/warning.png) 标记为 `private` 可见性的成员不会被子类继承。如果你想让子类继承属性但不想让它们对外部程序可见，请使用\
  \ `protected` 可见性设置。\n\n要创建一个子类，你使用标准的类定义格式，配合 `extends` 关键字以及你正在扩展的类名：\n\n```php\n\
  class Soda extends Product {\n```\n\n为了让新类 `Soda` 继承 `Product` 类的属性，你需要将属性的可见性更改为\
  \ `protected`：\n\n```php\nclass Product {\n    protected $description;\n    protected\
  \ $price;\n    protected $inventory;\n    protected $onsale;\n    …\n```\n\n将属性设置为\
  \ `protected` 可见性后，`Soda` 子类将自动继承 `Product` 类的 `description`、`price`、`inventory`\
  \ 和 `onsale` 属性以及所有的 `protected` 方法。\n\n按照以下步骤测试 OOP 中的继承：\n\n1. **在编辑器中打开 `Product.inc.php`\
  \ 文件。**\n\n2. **将 `private` 可见性改为 `protected`。** 查找这些行：\n   `private $description;`\n\
  \   `private $price;`\n   `private $inventory;`\n   `private $onsale;`\n   并将它们更改为：\n\
  \   `protected $description;`\n   `protected $price;`\n   `protected $inventory;`\n\
  \   `protected $onsale;`\n\n3. **保存文件。**\n\n4. **在编辑器中打开一个新标签页或窗口，并输入以下代码：**\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Testing PHP Inheritance</title>\n\
  </head>\n<body>\n<h1>Testing inheritance in PHP OOP</h1>\n<?php\ninclude(\"Product.inc.php\"\
  );\n\nclass Soda extends Product {\n    private $ounces;\n\n    public function\
  \ __construct($name, $value, $amount, $sale, $size) {\n        parent::__construct($name,\
  \ $value, $amount, $sale);\n        $this->ounces = $size;\n    }\n\n    public\
  \ function __toString() {\n        $output = \"<p>Product: \" . $this->description\
  \ . \"<br>\\n\";\n        $output .= \"Price: $\" . number_format($this->price,2)\
  \ . \"<br>\\n\";\n        $output .= \"Inventory: \" . $this->inventory . \"<br>\\\
  n\";\n        $output .= \"On sale: \";\n        if ($this->onsale) {\n        \
  \    $output .= \"Yes<br>\\n\";\n        } else {\n            $output .= \"No<br>\\\
  n\";\n        }\n        $output .= \"Ounces: \" . $this->ounces . \"</p>\\n\";\n\
  \        return $output;\n    }\n\n    public function restock($amount) {\n    \
  \    $this->inventory += $amount;\n    }\n}\n?>\n</body>\n</html>\n```\n\n5. **将文件保存为**\
  \ `Soda.inc.php` **并于 Web 服务器的 `DocumentRoot` 文件夹中。**\n\n6. **在编辑器中再打开另一个新标签页或窗口，并输入以下代码：**\n\
  \n（此处代码已在步骤 4 中提供，此处为不重复，实际操作中应输入对应的 HTML 代码）\n\n在 `Soda` 类定义内部，`parent::__construct`\
  \ 通知 PHP 运行父构造函数。注意 `ounces` 是子类特有的。`restock()` 方法使用了父类的 `inventory` 属性。\n\n\n\n\
  \n\n```php\necho \"<p>Buying 6 bottles:</p>\\n\";\n$prod1->buyProduct(6);\necho\
  \ $prod1;\necho \"<p>Restocking 4 bottles:</p>\\n\";\n$prod1->restock(4);\necho\
  \ $prod1;\n?>\n</</body>\n</</html>\n```\n\n7. **将此文件保存为** `ooptest4.php` **位于 Web\
  \ 服务器的** `DocumentRoot` **文件夹中。**\n\n8. **确保 Web 服务器正在运行，然后打开浏览器并输入以下 URL：**\n\n\
  `http://localhost:8080/ooptest4.php`\n\n9. **关闭浏览器并停止 Web 服务器。**\n\n当你运行 `ooptest4.php`\
  \ 代码时，你应该能看到如图 5-4 所示的输出。\n\n![image](img/9781119468387-fg040504.png)\n\n图 5-4：\
  \ `ooptest4.php` 程序的输出。\n\n`Soda` 类代码重写了父类 `Product` 的构造函数和 `__toString()` 方法，以适应额外的\
  \ `$ounces` 属性。`ooptest4.php` 代码创建了 `Soda` 类实例，使用父类的 `buyProduct()` 方法购买瓶，然后使用子类的\
  \ `restock()` 方法进行补货。注意，子类对象可以访问父类的公共 `buyProduct()` 方法。\n\n# 第 6 章\n\n# 会话与购物车\n\
  \n本章内容\n\n![check](img/check.png) **存储数据**\n\n![check](img/check.png) **使用 Cookie**\n\
  \n![check](img/check.png) **处理会话**\n\n![check](img/check.png) **玩转购物车**\n\n在本迷你书的之前的几个章节中，我向你展示了如何使用\
  \ HTTP `GET` 和 `POST` 方法将数据从一个网页发送到另一个网页。虽然它们在点击链接和提交表单时运行良好，但要在应用程序中的所有网页之间共享数据，它们并不实用。这需要其他形式的持久化数据，即一个你可以临时存储数据的地方，以便你的\
  \ PHP 程序可以从任何页面随时访问这些数据。这就是会话（sessions）和购物车（carts）大显身场的地方。章将解释它们是如何工作的，为什么你不应该害怕它们，以及如何将它们作为动态\
  \ Web 应用程序的另一个部分。\n\n## 存储持久化数据\n\n大多数动态 Web 应用程序都需要在访问者浏览应用程序网页时临时存储数据的方法。我说的不是数据的长期存储（我将在下一个迷你书中介绍这一点）。我指的是短期数据存储，即一个网页存储而另一个网页检索的数据，例如通过网站传递已身份验证用户的信息。这有助于你的应用程序跟踪网站访问者以及他们在应用程序中的操作。\n\
  \n这就是 HTTP Cookie 发挥作用的地方。Cookie 在网络世界中一直有些名誉记录，主要是因为人们对公司使用它们的方式存在误解。公司无法通过 Cookie\
  \ 跟踪所有的浏览历史，但它可以跟踪你访问了它的哪些广告。这有助于营销大师们根据你已经访问过的公司链接向你的浏览器投放广告。Cookie 在动态 Web 应用程序工具的流水线上确实有其价值，在跟踪应用程序中的单个网站访问者方面起着至关重要的作用。了解它们如何工作以及如何使用它们至关重要。\n\
  \n本节将介绍 Cookie 的基础知识、为什么你需要它们，以及如何在你的动态 Web 应用程序中安全且负责任地使用它们。\n\n### HTTP Cookie\
  \ 的用途\n\n在大型机世界中，需要访问系统运行程序的人必须首先登录系统。这通常需要输入某些可以唯一识别你身份的数据，例如输入用户 ID、将手指放在扫描仪上，或插入包含唯一加密密钥的智能\
  \ ID 卡。当系统验证你确实是你所说的人时，它将允许你访问系统和你的数据。这个过程启动了所谓的 `session`（会话）。\n\n大型机会跟踪你在 `session`\
  \ 中执行的每项交易。系统管理员可以查看日志文件并识别在系统上执行每项交易的用户。\n\n当你完成交易输入后，必须注销系统以停止 `session`。如果你忘记注销，另一个用户就可以进来并输入新交易，而大型机会将这些交易记在你的\
  \ `session` 下。\n\n在大型机系统中，跟踪 `sessions` 是很容易的，因为每个用户都从特定的设备（直接连接的终端或持久网络连接）登录、执行交易然后注销。遗憾的是，在我们的动态\
  \ Web 应用程序中，没那么简单。\n\nHTTP 标准旨在以一种匿名、无状态的方式从远程服务器检索数据。这意味着不需要处理 `session` 的形式化操作。本质上，一个\
  \ Web 会话由单次交易组成，它甚至不需要 ID 来识别用户。\n\n动态 Web 应用程序是这两种环境的混合体。你想保持匿名的便利性，但又需要像会话一样跟踪用户。这就是\
  \ Cookie 救场的地方。\n\n`Cookies` 是服务器临时存储在浏览器中的数据。当服务器存储 Cookie 时，可以在未来的任何时候检索它，直到 Cookie\
  \ 过期。这就是真正的会话开始。\n\n### Cookie 的类型\n\n在你开始思考巧克力片和葡萄干 Cookie 之前，让我先说明我们指的不是那些 Cookie。Cookie\
  \ 有几种不同的特征，每种特征定义了使用 Cookie 的不同方式。表格 6-1](#26_9781119468387-bk04ch06.xhtml_c19-tbl-0001)\
  \ 列出了你可以使用的类型。\n\n| **类型** | **描述** |\n| --- | --- |\n| `HttpOnly` | 只能通过 HTTP 访问，无法通过\
  \ JavaScript |\n| `Persistent` | 在特定日期/时间或经过特定时长后过期 |\n| `SameSite` | 仅从与目标域名相同的请求中发送\
  \ |\n| `Secure` | 仅在 HTTPS 连接中发送 |\n| `Session` | 在浏览器窗口关闭时过期 |\n| `Supercookie`\
  \ | 使用顶级域名作为源，允许多个网站访问 |\n| `Third-party` | 使用与网页 URL 域名不匹配的域名 |\n\n标准的 Cookie 类型是持久\
  \ Cookie（persistent cookie）。持久 Cookie 由 Web 服务器发送，并存储在客户端浏览器中一段时间。你的应用程序可以将数据存储在持久\
  \ Cookie 中，并在过期前的未来的任何时候访问该数据。\n\n与持久 Cookie 相，会话 Cookie（session cookies）的持续时间取决于客户端浏览器窗口开启的时间。当访问者关闭浏览器窗口时，会话\
  \ Cookie（及其包含的数据）就会消失。\n\n第三方 Cookie（third-party cookies）让 Cookie 声誉不佳。通过持久 Cookie\
  \ 和会话 Cookie，Web 服务器只能检索和读取它设置的 Cookie —— 它无法访问由其他服务器设置的 Cookie。这通过防止单个服务器确定访问者访问过的所有网站，来保护网站访问者的隐私。第三方\
  \ Cookie 利用漏洞绕过了这一点。\n\n\n\n\n\n如今，网页包含来自其他网站的嵌入广告已非常常见。这些嵌入广告运行远程网站创建的代码，并可以设置远程网站的\
  \ Cookie，从而存储嵌入广告所在主网站的位置。这使得公司可以在多个常用网站上购买广告空间，然后通过追踪其在广告中设置的 Cookie，确定哪些网站访问者访问过哪些网站。这可真阴险！\n\
  \n![tip](img/tip.png) 大多数现代浏览器允许你独立于会话 Cookie 或持久性 Cookie 阻塞第三方 Cookie，这允许你使用 Cookie\
  \ 进行正常操作，但阻止试图跟踪你网站历史的第三方 Cookie。\n\n### Cookie 的剖析\n\nHTTP 标准定义了 Web 服务器如何在与客户端浏览器的\
  \ HTTP 会话中设置和检索 Cookie。当客户端浏览器请求查看服务器上的某个网页时，它会发送一个 HTTP `GET` 请求：\n\n```\nGET /index.php\n\
  Host: www.myserver.com\n```\n\n该请求指定了要检索的网页以及检索它的主机机（通常是发送请求的同一台服务器）。主机服务器返回 HTTP\
  \ 响应，其中包含请求的状态码，以及它想要通过 `Set-Cookie` 语句设置的任何 Cookie，然后是请求网页的 HTML 内容：\n\n```\nHTTP/1.0\
  \ GET OK\nContent-type: text/html\nSet-Cookie: `name1`=`value1`; `attributes`\n\
  Set-Cookie: `name2`=`value2`; `attributes`\nWeb page HTML content\n```\n\nCookie\
  \ 信息出现在所请求网页的 HTML 之前。服务器为每个 Cookie 分配一个唯一的名称和值，并可能添加定义 Cookie 类型的可选属性。客户端浏览器将每个\
  \ Cookie 存储为客户端工作站上的单独临时文件。\n\n`Set-Cookie` 语句可以列出 Cookie 的一个或多个可选属性。[表 6-2] 列出了你可以设置的\
  \ Cookie 属性。\n\n| 属性 | 说明 |\n| --- | --- |\n| `Domain=`site` | 指定 Cookie 适用的域名。如果省略，则服务器为默认位置。\
  \ |\n| `Expires=`datetime` | 以 HTTP 时间戳值指定 Cookie 的过期日期。 |\n| `HttpOnly` | 指定 Cookie\
  \ 只能在 HTTP 会话中检索。 |\n| `Max-Age=`number` | 以秒为单位指定 Cookie 的过期时间。 |\n| `Path=`path`\
  \ | 指明 URL 中必须在请求资源中存在的路径。 |\n| `SameSite=`setting` | 指定 Cookie 是否仅能从设置它的相同站点访问。值为\
  \ `Strict` 或 `Lax`。 |\n| `Secure` | 指定 Cookie 只能在 HTTPS 安全会话中发送。 |\n\n[表 6-2] HTTP\
  \ Cookie 属性\n\n如果设置了 `Expires` 或 `Max-Age` 属性之一，则该 Cookie 是持久性 Cookie。它将一直有效直到过期日期和/或时间。如果没有指定任何属性，该\
  \ Cookie 就是会话 Cookie，并在客户端浏览器窗口关闭时被删除。\n\n`Expires` 属性指定了 Cookie 过期的精确日期和时间：\n\n\
  ```\nSet-Cookie: id=25; Expires=Mon 12 May 2025 13:30:00 GMT;\n```\n\n`Max-Age`\
  \ 属性设置了 Cookie 应保持有效的持续时间（秒）：\n\n```\nSet-Cookie: id=25; Max-Age=3600\n```\n\n服务器设置\
  \ Cookie 后，当客户端浏览器下一次从同一目标请求网页时，它将使用 HTTP 请求中的单个 `Cookie` 语句发送从该目标设置的所有 Cookie：\n\
  \n```\nGET /index.php\nHost: www.myserver.com\nCookie: `name1=value1`; `name2=value2`\n\
  ```\n\n`Cookie` 语句仅发送由该服务器设置的所有 Cookie 的名称/值对。它不会发送服务器为这些 Cookie 设置的任何属性。服务器随后可以提取出单独的\
  \ Cookie 名称和值，并将它们传递给任何服务器端编程语言（例如你的 PHP 程序）。\n\n### Cookie 规则\n\n总的来说，浏览器对 Cookie\
  \ 的实现在某种程度上是非标准的。没有两个客户端浏览器会以相同的方式处理 Cookie。然而，HTTP 标准规定了一些最低要求：\n\n* 浏览器必须支持大小高达\
  \ 4,096 字节的 Cookie。\n* 浏览器必须对每个网站至少支持 50 个 Cookie。\n* 浏览器必须能够总存储至少 3,000 个 Cookie。\n\
  \n大多数浏览器都超过了这些要求，但最好不要在应用程序中测试这些限制。如果你需要为应用程序存储大量数据，最好使用其他类型的持久化数据存储方式，例如数据库。你可以使用\
  \ Cookie 存储一个识别网站访问者的键，然后使用该键引用存储与该访问者相关的大量数据。\n\n![warning](img/warning.png) 使用会话\
  \ Cookie 时要小心。在浏览器世界中，关于如何处理会话仍然存在一些争议。\n\n## PHP 和 Cookie\n\nPHP 允许你与 Cookie 完全交互。你可以从一个网页设置\
  \ Cookie，在另一个网页中检索并读取它们，并在另一个网页中删除它们。本节将介绍在 PHP 中实现 Cookie 需要的代码。\n\n### 设置 Cookie\n\
  \nPHP 使用 `setcookie()` 函数来设置新 Cookie 并更新现有 Cookie。以下是 `setcookie()` 函数的基本格式：\n\n\
  ```\nsetcookie(name, value, expire, path, domain, secure, httponly)\n```\n\n唯一的参数是\
  \ Cookie 的名称，尽管你几乎总是想要包含 Cookie 值。省略值将把 Cookie 值设置为 `NULL`。\n\n可选的 `expire` 参数允许你通过\
  \ Unix 时间戳指定过期日期和时间，使其成为持久性 Cookie。Unix 时间戳格式是自 1970 年 1 月 1 日以来的秒数整数值。最后四个参数允许你指定允许访问\
  \ Cookie 的路径和域名，以及 Cookie 是否应该被设置为 `Secure` 或 `HttpOnly`。\n\n小心 `expire` 参数。尽管 HTTP\
  \ 消息以完整的日期和时间发送过期属性，但使用 `setcookie()` 函数时，你使用的是时间戳设置它，而不是标准的日期和时间。大多数 PHP 开发者这样做的方法是在从\
  \ `time()` 函数获取的当前日期时间加上秒数：\n\n```php\nsetcookie(\"test\", \"Testing\", time() +\
  \ (60*60*24*10));\n```\n\n这会将名为 `test` 的 Cookie 设置为在访问者访问网页十天后过期。\n\n![warning](img/warning.png)\
  \ 由于 Cookie 是 HTTP 消息的一部分，而不是 HTML 数据的一部分，你必须在发送任何 HTML 内容（包括起始的 `<!DOCTYPE>` 标签）之前设置\
  \ Cookie。不过，这有一个例外。如果启用了 PHP 的 `output_buffer` 设置，PHP 服务器将先将程序的所有输出发送到缓冲区中。然后，当缓冲区满或程序结束时，它会重新排列缓冲区中的数据，将\
  \ HTTP 消息放在前面，然后将数据发送到客户端浏览器。\n\n按照以下步骤测试从 PHP 应用程序设置持久性 Cookie：\n\n\n\n\n\n1. **打开你喜欢的文本编辑器、程序编辑器或集成开发环境\
  \ (IDE) 包。**\n\n2. **在编辑器窗口中输入以下代码：**\n\n```php\n<?php\nsetcookie(\"test1\", \"\
  This is a test cookie\", time() + 600);\n?>\n<!DOCTYPE html>\n<html>\n<head>\n<title>PHP\
  \ Cookie Test</title>\n</head>\n<body>\n<h1>Trying to set a cookie</h1>\n</body>\n\
  </html>\n```\n\n3. **将文件保存为 `cookietest1.php`，并将其存于 Web 服务器的 `DocumentRoot` 文件夹中。**\n\
  对于 Windows 上的 XAMPP，该路径为 `c:\\xampp\\htdocs`；对于 macOS 上的 XAMPP，路径为 `/Applications/XAMPP/htdocs`。\n\
  \n4. **启动 XAMPP 控制面板，然后启动 Apache Web 服务器。**\n\n5. **打开浏览器并输入以下 URL：**\n`http://localhost:8080/cookietest1.php`\n\
  你可能需要更改 TCP 端口号以匹配你的 Web 服务器。\n\n6. **使用浏览器的开发者工具，检查从网页设置的 cookie 及其过期时间。**\n你应该能看到创建的\
  \ `test1` cookie。它应该被设置为在十分钟后过期。\n\n7. **完成后关闭浏览器窗口。**\n\n开发者工具允许你查看程序设置的 `test1`\
  \ cookie。对于 Microsoft Edge 浏览器，请在“调试器”（Debugger）部分查找 cookie，如图 6-1 所示。\n\n![image](img/9781119468387-fg040601.png)\n\
  图 6-1： 在 Microsoft Edge 开发者工具窗口中显示 cookie。\n\nCookie 已设置，并包含了其值，过期时间被设置为未来的十分钟（600\
  \ 秒）。\n\n![warning](img/warning.png) **警告：**你必须将 `setcookie()` 函数行放置于网页中 `<html>`\
  \ 部分之前。否则，你将收到错误消息。Web 服务器必须在发送任何 HTML 内容之前在 HTTP 会话中发送任何 cookie 数据。\n\n### 读取 cookie\n\
  \nPHP 让读取应用程序设置的 cookie 变得轻而异常。PHP 服务器会自动将从客户端传递的所有 cookie 放入 `$_COOKIE[]` 特殊数组变量中。你在\
  \ `setcookie()` 语句中分配的 cookie 名称将成为关联数组的键：\n\n`$_COOKIE['name']`\n\n如果 cookie 已过期，当你尝试使用\
  \ `$_COOKIE[]` 数组变量访问它时，会收到错误消息。良好的做法是始终使用 `isset()` 函数检查 cookie 是否存在：\n\n```php\n\
  if (isset($_COOKIE['test'])) {\n  $data = $_COOKIE['test'];\n} else {\n  $data =\
  \ 0;\n}\n```\n\n如果 cookie 不存在，此代码会将程序中使用的 `$data` 变量值设置为 `0`。然后你就可以通过检查变量是否为 `0`\
  \ 条件来判断 cookie 是否缺失。\n\n按照以下步骤测试读取你在 `cookietest1.php` 程序中设置的 cookie：\n\n1. **打开编辑器，并输入以下代码：**\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>PHP Cookie Test</title>\n</head>\n\
  <body>\n<h1>Retrieving the test cookie</h1>\n<?php\nif (isset($_COOKIE['test1']))\
  \ {\n  $data = $_COOKIE['test1'];\n  echo \"<p>The cookie was set: $data</p> \\\
  n\";\n} else {\n  echo \"<p>Sorry, I couldn't find the cookie</p> \\n\";\n}\n?>\n\
  </body>\n</html>\n```\n\n2. **将文件保存为 `cookietest2.php`，并将其存于你 Web 服务器的 `DocumentRoot`\
  \ 文件夹中。**\n\n3. **确保 Web 服务器正在运行，然后打开浏览器并输入以下 URL：**\n`http://localhost:8080/cookietest2.php`\n\
  \n4. **测试完成后关闭浏览器。**\n\n如果你在运行 `cookietest1.php` 程序后的十分钟内运行 `cookietest2.php` 程序，你应该能看到存储在\
  \ cookie 中的数据出现在网页上和浏览器开发者工具中，如图 6-2 所示。\n\n![image](img/9781119468387-fg040602.png)\n\
  图 6-2： `cookietest2.php` 代码显示 cookie 数据的结果。\n\n如果你等待的时间了 cookie 十分钟的过期时间，你将收到程序找不到\
  \ cookie 的消息。\n\n### 修改和删除 cookie\n\n你可以通过重新发送带有更新值的 cookie 来轻松修改现有的 cookie：\n`setcookie(\"\
  test1\", \"New data\", time() + 600);`\n\n当你重新发送 cookie 时，浏览器会用新信息覆盖原始 cookie 信息，包括更新后的过期时间。如果你指定了一个相对于当前时间的时间，这将更改\
  \ cookie 的过期时间。\n\n要删除 cookie，只需将过期时间设置为过去的一个时间值：\n`setcookie(\"test1\", \"\", time()\
  \ – 1);`\n\n当你将过期时间设置为比当前时间早一秒时，浏览器将立即使 cookie cookie。\n\n按照以下步骤测试设置和移除 cookie：\n\
  \n1. **打开编辑器并输入以下代码：**\n\n```php\n<?php\nif (!isset($_COOKIE['test1'])) {\n  setcookie(\"\
  test1\", \"This is a test cookie\", time() + 600);\n} else {\n  setcookie(\"test1\"\
  , \"\", time() - 1);\n}\n?>\n<!DOCTYPE html>\n<html>\n<head>\n<title>Deleting a\
  \ Cookie</title>\n</head>\n<body>\n<h1>Cookie status</h1>\n<?php\nif (isset($_COOKIE['test1']))\
  \ {\n  $data = $_COOKIE['test1'];\n  echo \"<p>Cookie set: $data</p> \\n\";\n} else\
  \ {\n  echo \"<p>Cookie not set</p> \\n\";\n}\n?>\n<a href=\"cookietest3.php\">Click\
  \ try again</a>\n</body>\n</html>\n```\n\n2. **将文件保存为 `cookietest3.php`，并将其存于你 Web\
  \ 服务器的 `DocumentRoot` 文件夹中。**\n\n3. **打开浏览器并输入以下 URL：**\n`http://localhost:8080/cookietest3.php`\n\
  \n4. **注意 cookie 是否已设置，然后点击“重试”（Try Again）链接重新加载页面。**\n你可以继续点击链接来切换 cookie 的开启。\n\
  \n5. **完成后关闭浏览器窗口。**\n\n## PHP 与会话 (Sessions)\n\nPHP 处理会话和 cookie 的方式略有不同。PHP 不是将会话\
  \ cookie 作为独立的数据文件存储在客户端浏览器中，而是为每个访问会话分配一个唯一的 ID，并作为会话 cookie 存储在客户端浏览器中。\n\nPHP\
  \ 将与会话相关的任何数据存储在实际 PHP 服务器上的临时文件中。这有助于保护会话数据，因为它们没有存储在客户端浏览器中。\n\n### 启动会话\n\n在读取任何会话数据之前，必须启动会话。PHP\
  \ 为你提供了一种简单的方法在网页中声明会话。PHP `session_start()` 函数会自动向远程客户端浏览器发送所需的 HTTP 代码以创建会话 cookie。\n\
  \n\n\n\n\n```\nsession_start();\n\n?>\n\n<!DOCTYPE html>\n<html\n```\n\n你必须在每个需要访问会话（session）数据的\
  \ 页面开头添加 `session_start()` 函数。如果不存在 `session_start()` 函数，PHP 将不会查找会话 ID，你的应用程序将无法访问任何会话数据。\n\
  \n![warning](img/warning.png) 在使用 `session_start()` 函数时，不要在起始 `<?php` 标签之前放置任何 HTML\
  \ 注释行、空行，甚至是一个空格。任何出现在起始 `<?php` 标签之前的文本都将作为 HTML 代码发送到客户端浏览器。随后，你会在尝试发送会话数据时收到错误消息。\n\
  \n### 存储和检索会话数据\n\n在使用 `session_start()` 函数初始化会话后，你可以使用 `$_SESSION[]` 数组变量在应用程序中设置和检索会话数据。要设置新值，只需在赋值语句中定义它即可：\n\
  \n```\n$_SESSION['item'] = \"computer\";\n```\n\n使用会话 cookie 名称作为关联数组的键。当你设置了会话\
  \ cookie 名称/值对时，可以在同一会话的任何 页面中随时访问它：\n\n```\necho \"You purchased a \" . $_SESSION['item'];\n\
  ```\n\n按照以下步骤测试设置和读取会话 cookie 数据：\n\n1. **打开你的编辑器并输入以下代码：**\n\n```\n<?php\nsession_start();\n\
  \n?>\n<!DOCTYPE html>\n<html>\n<head>\n<title>Testing Session Cookies</title>\n\
  </head>\n<body>\n<h1>Setting a session cookie</h1>\n<?php\n$_SESSION['test2'] =\
  \ \"Second test cookie\";\n?>\n<a href=\"sessiontest2.php\">Click to continue</a>\n\
  </body>\n</html>\n```\n\n2. **将文件保存为** `sessiontest1.php` **并存放在你 Web 服务器的** `DocumentRoot`\
  \ **文件夹中。**\n\n3. **在编辑器中打开新标签页或窗口，并输入以下代码：**\n\n```php\n<?php\nsession_start();\n\
  \n?>\n<!DOCTYPE html>\n<html>\n<head>\n<title>Testing Session Cookies</title>\n\
  </head>\n<body>\n<h1>Retrieving the session cookie</h1>\n<?php\nif (isset($_SESSION['test2']))\
  \ {\n$data = $_SESSION['test2'];\necho \"<p>Session cookie: $data</p>\\n\";\n} else\
  \ {\necho \"<p>Error accessing the session\ncookie</p>\\n\";\n}\n?>\n<a href=\"\
  sessiontest1.php\">Go back to start</a>\n</body>\n</html>\n```\n\n4. **将文件保存为**\
  \ `sessiontest2.php` **并存放在你 Web 服务器的** `DocumentRoot` **文件夹中。**\n\n5. **确保 Web\
  \ 服务器已启动，然后打开浏览器并输入以下 URL：**\n\n```\nhttp://localhost:8080/sessiontest1.php\n```\n\
  \n6. **点击“Click to Continue”链接跳转到第二个测试页面。**\n\n7. **关闭浏览器窗口。**\n\n8. **重新打开浏览器窗口，直接跳转到以下\
  \ URL：**\n\n```\nhttp://localhost:8080/sessiontest2.php\n```\n\n9. **在测试结束关闭浏览器。**\n\
  \n当你打开 `sessiontest1.php` 页面时，PHP 代码会启动一个会话，然后保存测试会话 cookie 值。如果你使用浏览器的开发者工具，你会发现网页并没有创建一个\
  \ `test2` cookie，而是创建了一个名为 `PHPSESSID` 且带有长十六进制值的 cookie，如图 6-3\n\n图 6-3： 使用开发者工具查找\
  \ PHP 会话 cookie。\n\n这是 PHP 服务器分配给浏览器会话的唯一会话 ID。\n\n当你点击链接时，浏览器向服务器请求 `sessiontest2.php`\
  \ 页面，并传递在 `sessiontest1.php` 页面代码中设置的会话 ID cookie。这告诉 PHP 第二页面属于同一个浏览会话，并允许 PHP\
  \ 代码访问在该会话中设置的任何会话 cookie 数据。图 6-4 显示了你应该从 `sessiontest2.php` 文件看到的输出，以及开发者工具中显示的\
  \ `PHPSESSID` cookie 值。\n\n![image](img/9781119468387-fg040603.png)\n\n图 6-4：\n\n\
  \n\n\n\n```php\n$_SESSION['cart']['apples'] = 10;\n```\n\n该语句在 `$_SESSION['cart']`\
  \ session cookie 中创建了一个名为 `apples` 的数组元素，并将其值赋值为 `10`。\n\n你可以根据需要向 session cookie\
  \ 数组变量中添加任意数量的数组元素。\n\n### 从购物车中获取项目\n\n现在你已经有了一个包含放入购物车的商品的多维 session cookie 数组，你需要做的就是提取数组中存储的值以查看其内容。然而，这可能会有点复杂。\n\
  \n由于该数组是一个关联数组，你不能仅仅使用简单的 `for` 或 `while` 语句来遍历数组元素，因为你不知道数组中包含哪些键名。这时 `foreach`\
  \ 语句就派上用场了！它允许你在不需要知道键名的情况下遍历所有的数组键：\n\n```php\nforeach($_SESSION['cart'] as $key\
  \ => $value) {\n    echo \"<p>$key - $value</p>\\n\";\n}\n```\n\n`foreach` 语句遍历数组，在每次迭代中提取每对键和值。然后，你可以在代码中使用单独的键值值对来列出项目及其数量。\n\
  \n### 从购物车中移除项目\n\n由于购物车中的每个商品都是 session cookie 中独立的数组元素，只要你知道用于作为数组键的商品名称，就可以逐个处理每个商品。要移除单个商品，只需在\
  \ `unset()` 函数中指定它即可：\n\n```php\nunset($_SESSION['cart']['apples']);\n```\n\n该语句仅从数组中移除\
  \ `apples` 数组键及其值，而保留数组中的其他其他项目。如果你想移除整个购物车，可以使用以下代码：\n\n```php\nsession_unset($_SESSION['cart']);\n\
  ```\n\n该语句会移除整个 `cart` session cookie。要开始一个新购物车，你的代码需要创建一个新的购物车 session cookie 并将其作为一个数组变量。\n\
  \n![warning](img/warning.png) 在移除单个购物车项目或整个 session cookie 时要小心，因为这种操作是不可撤销的。当你删除一个\
  \ session cookie 时，它就会消失且无法恢复！\n\n### 整合以上\n\n如你所见，处理购物车是一个多步骤的过程，可能会变得相当复杂。让我们来看一个在网页上使用购物车的示例。列表\
  \ 6-1 显示了该代码。\n\n**列表 6-1** carttest.php 程序\n\n```php\n<?php\nsession_start();\n\
  ?>\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Shopping Cart Test</title>\n</head>\n\
  <body>\n    <h1>Items available</h1>\n    <form action=\"carttest.php\" method=\"\
  post\">\n        <table>\n            <tr><th>Item</th><<th>Quantity</th></th></tr>\n\
  \            <tr><td>Apples</td><td><input type=\"text\" name=\"apples\" size=\"\
  2\"></td></tr>\n            <tr><td>Bananas</td><td><input type=\"text\" name=\"\
  bananas\" size=\"2\"></td></tr>\n        </table>\n        <input type=\"submit\"\
  \ value=\"Click to add to cart\">\n    </form>\n    <br>\n    <?php\n    if (isset($_POST['apples']))\
  \ {\n        if (is_numeric($_POST['apples'])) {\n            $_SESSION['cart']['apples']\
  \ = $_POST['apples'];\n        } elseif ($_POST['apples'] == \"Remove\") {\n   \
  \         unset($_SESSION['cart']['apples']);\n        }\n    }\n    if (isset($_POST['bananas']))\
