  \n\n\n\n\n你应该能发现与 `listbidders.inc.php` 代码的相似之处。`listitems.inc.php` 代码创建了两个处理网页事件的\
  \ JavaScript 函数，在列表框中显示 `items` 表的数据记录，然后显示两个按钮：\n\n* `Delete Item`：从 Items 表中删除项目数据记录。\n\
  * `Update Item`：更新 Items 表中现有的项目数据记录。\n\n表单的工作原理与 `listbidders.inc.php` 代码类似。但是，你不需要事件来显示项目，因为这不是应用程序的要求（应用程序需求请参阅本微书的第\
  \ 1 章）。\n\n如果用户双击列表中的项目或点击“Update Item”按钮，将触发 `updateitem.inc.php` 代码。如果用户点击“Delete\
  \ Item”按钮，将触发 `removeitem.inc.php` 代码。这些文件将在后续章节中介绍。\n\n### 删除项目\n\n`removeitem.inc.php`\
  \ 代码的工作方式与 `removebidder.inc.php` 代码相同。它获取用户在列表框中选择的项目的 ID，然后使用它删除 Items 表中关联的数据记录。按照以下步骤创建\
  \ `removeitem.inc.php` 代码：\n\n1. **打开你的编辑器并输入以下代码：**\n\n```php\n<?php\nif (isset($_SESSION['login']))\
  \ {\n    $itemid = $_POST['itemid'];\n    $item = Item::findItem($itemid);\n   \
  \ $result = $item->removeItem();\n    if ($result)\n        echo\"<h2>Item $itemid\
