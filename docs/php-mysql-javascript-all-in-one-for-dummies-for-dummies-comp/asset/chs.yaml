  \n结构页是一个非常繁忙的网页！它显示了表的数据字段，以及每个数据字段的一系列操作图标。从这里，你可以更改任何数据字段的属性，也可以添加新数据字段或删除现有数据字段。\n\
  \n如果你点击网页左侧的 `dbtest` 链接，`phpMyAdmin` 将带你回到 Structure（结构）页。结构页显示表以及一些操作图标，如图 3-16\
