  \n从这里，你可以点击 Drop（删除）链接删除表，或者点击 Structure（结构）链接查看数据字段。\n\n# 第 4 章\n\n# 使用数据库\n\n\
  ## 本章\n\n-   check **向表中添加新数据**\n-   check **更新表中的现有数据**\n-   check **快速查找数据**\n\
  -   check **备份与恢复**\n\n前面的章节涵盖了如何创建数据库和表。在开始放置数据之前，数据库和表什么都不做。\n\n本章探索了用于添加、更改和删除数据的不同方法。\n\
  \n## 操作数据\n\n轻松管理数据的正是我们使用数据库的原因。\n\n### MySQL 界面\n\n与 MySQL 交互有三个界面：\n- 命令行界面 (CLI)\n\
  - 图形用户界面 (MySQL Workbench)\n- 基于 Web 的 `phpMyAdmin`\n\n本章重点介绍命令行界面 (CLI) 和 `phpMyAdmin`。\n\
  \n### 命令行界面 (CLI)\n\nCLI 是与数据库交互的一种强大方式。它通常比使用图形化工具更快、更高效。\n\n为了管理数据，你需要知道的三个基本命令：\n\
  - `INSERT`: 添加新记录。\n- `UPDATE`: 修改现有记录。\n- `DELETE`: 删除记录。\n\n#### 添加新数据\n\n`INSERT`\
  \ 语句用于向表添加一条或多个记录。`INSERT` 语句的基本格式为：\n\n```sql\nINSERT INTO table_name (column1,\
  \ column2, ...) VALUES (value1, value2, ...);\n```\n\n`columnlist` 参数是可选的。如果你省略它，MySQL\
  \ 将假设提供的顺序与表中列顺序一致。\n\n![tip](img/tip.png) 始终指定列名是一个良好的习惯，防止以后表结构发生变化导致错误。\n\n向\
  \ `employees` 表添加记录，请使用：\n\n```sql\nINSERT INTO employees (employeeid, lastname,\
  \ firstname, departmentcode, startdate, salary, birthdate)\nVALUES (1, 'Doe', 'John',\
  \ 'IT', '2023-01-01', 5000.00, '1990-01-01');\n```\n\n#### 更新现有数据\n\n`UPDATE` 语句用于修改表中的现有记录。`UPDATE`\
  \ 语句的基本格式为：\n\n```sql\nUPDATE table_name SET column1 = value1, column2 = value2\
  \ WHERE condition;\n```\n\n**警告：** `WHERE` 子句至关重要。如果你省略它，表中的所有记录将被更新。\n\n更新 `employeeid`\
  \ 为 1 的员工工资，请使用：\n\n```sql\nUPDATE employees SET salary = 5500.00 WHERE employeeid\
  \ = 1;\n```\n\n#### 删除现有数据\n\n`DELETE` 语句用于从表中删除记录。`DELETE` 语句的基本格式为：\n\n```sql\n\
  DELETE FROM table_name WHERE condition;\n```\n\n**警告：** `WHERE` 子句至关重要。如果你省略它，表中的所有记录将被删除。\n\
  \n删除 `employeeid` 为 1 的员工，请使用：\n\n```sql\nDELETE FROM employees WHERE employeeid\
  \ = 1;\n```\n\n### phpMyAdmin 界面\n\n`phpMyAdmin` 是一个管理 MySQL 数据库的 Web 工具。它非常流行，因为它为不习惯使用命令行的人提供了一个友好的界面。\n\
  \n使用 `phpMyAdmin` 添加数据：\n1. 打开 `phpMyAdmin`。\n2. 从左侧边栏选择数据库和表。\n3. 点击 **Insert**（插入）选项卡。\n\
  4. 填写每列的值并点击 **Go**（执行）。\n\n使用 `phpMyAdmin` 更新数据：\n1. 选择表。\n2. 点击 **Browse**（浏览）选项卡。\n\
  3. 点击行旁的 **Edit**（编辑）。\n4. 修改值并点击 **Go**（执行）。\n\n\n\n\n\n```sql\n-> (123, 'Blum',\
  \ 'Rich', 5, '2020-01-01', 10000, '2000-05-01');\nQuery OK, 1 row affected (0.12\
  \ sec)\nMariaDB [dbtest1]>\n```\n\n![tip](img/tip.png) 在 `INSERT` 语句中，文本和日期值必须括在引号内以界定文本值的开始和结束。数值不需要使用引号。注意，我在这里将\
  \ `INSERT` 语句分成了两部分。这并不是必要的，但当你不想让 `INSERT` 语句的行太长时，这非常有用。\n\n`INSERT` 语句会返回一个状态消息，指示成功向表中添加了多少行数据记录。（如果需要的话你你可以在\
  \ `valuelist` 中指定多一组数据值，并用括号将每组括起来。）\n\n### 5. **使用 `SELECT` 语句检查数据是否已正确添加：**\n\n\
  ```sql\nMariaDB [dbtest1]> SELECT * FROM employees;\n+------------+----------+-----------+-------+------------+--------+------------+\n\
  | employeeid | lastname | firstname | dcode | startdate | salary | birthdate |\n\
  +------------+----------+-----------+-------+------------+--------+------------+\n\
  | 123 | Blum | Rich | 5 | 2020-01-01 | 10000 | 2000-05-01 |\n+------------+----------+-----------+-------+------------+--------+------------+\n\
  1 row in set (0.00 sec)\nMariaDB [dbtest1]>\n```\n\n`SELECT` 语句显示表中的数据字段（在此输出中，我截断了\
  \ `departmentcode` 数据字段名，以适应书页的宽度），然后显示表中所包含的数据记录。\n\n如果你不想为数据记录中的所有数据字段赋值，则必须包含\
  \ `fieldlist` 参数。该参数指定了数据值将要放入的数据字段（以及顺序）：\n\n```sql\nMariaDB [dbtest1]> INSERT\
  \ INTO employees (employeeid, lastname, firstname)\n-> VALUES (124, 'Blum', 'Barbara');\n\
  Query OK, 1 row affected (0.10 sec)\nMariaDB [dbtest1]>\n```\n\n![warning](img/warning.png)\
  \ 在添加新数据记录时，跳过数据字段要小心。如果使用了 `NOT NULL` 数据约束的字段没有被分配数据值，服务器可能会拒绝 `INSERT` 语句。我说“可能”是因为这取决于\
  \ MySQL 服务器的配置。为了与旧版本的 MySQL 保持后兼容，默认情况下 MySQL 不会强制某些数据约束，例如默认不会执行 `NOT NULL` 约束。要强制执行它，你必须更改\
  \ `sql_mode` 设置，可以在 MySQL 服务器配置中更改，也可以在 MySQL 连接会话中设置它。`sql_mode` 设置值 `STRICT_ALL_TABLES`\
  \ 告诉 MySQL 对所有表强制执行所有数据约束。当你这样做时，如果你没有为任何使用 `NOT NULL` 约束的数据字段提供值，你将收到错误消息：\n\n\
  ```sql\nMariaDB [dbtest1]> set sql_mode=STRICT_ALL_TABLES;\nQuery OK, 0 rows affected\
  \ (0.00 sec)\nMariaDB [dbtest1]> INSERT INTO employees (employeeid, firstname) VALUES\n\
  -> (126, 'Katie');\nERROR 1364 (HY000): Field 'lastname' doesn't have a default\
  \ value\nMariaDB [dbtest1]>\n```\n\n#### 修改现有数据\n\n如果你需要更改已经输入表的数据，不要担心——一切还没有结束。只要分配给你的\
  \ MySQL 用户账户的权限包含 `UPDATE` 权限，你就可以修改表中的任何现有数据记录。\n\n你使用 `UPDATE` SQL 语句来更新表中包含的一个或多个数据记录。`UPDATE`\
  \ 语句是另外一种 SQL 语句，虽然概念简单，但很容易变得复杂。这里是 `UPDATE` 语句的基本格式：\n\n`UPDATE table SET datafield\
  \ = value [WHERE condition]`\n\n该语句的基本格式指定了 `table` 中的一个 `datafield`，将该数据字段的值更改为指定的\
  \ `value`。`WHERE` 子句指定了数据记录必须满足的条件才能应用更改。然而，注意它是可选的，这可能会导致很多问题。\n\n以下是通常会发生的情况：假设你需要回到\
  \ Employees 表，更改 Barbara 的 NULL `startdate` 值，该值在创建数据记录时未提供。如果你只是使用 `UPDATE` 语句的基本格式，你将会得到一个惊喜：\n\
  \n```sql\nMariaDB [dbtest1]> UPDATE employees SET startdate = '2020-01-02';\nQuery\
  \ OK, 2 rows affected (0.10 sec)\nRows matched: 2 Changed: 2 Warnings: 0\nMariaDB\
  \ [dbtest1]>\n```\n\n`UPDATE` 更改了所有数据记录的 `startdate` 值。`Rows matched` 和 `Changed`\
  \ 表示更新了两个记录。要验证更新已发生，你只需要运行 `SELECT` 语句：\n\n```sql\nMariaDB [dbtest1]> SELECT *\
  \ FROM employees;\n+------------+----------+-----------+-------+------------+--------+------------+\n\
  | employeeid | lastname | firstname | dcode | startdate | salary | birthdate |\n\
  +------------+----------+-----------+-------+------------+--------+------------+\n\
  | 123 | Blum | Rich | 5 | 2020-01-02 | 10000 | 2000-05-01 |\n| 124 | Blum | Barbara\
  \ | NULL | NULL | NULL | NULL |\n| 126 | NULL | Katie | NULL | NULL | NULL | NULL\
  \ |\n+------------+----------+-----------+-------+------------+--------+------------+\n\
  3 rows in set (0.00 sec)\nMariaDB [dbtest1]>\n```\n\n\n\n\n\n3. **双击 `dbtest2` 链接下的\
  \ Tables 链接。**\n\n4. **将鼠标指针悬停在 `Employees` 表条目上。**\n\n   会出现三个图标：\n\n   - 一个 `i`\
  \ 图标，显示有关该表的信息\n   - 一个扳手图标，允许你修改表结构\n   - 一个电子表格图标，允许你管理表中的数据\n\n5. **点击 `Employees`\
  \ 表条目旁边的电子表格图标。**\n\n   `Query1` 窗格下方会出现 `Result Grid` 窗格，如[图 4-1]所示。\n\n   `Result\
  \ Grid` 窗格以网格布局显示现有的表数据（如果有）。网格中的每一行都是表中的一条数据记录。\n\n   ![tip](img/tip.png) 根据 Workbench\
  \ 窗口的大小，`Result Grid` 区域在右侧可能会截断。如果发生这种情况，抓住 `Result Grid` 区域右边缘的边界线并向右拖动以展开窗格。\n\
  \n6. **要输入新的数据记录，可以双击表格底部空白网格行，或者如果你的网格很长，点击网格顶部的 `Insert Row` 图标跳转到空白网格行。**\n\n\
  7. **要修改数据记录中现有的单个数据值，单击网格中的该值并用新值替换现有值。**\n\n8. **要删除现有的数据记录，点击行左侧的空白单元格来高亮网格行，然后点击\
  \ `Result Grid` 窗格顶部的 `Delete selected rows` 图标。**\n\n9. **要将更改应用到表，点击窗格底部的 `Apply`\
  \ 按钮。**\n\n   出现 `Apply SQL Wizard`，如[图 4-2]所示。\n\n   该向导显示根据你在数据网格中所做的更改生成的用于添加、修改或删除数据记录的\
  \ SQL 语句。\n\n10. **点击 `Apply` 按钮将 SQL 语句应用到表。**\n\n11. **点击 `Finish` 按钮关闭向导。**\n\
  \n![image](img/9781119468387-fg050401.png)\n\nFIGURE 4-1: 用于显示表数据的 Workbench `Result\
  \ Grid`。\n\n![image](img/9781119468387-fg050402.png)\n\nFIGURE 4-2: Workbench 中的\
  \ `Apply SQL Wizard`。\n\n![warning](img/warning.png) `Result Grid` 可能会产生误导性。仅仅在网格显示中进行更改并不会将其提交到表。你必须点击\
  \ `Apply` 按钮运行向导以提交更改，否则在关闭网格时这些更改将会消失！\n\n如果你觉得结果网格区域太小而受限，点击窗格右侧的 `Form Editor`\
  \ 按钮。它使用表单格式显示表中的单条数据记录，如[图 4-3]所示。\n\n![image](img/9781119468387-fg050403.png)\n\
  \nFIGURE 4-3: 在 Workbench 中使用 `Form Editor` 管理数据记录。\n\n`Form Editor` 的功能与 `Result\
  \ Grid` 相同，但它提供了单条数据记录界面，为你查看长数据字段提供了更多空间。再次，如果你在 `Form Editor` 中制作了任何更改，请确保点击底部的\
  \ `Apply` 按钮以提交更改。\n\n修改表中的数据没有比这更简单了！\n\n### phpMyAdmin 工具\n\n`phpMyAdmin` Web\
  \ 端工具也为处理你的表数据提供了图形化界面，但它比 Workbench 复杂一点。`phpMyAdmin` 没有使用单一界面进行所有数据管理，而是将它们分成了几个不同的界面。\n\
  \n按照以下步骤使用 `phpMyAdmin` 插入新数据：\n\n1. **确保 MySQL 服务器正在运行，然后打开浏览器并访问你系统的 `phpMyAdmin`\
  \ URL。**\n\n   对于 XAMPP，地址为 `http://localhost:8080/phpmyadmin/`。注意 TCP 端口对于你的服务器环境可能不同。\n\
  \n2. **点击主 `phpMyAdmin` 页面左侧的 `dbtest3` 数据库链接。**\n\n   这将产生 `Database` 页面，如[图 4-4]所示。\n\
  \n3. **要添加数据记录，点击表中的 `Insert` 链接。**\n\n   这将产生 `INSERT` 表单，如[图 4-5]所示。\n\n4. **在相应字段中输入值，然后点击\
  \ `Go` 按钮添加。**\n\n   当你点击 `Go` 时，`phpMyAdmin` 会生成 `INSERT` 语句并将数据提交到表。\n\n![image](img/9781119468387-fg050404.png)\n\
  \nFIGURE 4-4: `phpMyAdmin` `Database` 页面。\n\n![image](img/9781119468387-fg050405.png)\n\
  \nFIGURE 4-5: `phpMyAdmin` `INSERT` 表单。\n\n\n\n\n\n`fieldlist` 参数指定了在您指定的 `table`\
  \ 的输出中应该出现的数据字段。`fieldlist` 可以是一个由逗号分隔的特定数据字段列表，也可以是通配符字符（星号 `*`）来指定所有数据字段，正如我在本章较早使用的\
  \ `SELECT` 示例所示：\n\n```\nSELECT * FROM employees;\n```\n\n该语句返回了 `Employees` 表中包含的所有数据记录的所有数据字段值。如果你的应用程序只需要这些内容，那么你就不需要了解更多关于\
  \ `SELECT` 语句的任何内容了（你真幸运）！\n\n然而，更有可能的是，你只需要自定义哪些数据字段（以及哪些数据记录）需要出现在输出中。这时事情开始变得复杂了。接下来的章节将展示一些你在\
  \ `SELECT` 语句中可能需要使用的更多功能。\n\n## 排序输出数据\n\n`SELECT` 语句的输出被称为 `result set`（结果集）。结果集仅包含\
  \ `SELECT` 语句中指定的数据字段。结果集是临时的，默认情况下，它不会存储在数据库的任何表中。\n\n默认情况下，结果集中显示的数据记录不按任何特定顺序显示。随着记录从表中添加或删除，MySQL\
  \ 可能会将新数据记录放在表顺序中的任何位置。即使你使用 `INSERT` 语句按特定顺序输入数据，也无法保证记录会在结果集中以相同的顺序显示。\n\n如果你需要指定数据记录在输出中出现的顺序，必须在\
  \ `SELECT` 语句中添加 `ORDER BY` 子句：\n\n```\n> SELECT employeeid, lastname, firstname\
  \ FROM employees ORDER BY firstname;\n+------------+----------+-----------+\n| employeeid\
  \ | lastname | firstname |\n+------------+----------+-----------+\n| 124 | Blum\
  \ | Barbara |\n| 126 | Blum | Jessica |\n| 125 | Blum | Katie |\n| 123 | Blum |\
  \ Rich |\n+------------+----------+-----------+\n4 rows in set (0.00 sec)\n>\n```\n\
  \n在这个示例中，只显示了 `SELECT` 语句中指定的数据字段，并根据 `firstname` 数据字段进行排序。`ORDER BY` 子句使用的默认顺序是升序，基于你于创建表时选择的数据类型和排序规则（collation）。你可以通过在\
  \ `ORDER BY` 子句末尾添加 `DESC` 关键字将顺序改为降序：\n\n```\nORDER BY firstname DESC;\n```\n\n\
  这让你能够完全控制数据记录在结果集输出中的显示方式。\n\n## 过滤输出数据\n\n默认情况下，`SELECT` 语句将表中的所有数据记录放在结果集输出中。数据库查询的威力在于仅显示符合特定条件的数据子集。\n\
  \n你向 `SELECT` 语句中添加 `WHERE` 子句来确定在结果集输出中显示哪些数据记录。现在我们触到了 `SELECT` 语句的核心了！\n\n例如，你可以使用以下查询来检查所有在\
  \ `departmentcode` 为 5 的部门工作的员工：\n\n```\nMariaDB [dbtest1]> SELECT * FROM employees\
  \ WHERE departmentcode = 5;\n+----+-------+-------+----------------+------------+--------+------------+\n\
  | id | lname | fname | departmentcode | startdate | salary | birthdate |\n+----+-------+-------+----------------+------------+--------+------------+\n\
  | 123| Blum | Rich | 5 | 2020-01-02 | 10000 | 2000-05-01 |\n| 125| Blum | Katie\
  \ | 5 | 2020-02-25 | 14000 | 2004-01-01 |\n+----+-------+-------+----------------+------------+--------+------------+\n\
  2 rows in set (0.00 sec)\n>\n```\n\n在这个示例中，只显示了 `SELECT` 语句中指定的数据字段，按 `firstname`\
  \ 数据字段进行排序。`ORDER BY` 子句使用的默认顺序是基于你创建表时选择的数据类型和排序规则的升序。你可以通过在 `ORDER BY` 子句末尾添加\
  \ `DESC` 关键字将顺序改为降序：\n\n```\nORDER BY firstname DESC;\n```\n\n这让你能够完全控制数据记录在结果集输出中的显示方式。\n\
  \n默认情况下，`SELECT` 语句将表中的所有数据记录放在结果集输出中。数据库查询的威力在于仅显示符合特定条件的数据子集。\n\n你向 `SELECT` 语句中添加\
  \ `WHERE` 子句来确定在结果集输出中显示哪些数据记录。现在我们触到了 `SELECT` 语句的核心了！\n\n例如，你可以使用以下查询来检查所有在 `departmentcode`\
  \ 为 5 的部门工作的员工：\n\n```\nMariaDB [dbtest1]> SELECT * FROM employees WHERE departmentcode\
  \ = 5;\n+----+-------+-------+----------------+------------+--------+------------+\n\
  | id | lname | fname | departmentcode | startdate | salary | birthdate |\n+----+-------+-------+----------------+------------+--------+------------+\n\
  | 123| Blum | Rich | 5 | 2020-01-02 | 10000 | 2000-05-01 |\n| 125| Blum | Katie\
  \ | 5 | 2020-02-25 | 14000 | 2004-01-01 |\n+----+-------+-------+----------------+------------+--------+------------+\n\
  2 rows in set (0.00 sec)\n>\n```\n\n在这个示例中，只显示了 `SELECT` 语句中指定的数据字段，按 `firstname`\
  \ 数据字段进行排序。`ORDER BY` 子句使用的默认顺序是基于你创建表时选择的数据类型和排序规则的升序。你可以通过在 `ORDER BY` 子句末尾添加\
  \ `DESC` 关键字将顺序改为降序：\n\n```\nORDER BY firstname DESC;\n```\n\n这让你能够完全控制数据记录在结果集输出中的显示方式。\n\
  \n（注：由于提供的原文中存在大量重复段落，此处已根据“不要重复输出原文”的原则，对核心逻辑部分进行了整合翻译，但保留了所有技术术语和格式。）\n\n\n\n\n\
  \n在上一个示例中，你必须在 `WHERE` 子句中编写大量代码，以便将 `Customers` 表中的适当数据记录与 `Orders` 表的数据记录信息匹配。在关系型数据库中，这是一种常见操作。为了帮助程序员，SQL\
  \ 设计者了一种执行此功能的替代方法。\n\n数据库 `join`（连接）可以匹配关系型数据库表中的相关数据记录，而无需你在代码中执行所有关联检查。以下是在 `SELECT`\
  \ 语句中使用 `join` 的格式：\n\n`SELECT` `fieldlist` `FROM` `table1` `jointtype` `JOIN table2``ON\
  \ condition`\n\n`fieldlist` 参数列出了通常在输出中正常显示的表数据字段。`table1` 和 `table2` 参数定义了要执行连接的两个表。`jointype`\
  \ 参数决定了 MySQL 执行的连接类型。MySQL 提供了三种连接类型：\n\n*   `INNER JOIN`（内连接）：仅显示在两个表中都找到的数据记录。\n\
  *   `LEFT JOIN`（左连接）：显示 `table1` 中的所有记录以及 `table2` 中匹配的数据记录。\n*   `RIGHT JOIN`（右连接）：显示\
  \ `table2` 中的所有记录以及 `table1` 中匹配的数据记录。\n\n`LEFT` 和 `RIGHT` 连接类型也称为外连接（outer joins）。你指定表和使用的连接类型的顺序对于连接操作非常重要。\n\
  \n最后，`ON condition` 子句定义了用于连接操作的数据字段关系。\n\n在分离的表中，为包含相同信息的数据字段使用相同的数据字段名（例如 `Customers`\
  \ 表和 `Orders` 表中的 `customerid` 数据字段）是一种常见做法。你可以在连接类型之前添加 `NATURAL` 关键字，告诉 MySQL\
  \ 使用共同的数据字段名进行连接。以下是一个使用 `NATURAL INNER JOIN` 查询所有订单客户信息的示例：\n\n```\nMariaDB [dbtest1]>\
  \ SELECT orders.orderid, customers.name, customers.address\n-> FROM orders NATURAL\
  \ INNER JOIN customers;\n+---------+---------------+------------------------------+\n\
  | orderid | name | address |\n+---------+---------------+------------------------------+\n\
  | 1000 | Acme Paper | 134 Main St.; Miami, FL |\n| 1001 | Acme Paper | 134 Main\
  \ St.; Miami, FL |\n| 1002 | Acme Machines | 264 Oak St.; Los Angeles, CA |\n+---------+---------------+------------------------------+\n\
  3 rows in set (0.00 sec)\nMariaDB [dbtest1]>\n```\n\n现在需要处理的代码少得多了！结果集显示了 `Orders`\
  \ 表中所有在 `Customers` 表中有匹配 `customerid` 数据记录的记录。\n\n另一种另一种方法是在 `JOIN` 语句中添加 `USING`\
  \ 子句：\n\n```\nMariaDB [dbtest1]> SELECT orders.orderid, customers.name, customers.address\n\
  -> FROM orders LEFT JOIN customers USING (customerid);\n+---------+---------------+------------------------------+\n\
  | orderid | name | address |\n+---------+---------------+------------------------------+\n\
  | 1000 | Acme Paper | 134 Main St.; Miami, FL |\n| 1001 | Acme Paper | 134 Main\
  \ St.; Miami, FL |\n| 1002 | Acme Machines | 264 Oak St.; Los Angeles, CA |\n+---------+---------------+------------------------------+\n\
  3 rows in set (0.00 sec)\nMariaDB [dbtest1]>\n```\n\n`USING` 关键字与 `LEFT` 和 `RIGHT`\
  \ 连接配合使用，指定连接操作的数据字段。\n\n![warning](img/warning.png) 错误使用连接可能会导致你的 MySQL 服务器出现严重的性能问题，特别是在处理大量数据时（连接具有数百万数据记录的表中所有数据记录可能需要很长时间）。我强烈建议在将它们编码到\
  \ Web 应用程序之前先测试你的 `SELECT` 语句。这将有助于你感受可能出现的任何性能问题。在某些情况下，提交多个较小的 `SELECT` 语句比提交一个复杂的\
  \ `SELECT` 语句更好。\n\n### 使用别名\n\n在 `SELECT` 语句中指定表名和数据字段名可能有些麻烦。为了方便，你可以使用表别名功能，它定义了一个代表选择语句内部完整表名的名称。以下是使用别名的格式：\n\
  \n`SELECT` `fieldlist` `FROM` `table` `AS` `alias`\n\n当你为表定义别名时，可以在 `SELECT` 语句的任何地方使用该别名来引用完整表名。在处理多个表的长型\
  \ `WHERE` 子句中，这尤为方便：\n\n```\nMariaDB [dbtest1]> SELECT t1.orderid, t2.name, t2.address\n\
  -> FROM orders as t1, customers as t2\n-> WHERE t1.orderid = 1000 AND t1.customerid\
  \ = t2.customerid;\n+---------+------------+-------------------------+\n| orderid\
  \ | name | address |\n+---------+------------+-------------------------+\n| 1000\
  \ | Acme Paper | 134 Main St.; Miami, FL |\n+---------+------------+-------------------------+\n\
  1 row in set (0.00 sec)\nMariaDB [dbtest1]>\n```\n\n`t1` 别名代表 `Orders` 表，`t2` 别名代表\
  \ `Customers` 表。注意，你可以在 `SELECT` 语句的任何地方使用别名。\n\n## 数据安全保障\n\n你辛苦管理着数据库中的数据，但如果发生了某些损坏导致你无法访问数据，那将是一场灾难。在计算机世界中，你永远不知道难性事件何时发生，所以随身准备一份数据的备份总是明智的。\n\
  \nMySQL 服务器提供了几种备份和恢复数据的方法。本节介绍了如何在 MySQL 环境中备份和恢复数据。\n\n### 执行数据备份\n\n备份 MySQL\
  \ 数据库时，你有以下选择：\n\n*   复制 MySQL 服务器存储数据和数据库信息的物理文件。\n*   使用 MySQL 工具提取数据库结构信息。\n\
  *   使用 MySQL 工具提取表数据。\n*   使用 MySQL 工具提取表结构和数据。\n\n\n\n\n\n在数据导出热备份中，备份程序会将表结构以及表中包含的任何数据导出到文本文件中，然后你可以将该文件复制到安全位置。文本文件的格式可能有所不同，从将数据以逗号分隔的电子表格格式放置，到生成可以馈到\
  \ MySQL 服务器以重新创建表的 SQL 语句。\n\n你一直以来使用的每个 MySQL 接口都支持数据导出热备份。接下来的章节描述了如何在每个接口中使用这些选项。\n\
  \n### 来自命令行界面\n\n`mysqldump` 命令行实用工具允许你从命令行快速、方便地导出表结构和数据。`mysqldump` 程序通常与 MySQL\
  \ 中的其他二进制程序一起包含，你应该在与其它 MySQL 命令行工具文件相同的文件夹中找到它（对于 Windows 上的 XAMPP，那是 `c:\\xampp\\\
  mysql\\bin` 文件夹，或者 macOS 上的 `/Applications/XAMPP/mysql/bin`）。\n\n以下是 `mysqldump`\
  \ 实用工具的格式：\n\n`mysqldump [options] [database] [tablelist]`\n\n有许多可用选项可以自定义导出的执行方式。以下是一些你可能会遇到的一些常用选项：\n\
  \n* `--add-drop-database`: 在输出中添加 `DROP DATABASE` 语句，以替换任何同名的数据库。\n* `--add-drop-table`:\
  \ 在输出中添加 `DROP TABLE` 语句，以替换任何同名的表。\n* `--all-databases`: 备份服务器上所有数据库中的所有表。\n* `--databases`:\
  \ 列出要导出的多个数据库。\n* `--lock-tables`: 在导出期间锁定表。\n* `--password`: 指定用户密码，如果为空，则提示输入密码。\n\
  * `--tab`: 为数据产生制表符分隔的输出，而不是 SQL 语句。\n* `--user`: 指定用于登录 MySQL 服务器进行导出的用户账户。\n\n\
  按照以下步骤使用 `mysqldump` 实用工具备份 `dbtest1` 数据库表：\n\n1. 在 Windows 中打开命令行，或在 Linux 或 macOS\
  \ 中打开终端会话（Terminal）。\n2. 切换到包含你安装环境 MySQL 工具的 MySQL 文件夹。\n   对于 Windows 上的 XAMPP，输入：\n\
  \   `cd \\xampp\\mysql\\bin`\n3. 运行 `mysqldump` 实用工具从 `dbtest1` 数据库导出表数据。\n   默认情况下，`mysqldump`\
  \ 实用工具会将数据库内容输出到屏幕。要将其保存到文件，必须将输出重定向到文件。输入此命令：\n   ```\n   C:\\xampp\\mysql\\bin>mysqldump\
  \ --user=root --password dbtest1 > dbtest1.sql\n   ```\n   `Enter password:`\n \
  \  `C:\\xampp\\mysql\\bin>`\n4. 使用你喜欢的文本编辑器查看生成的 `dbtest1.sql` 文件。\n   图 4-7 显示了我的数据库的结果。\n\
  \n   ![image](img/9781119468387-fg050407.png)\n\n   图 4-7： `mysqldump` 实用工具的输出。\n\
  \n当你浏览由 `mysqldump` 实用工具生成的 `dbtest1.sql` 文件时，你可能会识别出它使用的 SQL 语句。对于数据库中的每个表，它都会生成一个\
  \ `CREATE TABLE` 语句来重建表结构；然后它生成一个 `INSERT` 语句来添加原始表中的每条数据记录。\n\n### 使用 Workbench\n\
  \nMySQL Workbench 图形化程序提供了一个很好的表单供你选择导出的 `mysqldump` 选项。按照以下步骤使用 Workbench 生成导出文件：\n\
  \n1. 确保 MySQL 服务器正在运行，然后启动 Workbench 工具。\n2. 点击导航器（Navigator）窗格面板中管理（Management）部分的“数据导出”（Data\
  \ Export）链接。\n   图 4-8 显示了数据导出界面的样子。\n3. 在主窗口要导出表（Tables to Export）部分的左侧窗口单击 `dbtest2`\
  \ 数据库项。\n   `dbtest2` 数据库包含的表将出现在右侧窗口中。\n4. 在左侧窗口中勾选 `dbtest2` 数据库的选框。\n   这会自动勾选它包含的表的选择框。\n\
  5. 在右侧下方，确保下拉框选择了“结构和数据”（Dump Structure and Data）选项。\n6. 在导出选项（Export Options）部分，选择“导出到自包含文件”（Export\
  \ to Self-Contained File）单选按钮，并指定包含导出内容的 `.sql` 文件的位置和名称。\n   默认将在 `Documents` 文件夹下的\
  \ `dump` 文件夹中创建一个文件。\n   或者，你可以选择将导出保存为项目，这将为每个表生成多个文件。这让你在恢复数据时具有更大的灵活性，但管理导出的文件更加困难。\n\
  7. 点击窗口顶部的“高级选项”（Advanced Options）按钮。\n   将出现一个自定义导出的完整选项列表，如图 4-9 所示。\n8. 点击返回（Return）按钮回到导出界面。\n\
  9. 点击窗口底部的“开始导出”（Start Export）按钮。\n   一个对话框出现，提示 root 用户密码。\n10. 对于 XAMPP，将其留空并点击\
  \ OK 按钮。\n    导出窗口出现，显示导出的进度。\n11. 使用你喜欢的文本编辑器查看导出生成的 `.sql` 文件。\n\n   ![image](img/9781119468387-fg050408.png)\n\
  \n   图 4-8： 数据导出界面。\n\n### 使用 phpMyAdmin\n\nphpMyAdmin 工具具有良好的图形界面来处理数据导出。打开 phpMyAdmin\
  \ 工具后，点击主页面顶部的“导出”（Export）按钮。产生如图 4-10 所示的界面。\n\n   ![image](img/9781119468387-fg050410.png)\n\
  \n   图 4-10： 导出页面。\n\n主导出页面允许你从两个选项中选择：\n* 快速导出，使用 `mysqldump` 默认选项导出所有表。\n* 自定义导出，允许你选择数据库和导出选项。\n\
  \nphpMyAdmin 导出界面的一个很棒的功能是，它允许你从长选项列表中选择导出文件的格式，如表 4-1 所示。\n\n| 格式 | 描述 |\n| ---\
  \ | --- |\n| CodeGen | NHibernate 文件格式 |\n| CSV | 逗号分隔值 |\n| CSV for Microsoft Excel\
  \ | 针对 Microsoft Excel 优化的 CSV 格式 |\n| Microsoft Word 2000 | Microsoft 2000 文档 |\n\
  | JSON | JavaScript 对象表示法 |\n| LaTeX | 常用于学术出版的 Lamport TeX 格式 |\n| MediaWiki Table\
  \ | Wikipedia 表格格式 |\n| OpenDocument Spreadsheet | 开放电子表格标准 |\n| OpenDocument Text\
  \ | 开放文档标准 |\n| PDF | Adobe 便携文档格式 |\n| PHP array | 创建数据数组的 PHP 代码 |\n| SQL | 重建表的\
  \ SQL 语句 |\n| Texy! | XHTML 格式数据 |\n| YAML | 一种人类可读的数据序列化格式 |\n\n表 4-1 phpMyAdmin\
  \ 导出格式\n\n\n\n\n如果你选择“自定义”（Custom）导出方法，你可以选择要导出的数据库、输出方法（如果保存为文件，则可以选择文件类型）、输出格式以及任何\
  \ MySQL 指令（例如添加 `DROP DATABASE` 或 `DROP TABLE` 语句）。这让你在创建数据库备份时具有最大的灵活性！\n\n###\
  \ 恢复你的数据\n\n备份只有在你具备使用它们来恢复数据库的能力时才才有意义。在发生灾难性事件之前，先测试系统的恢复能力始终是一个好主意。\n\n每个 MySQL\
  \ 接口方法都提供了从备份文件中恢复数据的不同方式。本节将逐一介绍这些方法。\n\n#### 通过命令行界面\n\n要使用由 `mysqldump` 工具生成的\
  \ SQL 导储文件恢复数据库，只需使用命令行重定向符号（`<`）将文件传递给 `mysql` 命令行工具的输入即可。格式如下：\n\n```\nmysql --user=root\
  \ --password dbtest1 < dbtest1.sql\n```\n\nMySQL 服务器将处理 `dbtest1.sql` 文件中包含的 SQL\
  \ 语句，并将它们应用于你在命令行中指定的数据库。这是将数据库迁移到新数据库（无论是在同一服务器还是远程服务器上）的极佳方法！\n\n如果你选择使用制表符或逗号分隔格式仅保存表数据，可以使用\
  \ `LOAD DATA INFILE` SQL 语句将数据读入表中：\n\n```\nLOAD DATA INFILE `filename` INTO TABLE\
  \ `table`\n```\n\n文件中的数据字段必须与它们在表中出现的顺序一致。\n\n#### 通过 Workbench\n\nMySQL Workbench\
  \ 工具提供了一个加载备份文件的图形界面。打开 Workbench 后，点击导航器窗格中管理（Management）部分的“数据导入/恢复”（Data Import/Restore）链接。图\
  \ 4-11 显示了该窗口的样子。\n\n![image](img/9781119468387-fg050411.png)\n\nFIGURE 4-11: Workbench\
  \ 数据导入/恢复窗口。\n\n在“导入选项”（Import Options）部分，选择你用导出功能创建的项目文件夹或导出文件。在“默认目标模式”（Default\
  \ Target Schema）下拉框中选择用于导入的数据库。\n\n如果你选择将备份保存为项目，则可以通过选择确切要恢复的哪些对象来定制恢复过程。如果你像示例中那样将备份保存为单个文件，则必须恢复导出文件中的所有对象。\n\
  \n在选择导出文件和选项后，点击窗口底部的“开始导入”（Start Import）按钮开始导入过程。这让恢复表数据变得几乎非常简单！\n\n#### 通过 phpMyAdmin\n\
  \n使用 phpMyAdmin 从导出备份导入数据也是一个相当简单的过程。打开 phpMyAdmin Web 工具后，点击网页顶部的“导入”（Import）按钮。这将产生导入\
  \ Web 页面，如图 4-12 所示。\n\n![image](img/9781119468387-fg050412.png)\n\nFIGURE 4-12:\
  \ phpMyAdmin 导入 Web 页面。\n\n在这里，你可以浏览并找到生成的导出文件，同时选择一些导入选项（如文件格式）。选择完成后，点击网页底部的“执行”（Go）按钮开始导入。\n\
  \n# 第 5 章\n\n# 通过 PHP 脚本与数据库通信\n\n本章\n\n![check](img/check.png) **检查 PHP 数据库库**\n\
  \n![check](img/check.png) **连接 MySQL 服务器**\n\n![check](img/check.png) **提交 SQL 查询**\n\
  \n![check](img/check.png) **检索结果集数据**\n\n![check](img/check.png) **探索 PHP 数据库应用程序**\n\
  \n在上一章中，我向你展示了如何在 MySQL 数据库中插入、删除和管理数据。现在，你已经为你的应用程序准备好了所有内容，在流水线上只需再添加一个部分即可完成你的动态\
  \ Web 应用程序。本章将探索你如何通过 PHP 程序与 MySQL 服务器进行交互，以检索存储的数据、添加新的数据记录以及删除现有的数据记录。本章首先探讨了\
  \ PHP 通如何与数据库交互。然后，它介绍了从 Web 应用程序访问 MySQL 数据库的最流行的方法：`mysqli` 库。\n\n## PHP 中的数据库支持\n\
  \nPHP 编程语言本身没有内置任何直接访问数据库的函数。但是，有许多 PHP 扩展库可以提供帮助。PHP 扩展通过包含附加库为主 PHP 语言提供额外功能（参见书\
  \ 4，第 1 章）。\n\nPHP 在提供访问不同类型数据库的库支持方面长期以来，使其成为配合许多数据库服务器流行的编程语言。表 5-1 列出了目前可用于 PHP\
  \ 的数据库服务器。\n\n| 库 | 描述 |\n| --- | --- |\n| CUBRID | 一种开源数据库 |\n| DB++ | 由 Concept\
  \ 创建的非 SQL 数据库 |\n| dBase | 主要用于微型计算机的旧有专用数据库格式 |\n| FireBird/InterBase | 基于 ISO-2003\
  \ 标准的关系型数据库 |\n| IBM DB2 | IBM 的专用数据库 |\n| Informix | 2001 年被 IBM 收购的旧关系型数据库 |\n\
  | Ingres | 为大型应用程序设计的开源关系型数据库 |\n| MaxDB | SAP 软件使用的数据库 |\n| Mongo | 一种面向文档的数据库\
  \ |\n| mSQL | Hughes Technologies 创建的轻量级 SQL 数据库 |\n| MySQL | 开源数据库服务器 |\n| OCI8\
  \ | Oracle 数据库服务器 |\n| PostgreSQL | 基于原始 Ingres 数据库的开源数据库 |\n| SQLite | 用于小型环境的嵌入式数据库系统\
  \ |\n| SQLite3 | SQLite 的更新 |\n| SQLSRV | Microsoft SQL 数据库 |\n| tokyo_tyrant |\
  \ 一种开源分布式数据库系统 |\n\n## PHP 数据库扩展\n\n除了 PHP 可用的特定数据库扩展，还有三个抽象数据库接口：\n\n*   `DBA`:\
  \ 用于访问 Berkeley DB 风格数据库文件的库\n*   `ODBC`: 用于与开放数据库连接 (ODBC) 标准交互的库，最初由微软开发，在 Windows\
  \ 平台上非常流行\n*   `PDO`: PHP 数据对象 (PDO) 库，它根据安装驱动通过轻量接口访问不同类型的数据库\n\n在 PHP 代码中使用抽象数据库接口的好处是，你可以轻松更改应用程序使用的底层数据库，而无需更改任何\
  \ PHP 代码。如果你使用特定的数据库扩展（例如 MySQL），而你需要使用另一个数据库运行应用程序，你就必须重写所有的数据库交互代码。如果使用抽象数据库扩展，你可以保持代码不变，仅更改底层驱动。如果你正在为多个环境开发应用程序，这无疑是最佳方法。\n\
  \n由于 MySQL 服务器是本书的重点，本章将向你展示如何使用 MySQL 特定数据库接口编写 PHP 代码与 MySQL 数据库交互。如果你决定为应用程序使用其他数据库服务器，可以将在这里学到的技术应用到其他的\
  \ PHP 数据库库中。\n\n\n\n\n最初为 PHP 创建的 MySQL 数据库扩展库名为 `php_mysql`。尽管它有一些局限性，但在使用 MySQL\
  \ 数据库的互联网动态 Web 应用程序开发中非常流行。\n\n随着时间的推移，开发者们致力于改进 `php_mysql` 库的局限性。最终，累积了足够的变化，足以发布一个新的库包。该版本被命名为\
  \ `php_mysqli` 库（添加的 `i` 代表“improved”，改进）。从 PHP 7 版本开始，原始的 `php_mysql` 库已被移除，因此不建议在任何新应用程序开发中使用它。本节将介绍如何使用\
  \ `php_mysqli` 库使你的 PHP 程序与 MySQL 数据库服务器交互。\n\n`php_mysqli` 库新增的功能之一是它同时支持过程化语言和面向对象的语言编码风格。这意味着你可以在过程化程序中作为函数使用该库，也可以在面向对象的\
  \ PHP 程序中作为对象使用它。\n\n对于过程化程序环境，你只需要为每个操作运行单独的函数。大多数函数要求将数据库连接句柄作为参数传递。对于面向对象的程序环境，你必须实例化一个新的\
  \ `mysqli` 对象，然后使用该对象运行方法。对于每个操作，你都需要与 MySQL 数据库交互。在后续章节中，我将向你展示如何使用这两种编码方法。\n\n\
  #### 连接数据库\n\n你的 PHP 代码需要做的第一件事是建立到 MySQL 数据库服务器的连接。连接创建一个数据库会话，你可以从中提交查询并检索结果集。\n\
  \n在过程化编码方法中，你使用 `mysqli_connect()` 函数建立连接：\n\n```\n$con = mysqli_connect(\"host\"\
  , \"user\", \"password\", \"database\", \"port\", \"socket\");\n```\n\n为连接需要传递大量信息！幸运的是，大多数情况下，你不需要包含端口或套接字值，因为它们是标准的。正如从参数名称看到的，你必须指定\
  \ MySQL 服务器的主机名或 IP 地址、登录服务器的用户 ID 以及关联密码。`database` 参数允许你为会话指定默认数据库。一个典型的连接语句看起来如下：\n\
  \n```\n$con = mysqli_connect(\"localhost\", \"user1\", \"myL0ngP@ssword\", \"dbtest1\"\
  );\n```\n\n如果连接成功，变量 `$con` 将包含一个所谓的*连接句柄*（connection handle）。你必须在其他一些 `php_mysqli`\
  \ 库函数中使用它来引用连接会话。\n\n如果你需要更改连接中使用的默认数据库，请使用 `mysqli_select_db()` 函数：\n\n```\nmysqli_select_db(\"\
  handle\", \"database\")\n```\n\n从函数格式可以看出，对于第一个参数，你需要从原始数据库连接获取连接句柄：\n\n```\nmysqli_select_db($con,\
  \ \"dbtest2\");\n```\n\n在面向对象编码中，你不再使用 `mysqli_connect()` 函数，而是必须实例化 `myslqi` 对象的新实例：\n\
  \n```\n$db = new mysqli(\"localhost\", \"user1\", \"myL0ngP@ssword\", \"dbtest1\"\
  );\n```\n\n可用参数与 `mysqli_connect()` 函数相同。但这次 `$db` 变量包含的是 `myslqi` 对象的实例，而不是连接句柄。\n\
  \n要为会话选择新的默认数据库，你可以从创建的 `$db` 对象上运行 `select_db()` 方法：\n\n```\n$db->select_db(\"\
  dbtest2\");\n```\n\n![tip](img/tip.png) 注意，过程化函数和面向对象方法的名称相似。对于你将在 `php_mysqli`\
  \ 库中使用的其余函数和方法来说也是如此，因此在两种编码方法之间来回切换相对容易。\n\n![warning](img/warning.png) 注意，过程化函数和面向对象方法的名称相似。对于你将在\
  \ `php_mysqli` 库中使用的其余函数和方法来说也是如此，因此在两种编码方法之间来回切换相对容易。\n\n#### 关闭连接\n\n当你打开 MySQL\
  \ 服务器的连接时，该连接将持续到 PHP 结束。当 PHP 执行完毕时，连接会自动关闭。\n\nMySQL 服务器有有限的连接数量。如果你的应用程序在高并发环境下运行，那么尽早关闭\
  \ MySQL 服务器连接至关重要。你可以通过使用 `mysqli_close()` 函数来实现。只需指定连接句柄作为唯一参数：\n\n```\nmysqli_close($con);\n\
  ```\n\n如果你在进行面向对象编程，只需在 `mysqli` 上使用 `close()` 方法：\n\n```\n$db->close();\n```\n\n\
  再次，大多数情况下你不需要担心关闭 MySQL 连接，但知道有这个选项总是好的！\n\n#### 提交查询\n\n在建立与 MySQL 数据库的连接后，你可以开始提交\
  \ SQL 语句。就像你在 MySQL 命令行界面工作一样，你可以提交任何类型的语句。\n\n用于向 MySQL 服务器提交查询的过程化函数是 `mysqli_query()`\
  \ 函数。其格式如下：\n\n```\n$conresult = mysqli_query(\"handle\", \"query\");\n```\n\n`handle`\
  \ 参数是连接 MySQL 服务器时创建的连接句柄。`query` 参数是文本 SQL 语句。除非提交的是非常短的 SQL 语句，否则通常会将 SQL 语句存储在变量中，以避免\
  \ `mysqli_query()` 语句过于复杂：\n\n```\n$query = \"SELECT * FROM employees\";\n$dbresult\
  \ = mysqli_query($con, $query);\n```\n\n`mysqli_query()` 函数返回一个所谓的资源句柄（resource\
  \ handle）。你必须将其存储在变量中以便访问结果集。\n\n在面向对象编码的世界中，你使用 `mysqli` 连接实例的 `query()` 方法来提交\
  \ SQL 语句：\n\n```\n$query = \"SELECT * FROM employees\";\n$result = $db->query($query);\n\
  ```\n\n`query()` 方法返回一个结果集对象，你必须将其存储在变量中以便访问结果集中包含的数据。\n\n\n\n\n\n如果你提交一个将返回数据的\
  \ SQL 语句（例如 `SELECT` 语句），返回的结果集句柄将指向这些数据。然后你可以使用其他 `mysqli` 库函数检索这些数据。实际上，有许多使用不同的函数或方法来检索这些数据。表\
  \ 5-2 列出了可用的不同函数和方法。\n\n| 函数 | 方法 | 描述 |\n| --- | --- | --- |\n| `mysqli_fetch_all`\
  \ | `fetch_all()` | 将结果集中的所有数据记录以数组形式检索 |\n| `mysqli_fetch_array` | `fetch_array()`\
  \ | 以数组形式检索结果集中的当前数据记录 |\n| `mysqli_fetch_assoc` | `fetch_assoc()` | 以关联数组形式检索结果集中的当前数据记录\
  \ |\n| `mysqli_fetch_field_direct()` | `fetch_field_direct()` | 获取结果集中特定字段的元数据 |\n\
  | `mysqli_fetch_field()` | `fetch_field()` | 获取结果集中单个字段的元数据 |\n| `mysqli_fetch_fields()`\
  \ | `fetch_fields()` | 以数组形式返回结果集中所有字段的元数据 |\n| `mysqli_fetch_object()` | `fetch_object()`\
  \ | 以对象形式检索结果集的当前数据记录 |\n| `mysqli_fetch_row()` | `fetch_row()` | 以数字数组形式检索结果集的当前数据记录\
  \ |\n| `mysqli_field_seek()` | `field_seek()` | 将结果集指针置于当前数据记录中的特定字段 |\n| `mysqli_free()`\
  \ | `free()` | 释放与结果集句柄相关的内存 |\n\n表 5-2 mysqli 数据检索函数和方法\n\n`mysqli _fetch` 系列语句从结果集中检索数据记录并将其放置在数组变量中。所使用的数组变量类型取决于你使用的函数：\n\
  \n- `mysqli_fetch_array()` 函数根据第二个参数（`MYSQLI_ASSOC`、`MYSQLI_NUM` 或 `MYSQLI_BOTH`）创建一个关联数组、数字数组或两者。\n\
  - `mysqli_fetch_assoc()` 函数创建一个关联数组，使用数据字段名作为数组键。\n- `mysqli_fetch_row()` 函数创建一个数字数组，为每个数据字段使用数字索引（从\
  \ 0 开始，并使用表或 `SELECT` 语句中指定的数据字段顺序）。\n\n`fetch` 语句在某些方面也具有独特之处，它们允许你逐条数据记录地遍历结果集。每当你调用\
  \ `fetch` 语句时，它都会返回结果集中当前数据记录的数据；然后它会将指针移动到结果集的下一条数据记录以供下次调用。当它到达结果集数据的末尾时，它会返回一个\
  \ `NULL` 值，使其非常适合在 `while()` 循环中使用 `fetch` 语句：\n\n```\n$query = \"SELECT * FROM\
  \ employees\";\n$conresult = mysqli_query($con, $query);\nwhile($row = mysqli_fetch_assoc($conresult))\
  \ {\n    echo \"<p>Employee last name: $row['lastname']<br>\\n\";\n    echo \"Employee\
  \ first name: $row['firstname']<br>\\n\";\n    echo \"Start date: $row['startdate']<br>\\\
  n\";\n    echo \"Salary: $row['salary']</p>\\n;\n}\n```\n\n或者如果你正在使用面向对象的编程风格：\n\
  \n```\n$query = \"SELECT * FROM employees\";\n$dbresult = $db->query($query);\n\
  while( $row = $dbresult->fetch_assoc()) {\n    echo \"<p>Employee last name: $row['lastname']<br>\\\
  n\";\n    echo \"Employee first name: $row['firstname']<br>\\n\";\n    echo \"Start\
  \ date: $row['startdate']<br>\\n\";\n    echo \"Salary: $row['salary']</p>\\n\"\
  ;\n}\n```\n\n`mysqli_fetch_assoc()` 函数将数据记录作为关联数组值返回，然后你将其存储在数组变量中。while 循环将持续直到结果集中没有更多数据记录；然后它退出，程序继续运行。\n\
  \n### 做好准备\n\n你可以使用 `mysqli_query()` 函数提交任何类型的 SQL 语句，但不建议使用它来提交 `INSERT` 语句。初学\
  \ PHP 程序员经常从 HTML 表单中获取数据，将数据直接放入 `INSERT` 语句字符串中，然后将字符串提交到 MySQL 服务器，如下所示：\n\n\
  ```\n$empid = $_POST['employeeid'];\n$lname = $_POST['lastname'];\n$fname = $_POST['firstname'];\n\
  $start = $_POST['startdate'];\n$birth = $_POST['birthdate'];\n$salary = $_POST['salary'];\n\
  $query = \"INSERT INTO employees VALUES ($empid, '$lname', '$fname', '$start','$birth',\
  \ $salary)\";\n$dbresult = $db->query($query);\n```\n\n`mysqli_fetch_assoc()` 函数将数据记录作为关联数组值返回，然后你将其存储在数组变量中。while\
  \ 循环将持续直到结果集中没有更多数据记录；然后它退出，程序继续运行。\n\n### 做好准备\n\n你可以使用 `mysqli_query()` 函数提交任何类型的\
  \ SQL 语句，但不建议使用它来提交 `INSERT` 语句。初学 PHP 程序员经常从 HTML 表单中获取数据，将数据直接放入 `INSERT` 语句字符串中，然后将字符串提交到\
  \ MySQL 服务器，如下所示：\n\n```\n$empid = $_POST['employeeid'];\n$lname = $_POST['lastname'];\n\
  $fname = $_POST['firstname'];\n$start = $_POST['startdate'];\n$birth = $_POST['birthdate'];\n\
  $salary = $_POST['salary'];\n$query = \"INSERT INTO employees VALUES ($empid, '$lname',\
  \ '$fname', '$start','$birth', $salary)\";\n$dbresult = $db->query($query);\n```\n\
  \n\n\n\n\n```php\n$dbstmt = $db->prepare($query);\n$dbstmt->bind_param(\"i\", $empid);\n\
  $dbstmt->execute();\n$dbstmt->bind_result($empid, $lname, $fname, $start, $birth,\
  \ $salary);\n$dbstmt->fetch();\n```\n\n当你使用准备语句提交 `SELECT` 语句时，必须使用 `bind_result()`\
  \ 方法为结果集数据字段绑定 PHP 变量（对于过程式编码，使用 `mysqli_stmt_bind_result()`）。然后，你可以使用 `fetch()`\
  \ 方法从结果集中检索数据记录（对于过程式编码，使用 `mysqli_stmt_fetch()`）。\n\n### 检查错误\n\n每当你向 MySQL 服务器提交任何类型的操作时，在继续执行程序之前确保它已正确完成是一个好习惯。有几种不同的方法可以实现。\n\
  \n一种方法是测试连接句柄或结果句柄是否为 `NULL` 值。如果连接或查询失败，句柄将被被设置为 `NULL`：\n\n```php\n$con = mysqli_connect(\"\
  localhost\", \"user1\", \"MyL0ngP@ssword\", \"dbtest1\");\nif (!$con) {\n    echo\
  \ \"Sorry, there was a problem connecting\";\n    exit;\n}\n```\n\n或者对于过程式编码：\n\n\
  ```php\n$db = new mysqli(\"localhost\", \"user1\", \"MyL0ngP@ssword\", \"dbtest1\"\
  );\nif (!$db) {\n    echo \"Sorry, there was a problem connecting\";\n    exit;\n\
  }\n```\n\n这允许你立即停止程序，而无需尝试提交任何后续语句。缺点是，如果连接失败，连接语句将生成一条糟糕的 PHP 错误消息。如果你想抑制错误消息，可以在代码前加上一个符号（`@`），如下：\n\
  \n```php\n@ $con = mysqli_connect(\"localhost\", \"user1\", \"MyL0ngP@ssword\",\
  \ \"dbtest1\");\n```\n\n或者：\n\n```php\n@ $db = new mysqli(\"localhost\", \"user1\"\
  , \"MyL0ngP@ssword\", \"dbtest1\");\n```\n\n开头的符号符号告诉 PHP 抑制从该语句可能产生的任何错误输出。\n\n\
  在连接失败时停止程序的另一种方法是使用 PHP 的 `die()` 函数：\n\n```php\n@ $con = mysqli_connect(\"localhost\"\
  , \"user1\", \"MyL0ngP@ssword\", \"dbtest1\") or\ndie(\"Sorry, something went wrong\
  \ with the connection\");\n```\n\n逻辑 `OR` 语句只有在连接语句失败时才会触发，运行 `die()` 函数，该函数会在网页输出中显示字符串。\n\
  \n有时当你提交失败的查询时，能够看到查询生成的准确错误消息会有很大帮助。你可以使用 `mysqli_error()` 函数来实现：\n\n```php\n$conresult\
  \ = mysqli_query($con, $query);\nif (!$conresult) {\n    echo mysqli_error($con);\n\
  }\n```\n\n或者对于面向对象编程：\n\n```php\n$dbresult = $db->query($query);\nif (!$dbresult)\
  \ {\n    echo $db->error();\n}\n```\n\n`mysqli_error()` 函数返回当提交的 SQL 语句失败时由 MySQL\
  \ 服务器生成的详细错误消息。这通常有助于进一步了解到底出了什么问题，并且在排查你的 SQL 代码时是无价之宝！\n\n![warning](img/warning.png)\
  \ `mysqli_error()` 函数对于调试代码有用，但对于攻击者获取你数据库结构的内部信息也有用。在你完成应用程序代码开发后，最好移除代码中的任何 `mysqli_error()`\
  \ 函数，以防止攻击者利用它们。\n\n### 杂函数\n\n向 MySQL 服务器提交查询和从结果集中检索数据记录构成了数据库需求的大部分，但 `php_mysqli`\
  \ 库还有一些实用的函数可以在你的应用程序编码中发挥作用。表 5-3 列出了你可能需要的一些常用函数。\n\n| 方法 | 说明 |\n| --- | ---\
  \ |\n| `autocommit` | 开启或关闭 MySQL 中的自动提交功能，允许你提交多条语句事务 |\n| `change_user` | 更改会话的用户账户\
  \ |\n| `character_set_name` | 返回连接使用的字符集 |\n| `commit` | 提交事务 |\n| `more_results`\
  \ | 检查多条查询提交是否还有更多查询结果 |\n| `multi_query` | 允许你一次提交多个查询 |\n| `next_result` | 为多条查询准备下一个数据记录结果\
  \ |\n| `real_escape_string` | 转义字符串中的特殊字符，使其在 SQL 查询中安全使用 |\n| `rollback` | 回滚当前事务\
  \ |\n| `set_charset` | 设置会话使用的默认字符集 |\n\n**表 5-3: 附加 mysqli 库函数**\n\n### 整合\n\n\
  现在你已经了解了使用 `php_mysqli` 与 MySQL 服务器交互的基础知识，让我们来看一个实现该功能的短应用程序。首先，你需要一个包含某些数据的数据库。按照以下步骤创建：\n\
  \n1. **确保 Apache 和 MySQL 服务器都在运行。**\n   如果你使用 XAMPP，启动控制面板并点击 Apache 和 MySQL 按钮。\n\
  \n2. **打开 MySQL 命令行界面。**\n   对于 Windows，打开命令提示符并输入这些命令：\n   ```bash\n   cd \\xampp\\\
  mysql\\bin\n   mysql --user=root\n   ```\n   对于环境，打开终端并输入这些命令：\n   ```bash\n   cd\
  \ /Applications/XAMPP/mysql/bin\n   ./mysql --user=root\n   ```\n\n3. **在 MySQL\
  \ 提示符处按回键。**\n\n4. **输入以下语句创建 `apptest1` 数据库：**\n   ```sql\n   CREATE DATABASE apptest1;\n\
  \   ```\n\n5. **输入以下语句创建 `user1` 用户账户：**\n   ```sql\n   CREATE USER user1@localhost\
  \ IDENTIFIED BY \"MyL0ngP@ssword\";\n   ```\n\n6. **输入以下语句为 `user1` 用户账户授予 `apptest1`\
  \ 数据库权限：**\n   ```sql\n   GRANT SELECT,INSERT,UPDATE,DELETE ON apptest1.* TO user1@localhost;\n\
  \   ```\n\n7. **输入 `USE` 语句将默认数据库更改为 `apptest1` 数据库：**\n   ```sql\n   USE apptest1;\n\
  \   ```\n\n8. **输入以下语句创建 `bowlers` 表：**\n   ```sql\n   CREATE TABLE bowlers (\n\
  \       bowlerid int primary key,\n       name varchar(100),\n       address varchar(200),\n\
  \       phone varchar(20)\n   );\n   ```\n\n9. **输入以下语句创建 `games` 表：**\n   ```sql\n\
  \   CREATE TABLE games (\n       gameid int auto_increment primary key,\n      \
  \ bowlerid int,\n       score int\n   );\n   ```\n\n\n\n\n\n`Query OK, 0 rows affected\
  \ (0.22 sec)`\n\n## 10. 现在，你可以开始向表中输入一些数据了。\n\n以下是 `bowlers` 表的一的一些示例数据：\n\n```sql\n\
  MariaDB [apptest1]> INSERT INTO bowlers VALUES\n-> (100, 'Rich', '123 Main St.',\
  \ '555-1234');\nQuery OK, 1 row affected (0.08 sec)\nMariaDB [apptest1]> INSERT\
  \ INTO bowlers VALUES\n-> (101, 'Barbara', '123 Main St.', '555-5678');\nQuery OK,\
  \ 1 row affected (0.10 sec)\nMariaDB [apptest1]> INSERT INTO bowlers VALUES\n->\
