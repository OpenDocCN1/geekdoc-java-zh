- "# For Dummies PHP, MySQL 与 JavaScript 全能指南\n\n\n\n![](img/cover.jpg)\n\n# 引言\n\n\
  互联网已成为一个了不起的地方，你可以购物、银行、查询作业甚至跟踪你的保龄联赛得分。在所有这些优秀应用程序背后，是一系列不同的网络技术，它们必须协同工作，才能创造出你预期的网络体验。\n\
  \n你可能认为创建 Web 应用程序应该是专业人士的事，但你会发现，仅仅凭借一点知识和经验，你所取得的效果会让你大惊讶！这正是本书的意义。\n\n## 关于这本书\n\
  \n将这本书看作一本参考书。就像字典或百科全书一样（还记得吗？），你不需要从头读到尾。相反，你可以翻阅此书来寻找你需要的信息，并在需要更多信息时再次查阅。尽管如此，如果你从头到尾读完这本书，你也不会失望的，而且你可能会发现跟随某些示例操作会更容易。\n\
  \n在本书书中，我将带你了解创建动态 Web 应用涉及的所有技术，这些应用可以跟踪数据并以整齐美观的方式呈现出来。我涵盖了创建一个功能全的动态 Web 应用需要掌握的关键主题：\n\
  \n*   **创建网页的基础布局：** 在本书书中，你将看到在网页上放置内容以及响应网站访问者鼠标点击背后的程序代码。\n*   **网页样式化：** 仅仅将数据放在网页上是无趣的。在本书书中，你将学习如何使用\
  \ `CSS` 利用颜色、图像和布局来让你的 Web 应用变得丰富。\n*   **添加动态功能：** 如今，一个静止在那里的静态网页吸引不了多少粉丝。本书将向你如何结合\
  \ `JavaScript` 让你的网页动起来并提供动态功能。\n*   **利用服务器的力量：** `PHP` 语言允许你利用 Web 服务器背后的力量，在网站访问者做出选择时，“动态地”生成网页。\n\
  *   **为未来存储数据：** 几乎每个动态 Web 应用都需要存储数据，在本书书中，你将学习具体如何使用 `MySQL` 服务器来实现这一点，它在几乎每个\
  \ Web 平台上可用。\n*   **创建完整的应用程序：** 很多书籍丢给你一堆技术，并期望你自己组合组合。本书不仅向你展示技术，还演示了所有部分如何结合在一起创建一个动态\
  \ Web 应用。\n*   **使用辅助程序：** 人不是孤岛；每个人都需要一些帮助来组装那些华丽的 Web 应用。有很多工具可以帮助你完成工作，通过本书你将发现哪些工具可以帮助你应用程序的哪些功能。\n\
  \n在本书书中，你会看到侧边栏（灰色框中的文字）和标记有 `Technical Stuff` 图标的内容。所有这些都是可以跳过的。如果你有时间并且感兴趣，尽管阅读它们，但如果你没时间或感兴趣，大不必读。\n\
  \n最后，在本书书中你可能会注意到某些 Web 地址跨越了两个行文本。如果你正在阅读纸质书籍并想访问其中一个网页，只需按照文本中的标记准确输入 Web 地址，假装换行符不存在。如果你正在阅读电子书。\n\
  \n## 愚蠢的假设\n\n你不需要任何编程基础来享受这本书。只要你对操作界面还算自如，这本书就适合你。\n\n## 书中使用的图标\n\n我在书中使用了一些图标来帮助你。以下是它们的含义：\n\
  \n*   Tip（提示）：任何标记有 `Tip` 图标的内容都提供了一些额外信息。\n*   Remember（记住）：偶尔我会告诉你一些你应该 `remember`\
  \ 的重要事情。\n*   Warning（警告）：`Warning` 图标用于指出可能导致问题的潜在陷阱。\n*   Technical Stuff（技术细节）：当你看到\
  \ `Technical Stuff` 图标时，准备好戴上你的极客帽。\n\n## 本书之外\n\n除了你正在阅读的电子书内容外，你还可以获得一份免费的快速上手（Cheat\
  \ Sheet），其中包含了更多构建 Web 应用的技巧，包括从 PHP 访问任何数据库、过滤不需要或危险的数据、在 `MySQL` 数据库中快速查找数据以及在预定义时间触发\
  \ `JavaScript` 事件。要访问此资源，请访问 `www.dummies.com` 并在搜索框中输入 `PHP, MySQL &&& JavaScript\
  \ All-in-One For Dummies Cheat Sheet`。\n\n## 从何开始\n\n本书不需要从头读到尾，因此你可以从任何地方开始。使用目录和索引查找你感兴趣的主题。\n\
  \n如果你已经认识 `PHP` 和 `JavaScript`，并且只想学习如何从零创建一个动态 Web 应用，请从第 6 卷第 1 章开始。如果你感兴趣如何使用适用于\
  \ `PHP` 的框架包，请查看第 7 卷第 1 章。或者，如果你对一切都感兴趣，请从第 1 卷第 1 章开始，读到最后。\n\n祝你掌握了开发动态 Web 应用的新技能！\n\
  \n第 1 卷\n\n# Web 编程入门\n\n## 内容概览\n\n\n\n\n\n# 第一章：剖析网络编程的组成部分\n\n在本章中\n\n- 理解简单网页的工作原理\n\
  - 将编程整合到你的网页中\n- 在数据库中存储内容\n\n起初，深入网络编程可能会让人有些无从从。你需要了解各种知识，以便构建出一个不仅看起来引人入胜而且运行正常的网络应用程序。学习网络编程的秘诀在于将各个部分拆解开，逐一攻克。\n\
  \n本章将通过检查创建简单网页所涉及的不同部分，开启你的网页设计之旅。然后，它将提升一个档次，带你了解动态网页。最后，章节将通过解释如何存储你的内容以便在网络上使用而结束。\n\
  \n## 创建一个简单的网页\n\n在跑步马拉松之前，你首先需要学会走路。同样，在创建一个花哨的网站之前，你需要了解网页工作的基本知识。\n\n现如今，在互联网上共享文档非常容易，但过去并不总是如此。在互联网早期，文档通常是使用专有的文字处理软件包创建的，并且必须使用繁琐的文件传输协议（`FTP`）下载。要检索文档，你必须确切知道哪个服务器包含该文档，必须知道它存储在服务器的哪个位置，并且必须能够登录该服务器。在完成这一切之后，你仍然需要在计算机上拥有正确的文字处理软件才能查看文档。正如你可以想象的，不久之后就需要一种新的内容共享方式了。\n\
  \n为了达到我们今天的境界，必须开发多种不同的技术：\n\n- 一种将相关文档连接的方法\n- 一种让文档阅读器在任何设备上以相同方式显示格式化文本的方法\n\
  - 允许客户端从任何服务器轻松检索文档的互联网标准\n- 一种对文档内容进行样式设计和定位的标准方法\n\n本节描述了让互联网查看文档像今天这样运作的技术。\n\
  \n### 从万维网开始\n\n1989 年，蒂姆·伯纳斯-李（Tim Berners-Lee）开发了一种连接文档的方法，以便在互联网上共享研究信息更加容易。他的创造物“万维网”定义了一种在网页结构中链接文档的方法，使研究人员无论他们位于世界的何处，都可以遵循相关文档之间的路径。点击一个文档中的文本会自动带你进入另一个文档，而无需你手动查找并下载相关文档。\n\
  \n伯纳斯-李开发的链接文档的方法被称为超文本（`hypertext`）。超文本文档中嵌入了在视图中隐藏的链接，并引导用于查看文档的软件（称为`web browser`）去检索引用的文档。通过超文本，你只需点击链接，软件（`web\
  \ browser`）就会为你完成查找和检索相关文档的所有工作。\n\n由于查看文档的软件完成了所有的困难工作，因此必须开发一种不仅仅是文档查看器的新类型软件。这就是网络器的出现。网络浏览器在计算机屏幕上显示文档，并响应阅读者点击超文本链接以检索其他指定文档。\n\
  \n为了在文档中实现超文本，伯纳斯-李不得不利用一种基于文本的文档格式化系统。对他来说幸运的是，这方面已经完成了大量工作。\n\n### 理解标记语言\n\n\
  标记语言（`Markup languages`）的开发是为了用标准的文档格式化方式取代专有的文字处理软件包，以便它们可以被任何设备读取。国际标准化组织（`ISO`）承担了创建标记语言的挑战，并在\
  \ 20 世纪 80 年代产产了主要基于 `GML` 的标准标记语言（`SGML`）。然而，由于 `SGML` 是为了涵盖所有类型的文档而开发的，它是极其复杂的。\n\
  \n伯纳斯-李利用 `SGML` 中开发的想法创建了一种简化的标记语言。他称其为超文本标记语言（`HTML`）。`HTML` 使用与 `SGML` 相同的标签概念，但它定义的标签较少，使其更容易实现。\n\
  \nHTML 标签的一个示例是 `<h1>`。你使用此标签来定义用作页面标题的文本。只需将文本包围在起始标签 `<h1>` 和结束标签 `</h1>` 之间，如下所示：\n\
  \n```\n<h1>这是我的标题</h1>\n```\n\n当浏览器处理到 `<h1>` 标签时，它就知道要使用不同的样式对嵌入在起始和结束标签之间的文本进行格式化，例如使用较大的字体或粗体字体。\n\
  \n要定义指向另一个文档的超文本链接，你使用 `<a>` 标签：\n\n```html\n<a href=\"anotherdoc.html\">点击此处获取更多信息</a>\n\
  ```\n\n当读者点击“点击此处获取更多信息”文本时，浏览器会自动尝试检索 `<a>` 标签中指定的文档。该文档可能在同一个服务器上，也可以在互联网上任何地方的服务器上。\n\
  \n自从伯纳斯-李创建 HTML 并交给万维网联盟（`W3C`）维护以来，HTML 的开发经历了相当多的变化。表 1-1 显示了该语言所经历的路径。\n\n|\
  \ 版本 | 说明 |\n| --- | --- |\n| HTML 1.0 | 1989 年正式发布，作为 HTML 的第一个公共版本 |\n| HTML 2.0\
  \ | 1995 年发布，增加了交互元素 |\n| HTML 3.0 | 1996 年发布，但从未被广泛采用 |\n| HTML 3.2 | 1997 年发布，增加了对表格的支持\
  \ |\n| HTML 4.01 | 1999 年发布，被广泛采用，并且仍然是一个常用的标准 |\n| XHTML 1.0 | 2001 年发布，将 HTML\
  \  XML 文档格式标准化 |\n| XHTML 1.1 | 2002 年发布，对 XHTML 1.1 进行了更新和修正 |\n| HTML 5.0 | 2014\
  \ 年发布，增加了多媒体功能 |\n\n\n\n\n\nHTML 4.01 标准多年来一直是网站的骨干，今天许多网站仍在使用它。然而，HTML 5.0 版本（简称为\
  \ `HTML5`）是 Web 开发的未来。它提供了额外的功能，允许在网页中嵌入多媒体内容，而无需任何专有的软件插件（例如 `Adobe Flash Player`）。由于多媒体正在席卷世界（问问\
  \ YouTube 就知道了），`HTML5` 变得越来越流行。本书侧重于 `HTML5`；书中包含的所有代码均使用该标准。\n\n## 获取 HTML 文档\n\
  \n除了文档格式标准外，伯纳斯-李（Berners-Lee）还开发了一种在客户端-服务器环境中轻松检索 HTML 文档的方法。`web server` 软件包在服务器的后台运行，监听来自\
  \ `web clients`（即浏览器）的连接请求。浏览器发送请求以从服务器检索 HTML 文档。请求可以匿名发送（不使用登录用户名），也可以由浏览器发送用户名、密码或证书来标识请求者。\n\
  \n这些请求和响应均被定义在`超文本传输协议`（`HTTP`）标准中。`HTTP` 定义了客户端可以发送到服务器的一系列请求，以及服务器用于回复客户端的一系列响应。\n\
  \n本节将带你了解 Web 服务器和 Web 客户端如何使用 `HTTP` 进行交互，从而在互联网上传输网页。\n\n### Web 客户端\n\nWeb 客户端通过标准的网络通信通道（称为\
  \ `TCP port 80`）向 Web 服务器发送请求，该通道定义为 `HTTP` 通信的标准。`HTTP` 使用发送到服务器的标准文本请求，用于向服务器请求信息或向服务器发送信息。表\
  \ 1-2 显示了可用的基础 `HTTP` 客户端请求。\n\n| 请求 | 描述 |\n| --- | --- |\n| `CONNECT` | 将连接转换为用于发送数据的安全隧道\
  \ |\n| `DELETE` | 删除指定的资源 |\n| `GET` | 请求指定的资源 |\n| `HEAD` | 请求指定资源的标题 |\n| `OPTIONS`\
  \ | 获取服务器支持的 `HTTP` 请求 |\n| `PATCH` | 对资源应用修改 |\n| `POST` | 将指定的数据发送到服务器进行处理 |\n\
  | `PUT` | 在指定位置存储指定的数据 |\n| `TRACE` | 将收到的请求发回给客户端 |\n\n表 1-2 `HTTP` 客户端请求\n\n如表\
  \ 1-2 所示，当你从客户端浏览器请求查看网页时，浏览器会向服务器发送 `HTTP` `GET` 请求，并指定网页的文件名。服务器随后返回一个响应码以及请求的数据作为响应。如果客户端在\
  \ `GET` 请求中没有指定文件名，大多数服务器都有一个默认文件进行响应。\n\n### Web 服务器\n\n通过 `HTTP`，Web 服务器必须响应收到的每个客户端请求。如果客户端发送了服务器无法处理的请求，服务器必须向客户端发送某种类型的错误代码，以指示发生了问题。\n\
  \n服务器响应的第一部分是状态码和文本，客户端用它来判断提交的请求是否成功。`HTTP` 响应的格式使用三位状态码，后跟一个浏览器可以的的可选文本消息。这三位代码分为五类：\n\
  \n* `1xx`: 信息性消息\n* `2xx`: 成功\n* `3xx`: 重定向\n* `4xx`: 客户端错误\n* `5xx`: 服务器错误\n\n\
  三位状态码对于了解响应发生了什么至关重要。`HTTP` 标准中定义了许多状态码，提供了关于客户端状态的一些基础信息。表 1-3 显示了你可能会遇到的几个标准 `HTTP`\
  \ 响应码。\n\n| 状态码 | 文本消息 | 描述 |\n| --- | --- | --- |\n| 100 | Continue | 客户端应该发送额外信息。\
  \ |\n| 101 | Switching Protocols | 服务器正在使用不同的协议处理请求。 |\n| 102 | Processing | 服务器正在处理响应。\
  \ |\n| 200 | OK | 服务器接受了请求并返回了响应。 |\n| 201 | Created | 服务器根据请求创建了新资源。 |\n| 202 |\
  \ Accepted | 服务器已接受客户端发送的数据，但尚未完成数据处理。 |\n| 206 | Partial Content | 服务器返回的响应仅是完整数据的一部分；更多内容将在另一个响应中返回。\
  \ |\n| 300 | Multiple Choices | 请求匹配了服务器的多个可能响应。 |\n| 301 | Moved Permanently |\
  \ 请求的文件已移动，不再位于请求的位置。 |\n| 302 | Found | 在另一个位置找到了请求的资源。 |\n| 303 | See Other |\
  \ 在另一个位置找到了请求的资源。 |\n| 304 | Not Modified | 请求的资源自客户端访问以来未修改。 |\n| 307 | Temporary\
  \ Redirect | 请求的资源被临时移动。 |\n| 308 | Permanent Redirect | 请求的资源被永久移动。 |\n| 400 |\
  \ Bad Request | 服务器无法处理该请求。 |\n| 401 | Unauthorized | 需要客户端未提供的身份验证。 |\n| 402 |\
  \ Payment Required | 资源并非免费可用。 |\n| 403 | Forbidden | 需要身份验证，且客户端没有相应的权限。 |\n| 404\
  \ | Not Found | 在服务器上未找到请求的资源。 |\n| 414 | URI Too Long | 描述资源位置的统一资源标识符 (URI) 超过了服务器的处理能力。\
  \ |\n| 415 | Unsupported Media Type | 服务器不知道如何处理请求的资源。 |\n| 429 | Too Many Requests\
  \ | 客户端在特定时间内发送了过多请求。 |\n| 500 | Internal Server Error | 服务器检索资源时发生意外状况。 |\n| 501\
  \ | Not Implemented | 服务器不识别该请求。 |\n| 502 | Bad Gateway | 服务器充当另一个服务器的代理，但接收到了无效响应。\
  \ |\n| 503 | Service Unavailable | 服务器当前不可用，通常由于维护。 |\n| 505 | HTTP Version Not\
  \ Supported | 服务器不支持请求使用的 HTTP 标准。 |\n| 507 | Insufficient Storage | 服务器由于空间不足无法存储资源。\
  \ |\n| 511 | Network Authentication Required | 客户端需要对网络资源进行身份验证以接收响应。 |\n\n表 1-3\
  \ 常见 `HTTP` 服务器响应状态码\n\n### 样式\n\n\n\n\n\nHTML 标准定义了浏览器如何对文本进行基础格式化，但它并没有真正提供方法告诉浏览器如何显示文本。`<h1>`\
  \ 标签指示该文本应该是一个标题，但并没有告诉浏览器具体应该如何显示该标题，使其与页面上的任何其他文本区分开来。\n\n这就是样式（Styling）大显身手的地方。`样式`\
  \ 允许你告诉浏览器文本应该使用什么字体、大小和颜色，以及如何在显示中定位文本。本节将解释样式如何影响你的网页在访问者眼中呈现。\n\n## 样式表\n\n有几种方法可以为\
  \ HTML 文档定义样式。基本的方法是浏览器默认使用的方法。当浏览器看到 HTML 格式标签时（例如 `<h1>` 标签），它有一套预定义的字体、大小和颜色，这些浏览器开发者认为是有用的。\n\
  \n这没关系，但如果你想让某些标题变成黑色，另一些变成红色呢？通过`内联样式（inline styling）`可以实现。`内联样式` 允许你定义仅适用于文档中某个特定标签的特殊样式。例如，要让一个标题变为红色，你会使用以下\
  \ HTML：\n\n```\n<h1 style=\"color: red\">Warning, this is bad</h1>\n```\n\n`style`\
  \ 术被称为 `<h1>` 标签的`属性（attribute）`。你可以直接应用到 HTML 标签的几个不同属性；每个属性都会修改浏览器处理该标签的方式。`style`\
  \ 属性允许你对文档中的此特定 `<h1>` 标签应用任何类型的样式。在这个示例中，我选择了更改文本的颜色。\n\n现在，你可能在想我刚刚又打开了一个麻烦的问题。如果你想对文档中的*所有*\
  \ `<h1>` 标签应用红色怎么办？那将需要编写大量的额外代码！别担心，这有解决方法。\n\n与其插入内联样式，不如你创建一个适用于整个文档的样式定义。这种方法被称为`内联样式（internal\
  \ styling）`。它在 HTML 文档的顶部定义了一组样式，并应用于整个文档。`内联样式`看起来如下：\n\n```html\n<style>\nh1 {color:\
  \ red;}\n</style>\n```\n\n现在，浏览器将使用红色显示文档中所有的 `<h1>` 标签。但等等，还有更多！\n\n对于大型网页来说，样式列表可能会很长，将它们放置在文档顶部可能会变得繁琐。此外，如果你想对网站中的所有网页应用相同的样式，必须重新输入或复制所有文本将是非常累的。为了解决这个问题，你将使用外部样式表。\n\
  \n`外部样式表（external style sheet）` 允许你像内联方法一样定义样式，但是在一个单独的文件中，称为一个`样式表（style sheet）`。任何网页都可以引用同一个样式表，你可以在单个网页上应用多个样式表。你使用\
  \ `<link>` 标签引用外部样式表，如下：\n\n```html\n<link rel=\"stylesheet\" href=\"mystyles.css\"\
  >\n```\n\n当浏览器看到这个标签时，它会下载外部样式表，并将其中定义的样式应用于文档。\n\n这这一切听起来很棒，但事情变得变得复杂了！现在有三个不同的地方可以为\
  \ HTML 文档定义样式，除了浏览器本身做的之外。你该如何知道哪些样式的优先级高于其他？\n\n`级联样式表（Cascading Style Sheet）CSS`标准定义了一组规则，决定了浏览器应该如何将样式应用于\
  \ HTML 文档。顾如其名，样式从高层到低层级联。在较高级规则中定义的样式会覆盖在较低级规则中定义的样式。\n\nCSS 标准定义了九个不同的级别，我在第 2\
  \ 本第 2 章中进行了更详细的介绍，但目前，这里是四个常见的样式级别，按优先级从高到低排序：\n\n*   在元素标签内部定义的样式\n*   在内联样式表中定义的样式\n\
  *   在外部样式表中定义的样式\n*   由客户端浏览器默认定义的样式\n\n因此，你在元素标签中设置的任何样式属性都会覆盖你在内联样式表中设置的任何样式，内联样式又覆盖你在外部样式表中设置的任何样式，而后者又覆盖客户端浏览器默认使用的任何样式。这允许你使用外部样式表为网页设置整体样式，然后使用标准元素标签针对特定情况覆盖这些设置。\n\
  \n![technicalstuff](img/technicalstuff.png) 你可能在好奇辅助技术工具如何工作，为视障人士更改网页显示。我在第 2 本第\
  \ 2 章中涵盖的九条规则的一部分，包含了浏览器为视障查看而定义的任何规则。\n\n## CSS 标准\n\nCSS 标准定义了 HTML 文档基础渲染的核心样式集。CSS\
  \ 的第一个版本（称为 CSS1）于 1996 年发布，它只定义了一些非常初级的样式：\n\n*   字体类型、大小和颜色\n*   文本对齐（如外边距）\n\
  *   背景颜色或图像\n*   边框\n\nCSS 的第二个版本，叫做——你猜吧！——CSS2，于 1998 年发布。它只增加了几项功能：\n\n*   更精确的文本定位\n\
  *   针对不同输出类型的样式（例如打印机）\n*   浏览器功能的样式（如滚动条）\n\n这个列表仍然并不令人深刻。不用说，需要更多内容来丰富网页。为了补偿这一点，许多浏览器开发者开始在\
  \ CSS 标准之外创建自己的样式定义。这些样式定义被称为`扩展（extensions）`。浏览器扩展涵盖了许多不同的功能，例如给边框应用圆角，使布局更平滑。\n\
  \n正如你猜到的，在不同的浏览器中应用不同的扩展会让事情变得更加复杂。与其为 HTML 文档中的元素编写单一样式，你必须用多种方式编写同一功能，以便在不同浏览器中看起来一致。这很快变成了一场噩梦。\n\
  \n当 1999 年开始制定 CSS3 标准时，主题之一是限制大量的浏览器扩展。然而，事情很快变得复杂，因为所有不同的浏览器开发者都希望将自己的扩展包含在标准中。\n\
  \n为了简化过程，CSS 设计委员会将 CSS 标准拆分为不同的模块。每个 CSS 模块涵盖特定的样式领域，如颜色、媒体支持和背景。每个模块可以在不同的时间表下进行投票和发布。这种方法的缺点是，现在每个模块都在不同的时间发布推荐标准，使得\
  \ CSS3 标准难以追踪和实现。\n\nCSS3 最受期待的功能之一可能是定义字体。字体一直是 Web 程序员的噩梦。当你定义特定字体时，该字体必须安装在访问者的计算机上，浏览器才能使用它。如果字体不可，浏览器将选择默认字体，这通常会变成一个糟糕局面。\n\
  \n`网络字体（Web fonts）`允许你在服务器上定义字体，以便每个客户端浏览器都能下载字体并使用它渲染文本。这是一个巨大的成就！你不再依赖于你的网站访问者在浏览器中安装了特定字体。\n\
  \nCSS3 的另一个受欢迎的功能是在文本和其他网页元素（如表单对象）中使用阴影和半透明颜色。这些功能本身就能将一个丑陋的 HTML 表单转变为杰作。\n\n\n\
  \n\n\n`HTML5` 与 `CSS3` 的结合极大地革新了网络世界，让开发者能够创建出令人惊叹的网站。然而，仍然缺少一功能：轻松更改网页上内容的能力。\n\
  \n## 创建动态网页\n\n`静态网页` 包含的信息在网页设计师或程序员手动更改之前，这些信息是不会改变的。在互联网的早期，对于公司来说，仅仅跟上互联网潮流就很重要。公司在网页上发布什么内容并不重要，只要他们拥有互联网存在地，让客户可以在那里获取有关公司及其产品的基本信息即可。仅由\
  \ `HTML` 和 `CSS` 组成的静态网页就能轻松地实现这一功能。\n\n但静态网页的一个大局限性是更新它们需要耗费大量精力。更改静态网页上的单个元素都需要重新构建并加载整个页面，有时甚至是重新一组网页。对于经常需要发布实时信息（如活动、奖项或结业信息）的组织来说，这个过程太繁琐了。此外，在此过程中，开发者可能会无意中更改页面上的其他项目，严重破坏网页上的信息，甚至破坏整个网页的布局！\n\
  \n`动态网页` 允许你轻松地实时更改内容，无需触碰页面的代码。没错：在不手动对页面本身进行任何更改的情况下，页面上的信息就可以改变。这意味着你可以保持页面内容的新颖，访问者现在看到的内容可以在一天、一小时或一分钟后被更新或替换。网页的核心布局可以保持不变，但呈现的数据在不断变化。\n\
  \n要成功创建一个动态网页，你必须学会一种方法，将实时数据自动插入发送到客户端浏览器的 `HTML` 代码中。这就是网页脚本语言用用场。\n\n`网页脚本语言`\
  \ 允许你在网页中插入程序代码，这些代码会动态生成客户端浏览器读取的 `HTML`。处理器读取程序代码并动态生成 `HTML` 以在网页上显示内容，如图 1-1\
  \ 所示。\n\n![image](img/9781119468387-fg010101.png)\n\n图 1-1：嵌入网页中的程序代码。\n\n现在，由于程序代码嵌入在网页中，必须在某个地方运行代码以产生新内容的动态\
  \ `HTML`。事实证明，嵌入的程序代码可以运行在两个地方：\n\n*   在客户端计算机上，在网页浏览器下载网页之后。这被称为`客户端编程`。\n*   在网页服务器上，在网页发送之前。这被称为`服务器端编程`。\n\
  \n本节将介绍这些类型的编程在为你的网站创建动态内容方面有何不同。\n\n### 客户端编程\n\n在客户端编程中，你将程序代码嵌入到服务器发送给客户端浏览器的\
  \ `HTML` 代码中。浏览器必须能够检测到嵌入的程序代码并运行它，既是在浏览器内部运行，也可以作为浏览器外的独立程序运行。图 1-2 展示了这一过程。\n\n\
  ![image](img/9781119468387-fg010102.png)\n\n图 1-2：在网页中使用客户端代码。\n\n### JavaScript\n\
  \n如今，最流行的客户端编程语言是 `JavaScript`。`JavaScript` 是一种脚本语言，你将其嵌入到网页中普通的 `HTML` 代码中。它在客户端浏览器中运行，并可以利用标准\
  \ `HTML` 代码无法访问的浏览器功能。`JavaScript` 代码通常用于生成弹出消息和对话框，人们在查看页面时与这些进行交互。这些是 `HTML` 代码无法生成的元素。\n\
  \n如图 1-2 所示，带有嵌入 `JavaScript` 代码的整个网页被下载到客户端浏览器。客户端浏览器检测到嵌入的 `JavaScript` 代码并相应运行。在执行此操作的同时，还会处理文档中的\
  \ `HTML` 标签并应用任何定义的 `CSS` 样式。对于浏览器来说，要跟上这些工作可真不容易了！\n\n`JavaScript` 的缺点是，因为它运行在客户端浏览器中，所以你受限于每个网页浏览器解释代码的方式。尽管\
  \ `HTML` 语言最初是一个标准，但 `JavaScript` 有些不同。在 `JavaScript` 的早期，不同的浏览器会使用不同的方法实现 `JavaScript`\
  \ 的不同功能。在一个在某种类型的浏览器上运行良好，但在另一种类型的浏览器上完全不起作用的网页并不罕见——这一切都是因为 `JavaScript` 处理的不一致性。\n\
  \n最终，人们付出了标准化 `JavaScript` 的工作。`JavaScript` 语言被 Ecma International 标准组织采用，创建了 `ECMAScript`\
  \ 标准，这现在是 `JavaScript` 的基础。\n\n#### jQuery\n\n`JavaScript` 虽然流行，但它的缺点之一是编程可能相当复杂。由于许多开发者加入了许多功能，今天编写一个\
  \ `JavaScript` 程序可能很快变成一项巨大的工程。\n\n为了解决这个问题，一组开发者联合创建了一套库。\n\n`jQuery` 软件并不是一种独立的编程语言，而是库的集合。这些库是自包含的\
  \ `JavaScript` 函数，你可以在自己的 `JavaScript` 程序中引用它们来执行常用功能，例如在网页上找到某个位置以显示文本，或检索输入 `HTML`\
  \ 表单字段的值。\n\n与其需要编写大量的 `JavaScript` 代码，你只需要引用一两个 `jQuery` 函数让它们为你完成工作。这不仅节省了大量时间，而且是实现仅使用\
  \ `JavaScript` 永远无法实现的高级功能的资源。\n\n### 服务器端编程\n\n网页编程的另一面是`服务器端编程`。服务器端编程语言通过在服务器上运行代码解决了客户端代码解释器不同的问题。在服务器端编程中，网页服务器在发送网页到客户端浏览器之前解释嵌入的程序代码。然后，服务器将程序代码生成的任何\
  \ `HTML` 直接插入网页，然后发送给客户端。服务器负责运行脚本代码的所有工作，因此你可以确保每个网页都能正常运行。图 1-3 阐说明了这一过程。\n\n\
  ![image](img/9781119468387-fg010103.png)\n\n图 1-3：使用服务器端编程创建网页。\n\n\n\n\n\n与客户端编程不同，如今有许多流行的服务器端编程语言，每种语言都有其自身的优缺点。本节将介绍一些流行的编程语言。\n\
  \n### CGI 脚本\n\n服务器端编程支持的早期尝试之一是 Apache Web 服务器的通用网关接口（`CGI`）。`CGI` 在 Web 服务器与底层服务器操作系统（OS，通常是基于\
  \ Unix 的）之间提供了一个接口。\n\n这允许程序员嵌入在 Unix 平台上常用的脚本代码来动态生成 HTML。在 Unix 世界中最常用的、因此在 `CGI`\
  \ 编程中也常用的两种脚本语言是 `Perl` 和 `Python`。\n\n尽管 `CGI` 编程在网页早期非常流行，但并没多久就受到了漏洞利用。一个新手管理员很容易给\
  \ `CGI` 脚本应用错误的权限，从而让资源丰富的攻击者获得服务器的特权访问。因此，必须开发其他处理服务器端编程代码的方法。\n\n### Java\n\n\
  受控的服务器端编程语言的早期尝试之一是 `Java`。虽然 `Java` 编程语言作为创建可以在任何计算机平台上运行的独立应用程序的语言而流行，但它也可以作为服务器端编程语言运行在\
  \ Web 应用程序中。当这样使用时，它被称为 Java Server Pages（`JSP`）。\n\n`JSP` 语言要求你的 Web 服务器嵌入一个 `Java`\
  \ 编译器。Web 服务器检测到 HTML 代码中的 `Java` 代码，然后将其发送到 `Java` 编译器进行处理。`Java` 程序的任何输出都会作为 HTML\
  \ 文档的一部分发送到客户端浏览器。常用的 `JSP` 平台是开源的 Apache Tomcat 服务器。\n\n### Microsoft ASP.NET 家族\n\
  \n微软进入服务器端编程世界的第一个产品——活动服务器页面（`ASP`）——外观和感觉与 `JSP` 类似。`ASP` 程序将 `ASP` 脚本代码嵌入标准 HTML\
  \ 代码中，并要求 `ASP` 服务器与标准的 Internet Internet Services（`IIS`）Web 服务器结合以处理代码。\n\n然而，微软开发者认为没有必要为服务器端\
  \ Web 编程维护一种编程语言，因此他们将服务器端编程和 Windows 桌面编程环境合并为一种技术。随着 `.NET` 系列编程语言的出现，微软发布了用于\
  \ Web 环境的 `ASP.NET` 作为旧 `ASP` 环境的更新。\n\n通过 `ASP.NET`，你可以在 HTML 文档中嵌入任何类型的 Microsoft\
  \ `.NET` 编程代码来生成动态内容。`.NET` 系列语言包括 Visual Basic `.NET`、`C#`、`J#` 甚至 `Delphi.NET`。这允许你利用创建\
  \ Windows 桌面应用程序的相同代码来创建动态网页。你通常可以在 Web 应用程序中使用与 Windows 应用程序中相同的 Windows 功能，例如按钮、滑块和滚动条。\n\
  \n### JavaScript\n\n是的，你没读错。在客户端编程世界中流行的 `JavaScript` 语言现在正开始作为服务器端编程语言取得进展。`Node.js`\
  \ 库允许你在 HTML 页面内部嵌入 `JavaScript` 代码，以便在服务器上进行处理。\n\n使用 `Node.js` 的好处是，你只需要学习一种语言就可以进行客户端和服务器端的编程。尽管它在这个领域仍然相对新，但\
  \ `Node.js` 语言正变得越来越流行。\n\n### PHP\n\n最初作为一个微调 `CGI` 脚本的简单练习，变成了一门席靡全球的新服务器端编程语言。Rasmus\
  \ Lerdorf 编写了个人首页（`PHP`）编程语言，以此改进他的 `CGI` 脚本的工作方式。在得到一些鼓励和帮助后，`PHP` 演变成了自己的编程语言，并有了一个新名字，`PHP`：Hypertext\
  \ Preprocessor（是的，它在名称内部使用了缩写，这被称为递归缩写）。\n\n`PHP` 语言开发者坦言承认，他们从其他流行语言（如 `Perl`、`Python`、`C`\
  \ 甚至 Unix Shell 脚本）中借鉴了许多功能。然而，`PHP` 是专门为服务器端编程开发的，它具有许多其他脚本语言不具备的内置功能。你不需要为了让 `PHP`\
  \ 在 Web 环境中运行而费力复杂的设置或功能。它已经成熟为一套完整的高级功能目录，涵盖了从数据库访问到在网页上绘制图形的所有内容。\n\n由于 `PHP`\
  \ 开发者致力于创建一种一流的服务器端编程语言，而且它是免费的开源软件，`PHP` 迅速成为了互联网世界的宠儿。许多主机托管公司将 `PHP` 作为其基础托管包的一部分。如果你已经在\
  \ Web 托管服务器上有了空间，你可能已经拥有 `PHP` 的权限了！\n\n### 结合客户端和服务器端编程\n\n客户端和服务器端编程都有优缺点。与其尝试只选择一种创建动态网页的方法，你不如同时使用两者！\n\
  \n你可以轻松地将客户端和服务器端编程代码嵌入同一个网页并在服务器上运行，如图 1-4 所示。\n\n![image](img/9781119468387-fg010104.png)\n\
  \n图 1-4： 结合客户端和服务器端编程。\n\n\n\n\n\n* `PostgreSQL`: PostgreSQL 数据库服务器是一个开源项目，尝试实现商业数据库中发现的许多高级功能。在早期，`PostgreSQL`\
  \ 有着速度较慢的声誉，但它已经取得了巨大的改进。遗憾的是，旧有的声誉很难消除，`PostgreSQL` 仍在努力克服这些刻印象。\n\n* `MySQL`:\
  \ MySQL 数据库服务器是另一个开源项目。与 `PostgreSQL` 不同，它并不试图匹配商业软件包的所有功能。相反，它专注于速度。`MySQL` 以处理简单数据插入和查询速度极快而闻名——非常适合快节奏的\
  \ Web 应用世界。\n\n正因为速度快，`MySQL` 数据库服务器已成为动态 Web 应用存储数据的流行工具。此外，因为它是一个开源项目，网站托管公司可以免费安装，这使得它与\
  \ `PHP` 服务端编程语言成为动态 Web 应用程序的完美组合。\n\n# 第 2 章：使用 Web 服务器\n\n## 本章内容\n\n![check](img/check.png)\
  \ **探索你的开发选项**\n\n![check](img/check.png) **选择开发环境**\n\n![check](img/check.png)\
  \ **配置服务器**\n\n在开始开发动态 Web 应用程序之前，你需要一个可以运行的 Web 服务器环境。你有许多不同的选择来创建自己的开发环境，但有时选项越多只会让事情变得更加混乱。本章将介绍你创建开发环境时提供的各种选项。\n\
  \n## 识别需求\n\n就像那些需要组装的著名家具一样，你需要组装一些独立的组件才能让你的 Web 应用开发环境运行起来。你的 Web 开发环境主要需要组装三个三个部分：\n\
  \n* 一个 Web 服务器，用于处理来自浏览器的请求并与你的应用程序交互\n* 一个 `PHP` 服务器，用于运行你应用程序中的 `PHP` 服务端编程代码\n\
  * 一个数据库服务器，用于存储动态应用程序所需的数据\n\n从表面上看，这似乎相当简单，但增加复杂的是，这些每个部分都有不同的选项和版本可用。这可能导致产生几百种不同的组合供你筛选！\n\
  \n本节将通过仔细查看这三个需求中的每一个，帮助你保持理智。\n\n### Web 服务器\n\nWeb 服务器是与网站访问者交互的媒介。它将他们的请求传递给你的\
  \ Web 应用，并将应用程序的响应返回给他们。Web 服务器充当文件服务器——它接受客户端浏览器对 `PHP` 和 `HTML` 文件的请求，然后检索这些文件并将其发送回客户端浏览器。正如我在上一章中解释的，Web\
  \ 服务器使用 `HTTP` 标准允许对服务器上文件的匿名访问请求，并响应这些请求。\n\n如今有许多不同的 Web 服务器选项。以下是你可能会遇到的几个最流行的：\n\
  \n* `Apache`: Web 服务器的“老祖父”，`Apache` 派生于伊利诺伊大学开发的原始 Web 服务器。它是一个开源软件项目，过去是、目前也是互联网上最常用的\
  \ Web 服务器。它非常多功能，并支持许多不同的特性，但多功能也伴随着复杂性。试图理清 `Apache` Web 服务器的配置文件可能会让人困惑。但对于大多数\
  \ Web 环境，你只需要更改几个默认配置设置即可。\n\n* `nginx`: 领域的新秀，`nginx` 旨在简化 `Apache` Web 服务器的一些复杂性并提供改进的性能。它目前正越来越流行，但在赶\
  \ `Apache` 方面还有很长的路要走。\n\n* `lighthttpd`: 正如其名，lighthttpd` 是一个轻量级 Web 服务器，其功能性和复杂性远低于\
  \ `Apache` Web 服务器。它在小型开发环境中运行良好，并在需要具有小足迹 Web 服务器的嵌入式系统中变得流行。然而，它在大规模生产级 Web 服务器环境中表现并不好，可能不是\
  \ Web 开发环境的良好选择。\n\n* `IIS`: `IIS` 是微软官方的 Web 服务器。它在微软 Windows 服务器环境中很流行，但没有其他操作系统的版本。`IIS`\
  \ 专注于支持微软的 `.NET` 系列服务端编程语言，例如 `C# .NET` 和 `Visual Basic .NET`，但它可以与 `PHP` 服务器接口。不过，这种配置并不常见，你不会看到很多利用\
  \ `IIS` Web 服务器的 `PHP` 服务器。\n\n从这些描述中可以看出，几乎每个 Web 服务器都会与 `Apache` Web 服务器相比。`Apache`\
  \ 已经成为互联网 Web 服务器的黄金标准。除非你有不使用 `Apache` Web 服务器的特定原因，否则你应该在开发环境中使用它，特别是如果你知道你的生产\
  \ Web 服务器环境将使用它时。\n\n### PHP 服务器\n\n`PHP` 编程语言于 1995 年作为 Rasmus Lerdorf 的个人项目开始，帮助他的网页访问存储在数据库中的数据。他在\
  \ 1995 年 6 月 8 日向开源社区发布了第一个正式版本 `1.0`。\n\n从那时起，`PHP` 语言就有了自己的生命，在功能和流行度上都在增长。`PHP`\
  \ 语言的发展目前由 `Zend` 支持，它生产了许多 `PHP` 工具。\n\n`PHP` 服务器最令人困惑的方面之一是目前有两个不同的活跃支持的 `PHP`\
  \ 语言分支：\n\n* `5.x` 版本分支\n* `7.x` 版本分支\n\n经常脑海中的第一个问题是：“版本 6 怎么了？” `PHP` 短命的版本 `6`\
  \ 有一些无法解决的问题，并被 `PHP` 开发者正式废弃，新功能被回滚到了版本 `5`。\n\n现在是第二个问题：“为什么有两个活跃版本？” `5.x` 分支仍然被维护，主要是因为有大量的应用程序继续使用\
  \ `5.x` 支持但 `7.x` 不支持的特性。所有旧的 `5.x` 迁移到 `7.x` 还需要一些时间。遗憾的是，`PHP` 版本 `7` 破坏了许多在 `5.x`\
  \ 中流行的特性。然而，`PHP` 开发者不再对 `5.x` 分支进行错误修复，只提供安全补丁。在写作期间，`5.x` 分支的当前版本是 `5.4`，并将一直维护到\
  \ 2018 年底。\n\n在写作期间，许多流行的 Web 服务器软件包同时支持 `5.x` 和 `7.x` 版本分支，并让你选择在安装时使用哪一个。如果你正在开发新的\
  \ Web 应用程序，最好使用 `7.x` 版本分支；在写作期间，最新版本是 `7.2`。\n\n`PHP` 服务器包含自己的内置 Web 服务器，但那仅用于开发，而不用于实时的生产\
  \ Web 服务器。对于大规模使用，你必须将 `PHP` 服务器与 Web 服务器接口。当 Web 服务器接收到 `.php` 文件的请求时，它必须将其传递给\
  \ `PHP` 服务器进行处理。你需要在 Web 服务器配置中设置此功能。这将在本章稍后的“自定义 Apache Web 服务器”部分讨论。\n\n![warning](img/warning.png)\
  \ 你可能仍然遇到一些使用 PHP 版本 4 的网站托管公司。这是一个非常流行且运行了很久的版本，但 PHP 不再对其提供安全补丁支持。最好远离任何仅支持 PHP\
  \ 版本 4 的 Web 主机。\n\n\n\n\n正如我在本微书的第 1 章中所描述的，有许多类型的数据库服务器来处理 Web 应用程序的数据。到目前，开源\
  \ Web 应用程序中最流行的是 `MySQL` 服务器。\n\n许多网站和 Web 程序包都使用 `MySQL Server` 术语，但实际上有几个不同的版本。由于\
  \ Oracle 在 2010 年收购了 `MySQL` 项目，它将该项目分为了四个版本：\n\n*   `MySQL Standard Edition`（MySQL\
  \ 标准版）：提供最基础 `MySQL` 数据库功能的商业产品。\n*   `MySQL Enterprise Edition`（MySQL 企业版）：提供额外支持、监控和维护功能的商业产品。\n\
  *   `MySQL Cluster Carrier Grade Edition`（MySQL 集群载级版）：除了包含企业版功能外，还支持多服务器集群的商业产品。\n\
  *   `MySQL Community Edition`（MySQL 社区版）：免费下载的 `MySQL` 版本，支持与标准版相同的功能，但不提供正式支持。\n\
  \n如你从列表所示，`MySQL` 服务器既有商业版也有开源版。商业版支持开源版中没有的一些高级功能，例如热备份、数据库活动监控以及在多台服务器上实现读/写数据库集群。这些高级功能在大规模数据库环境中可能大有用处，但对于大多数中小型数据库应用程序，`MySQL\
  \ Community Edition` 就完全足够了。这通常是大多数 Web 服务器程序包中包含的内容。\n\n与 PHP 一样，`MySQL` 项目维护着多个版本的\
  \ `MySQL` 服务器软件。在编写本文时，当前支持的 `MySQL` 版本有：\n\n*   版本 5.5\n*   版本 5.6\n*   版本 5.7\n\
  \n每个版本对 `MySQL` 数据库引擎都有一些细微更新，但对于大多数动态 Web 应用程序，这些差异对你的应用程序性能或功能不会产生显著影响，因此你的系统使用这三个版本中的某一个并不重要。\n\
  \n几家云提供商（包括 Oracle 本身）提供 `MySQL` 服务器作为云服务。你不需要安装和运行自己的 `MySQL` 服务器，而可以在他们的 `MySQL`\
  \ 云服务器上租空间。在云端运行 `MySQL` 的优势是，你可以保证数据库完美的运行时间，因为它是分布在云端多台服务器上的。然而，缺点是这可能会很昂贵，并且仅推荐用于需要云提供的额外服务器能力的商业\
  \ Web 应用程序。\n\n## 考虑你的服务器选项\n\n现在你已经知道开发工作需要一个 Web 服务器、一个 PHP 服务器和一个 `MySQL` 服务器，下一步是尝试找到一个支持这三者的环境（如果它们都是集成的会更有帮助）。设置完整的\
  \ Web 编程开发环境，你基本上有三种选择：\n\n*   从 Web 托管公司购买商业服务器空间。\n*   在自己的自己的工作站或服务器上安装这些独立的服务器。\n\
  *   安装一个将这三个服务器打包在一起的一体包。\n\n接下来的章节将介绍这些这些场景以及各自的优缺点。\n\n### 使用 Web 托管公司\n\n到目前，设置\
  \ PHP 编程环境最简单的方法是在现有的服务器上租空间，该服务器已经安装了所有必要的组件。许多公司提供 PHP Web 开发包。其中一些流行的有：\n\n*\
  \   GoDaddy (`www.godaddy.com`)\n*   HostGator (`www.hostator.com`)\n*   1&1 (`www.1and1.com`)\n\
  *   000host (`www.000host.com`)\n\n到目前，设置 PHP 编程环境最简单的方法是在现有的服务器上租空间，该服务器已经安装了所有必要的组件。许多公司提供\
  \ PHP Web 开发包。其中一些流行的有：\n\n*   GoDaddy (`www.godaddy.com`)\n*   HostGator (`www.hostator.com`)\n\
  *   1&1 (`www.1and1.com`)\n*   000host (`www.000host.com`)\n\n### 构建你自己的服务器环境\n\n\
  我不建议在上线生产网站上这样做，但对于开发工作，你可以构建你自己的服务器环境。对于个人开发环境，你甚至不需要大型服务器——你可以使用现有的工作站或笔记本电脑来构建它。\n\
  \n接下来的章节将介绍你在 Linux 或 Windows/Mac 环境中让其运行所需的基础知识。\n\n#### Linux 中的 Web 服务器\n\nLinux\
  \ 桌面和服务器现在变得越来越流行，尤其是对于 Web 开发。你可以下载 Apache、MySQL 和 PHP 服务器的源码包并在你的 Linux 系统上编译它们，但除非你需要绝对的最新版本，否则这并不是推荐的方法。\n\
  \n如今，大多数 Linux 发行版都包含了可以轻松安装完整 Web 开发环境所需的所有组件的包。对于基于 Debian 的 Linux 发行版（如 Ubuntu\
  \ 和 Linux Mint），你使用 `apt-get` 命令行工具安装软件包。对于基于 Red Hat 的 Linux 发行版（如 Red Hat、CentOS\
  \ 和 Fedora），你使用 `dnf` 命令行工具。\n\n对于基于 Debian 的系统（如 Ubuntu），按照以下步骤操作：\n\n1.  从命令行提示符通过以下命令安装\
  \ Apache Web 服务器：\n```bash\nsudo apt-get install apache2\n```\n\n2.  使用以下命令安装 服务器包：\n\
  ```bash\nsudo apt-get install mysql-server\n```\n\n\n\n\n### 3. 安装 PHP 软件包以安装 PHP\
  \ 服务器和所需的扩展、运行 PHP 的 Apache 修正模块，以及图形化的 phpMyAdmin 工具：\n\n```bash\nsudo apt-get\
  \ install php libapache2-mod-php\nsudo apt-get install php-mcrypt php-mysql\nsudo\
  \ apt-get install phpmyadmin\n```\n\n第一行安装主 PHP 服务器，以及与 PHP 服务器建立接口的 Apache 模块。第二行安装与\
  \ MySQL 服务器建立接口所需的两个 PHP 扩展。第三行安装基于 Web 的 `phpMyAdmin` PHP 程序，它为 MySQL 服务器提供了一个\
  \ Web  界面。\n\n#### 4. 打开浏览器并访问以下 URL 进行一些测试：\n\n`http://localhost/phpmyadmin`\n\n\
  你应该会看到 `phpMyAdmin` 管理窗口。\n\n### 5. 使用 MySQL root 用户账户以及你在安装 MySQL 时提供的密码进行登录（你还记得吧？）。\n\
  \n图 2-1 显示了 `phpMyAdmin` 的主 Web 页面，显示了正在运行的 Apache、`PHP` 和 `MySQL` 服务器的版本。\n\n![image](img/9781119468387-fg010201.png)\n\
  \n图 2-1： 显示所有正在运行内容的 `phpMyAdmin` 主 Web 页面。\n\n对于基于 Red Hat 的系统（如 Fedora 和 CentOS），请按照以下步骤加载\
  \ LAMP：\n\n#### 1. 从命令行提示符，使用以下命令安装 Apache Web 服务器：\n\n```bash\nsudo dnf install\
  \ httpd\nsudo systemctl enable httpd\nsudo systemsctl start httpd\n```\n\n`httpd`\
  \ 软件包包含了 `Apache2` Web 服务器。Apache 的可执行文件命名为 `httpd`（因此，软件包名称也由此而来）。该软件包默认不会启动 Apache\
  \ Web 服务器，因此后两行使用 `systemctl` 工具启用该服务，使其在启动启动时自动启动，然后启动它。\n\n#### 2. 使用以下命令安装 MySQL\
  \ 服务器软件包：\n\n```bash\nsudo dnf install mariadb-server\nsudo systemctl enable mariadb\n\
  sudo systemctl start mariadb\n```\n\n注意，Red Hat 发行版（因此 CentOS 和 Fedora）已经采用了 `MariaDB`\
  \ 替代软件包来代替 `MySQL`。当你安装 `MariaDB` 时，软件包会将 root 用户账户密码设置为空字符串。如果你的服务器位于任何类型的网络中，则是不建议这样做的。幸运的是，有一个快速工具可以运行它来更改\
  \ root 用户账户的密码：\n\n```bash\nmysql_secure_installation\n```\n\n当你运行此脚本时，它会提示你回答几个问题，例如\
  \ root 用户账户的新密码、是否限制 root 用户账户仅允许从本地主机登录、是否移除匿名用户功能，以及是否移除测试数据库。\n\n#### 3. 使用以下命令安装\
  \ PHP 软件包：\n\n```bash\nsudo dnf install php php-mbstring php-mysql\nsudo dnf install\
  \ phpmyadmin\nsudo systemctl restart httpd\n```\n\n`PHP` 服务器并不作为自己的服务运行——Apache\
  \ Web 服务器会在需要时派生它。正因如此，你确实需要使用 `systemctl` 工具重启 Apache Web 服务器，使其重新读取带有新 `PHP` 设置的配置文件。\n\
  \n#### 4. 打开浏览器并访问以下 URL 进行一些测试：\n\n`http://localhost/phpmyadmin`\n\n你应该看到 `phpMyAdmin`\
  \ 登录页面。\n\n#### 5. 使用 MySQL 中的 `root` 用户账户以及你安装 MySQL 时定义的密码登录。\n\n图 2-2 显示了在 CentOS\
  \ 7 系统上运行的 `phpMyAdmin`。\n\n![image](img/9781119468387-fg010202.png)\n\n图 2-2： 在\
  \ Fedora 27 上查看 `phpMyAdmin` 主 Web 页面。\n\n![tip](img/tip.png) 通过使用每个服务器的发行软件包，你可以确保服务器会在你的\
  \ Linux 环境中正确运行。额外的好处是，发行版软件更新将自动包含为服务器发布的任何安全补丁或错误修复。\n\n### Windows 和 Mac 中的 Web\
  \ 服务器\n\n在 Windows 或 Mac 环境中安装和运行 Apache、`MySQL` 和 `PHP` 服务器是非常复杂的，因为在安装和配置它们时涉及许多因素。首先，Windows\
  \ 和 macOS 都带有一个 Web 服务器，所以如果你安装了 Apache Web 服务器，你将需要配置它以使用备选的 TCP 端口。\n\n同样，macOS\
  \ 默认包含较旧版本的 `PHP`，因此如果你安装了更新版本的 `PHP`，在尝试哪个版本处于激活状态时会变得棘手。由于这些复杂性，不建议初学者在 Windows\
  \ 和 Mac 环境中单独安装 Apache、`MySQL` 和 `PHP` 软件包。有一种更简单的方法。\n\n### 使用预制服务器\n\n在 Windows\
  \ 中（称为 WAMP）或 Mac 中（称为 MAMP）将 Apache、`MySQL` 和 `PHP` 服务器整合可能非常复杂。幸运的是，有些资源丰富的程序员已经为我们完成了！常见的有几种：\n\
  \n*   **XAMPP**: 一个支持 `PHP` 服务端编程的集成软件包。它拥有 Windows、Mac 和 Linux 的软件包。\n*   **Wampserver**:\
  \ 一个基于 Windows 的集成软件包，允许你同时安装多个版本的服务器。\n*   **MAMP**: 一个基于 Mac 的集成软件包，安装简单。它还有一个名为\
  \ MAMP Pro 的商业软件包，提供了额外功能。\n\n在这些中，XAMPP 软件包最受欢迎。它由 Apache Friends 组织创建，旨在促进在开发环境中使用\
  \ Apache Web 服务器。按照以下步骤在 Windows 或 macOS 环境中安装 XAMPP：\n\n1.  打开浏览器访问 [`www.apachefriends.org`](https://www.apachefriends.org)。\n\
  2.  找到网页的下载部分并点击适用于你操作系统的链接。\n3.  下载完成后，在你的操作系统环境中运行下载的文件。这将启动 XAMPP 安装向导。\n4. \
  \ 点击 Next 按钮进入图 2-3](#06_9781119468387-bk01ch02.xhtml_c02-fig-0003 所示的组件选择窗口。该窗口允许你选择想要安装的\
  \ XAMPP 组件。本书不会用到 XAMPP 中的所有内容，但你可以随意安装整个软件包并自行探索！\n5.  点击 Next 按钮继续安装。\n6.  为 XAMPP\
  \ 选择安装文件夹。Windows 的默认位置为 `c:\\xampp`；macOS 为 `/Applications/XAMPP`。这些位置对于两个环境都可以正常工作。\n\
  7.  点击 Next 按钮继续安装。\n\nApache Friends 组织已与 Bitnami 合作，Bitnami 专门针对 XAMPP 使用预包了许多流行的\
  \ Web 应用程序。\n\n\n\n\n\n8. **通过勾选“Learn More about Bitnami”复选框了解更多关于 Bitnami 的信息；如果您想跳过此步骤，请取消勾选该框，然后点击“Next”按钮继续。**\n\
  \n9. **点击“Next”按钮开始软件安装。**\n\n10. **您可以勾选复选框以启动 XAMPP，然后点击“Finish”按钮结束向导。**\n\n\
  ![image](img/9781119468387-fg010203.png)\n\n图 2-3: 安装向导中的 XAMPP 选择组件窗口。\n\nXAMPP\
  \ 控制面板提供了可以方便地启动、停止和配置 XAMPP 包中包含的每个服务器。图 2-4 显示了主控制面板窗口。\n\n![image](img/9781119468387-fg010204.png)\n\
  \n图 2-4: 主 XAMPP 控制面板窗口。\n\n默认情况下，XAMPP 配置 Apache Web 服务器使用 TCP 端口 `80` 进行 HTTP\
  \ 连接。遗憾的是，此端口通常被 Windows 和 Mac 工作站及服务器上内置的 Web 服务器占用。当您首次启动 XAMPP 控制面板时，会产生错误消息，如图图\
  \ 2-4 所示。\n\n你可以将 Apache Web 服务器移动到备用 TCP 端口。只需按照以下步骤操作：\n\n1. **在 XAMPP 控制面板主窗口，点击\
  \ Apache Web 服务器的 `Config` 按钮。**\n2. **选择菜单选项编辑 `httpd.conf` 配置文件。**\n   这会在文本编辑器中打开\
  \ Apache Web 服务器配置文件。\n3. **查找此行：**\n   `Listen 80`\n4. **将该行中的 `80` 改为 `8080`，这是一个用于\
  \ HTTP 通信的常用备用 TCP 端口。**\n5. **在编辑器中保存更新配置文件，然后退出编辑器窗口。**\n6. **点击 Apache Web 服务器的\
  \ `Start` 按钮。**\n   Apache Web 服务器应显示它已启动并正在同时使用 TCP 端口 `443`（用于 HTTPS）和 `8080`（用于\
  \ HTTP）。\n7. **点击 MySQL 数据库服务器的 `Start` 按钮。**\n   MariaDB 数据库服务器应显示它已启动并正在使用 TCP\
  \ 端口 `3306`（MySQL 的默认 TCP 端口）。\n\n在 Apache 和 MySQL 服务器启动后，您就可以退出 XAMPP 控制面板。如果需要停止服务器，请重新打开\
  \ XAMPP 控制面板并点击两个服务器的 `Stop` 按钮。\n\n![tip](img/tip.png) 尽管你已经在配置文件中移动了 Apache Web\
  \ 服务器，但在你启动 XAMPP 控制面板时，它仍然会检查 TCP 端口 `80` 是否可用，并抱怨其不可用。要停止这一，点击控制面板中的 `Config`\
  \ 按钮，然后取消勾选 `Check Default Ports on Startup` 复选框。\n\n## 调优服务器\n\n当你在开发环境中安装 Apache、MySQL\
  \ 和 PHP 服务器后，你可能需要进行微调，以使它们按照你想要的方式运行。每个服务器都使用文本配置文件来定义服务器的行为。接下来的章节将引导你如何找到配置文件，以及你可能需要为你的开发环境进行调优的一些设置。\n\
  \n### 自定义 Apache 服务器\n\n默认情况下，Apache Web 服务器使用 `httpd.conf` 配置文件存储其设置。对于 Linux 和\
  \ Mac 系统，该文件通常存储在 `/etc` 目录结构中，通常位于 `/etc/httpd` 或 `/etc/apache2` 下。\n\n![tip](img/tip.png)\
  \ XAMPP 包将 Apache 配置安装在 Windows 的 `c:\\xampp\\apache\\conf` 文件夹，或 macOS 的 `/Applications/XAMPP/apache/conf`\
  \ 中。\n\n`httpd.conf` 配置文件包含称为 `directives`（指令）的单独行。每条指令都定义了一个配置选项以及你设置的值。\n\nApache\
  \ Web 服务器功能非常强大，有很多不同的选项和功能。缺点是这起初可能让配置看起来很复杂，但配置文件的组织方式使你能够相对容易地找到你需要的内容。在接下来的章节中，我将介绍你需要注意的重点。\n\
  \n![warning](img/warning.png) 许多系统将 Apache Web 服务器配置拆分为多个文件，以帮助功能更加模块化。在主 `httpd.conf`\
  \ 文件中查找 `Include` 指令行，以查看其他文件包含了 Apache Web 服务器的配置设置。\n\n#### 定义 Web 文件夹位置\n\nApache\
  \ Web 服务器的主要工作是远程客户端提供文件。然而，你不想让任何人都能获取服务器上的任何文件。\n\n你使用 `DocumentRoot` 指令设置 Apache\
  \ 服务器提供服务的文件夹：\n\n```\nDocumentRoot \"c:\\xampp\\htdocs\"\n```\n\n对于 macOS，它位于 `/Applications/XAMPP/htdocs`。对于\
  \ Linux，通常是 `/var/www/html`。\n\n#### 设置默认端口\n\nApache Web 服务器使用不同的 TCP 端口监听连接：\n\
  \n* `80` 用于 HTTP\n* `443` 用于 HTTPS\n\nHTTPS 使用加密来保护浏览器与服务器之间的通信。你使用 `Listen` 指令设置\
  \ Apache 接受的端口：\n\n```\nListen 80\nListen 443\n```\n\n#### 与 PHP 服务器交互\n\nApache\
  \ 服务器必须知道如何将包含 PHP 代码的文件传递给 PHP 服务器。这是一个步骤步骤。\n\n首先，你必须告诉 Apache 服务器加载 PHP 服务器，以便在\
  \ Apache 和 PHP 之间建立连接。你使用 `LoadModule` 指令来实现：\n\n```\nLoadModule php7_module \"\
  c:\\xampp\\php\\apache2_4.dll\"\n```\n\n在 Apache 加载 PHP 模块后，你必须告诉它什么类型的文件发送到 PHP\
  \ 服务器。你使用 `AddHandler` 指令：\n\n```\nAddHandler application/x-httpd-php .php\n```\n\
  \n此指令告诉 Apache 服务器将所有 `.php` 扩展的文件转发给 PHP 模块，然后由其转发到 PHP 服务器处理。\n\n#### 跟踪错误\n\n\
  在开发环境中工作时，跟踪应用程序发生的任何错误总是很有用的。Apache 服务器支持不同级别的错误消息，如表 2-1 所示。\n\n| 错误级别 |  |\n\
  | --- | --- |\n| `emerg` | 致命错误将停止 Apache Web 服务器。 |\n| `alert` | 严重错误将对你的应用程序产生不利影响，应立即解决。\
  \ |\n| `crit` | 关键状况导致操作失败，例如无法访问网络。 |\n| `error` | 会话中发生错误，例如无效的 HTTP 头部。 |\n\n\
  \n\n\n\n| `warn` | 会话中发生了轻微问题，但并未阻止其继续。 |\n| `notice` | 发生了非正常情况。 |\n| `debug` |\
  \ 服务器在处理请求时，每一步操作都会产生一条低级别的详细信息。 |\n\n表 2-1 Apache Web 服务器错误级别\n\n你使用 `LogLevel`\
  \ 指令来定义错误跟踪的级别，并使用 `ErrorLog` 指令来定义错误日志的位置：\n\n```\nLogLevel warn\n```\n\n```\n\
  ErrorLog logs/error.log\n```\n\n`debug` 日志级别对于排故障问题很有用，但不建议在正常活动中使用，因为它产生了大量的输出！\n\
  \n![tip](img/tip.png) 你可以使用 `LogFormat` 指令来自定义日志消息的外观。Apache 允许你确定具体哪些信息会出现在日志文件中，这在尝试排排除特定问题时非常方便。请查阅\
  \ Apache 服务器文档以了解用于自定义日志的各种可用选项。\n\n### 自定义 MySQL 服务器\n\nMySQL 服务器使用两个不同的文件名来存储配置设置：\n\
  \n* `my.cnf` 用于 Linux 和 Mac 系统\n* `my.ini` 用于 Windows 系统\n\nMySQL 服务器较令人困惑的特性之一是有三种方法可以指定配置设置：\n\
  \n* 在从源码构建时，它们可以被编译到可执行的服务器程序中。\n* 它们可以在服务器启动时作为命令行选项指定。\n* 它们可以在 MySQL 配置文件中设置。\n\
  \n你可以将所有需要的设置编译到 MySQL 可执行服务器程序中，并在完全不使用配置文件的情况下运行（这是 MAMP 一体包采用的方法）。这种方法的缺点是很难确定哪些设置被设置成了什么值。\n\
  \n大多数 MySQL 服务器安装都结合使用了：将一些基本设置编译到可执行的服务器程序中，并为其余设置创建一个基础配置文件。配置文件中设置的设置值将覆盖任何编译到可执行服务器程序中的设置或在命令行上设置的设置。\n\
  \n与 Apache Web 服务器一样，MySQL 数据库服务器有许多可以在配置文件中更改的选项，以微调其工作方式。尽管如此，在正常设置下，你可能只需要调整少数几项。接下来的章节将带你了解你应该熟悉的某些设置。\n\
  \n#### 核心服务器设置\n\n核心服务器设置定义了 MySQL 服务器运行的基础。在 Windows 版 XAMPP 安装中，这些设置如下：\n\n```\n\
  [mysqld]\nport = 3306\nsocket = \"C:/xampp/mysql/mysql.sock\"\nbasedir = \"C:/xampp/mysql\"\
  \ntmpdir = \"C:/xampp/mysql/tmp\"\ndatadir = \"C:/xampp/mysql/data\"\nlog_error\
  \ = \"mysql_error.log\"\n```\n\n`port` 设置定义了 MySQL 服务器监听传入请求的 TCP 端口。`socket` 设置定义了套接文件的位置，本地客户端可以使用它在不使用网络的情况下与\
  \ MySQL 服务器通信。\n\n`basedir`、`tmpdir` 和 `datadir` 设置定义了 MySQL 用于存储工作文件的服务器位置。`datadir`\
  \ 设置定义了 MySQL 存储实际数据库文件的位置。\n\n#### 使用 InnoDB 存储引擎\n\nInnoDB 存储引擎为 MySQL 服务器提供了高级数据库功能。它有自己的套配置设置，可以精确控制它的运行方式以及如何处理使用该存储引擎的表中的数据。\n\
  \n对于你特定的 MySQL 服务器安装，你可能需要调整两个主要的配置设置：\n\n```\ninnodb_data_home_dir = \"C:/xampp/mysql/data\"\
  \ninnodb_data_file_path = ibdata1:10M:autoextend\n```\n\n`innodb_data_home_dir`\
  \ 设置定义了 MySQL 存放 InnoDB 存储引擎所需文件的位置。这允许你在需要时将这些文件与普通的 MySQL 数据库文件分开。\n\n`innodb_data_file_path`\
  \ 设置定义了存储引擎的三个部分信息：\n\n* MySQL 用于主 InnoDB 存储文件的文件名\n* 存储文件的初始大小\n* 当存储文件填满时会发生什么\n\
  \n为了帮助加速数据存储过程，InnoDB 存储引擎会在系统硬盘上为数据库存储文件预分配空间。这样，对于插入表中的每条数据记录，存储引擎都不需要向操作系统请求更多磁盘空间来添加到数据库文件中——空间已经在那里了！这极大地加快了数据库性能。第二个参数定义了\
  \ InnoDB 存储引擎分配的初始磁盘空间量。\n\n第三个参数是有趣的地方。它定义了当为存储文件分配空间满时 InnoDB 存储引擎会做什么。默认情况下，当\
  \ InnoDB 存储引擎用尽分配的存储空间时，它将阻止向表插入新数据。你必须手动扩展存储文件的大小。\n\n当你指定 `autoextend` 设置时，它允许\
  \ InnoDB 存储引擎自动为文件分配更多空间。这很方便，但在某些环境中可能是危险的。InnoDB 存储引擎将根据需要不断分配更多存储空间，直到服务器耗尽磁盘！\n\
  \n![warning](img/warning.png) 当你在 MySQL 应用中使用 InnoDB 存储引擎时，密切关注存储文件夹始终是一个好主意，确保它没有占用所有空间。\n\
  \n### 自定义 PHP 服务器\n\nPHP 服务器配置文件名为 `php.ini`，但它可以位于多个不同的区域。PHP 服务器检查的路径（按顺序）：\n\n\
  * Apache 服务器配置文件中 `PHPDir` 指令指定的路径\n* 系统环境变量 `PHPRC` 指定路径\n* 对于 Windows 系统，注册表 `HKEY_LOCAL_MACHINE/Software/PHP`\
  \ 下 `IniFilePath` 指定路径\n* PHP 可执行文件所在的文件夹\n* 操作系统文件夹，Windows 为 `c:\\winnt`，Linux\
  \ 为 `/usr/local/lib`\n\nXAMPP 安装程序将 `php.ini` 文件放置在 `c:\\xampp\\apache\\bin` 文件夹中。\n\
  \n如果你不确定 PHP 服务器使用的是哪个 `php.ini` 配置文件，可以在一个小型 PHP 程序中运行 `phpinfo()` 函数。为了方便起见，所有流行的一体包都提供了从其主页面运行\
  \ `phpinfo()` 函数的链接。图 2-5 显示了在 Windows 系统上运行 XAMPP 的 `phpinfo()` 输出。\n\n![image](img/9781119468387-fg010205.png)\n\
  \n图 2-5： `phpinfo()` 输出。\n\n`phpinfo()` 函数显示每个配置文件设置的系统值，以及是否有本地设置覆盖。查找 `Loaded\
  \ Configuration File` 条目所显示的活动 `php.ini` 文件的路径，以查看该文件对于你的 PHP 服务器位于何处。\n\n正如你所想象的，`php.ini`\
  \ 配置文件中有很多可用设置。以下是你可能在 PHP 服务器上需要调整的一些 `php.ini` 设置（以及 XAMPP 中设置的默认值）：\n\n* `date.timezone\
  \ = Europe/Berlin`: 定义了 PHP 服务器时区。这必须使用 [`http://php.net/manual/en/timezones.php`](http://php.net/manual/en/timezones.php)\
  \ 中定义的时区值。\n* `display_errors = On`: 定义了 PHP 错误消息是否出现在网页上。此功能对于开发工作极其有用，但在生产服务器上应禁用。\n\
  \n\n\n\n\n* `error_reporting = E_ALL & ~E_DEPRECATED`: 设置 PHP 器的错误报告级别。PHP 使用复杂的位模式来设置要显示或不显示哪些错误。它使用标签来指示错误级别，并使用布尔位运算符来组合这些级别——波浪号\
  \ (`~`) 表示 `NOT` 运算符。错误级别如下：\n\n    * `E_ERROR`: 致命运行时错误\n    * `E_WARNING`: 不会停止脚本的运行时警告\n\
  \    * `E_PARSE`: 语法解析错误\n    * `E_NOTICE`: 脚本遇到可能导致错误并影响结果的情况\n    * `E_CORE_ERROR`:\
  \ 防止 PHP 启动的致命错误\n    * `E_CORE_WARNING`: 启动期间的非致命错误\n    * `E_COMPILE_ERROR`: 编译\
  \ PHP 代码时的致命错误\n    * `E_COMPILE_WARNING`: 编译期间的非致命错误\n    * `E_USER_ERROR`: 由你的\
  \ PHP 代码手动生成的致命错误消息\n    * `E_USER_WARNING`: 由你的 PHP 代码手动生成的非致命错误消息\n    * `E_USER_NOTICE`:\
  \ 由你的 PHP 代码手动生成的通知消息\n    * `E_STRICT`: PHP 检测到不符合 PHP 严格规则的代码\n    * `E_RECOVERABLE_ERROR`:\
  \ 你可以使用 try-catch 块捕获的致命错误\n    * `E_DEPRECATED`: PHP 解析器检测到不再受支持的代码\n    * `E_USER_DEPRECATED`:\
  \ 由你的 PHP 代码手动生成的弃用错误\n    * `E_ALL`: 除 `E_STRICT` 外的所有错误和警告\n\n* `variables_order\
  \ = \"GPCS\"`: PHP 填充 HTTP 会话数据的顺序（G = `GET`、`P` = `POST`、`C` = Cookies 和 `S` =\
  \ 系统变量）\n* `short_open_tag = Off`: 决定你是否可以使用 `<?` 标签在 HTML 文档中标识 PHP 代码\n* `max_execution_time\
  \ = 30`: 为 PHP 程序运行设置时间限制（秒），在此时间之后 PHP 服务器将将其杀死（这对于停止陷入循环的程序非常有用！）\n* `memory_limit\
  \ = 128M`: 设置 PHP 服务器可以在物理服务器上分配的内存限制（这也有助于防止失控程序拖垮整个 Web 服务器！）\n\n# 第 3 章\n\n##\
  \ 构建开发环境\n\n## 本章内容\n\n![check](img/check.png) 识别需要避免的工具\n![check](img/check.png)\
  \ 为工作寻找合适的工具\n\n当你准备好开始编写 Web 应用程序时，你需要一些工具来帮助你。就像木工需要一套工具来完成工作一样，Web 开发者也需要工具。就像木工有很多工具可以选择，Web\
  \ 开发者也是如此。木工可以使用锤子和手锯（可能还有卷尺）建造整栋房子，但她很可能有更先进的工具来让工作更轻松。同样，你可以使用标准的文本编辑器构建整个 Web\
  \ 应用程序，但有很多其他工具可以让你的工作更轻松。\n\n## 了解应该避免哪些工具\n\n在深入讨论之前，我需要告诉你应该避免什么。虽然你可以使用标准的文本编辑器构建整个\
  \ Web 应用程序，但有很多其他工具可以让你的工作更轻松。然而，其中某些工具产生的问题比解决的问题还要多。\n\n### 图形化桌面工具\n\n虽然图形化桌面工具允许你在不进行任何编码的情况下创建网页，但它们使用的是“所见所得”（WYSIWYG）方法。这些工具中最流行的是\
  \ Microsoft Expression 和 Adobe Dreamweaver。当你使用这些工具时，你就受限于它们的界面。就像其他软件软件包一样，图形化工具通常随着新版本的发布而发生变化。这些工具具有相同的缺点：\n\
  \n* 你对它们生成的代码几乎没有控制权。\n* 因为代码臃肿，极难添加或修改它们生成的代码。\n* 你会陷入不断购买升级的无尽循环中。\n* “所见所得”原则并不总是准确；你创建的布局可能无法代表在浏览器和设备上显示的内容。\n\
  \n### Web 托管网站\n\n除了图形化桌面工具，还有像 Squarespace 和 Weebly 这样的 Web 托管网站，它们面向想要构建自己网站的程序员。这些网站让没有经验的人几乎可以在短时间内建立并运行一个简单的网站。然而，它们具有与桌面工具相同的缺点：\n\
  \n* 它们甚至不允许你查看生成的 HTML 和 CSS 代码。\n* 你完全受制于它们；对于这些基于模板的网站，你永远无法将你的 Web 应用程序迁移到不同的主机上（这正是他们想要的）。\n\
  \n### 文字处理器\n\n某些桌面软件程序（如 Microsoft Word 和 Apple Pages）提供了将文档转换为网页的功能。此功能具有与更高级的\
  \ WYSIWYG 工具相同的缺点：\n\n* 你无法控制它们生成的代码，而且生成的代码通常是臃肿的。\n\n![warning](img/warning.png)\
  \ 还要避免使用文字处理器编写 Web 应用程序代码的诱惑。大多数文字处理器即使以文本模式保存文档，也会在文中嵌入二进制字符。这会导致当你尝试在浏览器中查看网页时出现各种问题。\n\
  \n\n\n\n\n如果你正在运行 Microsoft Windows，你有一个可靠的 `Notepad` 应用程序用于创建和查看标准文本文件。`Notepad`\
  \ 提供了一个极其基础的界面用于输入文本和保存文本。图 3-1 显示了在 `Notepad` 窗口中编写 HTML 代码的示例。`Notepad` 并没有特别之处——只是你黑白色的代码。\n\
  \n![image](img/9781119468387-fg010301.png)\n\n图 3-1： 使用 Microsoft `Notepad` 编写 HTML\
  \ 代码。\n\n`Notepad` 作为编程工具运行良好，但在开始在 `Notepad` 中编写代码之前，你可能想要调整一些设置，以便让操作更方便。\n\n\
  ### 禁用自动换行\n\n在 `Notepad` 中，你可以定义想要创建的文档宽度，当达到该限制时，`Notepad` 会自动开始新的一行。此功能对于输入备忘录很有用，但在编码时会导致问题。\n\
  \n在编程语言中，通常不允许将一行代码从当前行换行到下一行。语句的所有代码应该在同一行上，除非你使用了一些技巧告诉程序不要这样做。\n\n自动换行的另一个问题是，当开启自动换行时，`Edit`（编辑）菜单中的\
  \ `GoTo` 选项失效。由于 `Notepad` 不显示行号，`GoTo` 功能是你查找错误信息指定的特定行号的关键工具。\n\n要在 `Notepad`\
  \ 中禁用自动换行，点击菜单栏中的 `Format`（格式）；然后确保 `Word Wrap`（自动换行）选项没有勾选。\n\n### 避免默认扩展名\n\n\
  默认情况下，`Notepad` 假设你正在保存文本文档，并会自动为文件添加 `.txt` 扩展名。这对程序是不的，因为大多数程序使用特定的扩展名来识别身份（例如\
  \ HTML 文件使用 `.html`，PHP 文件使用 `.php`）。\n\n当你使用 `Notepad` 中的 `File`（文件）`Save As`（另存为）选项时，需要小心确保\
  \ `.txt` 文件扩展名不会被添加到文件名末尾。要使用 `Notepad` 保存程序，请按照以下步骤操作：\n\n1. **从编辑器菜单栏选择 `Save\
  \ As`（另存为）。**\n   出现图 3-2 所示的 `Save As` 对话框。\n2. **在 `Save As` 对话框顶部导航到你想保存程序的文件夹。**\n\
  3. **从 `Save As` 对话框底部的 `Save As Type`（保存类型）框选择 `All Files (*.*)`。**\n   防止 `Notepad`\
  \ 为你的文件名添加 `.txt` 扩展名。\n4. **在 `File Name`（文件名）字段中输入程序的文件名，包括你想使用的文件扩展名。**\n5. **点击\
  \ `Save`（保存）保存程序。**\n   你的程序以正确的格式、正确的文件名保存在正确的位置。\n\n![image](img/9781119468387-fg010302.png)\n\
  \n图 3-2： Microsoft `Notepad` 的 `Save As` 对话框。\n\n### 查看扩展名\n\n在 Microsoft Windows\
  \ 中，你使用 `File Explorer` 导航系统设备来打开文件。遗憾的是，`File Explorer` 的默认设置隐藏了文件名的扩展名部分（点之后），以免误导初学者。\n\
  \n这对程序员可能会产生相反的影响，当你尝试寻找特定文件时产生混乱。你可能会为不同扩展的文件使用相同的文件名。幸运的是，你可以轻松更改此 Windows 设置。只需遵循以下步骤：\n\
  \n1. **在 Windows 8 或 10 中打开 `Settings`（设置）。在 Windows 7 中打开 `Control Panel`（控制面板）。**\n\
  2. **在 Windows 8 或 10 中，在搜索栏输入 `File Explorer Options` 并按回车键。**\n3. **点击搜索结果中的 `File\
  \ Explorer Options` 图标。**\n4. **在 Windows 7 中，点击控制面板中的 `File Explorer Options` 图标。**\n\
  \   你可能需要进入 `Advanced`（高级）视图才能看到。\n   打开 `File Explorer Options` 后，对话框应该像图 3-3 所示。\n\
  5. **点击 `View`（视图）选项卡。**\n6. **取消勾选图 3-4 所示的 `Hide extensions for known file types`（隐藏已知文件扩展名）复选框。**\n\
  7. **点击 `OK`。**\n   你可以看到包含扩展名在完整文件名了。\n\n![image](img/9781119468387-fg010303.png)\n\
  \n图 3-3： `File Explorer Options` 对话框。\n\n![image](img/9781119468387-fg010304.png)\n\
  \n图 3-4： `隐藏已知文件扩展名`。\n\n### 设置默认应用程序\n\n现在你可以在 `File Explorer` 中看到完整文件名了，最后一个障碍。如果你想默认用\
  \ `Notepad` 打开文件，请遵循以下步骤操作：\n\n1. **右键点击文件并选择 `Open with`（打开方式）。**\n2. **选择 `Choose\
  \ another app`（选择其他应用）。**\n\n#### 运行 macOS\n\n如果你运行 macOS（或更早版本），文本编辑器实际上被称为 `TextEdit`。`TextEdit`\
  \ 的缺点是它有时会过于聪明。它尝试将 HTML 标签显示为格式化文本。要修复这个问题，使用 `Plain text`（纯文本）单选按钮：\n\n1. **在\
  \ `Options`（选项）部分，取消勾选以下复选框：**\n   - Correct Spelling Automatically（自动纠错）\n   -\
  \ Smart Quotes（智能引号）\n   - Smart Dashes（智能破折号）\n   - Smart Links（智能链接）\n2. **点击\
  \ `Open and Save`（打开和保存）选项卡（参见图 3-7](#07_9781119468387-bk01ch03.xhtml_c03-fig-0007)）。**\n\
  3. **在 `When Opening a File`（打开文件时）部分，勾选 `Display HTML Files as HTML Code Instead\
  \ of Formatted Text`（以 HTML 代码而非格式化文本 文件）复选框。**\n4. **在 `When Saving a File`（保存文件时）部分，取消勾选\
  \ `Add “.txt” File Extension to Plain Text Files`（为纯文本文件添加“.txt”文件扩展名）复选框。\n\n![image](img/9781119468387-fg010305.png)\n\
  \n图 3-5： 使用 `TextEdit` 设置。\n\n![image](img/9781119468387-fg010306.png)\n\n图 3-6：\
  \ `TextEdit` 的 `Preferences`（偏好）对话框。\n\n\n\n\n\nFIGURE 3-7: 首选项对话框的“打开”和“保存”选项卡。\n\
  \n现在你已经准备好使用 `TextEdit` 开始编辑你的程序代码了！\n\n## 如果你运行 Linux\n\nLinux 环境是由程序员为程序员设计的。正因如此，即使是\
  \ Linux 发行版中默认安装的简单文本编辑器也提供了一些在编码时非常有用的基本功能。\n\n你的 Linux 发行版通常带有什么文本编辑器取决于桌面环境。Linux\
  \ 支持许多不同的图形化桌面环境，但最常见的两种是 `GNOME` 和 `KDE`。本节将介绍每个环境中可以找到的默认文本编辑器。\n\n### GNOME 编辑器\n\
  \n如果你在 `GNOME` 桌面环境中工作，默认的文本编辑器是 `gedit`，如图图 3-8 所示。\n\n![image](img/9781119468387-fg010308.png)\n\
  \nFIGURE 3-8: 用于 Linux `GNOME` 桌面的 `gedit` 编辑器。\n\n`gedit` 编辑器会自动将程序文件保存为纯文本格式，不会尝试为文件名添加\
  \ `.txt` 文件扩展名。使用 `gedit` 编写程序代码时不需要进行任何特殊操作。此外，它还有一些专门针对编程的高级功能，你可以在程序编辑器中找到它们（参见本章后面的“程序编辑器”部分）。\n\
  \n### KDE 编辑器\n\n在 `KDE` 图形桌面环境中使用的默认文本编辑器是 `Kate`，如图图 3-9 所示。\n\n![image](img/9781119468387-fg010309.png)\n\
  \nFIGURE 3-9: 用于 Linux `KDE` 桌面的 `Kate` 编辑器。\n\n与 `gedit` 一样，`Kate` 编辑器开箱即包含了许多对程序员友好的功能。再次，在\
  \ `Kate` 中开始编辑程序代码之前不需要任何特殊配置。\n\n## 程序编辑器\n\n比标准文本编辑器更高级的工具是一类被称为程序编辑器的工具。程序编辑器的工作方式与文本编辑器一样，但它具有一些对编程非常有用的额外内置功能。以下是你将在程序编辑器中发现的一些功能：\n\
  \n*   **行号：** 在窗口侧边提供行号在编码时简直是救星。当错误消息告诉你有第 1935 行存在问题时，不需要数每一行就能到达那里，这非常有帮助！\n\
  *   **语法高亮：** 通过语法高亮，编辑器使用不同的颜色来表示程序的不同部分。程序关键字使用不同的颜色显示，以帮助它们从代码文件中的数据中脱颖出来。\n\
  *   **语法错误标记：** 看起来用作关键字但在代码语句字典中找不到的文本将被标记为错误。此功能可以帮助你捕获程序代码中的简单拼写错误，从而节省时间。\n\n\
  有很多商业性的程序编辑器，但一些最好的程序编辑器实际上是免费的。本节将讨论适用于 HTML、CSS、JavaScript 和 PHP 编码的一些较好的免费编辑器。\n\
  \n### Notepad++\n\n如果你运行 Microsoft Windows，`Notepad++` 工具是一个很好的起点。正如其名称所示，它像记事本一样，但更更好用。你可以从\
  \ [`www.notepad-plus-plus.org`](http://www.notepad-plus-plus.org) 下载 `Notepad++`。主编辑窗口如图图\
  \ 3-10 所示。\n\n![image](img/9781119468387-fg010310.png)\n\nFIGURE 3-10: `Notepad++`。\n\
  \n`Notepad++` 的主界面看起来与记事本相似，因此没有什么需要适应的。默认情况下，它在左边距显示行号，并在底部显示文件类型和光标的列位置。\n\n`Notepad++`\
  \ 识别许多不同类型编程语言的语法，包括 HTML、CSS、JavaScript 和 PHP。它会高亮关键字，甚至会匹配起始和结束块语句。如果你漏掉了结束块，`Notepad++`\
  \ 会指出这一点。\n\n### Scintilla 和 SciTE\n\n`Scintilla` 库 ([`www.scintilla.org`](http://www.scintilla.org))\
  \ 是一个开源项目，旨在为任何环境提供文本编辑器引擎。`SciTE` 包是一个支持任何类型的桌面文本编辑器。你可以从 `Scintilla` 网站下载它。`SciTE`\
  \ 包支持 `Windows`。图图 3-11 显示了基础 `SciTE` 编辑器。\n\n![image](img/9781119468387-fg010311.png)\n\
  \nFIGURE 3-11: `SciTE`。\n\n### jEdit\n\n`jEdit` 程序编辑器 ([`www.jedit.org`](http://www.jedit.org))与其他编辑器略有不同。它是用\
  \ Java 编写的，可以在 `Windows`、`macOS` 或 `Linux` 上运行。图图 3-12 显示了基础 `jEdit` 编辑器。\n\n![image](img/9781119468387-fg010312.png)\n\
  \nFIGURE 3-12: `jEdit`。\n\n![warning](img/warning.png) 警告：由于 `jEdit` 是 Java 应用程序，你的桌面平台必须安装\
  \ Java 运行环境 (`JRE`) 或 Java 开发包 (`JDK`) 才能工作。你可以从 Oracle 的 [`www.oracle.com/technwork/java/downloads`](http://www.oracle.com/technwork/java/downloads/index.html)\
  \ 下载并安装。此外，由于 `jEdit` 作为 Java 应用程序运行，你可能会发现它比某些原生包如 `Notepad++` 或 `SciTE` 慢。\n\n\
  ### 集成开发环境\n\n工具阶梯的下一个级别，程序开发的激光引导导向工具是集成开发环境 (`IDE`)。IDE 包提供了开发任何规模 Web 应用所需的一切。\n\
  \n\n\n\n\nPHP 环境既有商业 IDE 包也有开源包。为了让你对 IDE 软件包的运作有一个大致的了解，本节将介绍两个最流行的包：Netbeans 和\
  \ Eclipse。\n\n## Netbeans\n\nNetbeans IDE 软件包最初由太阳微系统（Sun Microsystems）开发，并作为其 Java\
  \ 编程语言环境的开源 IDE 发布（这也是名称中“beans”部分的由来）。当甲骨文（Oracle）收购太阳微系统后，它保持了对 Netbeans 的支持，并通过更新的版本继续对其开发。\n\
  \n通过使用额外的插件模块，Netbeans IDE 现在支持除 Java 之外的多种不同的编程语言。正如你所猜到的，我在这里提到它是因为它有一个专门针对 PHP\
  \ 的插件模块。\n\n你可以下载已安装 PHP 模块的 Netbeans 编辑器，这样安装非常方便。只需访问 [`www.netbeans.org/downloads`](http://www.netbeans.org/downloads)\
  \ 并点击 PHP 分类下的 Download 按钮。\n\n当你启动 Netbeans 时，它会提示你启动新项目，如图 3-13 所示。\n\n![image](img/9781119468387-fg010313.png)\n\
  \n图 3-13： Netbeans 项目对话框。\n\nNetbeans 包含了 HTML 和 JavaScript 应用程序的项目模板，以及 PHP 应用程序。当你启动一个新的\
  \ PHP 项目时，Netbeans 会自动创建一个 `index.php` 文件作为项目的主程序。它甚至为你的代码构建了一个粗略的模板。正如你对 IDE 的预期那样，当你开始输入\
  \ PHP 函数名时，Netbeans 会弹出一个框，显示所有与你输入的内容匹配的 PHP 函数，如图 3-14 所示。\n\n![image](img/9781119468387-fg010314.png)\n\
  \n图 3-14： Netbeans 代码补全对话框。\n\n它不仅显示代码补全列表（如你在图 3-14 中所示），还向你展示该函数的 PHP 手册定义！如果你计划进行任何大规模的\
  \ PHP 开发，这无疑是一个实用的工具。\n\n## Eclipse\n\nPHP IDE 包的另一个大名字是 Eclipse PHP 开发工具（通常简称为\
  \ Eclipse PDT）。Eclipse 最初也被设计为一个 Java 应用 IDE。许多开源支持者并不信任太阳微系统会维护 Java 的唯一 IDE，因此他们着手开发自己的\
  \ IDE。（有一种说法是，“Eclipse”这个名字与“太阳微系统”之间并没有什么主刻意的文字游戏。如果你能相信这个话，我或许可以卖给你一座桥。）\n\n就像\
  \ Netbeans IDE 一样，Eclipse 通过使用插件模块从仅限 Java 的 IDE 演变为支持许多不同的编程语言。你可以在 [`www.eclipse.org/pdt`](https://www.eclipse.org/pdt)\
  \ 下载一体化包的 Eclipse PDT。\n\n![warning](img/warning.png) 就像 jEdit 编辑器一样，Eclipse PDT\
  \ 是用 Java 编写的，并要求你在工作站上安装 JRE 或 JDK（参见本章前面的部分“jEdit”）。\n\n当你启动 Eclipse 时，会出现一个菜单系统，如图\
  \ 3-15 所示。\n\n![image](img/9781119468387-fg010315.png)\n\n图 3-15： Eclipse 启动菜单。\n\
  \n这允许你轻松地更改 IDE 配置、启动新项目或打开现有项目。Eclipse 拥有 Netbeans 提供的所有功能。此外，它还有一个额外功能：Eclipse\
  \ PDT 包含了由 Zend 公司开发的高级 PHP 调试器工具，Zend 是 PHP 的赞助商。调试器工具可以在你输入时立即指出 PHP 代码中的错误，也可以在你在\
  \ Eclipse 编辑器窗口中运行代码时对其进行调试。图 3-16 展示了 Eclipse 指出我在代码中犯的一个 PHP 编码错误。\n\n![image](img/9781119468387-fg010316.png)\n\
  \n图 3-16： 运行中的 PHP 调试器。\n\n在开发应用程序时，手头有一个高级 PHP 调试器可以节省大量时间！\n\n### 浏览器调试\n\n在结束本章之前，我想提到另一个你在排查\
  \ Web 页面问题时可以使用的工具。如今大多数浏览器都有内置或易于安装的调试功能。浏览器调试器可以帮助排查 HTML、CSS 和 JavaScript 问题。图\
  \ 3-17 显示了在你按下 `F12` 后 Microsoft Edge 浏览器的控制台。\n\n![image](img/9781119468387-fg010317.png)\n\
  \n图 3-17： Microsoft Edge 浏览器调试 Web 页面。\n\n浏览器调试器可以准确显示 HTML 或 CSS 代码哪里出了问题。当你开发\
  \ Web 应用程序时，测试是关重要的，要尽可能多地进行测试以了解预期。情况会变得更好，但不同的浏览器处理 HTML、CSS 甚至代码的方式仍然不同。当 HTML\
  \ 或 CSS 代码发生错误时，浏览器不会显示任何错误信息。相反，它尝试自行修复问题以便显示 Web 页面。不幸的是，如果你遇到 Web 页面在两个浏览器中看起来不同的情况，最可能是某种\
  \ HTML 或 CSS 问题浏览器的解释方式不同。\n\n# 书 2 HTML5 和 CSS\n\n## 内容概览\n\n### 1. 第一章：HTML5 基础](#09_9781119468387-bk02ch01.xhtml)\n\
