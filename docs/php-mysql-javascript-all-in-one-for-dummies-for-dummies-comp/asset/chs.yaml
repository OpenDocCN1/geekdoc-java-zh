  \n现在你已经学会了如何使用 AJAX，下一步是在 AuctionHelper 程序中利用它来显示拍卖的实时数据。我将在下一节中介绍这个主题。\n\n## 修改\
  \ AuctionHelper \n\n凭借你新学到的 AJAX 技能，你现在可以处理 AuctionHelper 的最后一个需求了！如果你还记得本微教程的第\
  \ 1 章所示。\n\n![image](img/9781119468387-fg060305.png)\n\n图 3-5： AuctionHelper 主窗口。\n\
  \n`aside.inc.php` 代码为显示内容创建了四个独立的 `span` 元素：\n\n*   竞标者总数\n*   物品总数\n*   所有物品的总转售价值\n\
  *   当前总出价价总和\n\n实现此功能的第一步是创建一个生成实时数据并作为 XML 文档返回的 PHP 文件。按照以下步骤操作：\n\n1. **打开编辑器并输入以下代码：**\n\
  \n```php\n<?php\ninclude(\"bidder.php\");\ninclude(\"item.php\");\n$bidders = Bidder::getTotalBidders();\n\
  $items = Item::getTotalItems();\n$itemtotal = Item::getTotalPrice();\n$bidtotal\
  \ = Item::getTotalBids();\n$doc = new DOMDocument(\"1.0\");\n$auction = $doc->createElement(\"\
  auction\");\n$auction = $doc->appendChild($auction);\n$bidders = $doc->createElement(\"\
  bidders\", $bidders);\n$bidders = $auction->appendChild($bidders);\n$items = $doc->createElement(\"\
  items\", $items);\n$items = $auction->appendChild($items);\n$itemtotal = $doc->createElement(\"\
  itemtotal\", $itemtotal);\n$itemtotal = $auction->appendChild($itemtotal);\n$bidtotal\
  \ = $doc->createElement(\"bidtotal\", $bidtotal);\n$bidtotal = $auction->appendChild($bidtotal);\n\
  $output = $doc->saveXML();\nheader(\"Content-type: application/xml\");\necho $output;\n\
  ?>\n```\n\n2. **将文件保存为** `realtime.php` **并存放在你 Web 服务器** `DocumentRoot` **文件夹下的**\
  \ `auction` **文件夹中。**\n\n你应该能识别出 `realtime.php` 文件中的代码。它创建了一个 `DOMDocument` 对象并填充了你所需的数据。然而，请注意我使用了四个新的静态方法来获取数据。你可以在这里编写\
  \ PHP 代码直接访问拍卖数据库，但让 `Bidder` 和 `Item` 对象为你完成这些工作是更好的编程实践。这意味着你需要……\n\n\n\n\n```javascript\n\
  // parse the XML document to get each data element\nvar xmldoc = request.responseXML;\n\
  var xmlbidders = xmldoc.getElementsByTagName(\"bidders\")[0];\nvar bidders = xmlbidders.childNodes[0].nodeValue;\n\
  var xmlitems = xmldoc.getElementsByTagName(\"items\")[0];\nvar items = xmlitems.childNodes[0].nodeValue;\n\
  var xmlitemtotal = xmldoc.getElementsByTagName(\"itemtotal\")[0];\nvar itemtotal\
  \ = xmlitemtotal.childNodes[0].nodeValue;\nvar xmlbidtotal = xmldoc.getElementsByTagName(\"\
  bidtotal\")[0];\nvar bidtotal = xmlbidtotal.childNodes[0].nodeValue;\ndombidders.innerHTML\
  \ = bidders;\ndomitems.innerHTML = items;\ndomitemtotal.innerHTML = itemtotal;\n\
  dombidtotal.innerHTML = bidtotal;\n};\n\nrequest.send();\n}\n</script>\n</head>\n\
  ```\n\n3. **将文件保存为 `index.php` 并在并存于 `auction` 文件夹中。**\n\n`getRealTime()` 函数使用 `XMLHttpRequest`\
  \ 对象将请求提交给 `realtime.php` 程序，然后解析在 `responseXML` 属性中接收到的内容。由于每个数据项都是具有唯一名称元素，代码使用了四个独立的\
  \ `getElementsByTagName()` 方法来解析每个元素；然后使用 `childNodes[0]` 属性来检索分配给元素的文本值。\n\n然而，目前还没有任何机制触发\
  \ `getRealTime()` 函数。要按定期触发该函数以模拟实时更新，诀窍在于使用 JavaScript 的 `setInterval()` 函数：\n\n\
  ```javascript\nsetInterval(function(), time);\n```\n\n`setInterval()` 函数每隔 `time`\
  \ 毫秒触发一次指定的函数。因此，要每五秒触发一次 `getRealTime()` 函数，你需要编写以下代码：\n\n```javascript\nsetInterval(getRealTime,\
  \ 5000);\n```\n\n![warning](img/warning.png) 在设置更新实时数据的触发频率时要加小心。你可能想让它每秒触发一次，但这可能会产生大量的网络流量！通常情况下，每五秒左右获取一次数据对于大多数“实时”环境来说足够了。\n\
  \n现在唯一的问题是把这些代码放在哪里！请按照以下步骤进行操作：\n\n1. **在编辑器中打开 `auction` 文件夹中的 `index.php` 文件。**\n\
  \n2. **在 `<aside>` 章节中，修改代码如下：**\n\n```html\n<aside>\n  <?php include(\"aside.inc.php\"\
  ); ?>\n  <script language=\"javascript\" type=\"text/javascript\">\n    getRealTime();\n\
  \    setInterval(getRealTime, 5000);\n  </script>\n</aside>\n```\n\n3. **将文件保存为\
  \ `index.php` 并存于 `auction` 文件夹中。**\n\n# 扩展 WordPress\n\n## 熟悉 WordPress\n\n与朋友、家人、客户或潜在客户的社交互动已成为当今流行的需求。这种互动的方法就是博客。博客允许公司发布最新信息，允许艺术家展示作品集，或者允许任何人发布他们的个人生活。\n\
  \nWordPress 最初仅仅是一个简单的博客界面。它创建了一个环境，让博客作者可以轻松输入文本并以公告板的形式发布。每篇文章都成为网站上的一个文章并存储在数据库中；这样网站访问者就可以轻松进行搜索和检索。如果需要，网站管理员可以允许访问者在任何文章上发表评论。评论可以对开放，或者博客作者可以担任管理员，审核哪些评论可以留下，哪些需要从网站上删除。\n\
  \n从最初的起点，WordPress 演变成了一个完整的*内容管理系统*（CMS）。CMS 提供了发布存档任何类型内容的能力——从简单的文本文章到图片到完整的多页文档。CMS\
  \ 将发布到网站的所有内容存档在数据库中，可以通过实际内容文本或内容相关的关键词进行完全搜索。\n\n## WordPress 能为你做什么\n\n本节将介绍\
  \ WordPress 的基础，展示它可以做什么，并描述构成 WordPress 界面的不同部分。在开始对其进行编码之前，你需要了解这些内容。\n\n\n\n\n\
  WordPress 的另一个强大功能是添加 `plugins`（插件）。插件为 WordPress 的核心功能提供了扩展性。有许多插件可以用于发布活动日历、列出你网站上最热门的文章、访问存档文章，甚至在主\
  \ WordPress 网页内运行独立的微 Web 应用程序！插件是 WordPress 真正的威力所在，这也是你作为 PHP Web 开发人员将关注的重点。\n\
  \n## 如何运行 WordPress\n\n关于 WordPress 最令人困惑的部分之一是，创建 WordPress 网站有两种方式：\n\n*   **WordPress.com\
  \ 商业网站：** 这是一个标准的 Web 托管服务器，它提供各种计划，让您使用 WordPress 服务器在互联网上托管您自己的预安装的 WordPress\
  \ 网站环境。\n*   **WordPress.org 非营利实体：** 该团体开发并支持实际的开源 WordPress Web 应用程序软件，并将其提供给您安装在自己的\
  \ Web 服务器上，从而运行您自己的 WordPress 网站。\n\n运行 WordPress 网站的两种方法各有优缺点。显然，对于那些没有恰好在地下室拥有自己数据中心的人来说，能够由一家知名且受尊敬的公司托管他们的网站是一个加分。你可以使用\
  \ WordPress 域名免费托管你的 WordPress 网站，也可以购买个人或企业套餐，在 WordPress 服务器上托管你自己的域名。\n\nWordPress.com\
  \ 的基础设施确保了你的网站几乎全天候在线。使用 WordPress.com 网站另一个好处是，管理员会为你处理所有的服务器硬件和软件维护烦恼问题。这让你能够专注于创建和维护你的\
  \ WordPress 网站，而不必担心错过服务器补丁导致攻击者破坏你的网站，或者更糟糕的是窃取你的数据。\n\n如果你已经在为公司或组织运行 Web 服务器，那么将\
  \ WordPress 应用程序添加到现有的 Web 服务器中是轻而易举的。因为 WordPress 只是一个 PHP 应用，你只需要为服务器创建一个单独的文件夹并将\
  \ WordPress 软件复制那里运行即可。\n\nWordPress.org 组织提供了与其商业网站相同的全功能 WordPress 软件，免费提供给任何想要运行自己\
  \ WordPress 网站的人。你只需将 WordPress 程序包下载到自己的 Web 服务器上并自行维护即可。当然，这意味着你需要负责跟踪 Web 服务器软件和\
  \ WordPress 软件的更新和补丁。\n\n![tip](img/tip.png) 一个常见的折中方案是使用第三方 Web 托管公司，例如 GoDaddy（[www.godaddy.com](http://www.godaddy.com)）、HostGator（[www.hostgator.com](http://www.hostgator.com)）或\
  \ 1&1（[www.1and1.com](http://www.1and1.com)）来托管你的网站。这样，他们负责维护 Web 服务器硬件和软件，而你负责\
  \ WordPress 软件。许多主要的 Web 托管公司甚至为 WordPress 提供快速安装包，让你只需从管理网站界面点击一下鼠标即可安装！\n\n##\
  \ WordPress 网站的组成部分\n\n让 WordPress 如此受欢迎的功能之一是可以将网站内容与网站设计分离。你可以轻松地更改网站的外观和感受，而不会丢失你已经发布的任何内容。通过将网站的不同特性和功能分离到不同的模块中，WordPress\
  \ 让你能够轻松组合你想在网站上显示的任何内容。\n\nWordPress 有几个提供网站整体外观和感受的主要组件：\n\n*   **Themes（主题）：**\
  \ 一个 `theme`（主题）是一个创建网站外观和感受的软件软件包。所有与网站布局、图像和结构相关的内容都包含在主题软件中。将这些打包成一个包可以让你轻松地更改网站的外观和感受，而不会干扰\
  \ CMS 维护的内容。\n    每个主题包仅包含显示来自数据库内容所需的 HTML、CSS、JavaScript 和 PHP 代码。每个主题包以相同的方式接入整个网站界面，并以相同的方式与底层\
  \ CMS 代码进行交互。这使你能够随时更改主题包，通常只需要点击几次鼠标！\n*   **Posts and comments（文章和评论）：** `Posts`（文章）是你上传到网站并显示的文章。文章可以是文本、图像，甚至是视频片段。你对文章在网站上的显示方式以及它们如何存档以备日后参考有完全的控制权。\n\
  \    WordPress 提供了一个选项，允许你的网站访问者对你的文章发表 `comments`（评论）。你可以向公众开放网站以开放评论，但现在这并不是一种推荐的策略。最好的做法是包含一个验证过程，在评论显示在你的网站之前，必须对每条评论进行验证。\n\
  *   **Categories and tags（分类和标签）：** `Categories`（分类）提供了组织你 WordPress 网站上大量文章和评论的能力。你可以将网站划分为不同的类别，并将每个类别维护为独立的博客界面。然后，根据文章所属的类别（或多个类别）为每篇文章打上标签，以便进行显示和搜索。\n\
  \    你可以随时在你的 WordPress 网站中添加、更改或删除分类，而不会对你维护的其他类别产生任何不利影响。分类允许你使用你的 WordPress 网站托管多个主题并保持它们相互独立。这可以帮你将你的保龄球联盟博客与你的高级粒子物理博客分开！\n\
  *   **Plugins（插件）：** `Plugins` 是 WordPress 真正的威力所在。WordPress 的插件功能允许任何人为几乎任何类型的应用程序创建自定义代码，并将其添加到标准的\
  \ WordPress 网站中。\n    WordPress 维护着一个公共插件库，因此在你创建一个插件后，可以通过将其上传到仓库来与世界共享！有插件支持许多不同的高级功能，例如过滤文章和评论、显示活动日历、跟踪你的网站使用情况、关注其他网站（如其他博客作者或电子商务网站）以及监控\
  \ RSS 馈。\n    ![tip](img/tip.png) 插件是你作为 PHP 开发人员技能可以大放异彩的地方。通过添加别人没有的特殊功能或与其他 Web\
  \ 应用程序交互，你可以自定义你的网站使其脱颖而出。在本章后面，你将探索如何通过将 WordPress 网站与 AuctionHelper 应用程序交互来创建一个插件。\n\
  \n## 安装 WordPress\n\n作为 PHP 开发人员，参与开发 WordPress 插件的最佳方法是在你自己的 Web 开发环境中设置 WordPress\
  \ 环境。这听起来可能很复杂，但得于 WordPress 开发人员，这实际上是一个非常简单的过程。本节将介绍在 Web 环境中运行完整的 WordPress 网站所需的步骤。\n\
  \n### 下载 WordPress 软件\n\n由于 WordPress 程序包是一个 PHP 应用，你只需要下载软件并将 PHP 代码安装到你的 Web 服务器的\
  \ `DocumentRoot` 文件夹中。按照以下步骤进行操作：\n\n1.  **打开浏览器并输入以下 URL：**\n    `http://www.wordpress.org`\n\
  \    ![warning](img/warning.png) 确保进入的是 `.org` 网站而不是 `.com` 网站。\n2.  **点击主网页头部区域的\
  \ Download WordPress 按钮。**\n    你将被带到主下载页面。\n3.  **下载包。**\n\n\n\n\n\n如果您正在 Windows\
  \ 或 macOS 平台上进行开发，请点击显示最新版本 WordPress 的大按钮。在编写此时，您点击 `Download WordPress 4.9.1`\
  \ 按钮来下载 `.zip` 文件格式的最新包。\n\n如果您正在 Linux 平台上进行开发，请点击较小的 `Download .tar.gz` 链接来下载压缩\
  \ `.tar` 文件格式的包，并在您的 Linux 系统上进行解压。\n\n### 4. 解压文件。\n\n如果您正在 Windows 或 macOS 平台上进行开发，双击\
  \ `.zip` 下载包以开始解压文件。将包提取到您 Web 服务器的 `DocumentRoot` 文件夹中。对于 Windows 上的 XAMPP，路径为\
  \ `c:\\xampp\\htdocs` 文件夹；对于 macOS 上的 XAMPP，为 `/Applications/XAMPP/htdocs` 文件夹。\n\
  \n如果你在 Linux 平台上工作，请使用您发行版的包管理工具从压缩的 `.tar` 文件中解压 WordPress 文件。\n\n### 5. 关闭文件解压窗口和浏览器窗口。\n\
  \n此过程将在您 Web 服务器的 `htdocs` 文件夹下创建一个 `wordpress` 文件夹。该应用程序的所有 WordPress 文件都存储在该处。\n\
  \n接下来，您需要为您的环境配置 WordPress 设置。\n\n### 创建数据库对象\n\nWordPress 将几乎所有内容——从配置设置到内容——都存储在数据库中。您需要在\
  \ MySQL 服务器中创建该数据库以及一个用于访问它的用户账户。\n\n如果您使用 Web 托管公司进行 Web 开发，请按照其提供的说明创建数据库和访问数据库的用户账户。\n\
  \n如果您已在 Windows、macOS 或 Linux 环境上安装了 XAMPP 包进行 Web 开发，请按照以下步骤创建 WordPress 数据库和用户账户：\n\
  \n1. **确保 MySQL 服务器正在运行，然后打开适用于 XAMPP 环境的 MySQL 控制台。**\n\n对于 Windows 上的 XAMPP，首先打开命令提示符（Command\
  \ Prompt）窗口，然后导航到 `c:\\xampp\\mysql\\bin` 文件夹。对于 macOS 上的 XAMPP，首先打开终端（Terminal）窗口，然后导航到\
  \ `/Applications/XAMPP/mysql/bin` 文件夹。\n\n2. **使用 `mysql` 命令启动 MySQL 控制台。**\n\n\
  对于 Windows  XAMPP 执行以下操作：\n\n```\nC:\\Users\\rkblu>cd \\xampp\\mysql\\bin\nC:\\\
  xampp\\mysql\\bin>mysql --user=root --password\n```\n\n```\nEnter password:\nWelcome\
  \ to the MariaDB monitor. Commands end with ; or \\g.\nYour MariaDB connection id\
  \ is 2\nServer version: 10.1.28-MariaDB mariadb.org binary distribution\nCopyright\
  \ (c) 2000, 2017, Oracle, MariaDB Corporation Ab and others.\nType 'help;' or '\\\
  h' for help. Type '\\c' to clear the current input statement.\nMariaDB [(none)]>\n\
  ```\n\n3. **在 MySQL 控制台中，在密码提示处按回 键进入 `mysql>` 提示符。**\n\n4. **要为 WordPress 创建数据库，请使用\
  \ SQL 中的 `CREATE DATABASE` 命令。**\n\n对于您的开发环境，只需将数据库命名为 `wordpress`：\n\n```sql\n\
  MariaDB [(none)]>CREATE DATABASE wordpress;\nQuery OK, 1 row affected (0.00 sec)\n\
  MariaDB [(none)]>\n```\n\n5. **为 WordPress 应用程序创建一个用户账户，使其具有对您创建的数据库的完全访问权限。**\n\
  \n对于开发环境，只需将用户账户命名为 `wordpress`，并使用 SQL 中的 `GRANT` 命令创建它：\n\n```sql\nMariaDB [(none)]>GRANT\
  \ ALL on wordpress.* TO 'wordpress'@'localhost'\n-> IDENTIFIED BY 'myL0ngP@ssword';\n\
  Query OK, 0 rows affected (0.00 sec)\nMariaDB [(none)]>\n```\n\n![warning](img/warning.png)\
  \ 在此处记录您创建的用户账户和密码。您将在 WordPress 配置中需要使用它们。\n\n6. **使用 `exit` 命令退出 MySQL 控制台。**\n\
  \n7. **使用 `exit` 命令退出命令提示符或终端会话。**\n\n创建好 WordPress 所需数据库和 MySQL 用户账户后，您就可以开始配置\
  \ WordPress 软件了。\n\n### 配置 WordPress\n\n安装过程的下一步是告诉 WordPress 您刚刚创建的数据库和用户账户。有两种方法可以实现这一点：\n\
  \n* 手动编辑 WordPress 配置文件。\n* 运行 WordPress 设置 Web 应用程序。\n\nWordPress 在 `wordpress`\
  \ 文件夹中提供了 `wp-config-sample.php` 文件作为配置文件模板。您可以手动更改环境的设置，然后将该文件保存为 `wordpress` 文件夹中的\
  \ `wp-config.php`。至少，您需要指定为 WordPress 应用程序在 MySQL 中创建的数据库名称、用户名和密码，以及 MySQL 服务器所在的主机。（如果\
  \ MySQL 服务器与 Web 服务器位于同一物理服务器上，则使用主机名 `localhost`。）\n\nWordPress 设置 Web 应用程序是一个网页，它会为您生成一个标准的\
  \ HTML 表单界面，用于输入 WordPress 访问数据库所需的信息，并定义它希望如何创建数据库表的指令。按照以下步骤操作：\n\n1. **打开浏览器并访问以下\
  \ URL：**\n\n`http://localhost:8080/wordpress/`\n\n2. **从列表中选择您偏好的语言，然后点击继续（Continue）。**\n\
  \n3. **准备就绪后，点击让我们开始（Let’s Go）。**\n\n4. **在数据库名称（Database Name）和用户名（Username）字段中均输入\
  \ `wordpress`。**\n\n5. **在密码（Password）字段中输入之前选择的 `myL0ngP@ssword`。**\n\n6. **数据库主机（Database\
  \ Host）字段保留 `localhost`。**\n\n表前缀（Table Prefix）字段允许您在 WordPress 表前放置一个前缀，以便在需要与其他应用程序共享数据库时识别它们。由于您为\
  \ WordPress 创建了独立的数据库，因此这并不是需要的，但如果您喜欢，可以保留原来的 `wp_` 值。\n\n7. **点击提交（Submit）按钮继续。**\n\
  \n下一个页面将警告您安装过程将继续（应用程序为什么要叫我们“小火花/sparky”呢）。\n\n8. **当您准备好开始该过程时，点击安装 WordPress（Install\
  \ WordPress）按钮。**\n\n\n\n\n\n几秒后，安装将完成。请不要点击 `Login` 按钮，但保持您的浏览器窗口开启。\n\n![image](img/9781119468387-fg060401.png)\n\
  \n图 4-1: WordPress 设置配置页面。\n\n![image](img/9781119468387-fg060402.png)\n\n图 4-2:\
  \ WordPress 安装页面。\n\n完成安装过程后，您的 WordPress 网站就已经上线运行了！要对其进行测试，请在浏览器中输入以下 URL：\n\n\
  `http://localhost:8080/wordpress/`\n\n你将看到 WordPress 的主页面，如图 4-3 所示。\n\n![image](img/9781119468387-fg060403.png)\n\
  \n图 4-3: 网站的 WordPress 主页面。\n\n该页面使用 WordPress 的默认主题（对于此版本，是一个盆栽的时尚图片）。注意，你为网站选择的标题出现在底部，旁边还有一个口号（tagline），目前它是通用的。别担心——你可以轻松地更改它！\n\
  \n当你向下滚动页面时，背景图像将由你的网站内容取代，如图 4-4 所示。\n\n![image](img/9781119468387-fg060404.png)\n\
  \n图 4-4: WordPress 页面的主要内容区域。\n\n左侧列列出了最近的文章（方便地为你准备了一个示例文章）。点击该文章，你将进入一个新页面，它只显示单篇文章，以及你或网站访问者针对该文章的任何评论。\n\
  \n主页面的右侧包含几个不同的部分。这些侧边栏中的功能被称为“小部件”（widgets）。你可以自定义哪些小部件出现在你的网站上，以及它们出现的位置。你还可以修改出现在默认网站中的文章和评论。所有这些操作都可以通过\
  \ WordPress 的管理员面板（dashboard）完成。\n\n## 检查仪表面板\n\n现在你已经运行了一个通用的 WordPress 网站，可以对其进行调整，使其外观完全符合你的预期。你可以通过\
  \ WordPress 仪表面板来实现这一点。\n\n要进入仪表面板，请点击 WordPress 主页面右侧 Meta（元）区域出现的 `Login` 链接，或者直接输入以下\
  \ URL：\n\n`http://localhost:8080/wordpress/wp-admin`\n\n这两种方法都会产生登录页面。输入你在配置网站时指定的用户名或电子邮件地址，以及你指定的密码，然后点击\
  \ `Login` 按钮。随后会出现如图 4-5 所示的仪表面板页面。\n\n![image](img/9781119468387-fg060405.png)\n\
  \n图 4-5: WordPress 仪表面板页面。\n\n页面的左侧包含导航菜单，供你选择管理选项：\n\n*   **更新 (Updates)：** 当有\
  \ WordPress 或任何你可以下载并安装的插件更新时，通知你。\n*   **文章 (Posts)：** 允许你查看之前的文章，并创建新的文章、分类和标签。\n\
  *   **媒体 (Media)：** 允许你上传和管理多媒体文件，如图像和视频剪。\n*   **页面 (Pages)：** 管理出现在你网站中的网页。\n\
  *   **评论 (Comments)：** 列出评论，并允许你将其标记为批准、垃圾邮件或删除。\n*   **外观 (Appearance)：** 通过更改出现在网页上的主题、小部件、菜单和页眉，允许你管理网站的外观和感受。\n\
  *   **用户 (Users)：** 提供工具来创建和管理用户账户，以限制在你的网站上发布。\n*   **工具 (Tools)：** 允许你添加自定义工具来帮助管理网站。\n\
  *   **设置 (Settings)：** 提供一个界面，供你更改 WordPress 在你网站中使用的配置设置。\n\n仪表面板页面的右侧包含帮助你管理网站的小部件。你将使用它们来更改网站的外观和感受。\n\
  \n\n\n\n\n图 4-7 显示了“文章”网页，其中列出了数据库中的当前文章。\n\n3. **将鼠标指针悬停在“Hello World!”文章标题上。**\n\
  \   文章标题下方会出现一个弹出菜单，允许你编辑、移垃圾桶或查看文章。\n\n4. **点击“垃圾桶”选项以删除测试文章。**\n   文章被删除了，但请注意窗口顶部会出现一条警告消息，允许你在需要时撤销此操作。此时现在还多了一个“垃圾桶”分类，显示垃圾桶中有一个项目。你可以随时返回垃圾桶并恢复文章（至少在清空垃圾桶之前可以）。\n\
  \n5. **在导航菜单中点击“文章”菜单项下的“分类”子菜单选项。**\n   这将打开如图 4-8 所示的“分类”网页。\n   默认情况下，只有一个分类（命名为`未分类`）。\n\
  \n6. **在“添加新分类”部分，添加一个名为“无声拍卖活动”（Silent Auction event）的新分类。**\n\n7. **对于别名（显示在 URL\
  \ 中的内容），你可以让该项为空。**\n   WordPress 将自动创建别名，将分类名称转换为全小写，并在空格处插入连字符。\n\n8. **在“描述”中，输入一些描述该分类的文本。**\n\
  \n9. **点击“添加新分类”按钮。**\n   现在你准备好发布你的第一篇文章了！\n\n10. **点击左侧导航菜单中的“文章”菜单项，然后点击“文章”网页顶部的“写文章”按钮。**\n\
  \    这将打开如图 4-9 所示的“写文章”网页。\n\n11. **为文章填写标题，然后在“描述”文本区域填写文章正文。**\n\n12. **在“分类”部分勾选“无声拍卖活动”分类框。**\n\
  \n13. **在右侧的“发布”部分，点击“预览”按钮以查看你的文章在网页上的外观。**\n    这将打开一个包含该文章的新网页。\n\n14. **完成审核后，关闭该浏览器标签页。**\n\
  \n15. **点击“发布”图标发布新文章。**\n\n16. **点击导航菜单中的“文章”链接，确保你的新文章已发布。**\n\n17. **将鼠标指针悬停在仪表面板右上角的个人图标上，然后从下拉菜单中选择“退出”，退出仪表面板网页。**\n\
  \n![image](img/9781119468387-fg060407.png)\n\n图 4-7： WordPress 文章网页。\n\n![image](img/9781119468387-fg060408.png)\n\
  \n图 4-8： WordPress 分类网页。\n\n![image](img/9781119468387-fg060409.png)\n\n图 4-9：在\
  \ WordPress 中添加新文章。\n\n现在，当你在浏览器中输入 WordPress 网站的主地址（`http://localhost:8080/wordpress/`）时，你将看到更新后的作品！要查看文章的活动，点击你创建的新文章标题。文章网页会显示针对该文章的所有评论，并允许他人发表新评论。当访访者发表评论时，你需要进入仪表面板的“评论”部分审核该评论，它才会出现在文章网页上。\n\
  \n![tip](img/tip.png) 还有许多其他你可能想要为新网站自定义的功能。所有功能都可以从仪表面板界面访问，因此请随时浏览不同的部分并查看你可以做的所有不同操作。许多书籍都提供了有关如何设置和维护\
  \ WordPress 网站的详细说明，例如 Lisa Sabin-Wilson (Wiley) 编写的*傻呆式 WordPress 指南》（WordPress\
  \ All-in-One for Dummies）。\n\n## 探索插件世界\n\nWordPress 是为没有 HTML、CSS、JavaScript 或\
  \ PHP 知识的新手网页开发者设计的，但它也具有灵活性，可以由拥有这些技能的人（如你！）进行完全自定义。本节将介绍你使用简单的 PHP 代码编写来自定义你的\
  \ WordPress 网站以添加更多功能的各种方法！\n\n### WordPress API\n\nWordPress 是一个 PHP 应用程序，因此你可以查看组成\
  \ WordPress 应用程序的所有代码。只需浏览 `wordpress` 文件夹包含的文件即可查看其内容。\n\n![tip](img/tip.png) 忍住对这些代码进行修改或添加的欲望。你修改的任何代码可能（很可能会）在\
  \ WordPress 的下一个更新版本中被替换。与其修改 WordPress 核心代码文件，不如使用其他方法。\n\n\n\n\n插件 API 库提供了对内容数据以及\
  \ WordPress 应用程序内部处理这些数据的进程钩子（hooks）。你可以利用这些钩子，在 WordPress 处理数据并生成最终网页的过程中，在任何步骤对数据或处理进行修改。\n\
  \n对于插件来说，进入 WordPress 有两种类型的钩子：\n\n-   **过滤器（Filters）：** 过滤器是在数据遍历 WordPress 内部不同阶段时拦截数据的钩子。在拦截数据后，你可以在将其传递给处理的下一个步骤之前，对其进行修改、删除或添加。这让你对应用程序中的数据拥有了极大的控制权！\n\
  -   **动作（Actions）：** 动作是拦截 WordPress 内部过程的钩子，并允许你更改处理动作。例如，你可以挂接到 WordPress 的评论动作上，这样当网站访问者提交评论时，WordPress\
  \ 会调用你的插件，插件可以向你发送电子邮件通知。\n\n![tip](img/tip.png) 当你编写插件时，必须遵循代码格式和调用的 API 函数的特定规则：\n\
  \n- 你的插件文件必须存储在 `wordpress` 目录结构中的 `wp-content/plugins` 文件夹中。\n- 如果你的插件只需要单个文件，请将文件名命名为与插件相同的名称。如果插件需要多个文件，请在\
  \ `plugins` 文件夹中创建一个以插件命名的文件夹，然后将插件文件放在其中。如果你使用文件夹方法，主程序文件必须命名为 `init.php`。\n- 你的\
  \ PHP 代码开头需要一个注释部分，用于标识有关插件的重要信息。这被称为头部元数据（header metadata）。WordPress 使用头部元数据向用户提供有关你的插件的信息。至少，你必须在头部中指定插件的\
  \ `Name`（名称）和 `Description`（描述）：\n\n```php\n<?php\n/*\nPlugin Name: My Plugin\n\
  Description: My clever plugin for WordPress\n*/\n```\n- 定义完函数代码后，使用 `add_filter()`\
  \ 或 `add_action()` 函数将你的插件挂载到 WordPress。\n\n在插件内部，你编写的代码必须遵循标准的 PHP 编码规范。列举 4-1\
  \ 显示了一个动作插件的示例。\n\n### 列表 4-1 示例动作插件\n\n```php\n<?php\n/*\nName: My Comment Mailer\n\
  Description: Email me when someone makes a comment\nfunction my_comment_mailer($comment_ID)\
  \ {\n    $myaddress = \"me@localhost.com\";\n    $message = \"Comment $comment_ID\
  \ just posted to my website\";\n    mail($myaddress, \"Comment on website\", $message);\n\
  \    return $comment_ID;\n}\nadd_action('comment_post', 'my_comment_mailer');\n\
  ?>\n```\n\n你创建的 `my_comment_mailer()` 函数名在 WordPress 中必须是唯一的，因此注意不要使用过于通用的函数名。\n\
  \n大多数动作和过滤器钩子会将数据传递到你的插件函数中，因此通常你需要提供一个参数变量来接收传入的数据，即使你并不使用它。`add_action()` 函数指定了要挂接到哪个\
  \ WordPress 钩子来触发你的函数，以及当钩子触发时要调用的函数名称。\n\n![tip](img/tip.png) 当你创建一个插件时，它会出现在控制面板的“插件”页面。你必须通过该界面激活你的插件，它才能生效。\n\
  \n#### 小部件（Widgets）\n\n小部件 API 的工作原理与插件 API 。小部件是一种特殊的插件。它们遵循与编写过滤器或动作插件相同的规则，但你不是创建一个简单的函数，而是创建一个继承\
  \ `WP_Widget` 类的类作为你的小部件：\n\n```php\nclass mywidget extends WP_Widget {\n```\n\n\
  通过继承 `WP_Widget` 类，你的小部件会自动获得所有小部件可用的功能和函数。你需要创建一个构造方法来接受父类方法：\n\n```php\nfunction\
  \ mywidget() {\n    parent::WP_Widget(false, \"mywidget\");\n}\n```\n\n随后，你创建代码来生成显示在小部件区域的输出（通常位于侧边栏，你也可以将小部件放在页脚区域）。这段代码使用了名为\
  \ `widget()` 的特殊函数：\n\n```php\nfunction widget($args, $instance) {\n    echo \"\
  Welcome to my first widget!<br>\\n\";\n}\n```\n\nWordPress 钩子会传递小部件运行所需的任何参数，以及小部件存储在\
  \ WordPress 数据库中的任何选项数组。\n\n如果你的小部件需要自定义选项，你可以在小部件类中的 `form()` 方法中指定它们。WordPress\
  \ 会在小部件管理器中显示 `form()` 方法的输出，以便你的小部件用户添加他们的自定义选项。然后你定义 `update()` 方法将这些选项保存到 WordPress\
  \ 数据库中。\n\n最后，你需要通过定义 `register_widget()` 方法并在 `add_action()` 方法中使用它，在 WordPress\
  \ 中注册你的小部件：\n\n```php\nfunction register_mywidget() {\n    register_widget('mywidget');\n\
  }\nadd_action('widgets_init', 'register_mywidget');\n```\n\n在你创建完小部件的代码后，你需要在控制面板的“插件”区域激活它。然后你就可以前往“外观”\n\
  \n## 创建你自己的小部件\n\n现在你已经了解了插件（特别是小部件）是如何制作的，你准备好创建一个了！本节将详细介绍小部件的代码。\n\n### 编写小部件\n\
  \n第一步是创建小部件的代码。小部件必须遵循 WordPress 的编码规则。按照以下步骤构建小部件：\n\n1. 打开你喜欢的文本编辑器、程序编辑器或集成开发环境（IDE）。\n\
  2. 输入以下代码：\n\n```php\n<?php\n/*\nPlugin Name: AuctionHelper\nDescription: Retrieve\
  \ real-time\n*/\nclass AuctionHelper extends WP_Widget {\n    function AuctionHelper()\
  \ {\n        parent::WP_Widget(false, \"AuctionHelper\");\n    }\n\n    function\
  \ widget($args, $instance) {\n        $db = new mysqli(\"localhost\", \"ah_user\"\
  , \"AuctionHelper\", \"auction\");\n        $query = \"SELECT count(bidderid) FROM\
  \ bidders\";\n        $result = $db->query($query);\n        $row = $result->fetch_array();\n\
  \        $bidders = $row[0];\n\n        $query = \"SELECT count(itemid) FROM items\"\
  ;\n        $result = $db->query($query);\n        $row = $result->fetch_array();\n\
  \        $items = $row[0];\n\n        $query = \"SELECT sum(resalerice) FROM items\"\
  ;\n        $result = $db->query($query);\n        $row = $result->fetch_array();\n\
  \        $totprice = $row[0];\n\n        echo \"<h2>Auction Totals</h2><hr>\\n\"\
  ;\n        echo \"Registered bidders: $bidders<br>\\n\";\n        echo \"Total Items:\
  \ $items<br>\\n\";\n        echo \"Items resale value: $$totprice<br>\\n\";\n  \
  \      echo \"<hr><br>\\n\";\n    }\n}\n\nfunction register_AuctionHelper() {\n\
  \    register_widget('AuctionHelper');\n}\nadd_action(\"widgets_init\", \"register_AuctionHelper\"\
  );\n?>\n```\n\n3. 打开 Windows 的文件资源管理器或 Mac 的 Finder，导航到 Web 服务器 `htdocs` 文件夹下的 `wordpress`\
  \ 文件夹。\n4. 双击 `wp-content` 文件夹，然后双击 `plugins` 文件夹。\n5. 在此处创建一个名为 `AuctionHelper`\
  \ 的新文件夹。\n6. 回到编辑器，将文件保存在新的 `AuctionHelper` 文件夹中，命名为 `init.php`。\n\n\n\n### 7. **在你的编辑器用器中打开一个新标签页，并输入以下代码：**\n\
  \n```php\n<?php\n//dummy file\n?>\n```\n\n### 8. **将文件保存为 `AuctionHelper` 文件夹中的\
  \ `index.php`。**\n\n你应该能认出 `widget()` 方法的代码。它使用 `php_mysqli` 库函数查询 `auction` MySQL\
  \ 数据库以获取竞价者和项目信息，然后将这些信息存储在 PHP 变量中。获取必要数据后，代码使用 `echo` 语句显示信息。你通过 `widget()` 方法显示的内容将出现在\
  \ WordPress 网站的侧边栏区域。\n\n![tip](img/tip.png) `index.php` 文件是一个空位文件。它有助于防止攻击者直接导航到插件文件夹并列出位于那里的文件。如果你在\
  \ URL 中指定了一个文件夹，Web 服务器将自动向浏览器提供 `index.php` 文件。如果不存在 `index.php` 文件，浏览器将显示该文件夹中文件的列表。\n\
  \n现在你已经构建了该小部件（widget），需要从你的 WordPress 网站中激活它。\n\n### 激活小部件插件\n\n在使用你刚刚编写的 AuctionHelper\
  \ 小部件之前，你需要让 WordPress 知道它可以使用。按照以下步骤操作：\n\n1. **打开浏览器并输入以下 URL：**\n\n   `http://localhost:8080/wordpress/wp-admin`\n\
  \n2. **使用你在安装过程中创建的用户名和密码登录 WordPress。**\n\n3. **点击仪表板左侧导航菜单中的“插件 (Plugins)”菜单选项。**\n\
  \   你的 AuctionHelper 小部件插件应该出现在插件列表中，如图 4-10 所示。\n\n4. **点击 AuctionHelper 插件下方的“激活\
  \ (Activate)”链接。**\n   网页顶部会出现一条消息，告知插件已激活。\n\n![image](img/9781119468387-fg060410.png)\n\
  \n图 4-10： 在 WordPress 中激活 AuctionHelper 插件。\n\n现在 AuctionHelper 小部件已激活，已准备好在你的 WordPress\
  \ 网站中运行。最后一步是将其添加到侧边栏。\n\n### 添加小部件\n\n激活 AuctionHelper 小部件插件后，它现在应该会出现在“自定义 (Customize)”页面的小部件列表中。按照以下步骤将\
  \ AuctionHelper 小部件添加到你的网页中：\n\n1. **点击仪表板左侧导航菜单中的“外观 (Appearance)”链接，然后选择出现在“外观”链接下方的“小部件\
  \ (Widgets)”菜单项。**\n   你将看到网页右侧的小部件列表中出现了 AuctionHelper 小部件。\n\n2. **将 AuctionHelper\
  \ 小部件拖放到博客侧边栏区域，并将其放置在列表的顶部。**\n   图 4-11 显示了当你放开小部件时它应该是的样子。\n\n3. **点击 AuctionHelper\
  \ 小部件区域中的“完成 (Done)”链接以完成过程。**\n\n4. **从仪表板注销。**\n\n![image](img/9781119468387-fg060411.png)\n\
  \n图 4-11： 将 AuctionHelper 小部件添加到博客侧边栏。\n\n恭喜！你刚刚创建并安装了你的第一个 WordPress 小部件。是的，真的就只有这些！现在是见真章时刻了——测试你的小部件。打开浏览器并输入\
  \ WordPress URL：\n\n`http://localhost:8080/wordpress`\n\n向下滚动显示你网站的内容。在侧边栏部分的顶部，你应该能看到由你的小部件创建的“拍卖总额\
  \ (Auction Total)”区域！这在图 4-12 所示。\n\n![image](img/9781119468387-fg060412.png)\n\n\
  图 4-12： 将 AuctionHelper 小部件添加到 WordPress 网站的结果。\n\n你应该能在 WordPress 侧边栏中看到你 AuctionHelper\
  \ 数据库的当前值。为了确保一切真的正常工作，回到你的 AuctionHelper 应用并添加一两个项目。然后回到你的 WordPress 网站，刷新页面，并确保更改已出现。这酷酷吗？\n\
  \n这仅仅涵盖了你在使用 WordPress 和创建自己的插件时指尖拥有的一小部分力量。现在有了这些新技能，你可以为 WordPress 网站添加几乎任何类型的功能或应用程序，给你的老板或客户留下深刻印象！\n\
  \n第 7 册\n\n# 使用 PHP\n\n## 使用 PHP\n\n### 目录\n\n1. 第 1 章：方法\n   - 熟悉 MVC\n   - 将 MVC\
  \ 与其他方法对比\n   - 了解 MVC 如何融入多层架构\n   - 实现 MVC\n2. 第 2 章：选择框架\n   - 了解框架\n   - 了解为什么你应该使用框架\n\
  3. 第 3 章：创建应用程序\n   - 构建模板\n   - 创建脚架\n   - 修改脚架\n\n第 1 章\n\n# 方法\n\n本章内容\n\n- 熟悉\
  \ MVC 的介绍\n- 将 MVC 与其他方法对比\n- 实现 MVC\n- 在客户端/服务器环境中使用 MVC\n\n在第 6 册中，我带你了解如何使用面向对象的技术创建一个完整的动态应用程序。但是，设计面向对象应用程序的方法不止一种。事实上，有很多种关于如何用\
  \ PHP 设计和编写动态应用程序的理论，每种理论都有其优缺点。本章将介绍其中一种流行的方法，并将其与其他方法进行对比。\n\n## 熟悉 MVC\n\n如果你花时间阅读关于\
  \ PHP 编程的文章、书籍甚至讨论组帖子，你一定遇到过 `MVC` 这个术语。该缩写代表“模型-视图-控制器 (model–view–controller)”，它是将你的面向对象的程序代码拆分成多个部分以便于编码的方法。\n\
  \n本节首先描述 MVC 是如何工作的，然后深入探讨构成 MVC 应用的每个独立组件。\n\n### 了解 MVC 方法\n\nMVC 编程方法实际上比 Web\
  \ 编程早得多。它是在图形化桌面编程早期设计的，作为一种组织需要大量代码来支持用户交互的应用程序的方法。开发者很早就不再将显示代码交织在应用程序代码中，而是尝试将这些功能分离到独立的组件中。\n\
  \n\n\n\nWeb 应用程序编程与桌面图形应用程序编程有许多相似之处，因此许多 Web 开发者已经采用 MVC 方法来创建面向对象的 Web 应用程序。\n\
  \n大多数 MVC 专家对应用的三个基本组件达成共识，但对于它们应该如何相互作用，存在几种不同的理论。在听到“理论”这个词让你的眼睛开始发直之前，让我先向你展示\
  \ MVC 理论最流行的解释方式，如图图 1-1 所示。\n\n![image](img/9781119468387-fg070101.png)\n\n图 1-1:\
  \ 基础 MVC 理论图。\n\n大多数 MVC 专家认为，控制器（controller）组件是应用程序的“大门”。控制器的工作是应用程序的交通警察，将用户请求调度到正确的模型类方法，以便与请求的数据进行交互——无论是插入新数据、更新现有数据，还是仅仅列出现有数据（或数据的子集）。模型类方法执行实际工作，产生支持用户请求所需的数据，然后将结果传递给视图（view）。\n\
  \n视图的工作是将请求的结果组织成视觉输出。这种视觉输出可能简单到只是一个操作成功的通知，也复杂到显示请求的数据元素的完整报告。无论请求结果如何，向应用程序用户通信结果都是视图的工作。\n\
  \n你可能已经开始看出 MVC 方法如何轻松融入你的动态 Web 应用程序了。Web 应用程序接收来自客户端浏览器的某种数据操作请求，然后需要以网页的形式将请求的数据显示回客户端浏览器。能够将这些功能拆分为独立的组件会非常有帮助。\n\
  \n这种特性在大型开发环境中非常有吸引力，因为更容易分离不同开发小组之间不同的编码需求。通过 MVC 编程方法，你可以让你最出色的 HTML 和 CSS 程序员专注于视图代码，而让你最出色的\
  \ PHP 和 SQL 程序员专注于模型和控制器代码。\n\n这意味着你可以让多个开发小组同时对应用程序代码工作，而不会互相产生问题。由于不同的小组同时编写代码，应用程序的完成速度可能会比其他面向对象的方法更快。\n\
  \n当然，所有的编码方法都有缺点，MVC 应用开发方法也是如此。关于使用 MVC 方法开发的应用程序，你会看到的最大的抱怨之一是它们可能相当难以理解和排查故障。\n\
  \n将代码拆分成独立的组件可能会使尝试跟踪应用程序代码变得更加复杂。当客户端请求数据时，多个类文件会参与到该过程中。你将无法跟踪单个应用程序文件的执行情况，而是发现自己必须翻几个不同的较小的应用程序文件，寻找导致问题的那个\
  \ bug。\n\n关于 MVC 方法的另一个抱怨是，在编程环境中实现可能有些困难。将 MVC 编程方法整合到应用程序中需要时间进行练习，而大多数 Web 应用程序开发者并没有这些时间。幸运的是，有工具可以提供帮助，我将在本迷你书的第\
  \ 2 章中介绍。\n\n### 深入研究 MVC 组件\n\n现在你已经看到了关于 MVC 是什么的高层概述，让我们来看看各个组件所需的内部结构。本节将更深入地介绍每个\
  \ MVC 组件的作用。\n\n#### 模型（The model）\n\nMVC 方法的模型组件是大部分 PHP 应用程序代码所在的地方。它的工作是为应用程序与应用程序所需的任何数据之间提供一个通用接口。\n\
  \n当然，现在大多数 Web 应用程序使用某种数据库系统来存储应用程序数据（例如应用程序示例中的 `MySQL` 服务器）。模型代码位于应用程序和数据库表之间。对数据的任何访问必须通过模型代码。\n\
  \n大多数 MVC 模型实现使用一种名为“对象关系映射”（`object-relational mapping`，`ORM`）的技术来提供这种接口。`ORM`\
  \ 类负责处理与底层表所有交互的方法：\n\n*   创建新数据记录\n*   读取现有数据记录\n*   更新现有数据记录\n*   删除现有数据记录\n\n\
  `create`、`read`、`update` 和 `delete` 方法的组合通常被称为 `CRUD`。除了这四个 `CRUD` 方法外，模型类通常还包含支持应用程序所需的任何类型数据操作的其他方法。\n\
  \n`ORM` 与应用程序中使用数据交互的方法有两种不同的方法：\n\n*   **关系数据方法（Relational data method）：** 在关系数据方法中，你为应用程序数据库中的每个表创建一个模型类。例如，在第\
  \ 6 册中讨论的 `AuctionHelper` 应用程序中，它包含一个 `Bidders` 表和一个 `Items` 表，你需要为 `Bidders` 表创建一个模型类，并为\
  \ `Items` 表创建第二个模型类。模型类使用标准 `SQL` 与表中的数据进行交互。图 1-2 演示了这种方法。\n\n*   **面向对象数据方法（Object-oriented\
  \ data method）：** 面向对象数据方法在应用程序与数据库交互方面采用了略有不同的方法。它不使用关系型数据库，而是使用面向对象的数据库系统（`OODBMS`），它以对象的形式存储数据。由于数据是以对象形式存储的，模型类对象可以更容易直接映射到数据库。图\
  \ 1-3 演示了这种方法。\n\n![image](img/9781119468387-fg070102.png)\n\n图 1-2: 关系数据方法。\n\n\
  ![image](img/9781119468387-fg070103.png)\n\n图 1-3: 面向对象数据方法。\n\n在 `OODBMS` 中，相关数据在数据库中作为键及其关联值自动分组在一起，例如将竞标者作为键，他们赢得的物品作为值。不像关系数据库方法那样对数据进行正式的分离。通过将这些对象分组，你创建了一个虚拟对象，通过向数据库提交键并检索关联值可以更快地查询和获取信息。\n\
  \n![tip](img/tip.png) 随着 `OODBMS` 理论日益流行，已经开发了一些不同的 `OODBMS` 数据库服务器。目前，流行的 `OODBMS`\
  \ 服务器是 `NoSQL` 服务器项目。它以 `XML` 文件的形式存储数据，随着应用程序数据的增长可以可以地添加和追加。\n\n#### 视图（The view）\n\
  \n视图组件负责应用程序的所有输出。它获取模型组件提供的原始数据，并将其格式化为应用程序用户视觉上愉悦的方式。对于我们的 Web 应用程序，视图组件是所有 HTML\
  \ 和 CSS 代码所在的地方。\n\n视图组件代码通常位于应用程序的一个文件夹区域中，不同的文件负责创建应用程序的不同功能。这使得视图代码与应用程序中的模型和组件代码完全分离开。\n\
  \n\n\n\n在 AuctionHelper 应用中，我选择不实现独立的视图组件，而是将显示应用程序数据的代码直接放置在控制数据的文件中。这意味着将 PHP、HTML、CSS\
  \ 甚至 JavaScript 代码混合在同一个文件中。如果你是在编写自己的应用程序，这没问题；但如果你在一个将模块划分给不同编程小组（programming\
  \ groups）的编程环境中工作，这可能会变得非常混乱。\n\n在处理移动设备时，拥有一个独立的代码组件来处理视图会非常派用用。在如今，仅仅将你的应用程序编写为适用于普通桌面浏览器环境的\
  \ Web 页面已经不够了。随着移动设备的普及，你的应用程序可能需要在桌面和移动环境中都是可用（且可读）的。\n\n这可能要求你为不同的显示环境创建不同的 CSS\
  \ 样式集（有时甚至是另一套不同的 HTML 代码集）。移动设备的显示区域要小得多，需要一些额外的考虑，以确保你的网站访问者能够与应用程序进行适当交互。尝试维护两个独立的代码库可能会变得混乱，特别是当你将视图代码嵌入应用程序中时。\n\
  \n将生成显示输出所需的代码隔离到独立的组件中，可以更方便地为多个设备整合多份代码——为桌面浏览器准备一套视图代码，为移动设备准备另一套。图 1-4 展示了这是如何运作的。\n\
  \n![image](img/9781119468387-fg070104.png)\n\n图 1-4： 为不同的显示环境使用多个视图模块。\n\n两个设备向控制器提交相同的\
  \ HTTP 请求，控制器将两个请求都转发给模型。模型向视图发送相同的响应，但视图以不同的方式处理这些响应。\n\n![tip](img/tip.png) CSS3\
  \ 和 JavaScript 都提供了方法，让你检测设备显示器的大小，并判断网站访问者是在移动设备还是桌面浏览器上查看应用程序。在 CSS3 中，`@media`\
  \ 规则中的 `max-width` 属性允许浏览器根据窗口的大小选择应用哪些 CSS 规则。对于 JavaScript，你可以使用全局属性 `screen.width`\
  \ 来确定视图区域的大小。\n\n### 控制器\n\n控制器接收来自应用程序用户的请求，并将其发送到满足请求所需的组件。这意味着要能够在所有模型类之间，以及显示数据所需的视图文件之间进行通信。\n\
  \n控制器使用*路由*（routing）来根据客户端浏览器的请求确定要运行哪个模型类方法。路由将从客户端浏览器接收的特定 HTTP `GET` 或 `POST`\
  \ 请求映射到特定的模型类方法。\n\n在 AuctionHelper 应用中，我通过设置 HTML `content` 变量/值对来实现这一点。`index.php`\
  \ 代码充当了应用程序控制器，指示显示哪个包含文件作为主 页面内容。因此，为了显示 `bidderid` 值为 100 的竞价者的详情，客户端浏览器发送了以下请求：\n\
  \n```\nindex.php?content=showbidder&id=100\n```\n\nAuctionHelper 应用中的 `index.php`\
  \ 代码获取了 `content` HTML 变量/值对，然后使用该值包含 `showbidder.inc.php` 文件，该文件随后使用 `id` 值 `100`\
  \ 来显示相应的竞价者信息。\n\nMVC 控制器使用类似的方法，但利用 Web 服务器的*重写规则*（rewrite rules）功能来帮助清理请求 URL\
  \ 的格式。重写规则允许你自定义 URL 格式，以比标准 `GET` 方法更整洁的格式传递信息。例如，显示竞价者 100 信息的 URL 请求可能看起来像这样：\n\
  \n```\nindex.php/bidders/show/100\n```\n\nWeb 服务器解析 URL 以设置 HTML 变量/值对。然后，控制器路由规则引导应用程序调用\
  \ `bidders` 模型类的 `show` 方法，并为其传递 `bidderid` 值 `100`。\n\n![tip](img/tip.png) 搜索引擎优化\
  \ (SEO) 是设计应用程序的过程，以便让互联网搜索引擎（如 Google）更容易找到并收录你的网站页面。Web 服务器重写规则在帮助提高你的搜索引擎可见性方面可以起着至关重要的作用，因为许多搜索引擎不会扫描包含长串变量/值对列表\
  \ URL 网站。通过自动解析 URL 数据，你可以缩短很多 URL 长度，使其更符合 SEO 友好性！\n\n### MVC 中的通信\n\n在 MVC 方法中，由于你必须将\
  \ Web 应用程序的所有功能划分为独立的组件，组件之间的通信变得至关重要。每个组件必须知道何时以及如何向其他组件通信信息，以便应用程序正常运行。\n\n早些，图\
  \ 1-1 展示了经典的 MVC 通信方法。与网站访问者的请求通信有五个独立步骤：\n\n1. 控制器从网站访问者的浏览器接收请求。\n2. 控制器将请求传递给模型组件中相应的类方法。\n\
  3. 模型类方法根据请求对数据执行适当的操作。\n4. 模型类方法将任何结果数据或状态传递给视图。\n5. 视图将格式化后的数据发回给访问者。\n\n这看起来很有组织且合理，但这个过程中存在一些漏洞，会导致问题：\n\
  \n* 控制器负责处理客户端请求，但不负责返回响应。如果会话需要特殊通信（例如加密密钥或会话 ID），视图必须从控制器获取这些信息。\n* 模型负责检索请求所需的数据，但视图负责数据显示的格式。这会让常见的\
  \ 页面功能（如多页分页）变得复杂。数据分页通常通常在模型代码中使用 SQL 指令处理，而不是在视图代码中使用 PHP。这意味着视图和模型之间也必须通信信息。\n\
  * 视图必须了解客户端浏览器环境，以便在客户端设备上格式化数据。这可能需要与启动控制器进行通信。\n\n由于这些小问题，许多 MVC 实现违反了严格的 MVC\
  \ 方法并实现了组件类之间的通信。这有助于消除应用程序内部的问题，并为网站访问者提供更流畅的界面。\n\n## MVC 与其他 Web 模型\n\n正如你所料到的，MVC\
  \ 方法不是创建面向对象应用程序的唯一理论。本节将探索你在探索面向对象应用程序世界时可能会另外两种流行方法：MVP 方法和 MVVM 方法。\n\n### MVP\
  \ 方法\n\n*模型-视图-演示器*（MVP）方法是另一种创建面向对象应用程序的流行方法。起初，它的名字听起来有些冗余——演示器似乎在和视图做相同的工作。\n\
  \nMVP 方法在处理客户端请求的过程中采取了更线性的方法，如图 1-5 所示。\n\n\n\n\n图 1-5: 模型–视图–演示器（MVP）方法。\n\n在\
  \ MVP 方法中，视图（view）处理过程中的请求部分和响应部分，承担了 MVC 控制器与客户端通信的功能。\n\n演示器（presenter）充模型（model）和视图之间的中间人。它解释客户端请求并调用适当的模型类方法。在模型处理请求并生成相应的响应后，它会将响应发送给演示器，由演示器将其传递给视图进行格式化并显示。\n\
  \n如你所见，MVP 方法基本上将 MVC 方法中的控制器工作分配在视图模块和演示器模块之间，使得流程变得更加精简。这有助于消除 MVC 方法中存在的一些通信问题。\n\
  \n### MVVM 方法\n\n*模型–视图–视图模型*（MVVM）方法与 MVP 方法相似，但略有不同，如图图 1-6 所示。\n\n![image](img/9781119468387-fg070106.png)\n\
  \n图 1-6: 模型–视图–视图模型方法。\n\n视图模型（viewmodel）充当视图和模型之间的中间人，类似于 MVP 中的演示器模块。但与 MVP 中的演示器模块不同，视图模型并不操作数据——它只是在视图和模型之间提供一个接口。\n\
  \n视图模型在视图的图形环境和模型的数据中心环境之间创建了一个抽象层。这个抽象层允许编写视图代码的程序员提供模型数据的接口，而无需了解底层数据的细节或模型如何处理数据。\n\
  \n这种数据抽象有助于开发过程，因为用户界面的变化通常比底层数据更频繁。图形设计师可以进行更改，而不必担心破坏数据库的设计。\n\n## 了解 MVC 如何融入\
  \ N 层理论\n\n如果你在大规模环境下进行过任何类型的 Web*多层架构*（通常称为 *n 层架构*）Web 应用开发，你可能听过甚至用过这种方法。在*n\
  \ 层*架构中，开发者根据功能将 Web 应用拆分为独立的物理服务器，如图图 1-7 所示。\n\n![image](img/9781119468387-fg070107.png)\n\
  \n图 1-7: *n 层*理论架构。\n\nn 层架构布局通常由三个物理服务器组成：\n\n*   与客户端浏览器交互的 Web 服务器（称为*表现层*）\n\
  *   运行服务器端应用代码的应用程序服务器（称为*逻辑层*）\n*   存储应用程序数据的数据库服务器（称为*数据层*）\n\n*n 层架构*的主要目标是将\
  \ Web 应用的不同功能划分到独立的物理服务器上。这样做有助于防止服务器瓶颈，并更容易根据需要扩展单个服务器以支持应用负载，或在不同的 Web 应用之间共享服务器资源。\n\
  \n*n 层架构*的 Web–应用–数据库布局与 MVC 的模型–视图–控制器模型非常相似，但存在区别。需要记住的是，*n 层架构*指的是应用程序的物理服务器环境，而不是应用程序软件。MVC\
  \ 方法代表了一种划分 Web 应用软件需求的方法，无论底层硬件如何。\n\n*n 层架构*可以支持任何类型的软件应用方法，你的 MVC 应用可以运行在任何类型的服务器环境中。在*n\
  \ 层*服务器环境中实现你的 MVC 应用固然是可能的，但你也可以同样容易地在标准的单服务器 Web 环境中运行它。\n\n## 实现 MVC\n\n在 AuctionHelper\
  \ 应用中，你使用在服务器上的 PHP 代码以及在客户端的 HTML、CSS 和 JavaScript 代码来创建应用程序。在考虑 MVC 编程方法时，脑海中经常浮出的第一个问题是：“它是在哪里实现的？”\n\
  \nMVC 方法并不一定是客户端端或服务器端的编程范式。MVC 方法的某些可以在 Web 应用环境的任一侧运行。弄清楚哪些部分适合何种位置可能具有一定的挑战性。\n\
  \n大多数 MVC 实现侧重于服务器端编程环境，将客户端代码留给从视图组件展示数据。然而，通过 Ajax 技术（参见第 6 本第 3 章），你也可以在客户端实现模型，根据需要从服务器上的数据库表中检索数据。由于这本书主要关于编写\
  \ PHP 应用，因此我重点关注在 PHP 服务器端编程代码中使用 MVC。\n\n幸运的是，有很多工具可以帮助你在 PHP 应用中利用 MVC 概念。下一章将讨论\
  \ MVC 的使用。\n\n# 第 2 章：选择框架\n\n## 本章\n\n*   ![image](img/check.png) **熟悉框架**\n* \
  \  ![image](img/check.png) **识别框架的组成部分**\n*   ![image](img/check.png) **探索框架包**\n\
  *   ![image](img/check.png) **查看微框架**\n\n当你编写较大的 Web 应用时，你会发现自己需要在项目中编写大量的重复代码。许多标准应用功能（如显示数据或向表中插入新数据）的代码是非常常见的且是重复的。在你为\
  \ PHP 程序写到睡着之前，有一个你应该尝试的解决方案。有很多可用工具可以帮助编写重复代码，并为你确实需要的代码提供一些工具。\n\n## 了解 PHP 框架\n\
  \n`PHP 框架`并不是用于你应用程序的特殊服务器，也不是你需要编写的另一种编程语言。`PHP 框架包`是代码文件、库文件和实用脚本的组合，通过自动生成一些代码来帮助你启动应用开发。\n\
  \n\n\n\n\n通过坚持基于 MVC 对应用程序中的功能进行拆分的严格规则集，框架包可以生成与你的表接口交互的模型代码、用于显示数据的视图代码，以及用于将浏览器请求重定向到正确类方法的控制器代码。这些文件将成为你构建应用程序其他部分的模板。\n\
  \n大多数 PHP 框架包都使用 MVC 方法来生成应用程序代码，但它们在提供的功能和使用方式上有所不同。接下来的章节将带你了解你在 PHP 框架包中会发现的一些不同功能。\n\
  \n## 约定优于配置 (Convention over configuration)\n\n一个让框架包变得更易于使用的功能是为应用程序中的文件实施特定的文件命名约定。在\
  \ MVC 应用程序中，有许多不同的模型文件、控制器文件，当然还有大量用于完成应用程序的各种视图文件。试图组织所有这些文件使其符合逻辑，可能是一场噩梦。\n\n\
  一种解决方案是使用标准的配置文件。在配置文件中，你必须指定由哪个控制器类文件处理哪一个浏览器请求。在控制器处理请求后，它需要知道应该使用哪个模型类文件来与请求的数据进行交互。\n\
  \n最后，当控制器代码检索数据时，它需要知道应该使用哪个视图文件来显示从模型中检索的数据。正如你可能猜到的那样，尝试使用配置文件定义所有这些将是非常困难的。\n\
  \n与其尝试在配置文件中定义所有操作，大多数框架包都整合了文件命名约定。`约定优于配置`这一短语在框架领域非常常用。它的意思是遵循文件命名约定来引导控制器操作，而不是尝试使用配置文件来引导一切（可能仍会有一些配置文件，例如用于定义数据库的连接信息）。\n\
  \n约定对你在应用程序内部应该使用的文件名定义了严格的规则。这样，每个组件都可以假设它需要与之交互的对应文件的名称。应用程序仅根据文件名就知道使用哪些控制器、模型和视图文件。这在图\
  \ 2-1 中有所演示。\n\n![image](img/9781119468387-fg070201.png)\n\n图 2-1： 使用文件命名约定处理网络请求。\n\
  \n在图 2-1 所示的示例中，当你的浏览器提交一个请求以查看 Bidders 表中包含的数据记录时，应用程序会调用在名为 `BiddersController.php`\
  \ 的控制器文件中定义的 `view()` 方法。当控制器的 `view()` 方法需要访问 Bidders 表中的数据时，它使用名为 `BiddersTable.php`\
  \ 的模型类文件。在检索到数据记录的字段值后，`view()` 控制器方法使用名为 `BidderView.php` 的视图文件在网页中显示这些数据。\n\n\
  注意应用程序的流程，以及流程中的每个部分如何包含它正在处理的对象的名称，以及它正在执行的操作名称。通过引入文件命名约定，框架包不需要为所有这些交互定义配置设置——框架包会为你处理好这一切！\n\
  \n## 脚手架 (Scaffolding)\n\n正如我在在本章前面提到的，你编写的许多与表交互的代码最终看起来都是那样的。几乎每个 Web 应用程序都需要在数据库表创建创建、读取、更新和删除数据记录（参阅本本书的第\
  \ 1 章了解更多关于 CRUD 缩写）。这些函数在 Web 应用程序中已变得如此，以至于大多数框架包都有能力为你编写这些代码！\n\n`Scaffolding`\
  \ 是框架包脚本检查表中定义的数据字段，并自动生成执行对表数据所有 CRUD 操作所需的控制器、模型和视图代码文件的过程。如果你的应用程序使用多个数据库表，你可以对每个表执行脚手架操作，自动生成与所有表交互的文件。图\
  \ 2-2 显示了从脚手架代码生成的 CRUD 接口的示例。\n\n![image](img/9781119468387-fg070202.png)\n\n图\
  \ 2-2： 由 CakePHP 框架包生成的 CRUD 接口。\n\n就像建筑工作一样，脚手架并不是最终产品——它是帮助你构建最终产品的。在框架包生成脚手架代码后，你可以轻松修改内容以适应你特定的应用程序环境，包括为你的网页添加所需的任何样式。\n\
  \n脚手架的另一个伟大特性是，你不会受限于脚手架过程生成的代码。如果某些内容不完全符合你的应用程序，可以轻松调整生成的代码以达到你想要的状态。通过将功能拆分到模型、视图和控制器，更容易找到所需的内容。\n\
  \n## 路由 (Routing)\n\n动态 Web 需要与浏览器进行大量交互。当网站访问者点击链接或按下按钮时，会生成浏览器用于请求更多信息的 URL。\n\
  \n这些交互需要在不同的 URL 在浏览器和应用程序之间传递信息。仅仅跟踪应用程序所需的所有 URL 可能是一项全职工作。\n\n`Routing` 通过定义控制器如何处理每个\
  \ URL 来帮助这一过程。大多数框架包包含了处理来自浏览器的 URL 的特定路由规则：\n\n`http://hostname`*`/classname`*`/methodname`*`/data`\n\
  \n[/] 指定了处理请求的控制器类名称，以及处理请求的类方法名称。函数所需的任何数据作为第三个元素添加。图 2-3 演示了这如何与 `Bidders` 类的\
  \ `view()` 方法工作。\n\n![image](img/9781119468387-fg070203.png)\n\n图 2-3： 使用路由引导客户端请求。\n\
  \n路由是框架中“约定优于配置”功能的另一个例子。通过遵循标准的路由约定，你可以轻松为应用程序添加新功能，并确保它们由控制器正确处理。\n\n![tip](img/tip.png)\
  \ 除了标准路由，在框架中整合额外功能时，大多数框架包还允许你定义自己的自定义路由路径。这让你在需要时在应用程序中使用自动和自定义请求路由具有完全的灵活性。\n\
  \n## Helper 方法 (Helper methods)\n\n所有框架包都允许你使用标准的 HTML、CSS、JavaScript 和 PHP 进行编码，但大多数框架还提供了一个代码库来帮助创建应用程序变得更容易。\n\
  \n这些额外的库函数在框架内部被称为 `辅助方法`。你可以选择使用它们，也可以继续使用 HTML、CSS、JavaScript 和 PHP 编写代码。然而，辅助方法通常可以为你节省时间和精力。\n\
  \n\n\n\n正如 `jQuery` 库的方法可以帮助简化复杂的 JavaScript 特性（参见第 3 本第 3 章），框架辅助方法也能帮助简化复杂的 HTML、CSS\
  \ 和 PHP 代码。例如，在 `CakePHP` 中，`link()` 辅助方法会根据你提供的控制器和方法名生成 `<a href>` 标签。这比在编写过程中尝试在\
  \ `<a href>` 标签中手动编写 URL 要容易得多。\n\n### 表单验证\n\n如今，从网站访问者那里通过 HTML 表单接收数据是一件很危险的事情。处理来自网站访问者的未知数据的关键在于验证。有许多\
  \ HTML、JavaScript 和 PHP 特性和函数可以对数据进行验证，以确保它们不仅格式正确，而且安全地插入到你的数据库中。\n\n然而，尝试利用所有可用的验证功能在编写时可能会相当复杂且耗时。幸运的是，大多数\
  \ PHP 框架包在某种程度上会自动为你生成必要的表单验证代码。你只需要定义表单字段及其数据类型，剩下的工作由框架代码来完成！\n\n### 对移动设备的支持\n\
  \n你再不能只写一个 Web 应用程序，就指它能同时满足使用大显示器的台式电脑/笔记本电脑的客户以及使用小显示屏移动设备的客户的需求。\n\n相反，你通常必须编写多个版本的应用程序呈现代码，检查浏览器可视区域的大小，并发送适当的样式来调整元素大小。这就是\
  \ `MVC` 编程方法大显身手的地方之一。在那种设置下，你只需要担心视图代码的重复，从而保持控制器和模型代码不变。\n\n这也是另一个框架包可以为你提供帮助的地方。你不再需要编写多个版本的\
  \ Web 页面，某些框架包提了自动缩放呈现功能的能力，以适应每个独立网站访问者所使用的可视区域。\n\n### 模板\n\n有时我觉得对于程序员来说，最糟糕的感觉就是当你必须生成一个美观的\
  \ Web 应用程序，却盯着一个空白的编辑器窗口时。仅仅是写出第一段支持网页的代码就可能是一个障碍。\n\n这又是另一个框架包可以为你提供帮助的地方。框架脚本可以自动生成基础代码模板，你可以将这些模板作为网站设计布局的基础。然后，你只需要将这些模板应用于应用程序中的每个网页即可。这有助于为你的应用程序创建一致的外观和感受。它还让你免于自己构思所有这些代码！\n\
  \n### 单元测试\n\n软件 Bug 是 Web 程序员的噩梦。在将 Web 应用程序发布给公众，或者更糟糕的是发布给付费客户之后还要处理软件 Bug，是一件麻烦。软件\
  \ Bug 会破坏应用程序（可能是你的）的声誉，并可能导致潜在访问者转向其他网站。减少软件 Bug 的关键在于测试。\n\n然而，在开发期间尝试测试应用程序可能会令人困惑，因为应用程序的不同部分可能依赖其他部分的完成。通常，你会发现自己处于一种循环困境，必须不断等待应用程序的另一部分完成才能测试任何部分。\n\
  \n框架包整合了名为 `unit testing`（单元测试）的功能来帮助解决这个问题。单元测试根据应用程序中单个操作的预期输入和输出提供简单的测试。通过单元测试，你可以根据预期的输入以及你预期它产生的输出，来判断应用程序的某部分是否工作正常。不需要考虑\
  \ Web 应用程序的其他部分——一切在单元测试环境中都是自成一体的。\n\n由于不需要依赖应用程序的其他部分，单元测试允许你对测试过程进行模块化，并帮助在尝试将它们组合在一起之前，确保\
  \ Web 应用程序中的每个独立功能运行正常。\n\n## 了解你为什么要使用框架\n\n如果你是一个经验丰富的 `PHP` 开发者，你可能认为你开发 Web\
  \ 应用程序不需要任何帮助。这可能是事实，但在你的 Web 开发工具中引入框架包还有其他原因。以下是即使是专业 Web 开发者转向框架包的一些常见原因：\n\n\
  *   **组织结构（Organization）：** `PHP` 框架强制你将应用程序代码组织到特定的文件和文件夹结构中。这不仅有助于开发过程，而且当你尝试排查可能多年前编写的应用程序时，也非常方便。知道该去哪里寻找特定函数，对于发现\
  \ Bug 和更新功能具有天壤之别的巨大差异。\n*   **开发速度（Speed of development）：** `PHP` 框架通过为你生成代码块存根（stubbing\
  \ out）来缩短应用程序开发时间，助力你的开发。只需让代码文件存在并填充所需的方法，就能帮助创建代码。\n*   **辅助方法（Helper methods）：**\
  \ 即使你不使用框架包中的脚手架（scaffolding）功能，仅仅拥有辅助方法库来简化你的代码，就能极大提高你的开发速度。你不需要手动编写长 HTML 代码块，只需插入一个简单的辅助方法并提供几个选项即可。\n\
  *   **数据库集成（Database integration）：** 与底层数据库的集成也是使用框架的关键。如果你必须创建在多个环境中运行的 Web 应用程序，你可能需要支持多种数据库服务器。大多数框架包使用简单的配置文件来定义数据库使用的服务器位置和类型。更改底层数据库服务器只是更改配置文件的简单事——不需要更改代码！\n\
  *   **可重用代码（Reusable code）：** 遵循相同的编码模板和模式，使得在多个应用程序中使用相同的控制器、模型甚至视图变得更容易。\n*  \
  \ **一致的外观和感受（Consistent look and feel）：** 与可重用代码类似，相同的应用程序模板允许你在应用程序内部保持一致的外观和感受，如果需要，也可以之间保持。\n\
  *   **测试（Testing）：** 使用框架包的测试功能在发布 Web 应用程序之前发现软件 Bug 有巨大的益处。大多数框架包的单元测试能力可以单独测试每个组件，以确保它们符合你的预期。\n\
  *   **社区（Community）：** 每个框架包都有自己的开发者社区，共同改进包功能并支持那些在使用功能时遇到问题的人。\n\n使用框架包可能并不适合所有人，但尝试两个并看看它们如何帮助你的\
  \ Web 开发并无坏处。为了帮助这一点，下节讨论了五个最流行的 `PHP` 框架包，以给你提供关于哪些值得尝试的想法。\n\n## 关注流行的 PHP 框架\n\
  \n现在你已经了解了框架是什么以及它们能做什么，你已经准备好一看一些流行的 `PHP` 框架包了。在本节中，我回顾了五个最流行的选项：\n\n*   `CakePHP`\n\
  *   `CodeIgniter`\n*   `Laravel`\n*   `Symfony`\n*   `Zend Framework`\n\n\n\n\n\
  这些软件包中的每一个都受到了支持，并在 PHP 开发者社区中拥有自己的追随者。选择一个框架包就像买汽车——不同的人有不同的需求和喜味，这决定了他们倾向于使用哪一个框架包。在决定使用哪一个进行开发工作之前，不要犹豫，尝试其中的几个。\n\
  \n#### CakePHP\n\nCakePHP 框架包 ([`www.cakephp.org`](http://www.cakephp.org)) 开发于\
  \ Ruby on Rails 框架风靡时期，支持许多相同的功能。Ruby on Rails 框架使用 Ruby 编程语言作为服务器端 Web 语言，是使用 MVC\
  \ 方法开发 Web 应用的早期先驱之一。\n\nCakePHP 遵循这种模式，并且高度面向 MVC。它将开发的 Web 应用结构化特定的控制器（controller）、模型（model）和视图（view）组件。这使得代码更容易追踪，并在需要时插入自己的代码。\n\
  \n当你浏览 CakePHP 网站时，你会发现它有大量的文档、教程和论坛支持。以下是在 CakePHP 中可以发现的一些优势：\n\n* 内置身份验证助手\n\
  * 增强的表单验证，以防止 SQL 注入、跨站脚本攻击和表单篡改\n* 使用脚手架（scaffolding）生成 MVC 应用的一个或所有组件的能力\n* 自带\
  \ `find()` 方法，只需少量的输入即可创建复杂的 SQL 查询\n* 大多数框架功能高度依赖约定优于配置（convention over configuration）\n\
  \nCakePHP 使用 Composer 包管理器来下载和安装创建应用程序框架所需的模板文件。只需导航到 Web 服务器的 `DocumentRoot` 文件夹并输入以下命令：\n\
  \n```\ncomposer create-project --prefer-dist cakephp/app appname\n```\n\n`appname`\
  \ 参数是你的应用程序名称。此命令下载了在你的应用程序中使用 CakePHP 所需的所有控制器、模型和视图模板文件。图 2-4 显示了 CakePHP 安装后生成的初始网页。\n\
  \n![image](img/9781119468387-fg070204.png)\n\n图 2-4： 默认的 CakePHP 框架网页。\n\n如果你寻找一个遵循\
  \ MVC 规范的全功能框架包，CakePHP 是一个非常值得考虑的工具。\n\n#### CodeIgniter\n\nCodeIgniter 框架包 ([`www.codeigniter.com`](https://www.codeigniter.com))\
  \ 是 PHP 框架世界的早期进入者。它支持完全的 MVC 兼容，但你也可以通过只定义控制器而不定义模型或视图组件来编写应用程序框架。这可以让 CodeIgniter\
  \ 更容易快速开发较小的 Web 应用。\n\nCodeIgniter 以易于学习的框架之一闻名（通常推荐给初学者）。它产生的框架代码以速度著称。以下是让 CodeIgniter\
  \ 受欢迎的其他特性：\n\n* 简单的 Web 应用不需要配置。\n* 有大量的库方法来帮助进行复杂的编码。\n* 你可以用很小的开销创建高性能网站。\n\n\
  CodeIgniter 是少数不使用 Composer 包管理器安装包的 PHP 框架包之一（至少在本书期间如此）。要安装 CodeIgniter，请访问 CodeIgniter\
  \ 主网站并点击 Download 链接。这将最新版本的 CodeIgniter 框架文件作为一个单个 zip 文件下载。\n\n将 zip 文件解压到 Web\
  \ 服务器的 `DocumentRoot` 文件夹下，以开始你的应用程序开发。这将成为你新应用程序的文件夹。图 2-5 显示了基础安装后出现的主网页。\n\n\
  ![image](img/9781119468387-fg070205.png)\n\n图 2-5： 默认的 CodeIgniter 框架网页。\n\n如果你只是想试用\
  \ PHP 框架包来感受它们的工作原理，CodeIgniter 无疑是最容易安装和玩玩的包之一。\n\n#### Laravel\n\nLaravel PHP\
  \ 框架包 ([`www.laravel.com`](https://www.laravel.com)) 已迅速成为 PHP 开发者中最流行的包。它具有广泛的功能和能力，用于生成复杂的\
  \ Web 应用。安装和配置可能有点复杂，但 Laravel 框架提供的功能使其非常值得。以下是 Laravel 中包含的一些特性：\n\n* 使用常用 REST\
  \ 原则的路由\n* 高级对象关系映射 (ORM) 数据库接口建模器\n* 用于简化提交数据库查询的高级查询生成器\n* 用于创建测试数据记录的数据库填充（seed）\n\
  * 自动包含大型数据结果集的分页功能\n* 包含自己的包绑定系统来处理库文件\n* 数据库架构的版本控制\n* 类文件自动装载以提高性能\n* 自动表单验证\n\
  \nLaravel 包使用 Composer 包管理器。\n\n```\ncomposer create-project --prefer-dist laravel/laravel\
  \ appname\n```\n\n你 Laravel 应用的大门实际上在 `public` 文件夹中。你需要将你的 Web 服务器 `DocumentRoot`\
  \ 指向该文件夹：\n\n```\nhttp://localhost:8080/laravel/public\n```\n\n图 2-6 显示了初始网页。\n\n\
  ![image](img/9781119468387-fg070206.png)\n\n图 2-6： 默认的 Laravel 框架网页。\n\nLaravel\
  \ 提供了一个名为 Homestead 的包，它是一个在虚拟机上运行的完整内置环境。它使用 Vagrant 配置工具构建可以在 VirtualBox、Hyper-V、Docker\
  \ 或 VMware 中运行的虚拟机。只需下载并安装 VirtualBox、Vag 和 Homestead，你就虚拟环境中拥有了一个完整的 Ubuntu Linux\
  \ 服务器。\n\n#### Symfony\n\nSymfony 项目主要是一个为创建动态 Web 应用提供大量功能的 PHP 库集合。这些库包括身份验证、表单创建和验证、路由以及构建页面模板的工具。\n\
  \nSymfony 库已变得极其流行，许多其他框架包在自己的代码中使用了它们。\n\n你可以将 Symfony 库组合成框架环境来生成自己的 Web 应用。Symfony\
  \ 使用 Composer 包管理器，因此你可以轻松地安装并测试它：\n\n```\ncomposer create-project --prefer-dist\
  \ symphony/skeleton appname\n```\n\n当你运行来自 skeleton 的默认 Symfony 网页时（参见图 2-7](#40_9781119468387-bk07ch02.xhtml_c30-fig-0007)），它提供了一个链接，引导你使用\
  \ Symfony 库构建框架的指南。\n\n![image](img/9781119468387-fg070207.png)\n\n图 2-7： 默认的 Symfony\
  \ 框架网页。\n\nSymfony 的一个缺点是它使用较旧的 YAML 风格配置文件来定义几乎一切。YAML 是一种曾经在配置文件中很流行的标记语言，但对初学者来说可能有些困惑。\n\
  \n\n\n\n到目前为止最流行的专业 PHP 框架包一直是 Zend Framework ([`https://framework.zend.com`](https://framework.zend.com))。Zend\
  \ 专注于 PHP 开发，并且是 PHP 开源项目的企业赞助商。对于高级 PHP 开发和支持，它并不陌生。\n\nZend Framework 是一个功能齐全的框架包，它使用\
  \ MVC 模型作为框架结构。你可以使用 Composer 安装 Zend Framework MVC 模板：\n\n```\ncomposer create-project\
  \ --prefer-dist zendframework/skeleton-application appname\n```\n\n图 2-8 显示了 Zend\
  \ Framework 骨架代码生成的默认网页。\n\n![image](img/9781119468387-fg070208.png)\n\n图 2-8： 默认的\
  \ Zend Framework 网页。\n\nZend Framework 骨架应用程序生成了启动应用程序所需的文件和文件夹结构。它提供了一些脚手架，供你配合\
  \ `zf` 工具使用。你可以使用该工具根据应用程序数据库为应用程序创建单独控制器、模型和视图脚手架文件。\n\nZend Framework 包为 PHP 开发提供了许多高级功能，在专业\
  \ PHP 开发圈中备受推崇。刚开始用可能会有些复杂，但当你掌握了窍门后，你可以用它创建出非常惊人的网站！\n\n## 看看微框架\n\n在测试了几个 PHP\
  \ 框架包后，你可能会发现你的 PHP 开发并不需要那么多支持。你并不孤单，这催生了另一种类型的框架包：微框架（micro-framework）。\n\n微框架是不包含大型框架包中包含的那些华丽助手方法和库工具的框架包。然而，它们确实可以为你生成极好的骨架框架代码，以便你构建\
  \ Web 应用程序。如果你只是想为 Web 应用程序寻找一点帮助和组织结构，这是理想的。\n\n本节将带你介绍几个流行的微框架包，让你了解它们能提供什么。\n\
  \n### Lumen\n\nLumen 框架包 ([`https://lumen.laravel.com`](https://lumen.laravel.com))\
  \ 是由 Laravel 支持的微框架。它消除了 Laravel 框架提供的许多华丽功能，只为你留下构建 MVC 应用程序框架所需的最基本内容。\n\n你可以使用\
  \ Composer 安装 Lumen 框架：\n\n```\ncomposer create-project --prefer-dist laravel/lumen\
  \ appname\n```\n\n通过打开它用骨架文件生成的默认网页，你就能了解到 Lumen 到底有多精简了，所示 图 2-9。\n\n![image](img/9781119468387-fg070209.png)\n\
  \n图 2-9： 默认的 Lumen 框架网页。\n\n这已经是你能得到的最精简的！如果你只是想为 Web 开发寻求一点帮助，而不想受限于大型框架包，那么 Lumen\
  \ 是很棒的。它的占用很小，不会给你的应用程序性能增加太多负担。\n\n### Slim\n\nSlim 框架包 ([`www.slimframework.com`](https://www.slimframework.com))\
  \ 可能是微框架包中最小的，但它以快速闻名。以下是 Slim 的核心功能：\n\n*   URL 路由：可以将 URL 映射到函数回调，并具有对 URL 进行模式匹配的能力，这样你就不需要指定应用程序中使用的所有可能的\
  \ URL\n*   中间件：你可以用它围绕客户端的特定 URL 请求构建应用程序代码\n*   在代码中拆解 HTTP 消息、状态和 Cookie 的能力\n\
  *   与其他 PHP 库和工具的互操作性\n\nURL 路由功能使 Slim 成为仅需要网页页面动态路由功能的静态网站的好框架。你只需要设置一个路由表，将浏览器请求引导到应用程序中正确的静态\
  \ Web 页面即可。\n\n可以通过 Composer 包管理器安装 Slim 框架：\n\n```\ncomposer create-project --prefer-dist\
  \ slim/slim-skeleton appname\n```\n\n图 2-10 显示了 Slim 框架的默认网页。\n\n![image](img/9781119468387-fg070210.png)\n\
  \n图 2-10： 默认的 Slim 框架网页。\n\nSlim 框架包为非 PHP 提供了一些有趣的功能，如果你仍在维护任何静态网站，可能值得研究一下。\n\n\
  ### Yii\n\nYii 框架包 ([`https://yiiframework.org`](https://yiiframework.org)) 是一个简单的\
  \ PHP 框架，提供了所有标准组件。Yii 并没有很多功能，但它可以完成很多工作。它有两个版本：基础版和高级版。要安装高级版，使用：\n\n```\ncomposer\
  \ create-project --prefer-dist yiisoft/yii2-app\n```\n\nYii 框架并不产生页面——这需要你来。它使用\
  \ `gii` 工具（需要单独安装）来生成脚手架。\n\n# 第三章：使用框架创建应用程序\n\n本章\n*   创建模板\n*   构建脚手架\n*   修改脚手架\n\
  \n上一章介绍了适用于 PHP 的各种框架包。使用框架可以简化你的开发，但你需要遵循框架规则。本章将深入探讨使用 CakePHP 创建应用程序。\n\n## 构建模板\n\
  \nCakePHP 框架包会为你生成大量的后台代码。这让你能够专注于更重要的部分：应用程序特定的工作。\n\n![tip](img/tip.png) 在此演示中，我将带你重现第六章中介绍的\
  \ AuctionHelper 应用程序的一些功能。如果你熟悉该项目，请花几分钟回到第六章[第一节](#34_9781119468387-bk06ch01.xhtml）了解它在做什么。回来后我会在这里。\n\
  \n在为新应用程序编写任何代码之前，你需要允许 CakePHP 为你生成应用程序模板。\n\n\n\n\n对于 Windows，请使用命令提示符窗口。对于 macOS，请使用终端（Terminal）实用程序。对于\
  \ Linux 环境，你可以选择使用虚拟命令行终端，或者从图形桌面启动图形命令行工具。\n\n## 2. 导航到你 Web 服务器的 `DocumentRoot`\
  \ 文件夹。\n\n使用 `cd` 命令行切换到你 Web 服务器的 `htdocs` 文件夹。如果你在 Windows 上使用 XAMPP 服务器，该文件夹为\
  \ `c:\\xampp\\htdocs`。如果你在 macOS 上使用 XAMPP 服务器，该文件夹为 `/Applications/XAMPP/htdocs`。因此，对于\
  \ Windows 系统，请使用：\n\n```\nC:\\Users\\rkblu> cd \\xampp\\htdocs\nC:\\xampp\\htdocs>\n\
  ```\n\n或者对于 macOS 请使用：\n\n```\n/usrs/rblum> cd /Applications/XAMPP/htdocs\n/Applications/XAMPP/htdocs>\n\
  ```\n\n## 3. 从命令提示符运行 Composer 程序，指定 `create-project` 选项；应用程序名称使用 `cakeauction`：\n\
  \n```\nC:\\xampp\\htdocs> composer create-project --prefer-dist cakephp/app cakeauction\n\
  Installing cakephp/app (3.5.1)\n- Installing cakephp/app (3.5.1): Loading from cache\n\
  Created project in cakeauction\nLoading composer repositories with package information\n\
  Updating dependencies (including require-dev)\nPackage operations: 47 installs,\
  \ 0 updates, 0 removals\n…\nGenerating autoload files\n> Cake\\Composer\\Installer\\\
  PluginInstaller::postAutoloadDump\n> App\\Console\\Installer::postInstall\nCreated\
  \ `config/app.php` file\nCreated `C:\\xampp\\htdocs\\cakeauction/tmp/cache/views`\
  \ directory\nSet Folder Permissions ? (Default to Y) [Y,n]? y\nUpdated Security.salt\
  \ value in config/app.php\nC:\\xampp\\htdocs>\n```\n\n![tip](img/tip.png) 如果你没有安装\
  \ Composer 程序，请访问 `https://getcomposer.org` 并按照指令在工作站上下载并安装。\n\n## 4. 输入 `exit`\
  \ 关闭命令提示符窗口。\n\nComposer 实用程序从其软件仓库检索当前的 CakePHP 框架模板文件，并将其复制到你工作站上的 `cakeauction`\
  \ 目录结构中。过程结束时，它会询问你是否让它为你设置文件夹安全权限。如果你回答是，Composer 将修改文件夹属性以便 Web 服务器访问该应用程序。\n\n\
  进程完成后，你已经在 `cakeauction` 文件夹中安装了一个完整的 CakePHP 应用程序模板。你可能没有意识到，模板文件中内置了一个完整的网页基础。你可以通过启动\
  \ Web 服务器环境、打开浏览器并访问以下 URL 来亲自测试：\n\n`http://localhost:8080/cakeauction`\n\n你应该能看到图\
  \ 3-1 所示的主 CakePHP 模板网页。\n\n![image](img/9781119468387-fg070301.png)\n\n图 3-1： 通用的\
  \ CakePHP 应用程序网页。\n\n网页代码会检查你的 Web 服务器环境，以确保其与运行 CakePHP 代码兼容。你应该看到 CakePHP 在你系统上执行的所有环境（Environment）和文件系统（Filesystem）检查均显示绿色图标。\n\
  \n如果任何环境或文件系统图标是红色的，在将来可能会产生潜在问题。最好在开始编写代码之前，现在对你的 Web 环境进行必要的修改，以满足 CakePHP 的要求。在过程的此时，数据库（Database）检查图标将是红色的，因为你还没有告诉\
  \ CakePHP 如何访问你的数据库。\n\n### 探索文件和文件夹\n\n在安装了应用程序的核心 CakePHP 模板文件后，你可以进行，查看究竟安装了什么。打开你系统的文件管理器。有三个文件夹特别值得关注：\n\
  \n*   `bin`：包含应用程序的命令行工具。\n*   `config`：包含应用程序的配置文件。\n*   `src`：这是你将花费绝大部分时间的地方。\n\
  \n在 `src` 文件夹中，你会看到几个文件夹：\n\n*   `Controller`：包含处理 Web 请求的控制器。\n*   `Model`：包含处理数据逻辑的模型。\n\
  *   `View`：包含生成 HTML 的视图文件。\n\n网页代码会检查你的 Web 服务器环境，以确保其与运行 CakePHP 代码兼容。你应该看到 CakePHP\
  \ 在你系统上执行的所有环境和文件系统检查均显示绿色图标。\n\n### 定义数据库\n\n在开始使用应用程序之前，你需要告诉 CakePHP 在何处找到数据库。按照以下步骤操作：\n\
  \n1.  打开你喜欢的文本编辑器、集成开发环境（IDE）或程序，并导航到 `config` 文件夹。\n2.  打开 `app.php` 文件，直到你看到 `Datasources`\
  \ 部分。该部分应包含以下行：\n\n```php\n'className' => 'Cake\\Database\\Connection',\n'driver'\
  \ => 'Cake\\Database\\Driver\\Mysql',\n'persistent' => false,\n'host' => 'localhost',\n\
  'port' => '3306',\n'username' => 'root',\n'password' => 'password',\n'database'\
  \ => 'my_database',\n'encoding' => 'utf8',\n'charset' => 'utf8',\n'quoteType' =>\
  \ 'DRIVER',\n```\n\n3.  修改你 MySQL 服务器的数据库配置。如果你按照第 6 本第 1 章](#34_9781119468387-bk06ch01.xhtml)中的指令操作\
  \ AuctionHelper 应用程序，请在 `app.php` 代码中输入这些更改：\n\n```php\n'className' => 'Cake\\Database\\\
  Connection',\n'driver' => 'Cake\\Database\\Driver\\Mysql',\n'persistent' => false,\n\
  'host' => 'localhost',\n'port' => '3306',\n'username' => 'ah_user',\n'password'\
  \ => 'AuctionHelper',\n'database' => 'auction',\n'encoding' => 'utf8',\n'charset'\
  \ => 'utf8',\n'quoteType' => 'DRIVER',\n```\n\n4.  保存 `app.php` 文件更改并退出编辑器。\n\n\
  现在如果你再次运行应用程序的主网页，你应该看到数据库图标变为绿色，这表明 CakePHP 应用程序可以连接到 MySQL 服务器并访问存储应用程序数据的 `auction`\
  \ 数据库。\n\n\n\n\n\n![tip](img/tip.png) CakePHP 创建的默认配置模板假设你在使用 MySQL 数据库服务器，但它也支持其他数据库服务器。请咨询\
  \ CakePHP 文档以查看可以使用哪些驱动程序访问其他数据库服务器的数据。\n\n## 创建应用程序脚架（Scaffold）\n\n框架包真正的威力在于它们能为你生成大量的代码，使你无需手动编写那些无聊的内容。这种力量源于脚架代码。大多数框架包提供某种程度的脚架代码支持，但\
  \ CakePHP 生成的脚架代码非常惊人！本节将引导你完成为拍卖应用程序创建脚架代码的步骤。\n\n### 安装脚架\n\nCakePHP 包能够为应用程序的一部分或所有部分创建脚架代码。CakePHP\
  \ 为你生成多少代码完全取决于你。如果你只需要为表创建 CRUD 方法的帮助，可以告诉 CakePHP 只创建模型脚架。如果你需要帮助创建一个控制器来启动你的应用程序，可以告诉\
  \ CakePHP 只创建控制器脚架。**记住：** 想要多少帮助由你自己决定！\n\nCakePHP 在你安装模板文件时不会自动生成脚架代码，但你可以轻松地自己生成。CakePHP\
  \ 使用 `bake` 工具（名字很可爱，不是吗？）来为你的应用程序生成脚架代码。你在包含 `bin` 模板文件夹的 `cake` 工具内部运行 `bake`\
  \ 工具：\n\n```\nC:\\xampp\\htdocs\\cakeauction>bin\\cake bake\n```\n\n`可以使用以下命令为你的应用程序生成骨架代码。`\n\
  \n`可用的 `bake` 命令：`\n\n- `all`\n- `behavior`\n- `cell`\n- `component`\n- `controller`\n\
  - `fixture`\n- `form`\n- `helper`\n- `mailer`\n- `middleware`\n- `migration`\n-\
  \ `migration_diff`\n- `migration_snapshot`\n- `model`\n- `plugin`\n- `seed`\n- `shell`\n\
  - `shell_helper`\n- `task`\n- `template`\n- `test`\n\n`通过使用 `cake bake [name]` 你可以调用特定的\
  \ bake 任务。`\n\n```\nC:\\xampp\\htdocs\\cakeauction>\n```\n\n`bake` 工具提供了很多选项。你可以只生成模型代码、只生成控制器代码，或者生成应用程序所需的所有内容。`all`\
  \ 允许 CakePHP 为完整的 Web 应用程序生成脚架代码，为你指定的表提供 CRUD 功能。\n\n按照以下步骤为 `auction` 数据库中的 `Bidders`\
  \ 表创建一个简单的 CRUD 应用程序：\n\n1. **在操作系统中打开命令行工具，并导航到项目的 `cakeauction` 文件夹：**\n\n```\n\
  C:\\users/rblu>cd \\xampp\\htdocs\\cakeauction\nC:\\xampp\\htdocs\\cakeauction>\n\
  ```\n\n2. **运行 `bake` 工具为 Bidders 表生成所有脚架：**\n\n```\nC:\\xampp\\htdocs\\cakeauction>bin\\\
  cake bake all bidders\nBake All\n---------------------------------------------------------------\n\
  正在检测关联，请稍候。\n…\nBake All complete.\nC:\\xampp\\htdocs\\cakeauction>\n```\n\n3. **确保\
  \ Apache 和 MySQL 服务器正在运行，然后打开浏览器；在地址栏中输入以下 URL：**\n\n`http://localhost:8080/cakeauction/bidders/`\n\
  \n稍微浏览一下应用程序，查看默认提供了哪些功能。\n\n4. **重复步骤 2，为 Items 表运行 `bake` 工具：**\n\n```\nC:\\xampp\\\
  htdocs\\cakeauction>bin/cake bake all items\n```\n\n5. **在浏览器地址栏中输入以下 URL：**\n\n\
  `http://localhost:8080/cakeauction/items/`\n\n你只用一个命令就创建了一个完整的 Web 应用程序！（好吧，也许 CakePHP\
  \ 帮了一点忙。）图 3-2 显示了为 Bidders 表脚架生成的主网页。\n\n![image](img/9781119468387-fg070302.png)\n\
  \n图 3-2： 主 Bidders 脚架网页。\n\n当你访问由 `items` 脚架生成的网页时，你将看到相同的布局和功能，但数据是 Items 表的。\n\
  \n脚架为每个数据库表创建了一个完整的数据管理网站。看看这个简单应用程序中“烘焙”进去的所有功能：\n\n* 主网页显示 Bidders 或 Items 表中包含的每个数据记录的字段值。\n\
  * 主网页集成了内容分页，因此如果有大量数据记录，你可以一次查看一页。\n* 你可以通过点击列顶部的数据字段名称根据任何数据字段对输出进行排序。\n* 操作图标允许你对单个数据记录执行功能。你可以：\n\
  \    * 查看完整数据记录。\n    * 编辑数据记录。\n    * 删除数据记录。\n\n（注：原文中存在大量重复的描述，此处已根据要求去重处理)*\n\
  \n### 探索脚架代码\n\n我不想在前面的步骤中显示所有输出，但如果你仍然开着命令行窗口，可以向上滚动查看输出。`bake` 工具的输出显示了脚架过程创建的所有文件。你也可以打开文件管理器并浏览\
  \ `src` 文件夹查看添加的内容。\n\n在 `Controllers` 文件夹中添加了两个文件：`BiddersController.php` 和 `ItemsController.php`。从这些文件名可以看出，CakePHP\
  \ 非常重视框架的“约定优于配置”部分。文件名直接对应其包含代码的功能。\n\n如果你在文本编辑器中打开任一控制器文件，你会看到它们分别定义了以下方法：\n\n\
  * `index`: 生成主网页上的列表。\n* `view`: 显示特定数据记录的详情。\n* `add`: 显示输入数据记录的表单，然后获取数据并保存到表中。\n\
  * `edit`: 显示现有数据记录的表单，然后获取数据并更新现有记录。\n* `delete`: 提示访问者删除请求，并从表中删除记录。\n\n这些是实现应用程序\
  \ CRUD 功能所需的默认方法。现在，查看 `src/Template` 文件夹。注意它包含一个 `Bidders` 子文件夹和一个 `Items` 子文件夹。双击其中一个文件夹查看内部内容。\n\
  \n在 `Bidders` 和 `Items` 文件夹内部是显示控制器输出所需的文件：\n\n* `add.ctp`: `add` 方法的模板文件。\n* `edit.ctp`:\
  \ `edit` 方法的模板文件。\n\n\n\n\n\n*   `index.ctp`: `index` 控制器方法的模板文件\n*   `view.ctp`:\
  \ `view` 控制器方法的模板文件\n\n这是框架中“约定优于配置”（convention over configuration）生效的另一个地方。CakePHP\
  \ 知道控制器方法何时运行，从而使用同名的模板文件来控制视图的输出。\n\n# 修改应用程序脚手架（Scaffold）\n\n你已经使用标准的 CakePHP\
  \ 脚手架代码创建了一个酷的 Web 应用程序，但现在是时候为应用程序添加你自己的特色了。如果你还记得，原始的 `AuctionHelper` 应用程序需要能够列出出价者赢得的物品。脚手架应用程序没有提供该功能，因此你需要自己添加它。\n\
  \n添加新功能是一个多步骤的过程：\n\n*   **你需要在应用程序的某处添加一个链接，允许网站访问者启动新功能网页以查看出价者赢得的物品。** 将此链接添加到竞价者列表中是合理的，这样你就可以为相应的竞价者选择链接。\n\
  *   **你需要添加一个控制器方法来处理新功能。** 该控制器方法需要接收之前在竞价者列表中选中的 `bidderid` 值，并能够查询 `items` 模型以检索与\
  \ `bidderid` 匹配的表数据记录。\n*   **你需要修改 items 模型类以添加一个执行特殊搜索功能的方法。** 它需要接收 `bidderid`\
  \ 值，然后返回一个具有匹配的 `winbidder` 数据值的物品数据记录数组。\n*   **你需要创建一个新的视图模板文件来显示 `bidderid` 以及该出价者赢得物品列表。**\
  \ 如果能计算赢得竞价的总金额，让出价者知道需要支付多少钱，也将是一个很棒的功能。\n\n对于给应用程序添加单个功能来说，似乎需要很多步骤。不过别担心。通过 CakePHP，你不需要编写大量的代码。接下来的章节将引导你完成每一步。\n\
  \n## 添加新功能链接\n\n在应用程序中添加新功能网页的第一步是在现有应用程序中创建指向它的链接。你的网站访问者需要某种方式在现有的应用程序结构中进入新功能。\n\
  \nCakePHP 创建的 `bidders` 脚手架代码已经列出了 `Bidders` 表中包含每个竞价者数据记录，以及一组用于对竞价者执行操作的操作链接。这是你插入指向列出竞价者赢得物品网页链接的完美位置。\n\
  \n生成 Bidders 主页的代码位于 `src/Template/Bidders` 文件夹中，并包含在 `index.ctp` 模板文件中。如果你在编辑器中打开该文件，你将看到\
  \ CakePHP 用于生成竞价者列表的代码。操作链接是在代码的此部分创建的：\n\n```html\n<td class=\"actions\">\n\n<?=\
  \ $this->Html->link(__('View'), ['action' => 'view', $bidder->bidderid]) ?>\n\n\
  <?= $this->Html->link(__('Edit'), ['action' => 'edit', $bidder->bidderid]) ?>\n\n\
  <?= $this->Form->postLink(__('Delete'), ['action' => 'delete',\n$bidder->bidderid],\
  \ ['confirm' => __('Are you sure you want to delete # {0}?',\n$bidder->bidderid)])\
  \ ?>\n\n</td\n```\n\n`link()` 方法是一个 CakePHP 助手方法，它根据你提供的控制器和方法为你创建 HTML 链接。如果你省略了控制器值，`link()`\
  \ 方法将假设使用与生成网页时相同的控制器。（记住：控制器名称嵌入在 URL 中。）\n\n要添加新链接，你需要为该功能想一个新的方法名。我将其命名为 `listItemsWon()`。因为你正在列出物品，所以新功能应该是\
  \ `items` 控制器的一部分。\n\n按照以下步骤将该链接添加到应用程序代码中：\n\n1.  **打开你喜欢的编辑器，并导航到 Web 服务器 `DocumentRoot`\
  \ 文件夹下的 `cakeauction/src/Template/Bidders` 文件夹。**\n2.  **选择 `index.ctp` 文件在编辑器中打开。**\n\
  3.  **在创建 View、Edit 和 Delete 链接的行之前（但在 `<td>` 行之后），添加此代码：**\n    ```php\n    <?=\
  \ $this->Html->link(__('Items'), ['controller' => 'items','action' => 'listItemsWon',\
  \ $bidder->bidderid]) ?>\n    ```\n4.  **将更新后的文件保存为 `index.ctp`。**\n\n如果你打开浏览器并像以前一样进入竞价者主页，你现在应该看到操作链接中出现了你的新链接，如\
  \ 图 3-3\n\n图 3-3： 竞价者操作链接中的新链接。\n\n新的 Items 链接出现在操作中，正如你计划的那样。然而，如果你点击 Items 链接，你将得到一个错误，如\
  \ 图 3-4\n\n图 3-4： 应用程序的 find 错误信息。\n\n## 创建控制器代码\n\n现在你已经有了访问者进入新功能的方法，你需要编写控制器代码。按照以下步骤操作：\n\
  \n1.  **打开你喜欢的编辑器并导航到 `cakeauction/Controllers` 中的 `ItemsController.php` 文件。**\n\
  2.  **向下滚动现有方法直到到达文件底部。**\n\n```php\npublic function listItemsWon($id = null)\n\
  {\n    $bidderid = $this->request->getParam('pass');\n    $items = $this->Items->find('winbidder',\
  \ ['winbidder' => $bidderid]);\n    $this->set(['items' => $items, 'winbidder' =>\
  \ $bidderid]);\n}\n```\n\n3.  **将更新后的文件保存为 `ItemsController.php`。**\n\n再次感谢 CakePHP，整个\
  \ `listItemsWon()` 方法只有三行代码！第一行使用 `getParam()` 函数从 `link()` 方法创建的 URL 获取 `bidderid`\
  \ 值。\n\n第二行使用 Items 模型的 `find()` 方法向数据库提交 SQL 查询。这是 CakePHP 框架的一个巨大优势。你不需要手动编写 SQL\
  \ 语句来检索数据，`find()` 方法为你完成了大部分工作。你只需要指定要匹配的数据字段和值。\n\n最后，最后一行代码使用了特殊的 `set()` 方法。该方法触发视图模板模板并将并将传递给模板代码。在此语句中，我传递了从\
  \ `find()` 方法返回的物品数据记录数组以及 `bidderid` 值。\n\n现在点击竞价者的 Items 链接，你将进入刚刚创建的控制器方法，但你仍然会对结果感到有些失望，如\
  \ 图 3-5\n\n图 3-5： 应用程序的 find 错误信息。\n\n\n\n\n\n`listItemsWon()` 控制器方法使用了 `find()`\
  \ 模型方法，但它指定要查找 `winbidder` 数据字段，而不是表的主键。因为这是一个自定义操作，你需要创建一个自定义方法来支持它。得益于 CakePHP\
  \ 的约定规则，你知道你需要在 `items` 表的模型类中创建一个 `findWinbidder()` 方法。这是待办事项列表中的下一个任务。\n\n###\
  \ 修改模型代码\n\n你已经快要成功了 —— 只再修改几个代码文件即可实现新功能！正如上一节所讨论的，在这一步中，你需要在 `items` 表模型类中创建一个自定义的\
  \ `find()` 方法，以查找与从链接 URL 传递的 `bidderid` 值匹配的 `winbidder` 数据值。\n\n正如你现在可能已经猜到的，你会在\
  \ `/src/Model/Table` 文件夹中找到模型类文件。（你是否已经开始掌握 MVC 文件布局的窍了？）当你查看该文件夹时，你会看到 `ItemsTable.php`\
  \ 文件。你将你的应用程序中为 `items` 表所需的任何自定义模型方法都添加在这里。\n\n按照以下步骤继续更新：\n\n1. 打开你的浏览器，导航到 `cakeauction/src/Model/Table`\
  \ 文件夹并打开 `ItemsTable.php` 文件。\n2. 滚动到文件底部，在闭合括号之前，添加以下代码：\n\n```php\npublic function\
  \ findWinbidder(Query $query, array $options)\n{\n    $items = $this->find()->select(['itemid',\
  \ 'name','description', 'winprice']);\n    $items->where(['Items.winbidder IN' =>\
  \ $options['winbidder']]);\n    return $items->group(['Items.itemid']);\n}\n```\n\
  \n3. 将更新后的文件保存为 `ItemsTable.php`。\n\n是的，另一个只有三行代码的方法 —— 我爱框架了！第一行代码调用了 `Item` 模型父类的\
  \ `find()` 方法。`find()` 方法允许你逐部分构建一个 `SELECT` 查询语句。\n\n第一部分是提供你希望查询返回的数据字段列表。`find()`\
  \ 方法的结果是从表中返回的匹配数据记录的数组。代码将该结果存储在 `$items` 变量中。\n\n新添加的第二行使用 `where()` 方法进一步定义 `find()`\
  \ 的结果。`where()` 方法类似于使用 SQL `WHERE` 子句，但它具有一些额外功能，如此代码所示的 `IN` 运算符。这是必要的，因为传递给控制器的选项显示为数组对象。`IN`\
  \ 运算符允许你将数据字段与值数组进行匹配。\n\n最后，最后一行代码使用 `group()` 方法根据 `itemid` 值对结果数据记录进行排序。`$items`\
  \ 变量包含搜索的最终结果，然后将其返回给控制器。\n\n好了，又完成了一步！如果你点击某个投标者的 `Item` 动作链接，你将继续该过程，但你仍然会收到一条错误消息，所示\
  \ 图 3-6。\n\n![image](img/9781119468387-fg070306.png)\n\n图 3-6： 缺失的模板错误消息。\n\n约定规则再次生效了！根据错误消息，`listItemsWon()`\
  \ 控制器方法正在寻找名为 `list_items_won.ctp` 的视图文件来显示结果。你将在下一节解决这个最后的拼图。\n\n### 绘制视图\n\n你快成功了！看到前面的终点了吗？在你跨越它之前，让我回顾一下以提醒你已经完成了什么。到为止，你创建了：\n\
  \n* 在投标者索引视图模板文件中使用 `link()` 辅助方法创建一个新链接，将网站访问者引导到控制器方法，以列出投标者赢得的所有项目\n* 在 `ItemsController.php`\
  \ 控制器文件中创建一个新方法，用于处理链接请求并从 items 模型请求数据\n* 在 `ItemsTable.php` 模型文件中创建一个新方法，用于在 Items\
  \ 表中查找与 `winbidder` 数据字段值与所选 `bidderid` 值匹配的数据记录\n\n这确实不少，但话说回来，这不需要你编写太多代码 —— CakePHP\
  \ 已经为你完成了大部分工作。\n\n让新功能在 Web 应用程序中运行的最后一步是创建显示所有结果视图模板文件。CakePHP 将视图模板文件存储在 `/src/Template`\
  \ 文件夹中。每个控制器都有自己的子文件夹，所以你需要在 `Items` 子文件夹中工作。\n\n如果你还记得 图 3-6 中的内容，CakePHP 正在通过告诉你你需要哪个模板文件来帮助你。\n\
  \n1. 打开你喜欢的编辑器，输入以下代码：\n\n```php\n<div class=\"content\">\n    <h3>Items won by\
  \ $bidder</h3>\n    <section>\n        <?php $total = 0; ?>\n        <table>\n \
  \           <tr>\n                <th>ItemID</th>\n                <th>Name</th>\n\
  \                <th>Description</th>\n                <th>Winning Bid</th>\n  \
  \          </tr>\n            <?php foreach ($items as $item): ?>\n            \
  \    <?php $total += $item->winprice; ?>\n                <tr>\n               \
  \     <td><?= $item->itemid ?></td>\n                    <td><?= $item->name ?></td>\n\
  \                    <td><?= $item->description ?></td>\n                    <td><?=\
  \ $item->winprice ?></td>\n                </tr>\n            <?php endforeach;\
  \ ?>\n            <tr>\n                <td></td>\n                <td></td>\n \
  \               <td>Total</td>\n                <td><?= $total ?></td>\n       \
  \     </tr>\n        </table>\n        <?= $this->Html->link(__('Return to Bidders'),\
  \ ['controller' => 'bidders', 'action' => 'index']) ?>\n    </section>\n</div>\n\
  ```\n\n2. 将文件保存为 `list_items_won.ctp`，位于你 Web 服务器下的 `/src/Template/Items` 文件夹中。\n\
