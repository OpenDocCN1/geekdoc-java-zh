  \ = Bidder::findBidder($bidderid);\n        $bidder->bidderid = $_POST['bidderid'];\n\
  \        $bidder->lastname = $_POST['lastname'];\n        $bidder->firstname = $_POST['firstname'];\n\
  \        $bidder->address = $_POST['address'];\n        $bidder->phone = $_POST['phone'];\n\
  \        $result = $bidder->updateBidder();\n        if ($result) {\n          \
