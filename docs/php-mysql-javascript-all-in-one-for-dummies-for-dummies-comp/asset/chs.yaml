  \n图 2-4: 由 `updatebidder.inc.php`包含文件生成的网页。\n\n`updatebidder.inc.php` 代码根据 `bidderid`\
  \ 值检索竞价者，并使用 `Bidder`对象的属性作为表单文本字段的默认值创建一个表单。应用程序用户可以修改任何文本字段的值，然后点击更新竞价者按钮以保存更改。\n\
  \n表单调用 `changebidder.inc.php` 文件将表单数据提交到 MySQL 数据库。按照以下步骤创建该文件：\n\n1. **打开编辑器并输入此代码：**\n\
  \n```php\n<?php\nif (isset($_SESSION['login'])) {\n    $bidderid = $_POST['bidderid'];\n\
