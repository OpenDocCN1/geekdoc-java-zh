  \n图 3-13: `phpMyAdmin` 中的索引对话框。\n\n![image](img/9781119468387-fg050314.png)\n\n\
  图 3-14: `phpMyAdmin` 中已完成的新表表单。\n\n当 `phpMyAdmin` 提交创建表的 SQL 后，它会自动你重定向到新表的结构页，如图\
