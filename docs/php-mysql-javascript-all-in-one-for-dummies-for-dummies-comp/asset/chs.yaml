  \ 玩转色彩渐变\n5. 添加阴影\n\n\n\n\n\n## 6. 创建字体\n## 7. 处理媒体查询\n\n# 第 5 章：HTML5 与多媒体\n###\
  \ 1. 使用图像\n### 2. 播放音频\n### 3. 观看视频\n### 4. 从流媒体获取帮助\n\n# 第 1 章：HTML5 基础\n\n## 本章内容\n\
  ![check](img/check.png) **查看 HTML5 文档结构**\n![check](img/check.png) **识别基础 HTML5\
  \ 元素**\n![check](img/check.png) **文本格式化**\n![check](img/check.png) **使用特殊字符**\n\
  ![check](img/check.png) **创建列表**\n![check](img/check.png) **处理表格**\n\n你的 Web 应用程序的核心是你创建的\
  \ HTML5 代码，用于向网站访问者展示内容。你需要了解 HTML5 的工作原理以及如何使用它来最好地展示你的信息。本章介绍了 HTML5 的基础知识，并演示了如何使用它来创建网页。\n\
  \n## 深入文档结构\n\nHTML5 标准定义了一个特定的结构，你在定义网页时必须遵循该结构，以便它们在所有浏览器中以相同的方式显示。这种结构不仅包括你告诉浏览器如何显示网页内容的标记，还包括你需要提供给浏览器的一些开销信息。本节解释了\
  \ HTML5 程序的整体结构，并告诉你需要包含哪些内容以确保客户端的浏览器知道如何正确处理你的网页。\n\n### 元素、标签和属性\n\n一个 HTML5\
  \ 文档由一个或多个元素组成。`element` 是包含在网页中的任何对象。它可以是标题、文本段落、表单字段甚至是多媒体片段。你的浏览器单独处理每个元素，在浏览器窗口中对其定位并按照指示进行样式设置。\n\
  \n你通过使用标签在网页中定义元素。`tag` 标识元素的类型，以便浏览器知道该如何处理其包含的内容。HTML5 规范定义了两种元素：\n\n* **双边元素：**\
  \ 双边元素是最常见的元素类型。双边元素包含两个部分：起始标签（`opening tag`）和结束标签（closing tag`）。双边元素的语法如下：\n\n\
  ```\n<element>content</element>\n```\n\n第一个元素标签是起始标签。它包含元素名称，用小于符号（`<`）和大于符号（`>`）包围，并定义了元素定义的开始。\n\
  \n第二个标签是结束标签；它定义了元素定义的结束。它指向相同的元素名称，但名称前有一个正斜杠（`/`）。浏览器应该将两个标签之间的任何内容视为元素内容的一部分。例如，HTML5\
  \ 的 `h1` 元素定义了一个如下所示的标题：\n\n```\n<h1>This is a heading</h1>\n```\n\n该元素指示浏览器使用与网页上标题相适应的字体和大小来显示文本\
  \ `This is a heading`。具体如何操作取决于浏览器。\n\n* **单边元素：** 单边元素不包含任何内容，通常为浏览器定义某种在处理网页时执行的某种类型指令。例如，换行元素指示浏览器在网页中开始新的一行：\n\
  \n```\n<br>\n```\n\n因为没有内容，所以不需要结束标签。\n\n![tip](img/tip.png) 较老的 XHTML 标准要求单边标签在标签末尾包含一个结束正斜杠字符，例如\
  \ `<br/>`。HTML5 并不要求这样做，但为了向后兼容支持这种格式。在 HTML5 代码中仍然看到这种格式非常常见。\n\n除了基础元素定义外，许多元素还允许你定义应用于该元素的属性。`Attributes`\
  \ 为浏览器提供了关于如何处理元素内内容的进一步指令。当你为元素定义属性时，必须为它分配一个值（`value`）。\n\n你将属性及其值包含在元素的起始标签内部，如下所示：\n\
  \n```\n<element attribute=\"value\">content</element>\n```\n\n你可以为元素定义多个属性/值值对。只需在起始标签中使用空格将它们隔开即可：\n\
  \n```\n<element attribute1=\"value1\" attribute2=\"value2\">\n```\n\n属性通常用于为元素应用样式：\n\
  \n```\n<h1 style=\"color: red\">Warning!!\n```\n\n这里显示的 `style` 属性定义了头部元素（head）。\n\
  \n### 文档类型\n\n每个网页都必须遵循 HTML 或 XHTML 标准，以便浏览器能够正确解析它。网页中的第一个元素是标记标准。这个元素被称为 `document\
  \ type`（文档类型），它是至关重要的，因为浏览器必须知道遵循哪种标准。\n\n你使用 `<!DOCTYPE>` 标签定义文档类型。它包含了关于标记标准的信息。之前版本的\
  \ HTML 对文档类型使用了一种非常复杂的格式。\n\n幸运的是，HTML5 标准降低了这种复杂性。要定义 HTML5 文档，你只需要包含以下行：\n\n```\n\
  <!DOCTYPE html>\n```\n\n当浏览器在你的网页开头看到这一行时，它就知道使用 HTML5 标准解析元素。\n\n![warning](img/warning.png)\
  \ 如果你省略了 `<!DOCTYPE>` 标签，浏览器仍然会尝试解析和处理代码。然而，因为浏览器不知道确切应该遵循哪种标准，它会遵循一种被称为“怪异模式”（`quirks\
  \ mode`）的做法。在怪异模式下，浏览器遵循 HTML 标准的原版本，因此新的元素将无法正确渲染。\n\n### 页面定义\n\n要创建一个 HTML5 网页，你只需要定义页面上的不同元素。这些元素作为元素层级结构在一起。某些元素定义网页的不同部分，而包含在这些部分中的其他元素定义内容。\n\
  \n`html` 元素位于层级的顶端。它定义了整个网页的开始。网页中的所有其他元素都出现在 `<html>` 起始标签和 `</html>` 结束标签之间：\n\
  \n```\n<!DOCTYPE html>\n<html>\n  web page content\n</html>\n```\n\n大多数网页至少定义两个二级元素：头部（head）和主体（body）：\n\
  \n```html\n<html>\n  <head>\n    head content\n  </head>\n  <body>\n    body content\n\
  \  </body>\n</html>\n```\n\n`head` 元素包含关于你网页的信息。包含在 `head` 元素中的内容不会显示在网页上，但它会在后台指导事务，例如浏览器为了正确显示网页需要加载的任何文件，或者浏览器在加载网页时需要运行的任何程序。\n\
  \n头部元素内容中常见的元素之一是标题（title），它定义了你网页的标题：\n\n```html\n<head>\n  <title>My First Web\
  \ Page</title>\n</head>\n```\n\n网页标题并不是网页的一部分，但它通常出现在浏览器窗口顶部的标题栏中，或者如果浏览器支持标签页浏览，则出现在窗口标签中。\n\
  \n\n\n\n\n`body` 元素包含出现在网页中的元素。这是你定义想要让网站访问者看到的内容的地方。在页面定义中，`body` 元素应该始终出现在 `head`\
  \ 元素之后。在关闭 `html` 元素之前关闭 `body` 元素也是重要的。\n\n请按照以下步骤创建并测试你的第一个网页：\n\n1. **打开你选择的编辑器、程序编辑器或集成开发环境\
  \ (IDE) 软件包。**\n\n   关于使用何种工具的建议，请参见第一部分的第 3 章。\n\n2. **在编辑器窗口中输入以下代码：**\n\n   ```html\n\
  \   <!DOCTYPE html>\n   <html>\n   <head>\n    <title>My First Web Page</title>\n\
  \    </head>\n    <body>\n    This is text inside the web page.\n    </body>\n \
  \  </html>\n   ```\n\n3. **将代码保存到你 Web 服务器的 `DocumentRoot` 文件夹中，并命名为 `mytest.html`。**\n\
  \n   如果你在 Windows 上使用 XAMPP 服务器，文件夹路径为 `c:\\xampp\\htdocs`。对于 macOS，路径为 `/Applications/xampp/htdocs`。\n\
  \n4. **启动 XAMPP 服务器。**\n\n5. **打开你选择的浏览器，输入以下 URL：**\n\n   `http://localhost:8080/mytest.html`\n\
  \n   注意，你可能需要更改 URL 中指定的 8080 端口号，以匹配你设置的 XAMPP Apache 服务器（参见第一部分的第 2 章）。图 1-1 显示此代码生成的网页。\n\
  \n![image](img/9781119468387-fg020101.png)\n\n图 1-1: 示例网页的输出。\n\n`head` 元素定义网页标题，如图\
  \ 1-1 所示，它出现在浏览器标题栏中。`body` 元素包含一行文本，浏览器会在浏览器窗口区域渲染它。\n\n![tip](img/tip.png) 你可能会注意到，除了特殊的\
  \ `<!DOCTYPE>` 标签外，我使用的所有其他 HTML 标签都是小写的。HTML5 忽略元素标签的大小，因此标签元素名可以使用大写、小写或两者的任意组合。旧的\
  \ XHTML 标准要求所有标签均为小写，因此许多 Web 开发者养成了使用小写标签的习惯，通常情况下你仍然看到 HTML5 代码使用全小写标签名。\n\n###\
  \ 页面区域\n\n如今的网页不仅仅是长内容页面。它们包含某种格式，将内容布局在不同的区域，类似于报纸呈现文章的方式。在报纸中，通常有两或多列内容，每列包含一个或多个独立的文章。\n\
  \n在过去，尝试使用 HTML 创建这种布局是有一定挑战的。幸运的是，HTML5 标准定义了一些基础元素，使得我们更容易将网页划分为不同的区域。表 1-1 列出了你用于定义网页区域的\
  \ HTML5 元素。\n\n| 元素 | 描述 |\n| --- | --- |\n| `article` | 包含在区域内的文本子部分 |\n| `aside`\
  \ | 与主文章相关的内容，但放置在侧边提供额外信息 |\n| `div` | 文章内具有相似样式的内容分组 |\n| `footer` | 出现在网页底部的内容\
  \ |\n| `header` | 出现在网页顶部的内容 |\n| `nav` | 导航区域，允许访问者轻松找到其他页面或相关网站 |\n| `section`\
  \ | 文章的顶层分组 |\n\n表 1-1 HTML5 区域元素\n\n![remember](img/remember.png) 虽然 HTML5 定义了区域，但它并没有定义浏览器应该如何在网页中放置它们。那部分留给了\
  \ CSS 样式处理，我将在本微型书籍的第 2 章中介绍。\n\n当你将 HTML5 区域元素与适当的 CSS3 样式结合时，你可以为网页创建任何你想要的的外和效果。虽然没有统一的标准，但在网页中定位区域时，你可以遵循一些基本规则。图\
  \ 1-2 显示此代码生成的网页。\n\n\n\n\n\n有几个 HTML5 元素允许你将文本分组为所谓的`块级元素`（block-level elements）。浏览器将定义在块级元素起始标签和结束标签之间的所有内容视为一个单一组。这允许你使用\
  \ CSS 对整个内容块作为一个整体进行样式化或定位，而无需对每个元素分别进行单独的样式化或定位。\n\n你可以使用 HTML5 标准中的一项新功能——`标题组`（heading\
  \ group）来将标题分组，该功能使用 `hgroup` 元素：\n\n```html\n<hgroup>\n  <h1>这是主标题。</h1>\n  <h2>这是副标题。</h2>\n\
  </hgroup>\n```\n\n标题组并不会改变 `h1` 或 `h2` 元素本身，但它为浏览器提供了一种方法，将这两个标题解释为单个元素以便进行样式化和定位。这允许你使用\
  \ CSS 样式将它们格式化为单个块，使它们像主标题和副标题一样融合在一起。\n\n一个由句子简单堆砌而成的网页读起来很无味，无法吸引很多网站访问者（甚至可能让他们直接睡着）。在印刷品中，我们将具有共同思想的句子分段落组合。你在网页内容中通过使用\
  \ `p 元素` 执行同样的操作：\n\n```html\n<p>这是的一段文本。该段落包含两个句子的内容。</p>\n```\n\n注意，`p` 元素使用起始标签（`<p>`）和结束标签（`</p>`）来标记分组文本的开始和结束。浏览器将\
  \ `p` 元素内部的所有文本视为一个单一元素。当你将内容分组时，可以对整个块应用样式和定位。\n\n不过，使用 `p` 元素要小心。适用于 HTML 标签的空白规则也适用于\
  \ `p` 元素内部的文本。浏览器不会忽略换行、制表符或多个空格。因此，如果你有像这样的代码：\n\n```html\n<p>\n  这是其中一行。\n  这是另一行。\n\
  </p>\n```\n\n它在网页中的显示效果如下：\n\n这是其中一行。这是另一行。\n\n内容中所有多余的空格和换行符都被删除了。此外，注意网络浏览器会在两个句子之间添加一个空格。\n\
  \n如果你想保留网页中文本的格式，请使用 `pre 元素`。`pre` 元素允许你对预先格式化的文本进行分组。预格式化文本的原理是，它在网页中的显示与你在代码文件中输入的方式完全相同：\n\
  \n```html\n<pre>\n  这是其中一行。\n  这是另一行。\n</pre>\n```\n\n浏览器在网页中显示的文本将与 HTML5 代码中显示的文本完全一致。\n\
  \n另一种分组文本的方法是 `blockquote 元素`（引用块元素）。`blockquote` 元素通常用于在段落内引用。浏览器会将 `blockquote`\
  \ 中包含的文本与普通段落文本分开并进行缩进：\n\n```html\n<p>我小时候学过的唯一首诗是：</p>\n<blockquote>玫瑰是红色的，紫罗花是蓝色的。像你这样的脸，属于动物园。</blockquote>\n\
  <p>但那可能不被经典诗歌。</p>\n```\n\n此功能帮助你将任何类型的文本嵌入到内容中，而不仅仅是引用。\n\n### 换行 (Breaks)\n\n\
  由于 HTML 不识别文本中的换行符，因此有一种方法可以在需要告诉浏览器在网页上开启新行。单侧的 `br 元素` 强制在输出中换行：\n\n```html\n\
  <p>\n  这是其中一行。\n  <br>\n  这是第二行。\n</p>\n```\n\n现在，网页中的输出将显示为：\n\n这是其中一行。\n这是第二行。\n\
  \n另一个实用的换行元素是 `hr 元素`。它在网页区域的宽度上显示一条水平线。\n\n```html\n<h1>第 1 节</h1>\n<p>这是第 1 节的内容。</p>\n\
  <hr>\n<h1>第 2 节</h1>\n<p>这是第 2 节的内容。</p>\n```\n\n水平线跨包含它的网页块的整个宽度，如图 1-4 所示。\n\n\
  ![image](img/9781119468387-fg020104.png)\n\n图 1-4： 在网页中使用 `hr 元素`。\n\n有时这有点别扭，但你可以通过将其封装在一个区域中并添加一些\
  \ CSS 样式来稍微控制水平线的宽度。\n\n## 标记你的文本 (Marking Your Text)\n\n块级元素的反面是`文本级元素`（text-level\
  \ elements）。文本级元素允许你对块中的内容部分应用样式。本节向你展示你可以应用于网页内容的文本级元素。\n\n### 格式化文本\n\n文本级元素对文本应用预定义的格式，而不需要\
  \ CSS 样式。文本级元素中最流行的是 `b` 和 `i` 元素，它们分别应用粗体和*斜体*样式：\n\n```html\n<p>我 <i>想要</i> 那个\
  \ <b> <b>大号</b> 饮料。</p>\n```\n\n文本级元素也被称为`内联元素`（inline），因为它们与内容出现在同一行中。你可以嵌入文本级元素以对文本应用多于一个样式：\n\
  \n![remember](img/remember.png) 当对文本应用两个或多个文本级元素时，请确保以相反的顺序关闭标签。HTML5 支持使用不同样式的许多不同的文本级元素，而无需\
  \ CSS 的帮助。\n\n| 元素 |  |\n| --- | --- |\n| `abbr` | 显示文本为缩写 |\n| `b` | 显示文本为粗体 |\n\
  | `cite` | 显示文本为引用（通常显示为斜体） |\n| `code` | 显示文本为程序代码（通常显示为等宽字体） |\n| `del` | 显示文本为已删除（通常带有删除线字体）\
  \ |\n| `dfn` | 显示文本为定义术语（通常显示为斜体） |\n| `em` | 显示文本为强调（通常显示为斜体） |\n| `i` | 显示文本为斜体\
  \ |\n| `ins` | 显示文本为插入（通常显示为下划线字体） |\n| `kbd` | 显示文本为键盘输入（通常为等宽字体） |\n| `mark` |\
  \ 显示文本为标记（通常使用高亮） |\n| `q` | 显示文本为引用（通常使用引号） |\n| `samp` | 显示文本为示例代码（通常显示为等宽字体）\n\
  | `small` | 使用比普通字体更小的字体显示文本 |\n| `strong` | 显示文本为强强调（通常使用粗体） |\n| `sub` | 显示文本为下标\
  \ |\n| `sup` | 显示文本为上标 |\n| `time` | 显示文本为日期时间值 |\n| `var` | 显示文本为程序变量（通常使用斜体） |\n\
  \n表 1-2 HTML5 文本级元素\n\n如你在表 1-2 所示，你有很多选项格式化文本，而无需编写一行 CSS 代码。\n\n### 使用超文本 (Using\
  \ hypertext)\n\n在第一本书[第 1 章](#05_9781119468387-bk01ch01.xhtml）中，我提到超链接是网页的关键。链接将你网站中所有的单独网页连接在一起，允许访问者在页面之间跳转。\n\
  \n创建超链接的元素是`anchor`（锚点）文本级元素。起初，这可能有些违背直觉——你会认为锚点会将你留在原地，而不是送你去另一个地方。但请反过来想：锚点元素是将另一个网页“锚定”到你当前的网页上。跟随锚点就会到达另一个网页！\n\
  \n\n\n\n\n因为锚元素（anchor element）是一个文本级元素，你使用它来标记块内部的文本。该文本就会成为超链接。你使用 `<a>` 标签来添加锚元素。锚元素是双向的，因此既有起始标签（`<a>`）也有结束标签（`</a>`）。起始标签和结束标签之间的文本就变成了超链接文本。\n\
  \n`<a>` 标签有几个不同的属性可用，但最重要的是 `href` 属性。`href` 属性指定了超链接将你的网站访问者引导至：\n\n```html\n<a\
  \ href=\"http://www.google.com\">点击此处搜索。</a>\n```\n\n当网站访问者点击超链接时，浏览器会自动将访问者带到同一浏览器窗口中引用的网页。如果你愿意，你还可以指定\
  \ `target` 属性，该属性指定了浏览器应如何打开新网页。以下是 `target` 属性的可用选项：\n\n* `_blank`：在新标签页或窗口中打开指定的页面。\n\
  * `_self`：在当前标签页或窗口中打开指定的页面。这是 HTML5 的默认行为，因此除非你想在代码中为了清晰起见而添加它，否则没有必要添加。\n* `_parent`：在窗口内嵌入的框架（frame）的父窗口中打开指定的页面。HTML5\
  \ 不再流行嵌入框架，因此此选项很少使用。\n* `_top`：在包含嵌入其他框架的框架的主窗口中打开指定的页面。这很少使用。\n\n你可以这样使用 `target`\
  \ 属性：\n\n```html\n<a href=\"http://www.google.com\" target=\"_blank\">点击此处搜索。</a>\n\
  ```\n\n![tip](img/tip.png) 关于如何处理打开新网页没有固定的规则，但通常情况下，良好的做法是在你自己网站的其它页面在同一浏览器标签页或窗口中打开，而将远程网页在新标签页或窗口中打开。这样，如果需要，你的网站访问者可以轻松地回到他们在在你网站上离开的地方。\n\
  \n## 显示超链接\n\n当你在文本中指定超链接时，浏览器会尝试让它与其他文本区分开来，如图 1-5\n\n图 1-5: 在文档中显示超文本。\n\n默认情况下，浏览器将使用与块文本部分不同的格式显示锚元素文本：\n\
  \n* 未访问的链接显示为蓝色带下划线。\n* 已访问的链接显示为紫色带下划线。\n* 激活链接是指是用鼠标点击未访问或已访问的链接时。当你点击鼠标时，链接会变为激活状态并显示为红色带下划线。\n\
  \n你可以使用 CSS 样式根据自己的喜好更改这些格式，正如我在下一章解释的那样。\n\n## 指定超链接\n\n`href` 属性定义了你希望浏览器为网站访问者打开网页的位置，但你可以使用几种不同的格式来指定该位置：\n\
  \n* 同一文档中的不同位置\n* 同一网站中的一个独立网页\n* 远程网站中的网页\n\n你可以使用超链接强制浏览器跳转到同一网页内部的特定位置。这对于需要大量滚动才能到达页面底部部分的长网页非常有用。要使用此方法，你必须首先通过将\
  \ `id` 属性应用到块级元素（如标题元素或段落元素）来识别网页中的位置：\n\n```html\n<h1 id=\"chicago\">芝加哥新闻</h1>\n\
  ```\n\n要创建一个跳转到该部分的锚元素，你使用 `id` 属性值，并在其前面加一个数字符号或井号标记（`#`）：\n\n```html\n<a href=\"\
  #chicago\">查看芝加哥新闻</a>\n```\n\n当网站访问者点击链接时，浏览器会自动滚动，将该部分置于窗口的视野区域。\n\n当跳转到同一服务器上的另一个网页时，你不需要在\
  \ `href` 属性中包含完整的 `http://` 地址。相反，你可以指定一个相对地址。相对地址并不是你叔叔住的地方；它是在同一 Web 服务器上寻找另一个文件的简写。如果文件在同一服务器的同一文件夹中，你只需要指定文件名：\n\
  \n```html\n<a href=\"store.html\">在我们的在线商店购物。</a>\n```\n\n你还可以将文件放在当前网页位置下的子文件夹中。要这样做，请指定不带前导斜线的子文件夹：\n\
  \n```html\n<a href=\"store/index.php\">在我们的在线商店购物。</a>\n```\n\n在这两种情况下，浏览器都会向下载原始页面的同一服务器发送\
  \ HTTP 请求以取回该文件。\n\n要指定远程网站上的网页，你需要使用绝对地址（absolute address）。绝对地址使用*统一资源定位符*（URL）指定位置，它使用以下格式定义互联网上文件的确切位置：\n\
  \n`protocol`://`host`/`filename`\n\n`protocol` 部分指定了浏览器下载文件应使用的网络协议。对于网页，协议是 `http`（用于未加密连接）或\
  \ `https`（用于加密连接）。`host` 部分指定主机名，例如 `www.google.com`。`filename` 部分指定文件名，通常为 `index.html`。\n\
  \n![tip](img/tip.png) 你还可以使用绝对路径指定本地文件。前导斜线（`/`）告诉服务器查看 `DocumentRoot` 位置，而不是子文件夹。\n\
  \n## 处理字符\n\n我指的是出现在你网页上的字母、数字和符号。人类更倾向于看到信息、单词和句子，但计算机更倾向于处理数字。为了补偿这一点，程序员开发了将所有字符表示为数字的方法。计算机只需要映射数字到字符的方法。\n\
  \n### 字符集\n\n字符到数字的映射方案被称为字符集。字符集为计算机需要表示的每个字符分配唯一的数字。在美国计算早期，美国信息交换标准（ASCII）成为映射英语字符和符号的标准字符集。\n\
  \n随着计算全球化，大多数程序需要的不仅仅是英语语言。Latin-1 和 ISO 8859-1 字符集变得流行，因为它们包含了欧洲语言的字符。但这还没有涵盖一切！\n\
  \n由于在全球范围内支持，HTML5 标准需要的不仅仅是欧洲语言支持。Unicode 字符集支持所有语言的字符；此外，它还有扩展空间。由于其规模巨大，Unicode\
  \ 的子集 UTF-8 变得更加流行。UTF-8 也支持所有语言，但空间更小；它已成为 HTML5 的标准。\n\n尽管 HTML5 指定了默认字符集，但在你的网页中指定字符集是一个良好的做法，这样可以确保客户端浏览器使用相同的字符集来解释你的内容。你使用元元素来做到这一点。由于元元素提供了关于你网页的附加信息，你必须将其放置在\
  \ HTML 代码的 head 元素部分。\n\n元元素使用单边 `<meta>` 标签。在 HTML5 中指定字符集，你使用以下格式：\n\n```html\n\
  <meta charset=\"UTF-8\">\n```\n\n如果你的 HTML 代码需要不同的字符集，你可以在此处指定它。\n\n\n\n\n\n![tip](img/tip.png)\
  \ `<meta>` 标签允许你向浏览器指定网页页的其他特征，以便它知道如何处理网页的正文，并向自动扫描你的网页以进行搜索引擎优化的服务器识别网页的内容。我将在第\
  \ 4 本书的第 4 章中更详细地阐述 `<meta>` 标签。\n\n### 特殊字符\n\nUTF-8 字符集支持许多你在键盘上找不到的奇特字符，例如版权符号（©）、分币符号（¢）和度符号（°）。这些通常被称为`special\
  \ characters`。\n\n你可以在网页内容中使用特殊字符，因为它们是有效的 UTF-8 字符。你只需要使用一种不同的方式来指定它们即可。你不需要使用键盘输入这些字符，而是使用代码来指定它们。\n\
  \nHTML5 使用两种类型的代码来指定特殊字符：\n\n*   **数字字符引用：** 数字字符引用使用分配给字符的 UTF-8 数字代码。在字符数字前面加上一个和符号（`&`）和一个数字井号（`#`），在字符数字后面加上一个分号（`;`）。例如，要显示版权符号，请使用以下：\n\
  \n    `&#169;`\n\n*   **字符实体引用：** 字符实体引用使用短名称来表示字符。在字符短名称前面加上一个和符号（`&`），在字符短名称后面加上一个分号（`;`）：\n\
  \n    `&copy;`\n\n这两种方法都一样有效，所以使用任何你觉得最方便的方法。UTF-8 中可用的特殊字符列表很长，因此我在这里不包含它们。如果你在网络上搜索`UTF-8\
  \ characters`，你会发现许多显示 UTF-8 数字与字符短名称之间映射关系的网站。\n\n## 创建列表（并检查两次）\n\n世界上充满了列表——待办事项列表、愿望清单、购物清单……列表层出不穷。HTML5\
  \ 开发者创建了一种用于在网页中轻松展示列表的方法，这并不意外。HTML5 提供了三种基本类型的列表供你使用：无序列表、有序列表和描述列表。本节将介绍如何在网页中使用每种类型的列表。\n\
  \n### 无序列表\n\n某些列表对其包含的项目没有特定顺序（例如购物清单）。在文字处理世界中，这些被称为`bulleted lists`，因为列表中的每个项目前面都有一个通用的项目符号图标。在\
  \ HTML5 中，它们被称为`unordered lists`。\n\nHTML5 标准使用`ul element` 通过项目符号显示无序列表。`ul` 元素是一个双标签元素，使用\
  \ `<ul>` 标签打开列表，使用 `</ul>` 标签关闭列表。\n\n你必须使用 `li` 元素来标识列表中的每个项目。`li` 元素也是双标签元素，使用\
  \ `<li>` 标签打开项目。无序列表的结构如下：\n\n```html\n<ul>\n  <li>项目 1</li>\n  <li>项目 2</li>\n\
  \  <li>项目 3</li>\n</ul>\n```\n\n由于 HTML5 不关心空格，但为了便于阅读，通常会对列表项目进行缩进。图 1-6 显示了浏览器显示无序列表的方式。\n\
  \n![tip](img/9781119468387-fg02106)\n\n项目符号是通用的，类似于你在大多数处理文档中看到的。幸运的是，你可以通过 CSS\
  \ 定义不同类型的项目符号来增加趣味性。\n\n### 有序列表\n\n某些列表项目具有特定的出现和处理顺序。在文字处理中，这些列表被称为`numbered lists`。在\
  \ HTML5 中，它们被称为`ordered lists`。\n\nHTML5 标准使用`ol element` 显示有序列表。有序列表使用 `li element`\
  \ 标记列表中的各个项目：\n\n```html\n<ol>\n  <li>散狗。</li>\n  <li>吃早餐。</li>\n  <li>读报纸。</li>\n\
  \  <li>准备上班。</li>\n</ol>\n```\n\n默认情况下，浏览器为列表中的每个项目分配一个数字，从 1 开始并每个项目递增，如图 1-7 所示。\n\
  \n![tip](img/9781119468387-fg02107)\n\n如果你想让列表倒序排列，请添加`reversed`属性：\n\n```html\n\
  <ol reversed>\n```\n\n如果你想从不同的数字开始，请添加`start`属性：\n\n```html\n<ol start=\"10\">\n\
  ```\n\n表 1-3 显示了可用的不同类型：\n\n| 类型 |  |\n| --- | --- |\n| 1 |\n| a | 字母，小写 |\n| I\
  \ | 罗马数字，大写 |\n| i | 罗马数字，小写 |\n\n### 描述列表\n\n列表的另一个常见用途是为术语提供描述，例如词汇表。HTML5 标准使用*description\
  \ lists*来提供这种简单的方法。描述列表使用`dl element` 定义列表，但定义项目的方法与无序列表和有序列表略有不同。你使用 `dt element`\
  \ 定义术语，使用 `dd element` 定义关联的描述。\n\n```html\n<dl>\n  <dt>棒球</dt>\n  <dd>一种用球棒和球进行的的游戏</dd>\n\
  \  <dt>篮球</dt>\n  <dd>一种用球和篮筐进行的的游戏</dd>\n  <dt>足球</dt>\n  <dd>一种用球和球门进行的的游戏</dd>\n\
  </dl>\n```\n\n\n\n\n\n要在你的网页中添加表格，你需要从 HTML5 的 `table element` 开始。`table element`\
  \ 是一个双标签元素，因此它用 `<table>` 标签开启并在 `</table>` 标签关闭：\n\n```html\n<table>\n</table>\n\
  ```\n\n这创建了表格，但它目前看起来并不无趣，因为里面还没有任何内容。下一步是为数据定义单元格。\n\n![warning](img/warning.png)\
  \ 之前的 HTML 版本为 `<table>` 标签添加了属性来定义表格外观，例如边框类型、单元格间距和宽度。HTML5 放弃了所有这些属性，因此请避免使用它们。你现在应该使用\
  \ CSS 样式来定义这些特性。\n\n### 定义表格的行和列\n\n如果你熟悉标准的电子表格软件（如 Microsoft Excel 或 Apple Numbers），你已经习惯了使用字母（列）和数字（行）引用的单元格来定义表格。遗憾的是，HTML5\
  \ 使用了不同的方法来定义表格单元格。\n\n要构建单元格，你必须定义两个独立的元素：\n\n*   **表格中的行：** 你使用 `tr element` 来定义表格内部的行。`tr\
  \ element` 是一个双标签元素，因此你使用 `<tr>` 标签开启行并使用 `</tr>` 标签关闭行。\n\n*   **行内的单元格：** 在行内部，你使用\
  \ `td element` 来定义单个单元格。同样，`td element` 是双标签的，因此你使用 `<td>` 标签开启单元格并使用 `</td>` 标签关闭单元格。\n\
  \n有了这些信息，你就可以创建第一个表格了。只需按照以下步骤操作：\n\n1.  **打开你的文本编辑器、程序编辑器或 IDE 包，并输入以下代码：**\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>My First Table</title>\n</head>\n\
  <body>\n<h1>Bowling Scores</h1>\n<table>\n<tr>\n<td>Bowler</td>\n<td>Game 1</td>\n\
  <td>Game 2</td>\n<td>Game 3</td>\n<td>Average</td>\n</tr>\n<tr>\n<td>Rich</td>\n\
  <td>100</td>\n<td>110</td>\n<td>95</td>\n<td>102</td>\n</tr>\n<tr>\n<td>Barbara</td>\n\
  <td>110</td>\n<td>105</td>\n<td>103</td>\n<td>106</td>\n</tr>\n<tr>\n<td>Katie</td>\n\
  <td>120</td>\n<td>125</td>\n<td>115</td>\n<td>120</td>\n</tr>\n<tr>\n<td>Jessica</td>\n\
  <td>115</td>\n<td>120</td>\n<td>120</td>\n<td>118</td>\n</tr>\n</table>\n</body>\n\
  </html>\n```\n\n2.  **将文件保存到 XAMPP 的 `DocumentRoot` 文件夹中，命名为 `mytable.html`。**\n\
  \n3.  **确保 XAMPP 服务器正在运行。**\n\n4.  **打开浏览器并输入以下 URL：**\n\n    `http://localhost:8080/mytable.html`\n\
  \n    你可能需要更改 URL 中的 8080 端口号以匹配你设置中的 Apache Web 服务器。当你显示该网页时，它看起来就像图 1-9。\n\n![image](img/9781119468387-fg020109.png)\n\
  \n图 1-9: 在 Chrome 中显示表格。\n\n默认情况下，表格不包含任何网格线，但你可以像下一章所示使用 CSS 来更改它。此外，表格列标题看起来和数据行一样。你接下来将解决这个问题。\n\
  \n### 定义表头\n\n你可以通过在标题单元格中使用 `th element` 而不是 `td element`，在不使用 CSS 的情况下为表头应用特殊的格式：\n\
  \n```html\n<tr>\n<th>Bowler</th>\n<th>Game 1</th>\n<th>Game 2</th>\n<th>Game 3</th>\n\
  <th>Average</th>\n</tr>\n```\n\n`th element` 会让浏览器使用粗体字体显示标题单元格。\n\n在表格中，你经常会遇到数据单元格必须跨越两或更多列或行的情况。你可以在\
  \ HTML5 表格中使用 `<td>` 标签中的 `rowspan` 和 `colspan` 属性来模拟这种效果。\n\n要在单行中跨越两或更多行，你可以使用\
  \ `rowspan`：\n\n```html\n<tr>\n<td>Rich</td>\n<td>100</td>\n<td>110</td>\n<td>95</td>\n\
  <td>102</td>\n</tr>\n```\n\n\n\n\n\n*   `class` 属性：规则适用于所有具有指定类值的元素。\n*   **伪元素\
  \ (Pseudo-element)**：规则适用于元素内部的特定部分。\n*   **伪类 (Pseudo-class)**：规则适用于处于特定状态的元素。\n\
  \n每个声明都定义了一个 CSS3 样式属性及其关联的值。每个属性为规则所应用的元素设置了特定的样式（如颜色或字体）。你必须在每个声明后以分号结束，并且可以在规则中列出任意数量的声明。\n\
  \n以下是你在声明中列出的属性及其值的格式：\n\n`property`:` `valuevalue`\n\n在接下来的章节中，我将更详细地解释定义选择器的五种方法。\n\
  \n### 元素类型 (Element type)\n\n你可以通过指定元素名称作为选择器，对网页中所有特定类型的元素应用相同的样式：\n\n```css\n\
  h1 {color: red;}\n```\n\n此规则确保浏览器使用红色字体显示网页中的所有 `h1` 元素。\n\n如果你想对多种类型的元素应用相同的样式，可以将它们列为单独的规则，也可以通过逗号分隔元素名称将它们组合在选择器中，如下所示：\n\
  \n```css\nh1, p {color: red;}\n```\n\n此规则指示浏览器对所有 `h1` 和 `p` 元素使用红色字体。\n\n### id\
  \ 属性 (id attribute)\n\n如果你需要定义一个仅适用于网页中单个元素的规则，请使用 `id` 属性作为选择器。要将 `id` 属性指定选择器，请在\
  \ id 名称前放置井号（`#`）：\n\n```css\n#warning {color: red;}\n```\n\n要在你的 HTML5 代码中使用该规则，只需将\
  \ `id` 属性值应用到你需要样式的元素上：\n\n```html\n<h1 id=\"warning\">This is a bad selection.</h1>\n\
  ```\n\n浏览器会将该规则应用到使用该 `id` 属性值的特定元素。\n\n### class 属性 (class attribute)\n\n如果你需要定义一个适用于多个元素的规则，但不一定是该类型的所有元素，请使用\
  \ `class` 属性作为选择器。要将 `class` 属性指定选择器，请在类名前放置点（`.`）：\n\n```css\n.warning {color:\
  \ red;}\n```\n\n然后只需将该类属性应用到任何你需要使用该规则设置样式的元素上：\n\n```html\n<h1 class=\"warning\"\
  >This is a bad selection.</h1>\n<p class=\"warning\">Please make another selection.</p>\n\
  ```\n\n如从此示例所示，你可以对不同的元素类型应用相同的类属性值，这使其成为为网页部分设置样式的一种非常灵活的方法！\n\n如果你决定只需要对类属性的某一个特定元素类型应用规则，你可以在选择器中的类值之前指定元素类型：\n\
  \n```css\np.warning {color: red;}\n```\n\n此规则将仅适用于 `class` 属性值为 `warning` 的 `p`\
  \ 元素。\n\n### 伪元素 (Pseudo-element)\n\nCSS 标准定义了一些特殊情况，在这些情况下，你可以将样式应用于元素内容的子部分，而不是元素的全部内容。这些规则被称为伪元素。\n\
  \n要使用伪元素规则，请使用双冒号（`::`）将规则与其所应用的选择器隔开：\n\n`selector`::`pseudo-element`\n\nCSS3 支持一组用于伪元素名称的关键字。例如，如果你想花点心思，让段落文字的首字母与其余文本具有不同的样式，可以使用\
  \ `first-letter` 伪元素关键字：\n\n```css\np::first-letter {font-size: 20px}\n```\n\n`first-letter`\
  \ 伪元素仅匹配 `p` 元素的第一个字母，如图 2-1 所示。\n\n![image](img/9781119468387-fg020201.png)\n\n\
  图 2-1： 在文本上使用 first-letter 伪元素。\n\nCSS3 仅定义了少数伪元素。表 2-1 列出了它们。\n\n| **伪元素 (Pseudo-Element)**\
  \ | **描述 (Description)** |\n| --- | --- |\n| `after` | 在所选元素内容之前放置一个对象 |\n| `before`\
  \ | 在所选元素内容之后放置一个对象 |\n| `first-letter` | 将规则应用于所选元素内容的第一个字母 |\n| `first-line` |\
  \ 将规则应用于所选元素内容的第一行 |\n| `selection` | 将规则应用于网站访问者选中的内容区域 |\n\n表 2-1 CSS3 伪元素\n\n\
  可用的伪元素并不多，但这几个伪元素在尝试为网页设置特殊格式时会非常有用。\n\n![tip](img/tip.png) `after` 和 `before` 伪元素在尝试为网页设置特殊格式时会非常有用。\n\
  \n有许多伪类可以用于对页面中的特定元素应用规则。表 2-2 显示了 CSS3 中可用的伪类列表。\n\n| **伪类 (Pseudo-Class)** | **描述\
  \ (Description)** |\n| --- | --- |\n| `active` | 规则适用于用户点击时这些链接 |\n| `checked` |\
  \ 规则适用于被选中的输入框和单选框 |\n| `disabled` | 规则适用于禁用的元素 |\n| `enabled` | 规则适用于启用的输入元素 |\n\
  | `empty` | 规则适用于没有子元素的元素 |\n| `first-child` | 规则适用于父元素的第一个元素 |\n| `first-of-type`\
  \ | 规则适用于父元素的相同类型的第一个元素 |\n| `focus` | 规则适用于获得焦点的元素 |\n| `hover` | 规则适用于鼠标指针悬停的元素\
  \ |\n| `in-range` | 规则适用于处于指定范围内的元素 |\n| `invalid` | 规则适用于无效的元素 |\n| `lang(`*`language`*)`)\
  \ | 规则适用于指定 `lang` 属性的元素 |\n| `last-child` | 规则适用于父元素的最后一个元素 |\n| `last-of-type`\
  \ | 规则适用于父元素的相同类型的最后一个元素 |\n| `link` | 规则适用于未访问过的超链接元素 |\n| `not(`*`selector`*)`\
  \ | 规则适用于除指定选择器元素外的所有元素 |\n\n\n\n\n\n| `nth-child(n)` | 该规则适用于父元素的第 `n` 个子元素。 |\n\
  | `nth-last-child(n)` | 该规则适用于从父元素的最后一个元素开始倒数数的第 `n` 个子元素。 |\n| `nth-of-type(n)`\
  \ | 该规则适用于与父元素类型相同的第 `n` 个子元素。 |\n| `only-of-type` | 该规则适用于每一个与父元素类型相同且唯一的元素。 |\n\
  | `only-child` | 该规则适用于作为父元素唯一子元素的元素。 |\n| `optional` | 该规则适用于不具有 `required` 属性的输入元素。\
  \ |\n| `out-of-range` | 该规则适用于值超出指定范围的元素。 |\n| `read-only` | 该规则适用于指定了 `readonly`\
  \ 属性的元素。 |\n| `read-write` | 该规则适用于未指定 `readonly` 属性的元素。 |\n| `required` | 该规则适用于指定了\
  \ `required` 属性的元素。 |\n| `root` | 该规则适用于文档的根元素。 |\n| `target` | 该规则适用于当前指定的活动元素。\
  \ |\n| `valid` | 该规则适用于具有有效值的元素。 |\n| `visited` | 该规则适用于网站访问者已经访问过的超链接。 |\n\n##\
  \ 表 2-2 CSS3 伪类\n\n许多伪类样式规则（例如 `first-child` 和 `last-child`）的作用取决于元素在文档对象模型（DOM）中的位置。第\
  \ 3 册第 2 章讨论了 DOM 以及如何使用它来引用网页上的元素。\n\n字体 应用样式规则\n\n在第 1 本第 1 章中，我讨论了将 CSS3 样式应用到\
  \ HTML5 文档的不同方式。为了帮助你唤回记忆，有三种方法：\n\n*   **内联样式：** 在 HTML5 元素的起始标签内使用 `style` 属性放置样式属性：\n\
  \    ```html\n    <h1 style=\"color: red;\">警警告</h1>\n    ```\n*   **内部样式：** 使用\
  \ `<style>` 标签定义一组适用于整个文档的样式：\n    ```html\n    <style>\n    h1 {color: red;}\n\
  \    </style>\n    ```\n*   **外部样式：** 使用外部文件包含样式定义，然后在 HTML5 文档中添加 `<link>` 标签来引用外部样式表：\n\
  \    ```html\n    <link rel=\"stylesheet\" href=\"mystyles.css\">\n    ```\n\n请注意，在使用内联样式（inline\
  \ style）定义时，你省略了规则中的选择器部分。因为规则仅适用于声明它的元素，所以不需要选择器。在内联样式和外部样式表方法中，你都可以在样式表中单独定义一组规则。使用外部样式表方法的巨大优势在于，你可以随后将同一个样式表应用到你网站的所有页面！\n\
  \n你可以使用这些位置中的任何一个来定义你的样式规则，也可以同时使用它们！如果网页上的同一个元素适用于两个或多个样式规则，CSS3 的级联特性就会生效。CSS3\
  \ 定义了一个特定的过程，说明浏览器如何将冲突的规则应用于元素，以确保所有操作都按顺序进行。下一节将解释它是如何运作的。\n\n### 级联样式规则\n\n顾如名，如果你为网页定义了多个样式规则，这些规则将从低优先级规则（先应用）向高优先级规则（后应用）级联。\n\
  \n![tip](img/tip.png) 从低优先级到高优先级使用“向下”一词似乎违背直觉，但这是 CSS 领域的常用术语。只需记住，高优先级规则优于低优先级规则即可。\n\
  \nCSS3 标准为浏览器应如何向每个元素应用样式规则定义了一个严格的流程。在第 1 本第 1 章中，我概述了级联规则的简略版本。实际上，CSS3 标准为应用规则定义了十种不同的规则层级！然而，大多数网页设计师并不会使用全部十层级来定义规则，所以事情通常不会变得那么复杂。\n\
  \n表 2-3 展示了官方的 CSS3 级联规则过程。\n\n| 规则类型 | 描述 | 优先级级别 |\n| --- | --- | --- |\n| 优先级\
  \ | 规则包含 `!important` 属性并覆盖所有其他规则 | 1 |\n| 内联 | 在元素起始标签中使用 `style` 属性定义的规则 | 2 |\n\
  | 媒体 | 为特定媒体类型定义的规则 | 3 |\n| 用户定义 | 网站访问者在浏览器中定义的无障碍功能 | 4 |\n| 特异选择器 | 指向 id、class、伪元素或伪类的类的选择器\
  \ | 5 |\n| 规则顺序 | 当多个规则应用于一个元素时，最后声明的规则胜出 | 6 |\n| 继承 | 从父元素继承的规则 | 7 |\n| 内部 |\
  \ 在内部样式表中定义的规则 | 8 |\n| 外部 | 在外部样式表中定义的规则 | 9 |\n| 浏览器默认 | 浏览器内置的样式，优先级最低 | 10 |\n\
  \n表 2-3 CSS3 级联规则\n\n![remember](img/remember.png) 注意，无障碍功能在级联规则中具有特殊地位。你的网站访问者可能由于某些障碍而无法查看你样式化的内容。大多数浏览器允许用户定义自己的样式功能，例如指定背景颜色或更改字体大小以提高可读性。\n\
  \n现在你已经了解了如何定义以及在哪里定义规则，下一步是学习一些应用于网页的规则。CSS 标准定义了众多的样式供你使用。有整本书都在试图涵盖所有的规则和功能，例如\
  \ John Paul Mueller 写的 *CSS3 For Dummies*。本章的剩余部分将带你了解设计 Web 应用时需要考虑的一些常用规则。\n\n\
  ## 文本样式\n\n没有任何地方的样式重要性网页上显示的文本。通过对文本样式进行一些更改，你就可以转化枯燥乏味的网站。本节将介绍用于样式文本的各种选项，以为你的网站增添活力。\n\
  \n### 设置字体\n\n*字体*定义了媒介如何显示字符。无论是在石头上刻字、使用印刷机在纸上设置字迹，还是在计算机显示器上显示像素，字体都能帮助读者理解内容。\n\
  \n当你使用 HTML5 在网页上放置文本时，浏览器会根据元素类型选择默认字体样式、大小和格式，并对网页上该元素的所有文本使用相同的设置。这不仅让网页看起来枯燥，而且如果所有内容混在一起，还会误导访问者。本节描述了你可以如何更改浏览器显示文本的字体特征。\n\
  \n#### 寻找字体族\n\nCSS 标准定义了 `font-family` 样式属性，允许你更改字体样式。`font-family` 属性的格式如下：\n\n\
  ```css\nfont-family: `fontlist`;\n```\n\n`fontlist`* 值是用逗号分隔的字体名称列表。在列表中指定字体有两种方式：\n\
  \n\n\n\n\n### 使用特定的字体名称\n\n特定的字体名称要求浏览器使用特定的字体来显示文本，例如 `Times New Roman`、`Arial`\
  \ 或 `Helvetica`。浏览器仅限于使用工作站上安装的字体，因此指定特定的字体名称可能是一种博弈。如果网站访问者的工作站上没有该字体，浏览器将回退到默认字体。在\
  \ `font-family` 属性中提供多个字体名称选项已成为一种常见做法。浏览器将尝试使用列表中第一个字体，如果该字体不可用，它将尝试列表中的下一个字体，并继续向下在列表查找。如果没有可用的字体，浏览器将回退到默认字体。\n\
  \n### 使用通用字体族\n\n通用字体族为浏览器在选择要使用的字体时留有了更多的余地。浏览器不再寻找特定的字体，而是可以使用字体组包含的任何字体。CSS3\
  \ 定义了以下字体族：\n\n*   `cursive`：一种模仿手写文本的字体\n*   `fantasy`：用于特殊文本的装饰性字体\n*   `monospace`：所有字符间距相同的字体\n\
  *   `sans-serif`：字符上没有添加任何装饰的无衬线字体\n*   `serif`：在每个字符末尾带有装饰的衬线字体\n\n在字体列表中先列出特定的字体名称，然后作为最后的手段添加通用字体族，是一种常见的做法，例如：\n\
  \n```\nfont-family: Arial, 'Times New Roman', sans-serif;\n```\n\n根据此规则，浏览器将尝试使用\
  \ `Arial` 字体。如果访问者的工作站上没有该字体，它将尝试使用 `Times New Roman` 字体。如果 `Times New Roman` 也不可用，浏览器将从\
  \ `sans-serif` 字体族查找字体。\n\n![remember](img/remember.png) 注意，对于包含空格的字体名称，必须用单引号将名称括起来。\n\
  \n![tip](img/tip.png) CSS3 标准定义了一个有趣的新功能称为 `web fonts`（网络字体）。网络字体允许你在服务器上定义自己的字体，以便浏览器可以随网页一起下载它们。我将在第\
  \ 4 章中详细介绍如何使用网络字体。\n\n### 选择尺寸\n\n在选择了要使用的字体样式后，下一步是决定字体的大小。浏览器具有内置的尺寸来区分不同的标题级别以及标准文本。然而，你可以通过使用\
  \ `font-size` 属性来更改它：\n\n```\nfont-size: size;\n```\n\n你可能认为指定字体大小很容易的，但 CSS3 实际上允许你通过五种不同方法之一指定尺寸：\n\
  \n*   作为绝对测量单位\n*   作为相对测量单位\n*   作为元素所分配的的百分比\n*   使用尺寸关键字\n*   使用相对于元素所分配空间的尺寸关键字\n\
  \n你使用特定的尺寸测量值来指定绝对单位。为了让情况更加复杂，CSS 允许你使用六种不同的测量单位，如表 2-4 所示。\n\n| **单位** | **描述**\
  \ |\n| :--- | :--- |\n| `cm` | 厘米 |\n| `in` | 英寸 |\n| `mm` | 毫米 |\n| `pc` | 缇 (Picas)\
  \ |\n| `pt` | 磅 (Points) |\n| `px` | 像素 |\n\n表 2-4 CSS 字体大小绝对测量单位\n\n在表 2-4 中显示的前三个测量单位很容易识别，但后三个并不那么常见。1\
  \ 英寸有 6 缇，1 英寸有 72 磅。像素单位最初对应标准计算机显示器上的像素，但随着显示器技术的进步，情况已不再如此了。\n\n你可以使用整数或小数值来指定尺寸：\n\
  \n```\nfont-size: 0.25in;\n```\n\n```\nfont-size: 48pt;\n```\n\n相对测量单位设置字体相对于网页上其他元素的尺寸。表\
  \ 2-5 显示了 CSS3 中的相对尺寸单位。\n\n| **单位** | **描述** |\n| :--- | :--- |\n| `ch` | 相对于零字符的大小\
  \ |\n| `em` | 相对于元素标准字体大小的大小 |\n| `ex` | 相对于当前使用的字体大小的高度 |\n| `rem` | 相对于根元素的高度\
  \ |\n| `vh` | 相对于浏览器窗口高度的 1% |\n| `vw` | 相对于浏览器窗口宽度的 1% |\n| `vmax` | 相对于浏览器窗口高度的\
  \ 1% |\n| `vmin` | 相对于浏览器窗口宽度的 1% |\n| `%` | 相对于元素分配的百分比 |\n\n表 2-5 CSS 字体大小相对测量单位\n\
  \n`em` 单位是最常用的，它相对于父元素设置字体。例如，这里有一个规则：\n\n```\nh1 {font-size: 2em;}\n```\n\n`rem`\
  \ 单位相对于根元素的大小，使其对于响应式设计非常有用。\n\n### 尝试颜色\n\n默认情况下，浏览器在白色背景上显示所有文本。没有比这更无趣了！点亮你网站的第一步之一是更改文本颜色。有两个\
  \ CSS 属性可以实现这一点：\n\n*   `color`：选择浏览器用于文本的颜色\n*   `background-color`：选择浏览器用于背景的颜色\n\
  \n你有大量的色板可供你的配色方案选择。通常，最好为你的网站选择一种配色方案并在大多数网页中保持一致。通常，公司会根据其 Logo 的颜色设置其网站的配色方案。有时，你可能需要某些内容突出显示，因此你需要偏离方案。\n\
  \n原始的 CSS 标准提供了三种定义样式颜色的方法：\n\n*   **使用颜色名称**：你可以从标准颜色列表中选择一个文本值。CSS3 通过名称定义了许多颜色。如果你计划使用标准颜色，你可能可以直接通过名称调用它：\n\
  \n    ```\n    p {color: red; background-color: white;}\n    ```\n\n*   **使用 RGB\
  \ 十进制值**：如果你想精调网页元素使用的颜色，可以根据从 00 到 FF 的十六进制值选择红、绿、蓝颜色的强度。如果你喜欢十六进制数字，请使用三个带有井号的十六进制值来定义颜色：\n\
  \n    ```\n    p {color: #ffa500;}\n    ```\n\n    `ffa500` 值将红色调设置为全强度，将绿色调稍微调低，并关闭蓝色调，产生橙色。\n\
  \n*   **使用 `rgb()` 函数**：你可以使用从 0 到 255 的十进制值红、绿、蓝强度来选择颜色。要使用 `rgb()` 方法指定相同的颜色，你会使用以下代码：\n\
  \n    ```\n    p {color: rgb(255, 165, 0);}\n    ```\n\n\n\n\n如果你对想要的红色深浅并不挑剔，第一种方法就足够了。但很有可能，你会希望在颜色选择上更加精确（例如，将红色深浅与公司\
  \ Logo 中的红色匹配），因此你将使用另外两种方法中的一种。使用哪种方法取决于个人喜好。\n\n更新后的 CSS3 标准提供了网页中处理颜色的四种新方法：\n\
  \n*   `RGBA`：在标准 RGB 设置中添加不透明度值\n*   `HSL`：将颜色定义为色相、饱和度和亮度百分比\n*   `HSLA`：将颜色定义为\
  \ HSL 值，并添加不透明度值\n*   `Opacity`：定义透明度值以使元素更不透明\n\nCSS3 颜色方案的主要新增是不透明度功能。不透明度功能提供了让元素透明或淡出的能力。不透明度值从\
  \ `0.0`（完全透明）到 `1.0`（不透明，也称为不透明）。\n\n这里有一个示例，用于演示更改元素颜色是如何工作的：\n\n1.  **打开你喜喜欢的文本编辑器、程序编辑器或集成开发环境\
  \ (IDE) 软件包。**\n2.  **在编辑器窗口中输入以下代码：**\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  <title>Testing colors in CSS3</title>\n<style>\np {\n  font-family: Arial, Helvetica,\
  \ sans-serif;\n  color: #ff0000;\n  background-color: cyan;\n}\nh1 {\n  color: rgb(255,\
  \ 165, 0);\n  background-color: green;\n}\n</style>\n</head>\n<body>\n  <h1>Testing\
  \ the color scheme</h1>\n  <p>\n  The quick brown fox jumps over the lazy dog.\n\
  \  </p>\n  <h1>This is the end of the color test</h1>\n</body>\n</html>\n```\n3.\
  \  **将程序保存为 `colortest.html` 并存于 Web 服务器的 `DocumentRoot` 文件夹中。**\n    如果你使用 XAMPP，Windows\
  \ 下的路径为 `c:\\xampp\\htdocs`，macOS 下为 `/Applications/XAMPP/htdocs`。\n4.  **启动 Web\
  \ 服务器。**\n    如果你使用 XAMPP，启动 XAMPP 控制面板，点击 Apache Web 服务器的“Start”按钮。\n5.  **打开浏览器并访问新文件的\
  \ URL：**\n    `http://localhost:8080/colortest.html`\n    ***注意：*** 你可能需要更改 URL\
  \ 中的端口以匹配你的 Web 服务器使用的端口。\n6.  **停止 Web 服务器并关闭浏览器。**\n    你应该能在网页的输出中看到浏览器对 `h1`\
  \ 元素和 `p` 元素使用了不同的颜色。然而，请注意元素之间存在一些空白，如 图 2-2 所示。\n\n![image](img/9781119468387-fg020202.png)\n\
  \nFIGURE 2-2: 在 CSS3 中显示不同颜色的元素\n\n你没有在 HTML5 代码中定义 `p` 和 `h1` 元素之间的空间，那为什么那里有空间？你可能认为浏览器出了问题，但实际上这是我接下来介绍的\
  \ CSS 特性。\n\n## 使用盒模型 (Box Model)\n\nCSS3 使用 `盒模型`（box model）处理网页上的所有元素，盒模型定义了元素内部和周围的区域，并为你提供了更改这些特征样式的方法。图\
  \ 2-3 显示了 CSS3 中定义的盒模型。\n\n![image](img/9781119468387-fg020203.png)\n\nFIGURE 2-3:\
  \ CSS3 盒模型。\n\n盒模型定义了元素的四个不同部分。从内到外，它们分别是：\n\n*   `Content`（内容）：元素包含的文本或图像\n*  \
  \ `Padding`（内边距）：内容周围的空间\n*   `Border`（边界）：内容和内边距周围的区域，通常可见\n*   `Margin`（外边距）：元素边界之外元素之间的空间\n\
  \n通过 CSS3，你可以更改元素周围的 `padding`、`margin` 和 `border`，帮助它在网页中脱颖而出。你通过 `padding`、`margin`\
  \ 和 `border` 样式属性来实现。\n\n让我们修正 `colortest.html` 代码，移除元素周围的外边距并添加一些额外的内边距，看看会产生什么变化：\n\
  \n1.  **修正 `colortest.html` 代码，移除元素周围的外边距并添加一些额外的内边距，看看会产生什么变化：**\n    （此处由于原文存在大量重复损坏内容，已按逻辑进行简化处理）\n\
  \n\n\n\n# 表格样式与定位\n\n3. **保存文件。**\n\n4. **启动你的 Web 服务器软件，打开浏览器并访问以下 URL：**\n   `http://localhost:8080/mytable.html`\n\
  \n5. **关闭浏览器并停止你的 Web 服务器软件。**\n\n添加样式后，你应该能看到每个表格单元格周围有一条单边框，整个表格周围也有一条单边框，如图 2-5\
  \ 所示。\n\n![image](img/9781119468387-fg020205.png)\n\n图 2-5： 为表格添加边框。\n\n现在每个单元格都有了边框，表格内部数据看起来有些拥挤的感觉可能变得更加明显了。你可以进一步尝试每个单元格内文本的大小和定位。我将在下一节中介绍这些。\n\
  \n## 表格数据\n\n如你在图 2-5 所示，默认情况下，浏览器创建表格单元格的大小仅能容纳单元格中最大的数据值。这可能会导致表格看起来有些拥挤。幸运的是，你可以使用一些\
  \ CSS 属性在表格单元格的数据周围添加更多空间。\n\n### 单元格内边距 (Padding)\n\n“填充单元格”听起来有点不妙，但为表格单元格添加 `padding`\
  \ 属性可以极大改变表格数据的外观：\n\n```css\ntable tr td {\n  border: 1px solid black;\n  border-collapse:\
  \ collapse;\n  padding: 10px;\n}\n```\n\n当你在表格单元格内部提供额外的空间时，你对数据在表格中的显示位置就有更多选择。\n\
  \n### 对齐单元格中的文本\n\n你可以使用 `text-align` 属性将数据对齐到单元格的左侧、居中或右侧：\n\n```css\ntable th\
  \ {\n  border: 1px solid black;\n  border-collapse: collapse;\n  padding: 10px;\n\
  \  text-align: center;\n}\n```\n\n此定义使表格表头 (`th`) 元素中的文本居中。如果你还想将文本在单元格内向上移动，请使用\
  \ `vertical-align` 属性。\n\n### 表格颜色\n\n仅使用默认的黑白表格会让你的网站访问者快速睡着！为你的表格添加 `color` 和\
  \ `background-color` 属性让它脱颖而出。你可以将颜色应用于整个表格、单个行，甚至单个单元格。\n\n为了通过表格中的交替行颜色来模拟旧的大型机打印机报告样式，可以使用\
  \ `nth-child` 伪类将表格中的每隔行样式化为不同的颜色，如下：\n\n```css\ntr: nth-child(even) {\n  background-color:\
  \ lightgreen;\n}\n```\n\n如果你年纪足够大还记得大型机计算机报告的日子，这应该能勾起你的回忆！\n\n另一个实用的功能是使用 `hover`\
  \ 伪类，当网站访问者将鼠标指针悬停在单个单元格上时，改变该单元格的背景颜色：\n\n```css\ntd: hover {\n  background-color:\
  \ yellow;\n}\n```\n\n现在事情真的开始变得高级了！\n\n## 元素定位\n\n默认情况下，浏览器按照设定的顺序将元素放置在窗口中。随着网页定义每个元素，浏览器从窗口的左上角开始，从左到右、从上到下放置元素。\n\
  \n为了演示这一点，让我们运行一个快速测试。你将创建一个包含五个部分的网页：\n\n* 显示在网页顶部的页头 (header)\n* 显示在网页底部的页脚 (footer)\n\
  * 显示在中间部分左侧的导航部分 (nav)\n* 显示在中间部分右侧的侧边部分 (aside)\n* 显示在中间部分中央的内容部分 (section)\n\n\
  这是一个非常标准的网页布局结构，我确定你在浏览网页时见过很多次。\n\n按照以下步骤运行测试：\n\n1. **打开你喜欢的文本编辑器、程序编辑器或 IDE 包，并输入以下代码：**\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Positioning Test</title>\n\
  \  <style>\n    header {\n      background-color: red;\n      margin: 0px;\n   \
  \   padding: 10px;\n      height: 25px;\n      width: 600px;\n    }\n    nav {\n\
  \      background-color: blue;\n      margin: 0px;\n      padding: 10px;\n     \
  \ height: 125px;\n      width: 200px;\n    }\n    section {\n      background-color:\
  \ green;\n      margin: 0px;\n      padding: 10px;\n      height: 125px;\n    }\n\
  \    aside {\n      background-color: yellow;\n      margin: 0px;\n      padding:\
  \ 10px;\n      height: 125px;\n      width: 200px;\n    }\n    footer {\n      background-color:\
  \ orange;\n      margin: 0px;\n      padding: 10px;\n      height: 125px;\n    \
  \  width: 600px;\n    }\n  </style>\n</head>\n<body>\n  <header>Header</header>\n\
  \  <nav>Navigation</nav>\n  <section>Main Content</section>\n  <aside>Aside</aside>\n\
  \  <footer>Footer</footer>\n</body>\n</html>\n```\n\n\n\n```css\nheader {\n  position:\
  \ absolute;\n  top: 0px;\n  left: 0px;\n}\nnav {\n  background-color: blue;\n  margin:\
  \ 0px;\n  padding: 10px;\n  height: 125px;\n  width: 200px;\n  position: absolute;\n\
  \  top: 46px;\n  left: 0px;\n}\nsection {\n  background-color: green;\n  margin:\
  \ 0px;\n  padding: 10px;\n  height: 125px;\n  width: 200px;\n  position: absolute;\n\
  \  top: 46px;\n  left: 201px;\n}\naside {\n  background-color: yellow;\n  margin:\
  \ 0px;\n  padding: 10px;\n  height: 125px;\n  width: 200px;\n  position: absolute;\n\
  \  top: 46px;\n  left: 402px;\n}\nfooter {\n  background-color: orange;\n  margin:\
  \ 0px;\n  padding: 10px;\n  height: 25px;\n  width: 600px;\n  position: absolute;\n\
  \  top: 192px;\n  left: 0px;\n}\n```\n\n3. **将更新后的** `positiontest.html` **文件另存为**\
  \ `positiontest2.html`。\n\n4. **启动你的 Web 服务器，打开浏览器并访问以下 URL：**\n\n`http://localhost:8080/positiontest2.html`\n\
  \n5. **关闭浏览器并停止 Web 服务器。**\n\n额外的代码将浏览器为每个部分设置的定位方法设置为 `absolute`，这意味着它将根据你使用 `top`\
  \ 和 `left` 属性定义的，将这些部分放置在浏览器窗口的精确位置。当你显示该网页时，你应该能看到如图 2-7 所示的结果。\n\n![image](img/9781119468387-fg020207.png)\n\
  \n图 2-7： 使用绝对定位在网页中放置各个部分。\n\n现在看起来开始像一个真实的网页了！\n\n### 浮动元素\n\n绝对定位对于我们在网页中布局元素的方式产生了巨大的差异性影响，但它并不能解决所有问题。你可能已经意识到，在复杂的网页中为每个元素确定精确的位置是相当困难的。此外，你会发现在调整浏览器窗口大小时，这些部分保持在固定的位置和大小上——它们不会随着浏览器窗口的扩大或缩小。幸运的是，有一种方法可以避免这些问题。\n\
  \nCSS 使用了一种名为 `float` 属性的特性来通过更动态的方法在网页中定位元素。`float` 属性允许你将元素从网页的普通布局流中取出，并将其放置在其父容器元素的左边缘或右边缘。你不需要计算父元素内元素的精确位置。\n\
  \n`float` 属性的格式非常简单：\n\n`float:` `position`\n\n位置值可以是 `none`、`left` 或 `right`。\n\
  \n`float` 属性最常用于创建网页布局中的列。与其对列使用绝对定位，不如定义一个父容器元素，然后只需对父元素内部的列元素进行浮动（float）即可。\n\n\
  让我们用 `positiontest.html` 示例来尝试一下。你将在网页文档中添加一个 `div` 元素，作为中间三个部分（nav、section 和 aside）的容器。按照以下步骤操作：\n\
  \n1. **用你喜欢的文本编辑器、程序编辑器或 IDE 包打开原始的** `positiontest.html` **文件。**\n\n2. **修改定义的样式，使其看起来如下：**\n\
  \n```css\n<style>\nheader {\n  background-color: red;\n  margin: 0px;\n  padding:\
  \ 10px;\n  height: 25px;\n  width: 100%;\n}\nnav {\n  background-color: blue;\n\
  \  margin: 0px;\n  padding: 10px;\n  height: 125px;\n  width: 20%;\n  float: left;\n\
  }\nsection {\n  background-color: green;\n  margin: 0px;\n  padding: 10px;\n  height:\
  \ 125px;\n  width: 55%;\n  float: left;\n}\naside {\n  background-color: yellow;\n\
  \  margin: 0px;\n  padding: 10px;\n  height: 125px;\n  width: 20%;\n  float: right;\n\
  }\nfooter {\n  background-color: orange;\n  margin: 0px;\n  padding: 10px;\n  height:\
  \ 25px;\n  width: 100%;\n  float: both;\n}\n</style>\n```\n\n```html\n<<body>\n\
  \  <header></header>\n  <div id=\"container\">\n    <nav></nav>\n    <section></section>\n\
  \    <aside></aside>\n  </div>\n  <footer></footer>\n</body>\n```\n\n\n\n\n`form`\
  \ 元素具有许多属性，定义了浏览器如何处理表单数据。表 3-1 显示了所有可用属性。\n\n| 属性 | 说明 |\n| --- | --- |\n| `accept-charset`\
  \ | 如果表单使用的字符集与网页不同，则指定该字符集 |\n| `action` | 定义浏览器应该发送表单数据的 URL |\n| `autocomplete`\
  \ | 指定是否允许浏览器使用自动完成功能 |\n| `enctype` | 指定浏览器提交表单数据时使用的编码方式 |\n| `method` | 指定浏览器应该使用什么传输方法发送数据\
  \ |\n| `name` | 为表单定义一个名称 |\n| `novalidate` | 指定浏览器不应验证数据 |\n| `target` | 指定操作 URL\
  \ 的目标窗口 |\n\n表 3-1 表单元素属性\n\n通常，当你创建一个表单时，不需要担心设置表 3-1 中显示的所有属性；你可以使用标准的默认值。以下是你可能最常用到的属性：\n\
  \n*   `action`：你需要定义将接收并处理表单数据的网页 URL。通常，这是一个包含服务器端程序代码（如 PHP 代码）的页面。\n*   `enctype`：如果你的表单包含二进制数据（如上传文件），你需要设置编码类型，以便服务器知道表单数据中涉及二进制数据。\n\
  *   `method`：你需要定义浏览器如何将数据发送到服务器，使用 HTTP `GET` 方法或 HTTP `PUT` 方法。\n    *   `GET`:HTTP\
  \ `GET` 方法将表单数据作为 URL 的一部分发送到服务器。它将表单字段名和数据值一起嵌入 URL 中。通常，如果你在互联网上填写表单并点击提交按钮，你会看到类似这样的\
  \ URL：\n\n        ```\n        http://myhost.com/index.php?content=store&id=100\n\
  \        ```\n\n        这意味着表单使用 `GET` 方法将两个表单字段传回服务器。因为服务器需要识别每个值，`GET` 方法会将表单字段名与每个值关联：\n\
  \n        ```\n        content=store\n        id=100\n        ```\n\n        这些值表示名为\
  \ `content` 的表单字段被设置为 `store`，名为 `id` 的表单字段被设置为 `100`。\n\n        这种方法是快速向服务器发送一小部分表单数据的很好的方法，但不建议用于较大的表单。对于发送大量数据的表单，最好使用\
  \ HTML `PUT` 方法。\n    *   `PUT`：`PUT` 方法在 HTTP 请求包中在后台发送数据，而不是使用 URL。数据不会显示在浏览器的地址栏中；相反，它作为后台\
  \ HTTP 通信的一部分由客户端浏览器和服务器进行处理。\n\n        ![warning](img/warning.png) 仅仅因为数据不容易被看到，并不意味着它是安全的。通过\
  \ `PUT` 方法发送的数据仍然以明文形式发送在 HTTP 请求消息中。任何拥有网络嗅探器的人仍然可以读取这些数据。发送数据的唯一安全方法是使用加密的 HTTPS\
  \ 会话。\n\n在你定义了表单以及它如何发送表单数据后，你就可以开始添加一些表单字段了。\n\n## 使用表单字段\n\nHTML 的原始版本并没有为我们指定很多表单字段元素。可用的表单字段元素列表见表\
  \ 3-2。\n\n| 字段 | 说明 |\n| --- | --- |\n| `button` | 网页上可点击的区域，用于触发某个操作 |\n| `input`\
  \ | 为单个数据值提供单一接口 |\n| `select` | 下拉列表中的多个对象列表 |\n| `submit` | 浏览器将表单数据发送到操作 URL\
  \ |\n| `textarea` | 用于输入大量文本的较大多行框 |\n\n表 3-2 HTML 基础表单字段元素\n\nHTML5 在列表中又增加了几个表单字段元素：\n\
  \n*   `datalist`：提供一组预定义的选项列表\n*   `keygen`：为身份验证创建公/私钥对\n*   `output`：创建一个显示处理结果的区域\n\
  \n接下来的章节将引导你如何在网页表单中使用这些元素。\n\n## 使用输入字段\n\n`input` 元素是表单字段元素中最功能全的。它提供了几种类型的数据。你通过添加\
  \ `type` 属性来定义输入类型：\n\n```html\n<input type=\"text\">\n```\n\n后续章节将引导你如何使用每一个。\n\
  \n### 文本框\n\n`text` 框是表单的主力。你填写过多少次在线表单？你将 `type` 属性设置为 `text`：\n\n```html\n<input\
  \ type=\"text\" name=\"age\">\n```\n\n`name` 属性定义了一个唯一标识符，允许你获取该值。`size` 属性允许你设置表单字段的大小。默认值为\
  \ `20`。\n\n![tip](img/warning.png) 你可以使用 `value` 属性为表单定义默认值。如果你尝试更新数据库中已经存在的信息，此功能非常有用。\n\
  \n```html\n<input type=\"text\" name=\"age\" value=\"25\">\n```\n\n![tip](img/warning.png)\
  \ `disabled` 属性防止你向字段中输入数据。显示一个你无法输入数据的字段听起来可能奇怪，但当你以后学习如何动态更改输入字段时，它是有意义的。（[14_9781119468387-pp03]）\n\
  \n另一个功能是将多个输入字段组合到一个 `fieldset` 中。`fieldset` 在所包含的表单字段周围创建一个边框区域，帮助在网页中将它们隔离开。使用\
  \ `fieldset` 的格式如下：\n\n```html\n<fieldset>\n  <legend>输入你的姓名</legend>\n  <label>\n\
  \    姓\n    <input type=\"text\" name=\"lastname\">\n  </label>\n  <label>\n   \
  \ 名\n    <input type=\"text\" name=\"firstname\">\n  </label>\n</fieldset>\n```\n\
  \n`legend` 元素允许你定义出现在 fieldset 边框区域的文本。图 3-1 显示了此表单的样子。\n\n![image](img/9781119468387-fg020301.png)\n\
  \n图 3-1： 使用 fieldset 分组表单字段。\n\n`fieldset` 的优点在于你可以为其分配一个 `id` 属性，然后在 CSS3 中对整个组应用特定样式。\n\
  \n### 密码输入\n\n许多网络应用程序要求访问者在表单中输入敏感信息，例如社会安全号码（SSN）。`input` 元素提供了一种简单的方法来隐藏这些信息，防止试图观察访问者输入数据的窥探者。\n\
  \n\n\n\n\n`password` 输入字段类型指示浏览器在网站访问者向文本框输入字符时对其进行屏蔽。以下是创建密码字段的格式：\n\n```\n<input\
  \ type=\"password\" name=\"ssn\">\n```\n\n当您的网站访问者向密码表单字段输入数据时，浏览器会通过显示中性的、无描述的字符来屏蔽这些字符。字符的具体屏蔽显示方式取决于浏览器。大多数浏览器在字段中使用实心圆点。\n\
  \n## 复选框 (Check boxes)\n\n复选框提供了一种简单的“是/否”响应表单字段。`checkbox` 输入类型创建一个网站访问者可以点击的简单方框。复选框字段在每次点击时都会切换状态——从在框中显示勾标记到不显示勾标记。\n\
  \n要定义 `checkbox` 输入类型，请使用以下格式：\n\n```html\n<input type=\"checkbox\" name=\"fishing\"\
  >\n```\n\n`name` 属性定义了在访问者提交表单时传递给操作 URL 的名称。发送的值是一个布尔真/假值——如果复选框被标记，则为 true；如果未标记则为\
  \ false。\n\n由于复选框字段只是一个框，您很可能希望与复选框字段关联一个标签，以便您的网站访问者知道他们选择了什么。复选框通常成组使用，因此您可以使用\
  \ `fieldset` 元素：\n\n```html\n<fieldset>\n<legend>请选择您喜喜欢的运动</legend>\n<label>\n\
  \  棒球\n  <input type=\"checkbox\" name=\"baseball\"><br>\n</label>\n<label>\n  篮球\n\
  \  <input type=\"checkbox\" name=\"basketball\"><br>\n</label>\n<label>\n  足球\n\
  \  <input type=\"checkbox\" name=\"football\"><br>\n</label>\n<label>\n  冰球\n  <input\
  \ type=\"checkbox\" name=\"hockey\"><br>\n</label>\n</fieldset>\n```\n\n[图 3-2]\
  \ 显示了表单在浏览器窗口中的外观。\n\n![image](img/9781119468387-fg020302.png)\n\n[图 3-2：] 在 fieldset\
  \ 中复选框。\n\n您还可以为复选框设置默认状态，但不是通过使用 `value` 属性。相反，您必须使用 `checked` 属性：\n\n```html\n\
  <input type=\"checkbox\" name=\"football\" checked>\n```\n\n`checked` 属性没有关联的值。如果它出现在输入元素中，复选框显示时就会带有一个勾标记。\n\
  \n## 单选按钮 (Radio buttons)\n\n与复选框界面类似的界面是 `单选按钮`。单选按钮允许您在一组选项中仅选择一个。您通过使用 `radio`\
  \ 输入类型创建单选按钮：\n\n```html\n<input type=\"radio\" name=\"sports\">\n```\n\n要将选项分组，您必须为它们分配完全相同的\
  \ `name` 属性。然后浏览器将允许您的网站访问者仅从组中选择一个选项。代码看起来像这样：\n\n```html\n<fieldset>\n<legend>请选择您的运动</legend>\n\
  <label>\n  棒球\n  <input type=\"radio\" name=\"sport\"><br>\n</label>\n<label>\n\
  \  篮球\n  <input type=\"radio\" name=\"sport\"><br>\n</label>\n<label>\n  足球\n  <input\
  \ type=\"radio\" name=\"sport\"><br>\n</label>\n<label>\n  冰球\n  <input type=\"\
  radio\" name=\"sport\"><br>\n</label>\n</fieldset>\n```\n\n[图 3-3] 显示了单选按钮在网页上的显示方式。\n\
  \n![image](img/9781119468387-fg20303.png)\n\n[图 3-3：] 使用单选按钮从组中进行选择。当网站访问者选择每个选项时，之前选中的选项将被重置。表单向服务器返回一个值。如果您想为单选按钮设置默认值，请为该单选按钮添加\
  \ `checked` 属性。\n\n## 隐藏字段 (Hidden fields)\n\n您的应用程序可能需要作为应用程序控制的一部分在后台传递数据。也许它是与网站访问者购买的项目相关的产品\
  \ ID，或者是人力资源部门的员工编号。并不是所有表单提交的数据都需要网站访问者看到。为了适应这一点，HTML 使用了 `hidden` 输入类型：\n\n```html\n\
  <input type=\"hidden\" name=\"productid\" value=\"121\">\n```\n\n隐藏表单字段不会显示在表单本身中，因此您必须使用\
  \ `value` 属性为传递到服务器的表单字段赋值。当网站访问者点击“提交”按钮提交表单数据时，任何定义的隐藏字段将与普通表单字段一起发送。\n\n## 文件上传\
  \ (File upload)\n\n如果您的应用程序要求网站访问者上传文件，您将希望探索 `file` 输入类型。`file` 输入类型产生一个包含两个部分的输入字段：\n\
  \n- 一个显示文件名的文本框\n- 一个启动文件管理器的“浏览”（Browse）按钮\n\n在某些浏览器中，您可以手动在文本框中输入文件名，但许多流行浏览器阻止了这种操作。“浏览”按钮出现在文本框旁边，允许网站访问者搜索要上传的文件。用于搜索的界面取决于浏览器运行运行的操作系统。在\
  \ Windows 工作站上，点击“浏览”按钮会启动文件资源管理器工具。在 macOS 工作站上，点击“浏览”按钮会启动 Finder 工具。[图 3-4] 显示了该字段在网页上的显示方式。\n\
  \n![image](img/9781119468387-fg02304.png)\n\n[图 3-4：] Microsoft Edge 浏览器中所示的文件输入类型界面。文件输入字段的格式为：\n\
  \n```html\n<input type=\"file\" name=\"upload\">\n```\n\n这足够简单了！然而，在使用文件输入字段时，您还需要注意一件事。默认情况下，表单设置\
  \ `enctype` 属性在字符上传之前对其进行编码。很可能您上传的文件将包含二进制数据，对该数据进行编码会损坏它。要解决这个问题，您需要在 `<form>`\
  \ 起始标签中设置 `enctype` 属性以使用 `multipart/form-data` 值：\n\n```html\n<form method=\"POST\"\
  \ action=\"myhost.com/index.php\" enctype=\"multipart/form-data\">\n```\n\n这确保了上传文件中包含的二进制数据以二进制格式上传，但其他表单字段中的数据被正确编码以供上传。\n\
  \n## 按钮 (Buttons)\n\n按钮，按钮，谁有按钮？这只是个无聊的游戏，但按钮是 Web 表单的关键部分。按钮允许您的网站访问者触发网页上的操作，从启动\
  \ JavaScript 程序到向服务器提交表单数据。\n\n三种可用的按钮输入类型：`button`、`reset` 和 `submit`。\n\n### 按钮\
  \ (Button)\n\n`button` 字段类型创建一个触发事件的通用按钮。当访问者点击按钮时，默认什么都不会发生。技巧是使用 `onclick` 属性定义操作：\n\
  \n```html\n<input type=\"button\" name=\"launch\" value=\"点击我\" onclick=\"myprogram()\"\
  >\n```\n\n`value` 属性定义了按钮显示的文本。浏览器会自动调整按钮大小以适应文本。`onclick` 属性定义了点击按钮时运行的 JavaScript\
  \ 函数。\n\n### 重置 (Reset)\n\n`reset` 字段类型将表单数据字段中的任何值重置为原始值——如果没有定义默认值则为空，如果定义了则重置为默认值：\n\
  \n```html\n<input type=\"reset\" name=\"reset\" value=\"重置字段\">\n```\n\n### 提交 (Submit)\n\
  \n`submit` 输入字段类型大多数表单的关键部分。它指示浏览器是时候将表单字段值上传到服务器了：\n\n```html\n<input type=\"submit\"\
  >\n```\n\n默认情况下，按钮显示 *提交* 作为按钮标签。您可以使用 `value` 属性更改按钮文本。通常将提交按钮放在表单底部，但并非强制要求。您可以将提交按钮放在起始\
  \ `<form>` 标签和结束 `</form>` 标签之间的任何位置。\n\n\n\n\n\n## 添加文本区域\n\n文本框（Text boxes）功能非常强大，但它们的能力是有限的。如果你需要输入大量文本，文本框会滚动以便你输入文本，但你会丢失之前输入的文本内容。\n\
  \n`textarea` 元素为输入文本提供了一个更大的界面。要创建一个文本区域，你使用以下开启标签和结束标签：\n\n```html\n<textarea name=\"\
  story\"></textarea>\n```\n\n但是，仅靠这些标签并不能提供你想要的功能。你可能需要使用一些属性来定义文本区域。表 3-3 显示了你可以使用的属性。\n\
  \n| 属性 |  |\n| --- | --- |\n| `cols` | 指定文本区域在网页中的宽度 |\n| `disabled` | 将文本区域设为灰色，使其无法输入\
  \ |\n| `name` | 指定与字段关联的表单字段名称 |\n| `readonly` | 锁定文本区域使其无法输入，但可以显示默认文本 |\n| `rows`\
  \ | 指定文本区域在网页中的高度 |\n\n表 3-3 textarea 属性\n\n所以，为了创建一个宽 20 个字符、高 30 个字符的文本区域，你会使用以下代码：\n\
  \n```html\n<textarea name=\"story\" cols=20 rows=30></textarea>\n```\n\n你的网站访问者可以在文本区域中输入他们的文本。如果他们输入的文本超过\
  \ 30 行，浏览器会在文本区域的右侧添加滚动条，并允许他们继续输入。\n\n![tip](img/tip.png) 你会发现，在我的文本区域示例中，`textarea`\
  \ 开启标签和结束标签之间没有任何内容。这将产生一个空文本区域。你任何放置在开启和结束标签之间的文本都将作为文本区域中的默认文本显示。\n\n## 使用下拉列表\n\
  \n你通常想要限制网站访问者对特定数据字段的选择。为了实现这一点，你可以使用下拉列表。下拉列表在表单中以单行形式出现，类似于文本框，但带有一个向下箭头。如果你点击向下箭头，会弹出一个框，其中包含所有可用选项。然后，你可以从下拉列表中选择一个或多个选项。\n\
  \n在 HTML5 世界中，这种功能被称为 `select` 元素。`select` 元素由两部分组成：\n\n* 用于定义 select 元素的 `select`\
  \ 开启和结束标签\n* 一个或多个 `option` 元素，用于定义允许的选项\n\n这里是一个简单的 `select` 元素示例（参见图 3-5）：\n\n\
  ```html\n<select name=\"sports\">\n<option value=\"baseball\">Baseball</option>\n\
  <option value=\"basketball\">Basketball</option>\n<option value=\"football\">Football</option>\n\
  <option value=\"hockey\">Hockey</option>\n</select>\n```\n\n![image](img/9781119468387-fg020305.png)\n\
  \n图 3-5: 使用 `select` 元素。\n\n通过这种格式，浏览器会显示一个文本框和一个向下的箭头，指示有一个可以选择的下拉列表。当你点击箭头时，就能看到列表。\n\
  \n如果你希望在网页上显示更多选项而不仅仅是一个，请在 `<select>` 标签中设置 `size` 属性：\n\n```html\n<select name=\"\
  sports\" size=\"4\">\n```\n\n这创建了一个可以滚动的选项列表，如图 3-6。\n\n![image](img/9781119468387-fg020306.png)\n\
  \n图 3-6: 在 select 元素中显示多个选项。\n\n每个 `option` 元素定义选择列表中的一个项目。浏览器显示开启 `<option>` 和结束\
  \ `</option>` 标签之间的文本，但它会将网站访问者所选项的 `value` 属性发送到服务器。如果你想在数据中使用缩写或代码，但希望向网站访问者显示完整文本，这种方法会非常有用。\n\
  \n![tip](img/tip.png) 默认情况下，select 元素只允许访问者选择一个值。你可以通过在 `<select>` 开启标签中设置 `multiple`\
  \ 属性来更改这一行为。\n\n## 增强 HTML5 表单\n\n原始的 HTML 标准在表单字段选项上非常简陋。如今，网页开发人员从表单中收集各种类型的信息。为了帮助实现，HTML5\
  \ 标准提供了新的输入元素。\n\n### 数据列表\n\n`datalist` 元素允许为 `<input>` 元素提供一组预定义的选项。用户可以输入值，也可以点击箭头从列表中选择。\n\
  \n`datalist` 需要三个部分：\n* 一个带有 `list` 属性的 `<input>` 元素，该属性需匹配 `datalist` 的 `id`\n\
  * 具有匹配 `id` 的 `<datalist>` 元素\n* 一个或多个定义可能值的 `option` 元素\n\n这是一个示例：\n\n```html\n\
  <input list=\"browsers\" name=\"browser\">\n<datalist id=\"browsers\">\n  <option\
  \ value=\"Firefox\">\n  <option value=\"Chrome\">\n  <option value=\"Edge\">\n</datalist>\n\
  ```\n\n### 其他输入字段\n\nHTML5 标准中令人兴奋的功能之一是对 `<input>` 标签的扩展。HTML5 定义了多种输入类型：\n\n*\
  \ `color`: 为网站访问者提供调色板以选择颜色。返回颜色相关的 RGB 值。\n* `date`: 生成一个图形日历以选择日期。返回选定的年、月、日值。\n\
  * `datetime`: 生成一个图形日历以选择日期，以及一个文本框以选择时间。返回选定的年、月、日、小时、分、秒和秒分数值。\n* `datetime-local`:\
  \ 生成与 `datetime` 输入类型相同的表单字段，但不返回时区。\n* `email`: 用于输入单个电子邮件地址或逗号分隔的电子邮件地址列表。\n*\
  \ `month`: 生成一个图形日历以选择年份和月份。\n* `number`: 生成一个调节器，用于增加或减少文本框中的数值。返回选定的数值。\n* `range`:\
  \ 生成一个滑块以在范围内选择值。你使用标签中的 `min` 和 `max` 属性来定义该范围。\n* `search`: 生成一个某些浏览器会化为搜索框的文本框。\n\
  * `tel`: 生成一个用于输入电话号码的标准文本框。\n* `time`: 生成一个显示两个数值的计时选择器，并带有一个调节器。以时间格式返回选定的值。\n\
  * `url`: 生成一个用于输入文本 URL 的文本框。\n\n\n\n\n\n*   `week`: 生成一个图形化日历以为指定的年份选择周数。返回所选的年份和周数。\n\
  \n这些可以在你的网页中生成一些非常惊人的输入字段！唯一的缺点是不同的浏览器可能使用不同的方法来生成这些表单字段。让我们通过一个示例创建一个测试程序，这样你就可以看到浏览器是如何处理新输入字段的：\n\
  \n1.  **打开你喜欢的文本编辑器、程序编辑器或集成开发环境 (IDE) 包。**\n2.  **输入以下代码：**\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<title>HTML5 Input Types Test</title>\n</head>\n<body>\n\
  <h1>Testing the HTML5 Input Types</h1>\n<fieldset>\n<legend>HTML5 Input Fields</legend>\n\
  <label>\n  Color Selector\n  <input type=\"color\" name=\"colortest\">\n</label><br>\n\
  <label>\n  Date Selector\n  <input type=\"date\" name=\"datetest\">\n</label><br>\n\
  <label>\n  DateTime Selector\n  <input type=\"datetime\" name=\"datetimetest\">\n\
  </label><br>\n<label>\n  DateTime-Local Selector\n  <input type=\"datetime-local\"\
  \ name=\"datetimelocaltest\">\n</label><br>\n<label>\n  Email Selector\n  <input\
  \ type=\"email\" name=\"emailtest\">\n</label><br>\n<label>\n  Month Selector\n\
  \  <input type=\"month\" name=\"monthtest\">\n</label><br>\n<label>\n  Number Selector\n\
  \  <input type=\"number\" name=\"numbertest\">\n</label><br>\n<label>\n  Range Selector\n\
  \  <input type=\"range\" min=0 max=100 name=\"rangetest\">\n</label><br>\n<label>\n\
  \  Search Selector\n  <input type=\"search\" name=\"searchtest\">\n</label><br>\n\
  <label>\n  Telephone Selector\n  <input type=\"tel\" name=\"teltest\">\n</label><br>\n\
  <label>\n  Time Selector\n  <input type=\"time\" name=\"timetest\">\n</label><br>\n\
  <label>\n  URL Selector\n  <input type=\"url\" name=\"urltest\">\n</label><br>\n\
  <label>\n  Week Selector\n  <input type=\"week\" name=\"weektest\">\n</label>\n\
  </body>\n</html>\n```\n\n3.  **将文件保存为** `inputtypestest.html` **并存于你 Web 服务器的**\
  \ `DocumentRoot` **文件夹中（例如 Windows 上 XAMPP 的 `c:\\xampp\\htdocs`，或 macOS 上 XAMPP\
  \ 的 `/Application/XAMPP/htdocs`）。**\n4.  **启动你的 Web 服务器。**\n5.  **打开浏览器并输入以下 URL：**\n\
  \n    `http://localhost:8080/inputtypestest.html`\n6.  **关闭浏览器窗口并关闭 Web 服务器。**\n\
  \n`inputtypestest.html` 文件是查看不同浏览器中新 HTML5 输入类型外观的极佳方法。图 3-8 显示了它们在 Google Chrome\
  \ 浏览器中的外观。\n\n![image](img/9781119468387-fg020308.png)\n\nFIGURE 3-8: 在 Google Chrome\
  \ 浏览器中查看 `inputtypestest.html` 输出。\n\n![tip](img/tip.png) 如果你手头移动设备，尝试在移动设备上测试 `inputtypestest.html`\
  \ 网页。移动设备在点击输入表单字段时会显示在屏幕上的虚拟键盘。大多数移动设备会根据你点击的输入表单字段类型来定制键盘。例如，在 `tel` 输入类型中，移动设备可能只显示数字键盘用于输入电话号码；对于\
  \ `email` 输入类型，移动设备可能会显示一个带有 .com 按钮的键盘。\n\n## 使用 HTML5 数据验证\n\n接受来自未知访客的数据是一件危险的事。然而，动态\
  \ Web 应用必须有用户交互才能运行。难点在于如何兼顾两者。\n\n一种方法是使用 `data validation`（数据验证），即验证网站访问者输入表单字段的数据是否正确的过程。处理该过程有两种方式：\n\
  \n*   在服务器端，使用服务器端编程代码\n*   在客户端浏览器中，使用 HTML、CSS 和 JavaScript\n\n在第 4 本的第 4 章 中，我涵盖了使用服务器端编程验证表单数据的所有方面。然而，等待浏览器将数据上传到服务器可能会非常麻烦。客户端验证可以为用户提供即时反馈。\n\
  \n### 验证数据\n\nHTML5 输入类型不仅产生不同的输入字段，你还可以利用它们来验证数据。CSS 提供了 `invalid` 和 `valid` 伪类状态来对带有无效数据的字段进行不同的样式设置。这里有一个你可以尝试的示例：\n\
  \n1.  **打开你喜欢的文本编辑器或 IDE。**\n2.  **输入以下代码：**\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<title>Testing for Invalid Data</title>\n<style>\ninput:invalid {\n  background-color:\
  \ red;\n}\ninput:valid {\n  background-color: lightgreen;\n}\n</style>\n</head>\n\
  <body>\n<h1>Testing for invalid data</h1>\n<fieldset>\n<legend>You must be over\
  \ 18 to participate</legend>\n<label>\n  Age:\n  <input type=\"number\" name=\"\
  age\" min=\"18\">\n</label>\n</fieldset>\n</body>\n</html>\n```\n\n3.  **将文件保存为**\
  \ `invaliddatatest.html` **并存于你的 `DocumentRoot` 文件夹中。**\n4.  **启动你的 Web 服务器。**\n\
  5.  **打开浏览器并输入 URL：**\n\n    `http://localhost:8080/invaliddatatest.html`\n6.  **关闭浏览器并停止\
  \ Web 服务器。**\n\n当 `invaliddatatest.html` 表单首次时，年龄数据字段将为空并显示绿色。如果你使用文本框右侧的计数器，数字将从\
  \ 18 开始，文本框将保持绿色。然而，如果你尝试手动输入小于 18 的年龄，文本框会立即变为红色。\n\n\n\n\n\n# 第 4 章\n\n# 高级 CSS3\n\
  \n## 本章内容\n\n![check](img/check.png) **圆角**\n\n![check](img/check.png) **使用边框图像**\n\
  \n![check](img/check.png) **探索新颜色**\n\n![check](img/check.png) **使用渐变**\n\n![check](img/check.png)\
  \ **阴影中的潜伏**\n\n![check](img/check.png) **字体运用**\n\n![check](img/check.png) **响应媒体查询**\n\
  \n前两个章节向你展示了如何结合 HTML5 和 CSS 为你的网页创建内容并进行样式设置。CSS3 提供了一些更高级的功能，允许你为网页进行更丰富的样式设计。本章将带你了解\
  \ CSS3 中一些更令人兴奋的功能，你可以利用这些功能来让你的网站更加丰富。\n\n## 圆角处理\n\n在第二本书的第 3 章中，我解释了如何使用 HTML5\
  \ 构建在线表单。然而，默认情况下，即使添加了一些 CSS 样式，HTML 表单仍然显得有些单调。\n\n浏览器在显示表单中的文本框、按钮和文本区域时使用的默认样式产生的只是正方框，这非常无趣。原始的\
  \ CSS 标准并没有解决这个问题采取任何措施，除了可能给正方框添加一些颜色。立体主义可能对某些风格的绘画很有效果，但这种布局在表单中并不适用，并且会让你的网站访问者感到无味。\n\
  \n浏览器世界一直被热求的功能之一就是为表单元素使用圆角。仅仅将正方框稍微圆化一点就能让表单变得生动。许多浏览器曾独立于 CSS 标准，自行添加了圆角功能。遗憾的是，正如你可能猜到的那样，不同的浏览器使用了不同的方法来实现圆角。尝试编写一种适用于所有浏览器的样式变得既困难又困惑。但由于使用圆角变得非常流行，该功能最终作为标准被添加到\
  \ CSS3 中。\n\n新的 `border-radius` 样式属性允许你圆化网页上元素的尖锐边缘。它通过允许你定义用于创建圆角的虚拟圆的半径来实现的。你可以通过使用较小的半径值来削减一点边缘，也可以通过使用较大的半径值完全圆化四个角来创建一个完整的椭圆。图\
  \ 4-1 显示了将 `border-radius` 属性应用于几个表单元素的示例。\n\n![image](img/9781119466387-fg020401.png)\n\
  \n[图 4-1：]](#12_9781119468387-bk02ch04.xhtml_rc07-fig-0001) 使用 `border-radius` 属性创建圆角。\n\
  \n注意，输入文本框、文本区域甚至提交按钮都是圆角的，而不是标准的正方形。这使得网页表单的外观发生了很大变化。\n\n然而，`border-radius` 属性可能会让人困惑的是，它有四种不同的使用格式——带有一个、两个、三个或四个参数。以下单参数将所有四个角的半径设置为\
  \ 10 像素：\n\n```\nborder-radius: 10px;\n```\n\n以下两个参数将左上角和右下角的半径设置为 10 像素，但右上角和左下角设置为\
  \ 5 像素：\n\n```\nborder-radius: 10px 5px;\n```\n\n以下三个参数将左上角的半径设置为 10 像素，右上角和左下角设置为\
  \ 5 像素，右下角设置为 3 像素：\n\n```\nborder-radius: 10px 5px 3px;\n```\n\n以下四个参数将左上角的半径设置为\
  \ 10 像素，右上角设置为 5 像素，右下角设置为 3 像素，左下角设置为 1 像素：\n\n```\nborder-radius: 10px 5px 3px\
  \ 1px;\n```\n\n当你能够设置每个单独角或成对角的半径值时，你可以创建许多不同的特殊效果，例如对话气泡或椭圆。\n\n你还可以通过几个额外的属性独立地设置各个角的半径值：\n\
  \n* `border-top-left-radius`\n* `border-top-right-radius`\n* `border-bottom-left-radius`\n\
  * `border-bottom-right-radius`\n\n每一个属性都设置元素中相应的边框半径值。\n\n`border-radius` 属性都使用大小值来设置角的圆角的半径。你可以使用任何标准的\
  \ CSS 尺寸单位测量，如英寸、像素或 em 单位来指定尺寸。\n\n## 使用边框图像\n\nHTML5 在对象周围放置的默认边框线非常平淡。那么在对象周围添加一些精细的边框如何？得益于\
  \ CSS3 添加的另一个有趣功能，你可以做到。它提供了使用图像作为元素周围的边框而不仅仅是一条线。此功能允许你使用任何类型的图像为你的元素创建装饰性边。\n\n\
  你通过添加 `border-image` 属性为元素应用边框图像：\n\n```\nborder-image: url(file)\n```\n\n`url()`\
  \ 函数定义了图像的路径。`slice` 值定义了使用多少。这部分可能会变得复杂，如图 4-2 所示。九部分包括：\n\n* 四个角（上、右、下、左）\n* 四条边（上、右、下、左）\n\
  * 中间部分\n\n![image](img/9781119466387-fg02002.png)\n\n对于 `slice` 值，你指定用于边的图像切尺寸。你可以选择将\
  \ `slice` 设置为一个、两个或四个值：\n\n* **一个值**：为四个角和四条边裁剪相同尺寸的图像\n* **两个值**：顶部和底部一个尺寸，左侧和右侧另一个尺寸\n\
  * **四个值**：上、右、下、左各一个尺寸\n\n`repeat` 参数定义了浏览器如何让图像适应边。有四种方法：\n\n* `repeat`：重复图像以填充整个边。\n\
  * `round`：重复图像，但如果图像不能整数倍填充区域，则缩放图像以适应。\n* `space`：重复图像，但如果图像不能整数倍填充区域，则在图像之间添加空格以适应。\n\
  * `stretch`：拉伸图像以填充边。\n\n例如，为了定义一个使用 10 像素切片来自侧面并将其拉伸以适应边框区域边框图像，你可以使用：\n\n```\n\
  border-image: url(\"myimage.jpg\") 10 stretch;\n```\n\n注意，`slice` 值不使用单位。如果你将值指定为整个图像的百分比，请添加百分号，但如果是像素，则省略\
  \ `px`。\n\n与其使用一个属性语句来实现所有功能，如果你更喜欢，可以将这些值定义在独立的属性中。有五个独立的属性用于定义边框图像以及浏览器如何使用它（参见表\
  \ 4-1）。\n\n| 属性 | 描述 |\n| --- | --- |\n| `border-image-outset` | 指定图像超出正常边框区域的范围\
  \ |\n| `border-image-repeat` | 指定图像如何扩展以适应整个边框区域 |\n\n\n\n\n\n| `border-image-slice`\
  \ | 指定使用图像的哪个部分作为边框 |\n| `border-image-source` | 指定用于边框的图像路径 |\n| `border-image-width`\
  \ | 指定边框图像各边的宽度 |\n\n表格 4-1 CSS4 边框属性\n\n图 4-3 显示了元素周围边框图像的样子。这比标准的边框线好得多。\n\n![image](img/9781119468387-fg020403.png)\n\
  \n图 4-3: 在元素周围使用边框图像。\n\n![tip](img/tip.png) Mozilla 基金开发者的网站包含了一个实用的边框图像生成工具：[`https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Background_and_Borders/Border-image_generator`](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Background_and_Borders/Border-image_generator)。通过此工具，你可以上传一张图像或使用他们的标准图像，该工具会自动生成提取边框图像属性所需的\
  \ CSS3 代码。\n\n## 查看 CSS3 颜色\n\n在第二本书的第 2 章中，我为你展示了原始 CSS 标准定义的为网页设置颜色的三种格式：\n\n\
  *   使用颜色名称\n*   使用 RGB 十六进制值\n*   使用带有十进制值的 `rgb()` 函数\n\nCSS3 标准通过增加色相、饱和度和亮度（HSL）方法，扩展了你定义颜色时的可用选项。HSL\
  \ 定义颜色的方法使用三个值：\n\n*   **色相 (Hue):** 色轮上的颜色角度。色轮的概念自 19 世纪初以来就一直存在于艺术界。它将颜色放置在一个圆周围，原色——红、黄、蓝——分别位于轮上的\
  \ 0 度、60 度和 240 度。间色——橙、绿、紫——放置在原色之间，根据它们的色调分别放置在 30 度、120 度和 260 度的位置。从那里开始，不同深色的颜色组合被恰当地地排列在色轮上。要指定特定的色相，你必须知道它在色轮上的位置。幸运的是，网上有许多图表可以提供帮助。\n\
  *   **饱和度 (Saturation):** 使用颜色的百分比。饱和度值是一个百分比，指定颜色的灰度程度，从 0%（无色，全灰）到 100%（完全色彩饱和）。\n\
  *   **亮度 (Lightness):** 添加到颜色中的亮度百分比。亮度值是一个百分比，指定颜色应该有多暗（0%）或多亮（100%）。50% 的值创建出正常深度的颜色。较大的百分比创建出更深的颜色调，而较小的百分比创建出更浅的颜色调。\n\
  \n要使用 HSL 方法指定颜色，请使用 `hsl()` 格式。例如，以下属性指定了色轮上 0 位置的红色，显示为 100% 的饱和度和 50% 的亮度：\n\n\
  ```\ncolor: hsl(0, 100%, 50%);\n```\n\nCSS3 标准还为 HSL 添加了不度功能，创建了 `HSLA 颜色方法`。通过\
  \ HSLA，你添加了第四个参数来指定颜色的透明度，从 0 到 1。下面的示例使用了红色，但透明度为 50%：\n\n```\ncolor: hsla(0, 100%,\
  \ 50%, 0.5)\n```\n\n![tip](img/tip.png) 使用 HSL 值的美之处在于当你为网站选择配色方案时。如果你想为网站方案使用单一颜色，可以修改饱和度和亮度级别来制作颜色的不同深浅。如果你想创建一个双色方案，你可能想选择相隔\
  \ 180 度的色相——这些被认为是互补色。对于三色方案，相隔 120 度的色相形成三原色。在四色方案中，选择相隔 90 度的色相以创建一个很好的偏移。通过遵循色轮规则，几乎任何人都可以为网站创建有品味的配色方案。\n\
  \n## 玩转颜色渐变\n\n虽然使用单个颜色是活跃网站活力的好方法，但当你一直使用它们时，即使是颜色也会变得有些无聊。为了让事情更有趣，CSS3 标准在其中加入了颜色渐变。`color\
  \ gradient`（颜色渐变）缓慢从一种颜色过渡到第二种颜色，产生一种温暖的过渡效果。这些过渡颜色通常用于背景，创建一种效果，帮助网站访问者在颜色渐变变为另一种颜色时关注内容。\n\
  \nCSS3 标准中定义了两种类型的颜色渐变：\n\n*   **线性渐变 (Linear gradients):** 使用渐变方式从一种颜色过渡到另一种颜色\n\
  *   **径向渐变 (Radial gradients):** 从中心点向外散发\n\n本节将讨论如何在网页页中使用每种方法。\n\n### 线性渐变\n\n\
  线性渐变以线性方式在两种颜色之间渐变，即从左到右或从上到下。使用 `linear-gradient()` 函数定义渐变的方向和颜色：\n\n```\nlinear-gradient(direction,\
  \ color1, color2)\n```\n\n`direction` 参数定义了渐变的方向。如果你省略方向，浏览器将从上到下创建渐变。如果你想改变方向，可以通过以下方式指定：\n\
  \n```\nlinear-gradient(to right, black, white)\n```\n\n这种从左侧黑色渐变到白色，如图 4-4 所示。\n\
  \n![image](img/9781119468387-fg020403.png)\n\n图 4-4: 从左到右的颜色渐变。\n\n要使用线性渐变，只需在任何使用颜色值的地方添加它即可：\n\
  \n```\nbackground: linear-gradient(red, orange);\n```\n\n线性渐变可以为背景创建非常惊艳的效果。如果你想更花哨一点，可以在\
  \ `linear-gradient()` 列表中指定更多颜色作为中间点：\n\n```\nbackground: linear-gradient(red, orange,\
  \ yellow);\n```\n\n这采取了从红色到橙色、最后到黄色目的地的颜色过渡。\n\n### 径向渐变\n\n`radial-gradient()`\
  \ 与线性渐变的功能相同，但它是从中心点向外散发的圆形图案。如果你对染织 T 恤流行的时代充满回忆，你可能会喜欢径向渐变！\n\n这里是 `radial-gradient()`\
  \ 函数的格式：\n\n```\nradial-gradient(shape, size, color1, color2, …)\n```\n\n创建径向渐变的关键是定义渐变形状的\
  \ `shape` 参数和 `size` 参数。默认情况下径向渐变被绘制为椭圆，但你可以指定为圆形。`size` 决定径向渐变停止的位置。通常是一个位置，如 `closest-corner`、`closest-side`、`farthest-corner`\
  \ 或 `farthest-side`。\n\n你还需要定义两种或多种颜色来创建渐变效果。定义径向渐变的最简单方法就是定义颜色：\n\n```\nbackground:\
  \ radial-gradient(red, orange, yellow);\n```\n\n这创建了一个位于元素中心的椭圆径向渐变，向最远的角落散发。\n\n\
  ## 添加阴影\n\nCSS3 添加的另一个酷功能是可以在网页上为元素创建阴影。阴影允许你产生光光线照在网页上的效果。你可以在文本和框元素后面放置阴影。\n\n\
  \n\n\n\n### 文字阴影\n\n在网页上的文字后面添加阴影可以产生引人注目的效果，吸引读者关注标题。图 4-5 显示了文字阴影效果如何让标题在网页上颖而出。\n\
  \n![image](img/9781119468387-fg020405.png)\n\n图 4-5： 为标题元素添加文字阴影效果。\n\nCSS3 的 `text-shadow`样式属性允许你定义阴影的外观。以下是\
  \ `text-shadow`样式属性的格式：\n\n`text-shadow: color offsetx offsety blur;`\n\n`color`\
  \ 参数定义阴影使用的颜色。`offsetx` 和 `offsety` 参数定义阴影离文字的距离。你可以使用正值或负值来表示偏移量。正值将阴影向文字的右下方移动。负值则将阴影向文字的左上方移动。`blur`\
  \ 参数定义阴影占据的空间大小。空间越大，阴影看起来越拉伸。\n\n这里有一个为所有 `h1` 元素设置阴影的 CSS3 示例：\n\n```css\nh1 {\n\
  \  text-shadow: black, 10px, 5px, 15px;\n}\n```\n\n这会在文字右侧和下方产生黑色阴影。\n\n你可以对文字元素应用多个阴影。只需在同一行\
  \ `text-shadow` 中列出不同的阴影定义，并用逗号隔开即可：\n\n`text-shadow: shadow1, shadow2, ...;`\n\n\
  浏览器按照你定义的顺序显示阴影，每个阴影都放置在之前阴影之上。\n\n### 盒子阴影\n\n盒子阴影有助于元素在网页上以近乎 3-D 的效果脱颖而出。盒子阴影的工作原理与文字阴影相同，但你将其应用于盒模型元素，例如单个表单输入字段、文本区域，甚至是整个\
  \ div 块。图 4-6 显示了在网页的 div 部分上应用简单盒子阴影的示例。\n\n![image](img/9781119468387-fg020406.png)\n\
  \n图 4-6： 在 div 元素上盒子阴影。\n\n`box-shadow`属性的格式与 `text-shadow`属性相似，但增加了一些内容：\n\n`box-shadow:\
  \ [inset] color offsetx offsety blur [spread];`\n\n`inset`关键字是可选的。它决定浏览器应该将阴影显示在元素内部。默认情况下，阴影的大小与对象相同；通过添加\
  \ `spread` 值，你可以增大或缩小阴影的大小。\n\n### 创建字体\n\n在本教程书的第 2 章中，我提到了网页字体的问题。在过去，浏览器只能使用工作站上已经安装的字体。要在所有工作站上找到可用的字体是一项挑战。\n\
  \nCSS3 标准试图解决这一局面，为 Web 设计师提供了一种创建自己的字体并将其作为网页下载内容的一部分传递给网站访问者的方法。`@font-face`规则提供了一种方法，用于指定客户端浏览器必须作为样式定义的一部分下载的字体文件。当浏览器下载字体文件时，你的网络应用程序可以使用该字体为网页中的文字设置样式。这些字体被称为`web\
  \ fonts`（网络字体）。接下来的章节描述了不同类型的网络字体以及如何在你的网络应用程序中使用它们。\n\n### 关注字体文件\n\n使用网络字体的关键能够在文件中定义一种字体，每个网站访问者的浏览器都可以下载并使用。`font\
  \ files`包含了关于工作站应如何显示单个字符和符号的详细信息。\n\n然而，字体文件的问题在于，多年年来出现了许多不同的字体文件格式。表 4-2 显示了你可能会遇到的流行字体文件格式。\n\
  \n| 字体 | 说明 |\n| --- | --- |\n| TrueType | 由微软和苹果在 20 世纪 80 代创建的字体。这种字体类型仍被这两个操作系统共同使用。\
  \ |\n| OpenType | 由微软创建，并旨在扩展 TrueType 字体。这是最常用的字体类型。 |\n| Embedded OpenType | 微软创建的字体格式，仅供\
  \ Internet Explorer 浏览器使用。 |\n| Scalable Vector (SVG) | 主要用于图形 |\n| Web Open Font\
  \ (WOFF) | 由 W3C 创建的字体格式 |\n\n字体格式\n\n![warning](img/warning.png) TrueType 和 WOFF\
  \ 是浏览器支持的两种字体。然而，请注意许可限制。\n\n### 使用网络字体\n\n`@font-face`规则以符号（`@`）开头，并应该放在样式表的开头。`@font-face`的格式如下：\n\
  \n```css\n@font-face {\n  font-family: name;\n  src: url(location);\n}\n```\n\n\
  在这两个属性之后，你可以添加描述符，指示在何时使用该字体（例如用于粗体文本或斜体）。一个定义网络字体的示例如下：\n\n```css\n@font-face {\n\
  \  font-family: myfont;\n  src: url(myfont.woff);\n}\n```\n\n要在你的网页中使用新字体，只需在样式规则中定义\
  \ `font-family` 名称即可：\n\n```css\ndiv {\n  font-family: myfont;\n}\n```\n\n### 媒体查询\n\
  \n\n\n\n\nCSS2 标准定义了 `@media` CSS 命令，帮助你检测网页正在何种类型的设备上显示。你可以根据媒体类型创建样式。这允许你在网站访问者在显示器屏幕上查看时使用一种样式，而在访问者打印网页时使用另一种样式。\n\
  \nCSS2 标准在 `@media` 规则中定义了若干种不同的媒体类型，如表 4-3 所示。\n\n| 类型 | 描述 |\n| --- | --- |\n\
  | all | 所有类型的输出设备 |\n| braille | 产生盲文的设备 |\n| embossed | 凸打印机 |\n| handheld | 带有小屏幕的移动设备\
  \ |\n| print | 打印机 |\n| projection | 大屏幕投影仪 |\n| screen | 标准电脑显示器 |\n| speech |\
  \ 文本转语音读器 |\n| tty | 电打字终端 |\n| tv | 电视 |\n\n表 4-3 CSS2 @media 类型\n\n你在标准样式表中使用\
  \ `@media` 命令来定义用于特定设备类型的样式：\n\n```css\n@media screen {\nbody {\n  font-family:\
  \ sans-serif;\n  font-size: 12pt;\n}\nh1 {\n  font-family: sans-serif;\n  font-size:\
  \ 20pt;\n}\n}\n@media print {\nbody {\n  font-family: serif;\n  font-size: 10pt;\n\
  }\nh1 {\n  font-family: serif;\n  font-size: 18pt;\n}\n}\n```\n\n这两个 `@media` 命令定义了两组样式规则——一组用于网页出现在显示器上，另一组用于网页打印时。由浏览器决定哪种情况决定使用哪一组\
  \ `@media` 命令。\n\n### 处理 CSS3 媒体查询\n\nCSS2 的 `@media` 命令在帮助你确定网站访问者使用什么类型的设备显示你的\
  \ Web 方面迈出了重要一步，但还不够。例如，无论你的网站访问者是在大显示器还是小移动设备上查看你的 Web 应用，`@media` 命令都会将该设备评估为\
  \ `screen` 媒体类型。\n\nCSS3 标准通过在标准 `@media` 命令中添加*媒体查询*（media queries）解决了解决这个问题。媒体查询允许你查询客户端浏览器以及浏览器运行运行的设备所支持的功能。你可以将媒体查询添加到标准的\
  \ `@media` 命令中，为几乎任何类型的情况产生自定义的规则集。\n\n以下是媒体查询的格式：\n\n`@media type and feature`\n\
  \n`type` 参数定义了媒体类型，类似于 CSS2 的媒体类型，但现在将其限制为仅四种（`all`、`print`、`screen` 和 `speech`）。`feature`\
  \ 参数定义了可查询的新特性。可用的 CSS3 媒体特性如表 4-4 所示。\n\n| 特性 | 描述 |\n| --- | --- |\n| `any-hover`\
  \ | 设备是否支持将指针悬停在元素上 |\n| `any-pointer` | 设备是否支持指针设备 |\n| `aspect-ratio` | 设备的宽高比\
  \ |\n| `color` | 视设备支持的色彩比特数 |\n| `color-index` | 设备可以显示的颜色数量 |\n| `grid` | 设备是否支持网格或位图\
  \ |\n| `height` | 设备可视区域的高度 |\n| `hover` | 设备是否支持将指针悬停在元素上 |\n| `inverted-colors`\
  \ | 浏览器是否具有反转色彩的能力 |\n| `light-level` | 当前的环境光照水平 |\n| `max-aspect-ratio` | 可视区域宽度和高度之间的最大比例\
  \ |\n| `max-color` | 可视区域支持的最大色彩比特数 |\n| `max-color-index` | 设备支持的最大颜色数量 |\n| `max-device-aspect-ratio`\
  \ | 设备宽度和高度之间的最大比例 |\n| `max-device-height` | 设备的最大高度 |\n| `max-device-width` |\
  \ 设备的最大宽度 |\n| `max-height` | 设备可视区域的最大高度 |\n| `max-monochrome` | 单色设置下的最大比特数 |\n\
  | `max-resolution` | 设备的最大分辨率 |\n| `max-width` | 设备的最大宽度 |\n| `min-aspect-ratio`\
  \ | 可视区域宽度和高度之间的最小比例 |\n| `min-color` | 可视区域支持的最小色彩比特数 |\n| `min-color-index` |\
  \ 设备支持的最小颜色数量 |\n| `min-device-aspect-ratio` | 设备宽度和高度之间的最小比例 |\n| `min-device-height`\
  \ | 设备的最大高度 |\n| `min-device-width` | 设备的最大宽度 |\n\n\n\n\n在网页上最基础的多媒体类型是图片。“一画胜于千言”这句话在某种程度上是正确的，尤其是在网络世界中。在你的网页上放置图像可以打破纯文本的单调，并以一种具有吸引力的方式丰富你的内容。通常，新网站访问者首先注意到的往往就是图像。\n\
  \nHTML 标准一直支持在网页中放置图像，但你可以尝试使用 HTML5 和 CSS3 的一些新技巧来让你的图像脱颖而出。本节将展示如何实现这一点。\n\n##\
  \ 放置图像\n\n`img element` 允许你在网页上放置图像文件。`img element` 使用单边标签 `<img>`，它通过属性来定义图像以及浏览器应该如何显示它。\n\
  \n以下是 `<img>` 标签的基本格式：\n\n`<img src=\"location\" alt=\"text\" width=\"x\" height=\"\
  y\">`\n\n`src` 属性定义了显示的图像文件的位置。对于存储在网页相同服务器上的图像，你可以将位置指定为相对或绝对文件路径；也可以使用 URL 引用存储在另一个服务器上的图像。\n\
  \n`alt` 属性定义了浏览器无法显示图像时显示的替代文本，例如：如果图像文件丢失、浏览器不支持显示图像（如基于文本的浏览器）、你的网站访问者使用屏幕阅读器，或者你的网站正在被搜索引擎读取。对于你所有的图像，建议不仅对图像本身，还对图像中发生的任何动作提供良好的描述。你可以在替代文本属性中进行这一操作。\n\
  \n默认情况下，浏览器会在浏览器窗口中按全尺寸显示图像。这可能并不总是你想要的，或者你可能只是对图像出现的方式或位置有更多控制需求。为了帮助控制这一点，你可以使用\
  \ `width` 和 `height` 属性来定义图像以适应的特定视图区域。\n\n或者，与其使用 `width` 和 `height` 属性，你可以使用 `style`\
  \ 属性并将 `width` 和 `height` 定义为样式属性：\n\n`<img src=\"myimage.jpg\" alt=\"My image\"\
  \ style=\"width:x; height:y;\">`\n\nHTML5 允许这两种方法，尽管使用内联样式有助于防止外部样式表对图像进行意外样式化。\n\
  \n![warning](img/warning.png) 如今浏览器能够显示大多数图像类型，但某些图像类型比其他类型更适合网页。JPEG 图像类型在网页上常用，因为它将图像压缩为较小的文件大小，使其更快地下载到客户端浏览器。使用过大的图像文件可能会破坏某些网站访问者的体验，特别是那些使用移动数据连接的用户。没有人喜欢在网页上等待图像加载。\n\
  \n## 图像的样式化\n\nCSS3 标准定义了一些额外的样式，你可以将其应用于网页上的图像，以使其更加引醒目。在第 2 本的第 4 章 中，我演示了如何对元素使用\
  \ CSS 阴影效果来帮助它们产生 3D 效果。你也可以对网页上的图像使用该效果。这能增添美感，使图像从网页中脱颖出来。\n\nCSS3 标准添加的另一个实用样式是\
  \ `transform` 属性。`transform` 属性允许你更改图像在网页上的显示方式，例如缩放、旋转甚至倾斜它！针对图像的 2D 和 3D 操作都有相应的函数。表\
  \ 5-1 列出了可用的 2D 转换效果。\n\n| 效果 |  |\n| :--- | :--- |\n| `matrix(a,b,c,d,e,f)` | 在一个属性中组合平移、缩放和旋转效果\
  \ |\n| `rotate(angle)` | 按指定的角度顺时针旋转对象 |\n| `scale(x,y)` | 按水平 `x` 倍和垂直 `y` 倍的因子缩放对象大小\
  \ |\n| `scaleX(x)` | 仅按 `x` 倍水平缩放对象大小 |\n| `scaleY(y)` | 仅按 `y` 倍垂直缩放对象大小 |\n| `skew(x,y)`\
  \ | 分别按 `x` 角度和 `y` 角度偏移对象 |\n| `skewX(x)` | 仅按 `x` 角度水平偏移对象 |\n| `skewY(y)` | 仅按\
  \ `y` 角度垂直偏移对象 |\n| `translate(x,y)` | 将对象向右移动 `x` 像素，向下移动 `y` 像素 |\n| `translateX(x)`\
  \ | 将对象向右移动 `x` 像素 |\n| `translateY(y)` | 将对象向下移动 `y` 像素 |\n\n### CSS3 2D 转换效果\n\
  \n`rotate()` 函数是我最喜欢的函数之一。只需在标准图像上添加 `rotate()` 函数，就可以让它从网页的文本内容脱颖而出。你可以按照以下步骤亲自尝试：\n\
  \n1. 打开你喜欢的文本编辑器、程序编辑器或集成开发环境 (IDE)。\n2. 在编辑器窗口中，输入以下代码：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>Image Rotation Test</title>\n    <style>\n        #img1\
  \ {\n            float: left;\n            transform: rotate(30deg);\n         \
  \   box-shadow: black 10px 5px 15px;\n        }\n        #img2 {\n            float:\
  \ left;\n            transform: rotate(-30deg);\n            box-shadow: black 10px\
  \ 5px 15px;\n        }\n    </style>\n</head>\n<body>\n    <h1>Testing the image\
  \ rotation feature</h1>\n    <header>\n        <h1>My vacation photos</h1>\n   \
  \ </header>\n    <section>\n        <img id=\"img1\" src=\"image1.jpg\" width=\"\
  50\" height=\"50\">\n        <img id=\"img2\" src=\"image2.jpg\" width=\"50\" height=\"\
  50\">\n    </section>\n</body>\n</html>\n```\n\n3. 将文件保存为 `imagetest.html` 到你 Web\
  \ 服务器的 `DocumentRoot` 文件夹中。对于 Windows 上的 XAMPP，路径为 `c:\\xampp\\htdocs`。对于 macOS\
  \ 上的 XAMPP，路径为 `/Applications/XAMPP/htdocs`。\n4. 找到两个喜欢的图像文件并将其复制到 `imagetest.html`\
  \ 所在。你需要将它们重命名为 `image1.jpg` 和 `image2.jpg`，或者修改 `imagetest.html` 代码中的文件名。\n5. 如果必要，启动\
  \ Web 服务器。\n6. 打开浏览器并访问该 URL。如果你使用设置 TCP 端口 8080 的 XAMPP，请使用 `http://localhost:8080/imagetest.html`。\n\
  7. 关闭浏览器并关闭 Web 服务器。\n\n`imagetest.html` 文件中的代码将两个图像放置在网页上。第一张图像按负值旋转，使其逆时针旋转；第二张图像按正值旋转，使其顺时针旋转。图\
  \ 5-1 显示了我测试图像的结果。\n\n![image](img/9781119468387-fg020501.png)\n\n旋转网页上的图像。这是创建一个专业网站良好的开始！\n\
  \n## 图像链接\n\n你还可以将图像作为指向其他网页或位置的链接。你可以通过将 `<img>` 标签嵌入锚元素来实现：\n\n```html\n<a href=\"\
  childrens.html\">\n    <img src=\"children.jpg\" alt=\"儿童服装\" style=\"width: 50px;\
  \ height: 50px; border: 0px;\">\n</a>\n```\n\n如果网站访问者点击图像的任何地方，浏览器的响应就像锚点元素是超链接一样，将浏览器重定向到由\
  \ `href` 属性定义的目标。\n\n![tip](img/tip.png) 建议在锚元素样式中添加 `border` 样式属性并设置为 0 像素，以防止浏览器在图像周围绘制一个丑的边框来指示它是链接。\n\
  \n\n\n链接图片很不错，但那些允许你点击地图不同部分以跳转不同位置的奇华地图又呢？你可以通过使用图像映射（image maps）来实现这一点。`image\
  \ map` 允许你定义图像的某些区域，其作用就像超链接一样。你可以定义每个区域，将访问者的浏览器重定向到不同的位置。\n\n创建图像映射需要你先定义映射，然后将其应用到图像上。要定义映射，你使用\
  \ `map element`：\n\n```html\n<map name=\"mapname\">\n```\n\n`map area definitions`\n\
  \n```html\n</map>\n```\n\n`name` 属性非常重要，因为你将使用它在图像 `<<img>>` 标签的 `usemap` 属性中引用该映射：\n\
  \n```html\n<img src=\"location\" usemap=\"#mapname\">\n```\n\n定义映射后，你需要定义一个或多个映射区域。每个映射区域定义了图像上的一个特定位置，以创建一个*热点*（可点击区域）。你使用\
  \ `<area>` 标签来定义映射区域：\n\n```html\n<area shape=\"shape\" cords=\"coordinates\" href=\"\
  location\" alt=\"text\">\n```\n\n形状（shape）和坐标（coordinates）的组合定义了图像中热点的区域。表 5-2 显示了如何匹配这些内容。\n\
  \n| 形状值 | 描述 |\n| --- | --- |\n| `circle` | 定义圆心的 `x` 和 `y` 位置，以及半径值 |\n| `poly`\
  \ | 为多边形的每个点定义多个 `x` 和 `y` 位置 |\n| `rect` | 定义左上角和右下角的 `x` 和 `y` 坐标 |\n| `default`\
  \ | 无需坐标；使用图像中剩余的未映射区域 |\n\n表 5-2 定义区域元素热点\n\n定义图像映射可能有些困难。你需要知道图像在网页上的确切大小，并能够为每个区域热点定义精确的位置。这时，像\
  \ Photoshop 或 GIMP 这样的图像处理工具就会派上用场。任何允许你计算图像中像素的工具都能帮助你绘制热点。\n\n这里是一个为图像定义图像映射的示例：\n\
  \n```html\n<map name=\"storemap\">\n<area shape=\"rect\" coords=\"0, 0, 100, 500\"\
  \ href=\"books.html\" alt=\"shop our books\">\n<area shape=\"rect\" coords=\"101,\
  \ 0, 200, 500\" href=\"furniture.html\" alt=\"shop our furniture\">\n<area shape=\"\
  rect\" coords=\"201, 0, 300, 500\" href=\"clothes.html\" alt=\"shop our clothes\"\
  >\n<area shape=\"rect\" coords=\"301, 0, 400, 500\" href=\"tools.html\" alt=\"shop\
  \ our selection of tools\">\n<area shape=\"rect\" coords=\"401, 0, 500, 500\" href=\"\
  food.html\" alt=\"shop for some groceries\">\n</map>\n```\n\n定义图像映射后，你通过向 `<<img>>`\
  \ 标签添加 `usemap` 属性将其与图像关联：\n\n```html\n<img src=\"store.html\" alt=\"our store\"\
  \ usemap=\"#storemap\">\n```\n\n`#storemap` 值引用了 `storemap` 的 `name` 属性，因此浏览器会将该映射应用于网页上的图像。点击每个单独的部分将带你进入该区域定义的关联\
  \ `href` 位置。\n\n### 使用 HTML5 图像扩展\n\n除了标准的 HTML 图像功能外，HTML5 还增加了一些新的图像功能，你可以在网页中使用它们。\n\
  \n#### 图形和标题\n\n在网页上显示的图像周围放置标题是种常见需求。你可以使用标准的 HTML 和 CSS 实现这一点，但这需要一些计算才能获得正确的定位，而且如果网页上的任何内容发生移动，图像和标题可能会不同步。\n\
  \nHTML5 添加了 `figure element` 来将图像和标题匹配在一起。`figure` 元素包含图像以及一个 `figcaption` 元素，创建一个可以在网页上进行定位和移动的单一对象。以下是这些内容的通用格式：\n\
  \n```html\n<figure>\n<img src=\"image.jpg\" alt=\"Figure 1\">\n<figcaption>Figure\
  \ 1: Creating a web page</figcaption>\n</figure>\n```\n\n现在你可以为 `figure` 元素添加样式，将图像及其关联标题作为一个单一对象在网页上共同进行定位。在这个示例中，标题将出现在图像下方。如果你愿意，也可以通过将\
  \ `<figcaption>` 标签放在 `<<img>>` 标签之前将其放在图像上方。\n\n![tip](img/tip.png) 你也可以使用 `figure`\
  \ 元素将其他对象与标题链接起来。例如，使用 `p` 元素代替 `img` 元素在文本段中嵌入引用，并将其链接到 `figcaption` 元素中引用的来源处。\n\
  \n#### picture 元素\n\n除了标准的 HTML 图像功能外，HTML5 还增加了一些新的图像功能，你可以在网页中使用它们。\n\n`picture\
  \ element` 允许你提供图像的多个版本，浏览器将根据设备能力选择最佳版本。这对于响应式设计 特别有用。\n\n```html\n<picture>\n\
  <source media=\"(min-width: 1000px)\" srcset=\"large.jpg\">\n<source media=\"(min-width:\
  \ 500px)\" srcset=\"small.jpg\">\n<img src=\"original.jpg\" alt=\"My image\">\n\
  </picture>\n```\n\n\n\n\n要使用插件播放音频文件，你必须使用 `embed` 元素，它向浏览器指示网页中嵌入了某种外部文件，并寻找合适的插件来处理该嵌入文件。`embed`\
  \ 元素使用单边标签 `<embed>`，其格式如下：\n\n```\n<embed src=\"location\" type=\"mime\" width=\"\
  x\" height=\"y\">\n```\n\n`src` 属性定义音频文件的位置，可以是本地服务器上的绝对路径或相对路径，也可以指向远程服务器上存储音频文件的\
  \ URL。\n\n如果插件需要在网页上留出空间显示界面，则使用 `width` 和 `height` 属性。某些音频插件提供了界面，用于停止、开始和暂停音频文件的播放。\n\
  \n`type` 属性定义多媒体文件的类型。它使用标准的多媒体互联网邮件扩展格式（`MIME`）类型名称来识别音频文件类型。正如名称所示，`MIME` 类型最初是为了通过电子邮件发送二进制文件而开发的，但也被\
  \ Web 浏览器用于网页中的嵌入二进制文件。浏览器使用 `MIME` 类型来确定使用哪种插件来处理嵌入文件。不同的音频文件格式（如 QuickTime 或 RealAudio）需要不同的插件来播放。在这种情况下，了解数字音频文件的各种不同格式非常有帮助。\n\
  \n### 数字音频格式\n\n自从从黑胶唱片过渡到数字世界以来，已经使用了许多方法将模拟声音转换为数字媒体。将声音转换为数字信号的过程由三个元素组成：\n\n\
  * **采样率：** 测量并量化声音振幅为数字值的频率\n* **采样分辨率：** 每个采样数字值使用多少比特位的数据\n* **压缩：** 如何将最终的数字数据压缩成音频文件\n\
  \n采样率和采样分辨率的结合决定了数字录制中使用的比特率。比特率越高，数字播放产生的原始模拟信号就越准确。然而，比特率越高，生成的数字数据就越多，因此存储音频所需的空间也越大。\n\
  \n数字音频的标准 CD 格式使用 `1411 Kbps` 的比特率，这实现了极其精确的还原，但也导致每个音频轨道的文件大小非常大（约 `10MB`）。通过互联网发送标准\
  \ CD 音频轨道并在客户端浏览器上播放是不切实际的。\n\n这就是压缩派上用场的地方。由于原始音频文件太大，无法在网络上使用，我们需要引入某种压缩方案使它们更易管理。遗憾的是，多年来，许多不同的公司开发了专有的压缩技术，导致了我们现在无数种不同的音频文件类型。表\
  \ 5-3 列出了目前常用的音频文件类型及其文件扩展名和 MIME 类型。\n\n| 音频 | 文件 | MIME | 描述 |\n| --- | --- |\
  \ --- | --- |\n| AAC | `.aac` | `audio/aac` | Apple 音频编码 |\n| AU | `.au` | `audio/basic`\
  \ | Unix 系统的 Sun Microsystems 标准 |\n| MIDI | `.mid` | `audio/mid` | 乐器数字接口接口标准 |\n\
  | MP3 | `.mp3` | `audio/mpeg` | 运动小组标准 |\n| Ogg Vorbis | `.ogg` | `audio/ogg` |\
  \ 开源标准 |\n| RealAudio | `.ra` | `audio/x-pn-realaudio` | 流媒体音频的 Real Media 标准 |\n\
  | SND | `.snd` | `audio/basic` | Apple 基于 AU 音频格式开发的 SouND  |\n| Shockwave Flash\
  \ | `.swf` | `audio/x-shockwave-flash` | Adobe 专有格式 |\n| WAV | `.wav` | `audio/wav`\
  \ | 微软开发的未压缩音频波形音频格式 |\n\n表 5-3 音频文件和 MIME 类型\n\n这些音频文件格式都有自己的优缺点需要处理。不同的发烧友对哪种方法最好有不同意见。更复杂的是，这些许多音频文件格式是专有的，需要许可才能浏览器中嵌入播放器。`MP3`\
  \ 音频类型由于其高压缩率和高音质，多年来已事实标准，但许多开发者由于其专有性质而不喜欢使用 `MP3`。\n\n`Ogg Vorbis` 音频类型是一种开源标准，可以在任何环境中免费使用。然而，由于认为与其它压缩方法相比缺乏音质，它尚未被所有浏览器（包括\
  \ Internet Explorer 和 Safari）广泛采用。\n\n![tip](img/tip.png) 在本文写作时，所有主流浏览器支持的音频文件类型只有\
  \ `MP3`。然而，如果你的网站访问者使用的是 Linux 工作站，由于许可限制，`MP3` 解码器通常不会在所有 Linux 发行版中默认加载。\n\n如果你将音频文件嵌入网页，访问者没有相应的插件来处理它，浏览器将以三种方式之一做出：\n\
  \n* 在嵌入音频文件的位置显示错误消息\n* 显示弹出消息，指示播放音频文件所需的插件\n* 将网页重定向到另一个网页\n\n### 音频的 HTML5 方式\n\
  \n所有这些结果对你的网页来说都不是理想的。幸运的是，HTML5 标准产生了一种将声音整合进网页 Better 方法。`audio` 元素的工作就像 `picture`\
  \ 元素一样——最好提供多个版本供选择。\n\n将音频文件嵌入网页的关键与你处理图像的方式相似（请参见本章前面的“[使用 HTML5 扩展”部分）。你使用`<audio>`\
  \ 标签打开源列表，使用`<source>` 标签定义。每个源都指定了不同的音频格式供浏览器尝试。浏览器支持列表中的第一个将由浏览器请求并播放。它看起来像这样：\n\
  \n```\n<audio>\n<source src=\"myaudio.mp3\" type=\"audio/ogg\">\n<source src=\"\
  myaudio.ogg\" type=\"audio/mpeg\">\n<source src=\"myaudio.wav\" type=\"audio/wav\"\
  >\n</audio>\n```\n\n对于 `source` 元素，你使用 `src` 属性指定要播放的音频文件的位置，以及 `type` 属性指定音频文件的\
  \ MIME 类型。由浏览器决定使用哪一个。在示例中，浏览器首先尝试播放 `MP3` 版本。然后对于没有该版本的 Linux 工作站，它尝试加载并播放 `Ogg\
  \ Vorbis` 版本。如果还没有，它将尝试使用音频文件的 `WAV` 版本。\n\n![warning](img/warning.png) HTML5 标准仅支持\
  \ `MP3`、`Ogg Vorbis` 和 `WAV` 音频类型。不要尝试使用 `audio` 元素嵌入 `QuickTime` 或 `RealAudio`\
  \ 音频文件。你需要使用 `embed` 元素来实现。\n\n你还可以在`<source>` 标签列表之后放置一条短消息，以便当浏览器不支持列出的任何 MIME\
  \ 类型时显示该消息：\n\n```\n<audio>\n<source src=\"myaudio.mp3\" type=\"audio/ogg\" controls>\n\
  <source src=\"myaudio.ogg\" type=\"audio/mpeg\" controls>\n抱歉，您的浏览器不支持 MP3 或 OGG\
  \ 音频\n</audio>\n```\n\n`<audio>` 标签有几个属性可以帮助浏览器处理音频的方式。表 5-4 显示了可用属性。\n\n| 属性 |\
  \ 描述 |\n| --- | --- |\n| `autoplay` | 浏览器应在网页加载时立即开始播放文件。 |\n\n\n\n\n\n| `controls`\
  \ | 浏览器应该显示一组标准的音频控制按钮，如播放、停止和暂停按钮。 |\n| `loop` | 浏览器应该不断循环音频文件。 |\n| `muted` |\
  \ 浏览器应该立即静音音频轨道。 |\n| `preload` | 指定是在页面加载时还是在点击播放按钮时加载音频文件。 |\n| `src` | 在不使用额外的\
  \ `<source>` 标签时，指定音频文件的 URL。 |\n\n表格 5-4 <audio> 标签属性\n\n建议使用 `controls` 属性，因为它为网站访问者提供了一个界面，使他们可以控制音频文件的播放方式或播放时间。每个浏览器都有自己显示音频控制控件的方式。图\
  \ 5-2 显示了控制控件在 Internet Explorer 浏览器中的外观。\n\n![image](img/9781119468387-fg020502.png)\n\
  \n图 5-2： Internet Explorer 浏览器中的音频控制。\n\n浏览器显示的音频控制控件相当简单——一个播放/暂停按钮、一个静音按钮、一个控制音频文件位置的滑块以及一个音量滑块。不要指望会有任何花哨的\
  \ EQ 设置来增强你曲目中的低音！\n\n![warning](img/warning.png) 在过去，在网页中嵌入音频文件并设置为开启循环功能自动播放是比较常见的做法。这绝对会惹恼你的网站访问者，甚至可能给使用屏幕阅读器处理你网页的访问者带来问题。我不建议使用这种方法。请让你的网站访问者自行选择是否播放嵌入在网页页面上的音频。\n\
  \n## 观看视频\n\n如今，世界充满了视频内容。你几乎可以在世界上任何涉及的话题下找到视频，包括如何制作自己的视频！本节将介绍如何在网页中嵌入视频，但首先，让我们快速查看你可能需要处理的不同类型的视频文件。\n\
  \n### 注意视频质量\n\n就像电影世界一样，视频是由一系列单独图像（称为`帧`）组成的，并以设定的速度（称为`帧率`）播放。帧质量越高，视频质量就越好。帧率越高，通常视频质量越好（本节中提到的例外除外）。\n\
  \n你可以为视频图像使用任何帧尺寸，但通常有一些常用的标准帧尺寸：\n\n*   **160 x 120:** 使用 3:4 宽高比的低质量视频\n*   **320\
  \ x 240:** 质量较高的视频，但仍使用 3:4 宽高比\n*   **640 x 480:** 使用 3:4 宽高比的最高质量视频\n*   **1280\
  \ x 720:** 使用 16:9 宽高比的高清（HD）视频\n*   **1920 x 1080:** 使用 16:9 宽高比的 HD 质量视频\n\n正如你猜的那样，帧图像质量越高意味着视频文件越大。\n\
  \n电视视频使用的帧率是每秒 60 帧 (fps)。该帧率会创建一个巨大的视频文件。DVD 质量的视频使用 24fps 作为视频质量和文件大小之间的折中方案。\n\
  \n对于网络视频来说，帧帧并不一定是好事。当视频从服务器发送到客户端浏览器时，网络会产生干扰。通常，为了帮助平滑播放，大多数浏览器都会使用缓冲区在下载时保存视频数据。当缓冲区区域填充足够多，让浏览器认为可以按照指定的帧率播放视频并跟上下载速度时，它就会播放视频。\n\
  \n然而，如果下载变慢，缓冲区开始追赶实时数据，视频播放将显得卡顿，并降低你网站访问者的观看体验。这就是为什么高帧率并不一定等同于更好的视频质量。\n\n###\
  \ 查看数字视频格式\n\n就像音频文件一样，许多不同的公司设计了不同的视频压缩方法以供存储和播放。遗憾的是，这导致了我们必须处理的各种不同视频格式的杂烩。表格\
  \ 5-5 列出了你最可能遇到的更流行的视频格式。\n\n| **格式** | **文件** | **MIME** | **描述** |\n| --- | ---\
  \ | --- | --- |\n| AVI | `.avi` | video/x-msvideo | 音频视频交织。由微软开发。 |\n| Flash | `.flv`\
  \ | video/x-flv | Adobe Flash 视频。 |\n| MPEG | `.mpg` | video/mpg | 原始运动图像专家组数字视频标准。\
  \ |\n| MPEG-4 | `.mp4` | video/mp4 | 更新后的 MPEG 标准，目前在使用。 |\n| Ogg Theora | `.ogg`\
  \ | video/ogg | 开源。 |\n| QuickTime | `.mov` | video/quicktime | 由 Apple 开发。 |\n\
  | RealVideo | `.rm` | video/x-realvideo | 由 Real 开发。 |\n| WebM | `.webm` | video/webm\
  \ | 由联盟开发。 |\n| WMV | `.wmv` | video/x-wmv | 微软。 |\n\n表格 5-5 常见格式\n\n### 在网页中放置视频\n\
  \n在 HTML 的原始版本中没有嵌入视频的标准方法。专用方法变得流行，Flash 插件成为了事实标准。\n\n然而，HTML5 改变了这一点，引入了不需要插件即可嵌入视频的方法。新的\
  \ `video` 元素。\n\n正如你可能猜到的，`video` 元素的工作与音频元素相同。它允许提供一组定义不同视频的 `source` 元素。基本格式如下：\n\
  \n```html\n<video>\n  <source src=\"mymovie.mp4\" type=\"video/mp4\">\n  <source\
  \ src=\"mymovie.ogg\" type=\"video/ogg\">\n  您的浏览器不支持视频\n</video>\n```\n\n浏览器尝试播放第一个出的视频，如果失败，则尝试第二个。如果仍然失败，浏览器将显示文本。\n\
  \n![warning](img/warning.png) HTML5 标准仅支持 MP4、Ogg 和 WebM 视频格式。如果你需要播放其他视频格式，可以尝试使用\
  \ `embed` 元素。\n\n`<video>` 标签支持一些属性，允许你控制网站访问者的观看体验。表格 5-6 显示了可用属性。\n\n| **属性**\
  \ | **描述** |\n| --- | --- |\n| `autoplay` | 在网页加载后立即启动视频 |\n| `controls` | 显示一组用于控制视频的图标（如播放、停止和暂停）\
  \ |\n| `height` | 设置网页中视频显示区域的高度 |\n| `loop` | 指定浏览器不断循环视频 |\n| `muted` | 以静音状态启动视频\
  \ |\n| `poster` | 指定在视频下载期间显示的图像 URL |\n| `preload` | 在网页加载时加载视频，而不是在点击播放按钮时 |\n\
  | `src` | 指定视频文件的位置 |\n| `width` | 指定网页中视频显示区域的宽度 |\n\n\n\n\n\n对于视频来说，你必须指定 `height`\
  \ 和 `width` 属性，以控制视频在网页上的显示方式。浏览器将限制视频显示在您指定的区域内。图 5-3 显示了在 Internet Explorer 浏览器中带有控件的视频。\n\
  \n![image](img/9781119468387-fg020503.png)\n\n图 5-3: 在 Internet Explorer 浏览器中播放视频。\n\
  \nInternet Explorer 中的视频查看器提供了播放/暂停按钮、显示视频文件当前位置的状态指示器、一个在点击时还会显示音量控制的静音按钮，以及一个允许你切换到全屏模式查看视频的按钮。\n\
  \n![warning](img/warning.png) 我之前提到的关于自动播放音频文件的警告同样适用于视频文件。永远不要假设你的网站访问者会在网页加载后立即想查看视频，即使你包含了\
  \ `muted` 属性。播放视频会消耗工作站大量的处理器资源；对于使用性能较差设备的访问者，这可能会导致问题。\n\n## 从流媒体服务获取帮助\n\n尝试提供正确格式的自定义视频以便在所有浏览器中正确显示，可能是一项挑战。有时，最好的办法是“认输”，让专业人士来处理。我所说的“专业人士”指的是许多商用的视频流媒体服务，例如\
  \ YouTube、Vimeo 和 LiveStream。这些服务中的大多数都允许你免费注册试用，有些甚至允许你在自己的频道中免费托管较小的视频。\n\n使用流媒体服务的奇之处在于，通常你只需要上传一种格式的视频；然后流媒体服务会负责对视频进行重新格式化，匹配网站访问者所需的其他视频格式或质量。你再也不需要自己重新格式化视频，并担心不同浏览器、不同带宽速度下的显示效果。\n\
  \n从流媒体服务嵌入视频需要使用旧的 `iframe` 元素。`iframe` 元素在 HTML 早期非常流行，作为将网页划分为独立区域的方法。然而，`iframe`\
  \ 方法很笨拙，不久 CSS 就提供了一种划分网页的更佳方法。\n\n然而，`iframe` 元素作为显示流媒体视频的容器又有所回升。该格式使用了双边形 `<iframe>`\
  \ 标签：\n\n```html\n<iframe width=\"x\" height=\"y\" src=\"location\">\n</iframe>\n\
  ```\n\n正如你所预期的，`width` 和 `height` 属性对于控制网页中 `iframe` 区域的大小是必要的。`src` 属性指向流媒体提供商分配为你上传视频的自定义\
  \ URL。\n\n第 3 本\n\n### JavaScript\n\n## 内容概览\n\n1. 第 1 章：介绍 JavaScript\n    1. 了解为什么要使用\
  \ JavaScript\n    2. 了解将你的 JavaScript 代码放在哪里\n    3. JavaScript 基础\n    4. 控制程序流程\n\
  \    5. 函数函数\n2. 第 2 章：高级 JavaScript 编码\n    1. 理解文档对象模型\n    2. 寻找你的元素\n    3.\
