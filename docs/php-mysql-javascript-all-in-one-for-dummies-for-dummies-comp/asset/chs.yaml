  \n## 在 AJAX 中传输数据\n\n示例中的 `ajaxcars.php` 服务器程序以逗号分隔的形式将数据返回给客户端浏览器。为了组织返回的数据，AJAX\
  \ 标准建议使用 XML。可以使用许多不同的标准，但如果你的应用程序需要大量数据，很快就会变得混乱。后续章节将讨论 XML 标准以及如何在 PHP 和 JavaScript\
  \ 中使用它。\n\n### 查看 XML 标准\n\n与 HTML 类似，XML 文档使用标签来识别每个元素。XML 文档的第一个元素标识标准。随后是实际数据：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<car>Dodge</car>\n```\n\n\
  与 HTML 不同，XML 没有标准标签——你可以根据需要创建层次：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<car>\n  <make>Dodge</make>\n  <model>Challenger</model>\n</car>\n```\n\
  \n就像 HTML 一样，XML 元素也支持属性：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
  <car make=\"Dodge\">\n  <model>Challenger</model>\n</car>\n```\n\n元素名称的相同规则适用于属性名称。你也可以在单个元素中定义多个属性。只需用空格分隔每个属性/值对即可。此外，重要的是记住你必须用引号包含属性值。\n\
  \n### 在 PHP 中使用 XML\n\n你可以手动构建所有 XML 元素以以字符串值的形式创建 XML 文档，但有更简单的方法！PHP 包含了 `DOMDocument`\
  \ 对象，它允许你作为对象构建 XML 文档。\n\n```javascript\n$doc = new DOMDocument(\"1.0\");\n```\n\
  \n\n\n\n\n该参数指定了 PHP 创建文档时使用的 XML 版本号。当你创建对象时，你可以使用 `DOMDocument` 方法来添加元素、属性及其值。有很多\
  \ `DOMDocument` 方法可可用。表 3-4 显示了你创建 XML 文档时最常用的方法。\n\n| 方法 | 说明 |\n| --- | --- |\n\
  | `appendChild` | 向文档中的现有节点添加新的子节点 |\n| `createAttribute` |为现有元素创建一个新属性 |\n| `createElement`\
  \ | 在文档中创建一个新的元素节点 |\n| `createTextNode` |为文档中的现有元素创建一个文本值 |\n| `saveXML` | 以 XML\
  \ 格式输出 DOM 文档 |\n\n表 3-4 常用的 PHP `DOMDocument` 方法\n\n如你从表 3-4 所示，在 PHP 中创建 XML 文档并不复杂的代码！按照以下步骤尝试使用\
  \ PHP 构建 XML 文档：\n\n1. **打开编辑器并输入以下代码：**\n\n```php\n<?php\n$doc = new DOMDocument(\"\
  1.0\");\n$carlot = $doc->createElement(\"carlot\");\n$carlot = $doc->appendChild($carlot);\n\
  $car1 = $doc->createElement(\"car\");\n$car1 = $carlot->appendChild($car1);\n$make1\
  \ = $doc->createAttribute(\"make\");\n$make1->value = \"Dodge\";\n$car1->appendChild($make1);\n\
  $model1 = $doc->createElement(\"model\", \"Challenger\");\n$model1 = $car1->appendChild($model1);\n\
  $model2 = $doc->createElement(\"model\", \"Charger\");\n$model2 = $car1->appendChild($model2);\n\
  $car2 = $doc->createElement(\"car\");\n$car2 = $carlot->appendChild($car2);\n$make2\
  \ = $doc->createAttribute(\"make\");\n$make2->value = \"Ford\";\n$car2->appendChild($make2);\n\
  $model3 = $doc->createElement(\"model\", \"Mustang\");\n$model3 = $car2->appendChild($model3);\n\
  $output = $doc->saveXML();\nheader(\"Content-type: application/xml\");\necho $output;\n\
  ?>\n```\n\n2. **将文件保存为 `xmltest.php` 并放在 Web 服务器的 `DocumentRoot` 文件夹中。**\n\n3. **打开浏览器，然后在地址栏中输入以下\
  \ URL：**\n\n`http://localhost:8080/xmltest.php`\n\n4. **查看浏览器窗口中显示的 XML 代码。**\n\n\
  `Content-type` HTTP 头部告诉浏览器文档是一个 XML 文档而不是 HTML 文档。这会导致浏览器将文本解析为 XML 文档并显示内容。\n\n\
  ![warning](img/warning.png) 在创建传递给 JavaScript `XMLHttpRequest` 对象的 XML 文档时，设置 `Content-type`\
  \ HTTP 头部同样重要。当 JavaScript 检测到 XML 文档 `Content-type` 时，会将数据放在 `responseXML` 属性而不是\
  \ `responseText` 属性中\n\n不同的浏览器以不同的格式显示 XML 文件。图 3-3 显示了 Microsoft Edge 浏览器中的输出效果，它在\
  \ XML 文档格式化方面做得很好。\n\n![image](img/9781119468387-fg060303.png)\n\n图 3-3： 使用 Microsoft\
  \ Edge 浏览器查看 XML 源代码。\n\nPHP 代码创建了一个新的 `DOMDocument` 对象，并将 `carlot` 元素作为 XML 树的根节点：\n\
  \n```php\n$carlot = $doc->createElement(\"carlot\");\n$carlot = $doc->appendChild($carlot);\n\
  ```\n\n随后它向文档添加了两个 `car` 元素。第一个 `car` 元素包含一个名为 `make` 的属性，值为 `\"Dodge\"`：\n\n```php\n\
  $car1 = $doc->createElement(\"car\");\n$car1 = $carlot->appendChild($car1);\n$make1\
  \ = $doc->createAttribute(\"make\");\n$make1->value = \"Dodge\";\n$car1->appendChild($make1);\n\
  ```\n\n它还包含两个名为 `model` 的子元素，具有不同的文本值：\n\n```php\n$model1 = $doc->createElement(\"\
  model\", \"Challenger\");\n$model1 = $car1->appendChild($model1);\n$model2 = $doc->createElement(\"\
  model\", \"Charger\");\n$model2 = $car1->appendChild($model2);\n```\n\n### 在 JavaScript\
  \ 中使用 XML\n\n\n\n\n\n```html\nrequest.send();\n}\n</script>\n</head>\n<body>\n<h2>JavaScript\
  \ XML 测试</h2>\n<p>从服务器获取的汽车：</p>\n<div id=\"carlist\"></div>\n<p>这是列表结束</p>\n<input\
  \ type=\"button\" onclick=\"getcars()\" value=\"Get cars\">\n</body>\n</html>\n\
  ```\n\n2. **将文件保存为** `xmltest.html` **并存放在你 Web 服务器的** `DocumentRoot` **文件夹中。**\n\
  \n3. **打开浏览器并输入以下 URL：**\n\n`http://localhost:8080/xmltest.html`\n\n4. **点击“Get\
  \ Cars”（获取汽车）按钮以从** `xmltest.php` **程序中检索 XML 文档。**\n\n5. **观察网页的动态变化，完成后关闭浏览器。**\n\
  \n当你运行程序并点击“Get Cars”按钮时，你应该能看到由 `xmltest.php` 程序创建的 XML 文档定义的汽车列表，如图 3-4 所示。\n\n\
