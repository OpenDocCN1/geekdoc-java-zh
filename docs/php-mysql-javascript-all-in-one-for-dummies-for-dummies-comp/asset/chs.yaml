  \n这三种方法产生的结果完全相同，因此请随意使用你喜欢的任何工具！\n\n# 第 3 章\n\n# 设计与构建数据库\n\n本章内容\n\n![check](img/check.png)\
  \ 理解如何设计数据库\n\n![check](img/check.png) 在 MySQL 中创建数据库\n\n![check](img/check.png)\
  \ 使用不同的工具构建表\n\n在前一章中，你学习了如何使用 MySQL 服务器界面工具。构建动态 Web 应用程序的下一步是为应用程序所需的数据创建数据库和表。\n\
  \n在本章中，我将向你如何确定应用程序究竟需要哪些数据，以及如何将其划分表以管理数据。然后，我将向你如何使用流行的 MySQL 服务器界面工具创建数据库。最后，我将解释如何使用每种工具来创建表，以便你可以管理应用程序中的数据。\n\
  \n## 管理你的数据\n\n当你开始一个新的动态 Web 应用时，在开始任何编码之前，你的第一个决定是如何处理应用程序数据。通常，你会面对许多需要跟踪的数据元素，例如商店的员工、客户和产品信息。成功管理所有这些信息的诀在于如何对它们进行分类。\n\
  \n将应用程序数据结构化为表的过程被称为 `database normalization`（数据库规范化）。数据库规范化的关键是构建数据库，使你的应用程序能够快速、方便地添加、修改、删除和搜索表中包含的数据。\n\
  \n### 第一范式（First Normal Form）\n\n在第一范式中，思想是将数据结构化为表，其中每列只包含单个值。这避免了重复的数据组。\n\n###\
  \ 第二范式（Second Normal Form）\n\n第二范式要求每个非键属性必须完全函数依赖于主键。这确保了数据在同一表的不同行之间不是冗余的。\n\n\
  ### 第三范式（Third Normal Form）\n\n第三范式要求所有非键属性仅依赖于主键。这消除了传递依赖，并进一步有助于维护数据完整性。\n\n\n\
  \n\n\n直接将订单信息添加到 `Customers` 表中是不妥妥的。理想情况下，你的客户会有多个订单，因此每条订单数据记录都需要重复客户信息。这将违反数据冗余消除规则。此外，将订单信息放在\
  \ `Products` 表中也行不通，因为同一个订单也可能包含多个产品。\n\n解决方案是创建一个独立的 `Orders` 表，并将该表与 `Customers`\
  \ 和 `Products` 表关联起来。每个订单数据记录将使用来自 `Customers` 和 `Products` 表的 `customerid` 和 `productid`\
  \ 主键值，以便将订单项关联回客户及其包含的产品。\n\n### 第三范范式\n\n第三范式定义了如何处理那些不一定依赖于表主键但需要搜索的数据字段。这种程度的规范化很大程度上取决于你的应用程序如何使用它存储的数据。\n\
  \n一个例子是 `Employees` 表中的 `startdate` 数据字段。如果你的应用程序需要执行大量查询来查找在公司工作了特定年份的员工，创建一个包含\
  \ `startdate` 值的独立表（与 `Employees` 表分离）可能有助于提高应用程序性能。通过读取包含单一值的较小表而不是整个 `Employees`\
  \ 表，这可以加快查询过程。这通常被称为 `index table`。\n\n索引表包含了应用程序中常用的查询数据，但这些数据与表的主键分离。如果你的应用程序将查询员工的\
  \ `startdate` 作为主要功能，那么通过创建一个包含 `Employees` 表中 `startdate` 值的独立索引表，将有助于提高这些查询的性能。\n\
  \n然而，索引表也有缺点。当你插入每条新的员工数据记录时，数据库系统现在必须进行两次条目：一个在 `Employees` 表中，另一个在 `startdate`\
  \ 索引表中。这将减慢添加新员工数据记录的性能！\n\n如你所见，这是一种权衡。如果你的应用程序频繁查询员工的 `startdate`，那么实施第三范式规则并创建独立的索引表会有帮助。如果不是，最好的办法是忽略第三范式规则而不创建独立表。这完全取决于了解你的应用程序以及你的用户是如何！\n\
  \n## 创建数据库\n\n在确定了支持你的应用程序数据所需的结构后，就可以开始在 MySQL 服务器中创建它了。该过程的第一步是为应用程序创建一个数据库。本节将介绍使用上一章涵盖的不同\
  \ MySQL 工具创建新数据库的方法。\n\n### 使用 MySQL 命令行\n\n要从 MySQL 命令行界面 (CLI) 创建新数据库，你需要使用 `CREATE\
  \ DATABASE` SQL 语句。根据你的需求和环境，该命令可能非常简单，也非常复杂。如果你只是想创建一个使用服务器默认字符集设置的数据库，只需在命令中指定数据库名称：\n\
  \n```\nMariaDB [(none)]> CREATE DATABASE dbtest1;\nQuery OK, 1 row affected (0.00\
  \ sec)\nMariaDB [(none)]>\n```\n\n你现在拥有了一个新数据库！\n\n![warning](img/warning.png) 在\
  \ Mac、Linux 和 Unix 系统上，数据库名称是区分大小写的；在 Windows 系统上，是不区分大小写的。如果你将数据库从一个环境迁移到另一个环境，这可能会导致各种问题，所以请小心使用混合大小写的数据库名称！最好的办法是数据库名称中的所有字符保持相同的大小写。\n\
  \n要确保数据库已实际创建，在 CLI 中使用 `SHOW DATABASES` 语句显示服务器上包含的数据库：\n\n```\nMariaDB [(none)]>\
  \ SHOW DATABASES;\n+--------------------+\n| Database |\n+--------------------+\n\
  | dbtest1 |\n| information_schema |\n| mysql |\n| performance_schema |\n| phpmyadmin\
  \ |\n| test |\n+--------------------+\n6 rows in set (0.00 sec)\nMariaDB [(none)]>\n\
  ```\n\n你创建的数据库应该出现在数据库列表中。如果你想查看关于新数据库的更多信息，使用 `SHOW CREATE DATABASE` 语句：\n\n```\n\
  MariaDB [(none)]> SHOW CREATE DATABASE dbtest1;\n+----------+------------------------------------------------------------------+\n\
  | Database | Create Database |\n+----------+------------------------------------------------------------------+\n\
  | dbtest1 | CREATE DATABASE `dbtest1` /*!40100 DEFAULT CHARACTER SET latin1*/|\n\
  +----------+------------------------------------------------------------------+\n\
  1 row in set (0.00 sec)\nMariaDB [(none)]>\n```\n\n`SHOW CREATE DATABASE` 语句的输出表明数据库正在使用\
  \ `latin1` 字符集。为你的数据库定义的字符集可能不同，取决于你的 MySQL 服务器中的默认设置。如果你需要使用特定字符集创建数据库，可以在 `CREATE\
  \ DATABASE` 语句中指定它：\n\n```\nMariaDB [(none)]> CREATE DATABASE dbtest1\n-> CHARACTER\
  \ SET latin1\n-> COLLATE latin1_general_cs;\nQuery OK, 1 row affected (0.00 sec)\n\
  MariaDB [(none)]>\n```\n\n该语句使用 `latin1` 字符集和 `latin1_general_cs` 排序规则创建 `dbtest1`\
  \ 数据库。\n\n如果你需要从 MySQL 服务器中删除数据库，使用 `DROP` 语句：\n\n```\nMariaDB [(none)]> DROP DATABASE\
  \ dbtest1;\nQuery OK, 0 row affected (0.00 sec)\nMariaDB [(none)]> SHOW DATABASES;\n\
  +--------------------+\n| Database |\n+--------------------+\n| information_schema\
  \ |\n| mysql |\n| performance_schema |\n| phpmyadmin |\n| test |\n+--------------------+\n\
  5 rows in set (0.00 sec)\nMariaDB [(none)]>\n### 使用 MySQL Workbench\n\nMySQL Workbench\
  \ 工具提供了一个良好的图形界面让你轻松创建数据库。Navigator 中的 Schemas 部分显示了服务器上当前的数据库。（注意：Workbench 将数据库称为\
  \ schema。）\n\n要使用 Workbench 创建新数据库，请遵循以下步骤：\n\n1. 在 Schemas 部分点击右键，从弹出菜单中选择 `Create\
  \ Schema`。\n一个 New schema 表单在左侧打开，如图 1 所示。\n2. 在 `Name` 框中输入数据库名称。\n3. 从 `Collation`\
  \ 下拉菜单选择字符集和相应的排序规则。\n你可以保留 `Server Default` 值以使用服务器的默认字符集和排序规则。\n4. 点击 `Apply`。\n\
  弹出 Create Database Wizard，引导你完成数据库创建过程。首先显示根据你在表单输入的信息生成的 `CREATE DATABASE` 语句，如图\
  \ 2 所示。\n5. 点击 `Apply` 将生成的 SQL 语句提交给 MySQL 服务器创建数据库。\n6. 当 MySQL 服务器运行语句时，向导将显示结果，如图\
  \ 3 所示。\n\n![image](img/9781119468387-fg050301.png)\nFIGURE 3-1: 使用 Workbench 创建数据库。\n\
  \n![image](img/9781119468387-fg050302.png)\nFIGURE 3-2: 创建数据库向导。\n\n![image](img/9781119468387-fg050303.png)\n\
  FIGURE 3-3: 运行结果。\n\n\n\n\n\n图 3-3: Workbench 创建数据库向导的结果。\n\n如果 SQL 提交成功，新数据库将出现在窗口左侧的\
  \ `Schemas` 区域下。\n\n如果你需要使用 Workbench 移除数据库，只需右键点击 `Schemas` 列表中的数据库条目，然后选择 `Drop\
  \ schema` 菜单项。非常简单！\n\n### 使用 phpMyAdmin\n\n正如你可能猜到的，在 phpMyAdmin 这种基于 Web 的图形工具中创建数据库与使用\
  \ Workbench 类似。以下是操作步骤：\n\n1. **在浏览器中打开 phpMyAdmin 工具后，点击顶部导航栏中的 `Databases` 按钮。**\n\
  \n   图 3-4 显示了表单。\n\n   `Databases` 页面显示了 MySQL 服务器上的现有数据库，以及一个创建一个新数据库的表单。\n\n\
  2. **在 `Database name` 文本框中输入新数据库的名称。**\n\n3. **从 `Collation` 下拉菜单选择字符集和排序规则。**\n\
  \n   如果你想使用服务器的默认值，只需留空下拉框即可。\n\n4. **点击 `Create` 按钮以提交创建数据库的 SQL。**\n\n![image](img/9781119468387-fg050304.png)\n\
  \n图 3-4: phpMyAdmin 数据库页面。\n\n如果数据库创建成功，phpMyAdmin 会自动带你进入数据库接口网页，提示你在数据库中创建一个新表，如图\
  \ 3-5 所示。\n\n![image](img/9781119468387-fg050305.png)\n\n图 3-5: phpMyAdmin 数据库网页。\n\
  \n使用 phpMyAdmin 移除数据库比在 Workbench 中稍微复杂一点。以下是移除现有数据库的步骤：\n\n1. **在左侧列表中点击你想移除的数据库。**\n\
  \n2. **点击数据库网页顶部的 `Operations` 标签页。**\n\n   出现如图 3-6 所示的数据库操作网页。在操作页面上，你可以重数据库、复制数据库、在数据库中创建表，当然，还有移除数据库。\n\
  \n3. **点击页面右侧（红色字体）出现的 `Drop the Database (DROP)` 链接以移除数据库。**\n\n![image](img/97811119468387-fg050306.png)\n\
  \n图 3-6: phpMyAdmin 数据库操作网页。\n\n创建完应用程序数据库后，你可以进行下一步：创建用于存储应用程序数据的表。\n\n## 构建表\n\
  \n在关系型数据库模型中，表是存储所有实际应用程序数据的地方。正如本章开头提到的，在尝试创建任何表之前，花时间规划你的表布局和结构是非常关重要的。\n\n每个数据表的定义都必须指定表中包含的单个数据元素，以及这些数据元素的所有属性。这包括：\n\
  \n* 数据字段名\n* 数据字段的数据类型\n* 数据字段所需的任何索引（例如主键）\n* 是否需要为表定义任何外键\n* 数据字段所需的任何数据约束\n\n\
  所有这些信息可能导致从命令行创建表需要大量的打字！幸运的是，可用的图形化工具让这个过程变得简单了一些，但在进入简单操作之前，让我们先看看如何使用命令行创建表，以便学习语句的\
  \ SQL 格式。\n\n### 使用命令行界面操作表\n\n在 MySQL CLI 中，你使用 `CREATE TABLE` 语句来构建新表。以下是 `CREATE\
  \ TABLE` 语句的基本格式：\n\n```\nCREATE TABLE name (field1 datatype constraints, field2\
  \ datatype constraints…);\n```\n\n你必须定义每个单独的数据字段，指定字段名、数据类型以及应用到该字段的任何数据约束。对于具有许多字段的表，这可能会变成一个非常长的语句！\n\
  \n数据库管理员通常不会尝试在一个 `CREATE` 语句中包含创建表所需的所有信息，而是利用 `ALTER TABLE` 语句。该语句用于修改现有表的定义。\n\
  \n#### 定义基础表\n\n按照以下步骤创建一个简单的表：\n\n1. **打开 MySQL CLI 并登录服务器。**\n2. **通过输入以下命令使用\
  \ `dbtest1` 为默认数据库：**\n   ```sql\n   use dbtest1;\n   ```\n3. **输入 `CREATE TABLE`\
  \ 语句的开头，定义表名并加上左括号：**\n4. **输入各个数据字段及其类型，每行末尾加逗号；在最后一个数据字段之后，添加右括号和分号以完成语句：**\n\
  ```sql\nCREATE TABLE employees (\nemployeeid int,\nlastname varchar(50),\nfirstname\
  \ varchar(50),\ndepartmentcode char(5),\nstartdate date,\nsalary float\n   );\n\
  ```\n\n这创建了一个基础表，定义了表名和数据字段，但省略了任何数据约束和索引。你可以使用 `SHOW TABLES` 语句检查表是否已创建：\n\n```sql\n\
  SHOW TABLES;\n```\n\n如果你想查看表中包含的数据字段，可以使用 `SHOW CREATE TABLE` 语句：\n\n```sql\nSHOW\
  \ CREATE TABLE employees;\n```\n\n现在基础表已经存在了，你可以添加任何所需的数据约束和索引。\n\n\n\n\n\n在创建表后，你可以使用\
  \ `ALTER TABLE` 语句添加、修改或删除数据字段。以下是 `ALTER TABLE` 语句的格式：\n\n`ALTER TABLE tablename\
  \ action`\n\n`action` 参数可以是一个或多个用于修改表的 SQL 命令。MySQL 定义了许多你可以在现有表上执行的动作。表 3-1 列出并描述了你可能可能想要使用的更常用的命令。\n\
  \n| 操作 | 描述 |\n| --- | --- |\n| `ADD COLUMN name` | 向表中添加新列（数据字段）。 |\n| `DROP COLUMN\
  \ name` | 从表中删除现有的列。 |\n| `ALTER COLUMN name MODIFY action` | 根据指定的操作更改现有列的定义。 |\n\
  | `ADD constraint` | 为表添加新的数据约束。 |\n| `DROP constraint` | 从表中删除现有的数据约束。 |\n| `RENAME\
  \ COLUMN old TO new` | 修改表表列的名称。 |\n| `RENAME TO new` | 修改表名。 |\n\n表 3-1 ALTER TABLE\
  \ 操作\n\n如你从表 3-1 中所示，在 MySQL 中使用 `ALTER TABLE` 语句可以对现有表进行许多更改！按照以下步骤尝试其中一些操作：\n\n\
  1. **打开 MySQL CLI 并使用 root 用户账户登录。**\n2. **通过输入 `USE` 命令将 `dbtest1` 数据库设置为默认数据库：**\n\
  \   ```\n   MariaDB [(none)]> use dbtest1;\n   Database changed\n   MariaDB [dbtest1]>\n\
  \   ```\n3. **提交一个 `ALTER TABLE` 语句为 `employeeid` 数据字段添加主键数据约束：**\n   ```\n   MariaDB\
  \ [dbtest1]> ALTER TABLE employees add primary key (employeeid);\n   Query OK, 0\
  \ rows affected (0.57 sec)\n   Records: 0 Duplicates: 0 Warnings: 0\n   MariaDB\
  \ [dbtest1]>\n   ```\n4. **提交一个 `ALTER TABLE` 语句为 `lastname` 数据字段添加 `NOT NULL` 数据约束：**\n\
  \   ```\n   MariaDB [dbtest1]> ALTER TABLE employees MODIFY lastname varchar(50)\
  \ NOT NULL;\n   Query OK, 0 rows affected (0.58 sec)\n   Records: 0 Duplicates:\
  \ 0 Warnings: 0\n   MariaDB [dbtest1]>\n   ```\n5. **输入一个 `ALTER TABLE` 语句添加名为 `birthdate`\
  \ 的新数据字段，使用 `date` 数据类型：**\n   ```\n   MariaDB [dbtest1]> ALTER TABLE employees\
  \ ADD COLUMN birthdate date;\n   Query OK, 0 rows affected (0.30 sec)\n   Records:\
  \ 0 Duplicates: 0 Warnings: 0\n   MariaDB [dbtest1]>\n   ```\n\n为了确保表更改实际生效，再次使用\
  \ `SHOW CREATE TABLE` 语句：\n\n```\nMariaDB [dbtest1]> SHOW CREATE TABLE employees;\n\
  +-----------+--------------------------------+\n| Table | Create Table |\n+-----------+--------------------------------+\n\
  | employees | CREATE TABLE `employees` ( |\n| `employeeid` int(11) NOT NULL, |\n\
  | `lastname` varchar(50) NOT NULL, |\n| `firstname` varchar(50) DEFAULT NULL, |\n\
  | `birthdate` date, |\n| PRIMARY KEY (`employeeid`) |\n| ) ENGINE=InnoDB) |\n+-----------+--------------------------------+\n\
  1 row set (0.00 sec)\nMariaDB [dbtest1]>\n```\n\n\n\n\n### 5. 在顶部的表单字段中填写 `employeeid`\
