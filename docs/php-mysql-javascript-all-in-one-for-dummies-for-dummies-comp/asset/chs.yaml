  \ 使用 jQuery AJAX 库\n## 4. 在 AJAX 中传输数据\n## 5. 修改 AuctionHelper 应用\n\n# 4. 第 4 章：扩展\
  \ WordPress](#37_9781119468387-bk06ch04.xhtml)\n\n## 1. 了解 WordPress\n## 2. 安装 WordPress\n\
  ## 3. 检查仪表面板\n## 4. 使用 WordPress\n## 5. 探索插件世界\n## 6. 创建你自己的组件\n\n# 第 1 章\n# 设计面向对象的应用\n\
  \n在本章中\n\n- **定义应用需求**\n- **设计应用数据库**\n- **创建应用对象**\n- **设计并构建应用布局**\n\n如果你是按顺序阅读这本书的，之前的五本微型书籍已经带你学习了\
  \ HTML、CSS、JavaScript、PHP 和 `MySQL` 数据库服务器的基础知识。现在你已经了解了创建动态 Web 应用所需的所有部分，这本微型书籍将把它们整合在一起，真正地创建一个动态\
  \ Web 应用！\n\n不过，在深入编写代码之前，最好的做法是坐下来规划好你想创建什么种类型的应用。本章将带你完成设计动态 Web 应用的过程。首先，它将向你展示如何获取应用的功能需求。在开始构建之前，知道你正在构建什么是非常重要的！接下来，本章将讨论构建应用所需的数据库元素，以及如何构建跟踪数据的\
  \ `PHP` 对象。最后，本章将讨论如何设计 Web 应用的用户界面部分，并构建应用网站的初步模板。\n\n## 确定应用需求\n\n编写动态 Web 应用的第一步是定义应用的功能需求。许多项目在开始编码之前由于没有准确定义客户或用户所需的预期，从而导致了失败。\n\
  \n对于这个项目，我将要求你创建一个 `AuctionHelper` Web 应用，用于学校无声拍卖。无声拍卖是许多学校和其他非营利组织常用的筹款活动。在无声拍卖中，物品由当地企业捐赠以支持该组织。物品可以是实物（例如由著名运动员签名的足球），也可以是服务（例如当地理发店的免费理发服务）。在拍卖会上，物品会与每件物品的报名表一起展示。竞价者可以在现场走动，通过在相应物品的报名表上写下出价来竞标。（这就是拍卖的“无声”之处——没有拍卖师对你大喊大叫，你也不必担心意外举手！）当活动结束时，某物品出价最高的竞价者赢得该物品。\n\
  \n在与拍卖活动组织者交流后，你确定了一份他们希望你的 Web 应用完成的需求列表：\n\n- **跟踪竞价者信息，如竞价者姓名、地址和电话号码。** 每个竞价者在注册时都会由拍卖组织者分配一个唯一的竞价编号。\n\
  - **跟踪物品信息，如物品名称、基本描述和转售价格。** 拍卖组织者还会为每个物品分配一个唯一的物品编号用于跟踪该物品。\n- **跟踪每个物品的中标价。**\
  \ 不需要跟踪单次出价，只需跟踪中标价。\n- **在活动结束时列出竞价者赢得的物品。**\n- **为志愿者实时显示无声拍卖活动的总量。**\n\n根据这些功能需求，你可以为应用必须执行的各个功能创建一个清单。这将帮助你定义需要哪些\
  \ Web 页面以及你需要创建哪些 `PHP` 代码。该清单如下：\n\n- 创建新竞价者。\n- 修改现有的竞价者。\n- 删除现有的竞价者。\n- 列出竞价者赢得的物品。\n\
  - 创建新物品。\n- 修改现有的物品。\n- 删除现有的物品。\n- 为物品分配中标竞价者和价格。\n\n你将无法使用 `PHP` 实现最后一个需求——实时显示拍卖信息。`PHP`\
  \ 要求——（注：此处原文存在重复逻辑错误，已按核心语义处理）。\n\n\n\n\n除了处理应用程序数据所需的那两个表外，你还需要为应用程序创建另一个表。你可能希望你的应用程序受到保护——你不希望任何人都能使用该应用程序并修改信息。为了实现这一点，你需要创建一个登录页面，让拍卖志愿者可以使用用户\
  \ ID 和密码登录以访问应用程序。为了支持这一功能，你需要创建一个 `Admins` 表来跟踪用户及其密码。表 1-3 显示了 `Admins` 表应该的样式。\n\
  \n| 数据字段 | 数据类型 |\n| --- | --- |\n| `userid` | `varchar(20)` |\n| `name` | `varchar(100)`\
  \ |\n| `password` | `char(64)` |\n\n表 1-3 Admins 表布局\n\n`userid` 数据字段是每个志愿者登录应用程序时使用的字段。`name`\
  \ 数据字段跟踪分配给该用户 ID 的志愿者的全名。`password` 数据字段可能有点误导。你不会以明文形式将密码保存在 `Admins` 表中。相反将使用\
  \ MySQL 的 `SHA2()` 函数，该函数使用 SHA-2 加密标准从密码文本创建哈希值：\n\n```\nMariaDB [(none)]> select\
  \ sha2('myL0ngP@ssword', 256);\n+------------------------------------------------------------------+\n\
  | sha2('myL0ngP@ssword', 256) |\n+------------------------------------------------------------------+\n\
  | 3cdfa761361762ddedc25ea1428db10a92e327325f490f7f34f1b1b91d994f22 |\n+------------------------------------------------------------------+\n\
  1 row in set (0.00 sec)\nMariaDB [(none)]>\n```\n\n将密码作为加密值存储有助于在 `Admins` 表被攻击者攻破时保护用户密码。`SHA2()`\
  \ 函数的第二个参数指定了加密的长度。从输出可以看出，256 会从明文生成一个 64 字节的哈希值，因此你需要一个 64 字节的数据类型字段来存储该值。`char(64)`\
  \ 数据类型完全可以胜任。\n\n在存储密码时，你可以在为应用程序添加新用户账户时，直接在 `INSERT` 语句中使用 `SHA2()` 函数：\n\n```\n\
  INSERT INTO admins VALUES ('rich', 'Rich Blum', SHA2('myL0ngP@ssword',256));\n```\n\
  \n![warning](img/warning.png) 使用 `SHA2()` 函数的缺点是它生成的值无法解密以确定原始文本（这被称为单向加密算法）。检查密码是否与存储值匹配的方法是对其进行加密，然后比较这两个加密值。这意味着如果志愿者忘记了他的密码，没有办法知道密码是什么。你所做的只能为志愿者分配一个新密码。\n\
  \n有了数据库布局后，你已经准备好在 MySQL 中创建数据库元素了。\n\n### 创建数据库\n\n你可以使用 MySQL 命令行界面 (CLI)、MySQL\
  \ Workbench 图形工具或 phpMyAdmin Web 端工具来创建应用程序所需的数据库和表。你还需要在 MySQL 服务器中创建一个应用程序用户账户，并授予其读取、修改和删除应用程序数据库表中数据的权限。\n\
  \n以下步骤显示了创建数据库、用户账户和表所需的 SQL 语句。你可以使用任何你喜欢的 MySQL 界面来输入 SQL 语句。\n\n1. **登录你选择的 MySQL\
  \ 界面：**\n\n```\nC:\\Users\\rich>cd \\xampp\\mysql\\bin\nC:\\xampp\\mysql\\bin> mysql\
  \ --user=root --password\nEnter password:\nWelcome to the MariaDB monitor. Commands\
  \ end with ; or \\g.\nYour MariaDB connection id is 2\nServer version: 10.1.28-MariaDB\
  \ mariadb.org binary distribution\nCopyright (c) 2000, 2017, Oracle, MariaDB Corporation\
  \ Ab and others.\nType 'help;' or '\\h' for help. Type '\\c' to clear the current\
  \ input statement.\nMariaDB [(none)]>\n```\n\n2. **创建一个名为 `auction` 的 AuctionHelper\
  \ 数据库：**\n\n```\nMariaDB [(none)]> CREATE DATABASE auction;\nQuery OK, 1 row affected\
  \ (0.09 sec)\nMariaDB [(none)]>\n```\n\n3. **为 AuctionHelper 应用程序创建一个名为 `ah_user`\
  \ 的 MySQL 用户账户，并为其分配密码 `AuctionHelper`：**\n\n```\nMariaDB [(none)]> CREATE USER\
  \ 'ah_user'@'localhost'\n-> IDENTIFIED BY 'AuctionHelper';\n```\n\n4. **授予 ah_user\
  \ 用户权限：**\n\n```\nMariaDB [(none)]> GRANT SELECT,INSERT,DELETE ON auction.* TO 'ah_user'@'localhost';\n\
  Query OK, 0 rows affected (sec)\n```\n\n5. **创建 Bidders 表：**\n\n```\nMariaDB [(none)]>\
  \ CREATE TABLE bidders (\nbidderid int primary key,\nlastname varchar(100),\nfirstname\
  \ varchar(100),\naddress varchar(200),\nphone varchar(20));\nQuery OK, 0 rows affected\
  \ (sec)\n```\n\n6. **创建 Items 表：**\n\n```\nMariaDB [(none)]> CREATE TABLE items\
  \ (\nitemid int primary key,\nname varchar(100),\ndescription text,\nresaleprice\
  \ decimal(10,2),\nwinderder int,\nwinprice decimal(10,2));\nQuery OK, 0 rows affected\
  \ (sec)\n```\n\n7. **创建 Admins 表：**\n\n```\nMariaDB [(none)]> CREATE TABLE admins\
  \ (\nuserid varchar(20) primary key,\nname varchar(100),\npassword char(64));\n\
  Query OK, 0 rows affected (sec)\n```\n\n8. **在 Admins 表中插入用户账户用于测试：**\n\n```\nMariaDB\
  \ [(none)]> INSERT INTO admins VALUES ('rich', 'Rich Blum', SHA2('myL0ngP@ssword',256));\n\
  Query OK, 1 row affected (sec)\n```\n\n9. **显示表以确保它们已创建，然后退出你的 MySQL 工具：**\n\n```\n\
  MariaDB [(none)]> SHOW TABLES;\n+-------------------+\n| Tables_in_auction |\n+-------------------+\n\
  | admins |\n| bidders |\n| items |\n+-------------------+\n3 rows in set (0.00 sec)\n\
  MariaDB [(none)]>\n```\n\n就是这些！你现在已经完成了 AuctionHelper 应用程序的数据库结构构建。\n\n下一步是开始创建用于在\
  \ Web 应用程序中跟踪数据的 PHP 对象。这些对象将成为 PHP 应用程序与 MySQL 数据库之间的接口。下一节将展示如何操作。\n\n\n\n\n\n\
  由于你已经决定将 AuctionHelper 应用程序作为一个面向对象的应用程序，因此你需要创建一些 PHP 对象来表示应用程序中的数据项。本节将介绍用于应用程序的对象的设计过程，以及如何编写\
  \ PHP 代码来创建这些对象。\n\n## 设计对象\n\n编写面向对象程序的第一步是确定应用程序完成其任务所需的对象。通常，你也可以根据数据库的设计工作来确定对象的需求。AuctionHelper\
  \ 应用程序显然使用了不同类型的数据对象：\n\n*   竞者 (Bidders)\n*   拍卖物品 (Auction items)\n\n为这些数据组中的每一个创建一个单独的对象以帮助处理\
  \ PHP 内部的数据库表是合理的。接下来的两个部分将介绍这些每个对象的定义。\n\n### Bidder 对象\n\n`Bidder` 对象将跟踪与应用程序中的竞者交互所需的属性和方法。Bidders\
  \ 表中的每个数据字段都将是 `Bidder` 对象中的一个独立属性。这产生了以下属性：\n\n*   `bidderid`\n*   `lastname`\n\
  *   `firstname`\n*   `address`\n*   `phone`\n\n由于对象的属性与表数据字段镜像，你能够将应用程序的竞者数据存储为\
  \ `Bidder` 对象，然后使用 `Bidder` 对象的方法将该对象直接写入数据库！\n\n你需要为 `Bidder` 对象创建的方法镜像了 AuctionHelper\
  \ 应用程序需要的功能：\n\n*   `saveBidder`: 将 `Bidder` 对象数据存储到 Bidders 表。\n*   `updateBidder`:\
  \ 修改 Bidders 表中现有的竞者数据记录。\n*   `removeBidder`: 从 Bidders 表中删除现有的竞者数据记录。\n*   `findBidder`:\
  \ 根据 `bidderid` 值在 Bidders 表中查找竞者信息。\n*   `getBidders`: 获取 Bidders 表中所有竞者的列表。\n\n\
  最后两个方法与前三个略有不同。前三个方法作用于 `Bidder` 对象的现有实例。最后两个对象则从 Bidders 表中检索数据并创建 `Bidder` 对象。由于它们没有使用现有的\
  \ `Bidder` 对象实例，因此它们被称为静态方法。静态方法允许你直接从类调用方法，而不需要现有的对象实例。\n\n![tip](img/tip.png)\
  \ 除了这些方法外，你还需要创建一个 `__construct()` 方法来创建一个新的 `Bidder` 对象，以及一个 `__tostring()` 方法，以便你可以轻松地将存储在对象中的\
  \ `Bidder` 对象信息作为字符串值显示在应用程序中。\n\n### Item 对象\n\n`Item` 对象将跟踪与应用程序中的拍卖物品交互所需的属性和方法。同样这将这将\
  \ Items 表中的数据字段匹配，它需要以下属性：\n\n*   `itemid`\n*   `name`\n*   `description`\n*   `resaleprice`\n\
  *   `winbidder`\n*   `winprice`\n\n`Item` 对象所需的方法镜像了 AuctionHelper 应用程序的功能需求：\n\n\
  *   `saveItem`: 将 `Item` 对象数据存储到 Items 表。\n*   `updateItem`: 修改 Items 表中现有的数据记录。\n\
  *   `removeItem`: 删除 Items 表中现有的数据记录。\n*   `findItem`: 根据 `itemid` 值从 Items 表中检索特定的数据记录。\n\
  *   `getItems`: 从 Items 表中检索所有物品。\n*   `getItemsbyBidder`: 从 Items 表中检索所有特定 `bidderid`\
  \ 作为 `winbidder` 值的物品。\n\n前三个方法需要现有的 `Item` 对象实例，而后三个是返回 `Item` 对象的静态方法。\n\n通过这些方法，你将能够与\
  \ MySQL 数据库交互以管理拍卖物品。下一步是编写实现这些方法的代码。\n\n## 在 PHP 中编写对象\n\n在你设计好应用程序对象应该什么样之后，你就可以创建\
  \ PHP 代码来定义它们。列表 1-1 显示了定义 `Bidder` 类对象的代码。\n\n列表 1-1 Bidder 类对象的 PHP 代码\n\n```php\n\
  <?php\nclass Bidder {\n    public $bidderid;\n    public $lastname;\n    public\
  \ $firstname;\n    public $address;\n    public $phone;\n\n    function __construct($bidderid,\
  \ $lname, $fname, $address, $phone) {\n        $this->bidderid = $bidderid;\n  \
  \      $this->lastname = $lname;\n        $this->firstname = $fname;\n        $this->address\
  \ = $address;\n        $this->phone = $phone;\n    }\n\n    function __toString()\
  \ {\n        $output = \"<h2>Bidder Number: $this->bidderid</h2>\\n\" .\n      \
  \  \"<h2>$this->lastname, $this->firstname</h2>\\n\" .\n        \"<h2>$this->address</h2>\"\
  ;\n        return $output;\n    }\n\n    function saveBidder() {\n        $db =\
  \ new mysqli(\"localhost\", \"user\", \"auction\");\n        $query = \"INSERT INTO\
  \ Bidders VALUES (?, ?, ?, ?)\";\n        $stmt = $db->prepare($query);\n      \
  \  $stmt->bind_param(\"issss\", $this->bidderid, $this->lastname, $this->firstname,\
  \ $this->address, $this->phone);\n        $stmt->execute();\n        $db->close();\n\
  \    }\n\n    function updateBidder() {\n        $db = new mysqli(\"localhost\"\
  , \"user\", \"auction\");\n        $query = \"UPDATE Bidders SET lastname = ?, firstname\
  \ = ?, address = ?, phone = ? WHERE bidderid = ?\";\n        $stmt = $db->prepare($query);\n\
  \        $stmt->bind_param(\"sssi\", $this->lastname, $this->firstname, $this->address,\
  \ $this->phone, $this->bidderid);\n        $stmt->execute();\n        $db->close();\n\
  \    }\n\n    function removeBidder() {\n        $db = new mysqli(\"localhost\"\
  , \"user\", \"auction\");\n        $query = \"DELETE FROM Bidders WHERE bidderid\
  \ = ?\";\n        $stmt = $db->prepare($query);\n        $stmt->bind_param(\"i\"\
  , $this->bidderid);\n        $stmt->execute();\n        $db->close();\n    }\n\n\
  \    static function findBidder($bidderid) {\n        $db = new mysqli(\"localhost\"\
  , \"user\", \"auction\");\n        $query = \"SELECT * FROM Bidders WHERE bidderid\
  \ = $bidderid\";\n        $result = $db->query($query);\n        $row = $result->fetch_array(MYSQLI_ASSOC);\n\
  \        if ($row) {\n            $bidder = new Bidder($row['bidderid'], $row['lastname'],\
  \ $row['firstname'], $row['address'], $row['phone']);\n            $db->close();\n\
  \            return $bidder;\n        } else {\n            $db->close();\n    \
