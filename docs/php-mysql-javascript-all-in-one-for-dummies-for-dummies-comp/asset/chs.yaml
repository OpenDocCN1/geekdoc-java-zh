  \ jQuery 库文件。\n\n### jQuery $.get() 函数\n\n`$.ajax()` 函数可以帮助稍微简化你的代码，但为了使连接工作，仍需要在设置中输入大量信息。当你创建不同的\
  \ AJAX 应用时，你会发现使用的许多设置在程序之间是保持相同的。为了方便起，jQuery 库包含了 `$.get()` 函数。\n\n`$.get()` 函数假设了\
  \ `$.ajax()` 函数中使用的常用设置值，因此你只需要指定几个内容：\n\n```javascript\n$.get('myprog.php').done(function(response)\
  \ {\n  var result = response;\n}).fail(function(response) {\n  console.log('Error:\
  \ ' + response);\n});\n```\n\n这让事情变得真正简单！按照以下步骤修改 `ajaxcars2.html` 文件以使用 `$.get()`\
  \ jQuery 函数：\n\n1. **在编辑器中打开 `ajaxcars2.html` 文件。**\n\n2. **修改代码，将 `$.ajax()` 函数替换为\
