  <h2>更新竞价者 $bidderid 时出现问题</h2>\\n\";\n        }\n    }\n}\n {\n```\n\n\n\n\n```php\n\
  echo \"<h2>Update Canceled for bidder $bidderid</h2>\\n\";\n}\n} else {\n    echo\
  \ \"<h2>Please login first</h2>\\n\";\n}\n?>\n```\n\n2. **将文件保存到 `auction` 文件夹中名为\
  \ `changebidder.inc.php`。**\n\n`changebidder.inc.php` 代码首先检查登录话 cookie 是否存在，以确保用户已正确登录应用程序。然后，它获取\
  \ `$_POST['answer']` 值。这决定了用户选择了表单中的哪个按钮（继续更新或取消更新）。如果用户点击了更新（Update）按钮，代码将获取 `bidderid`\
  \ 值，并使用 `findBidder()` 静态方法从 Bidders 表中检索数据记录。接着，使用 `$_POST[]` 数组变量获取表单的其他数据，并用新数据更新\
  \ `Bidder` 对象的属性。最后，代码使用 `updateBidder()` 方法将新值提交到数据库。\n\n### 添加新竞价者\n\n当应用程序用户点击导航链接添加新竞价者时，会触发\
