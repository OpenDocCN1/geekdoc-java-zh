  \ 窗口。\n\n恭喜！你已经拥有了一个动态 Web 应用程序的开头！\n\n# 第 2 章：实现面向对象的应用程序\n\n**本章内容**\n\n*   **处理\
  \ Web 事件**\n*   **创建与对象交互的代码**\n*   **测试驱动你的应用程序**\n\n如果你刚刚读完这本微型书籍的第 1 章，请花点时间深呼吸！你为\
  \ `AuctionHelper` 应用程序准备数据库、PHP 对象以及 HTML 和 CSS 模板已经付出了大量工作。本章将介绍如何创建完成该应用程序所需的其余\
  \ PHP 代码。首先，它将介绍 `AuctionHelper` 应用程序链接和按钮的整体布局，并讨论如何处理由这些链接触发的浏览器事件。这些就是你的应用程序用户与网站交互的方式。然后，它将介绍处理你已创建的竞价者和物品对象所需\
  \ PHP 代码。最后，本章将通过讨论如何测试应用程序以确保一切运行正常来结束。\n\n## 处理事件\n\n基于 Web 的应用程序使用所谓的事件驱动编程。在事件驱动编程中，程序的执行流基于程序用户从用户界面生成的事件。程序显示用户界面，然后等待并监听事件发生。当程序用户点击网页上的每个链接或按钮时，应用程序会运行不同的包含文件集，以生成其在主\
  \ 页面区域中显示的内容。\n\n图 2-1 让你回想起用户登录应用程序时，主 `AuctionHelper` 网页的样子。\n\n![image](img/9781119468387-fg060201.png)\n\
  \nFIGURE 2-1: 主 `AuctionHelper` 网页。\n\n从主页面开始，导航区域（网页左侧部分）中的链接和按钮控制应用程序事件。四个可用链接：\n\
  \n*   列出竞价者\n*   添加新竞价者\n*   列出物品\n*   添加新物品\n\n下方是两个搜索框：\n\n*   搜索物品\n*   搜索特定竞价者\n\
  \n每个事件（无论是链接还是按钮）都会从用户的浏览器向 Web 服务器发送新请求，然后服务器将 `index.php` 文件传递给 PHP 服务器处理，同时带有\
  \ `content` HTML 变量及其值。后续章节将讨论如何创建处理这些事件的 PHP 代码。\n\n## 竞价者对象事件\n\n本节将介绍你需要创建的 PHP\
  \ 代码以响应导航菜单中以竞价者为对象的事件。这允许你添加、更改和删除竞价者，并显示有关特定竞价者在无声拍卖中赢得物品的信息。\n\n### 列出竞价者\n\n\
  当你的应用程序用户点击导航菜单中的“List Bidders”链接时（参见图 2-1），链接 URL 将用户浏览器传递到 `index.php` 主文件，并将\
  \ `content` HTML 变量 设置为链接 URL 中的值 `listbidders`：\n\n```html\n<a href=\"index.php?content=listbidders\"\
  >\n```\n\n`index.php` 文件中的代码告诉 PHP 服务器获取 `listbidders.inc.php` 包含文件用于主内容部分。你需要创建\
  \ `listbidders.inc.php` 代码文件，以显示 Bidders 表中当前竞价者的列表。\n\n按照以下步骤创建 `listbidders.inc.php`\
  \ 文件：\n\n1.  **打开你喜爱的文本编辑器、程序编辑器或集成开发环境 (IDE) 包。**\n2.  **输入以下代码：**\n\n```php\n\
  <?php\necho \"<script language=\\\"javascript\\\">\\n\";\necho \"function listbox_dblclick()\
  \ {\\n\";\necho \"document.bidders.displaybidder.click() }\\n\";\necho \"</script>\\\
  n\";\necho \"<script language=\\\"javascript\\\">\\n\";\necho \"function button_click(target)\
  \ {\\n\";\necho \"if(target==0) bidders.action=\\\"index.php?content=displaybidder\\\
  \"\\n\";\necho \"if(target==1) bidders.action=\\\"index.php?content=removebidder\\\
  \"\\n\";\necho \"if(target==2) bidders.action=\\\"index.php?content=displaybidder\\\
  \"\\n\";\necho \"}\\n\";\necho \"</script>\\n\";\necho \"<h2>Select Bidder</h2>\\\
  n\";\necho \"<form name=\\\"bidders\\\" method=\\\"post\\\">\\n\";\necho \"<select\
  \ ondblclick=\\\"listbox_dblclick()\\\" name=\\\"bidder\\\" size=\\\"20\\\">\\n\"\
  ;\n$bidders = Bidder::getBidders();\nforeach($bidders as $bidder) {\n$bidderid =\
