  \ `additem.inc.php` 文件。按照以下步骤创建该文件：\n\n1. **打开你的编辑器并输入以下代码：**\n\n```php\n<?php\n\
  if (isset($_SESSION['login'])) {\n    $itemid = $_POST['itemid'];\n    if ((trim($itemid)\
  \ == '') OR (!is_numeric($itemid)))\n    {\n        echo \"<h2>Sorry, you must enter\
  \ a valid item ID number</h2>\\n\";\n    } else\n    {\n        $name = $_POST['name'];\n\
  \        $description = $_POST['description'];\n        $resaleprice = $_POST['resaleprice'];\n\
  \        $winbidder = $_POST['winbidder'];\n        $winprice = $_POST['winprice'];\n\
  \        $item = new Item($itemid, $name, $description, $resaleprice, $winbidder,\
  \ $winprice);\n        $result = $item->saveItem();\n        if ($result)\n    \
  \    echo \"<h2>New Item #$itemid successfully added</h2>\\n\";\n        else\n\
  \        echo \"<h2>Sorry, there was a problem adding that item</h2>\\n\";\n   \
  \ }\n} else {\n    echo \"<h2>Please login first</h2>\\n\";\n}\n?>\n```\n\n2. **将文件保存到\
  \ `auction` 文件夹中，命名为 `additem.inc.php`。**\n\n`additem.inc.php` 代码首先检查用户是否已正确登录。然后它获取\
  \ `itemid` 并确保该值不为空且有效数字。接着，它获取由 `newitem.inc.php` 表单提交的其他表单数据，并使用它们创建一个新的 `Item`\
  \ 对象。最后，它使用 `Item` 对象的 `saveItem()` 方法将新项目信息作为数据记录存储在 Bidders 表中。\n\n### 搜索项目\n\n\
  就像竞拍者一样，一次成功的无声拍卖活动可能包含数百个独立的待拍项目！当需要为拍卖项目分配中标者和价格时，你肯定不希望拍卖志愿者要在项目列表框中翻找要更新的某一个项目。这时搜索框就派上用场了。\n\
  \n导航部分包含了用于为项目创建简易搜索文本框的 HTML 代码：\n\n```html\n<form action=\"index.php\" method=\"\
  post\">\n<label>Search for item:</label><br>\n<input type=\"text\" name=\"itemid\"\
  \ size=\"14\" >\n<input type=\"submit\" value=\"search\">\n<input type=\"hidden\"\
  \ name=\"content\" value=\"find\">\n</form>\n```\n\n### 退出 应用程序\n\n为了允许用户退出，你需要创建一个\
  \ `logout.inc.php` 文件。该文件将移除会话 Cookie 并用户重定向回登录页面。在导航菜单中，包含退出链接：\n\n```html\n<tr><td><a\
  \ href=\"index.php?content=logout\">Logout</a></td></tr>\n```\n\n`logout.inc.php`\
  \ 文件检查登录会话。按照以下步骤创建它：\n\n1. **打开你的编辑器并输入以下代码：**\n\n```php\n<?php\nif (isset($_SESSION['login']))\
  \ {\n    unset($_SESSION['login']);\n}\nheader(\"Location: index.php\");\n?>\n```\n\
  \n2. **将文件保存到 `auction` 文件夹中，命名为 `logout.inc.php`。**\n\n3. **你终于可以关闭编辑器了——你完成了！**\n\
  \nPHP 服务器必须在任何 HTML 代码之前发送由 `header()` 函数生成的 HTTP 信息。由于此应用程序在包含文件中使用了 `header()`\
  \ 函数，情况不再如此。允许你这样操作的是 `output_buffer` 设置。如果你在 `php.ini` 配置中启用该设置，PHP 服务器将缓冲所有输出。然后以流的形式发送所有输出。输出缓冲区非常智能，会将任何\
  \ HTTP 信息重新排列到缓冲区前端优先发送。\n\n## 测试 Web 应用程序\n\n恭喜！如果你一直遵循最后两个章节的代码，你刚刚完成了一个功能完整的动态\
  \ Web 应用程序，用于跟踪拍卖数据。然而，在设计网站并创建代码之后，开发工作并没有停止。在将应用程序交付给客户之前，你必须确保运行正常。\n\n这个过程涉及测试。动态\
  \ Web 应用程序通常可以进行四个级别的测试。从低到高分别是：\n\n- **单元测试：** 对单个代码段进行测试，以确保没有语法或逻辑错误。\n- **集成测试：**\
  \ 对不同代码段之间的数据传递进行测试，以确保没有数据不匹配。\n\n\n\n\n\n## 测试\n\n*   **系统测试：** 对整个网站进行测试，以确保所有功能正常运行且没有缺失。\n\
  *   **验收测试：** 你的客户测试网站，以确保其运行符合他们的规范，并且他们能够理解用户界面。\n\n在 PHP 应用程序中，你通常会在创建的每个用于响应事件的包含文件（include\
  \ file）中执行单元测试。确保当你点击网页上的链接时，正确的包含文件会被触发，并正确地完成其工作。\n\n在执行单元测试时，请注意 PHP 警告（warnings）以及错误（errors）。警告可能对应用程序的结果产生不利影响，但误用\
  \ PHP 代码是一种糟糕的编程习惯，即使它没有导致致命错误。\n\n带有包含文件的集成测试可能会有点复杂。在包含文件的海洋中很容易迷失方向，即使是在像 `AuctionHelper`\
  \ 这样的小型应用程序中也是如此。绘制流程图会有帮助，显示哪些包含文件是由事件触发的，哪些包含文件依赖于其他包含文件。图 2-9 显示了 `AuctionHelper`\
  \ 应用程序使用的包含文件的简单流程图。\n\n![image](img/9781119468387-fg060209.png)\n\n图 2-9： `AuctionHelper`\
  \ 包含文件的流程图。\n\n在函数依赖于两个独立包含文件的情况下（例如从 `newbidder.inc.php` 包含文件将新竞价者信息传递给 `addbidder.inc.php`\
  \ 包含文件），集成测试必须确保所有数据值都已正确传递。\n\n系统测试要求你（最好是别人）从头到尾运行整个应用程序。每个链接和按钮事件都必须正常运行，并在网页上生成恰当的内容。系统测试通常会回溯到客户定义的原始功能需求，确保应用程序满足了每一项需求。\n\
  \n最后，你准备好将你的作品交给客户进行验收测试了。为每个需求功能准备一份清单通常很有帮助，以确保客户不会测试应用程序的所有功能。如果你还需要为该应用程序创建用户指南，这里也是测试该指南的好地方！\n\
  \n尽管如此，原始需求中仍然有一个尚未实现的最终功能。如果你还记得本迷你书的第 1 章，原始需求之一是为拍卖总额提供实时统计数据。你创建了一个显示数据的区域，但你并没有实际创建这些数据。这需要一些你尚未见过的\
  \ JavaScript 技巧，因此我把它们留在了另一个章节。\n\n# 第 3 章：使用 AJAX\n\n## 本章内容\n\n![check](img/check.png)\
  \ **熟悉 AJAX**\n\n![check](img/check.png) **使用 JavaScript 进行通信**\n\n![check](img/check.png)\
  \ **配合 jQuery 和 AJAX 工作**\n\n![check](img/check.png) **使用 XML 传输数据**\n\n![check](img/check.png)\
  \ **为 AuctionHelper 添加 AJAX**\n\n本迷你书的前两个章节详细介绍了 `AuctionHelper` 应用程序，这是一个用于支持无声拍卖的动态\
  \ Web 应用程序。该项目有一个我尚未涵盖的需求——使用实时数据更新网页的能力。实现这需要的不仅仅是 PHP 甚至是 JavaScript。它需要使用一种结合了这两种语言的新技术！本章将讨论这种技术到底是什么，如何在不重新加载网页的情况下在网页上生成动态内容，这是你的\
  \ Web 应用程序中一个非常棒的功能！\n\n## 了解 AJAX\n\n动态 Web 编程领域最新的技术之一是`异步 JavaScript 和 XML`（简称\
  \ AJAX）。这个名字既不是指家用清洁剂，也不是希腊神话中的人物。它也不是指一种新的编程语言。\n\n相反，AJAX 指的是一种结合多种现有的 Web 语言和标准并在网页上生成动态内容的方法。AJAX\
  \ 利用了以下技术：\n\n*   **JavaScript：** 在浏览器中现有网页的“后台”与服务器通信。\n*   **服务端编程语言：** 从应用程序数据库检索动态内容。\n\
  *   **可扩展标记语言 (XML)：** 将动态内容安全地传回浏览器。\n*   **HTML 和 CSS：** 将动态内容放在网页上，并为其分配样式和定位。\n\
  *   **文档对象模型 (DOM)：** 引用网页上的位置以放置动态内容。\n\n试图想象所有这些部分是如何组合在一起的可能会有点困惑。图 3-1 显示了这一切是如何运作的粗略图。\n\
  \n![image](img/9781119468387-fg060301.png)\n\n图 3-1： AJAX 的基础。\n\nAJAX 的第一步是让嵌入网页的\
  \ JavaScript 代码与服务器建立连接。网页可以是静态文件，但更多时候它利用服务端语言（如 PHP）从数据库检索数据。在 AJAX 中，从服务器检索的数据通常使用\
  \ XML 标准进行格式，尽管这不是强制要求的。最近，JavaScript 对象表示（JSON）格式变得越来越流行。\n\n当浏览器中的 JavaScript\
  \ 代码接收到新数据时，它使用 HTML 和 CSS 来放置内容，通常使用 DOM 操作将其放在现有网页中。这一切都在网站访问者查看页面时在后台进行！\n\n\
  AJAX 的关键在于创建一个可以与服务器通信的特殊对象。下一节将讨论它是什么。\n\n## 使用 JavaScript 进行通信\n\n允许 JavaScript\
  \ 代码在网页中运行并直接与服务器通信彻底改变了动态 Web 应用程序。这一功能其实并不新。微软早在 Internet Explorer 5 版本中就通过 `XMLHTTP`\
  \ 对象引入了这个功能。\n\n`XMLHTTP` 对象允许你指定一个 URL 通过 HTTP 连接到服务器并检索服务器返回的网页内容。尽管它很简单，但它引发了一场改变动态\
  \ Web 应用程序面貌的革命！\n\n缺点是微软控制标准，其他浏览器不愿采用。但很快，出现了一种 JavaScript 标准来支持这一功能，被称为 `XMLHttpRequest`\
  \ 对象。`XMLHttpRequest` 对象的作用正如其名：向服务器发送 HTTP 请求并检索响应并创建一个 XML 对象。`XMLHttpRequest`\
  \ 对象迅速流行，并被今天使用的所有主流浏览器支持。\n\n本节将介绍 `XMLHttpRequest` 对象提供的的方法和属性，以及如何使用它们从自己的网页与服务器进行通信。\n\
  \n###  XMLHttpRequest 类方法\n\n`XMLHttpRequest` 对象包含几个类方法，帮助你控制 JavaScript 程序与服务器之间的交互。表\
  \ 3-1 列出了可用的方法。\n\n| **方法** | **描述** |\n\n| --- | --- |\n\n\n\n\n\n| `abort()` |\
  \ 取消正在等待响应的现有请求 |\n| `getAllResponseHeaders()` | 获取 Web 服务器返回的 HTTP 头部信息\n| `getResponseHeader()`\
  \ | 从特定的 HTTP 头部获取信息 |\n| `open(`method`, `url`, `async`, `user`, `pass`)` | 打开到指定\
  \ Web 服务器的连接 |\n| `send(string)` | 向 Web 服务器发送请求 |\n| `setRequestHeader()` | 为请求添加\
  \ HTML 变量/值对 |\n\n# XMLHttpRequest 类方法\n\n`XMLHttpRequest` 的类方法并不多，这使得它不仅强大，而且非常易使用！在实例化一个新的\
  \ `XMLHttpRequest` 对象后，使用 `open()` 方法定义到 Web 服务器的连接，并使用 `send()` 方法将请求发送到服务器：\n\n\
  ```\nvar con = new XMLHTTPRequest();\ncon.open(\"GET\", \"myprog.php\", true);\n\
  con.send();\n```\n\n`open()` 方法的第一个参数定义了使用的 HTTP 请求类型——`GET` 方法或 `POST` 方法。第二个参数定义了发送请求的\
  \ URL。第三个参数决定连接是异步的（`true`）还是同步的（`false`）。\n\n使用同步连接，JavaScript 将停留在 `send()` 方法处，直到收到来自\
  \ Web 服务器的响应。在 JavaScript 等待期间，浏览器将不会处理网页上的任何代码或事件。这会导致网页看起来像冻结了一，因为用户无法点击任何链接或按钮。\n\
  \n使用异步连接类型，JavaScript 发送请求后继续执行程序的其余部分。当它收到 Web 服务器的响应时，它会触发你定义的回调函数来处理响应（在下一节中讨论）。这允许程序代码在等待服务器响应时继续运行，对于网页查看者来说是一个更流畅的体验。\n\
  \n![warning](img/warning.png) 虽然目前仍支持，但同步连接类型在 `XMLHttpRequest` JavaScript 标准中处于废弃过程中。在应用程序中，直接使用异步连接类型是一个良好的习惯，因为它不会对网页用户界面产生不利影响。\n\
  \n如果你定义 HTTP 请求使用 `POST` 方法发送数据，你必须将 HTML 变量/值数据对作为参数放在 `send()` 方法中：\n\n```\ncon.open(\"\
  POST\", \"myprog.php\", true);\ncon.send(\"id=100&name=rich\");\n```\n\n如果你更倾向于使用\
  \ `GET` 请求方法，可以将 HTML 变量/值数据对包含在 URL 中：\n\n```\ncon.open(\"GET\", \"myprog.php?id=100&name=rich\"\
  , true);\ncon.send();\n```\n\n某些浏览器对连接 URL 的长度有限制，因此对于大量数据最好使用 `POST` 方法。\n\n发送请求后，你需要从\
  \ Web 服务器检索响应。这需要使用几个 `XMLHttpRequest` 对象的类属性，将在下文中讨论。\n\n![warning](img/warning.png)\
  \ 由于可能被滥用的风险，大多数浏览器限制了 `XMLHttpRequest` 对象可以连接的 URL。你只能连接到加载该对象的原始网页相同域的 URL。\n\n\
  # 关注 XMLHttpRequest 类属性\n\n`XMLHttpRequest` 对象包含了几个你需要了解的类属性以便处理来自 Web 服务器的 HTTP\
  \ 响应。这些如表 3-2 所示。\n\n| 属性 | 说明 |\n| --- | --- |\n| `onreadystatechange` | 定义浏览器在\
  \ HTTP 连接状态改变时触发的回调函数 |\n| `readyState` | 包含 HTTP 连接的状态 |\n| `responseText` | 包含\
  \ Web 服务器以文本格式发送的响应 |\n| `responseXML` | 包含 Web 服务器以 XML 格式发送的响应 |\n| `status` |\
  \ 包含 Web 服务器的数字 HTTP 响应代码 |\n| `statusText` | 包含 Web 服务器的文本 HTTP 响应字符串 |\n\n在你使用\
  \ `send()` 方法向 Web 服务器发送连接请求后，HTTP 连接过程将通过五个连接状态，由 `readyState` 属性进行跟踪：\n\n* **状态\
  \ 0:** 连接尚未初始化。\n* **状态 1:** 与服务器的连接已建立。\n* **状态 2:** 服务器已接收 HTTP 请求消息。\n* **状态\
  \ 3:** 服务器正在处理 HTTP 请求。\n* **状态 4:** 服务器已发送响应。\n\n随着 HTTP 连接在这五个连接状态之间运行，`readyState`\
  \ 属性包含的值会发生变化。这导致你在 `onreadystatechange` 属性中定义的函数会在每次状态变化时触发。当 `readyState` 属性包含值\
  \ 4 时，请求的最终结果即可可用。\n\n```javascript\ncon.onreadystatechange = function() {\n   \
  \ if (this.readyState == 4 && this.status == 200) {\n        var result = this.responseText;\n\
  \    }\n};\n```\n\n# 尝试 AJAX\n\n现在你已经稍微了解了 AJAX 是如何工作的，让我们通过一个示例来学习它。在这个示例中，你编写一些代码，根据网页上另一个下拉框中的选择动态地更改下拉框中的值。按照以下步骤开始：\n\
  \n1. **打开你喜爱的文本编辑器、程序编辑器或集成开发环境 (IDE) 软件包。**\n2. **输入以下代码：**\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <title>汽车下拉列表测试</title>\n    <script language=\"javascript\"\
  \ type=\"text/javascript\">\n    function getmodels()\n    {\n        var select\
  \ = document.getElementById(\"make\");\n        var make = select.options[select.selectedIndex].value;\n\
  \        var URL = \"ajaxcars.php?make=\" + make;\n        var request = new XMLHttpRequest();\n\
  \        request.open(\"GET\", URL);\n        request.onreadystatechange = function()\
  \ {\n            if (request.readyState == 4 && request.status == 200) {\n     \
  \           var models = request.responseText.split(',');\n                var model\
  \ = document.getElementById('model');\n                if (model) {\n          \
  \          model.innerHTML = \"\";\n                    for(i = 0; i < models.length;\
  \ i++) {\n                        model.innerHTML += \"<option value='\" + models[i]\
  \ +\n                        \"'>'>\" + models[i] + \"</option>\";\n           \
  \         }\n                }\n            }\n        }\n        request.send();\n\
  \    }\n    </script>\n</head>\n<body>\n    <select id=\"make\" onchange=\"getmodels()\"\
  >\n        <option value=\"audi\">奥迪</option>\n        <option value=\"bmw\">宝马</option>\n\
  \        <option value=\"ford\">福特</option>\n    </select>\n    <select id=\"model\"\
  ></select>\n</body>\n</html>\n```\n\n\n\n\n\n```html\n}\n</script>\n</head>\n<body>\n\
  <h2>查找您的汽车</h2>\n品牌：\n<select id=\"make\" onchange=\"getmodels()\">\n<option value=\"\
  \">选择品牌</option>\n<option value=\"buick\">别克</option>\n<option value=\"chevy\">雪佛兰</option>\n\
  <option value=\"dodge\">道奇奇</option>\n<option value=\"ford\">福特</option>\n</select><br><br>\n\
  型号：\n<select id=\"model\">\n<option value=\"\">先选择品牌</option>\n</select>\n</body>\n\
  </html>\n```\n\n3. **将文件保存为** `ajaxcars1.html` **位于您 Web 服务器的 `DocumentRoot` 区域。**\n\
  \n对于 Windows 上的 XAMPP，路径为 `c:\\xampp\\htdocs`；对于 macOS 上的 XAMPP，路径为 `/Applications/XAMPP/htdocs`。\n\
  \n4. **打开一个新的编辑器窗口或标签页，输入以下代码：**\n\n```php\n<?php\n$make = $_GET['make'];\nswitch\
  \ ($make)\n{\ncase \"buick\":\necho \"Enclave,Lacrosse,Regal\";\nbreak;\ncase \"\
  chevy\":\necho \"Camero,Corvette,Impala\";\nbreak;\ncase \"dodge\":\necho \"Challenger,Charger,Viper\"\
  ;\nbreak;\ncase \"ford\":\necho \"Fusion,Mustang,Taurus\";\n}\n?>\n```\n\n5. **将文件保存为**\
  \ `ajaxcars.php` **位于您 Web 服务器的 `DocumentRoot` 文件夹中。**\n\n6. **打开浏览器然后在地址栏输入以下 URL：**\n\
  \n`http://localhost:8080/ajaxcars1.html`\n\n***注意：*** 根据您的 Web 服务器配置，您可能需要在 URL\
  \ 中使用不同的端口。\n\n7. **从“品牌”下拉框中选择一个。**\n\n当您进行选择时，“型号”下拉框中的可用选项会动态变化！\n\n由 `ajaxcars1.html`\
  \ 文件生成的初始网页如图图 3-2 所示。\n\n![image](img/9781119468387-fg060302.png)\n\n图 3-2： `ajaxcars1.html`\
  \ 初始网页。\n\n当您在“品牌”下拉框中选择时，“型号”下拉框中的可用选项会动态变化。在创建网页布局后，`ajaxcars1.html` 代码使用 JavaScript\
  \ 监听来自品牌下拉框的事件。当选择发生变化时，它会触发 `getmodels()` 函数。`getmodels()` 函数使用 DOM 获取在 `select`\
  \ 元素中做出的：\n\n```javascript\nvar make = select.options[select.selectedIndex].value;\n\
  ```\n\n然后它使用 `XMLHttpRequest` 对象将选择传递给 `ajaxcars.php`：\n\n```javascript\nvar request\
  \ = new XMLHttpRequest();\nvar URL = \"ajaxcars.php?make=\" + make;\nrequest.open(\"\
  GET\", URL);\n```\n\n`ajaxcars.php` 代码根据 `make` 值返回一个用逗号分隔的简单型号字符串。回到 `ajaxcars1.html`\
  \ 文件中，`onreadystatechange` 回调函数获取返回的值，将其转换为数组，获取 `options` DOM 对象，然后使用 `innerHTML`\
  \ 属性更改可用的选项。\n\n## 使用 AJAX 库\n\n遗憾的是，在 JavaScript 中使用 `XMLHttpRequest` 对象 有些繁琐。您需要许多部分都就绪并按照正确的顺序使用，功能才能正常工作。流行的\
  \ jQuery 库提供了一些函数来简化 AJAX。\n\n### jQuery $.ajax() 函数\n\njQuery 中的 `$.ajax()` 函数允许您在同一处构建\
  \ `XMLHttpRequest` 的所有部分。您不再需要将内容拆分为不同的方法和属性，只需要填写一系列键/值对来提交您的请求并处理响应：\n\n```javascript\n\
  $.ajax({\n  type: 'POST',\n  url: 'myprog.php',\n  data: { id: \"100\", name: \"\
  Rich\" },\n  dataType: \"XML\",\n  success: function (response) {\n    var result\
  \ = response;\n  },\n  error: function(response) {\n    console.log('Error: ' +\
  \ response);\n  }\n});\n```\n\n函数中定义的键/值对控制着请求的工作方式。表 3-3 显示了 `$.ajax()` 函数设置中提供的不同元素。\n\
  \n| 设置 | 说明 |\n| --- | --- |\n| `accepts` | 定义请求将接受的 MIME 类型 |\n| `async` | 指定连接是否为同步\
  \ |\n| `beforeSend` | 定义在发送请求前触发的回调方法 |\n| `cache` | 防止浏览器缓存请求 |\n| `complete` |\
  \ 定义在连接完成时触发的回调方法 |\n| `contents` | 定义一个正则表达式以确定如何处理内容 |\n| `contentType` | 定义发送内容的\
  \ Content 类型 |\n| `context` | 定义回调的上下文 |\n| `converters` | 定义响应内容的转换器 |\n| `crossDomain`\
  \ | 允许跨域连接 |\n| `data` | 发送到服务器的数据 |\n| `dataFilter` | 处理响应的数据 |\n| `dataType` |\
  \ 预期的数据类型 |\n| `error` | 连接失败时触发的回调函数 |\n| `global` | 全局 Ajax 处理器 |\n| `headers`\
  \ | 定义额外的 HTTP 头 |\n| `ifModified` | 如果响应自上次以来有变化则返回 |\n| `isLocal` | 如果使用本地资源（如本地文件）\
  \ |\n| `jsonp` | 以 JSON 格式返回连接 |\n| `jsonpCallback` | 定义 JSON 请求的回调函数 |\n| `method`\
  \ | 定义使用的 HTTP 方法（`GET` 或 `POST`） |\n| `mimeType` | 定义响应的 MIME 类型 |\n| `password`\
  \ | 访问 URL 的密码 |\n| `processData` | 跳过数据处理 |\n| `scriptCharset` | 为 `<script>` 元素设置字符集\
  \ |\n| `statusCode` | 返回响应的 HTTP 状态码 |\n| `success` | 连接成功时触发的回调函数 |\n| `timeout`\
  \ | 等待响应的时间 |\n| `traditional` | 使用传统的参数序列化方法 |\n| `type` | 请求方法 |\n| `url` | 请求的连接字符串\
  \ |\n| `username` | 访问 URL 的用户名 |\n| `xhr` | 创建自定义 `XMLHttpRequest` 对象的回调函数 |\n\
  | `xhrFields` | 定义 XHR 对象的字段名/值对 |\n\n\n\n\n\n```javascript\nvar URL = \"ajaxcars.php?make=\"\
  \ + make;\n\n$.ajax({\n  type: \"GET\",\n  url: URL,\n  dataType: \"text\",\n  success:\
  \ function(response) {\n    var models = response.split(',');\n    var model = document.getElementById('model');\n\
  \    if (model) {\n      model.innerHTML = \"\";\n      for(i = 0; i < models.length;\
  \ i++) {\n        model.innerHTML += \"<option value='\" + models[i] +\n       \
  \ \"'>\" + models[i] + \"</option>\";\n      }\n    }\n  }\n});\n}\n```\n```html\n\
