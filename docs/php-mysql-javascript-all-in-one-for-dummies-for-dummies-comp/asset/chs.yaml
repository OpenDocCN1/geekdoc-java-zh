  \n在下一节中，你将三分法应用到 `AuctionHelper` 应用程序的布局中。\n\n### AuctionHelper 页面布局\n\n对于 `AuctionHelper`\
  \ 应用程序，你每个网页上需要五个独立的区域：\n\n* 网页顶部的头部区域，用于在所有页面顶部显示应用程序标题\n* 网页底部的页脚区域，用于显示任何版权或联系信息\n\
  * 网页左侧的导航区域\n* 网页右侧的实时数据更新区域\n* 网页中间的主体内容区域\n\n使用网格布局来放置元素，基础的 `AuctionHelper` 网站布局如图\
  \ 1-2](#34_9781119468387-bk06ch01.xhtml_c25-fig-0002)所示。\n\n![image](img/9781119468387-fg060102.png)\n\
  \n图 1-2： 基础 `AuctionHelper` 网页布局。\n\n头部和页脚部分包含了应用程序中每个网页都会出现的数据，但不需要大量空间。你将使用 `PHP`\
  \ 包含文件在每个网页上加载标准的头部和页脚部分，而无需为每个页面编写这些代码。\n\n导航部分为应用程序用户提供了在网站内浏览的方法。它将显示应用程序中主要功能的链接，例如添加新的竞拍者或物品、列出所有竞者或物品，以及查找竞者或物品。\n\
  \n实时信息部分是 `JavaScript` 代码执行所有工作的地方。此部分不会有任何 `PHP` 代码，但你需要为 `JavaScript` 动态更新信息留出空间。\n\
  \n主体部分是显示随页面变化的内容的主工作区域。它将用于显示各种内容，包括竞者信息、物品信息，当然还有竞拍得的物品。\n\n现在你已经有了基础网站布局的计划，可以开始编写一些\
  \ `HTML` 和 `CSS` 代码来实现它了。下一节将介绍该过程。\n\n## 编写网站布局\n\n虽然你还没有准备好开始编写所有的应用程序 `PHP` 代码，但你可以开始编写页面布局所需的的基础\
  \ `HTML5` 和 `CSS3` 代码。本节将向你展示如何为 `AuctionHelper` 网站布局创建基础模板。\n\n### 创建网页模板\n\n构建动态\
  \ Web 应用程序的关键在于重用性。你为不同网页重用的代码越多，需要编写的代码就越少！这意味着尽可能使用 `PHP` 包含文件。然而，为了做到这一点，你需要一个锚定应用程序并显示所有包含文件的主页面。\n\
  \n对于大多数 Web 服务器，`PHP` 应用程序的默认网页称为 `index.php`。这将是控制应用程序显示的所有内容的锚页。按照以下步骤为 `AuctionHelper`\
  \ 应用程序创建主 `index.php` 页面。\n\n1. **打开编辑器并输入以下代码：**\n\n```php\n<?php\nsession_start();\n\
