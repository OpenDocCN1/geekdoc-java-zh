  \n## 查看竞价者\n\n当应用程序用户点击“查看竞价者”按钮或从列表框双击竞价者时，代码会检索 `displaybidder.inc.php` 文件的代码，并传递用户从列表框选择的竞价者的\
  \ `bidderid` 值。`displaybidder.inc.php` 代码将显示来自 Bidders 表的竞价者数据记录，并列出 Items 表中该竞价者赢得任何项目（其中项目的\
  \ `winbidder` 值与 `bidderid` 值匹配）。\n\n按照以下步骤创建 `displaybidder.inc.php` 文件：\n\n1.\
  \ **打开编辑器并输入此代码：**\n\n```php\n<?php\nif (!isset($_REQUEST['bidderid']) OR (!is_numeric($_REQUEST['bidderid'])))\n\
  {\n    echo \"<h2>您没有选择有效的 bidderid 进行查看。</h2>\\n\";\n    echo \"<a href=\\\"index.php?content=listbidders\\\
  \">列出竞价者</a>\\n\";\n} else\n{\n    $bidderid = $_REQUEST['bidderid'];\n    $bidder\
  \ = Bidder::findBidder($bidderid);\n    if ($bidder) {\n        echo $bidder;\n\
  \        echo \"<br><br>\\n\";\n        // 列出赢得的项目\n        $items = Item::getItemsbyBidder($bidderid);\n\
  \        if ($items) {\n            echo \"<b>赢得的项目:</b><br>\\n\";\n           \
  \ echo \"<table>\\n\";\n            echo \"<tr><td><b>项目</b></td><td><b>名称</b></td>\"\
  \ .\n            \"<td><b>描述</b></td><td><b>金额</b></td></tr>\\n\";\n           \
  \ $itemtotal = 0;\n            foreach($items as $item) {\n                printf(\"\
  <tr><td>%s</td>\", $item->itemid);\n                printf(\"<td>%s</td>\",$item->name);\n\
  \                printf(\"<td>%s</td>\", $item->description);\n                printf(\"\
  <td>%.2f</td></tr>\\n\", $item->winprice);\n                $itemtotal = $itemtotal\
  \ + $item->winprice;\n            }\n            echo \"<tr><td/><td/><td><b>总计</b></td>\"\
  ;\n            printf(\"<td><b>%.2f</b></td></tr>\\n\", $itemtotal);\n         \
  \   echo \"</table>\\n\";\n        } else {\n            echo \"<h2>目前没有赢得的项目</h2>\\\
  n\";\n        }\n    } else {\n        echo \"<h2>抱歉，未找到竞价者 $bidderid</h2>\\n\"\
  ;\n    }\n}\n?>\n```\n\n2. **将文件保存到 `auction` 文件夹中名为 `displaybidder.inc.php`。**\n\
  \n`displaybidder.inc.php` 代码生成了图 2-3 所示的网页。\n\n![image](img/9781119468387-fg060203.png)\n\
  \n图 2-3: 由 `displaybidder.inc.php`包含文件生成的网页。\n\n`displaybidder.inc.php` 代码使用 `findBidder()`\
  \ 静态方法中的 `bidderid` 值来检索特定竞价者的信息。它随后使用 `Items` 类中 `getItemsbyBidder()` 静态方法中的 `bidderid`\
  \ 来检索与竞价者 `bidderid` 值关联的所有项目。\n\n`getItemsbyBidder()` 方法将匹配的项目列表作为 `Item` 对象的数组返回，因此代码使用\
  \ `foreach` 语句遍历每个项目并显示其属性。这在一个方便的网页上提供了所有的竞价者信息，使得志愿者在无声拍卖结束时可以轻松地检查竞价者！\n\n##\
  \ 删除竞价者\n\n当应用程序用户从竞价者列表点击“删除竞价者”按钮时，这会触发 `removebidder.inc.php` 包含文件。请按照以下步骤构建该文件：\n\
  \n1. **打开编辑器并输入此代码：**\n\n```php\n<?php\nif (isset($_SESSION['login'])) {\n    $bidderid\
