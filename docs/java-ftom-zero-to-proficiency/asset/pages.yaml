  md: "In addition to providing explanations about your code, you can also use comments\
    \ to prevent part of your code from being executed. This is very useful when you\
    \ would like to debug your code and find where the error or bug might be, using\
    \ a very simple method. By commenting sections of your code, and by using a process\
    \ of elimination, you can usually find the issue quickly. For example, you can\
    \ comment all the code and run the application; then comment half the code, and\
    \ run the application. If it works without errors, it means that the error is\
    \ within the code that has been commented, and if it does not work, it means that\
    \ the error is in the code that has not been commented. In the first case (when\
    \ the code works), we could then just comment half of the portion of the code\
    \ that has already been commented. So, by successively commenting more specific\
    \ areas of our code, we can get to discover what part of our code includes the\
    \ bug. This process is often called dichotomy, as we successively divide a section\
    \ into two.\n\nLet's use comments in our application:\n\n+   - Open the file MyClass.\n\
