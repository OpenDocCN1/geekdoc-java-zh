  md: '# PACKAGES AND NAMESPACES


    In Java, it is possible to group several files and classes under a specific directory

    or package) to avoid ambiguity and to clarify where a specific class that we

    want to use originates from.


    By default, Java includes several built-in packages with classes that can be used

    for a specific purpose; for example, the package Java.io can be used to deal with

    inputs and outputs, and the package Java.util.zip can be used to deal with zip

    files.


    When a package has been created, the classes within can be imported and used

    accordingly using the import directive.


    For example, in the first part of this book, we used the class called Scanner
    to

    capture the input from the user. The class called Scanner is part of the package

    Java.util; so, to be able to use it, we have added the following code at the

    start of the class MyClass.


    ```

    Java.util.Scanner;

    ```


    This way, when we use the Scanner class, as illustrated in the next code, Java

    knows that we refer to the class Scanner that is located in the package Java.util.


    ```

    Scanner sc=new Scanner(System.in);

    ```


    Similarly, the class called Arrays is part of the package called Java.util; so,
    to

    want to use it, we have added the following code at the start of the class

    MyClass.


    ```

    Java.util.Arrays;

    ```


    This way, when we use the Arrays class, as illustrated in the next code, Java

    knows that we refer to the class Arrays that is located in the package Java.util.


    ```

    Arrays.sort(test);

    ```


    Another very useful thing is to be able to import several classes from the same

    package at once. For example, if we were to import several classes from the

    package Java.util, we could also import all of the classes within this package
    by'
