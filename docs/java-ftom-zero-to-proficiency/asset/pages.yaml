  md: '# CONDITIONAL STATEMENTS


    While we have looked at simple variables such as numbers or text, and how to modify
    them with operators, we will now look at conditional statements.


    Conditional statements are statements that are performed based on a condition,
    hence their name. Their syntax is usually as follows:


    ```

    if (condition) statement;

    ```


    This means if the condition is verified (or true) then (and only then) the statement
    is executed. When we assess a condition, we test whether a declaration (or statement)
    is true.


    For example, by typing if (a == b) we mean "if is true that a equals b". Similarly,
    if we type (a>=b) we mean "if is true that a equals or is greater than",


    As we will see later, we can also combine conditions. For example, we can decide
    to perform a statement if two (or more) conditions are true. For example, by typing
    if (a == b & c == 2) we mean "if equals b and c equals 2". In this case using
    the operator & means AND, and both conditions will need to be true. We could compare
    this to a decision on whether we will go sailing tomorrow.


    For example, we could translate the sentence "if the weather is sunny and the
    wind speed is less than 5km/h I will go sailing" as.


    ```

    if (weatherSunny == true & windSpeed < 5) IGoailing = true ;

    ```


    When creating conditions, as for most natural languages, we can use the OR noted
    ||. Taking the previous example, we translate the following sentence "if the weather
    is too hot or the wind is faster than 5km/h then I will not go sailing" as.


    ```

    if (weatherTooHot == true || windSpeed > 5) IGoailing = false ;

    ```


    Another example could be as follows.


    ```

    if (myName == "Patrick") System.out.println("Hello Patrick");nelse System.out.println("Hello
    Stranger");

    ```


    In the previous code, we display the text "Hello Patrick" if the variable'
