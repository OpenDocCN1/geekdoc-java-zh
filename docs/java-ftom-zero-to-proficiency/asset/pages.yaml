  md: '# Lists


    As we have seen in the previous sections, it is sometimes useful to employ arrays.
    However, when you are dealing with a large amount of data, or data that is meant
    to grow overtime, lists may be more useful, as they include built-in tools to
    sort and organize your data. So, you don''t always need to use lists; however,
    they may be more efficient to organize your data, especially for large and evolving
    data sets.


    So let''s look into Lists.


    +   * You can declare a list as follows:


    ```

    ArrayList<int> myList;

    ```


    +   * The declaration follows the syntax:


    ```

    ArrayList <type> nameOfVariable;

    ```


    So you could create a list of integers, Strings, or Vehicle objects.

    Once the list has been created, Java offers several built-in methods that make
    it possible to manipulate a list, including:


    +   * add: adds an item at the end of the list.

    * clear: removes all elements from the list.

    * remove: removes an item from the list.

    * size: returns the number of items in a list.


    Each element in the list has a default index that is relative to when it was first
    added to the list; the earlier the item is added to the list and the lower the
    index. So the first item added to the list will have, by default, the index 0,
    the second item will have the index 1, and so on.


    Let''s look at an example:


    ```

    ArrayList <String> listOfNames = new ArrayList<String>();

    listOfNames.add("Mary");

    listOfNames.add("Paul");

    System.out.println("Size of list " + listOfNames.size());

    //this will display "Size of list 2"

    ```'
