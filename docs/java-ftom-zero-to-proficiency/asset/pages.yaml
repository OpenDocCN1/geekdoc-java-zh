  md: "# INHERITANCE\n\nI hope everything is clear so far, as we are going to look\
    \ into a very interesting and important concept for object-oriented programming:\
    \ inheritance. The main idea behind inheritance is that objects can inherit their\
    \ properties from other objects (i.e., their parent). As they inherit these properties,\
    \ they can remain identical to their parent or evolve and overwrite some of these\
    \ inherited properties. This is very interesting because it makes it possible\
    \ to minimize the code by creating a class with general properties for all objects\
    \ sharing similar features, and then, if need be, to overwrite and customize some\
    \ of these properties for the children.\n\nLet's take the example of vehicles.\
    \ Vehicles would generally have the following properties:\n\n+   * Number of wheels.\n\
    * Speed.\n* Number of passengers.\n* Color.\n* Capacity to accelerate.\n* Capacity\
    \ to stop.\n\nSo we could create the following class for example:\n\n```\nclass\
    \ Vehicle {\n    private int nbWheels;\n    protected float speed;\n    private\
    \ int nbPassengers;\n    private int color;\n    public void accelerate() {\n\
    \        speed++;\n    }\n}\n```"
  merge: -1
  img_proc: true
