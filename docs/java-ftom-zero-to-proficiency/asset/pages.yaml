  md: '# MULTI-DIMENSIONAL ARRAYS


    Now that we have looked into single-dimensional arrays, let''s look at multidimensional
    arrays, which can also be very useful when storing information. This type of array
    (i.e., multidimensional arrays) can be compared to a building with several floors,
    each with several apartments. So let''s say that we would like to store the number
    of tenants for each apartment. We would, in this case, create variables that would
    store this number for each of these apartments.


    The first solution would be to create variables that store the number of tenants
    for each of these apartments with a variable that makes a reference to the floor
    and the number of the apartment. For example, the variable ap0_1 could be defined
    to store the number of tenants in the first apartment on the ground floor, ap0_2,
    could be defined to store the number of tenants in the second apartment on the
    ground floor, ap1_1 could be defined to store the number of tenants in the second
    apartment on the first floor, and ap1_2, could be defined to store the number
    of tenants in the third apartment on the first floor. In term of coding, we could
    have the following:


    ```

    int ap0_1 = 0;

    int ap0_2 = 0;

    ```


    However, we could also use arrays in this case, to make our code more efficient,
    as illustrated in the next snippet:


    ```

    int [][] array = new int[10][10];

    array[0][1] = 0;

    array[0][2] = 0;

    System.out.println(array[0][1]);

    ```


    In the previous code:


    +   - We declare our array.

    - The code int [][] corresponds to a two-dimensional array of integers; in other
    words, we state that any element in this array will be defined and accessed based
    on two parameters: the floor level and the number of tenants in apartment on that
    level.'
