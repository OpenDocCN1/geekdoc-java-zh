    equals 11. As a result, we exit the loop.


    So, as we can see, using a loop, we have managed to increment the value of the
    variable counter iteratively, from 0 to 11, but using less code than would be
    needed otherwise.


    Now, we could create a slightly modified version of this loop, using a do-while
    loop structure instead, as illustrated in the next example:


