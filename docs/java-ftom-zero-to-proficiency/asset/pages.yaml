  md: "# Loops\n\nThere are times when you have to perform repetitive tasks as a programmer;\
    \ many times, these can be fast-forwarded using loops which are structures that\
    \ will perform the same actions repetitively based on a condition. So, the process\
    \ is usually as follows when using loops:\n\n+   * Start the loop.\n* Perform\
    \ actions.\n* Check for a condition.\n* Exit the loop if the condition is fulfilled\
    \ or keep looping otherwise.\n\nSometimes the condition is tested at the start\
    \ of the loop, some other times it is tested at the end of the loop. As we will\
    \ see in the next paragraph, the case for the while and do-while loop structures,\
    \ respectively.\n\nLet's look at the following example that is using a while loop.\n\
    \n```\nint counter = 0;\nwhile (counter <=10)\n{\n    counter++;\n}\n```\n\nIn\
    \ the previous code:\n\n+   * We declare the variable counter and set its value\
    \ to 0.\n* We then create a loop that starts with the keyword while and for which\
    \ the content (which is what is to be executed while we are looping) is delimited\
    \ by opening and closing curly brackets.\n* We set the condition to remain in\
    \ this loop (i.e., counter <=10). So we will remain in this loop as long as the\
    \ variable counter is less than equal to 10.\n* Every time we go through the loop,\
    \ we increase the value of the variable counter by 1.\n\nSo effectively:"
