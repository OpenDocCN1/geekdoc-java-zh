- pgno: 44
  md: '# VARIABLES


    Now that you know a bit more about statements and comments, we will start to learn
    more about variables, which are quite important in Java, as you will probably
    use use them in most of your programs to perform calculations or to work with
    text.


    So what is a variable?


    A variable can be compared to a container that includes a value that may change
    over time. When using variables, we usually need to: (1) declare the variable
    by specifying its type, (2) assign a value to this variable, and (3) possibly
    combine this variable with other variables using operators, as illustrated in
    the next code snippet.


    ```

    int myAge;//we declare the variable myAge

    myAge = 20;//we set the value of the variable myAge to 20

    myAge = myAge + 1; //we add 1 to the variable myAge

    ```


    In the previous example, we declared a variable called myAge and its type is int
    (as in integer). We save the value 20 in this variable, and we then add 1 to it.


    > Note that in Java the variable is declared using its type followed by its name.
    As we will see later, we will also need to use what is called an access modifier
    in order to specify how and from where this variable can be accessed.


    Also note that in the previous code, we have assigned the value myAge + 1 to the
    variable myAge; the = operator is an assignment operator; in other words, it is
    to assign a value to a variable and is not to be understood in a strict algebraic
    sense (i.e., the values or variables on both sides of the = sign are equal).


    To make Java coding easier and leaner, you can declare several variables of the
    same type in one statement. For example, in the next code snippet, we declare
    three variables v1, v2, and v3 in one statement. This is because they are of the
    same type (i.e., they are integers).


    ```

    int v1,v2,v3;

    ```'
