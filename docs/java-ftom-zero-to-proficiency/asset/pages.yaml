- pgno: 14
  md: '# CONTENT COVERED BY THIS BOOK


    +   - Chapter 1, Introduction to Java programming, provides an introduction to
    general programming concepts, including Java syntax, variables and methods. In
    this chapter, you will start to create your first application and combine variables,
    and methods.


    +   - Chapter 2, Customized Data types & Structures, delves deeper into Java and
    explains how to employ customized methods, structures and data types to optimize
    your code. You will use loops and arrays to create a quiz, and learn how to work
    with Strings and numbers with built-in methods.


    +   - Chapter 3, Object-Oriented Programming & Classes, explains key Object-Oriented
    concepts such as classes, polymorphism, inheritance, or encapsulation. This chapter
    will show you how to create your own classes and apply some common Object-Oriented
    concepts.


    +   - Chapter 4, Creating a Word Guessing Game, combines all the skills that you
    have learned to create a word game.


    +   - Chapter 5 summarizes the topics covered in this book and provides you with
    more information on the next steps to follow.'
