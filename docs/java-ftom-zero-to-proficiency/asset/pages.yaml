    \ can create a method that can be called from outside the class without the need\
    \ to instantiate an object, and that can be used to perform some utility tasks.\
    \ In addition, a static variable is shared between all the instances of the class.\n\
    \nWhen a variable is declared as static, only one instance of this member exists\
