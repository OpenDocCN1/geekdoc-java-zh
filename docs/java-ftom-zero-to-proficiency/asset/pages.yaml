- pgno: 36
  md: '# ABOUT COMPILING AND JAVA BYTECODE


    When you write your Java source code, it is converted (i.e., compiled) into bytecode
    as a .class file. This code, in turn, is interpreted by the Java Virtual Machine
    (JVM) that is installed on your computer and directly executed or translated into
    a code that the computer can understand (i.e., machine code) and execute. So,
    the JVM acts as a translator between your bytecode and the computer. The advantage
    of this approach is that a Java Virtual Machine can be installed on most computers,
    your code after being compiled into bytecode, can be executed on any computer
    where the Java Virtual Machine has been installed. You can therefore compile your
    code once and run the code virtually anywhere.


    You may wonder how the JVM is installed. Well, when you installed the Java SDK
    at the very start of this book, it installed, amongst other things, a JVA Runtime
    Environment (JRE) that includes the Java Virtual Machine, as well as the Java
    compiler.


    You can see both the .Java and .class that have been created and compiled in your
    project, if you navigate to the folder that you have chosen for your project initially.
    For example, in the next figure, you can see several files, including MyClass.Java
    and MyClass.class, that belong to the current project.


    ![](img/2fd2d26163705439bcd4d1a674a34298_36_0.png)


    Figure 1-15: Locating the .class and .Java files'
  merge: -1
  img_proc: true
