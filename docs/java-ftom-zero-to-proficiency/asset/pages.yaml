  md: "# DEFINING A CLASS\n\nNow that we have a clearer idea of what a class is, let's\
    \ see how we could define a class. So let's look at the following example.\n\n\
    ```\npublic class Bike\n{\n    private float speed;\n    private int color;\n\n\
    \    public void accelerate()\n    {\n        speed++;\n    }\n\n    public void\
    \ turnRight()\n    {\n    }\n\n    private void calculateDistance()\n    {\n \
    \   }\n}\n```\n\nIn the previous code, we have defined a class, called Bike, that\
    \ includes two member variables (speed and color) as well as two member methods\
    \ (accelerate and turnRight). So again we encapsulate all the data and algorithms\
    \ linked to a bike in one class. This way, it is easier to see what can be done\
    \ with a bike; it also makes our code more modular. Let's look at the class a\
    \ little closer; you may notice a few things:\n\n+   - The name of the class is\
    \ preceded by the keywords public class; in OOP terms, the keyword public is called\
    \ an access modifier and it defines how"
