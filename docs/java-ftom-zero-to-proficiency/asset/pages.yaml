- pgno: 110
  md: '(and from where) this class may be accessed and used. In Java there are four
    types of access modifiers, including public (no restrictions), protected (access
    limited to the containing class, classes from the same package - a grouping of
    files -, and subclasses from other packages), default (this the default mode if
    no access modifier is specified; in this case, access is limited to the containing
    class and classes from the same package) and private (access only from the containing
    class or type). In our case, we should be to use this class anywhere in our programme.


    +   * The names of all variables are preceded by their type (i.e., int), and the
    keyword public: this means these integer variables will be accessible throughout
    our application (i.e., outside the class if need be).m

    * Some of the names of the methods are preceded by the keywords public void (e.g.,
    for the methods accelerate or turnRight): the void keyword means that the method
    does not return any data, while the keyword public means that the method will
    be accessible throughout our application.

    * Some of the names of the methods are preceded by the keywords private void (e.g.,
    for the method calculatedDistance): the void keyword means that the method does
    not return any data, while the keyword private means that the method will be accessible
    only from the containing type (i.e., Bike).


    By defining the class Bike, we effectively define a template that can be used
    later on to create bikes. Once new bikes are created, it will be possible to modify
    their properties/ (or attributes). Again, this class can be used in any programme,
    so it is totally reusable; it needs to be defined once, and used to create new
    bikes. Again, all the data and algorithms related to a bike is encapsulated in
    the class Bike. Looking at the class, it is easy to understand how the data and
    the algorithms related to each other, and it is consequently easier to maintain
    the code.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# ACCESSING CLASS MEMBERS AND VARIABLES


    Once a class has been defined, it is great to be able to access its member variables
    and methods. In Java (as for other object-oriented programming languages), this
    can be done using the dot notation.


    The dot notation refers to object-oriented programming. Using dots, you can access
    properties and/or methods related to a particular object.


    Once a class has been defined, objects based on this class can be created. For
    example, if we were to create a new Bike object, based on the code that we have
    seen above, the following code in the file MyClass main method.


    ```

    Bike myBike = new Bike();

    ```


    This code will create (or instantiate) an object on the "template" Bike. You may
    notice the syntax:


    ```

    dataType variable = new dataType();

    ```


    By default, this new object will include all the member variables and methods
    defined earlier in the class Bike. So it will have a color and a speed, and we
    should also be able to access its accelerate and turnRight methods.


    So using the Object-Oriented approach, we can define a template for an object
    and use this template to create a new object that includes all the data and methods
    (algorithm) necessary to manage or modify this object. How can this be done?


    Let''s look at the next code snippet that shows how we can access these.


    ```

    b = new Bike();

    b.accelerate();

    ```


    In the previous code:


    +   * The new bikeBike is created.

    * The speed is then increased after calling the accelerate method. This method
    can be called using the dot notation because it is public.

    * Note that to call an object''s method we use the dot notation.'
  merge: -1
  img_proc: true
