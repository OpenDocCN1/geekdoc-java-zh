  md: '# ACCESSING METHODS AND ACCESS MODIFIERS


    The ability to restrict access to (and hide) variables and methods provides more
    security to your applications, and is usually referred to as encapsulation, and
    this is often achieved through access modifiers.


    As we have seen previously, there are different types of access modifiers in Java.
    These modifiers specify from where a method can be called. These access modifiers
    can be public (no restrictions), protected (access limited to the containing class,
    classes from the same package – a grouping of files -, and subclasses from other
    packages), default (this is the default mode if no access modified is specified;
    in this case, access is limited to the containing class and classes from the same
    package) and private (access only from the containing class or type).


    For example, in the previous example, we have declared the variable speed protected
    so that it can be accessed by the class Vehicle and its children, including the
    class MotoredVehicle.'
  merge: -1
