  - "[PAGE 120]\n\n# CONSTRUCTORS\n\nA class usually includes a constructor; a constructor\
    \ basically is a method that includes a set of instructions that will be used\
    \ to initialize an object created from this class. As we will see later, classes\
    \ can have different constructors, each initializing the new object differently.\
    \ Some may need parameters, and some may not need any parameter at all; but ultimately,\
    \ all the constructors are used to construct based on the class, in a specific\
    \ way, usually by setting some of the member variables.\n\nAs we have seen in\
    \ the previous section, when a new object is created, it will, by default, include\
    \ all the member variables and methods from its class. To create this object,\
    \ we would use the name of the class, followed by (), as per the next example.\n\
    \n```\nBike myBike = new Bike();\nmyBike.accelerate();\n```\n\nBy using the keyword\
    \ new, we implicitly call a constructor from the class Bike. If you have not defined\
    \ any constructor for your class, this will call the default constructor which\
    \ will do nothing, except creating a new object from this class.\n\nThis being\
    \ said, you can, if you wish, create one or more constructors for your class.\
    \ These created constructors will, for example, change some of the properties\
    \ of the new object created at the time it is initialized. For example, a constructor\
    \ could set these value for the variables speed and color when it is created.\n\
    \nSo, for example, let's say that we would like the color of our bike to be specified\
    \ when it is created; we could modify the Bike class, as follows, by adding the\
    \ following method:\n\n```\npublic Bike (intColor)\n{\n    color = newColor;\n\
    }\n```\n\nThis is a new constructor as the name of the method is the same as the\
    \ class. It takes an integer as a parameter; so after modifying the description\
    \ of our class (as per the code above), we could then create a new Bike object\
    \ as follows:"
  - "[PAGE 121]\n\nBike myBike = new Bike(2);\n\nWe could specify a second constructor\
    \ that would include both the color\\and the speed as follows:\n\n```\npublic\
    \ Bike (int newColor, float newSpeed)\n{\n    color = newColor;\n    speed = newSpeed;\n\
    }\n```\n\nHaving multiple constructors can be useful as it allows you to instantiate\
    \ an object in different ways, depending on the parameter that are already setup,\
    \ or the ones that you'd like to account for at the initialization stage. In our\
    \ case, we might just want to create a new bike without specifying its speed or\
    \ color, or to create a new bike and specify its speed or color at the initialization\
    \ stage. So having multiple constructor can be convenient in this case.\n\nSo,\
    \ you can have different constructors in your class and the system will determine\
    \ which constructor that should be called based on the signature of the constructor\
    \ (i.e., the parameters that should be passed to the method).\n\nFor example,\
    \ let's say that we have two constructors for our Bike class, as follows.\n\n\
    ```\npublic Bike (int newColor)\n{\n    color = newColor;\n}\npublic Bike (int\
    \ newColor, float newSpeed)\n{\n    color = newColor;\n    speed = newSpeed;\n\
    }\n```"
  - "[PAGE 122]\n\nIf a new Bike object is created as follows:\n\n```\nBike newBike\
    \ = new Bike (2)\n```\n\n...then the first constructor will be called.\n\nIf a\
    \ new Bike object is created as follows:\n\n```\nBike newBike = new Bike (2, 10.0f)\n\
    ```\n\n...then the second constructor will be called.\n\nYou may also wonder what\
    \ happens if the following code is used if no default constructor has been defined.\n\
    \n```\nBike newBike = new Bike ();\n```\n\nIn fact, whenever you create your class,\
    \ a default constructor is also defined (implicitly) and evoked whenever a new\
    \ object is created using the new operator with no arguments. This is called a\
    \ default constructor. In this case, the default values for each of the types\
    \ of the numerical member variables are used (e.g., 0 for integers or false for\
    \ Boolean variables).\n\n> Note that access to constructors is usually public,\
    \ except in the particular cases where we would like a class not to be instantiated\
