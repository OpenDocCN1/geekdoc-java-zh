    myName 等于 "Patrick"；否则，我们显示消息 "Hello Stranger"。


    当我们评估真和假条件时，我们实际上在应用所谓的布尔逻辑（Boolean logic）。布尔逻辑处理具有两个值 1 和 0（或 true 和 false）的布尔数字。通过评估条件，我们实际上在处理布尔数字并应用布尔逻辑。虽然你不需要深入了解布尔逻辑，但布尔逻辑运算符是非常重要的，包括
    ! 运算符。它意味着非（NOT）或“……的反面”。这意味着如果一个变量为真，它的反面就为假，反之亦然。例如，如果我们考虑变量 **weatherIsGood
    = true**，那么 **!weatherIsGood 的值就是 false**（它的反面）。因此，**条件 if (weatherIsGood == false)**
    也可以写成 **(!weatherIsGood)**，其字面上翻译为“如果天气不是好”。


    让我们对条件语句进行实验：


    - 请打开 MyClass 文件。

    - 在类开头添加以下行：


    ```java

    import java.util.Scanner;

    ```


    在上一个代码中，我们导入了名为 **Scanner** 的类，以便在自己的程序中使用它；这个类由 Java 提供，使得读取用户的输入成为可能。


    - 请在 **main 方法** 中添加以下代码（加粗为新代码）：


    ```java

    System.out.println("My age is " + age);

    System.out.println("Please enter your name: ");

    Scanner sc = new Scanner(System.in);

    String nameOfUser = sc.nextLine();

    System.out.println("Hello " + nameOfUser);

    ```


    在上一个代码中：


    - 我们写了一条要求用户输入名字的消息。

    - 我们声明了变量 **sc**；此变量将用于获取用户输入的信息。变量 **sc** 的类型是 **Scanner**。


    正如我们后面看到的，当我们创建一个新的 Scanner 变量时，我们需要告诉系统它需要处理的信息来自哪里；在我们的情况下，这些信息来自标准输入（即键盘），我们将其称为
    System.in，因此使用了以下语法 `sc = new Scanner (System.in)`。


    - 声明变量 nameOfUser。此变量将包含用户输入的答案（一个字符串）。

    - 我们使用 nextLine 方法存储名称，这是 Java 提供的一个用于读取用户输入文本的方法（在用户按下回键后）。

    - 一旦用户输入了名称，它就会存储在变量 nameOfUser 中。

    - 我们显示了一条包含 "Hello" 单词的消息，随后是用户输入的名称。


    你现在可以保存代码并运行程序了：


    - 使用窗口底部的文本框输入一个你喜欢的名称。

    - 按下 Enter 键。

    - 控制窗口应该显示一条新消息，单词为 Hello，后面跟着你输入的名称。


    ![](img/2fd2d26163705439bcd4d1a674a34298_52_0.png)


    图 1-16：测试代码


    - 你可以关闭控制台窗口。


    既然我们成功获取了用户的输入，我们将实验使用条件语句。因此，请按如下修改 MyClass 文件中的代码（加粗为新代码）。


