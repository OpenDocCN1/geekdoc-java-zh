    Patrick Felicia 是沃特福德理工学院的讲师和研究员，在那里教学并指导本科生和研究生。他于2003年在爱尔兰科克大学获得多媒体技术硕士学位，并于2009年获得计算机科学博士学位。他出版了多关于将视频游戏用于教育目的的书籍，包括《通过教育游戏提高学习和动机的研究：多学科方法》（IGI
