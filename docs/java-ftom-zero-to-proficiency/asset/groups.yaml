  - "[PAGE 125]\n\n# STATIC MEMBERS OF A CLASS\n\nThe concept of static members provides\
    \ a great advantage over procedural programming. If you remember the last chapter,\
    \ we saw how it would be difficult to reuse code between two programmes using\
    \ a procedural approach, and how OOP made this much easier.\n\nStatic methods\
    \ and variables are a great example of this efficiency; for example, using static\
    \ methods, you can create a method that can be called from outside the class without\
    \ the need to instantiate an object, and that can be used to perform some utility\
    \ tasks. In addition, a static variable is shared between all the instances of\
    \ the class.\n\nWhen a variable is declared as static, only one instance of this\
    \ member exists for a class. So static variable will be \"shared\" between instances\
    \ of this class.\n\nStatic variables are often employed to retrieve constants\
    \ without instantiating a new object. The same applies for static methods: they\
    \ can be evoked without having to instantiate a new object from a class. This\
    \ can be very useful if you want to create and avail of tools.\n\nSo, let's explore\
    \ how we could use static functions and variables in our class Bike.\n\nWe could\
    \ create a static variable for example, that counts the number of bikes that have\
    \ been created; a static variable would be ideal in this case, as it would be\
    \ shared between all instances of the class Bike. In other words, whenever a bike\
