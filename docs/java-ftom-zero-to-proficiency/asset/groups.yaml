  mdcn: "\n\n```\n排序前的第一个元素：8\n排序后的第一个元素：4\n```\n\n图 2-4：对数字数组进行排序\n\n如果你愿意，可以使用之前的代码对数值数组进行排序并检查是否获得了相同的结果。\n\
    \n有关数组函数的完整列表，请参此官方文档：\n\nhttps://docs.oracle.com/Javase/8/docs/api/Java/util/Arrays.html\n\
    \n# 多维数组\n\n现在我们已经看了单维数组，让我们来看看多维数组，它们在存储信息时也非常有用。这种数组（即多维数组）可以比作一栋有几楼层的建筑，每层都有几间公寓。假设我们想要存储每个公寓的住户人数。在这种情况下，我们将创建变量来存储每个公寓的住户人数。\n\
    \n第一种解决方案是创建变量来存储每个公寓的住户人数，并使用变量来引用楼层和公寓编号。例如，变量 `ap0_1` 可以定义为存储地面楼层第一间公寓的住户人数，`ap0_2`\
    \ 可以定义为存储地面楼层第二间公寓的住户人数，`ap1_1` 可以定义为存储第一楼层第二间公寓的住户人数，而 `ap1_2` 可以定义为存储第一楼层第三间公寓的住户人数。在代码方面，我们可以这样写：\n\
    \n```\nint ap0_1 = 0;\nint ap0_2 = 0;\n```\n\n然而，在这种情况下我们也可以使用数组来使代码更高效，如下一个代码段所示：\n\
    \n```\nint [][] array = new int[10][10];\narray[0][1] = 0;\narray[0][2] = 0;\n\
    System.out.println(array[0][1]);\n```\n\n在之前的代码中：\n\n- 我们声明了数组。\n- 代码 `int [][]`\
    \ 对应于整数的二维数组；换句话说，我们表示此数组中的任何元素将根据两个参数进行定义和访问：楼层数和该层公寓的住户人数。\n- 我们还为这些参数中的每一个指定了大小（或最大值）。楼层（或级别）的最大数量将为\
    \ 10，每层公寓的最大数量将为 10。因此，在这个示例中，我们可以定义 10 层，从第 0 层到第 9 层（即 10 层），对于这些层中的每一层，我们还可以定义\
    \ 10 间公寓，从公寓 0 到 9。\n- 最后一行代码在控制台窗口中打印数组第一个元素的值。\n\n```\n数组的其他有趣之处之一是，通过使用循环，你可以编写一行代码来访问数组中的所有项，从而编写出更高效的代码。\n\
    ```\n\n# 循环\n\n作为程序员，有时你必须执行重复性任务；很多时候，这些任务可以通过循环来加速，循环是根据条件重复执行相同操作的结构。因此，使用循环时，过程通常如下：\n\
    \n- 开始循环。\n- 执行操作。\n- 检查条件。\n- 如果满足条件，则退出循环；否则继续循环。\n\n有时条件在循环开始时测试，另一些时候在循环结束时测试。正如我们将在下一段中看到的，分别是\
    \ `while` 和 `do-while` 循环结构的情况。\n\n让我们来看下面这个使用 `while` 循环的示例。\n\n```\nint counter\
    \ = 0;\nwhile (counter <=10)\n{\n    counter++;\n}\n```\n\n在之前的代码中：\n\n- 我们声明了变量\
    \ `counter` 并将其值设置为 0。\n- 然后我们创建了一个以 `while` 关键字开始的循环，其内容（即我们在循环期间要执行的内容）由左括号和右括号界定。\n\
    - 我们设置了留在此循环中的条件（即 `counter <=10`）。因此，只要变量 `counter` 小于或等于 10，我们就一直留在这个循环中。\n\
    - 每当我们通过循环时，我们将变量 `counter` 的值加 1。\n\n所以实际上：\n\n- 第一次通过循环：变量 `counter` 增加到 1；到达循环结束；回到循环开始并检查变量\
    \ `counter` 是否小于或等于 10；在这种情况下这是真的，因为 `counter` 等于 1。\n- 第二次通过循环：变量 `counter` 增加到\
    \ 2；到达循环结束；回到循环开始并检查变量 `counter` 是否小于或等于 10；在这种情况下这是真的，因为 `counter` 等于 2。\n- 第\
    \ 11 次通过循环：变量 `counter` 增加到 11；到达循环结束；回到循环开始并检查变量 `counter` 是否小于或等于 10；现在是假的，因为\
    \ `counter` 现在等于 11。结果是我们退出循环。\n\n所以，正如我们看到的，通过循环，我们成功地迭代增加了变量 `counter` 的值，从\
    \ 0 增加到 11，但使用的代码比通常需要的要少。\n\n现在，我们可以创建此循环的一个稍微修改的版本，使用 `do-while` 循环，如下所示：\n\n\
    ```\nint counter = 0;\ndo\n{\n    counter++;\n} while (counter <=10);\n```\n\n\
    在之前的示例中，你可能会发现两个差异：\n\n- `while` 关键字现在位于循环的末尾。因此条件在循环的末尾进行测试。\n- `do` 关键字现在位于循环的开头。所以在这里，我们先执行语句，然后在循环结束时检查条件。\n\
    \n代码的另一种变体如下：\n\n```java\nfor (int counter = 0; counter<=10; counter++)\n{\n \
    \ System.out.println(\"Counter = \" + counter);\n}\n```\n\n在之前的代码中：\n\n- 我们以不同的方式声明了一个循环：我们表示将使用一个从\
    \ 0 到 10 的整数变量。\n- 每当我们通过循环时，该计数器加 1。\n- 只要变量 `counter` 小于或等于 10，我们就留在循环中。\n-\
    \ 这种情况下在循环开始时进行测试。\n\n循环对于有限数量的对象执行重复操作非常有用，或者执行通常被称为递归的操作。例如，你可以使用循环遍历 100 个项目。结果是，循环将为你节省一些代码。\n\
    \n所以我们可以使用循环结构改进之前的代码，让用户输入数字，只要其选择小于 1 或大于 3，或者数据不是数字。\n\n让我们尝试：\n\n- 打开 `MyClass`\
    \ 文件\n- 如下所示向 `MyClass` 添加此方法：\n\n```java\npublic static void selectChoice()\n\
    {\n  int myChoice = 0;\n  do\n  {\n    System.out.println(\"Please enter your\
    \ choice 1-3\");\n    Scanner sc=new Scanner(System.in);\n    myChoice=sc.nextInt();\n\
    \  } while (myChoice < 1 || myChoice > 3);\n\n  System.out.println(\"Thank you\"\
    );\n}\n```\n\n在之前的代码中：\n\n- 我们创建了一个名为 `selectChoice` 的方法。\n- 我们创建了一个名为 `myChoice`\
    \ 的变量，用于记录用户的选择。\n- 我们创建了一个 `do-while` 循环。\n- 我们记录并检查用户的选择。\n- 只要用户输入的数字小于 1 或大于\
    \ 3，我们就循环。\n\n你现在可以注释掉 `main` 方法中的代码，并在同一方法中添加以下代码，以便我们从这里调用 `selectChoice` 方法：\n\
    \n```java\nselectChoice();\n```\n\n你现在可以保存名为 `MyClass` 的文件并运行应用程序；系统会要求你输入 1 到\
    \ 3 之间的数字，只要你输入的数字小于 1 或大于 3，它就会一直这样做，如如下所示。\n\n![](img/2fd2d26163705439bcd4d1a674a34298_94_0.png)\n\
    \n图 2-5：循环直到提供正确信息为止\n\n"
