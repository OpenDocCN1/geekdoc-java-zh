    ## 条件语句 (CONDITIONAL STATEMENTS)


    虽然我们已经查看了简单的变量如数字或文本，以及如何使用运算符修改它们，我们现在将查看条件语句。


    条件语句是根据条件执行的语句，因此得名。它们的语法通常如下：


    ```

    if (condition) statement;

    ```


    这意味着如果条件被验证（或为真），那么（且仅那时）执行该语句。当我们评估条件时，是在测试一个声明（或语句）是否为真。


    例如，通过输入 `if (a == b)`，我们意味着“如果 a 等于 b”。同样，如果我们输入 `(a>=b)`，我们意味着“如果 a 等于或大于 b”，


