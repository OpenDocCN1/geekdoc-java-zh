  md: "\n# CONSTRUCTORS\n\nA class usually includes a constructor; a constructor basically\
    \ is a method that includes a set of instructions that will be used to initialize\
    \ an object created from this class. As we will see later, classes can have different\
    \ constructors, each initializing the new object differently. Some may need parameters,\
    \ and some may not need any parameter at all; but ultimately, all the constructors\
    \ are used to construct based on the class, in a specific way, usually by setting\
    \ some of the member variables.\n\nAs we have seen in the previous section, when\
    \ a new object is created, it will, by default, include all the member variables\
    \ and methods from its class. To create this object, we would use the name of\
    \ the class, followed by (), as per the next example.\n\n```\nBike myBike = new\
    \ Bike();\nmyBike.accelerate();\n```\n\nBy using the keyword new, we implicitly\
    \ call a constructor from the class Bike. If you have not defined any constructor\
    \ for your class, this will call the default constructor which will do nothing,\
    \ except creating a new object from this class.\n\nThis being said, you can, if\
    \ you wish, create one or more constructors for your class. These created constructors\
    \ will, for example, change some of the properties of the new object created at\
    \ the time it is initialized. For example, a constructor could set these values\
    \ for the variables speed and color when it is created.\n\nSo, for example, let's\
    \ say that we would like the color of our bike to be specified when it is created;\
    \ we could modify the Bike class, as follows, by adding the following method:\n\
    \n```\npublic Bike (int newColor)\n{\n    color = newColor;\n}\n```\n\nThis is\
    \ a new constructor as the name of the method is the same as the class. It takes\
    \ an integer as a parameter; so after modifying the description of our class (as\
    \ per the code above), we could then create a new Bike object as follows:\n\n\
    Bike myBike = new Bike(2);\n\nWe could specify a second constructor that would\
    \ include both the color and the speed as follows:\n\n```\npublic Bike (int newColor,\
    \ float newSpeed)\n{\n    color = newColor;\n    speed = newSpeed;\n}\n```\n\n\
    Having multiple constructors can be useful as it allows you to instantiate an\
    \ object in different ways, depending on the parameter that are already setup,\
    \ or the ones that you'd like to account for at the initialization stage. In our\
    \ case, we might just want to create a new bike without specifying its speed or\
    \ color, or to create a new bike and specify its speed or color at the initialization\
    \ stage. So having multiple constructors can be convenient in this case.\n\nSo,\
    \ you can have different constructors in your class and the system will determine\
    \ which constructor that should be called based on the signature of the constructor\
    \ (i.e., the parameters that should be passed to the method).\n\nFor example,\
    \ let's say that we have two constructors for our Bike class, as follows.\n\n\
    ```\npublic Bike (int newColor)\n{\n    color = newColor;\n}\npublic Bike (int\
    \ newColor, float newSpeed)\n{\n    color = newColor;\n    speed = newSpeed;\n\
    }\n```\n\nIf a new Bike object is created as follows:\n\n```\nBike newBike = new\
    \ Bike (2)\n```\n\n...then the first constructor will be called.\n\nIf a new Bike\
    \ object is created as follows:\n\n```\nBike newBike = new Bike (2, 10.0f)\n```\n\
    \n...then the second constructor will be called.\n\nYou may also wonder what happens\
    \ if the following code is used if no default constructor has been defined.\n\n\
    ```\nBike newBike = new Bike ();\n```\n\nIn fact, whenever you create your class,\
    \ a default constructor is also defined (implicitly) and evoked whenever a new\
    \ object is created using the new operator with no arguments. This is called a\
    \ default constructor. In this case, the default values for each of the types\
    \ of the numerical member variables are used (e.g., 0 for integers or false for\
    \ Boolean variables).\n\n> Note that access to constructors is usually public,\
    \ except in the particular cases where we would like a class not to be instantiated\
    \ (e.g., for classes that include static members only). Also note that, as member\
    \ variables, if no access modifiers are specified, these will be private by default.\
    \ This is similar for methods.\n\nNow that this is clear, let's experiment with\
    \ different constructors.\n\nPlease open the file Bike.\n\n- Add the following\
    \ code at the end of the class (before the last curly bracket).\n\n```\npublic\
    \ int getColor()\n{\n    return color;\n}\npublic Bike(int newColor)\n{\n    color\
    \ = newColor;\n}\n}\n\npublic Bike(int newColor, float newSpeed)\n{\n    color\
    \ = newColor;\n    speed = newSpeed;\n}\n```\n\nIn the previous code, we create\
    \ a method getColor that returns the color for the current Bike; we also create\
    \ two additional constructors, each taking different number and types of parameters.\n\
    \n- You can now save and compile your code for the file Bike.\n\nNow, we just\
    \ need to use these constructors.\n\n- In the file MyClass, please modify the\
    \ main method as follows (code in bold);\n\nIn the previous code:\ncreate two\
    \ additional bikes.\n\n- myBike2 is created using the second constructor, and\
    \ we pass the number 2 (for its color) to this constructor.\n- myBike3 is created\
    \ using the third constructor, and we pass the number 10 for its color, as well\
    \ as the number 3 for its speed.\n\nNow you can save your code for the file MyClass\
    \ and run the application, and the following should be displayed:\n\n```\nInitial\
    \ Speed=0\nColor of Bike2=2, Speed=0\nColor of Bike3=10, Speed=3\n```\n\nSo thanks\
    \ to the constructors, we were able to create the number of bikes.\n\n# STATIC\
    \ MEMBERS OF A CLASS\n\nThe concept of static members provides a great advantage\
    \ over procedural programming. When a variable is declared as static, only one\
    \ instance of this exists for the class. The same applies for static methods:\
    \ they can be called without having to instantiate an object.\n\nSo, let's explore\
    \ how we could use static functions and variables in our class. We could create\
    \ a static variable for example, that counts the number of bikes created; a static\
    \ variable would be ideal in this case, as it would be shared between all class\
    \ instances. Let's see how.\n\n- Please open the file Bike.\n- Add the following\
    \ code at the start of the class (new code in bold).\n\n```\npublic class Bike\n\
    {\n    private float speed;\n    private int color;\n    private static int nbBikes;\n\
    ```\n\nIn the previous code, we declare the variable nbBikes that will keep track\
    \ of the number of bikes instantiated (or created) from the class Bike. It is\
    \ private and static, which means that it will be only available from member methods\
    \ and it will also be shared across instances of the class Bike.\n\n- Add the\
    \ following methods to this class:\n\n```java\nprivate void increaseNbBikes()\n\
    {\n    nbBikes++;\n}\n\npublic int getNbBikes()\n{\n    return (nbBikes);\n}\n\
    ```\n\nIn the previous code:\n\n- We declare two methods.\n- The method increaseNbBikes\
    \ is private, so it will be accessible only from member methods and it will increase\
    \ the value of the variable nbBikes every time it is called.\n- The method getNbBikes\
    \ is public which means that it will be accessible from outside the class, and\
    \ return the total number of objects instantiated from the class Bike.\n\nWe will\
    \ now modify the three constructors that we have created earlier for the class\
    \ Bike, so that every time a bike is created, the number of bikes is increased\
    \ accordingly.\n\n- Please modify the first constructor as follows (new code in\
    \ bold):\n\n```java\npublic Bike()\n{\n    increaseNbBikes();\n}\n```\n\n- Please\
    \ modify the second constructor as follows (new code in bold):\n\n```java\npublic\
    \ Bike(int newColor)\n{\n    color = newColor;\n    increaseNbBikes();\n}\n```\n\
    \n- Please modify the third constructor as follows (new code in bold):\n\n```java\n\
    public Bike(int newColor, float newSpeed)\n{\n    color = newColor;\n    speed\
    \ = newSpeed;\n    increaseNbBikes();\n}\n```\n"
  mdcn: "\n\n# 构造函数\n\n一个类通常包含一个构造函数；构造函数基本上是一个方法，它包含一组指令，用于初始化从该类中创建的对象。正如我们稍后将看到的，类可以有不同的构造函数，每个构造函数以不同的方式初始化新对象。有些可能需要参数，而有些可能完全不需要参数；但最终而言，所有的构造函数都用于根据类以特定的方式进行构造，通常是通过设置某些成员变量来实现。\n\
    \n正如我们在上一节中看到的，当创建一个新对象时，它默认会包含其所在类的所有成员变量和方法。要创建此对象，我们将使用类名后跟 `()`，如下例所示。\n\n\
    ```\nBike myBike = new Bike();\nmyBike.accelerate();\n```\n\n通过使用关键字 `new`，我们隐式地调用了来自\
    \ `Bike` 类的构造函数。如果你没有为你的类定义任何构造函数，这将调用默认构造函数，它除了从该类创建一个新对象外，什么都不做。\n\n话尽管如此，如果你愿意，可以为你的类创建一个或多个构造函数。这些创建的构造函数例如可以在初始化时更改新创建对象的某些属性。例如，构造函数可以在创建时为变量\
    \ `speed` 和 `color` 设置这些值。\n\n所以，例如，假设我们希望在创建时指定自行车的颜色；我们可以通过添加以下方法来修改 `Bike`\
    \ 类，如下：\n\n```\npublic Bike (int newColor)\n{\n    color = newColor;\n}\n```\n\
    \n这是一个新的构造函数，因为方法名与类名相同。它接受一个整数作为参数；因此在修改了我们的类描述（如上面的代码所示）之后，我们可以创建一个新的 `Bike`\
    \ 对象：\n\nBike myBike = new Bike(2);\n\n我们可以指定第二个构造函数，它将同时包含颜色和速度，如下所示：\n\n```\n\
    public Bike (int newColor, float newSpeed)\n{\n    color = newColor;\n    speed\
    \ = newSpeed;\n}\n```\n\n拥有多个构造函数是有用的，因为它们允许你以不同的方式实例化对象，取决于已经设置的参数，或者你希望在初始化阶段考虑的参数。在我们的情况下，我们可能只是想创建一个不指定速度或颜色的新自行车，或者创建一个新自行车并在初始化阶段指定其速度或颜色。因此，在这种情况下，拥有多个构造函数会非常方便。\n\
    \n所以，你可以在类中拥有不同的构造函数，系统将根据构造函数的签名（即应该传递给方法的参数）来确定应该调用哪一个构造函数。\n\n例如，假设我们为 `Bike`\
    \ 类有两个构造函数，如下。\n\n```\npublic Bike (int newColor)\n{\n    color = newColor;\n\
    }\npublic Bike (int newColor, float newSpeed)\n{\n    color = newColor;\n    speed\
    \ = newSpeed;\n}\n```\n\n如果按照如下方式创建新的 `Bike` 对象：\n\n```\nBike newBike = new Bike\
    \ (2)\n```\n\n...将调用第一个构造函数。\n\n如果按照如下方式创建新的 `Bike` 对象：\n\n```\nBike newBike =\
    \ new Bike (2, 10.0f)\n```\n\n...将调用第二个构造函数。\n\n你可能还会奇，如果在没有定义默认构造函数的情况下使用以下代码会发生什么。\n\
    \n```\nBike newBike = new Bike ();\n```\n\n事实上，每当你创建类时，也会（隐式地）定义一个默认构造函数，每当使用\
    \ `new` 操作符不带参数创建新对象时，就会被调用。这被称为默认构造函数。在这种情况下，将使用每个类型数值成员变量的默认值（例如，整数为 0，布尔变量为\
    \ false）。\n\n> 注意，对构造函数的访问通常是公共的（public），除非我们希望某个类不被实例化的特殊情况（例如，对于仅包含静态成员的类）。另外注意，作为成员变量，如果没有指定访问修饰符，它们默认是私有的（private）。方法的情况也是如此。\n\
    \n现在这已经清楚了，让我们实验一下不同的构造函数。\n\n请打开 `Bike` 文件。\n\n- 在类的末尾添加以下代码（最后一个大括号之前）。\n\n\
    ```\npublic int getColor()\n{\n    return color;\n}\npublic Bike(int newColor)\n\
    {\n    color = newColor;\n}\n}\n\npublic Bike(int newColor, float newSpeed)\n\
    {\n    color = newColor;\n    speed = newSpeed;\n}\n```\n\n在之前的代码中，我们创建了一个 `getColor`\
    \ 方法来返回当前 `Bike` 的颜色；我们还创建了两个额外的构造函数，每个接受不同数量和类型的参数。\n\n- 现在你可以保存并编译针对 `Bike`\
    \ 文件的代码了。\n\n现在，我们只需要使用这些构造函数。\n\n- 在 `MyClass` 文件中，请如下所示修改 `main` 方法（**粗体代码**）；\n\
    \n在之前的代码中：\n创建两辆额外的自行车。\n\n- `myBike2` 使用第二个构造函数创建，我们将数字 2（作为其颜色）传递给此构造函数。\n-\
    \ `myBike3` 使用第三个构造函数创建，我们将数字 10 作为其颜色，并将数字 3 作为其速度传递。\n\n现在你可以保存 `MyClass` 文件的代码并运行应用程序，屏幕上应该显示以下内容：\n\
    \n```\nInitial Speed=0\nColor of Bike2=2, Speed=0\nColor of Bike3=10, Speed=3\n\
    ```\n\n所以，得益于构造函数，我们能够创建自行车的数量。\n\n# 类静态成员\n\n静态成员的概念相比过程化编程提供了巨大的优势。当一个变量被声明为静态（static）时，该类只存在一个实例。静态方法也是如此：它们可以在无需实例化的情况下被调用。\n\
    \n所以，让我们探索如何在类中使用静态函数和变量。我们可以创建一个静态变量，例如，用于计算自行车的数量；在这种情况下，静态变量是理想的，因为它在所有类实例之间共享。让我们看看如何操作。\n\
    \n- 请打开 `Bike` 文件。\n- 在类的开头添加以下代码（**粗体代码**）。\n\n```\npublic class Bike\n{\n  \
    \  private float speed;\n    private int color;\n    private static int nbBikes;\n\
    ```\n\n在之前的代码中，我们声明了变量 `nbBikes`，用于跟踪从 `Bike` 类实例化（或创建）的自行车数量。它是私有的且静态的，这意味着它仅供成员方法可用，并在\
    \ `Bike` 类的实例之间共享。\n\n- 在此类添加以下方法：\n\n```java\nprivate void increaseNbikes()\n\
    {\n    nbBikes++;\n}\n\npublic int getNbikes()\n{\n    return (nbBikes);\n}\n\
    ```\n\n在之前的代码中：\n\n- 我们声明了两个方法。\n- `increaseNbikes` 方法是私有的，因此只能从成员方法访问，每次调用它都会增加变量\
    \ `nbBikes` 的值。\n- `getNbikes` 方法是公共的，这意味着它可以从类外部访问，并返回从 `Bike` 类实例化的对象总数。\n\n\
    现在现在修改早早为 `Bike` 类创建的三个构造函数，以便每当创建一个自行车时，自行车的数量相应增加。\n\n- 请如下所示修改第一个构造函数（**粗体代码**）：\n\
    \n```java\npublic Bike()\n{\n    increaseNbikes();\n}\n```\n\n- 请如下所示修改第二个构造函数（**粗体代码**）：\n\
    \n```java\npublic Bike(int newColor)\n{\n    color = newColor;\n    increaseNbikes();\n\
    }\n```\n\n- 请如下所示修改第三个构造函数（**粗体代码**）：\n\n```java\npublic Bike(int newColor, float\
    \ newSpeed)\n{\n    color = newColor;\n    speed = newSpeed;\n    increaseNbikes();\n\
    }\n```\n\n"
