    (and from where) this class may be accessed and used. In Java there are four types
    of access modifiers, including public (no restrictions), protected (access limited
    to the containing class, classes from the same package - a grouping of files -,
    and subclasses from other packages), default (this the default mode if no access
    modifier is specified; in this case, access is limited to the containing class
    and classes from the same package) and private (access only from the containing
    class or type). In our case, we should be to use this class anywhere in our programme.


    +   * The names of all variables are preceded by their type (i.e., int), and the
    keyword public: this means these integer variables will be accessible throughout
    our application (i.e., outside the class if need be).m

    * Some of the names of the methods are preceded by the keywords public void (e.g.,
    for the methods accelerate or turnRight): the void keyword means that the method
    does not return any data, while the keyword public means that the method will
    be accessible throughout our application.

    * Some of the names of the methods are preceded by the keywords private void (e.g.,
    for the method calculatedDistance): the void keyword means that the method does
    not return any data, while the keyword private means that the method will be accessible
    only from the containing type (i.e., Bike).


    By defining the class Bike, we effectively define a template that can be used
    later on to create bikes. Once new bikes are created, it will be possible to modify
    their properties/ (or attributes). Again, this class can be used in any programme,
    so it is totally reusable; it needs to be defined once, and used to create new
    bikes. Again, all the data and algorithms related to a bike is encapsulated in
    the class Bike. Looking at the class, it is easy to understand how the data and
    the algorithms related to each other, and it is consequently easier to maintain
    the code.'
  md: "\n# WHY USE Object-Oriented Programming\n\nSo far, you have managed to learn\
    \ and to understand some very interesting programming concepts such as variables\
    \ and functions (methods) as well as control structures such as loops and conditional\
    \ statements. So, even without using object-oriented programming, you could at\
    \ this stage create some very interesting programmes very easily.\n\nHowever,\
    \ what if you wanted to build several programmes that re-use some of the code\
    \ that you have already created? What if you would prefer not to reinvent the\
    \ wheel and to re-use components that you have already created for a previous\
    \ programme?\n\nIn many cases, if you stick to a procedural-oriented programme\
    \ that just consists of functions (methods) and variables, and control structures,\
    \ this would be difficult. For example, if you wanted to reuse a function that\
    \ you have already created in a different programme, you would need to manually\
    \ copy/paste it into the new programme.\n\nThis is because functions, when written\
    \ in a non-Object-Oriented environment, are not designed to be reusable in a different\
    \ context without actually opening the previous code and copy/pasting it in a\
    \ different programme. In addition, the use of functions, variables and control\
    \ structures may not make it possible to model (and consequently solve) a real-life\
    \ problem, because procedural approaches differentiate between data and functions\
    \ and do not use a high-level abstraction. In other words: it is difficult to\
    \ understand how the code relates to what we are trying to model, by looking at\
    \ it.\n\nFor example, if you want to create a programme that tries to model the\
    \ way soccer players interact on the field, you would typically create functions\
    \ to move the player and the ball, but the structure of the programme may be difficult\
    \ to understand. Functions may exist, but it may be difficult to understand how\
    \ they relate to the players or the ball. In addition, reusing some of this code\
    \ to create another game, but this time a basketball game, may mean that most\
    \ of it would need to be rewritten or copy/pasted.\n\nAll in all, using a procedural\
    \ approach can make your code less maintainable, less reusable, and overall prone\
    \ to duplication, hence, more time-consuming.\n\nOn the other hand, OOP programmes\
    \ are designed to palliate (wait, original says \"palliate\") some of the issues\
    \ found in procedural programming, that is: data and associated algorithms (i.e.,\
    \ methods) are \"encapsulated\" within a class, and are hence reusable. In addition,\
    \ the use of classes and objects makes it possible to model the issue that you\
    \ are trying to solve based on the what you are trying to model rather than your\
    \ own programme logic. For example, if you want to create a game of soccer and\
    \ then a game of basketball, you can create classes that will be reusable and\
    \ employed in both games, to model the entities involved in the game with meaningful\
    \ names and associated data and methods; for example, you could create classes\
    \ such as Ball, Player, Field, Rules, etc. Using the power of inheritance, as\
    \ we will see later, you will also be able to create more specific behaviors depending\
    \ on the game that you are developing, all resulting in code that can be reused\
    \ across programmes, and that is easier to understand as the classes provide a\
    \ virtual, and more understandable representation of the entities for each type\
    \ of game.\n\n# CLASSES\n\nWhen coding in Java, you will be creating applications\
    \ that are either classes or that use built-in classes. So what is a class?\n\n\
    As we have seen earlier, Java is an Object-Oriented Programming (OOP) language.\
    \ Put simply, a Java programme will consist of a collection of objects that interact\
    \ amongst themselves. Each object has one or more attributes, and it is possible\
    \ to perform actions on these objects using what are called methods. In addition,\
    \ objects that share the same properties are said to belong to the same class.\
    \ The idea here is that we will encapsulate both the data and the algorithm (e.g.,\
    \ methods) related to an entity in one class.\n\nFor example, we could take the\
    \ analogy of a bike. There are bikes of all shapes and colors; however, they share\
    \ common features. For example, they all have a specific number of wheels (e.g.,\
    \ one, two or three) or a speed; they can have a color, and actions can be performed\
    \ on these bikes (e.g., accelerate, turn right, left turn, etc.).\n\nSo object-oriented\
    \ programming, to group all data and algorithms associated with a bike, we could\
    \ create a class called Bike, which includes variables such as speed or color\
    \ (these would be referred to as member variables or attributes), and algorithms\
    \ or methods that can be applied to bikes, such as accelerate. \n\nOnce this class\
    \ has been created, it could be reused in different programmes; for example, a\
    \ bike race, a bike shop, or a game where the player explores the environment\
    \ with a bike. As you see, creating a class called Bike makes the code reusable.\
    \ The class is declared once and it can be used several times. In addition, we\
    \ can make modifications to the class called Bike and these changes will be propagated\
    \ to all the games that use this class. This would certainly save us significant\
    \ time.\n\nSo if we were to define a common type, we could define a class called\
    \ Bike and for this class define member variables and attributes that would make\
    \ it possible to define and perform actions on the type of Bike.\n\nThis is, obviously,\
    \ a simplified explanation of classes and objects, but it should give you a clearer\
    \ idea of the concept of object-oriented programming if you are new to it, and\
    \ explain how useful it is to use classes rather than just variables, functions,\
    \ and control structures.\n\n# DEFINING A CLASS\n\nNow that we have a clearer\
    \ idea of what a class is, let's see how we could define a class. So let's look\
    \ at the following example.\n\n```java\npublic class Bike\n{\n    private float\
    \ speed;\n    private int color;\n\n    public void accelerate()\n    {\n    \
    \    speed++;\n    }\n\n    public void turnRight()\n    {\n    }\n\n    private\
    \ void calculateDistance()\n    {\n    }\n}\n```\n\nIn the previous code, we have\
    \ defined a class, called Bike, that includes two member variables (speed and\
    \ color) as well as two methods (accelerate and turnRight). So again we encapsulate\
    \ all the data and algorithms related to a bike in one class. This way, it is\
    \ easier to see what can be done with a bike; let's look at the class a little\
    \ closer:\n\n- The name of the class is preceded by the keywords public class;\
    \ in OOP terms, the keyword public is called an access modifier and it defines\
    \ how and where this class may be accessed and used. In Java there are four types\
    \ of access modifiers, including public (no restrictions), protected (access limited\
    \ to the containing class, classes from the same package, and subclasses from\
    \ other packages), default (this the mode if no access modifier is specified;\
    \ in this case, access is limited to the containing class and classes from the\
    \ same package) and private (access only from the containing class). In our case,\
    \ we should use this class anywhere in our programme.\n- The names of all variables\
    \ are preceded by their type (e.g., int), and the keyword public: this means these\
    \ integer variables will be accessible throughout our application (i.e., outside\
    \ the class if need be).\n- Some of the names of the methods are preceded by the\
    \ keywords public void (e.g., for the methods accelerate and turnRight): the void\
    \ keyword means that the method does not return any data, while the keyword public\
    \ means that the method will be accessible throughout our application.\n- Some\
    \ of the names of the methods are preceded by the keywords private void (e.g.,\
    \ for the method calculateDistance): the void keyword means that the method does\
    \ not return any data, while the keyword private means that the method will be\
    \ accessible only from the containing type (i.e., Bike).\n"
  mdcn: "\n\n# 为什么要使用面向对象编程\n\n到目前为止，你已经设法成功地学习并理解了一些非常有趣的编程概念，例如变量和函数（方法），以及循环和条件语句等控制结构。因此，即使不使用面向对象编程，你在现阶段也可以很容易地创建一些非常有趣的程序。\n\
    \n然而，如果你想构建几个程序，并复用你已经创建的一些代码呢？如果你倾向于不要重复轮子，而是想复用你之前为某个程序创建的组件呢？\n\n在很多情况下，如果你坚持使用仅由函数（方法）、变量和控制结构组成的过程化程序，这将是非常困难的。例如，如果你想在另一个程序中复用已经创建的函数，你将需要手动将其复制/粘贴到新程序中。\n\
    \n这是因为函数在非面向对象的环境中编写时，并没有设计成可以在不同的上下文中直接复用，除非你实际上打开之前的代码并将其复制粘贴到不同的程序中。此外，函数、变量和控制结构的使用可能无法建模（并因此解决）现实世界的问题，因为过程化方法将数据和函数区分开来，并且没有使用高层抽象。换句话之：通过观察代码，很难理解代码与我们试图建模的内容之间有什么关系。\n\
    \n例如，如果你想创建一个试图模拟足球运动员在场上互动方式的程序，你通常会创建移动球员和球的函数，但程序的结构可能很难理解。函数可能存在，但可能很难理解它们与球员或球之间有什么关系。此外，复用这部分代码来创建另一个游戏（这次是篮球游戏）可能意味着大部分内容需要重写或复制/粘贴。\n\
    \n总而言之，使用过程化方法会使你的代码可维护性降低、可复用性降低，并且总体容易出现重复，从而更加耗时。\n\n另一方面，面向对象编程（OOP）程序旨在缓解在过程化编程中发现某些问题，即：数据和相关的算法（即方法）被“封装”在一个类中，因此是可复用的。此外，类和对象的使用使得你能够根据你试图建模的内容，而不是你自己的程序逻辑，来建模你试图解决的问题。例如，如果你想创建一个足球游戏，然后创建一个篮球游戏，你可以创建在两个游戏中都被复用并使用的类，用有意义名称以及关联数据和方法对建模游戏中的实体；例如，你可以创建如\
    \ `Ball`（球）、`Player`（球员）、`Field`（球场）、`Rules`（规则）等类。通过继承的力量（正如我们稍后看到的），你还将根据你正在开发的游戏创建更具体的行为，所有这些生成的代码可以在程序间复用，并且更容易理解，因为类为每种类型的游戏提供了虚拟的、更易理解的实体表示。\n\
    \n# 类 (CLASSES)\n\n在 Java 中编写代码时，你创建的应用程序要么是类，要么使用内置类。那么，什么是类呢？\n\n正如我们之前看到的，Java\
    \ 是一种面向对象编程（OOP）语言。简单来说，一个 Java 程序将由一组相互作用的对象集合组成。每个对象都有一个或多个属性，并且可以使用所谓的方法对这些对象执行操作。此外，共享相同属性的对象被认为属于同一个类。这里的思想是我们将与实体相关的数据和算法（例如方法）都封装在一个类中。\n\
    \n例如，我们可以以自行车作类比。自行车有各种形状和颜色的；然而，它们具有共同的特征。例如，它们都有特定数量的轮子（例如一个、两个或三个）或一个速度；它们可以有颜色，并且可以在这些自行车上执行操作（例如加速、右转、左转等）。\n\
    \n所以，为了将与自行车相关的所有数据和算法归类，我们可以创建一个名为 `Bike` 的类，它包含了如速度或颜色之类的变量（这些被称为成员变量或属性），以及可以应用于自行车的算法或方法，如加速（加速）。\n\
    \n一旦创建了这个类，它就可以在不同的程序中复用；例如，自行车赛、自行车商店，或者玩家骑自行车探索环境的游戏。如你所见，创建一个名为 `Bike` 的类使得代码变得可复用。该类被声明一次，可以被多次使用。此外，我们可以对名为\
    \ `Bike` 的类进行修改，这些更改将传播到所有使用该类的游戏。这无疑将为我们节省大量时间。\n\n所以，如果我们定义一种通用类型，我们可以定义一个名为\
    \ `Bike` 的类，并为该类定义成员变量和属性，使得对这种 `Bike` 类型进行定义和执行操作成为可能。\n\n这显然是对类和对象的简化的解释，但如果你是面向对象编程的新手，它应该能让你对面向对象编程的概念有一个更清晰的认识，并解释使用类而不是仅仅使用变量、函数和控制结构有多有多用。\n\
    \n# 定义类 (DEFINING A CLASS)\n\n现在我们对类是什么有了更清晰的认识，让我们看看如何定义一个类。让我们来看下面的示例。\n\n```java\n\
    public class Bike\n{\n    private float speed;\n    private int color;\n\n   \
    \ public void accelerate()\n    {\n        speed++;\n    }\n\n    public void\
    \ turnRight()\n    {\n    }\n\n    private void calculateDistance()\n    {\n \
    \   }\n}\n```\n\n在之前的代码中，我们定义了一个名为 `Bike` 的类，它包含了两个成员变量（`speed` 和 `color`）以及两个方法（`accelerate`\
    \ 和 `turnRight`）。因此，我们将与自行车相关的所有数据和算法再次封装在一个类中。这样，更容易看到自行车可以做什么；让我们仔细观察一下这个类：\n\
    \n- 类名的前面是关键字 `public class`；在 OOP 术语中，关键字 `public` 称为访问修饰符，它定义了如何以及何时何访问和使用此类。在\
    \ Java 中有四种访问修饰符，包括 `public`（无限制）、`protected`（访问限于包含类、同包的类以及其他包的子类）、`default`（当未指定访问修饰符时的模式；在这种情况下，访问限于包含类和同包的类）和\
    \ `private`（仅从包含类访问）。在我们的情况下，我们应该在程序的任何地方使用此类。\n- 所有变量的名字前面都是它们的类型（例如 `int`）和关键字\
    \ `public`：这意味着这些整数变量将在整个应用程序中可访问（即如果需要，可以在类外部访问）。\n- 某些方法的名字前面是关键字 `public void`（例如\
    \ `accelerate` 和 `turnRight` 方法）：`void` 关键字意味着方法不返回任何数据，而 `public` 关键字意味着该方法在整个应用程序中可访问。\n\
    - 某些方法的名字前面是关键字 `private void`（例如 `calculateDistance` 方法）：`void` 关键字意味着方法不返回任何数据，而\
    \ `private` 关键字意味着该方法仅从包含的类型（即 `Bike`）访问。\n\n"
