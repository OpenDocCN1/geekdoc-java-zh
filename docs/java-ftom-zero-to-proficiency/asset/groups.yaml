    \ Vehicle 类定义的方法和变量没有在这里出现；这是因为它们被隐式地添加了这个新类中，因为它继承自 Vehicle 类。\n\n在使用继承时，父类通常被称为**基类（或超类/父类）**，而子类被称为**子类**。\n\
    \n现在，虽然子类从父类继承了“特征”，但这些特征始终被修改，或者简单来说，被重写。在 Java 中，默认情况下，所有非静态方法都是虚拟的。换句话说，只要方法被声明为非静态，它就可以被子类重写。在重写方法时，必须使用\
