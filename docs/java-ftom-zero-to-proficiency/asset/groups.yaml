    \nI hope everything is clear so far, as we are going to look into a very interesting\
    \ and important concept for object-oriented programming: inheritance. The main\
    \ idea behind inheritance is that objects can inherit their properties from other\
    \ objects (i.e., their parent). As they inherit these properties, they can remain\
    \ identical to their parent or evolve and overwrite some of these inherited properties.\
    \ This is very interesting because it makes it possible to minimize the code by\
    \ creating a class with general properties for all objects sharing similar features,\
    \ and then, if need be, to overwrite and customize some of these properties for\
    \ the children.\n\nLet's take the example of vehicles. Vehicles would generally\
    \ have the following properties:\n\n- Number of wheels.\n- Speed.\n- Number of\
    \ passengers.\n- Color.\n- Capacity to accelerate.\n- Capacity to stop.\n\nSo\
    \ we could create the following class for example:\n\n```java\nclass Vehicle {\n\
    \    private int nbWheels;\n    protected float speed;\n    private int nbPassengers;\n\
    \    private int color;\n    public void accelerate() {\n        speed++;\n  \
    \  }\n}\n```\n\nThese features could apply for example to cars, bikes, motorbikes,\
    \ or trucks. However, all these vehicles also differ; some of them may or may\
    \ not have an engine or a steering wheel. So we could create a subclass called\
    \ MotorizedVehicle, based on Vehicle, but with specificities linked to the fact\
    \ that they are motorized. These added attributes could be:\n\n- Engine size.\n\
    - Petrol type.\n- Petrol levels.\n- Ability to fill-up the tank.\n\nThe following\
    \ example illustrates how this class could be created.\n\n```java\nclass MotoredVehicle\
    \ extends Vehicle {\n    private float engineSize;\n    private int petrolType;\n\
    \    private float petrolLevels;\n    public void fillUpTank() {\n        petrolLevels+=10;\n\
    \    }\n}\n```\n\n- When the class is defined, its name is followed by \"extends\
    \ Vehicle\". This means that it inherits from the class Vehicle. So it will, by\
    \ default, avail of all the methods and variables already included in the class\
    \ Vehicle.\n\n- We have created a new member method for this class, called fillUpTank.\n\
    \n- In the previous example, you may notice that the methods and variables that\
    \ were defined for the class Vehicle do not appear here; this is because they\
    \ are implicitly added to this new class, since it inherits from the class Vehicle.\n\
    \nWhen using inheritance, the parent is usually referred to as the **base class\
    \ (or superclass/parent class)** while the child is referred to as the **subclass.**\n\
    \nNow, while the child inherits \"features\" from its parents, these can always\
    \ be modified, or put simply, overwritten. By default, in Java, all non-static\
    \ methods are virtual. In other words, as long as a method is declared as not\
    \ static, it can be overridden by its children. When overriding a method, the\
    \ keyword Override must be used. This is illustrated in the following code.\n\n\
    ```java\nclass Vehicle\n{\n    private int nbWheels;\n    protected float speed;\n\
