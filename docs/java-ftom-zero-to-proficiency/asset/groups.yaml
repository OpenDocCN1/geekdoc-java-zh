    - 我们要求用户输入他们的猜测。这次我们使用 **sc.nextInt()** 方法，因为答案将作为整数存储。

    - 一旦答案被输入，它就会存储在变量 **result** 中。

    - 我们根据变量 **result** 的值执行条件语句。如果输入的文本是 "2"，则显示消息 **"Well done"**，否则显示消息 **"Sorry
    Wrong Answer"**。


    你现在可以保存代码、编译并运行你的程序，对于上一个例子，你应该看到一段要求你输入问题 "What is 2 + 2" 答案的文本。


    - 在输入数字 **2** 并按下 **Enter** 后，应该出现一条显示 **"Well done"** 的消息。


    # METHODS


    现在你已经声明并组合了数字和字符串，是开始研究方法（methods）的好时候了。


    方法可以比作朋友或同事，你根据特定的指令请求他们执行某项任务，并在需要时返回信息。


