    # WHY USE Object-Oriented Programming


    So far, you have managed to learn and to understand some very interesting programming
    concepts such as variables and functions (methods) as well as control structures
    such as loops and conditional statements. So, even without using object-oriented
    programming, you could at this stage create some very interesting programmes very
    easily.


    However, what if you wanted to build several programmes that re-use some of the
    code that you have already created? What if you would prefer not to reinvent the
    wheel and to re-use components that you have already created for a previous programme?


    In many cases, if you stick to a procedural-oriented programme that just consists
    of functions (methods) and variables, and control structures, this would be difficult.
    For example, if you wanted to reuse a function that you have already created in
    a different programme, you would need to manually copy/paste it into the new programme.


    This because functions, when written in non-Object-Oriented environment, are not
    designed to be reusable in a different context without actually opening the previous
    code and copy/pasting it in a different programme. In addition, the use of functions,
    variables and control structures may not make it possible to model (and consequently
    solve) a real-life problem, because procedural approaches differentiate between
    data and functions and do not use a high-level abstraction. In other words: it
    is difficult to understand how the code relates to what we are trying to model,
    by looking at it.


    For example, if you want to create a programme that tries to model the way soccer
    players interact on the field, you would typical create functions to move the
    player and the ball, but the structure of the programme may be difficult to understand.
    Functions may exist, but it may be difficult to understand how they relate to
    the players or the ball. In addition, reusing some of this code to create another
    game, but this time a basketball game, may mean that most of it would need to
    be rewritten or copy/pasted.


    All in all, using a procedural approach can make your code less maintainable,
    less reusable, and overall prone to duplication, hence, more time-consuming.'
  - '[PAGE 106]


    On the other hand, OOP programmes are designed to palliate some of the issues
    found in procedural programming, that is: data and associated algorithms (i.e.,
    methods) are "encapsulated" within a class, and are hence reusable. In addition,
    the use of classes and objects makes it possible to model the issue that you are
    trying to solve based on the what you are trying to model rather than your own
    programme logic. For example, if you want to create a game of soccer and then
    a game of basketball, you can create classes that will be reusable and employed
    in both games, to model the entities involved in the game with meaningful names
    and associated data and methods; for example, you could create classes such as
    Ball, Player, Field, Rules, etc. Using the power of inheritance, as we will see
    later, you will also be able to create more specific behaviors depending on the
    game that you are developing, all resulting in code that can be reused across
    programmes, and that is easier to understand as the classes provide a virtual,
    and more understandable representation of the entities for each type of game.'
  - "[PAGE 107]\n\n# CLASSES\n\nWhen coding in Java, you will be creating applications\
    \ that are either classes or that use built-in classes. So what is a class?\n\n\
    As we have seen earlier, Java is an Object-Oriented Programming (OOP) language.\
    \ Put simply, a Java programme will consist of a collection of objects that interact\
    \ amongst themselves. Each object has one or more attributes, and it is possible\
    \ to perform actions on these objects using what are called methods. In addition,\
    \ objects that share the same properties are said to belong to the same class.\
    \ The idea here is that we will encapsulate both the data and the algorithm (e.g.,\
    \ methods) related to an entity in one class.\n\nFor example, we could take the\
    \ analogy of a bike. There are bikes of all shapes and colors; however, they share\
    \ common features. For example, they all have a specific number of wheels (e.g.,\
    \ one, two or three) or a speed; they can have a color, and actions can be performed\
    \ on these bikes (e.g., accelerate, turn right, left turn, etc.).\n\nSo object-oriented\
    \ programming, to group all data and algorithms associated with a bike, we could\
    \ create a class called Bike, which includes variables such as speed or color\
    \ (these would be referred as member variables or attributes), and algorithms\
    \ or methods that can be applied to bikes, such as accelerate. \n\nOnce this class\
    \ has been created, it could be reused in different programme; for example, a\
    \ bike race, a bike shop, or a game where the player explores the environment\
    \ with a bike. As you see, creating a class called Bike makes the code reusable.\
    \ The class is declared once and it can be used several times. In addition, we\
    \ can make modifications to the class called Bike and these changes will be propagated\
    \ to all the games that use this class. This would certainly save us significant\
    \ time.\n\nSo if we were to define a common type, we could define a class called\
    \ Bike and for this class define member variables and attributes that would make\
    \ it possible to define and perform actions on the type of Bike.\n\nThis is, obviously,\
    \ a simplified explanation of classes and objects, but it should give you a clearer\
    \ idea of the concept of object-oriented programming if you are new to it, and\
    \ explain how useful it is to use classes rather than just variables,"
