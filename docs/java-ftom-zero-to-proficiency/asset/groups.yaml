    In Java, you can use comments to explain your code and to make it more readable
    by others. This becomes important as the size of your code increases; and it is
    also important if you work in a team, so that other team members can understand
    your code and make amendments in the right places, and if when it is needed.


    Code that is commented is usually not executed. There are two ways to comment
    your code in Java using either single- or multi-line comments.


    In single-line comments, a double forward slash is added at the start of a line
    or after a statement, so that this line (or part thereof) is commented, as illustrated
    in the next snippet.


    ```

    // the next line prints Hello in the console window

    System.out.println("Hello");

    //the next line declares the variable name

    String name;

    name = "Hello";//sets the value of the variable name

    ```


    In multi-line comments, any code between the forward slash and star "/*" and the
    characters star and forward slash "*/" will be commented, and this code will not
    be executed. This is also referred to as comment blocks.


