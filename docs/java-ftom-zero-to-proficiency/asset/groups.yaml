    # 1 INTRODUCTION TO JAVA PROGRAMMING


    > "Everybody in this country should learn to program a computer, because it teaches
    you how to think"


    - Steve Jobs


    In this section, we will go through an introduction to Java programming and look
    at key aspects of this programming language, including:


    +   - It''s syntax.

    - Variable types and scope.

    - Methods.


    So, after completing this chapter, you will be able to:


    +   - Understand key concepts related to Java programming.

    - Understand how to use variables and methods.

    - Create and use your own methods.


    | The code solutions for this chapter are included in the resource pack that you
    can download by following the instructions included in the section entitled "Support
    and Resources for this Book". |'
  - '[PAGE 22]


    # WHAT IS JAVA


    Java is a high level object-oriented language developed by Sun. It is a multiplatform
    language which means that once it has been written and compiled, a Java application
    can run on most platforms.


    The fact that it is an object-oriented programming language means that a Java
    programme consists of a collection of objects that interact with each other.


    Java is used for many purposes, including the creation desktop or mobile applications
    or even games.'
  - '[PAGE 23]


    # CHOOSING A CODE EDITOR


    In the next sections, you will start to write your own Java code. For this purpose,
    you will need to use a code editor, and more specifically, an Integrated Development
    Environment (IDE). These IDEs include all the necessary tools to compile and execute
    your code, in addition to other options that will speed-up your development and
    also help you keep it from bugs.


    Using an IDE will provide you with an easier way to create, organize and debug
    your code, with some of the following features:


    +   - Text highlighting: so that your code is clearer to read and to modify.


    +   - Auto-completion: so that you don''t have to remember the name of all the
    variables in your code, or the name of some common methods.


    +   - Error highlighting: so that some obvious errors are highlighted before you
    even test your code.


    There are many free IDEs available with their advantages and drawbacks, including:


    +   - BlueJ.


    +   - Eclipse.


    +   - IntelliJ IDEA.


    +   - NetBeans.


    All these IDEs considered, we will be using BlueJ for this book, although you
    could use any of the other IDEs if you wish. BlueJ is an IDE specially developed
    for beginners. It won''t overwhelm you with too many features, but instead, help
    you to get started with Java and provide some very useful features along the way
    that will make your coding cleaner, such as class diagrams, or code split into
    color-coded blocks.


