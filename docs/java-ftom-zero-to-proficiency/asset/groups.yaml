    ## 你将如何通过本书进行学习


    由于所有学生的学习方式都不同，对课程的预期也不同，本书的设计旨在确保所有读者都能找到适合自己的学习模式。因此，它包含以下内容：


    - 每一章开头都有学习目标列表，让你对将要获得的技能有一个直观的了解。

    - 节都包含所涵盖活动的概述。

    - 所有活动都是循序渐进的，你还可以通过每章末尾提供的挑战获得更深层次的学习和解决问题能力的机会。

    - 每一章最后都有测验和挑战，你可以通过它们来测试你的技能（以及学到的知识）。挑战包括根据你在章节中学的知识进行编码、调试或创建新功能。

    - 本书侧重于你需要的的核心技能。虽然某些章节涉及更详细的内容，但在解释概念后，必要时会提供额外资源的链接。

    - 代码是循序渐进引入的，并进行了详细的解释。


    ## 章节的格式和编写规范


    在本书中，为了让阅读和学习更加容易，将使用文本格式和图标来突出所提供的信息部分，并使书籍易于阅读。


    ## 特别说明


    每章都包含一个资源部分，让你进一步加深对 Java 的理解和掌握；这些包括：


    - 每章一个测验：这些测验通常包含10道题，测试你对整个章节涵盖主题的理解。解答紧随测验之后。

    - 检查清单：它由 5 到 10 个关键概念和技能组成，在进入下一章之前需要熟练掌握它们。

    - 挑战：每章都包含一个挑战章节，要求你结合技能来解决特定问题。


    作者注释显示所示：


    作者的建议出现在此框中。


    代码显示如下所示：


    ```java

    public int score;

    public String playersName = "Sam";

    ```


    包含章节重点的检查清单显示如下所示：


    - 检查清单项目 1。

    - 检查清单项目 2。

    - 检查清单项目 3。


    ## 如何从本书中学习得最好？


    - 向你的朋友讲述你正在做的事情。


    我们通常认为自己理解某个主题，直到必须向朋友解释它并回答他们的问题。通过解释你的不同项目，你刚刚学到的对你来说将变得清晰。


    - 做练习。


    所有章节都包含练习，帮助你通过实践来学习。换句话说，通过完成这些练习，你将能够更好地理解主题并获得实践技能（而不是不仅仅是阅读）。


    - 不要害怕犯错。


    我通常告诉我的学生犯错是学习过程的一部分；犯的错越多，学习的机会就越多。在开始时，你可能会发现错误具有挑战性，或者在你理解哪里出了问题之前，发现你的程序没有按照预期运行。


    - 挑战自我。


    所有章节都包含一个挑战章节，你可以在那里决定承担特定的挑战来提高你的编程或技能。这些挑战是为了让你创造性地思考，并以基于问题的方法应用你在每章中学到的知识。


    - 分块学习。


    连续读五六章可能可能有挑战性，因为这可能会降低你的积极性。相反，给自己留出足够的时间学习，并以小单位进行学习（例如，每天15到20分钟）。这至少能为你做两件事：它会让你的大脑有时间“消化”你刚刚学习的信息，以便你第二天能够重新开始。它还能确保你不会崩溃，并保持高水平的积极性。


    ## 反馈


    虽然我已经尽一切努力编写出一本高质量且有价值的书，但我一直感谢读者的反馈，以便对书籍相应的改进。如果你想对本书提供反馈，可以发送电子邮件给我：learntocodewithpat@gmail.com。


    ## 1 Java 编程简介


    > “这个国家的每个人都应该学会编写计算机程序，因为它能教你如何思考”

    - 史蒂夫·乔布


    在本节中，我们将对 Java 进行介绍，并查看其关键方面，包括：


    - 语法。

    - 变量。

    - 方法


    在完成本章后，你将能够：


    - 理解 Java 的核心概念。

    - 理解如何使用变量。

    - 创建并使用方法。


    本章的解答包含在资源包。


    ## 什么是 JAVA


    Java 是由 Sun 公司开发的高级面向对象的语言。它是一种多平台语言，这意味着一旦编写并编译，Java 应用程序就可以在大多数平台上运行。Java 用于许多目的，包括移动应用程序甚至游戏。


    ## 选择代码编辑器


    在接下来的章节中，你将开始编写代码。为此，你需要使用代码编辑器，更具体地说，是一个集成开发环境（IDE）。这些 IDE 包含了编译和执行代码所需的所有工具，并具有以下功能：


    - 文本高亮：让代码更清晰。

    - 自动补全：让你不需要记住代码中的所有变量或某些方法的名称。

    - 错误高亮：在测试代码之前突出显示明显的错误。


    有许多免费的 IDE 各自有优缺点，包括：


    - BlueJ。

    - Eclipse。

    - IntelliJ IDEA。

    - NetBeans。


    考虑到所有 IDE，我们将在中使用 BlueJ，尽管你也可以使用任何其他 IDE。BlueJ 是一个专门为初学者设计的 IDE。它不会用过多的功能淹没你，而是帮助你入门
    Java，并在过程中提供非常有用的功能，例如类图或颜色标记的代码。


    你可以从以下网站下载 BlueJ：https://www.bluej.org/


    ## 安装 JAVA


    在使用 Java 之前，你需要安装最新版本的开发工具包（JDK）。JDK 包含了编写、编译和运行 Java 代码所需的所有库。


    要这样做，请执行以下操作：


    - 打开以下页面：https://www.oracle.com/technology/Java/Javase/downloads/index.html

    - 寻找最新版本的 Java SE 开发工具包。

    - 下载最新的 Java SE DK：在本书编写时，Java 的最新版本是 Java SE 11.0.2。


    ![](img/2fd2d26163705439bcd4d1a674a34298_25_0.png)


    图 1-1：下载 SDK（部分 1）


    - 点击下载按钮后，将一组新选项，你可以接受许可协议后从中选择你想要下载的版本。


