  mdcn: "\n\n# 包与命名空间\n\n在 Java 中，可以将多个文件和类分组到特定的目录或包（package）下，以避免歧义并明确我们想要使用的特定类源自何。\n\
    \n默认情况下，Java 包含了几个内置包，其中包含可用于特定目的类；例如，`java.io` 包可以用于处理输入和输出，而 `java.util.zip`\
    \ 包可以用于处理 zip 文件。\n\n包被创建后，就可以使用 `import` 指令相应地导入并使用其中的类。\n\n例如，在本书的第一部分，我们使用了一个名为\
    \ `Scanner` 的类来捕获用户的输入。`Scanner` 类是 `java.util` 包的一部分；因此，为了能够使用它，我们在 `MyClass`\
    \ 类开头添加了以下代码。\n\n```\nimport java.util.Scanner;\n```\n\n这样，当我们使用 `Scanner` 类时（如下一个代码所示），Java\
    \ 就知道我们引用的是位于 `java.util` 包中的 `Scanner` 类。\n\n```\nScanner sc=new Scanner(System.in);\n\
    ```\n\n同样，名为 `Arrays` 的类也是 `java.util` 包的一部分；因此，如果我们想使用它，我们在 `MyClass` 类开头添加了以下代码。\n\
    \n```\nimport java.util.Arrays;\n```\n\n这样，当我们使用 `Arrays` 类时（如下一个代码所示），Java 就知道我们引用的是位于\
    \ `java.util` 包中的 `Arrays` 类。\n\n```\nArrays.sort(test);\n```\n\n另一个非常有用的功能是可以同时从同一个包导入多个类。例如，如果我们想从\
    \ `java.util` 包导入多个类，我们也可以使用以下语法导入该包内的所有类：\n\n```\nimport java.util.*;\n```\n\n\
    # 列表 (Lists)\n\n正如我们在之前的章节中看到的，使用数组有时是有用的。然而，当你处理大量数据或随时间增长而增加的数据时，列表（lists）可能更有用，因为它们包含了用于排序和组织数据的内置工具。因此，你并不总是需要使用列表；但是，它们在组织数据方面可能更高效，特别是对于大型且不断变化的数据集。\n\
    \n让我们深入了解列表。\n\n- * 你可以如下声明一个列表：\n\n```\nArrayList<Integer> myList;\n```\n\n-\
    \ * 声明遵循以下语法：\n\n```\nArrayList <type> nameOfVariable;\n```\n\n所以，你可以创建一个整数、String\
    \ 或 `Vehicle` 对象的列表。列表创建后，Java 提供了几个内置方法，可以操作列表，包括：\n\n- add：在列表末尾添加一个项。\n- clear：从列表中删除所有元素。\n\
    - remove：从列表中删除一个项。\n- size：返回列表中的项目数量。\n\n列表中的每个元素都有一个默认索引，该索引相对于它首次被添加到列表的时间；项添加到列表的时间越早，索引越低。因此，默认添加到列表的第一个项索引为\
    \ 0，第二个项索引为 1，依此类推。\n\n让我们看一个例子：\n\n```\nArrayList<String> listOfNames = new ArrayList<String>();\n\
    listOfNames.add(\"Mary\");\nlistOfNames.add(\"Paul\");\nSystem.out.println(\"\
    Size of list \" + listOfNames.size());\n//这会显示 \"Size of list 2\"\n```\n\n```listOfNames.remove(\"\
    Paul\");\nSystem.out.println(\"Size of List after removing \" + listOfNames.size());\n\
    ```\n\n在之前的代码中：\n\n- 我们创建了一个 String 变量的新列表。\n- 接着我们向列表添加了两个元素，字符串 \"Mary\" 和 \"\
    Paul\"。\n- 我们显示了从列表中删除一个项前后的列表大小。\n\n我们现在可以尝试创建列表了。\n\n- 请在 `MyClass` 文件的开头（如果还没有这样做的话）添加以下代码。\n\
    \n```\nimport java.util.Arrays;\n```\n\n- 请在 `MyClass` 文件的 `main` 方法中添加以下代码。\n\
    \n```java\nArrayList<String> listOfNames = new ArrayList<String>();\nlistOfNames.add(\"\
    Mary\");\nlistOfNames.add(\"Paul\");\nlistOfNames.add(\"John\");\nlistOfNames.add(\"\
    Zoe\");\nlistOfNames.add(\"Hannah\");\nSystem.out.println(\"Size of List: \" +\
    \ listOfNames.size());\nlistOfNames.remove(\"Paul\");\nSystem.out.println(\"Size\
    \ of List after removing: \" + listOfNames.size());\n```\n\n在之前的代码中：\n\n- 我们声明了一个\
    \ String 列表并向其添加了五个名字。\n- 然后删除了列表的第一个元素（Paul）。\n- 我们还显示了删除前后的大小。\n\n你现在可以保存代码并运行程序；你应该看到以下内容。\n\
    \nSize of List: 5\n\n接下来，我们可以尝试按字母顺序对此列表排序；为了做到，我们将使用 `sort` 方法。\n\n- 请在 `MyClass`\
    \ 文件的 `main` 方法中添加以下代码。\n\n```java\nSystem.out.println(\"List before sort\");\n\
    for (int i = 0; i < listOfNames.size(); i++) {\n    System.out.println(listOfNames.get(i));\n\
    }\nCollections.sort(listOfNames);\nSystem.out.println(\"List after sort\");\n\
    for (int i = 0; i < listOfNames.size(); i++) {\n    System.out.println(listOfNames.get(i));\n\
    }\n```\n\n在之前的代码中：\n\n- 我们创建了一个从 0 到列表大小的循环。\n- 在循环中，我们显示了索引 `i` 处当前元素的名字。\n-\
    \ 实际上，我们遍历了列表并显示了每个元素的名字。\n- 随后，我们使用 `Collections` 类中的 `sort` 方法对列表排序。该类可以用于排序对象。\n\
    - 完成后，我们使用 `get` 方法显示刚刚排序过的列表元素。\n\n你现在可以保存代码并运行程序；你应该在控制台中看到以下消息。\n\n| Mary |\n\
