  - '[PAGE 111]


    # ACCESSING CLASS MEMBERS AND VARIABLES


    Once a class has been defined, it is great to be able to access its member variables
    and methods. In Java (as for other object-oriented programming languages), this
    can be done using the dot notation.


    The dot notation refers to object-oriented programming. Using dots, you can access
    properties and/or methods related to a particular object.


    Once a class has been defined, objects based on this class can be created. For
    example, if we were to create a new Bike object, based on the code that we have
    seen above, the following code in the file MyClass main method.


    ```

    Bike myBike = new Bike();

    ```


    This code will create (or instantiate) an object on the "template" Bike. You may
    notice the syntax:


    ```

    dataType variable = new dataType();

    ```


    By default, this new object will include all the member variables and methods
    defined earlier in the class Bike. So it will have a color and a speed, and we
    should also be able to access its accelerate and turnRight methods.


    So using the Object-Oriented approach, we can define a template for an object
    and use this template to create a new object that includes all the data and methods
    (algorithm) necessary to manage or modify this object. How can this be done?


    Let''s look at the next code snippet that shows how we can access these.


    ```

    b = new Bike();

    b.accelerate();

    ```


    In the previous code:


    +   * The new bikeBike is created.

    * The speed is then increased after calling the accelerate method. This method
    can be called using the dot notation because it is public.

    * Note that to call an object''s method we use the dot notation.'
