    \n# 继承\n\n我希望到目前为止一切都是清晰的，因为我们将研究一个面向对象编程中非常有趣且重要的概念：继承。继承的核心思想是对象可以从其他对象（即它们的父类）继承属性。当它们继承这些属性时，它们可以保持与父类相同，也可以演变并重写其中一些继承的属性。这非常有趣，因为它使得我们通过创建一个具有所有相似特征对象的通用属性的类来最大限度地减少代码，然后在需要时为子类重写并自定义这些某些属性。\n\
    \n让我们以车辆为例。车辆通常具有以下属性：\n\n- 轮子数量。\n- 速度。\n- 乘客人数。\n- 颜色。\n- 加速能力。\n- 停止能力。\n\n\
    因此，我们可以创建一个如下的类：\n\n```java\nclass Vehicle {\n    private int nbWheels;\n    protected\
    \ float speed;\n    private int nbPassengers;\n    private int color;\n    public\
    \ void accelerate() {\n        speed++;\n    }\n}\n```\n\n这些特征可以适用于汽车、自行车、摩托车或卡车。然而，所有这些车辆也不同；其中某些可能可能或没有引擎或方向盘。因此，我们可以基于\
    \ Vehicle 创建名为 MotorizedVehicle 的子类，但带有与其机械化相关的特殊性。这些新增属性可以是：\n\n- 引擎尺寸。\n- 燃油类型。\n\
    - 燃油水平。\n- 加油能力。\n\n下面的示例说明了如何创建此类。\n\n```java\nclass MotoredVehicle extends Vehicle\
    \ {\n    private float engineSize;\n    private int petrolType;\n    private float\
    \ petrolLevels;\n    public void fillUpTank() {\n        petrolLevels+=10;\n \
    \   }\n}\n```\n\n- 当定义类时，它的名称后面跟着 \"extends Vehicle\"。这意味着它继承自 Vehicle 类。因此，在默认情况下，它将可以使用\
