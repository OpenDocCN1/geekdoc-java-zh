  mdcn: "\n\n# 常量\n\n到目前为止，我们已经学习变量以及你如何在代码中无缝地存储和访问它们。之前的假设是值可能会随着时间而改变，并且该值将相应地存储在变量中。然而，在某些情况下，你确定某个值在整个应用程序运行过程中将保持不变。例如，你可能会定义引用不应随时间改变的值的变量，在这种情况下，你可以使用常量。\n\
    \n让我们来看看它是如何工作的：假设用户在应用程序的第一个菜单中有三个选择，我们将其标记为 0、1 和 2。假设你希望有一种一种简单的方法来记住这些值，以便处理相应的选择。让我们看下面的代码，它说明了这一想法：\n\
    \n```java\nint userCollection = 2;\nif (userChoice == 0) System.out.println(\"\
    you have decided to restart\");\nif (userChoice == 1) System.out.println(\"you\
    \ have decided to stop the application\");\nif (userChoice == 2) System.out.println(\"\
    you have decided to pause the application\");\n```\n\n在上一段代码中：\n\n- 变量 `userChoice`\
    \ 是一个整数，并设置为 2。\n- 然后我们检查变量 `userChoice` 的值，并在控制窗口中相应地打印消息。\n\n现在，当你向应用程序添加更多代码时，你可能记得也可能忘记值\
    \ 0 对应于重启应用程序；之前定义的其他两个值也是如此。因此，我们可以使用常量来使这些值更容易记忆（以及更容易使用）。让我们看看如何修改上一个示例以改用常量。\n\
    \n```java\npublic class MyClass\n{\n    public static int myMemberVariable;\n\
    \    public static final int CHOICE_RESTART = 0;\n    public static final int\
    \ CHOICE_STOP = 1;\n    public static final int CHOICE_PAUSE = 2;\n\n    public\
    \ static void testConstants()\n    {\n        int userChoice = CHOICE_RESTART;\n\
    \        if (userChoice == CHOICE_RESTART) System.out.println(\"you have decided\
    \ to restart\");\n        if (userChoice == CHOICE_STOP) System.out.println(\"\
    you have decided to stop the application\");\n        if (userChoice == CHOICE_PAUSE)\
    \ System.out.println(\"you have decided to pause the application\");\n    }\n\
    }\n```\n\n在上一段代码中：\n\n- 我们声明了三个常量变量：`CHOICE_RESTART`、`CHOICE_STOP` 和 `CHOICE_PAUSE`。\n\
    \n注意，常量使用大写字母是常用做法，这样它们会显眼。\n\n- 这些变量随后被用于检查用户的选择。\n- 要声明常量变量，我们使用 `static` 和\
    \ `final` 关键字；`final` 关键字意味着变量不能重新赋值，而 `static` 意味着该变量的值可以通过类的每个实例访问，或者在不实例化类的情况下访问。\n\
    \n你现在可以通过以下步骤测试此功能：\n\n- 请在类的开头处添加以下代码（加粗部分为新代码）：\n\n```java\npublic class MyClass{\n\
    \    public static int myMemberVariable;\n    public static final int CHOICE_RESTART\
    \ = 0;\n    public static final int CHOICE_STOP = 1;\n    public static final\
    \ int CHOICE_PAUSE = 2;\n```\n\n- 请在 `MyClass` 文件中添加以下方法。\n\n```java\npublic static\
    \ void useConstants()\n```\n\n{\n  int userChoice = CHOICE_RESTART;\n  if (userChoice\
