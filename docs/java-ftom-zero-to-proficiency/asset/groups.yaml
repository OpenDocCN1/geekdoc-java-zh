  mdcn: "\n因此有效地说，根据之前的图表我们可以看到，如果你创建一个电动车辆并对其进行加速，它的速度会增加 10，而不是像普通车辆那样增加 1。\n\n\
    继承的另一个有趣点是，可以重用并适配基类（父类）的构造函数。例如，目前 `Vehicle` 类的构造函数如下：\n\n```java\npublic Vehicle()\n\
    {\n}\n```\n\n为了使其更有用，我们可以对其进行修改，使其实际上初始化一些成员变量如下：\n\n```java\npublic Vehicle()\n\
    {\nspeed = 0;\nnbWheels = 2;\nnbPassengers = 2;\n}\n```\n\n因此，默认情况下创建一个新的 `MotoredVehicle`\
    \ 对象时，它会调用这个构造函数；尽管如此，当创建 `MotoredVehicle` 对象时，它的某些成员变量需要被修改或添加；例如，`MotoredVehicle`\
    \ 对象还需要为变量 `engineSize`、`petrolType` 或 `petrolLevels` 设置初始值；因此为了一石二鸟，我们可以编写代码调用父类构造函数来初始化\
    \ `speed`、`nbWheels` 和 `nbPassengers`，同时为变量 `engineSize`、`petrolType` 和 `petrolLevels`\
    \ 设置初始值。\n\n我们可以如下修改 `MotoredVehicle` 类的默认构造函数：\n\n```java\npublic MotoredVehicle()\n\
    {\n  super();\n}\n```\n\n```java\nengineSize = 2;\npetrolType = 0;\npetrolLevels\
    \ = 100;\n}\n```\n\n在之前的代码中：\n\n- 我们为 **MotoredVehicle** 类定义了构造函数。\n- 我们指定当被调用时，该构造函数将反过来使用\
    \ **super** 关键字调用基类的构造函数（即父类 **Vehicle** 的构造函数）。\n- 如果你记忆清楚，父类的构造函数初始化了速度（speed）、轮子数量以及乘客人数。\n\
    - 因此，通过使用 `super` 关键字调用父类构造函数，我们避免了在子类的构造函数中重写相同的代码。\n- 在调用基类的构造函数后，变量 **engineSize**、**petrolType**\
    \ 和 **petrolLevels** 将被初始化。\n\n我们可以如下为 **MotoredVehicle** 类添加第二个构造函数：\n\n```java\n\
    public MotoredVehicle(float newEngineSize, int newPetrolType, int newPetrolLevels)\n\
    {\n  super();\n  \n  engineSize = newEngineSize;\n  petrolType = newPetrolType;\n\
    \  petrolLevels = newPetrolLevels;\n}\n```\n\n在之前的代码中：\n\n- 我们为 **MotoredVehicle**\
    \ 类声明了一个接受三个参数的构造函数。\n- 我们指定当被调用时，该构造函数将反过来使用 **super** 关键字调用基类的构造函数（即父类 vehicle\
    \ 的构造函数）。\n- 在此之后，变量 **engineSize**、**petrolType** 和 **petrolLevels** 将使用传递给此构造函数的参数进行初始化。\n\
    \n因此，如你所看到的，继承可以用来使代码更加简洁，并为你节省一些时间。在上一个例子中，我们看到通过调用父类构造函数，你可以避免重复编写已经在父类中创建的代码。\n\
    \n显然，还有更多与继承相关的概念；然而，本节提供的信息应该能让你轻松开始学习 Java 的这一方面。关于 Java 继承的更多信息，你可以查看官方文档：\n\
    \nhttps://docs.oracle.com/Javase/tutorial/Java/concepts/inheritance.html\n\n#\
    \ 访问方法和访问修饰符\n\n限制访问（并隐藏）变量和方法的能力为你的应用程序提供了更高的安全性，通常被称为封装，这通常通过访问修饰符来实现。\n\n正如我们之前看到的，Java\
    \ 中有不同类型的访问修饰符。这些修饰符指定了可以从何处调用方法。这些访问修饰符可以是 public（无限制）、protected（访问限制于包含类、同一包中的类——文件分组——以及其他包中的子类）、default（这是未指定访问修饰符时的默认模式；在这种情况下，访问限制于包含类和同一包中的类）和\
    \ private（仅允许从包含类或类型访问）。\n\n例如，在上一个例子中，我们将变量 `speed` 声明为 protected 以便可以访问。\n\n\
    # 多态（通用概念）\n\n多态一词的字面意思是“许多形式”。在面向对象编程中，它指的是接口响应不同的底层形式（数据类型）的能力。\n\n多态有两种主要类型：\n\
    - 方法重载（Method Overloading）：当多个方法具有相同名称但参数不同时。\n- 方法重写（Method Overriding）：当子类对其父类中已定义的方法提供特定实现时。\n\
    \n例如，在之前的代码中，我们创建了两个名称相同但参数不同的方法：\n\n- 第一个名为 **decelerate** 的方法不接受参数并将速度减一。\n\
    - 第二个方法具有相同名称；它接受一个用于减少速度的参数。\n\n虽然这些方法的名称相同，但可以根据它们的参数进行区分。如果为任何实例调用了 `decelerate`\
    \ 方法，系统将根据传递的参数类型知道应该使用哪一个。\n\n为了实验这个概念，你可以执行以下操作：\n\n- 向 **Vehicle** 类中添加这些方法。\n\
    \n```java\npublic void decelerate() {\n  speed--;\n}\npublic void decelerate(float\
    \ decrease) {\n  speed-=decrease;\n}\n```\n\n- 保存并编译 **Vehicle** 文件。\n- 在 **MyClass**\
    \ 文件的 **main** 方法中添加以下代码（加粗部分为新代码）。\n\n```java\nMotoredVehicle v2 = new MotoredVehicle();\n\
    v2.accelerate();\nv2.displaySpeed();\n```\n\n```java\nv2.decelerate();\nv2.decelerate();\n\
    v2.displaySpeed();\n```\n\n在之前的代码中：在执行新代码之前，v2 的速度应该是 10，因为它通过 `MotoredVehicle`\
    \ 类可用的方法进行了加速。\n\n- 我们调用了两次 `decelerate` 方法；由于我们没有传递任何参数，第一个方法（不带任何参数的方法）将被调用，速度将减少两次。因此，新速度应该是\
    \ 8。\n- 随后我们调用了一次 `decelerate` 方法；由于我们传递了参数（即 8），第二个方法（带参数的方法）将通过调用，速度将减少 8。因此，新速度应该是\
    \ 0。\n\n你可以保存代码、编译并运行应用程序；随后你应该应该看到以下消息：\n\n![](img/2fd2d26163705439bcd4d1a674a34298_141_0.png)\n\
    \n图 3-11：使用多态\n"
