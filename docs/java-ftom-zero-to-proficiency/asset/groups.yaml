    # PREFACE


    This book is part of a series entitled Java from Zero to Proficiency. In this
    book series, you have the opportunity to learn Java programming from scratch and
    to become proficient in this popular programming language.


    In this book entitled "Java from Zero to Proficiency (Beginner)" you will discover
    how to quickly get started with Java; you will learn about how to use variables,
    methods, conditional statements and you will also write your own code.


    # WHAT YOU NEED TO USE THIS BOOK


    To complete the project presented in this book, you only need to install Java
    Software Development Kit (SDK) and an Integrated Development Environment of your
    choice.


    In terms of computer skills, all the knowledge introduced in this book will assume
    no prior programming experience from the on your part. Although this book includes
    programming, you will be guided step-by-step. So for now, you only need to be
    able to perform common computer tasks such as typing, and opening and saving files.


    # WHO THIS BOOK IS FOR


    If you can answer **yes** to all these questions, then this book is for you:


    - Are you a total beginner in Java programming?

    - Would you like to get started fast with Java concepts?

    - Although you may have had some prior exposure to Java, would you like to delve
    more into Java?


    If you can answer yes to all these questions, then this book is **not** for you:


    - Can you already easily code in Java?

    - Are you looking for a reference book on Java?

    - Are you an experienced (or at least advanced) Java programmer?


    If you can answer yes to these three questions, you may instead look for other
    books in this series. To see the content and topics covered by these books, you
    can check the official website: **http://learntocodewithpat/Java.**


    # IMPROVING THE BOOK


    If you find any errors or have suggestions for improvement, please email me at
    learntocodewithpat@gmail.com. Your feedback is greatly appreciated and helps in
    improving the book for future readers.


    When reporting an error, please include:

    - The page number where the error was found.

    - The original text and the suggested correction.

    - The nature of the error (e.g., typo, factual error, formatting issue).


    Thank you for reading this book and I hope you find it helpful in your Java learning
    journey.

