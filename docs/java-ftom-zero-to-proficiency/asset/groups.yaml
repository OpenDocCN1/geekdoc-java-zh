    ## 变量 (VARIABLES)


    现在你已经对语句和注释有了些了解，我们将开始学习更多关于变量的知识。变量在 Java 中非常重要，因为你可能会在大多数程序中使用它们来执行计算或处理文本。


    那么什么是变量呢？


    变量可以被比作一个容器，其中包含一个可能会随时间而改变的值。在使用变量时，我们通常需要：(1) 通过指定其类型来声明变量，(2) 给此变量赋一个值，以及 (3)
    可能使用运算符将此变量与其他变量结合，如下一个代码段所示。


    ```

    int myAge;//我们声明了变量 myAge

    myAge = 20;//我们将变量 myAge 的值设置为 20

    myAge = myAge + 1; //我们将变量 myAge 加上 1

    ```


    在之前的示例中，我们声明了一个名为 `myAge` 的变量，它的类型是 `int`（代表整数）。我们在这个变量中保存了值 20，然后对其加 1。


    > 注意，在 Java 中，变量是使用其类型后跟名称声明的。正如我们后面看到的，我们还需要使用所谓的“访问修饰符”来指定如何以及从哪里可以访问此变量。


    另外请注意，在之前的代码中，我们将 `myAge + 1` 的值赋值给变量 `myAge`；`=` 运算符是一个赋值运算符；换句话说，它是为了给变量赋值，而不应从严格的代数意义上理解（即等
    号两边的值或变量是相等的）。


    为了让 Java 编码更简单、简洁，你可以在一个语句中声明多个相同类型的变量。例如，在下一个代码段中，我们在一条语句中声明了三个变量 `v1`、`v2` 和
    `v3`。这是因为它们是相同类型（即整数）。


    ```

    int v1,v2,v3;

    ```


    在之前的代码中，第一行声明了变量 `v1`、`v2` 和 `v3`。这三个变量都是整数。在第二行代码中，我们不仅同时声明了三个变量，还通过为这些变量设置值来初始化它们。


    在使用变量时，我们需要确定它们的名称、类型和作用域：


    - **变量名 (Name of a variable)：** 变量通常被赋予一个唯一的名称，以便容易且唯一地标识。变量名通常被称为*标识符* (identifier)。在定义标识符时，它可以包含字母、数字、减号、下划线或美元符号，并且通常字母字母开头。标识符不能关键字（例如，关键字
    `if` 不能作为标识符）。


    - **变量类型 (Type of variable)：** 变量可以持有多种类型的数据，包括数字（例如整数、双精度或单精度浮点数）、文本（例如字符串或字符）、布尔值（例如
    `true` 或 `false`）、数组或对象（我们将在本章稍后的部分介绍数组的概念）。


    ```

    String MyName = "Patrick";文本使用双引号声明

    int currentYear = 2017;//年份不需要小数，且声明为整数

    float width = 100.45f;//宽度被声明为浮点数（即带小数）

    ```


    - **变量声明 (Variable declaration)：** 变量需要被声明，这样当你在代码中使用此变量时，系统才知道你指的是什么。使用变量的第一步是声明或定义该变量。在声明阶段，变量还没有被赋值，因为这可以在以后完成。在下一个示例中，我们声明了一个名为
    `MyName` 的变量，并给它赋值了值 "My Name"。


    | String MyName; |

    | myName = "My Name" |


    - **变量作用域 (Scope of a variable)：** 变量可以在特定的上下文中访问，这取决于变量最初在应用程序的位置的位置。我们稍后会研究这个概念。


    - **可访问级别 (Accessibility level)：** 正如我们后面看到的，Java 程序由类组成；对于这些每个类，内部的方法和变量可以根据它们的可访问级别被访问，我们稍后会研究这一原理。


    常见的变量类型包括：


    - **String**：同文本。

    - **Int**：整数（1, 2, 3 等）。

    - **Boolean**：真 (`true`) 或假 (`false`)。

    - **Float**：带有分数部分的值（例如 1.2f, 3.4f 等）。

    - **Arrays**：一组相同类型的变量。如果这还不清楚，不要担心，这个概念将在本章中进一步解释。


