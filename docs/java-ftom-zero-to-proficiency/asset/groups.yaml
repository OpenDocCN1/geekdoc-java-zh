    \ its value by one, so that we can keep track of the number of bikes. Let's see\
    \ how.\n\n+   * Please open the file Bike.\n* Add the following code at the start\
    \ of the class (new code in bold).\n\n```\npublic class Bike\n{\n    private float\
    \ speed;\n    private int color;\n    private static int nbBikes;\n```"
