    \ 10;\n    }\n    @Override\n    public void accelerate()\n{\n  speed += 10;\n\
    }\n```\n\nIn the previous example, while the method accelerate is inherited from\
    \ the class Vehicle, it would normally increase the speed by one. However, by\
    \ overwriting it in the class MotoredVehicle, we make sure that in the case of\
