    ## HOW YOU WILL LEARN FROM THIS BOOK


    Because all students learn differently and have different expectations of a course,
    this book is designed to ensure that all readers find a learning mode that suits
    them. Therefore, it includes the following:


    - A list of the learning objectives at the start of each chapter so that you have
    a snapshot of the skills that you will gain.

    - Each section includes an overview of the activities covered.

    - All the activities are step-by-step, and you are also given the opportunity
    to engage in deeper learning and problem-solving skills through the challenges
    offered at the end of each chapter.

    - Each chapter ends up with a quiz and challenges through which you can put your
    skills (and knowledge acquired) to the test. Challenges consist of coding, debugging,
    or creating new features based on the knowledge that you have acquired in the
    chapter.

    - The book focuses on the core skills that you need. While some sections go into
    more detail, once concepts have been explained, links are provided to additional
    resources, where necessary.

    - The code is introduced progressively and it is also explained in detail.


    ## FORMAT OF EACH CHAPTER AND WRITING CONVENTIONS


    Throughout this book, and to make reading and learning easier, text formatting
    and icons will be used to highlight parts of the information provided and to make
    the book easy to read.


    ## SPECIAL NOTES


    Each chapter includes a resource section, so that you can further your understanding
    and mastery of Java; these include:


    - A quiz for each chapter: these quizzes usually include 10 questions that test
    your knowledge of the topics covered throughout the chapter. The solutions are
    provided on just after the quiz.

    - A checklist: it consists of between 5 and 10 key concepts and skills you need
    to be comfortable with before progressing to the next chapter.

    - Challenges: each chapter includes a challenge section where you are asked to
    combine your skills to solve a specific problem.


    Author''s notes appear as illustrated below:


    Author’s suggestions appear in this box.


    Code appears as illustrated below:


    ```java

    public int score;

    public String playersName = "Sam";

    ```


    Checklists that include the important points covered in the chapter appear as
    illustrated below:


    - Item1 for check list.

    - Item2 for check list.

    - Item3 for check list.


    ## HOW CAN YOU LEARN BEST FROM THIS BOOK?


    - Talk to your friends about what you are doing.


    We often think that we understand a topic until we have to explain it to friends
    and answer their questions. By explaining your different projects, what you just
    learned will become clearer to you.


    - Do the exercises.


    All chapters include exercises that will help you to learn by doing. In other
    words, by completing these exercises, you will be able to better understand the
    topics and gain practical skills (i.e., rather than just reading).


    - Don''t be afraid of making mistakes.


    I usually tell my students that making mistakes is part of the learning process;
    the more mistakes you make and the more opportunities you have for learning. At
    the start, you may find the errors challenging, or you may find that your application
    does not work as expected until you understand what went wrong.


    - Challenge yourself.


    All chapters include a challenge section where you can decide to take on a particular
    challenge to improve your programming or skills. These challenges are there for
    you to think creatively and to apply the knowledge that you have acquired in each
    chapter a problem-based approach.


    - Learn in chunks.


    It may be challenging to go through five or six chapters straight, as it may lower
    your motivation. Instead, give yourself enough time to learn, and learn in small
    units (e.g., between 15 and 20 minutes per day). This will do at least two things
    for you: it will give your brain the time to “digest” the information that you
    have just learned, so that you can start fresh the following day. It will also
    make sure that you don''t burn-out and that you keep your motivation levels high.


    ## FEEDBACK


    While I have done everything possible to produce a book of high quality and value,
    I always appreciate feedback from readers so that the book can be improved accordingly.
    If you would like to give feedback on this book, you can email me at learntocodewithpat@gmail.com.


    ## 1 INTRODUCTION TO JAVA PROGRAMMING


    > "Everybody in this country should learn to program a computer, because it teaches
    you how to think"

    - Steve Jobs


    In this section, we will go through an introduction to Java and look at key aspects
    of, including:


    - Syntax.

    - Variables.

    - Methods


    After completing this chapter, you will be able to:


    - Understand key concepts of Java.

    - Understand how to use variables.

    - Create and use methods.


    The solutions for this chapter are included in the resource pack.


    ## WHAT IS JAVA


    Java is a high level object-oriented language developed by Sun. It is a multiplatform
    language which means once it has been written and compiled, a Java application
    can run on most platforms. Java is used for many purposes, including mobile applications
    or even games.


    ## CHOOSING A CODE EDITOR


    In the next sections, you will start to write your code. For this purpose, you
    will need to use a code editor, and more specifically, an Integrated Development
    Environment (IDE). These IDEs include all the necessary tools to compile and execute
    your code, with some the following features:


    - Text highlighting: so that your code is clearer to read.

    - Auto-completion: so that you don''t have to remember the name of all variables
    in your code, or the name of some methods.

    - Error highlighting: so that some obvious errors are highlighted before you even
    test your code.


    There are many free IDEs available with their advantages and drawbacks, including:


    - BlueJ.

    - Eclipse.

    - IntelliJ IDEA.

    - NetBeans


    All these IDEs considered, we will be using BlueJ for this book, although you
    could use any of the other IDEs if you wish. BlueJ is an IDE specially developed
    for beginners. It won''t overwhelm you with too many features, but instead help
    you to get started with Java and provide some very useful features along the way
    that will make your coding cleaner, such as class diagrams, or code split into
    color-coded blocks.


    You can download BlueJ from the following site: https://www.bluej.org/


    ## INSTALLING JAVA


    Before you start working with Java, you will need to install the most recent version
    of the Java Development Kit (JDK). The JDK includes all the libraries you need
    to be able to write, compile and run code in Java.


    To do so, please do the following:


    - Open the following page: https://www.oracle.com/technology/Java/Javase/downloads/index.html

    - Look for the latest version of Java SE Development Kit.

    - Download the most recent Java SE DK: as this book is being written, the latest
    version of Java is Java SE 11.0.2.


    ![](img/2fd2d26163705439bcd4d1a674a34298_25_0.png)


    Figure 1-1: Downloading the SDK(Part 1)


    - Once you click on the Download button, a new set of options will appear from
    which you can choose the version that you would like to download, after accepting
    the license agreement..

