    # Polymorphism (GENERAL CONCEPTS)


    The word polymorphism takes its meaning from poly (several) and morph (shape);
    so it literally means several forms. In Object-Oriented Programming, it refers
    to the ability to process objects differently (or more specifically) depending
    on their data type or class.


    In Java, polymorphism can make it possible to create methods with the same name
    but with a different signature (i.e., different number and types of parameters)
    and this is usually called overloading.


    Polymorphism in Java also makes it possible for children classes to modify a method
    inherited from their parents and this is usually called overriding, as we saw
    earlier in this chapter.


    Let''s take the example of performing an addition. If we want to add two numbers,
    we make an algebraic addition (e.g., 1 + 2). However, adding two String variables
    may mean concatenating them (adding one one after the other).


    For example, adding the text "Hello" and the text "World" would result in the
    text "HelloWorld". As you can see, the operation is performed on different data
    types may vary produce different results. So again, with polymorphism, we will
    be able to customize methods (or operations) so that data is processed based on
    the parameters passed to this method o. So, let''s look at the following code
    which illustrates how this can be done in Java.


