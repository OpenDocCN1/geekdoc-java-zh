    # A FEW THINGS TO REMEMBER WHEN YOU CREATE YOUR APPLICATIONS (CHECKLIST)


    When you start coding, you will, as for for any new activity, make small mistakes,
    learn what they are, improve your coding, and ultimately get better at writing
    your applications. As I have seen in the past with students learning programming,
    there are some common errors that are usually made; these don''t make you a bad
    programmer; on the contrary, it is part of the learning process because we learn
    by trial and error, and making mistakes is part of the learning process.


    So, as you create your first application, set any fear aside, to experiment, be
    curious, and get to learn the language. It is like learning a new foreign language:
    when someone from a foreign country understands your first sentences, you feel
    empowered! So, it will be the same with Java, and to ease the learning process,
    I have included a few tips and things to keep in mind when writing your applications,
    so that you progress even faster. You don''t need to know all of these by now
    (I will refer to later on, in the next chapter), but it is so that you are aware
    of it and also use this if error occurs. So, watch out for these: :-


    +   - Each opening bracket has a corresponding closing bracket.


    +   - All variables are written consistently (e.g., spelling and case). The name
    of each variable is case-sensitive; this means that if you declare a variable
    myvariable but then refer to it as myVariable in the code, this may trigger an
    error, as the variable myVariable and variable, because they have a different
    case (upper-case V), are seen as two variables.


    +   - As much as possible, declare a variable prior to using it (e.g., int Var).


    +   - For each variable name, all words (except for the first word) have a capitalized
    initial. This is not a strict requirement, however, it will make your code readable.


    +   - For each method, all words (except for the first word) have a capitalized
    initial. This is not a strict requirement; however, it will make your code more
    readable.


    +   - All statements are ended with a semi-colon.'
