    # SINGLE-DIMENSIONAL ARRAYS


    You can optimize your code with arrays, as they make it easier to apply common
    features and similar behaviors to a wide range of data. When you use arrays, you
    can manage to declare less variables (for variables storing the same type of information)
    and to also access them more easily. You can create either single-dimensional
    arrays or multi-dimensional arrays.


    Let''s look at the simplest form of arrays: single-dimensional arrays. For this
    concept, we can take the analogy of a group of 10 people who all have a name.
    If we wanted to store this information using a String variable, we would need
    to declare (and to set) different variables, as illustrated in the next code snippet.


    ```

    String name1;String2; ......

    ```


    While this code is perfectly fine, it would be great to store this information
    in only one variable instead. For this purpose, we could use an array. An array
    is comparable to a list of items that we can access using an index. This index
    starts at 0 for the first element in the array.


    So let''s see how we store the names with an array.


    +   - First we could declare the array as follows:


    ```

    String [] names;

    ```


    You will probably notice the syntax dataType [] nameOfTheArray. The opening and
    closing square brackets are used to specify that we declare an array that will
    include String values.


    +   - Then we could initialize the array as follows:


    ```

    names = new String[10];

    ```


    In the previous code, we just specify that our new array, called names, will include
    10 String variables.


    +   - We then store information in this array as described in the next code snippet


    ```

    names [0] = "Paul";

    ames [1] = "Mary";

    ...

    ```


    ![](img/2fd2d26163705439bcd4d1a674a34298_82_0.png)'
