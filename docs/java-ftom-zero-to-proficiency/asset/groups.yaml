    \ application\");\n  if (userChoice == CHOICE_PAUSE) System.out.println(\"you\
    \ have decided to pause the application\");\n}\n```\n\n你可以注释掉 `main` 方法中的代码并在同一方法中添加以下行，以便从那里调用\
    \ `useConstants` 方法。\n\n```java\nuseConstants();\n```\n\n保存代码并启动应用程序后，你应该会看到一条显示“You\
    \ have decided to restart”的消息。\n\n在下一个示例中，我们使用常量来计算税率；这是一个良好的做法，因为同一个值将在整个程序中使用，并且在整个程序中使用完全相同的税率时，几乎没有留出错的空间。\n\
    \n| 代码 |\n| :--- |\n| `public static final float VAT_RATE = 0.21f;` |\n| `float\
    \ priceBeforeVat = 23.0f;` |\n| `float priceAfterVat = priceBeforeVat * VAT_RATE;`\
    \ |\n\n在上一段代码中：\n\n- 我们为增值税率声明了一个 `float` 常量变量。\n- 我们为商品的税前价格声明了一个 `float` 变量。\n\
    - 我们计算了加税后的商品价格。\n\n对于程序中不改变的值，使用常量是一种非常好的编码习惯。使用常量使你的代码更具可读性，当你需要更改代码中的值时可以节省工作量，并且减少可能的错误发生（例如在计算时）。\n\
    \n# 等级回顾\n\n# 总结\n\n在本章中，我们成功地使用了自定义的结构，如循环或 switch 语句。我们还处理了字符串和数字，并发现了一些处理这些内容的非常有趣的方法。我们还使用了数组，并学会了如何在数组中创建和排序元素。\n\
    \n"
