    # METHODS


    Now that you can declare and combine numbers and Strings, it is a good time to
    start looking into methods.


    Methods can be compared to a friend or a colleague to whom you gently ask to perform
    a task, based on specific instructions, and to return information afterwards,
    if need be.


    For example, you could ask your friend the following: "Can you please tell me
    when I will be celebrating my 20th birthday given I was born in 2000.\ So you
    give your friend (who is good at Math :-)) the information (i.e., the date of
    birth) and calculate the year of your 20th birthday and give information back
    to you. In other words, your friend will be given an input (i.e., the date of
    birth) and s/he will return an output (i.e., the year of your 20th birthday).
    Methods work exactly this way: they are given information (and sometimes not),
    perform an action, and then sometimes, if needed, return information.


    In programming terms, a method is a block of instructions that performs a set
    of actions. It is executed when invoked (or put simply called) from the application,
    or when an event occurs (e.g., when the player has clicked on a button). As with
    variables, methods are declared and can also be called.


    Methods are very useful because the code for a method has been created, it can
    be called several times without the need to rewrite the same code all over again.
    Also, because methods can take parameters, a method can process these parameters
    and produce or return information accordingly; in other words, they can perform
    different actions and produce different outputs based on the input. As a result,
    methods can do one or all of the following:


    +   - Perform an action.


    +   - Return a result.


    +   - Take parameters and process them.


    A method is usually declared using two keywords followed by its name as follows:


    ```

    accessTypeOfDataReturnedNameOfFunction(listOfParameters)

    (

