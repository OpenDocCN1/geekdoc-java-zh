    \ use comments to prevent part of your code from being executed. This is very\
    \ useful when you would like to debug your code and find where the error or bug\
    \ might be, using a very simple method. By commenting sections of your code, and\
    \ by using a process of elimination, you can usually find the issue quickly. For\
    \ example, you can comment all the code and run the application; then comment\
    \ half the code, and run the application. If it works without errors, it means\
    \ that the error is within the code that has been commented, and if it does not\
    \ work, it means that the error is in the code that has not been commented. In\
