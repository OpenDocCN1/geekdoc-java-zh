  md: "\n# ACCESSING CLASS MEMBERS AND VARIABLES\n\nOnce a class has been defined,\
    \ it is great to be able to access its member variables and methods. In Java (as\
    \ for other object-oriented programming languages), this can be done using the\
    \ dot notation.\n\nThe dot notation refers to object-oriented programming. Using\
    \ dots, you can access properties and/or methods related to a particular object.\n\
    \nOnce a class has been defined, objects based on this class can be created. For\
    \ example, if we were to create a new Bike object, based on the code that we have\
    \ seen above, the following code in the file MyClass main method.\n\n```java\n\
    Bike myBike = new Bike();\n```\n\nThis code will create (or instantiate) an object\
    \ on the \"template\" Bike. You may notice the syntax:\n\n```\ndataType variable\
    \ = new dataType();\n```\n\nBy default, this new object will include all the member\
    \ variables and methods defined earlier in the class Bike. So it will have a color\
    \ and a speed, and we should also be able to access its accelerate and turnRight\
    \ methods.\n\nSo using the Object-Oriented approach, we can define a template\
    \ for an object and use this template to create a new object that includes all\
    \ the data and methods (algorithm) necessary to manage or modify this object.\
    \ How can this be done?\n\nLet's look at the next code snippet that shows how\
    \ we can access these.\n\n```java\nb = new Bike();\nb.accelerate();\n```\n\nIn\
    \ the previous code:\n\n- The new bikeBike is created.\n- The speed is then increased\
    \ after calling the accelerate method. This method can be called using the dot\
    \ notation because it is public.\n- Note that to call an object's method we use\
    \ the dot notation.\n\nWhen defining member variables and methods, it is usually\
    \ good practice to restrict the access to member variables (e.g., to the private\
    \ type) and to define public methods with no or less strict restrictions (e.g.,\
    \ public) that provide access to these variables. These methods are often referred\
    \ to as getters because you can get or set the value of member variables from\
    \ them.\n\nTo illustrate this concept, let's look at the following code:\n\n```java\n\
    public class Bike {\n  private float speed;\n  private int color;\n\n  public\
    \ void accelerate() {\n    speed++;\n  }\n\n  public void turnRight() {\n  }\n\
    \n  private void caculateDistance() {\n  }\n\n  public void setSpeed(float newSpeed)\
    \ {\n    speed = newSpeed;\n  }\n\n  public float getSpeed() {\n    return (speed);\n\
    \  }\n}\n```\n\nIn the previous code, we have declared two new methods: setSpeed\
    \ and getSpeed.\n\n- For setSpeed: the type is void as this method does not return\
    \ any information, and its access is set to public, so that it can be accessed\
    \ with no restrictions.\n- For getSpeed: the type is float as this method returns\
    \ the speed, which type is float. Its access is set to public, so that it can\
    \ be accessed with no restrictions.\n\nSo, let's create our own class and use\
    \ some of these concepts:\n\n- From the main window in BlueJ, please select the\
    \ option Edit | New Class from the top menu.\n\n![](img/2fd2d26163705439bcd4d1a674a34298_113_0.png)\n\
    \nFigure 3-1: Creating a new class\n\n- In the new window, enter the word Bike\
    \ in the field labelled \"Class Name\".\n\n![](img/2fd2d26163705439bcd4d1a674a34298_113_1.png)\n\
    \nFigure 3-2: Creating a new class\n\n- Once this is done, please click on the\
    \ button labelled \"OK\".\n- This will create a new class called Bike in the project\
    \ window. As per the next figure.\n\n![](img/2fd2d26163705439bcd4d1a674a34298_114_0.png)\n\
    \nFigure 3-3: Creating the new class Bike\n\nOnce this is done, you can double\
    \ click on the icon labelled \"Bike\" in the main window, this should open the\
    \ content of the class Bike with some default code. You can then delete all the\
    \ code in this file and replace it with the following.\n\n```java\npublic class\
    \ Bike\n{\n    public Bike(){}\n}\n```\n\nIn the previous code, the new class\
    \ is defined. We also define a method called Bike that will act as a constructor\
    \ for the class Bike. In other words, every time a new Bike is created (or instantiated),\
    \ this method will be called.\n\nAgain, the class is a template that will be used\
    \ to create objects, and the constructor is the method that is used to create\
    \ this new object, and to specify, when need be, the default attributes.\n\nWhile\
    \ we will see more about the concept of constructors in the next sections, note\
    \ that constructors do not have a return type and this is what (amongst other\
    \ aspects) differentiates constructors from other methods.\n\nNext, we will start\
    \ to modify the class to include the member variables and methods that we introduced\
    \ and explained earlier on, as follows:\n\n- First, please add two member variables\
    \ as follows (new code in bold):\n\n```java\npublic class Bike\n{\n    private\
    \ float speed;\n    private int color;\n```\n\nIn the previous code, we create\
    \ float variables **speed** and **color**. These are member variables that will\
    \ be used as attributes for any bike created based on the class **Bike**.\n\n\
    - Then add the methods **accelerate** and **turnRight** as follows:\n\n```java\n\
    public void accelerate()\n{\n    speed++;\n}\npublic void turnRight()\n{\n}\n\
    ```\n\nIn the previous code, we create two methods **accelerate** and **turnRight**.\
    \ They are both of type **void** as they do not return data.\n\n- Finally add\
    \ the three other methods **setSpeed**, **getSpeed** and **calculateDistance**.\n\
    \n```java\nprivate void calculateDistance()\n{\n}\npublic void setSpeed(float\
    \ newSpeed)\n{\n    speed = newSpeed;\n}\n```\n\n```java\npublic float getSpeed()\n\
    {\n    return (speed);\n}\n```\n\nIn the previous code, we add three more methods.\
    \ Two of them are of type void **(calculateDistance and setSpeed)** as they do\
    \ not return any data. The method **getSpeed** returns the value of the member\
    \ variable **speed**.\n\nThe full code for the file **Bike.cs** should look as\
    \ follows:\n\n```java\npublic class Bike\n{\n    private float speed;\n    private\
    \ int color;\n    public Bike()\n\n    public void accelerate()\n    {\n     \
    \   speed++;\n    }\n    public void turnRight()\n    {\n    }\n    private void\
    \ calculateDistance()\n    {\n    }\n    public void setSpeed(float newSpeed)\n\
    \    {\n        speed = newSpeed;\n    }\n    public float getSpeed()\n    {\n\
    \        return (speed);\n    }\n}\n```\n\n- Once this is done, you can save your\
    \ code and compile at the top of the window.\n\n![](img/2fd2d26163705439bcd4d1a674a34298_117_0.png)\n\
    \nFigure 3-4: Compiling the class\n\nWe can now, use the class Bike from the main\
    \ method in the file MyClass by adding the following lines to the main method.\n\
    \n```java\nmyBike = new Bike();\nSystem.out.println(\"Initial Speed=\" + myBike.getSpeed());\n\
    myBike.setSpeed(23.0);\nSystem.out.println(\"New Speed=\"+myBike.getSpeed());\n\
    ```\n\nIn the previous code:\n\n- We create new bike\n- We then display the initial\
    \ speed of the new bike.\n- The speed of the new bike is increased.\n- We display\
    \ the value of the new speed.\n\nYou can now save the file MyClass, and compile\
    \ it.\n\nYou should now see, in the Project window that an arrow is now pointing\
    \ from the class MyClass to the class Bike, to show that a new Bike object is\
    \ created in the class MyClass.\n\n![](img/2fd2d26163705439bcd4d1a674a34298_118_0.png)\n\
    \nFigure 3-5: Displaying links between classes\n\nSo the idea here is to have\
    \ a main application called MyClass that will be using the class called Bike;\
    \ however, as we have seen earlier, we could also use this class called Bike in\
    \ a different application, hence, ourselves some time coding.\n\n- Once this is\
    \ done, you can run the application as usual by right-clicking on the icon called\
    \ \"MyClass\" and by selecting the option void main (String [] parameters).\n\n\
    ![](img/2fd2d26163705439bcd4d1a674a34298_118_1.png)\n\nFigure 3-6: Running the\
    \ application\n\nYou should see two messages as in the next figure.\n\n# # Initial\
    \ Speed=0.0\nNew Speed=23.0\n\n# Figure 3-7: Setting the speed\n\nThis message\
    \ makes sense since we created a new bike with a speed of zero initially; we then\
    \ set its speed to 23.\n"
  mdcn: "\n\n# 访问类成员和变量\n\n一旦定义了类，能够访问它的成员变量和方法将是非常棒的。在 Java 中（与其他面向对象的编程语言一样），这可以使用点符号法（dot\
    \ notation）来完成。\n\n点符号法是指面向对象编程。通过使用点，你可以访问与特定对象相关的属性和/或方法。\n\n一旦定义了类，就可以基于该类创建对象。例如，如果我们根据上面看到的代码创建一个新的\
    \ `Bike` 对象，在 `MyClass` 文件的 `main` 方法中将有如下代码：\n\n```java\nBike myBike = new Bike();\n\
    ```\n\n这段代码将在“模板” `Bike` 上创建（实例化）一个对象。你可能会注意到这种语法：\n\n```\ndataType variable =\
    \ new dataType();\n```\n\n默认情况下，这个新对象将包含之前在 Bike 类中定义的所有成员变量和方法。因此，它有一个颜色（color）和一个速度（speed），我们也应该能够访问它的\
    \ `accelerate`（加速）和 `turnRight`（右转）方法。\n\n因此，使用面向对象的方法，我们可以为对象定义一个模板，并使用这个模板创建一个新对象，该对象包含了管理或修改此对象所需的所有数据和方法（算法）。如何实现这一点？\n\
    \n让我们看看下一个代码片段，它展示了如何访问这些内容。\n\n```java\nb = new Bike();\nb.accelerate();\n```\n\
    \n在前面的代码中：\n\n- 创建了新的 `bikeBike`。\n- 在调用 `accelerate` 方法后，速度增加。可以使用点符号法调用此方法，因为它是公共的（public）。\n\
    - 注意，在调用对象的方法时我们使用点符号法。\n\n在定义成员变量和方法时，通常的好做法是限制成员变量的访问权限（例如，设置为 `private` 类型），并定义具有无或较少限制的公共方法（例如\
    \ `public`）来提供对这些变量的访问。这些方法通常被称为 `getters`（get器），因为你可以通过它们获取或设置成员变量的值。\n\n为了说明这个概念，让我们看看下面的代码：\n\
    \n```java\npublic class Bike {\n  private float speed;\n  private int color;\n\
    \n  public void accelerate() {\n    speed++;\n  }\n\n  public void turnRight()\
    \ {\n  }\n\n  private void caculateDistance() {\n  }\n\n  public void setSpeed(float\
    \ newSpeed) {\n    speed = newSpeed;\n  }\n\n  public float getSpeed() {\n   \
    \ return (speed);\n  }\n}\n```\n\n在前面的代码中，我们声明了两个新方法：`setSpeed` 和 `getSpeed`。\n\
    \n- 对于 `setSpeed`：类型为 `void`，因为此方法不返回任何信息，其访问权限设置为 `public`，因此可以无限制地访问。\n- 对于\
    \ `getSpeed`：类型为 `float`，因为此方法返回速度，其速度类型为 `float`。它的访问权限设置为 `public`，因此可以无限制地访问。\n\
    \n现在，让我们创建自己的类并使用其中的一些概念：\n\n- 在 BlueJ 的主窗口中，请从顶部菜单选择 `Edit | New Class`（编辑 |\
    \ 新类）。\n\n![](img/2fd2d26163705439bcd4d1a674a34298_113_0.png)\n\n图 3-1: 创建新类\n\
    \n- 在新窗口中，在标记为 \"Class Name\"（类名）的字段中输入单词 `Bike`。\n\n![](img/2fd2d26163705439bcd4d1a674a34298_113_1.png)\n\
    \n图 3-2: 创建新类\n\n- 完成后，请点击标记为 \"OK\" 的按钮。\n- 这将在项目窗口中创建一个名为 `Bike` 的新类。如下所示所示。\n\
    \n![](img/2fd2d26163705439bcd4d1a674a34298_114_0.png)\n\n图 3-3: 创建新类 `Bike`\n\n\
    完成后，你可以双击主窗口中标记为 \"Bike\" 的图标，这应该打开 `Bike` 类的内容，并带有一些默认代码。你可以删除此文件中的所有代码并将其替换为以下内容。\n\
    \n```java\npublic class Bike\n{\n    public Bike(){}\n}\n```\n\n在前面的代码中，定义了新类。我们还定义了一个名为\
    \ `Bike` 的方法，它将作为 `Bike` 类的构造函数（constructor）。也就是说，每当创建一个新的 `Bike`（或实例化）时，该方法就会被调用。\n\
    \n再次，类是用于创建对象的模板，而构造函数是用于创建此新对象并在需要时指定默认属性的方法。\n\n虽然我们将在接下来的章节中看到更多关于构造函数的知识，但请注意，构造函数没有返回类型，这（在其他方面之外）是构造函数与其他方法的区别。\n\
    \n接下来，我们将开始修改该类，以包含我们之前介绍和解释的成员变量和方法，如下：\n\n- 首先，请按照所示添加两个成员变量（粗体为新代码）：\n\n```java\n\
    public class Bike\n{\n    private float speed;\n    private int color;\n```\n\n\
    在前面的代码中，我们创建了 `float` 类型的变量 **speed** 和 **color**。这些是成员变量，将作为任何基于 **Bike** 类创建的自行车的属性。\n\
    \n- 然后按照所示添加方法 **accelerate** 和 **turnRight**：\n\n```java\npublic void accelerate()\n\
    {\n    speed++;\n}\npublic void turnRight()\n{\n}\n```\n\n在前面的代码中，我们创建了 **accelerate**\
    \ 和 **turnRight** 方法。它们都是 `public` 的，因此可以被无限制地访问。\n\n- 最后，添加另外三个方法 **setSpeed**、**getSpeed**\
    \ 和 **calculateDistance**。\n\n```java\nprivate void caculateDistance()\n{\n}\n\
    \npublic void setSpeed(float newSpeed)\n{\n    speed = newSpeed;\n}\n\npublic\
    \ float getSpeed()\n{\n    return (speed);\n}\n```\n\n在前面的代码中，我们添加了三个方法。其中两个是\
    \ `void` 类型，因为它们不返回数据。**getSpeed** 返回成员变量 **speed** 的值。`Bike` 文件的完整代码应该如下：\n\n\
    ```java\npublic class Bike\n{\n    private float speed;\n    private int color;\n\
    \n    public void accelerate()\n    {\n        speed++;\n    }\n\n    public void\
    \ turnRight()\n    {\n    }\n\n    private void caculateDistance()\n    {\n  \
    \  }\n\n    public void setSpeed(float newSpeed)\n    {\n        speed = newSpeed;\n\
    \    }\n\n    public float getSpeed()\n    {\n        return (speed);\n    }\n\
    }\n```\n\n- 完成后，你可以在窗口顶部保存代码并编译。\n\n![](img/2fd2d26163705439bcd4d1a674a34298_117_0.png)\n\
    \n图 3-4: 编译类\n\n现在，我们可以通过在 `MyClass` 文件的 `main` 方法中添加以下行来使用 `Bike` 类：\n\n```java\n\
    myBike = new Bike();\nSystem.out.println(\"Initial Speed=\" + myBike.getSpeed());\n\
    myBike.setSpeed(23.0);\nSystem.out.println(\"New Speed=\"+myBike.getSpeed());\n\
    ```\n\n在前面的代码中：\n\n- 创建了新的 `myBike`。\n- 在调用 `getSpeed` 方法后显示初始速度。\n- 然后设置了新速度。\n\
    - 我们显示新速度的值。\n\n现在你可以保存 `MyClass` 文件并编译它。你现在应该会在项目窗口看到一个箭头从 `MyClass` 指向 `Bike`\
    \ 类，这表明在 `MyClass` 中创建了一个新的 `Bike` 对象。\n\n![](img/2fd2d26163705439bcd4d1a674a34298_118_0.png)\n\
    \n图 3-5: 显示类之间的链接\n\n这里的主意是有一个名为 `MyClass` 的主应用程序，它将使用名为 `Bike` 的类；然而，正如我们之前看到的，我们可以在另一个应用程序中使用这个\
    \ `Bike` 类，从而节省编写代码的时间。\n\n- 完成后，你可以像往常通过右键点击 \"MyClass\" 图标并选择 `void main (String\
    \ [] parameters)` 选项运行应用程序。\n\n![](img/2fd2d26163705439bcd4d1a674a34298_118_1.png)\n\
    \n图 3-6: 运行应用程序\n\n你应该会看到如接下来的图中所示的消息消息。\n\n# Initial Speed=0.0\nNew Speed=23.0\n\
    \n# 图 3-7: 设置速度\n\n"
