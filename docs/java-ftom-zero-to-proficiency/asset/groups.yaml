    # 本书的支持与资源


    本书建立了一个配套网站，您可以在该网站上下载本书的完整项目，其中包含了书中使用的所有代码，以便您将自己的代码与代码解决方案进行比对。


    要获取这些内容，您可以打开以下链接：


    http://learntocodewithpat.com/Java/


    该网站还为您提供了订阅邮件列表的机会，并可以接收：


    - PDF 格式的电子书（免费副本），以便您可以在任何电脑上打开它。


    - 关于 Java 的定期更新和教程。


    - 可以在购买我部分书籍享受 30% 以上折扣的优惠券。


    本书献给 Mathis & Helena


    # 前言


    本书是名为“Java 从零到精通”系列丛的一部分。在该系列书中，您将有机会从零开始学习 Java 编程，并精通这种流行的编程语言。


    在名为《Java 从零到精通（初学者）》的书中，您将发现如何快速上手 Java；您将学习如何使用变量、方法、条件语句，并编写您自己的代码。


    # 使用本书需要什么条件


    要完成书中介绍的项目，您只需要安装 Java 软件开发工具包 (SDK) 和您任选的集成开发环境 (IDE)。


    在计算机技能方面，书中介绍的所有知识都假设您没有任何先前的编程经验。虽然书中包含了编程内容，但您将获得一步步的指导。因此，目前您只需要能够执行常见的计算机任务，如打字、打开和保存文件。


    # 本书的读者群


    如果您对所有这些问题的回答都是**是**的，那么这本书就适合您：


    - 您是 Java 编程的完全初学者吗？

    - 您想快速上手 Java 概念吗？

    - 尽管您可能已经接触过 Java，但您想进一步深入研究 Java 吗？


    如果您对所有这些问题的回答都是是的，那么这本书**不**适合您：


    - 您已经可以轻松地用 Java 编写代码了吗？

    - 您正在寻找一本 Java 的参考书吗？

    - 您是一位丰富的（或至少是高级的）Java 程序员吗？


    如果您对这三个问题的回答都是是，您可以寻找该系列中的其他书籍。要查看这些书籍的内容和主题，可以访问官方网站：**http://learntocodewithpat/Java.**


    # 改进书籍


    如果您发现任何错误或有改进建议，请发送电子邮件至 learntocodewithpat@gmail.com。您的反馈将不胜感激，并有助于为未来的读者改进书籍。


    报告错误时，请包含：

    - 发现错误所在的页码。

    - 原始文本和建议的修改内容。

    - 错误的性质（例如：拼写错误、事实错误、格式问题）。


    感谢阅读本书，希望它对您的 Java 学习之旅有所帮助。


