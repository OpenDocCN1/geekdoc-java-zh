  \ deployment descriptor`。\n\n## 7.3 MySQL 社区数据库\n\n访问 MySQL 网站 ([`www.mysql.com`](http://www.mysql.com))\
  \ 下载 MySQL Community Server。运行安装程序并选择默认选项。请记住你的 root 密码。\n\n从 MySQL 网站下载并安装 Employees\
  \ 数据库：[`dev.mysql.com/doc/employee/en/index.html`](http://dev.mysql.com/doc/employee/en/index.html)。按照安装说明使用所有默认选项。\n\
  \n创建一个用户 `empl_1` 并分配 Employees 数据库。\n\n如果你更喜欢简单的方法，如下所示创建一个只有一个 `employees` 表的\
  \ Employees 数据库：\n\n#### Listing 7-1. 创建 employees 表的 DDL\n\n```sql\nCREATE TABLE\
  \ employees (\n  emp_no INT NOT NULL,\n  birth_date DATE NOT NULL,\n  first_name\
  \ VARCHAR(14) NOT NULL,\n  last_name VARCHAR(16) NOT NULL,\n  gender ENUM ('M','F')\
  \ NOT NULL,\n  hire_date DATE NOT NULL,\n  PRIMARY KEY (emp_no)\n);\n```\n\n下载并解压用于访问\
  \ MySQL 数据库的 JDBC 驱动程序：\n\n## 7.4 安装 Oracle Fusion Middleware 软件\n\n\n\n\n\n访问 Oracle\
  \ 网站（[`www.oracle.com`](http://www.oracle.com)）并下载 Oracle Fusion Middleware（原“WebLogic\
  \ Server”）版本为 12.1.1。Oracle 可能要求用户注册账户。该版本对开发者来说功能完备；但受限于五个（5）个客户端连接。请确保下载 Windows\
  \ 或 Linux 安装版本。警告：这是一个巨大的下载（1.2 GB）。安装程序版本包含 JDK 和一个为 Oracle 中间件定制的 Eclipse IDE。运行安装程序并选择所有默认选项。\n\
  \n## 7.5 安装 Apache Tomcat 服务器\n\n访问 Apache Tomcat 网站（[`tomcat.apache.org`](http://tomcat.apache.org)）并下载最新的\
