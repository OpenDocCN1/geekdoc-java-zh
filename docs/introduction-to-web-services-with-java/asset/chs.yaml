  \n当安装 Tomcat 7 时，Tomcat 服务器根目录下包含以下目录：\n\n- `bin`\n- `conf`\n- `lib`\n- `logs`\n\
  - `temp`\n- `webapps`\n- `work`\n\n我们最关注的是 `bin` 和 `webapps` 目录，用于部署和发布我们的 Web 服务。要运行\
  \ Tomcat，进入 `bin` 目录并运行 `startup.cmd` (WINDOWS) 或 `startup.sh` (UNIX)。\n\n要部署包含示例\
  \ Web 服务的 Web 应用程序，将 `cxf-web.war` 复制到 `webapps` 目录。你不需要每次部署 Web 应用程序都重启 Tomcat\
  \ 服务器。\n\n## 5.5 使用 SOAPUI 测试服务\n\n对在 Apache Tomcat 服务器上运行的新 Web 服务测试与之前描述的 Java\
