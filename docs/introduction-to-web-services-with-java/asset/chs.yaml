  \ **图 5-4. 动态 Web 项目截图**\n\n### 5.3.4 创建 Web 服务\n\n从 `cxf-ws/Java Resources/src`\
  \ 目录，创建一个名为 `com.bemach.ws.cxf` 的 Java 包。从该包中，创建一个 Java 接口和一个 Java 类。\n\n### 5.3.4.1\
  \ EmployeeDataIf.java\n\n我们介绍了另一种使用 Java 接口创建 Web 服务的方法。这为我们在实现 Web 服务之前提供了一种更、更整洁的方式来指定服务接口。通常用于\
  \ Java 类的所有 WS 注解都以类似的方式使用。\n\n#### 列表 5-1. 带有 Web 服务注解的 EmployeeDataIf.java 类\n\
  \n| package |\n| :--- |\n| `com.bemach.ws.cxf;` /** 2013 (C) BEM, Inc., Fairfax,\
  \ Virginia** 除非适用法律要求或书面同意，否则分发的软件按“原样”状况分发，**不提供任何形式的保证或条件（无论是明示还是暗示的）。**/**import\
  \ java.sql.SQLException;import javax.jws.WebMethod;import javax.jws.WebParam;import\
  \ javax.jws.WebService;import javax.jws.soap.SOAPBinding;import javax.xml.soap.SOAPException;import\
  \ com.bemach.data.Employee;@WebService@SOAPBinding(style=SOAPBinding.Style.*DOCUMENT*)public\
  \ interface EmployeeDataIf {@WebMethodEmployee getEmployee(@WebParam(name=\"emplNo\"\
  )long emplNo) throws SOAPException, SQLException;@WebMethodlong createEmployee(@WebParam\
  \ (name=\"employee\")Employee employee) throws SOAPException, SQLException;@WebMethodboolean\
  \ updateEmployee(@WebParam (name=\"employee\")Employee employee) throws SOAPException,\
  \ SQLException;@WebMethodboolean deleteEmployee(@WebParam (name=\"emplNo\")long\
  \ emplNo) throws SOAPException, SQLException;} |\n\n该服务将包含四个基本操作：\n\n1. `getEmployee`\
  \ 方法，根据指定的员工编号返回员工。如果未找到，则抛出异常；\n2. `createEmployee` 方法，如果创建成功，则返回员工编号。如果失败，方法将返回；\n\
  3. `updateEmployee` 方法，如果成功则返回 `true`，否则如此；\n4. `deleteEmployee` 方法，如果成功则返回 `true`，否则如此。\n\
  \n### 5.3.4.2 EmployeeData.java\n\n该类是 `EmployeeDao` 的包装器。它实现了 `EmployeeDataIf`。\n\
