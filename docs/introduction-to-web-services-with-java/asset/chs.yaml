  \ dao = new EmployeeDao(cfg);return dao.deletepl((int)emplNo);}} |\n\n使用了默认配置。必要可以使用\
  \ `EmployeeData` 构造函数修改 `cfg` 对象。\n\n### 5.3.5 打包 WAR\n\n两个重要的文件——`beans.xml` 和\
  \ `web.xml` 存储在 WAR 文件的 `WEB-INF` 目录。这些文件协助 Tomcat 服务器和 CXF 实现具体的 Web 服务。记住，我们使用部署在\
  \ Web 服务器（Tomcat 或其他）上的 Web 应用来实现示例 Web 服务。\n\n### 5.3.5.1 创建 web.xml\n\n#### 列表\
  \ 5-3. web.xml 的内容\n\n| web.xml |\n| :--- |\n| `<?xml version=\"1.0\" encoding=\"\
