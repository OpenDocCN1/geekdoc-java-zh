  \ SOAPException_Exception` {`LOG.info(\"Calling Employee (CXF) data service ...\
  \ \");``String targetNameSpace = \"http://cxf.ws.bemach.com/\";``String name = \"\
  EmployeeDataService\";``String portNo = args[0];``String urlStr = String.format(\"\
  http://localhost:%s/cxf-ws/employees?WSDL\",portNo);``EmployeeDataClient cli = new\
