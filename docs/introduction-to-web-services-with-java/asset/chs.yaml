  \ 6. CXF 与 Web 服务## 目标完成本章后，你应该能够：1. 理解 WebLogic Server 的基础知识 2. 创建一个基础 WebLogic\
  \ 域 3. 使用 WebLogic 部署 CXF 应用程序在本章中，我们将介绍 `WebLogic Server` 12。## 6.1 WebLogic ServerWebLogic\
  \ Server (`WLS`) 也称为`企业版`。它是构建安全、高可用且可扩展应用程序的基础。它提供了用于数据库、消息和外部系统的 API。### 6.1.1\
  \ 编程 WLS 包含以下内容：* Java (JSP 和 Servlet)* Web 服务 (`JAX-WS`, `JAX-RPC`, `JAX-RS`)*\
  \ XML 编程 (`JAXB`)* Java 消息 (`JMS`)* Java 数据库连接 (`JDBC`)* 企业信息系统* 企业 JavaBean (`EJB`)*\
  \ 远程方法调用 (`RMI`)* 安全 API* Tuxedo 连接 (`WTC`)### 6.1.2 高可用关键任务可以通过以下技术支持：* WebLogic\
  \ 集* 工作管理器* 负载保护* 网络通道* WebLogic 持久化存储* 转发服务* 企业级开发工具* 生产重部署## 6.2 部署图![3308.jpg](img/3308.jpg)\
  \ 图 6-1. CXF 部署图\n\n## 6.3 创建 WebLogic 域\n\nWebLogic Server 域是 WLS 资源的逻辑组。它由一种特殊的服务器类型`管理服务器`管理。该服务器实例用于管理这些资源的配置。应用程序和服务不应部署在`管理服务器`上，而应部署在`托管服务器`实例上。一个\
  \ WLS 域可以包含一个或多个托管服务器实例。\n\n两个或多个托管服务器可以组成一个集群。域可以管理集群。为了简单起见，我们将 CXF 服务应用程序部署在管理服务器上。首先，我们按照以下步骤创建一个\
  \ WLS 域：\n\n1. 假设你在 Windows 上安装了 Oracle WebLogic，进入 `C:\\Oracle\\Middleware\\wlserver_12.1\\\
  common\\bin`。\n2. 运行 `config.cmd`（或 `config.sh`）。\n3. 按照屏幕指令完成域的创建。\n4. 选择所有默认参数。\n\
  5. 完成后，域创建并存储在此处：`C:\\Oracle\\Middleware\\user_projects\\domains\\base_domain`。\n\
