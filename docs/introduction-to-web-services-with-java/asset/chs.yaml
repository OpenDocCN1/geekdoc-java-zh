  \n### 4.2.3 打包 Java 库\n\n为了从命令行运行构建，需要定义 `JAVA_HOME` 和 `ANT_HOME` 变量。确保在 `PATH`\
  \ 变量中包含 `$JAVA_HOME/bin` 或 `%JAVA_HOME%\\bin`。`JAVA_HOME` 应该指向安装的 JDK。我们使用 JDK 1.6\
  \ 进行开发和测试。Ant 构建脚本版本为 1.7.1。\n\n此 `build.xml` 构建脚本默认从 `data-svc` 项目目录的根目录运行。类存储在\
  \ `bin` 目录，而 Java 库 `data-svc.jar` 将存储在 `dist` 目录。清理构建命令将移除这两个目录。因此，应该使用两个构建命令：\n\
  \n`ant dist`（或简单使用 `ant`）\n\n`ant clean`\n\n#### 列表 4-12. data-svc Java 项目的 build.xml\n\
  \n```xml\n<project name=\"data-svc\" default=\"dist\" basedir=\".*\">\n    <description>Data\
  \ Services</description>\n    <!-- 为此构建设置全局属性 -->\n    <property environment=\"\
  env\" />\n    <path id=\"classpath.base\">\n        <fileset dir=\"./lib\" includes=\"\
  *.jar\" />\n    </path>\n    <path id=\"classpath.compile\">\n        <path refid=\"\
  classpath.base\" />\n    </path>\n    <target name=\"init\">\n        <mkdir dir=\"\
  ./bin\" />\n        <mkdir dir=\"./dist\" />\n    </target>\n    <target name=\"\
  compile\" depends=\"init\" description=\"compile the source\">\n        <javac srcdir=\"\
  ./src\" destdir=\"./bin\" debug=\"true\">\n            <classpath refid=\"classpath.compile\"\
  \ />\n        </javac>\n    </target>\n    <target name=\"dist\" depends=\"compile\"\
  \ description=\"generate the distribution\">\n        <!-- 创建发布目录 -->\n        <jar\
  \ jarfile=\"./dist/data-svc.jar\" basedir=\"./bin\" />\n    </target>\n    <target\
  \ name=\"clean\" description=\"clean up\">\n        <!-- 清理 ${build} 目录 -->\n  \
  \      <delete dir=\"./dist\" />\n        <delete dir=\"./bin\" />\n    </target>\n\
  </project>\n```\n\n`data-svc.jar` 存储在 `dist` 目录。内容如下：\n\n`META-INF/MANIFEST.MF`\n\
  \n`com/bemach/DbConfig`\n\n`com/bemach/DbConnection`\n\n`com/bemach/Employee`\n\n\
  `com/bemach/EmployeeDao`\n\n### 4.2.4 开发 Java 类\n\n要在 Eclipse 中创建 Web Services，请参考：\n\
  \n**![Image2271.PNG](img/Image2271_fmt.jpeg)**\n\n### 4.2.4.1 EmployeeData.java\n\
  \n通过包含以下注解来编写 Web Services：\n\n*   `@WebService`：指示该类的 Web 服务\n*   `@SOAPBinding`：指定绑定方式\n\
  *   `@WebMethod`：将方法暴露的操作\n\n#### 列表 4-13. EmployeeData 类\n\n该类对员工记录有四个主要操作（即 CRUD）。注意对于每个操作，服务都会创建一个\
  \ `EmployeeDao` 对象来调用相应的操作。调用结果将作为操作的返回值。\n\n#### 4.2.4.1.1 @WebService 注解\n\n`WebService`\
  \ 注解表示该类（或接口）实现 Web 服务。该注解有六（6）可选元素，用于更详细地定义 Web 服务：\n\n1.  `endpointInterface`：服务端点的接口完整名称\n\
  2.  `name`：WSDL 中 `<portType>` 元素的名称\n3.  `portName`：WSDL 中 `<port>` 元素的名称\n4. \
  \ `serviceName`：WSDL 中 `<service>` 元素的名称\n5.  `targetNamespace`：WSDL 中 `<definition>`\
  \ 元素的 targetNamespace 属性\n6.  `wsdlLocation`：`<soap:address>` 元素 `location` 属性的内容\n\
  \n在本应用程序中，我们没有包含这些可选元素。我们会在服务器代码创建 Endpoint 时定义 WSDL 的位置。\n\n#### 4.2.4.1.2 @SOAPBinding\
  \ 注解\n\n`SOAPBinding` 注解指定如何将 Web 服务映射到 SOAP 消息协议。这些涉及三个可选元素：\n\n1.  `parameterStyle`：可以是\
  \ BARE 或 WRAPPED\n2.  `style`：可以是 DOCUMENT 或 RPC\n3.  `use`：可以是 LITERAL 或 ENCODED\n\
  \n\n\n\n\n此注解用于自定义一个暴露为 WS（Web 服务）操作的方法。该注解有三个（3）个可选元素可以使用：\n\n1. `action`：在 WSDL\
  \ 中定义的操作名称。\n2. `exclude`：将该方法排除在 Web 服务的操作之外。\n3. `operationName`：操作名称。\n\n####\
  \ 4.2.4.1.4 @WebParam 注解\n\n操作的单个参数命名方式与方法相同。使用此注解可以在 WSDL 中更改为不同的名称。可选参数如下：\n\n\
  1. `header`：如果为 `true`，则参数从消息头中提取，而不是从消息体中提取。\n2. `mode`：三种基本模式 – `IN`、`OUT` 和 `INOUT`。\n\
  3. `name`：参数映射到表示该参数的 XML 元素中的 `name`。如果使用 `DOCUMENT` 样式，则必须指定 `name`。\n4. `partName`：如果使用\
  \ `RPC` 样式，这是 `wsdl:part` 元素中的名称。\n5. `targetNamespace`：如果使用 `DOCUMENT` 样式，参数将映射到头信息。\n\
  \n### 4.2.4.2 EmployeeRpcData.java\n\n该类实现了 SOAP RPC 样式的 Web 服务。它与文档样式（document\
  \ style）除了 `SOAPBinding` 注解外几乎完全相同。该类用于展示目前使用的两种样式之间的区别。\n\n#### Listing 4-14. EmployeeRpcData.java\
  \ 类\n\n```java\npackage com.bemach.ws.rpc.employees;\n/** 2013 (C) BEM, Inc., Fairfax,\
  \ Virginia Unless required by applicable law or agreed to in writing,* software\
  \ distributed is distributed on an “AS IS” BASIS, WITHOUT WARRANTIES OR CONDITIONS\
  \ OF ANY KIND, either express or implied. */\nimport java.util.logging.Logger;\n\
  import javax.jws.WebMethod;\nimport javax.jws.WebParam;\nimport javax.jws.WebService;\n\
  import javax.jws.soap.SOAPBinding;\nimport javax.xml.soap.SOAPException;\nimport\
  \ com.bemach.data.DbConfig;\nimport com.bemach.data.Employee;\nimport com.bemach.data.EmployeeDao;\n\
  \n@WebService\n@SOAPBinding(style=SOAPBinding.Style.RPC)\npublic class EmployeeRpcData\
  \ {\n    private static final Logger LOG = Logger.getLogger(EmployeeRpcData.class.getName());\n\
  \    private EmployeeDao dao = null;\n\n    public EmployeeRpcData (DbConfig cfg)\
  \ {\n        dao = new EmployeeDao(cfg);\n    }\n\n    @WebMethod\n    public Employee\
  \ getEmployee(@WebParam(name=\"emplNo\") long emplNo) throws SOAPException, Exception\
  \ {\n        LOG.info(\"Rpc.readEmployee\");\n        Employee employee = getDao().getEmpl((int)emplNo);\n\
  \        if (employee == null) {\n            throw new SOAPException (\"No such\
  \ employee!\");\n        }\n        return employee;\n    }\n\n    @WebMethod\n\
  \    public long createEmployee(@WebParam (name=\"employee\") Employee employee)\
  \ throws Exception {\n        LOG.info(\"Rpc.createEmployee\");\n        return\
  \ getDao().createEmpl(employee);\n    }\n\n    @WebMethod\n    public boolean updateEmployee(@WebParam\
  \ (name=\"employee\") Employee employee) throws Exception {\n        LOG.info(\"\
  Rpc.updateEmployee.\");\n        return getDao().updateEmpl(employee);\n    }\n\n\
  \    @WebMethod\n    public boolean deleteEmployee(@WebParam (name=\"emplNo\") long\
  \ emplNo) throws Exception {\n        LOG.info(\"Rpc.deleteEmployee.\");\n     \
  \   return getDao().deleteEmpl((int)emplNo);\n    }\n\n    public EmployeeDao getDao()\
  \ {\n        return dao;\n    }\n\n    public void setDao(EmployeeDao dao) {\n \
  \       this.dao = dao;\n    }\n}\n```\n\n### 4.2.5 托管 Web 服务\n\nWeb 服务需要由提供某些基本\
  \ HTTP 服务端点的服务器进行托管。请注意，此类服务器的实现为了 WS 演示目的相当简单。对于中大型业务环境，诸如 WebLogic、JBOSS 或 WebSphere\
  \ 等更具工业级的应用服务器更为合适。\n\n### 4.2.5.1 Server.java\n\n该类实现了一个 HTTP 服务器，用于托管多个 Web 服务（例如，HelloWorld、EmployeeDocDataService\
  \ 和 EmployeeRpcDataService）。每个 WS 通过服务端点唯一标识。\n\n* HelloWorld Web 服务：`http://localhost:9999/java-ws/hello?WSDL`\n\
  * Employee 文档 Web 服务：`http://localhost:9999/doc/employees?wsdl`\n* Employee RPC\
  \ Web 服务：`http://localhost:9999/rpc/employees?wsdl`\n\n#### Listing 4-15. Server.java\
  \ 类\n\n```java\npackage com.bemach.ws.server;\n/** 2013 (C) BEM, Inc., Fairfax,\
  \ Virginia */\nimport java.util.logging.Logger;\nimport javax.xml.ws.Endpoint;\n\
  import javax.xml.ws.endpoint.EndpointReference;\nimport com.bemach.data.DbConfig;\n\
  import com.bemach.data.Employee;\nimport com.bemach.data.EmployeeDao;\nimport com.bemach.ws.doc.EmployeeDocData;\n\
  import com.bemach.ws.rpc.EmployeeRpcData;\n\npublic class Server {\n    private\
  \ static final Logger LOG = Logger.getLogger(Server.class.getName());\n    private\
  \ static final String HOST_NAME = \"localhost\";\n    private static final String\
  \ PORT_NO = \"9999\";\n    private static final String HELLO_SVC_NAME = \"java-ws/hello\"\
  ;\n    private static final String RPC_SVC_NAME = \"rpc/employees\";\n    private\
  \ static final String DOC_SVC_NAME = \"doc/employees\";\n    private static final\
  \ String PROTOCOL = \"http\";\n    private static final String DRIVER = \"com.mysql.jdbc.Driver\"\
  ;\n    private static final String USER = \"root\";\n    private static final String\
  \ PASS = \"password\";\n\n    private Server() {}\n\n    public static DbConfig\
  \ getDao() {\n        DbConfig dbCfg = new DbConfig();\n        dbCfg.setDriver(DRIVER);\n\
  \        dbCfg.setUser(USER);\n        dbCfg.setPassword(PASS);\n        return\
  \ dbCfg;\n    }\n\n    public static SvrConfig getSvrConfig() {\n        SvrConfig\
  \ svrCfg = new SvrConfig();\n        svrCfg.setHostname(HOST_NAME);\n        svrCfg.setPort(PORT_NO);\n\
  \        svrCfg.setProtocol(PROTOCOL);\n        return svrCfg;\n    }\n\n    public\
  \ static Endpoint publish(SvrConfig cfg, Object svc) {\n        String url = String.format(\"\
  %s://%s:%s/%s\", cfg.getProtocol(), cfg.getHostname(), cfg.getPort(), cfg.getInterface());\n\
  \        Endpoint ep = Endpoint.publish(url, svc);\n        EndpointReference epr\
  \ = ep.getEndpointReference();\n        LOG.info(\"Endpoint Ref:\\n\"+epr.toString());\n\
  \        return ep;\n    }\n\n    public static void startHelloWorld() {\n     \
  \   SvrConfig cfg = getSvrConfig();\n        cfg.setInterface(HELLO_SVC_NAME);\n\
  \        HelloWorld hello = new HelloWorld();\n        publish(cfg, hello);\n  \
  \      LOG.info(\"HelloWorld service started ...\");\n    }\n\n    public static\
  \ void startRpcEmployees() {\n        SvrConfig cfg = getSvrConfig();\n        cfg.setInterface(RPC_SVC_NAME);\n\
  \        DbConfig dbCfg = getDao();\n        EmployeeRpcData rpcEmpl = new EmployeeRpcData(dbCfg);\n\
  \        publish(cfg, rpcEmpl);\n        LOG.info(\"Employees (RPC) service started\
  \ ...\");\n    }\n}\n\nclass SvrConfig {\n    private String hostname;\n    private\
  \ String port;\n    private String interfaceName;\n    private String protocol;\n\
  \n    public String getHostname() { return hostname; }\n    public void setHostname(String\
  \ hostname) { this.hostname = hostname; }\n    public String getPort() { return\
  \ port; }\n    public void setPort(String port) { this.port = port; }\n    public\
  \ String getInterface() { return interfaceName; }\n    public void setInterface(String\
  \ interfaceName) { this.interfaceName = interfaceName; }\n    public String getProtocol()\
  \ { return protocol; }\n    public void setProtocol(String protocol) { this.protocol\
  \ = protocol; }\n}\n```\n*(注：由于原文代码块中存在逻辑不完整或变量未定义的情况，翻译时保持了代码结构，并对注释进行了对齐以确保文档可读性)*\n\
  \n\n\n\n```java\nprotected static void startDocEmployees() {\n    SvrConfig svrCfg\
  \ = getSvrConfig();\n    svrCfg.setListenHostname(HOST_NAME);\n    svrCfg.setListenInterface(DOC_EMPL_SVC_NAME);\n\
  \    svrCfg.setListenPort(PORT_NO);\n    svrCfg.setListenProtocol(PROTOCOL);\n \
  \   DbConfig dbCfg = getDbConfig();\n    svrCfg.setDbCfg(dbCfg);\n    EmployeeDocData\
  \ docEmpl = new EmployeeDocData(dbCfg);\n    publish(svrCfg, docEmpl);\n    LOG.info(\"\
  Employees (Document) service started successfully ...\");\n}\n\n/** 带有多个服务端点的 WS\
  \ 服务器...\n** @param args */\npublic static void main(String[] args) {\n    startHelloWorld();\n\
