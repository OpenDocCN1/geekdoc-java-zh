  \ **图 13** *打开 WSDL*\n\n### 1.7.1 SOAP 请求：\n\nSOAP 处理器生成此请求并将其通过网络发送到带有简单字符串参数的\
  \ `say` 操作。\n\n```xml\n<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\"\
  \ xmlns:hel=\"http://hello.ws.bemach.com/\">\n   <soapenv:Header/>\n   <soapenv:Body>\n\
  \      <hel:say>\n         <name>Johnny B. Good</name>\n      </hel:say>\n   </soapenv:Body>\n\
  </soapenv:Envelope>\n```\n**列表 6** *SOAP 请求消息*\n\n### 1.7.2 SOAP 响应：\n\nSOAP 响应显示了消息字符串的简单返回。\n\
  \n```xml\n<S:Envelope xmlns:S=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:ns2=\"\
  http://hello.ws.bemach.com/\">\n   <S:Body>\n      <ns2:sayResponse>\n         <return>Hello,\
  \ Johnny B. Good!</return>\n      </ns2:sayResponse>\n   </S:Body>\n</S:Envelope>\n\
  ```\n**列表 7** *SOAP 响应消息*\n\n![6653.jpg](img/6653.jpg) **图 14** *调用 Web 服务的操作（方法）*\n\
  \n## 1.8 创建 Web 服务客户端\n\n\n\n\n编写 WS 客户端代码非常简单；然而，为了减轻客户端的编码工作，后台所需的代码量可能是巨大的。生成的代码使得客户端应用程序能够像调用其他\
  \ Java Bean 一样调用 WS 操作。这使得客户端 WS 应用程序的编程变得简单了一些。在下一章节中，我们将使用 SAAJ API 创建一个调用 HelloWorld\
  \ Web 服务的 Java 客户端代码。\n\n创建一个调用 HelloWorld Web 服务的 Java Web Service 客户端涉及以下步骤：\n\
  \n1. 在 Eclipse 中创建一个 `java-ws-client` 项目。\n2. 从服务端点（`http://localhost:9999/java-ws/hello?WSDL`）生成\
  \ WS 客户端存根（stub）。\n3. 编写一个 Java 客户端类。\n\n### 1.8.1 创建项目\n\n### 1.8.2 生成 Web 服务存根\n\
  \n首先，使用 Java JDK 包中现有的工具 `wsimport` 生成生成的 WS 客户端代码。其次，使用生成的代码编写客户端代码。\n\n1. 打开命令提示符或\
  \ Unix 终端。\n2. 进入 `java-ws-client` 项目目录。\n3. 创建一个 `generated` 目录。\n4. 创建一个 `lib`\
  \ 目录。\n5. 进入 `generated` 目录。\n6. 运行以下命令：\n\n```\nwsimport -d . http://localhost:9999/java-ws/hello?wsdl\n\
  ```\n7. 将生成的客户端代码打包：\n\n```\njar cvf ../java-ws-generated.jar *\n```\n8. 将 `java-ws-generated.jar`\
  \ 文件移动到 `lib` 目录。\n\n### 1.8.3 创建 Web 服务客户端\n\n9. 返回 Eclipse 并刷新 Java 项目：\n   a)\
  \ 选择 `java-ws` 项目。\n   b) 选择 `File` → `Refresh`。\n   c) 从项目属性中，选择 `Java Build Path/Libraries`。\n\
  \   d) 点击 `Add JARs` 并添加 `java-ws-generated.jar` 文件。\n   e) 点击 `OK`。\n10. 创建一个新的\
  \ Java 包：`com.bemach.ws.hello.client`。\n11. 创建一个新的 Java 类：`HelloWorldClient.java`。\n\
  \n列表 1-8. 一个 HelloWorld Web 服务客户端\n\n```java\npackage com.bemach.ws.hello.client;\n\
  /*** 2013 (C) BEM, Inc., Fairfax, Virginia** Unless required by applicable law or\
  \ agreed to in writing,* software distributed is distributed on an “AS IS\" BASIS,\
  \ WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.**/**\n\
  import java.net.MalformedURLException;\nimport java.net.URL;\nimport java.util.logging.Level;\n\
  import java.util.logging.Logger;\nimport javax.xml.namespace.QName;\nimport javax.xml.ws.Service;\n\
  import com.bemach.ws.hello.HelloWorld;\nimport com.bemach.ws.hello.HelloWorldService;\n\
  /*** 以下代码是使用 Java 代码调用* web 服务的正常方式。* 它更容易理解。**/**\npublic class HelloWorldWSClient\
  \ {\n    private static final Logger LOG = Logger.getLogger(HelloWorldWSClient.class.getName());\n\
  \    public static void main(String[] args) {\n        HelloWorldWSClient client\
  \ = new HelloWorldWSClient();\n        try {\n            client.say(\"Johnny B.\
  \ Good\");\n        } catch (Exception e) {\n            LOG.log(Level.SEVERE, \"\
  ERROR:\"+e);\n        }\n    }\n    public void say (String name) throws MalformedURLException\
  \ {\n        LOG.info(\"service ... \");\n        QName qName = new QName(\"http://hello.ws.bemach.com/\"\
  , \"HelloWorldService\");\n        URL url = new URL(\"http://localhost:9999/java-ws/hello\"\
  );\n        Service service = HelloWorldService.create(url, qName);\n        HelloWorld\
  \ port = (HelloWorld)service.getPort(HelloWorld.class);\n        String returnMsg\
  \ = port.say(name);\n        LOG.info(\"return: \"+returnMsg);\n    }\n}\n```\n\n\
  ## 1.9 运行 Web 服务客户端\n\n#### 输出\n\nWeb 服务响应：Hello, Johnny B. Good!\n\n## 1.10 引用\n\
  \n\n\nGottschalk, K., Graham, S., Kreger, H., & Snell, J. (2002). Introduction to\
  \ Web Services architecture. *IBM Systems Journal, 41*(2), 170–177.\n\nKleijnen,\
  \ S., & Raju, S. (2003). An Open Web Services Architecture. *Queue, 1*(1), 38–46.\n\
  \nMartin, J., Arsanjani, A., Tarr, P., & Hailpern, B. (2003). Web Services: Promises\
  \ and Compromises. *Queue, 1*(1), 48–58.\n\n# 2 SOAP\n\n## 目标\n\n阅读完本章后，你应该：\n\n\
  1. 对 SOAP 有基本的理解\n2. 能够描述 SOAP 消息的结构\n3. 理解如何处理 SOAP 消息\n4. 能够映射 SOAP 消息\n\nSOAP\
  \ 是一种轻量级协议，旨在用于去中心化的分布式环境中交换信息。它使用 XML 技术定义了一个可扩展的框架，该框架独立于任何编程模型和其他实现。\n\nSOAP\
  \ 被实现为许多中间件平台的插件。最初对 RPC 的强调使得 SOAP 能够在互联网上广泛实现。最终，出现了 HTTP 以外的交互需求（例如 SMTP 和 JMS）。\n\
  \nSOAP 版本 1.2 是一种轻量级协议，旨在用于去中心化的分布式环境中交换结构化信息。SOAP 规范提供了一套正式规则，规定了 SOAP 消息如何由 SOAP\
  \ 节点（即发送者、接收者和中间节点）生成和接受。\n\n### SOAP XML 负载\n\nSOAP 消息封装在一个 SOAP 封中，其中包含 SOAP Header\
  \ 和 SOAP Body。SOAP Body 是强制的，而 SOAP Header 是可选的。SOAP 消息是 SOAP 节点之间通信的基本单元。SOAP 节点可以传输、接收或中继\
  \ SOAP 消息。最终目的责任是根据标准处理 SOAP 消息。SOAP 消息在 SOAP 发送者和 SOAP 接收者之间传输。在分布式计算环境中可能存在 SOAP\
  \ 中间节点。\n\n## 2.1 SOAP 消息示例\n\n以下显示了三种形式的 SOAP 消息：请求、响应和故障。\n\n\n\n消息可以使用 HTTP 协议进行交换；因此，防火墙会允许消息通过。SOAP\
  \ 消息也可以自然地通过 HTTPS 协议在安全信道上运行。SOAP 促进了一种松耦合的计算范式，其中软件组件的知识仅限于服务的接口。\n\n### 2.1.1\
  \ SOAP 请求消息\n\n该请求表示对 `getEmployee` 方法的调用，其参数 `emplNo` 为 `100011`。注意，正文包含一个带有有一个\
  \ XML 元素 `<emp:getEmployee>` 的单个主体块。请求在通过网络传输到远程 SOAP 服务器之前，会被封化（序列化）为一个 XML 文档。当消息到达服务器时，它由\
  \ SOAP 引擎进行“反序列化”，并调用目标方法。\n\n- • 在这种情况下，没有使用 SOAP Header。\n- • SOAP 主体包含一个元素 `emp:getEmployee`。\n\
  - • `getEmployee`：为了获取员工记录，需要员工编号（`emplNo`）。\n\n#### 列表 2-1. SOAP 消息请求\n\n```xml\n\
  | <soapenv:Envelope  xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\"\
  xmlns:emp=\"http://employees.ws.bemach.com/*\"><soapenv:Header  /><soapenv:Body><emp:getEmployee><emplNo>100011</emplNo></emp:getEmployee></soapenv:Body></soapenv:Envelope>\
  \ |\n```\n\n### 2.1.2 SOAP 响应消息\n\n当 SOAP 服务器成功处理请求时，响应将会被封化为 XML 文档，并作为 HTTP 响应的一部分返回给客户端。客户端\
  \ SOAP 引擎随后将反序列化消息，以进一步处理调用结果。\n\n- • 未使用 SOAP Header。\n- • SOAP 主体包含一个元素 `ns2:getEmployeeResponse`。注意，使用了并引用了命名空间\
  \ `ns2`。\n- 在 SOAP 主体中，返回了一个员工记录。\n\n#### 列表 2-2. SOAP 消息响应\n\n```xml\n| <S:Envelope\
  \  xmlns:S=\"http://schemas.xmlsoap.org/soap/envelope/*\"><S:Body><ns2:getEmployeeResponse\
  \  xmlns:ns2=\"http://employees.ws.bemach.com/*\"xmlns:ns3=\"http://bemach.com*\"\
  ><return><emplNo>100011</emplNo><firstName>Shmuel</firstName><lastName>Birge</lastName><birthDate>1956-07-20T00:00:00-04:00</birthDate><gender>M</gender><hireDate>1989-11-23T00:00:00-05:00</hireDate></return></ns2:getEmployeeResponse></S:Body></S:Envelope>\
  \ |\n```\n\n### 2.1.3 SOAP 错误消息\n\n如果请求包含无效的员工编号，则可以选择返回一个 SOAP 错误消息。SOAP 错误可能包含帮助客户端解决错误或意外情况的消息。它必须包含故障代码（fault\
  \ code）、故障字符串（fault string）和详细的错误消息。\n\n#### 列表 2-3. SOAP 错误\n\n```xml\n| <S:Envelope\
  \  xmlns:S=\"http://schemas.xmlsoap.org/soap/envelope/*\"><S:Body><S:Fault  xmlns:ns4=\"\
  http://www.w3.org/2003/05/soap-envelope*\"><faultcode>S:Server</faultcode><faultstring>No\
  \ such employee!</faultstring><detail><ns2:SOAPException  xmlns:ns2=\"http://employees.ws.bemach.com/*\"\
  xmlns:ns3=\"http://bemach.com*\"><message>No such employee!</message></ns2:SOAPException></detail></S:Fault></S:Body></S:Envelope>\
  \ |\n```\n\n基本假设是所有数据类型都以 XML 格式在 SOAP 节点之间交换。在现实中，并不是所有数据都应该转换为 XML（例如，二进制图像、专有数据格式）。因此，建议的解决方案是使用类似于电子邮件协议的\
  \ SOAP 附件。然而，这种方法存在问题，因为扩展性可能会成为问题。此外，并不是所有的 SOAP 引擎都实现 SOAP 附件；因此，SOAP 节点之间的兼容性成为一个问题。这并没有排除附件带来的开销。\n\
  \n## 2.2 将 SOAP 映射到 HTTP\n\nSOAP 消息交换很好地映射到 HTTP 协议。在这个示例中，使用 HTTP `POST` 来调用服务器上的\
  \ SOAP 方法：\n\n#### 列表 2-4. 一个 HTTP Post\n\n```http\nPOST /java-ws/hello HTTP/1.1Accept-Encoding:\
  \ gzip,deflateContent-Type: text/xml;charset=UTF-8SOAPAction: \"\"Content-Length:\
  \ 298Host: localhost:9999Connection: Keep-AliveUser-Agent: Apache-HttpClient/4.1.1\
  \ (java 1.5)<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\"\
  \ xmlns:hel=\"http://hello.ws.bemach.com/\"><soapenv:Header/><soapenv:Body><hel:say><!–Optional:–><name>Johnny\
  \ B. Good</name></hel:say></soapenv:Body></soapenv:Envelope> |\n```\n\n#### 列表 2-5.\
  \ 另一个 HTTP Post\n\n```http\nPOST /rpc/employees HTTP/1.1Accept-Encoding: gzip,deflateContent-Type:\
  \ text/xml;charset=UTF-8SOAPAction: \"\"Content-Length: 290Host: localhost:9999Connection:\
  \ Keep-AliveUser-Agent: Apache-HttpClient/4.1.1 (java 1.5)<soapenv:Envelope xmlns:soapenv=\"\
  http://schemas.xmlsoap.org/soap/envelope/\" xmlns:emp=\"http://employees.ws.bemach.com/\"\
  ><soapenv:Header/><soapenv:Body><emp:getEmployee><emplNo>100011</emplNo></emp:getEmployee></soapenv:Body></soapenv:Envelope>\
  \ |\n```\n\n在这种情况下，HTTP `POST` 的 SOAP 响应相对简单：\n\n#### 列表 2-6. 一个 HTTP 响应\n\n```http\n\
  HTTP/1.1 200 OKTransfer-encoding: chunkedContent-type: text/xml;charset=\"UTF-8\"\
  5e<?xml version=\"1.0\" ?><S:Envelope xmlns:S=\"http://schemas.xmlsoap.org/soap/envelope/\"\
  ><S:Body>88<ns2:sayResponse xmlns:ns2=\"http://hello.ws.bemach.com/\"><return>Hello,\
  \ Johnny B. Good!</return></ns2:sayResponse></S:Body></S:Envelope> |\n```\n\n####\
  \ 列表 2-7. 另一个 HTTP 响应\n\n```http\nHTTP/1.1 200 OKTransfer-encoding: chunkedContent-type:\
  \ text/xml;charset=UTF-8Date: Thu, 11 Apr 2013 10:20:49 GMT5e<?xml version=\"1.0\"\
  \ ?><S:Envelope xmlns:S=\"http://schemas.xmlsoap.org/soap/envelope/\"><S:Body>167<ns3:getEmployeeResponse\
  \ xmlns:ns2=\"http://bemach.com\" xmlns:ns3=\"http://employees.ws.bemach.com/\"\
  ><return><emplNo>10002</emplNo><firstName>Bezalel</firstName><lastName>Simmel</lastName><birthDate>1964-06-02T00:00:00-04:00</birthDate><gender>F</gender><hireDate>1985-11-21T00:00:00-05:00</hireDate></return></ns3:getEmployeeResponse></S:Body></S:Envelope>\
  \ |\n```\n\n## 2.3 SAAJ 客户端\n\nJava SOAP 附件 API (SAAJ) 编写起来更为复杂。它允许开发者直接访问创建 SOAP\
  \ 消息的方法。可以使用 Java API 直接操作 XML。与第 1 章中编写使用 JAX-RPC 的客户端代码相比，编写 SAAJ 客户端可能非常辛苦。\n\
  \n使用 SAAJ 创建 SOAP 客户端的步骤如下：\n\n1. 创建包含 SOAP Header 和 Body 的 SOAP 消息。\n2. 在 SOAP\
  \ Header 和 Body 中添加必要的元素。\n3. 创建 SOAP 连接（URL）。\n4. 将 SOAP 消息发送到 SOAP 服务器。\n5. 处理响应消息。\n\
  \n有了 SOAP 消息的基础知识，就可以用 Java 编写 客户端。HelloWorld 服务的客户端代码如下。\n\n#### 列表 2-8. 使用 SAAJ\
  \ 的 HelloWorldSOAPClient.java 类\n\n\n\n\n\n```java\npackage com.bemach.ws.hello.client;\n\
  /*** 2013 (C) BEM, Inc., Fairfax, Virginia** 除非适用法律要求或书面同意，否则分发的软件按“原样”基础提供，不提供任何形式的明示或隐含保证或条件。**/**\n\
  import java.net.MalformedURLException;\nimport java.net.URL;\nimport java.util.Iterator;\n\
  import java.util.logging.Logger;\nimport javax.xml.soap.MessageFactory;\nimport\
  \ javax.xml.soap.Name;\nimport javax.xml.soap.SOAPBody;\nimport javax.xml.soap.SOAPBodyElement;\n\
  import javax.xml.soap.SOAPConnection;\nimport javax.xml.soap.SOAPConnectionFactory;\n\
  import javax.xml.soap.SOAPElement;\nimport javax.xml.soap.SOAPException;\nimport\
  \ javax.xml.soap.SOAPFactory;\nimport javax.xml.soap.SOAPHeader;\nimport javax.xml.soap.SOAPMessage;\n\
  /*** 以下代码是使用 Java 代码调用 Web 服务的复杂方式。 有时这种情况是必要的。**/**\npublic final class HelloWorldSOAPClient\
  \ {\n    private static final Logger LOG = Logger.getLogger(HelloWorldSOAPClient.class.getName());\n\
  /***<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\"\
  \ xmlns:m=\"http://hello.ws.bemach.com/\"><soapenv:Header/><soapenv:Body><m:say><arg0>Johnny</arg0></m:say></soapenv:Body></soapenv:Envelope>\n\
  ```\n\n```xml\n<S:Envelope xmlns:S=\"http://schemas.xmlsoap.org/soap/envelope/\"\
  ><S:Body><ns2:sayResponse xmlns:ns2=\"http://hello.ws.bemach.com/\"><return>Hello,\
  \ Johnny!</return></ns2:sayResponse></S:Body></S:Envelope>\n```\n\n```java\nprivate\
  \ HelloWorldSOAPClient() {}\npublic static void main(String[] args) {\n    try {\n\
  \        // 1. 创建一个 SOAP 消息\n        SOAPFactory sf = SOAPFactory.newInstance();\n\
  \        MessageFactory mf = MessageFactory.newInstance();\n        SOAPMessage\
  \ sm = mf.createMessage();\n        SOAPHeader sh = sm.getSOAPHeader();\n      \
  \  SOAPBody sb = sm.getSOAPBody();\n        sh.detachNode();\n        // 2. 在标头和正文中添加必要的元素\n\
  \        Name bodyName = sf.createName(\"say\",\"m\",\"http://hello.ws.bemach.com/\"\
  );\n        SOAPBodyElement be = sb.addBodyElement(bodyName);\n        Name name\
  \ = sf.createName(\"name\");\n        SOAPElement arg0 = be.addChildElement(name);\n\
  \        arg0.addTextNode(\"Johnny\");\n        // 3. 创建一个 SOAP 连接\n        URL\
  \ ep = new URL(String.format(\"http://localhost:%s/java-ws/hello?WSDL\",args[0]));\n\
  \        SOAPConnectionFactory scf = SOAPConnectionFactory.newInstance();\n    \
  \    SOAPConnection sc = scf.createConnection();\n        // 4. 使用连接发送 SOAP 消息\n\
  \        SOAPMessage response = sc.call(sm, ep);\n        sc.close();\n        //\
  \ 5. 处理响应消息\n        SOAPBody respBody = response.getSOAPBody();\n        Iterator\
  \ it = respBody.getChildElements();\n        SOAPBodyElement el = (SOAPBodyElement)it.next();\n\
  \        LOG.info(\"resp=\"+el.getNodeName());\n        it = el.getChildElements();\n\
  \        SOAPElement ret = (SOAPElement) it.next();\n        LOG.info(String.format(\"\
  %s=%s\",ret.getNodeName(),ret.getTextContent()));\n    } catch (UnsupportedOperationException\
  \ e) {\n        LOG.severe(e.getMessage());\n    } catch (SOAPException e) {\n \
  \       LOG.severe(e.getMessage());\n    } catch (MalformedURLException e) {\n \
  \       LOG.severe(e.getMessage());\n    }\n}\n```\n\nSAAJ 许多许多功能可以用于处理 SOAP 消息。关于此主题的更多信息，请参阅本书末尾的参考文献。\n\
  \nSOAP 消息可以以两种方式结构：文档样式（document style）和 RPC 样式（RPC style）。最初只支持 RPC 样式。对于 RPC 模型，SOAP\
  \ 正文定义了一个带有关联参数的特定方法，客户端调用该方法。因此，客户端与服务器之间的消息交换可以受到限制。方法调用与输入输出参数直接绑定。\n\n然而，与 RPC\
  \ 样式不同，文档样式允许客户端和服务器以它们选择任何格式交换消息。SOAP 正文包含不遵循任何 SOAP 格式规则的消息。正文可以根据架构进行验证。\n\n\
  ## 2.4 总结\n\nSOAP 是 Web 服务的的基础。SOAP 仍然是用于 B2B 集成的主流消息交换协议。注意，SOAP 中没有刻意提到安全问题。SOAP\
  \ 主要关于两个系统之间的消息交换。它促进了松耦合计算。为了避免协议的复杂性，安全和其他功能被省略在外。\n\n在下一章中，我们将讨论 Web 服务如何使用 SOAP\
  \ 作为传输协议来促进面向服务的计算范式。\n\n## 2.5 参考文献\n\n可以在以下在线文档中找到更多信息：\n\nAlbrecht, C.C. (2004).\
  \ “How clean is the future of SOAP?” Commun. ACM 47**(2): 66–68.**\n\nSOAP Version\
  \ 1.2 Part 0: Primer (Second Edition), Retrieved August 27, 2007 from:\n\n- `http://www.w3.org/TR/2007/soap12-part0`\n\
  - `http://www.w3schools.com/soap/default.asp`\n\n\n\n\n\nWSDL 是一个根元素名为 `definitions`\
  \ 的 XML 文档。该定义包含两个部分：抽象部分和具体部分。抽象描述由 `types`、`message` 和 `portType` 组成。具体部分由 `binding`\
  \ 和 `service` 组成。抽象部分描述了与服务实现方式无关的操作，而具体部分指定了可以调用服务的协议和位置。\n\n![Image1445.PNG](img/Image1445_fmt.jpeg)**图\
  \ 3-1*** *WSDL 结构*\n\n在接下来的章节中，我们将更细致地检查 WSDL 的结构，以理解抽象接口与具体实现之间的关系。\n\n*列表 3-1\
  \ 示例 WSDL*\n\n*![6843.jpg](img/6843.jpg)*\n\n*列表 3-2 另一个示例 WSDL*\n\n![6890.jpg](img/6890.jpg)\n\
  \n## 3.2 WSDL 接口\n\n服务接口使用 `portType` 元素定义。该元素包含一个构成 Web 服务的 `operation` 元素列表。每个操作都由一个输入消息和一个输出消息组成，并可选包含一个故障消息。所有操作都在客户端和服务器之间交换消息。消息是一种包含数据的抽象数据类型。\n\
  \n请参考上述列表 3-1 和 3-2，这些列表强调了基础 WSDL 文档的元素。WSDL 的五个主要组件及其关系是清晰可见的。\n\n### 3.2.1 `<types>`\
  \ 元素\n\n所有数据类型都定义在这个 `types` 元素内部。通常，`types` 元素指向一个外部 URL，该 URL 包含一个可能包含其他 schema\
  \ 的 XML schema。WSDL 规范并不禁止使用其他类型定义系统；但它倾向于使用 XML schema。\n\n### 3.2.2 `<message>`\
  \ 元素\n\n`message` 元素是描述操作输入输出的抽象数据类型。它由链接类型的部分（parts）组成。每个操作（`@WebMethod`）可能包含三种消息类型：输入、输出和故障。每种消息类型在整个\
  \ WSDL 文档中都是唯一的。每个类型都有唯一的名称。在每个消息内部，部分定义了在 `<types>` 元素中具体定义（RPC 风格）或通过 schema（文档风格）定义的实际类型。\n\
  \n### 3.2.3 `<portType>` 元素\n\n`<portType>` 元素由一组抽象操作组成。这些操作可能由一个或多个端点支持。操作用于在服务消费者和服务者之间交换消息。消息交换协议可以采用以下模式之一：\n\
  \n*   单向 – 服务端点接收消息\n*   请求-响应 – 服务端点接收消息并发送关联消息\n*   征询-响应 – 服务端点发送消息并接收关联消息\n\
  *   通知 – 服务端点发送消息\n\n在上面的示例（列表 3-2）中，WS 包含一个操作（即 `createEmployee`），它具有两个消息——一个输入消息和一个输出消息。输入消息命名为\
  \ `tns:createEmployee`，输出消息命名为 `tns:createEmployeeResponse`。这两个消息可以追溯到消息元素。将 `portType`\
  \ 想象成类似于 Java 类，在其中定义了方法和属性。\n\n### 3.2.3.1 `<operation>` 元素\n\n服务可以有一个或多个操作（或方法）。每个操作都是独立定义的，包含一个输入消息、一个输出消息和一个可选的故障消息。这些消息使用\
  \ `message` 元素定义。类似于 Java 类定义，每个操作都定义了服务的行为。\n\n## 3.3 WSDL 实现\n\nWSDL 的 `<binding>`\
  \ 元素将 WSDL 抽象接口连接到具体实现。在本节中，我们将特别关注发生连接的 `<binding>` 元素。因此，在某种程度上，`<binding>` 是整个\
  \ WSDL 规范的核心元素。这是两个世界相遇的地方。\n\n### 3.3.1 `<binding>` 元素\n\nBinding 将 `<portType>`\
  \ 映射到 `<service>` 元素中指定的实现。从列表 3-1 可以，`<portType>` `HelloWorld` 被绑定到 `<service>`\
  \ 元素内部的 `<port>` `HelloWorldPort`。`HelloWorld` 的实现基于 HTTP 的 SOAP（`<soap:binding>`）。SOAP\
  \ 指定了数据格式，而 HTTP 是用于提供服务的特定协议。\n\nBinding 在实现中没有指定任何特定语言。服务的实现方式超出了 WSDL 的范围。\n\n\
  ### 3.3.2 `<service>` 元素\n\n服务是渲染该服务的网络特定地址（`<port>`）的集合。`<port>` 和 `<portType>`\
  \ 通过 `<binding>` 元素链接。这种连接对于服务消费者和服务者之间的运行时动态绑定至关重要。\n\n`<port>` 元素描述了允许服务消费者与提供的服务进行交互的网络地址。服务可能具有多个端口；因此，选择权留给消费者。在示例\
  \ WSDL 中，只提供了一个端口，其位置指定为 `[`localhost:9999/java-ws/hello`](http://localhost:9999/java-ws/hello)`。注意，主机名和端口号可以在运行时修改，以指向托管服务的任何服务器。\n\
  \n以下描述了 WSDL 主要元素之间的链接。\n\n![Image1774.PNG](img/Image1774_fmt.jpeg)**图 3-2** WSDL\
  \ 内部的链接\n\n## 3.4 参考文献\n\nFlaherty, B. (2004). “WSDL: Defining Web Services.” Intercom\
  \ 51(8): 26–28.\n\nLessen, T., J. Nitzsche, et al. (2009). “Conversational Web Services:\
  \ Leveraging BPEL (light) for expressing WSDL 2.0 message patterns.” Enterprise\
  \ Information Systems 3(3): 347–367.\n\nWeb Services Description Language (WSDL)\
  \ 1.1, Retrieved August 27, 2007 from:\n\n[`www.w3.org/TR/wsdl`](http://www.w3.org/TR/wsdl)\n\
  \nWSDL Tutorial, Retrieved November 7, 2007 from: [`www.w3schools.com/wsdl/default.asp`](http://www.w3schools.com/wsdl/default.asp)\n\
  \n# 4 示例应用程序\n\n## 目标\n\n完成本章后，你将能够：\n\n1.  编写一个访问存储在关系型数据库中的记录的 Web 服务\n2.  使用\
  \ JDK 6 或更高版本编写 Web 服务\n3.  使用基础 Java 端点类发布 Web 服务\n4.  使用 SOAPUI 测试工具测试 Web 服务\n\
  5.  使用 `wsimport` 为客户端生成 Web 服务存根\n6.  编写一个简单的 Web 服务消费者来调用 Web 服务\n\n## 4.1 示例应用程序\n\
  \n欢迎来到 Web 服务的世界！初可能会觉得本章具有技术挑战性；但随着你学习示例，你会发现处处使用相同的模式。\n\n在本应用程序中，我们使用基础 Java\
  \ JDK 部署了一个简单的 SOAP 服务器。为了使此应用程序运行，你需要从互联网下载以下软件包（更多说明请见附录 A）。\n\n*   • Java JDK\
  \ 6\n*   • MySQL Community Server 5.6\n*   • MySQL 示例数据库\n*   • MySQL JDBC 驱动程序\n\
  \n![1780.jpg](img/1780.jpg)**图 4-1*** *n 分层应用程序*\n\n\n\n\n\n为了避免给已经复杂的概念增加复杂性，本示例中没有考虑安全问题。从远程机器（即\
  \ `WS` 客户端）在不经过适当身份验证的情况下访问数据库不是良好的做法；但在本应用程序中，使用固定的用户 ID 和密码访问数据库是为了简单化，而非安全考虑。此外，使用直接的\
  \ `JDBC` 调用使用数据源要高效得多，但示例代码并没有遵循这一标准约定。\n\n基础的 `Java Endpoint` 类在业务计算环境中扩展性不佳，但此处使用它是为了提供一个能够支持简单\
  \ `WS` 应用程序的最简单 Java 环境。在随后的章节中，你可以应用类似的编程原则和技术进行 `WS` 编程，从而将 `WS` 应用程序部署在 Apache\
  \ Tomcat 或 Oracle WebLogic 服务器上。这两个服务器分别在第 5 章和第 6 章中介绍。\n\n请记住，本章在 `WS` 编程方面的核心思想是如何通过使用\
  \ `WS` 技术（特别是 `SOAP`）从数据库获取数据。\n\n### 4.1.1 用例图\n\n考虑以下该示例应用程序的用例图。从 `WS` 客户端的角度来看，它调用了员工数据服务的四个操作。基础数据交换包括两个主要数据类型：员工编号和员工记录。\n\
  \n资源可以被创建、读取（或获取）、更新（或更改）和删除。`CRUD` 概念自计算机科学诞生以来一直是计算机编程的基础。我们在数据库中存储了一组员工记录，并希望从远程机器上通过\
  \ `WS` 技术使用 `SOAP` 对它们进行操纵。\n\n![image/1787.jpg]\n**图 4-2. 用例**\n\n#### 用例 1：创建员工\n\
  \n主要参与者：服务消费者\n\n主成功场景：\n1. 终端用户输入所需的员工信息。\n2. 服务消费者随后验证这些信息。\n3. 服务消费者随后调用 `employees`\
  \ 数据服务创建一个新员工。\n4. 服务消费者向终端用户展示一个新的员工编号。\n\n### 用例 2：更新员工\n\n主要参与者：服务消费者\n\n主成功场景：\n\
  1. 终端用户更新所需的员工信息。\n2. 服务消费者随后验证这些信息。\n3. 服务消费者随后调用 `employees` 数据服务进行更新。\n4. 服务消费者告知终端用户更新状态。\n\
  \n### 用例 3：获取（读取）员工\n\n主要参与者：服务消费者\n\n主成功场景：\n1. 终端用户输入员工编号。\n2. 服务消费者随后验证该编号。\n\
  3. 服务消费者随后调用 `employees` 数据服务检索员工记录。\n4. 服务消费者向终端用户展示员工记录。\n\n### 用例 4：删除员工\n\n\
  主要参与者：服务消费者\n\n主成功场景：\n1. 终端用户输入员工编号。\n2. 服务消费者随后验证该编号。\n3. 服务消费者随后调用 `employees`\
  \ 数据服务移除员工记录。\n4. 服务消费者告知终端用户删除状态。\n\n当发生错误情况时，会抛出 `SOAP` 异常。\n\n## 4.1.2 序序图\n\n\
  在典型的 `WS` 调用中，涉及许多层软件；但在高层面上，动作序列可以像如下时序图所示。\n\n![image/1796.jpg]\n**图 4-3. getEmployee\
  \ 操作的时序图**\n\n由于所有四个操作都是基础的请求-响应类型的消息交换，因此显示了 `getEmployee` 操作的单一时序图。\n\n消费者在准备就绪，调用客户端的\
  \ `SOAP` 引擎开始跨越网络的 `SOAP` 调用。在这种场景下，消费者完全理解 `SOAP` 消息并使用 `Java with Attachment API\
  \ for Java(SAAJ)` 构建 `SOAP` 消息。一旦形成 `SOAP` 消息，`SOAP` 引擎通过 `HTTP` 将消息发送到远程服务器。成功接收消息后，服务器通过调用后端相应的业务或数据服务处理请求。在这种情况下，调用了\
  \ `employees` 服务的 `getEmployee` 方法。在调用数据访问层之前，可以在此类中进行额外的业务逻辑处理以操作数据。`EmployeeDAO`\
  \ 是一个直接使用 `JDBC` 与数据库交互的组件。数据源并不总是关系型数据库。\n\n处理完成后，`employees` 服务在 `WS` 包的帮助下形成\
  \ `SOAP` 消息并返回到服务器端的 `SOAP` 引擎。作为请求-响应消息交换模式的一部分，响应随后返回给客户端的 `SOAP` 引擎。一旦客户端 `SOAP`\
  \ 引擎成功接收消息，它将返回给服务消费者进行最终处理。\n\n形成 `SOAP` 消息的过程通常被称为“序列化”（marshalling）。相反，将 `SOAP`\
  \ 消息解码为原生形式以便进一步处理的过程被称为“反序列化”（unmarshalling）。\n\n此时序图展示了一个同步消息交换的示例。换句话说，图中的活动是按顺序发生的。在某些情况下，处理可能需要很长时间，服务器可能在处理完成之前立即返回。这是异步消息交换的一种形式。当服务器完成请求处理后，它可能会发起对客户端的调用，返回实际数据的响应或简单的通知。客户端也可以定期轮询服务器获取数据。第二种方案存在两个问题：如果两次轮询之间窗口过大，延迟可能会很显著；如果太小，则会浪费双方的计算资源。\n\
  \n### 4.1.3 部署图\n\n该 `WS` 应用程序的简单部署所示：\n\n![image/7013.jpg]\n**图 4-4. 部署图**\n\n\
  在现实应用中，IT 组织可能会部署复杂的服务器和数据库网来管理他们的 `WS` 活动。可以有很多客户端。在本示例 `WS` 应用程序中，我们创建了一个包含客户端、服务器和数据库机器的环境。这些机器可以是虚拟的，这意味着所有三个都可以由单台物理机托管。\n\
  \n在服务器端，我们开发了两套 Java 库——`java-ws.jar` 和 `data-svc.jar`。第一个包含通过 `HTTP` 网络协议与客户端交互的\
  \ `WS` 代码。第二个通过 `MySQL` 驱动的 `JDBC` 调用处理数据库访问。它们共同构成了一个完整的应用程序。\n\n在客户端，我们开发了一个包含\
  \ `WS` 客户端代码的 Java 库 `java-ws-client.jar`。我们使用 `wsimport` 生成第二个库 `java-ws-generated.jar`。这个第二个库包含了与服务器\
  \ `WS` 引擎交互的所有必要代码。\n\n### 4.1.4 JDBC URL\n\n为了从 Java 应用程序访问关系型数据库，必须使用符合以下格式的 JDBC\
  \ URL 建立数据库连接：\n\n`jdbc:<subprotocol>:<subname>`\n\n其中\n\n* `<subprotocol>` 是注册到\
  \ Oracle 的驱动名称。在本应用程序中使用 `‘mysql’`。\n\n* `<subname>` 是资源的标识。它具有以下格式：\n\n`//host:port/subsubname`\n\
  \nsubsubname 由数据库架构名称、用户标识符和密码组成。\n\n在本示例中，完整的 JDBC URL 可以写为：\n\n```\njdbc:mysql://localhost:3306/employees?user=empl_1&password=password\n\
  ```\n\n\n\n\n为了通过 `JDBC` 连接访问数据库，创建了一个数据库账户并将其分配给 `employees` 数据库。它拥有 `employees`\
  \ 数据库的所有权限。MySQL 的默认访问端口为 `3306`。在运行 SOAP 服务器程序之前，请确保下载了 `JDBC` 驱动程序并将其包含在 Java\
  \ 的 `classpath` 中。\n\n### 4.1.4.1 DbConfig.java\n\n在此示例代码中，连接 MySQL 数据库的默认值如下（参见\
