  \ Path`。选择右面板顶部的 `Libraries` 选项卡。点击 `Add JARs...` 按钮。JAR 选择窗口所示：\n\n![2138.jpg](img/2138.jpg)\
  \ **图 4-10 JAR 选择**\n\n展开 `data-svc/lib` 文件夹。选择 JDBC 驱动。然后点击 `OK`。您的 Java 构建路径屏幕应该是这样的：\n\
  \n![2147.jpg](img/2147.jpg) **图 4-11 构建路径**\n\n\n\n\n在之前的章节中，我们创建了 `DbConfig.java`\
  \ 类来存储访问数据库的配置参数。接下来的逻辑步骤是创建一个类来管理该应用程序所有的 `JDBC` 连接。虽然也可以 `DataSource` 类来获取数据库连接，但在本书中，我们使用一种基础方法来获取\
  \ JDBC 数据库连接。\n\n###  4-8. DbConnection.java 类\n\n```java\npackage com.bemach.data;\n\
  /*** 2013 (C) BEM, Inc., Fairfax, Virginia** 除非适用法律要求或书面同意，否则分发的软件按“按原样”提供，不提供任何形式的保证或条件，无论是明示还是暗示的。**/**\n\
  import java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.SQLException;\n\
  import java.util.logging.Level;\nimport java.util.logging.Logger;\n\npublic final\
  \ class DbConnection {\n    private static final Logger LOG = Logger.getLogger(DbConnection.class.getName());\n\
  \    private static final String ERROR_MSG = \"ERROR: \";\n    private Connection\
  \ conn = null;\n\n    public Connection getConn() {\n        return conn;\n    }\n\
  \n    private DbConnection(String driverName, String subprot, String host, String\
  \ port, String db, String uid, String psw) {\n        LOG.info(\"Getting DB connection\
  \ ...\");\n        try {\n            Class.forName(driverName);\n            String\
  \ url = String.format(\"jdbc:%s://%s/%s?user=%s&password=%s\", subprot, host, db,\
  \ uid, psw);\n            conn = DriverManager.getConnection(url);\n        } catch\
  \ (SQLException e) {\n            LOG.log(Level.SEVERE, ERROR_MSG + e);\n      \
  \  } catch (ClassNotFoundException e) {\n            LOG.log(Level.SEVERE, ERROR_MSG\
  \ + e);\n        }\n    }\n\n    public static DbConnection getInstance(String driverName,\
  \ String subprot, String host, String port, String db, String uid, String psw) {\n\
  \        return new DbConnection(driverName, subprot, host, port, db, uid, psw);\n\
  \    }\n\n    public void close() {\n        try {\n            if (conn != null)\
  \ {\n                conn.close();\n                conn = null;\n            }\n\
  \        } catch (SQLException e) {\n            LOG.log(Level.SEVERE, ERROR_MSG\
  \ + e);\n        }\n    }\n}\n```\n\n`DriverManager` 类通过三种方式帮助创建 JDBC 连接：\n\n- `getConnection(String\
  \ url)`\n- `getConnection(String url, Properties)`\n- `getConnection(String url,\
  \ String user, String password)`\n\n在本示例中，使用了第一个方法，URL 如下：\n`jdbc:mysql://localhost:3306/employees?user=empl&password=password`\n\
  \n`getConn()` 方法需要连接数据库的所有配置参数。当不再需要 JDBC 连接时，必须显式调用 `close()` 方法。积累的连接会消耗资源。在大多数\
  \ JDBC 程序中，关闭连接会导致关联的 `Statement` 和 `ResultSet` 被关闭。\n\n4.2 EmployeeDao.java\n\n\
  该类提供了对数据库 `employees` 表的基本访问。使用 `PreparedStatement` 可以避免 SQL 注入攻击。我们的任务是开发一个名为 `EmployeeDao`\
  \ 的类，允许客户端创建、读取、更新和删除 `employees` 表中的行。目前，我们不关心安全性——只是想展示如何通过自下而上的方法来创建该类。`EmployeeDao`\
  \ 类使用 Java 数据库连接 (JDBC) 创建数据库连接、发布 SQL 语句并处理返回值。这是一个基础 JDBC 应用。\n\n### 4-9. EmployeeDao.java\
  \ 类\n\n```java\npackage com.bemach.data;\nimport java.sql.PreparedStatement;\nimport\
  \ java.sql.ResultSet;\nimport java.sql.SQLException;\nimport java.sql.Timestamp;\n\
  import java.util.Calendar;\nimport java.util.logging.Logger;\n\n/** 该类允许应用程序对 Employee\
  \ 资源执行四种基本操作：1. 创建 2. 读取 3. 更新 4. 删除。额外的方法有：getEmployeeByLastName, getplByFirstName\
