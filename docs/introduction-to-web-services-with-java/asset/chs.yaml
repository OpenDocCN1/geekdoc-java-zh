  \ 服务\n\n此 Ant 构建脚本构建 `java-ws.jar` 库并将其存储在 `dist` 目录中。此构建需要两个 Java 库：`data-svc.jar`\
  \ 和 `mysql-connector-java-5.1.24-bin.jar`。\n\n#### 4-16. java-ws Java 项目的 build.xml\n\
  \n```xml\n<project name=\"java-ws\" default=\"dist\" basedir=\".\">\n    <description>使用\
  \ Java 的 Web 服务。</description>\n    <!-- 为此构建设置全局属性 -->\n    <property environment=\"\
  env\" />\n    <path id=\"classpath.base\">\n        <fileset dir=\"./lib\" includes=\"\
  /*.jar\" />\n    </path>\n    <path id=\"classpath.compile\">\n        <path refid=\"\
  classpath.base\" />\n    </path>\n    <target name=\"init\">\n        <mkdir dir=\"\
  ./bin\" />\n        <mkdir dir=\"./dist\" />\n    </target>\n    <target name=\"\
  compile\" depends=\"init\" description=\"编译源文件\">\n        <javac srcdir=\"./src\"\
  \ destdir=\"./bin\" debug=\"true\">\n            <classpath refid=\"classpath.compile\"\
  \ />\n        </javac>\n    </target>\n    <target name=\"dist\" depends=\"compile\"\
  \ description=\"生成发布版本\">\n        <!-- 创建发布目录 -->\n        <jar jarfile=\"./dist/java-ws.jar\"\
  \ basedir=\"./bin\" />\n    </target>\n    <target name=\"clean\" description=\"\
  清理\">\n        <!-- 删除 ${build} 目录树 -->\n        <delete dir=\"./dist\" />\n   \
  \     <delete dir=\"./bin\" />\n    </target>\n</project>\n```\n\n此构建的输出是一个存储在 `dist`\
  \ 目录中的 JAR 文件。该库的内容包含以下元素：\n\n- `META-INF/`\n- `META-INF/MANIFEST.MF`\n- `com/`\n\
  - `com/bemach/`\n- `com/bemach/ws/`\n- `com/bemach/ws/doc/`\n- `com/bemach/ws/doc/employees/`\n\
  - `com/bemach/ws/hello/`\n- `com/bemach/ws/rpc/`\n- `com/bemach/ws/rpc/employees/`\n\
