- "# Java Web 服务入门指南\n\n\n\n\n\n\n\n\n\n# 序言\n\n本书基于我在三叉国际大学（Trident University International）提供的课程，侧重于\
  \ Web 服务编程的实战方法细节，而非其规范；然而，为了帮助读者更容易理解这些概念，我们在前三章中对 Web 服务、SOAP 和 WSDL 进行了简单介绍。规范中的许多细节被刻意忽略，以保持内容的易于掌握。\n\
  \n## 目标\n\n* 理解 Web 服务的基本概念：\n    - SOAP\n    - WSDL\n* 使用以下主要的编程工具开发基础 Web 服务：\n\
  \    - Java JDK 6 或更高版本\n    - Apache CXF 2.7 或更高版本\n    - Oracle Middleware WebLogic\
  \ Server (WLS) 12.1 或更高版本\n\n本书的背景要求：\n\n* 基础 Java 编程经验\n* 基础 Web 编程知识\n* 基础 XML\
  \ 知识\n\n\n\n\n\nWeb Service (`WS`) 是一种技术、流程和软件范式，主要为基于互联网的环境下的业务集成提供支持。本书介绍了 `WS`\
  \ 的基本概念、协议栈和应用。除了学习三个支持性标准 `SOAP`、`WSDL` 和 `UDDI` 之外，学生们将学学习如何使用以 Java 为中心的技术（如\
  \ `JAXP`、`JAXRPC`、`SAAJ` 和 `JAXB`）来实现 `WS`。学生们还将学习如何通过 `BPEL` 使用 `WS` 实现业务流程。\n\n\
  `WS` 是一种由 `URI` 标识的软件应用程序，其接口和绑定可以由 `XML` 构件进行定义、描述和发现，并且它支持通过基于互联网的协议使用基于 `XML`\
  \ 的消息与其他应用程序进行直接交互（W3C: [http://www.w3.org/TR/ws-desc-reqs]）。`WS` 主要用于机器与机器之间的通信。`WS`\
  \ 标准依赖其他标准——即 `SOAP`、`WSDL` 和 `UDDI`——才能高效运行。`SOAP` 是一种应用协议，用于在 `WS` 客户端和 `WS` 服务器之间传输消息。`HTTP`\
  \ 是 `SOAP` 的优选传输协议；但 `JMS` 和 `SMTP` 协议也曾在使用。`WSDL` 用于描述外部应用程序可以调用的服务。`UDDI` 用于发布和广告服务，以便他人发现并使用它们。`UDDI`\
  \ 同样使用 `SOAP` 作为其应用协议。\n\n- **第 1 章 – 引言**。本章提供了 Web 服务的概述。简要介绍了过去企业集成困难的背景以及 `WS`\
  \ 能提供的优势。本章介绍了一个使用 Java Web 服务的入门级 `WS` 程序。\n- **第 2 章 – SOAP**。利用上一章的示例（即一个用于交换复杂数据结构的\
  \ `WS`），本章解释了基本的 `SOAP` 消息交换是如何工作的。\n- **第 3 章 – WSDL**。本章深入探讨了服务如何被他人描述和理解。随后，在上一个模块练习的基础上构建一个更复杂的\
  \ `WS` 应用程序。\n- **第 4 章 – 示例应用程序**\n- **第 5 章 – Apache CXF 和 Tomcat 服务器**\n- **第\
  \ 6 章 – 在 Oracle WebLogic Server 12 上部署 CXF **\n- **第 7 章 – 附录 A – 开发环境**\n\n本书侧重于\
  \ `WS` 的工作机制，并带有使用基础 Java `WS` 框架的实践编程练习。该框架运行在独立的 Java 应用程序、Oracle WebLogic Server\
  \ (`WLS`) 和 Apache Tomcat 服务器上。因此，预计读者具备足够的 `Java` 和 `XML` 知识。\n\n# 图表列表\n\n- 图\
