  ### 4.2.2 编写数据访问\n\n数据访问对象（DAO）模式用于提供对数据的访问。首先，我们创建一个名为 `data-svc` 的 Java 项目。\n\n\
  ![7274.jpg](img/7274.jpg) **图 4-6 data-svc**\n\n### 4.2.1 导入 JDBC 驱动\n\n按照第 7 节的说明下载并下载适用于\
