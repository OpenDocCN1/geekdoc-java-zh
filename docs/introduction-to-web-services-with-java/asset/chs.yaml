  \ 类\n- 代码 5-8 `cxf-ws-client` 项目的 `build.xml`\n\n\n\n\n\n列表 7-1 用于创建 Employees 表的\
  \ DDL\n\n# 表格索引\n\n- 表 1 数据库配置参数\n- 表 2 服务器配置参数\n\n# 1 引言\n\n## 目标\n\n在学习本章之后，你应该能够：\n\
  \n1. 描述 Web 服务应用程序的基本元素\n2. 比较并对比 Web 应用与 Web 服务应用的目的\n3. 描述 Web 服务的优势\n4. 使用 Java\
  \ 开发工具包（`JDK`）或更高版本编写简单的 Web 服务应用程序\n5. 验证并测试 Web 服务应用程序\n\n在互联网的早期，Web 应用通过 `HTML`\
  \ 交付静态网页。无疑，当时的网站开发要简单；然而，静态内容会迅速过时；因此，网站的内容管理至关重要。\n\n![795.jpg](img/795.jpg) **图\
  \ 1-1** 早期 Web 应用\n\n为了给 Web 用户提供动态内容，随着通用网关接口（`CGI`）的引入，实现了二层 Web 应用，它可以从外部数据资源（如数据库）检索内容。在传统的客户端-服务器架构中，`CGI`\
  \ 充当客户端角色。`CGI` 脚本处理请求并将结果返回给 Web 服务器。服务器随后将内容格式化为 `HTML` 并返回给浏览器进行显示。\n\n`CGI`\
  \ 存在许多缺点，导致了二层架构的演变。数据库通常运行在同一台机器上；因此，备份数据非常困难。`CGI` 作为单独进程运行，因此会受到上下文切换开销的影响。`CGI`\
  \ 的设计并未考虑性能、安全或扩展性。\n\n![802.jpg](img/802.jpg) **图 1-2** 二层 Web 应用\n\n如今，n 层 Web\
  \ 应用架构被广泛使用。在这种架构中，引入了中间件或应用程序服务器来更高效地连接 Web 服务器和数据库。n 层应用的性能得到了提高，因为 Web 服务器、中间件和数据库可以托管在不同的机器上。每一层都可以为了负载均衡的目的而进行复制。安全性也得到了提高，因为数据没有存储在\
  \ Web 或应用程序服务器上，这使得黑客难以访问存储数据的数据库。\n\n![Image812.PNG](img/Image812_fmt.jpeg) **图\
  \ 1-3** n 层 Web 架构\n\nWeb 服务器和应用程序服务器通常运行在同一台机器上；然而，最佳实践是将数据库服务器运行在独立的机器上。在软件开发环境中，所有三个服务器都可以托管在单台机器上。在本书中，服务器通常指一种软件应用程序。\n\
  \n## 1.1 浏览互联网\n\n在 Web 2.0 构想之前（约 1999 年），万维网（`WWW`）和互联网的基本用法非常简单，基于传统的客户端-服务器模型，使用了较旧的技术，如远程过程调用（`RPC`）、事务处理（`TP`）监控或其他允许编程客户端的中间件。\n\
  \n考虑通过浏览器浏览互联网的典型用例。示例中的 Web 服务器使用 Java Server Pages（`JSP`）技术提供动态 `HTML` 页面。此外，它使用了企业\
  \ Java Bean（`EJB`）或普通 Java 对象（`POJO`）。`JSP` 面向于表现层的网页交付。`EJBs` 或 `POJOs` 通常用于处理业务规则。有数千个使用\
  \ `Java/JEE` 技术的 Web 应用。\n\n![Image820.PNG](img/Image820_fmt.jpeg) **图 1-4** 人机交互\n\
  \n互联网架构最初是为人类用户设计的。`HTTP` 协议用于交换文档（Web 或 `HTML` 页面）。`HTML` 是为基础图形用户界面（`GUI`）应用程序设计的。用户浏览互联网时，浏览器上的计算资源通常是空闲的。这些可用资源引发了提供更健壮的网络浏览体验的想法。此外，企业对企业（`B2B`）数据交换模型也变得更加可行。因此，引入了\
  \ `WS` 架构来支持这种新类型的数据交换。\n\n## 1.2 Web 服务架构\n\n服务可以是三种交互类型之一：人人交互、人机或机机交互。餐厅服务是人人交互的例子。从自动取款机（`ATM`）上取钱是人机交互的例子。机机交互的例子是手持设备（如智能设备，例如手机或平板电脑）与\
  \ Microsoft Outlook 同步通讯录。Web 服务是一种使用特定 Web 标准和技术的机机交互。Web 服务是一组编程接口，而不是一组网页。\n\n\
  本节从 Web 服务的基本定义开始，以便为后续章节的使用建立基础理解。当正确解释 Web 服务的基本概念后，Web 服务更复杂的方面将更容易理解。根据 W3C\
  \ 网站 `http://www.w3.org/TR/ws-reqs`：\n\n> Web 服务是一组编程接口，而不是一组网页。\n\n> 服务可以是三种交互类型之一：人人交互、人机或机机交互。餐厅服务是人人交互的例子。从自动取款机（`ATM`）上取钱是人机交互的例子。机机交互的例子是手持设备（如智能设备，例如手机或平板电脑）与\
  \ Microsoft Outlook 同步通讯录。Web 服务是一种使用特定 Web 标准和技术的机机交互。\n\n\n\n\n可以使用某种服务注册中心来定义、发布和发现服务。目前支持的服务注册中心包括电子业务\
  \ XML (ebXML)、通用发现、描述和集成 (UDDI) 以及元数据注册表 (MDR)。UDDI 通常是一个好主意；但在私有网络之外，它并没有被广泛使用。\n\
  \nRPC 是一种强大的技术，它为跨机器网络提供了分布式计算能力。RPC 是进程间通信的一种形式，允许位于网络中不同（或相同）位置的应用程序之间进行函数调用。它最适用于客户端-服务器编程。\n\
  \n![826.jpg](img/826.jpg) **图 1-5** 远程过程调用 (RPC)\n\nWeb 服务可以帮助解决企业应用集成 (EAI) 中的几个问题。为业务解决方案集成现有的应用程序是一项复杂且耗时的任务。使用不同计算机语言（如\
  \ C/C++、JAVA、Visual Basic 和 FORTRAN）编写的应用程序对外部世界具有独特的逻辑接口，这使得这些程序的集成变得困难、复杂且耗时。运行在不同机器架构（如\
  \ SUN、个人电脑、IBM 主机、IBM A/S 400）上的应用程序对外部世界具有独特的物理接口。集成这些应用程序也具有挑战性。运行通过网络连接的机器上的应用程序也难以集成。EAI\
  \ 的挑战出现在三个主要领域：\n\n* 语言障碍 – XML 是一种用于消息交换的标准化语言\n* 平台障碍 – SOAP 已在许多平台（如 Unix、Windows）上实现\n\
  * 网络障碍 – HTTP 和 SMTP 是标准化的网络协议\n\nWS（Web 服务）可以作为应用程序集成的实现技术。如前所述，WS 重点关注以下主要标准：XML、SOAP、WSDL、UDDI\
  \ 和 HTTP。\n\n![Image835.PNG](img/Image835_fmt.jpeg) **图 1-6** 业务机集成\n\n### SOAP\
  \ 序图\n\n![843.jpg](img/843.jpg) **图 1-7** SOAP 序图\n\n**服务请求者** – 消费或请求服务的客户端\n\n\
  **服务提供者** – 实现服务并满足服务请求的实体\n\n**服务注册中心** – 类似于电话簿的列表，列出并详细描述了可用服务\n\n![Image851.PNG](img/Image851_fmt.jpeg)\
  \ **图 1-8** Web 服务架构\n\n## 1.3 Web 服务的优势\n\nWeb 服务提供了许多优势：\n\n1. 平台无关性：Web 服务现在几乎适用于所有平台：\n\
  2. a) 硬件：主机、中端设备、个人和移动设备\n3. b) 操作系统：UNIX、Windows、主机操作系统、Android 和 iPhone\n4. 复用现有的网络基础设施：HTTP、SMTP\
  \ 和 JMS 协议\n5. 软件组件的松耦合促进了软件复用\n6. 降低集成成本并提高速度\n7. 开放架构和通信协议\n\n## 1.4 编写一个 HelloWorld\
  \ Web 服务\n\n如果没有看到创建和使用 Web 服务的具体示例，Web 服务的概念可能很难理解。自上而下的方法从一个描述服务的 WSDL 文件开始。自上而下的方法可能会增加互操作性，并允许对\
  \ WS 有更多控制，而自下而上的方法从 Java Bean 或企业 Java Bean (EJB) 的低级开始，速度更快且更简单。\n\n可以使用以下步骤创建和测试简单的\
  \ WS 应用：\n\n1. 运行 Eclipse IDE，创建一个新的 Java 项目，并命名为 `java-ws`。\n2. 将 `Server.java`\
  \ 作为 Java 程序运行。\n3. 验证服务端点的 WSDL 和关联架构：`http://localhost:9999/HelloWorld?wsdl`。\n\
  4. 使用 SOAPUI 软件测试 HelloWorld Web 服务。\n5. 创建 Java Web 服务客户端代码。\n\n### 1.4.1 创建项目\n\
  \n在上面的示例中，使用了自下而上的方法。此示例需要 Java 6 或更高版本。创建了一个名为“Hello World”的 Web 服务，其方法名为 `say`，需要一个\
  \ String 参数。在 Eclipse IDE 下创建 Java 项目，执行以下步骤：\n\n1. 运行 Eclipse IDE。\n2. 选择 File\
  \ → New → Java Project。使用所有默认设置并命名为 `java-ws`。\n3. 展开 `java-ws` 项目，右键点击 `src` 目录并选择\
  \ New → Package。命名包 `com.bemach.ws.hello`。\n4. 同样，创建另一个 Java 包 `com.bemach.ws.server`。\n\
  5. 创建两个 Java 类 – `com.bemach.ws.hello.HelloWorld.java` 和 `com.bemach.ws.server.Server.java`。\n\
  \n### 1.4.2 创建 Web 服务\n\nJava 的经典 HelloWorld 类可以用几行代码编写。其目的是确保 Java 虚拟机已正确安装并准备好进行编程。\n\
  \n#### 列表 1-1 HelloWorld.java\n\n| package com.bemach.ws.hello; |\n| :--- |\n| `/***\
  \ 2013 (C) BEM, Inc., Fairfax, Virginia** 除非适用法律要求或书面同意，否则分发的软件按“现状”基础分发，不提供任何形式的保证或条件，无论是明示还是隐含的.**/**public\
  \ class HelloWorld { public String say (String name) {return String.format(\"Hello,\
  \ %s!\", name);} public static void main (String[] args) {String msg = new HelloWorld().say(\"\
  Johnny, B. Good\");System.out.println(msg);}}**` |\n\n**输出**:\n\nHello, Johnny B.\
  \ Good!\n\n通过这种方式，HelloWorld 程序被转换为 WS 应用。这是使用 Java 语言实现的简单 WS。\n\n要将 HelloWorld\
  \ 程序从简单的 Java Bean 转换为 WS 应用，四个 WS 注解 – 即 `@WebService`、`@SOAPBinding`、`@WebMethod`\
  \ 和 `@WebParam` – 装饰如下：\n\n#### 列表 1-2 带有 Web 服务注解的 HelloWorld.java\n\n| package\
  \ com.bemach.ws.hello; |\n| :--- |\n| `/*** 2013 (C) BEM, Inc., Fairfax, Virginia**\
  \ 除非适用法律要求或书面同意，否则分发的软件按“现状”基础分发，不提供任何形式的保证或条件，无论是明示还是隐含的.**/**import java.util.logging.Logger;import\
  \ javax.jws.WebMethod;import javax.jws.WebParam;import javax.jws.WebService;import\
  \ javax.jws.soap.SOAPBinding;@WebService@SOAPBinding(style=SOAPBinding.Style.DOCUMENT*)public\
  \ class HelloWorld {private static final Logger LOG = Logger.getLogger(HelloWorld.class.getName());@WebMethodpublic\
  \ String say (@WebParam(name=\"name\") String name) {LOG.info(\"Web service is called!\"\
  );return String.format(\"Hello, %s!\", name);}public static void main (String[]\
  \ args) {String msg = new HelloWorld().say(\"Johnny, B. Good\");LOG.info(msg);}}`\
  \ |\n\n为了托管服务端点，WS 需要一个 HTTP 服务器。可以使用 Apache JEE Tomcat 服务器；但也可以仅用 Java 创建基础服务器。在示例中，我们创建了一个绑定到\
  \ WS 实现的特定 URL 的端点。在这种情况下，URL 为 `http://localhost:9999/java-ws/hello`，实现是 `HelloWorld`\
  \ 对象 `svc`。\n\n### 1.4.3 创建 HTTP 服务器\n\n#### 列表 1-3 Server.java 类\n\n\n\n\n\n```java\n\
  package com.bemach.ws.server;/*** 2013 (C) BEM, Inc., Fairfax, Virginia** Unless\
  \ required by applicable law or agreed to in writing,* software distributed is distributed\
  \ on an* \"AS IS\" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY* KIND, either\
  \ express or implied.**/**import java.util.logging.Logger;**import javax.xml.ws.Endpoint;**import\
  \ javax.xml.ws.EndpointReference;**import com.bemach.data.DbConfig;**import com.bemach.ws.doc.employees.EmployeeDocData;**import\
  \ com.bemach.ws.hello.HelloWorld;**import com.bemach.ws.rpc.employees.EmployeeRpcData;/****/**public\
  \ final class Server {\n \n    private static final Logger LOG = Logger.getLogger(Server.class.getName());\n\
  \    private static final String MYSQL_DRIVER=\"com.mysql.jdbc.Driver\";\n    private\
  \ static final String DB_HOST = \"saintmonica\";\n    private static final String\
  \ DB_PORT = \"3306\";\n    private static final String DB_SID = \"employees\";\n\
  \    private static final String DB_USER = \"empl_1\";\n    private static final\
  \ String DB_PSW = \"password\";\n\n    private Server() {}\n\n    protected static\
  \ DbConfig getDbConfig() {\n        DbConfig dbCfg = new DbConfig();\n        dbCfg.setDriverName(MYSQL_DRIVER);\n\
  \        dbCfg.setHost(DB_HOST);\n        dbCfg.setPort(DB_PORT);\n        dbCfg.setDb(DB_SID);\n\
  \        dbCfg.setUid(DB_USER);\n        dbCfg.setPsw(DB_PSW);\n        return dbCfg;\n\
  \    }\n\n    private static final String HOST_NAME = \"localhost\";\n    private\
  \ static final String PORT_NO = \"9999\";\n    private static final String HELLO_SVC_NAME\
  \ = \"java-ws/hello\";\n    private static final String RPC_EMPL_SVC_NAME = \"rpc/employees\"\
  ;\n    private static final String DOC_EMPL_SVC_NAME = \"doc/employees\";\n    private\
  \ static final String PROTOCOL = \"http\";\n\n    protected static SvrConfig getSvrConfig()\
  \ {\n        SvrConfig svrCfg = new SvrConfig();\n        svrCfg.setListenHostname(HOST_NAME);\n\
  \        svrCfg.setListenPort(PORT_NO);\n        svrCfg.setListenInterface(HELLO_SVC_NAME);\n\
  \        svrCfg.setListenProtocol(PROTOCOL);\n        return svrCfg;\n    }\n\n\
  \    protected static Endpoint publish(SvrConfig cfg, Object svc) {\n        String\
  \ url = String.format(\"%s://%s:%s/%s\",cfg.getListenProtocol(),cfg.getListenHostname(),cfg.getListenPort(),cfg.getListenInterface());\n\
  \        Endpoint ep = Endpoint.publish(url, svc);\n        EndpointReference epr\
  \ = ep.getEndpointReference();\n        LOG.info(\"\\nEndpoint Ref:\\n\"+epr.toString());\n\
  \        return ep;\n    }\n\n    protected static void startHelloWorld() {\n  \
  \      SvrConfig cfg = getSvrConfig();\n        cfg.setListenHostname(HOST_NAME);\n\
  \        cfg.setListenInterface(HELLO_SVC_NAME);\n        cfg.setListenPort(PORT_NO);\n\
  \        cfg.setListenProtocol(PROTOCOL);\n        HelloWorld hello = new HelloWorld();\n\
  \        publish(cfg, hello);\n        LOG.info(\"HelloWorld service started successfully\
  \ ...\");\n    }\n\n    protected static void startRpcEmployees() {\n        SvrConfig\
  \ svrCfg = getSvrConfig();\n        svrCfg.setListenHostname(HOST_NAME);\n     \
  \   svrCfg.setListenInterface(RPC_EMPL_SVC_NAME);\n        svrCfg.setListenPort(PORT_NO);\n\
  \        svrCfg.setListenProtocol(PROTOCOL);\n        DbConfig dbCfg = getDbConfig();\n\
  \        svrCfg.setDbCfg(dbCfg);\n        EmployeeRpcData rpcEmpl = new EmployeeRpcData(dbCfg);\n\
  \        publish(svrCfg, rpcEmpl);\n        LOG.info(\"Employees (RPC) service started\
  \ successfully ...\");\n    }\n\n    protected static void startDocEmployees() {\n\
  \        SvrConfig svrCfg = getSvrConfig();\n        svrCfg.setListenHostname(HOST_NAME);\n\
  \        svrCfg.setListenInterface(DOC_EMPL_SVC_NAME);\n        svrCfg.setListenPort(PORT_NO);\n\
  \        svrCfg.setListenProtocol(PROTOCOL);\n        DbConfig dbCfg = getDbConfig();\n\
  \        svrCfg.setDbCfg(dbCfg);\n        EmployeeDocData docEmpl = new EmployeeDocData(dbCfg);\n\
  \        publish(svrCfg, docEmpl);\n        LOG.info(\"Employees (Document) service\
  \ started successfully ...\");\n    }\n\n    /** Start WS Server with multiple service\
  \ endpoints...\n    * @param args*/\n    public static void main(String[] args)\
  \ {\n        startHelloWorld();\n        startRpcEmployees();\n        startDocEmployees();\n\
  \    }\n}\n```\n\n当 `Server` 程序运行时，它会调用 `startHelloWorld` 方法创建一个与唯一 URL 绑定的 WS 实现。随后，该端点将被发布并准备好接收来自远程客户端的请求。对于这个简单的程序，可以使用\
  \ Ctrl-C 停止服务器。\n\n`DbConfig.java` 类是数据库访问参数和 URL 所需参数的简单占位符。在稍后的示例中，将使用 Java 代码实现对数据库的数据访问。但请记住，这是示例代码；因此密码以明文形式显示或存储。在业务或安全环境中，每次都会输入密码或进行加密存储。\n\
