  com/bemach/ws/rpc/ObjectFactory.class\ncom/bemach/ws/rpc/package-info.class\ncom/bemach/ws/rpc/SOAPException.class\n\
  com/bemach/ws/rpc/SOAPException_Exception.class\n```\n\n这些命令生成的 Java 二进制代码可以作为客户端程序的一部分。接下来，创建一个包含生成代码的\
  \ Java 库：`java-ws-generated.jar`。该库在执行时应包含在 Eclipse 设置中。\n\n### 4.6.2 创建客户端代码\n\n\
  我们展示两种类型的客户端代码——文档风格和 RPC 风格。这在 WS 编程中都很常见；但更倾向于文档风格。\n\n编码完成后，`java-ws-client`\
  \ 项目如下：\n\n![Image2856.PNG](img/Image2856_fmt.jpeg) 图 4-18. java-ws-client 项目截图\n\
  \n### 4.6.2.1 EmployeesDocClient.java\n\n此代码使用生成的客户端存根向远程服务器调用 WS。一个重要的类是 `QName`，我们在此处创建一个包含\
  \ WSDL 中 `definitions` 元素的 `targetNamespace` 和 `name` 属性的限定名称。另一个重要的类是 `URL`，我们在此处根据\
  \ WSDL 中 `soap:address` 元素的 `location` 属性创建一个服务端点。通过这两个类，我们可以创建一个服务，并将其映射到服务提供的系列操作上。将端口映射到\
  \ `EmployeeDocData` 是通过 WSDL 中 `binding` 元素的 `type` 属性指定的。一旦获取端口，我们就可以像在 Java 中调用本地方法一样调用这些操作。\n\
  \n\n\n\n```java\npublic class EmployeesDocClient {\n    private static final Logger\
  \ LOG = Logger.getLogger(EmployeesDocClient.class.getName());\n    private EmployeeDocData\
  \ emplDs = null;\n\n    public EmployeesDocClient(String urlStr, String targetNs,\
  \ String name) throws MalformedURLException {\n        LOG.info(\"Constructor ...\"\
  );\n        QName qName = new QName(targetNs, name);\n        URL url = new URL(urlStr);\n\
  \        Service service = EmployeeRpcDataService.create(url, qName);\n        emplDs\
  \ = service.getPort(EmployeeDocData.class);\n    }\n\n    public Employee get(long\
  \ id) throws SOAPException_Exception {\n        return emplDs.getEmployee(id);\n\
  \    }\n\n    public long create(Employee empl) {\n        return emplDs.createEmployee(empl);\n\
  \    }\n\n    public boolean delete(long id) {\n        return emplDs.deleteEmployee(id);\n\
  \    }\n\n    public boolean update(Employee empl) {\n        return emplDs.updateEmployee(empl);\n\
  \    }\n\n    /**\n     * @param args\n     * @throws MalformedURLException\n  \
  \   * @throws SOAPException_Exception\n     */\n    public static void main(String[]\
  \ args) throws MalformedURLException, SOAPException_Exception {\n        LOG.info(\"\
  Calling Employee (Document) data service ... \");\n        String targetNameSpace\
  \ = \"http://employees.doc.ws.bemach.com/\";\n        String name = \"EmployeeDocDataService\"\
  ;\n        String urlStr = String.format(\"http://localhost:%s/doc/employees\",\
  \ args[0]);\n        EmployeesDocClient cli = new EmployeesDocClient(urlStr, targetNameSpace,\
  \ name);\n        long oldEmplNo = Integer.valueOf(args[1]);\n        Employee empl\
  \ = cli.get(oldEmplNo);\n        LOG.info(\"last=\" + empl.getLastName());\n   \
  \     LOG.info(\"hire=\" + empl.getHireDate());\n        LOG.info(\"last=\" + empl.getLastName());\n\
  \        LOG.info(\"first=\" + empl.getFirstName());\n\n        empl.setFirstName(\"\
  Silvester\");\n        empl.setLastName(\"Johnny\");\n        long newEmplNo = cli.create(empl);\n\
