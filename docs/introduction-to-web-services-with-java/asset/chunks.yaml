    Eclipse 设置中。


    ### 4.6.2 创建客户端代码


    我们展示两种类型的客户端代码——文档风格和 RPC 风格。这在 WS 编程中都很常见；但更倾向于文档风格。


    编码完成后，`java-ws-client` 项目如下：


    ![Image2856.PNG](img/Image2856_fmt.jpeg) 图 4-18. java-ws-client 项目截图


    ### 4.6.2.1 EmployeesDocClient.java


    此代码使用生成的客户端存根向远程服务器调用 WS。一个重要的类是 `QName`，我们在此处创建一个包含 WSDL 中 `definitions` 元素的
    `targetNamespace` 和 `name` 属性的限定名称。另一个重要的类是 `URL`，我们在此处根据 WSDL 中 `soap:address`
    元素的 `location` 属性创建一个服务端点。通过这两个类，我们可以创建一个服务，并将其映射到服务提供的系列操作上。将端口映射到 `EmployeeDocData`
    是通过 WSDL 中 `binding` 元素的 `type` 属性指定的。一旦获取端口，我们就可以像在 Java 中调用本地方法一样调用这些操作。


