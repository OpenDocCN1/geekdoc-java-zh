    # 6 Apache CXF and Oracle WebLogic Server


    #### Objectives


    After completing this chapter, you should be able to:


    1.  1\. Understand the fundamentals of Oracle WebLogic 12


    2.  2\. Create a basic WebLogic domain


    3.  3\. Start an Administration Server


    4.  4\. Use WebLogic to deploy a CXF WS application on the server


    5.  5\. Test Web Service using a WebLogic Console


    In this chapter, we take the same Web application – cxf-ws.war – and deploy it
    on a WebLogic Server version 12.


    ## 6.1 Oracle WebLogic Server 12


    Oracle WebLogic Server (WLS) is also known as the ‘Oracle Fusion Middleware’.
    The latest release of WLS is 12.1.1\. Oracle WLS is an industrial-strength enterprise-ready
    Java platform, Enterprise Edition (Java EE) application server. It is the foundation
    for building Service-oriented Architectures (SOA) applications using Oracle software
    products.


    Oracle WLS implements complete JEE 6 specification and provide a set of APIs for
    creating a variety of services: databases, messaging, and connections to external
    systems. Oracle WLS provides an environment capable of deploying mission-critical
    applications that are robust, secure, highly available and scalable.


    Major advantages of using Oracle WLS are briefly described in the following sections:


    ### 6.1.1 Programming Modles


    Oracle WLS comes with a set of tools that enable the following capabilities:


    *   • Web Applications (JSP and Servlet)


    *   • Web Services (JAX-WS, JAX-RPC, JAX-RS)


    *   • XML Programming (JAXB)


    *   • Java Messaging Service (JMS)


    *   • Java Database Connectivity (JDBC)


    *   • Resource Adapters (Enterprise Information Systems)


    *   • Enterprise JavaBeans (EJB)


    *   • Remote Method Invocation (RMI)


    *   • Security APIs (Security Service Providers APIs)


    *   • WebLogic Tuxedo Connectivity (WTC)


    ### 6.1.2 Highly Availability


    Mission-critical applications can be supported with the following capabilities:


    *   • WebLogic Server Clusters


    *   • Work Managers


    *   • Overload Protection


    *   • Network Channels


    *   • Weblogic Server Peristent Store


    *   • Store-and-forward Services


    *   • Enterprise-ready Development Tools


    *   • Production Redeployment


    ## 6.2 Deployment Diagram


