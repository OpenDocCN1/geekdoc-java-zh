    ## 2.3 SAAJ 客户端


    Java SOAP 附件 API (SAAJ) 编写起来更为复杂。它允许开发者直接访问创建 SOAP 消息的方法。可以使用 Java API 直接操作 XML。与第
    1 章中编写使用 JAX-RPC 的客户端代码相比，编写 SAAJ 客户端可能非常辛苦。


    使用 SAAJ 创建 SOAP 客户端的步骤如下：


    1. 创建包含 SOAP Header 和 Body 的 SOAP 消息。

    2. 在 SOAP Header 和 Body 中添加必要的元素。

    3. 创建 SOAP 连接（URL）。

    4. 将 SOAP 消息发送到 SOAP 服务器。

    5. 处理响应消息。


    有了 SOAP 消息的基础知识，就可以用 Java 编写 客户端。HelloWorld 服务的客户端代码如下。


