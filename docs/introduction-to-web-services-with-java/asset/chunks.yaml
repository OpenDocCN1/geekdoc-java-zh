    \ docEmpl = new EmployeeDocData(dbCfg);\n    publish(svrCfg, docEmpl);\n    LOG.info(\"\
    Employees (Document) service started successfully ...\");\n}\n\n/** 带有多个服务端点的\
    \ WS 服务器...\n** @param args */\npublic static void main(String[] args) {\n   \
    \ startHelloWorld();\n    startRpcEmployees();\n    startDocEmployees();\n}\n\
    ```\n\n### 4.2.5.2 打包 Web 服务\n\n此 Ant 构建脚本构建 `java-ws.jar` 库并将其存储在 `dist` 目录中。此构建需要两个\
    \ Java 库：`data-svc.jar` 和 `mysql-connector-java-5.1.24-bin.jar`。\n\n####  4-16.\
    \ java-ws Java 项目的 build.xml\n\n```xml\n<project name=\"java-ws\" default=\"dist\"\
    \ basedir=\".\">\n    <description>使用 Java 的 Web 服务。</description>\n    <!-- 为此构建设置全局属性\
    \ -->\n    <property environment=\"env\" />\n    <path id=\"classpath.base\">\n\
    \        <fileset dir=\"./lib\" includes=\"/*.jar\" />\n    </path>\n    <path\
    \ id=\"classpath.compile\">\n        <path refid=\"classpath.base\" />\n    </path>\n\
    \    <target name=\"init\">\n        <mkdir dir=\"./bin\" />\n        <mkdir dir=\"\
    ./dist\" />\n    </target>\n    <target name=\"compile\" depends=\"init\" description=\"\
    编译源文件\">\n        <javac srcdir=\"./src\" destdir=\"./bin\" debug=\"true\">\n\
    \            <classpath refid=\"classpath.compile\" />\n        </javac>\n   \
    \ </target>\n    <target name=\"dist\" depends=\"compile\" description=\"生成发布版本\"\
    >\n        <!-- 创建发布目录 -->\n        <jar jarfile=\"./dist/java-ws.jar\" basedir=\"\
    ./bin\" />\n    </target>\n    <target name=\"clean\" description=\"清理\">\n  \
    \      <!-- 删除 ${build} 目录树 -->\n        <delete dir=\"./dist\" />\n        <delete\
    \ dir=\"./bin\" />\n    </target>\n</project>\n```\n\n此构建的输出是一个存储在 `dist` 目录中的\
    \ JAR 文件。该库的内容包含以下元素：\n\n- `META-INF/`\n- `META-INF/MANIFEST.MF`\n- `com/`\n-\
    \ `com/bemach/`\n- `com/bemach/ws/`\n- `com/bemach/ws/doc/`\n- `com/bemach/ws/doc/employees/`\n\
    - `com/bemach/ws/hello/`\n- `com/bemach/ws/rpc/`\n- `com/bemach/ws/rpc/employees/`\n\
    - `com/bemach/ws/server/`\n- `com/bemach/ws/doc/employees/EmployeeDocData.class`\n\
    - `com/bemach/ws/hello/HelloWorld.class`\n- `com/bemach/ws/rpc/employees/EmployeeRpcData.class`\n\
    - `com/bemach/ws/server/Server.class`\n- `com/bemach/ws/server/SvrConfig.class`\n\
    \n## 4.3 部署 Web 服务\n\n服务器实例持续运行。使用 `control-C` 终止进程。获取配置参数的另一种方法是从 Java 属性文件中加载它们。请注意，对于\
    \ Windows，`CLASSPATH` 分隔符是分号（`;`），而不是 UNIX 冒号（`:`）。\n\n```bash\njava -cp ./dist/java-ws.jar;../data-svc/dist/data-svc.jar;./lib/mysql-connector-java-5.1.24-bin.jar\
    \ com.bemach.ws.server.Server\n```\n\n`mysql-connector-java-5.1.24-bin.jar` 是\
    \ MySQL 数据库的 JDBC 驱动程序。\n\n接下来，我们使用 SOAP 测试 Web 服务。\n\n## 4.4 检查 WSDL 和 XSD\n\n\
    我们生成具有三个不同服务端点的三个服务。服务器运行后，我们验证这些服务端点处于激活状态并准备好接受服务调用。从浏览器访问这些 URL。`HelloWorld`\
    \ 示例的服务端点 `[`localhost:999`](http://localhost:999)` 在之前的章节中已经检查过。\n\n### 4.4.5.\
    \ WSDL 和 XSD\n\nWSDL 和 XSD 所示列表所示：\n\n"
