    \n### 4.2.1 类图\n\n下面的类图描绘了服务器应用程序的静态视图。\n\n#### 列表 4-7. 一个类图\n\n![7284.jpg](img/7284.jpg)\n\
    \n在类图中，空心菱形表示部分与整体的关系。实心菱形表示组合。虚线表示边界。\n\n### 4.2.2 编写数据访问\n\n数据访问对象（DAO）模式用于提供对数据的访问。首先，我们创建一个名为\
    \ `data-svc` 的 Java 项目。\n\n![7274.jpg](img/7274.jpg) **图 4-6 data-svc**\n\n###\
    \ 4.2.1 导入 JDBC 驱动\n\n按照第 7 节的说明下载并下载适用于 JDBC 驱动，应用程序使用的 JDBC 驱动是 `mysql-connector-java-5.1.24-bin.jar`。\n\
    \n在 `data-svc` 项目下创建一个 `lib` 文件夹。该文件夹将包含库。\n\n通过点击 `lib` 文件夹导入已下载的 JDBC 驱动。选择\
    \ `File` -> `Import...`。选择窗口所示：\n\n![2116.jpg](img/2116.jpg) **图 4-7 选择**\n\n\
    选择 `General` -> `Archive File`，然后点击 `Next` 按钮。存档文件窗口所示：\n\n![2124.jpg](img/2124.jpg)\
    \ **图 4-8 存档文件**\n\n如果您知道 MySQL JDBC 驱动的位置，请输入文件名和位置。否则，使用右侧的 `Browse` 按钮并选择文件。然后点击\
    \ `Finish` 按钮。\n\n### 4.2.2 引用库\n\n接下来，确保项目引用了 MySQL 驱动。首先，选择 `data-svc` 项目。然后选择\
    \ `Project` -> `Properties`。`data-svc` 属性窗口所示：\n\n![2131.jpg](img/2131.jpg) **图\
    \ 4-9 构建路径**\n\n在屏幕左侧面板中，选择 `Java Build Path`。选择右面板顶部的 `Libraries` 选项卡。点击 `Add\
    \ JARs...` 按钮。JAR 选择窗口所示：\n\n![2138.jpg](img/2138.jpg) **图 4-10 JAR 选择**\n\n展开\
    \ `data-svc/lib` 文件夹。选择 JDBC 驱动。然后点击 `OK`。您的 Java 构建路径屏幕应该是这样的：\n\n![2147.jpg](img/2147.jpg)\
    \ **图 4-11 构建路径**\n\n"
- fmt: "\nIn earlier sections, we created the `DbConfig.java` class to hold the configuration\
    \ parameters for accessing the database. The next logical step is to create a\
    \ class to manage all the `JDBC` connections for this application. Getting a database\
    \ connection can also be accomplished using `DataSource` class; however, in this\
    \ book, we use a basic method for obtaining a JDBC database connection.\n\n###\
    \ Listing 4-8. DbConnection.java class\n\n```java\npackage com.bemach.data;\n\
    /*** 2013 (C) BEM, Inc., Fairfax, Virginia** Unless required by applicable law\
    \ or agreed to in writing,* software distributed is distributed on an “AS IS”\
    \ BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.**/**\n\
    import java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.SQLException;\n\
    import java.util.logging.Level;\nimport java.util.logging.Logger;\n\npublic final\
    \ class DbConnection {\n    private static final Logger LOG = Logger.getLogger(DbConnection.class.getName());\n\
    \    private static final String ERROR_MSG = \"ERROR: \";\n    private Connection\
    \ conn = null;\n\n    public Connection getConn() {\n        return conn;\n  \
    \  }\n\n    private DbConnection(String driverName, String subprot, String host,\
    \ String port, String db, String uid, String psw) {\n        LOG.info(\"Getting\
    \ DB connection ...\");\n        try {\n            Class.forName(driverName);\n\
    \            String url = String.format(\"jdbc:%s://%s:%s/%s?user=%s&password=%s\"\
    , subprot, host, port, db, uid, psw);\n            conn = DriverManager.getConnection(url);\n\
    \        } catch (SQLException e) {\n            LOG.log(Level.SEVERE, ERROR_MSG\
    \ + e);\n        } catch (ClassNotFoundException e) {\n            LOG.log(Level.SEVERE,\
    \ ERROR_MSG + e);\n        }\n    }\n\n    public static DbConnection getInstance(String\
    \ driverName, String subprot, String host, String port, String db, String uid,\
    \ String psw) {\n        return new DbConnection(driverName, subprot, host, port,\
    \ db, uid, psw);\n    }\n\n    public void close() {\n        try {\n        \
    \    if (conn != null) {\n                conn.close();\n                conn\
    \ = null;\n            }\n        } catch (SQLException e) {\n            LOG.log(Level.SEVERE,\
    \ ERROR_MSG + e);\n        }\n    }\n```\n\nThe `DriverManager` class helps create\
    \ a JDBC connection in three ways:\n\n- `getConnection(String url)`\n- `getConnection(String\
    \ url, Properties info)`\n- `getConnection(String url, String user, String password)`\n\
    \nIn this example, the first method is used and the URL can be seen as follows:\n\
    \n`jdbc:mysql://localhost:3306/employees?user=empl_1&password=password`\n\nThe\
    \ `getConn()` method requires all necessary database configuration parameters\
    \ to connect to the database. When a JDBC connection is no longer needed, it must\
    \ be explicitly closed by calling the `closeConn()` method. Accumulated open connections\
    \ will strain the resources. In most JDBC drivers, closing a connection results\
    \ in closing the `Statement` and `Result` sets that are associated with the connection.\n\
    \n### 4.2.2.4 EmployeeDao.java\n\nThis class provides basic access to the `employees2`\
    \ table in the database. `PreparedStatement` is used to avoid potential SQL injection\
    \ attack.\n\nOur task is to develop a WS called `EmployeeDataService` that allows\
    \ a client to create, read, update and delete a row from the `employees` table.\
    \ For now, we are not concerned with security – we simply want to show how this\
    \ can be done through a bottom-up approach to create a Web Service.\n\nFirst,\
    \ we create a class that allows access to this table. This class is called `EmployeeDao`\
    \ and allows four basic operations on a row of the `employees` table. An `Employee`\
    \ class represents each employee from the Java coding. `EmployeeDao` uses basic\
    \ Java Database Connectivity (JDBC) to create a database connection, issues an\
    \ SQL statement, and processes the return. It is a basic JDBC application.\n\n\
    ### Listing 4-9. EmployeeDao.java class\n\n```java\npackage com.bemach.data;\n\
    import java.sql.PreparedStatement;\nimport java.sql.ResultSet;\nimport java.sql.SQLException;\n\
    import java.sql.Timestamp;\nimport java.util.Calendar;\nimport java.util.logging.Logger;\n\
    \n/** This class allows its application to perform the four (4) basic operations\n\
    * of an Employee resource: 1. Create 2. Read 3. Update 4. Delete. CRUD is classic\
    \ in a sense that it is most like what an application does to\n* an authorized\
