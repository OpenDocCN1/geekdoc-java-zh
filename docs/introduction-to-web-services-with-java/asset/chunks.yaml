    A service can be defined, published and discovered using some type of service
    registry. Current supporting service registries include electronic business XML
    (ebXML), Universal Discovery, Description and Integration (UDDI), and Metadata
    Registry (MDR). UDDI is usually a good idea; however, it is not widely used except
    in a private network of services.


    RPC is a powerful technique that provides distributed computing capabilities across
    a network of machines. RPC is a form of interprocess communication that enables
    function calls between applications that are located across different (or the
    same) locations over a network. It is best suited for client-server programming.


    ![826.jpg](image/826.jpg) **Figure 1-5** Remote Procedure Call (RPC)


    Web Services can be used to help solve several problems in Enterprise Application
    Integration (EAI). Integrating existing applications for a business solution is
    a complex and time-consuming task. Applications that were written in different
    computer languages, such as C/C++, JAVA, Visual Basic, and FORTRAN, have unique
    logical interfaces to the external world, which makes the integration of these
    applications difficult, complex and time-consuming. Applications that are running
    on different machine architectures, such as SUN, Personal Computer, IBM Mainframes,
    IBM A/S 400, have unique physical interfaces to the external world. Integrating
    these applications is also challenging. Applications running on machines that
    are interconnected through a network are also difficult to integrate. The challenges
    of EAI arise in three main areas:


    * Language barriers – XML is a standardized language that is used for message
    exchange

    * Platform barriers – SOAP has been implemented on many platforms (e.g., Unix,
    Windows)

    * Network barriers – HTTP and SMTP are standardized network protocols


    WS can serve as an enabling technology for application integration. WS, as mentioned
    earlier, places thes following major standards in focus: XML, SOAP, WSDL, UDDI
    and HTTP.


    ![Image835.PNG](image/Image835_fmt.jpeg) **Figure 1-6** Business-to-Business integration


    ### SOAP sequence diagram


    ![843.jpg](image/843.jpg) **Figure 1-7** Sequence diagram of SOAP


    **Service requester** – the client that consumes or requests the service


    **Service provider** – the entity that implements the service and fulfill the
    service requests


    **Service registry** – a listing like a phonebook where available services are
    listed and described in full


    ![Image851.PNG](image/Image851_fmt.jpeg) **Figure 1-8** Web Service Architecture


    ## 1.3 Benefits of Web Services


    Web Services provide many benefits:


    1. Platform-independent: Web Services are now available in nearly all platforms:

    2. a) Hardware: mainframe, midrange, personal and mobile devices

    3. b) Operating systems: UNIX, Windows, Mainframe OS, Android, and iPhones

    4. Reuse of existing networking infrastructure: HTTP, SMTP, and JMS protocols

    5. Loose-coupling of software components promotes software reuse

    6. Reduced integration cost and increased speed

    7. Open architecture and communication protocols


    ## 1.4 Program a HelloWorld Web Service


    The concept of a Web Service can be difficult to comprehend without seeing a concrete
    example of how a Web Service is created and used. The top-down approach starts
    with a WSDL file that describes the services. The top-down approach may increase
    the level of interoperability and allow more control of the WS, wehereas the bottom-up
    approach starts at the low level of the Java bean or enterprise Java bean (EJB)
    and is faster and easier.


    The following steps can be used to create and test a simple WS application:


    1. Run Eclipse IDE, create a new Java project, and name it `java-ws`.

    2. Run `Server.java` as a Java program.

    3. Verify the WSDL and the associated schema for the service endpoint: `http://localhost:9999/HelloWorld?wsdl`.

    4. Use SOAPUI software to test the HelloWorld Web Service.

    5. Create Java Web Service client code.


    ### 1.4.1 Create a Project


    In the example above, the bottom-up approach is used. This example requires Java
    6 or later. A Web Service called ‘Hello World’ is created with the method called
    `say`, which requires one String parameter. To create a Java project under Eclipse
    IDE, perform the following steps:


    1. Run Eclipse IDE.

    2. Choose File → New → Java Project. Use all default and name it `java-ws`.

    3. Expand the `java-ws` project, then right-click on the `src` directory and choose
    New → Package. Name the package `com.bemach.ws.hello`.

    4. Similarly, create another Java package `com.bemach.ws.server`.

    5. Create two Java classes – `com.bemach.ws.hello.HelloWorld.java` and `com.bemach.ws.server.Server.java`.


    ### 1.4.2 Create a Web Service


    A classic HelloWorld class of Java can be written in a few lines of code. The
    purpose is to make sure that a Java Virtual Machine is properly installed and
    ready for programming.


    #### Listing 1-1 HelloWorld.java


    | package com.bemach.ws.hello; |

    | :--- |

    | `/*** 2013 (C) BEM, Inc., Fairfax, Virginia** Unless required by applicable
    law or agreed to in writing,* software distributed is distributed on an "AS IS"
    BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.**/**public
    class HelloWorld { public String say (String name) {return String.format("Hello,
    %s!", name);} public static void main (String[] args) {String msg = new HelloWorld().say("Johnny,
    B. Good");System.out.println(msg);}}**` |


    **Output**:


    Hello, Johnny B. Good!


    In this way, the HelloWorld program is transformed into a WS application. This
    is a basic WS application using the reference implementation of JAX-WS by the
    Java language.


    To transform the HelloWorld program from a simple Java bean into a Java WS application,
    four WS annotations – namely `@WebService`, `@SOAPBinding`, `@WebMethod` and `@WebParam`
    – are decorated as follows:


    #### Listing 1-2 HelloWorld.java with Web Service Annotations


    | package com.bemach.ws.hello; |

    | :--- |

    | `/*** 2013 (C) BEM, Inc., Fairfax, Virginia** Unless required by applicable
    law or agreed to in writing,* software distributed is distributed on an "AS IS"
    BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.**/**import
    java.util.logging.Logger;import javax.jws.WebMethod;import javax.jws.WebParam;import
    javax.jws.WebService;import javax.jws.soap.SOAPBinding;@WebService@SOAPBinding(style=SOAPBinding.Style.DOCUMENT*)public
    class HelloWorld {private static final Logger LOG = Logger.getLogger(HelloWorld.class.getName());@WebMethodpublic
    String say (@WebParam(name="name") String name) {LOG.info("Web service is called!");return
    String.format("Hello, %s!", name);}public static void main (String[] args) {String
    msg = new HelloWorld().say("Johnny, B. Good");LOG.info(msg);}}` |


    Annotations indirectly affect the sematics of the program via tools and libraries.
    The `@WebService` annotation indicates that the class will implement a WS. The
    `@SOAPBinding` annotation indicates the style of the SOAP to be used. In this
    example, the style is `DOCUMENT` as opposed to RPC. `@WebMethod` indicates an
    operation of the WS to be created. Lastly, the `@WebParam` indicates how the parameter
    is named inside the WSDL.


    ### 1.4.3 Create a HTTP Server


    To host the service endpoint, a WS requires an HTTP server. An Apache JEE Tomcat
    server can be used; however, a basic server can be created using only Java. In
    this example, we created an Endpoint with a specific URL that ties to an implementation
    of the WS. In this case, the URL is `http://localhost:9999/java-ws/hello` and
    the implementation is the `HelloWorld` object `svc`.


