    To avoid adding complexity to an already complicated concept, security concerns
    are not considered in this example. Accessing the database from a remote machine
    (i.e., `WS` client) without proper authentication is not a good practice; however,
    in this application, accessing the database with fixed user ID and password is
    a matter of simplicity, not security. Furthermore, the use of the data source
    is much more efficient using direct `JDBC` calls, however, the sample code does
    not follow that standard convention.


    The basic `Java Endpoint` class does not scale well in a business computing environment,
    but it is used here to allow the simplest Java environment capable of supporting
    a simple `WS` application. In later chapters, you can apply similar programming
    principles and techniques for `WS` programming to deploy `WS` applications on
    an Apache Tomcat or an Oracle WebLogic server. These two servers are covered in
    Chapters 5 and 6, respectively.


    Remember, the central idea of this chapter in terms of `WS` programming is how
    to get data from the database through the use of `WS` technology, and `SOAP` in
    particular.


    ## 4.1.1 Use Case Diagram


    Consider the following use case diagram for this sample application. From the
    perspectives of `WS` clients, it invokes four operations of an employee data service.
    Basic data exchange includes two major data types: employee number and employee
    record.


    A resource can be created, read (or obtained), updated (or changed), and deleted.
    The concept of `CRUD` has been fundamental to computer programming since the beginning
    of the field computer science. We have a set of employee records stored in a database,
    and we want to manipulate them from a remote machine using `SOAP` via `WS` technology.


    ![image/1787.jpg]

    **Figure 4-2. Use Cases**


    ### Use Case 1: Create Employee


    Primary Actor: Service Consumer


    Main Success Scenario:

    1. An end-user enters required employee information.

    2. The service consumer then verifies the information.

    3. The service consumer then calls the `employees` data service to create a new
    employee.

    4. The service consumer presents a new employee number to the end-user.


    ### Use Case 2: Update Employee


    Primary Actor: Service Consumer


    Main Success Scenario:

    1. An end-user updates the required employee information.

    2. The service consumer then verifies the information.

    3. The service consumer then calls the `employees` data service for the update.

    4. The service consumer informs the end-user about the status of the update.


    ### Use Case 3: Get (Read) Employee


    Primary Actor: Service Consumer


    Main Success Scenario:

    1. An end-user enters an employee number.

    2. The service consumer then validates the number.

    3. The service consumer then calls the `employees` data service to retrieve the
    employee record.

    4. The service consumer presents the employee record to the end-user.


    ### Use Case 4: Delete Employee


    Primary Actor: Service Consumer


    Main Success Scenario:

    1. An end-user enters an employee number.

    2. The service consumer then validates the number.

    3. The service consumer then calls the `employees` data service to remove the
    employee record.

    4. The service consumer informs the end-user about the status of the deletion.


    A `SOAP` exception is thrown in when an error condition occurs.


    ## 4.1.2 Sequence Diagram


    In a typical `WS` call, many layers of software are involved; however, at a high
    level, the sequence of actions may be represented as in the following sequence
    diagram.


    ![image/1796.jpg]

    **Figure 4-3. Sequence diagram of a getEmployee operation**


    Since all four operations are the basic request-response type of message exchange,
    a single sequence diagram of `getEmployee` operation is shown.


    A consumer, when ready, invokes a `SOAP` engine on the client side to begin a
    `SOAP` call across the network. In this scenario, the consumer understands the
    `SOAP` message fully and constructs a `SOAP` message using `SOAP with Attachment
    API for Java(SAAJ)`. Once a `SOAP` message is formed, the `SOAP` engine sends
    the message to the remote server via `HTTP`. After successfully receiving the
    message, the server processes the request by invoking the appropriate business
    or data services in the backend. In this case, the `getEmployee` method of the
    `employees` service is invoked. Before the data access layer is called, additional
    business logic processing can be done in this class to manipulate the data. `EmployeeDAO`
    is a component that interacts directly with the database using `JDBC` for data
    processing. The data source may not always be a relational database.


    Once the processing is completed, the `employees` service, with the help of the
    `WS` package, forms a `SOAP` message and returns to the `SOAP` engine on the server
    side. As a part of the request-response message exchange pattern, the response
    is then returned to the `SOAP` engine on the client side. Once the client `SOAP`
    engine successfully receives the message, it returns to the Service Consumer for
    final processing.


    The process of forming a `SOAP` message is often called ‘marshalling’. Conversely,
    the process of decoding a `SOAP` message into a native form for further processing
    is called ‘unmarshalling’.


    This sequence diagram shows an example of a synchronous message exchange. In other
    words, activities in this diagram occur in sequence. In some cases, the processing
    may take a long time, and the server may return immediately before the processing
    completes. This is a form of asynchronous message exchange. When the server has
    completed processing the request, it may initiate a call to the client to return
    the response with the actual data or simply a notification. The client can also
    periodically poll the server for data. The second option suffers two problems.
    If the timing window between two polls is too large, the delay can be significant.
    If it is small, it wastes valuable processing power on both sides.


    ## 4.1.3 Deployment Diagram


    The simple deployment of this `WS` application is depicted as follows:


    ![image/7013.jpg]

    **Figure 4-4. A Simple Deployment Diagram**


    In a real-world application, an IT organization may deploy a complex mesh of servers
    and databases to manage their `WS` activities. There can be many client applications.
    In this sample `WS` application, we create an environment that includes a client
    machine, a server machine, and a database machine. These machines can be virtual,
    which means that all three can be hosted by a single physical machine.


    On the server side, we develop two sets of Java libraries – `java-ws.jar` and
    `data-svc.jar`. The first contains the `WS` code that interacts with the client
    over the network protocol `HTTP`. The second deals with the database access via
    `JDBC` calls with the help of `MySQL` driver code written by `MySQL` database
    developers. Together, they comprise a complete application.


    On the client side, we develop a Java library that contains the `WS` client code,
    `java-ws-client.jar`. We use `wsimport` to generate the second library, `java-ws-generated.jar`.
    This second library contains all of the necessary code to interact with the server
    `WS` engine.


    ## 4.1.4 JDBC URL


    To access a relational database from a Java application, a database connection
    must be established using a `JDBC` URL with the following format:


    `jdbc:<subprotocol>:<subname>`


    where


    *   `<subprotocol>` is the name of the driver that was registered with Oracle.
    In this application, `‘mysql’` is used.


    *   `<subname>` is the identification of the resource. It has the following format:


    `//host:port/subsubname`


    subsubname consists of the database schema name, user identification and password.


    In this example, a full JDBC URL can be written as:


    ```

    jdbc:mysql://localhost:3306/employees?user=empl_1&password=password

    ```

