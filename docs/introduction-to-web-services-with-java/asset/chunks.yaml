  trans: "\n在之前的章节中，我们创建了 `DbConfig.java` 类来存储访问数据库的配置参数。接下来的逻辑步骤是创建一个类来管理该应用程序所有的\
    \ `JDBC` 连接。虽然也可以 `DataSource` 类来获取数据库连接，但在本书中，我们使用一种基础方法来获取 JDBC 数据库连接。\n\n###\
