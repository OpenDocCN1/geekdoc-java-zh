    WSDL 是一个根元素名为 `definitions` 的 XML 文档。该定义包含两个部分：抽象部分和具体部分。抽象描述由 `types`、`message`
    和 `portType` 组成。具体部分由 `binding` 和 `service` 组成。抽象部分描述了与服务实现方式无关的操作，而具体部分指定了可以调用服务的协议和位置。


    ![Image1445.PNG](img/Image1445_fmt.jpeg)**图 3-1*** *WSDL 结构*


    在接下来的章节中，我们将更细致地检查 WSDL 的结构，以理解抽象接口与具体实现之间的关系。


    *列表 3-1 示例 WSDL*


    *![6843.jpg](img/6843.jpg)*


    *列表 3-2 另一个示例 WSDL*


    ![6890.jpg](img/6890.jpg)


    ## 3.2 WSDL 接口


    服务接口使用 `portType` 元素定义。该元素包含一个构成 Web 服务的 `operation` 元素列表。每个操作都由一个输入消息和一个输出消息组成，并可选包含一个故障消息。所有操作都在客户端和服务器之间交换消息。消息是一种包含数据的抽象数据类型。


    请参考上述列表 3-1 和 3-2，这些列表强调了基础 WSDL 文档的元素。WSDL 的五个主要组件及其关系是清晰可见的。


    ### 3.2.1 `<types>` 元素


    所有数据类型都定义在这个 `types` 元素内部。通常，`types` 元素指向一个外部 URL，该 URL 包含一个可能包含其他 schema 的 XML
    schema。WSDL 规范并不禁止使用其他类型定义系统；但它倾向于使用 XML schema。


    ### 3.2.2 `<message>` 元素


    `message` 元素是描述操作输入输出的抽象数据类型。它由链接类型的部分（parts）组成。每个操作（`@WebMethod`）可能包含三种消息类型：输入、输出和故障。每种消息类型在整个
    WSDL 文档中都是唯一的。每个类型都有唯一的名称。在每个消息内部，部分定义了在 `<types>` 元素中具体定义（RPC 风格）或通过 schema（文档风格）定义的实际类型。


    ### 3.2.3 `<portType>` 元素


    `<portType>` 元素由一组抽象操作组成。这些操作可能由一个或多个端点支持。操作用于在服务消费者和服务者之间交换消息。消息交换协议可以采用以下模式之一：


    *   单向 – 服务端点接收消息

    *   请求-响应 – 服务端点接收消息并发送关联消息

    *   征询-响应 – 服务端点发送消息并接收关联消息

    *   通知 – 服务端点发送消息


    在上面的示例（列表 3-2）中，WS 包含一个操作（即 `createEmployee`），它具有两个消息——一个输入消息和一个输出消息。输入消息命名为 `tns:createEmployee`，输出消息命名为
    `tns:createEmployeeResponse`。这两个消息可以追溯到消息元素。将 `portType` 想象成类似于 Java 类，在其中定义了方法和属性。


    ### 3.2.3.1 `<operation>` 元素


    服务可以有一个或多个操作（或方法）。每个操作都是独立定义的，包含一个输入消息、一个输出消息和一个可选的故障消息。这些消息使用 `message` 元素定义。类似于
    Java 类定义，每个操作都定义了服务的行为。


    ## 3.3 WSDL 实现


    WSDL 的 `<binding>` 元素将 WSDL 抽象接口连接到具体实现。在本节中，我们将特别关注发生连接的 `<binding>` 元素。因此，在某种程度上，`<binding>`
    是整个 WSDL 规范的核心元素。这是两个世界相遇的地方。


    ### 3.3.1 `<binding>` 元素


    Binding 将 `<portType>` 映射到 `<service>` 元素中指定的实现。从列表 3-1 可以，`<portType>` `HelloWorld`
    被绑定到 `<service>` 元素内部的 `<port>` `HelloWorldPort`。`HelloWorld` 的实现基于 HTTP 的 SOAP（`<soap:binding>`）。SOAP
    指定了数据格式，而 HTTP 是用于提供服务的特定协议。


    Binding 在实现中没有指定任何特定语言。服务的实现方式超出了 WSDL 的范围。


    ### 3.3.2 `<service>` 元素


    服务是渲染该服务的网络特定地址（`<port>`）的集合。`<port>` 和 `<portType>` 通过 `<binding>` 元素链接。这种连接对于服务消费者和服务者之间的运行时动态绑定至关重要。


    `<port>` 元素描述了允许服务消费者与提供的服务进行交互的网络地址。服务可能具有多个端口；因此，选择权留给消费者。在示例 WSDL 中，只提供了一个端口，其位置指定为
    `[`localhost:9999/java-ws/hello`](http://localhost:9999/java-ws/hello)`。注意，主机名和端口号可以在运行时修改，以指向托管服务的任何服务器。


    以下描述了 WSDL 主要元素之间的链接。


