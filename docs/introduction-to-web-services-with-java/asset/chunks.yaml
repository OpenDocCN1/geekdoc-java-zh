    4. 选择位于 `cxf-ws` 项目 `dist` 目录下的 `cxf-ws.war` 文件。


    ![Image3486.PNG](img/Image3486_fmt.jpeg) **图 6-13.** Oracle WLS 安装应用程序界面


    5. 点击‘Next’（下一步）。


    ![Image3494.PNG](img/Image3494_fmt.jpeg) **图 6-14.** 部署类型


