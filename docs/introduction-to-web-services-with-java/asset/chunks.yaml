    \ String getListenInterface() {\n        return listenInterface;\n    }\n\n  \
    \  public void setListenInterface(String listenInterface) {\n        this.listenInterface\
    \ = listenInterface;\n    }\n\n    public String getListenProtocol() {\n     \
    \   return listenProtocol;\n    }\n\n    public void setListenProtocol(String\
    \ listenProtocol) {\n        this.listenProtocol = listenProtocol;\n    }\n}\n\
    ```\n\n`SvrConfig` 类包含了用于形成两种样式（文档和 RPC）服务端点的信息。此外，该类包含了数据访问代码访问数据库所需的配置参数。\n\n\
    ### 4.1.6 关于 employees 示例数据库\n\n`employees` 数据库是 MySQL 的示例数据库。该数据库架构是由新加坡南理工大学的蔡华宽（Chua\
    \ Hock Chuan）教授开发的。可以访问该网站：`http://www.ntu.edu.sg/home/ehchua/programming/sql/SampleDatabases.html`。\n\
    \n![数据库图](img/Image1967_fmt.jpeg) **图 4-5.** *数据库架构（蔡华宽）*\n\n在示例应用程序中，我们只使用 `employees`\
    \ 表。该表可以使用以下 DDL 创建：\n\n#### 列表 4-3. Employees 表定义\n\n| (图像) |\n| :--- |\n\n`employees`\
    \ 表中的所有字段都是必填的，主键为员工编号。`employees` 数据记录可以使用 Java  中的 `Employee` 类来表示。该类的定义如下：\n\
    \n### 4.1.6.1 Employee.java\n\n我们创建一个包含员工记录的 `Employee` 数据对象。`Employee` 是一个 Java\
    \ 类，它使用了 Java XML 绑定架构 (`JAXB`) 注解来辅助序列化过程。`JAXB` 允许 Java 开发人员使用 Java API 从 XML\
    \ 文档中读取和写入对象。它简化了 Java 中读取和写入 XML 文档的过程。特别是，该注解为 SOAP 引擎将 Java 对象转换为 XML 以及反之的操作提供了一种更简单的机制。\n\
    \n#### 列表 4-4. Employee.java 类\n\n"
- fmt: "\n```java\npackage com.bemach.data;\n/*** 2013 (C) BEM, Inc., Fairfax, Virginia**\
    \ Unless required by applicable law or agreed to in writing,* software distributed\
    \ is distributed on an \"AS IS\" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY\
    \ KIND, either express or implied.**/**\nimport java.io.Serializable;\nimport\
    \ java.util.Calendar;\nimport javax.xml.bind.annotation.XmlAccessType;\nimport\
    \ javax.xml.bind.annotation.XmlAccessorType;\nimport javax.xml.bind.annotation.XmlElement;\n\
    import javax.xml.bind.annotation.XmlRootElement;\nimport javax.xml.bind.annotation.XmlType;\n\
    \n@XmlRootElement(name=\"EmployeeService\",namespace=\"http://bemach.com\")\n\
    @XmlAccessorType(XmlAccessType.FIELD)\n@XmlType(name=\"employee\")\npublic class\
    \ Employee implements Serializable {\n    private static final long serialVersionUID\
    \ = 1L;\n\n    @XmlElement(required=true)\n    private long emplNo;\n\n    @XmlElement(required=true)\n\
    \    private String firstName;\n\n    @XmlElement(required=true)\n    private\
    \ String lastName;\n\n    @XmlElement(required=true)\n    private Calendar birthDate;\n\
    \n    @XmlElement(required=true)\n    private String gender;\n\n    @XmlElement(required=true)\n\
    \    private Calendar hireDate;\n\n    public long getEmplNo() {\n        return\
    \ emplNo;\n    }\n\n    public void setEmplNo(long emplNo) {\n        this.emplNo\
    \ = emplNo;\n    }\n\n    public String getFirstName() {\n        return firstName;\n\
    \    }\n\n    public void setFirstName(String firstName) {\n        this.firstName\
    \ = firstName;\n    }\n\n    public String getLastName() {\n        return lastName;\n\
    \    }\n\n    public void setLastName(String lastName) {\n        this.lastName\
    \ = lastName;\n    }\n\n    public Calendar getBirthDate() {\n        return birthDate;\n\
    \    }\n\n    public void setBirthDate(Calendar birthDate) {\n        this.birthDate\
    \ = birthDate;\n    }\n\n    public String getGender() {\n        return gender;\n\
    \    }\n\n    public void setGender(String gender) {\n        this.gender = gender;\n\
    \    }\n\n    public Calendar getHireDate() {\n        return hireDate;\n    }\n\
    \n    public void setHireDate(Calendar hireDate) {\n        this.hireDate = hireDate;\n\
    \    }\n}\n```\n\nAll required fields are reflected in XML elements within the\
    \ sequence. Optional elements often include `numOccurs=\"0\"`. The Java data types\
