    \ are three (3) optional elements that can be used with this annotation:\n\n1.\
    \ `action`: name of an operation defined within the WSDL\n2. `exclude`: excludes\
    \ the method from being exposed as an operation of a Web Service\n3. `operationName`:\
    \ name of the operation.\n\n#### 4.2.4.1.4 @WebParam Annotation\n\nIndividual\
    \ parameters of an operation can be named in the same way as the method. Use this\
    \ annotation to change to different names within the WSDL. Optional parameters\
    \ are:\n\n1. `header`: if `true`, the parameter is extracted from the message\
    \ header instead of from the message body.\n2. `mode`: there are three basic modes\
    \ – `IN`, `OUT`, and `INOUT`.\n3. `name`: the parameter is mapped to `name` in\
    \ XML element that represents the parameter. If `DOCUMENT` style is used, `name`\
    \ is required.\n4. `partName`: if `RPC` style is used, this is the name in the\
    \ `wsdl:part` element.\n5. `targetNamespace`: if `DOCUMENT` style is used, the\
    \ parameter maps to a header.\n\n### 4.2.4.2 EmployeeRpcData.java\n\nThis class\
    \ implements the SOAP RPC style of Web Service. It is nearly identical to that\
    \ of the document style with the exception of `SOAPBinding` annotation. This class\
    \ is used to show the difference between the two styles in use today.\n\n####\
    \ Listing 4-14. EmployeeRpcData.java Class\n\n```java\npackage com.bemach.ws.rpc.employees;\n\
