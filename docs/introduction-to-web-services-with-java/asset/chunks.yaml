    \ JDBC 程序中，关闭连接会导致关联的 `Statement` 和 `ResultSet` 被关闭。\n\n4.2 EmployeeDao.java\n\
    \n该类提供了对数据库 `employees` 表的基本访问。使用 `PreparedStatement` 可以避免 SQL 注入攻击。我们的任务是开发一个名为\
    \ `EmployeeDao` 的类，允许客户端创建、读取、更新和删除 `employees` 表中的行。目前，我们不关心安全性——只是想展示如何通过自下而上的方法来创建该类。`EmployeeDao`\
