    A WSDL is an XML document with a root element named `definitions`. The definition
    includes two parts: abstract and concrete. The abstract descriptions consist of
    `types`, `message`, and `portType`. The concrete part consists of `binding`, and
    `service`. Abstract parts describe the operations that are independent of way
    in which the service will be implemented, while the concrete part specifies the
    protocol and location of the service where it can be invoked.


    ![Image1445.PNG](image/Image1445_fmt.jpeg)**Figure 3-1*** WSDL structure*


    In the following section, we will examine the structure of a WSDL more closely
    to understand the relationships between the abstract interface and the concrete
    implementation.


    *Listing 3-1 Sample WSDL*


    *![6843.jpg](image/6843.jpg)*


    *Listing 3-2\. Another Sample WSDL*


    ![6890.jpg](image/6890.jpg)


    ## 3.2 WSDL Interface


    The service interface is defined using the `portType` element. This element contains
    a list of `operation` elements that make up a Web Service. Each operation consists
    of one in and one out message, and optionally one fault message. All operations
    exchange messages between a client and a server. A message is an abstract data
    type that contains the data.


    Refer to listings 3-1 and 3-2 above, which highlight the elements of a basic WSDL
    document. The five major components of the WSDL and their relationships are visible.


    ### 3.2.1 `<types>` element


    All data types are defined inside this element `types`. Usually, the element `types`
    points to an external URL that contains an XML schema which may contain other
    schemas. WSDL specification does not prohibit the use of other type definition
    systems; however, it prefers the XML schema.


    ### 3.2.2 `<message>` element


    A `message` element is an abstract data type describing the input and output of
    an operation. It consists of parts that are linked to types. Each operation (`@WebMethod`)
    may contain three message types: input, output, and fault. Each of these message
    types is unique throughout the entire WSDL document. Each has a unique name. Inside
    each message, the parts define the actual types that are properly defined inside
    the `<types>` element specifically (RPC style) or via a schema (Document style).


    ### 3.2.3 `<portType>` element


    The `<portType>` element consists of an abstract set of operations. These operations
    may be supported by one or more endpoints. Operations are used to exchange messages
    between a service consumer and the provider. Message exchange protocol can take
    one of the following patterns:


    *   One-way – the service endpoint receives a message

    *   Request-response – the service endpoint receives a message and sends a correlated
    message

    *   Solicit-response – the service endpoint sends a message and receives a correlated
    message

    *   Notification – the service endpoint sends a message


    In the example above (Listing 3-2), the WS consists of one operation (i.e., `createEmployee`)
    that has two messages – one input and one output message. The input message is
    named `tns:createEmployee` and the output message `tns:createEmployeeResponse`.
    These two messages can be traced back to the message elements. Think of `portType`
    as being like a Java class where methods and attributes are defined.


    ### 3.2.3.1 `<operation>` element


    A service may have one or more operations (or methods). Each operation is independently
    defined with one input message, one output message, and an optional fault message.
    These messages are defined using the `message` element. Similar to a Java class
    definition, each operation defines a behavior of a service.


    ## 3.3 WSDL Implementation


    The `<binding>` element of the WSDL connects the WSDL abstract interface to concrete
    implementation. In this section, we will pay specific attention to the `<binding>`
    element where the connection takes place. Thus, in some way, `<binding>` is the
    central element of the entire WSDL specification. This is where the two worlds
    meet.


    ### 3.3.1 `<binding>` element


    Binding maps `<portType>` to a implementation specified in the `<service>` element.
    From listing 3-1, `<portType>` `HelloWorld` is bound to `<port>` `HelloWorldPort`
    inside the `<service>` element. The implementation of `HelloWorld` is SOAP over
    HTTP (`<soap:binding>`). SOAP specifies data formats and HTTP is a specific protocol
    to be used for the service offering.


    Binding does not specify any particular language in its implementation. The way
    in which the service is implemented is beyond the scope of the WSDL.


    ### 3.3.2 `<service>` element


    A service is a collection of network-specific addresses (`<port>`) where the service
    may be rendered. `<port>` and `<portType>` are linked via a `<binding>` element.
    The connection is critical for runtime dynamic binding between the service consumers
    and providers.


    The `<port>` element describes the network address that enables a service consumer
    to interact with the service being offered. A service with multiple ports is possible;
    thus, the choice is left to the consumer. In the sample WSDL, only one port is
    provided and its location is specified as `[http://localhost:9999/java-ws/hello](http://localhost:9999/java-ws/hello)`.
    Note that the host name and port number can be modified at runtime to point to
    whichever server is hosting the service.


    The following describes the linkages between the major elements of a WSDL.


    ![Image1774.PNG](image/Image1774_fmt.jpeg)**Figure 3-2** Linkages inside WSDL


    ## 3.4 References


    Flaherty, B. (2004). “WSDL: Defining Web Services.” Intercom 51(8): 26–28.


    Lessen, T., J. Nitzsche, et al. (2009). “Conversational Web Services: Leveraging
    BPEL (light) for expressing WSDL 2.0 message patterns.” Enterprise Information
    Systems 3(3): 347–367.


    Web Services Description Language (WSDL) 1.1, Retrieved August 27, 2007 from:


    [http://www.w3.org/TR/wsdl](http://www.w3.org/TR/wsdl)


    WSDL Tutorial, Retrieved November 7, 2007 from: [http://www.w3schools.com/wsdl/default.asp](http://www.w3schools.com/wsdl/default.asp)


    # 4 A Sample Service Application


    #### Objectives


    After completing this chapter, you should be able to:


    1.  1\. Write a Web Service that provides access to employee records stored in
    a relational database

    2.  2\. Write a Web Service using JDK 6 or above

    3.  3\. Publish a Web Service using basic Java Endpoint class

    4.  4\. Test a Web Service with SOAPUI testing tool

    5.  5\. Use `wsimport` to generate a Web Service stub for the client

    6.  6\. Write a simple Web Service consumer to invoke a Web Service


    ## 4.1 A Sample application


    Welcome to the world of Web Services! You may find this chapter technically challenging
    at first; however, as you work your way through the examples, you will find that
    the same patterns are used throughout.


    In this application, we deploy a simple SOAP server using basic Java JDK delivery.
    In order to make this application work, you will need the following software packages
    that can be downloaded from the Internet (more instructions are included in Appendix
    A).


    *   • Java JDK 6

    *   • MySQL Community Server 5.6

    *   • MySQL Employees sample database

    *   • MySQL JDBC driver


    ![1780.jpg](image/1780.jpg)**Figure 4-1*** A n-tier application*


    A WS application is created using a Java framework to enable a WS consumer to
    manipulate employee records stored in a relational database. Accessing the database
    from a Web server is accomplished using JDBC technology. MySQL is the relational
    database used for this example. The transport protocol for the WS is HTTP.

