    ## 5.4 Deploy the Service


    When you install Tomcat 7, the Tomcat server home directory has the following
    directories:


    *   • bin


    *   • conf


    *   • lib


    *   • logs


    *   • temp


    *   • webapps


    *   • work


    We are most interested in the bin and the webapps directories for deploying and
    publishing our Web Services. To run Tomcat, go to the bin directory and run startup.cmd
    (WINDOWS) or startup.sh (UNIX).


    To deploy the Web application that contains the sample Web Services, copy the
    cxf-web.war to the webapps directory. You need not restart the Tomcat server each
    time you deploy the Web application.


