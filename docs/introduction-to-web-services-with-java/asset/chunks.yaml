    META-INF/


    META-INF/MANIFEST.MF


    com/


    com/bemach/


    com/bemach/data/


    com/bemach/data/DbConfig.class


    com/bemach/data/DbConnection.class


    com/bemach/data/Employee.class


    com/bemach/data/EmployeeDao.class


    From the standpoint of business, EmployeeDao should be tested to ensure that it
    works at the level of the basic unit. All operations of the classes were thoroughly
    tested to ensure that the classes work.


    ### 4.2.4 Develop Java Classes for Web Services


    To create a Java project under Eclipse IDE, please refer to Chapter 7\. Import
    two libraries (i.e., data-svc.jar and MySQL JDBC driver) into the lib folder under
    java-ws project. Also, make sure to have these libraries in the Java Build Path.
    Refer to the previous section for instructions on how to make reference to the
    libraries for a Java project in Eclipse.


    We develop a Web Service for employee with two different styles: document and
    RPC. First, we create a Java project called ‘java-ws’. After we finish coding
    the required Java classes, the java-ws project should appear as follows:


    **![Image2307.PNG](image/Image2307_fmt.jpeg)Figure** **4-12***. java-ws Java Project*


    The following sections describe the steps required to create Web Services in two
    main Java classes – EmployeeDocData.java and EmployeeRpcData.java


    ### 4.2.4.1 EmployeeDocData.java


    Writing Web Service in Java can be done by incorporating Java annotation into
    Java classes. These classes provide WS using SOAP. Java WS annotations that are
    used include the following:


    *   • @WebService: indicates this class to implement a Web Service


    *   • @SOAPBinding: specifies Web Service to bind to a SOAP protocol


    *   • @WebMethod: exposes an operation as a Web method.


    *   • @WebParam: mapps individual parameters to a WS message.


    A document-style SOAP binding is used for this application.


    #### *Listing 4-13\. EmployeeDocData.java Class*


    ![7639.jpg](image/7639.jpg) 


    This class has four major operations (i.e., CRUD) on an employee record. Note
    that for each operation, the service creates an EmployeeDao object to call the
    matching operation. The call is then returned as the return of the operation of
    the service. Note that the marshalling of the return object is accomplished with
    the assistance of the JAXB component in Java.


    These four operations are simple. Each method calls the corresponding method provided
    by EmployeeDao instance.


    #### 4.2.4.1.1 @WebService Annotation


    @WebService annotation indicates that this class (or an interface) impelements
    a Web Service. This annotation has six (6) optional elements that can be used
    for a more detailed definition of a Web Service:


    1.  1\. endpointInterface: the complete name of the service endpoint interface


    2.  2\. name: the name of the <portType> element within the WSDL


    3.  3\. portName: the name of the <port> element within the WSDL


    4.  4\. serviceName: the name of the <service> element within the WSDL


    5.  5\. targetNamespace: the targetNamespace attribute of the <definition> element
    of the WSDL


    6.  6\. wsdlLocation: the content of the location attribute of the <soap:address>
    element


    In this application, we did not include these optional elements. We will define
    the location of the WSDL when we create an Endpoint within the server code (Server.java).


    #### 4.2.4.1.2 @SOAPBinding Annotation


    This annotation specifies how to map a Web Service onto the SOAP message protocol.
    These involve three optional elements:


    1.  1\. parameterStyle: This can be either BARE or WRAPPED.


    2.  2\. style: This can be either DOCUMENT or RPC


    3.  3\. use: This can be either LITERAL or ENCODED.


    In this sample application, we use DOCUMENT and RPC styles for two separate Web
    Services.


