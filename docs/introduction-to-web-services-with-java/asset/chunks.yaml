    \ in Singapore. The site can be visited at `http://www.ntu.edu.sg/home/ehchua/programming/sql/SampleDatabases.html`.\n\
    \n![Database diagram](image/Image1967_fmt.jpeg) **Figure 4-5.** *Database Schema\
    \ (Chua Hock Chuan)*\n\nIn this sample application, we use only the `employees`\
    \ table. This table can be created using the following DDL:\n\n#### Listing 4-3.\
    \ Employees Table Definition\n\n| (Image) |\n| :--- |\n\nAll fields of the `employees`\
    \ table are required with the primary key being the employee number. The `employees`\
    \ data record can be represented by `Employee` class in Java. This class is defined\
    \ as follows:\n\n### 4.1.6.1 Employee.java\n\nWe create an `Employee` data object\
