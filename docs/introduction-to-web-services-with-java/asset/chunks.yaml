    0\" />\n    </xs:sequence>\n  </xs:complexType>\n</xs:schema>\n```\n\n## 4.2 开发\
    \ Web 服务\n\n自底而上的开发 Web 服务的方法涉及以下活动：\n\n*   编写数据访问对象。\n*   编写业务逻辑对象。\n*   编写服务对象。\n\
    *   将服务部署到服务器。\n*   发布服务器供使用。\n\n在本应用程序中，不包含任何业务服务，因此活动简化如下：\n\n![7274.jpg](img/7274.jpg)\
    \ **列表 4-6. 使用 Java 编写 Web 服务的活动**\n\n我们在 Eclipse 下创建了两个 Java 项目——`data-svc` 和\
    \ `java-ws`。`data-svc` 项目持有通过 `JDBC` 与数据库交互的 Java 代码。该项目创建了一个名为 `data-svc.jar`\
