    \n### 4.2.3 打包 Java 库\n\n为了从命令行运行构建，需要定义 `JAVA_HOME` 和 `ANT_HOME` 变量。确保在 `PATH`\
    \ 变量中包含 `$JAVA_HOME/bin` 或 `%JAVA_HOME%\\bin`。`JAVA_HOME` 应该指向安装的 JDK。我们使用 JDK\
    \ 1.6 进行开发和测试。Ant 构建脚本版本为 1.7.1。\n\n此 `build.xml` 构建脚本默认从 `data-svc` 项目目录的根目录运行。类存储在\
    \ `bin` 目录，而 Java 库 `data-svc.jar` 将存储在 `dist` 目录。清理构建命令将移除这两个目录。因此，应该使用两个构建命令：\n\
    \n`ant dist`（或简单使用 `ant`）\n\n`ant clean`\n\n#### 列表 4-12. data-svc Java 项目的 build.xml\n\
    \n```xml\n<project name=\"data-svc\" default=\"dist\" basedir=\".*\">\n    <description>Data\
    \ Services</description>\n    <!-- 为此构建设置全局属性 -->\n    <property environment=\"\
    env\" />\n    <path id=\"classpath.base\">\n        <fileset dir=\"./lib\" includes=\"\
    *.jar\" />\n    </path>\n    <path id=\"classpath.compile\">\n        <path refid=\"\
    classpath.base\" />\n    </path>\n    <target name=\"init\">\n        <mkdir dir=\"\
    ./bin\" />\n        <mkdir dir=\"./dist\" />\n    </target>\n    <target name=\"\
    compile\" depends=\"init\" description=\"compile the source\">\n        <javac\
    \ srcdir=\"./src\" destdir=\"./bin\" debug=\"true\">\n            <classpath refid=\"\
    classpath.compile\" />\n        </javac>\n    </target>\n    <target name=\"dist\"\
    \ depends=\"compile\" description=\"generate the distribution\">\n        <!--\
    \ 创建发布目录 -->\n        <jar jarfile=\"./dist/data-svc.jar\" basedir=\"./bin\" />\n\
    \    </target>\n    <target name=\"clean\" description=\"clean up\">\n       \
    \ <!-- 清理 ${build} 目录 -->\n        <delete dir=\"./dist\" />\n        <delete\
    \ dir=\"./bin\" />\n    </target>\n</project>\n```\n\n`data-svc.jar` 存储在 `dist`\
    \ 目录。内容如下：\n\n`META-INF/MANIFEST.MF`\n\n`com/bemach/DbConfig`\n\n`com/bemach/DbConnection`\n\
    \n`com/bemach/Employee`\n\n`com/bemach/EmployeeDao`\n\n### 4.2.4 开发 Java 类\n\n\
    要在 Eclipse 中创建 Web Services，请参考：\n\n**![Image2271.PNG](img/Image2271_fmt.jpeg)**\n\
    \n### 4.2.4.1 EmployeeData.java\n\n通过包含以下注解来编写 Web Services：\n\n*   `@WebService`：指示该类的\
    \ Web 服务\n*   `@SOAPBinding`：指定绑定方式\n*   `@WebMethod`：将方法暴露的操作\n\n#### 列表 4-13.\
    \ EmployeeData 类\n\n该类对员工记录有四个主要操作（即 CRUD）。注意对于每个操作，服务都会创建一个 `EmployeeDao` 对象来调用相应的操作。调用结果将作为操作的返回值。\n\
    \n#### 4.2.4.1.1 @WebService 注解\n\n`WebService` 注解表示该类（或接口）实现 Web 服务。该注解有六（6）可选元素，用于更详细地定义\
    \ Web 服务：\n\n1.  `endpointInterface`：服务端点的接口完整名称\n2.  `name`：WSDL 中 `<portType>`\
    \ 元素的名称\n3.  `portName`：WSDL 中 `<port>` 元素的名称\n4.  `serviceName`：WSDL 中 `<service>`\
    \ 元素的名称\n5.  `targetNamespace`：WSDL 中 `<definition>` 元素的 targetNamespace 属性\n\
    6.  `wsdlLocation`：`<soap:address>` 元素 `location` 属性的内容\n\n在本应用程序中，我们没有包含这些可选元素。我们会在服务器代码创建\
    \ Endpoint 时定义 WSDL 的位置。\n\n#### 4.2.4.1.2 @SOAPBinding 注解\n\n`SOAPBinding` 注解指定如何将\
    \ Web 服务映射到 SOAP 消息协议。这些涉及三个可选元素：\n\n1.  `parameterStyle`：可以是 BARE 或 WRAPPED\n\
    2.  `style`：可以是 DOCUMENT 或 RPC\n3.  `use`：可以是 LITERAL 或 ENCODED\n\n"
