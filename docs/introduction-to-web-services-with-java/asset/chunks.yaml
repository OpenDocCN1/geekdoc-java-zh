    ID 和密码访问数据库是为了简单化，而非安全考虑。此外，使用直接的 `JDBC` 调用使用数据源要高效得多，但示例代码并没有遵循这一标准约定。


    基础的 `Java Endpoint` 类在业务计算环境中扩展性不佳，但此处使用它是为了提供一个能够支持简单 `WS` 应用程序的最简单 Java 环境。在随后的章节中，你可以应用类似的编程原则和技术进行
    `WS` 编程，从而将 `WS` 应用程序部署在 Apache Tomcat 或 Oracle WebLogic 服务器上。这两个服务器分别在第 5 章和第
    6 章中介绍。


    请记住，本章在 `WS` 编程方面的核心思想是如何通过使用 `WS` 技术（特别是 `SOAP`）从数据库获取数据。


    ## 4.1.1 用例图


    考虑以下该示例应用程序的用例图。从 `WS` 客户端的角度来看，它调用了员工数据服务的四个操作。基础数据交换包括两个主要数据类型：员工编号和员工记录。


    资源可以被创建、读取（或获取）、更新（或更改）和删除。`CRUD` 概念自计算机科学诞生以来一直是计算机编程的基础。我们在数据库中存储了一组员工记录，并希望从远程机器上通过
    `WS` 技术使用 `SOAP` 对它们进行操纵。


    ![image/1787.jpg]

    **图 4-2. 用例**


    ### 用例 1：创建员工


    主要参与者：服务消费者


    主成功场景：

    1. 终端用户输入所需的员工信息。

    2. 服务消费者随后验证这些信息。

    3. 服务消费者随后调用 `employees` 数据服务创建一个新员工。

    4. 服务消费者向终端用户展示一个新的员工编号。


    ### 用例 2：更新员工


    主要参与者：服务消费者


    主成功场景：

    1. 终端用户更新所需的员工信息。

    2. 服务消费者随后验证这些信息。

    3. 服务消费者随后调用 `employees` 数据服务进行更新。

    4. 服务消费者告知终端用户更新状态。


    ### 用例 3：获取（读取）员工


    主要参与者：服务消费者


    主成功场景：

    1. 终端用户输入员工编号。

    2. 服务消费者随后验证该编号。

    3. 服务消费者随后调用 `employees` 数据服务检索员工记录。

    4. 服务消费者向终端用户展示员工记录。


    ### 用例 4：删除员工


    主要参与者：服务消费者


    主成功场景：

    1. 终端用户输入员工编号。

    2. 服务消费者随后验证该编号。

    3. 服务消费者随后调用 `employees` 数据服务移除员工记录。

    4. 服务消费者告知终端用户删除状态。


    当发生错误情况时，会抛出 `SOAP` 异常。


    ## 4.1.2 序序图


    在典型的 `WS` 调用中，涉及许多层软件；但在高层面上，动作序列可以像如下时序图所示。


    ![image/1796.jpg]

    **图 4-3. getEmployee 操作的时序图**


    由于所有四个操作都是基础的请求-响应类型的消息交换，因此显示了 `getEmployee` 操作的单一时序图。


    消费者在准备就绪，调用客户端的 `SOAP` 引擎开始跨越网络的 `SOAP` 调用。在这种场景下，消费者完全理解 `SOAP` 消息并使用 `Java with
    Attachment API for Java(SAAJ)` 构建 `SOAP` 消息。一旦形成 `SOAP` 消息，`SOAP` 引擎通过 `HTTP`
    将消息发送到远程服务器。成功接收消息后，服务器通过调用后端相应的业务或数据服务处理请求。在这种情况下，调用了 `employees` 服务的 `getEmployee`
    方法。在调用数据访问层之前，可以在此类中进行额外的业务逻辑处理以操作数据。`EmployeeDAO` 是一个直接使用 `JDBC` 与数据库交互的组件。数据源并不总是关系型数据库。


    处理完成后，`employees` 服务在 `WS` 包的帮助下形成 `SOAP` 消息并返回到服务器端的 `SOAP` 引擎。作为请求-响应消息交换模式的一部分，响应随后返回给客户端的
    `SOAP` 引擎。一旦客户端 `SOAP` 引擎成功接收消息，它将返回给服务消费者进行最终处理。


    形成 `SOAP` 消息的过程通常被称为“序列化”（marshalling）。相反，将 `SOAP` 消息解码为原生形式以便进一步处理的过程被称为“反序列化”（unmarshalling）。


    此时序图展示了一个同步消息交换的示例。换句话说，图中的活动是按顺序发生的。在某些情况下，处理可能需要很长时间，服务器可能在处理完成之前立即返回。这是异步消息交换的一种形式。当服务器完成请求处理后，它可能会发起对客户端的调用，返回实际数据的响应或简单的通知。客户端也可以定期轮询服务器获取数据。第二种方案存在两个问题：如果两次轮询之间窗口过大，延迟可能会很显著；如果太小，则会浪费双方的计算资源。


    ## 4.1.3 部署图


    该 `WS` 应用程序的简单部署所示：


    ![image/7013.jpg]

    **图 4-4. 部署图**


    在现实应用中，IT 组织可能会部署复杂的服务器和数据库网来管理他们的 `WS` 活动。可以有很多客户端。在本示例 `WS` 应用程序中，我们创建了一个包含客户端、服务器和数据库机器的环境。这些机器可以是虚拟的，这意味着所有三个都可以由单台物理机托管。


    在服务器端，我们开发了两套 Java 库——`java-ws.jar` 和 `data-svc.jar`。第一个包含通过 `HTTP` 网络协议与客户端交互的
    `WS` 代码。第二个通过 `MySQL` 驱动的 `JDBC` 调用处理数据库访问。它们共同构成了一个完整的应用程序。


    在客户端，我们开发了一个包含 `WS` 客户端代码的 Java 库 `java-ws-client.jar`。我们使用 `wsimport` 生成第二个库
    `java-ws-generated.jar`。这个第二个库包含了与服务器 `WS` 引擎交互的所有必要代码。


    ## 4.1.4 JDBC URL


    为了从 Java 应用程序访问关系型数据库，必须使用符合以下格式的 JDBC URL 建立数据库连接：


    `jdbc:<subprotocol>:<subname>`


    其中


    * `<subprotocol>` 是注册到 Oracle 的驱动名称。在本应用程序中使用 `‘mysql’`。


    * `<subname>` 是资源的标识。它具有以下格式：


    `//host:port/subsubname`


    subsubname 由数据库架构名称、用户标识符和密码组成。


    在本示例中，完整的 JDBC URL 可以写为：


    ```

