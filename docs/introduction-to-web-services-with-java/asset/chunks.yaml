  raw: 'Web Service (WS) is a technology, process, and software paradigm that provides
    support for business integrations mainly over an Internet-based environment. This
    book presents basic concepts of WS, protocol stack, and applications. In addition
    to studying the three supporting standards SOAP, WSDL, and UDDI, students will
    learn how to implement WS using Java-centric technologies such as JAXP, JAXRPC,
    SAAJ, and JAXB. Students will also study how business processes can be implemented
    using WS via BPEL.


    WS is a software application identified by a URI whose interfaces and binding
    are capable of being defined, described, and discovered by XML artifacts, and
    it supports direct interactions with other software applications using XML-based
    messages via Internet-based protocols (W3C: [http:// www.w3.org/TR/ws-desc-reqs](http://%20www.w3.org/TR/ws-desc-reqs)).
    WS is mainly for machine-to-machine communication. The WS standard relies on other
    standards – namely, SOAP, WSDL, and UDDI – to function efficiently. SOAP is an
    application protocol that is used to transmit messages between a WS client and
    a WS server. HTTP is the transport protocol of choice for SOAP; however, JMS and
    SMTP protocols have also been used. WSDL is used to describe the service that
    an external application can call. UDDI is used to publish and advertise services
    so that they can found and used by others. UDDI also uses SOAP as its application
    protocol.


    *   - Chapter 1 – Introduction. This chapter provides an overview of Web Services.
    It presents a brief background of past enterprise integration difficulties and
    the benefits that a WS can offer. This chapter introduces a beginning-level WS
    program using Java Web Services.


    *   - Chapter 2 – SOAP. Using the example from the previous chapter (i.e., a WS
    that exchanges a complex data structure), this chapter explains how basic SOAP
    message exchange works.


    *   - Chapter 3 – WSDL. This chapter offers an in-depth look at how a service
    can be described and understood by others. A more complex WS application is then
    built upon the previous module exercise.


    *   - Chapter 4 – A Sample Application


    *   - Chapter 5 – Apache CXF and Tomcat Server


    *   - Chapter 6 – Deployment of CXF Application on Oracle WebLogic Server 12


    *   - Chapter 7 – Appendix A – Development Environment


    The book focuses on the working mechanism of WS with a hands-on programming exercise
    using a basic Java WS framework. This framework works on a standalone Java application,
    an Oracle WebLogic Server (WLS), and an Apache Tomcat server. Thus, readers are
    expected to have sufficient knowledge of Java and XML.


