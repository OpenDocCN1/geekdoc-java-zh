    \n## 1.7 Test a Web Service with SOAPUI\n\nSOAPUI is a software that enables software\
    \ developers and integrators to test Web Services. Similar to Eclipse IDE, SOAPUI\
    \ is a project-based.\n\n1. Run SOAPUI program.\n2. Select `File` → `New SOAPUI\
    \ project`.\n3. Fill in the Project Name and Initial WSDL.\n\n![Image144.png](image/Image144_fmt.jpeg)\
    \ **Figure 1-12** *Create a SOAPUI project for the HelloWorld Service*\n\nTo execute\
