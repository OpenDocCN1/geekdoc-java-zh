    \    }\n\n    public void setDbCfg(DbConfig dbCfg) {\n        this.dbCfg = dbCfg;\n\
    \    }\n\n    public String getListenHostname() {\n        return listenHostname;\n\
    \    }\n\n    public void setListenHostname(String listenHostname) {\n       \
    \ this.listenHostname = listenHostname;\n    }\n\n    public String getPort()\
    \ {\n        return listenPort;\n    }\n\n    public void setPort(String port)\
    \ {\n        this.listenPort = port;\n    }\n\n    public String getListenInterface()\
    \ {\n        return listenInterface;\n    }\n\n    public void setListenInterface(String\
    \ listenInterface) {\n        this.listenInterface = listenInterface;\n    }\n\
    \n    public String getListenProtocol() {\n        return listenProtocol;\n  \
    \  }\n\n    public void setListenProtocol(String listenProtocol) {\n        this.listenProtocol\
    \ = listenProtocol;\n    }\n}\n```\n\nThe `SvrConfig` class consists of information\
    \ that is used to form a service endpoint for both styles – document and RPC.\
    \ Furthermore, the class contains the configuration parameters that the data access\
    \ code uses to access the database.\n\n### 4.1.6 About the employees sample database\n\
    \nThe `employees` database is a sample database from MySQL. The database schema\
