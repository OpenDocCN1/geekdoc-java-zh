    \n#### Listing 4-16. build.xml for java-ws Java Project\n\n```xml\n<project name=\"\
    java-ws\" default=\"dist\" basedir=\".\">\n    <description>Web Service usign\
    \ Java.</description>\n    <!-- set global properties for this build -->\n   \
    \ <property environment=\"env\" />\n    <path id=\"classpath.base\">\n       \
    \ <fileset dir=\"./lib\" includes=\"/*.jar\" />\n    </path>\n    <path id=\"\
    classpath.compile\">\n        <path refid=\"classpath.base\" />\n    </path>\n\
    \    <target name=\"init\">\n        <mkdir dir=\"./bin\" />\n        <mkdir dir=\"\
    ./dist\" />\n    </target>\n    <target name=\"compile\" depends=\"init\" description=\"\
    compile the source\">\n        <javac srcdir=\"./src\" destdir=\"./bin\" debug=\"\
    true\">\n            <classpath refid=\"classpath.compile\" />\n        </javac>\n\
    \    </target>\n    <target name=\"dist\" depends=\"compile\" description=\"generate\
    \ the distribution\">\n        <!-- Create the distribution directory -->\n  \
    \      <jar jarfile=\"./dist/java-ws.jar\" basedir=\"./bin\" />\n    </target>\n\
    \    <target name=\"clean\" description=\"clean up\">\n        <!-- Delete the\
    \ ${build} directory trees -->\n        <delete dir=\"./dist\" />\n        <delete\
    \ dir=\"./bin\" />\n    </target>\n</project>\n```\n\nThe output of this build\
    \ is a JAR file stored in the `dist` directory. The contents of this library consist\
    \ of the following elements:\n\n- `META-INF/`\n- `META-INF/MANIFEST.MF`\n- `com/`\n\
    - `com/bemach/`\n- `com/bemach/ws/`\n- `com/bemach/ws/doc/`\n- `com/bemach/ws/doc/employees/`\n\
    - `com/bemach/ws/hello/`\n- `com/bemach/ws/rpc/`\n- `com/bemach/ws/rpc/employees/`\n\
    - `com/bemach/ws/server/`\n- `com/bemach/ws/doc/employees/EmployeeDocData.class`\n\
    - `com/bemach/ws/hello/HelloWorld.class`\n- `com/bemach/ws/rpc/employees/EmployeeRpcData.class`\n\
    - `com/bemach/ws/server/Server.class`\n- `com/bemach/ws/server/SvrConfig.class`\n\
    \n## 4.3 Deploy Web Services\n\nThe server instance runs indefinitely. Use `control-C`\
    \ to terminate the process. An alternative way to get the configuration parameters\
