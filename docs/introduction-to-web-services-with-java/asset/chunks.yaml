    \n## 附录 – 开发\n\n现在有很多开发工具可用。\n\n### 7.1 Java 开发包 (JDK)\n\n访问 Oracle 网站 ([`www.oracle.com`](http://www.oracle.com))\
    \ 下载 JDK。\n\n### 7.2 Eclipse (IDE)\n\n访问 Eclipse ([`www.eclipse.org/`](http://www.eclipse.org/))\
    \ 下载 IDE。\n\n#### 7.2.1 在 Eclipse 中创建 Java 项目\n\n要创建 Java 项目，请执行以下步骤：\n\n1. 选择\
    \ `File` -> `New` -> `Java Project`。弹出向导。\n2. 输入项目名称并点击 `Next`。\n3. 在 Java Settings\
    \ 界面，选择默认值并点击 `Finish`。\n\n#### 7.2.2 在 Eclipse 中创建动态 Web 项目\n\n1. 选择 `File` ->\
    \ `New` -> `Other...` 弹出“选择向导”窗口：\n2. 输入项目名称并点击 `Next`。\n3. 在 Java 界面点击 `Next`。\n\
    4. 勾选 `Generate web.xml deployment descriptor`。\n\n### 7.3 MySQL 社区数据库\n\n访问 MySQL\
    \ 网站 ([`www.mysql.com`](http://www.mysql.com)) 下载 MySQL Community Server。运行安装程序并选择默认选项。请记住你的\
    \ root 密码。\n\n从 MySQL 网站下载并安装 Employees 数据库：[`dev.mysql.com/doc/employee/en/index.html`](http://dev.mysql.com/doc/employee/en/index.html)。按照安装说明使用所有默认选项。\n\
    \n创建一个用户 `empl_1` 并分配 Employees 数据库。\n\n如果你更喜欢简单的方法，如下所示创建一个只有一个 `employees` 表的\
    \ Employees 数据库：\n\n#### Listing 7-1. 创建 employees 表的 DDL\n\n```sql\nCREATE TABLE\
    \ employees (\n  emp_no INT NOT NULL,\n  birth_date DATE NOT NULL,\n  first_name\
    \ VARCHAR(14) NOT NULL,\n  last_name VARCHAR(16) NOT NULL,\n  gender ENUM ('M','F')\
    \ NOT NULL,\n  hire_date DATE NOT NULL,\n  PRIMARY KEY (emp_no)\n);\n```\n\n下载并解压用于访问\
    \ MySQL 数据库的 JDBC 驱动程序：\n\n## 7.4 安装 Oracle Fusion Middleware 软件\n\n"
- fmt: '

    Visit Oracle’s website ([http://www.oracle.com](http://www.oracle.com)) and download
    Oracle Fusion Middleware (formerly ‘WebLogic Server’) version 12.1.1. Oracle may
    require the user to sign up for an account. This version is fully functional for
    developers; however, it is limited to five (5) client connections. Make sure to
    download the Windows or Linux Installer version. Warning: this is a large download
    (1.2 GB). The installer version includes a JDK and a customized Eclipse IDE for
    Oracle’s middleware. Run the installer and choose all default options.


    ## 7.5 Install Apache Tomcat server


    Visit Apache Tomcat’s website ([http://tomcat.apache.org](http://tomcat.apache.org))
    and download the latest Tomcat version 7. Tomcat is an open source JEE application
    server that is available for free download.


    Verify the Tomcat server by visiting [http://localhost:8080](http://localhost:8080)
    on a browser. The following page should appear:


    ![Image3808.PNG](image/Image3808_fmt.jpeg)

    Figure 7-7. Working Tomcat Console Screen


    ## 7.6 Apache CXF


    Visit the Apache CXF website to download the software package. Unpack the download
    into a directory. All necessary Java libraries are stored in the unpacked directory.
    Make sure to include appropriate library files (JAR) in the library of the `cxf-ws`
    Java project.


    ```

    aopalliance-1.0.jar

    asm-3.3.jar

    axis.jar

    commons-dbcp-1.4.jar

    commons-discovery-0.2.jar

    commons-logging-1.1.1.jar

    commons-logging.jar

    cxf-2.4.0.jar

    geronimo-activation_1.1_spec-1.1.jar

    geronimo-annotation_1.0_spec-1.1.1.jar

    geronimo-javamail_1.4_spec-1.7.1.jar

    geronimo-servlet_3.0_spec-1.0.jar

    geronimo-ws-metadata_2.0_spec-1.1.3.jar

    jaxb-api-2.2.1.jar

    jaxb-impl-2.2.1.1.jar

    jaxrpc.jar

    neethi-3.0.0.jar

    saaj-api-1.3.jar

    saaj-impl-1.3.2.jar

    spring-aop-3.0.5.RELEASE.jar

    spring-asm-3.0.5.RELEASE.jar

    spring-beans-3.0.5.RELEASE.jar

    spring-context-3.0.5.RELEASE.jar

    spring-core-3.0.5.RELEASE.jar

    spring-expression-3.0.5.RELEASE.jar

    spring-web-3.0.5.RELEASE.jar

    stax2-api-3.1.1.jar

    woodstox-core-asl-4.1.1.jar

    wsdl4j-1.6.2.jar

    wsdl4j.jar

    xml-resolver-1.2.jar

    xmlschema-core-2.0.jar

    ```


    ## 7.7 Install SOAPUI software


    Visit SOAPUI’s website ([http://www.soapui.org](http://www.soapui.org)) and download
    a free version of SOAPUI software.


    ## 7.8 Source Code


    All Java code for this book can be found at Dr. Tran’s blog: [http://drtran.bemach.com](http://drtran.bemach.com).


    # 8 Endnotes


    1. Note that `employees` is the actual name of the database.

    2. Note that `employees` is the name of a table of `employees` database.

