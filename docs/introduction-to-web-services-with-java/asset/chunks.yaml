    java.util.logging.Logger;import javax.jws.WebMethod;import javax.jws.WebParam;import
    javax.jws.WebService;import javax.jws.soap.SOAPBinding;@WebService@SOAPBinding(style=SOAPBinding.Style.DOCUMENT*)public
    class HelloWorld {private static final Logger LOG = Logger.getLogger(HelloWorld.class.getName());@WebMethodpublic
    String say (@WebParam(name="name") String name) {LOG.info("Web service is called!");return
    String.format("Hello, %s!", name);}public static void main (String[] args) {String
    msg = new HelloWorld().say("Johnny, B. Good");LOG.info(msg);}}` |


    为了托管服务端点，WS 需要一个 HTTP 服务器。可以使用 Apache JEE Tomcat 服务器；但也可以仅用 Java 创建基础服务器。在示例中，我们创建了一个绑定到
    WS 实现的特定 URL 的端点。在这种情况下，URL 为 `http://localhost:9999/java-ws/hello`，实现是 `HelloWorld`
    对象 `svc`。


