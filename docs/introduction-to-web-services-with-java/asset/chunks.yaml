    # 7 Appendix A – Development Environment


    Many development tools are available today for Java developers to utilize when
    developing Web Services. Two in particular are recommended and used throughout
    this book.


    ## 7.1 Install Java Development Kit (JDK) 6


    Visit Oracle’s website ([http://www.oracle.com](http://www.oracle.com)) and download
    Java Platform (JDK) 6\. Follow the installation instructions and use all defaults.


    JDK 7 can be used to run all of the examples in this book; however, it would be
    difficult to work with Oracle WebLogic at this time because this software package
    still runs with JDK 6\. Oracle WebLogic 12 can be made to work with JDK 7, but
    it takes more time to set up.


    ## 7.2 Install Eclipse Interactive Development Environment (IDE)


    Visit Eclipse’s website ([http://www.eclipse.org](http://www.eclipse.org)) and
    download the latest version of Eclipse IDE for Java EE developers.


    After installing Eclipse on your system, run it by double-clicking on the Eclipse
    icon in the installed folder. The two basic project types that are used in this
    book are Java Projects and Dynamic Web Projects. Instructions for creating these
    projects are provided in the following sections.


    ### 7.2.1 Create a Java project in Eclipse


    To create a Java project, take the following steps:


    1.  1\. Select File (menu) → New → Java Project. A Project creation screen will
    pop up. Enter your project name and click ‘Next’ at the bottom.


    **![Image3718.PNG](image/Image3718_fmt.jpeg)Figure 7-1***. Create a Java Project
    for the Eclipse IDE*


    1.  2\. On the Java Settings screen, choose all default values and click ‘Finish’
    at the bottom.


    **![Image3725.PNG](image/Image3725_fmt.jpeg)Figure** **7-2***. Java Settings Screen*


    ### 7.2.2 Create a Dynamic Web project in Eclipse


    1.  1\. Choose File (menu) → New → Other… A ‘Select a wizard’ window pops up as
    shown below:


    ![Image3733.PNG](image/Image3733_fmt.jpeg)**Figure 7-3***. Create a Dynamic Web
    Project*


    1.  2\. Enter the project name and click ‘Next’ at the bottom of the screen.


    ![Image3741.PNG](image/Image3741_fmt.jpeg)**Figure 7-4***. Options for a Dynamic
    Web Project*


    1.  3\. Click ‘Next’ on the Java screen.


    ![Image3749.PNG](image/Image3749_fmt.jpeg)**Figure 7-5***. Additional Java Options*


    1.  4\. Make sure to check ‘Generate web.xml deployment descriptor’.


    ![Image3756.PNG](image/Image3756_fmt.jpeg)**Figure 7-6***. Finishing the Creation
    of a Dynamic Web Project*


    ## 7.3 Install MySQL Community Server Database


    Visit MySQL’s website ([http://www.mysql.com](http://www.mysql.com)) and download
    the MySQL Community Server. This version is freely available to developers.


    Run the installer and choose the default options. Make sure to remember your root
    password.


    Download and install Employees, a sample database, from MySQL’s website: [http://dev.mysql.com/
    doc/employee/en/index.html](http://dev.mysql.com/doc/employee/en/index.html).
    Follow the installation instructions and use all default options.


    Create a user called ‘empl_1’ and assign the Employees database.


    If you’d prefer a simpler approach, create an Employees database with just a single
    table ‘Employees’ as shown below.


    #### *Listing 7-1\. A DDL for creating employees table*


    | **CREATE**  **TABLE** employees (emp_no **INT**  **NOT**  **NULL**,birth_date
    **DATE**  **NOT**  **NULL**,first_name **VARCHAR**(14) **NOT**  **NULL**,last_name
    **VARCHAR**(16) **NOT**  **NULL**,gender ENUM (‘M’,’F’) **NOT**  **NULL**,hire_date
    **DATE**  **NOT**  **NULL**,**PRIMARY**  **KEY** (emp_no)); |


    Download and extract the JDBC driver for accessing MySQL database:


    [http://dev.mysql.com/downloads/connector/j/](http://dev.mysql.com/downloads/connector/j/)


