    Hello, Johnny B. Good!


    通过这种方式，HelloWorld 程序被转换为 WS 应用。这是使用 Java 语言实现的简单 WS。


    要将 HelloWorld 程序从简单的 Java Bean 转换为 WS 应用，四个 WS 注解 – 即 `@WebService`、`@SOAPBinding`、`@WebMethod`
    和 `@WebParam` – 装饰如下：


    #### 列表 1-2 带有 Web 服务注解的 HelloWorld.java


    | package com.bemach.ws.hello; |

