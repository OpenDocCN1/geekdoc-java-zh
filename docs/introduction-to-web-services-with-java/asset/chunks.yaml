- fmt: "\nA WS client code is simple to write; however, the amount of code required\
    \ behind the scenes in order to ease the amount of coding on the client side can\
    \ be substantial. Generated code enables a client application to call WS operations\
    \ as it would normally do with another Java bean. This makes the programming of\
    \ a client WS application a bit simpler. In the next chapter, we will use SAAJ\
    \ APIs to create a Java client code that calls the HelloWorld Web Service.\n\n\
    The process of creating a Java Web Service client to call the HelloWorld Web Service\
    \ involves the following steps:\n\n1. Create a `java-ws-client` project in Eclipse.\n\
    2. Generate WS client stub from a service endpoint (`http://localhost:9999/java-ws/hello?WSDL`).\n\
    3. Write a Java client class.\n\n### 1.8.1 Create a Project\n\n### 1.8.2 Generate\
    \ Web Service Stub\n\nFirst, a generated WS client code is generated using a readily\
    \ available tool, `wsimport`, from the Java JDK package. Second, a client code\
    \ is written using the generated code.\n\n1. Open a command prompt or a Unix terminal.\n\
    2. Go to the `java-ws-client` project directory.\n3. Create a `generated` directory.\n\
    4. Create a `lib` directory.\n5. Go to the `generated` directory.\n6. Run the\
    \ following command:\n\n```\nwsimport -d . http://localhost:9999/java-ws/hello?wsdl\n\
    ```\n7. Package the generated client code:\n\n```\njar cvf ../java-ws-generated.jar\
    \ *\n```\n8. Move the `java-ws-generated.jar` file to the `lib` directory.\n\n\
    ### 1.8.3 Create Web Service Client\n\n9. Return to Eclipse and refresh the Java\
    \ project:\n   a) Choose `java-ws` project.\n   b) Choose `File` → `Refresh`.\n\
    \   c) From project properties, choose `Java Build Path/Libraries`.\n   d) Click\
    \ on `Add JARs` and add the `java-ws-generated.jar` file.\n   e) Click `OK`.\n\
    10. Create a new Java package: `com.bemach.ws.hello.client`.\n11. Create a new\
    \ Java class: `HelloWorldClient.java`.\n\nListing 1-8. A HelloWorld Web Service\
    \ Client\n\n```java\npackage com.bemach.ws.hello.client;\n/*** 2013 (C) BEM, Inc.,\
    \ Fairfax, Virginia** Unless required by applicable law or agreed to in writing,*\
    \ software distributed is distributed on an “AS IS\" BASIS, WITHOUT WARRANTIES\
    \ OR CONDITIONS OF ANY KIND, either express or implied.**/**\nimport java.net.MalformedURLException;\n\
    import java.net.URL;\nimport java.util.logging.Level;\nimport java.util.logging.Logger;\n\
    import javax.xml.namespace.QName;\nimport javax.xml.ws.Service;\nimport com.bemach.ws.hello.HelloWorld;\n\
    import com.bemach.ws.hello.HelloWorldService;\n/*** The following code is a normal\
    \ way of going about to call* web services using Java code.* It is much easier\
    \ to comprehend.**/**\npublic class HelloWorldWSClient {\n    private static final\
    \ Logger LOG = Logger.getLogger(HelloWorldWSClient.class.getName());\n    public\
    \ static void main(String[] args) {\n        HelloWorldWSClient client = new HelloWorldWSClient();\n\
    \        try {\n            client.say(\"Johnny B. Good\");\n        } catch (Exception\
    \ e) {\n            LOG.log(Level.SEVERE, \"ERROR:\"+e);\n        }\n    }\n \
    \   public void say (String name) throws MalformedURLException {\n        LOG.info(\"\
    service ... \");\n        QName qName = new QName(\"http://hello.ws.bemach.com/\"\
    , \"HelloWorldService\");\n        URL url = new URL(\"http://localhost:9999/java-ws/hello\"\
    );\n        Service service = HelloWorldService.create(url, qName);\n        HelloWorld\
    \ port = (HelloWorld)service.getPort(HelloWorld.class);\n        String returnMsg\
    \ = port.say(name);\n        LOG.info(\"return: \"+returnMsg);\n    }\n}\n```\n\
    \n## 1.9 Run a Web Service Client\n\n#### Output\n\nWeb Service response: Hello,\
    \ Johnny B. Good!\n\n## 1.10 References\n\nGottschalk, K., Graham, S., Kreger,\
    \ H., & Snell, J. (2002). Introduction to Web Services architecture. *IBM Systems\
    \ Journal, 41*(2), 170–177.\n\nKleijnen, S., & Raju, S. (2003). An Open Web Services\
    \ Architecture. *Queue, 1*(1), 38–46.\n\nMartin, J., Arsanjani, A., Tarr, P.,\
    \ & Hailpern, B. (2003). Web Services: Promises and Compromises. *Queue, 1*(1),\
    \ 48–58.\n\n# 2 SOAP\n\n#### Objectives\n\nAfter reading this chapter, you should:\n\
    \n1. Possess a basic understanding of SOAP\n2. Be able to describe the structure\
    \ of a SOAP message\n3. Understand how to process a SOAP message\n4. Be able to\
    \ map a SOAP message\n\nSOAP is a lightweight protocol intended for exchanging\
    \ information in a decentralized, distributed environment. It uses XML technologies\
    \ to define an extensible framework designed to be independent of any programming\
    \ model and other implementation.\n\nSOAP was implemented as a plug-in to many\
    \ middleware platforms. The initial emphasis on RPC allowed SOAP to become widely\
    \ implemented over the Internet. Eventually, the need for interactions other than\
    \ HTTP emerged (e.g., SMTP and JMS).\n\nSOAP Version 1.2 is a lightweight protocol\
    \ intended for exchanging structured information in a decentralized, distributed\
    \ environment. SOAP specifications provide a formal set of conventions that govern\
    \ how SOAP messages are generated and accepted by SOAP nodes (i.e., senders, receivers\
    \ and intermediaries).\n\n### SOAP XML Payload\n\nA SOAP message is enclosed in\
    \ a SOAP envelope that contains a SOAP header and a SOAP body. The SOAP body is\
    \ mandatory, whereas the SOAP header is optional. The SOAP message is the basic\
    \ unit of communication between SOAP nodes. A SOAP node can transmit, receive,\
    \ or relay a SOAP message. The responsibility of the ultimate destination is to\
    \ process SOAP messages according to the standard. A SOAP message traverses between\
    \ a SOAP sender and a SOAP receiver. The message path may have SOAP intermediary\
    \ nodes in a distributed computing environment.\n\nThe two major message exchange\
    \ patterns that SOAP supports are 1) request-response (in-out) and 2) request\
    \ (in-only). The first pattern is often used where a SOAP request is processed\
    \ and a SOAP response is returned to the SOAP sender node. The second pattern\
    \ is used when the SOAP sender has no interest in receiving a response (e.g.,\
    \ notification). A SOAP response may be returned in an asynchronous mode. For\
    \ example, a server may take a long time to process a SOAP request. Instead of\
    \ waiting for this request to be completed, a SOAP client may receive a callback\
    \ when the server completes the processing.\n\n## 2.1 Examples of SOAP messages\n\
    \nThe following shows SOAP messages in three forms: requests, responses and faults.\n"
  raw: 'A WS client code is simple to write; however, the amount of code required
    behind the scenes in order to ease the amount of coding on the client side can
    be substantial. Generated code enables a client application to call WS operations
    as it would normally do with another Java bean. This makes the programming of
    a client WS application a bit simpler. In the next chapter, we will use SAAJ APIs
    to create a Java client code that calls the HelloWorld Web Service.


    The process of creating a Java Web Service client to call the HelloWorld Web Service
    involves the following steps:


    1.  1\. Create a java-ws-client project in Eclipse.


    2.  2\. Generate WS client stub from a service endpoint ([http://localhost:9999/java-ws/hello?WSDL](http://localhost:9999/java-ws/hello?WSDL)).


    3.  3\. Write a Java client class.


    ### 1.8.1 Create a Project


    ### 1.8.2 Generate Web Service Stub


    First, a generated WS client code is generated using a readily available tool,
    wsimport, from the Java JDK package. Second, a client code is written using the
    generated code.


    1.  1\. Open a command prompt or a Unix terminal.


    2.  2\. Go to the java-ws-client project directory.


    3.  3\. Create a ‘generated’ directory.


    4.  4\. Create a ‘lib’ directory.


    5.  5\. Go to the ‘generated’ directory.


    6.  6\. Run the following command:


    wsimport -d . [http://localhost:9999/java-ws/hello?wsdl](http://localhost:9999/java-ws/hello?wsdl)


    1.  7\. Package the generated client code:


    jar cvf ../java-ws-generated.jar *


    1.  8\. Move the java-ws-generated.jar file to the ‘lib’ directory.


    ### 1.8.3 Create Web Service Client


    1.  9\. Return to Eclipse and refresh the Java project:


    2.  a) Choose java-ws project.


    3.  b) Choose File → Refresh.


    4.  c) From project properties, choose Java Build Path/Libraries.


    5.  d) Click on Add JARs and add the java-ws-generated.jar file.


    6.  e) Click OK.


    7.  10\. Create a new Java package: com.bemach.ws.hello.client.


    8.  11\. Create a new Java class: HelloWorldClient.java.


    *Listing 1-8\. A HelloWorld Web Service Client*


    | **package** com.bemach.ws.hello.client;/*** 2013 (C) BEM, Inc., Fairfax, Virginia**
    Unless required by applicable law or agreed to in writing,* software distributed
    is distributed on an* “AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY*
    KIND, either express or implied.**/**import** java.net.MalformedURLException;**import**
    java.net.URL;**import** java.util.logging.Level;**import** java.util.logging.Logger;**import**
    javax.xml.namespace.QName;**import** javax.xml.ws.Service;**import** com.bemach.ws.hello.HelloWorld;**import**
    com.bemach.ws.hello.HelloWorldService;/*** The following code is a normal way
    of going about to call* a web services using Java code.* It is much easier to
    comprehend.**/**public**  **class** HelloWorldWSClient {**private**  **static**  **final**
    Logger *LOG* = Logger.*getLogger*(HelloWorldWSClient.**class**.getName());**public**  **static**  **void**
    main(String[] args) {HelloWorldWSClient client = **new** HelloWorldWSClient();**try**
    {client.say("Johnny B. Good");} **catch** (Exception e) {*LOG*.log(Level.*SEVERE*,"ERROR:"+e);}}**public**  **void**
    say (String name) **throws** MalformedURLException {*LOG*.info("service ... ");QName
    qName = **new** QName("http://hello.ws.bemach.com/", "HelloWorldService");URL
    url = **new** URL("http://localhost:9999/java-ws/hello");Service service = HelloWorldService.*create*(url,
    qName);HelloWorld port = (HelloWorld)service.getPort(HelloWorld.**class**);String
    returnMsg = port.say(name);*LOG*.info("return: "+returnMsg);}} |


    ## 1.9 Run a Web Service Client


    #### Output


    Web Service response: Hello, Johnny B. Good!


    ## 1.10 References


    Gottschalk, K., Graham, S., Kreger, H., & Snell, J. (2002). Introduction to Web
    Services architecture. *IBM Systems Journal, 41*(2), 170–177.


    Kleijnen, S., & Raju, S. (2003). An Open Web Services Architecture. *Queue, 1*(1),
    38–46.


    Martin, J., Arsanjani, A., Tarr, P., & Hailpern, B. (2003). Web Services: Promises
    and Compromises. *Queue, 1*(1), 48–58.


    # 2 SOAP


    #### Objectives


    After reading this chapter, you should:


    1.  1\. Possess a basic understanding of SOAP


    2.  2\. Be able to describe the structure of a SOAP message


    3.  3\. Understand how to process a SOAP message


    4.  4\. Be able to map a SOAP to a transport protocol


    5.  5\. Be able to write a simple SOAP client using SOAP with Attachment for Java
    (SAAJ)


    SOAP was an improvement of XML-RPC (Remote Procedure Call) that made it possible
    to use XML to represent data between two systems. Initially, SOAP message structure
    was relatively simple. Since SOAP used HTTP protocol, it was tunneled through
    firewall using the Internet infrastructure. According to World Wide Web Consortium
    (W3C), SOAP is defined as follows ([http://www.w3.org/ TR/2007/REC-soap12-part1-20070427/](http://www.w3.org/TR/2007/REC-soap12-part1-20070427/)):


    *…a lightweight protocol intended for exchanging structured information in a decentralized,
    distributed environment. It uses XML technologies to define an extensible messaging
    framework providing a message construct that can be exchanged over a variety of
    underlying protocols. The framework has been designed to be independent of any
    particular programming model and other implementation specific semantics.*


    SOAP was implemented as a plug-in to many middleware platforms and enabled data
    exchange over the Internet in addition to intranet. The initial emphasis on RPC
    thus allowed SOAP to become widely implemented as a wire-protocol over the Internet.
    Eventually, the need for interactions other than RPC led to the Documentation
    type of exchange. Protocols other than HTTP have also emerged over the years (e.g.,
    SMTP and JMS).


    SOAP Version 1.2 is a lightweight protocol intended for exchanging structured
    information in a decentralized, distributed environment ([http](http://www.w3.org/TR/soap12-part1/)[://www.w3.org/TR/soap12-part1/#](http://www.w3.org/TR/soap12-part1/)[intro](http://www.w3.org/TR/soap12-part1/)).
    SOAP specifications provide a formal set of conventions that governs how SOAP
    messages are generated and accepted by SOAP nodes (i.e., senders, receivers and
    intermediaries).


    ### SOAP XML Payload


    A SOAP message is enclosed in a SOAP envelope that contains a SOAP header and
    a SOAP body. The SOAP body is mandatory, whereas the SOAP header is optional.
    The SOAP message is the basic unit of communication between SOAP nodes. A SOAP
    node can transmit, receive or relay a SOAP message. The responsibility of the
    ultimate destination is to process SOAP messages according to the standard. A
    SOAP message traverses between a SOAP sender and a SOAP receiver. The message
    path may have SOAP intermediary nodes in a distributed computing environment.
    These SOAP intermediaries are thought of as ‘men-in-the-middle’, which can cause
    significant security problems.


    The two major message exchange patterns that SOAP supports are 1) request-response
    (in-out) and 2) request (in-only). The first pattern is often used where a SOAP
    request is processed and a SOAP response is returned to the SOAP sender node.
    The second pattern is used when the SOAP sender has no interest in receiving a
    response (e.g., notification). A SOAP response may be returned in an asynchronous
    mode. For example, a server may take a long time to process a SOAP request. Instead
    of waiting for this request to be completed, a SOAP client may receive a callback
    when the server completes the processing.


    **![Image1285.PNG](image/Image1285_fmt.jpeg)Figure 2-1***. SOAP Message Structure*


    ## 2.1 Examples of SOAP messages


    The following shows SOAP messages in three forms: requests, responses and faults.


    ![Image1293.PNG](image/Image1293_fmt.jpeg)**Figure 2-2** *SOAP message exchange*'
