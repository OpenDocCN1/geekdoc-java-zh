    # 6. CXF and Web Services


    ## Objectives


    After completing this chapter, you should be able to:


    1. Understand the fundamentals of WebLogic Server

    2. Create a basic WebLogic domain

    3. Use WebLogic to deploy CXF applications


    In this chapter, we take `WebLogic Server` 12.


    ## 6.1 WebLogic Server


    WebLogic Server (`WLS`) is also known as `Enterprise Edition`. It is the foundation
    for building secure, highly available, and scalable applications. It provides
    a set of APIs for databases, messaging, and external systems.


    ### 6.1.1 Programming


    WLS comes with the following:


    * Java (JSP and Servlet)

    * Web Services (`JAX-WS`, `JAX-RPC`, `JAX-RS`)

    * XML Programming (`JAXB`)

    * Java Messaging (`JMS`)

    * Java Database Connectivity (`JDBC`)

    * Enterprise Information Systems

    * Enterprise JavaBeans (`EJB`)

    * Remote Method Invocation (`RMI`)

    * Security APIs

    * Tuxedo Connectivity (`WTC`)


    ### 6.1.2 High Availability


    Mission-critical applications can be supported with the following:


    * WebLogic Clusters

    * Work Managers

    * Overload Protection

    * Network Channels

    * WebLogic Persistent Store

    * Store-and-forward Services

    * Enterprise-ready Development Tools

    * Production Redeployment


    ## 6.2 Deployment Diagram


    ![3308.jpg](image/3308.jpg) Figure 6-1. Deployment Diagram for CXF


    ## 6.3 Creating WebLogic Domain


    A WebLogic Server domain is a logical group of WLS resources. It is managed by
    a special type of server called an `Administration Server`. This server instance
    is used for managing resources and configurations of these resources. Applications
    and services should not be deployed in an `Administration Server`; they should
    be deployed on `Managed Server` instances. A WLS domain may have one or more Managed
    Server instances.


    Two or more Managed Servers can be grouped into a cluster. A domain can administer
    clusters. For the sake of simplicity, we will deploy the CXF Web Service Application
    on an Administration Server. First, we create a WLS domain by following these
    steps:


    1. Assuming that you installed Oracle WebLogic on Windows, go to `C:\Oracle\Middleware\wlserver_12.1\common\bin`.

    2. Run `config.cmd` (or `config.sh`).

    3. Follow the on-screen instructions to complete the creation of the domain.

    4. Choose all default parameters.

    5. Once complete, the domain is created and stored here: `C:\Oracle\Middleware\user_projects\domains\base_domain`.


    ![Image3317.PNG](image/Image3317_fmt.jpeg) Figure 6-2. Creating a WLS Domain

