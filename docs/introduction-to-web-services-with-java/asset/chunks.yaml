    此文件包含 WebLogic 特有的配置参数。在 WebLogic 服务器上部署 CXF WS 应用时需要该文件。


    #### 列表 6-1. cxf-ws.war Web 应用包含的 weblogic.xml 内容


    ```xml

    <?xml version="1.0" encoding="UTF-8"?><weblogic-web-app xmlns="http://xmlns.oracle.com/weblogic/weblogic-web-app"
    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://xmlns.oracle.com/weblogic/weblogic-web-app
    http://xmlns.oracle.com/weblogic/weblogic-web-app/1.0/weblogic-web-app.xsd"><context-root>cxf-ws</context-root><jsp-descriptor><precompile>true</precompile></jsp-descriptor><session-descriptor><timeout-secs>900</timeout-secs><invalidation-interval-secs>10</invalidation-interval-secs><max-in-memory-sessions>500</max-in-memory-sessions></session-descriptor></weblogic-web-app>

    ```


