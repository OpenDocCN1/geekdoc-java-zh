    Messages can be exchanged using HTTP protocol; thus, firewalls would allow the
    messages to pass through. SOAP messages can also ride naturally over a secure
    channel using HTTPS protocol as well. SOAP promotes a loose-coupling computing
    paradigm where the knowledge of software components is limited to interface of
    the service.


    ### 2.1.1 SOAP request message


    The request represents an invocation of `getEmployee` method with an `emplNo`
    parameter of `100011`. Note that the body contains a single body block with one
    XML element, `<emp:getEmployee>`. A request is marshalled (serialized) into an
    XML document prior to transport across the network to a remote SOAP server. When
    the message arrives at the server, it is ‘un-marshalled’ by a SOAP engine and
    the targeted method is invoked.


    - • A SOAP header is not used in this case.

    - • The SOAP body consists of a single element, `emp:getEmployee`.

    - • `getEmployee`: To get an employee record, an employee number (`emplNo`) is
    required.


    #### Listing 2-1. A SOAP Message Request


    ```xml

    | <soapenv:Envelope  xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"xmlns:emp="http://employees.ws.bemach.com/*"><soapenv:Header  /><soapenv:Body><emp:getEmployee><emplNo>100011</emplNo></emp:getEmployee></soapenv:Body></soapenv:Envelope>
    |

    ```


    ### 2.1.2 SOAP response message


    When the SOAP server successfully processes a request, a response is then marshaled
    into an XML document and returned as a part of HTTP response to the client. The
    client SOAP engine then un-marshals the message to further process the result
    of the call.


    - • A SOAP header is not used.

    - • The SOAP body has a single element, `ns2:getEmployeeResponse`. Note that namespace,
    `ns2`, is used and referenced.

    - • Within the SOAP body, an employee record is returned.


    #### Listing 2-2. A SOAP Message Response


    ```xml

    | <S:Envelope  xmlns:S="http://schemas.xmlsoap.org/soap/envelope/*"><S:Body><ns2:getEmployeeResponse  xmlns:ns2="http://employees.ws.bemach.com/*"xmlns:ns3="http://bemach.com*"><return><emplNo>100011</emplNo><firstName>Shmuel</firstName><lastName>Birge</lastName><birthDate>1956-07-20T00:00:00-04:00</birthDate><gender>M</gender><hireDate>1989-11-23T00:00:00-05:00</hireDate></return></ns2:getEmployeeResponse></S:Body></S:Envelope>
    |

    ```


    ### 2.1.3 SOAP fault message


    If a request contains an invalid employee number, then a SOAP fault message can
    be optionally returned. A SOAP fault may contain messages that help the client
    to resolve an error or unexpected condition. It must include a fault code, fault
    string, and a detailed error message.


    #### Listing 2-3. A SOAP Fault


    ```xml

    | <S:Envelope  xmlns:S="http://schemas.xmlsoap.org/soap/envelope/*"><S:Body><S:Fault  xmlns:ns4="http://www.w3.org/2003/05/soap-envelope*"><faultcode>S:Server</faultcode><faultstring>No
    such employee!</faultstring><detail><ns2:SOAPException  xmlns:ns2="http://employees.ws.bemach.com/*"xmlns:ns3="http://bemach.com*"><message>No
    such employee!</message></ns2:SOAPException></detail></S:Fault></S:Body></S:Envelope>
    |

    ```


    The basic assumption is that all data types are exchanged between SOAP nodes in
    XML format. In reality, not all data should be translated into XML (e.g., binary
    image, proprietary data formats). Thus, a proposed solution is to use SOAP attachments
    similar to the email protocol. There are problems with this approach, though,
    in that scalability can become an issue. Furthermore, not all SOAP engine implements
    SOAP attachment; thus, compatibility becomes an issue between SOAP nodes. This
    does not discount the overhead of an attachment.


    ## 2.2 Mapping SOAP to HTTP


    The SOAP message exchange maps nicely into HTTP protocol. In this example, an
    HTTP `POST` is used for invocating a SOAP method on a server:


    #### Listing 2-4. An HTTP Post


    ```http

    POST /java-ws/hello HTTP/1.1Accept-Encoding: gzip,deflateContent-Type: text/xml;charset=UTF-8SOAPAction:
    ""Content-Length: 298Host: localhost:9999Connection: Keep-AliveUser-Agent: Apache-HttpClient/4.1.1
    (java 1.5)<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
    xmlns:hel="http://hello.ws.bemach.com/"><soapenv:Header/><soapenv:Body><hel:say><!–Optional:–><name>Johnny
    B. Good</name></hel:say></soapenv:Body></soapenv:Envelope> |

    ```


    #### Listing 2-5. Another HTTP Post


    ```http

    POST /rpc/employees HTTP/1.1Accept-Encoding: gzip,deflateContent-Type: text/xml;charset=UTF-8SOAPAction:
    ""Content-Length: 290Host: localhost:9999Connection: Keep-AliveUser-Agent: Apache-HttpClient/4.1.1
    (java 1.5)<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
    xmlns:emp="http://employees.rpc.ws.bemach.com/"><soapenv:Header/><soapenv:Body><emp:getEmployee><emplNo>10002</emplNo></emp:getEmployee></soapenv:Body></soapenv:Envelope>
    |

    ```


    In this case, a return of an HTTP `POST` for a SOAP response is relatively simple:


    #### Listing 2-6. An HTTP Response


    ```http

    HTTP/1.1 200 OKTransfer-encoding: chunkedContent-type: text/xml;charset="utf-8"5e<?xml
    version="1.0" ?><S:Envelope xmlns:S="http://schemas.xmlsoap.org/soap/envelope/"><S:Body>88<ns2:sayResponse
    xmlns:ns2="http://hello.ws.bemach.com/"><return>Hello, Johnny B. Good!</return></ns2:sayResponse></S:Body></S:Envelope>
    |

    ```


    #### Listing 2-7. Another HTTP Response


    ```http

    HTTP/1.1 200 OKTransfer-encoding: chunkedContent-type: text/xml;charset=utf-8Date:
    Thu, 11 Apr 2013 10:20:49 GMT5e<?xml version="1.0" ?><S:Envelope xmlns:S="http://schemas.xmlsoap.org/soap/envelope/"><S:Body>167<ns3:getEmployeeResponse
    xmlns:ns2="http://bemach.com" xmlns:ns3="http://employees.rpc.ws.bemach.com/"><return><emplNo>10002</emplNo><firstName>Bezalel</firstName><lastName>Simmel</lastName><birthDate>1964-06-02T00:00:00-04:00</birthDate><gender>F</gender><hireDate>1985-11-21T00:00:00-05:00</hireDate></return></ns3:getEmployeeResponse></S:Body></S:Envelope>
    |

    ```


    ## 2.3 SAAJ Client


    A SOAP with Attachment API for Java (`SAAJ`) is more complex to write. It allows
    the developers to gain direct access to methods of creating SOAP messages. You
    can manipulate XML directly using Java APIs. Unlike the example in Chapter 1 of
    writing the client code that uses JAX-RPC, writing an SAAJ client can be laborious.


    The steps for creating a SOAP client using SAAJ are as follows:


    1.  Create a SOAP message that includes a SOAP header and SOAP body.

    2.  Add necessary elements to the SOAP header and SOAP body.

    3.  Create a SOAP connection (URL).

    4.  Send the SOAP message to the SOAP server.

    5.  Process the response message.


    A SOAP client can be written in Java with a basic understanding of SOAP messages.
    A client code of the HelloWorld service is as follows.


    #### Listing 2-8. HelloWorldSOAPClient.java class Using SAAJ

