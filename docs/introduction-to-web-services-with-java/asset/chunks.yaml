    host, port, db, uid, psw);conn = DriverManager.*getConnection*(url);} **catch**
    (SQLException e) {*LOG*.log(Level.*SEVERE*,*ERROR_MSG*+e);} **catch** (ClassNotFoundException
    e) {*LOG*.log(Level.*SEVERE*,*ERROR_MSG*+e);}}**public**  **static** DbConnection
