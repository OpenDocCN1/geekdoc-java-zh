    ## 4.2 Develop a Web Service


    A bottom-up approach for developing a Web Service involves the following activities:


    *   • Write a data access object.


    *   • Write a business logic object.


    *   • Write a service object.


    *   • Deploy a service to a server.


    *   • Publish the server for use.


    In this application, no business services are included, thus the activities are
    simplified as follows:


    ![7274.jpg](image/7274.jpg)**Listing 4-6***. Activities for writing Web Services
    with Java*


    We create two Java projects under Eclipse – data-svc and java-ws. The data-svc
    project holds Java code that interacts with the database via JDBC. This project
    creates a library called ‘data-svc.jar’. This library contains four Java classes:


    *   • DbConfig.java


    *   • DbConnection.java


    *   • Employee.java


    *   • EmployeeDao.java


    The java-ws project, which resulted in a java-ws.jar library, consists of the
    following Java classes:


    *   • SvrConfig.java


    *   • Server.java


    *   • EmployeeDocData.java


    *   • EmployeeRpcData.java


    ### 4.2.1 Class Diagram


    A static view of the server application is depicted in the following class diagram.


    #### *Listing 4-7\. A class diagram*


    ![7284.jpg](image/7284.jpg)


    In a class diagram, the hollow-diamond adornment indicates a part-whole relationship
    between the classes. This is called an ‘aggregation’. On the other hand, the solid-diamond
    adornment represents a composite relationship between the classes. A composition
    is stronger than an aggregation in that the former involves a complete management
    of the lifetime of the object. For example, at runtime, an EmployeeDao object
    is responsible for allocation and deallocation of the DbConnection object. The
    Employee object is allocated by the EmployeeDao but deallocated by the EmployeeDocData
    or EmployeeRpcData object.


    The dotted-line boxes indcate the boundaries of the two libraries to be created
    for this application.


    ### 4.2.2 Write Data Access Class


    The Data Access Object (DAO) design pattern is used to provide abstract and encapsulated
    access of data from the data sources. It manages the connection with the data
    source to store and retrieve data.


    First, we create a Java project called ‘data-svc’ (see section 7.2.1). After we
    complete our coding of the Java classes, this project should appear as follows:


    ![Image2108.PNG](image/Image2108_fmt.jpeg)**Figure 4-6***. Java Project: data-svc*


    ### 4.2.2.1 Import JDBC driver to the project


    Following the instructions in section 7.2 to install MySQL and download an appropriate
    JDBC driver for MySQL database, the JDBC driver that is used for this application
    is mysql-connector-java-5.1.24-bin.jar.


    Create a folder named ‘lib’ under the data-svc project by first selecting the
    project. Then, choose File → New → Folder. This folder will contain the JDBC driver
    library. Expand the project by clicking on the triangle to the left of the project
    name.


    Now, import the JDBC driver that you have downloaded by clicking on the lib folder.
    Then, choose File → Import… The Select screen pops up as follows:


    ![Image2116.PNG](image/Image2116_fmt.jpeg)**Figure 4-7***. Select import type*


    Choose General → Archive File, and then click on the ‘Next’ button at the bottom
    of screen. An Archive file screen pops up as follows:


    ![Image2124.PNG](image/Image2124_fmt.jpeg)**Figure 4-8***. Import Archive file
    screen*


    If you know the location of the JDBC driver for MySQL database, enter the file
    name and location. Otherwise, use the ‘Browse’ button on the right and choose
    the file. Then, click the ‘Finish’ button on the bottom of the screen.


    ### 4.2.2.2 Reference to the library


    Next, make sure the project has a reference to the MySQL JDBC driver library.
    First, choose the data-svc project. Then, select Project (menu) → Properties.
    The Properties for the data-svc screen will pop up as follows:


    ![Image2131.PNG](image/Image2131_fmt.jpeg)**Figure 4-9***. Java Build Path*


    On the left panel of the screen, choose Java Build Path. Select the Libraries
    tab from the top of the right panel. Click on the Add JARs… button. A JAR Selection
    screen will pop up as follows:


    ![Image2138.PNG](image/Image2138_fmt.jpeg)**Figure 4-10***. JAR Selection screen*


    Expand data-svc/lib folder. Select the JDBC driver. Then, click OK. Your Java
    Build Path screen should look like this:


    ![Image2147.PNG](image/Image2147_fmt.jpeg)**Figure 4-11***. Java Build Path*


    Now, the coding can begin. In the following section, we create two classes – DbConnection.java
    and EmployeeDao.java.


