    First, create a `SOAPUI` project for each of the WS endpoints. Then, run the operation
    of each Web Service.


    ### 4.5.1 SOAPUI projects


    Web Service can be tested using `SOAPUI`, which is an open source cross-platform
    functional testing tool that can be used to test Web Services. Like `Eclipse`,
    `SOAPUI` is organized into projects. Each project usually manages one service
    endpoint. Each service endpoint contains one or more operations that can be called
    from a client machine. In order to test a Web Service, all you really need is
    a service endpoint URL provided by your service provider.


    The following figure shows how to create a `SOAPUI` test project for the employees
    data service with document style at this service endpoint: [http://localhost:9999/doc/employees?WSDL](http://localhost:9999/doc/employees?WSDL).


    ![Image2734.PNG](image/Image2734_fmt.jpeg) Figure 4-13. Create a SOAPUI Project


    Once the project has been created, a set of operations will appear, as shown in
    the following figures. Note that you can now start testing these WS operations.
    In our example, four operations are visible: `createEmployee`, `deleteEmployee`,
    `getEmployee`, and `updateEmployee`.


    ![8102.jpg](image/8102.jpg) Figure 4-14. List of Oerations of a Web Service


    Double-clicking on `Request1` of the `createEmployee` operation will cause a multi-pane
    window to be displayed. You can fill in the parameters and run the test by clicking
    on the green triangle to the left panel.


    ![8123.jpg](image/8123.jpg) Figure 4-15. Execute a SOAP Operations


    Other operations of the service can be tested in the same way.


    Web Service with an RPC style can be tested in a similar way. The only difference
    is that when you create a `SOAPUI` project, you provide a different service endpoint
    (URL). A `SOAPUI` project can be created for `EmployeeData` service with RPC style
    as follows:


    ![Image2840.PNG](image/Image2840_fmt.jpeg) Figure 4-16. Create a new SOAPUI Project


    ### 4.6 Develope a Web Service Consumer


    Developing a WS consumer (or client) involves three major activities: creating
    a client stub, creating a client code that uses the client stub to call service
    operations, and running the client. These activities are described as follows.


    ![2847.jpg](image/2847.jpg) Figure 4-17. Activities for Creating a Web Service
    Client


    ### 4.6.1 Creating Client Stub with `wsimport`


    Writing a SOAP client with `SAAJ` can be complex and time-consuming. See section
    2.4 for details. Instead, we will use the `wsimport` tool to generate WS artifacts
    (stubs).


    First, create a Java Project under `Eclipse` IDE and call it `java-ws-client`.


    1. At the command prompt, go to the Java Project for `Eclipse` called `java-ws-client`.

    2. Create a folder called `generated`.

    3. To generate WS stubs, run the following commands:


    ```bash

    wsimport -d . http://localhost:9999/doc/employees?WSDL

    wsimport -d . http://localhost:9999/rpc/employees?WSDL

    wsimport -d . http://localhost:9999/java-ws/hello?WSDL

    ```


    4. To create a Java library, run the following command:


    ```bash

    jar –cvf ../lib/java-ws-generated.jar *

    ```


    5. To verify the content of the created jar, run this command:


    ```bash

    jar –tf ../lib/java-ws-generated.jar *

    ```


    The content of the library should appears as follows:


    ```text

    META-INF/

    META-INF/MANIFEST.MF

    com/

    com/bemach/

    com/bemach/ObjectFactory.class

    com/bemach/ws/

    com/bemach/ws/doc/

    com/bemach/ws/doc/employees/

    com/bemach/ws/doc/employees/CreateEmployee.class

    com/bemach/ws/doc/employees/CreateEmployeeResponse.class

    com/bemach/ws/doc/employees/DeleteEmployee.class

    com/bemach/ws/doc/employees/DeleteEmployeeResponse.class

    com/bemach/ws/doc/employees/Employee.class

    com/bemach/ws/doc/employees/EmployeeDocData.class

    com/bemach/ws/doc/employees/EmployeeDocDataService.class

    com/bemach/ws/doc/employees/GetEmployee.class

    com/bemach/ws/doc/employees/GetEmployeeResponse.class

    com/bemach/ws/doc/employees/ObjectFactory.class

    com/bemach/ws/doc/employees/package-info.class

    com/bemach/ws/doc/employees/SOAPException.class

    com/bemach/ws/doc/employees/SOAPException_Exception.class

    com/bemach/ws/doc/employees/UpdateEmployee.class

    com/bemach/ws/doc/employees/UpdateEmployeeResponse.class

    com/bemach/ws/hello/

    com/bemach/ws/hello/HelloWorld.class

    com/bemach/ws/hello/HelloWorldService.class

    com/bemach/ws/hello/ObjectFactory.class

    com/bemach/ws/hello/package-info.class

    com/bemach/ws/hello/Say.class

    com/bemach/ws/hello/SayResponse.class

    com/bemach/ws/rpc/employees/

    com/bemach/ws/rpc/Employee.class

    com/bemach/ws/rpc/EmployeeDocData.class

    com/bemach/ws/rpc/EmployeeDocDataService.class

    com/bemach/ws/rpc/ObjectFactory.class

    com/bemach/ws/rpc/package-info.class

    com/bemach/ws/rpc/SOAPException.class

    com/bemach/ws/rpc/SOAPException_Exception.class

    ```


    These commands generate java binary code that can become part of a client program.
    Next, we create a Java library that contains the generated code: `java-ws-generated.jar`.
    This library should be included as part of the `Eclipse` set during execution.


    ### 4.6.2 Create Client Code


    We present two types of client code – document style and RPC style. Both are commonly
    used in WS programming; however, document style is preferred.


    After the coding has been completed, the `java-ws-client` project should look
    like this:


    ![Image2856.PNG](image/Image2856_fmt.jpeg) Figure 4-18. Screenshot of java-ws-client
    Project


    ### 4.6.2.1 EmployeesDocClient.java


    This client code uses the generated client stub for making WS calls to the remote
    server. One important class is `QName`, where we create a qualified name that
    contains the `targetNamespace` and the `name` attributes of the `definitions`
    element of the WSDL. The next important class is the `URL` where we create a service
    endpoint as the `location` attribute of the `soap:address` element of the WSDL.
    From these two classes, we can then create a service which we map onto the set
    of operations that the service provides. Mapping the port onto `EmployeeDocData`
    is specified as a `type` attribute of the `binding` element within the WSDL. Once
    we get the port, we can call the operations as we did with the local method invocation
    in Java.

