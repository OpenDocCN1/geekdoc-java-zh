    ## 1.7 Test a Web Service with SOAPUI


    SOAPUI is a software that enables software developers and integrators to test
    Web Services. Similar to Eclipse IDE, SOAPUI is a project-based application.


    1.  1\. Run SOAPUI program.


    2.  2\. Select File → New SOAPUI project.


    3.  3\. Fill in the Project Name and the Initial WSDL/WADL.


    *![Image1144.PNG](image/Image1144_fmt.jpeg)***Figure 1-12** *Create a SOAPUI project
    for the HelloWorld Web Service*


    To execute a SOAP operation, take the following steps:


    1.  1\. On the left panel, double-click on Request 1.


    2.  2\. Fill in the blank between <arg0> and </arg0>.


    3.  3\. Click on the green triangle on the top left panel of the request.


    4.  4\. View the SOAP response on the right panel.


    ![1178.jpg](image/1178.jpg)**Figure 1-13** *Opening the HelloWorld WSDL*


    To troubleshoot at the HTTP layer, click on the ‘http log’ button on the bottom
    of screen.


