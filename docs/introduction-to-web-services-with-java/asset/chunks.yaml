    Application and Oracle WebLogic Server*


    ## 6.3 Creating a WebLogic Domain


    A WebLogic Server administration domain is a logical group of WLS resources. A
    domain is managed by a special type of server called an ‘Administration Server’.
    This server instance is used for managing resources and configurations of these
    resources. Applications and services should not be deployed in an Administration
    Server; they should be deployed on Managed Server instances instead. A WLS domain
    may have one or more Managed Server instances.


    Two or more Managed Servers can be grouped into a cluster. A domain can administer
    one or more clusters. For the sake of simplicity, we will deploy the CXF Web Service
    Application on an Administration Server. First, we create a WLS domain by following
    these steps:


    1.  1\. Assuming that you installed Oracle WebLogic Server on Windows, go to C:\Oracle\Middleware\wlserver_12.1\common\bin.


    2.  2\. Run config.cmd (or config.sh).


    3.  3\. Follow the on-screen instructions to complete the creation of the domain.


    4.  4\. Choose all default parameters.


    5.  5\. Once complete, the domain is created and stored here: C:\Oracle\Middleware\user_projects\domains\base_domain


