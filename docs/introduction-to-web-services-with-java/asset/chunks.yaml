    # Preface


    This book, which is based on lectures I provided at Trident University International,
    focuses more on the details of a hands-on approach to Web Service programming
    than its specifications; however, in order to help readers grasp the concept more
    easily, we provide a brief introduction to Web Service, SOAP, and WSDL in the
    first three chapters. Many details of the specifications are intentionally glossed
    over, however, so that the content remains manageable.


    #### Objectives


    *   • To understand the basic concepts of Web Services:


    *   - SOAP


    *   - WSDL


    *   • To develop basic Web Services using the following major programming tools:


    *   - Java JDK 6 or later


    *   - Apache CXF 2.7 or later


    *   - Oracle Middleware WebLogic Server (WLS) 12.1 or later


    Background requirements for this book:


    *   • Basic Java programming experience


    *   • Basic understanding of Web programming


    *   • Basic understanding of XML'
