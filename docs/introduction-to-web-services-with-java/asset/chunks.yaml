    \ Bean 一样调用 WS 操作。这使得客户端 WS 应用程序的编程变得简单了一些。在下一章节中，我们将使用 SAAJ API 创建一个调用 HelloWorld\
    \ Web 服务的 Java 客户端代码。\n\n创建一个调用 HelloWorld Web 服务的 Java Web Service 客户端涉及以下步骤：\n\
    \n1. 在 Eclipse 中创建一个 `java-ws-client` 项目。\n2. 从服务端点（`http://localhost:9999/java-ws/hello?WSDL`）生成\
    \ WS 客户端存根（stub）。\n3. 编写一个 Java 客户端类。\n\n### 1.8.1 创建项目\n\n### 1.8.2 生成 Web 服务存根\n\
    \n首先，使用 Java JDK 包中现有的工具 `wsimport` 生成生成的 WS 客户端代码。其次，使用生成的代码编写客户端代码。\n\n1. 打开命令提示符或\
    \ Unix 终端。\n2. 进入 `java-ws-client` 项目目录。\n3. 创建一个 `generated` 目录。\n4. 创建一个 `lib`\
    \ 目录。\n5. 进入 `generated` 目录。\n6. 运行以下命令：\n\n```\nwsimport -d . http://localhost:9999/java-ws/hello?wsdl\n\
    ```\n7. 将生成的客户端代码打包：\n\n```\njar cvf ../java-ws-generated.jar *\n```\n8. 将 `java-ws-generated.jar`\
    \ 文件移动到 `lib` 目录。\n\n### 1.8.3 创建 Web 服务客户端\n\n9. 返回 Eclipse 并刷新 Java 项目：\n  \
    \ a) 选择 `java-ws` 项目。\n   b) 选择 `File` → `Refresh`。\n   c) 从项目属性中，选择 `Java Build\
    \ Path/Libraries`。\n   d) 点击 `Add JARs` 并添加 `java-ws-generated.jar` 文件。\n   e)\
    \ 点击 `OK`。\n10. 创建一个新的 Java 包：`com.bemach.ws.hello.client`。\n11. 创建一个新的 Java 类：`HelloWorldClient.java`。\n\
    \n列表 1-8. 一个 HelloWorld Web 服务客户端\n\n```java\npackage com.bemach.ws.hello.client;\n\
    /*** 2013 (C) BEM, Inc., Fairfax, Virginia** Unless required by applicable law\
    \ or agreed to in writing,* software distributed is distributed on an “AS IS\"\
    \ BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.**/**\n\
    import java.net.MalformedURLException;\nimport java.net.URL;\nimport java.util.logging.Level;\n\
    import java.util.logging.Logger;\nimport javax.xml.namespace.QName;\nimport javax.xml.ws.Service;\n\
    import com.bemach.ws.hello.HelloWorld;\nimport com.bemach.ws.hello.HelloWorldService;\n\
    /*** 以下代码是使用 Java 代码调用* web 服务的正常方式。* 它更容易理解。**/**\npublic class HelloWorldWSClient\
    \ {\n    private static final Logger LOG = Logger.getLogger(HelloWorldWSClient.class.getName());\n\
    \    public static void main(String[] args) {\n        HelloWorldWSClient client\
    \ = new HelloWorldWSClient();\n        try {\n            client.say(\"Johnny\
    \ B. Good\");\n        } catch (Exception e) {\n            LOG.log(Level.SEVERE,\
    \ \"ERROR:\"+e);\n        }\n    }\n    public void say (String name) throws MalformedURLException\
    \ {\n        LOG.info(\"service ... \");\n        QName qName = new QName(\"http://hello.ws.bemach.com/\"\
    , \"HelloWorldService\");\n        URL url = new URL(\"http://localhost:9999/java-ws/hello\"\
    );\n        Service service = HelloWorldService.create(url, qName);\n        HelloWorld\
    \ port = (HelloWorld)service.getPort(HelloWorld.class);\n        String returnMsg\
    \ = port.say(name);\n        LOG.info(\"return: \"+returnMsg);\n    }\n}\n```\n\
    \n## 1.9 运行 Web 服务客户端\n\n#### 输出\n\nWeb 服务响应：Hello, Johnny B. Good!\n\n## 1.10\
    \ 引用\n\n\n\nGottschalk, K., Graham, S., Kreger, H., & Snell, J. (2002). Introduction\
    \ to Web Services architecture. *IBM Systems Journal, 41*(2), 170–177.\n\nKleijnen,\
    \ S., & Raju, S. (2003). An Open Web Services Architecture. *Queue, 1*(1), 38–46.\n\
    \nMartin, J., Arsanjani, A., Tarr, P., & Hailpern, B. (2003). Web Services: Promises\
    \ and Compromises. *Queue, 1*(1), 48–58.\n\n# 2 SOAP\n\n#### 目标\n\n阅读完本章后，你应该：\n\
    \n1. 对 SOAP 有基本的理解\n2. 能够描述 SOAP 消息的结构\n3. 理解如何处理 SOAP 消息\n4. 能够映射 SOAP 消息\n\n\
    SOAP 是一种轻量级协议，旨在用于去中心化的分布式环境中交换信息。它使用 XML 技术定义了一个可扩展的框架，该框架独立于任何编程模型和其他实现。\n\n\
    SOAP 被实现为许多中间件平台的插件。最初对 RPC 的强调使得 SOAP 能够在互联网上广泛实现。最终，出现了 HTTP 以外的交互需求（例如 SMTP\
    \ 和 JMS）。\n\nSOAP 版本 1.2 是一种轻量级协议，旨在用于去中心化的分布式环境中交换结构化信息。SOAP 规范提供了一套正式规则，规定了\
    \ SOAP 消息如何由 SOAP 节点（即发送者、接收者和中间节点）生成和接受。\n\n### SOAP XML 负载\n\nSOAP 消息封装在一个 SOAP\
    \ 封中，其中包含 SOAP Header 和 SOAP Body。SOAP Body 是强制的，而 SOAP Header 是可选的。SOAP 消息是 SOAP\
    \ 节点之间通信的基本单元。SOAP 节点可以传输、接收或中继 SOAP 消息。最终目的责任是根据标准处理 SOAP 消息。SOAP 消息在 SOAP 发送者和\
    \ SOAP 接收者之间传输。在分布式计算环境中可能存在 SOAP 中间节点。\n\n## 2.1 SOAP 消息示例\n\n以下显示了三种形式的 SOAP\
    \ 消息：请求、响应和故障。\n"
