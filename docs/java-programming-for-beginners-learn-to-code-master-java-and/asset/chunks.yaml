    Installing the JDK


    Head over to the Oracle website and look for the JDK download page. You’ll see
    options for different operating systems – Windows, macOS, and Linux. Choose the
    one that matches your operating system, download the installer, and follow the
    prompts to install it. Once the installation is complete, you’ll need to set up
