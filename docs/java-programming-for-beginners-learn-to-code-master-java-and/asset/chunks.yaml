    # Chapter 6: Object-Oriented Programming (OOP) Concepts


    Welcome to Chapter 6! By now, you’ve got a good grip on the basics of Java, including
    syntax, variables, data types, control flow, and methods. It’s time to dive into
    one of the most powerful features of Java: Object-Oriented Programming (OOP).
    OOP is a programming paradigm that uses “objects” to design applications and programs.
    Think of it as organizing your code into a collection of interconnected mini-programs
    that work together to accomplish tasks.


    Understanding OOP


    At its core, OOP is about modeling real-world entities as software objects that
    have both state and behavior. The state is represented by the object’s attributes
    (fields or properties), and the behavior is represented by the object’s methods.
    The four main principles of OOP are encapsulation, inheritance, polymorphism,
    and abstraction. Let’s explore each of these concepts in detail.


    Encapsulation


    Encapsulation is the bundling of data (attributes) and methods that operate on
    the data into a single unit, known as a class. It also involves restricting direct
    access to some of an object’s components, which is a way of hiding the internal
    state of the object and only exposing a controlled interface.


    Here’s an example to illustrate encapsulation:


    public class Car {


    private String model;


    private int year;


    public Car(String model, int year) {


    this.model = model;


    this.year = year;


    }


    public String getModel() {


    return model;


    }


    public void setModel(String model) {


    this.model = model;


    }


    public int getYear() {


    return year;


    }


    public void setYear(int year) {


    this.year = year;


    }


    }


    In this example, the `Car` class encapsulates the `model` and `year` attributes.
    These attributes are marked as `private`, meaning they cannot be accessed directly
    from outside the class. Instead, we provide `public` getter and setter methods
    to access and modify these attributes. This encapsulation ensures that the internal
    state of the object is protected from unauthorized access and modification.


    Inheritance


    Inheritance is a mechanism that allows one class to inherit the properties and
    methods of another class. The class that inherits is called the subclass (or derived
    class), and the class being inherited from is called the superclass (or base class).
    Inheritance promotes code reusability and establishes a natural hierarchy between
    classes.


    Here’s an example of inheritance:


    public class Vehicle {


    private String brand;


    public Vehicle(String brand) {


    this.brand = brand;


    }


    public String getBrand() {


    return brand;


    }


    public void setBrand(String brand) {


    this.brand = brand;


    }


    public void start() {


    System.out.println(“The vehicle is starting.”);


    }


    }


    public class Car extends Vehicle {


    private int numDoors;


    public Car(String brand, int numDoors) {


    super(brand);


    this.numDoors = numDoors;


    }


    public int getNumDoors() {


    return numDoors;


    }


    public void setNumDoors(int numDoors) {


    this.numDoors = numDoors;


    }


    public void honk() {


    System.out.println(“The car is honking.”);


    }


    }


    In this example, the `Car` class inherits from the `Vehicle` class using the `extends`
    keyword. The `Car` class inherits the `brand` attribute and `start` method from
    the `Vehicle` class, while also adding its own `numDoors` attribute and `honk`
    method. This relationship allows the `Car` class to reuse the functionality of
    the `Vehicle` class while extending it with additional features.


    Polymorphism


    Polymorphism allows objects of different classes to be treated as objects of a
    common superclass. It enables a single method to operate on objects of different
    types, making code more flexible and extensible. There are two types of polymorphism
    in Java: compile-time (method overloading) and runtime (method overriding).


    Method Overloading


    Method overloading occurs when multiple methods in a class have the same name
    but different parameter lists. This allows methods to perform similar tasks with
    different inputs.


    public class MathUtils {


    public int add(int a, int b) {


    return a + b;


    }


    public double add(double a, double b) {


    return a + b;


    }


    }


    In this example, the `MathUtils` class has two `add` methods: one that takes two
    integers and another that takes two doubles. The appropriate method is selected
    based on the arguments provided at compile time.


    Method Overriding


    Method overriding occurs when a subclass provides a specific implementation for
    a method that is already defined in its superclass. This allows the subclass to
    modify or extend the behavior of the superclass method.


    public class Animal {


    public void makeSound() {


    System.out.println(“The animal makes a sound.”);


    }


    }


    public class Dog extends Animal {


    @Override


    public void makeSound() {


    System.out.println(“The dog barks.”);


    }


    }


    In this example, the `Dog` class overrides the `makeSound` method of the `Animal`
    class. When `makeSound` is called on a `Dog` object, the overridden method in
    the `Dog` class is executed, demonstrating runtime polymorphism.


    Abstraction


    Abstraction is the concept of hiding the complex implementation details of a system
    and exposing only the necessary features. In Java, abstraction is achieved using
    abstract classes and interfaces.


    Abstract Classes


    An abstract class is a class that cannot be instantiated and may contain abstract
    methods (methods without a body) that must be implemented by subclasses.


    public abstract class Shape {


    private String color;


    public Shape(String color) {


    this.color = color;


    }


    public String getColor() {


    return color;


    }


    public void setColor(String color) {


    this.color = color;


    }


    public abstract double calculateArea();


    }


    public class Circle extends Shape {


    private double radius;


    public Circle(String color, double radius) {


    super(color);


    this.radius = radius;


    }


    @Override


    public double calculateArea() {


    return Math.PI * radius * radius;


    }


    }


    In this example, the `Shape` class is abstract and contains an abstract method
    `calculateArea`. The `Circle` class extends `Shape` and provides an implementation
    for the `calculateArea` method.


    Interfaces


    An interface is a reference type in Java that is similar to a class but only contains
    abstract methods (by default) and constants. Interfaces are used to define a contract
    that implementing classes must fulfill.


    public interface Drawable {


    void draw();


    }


    public class Square implements Drawable {


    @Override


    public void draw() {


    System.out.println(“Drawing a square.”);


    }


    }


    In this example, the `Drawable` interface defines a `draw` method. The `Square`
    class implements the `Drawable` interface and provides an implementation for the
    `draw` method.


    Real-Life Scenarios


    Object-oriented programming concepts are widely used in real-life scenarios to
    design and develop software systems. Let’s explore a few examples to see how OOP
    principles can be applied.


    Example 1: Library Management System


    In a library management system, you can model different entities such as books,
    members, and loans using classes. For instance, you can create a `Book` class
    with attributes like `title`, `author`, and `ISBN`, and methods like `borrow`
    and `returnBook`. You can also create a `Member` class with attributes like `name`,
    `membershipId`, and `borrowedBooks`, and methods like `borrowBook` and `returnBook`.'
