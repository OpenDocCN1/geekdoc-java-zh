    Age must be 18 or older.\");\n        }\n    }\n}\n```\n\n在这个示例中，如果 `age` 参数小于\
    \ 18，`checkAge` 方法将抛出一个 `IllegalArgumentException`。该异常随后会在 `main` 方法中被捕获。\n\n\
    ### 使用 throws 声明异常\n\n"
