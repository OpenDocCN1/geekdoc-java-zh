    Reference data types, on the other hand, are used to refer to objects. They include
    classes, interfaces, and arrays. Unlike primitive data types, reference variables
    store addresses of objects in memory. For example, to declare a variable of type
    `String`, which is a class in Java, you would write:


    String myString = “Hello, Java!”;


    Arrays


    An array is a collection of variables of the same data type. It’s like a list
    of items that are stored in contiguous memory locations. You can declare an array
    by specifying the data type followed by square brackets:


    int[] myArray;


    You can also initialize an array at the time of declaration by specifying the
    size of the array or by providing the elements directly:


    int[] myArray = new int[5]; // an array of 5 integers


    int[] myArray = {1, 2, 3, 4, 5}; // an array with initial values


    Accessing elements of an array is done using indices, with the first element at
    index 0:


    int firstElement = myArray[0];


    int secondElement = myArray[1];


    String Manipulation


    Strings are sequences of characters and are one of the most commonly used data
    types in Java. The `String` class provides many methods for manipulating strings,
