    \n## 自定义异常\n除了使用 Java 内置异常外，你还可以创建自己的自定义异常。当你需要处理应用程序中的特定错误状况时，这非常有用。要创建自定义异常，只需扩展\
    \ `Exception` 类（或其任何子类）。这是一个示例：\n\n```java\npublic class Main {\n    public static\
