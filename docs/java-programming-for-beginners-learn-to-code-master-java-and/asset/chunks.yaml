    Example 1: Student Grades


    Suppose you’re writing a program to manage student grades. You can use an ArrayList
    to store the grades and calculate the average grade:


    import java.util.ArrayList;


    import java.util.List;


    public class Main {


    public static void main(String[] args) {


    List<Integer> grades = new ArrayList<>();


    grades.add(85);


    grades.add(90);


    grades.add(78);


    grades.add(92);


    int total = 0;


    for (int grade : grades) {


    total += grade;


    }


    double average = total / (double) grades.size();


    System.out.println(“Average grade: " + average);


    }


    }


    In this example, we use an ArrayList to store student grades and calculate the
    average grade by summing the grades and dividing by the number of grades.


    Example 2: Unique Usernames


    Suppose you’re writing a program that manages user registrations and ensures that
    usernames are unique. You can use a HashSet to store usernames and check for duplicates:


    import java.util.HashSet;


    import java.util.Set;


    public class Main {


    public static void main(String[] args) {


    Set<String> usernames = new HashSet<>();


    usernames.add(“john_doe”);


    usernames.add(“jane_smith”);


    usernames.add(“john_doe”); // Duplicate username


    if (usernames.contains(“john_doe”)) {


    System.out.println(“Username ‘john_doe’ is already taken.”);


    } else {


    usernames.add(“john_doe”);


    }


    System.out.println(“Usernames: " + usernames);


    }


    }


    In this example, we use a HashSet to store usernames and check if a username is
    already taken before adding it.


    Example 3: Inventory Management


    Suppose you’re writing an inventory management system for a store. You can use
    a HashMap to store product names and their quantities:


    import java.util.HashMap;


    import java.util.Map;


    public class Main {


    public static void main(String[] args) {


    Map<String, Integer> inventory = new HashMap<>();


    inventory.put(“Apples”, 50);


    inventory.put(“Bananas”, 30);


    inventory.put(“Oranges”, 20);


    // Sell some apples


    int applesSold = 10;


    inventory.put(“Apples”, inventory.get(“Apples”) - applesSold);


    System.out.println(“Inventory after sale: " + inventory);


    }


    }


    In this example, we use a HashMap to store the inventory of products and update
    the quantities when items are sold.


    Takeaways


    By understanding and using arrays and collections, you can efficiently manage
    and manipulate groups of related data in your Java programs. Arrays provide a
    simple way to store and access fixed-size


    collections of elements, while collections offer more flexibility and functionality
    for dynamic and complex data management.


    Keep practicing and experimenting with different arrays and collections to reinforce
    your understanding and improve your programming skills. With a solid grasp of
    these data structures, you’ll be well-equipped to handle a wide range of programming
    tasks and challenges in Java.


    # Chapter 8: Exception Handling


    Welcome to Chapter 8! We’ve journeyed through the land of Java, exploring everything
    from variables and loops to objects and collections. Now, let’s tackle one of
    the most crucial aspects of programming: making sure our programs can handle unexpected
    events gracefully. Imagine driving a car without knowing how to deal with a flat
    tire. That’s what programming without exception handling is like—sooner or later,
    something’s going to go wrong, and you’d better be prepared.


    Understanding Exceptions


    In Java, an exception is an event that disrupts the normal flow of the program.
    When an exception occurs, the program stops executing normally and jumps to a
    special block of code to handle the issue. Think of exceptions as Java’s way of
    throwing up a red flag and saying, “Hey, something went wrong here!”


    There are two main types of exceptions in Java:


    - Checked exceptions: These are exceptions that the compiler checks at compile-time.
    You must handle these exceptions using try-catch blocks or declare them in the
    method signature with the `throws` keyword.


    - Unchecked exceptions: These are exceptions that occur at runtime and are not
    checked by the compiler. They include subclasses of `RuntimeException` and `Error`.


    The most common exceptions you might encounter include:


    - `NullPointerException`: When you try to use an object reference that hasn’t
    been initialized.


    - `ArrayIndexOutOfBoundsException`: When you try to access an array element with
    an invalid index.


    - `ArithmeticException`: When an illegal arithmetic operation, like division by
    zero, is performed.


    - `IOException`: When an input or output operation fails or is interrupted.


    Handling Exceptions with try-catch


    The most common way to handle exceptions in Java is by using a try-catch block.
    The code that might throw an exception is placed inside the `try` block, and the
    `catch` block contains the code to handle the exception. Here’s the basic syntax:


    try {


    // code that might throw an exception


    } catch (ExceptionType e) {


    // code to handle the exception


    }


    Let’s see an example of handling an `ArithmeticException`:


    public class Main {


    public static void main(String[] args) {


    try {


    int result = 10 / 0; // This will throw an ArithmeticException


    } catch (ArithmeticException e) {


    System.out.println(“Cannot divide by zero!”);


    }


    }


    }


    In this example, the division operation inside the `try` block throws an `ArithmeticException`,
    which is then caught by the `catch` block. The message “Cannot divide by zero!”
    is printed to the console, and the program continues to run normally.


    Multiple catch Blocks


    Sometimes, a block of code might throw more than one type of exception. In such
    cases, you can use multiple `catch` blocks to handle different exceptions separately.
    Here’s an example:


    public class Main {


    public static void main(String[] args) {


    try {


    int[] numbers = {1, 2, 3};


    int result = numbers[5]; // This will throw an ArrayIndexOutOfBoundsException


    } catch (ArrayIndexOutOfBoundsException e) {


    System.out.println(“Array index is out of bounds!”);


    } catch (Exception e) {


    System.out.println(“An unexpected error occurred: " + e.getMessage());


    }


    }


    }


    In this example, the first `catch` block handles `ArrayIndexOutOfBoundsException`,
    and the second `catch` block handles any other type of exception that might occur.


    The finally Block


    Sometimes, you need to execute some code regardless of whether an exception was
    thrown or not. This is where the `finally` block comes in. The `finally` block
    is always executed after the `try` and `catch` blocks, even if an exception is
    thrown. It’s typically used for cleanup activities, such as closing files or releasing
    resources. Here’s an example:


    public class Main {


    public static void main(String[] args) {


    try {


    int result = 10 / 0; // This will throw an ArithmeticException


    } catch (ArithmeticException e) {


    System.out.println(“Cannot divide by zero!”);


    } finally {


    System.out.println(“This will always be executed.”);


    }


    }


    }


    In this example, the `finally` block prints “This will always be executed.” to
    the console, regardless of whether an exception was thrown or not.


    Throwing Exceptions


    In addition to catching exceptions, you can also throw exceptions manually using
    the `throw` keyword. This is useful when you want to signal that an error has
    occurred in your method. Here’s an example:


    public class Main {


    public static void main(String[] args) {


    try {


    checkAge(15); // This will throw an IllegalArgumentException


    } catch (IllegalArgumentException e) {


    System.out.println(“Caught an exception: " + e.getMessage());


    }


    }


    public static void checkAge(int age) {


    if (age < 18) {


    throw new IllegalArgumentException(“Age must be 18 or older.”);


    }


    }


    }


    In this example, the `checkAge` method throws an `IllegalArgumentException` if
    the `age` parameter is less than 18\. The exception is then caught in the `main`
    method.


