    \ 第 8 章：异常处理\n\n欢迎来到第 8 章！我们已经走过了 Java 的世界，探索了从变量、循环到对象和集合的所有内容。现在，让我们处理编程中最关键的方面之一：确保我们的程序能够优雅地处理意外事件。想象一下，开车时却不知道如何处理爆胎。这就是没有异常处理的程序所像的——早晚会出问题，你最好做好准备。\n\
    \n### 理解异常\n\n在 Java 中，异常是中断程序正常执行流的事件。当异常发生时，程序会停止正常执行并跳转到一个特殊的代码块来处理问题。将异常想象成\
    \ Java 举起红旗并说：“嘿，这里出问题了！”\n\nJava 中主要有两种类型的异常：\n\n-   **受检的异常 (Checked exceptions)**：这些是编译器在编译时检查的异常。你必须使用\
    \ `try-catch` 块来处理这些异常，或者在方法签名中使用 `throws` 关键字声明它们。\n-   **未检异常 (Unchecked exceptions)**：这些是在运行时发生且不经过编译器检查的异常。它们包括\
    \ `RuntimeException` 和 `Error` 的子类。\n\n你可能会遇到的最常见异常包括：\n\n- ``NullPointerException``：当你尝试使用一个未初始化的对象引用时。\n\
    - ``ArrayIndexOutOfBoundsException``：当你尝试使用无效索引访问数组元素时。\n- ``ArithmeticException``：当执行非法的算术操作（如除以零）时。\n\
    - ``IOException``：当输入或输出操作失败或被中断时。\n\n### 使用 try-catch 处理异常\n\n在 Java 中处理异常最常用的方法是使用\
    \ `try-catch` 块。将可能抛出异常的代码放在 `try` 块中，`catch` 块包含处理异常的代码。这里是基本语法：\n\n```java\n\
    try {\n    // 可能会抛出异常的代码\n} catch (ExceptionType e) {\n    // 处理异常的代码\n}\n```\n\
    \n让我们来看一个处理 `ArithmeticException` 的示例：\n\n```java\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        try {\n            int result = 10\
    \ / 0; // 这将抛出 ArithmeticException\n        } catch (ArithmeticException e) {\n\
    \            System.out.println(\"Cannot divide by zero!\");\n        }\n    }\n\
    }\n```\n\n在这个示例中，`try` 块中的除法操作抛出了 `ArithmeticException`，它被 `catch` 块捕获。控制台会打印出“Cannot\
    \ divide by zero!”。\n\n### 多个 catch 块\n\n有时，代码块可能会抛出多种类型的异常。在这种情况下，你可以使用多个 `catch`\
    \ 块来分别处理异常。这里有一个示例：\n\n```java\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        try {\n            int[] numbers = {1, 2, 3};\n           \
