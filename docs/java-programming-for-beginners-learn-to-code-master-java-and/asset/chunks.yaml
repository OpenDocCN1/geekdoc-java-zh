    \ it must declare the exception using the `throws` keyword in its method signature.\
    \ This informs the calling method that it needs to handle the exception. Here’s\
    \ an example:\n\n```java\nimport java.io.BufferedReader;\nimport java.io.FileReader;\n\
    import java.io.IOException;\n\npublic class Main {\n    public static void main(String[]\
