    how you can work with strings:


    String greeting = “Hello”;


    String name = “World”;


    String message = greeting + “, " + name + “!”;


    System.out.println(message);


    In this example, we concatenate (combine) the `greeting` and `name` variables
    to create a new string and print it to the console.


    Type Casting


    Sometimes, you might need to convert a variable from one data type to another.
    This process is called type casting. There are two types of type casting in Java:
