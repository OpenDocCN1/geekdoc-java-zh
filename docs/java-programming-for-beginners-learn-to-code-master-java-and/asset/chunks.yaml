    # 第 6 章：面向对象编程 (OOP) 概念\n\n欢迎来到第 6 章！到目前，你已经掌握了 Java 的基础知识，包括语法、变量、数据类型、控制流和方法。现在是时候深入探索\
    \ Java 最强大的特性之一：面向对象编程 (OOP)。OOP 是一种使用“对象”来设计应用程序和程序的编程范式。将其想象为将你的代码组织成一组相互连接的微型程序，这些程序共同工作以完成任务。\n\
    \n## 理解 OOP\n\nOOP 的核心是将现实世界的实体建模为具有状态和行为的软件对象。状态由对象的属性（字段或属性）表示，行为由对象的方法表示。OOP\
    \ 的四个主要原则是封装、继承、多态和抽象。让我们详细探索每一个概念。\n\n## 封装\n\n封装是将数据（属性）和操作这些数据的方法封装到单个单元中，该单元被称为\
    \ `class`（类）。它还涉及限制对对象某些组件的直接访问，这是隐藏对象内部状态并只暴露受控接口的方法。\n\n这里是一个说明封装的示例：\n\n```java\n\
    public class Car {\n    private String model;\n    private int year;\n\n    public\
    \ Car(String model, int year) {\n        this.model = model;\n        this.year\
    \ = year;\n    }\n\n    public String getModel() {\n        return model;\n  \
    \  }\n\n    public void setModel(String model) {\n        this.model = model;\n\
    \    }\n\n    public int getYear() {\n        return year;\n    }\n\n    public\
    \ void setYear(int year) {\n        this.year = year;\n    }\n}\n```\n\n在这个示例中，`Car`\
    \ 类封装了 `model` 和 `year` 属性。这些属性被标记为 `private`，意味着它们不能从类外部直接访问。相反，我们提供了 `public`\
    \ 的 getter 和 setter 方法来访问和修改这些属性。这种封装确保了对象的内部状态免受未经授权的访问和修改。\n\n## 继承\n\n继承是一种允许一个类继承另一个类的属性和方法的机制。继承的类被称为\
    \ `subclass`（子类或派生类），被继承的类被称为 `superclass`（父类或基类）。继承促进了代码的重用，并在类之间建立了自然的层级结构。\n\
    \n这里是一个继承的示例：\n\n```java\npublic class Vehicle {\n    private String brand;\n\n\
    \    public Vehicle(String brand) {\n        this.brand = brand;\n    }\n\n  \
    \  public String getBrand() {\n        return brand;\n    }\n\n    public void\
    \ setBrand(String brand) {\n        this.brand = brand;\n    }\n\n    public void\
    \ start() {\n        System.out.println(\"The vehicle is starting.\");\n    }\n\
    }\n\npublic class Car extends Vehicle {\n    private int numDoors;\n\n    public\
    \ Car(String brand, int numDoors) {\n        super(brand);\n        this.numDoors\
    \ = numDoors;\n    }\n\n    public int getNumDoors() {\n        return numDoors;\n\
    \    }\n\n    public void setNumDoors(int numDoors) {\n        this.numDoors =\
    \ numDoors;\n    }\n\n    public void honk() {\n        System.out.println(\"\
    The car is honking.\");\n    }\n}\n```\n\n在这个示例中，`Car` 类使用 `extends` 关键字继承自 `Vehicle`\
    \ 类。`Car` 类继承了 `Vehicle` 类的 `brand` 属性和 `start` 方法，同时也增加了自己的 `numDoors` 属性和 `honk`\
    \ 方法。这种关系允许 `Car` 类在重用 `Vehicle` 类功能的同时通过额外功能对其进行扩展。\n\n## 多态\n\n多态允许不同类的对象被视为共同父类的对象。它允许单个方法操作不同类型的对象，使代码更具灵活性和可扩展性。Java\
    \ 中有两种多态态：编译时多态（方法重载）和运行时多态（方法重写）。\n\n### 方法重载\n\n方法重载发生在一个类中的多个方法具有相同名称但具有不同的参数列表时。这允许方法根据不同的输入执行相似的任务。\n\
    \n```java\npublic class MathUtils {\n    public int add(int a, int b) {\n    \
    \    return a + b;\n    }\n\n    public double add(double a, double b) {\n   \
    \     return a + b;\n    }\n}\n```\n\n在这个示例中，`MathUtils` 类有两个 `add` 方法：一个接收两个整数，另一个接收两个双点数。系统将根据在编译时提供的参数来选择合适的方法。\n\
    \n### 方法重写\n\n方法重写发生在子类对其在父类中已经定义的方法提供了特定实现时。这允许子类修改或扩展父类方法的行为。\n\n```java\npublic\
    \ class Animal {\n    public void makeSound() {\n        System.out.println(\"\
    The animal makes a sound.\");\n    }\n}\n\npublic class Dog extends Animal {\n\
    \    @Override\n    public void makeSound() {\n        System.out.println(\"The\
    \ dog barks.\");\n    }\n}\n```\n\n在这个示例中，`Dog` 类重写了 `Animal` 类的 `makeSound` 方法。当调用\
    \ Dog 对象时，在 Dog 类中被重写的方法将被执行。\n\n## 抽象\n\n抽象是隐藏系统实现细节并只暴露必要特征的概念。在 Java 中，抽象通过抽象类和接口实现。\n\
    \n### 抽象类\n\n抽象类是无法实例化的类，它可以包含抽象方法（没有体的方法），这些方法必须由子类实现。\n\n```java\npublic abstract\
    \ class Shape {\n    private String color;\n\n    public Shape(String color) {\n\
    \        this.color = color;\n    }\n\n    public String getColor() {\n      \
    \  return color;\n    }\n\n    public void setColor(String color) {\n        this.color\
    \ = color;\n    }\n\n    public abstract double calculateArea();\n}\n\npublic\
    \ class Circle extends Shape {\n    private double radius;\n\n    public Circle(String\
    \ color, double radius) {\n        super(color);\n        this.radius = radius;\n\
    \    }\n\n    @Override\n    public double calculateArea() {\n        return Math.PI\
    \ * radius * radius;\n    }\n}\n```\n\n在这个示例中，`Shape` 类是抽象的，并且包含一个抽象方法 `calculateArea`。`Circle`\
    \ 类继承自 `Shape` 并为 `calculateArea` 方法提供了实现。\n\n### 接口\n\n接口是 Java 中的一种引用类型，类似于类，但只包含抽象方法（默认）和常量。接口用于定义实现类必须遵守的合约。\n\
    \n```java\npublic interface Drawable {\n    void draw();\n}\n\npublic class Square\
    \ implements Drawable {\n    @Override\n    public void draw() {\n        System.out.println(\"\
    Drawing a square.\");\n    }\n}\n```\n\n在这个示例中，`Drawable` 接口定义了一个 `draw` 方法。`Square`\
    \ 类实现了 `Drawable` 接口并提供了 `draw` 方法的实现。\n\n## 现实场景\n\n面向对象编程概念广泛应用于现实场景，以设计和开发软件系统。让我们通过几个示例来看看如何应用\
    \ OOP 原则。\n\n### 示例 1：图书馆管理系统\n\n你可以用类对书籍、成员和贷款等不同实体进行建模。例如，你可以创建一个 `Book` 类，具有\
    \ `title`、`author` 和 `ISBN` 等属性，以及 `borrow` 和 `returnBook` 方法。你还可以创建一个 `Member`\
    \ 类，具有 `name`、`membershipId` 和 `borrowedBooks` 等属性，以及 `borrowBook` 和 `returnBook`\
    \ 方法。\n\n"
- fmt: "\nBy using inheritance, you can create specialized classes for different types\
    \ of members, such as `Student` and `Teacher`, each with additional attributes\
    \ and methods specific to their roles. Polymorphism allows you to handle different\
    \ types of members uniformly, while encapsulation ensures that the internal state\
    \ of objects is protected.\n\n## Example 2: E-Commerce System\n\nIn an e-commerce\
    \ system, you can use classes to model entities like products, customers, orders,\
    \ and payments. For example, you can create a `Product` class with attributes\
    \ like `name`, `price`, and `stock`, and methods like `addToCart` and `removeFromCart`.\
    \ You can also create an `Order` class with attributes like `orderId`, `customer`,\
    \ and `orderItems`, and methods like `placeOrder` and `cancelOrder`.\n\nInheritance\
    \ allows you to create different types of products, such as `Electronics` and\
    \ `Clothing`, each with additional attributes and methods. Interfaces can be used\
    \ to define contracts for payment processing, with different implementations for\
    \ credit card payments, PayPal payments, and more.\n\n## Takeaways\n\nBy understanding\
    \ and applying the principles of object-oriented programming, you can design and\
    \ develop software that is modular, reusable, and easier to maintain. OOP concepts\
    \ like encapsulation, inheritance, polymorphism, and abstraction help you model\
    \ real-world entities and their interactions in a structured and organized way.\n\
    \nKeep practicing and experimenting with these concepts to reinforce your understanding\
    \ and improve your programming skills. With a solid grasp of OOP principles, you’ll\
    \ be well-equipped to tackle more complex projects and challenges in the world\
    \ of Java programming.\n\n# Chapter 7: Working with Arrays and Collections\n\n\
    Welcome to Chapter 7! Now that you’ve got a solid understanding of Java’s object-oriented\
    \ programming principles, it’s time to tackle another crucial aspect of programming:\
    \ handling multiple pieces of data efficiently. Enter arrays and collections.\
    \ Think of them as tools for organizing, managing, and manipulating groups of\
    \ related items in your programs. Arrays and collections are like your digital\
    \ filing cabinets, helping you keep everything neat, tidy, and accessible.\n\n\
    ## Understanding Arrays\n\nArrays are the most basic data structure in Java. They\
    \ are fixed-size, ordered collections of elements of the same type. Imagine you\
    \ have a row of lockers, each labeled with a number and capable of holding one\
    \ item. That’s essentially what an array is—a series of containers (elements)\
    \ that can store data, each accessed by an index.\n\nHere’s how you declare and\
    \ initialize an array in Java:\n\n```java\nint[] numbers = new int[5]; // Declares\
    \ an array of integers with 5 elements\n```\n\nYou can also initialize an array\
    \ with values at the time of declaration:\n\n```java\nint[] numbers = {1, 2, 3,\
    \ 4, 5}; // Declares and initializes an array with 5 elements\n```\n\n### Accessing\
    \ and Modifying Array Elements\n\nYou access elements of an array using their\
    \ index, which starts at 0. Here’s an example of how to access and modify elements\
    \ in an array:\n\n```java\nint firstNumber = numbers[0]; // Accesses the first\
    \ element\nnumbers[1] = 10; // Modifies the second element\n```\n\nYou can also\
    \ loop through an array to access or modify its elements. For example, let’s print\
    \ all the elements of the `numbers` array:\n\n```java\nfor (int i = 0; i < numbers.length;\
    \ i++) {\n    System.out.println(numbers[i]);\n}\n```\n\nThis `for` loop iterates\
    \ over each element of the array and prints it to the console.\n\n### Multidimensional\
    \ Arrays\n\nJava also supports multidimensional arrays, which are arrays of arrays.\
    \ These are useful for representing data in a grid or table format. Here’s how\
    \ you declare and initialize a two-dimensional array:\n\n```java\nint[][] matrix\
    \ = {\n    {1, 2, 3},\n    {4, 5, 6},\n    {7, 8, 9}\n};\n```\n\nYou can access\
    \ elements in a two-dimensional array using two indices:\n\n```java\nint value\
    \ = matrix[1][2]; // Accesses the element in the second row, third column (value\
    \ is 6)\n```\n\n## Working with Collections\n\nWhile arrays are useful, they come\
    \ with limitations, such as fixed size. This is where collections come in. Collections\
    \ are part of the Java Collections Framework, which provides a set of classes\
    \ and interfaces for storing and manipulating groups of data more flexibly and\
    \ efficiently.\n\nThe main interfaces in the Java Collections Framework are `List`,\
    \ `Set`, and `Map`. Let’s explore each of these in detail.\n\n### The List Interface\n\
    \nA `List` is an ordered collection that allows duplicate elements. It’s like\
    \ an array, but with dynamic sizing and additional functionality. The most commonly\
    \ used implementations of the `List` interface are `ArrayList` and `LinkedList`.\n\
    \nHere’s an example of how to use an `ArrayList`:\n\n```java\nimport java.util.ArrayList;\n\
    import java.util.List;\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        List<String> fruits = new ArrayList<>();\n        // Adding\
    \ elements\n        fruits.add(\"Apple\");\n        fruits.add(\"Banana\");\n\
    \        fruits.add(\"Orange\");\n        // Accessing elements\n        String\
    \ firstFruit = fruits.get(0); // Accesses the first element\n        System.out.println(\"\
    First fruit: \" + firstFruit);\n        // Iterating over elements\n        for\
    \ (String fruit : fruits) {\n            System.out.println(fruit);\n        }\n\
    \        // Modifying elements\n        fruits.set(1, \"Mango\"); // Changes the\
    \ second element to Mango\n        // Removing elements\n        fruits.remove(0);\
    \ // Removes the first element (Apple)\n        System.out.println(\"Fruits after\
    \ modifications: \" + fruits);\n    }\n}\n```\n\nIn this example, we use an `ArrayList`\
    \ to store a list of fruits. We add elements, access and modify them, and iterate\
    \ over the list to print each element.\n\n### The Set Interface\n\nA `Set` is\
    \ an unordered collection that does not allow duplicate elements. It’s useful\
    \ when you need to store unique items. The most commonly used implementations\
    \ of the `Set` interface are `HashSet`, `LinkedHashSet`, and `TreeSet`.\n\nHere’s\
    \ an example of how to use a `HashSet`:\n\n```java\nimport java.util.HashSet;\n\
    import java.util.Set;\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Set<String> uniqueFruits = new HashSet<>();\n        // Adding\
    \ elements\n        uniqueFruits.add(\"Apple\");\n        uniqueFruits.add(\"\
    Banana\");\n        uniqueFruits.add(\"Orange\");\n        uniqueFruits.add(\"\
    Apple\"); // Duplicate element\n        // Iterating over elements\n        for\
    \ (String fruit : uniqueFruits) {\n            System.out.println(fruit);\n  \
    \      }\n        // Checking if a Set contains an element\n        boolean hasBanana\
    \ = uniqueFruits.contains(\"Banana\");\n        System.out.println(\"Contains\
    \ Banana: \" + hasBanana);\n        // Removing elements\n        uniqueFruits.remove(\"\
    Orange\");\n        System.out.println(\"Fruits after modifications: \" + uniqueFruits);\n\
    \    }\n}\n```\n\nIn this example, we use a `HashSet` to store a set of unique\
    \ fruits. Note that adding a duplicate element (`Apple`) does not affect the `Set`.\n\
    \n### The Map Interface\n\nA `Map` is a collection that maps keys to values, with\
    \ no duplicate keys allowed. It’s useful for associating unique keys with specific\
    \ values. The most commonly used implementations of the `Map` interface are `HashMap`,\
    \ `LinkedHashMap`, and `TreeMap`.\n\nHere’s an example of how to use a `HashMap`:\n\
    \n```java\nimport java.util.HashMap;\nimport java.util.Map;\n\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        Map<String, Integer>\
    \ fruitPrices = new HashMap<>();\n        // Adding key-value pairs\n        fruitPrices.put(\"\
    Apple\", 150);\n        fruitPrices.put(\"Banana\", 50);\n        fruitPrices.put(\"\
    Orange\", 100);\n        // Accessing values by key\n        int applePrice =\
    \ fruitPrices.get(\"Apple\");\n        System.out.println(\"Price of Apple: \"\
    \ + applePrice);\n        // Iterating over key-value pairs\n        for (Map.Entry<String,\
    \ Integer> entry : fruitPrices.entrySet()) {\n            System.out.println(entry.getKey()\
    \ + \": \" + entry.getValue());\n        }\n        // Modifying values\n    \
    \    fruitPrices.put(\"Banana\", 60); // Changes the price of Banana to 60\n \
    \       // Removing key-value pairs\n        fruitPrices.remove(\"Orange\");\n\
    \        System.out.println(\"Fruit prices after modifications: \" + fruitPrices);\n\
    \    }\n}\n```\n\nIn this example, we use a `HashMap` to store fruit prices. We\
    \ add key-value pairs, access values by key, iterate over the entries, and modify\
    \ and remove elements.\n\n## Real-Life Scenarios\n"
