  trans: "\n\n# 第 4 章：控制流 - 条件语句与循环\n\n欢迎来到第 4 章！现在你已经熟悉了 Java 语法、变量和数据类型，是时候为你的程序引入一些决策能力了。将这一章看作是教你的\
    \ Java 代码如何独立思考。我们将深入研究控制流，包括条件语句和循环。这些概念将允许你的程序做出决策并重复操作，使它们变得更加强大和灵活。\n\n##\
    \ 理解控制流\n\n在编程中，控制流是各个语句、指令或函数调用执行或评估的顺序。换句话说，控制流决定了你的程序在运行时所遵循的路径。如果没有控制流语句，你的代码将简单地从上到下执行，这会非常局限。通过使用条件语句和循环，你可以控制程序的流，使其更具动态且响应迅速。\n\
    \n## 条件语句：if, else 和 switch\n\n让我们从条件语句开始。条件语句是允许程序根据条件的真与假来执行某些代码块的语句。Java 中最常见的条件语句是\
    \ `if`、`else if` 和 `else`。\n\n### if 语句\n\n`if` 语句评估一个条件（布尔表达式），如果条件为真，则执行一个代码块。这里是基本语法：\n\
    \n```java\nif (condition) {\n    // 如果条件为真则执行的代码\n}\n```\n\n例如，假设你想检查一个数字是否为正数：\n\
    \n```java\nint number = 10;\nif (number > 0) {\n    System.out.println(\"The number\
    \ is positive.\");\n}\n```\n\n在这个示例中，条件 `number > 0` 为真，因此执行了 `if` 块内部的代码，并在控制台打印消息“The\
    \ number is positive.”。\n\n### else 语句\n\n`else` 语句用于在 `if` 语句中的条件为假时执行一个代码块。这里是语法：\n\
    \n```java\nif (condition) {\n    // 如果条件为真则执行的代码\n} else {\n    // 如果条件为假则执行的代码\n\
    }\n```\n\n例如，让我们检查一个数字是正数还是负数：\n\n```java\nint number = -5;\nif (number > 0) {\n\
    \    System.out.println(\"The number is positive.\");\n} else {\n    System.out.println(\"\
    The number is negative.\");\n}\n```\n\n在这种情况下，条件 `number > 0` 为假，因此执行了 `else`\
    \ 块内部的代码，并在控制台打印消息“The number is negative.”。\n\n### else if 语句\n\n`else if` 语句用于在第一个条件为假时指定一个新的新条件进行测试。你可以链接多个\
    \ `else if` 语句来检查多个条件。这里是语法：\n\n```java\nif (condition1) {\n    // 如果 condition1\
    \ 为真则执行的代码\n} else if (condition2) {\n    // 如果 condition2 为真则执行的代码\n} else {\n\
    \    // 如果所有条件为假则执行的代码\n}\n```\n\n例如，让我们检查一个数字是正数、负数还是零：\n\n```java\nint number\
    \ = 0;\nif (number > 0) {\n    System.out.println(\"The number is positive.\"\
    );\n} else if (number < 0) {\n    System.out.println(\"The number is negative.\"\
    );\n} else {\n    System.out.println(\"The number is zero.\");\n}\n```\n\n在这个示例中，前两个条件均为假，因此执行了\
    \ `else` 块内部的代码，并在控制台打印消息“The number is zero.”。\n\n### switch 语句\n\n`switch` 语句是另一种根据变量的值来控制程序流向的方法。当你有多个条件需要检查时，它特别有用，并且可以使你的代码比使用多个\
    \ `if-else` 语句更具读性。这里是基本语法：\n\n```java\nswitch (variable) {\n    case value1:\n\
    \        // 如果变量等于 value1 则执行的代码\n        break;\n    case value2:\n        //\
    \ 如果变量等于 value2 则执行的代码\n        break;\n    // 更多 cases…\n    default:\n     \
    \   // 如果没有一个 case 匹配，则执行的代码\n}\n```\n\n例如，让我们使用 `switch` 语句根据整数值来确定星期是几几：\n\n\
    ```java\nint day = 3;\nswitch (day) {\n    case 1:\n        System.out.println(\"\
    Sunday\");\n        break;\n    case 2:\n        System.out.println(\"Monday\"\
    );\n        break;\n    case 3:\n        System.out.println(\"Tuesday\");\n  \
    \      break;\n    case 4:\n        System.out.println(\"Wednesday\");\n     \
    \   break;\n    case 5:\n        System.out.println(\"Thursday\");\n        break;\n\
    \    case 6:\n        System.out.println(\"Friday\");\n        break;\n    case\
    \ 7:\n        System.out.println(\"Saturday\");\n        break;\n    default:\n\
    \        System.out.println(\"Invalid day\");\n        break;\n}\n```\n\n在这个示例中，变量\
    \ `day` 等于 3，因此执行了 `case 3` 块内部的代码，并在控制台打印消息“Tuesday”。\n\n## 循环：for, while 和 do-while\n\
    \n循环用于根据条件重复执行一个代码块。常见的循环有 `for`、`while` 和 `do-while`。\n\n### for 循环\n\n`for`\
    \ 循环用于在已知执行次数的情况下重复执行代码块。它根据条件执行。这里是基本语法：\n\n```java\nfor (initialization; condition;\
    \ update) {\n    // 循环执行的代码\n}\n```\n\n例如，让我们让一段代码打印 5 次：\n\n```java\nfor (int\
    \ i = 0; i < 5; i++) {\n    System.out.println(i);\n}\n```\n\n### while 循环\n\n\
    `while` 循环在条件为真时重复执行代码块。它通常用于在你不知道具体执行次数的情况下。这里是语法：\n\n```java\nwhile (condition)\
    \ {\n    // 循环执行的代码\n    update;\n}\n```\n\n例如，让我们让代码打印 5 次：\n\n```java\nint i\
    \ = 0;\nwhile (i < 5) {\n    System.out.println(i);\n    i++;\n}\n```\n\n### do-while\
    \ 循环\n\n`do-while` 循环与 `while` 循环类似，但它保证代码块至少执行一次，即使条件初始为假。这里是语法：\n\n```java\n\
    do {\n    // 执行的代码\n} while (condition);\n```\n\n例如，让我们让代码打印 5 次：\n\n```java\n\
    int i = 0;\ndo {\n    System.out.println(i);\n    i++;\n} while (i < 5);\n```\n\
    \n## break 和 continue\n\n`break` 和 `continue` 语句用于控制循环的流。`break` 语句用于提前退出循环，而\
    \ `continue` 语句跳过当前迭代的剩余代码并进入下一次迭代。\n\n### break\n\n例如，让我们使用 `break` 语句在满足某些条件时退出循环：\n\
    \n```java\nfor (int i = 1; i <= 10; i++) {\n    if (i == 5) {\n        break;\n\
    \    }\n    System.out.println(i);\n}\n```\n\n在这个示例中，循环打印了 1 到 4。当 `i` 等于 5 时，执行了\
    \ `break` 语句，循环终止。\n\n### continue\n\n现在，让我们使用 `continue` 语句在满足某些条件时跳过当前迭代：\n\n\
    ```java\nfor (int i = 1; i <= 10; i++) {\n    if (i == 5) {\n        continue;\n\
    \    }\n    System.out.println(i);\n}\n```\n\n在这个示例中，循环打印了 1 到 10 的数字，但除了 5。当\
    \ `i` 等于 5 时，执行了 `continue` 语句，循环进入下一次迭代而不打印 5。\n\n## 现实场景\n\n控制流语句对于编写能够处理现实场景的程序至关重要。例如，考虑一个检查温度并根据数值提供建议的简单程序：\n\
    \n```java\nint temperature = 25;\nif (temperature > 30) {\n    System.out.println(\"\
    It’s hot outside! Stay hydrated.\");\n} else if (temperature >= 20 && temperature\
    \ <= 30) {\n    System.out.println(\"The weather is nice and warm.\");\n} else\
    \ {\n    System.out.println(\"It’s cold outside! Dress warmly.\");\n}\n```\n\n"
