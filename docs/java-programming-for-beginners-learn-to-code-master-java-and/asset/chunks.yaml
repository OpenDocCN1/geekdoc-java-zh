  trans: "\n在本示例中，程序使用 `if`、`else if` 和 `else` 语句根据温度提供不同的消息。\n\n### 核心要点\n\n好了，让我们用本章的一些核心要点结束吧：\n\
    \n- 控制流决定了程序在运行时所经过的路径。\n- 条件语句（`if`、`else if`、`else` 和 `switch`）允许你的程序根据条件的真假值来执行代码块。\n\
    - 循环（`for`、`while` 和 `do-while`）允许你的程序根据条件重复执行代码块。\n- `break` 和 `continue` 语句用于控制循环的流。\n\
    - 理解控制流对于编写动态且响应迅速的程序至关重要。\n\n通过掌握条件语句和循环，你正在赋予你的 Java 程序做出决策和执行重复性任务的能力。这些技能是编写高效、良好代码的基础。继续练习并尝试不同的场景，以加深你的的理解。\n\
    \n在下一章中，我们将探索函数和方法，它们将帮助你将代码组织为可复且模块化的组件。\n\n# 第 5 章：函数与方法\n\n欢迎来到第 5 章！现在你已经熟悉了\
    \ Java 语法、变量、数据类型和控制流，是时候通过学习函数和方法将你的编程水平提高一个层次了。这些是本质工具，允许你将代码组织成可复用、模块化的单元，使其更容易阅读、维护和调试。将函数和方法想象成你编程咒书中的魔法咒——它们可以执行任务、解决问题，并让你的代码更高效。\n\
    \n## 理解函数和方法\n\n在 Java 中，“函数”（function）和“方法”（method）这两个术通常互用，但它们存在细微的区别。函数是执行特定任务的代码块，而方法是属于类的函数。由于\
    \ Java 是一种面向对象的编程语言，我们主要使用方法。然而，为了简单起见，我们在本章将通用使用这两个术。\n\n## 为什么要使用函数和方法？\n\n\
    想象你正在编写一个执行一系列任务的程序，例如计算不同形状的面积、处理用户输入或显示消息。如果没有函数和方法，你的代码将是一长串语句，难以管理和理解。通过将代码分解为更小的、可复用的单元（函数和方法），你可以：\n\
    \n- 通过将复杂问题分解为更小、易于管理的任务来简化问题。\n- 通过重用函数和方法来避免重复代码。\n- 通过逻辑化组织代码来提高可读性和可维护性。\n\
    - 通过将错误隔离在特定的函数或方法中来使调试变得更容易。\n\n## 定义和调用方法\n\n让我们从定义和调用方法的基础开始。以下是在 Java 中定义方法的通用通用语法：\n\
    \n```\naccessModifier returnType methodName(parameters) {\n    // method body\n\
    }\n```\n\n让我们来拆解它：\n\n- `accessModifier`（访问修饰符）：指定方法的可见性（例如 `public`、`private`、`protected`）。\n\
    - `returnType`（返回值）：方法返回的值类型（例如 `int`、`String`、`void`）。如果方法不返回值，请使用 `void`。\n\
    - `methodName`：方法的名称。\n- `parameters`：用逗号分隔的输入参数列表（可选）。\n\n这是一个打印问候消息的简单方法示例：\n\
    \n```java\npublic void printGreeting() {\n    System.out.println(\"Hello, welcome\
    \ to Java programming!\");\n}\n```\n\n要调用此方法，只需使用它的名称并跟上括号：\n\n```java\nprintGreeting();\n\
    ```\n\n## 方法参数和返回值\n\n方法可以接受输入参数并返回值，允许它们执行更复杂的任务。例如，让我们创建一个计算两个整数之和的方法：\n\n```java\n\
    public int sum(int a, int b) {\n    return a + b;\n}\n```\n\n在这个示例中，`sum` 方法接收两个整数参数（`a`\
    \ 和 `b`）并返回它们的和。要调用此方法并将结果存储在变量中，你可以写：\n\n```java\nint result = sum(5, 3);\nSystem.out.println(\"\
    The sum is: \" + result);\n```\n\n## 方法重载\n\n方法重载是 Java 的一项特性，允许你定义具有相同名称但不同参数列表的多个方法。当你想要对不同类型或数量的输入执行相似任务时这非常有用。这里是方法重载的示例：\n\
    \n```java\npublic int sum(int a, int b) {\n    return a + b;\n}\n\npublic double\
    \ sum(double a, double b) {\n    return a + b;\n}\n\npublic int sum(int a, int\
    \ b, int c) {\n    return a + b + c;\n}\n```\n\n在这个示例中，我们有三个 `sum` 方法：一个接收两个整数，一个接收两个双精度点数，一个接收三个整数。Java\
    \ 将根据你提供的参数自动选择合适的方法。\n\n## 方法递归\n\n递归是一种强大的编程技术，其中方法通过调用自己来解决问题。它通常用于可以分解为更小、相似的子任务的任务。然而，递归可能很难处理，如果处理不当，可能会导致死循环。这里有一个计算数字阶的递归方法的简单示例：\n\
    \n```java\npublic int factorial(int n) {\n    if (n <= 1) {\n        return 1;\n\
    \    } else {\n        return n * factorial(n - 1);\n    }\n}\n```\n\n在这个示例中，`factorial`\
    \ 方法使用值 `n - 1` 调用自身，直到 `n` 小于或等于 1。\n\n## 实际场景\n\n函数和方法在实际场景中非常有用。让我们探索一些示例看看它们如何简化你的代码。\n\
    \n### 示例 1：温度转换\n\n假设你正在编写一个在摄氏和华氏之间转换温度的程序。与其多次编写转换公式，不如创建方法：\n\n```java\npublic\
    \ double celsiusToFahrenheit(double celsius) {\n    return (celsius * 9 / 5) +\
    \ 32;\n}\n\npublic double fahrenheitToCelsius(double fahrenheit) {\n    return\
    \ (fahrenheit - 32) * 5 / 9;\n}\n```\n\n现在，你可以通过调用这些方法轻松转换温度：\n\n```java\ndouble\
    \ tempC = 25.0;\ndouble tempF = celsiusToFahrenheit(tempC);\nSystem.out.println(tempC\
    \ + \"°C is \" + tempF + \"°F\");\n```\n\n### 示例 2：质数\n\n创建一个检查数字是否为质数的方法。质数是大于\
    \ 1 且除 1 自身外没有其他因数的数：\n\n```java\npublic boolean isPrime(int number) {\n    if\
    \ (number <= 1) {\n        return false;\n    }\n    for (int i = 2; i <= Math.sqrt(number);\
    \ i++) {\n        if (number % i == 0) {\n            return false;\n        }\n\
    \    }\n    return true;\n}\n```\n\n你可以使用这个方法检查一个数字是否为质数：\n\n```java\nint num\
    \ = 17;\nif (isPrime(num)) {\n    System.out.println(num + \" 是质数.\");\n} else\
    \ {\n    System.out.println(num + \" 不是质数.\");\n}\n```\n\n### 示例 3：寻找数组中的最大值\n\
    \n让我们写一个查找整数数组中最大值的方法：\n\n```java\npublic int findMax(int[] array) {\n    int\
    \ max = array[0];\n    for (int i = 1; i < array.length; i++) {\n        if (array[i]\
    \ > max) {\n            max = array[i];\n        }\n    }\n    return max;\n}\n\
    ```\n\n你可以使用这个方法找到数组中的最大值：\n\n```java\nint[] numbers = {3, 5, 7, 2, 8};\nint maxValue\
    \ = findMax(numbers);\nSystem.out.println(\"最大值是: \" + maxValue);\n```\n"
