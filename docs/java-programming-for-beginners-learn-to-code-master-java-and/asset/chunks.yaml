    BufferedReader reader = new BufferedReader(new FileReader(fileName));


    String line;


    while ((line = reader.readLine()) != null) {


    System.out.println(line);


    }


    reader.close();


    } catch (IOException e) {


    System.out.println(“Error reading file: " + e.getMessage());


    }


    }


    }


    Example 2: User Input Validation


    When dealing with user input, it’s important to validate the input and handle
    any invalid data gracefully. Here’s an example of a program that prompts the user
    for a number and handles invalid input using exception handling:


    import java.util.InputMismatchException;


    import java.util.Scanner;


    public class Main {


    public static void main(String[] args) {


    Scanner scanner = new Scanner(System.in);


    System.out.print(“Enter a number: “);


    try {


    int number = scanner.nextInt();


    System.out.println(“You entered: " + number);


    } catch (InputMismatchException e) {


    System.out.println(“Invalid input! Please enter a valid number.”);


    }


    }


    }


    Example 3: Network Operations


    When writing programs that involve network operations, such as connecting to a
    server or downloading data, it’s important to handle potential errors like connection
    timeouts or unreachable hosts. Here’s an example:


    import java.io.IOException;


    import java.net.HttpURLConnection;


    import java.net.URL;


    public class Main {


    public static void main(String[] args) {


    String urlString = “http://example.com”;


    try {


    URL url = new URL(urlString);


    HttpURLConnection connection = (HttpURLConnection) url.openConnection();


    connection.setRequestMethod(“GET”);


    int responseCode = connection.getResponseCode();


    System.out.println(“Response Code: " + responseCode);


    } catch (IOException e) {


    System.out.println(“Network error: " + e.getMessage());


    }


    }


    }


    Takeaways


    By mastering exception handling, you can write more robust and reliable Java programs
    that gracefully handle


    errors and unexpected events. Exception handling allows you to manage and respond
    to runtime anomalies, ensuring your applications remain stable and user-friendly.


    Keep practicing and experimenting with different exception handling techniques
    to reinforce your understanding and improve your programming skills. With a solid
    grasp of exception handling, you’ll be well-equipped to build resilient and fault-tolerant
    Java applications.


    # Chapter 9: Working with Files and I/O


    Welcome to Chapter 9! By now, you’ve become quite the Java aficionado, tackling
    everything from object-oriented programming to exception handling. Now it’s time
    to delve into a topic that’s essential for any real-world application: working
    with files and input/output (I/O). Imagine writing a fantastic piece of software
    that can’t save data or read from a file—pretty limiting, right? This chapter
    will teach you how to handle files and perform I/O operations in Java, making
    your programs more versatile and functional.


    Understanding Java I/O


    Java provides a robust and flexible I/O framework that allows you to read from
    and write to various data sources, such as files, network connections, and even
    the console. The java.io package contains all the necessary classes and interfaces
    for handling I/O operations. At the heart of Java’s I/O system are streams, which
    are sequences of data. There are two main types of streams: byte streams and character
    streams.


    Byte Streams vs. Character Streams


    Byte streams handle raw binary data and are useful for reading and writing binary
    files like images or executable files. They use the InputStream and OutputStream
    classes and their subclasses. Character streams, on the other hand, handle text
    data and are designed for reading and writing characters. They use the Reader
    and Writer classes and their subclasses.


    Let’s start with some basic file operations, focusing on both byte streams and
    character streams to give you a well-rounded understanding.


    Reading from a File


    Reading data from a file is a common task, and Java makes it relatively straightforward.
    Let’s start with an example using byte streams to read a file:


    import java.io.FileInputStream;


    import java.io.IOException;


    public class Main {


    public static void main(String[] args) {


    try (FileInputStream fis = new FileInputStream(“example.txt”)) {


    int content;


    while ((content = fis.read()) != -1) {


    System.out.print((char) content);


    }


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    In this example, we use FileInputStream to read a file named “example.txt” byte
    by byte. The FileInputStream class reads bytes from a file and returns them as
    integers. We cast these integers to characters and print them to the console.
    Notice the try-with-resources statement, which ensures that the FileInputStream
    is closed automatically at the end of the block, even if an exception occurs.


    Now let’s read from a file using character streams:


    import java.io.FileReader;


    import java.io.IOException;


    public class Main {


    public static void main(String[] args) {


    try (FileReader fr = new FileReader(“example.txt”)) {


    int content;


    while ((content = fr.read()) != -1) {


    System.out.print((char) content);


    }


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    In this example, we use FileReader to read the file “example.txt” character by
    character. FileReader is designed for reading text files and handles character
    encoding automatically.


