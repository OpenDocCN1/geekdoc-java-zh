    import java.io.BufferedWriter;


    import java.io.FileWriter;


    import java.io.IOException;


    import java.time.LocalDateTime;


    import java.time.format.DateTimeFormatter;


    public class Logger {


    private static final String LOG_FILE = “app.log”;


    public static void log(String message) {


    try (BufferedWriter bw = new BufferedWriter(new FileWriter(LOG_FILE, true))) {


    String timestamp = LocalDateTime.now().format(DateTimeFormatter.ofPattern(“yyyy-MM-dd
    HH:mm:ss”));


    bw.write(timestamp + " - " + message);


    bw.newLine();


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    public class Main {


    public static void main(String[] args) {


    Logger.log(“Application started.”);


    Logger.log(“An error occurred.”);


    Logger.log(“Application finished.”);


    }


    }


    In this example, we create a Logger class that writes log messages to a file named
    “app.log”. The log method appends a timestamp to each message, providing a simple
    way to track events and errors in your application.


