    \ and experimenting with different file and I/O operations to reinforce your understanding\
    \ and improve your programming skills. With a solid grasp of these concepts, you’ll\
    \ be well-equipped to build robust and flexible Java applications.\n\n# Chapter\
    \ 10: Basic Java APIs and Libraries\n\nWelcome to Chapter 10! You’ve made it this\
    \ far, and now it’s time to dive into some of the powerful APIs and libraries\
    \ that Java provides. These tools are like secret weapons in your programming\
    \ arsenal, enabling you to accomplish complex tasks with relative ease. From handling\
    \ dates and times to manipulating collections and performing I/O operations, Java’s\
    \ standard library has got you covered.\n\n## Understanding the Java Standard\
    \ Library\n\nThe Java Standard Library is a vast collection of classes and interfaces\
    \ that provide essential functionality for everyday programming tasks. It’s organized\
    \ into packages, each serving a different purpose. Some of the most commonly used\
    \ packages include:\n\n- `java.lang`: Provides fundamental classes, such as `String`,\
    \ `Math`, and `System`.\n- `java.util`: Contains utility classes, such as collections,\
    \ date and time facilities, and random number generators.\n- `java.io`: Provides\
    \ classes for input and output operations, including file handling.\n- `java.nio`:\
    \ Offers classes for non-blocking I/O operations.\n- `java.net`: Contains classes\
    \ for networking, such as `URL`, `Socket`, and `ServerSocket`.\n- `java.time`:\
    \ Introduces the new date and time API, which is more powerful and flexible than\
    \ the old `java.util.Date` and `java.util.Calendar` classes.\n\nLet’s explore\
    \ some of the most useful APIs and libraries in the Java Standard Library and\
    \ see how they can make your life easier as a programmer.\n\n## The java.lang\
    \ Package\n\nThe `java.lang` package is automatically imported into every Java\
    \ program, so you don’t need to import it explicitly. It contains essential classes\
    \ and interfaces that are fundamental to the Java programming language.\n\n###\
    \ The String Class\n\nThe `String` class is one of the most commonly used classes\
    \ in Java. It represents a sequence of characters and provides various methods\
    \ for manipulating strings. Here’s an example of how to use the `String` class:\n\
    \n```java\npublic class Main {\n    public static void main(String[] args) {\n\
    \        String greeting = \"Hello, Java!\";\n        // Length of the string\n\
    \        int length = greeting.length();\n        System.out.println(\"Length:\
    \ \" + length);\n        // Character at a specific index\n        char firstChar\
    \ = greeting.charAt(0);\n        System.out.println(\"First character: \" + firstChar);\n\
    \        // Substring\n        String substring = greeting.substring(7, 11);\n\
    \        System.out.println(\"Substring: \" + substring);\n        // Replace\n\
    \        String newGreeting = greeting.replace(\"Java\", \"World\");\n       \
    \ System.out.println(\"New greeting: \" + newGreeting);\n    }\n}\n```\n\nIn this\
    \ example, we use various methods of the `String` class to manipulate the string\
    \ `\"Hello, Java!\"` and print the results.\n\n### The Math Class\n\nThe `Math`\
    \ class provides methods for performing numeric operations, such as arithmetic,\
    \ trigonometry, and logarithms. Here’s an example of how to use the `Math` class:\n\
    \n```java\npublic class Main {\n    public static void main(String[] args) {\n\
    \        double number = 25.0;\n        // Square root\n        double sqrt =\
    \ Math.sqrt(number);\n        System.out.println(\"Square root: \" + sqrt);\n\
    \        // Power\n        double power = Math.pow(number, 2);\n        System.out.println(\"\
    Power: \" + power);\n        // Maximum and minimum\n        double max = Math.max(number,\
    \ 30.0);\n        double min = Math.min(number, 20.0);\n        System.out.println(\"\
    Max: \" + max);\n        System.out.println(\"Min: \" + min);\n        // Random\
    \ number\n        double random = Math.random();\n        System.out.println(\"\
    Random number: \" + random);\n    }\n}\n```\n\nIn this example, we use various\
    \ methods of the `Math` class to perform mathematical operations and print the\
    \ results.\n\n## The java.util Package\n\nThe `java.util` package contains utility\
    \ classes that provide essential functionality for collections, date and time\
    \ handling, and more.\n\n### The Collections Framework\n\nThe Collections Framework\
    \ provides a set of classes and interfaces for working with groups of objects.\
    \ It includes classes like `ArrayList`, `HashSet`, and `HashMap`, which we’ve\
    \ already explored. Let’s look at some additional functionality provided by the\
    \ `Collections` class:\n\n```java\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
    import java.util.List;\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        List<Integer> numbers = new ArrayList<>();\n        numbers.add(3);\n\
    \        numbers.add(1);\n        numbers.add(4);\n        numbers.add(1);\n \
    \       numbers.add(5);\n        // Sort the list\n        Collections.sort(numbers);\n\
