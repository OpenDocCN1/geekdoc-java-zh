    Caught an exception: \" + e.getMessage());\n        }\n    }\n\n    public static\
    \ void validateUser(String userRole) throws InvalidUserException {\n        if\
    \ (!userRole.equals(\"admin\")) {\n            throw new InvalidUserException(\"\
    User is not authorized.\");\n        }\n    }\n}\n\nclass InvalidUserException\
    \ extends Exception {\n    public InvalidUserException(String message) {\n   \
    \     super(message);\n    }\n}\n```\n\n在这个示例中，我们创建了一个名为 `InvalidUserException`\
    \ 的自定义异常，用来处理未经授权的用户访问。\n\n## 现实场景\n在现实编程场景中，异常处理是至关重要的，它可以确保你的应用程序顺利运行并优雅地处理错误。让我们探索几个示例，看看异常处理如何应用。\n\
    \n### 示例 1：文件操作\n假设你正在编写一个从文件读取并处理数据的程序。如果没有异常处理，当文件不存在或读取文件出现问题时，程序可能会崩溃。通过使用异常处理，你可以提供有意义的错误信息并确保程序继续运行：\n\
    \n```java\nimport java.io.BufferedReader;\nimport java.io.FileReader;\nimport\
    \ java.io.IOException;\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        String fileName = \"data.txt\";\n        try {\n          \
    \  BufferedReader reader = new BufferedReader(new FileReader(fileName));\n   \
    \         String line;\n            while ((line = reader.readLine()) != null)\
    \ {\n                System.out.println(line);\n            }\n            reader.close();\n\
    \        } catch (IOException e) {\n            System.out.println(\"Error reading\
    \ file: \" + e.getMessage());\n        }\n    }\n}\n```\n\n### 示例 2：用户输入验证\n处理用户输入时，验证输入并优雅地处理任何无效数据是非常重要的。这是一个程序示例，它提示用户输入一个数字并使用异常处理处理无效输入：\n\
    \n```java\nimport java.util.InputMismatchException;\nimport java.util.Scanner;\n\
    \npublic class Main {\n    public static void main(String[] args) {\n        Scanner\
    \ scanner = new Scanner(System.in);\n        System.out.print(\"Enter a number:\
    \ \");\n        try {\n            int number = scanner.nextInt();\n         \
    \   System.out.println(\"You entered: \" + number);\n        } catch (InputMismatchException\
    \ e) {\n            System.out.println(\"Invalid input! Please enter a valid number.\"\
    );\n        }\n    }\n}\n```\n\n### 示例 3：网络操作\n在编写涉及网络操作的程序（例如连接服务器或下载数据）时，处理连接超时或主机不可用等潜在错误是非常重要的。这是一个示例：\n\
    \n```java\nimport java.io.IOException;\nimport java.net.HttpURLConnection;\nimport\
    \ java.net.URL;\n\npublic class Main {\n    public static void main(String[] args)\
    \ {\n        String urlString = \"http://example.com\";\n        try {\n     \
    \       URL url = new URL(urlString);\n            HttpURLConnection connection\
    \ = (HttpURLConnection) url.openConnection();\n            connection.setRequestMethod(\"\
    GET\");\n            int responseCode = connection.getResponseCode();\n      \
    \      System.out.println(\"Response Code: \" + responseCode);\n        } catch\
    \ (IOException e) {\n            System.out.println(\"Network error: \" + e.getMessage());\n\
    \        }\n    }\n}\n```\n\n## 结语\n通过掌握异常处理，你可以编写更健壮、更可靠的 Java 程序，使其能够优雅地处理错误和意外事件。异常处理允许你管理并响应运行时异常，确保你的应用程序保持稳定且友好。\n\
    \n继续练习并尝试不同的异常处理技术，以巩固你的理解并提高编程技能。熟练掌握异常处理后，你将完全有能力构建韧性和容错性的 Java 应用程序。\n\n# 第\
    \ 9 章：文件处理与 I/O 操作\n欢迎来到第 9 章！到目前，你已经成了一个相当的 Java 专家，处理了从面向对象编程到异常处理的所有内容。现在是时候深入研究对于现实世界应用至关重要的课题：文件操作和输入/输出（I/O）。本章将教你如何处理文件，让你的程序更具功能。\n\
    \n## 理解 Java I/O\nJava 提供了一套健壮且灵活的 I/O 框架，允许你从文件、网络连接甚至控制台读取和写入数据。`java.io` 包包含了处理操作所需的类和接口。Java\
    \ I/O 系统的核心是流（streams）。\n\n### 流的两种类型\n有两种主要的流：字节流和字符流。\n\n字节流处理二进制数据，适用于读取和写入二进制文件。它们使用\
    \ `InputStream` 和 `OutputStream` 类及其子类。而字符流处理文本数据，设计用于读取和写入字符。它们使用 `Reader` 和\
    \ `Writer` 类及其子类。\n\n## 从文件读取\n从文件中读取数据是一个常见任务，Java 让其变得相对简单。让我们从使用字节流读取文件开始：\n\
    \n```java\nimport java.io.FileInputStream;\nimport java.io.IOException;\n\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        try (FileInputStream\
    \ fis = new FileInputStream(\"example.txt\")) {\n            int content;\n  \
    \          while ((content = fis.read()) != -1) {\n                System.out.print((char)\
    \ content);\n            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n在这个示例中，我们使用 `FileInputStream` 按字节读取名为“example.txt”的文件。`FileInputStream`\
    \ 类从文件中读取字节并以整数形式返回。我们将这些整数转换为字符并打印到控制台。注意 try-with-resources 语句，它确保 `FileInputStream`\
    \ 在块结束时自动关闭，即使发生了异常也是如此。\n\n现在使用字符流从文件读取：\n\n```java\nimport java.io.FileReader;\n\
    import java.io.IOException;\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        try (FileReader fr = new FileReader(\"example.txt\")) {\n \
    \           int content;\n            while ((content = fr.read()) != -1) {\n\
    \                System.out.print((char) content);\n            }\n        } catch\
    \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
    \n在这个示例中，我们使用 `FileReader` 逐字符地读取文件“example.txt”。`FileReader` 设计用于读取文本文件，并会自动处理字符编码。\n\
    \n"
- fmt: "\nWriting data to a file is just as important as reading from it. Let’s start\
    \ with an example using byte streams to write to a file:\n\n```java\nimport java.io.FileOutputStream;\n\
    import java.io.IOException;\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        try (FileOutputStream fos = new FileOutputStream(“output.txt”))\
    \ {\n            String data = “Hello, Java!”;\n            fos.write(data.getBytes());\n\
    \        } catch (IOException e) {\n            e.printStackTrace();\n       \
    \ }\n    }\n}\n```\n\nIn this example, we use `FileOutputStream` to write the\
    \ string “Hello, Java!” to a file named “output.txt”. The `write` method writes\
    \ bytes to the file, so we convert the string to a byte array using the `getBytes()`\
    \ method.\n\nNow let’s write to a file using character streams:\n\n```java\nimport\
    \ java.io.FileWriter;\nimport java.io.IOException;\n\npublic class Main {\n  \
    \  public static void main(String[] args) {\n        try (FileWriter fw = new\
    \ FileWriter(“output.txt”)) {\n            String data = “Hello, Java!”;\n   \
    \         fw.write(data);\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\nIn this example, we use `FileWriter` to write the\
    \ string “Hello, Java!” to a file named “output.txt”. `FileWriter` handles character\
    \ encoding automatically, making it a convenient choice for writing text files.\n\
    \n### Buffered Streams\n\nBuffered streams are wrappers around byte and character\
    \ streams that improve performance by reducing the number of I/O operations. They\
    \ use an internal buffer to read and write data in larger chunks, which is more\
    \ efficient than handling one byte or character at a time.\n\nHere’s an example\
    \ of reading from a file using a `BufferedInputStream`:\n\n```java\nimport java.io.BufferedInputStream;\n\
    import java.io.FileInputStream;\nimport java.io.IOException;\n\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        try (BufferedInputStream\
    \ bis = new BufferedInputStream(new FileInputStream(“example.txt”))) {\n     \
    \       int content;\n            while ((content = bis.read()) != -1) {\n   \
    \             System.out.print((char) content);\n            }\n        } catch\
    \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
    \nIn this example, we wrap a `FileInputStream` with a `BufferedInputStream`, which\
    \ reads data in larger chunks, improving performance.\n\nHere’s an example of\
    \ writing to a file using a `BufferedOutputStream`:\n\n```java\nimport java.io.BufferedOutputStream;\n\
    import java.io.FileOutputStream;\nimport java.io.IOException;\n\npublic class\
    \ Main {\n    public static void main(String[] args) {\n        try (BufferedOutputStream\
    \ bos = new BufferedOutputStream(new FileOutputStream(“output.txt”))) {\n    \
    \        String data = “Hello, Java!”;\n            bos.write(data.getBytes());\n\
    \        } catch (IOException e) {\n            e.printStackTrace();\n       \
    \ }\n    }\n}\n```\n\nIn this example, we wrap a `FileOutputStream` with a `BufferedOutputStream`,\
    \ which writes data in larger chunks, improving performance.\n\n### File and Directory\
    \ Operations\n\nJava provides the `File` class for working with files and directories.\
    \ The `File` class offers methods for creating, deleting, and querying files and\
    \ directories. Here’s an example of how to use the `File` class:\n\n```java\n\
    import java.io.File;\nimport java.io.IOException;\n\npublic class Main {\n   \
    \ public static void main(String[] args) {\n        File file = new File(“newfile.txt”);\n\
    \        // Create a new file\n        try {\n            if (file.createNewFile())\
    \ {\n                System.out.println(“File created: \" + file.getName());\n\
    \            } else {\n                System.out.println(“File already exists.”);\n\
    \            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n        // Check if the file exists\n        if (file.exists()) {\n\
    \            System.out.println(“File exists: \" + file.getName());\n        }\n\
    \        // Get file information\n        System.out.println(“Absolute path: \"\
    \ + file.getAbsolutePath());\n        System.out.println(“Writable: \" + file.canWrite());\n\
    \        System.out.println(“Readable: \" + file.canRead());\n        System.out.println(“File\
    \ size in bytes: \" + file.length());\n        // Delete the file\n        if\
    \ (file.delete()) {\n            System.out.println(“File deleted: \" + file.getName());\n\
    \        } else {\n            System.out.println(“Failed to delete the file.”);\n\
    \        }\n        // Working with directories\n        File dir = new File(“myDirectory”);\n\
    \        // Create a new directory\n        if (dir.mkdir()) {\n            System.out.println(“Directory\
    \ created: \" + dir.getName());\n        } else {\n            System.out.println(“Failed\
    \ to create the directory.”);\n        }\n        // List files in a directory\n\
    \        String[] files = dir.list();\n        if (files != null) {\n        \
    \    for (String filename : files) {\n                System.out.println(“File:\
    \ \" + filename);\n            }\n        } else {\n            System.out.println(“Directory\
    \ is empty or does not exist.”);\n        }\n    }\n}\n```\n\nIn this example,\
    \ we use the `File` class to create, check, and delete a file, as well as create\
    \ a directory and list its contents. The `File` class provides a wide range of\
    \ methods for file and directory manipulation, making it a versatile tool for\
    \ handling file operations.\n\n### Reading and Writing Text Files with BufferedReader\
    \ and BufferedWriter\n\nWhen working with text files, using `BufferedReader` and\
    \ `BufferedWriter` can make reading and writing more efficient and convenient.\
    \ Here’s an example of reading a text file using `BufferedReader`:\n\n```java\n\
    import java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.IOException;\n\
    \npublic class Main {\n    public static void main(String[] args) {\n        try\
    \ (BufferedReader br = new BufferedReader(new FileReader(“example.txt”))) {\n\
    \            String line;\n            while ((line = br.readLine()) != null)\
    \ {\n                System.out.println(line);\n            }\n        } catch\
    \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
    \nIn this example, we use `BufferedReader` to read the file `example.txt` line\
    \ by line, making it easier to handle text files.\n\nHere’s an example of writing\
    \ to a text file using `BufferedWriter`:\n\n```java\nimport java.io.BufferedWriter;\n\
    import java.io.FileWriter;\nimport java.io.IOException;\n\npublic class Main {\n\
    \    public static void main(String[] args) {\n        try (BufferedWriter bw\
    \ = new FileWriter(“output.txt”)) {\n            String data = “Hello, Java!”;\n\
    \            bw.write(data);\n            bw.newLine();\n            bw.write(“This\
    \ is another line.”);\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\nIn this example, we use `BufferedWriter` to write\
    \ the string “Hello, Java!” and another line to the file `output.txt`. The `newLine()`\
    \ method adds a line break, making it easy to write multiple lines.\n\n### Real-Life\
    \ Scenarios\n\nFile and I/O operations are essential in many real-life scenarios.\
    \ Let’s explore a few examples to see how file handling can be applied.\n\n####\
    \ Example 1: Logging System\n\nA logging system is crucial for debugging and monitoring\
    \ applications. You can use file handling to create a simple logging system that\
    \ writes log messages to a file:\n\n```java\nimport java.io.BufferedWriter;\n\
    import java.io.FileWriter;\nimport java.io.IOException;\nimport java.time.LocalDateTime;\n\
    import java.time.format.DateTimeFormatter;\n\npublic class Logger {\n    private\
    \ static final String LOG_FILE = “app.log”;\n\n    public static void log(String\
    \ message) {\n        try (BufferedWriter bw = new BufferedWriter(new FileWriter(LOG_FILE,\
    \ true))) {\n            String timestamp = LocalDateTime.now().format(DateTimeFormatter.ofPattern(“yyyy-MM-dd\
    \ HH:mm:ss”));\n            bw.write(timestamp + \" - \" + message);\n       \
    \     bw.newLine();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Logger.log(“Application started.”);\n        Logger.log(“An\
    \ error occurred.”);\n        Logger.log(“Application finished.”);\n    }\n}\n\
    ```\n\nIn this example, we create a `Logger` class that writes log messages to\
    \ a file named `app.log`. The `log` method appends a timestamp to each message,\
    \ providing a simple way to track events and errors in your application.\n\n####\
    \ Example 2: Configuration Files\n\nMany applications use configuration files\
    \ to store settings and preferences. You can use file handling to read and write\
    \ configuration files, allowing users to customize their experience:\n\n```java\n\
    import java.io.BufferedReader;\nimport java.io.BufferedWriter;\nimport java.io.FileReader;\n\
    import java.io.FileWriter;\nimport java.io.IOException;\nimport java.util.HashMap;\n\
    import java.util.Map;\n\npublic class ConfigManager {\n    private static final\
    \ String CONFIG_FILE = “config.txt”;\n    private Map<String, String> config =\
    \ new HashMap<>();\n\n    public void loadConfig() {\n        try (BufferedReader\
    \ br = new BufferedReader(new FileReader(CONFIG_FILE))) {\n            String\
    \ line;\n            while ((line = br.readLine()) != null) {\n              \
    \  String[] parts = line.split(\"=\");\n                if (parts.length == 2)\
    \ {\n                    config.put(parts[0].trim(), parts[1].trim());\n     \
    \           }\n            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n"
