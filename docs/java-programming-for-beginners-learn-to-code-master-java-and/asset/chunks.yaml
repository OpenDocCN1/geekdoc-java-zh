    The Date and Time API


    The java.time package introduces a modern and comprehensive date and time API.
    It provides classes like LocalDate, LocalTime, and LocalDateTime, which are immutable
    and thread-safe. Here’s an example of how to use the new date and time API:


    import java.time.LocalDate;


    import java.time.LocalTime;


    import java.time.LocalDateTime;


    import java.time.format.DateTimeFormatter;


    public class Main {


    public static void main(String[] args) {


    // Current date


    LocalDate currentDate = LocalDate.now();


    System.out.println(“Current date: " + currentDate);


    // Current time


    LocalTime currentTime = LocalTime.now();


    System.out.println(“Current time: " + currentTime);


    // Current date and time


    LocalDateTime currentDateTime = LocalDateTime.now();


    System.out.println(“Current date and time: " + currentDateTime);


    // Formatting date and time


    DateTimeFormatter formatter = DateTimeFormatter.ofPattern(“yyyy-MM-dd HH:mm:ss”);


    String formattedDateTime = currentDateTime.format(formatter);


    System.out.println(“Formatted date and time: " + formattedDateTime);


    // Parsing date and time


    String dateTimeString = “2024-01-01 12:00:00”;


    LocalDateTime parsedDateTime = LocalDateTime.parse(dateTimeString, formatter);


    System.out.println(“Parsed date and time: " + parsedDateTime);


    }


    }


    In this example, we use various classes from the java.time package to work with
    dates and times, format them, and parse them from strings.


    The java.io Package


    The java.io package provides classes for input and output operations, including
    file handling. We’ve already explored file reading and writing in the previous
    chapter. Let’s look at an example of using ObjectInputStream and ObjectOutputStream
    to serialize and deserialize objects:


    import java.io.*;


    class Person implements Serializable {


    private static final long serialVersionUID = 1L;


    private String name;


    private int age;


    public Person(String name, int age) {


    this.name = name;


    this.age = age;


    }


    @Override


    public String toString() {


    return “Person{name=’” + name + “‘, age=” + age + ‘}‘;


    }


    }


    public class Main {


    public static void main(String[] args) {


    Person person = new Person(“John Doe”, 30);


    // Serialize the object


    try (ObjectOutputStream oos = new ObjectOutputStream(new FileOutputStream(“person.ser”)))
    {


    oos.writeObject(person);


    System.out.println(“Object serialized: " + person);


    } catch (IOException e) {


    e.printStackTrace();


    }


    // Deserialize the object


    try (ObjectInputStream ois = new ObjectInputStream(new FileInputStream(“person.ser”)))
    {


    Person deserializedPerson = (Person) ois.readObject();


    System.out.println(“Object deserialized: " + deserializedPerson);


    } catch (IOException | ClassNotFoundException e) {


    e.printStackTrace();


    }


    }


    }


    In this example, we create a Person class that implements the Serializable interface,
    allowing it to be serialized and deserialized. We use ObjectOutputStream to write
    the object to a file and ObjectInputStream to read the object from the file.


    The java.net Package


    The java.net package provides classes for networking, such as URL, Socket, and
    ServerSocket. Here’s an example of how to use the URL class to read the content
    of a web page:


    import java.io.BufferedReader;


    import java.io.InputStreamReader;


    import java.net.URL;


    public class Main {


    public static void main(String[] args) {


    try {


    URL url = new URL(“http://example.com”);


    BufferedReader reader = new BufferedReader(new InputStreamReader(url.openStream()));


    String line;


    while ((line = reader.readLine()) != null) {


    System.out.println(line);


    }


    reader.close();


    } catch (Exception e) {


    e.printStackTrace();


    }


    }


    }


    In this example, we use the URL class to open a connection to a web page and read
    its content line by line using BufferedReader.


    The java.nio Package


    The java.nio (New I/O) package provides classes for non-blocking I/O operations,
    which can improve performance in certain scenarios. Here’s an example of using
    the Files class from java.nio.file to read and write files:


    import java.nio.file.Files;


    import java.nio.file.Paths;


    import java.util.List;


    public class Main {


    public static void main(String[] args) {


    String filePath = “example.txt”;


    List<String> lines;


    // Read all lines from a file


    try {


    lines = Files


    .readAllLines(Paths.get(filePath));


    for (String line : lines) {


    System.out.println(line);


    }


    } catch (Exception e) {


    e.printStackTrace();


    }


    // Write lines to a file


    try {


    List<String> newLines = List.of(“Hello, Java NIO!”, “This is a new line.”);


    Files.write(Paths.get(“output.txt”), newLines);


    } catch (Exception e) {


    e.printStackTrace();


    }


    }


    }


    In this example, we use the Files class to read all lines from a file and write
    new lines to a different file.


    Real-Life Scenarios


    Using Java APIs and libraries can significantly simplify various real-life programming
    tasks. Let’s explore a few examples.


    Example 1: Data Encryption


    Suppose you’re writing an application that needs to encrypt sensitive data. You
    can use the javax.crypto package to perform encryption and decryption:


    import javax.crypto.Cipher;


    import javax.crypto.KeyGenerator;


    import javax.crypto.SecretKey;


    import java.util.Base64;


    public class Main {


    public static void main(String[] args) {


    try {


    // Generate a secret key


    KeyGenerator keyGen = KeyGenerator.getInstance(“AES”);


    keyGen.init(128);


    SecretKey secretKey = keyGen.generateKey();


    // Encrypt the data


    Cipher cipher = Cipher.getInstance(“AES”);


    cipher.init(Cipher.ENCRYPT_MODE, secretKey);


    String originalData = “Sensitive Data”;


    byte[] encryptedData = cipher.doFinal(originalData.getBytes());


    String encodedEncryptedData = Base64.getEncoder().encodeToString(encryptedData);


    System.out.println(“Encrypted Data: " + encodedEncryptedData);


    // Decrypt the data


    cipher.init(Cipher.DECRYPT_MODE, secretKey);


    byte[] decryptedData = cipher.doFinal(Base64.getDecoder().decode(encodedEncryptedData));


    String decryptedString = new String(decryptedData);


    System.out.println(“Decrypted Data: " + decryptedString);


    } catch (Exception e) {


    e.printStackTrace();


    }


    }


    }


    In this example, we use the javax.crypto package to generate a secret key, encrypt
    data using AES encryption, and then decrypt the data back to its original form.


    Example 2: JSON Parsing


    Suppose you’re writing an application that needs to parse JSON data. You can use
    the org.json library to parse and manipulate JSON:


    import org.json.JSONObject;


    public class Main {


    public static void main(String[] args) {


    String jsonString = “{\“name\”:\“John Doe\“,\“age\”:30,\“city\”:\“New York\”}“;


    // Parse the JSON string


    JSONObject jsonObject = new JSONObject(jsonString);


    String name = jsonObject.getString(“name”);


    int age = jsonObject.getInt(“age”);


    String city = jsonObject.getString(“city”);


    System.out.println(“Name: " + name);


    System.out.println(“Age: " + age);


    System.out.println(“City: " + city);


    // Modify the JSON object


    jsonObject.put(“age”, 31);


    System.out.println(“Updated JSON: " + jsonObject.toString());


    }


    }


    In this example, we use the org.json library to parse a JSON string, extract values,
    and modify the JSON object.


