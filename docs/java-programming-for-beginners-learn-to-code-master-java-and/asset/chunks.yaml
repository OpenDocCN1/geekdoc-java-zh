    Primitive Data Types


    Primitive data types are the most basic data types available in Java. They include:


    - `byte`: 8-bit integer


    - `short`: 16-bit integer


    - `int`: 32-bit integer


    - `long`: 64-bit integer


    - `float`: 32-bit floating-point number


    - `double`: 64-bit floating-point number


    - `char`: 16-bit Unicode character


    - `boolean`: true or false


    Here’s how you can declare and initialize variables of different primitive data
    types:


    byte myByte = 100;


    short myShort = 10000;


    int myInt = 100000;


    long myLong = 100000L;


    float myFloat = 10.5f;


    double myDouble = 10.5;


    char myChar = ‘A’;


    boolean myBoolean = true;


    Notice the ‘L’ at the end of the long value and the ‘f’ at the end of the float
    value. These suffixes are required to indicate that the values are of type long
    and float, respectively.


