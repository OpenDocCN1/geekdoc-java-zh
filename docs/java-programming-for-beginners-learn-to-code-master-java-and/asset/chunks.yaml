    \ FileReader(fileName));\n        String line;\n        while ((line = reader.readLine())\
    \ != null) {\n            System.out.println(line);\n        }\n        reader.close();\n\
    \    }\n}\n```\n\nIn this example, the `readFile` method declares that it throws\
    \ an `IOException`. The `main` method is responsible for handling this exception.\n\
    \n## Custom Exceptions\nIn addition to using Java’s built-in exceptions, you can\
    \ create your own custom exceptions. This is useful when you need to handle specific\
    \ error conditions in your application. To create a custom exception, simply extend\
    \ the `Exception` class (or any of its subclasses). Here’s an example:\n\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        try\
    \ {\n            validateUser(\"guest\");\n        } catch (InvalidUserException\
    \ e) {\n            System.out.println(\"Caught an exception: \" + e.getMessage());\n\
    \        }\n    }\n\n    public static void validateUser(String userRole) throws\
    \ InvalidUserException {\n        if (!userRole.equals(\"admin\")) {\n       \
    \     throw new InvalidUserException(\"User is not authorized.\");\n        }\n\
    \    }\n}\n\nclass InvalidUserException extends Exception {\n    public InvalidUserException(String\
    \ message) {\n        super(message);\n    }\n}\n```\n\nIn this example, we create\
    \ a custom exception called `InvalidUserException` to handle unauthorized user\
    \ access.\n\n## Real-Life Scenarios\nException handling is essential in real-life\
    \ programming scenarios to ensure your applications run smoothly and gracefully\
    \ handle errors. Let’s explore a few examples to see how exception handling can\
    \ be applied.\n\n### Example 1: File Operations\nSuppose you’re writing a program\
    \ to read and process data from a file. Without exception handling, your program\
    \ might crash if the file doesn’t exist or if there’s an issue reading the file.\
    \ By using exception handling, you can provide meaningful error messages and ensure\
    \ the program continues running:\n\n```java\nimport java.io.BufferedReader;\n\
    import java.io.FileReader;\nimport java.io.IOException;\n\npublic class Main {\n\
    \    public static void main(String[] args) {\n        String fileName = \"data.txt\"\
