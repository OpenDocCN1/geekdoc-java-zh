    \ static void main(String[] args) {\n        System.out.println(\"Hello, World!\"\
    );\n    }\n}\n```\n\nThis is a simple program that prints “Hello, World!” to the\
    \ console. To run it, right-click on the file and select “Run” (or click the play\
    \ button in IntelliJ IDEA). If everything is set up correctly, you should see\
    \ the output in the console at the bottom of the IDE. Congratulations, you’ve\
    \ just written and executed your first Java program!\n\n## Using a Text Editor\
    \ and Command Line\n\nAt this point, you might be thinking, “This is great, but\
    \ why do I need an IDE? Can’t I just write my code in a text editor and run it\
    \ from the command line?” You absolutely can, and in fact, it’s a good idea to\
    \ understand how to do that. Let’s give it a try.\n\nOpen a text editor (Notepad\
    \ on Windows, TextEdit on macOS, or `nano` on Linux) and type the same `HelloWorld`\
