    \        } catch (IOException e) {\n            System.out.println(\"Error reading\
    \ file: \" + e.getMessage());\n        }\n    }\n}\n```\n\n### Example 2: User\
    \ Input Validation\nWhen dealing with user input, it’s important to validate the\
    \ input and handle any invalid data gracefully. Here’s an example of a program\
    \ that prompts the user for a number and handles invalid input using exception\
    \ handling:\n\n```java\nimport java.util.InputMismatchException;\nimport java.util.Scanner;\n\
    \npublic class Main {\n    public static void main(String[] args) {\n        Scanner\
    \ scanner = new Scanner(System.in);\n        System.out.print(\"Enter a number:\
    \ \");\n        try {\n            int number = scanner.nextInt();\n         \
    \   System.out.println(\"You entered: \" + number);\n        } catch (InputMismatchException\
    \ e) {\n            System.out.println(\"Invalid input! Please enter a valid number.\"\
    );\n        }\n    }\n}\n```\n\n### Example 3: Network Operations\nWhen writing\
    \ programs that involve network operations, such as connecting to a server or\
    \ downloading data, it’s important to handle potential errors like connection\
    \ timeouts or unreachable hosts. Here’s an example:\n\n```java\nimport java.io.IOException;\n\
    import java.net.HttpURLConnection;\nimport java.net.URL;\n\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        String urlString =\
    \ \"http://example.com\";\n        try {\n            URL url = new URL(urlString);\n\
    \            HttpURLConnection connection = (HttpURLConnection) url.openConnection();\n\
    \            connection.setRequestMethod(\"GET\");\n            int responseCode\
    \ = connection.getResponseCode();\n            System.out.println(\"Response Code:\
    \ \" + responseCode);\n        } catch (IOException e) {\n            System.out.println(\"\
    Network error: \" + e.getMessage());\n        }\n    }\n}\n```\n\n## Takeaways\n\
    By mastering exception handling, you can write more robust and reliable Java programs\
    \ that gracefully handle errors and unexpected events. Exception handling allows\
    \ you to manage and respond to runtime anomalies, ensuring your applications remain\
    \ stable and user-friendly.\n\nKeep practicing and experimenting with different\
    \ exception handling techniques to reinforce your understanding and improve your\
    \ programming skills. With a solid grasp of exception handling, you’ll be well-equipped\
    \ to build resilient and fault-tolerant Java applications.\n\n# Chapter 9: Working\
    \ with Files and I/O\nWelcome to Chapter 9! By now, you’ve become quite the Java\
    \ aficionado, tackling everything from object-oriented programming to exception\
    \ handling. Now it’s time to delve into a topic that’s essential for any real-world\
    \ application: working with files and input/output (I/O). Imagine writing a fantastic\
    \ piece of software that can’t save data or read from a file—pretty limiting,\
    \ right? This chapter will teach you how to handle files and perform I/O operations\
    \ in Java, making your programs more versatile and functional.\n\n## Understanding\
    \ Java I/O\nJava provides a robust and flexible I/O framework that allows you\
    \ to read from and write to data sources, such as files, network connections,\
    \ and even the console. The `java.io` package contains all the necessary classes\
    \ and interfaces for handling I/O operations. At the heart of Java’s I/O system\
    \ are streams, which are sequences of data.\n\n### Two Types of Streams\nThere\
    \ are two main types of streams: byte streams and character streams.\n\nByte streams\
    \ handle raw binary data and are useful for reading and writing binary files like\
    \ images or executable files. They use `InputStream` and `OutputStream` classes\
    \ and their subclasses. Character streams, on the other hand, handle text data\
    \ and are designed for reading and writing characters. They use `Reader` and `Writer`\
    \ classes and their subclasses.\n\n## Reading from a File\nReading data from a\
    \ file is a common task, and Java makes it relatively straightforward. Let’s start\
    \ with an example using byte streams to read a file:\n\n```java\nimport java.io.FileInputStream;\n\
    import java.io.IOException;\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        try (FileInputStream fis = new FileInputStream(\"example.txt\"\
    )) {\n            int content;\n            while ((content = fis.read()) != -1)\
    \ {\n                System.out.print((char) content);\n            }\n      \
    \  } catch (IOException e) {\n            e.printStackTrace();\n        }\n  \
    \  }\n}\n```\n\nIn this example, we use `FileInputStream` to read a file named\
    \ “example.txt” byte by byte. The `FileInputStream` class reads bytes from a file\
    \ and returns them as integers. We cast these integers to characters and print\
    \ them to the console. Notice the try-with-resources statement, which ensures\
    \ that the `FileInputStream` is closed automatically at the end of the block,\
    \ even if an exception occurs.\n\nNow let’s read from a file using character streams:\n\
    \n```java\nimport java.io.FileReader;\nimport java.io.IOException;\n\npublic class\
    \ Main {\n    public static void main(String[] args) {\n        try (FileReader\
    \ fr = new FileReader(\"example.txt\")) {\n            int content;\n        \
    \    while ((content = fr.read()) != -1) {\n                System.out.print((char)\
    \ content);\n            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\nIn this example, we use `FileReader` to read the\
    \ file “example.txt” character by character. `FileReader` is designed for reading\
    \ text files and handles character encoding automatically.\n"
