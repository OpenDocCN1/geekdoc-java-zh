    While arrays are useful, they come with limitations, such as fixed size. This
    is where collections come in. Collections are part of the Java Collections Framework,
    which provides a set of classes and interfaces for storing and manipulating groups
    of data more flexibly and efficiently.


    The main interfaces in the Java Collections Framework are List, Set, and Map.
    Let’s explore each of these in detail.


    The List Interface


    A List is an ordered collection that allows duplicate elements. It’s like an array,
    but with dynamic sizing and additional functionality. The most commonly used implementations
    of the List interface are ArrayList and LinkedList.


    Here’s an example of how to use an ArrayList:


    import java.util.ArrayList;


    import java.util.List;


    public class Main {


    public static void main(String[] args) {


    List<String> fruits = new ArrayList<>();


    // Adding elements


    fruits.add(“Apple”);


    fruits.add(“Banana”);


    fruits.add(“Orange”);


    // Accessing elements


    String firstFruit = fruits.get(0); // Accesses the first element


    System.out.println(“First fruit: " + firstFruit);


    // Iterating over elements


    for (String fruit : fruits) {


    System.out.println(fruit);


    }


    // Modifying elements


    fruits.set(1, “Mango”); // Changes the second element to Mango


    // Removing elements


    fruits.remove(0); // Removes the first element (Apple)


    System.out.println(“Fruits after modifications: " + fruits);


    }


    }


    In this example, we use an ArrayList to store a list of fruits. We add elements,
    access and modify them, and iterate over the list to print each element.


    The Set Interface


    A Set is an unordered collection that does not allow duplicate elements. It’s
    useful when you need to store unique items. The most commonly used implementations
    of the Set interface are HashSet, LinkedHashSet, and TreeSet.


    Here’s an example of how to use a HashSet:


    import java.util.HashSet;


    import java.util.Set;


    public class Main {


    public static void main(String[] args) {


    Set<String> uniqueFruits = new HashSet<>();


    // Adding elements


    uniqueFruits.add(“Apple”);


    uniqueFruits.add(“Banana”);


    uniqueFruits.add(“Orange”);


    uniqueFruits.add(“Apple”); // Duplicate element


    // Iterating over elements


    for (String fruit : uniqueFruits) {


    System.out.println(fruit);


    }


    // Checking if a Set contains an element


    boolean hasBanana = uniqueFruits.contains(“Banana”);


    System.out.println(“Contains Banana: " + hasBanana);


    // Removing elements


    uniqueFruits.remove(“Orange”);


    System.out.println(“Fruits after modifications: " + uniqueFruits);


    }


    }


    In this example, we use a HashSet to store a set of unique fruits. Note that adding
    a duplicate element (“Apple”) does not affect the Set.


    The Map Interface


    A Map is a collection that maps keys to values, with no duplicate keys allowed.
    It’s useful for associating unique keys with specific values. The most commonly
    used implementations of the Map interface are HashMap, LinkedHashMap, and TreeMap.


    Here’s an example of how to use a HashMap:


    import java.util.HashMap;


    import java.util.Map;


    public class Main {


    public static void main(String[] args) {


    Map<String, Integer> fruitPrices = new HashMap<>();


    // Adding key-value pairs


    fruitPrices.put(“Apple”, 150);


    fruitPrices.put(“Banana”, 50);


    fruitPrices.put(“Orange”, 100);


    // Accessing values by key


    int applePrice = fruitPrices.get(“Apple”);


    System.out.println(“Price of Apple: " + applePrice);


    // Iterating over key-value pairs


    for (Map.Entry<String, Integer> entry : fruitPrices.entrySet()) {


    System.out.println(entry.getKey() + “: " + entry.getValue());


    }


    // Modifying values


    fruitPrices.put(“Banana”, 60); // Changes the price of Banana to 60


    // Removing key-value pairs


    fruitPrices.remove(“Orange”);


    System.out.println(“Fruit prices after modifications: " + fruitPrices);


    }


    }


    In this example, we use a HashMap to store fruit prices. We add key-value pairs,
    access values by key, iterate over the entries, and modify and remove elements.


