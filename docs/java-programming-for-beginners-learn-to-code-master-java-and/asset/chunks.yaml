    # Chapter 10: Basic Java APIs and Libraries


    Welcome to Chapter 10! You’ve made it this far, and now it’s time to dive into
    some of the powerful APIs and libraries that Java provides. These tools are like
    secret weapons in your programming arsenal, enabling you to accomplish complex
    tasks with relative ease. From handling dates and times to manipulating collections
    and performing I/O operations, Java’s standard library has got you covered.


    Understanding the Java Standard Library


    The Java Standard Library is a vast collection of classes and interfaces that
    provide essential functionality for everyday programming tasks. It’s organized
    into packages, each serving a different purpose. Some of the most commonly used
    packages include:


    - java.lang: Provides fundamental classes, such as String, Math, and System.


    - java.util: Contains utility classes, such as collections, date and time facilities,
    and random number generators.


    - java.io: Provides classes for input and output operations, including file handling.


    - java.nio: Offers classes for non-blocking I/O operations.


    - java.net: Contains classes for networking, such as URL, Socket, and ServerSocket.


    - java.time: Introduces the new date and time API, which is more powerful and
    flexible than the old java.util.Date and java.util.Calendar classes.


    Let’s explore some of the most useful APIs and libraries in the Java Standard
    Library and see how they can make your life easier as a programmer.


    The java.lang Package


    The java.lang package is automatically imported into every Java program, so you
    don’t need to import it explicitly. It contains essential classes and interfaces
    that are fundamental to the Java programming language.


    The String Class


    The String class is one of the most commonly used classes in Java. It represents
    a sequence of characters and provides various methods for manipulating strings.
    Here’s an example of how to use the String class:


    public class Main {


    public static void main(String[] args) {


    String greeting = “Hello, Java!”;


    // Length of the string


    int length = greeting.length();


    System.out.println(“Length: " + length);


    // Character at a specific index


    char firstChar = greeting.charAt(0);


    System.out.println(“First character: " + firstChar);


    // Substring


    String substring = greeting.substring(7, 11);


    System.out.println(“Substring: " + substring);


    // Replace


    String newGreeting = greeting.replace(“Java”, “World”);


    System.out.println(“New greeting: " + newGreeting);


    }


    }


    In this example, we use various methods of the String class to manipulate the
    string “Hello, Java!” and print the results.


    The Math Class


    The Math class provides methods for performing basic numeric operations, such
    as arithmetic, trigonometry, and logarithms. Here’s an example of how to use the
    Math class:


    public class Main {


    public static void main(String[] args) {


    double number = 25.0;


    // Square root


    double sqrt = Math.sqrt(number);


    System.out.println(“Square root: " + sqrt);


    // Power


    double power = Math.pow(number, 2);


    System.out.println(“Power: " + power);


    // Maximum and minimum


    double max = Math.max(number, 30.0);


    double min = Math.min(number, 20.0);


    System.out.println(“Max: " + max);


    System.out.println(“Min: " + min);


    // Random number


    double random = Math.random();


    System.out.println(“Random number: " + random);


    }


    }


    In this example, we use various methods of the Math class to perform mathematical
    operations and print the results.


    The java.util Package


    The java.util package contains utility classes that provide essential functionality
    for collections, date and time handling, and more.


    The Collections Framework


    The Collections Framework provides a set of classes and interfaces for working
    with groups of objects. It includes classes like ArrayList, HashSet, and HashMap,
    which we’ve already explored. Let’s look at some additional functionality provided
