  trans: "\n让我们从语法开始。编程中的语法就像口语语言中的句法。它定义了 Java 编译器可以理解的代码编写规则和结构。Java 语法初看起来可能有些望人生畏，但一旦你习惯了它，就会发现它是非常有逻辑性且一致的。\n\
    \n每个 Java 程序都由类和方法组成。类是对象的蓝图，而方法是对象可以执行的操作。例如，在我们的“Hello, World!”程序中，`HelloWorld`\
    \ 是一个类，而 `main` 是一个方法。Java 程序的基本结构如下：\n\n```java\npublic class ClassName {\n \
    \   public static void main(String[] args) {\n        // code goes here\n    }\n\
    }\n```\n\n在这里，`public` 是访问修饰符，允许从其他类访问该类。`class` 是用于定义类的关键字。`ClassName` 是类的名称，你可以根据需要命名它，只要它遵循某些规则（它必须以字母开头，并包含字母和数字）。\n\
    \n在类内部，我们有 `main` 方法。`main` 方法是任何 Java 程序的入口。它是程序开始执行的地方。`public static void main(String[]\
    \ args)` 这一行看起来可能很绕口，但一旦你分解它，它就有意义了：\n\n- `public` 意味着该方法可以从任何地方调用。\n- `static`\
    \ 意味着方法属于类，而不是类的实例。\n- `void` 意味着方法不返回任何值。\n- `main` 是方法的名称。\n- `String[] args`\
    \ 是 `String` 对象的数组，用于存储命令行参数。\n\n## 声明变量\n\n接下来，我们来聊聊变量。变量用于存储可以在程序中使用和操作的数据。将变量想象成存放信息的容器。在\
    \ Java 中，在使用变量之前需要对其进行声明。声明变量涉及指定其数据类型并给它一个名称。以下是声明变量的基本语法：\n\n```java\ndataType\
    \ variableName;\n```\n\n例如，要声明一个名为 `myNumber` 的整数变量，你可以这样写：\n\n```java\nint myNumber;\n\
    ```\n\n你也可以在声明时通过赋值一个值来初始化变量：\n\n```java\nint myNumber = 10;\n```\n\nJava 有多种数据类型，它们可以大致分为两类：基本数据类型和引用数据类型。让我们从基本数据类型开始。\n\
    \n## 基本数据类型\n\n基本数据类型是 Java 中最基础的数据类型。它们包括：\n\n- `byte`: 8 位整数\n- `short`: 16\
    \ 位整数\n- `int`: 32 位整数\n- `long`: 64 位整数\n- `float`: 32 位浮点数\n- `double`: 64 位浮点数\n\
    - `char`: 16 位 Unicode 字符\n- `boolean`: 真或假\n\n以下是你如何声明和初始化不同基本数据类型的变量：\n\n```java\n\
    byte myByte = 100;\nshort myShort = 10000;\nint myInt = 100000;\nlong myLong =\
    \ 100000L;\nfloat myFloat = 10.5f;\ndouble myDouble = 10.5;\nchar myChar = ‘A’;\n\
    boolean myBoolean = true;\n```\n\n注意 long 值末尾的 ‘L’ 和 float 值末尾的 ‘f’。这些后缀是必须的，用于指示这些值分别是\
    \ `long` 和 `float` 类型。\n\n## 引用数据类型\n\n另一方面，引用数据类型用于引用对象。它们包括类、接口和数组。与基本数据类型不同，引用变量存储的是内存中的对象地址。例如，要声明一个\
    \ `String` 类型变量（它是 Java 中的一个类），你可以这样写：\n\n```java\nString myString = “Hello, Java!\"\
    ;\n```\n\n## 数组\n\n数组是相同数据类型的变量集合。它就像一个存储在连续内存位置的项列表。你可以通过指定数据类型后跟方括号来声明数组：\n\n\
    ```java\nint[] myArray;\n```\n\n你也可以在声明时通过指定数组的大小或直接提供元素来初始化数组：\n\n```java\nint[]\
    \ myArray = new int[5]; // 一个包含 5 个整数的数组\nint[] myArray = {1, 2, 3, 4, 5}; //\
    \ 一个带有初始值的数组\n```\n\n使用索引来访问数组元素，第一个元素的索引为 0：\n\n```java\nint firstElement = myArray[0];\n\
    int secondElement = myArray[1];\n```\n\n## 字符串操作\n\n字符串是字符的序列，它们是 Java 中最常用的数据类型之一。`String`\
    \ 类提供了许多操作字符串的方法，例如拼接、比较和查找子字符串。以下是一个你如何处理字符串的示例：\n\n```java\nString greeting\
    \ = “Hello”;\nString name = “World”;\nString message = greeting + “, \" + name\
    \ + “!”;\nSystem.out.println(message);\n```\n\n在这个示例中，我们拼接（组合）变量 `greeting` 和\
    \ `name` 来创建一个新字符串并将其打印到控制台。\n\n## 类型转换\n\n有时，你可能将变量从一种数据类型转换为另一种数据类型。这个过程被称为类型转换。Java\
    \ 中有两种类型转换：隐式转换和强制转换。\n\n隐式转换发生在你将较小的数据类型转换为较大的数据类型时：\n\n```java\nint myInt;\n\
    ```\n\n强制转换发生在你将较大的数据类型转换为较小的数据类型时：\n\n```java\ndouble myDouble;```\n\n## 常量\n\
    \n如果你想声明一个不能改变的变量，可以使用 `final` 关键字。这样的变量就是常量：\n\n```java\nint MY_CONSTANT = 100;\n\
    \n\n## 运算符\n\n运算符是对变量和值执行操作的符号。Java 有多种运算符，包括算术、关系、逻辑和赋值运算符。如下：\n\n- 算术：`+`, `-`,\
    \ `*`, `/`, `%`\n- 关系：`==`, `!=`, `>=`, `<=`\n- 逻辑：`&&`, `||`, `!`\n- 赋值：`=`,\
    \ `+=`, `-=`, `*=`, `/=`, `%=`\n\n这是如何在 Java 中使用一些运算符：\n\n```java\nint a = 10;\n\
    int b = 5;\nint sum = a + b; // sum 为 15\nboolean isEqual = (a == b); // isEqual\
    \ 为 false\nboolean isGreater = (a > b); // isGreater 为 true\nboolean result =\
    \ (a > b) && (a != b); // result 为 true```\n\n## 总结\n\n好了，让我们总结本章的关键点：\n\n- Java\
    \ 语法定义了 Java 编译器可以理解的代码编写规则和结构。\n- 变量用于存储数据，在使用前必须指定特定类型。\n- 基本数据类型包括 `byte`,\
    \ `short`, `int`, `long`, `float`, `double`, `char` 和 `boolean`。\n- 引用数据类型包括类、接口和数组。\n\
    - 数组是相同数据类型的变量集合，通过索引访问。\n- 字符串是字符序列，`String` 类提供了许多操作它们的方法。\n- 类型转换允许你将变量从一种数据类型转换为另一种。\n\
    - 常量是值不能改变的变量，使用 `final` 关键字声明。\n- 运算符对变量和值执行操作，理解它们对于编写有效的 Java 程序至关重要。\n\n现在，你对\
    \ Java 的基础知识有了良好的理解。这些概念表面看起来简单，但它们是 Java 编程中一切的基础。所以，继续练习，尝试不同的变量和运算符，并尝试用你学到的构建小型程序。\n\
    \n掌握了这些基础后，你就准备好进入 Java 编程更高级的主题了。在下一章，我们将探索 Java 中的控制流，包括条件判断和循环。这将使你能够编写可以决策和重复操作的更复杂的程序。\n"
- fmt: "\n# Chapter 4: Control Flow - Conditionals and Loops\n\nWelcome to Chapter\
    \ 4! Now that you’re familiar with Java syntax, variables, and data types, it’s\
    \ time to introduce some decision-making abilities to your programs. Think of\
    \ this chapter as teaching your Java code how to think for itself. We’ll dive\
    \ into control flow, which includes conditionals and loops. These concepts will\
    \ allow your programs to make decisions and repeat actions, making them much more\
    \ powerful and flexible.\n\n## Understanding Control Flow\n\nIn programming, control\
    \ flow is the order in which individual statements, instructions, or function\
    \ calls are executed or evaluated. In other words, control flow determines the\
    \ path your program takes as it runs. Without control flow statements, your code\
    \ would simply execute from top to bottom, which would be quite limiting. By using\
    \ conditionals and loops, you can control the flow of your program and make it\
    \ more dynamic and responsive.\n\n## Conditionals: if, else, and switch\n\nLet’s\
    \ start with conditionals. Conditionals are statements that allow your program\
    \ to execute certain code blocks based on whether a condition is true or false.\
    \ The most common conditional statements in Java are `if`, `else if`, and `else`.\n\
    \n### The if Statement\n\nThe `if` statement evaluates a condition (a boolean\
    \ expression) and executes a block of code if the condition is true. Here’s the\
    \ basic syntax:\n\n```java\nif (condition) {\n    // code to be executed if condition\
    \ is true\n}\n```\n\nFor example, let’s say you want to check if a number is positive:\n\
    \n```java\nint number = 10;\nif (number > 0) {\n    System.out.println(\"The number\
    \ is positive.\");\n}\n```\n\nIn this example, the condition `number > 0` is true,\
    \ so the code inside the `if` block is executed, and the message “The number is\
    \ positive.” is printed to the console.\n\n### The else Statement\n\nThe `else`\
    \ statement is used to execute a block of code if the condition in the `if` statement\
    \ is false. Here’s the syntax:\n\n```java\nif (condition) {\n    // code to be\
    \ executed if condition is true\n} else {\n    // code to be executed if condition\
    \ is false\n}\n```\n\nFor example, let’s check if a number is positive or negative:\n\
    \n```java\nint number = -5;\nif (number > 0) {\n    System.out.println(\"The number\
    \ is positive.\");\n} else {\n    System.out.println(\"The number is negative.\"\
    );\n}\n```\n\nIn this case, the condition `number > 0` is false, so the code inside\
    \ the `else` block is executed, and the message “The number is negative.” is printed\
    \ to the console.\n\n### The else if Statement\n\nThe `else if` statement is used\
    \ to specify a new condition to test if the first condition is false. You can\
    \ chain multiple `else if` statements to check multiple conditions. Here’s the\
    \ syntax:\n\n```java\nif (condition1) {\n    // code to be executed if condition1\
    \ is true\n} else if (condition2) {\n    // code to be executed if condition2\
    \ is true\n} else {\n    // code to be executed if all conditions are false\n\
    }\n```\n\nFor example, let’s check if a number is positive, negative, or zero:\n\
    \n```java\nint number = 0;\nif (number > 0) {\n    System.out.println(\"The number\
    \ is positive.\");\n} else if (number < 0) {\n    System.out.println(\"The number\
    \ is negative.\");\n} else {\n    System.out.println(\"The number is zero.\");\n\
    }\n```\n\nIn this example, the first two conditions are false, so the code inside\
    \ the `else` block is executed, and the message “The number is zero.” is printed\
    \ to the console.\n\n### The switch Statement\n\nThe `switch` statement is another\
    \ way to control the flow of your program based on the value of a variable. It’s\
    \ particularly useful when you have multiple conditions to check, and it can make\
    \ your code more readable than using multiple `if-else` statements. Here’s the\
    \ basic syntax:\n\n```java\nswitch (variable) {\n    case value1:\n        //\
    \ code to be executed if variable equals value1\n        break;\n    case value2:\n\
    \        // code to be executed if variable equals value2\n        break;\n  \
    \  // more cases…\n    default:\n        // code to be executed if none of the\
    \ cases match\n}\n```\n\nFor example, let’s use a `switch` statement to determine\
    \ the day of the week based on an integer value:\n\n```java\nint day = 3;\nswitch\
    \ (day) {\n    case 1:\n        System.out.println(\"Sunday\");\n        break;\n\
    \    case 2:\n        System.out.println(\"Monday\");\n        break;\n    case\
    \ 3:\n        System.out.println(\"Tuesday\");\n        break;\n    case 4:\n\
    \        System.out.println(\"Wednesday\");\n        break;\n    case 5:\n   \
    \     System.out.println(\"Thursday\");\n        break;\n    case 6:\n       \
    \ System.out.println(\"Friday\");\n        break;\n    case 7:\n        System.out.println(\"\
    Saturday\");\n        break;\n    default:\n        System.out.println(\"Invalid\
    \ day\");\n        break;\n}\n```\n\nIn this example, the variable `day` equals\
    \ 3, so the code inside the `case 3` block is executed, and the message “Tuesday”\
    \ is printed to the console.\n\n## Loops: for, while, and do-while\n\nLoops are\
    \ used to execute a block of code repeatedly based on a condition. They are incredibly\
    \ useful for tasks that require repetition, such as iterating over arrays or processing\
    \ user input. The most common loops in Java are `for`, `while`, and `do-while`.\n\
    \n### The for Loop\n\nThe `for` loop is used to execute a block of code a specific\
    \ number of times. It’s often used when you know in advance how many times you\
    \ want to repeat a task. Here’s the basic syntax:\n\n```java\nfor (initialization;\
    \ condition; update) {\n    // code to be executed\n}\n```\n\nFor example, let’s\
    \ print the numbers 1 to 5:\n\n```java\nfor (int i = 1; i <= 5; i++) {\n    System.out.println(i);\n\
    }\n```\n\nIn this example, the initialization `int i = 1` sets the starting value\
    \ of `i`. The condition `i <= 5` means the loop continues each iteration.\n\n\
    ### The while Loop\n\nThe `while` loop is used to execute a block of code repeatedly\
    \ as long as a condition is true. It’s often used when you don’t know in advance\
    \ how many times you need to repeat a task. Here’s the basic syntax:\n\n```java\n\
    while (condition) {\n    // code to be executed\n}\n```\n\nFor example, let’s\
    \ print the numbers 1 to 5:\n\n```java\nint i = 1;\nwhile (i <= 5) {\n    System.out.println(i);\n\
    \    i++;\n}\n```\n\nIn this example, the condition `i <= 5` is checked before\
    \ each iteration. The update `i++` increments the value of `i`.\n\n### The do-while\
    \ Loop\n\nThe `do-while` loop is similar to the `while` loop, but it guarantees\
    \ that the code block will be executed at least once, even if the condition is\
    \ false. Here’s the syntax:\n\n```java\ndo {\n    // code to be executed\n} while\
    \ (condition);\n```\n\nFor example, let’s print the numbers 1 to 5:\n\n```java\n\
    int i = 1;\ndo {\n    System.out.println(i);\n    i++;\n} while (i <= 5);\n```\n\
    \nIn this example, the code block is executed first, and then the condition `i\
    \ <= 5` is checked.\n\n## Break and Continue\n\nThe `break` and `continue` statements\
    \ are used to control the flow of loops. The `break` statement is used to exit\
    \ the loop prematurely, while the `continue` statement skips the rest of the code\
    \ inside the loop for the current iteration and proceeds to the next iteration.\n\
    \n### Break\n\nFor example, let’s use the `break` statement to exit a loop when\
    \ a certain condition is met:\n\n```java\nfor (int i = 1; i <= 10; i++) {\n  \
    \  if (i == 5) {\n        break;\n    }\n    System.out.println(i);\n}\n```\n\n\
    In this example, the loop prints the numbers 1 to 4. When `i` equals 5, the `break`\
    \ statement is executed, and the loop terminates.\n\n### Continue\n\nNow, let’s\
    \ use the `continue` statement to skip the current iteration when a certain condition\
    \ is met:\n\n```java\nfor (int i = 1; i <= 10; i++) {\n    if (i == 5) {\n   \
    \     continue;\n    }\n    System.out.println(i);\n}\n```\n\nIn this example,\
    \ the loop prints the numbers 1 to 10, except for 5. When `i` equals 5, the `continue`\
    \ statement is executed, and the loop proceeds to the next iteration without printing\
    \ 5.\n\n## Real-Life Scenarios\n\nControl flow statements are essential for writing\
    \ programs that can handle real-life scenarios. For example, consider a simple\
    \ program that checks the temperature and provides advice based on the value:\n\
    \n```java\nint temperature = 25;\nif (temperature > 30) {\n    System.out.println(\"\
    It’s hot outside! Stay hydrated.\");\n} else if (temperature >= 20 && temperature\
    \ <= 30) {\n    System.out.println(\"The weather is nice and warm.\");\n} else\
    \ {\n    System.out.println(\"It’s cold outside! Dress warmly.\");\n}\n```\n"
  raw: '# Chapter 4: Control Flow - Conditionals and Loops


    Welcome to Chapter 4! Now that you’re familiar with Java syntax, variables, and
    data types, it’s time to introduce some decision-making abilities to your programs.
    Think of this chapter as teaching your Java code how to think for itself. We’ll
    dive into control flow, which includes conditionals and loops. These concepts
    will allow your programs to make decisions and repeat actions, making them much
    more powerful and flexible.


    Understanding Control Flow


    In programming, control flow is the order in which individual statements, instructions,
    or function calls are executed or evaluated. In other words, control flow determines
    the path your program takes as it runs. Without control flow statements, your
    code would simply execute from top to bottom, which would be quite limiting. By
    using conditionals and loops, you can control the flow of your program and make
    it more dynamic and responsive.


    Conditionals: if, else, and switch


    Let’s start with conditionals. Conditionals are statements that allow your program
    to execute certain code blocks based on whether a condition is true or false.
    The most common conditional statements in Java are if, else if, and else.


    The if Statement


    The if statement evaluates a condition (a boolean expression) and executes a block
    of code if the condition is true. Here’s the basic syntax:


    if (condition) {


    // code to be executed if condition is true


    }


    For example, let’s say you want to check if a number is positive:


    int number = 10;


    if (number > 0) {


    System.out.println(“The number is positive.”);


    }


    In this example, the condition (number > 0) is true, so the code inside the if
    block is executed, and the message “The number is positive.” is printed to the
    console.


    The else Statement


    The else statement is used to execute a block of code if the condition in the
    if statement is false. Here’s the syntax:


    if (condition) {


    // code to be executed if condition is true


    } else {


    // code to be executed if condition is false


    }


    For example, let’s check if a number is positive or negative:


    int number = -5;


    if (number > 0) {


    System.out.println(“The number is positive.”);


    } else {


    System.out.println(“The number is negative.”);


    }


    In this case, the condition (number > 0) is false, so the code inside the else
    block is executed, and the message “The number is negative.” is printed to the
    console.


    The else if Statement


    The else if statement is used to specify a new condition to test if the first
    condition is false. You can chain multiple else if statements to check multiple
    conditions. Here’s the syntax:


    if (condition1) {


    // code to be executed if condition1 is true


    } else if (condition2) {


    // code to be executed if condition2 is true


    } else {


    // code to be executed if all conditions are false


    }


    For example, let’s check if a number is positive, negative, or zero:


    int number = 0;


    if (number > 0) {


    System.out.println(“The number is positive.”);


    } else if (number < 0) {


    System.out.println(“The number is negative.”);


    } else {


    System.out.println(“The number is zero.”);


    }


    In this example, the first two conditions are false, so the code inside the else
    block is executed, and the message “The number is zero.” is printed to the console.


    The switch Statement


    The switch statement is another way to control the flow of your program based
    on the value of a variable. It’s particularly useful when you have multiple conditions
    to check, and it can make your code more readable than using multiple if-else
    statements. Here’s the basic syntax:


    switch (variable) {


    case value1:


    // code to be executed if variable equals value1


    break;


    case value2:


    // code to be executed if variable equals value2


    break;


    // more cases…


    default:


    // code to be executed if none of the cases match


    }


    For example, let’s use a switch statement to determine the day of the week based
    on an integer value:


    int day = 3;


    switch (day) {


    case 1:


    System.out.println(“Sunday”);


    break;


    case 2:


    System.out.println(“Monday”);


    break;


    case 3:


    System.out.println(“Tuesday”);


    break;


    case 4:


    System.out.println(“Wednesday”);


    break;


    case 5:


    System.out.println(“Thursday”);


    break;


    case 6:


    System.out.println(“Friday”);


    break;


    case 7:


    System.out.println(“Saturday”);


    break;


    default:


    System.out.println(“Invalid day”);


    break;


    }


    In this example, the variable `day` equals 3, so the code inside the case 3 block
    is executed, and the message “Tuesday” is printed to the console.


    Loops: for, while, and do-while


    Loops are used to execute a block of code repeatedly based on a condition. They
    are incredibly useful for tasks that require repetition, such as iterating over
    arrays or processing user input. The most common loops in Java are for, while,
    and do-while.


    The for Loop


    The for loop is used to execute a block of code a specific number of times. It’s
    often used when you know in advance how many times you want to repeat a task.
    Here’s the basic syntax:


    for (initialization; condition; update) {


    // code to be executed


    }


    For example, let’s print the numbers 1 to 5:


    for (int i = 1; i <= 5; i++) {


    System.out.println(i);


    }


    In this example, the initialization `int i = 1` sets the starting value of `i`
    to 1\. The condition `i <= 5` means the loop will continue as long as `i` is less
    than or equal to 5\. The update `i++` increments the value of `i` by 1 after each
    iteration.


    The while Loop


    The while loop is used to execute a block of code repeatedly as long as a condition
    is true. It’s often used when you don’t know in advance how many times you need
    to repeat a task. Here’s the basic syntax:


    while (condition) {


    // code to be executed


    }


    For example, let’s print the numbers 1 to 5 using a while loop:


    int i = 1;


    while (i <= 5) {


    System.out.println(i);


    i++;


    }


    In this example, the loop continues as long as the condition `i <= 5` is true.
    The value of `i` is incremented by 1 after each iteration.


    The do-while Loop


    The do-while loop is similar to the while loop, but it guarantees that the code
    block will be executed at least once, even if the condition is false. Here’s the
    basic syntax:


    do {


    // code to be executed


    } while (condition);


    For example, let’s print the numbers 1 to 5 using a do-while loop:


    int i = 1;


    do {


    System.out.println(i);


    i++;


    } while (i <= 5);


    In this example, the code block is executed first, and then the condition `i <=
    5` is checked. If the condition is true, the loop continues.


    Break and Continue


    The break and continue statements are used to control the flow of loops. The break
    statement is used to exit the loop prematurely, while the continue statement skips
    the rest of the code inside the loop for the current iteration and proceeds to
    the next iteration.


    For example, let’s use the break statement to exit a loop when a certain condition
    is met:


    for (int i = 1; i <= 10; i++) {


    if (i == 5) {


    break;


    }


    System.out.println(i);


    }


    In this example, the loop prints the numbers 1 to 4\. When `i` equals 5, the break
    statement is executed, and the loop terminates.


    Now, let’s use the continue statement to skip the current iteration when a certain
    condition is met:


    for (int i = 1; i <= 10; i++) {


    if (i == 5) {


    continue;


    }


    System.out.println(i);


    }


    In this example, the loop prints the numbers 1 to 10, except for 5. When `i` equals
    5, the continue statement is executed, and the loop proceeds to the next iteration
    without printing 5.


    Real-Life Scenarios


    Control flow statements are essential for writing programs that can handle real-life
    scenarios. For example, consider a simple program that checks the temperature
    and provides advice based on the value:


    int temperature = 25;


    if (temperature > 30) {


    System.out.println(“It’s hot outside! Stay hydrated.”);


    } else if (temperature >= 20 && temperature <= 30) {


    System.out.println(“The weather is nice and warm.”);


    } else {


    System.out.println(“It’s cold outside! Dress warmly.”);


