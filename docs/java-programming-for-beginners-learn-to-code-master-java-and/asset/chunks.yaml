    Buffered streams are wrappers around byte and character streams that improve performance
    by reducing the number of I/O operations. They use an internal buffer to read
    and write data in larger chunks, which is more efficient than handling one byte
    or character at a time.


    Here’s an example of reading from a file using a BufferedInputStream:


    import java.io.BufferedInputStream;


    import java.io.FileInputStream;


    import java.io.IOException;


    public class Main {


    public static void main(String[] args) {


    try (BufferedInputStream bis = new BufferedInputStream(new FileInputStream(“example.txt”)))
    {


    int content;


    while ((content = bis.read()) != -1) {


    System.out.print((char) content);


    }


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    In this example, we wrap a FileInputStream with a BufferedInputStream, which reads
    data in larger chunks, improving performance.


    Here’s an example of writing to a file using a BufferedOutputStream:


    import java.io.BufferedOutputStream;


    import java.io.FileOutputStream;


    import java.io.IOException;


    public class Main {


    public static void main(String[] args) {


    try (BufferedOutputStream bos = new BufferedOutputStream(new FileOutputStream(“output.txt”)))
    {


    String data = “Hello, Java!”;


    bos.write(data.getBytes());


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    In this example, we wrap a FileOutputStream with a BufferedOutputStream, which
    writes data in larger chunks, improving performance.


    File and Directory Operations


    Java provides the File class for working with files and directories. The File
    class offers methods for creating, deleting, and querying files and directories.
    Here’s an example of how to use the File class:


    import java.io.File;


    import java.io.IOException;


    public class Main {


    public static void main(String[] args) {


    File file = new File(“newfile.txt”);


    // Create a new file


    try {


    if (file.createNewFile()) {


    System.out.println(“File created: " + file.getName());


    } else {


    System.out.println(“File already exists.”);


    }


    } catch (IOException e) {


    e.printStackTrace();


    }


    // Check if the file exists


    if (file.exists()) {


    System.out.println(“File exists: " + file.getName());


    }


    // Get file information


    System.out.println(“Absolute path: " + file.getAbsolutePath());


    System.out.println(“Writable: " + file.canWrite());


    System.out.println(“Readable: " + file.canRead());


    System.out.println(“File size in bytes: " + file.length());


    // Delete the file


    if (file.delete()) {


    System.out.println(“File deleted: " + file.getName());


    } else {


    System.out.println(“Failed to delete the file.”);


    }


    // Working with directories


    File dir = new File(“myDirectory”);


    // Create a new directory


    if (dir.mkdir()) {


    System.out.println(“Directory created: " + dir.getName());


    } else {


    System.out.println(“Failed to create the directory.”);


    }


    // List files in a directory


    String[] files = dir.list();


    if (files != null) {


    for (String filename : files) {


    System.out.println(“File: " + filename);


    }


    } else {


    System.out.println(“Directory is empty or does not exist.”);


    }


    }


    }


    In this example, we use the File class to create, check, and delete a file, as
    well as create a directory and list its contents. The File class provides a wide
    range of methods for file and directory manipulation, making it a versatile tool
    for handling file operations.


    Reading and Writing Text Files with BufferedReader and BufferedWriter


    When working with text files, using BufferedReader and BufferedWriter can make
    reading and writing more efficient and convenient. Here’s an example of reading
    a text file using BufferedReader:


    import java.io.BufferedReader;


    import java.io.FileReader;


    import java.io.IOException;


    public class Main {


    public static void main(String[] args) {


    try (BufferedReader br = new BufferedReader(new FileReader(“example.txt”))) {


    String line;


    while ((line = br.readLine()) != null) {


    System.out.println(line);


    }


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    In this example, we use BufferedReader to read the file “example.txt” line by
    line, making it easier to handle text files with multiple lines.


    Here’s an example of writing to a text file using BufferedWriter:


    import java.io.BufferedWriter;


    import java.io.FileWriter;


    import java.io.IOException;


    public class Main {


    public static void main(String[] args) {


    try (BufferedWriter bw = new BufferedWriter(new FileWriter(“output.txt”))) {


    String data = “Hello, Java!”;


    bw.write(data);


    bw.newLine(); // Add a new line


    bw.write(“This is another line.”);


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    In this example, we use BufferedWriter to write the string “Hello, Java!” and
    another line of text to the file “output.txt”. The newLine method adds a line
    break, making it easy to write multiple lines to a file.


