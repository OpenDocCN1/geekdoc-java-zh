    \ (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"Array\
    \ index is out of bounds!\");\n        } catch (Exception e) {\n            System.out.println(\"\
    An unexpected error occurred: \" + e.getMessage());\n        }\n    }\n}\n```\n\
    \n在这个示例中，第一个 `catch` 块处理 `ArrayIndexOutOfBoundsException`，第二个 `catch` 块处理其他异常。\n\
    \n### finally 块\n\n无论是否发生了异常，你都需要执行某些代码。这就是 `finally` 块的用武之地。\n\n`finally` 块在\
    \ `try` 和 `catch` 块之后总是执行，即使发生了异常也是如此。它通常用于清理活动，例如关闭文件或释放资源。这里有一个示例：\n\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        try\
    \ {\n            int result = 10 / 0; // 这将抛出 ArithmeticException\n        } catch\
    \ (ArithmeticException e) {\n            System.out.println(\"Cannot divide by\
    \ zero!\");\n        } finally {\n            System.out.println(\"This will always\
    \ be executed.\");\n        }\n    }\n}\n```\n\n在这个示例中，`finally` 块会在控制台打印“This\
    \ will always be executed.”，无论是否发生了异常。\n\n### 抛出异常\n\n除了捕异常，还可以可以使用 `throw` 关键字手动抛出异常。当你想要信号方法中发生了错误时，这非常有用。这里有一个示例：\n\
    \n```java\npublic class Main {\n    public static void main(String[] args) {\n\
    \        try {\n            checkAge(15); // 这将抛出 IllegalArgumentException\n \
    \       } catch (IllegalArgumentException e) {\n            System.out.println(\"\
    Caught an exception: \" + e.getMessage());\n        }\n    }\n\n    public static\
