    AVL TREES


    # 19.6 THE AVL TREE CLASS


    An AVL tree is a kind of binary search tree, so the AVLTree class should be a
    sub-class of the BinarySearchTree class. AVL nodes need an extra field for monitoring
    node balance factors. This field could be the balance factor itself, but it is
    simpler to add a height field to each BinarySearchTree node and calculate each
    node''s balance factor from its children''s height when it is needed.


    The AVLTree constructor should create only empty AVL trees. The insert() and delete()
    methods must be overridden to incorporate node height adjustment and rebalancing
    into these algorithms. The height() method (inherited through BinarySearchTree
    from BinaryTree) should also be overridden to take advantage of the fact that
    each node maintains its height. This changes the method from $\Theta(n)$ to an
    $\Theta(1)$ method.


    Both the insert() and delete() methods must make adjustments to nodes the path
    from the bottom of the tree to its root. This path may be maintained in a stack,
    but it is probably easier to implement these methods using recursion.


    # 19.7 SUMMARY AND CONCLUSION


    AVL trees are balanced binary search trees guaranteeing insertion, deletion, and
    search take $O(\lg n)$ time. Each node of an AVL tree has a balance factor, which
    is the difference between the heights of its sub-trees. The absolute value of
    the balance factor at each node of an AVL tree never exceeds one, meaning that
    the difference in height between any two sub-trees of a node is never more than
    one. This entails that the height of an AVL tree with more than two nodes is less
    than $1.5 \lg n$, where $n$ is the number of nodes in the tree.


    Insertion, deletion, and searching work as they do in binary search trees, except
    that after a node is added or removed the tree may need to be rebalanced. Rebalancing
    occurs at nodes along the path from the inserted or deleted node to the root,
    and is done by local transformations called rotations. There are four rotations
    applied based on the balance factors of the child nodes of the node where the
    imbalance occurs.


    An AVLTree class can be implemented as a sub-class of BinarySearchTree, with only
    three methods needing to be overridden.


