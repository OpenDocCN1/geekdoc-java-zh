    # GRAPHS


    Although a graph is really an ordered pair of sets, representing graphs this way
    is awkward and hard to read, as the examples above illustrate. Consequently we
    will always represent graphs as pictures.


    Both undirected and directed graphs are very important and widely applicable in
    computer science, but we will focus for the remainder of our discussion on undirected
    graphs. From now on we will refer to undirected graphs as simply *graphs*.


    # 25.3 BASIC TERMINOLOGY


    There are several additional terms that must be learned to talk about graphs.


    **Adjacency:** Vertices $v_i$ and $v_j$ in a graph $G=<V, E>$ such that $\{v_i,
    v_j\} \in E$.


    In Figure 2, vertices 0 and 1 and vertices 7 and 4 are adjacent, for example,
    vertices 0 and 4 and vertices 1 and 3 are not adjacent.


    ![](img/e42195b5740d05aee932ad08d883699d_224_0.png)


    **Figure 2:** A Graph


    **Path:** A sequence of vertices $p=<v_1, v_2, ..., v_n>$ in a graph where $n
    \ge 2$ and every pair of vertices $v_i$ and $v_{i+1}$ in $p$ are adjacent.


    **Length:** The number of edges in a path.


    In Figure 2, the paths $<0, 2, 3>$ and $<4, 7, 8>$ both have length two.


    **Cycle:** A path $<v_1, v_2, ..., v_n>$ in which $v_1 = v_n$ but no other vertices
    are repeated.


    **Cyclic graph:** A graph with a cycle of length at least three.


    In Figure 2, the paths $<0, 1, 0>$ and $<4, 7, 8>$ are cycles. Because the second
    has length three, the graph in Figure 2 is cyclic.'
