  md: '# 11.3 ESTABLISHING THE ORDER OF GROWTH OF A FUNCTION


    When confronted with the question of whether some function g is in $O(f)$, $\Omega(f)$,
    or $\Theta(f)$, we can use the definitions to decide directly, but there is an
    easier way embedded in the following theorem.


    > Theorem: (1) $g \in O(f)$ if $\lim_{n\to\infty} g(n)/f(n) = c$, for $c \geq
    0$;

    (2) $g \in \Omega(f)$ if $\lim_{n\to\infty} g(n)/f(n) = c$, for $c > 0$, or $\lim_{n\to\infty}
    g(n)/f(n) = \infty$;

    (3) $g \in \Theta(f)$ if $\lim_{n\to\infty} g(n)/f(n) = c$, for $c > 0$.


    For example, if $3n^2+2n-1$ is in $O(n^2)$, $\Omega(n^2)$, we need determine $\lim_{n\to\infty}
    (3n^2+2n-1)/n^2$;


    ```

    $\lim_{n\to\infty} (3n^2+2n-1)/n^2 = \lim_{n\to\infty} 3n^2/n^2 + \lim_{n\to\infty}
    2n/n^2 - \lim_{n\to\infty} 1/n^2\n= \lim_{n\to\infty} 3 + \lim_{n\to\infty} 2/n
    - 1 = 3$

    ```


    Because this limit is a constant greater than 0, we can conclude that $3n^2+2n-1
    \in O(n^2)$ and that $3n^2+2n-1 \in \Theta(n^2)$.


    A theorem that is very useful in solving limit problems is L''Hôpital\''s Rule:


    ![](img/e42195b5740d05aee932ad08d883699d_109_0.png)'
