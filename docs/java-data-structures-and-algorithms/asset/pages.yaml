    # 6 QUEUES


    # 6.1 INTRODUCTION


    Queues are what we usually refer to as lines, as in "please get in line for a
    free lunch." The essential features of a queue are that it is ordered and access
    to it is restricted to its ends: things enter a queue at the rear and leave the
    queue at the front.


    **Queue:** A dispenser holding a sequence of elements that allows insertion only
    at one end, called the back, or deletions of elements at the other end, called
    the front.


    Queues are also called first-in-first-out, FIFO, lists. Queues are important in
    computing because of the many cases where resources provide service on a first-come-first-served
    basis, such as jobs waiting for a printer, or processes waiting for the CPU in
    an operating system.


    # 6.2 THE QUEUE ADT AND INTERFACE


    Queues are containers holding values of some type. We must therefore speak of
    the ADT *queue of T*, where *T* is the type of elements held in the queue. The
    carrier set of this type is the set of all queues holding elements of type *T*.
    The carrier set includes the empty queue, the queue with one element of type *T*,
    the queues with two elements of type *T*, and so forth. The implicit-receiver
    method set of the type is the following, where *e is a T value.


    ```

    enter(e)—Add *e* to the rear of the queue.

    ```


    ```

    leave()—Remove and return the front element of the queue. The precondition of
    the *leave()* operation is that the queue is not empty.

    ```


    ```

    isEmpty()—Return the Boolean value true in case the queue is empty.

    ```


    ```

    front()—Return the front element of the queue without removing it. Like *leave()*,
    this operation has the precondition that the queue is not empty.

    ```


    The *Queue* interface is a sub-interface of *Dispenser*, which is a sub-interface
    of *Container*, so it already contains an *isEmpty()* operation inherited from
    *Container*. The *Queue* interface needs only operations for entering elements,
    removing elements, and peeking at the front element of the queue. The diagram
    in Figure 1 shows the *Queue* interface.'
