    # ## 24.1 INTRODUCTION


    As we have seen, hashing provides very fast (effectively Θ(1)) algorithms for
    inserting, deleting, and searching collections of key-value pairs. It is therefore
    an excellent way to implement maps. It also provides a very efficient way to implement
    sets.


    # ## 24.2 HASH TABLE CLASS


    A hash table is designed to store key-value pairs by the hash value of the key.
    A hash table class must therefore be generic in the type of both keys and values.
    Furthermore, hash tables must have operations sufficient to implement maps. Figure
    1 shows a UML diagram for a HashTable class meeting these requirements.


    ![](img/e42195b5740d05aee932ad08d883699d_217_0.png)


    **Figure 1:** A HashTable Class


    The type K must have values that can be hashed and compared for identity. There
    are no restrictions on the value type T. The HashTable class must allow key-value
    pairs to be inserted, deleted, searched, and iterated over various. The insert()
    method is used not only to add new key-value pairs to the hash table but to modify
    them as well: if a key is already in the table, calling insert() with that key
    should replace the existing value with the new value passed to the method. The
    iterator() method enumerates the values in the table and the keyIterator() method
    enumerates the keys. Neither keys nor values are enumerated in order, color. The
    get() method has as its precondition that the key is present in the table. The
    tableSize() method returns the number of slots in the table, and the size() method
    returns the number of pairs currently in the table.'
