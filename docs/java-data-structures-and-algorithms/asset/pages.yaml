  md: '# 22 MAPS


    # 22.1 INTRODUCTION


    A very useful collection is one that is a hybrid of lists and sets, called a map,
    table, dictionary, or associative array. A map (as we will call it), is a collection
    whose elements (which will refer to them as values) are unordered, like a set,
    whose values are accessible via a key, akin to the way that elements are accessible
    by indices.


    Map: An unordered collection whose values are accessible using a key.


    Another way to think of a map is as a function that maps keys to values (hence
    the name), like function in mathematics. As such, a map is a set of ordered pairs
    of keys and values such that each key is paired with a single value (though a
    map may be paired with several keys).


    # 22.2 THE MAP ADT


    Maps store values of arbitrary type with keys of arbitrary type, so the ADT is
    map of (K, T), where K is the type of the keys and T is the type of the values
    in the map. The carrier of this type is the set of all ordered pairs whose first
    element is of type K and whose second element is of type T. The carrier set includes
    the empty map, the maps with one ordered pair of values of types K and T, the
    maps with two ordered pairs of values of types K and T, and so forth.


    The essential implicit-receiver operations of maps, in addition to those common
    to all collections, are for inserting, deleting, searching and retrieving keys
    and values.


    +   - isEmpty()—Return true if and only if the map is empty.

    - size()—Return the number of pairs in the map.

    - hasKey(k)—Return true if and only if the map contains an ordered pair whose
    first element is k.

    - hasValue(v)—Return true if and only if the map contains an ordered pair whose
    second element is v.'
