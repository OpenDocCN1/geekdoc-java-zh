    Characters and strings in Java provide an interesting illustration of the relationships
    between abstract data types and their implementations using data structures and
    algorithms; we will be focusing in particular on the way ADT carrier sets are
    realized in data structures.


    The character ADT has a set of symbols as its carrier set and operations for classifying
    symbols (for example, as space characters or digits) and mapping them from one
    to another (for example, an operation to change a letter to uppercase) in its
    method set. The character ADT implemented in Java was originally intended to have
    as its carrier set all of symbols in the world''s languages, mathematical symbols
    and various decorative symbols described in the Unicode Standard. This standard
    is an international agreement representing symbols in computers that is essentially
    an assignment of a number, called a Unicode code point, to every symbol included
    in the standard (www.unicode.org).


    When Java was originally released in 1995, the Unicode Standard included only
    characters from modern languages, which numbered less than 24. The Java char type
    was designed to use a two byte (16-bit) representation for Unicode characters,
    which was more than sufficient at the time. The String class also used this representation,
    and it was an easier to convert char into String objects. However, in 1996 the
    Unicode consortium decided to expand Unicode to include rarely used and historic
    characters. Currently the Unicode standard specifies over 120,000 characters and
    code points ranges from 0 to 1,114,111. This number is 0FFFF in hexadecimal, so
    it requires 18 bits when represented in base two.


    This change presented a challenge to the designers of Java. A 16-bit format was
    no longer adequate to represent all Unicode characters, either the handling of
    all Unicode characters in Java had to be abandoned, or the way would have to be
    modified. The latter alternative presented serious problems. The char type is
    specified in the language as having a 16-bit representation, and Java escape characters
    are specified as consisting of \u by four hexadecimal characters (specifying 16
    bits of data). Changing these specifications would break many existing Java programs.
    On the other hand, the String and Character classes are defined by their interfaces,
    these are the constants and methods that they provide. The hidden implementation
    of Java strings could be changed, and these classes could be supplemented with
    new methods.


    In the end, the Java designers decided to keep the specification of the char type
