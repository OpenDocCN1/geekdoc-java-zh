    Recall from our discussion of iteration in Chapter 8 that this can be done with
    internal iteration (control is in the collection) or external iteration (control
    is in an iterator). The **BinaryTree** class has methods for creating external
    iterators and for internal iteration. Internal iteration is done by packaging
    the processing that a client wants to do in some way, and passing the packaged
    process to the collection for application to its elements. In this case, clients
    write a class implementing the *Visitor* interface, with the processing done by
    a `visit()` method. An instance of this is then passed to `visitPreorder()`, `visit
    inorder()`, or `visitPostorder()` (depending on the order in which vertices are
    to be visited,) which apply the `visit()` method to every value in the binary
    tree.


    # ## 17.4 CONTIGUOUS IMPLEMENTATION OF BINARY TREES


    We have already considered how to implement binary trees using an array when we
    learned about heapsort. The contiguous implementation is excellent for complete
    or full binary trees because it wastes space on references and it provides a quick
    and easy way to navigate in the tree. Unfortunately, in most applications binary
    trees are far from complete, so many array locations are never used, which wastes
    a lot of space. Even if our binary trees were always complete, there still remains
    the problem of predicting the size of the tree to allocate an array big to to
    hold all the tree vertices. The array could be reallocated if the tree becomes
    too large, but this is an expensive operation.


    This is why it is not particularly useful to have a contiguous implementation
    of binary trees. The **BinaryTree** class will use a linked data structure to
    represent binary trees, and this class will be the basis for other collection
    types that use binary trees to hold collection data.'
