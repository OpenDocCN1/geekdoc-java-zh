- img_proc: true
  md: '# JAVA DATA STRUCTURES ALGORITHMS


    On the other hand, the tallest tree holding the fewest values would have only
    2-nodes. A tree with 2-nodes has 2-node at the root, two-nodes at level one, four-nodes
    at level two, and in general, $2^k$ nodes at level $h$. There is one value stored
    in each node, so the number of values stored in the entire tree


    ```

    $$\sum_{i=0}^{h} 2^i = 2^{h+1}-1$

    ```


    Hence we have the following relationship between the $n$ values in a 2-3 tree
    and its height $h$.


    ```

    $2^{h+1}-1 \le n$ and $n \le 3^{h+1}-1$

    $2^{h+1} \le n+1$ and $n+1 \le 3^{h+1}$

    $h+1 \le \log_2(n+1)$ and $\log_3(n+1)$

    $\log_3(n+1) \le h+1 \le \log_2(n+1)-1$

    ```


    In other words, the height of a tree with $n$ values begins as (roughly) between
    $\log_3 n$ and $\log_2 n$, which means the height grows faster than $\lg n$. This
    implies that the height of a 2-3 tree is in $\Theta(\lg n)$. Therefore any operation
    that takes time proportional to the height of a 2-3 tree with $n$ values is in
    $\Theta(\lg n)$.


    Lets search in a 2-3 tree. At each node, at most two nodes must be compared to
    the search value, and the search either halts successfully or continues in one
    of the sub-trees of the node. This continues until either the search value is
    found or the bottom of the tree is reached. The number of comparisons is thus
    at most $2·(h+1)$ which we know from the argument is in $O(\lg n)$.


    We will see that insertion and deletion in 2-3 trees are also done in time proportional
    to the height of the tree, and are also in $\Theta(\lg n)$.


    # 20.3 INSERTION IN 2-3 TREES


    Inserting into a 2-3 tree begins the way that binary tree and AVL tree insertion
    does: starting at the root, the key is compared to node values to follow a path
    down the tree until arriving at the bottom, where the inserted value is placed
    in a leaf node. If the leaf node is 2-node, then the leaf becomes a 3-node and
    the operation is complete. If the node is 3-node, then inserting a value into
    it makes it into a 4-node, which of course is not allowed in a 2-3 tree. In this
    case, the 4-node (which has two values and four empty sub-trees), is split into
    2-nodes: the middle value of the 4-node becomes a new 2-node whose left sub-tree
    is a 2-node holding the left-most value in the 4-node, and whose right sub-tree
    is 2-node holding the right-most value in the 4-node. This transformation is shown
    below in Figure 2.'
  merge: -1
