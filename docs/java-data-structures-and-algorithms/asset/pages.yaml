    # 10.6 SUMMARY AND CONCLUSION


    We define the various kinds of complexity we have discussed as follows.


    **Computational complexity:** The time (and perhaps the space) requirements of
    an algorithm.


    **Every-case complexity C(n):** The number of basic operations performed by an
    algorithm as a function of the size of its input $n$ when this value is the same
    for any input of size $n$.


    **Worst case complexity W(n):** The maximum number of basic operations performed
    by an algorithm for any input of size $n$.


    **Best case complexity B(n):** The minimum number of basic operations performed
    by an algorithm for any input of size $n$.


    **Average case complexity A(n):** The average number of basic operations performed
    by an algorithm for all inputs of size $n$, given assumptions about the characteristics
    of inputs of size $n$.


