    \ first pass through the list, selection sort makes n-1 comparison; on the next\
    \ pass, it makes n-2 comparisons; on the third, it makes n-3 comparisons, and\
    \ so forth. It makes n-1 passes altogther, so its complexity is\n\n```\nC(n) =\
