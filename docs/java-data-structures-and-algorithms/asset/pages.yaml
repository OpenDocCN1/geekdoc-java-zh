  md: '# 15.4 IMPROVEMENTS TO QUICKSORT


    Quicksort''s worst behavior is abysmal, and because it occurs for sorted or nearly
    sorted lists, which are often encountered, this is a big problem. Many solutions
    to this problem have been proposed; one of the simplest is called the median-of-three
    improvement, and it consists of using the median of the first, last, and middle
    values as the pivot element. Except in rare cases, this technique produces a pivot
    value that ends up near the middle of the sub-list when it is partitioned, especially
    if the sub-list is sorted or nearly sorted.


    A version of quicksort with the median-of-three improvement appears in Figure
    3. In this code, once the first, middle, and last elements of a sub-list are put
    in order (and assuming there are more than three elements in the sub-list), the
    median is swapped into the next-to-last location and used as the pivot; otherwise,
    the algorithm is unchanged.


    The median-finding process also allows sentinel values to be placed at the ends
    of the sublist, which speeds up the partitioning algorithm a little bit because
    array indices do not need to be checked.


    Sentinel value: a special value placed in a data structure to mark a boundary.


