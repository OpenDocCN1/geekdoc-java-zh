  md: '# BUILT-IN TYPES


    # 2.1 SIMPLE AND STRUCTURED TYPES


    Virtually every programming language has implementations of several ADTs built
    into it. We distinguish two kinds of built-in:


    +   - Simple types: The values of the carrier set are atomic, that is, they cannot
    be divided into parts. Common examples of simple types are integer, Boolean, character,
    floating point, and enumerations. Some languages also provide string as a built-in
    type.

    - Structured types: The values of the carrier set are not atomic, consisting instead
    of several atomic or structured values arranged in some way. Common examples of
    structured types are arrays, records, classes, and sets. Some languages treat
    string as a built-in structured type.


    Note that both simple and structured types are implementations of ADTs; the distinction
    is simply a question of how the programming language treats the values of the
    carrier set of the ADT in its implementation. The remainder of this chapter considers
    simple and structured types and uses Java to illustrate these ideas.


    # 2.2 SIMPLE TYPES IN JAVA


    Java has a typical collection of simple types similar to those of many other popular
    imperative languages. The Java language specification calls these primitive types.
    The simplest primitive type is boolean, which (as noted above) implements the
    Boolean ADT. The char type has a subset of Unicode characters as its carrier set
    (Unicode is a standard for representing the characters used in most languages
    in the world). The char type method is accessible through the Character class
    and includes operations for testing properties of a character (such as whether
    it is a digit or it is uppercase), and converting characters to other types or
    other characters (such as making a character uppercase).


    Java has four integer types (byte, short, int, and long) which differ in the number
    of bits they use to represent carrier set values, and therefore in the size of
    their carrier sets. Their method sets are the same. Java has two floating point
    types (float and double) which again differ only in the number of bits they use
    to represent carrier set values, which determines the range and the precision
    with which they can represent real numbers. The carrier sets of both types include
    five special values: positive and negative infinity, positive'
