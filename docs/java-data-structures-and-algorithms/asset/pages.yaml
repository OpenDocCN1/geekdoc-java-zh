    # 19.5 THE EFFICIENCY OF AVL rebalancing OPERATIONS


    During insertion, at most one rebalancing operation is needed along the path to
    the root. In deletion, a rebalancing operation may be needed for many nodes on
    the path from the deleted node to the root. Nevertheless, all node factor adjustments
    and rotations are made only on nodes in the path from the bottom of the tree where
    a node is removed to the root, which contains fewer than 1.5 lg n nodes, as noted
    before. With insertion, all deletions occur at a leaf, and the shortest path from
    the root is proportional to lg n, so at least Θ(lg n) nodes must be processed.
    Hence the every case complexity of deletion is in Θ(lg n).


    AVL trees are binary search trees, and searching works exactly as it does in ordinary
    binary search trees. The best case complexity of this operation is Θ(1) when the
    desired value is at the root. The worst case complexity of searching an ordinary
    binary search tree is n because the tree may have height n. But AVL trees have
    height bounded by 1.5 lg n, so the worst case complexity of searching is in Θ(lg
    n). It turns out that the average case complexity for searching an AVL tree is
    also in Θ(lg n). We see that insertion, deletion, and searching in AVL trees all
    take O(lg n) time, so AVL trees are in ideal data structure for applications where
    all three of these operations must be efficient.


