    # GRAPHS


    ![](img/e42195b5740d05aee932ad08d883699d_229_0.png)


    Figure 5: Adjacency Lists Representation of a Graph


    Notice that the adjacency lists representation, like the adjacency matrix representation,
    records every {v, w} twice: once on the list for the edges adjacent to v and once
    on the list for the edges adjacent to w.


    The adjacency lists data structure uses space proportional to the number of vertices
    and edges (the array has space for every vertex, and there are twice as many nodes
    in the linked lists as there are edges in the graph). This is typically much less
    than the space required for the adjacency matrix representation. Also, adding
    an edge takes Θ(1) time and determining whether there is an edge between vertices
    takes time proportional to the number of edges emanating from (one of) the vertices:
    this is O(e where e is the number of edges in the graph in the worst case, but
    typically it is much. Thus the adjacency lists representation uses relatively
    little space but is still quite efficient.


    In implementing adjacency lists it is convenient to use the linked list from Container
    hierarchy to realize each adjacency list. The adjacent array then holds linked
    lists implementing the List interface rather than references to nodes.


    # 25.8 SUMMARY AND CONCLUSION


    Graphs are an important modeling tool in computing. The graph ADT provides a few
    operations for building and querying a graph and this is carried into the Graph
    interface. The adjacency matrix technique for representing graphs makes operations
    efficient but uses much less space. The adjacency lists approach is nearly as
    fast but but uses much less space. As a rule, unless a graph is dense or has a
    small number of nodes (say, less than a hundred), the adjacency lists representation
    is preferable.


