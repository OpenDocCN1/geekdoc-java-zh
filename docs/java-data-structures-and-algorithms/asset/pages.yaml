  md: '# 18 BINARY SEARCH AND BINARY SEARCH TREES


    # 18.1 INTRODUCTION


    Binary search is a much faster alternative to sequential search for sorted lists.
    Binary search is closely related to binary search trees, which are a special kind
    of binary tree. We will look at these two topics in this chapter, studying the
    complexity of binary search, and eventually arriving at a specification for a
    BinarySearchTree class.


    # 18.2 BINARY SEARCH


    When people search for something in an ordered list (like a dictionary or a phone
    book), they do not start at the first element and march through the list one element
    at a time. They jump to the middle of the list, see where they are relative to
    what they are looking for, and then jump either forward or backward and look again,
    continuing in this way until they find what they are looking for, or determine
    that it is not in the list.


    ![](img/e42195b5740d05aee932ad08d883699d_163_0.png)'
