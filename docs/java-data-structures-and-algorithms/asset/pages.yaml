    # LISTS


    Using a cursor with a doubly-linked list can speed things up considerably because
    the links make it possible to move both backwards and forwards in the list. If
    an operation needs to get to node $i$ and the cursor marks node $j$, which is
    closer to node $i$ than node $i$ is to the head of the list, following links from
    the cursor can get to node $i$ more quickly than following links from the head
    of the list. Keeping a reference to the end of the list makes things faster still:
    it is possible to start walking towards a node from three points: the front of
    the list, the end of the list, or the cursor, which is often somewhere in the
    middle of the list.


    Another trick is to make the list circular: have the `pred` link of the first
    node refer to the last node rather than containing null, and have the `succ` link
    of the last node refer to the first node rather than containing null. There is
    then no need for a separate reference to the end of the list: the `head` reference
    can be used to get both the front and the rear of the list. This obviates the
    need for a pointer to the end of the list.


    To illustrate, consider the code in Figure 3 below for setting the cursor in a
    doubly-linked circular list with a dummy node. Setting the cursor is done in almost
    every list operation, so it is important to make this code efficient.


