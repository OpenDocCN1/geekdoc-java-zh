    # # 10 ANALYZING ALGORITHMS


    # ## 10.1 INTRODUCTION


    We have so far been developing algorithms in implementing ADTs without worrying
    too much about how good the algorithms are, except perhaps to point out in a vague
    way that certain algorithms will be more or less efficient in certain circumstances
    than others. We have not considered in any rigorous and careful how efficient
    our algorithms are in terms of how work they need to do and how much memory they
    consume; We have not done a careful algorithm analysis.


    **Algorithm analysis:** The process of determining, as precisely as possible,
    how much of various resources (such as time and memory) an algorithm consumes
    when it executes.


    In this chapter we will lay out an approach for analyzing algorithms and demonstrate
    how to use it on several simple algorithms. We will mainly be concerned with analyzing
    the amount of work done by algorithms; occasionally we will consider how much
    memory they consume as well.


    ![](img/e42195b5740d05aee932ad08d883699d_97_0.png)


