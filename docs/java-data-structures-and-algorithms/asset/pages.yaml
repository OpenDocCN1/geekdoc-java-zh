  md: '# 25.2 DIRECTED AND UNDIRECTED GRAPHS


    We defined a graph in the course of discussing trees in Chapter 16.


    +   **Graph:** A collection of vertices (or nodes) and edges connecting the nodes.
    An edge may be thought of as a pair of vertices. Formally, a graph is an ordered
    pair <V, E> where $V$ is a set of vertices and $E$ is a set of elements of $V$.


    +   **Undirected graph:** A graph in which the edges are set of two vertices.
    In this case the edges have no direction and are represented by line segments
    when we draw pictures of them.


    +   **Directed graph or digraph:** A graph in which the edges are ordered pairs
    of vertices. In this case the edges have no direction and are represented by arrows
    in pictures of them.


    To illustrate these definitions, consider the images of graphs in Figure 1.


    ![](img/e42195b5740d05aee932ad08d883699d_223_0.png)


    Figure 1: Two Graphs


    In these images the vertices are identified by circled numbers. In general we
    may use any symbol to identify vertices, but as a rule we will use an initial
    set of natural numbers (that is, any {0, 1, 2, ..., $n$ where $n \ge 0$). The
    graph on the left is an undirected graph so its edges have no arrows. In its representation,
    this graph is


    ```

    <0, 1, 2, 3, 4}, {0,1}, {0,2}, {1,2}, {1,4}, {2,3}>

    ```


    The graph on the right is a directed graph, so it has arrows on its edges. Note
    that this allows edges from a node to itself (such as the edge from 4 to itself),
    and two distinct edges between a pair of vertices (such as the two edges connecting
    1 and 2); neither of these can occur in an undirected graph. The representation
    of the right-hand graph is


    ```

    <0, 1, 2, 3, 4}, <1,0>, <1,2>, <2,0>, <2,1>, <2,3>, <3,4>, <4,4>, <5,1>>

    ```


    Note that the edge set in the left-hand graph is a set of vertices while the edge
    set in the right-hand graph is a set of ordered pairs.'
