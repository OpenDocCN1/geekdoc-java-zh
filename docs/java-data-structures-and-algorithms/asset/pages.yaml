    # BUILT-IN TYPES


    # 2.4 ARRAYS


    A structured type of fundamental importance in almost every imperative programming
    language is the array.


    Array: A fixed length, ordered collection of values of the same type stored in
    contiguous memory locations; the collection may be ordered in several dimensions.


    The values stored in an array are called elements. Elements are accessed by indexing
    into the array: an integer value is used to indicate the ordinal value of the
    element. For example, if a is an array with 20 elements, a[6] is the element with
    ordinal 6. Indexing may start at any number, but generally (and in Java particular),
    it starts at 0. Thus a[6] is the seventh value in a when indexing starts at 0.


    Arrays are important because they allow many values to be stored in a single data
    structure while providing fast access to each value. This is made possible by
    the fact that (a) all values in an array are the same type, and require the same
    amount of memory to store, and (b) elements are stored in contiguous memory locations.
    Accessing a[i] requires finding the location where the element is stored. This
    is done by computing b + (i x m) where m is the size of an array element, and
    b is the base address of array a. This computation is very fast. Furthermore,
    by starting a counter b and incrementing it by m, yielding the location of each
    element in turn, which is also very fast.


    Arrays are not abstract data types because their arrangement in the physical memory
    of a computer is an essential feature of their definition, while abstract data
    types abstract from all details of implementation on a computer. Nonetheless,
    we can discuss arrays in a "semi-abstract" fashion that ignores some implementation
    details. The definition omits details about how elements are stored in contiguous
    locations (which indeed does vary among languages). Also, arrays are typically
    types in procedural programming languages, they are treated as realizations of
    abstract data types though they are really not. In this book, we treat arrays
    as implementation mechanisms and not ADTs.


    In some languages, the size of an array must be established once and for all storage
    the array is allocated and cannot change thereafter. Such arrays are called fixed
    or static arrays. A chunk of memory enough to hold all the values in the array
    is allocated when the array is created, and thereafter elements are accessed using
    the fixed base location of the array. Static arrays are the fundamental array
    type in most older procedural languages, such as Fortran, Basic, and C, and in
    many newer object-oriented languages as well, including Java.'
