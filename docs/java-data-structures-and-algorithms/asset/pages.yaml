  md: '4. Every edge in a graph is represented twice in both the adjacency matrix
    and adjacency lists representations because in each case the representation “indexes”
    edges by their vertices. Because each edge has two vertices, each appears twice.
    Note that we could easily come up with representations in which an edge appears
    only once. For example, we could put the smaller of the two vertices of an edge
    into the adjacency array in both the adjacency matrix and adjacency lists representations.
    This would save about half the space, but it would make iterating over the vertices
    adjacent to a given vertex (which turns out to be a very important operation)
    very slow: we would have to search the entire representation to find all the vertices
    adjacent to a given vertex. So in this case space is traded for time, and we use
    more space to get much faster performance in an essential operation.'
