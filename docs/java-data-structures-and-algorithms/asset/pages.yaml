    +   Although binary trees have a contiguous implementation (discussed below),
    it is not useful except for heaps. Providing such an implementation in line with
    our practice of providing both contiguous and linked implementations of all containers
    would create an entity without much use.


    We make a BinaryTree class but its role will be to provide an implementation mechanism
    for other collections. Thus the BinaryTree class is not part of the container
    hierarchy, though there is one standard Container operations. It also includes
    operations for accessing and traversing trees in various ways, as well several
    kinds of iterators. The BinaryTree class is pictured in Figure 2.


    Note that there is no newTree() method and no newEmptyTree() method in the BinaryTree
    class, though there is one in the ADT. The BinaryTree constructor does the job
    of these two operations, so they are not needed as separate operations in the
    class.


    To visit or enumerate the vertices of a binary tree is to traverse or iterate
    over them at a time, processing the values held each vertex. This requires that
    the vertices be traversed in some order. There are three fundamental orders for
    traversing a binary tree. All are most naturally described in recursive terms.


