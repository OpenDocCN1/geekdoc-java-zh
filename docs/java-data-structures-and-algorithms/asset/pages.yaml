    LISTS


    # 9.4 CONTIGUOUS IMPLEMENTATION OF THE LIST ADT


    Lists are very easy to implement with arrays. Static arrays impose a maximum list
    size, while dynamic arrays allow lists to grow without limit. The implementation
    is similar in either case. An array allocated to hold the elements of the list,
    with the elements placed into the array in order so that the element at index
    $i$ of the list is at index $i$ of the array. A counter maintains the current
    size of the list. Elements added at index $i$ require that the elements in the
    slice from $i$ to the end of the array be moved upwards to make a “hole” into
    which the inserted value is placed. When element $i$ is removed, the slice from
    $i+1$ to the end of the list is copied down to close the hole left when the value
    at index $i$ is removed.


    Static arrays have their size at compile time so an implementation using a static
    array cannot accommodate lists of arbitrary size. In contrast, an implementation
    using a dynamic array can allocate a larger array if it exceeds the capacity of
    the current array during execution. Reallocating the array is an expensive operation
    because the new, larger array must be created, the contents of the old, smaller
    array must be copied into the new array, and the old array must be deallocated.
    To avoid this expense, the number of array reallocations should be kept to a minimum.
    One popular approach is to double the size of the array whenever it needs to be
    larger. For examples, suppose a list begins with a capacity of 10. As it expands,
    its capacity is changed to 20, 40, 80, and so forth. The array never becomes smaller.


    Iterators for lists implemented with an array are also very easy to code. The
    iterator merely keep a reference to the list and the current index during iteration,
    which acts as a cursor marking the current element during iteration.


    **Cursor:** A variable marking a location in a data structure.


    The element at index $i$ of an array is almost instantaneous, the `get()` and
    `put()` operations are very fast using a contiguous implementation. Adding and
    removing elements requires moving slices of the list or down in the array, which
    can be slow. For applications where elements are often accessed but not too often
    added or removed, the contiguous implementation will be very efficient; applications
    that have the opposite behavior will be much less efficient, especially if the
    lists are long.


    # 9.5 LINKED IMPLEMENTATION OF THE LIST ADT


    A linked implementation of the list ADT uses a linked data structure to represent
    values of the ADT carrier set. A singly- or multiply-linked list may be used,
    depending on the needs of clients. We will consider using singly- or doubly-linked
    lists to illustrate implementation alternatives.


