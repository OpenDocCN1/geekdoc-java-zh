    QUEUES


    A Java class realizing this implementation might be called ArrayQueue<T>. It would
    implement the Queue<T> interface (which extends the Container interface) and have
    a store array and integer front and count variables as private fields. The queue
    operations would be public methods. Its constructor would create an empty queue.
    The capacity would be the length of the store array, which Java keeps track of.


    # 6.6 LINKED IMPLEMENTATION OF THE QUEUE ADT


    A linked implementation of a queue ADT uses a linked data structure to represent
    values of the ADT carrier set. A singly linked list is all that is required, so
    nodes need only contain a value of T and a link to the next node. We could keep
    a reference to the head of the list, but this would require moving down the list
    from its head to its tail whenever an operation required manipulation of the other
    end of the queue, so it is more efficient to keep a reference to each end of the
    list. We will use both frontPtr and rearPtr to keep track of ends of the list.


    If rearPtr refers to the head of the list and frontPtr to its tail, it would be
    impossible to remove elements from the queue without walking down the list from
    head; in other words, we would have gained nothing but using an extra reference.
    We must have frontPtr refer to the head of the list, and rearPtr to its tail.
    Figure 4 illustrates this data structure. Each node has an item field (for values
    of T) and a next field (for the links). The figure shows a queue with three elements.
    The queue is empty when the frontPtr and rearPtr references are null; the queue
    never becomes full (unless memory is exhausted).


    ![](img/e42195b5740d05aee932ad08d883699d_61_0.png)


    Figure 4: Implementing a Queue With a Linked List


    Implementing the operations of the Queue ADT using a linked data structure is
    quite simple, though care must be taken to keep frontPtr and rearPtr synchronized.
    For example, to implement the leave() operation, a check is first that the queue
    is not empty—if it is an exception is raised. If not, the item field of the front
    node is assigned to a temporary variable. The frontPtr field is then assigned
    the next field of the first node, which removes the first node from the list.
    If frontPtr is null, then the rearPtr must also be assigned null. Finally, the
    value saved in the temporary variable is returned.


