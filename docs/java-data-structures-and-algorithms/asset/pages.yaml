    # BINARY TREES


    Implementing external iterators is more challenging, however. The problem is that
    external iterators cannot be written recursively because they will have to stop
    every time a new node is visited to deliver the value to the client. There are
    two ways to solve this problem:


    +   - Write a recursive operation to copy node values into a queue in the correct
    order and then extract items from the data structure one at a time as the client
    requests them.

    - Don''t use recursion to implement iterators: use a stack instead.


    The second alternative, though a little harder, is better because it uses much
    less space.


    # 17.6 SUMMARY AND CONCLUSION


    The binary tree ADT describes basic operations for building and examining binary
    trees whose vertices hold values of type T. A BinaryTree class has several methods
    not in the ADT, in particular, internal iterator methods that apply a method (in
    a Visitor object) to every value in the tree in some order, and external iterator
    factory methods.


