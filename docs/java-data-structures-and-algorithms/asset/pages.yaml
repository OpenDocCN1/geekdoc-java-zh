  md: '# JAVA DATA STRUCTURES AND ALGORITHMS ANALYZING ALGORITHMS


    In counting the number of operations required to do this task, you probably noticed
    that the number of operations is related to the size of the problem: subtracting
    three digit numbers between six and eight operations (three comparison, three
    subtractions, and zero to borrows), while subtracting nine digit numbers between
    18 and 26 operations (nine comparisons, nine subtractions, and zero to borrows).
    In general, for n digit numbers, between 2n and 3n-1 operations are required.


    How did the algorithm analysis we just did? We simply figured out how many operations
    were done in terms of the size of the input to the algorithm. We will adopt this
    general approach for deriving measure of work done by an algorithm:


    > To analyze the amount of work done by an algorithm, produce measures that express
    a count of the operations done by an algorithm as a function of the size of the
    input to the algorithm.


    # 10.3 THE SIZE OF THE INPUT


    To specify the size of the input to an algorithm is usually fairly obvious. For
    example, the size of the input to an algorithm that searches a list will be the
    size of the list, because it is obvious that the size of the list, as opposed
    to the type of its contents, or some other characteristic, what determines how
    we work an algorithm to search it will do. Likewise for algorithms to sort a list.
    An algorithm to raise b to the power k (for some constant b) obviously depends
    on k for the amount of work it will do.


    # 10.4 WHICH OPERATIONS TO COUNT


    In most cases, certain operations are far more often than others by an algorithm.
    For example, in searching and sorting algorithms, some initial assignment and
    arithmetic operations are done, the operations that are done by the most often
    are loop control variable comparisons, and key comparisons. These are (usually)
    each done approximately the same number of times, so we can simply count key comparisons
    as a stand-in for the others. Thus counts of key comparisons are traditionally
    used as the measure of work done by searching and sorting algorithms.


    This technique is also part of the standard approach to analyzing algorithms:
    one or perhaps two basic operations are identified and counted as a measure of
    the amount of work done.


    +   Basic operation: An operation fundamental to an algorithm used to measure
    the amount of work done by the algorithm.'
