    In analyzing this algorithm, the measure of the size of the input is, of course,
    length of the list sorted, and the operations counted are key comparisons. Key
    comparison occurs in the merging step: the smallest items in the merged sub-lists
    are compared, and the smallest is moved into the target list. This step is repeated
    until one of the sub-lists is exhausted, in which case the remainder of the other
    sub-list is copied into the target list.


    Merging does not always take the same amount of effort: it depends on the contents
    of the sub-lists. In the best case, the largest element in one sub-list is smaller
    than the smallest in the other (which occurs, for example, when the input list
    is already sorted). If we make this assumption, along with the simplifying assumption
    that $n=2^k$, then the recurrence relation for the number of comparisons in the
    best case is


    ```

    $B(n) = n/2 + 2 \cdot B(n/2)$

    $= n/2 + 2 \cdot (n/4 + 2 \cdot B(n/4)) = 2 \cdot n/2 + 4 \cdot B(n/4)$

    $= 2 \cdot n/2 + 4 \cdot (n/8 + 2 \cdot B(n/8)) = 3 \cdot n/2 + 8 \cdot B(n/8)$

    $=

    = i \cdot n/2 + 2^i \cdot B(n/2^i)$

    ```


    The initial condition for the best case occurs when $n$ is one or zero, in which
    case no comparisons are made. If let $n/2^i = 1$, then $i = \lg n$. Substituting
    this into the equation above, we have


