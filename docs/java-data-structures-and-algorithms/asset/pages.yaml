    one must iterate through the key-value pairs and examine each value in the pair,
    which is slow. This is what must be done to implement the contains() method, which
    asks about a particular value. On the other hand, the get() method uses a key
    to find its associated value. This is fast because the key is hashed to find the
    key-value pair, and then the value is extracted from the pair.


