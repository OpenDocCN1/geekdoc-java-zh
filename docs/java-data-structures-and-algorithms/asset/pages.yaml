    \ policy is used, the number of slots in the array doubles when the number of\
    \ values in the array increases by only one, so we must distinguish between capacity\
    \ (the number of slots), and size (the number of values in the array).\n\n+  \
    \ 3. In a static array, the only times values are copied when a value is returned\
    \ from the array (a get() operation), which requires one value copy, or when a\
    \ value is placed into a slot in the array (a put() operation), which also requires\
    \ one value copy. The size() operation does not copy any data, so its complexity\
    \ is 0. Because all these operations perform a constant number of copies, they\
    \ all have complexity $\\Theta(1)$.\n\n+   4. For the second dynamic array expansion\
    \ policy, the capacity of the array is doubled at every expansion. The array begins\
    \ empty, so on the first expansion its capacity becomes one. No copies from the\
    \ old array are made in this case because the old array is empty. The next time\
    \ it is expanded, its capacity grows from one to two; its expanded, its capacity\
    \ grows from two to four, and the two values from the old array are copied. The\
    \ next expansion grows from four to eight, and four values are copied from the\
    \ old array in this case. Clearly, the number of values copied across the whole\
    \ sequence of put() operations is the sum of powers of two. Figuring out how many\
    \ powers of two are in this summation is a bit tricky. In a sequence of n operations,\
    \ expansions occur at every $(i+1)^{th}$ operation, where $i$ is a power of two,\
    \ so we add a power of two to this sequence when $i-1$ is a power of two. The\
    \ power of two less than or equal to $n-1$ is $\\lfloor\\lg(n-1)\rfloor$, and\
    \ hence the last element in the sum of the powers of two is $\\lfloor\\lg(n-1)\r\
    floor$."
