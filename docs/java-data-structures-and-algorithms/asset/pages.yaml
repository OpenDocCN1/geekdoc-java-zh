  md: '# JAVA DATA STRUCTURES AND ALGORITHMS


    # INTRODUCTION


    String—The carrier set of the String ADT is the set of all finite sequences of
    characters from some alphabet, including the empty sequence (the empty string).
    The method includes concatenation, length of, substring, index of, and so forth.


    Bit String—The carrier set of the Bit String ADT is the set of all finite sequences,
    including the empty strings of bits, which we denote λ. This set is (λ, 0, 1,
    00, 01, 10, 11, 000, ...). The method set of the Bit String ADT includes complement
    (which reverses a bit string left or right), conjunction and disjunction (which
    combine bits at corresponding locations in the strings), and concatenation and
    truncation.


    The thing that makes an abstract data type is that its carrier and methods hold
    mathematical entities, like numbers or geometric objects, and functions on them;
    all details of implementation on a computer are ignored. It makes it easier to
    reason about them and to understand what they are. For example, we can decide
    how div and mod should work for negative numbers in the Integer ADT without worrying
    about how to make this work on real computers. Then we can deal with implementations
    of our decisions as a separate problem.


    Once an abstract data type is implemented on a computer, we call it a data type.


    # Data type: An implementation of an abstract data type for computer.


    Thus, for example, the Boolean ADT is implemented as the boolean type in Java,
    and the bool type in Go and C++; the Integer ADT is realized as the int and long
    types in Java, and the Integer class in Ruby; the String ADT is implemented as
    the String class in Java and the string type in C++.


    Abstract data types are very useful for helping us understand the mathematical
    objects we use in our computations, of course, we cannot use them directly in
    our programs. To use ADTs in programming, we must figure out how to implement
    them on a computer. Implementing an ADT requires two:


    +   - Representing the values in the carrier set of the ADT by data stored in
    computer memory,

    - Realizing computational mechanisms for the operations in the method set of the
    ADT.


    Finding ways to represent carrier set in a computer''s memory requires that we
    determine how to arrange data (ultimately bits) in memory locations so that each
    value of the carrier set has a unique representation. Such things are data structures.'
