  md: '# JAVA DATA STRUCTURES AND ALGORITHMS ASSERTIONS


    A class invariant may not be true during execution of a public method, but it
    must be true between executions of public methods. For example, a method to add
    something to a container must increase the maxSize and decrease the spaceLeft
    fields, and for a moment during execution of this operation their sum might not
    be correct, but when the method is done, their sum must be the capacity of the
    counter.


    Other sorts of assertions may be used in various circumstances. An unreachable
    code assertion is an assertion that is placed at a point in a program that should
    not be executed under any circumstances. For example, the cases in which a switch
    statement either exhaust the possible values of the switch expression, should
    never reach the default case. An unreachable code assertion can be placed at the
    default case; if it is ever executed, the program is in an erroneous state. A
    loop invariant is an assertion that must be true at the start of a loop on each
    of its iterations. Loop invariants are used to prove program correctness. They
    can also help programmers write loops correctly, and understand that someone else
    has written.


    # 4.3 ASSERTIONS AND ABSTRACT DATA TYPES


    Although we have defined assertions in terms of programs, the notion can be extended
    to abstract data types (which are mathematical entities). An ADT assertion is
    a statement that must be true of the carrier set values or the method operations
    of the ADT. ADT assertions can describe many things about ADT, but usually they
    help describe the operations of the ADT. Especially helpful in this regard are
    operation preconditions, which usually constrain the parameters of operations,
    operation post conditions, which define the results of the operations, and axioms,
    which make statements about the properties of operations, showing how operations
    are related to one another. For example, consider the Natural ADT whose carrier
    set is the set of non-negative integers and whose operations are the usual arithmetic
    operations. A precondition of the mod (%) operation is that the modulus is not
    zero; if it is zero, the result of the operation is undefined. A post condition
    of the mod operation is that its result is between zero and less than the modulus.
    An axiom of this ADT is for all natural numbers a, b, and m > 0


    ```

    (a+b) % m = ((a % m) + b) % m

    ```


    This axiom shows how the addition and mod operations are related.


    We will use ADT assertions, and especially preconditions, in specifying ADTs.
    Usually, ADT assertions translate into assertions about the data types that implement
    the ADTs, which helps insure that our ADT implementations are correct.'
