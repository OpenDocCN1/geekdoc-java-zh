  md: '# 19 AVL TREES


    # 19.1 INTRODUCTION


    Binary search trees are an excellent data structure because insertion, deletion,
    and search can all be done very quickly, provided the tree does not become too
    long and skinny. We would have an even better data structure if we could ensure
    that our binary search trees could never get long, thus avoiding worst case behaviors.
    Trees with this characteristic are called balanced.


    Balanced tree: a tree such that for every node, the height of its sub-trees differ
    by at most some constant value.


    There are several sorts of balanced trees. We will consider one kind of balanced
    binary tree (AVL trees) in this chapter and one kind of balanced non-binary tree
    (2-3 trees) in the next.


    # 19.2 BALANCE IN AVL TREES


    AVL trees were introduced in 1962 by G. M. Adelson-Velsky and E. M. Landis (hence
    their name). They are defined as follows.


    > The balance factor of a node is the height of the left sub-tree minus the height
    of the right sub-tree, with the height of the empty tree defined as -1.


    An AVL tree is a binary search tree in which the balance factor at each node is
    -1, 0, or 1. The empty tree is an AVL tree.


    AVL trees all of whose nodes have balance factors of 0 are perfectly balanced.
    But somewhat lop-sided trees are still AVL trees, and trees that may appear balanced
    are not AVL trees. Consider the examples in Figure 1 (balance factors are shown
    above the nodes). Both are binary search trees, but only the tree on the left
    is an AVL tree. (In the tree on the right, the node holding 10 has a balance factor
    of -2.)'
