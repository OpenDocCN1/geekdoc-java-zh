    # SETS


    # 21.5 LINKED IMPLEMENTATION OF SETS


    The problem with the contiguous implementation of sets is that insertion, deletion,
    and membership checking cannot all be done efficiently. The same holds true of
    linked lists. We have, encountered data structures guaranteed to provide fast
    insertion, deletion, and membership checking: balanced search trees. Recall that
    a balanced search tree can be searched in O(log n) time, and elements can be inserted
    and deleted in O(log n) time every day.


    An implementation of sets using search trees called a tree set. Tree sets are
    very efficient implementations of sets provided care is taken to keep them balanced.
    Tree sets have the further advantage of allowing iteration over the elements in
    the set sorted order, which can be very useful in some applications.


    Based on what we have learned in the previous chapters, we can make tree sets
    from binary search trees, AVL trees, or 2-3 trees. Binary search trees are not
    guaranteed to stay balanced, so we won''t use those. There is no particular reason
    to prefer AVL trees over 2-3 trees, or vice-versa, so either may be used.


