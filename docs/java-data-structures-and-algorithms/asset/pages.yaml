    # 7.3 INFIX, PREFIX, AND POSTFIX EXPRESSIONS


    The arithmetic expressions we learned in grade school are infix expressions, but
    other kinds of expressions, called prefix or postfix expressions, might also be
    used.


    Infix expression: An expression in which the operators appear between their operands.


    Prefix expression: An expression in which the operators appear before their operands.


    Postfix expression: An expression in which the operators appear after their operands.


    In a prefix expression, the operands of an operator appear immediately to its
    right, while in a postfix expression, they appear immediately to its left. For
    example, the infix expression (4 + 5) * 9 can be rewritten in prefix form as +
    4 5 9 and in postfix form as 4 5 + 9 *. An advantage of pre- and postfix expressions
    over infix expressions is that the latter doesn''t need parentheses.


    Many students are confused by prefix and postfix expressions the first time they
    encounter them, so lets consider a few more examples. In the expressions in the
    table below, all numbers are one digit long and the operators are the usual binary
    integer operations. All the expressions in a row are equivalent.


    ![](img/e42195b5740d05aee932ad08d883699d_69_0.png)'
