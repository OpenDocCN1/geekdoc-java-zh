  md: '# JAVA DATA STRUCTURES AND ALGORITHMS


    # 23.2 THE HASHING PROBLEM


    If a set of key-value pairs is small and we can allocate an array enough to hold
    them all, we can always find a hash function that transforms keys to unique locations
    in a hash table. For example, in some old programming languages, identifiers consisted
    of an uppercase letter followed by a digit. Suppose these are our keys. There
    are 286 of them, and it is not too hard to come up with a function that maps each
    key of this form to a unique value in the range 0.285. But usually the set of
    keys is too big to make a table to hold all the possibilities. For example, older
    versions of FORTRAN had identifiers that started with an upper-case letter, followed
    by up to five additional upper-case letters or digits. The number of such identifiers
    is 1,617,038,306, which is clearly too big for a hash table if we were to use
    these as keys.


    A smaller table holding keys with a large range of values will inevitably require
    that the function transform several keys to the same table location. When two
    or more keys are mapped to the same table location by a hash function we have
    a collision. Mechanisms for dealing with them are called collision resolution
    schemes.


    > Collision: The event that occurs when two or more keys are transformed to the
    same hash table location.


    How serious is the collision problem? After all, if we have a fairly large table
    and a hash function that spreads keys evenly across the table, collisions may
    be rare. In fact, however, collisions occur surprisingly often. To see why, lets
    consider the birthday problem, a famous problem from probability theory: what
    is the chance that at least two people in a group of k people have the same birthday?
    This turns out to be p=1-(365!/365^k). Table 1 below lists some values for expression.
    Surprisingly, in a group of 23 people there is better than an even chance that
    two of them have the same birthday!


    If we imagine that a hash table has 365 locations, and these probabilities are
    the likelihoods that a hash function transforms two values to the same location
    (a collision), then we can see that we are almost certain to have a collision
    when the table holds 100 values, and very likely to have a collision with only
    about 40 values in the table. Forty is only 11% of 365, so we see that collisions
    are very likely indeed. Collision resolution schemes are thus an essential part
    of making hashing work in practice.


