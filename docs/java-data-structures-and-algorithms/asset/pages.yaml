    \ but a best case complexity of only $n$. The average complexity is still in $\\\
    Theta(n^2)$, however, so this is not much of an improvement.\n\n# 13.3 SELECTION\
    \ SORT\n\nThe idea behind selection sort is to make repeated passes through the\
    \ list, each time finding the largest (or smallest) value in the unsorted portion\
    \ of the list, and placing it at the end (or beginning) of the unsorted portion,\
    \ thus shrinking the unsorted portion and growing the sorted portion. The algorithm\
    \ works by repeatedly “selecting” the item that goes at one end of the unsorted\
    \ portion of the list.\n\nA Java implementation of selection sort appears in Figure\
    \ 2.\n\n```\nvoid selectionSort(int[] a) {\n    for (int j = 0; j < a.length-1;\
    \ j++) {\n        int minIndex = j;\n        for (int i = j+1; i < a.length; i++)\
    \ {\n            if (a[i] < a[minIndex]) minIndex = i;\n        }\n        int\
    \ tmp = a[j];\n        a[j] = a[minIndex];\n        a[minIndex] = tmp;\n    }\n\
    }\n```\n\n**Figure 2:** Selection Sort\n\nThis algorithm finds the minimum value\
    \ in the unsorted portion of the list $n-1$ times and puts it where it belongs.\
    \ Like bubble sort, it does exactly the same thing no matter what the contents\
    \ of the array, so we need only consider its every-case complexity."
