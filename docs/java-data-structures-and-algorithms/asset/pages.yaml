    # ASSERTIONS


    Many assertions are stated in comments and are not checked in code, or are checked
    during development and then removed or disabled when the code is compiled for
    release.


    Languages that support assertions often provide different levels of support. For
    example, Java has an assert statement that takes a boolean argument; it throws
    an exception if the argument is not true. Assertion can be turned off with a compiler
    switch. Programmers can use the assert statement to write checks for pre- and
    post conditions, class invariants, and unreachable code, but this is all up to
    the programmer.


    The languages Eiffel and D provide constructs in the language for invariants and
    pre- and post conditions that are compiled into the code and are propagated down
    the inheritance hierarchy. Thus Eiffel and D make it easy to incorporate these
    checks into programs. A compiler switch can disable assertion checking for released
    programs.


    # 4.5 ASSERTIONS IN JAVA


    Java provides good support for assertions. It has an assert statement, and exceptions
    can also be used as well.


    The assert statement has two forms, as follows.


    ```

    assert <booleanExpression>

    assert <booleanExpression> : <messageExpression>

    ```


    In the first form, the <booleanExpression> is evaluated, and if false, an AssertionError
    is thrown. Programs should not try to catch these errors, as a rule will cause
    the program to fail and print a message and a stack trace. The second of the statement
    does the same as the first, except that the <messageExpression> is evaluated and
    this value is printed as part of the error message when the program fails.


    Java assertions are disabled by default, which means they are treated as if they
    were not there. They are activated using the -ea or -enableassertions switch on
    the java interpreter.


    The assert statement is used to terminate programs when an unexpected situation
    arises. This is appropriate in some cases, such as when unreachable code is executed,
    a post condition is violated, or a precondition of a method is violated. In other
    cases, it is better to throw an exception. This is especially for preconditions
    of public methods. Java has built-in exceptions that can be thrown in such cases
    (such as NullPointerException, IllegalArgumentException,or IllegalStateException).
