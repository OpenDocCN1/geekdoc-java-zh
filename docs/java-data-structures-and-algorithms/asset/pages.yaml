  md: 'The measure of the size of the input is the array size, which we will label
    n. Let us count the number of comparisons between the key and the array elements
    made in the body of the loop. If the key is the first element of the array, then
    the number of comparisons is only one; this is the best case complexity. We use
    B(n) to designate the best case complexity of an algorithm on size n, so in this
    case B(n) = 1.


    In contrast, suppose that the key is not present in the array at all, or it is
    the last element in the array. Then exactly n comparisons will be made; this is
    the worst case complexity, we designate W(n), for this algorithm, W(n) = n.


    Sometimes the key will be in the array, and it will not. When it is in the array,
    it may be at any of its n locations. The number of operations done depends on
    which of these possibilities obtains. Often we like to characterize the behavior
    of an algorithm over a wide range of possible inputs, producing a measure of average
    case complexity, we designate A(n). The difficulty is that it is not clear what
    constitutes an “average” case. An algorithm analyst makes some reasonable assumptions
    about the probabilities of various inputs and derives a measure for the average
    case complexity. For example, suppose we the key is in the array, and it is equally
    likely to be at any of the n locations. The probability that it is in position
    i, 0 ≤ i n, is 1/n. If the key is at location zero, then the number of comparisons
    is one; if it is at location one, the number of comparisons is two; in general,
    if the key is at position i, then the number of comparisons is i+1. Hence the
    average number of comparisons is given by the following equation.


    A(n) = Σ_{i=0 to n} 1/n · (i+1) = 1/n · Σ_{i=1 to n} i


    You may recall from discrete mathematics that the sum of the first n numbers is
    n(n+1)/2, so A(n) = (n+1)/2. In other, if the key is in the array and is equally
    likely to be in any location, then on average the algorithm looks at about half
    the array elements before finding it, which makes sense.


    Lets consider what happens when we alter our assumptions about the average case.
    Suppose that the key is not in the array half the time, but when it is in the
    array, it is likely to be at any location. The probability that the key is at
    location i is 1/2 · 1/n = 1/2n. In this case, our equation for A(n) is the sum
    of the probability that the key is not in the list (n), and the sum of the product
    of the probability that the key is in the array at location i times the number
    of comparisons made when it is in location i:


    A(n) = n/2 + Σ_{i=0 to n} 1/2n · (i+1) = n/2 + 1/2n · Σ_{i=1 to n} i = n/2 + (n+1)/4
    = (3n+1)/4


