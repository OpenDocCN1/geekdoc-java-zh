  md: '# 20 2-3 TREES


    # 20.1 INTRODUCTION


    AVL trees use a rotation technique to maintain balance in binary search trees.
    Another approach is to maintain perfect balance in search trees by relaxing the
    constraint on the number of children (and keys) that a tree node can have. In
    general, a tree node might be allowed to have zero or two to $m$ children; this
    produces a data structures called a B-tree. We will focus on this chapter when
    $m=3$, producing trees called 2-3 trees.


    Because 2-3 trees are perfectly balanced, modifying them is fast, and because
    they maintain the search tree property among the values at their nodes, searching
    them is also fast.


    # 20.2 PROPERTIES OF 2-3 TREES


    2-3 trees were invented in 1970 by John Hopcroft. They are defined as follows.


    +   A tree is **perfectly balanced** if all its leaves are on the same level;
    that is, the path from the root to any leaf is always the height of the tree.


    +   **2-3 tree**: a perfectly balanced tree whose node is either a 2-node with
    one value $v$ and zero or two children, such that every value in its left sub-tree
    is less than $v$ and every value in its right sub-tree is greater than $v$, or
    a 3-node with two values $v_1$ and $v_2$ and zero or three children such that
    every value in its left-most sub-tree is less than $v_1$, every value in its middle
    sub-tree is greater than $v_1$ and less than $v_2$, and every value in its right-most
    sub-tree is greater than $v_2$.


    Figure 1 shows an example of a 2-3 tree.'
