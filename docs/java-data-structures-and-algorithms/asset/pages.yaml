    # #12 AMORTIZED ANALYSIS


    # ##12.1 INTRODUCTION


    The sort of algorithm analysis we have discussed so far will be applied to many
    algorithms in the next several chapters. There is another sort of analysis that
    we will touch on briefly in this chapter and to apply a few examples, but will
    not pursue further in the remainder of the book. Rather than looking at the time
    or space efficiency of a particular algorithm, we can examine the behavior of
    the operations in a data type to understand the average time or space required
    to use the data type. Note that this sort of analysis considers operations (several
    algorithms) jointly rather than individually as we have been doing. This is important
    because it is not uncommon for operations in a data type to be quite fast while
    others are slow. If we draw conclusions about the worst case behavior of the operations
    by considering only the slowest operations in our analysis, we may be misled by
    the true cost of using the data type. Amortized analysis looks at the overall
    performance of the operations in a data type by considering arbitrary sequences
    of operations that may include fast and slow operations. This often to much different
    conclusions about the cost of using the data type.


    **Amortized analysis:** Determining the average time of operations in the worst
    case by considering the time needed to perform an arbitrary sequence of n operations,
    and dividing this total by n.


    There are several techniques for drawing amortized analysis; here we consider
    the most basic technique, called *aggregate analysis*.


    # ##12.2 A STACK DATA TYPE


    To illustrate amortized analysis, suppose we have a stack data type whose implicit-receiver
    method sets of the operations *push(), size(), and multiPop(),* where *multiPop(k)*
    pops k elements from the stack, or empties the stack if it has fewer k. In analyzing
    this data type, suppose we *push()* and *pop()* as basic operations. *MultiPop(k)*
    consumes *minimum(k, n)* basic operations (because it does many *pop()* operations).
    The complexity, $C(n)$, of both *push* and *pop* is 1, and the worst case complexity,
    $W(n)$, of $multiPop(k)$ is m, where m is $minimum(k, size)$. If we consider a
    sequence of n operations from this data type in the worst case, we may have a
    stack size of n (because we may have n *push()* operations). But a sequence of
    n operations with worst case has worst case $n^2$, so on average worst case complexity
    of the operations in this data type is $O(n)$.


