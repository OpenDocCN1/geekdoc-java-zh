    # 21 SETS


    # ## 21.1 INTRODUCTION


    Lists have a linear structure and trees have a two-dimensional structure. We now
    turn to unstructured collections. The simplest unstructured collection is the
    set.


    +   **Set:** An unordered collection in which an element may appear at most once.


    We first review the set ADT and then discuss ADT implementation.


    # ## 21.2 THE SET ADT


    The set of $T$ abstract data type is the ADT of sets of elements of type $T$.
    Its carrier set is the set of all elements of $T$. This ADT is the abstract data
    type of sets that we learned starting in grade school. The operations are exactly
    what we would expect (and could be included as well). Note that this is not an
    implicit-receiver method set.


    ```

    $e \in s$--Return true if $e$ is a member of the set $s$

    $s \subseteq t$--Return true if every element of $s$ is also an element of $t$

    $s \cap t$--Return the set of elements that are in both $s$ and $t$

    $s \cup t$--Return the set of elements that are in either $s$ or $t$

    $s - t$--Return the set of elements of $s$ that are not in $t$

    $s = t$--Return true if and only if $s$ and $t$ contain the same elements.

    ```


    The set ADT is so familiar that we hardly need discuss it. Instead, we can turn
    immediately to the set interface that all implementation of the set ADT will use.


    # ## 21.3 THE SET INTERFACE


    The interface appears in Figure 1. The Set interface is a sub-interface of the
    Collection interface, it inherits all the operations of Collection and Container.
    Some of the set ADT operations are included in these super-interfaces (such as
    contains()), so they don''t appear explicitly in the Set interface.


