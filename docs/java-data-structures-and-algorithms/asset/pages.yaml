  md: '# 8 COLLECTIONS AND ITERATORS


    # 8.1 INTRODUCTION


    Recall that we have defined a collection as a type of container that is traversable,
    is, a container that allows access to all its elements. The process of accessing
    all elements of a collection is also called iteration. Iteration over a collection
    may be supported in several ways depending on the agent that controls the iteration
    and where the iteration mechanism resides. In this chapter we examine iteration
    design alternatives and discuss how collections and iteration work in Java. Based
    on this discussion, we will decide how to support collection iteration in our
    container hierarchy, and how to add collections to the hierarchy.


    # 8.2 ITERATION DESIGN ALTERNATIVES


    There are two ways that iteration may be controlled.


    **Internal iteration**—When a client controls iteration over its elements, iteration
    is said to be *internal*. A client wishing to process each element of a collection
    packages the process in some way (typically in an operation), and passes it to
    the collection, perhaps with instruction about how iteration is to be. The collection
    then applies the processing to each of its elements. This mode of control makes
    it easier for the client to iterate over a collection, but with less flexibility
    in dealing with issues that may arise during iteration.


    **External iteration**—When a client controls iteration over a collection, the
    iteration is said to be *external*. In this case, the client must be provided
    with operations that allow an iteration to be initialized, to obtain the current
    element from the collection, to move on the next element in the collection, and
    to determine when iteration is complete. This mode of control imposes a burden
    on the client in return for more flexibility in dealing with the iteration.


    In addition to issues of control, there are also alternatives concerning where
    the iteration mechanism resides.


    **In the language**—An iteration mechanism may be built into a language. For example,
    Java, Ruby, and Go (to name just a few examples) have special looping structures
    that provide means for external iteration over collections.'
