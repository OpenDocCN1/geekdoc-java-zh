    # 3.1 INTRODUCTION


    Simple abstract data types are useful for manipulating simple sets of values,
    like Integers or Booleans, but more complex abstract data types are crucial for
    most applications. A category of complex ADTs that have proven particularly important
    are containers.


    **Container:** An entity that holds finitely many other entities.


    Just as containers like boxes, baskets, bags, fails, cans, drawers, and so forth
    are important in everyday life, containers such as lists, stacks, and queues are
    important in programming.


    # 3.2 VARIETIES OF CONTAINERS


    Various containers have become standard in programming over the years; these are
    distinguished by three properties:


    > Structure—Some containers hold elements in some sort of structure, and some
    do not. Containers with no structure include sets and bags. Containers with linear
    structure include stacks, queues, and lists. Containers with more complex structures
    include multidimensional matrices.


    > Access Restrictions—Structured containers with access restrictions only allow
    clients to add, remove, and examine elements at certain locations in their structure.
    For example, a stack allows element addition, removal, and examination at one
    end, while lists allow access to any point. A container that allows access to
    all elements is **traversable, enumerable, or iterable**


    > Keyed Access—A collection may allow its elements to be accessed by keys. For
    example, maps are unordered containers that allow their elements to be accessed
    using keys.


    # 3.3 A CONTAINER TAXONOMY


    It is useful to place containers in a taxonomy to help understand their relationships
    to one another and as a basis for implementation using a class hierarchy. The
    root of the taxonomy is `Container`. A `Container` may be structured or not, so
    it cannot make'
