    # AMORTIZED ANALYSIS


    When we use this data type in a program, not every operation can be multiPop(),
    so this estimate is too pessimistic. How can we characterize the overall complexity
    of this data type in a program more accurately? We proceed as follows using amortized
    analysis.


    Consider an arbitrary sequence of n operations with an empty stack and contains
    operations whose preconditions are met (in other words, we never try to apply
    pop() or multiPop() to an empty stack). Note first that if the sequence contains
    only push() and pop() operations, then it must have exactly n basic operations.
    We can, by replace any multiPop(k) operation with minimum(k, size()) pop() to
    achieve the same result, thus expanding the original sequence of n operations
    to some longer sequence of m push\u2014pop() and m pop() operations. How large
    can m be? A little rethink should reveal that the maximum value of m occurs when
    n-1 push() operations are followed by a single multiPop(n-1) operation. This results
    in m = n-1+1 = 2n-2 < 2n operations. The worst-case time for any sequence of n
    operations of this data type less than 2n, and therefore the average time for
    each operation is less than 2, The average cost of the operations in this data
    type is less than 2, which is \(\Theta(1)\). This reveals that despite the worst
    case complexity of one of the operations in the data type being O(n), using the
    operations in this data type will incur only a constant cost on average in the
    worst case.


    # 12.3 DYNAMIC ARRAYS


    We have discussed how a dynamic arrays expands\u2014 as necessary to accommodate
    many insertions. Implementing dynamic arrays must be done using statically allocated
    blocks of memory. When a dynamic array is expanded, a new, larger array must be
    allocated, the contents of the old array must be copied into the new array, the
    space for the old array must be freed, and finally the new value must be added
    to the now expanded array. How efficient is the use of dynamic arrays?


    We begin by specifying a dynamic array type. Suppose dynamic array begins with
    empty arrays (with size 0) and have the following implicit-receiver method set.


    ```

    size()\u2014Return the number of values stored in the array.

    get(i)\u2014Return the value stored at location i. The precondition of this operation
    is 0 <= i < size().

    put(i,v)\u2014Replace the value at location i with value v. The precondition of
    this operation is 0 <= i <= size(). Note that if i = size(), then the array is
    expanded.

    ```


