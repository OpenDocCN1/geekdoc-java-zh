    | ((2 * 3) - 4) * (8 / 3)) + 2 | | % + 8 * 26 - 84 | 82 - 3 * 4 * 5 + 8 / |


    +   3. Write a recursive algorithm to evaluate postfix expressions as discussed
    in this chapter.

    4. Write a recursive algorithm to evaluate infix expressions. Assume that operators
    have equal precedence and are left-associative so, without parentheses, operations
    are evaluated from left to right. Parentheses alter the order of evaluation in
    the usual way.

    5. Write a stack-based algorithm to evaluate infix expressions as defined in the
    last exercise.

    6. Which of the algorithms for evaluating infix expressions is easier to develop?

    7. Write a non-recursive algorithm that does not use a stack to determine whether
    a string of brackets is balanced. Hint: count brackets.


    # 7.8 REVIEW QUESTION ANSWERS


    +   1. This answer depends on the individual, but most people probably find the
    stack-based algorithm a bit easier to understand because its strategy is so simple.

    2. Prefix, postfix, and infix expressions list their arguments in the same order.
    The number of operators in each is always less than the number of constant arguments.
    The main operator in each expression and sub-expression is easy to find: the main
    operator in an infix expression is the left-most operator inside the fewest of
    parentheses; the main operator of a prefix expression is the first operator; the
    main operator of a postfix expression is the last operator.

    3. Evaluating a prefix expression recursively is much easier than evaluating it
    with a stack.

    4. Evaluating a postfix expression with a stack is much easier than evaluating
    it recursively.

    5. The recursive algorithm to determine whether a string of brackets is balanced
    calls itself most once each activation, so it is tail recursive, but the recursive
    call is not the last step in the execution of the body algorithm—there must be
    a check for the closing bracket after the recursive call. Hence this operation
    is not tail recursive and cannot be implemented without a stack. (There is a non-recursive
    algorithm to check for balanced brackets without a stack, but it uses a completely
    different approach from the recursive algorithms—see exercise 7).'
