  md: '# 17 BINARY TREES


    # 17.1 INTRODUCTION


    As mentioned in the last chapter, binary trees are ordered trees whose vertices
    have at most two children, a left child and a right child. Although other kinds
    of ordered trees arise in computing, binary trees are especially common and have
    been very well studied. In this chapter we discuss the binary tree abstract data
    type and binary trees as an implementation mechanism.


    # 17.2 THE BINARY TREE ADT


    Binary trees hold values of some type, the ADT is binary tree of T, where T is
    the type of the elements in the tree. The carrier of this set is the set of all
    binary trees whose vertices hold a value of type T. The carrier set includes the
    empty tree, trees with a root with a value of type T, trees with a root and a
    left child, trees with a root and a right child, and so forth. Operations in the
    implicit-receiver method include the following.


    +   * size()—Return the number of vertices in the tree.


    +   * height()—Return the height of the tree.


    +   * isEmpty()—Return true in case the tree is the empty tree.


    +   * contains(v)—Return true in case the value v is present in the tree.


    +   * rootValue()—Return the value of type T stored at the root of the tree. Its
    precondition is that the tree is not the empty tree.


    +   * leftSubtree()—Return the root whose is the left child of the root of the
    tree. Its precondition is that the tree is not the empty tree.


    +   * rightSubtree()—Return the root whose is the right child of the root of the
    tree. Its precondition is that the tree is not the empty tree.


    Suppose we have the following tree constructors.


    +   * newEmptyTree()—Create and return a new empty tree.


    +   * newTree(v, t₁, t₂)—Create and return a new tree with v at its root, left
    child t₁ and right child t₂.'
