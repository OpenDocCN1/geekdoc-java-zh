    \ This is because bubble sort typically makes many swaps on every pass through\
    \ the list, while selection sort makes only one. Nevertheless, neither of these\
    \ sorts is particularly fast.\n\n# 13.4 INSERTION SORT\n\nInsertion sort works\
    \ by repeatedly taking an element from the unsorted portion of a list and inserting\
    \ it into the sorted portion of the list until every element has been inserted.\
    \ This algorithm is the one used by people when sorting piles of papers.\n\nA\
    \ Java implementation of insertion sort appears in Figure 3.\n\n```\nvoid insertionSort(int[]\
    \ a) {\n    for (int j = 1; j < a.length; j++) {\n        int element = a[j];\n\
    \        int i;\n        for (i = j; i > 0 && element < a[i-1]; i--)\n       \
    \     a[i] = a[i-1];\n        a[i] = element;\n    }\n}\n```\n\n**Figure 3:**\
    \ Insertion Sort\n\nA list with only one element is already sorted, so the elements\
    \ inserted begin with the second element in the array. The inserted element is\
    \ held in the element variable and values in the sorted portion of the array are\
    \ moved up to make room for the inserted element in the same loop that finds the\
    \ right place to make the insertion. Once that spot is found, the loop ends and\
    \ the inserted element is placed into the sorted portion of the array."
