    # 26.1 INTRODUCTION


    There are many important algorithms on graphs. In this chapter we examine a few
    of the most fundamental and widely used. In particular, we consider graph search
    algorithms and several algorithms based on them.


    # 26.2 SEARCHING GRAPHS


    Many problems involving graphs require a systematic traversal of the graph along
    its edges— this is termed a graph search. We have already seen graph search algorithms
    in the form of tree traversals, but these only apply to trees, not graphs in general.


    As an example of a problem illustrating the need to search a general graph, suppose
    that we wish to solve a maze. A maze can be represented by a graph as follows:
    the entrance, exit, and intersections in the maze to graph vertices and map the
    paths between the entrance,


    ![](img/e42195b5740d05aee932ad08d883699d_233_0.png)'
