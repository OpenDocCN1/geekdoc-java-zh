    # 9.1 INTRODUCTION


    Lists are linearly ordered collections. Some things we refer to in everyday life
    are lists, as shopping lists or laundry lists, are really sets because their order
    doesn''t matter. Order matters in lists. A to-do list is really list if the tasks
    to be done are in the order in they are supposed to be completed (or some other
    order).


    List: An ordered linear collection.


    Because order matters in lists, we must specify a location, or index, of elements
    when we modify the list. Indices can start at any number, but we will follow convention
    and give the first element of a list index 0, the second index 1, and so forth.


    # 9.2 THE LIST ADT AND INTERFACE


    Lists are collections of values of some type, so the ADT is list of T, where T
    is the type of the elements in the list. The carrier of this type is the set of
    all sequences or ordered tuples of elements of type T. The carrier includes the
    empty list, the lists with one element of type T (one-tuples), the lists with
    two elements of type T (ordered pairs), and so forth. Hence the carrier of this
    ADT is the set of all tuples of type T, including the empty tuple.


    There are many functions that may be included in a list ADT; the following is
    a typical list ADTimplicit-receiver method. The result of a function is undefined
    if its precondition is violated.


    ```

    size()—Return the length of the list.

    ```


    ```

    insert(i,e)—Place e into the list at index i, moving elements with larger indices
    in the list, if necessary. The precondition of this operation is that i be a valid
    index position: 0 ≤ i ≤ size(0). When i is 0, e is inserted at the front of the
    list, and when i is size(0), e is appended to the end of the list.

    ```


    ```

    delete(i)—Remove the element at index i and return the deleted element. The precondition
    of this operation is that i be a valid index position: 0 ≤ i < size().

    ```


    ```

    get(i)—Return the value at index i of the list. The precondition is that i be
    a valid index position: 0 ≤ i < size().

    ```'
