    ```\n\n**Figure 7:** A Non-Recursive Array Search Algorithm\n\nAlgorithms that\
    \ only call themselves once as the final step in every execution of their bodies,\
    \ like this search, are called tail-recursive.\n\n+   **Tail recursive algorithm:**\
    \ A recursive algorithm that calls itself at most once as the last step in every\
    \ execution of its body.\n\nRecursion can always be removed from tail-recursive\
    \ algorithms without using a stack. We will see another example of tail recursion\
    \ when we consider binary search.\n\n# 7.5 SUMMARY AND CONCLUSION\n\nAlgorithms\
    \ that use recursion can always be replaced by algorithms that use a stack, and\
    \ vice versa, so stacks and recursion are in some sense equivalent. However, some\
    \ algorithms are much easier to write recursion, while others are easier to write\
    \ a stack. Which is which depends on the problem. Programmers should evaluate\
