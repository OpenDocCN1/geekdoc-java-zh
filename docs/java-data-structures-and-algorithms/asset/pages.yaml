    # 8.3 THE ITERATOR DESIGN PATTERN


    A software design pattern is an accepted solution to a common design problem that
    is proposed as a model for solving similar problems.


    **Software design pattern:** A model proposed for imitation in solving a software
    design problem.


    Design patterns occur at many levels of abstraction. For example, an algorithm
    or data structure is a low-level design pattern, and the overall structure of
    a very large program (such as a client-server structure) is a high-level design
    pattern. The Iterator pattern is a mid-level object-oriented design pattern that
    specifies the composition and interactions of several classes and interfaces.


    The Iterator consists of an *Iterator* class whose instances are created by an
    associated collection and provided to clients. The *Iterator* instances house
    an external iteration mechanism. Although *Iterator* class functionality can be
    packaged in various ways, *Iterator* classes must provide the following functionality.


    +   *Initialization—Prepare the *Iterator* object to traverse its associated collection.
    This operation will set the current element (if there is one).


    +   *Completion Test—Indicate whether traversal by this Iterator is finished.*


    +   *Current Element Access—Provide the current element to the client. The precondition
    for the operation is that iteration is not complete.


    +   *Current Element Advance—Make the next element in the collection current element.
    This operation has no effect once iteration is complete. However, iteration may
    become complete when it is *invited*—in other words, if the current item is the
    last, executing this operation completes the iteration, and calling it again does
    nothing.*


    The class diagram in Figure 1 below presents the static structure of the Iterator
    pattern. The four operations in the Iterator interface correspond to the four
    functions listed above. The `iterator()` operation in the Collection interface
    creates and returns a new iterator for the particular collection in which it occurs;
    this is called a factory method because it manufactures a class instance.


    The interfaces and classes in this pattern are templated with the type of the
    elements held in the collection. The arrow from the `ConcreteIterator` to the
    `ConcreteCollection` indicates that the `ConcreteIterator` must have some sort
    of reference to the collection with which it is associated so that it can access
    its elements.'
