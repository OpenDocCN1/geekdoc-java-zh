  md: "# JAVA DATA STRUCTURES AND ALGORITHMS GLOSSARY\n\n**node**—an aggregate variable\
    \ with data and link (reference or pointer) fields; in a graph, a vertex.\n\n\
    **open addressing**—a hashing collision resolution scheme in which key-value pairs\
    \ with colliding keys are stored at other free locations in the hash table found\
    \ by probing the table for open locations.\n\n**order**—the function $g$ is in\
    \ the set $O(f)$, denoted $g \\in O(f)$, if there exist some positive constant\
    \ $c$ and non-negative integer $n_0$ such that $g(n) \\leq c \\cdot f(n)$ for\
    \ all $n \\geq n_0$; informally, when $g$ is in $O(f)$ we say that $g$ has the\
    \ same order (of growth) as $f$.\n\n**ordered tree**—a tree in which the order\
    \ of the children node is specified.\n\n**path**—in a graph, a sequence $p = \\\
    langle v_1, v_2, ... , v_n \rangle$, where $n \\geq 2$, such that every pair of\
    \ vertices $v_i$ and $v_{i+1}$ in $p$ are adjacent.\n\n**path length**—the number\
    \ of edges in a path.\n\n**perfectly balanced tree**—a tree whose all leaves are\
    \ on the same level; is, the path from the root to any leaf is the height of the\
    \ tree.\n\n**pointer**—a type whose carrier contains addresses of values of an\
    \ associated base type.\n\n**post condition**—an assertion that must be true at\
    \ the completion of an operation.\n\n**postfix expression**—an expression in which\
    \ the operators appear after their operands.\n\n**postorder traversal**—a traversal\
    \ in which, at every node, the children of the node are visited in order from\
    \ left to right, followed by the node.\n\n**precondition**—an assertion that must\
    \ be true at the initiation of an operation.\n\n**prefix expression**—an expression\
    \ in which the operators appear before their operands.\n\n**preorder traversal**—a\
    \ tree traversal in which, at every node, the node is visited first, followed\
    \ by the children of the node in order from left to right.\n\n**priority queue**—a\
    \ queue whose elements have a non-negative integer **priority** used to order\
    \ the elements of the priority queue such that the highest priority elements are\
    \ at the front and the lowest priority elements are at the back."
