  md: 'JAVA DATA STRUCTURES AND ALGORITHMS


    ASSERTIONS


    # 4.4 USING ASSERTIONS


    As a rule, when writing code, programmers should state pre- and subtle post conditions
    for public methods, state class invariants, and insert unreachable code assertions
    and loop invariants wherever appropriate.


    Some languages have facilities to support assertions directly and some do not.
    If a language does not directly support assertions, the programmer can mimic their
    effect. For example, the first statements in a method can test the preconditions
    of the method and throw an exception if they are violated. Post conditions can
    be checked in a similar manner. Class invariants are more awkward to check because
    code for them must be inserted at the start and end of every public method. This
    is usually not practical. Unreachable code assertions occur relatively infrequently
    and are easy to insert, so they should be used. Loop invariants are mandatory
    for documenting and proving code, so they can be stated in comments at the tops
    of loops.


    Often efficiency issues arise. For example, the precondition of a binary search
    is that the array is sorted, but checking this precondition is so expensive that
    one would be better off using a sequential search. Similar problems often occur
    with post conditions.


