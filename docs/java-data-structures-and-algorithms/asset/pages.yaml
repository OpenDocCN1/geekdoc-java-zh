- img_proc: true
  md: '![](img/e42195b5740d05aee932ad08d883699d_186_0.png)


    **Figure 2: Splitting a Leaf 4-Node**


    After this transformation, the problem is that the leaf level of the tree now
    contains a sub-tree of height one, so the tree is unbalanced. Balance is restored
    by incorporating the root of this sub-tree into the level above. If the parent
    of the newly created 2-node is a 2-node, then the new 2-node is added to its parent
    2-node, making the parent into a 3-node and balancing the tree. However, if the
    parent of the newly created 2-node is a 3-node, then folding the new 2-node into
    its parent creates a 4-node, and the problem we had before recurs. We can solve
    it the same way: make the 4-node into a 2-node with two children, then rebalance.
    Figure 3 shows how to split a 4-node when it has sub-trees.


    ![](img/e42195b5740d05aee932ad08d883699d_186_1.png)


    **Figure 3: Splitting a 4-Node With Children**


    This technique of propagating 4-nodes up the tree continues as far as necessary.
    If it reaches the root, then the new 2-node created from splitting a 4-node becomes
    the root of the entire tree. This is the only way that the height of a 2-3 tree
    can increase and it is the key to keeping it balanced: the tree increases its
    height only at its root. If the tree were to grow at the bottom, it would be very
    difficult to keep perfectly balanced, because it only grows at the root it stays
    perfectly balanced without any further modifications.


    Figure 4 shows an example to illustrate this process at its most transformative:
    a value inserted at a leaves causes 4-nodes to split all the way up to its root,
    increasing the height of the tree.


    Insertion requires a search down the tree to find the leaf where the inserted
    value is placed; as noted above, this requires O(log n) operations. If splits
    of 4-nodes are necessary, this must occur along the path from the leaf where the
    insertion takes back to the root, a path with h+1 nodes that must be split. Each
    split requires at most fixed number of operations, however this transformation
    requires O(log n) operations as well. The time complexity for insertion is thus
    O(log n).


