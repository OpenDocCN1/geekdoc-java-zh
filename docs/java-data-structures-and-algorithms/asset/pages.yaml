  md: "# JAVA DATA STRUCTURES AND ALGORITHMS BINARY SEARCH AND BINARY SEARCH TREES\n\
    \nBinary search takes the same tack in searching for a key in a sorted list: the\
    \ key is compared with the middle element in the list. If it is the key, the search\
    \ is done. If the key is less than the middle element, the process is repeated\
    \ for the first half of the list. If the key is greater than the middle element,\
    \ the process is repeated for the second half of the list. Eventually, either\
    \ the key is found in the list, or the list is reduced to nothing (the empty list),\
    \ at which point we know that the key is not present in the list.\n\nThis approach\
    \ naturally lends itself to a recursive algorithm, which we show in Java.\n\n\
    ```\nint binarySearchRecursive(int[] a, int key) {\n    return binSearch(key,\
    \ a, 0, a.length-1);\n}\n\nint binSearch(int key, int[] a, int lo, int hi) {\n\
    \    if (hi < lo) return -1;\n    m = (lo+hi)/2;\n    if (key == a[m]) return\
    \ m;\n    if (key < a[m]) return binSearch(key, a, lo, m-1);\n    return binSearch(key,\
    \ a, m+1, hi);\n}\n```\n\n![](img/e42195b5740d05aee932ad08d883699d_164_0.png)\n\
    \nSearch algorithms traditionally return the index of the key in the list or -1\
    \ if the key is not found, so that is what happens here. Note also although the\
    \ array is sorted, checking this would take too much time, so it is not checked.\
    \ A helper function is used to keep track of the bounds of the unsearched portion\
    \ of the array, but we don't want to worry about (or even know) this detail.\n\
    \nRecursion stops when the unsearched portion of the array is empty. Otherwise,\
    \ the element at index m in the middle of the unsearched portion of the array\
    \ is checked. If it is the key, the search is done and index m is returned; a\
    \ recursive call is made to search the portion of the array before or after m\
    \ depending on whether the key is less or greater than a[m].\n\nAlthough binary\
    \ search is naturally recursive, it is also tail recursive. Recall that a tail\
    \ recursive algorithm is one in which at most one recursive call is the last action\
    \ in each activation of the algorithm, and tail recursive algorithms can always\
    \ be converted to non-recursive algorithms using only a loop and no stack. This\
    \ is always more efficient and simpler as well. In case of binary search, the\
    \ non-recursive algorithm is about equally complicated, as the Java code in Figure\
    \ 2 below shows.\n\nDownload free eBooks at bookboom.com\n165"
