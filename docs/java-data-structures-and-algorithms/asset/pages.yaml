  md: '# 8.9 REVIEW QUESTION ANSWERS


    +   1. There are two alternatives for controlling iteration: the collection may
    control it (internal iteration) or the client may control it (external iteration).


    +   2. Iteration mechanisms can reside in three places: in the language (in the
    form of control structures), in the collection (as a set of operations), or in
    a separate iterator (with certain operations).


    +   3. The six alternatives for designing collection iteration facilities are
    generated by combining control alternates with residential alternatives, yielding
    the following six possibilities: (1) internal control residing in the language,
    (2) external control residing in a language, (3) internal control residing in
    the collection, (4) external control residing in the collection, (5) internal
    control residing in an iterator, (6) external control residing in an iterator.


    +   4. A software pattern is proposed for imitation in solving a software design
    problem. In other words, a pattern is a way of solving a design or implementation
    problem that has been found to be successful, and can serve as a template for
    solving similar problems.


    +   5. An Iterator must provide four functions: a way to initialize the Iterator
    to prepare to traverse its Collection, a way to fetch the current element of the
    Collection, a way to advance to the next element of the Collection, and a way
    to indicate that all elements have been accessed.


    +   6. Java provides support for external iteration over classes that implement
    the Iterable interface by making them traversable by the built-in for-each loop.
    Furthermore, such classes have an iterator() method that returns an instance of
    a class that implements the Iterator interface, meaning that the Iterator pattern
    is built into Java, so an Iterator can also be used in a loop to traverse collections.


    +   7. If a Collection is empty, it contains nothing so the contains() operation
    returns false no matter what its argument.'
