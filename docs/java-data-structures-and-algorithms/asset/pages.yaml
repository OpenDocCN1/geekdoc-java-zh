  md: '# JAVA DATA STRUCTURES AND ALGORITHMS


    In the collection—An iteration mechanism may reside in a collection. In the case
    of a collection with an external iteration mechanism, the collection must provide
    operations to initialize iteration, return the current element, advance to the
    next element, and indicate when iteration is complete. In the case of a collection
    with an internal iteration mechanism, the collection must provide an operation
    that accepts a packaged process and applies it to each of its elements.


    In an iterator—An iteration mechanism may reside in a separate entity whose job
    is to iterate over an associated collection. In this case the operations mentioned
    above to support internal or external iteration are in the iterator and the collection
    usually has an operation to create iterators.


    Combining these design alternatives gives six ways that iteration can be done:
    internal iteration residing in the language, in the collection, or in an iterator,
    external iteration residing in the language, in the collection, or in an iterator.
    Each of these alternatives has advantages and disadvantages, and various languages
    and systems have incorporated one or more of them. For example, object-oriented
    languages have external iteration residing in iterator objects (this is known
    as the Iterator pattern). Nowadays many languages provide external iteration in
    control structures, as mentioned above. We will now consider the Iterator design
    pattern, and then internal and external iteration in Java.


