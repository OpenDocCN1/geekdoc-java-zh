  md: '# 23 HASHING


    # 23.1 INTRODUCTION


    In an ideal world, retrieving a value from a map would be done instantly by examining
    the value''s key. That is the goal of hashing, which uses a hash function to transform
    a key into an array index, thereby providing instantaneous access to the value
    stored in an array holding the key-value pairs in the map. This array is called
    a hash table.


    +   **Hash function:** A function that transforms a key into a value in the range
    of indices of a hash table.


    +   **Hash table:** An array holding key-value pairs whose locations are determined
    by a hash function applied to keys.


    Of course, there are a few details to work out.


