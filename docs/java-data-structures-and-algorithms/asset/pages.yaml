    insert(k, v)—Add the ordered pair <k, v> to the map. If the map already contains
    an ordered pair whose first element is k, then this ordered pair is replaced with
    the new one.


    delete(k)—Remove from the map the ordered pair whose first element is k. If the
    map does not contain such an ordered pair, do nothing.


    get(k)—Return the second element in the ordered pair whose first element is k.
    This operations precondition is that the map contains an ordered pair whose first
    value is k.


    equal(m)—Return true if the receiver map and map m have the same key-value pairs.


    There is considerable similarity between these operations and the operations for
    lists and sets. For example, the delete() operation for lists takes an index and
    removes the element at the designated index, while the map operation takes a key
    and removes the key-value pair matching the key. On the other hand, when the list
    index is out of range, there is a precondition violation, while if the key is
    not present in the map, the map is unchanged. This latter behavior is the same
    as what happens with sets when the delete() operation is called with an argument
    that is not in the set.


