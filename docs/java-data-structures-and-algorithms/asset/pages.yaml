  md: '# Open Addressing


    In the open addressing collision resolution scheme, records with colliding keys
    are stored at other free locations in the hash table found by *probing* for the
    open locations. Different kinds of open addressing schemes use *probe sequences*.
    In all cases, the table can hold only as many items as it has, if $n \le t$ and
    $\lambda$ cannot exceed one; this constraint is not present for chaining.


    Open addressing has been modelled in theoretical studies using random probe sequences.
    In these studies, the number of probes for unsuccessful searches is about $\frac{1}{2}(1/(1-\\lambda))$
    and for unsuccessful searches it is about $\frac{1}{2}(1/(1-\lambda)^2)$. These
    values show up as $\lambdalambda$ one. For example, with a load factor of 0.95,
    the expected number of comparisons for a successful search is 10.5, and for an
    unsuccessful search it is 200.5. Real open addressing schemes do not even allow
    as this, so load factors generally be kept below 0.75.


    Another point to understand open addressing is when a collision occurs, the algorithm
    proceeds through the probe sequence until (a) the desired key is found, (b) an
    open location is found, or (c) the entire table is traversed. But this only works
    when a marker is left in slots where an element was deleted to indicate that the
    location may have been empty before, and so the algorithm should proceed with
    the probe sequence. In a highly dynamic table there will be many markers and few
    empty slots, so the algorithm will need to follow long probe sequences, especially
    for unsuccessful searches, even when the load factor is low.


    **Linear probing** using a probe sequence that begins with the hash table index
    and increments it by a constant value modulo the table size. If the table size
    and increment every slot in the table will appear in the probe sequence. Linear
    probing performance degrades sharply when load factors exceed 0.8. Linear probing
    is also subject to *primary clustering*, which occurs when clumps of filled locations
    accumulate around a location where a collision first occurs. Primary clustering
    increases the chances of collisions and degrades performance.


    **Double hashing** works by generating an increment for the probe sequence by
    applying a second hash function to the key. The second hash function should generate
    values quite different from the first so that two keys collide will be mapped
    to different values by the second hash function, making the probe sequences for
    the two keys different. Double hashing eliminates primary clustering. The second
    hash function must always generate a number that is relatively prime to the table
    size. This is easy if the table size is a prime number. Double hashing works so
    well that its performances approximates that of a truly random probe sequence.
    It is thus the method of choice for generating probe sequences.'
