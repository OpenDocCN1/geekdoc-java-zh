  md: "# 9.6 EXAMPLE: MODIFYING A DOUBLY-LINKED CIRCULAR LIST\n\nDoubly-linked lists\
    \ have many links, and sometimes it is confusing to see how to modify them when\
    \ performing list operations. Consequently Figure 4 shows code for inserting and\
    \ deleting in a doubly-linked circular list with a dummy node.\n\n```\npublic\
    \ void insert(int i, T item) throws IndexOfOutOfBoundsException {\n    if (i <\
    \ 0 || count < i) throw new IndexOfException();\n    setCursor(i);\n    Node newNode\
    \ = new Node(item, cursorPtr, cursorPtr.pred);\n    cursorPtr.pred = cursorPtr.succ\
    \ = newNode;\n    cursorPtr = newNode;\n    count++;\n}\n\npublic T delete(int\
    \ i) throws IndexOfOutOfBoundsException {\n    if (i < 0 || count <= i) throw\
    \ new IndexOfException();\n    setCursor(i);\n    T result = cursorPtr.item;\n\
    \    cursorPtr.succ.pred = cursorPtr.pred;\n    cursorPtr.pred.succ = cursorPtr.succ;\n\
    \    cursorPtr = cursorPtr.succ;\n    count--;\n    return result;\n}\n```\n\n\
