  md: '# JAVA DATA STRUCTURES AND ALGORITHMS RECURRENCES


    Our measure of the size of the input is $n$, the number of disks on the source
    peg. The algorithm also does the same thing for a given value of $n$, so we compute
    the every-case complexity $C(n)$. When $n=1$, only one disk is moved, so $C(1)=1$.
    When $n$ is greater than one, the number of disks moved is the number moved to
    shift the top $n-1$ disks to the auxiliary peg, plus one move to put the bottom
    disk on the destination peg, plus the number moved to shift $n-1$ disks from the
    auxiliary peg to the destination peg. This gives the following recurrence:


    ```

    $C(1) = 1 \quad for n = 1$

    $C(n) = 1+2\cdot C(n-1) \quad for n > 1$

    ```


    Although recurrences are nice, they don''t tell us in a closed form the complexity
    of our algorithmsfor$n$ is to start with the initial conditions and work our way
    up to the value of $n$ using the recurrence relation, which can be a lot of work.
    We would like to come up with solutions to recurrences that don''t use recursion
    so we can compute them easily.


    # 14.3 SOLVING RECURRENCES


    There are several ways to solve recurrences but we will consider only one called
    the method of backward substitution. This method has the following steps.


    +   1. Expand the recurrence relation by substituting it into itself several times
    until a pattern emerges.

    2. Characterize the pattern by expressing the recurrence relation in terms of
    $n$ and an arbitrary term $i$.

    3. Substitute for $i$ an expression that will remove the recursion from the equation.

    4. Manipulate the result to achieve a final closed form for the defined function.


    To illustrate this technique, we will solve the recurrences above, starting with
    the one for the string reversal algorithm. Steps one and two for this recurrence
    appear below.


    ```

    $C(n) = 1 + C(n-1)$

    $= 1 + (1 + C(n-2)) = 2 + C(n-2)$

    $= 2 + (1 + C(n-3)) = 3 + C(n-3)$

    $= ...$

    $= i + C(n-i)$

    ```'
