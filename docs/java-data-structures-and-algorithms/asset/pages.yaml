  md: "# 7.4 TAIL RECURSIVE ALGORITHMS\n\nWe have claimed that every recursive algorithm\
    \ can be replaced with a non-recursive algorithm using a stack. This is true,\
    \ but it overstates the case: sometimes a recursive algorithm can be replaced\
    \ with a non-recursive algorithm that does not use a stack. No stack is needed\
    \ if a recursive algorithm is such that only one recursive call is made in the\
    \ final step in each execution of the algorithm's body, then the recursion can\
    \ be replaced with a loop. No data for additional recursive calls is needed—there\
    \ are no additional recursive calls. A very simple example is a recursive algorithm\
    \ to search an array, like the one shown in Figure 6.\n\n```\npublic static boolean\
    \ recursiveSearch(\n    int[] array, int key, int start) {\n    if (array[start]\
    \ == key) return true;\n    int next = start+1;\n    if (array.length == next)\
    \ return false;\n    return recursiveSearch(array, key, next);\n}\n```\n\n**Figure\
    \ 6:** A Recursive Array Search Algorithm\n\n![](img/e42195b5740d05aee932ad08d883699d_74_0.png)"
