  md: '# JAVA DATA STRUCTURES AND ALGORITHMS PREFACE


    Very few algorithms and data structures books do a good job teaching programming,
    and there is no reason for them to try. Algorithms and data structures books should
    concentrate on their main topic; students can learn the programming language from
    any of the excellent books devoted to teaching it. Especially when an algorithms
    and data structures text is either free or costs a few dollars, it is quite reasonable
    to expect students to also obtain a programming language tutorial. There are a
    plethora of introductory Java programming texts, any of which would be a useful
    companion to this book.


    This text is informed by several themes:


    +   * Abstract data typing—All types are presented as implementations of abstract
    types, and strong connections are made between the data structures used to represent
    values and the carrier set of the ADT, and the algorithms used to manipulate data
    and the method set of the ADT.


    +   * Contiguous versus linked representations—Two implementation strategies are
    considered for every ADT: one using contiguous memory locations (arrays), and
    one using linked structures.


    +   * Container hierarchy—A container hierarchy is built using the data structures
    studied in the text. Although modest, this introduces the notion of a container
    library like the ones that students will encounter in many languages, and it shows
    how various containers are related to one another.


    +   * Assertions—Preconditions, post-conditions, class invariants, and unreachable-code
    assertions are stated wherever appropriate, and exceptions are raised when assertions
    are violated.


    The code appearing in the book has been written and tested under Java version
    1.8. Code implementing the container hierarchy and the searching and sorting algorithms
    covered in the book is downloadable from Github at github.com/foxjmu/javaDataStructures.


    I thank Nathan Sprague for many constructive criticisms and error corrections
    that have improved the book. I also thank my students for suggestions and corrections,
    and for willing to test the book for me.


    Christopher Fox

    July, 2018'
