  md: '# 10.2 MEASURING THE AMOUNT OF WORK DONE


    An obvious measure of the amount of work done by an algorithm is the amount of
    time the algorithm takes to do some task. Before we get our stopwatches, however,
    we need to consider several problems with this approach.


    To measure how much an algorithm takes to run, we must code it in a program. This
    introduces the following difficulties:


    +   - A program must be written in a programming language. How can we know that
    the language or its compiler or interpreter have not introduced some factors that
    artificially increase or decrease the running time of the algorithm?

    - The program must run on a machine under the control of an operating system.
    Machines may introduce delays; other processes on the machine may interfere with
    program timings.

    - Programs must be written by programmers; some programmers write very fast code
    and others slower code.


    Without some way to eliminate these confounding factors, we cannot have trustworthy
    measurements of the amount of work done by algorithms—we will only have measurements
    of the running times of various programs written by programmers in particular
    languages running on certain machines with certain operating systems supporting
    loads.


    In response to these difficulties, we begin by abandoning direct time measurements
    of algorithms altogether, instead focusing on algorithms in abstraction from their
    realization in programs written by programmers to run on particular machines running
    certain operating systems. This immediately eliminates most of the problems we
    have considered, but it leads to the question: if we can''t measure time, what
    can we measure?


    Another way to think about the amount of work done by an algorithm is to consider
    how many operations the algorithm executes. For example, consider the subtraction
    algorithm that elementary learn. The input comes in the form of two numbers above
    the other. The algorithm begins by checking whether the value in the units column
    of the bottom is greater than the units column of the top number (a comparison
    operation). If the bottom number is greater, a borrow is made from the units column
    of the top number (a borrow operation). Then the bottom value is subtracted from
    the top number (a subtraction operation). These steps are repeated for the tens
    column, the hundreds column, and so forth, until the entire top number has been
    processed. For example, subtracting 284 from 305 requires three comparisons, one
    borrow, and three subtractions, for a total of seven operations.'
