    An implementation of hashing requires two things:


    +   - A hash function for transforming keys to hash table locations, ideally one
    that makes collisions less likely.

    - A collision resolution scheme to deal with the collisions that are bound to
    occur.


    We discuss each of these in turn.


    # 23.3 HASH FUNCTIONS


    A hash function must transform a key into an integer in the range 0 to t-1, where
    t is the size of the hash table. A hash function should distribute the keys in
    the table as uniformly as possible to minimize collisions. Although many hash
    functions have been proposed and investigated, the best hash functions use the
    division method, which for numeric keys is the following.


    ```

    hash(k) = k % t

    ```'
