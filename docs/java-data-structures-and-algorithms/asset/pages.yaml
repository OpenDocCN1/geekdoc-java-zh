  md: '# JAVA DATA STRUCTURES AND ALGORITHMS BASIC SORTING ALGORITHMS


    ```

    1/(j+1) + 2/(j+1) + 3/(j+1) + ... + j/(j+1) + j/(j+1)

    = 1/(j+1) · ∑_{i=1 to j} i + j/(j+1)

    = 1/(j+1) · j(j+1)/2 + j/(j+1)

    = j/2 + j

    = j/2 + 1

    ```


    The quantity j/(j+1) is always less than one and it is very close to one for large
    values of j, so we simplify the expression as noted above to produce a close upper
    bound for the count of the average number of comparisons when inserting the element
    with index j. We will use this simpler expression in our further computations
    because we know that the result will always be a close upper bound on the number
    of comparisons.


    We see that when inserting an element into the sorted portion of the list we have
    to make comparisons with about half the elements in that portion of the list,
    which makes sense.


    Average with this fact, we can now write down an equation for the approximate
    average case complexity:


    ```

    A(n) = ∑_{j=1 to n} (j/2 + 1)

    = ½ ∑_{j=1 to n} j + ∑_{j=1 to n} 1

    = ½ (n(n-1)/2) + (n-1)

    = (n² + 3n - 4)/4

    = (n-4)(n+1)/4

    ```


    In the average case, insertion sort sorts about as many comparisons as it does
    in the worst case. Unfortunately, these functions are in Θ(n), so insertion sort
    is not a great sort. Nevertheless, insertion sort is quite a bit bubble than selection
    sort on average and in the best case, so it is the best of the Θ(n²) sorting algorithms.


    Insertion sort has one more interesting property to recommend it: it sorts nearly
    very fast. A k-nearly sorted list is a list of all whose are no more than k positions
    from their final locations in the sorted list. Inserting any element into the
    already sorted portion of the list requires at most k comparisons in a k-nearly
    sorted list. A close upper bound on the worst case complexity of insertion sort
    on a k-nearly sorted list is:


    ```

    W(n) = ∑_{i=1 to n} k = k · (n-1)

    ```


    Because k is a constant, W(n) is in Θ(n), that is, insertion sort always sorts
    nearly sorted list in linear time, which is very fast indeed.'
