  md: '![](img/e42195b5740d05aee932ad08d883699d_184_0.png)


    The shortest 2-3 tree holding the most values would be one that has only 3-nodes.
    In a tree with only 3-nodes, there is one node at the root, three-nodes at level
    one, nine three-nodes at level two, and in general $3^h$ 3-nodes at level $h$.
    There are two values stored in each node. Hence the number of values stored in
    the entire tree is


    ```

    $2 \cdot 3^h = 2 \cdot (3^{h+1}-1)/2 = 3^{h+1}-1$.

    ```


    ![](img/e42195b5740d05aee932ad08d883699d_184_1.png)'
  merge: -1
