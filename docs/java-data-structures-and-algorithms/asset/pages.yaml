    +   The Java Iterator interface has no reset() method. When an Iterator object
    is created, it is also initialized. Once iteration is complete, the Iterator object
    is "used up" and a new one must be created.


    +   The Java Iterator interface method for testing whether iteration is complete
    called hasNext() rather than isDone(), and it returns the boolean value.


    +   The Java Iterator interface method next() combines the get() and next() methods
    of the Iterator design pattern: it not moves to the next element in the collection,
    but returns the current element as well. It throws a NoSuchElementException if
    it is called when the collection is exhausted.


    +   Finally, the Java Iterator has a remove() method for removing the element
    returned by next() from the collection. Modifying a collection iteration is not
    always a well-defined operation. Supplying this method in an iterator (optional
    in Java) provides a safe way to modify the collection.


    +   There is no method in the interface for safely inserting elements into a collection
    during iteration, however.


    One feature of Java is that any class that implements the Iterable interface can
    be traversed using the for-each loop. Thus by using an iterator for an arbitrary
    collection class, it automatically becomes traversable using this control structure.


    In our container hierarchy we use the methods of the Java Iterator interface to
    implement external iterators. We will also assume that collections are never altered
    during iteration, so we will not bother with the optional Iterator remove() method.
    Finally, our collections will implement the Java Iterable interface. This means
    that we will be able to use the for-each statement on our collections.


