    key-value pairs. We can use a hash table to store single elements in one of two
    ways. We can treat set elements as element-element pairs (in other words, make
    both the key and the value the same), or we can store the element as the key and
    null or some arbitrary entity as the value. Then all set operations can be done
    in terms of the keys in the hash table, which will be fast (because the keys are
    hashed) achieving good performance.

