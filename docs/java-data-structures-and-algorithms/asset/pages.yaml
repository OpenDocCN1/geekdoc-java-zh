    - The largest value in a heap is at the root, which is always at array location\
    \ zero. We can swap this value with the value at the end of the array and pretend\
    \ the array is one element shorter. Then we have a complete binary tree that is\
    \ almost one.—we just need to sift the root value down the tree as far as necessary\
    \ to make it once. Once, the tree will again be a heap.\n- We can repeat this\
    \ process again and until the entire array is sorted.\n\nThis sorting algorithm,\
    \ called heapsort, is shown in the Java code in Figure 4 below.\n\n```\nvoid heapsort(int[]\
    \ a) {\n  if (a.length < 2) return;\n  int maxSize = a.length-1;\n  for (int i\
    \ = (maxSize-1)/2; 0 <= i; i--)\n    siftDown(a, i, maxSize);\n  while (true)\
    \ {\n    int tmp = a[0];\n    a[0] = a[maxIndex];\n    a[maxIndex] = tmp;\n  \
    \  maxIndex--;\n    if (maxIndex <= 0) break;\n    siftDown(a, 0, maxSize);\n\
