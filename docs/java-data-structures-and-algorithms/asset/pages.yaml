  md: '# # 1 INTRODUCTION


    # ## 1.1 WHAT ARE DATA STRUCTURES AND ALGORITHMS?


    If this book is about data structures and algorithms, then perhaps we should start
    by defining these terms. We begin with a definition for “algorithm.”


    **Algorithm:** A finite sequence of steps for accomplishing computational task.

    An algorithm must


    +   - Have steps that are simple and definite enough to be done by a computer,

    - Terminate after finitely many steps.


    This definition of an algorithm is similar to others you may have seen in prior
    computer science sciences. Notice that an algorithm is a sequence of steps, not
    a program. You might use the same algorithm in different programs, or express
    the same algorithm in different languages, because an algorithm is an entity that
    is abstracted from implementation details. Part of this course is to introduce
    you to algorithms that you can use no matter what language you program in. We
    will write programs in a particular language, but we are really studying the algorithms,
    not their implementations.


    The definition of a data structure is a bit more elusive. We begin with the notion
    of abstract data type.


    **Abstract data type (ADT):** A set of values (the *carrier set*), and operations
    on those values (the *method set*).


    Here are some examples of ADTs:


    **Boolean**—The carrier set of the Boolean ADT is the set {true, false}. The method
    set includes negation, conjunction, disjunction, conditional, is equal to, and
    perhaps some others.


    **Integer**—The carrier set of the Integer ADT is the set {..., -2, -1, 0, 1,
    2, ...}, and the method set includes addition, subtraction, multiplication, division,
    remainder, is equal to, less than, greater than, and so on. Note that although
    some of these operations yield other Integer values, some yield values from other
    ADTs (like true and false), but all have at least one Integer argument.'
  merge: -1
