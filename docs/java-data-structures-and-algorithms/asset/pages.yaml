    **Figure 3:** Numbering Vertices for Contiguous Storage


    Consider the numbers assigned to the vertices of the complete binary tree in Figure
    3. Note that numbers are assigned left to right across levels, and from top to
    bottom of the tree.


    This numbering scheme can be used to identify each vertex in a complete binary
    tree: vertex zero is the root, vertex one is the left child of the root, vertex
    two is the right child of the root, and so forth. In particular that


    +   - The left child of vertex $k$ is vertex $2k+1$.

    - The right child of vertex $k$ is vertex $\lfloor(k+1)/2\rfloor$.

    - The parent vertex $k$ is vertex $\lfloor k/2\rfloor$.

    - If there are $n$ vertices in the tree, the last one with a child is vertex $\lfloor
    n/2\rfloor - 1$.


    If we let these vertices number be array indices, then each location is associated
    with a vertex in the tree, and we can store the values at the vertices of the
    tree in the array: the value of vertex $k$ is stored in array location $k$. The
