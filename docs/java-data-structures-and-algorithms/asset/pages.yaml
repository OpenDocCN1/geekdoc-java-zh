  md: 'JAVA DATA STRUCTURES AND ALGORITHMS


    PREFACE


    # PREFACE


    Typical algorithms and data structures textbooks are seven or eight hundred pages
    long, include chapters about software engineering and the programming language
    used in the book, and include appendices with yet more information about the programming
    language. Often they include lengthy case studies with tens of pages of specifications
    and code. Frequently they are hardcover books in two colors; sometimes they are
    sidebars with various sorts of supplementary material. All of these characteristics
    make these textbooks very expensive (and very heavy), by my experience, relatively
    few students take advantage of the bulk of this material and few appreciate these
    books'' features: much of the time and money lavished on these texts is wasted
    on their readers.


    Students seem to prefer dealing with only essential material compressed into the
    fewest of pages. Perhaps this is attributable to habits formed by life on the
    Internet, or perhaps it is due to extreme pragmatism. But whatever the reason,
    it is very difficult to persuade most computer students to engage with long texts,
    large examples, and extra material, no matter how it is presented and illustrated.
    This is a response to this tendency.


    This text covers the usual topics in an introductory survey of algorithms and
    data structures, but it does so in under 200 pages. There are relatively few examples
    and no large case studies. Code is presented in Java (maybe about this in a moment),
    but the book does not teach Java and it does not include reference material about
    the language. There are no sidebars and the book is in black and white. The book
    includes features of pedagogical value: every chapter has review questions with
    answers, and a set of exercises. There is also a glossary at the end. Versions
    of this book using Java and other programming languages have been used successfully
    for several years to teach introductory algorithms and data structures at James
    Madison University. Many students have commented appropriately regarding its brevity,
    clarity, and low cost.


    Ideally, a language for algorithms and data structures would be easy to learn
    (so as to leave time for learning algorithms and data structures), support data
    abstraction well, provide a good development environment, and engage students.
    Although Java is large and therefore a challenge to learn, a subset of it for
    the needs of an introductory algorithms and data structures course can be learned
    with some effort. Java is an object-oriented language with interfaces and generics,
    so it does an excellent job supporting data abstraction. It is also statically
    typed and provided assertions, so it provides lots of help to novice programmers.
    Finally, it is fully supported by Eclipse, including the industry JUnit testing
    framework. Thanks to its popularity, many students learn Java in high school or
    on their own, and those who do not know it want to learn it. Overall, Java is
    an excellent choice for teaching algorithms and data structures.


