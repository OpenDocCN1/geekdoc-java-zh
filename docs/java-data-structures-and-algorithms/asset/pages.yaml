    providing almost instantaneous access to values through their keys. Unfortunately,
    it is inevitable that more than one key will be hashed to each table location,
    causing a collision and requiring some way to store more than one value associated
    with a single table location.


    The two main approaches to collision resolution are chaining and open addressing.
    Chaining uses linked lists of key-value pairs that start in hash table locations.
    Open addressing uses probe sequences to look through the open store to store a
    key-value pair and then later find it. Chaining is very robust and has good performance
    for a wide range of load factors, but it requires extra space for the links in
    the list nodes. Open addressing uses space efficiently, but its performance degrades
    quickly as the load factor approaches one; expanding the table is very expensive.


    No matter how hashing is implemented, average performance for insertions, deletions,
    and searches is $\Theta(1)$. Worst case performance is $O(n)$ for chaining resolution,
    which only occurs in the very unlikely event that the keys are hashed to only
    a few locations. Worst case performance for open addressing is a function of the
    load factor that gets large when $\lambda$ is near one, but if $\lambda$ is kept
    below 0.8, $W(n)$ is less than 10.


