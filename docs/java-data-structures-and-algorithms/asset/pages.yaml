  md: '# 25.5 THE GRAPH INTERFACE


    A graph is not a collection so the Graph interface is not a sub-interface of any
    other interface in our container hierarchy. It is very convenient to be able to
    iterate over the vertices adjacent to a given vertex so the Graph interface depends
    on the Iterator interface (though this is not shown in the UML diagram). The Graph
    interface appears in Figure 4.


    | interface |

    | --- |

    | edges() : Integer |

    | vertices() : Integer |

    | addEdge(v, w : Integer) : { 0 < v != Vertices() } |

    | isEdge(v, w : Integer) : boolean |

    | iterator(v : Integer) : Iterator<Integer> : { 0 <= v < Vertices() }


    **Figure 4:** The Graph Interface


    Most of these functions would work just as one expect from the graph ADT. The
    add() and iterator() operations do nothing if their preconditions are violated.
    There is no need for an iterator over the vertices in the graph because we know
    that they are (represented by) the integers between 0 and vertices() -1.


    # 25.6 CONTIGUOUS IMPLEMENTATION OF THE GRAPH ADT


    A contiguous implementation of the graph ADT represents a graph using an array.
    An initial set of natural numbers already represents vertices, the only thing
    left to represent the set of edges. An adjacency matrix m is an n x n Boolean
    matrix that represents a graph with n vertices by storing true at location m[v,w]
    if and only if there is an edge between v and w. Notice that this means every
    edge is represented twice in the matrix.


    This scheme is very simple and fast: adding an edge to a graph or detecting whether
    an edge exists between two vertices are Θ(1) operations, and iterating over the
    vertices adjacent to a vertex takes time proportional to the number of vertices
    in the graph. Unfortunately, this speed comes at cost because the matrix requires
    n² storage locations. Most graphs are sparse, meaning they have fewer than n²
    edges, so often most of this storage is wasted. Even if a graph is dense (the
    opposite of sparse), space can be saved by storing the edges that are not in the
    graph rather than in the graph. In either case, the adjacency matrix representation
    makes efficient use of space.'
