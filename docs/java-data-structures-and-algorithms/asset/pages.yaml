    # LISTS


    Suppose a singly-linked list is used to hold list elements. It consists of a variable,
    often called head, holding a reference to the first node in the list. This first
    node may contain data for the first element in the list, or it may be a dummy
    node (thought of being at location -1) that is always present, even when the list
    is empty. Using a dummy node wastes space, but it greatly simplifies various list
    manipulation algorithms, so we will use one in our algorithms. In any case, when
    the list is empty, either head or the link field of the dummy node is null. The
    length of the list is also typically recorded.


    Most operations take an index i as an argument, so most algorithms to implement
    these operations will have to begin with head and walk from node to down to locate
    the node at position i or position i-1. (Why i-1? Because for addition and removal,
    the link field in the node preceding i will have to be changed.) If lists are
    long and there are many changes towards the end of the list, processing must be
    done simply by finding the right spot in the list to do things.


    This difficulty can be alleviated by keeping a cursor consisting of an index number
    and a reference to the list. The cursor is used to find the node that some operation
    needs to do its job. The next time an operation is called, it may be able to use
    the existing value of the cursor, or with it slight changes, thus saving time.
    For example, suppose that a value is added to the end of the list. The cursor
    is used to walk down to the end of the list and make the addition; when this task
    is done, the cursor marks the node at, let us say, location size()-2 in the list.
    If another addition is made, the cursor only needs to be moved forward one node
    to the end of the list to mark the node whose link field must be changed—the walk
    from its beginning has been avoided.


    It may also be useful to maintain a reference to the end of the list. Then operations
    at the end of the list can be done quickly in exchange for the slight additional
    effort of maintaining the extra reference. If a client does many operations at
    the end of a list, the extra work will be justified.


    Another way to make list operations is to store elements in a doubly-linked list
    in which each node (except those the ends) has a link to both its successor and
    its predecessor nodes. A dummy first node may be used as well. Figure 2 below
    illustrates this setup with a dummy first node.


    ![](img/e42195b5740d05aee932ad08d883699d_90_0.png)


