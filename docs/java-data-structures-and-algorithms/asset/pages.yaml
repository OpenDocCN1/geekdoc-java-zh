  md: '# 11 FUNCTION GROWTH RATES


    # 11.1 INTRODUCTION


    We have set up an approach for determining the amount of work done by an algorithm
    based on formulating functions expressing counts of basic operations in terms
    of the size of the input to the algorithm. By concentrating on basic operations,
    our analysis framework introduces a certain amount of imprecision. For example,
    an algorithm whose complexity $C(n) = 2n-3$ may actually run slower than an algorithm
    whose complexity is $C(n) = 12n+5$, because unaccounted operations in the former
    may slow its actual execution time. Nevertheless, both of these algorithms would
    surely run much more quickly than an algorithm whose complexity $C(n) = n^2$ as
    it becomes large; the running times of the first two algorithms are much closer
    to each other than to the third algorithm.


    In comparing the efficiency of algorithms, we are more interested in big differences
    that manifest themselves as the size of the input becomes large we are in small
    differences in running times by a constant or a multiple for inputs of all sizes.
    The theory of the asymptotic growth rate of functions, also called the order of
    growth of functions, provides a basis for partitioning algorithms into groups
    with equivalent efficiency, as we will now see.


    # 11.2 DEFINITIONS AND NOTATION


    Our goal is to classify functions into groups by growth rates. Our notation describes
    groups of functions using a reference function (which may be any). The three groups
    we distinguish are the following.


    +   pronounced big-of $f$ )—The set of functions that grow no faster than $f(n)$
    (that is, those that grow more slowly than $f(n)$ or at the same rate as $f(n)$).
    For example, $8n+5 \in O(n)$, $8n+5 \in \Omega(n)$, and $6n^2+23n-14 \in O(n^2-18n+65)$.


    +   pronounced big-omega $f$)—The set of functions that grow at least fast as
    $f(n)$ (that is, those that grow more quickly than $f(n)$ or at the same rate
    as $f(n)$). For example, $8n+5 \in \Omega(n)$, $n^2 \in \Omega(8n+5)$, and $6n^2+23n-14
    \in \Omega(n^2-18n+65)$.


    +   pronounced big-theta $f$)—The set of functions that grow at the same rate
    as $f(n)$. For example, $8n+5 \in \Theta(n)$, $n^2 \in \Theta(n^2-987)$, and $6n^2+23n-14
    \in \Theta(n^2-18n+65)$.


    These three groups overlap: the intersection of $O(f)$ and $\Omega(f)$ is $\Theta(f)$.'
