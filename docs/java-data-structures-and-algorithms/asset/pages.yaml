  md: '# 5.8 SUMMARY AND CONCLUSION


    Both contiguous and linked implementations of stacks are simple and efficient,
    but the contiguous implementation either places a size restriction on the stack
    or uses an expensive reallocation technique if a stack grows too large. If continuously
    implemented stacks are made extra to make sure they do not overflow, space may
    be wasted.


    A linked implementation is essentially unbounded, so the stack never becomes full.
    It is also very efficient in its use of space because it only allocates enough
    nodes to store the values actually kept in the stack. Overall, then, the linked
    implementation of stacks seems better than the contiguous implementation.


