    + n-3 + n-7 + 8 \cdot B((n-7)/8)$

    ...$

    $B(n) = n-1 + n-3 + n-7 + ... + (n-2''-1) + 2'' \cdot B((n-2''-1))$

    ```


    If we let $(n''-1)/2 = k''$ for $i$, by substituting $i = k-1$, we have


    ```

    $B(n) = n-1 + n-3 + n-7 + ... + (n-2''-1)$

    $= \sum_{j=1}^{k''} n - (2j-1)$

    $= \sum_{j=1}^{k''} (n+1) - \sum_{j=1}^{k''} 2^j$\n$= (k-1) \cdot (n+1) - n$\n$=
    k \cdot (n+1) - n - (2^{k''}-1)$

    $= (n+1) \lg n - 2n$

    ```


    Thus the best complexity of quicksort is in $\Theta(n \lg n)$.


    Quicksort''s worst behavior occurs when the pivot element always ends up at one
    end of the sub-list, meaning that sub-lists are not divided in half when they
    are partitioned, instead one sub-list is empty and the other has one less than
    the sub-list before partitioning. If the first or last value in the list is used
    as the pivot, this occurs when the original list is already in order or in reverse
    order. In this case the recurrence relation is


    $W(n) = n-1 + W(n-1)$


    This recurrence relation is easily solved and turns out to be $W(n) = n(n-1)/2$,
    which of course we know to be in $\Theta(n^2)$!


    The average complexity of quicksort involves a recurrence that is somewhat hard
    to solve, so we simply present the solution: $A(n) = 2(n+1) \cdot \ln 2 \cdot
    \lg n = 1.39(n+1) \lg n$. This is not far from quicksort''s best case complexity.
    In the best and average cases, quicksort is very fast, performing $\Theta(n \lg
    n)$ comparisons; but in the worst case, quicksort is very slow, performing $\Theta(n^2)$
    comparisons.'
