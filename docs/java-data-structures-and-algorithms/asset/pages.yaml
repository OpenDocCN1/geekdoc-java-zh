  md: '# 23.4 COLLISION RESOLUTION SCHEMES


    There are main kinds of collision resolution schemes, with many variations: chaining
    and open addressing. In each scheme, an important value to consider is the load
    factor, $\lambda = n/t$, where $n$ is the number of elements in the hash table
    and $t$ is the table size.


    # Chaining


    In chaining (or separate chaining) records whose keys collide are formed into
    a linked list or chain whose head is in the hash table array. Figure 2 shows a
    hash table with collisions resolved using chaining. For simplicity


    ![](img/e42195b5740d05aee932ad08d883699d_211_0.png)


    Figure 2: Hash Table with Chaining to Resolve Collisions


    In this example, the table has seven locations. Two keys, $q$ and $w$, collide
    at location two and are placed in a linked list whose head is at location two.
    The keys $x$, $b$, and $k$ are hashed to locations three, four, and six, respectively.
    This example uses an array of list heads, or could be used well, with some special
    value in the data field to indicate when a node is unused.


    The average chain length is $\lambda$. If the chain is unordered, on average successful
    searches require $1+\lambda/2$ comparisons and unsuccessful searches about $\lambda$.
    If the chain is ordered, both successful and unsuccessful searches take about
    $1+\lambda/2$ comparisons, but insertions take longer. In the worst case, when
    all keys map to a single table location and the search key is at the end of the
    linked list or not in the list, searches require $n$ comparisons.


    More complex linked structures (like binary trees) don''t generally improve performance
    much, particularly if $\lambda$ is fairly small. As a rule of thumb, $\lambda$
    should be kept less than 10. Performance degrades gradually as the number of items
    in the table grows, so hash tables using chaining to resolve collisions can perform
    well on wide ranges of values of $n$.'
