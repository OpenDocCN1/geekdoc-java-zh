    # 25.4 THE GRAPH ADT


    A graph is a mathematical entity consisting of an ordered pair of sets. Vertices
    can be anything; for example, they could be numbers. Hence we can specify the
    carrier set of the graph ADT as the set of all sets that meet the definition of
    a graph stated above, with initial sets of natural numbers acting as vertices.
    The implicit-receiver method of the graph ADT consists of a few basic operations
    for constructing and querying graphs. We could include operations for adding and
    deleting vertices and deleting edges, as well as several query operations, but
    they are not necessary for the applications we consider.


    newGraph(n)—Return a graph with $n$ vertices and no edges. The precondition of
    this operation is that $n \geq 0$.


    edges()—Return the number of edges in the graph.


    vertices(v)—Return the number of vertices in the graph.


    addEdge(v,w)—Augment the graph with an edge connecting $v$ and $w$. The precondition
    is that $v$ and $w$ are distinct vertices in $g$.


    isEdge(v,w)—Return true if and only if there is an edge between vertices $v$ and
    $w$ in the graph.'
