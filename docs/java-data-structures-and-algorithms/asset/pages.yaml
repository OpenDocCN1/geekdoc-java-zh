  md: '# 26.7 SUMMARY AND CONCLUSION


    Depth-first and breadth-first search are two ways to visit the vertices of a graph
    by following its edges in an organized way. Both algorithms work in time proportional
    to the number of edges and vertices in the graph. Depth-first and breadth-first
    search are the basis for many algorithms that process graph in various ways, including
    determining whether two vertices are connected, determining whether a graph is
    connected, finding the shortest path between two vertices, and finding a spanning
    tree for a connected graph.


