  md: '# 19.4 DELETION IN AVL TREES


    Deletion in AVL trees resembles deletion in ordinary binary search trees: a search
    is made from the root tree to the node holding the deleted value, the target node.
    If this node has at most one child, it can be deleted and its child, if any, attached
    to its parent in its place. If the target node has two children, its successor
    node can be found by descending one node to the right then all the way down the
    tree to the left. This successor node only as a right child, so it can be deleted
    and value copied over the value in the target node, removing the deleted value
    and preserving the tree as a binary search tree.


    In an AVL tree, after a node is removed, the tree may become unbalanced. As insertion,
    the path back to the root must be retraced, adjusting balance factors and perhaps
    rearranging the tree to rebalance.


    Rebalancing is done using the same four rotations for insertion. During insertion,
    if a node has a balance factor of 2 (or -2), its left (right) child must have
    a balance factor of 1 or -1, and this determines which rotation to use. During
    deletion, the child of a node with balance factor of 2 (or -2) may have a left
    (right) child with a balance factor of 0. In such cases an R (or L) rotation is
    used to rebalance the tree, but otherwise deciding which rotation to use is the
    same as for insertion.


    Figure 3 shows several operations on an AVL tree illustrating insertions and deletions
    that force rebalancing. The first insertion makes the node holding e have a balance
    factor of 2 and a left node with a balance factor of 1, calling for an R rotation.
    Notice that after this the subtree is perfectly balanced. After inserting k node
    i has a balance factor of -2 and its right child has a balance factor of 1. This
    calls for an RL rotation, which again brings the subtree into perfect balance.
    Deleting e causes the node holding the successor of e (namely f) to be removed,
    and the successor to be copied into the node holding e. This makes the node holding
    f have a balance factor of 2 with a left child whose balance factor is 0. This
    means an R rotation should be applied. Afterwards, the subtree is not perfectly
    balanced, but all balance factors are again between -1 and 1.


    This example was designed to show various operations cause rotations to occur,
    but very often operations do not cause any rotations. For examples, deleting any
    node a in the last tree in Figure 3 would not cause the tree to need to be rebalanced.'
