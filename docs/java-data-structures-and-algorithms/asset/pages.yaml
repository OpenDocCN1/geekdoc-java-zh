  md: '# ASSERTIONS


    # 4.1 INTRODUCTION


    At each point in a program, there are usually constraints on the computational
    state that must hold for the program to be correct. For example, if a certain
    variable is supposed to record a count of how many changes have been made to a
    file, this variable should never be negative. It helps human readers to know about
    these constraints. Furthermore, if a program checks these constraints as it executes,
    it may find errors as soon as they occur. For both reasons, it is advisable to
    record constraints about program state in assertions.


    **Assertion:** A statement that must be true at a designated point in a program.


    # 4.2 TYPES OF ASSERTIONS


    **Preconditions—A precondition** is an assertion that must be true at the initiation
    of an operation. For example, a square root operation cannot accept a negative
    argument, so a precondition of this operation is that its argument is non-negative.
    Preconditions often specify restrictions on parameters, but they may also specify
    that other conditions have been established, such as a file being created or a
    device having initialized. Often an assertion has no preconditions, meaning that
    it can be executed under any circumstances.


    **Post conditions—A post condition** is an assertion that must be true at the
    completion of an operation. For example, a post condition of the square root operation
    is that its result, squared, is within a small amount of its argument. Post conditions
    usually specify relationships between the arguments and the result, or restrictions
    on the results. Sometimes they may specify that the arguments do not change, or
    that they change in certain ways. Finally, a post condition may specify what happens
    when a precondition is violated (for example, an exception will be thrown).


    **Class invariants—A class invariant** is an assertion that must be true of any
    class instance before and after all of its operations. Usually class invariants
    specify properties of fields and relationships between the fields in a class.
    For example, suppose Bin class contains containers of discrete items, like apples
    or oranges. The Bin class might have `currentSize,spaceLeft, and capacity` fields.
    One of class invariants is that `currentSize` and `spaceLeft` must be between
    zero and `capacity`; another is that `currentSize + spaceLeft = capacity`.'
