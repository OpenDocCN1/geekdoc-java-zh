    Strings are not simple types in Java; we discuss Java strings in more detail later.


    # 2.3 STRUCTURED TYPES IN JAVA


    Java has only three structured types.


    Array—A fixed length, ordered collection of values of the same type (called the
    element type) stored in contiguous memory locations.


    Class—A collection of named fields and methods that may access these fields. Classes
    are the central type in Java and are used for a variety of purposes, including
    grouping fields and methods, as acting a library-like container for methods, and
    controlling access to methods.


    Interface—A collection of method signatures. A method signature is the name, number
    and type of parameters, and return type of a method. Interfaces are discussed
    in detail in the next chapter.


    These built-in structured types can be combined to make more complex structured
    types. For example, an array can have elements that are classes some which and
    others which are arrays. Thus programmers can build arbitrarily complicated structured
    types.


    An important distinction between types in a language is whether a type is value
    or a reference type.


    +   Value type: A type whose variables hold data structures representing the values
    of the carrier set of the type.


    +   Reference type: A type whose variables hold references to locations where
    data structures representing the values of the carrier set of the type are stored.


    To illustrate this distinction, note that in Java the byte type is a value type
    and array types are reference types. If v is a byte variable storing the value
    five, for example, then the memory location associated with v holds the representation
