  md: '# 21.4 CONTIGUOUS IMPLEMENTATION OF SETS


    The elements of the set can be stored in an array or an ArrayList but this approach
    is not

    very efficient. To see this, lets consider how the most important set operations—insertion,

    deletion, and membership check—would be implemented using an array. If the elements

    are kept in order, then inserting them is very fast, but deleting them is slow
    (because

    a sequential search must be done to find the deleted element), and the membership
    check

    is slow (because it requires a sequential search). If the elements are kept in
    order, then

    the membership check is fast (because binary search can be used), and insertion
    and deletion

    is very slow because average half the elements must be moved to or close a hole

    for the inserted or deleted element.


    ![](img/e42195b5740d05aee932ad08d883699d_196_0.png)


    Figure 1: The Set Interface


    There is one way to implement sets using contiguous storage that is very time
    efficient,

    tough it not be space efficient. A boolean array, called a characteristic function,
    can

    represent a set. The characteristic function is indexed by elements so that the
    value of

    the characteristic function at index x is true only if x is in the set. Insertion,
    deletion,

    and the membership check can have all be constant in time. The problem, of course,
    is

    that each characteristic function array must have an element for every possible
    value that

    could be in the set, and these values must be able to index the array. If a set
    holds values

    from a small sub-range of an integral type, such as the ASCII characters, or integers
    from

    0 to 50, then this technique is feasible (though it might still waste a lot of
    space). But for

    large ranges or for non-integral sets, this technique is no longer possible.


    There is one more contiguous implementation technique that is very fast for sets:
    hashing.\We will discuss using hashing to implement sets later on.'
