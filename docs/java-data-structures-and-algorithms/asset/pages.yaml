    Figure 3 below shows an example of open addressing with double hashing. As before,
    the example only uses keys for simplicity, key-value pairs. The main hash function
    is f(x) = x % 7, and the hash function used to generate a constant for the probe
    sequence g(x) = (x % 5)+1. The values 8, 12, 9, 6, 25, and 22 are hashed into
    the table.


    | | |

    |---|---|

    | 0 | 22 |

    | 1 | 8 |

    | 2 | 9 |

    | 3 | -- |

    | 4 | 25 |

    | 5 | 12 |

    | 6 | 6 |


    **Figure 3:** Hash Table with Open Addressing and Double Hashing to Resolve Collisions


    The first five keys do not collide. But 22 % 7 is 1, so 22 collides with 8. The
    probe constant for double hashing is (2 % 5)+1 = 3. We add 3 to location 1, where
    the collision occurs, to obtain location 4. But 25 is already at this location,
    so we add 3 to obtain location 0 (wrap around to the start of the array using
    the table size: (4+3) % 7 = 0). Location 0 is not occupied, so that is 22 is placed.


    Note that some sort of special value must be placed in the unoccupied locations—in
    this example we use a double hash. A different value must be used when a value
    is removed from the table to indicate that the location is free, but that was
    not before, so that searches continue past this value when it is encountered during
    a probe sequence.


    We have noted that using open addressing to resolve collisions, performance degrades
    considerably as the load factor approaches one. In this effect means that hashing
    mechanisms for open addressing may vary to expand the table to lower the load
    factor and improve performance. A new, larger table can be created and filled
    by traversing the old table and inserting all records into the new table. Note
    that this involves every key again because the hash function will generally use
    the table size, which has changed. Consequently, this is a very expensive operation.


    Some table expansion schemes work incrementally by keeping the old table around
    and making all insertions in the new table, all deletions from the old table,
    and perhaps moving records gradually from the old table to the new in the course
    of doing operations. Eventually the old table becomes empty and can be discarded.


