    # 13.6 SUMMARY AND CONCLUSION


    For small lists less than a few hundred elements, any of the algorithms we have
    considered in this chapter are adequate. For larger lists, Shell sort is usually
    the best choice, except in a few special cases:


    +   - If a list is nearly sorted, use insertion sort;

    - If a list contains large records that are very expensive to move, use selection
    sort because it does the fewest number of data moves (of course, the fast algorithms
    we study in a later chapter are even better).


    Never use bubble sort: it makes many comparisons as any other sort, and usually
    moves more data than any other sort, so it is generally the slowest of all.


