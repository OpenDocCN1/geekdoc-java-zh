    The modular division is what makes the queue wrap around the end of the array
    to its beginning. This trick of using a circular array is the standard approach
    to implementing queues in contiguous locations.


    If a static array is used, then the queue can become full; if a dynamic array
    is used, the queue is essentially unbounded. As we have mentioned before, resizing
    an array is an expensive operation because new space must be allocated, the contents
    of the array copied, and the old space deallocated, this flexibility has a cost.
    Care must also be taken to move elements properly to the expanded array—remember
    that the front of the queue may be somewhere in the middle of the full array,
    with elements wrapping around the front.


    Implementing the operations of the queue ADT using this data structure is quite
    straightforward. For example, to implement the leave() operation, a check is first
    made that the precondition of the operation (that the queue is not violated) by
    testing whether count equals 0. If not, the value at store[frontIndex] is saved
    in a temporary variable, frontIndex is set to (frontIndex+1) % capacity, count
    is decremented, and the value stored in the temporary variable is returned.


