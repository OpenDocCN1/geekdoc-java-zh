    are considerably faster than quicksort in many real-world cases.


    # 15.5 SUMMARY AND CONCLUSION


    Merge sort is a fast sorting algorithm whose best, worst, and average complexity
    are all in Θ(n lg n), but unfortunately it uses Θ(n) extra space to do its work.
    Quicksort has best and average case complexity in Θ(n lg n), but unfortunately
    its worst case complexity is in Θ(n). The median-of-three improvement makes quicksort''s
    worst case behavior less likely, but it is still vulnerable to poor performance
    on data with some order. Nevertheless, quicksort is still the fastest algorithm
    known for sorting random data by comparison of keys.


