  md: '# JAVA DATA STRUCTURES AND ALGORITHMS


    the exit, and intersections in the maze to graph edges. Moving through a maze
    from the entry to the exit corresponds to the problem of searching a graph representing
    the maze to find a path from the entry vertex to the exit vertex.


    There are two main approaches to graph search.


    +   * Depth-first search: A search that begins by visiting vertex v, and then
    recursively searches the unvisited vertices adjacent to $v$.


    +   * Breadth-first search: A search that begins by visiting vertex v, then visits
    the vertices adjacent to $v$, then visits the vertices adjacent to each of $v$''s
    adjacent vertices, and so on.


    Vertices in a depth-first search are visited in an order that follows paths leading
    away from the starting vertex until the paths can be followed further; the algorithm
    then backs up and follows other paths. Vertices deep in the graph (relative to
    the starting vertex) are visited sooner than shallow vertices. In contrast, during
    a breadth-first search the vertices closest to the starting vertex are visited
    first, then those bit further away, and so on. Some problems are solved with one
    kind of search, some with the other, and in some cases it does not matter which
    kind of search is used.


    # 26.3. DEPTH-FIRST SEARCH


    Given its recursive characterization, it is not surprising that depth-first search
    is easily implemented using recursion. Consider the Java code in Figure 1. The
    $DFS()$ method is called with a graph to be searched, an origin vertex to start
    from, and an instance of an $EdgeVisitor$ class containing a method $visit()$
    that is applied to edges. It may seem peculiar to use edge visitor to process
    vertices, but it turns out that there are several algorithms that we can implement
    if our depth-first and breadth-first algorithms use edge visitors rather than
    vertices. If we need to visit a vertex rather than an edge, we will use an edge
    visitor that processes only the second vertex in the edge, thus achieving the
    same while preserving flexibility in our visitor methods.


    The $DFS()$ method sets up a boolean array to keep track of the vertices that
    have been visited and then calls a private $dfs() to actually do the work. The
    recursive $dfs$ visits the graph, the $EdgeVisitor$ instance, the vertices adjacent
    to $v$, and for each adjacent vertex $w$ not yet visited, it applies the method
    to $w$, marks $w$ as visited, and calls itself on $w$.


