  md: '# 17.5 LINKED IMPLEMENTATION OF BINARY TREES


    A linked implementation of binary trees resembles implementations of other ADTs
    using linked structures. Binary tree nodes require three fields: one for the data
    held at the node and two for references to the nodes that are the roots of the
    left and right sub-trees. In addition, it is useful to use an object acting as
    a host for the graph formed by the linked nodes. This host has a reference to
    the tree’s root node and other fields as needed. For example, a count field may
    be useful to keep track of the number of nodes in the tree.


    Figure 4 shows how this works for a small example. There is a single instance
    of the host structure with a count field and a root field. The reference in the
    root field points to the root node of the tree. The fields in the nodes are called
    value (for the data at the node), left, and right (for the references to the sub-trees).
    The reference fields in these structures are null when they refer to empty.


    Trees are inherently recursive structures so it is natural to write BinaryTree
    methods recursively. For example, the height of a binary tree that has one or
    less vertices is zero, and otherwise it is one plus the maximum of the heights
    of its two sub-trees. Thus in a Java implementation we may write a height() method
    that calls a private heightOfTree(TreeNode r) method with the root node of the
    tree as its argument. This method returns zero if its argument node is null or
    has empty subtrees, and otherwise returns one plus the maximum of recursive calls
    on the left and right sub-trees of its argument node. Many other BinaryTree methods,
    and particularly the internal iterator methods, can be implemented using recursion.


    ![](img/e42195b5740d05aee932ad08d883699d_159_0.png)'
