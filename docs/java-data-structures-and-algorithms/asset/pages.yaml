  md: '# JAVA DATA STRUCTURES AND ALGORITHMS


    # RECURRENCES


    The last expression characterizes the recurrence relation for an arbitrary term.
    C(n-i) equal to an initial condition for i = n-1. We can substitute this into
    the equation as follows.


    ```

    C(n) = i + C(n-i)

    = n-1 + C(n - (n-1))

    = n-1 + C(1)

    = n-1 + 0

    = n-1

    ```


    This solves the recurrence: the number of concatenations done by the Reverse()
    function on a string of length n n-1 (which makes sense if you think about).


    Now lets do the same thing for the recurrence we generated for the Towers of Hanoi
    algorithm:


    ```

    C(n) = 1 + 2 · C(n-1)

    = 1 + 2 · (1 + 2 · C(n-2)) = 1 + 2 + 4 · C(n-2)

    = 1 + 2 + 4 · (1 + 2 · C(n-3)) = 1 + 2 + 4 + 8 · C(n-3)

    = ...

    = 1 + 2 + 4 + ... + 2'' · C(n-i)

    ```


    The initial condition for the Towers of Hanoi problem is C(1) = 1, and if we set
    i to n-1, then we can achieve this initial condition and remove the recursion:


    ```

    C(n) = 1 + 2 + 4 + ... + 2'' · C(n-i)

    = 1 + 2 + 4 + ... + 2^(n-1) · C(n-(n-1))

    = 1 + 2 + 4 + ... + 2^(n-1) · C(1)

    = 2ⁿ - 1

    ```


    The number of moves to solve the Towers of Hanoi puzzle for n disks is 2^n - 1,
    which is obviously in Θ(2^n).


    # 14.4 SUMMARY AND CONCLUSION


    Recurrences provide the technique to analyze recursive algorithms. Together with
    the summations technique we use with non-recursive algorithms, we are now in a
    position to analyze any algorithm we write. Often the analysis is mathematically
    difficult, so we may not always succeed in our analysis efforts. But at least
    we have techniques that we can use.


