  md: '# 13 BASIC SORTING ALGORITHMS


    # 13.1 INTRODUCTION


    Sorting is a fundamental and important data processing task.


    **Sorting algorithm:** An algorithm that rearranges records in lists so that they
    follow well-defined ordering on values of keys in each record.


    An internal sorting algorithm works on lists in main memory, while an external
    sorting algorithm works on lists stored in files. Some sorting algorithms work
    better as internal sorts than external sorts, but some work in both contexts.
    A sorting algorithm is *stable* if it preserves the original order of records
    with equal keys.


    Many sorting algorithms have been invented; in this chapter we will consider the
    simplest sorting algorithms. In our discussion in this chapter, all measures of
    input size are the length of the sorted lists (slices in the sample code), and
    the basic operation counted is comparison of list elements (also called *keys*).
    Our implementations are in Java, and to keep the algorithms simple, they are all
    framed as sort arrays of `ints`. We could generalize the algorithms to sort arrays
    of other types, but this would distract attention from the essentials of sorting.
    You can generalize these algorithms for other array types as an exercise.


    # 13.2 BUBBLE SORT


    Bubble sort is one of oldest sorting algorithms. The idea behind it is to make
    repeated passes through the list from beginning to end, comparing adjacent elements
    and swapping any that are out of order. After the first pass, the largest element
    will have moved to the end of the list; after the second pass, the second largest
    will have been moved to the penultimate position; and so forth. The idea is that
    large values “bubble up” to the top of the list on each pass.


    A Java implementation of bubble sort appears in Figure 1.'
