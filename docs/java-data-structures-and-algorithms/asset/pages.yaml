    # 15.3 QUICKSORT


    Quicksort was invented by C. A. R. Hoare in 1960, and it is the fastest known
    algorithm for sorting random data by comparison of keys.


    Quicksort is a divide and conquer algorithm. It works by selecting a single element
    in the list, called *pivot element*, and rearranging the list so that all elements
    less than or equal to the pivot are to its left, and all elements greater than
    equal to it to its right. This operation is called *partitioning*. Once a list
    is partitioned, the algorithm calls itself recursively to sort the sub-lists left
    and right of pivot, the sub-lists have length one or zero, at which point they
    are sorted, ending the recursion.


