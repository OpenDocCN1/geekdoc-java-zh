    # 9.10 REVIEW QUESTION ANSWERS


    +   1. It does not matter where element numbering begins: it may begin at any
    value. However, it is usual in computing to start at zero, and in everyday life
    to start at one, one of these types is preferable.


    +   2. The ADT index(e) operation cannot return an index when e is not in the
    list. Its result is undefined in this case. The index() operation in the List
    interface returns -1 to indicate that e is not in the collection.


    +   3. A cursor is a variable marking a location in a data structure. In the case
    of a List, a cursor is a data structure marking a particular element in the List.
    For an ArrayList, a cursor might be an index. For a LinkedList, it is helpful
    for the cursor to hold both the index and a reference to the node where the item
    is stored.


    +   4. A contiguous implementation of the list ADT does not perform well when
    the list is long and is often changed near its beginning. Every change near the
    beginning of a long contiguously implemented list requires that many list elements
    be copied up or down the list, which is expensive.


    +   5. A doubly-linked list makes it faster to move from node to node in a singly-linked
    list, which can speed up the most expensive part of linked list operations: finding
    the nodes in the list where the operation must do its job.


    +   6. A circular doubly-linked list makes it possible to follow links quickly
    from the head to the end of the list. This can be done in a non-circular list
    if a reference to the end of the list is maintained.


