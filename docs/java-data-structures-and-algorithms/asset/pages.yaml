  md: '# JAVA DATA STRUCTURES AND ALGORITHMS


    # 2-3 TREES


    # 20.4 DELETION IN 2-3 TREES


    Deletion in 2-3 trees resembles deletion in ordinary binary search trees and AVL
    trees: a search is made from the root down the tree to locate the node holding
    the deleted value, the target node. If this node is not a leaf, then the node
    with the deleted value''s successor is found, the successor value is copied into
    the target node over the deleted value, and the duplicate successor is removed
    from the leaf. Thus values are always removed from leaves.


    Akin to other search trees, the successor of a value in a 2-3 tree is found by
    descending one node into the right sub-tree of the value (either the middle or
    the right-most sub-tree, depending on whether the value is the left-most or right-most),
    then all the way down the sub-tree to leaves. This successor node must be a leaf
    with the successor as its left-most value.


    When a value is removed from a leaf, then if the node was a 3-node, it becomes
    a 2-node and the deletion is complete. If the leaf-node was a 2-node, then deleting
    its value makes it into a 1-node, which we define to be a node with no values
    and possibly one sub-tree (which we may suppose is the left-most sub-tree). Of
    course there be no 1-nodes in a 2-3 tree, so this problem must be fixed. The process
    of handling 1-nodes is the same for internal nodes as for leaves, so we consider
    it as a general problem.


    ![](img/e42195b5740d05aee932ad08d883699d_188_0.png)'
