  md: 'Formally, let $f(n)$ and $g(n)$ be functions from the natural numbers to the
    non-negative real numbers.


    **Definition:** The function $g$ is in the set $O(f)$, denoted $g \in O(f)$, if
    there exist some positive constant $c$ and non-negative integer $n_0$ such that
    $g(n) \leq c \cdot f(n)$ for all $n \geq n_0$


    **Definition:** The function $g$ is in the set $\Omega(f)$, denoted $g \in \Omega(f)$,
    if there exist some positive constant $c$ and non-negative integer $n_0$ such
    that $g(n) \geq c \cdot f(n)$ for all $n \geq n_0$


    **Definition:** The function $g$ is in the set $\Theta(f)$, denoted $g \in \Theta(f)$,
    if both $g \in O(f)$ and $g \in \Omega(f)$.


    In other words, $g \in O(f)$ if at some point $g(n)$ is never greater than some
    multiple of $f(n)$; in this sense $f$ is a order of upper bound for $g$. Similarly,
    $g \in \Omega(f)$ if at some point $g(n)$ is never less than some multiple of
    $f(n)$; $f$ is a order of lower bound for $g$. Finally, if $g \in \Theta(f)$,
    then no matter how the argument to these functions grow, their values will always
    be within a constant factor of each other—this is the sense in which they grow
    at the same rate.


    It is important to realize the huge difference between the growth rates of functions
    in sets with different orders of growth. The table below shows the values of functions
    in sets with increasing growth rates. Blank spots in the table indicate enormous
    numbers. (The function $\lg n$ is $\log_2 n$.)


    | n | lg n | n | lg n | n^2 | n^3 | 2^n | n! |

    |---|---|---|---|---|---|---|-|

    | 10 | 3.3 | 10 | 3.3 | 100 | 1000 | 1024 | 3,628,800 |

    | 100 | 6.6 | 100 | 6.6 | 10,000 | 1,000,000 | $1.3 \cdot 10^{30}$ | $9.3 \cdot
    10^{157}$ |

    | 1000 | 10 | 1000 | 10 | 1,000,000 | $10^9$ | | |

    | 10000 | 13 | 10000 | 13 | $10^8$ | $10^{12}$ | | |

    | 100000 | 17 | 100000 | 17 | $10^{10}$ | $10^{15}$ | | |

    | 1,000,000 | 20 | 1,000,000 | $2 \cdot 10^7$ | $10^{12}$ | $10^{18}$ | | |


    **Table 1:** Values of Functions of Different Orders of Growth


    As this suggests, algorithms whose complexity is characterized by functions in
    the first few columns are efficient, and we can expect them to complete execution
    quickly for even quite large inputs. Algorithms whose complexity is characterized
    by functions in the last columns must do enormous amounts of work for fairly small
    inputs, and for large inputs, they will simply not be able to finish execution
    before the end of time, even on the fastest computers.'
