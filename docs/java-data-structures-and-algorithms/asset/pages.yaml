    # BUILT-IN TYPES


    Some languages provide arrays whose sizes are established at run-time and can
    change during execution. These dynamic arrays have an initial size used as the
    basis for allocating a segment of memory storage. Thereafter the array may shrink
    or grow. If the array shrinks during execution, only an initial portion of allocated
    memory is used. If the array grows beyond the space allocated for it, a more complex
    reallocation procedure must occur, as:


    +   1. A new segment of memory large enough to store the elements of the expanded
    array is allocated.

    2. All elements of the original (unexpanded) array are copied into the new memory
    segment.

    3. The memory used initially to store array values is freed and the newly allocated
    memory is associated with the array variable or reference.


    This reallocation procedure is computationally expensive, so systems are usually
    designed to do it as infrequently as possible. For example, when an array expands
    beyond its memory allocation, its memory allocation might be doubled if space
    for only a single element is requested. We will see this in a later chapter that
    this is a wise strategy.


    Dynamic arrays are convenient for programmers because they can never be too small—whenever
    more space is needed in a dynamic array, it can simply be expanded. One drawback
    of dynamic arrays is that implementing language support for them is more work
    for the compiler or interpreter writer. A potentially more serious drawback is
    that the expansion procedure is expensive, so there are circumstances when using
    a dynamic array can be dangerous. For example, if an application must respond
    in real time to its environment, and a dynamic array must be expanded when the
    application is in the midst of a response, the response may be delayed too long,
    causing problems.


    As mentioned, Java has static arrays. However, much of the convenience of dynamic
    arrays is achieved with the library class ArrayList. An ArrayList stores internally
    in fixed-size arrays, but presents an interface to its clients (that is, programmers
    who use ArrayList) that makes it work like a dynamic array. In particular, an
    ArrayList can grow or shrink as a programmer directs, or grow automatically as
    elements are added. This requires that each ArrayList manages its memory as indicated
    above, allocating new arrays when the capacity of the ArrayList grows.


    The ArrayList class illustrates how data can be added to a language and by providing
    useful features not built into the language. The ArrayList is widely used because
    it provides useful features but is still reliable and relatively efficient. The
    ability to write reliable and efficient classes like this is one of the skills
    we will develop as we learn about data structures and algorithms.


