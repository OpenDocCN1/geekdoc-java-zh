  md: '# # 14 RECURRENCES


    # ## 14.1 INTRODUCTION


    It is relatively easy to set up equations, typically using summations, for counting
    the basic operations performed in a non-recursive algorithm. But this won''t work
    for recursive algorithms in which computation is done in recursive calls rather
    than in loops. How are basic operations to be counted in recursive algorithms?


    A different mathematical techniques be used; specifically, a recurrence relation
    be set up to reflect the recursive structure of the algorithm.


    **Recurrence relation:** An equation that expresses the value of a function in
    terms of its value at another point.


    For example, consider the recurrence relation $F(n) = n \cdot F(n-1)$, where the
    domain of $F$ is the non-negative integers (all our recurrence relations will
    have domains that are either the non-negative integers or the positive integers).
    This recurrence relation says that the value of $F$ is its value at another point
    times $n$. Ultimately, our goal will be to solve recurrence relations like this
    by removing recursion, but as stands, it has infinitely many solutions. To pin
    down the solution to a unique function, we need to indicate the value of the function
    at some particular point or points. Such specifications are called **initial conditions**.
    For example, suppose the initial condition for function $F$ is $F(0) = 1$. Then
    we have the following values of function.


    ```

    F(0) = 1

    F(1) = 1 \cdot F(0) = 1

    F(2) = 2 \cdot F(1) = 2

    F(3) = 3 \cdot F(2) = 6

    ...

    ```


    We recognize $F$ as the factorial function. A recurrence relation plus one or
    more initial conditions form a recurrence.


    **Recurrence:** a recurrence relation plus one or more initial conditions that
    together recursively define a function.'
