    # TREES, HEAPS, AND HEAPSORT


    A complex analysis that we will not reproduce here shows that the number of comparisons
    done by heapsort in both the best, worst, and average cases are all in Θ(n log
    n). Thus heapsort joins Shell sort, merge sort, and quicksort in our repertoire
    of fast sorting algorithms. Empirical studies have shown that heapsort is not
    as fast as quicksort, it is not much slower than Shell sort and merge sort, with
    the advantage that it does not use any extra space like merge sort, and it does
    not have bad worst case complexity like quicksort.


    # 16.6 SUMMARY AND CONCLUSION


    A tree is a special sort of graph that is important in computing. One application
    of trees for sorting: an array can be treated as a binary tree and transformed
    into a heap. The heap can then be manipulated to sort the array in Θ(n lg) time.
    This algorithm is called heapsort and it is a good algorithm to use when space
    is at a premium and respectable worst case complexity is required.


