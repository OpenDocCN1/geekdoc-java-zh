  md: "# 15 MERGE SORT AND QUICKSORT\n\n# 15.1 INTRODUCTION\n\nThe sorting algorithms\
    \ we have looked at so far are not very fast, except for Shell sort and Insertion\
    \ sort on nearly-sorted lists. In this chapter we consider two of the fastest\
    \ algorithms known: merge sort and quicksort.\n\n# 15.2 MERGE SORT\n\nMerge sort\
    \ is a divide and conquer algorithm that solves a large problem by dividing it\
