  md: '# STACKS AND RECURSION


    # 7.1 INTRODUCTION


    Before moving on discussing dispensers to discussing collections, we must explore
    the strong connection between stacks and recursion. Recall that recursion involves
    operations that can call themselves.


    **Recursive operation:** An operation that either calls itself directly, or calls
    operations that call it.


    Recursion and stacks are intimately related in the following ways:


    +   - Every recursive operation (or group of mutually recursive operations) can
    be rewritten without using a stack.

    - Every algorithm that uses a stack can be rewritten without a stack using one
    or more recursive operations.


    To establish the first point, note that computers do not support recursion at
    the machine level—most processors can move around, do a few arithmetic and logical
    operations, and compare values and branch to different points in a program based
    on the result, but is all. Yet many programming language support recursion. How
    is this possible? At runtime, compiled programs use a stack that stores data about
    the current state of execution of a sub-program, called an *activation record*.
    When a sub-program is called, a activation record is pushed on the stack to hold
    the sub-program''s arguments, local variables, return address, and other book-keeping
    information. The activation record stays on the stack until the sub-program returns,
    when it is popped off the stack. Because every call of a sub-program causes a
    new activation record to be pushed on the stack, this mechanism supports recursion:
    every recursive call of a sub-program has its activation record, so the data associated
    with a particular sub-program is not confused with that of other calls of the
    sub-program. Thus the recursive calls can be recorded onto the stack, and a non-recursive
    machine can implement recursion.


    The second point is not quite so to establish, but the argument does go like this:
    when an algorithm would push data on a stack, a recursive operation can preserve
    the data and then call itself to continue processing. The recursive call returns
    just when it is time to pop the data off the stack, so processing can continue
    with the data in the local variables just as if the data had been popped off the
    stack.'
