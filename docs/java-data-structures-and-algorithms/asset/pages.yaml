  md: '# JAVA DATA STRUCTURES AND ALGORITHMS STACKS AND RECURSION


    In some sense, recursion and stacks are equivalent. It turns out that some algorithms
    are easier to write with recursion, some are easier to write with stacks, and
    some are just as easy (or hard) one way as the other. But in any case, there is
    always a way to write algorithms either recursively without any stacks, or without
    recursion using stacks.


    In the remainder of this chapter we will illustrate the theme of the equivalence
    of stacks and recursion by considering a few examples of algorithms that need
    either stacks or recursion, and we will look at how to implement these algorithms
    both ways.


    # 7.2 BALANCED BRACKETS


    Because of its simplicity, we begin with an example that doesn''t really need
    a stack or recursion, but illustrates how both can be used with equal facility:
    determining whether a string of brackets is balanced or not. The strings of balanced
    brackets are recursively defined as follows:


    +   - The empty string is a string of balanced brackets.

    - If A is a string of balanced brackets, then so it "A".

    - If A and B are strings of balanced brackets, then so is AB.


