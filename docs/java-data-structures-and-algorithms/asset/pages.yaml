    # 24.3 HASHMAPS


    The HashTable class is of course used to implement maps, resulting in a collection
    called a hash map. Hash maps, provided their backing hash tables do not become
    too full, provide constant time performance for all operations the contains()
    collection method (which takes linear time). This beats search trees, so hash
    maps are generally faster than tree maps.


    A HashMap implements the Map interface and holds a hash table in a private field.
    The hash table stores the key-value pairs in the map, and most Map operations
    are delegated directly to the hash table. A few Map operations (like contains()
    and isEqual()), require a few lines of code for iterating through the hash table
    and making some comparisons.


    # 24.4 HASHSETS


    Hash tables are a convenient implementation data structure because they can be
    used to implement hashed collections of various kinds, not just maps. For example,
    suppose we wish to use hashing to implement sets. If we use a hash table to do
    this, the key is the set element we wish to store, but what is the value in the
    key-value pair? There is none, so we can leave the value field blank (by storing
    null there, for example). This wastes space, but provides the constant-time performance
    of hash tables. Hash tables are thus a good way to implement hash sets.


