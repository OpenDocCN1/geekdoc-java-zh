    # 19.3 INSERTION IN AVL TREES


    Inserting a value into an AVL tree begins the way that binary search tree insertion
    does: starting at the root, the key is compared to node values to follow a path
    down the tree until arriving at the bottom, where the inserted value is placed
    in a new leaf node. The new leaf node will make a path to the root longer, altering
    at least one node''s balance factor, and perhaps all nodes'' balance factors on
    the path to the root. If all balance factors are still within constraints, balance
    factors are adjusted and insertion is complete. However, some nodes'' balance
    factors may become 2 or -2. In this case, the tree must be rebalanced by rearranging
    nodes. It turns out that this rearrangement, made at the node with an illegal
    balance factor closest to the inserted node, results in a rebalanced tree with
    the same height as before.


    Trees are rearranged by applying one of four *rotations*. The rotations applied
    for a balance factor of 2 are depicted in Figure 2. The rows show the three possibilities
    when an insertion results in some node having a balance factor of 2. The sub-tree
    where the insertion took place, denoted $t_r$, has a double baseline; balance
    factors are shown above nodes; and heights of sub-trees are shown beside them.


