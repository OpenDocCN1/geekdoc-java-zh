    # HASHED COLLECTIONS


    Constructors for a HashTable usually provide a default size (a small prime number
    like 13), or accept a parameter for the table size. In the latter case, the constructor
    should adjust the parameter to make sure it is not too small and that it is a
    prime number (suggesting that the smallest hash size is two).


    Note that this HashTable model does not distinguish between collision resolution
    strategies; this is an implementation detail hidden by this interface. When open
    addressing is used, the insert() method should monitor the load factor and expand
    the table if it gets close to one. Expanding a hash table requires that a new,
    larger table be created, and that the current key-value pairs in the old table
    be inserted in the new table, this is an expensive operation. If chaining is used,
    the load factor can be arbitrarily large, but of course performance will degrade
    when it gets too big, so a sophisticated implementation should also monitor the
    load factor when insertions occur and expand the table if it gets too big.


    Finally, hash tables, like trees, are not containers that clients are expected
    to use; rather, they are implementation data structures used to implement containers
    in the Container hierarchy.


