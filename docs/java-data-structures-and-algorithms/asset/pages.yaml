  md: '# 5 STACKS


    # 5.1 INTRODUCTION


    Stacks have many physical metaphors: shirts in a drawer, plates in a plate holder,
    box-cars in a dead-end siding, and so forth. The essential features of a stack
    are that it is ordered and that access to it is restricted to one end.


    **Stack:** A dispenser holding a sequence of elements that can be accessed, inserted,
    or removed at only one end, called the **top.**


    Stacks are also called last-in-first-out (LIFO) lists. Stacks are important in
    computing because of their applications in recursive processing, such as language
    parsing, expression evaluation, runtime function management, and so forth.


    # 5.2 THE STACK ADT AND INTERFACE


    Stacks are containers, and as they hold values of some type. We must therefore
    speak the ADT *stack of T*, where $T$ is the type of the elements held in the
    stack. The carrier of this type is the set of all stacks holding elements of type
    $T$. The carrier set includes the empty stack, the stacks with one element of
    type $T$, the stacks with two elements of type $T$, and so forth. The stack of
    $T$ ADT implicit-receiver method is shown below, where $e$ is a $T$ value. If
    a function''s precondition is not satisfied, its result is undefined.


    push(e)—Add $e$ at the top of the stack.


    pop()—Remove and return the top element of the stack. The precondition of the
    pop() operation is that the stack is not empty.


    isEmpty()—Return the Boolean value true just in case the stack is empty.


    top()—Return the top element of the stack without removing it. Like pop(), this
    operation has the precondition that the stack is not empty.


    The *pop()* operation undoes what the *push()* operation achieves. When an element
    is pushed on a stack, it becomes the top element on the stack. No element is except
    the one at the top of the stack.'
