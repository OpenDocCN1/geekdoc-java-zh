    Restoration Resistance Headquarters

    October 1, 4010

    8:00 a.m.


    The morning air is crisp and cool, the grass springy and damp beneath my feet.
    Droplets of water are refreshing against my bare calves as I run. My high ponytail
    swishes side to side, tickling the back of my neck. My chest rises and falls as
    I concentrate on breathing, filling my lungs with the cleansing morning air. Dog
    lopes along beside me at a steady trot, his paws padding softly on the ground.


    I have spent every morning of the last six weeks running from one end of Resistance
    Headquarters to the other. It spans exactly four miles. I appreciate the changing
    of the seasons each day, even if it is just a computer program. It''s nice to
    feel—in some ways—like we are still part of the world. When I''m on my running
    run, just Dog and me, I can pretend that nothing has changed. I can almost imagine
    my Atlanta neighborhood with a park very similar to the one I''m running in, ringed
    in pine trees. I can imagine the crunching of dry pine needles beneath my feet,
    and smell their fragrance in my nostrils. There is no Resistance, no Restoration,
    and no evil'
