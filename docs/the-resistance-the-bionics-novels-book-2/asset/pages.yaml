- img_proc: true
  md: 'The projection fades, and we are left gaping in horror. Someone has gone and
    poked the sleeping bear. Now he’s awake and swinging his massive paws at us. With
    this move, President Drummond reminds us, yet again, that he can get to us at
    any time. If even the strongest of us can be killed, then none of us are safe.


    A sound behind me alerts me to Dax’s presence in the room. I don’t know how long
    he’s been standing there, but I can tell he’s heard more than enough. Standing,
    I approach him.


    “We won’t let them get away with this, Dax,” I promise, even though, deep down,
    I’m terrified to my very core. War is now inevitable. Any chance there was at
    a peaceful resolution is now gone.


    “Dax—


    “No,” he interjects, cutting me off. “No more talking. No more protesting. I’m
    done. They keep taking from us. It’s time we learned what truly looks like. It’s
    time we started things back.”


    “I know you’re angry and hurt,” I say calmly. “So I am. We are all. But, Dax,
    we can’t feed into the propaganda. We can’t let them turn us into the monsters
    they try to make people think we are.”


    Dax snorts derisively, shaking his head. “Don’t you get it? You’ve lost more than
    any of us, and you still don’t fucking get it. Gage is dead.'
