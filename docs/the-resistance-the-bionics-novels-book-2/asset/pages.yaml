  md: 'Yasmine is dead. Your parents, my mother, everyone either of us has ever loved...
    gone. That’s war, B. People die at war... it’s time to stop being the ones who
    lose. It’s time to start winning... time to start fighting back. You can either
    stand with me, or you can get the fuck out of my way.


    Turning on his heels, he barrels out of the room like a freight train. Once he
    disappears from sight, I hear the sound of something crashing. I’ll likely find
    a crater in a wall with his fist on my way out.


    I want to go after him and try to change his mind—to tell him it doesn’t have
    to be this way. But I can’t make my feet move, and even if I could, I doubt my
    mouth could form the words. In the back of my mind, I know that Dax is right.
    He was right before to call me out on my bullshit about hope. Watching Yasmine
    die the last of the hope we had left. All that’s left for now is the satisfaction
    of toppling the government before they kill us all.


    And I promise myself in that moment, that if it’s the last thing I do, President
    Drummond won’t see another presidential term. He won’t see another year. Because
    I’m going to make my way to D.C., and when I get there, I’m going to find a way
    into the White House. Then I’m going to take my sniper rifle and put a bullet
    between his eyes.


    How’s that for a New Year’s resolution?'
