- img_proc: true
  md: 'He frowns, studying the chip as if seeing it for the first time. “So it is.
    I wonder why someone would install a messaging chip in this thing.”


    Reaching for my COMM device, I open a port on the side and slide the chip into
    it. “Maybe whoever wanted Yasmine dead has something to say to us.”


    Sure enough, there’s a file on the chip, which I promptly open. Once I press play,
    a projection of the video appears. I sit on the table between us as the three-dimensional
    image of President Drummond flickers to life before us.


    “If you’ve received this message, then your little friend is long gone. I hope
    you understand that I mean business. When I told you that you had yet to experience
    my wrath, I was not making an idle threat. Hopefully, you now see for yourself
    not to ignore my threats. I gave you a chance to do things my way, and you threw
    it back in my face.”


    The Professor and I exchange confused glances.


    “Who do you think he’s talking to?” he asks.


    “Laura said someone negotiated their release... whoever is pissed Drummond off
    royally. This was his way of getting back at them.”


    “Do you think it was Jenica?”


    Shrugging, I watch the projection. He isn’t done yet. “Could have been,” I murmur
    as the persistent continues.


    “And just so you know, my offer of immunity for you or anyone associated with
    the Resistance has been permanently withdrawn. There will be no more mercy or
    second chances. No more arrests or due process. From here on, any Bionic found
    in any location is to be executed on site. Any accomplice seeking to hide one
    will be dealt in the same way. As we speak, steps are being made so that not one
    of you Bio freaks can sneeze without us knowing about it. You wanted a revolution?
    You wanted a war? Well, you’ve got one. I hope you’re ready.”'
