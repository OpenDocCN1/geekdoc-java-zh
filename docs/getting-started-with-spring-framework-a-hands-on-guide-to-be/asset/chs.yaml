  \ 和 `FactoryBean` 接口。`getObject` 方法返回一个 `EventSender` 对象的实例。由于 `isSingleton` 方法返回\
  \ `false`，每当 `EventSenderFactoryBean` 接收到 `EventSender` 对象的请求时，EventSenderFactoryBean\
