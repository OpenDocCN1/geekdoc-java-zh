  \ context = new ClassPathXmlApplicationContext(\n                \"classpath:META-INF/spring/applicationContext.xml\"\
  );\n        context.registerShutdownHook();\n        .....\n        context.getBean(\"\
  eventSenderFactory\");\n        context.getBean(\"eventSenderFactory\");\n    }\n\
