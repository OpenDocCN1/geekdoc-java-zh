  \ FactoryBeans 的 BeanPostProcessor 行为\n\n在第 3 章第 3-9 节中，我们讨论了实现 `FactoryBean` 的\
  \ bean 是创建实例的工厂。你现在可能问的问题是 `BeanPostProcessor` 的实现是适用于 `FactoryBean` 还是适用于 `FactoryBean`\
  \ 创建的 bean 实例。在本节稍后的部分，我们将看到 `BeanPostProcessor` 的 `postProcessBeforeInitialization`\
  \ 和 `postProcessAfterInitialization` 方法会被 Spring 容器创建的 `FactoryBean` 实例调用。并且，*只有*\
  \ `postProcessAfterInitialization` 会被 `FactoryBean` 创建的 bean 实例调用。\n\n下面的示例列表显示了\
  \ `MyApplication` 应用中 `EventSenderFactoryBean` 类（一个 `FactoryBean` 实现），它用于创建 `EventSender`\
  \ bean 实例：\n\n**示例列表 5-19** – `EventSenderFactoryBean` 类\n\n**项目** – `ch05-bankapp-beanpostprocessor`\n\
  \n**位置** - `/src/main/java/sample/spring/chapter05/bankapp/factory`\n\n```java\n\
  package sample.spring.chapter05.bankapp.factory;\n\nimport org.springframework.beans.factory.FactoryBean;\n\
  import org.springframework.beans.factory.InitializingBean;\n\npublic class EventSenderFactoryBean\
  \ implements FactoryBean<EventSender>, InitializingBean {\n\n    .....\n\n    @Override\n\
  \    public EventSender getObject() throws Exception {\n        logger.info(\"getObject\
  \ method of EventSenderFactoryBean invoked\");\n        return new EventSender();\n\
