  \n**Comic Sans MS** 在示例列表中用于以突出显示代码或配置的重要部分。\n\n`NOTE` 用于标记一个重要要点。\n\n### 反馈与问题\n\
  你可以在以下 Google Groups 论坛向作者提交反馈和问题：[`groups.google.com/forum/#!forum/getting-started-with-spring-framework`](https://groups.google.com/forum/#!forum/getting-started-with-spring-framework)\n\
  \n### 关于作者\n**Ashish Sarin** 是一位 Sun 认证企业架构师，拥有超过 14 年的应用架构经验。他是《Spring Roo 1.1\
  \ Cookbook》（Packt Publishing 出版）和《Portlets in Action》（Manning Publications 出版）的作者。\n\
  \n**J Sharma** 是一位自由 Java 开发人员，在开发 Spring 应用方面拥有丰富经验。\n\n# 第 1 章 – Spring Framework\
  \ 简介\n\n## 1-1 简介\n在传统的 Java 企业级应用开发中，创建结构良好、可维护且易于测试的应用是开发者的责任。开发者使用无数设计模式来处理应用程序的非业务需求。这不仅导致了开发者生产力的低下，还对开发应用的质量产生了负面影响。\n\
  \nSpring Framework（简称“Spring”）是来自 SpringSource ([`www.springsource.org`](http://www.springsource.org))\
  \ 的开源应用程序框架，它简化了 Java 企业级应用程序的开发。它为开发结构良好、可维护且易于测试的应用程序提供了基础设施支持。使用 Spring Framework\
  \ 时，开发者只需要专注于编写应用程序的业务逻辑，从而提高了开发者的生产力。你可以使用 Spring Framework 开发独立的 Java 应用程序、Web\
  \ 应用程序、Applet 或其他类型的 Java 应用程序。\n\n本章首先介绍 Spring Framework 模块及其优势。Spring Framework\
  \ 的核心是它的控制反转（IoC）容器，该容器提供了依赖注入（DI）功能。本章将介绍 Spring 的 DI 功能和 IoC 容器，并展示如何使用 Spring\
  \ 开发一个独立的 Java 应用程序。在本章末尾，我们将查看一些以 Spring Framework 为基础的 SpringSource 项目。本章将为后续深入研究\
  \ Spring Framework 的章节奠定基础。\n\n`NOTE` 在本书中，我们将使用一个名为 *MyBank* 的互联网银行应用程序示例来介绍 Spring\
  \ Framework 功能。\n\n## 1-2 Spring Framework 模块\nSpring Framework 由多个模块组成，根据它们所解决的应用程序开发功能进行分组。下表描述了不同的模块组：\n\
  \n| 模块组 |  |\n| :--- | :--- |\n| 核心容器 (Core container) | 包含构成 Spring 基础模块。该组中的模块提供了\
  \ Spring 的 DI 功能和 IoC 容器实现。 |\n| AOP 与代理 (AOP and instrumentation) | 包含支持 AOP（面向切面编程）和类代理的模块。\
  \ |\n| 数据访问/集成 (Data Access/Integration) | 包含简化与数据库和消息提供程序交互的模块。该组还包含支持编程和声明式事务管理，以及对象/XML\
  \ 映射（如 JAXB 和 Castor）的模块。 |\n| Web | 包含简化 Web 和 Portlet 应用程序开发的模块。 |\n| 测试 (Test)\
  \ | 包含一个简化单元测试和集成测试创建的模块。 |\n\n上表显示 Spring 了开发的各个方面；你可以使用 Spring 开发 Web 应用程序、访问数据库、管理事务、创建单元测试和集成测试等。Spring\
  \ Framework 模块的设计使得你*仅需*包含你的应用程序所需的模块。例如，要在你的应用程序中使用 Spring 的 DI 功能，你只需要包含 `Core\
  \ container` 下的模块。随着本书的进行，你将发现部分 Spring 模块的详细信息，以及如何在开发应用中使用它们的示例。\n\n![](img/00001.jpeg)\n\
  **图 1-1** Spring 模块间的依赖关系\n\n你可以从上图中推断出 `Core container` 组中的模块是 Spring Framework\
  \ 的核心，其他模块依赖于它。`AOP and instrumentation` 组中的模块同样重要，因为它们为 Spring Framework 中的其他模块提供了\
  \ AOP 功能。\n\n现在，你已经对 Spring 涵盖的应用开发领域有了基本了解，让我们来看 Spring IoC 容器。\n\n## 1-3 Spring\
  \ IoC 容器\nJava 应用程序由相互交互的对象组成，以提供应用程序行为。与对象交互的对象被称为它的*依赖*。例如，如果对象 X 与对象 Y 和 Z 交互，那么\
  \ Y 和 Z 就是对象 X 的依赖。DI 是一种设计模式，通常将对象的依赖作为参数传递给它的构造函数和 setter 方法。这些依赖在对象创建时被注入到对象中。\n\
  \n\n\n\n\n在 Spring 应用中，Spring IoC 容器（也称为 Spring 容器）负责创建应用对象并注入它们的依赖项。Spring 容器创建并管理的应用对象被称为\
  \ `beans`。由于 Spring 容器负责组装应用对象，因此你不需要实现诸如工厂（Factory）、服务定位器（Service Locator）等设计模式来组合你的应用程序。依赖注入（DI）也称为控制反转（IoC），因为创建和注入依赖的责任`not`属于应用对象，而是属于\
  \ Spring 容器。\n\n假设 `MyBank` 应用（这是我们的示例应用名称）包含两个对象：`FixedDepositController` 和 `FixedDepositService`。下面的示例列表显示了\
  \ `FixedDepositController` 对象依赖于 `FixedDepositService` 对象：\n\n**示例列表 1-1：** `FixedDepositController`\
  \ 类\n\n```java\npublic class FixedDepositController {\n\n    private FixedDepositService\
  \ fixedDepositService;\n\n    public FixedDepositController() {\n        fixedDepositService\
  \ = new FixedDepositService();\n    }\n\n    public boolean submit() {\n       \
  \ //-- save the fixed deposit details\n        fixedDepositService.save(.....);\n\
  \    }\n}\n```\n\n在上述示例列表中，`FixedDepositController` 的构造函数创建了 `FixedDepositService`\
  \ 的实例，该实例稍后在 `FixedDepositController` 的 `submit` 方法中使用。由于 `FixedDepositController`\
  \ 与 `FixedDepositService` 交互，因此 `FixedDepositService` 代表 `FixedDepositController`\
  \ 的依赖。\n\n要将 `FixedDepositController` 配置为 Spring bean，你首先需要修改示例列表 1-1 中的 `FixedDepositController`\
  \ 类，使其接受 `FixedDepositService` 依赖作为构造函数参数或 setter 方法参数。下面的示例列表显示了修改后的 `FixedDepositController`\
  \ 类：\n\n**示例列表 1-2：** `FixedDepositController` 类 – 通过构造函数参数传递 `FixedDepositService`\n\
  \n```java\npublic class FixedDepositController {\n\n    private FixedDepositService\
  \ fixedDepositService;\n\n    public FixedDepositController(FixedDepositService\
  \ fixedDepositService) {\n        this.fixedDepositService = fixedDepositService;\n\
  \    }\n\n    public boolean submit() {\n        //-- save the fixed deposit details\n\
  \        fixedDepositService.save(.....);\n    }\n}\n```\n\n上述示例列表显示 `FixedDepositService`\
  \ 实例现在现在作为构造函数参数传递给 `FixedDepositController` 实例。现在，`FixedDepositService` 类可以配置为\
  \ Spring bean。注意，`FixedDepositController` 类没有实现或继承任何 Spring 接口或类。\n\n对于给定的应用，关于应用对象及其依赖项的信息是使用\
  \ `configuration metadata` 来指定的。Spring IoC 容器读取应用的配置元数据来实例化应用对象并注入它们的依赖项。下面的示例列表显示了由\
  \ `MyController` 和 `MyService` 类组成的应用的配置元数据（XML 格式）：\n\n**示例列表 1-3：** 配置元数据\n\n\
  ```xml\n<beans .....>\n    <bean id=\"myController\" class=\"sample.spring.controller.MyController\"\
  >\n        <constructor-arg index=\"0\" ref=\"myService\" />\n    </bean>\n    <bean\
  \ id=\"myService\" class=\"sample.spring.service.MyService\"/>\n</beans>\n```\n\n\
  在上述示例列表中，每个 `<bean>` 元素定义了一个由 Spring 容器管理的应用对象，而 `<constructor-arg>` 元素指定将 `MyService`\
  \ 的实例作为参数传递给 `MyController` 的构造函数。`<bean>` 元素将在本章稍后详细讨论，`<constructor-arg>` 元素将在第\
  \ 2 章讨论。\n\nSpring 容器读取应用的配置元数据（如示例列表 1-3 所示），创建由 `<bean>` 元素定义的应用对象并注入它们的依赖项。Spring\
  \ 容器利用 `Java Reflection API` ([http://docs.oracle.com/javase/tutorial/reflect/index.html])\
  \ 来创建应用对象并注入它们的依赖项。下面的图总结了 Spring 容器的工作原理：\n\n![](img/00002.jpeg)\n\n**图 1-2** Spring\
  \ 容器读取应用配置元数据创建一个完全配置的应用程序\n\n配置元数据可以通过 XML（如示例列表 1-3 所示）、Java 注（参考第 6 章）以及 Java\
  \ 代码（参考第 6 章）提供给 Spring 容器。\n\n由于 Spring 容器负责创建和管理应用对象，企业服务（如事务管理、安全性、远程访问等）可以由\
  \ Spring 容器透明地应用到对象上。Spring 容器增强应用对象额外功能的能力使得你能够将应用对象建模为简单的 Java 对象（也称为 `POJOs`\
  \ 或 `Plain Old Java Objects`）。与 POJO 对应的 Java 类被称为 `POJO 类`，它们无非没有实现或继承框架特定的接口或类的\
  \ Java 类。这些 POJO 所需的企业服务（如事务管理、安全性、远程访问等）由 Spring 容器透明地提供。\n\n现在我们已经知道了容器是如何工作的，让我们来看一些展示使用\
  \ Spring 开发应用程序优势的示例。\n\n## 1-4 Spring 框架的优势\n\n在上一节中，我们讨论了使用 Spring 的以下优势：\n\n\
  - Spring 通过处理创建应用对象和注入依赖项简化了 Java 应用程序的组合\n- Spring 促进作为 POJO 开发应用程序\n\nSpring 还通过提供一个处理样板代码的抽象层，简化了与\
  \ JMS 提供者、JNDI、MBean 服务器、电子邮件服务器、数据库等的交互。\n\n让我们快速查看几个示例，以更好地理解使用 Spring 开发应用程序的优势。\n\
  \n#### 管理本地和全局事务的一致方法\n\n如果你使用 Spring 开发 `transactional` 应用程序，可以使用 Spring 的 `声明式事务管理`支持来管理事务。\n\
  \n下面的示例列表显示了 `MyBank` 应用的 `FixedDepositService` 类：\n\n**示例列表 1-4** – `FixedDepositService`\
  \ 类\n\n```java\npublic class FixedDepositService {\n    public FixedDepositDetails\
  \ getFixedDepositDetails(..... ) { ..... }\n    public boolean createFixedDeposit(FixedDepositDetails\
  \ fixedDepositDetails) { ..... }\n}\n```\n\n`FixedDepositService` 类是一个 POJO 类，定义了创建和检索存款详情的方法。下面的图显示了创建新存款的表单：\n\
  \n![](img/00003.jpeg)\n\n**图 1-3** 创建新存款的 HTML 表单\n\n客户在上方表单中输入存款金额、期限和电子邮件信息，并点击保存按钮创建新存款。调用\
  \ `FixedDepositService` 的 `createFixedDeposit` 方法（参考示例列表 1-1）来创建存款。`createFixedDeposit`\
  \ 方法从客户的银行账户中扣除其输入的金额，并创建一个相同金额的存款。\n\n\n\n\n假设客户的银行余额信息存储在 `BANK_ACCOUNT_DETAILS`\
  \ 数据库表中，而定期存款详情存储在 `FIXED_DEPOSIT_DETAILS` 数据库表中。如果客户创建了一个金额为 `x` 的定期存款，则会从 `BANK_ACCOUNT_DETAILS`\
  \ 表中减去金额 `x`，并在 `FIXED_DEPOSIT_DETAILS` 表中插入一条新记录以反映新创建的定期存款。如果 `BANK_ACCOUNT_DETAILS`\
  \ 表没有被更新，或者没有在 `FIXED_DEPOSIT_DETAILS` 表中插入新记录，将导致系统处于不一致状态。这意味着 `createFixedDeposit`\
  \ 方法必须在事务中执行。\n\n`MyBank` 应用程序使用的数据库表示了一个`事务性资源`。在执行一组数据库修改作为一个单个工作单元的传统方法中，你首先需要禁用\
  \ `JDBC` 连接的自动提交模式，然后执行 SQL 语句，最后提交（或回滚）事务。下面的示例列表展示了如何使用传统方法在 `createFixedDeposit`\
  \ 方法中管理数据库事务：\n\n#### 示例列表 1-5 – 使用 `JDBC Connection` 对象程序化管理数据库事务\n\n```java\n\
  import java.sql.Connection;\nimport java.sql.SQLException;\n\npublic class FixedDepositService\
  \ {\n    public FixedDepositDetails getFixedDepositDetails( ..... ) { ..... }\n\n\
  \    public boolean createFixedDeposit(FixedDepositDetails fixedDepositDetails)\
  \ { \n        Connection con = ..... ;\n        try {\n            con.setAutoCommit(false);\n\
  \            //-- 执行修改数据库表的 SQL 语句\n            con.commit();\n        } catch(SQLException\
  \ sqle) {\n            if(con != null) {\n                con.rollback();\n    \
  \        }\n        }\n        .....\n    }\n}\n```\n\n上面的示例列表显示 `createFixedDeposit`\
  \ 方法使用 `JDBC Connection` 对象程序化地管理数据库事务。这种方法适用于涉及单个数据库的应用场景。特定资源的事务，例如与 `JDBC Connection`\
  \ 关联的事务被称为`本地事务`。\n\n当涉及多个事务性资源时，使用 `JTA`（Java Transaction API）来管理事务。例如，如果你想在同一个事务中向消息中间件（一个事务性资源）发送\
  \ `JMS` 消息并更新数据库（另一个事务性资源），你必须使用 `JTA` 事务管理器来管理事务。`JTA` 事务也称为`全局`（或分布式）`事务`。要使用\
  \ `JTA`，你需要从 `JNDI` 获取 `UserTransaction` 对象（它是 `JTA API` 的一部分），并程序化启动和提交（或回滚）事务。\n\
  \n如你所见，可以使用 `JDBC Connection`（用于本地事务）或 `UserTransaction` 对象（用于全局事务）来程序化管理事务。需要注意的是，本地事务不能在全局事务中运行。这意味着如果你想让\
  \ `createFixedDeposit` 方法（参考示例列表 1-5）中的数据库更新成为 `JTA` 事务的一部分，你需要修改 `createFixedDeposit`\
  \ 方法以使用 `UserTransaction` 对象进行事务管理。\n\nSpring 通过提供一个抽象层简化了事务管理，该层提供了一种管理本地和全局事务的一致方法。这意味着如果你使用\
  \ Spring 的事务抽象编写了 `createFixedDeposit` 方法（参考示例列表 1-5），当你从本地事务切换到全局事务管理（或反之）时，不需要修改该方法。Spring\
  \ 的事务抽象将在第 7 章中解释。\n\n### 声明式事务管理\n\nSpring 提供了使用声明式事务管理的选项。你可以对方法标记使用 Spring 的\
  \ `@Transactional` 注解并让 Spring 处理事务，如下所示：\n\n#### 示例列表 1-6 – `@Transactional` 注解的使用\n\
  \n```java\nimport org.springframework.transaction.annotation.Transactional;\n\n\
  public class FixedDepositService {\n    public FixedDepositDetails getFixedDepositDetails(\
  \ ..... ) { ..... }\n\n    @Transactional\n    public boolean createFixedDeposit(FixedDepositDetails\
  \ fixedDepositDetails) { ..... }\n}\n```\n\n上面的示例列表显示 `FixedDepositService` 类没有实现或继承任何\
  \ Spring 特有的接口或类来使用 Spring 的事务管理功能。Spring Framework 透明地为标记了 `@Transactional` 注解的\
  \ `createFixedDeposit` 方法提供了事务管理功能。这表明 Spring 是一个非侵入式框架，因为它不需要你的应用程序对象依赖于 Spring\
  \ 特有的类或接口。此外，你不需要直接操作事务管理 API 来管理事务。\n\n### 安全\n\n安全是任何 Java 应用程序的一个重要方面。Spring\
  \ Security (`http://static.springsource.org/spring-security/site/`) 是构建在 Spring\
  \ Framework 之上的 SpringSource 项目。Spring Security 提供了用于保护 Java 应用程序的身份验证和授权功能。\n\n\
  假设为 `MyBank` 应用程序识别了以下 3 个用户角色：`LOAN_CUSTOMER`、`SAVINGS_ACCOUNT_CUSTOMER` 和 `APPLICATION_ADMIN`。客户必须关联\
  \ `SAVINGS_ACCOUNT_CUSTOMER` 或 `APPLICATION_ADMIN` 角色才能调用 `FixedDepositService`\
  \ 类的 `createFixedDeposit` 方法（参考示例列表 1-6）。使用 Spring，你可以通过 Spring Security 的 `@Secured`\
  \ 注解标记 `createFixedDeposit` 方法来轻松地实现这一需求，如下例所示：\n\n#### 示例列表 1-7 – `@Secured` `createFixedDeposit`\
  \ 方法\n\n```java\nimport org.springframework.transaction.annotation.Transactional;\n\
  import org.springframework.security.access.annotation.Secured;\n\npublic class FixedDepositService\
  \ {\n    public FixedDepositDetails getFixedDepositDetails( ..... ) { ..... }\n\n\
  \    @Transactional\n    @Secured({ \"SAVINGS_ACCOUNT_CUSTOMER\", \"APPLICATION_ADMIN\"\
  \ })\n    public boolean createFixedDeposit(FixedDepositDetails fixedDepositDetails)\
  \ { ..... }\n}\n```\n\n如果你在方法上标记了 Spring Security 的 `@Secured` 注解，Spring 框架将透明地对该方法应用安全功能。上面的示例列表显示，为了实现方法级安全不需要扩展或实现任何\
  \ Spring 特有的类或接口。此外，你不需要在业务方法中编写安全相关的代码。\n\nSpring Security 框架将在第 14 章详细讨论。\n\n\
  ### JMX (Java Management Extensions)\n\nSpring 对 JMX 的支持简化将 JMX 技术集成到应用程序中。\n\n\
  假设 `MyBank` 应用程序的定期存款功能仅在上午 9:00 到下午 6:00 向客户开放。为了满足这一需求，在 `FixedDepositService`\
  \ 类中添加了一个变量，作为指示定期存款服务是否激活状态的标记。下面的示例列表了使用了此类标记的 `FixedDepositService` 类：\n\n####\
  \ 示例列表 1-8 – 使用 `active` 变量的 `FixedDepositService`\n\n```java\npublic class FixedDepositService\
  \ {\n    private boolean active;\n\n    public FixedDepositDetails getFixedDepositDetails(\
  \ ..... ) {\n        if(active) { ..... }\n    }\n\n    public boolean createFixedDeposit(FixedDepositDetails\
  \ fixedDepositDetails) {\n        if(active) { ..... }\n    }\n\n    public void\
  \ activateService() {\n        active = true;\n    }\n\n    public void deactivateService()\
  \ {\n        active = false;\n    }\n}\n```\n\n\n\n上面的示例列表显示，`FixedDepositService`\
  \ 类中添加了一个名为 `active` 的变量。如果 `active` 变量的值为 `true`，`getFixedDepositDetails` 和 `createFixedDeposit`\
  \ 方法将按预期工作。如果 `active` 变量的值为 `false`，`getFixedDepositDetails` 和 `createFixedDeposit`\
  \ 方法将抛出异常，表示固定存款服务目前处于激活状态。`activateService` 和 `deactivateService` 方法分别将 `active`\
  \ 变量的值设置为 `true` 和 `false`。\n\n现在，是谁在调用 `activateService` 和 `deactivateService`\
  \ 方法呢？假设有一个独立的调度器应用程序 `Bank App Scheduler` 在每天上午 9:00 和下午 6:00 运行，分别执行 `activateService`\
  \ 和 `deactivateService` 方法。Bank App Scheduler 应用程序使用 JMX（Java 管理扩展）API 远程与 `FixedDepositService`\
  \ 实例交互。\n\n**注意** 请参阅以下文章了解更多关于 JMX 的信息：[`docs.oracle.com/javase/tutorial/jmx/index.html`](http://docs.oracle.com/javase/tutorial/jmx/index.html)。\n\
  \n由于 Bank App Scheduler 使用 JMX 来更改 `FixedDepositService` 实例的 `active` 变量值，你需要将 `FixedDepositService`\
  \ 实例作为 `managed bean`（或 `MBean`）注册到 MBean 服务器，并将 `FixedDepositService` 的 `activateService`\
  \ 和 `deactivateService` 方法暴露为 JMX 操作。在 Spring 中，你通过在该类添加 Spring 的 `@ManagedResource`\
  \ 注解将类实例注册到 MBean 服务器，并使用 Spring 的 `@ManagedOperation` 注解将类的方法暴露为 JMX 操作。\n\n下面的示例列表展示了如何使用\
  \ `@ManagedResource` 和 `@ManagedOperation` 注解将 `FixedDepositService` 类实例注册到 MBean\
  \ 服务器，并将其 `activateService` 和 `deactivateService` 方法暴露为 JMX 操作：\n\n**示例列表 1-9**\
  \ – 使用 Spring JMX 支持的 FixedDepositService 类\n\n```java\nimport org.springframework.jmx.export.annotation.ManagedOperation;\n\
  import org.springframework.jmx.export.annotation.ManagedResource;\n\n@ManagedResource(objectName\
  \ = \"fixed_deposit_service:name=FixedDepositService\")\npublic class FixedDepositService\
  \ {\n\n    private boolean active;\n\n    public FixedDepositDetails getFixedDepositDetails(\
  \ ..... ) {\n        if(active) { ..... }\n    }\n\n    public boolean createFixedDeposit(FixedDepositDetails\
  \ fixedDepositDetails) {\n        if(active) { ..... }\n    }\n\n    @ManagedOperation\n\
  \    public void activateService() {\n        active = true;\n    }\n\n    @ManagedOperation\n\
  \    public void deactivateService() {\n        active = false;\n    }\n}\n```\n\
  \n上面的示例列表显示，`FixedDepositService` 类并没有直接使用 JMX API 将其实例注册到 MBean 服务器并将其方法暴露为 JMX\
  \ 操作。\n\n### JMS (Java 消息服务)\n\nSpring 的 JMS 支持简化了从 JMS 提供者处发送和接收消息。\n\n在 MyBank\
  \ 应用程序中，当客户提交请求通过电子邮件接收其固定存款详情时，`FixedDepositService` 将请求详情发送到 JMS 消息中间件（如 ActiveMQ）。该请求随后由消息监听器处理。Spring\
  \ 通过提供一个抽象层简化了与 JMS 提供者的交互。下面的示例列表显示了 `FixedDepositService` 类如何使用 Spring 的 `JmsTemplate`\
  \ 向 JMS 提供者发送请求详情：\n\n**示例列表 1-10** – 发送 JMS 消息的 FixedDepositService\n\n```java\n\
  import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.jms.core.JmsTemplate;\n\
  \npublic class FixedDepositService {\n\n   @Autowired\n   private transient JmsTemplate\
  \ jmsTemplate;\n\n    .....\n\n    public boolean submitRequest(Request request)\
  \ {\n        jmsTemplate.convertAndSend(request);\n    }\n}\n```\n\n上面的示例列表显示，`FixedDepositService`\
  \ 定义了一个类型为 `JmsTemplate` 的变量，并使用了 Spring 的 `@Autowired` 注解。目前你可以假设 `@Autowired`\
  \ 注解提供了对 `JmsTemplate` 实例访问。`JmsTemplate` 实例知道 JMS 消息要发送到的 JMS 目标。`JmsTemplate`\
  \ 如何配置在第 8 章中有详细描述。`FixedDepositService` 的 `submitRequest` 方法调用 `JmsTemplate` 的\
  \ `convertAndSend` 方法将请求详情（由 `submitRequest` 方法的 `Request` 参数表示）作为 JMS 消息发送到 JMS\
  \ 提供者。\n\n再次强调，上面的示例列表显示，如果你使用 Spring Framework 向 JMS 提供者发送消息，那么你就不需要直接处理 JMS API。\n\
  \n### 缓存\n\nSpring 的缓存抽象为在应用程序中使用缓存提供了一种一致的方法。\n\n使用缓存解决方案来提高应用程序性能是常见的。MyBank 应用程序使用缓存产品来提高固定存款详情\
  \ `read` 操作的性能。Spring Framework 通过抽象缓存相关的逻辑简化了与不同缓存解决方案的交互。\n\n下面的示例列表显示了 `FixedDepositService`\
  \ 的 `getFixedDepositDetails` 方法使用 Spring 的缓存抽象功能来缓存固定存款详情：\n\n**示例列表 1-11**– 缓存固定存款详情的\
  \ FixedDepositService\n\n```java\nimport org.springframework.cache.annotation.Cacheable;\n\
  \npublic class FixedDepositService {\n\n    @Cacheable(\"FixedDeposits\")\n    public\
  \ FixedDepositDetails getFixedDepositDetails( ..... ) { ..... }\n\n    public boolean\
  \ createFixedDeposit(FixedDepositDetails fixedDepositDetails) { ..... }\n}\n```\n\
  \n在上面的示例列表中，`@Cacheable` 注解表示 `getFixedDepositDetails` 方法返回的固定存款详情被缓存。如果以相同的参数调用\
  \ `getFixedDepositDetails` 方法，该方法将*不会*执行，而是从缓存中返回固定存款详情。这说明如果你使用 Spring Framework，就不需要在类中编写缓存相关的逻辑。Spring\
  \ 的缓存抽象在第 8 章中有详细解释。\n\n在本节中，我们看到 Spring Framework 通过透明地为 POJO 提供服务简化了企业级应用的开发，从而屏蔽了底层的\
  \ API 细节。\n\n既然我们已经了解了使用 Spring Framework 的某些好处，让我们来看看如何开发一个简单的 Spring 应用程序。\n\n\
  ## 1-5 一个简单的 Spring 应用程序\n\n在本节中，我们将查看一个使用 Spring DI 功能的简单 应用程序。要在应用程序中使用 Spring\
  \ DI 功能，请遵循以下步骤：\n\n1. 识别应用程序对象及其依赖\n2. 创建对应步骤 1 中识别的应用程序对象的 POJO 类\n3. 创建描述应用程序对象及其依赖的配置元数据\n\
  4. 创建 Spring IoC 容器实例并将配置元数据传递给它\n5. 从 Spring IoC 容器实例访问应用程序对象\n\n现在让我们结合 MyBank\
  \ 应用程序的背景来看上述步骤。\n\n### 识别应用程序对象及其依赖\n\n我们之前讨论过 MyBank 应用程序向用户展示了一个创建固定存款的表单（参考图\
  \ 1-3），用于创建固定存款。下面的序列图显示了当用户提交表单时进入场景的应用程序对象（及其交互）：\n\n![](img/00004.jpeg)\n\n**图\
  \ 1-4** MyBank 的应用程序对象及其依赖\n\n\n\n\n在上面的序列图中，`FixedDepositController` 代表一个在表单提交时接收请求的\
  \ Web 控制器。存款详情包含在 `FixedDepositDetails` 对象中。`FixedDepositController` 调用 `FixedDepositService`（一个服务层对象）的\
  \ `createFixedDeposit` 方法。然后，`FixedDepositService` 调用 `FixedDepositDao` 对象（一个数据访问对象）将定期存款详情保存到应用程序的数据存储器中。因此，我们可以从上述图中推断出，`FixedDepositService`\
  \ 是 `FixedDepositController` 对象的依赖，而 `FixedDepositDao` 是 `FixedDepositService` 对象的依赖。\n\
  \n**导入** `chapter 1/ch01-bankapp-xml`（此项目展示了一个使用 Spring DI 特性的简单 Spring 。要运行该应用程序，请执行项目中\
  \ `MyBankApp` 类的 main 方法）\n\n### 为识别出的应用对象创建 POJO 类\n\n一旦你确定了应用对象，下一步就是创建与这些应用对象对应的\
  \ POJO 类。与 `FixedDepositController`、`FixedDepositService` 和 `FixedDepositDao` 应用对象对应的\
  \ POJO 类可以在 `ch01-bankapp-xml` 项目中找到。`ch01-bankapp-xml` 项目代表使用 Spring DI 特性的 `MyBank`\
  \ 应用程序的简化版本。你应该将 `ch01-bankapp-xml` 项目导入到你的 IDE 中，因为在后续步骤中，我们将查看该项目包含的文件。\n\n在 1-3\
  \ 节中，我们讨论了依赖是如何作为构造函数参数或 setter 方法参数传递给应用对象的。下面的代码列表显示了 `FixedDepositService` 实例（`FixedDepositController`\
  \ 的依赖）是如何作为 setter 方法参数传递给 `FixedDepositController` 对象的：\n\n**示例列表 1-12** – `FixedDepositController`\
  \ 类\n\n**项目** – `ch01-bankapp-xml`\n\n**源码位置**-`src/main/java/sample/spring/chapter01/bankapp`\n\
  \n```\npackage sample.spring.chapter01.bankapp;\n\n.....\n\npublic class FixedDepositController\
  \ {\n\n    .....\n\n    private FixedDepositService fixedDepositService;\n\n   \
  \ .....\n\n    public void setFixedDepositService(FixedDepositService fixedDepositService)\
  \ {\n\n        logger.info(\"Setting fixedDepositService property\");\n\n      \
  \  this.fixedDepositService = fixedDepositService;\n\n    }\n\n    .....    \n\n\
  \    public void submit() {\n\n        fixedDepositService.createFixedDeposit(new\
  \ FixedDepositDetails( 1, 10000,\n\n            365, \"someemail@something.com\"\
  ));\n\n    }\n\n    .....\n}\n```\n\n在上面的示例列表中，`FixedDepositService` 依赖通过 `setFixedDepositService`\
  \ 方法传递给 `FixedDepositController`。我们很快就会看到 `setFixedDepositService` setter 方法方法是由\
  \ Spring 调用的。\n\n**注意** 如果你查看 `FixedDepositController`、`FixedDepositService` 和 `FixedDepositDao`\
  \ 类，你会发现这些类中没有实现任何 Spring 特有的接口，也没有继承自任何 Spring 特有的类。\n\n现在让我们来看如何在配置元数据中指定应用对象及其依赖。\n\
  \n### 创建配置元数据\n\n我们在 1-3 节中看到，配置元数据指定了应用对象及其依赖，Spring 容器读取这些信息来实例化应用对象并注入它们的依赖。在本节中，我们首先将查看配置元数据中包含哪些其他信息，然后深入探讨如何以\
  \ XML 格式指定配置元数据。\n\n配置元数据指定了应用程序所需的企业服务信息（如事务管理、安全和远程访问）。例如，如果你想让 Spring 管理事务，你需要在配置元数据中配置\
  \ Spring 的 `PlatformTransactionManager` 接口的实现。`PlatformTransactionManager` 的实现负责管理事务（参阅第\
  \ 7 章以了解更多关于 Spring 事务管理的功能）。\n\n如果你的应用程序与消息中间件（如 ActiveMQ）、数据库（如 MySQL）、电子邮件服务器等交互，那么配置元数据中也会定义简化与这些外部系统交互的\
  \ Spring 特有对象。例如，如果你的应用程序从 ActiveMQ 发送或接收 JMS 消息，你可以在配置元数据中配置 Spring 的 `JmsTemplate`\
  \ 类以简化与 ActiveMQ 的交互。我们在示例列表 1-10 中看到，如果你使用 `JmsTemplate` 向 JMS 提供者发送消息，那么你就不需要处理底层的\
  \ JMS API（参阅第 8 章以了解更多关于 Spring 对 JMS 提供者交互的支持）。\n\n你可以通过 XML 文件或通过 POJO 类中的注解向\
  \ Spring 容器提供配置元数据。从 Spring 3.0 开始，你还可以通过带有 Spring 的 `@Configuration` 注解的 Java 类向\
  \ Spring 容器提供配置元数据。在本节中，我们将看到如何以 XML 格式指定配置元数据。在第 6 章中，我们将看到如何通过 POJO 类中的注解以及带有\
  \ `@Configuration` 注解的 Java 类提供配置元数据。\n\n你通过创建一个包含应用对象及其依赖信息的 `application context\
  \ XML` 文件来提供 XML 格式的应用程序配置元数据。示例列表 1-3 显示了应用上下文 XML 文件的样子。下面的 XML 显示了 MyBank 应用程序的应用上下文\
  \ XML 文件，它由 `FixedDepositController`、`FixedDepositService` 和 `FixedDepositDao` 对象组成（参阅图\
  \ 1-4 查看对象是如何交互的）：\n\n**示例列表 1-13** – `applicationContext.xml` - MyBank 的应用上下文文件\n\
  \n**项目** – `ch01-bankapp-xml`\n\n**源码位置**-`src/main/resources/META-INF/spring`\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\
  \n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n    xsi:schemaLocation=\"\
  http://www.springframework.org/schema/beans\n    http://www.springframework.org/schema/beans/spring-beans-4.0.xsd\"\
  >\n\n    <bean id=\"controller\" class=\"sample.spring.chapter01.bankapp.FixedDepositController\"\
  >\n        <property name=\"fixedDepositService\" ref=\"service\" />\n    </bean>\n\
  \n    <bean id=\"service\" class=\"sample.spring.chapter01.bankapp.FixedDepositService\"\
  >\n        <property name=\"fixedDepositDao\" ref=\"dao\" />\n    </bean>\n\n  \
  \  <bean id=\"dao\" class=\"sample.spring.chapter01.bankapp.FixedDepositDao\"/>\n\
  </beans>\n```\n\n关于上述应用上下文 XML 文件，有以下几点：\n\n- `<beans>` 元素是应用上下文 XML 文件的根元素，定义在\
  \ `spring-beans-4.0.xsd` 中（也称为 Spring 的 beans 架构）。`spring-beans-4.0.xsd` 包含在 Spring\
  \ Framework 分发的 `spring-beans-4.0.0.RELEASE.jar` JAR 包中。\n\n\n\n\n\n-   每个 `<bean>`\
  \ 元素配置一个由 Spring 容器管理的应用程序对象。在 Spring Framework 的术语中，`<bean>` 元素表示一个 `bean definition`（bean\
  \ 定义）。Spring 容器根据 bean 定义创建的对象被称为 `bean`。`id` 属性为 bean 指定一个唯一名称，`class` 属性指定 bean\
  \ 的完全限定类名。你还可以使用 `<bean>` 元素的 `name` 属性来为 bean 指定 `aliases`（别名）。在 MyBank 应用程序中，应用程序对象是\
  \ `FixedDepositController`、`FixedDepositService` 和 `FixedDepositDao`；因此，我们有 3 个\
  \ `<bean>` 元素 - 每个应用程序对象对应一个。由于由 `<bean>` 元素配置的应用程序对象是由 Spring 容器管理的，因此创建这些对象并注入其依赖的责任由\
  \ Spring 容器承担。你不应该直接创建由 `<bean>` 元素定义的应用程序对象实例，而应该从 Spring 容器中获取它们。在本节的后后部分，我们将查看如何获取由\
  \ Spring 容器管理的应用程序对象。\n\n-   MyBank 应用程序中没有为 `FixedDepositDetails` 领域对象定义对应的 `<bean>`\
  \ 元素。这是因为领域对象通常**不是**由 Spring 容器管理的；它们是由应用程序使用的 ORM 框架（如 `Hibernate`）创建的，或者你使用 `new`\
  \ 运算符程序化地创建它们。\n\n-   `<property>` 元素指定由 `<bean>` 元素配置的 bean 的依赖（或配置属性）。`<property>`\
  \ 元素对应于 bean 类中的 `JavaBean-style setter`（JavaBean 风格 setter）方法，该方法由 Spring 容器调用以设置\
  \ bean 的依赖（或配置属性）。\n\n现在让我们来看如何通过 setter 方法注入依赖。\n\n#### 通过 setter 方法注入依赖\n\n为了理解如何通过\
  \ bean 类中定义的 setter 方法注入依赖，让我们再次查看 MyBank 应用程序的 `FixedDepositController` 类：\n\n\
  **示例列表 1-14** – `FixedDepositController` 类\n\n**项目** – `ch01-bankapp-xml`\n\n**源码位置**\
  \ – `src/main/java/sample/spring/chapter01/bankapp`\n\n```java\npackage sample.spring.chapter01.bankapp;\n\
  \nimport org.apache.log4j.Logger;\n\npublic class FixedDepositController {\n\n \
  \   private static Logger logger = Logger.getLogger(FixedDepositController.class);\n\
  \n    private FixedDepositService fixedDepositService;\n\n    public FixedDepositController()\
  \ {\n        logger.info(\"initializing\");\n    }\n\n    public void setFixedDepositService(FixedDepositService\
  \ fixedDepositService) {\n        logger.info(\"Setting fixedDepositService property\"\
  );\n        this.fixedDepositService = fixedDepositService;\n    }\n\n    .....\n\
  }\n```\n\n上面的示例列表显示 `FixedDepositController` 类声明了一个类型为 `FixedDepositService` 的名为\
  \ `fixedDepositService` 的实例变量。`fixedDepositService` 变量通过 `setFixedDepositService`\
  \ 方法设置 - 这是 `fixedDepositService` 变量的 `JavaBean-style setter method`。这是 `setter-based\
  \ DI`（基于 setter 的依赖注入）的一个示例，其中 setter 方法满足了依赖。\n\n下图描述了 `applicationContext.xml`\
  \ 文件中 `FixedDepositController` 类的 bean 定义（参见示例列表 1-13）：\n\n![](img/00005.jpeg)\n\
  \n**图 1-5** 使用 `<property>` 元素定义依赖\n\n上面的 bean 定义显示 `FixedDepositController` bean\
  \ 通过 `<property>` 元素定义了对 `FixedDepositService` bean 的依赖。`<property>` 元素的 `name`\
  \ 属性对应于 bean 类中的 JavaBean-style setter 方法，该方法由 Spring 容器在 bean 创建时调用。`<property>`\
  \ 元素的 `ref` 属性标识需要创建并传递给 JavaBean-style setter 方法的 Spring bean。`ref` 属性的值必须匹配配置元数据\
  \ `<bean>` 元素的 `id` 属性值（或 `name` 属性指定的名称之一）。\n\n在图 1-5 中，`<property>` 元素 `name`\
  \ 属性的值为 `fixedDepositService`，这意味着 `<property>` 元素对应于 `FixedDepositController` 类的\
  \ `setFixedDepositService` setter 方法（参见示例列表 1-14）。由于 `<property>` 元素 `ref` 属性的值为\
  \ `service`，`<property>` 引用了 `id` 值为 `service` 的 `<bean>` 元素。现在，`id` 值为 `service`\
  \ 的 `<bean>` 元素就是 `FixedDepositService` bean（参见示例列表 1-13）。Spring 容器创建 `FixedDepositService`\
  \ 类的实例（一个依赖项），并调用 `FixedDepositController`（依赖对象）的 `setFixedDepositService` 方法（用于\
  \ `fixedDepositService` 变量的 JavaBean-style setter 方法），传递 `FixedDepositService` 实例。\n\
  \n在 `FixedDepositController` 应用程序对象的上下文中，下图总结了 `<property>` 元素 `name` 和 `ref` 属性的作用：\n\
  \n![](img/00006.jpeg)\n\n**图 1-6** `<property>` 元素的 `name` 属性对应于满足 bean 依赖的 JavaBean-style\
  \ setter 方法，而 `ref` 属性引用另一个 bean。\n\n上面的图显示 `name` 属性的值 `fixedDepositService` 对应于\
  \ `FixedDepositController` 类的 `setFixedDepositService` 方法，`ref` 属性的值 `service` 引用\
  \ id 为 `service` 的 bean。\n\n**注意** 通过名称（即 `id` 属性的值）、类型（即 `class` 属性的值）或 bean 类实现的接口来引用\
  \ bean 定义是非常常见的。例如，你可以将“FixedDepositController bean” 称为“controller bean”。而且，如果 FixedDepositController\
  \ 类实现了 `FixedDepositf` 接口，你可以将“FixedDepositController bean” 称为“FixedDepositControllerf\
  \ bean”。\n\n下图总结了 Spring 容器如何根据 MyBank 应用程序 `applicationContext.xml` 文件（参见示例列表 1-13）提供的配置元数据创建\
  \ bean 并注入依赖：\n\n![](img/00007.jpeg)\n\n**图 1-7** - Spring IoC 容器创建 bean 并注入依赖的顺序。\n\
  \n\n\n\nSpring 的 `ApplicationContext` 对象代表 Spring 容器的实例。Spring 提供了 `ApplicationContext`\
  \ 接口的几个内置实现，例如 `ClassPathXmlApplicationContext`、`FileSystemXmlApplicationContext`、`XmlWebApplicationContext`、`XmlPortletApplicationContext`\
  \ 等。`ApplicationContext` 实现的选择取决于你如何定义配置元数据（使用 XML、注解或 Java 代码）以及你的应用程序类型（独立应用、web\
  \ 或 portlet 应用程序）。例如，`ClassPathXmlApplicationContext` 和 `FileSystemXmlApplicationContext`\
  \ 类适用于以 XML 格式提供配置元数据的 `standalone` 应用程序；`XmlWebApplicationContext` 适用于以 XML 格式提供配置元数据的\
  \ `web` 应用；`AnnotationConfigWebApplicationContext` 适用于通过 Java 代码提供配置元数据的 `web` 应用，以此此类推。\n\
  \n由于 `MyBank` 应用程序是一个独立应用程序，我们可以使用 `ClassPathXmlApplicationContext` 或 `FileSystemXmlApplicationContext`\
  \ 类来创建 Spring 容器的实例。你需要注意，`ClassPathXmlApplicationContext` 类从指定的 `classpath` 位置加载应用上下文\
  \ XML 文件，而 `FileSystemXmlApplicationContext` 类则从文件系统（`filesystem`）上的指定位置加载应用上下文\
  \ XML 文件。\n\n`MyBank` 应用程序的以下 `BankApp` 类展示了如何使用 `ClassPathXmlApplicationContext`\
  \ 类创建 Spring 容器实例：\n\n**示例 1-15** – `BankApp` 类\n\n**项目** – `ch01-bankapp-xml`\n\
  \n**源码位置** - `src/main/java/sample/spring/chapter01/bankapp`\n\n```java\npackage\
  \ sample.spring.chapter01.bankapp;\n\nimport org.springframework.context.ApplicationContext;\n\
  import org.springframework.context.support.ClassPathXmlApplicationContext;\n\npublic\
  \ class BankApp {\n    .....\n\n    public static void main(String args[]) {\n \
  \       ApplicationContext context = new ClassPathXmlApplicationContext(\n     \
  \       \"classpath:META-INF/spring/applicationContext.xml\");\n        .....\n\
  \    }\n}\n```\n\n上面的示例显示了 `BankApp` 的 `main` 方法，该方法负责启动 Spring 容器。应用上下文 XML 文件的路径位置被传递给\
  \ `ClassPathXmlApplicationContext` 类的构造函数。`ClassPathXmlApplicationContext` 实例的创建会导致应用上下文\
  \ XML 文件中那些被设置为 `singleton-scoped`（单例作用域）且 `pre-instantiated`（预实例化）的 bean 被创建。在第\
  \ 2 章中，我们将讨论 `bean scopes`（bean 作用域），以及由 Spring 容器进行 `pre-` 或 `lazily-instantiated`（懒实例化）的含义。现在，你可以假设\
  \ `MyBank` 应用程序的 `applicationContext.xml` 文件中定义的 bean 是单例作用域并设置为预实例化的。这意味着 `applicationContext.xml`\
  \ 文件中定义的 bean 在创建 `ClassPathXmlApplicationContext` 实例时就会被创建。\n\n现在，我们已经了解了如何创建 Spring\
  \ 容器的实例，让我们来看看如何从 Spring 容器中获取 bean 实例。\n\n### 从 Spring 容器访问 bean\n\n通过 `<bean>`\
  \ 定义的应用程序对象由 Spring 容器创建并管理。你可以通过调用 `ApplicationContext` 接口的 `getBean` 方法之一来访问这些对象的实例。\n\
  \n下面的示例显示了 `BankApp` 类的 `main` 方法，它从 Spring 容器获取了 `FixedDepositController` bean\
  \ 实例并调用了它的方法：\n\n**示例 1-16** – `BankApp` 类\n\n**项目** – `ch01-bankapp-xml`\n\n**源码位置**\
  \ - `src/main/java/sample/spring/chapter01/bankapp`\n\n```java\npackage sample.spring.chapter01.bankapp;\n\
  \nimport org.apache.log4j.Logger;\nimport org.springframework.context.ApplicationContext;\n\
  import org.springframework.context.support.ClassPathXmlApplicationContext;\n\npublic\
  \ class BankApp {\n    private static Logger logger = Logger.getLogger(BankApp.class);\n\
  \n    public static void main(String args[]) {\n        ApplicationContext context\
  \ = new ClassPathXmlApplicationContext(\n            \"classpath:META-INF/spring/applicationContext.xml\"\
  );\n        FixedDepositController fixedDepositController = (FixedDepositController)\
  \ context.getBean(\"controller\");\n        logger.info(\"Submission of deposit\
  \ : \" + fixedDepositController.submit());\n        logger.info(\"Returned deposit\
  \ info : \" + fixedDepositController.get());\n    }\n}\n```\n\n首先，调用 `ApplicationContext`\
  \ 的 `getBean` 方法从 Spring 容器中获取 `FixedDepositController` bean，随后调用 `submit` 和 `get`\
  \ 方法。传递给 `getBean` 的参数必须是你想要获取的 bean 名称。如果 Spring 容器中没有注册该名称的 bean，则会抛出异常。\n\n在示例\
  \ 1-16 中，为了配置 `FixedDepositController` 实例，我们没有通过编程创建实例。\n\n上面的输出显示 Spring 容器创建了\
  \ `MyBank` 应用程序 `applicationContext.xml` 文件中定义的每个 bean 的实例。此外，Spring 容器使用基于 setter\
  \ 的依赖注入（DI）将 `FixedDepositService` 实例注入到 `FixedDepositController` 实例，并将 `FixedDepositDao`\
  \ 实例注入到 `FixedDepositService` 实例。\n\n如果你进入 `ch01-bankapp-xml` 项目并执行 `BankApp` 的\
  \ `main` 方法，你将在控制台上看到输出输出：\n\n```\nINFO sample.spring.chapter01.bankapp.FixedDepositController\
  \ - initializing\nINFO sample.spring.chapter01.bankapp.FixedDepositService - initializing\n\
  INFO sample.spring.chapter01.bankapp.FixedDepositDao - initializing\nINFO sample.spring.chapter01.bankapp.FixedDepositService\
  \ - SettingDao property\nINFO sample.spring.chapter01.bankapp.FixedDepositController\
  \ - Setting fixedService property\nINFO sample.spring.chapter01.bankapp.BankApp\
  \ - Submission of deposit : true\nINFO sample.spring.chapter01.bankapp.BankApp -\
  \ Returned deposit info : id :1, deposit amount :10000.0, tenure :365, email :someemail@something.com\n\
  ```\n\n## 1-6 构建在 Spring 之上的框架\n\n有很多以 Spring Framework 为基础的 SpringSource 框架，我们将查看一些流行的框架。有关框架的完整列表以及单个框架的详细信息，建议访问\
  \ SpringSource 网站（[www.springsource.org](http://www.springsource.org)）。\n\n下表提供了基于\
  \ Spring Framework 构建的 SpringSource 框架的高级概述：\n\n| 框架 | 说明 |\n| :--- | :--- |\n|\
  \ `Spring Security` | 企业应用程序的身份验证和授权框架。你需要在应用上下文 XML 文件中配置一些 bean 以向应用程序引入身份验证和授权功能。\
  \ |\n| `Spring Data` | 为不同类型数据库交互的一致编程模型。例如，你可以使用它与 `MongoDB` 或 `Neo4j` 等非关系数据库进行交互，也可以使用它通过\
  \ `JPA` 访问关系型数据库。 |\n\n\n\n\n\n| **Spring Batch** | 如果你的应用程序需要批量处理，这个框架非常适合你。 |\n\
  | **Spring Integration** | 为应用程序提供企业应用集成 (EAI) 能力。 |\n| **Spring Social** | 如果你的应用程序需要与\
  \ Facebook 和 Twitter 等社交媒体网站进行交互，那么你会发现这个框架非常有用。 |\n| **Spring BlazeDS Integration**\
  \ | 如果你正在开发基于 Adobe Flex 的应用程序，可以使用此框架将 Flex 前端与基于 Spring 的业务层连接起来。 |\n\n由于上表提到的框架都是基于\
  \ `Spring Framework` 构建的，因此在使用其中任何一个框架之前，请确保它们与你正在使用的 `Spring Framework` 版本兼容。\n\
  \n## 1-7 总结\n\n在本章中，我们查看了使用 `Spring Framework` 的益处。我们还查看了一个简单的 `Spring` 应用程序，它展示了如何以\
  \ XML 格式指定配置元数据、创建 `Spring` 容器实例并从中检索 bean。在下一章中，我们将 own 介绍 `Spring Framework` 的一些基础概念。\n\
  \n# 第 2 章 – Spring Framework 基础\n\n## 2-1 引言\n\n在上一章中，我们看到 `Spring` 容器会调用 bean 类的无参构造函数来创建\
  \ bean 实例，并使用基于 setter 的依赖注入（DI）来设置 bean 依赖。在本章中，我们将更进一步，探讨：\n\n- `Spring` 对“面向接口编程”设计原则的支持\n\
  - 实例化 `Spring` bean 的不同方法\n- 基于构造函数的 DI 将 bean 依赖作为构造函数参数传递\n- 基于构造函数和 setter 的\
  \ DI 将简单的 `String` 值传递给 bean，以及\n- bean 作用域（bean scopes）\n\n让我们从查看 `Spring` 如何通过支持“面向接口编程”设计原则来提高应用程序的可测试性开始\n\
  \n## 2-2 面向接口编程设计原则\n\n在第 1 章第 1-5 节中，我们看到依赖 POJO 类包含了对依赖的具体类的引用。例如，`FixedDepositController`\
  \ 类包含了对 `FixedDepositService` 类的引用，而 `FixedDepositService` 类包含了对 `FixedDepositDao`\
  \ 类的引用。如果依赖类直接引用依赖的具体类，就会导致类与类之间的紧散耦合。这意味着如果你想替换依赖的另一个实现，就需要修改依赖类。\n\n现在让我们来看一个依赖类直接引用依赖的具体类的场景。\n\
  \n### 场景：依赖类包含对依赖具体类的引用\n\n假设 `FixedDepositDao` 类使用纯 JDBC 与数据库交互。为了简化数据库交互，你创建了另一个\
  \ DAO 实现类 `FixedDepositHibernateDao`，它使用 Hibernate ORM 进行数据库交互。现在，要从纯 JDBC 切换到 Hibernate\
  \ ORM 实现，你需要修改 `FixedDepositService` 类，使用 `FixedDepositHibernateDao` 类而不是 `FixedDepositDao`\
  \ 类，如下示例列表所示：\n\n**示例列表 2-1** – FixedDepositService 类\n\n```java\npublic class FixedDepositService\
  \ {\n\n  private FixedDepositHibernateDao fixedDepositDao;\n\n  public void setFixedDepositDao(FixedDepositHibernateDao\
  \ fixedDepositDao) {\n      this.fixedDepositDao = fixedDepositDao;\n  }\n\n  public\
  \ FixedDepositDetails getFixedDepositDetails(long id) {\n    return fixedDepositDao.getFixedDepositDetails(id);\n\
  \  }\n\n  public boolean createFixedDeposit(FixedDepositDetails fixedDepositDetails)\
  \ {\n    return fixedDepositDao.createFixedDeposit(fixedDepositDetails);\n  }\n\
  }\n```\n\n上面的示例列表显示，对 `FixedDepositDao` 类的引用被 `FixedDepositHibernateDao` 替换，以便可以使用\
  \ Hibernate ORM 进行数据库交互。这表明，如果依赖类引用依赖的具体实现类，那么替换不同的实现就需要修改依赖类。\n\n现在让我们来看一个依赖类包含依赖所实现的接口引用的场景。\n\
  \n我们知道 Java 接口定义了一个实现类必须遵守的合约。因此，如果一个类依赖于依赖所实现的接口，那么当替换依赖的另一个实现时，不需要更改该类。这种类依赖于依赖所实现的接口的应用程序设计方法被称为“面向接口编程”。依赖类实现的接口被称为*依赖接口*（dependency\
  \ interface）。\n\n由于“面向接口编程”比“面向类编程”是一种良好的设计实践，接下来的类图显示，如果 `ABean` 类依赖于 `BBean` 接口而不是实现\
  \ `BBean` 接口的 `BBeanImpl` 类，那么这就是良好的设计：\n\n![](img/00008.jpeg)\n\n**图 2-1** – “面向接口编程”比“面向类编程”是良好的设计实践\n\
  \n接下来的类图显示了 `FixedDepositService` 类如何利用“面向接口编程”设计方法来轻松切换用于数据库交互的策略：\n\n![](img/00009.jpeg)\n\
  \n**图 2-2** – `FixedDepositService` 依赖于 `FixedDepositDao` 接口，该接口由 `FixedDepositJdbcDao`\
  \ 和 `FixedDepositHibernateDao` 类实现。\n\n上面的图显示 `FixedDepositService` 类并不直接于 `FixedDepositJdbcDao`\
  \ 或 `FixedDepositHibernateDao` 类。相反，`FixedDepositService` 依赖于由 `FixedDepositJdbcDao`\
  \ 和 `FixedDepositHibernateDao` 类实现的 `FixedDepositDao` 接口（依赖接口）。现在，根据你想使用纯 JDBC 还是\
  \ Hibernate ORM 框架，向 `FixedDepositService` 实例提供 `FixedDepositJdbcDao` 或 `FixedDepositHibernateDao`\
  \ 的实例。\n\n由于 `FixedDepositService` 依赖于 `FixedDepositDao` 接口，你将来可以支持其他的数据库交互策略。假设你决定使用\
  \ iBATIS（现已命名为 MyBatis）持久框架进行数据库交互。你只需要创建一个实现 `FixedDepositDao` 接口的新类 `FixedDepositIbatisDao`，并向\
  \ `FixedDepositService` 实例提供 `FixedDepositIbatisDao` 的实例，就可以在不修改 `FixedDepositService`\
  \ 类的情况下使用 iBATIS。\n\n到目前为止，我们已经看到“面向接口编程”设计方法会导致依赖类与其依赖之间的松散耦合。现在让我们来看看这种设计方法如何提高依赖类的可测试性。\n\
  \n### 提高依赖类的可测试性\n\n在图 2-2 中，我们看到 `FixedDepositService` 类持有对 `FixedDepositDao` 接口的引用。`FixedDepositJdbcDao`\
  \ 和 `FixedDepositHibernateDao` 是 `FixedDepositDao` 接口的具体实现类。现在，为了简化 `FixedDepositService`\
  \ 类的单元测试，你可以替换一个不需要数据库的 `FixedDepositDao` 接口的模拟（mock）实现。\n\n如果 `FixedDepositService`\
  \ 类直接引用 `FixedDepositJdbcDao` 或 `FixedDepositHibernateDao` 类，测试 `FixedDepositService`\
  \ 类将需要为测试目的搭建数据库。这表明通过使用依赖接口的模拟实现，你可以节省为依赖类设置基础设施的工作。\n\n现在让我们来看看 `Spring` 如何在应用程序中支持“面向接口编程”设计原则。\n\
  \n### Spring 对“面向接口编程”设计原则的支持\n\n在你的 Spring 应用程序中使用“面向接口编程”设计原则，你需要确保以下几点：\n\n\n\
  \n\n\n- 配置元数据中的 `<bean>` 元素指定了依赖的具体类。\n- 依赖的 bean 类引用的是依赖接口，而不是依赖的具体类。\n\n现在让我们来看一下使用“面向接口编程”设计方法的修改后的\
  \ `MyBank` 应用程序。\n\n**导入** `chapter 2/ch02-bankapp-interfaces`（该项目展示了如何在创建 Spring\
  \ 应用时使用“面向接口编程”设计方法。要运行该应用程序，请执行该项目中 `BankApp` 类的主方法）\n\n### 使用“面向接口编程”设计方法的 MyBank\
  \ 应用程序\n\n下面的类图描述了使用“面向接口编程”设计方法的修改后的 `MyBank` 应用程序：\n\n![](img/00010.jpeg)\n\n\
  **图 2-3** - 使用“面向接口编程”设计方法的 MyBank 应用程序\n\n上面的图显示，依赖类依赖于依赖项实现的接口，*而不是*依赖于依赖的具体实现类。例如，`FixedDepositControllerImpl`\
  \ 类依赖于 `FixedDepositService` 接口，而 `FixedDepositServiceImpl` 类依赖于 `FixedDepositDao`\
  \ 接口。\n\n下面的示例列表显示了基于图 2-3 所示设计的 `FixedDepositServiceImpl` 类：\n\n**示例 2-2** – `FixedDepositService`\
  \ 类\n\n**项目** – `ch02-bankapp-interfaces`\n\n**源位置** - `src/main/java/sample/spring/chapter02/bankapp`\n\
  \n```java\npackage sample.spring.chapter02.bankapp;\n\npublic class FixedDepositServiceImpl\
  \ implements FixedDepositService {\n\n    private FixedDepositDao fixedDepositDao;\n\
  \n    .....\n\n    public void setFixedDepositDao(FixedDepositDao fixedDepositDao)\
  \ {\n\n            this.fixedDepositDao = fixedDepositDao;\n\n    }\n\n    public\
  \ FixedDepositDetails getFixedDepositDetails(long id) {\n        return fixedDepositDao.getFixedDepositDetails(id);\n\
  \    }\n\n    public boolean createFixedDeposit(FixedDepositDetails fdd) {\n   \
  \     return fixedDepositDao.createFixedDeposit(fdd);\n    }\n}\n```\n\n上面的示例列表显示\
  \ `FixedDepositServiceImpl` 类包含了对 `FixedDepositDao` 接口的引用。你想要注入到 `FixedDepositServiceImpl`\
  \ 实例中的 `FixedDepositDao` 实现是在应用上下文 XML 文件中指定的。如图 2-3 所示，你可以注入 `FixedDepositDao`\
  \ 接口的以下任何一个具体实现：`FixedDepositIbatisDao`、`FixedDepositJdbcDao` 和 `FixedDepositHibernateDao`。\n\
  \n下面的示例列表显示了适应图 2-3 所示设计的 `applicationContext.xml` 文件：\n\n**示例 2-3** – `applicationContext.xml`\
  \ - MyBank 的应用上下文 XML 文件\n\n**项目** – `ch02-bankapp-interfaces`\n\n**源位置** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<beans .....>\n\
  \    <bean id=\"controller\"\n          class=\"sample.spring.chapter02.bankapp.controller.FixedDepositControllerImpl\"\
  >\n        <property name=\"fixedDepositService\" ref=\"service\" />\n    </bean>\n\
  \    <bean id=\"service\" class=\"sample.spring.chapter02.bankapp.service.FixedDepositServiceImpl\"\
  >\n        <property name=\"fixedDepositDao\" ref=\"dao\" />\n    </bean>\n    <bean\
  \ id=\"dao\" class=\"sample.spring.chapter02.bankapp.dao.FixedDepositHibernateDao\"\
  />\n</beans>\n```\n\n上面的 `applicationContext.xml` 文件显示 `FixedDepositHibernateDao`\
  \ 实例（`FixedDepositDao` 接口的实现）被注入到 `FixedDepositServiceImpl` 中。现在，如果你决定使用 iBATIS\
  \ 代替 Hibernate 进行持久化，只需将 `applicationContext.xml` 文件中 `dao` bean 定义的 `class` 属性更改为\
  \ `FixedDepositIbatisDao`类的全限定名即可。\n\n现在让我们来看看 Spring 容器实例化 bean 的方法。\n\n## 2-3\
  \ 实例化 Spring bean 的不同方法\n\n到为止，我们已经看到了 bean 定义示例，它们指示 Spring 容器通过调用 bean 类的*无参数*构造函数来创建\
  \ bean 实例。考虑以下 bean 定义：\n\n```xml\n<bean id=\"myBean\" class=\"mypackage.MyBean\"\
  />\n```\n\n在上面的 bean 定义中，`MyBean` 类表示一个定义了无参数构造函数的 POJO 类。`MyBean` 类没有实现任何 Spring\
  \ 特有的接口或继承任何 Spring 特有的类。这意味着 Spring 容器可以创建并管理提供无参数构造函数的任何类的实例。\n\n**注意** 需要注意的是，Spring\
  \ 容器可以创建并管理任何类的实例，无论该类是否提供了无参数构造函数。在 2-4 节中，我们将查看...\n\n如果你有一个使用工厂创建实例的现有项目，仍然可以使用\
  \ Spring 容器来管理对象。\n\n### 通过*静态*方法实例化 bean\n\n在图 2-3 中，我们看到 `FixedDepositDao` 接口由\
  \ `FixedDepositIbatisDao` 和 `FixedDepositJdbcDao` 实现。下面的示例列表显示了 `FixedDepositFactory`\
  \ 类，它定义了一个根据参数返回实例的*静态*方法：\n\n**示例 2-4** – `FixedDepositFactory` 类\n\n```java\n\
  public class FixedDepositFactory {\n    private FixedDepositFactory() { }\n\n  \
  \  public static FixedDepositDao getFixedDao(String daoType) {\n        FixedDepositDao\
  \ fixedDepositDao = null;\n        if (\"jdbc\".equalsIgnoreCase(daoType)) {\n \
  \           fixedDepositDao = new FixedDepositJdbcDao();\n        }\n        if\
  \ (\"hibernate\".equalsIgnoreCase(daoType)) {\n            fixedDepositDao = new\
  \ FixedDepositHibernateDao();\n        }\n        .....\n        return fixedDepositDao;\n\
  \    }\n}\n```\n\n上面的示例列表显示 `FixedDepositFactory` 类定义了一个 `getFixedDao`静态方法，该方法根据\
  \ `daoType` 参数的值创建并返回 `FixedDepositJdbcDao`、`FixedDepositHibernateDao` 或 `FixedDepositIbatisDao`\
  \ 的实例。\n\n下面的 `FixedDepositFactory` 类 bean 定义指示 Spring 容器调用 `FixedDepositFactory`\
  \ 的 `getFixedDao` 方法来获取 `FixedDepositJdbcDao` 类实例：\n\n**示例 2-5** – `FixedDepositFactory`\
  \ 类的 bean 定义\n\n```xml\n<bean id=\"dao\" class=\"sample.spring.FixedDepositFactory\"\
  \n      factory-method=\"getFixedDao\">\n    <constructor-arg index=\"0\" value=\"\
  jdbc\"/>\n</bean>\n```\n\n在上面的 bean 定义中，`class` 属性指定定义静态方法的类的全限定名。`factory-method`\
  \ 属性指定 Spring 容器调用的获取 `FixedDepositDao` 对象的静态方法的名称。`<constructor-arg>` 元素定义在 Spring\
  \ 的 `beansschema` 中，用于向构造函数以及*静态*和*实例*工厂方法传递参数。`index` 属性引用参数在构造函数或*静态*或*实例*工厂方法中的位置。在上面的\
  \ bean 定义中，`index` 属性的值 0 意味着 `<constructor-arg>` 元素为 `getFixedDao` 工厂方法的第一个参数 `daoType`\
  \ 提供值。`value` 属性指定参数值。\n\n\n\n\n\n需要注意的是，调用 `ApplicationContext` 的 `getBean` 方法来获取\
  \ dao bean（参考示例 2-5）将导致 `FixedDepositDaoFactory` 的 `getFixedDepositDao` 工厂方法被调用。这意味着调用\
  \ `getBean(\"dao\")` 返回的是由 `getFixedDepositDao` 工厂方法创建的 `FixedDepositDao` 实例，而不是\
  \ `FixedDepositDaoFactory` 类的实例。\n\n现在，我们已经看到了创建 `FixedDepositDao` 实例的工厂类的配置，接下来的示例展示了如何将\
  \ `FixedDepositDao` 实例注入到 `FixedDepositServiceImpl` 类中：\n\n**示例 2-6** – 注入由静态工厂方法创建的对象实例\n\
  \n```xml\n<bean id=\"service\" class=\"sample.spring.chapter02.bankapp.FixedDepositServiceImpl\"\
  >\n    <property name=\"fixedDepositDao\" ref=\"dao\" />\n</bean>\n\n<bean id=\"\
  dao\" class=\"sample.spring.chapter02.basicapp.FixedDepositDaoFactory\"\n      factory-method=\"\
  getFixedDepositDao\">\n    <constructor-arg index=\"0\" value=\"jdbc\"/>\n</bean>\n\
  ```\n\n在上述示例中，`<property>` 元素将 `FixedDepositDaoFactory` 的 `getFixedDepositDao` 工厂方法返回的\
  \ `FixedDepositDao` 实例注入到 `FixedDepositServiceImpl` 实例中。如果你将上述 `FixedDepositServiceImpl`\
  \ 类的 bean 定义与示例 2-3 中的定义对比，你会发现它们完全相同。这表明，无论 Spring 容器如何（使用无参构造函数或静态工厂方法）创建 bean\
  \ 实例，bean 依赖指定方式都是相同的。\n\n现在让我们来看看 Spring 容器是如何通过调用实例工厂方法实例化 bean 的。\n\n### 通过实例工厂方法实例化\
  \ bean\n\n下面的示例展示了 `FixedDepositDaoFactory` 类，该类定义了一个实例工厂方法，用于创建并返回 `FixedDepositDao`\
  \ 实例：\n\n**示例 2-7** – FixedDepositDaoFactory 类\n\n```java\npublic class FixedDepositDaoFactory\
  \ {\n    public FixedDepositDaoFactory() {\n    }\n\n    public FixedDepositDao\
  \ getFixedDepositDao(String daoType) {\n        FixedDepositDao FixedDepositDao\
  \ = null;\n        if(\"jdbc\".equalsIgnoreCase(daoType)) {\n            FixedDepositDao\
  \ = new FixedDepositJdbcDao();\n        }\n        if(\"hibernate\".equalsIgnoreCase(daoType))\
  \ {\n            FixedDepositDao = new FixedDepositHiberateDao();\n        }\n \
  \       .....\n        return fixedDepositDao;\n    }\n}\n```\n\n如果一个类定义了实例工厂方法，该类必须定义一个公共构造函数，以便\
  \ Spring 容器能够创建该类的实例。在上述示例中，`FixedDepositDaoFactory` 类定义了一个公共无参构造函数。`FixedDepositDaoFactory`\
  \ 的 `getFixedDepositDao` 方法是一个实例工厂方法，用于创建并返回 `FixedDepositDao` 实例。\n\n下面的示例展示了如何指示\
  \ Spring 容器调用 `FixedDepositDaoFactory` 的 `getFixedDepositDao` 方法来获取 `FixedDepositDao`\
  \ 实例：\n\n**示例 2-8** – 调用 FixedDepositDaoFactory 的 getFixedDepositDao 方法配置\n\n```xml\n\
  <bean id=\"daoFactory\" class=\"sample.spring.chapter02.basicapp.FixedDepositDaoFactory\"\
  \ />\n<bean id=\"dao\" factory-bean=\"daoFactory\" factory-method=\"getFixedDepositDao\"\
  >\n    <constructor-arg index=\"0\" value=\"jdbc\"/>\n</bean>\n<bean id=\"service\"\
  \ class=\"sample.spring.chapter02.bankapp.FixedDepositServiceImpl\">\n    <property\
  \ name=\"fixedDepositDao\" ref=\"dao\" />\n</bean>\n```\n\n上述示例显示，`FixedDepositDaoFactory`\
  \ 类（包含实例工厂方法的类）的配置方式与普通 Spring bean 类似，并使用独立的 `<bean>` 元素来配置实例工厂方法的细节。要配置实例工厂方法的细节，使用了\
  \ `<bean>` 元素的 `factory-bean` 和 `factory-method` 属性。`factory-bean` 属性引用定义实例工厂方法的\
  \ bean，而 `factory-method` 属性指定了实例工厂方法的名称。在上述示例中，`<property>` 元素将 `FixedDepositDaoFactory`\
  \ 的 `getFixedDepositDao` 工厂方法返回的 `FixedDepositDao` 实例注入到 `FixedDepositServiceImpl`\
  \ 实例中。\n\n与静态工厂方法一样，你可以使用 `<constructor-arg>` 元素为实例工厂方法传递参数。注意的是，在上述示例中，调用 `ApplicationContext`\
  \ 的 `getBean` 方法获取 dao bean 将导致 `FixedDepositDaoFactory` 的 `getFixedDepositDao`\
  \ 工厂方法被调用。\n\n到为止，我们查看了通过 setter 方法将依赖注入到 bean 中的 bean 定义示例。现在让我们来看看用于注入依赖的各种 DI\
  \ 机制。\n\n## 2-4 依赖注入技术\n\n在 Spring 中，依赖注入是通过向 bean 的构造函数和 setter 方法传递参数来实现的。如果你使用静态或实例工厂方法来创建\
  \ bean 实例，你可以将 bean 依赖传递给工厂方法，也可以在工厂方法返回的 bean 实例上设置它们。\n\n现在我们将查看演示不同 DI 技术的示例。\n\
  \n### 基于 setter 的 DI\n\n在本书目前为止，我们已经看到了基于 setter 的 DI 示例。在基于 setter 的 DI 中，使用 `<property>`\
  \ 元素来指定 bean 依赖。<property>` 元素也用于传递 bean 所需的配置信息（如果有）。\n\n假设 MyBank 应用包含一个 `PersonalBankingService`\
  \ 服务，它允许客户检索账户账单、检查账户详情、更新联系电话、修改密码以及联系客服。`PersonalBankingService` 类使用 `JmsMessageSender`（发送消息）、`EmailMessageSender`（发送电子邮件）和\
  \ `WebServiceInvoker`（调用外部服务）来实现其预期功能。下面的示例展示了 `PersonalBankingService` 类：\n\n**示例\
  \ 2-9** – PersonalBankingService 类\n\n```java\npublic class PersonalBankingService\
  \ {\n    private JmsMessageSender jmsMessageSender;\n    private EmailMessageSender\
  \ emailMessageSender;\n    private WebServiceInvoker webServiceInvoker;\n\n    .....\n\
  \    public void setJmsMessageSender(JmsMessageSender jmsMessageSender) {\n    \
  \    this.jmsMessageSender = jmsMessageSender;\n    }\n\n    public void setEmailMessageSender(EmailMessageSender\
  \ emailMessageSender) {\n        this.emailMessageSender = emailMessageSender;\n\
  \    }\n\n    public void setWebServiceInvoker(WebServiceInvoker webServiceInvoker)\
  \ {\n        this.webServiceInvoker = webServiceInvoker;\n    }\n    .....\n}\n\
  ```\n\n上述示例为 `PersonalBankingService` 类的 `JmsMessageSender`、`EmailMessageSender`\
  \ 和 `WebServiceInvoker` 依赖定义了 setter 方法。\n\n我们可以基于 setter 的 DI 来注入 `PersonalBankingService`\
  \ 类的依赖，如下：\n\n**示例 2-10** – PersonalBankingService 类及其依赖的 bean 定义\n\n```xml\n<bean\
  \ id=\"personalBankingService\" class=\"PersonalBankingService\">\n    <property\
  \ name=\"emailMessageSender\" ref=\"emailMessageSender\" />\n    <property name=\"\
  jmsMessageSender\" ref=\"jmsMessageSender\" />\n    <property name=\"webServiceInvoker\"\
  \ ref=\"webServiceInvoker\" />\n</bean>\n\n<bean id=\"jmsMessageSender\" class=\"\
  JmsMessageSender\">\n    .....\n</bean>\n\n<bean id=\"webServiceInvoker\" class=\"\
  WebServiceInvoker\">\n    .....\n</bean>\n\n<bean id=\"emailMessageSender\" class=\"\
  EmailMessageSender\">\n    .....\n</bean>\n```\n\npersonalBankingService bean 定义显示为\
  \ PersonalBankingService 类的每个依赖指定了一个 `<property>` 元素。\n\n\n\n\n\n`PersonalBankingService`\
  \ 使用 `EmailMessageSender` bean 在客户更改联系电话时，向其电子邮箱地址发送电子邮件通知。`EmailMessageSender`\
  \ 需要邮件服务器地址，以及用于与邮件服务器身份验证的 `username` 和 `password`。下面的示例列表显示`<property>` 元素也可以用于设置类型为\
  \ `String` 的 bean 属性：\n\n### 示例列表 2-11：EmailMessageSender 类及对应的 bean 定义\n\n```java\n\
  public class EmailMessageSender {\n  private String host;\n  private String username;\n\
  \  private String password;\n    .....\n\n    public void setHost(String host) {\n\
  \        this.host = host;\n    }\n\n    public void setUsername(String username)\
  \ {\n        this.username = username;\n    }\n\n    public void setPassword(String\
  \ password) {\n        this.password = password;\n    }\n\n    .....\n}\n```\n\n\
  ```xml\n<bean id=\"emailMessageSender\" class=\"EmailMessageSender\">\n    <property\
  \ name=\"host\" value=\"smtp.gmail.com\"/>\n    <property name=\"username\" value=\"\
  myusername\"/>\n    <property name=\"password\" value=\"mypassword\"/>\n</bean>\n\
  ```\n\n上面的示例列表显示`<property>` 元素被用于设置 `EmailMessageSender` bean 的 `host`、`username`\
  \ 和 `password` 属性。`value` 属性指定了由 `name` 属性标识的 bean 属性的 `String` 值。`host`、`username`\
  \ 和 `password` 属性代表 `EmailMessageSender` bean 需要的配置信息。在第三章，我们将看到如何使用`<property>`\
  \ 元素设置基本类型（如 `int`、`long` 等）、集合类型（如 `java.util.List`、`java.util.Map` 等）以及自定义类型（如\
  \ `Address`）属性。\n\n基于 setter 的 DI（依赖注入）也用于向由 `static` 和 `instance` 工厂方法创建的 bean\
  \ 注入依赖。让我们来看看结合 `static` 和 `instance` 工厂方法使用基于 setter 的 DI。\n\n### 向工厂方法创建的 bean\
  \ 实例注入依赖\n\n你可以使用基于 setter 的 DI 为 `static` 或 `instance` 工厂方法返回的 bean 实例注入依赖。\n\n\
  考虑下面的 `FixedDepositJdbcDao` 类，它定义了一个 `databaseInfo` 属性：\n\n### 示例列表 2-12：FixedDepositJdbcDao\
  \ 类\n\n```java\npublic class FixedDepositJdbcDao {\n  private DatabaseInfo databaseInfo;\n\
  \    .....\n\n    public FixedDepositJdbcDao() { }\n\n  public void setDatabaseInfo(DatabaseInfo\
  \ databaseInfo) {\n        this.databaseInfo = databaseInfo;\n    }\n}\n```\n\n\
  在上面的示例列表中，`databaseInfo` 属性代表 `FixedDepositJdbcDao` 类的依赖，该依赖通过 `setDatabaseInfo`\
  \ 方法实现。下面的 `FixedDepositDaoFactory` 类定义了一个工厂方法，负责创建并返回 `FixedDepositDao` 类的实例：\n\
  \n### 示例列表 2-13：FixedDepositDaoFactory 类\n\n```java\npublic class FixedDepositDaoFactory\
  \ {\n  public FixedDepositDaoFactory() {\n  }\n  public FixedDepositDao getFixedDepositDao(String\
  \ daoType) {\n    FixedDepositDao fixedDepositDao = null;\n    if (\"jdbc\".equalsIgnoreCase(daoType))\
  \ {\n        fixedDepositDao = new FixedDepositJdbcDao();\n    }\n    if (\"hibernate\"\
  .equalsIgnoreCase(daoType)) {\n        fixedDepositDao = new FixedDepositHibernateDao();\n\
  \    }\n    .....\n    return fixedDepositDao;\n  }\n}\n```\n\n在上面的示例列表中，`getFixedDepositDao`\
  \ 方法是创建 `FixedDepositDao` 的 `instance` 工厂方法。如果参数 `daoType` 的值为 `jdbc`，`getFixedDepositDao`\
  \ 方法将创建一个 `FixedDepositJdbcDao` 实例。需要注意的是，`getFixedDepositDao` 方法并没有设置 `FixedDepositJdbcDao`\
  \ 实例的 `databaseInfo` 属性。\n\n正如我们在示例列表 2-8 中所示，下面的 bean 定义指示 Spring 容器通过调用 `FixedFactoryFactory`\
  \ 的 `getFixedDepositDao` `instance` 工厂方法来创建一个 `FixedDepositJdbcDao` 实例：\n\n####\
  \ 示例列表 2-14：调用 FixedDepositDaoFactory 的 getFixedDepositDao 方法的配置\n\n```xml\n<bean\
  \ id=\"daoFactory\" class=\"FixedDepositDaoFactory\" />\n<bean id=\"dao\" factory-bean=\"\
  daoFactory\" factory-method=\"getFixedDepositDao\">\n    <constructor-arg index=\"\
  0\" value=\"jdbc\"/>\n</bean>\n```\n\n`dao` bean 定义会导致调用 `FixedDepositDaoFactory`\
  \ 的 `getFixedDepositDao` 方法，该方法创建并返回一个 `FixedDepositJdbcDao` 实例。但是，`FixedDepositJdbcDao`\
  \ 的 `databaseInfo` 属性并未设置。为了设置 `databaseInfo` 依赖，你可以对 `getFixedDepositDao` 方法返回的\
  \ `FixedDepositJdbcDao` 实例执行基于 setter 的 DI，如下：\n\n#### 示例列表 2-15：调用 FixedDepositDaoFactory\
  \ 的 getFixedDepositDao 方法并设置返回的 FixedDepositJdbcDao 实例的 databaseInfo 属性的配置\n\n```xml\n\
  <bean id=\"daoFactory\" class=\"FixedDepositDaoFactory\" />\n<bean id=\"dao\" factory-bean=\"\
  daoFactory\" factory-method=\"getFixedDepositDao\">\n    <constructor-arg index=\"\
  0\" value=\"jdbc\"/>\n    <property name=\"databaseInfo\" ref=\"databaseInfo\"/>\n\
  </bean>\n<bean id=\"databaseInfo\" class=\"DatabaseInfo\" />\n```\n\n上面的 bean 定义显示`<property>`\
  \ 元素被用于设置 `getFixedDepositDao` `instance` 工厂方法返回的 `FixedDepositJdbcDao` 实例的 `databaseInfo`\
  \ 属性。与 `instance` 工厂方法一样，你可以使用`<property>` 元素向 `static` 工厂方法返回的 bean 注入依赖。\n\n现在让我们来看看如何通过构造参数注入\
  \ bean 依赖。\n\n### 基于构造函数的 DI\n\n在基于构造函数的 DI 中，bean 的依赖作为参数传递给 类的构造函数。例如，下面的示例列表显示了\
  \ `PersonalBankingService` 类，其构造函数接受 `JmsMessageSender`、`EmailMessageSender` 和 `WebServiceInvoker`\
  \ 对象：\n\n### 示例列表 2-16：PersonalBankingService 类\n\n```java\npublic class PersonalBankingService\
  \ {\n  private JmsMessageSender jmsMessageSender;\n  private EmailMessageSender\
  \ emailMessageSender;\n  private WebServiceInvoker webServiceInvoker;\n    .....\n\
  \n  public PersonalBankingService(JmsMessageSender jmsMessageSender,\n      EmailMessageSender\
  \ emailMessageSender,\n      WebServiceInvoker webServiceInvoker) {\n        this.jmsMessageSender\
  \ = jmsMessageSender;\n        this.emailMessageSender = emailMessageSender;\n \
  \       this.webServiceInvoker = webServiceInvoker;\n  }\n    .....\n}\n```\n\n\
  `PersonalBankingService` 构造函数的参数代表 `PersonalBankingService` 类的依赖。下面的示例列表显示了如何通过\
  \ `<constructor-arg>` 元素提供 `PersonalBankingService` 实例的依赖：\n\n### 示例列表 2-17：PersonalBankingService\
  \ bean 定义\n\n```xml\n<bean id=\"personalBankingService\" class=\"PersonalBankingService\"\
  >\n    <constructor-arg index=\"0\" ref=\"jmsMessageSender\"/>\n    <constructor-arg\
  \ index=\"1\" ref=\"emailMessageSender\"/>\n    <constructor-arg index=\"2\" ref=\"\
  webServiceInvoker\"/>\n</bean>\n<bean id=\"jmsMessageSender\" class=\"JmsMessageSender\"\
  >\n    .....\n</bean>\n<bean id=\"webServiceInvoker\" class=\"WebServiceInvoker\"\
  >\n    .....\n</bean>\n<bean id=\"emailMessageSender\" class=\"EmailMessageSender\"\
  \ />\n    .....\n</bean>\n```\n\n\n\n\n\n在上面的示例列表中，`<constructor-arg>` 元素指定了传递给\
  \ `PersonalBankingService` 实例的构造参数详情。`index` 属性指定构造函数参数的索引。如果 `index` 属性的值为 `0`，则意味着\
  \ `<constructor-arg>` 元素对应第一个构造函数参数；如果 `index` 属性值为 `1`，则意味着 `<constructor-arg>`\
  \ 元素对应第二个构造函数参数，依此类推。我们之前看到过 `<property>` 元素的 `ref` 属性用于传递 bean 的引用。同样，`<constructor-arg>`\
  \ 元素的 `ref` 属性也用于传递 bean 的引用。类似于 `<property>` 元素，`<constructor-arg>` 元素也用于传递 bean\
  \ 所需的`configuration information`（如果有）。\n\n你应该注意，`<constructor-arg>` 元素也用于向创建 bean\
  \ 实例的 `static` 和 `instance` 工厂方法传递参数（参见第 2-3 节）。\n\n**注意** 与其使用 `<property>` 和 `<constructor-arg>`\
  \ 元素的 `ref` 属性，你可以在 `<property>` 和 `<constructor-arg>` 元素内部使用 `<ref>` 元素来设置对 bean\
  \ 的引用。优先使用 `ref` 属性，因为它让 XML 更加简洁。\n\n下面的示例显示了 `EmailMessageSender` 类以及对应的 bean\
  \ 定义，演示了如何使用 `<constructor-arg>` 元素为 `String` 类型构造函数参数提供值：\n\n**示例列表 2-18** `EmailMessageSender`\
  \ 类及对应的 bean 定义\n\n```java\npublic class EmailMessageSender {\n\n  private String\
  \ host;\n  private String username;\n  private String password;\n\n    .....\n\n\
  \    public EmailMessageSender(String host, String username, String password) {\n\
  \        this.host = host;\n        this.username = username;\n        this.password\
  \ = password;\n    }\n\n    .....\n}\n```\n\n```xml\n<bean id=\"emailMessageSender\"\
  \ class=\"EmailMessageSender\">\n    <constructor-arg index=\"0\" value=\"smtp.gmail.com\"\
  />\n    <constructor-arg index=\"1\" value=\"myusername\"/>\n    <constructor-arg\
  \ index=\"2\" value=\"mypassword\"/>\n</bean>\n```\n\n到目前为止，我们已经看到 `<constructor-arg>`\
  \ 元素用于注入 bean 依赖并为 `String` 类型构造函数参数传递值。在第 3 章中，我们将看到如何使用 `<constructor-arg>` 元素来设置基本类型（如\
  \ `int`、`long` 等）、集合类型（如 `java.util.List`、`java.util.Map` 等）以及自定义类型（如 `Address`）属性。\n\
  \n现在让我们来看如何将基于构造函数的 DI（依赖注入）与基于 setter 的 DI 结合使用。\n\n### 使用混合基于构造和 setter 的 DI 机制\n\
  \n如果一个 bean 类同时需要基于构造函数和 setter 的 DI 机制，你可以结合 `<constructor-arg>` 和 `<property>`\
  \ 元素来注入依赖。\n\n下面的示例列表显示了一个 bean 类，其依赖作为构造方法和 setter 方法的参数被注入：\n\n**示例列表 2-19** –\
  \ `PersonalBankingService` 类\n\n```java\npublic class PersonalBankingService {\n\
  \n   private JmsMessageSender jmsMessageSender;\n   private EmailMessageSender emailMessageSender;\n\
  \   private WebServiceInvoker webServiceInvoker;\n\n   .....\n\n  public PersonalBankingService(JmsMessageSender\
  \ jmsMessageSender,\n               EmailMessageSender emailMessageSender) {\n \
  \       this.jmsMessageSender = jmsMessageSender;\n        this.emailMessageSender\
  \ = emailMessageSender;\n    }\n\n  public void setWebServiceInvoker(WebServiceInvoker\
  \ webServiceInvoker) {\n        this.webServiceInvoker = webServiceInvoker;\n  \
  \  }\n\n    .....\n}\n```\n\n在 `PersonalBankingService` 类中，`jmsMessageSender` 和\
  \ `emailMessageSender` 依赖作为构造函数参数注入，而 `webServiceInvoker` 依赖通过 `setWebServiceInvoker`\
  \ setter 方法注入。下面的 bean 定义显示，同时使用了 `<constructor-arg>` 和 `<property>` 元素来注入 `PersonalBankingService`\
  \ 类的依赖：\n\n**示例列表 2-20** – 混合基于构造和 setter 的 DI 机制\n\n```xml\n<bean id=\"dataSource\"\
  \ class=\"PersonalBankingService\">\n    <constructor-arg index=\"0\" ref=\"jmsMessageSender\"\
  \ />\n    <constructor-arg index=\"1\" ref=\"emailMessageSender\" />\n    <property\
  \ name=\"webServiceInvoker\" ref=\"webServiceInvoker\" />\n</bean>\n```\n\n现在，我们已经了解了如何指示\
  \ Spring 容器创建 bean 并执行 DI，让我们来看你可以指定的不同 `scopes`（作用域）。\n\n## Bean 范围\n\n你可能希望指定\
  \ bean 的作用域以控制创建一个共享实例（单例），还是在每次请求 bean 时创建一个新的 bean 实例（原型）。bean 的作用域由 `<bean>`\
  \ 元素的 `scope` 属性定义。**注意** 在 Web 应用中，Spring 允许你指定额外的作用域：`request`、`session` 和 `global`。如果未指定\
  \ `scope` 属性或 `scope` 属性的值为 `singleton`，则意味着该 bean 是单例范围的。\n\n### Singleton (单例)\n\
  \n单例范围是应用上下文中所有 bean 的默认范围。单例范围 bean 的实例在 Spring 容器创建时创建，在 Spring 容器销毁时销毁。Spring\
  \ 容器创建一个被所有依赖它的 bean 共享的单一实例。\n\n下面的示例列表显示了一个项目的 `applicationContext.xml` 文件，其中所有\
  \ bean 都是单例范围：\n\n**示例列表 2-21** `applicationContext.xml` - 单例范围 bean\n\n**项目** –\
  \ `ch02-bankapp-scopes`\n**源位置** - `src/main/resources/META-INF/spring`\n\n```xml\n\
  <beans>\n    <bean id=\"controller\" class=\"sample.spring.chapter02.bankapp.controller.FixedDepositControllerImpl\"\
  >\n        <property name=\"fixedDepositService\" ref=\"service\" />\n    </bean>\n\
  \n    <bean id=\"service\" class=\"sample.spring.chapter02.bankapp.service.FixedDepositServiceImpl\"\
  >\n        <property name=\"fixedDepositDao\" ref=\"dao\" />\n    </bean>\n\n  \
  \  <bean id=\"dao\" class=\"sample.spring.chapter02.bankapp.dao.FixedDepositDaoImpl\"\
  \ />\n\n    .....\n</beans>\n```\n\n在上面的 `applicationContext.xml` 文件中，由于 `<bean>`\
  \ 元素没有指定属性，`controller`、`service` 和 `dao` bean 是单例范围的。这意味着 Spring 容器只创建了 `FixedDepositControllerImpl`、`FixedDepositServiceImpl`\
  \ 和 `FixedDepositDaoImpl` 类的一个实例。由于这些 bean 是单例范围，每次当我们使用 `ApplicationContext` 的\
  \ `getBean` 方法获取这些 bean 时，Spring 容器都会返回同一个 bean 实例。\n\n**注意** 如果未指定 `scope` 属性或\
  \ `scope` 属性的值为 `singleton`，则意味着该 bean 是单例范围的。\n\n下面的示例列表显示了 `ch02-bankapp-scopes`\
  \ 项目中 `SingletonTest`（一个 JUnit 测试类）类的 `testInstances` 方法。`testInstances` 方法测试了多次调用\
  \ `ApplicationContext` 的 `getBean` 方法返回的是 controller bean 的相同实例还是不同实例：\n\n**示例列表\
  \ 2-22** `SingletonTest` JUnit 测试类\n\n**项目** – `ch02-bankapp-scopes`\n\n\n\n\n\n\
  # 源位置 - /src/test/java/sample/spring/chapter02/bankapp\n\n```java\npackage sample.spring.chapter02.bankapp;\n\
  \nimport static org.junit.Assert.assertSame;\nimport org.junit.BeforeClass;\nimport\
  \ org.junit.Test;\nimport sample.spring.chapter02.bankapp.controller.FixedDepositController;\n\
  \npublic class SingletonTest {\n    private static ApplicationContext context;\n\
  \n    @BeforeClass\n    public static void init() {\n        context = new ClassPathXmlApplicationContext(\n\
  \                \"classpath:META-INF/spring/applicationContext.xml\");\n    }\n\
  \n    @Test\n    public void testInstances() {\n        FixedDepositController controller1\
  \ = (FixedDepositController) context.getBean(\"controller\");\n        FixedDepositController\
  \ controller2 = (FixedDepositController) context.getBean(\"controller\");\n    \
  \    assertSame(\"Different FixedDepositController instances\", controller1, controller2);\n\
  \    }\n\n    .....\n}\n```\n\n在上面的示例列表中，JUnit 的 `@BeforeClass` 注解指定了 `init` 方法会在类中的任何测试方法（即标记了\
  \ JUnit 的 `@Test` 注解的方法）之前被调用。这意味着标记了 `@BeforeClass` 注解的方法只执行*一次*，而标记了 `@Test` 注解的方法只在标记了\
  \ `@BeforeClass` 注解的方法执行后执行。请注意 `init` 方法是一个*静态*方法。`init` 方法通过将配置元数据（如列表 2-21 所示）传递给\
  \ `ClassPathXmlApplicationContext` 的构造函数来创建 `ApplicationContext` 对象的实例。`testInstances`\
  \ 方法获取 2 个 controller bean 实例，并使用 JUnit 的 `assertSame` 断言检查这两个实例是否相同。由于 controller\
  \ bean 是单例作用域（singleton-scoped）的，因此 `controller1` 和 `controller2` bean 实例是相同的。由于这个原因，`SingletonTest`\
  \ 的 `testInstances` 测试在执行时没有出现任何断言错误。\n\n接下来的图显示，当你多次调用 `ApplicationContext` 的 `getBean`\
  \ 方法时，Spring 容器会返回同一个 controller bean 实例：\n\n![](img/00011.jpeg)\n\n**图 2-4** 对单例作用域\
  \ bean 的多次请求会导致 Spring 容器返回相同的 bean 实例\n\n上面的图显示多次调用获取 controller bean 返回的是 controller\
  \ bean 的*同一个*实例。\n\n**注意** 在图 2-4 中，controller bean 实例由一个双单元格矩形表示。顶部单元格显示 bean 的*名称*（即\
  \ `<bean>` 元素的 `id` 属性的值），下部单元格显示 bean 的*类型*（即 `<bean>` 元素的 `class` 属性的值）。在本书的其余部分，我们将使用这种约定来显示\
  \ Spring 容器内部的 bean 实例。\n\n单例作用域的 bean 实例被依赖它的 bean 共享。接下来的示例列表显示 `SingletonTest`\
  \ JUnit 测试类的 `testReference` 方法，该方法检查引用的 `FixedDepositDao` 实例是否一致。\n\n**示例 2-23**\
  \ `testReference` 方法的 `SingletonTest` JUnit 测试类\n\n**项目 - ch02-bankapp**（作用域）\n\n\
  **源位置 - /src/test/java/sample/spring/chapter02/bankapp**\n\n```java\npackage sample.spring.chapter02.bankapp;\n\
  \nimport static org.junit.Assert.assertSame;\nimport org.junit.Test;\n\npublic class\
  \ SingletonTest {\n    private static ApplicationContext context;\n\n    .....\n\
  \n    @Test\n    public void testReference() {\n        FixedDepositController controller\
  \ = (FixedDepositController) context.getBean(\"controller\");\n        FixedDepositDao\
  \ fixedDeposit1 = controller.getFixedDepositDao();\n        FixedDepositDao fixedDeposit2\
  \ = (FixedDepositDao) context.getBean(\"dao\");\n        assertSame(\"FixedDeposit\
  \ instances\", fixedDeposit1, fixedDeposit2);\n    }\n}\n```\n\n在上面的示例列表中，`testReference`\
  \ 方法首先通过 `ApplicationContext` 的 `getBean` 方法获取 `FixedDepositDao` 实例（引用列表中的 `fixedDeposit1`\
  \ 变量），然后直接获取另一个 `FixedDepositDao` bean（引用列表中的 `fixedDeposit2` 变量）。如果你执行 `testReference`，你会看到\
  \ `fixedDeposit1` 和 `fixedDeposit2` 是相同的。\n\n![](img/00012.jpeg)\n**图 2-5** 单例作用域\
  \ bean 被共享\n\n上面的图显示被 `FixedDepositController` 实例引用的 `FixedDepositDao` 实例是同一个。单例作用域\
  \ bean 的范围受限于 Spring 容器。这意味着如果你创建 2 个 Spring 容器实例，每个容器都有自己的实例。\n\n接下来的示例列表显示 `SingletonTest`\
  \ 类的 `testSingletonScope` 方法，它测试了从两个 Spring 实例获取的 controller bean 是否不同：\n\n**示例\
  \ 2-24** - `testSingletonScope` 方法\n\n**项目 - ch02-bankapp-scopes**\n\n```java\n\
  package sample.spring.chapter02.bankapp;\n\nimport static org.junit.Assert.assertNotSame;\n\
  import org.junit.Test;\n\npublic class SingletonTest {\n    private static ApplicationContext\
  \ context;\n\n    @BeforeClass\n    public static void init() {\n        context\
  \ = new ClassPathXmlApplicationContext(\n                \"classpath:META-INF/spring/applicationContext.xml\"\
  );\n    }\n\n    @Test\n    public void testSingletonScope() {\n        ApplicationContext\
  \ anotherContext = new ClassPathXmlApplicationContext(\n                \"classpath:META-INF/spring/applicationContext.xml\"\
  );\n        FixedDepositController controller1 = (FixedDepositController) anotherContext.getBean(\"\
  controller\");\n        FixedDepositController controller2 = (FixedDepositController)\
  \ context.getBean(\"controller\");\n        assertNotSame(\"Same FixedDepositController\
  \ instances\", controller1, controller2);\n    }\n}\n```\n\n在上面的示例列表中，`testSingletonScope`\
  \ 方法首先从 `anotherContext` 获取 `FixedDepositController` 实例（引用 `controller1` 变量），然后直接从\
  \ `context` 使用 `getBean` 方法获取另一个 `FixedDepositController` bean（引用 `controller2`\
  \ 变量）。如果你执行 `testSingletonScope` 测试，你会发现测试成功完成，因为 `controller1` 和 `controller2`\
  \ 是不同的。\n\n接下来的图描绘了 `testSingletonScope` 方法展示的行为：\n\n![](img/00013.jpeg)\n\n\n\n\
  \n\n## 图 2-6 每个 Spring 容器都会创建自己的单例作用域 bean 实例\n\n上面的图显示，每个 Spring 容器都会创建它们自己的 controller\
  \ bean 实例。这就是为什么当你调用 `getBean(\"controller\")` 方法时，`context` 和 `anotherContext`\
  \ 实例返回不同的 controller bean 实例的原因。\n\n`testSingletonScope` 方法显示每个 Spring 容器都会创建它们自己的单例作用域\
  \ bean 实例。需要注意的是，Spring 容器会为*每个* bean 定义创建一个单例作用域 bean 实例。下面的示例列表显示了 `FixedDepositDaoImpl`\
  \ 类的多个 bean 定义：\n\n### 示例列表 2-25 – `applicationContext.xml` - 同一个类的多个 bean 定义\n\n\
  **Project** – `ch02-bankapp-scopes`  \n**源位置**- `src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"dao\" class=\"sample.spring.chapter02.bankapp.dao.FixedDepositDaoImpl\"\
  \ />\n<bean id=\"anotherDao\" class=\"sample.spring.chapter02.bankapp.dao.FixedDepositDaoImpl\"\
  \ />\n```\n\n上述示例列表中所示 bean 定义是针对 `FixedDepositDaoImpl` 类的。由于*没有*指定 `scope` 属性，上述示例列表中所示\
  \ bean 定义代表单例作用域 bean。即使为一个类定义了多个 bean 定义，Spring 容器也会为每个 bean 定义创建一个相应的 bean 实例。这意味着\
  \ Spring 容器为对应 `dao` 和 `anotherDao` bean 定义创建了不同的 `FixedDepositDaoImpl` 类实例。下面的示例列表显示了\
  \ `SingletonScope` 的 `testSingletonScopePerBeanDef` 方法，该方法测试了对应 `dao` 和 `anotherDao`\
  \ bean 定义的 `FixedDepositDaoImpl` 实例是相同还是不同：\n\n### 示例列表 2-26 – `SingletonTest` JUnit\
  \ 测试类的 `testSingletonScopePerBeanDef` 方法\n\n**Project** – `ch02-bankapp-scopes`\
  \  \n**源位置**- `src/test/java/sample/spring/chapter02/bankapp`\n\n```java\npackage\
  \ sample.spring.chapter02.bankapp;\n\nimport static org.junit.Assert.assertNotSame;\n\
  \npublic class SingletonTest {\n    private static ApplicationContext context;\n\
  \    .....\n\n    @Test\n    public void testSingletonScopePerBeanDef() {\n    \
  \    FixedDepositDao fixedDepositDao1 = (FixedDepositDao) context.getBean(\"dao\"\
  );\n        FixedDepositDao fixedDepositDao2 = (FixedDepositDao) context.getBean(\"\
  anotherDao\");\n        assertNotSame(\"Same FixedDepositDao instances\", fixedDepositDao1,\
  \ fixedDepositDao2);\n    }\n}\n```\n\n在上述示例列表中，`fixedDepositDao1` 和 `fixedDepositDao2`\
  \ 变量分别代表 Spring 容器对应 `dao` 和 `anotherDao` bean 定义创建的 `FixedDepositDaoImpl` 类实例。如果你执行\
  \ `testSingleScopePerBeanDef` 测试，它将在不出现任何断言错误的情况下执行，因为 `fixedDepositDao1` 实例（对应\
  \ `dao` bean 定义）和 `fixedDepositDao2` 实例（对应 `anotherDao` bean 定义）是不同的。\n\n接下来的图总结了单例作用域\
  \ bean 是*按每个 bean 定义*创建的：\n\n![](img/00014.jpeg)\n\n## 图 2-7 每个 bean 定义对应一个单例作用域\
  \ bean 实例\n\n上面的图显示，Spring 容器中*每个 bean 定义*都存在一个单例作用域 bean 实例。\n\n我们之前提到过，单例作用域 bean\
  \ 默认是*预实例化*的，这意味着当你创建一个 Spring 容器的实例时，就会创建一个单例作用域 bean 的实例。现在让我们来看看如何*懒性*（lazily）初始化一个单例作用域\
  \ bean。\n\n### 懒性初始化单例作用域 bean\n\n你可以指示 Spring 容器仅在*第一次*请求单例作用域 bean 时才创建该 bean\
  \ 作用的实例。下面的 `lazyExample` bean 定义显示了如何指示 Spring 容器懒性初始化 `lazyBean` bean：\n\n###\
  \ 示例列表 2-27 – 懒性初始化单例作用域 bean\n\n```xml\n<bean id=\"lazyBean\" class=\"example.LazyBean\"\
  \ lazy-init=\"true\"/>\n```\n\n`<bean>` 元素的 `lazy-init` 属性指定了 bean 实例是懒性创建还是积极创建。如果值为\
  \ true（如上述所示的 bean 定义），Spring 容器将在*第一次*接收到对该 bean 的请求时初始化 bean 实例。\n\n接下来的序列图显示了\
  \ `lazy-init` 属性如何影响单例作用域 bean 实例的创建：\n\n![](img/00015.jpeg)\n\n## 图 2-8 懒性初始化的单例作用域\
  \ bean 实例在应用程序第一次请求时被创建\n\n在上面的图中，`BeanA` 代表一个*没有*设置为懒性初始化的单例作用域 bean 实例，而 `LazyBean`\
  \ 代表一个被设置为懒性初始化的单例作用域 bean。当 Spring 容器实例被创建时，`BeanA` 也被实例化，因为它*没有*被设置为懒性初始化。另一方面，当\
  \ `ApplicationContext` 的 `getBean` 方法第一次被调用以从 Spring 容器中检索 `LazyBean` 实例时，`LazyBean`\
  \ 才被实例化。\n\n**注意** 你可以使用 `<beans>` 元素的 `default-lazy-init` 属性来指定 bean 的默认初始化策略。如果\
  \ `<bean>` 元素的 `lazy-init` 属性指定的值与 `<beans>` 元素的 `default-lazy-init` 不同，则以 `lazy-init`\
  \ 为准。\n\n由于单例作用域 bean 可以懒性初始化也可以预实例化，你此时可能在考虑是否应该将单例作用域 bean 定义为懒性初始化。在大多数应用场景中，预实例化单例作用域\
  \ bean 是有利的。下面的示例列表显示了一个设置为懒性初始化的 aBean 单例作用域 bean，它依赖于 `bBean` bean：\n\n### 示例列表\
  \ 2-28 – 懒性初始化的单例作用域 bean\n\n```java\npublic class ABean {\n    private BBean bBean;\n\
  \    public void setBBean(BBean bBean) {\n        this.bBean = bBean;\n    }\n \
  \   .....\n}\n\n<bean id=\"aBean\" class=\"ABean\" lazy-init=\"true\">\n    <property\
  \ name=\"bBean\" value=\"bBean\" />\n</bean>\n\n<bean id=\"bBean\" class=\"BBean\"\
  \ />\n```\n\n在上述示例列表中，`ABean` 的 `bBean` 属性引用了 bean bean。注意这里没有使用 `ref` 属性，而是使用了\
  \ `<property>` 元素的 `value` 属性来设置 `ABean` 的 `bBean` 属性。如果你通过传递上述 bean 定义的文件创建 `ApplicationContext`\
  \ 实例，将不会报告任何错误。但是，当你通过调用 `ApplicationContext` 的 `getBean` 方法尝试获取 `aBean` bean 时，你会得到以下错误消息：\n\
  \nCaused by: java.lang.IllegalStateException: Cannot convert value of type [java.lang.String]\
  \ to required type [BBean] for property 'bBean'\n\n显示上述错误消息是因为 Spring 容器无法将 `ABean`\
  \ 的 `bBean` 属性的字符串值转换为 `BBean` 类型。这突出了一个简单的配置问题，即没有指定 `<bean>` 元素的 `ref` 属性，而是指定了\
  \ `value` 属性。\n\n### 原型\n\n原型作用域 bean 与单例作用域 bean 的区别在于，Spring 容器总是返回一个*新的*原型作用域\
  \ bean 实例。原型作用域 bean 的另一个显著特征是它们*总是*是懒性初始化的。\n\n\n\n\n\n`ch02-bankapp-scopes` 项目中\
  \ `applicationContext.xml` 文件中的以下 `FixedDepositDetails` bean 代表了一个原型作用（prototype-scoped）的\
  \ bean：\n\n示例 2-29 – `applicationContext.xml` - 原型作用 bean 示例\n\n**项目** – `ch02-bankapp-scopes`\n\
  **源码位置** - `src/main/resources/META-INF/spring`\n\n```xml\n<bean id=\"FixedDepositDetails\"\
  \n      class=\"sample.spring.chapter02.bankapp.domain.FixedDepositDetails\"\n \
  \     scope=\"prototype\" />\n```\n\n上面的示例显示 `<bean>` 元素的 `scope` 属性值被设置为 `prototype`。这意味着\
  \ `FixedDepositDetails` bean 是一个原型作用的 bean。\n\n`PrototypeTest` JUnit 测试类中的 `testInstances`\
  \ 方法显示，从 Spring 容器中获取的 2 个 `FixedDepositDetails` bean 实例是不同的：\n\n示例 2-30 – `PrototypeTest`\
  \ JUnit 测试类的 `testInstances` 方法\n\n**项目** – `ch02-bankapp-scopes`\n**源码位置** - `src/test/java/sample/spring/chapter02/bankapp`\n\
  \n```java\npackage sample.spring.chapter02.bankapp;\n\nimport static org.junit.Assert.assertNotSame;\n\
  \npublic class PrototypeTest {\n    private static ApplicationContext context;\n\
  \n    .....\n\n    @Test\n    public void testInstances() {\n        FixedDepositDetails\
  \ fixedDepositDetails1 =\n                (FixedDepositDetails)context.getBean(\"\
  fixedDepositDetails\");\n        FixedDepositDetails fixedDepositDetails2 =\n  \
  \              (FixedDepositDetails) context.getBean(\"fixedDepositDetails\");\n\
  \n        assertNotSame(\"Same FixedDepositDetails instances\",\n              \
  \  fixedDepositDetails1, fixedDepositDetails2);\n    }\n}\n```\n\n如果你执行 `testInstances`\
  \ 测试，它将在没有任何断言错误的情况下完成，因为从 `ApplicationContext` 获取的 2 个 `FixedDepositDetails` 实例（`fixedDepositDetails1`\
  \ 和 `fixedDepositDetails2`）是不同的。\n\n现在让我们如何为 bean 选择合适的作用域（单例或原型）。\n\n### 为你的 bean\
  \ 选择正确的作用域\n\n如果一个 bean 不维护任何会话状态（即它本质上是无状态的），则应该应该定义为单例作用（singleton-scoped）bean。如果一个\
  \ bean 维护会话状态，则应该定义为原型作用 bean。`MyBank` 应用中的 `FixedDepositServiceImpl`、`FixedDepositDaoImpl`\
  \ 和 `FixedDepositControllerImpl` bean 本质上是无状态的；因此，它们被定义为单例作用 bean。`MyBank` 应用中的\
  \ `FixedDepositDetails` bean（一个领域对象）维护会话状态；因此，它被定义为原型作用 bean。\n\n**注意** 如果你在应用程序中使用\
  \ ORM 框架（如 Hibernate 或 iBATIS），领域对象是由 ORM 框架创建的，或者你通过 `new` 运算符程序化地创建它们。正因为如此，如果应用程序使用\
  \ ORM 框架，领域对象就不会在应用上下文文件中定义。\n\n## 2-6 总结\n\n在本章中，我们讨论了 Spring Framework 的一些基础知识。我们看了“面向接口编程”的设计、创建\
  \ bean 实例的不同方法、基于构造函数的 DI 以及 bean 作用域。在下一章中，我们将查看如何设置不同类型（如 `int`、`long`、`Set` 等）的\
  \ bean 属性和构造函数参数。\n\n# 第 3 章：配置 beans\n\n## 3-1 引言\n\n在之前的章节中，我们接触了 Spring 的一些基本概念。我们看到了如何在应用上下文文件中指定\
  \ Spring bean 及其依赖关系。我们还看了单例作用和原型作用的 bean，并讨论了将这些作用域分配给 bean 的影响。\n\n在本章中，我们将：\n\
  - bean 继承\n- bean 构造函数的参数是如何解析的\n- 如何配置基本类型（如 `int`、`float` 等）、集合类型（如 `java.util.List`、`java.util.Map`\
  \ 等）、自定义类型（如 `Address` 等）的 bean 属性和构造函数参数\n- 如何通过 `p-namespace` 和 `c-namespace`\
  \ 分别指定 bean 属性和构造函数参数，使应用上下文文件更加简洁\n- Spring 的 `FactoryBean` 接口，允许你编写自己的工厂类来创建 bean\
  \ 实例\n\n## 3-2 Bean 定义继承\n\n我们在第 1 章和第 2 章中看到，应用上下文文件中的 bean 定义指定了 类的全限定名及其依赖关系。在某些情况下，为了使\
  \ bean 定义更简洁，你可能希望一个 bean 定义继承另一个 bean 定义的配置。让我们来看 `MyBank` 应用中的这样一个场景。\n\n**导入**\
  \ `chapter 3/ch03-bankapp-inheritance`（该项目显示 `MyBank` 应用使用了 bean 定义继承。要运行应用程序，请执行该项目\
  \ `BankApp` 类的 `main` 方法）\n\n### MyBank – Bean 定义示例\n\n在上一章中，我们看到 `MyBank` 应用通过\
  \ `DAOs` 访问数据库。假设 `MyBank` 应用定义了一个 `DatabaseOperations` 类来简化与数据库的交互。因此，`MyBank`\
  \ 应用中所有的 `DAOs` 都依赖 `DatabaseOperations` 类来执行数据库操作，如图所示：\n\n![](img/0016.jpeg)\n\
  \n**图 3-1** - `MyBank` 应用中的 DAO 类使用 `DatabaseOperations` 类进行数据库交互\n\n上面的图片显示 `FixedDepositDao`\
  \ 和 `PersonalBankingDao` 类依赖于 `DatabaseOperations` 类。下面的应用上下文文件显示了这些类的 bean 定义：\n\
  \n示例 3-1 – DAO bean 依赖 `DatabaseOperations` bean\n\n```xml\n<bean id=\"databaseOperations\"\
  \n      class=\"sample.spring.chapter01.bankapp.utils.DatabaseOperations\" />\n\
  <bean id=\"personalBankingDao\"\n      class=\"sample.spring.chapter01.bankapp.dao.PersonalBankingDaoImpl\"\
  >\n    <property name=\"databaseOperations\" ref=\"databaseOperations\" />\n</bean>\n\
  <bean id=\"FixedDepositDao\"\n      class=\"sample.spring.chapter01.bankapp.dao.FixedDepositDaoImpl\"\
  >\n    <property name=\"databaseOperations\" ref=\"databaseOperations\" />\n</bean>\n\
  ```\n\n`personalBankingDao` 和 `FixedDepositDao` 的定义都使用 `<property>` 元素执行 `DatabaseOperations`\
  \ 实例依赖注入。由于两个 bean 定义中引用 `DatabaseOperations` 实例的属性名称都是 `databaseOperations`，这意味着\
  \ `PersonalBankingDaoImpl` 和 `FixedDepositDaoImpl` 类都定义了 `setDatabaseOperations`\
  \ 方法。\n\n如果应用程序中的多个 bean 共享一组配置（属性、构造函数参数等），你可以创建一个作为父类的 bean 定义。在 `personalBankingDao`\
  \ 和 `fixedDepositDao` 的定义中，公共配置是 `databaseOperations` 属性。接下来的示例显示 `personalBankingDao`\
  \ 和 `fixedDepositDao` 的定义使用了 bean 定义继承：\n\n示例 3-2 – `applicationContext.xml` - `MyBank`\
  \ 的应用上下文 XML 文件\n\n**项目** – `ch03-bankapp-inheritance`\n**源码位置** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"databaseOperations\"\n      class=\"sample.spring.chapter03.bankapp.utils.DatabaseOperations\"\
  \ />\n<bean id=\"daoTemplate\" abstract=\"true\">\n    <property name=\"databaseOperations\"\
  \ ref=\"databaseOperations\" />\n</bean>\n<bean id=\"FixedDepositDao\" parent=\"\
  daoTemplate\"\n      class=\"sample.spring.chapter03.bankapp.dao.FixedDepositDaoImpl\"\
  \ />\n<bean id=\"personalBankingDao\" parent=\"daoTemplate\"\n      class=\"sample.spring.chapter03.bankapp.dao.PersonalBankingDaoImpl\"\
  \ />\n```\n\n\n\n\n\n在上面的示例列表中，`daoTemplate` bean 定义定义了由 `fixedDepositDao` 和 `personalBankingDao`\
  \ bean 定义共享的通用配置。由于 `fixedDepositDao` 和 `personalBankingDao` bean 定义都需要 `databaseOperations`\
  \ 依赖（参见示例列表 3-1），`daoTemplate` bean 定义使用 `<property>` 元素定义了 `databaseOperations`\
  \ 依赖。`<bean>` 元素的 `parent` 属性指定了用于继承配置的 bean 定义的名称。由于 `fixedDepositDao` 和 `personalBankingDao`\
  \ bean 定义的 `parent` 属性值为 `daoTemplate`，它们从 `daoTemplate` bean 定义中继承了 `databaseOperations`\
  \ 属性。示例列表 3-1 和 3-2 是相同的，区别在于示例列表 3-2 使用了 bean 定义继承。\n\n如果 `<bean>` 元素的 `abstract`\
  \ 属性值被设置为 `true`，则意味着该 bean 定义是 `abstract`（抽象的）。需要注意的是，Spring 容器`doesn’t`尝试创建一个与\
  \ `abstract` bean 定义对应的 bean。重要的是，你不能定义一个依赖于 `abstract` bean 的 bean，即你不能使用 `<property>`\
  \ 或 `<constructor-arg>` 元素引用一个 `abstract` bean。\n\n在示例列表 3-2 中，`daoTemplate` bean\
  \ 定义是 `abstract` 的。你可能注意到 `daoTemplate` bean 定义没有指定 `class` 属性。如果父 bean 定义没有指定 `class`\
  \ 属性，则子 bean 定义（如 `fixedDepositDao` 和 `personalBankingDao`）会指定 `class` 属性。要注意，如果你没有指定\
  \ `class` 属性，则必须将父 bean 定义为 `abstract`，这样 Spring 容器就不会尝试创建一个与之对应的 bean 实例。\n\n要验证\
  \ `fixedDepositDao` 和 `personalBankingDao` bean 定义是否继承了 `daoTemplate` bean 定义的 `databaseOperations`\
  \ 属性，请执行 `ch03-bankapp-inheritance` 项目中 `BankApp` 类的 `main` 方法。`BankApp` 的 `main`\
  \ 方法调用了 `fixedDepositDao` 和 `personalBankingDao` bean 方法；这些 bean 反过来调用 `DatabaseOperations`\
  \ 实例的方法。如果 `DatabaseOperations` 实例`not`注入到 `fixedDepositDao` 和 `personalBankingDao`\
  \ bean 中，将抛出 `java.lang.NullPointerException`。\n\n接下来的图总结了在 `FixedDepositDao` 和\
  \ `personalBankingDao` bean 定义情况下 bean 定义的工作原理：\n\n![](img/00017.jpeg)\n\n**图 3-2**\
  \ – MyBank 应用中的 bean 定义继承\n\n上面的图显示 `fixedDepositDao` 和 `personalBankingDao` bean\
  \ 定义继承了来自 `daoTemplate` bean 定义的 `databaseOperations` 属性（在标记为 `fixedDepositDao`\
  \ 和 `personalBankingDao` 的框中以*斜体*显示）。上面的图还描述了 Spring 容器并没有尝试创建一个与 `daoTemplate`\
  \ bean 定义对应的 bean 实例，因为它被标记为 `abstract`。\n\n现在让我们看看从父 bean 定义继承了哪些配置信息。\n\n### 继承了什么？\n\
  \n子 bean 定义从父 bean 定义继承以下配置信息：\n\n- 属性 – 通过 `<property>` 元素指定\n- 构造器参数 – 通过 `<constructor-arg>`\
  \ 元素指定\n- 方法覆盖（在第 4 章第 4-5 节讨论）\n- 初始化和销毁方法（在第 5 章中讨论），以及\n- 工厂方法 – 通过 `<bean>`\
  \ 元素的 `factory-method` 属性指定（参见第 2 章第 2-3 节了解如何使用 `static` 和 `instance` 工厂方法创建 bean）\n\
  \n**IMPORT** **chapter 3/ch03-bankapp-inheritance-example**（此项目展示了使用 bean 定义继承的\
  \ MyBank 应用。在该项目中，你将看到 bean 定义继承的多种场景。要运行应用程序，请执行该项目中 `BankApp` 类的 `main` 方法）\n\n\
  现在让我们来看一些 bean 定义继承的示例。\n\n### Bean 定义继承示例 – 父 bean 定义*不是*抽象的\n\n下面的示例列表展示了一个 bean\
  \ 继承示例，其中父 bean 定义`not`抽象的，且子 bean 定义定义了额外的依赖：\n\n**示例列表 3-3** – `applicationContext.xml`\
  \ - Bean 定义继承 – 父 bean 定义*不是*抽象\n\n**Project** – `ch03-bankapp-inheritance-examples`\n\
  \n**Source location** - `src/main/resources/META-INF/spring`\n\n```xml\n<bean id=\"\
  serviceTemplate\" class=\"sample.spring.chapter03.bankapp.base.ServiceTemplate\"\
  >\n    <property name=\"jmsMessageSender\" ref=\"jmsMessageSender\" />\n    <property\
  \ name=\"emailMessageSender\" ref=\"emailMessageSender\" />\n    <property name=\"\
  webServiceInvoker\" ref=\"webServiceInvoker\" />\n</bean>\n<bean id=\"fixedDepositService\"\
  \ class=\".....FixedDepositServiceImpl\" parent=\"serviceTemplate\">\n    <property\
  \ name=\"fixedDepositDao\" ref=\"fixedDepositDao\" />\n</bean>\n<bean id=\"personalBankingService\"\
  \ class=\".....PersonalBankingServiceImpl\" parent=\"serviceTemplate\">\n    <property\
  \ name=\"personalBankingDao\" ref=\"personalBankingDao\" />\n</bean>\n<bean id=\"\
  userRequestController\" class=\".....UserRequestImpl\">\n    <property name=\"serviceTemplate\"\
  \ ref=\"serviceTemplate\" />\n</bean>\n```\n\n在深入研究上述配置细节之前介绍一点背景：MyBank 应用中的服务可能会向消息中间件发送\
  \ JMS 消息，向邮件服务器发送邮件，或者调用外部 Web 服务。在上面的示例列表中，`jmsMessageSender`、`emailMessageSender`\
  \ 和 `webServiceInvoker` bean 通过提供抽象层简化了这些任务。`serviceTemplate` bean 提供了对 `jmsMessageSender`、`emailMessageSender`\
  \ 和 `webServiceInvoker` bean 的访问。这就是为什么 `serviceTemplate` bean 依赖于 `jmsMessageSender`、`emailMessageSender`\
  \ 和 `webServiceInvoker` bean。\n\n示例列表 3-3 显示 `serviceTemplate` bean 定义是 `fixedDepositService`\
  \ 和 `personalBankingService` 的父 bean 定义。注意 `serviceTemplate` bean 定义不是 `abstract`\
  \ 的；`class` 属性指定了 `ServiceTemplate`。在我们之前的 bean 定义示例中（参见示例列表 3-2），子 bean 定义没有定义任何属性。在上面的示例列表中，注意\
  \ `fixedDepositService` 和 `personalBankingService` 子 bean 定义分别定义了 `fixedDepositDao`\
  \ 和 `personalBankingDao` 属性。\n\n由于父 bean 定义的属性被子 bean 定义继承，`FixedDepositServiceImpl`\
  \ 和 `PersonalBankingServiceImpl` 类*必须*为 `jmsMessageSender`、`emailMessageSender`\
  \ 和 `webServiceInvoker` 属性定义 setter 方法。你可以选择在 `FixedDepositServiceImpl` 和 `PersonalBankingServiceImpl`\
  \ 类中定义 setter 方法，或者将 `FixedDepositServiceImpl` 和 `PersonalBankingServiceImpl` 类作为\
  \ `ServiceTemplate` 类的子类。在 `ch03-bankapp-inheritance-examples` 中，`FixedDepositServiceImpl`\
  \ 和 `PersonalBankingServiceImpl` 类是 `ServiceTemplate` 类的子类。\n\n下面的示例列表展示了 `PersonalBankingServiceImpl`\
  \ 类：\n\n**示例列表 3-4** – `PersonalBankingServiceImpl` 类\n\n**Project** – `ch03-bankapp-inheritance-examples`\n\
  \n**Source location** - `src/main/java/sample/spring/chapter03/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter03.bankapp.service;\n\npublic class PersonalBankingServiceImpl\
  \ extends ServiceTemplate implements PersonalBankingService {\n\n    private PersonalBankingDao\
  \ personalBankingDao;\n\n    public void setPersonalBankingDao(PersonalBankingDao\
  \ personalBankingDao) {\n```\n\n\n\n\n```java\n      this.personalBankingDao = personalBankingDao;\n\
  \n  }\n\n    @Override\n    public BankStatement getMiniStatement() {\n        return\
  \ personalBankingDao.getMiniStatement();\n    }\n}\n```\n\n在示例列表 3-3 中，我们看到 `personalBankingService`\
  \ bean 定义将 `personalBankingDao` 指定为依赖项。在上面的示例列表中，`setPersonalBankingDao` setter\
  \ 方法对应于 `personalBankingDao` 依赖项。此外，注意 `PersonalBankingServiceImpl` 类是 `ServiceTemplate`\
  \ 类的子类。\n\n接下来的图显示，父 bean 定义（如 `serviceTemplate`）不需要是*抽象的*，子 bean 定义（如 `fixedDepositService`\
  \ 和 `personalBankingService`）可以定义额外的属性，并且父 bean 定义（如 `ServiceTemplate` 类）和子 bean\
  \ 定义（如 `FixedDepositServiceImpl` 和 `PersonalBankingServiceImpl`）所表示的类之间可以存在继承关系：\n\
  \n![](img/00018.jpeg)\n\n**图 3-3** – 子 bean 定义增加了额外的属性，父 bean 定义*不是*抽象的，且父定义和子 bean\
  \ 定义所表示的类之间存在父子关系。\n\n图 3-3 显示：\n\n* Spring 容器创建了 `serviceTemplate` bean 的实例，因为它*没有*被定义为抽象类\n\
  * `FixedDepositServiceImpl` 和 `PersonalBankingServiceImpl` 类（对应子 bean 定义）是 `ServiceTemplate`\
  \ 类的子类——该类对应于父 bean 定义 `serviceTemplate`。\n* 同时，`fixedDepositService` 和 `personalBankingService`\
  \ bean 定义分别定义了额外的属性 `fixedDepositDao` 和 `personalBankingDao`。你应该注意，子 bean 定义还可以定义额外的构造参数和*方法重写*（在\
  \ 4-5 节中讨论）。\n\n由于 `serviceTemplate` bean 定义*不是*抽象的，其他 bean 可以将 `serviceTemplate`\
  \ bean 定义为它们的依赖。例如，在示例列表 3-3 中，`serviceTemplate` bean 是 `userRequestController`\
  \ bean 的依赖项。从这个讨论中你可以推出，如果父 bean 定义不是抽象的，父 bean 提供的功能不仅可以被子 bean 使用，还可以被应用上下文其他\
  \ bean 使用。\n\n## Bean 定义继承示例 – 继承工厂方法配置\n\n子 bean 定义可以使用 bean 定义继承来从父 bean 定义继承工厂方法配置。让我们来看一个展示工厂方法配置被子\
  \ bean 定义继承的示例。\n\n接下来的 `ControllerFactory` 类定义了一个 `getController`*实例*工厂方法：\n\n\
  **示例列表 3-5** – `ControllerFactory` 类\n\n**项目** – `ch03-bankapp-inheritance-examples`\n\
  \n**源位置** - `src/main/java/sample/spring/chapter03/bankapp/controller`\n\n```java\n\
  package sample.spring.chapter03.bankapp.controller;\n\npublic class ControllerFactory\
  \ {\n\n  public Object getController(String controllerName) {\n        Object controller\
  \ = null;\n        if (\"fixedDepositController\".equalsIgnoreCase(controllerName))\
  \ {\n            controller = new FixedDepositControllerImpl();\n        }\n   \
  \     if (\"personalBankingController\".equalsIgnoreCase(controllerName)) {\n  \
  \          controller = new PersonalBankingControllerImpl();\n        }\n      \
  \  return controller;\n    }\n}\n```\n\n上面的示例列表显示，`getController` 工厂方法根据传递给它的 `controllerName`\
  \ 参数的值创建 `FixedDepositControllerImpl` 或 `PersonalBankingControllerImpl` 类的实例。如果\
  \ `controllerName` 参数的值为 `fixedDepositController`，则 `getController` 方法会创建一个 `FixedDepositControllerImpl`\
  \ 类的实例。如果 `controllerName` 参数的值为 `personalBankingController`，则 `getController` 方法会创建一个\
  \ `PersonalBankingControllerImpl` 类的实例。\n\n`ch03-bankapp-inheritance-example` 项目中\
  \ `applicationContext.xml` 中的接下来的 bean 定义显示，子 bean 定义从父 bean 定义继承了 `getController`*实例*工厂方法配置：\n\
  \n**示例列表 3-6** – `applicationContext.xml` - Bean 定义继承 – 继承工厂方法配置\n\n**项目** – `ch03-bankapp-inheritance-examples`\n\
  \n**源位置** - `src/main/resources/META-INF/spring`\n\n```xml\n     <bean id=\"controllerFactory\"\
  \n          class=\"sample.spring.chapter03.bankapp.controller.ControllerFactory\"\
  \ />\n  <bean id=\"controllerTemplate\" factory-bean=\"controllerFactory\"\n   \
  \       factory-method=\"getController\" abstract=\"true\">\n  </bean>\n  <bean\
  \ id=\"fixedDepositController\" parent=\"controllerTemplate\">\n      <constructor-arg\
  \ index=\"0\" value=\"fixedDepositController\" />\n      <property name=\"fixedDepositService\"\
  \ ref=\"fixedDepositService\" />\n     </bean>\n  <bean id=\"personalBankingController\"\
  \ parent=\"controllerTemplate\">\n      <constructor-arg index=\"0\" value=\"personalBankingController\"\
  \ />\n      <property name=\"personalBankingService\" ref=\"personalBankingService\"\
  \ />\n  </bean>\n```\n\n在上面的示例列表中，`ControllerFactory` 类表示一个定义了 `getController`*实例*工厂方法的工厂类。`controllerTemplate`\
  \ bean 定义指定了使用 `ControllerFactory` 的 `getController` 工厂方法来创建 bean 实例。`getController`\
  \ 方法（参考示例列表 3-5）根据传递给 `getController` 方法的参数创建 `FixedDepositControllerImpl` 或 `PersonalBankingControllerImpl`\
  \ bean 的实例。\n\n由于 `controllerTemplate` bean 定义被定义为*抽象的*，由 `fixedDepositController`\
  \ 和 `personalBankingController` 子 bean 定义来使用 `getController` 工厂方法配置。`fixedDepositController`\
  \ bean 定义想要向 `ControllerFactory` 的 `getController` 工厂方法传递参数，以便创建一个 `FixedDepositControllerImpl`\
  \ bean 实例。同样，`personalBankingController` bean 定义想要向 `ControllerFactory` 的 `getController`\
  \ 工厂方法传递参数，以便创建一个 `PersonalBankingControllerImpl` bean 实例。我们在第 2 章第 2-3 节见过 `<constructor-arg>`\
  \ 元素用于向*实例*工厂方法传递参数。在示例列表 3-6 中，`fixedDepositController` 和 `personalBankingController`\
  \ 子 bean 定义使用了 `<constructor-arg>` 元素分别向 `getController` 工厂方法传递了 `fixedDepositService`\
  \ 和 `personalBankingService` 值。\n\n\n\n\n\n如果构造函数参数是简单的 Java 类型（如 `int`、`String`\
  \ 等），则使用 `<constructor-arg>` 元素的 `value` 属性来指定构造函数参数的值。如果构造函数参数是某个 bean 的引用，则使用\
  \ `<constructor-arg>` 元素的 `ref` 属性来指定 bean 的名称。\n\n下面的示例列表展示了 `ch03-bankapp-constructor-args-by-type`\
  \ 项目中的 `UserRequestControllerImpl` 类，其构造函数接受类型为 `ServiceTemplate` 的参数：\n\n**示例列表\
  \ 3-7** – `UserRequestControllerImpl` 类\n**项目** – `ch03-bankapp-constructor-args-by-type`\n\
  **源码位置** -`src/main/java/sample/spring/chapter03/bankapp/controller`\n\n```java\n\
  package sample.spring.chapter03.bankapp.controller;\n\npublic class UserRequestControllerImpl\
  \ implements UserRequestController {\n\n    private ServiceTemplate serviceTemplate;\n\
  \n    public UserRequestControllerImpl(ServiceTemplate serviceTemplate) {\n    \
  \    this.serviceTemplate = serviceTemplate;\n    }\n\n    @Override\n    public\
  \ void submitRequest(Request request) {\n        //-- do something using ServiceTemplate\n\
  \        serviceTemplate.getJmsMessageSender(); //-- For ex., send JMS message\n\
  \        .....\n    }\n}\n```\n\n下面的示例列表展示了如何使用 `<constructor-arg>` 元素的 `ref` 属性将\
  \ `ServiceTemplate` 实例的引用（由 `serviceTemplate` bean 定义）传递给 `UserRequestControllerImpl`\
  \ 的构造函数：\n\n**示例列表 3-8** – `applicationContext.xml` - 将 Spring bean 引用作为构造函数参数\n\
  **项目** – `ch03-bankapp-constructor-args-by-type`\n**源码位置** -`src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"serviceTemplate\" class=\"sample.spring.chapter03.bankapp.base.ServiceTemplate\"\
  >\n    .....\n</bean>\n\n<bean id=\"userRequestController\"\n      class=\"sample.spring.chapter03.bankapp.controller.UserRequestControllerImpl\"\
  >\n  <constructor-arg index=\"0\" ref=\"serviceTemplate\" />\n</bean>\n```\n\n有了这些关于如何将简单值和\
  \ bean 引用作为构造函数参数的背景信息，让我们来看 Spring 容器如何通过匹配构造函数参数*类型*来定位要调用的 bean 构造函数。\n\n基于 基于类型的构造函数参数匹配\n\
  \n如果未指定 `<constructor-arg>` 元素的 `index` 属性，Spring 容器将通过匹配 `<constructor-arg>` 元素所引用的类型与\
  \ bean 类构造函数中指定的参数类型，来定位要调用的构造函数。\n\n我们先来看当构造函数参数是之间*没有*继承关系的 Spring bean 时，Spring\
  \ 容器是如何匹配构造函数参数的。\n\n#### 表示不同 Spring bean 的构造函数参数\n\n下面的示例列表展示了 `ServiceTemplate`\
  \ 类，它定义了一个构造函数，接受对 `JmsMessageSender`、`EmailMessageSender` 和 `WebServiceInvoker`\
  \ bean 的引用：\n\n**示例列表 3-9** – `ServiceTemplate` 类\n**项目** – `ch03-bankapp-constructor-args-by-type`\n\
  **源码位置** -`src/main/java/sample/spring/chapter03/bankapp/base`\n\n```java\npackage\
  \ sample.spring.chapter03.bankapp.base;\n\npublic class ServiceTemplate {\n    .....\n\
  \n    public ServiceTemplate(JmsMessageSender jmsMessageSender,\n              \
  \             EmailMessageSender emailMessageSender,\n           WebServiceInvoker\
  \ webServiceInvoker) {\n        .....\n    }\n}\n```\n\n下面的示例列表展示了 `ServiceTemplate`\
  \ 类以及 `ServiceTemplate` 所引用 bean 的 bean 定义：\n\n**示例列表 3-10** – `applicationContext.xml`\
  \ - `ServiceTemplate` 类及其依赖的 bean 定义\n**项目** – `ch03-bankapp-constructor-args-by-type`\n\
  **源码位置** -`src/main/resources/META-INF/spring`\n\n```xml\n<bean id=\"serviceTemplate\"\
  \ class=\"sample.spring.chapter03.bankapp.base.ServiceTemplate\">\n    <constructor-arg\
  \ ref=\"emailMessageSender\" />\n    <constructor-arg ref=\"jmsMessageSender\" />\n\
  \    <constructor-arg ref=\"webServiceInvoker\" />\n</bean>\n\n<bean id=\"jmsMessageSender\"\
  \ class=\"sample.spring.chapter03.bankapp.base.JmsMessageSender\" />\n<bean id=\"\
  emailMessageSender\" class=\"sample.spring.chapter03.bankapp.base.EmailMessageSender\"\
  \ />\n<bean id=\"webServiceInvoker\" class=\"sample.spring.chapter03.bankapp.base.WebServiceInvoker\"\
  \ />\n```\n\n在上面的示例列表中，`serviceTemplate` bean 的 `<constructor-arg>` 元素*没有*指定 `index`\
  \ 属性。`<constructor-arg>` 元素指定构造函数参数的顺序为：`EmailMessageSender`、`JmsMessageSender`、`WebServiceInvoker`。`ServiceTemplate`\
  \ 类构造函数中指定构造函数参数的顺序为：`JmsMessageSender`、`EmailMessageSender`、`WebServiceInvoker`。如所示，`<constructor-arg>`\
  \ 元素定义的顺序与 `ServiceTemplate` 类构造函数指定的顺序不同。\n\n如果你执行 `ch03-bankapp-constructor-args-by-type`\
  \ 项目中 `BankApp` 类的 `main` 方法，你会发现 Spring 容器成功创建了 `ServiceTemplate` bean 的实例。这是因为\
  \ `JmsMessageSender`、`EmailMessageSender` 和 `WebServiceInvoker` 类在本质上是不同的（即它们之间没有继承关系），这使得\
  \ Spring 容器更容易按照正确的顺序将实例注入到 `ServiceTemplate` 构造函数中。\n\n如果构造函数参数类型存在继承关系，Spring\
  \ 容器需要额外的指令来帮助解析构造函数参数。现在我们来看当构造函数参数引用的 bean 存在继承关系时，Spring 容器是如何匹配构造函数参数的。\n\n\
  #### 表示相关 Spring bean 的构造函数参数\n\n考虑下面的 `SampleBean` 类，其构造函数接受继承关系的参数类型：\n\n**示例列表\
  \ 3-11** – `SampleBean` 类\n\n```java\npublic class SampleBean {\n    public SampleBean(ABean\
  \ aBean, BBean bBean) { ..... }\n    .....\n}\n```\n\n上面的示例列表显示了 `SampleBean` 类构造函数接受\
  \ `ABean` 和 `BBean` 类型。`ABean` 和 `BBean` 表示具有继承关系的 Spring bean；`BBean` 是 `ABean`\
  \ 的子类。\n\n接下来的应用上下文显示了 `SampleBean`、`ABean` 和 `BBean` 的 bean 定义：\n\n**示例列表 3-12**\
  \ – `SampleBean`、`ABean` 和 `BBean` 的 bean 定义\n\n```xml\n<bean id=\"aBean\" class=\"\
  example.ABean\"/>\n<bean id=\"bBean\" class=\"example.BBean\"/>\n<bean id=\"sampleBean\"\
  \ class=\"example.SampleBean\">\n    <constructor-arg ref=\"bBean\" />\n    <constructor-arg\
  \ ref=\"aBean\" />\n</bean>\n```\n\n由于 `aBean` 和 `bBean` bean 存在继承关系，Spring 容器按照\
  \ `<constructor-arg>` 元素在 `SampleBean` bean 定义中出现的顺序将构造函数参数应用于构造函数。在上面的 `sampleBean`\
  \ bean 定义中，第一个 `<constructor-arg>` 元素引用 `bBean`，第二个 `<constructor-arg>` 元素引用 `aBean`。这意味着\
  \ `bBean` 作为第一个构造函数参数，`aBean` 作为第二个构造函数参数传递给 `SampleBean` 构造函数。由于 `ABean`（父类）实例无法传递到预期\
  \ `BBean`（子类）实例的地方，`sampleBean` bean 定义中的第二个 `<constructor-arg>` 元素会导致 Spring 抛出异常。为了处理这种情况，你可以使用\
  \ `<constructor-arg>` 元素的 `index` 或 `type` 属性来标识 `<constructor-arg>` 元素所适用的构造函数参数。例如，下面的\
  \ `sampleBean` bean 定义利用 `type` 属性来指示 `<constructor-arg>` 元素所适用的构造函数参数的类型：\n\n**示例列表\
  \ 3-13** – `<constructor-arg>` 元素的 `type` 属性标识构造函数参数的类型\n\n\n\n\n\n```xml\n<bean\
  \ id=\"sampleBean\" class=\"example.SampleBean\">\n    <constructor-arg type=\"\
  sample.spring.chapter03.bankapp.controller.BBean\" ref=\"bBean\"/>\n    <constructor-arg\
  \ type=\"sample.spring.chapter03.bankapp.controller.ABean\" ref=\"aBean\"/>\n</bean>\n\
  ```\n\n`<constructor-arg>` 元素的 `type` 属性指定了 `<constructor-arg>` 元素所属类型的完全限定名。在上面的示例列表中，第一个\
  \ `<constructor-arg>` 应用于类型为 `BBean` 的构造参数，第二个 `<constructor-arg>` 元素应用于类型为 `ABean`\
  \ 的构造参数。指定 `type` 属性可以消除当构造参数之间存在继承关系时产生的歧义。\n\n**注意** 如果两个或多个构造参数的类型相同，则唯一的选择是使用\
  \ `index` 属性来标识每个 `<constructor-arg>` 元素所应用的构造参数。\n\n到目前为止，我们已经查看了构造参数表示不同或相关 Spring\
  \ bean 时的构造参数类型匹配场景。现在，我们将查看如何为标准 Java 类型（如 `int`、`long`、`boolean`、`String`、`Date`\
  \ 等）以及自定义类型匹配构造参数类型。\n\n### 表示标准 Java 类型和自定义类型的构造参数\n\n如果构造参数的类型是基本类型（如 `int`、`long`、`boolean`\
  \ 等）或 `String` 类型或自定义类型（如 `Address`），则使用 `<constructor-arg>` 元素的 `value` 属性来指定值。如果有\
  \ 2 或多个可以由 `value` 属性指定的字符串值转换为构造参数，Spring 容器将无法推导出构造参数的类型（例如，该值代表 `int`、`long`\
  \ 还是 `String`）。在这种情况下，你需要使用 `type` 属性显式指定构造参数的类型。\n\n下面的示例显示了 `TransferFundsServiceImpl`\
  \ 类，该类定义了一个接受 `String`、`boolean`、`long` 和 `int` 类型参数的构造函数：\n\n**示例 3-14** – `TransferFundsServiceImpl`\
  \ 类\n\n**项目** – `ch03-bankapp-constructor-args-by-type`\n\n**源位置** - `/src/main/java/sample/spring/chapter03/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter03.bankapp.service;\n\npublic class TransferFundsServiceImpl\
  \ implements TransferFundsService {\n\n    public TransferFundsServiceImpl(String\
  \ webServiceUrl, boolean active, long timeout,\n        int numberOfRetrialAttempts)\
  \ {.....\n\n    .....\n}\n```\n\n如上面的示例所示，`TransferFundsServiceImpl` 构造函数接受以下参数：`webServiceUrl`、`active`、`timeout`\
  \ 和 `numberOfRetrialAttempts`。对应的 `TransferFundsServiceImpl` 类的 bean 定义显示了如何将构造参数值传递给\
  \ `TransferFundsServiceImpl` 的构造函数：\n\n**示例 3-15** – `TransferFundsServiceImpl`\
  \ 类的 bean 定义\n\n```xml\n<bean id=\"transferFundsService\"\n    class=\"sample.spring.chapter03.bankapp.service.TransferFundsServiceImpl\"\
  >\n    <constructor-arg value=\"http://someUrl.com/xyz\" />\n    <constructor-arg\
  \ value=\"true\" />\n    <constructor-arg value=\"5\" />\n    <constructor-arg value=\"\
  200\" />\n</bean>\n```\n\n假设第 3 个 `<constructor-arg>` 元素（`value` 属性的值为 '5'）应该为 `numberOfRetrialAttempts`\
  \ 构造参数提供值，而第 4 个 `<constructor-arg>` 元素（`value` 属性的值为 '200'）应该为 `timeout` 构造参数提供值。Spring\
  \ 容器按照 `<constructor-arg>` 元素在 `transferFundsService` bean 定义中出现的顺序将其应用于 `TransferFundsServiceImpl`\
  \ 的构造函数。这意味着第 3 个 `<constructor-arg>` 元素应用于 `timeout` 参数，而第 4 个 `<constructor-arg>`\
  \ 元素应用于 `numberOfRetrialAttempts` 参数。为了处理此类歧义，可以通过 `<constructor-arg>` 元素的 `type`\
  \ 属性指定构造参数的 `type`，如下所示：\n\n**示例 3-16** – `applicationContext.xml` - `<constructor-arg>`\
  \ 元素的 `type` 属性\n\n**项目** – `ch03-bankapp-constructor-args-by-type`\n\n**源位置** -\
  \ `/src/main/resources/META-INF/spring`\n\n```xml\n<bean id=\"transferFundsService\"\
  \n    class=\"sample.spring.chapter03.bankapp.service.TransferFundsServiceImpl\"\
  >\n    <constructor-arg type=\"java.lang.String\" value=\"http://someUrl.com/xyz\"\
  \ />\n    <constructor-arg type=\"boolean\" value=\"true\" />\n    <constructor-arg\
  \ type=\"int\" value=\"5\" />\n    <constructor-arg type=\"long\" value=\"200\"\
  \ />\n</bean>\n```\n\n在上述 `TransferFundsServiceImpl` 类的 bean 定义中，`type` 属性用于指定构造参数类型。**注意**\
  \ 如果两个或多个构造参数的类型相同，则唯一的选择是使用 `index` 属性来标识 `<constructor-arg>` 元素所应用的构造参数。\n\n在本节中，我们看到了\
  \ Spring 如何通过执行类型匹配来解析构造参数。现在，让我们查看如何指示 Spring 根据名称进行构造匹配。\n\n### 按名称匹配构造参数\n\n\
  `<constructor-arg>` 元素的 `name` 属性用于指定 `<constructor-arg>` 元素所应用的构造参数名称。下面的示例再次显示了接受参数的\
  \ `TransferFundsServiceImpl` 类：\n\n**示例 3-17** – `TransferFundsServiceImpl` 类\n\n\
  **项目** – `ch03-bankapp-constructor-args-by-name`\n\n**源位置** - `/src/main/java/sample/spring/chapter03/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter03.bankapp.service;\n\npublic class TransferFundsServiceImpl\
  \ implements TransferFundsService {\n\n    public TransferFundsServiceImpl(String\
  \ webServiceUrl, boolean active, long timeout,\n        int numberOfRetrialAttempts)\
  \ {.....\n\n    .....\n}\n```\n\n上面的示例显示 `TransferFundsServiceImpl` 构造函数定义的构造参数名称为\
  \ `webServiceUrl`、`active`、`timeout` 和 `numberOfRetrialAttempts`。\n\n**注意** `TransferFundsServiceImpl`\
  \ 类接受简单的 Java 类型（如 `int`、`long`、`boolean`、`String` 等），但本节解释的概念适用于构造参数是 Spring bean\
  \ 引用的场景。\n\n`TransferFundsServiceImpl` 类的后续 bean 定义使用 `<constructor-arg>` 元素的 `name`\
  \ 属性来指定 `<constructor-arg>` 元素所应用的构造参数名称：\n\n**示例 3-18** – `applicationContext.xml`\
  \ - `<constructor-arg>` 元素的 `name` 属性\n\n**项目** – `ch03-bankapp-constructor-args-by-name`\n\
  \n**源位置** - `/src/main/resources/META-INF/spring`\n\n```xml\n<bean id=\"transferFundsService\"\
  \n    class=\"sample.spring.chapter03.bankapp.service.TransferFundsServiceImpl\"\
  >\n    <constructor-arg name=\"webServiceUrl\" value=\"http://someUrl.com/xyz\"\
  \ />\n    <constructor-arg name=\"active\" value=\"true\" />\n    <constructor-arg\
  \ name=\"numberOfRetrialAttempts\" value=\"5\" />\n    <constructor-arg name=\"\
  timeout\" value=\"200\" />\n</bean>\n```\n\n\n\n\n\n上述配置仅在编译 `TransferFundsServiceImpl`\
  \ 类时启用了 `debug flag`（参考 `javac` 的 `-g` 选项）才有效。当启用调试标记时，构造函数的参数名称将保留在生成的 `.class`\
  \ 文件中。如果你在没有启用调试标记的情况下编译类，构造函数的参数名称将在编译过程中丢失，此时 Spring 无法找到与 `<constructor-arg>`\
  \ 元素的 `name` 属性指定的构造函数参数名对应的构造函数参数。\n\n如果你不想在启用调试标记的情况下编译类，可以使用 `@ConstructorProperties`\
  \ 注解（Java SE 6 中引入）来明确列出构造函数参数的名称，如下所示 `TransferFundsServiceImpl` 类所示：\n\n**示例 3-19**\
  \ – `@ConstructorProperties` 注解\n\n**项目** – `ch03-bankapp-constructor-args-by-name`\n\
  \n**源码位置** **-**/src/main/java/sample/spring/chapter03/bankapp/service`\n\n```java\n\
  package sample.spring.chapter03.bankapp.service;\n\nimport java.beans.ConstructorProperties;\n\
  \npublic class TransferFundsServiceImpl implements TransferFundsService {\n\n  @ConstructorProperties({\"\
  webServiceUrl\",\"active\",\"timeout\",\"numberOfRetrialAttempts\"})\n     public\
  \ TransferFundsServiceImpl(String webServiceUrl, boolean active, long timeout,\n\
  \             int numberOfRetrialAttempts) { ..... }\n}\n```\n\n在上述示例中，`@ConstructorProperties`\
  \ 注解按照构造函数参数在 bean 类构造函数中出现的顺序指定了参数的名称。你*必须*确保在 `<constructor-arg>` 元素中使用相同的构造函数参数名称。\n\
  \n现在让我们来看 `@ConstructorProperties` 注解如何影响 bean 定义继承。\n\n### @ConstructorProperties\
  \ 注解与 bean 定义继承\n\n如果对应*父*bean 定义的类的构造函数标记了 `@ConstructorProperties` 注解，那么对应*子*bean\
  \ 定义的 bean 类*必须*也标记上 `@ConstructorProperties` 注解。\n\n接下来的示例展示了 `serviceTemplate`（父\
  \ bean 定义）和 `FixedDepositService`（子 bean 定义）的 bean 定义：\n\n**示例 3-20** – `applicationContext.xml`\
  \ - 父和子 bean 定义\n\n**项目** – `ch03-bankapp-constructor-args-by-name`\n\n**源码位置**\
  \ - `/src/main/resources/META-INF/spring`\n\n```xml\n    <bean id=\"serviceTemplate\"\
  \n        class=\"sample.spring.chapter03.bankapp.base.ServiceTemplate\">\n    \
  \    <constructor-arg name=\"emailMessageSender\" ref=\"emailMessageSender\" />\n\
  \        <constructor-arg name=\"jmsMessageSender\" ref=\"jmsMessageSender\" />\n\
  \        <constructor-arg name=\"webServiceInvoker\" ref=\"webServiceInvoker\" />\n\
  \    </bean>\n    <bean id=\"FixedDepositService\"\n        class=\"sample.spring.chapter03.bankapp.service.FixedDepositServiceImpl\"\
  \n        parent=\"serviceTemplate\">\n          <property name=\"fixedDepositDao\"\
  \ ref=\"FixedDepositDao\" />\n    </bean>\n```\n\n上述示例显示 `serviceTemplate` bean\
  \ 定义*不是*抽象的，这意味着 Spring 容器将创建 `serviceTemplate` bean 的实例。`serviceTemplate` bean\
  \ 定义指定了 3 个 `<constructor-arg>` 元素，对应于 `ServiceTemplate` 类定义的 3 个参数（参见示例 3-21）。由于我们已经在\
  \ `serviceTemplate` bean 定义中通过*名称*指定了构造函数参数，因此 `ServiceTemplate` 类的构造函数标记了 `@ConstructorProperties`\
  \ 注解，以确保 Spring 在运行时可以使用构造函数参数名称，如下所示：\n\n**示例 3-21** – `ServiceTemplate` 类\n\n\
  **项目** – `ch03-bankapp-constructor-args-by-name`\n\n**源码位置** **-**/src/main/java/sample/spring/chapter03/bankapp/base`\n\
  \n```java\npackage sample.spring.chapter03.bankapp.base;\n\nimport java.beans.ConstructorProperties;\n\
  \npublic class ServiceTemplate {\n\n    .....\n\n  @ConstructorProperties({\"jmsMessageSender\"\
  ,\"emailMessageSender\",\"webServiceInvoker\"})\n    public ServiceTemplate(JmsMessageSender\
  \ jmsMessageSender,\n             EmailMessageSender emailMessageSender,\n     \
  \        WebServiceInvoker webServiceInvoker) { ..... }\n}\n```\n\n由于 `FixedDepositService`\
  \ 是 `serviceTemplate` 的子 bean 定义，`serviceTemplate` bean 定义中的 `<constructor-arg>`\
  \ 配置被 `FixedDepositService` bean 定义继承。这意味着 `TransferFundsServiceImpl` 类*必须*定义一个与\
  \ `ServiceTemplate` 类定义的参数集相同的构造函数，并且它*必须*也标记上 `@ConstructorProperties` 注解。如果你没有为\
  \ `FixedDepositServiceImpl` 的构造函数标记 `@ConstructorProperties` 注解，Spring 容器将*无法*匹配继承的\
  \ `<constructor-arg>` 元素。\n\n### @ConstructorProperties 注解与工厂方法\n\n我们在第 2 章第 2-3\
  \ 节中看到`<constructor-arg>` 元素也用于向*静态*和*实例*工厂方法传递参数。你可能认为可以通过指定 `name` 属性并为方法标记 `@ConstructorProperties`\
  \ 注解来向*静态*和*实例*工厂方法传递参数。你应该注意，`@ConstructorProperties` 注解*仅*用于构造函数；你不能为方法标记 `@ConstructorProperties`\
  \ 注解。因此，如果你想通过名称向*静态*或*实例*工厂方法传递参数，你唯一的选择就是使用启用调试标记编译类。\n\n**注意** 如果启用调试标记编译类，会导致\
  \ .class 文件体积较大，但对应用程序的运行时性能没有影响。它只会增加类的加载时间。\n\n现在让我们来看如何在 Eclipse IDE 中启用调试标记。\n\
  \n### 在 Eclipse IDE 中启用（或禁用）调试标记\n\n在 Eclipse IDE 中，按照以下步骤为项目启用调试标记：\n\n1. 转到 `Windows`\
  \ -> `Preferences` 并选择 `Java` -> `Compiler`\n2. 你现在会看到一个名为“Classfile Generation”的区域。在此区域中，如果你勾选标记为“Add\
  \ variable attributes to generated class files (used by the debugger)*则调试标记为*启用*。取消勾选此选框将*禁用*调试标记。\n\
  \n到此为止，我们看到的大多数 bean 定义示例属性和构造函数参数都是 bean 的引用。现在我们将查看属性和构造函数参数为基本类型、集合类型、`java.util.Date`、`java.util.Properties`\
  \ 等 bean 定义示例。\n\n## 3-4 配置不同类型的 bean 属性和构造函数参数\n\n在实际开发场景中，Spring bean 的属性和构造函数参数可能从字符串类型到\
  \ bean 引用再到任何标准（如 `java.util.Date`、`java.util.Map`）或自定义类型（如 `Address`）。之前我们看到了如何为字符串类型的\
  \ bean 属性提供值（使用`<property>` 元素的 `value` 属性）以及字符串类型的构造函数参数提供值（使用`<constructor-arg>`\
  \ 元素的 `value` 属性）。我们还查看了如何通过 bean 属性（使用`<property>` 元素的 `ref` 属性）和构造函数参数（使用`<constructor-arg>`\
  \ 元素的 `ref` 属性）注入依赖项。\n\n\n\n\n\n在本节中，我们将查看 Spring 内置的 `PropertyEditor` 实现，这些实现简化了\
  \ `java.util.Date`、`java.util.Currency`、基本类型等类型的 bean 属性和构造函数参数的传递。我们还将查看如何在应用程序上下文\
  \ XML 文件中为集合类型（如 `java.util.List` 和 `java.util.Map`）指定值，以及如何向 Spring 注册自定义的 `PropertyEditor`\
  \ 实现。\n\n现在让我们来看演示使用内置 `PropertyEditor` 实现的 bean 定义示例。\n\n导入第 3 章/****ch03-simple-types-examples`（该项目展示了一个\
  \ Spring 应用程序，其中 bean 属性和构造函数参数是基本类型、`java.util.Date`、`java.util.List`、`java.util.Map`\
  \ 等。该项目还展示了如何向 Spring 容器注册自定义的 `PropertyEditor` 实现。要运行该应用程序，请执行该项目中 `SampleApp`\
  \ 类的 main 方法）\n\n### Spring 中内置的属性编辑器\n\nJavaBeans `PropertyEditors` 提供了将 Java 类型转换为字符串值以及反之所需的必要逻辑。Spring\
  \ 提供了几个内置的 `PropertyEditors`，用于将 bean 属性或构造函数参数的字符串值（通过 `<property>` 和 `<constructor-arg>`\
  \ 元素的 `value` 属性指定）转换为属性或构造函数参数的实际 Java 类型。\n\n在查看涉及内置 `PropertyEditors` 的示例之前，让我们先了解\
  \ `PropertyEditors` 在设置 bean 属性或构造函数参数值时的重要性。\n\n考虑以下 `BankDetails` 类，我们希望将其配置为单例作用域的\
  \ bean，并为其属性设置预定义值：\n\n示例 3-22 – `BankDetails` 类\n\n```java\npublic class BankDetails\
  \ {\n\n    private String bankName;\n\n    public void setBankName(String bankName)\
  \ {\n        this.bankName = bankName;\n    }\n}\n```\n\n在上面的示例中，`bankName` 是 `BankDetails`\
  \ 类的一个属性，类型为 `String`。接下来的 `BankDetails` 类的 bean 定义展示了如何将 `bankName` 属性的值设置为‘My\
  \ Personal Bank’：\n\n示例 3-23 – `BankDetails` 类的 bean 定义\n\n```xml\n<bean id= \"\
  bankDetails\" class= \"BankDetails\">\n    <property name= \"bankName\" value= \"\
  My Personal Bank\"/>\n</bean>\n```\n\n在上面的 bean 定义中，`<property>` 元素的 `value` 属性为\
  \ `bankName` 属性指定了一个字符串值。你可以看到，如果 bean 属性的类型为 `String`，你可以简单地使用 `<property>` 元素的\
  \ `value` 属性设置该属性值。同样，如果构造函数参数的类型为 `String`，你可以使用 `<constructor-arg>` 元素的 `value`\
  \ 属性设置构造函数参数值。\n\n假设向 `BankDetails` 类增加了以下属性（及其 setter 方法）：类型为 `byte[]` 的 `bankPrimaryBusiness`\
  \ 属性、类型为 `char[]` 的 `headOfficeAddress` 属性、类型为 `char` 的 `privateBank` 属性、类型为 `java.util.Currency`\
  \ 的 `primaryCurrency` 属性、类型为 `java.util.Date` 的 `dateOfInception` 属性，以及类型为 `java.util.Properties`\
  \ 的 `branchAddresses` 属性。下面的示例展示了修改后的 `BankDetails` 类：\n\n示例 3-24 – 包含不同类型属性的 `BankDetails`\
  \ 类\n\n项目 – `ch03-simple-types-examples`\n\n源路径 - `src/main/java/sample/spring/chapter03/beans`\n\
  \n```java\npackage sample.spring.chapter03.beans;\n\n.....\n\npublic class BankDetails\
  \ {\n\n    private String bankName;\n    private byte[] bankPrimaryBusiness;\n \
  \   private char[] headOfficeAddress;\n    private char privateBank;\n    private\
  \ Currency primaryCurrency;\n    private Date dateOfInception;\n    private Properties\
  \ branchAddresses;\n\n    .....\n\n    public void setBankName(String bankName)\
  \ {\n        this.bankName = bankName;\n    }\n\n    //--更多 setter 方法\n}\n```\n\n\
  你可以通过为属性指定字符串值，将 `BankDetails` 类配置为 Spring bean，并利用已注册的 JavaBeans `PropertyEditor`\
  \ 实现让 Spring 容器将这些字符串值转换为属性对应的 Java 类型。\n\n接下来的 `BankDetails` 类的 bean 定义展示了为不同属性类型指定了简单的字符串值：\n\
  \n示例 3-25 – `applicationContext.xml` - `BankDetails` 类的 bean 定义\n\n项目 – `ch03-simple-types-examples`\n\
  \n源路径 - `src/main/resources/META-INF/spring`\n\n```xml\n<bean id=\"bankDetails\"\
  \ class=\"sample.spring.chapter03.beans.BankDetails\">\n    <property name=\"bankName\"\
  \ value=\"My Personal Bank\" />\n    <property name=\"bankPrimaryBusiness\" value=\"\
  Retail banking\" />\n    <property name=\"headOfficeAddress\" value=\"Address of\
  \ head office\" />\n    <property name=\"privateBank\" value=\"Y\" />\n    <property\
  \ name=\"primaryCurrency\" value=\"INR\" />\n    <property name=\"dateOfInception\"\
  \ value=\"30-01-2012\"></property>\n    <property name=\"branchAddresses\">\n  \
  \      <value>\n            x = Branch X's address\n            y = Branch Y's address\n\
  \        </value>\n    </property>\n</bean>\n```\n\n上面的示例展示了为 `java.util.Date`、`java.util.Currency`、`char[]`、`char`\
  \ 和 `java.util.Properties` 类型的属性指定了字符串值。Spring 容器使用注册的 `PropertyEditors` 将属性或构造函数参数的字符串值转换为相应的类型。例如，Spring\
  \ 容器使用 `CustomDateEditor`（用于 `java.util.Date` 的内置 `PropertyEditor`）将 `dateOfInception`\
  \ 属性的值‘30-01-2012’转换为 `java.util.Date`。\n\n如果你查看示例 3-25 如何配置 `branchAddresses` 属性（类型为\
  \ `java.util.Properties`），你会发现没有使用 `<property>` 元素的 `value` 属性，而是使用了 `<property>`\
  \ 元素的 `<value>` 子元素来指定属性值。对于单值属性，优先使用 `<property>` 元素的属性 own `<value>` 子元素。但如果你需要为属性指定多个值，或者需要分行指定值（如\
  \ `branchAddresses` 属性所示），则优先使用子元素。在下一节中，你将看到 `java.util.Properties` 类型的属性（或构造函数参数）也可以通过\
  \ `<property>`（或 `<constructor-arg>`）元素的 `<props>` 子元素来指定值。\n\nSpring 提供了一些内置的 `PropertyEditor`\
  \ 实现，负责将应用程序上下文 XML 文件中指定的值转换为 bean 属性或构造函数参数的 Java 类型。下表描述了 Spring 中的一些内置 `PropertyEditor`\
  \ 实现：\n\n| 内置 PropertyEditor 实现 | 说明 |\n| :--- | :--- |\n| CustomBooleanEditor |\
  \ 将字符串值转换为 `Boolean` 或 `boolean` 类型 |\n| CustomNumberEditor | 将字符串值转换为数字（如 `int`、`long`\
  \ 等） |\n| ChracterEditor | 将字符串值转换为 `char` 类型 |\n| ByteArrayPropertyEditor | 将字符串值转换为\
  \ `byte[]` |\n| CustomDateEditor | 将字符串值转换为 `java.util.Date` 类型 |\n| PropertiesEditor\
  \ | 将字符串值转换为 `java.util.Properties` 类型 |\n\n\n\n\n\n上表仅显示了 Spring 内置 `PropertyEditor`\
  \ 实现的一个子集。有关完整列表，请参阅 Spring 的 `org.springframework.beans.propertyeditors` 包。需要注意的是，Spring\
  \ 中并不是所有内置的 `PropertyEditor` 实现都默认注册到 Spring 容器中。例如，你需要显式注册 `CustomDateEditor`，以允许\
  \ Spring 容器执行从字符串值到 `java.util.Date` 类型的转换。在本节的稍后部分，我们将介绍如何向 Spring 容器注册属性编辑器。\n\
  \n现在让我们来看如何为类型为 `java.util.List`、`java.util.Set` 和 `java.util.Map` 的 bean 属性（或构造参数）指定值。\n\
  \n### 为不同的集合类型指定值\n\n`<property>` 和 `<constructor-arg>` 元素的 `<list>`、`<map>` 和 `<set>`\
  \ 子元素（定义在 Spring 的 beans schema 中）分别用于设置类型 `java.util.List`、`java.util.Map` 和 `java.util.Set`\
  \ 的属性和构造参数。\n\n**注意** Spring 的 `util` schema 也提供了 `<list>`、`<set>` 和 `<map>` 元素，简化了设置不同集合类型的属性和构造参数的操作。在本章稍后，我们将详细查看\
  \ Spring 的 util schema 元素。\n\n接下来的 `DataTypesExample` 类显示其构造函数接受不同类型的参数：\n\n**示例列表\
  \ 3-26** – `DataTypesExample` 类\n\n**项目** – `ch03-simple-types-examples`\n\n**源码位置**\
  \ - `src/main/java/sample/spring/chapter03/beans`\n\n```java\npackage sample.spring.chapter03.beans;\n\
  \nimport java.beans.ConstructorProperties;\n\n.....\n\npublic class DataTypesExample\
  \ {\n    private static Logger logger = Logger.getLogger(DataTypesExample.class);\n\
  \n    @SuppressWarnings(\"rawtypes\")\n    @ConstructorProperties({ \"byteArrayType\"\
  , \"charType\", \"charArray\",\n              \"classType\", \"currencyType\", \"\
  booleanType\", \"dateType\", \"longType\",\n              \"doubleType\", \"propertiesType\"\
  , \"listType\", \"mapType\", \"setType\",\n              \"anotherPropertiesType\"\
  \ })\n    public DataTypesExample(byte[] byteArrayType, char charType,\n       \
  \       char[] charArray, Class classType, Currency currencyType,\n            \
  \  boolean booleanType, Date dateType, long longType,\n              double doubleType,\
  \ Properties propertiesType, List<Integer> listType,\n              Map mapType,\
  \ Set setType, Properties anotherPropertiesType) {\n        .....\n        logger.info(\"\
  classType \" + classType.getName());\n        logger.info(\"listType \" + listType);\n\
  \        logger.info(\"mapType \" + mapType);\n        logger.info(\"setType \"\
  \ + setType);\n        logger.info(\"anotherPropertiesType \" + anotherPropertiesType);\n\
  \    }\n}\n```\n\n上面的示例显示 `DataTypesExample` 类的构造函数接受类型为 `java.util.List`、`java.util.Map`、`java.util.Set`\
  \ 和 `java.util.Properties` 等参数，并记录了每个构造参数的值。\n\n接下来的示例显示了 `DataTypesExample` 类的\
  \ bean 定义：\n\n**示例列表 3-27** – `applicationContext.xml` - `DataTypesExample` 类的 Bean\
  \ 定义\n\n**项目** – `ch03-simple-types-examples`\n\n**源码位置** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"dataTypes\" class=\"sample.spring.chapter03.beans.DataTypesExample\"\
  >\n    .....\n    <constructor-arg name=\"anotherPropertiesType\">\n        <props>\n\
  \            <prop key=\"book\">Getting started with the Spring Framework</prop>\n\
  \        </props>\n    </constructor-arg>\n    <constructor-arg name=\"listType\"\
  \ value-type=\"java.lang.Integer\" >\n        <list>\n            <value>1</value>\n\
  \            <value>2</value>\n        </list>\n    </constructor-arg>\n    <constructor-arg\
  \ name=\"mapType\">\n        <map>\n            <entry>\n                <key>key\
  \ 1</key>\n                <value>map key 1’s value</value>\n            </entry>\n\
  \        </map>\n    </constructor-arg>\n    <constructor-arg name=\"setType\">\n\
  \        <set>\n            <value>Element 1</value>\n            <value>Element\
  \ 2</value>\n        </set>\n    </constructor-arg>\n</bean>\n```\n\n上面的示例显示：\n\n\
  - `anotherPropertiesType`（类型为 `java.util.Properties`）的值使用 `<constructor-arg>` 的\
  \ `<props>` 子元素指定。每个 `<prop>` 元素指定一个键值对；`key` 属性指定键的值，`<prop>` 元素的内容是该键的值。你可以使用\
  \ `<constructor-arg>` 的 `<value>` 子元素而不是使用 `<props>` 元素来为 `anotherPropertiesType`\
  \ 参数指定值。\n- `listType` 构造参数（类型为 `java.util.List`）的值使用 `<constructor-arg>` 的 `<list>`\
  \ 子元素指定。<list>` 的 `<value>` 子元素指定列表中包含的项。`<list>` 元素的 `value-type` 属性指定 `java.util.List`\
  \ 类型构造参数所接受的元素的 Java 类型。由于 `listType` 构造参数类型为 `List<Integer>`（参见示例列表 3-26），`value-type`\
  \ 属性的值指定为 `java.lang.Integer`。`value-type` 属性是可选的，当你使用泛型 类型时特别有用。如果你指定了 `value-type`\
  \ 属性，Spring 容器将使用注册的属性编辑器将值转换为 `value-type` 指定的类型，然后根据需要将其转换为泛型接受的类型。如果你没有指定 `value-type`\
  \ 属性，Spring 容器将使用注册的属性编辑器将值转换为泛型接受的类型。\n- `mapType` 构造参数（类型为 `java.util.Map`）的值使用\
  \ `<constructor-arg>` 的 `<map>` 子元素指定。<map>` 的 `<entry>` 子元素指定 Map 中包含的键值对；`<key>`\
  \ 元素指定键，`<value>` 元素指定键的值。<map>` 元素的 `key-type` 和 `value-type` 属性指定 `java.util.Map`\
  \ 接受的键和值的 Java 类型`key-type` 和 `value-type` 属性是可选的，当你使用泛型 Map 类型（如 `Map<Integer,\
  \ Integer>`）时特别有用。Spring 容器使用注册的属性编辑器将键和值转换为 `key-type` 和 `value-type` 属性指定的类型，以及泛型\
  \ Map 接受的类型。\n- `setType` 构造参数（类型为 `java.util.Set`）的值使用 `<constructor-arg>` 的 `<set>`\
  \ 子元素指定。<set>` 的 `<value>` 子元素指定 Set 中包含的元素。<set>` 元素的 `value-type` 属性指定 `java.util.Set`\
  \ 接受的元素的 Java 类型。`value-type` 属性是可选的，当你使用泛型 Set 类型（如 `Set<Integer>`）时有用。Spring 容器使用注册的属性编辑器将值转换为\
  \ `value-type` 指定的类型，以及泛型 Set 接受的类型。\n\n\n\n\n在 `DataTypesExample` 类中（参考示例列表 3-26\
  \ 和 3-27），类型为 `List`、`Map` 和 `Set` 的构造器参数包含 `String` 或 `Integer` 类型的元素。在应用程序中，集合可能包含\
  \ `Map`、`Set`、`Class`、`Properties` 或任何其他 Java 类型的元素。集合包含的元素也可以是 bean 引用。为了处理此类场景，Spring\
  \ 允许你使用 `<map>`、`<set>`、`<list>`、`<props>`、`<ref>` 等元素作为 `<list>`、`<map>` 和 `<set>`\
  \ 元素的子元素。让我们来看看演示如何向 `Map`、`List` 和 `Set` 类型的构造器参数和 bean 属性添加不同类型的元素。\n\n### 向集合类型添加\
  \ List、Map、Set 和 Properties 类型的元素\n\n如果 bean 属性或构造器参数的类型为 `List<List>`，只需使用嵌套的 `<list>`\
  \ 元素，如下：\n\n**示例列表 3-28** – 配置示例：List 嵌套 List\n\n```xml\n<constructor-arg name=\"\
  nestedList\">\n    <list>\n        <list>\n            <value>嵌套列表中的一个简单 String\
  \ 值</value>\n            <value>嵌套列表中的另一个简单 String 值</value>\n        </list>\n\
  \    </list>\n</constructor-arg>\n```\n\n上述示例列表中的 `<constructor-arg>` 元素为名为 `nestedList`\
  \ 的构造器参数提供值，其类型为 `List<List>`。嵌套的 `<list>` 元素代表 `List` 类型元素。同样，你可以在 `<list>` 元素内部使用\
  \ `<map>`、`<set>` 和 `<props>` 元素分别设置类型为 `List<Map>`、`List<Set>` 和 `List<Properties>`\
  \ 的属性或构造器参数值。与 `<list>` 元素类似，`<set>` 元素可以包含 `<set>`、`<list>`、`<map>` 或 `<props>`\
  \ 。对于 `<map>` 元素，可以使用 `<map>`、`<set>`、`<list>` 或 `<props>` 元素指定条目的键和值。\n\n下面的示例显示了如何为\
  \ `Map<List, Set>` 构造器参数指定值：\n\n**示例列表 3-29** – 配置示例：Map 包含 List 类型作为键和 Set 类型作为值\n\
  \n```xml\n<constructor-arg name=\"nestedListAndSetMap\">\n    <map>\n        <entry>\n\
  \            <key>\n                <list>\n                    <value>a List element</value>\n\
  \                </list>\n            </key>\n            <set>\n              \
  \  <value>a Set element</value>\n            </set>\n        </entry>\n    </map>\n\
  </constructor-arg>\n```\n\n上述示例显示 `nestedListAndSetMap` 构造器参数是 `Map` 类型，其键类型为 `List`，值类型为\
  \ `Set`。`<key>` 元素可以使用以下任何元素作为子元素：`<map>`、`<set>`、`<list>` 和 `<props>`。键可以使用 `<map>`、`<set>`、`<list>`\
  \ 或 `<props>` 元素定义。\n\n### 向集合类型添加 bean 引用\n\n你可以在 `<list>` 和 `<set>` 元素内部使用 `<ref>`\
  \ 元素将 bean 引用添加到类型为 `List` 和 `Set` 的属性和构造器参数中。\n\n接下来的示例显示了如何向 `List` 类型构造器参数添加\
  \ bean 引用：\n\n**示例列表 3-30** – 配置示例：包含 bean 引用的 List\n\n```xml\n<bean .....>\n  \
  \  <constructor-arg name=\"myList\">\n        <list>\n            <ref bean=\"aBean\"\
  \ />\n            <ref bean=\"bBean\" />\n        </list>\n    </constructor-arg>\n\
  </bean>\n<bean id=\"aBean\" class=\"somepackage.ABean\" />\n<bean id=\"bBean\" class=\"\
  somepackage.BBean\" />\n```\n\n上述示例显示 `myList` 构造器参数是 `List` 类型，它包含 2 个元素 - `aBean`\
  \ bean 和 `bBean` bean。`<ref>` 元素的 `bean` 属性指定了 `<ref>` 元素引用的 bean 名称。与 `<list>`\
  \ 元素类似，你可以在 `<set>` 元素内部使用 `<ref>` 元素向 `Set` 类型构造器参数或属性添加 bean 引用。对于 `<map>` 元素，你可以在\
  \ `<key>` 元素内部使用 `<ref>` 元素指定 bean 引用作为键，并使用 `<ref>` 元素指定 bean 引用作为值。接下来的示例显示了一个\
  \ `Map` 类型构造器参数，其键和值都是对 bean 的引用：\n\n**示例列表 3-31** – 配置示例：以 bean 引用作为键的 Map\n\n\
  ```xml\n<bean .....>\n    <constructor-arg name=\"myMapWithRef\">\n        <map>\n\
  \            <entry>\n                <key>\n                    <ref bean=\"aBean\"\
  \ />\n                </key>\n                <ref bean=\"bBean\" />\n         \
  \   </entry>\n        </map>\n    </constructor-arg>\n</bean>\n<bean id=\"aBean\"\
  \ class=\"somepackage.ABean\" />\n<bean id=\"bBean\" class=\"somepackage.BBean\"\
  \ />\n```\n\n上述示例显示 `myMapWithRef` 构造器参数是 `Map` 类型，它包含一个键值对，其中键是对 `aBean` bean 的引用，对应的值是对\
  \ `bBean` bean 的引用。\n\n### 向集合类型添加 bean 名称\n\n如果你想向 `List`、`Map` 或 `Set` 构造器参数或属性添加\
  \ bean 名称（由 `<bean>` 元素的 `id` 属性指定），可以在 `<map>`、`<set>` 和 `<list>` 元素内部使用 `<idref>`\
  \ 元素。下面的示例显示了一个 `Map` 类型构造器参数，其键和值都是对 bean 的引用：\n\n**示例列表 3-32** – 配置示例：以 bean 名称作为键、bean\
  \ 引用作为值的 Map\n\n```xml\n<constructor-arg name=\"myExample\">\n    <map>\n      \
  \  <entry>\n            <key>\n                <idref bean=\"sampleBean\" />\n \
  \           </key>\n            <ref bean=\"sampleBean\" />\n        </entry>\n\
  \    </map>\n</constructor-arg>\n<bean id=\"sampleBean\" class=\"somepackage.SampleBean\"\
  \ />\n```\n\n示例显示 `myExample` 构造器参数是 `Map` 类型，键为字符串 `sampleBean`，值为 `sampleBean`\
  \ bean。可以使用 `<value>` 元素设置 `sampleBean` 字符串作为键，但使用 `<idref>` 元素是因为 Spring 容器在部署时会验证\
  \ `sampleBean` bean 是否存在。\n\n**注意** 你可以在 `<property>` 或 `<constructor-arg>` 元素内部使用\
  \ `<idref>` 元素将 bean 名称设置为值。\n\n### 向集合类型添加空值\n\n你可以使用 `<null>` 元素向 `Set` 和 `List`\
  \ 类型的集合添加空值。下面的示例显示了如何使用 `<null>` 元素向 `Set` 类型构造器参数添加空值：\n\n**示例列表 3-33** – 配置示例：包含空元素的\
  \ Set\n\n```xml\n<constructor-arg name=\"setWithNull\">\n    <set>\n        <value>Element\
  \ 1</value>\n        <value>Element 2</value>\n        <null />\n    </set>\n</constructor-arg>\n\
  ```\n\n在上述示例中，`setWithNull` 构造器参数包含三个元素：`Element 1`、`Element 2` 和 `null`。\n\n要向\
  \ `Map` 类型构造器参数或属性添加空键，可以在 `<key>` 元素内部使用 `<null>` 元素。同样，要添加空值，可以在 `<entry>` 元素内部添加\
  \ `<null>` 元素。下面的示例显示了一个包含空键和空值的 `Map` 类型构造器参数：\n\n**示例列表 3-34** – 配置示例：包含空键和空值的\
  \ Map\n\n```xml\n<constructor-arg name=\"mapType\">\n    <map>\n        <entry>\n\
  \            <key>\n                <null />\n            </key>\n            <null\
  \ />\n        </entry>\n    </map>\n</constructor-arg>\n```\n\n上述示例显示使用 `<null>`\
  \ 元素向 `mapType` 构造器参数添加了一个具有空键和空值的元素。\n\n\n\n\n\n**注意** 你也可以在 `<property>` 和 `<constructor-arg>`\
  \ 元素内部使用 `<null>` 元素来分别为属性和构造参数设置空值。\n\n现在让我们来看如何为数组类型的属性和构造参数指定值。\n\n### 为数组指定值\n\
  \n如果 bean 类定义了一个数组类型的属性，你可以使用 `<property>` 元素的 `<array>` 子元素来设置其值。同样，你可以使用 `<constructor-arg>`\
  \ 元素的 `<array>` 子元素来设置数组类型的构造参数。\n\n下面的示例列表展示了如何设置类型为 `int[]` 的 bean 属性：\n\n**示例列表\
  \ 3-35** – 配置示例：设置类型为 `int[]` 的 bean 属性的值\n\n```xml\n<property name=\"numbersProperty\"\
  >\n    <array>\n        <value>1</value>\n        <value>2</value>\n    </array>\n\
  </property>\n```\n\n在上面的示例列表中，`<array>` 元素的每个 `<value>` 子元素代表 `numbersProperty`\
  \ 数组中的一个元素。注册到 Spring 容器的属性编辑器（property editors）用于将每个 `<value>` 元素指定的字符串值转换为 `int`\
  \ 类型。你可以在 `<list>`,`<set>` 和 `<map>` 元素内部使用 `<array>` 元素。你也可以在 `<array>` 元素内部使用\
  \ `<list>`,`<set>`,`<map>`,`<props>` 和 `<ref>` 元素分别创建 List、Set、Map、Properties 和\
  \ bean 引用的数组。如果你想创建一个数组，可以在 `<array>` 元素内部使用 `<array>` 元素。\n\n我们之前讨论过 `<list>`,`<map>`\
  \ 和 `<set>` 元素分别用于设置类型为 List、Map 和 Set 的属性或构造参数。现在来看 Spring 为这些每个元素创建的默认集合实现。\n\n\
  ### `<list>`,`<set>` 和 `<map>` 元素的默认集合实现\n\n下表显示了 Spring 为 `<list>`,`<set>` 和 `<map>`\
  \ 元素创建的默认集合实现：\n\n| 集合元素 | Spring 创建的默认集合实现 |\n| :--- | :--- |\n| `<list>` | `java.util.ArrayList`\
  \ |\n| `<set>` | `java.util.LinkedHashSet` |\n| `<map>` | `java.util.LinkedHashMap`\
  \ |\n\n上述表格表明：\n\n- 如果属性（或构造参数）的值使用 `<list>` 元素指定，Spring 会创建一个 `ArrayList` 实例并将其赋值给属性（或构造参数）。\n\
  - 如果属性（或构造参数）的值使用 `<set>` 元素指定，Spring 会创建一个 `LinkedHashSet` 实例并将其赋值给属性（或构造参数）。\n\
  - 如果属性（或构造参数）的值使用 `<map>` 元素指定，Spring 会创建一个 `LinkedHashMap` 实例并将其赋值给属性（或构造参数）。\n\
  \n你可能希望为 bean 属性或构造参数替换不同的 List、Set 或 Map 实现。例如，你可能不想使用 `java.util.ArrayList`，而是想为类型为\
  \ `List` 的 bean 属性分配 `java.util.LinkedList` 实例。在这种情况下，建议使用 Spring util schema（在第\
  \ 3-8 节中解释）中的 `<list>`,`<map>` 和 `<set>` 元素。Spring util schema 中的 `<list>`,`<set>`\
  \ 和 `<map>` 元素提供了指定要赋值给 bean 属性或构造参数的具体集合类的全限定类名的选项。\n\n现在让我们来看 Spring 提供的一些内置属性编辑器。\n\
  \n## 3-5 内置属性编辑器\n\nSpring 提供了一些内置的属性编辑器，在设置 bean 属性和构造参数时非常有用。让我们快速查看 `CustomCollectionEditor`,\
  \ `CustomMapEditor` 和 `CustomDateEditor` 内置属性编辑器。要查看内置属性器的完整列表，请参考 `org.springframework.beans.propertyeditors`\
  \ 包。\n\n### CustomCollectionEditor\n\n`CustomCollectionEditor` 属性编辑器负责将源 Collection（如\
  \ `java.util.LinkedList`）类型转换为目标 Collection（如 `java.util.ArrayList`）类型。默认情况下，`CustomCollectionEditor`\
  \ 为 `Set`, SortedSet` 和 `List` 类型注册。\n\n考虑下面的 `CollectionTypesExample` 类，它定义了类型为\
  \ `Set` 和 `List` 的属性（以及相应的 setter 方法）：\n\n**示例列表 3-36** – `CollectionTypesExample`\
  \ 类\n\n**项目** – `ch03-simple-types-examples`\n\n**源码位置** - `src/main/java/sample/spring/chapter03/beans`\n\
  \n```java\npackage sample.spring.chapter03.beans;\n\nimport java.util.List;\nimport\
  \ java.util.Set;\n\npublic class CollectionTypesExample {\n  private Set setType;\n\
  \  private List listType;\n\n    //.....\n\n    // 属性的 setter 方法\n    public void\
  \ setSetType(Set setType) {\n        this.setType = setType;\n    }\n}\n```\n\n\
  `CollectionTypesExample` 类分别定义了类型为 `Set` 和 `List` 的属性（以及相应的 setter 方法）。\n\n**示例列表\
  \ 3-37** – `CollectionTypesExample` 的 `applicationContext.xml` bean 定义\n\n**项目**\
  \ – `ch03-simple-types-examples`\n\n**源码位置** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean class=\"sample.spring.chapter03.beans.CollectionTypesExample\">\n\
  \    <property name=\"listType\">\n        <list>\n            <value>1</value>\n\
  \            <value>2</value>\n        </list>\n    </property>\n    <property name=\"\
  setType\">\n        <set>\n            <value>1</value>\n            <value>2</value>\n\
  \        </set>\n    </property>\n</bean>\n```\n\n你可能会认为上述配置是错误的，因为使用了 `<set>` 元素来设置\
  \ `listType`（类型为 List）的值，并使用了 `<list>` 元素来设置 `setType`（类型为 Set）。\n\n上述配置是完全合，Spring\
  \ 容器不会报错。这是因为 `CustomCollectionEditor` 在设置 `setType` 属性之前，会将对应 `<list>` 类型元素的 `ArrayList`\
  \ 实例转换为 `LinkedHashSet` 类型（Set 的实现）。同时，`CustomCollectionEditor` 在设置 `listType` 属性之前，会将对应\
  \ `<set>` 类型元素的 `LinkedHashSet` 实例转换为 `ArrayList` 类型（List 的实现）。\n\n![images/00019.jpg]\n\
  **图 3-4** – `CustomCollectionEditor` 将 `LinkedHashSet` 转换为 `ArrayList` 类型\n\n图 3-4\
  \ 显示了 `CustomCollectionEditor` 将 `LinkedHashSet` 类型转换为 `ArrayList` 类型，以便设置 `CollectionTypesExample`\
  \ 的 `listType` 属性。图中显示了 Spring 设置 `listType` 属性时执行的步骤顺序。首先，Spring 创建对应 `<set>` 元素的\
  \ `LinkedHashSet` 实例。由于 `listType` 属性类型为 `List`，`CustomCollectionEditor` 开始介入设置该属性的值。如果\
  \ bean 属性类型为 `List`，`CustomCollectionEditor` 会创建一个 `ArrayList` 实例并用 `LinkedHashSet`\
  \ 中的元素填充它。最后，`listType` 变量被设置为 `CustomCollectionEditor` 创建的 `ArrayList` 实现。\n\n\
  注意的是，如果属性或构造参数类型是具体的集合类（如 `LinkedList`），`CustomCollectionEditor` 仅创建该具体集合类的实例，并从源集合向其中添加元素。下图展示了一个\
  \ bean 属性类型为 `java.util.Vector`（具体集合类）的场景：\n\n![images/00020.jpg]\n**图 3-5** – `CustomCollectionEditor`\
  \ 将 `ArrayList` 转换为 `Vector` 类型\n\n\n\n\n\n上图显示 `CustomCollectionEditor` 创建了 `Vector`（一个具体的集合类）的实例，并从源集合\
  \ `ArrayList` 向其添加了元素。\n\n现在让我们来看 `CustomMapEditor` 属性编辑器。\n\n### CustomMapEditor\n\
  \n`CustomMapEditor` 属性编辑器负责将源 `Map` 类型（如 `HashMap`）转换为目标 `Map` 类型（如 `TreeMap`）。默认情况下，`CustomMapEditor`\
  \ 仅为 `SortedMap` 类型注册。\n\n图 3-6 展示了一个 `CustomMapEditor` 将 `LinkedHashMap`（源 `Map`\
  \ 类型）转换为 `TreeMap`（`SortedMap` 类型的实现）的场景。\n\n图 3-6 显示了 Spring 为设置 `mapType` 属性值所执行的步骤序列。首先，Spring\
  \ 创建与 `<map>` 元素对应的 `LinkedHashMap` 实例。由于 `mapType` 属性类型为 `SortedMap`，在设置 `mapType`\
  \ 属性值时，`CustomMapEditor` 登场了。`CustomMapEditor` 创建了一个 `TreeMap` 实例（`SortedSet` 接口的具体实现），将键值对从\
  \ `LinkedHashMap` 添加到新创建的 `TreeMap` 实例，并将该 `TreeMap` 实例赋值给 `mapType` 属性。\n\n![](img/00021.jpeg)\n\
  \n**图 3-6** `CustomMapEditor` 将 `LinkedHashMap`（源 Map 类型）转换为 `TreeMap`（目标 Map 类型）类型\n\
  \n### CustomDateEditor\n\n`CustomDateEditor` 是用于 `java.util.Date` 类型 bean 属性和构造函数参数的属性编辑器。`CustomDateEditor`\
  \ 支持自定义的 `java.text.DateFormat`，用于将日期/时间字符串格式化为 `java.util.Date` 类型对象，并将 `java.util.Date`\
  \ 类型对象解析为日期/时间字符串。在下一节中，我们将看到如何使用 `CustomDateEditor` 设置 `java.util.Date` 的 bean\
  \ 属性和构造函数参数。在 `ch03-simple-types-examples` 项目中，`CustomDateEditor` 将 bean 属性（参考 `BankDetails`\
  \ 类的 `dateOfInception` 属性）或构造函数参数（参考 `DataTypesExample` 类的 `dateType` 构造函数参数）的字符串值转换为\
  \ `java.util.Date` 类型。\n\n在 `ch03-simple-types-examples` 项目中，bean 使用的其他一些内置属性编辑器包括：`ByteArrayPropertyEditor`\
  \ 用于将字符串值转换为 `byte[]`（参考 `BankDetails` 类的 `bankPrimaryBusiness` 属性）、`CurrencyEditor`\
  \ 用于将货币代码转换为 `java.util.Currency` 对象（参考 `BankDetails` 类的 `primaryCurrency` 属性）、`CharacterArrayPropertyEditor`\
  \ 用于将字符串值转换为 `char[]`（参考 `BankDetails` 类的 `headOfficeAddress` 属性）等。\n\n现在让我们来看如何向\
  \ Spring 容器注册属性编辑器。\n\n## 3-6 与 Spring 容器注册属性编辑器\n\nSpring 的 `BeanWrapperImpl` 类向\
  \ Spring 容器注册了几个内置属性编辑器。例如，`CustomCollectionEditor`、`CustomMapEditor`、`CurrencyEditor`、`ByteArrayPropertyEditor`\
  \ 和 `CharacterArrayEditor` 属性编辑器默认注册在 Spring 容器中。但 `CustomDateEditor` 属性编辑器并没有默认注册到\
  \ Spring 容器。要向 Spring 容器注册属性编辑器，你可以使用 Spring 的特殊 bean `CustomEditorConfigurer`。`CustomEditorConfigurer`\
  \ 类实现了 Spring 的 `BeanFactoryPostProcessor` 接口（在第 5 章第 5-4 节详细说明），它会被 Spring 容器自动检测并执行。\n\
  \n在 `ch03-simple-types-examples` 项目中，`BankDetails` 类（参考示例 3-24）定义了一个类型为 `java.util.Date`\
  \ 的 `dateOfInception` 属性。`dateOfInception` 属性指定的值为‘30-01-2012’（参考示例 3-25）。为了将字符串值‘30-01-2012’转换为\
  \ `java.util.Date` 类型，你必须为 `java.util.Date` 类型注册自定义属性编辑器，或者向 Spring 容器注册 Spring\
  \ 内置的 `CustomDateEditor` 属性编辑器。\n\n向 Spring 容器注册属性编辑器需要执行以下操作：\n\n1. 创建实现 Spring\
  \ `PropertyEditorRegistrar` 接口的类。该类负责向 Spring 容器注册属性编辑器。\n\n2. 在应用上下文 XML 文件中将 `PropertyEditorRegistrar`\
  \ 实现配置为 Spring bean。\n\n3. 在应用上下文 XML 文件中配置 Spring 的特殊 bean `CustomEditorConfigurer`，并为其提供对\
  \ `PropertyEditorRegistrar` 实现的引用（你在第 1 步中创建并在第 2 步中配置的）。\n\n现在来看看 `ch03-simple-types-examples`\
  \ 项目中 `CustomDateEditor` 是如何注册到 Spring 容器的。\n\n### 创建 PropertyEditorRegistrar 实现\n\
  \n以下示例显示了实现 `PropertyEditorRegistrar` 接口的 `MyPropertyEditorRegistrar` 类：\n\n**示例\
  \ 3-38** – MyPropertyEditorRegistrar 类\n\n**项目** – ch03-simple-types-examples\n\n\
  **源码位置** - `src/main/java/sample/spring/chapter03/beans`\n\n```\npackage sample.spring.chapter03.beans;\n\
  \nimport java.text.SimpleDateFormat;\n\nimport java.util.Date;\n\nimport org.springframework.beans.PropertyEditorRegistrar;\n\
  \nimport org.springframework.beans.PropertyEditorRegistry;\n\nimport org.springframework.beans.propertyeditors.CustomDateEditor;\n\
  \npublic class MyPropertyEditorRegistrar implements PropertyEditorRegistrar {\n\n\
  \    @Override\n    public void registerCustomEditors(PropertyEditorRegistry registry)\
  \ {\n        registry.registerCustomEditor(Date.class, new CustomDateEditor(\n \
  \           new SimpleDateFormat(\"dd-MM-yyyy\"), false));\n    }\n}\n```\n\n上面的示例显示\
  \ `MyPropertyEditorRegistrar` 类实现了 `PropertyEditorRegistrar` 接口，并提供了 `registerCustomEditors`\
  \ 的实现。传递给 `registerCustomEditors` 的 `PropertyEditorRegistry` 实例用于注册属性编辑器。`PropertyEditorRegistry`\
  \ 的 `registerCustomEditor` 用于向容器注册 `CustomDateEditor`。\n\n### 配置 CustomEditorConfigurer\
  \ 类\n\n以下示例显示如何在应用上下文 XML 文件中配置 `CustomEditorConfigurer` 类：\n\n**示例 3-39** – applicationContext.xml\
  \ - CustomEditorConfigurer 配置\n\n**项目** – ch03-simple-types-examples\n\n**源码位置**\
  \ - `src/main/resources/META-INF/spring`\n\n```xml\n<bean id=\"myPropertyEditorRegistrar\"\
  \ class=\"sample.spring.chapter03.beans.MyPropertyEditorRegistrar\" />\n\n<bean\
  \ id=\"editorConfigurer\" class=\"org.springframework.beans.factory.config.CustomEditorConfigurer\"\
  >\n    <property name=\"propertyEditorRegistars\">\n        <list>\n           \
  \ <ref bean=\"myPropertyEditorRegistrar\"/>\n        </list>\n    </property>\n\
  </bean>\n```\n\n在上面的示例中，`myPropertyEditorRegistrar` bean 定义将 `MyPropertyEditorRegistrar`\
  \ 类配置为 Spring bean。`MyPropertyEditorRegistrar` 类实现了 `PropertyEditorRegistrar` 接口，负责向\
  \ Spring 容器注册额外的属性编辑器。`CustomEditorConfigurer` 的 `propertyEditorRegistars` 属性指定了一个\
  \ `PropertyEditorRegistrar` 实现列表。在上面的示例中，`myPropertyEditorRegistrar` 被指定为 `propertyEditorRegistars`\
  \ 属性的值之一。`CustomEditorConfigurer` bean 会被 Spring 容器自动检测并执行，从而由 `MyPropertyEditorRegistrar`\
  \ 实例注册属性编辑器。\n\n\n\n\n为了让应用上下文 XML 文件中的 bean 定义更加简洁，Spring 提供了 `p` 和 `c` 命名空间，分别用于指定\
  \ bean 属性和构造函数参数的值。`p` 和 `c` 命名空间分别是使用 `<property>` 和 `<constructor-arg>` 元素的替代方案。\n\
  \n让我们先看 p 命名空间。\n\n**导入** `chapter 3/ch03-namespaces-example`(该项目展示了一个 Spring 应用，其中通过\
  \ `p` 和 `c` 命名空间分别设置了 bean 属性和构造函数参数。要运行该应用程序，请执行项目中 `SampleApp` 类的 main 方法)\n\n\
  ### p-命名空间\n\n要使用 `p-namespace` 设置 bean 属性，请将 bean 属性指定为 `<bean>` 元素的属性，并指定每个 bean\
  \ 属性位于 `p-namespace` 中。\n\n接下来的 bean 定义展示了如何使用 `p-namespace` 设置 bean 属性：\n\n**示例\
  \ 3-40** – `applicationContext.xml` - p-namespace 示例\n\n**项目** – `ch03-namespaces-example`\n\
  \n**源码位置** - `src/main/resources/META-INF/spring`\n\n```\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\
  \nxmlns:p=\"http://www.springframework.org/schema/p\" xsi:schemaLocation=\".....\"\
  >\n    <bean id=\"bankDetails\" class=\"sample.spring.chapter03.beans.BankDetails\"\
  \n        p:bankName=\"My Personal Bank\" p:bankPrimaryBusiness=\"Retail banking\"\
  \n        p:headOfficeAddress=\"Address of head office\" p:privateBank=\"Y\"\n \
  \       p:primaryCurrency=\"INR\" p:dateOfInception=\"30-01-2012\"\n        p:branchAddresses-ref=\"\
  branchAddresses\"/>\n    .....\n</beans>\n```\n\n在上面所示的应用上下文 XML 文件中，通过 `xmlns`\
  \ 属性指定了 `p-namespace`。`bankDetails` bean 定义使用了 `p-namespace` 的 `p` 前缀来指定 bean 属性。如果你将上面的示例与示例列表\
  \ 3-25 进行比较，你会发现上面的示例更加简洁。虽然可以混合使用 `<property>` 元素和 `p-namespace` 来指定 bean 属性，但建议选择一种样式来指定\
  \ bean 属性并在 bean 定义中保持一致。\n\n**注意** 由于 `p-namespace` 是作为 Spring 的一部分实现的，因此没有对应 `p-namespace`\
  \ 的 schema。因此，在示例 3-40 中没有看到任何对应 `p-namespace` 的 schema 。如果你希望 IDE 在使用 `p-namespace`\
  \ 时自动补全 bean 属性名，请考虑使用 IntelliJ IDEA 或 SpringSource Tool Suite (STS)。\n\n如果 bean\
  \ 属性不是对另一个 bean 的引用，则使用以下语法指定：\n\n`p:<property-name>=\"<property-value>\"`\n\n这里，`<property-name>`\
  \ 是 bean 属性的名称，`<property-value>` 是 bean 属性的值。\n\n如果 bean 属性是对另一个 bean 的引用，则使用以下语法指定：\n\
  \n`p:<property-name>-ref=\"<bean-reference>\"`\n\n这里，`<property-name>` 是 bean 属性的名称，`<bean-reference>`\
  \ 是被引用 bean 的 id（或名称）。需要注意的是，bean 属性的名称后面跟着 `-ref`。由于 `BankDetails` bean 的 `branchAddresses`\
  \ 属性代表对 `branchAddresses` bean 的引用，因此在示例 3-40 中，`branchAddresses` 属性被指定为 `p:branchAddresses-ref`。\n\
  \n现在让我们如何使用 `c-namespace` 设置构造函数参数。\n\n### c-命名空间\n\n要使用 `c-namespace` 为构造函数参数提供值，请将构造函数参数指定为\
  \ `<bean>` 元素的属性，并指定每个构造函数参数位于 `c-namespace` 中。\n\n下面的示例展示了 `BankStatement` 类，我们将使用\
  \ `c-namespace` 将配置为 Spring bean。\n\n**示例 3-41** – `BankStatement` 类\n\n**项目** –\
  \ `ch03-namespaces-example`\n\n**源码位置** - `src/main/java/sample/spring/chapter03/beans`\n\
  \n```java\npackage sample.spring.chapter03.beans;\n\nimport java.beans.ConstructorProperties;\n\
  \npublic class BankStatement {\n    .....\n    @ConstructorProperties({ \"transactionDate\"\
  , \"amount\", \"transactionType\", \"referenceNumber\" })\n    public BankStatement(Date\
  \ transactionDate, double amount, String transactionType, String referenceNumber)\
  \ {\n        this.transactionDate = transactionDate;\n        this.amount = amount;\n\
  \        .....\n    }\n    .....\n}\n```\n\n接下来的 `BankStatement` 类的 bean 定义展示了如何使用\
  \ `c-namespace` 设置构造函数参数的值：\n\n**示例 3-42** – `applicationContext.xml` - c-namespace\n\
  \n**项目** – `ch03-namespaces-example`\n\n**源码位置** - `src/main/resources/META-INF/spring`\n\
  \n```\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\nxmlns:c=\"\
  http://www.springframework.org/schema/c\"\nxsi:schemaLocation=\".....\">\n    .....\n\
  \    <bean id=\"bankStatement\" class=\"sample.spring.chapter03.beans.BankStatement\"\
  \n        c:transactionDate=\"30-01-2012\"\n        c:amount=\"1000\"\n        c:transactionType=\"\
  Credit\"\n        c:referenceNumber=\"1110202\" />\n    .....\n</beans>\n```\n\n\
  在上面的示例中，通过 `xmlns` 属性指定了 `c-namespace`。`bankStatement` bean 定义使用了 `c-namespace`\
  \ 的 `c` 前缀。使用 `c-namespace` 指定构造函数参数的语法与我们在 `p-namespace` 情况中看到的相似。\n\n**注意** 由于\
  \ `c-namespace` 是作为 Spring 的一部分实现的，因此没有对应 `c-namespace` 的 schema。因此，在示例 3-42 中没有看到任何对应\
  \ `c-namespace` 的 schema 。如果你希望 IDE 自动补全参数名称，请考虑使用 IntelliJ IDEA 或 SpringSource\
  \ Tool Suite (STS)。\n\n如果构造函数参数不是对另一个 bean 的引用，则使用以下语法指定：\n\n`c:<property-name>=\"\
  <property-value>\"`\n\n这里，`<property-name>` 是构造函数参数的名称，`<property-value>` 是构造函数参数的值。\n\
  \n如果构造函数参数是对另一个 bean 的引用，则使用以下语法指定：\n\n`c:<property-name>-ref=\"<bean-reference>\"\
  `\n\n这里，`<property-name>` 是构造函数参数的名称，`<bean-reference>` 是被引用 bean 的 id（或名称）。需要注意的是，构造函数参数的名称后面跟着\
  \ `-ref`。例如，如果一个名为 `myargument` 的构造函数参数代表对 id 为 `x` 的 bean 的引用，你将该参数指定为：\n\n`c:myargument-ref=\"\
  x\"`\n\n如提到，如果编译时开启了调试标记，构造函数参数名称将保留在生成的 .class 文件中。如果 `BankStatement` 类时没有开启调试标记，示例\
  \ 3-42 中的配置将无法工作。在这种情况下，你使用索引为构造函数参数提供值，如下：\n\n**示例 3-43** – 使用索引为构造函数参数提供值\n\n\
  ```\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\nxmlns:c=\"http://www.springframework.org/schema/c\"\
  \nxsi:schemaLocation=\".....\">\n    .....\n    <bean id=\"bankStatement\" class=\"\
  sample.spring.chapter03.beans.BankStatement\"\n        c:_0=\"30-01-2012\"\n   \
  \     c:_1=\"1000\"\n        c:_2=\"Credit\"\n        c:_3=\"1110202\" />\n    .....\n\
  </beans>\n```\n\n\n\n\n上面的示例列表显示了 `BankStatement` 类的 bean 定义，它使用构造函数参数索引而不是构造参数名称来提供值。需要注意的是，构造函数参数的索引以下划线\
  \ `underscore` 为前缀，因为 XML 中的属性名称`不能`以数字值开头。如果构造函数参数是对另一个 bean 的引用，则在构造函数参数的索引上添加\
  \ `-ref`。例如，如果索引为 0 的构造函数参数代表对另一个 bean 的引用，则指定为 `c:_0-ref`。虽然可以使用 `<constructor-arg>`\
  \ 元素和 `c-namespace` 组合来指定构造函数参数，但建议选择一种指定构造函数参数的并在 bean 定义中保持一致。\n\n我们之前已经看到`<list>`、`<map>`\
  \ 和 `<set>` 元素分别用于设置类型为 `List`、`Map` 和 `Set` 的属性或构造函数参数。现在，让我们来看看 Spring 的 util\
  \ 模式（schema），它简化了集合类型、`Properties` 类型、常量等的创建，并将它们暴露为 Spring bean。\n\n## 3-8 Spring\
  \ 的 util 模式\n\nSpring 的 util 模式通过提供一种简洁的方式来执行常见的配置任务，简化了 bean 的配置。下表描述了 util 模式的各种元素：\n\
  \n| 元素 | 描述 |\n| :--- | :--- |\n| `<list>` | 创建一个 `java.util.List` 类型并将其暴露为 bean\
  \ |\n| `<map>` | 创建一个 `java.util.Map` 类型并将其暴露为 bean |\n| `<set>` | 创建一个 `java.util.Set`\
  \ 类型并将其暴露为 bean |\n| `<constant>` | 将类型上的公共静态字段暴露为 bean |\n| `<property-path>` |\
  \ 将 bean 属性暴露为 bean |\n| `<properties>` | 从属性文件中创建 `java.util.Properties` 并将其暴露为\
  \ bean |\n\n**注意** Spring util 模式的所有元素都接受 `scope` 属性，该属性用于标识暴露的 bean 是单例（singleton）还是原型（prototype）作用域。\n\
  \nSpring 提供了一个 `FactoryBean` 接口，可以通过实现该接口来创建一个负责创建 bean 实例的工厂对象。与其使用上表提到的 util 模式元素，可以使用\
  \ Spring 提供的开箱即用的 `FactoryBean` 实现来实现相同的功能。在本节中，我们将查看 util 模式的元素以及你可以用来替代 util 模式元素的内置\
  \ `FactoryBean` 实现。\n\n**导入** `chapter 3/ch03-util-schema-examples`(此项目展示了一个利用 Spring\
  \ util 模式元素创建 `List`、`Set`、`Map` 等共享实例的 Spring 应用程序。要运行该程序，请执行该项目中 `SampleApp` 类的主方法)\n\
  \n让我们先来看 `<list>` 元素。\n\n### <list>\n\nSpring util 模式的 `<list>` 元素用于创建类型为 `java.util.List`\
  \ 的对象如下所示：\n\n**示例 3-44 –** `applicationContext.xml` - util 模式的 `<list>` 元素\n\n\
  **项目 –** `ch03-util-schema-examples`\n\n**源码位置 -** `src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\n       \
  \ xmlns:util=\"http://www.springframework.org/schema/util\"\n        xsi:schemaLocation=\"\
  ..... http://www.springframework.org/schema/util\n        http://www.springframework.org/schema/util/spring-util-4.0.xsd\"\
  >\n\n    <bean id=\"dataTypes\" class=\"sample.spring.chapter03.beans.DataTypesExample\"\
  >\n        .....\n        <constructor-arg name=\"listType\" ref=\"listType\" />\n\
  \        .....\n    </bean>\n\n  <util:list id=\"listType\" list-class=\"java.util.ArrayList\"\
  >\n             <value>A simple String value in list</value>\n             <value>Another\
  \ simple String value in list</value>\n  </util:list>\n</beans>\n```\n\n首先，你需要包含\
  \ Spring 的 util 模式以访问其元素。在上面的示例列表中，util 模式的 `<list>` 元素创建 `java.util.ArrayList`\
  \ 实例并将其暴露为 bean。`id` 属性指定了暴露 `java.util.ArrayList` 实例的 bean id，`list-class` 属性指定了你想创建的\
  \ `java.util.List` 的具体实现。如果你没有指定 `list-class` 属性，默认将创建一个 `java.util.ArrayList` 实例。Spring\
  \ beans 模式的 `<value>` 元素用于指定列表的单个元素。\n\n由于 util 模式的 `<list>` 元素将 `List` 实例暴露为 bean，你可以从其他\
  \ bean 引用暴露的 `List` 实例。例如，在上面的示例列表中，`DataTypesExample` bean 的 `listType` 构造参数（类型为\
  \ `java.util.List`）指定 `listType` 为 util 模式 `<list>` 元素的值。\n\n如果你将 util 模式的 `<list>`\
  \ 元素与 beans 模式的 `<list>` 元素（列表 27）相比，你会发现 util 模式的 `<list>` 让你控制实现实现。例如，如果你想创建一个\
  \ `Vector`，请指定 `list-class` 属性。\n\n现在让我们来看看替代 util 模式 `<list>` 元素的 `FactoryBean`。`FactoryBean`\
  \ 是创建 `List` 实例并将其暴露为 bean 的模式 `<list>` 元素的替代方案。\n\n```xml\n<beans ...>\n  <bean\
  \ id=\"dataTypes\" class=\"sample.spring.chapter03.beans.DataTypesExample\">\n \
  \   <constructor-arg name=\"listType\" ref=\"listType\" />\n  </bean>\n\n  <bean\
  \ id=\"listType\" class=\"org.springframework.beans.factory.FactoryBean\">\n   \
  \ <property name=\"sourceList\">\n      <list>\n        <value>A simple String value\
  \ in list</value>\n        <value>Another simple String value in list</value>\n\
  \      </list>\n    </property>\n  </bean>\n</beans>\n```\n\n在上面的示例列表中，`FactoryBean`\
  \ 的 `sourceList` 属性指定了列表中的元素。默认情况下，`FactoryBean` 创建 `java.util.ArrayList` 实例。如果你想让\
  \ `FactoryBean` 创建其他 `List` 实现（如 `Vector`），请设置 `targetListClass` 属性。`targetListClass`\
  \ 属性指定了 `FactoryBean` 创建的 `java.util.List` 具体实现类的全限定名。\n\n如果你对比示例 44 和 45，你会发现使用\
  \ util 模式的 `<list>` 比使用 `FactoryBean` 创建 `List` 实例简单得多。\n\n### <map>\n\nSpring util\
  \ 模式的 `<map>` 元素用于创建类型为 `java.util.Map` 的对象并将其暴露为 bean，如下所示：\n\n**示例 3-46 –** `applicationContext.xml`\
  \ - util 模式的 `<map>` 元素\n\n**项目 –** `ch03-util-schema-examples`\n\n**源码位置 -** `src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\n       \
  \ xmlns:util=\"http://www.springframework.org/schema/util\"\n        xsi:schemaLocation=\"\
  ..... http://www.springframework.org/schema/util\n        http://www.springframework.org/schema/util/spring-util-4.0.xsd\"\
  >\n\n    <bean id=\"dataTypes\" class=\"sample.spring.chapter03.beans.DataTypesExample\"\
  >\n        <constructor-arg name=\"mapType\" ref=\"mapType\" />\n    </bean>\n\n\
  \  <util:map id=\"mapType\" map-class=\"java.util.TreeMap\">\n      <entry key=\"\
  map key 1\" value=\"map key 1’s value\"/>\n  </util:map>\n\n</beans>\n```\n\n\n\n\
  \n\n在上面的示例列表中，`util` 模式的 `<map>` 元素创建 `java.util.TreeMap` 实例并将其暴露为 bean。`id` 属性指定了该\
  \ bean 供其他 bean 使用的 ID，`map-class` 属性指定了由 `<map>` 元素创建的 `java.util.Map` 接口的具体实现类的全限定名。Spring\
  \ beans 模式的 `<entry>` 元素指定了创建的 `Map` 实例中的键值对。\n\n由于 `<map>` 元素将 `Map` 实例暴露为 bean，因此可以在其他\
  \ bean 中引用此暴露的 `Map` 实例。例如，在上面的示例列表中，`DataTypesExample` 的构造函数参数 `mapType`（类型为 `java.util.Map`）将\
  \ `ref` 属性指定为 `mapType` 来引用 `TreeMap` 实例。\n\n注意：我们在在本章之前看到 `<key>` 和 `<value>` 子元素用于指定\
  \ `Map` 实例中包含的键值对。示例 3-46 显示，你也可以通过 `<entry>` 元素的 `key` 和 `value` 属性来指定 `Map` 实例中包含的键值对。\n\
  \n如果你将上述示例中 `util` 模式的 `<map>` 元素与示例 3-27 中 beans 模式的 `<map>` 元素对比，你会发现 `util 模式的\
  \ `<map>` 元素让你控制要创建的 `Map` 实现。例如，如果你想使用 `LinkedHashMap` 而不是 `TreeMap`，请将 `java.util.LinkedHashMap`\
  \ 指定为 `map-class` 属性的值。如果没有指定 `map-class` 属性，Spring 容器默认创建一个 `java.util.LinkedHashMap`\
  \ 实例。\n\n现在让我们来看 Spring 的 `MapFactoryBean`，你可以用它代替 `util` 模式的 `<map>` 元素。\n\n###\
  \ MapFactoryBean\n\n可以使用 Spring 的 `MapFactoryBean` 代替 `util` 模式的 `<map>` 元素——这是一个用于创建\
  \ `java.util.Map` 实例并将其作为 Spring bean 的工厂。\n\n下面的示例显示了如何使用 `MapFactoryBean`：\n\n\
  示例 3-47 – MapFactoryBean 示例\n\n```xml\n<beans .....>\n    <bean id=\"dataTypes\"\
  \ class=\"sample.spring.chapter03.beans.DataTypesExample\">\n        .....\n   \
  \     <constructor-arg name=\"mapType\" ref=\"mapType\" />\n        .....\n    </bean>\n\
  \    <bean id=\"mapType\" class=\"org.springframework.beans.factory.config.MapFactoryBean\"\
  >\n        <property name=\"sourceMap\">\n            <map>\n                <entry\
  \ key=\"map key 1\" value=\"map key 1’s value\"/>\n            </map>\n        </property>\n\
  \    </bean>\n    .....\n</beans>\n```\n\n在上面的示例列表中，`MapFactoryBean` 的 `sourceMap`\
  \ 属性指定了由 `MapFactoryBean` 创建的 `Map` 实例中的键值对。默认情况下，`MapFactoryBean` 创建 `java.util.LinkedHashMap`\
  \ 实例。你可以通过设置 `targetMapClass` 属性来控制 `MapFactoryBean` 创建的 `Map` 实例。`targetMapClass`\
  \ 指定了 `java.util.Map` 接口的具体实现类的全限定名。例如，如果你将 `java.util.HashMap` 指定为 `targetMapClass`\
  \ 的值，`MapFactoryBean` 将创建一个 `java.util.HashMap` 实例。\n\n如果你对比示例 3-46 和 3-47，你会发现使用\
  \ `util` 模式的 `<map>` 元素创建 `Map` 实例的配置比 `MapFactoryBean` 更加简洁。\n\n### <set>\n\nSpring\
  \ `util` 模式的 `<set>` 元素用于创建 `java.util.Set` 类型的对象并将其暴露为 bean，如下所示：\n\n示例 3-48 –\
  \ applicationContext.xml - util 模式的 `<set>` 元素\n\nProject – ch03-util-schema-examples\n\
  Source location - src/main/resources/META-INF/spring\n\n```xml\n<beans .....\n \
  \   xmlns:util=\"http://www.springframework.org/schema/util\"\n    xsi:schemaLocation=\"\
  ..... http://www.springframework.org/schema/util\n      http://www.springframework.org/schema/util/spring-util-4.0.xsd\"\
  >\n    <bean id=\"dataTypes\" class=\"sample.spring.chapter03.beans.DataTypesExample\"\
  >\n        .....\n        <constructor-arg name=\"setType\" ref=\"setType\" />\n\
  \    </bean>\n    <util:set id=\"setType\" set-class=\"java.util.HashSet\">\n  \
  \      <value>Element 1</value>\n        <value>Element 2</value>\n    </util:set>\n\
  \    .....\n</beans>\n```\n\n在上面的示例列表中，`util` 模式的 `<set>` 元素创建一个 `HashSet` 实例并以\
  \ `setType` 为 ID 将其暴露为 Spring bean。`id` 属性指定了该 bean 供其他 bean 使用的 ID，`set-class`\
  \ 属性指定了由 `<set>` 元素创建的 `java.util.Set` 具体实现类。Spring beans 的 `<value>` 元素指定创建的 `Set`\
  \ 实例中的元素。由 `<set>` 元素创建的 `Set` 实例可以在其他 bean 中引用。例如，在上面的示例列表中，`DataTypesExample`\
  \ 的构造函数参数 `setType`（类型为 `java.util.Set`）引用了由 `<set>` 元素创建的 `HashSet` 实例。\n\n可以使用\
  \ Spring 的 `SetFactoryBean` 代替 `util` 模式的 `<set>` 元素来创建 `Set` 实例并将其暴露为 Spring bean。\n\
  \nSetFactoryBean\n\nSpring 的 `SetFactoryBean` 是用于创建 `java.util.Set` 类型实例的工厂对象。下面的示例显示了如何使用\
  \ `SetFactoryBean` 实现与 `util` 模式 `<set>` 元素相同的功能：\n\n示例 3-49 – SetFactoryBean\n\n\
  ```xml\n<beans .....>\n    <bean id=\"dataTypes\" class=\"sample.spring.chapter03.beans.DataTypesExample\"\
  >\n        .....\n        <constructor-arg name=\"setType\" ref=\"setType\" />\n\
  \        .....\n    </bean>\n    <bean id=\"setType\" class=\"org.springframework.beans.factory.config.SetFactoryBean\"\
  >\n        <property name=\"sourceSet\">\n            <set>\n                <value>Element\
  \ 1</value>\n                <value>Element 2</value>\n            </set>\n    \
  \    </property>\n    </bean>\n    .....\n</beans>\n```\n\n在上面的示例列表中，`SetFactoryBean`\
  \ 的 `sourceSet` 属性指定了 `SetFactoryBean` 创建的 `Set` 实例中的元素。`SetFactoryBean` 的 `targetSetClass`\
  \ 属性指定实现 `java.util.Set` 的类的全限定名。如果指定了 `targetSetClass` 属性，`SetFactoryBean` 将创建\
  \ `targetSetClass` 指定的类的实例并作为 Spring bean 提供。例如，如果你将 `java.util.HashSet` 指定为 `targetSetClass`\
  \ 的值，`SetFactoryBean` 将创建一个 `java.util.HashSet` 实例。如果没有指定 `targetSetClass` 属性，`SetFactoryBean`\
  \ 将创建一个 `java.util.LinkedHashSet` 实例。\n\n上面的示例显示，创建 `Set` 实例时，使用 `util` 模式的 `<set>`\
  \ 元素比使用 `SetFactoryBean` 更简洁。\n\n### <properties>\n\n如果你想从属性文件创建 `java.util.Properties`\
  \ 对象实例并将其暴露为 bean，那么 `util` 模式的 `<properties>` 元素将非常有用。\n\n下面的示例显示了如何使用 `<properties>`\
  \ 元素：\n\n示例 3-50 – applicationContext.xml - util 模式的 `<properties>` 元素\n\nProject\
  \ – ch03-util-schema-examples\nSource location - src/main/resources/META-INF/spring\n\
  \n```xml\n<beans .....\n    xmlns:util=\"http://www.springframework.org/schema/util\"\
  \n    xsi:schemaLocation=\"..... http://www.springframework.org/schema/util\n  \
  \    http://www.springframework.org/schema/util/spring-util-4.0.xsd\">\n    <bean\
  \ id=\"bankDetails\" class=\"sample.spring.chapter03.beans.BankDetails\">\n    \
  \    .....\n        <property name=\"branchAddresses\" ref=\"branchAddresses\" />\n\
  \    </bean>\n    .....\n    <util:properties id=\"branchAddresses\" location=\"\
  classpath:META-INF/addresses.properties\" />\n</beans>\n```\n\n\n\n\n\n在上面的示例列表中，`<properties>`元素创建了一个\
  \ `java.util.Properties` 实例，其中包含了从 `addresses.properties` 文件（由 `location` 属性指定）加载的属性，并将\
  \ `java.util.Properties` 实例暴露为以 `branchAddresses` 为 id（由 `id` 属性指定）的 bean。上面的示例还显示\
  \ `BankDetails` bean 的 `branchAddresses` 属性（类型为 `java.util.Properties`）引用了由 util\
  \ schema `<properties>` 元素创建的 `branchAddresses` bean。\n\n使用 `<properties>` 元素的替代方案是\
  \ Spring 的 `PropertiesFactoryBean`。\n\n### PropertiesFactoryBean\n\nSpring 的 `PropertiesFactoryBean`\
  \ 是用于创建 `java.util.Properties` 实例的工厂。\n\n下面的示例显示了如何使用 `PropertiesFactoryBean` 实现与\
  \ util schema 中 `<properties>` 元素相同的功能：\n\n**示例列表 3-51 – PropertiesFactoryBean 示例**\n\
  \n```xml\n<beans .....>\n    <bean id=\"bankDetails\" class=\"sample.spring.chapter03.beans.BankDetails\"\
  >\n        .....\n        <property name=\"branchAddresses\" ref=\"branchAddresses\"\
  \ />\n    </bean>\n    <bean id=\"branchAddresses\" class=\"org.springframework.beans.factory.config.PropertiesFactoryBean\"\
  >\n        <property name=\"location\" value=\"classpath:META-INF/addresses.properties\"\
  />\n    </bean>\n    .....\n</beans>\n```\n\n在上面的示例列表中，Spring `PropertiesFactoryBean`\
  \ 的 bean 定义通过从 `addresses.properties` 文件（由 `location` 属性指定）加载的属性创建了一个 `java.util.Properties`\
  \ 实例，并将该 `java.util.Properties` 实例暴露为以 `branchAddresses` 为 id 的 bean。\n\n### <constant>\n\
  \nutil schema 的 `<constant>`元素用于将对象的公共静态字段暴露为 Spring bean。\n\n下面的示例显示了 `<constant>`\
  \ 元素的用法示例：\n\n**示例列表 3-52 – applicationContext.xml - util schema 的 <constant> 元素**\n\
  \n**Project – ch03-util-schema-examples**\n**Source location - src/main/resources/META-INF/spring**\n\
  \n```xml\n<beans ..... xmlns:util=\"http://www.springframework.org/schema/util\"\
  \n      xsi:schemaLocation=\"..... http://www.springframework.org/schema/util\n\
  \      http://www.springframework.org/schema/util/spring-util-4.0.xsd\">\n    <bean\
  \ id=\"dataTypes\" class=\"sample.spring.chapter03.beans.DataTypesExample\">\n \
  \       .....\n        <constructor-arg name=\"booleanType\" ref=\"booleanTrue\"\
  \ />\n        .....\n    </bean>\n    <util:constant id=\"booleanTrue\" static-field=\"\
  java.lang.Boolean.TRUE\" />\n    .....\n</beans>\n```\n\nutil schema 的 `<constant>`\
  \ 元素将其 `static-field` 属性指定的值暴露为 Spring bean。在上面的示例列表中，`<constant>` 元素暴露了一个值为 `java.lang.Boolean.TRUE`\
  \ 且 id 为 `booleanTrue` 的 bean。你可以指定任何公共静态字段作为 `static-field` 属性的值，并在 Spring 容器中的其他\
  \ bean 中引用它。例如，在上面的示例列表中，`booleanType` bean 被 `DataTypesExample` 类型为 `boolean` 的\
  \ `booleanType` 构造函数参数引用。\n\n将公共静态字段暴露为 Spring bean 的一种不太简洁的方法是使用 Spring 的 `FieldRetrievingFactoryBean`。\n\
  \n### FieldRetrievingFactoryBean\n\nSpring 的 `FieldRetrievingFactoryBean` 是一个用于获取由\
  \ `FieldRetrievingFactoryBean` 的 `staticField` 属性指定的公共静态字段值的工厂。通过 `FieldRetrievingFactoryBean`\
  \ 获取的值被暴露为 bean。你也可以使用 `FieldRetrievingFactoryBean` 来获取非静态字段的值。\n\n下面的示例显示了 `FieldRetrievingFactoryBean`\
  \ 的用法示例：\n\n**示例列表 3-53 – FieldRetrievingFactoryBean 示例**\n\n```xml\n<beans .....>\n\
  \    <bean id=\"dataTypes\" class=\"sample.spring.chapter03.beans.DataTypesExample\"\
  >\n        .....\n        <constructor-arg name=\"booleanType\" ref=\"booleanTrue\"\
  \ />\n        .....\n    </bean>\n    <bean id=\"booleanTrue\" class=\"org.springframework.beans.factory.config.FieldRetrievingFactoryBean\"\
  >\n        <property name=\"staticField\" value=\" java.lang.Boolean.TRUE\"/>\n\
  \    </bean>\n    .....\n</beans>\n```\n\n在上面的示例列表中，`FieldRetrievingFactoryBean`\
  \ 获取了 `java.lang.Boolean.TRUE` 字段的值并将其暴露为 bean。由 `FieldRetrievingFactoryBean` 暴露的\
  \ bean 被 `DataTypesExample` 类型为 `boolean` 的 `booleanType` 构造函数参数引用。\n\n### <property-path>\n\
  \nutil schema 的 `<property-path>`元素用于将属性值暴露为 bean。\n\n下面的示例显示了 `<property-path>`\
  \ 的示例：\n\n**示例列表 3-54 – applicationContext.xml - util schema 的 <property-path> 元素**\n\
  \n**Project – ch03-util-schema-examples**\n**Source location - src/main/resources/META-INF/spring**\n\
  \n```xml\n<beans ..... xmlns:util=\"http://www.springframework.org/schema/util\"\
  \n      xsi:schemaLocation=\"..... http://www.springframework.org/schema/util\n\
  \      http://www.springframework.org/schema/util/spring-util-4.0.xsd\">\n    <bean\
  \ id=\"bankDetails\" class=\"sample.spring.chapter03.beans.BankDetails\">\n    \
  \    .....\n        <property name=\"branchAddresses\" ref=\"branchAddresses\" />\n\
  \        .....\n    </bean>\n    <util:property-path id=\"dateType\" path=\"dataTypes\"\
  \ />\n    <bean id=\"dataTypes\" class=\"sample.spring.chapter03.beans.DataTypesExample\"\
  >\n        .....\n        <property name=\"dateType\" value=\"30-01-12\" />\n  \
  \      .....\n    </bean>\n</beans>\n```\n\n在上面的示例列表中，`DataTypesExample` 的 `dateType`（类型为\
  \ `java.util.Date`）被指定为 `'30-01-12'`。`<property-path>`元素获取 `dataTypes` 属性并暴露为 id\
  \ 为 `dateType` 的 bean。`<property-path>` 的语法为 `<bean-name>.<bean-property>`，其中 `<bean-name>`\
  \ 是 bean 的 id 或名称，`<bean-property>` 是属性名称。\n\n由于 `<property-path>` 暴露了一个 bean，它可以被\
  \ Spring 容器中的其他 bean 引用。例如，在上面的示例列表中，`dateType` bean 被 `BankDetails` bean 的属性引用。\n\
  \n除了使用 `<property-path>` 元素外，你可以使用 Spring 的 `PropertyPathFactoryBean` 将属性值暴露为 bean。\n\
  \n### PropertyPathFactoryBean\n\n`PropertyPathFactoryBean` 是用于创建 bean 属性的 bean 实例的工厂。\n\
  \n下面的示例显示了如何使用 `PropertyPathFactoryBean`：\n\n**示例列表 3-55 – PropertyPathFactoryBean\
  \ 示例**\n\n```xml\n<beans ..... xmlns:util=\"http://www.springframework.org/schema/util\"\
  \n      xsi:schemaLocation=\"..... http://www.springframework.org/schema/util\n\
  \      http://www.springframework.org/schema/util/spring-util-4.0.xsd\">\n    <bean\
  \ id=\"bankDetails\" class=\"sample.spring.chapter03.beans.BankDetails\">\n    \
  \    .....\n        <property name=\"branchAddresses\" ref=\"dateType\" />\n   \
  \     .....\n    </bean>\n    <bean id=\"dataType\" class=\"org.springframework.beans.factory.config.PropertyPathFactoryBean\"\
  >\n        <property name=\"targetBeanName\" value=\"dataTypes\"/>\n        <property\
  \ name=\"propertyPath\" value=\"dateType\"/>\n    </bean>\n    <bean id=\"dataTypes\"\
  \ class=\"sample.spring.chapter03.beans.DataTypesExample\">\n        .....\n   \
  \     <property name=\"dateType\" value=\"30-01-12\" />\n        .....\n    </bean>\n\
  </beans>\n```\n\n\n\n\n在上面的示例列表中，`PropertyPathFactoryBean` 被用于创建一个 bean 实例，代表 `dataTypes`\
  \ bean 的 `dateType` 属性的值。`PropertyPathFactoryBean` 的 `targetBeanName` 属性指定包含该属性的\
  \ bean 的 id 或名称，而 `PropertyPathFactoryBean` 的 `propertyPath` 属性指定了要暴露为 bean 的属性名称。由\
  \ `PropertyPathFactoryBean` 创建的 bean 实例可以被 Spring 容器中的其他 bean 访问。在上面的示例列表中，由 `PropertyPathFactoryBean`\
  \ 创建的 `date` bean（此处原文为 dataType，应为 dateType）被 `BankDetails` bean 的 `dateOfInception`\
  \ 属性（类型为 `java.util.Date`）引用。\n\n现在，我们已经深入查看了 util 架构元素，让我们来看看 Spring 的 `FactoryBean`\
  \ 接口。\n\n## 3-9 FactoryBean 接口\n\nSpring 的 `FactoryBean` 接口由作为创建 bean 实例工厂的类实现。在上一节中，我们看到实现\
  \ `FactoryBean` 接口的类像其他 bean 一样在应用上下文 XML 文件中进行配置。如果你希望执行复杂的条件检查以决定创建哪种类型的 bean，并执行复杂的\
  \ bean 初始化逻辑，`FactoryBean` 特别有用。\n\n现在让我们来看一个应用场景，在该场景中我们将使用 `FactoryBean` 来选择 bean\
  \ 类型，然后创建它。\n\n### MyBank 应用 – 在数据库中存储事件\n\n在 MyBank 应用中，重要的事件（如贷记交易、定期存款开放和清空等）被保存在数据库中。MyBank\
  \ 可以直接将这些事件保存到数据库中，也可以通过先将事件发送到消息中间件或 Web 服务来间接保存。下表描述了 MyBank 应用定义的直接或间接保存事件的类：\n\
  \n| 类 | 描述 |\n| :--- | :--- |\n| `DatabaseEventSender` | 在数据库中保存事件功能的类 |\n| `MessagingEventSender`\
  \ | 包含将事件发送到消息中间件功能的类 |\n| `WebServiceEventSender` | 包含将事件发送到远程 Web 服务的类 |\n\n直接将事件保存到数据库或将它们发送到消息中间件或\
  \ Web 服务的决策基于配置。例如，如果 MyBank 发现存在 `database.properties` 文件，MyBank 会从 `database.properties`\
  \ 文件中读取配置信息（如数据库 URL、用户名和密码）并创建 `DatabaseEventSender` 实例。同样，如果存在 `messaging.properties`\
  \ 文件，MyBank 会创建一个 `MessagingEventSender` 实例；如果存在 `webservice.properties` 文件，则创建一个\
  \ `WebServiceEventSender` 实例。\n\n初始化 `DatabaseEventSender`、`MessagingEventSender`\
  \ 和 `WebServiceEventSender` 实例可能需要执行复杂的初始化逻辑。例如，你需要创建（或从 JNDI 获取）`javax.jms.ConnectionFactory`\
  \ 和 `javax.jms.Destination` 实例，并将它们设置在 `MessagingEventSender` 实例上，以便 `MessagingEventSender`\
  \ 可以向消息中间件发送 JMS 消息。\n\n接下来的类图显示 MyBank 的 `FixedDepositServiceImpl` 类使用 `DatabaseEventSender`、`MessagingEventSender`\
  \ 或 `WebServiceEventSender` 实例来直接或间接地保存保存与定期存款相关的事件：\n\n![](img/00022.jpeg)\n\n\
  **图 3-7** `FixedDepositServiceImpl` 类使用了 `EventSender` 接口的一种实现。\n\n在上面的类图中，`EventSender`\
  \ 接口的 `sendEvent` 方法定义了直接或间接在数据库中保存事件的约。`DatabaseEventSender`、`MessagingEventSender`\
  \ 和 `WebServiceEventSender` 类实现了 `EventSender` 接口，并为 `sendEvent` 方法提供了相应的实现。\n\n\
  现在让我们来看看 `FactoryBean` 如何简化选择 `EventSender` 接口的正确实现并对其初始化。\n\n**导入第 3 章/ch03** 此章节展示了使用\
  \ `FactoryBean` 选择 bean 类型并创建它的场景。\n\n### MyBank 应用 – FactoryBean\n\n在 MyBank 中，选择正确的\
  \ `EventSender` 接口实现并对其初始化是一项复杂的任务，因此它是使用 `FactoryBean` 的理想场景。`FactoryBean` 接口定义了以下方法：\n\
  \n- `getObjectType`: 返回由 `FactoryBean` 管理的对象的类型。\n- `getObject`: 返回 `FactoryBean`\
  \ 创建的对象。在 MyBank 中，`FactoryBean` 实现创建并返回 `EventSender` 类型的对象。\n- `isSingleton`:\
  \ 如果 `FactoryBean` 实现是单例作用的，返回 `true`。Spring 容器会缓存 `getObject` 返回的对象并在后续请求中返回它。如果\
  \ `FactoryBean` 实现是原型作用的，则返回 `false`。此时 `getObject` 方法在每次请求时都会创建一个新实例。\n\n接下来的示例展示了\
  \ `FactoryBean` 实现创建并返回 `EventSender` 类型的对象：\n\n**示例 3-56 – FactoryBean 类**\n\n\
  **项目 – ch03/bankapp-factorybean**\n\n**源码位置 - src/main/java/sample/spring/chapter03/bankapp/event**\n\
  \n\n\n\n上面的示例列表显示 `EventSenderFactoryBean` 实现了 `FactoryBean` 接口。`FactoryBean<EventSender>`\
  \ 中的 `EventSender` 参数表示 `FactoryBean` 的 `getObject()` 方法返回 `EventSender` 类型的对象。`databasePropertiesFile`、`webServicePropertiesFile`\
  \ 和 `messagingPropertiesFile` 是 `EventSenderFactoryBean` 类的属性，它们代表了 classpath 中\
  \ `database.properties`、`webservice.properties` 和 `messaging.properties` 文件的位置。\n\
  \n`getObject()` 方法使用 Spring 的 `ClassPathResource` 类来验证指定的属性文件是否存在于 classpath 中。如果属性文件存在，则加载该文件中的属性并将其传递给\
  \ `EventSender` 实现类的构造函数。例如，在上面的示例列表中，如果 `database.properties` 文件（由 `databasePropertiesFile`\
  \ 属性表示）存在，则会从 `database.properties` 文件中加载属性，并将其作为参数传递给 `DatabaseEventSender` 的构造函数。`getObjectType()`\
  \ 方法返回 `EventSender` 类型，因为 `EventSenderFactoryBean` 的 `getObject()` 方法返回的是 `EventSender`\
  \ 类型的对象。`isSingleton()` 方法返回 `true`，这意味着 `getObject()` 方法返回的对象会被 Spring 缓存，并且每次调用\
  \ `EventSenderFactoryBean` 的 `getObject()` 方法都会返回同一个实例。\n\n现在，既然你已经看到了 `EventSenderFactoryBean`\
  \ 类在 `MyBank` 中是如何实现的，你可以猜测 Spring 内置的 `FactoryBean` 实现，例如 `ListFactoryBean`（用于创建\
  \ `List` 类型实例）、`MapFactoryBean`（用于创建 `Map` 类型实例）、`SetFactoryBean`（用于创建 `Set` 类型实例）等是如何实现的。\n\
  \n下面的示例列表显示了如何在应用上下文 XML 文件中配置 `EventSenderFactoryBean`：\n\n**示例列表 3-57 – applicationContext.xml\
  \ - EventSenderFactoryBean 配置**\n\n**项目 – ch03-bankapp-factorybean**\n\n**源位置 -\
  \ src/main/resources/META-INF/spring**\n\n```xml\n<beans .....>\n    <bean id=\"\
  service\" class=\"sample.spring.chapter03.bankapp.service.FixedDepositServiceImpl\"\
  >\n        .....\n        <property name=\"eventSender\" ref=\"eventSenderFactory\"\
  \ />\n    </bean>\n    .....\n    <bean id=\"eventSenderFactory\" class=\"sample.spring.chapter03.bankapp.event.EventSenderFactoryBean\"\
  >\n        <property name=\"databasePropertiesFile\" value=\"META-INF/config/database.properties\"\
  />\n    </bean>\n</beans>\n```\n\n上面的示例列表显示 `EventSenderFactoryBean` 的配置方式与其他任何\
  \ Spring bean 一致。尽管 `FactoryBean` 实现的配置方式与其他任何 Spring bean 一致，但 Spring 容器对它的处理方式是*不同*的。最重要的区别之一是，如果一个\
  \ bean 依赖于一个 `FactoryBean` 实现，Spring 容器会调用该 `FactoryBean` 实现的 `getObject()` 方法并将返回的对象注入到依赖它的\
  \ bean 中。\n\n注意：你应该注意，如果 `isSingleton()` 方法返回 `true`，则 Spring 容器只会调用一次 `FactoryBean`\
  \ 的 `getObject()` 方法。\n\n在上面的示例列表中，`FixedDepositServiceImpl` 类的 bean 定义显示它依赖于 `EventSenderFactoryBean`\
  \ —— 一个 `FactoryBean` 实现。因此，Spring 容器调用 `EventSenderFactoryBean` 的 `getObject()`\
  \ 方法，并将返回的 `EventSender` 对象注入到 `FixedDepositServiceImpl` 实例中。\n\n下面的示例列表显示了 `FixedDepositServiceImpl`\
  \ 类，它需要由 `EventSenderFactoryBean` 创建的 `EventSender` 实例：\n\n**示例列表 3-58 – FixedDepositServiceImpl\
  \ 类**\n\n**项目 – ch03-bankapp-factorybean**\n\n**源位置 - src/main/java/sample/spring/chapter03/bankapp/service**\n\
  \n```java\npackage sample.spring.chapter03.bankapp.service;\n\nimport sample.spring.chapter03.bankapp.event.EventSender;\n\
  \npublic class FixedDepositServiceImpl implements FixedDepositService {\n\n    .....\n\
  \    private EventSender eventSender;\n\n    public void setEventSender(EventSender\
  \ eventSender) {\n        this.eventSender = eventSender;\n    }\n\n    .....\n\n\
  \    public void createFixedDeposit(FixedDepositDetails fixedDepositDetails) {\n\
  \        .....\n        eventSender.sendEvent(event);\n    }\n}\n```\n\n上面的示例列表显示\
  \ `FixedDepositServiceImpl` 类依赖于一个 `EventSender` 实例，*而不是*依赖于 `EventSenderFactoryBean`\
  \ 实例。Spring 容器通过调用 `EventSenderFactoryBean` 的 `getObject()` 方法获取 `EventSender` 实例，并将获取的\
  \ `EventSender` 实例注入到 `FixedDepositServiceImpl` 实例中。\n\n现在让我们来看如何访问 `FactoryBean`\
  \ 本身，而不是它通过 `getObject()` 方法创建并返回的 bean。\n\n### 访问 FactoryBean 实例\n\n如果你想从 Spring\
  \ 容器中获取 `FactoryBean` 本身，请在工厂 bean 的名称（或 id）前加上符号符号‘&’。\n\n假设 `FixedDepositServiceImpl`\
  \ 类需要访问 `EventSenderFactoryBean` 本身，如下所示：\n\n**示例列表 3-59 – 依赖 EventSenderFactoryBean\
  \ 的 FixedDepositServiceImpl 类**\n\n```java\npackage sample.spring.chapter03.bankapp.service;\n\
  \nimport sample.spring.chapter03.bankapp.event.EventSenderFactoryBean;\nimport sample.spring.chapter03.bankapp.event.EventSender;\n\
  \npublic class FixedDepositServiceImpl implements FixedDepositService {\n\n    .....\n\
  \    private EventSenderFactoryBean eventSenderFactoryBean;\n\n    public void setEventSenderFactoryBean(EventSenderFactoryBean\
  \ eventSenderFactoryBean) {\n        this.eventSenderFactoryBean = eventSenderFactoryBean;\n\
  \    }\n\n    .....\n\n    public void createFixedDeposit(FixedDepositDetails fixedDepositDetails)\
  \ {\n        .....\n        EventSender eventSender = eventSenderFactoryBean.getObject();\n\
  \        eventSender.sendEvent(event);\n    }\n}\n```\n\n在上面的示例列表中，`FixedDepositServiceImpl`\
  \ 类依赖于 `EventSenderFactoryBean` 本身，并使用它的 `getObject()` 方法获取 `EventSender` 。\n\n\
  我们在示例 3-57 中看到，当把 `EventSenderFactoryBean` bean 定义为 `FixedDepositServiceImpl` bean\
  \ 的依赖时，Spring 容器会调用 `EventSenderFactoryBean` 的 `getObject()` 方法并将返回的 `EventSender`\
  \ 对象注入到 `FixedDepositServiceImpl` 中。为了指示 Spring 容器注入 `EventSenderFactoryBean` 本身，需要在\
  \ `ref` 属性指定的 bean id 前加上‘&’符号，如下示例列表所示：\n\n**示例列表 3-60 – 将 EventSenderFactoryBean\
  \ 实例注入 FixedDepositServiceImpl bean**\n\n```xml\n<beans .....>\n    <bean id=\"\
  service\" class=\"sample.spring.chapter03.bankapp.service.FixedDepositServiceImpl\"\
  >\n        .....\n        <property name=\"eventSenderFactoryBean\" ref=\"&;eventSenderFactory\"\
  \ />\n    </bean>\n    .....\n    <bean id=\"eventSenderFactory\" class=\"sample.spring.chapter03.bankapp.event.EventSenderFactoryBean\"\
  >\n        <property name=\"databasePropertiesFile\" value=\"META-INF/config/database.properties\"\
  />\n    </bean>\n</beans>\n```\n\n在上面的示例列表中，下面的 `<property>` 元素指定 `FixedDepositServiceImpl`\
  \ bean 依赖于 `EventSenderFactoryBean`：\n\n`<property name=\"eventSenderFactoryBean\"\
  \ ref=\"&;eventSenderFactory\" />`\n\n注意 `ref` 属性的值为 `&;eventSenderFactory`。‘&’符号指示\
  \ Spring 容器将 `EventSenderFactoryBean` 实例本身注入到 `FixedDepositServiceImpl` bean 中。\n\
  \n当你想要使用 `ApplicationContext` 的 `getBean()` 方法获取 `FactoryBean` 实例本身时，也需要使用符号‘&’。下面的示例列表显示了\
  \ MyBank 应用的 `BankApp` 类，它获取了由 `EventSenderFactoryBean` 创建的 `EventSender` 对象以及 `EventSenderFactoryBean`\
  \ 实例本身：\n\n\n\n\n\n# 示例 3-61 – `BankApp` 类\n\n**项目** – `ch03-bankapp-factorybean`\n\
  \n**源码位置** - `src/main/java/sample/spring/chapter03/bankapp`\n\n```java\npackage\
  \ sample.spring.chapter03.bankapp;\n\n.....\n\npublic class BankApp {\n\n    private\
  \ static Logger logger = Logger.getLogger(BankApp.class);\n\n    public static void\
  \ main(String args[]) {\n        ApplicationContext context = new ClassPathXmlApplicationContext(\n\
  \        .....\n\n        logger.info(\"Invoking getBean(\\\"eventFactory\\\") returns\
  \ : \" +\n                   context.getBean(\"eventSenderFactory\"));\n       \
  \ logger.info(\"Invoking getBean(\\\"&eventFactory\\\") returns : \" +\n       \
  \            context.getBean(\"&eventSenderFactory\"));\n    }\n}\n```\n\n如果你执行上述\
  \ `BankApp` 类的 `main` 方法，你会发现调用 `getBean(\"eventSenderFactory\")` 返回的是 `DatabaseEventSender`\
  \ 类的实例，而调用 `getBean(\"&eventSenderFactory\")` 返回的是 `EventSenderFactoryBean` 实例。\n\
  \n## 3-10 总结\n\n在本章中，我们学习了如何使用 bean 定义继承来创建更简洁且易于管理的 bean 定义。本章大部分关注了如何使用内置的 `FactoryBean`\
  \ 实现、Spring 的 `util` 体系以及 p- 和 c 命名空间来设置不同类型的 bean 属性和构造器参数。我们还查看了 Spring 中一些内置的\
  \ `PropertyEditor` 实现以及如何向 Spring 容器注册额外的属性编辑器。在下一章中，我们将深入探讨 Spring 的依赖注入功能。\n\n\
  # 第 4 章 - 依赖注入\n\n## 4-1 引言\n\n在上一章中，我们学习了如何使用 Spring 的 `util` 体系、p- 和 c 命名空间、`FactoryBean`\
  \ 实现等来配置 bean。在本章中，我们将关注在现实世界应用开发中经常遇到的各种依赖注入场景，以及 Spring 如何处理这些场景。\n\n本章将从介绍 `inner\
  \ beans`（内部 bean）开始——这是 `<property>` 和 `<constructor-arg>` 元素 `ref` 属性的替代方案。然后我们将查看\
  \ `<bean>` 元素的 `depends-on` 属性。在本章的后半部分，我们将研究单例（singleton）和原型（prototype）作用域的 bean\
  \ 在协作提供应用行为时可能出现的问题。最后，我们将深入探讨 Spring 的 `autowiring`自动装配）功能。\n\n**重要** `chapter\
  \ 4/ch04-bankapp-dependencies`（此项目展示了内部 bean 和 `<bean>` 元素 `depends-on` 属性的使用。该项目还展示了定义单例作用域\
  \ bean 依赖原型作用域 bean 以及反之的影响。要运行应用程序，请执行该项目中 `BankApp` 类的 `main` 方法）\n\n## 4-2 Inner\
  \ beans\n\n如果一个 bean 的依赖**没有**被多个 bean 共享，你可以考虑将该依赖定义为 `inner bean`。内部 bean 通过 Spring\
  \ `beans` 体系中的 `<bean>` 元素定义在 `<property>` 或 `<constructor-arg>` 元素内部。你需要注意的是，内部\
  \ bean 只对包含它的 bean 定义可见，而**不能**被注册到 Spring 容器的其他 bean 访问。\n\n下面的示例展示了我们通常如何表示 bean\
  \ 依赖：\n\n**示例 4-1** – 使用 `<property>` 元素的 `ref` 属性指定依赖\n\n```xml\n    <bean id=\"\
  service\"\n          class=\"sample.spring.chapter04.bankapp.service.FixedDepositServiceImpl\"\
  >\n        <property name=\"fixedDepositDao\" ref=\"dao\" />\n    </bean>\n    <bean\
  \ id=\"dao\" class=\"sample.spring.chapter04.bankapp.dao.FixedDepositDaoImpl\" />\n\
  ```\n\n上面的示例显示 `service` bean 依赖于 `dao` bean。如果 `service` bean 是依赖于 `dao` bean 的唯一\
  \ bean，那么你可以将 `dao` bean 定义为 `service` bean 的 `inner bean`。\n\n**示例 4-2** – `applicationContext.xml`\
  \ - 内部 bean 示例\n\n**项目** – `ch04-bankapp-dependencies`\n\n**源码位置** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n    <bean id=\"service\"\n          class=\"sample.spring.chapter04.bankapp.service.FixedDepositServiceImpl\"\
  >\n        <property name=\"fixedDepositDao\">\n          <bean class=\"sample.spring.chapter04.bankapp.dao.FixedDepositDaoImpl\"\
  \ />\n        </property>\n    </bean>\n```\n\n在上面的示例中，`FixedDepositDaoImpl` 类的\
  \ bean 定义位于 `service` bean 的 `<property>` 元素内部。对比上面的示例，你会发现 `<property>` 元素不再指定\
  \ `ref` 属性。\n\n`<bean>` 元素具有匿名性，因为内部 bean 只对包含它的 bean 定义可见，而**不能**被注册到 Spring 容器的其他\
  \ bean 访问。\n\n下面的示例展示了我们通常如何表示 bean 依赖：\n\n**示例 4-3** – util 体系的 `<list>` 元素定义了一个内部\
  \ bean\n\n```xml\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\n\
  \       xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n       xmlns:util=\"\
  http://www.springframework.org/schema/util\"\n       xsi:schemaLocation=\"http://www.springframework.org/schema/beans\
  \ http://www.springframework.org/schema/beans/spring-4.0.xsd\n                 \
  \          http://www.springframework.org/schema/util http://www.springframework.org/schema/util/spring-4.0.xsd\"\
  >\n    <bean id=\"someBean\" class=\"com.sample.SomeBean\">\n        .....\n   \
  \     <constructor-arg name=\"listType\">\n            <util:list list-class=\"\
  java.util.ArrayList\">\n                <value>A simple String value in list</value>\n\
  \                <value>Another simple String value in list</value>\n          \
  \  </util:list>\n        </constructor-arg>\n        .....\n    </bean>\n</beans>\n\
  ```\n\n在上面的示例中，`listType` 构造器参数的类型为 `java.util.List`。传递给 `listType` 构造器参数的值由 util\
  \ 体系的 `<list>` 元素指定。注意我们没有指定 `<list>` 元素的 `id` 属性，因为 Spring 容器忽略内部 bean 的 id。\n\n\
  ## 4-3 使用 depends-on 属性显式控制 bean 的初始化顺序\n\n在第一章第四节中，我们讨论了 bean 是按照在应用上下文 XML 文件中的定义顺序的。bean\
  \ 的创建顺序也取决于它们之间的依赖关系。例如，如果 bean `A` 接受 bean `B` 的实例作为构造器参数，无论它们在 XML 文件中的定义顺序如何，Spring\
  \ 容器都会在创建 bean `A` **之前**创建 bean `B`。Spring 容器的这种行为确保了在依赖注入到依赖 bean（bean `A` 是示例中的依赖\
  \ bean）之前，其依赖项（bean `B` 是示例中的依赖）已经完全配置。\n\n\n\n\n\n在某些应用场景中，bean 的依赖没有通过 `<property>`\
  \ 和 `<constructor-arg>` 元素显式指定。如果依赖关系不是显式的，你可以使用 `<bean>` 元素的 `depends-on` 属性来显式指定\
  \ bean 的依赖。Spring 容器确保通过 `depends-on` 属性指定的依赖在指定 `depends-on` 属性的 bean 之前初始化。\n\n\
  现在让我们来看一个使用 `depends-on` 属性控制 bean 初始化顺序的示例场景。\n\n### MyBank – bean 之间的隐含依赖\n\n\
  在上一章节的 MyBank 应用中，`FactoryBean` 实现创建了一个 `EventSender` 对象，`FixedDepositServiceImpl`\
  \ 实例使用它来直接或间接地将事件存储在数据库中（详情见第 3 章第 9 节）。假设不再使用 `FactoryBean` 实现来创建 `EventSender`\
  \ 实现，而是采用下图所示的方法：\n\n![](img/00023.jpeg)\n\n**图 4-1** – `EventSenderSelectorServiceImpl`\
  \ 类将 `EventSender` 实现的名称写入 `appConfig.properties` 文件，该文件稍后会被 `FixedDepositServiceImpl`\
  \ 实例读取。\n\n上面的图显示：\n\n- 使用 `EventSenderSelectorServiceImpl` 类来决定 `FixedDepositServiceImpl`\
  \ 类使用的 `EventSender` 实现（`DatabaseEventSender` 或 `WebServiceEventSender` 或 `MessagingEventSender`）。\n\
  - `EventSenderSelectorServiceImpl` 类将 `EventSender` 实现的全限定名存储在 `appConfig.properties`\
  \ 文件中。\n- `FixedDepositServiceImpl` 类从 `appConfig.properties` 文件中读取 `EventSender`\
  \ 实现的全限定名，创建 `EventSender` 对象并使用它来在数据库中存储定期存款事件。\n\n上述方法表明，如果 `EventSenderSelectorServiceImpl`\
  \ 未能向 `appConfig.properties` 文件中保存 `EventSender` 实现的全限定名，`FixedDepositServiceImpl`\
  \ 实例将无法正常工作。这意味着 `FixedDepositServiceImpl` 类隐含依赖于 `EventSenderSelectorServiceImpl`\
  \ 类。\n\n现在让我们深入查看 `FixedDepositServiceImpl` 实例对 `EventSenderSelectorServiceImpl`\
  \ 实例隐含依赖的影响。\n\n### 隐含依赖问题\n\n考虑以下应用上下文 XML 文件，它包含了 `FixedDepositServiceImpl` 和\
  \ `EventSenderSelectorServiceImpl` 类的 bean 定义：\n\n**示例代码 4-4** – `applicationContext.xml`\
  \ - 隐含依赖示例\n\n**Project** – `ch04-bankapp-dependencies`\n\n**Source location** -\
  \ `src/main/resources/META-INF/spring`\n\n```xml\n<beans .....>\n    <bean id=\"\
  service\" class=\"sample.spring.chapter04.bankapp.service.FixedDepositServiceImpl\"\
  >\n        .....\n        <constructor-arg index=\"0\" value=\"META-INF/config/appConfig.properties\"\
  \ />\n    </bean>\n    <bean id=\"eventSenderSelectorService\" class=\"sample.spring.chapter04.bankapp.service.EventSenderSelectorServiceImpl\"\
  >\n        <constructor-arg index=\"0\" value=\"META-INF/config/appConfig.properties\"\
  \ />\n    </bean>\n</beans>\n```\n\n上面的应用上下文 XML 文件显示，`FixedDepositServiceImpl`\
  \ 和 `EventSenderSelectorServiceImpl` 类的构造函数都接受 `appConfig.properties` 文件的路径。`EventSenderSelectorServiceImpl`\
  \ 实例使用 `appConfig.properties` 文件将 `EventSender` 实现类的全限定名传递给 `FixedDepositServiceImpl`\
  \ 实例。由于 `service` 和 `eventSenderSelectorService` bean 之间不存在显式依赖，Spring 容器按照它们在应用上下文\
  \ XML 文件中定义的顺序创建它们的实例。由于 `service` bean 定义在 `eventSenderSelectorService` bean 之前，因此\
  \ `FixedDepositServiceImpl` 实例在 `EventSenderSelectorServiceImpl` 实例之前创建。我们很快就会发现，如果\
  \ `FixedDepositServiceImpl` 实例在 `EventSenderSelectorServiceImpl` 实例之前创建，那么 `FixedDepositServiceImpl`\
  \ 实例将无法从 `appConfig.properties` 文件中读取全限定 `EventSender` 实现类的名称。\n\n现在让我们深入查看 `EventSenderSelectorServiceImpl`\
  \ 和 `FixedDepositServiceImpl` 类以及 `appConfig.properties` 文件。\n\n### EventSenderSelectorServiceImpl\
  \ – 写入者\n\n下面的示例代码展示了 `EventSenderSelectorServiceImpl` 类：\n\n**示例代码 4-5** – `EventSenderSelectorServiceImpl`\
  \ 类\n\n**Project** – `ch04-bankapp-dependencies`\n\n**Source location** - `src/main/java/sample/spring/chapter04/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter04.bankapp.service;\n\nimport org.springframework.core.io.ClassPathResource;\n\
  import sample.spring.chapter04.bankapp.Constants;\n\npublic class EventSenderSelectorServiceImpl\
  \ {\n    public EventSenderSelectorServiceImpl(String configFile) throws Exception\
  \ {\n        ClassPathResource resource = new ClassPathResource(configFile);\n \
  \       OutputStream os = new FileOutputStream(resource.getFile());\n        Properties\
  \ properties = new Properties();\n        properties.setProperty(Constants.EVENT_SENDER_CLASS_PROPERTY,\
  \ \"sample.spring.chapter04.bankapp.event.DatabaseSender\");\n        properties.store(os,\
  \ null);\n        .....\n    }\n}\n```\n\n上面的示例显示，`appConfig.properties` 的位置作为构造函数参数传递给\
  \ `EventSenderSelectorServiceImpl` 类的构造函数。`EventSenderSelectorServiceImpl` 类向 `appConfig.properties`\
  \ 写入属性名为 `eventSenderClass`（即 `Constants` 类中定义的 `EVENT_SENDER_CLASS_PROPERTY` 常量）。`eventSenderClass`\
  \ 属性指定了 `FixedDepositServiceImpl` 实例使用的 `EventSender` 实现的全限定名。为了简单起见，`EventSenderSelectorServiceImpl`\
  \ 的构造函数将 `DatabaseSender` 的全限定名设置为 `eventSenderClass` 属性的值。\n\n**appConfig.properties**\n\
  \n以下是 `EventSenderSelectorServiceImpl` 添加到 `appConfig.properties` 中的内容：\n`eventSenderClass=sample.spring.chapter04.bankapp.event.DatabaseSender`\n\
  \n### FixedDepositServiceImpl – 读取者\n\n`EventSenderSelectorServiceImpl` 实例写入的 `eventSenderClass`\
  \ 属性被 `FixedDepositServiceImpl` 实例读取，如示例所示：\n\n**示例代码 4-6** – `FixedDepositServiceImpl`\
  \ 类\n\n**Project** – `ch04-bankapp-dependencies`\n\n**Source location** - `src/main/java/sample/spring/chapter04/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter04.bankapp.service;\n\nimport org.springframework.core.io.ClassPathResource;\n\
  import sample.spring.chapter04.bankapp.Constants;\n\npublic class FixedDepositServiceImpl\
  \ implements FixedDepositService {\n    private FixedDepositDao fixedDepositDao;\n\
  \    private EventSender eventSender;\n\n    public FixedDepositServiceImpl(String\
  \ configFile) throws Exception {\n        ClassPathResource configProperties = new\
  \ ClassPathResource(configFile);\n        if (configProperties.exists()) {\n   \
  \         InputStream inStream = configProperties.getInputStream();\n          \
  \  Properties properties = new Properties();\n            properties.load(inStream);\n\
  \            String eventSenderClassString = properties.getProperty(Constants.EVENT_SENDER_CLASS_PROPERTY);\n\
  \            if (eventSenderClassString != null) {\n                Class<?> eventSenderClass\
  \ = Class.forName(eventSenderClassString);\n                eventSender = (EventSender)\
  \ eventSenderClass.newInstance();\n                logger.info(\"Created EventSender\
  \ class\");\n            } else {\n```\n\n\n\n\n```java\nlogger.info(\"appConfig.properties\
  \ file doesn't contain the information \" +\n            \"about EventSender class\"\
  );\n}\n}\n}\n\npublic void createFixedDeposit(FixedDepositDetails fixedDepositDetails)\
  \ throws Exception {\n    .....\n\neventSender.sendEvent(event);\n\n}\n\n```\n\n\
  上面的示例列表显示了 `FixedDepositServiceImpl` 类的构造函数执行了以下顺序的操作：\n\n- 从 `appConfig.properties`\
  \ 文件加载属性。`configFile` 构造参数代表 `appConfig.properties` 文件的位置。\n- 从从 `appConfig.properties`\
  \ 文件加载的属性中获取名为 `eventSenderClass` 的属性（由 `Constants` 类中定义的常量 `EVENT_SENDER_CLASS_PROPERTY`\
  \ 表示）。`eventSenderClass` 属性的值是 `FixedDepositServiceImpl` 需要使用的 `EventSender` 实现类的全限定类名。`eventSenderClass`\
  \ 属性的值存储在局部变量 `eventSenderClassString` 中。\n- 创建 `EventSender` 实现类的实例，其全限定类名存储在 `eventSenderClassString`\
  \ 变量中，并将新创建的实例存储到名为 `eventSender` 的实例变量中。`eventSender` 变量稍后会被 `FixedDepositServiceImpl`\
  \ 的 `createFixedDeposit` 方法（参见上述示例列表中的 `createFixedDeposit` 方法）用于直接或间接地存储存储事件。\n\
  \n你应该注意，如果在 `appConfig.properties` 文件中*没有*找到名为 `eventSenderClass` 的属性，则 `eventSenderClassString`\
  \ 变量*不会*被设置。在这种情况下，`FixedDepositServiceImpl` 的构造函数会在控制台上打印以下信息：“appConfig.properties\
  \ file doesn't contain the information about EventSender class”。\n\n在示例列表 4-4 中，我们看了\
  \ `EventSenderSelectorServiceImpl` 和 `FixedDepositServiceImpl` 类的 bean 定义，并得出 `FixedDepositServiceImpl`\
  \ 实例在 `EventSenderSelectorServiceImpl` 实例之前创建，因为 Spring 容器按照它们在应用程序上下文 XML 文件出现的顺序初始化\
  \ bean。我们在示例列表 4-5 中看到，创建 `EventSenderSelectorServiceImpl` 实例会导致向 `appConfig.properties`\
  \ 文件写入 `eventSenderClass` 属性。因此，如果 `FixedDepositServiceImpl` 实例在 `EventSenderSelectorServiceImpl`\
  \ 实例*之前*创建，则 `FixedDepositServiceImpl` 实例将*不会*在 `appConfig.properties` 文件中找到任何 `eventSenderClass`\
  \ 属性。这表明 `FixedDepositServiceImpl` 类*隐式*依赖于 `EventSenderSelectorServiceImpl` 类；因此，`EventSenderSelectorServiceImpl`\
  \ 实例*必须*在 `FixedDepositServiceImpl` 实例之前创建。\n\n### 如何解决隐式依赖问题？\n\n我们可以通过两种方式解决隐式依赖问题：\n\
  \n- 我们更改 `EventSenderSelectorServiceImpl` 和 `FixedDepositServiceImpl` 类 bean 定义在应用程序上下文\
  \ XML 文件中的顺序。如果 `EventSenderSelectorServiceImpl` 类的 bean 定义出现在 `FixedDepositServiceImpl`\
  \ 类的 bean 定义*之前*，则 `EventSenderSelectorServiceImpl` 实例将在 `FixedDepositServiceImpl`\
  \ 实例之前创建。\n- 使用 `<bean>` 元素的 `depends-on` 属性来*显式*指定服务 bean（对应于 `FixedDepositServiceImpl`\
  \ 类）依赖于 `eventSenderSelectorService` bean（对应于 `EventSenderSelectorServiceImpl` 类）。\n\
  \n下面的示例显示了 `<bean>` 元素 `depends-on` 属性的用法：\n\n**示例列表 4-7** – `<bean>` 元素的 `depends-on`\
  \ 属性\n\n```xml\n<beans .....>\n    <bean id=\"service\"\n            class=\"sample.spring.chapter04.bankapp.service.FixedDepositServiceImpl\"\
  \n            depends-on=\"eventSenderSelectorService\">\n        .....\n    </bean>\n\
  \    <bean id=\"eventSenderSelectorService\"\n            class=\"sample.spring.chapter04.bankapp.service.EventSenderSelectorServiceImpl\"\
  >\n        .....\n    </bean>\n</beans>\n```\n\n在上面的示例列表中，service bean 使用 `depends-on`\
  \ 属性显式指定它依赖于 `eventSenderSelectorService` bean。`depends-on` 属性指定了 bean 所依赖的 bean\
  \ 的 id 或名称。由于 service bean 指定它依赖于 `eventSenderSelectorService` bean，Spring 容器会在\
  \ service bean 实例（对应于 `FixedDepositServiceImpl` 类）之前创建 `eventSenderSelectorService`\
  \ bean 实例（对应于 `EventSenderSelectorServiceImpl` 类）。\n\n**注意** 如果你执行 `ch04-bankapp-dependencies`\
  \ 项目中 `BankApp` 类的 `main` 方法，你会发现 `FixedDepositServiceImpl` 实例在 `EventSenderSelectServiceImpl`\
  \ 实例*之前*创建。出于这个原因，控制台上打印了以下信息：“appConfig.properties file doesn't contain the information\
  \ about EventSender class”。\n\n**多个隐式依赖**\n\n如果一个 bean 有多个隐式依赖，你可以将所有这些依赖的 id 或名称作为\
  \ `depends-on` 属性的值，如下：\n\n**示例列表 4-8** – depends-on 属性 - 多个隐式依赖\n\n```xml\n<beans\
  \ .....>\n    <bean id=\"abean\" depends-on=\"bBean, cBean\">\n        .....\n \
  \   </bean>\n    .....\n</beans>\n```\n\n上面的示例列表显示你可以指定多个 bean id 作为 `depends-on`\
  \ 的值。\n\n**depends-on 属性与 bean 继承**\n\n重要的是，`depends-on` 属性*不会*被子 bean 定义继承。下面的示例列表显示了一个*抽象的*\
  \ `serviceTemplate` 父 bean 定义，它使用 `depends-on` 属性指定 `baseService` 为依赖：\n\n**示例列表\
  \ 4-9** – depends-on 属性 – bean 继承\n\n```xml\n<beans .....>\n    <bean id=\"serviceTemplate\"\
  \ class=\".....ServiceTemplate\" depends-on=\"baseService\" abstract=\"true\"/>\n\
  \    <bean id=\"someService\" class=\".....SomeServiceImpl\" parent=\"serviceTemplate\"\
  />\n    <bean id=\"someOtherService\" class=\".....SomeOtherServiceImpl\" parent=\"\
  serviceTemplate\"/>\n    <bean id=\"baseService\" class=\".....BaseServiceImpl\"\
  />\n</beans>\n```\n\n在上面的示例列表中，`someService` 和 `someOtherService` 子 bean 定义没有继承父\
  \ bean `serviceTemplate` 的 `depends-on` 属性。由于 Spring 容器按照它们在应用程序上下文 XML 文件中的定义顺序创建\
  \ bean，`baseService` bean 在 `someService` 和 `someOtherService` bean 之后*创建。\n\n\n\
  \n\n\n### 单例作用（Singleton-scoped）bean 的依赖\n\n下面的示例列表显示了 MyBank 应用中单例作用的 `customerRequestService`\
  \ bean 及其依赖项：\n\n**示例列表 4-10** – `applicationContext.xml` - `customerRequestService`\
  \ bean 的依赖项\n\n**项目** – `ch04-bankapp-dependencies`\n\n**源码位置**- `src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"customerRequestService\"\n    class=\"sample.spring.chapter04.bankapp.service.CustomerRequestServiceImpl\"\
  >\n    <constructor-arg name=\"customerRequestDetails\" ref=\"customerRequestDetails\"\
  \ />\n    <constructor-arg name=\"customerRequestDao\" ref=\"customerRequestDao\"\
  \ />\n</bean>\n<bean id=\"customerRequestDetails\"\n    class=\"sample.spring.chapter04.bankapp.domain.CustomerRequestDetails\"\
  \n    scope=\"prototype\" />\n<bean id=\"customerRequestDao\"\n    class=\"sample.spring.chapter04.bankapp.dao.CustomerRequestDaoImpl\"\
  \ />\n```\n\n上面的示例列表显示 `customerRequestService`（单例作用）bean 依赖于 `customerRequestDetails`（原型作用）和\
  \ `customerRequestDao`（单例作用）bean。`CustomerRequestService` 对象（由 `customerRequestService`\
  \ bean 表示）代表了当银行客户创建新请求（如支票本请求）时被调用的服务。`CustomerRequestService` 将客户请求的详情放入 `CustomerRequestDetails`\
  \ 对象（由 `customerRequestDetails` bean 表示），并使用 `CustomerRequestDao` 对象（由 `customerRequestDao`\
  \ bean 表示）将其保存到数据存储中。\n\n下面的示例列表显示了 `BankApp` 类的 main 方法，该方法加载了示例列表 4-10 所示的 bean\
  \ 定义：\n\n**示例列表 4-11** – `BankApp` 类\n\n**项目** – `ch04-bankapp-dependencies`\n\n\
  **源码位置** **-**`src/main/java/sample/spring/chapter04/bankapp`\n\n```java\npackage\
  \ sample.spring.chapter04.bankapp;\n\nimport org.springframework.context.ApplicationContext;\n\
  import org.springframework.context.support.ClassPathXmlApplicationContext;\n\npublic\
  \ class BankApp {\n    private static Logger logger = Logger.getLogger(BankApp.class);\n\
  \n    public static void main(String args[]) throws Exception {\n        ApplicationContext\
  \ context = new ClassPathXmlApplicationContext(\n            \"classpath:META-INF/spring/applicationContext.xml\"\
  );\n        .....\n        logger.info(\"Beginning with accessing CustomerRequestService\"\
  );\n        CustomerRequestService customerRequestService_1\n            = context.getBean(CustomerRequestService.class);\n\
  \        .....\n        CustomerRequestService customerRequestService_2\n      \
  \      = context.getBean(CustomerRequestService.class);\n        .....\n       \
  \ logger.info(\"Done with accessing CustomerRequestService\");\n    }\n}\n```\n\n\
  上面的示例列表显示，在创建 `ApplicationContext` 实例后，调用了两次 `ApplicationContext` 的 `getBean` 方法来获取\
  \ `customerRequestService` bean 的引用。\n\n如果你执行 `BankApp` 类的 main 方法，将看到以下输出：\n\n\
  ```\nCreated CustomerRequestDetails instance\nCreated CustomerRequestDaoImpl instance\n\
  Created CustomerRequestServiceImpl instance\n.....\nBeginning with accessing CustomerRequestService\n\
  Done with accessing CustomerRequestService\n```\n\n上述输出中显示的“Created.....”消息是由相应\
  \ bean 类的构造函数打印的。上述输出显示，当 Spring 容器创建时，`customerRequestService`（单例作用）bean 的依赖项 `customerRequestDetails`（原型作用）和\
  \ `customerRequestDao`（单例作用）被创建并注入到 `customerRequestService` 实例中。由于在调用 `ApplicationContext`\
  \ 的 `getBean` 方法检索 `customerRequestService` bean 时，“Beginning .....”和“Done .....”消息之间没有在控制台打印“Created\
  \ .....”消息，因此此时 Spring 容器没有创建任何 bean 实例。\n\n图 4-2 显示了序列图，描述了执行 `BankApp` 的 main\
