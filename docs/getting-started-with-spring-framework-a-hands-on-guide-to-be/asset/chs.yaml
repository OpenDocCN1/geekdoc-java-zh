  \ URL。你将看到系统中的定期存款列表和“创建新的定期存款”按钮（参见第 10 章的图 10-8）。\n\n2. 点击“创建新的定期存款”按钮，这将显示用于开启新定期存款的\
  \ HTML 表单（参见第 10 章的图 10-9）。\n\n3. 输入定期存款详情并点击“保存”按钮。如果输入的数据中未发现任何验证错误，则定期存款详情将成功保存，并再次显示系统中的定期存款列表（包括新创建的定期存款）。\n\
  \n下表描述了你的操作以及 MyBank 在控制台上打印的相关消息：\n\n| 操作 | 在控制台上打印的消息 |\n| :--- | :--- |\n| 访问\
  \ `http://localhost:8080/ch11-bankapp/fixedDeposit/list` URL | `getNewFixedDepositDetails()`\
  \ 方法：返回 `FixedDepositDetails` 的新实例<br>`listFixedDeposits()` 方法：获取定期存款列表 |\n| 点击“创建新的定期存款”按钮\
  \ | `getNewFixedDepositDetails()` 方法：返回 `FixedDepositDetails` 的新实例<br>`showOpenFixedDepositForm()`\
  \ 方法：显示开启新定期存款的表单 |\n| 输入定期存款详情并点击“保存”按钮 | `getNewFixedDepositDetails()` 方法：返回 `FixedDepositDetails`\
  \ 的新实例<br>`openFixedDeposit()` 方法：定期存款详情已成功保存。正在重定向以显示定期存款列表。<br>`getNewFixedDepositDetails()`\
  \ 方法：返回 `FixedDepositDetails` 的新实例<br>`listFixedDeposits()` 方法：获取定期存款列表 |\n\n上表显示，带有\
  \ `@ModelAttribute` 注解的 `getNewFixedDepositDetails` 方法在 `FixedDepositController`\
  \ 类中带有 `@RequestMapping` 注解的方法*每次*调用之前。由于 `getNewFixedDepositDetails` 方法创建了 `FixedDepositDetails`\
  \ 对象的新实例，因此每次由 `FixedDepositController` 处理请求时，都会创建一个新的 `FixedDepositDetails` 对象实例。\n\
  \n如果带有 `@ModelAttribute` 注解的方法触发了 SQL 查询或调用了外部 Web 服务来填充该方法返回的模型属性，那么多次调用带有 `@ModelAttribute`\
  \ 注解的方法将对应用程序性能产生不利影响。在本章后面的部分，我们将看到可以使用 `@SessionAttributes` 注解来避免对 `@ModelAttribute`\
  \ 注解方法的多次调用。`@SessionAttributes` 注解指示 Spring 缓存由 `@ModelAttribute` 注解方法返回的对象。\n\n\
  现在让我们这样一个场景：被 `@ModelAttribute` 注解的方法参数引用的模型属性在 `Model` 对象中*未找到*。\n\n### @ModelAttribute\
  \ 注解方法参数的行为\n\n我们之前看到，`@ModelAttribute` 注解可以用于方法参数，以便从 `Model` 对象中检索模型属性。如果 `@ModelAttribute`\
  \ 注解指定的模型属性在 `Model` 中*未找到*，Spring 会自动创建该方法参数类型的新实例，将其分配给方法参数，并将其放入 `Model` 对象中。为了允许\
  \ Spring 创建方法参数类型的实例，该方法参数类型的 Java 类*必须*提供一个无参数构造函数。\n\n让我们考虑以下 `SomeController`\
  \ 控制器，它定义了一个单一的 `@RequestMapping` 方法 `doSomething`：\n\n**示例 11-10** – `@ModelAttribute`\
  \ 参数在 `Model` 对象中*不可用*\n\n```java\n@Controller\n@RequestMapping(value = \"/some\"\
  )\npublic class SomeController {\n    .....\n\n    @RequestMapping(\"/do\")\n  \
  \  public void doSomething(@ModelAttribute(\"myObj\") MyObject myObject) {\n   \
  \     logger.info(myObject);\n        .....\n    }\n}\n```\n\n上面的示例显示，`SomeController`\
  \ 类没有定义任何带有 `@ModelAttribute` 注解的方法向 `Model` 中添加类型为 `MyObject` 名为 `myObj` 的对象。由于由于原因，当接收到对\
  \ `doSomething` 方法的请求时，Spring 会创建一个 `MyObject` 实例，将其分配给参数 `myObject`，并将新创建的 `MyObject`\
  \ 实例放入 `Model` 对象中。\n\n现在让我们来看看 Spring 的 `RequestToViewNameTranslator` 对象。\n\n###\
  \ RequestToViewNameTranslator\n\n当带有 `@RequestMapping` 注解的方法没有显式指定要渲染的视图时，`RequestToViewNameTranslator`\
  \ 要渲染的视图。\n\n我们之前看到，当 `@RequestMapping` 方法也带有 `@ModelAttribute` 注解时，方法返回的值被视为模型属性。在这种情况下，`RequestToViewNameTranslator`\
  \ 对象负责根据传入的 Web 请求确定要渲染的视图。同样，如果带有 `@RequestMapping` 注解的方法返回 `void`、`org.springframework.ui.Model`\
  \ 或 `java.util.Map`，`RequestToViewNameTranslator` 对象也会确定要渲染的视图。\n\n`DefaultRequestToViewNameTranslator`\
  \ 是 `RequestToViewNameTranslator` 的实现，`DispatcherServlet` 默认使用它在 `@RequestMapping`\
  \ 方法未返回视图时确定要渲染的视图。`DefaultRequestToViewNameTranslator` 使用请求 URI 来确定逻辑视图的名称。`DefaultRequestToViewNameTranslator`\
  \ 通过移除 URI 中的前后斜杠和文件扩展名来确定视图名称。例如，如果 URL 是 `http://localhost:8080/doSomething.htm`，则视图名称将变为\
  \ `doSomething`。\n\n在 MyBank 应用程序的情况下，`FixedDepositController` 的 `listFixedDeposits`\
  \ 方法（参见示例 11-6 或 `ch11-bankapp` 项目中的 `FixedDepositController.java` 文件）同时带有 `@RequestMapping`\
  \ 和 `@ModelAttribute` 注解；因此，`DispatcherServlet` 使用 `RequestToViewNameTranslator`\
  \ 来确定要渲染的视图。由于 `listFixedDeposits` 方法映射到请求 URI `/fixedDeposit/list`，`RequestToViewNameTranslator`\
  \ 返回 `/fixedDeposit/list` 作为视图名称。MyBank 应用程序 XML 文件中配置的 `ViewResolver`（参见 MyBank\
  \ 项目中的 `bankapp-config.xml` 文件）将视图名称 `/fixedDeposit/list` 映射到 JSP 视图 `/WEB-INF/jsp/fixedDeposit/list.jsp`。\n\
  \n## 11-3 使用 @SessionAttributes 注解缓存模型属性\n\n上一节中，我们看到控制器中所有带有 `@ModelAttribute`\
  \ 注解的方法在调用 `@RequestMapping` 注解方法之前*总是*被调用。在 `@ModelAttribute` 方法从数据库或外部 Web 服务获取数据来填充模型属性的情况下，这种行为可能是不可接受的。在这种情况下，你可以在控制器类上使用\
  \ `@SessionAttributes` 注解，指定在请求之间存储在 HttpSession 中的模型属性。\n\n如果使用了 `@SessionAttributes`\
  \ 注解，只有当 `@ModelAttribute` 注解指定的模型属性在 `HttpSession` 中*未找到*时，才会调用带有 `@ModelAttribute`\
  \ 注解的方法。同样，方法参数上的 `@ModelAttribute` 注解只有在模型属性在 `HttpSession` 中未找到时，才会导致模型属性新实例的创建。\n\
  \n\n\n\n\n# 导入章节 11/ch11-session-attributes\n\n该项目展示了 `ch11-bankapp` 项目的修改版本，它使用\
  \ `@SessionAttributes` 注解将模型属性临时存储在 `HttpSession` 中。`ch11-session-attributes` 和\
  \ `ch10-bankapp` 项目提供的 MyBank Web 应用程序功能是相同的。如果您将该项目部署在 Tomcat 服务器上并访问 URL `http://localhost:8080/ch11-session-attributes`，您将看到系统中的定期存款列表。\n\
  \n下面的示例列表展示了 `ch11-session-attributes` 项目中如何使用 `@SessionAttributes` 注解来在 `HttpSession`\
  \ 中临时存储 `newFixedDepositDetails` 和 `editableFixedDepositDetails` 模型属性：\n\n## 示例列表\
  \ 11-11 – @SessionAttributes 注解用法\n\n**项目** – `ch11-session-attributes`\n\n**源码位置**-\
  \ `src/main/java/sample/spring/chapter11/web`\n\n```java\npackage sample.spring.chapter11.web;\n\
  \nimport org.springframework.web.bind.annotation.SessionAttributes;\n\n.....\n\n\
  @SessionAttributes(value = { \"newFixedDepositDetails\", \"editableFixedDepositDetails\"\
  \ })\npublic class FixedDepositController {\n\n    .....\n\n    @ModelAttribute(value\
  \ = \"newFixedDepositDetails\")\n    public FixedDepositDetails getNewFixedDepositDetails()\
  \ {\n        FixedDepositDetails fixedDepositDetails = new FixedDepositDetails();\n\
  \        fixedDepositDetails.setEmail(\"You must enter a valid email\");\n     \
  \   return fixedDepositDetails;\n    }\n\n    .....\n\n    @RequestMapping(params\
  \ = \"fdAction=create\", method = RequestMethod.POST)\n    public String openFixedDeposit(\n\
  \            @ModelAttribute(value = \"newFixedDepositDetails\") FixedDepositDetails\
  \ fixedDepositDetails,\n            .....) { ..... }\n\n    .....\n\n    @RequestMapping(params\
  \ = \"fdAction=view\", method = RequestMethod.GET)\n    public ModelAndView viewFixedDepositDetails(\n\
  \            @RequestParam(value = \"fixedDepositId\") int fixedDepositId) {\n \
  \       FixedDepositDetails fixedDepositDetails = fixedDepositService\n        \
  \    .getFixedDeposit(fixedDepositId);\n        Map<String, Object> modelMap = new\
  \ HashMap<String, Object>();\n        modelMap.put(\"editableFixedDepositDetails\"\
  , fixedDepositDetails);\n        .....\n        return new ModelAndView(\"editFixedDepositForm\"\
  , modelMap);\n    }\n}\n```\n\n`@SessionAttributes` 注解的 `value` 属性指定了临时存储在 `HttpSession`\
  \ 中的模型属性名称。在上面的示例列表中，命名为 `newFixedDepositDetails` 和 `editableFixedDepositDetails`\
  \ 的模型属性在请求之间存储在 `HttpSession` 中。`newFixedDepositDetails` 模型属性由带有 `@ModelAttribute`\
  \ 注解的 `getNewFixedDepositDetails` 方法返回，而 `editableFixedDepositDetails` 模型属性由带有 `@RequestMapping`\
  \ 注解的 `viewFixedDepositDetails` 方法返回。\n\n控制器通过带有 `@ModelAttribute` 注解的方法、`@RequestMapping`\
  \ 方法（返回 `ModelAndView`、`Model` 或 `Map` 的）以及直接将模型属性添加到 `Model` 对象中来贡献模型属性。控制器通过*任何*方式贡献的模型属性都是通过\
  \ `@SessionAttributes` 注解存储在 `HttpSession` 中的候选对象。\n\n当使用 `@SessionAttributes` 注解时，您应该确保在存储在\
  \ `HttpSession` 中的模型属性在不再需要时被移除。例如，`newFixedDepositDetails` 模型属性代表 `FixedDepositDetails`\
  \ 的实例，它用于“开立定期存款”表单显示 Email 表单字段的默认值“You must enter a valid email”（参见示例列表 11-11\
  \ 中的 `getNewFixedDepositDetails` 方法）。此外，当用户点击“开立定期存款”表单上的“保存”按钮时，用户输入的定期存款详情会被设置在\
  \ `newFixedDepositDetails` 实例上（参见示例列表 11-11 中的 `openFixedDeposit` 方法）。定期存款创建完成后，不再需要\
  \ `newFixedDepositDetails` 实例；因此，必须将其从 `HttpSession` 中移除。同样，在成功修改定期存款详情后，也不需要 `editableFixedDepositDetails`\
  \ 模型属性。\n\n可以通过调用 Spring `SessionStatus` 对象的 `setComplete` 方法指示 Spring 移除存储在 `HttpSession`\
  \ 中的*所有*模型属性。下面的示例展示了 `FixedDepositController` 的 `openFixedDeposit` 和 `editFixedDeposit`\
  \ 方法，在成功创建或修改定期存款后调用了 `SessionStatus` 的 `setComplete` 方法：\n\n## 示例列表 11-12 – 使用\
  \ SessionStatus 对象从 HttpSession 中移除模型属性\n\n**项目** – `ch11-session-attributes`\n\n\
  **源码位置**- `src/main/java/sample/spring/chapter11/web`\n\n```java\npackage sample.spring.chapter11.web;\n\
  \nimport org.springframework.web.bind.support.SessionStatus;\n\n@SessionAttributes(value\
  \ = { \"newFixedDepositDetails\", \"editableFixedDepositDetails\" })\npublic class\
  \ FixedDepositController {\n    .....\n    @RequestMapping(params = \"fdAction=create\"\
  , method = RequestMethod.POST)\n    public String openFixedDeposit(\n          \
  \  @ModelAttribute(value = \"newFixedDepositDetails\") FixedDepositDetails fixedDepositDetails,\n\
  \            ....., SessionStatus sessionStatus) {\n        fixedDepositService.saveFixedDeposit(fixedDepositDetails);\n\
  \        sessionStatus.setComplete();\n    }\n    .....\n\n    @RequestMapping(params\
  \ = \"fdAction=edit\", method = RequestMethod.POST)\n    public String editFixedDeposit(\n\
  \            @ModelAttribute(value = \"editableFixedDepositDetails\") FixedDepositDetails\
  \ fixedDepositDetails,\n            ....., SessionStatus sessionStatus) {\n    \
  \    fixedDepositService.editFixedDeposit(fixedDepositDetails);\n        sessionStatus.setComplete();\n\
  \    }\n    .....\n}\n```\n\n上面的示例列表显示 `openFixedDeposit` 和 `editFixedDeposit` 方法被定义为接受\
  \ `SessionStatus` 类型参数。当带有 `@RequestMapping` 注解的方法指定了 `SessionStatus` 参数时，Spring\
  \ 会为该方法提供 `SessionStatus` 实例。调用 `setComplete` 指示 Spring 从 `HttpSession` 对象中移除*当前*控制的模型属性。\n\
  \n在示例列表 11-11 和 11-12 中，我们看到 `@SessionAttributes` 的 `value` 属性指定了存储在 `HttpSession`\
  \ 中的模型属性名称。如果您希望只将模型属性的*类型*存储在 `HttpSession` 中，可以使用 `@SessionAttributes` 的 `types`\
  \ 属性。例如，下面的 `@SessionAttributes` 注解指定了命名为 `x` 和 `y` 的属性以及*所有*类型为 `MyObject` 的模型属性临时存储在\
  \ `HttpSession` 中：\n\n`@SessionAttributes(value = { \"x\", \"y\" }, types = { MyObject.class\
  \ })`\n\n您可以通过部署 `ch11-session-attributes` 项目并执行下表描述的操作，查看 `listFixedDeposits`、`getNewFixedDepositDetails`\
  \ 和 `openFixedDeposit` 方法被调用的顺序：\n\n| **操作** | **控制台打印的消息** |\n| :--- | :--- |\n\
  | 访问 `http://localhost:8080/ch11-session-attributes/fixedDeposit/list` URL | `getNewFixedDepositDetails()`\
  \ 方法：返回一个新的 `FixedDepositDetails` 实例<brlistFixedDeposits()` 方法：获取定期存款列表 |\n| 点击“Create\
  \ new Fixed Deposit”按钮 | `showOpenFixedDepositForm()` 方法：显示开立新定期存款的表单 |\n| 输入定期存款详情并点击“Save”按钮\
  \ | `openFixedDeposit()` 方法：定期存款详情已成功保存。重定向到显示定期存款列表。<getNewFixedDepositDetails()`\
  \ 方法：返回一个新的 `FixedDepositDetails` 实例<brlistFixedDeposits()` 方法：获取定期存款列表 |\n\n\n\n\
  \n\n在 `ch11-bankapp` 项目中，我们看到 `FixedDepositController` 中被 `@ModelAttribute` 注解的\
  \ `getNewFixedDepositDetails` 方法在每次请求分发到 `FixedDepositController` 时都会调用。上表显示，当请求首次由\
  \ `FixedDepositController` 处理时，会调用一次 `getNewFixedDepositDetails` 方法。由于 `openFixedDeposit`\
  \ 方法删除了存储在 `HttpSession` 中的模型属性，对 `listFixedDeposits` 方法的请求将再次调用 `getNewFixedDepositDetails`\
  \ 方法。\n\n现在，我们已经了解了如何使用 `@ModelAttribute` 和 `@SessionAttributes` 注解，让我们来看看在 Spring\
  \ Web MVC 应用中是如何进行*数据绑定*的。\n\n## 11-4 Spring 中的数据绑定支持\n\n当 Spring Web MVC 应用中提交表单时，请求中包含的参数将*自动*设置在作为表单支持对象的*模型属性（model\
  \ attribute）*上。这种将请求参数设置到表单支持对象的过程被称为*数据绑定*。在本节中，我们将查看 Spring 的 `WebDataBinder`\
  \ 实例，它负责请求参数绑定到表单支持对象。\n\n**导入 第 11 章/ch11-data-binding**（此项目是 `ch11-session-attributes`\
  \ 项目的修改版本，展示了如何向 Spring 容器注册 `PropertyEditor` 实现。如果你在 Tomcat 服务器上部署该项目并访问 URL `http://localhost:8080/ch11-data-binding`，你将看到系统中的定存列表。）\n\
  \n以下示例列表显示了 `ch11-data-binding` 项目中的 `FixedDepositDetails` 类：\n\n**示例列表 11-13**\
  \ – `FixedDepositDetails` 类\n\n**项目** – `ch11-data-binding`\n\n**源码位置**- `src/main/java/sample/spring/chapter11/web`\n\
  \n```java\npackage sample.spring.chapter11.domain;\n\nimport java.util.Date;\n\n\
  public class FixedDepositDetails {\n\n    .....\n\n    private long depositAmount;\n\
  \n    private Date maturityDate;\n\n    .....\n\n    public void setDepositAmount(long\
  \ depositAmount) {\n        this.depositAmount = depositAmount;\n    }\n\n    public\
  \ void setMaturityDate(Date maturityDate) {\n        this.maturityDate = maturityDate;\n\
  \    }\n\n    .....\n}\n```\n\n上述示例列表显示 `depositAmount` 和 `maturityDate` 字段的类型分别为\
  \ `long` 和 `java.util.Date`。当 `ch11-data-binding` 项目的“开通定存”表单提交时，`depositAmount`\
  \ 和 `maturityDate` 字段的值会被设置。下图显示了 `ch11-data-binding` 项目中用于开启新定存的“开通定存”表单：\n\n![](img/00057.jpeg)\n\
  \n**图 11-2** 用于开启新定存的“开通定存”表单\n\n在图中，“金额（美元）”和“到期日期”表单字段对应 `FixedDepositDetails`\
  \ 类的 `depositAmount` 和 `maturityDate` 字段（参见示例列表 11-13）。需要注意的一之一，“到期日期”字段接受“MM-dd-yyyy”格式的日期，例如\
  \ 01-27-2013。由于 `depositAmount` 字段类型为 `long`，而 `maturityDate` 类型为 `java.util.Date`，Spring\
  \ 的数据绑定机制负责完成从 `String` 到 `FixedDepositDetails` 实例定义类型转换。\n\n以下示例列表显示了 `FixedDepositController`\
  \ 的 `openFixedDeposit` 方法，该方法在用户填写“开通定存”表单并点击“保存”按钮时被调用（参见图 11-2）：\n\n**示例列表 11-14**\
  \ – `FixedDepositController` - 自动数据绑定示例\n\n**项目** – `ch11-data-binding`\n\n**源码位置**-\
  \ `src/main/java/sample/spring/chapter11/web`\n\n```java\npackage sample.spring.chapter11.web;\n\
  \n@Controller\n.....\n\npublic class FixedDepositController {\n    .....\n\n   \
  \ @RequestMapping(params = \"fdAction=create\", method = RequestMethod.POST)\n \
  \   public String openFixedDeposit(\n        @ModelAttribute(value = \"newFixedDepositDetails\"\
  ) FixedDepositDetails fixedDepositDetails,\n        BindingResult bindingResult,\
  \ SessionStatus sessionStatus) {\n        ....\n    }\n\n    .....\n}\n```\n\n在上述示例列表中，被\
  \ `@ModelAttribute` 注解的 `FixedDepositDetails` 参数代表表单支持对象，当提交表单时，请求参数会设置在该对象上。Spring\
  \ 的 `WebDataBinder` 实例将请求参数绑定到 `FixedDepositDetails` 实例。\n\n现在让我们来看看 `WebDataBinder`\
  \ 如何执行数据绑定。\n\n### WebDataBinder – 用于 Web 请求参数的数据绑定器\n\n`WebDataBinder` 使用请求参数名称在表单支持对象上寻找对应的\
  \ JavaBean 风格 setter 方法。如果找到了 JavaBean 风格的 setter 方法，`WebDataBinder` 会调用该 setter\
  \ 方法并将请求参数值作为参数传递给该方法。如果 setter 方法定义为接收非 String 类型，`WebDataBinder` 将使用适当的 `PropertyEditor`\
  \ 执行转换。\n\n以下示例列表显示了在应用中作为表单支持对象的 `MyObject` 类：\n\n```java\npublic class MyObject\
  \ {\n    private String x;\n    private N y;\n\n    .....\n\n    public void setX(String\
  \ x) {\n        this.x = x;\n    }\n\n    public void setY(N y) {\n        this.y\
  \ = y;\n    }\n}\n```\n**示例列表 11-15** – `MyObject` – 表单支持对象\n\n上述示例列表显示 `MyObject`\
  \ 类定义的属性 `x` 和 `y` 分别为 `String` 和 `N` 类型。下图显示了 `WebDataBinder` 如何将名为 `x` 和 `y` 的请求参数绑定到\
  \ `MyObject` 实例的 `x` 和 `y` 属性：\n\n![](img/00058.jpeg)\n\n**图 11-3** WebDataBinder\
  \ 通过 PropertyEditor 执行数据绑定\n\n上显示 WebDataBinder 在调用 `MyObject` 的 `setY` 之前使用 PropertyEditor\
  \ 将 String 值转换为类型 N。\n\nSpring 提供了一些内置的 `PropertyEditor` 实现，供 `WebDataBinder` 将\
  \ `String` 类型的值转换为表单支持对象定义的类型。例如，`CustomNumberEditor`、`FileEditor`、`CustomDateEditor`\
  \ 是 Spring 提供的内置 PropertyEditor。要获取完整的内置 Editor 列表，请参考 `org.springframework.beans.propertyeditors`\
  \ 包。\n\n`CustomNumberEditor` 用于将 `String` 转换为 `java.lang.Number` 类型，如 `Integer`、`Long`\
  \ 等。`CustomDateEditor` 用于将 `String` 转换为 `java.util.Date` 类型。你可以传递一个 `java.text.DateFormat`\
  \ 实例给 `CustomDateEditor` 以指定用于解析和渲染的日期格式。这两个 PropertyEditor 在 `ch11-data-binding`\
  \ 项目中都是需要的，因为我们需要转换 `depositAmount`（类型为 `long`）和 `maturityDate`（类型为 `java.util.Date`）。`CustomNumberEditor`\
  \ 已预注册到 `WebDataBinder` 实例中，但你需要显式注册 `CustomDateEditor`。\n\n现在让我们来看看如何配置 `WebDataBinder`\
  \ 实例并注册 `PropertyEditor`。\n\n### 配置 WebDataBinder 实例\n\n你可以通过以下方式配置 `WebDataBinder`\
  \ 实例：\n\n· 在控制器类中定义 `@InitBinder` 注解的方法\n· 在 Web 应用上下文 XML 文件中配置 `WebBindingInitializer`\
  \ 实现\n· 在 `@ControllerAdvice` 注解的类中定义 `@InitBinder` 注解的方法\n\n让我们逐一查看上述配置并注册 PropertyEditor\
  \ 方法。\n\n**在控制器类中定义 @InitBinder 注解的方法**\n\n在控制器类中被 `@InitBinder` 注解的方法指定了初始化一个 `WebDataBinder`\
  \ 实例，该实例将在数据绑定期间供控制器使用。@InitBinder` 注解的 `value` 属性指定了初始化 `WebDataBinder` 实例所应用的模型属性名称。\n\
  \n\n\n\n以下示例显示了 `FixedDepositController` 的 `initBinder_New` 方法，该方法使用了 `@InitBinder`\
  \ 注解：\n\n**示例 11-16** – `FixedDepositController` - `@InitBinder` 注解用法\n\n**项目**\
  \ – `ch11-data-binding`\n\n**源码位置**- `src/main/java/sample/spring/chapter11/web`\n\
  \n```java\npackage sample.spring.chapter11.web;\n\nimport java.text.SimpleDateFormat;\n\
  \nimport org.springframework.beans.propertyeditors.CustomDateEditor;\n\nimport org.springframework.web.bind.WebDataBinder;\n\
  \nimport org.springframework.web.bind.annotation.InitBinder;\n\n@Controller\n\n\
  .....\n\npublic class FixedDepositController {\n    .....\n\n    @ModelAttribute(value\
  \ = \"newFixedDepositDetails\")\n    public FixedDepositDetails getNewFixedDepositDetails()\
  \ { ..... }\n\n    @InitBinder(value = \"newFixedDepositDetails\")\n    public void\
  \ initBinder_New(WebDataBinder webDataBinder) {\n        webDataBinder.registerCustomEditor(Date.class,\n\
  \                new CustomDateEditor(new SimpleDateFormat(\"MM-dd-yyyy\"), false));\n\
  \    }\n\n    .....\n}\n```\n\n在上述示例中，`@InitBinder` 注解的 `value` 属性被设置为 `newFixedDepositDetails`，这意味着由\
  \ `initBinder_New` 方法初始化的 `WebDataBinder` 仅适用于 `newFixedDepositDetails` 模型属性。带有\
  \ `@InitBinder` 注解的方法可以接受与传递给 `@RequestMapping` 注解方法相同的参数集（如 `HttpServletRequest`、`SessionStatus`\
  \ 等）。但是，带有 `@InitBinder` 注解的方法不能定义为接受模型属性和 `BindingResult`（或 `Errors`）对象作为参数。通常，`WebDataBinder`\
  \ 实例以及 Spring 的 `WebRequest` 或 `java.util.Locale` 实例会被传递给 `@InitBinder` 方法。你应该注意，`@InitBinder`\
  \ 方法的返回类型必须是 `void`。\n\n`WebDataBinder` 的 `registerCustomEditor` 方法用于向 `WebDataBinder`\
  \ 实例注册 `PropertyEditor`。在示例 11-16 中，`initBinder_New` 方法向 `WebDataBinder` 实例注册了 `CustomDateEditor`（一个\
  \ `PropertyEditor`）。\n\n你可以为控制器的每个模型属性定义一个带有 `@InitBinder` 注解的方法，也可以定义一个适用于控制器所有模型属性的单个\
  \ `@InitBinder` 注解方法。如果你没有指定 `@InitBinder` 注解的 `value` 属性，则由方法初始化的 `WebDataBinder`\
  \ 实例适用于控制器的所有模型属性。\n\n### 配置 WebBindingInitializer 实现\n\n`WebDataBinder` 实例首先由 `RequestMappingHandlerAdapter`\
  \ 初始化，然后通过 `WebBindingInitializer` 和 `@InitBinder` 方法进行进一步初始化。\n\nSpring `mvc` 架构中的\
  \ `<annotation-driven>` 会创建一个 `RequestMappingHandlerAdapter` 实例，并由它初始化 `WebDataBinder`。你可以为\
  \ `RequestMappingHandlerAdapter` 提供 Spring `WebBindingInitializer` 接口的实现类，以进一步初始化\
  \ `WebDataBinder` 实例。你还可以在控制器类中使用 `@InitBinder` 方法来进一步初始化 `WebDataBinder` 实例。\n\n\
  下图显示了 `RequestMappingHandlerAdapter`、`WebBindingInitializer` 和 `@InitBinder` 方法初始化\
  \ `WebDataBinder` 实例的顺序：\n\n![](img/00059.jpeg)\n\n**图 11-4** 控制器类的 `RequestMappingHandlerAdapter`、`WebBindingInitializer`\
  \ 和 `@InitBinder` 方法初始化 `WebDataBinder` 实例的顺序\n\n控制器类的 `@InitBinder` 方法进行的 `WebDataBinder`\
  \ 初始化仅适用于该控制器的模型属性。例如，如果你在控制器 X 中使用 `@InitBinder` 方法为 `WebDataBinder` 实例设置 `CustomDateEditor`\
  \ 属性编辑器，那么在数据绑定期间，`CustomDateEditor` 属性编辑器仅适用于控制器 X 的模型属性。在 MyBank 应用中，`CustomDateEditor`\
  \ 仅 `FixedDepositController` 的模型属性需要；因此，我们在 `FixedDepositController` 类中使用带有 `@InitBinder`\
  \ 注解的方法向 `WebDataBinder` 实例注册 `CustomDateEditor`。\n\nSpring 的 `WebBindingInitializer`\
  \ 是一个回调接口，其实现负责使用适用于应用程序中所有控制器（以及所有模型属性）的配置来初始化 `WebDataBinder`。让我们看看如何使用 Spring\
  \ `mvc` 架构中的 `<annotation-driven>` 元素来配置自定义的 `WebBindingInitializer`。\n\nSpring\
  \ `mvc` 架构中的 `<annotation-driven>` 元素创建一个 `RequestMappingHandlerAdapter` 实例，并初始化\
  \ `WebDataBinder`。`<annotation-driven>` 元素提供了用于自定义 `RequestMappingHandlerAdapter`\
  \ 和 `RequestMappingMapping` 的属性。如果你想要对 `RequestMappingHandlerAdapter` 或 `RequestMappingMapping`\
  \ 进行自定义没有 `<annotation-driven>` 元素提供，则必须移除 `<annotation-driven>` 并显式配置 `RequestMappingHandlerAdapter`\
  \ 和 `RequestMappingMapping` 实例。\n\n以下示例显示了如何使用 Spring 的 `ConfigurableWebBindingInitializer`（`WebBindingInitializer`\
  \ 的实现）使 `CustomDateEditor` 属性适用于 MyBank 应用中的所有控制器：\n\n**示例 11-17** – WebBindingInitializer\
  \ 配置\n\n```xml\n<bean id=\"handlerAdapter\" class=\"org.springframework.web.servlet.method.annotation.RequestMappingHandlerAdapter\"\
  >\n    <property name=\"webBindingInitializer\" ref=\"myInitializer\" />\n</bean>\n\
  \n<bean id=\"handlerMapping\" class=\"org.springframework.web.servlet.method.annotation.RequestMappingMapping\"\
  \ />\n\n<bean id=\"myInitializer\" class=\"org.springframework.web.bind.support.ConfigurableWebBindingInitializer\"\
  >\n    <property name=\"propertyEditorRegistars\">\n        <list>\n           \
  \ <bean class=\"mypackage.MyPropertyEditorRegistrar\" />\n        </list>\n    </property>\n\
  </bean>\n```\n\n上述示例显示 `RequestMappingHandlerAdapter` 和 `RequestMappingMapping`\
  \ bean 在应用程序上下文 XML 中显式定义。`RequestMappingHandlerAdapter` 的 `webBindingInitializer`\
  \ 属性引用了 `WebBindingInitializer` 接口的 `ConfigurableWebBindingInitializer` bean。`ConfigurableWebBindingInitializer`\
  \ 的 `propertyEditorRegistars` 属性指定了向 `WebDataBinder` 注册一个多个 `PropertyEditor` 的类。以下示例显示了\
  \ `MyPropertyEditorRegistrar` 类如何向 `WebDataBinder` 注册 `CustomDateEditor` 属性编辑器：\n\
  \n**示例 11-18** – `MyPropertyEditorRegistrar` 类\n\n```java\npackage mypackage;\n\n\
  import org.springframework.beans.PropertyEditorRegistrar;\nimport org.springframework.beans.PropertyEditorRegistry;\n\
  import org.springframework.beans.propertyeditors.CustomDateEditor;\nimport java.text.SimpleDateFormat;\n\
  import java.util.Date;\n\npublic class MyPropertyEditorRegistrar implements PropertyEditorRegistrar\
  \ {\n    @Override\n    public void registerCustomEditors(PropertyEditorRegistry\
  \ registry) {\n        registry.registerCustomEditor(Date.class, new CustomDateEditor(new\
  \ SimpleDateFormat(\"MM-dd-yyyy\"), false));\n    }\n}\n```\n\n\n\n\n上面的示例列表显示，`MyPropertyEditorRegistrar`\
  \ 类实现了 Spring 的 `PropertyEditorRegistrar` 接口，并为 `PropertyEditorRegistrar` 接口中定义的\
  \ `registerCustomEditors` 方法提供了实现。传递给 `registerCustomEditors` 方法的 `PropertyEditorRegistry`\
  \ 实例用于注册属性编辑器。`PropertyEditorRegistry` 的 `registerCustomEditor` 方法用于向 `WebDataBinder`\
  \ 注册 `PropertyEditor` 实现。在上面的示例列表中，`PropertyEditorRegistry` 的 `registerCustomEditor`\
  \ 被用于向 `WebDataBinder` 注册 `CustomDateEditor` 属性编辑器。\n\n正如我们所看到的，使用 `WebBindingInitializer`\
  \ 来初始化 `WebDataBinder` 是一项复杂的任务。使用 `WebBindingInitializer` 的更简单替代方案是在带有 `@ControllerAdvice`\
  \ 注解的类中定义 `@InitBinder` 注解的方法。\n\n### 在带有 @ControllerAdvice 注解的类中定义 @InitBinder\
  \ 方法\n\n类似于 `@Service`、`@Controller` 和 `@Repository` 注解，`@ControllerAdvice` 注解是\
  \ `@Component` 注解的一种特殊形式。类上的 `@ControllerAdvice` 注解表示该类为控制器提供支持。你可以在带有 `@ControllerAdvice`\
  \ 注解的类中定义 `@InitBinder`、`@ModelAttribute` 和 `@ExceptionHandler` 注解的方法，这些带注解的方法适用于应用程序中所有带注解的控制器。与\
  \ `@Service`、`@Controller` 和 `@Repository` 注解一样，Spring 上 Schema 中的 `<classpath-scanning>`\
  \ 元素会自动检测并将带有 `@ControllerAdvice` 注解的类注册到 Spring 容器。\n\n如果你发现多个控制器中重复了 `@InitBinder`、`@ModelAttribute`\
  \ 和 `@ExceptionHandler` 方法，请考虑在带有 `@ControllerAdvice` 注解的类中定义此类方法。例如，如果你想用适用于应用于多个控制器的配置来初始化\
  \ `WebDataBinder`，那么可以在带有 `@ControllerAdvice` 注解的类中定义 `@InitBinder` 方法，而不是在多个控制器类中定义\
  \ `@InitBinder` 方法。\n\n下表总结了我们讨论的初始化 `WebDataBinder` 的三种方法：\n\n| 控制器类中的 @InitBinder\
  \ 方法 | WebBindingInitializer | @ControllerAdvice 类中的 @InitBinder 方法 |\n| :--- |\
  \ :--- | :--- |\n| 需要在控制器中定义 `@InitBinder` 方法 | 需要在 Web 应用上下文 XML 文件中显式配置 `RequestMappingHandlerAdapter`\
  \ | 需要在带有 `@ControllerAdvice` 注解的类中定义 `@InitBinder` 方法 |\n| WebDataBinder 初始化仅适用于包含\
  \ `@InitBinder` 方法的控制器 | WebDataBinder 初始化适用于应用程序中所有带注解的控制器 | WebDataBinder 初始化适用于应用程序中所有带注解的控制器\
  \ |\n\n现在让我们来看看如何允许或禁止模型属性（model attribute）的字段参与数据绑定过程。\n\n### 允许或禁止数据绑定过程\n\n`WebDataBinder`\
  \ 允许你指定模型属性中允许或禁止参与数据绑定过程的字段。强烈建议指定允许或禁止参与数据绑定过程的模型属性字段，因为如果不这样做可能会损害应用程序的安全性。让我们来看一个想要允许或禁止字段参与数据绑定的场景。\n\
  \n在 MyBank 应用中，当用户选择一笔定期存款进行编辑时，所选定期存款的详情从数据存储中加载并临时缓存在 `HttpSession` 中。用户对定期存款进行更改并保存更改。下面的示例显示了负责加载所选定期存款并保存更新后的定期存款信息的\
  \ `@RequestMapping` 方法：\n\n**示例列表 11-19** – FixedDepositController\n\n**Project**\
  \ – ch11-data-binding\n\n**Source location**- src/main/java/sample/spring/chapter11/web\n\
  \n```java\npackage sample.spring.chapter11.web;\n\n.....\n\n@SessionAttributes(value\
  \ = { \"newFixedDepositDetails\", \"editableFixedDepositDetails\" })\n\npublic class\
  \ FixedDepositController {\n\n    .....\n\n    @RequestMapping(params = \"fdAction=view\"\
  , method = RequestMethod.GET)\n    public ModelAndView viewFixedDepositDetails(\n\
  \            @RequestParam(value = \"fixedDepositId\") int fixedDepositId) {\n\n\
  \        FixedDepositDetails fixedDepositDetails = fixedDepositService\n       \
  \         .getFixedDeposit(fixedDepositId);\n        Map<String, Object> modelMap\
  \ = new HashMap<String, Object>();\n        modelMap.put(\"editableFixedDepositDetails\"\
  , fixedDepositDetails);\n        .....\n        return new ModelAndView(\"editFixedDepositForm\"\
  , modelMap);\n    }\n\n    .....\n\n    @RequestMapping(params = \"fdAction=edit\"\
  , method = RequestMethod.POST)\n    public String editFixedDeposit(\n          \
  \  @ModelAttribute(\"editableFixedDepositDetails\") FixedDepositDetails fixedDepositDetails,)\
  \ {\n\n        .....\n    }\n}\n```\n\n在 MyBank 应用中，定期存款通过 `FixedDepositDetails`\
  \ 对象的 `id` 字段唯一标识（参见 ch11-data-binding 项目中的 `FixedDepositDetails` 类）。当用户选择一笔定期存款进行编辑时，`id`\
  \ 字段的值通过 `fixedDepositId` 请求参数传递给 `viewFixedDepositDetails` 方法。`viewFixedDepositDetails`\
  \ 方法使用 `fixedDepositId` 请求参数的值加载定期存款详情并显示在“编辑定期存款”表单上，如图所示：\n\n![](img/00060.jpeg)\n\
  \n**图 11-5** 用于编辑现有定期存款的“编辑定期存款”表单\n\n由于 `id` 值（对应于 `FixedDepositDetails` 对象的 `id`\
  \ 属性）唯一标识系统中的定期存款，“编辑定期存款”表单没有提供更改它的机制。当用户点击“保存”按钮时，会调用 `FixedDepositController`\
  \ 的 `editFixedDeposit` 方法。`editFixedDeposit` 方法将更改保存到定期存款详情中。\n\n当调用 `FixedDepositController`\
  \ 的 `editFixedDeposit` 方法时，`WebDataBinder` 实例会将请求参数值绑定到 `editableFixedDepositDetails`\
  \ 模型属性的字段——即由 `viewFixedDepositDetails` 方法加载并临时存储在 `HttpSession` 中的 `FixedDepositDetails`\
  \ 对象（参见示例列表 11-19 中的 `@SessionAttributes` 注解）。如果恶意用户发送了一个名为 `id` 值为 10 的请求参数，那么\
  \ `WebDataBinder` 将在数据绑定期间盲目地将 `FixedDepositDetails` 对象的 `id` 属性设置为 10。这是不可取的，因为更改\
  \ `FixedDepositDetails` 对象的 `id` 属性会破坏应用程序数据。\n\n`WebDataBinder` 提供了 `setAllowedFields`\
  \ 和 `setDisallowedFields` 方法，你可以使用这些方法设置可以和不能参与数据绑定过程的模型属性字段名称。下面的示例显示了 `FixedDepositController`\
  \ 的 `initBinder_Edit` 方法指定了 `editableFixedDepositDetails` 模型属性的 `id` 字段不能参与数据绑定过程：\n\
  \n**示例列表 11-20** – FixedDepositController – WebDataBinder 的 setDisallowedFields\n\
  \n**Project** – ch11-data-binding\n\n**Source location**- src/main/java/sample/spring/chapter11/web\n\
  \n```java\npackage sample.spring.chapter11.web;\n\n.....\n\npublic class FixedDepositController\
  \ {\n\n    .....\n\n    @RequestMapping(params = \"fdAction=edit\", method = RequestMethod.POST)\n\
  \    public String editFixedDeposit(\n            @ModelAttribute(\"editableFixedDepositDetails\"\
  ) FixedDepositDetails fixedDepositDetails,...) {\n\n        .....\n    }\n\n   \
  \ .....\n\n    @InitBinder(value = \"editableFixedDepositDetails\")\n    public\
  \ void initBinder_Edit(WebDataBinder webDataBinder) {\n        webDataBinder.registerCustomEditor(Date.class,\
  \ new CustomDateEditor(\n```\n\n\n\n\n\n```java\n    new SimpleDateFormat(\"MM-dd-yyyy\"\
  ), false));\n\n    webDataBinder.setDisallowedFields(\"id\");\n\n}\n\n}\n```\n\n\
  在上面的示例代码列表中，`initBinder_Edit` 方法为 `editableFixedDepositDetails` 模型属性初始化了 `WebDataBinder`\
  \ 实例。由于 `setDisallowedFields` 方法指定了 `editableFixedDepositDetails` 模型属性的 `id` 字段不允许参与绑定过程，因此即使请求中包含名为\
  \ `id` 的请求参数，该 `id` 字段也不会被设置。\n\n现在让我们来看 Spring 的 `BindingResult` 对象，它暴露了在数据绑定和验证过程中发生的错误。\n\
  \n### 使用 BindingResult 对象检查数据绑定和验证错误\n\nSpring 的 `BindingResult` 对象为控制器方法提供了将请求参数绑定到模型属性字段的结果的结果。例如，如果在数据绑定过程中发生任何类型转换错误，这些错误将由\
  \ `BindingResult` 对象报告。\n\n下面的示例代码展示了 `FixedDepositController` 的 `openFixedDeposit`\
  \ 方法，该方法只有在 `BindingResult` 对象没有报告任何错误时才会创建一个存款：\n\n**示例代码 11-21** – `FixedDepositController`\
  \ – 使用 `BindingResult` 检查绑定和验证错误\n\n**项目** – `ch11-data-binding`\n\n**源位置**- `src/main/java/sample/spring/chapter11/web`\n\
  \n```java\npackage sample.spring.chapter11.web;\n\nimport org.springframework.validation.BindingResult;\n\
  \nimport org.springframework.web.bind.annotation.ModelAttribute;\n\n.....\n\npublic\
  \ class FixedDepositController {\n\n    .....\n\n    @RequestMapping(params = \"\
  fdAction=create\", method = RequestMethod.POST)\n    public String openFixedDeposit(\n\
  \        @ModelAttribute(value = \"newFixedDepositDetails\") FixedDepositDetails\
  \ fixedDepositDetails,\n        BindingResult bindingResult, SessionStatus sessionStatus)\
  \ {\n\n        .....\n\n        if (bindingResult.hasErrors()) {\n            return\
  \ \"createFixedDepositForm\";\n        } else {\n            fixedDepositService.saveFixedDeposit(fixedDepositDetails);\n\
  \            sessionStatus.setComplete();\n            return \"redirect:/fixedDeposit/list\"\
  ;\n        }\n    }\n\n    .....\n}\n```\n\n在上面的示例代码列表中，如果 `BindingResult` 对象持有一个或多个数据绑定或验证错误，则\
  \ `BindingResult` 的 `hasErrors` 方法将返回 true。在第 11-5 节中，我们将看到验证错误是如何存储在 `BindingResult`\
  \ 对象中的。如果 `BindingResult` 对象报告了错误，`openFixedDeposit` 方法将渲染带有适当错误消息的“创建存款”表单。如果没有报告错误，存款详情将保存到数据存储中。\n\
  \n你应该注意，`BindingResult` 参数必须紧跟在你想在控制器方法中访问的 `BindingResult` 模型属性参数之后。例如，在示例代码 11-21\
  \ 中，`BindingResult` 参数紧跟在 `newFixedDepositDetails` 模型属性之后。下面的示例代码展示了 `openFixedDeposit`\
  \ 方法模型属性和 `BindingResult` 对象的错误顺序：\n\n**示例代码 11-22** – 模型属性和 `BindingResult` 对象的错误顺序\n\
  \n```java\n.....\n\npublic class FixedDepositController {\n\n    .....\n\n    @RequestMapping(params\
  \ = \"fdAction=create\", method = RequestMethod.POST)\n    public String openFixedDeposit(\n\
  \        @ModelAttribute(value = \"newFixedDepositDetails\") FixedDepositDetails\
  \ fixedDepositDetails,\n        SessionStatus sessionStatus, BindingResult bindingResult)\
  \ {\n\n        .....\n    }\n\n    .....\n}\n```\n\n在上面的示例代码列表中，`newFixedDepositDetails`\
  \ 模型属性和 `BindingResult` 对象的顺序是错误的，因为 `SessionStatus` 参数被定义在它们之间。\n\n如果控制器方法接受多个模型属性，则每个模型属性对应的\
  \ `BindingResult` 对象将紧跟在每个模型属性参数之后，如下面的示例代码所示：\n\n**示例代码 11-23** – 多个模型属性及其对应的 `BindingResult`\
  \ 对象\n\n```java\n@RequestMapping\npublic String doSomething(\n    @ModelAttribute(value\
  \ = \"a\") AObject aObj,BindingResult bindingResultA,\n    @ModelAttribute(value\
  \ = \"b\") BObject bObj,BindingResult bindingResultB) {\n\n    .....\n}\n```\n\n\
  上面的示例代码显示，模型属性 `a` 和 `b` 均紧跟着它们对应的 `BindingResult` 对象。\n\n现在我们已经了解了数据绑定过程，让我们来看看在\
  \ Spring Web MVC 应用中是如何执行验证的。\n\n## 11-5 Spring 中的验证支持\n\n在上一节中，我们看到 `WebDataBinder`\
  \ 将请求参数绑定到模型属性。请求处理的下一步是验证模型属性。在 Spring Web MVC 应用中，你可以使用 Spring Validation API\
  \ 或通过在字段上指定 JSR 303 来验证模型属性。\n\n**注意**：在本章中，Spring Validation API 和 JSR 303 被用于验证应用\
  \ Web 层中的表单对象（即模型属性）。你应该注意，JSR 303 和 Spring Validation 都可验证任何层中的对象。\n\n让我们先来看如何使用\
  \ Spring 的 `Validator` 接口来验证模型属性。\n\n### 使用 Spring 的 Validator 接口验证模型属性\n\n下面的示例代码展示了\
  \ `MyBank` 应用中 `FixedDepositValidator` 类，该类用于验证 `FixedDepositDetails` 对象：\n\n**示例代码\
  \ 11-24** – `FixedDepositValidator`–Spring 的 `Validator` 接口\n\n**项目** – `ch11-data-binding`\n\
  \n**源位置**- `src/main/java/sample/spring/chapter11/web`\n\n```java\npackage sample.spring.chapter11.web;\n\
  \nimport org.springframework.validation.*;\nimport sample.spring.chapter11.domain.FixedDepositDetails;\n\
  \npublic class FixedDepositValidator implements Validator {\n\n    public boolean\
  \ supports(Class<?> clazz) {\n        return FixedDepositDetails.class.isAssignableFrom(clazz);\n\
  \    }\n\n    public void validate(Object target, Errors errors) {\n        FixedDepositDetails\
  \ fixedDepositDetails = (FixedDepositDetails) target;\n        long depositAmount\
  \ = fixedDepositDetails.getDepositAmount();\n        .....\n        if (depositAmount\
  \ < 1000) {\n            errors.rejectValue(\"depositAmount\", \"error.depositAmount.less\"\
  , \"must be greater than or equal to 1000\");\n        }\n        if (email == null\
  \ || \"\".equalsIgnoreCase(email)) {\n            ValidationUtils.rejectIfEmptyOrWhitespace(errors,\
  \ \"email\", \"error.email.blank\", \"must not be blank\");\n        }\n    .....\n\
  \    }\n}\n```\n\n\n\n\nSpring 的 `Validator` 接口定义了 `supports` 和 `validate` 方法。`supports`\
  \ 方法用于检查提供的对象实例（由 `clazz` 属性表示）是否可以被验证。如果 `supports` 方法返回 `true`，则使用 `validate`\
  \ 方法对对象进行验证。在上述示例列表中，`FixedDepositDetailsValidator` 的 `supports` 方法会检查提供的对象实例是否为\
  \ `FixedDepositDetails` 类型。如果 `supports` 方法返回 `true`，则 `FixedDepositDetailsValidator`\
  \ 的 `validate` 方法将对该对象进行验证。`validate` 方法接收待验证的对象实例以及一个 `Errors` 实例。`Errors` 实例用于存储和暴露验证过程中发生的错误。`Errors`\
  \ 实例提供了多个 `reject` 和 `rejectValue` 方法，用于向 `Errors` 实例注册错误。`rejectValue` 方法用于报告字段级错误，而\
  \ `reject` 方法用于报告适用于被验证对象的错误。Spring 的 `ValidationUtils` 类是一个工具类，提供了调用 `Validator`\
  \ 以及拒绝空字段的便利方法。\n\n接下来的图描述了在示例列表 11-24 中传递给 `rejectValue` 方法的参数，用于报告与 `FixedDepositDetails`\
  \ 的 `depositAmount` 字段对应的验证错误：\n\n![](img/00061.jpeg)\n\n**图 11-6** 向 `Errors` 实例的\
  \ `rejectValue` 方法传递的参数描述，用于报告与 `FixedDepositDetails` 的 `depositAmount` 字段对应的验证错误\n\
  \n上图显示，字段名、错误代码（基本上是一个消息键）和默认错误消息被传递给 `rejectValue` 方法。在第 13 章中，我们将看到 JSP 页面如何使用消息键显示资源包（resource\
  \ bundles）中的消息。\n\n你可以通过以下方式对模型属性进行验证：\n\n-   在 `Validator` 实现上显式调用 `validate` 方法\n\
  -   在 `WebDataBinder` 上设置 `Validator` 实现，并在 `@RequestMapping` 方法的模型模型属性参数上使用 JSR\
  \ 303 的 `@Valid` 注解\n\n让我们详细查看上述每种方法。\n\n### 通过显式调用 validate 方法验证模型属性\n\n接下来的示例列表显示了\
  \ `FixedDepositController` 的 `openFixedDeposit` 方法，该方法使用 `FixedDepositDetailsValidator`（参见示例列表\
  \ 11-24）来验证 `FixedDepositDetails` 模型属性：\n\n**示例列表 11-25** – `FixedDepositController`\
  \ – 通过显式调用 `FixedDepositDetailsValidator` 的 `validate` 方法进行验证\n\n**项目** – ch11-data-binding\n\
  \n**源位置**- src/main/java/sample/spring/chapter11/web\n\n```java\npackage sample.spring.chapter11.web;\n\
  \n.....\n\npublic class FixedDepositController {\n\n    .....\n\n    @RequestMapping(params\
  \ = \"fdAction=create\", method = RequestMethod.POST)\n    public String openFixedDeposit(\n\
  \        @ModelAttribute(value = \"newFixedDepositDetails\") FixedDepositDetails\
  \ fixedDepositDetails,\n        BindingResult bindingResult, SessionStatus sessionStatus)\
  \ {\n        new FixedDepositDetailsValidator().validate(fixedDepositDetails,bindingResult);\n\
  \        if (bindingResult.hasErrors()) {\n            logger.info(\"openFixedDeposit()\
  \ method: Validation errors\n                    - re-displaying form for opening\
  \ a new fixed deposit\");\n            return \"createFixedDepositForm\";\n    \
  \    }\n        .....\n    }\n}\n```\n\n上述示例列表显示 `openFixedDeposit` 方法创建了 `FixedDepositDetailsValidator`\
  \ 的实例并调用了它的 `validate` 方法。由于 `BindingResult` 是 `Errors` 的子接口，你可以在需要 `Errors` 对象的地方传递\
  \ `BindingResult` 对象。`openFixedDeposit` 方法将 `fixedDepositDetails` 模型属性和 `BindingResult`\
  \ 对象传递给 `validate` 方法。由于 `BindingResult` 已经包含了数据绑定错误，将 `BindingResult` 对象传递给 `validate`\
  \ 方法会将验证错误也添加到 `BindingResult` 对象中。\n\n### 使用 JSR 303 的 @Valid 注解调用模型属性验证\n\n你可以通过在模型属性参数上添加\
  \ JSR 303 的 `@Valid` 注解，并在 `WebDataBinder` 实例上设置该模型属性的验证器，指示 Spring 自动验证传递给 `@RequestMapping`\
  \ 方法的模型属性参数。\n\n接下来的示例列表显示了 `FixedDepositController` 的 `openFixedDeposit` 方法如何使用\
  \ `@Valid` 注解来验证 `FixedDepositDetails` 模型属性：\n\n**示例列表 11-26** – `FixedDepositController`\
  \ – 使用 `@Valid` 注解调用验证\n\n```java\nimport javax.validation.Valid;\n\n.....\n\npublic\
  \ class FixedDepositController {\n\n    .....\n\n    @RequestMapping(params = \"\
  fdAction=create\", method = RequestMethod.POST)\n    public String openFixedDeposit(\n\
  \            @Valid @ModelAttribute(value = \"newFixedDepositDetails\") FixedDepositDetails\n\
  \            fixedDepositDetails, BindingResult bindingResult, SessionStatus sessionStatus)\
  \ {\n        if (bindingResult.hasErrors()) {\n            logger.info(\"openFixedDeposit()\
  \ method: Validation errors\n                    - re-displaying form for opening\
  \ a new fixed deposit\");\n            return \"createFixedDepositForm\";\n    \
  \    }\n        .....\n    }\n\n    @InitBinder(value = \"FixedDepositDetails\"\
  )\n    public void initBinder(WebDataBinder webDataBinder) {\n        webDataBinder.registerCustomEditor(Date.class,\n\
  \            new CustomEditor(new SimpleDateFormat(\"MM-dd-yyyy\"), false));\n \
  \       webDataBinder.setValidator(new FixedDepositValidator());\n    }\n    .....\n\
  }\n```\n\n在上述示例列表中，`initBinder` 方法调用 `WebDataBinder` 的 `setValidator` 方法将 `FixedDepositValidator`\
  \ 设置为 `fixedDepositDetails` 模型属性的验证器，并且在 `openFixedDeposit` 方法中对模型属性使用了 `@Valid`\
  \ 注解。当 `openFixedDeposit` 被调用时，会对 `fixedDepositDetails` 模型属性执行数据绑定和验证，结果通过 `BindingResult`\
  \ 参数可用。\n\n注意的是，如果 `@InitBinder` 指定了属性名称，则设置在 `WebDataBinder` 上的验证器仅适用于该属性。例如在示例\
  \ 11-26。如果验证器适用于多个控制器，请考虑在 `@ControllerAdvice` 类内部定义 `@InitBinder` 方法（或使用 `BindingInitializer`）为\
  \ `WebDataBinder` 设置验证器。\n\n### 使用 JSR 303 注解指定约束\n\nJSR 303（Bean Validation API）定义了你可以用于指定\
  \ JavaBean 组件属性约束的注解。\n\n**IMPORT chapter11/ch11-303-validation**（该项目是 ch11-data-binding\
  \ 项目的修改版本，它使用 JSR 303 注解来为 FixedDepositDetails 对象指定约束。如果你将项目部署在 Tomcat 服务器上并访问 URL\
  \ http://localhost:8080/ch11-303-validation，你将看到系统中的定单列表。）\n\n接下来的示例列表显示了 `FixedDepositDetails`\
  \ 类使用 JSR 303 注解对其字段指定约束：\n\n**示例列表 11-27** – `FixedDepositDetails` – 指定 JSR 303\
  \ 约束\n\n```java\npackage sample.spring.chapter11.domain;\n\nimport javax.validation.constraints.*;\n\
  \npublic class FixedDepositDetails {\n\n    private long id;\n\n    @Min(1000)\n\
  \    @Max(500000)\n    private long depositAmount;\n\n    @Email\n    @Size(min=10,\
  \ max=25)\n    private String email;\n\n    @NotNull\n    private Date maturityDate;\n\
  \n    .....\n}\n```\n\n\n\n\n`@Min`, `@Max`, `@Email`, `@Size` 和 `@NotNull` 是 JSR\
  \ 303 定义的一些注解。上面的示例列表显示，通过使用 JSR 303 注解，`FixedDepositDetails` 类清晰地指定了应用于其字段的约束条件。另一方面，如果你使用\
  \ Spring 的 `Validator` 实现来校验对象，约束条件则包含在 `Validator` 实现中（参见示例列表 11-24）。\n\n下表描述了\
  \ JSR 303 注解对示例列表 11-27 所示的 `FixedDepositDetails` 对象执行的约束：\n\n| JSR 303 注解 | 约束描述\
  \ |\n| :--- | :--- |\n| `@NotNull` | 被注解的字段不能为 null。例如，`maturityDate` 字段不能为空。 |\n\
  | `@Min` | 被注解的字段的值必须大于或等于指定的最小值。例如，在 `FixedDepositDetails` 对象的 `depositAmount`\
  \ 字段上的 `@Min(1000)` 注解意味着 `depositAmount` 的值必须大于或等于 1000。 |\n| `@Max` | 被注解的字段的值必须小于或等于指定的值。例如，在\
  \ `FixedDepositDetails` 对象的 `depositAmount` 字段上的 `@Max(500000)` 注解意味着 `depositAmount`\
  \ 的值必须小于或等于 500000。 |\n| `@Size` | 被注解的字段的大小必须在指定的 min 和 max 属性之间。例如，在 `FixedDepositDetails`\
  \ 对象的 `email` 字段上的 `@Size(min=5, max=100)` 注解意味着 `email` 字段的大小必须大于或等于 5 且小于或等于 100。\
  \ |\n| `@Email` | 被注解的字段的值必须是格式正确的电子邮件地址。例如，在 `FixedDepositDetails` 对象的 `email`\
  \ 字段上的 `@Email` 注解意味着 `email` 字段的值必须是格式正确的电子邮件地址。 |\n\n要使用 JSR 303 注解，`ch11-jsr303-validation`\
  \ 项目指定了 JSR 303 API JAR 文件（`validation-api-1.0.0.GA`）和 Hibernate Validator 框架（`hibernate-validation-4.3.0.Final`）的依赖。Hibernate\
  \ Validator 框架提供了 JSR 303 的参考实现。Hibernate Validator 框架提供了额外的约束注解，你可以将其与 JSR 303\
  \ 注解配合使用。例如，你可以使用 Hibernate Validator 的 `@NotBlank` 注解来指定字段的值不能为 null 或空。\n\n需要注意的是，JSR\
  \ 303 还允许你创建自定义约束并在应用程序中使用它们。例如，你可以创建一个 `@MyConstraint` 自定义约束以及相应的校验器，以在对象上强制执行该约束。\n\
  \n现在，由于 que 我们已经在 `FixedDepositDetails` 类上指定了 JSR 303 约束，让我们来看如何校验 `FixedDepositDetails`\
  \ 对象。\n\n### 校验使用 JSR 303 注解的对象\n\n如果在应用程序的类路径中发现了 JSR 303 促进者（如 `Hibernate Validator`），并且你在\
  \ Web 应用上下文 XML 文件中指定了 Spring `mvc` Schema 的 `<annotation-driven>` 元素，那么 Spring\
  \ 将自动启用对 JSR 303 的支持。在后台，`<annotation-driven>` 元素配置了 Spring `LocalValidatorFactoryBean`\
  \ 类的实例，该实例负责检测应用程序类路径中是否存在 JSR 303 促进者（如 `Hibernate Validator`）并初始化它。\n\n`LocalValidatorFactoryBean`\
  \ 实现了 JSR 303 的 `Validator` 和 `ValidatorFactory` 接口，以及 Spring 的 `Validator` 接口。因此，你可以选择通过调用\
  \ Spring `Validator` 接口的 `validate` 方法或调用 JSR 303 `Validator` 接口的 `validate` 方法来校验对象。正如之前讨论的，你也可以通过简单在模型属性参数上添加\
  \ `@Valid` 注解，指示 Spring 自动校验传递给 `@RequestMapping` 方法的模型属性参数。\n\n#### 通过显式调用 validate\
  \ 方法校验模型属性\n\n下面的示例显示了 `FixedDepositController` 类，它使用 Spring 的 `Validator` 来校验使用了\
  \ JSR 303 约束的 `FixedDepositDetails` 对象（参见示例列表 11-27）：\n\n**示例列表 11-28** – `FixedDepositController`\
  \ – 使用 Spring Validation API 校验 `FixedDepositDetails`\n\n**项目** – `ch11-jsr303-validation`\n\
  \n**源码位置** - `src/main/java/sample/spring/chapter11/web`\n\n```java\npackage sample.spring.chapter11.web;\n\
  \nimport javax.validation.Valid;\n\n.....\n\npublic class FixedDepositController\
  \ {\n\n    .....\n\n    @Autowired\n    private Validator validator;\n\n    .....\n\
  \n    @RequestMapping(params = \"fdAction=create\", method = RequestMethod.POST)\n\
  \    public String openFixedDeposit(\n            @ModelAttribute(value = \"newFixedDepositDetails\"\
  ) FixedDepositDetails fixedDepositDetails,\n            BindingResult bindingResult,\
  \ SessionStatus sessionStatus) {\n\n        validator.validate(fixedDepositDetails,\
  \ bindingResult);\n        if (bindingResult.hasErrors()) { ..... } .....\n\n  \
  \  }\n}\n```\n\n在示例列表中，`LocalValidatorFactoryBean`（实现了 Spring 的 `Validator` 接口）被自动注入到\
  \ `FixedDepositController` 中。在 `openFixedDeposit` 方法中，使用 `BindingResult` 对象持有校验错误。示例列表中需要注意的是，`FixedDepositController`\
  \ 没有直接处理 JSR 303 特定 API。相反，使用的是 Spring Validation API 来校验 `FixedDepositDetails`。\n\
  \n下面的示例显示了使用 JSR 303 特定 API 的 `FixedDepositController` 变体：\n\n**示例列表 11-29** – 使用\
  \ Spring Validation API 校验 `FixedDepositDetails`\n\n```java\nimport javax.validation.ConstraintViolation;\n\
  import javax.validation.Validator;\nimport java.util.Set;\n\n.....\n\npublic class\
  \ FixedDepositController {\n\n    .....\n\n    @Autowired\n    private Validator\
  \ validator;\n\n    .....\n\n    @RequestMapping(params = \"fdAction=create\", method\
  \ = RequestMethod.POST)\n    public String openFixedDeposit(\n            @ModelAttribute(value\
  \ = \"newFixedDepositDetails\") FixedDepositDetails fixedDepositDetails,\n     \
  \       BindingResult bindingResult, SessionStatus sessionStatus) {\n\n        Set<ConstraintViolation<FixedDepositDetails>>\
  \ violations = validator.validate(fixedDepositDetails);\n        Iterator<ConstraintViolation<FixedDepositDetails>>\
  \ itr = violations.iterator();\n        if (itr.hasNext()) { ..... } .....\n\n \
  \   }\n\n    .....\n}\n```\n\n在示例列表中，`LocalValidatorFactoryBean`（实现了 JSR 303 的 `Validator`\
  \ 接口）被自动注入到 `FixedDepositController` 中。在 `openFixedDeposit` 方法中，调用 `validate` 方法会导致调用\
  \ `LocalValidatorFactoryBean` 的 `validate(T)` 方法来校验 `FixedDepositDetails` 实例。`validate`\
  \ 方法返回一个 `java.util.Set` 对象，其中包含 JSR 303 促进者报告的约束违反。你可以检查 `validate` 方法返回的 `java.util.Set`\
  \ 对象来发现是否报告了任何约束违反。\n\n#### 使用 JSR 303 的 @Valid 注解调用模型属性校验\n\n通过在模型属性参数上添加 JSR 303\
  \ 的 `@Valid` 注解，你可以指示 Spring 自动校验传递给 `@RequestMapping` 方法的模型属性参数。下面的示例显示了 `FixedDepositController`\
  \ 的 `editFixedDeposit` 方法，它使用 `@Valid` 注解来校验 `editableFixedDepositDetails` 模型属性：\n\
  \n**示例列表 11-30** – `FixedDepositController` – 使用 `@Valid` 注解调用校验\n\n\n\n\n\n```java\n\
  package sample.spring.chapter11.web;\n\nimport javax.validation.Valid;\n\n.....\n\
  \npublic class FixedDepositController {\n\n    .....\n\n    @RequestMapping(params\
  \ = \"fdAction=edit\", method = RequestMethod.POST)\n    public String editFixedDeposit(\n\
  \        @Valid @ModelAttribute(\"editableFixedDepositDetails\") FixedDepositDetails\
  \ fixedDepositDetails,\n        BindingResult bindingResult, SessionStatus sessionStatus)\
  \ {\n        if (bindingResult.hasErrors()) { ..... } .....\n    }\n\n    .....\n\
  }\n```\n\n在上面的示例代码中，针对 `editableFixedDepositDetails` 模型属性的 `@Valid` 注解会导致 Spring\
  \ 对进行自动验证。在验证期间报告的约束违规将将与任何数据绑定错误一起添加到 `BindingResult` 对象中。\n\n现在让我们来看看 Spring 的表单标签库是如何简化在\
  \ JSP 页面中编写表单的。\n\n## 11-6 Spring 的表单标签库\n\nSpring 的表单标签库提供了一些标签，可以简化为 Spring Web\
  \ MVC 应用创建 JSP 页面的工作。Spring 表单标签库提供了用于渲染各种输入表单元素的标签，以及将表单数据绑定到表单支持对象的标签。\n\n下面的示例代码展示了\
  \ `ch11-jsr303-validation` 项目中的 `createFixedDepositForm.jsp` JSP 页面，该页面使用了 Spring\
  \ 的表单标签库：\n\n**示例代码 11-31** – `createFixedDepositForm.jsp` – Spring 表单标签库的使用\n\n\
  **项目** – `ch11-jsr303-validation`\n\n**源码位置**- `src/main/webapp/WEB-INF/jsp`\n\n\
  ```jsp\n<%@taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\"%>\n<%@taglib\
  \ prefix=\"form\" uri=\"http://www.springframework.org/tags/form\"%>\n\n<html\n\
  .....\n    <form:form commandName=\"newFixedDepositDetails\"\n        name=\"createFixedDepositForm\"\
  \ method=\"POST\"\n        action=\"${pageContext.request.contextPath}/fixedDeposit?fdAction=create\"\
  >\n        .....\n        <tr\n            <td class=\"td\"><b>金额 (美元):</b></td>\n\
  \            <td class=\"td\"><form:input path=\"depositAmount\" />\n          \
  \      <font style=\"color: #C11B17;\"><form:errors path=\"depositAmount\"/></font>\n\
  \            </td>\n        </tr>\n        <tr\n            <td class=\"td\"><b>到期日期:</b></td>\n\
  \            <td class=\"td\"><form:input path=\"maturityDate\" />\n           \
  \     <font style=\"color: #C11B17;\"><form:errors path=\"maturityDate\"/></font>\n\
  \            </td>\n        </tr>\n        .....\n        <td class=\"td\"><input\
  \ type=\"submit\" value=\"Save\" /></td>\n        .....\n    </form:form>\n</html>\n\
  ```\n\n在上面的示例代码中，通过以下 `taglib` 指令使得 Spring 表单标签库标签在 JSP 页面中可用：\n\n```jsp\n<%@taglib\
  \ prefix=\"form\" uri=\"http://www.springframework.org/tags/form\"%>\n```\n\nSpring\
  \ 表单标签库的 `<form>` 标签渲染一个 HTML 表单，该表单将表单字段绑定到由 `commandName` 属性标识的模型属性的属性。`<form>`\
  \ 标签包含 `<input>` 标签，这些标签对应于由 `commandName` 属性指定的模型属性的属性。当表单被渲染时，属性从模型属性中读取并通过 `<input>`\
  \ 标签显示。当表单提交时，表单中的字段值将绑定到模型属性的相应属性。\n\n在示例代码 11-31 中，`<form>` 标签渲染了一个用于开启定期存款的 HTML\
  \ 表单。`commandName` 属性的值为 `newFixedDepositDetails`，这意味着表单字段映射到 `newFixedDepositDetails`\
  \ 模型属性的属性上。`name` 属性指定了由 `<form>` 渲染的 HTML 表单的名称。\n\n\n\n\n\n`required=\"required\"\
  ` 属性指定用户必须在 `textarea` 中输入信息。使用 `required` 属性可以节省编写 JavaScript 代码来对必填字段进行客户端验证的工作。如果用户没有在\
  \ `textarea` 中输入任何信息并尝试提交表单，网络浏览器将显示一条消息，说明 `textarea` 是必填的且不能为空。\n\n在 HTML5 中，你可以将\
  \ `type` 属性的值指定为 `email`、`datetime`、`date`、`month`、`week`、`time`、`range`、`color`、`reset`\
  \ 等。从 Spring 3.1 开始，`<input>` 标签支持指定 `text` 以外的 `type` 属性值。例如，以下 `<input>` 标签将 `type`\
  \ 属性的值指定为 `email`：\n\n```html\n<form:input path=\"myProperty\" type=\"email\"/>\n\
  ```\n\n当用户尝试提交包含 email 类型字段的表单时，网络浏览器会检查该 字段是否包含有效的电子邮件地址。如果字段不包含有效的电子邮件地址，网络浏览器将显示一条消息，指示该字段不包含有效的电子邮件地址。由于网络浏览器执行了验证，你就不需要编写\
  \ JavaScript 代码来验证电子邮件地址。\n\n## 11-7 总结\n\n在本章中，我们查看了 Spring Web MVC 的许多核心特性。我们介绍了\
  \ `@ModelAttribute` 和 `@SessionAttributes` 注解，这些注解在开发带注解的控制器时常用。我们还深入研究了 Spring\
  \ 如何执行数据绑定和验证。在下一章中，我们将学习如何使用 Spring Web MVC 开发 RESTful Web 服务。\n\n# 第 12 章 – 使用\
  \ Spring Web MVC 开发 RESTful Web 服务\n\n## 12-1 引言\n\n表述层状态转移（也称为 `REST`）是一种架构风格，其中应用程序定义了由\
  \ URI（统一资源标识符）*唯一*标识的*资源*。REST 风格应用的客户端通过向资源映射的 URI 发送 HTTP `GET`、`POST`、`PUT` 和\
  \ `DELETE` 方法请求来与资源进行交互。下图展示了一个由其客户端访问的 REST 风格应用：\n\n![](img/00062.jpeg)\n\n**图\
  \ 12-1** REST 风格应用定义了 x 和 y 资源，分别由 `/resource2` 和 `/resource1` URI 唯一标识。\n\n上图显示了一个由两个资源\
  \ x 和 y 组成的 REST 风格应用。资源 x 映射到 `/resource2` URI，资源 y 映射到 `/resource1` URI。客户端可以通过向\
  \ `/resource2` URI 发送 HTTP 请求来与资源 x 交互，通过向 `/resource1` URI 发送 HTTP 请求来与资源 y 交互。\n\
  \n如果一个 Web 服务遵循 REST 架构风格，则被称为 *RESTful Web 服务*。在 RESTful Web 服务的语文中，你可以将资源视为 Web\
  \ 服务所暴露的*数据*。客户端可以通过向 RESTful Web 服务发送 HTTP 请求，对暴露的数据执行 CRUD（创建、读取、更新和删除）操作。客户端与\
  \ RESTful Web 服务交换数据的*表表示*，这种表示可以是 XML、JSON（JavaScript 对象表示）格式、简单字符串，或 HTTP 协议支持的任何其他\
  \ MIME 类型。\n\n与基于 SOAP 的 Web 服务相比，RESTful Web 服务实现更简单且更具可扩展性。在基于 SOAP 的 Web 服务中，请求和响应始终是\
  \ XML 格式。在 RESTful Web 服务中，你可以使用 JSON（JavaScript 对象表示）、XML、纯文本等作为请求和响应。在本章中，我们将查看\
  \ Spring Web MVC 如何简化 RESTful Web 服务的开发和访问。\n\n让我们从查看将使用 Spring Web MVC 实现的 RESTful\
  \ Web 服务的需求开始。\n\n## 12-2 定期存款 Web 服务\n\n我们之前看到 MyBank Web 应用程序提供了显示定期存款列表的功能，以及创建、编辑和关闭定期存款的功能。由于定期存款相关功能可能被其他应用程序访问，因此需要将定期存款相关功能从\
  \ MyBank Web 中提取出来，并部署为 RESTful Web 服务。我们将这个新的 RESTful Web 服务命名为 `FixedDepositWS`。\n\
  \n下图显示 MyBank 和 Settlement 应用程序访问了 `FixedDepositWS` Web 服务：\n\n![](img/00063.jpeg)\n\
  \n**图 12-2** MyBank 和 Settlement 应用访问 `FixedDepositWS` Web 服务\n\n上图显示 MyBank 和 Settlement\
  \ Web 应用通过交换 JSON 格式的数据与 `FixedDepositWS` Web 服务交互。我们很快就会看到，JSON 是应用程序之间交换数据时比 XML\
  \ 更简单的替代方案。\n\n现在让我们如何使用 Spring Web MVC 将 `FixedDepositWS` Web 服务实现为 RESTful Web\
  \ 服务。\n\n## 12-3 使用 Spring Web MVC 实现 RESTful Web 服务\n\n要开发 RESTful Web 服务，你需要执行以下操作：\n\
  \n- 识别 Web 服务暴露的资源\n- 为识别出的资源指定相应的 URI\n- 识别可以在资源上执行的操作\n- 将 HTTP 方法映射到识别的操作\n\n\
  在 `FixedDepositWS` Web 服务中，定期存款数据代表 Web 服务暴露的资源。如果 `FixedDepositWS` Web 服务将系统中的定期存款映射到\
  \ `/fixedDeposits` URI，则 `FixedDepositWS` 服务客户端就可以通过向 `/fixedDeposits` URI 发送 HTTP\
  \ 请求对定期存款执行操作。\n\n在 RESTful Web 服务中，客户端用于与资源交互的 HTTP 方法表示要在资源上执行的操作。`GET` 获取资源状态，`POST`\
  \ 创建新资源，`PUT` 修改资源状态，`DELETE` 删除资源。下图显示了当客户端向以下发送 `GET`、`POST`、`PUT` 和 `DELETE`\
  \ 请求时 `FixedDepositWS` 服务执行的操作：\n\n![](img/00064.jpeg)\n\n**图 12-3** 客户端向 /fixedDeposits\
  \ 发送 HTTP 请求以交互数据\n\n上图显示客户端向 `/fixedDeposits` 发送 `GET`、`POST`、`PUT` 和 `DELETE`\
  \ 请求以与数据交互。`id` 查询字符串参数唯一标识一个定期存款。下表定义了图中每个请求的目的：\n\n| HTTP 方法 | URI | 目的 |\n| :---\
  \ | :--- | :--- |\n| `GET` | `/fixedDeposits` | 获取系统中所有定期存款的详情。FixedDepositWS Web\
  \ 服务以 JSON 格式发送响应。 |\n| `GET` | `/fixedDeposits?id=123` | 获取 id 为 123 的定期存款详情。FixedDepositWS\
  \ Web 服务以 JSON 格式发送响应。 |\n| `POST` | `/fixedDeposits` | 在系统中创建一个定期存款。客户端以 JSON 格式发送要创建的存款详情。\
  \ |\n| `PUT` | `/fixedDeposits?id=123` | 修改 id 为 123 的定期存款。客户端以 JSON 格式发送修改后的存款详情。\
  \ |\n| `DELETE` | `/fixedDeposits?id=123` | 删除 id 为 123 的定期存款。 |\n\n上表显示了 FixedDepositWS\
  \ 及其客户端通过 JSON 格式交换信息。在深入细节如何实现 FixedDepositWS 之前，让我们看看数据在 JSON 格式下的样子。\n\n### JSON\
  \ (JavaScript 对象表示)\n\nJSON 是一种基于文本的数据格式，用于应用程序交换*结构化*数据。由于 JSON 的数据表示比 XML 更加紧凑，因此\
  \ JSON 是 XML 更简单的替代方案。为了简化 Java 对象与 JSON 之间的相互向转换，你可以使用 JSON 库，如 `FlexJson` ([`flexjson.sourceforge.net/`](http://flexjson.sourceforge.net/))\
  \ 和 `Jackson` ([`github.com/FasterXML/jackson`](https://github.com/FasterXML/jackson))。\n\
  \n\n\n\n\n假设有一个 `Person` 类定义了 `firstName` 和 `lastName` 属性。如果你创建一个 `Person` 对象的实例，并将\
  \ `firstName` 设置为 `Myfirstname`，将 `lastName` 设置为 `Mylastname`，那么该 `Person` 对象在 JSON\
  \ 格式下的表示将如下：\n\n示例列表 12-1 – JSON 格式下的 Person 对象表示\n\n```json\n{\n    \"firstName\"\
  \ : Myfirstname,\n    \"lastName\" : \"Mylastname\"\n}\n```\n\n上面的示例列表显示，`Person`\
  \ 对象的每个属性在 JSON 格式中都被表示为 `<attribute-name>` : `<attribute-value>`。\n\n你也可以用 JSON\
  \ 格式表示 Java 对象的集合。下面的示例列表展示了如何用 JSON 格式表示 `Person` 对象的集合：\n\n示例列表 12-2 – 用 JSON\
  \ 格式表示的 Person 对象集合\n\n```json\n[\n    {\n        \"firstName\" : Myfirstname,\n\
  \        \"lastName\" : \"Mylastname\"\n    },\n    {\n        \"firstName\" : Yourfirstname,\n\
  \        \"lastName\" : \"Yourlastname\"\n    }   \n]\n```\n\n你不需要编写代码将对象转换为 JSON\
  \ 表示，反之亦然。相反，RESTful Web 服务及其客户端可以使用 `FlexJson` 或 `Jackson` 库来执行转换。正如我们很快将看到的，Spring\
  \ Web MVC 使用 `Jackson` 将 JSON 转换为 Java 对象，反之亦然。\n\n现在让我们来看使用 Spring Web MVC 实现的\
  \ `FixedDepositWS` Web 服务。\n\n**导入** 章节 `12/ch12-webservice`（此项目展示了使用 Spring Web\
  \ MVC 实现的 `FixedDepositWS` RESTful Web 服务。在本章稍后部分，我们将看到客户端如何访问 `FixedDepositWS`\
  \ Web 服务。）\n\n### FixedDepositWS Web 服务实现\n\nSpring Web MVC 注解如 `@Controller`、`@RequestMapping`、`@RequestParam`、`@PathVariable`、`@ResponseBody`、`@RequestBody`\
  \ 等支持构建 RESTful Web 服务。在本节中，我们将查看这些注解如何开发 `FixedDepositWS` Web 服务。\n\n在 `FixedDepositWS`\
  \ Web 服务中，`FixedDepositController`（一个 Spring Web MVC 控制器）负责处理 Web 服务请求。`FixedDepositController`\
  \ 与其他任何 Spring Web MVC 控制器类似，不同之处它的 `@RequestMapping` 方法不渲染视图。下面的示例列表显示，@Controller`\
  \ 和 `@RequestMapping` 注解用于将 Web 请求映射到 `FixedDepositController` 类的适当方法：\n\n示例列表 12-3\
  \ – FixedDepositController – Web 服务请求处理器\n\n**项目** – `ch12-webservice`\n\n**源码位置**-\
  \ `src/main/java/sample/spring/chapter12/web`\n\n```java\npackage sample.spring.chapter12.web;\n\
  \nimport org.springframework.http.ResponseEntity;\n\n.....\n\n@Controller\n@RequestMapping(value\
  \ = \"/fixedDeposits\")\npublic class FixedDepositController {\n    .....\n    @RequestMapping(method\
  \ = RequestMethod.GET)\n    public ResponseEntity<List<FixedDepositDetails>> getFixedDepositList()\
  \ { ..... }\n\n    @RequestMapping(method = RequestMethod.GET, params = \"id\")\n\
  \    public ResponseEntity<FixedDepositDetails> getFixedDeposit(@RequestParam(\"\
  id\") int id) { ..... }\n\n    .....\n}\n```\n\n`getFixedDepositList` 方法返回系统中的固定存款列表，而\
  \ `getFixedDeposit` 方法返回根据 `id` 参数识别的固定存款详情。上面的示例列表显示，`@RequestMapping` 注解在类级和方法级上被用于将请求映射到\
  \ `getFixedDepositList` 和 `getFixedDeposit` 方法。当客户端应用程序向 `/fixedDeposits` URI 发送\
  \ HTTP GET 请求时，会调用 `getFixedDepositList` 方法；当客户端应用程序发送包含 `id` 请求参数的 HTTP GET 请求到\
  \ `/fixedDeposits` URI 时，会调用 `getFixedDeposit` 方法。因此，如果请求 URI 为 `/fixedDeposits?id=123`，则调用\
  \ `getFixedDeposit` 方法。\n\n下表总结了请求 URI 和 HTTP 方法到 `FixedDepositController` 类中定义方法的映射：\n\
  \n| HTTP 方法 | URI | FixedDepositController 方法 |\n| :--- | :--- | :--- |\n| GET |\
  \ /fixedDeposits | getFixedDepositList |\n| GET | /fixedDeposits?id=123 | getFixedDeposit\
  \ |\n| POST | /fixedDeposits | openFixedDeposit |\n| PUT | /fixedDeposits?id=123\
  \ | editFixedDeposit |\n| DELETE | /fixedDeposits?id=123 | closeFixedDeposit |\n\
  \n我们在第 10 章和第 11 章中看到，带有 `@RequestMapping` 注解的方法返回视图信息，`DispatcherServlet` 使用该信息渲染视图（如\
  \ JSP 或 servlet）。在 RESTful Web 服务中，`@RequestMapping` 方法向客户端应用程序返回数据（而不是视图信息）。由于由于原因，`getFixedDepositList`\
  \ 和 `getFixedDeposit` 方法被定义为返回 `ResponseEntity` 类型的对象。现在让我们来看 `FixedDepositController`\
  \ 类中 `ResponseEntity` 对象的使用。\n\n#### 使用 ResponseEntity 指定 HTTP 响应\n\n`ResponseEntity`\
  \ 表示包含标头、正文和状态码的 HTTP 响应。你在 `ResponseEntity` 对象上设置为 `body` 的对象会被 Spring Web MVC\
  \ 写入 HTTP 响应体。\n\n下面的示例列表展示了 `FixedDepositController` 的 `getFixedDepositList` 方法如何创建\
  \ `ResponseEntity` 对象：\n\n示例列表 12-4 – FixedDepositController – 创建 ResponseEntity\
  \ 实例\n\n**项目** – `ch12-webservice`\n\n**源码位置**- `src/main/java/sample/spring/chapter12/web`\n\
  \n```java\npackage sample.spring.chapter12.web;\n\nimport org.springframework.http.HttpStatus;\n\
  import org.springframework.http.ResponseEntity;\n\n.....\n\npublic class FixedDepositController\
  \ {\n    .....\n    @RequestMapping(method = RequestMethod.GET)\n    public ResponseEntity<List<FixedDepositDetails>>\
  \ getFixedDepositList() {\n        .....\n        return new ResponseEntity<List<FixedDepositDetails>>(fixedDepositService.getFixedDeposits(),\
  \ HttpStatus.OK);\n    }\n    .....\n}\n```\n\n在上面的示例，传递给 `ResponseEntity` 构造函数的固定存款列表被写入\
  \ HTTP 响应体。`HttpStatus` 是定义 HTTP 状态码的枚举类型。常量 `OK` 代表 HTTP 状态码 200。注意 `getFixedDepositList`\
  \ 方法的返回类型为 `ResponseEntity<List<FixedDepositDetails>>`，这意味着写入 HTTP 响应体。Spring Web\
  \ MVC 使用合适的 `HttpMessageConverter`（在第 12-5 节）将 `List<FixedDepositDetails>` 对象转换为客户端期望的格式。\n\
  \n**注意** 在在本章稍后，我们将看到客户端应用程序可以使用 Spring 的 `RestTemplate` 调用 `FixedDepositController`\
  \ 中定义的方法并检索写入 HTTP 响应体的对象。\n\n`FixedDepositController` 类中所有带有 `@RequestMapping`\
  \ 注解的方法都将 `ResponseEntity` 定义为返回类型。如果你不需要在响应中发送 HTTP 状态码，可以使用 Spring 的 `HttpEntity`\
  \ 类代替 `ResponseEntity`。`HttpEntity` 表示 HTTP 请求或响应，而 `ResponseEntity` 是 `HttpEntity`\
  \ 的子类，为响应添加了 HTTP 状态码。\n\n下面的示例列表展示了 `getFixedDepositList` 方法的修改版本，它创建并返回 `HttpEntity`\
  \ 实例：\n\n示例列表 12-5 – FixedDepositController – 用 HttpEntity 代替 ResponseEntity\n\n\
  ```java\npackage sample.spring.chapter12.web;\n\nimport org.springframework.http.HttpStatus;\n\
  import org.springframework.http.HttpEntity;\n\n.....\n\npublic class FixedDepositController\
  \ {\n    .....\n    @RequestMapping(method = RequestMethod.GET)\n    public HttpEntity<List<FixedDepositDetails>>\
  \ getFixedDepositList() {\n        .....\n        return new HttpEntity<List<FixedDepositDetails>>(fixedDepositService.getFixedDeposits());\n\
  \    }\n    .....\n}\n```\n\n\n\n\n\n上述示例列表显示，系统中的固定存款被传递给 `HttpEntity` 构造函数。与 `ResponseEntity`\
  \ 的情况类似（参见示例列表 12-4），传递给 `HttpEntity` 的固定存款会被写入 HTTP 响应体。\n\n`HttpEntity` 和 `ResponseEntity`\
  \ 对象都允许你设置 HTTP 响应头。接下来的示例列表展示了在 HTTP 响应上设置 `some-header` 响应头的场景：\n\n**示例列表 12-6**\
  \ – HttpHeaders 的用法\n\n```java\nimport org.springframework.http.HttpHeaders;\n\n\
  .....\n\n    @RequestMapping(method = RequestMethod.GET)\n    public HttpEntity<String>\
  \ doSomething() {\n        HttpHeaders responseHeaders = new HttpHeaders();\n  \
  \      responseHeaders.set(\"some-header\", \"some-value\");\n        return new\
  \ HttpEntity<String>(\"Hello world !\", responseHeaders);\n    }\n\n.....\n```\n\
  \nSpring 的 `HttpHeaders` 对象包含了设置在 HTTP 响应上的标头。在上面的示例列表中，`HttpHeaders` 的 `set` 方法设置了\
  \ `some-header` 响应头（值为 `some-value`）。当调用 `doSomething` 方法时，‘Hello world !’ 字符串会被写入响应体，并且\
  \ `some-header` 头会被写入 HTTP 响应。\n\n由于 `@RequestMapping` 方法可以定义为接受 `HttpServletResponse`\
  \ 对象作为参数，让我们来看如何直接在 `HttpServletResponse` 对象上设置响应体和头部。\n\n### 使用 HttpServletResponse\
  \ 指定 HTTP 响应\n\n下面的示例列表展示了一个直接写入 `HttpServletResponse` 对象的 `@RequestMapping` 方法：\n\
  \n**示例列表 12-7** – 在 HttpServletResponse 上设置响应\n\n```java\nimport javax.servlet.http.HttpServletResponse;\n\
  \n.....\n\n    @RequestMapping(method = RequestMethod.GET)\n    public void doSomething(HttpServletResponse\
  \ response) throws IOException {\n        response.setHeader(\"some-header\", \"\
  some-value\");\n        response.setStatus(200);\n        response.getWriter().write(\"\
  Hello world !\");\n    }\n\n.....\n```\n\n与其直接向 `HttpServletResponse` 写入响应，你应该使用\
  \ `ResponseEntity`（或 `HttpEntity`）对象来提高控制器的可测试性。\n\n现在让我们来看 Spring 的 `@ResponseBody`\
  \ 方法级注解，它将方法的返回值写入 HTTP 响应体。\n\n**注意** 自从 Spring 4.0 起，`@ResponseBody` 注解也可以在类级别上指定。如果在类级别指定了\
  \ `@ResponseBody` 注解，它会被控制器的 `@RequestMapping` 方法继承。\n\n### 使用 @ResponseBody 将方法的返回值绑定到\
  \ HTTP 响应体\n\n下面的示例列表展示了 `@ResponseBody` 注解的用法：\n\n**示例列表 12-8** – @ResponseBody\
  \ 注解用法\n\n```java\nimport org.springframework.web.bind.annotation.ResponseBody;\n\
  \n.....\n\n    @RequestMapping(method = RequestMethod.GET)\n    @ResponseBody\n\
  \    public String doSomething() {\n        return \"Hello world !\";\n    }\n\n\
  .....\n```\n\n在上面的示例列表中，`doSomething` 方法返回的‘Hello world !’字符串值被写入 HTTP 响应体。在第 10\
  \ 章第 10-7 节中，我们讨论过，如果带有 `@RequestMapping` 注解的方法返回类型为 `String`，则返回的值被视为要渲染的*视图*名称。在上面的示例列表中，`doSomething`\
  \ 方法上的 `@ResponseBody` 注解指示 Spring Web MVC 将字符串值写入 HTTP 响应体，而不是将字符串值视为视图名称。你应该注意，Spring\
  \ 使用适当的 `HttpMessageConverter`（在第 12-5 节中解释）实现将带有 `@ResponseBody` 注解的方法返回的值写入 HTTP\
  \ 响应体。\n\n现在我们已经已经了 `@RequestMapping` 方法写入 HTTP 响应的不同方式，让我们来看 `@RequestMapping`\
  \ 方法如何使用 `@RequestBody` 注解从 HTTP 请求体中读取信息。\n\n### 使用 @RequestBody 将 HTTP 请求体绑定到方法参数\n\
  \n带有 `@RequestMapping` 注解的方法可以使用 `@RequestBody` 方法参数级注解将 HTTP 请求体绑定到方法参数。Spring\
  \ Web MVC 使用适当的 `HttpMessageConverter`（在第 12-5 节中解释）实现将 HTTP 请求体转换为方法参数类型。下面的示例列表展示了\
  \ MyBank 应用中 `FixedDepositController` 中 `@RequestBody` 注解的用法：\n\n**示例列表 12-9** –\
  \ @RequestBody 注解用法\n\n**项目** – `ch12-webservice`\n**源码位置** - `src/main/java/sample/spring/chapter12/web`\n\
  \n```java\npackage sample.spring.chapter12.web;\n\n.....\n\nimport org.springframework.web.bind.annotation.RequestBody;\n\
  \n.....\n\n@Controller\n@RequestMapping(value = \"/fixedDeposits\")\npublic class\
  \ FixedDepositController {\n    .....\n\n    @RequestMapping(method = RequestMethod.POST)\n\
  \    public ResponseEntity<FixedDepositDetails> openFixedDeposit(\n            @RequestBody\
  \ FixedDepositDetails fixedDepositDetails,\n            BindingResult bindingResult)\
  \ {\n        new FixedDepositDetailsValidator().validate(fixedDepositDetails, bindingResult);\n\
  \        .....\n    }\n\n    .....\n}\n```\n\n在上面的示例列表中，`FixedDepositDetails` 类型参数被标记了\
  \ `@RequestBody`。Spring Web MVC 负责将请求体转换为 `FixedDepositDetails` 类型。在上面的示例列表中，`FixedDepositDetailsValidator`\
  \ 是 Spring 的 `Validator` 的实现，它在尝试创建固定存款之前验证 `FixedDepositDetails` 对象。\n\n使用 `@RequestBody`\
  \ 注解的替代方案是直接从 `HttpServletRequest` 对象读取请求体，并将请求体转换为方法所需的 Java 类型。Spring 的 `@RequestBody`\
  \ 注解简化了转换，因为它使用了适当的 `HttpMessageConverter` 实现。\n\n### 设置 HTTP 响应状态\n\n现在让我们来看用于设置\
  \ HTTP 响应状态的 `@ResponseStatus` 注解。\n\n#### 使用 @ResponseStatus 设置 HTTP 响应状态\n\n你可以使用\
  \ `@ResponseStatus` 注解来指定 `@RequestMapping` 方法返回的 HTTP 响应状态。下面的示例列表展示了 `@ResponseStatus`\
  \ 注解的用法：\n\n**示例列表 12-10** – @ResponseStatus 注解用法\n\n```java\nimport org.springframework.web.bind.annotation.ResponseStatus;\n\
  \npublic class SomeController {\n    @RequestMapping(method = RequestMethod.GET)\n\
  \    @ResponseStatus(value = HttpStatus.OK)\n    @ResponseBody\n    public SomeObject\
  \ doSomething() {\n        .....\n    }\n}\n```\n\n由于 `doSomething` 方法带有 `@ResponseBody`\
  \ 注解，`doSomething` 方法的 `SomeObject` 被写入 HTTP 响应体。并且，`@ResponseStatus` 注解将 HTTP 响应状态设置为\
  \ 200（由 `HttpStatus.OK` 常量表示）。\n\n### 使用 @ExceptionHandler 处理异常\n\n现在让我们来看 `FixedDepositWS`\
  \ 服务是如何使用 `@ExceptionHandler` 注解处理异常的。\n\n在第 10 章第 10-9 节中，我们看到 `@ExceptionHandler`\
  \ 注解识别负责异常的控制器方法。与 `@RequestMapping` 方法一样，RESTful Web 服务中的 `@ExceptionHandler` 方法带有\
  \ `@ResponseBody` 注解，或者返回类型定义为 `ResponseEntity`（或 `HttpEntity`）。\n\n下面的示例列表展示了 `ch12-webservice`\
  \ 项目中 `FixedDepositController` 类中 `@ExceptionHandler` 注解的用法：\n\n**示例列表 12-11** –\
  \ @ExceptionHandler 注解用法\n\n**项目** – `ch12-webservice`\n**源码位置** - `src/main/java/sample/spring/chapter12/web`\n\
  \n```java\npackage sample.spring.chapter12.web;\n\nimport sample.spring.chapter12.exception.ValidationException;\n\
  \n.....\n\npublic class FixedDepositController {\n    .....\n}\n```\n\n\n\n\n\n\
  ```java\n@ExceptionHandler(ValidationException.class)\n@ResponseBody\n@ResponseStatus(value\
  \ = HttpStatus.BAD_REQUEST)\npublic String handleException(Exception ex) {\n   \
  \ logger.info(\"handling ValidationException \" + ex.getMessage());\n    return\
  \ ex.getMessage();\n}\n}\n```\n\n`handleException` 方法上的 `@ExceptionHandler` 注解表示，当\
  \ `FixedDepositController` 在处理请求期间抛出 `ValidationException` 时，会调用 `handleException`\
  \ 方法。由于 `handleException` 方法也标记了 `@ResponseBody` 注解，因此 `handleException` 方法返回的异常消息会被写入到\
  \ HTTP 响应体中。`handleException` 方法上的 `@ResponseStatus` 会导致将 HTTP 响应状态码设置为 400（由常量\
  \ `HttpStatus.BAD_REQUEST` 表示）。\n\n在本节中，我们学习了如何使用 Spring Web MVC 实现 `FixedDepositWS`\
  \ Web 服务。现在，让我们看看客户端应用程序如何使用 Spring 的 `RestTemplate` 来访问 `FixedDepositWS` Web 服务。\n\
  \n## 12-4 节使用 RestTemplate 访问 RESTful Web 服务\n\nSpring 的 `RestTemplate` 类通过管理 HTTP\
  \ 连接和处理 HTTP 错误，简化了 RESTful Web 服务的访问。\n\n**导入** `chapter 12/ch12-webservice-client`（该项目是一个独立的\
  \ Java 应用，它使用 Spring 的 `RestTemplate`（用于同步访问 Web 服务）和 `AsyncRestTemplate`（用于异步访问\
  \ Web 服务）类来访问 `FixedDepositWS` RESTful Web 服务。`ch12-webservice-client` 项目假设代表 `FixedDepositWS`\
  \ RESTful Web 服务 `ch12-webservice` 项目已部署在 [`localhost:8080/ch12-webservice`](http://localhost:8080/ch12-webservice)\
  \ URL 上。）\n\n### `RestTemplate` 配置\n\n下面的示例列表显示了如何在 `ch12-webservice-client` 项目的应用程序上下文\
  \ XML 文件中配置 `RestTemplate`：\n\n**示例列表 12-12** – `applicationContext.xml` - `RestTemplate`\
  \ 配置\n\n**项目** – `ch12-webservice-client`\n\n**源位置**- `src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans .....>\n    <bean id=\"restTemplate\" class=\"org.springframework.web.client.RestTemplate\"\
  >\n        <property name=\"errorHandler\" ref=\"errorHandler\" />\n    </bean>\n\
  \    <bean id=\"errorHandler\" class=\"sample.spring.chapter12.MyErrorHandler\"\
  \ />\n    .....\n</beans>\n```\n\n`RestTemplate` 的 `errorHandler` 属性指向 Spring `ResponseErrorHandler`\
  \ 接口的实现，该接口用于检查 HTTP 响应是否存在错误，并在发生错误时处理响应。`DefaultResponseErrorHandler` 是 Spring\
  \ 开箱即用的 `ResponseErrorHandler` 接口的默认实现。如果你没有指定 `errorHandler` 属性，Spring 将使用 `DefaultResponseErrorHandler`\
  \ 实现。上面的示例列表显示 `RestTemplate` 使用了自定义的响应错误处理器 `MyErrorHandler`。\n\n接下面的示例列表显示了 `MyErrorHandler`\
  \ 类的实现：\n\n**示例列表 12-13** – `MyErrorHandler` 类 – HTTP 响应错误处理器\n\n**项目** – `ch12-webservice-client`\n\
  \n**源位置**- `src/main/java/sample/spring/chapter12`\n\n```java\npackage sample.spring.chapter12;\n\
  \nimport org.apache.commons.io.IOUtils;\nimport org.springframework.http.client.ClientHttpResponse;\n\
  import org.springframework.web.client.DefaultResponseErrorHandler;\n\npublic class\
  \ MyErrorHandler extends DefaultResponseErrorHandler {\n    private static Logger\
  \ logger = Logger.getLogger(MyErrorHandler.class);\n    @Override\n    public void\
  \ handleError(ClientHttpResponse response) throws IOException {\n        logger.info(\"\
  Status code received from the web service : \" + response.getStatusCode());\n  \
  \      String body = IOUtils.toString(response.getBody());\n        logger.info(\"\
  Response body: \" + body);\n        super.handleError(response);\n    }\n}\n```\n\
  \n上面的示例列表显示 `MyErrorHandler` 类继承了 `DefaultResponseErrorHandler` 类并重写了 `handleError`\
  \ 方法。如果 HTTP 响应的状态码表示错误，则由 `handleError` 方法负责处理响应。`handleError` 方法的 `ClientHttpResponse`\
  \ 参数代表调用 RESTful Web 服务时收到的 HTTP 响应。调用 `ClientHttpResponse` 的 `getBody()` 方法将以 `InputStream`\
  \ 对象的形式返回 HTTP 响应体。`MyErrorHandler` 的 `handleError` 方法记录了有关状态码和 HTTP 响应体的信息，并将错误处理委托给\
  \ `DefaultResponseErrorHandler` 的 `handleError` 方法。上面的示例列表显示 `MyErrorHandler` 类使用\
  \ Apache Commons IO 的 `IOUtils` 类将 HTTP 响应体的内容获取为 `String`。\n\n现在，我们已经了解了如何配置 `RestTemplate`\
  \ 类，让我们看看客户端应用程序如何使用 `RestTemplate` 来访问 RESTful Web 服务。\n\n### 使用 `Template` 访问\
  \ FixedDepositWS Web 服务\n\n下面的示例列表显示了 `FixedDepositWSClient` 类，该类使用 `RestTemplate`\
  \ 访问 `FixedDepositWS` Web 服务：\n\n**示例列表 12-14** – `FixedDepositWSClient` 类 – `RestTemplate`\
  \ 用法\n\n**项目** – `ch12-webservice-client`\n\n**源位置**- `src/main/java/sample/spring/chapter12`\n\
  \n```java\npackage sample.spring.chapter12;\n\n.....\n\nimport org.springframework.web.client.RestTemplate;\n\
  \npublic class FixedDepositWSClient {\n    private static ApplicationContext context;\n\
  \    public static void main(String args[]) {\n        context = new ClassPathXmlApplicationContext(\n\
  \                    \"classpath:META-INF/spring/applicationContext.xml\");\n  \
  \      getDepositList(context.getBean(RestTemplate.class));\n        getDeposit(context.getBean(RestTemplate.class));\n\
  \    }\n    private static void getDepositList(RestTemplate restTemplate) { }\n\
  \    private static void getDeposit(RestTemplate restTemplate) { }\n}\n```\n\n上面的示例列表显示\
  \ `FixedDepositWSClient` 的 `main` 方法执行了以下操作：\n- 初始化 Spring 容器（由 `ApplicationContext`\
  \ 表示）\n- 调用 `getDepositList`、`getDeposit` 等。这些方法接收 `RestTemplate` 实例，并负责调用 `FixedDepositWS`\
  \ Web 服务。\n\n接下面的示例列表显示了 `FixedDepositWSClient` 的 `getDepositList` 方法实现，该方法调用部署在\
  \ [`localhost:8080/ch12-webservice`](http://localhost:8080/ch12-webservice) 的 FixedDepositWS\
  \ Web 服务以获取存款列表：\n\n**示例列表 12-15** – `FixedDepositWSClient` 的 `getDepositList` 方法\n\
  \n**项目** – `ch12-webservice-client`\n\n**源位置**- `src/main/java/sample/spring/chapter12`\n\
  \n```java\npackage sample.spring.chapter12;\n\n.....\n\nimport org.springframework.core.ParameterizedTypeReference;\n\
  import org.springframework.http.*;\nimport org.springframework.web.client.RestTemplate;\n\
  import java.util.List;\n\npublic class FixedDepositWSClient {\n    .....\n    private\
  \ static void getDepositList(RestTemplate restTemplate) {\n        HttpHeaders headers\
  \ = new HttpHeaders();\n        headers.add(\"Accept\", \"application/json\");\n\
  \        HttpEntity<String> requestEntity = new HttpEntity<String>(headers);\n \
  \       ParameterizedTypeReference<List<FixedDepositDetails>> typeRef =\n      \
  \          new ParameterizedTypeReference<List<FixedDepositDetails>>() {};\n   \
  \     ResponseEntity<List<FixedDepositDetails>> responseEntity = restTemplate\n\
  \                .exchange(\"http://localhost:8080/ch12-webservice/fixedDeposits\"\
  ,\n                        HttpMethod.GET, requestEntity, typeRef);\n        List<FixedDepositDetails>\
  \ fixedDepositDetails = responseEntity.getBody();\n        logger.info(\"List of\
  \ fixed deposit details: \\n\" + fixedDepositDetails);\n    }\n    .....\n}\n```\n\
  \n\n\n\n在上面的示例代码列表中，`RestTemplate` 的 `exchange` 方法被用于向 [`localhost:8080/ch12-webservice/fixedDeposits`](http://localhost:8080/ch12-webservice/fixedDeposits)\
  \ URL 发送 HTTP GET 请求。由于 `FixedDepositWS` Web 服务部署在 [`localhost:8080/ch12-webservice`](http://localhost:8080/ch12-webservice)\
  \ URL 上，向 [`localhost:8080/ch12-webservice/fixedDeposits`](http://localhost:8080/ch12-webservice/fixedDeposits)\
  \ URL 发送 HTTP GET 请求将调用 `FixedDepositController` 的 `getFixedDepositList` 方法。这是因为\
  \ `FixedDepositController` 的 `getFixedDepositList` 方法映射到了 `/fixedDeposits` URI（参见示例代码列表\
  \ 12-3 或 `ch12-webservice` 项目中的 `FixedDepositController` 类）。\n\n在示例代码 12-15 中，`HttpEntity`\
  \ 对象代表发送到 服务的请求，`HttpHeaders` 对象代表请求中的请求头，而 `ParameterizedTypeReference` 对象代表从 Web\
  \ 服务接收到的响应的泛型类型。`Accept` 请求头的值被设置为 `application/json`，以指定期望来自 `FixedDepositWS` 服务的响应为\
  \ JSON 格式。在 服务端，Spring Web MVC 使用 `Accept` 请求头的值来选择合适的 `HttpMessageConverter`，以便将带有\
  \ `@ResponseBody` 注解的方法返回的值转换为 `Accept` 请求头中指定的格式。例如，如果 `Accept` 请求头的值为 `application/json`，Spring\
  \ Web MVC 将使用 `MappingJackson2HttpMessageConverter`（`HttpMessageConverter` 的一种实现）将带有\
  \ `@ResponseBody` 注解的方法返回的值转换为 JSON 格式。`FixedDepositWSClient` 指定 `Accept` 请求头的值为\
  \ `application/json`；因此，`FixedDepositController` 的 `getFixedDepositList` 方法返回的值被转换为\
  \ JSON 格式。\n\n`RestTemplate` 的 `exchange` 方法返回 `ResponseEntity` 实例，它代表 Web 服务返回的响应。由于调用\
  \ `FixedDepositController` 的 `getFixedDepositList` 接收到的响应的泛型类型为 `List<FixedDepositDetails>`，因此创建了一个\
  \ `ParameterizedTypeReference<List<FixedDepositDetails>>` 实例并传递给 `exchange` 方法。你可以调用\
  \ `ResponseEntity` 的 `getBody` 方法来获取 Web 服务返回的响应。在示例代码 12-15 中，`ResponseEntity`\
  \ 的 `getBody` 方法返回一个类型为 `List<FixedDepositDetails>` 的对象，代表由 `FixedDepositWS` 服务返回的固定存款列表。\n\
  \n下图显示了当 `FixedDepositWSClient` 调用 `FixedDepositController` 的 `getFixedDepositList`\
  \ 方法时 `MappingJackson2HttpMessageConverter` 起的作用：\n\n![](img/00065.jpeg)\n\n**图\
  \ 12-4** `FixedDepositWSClient` 的 `getFixedDepositList` 方法使用 `RestTemplate` 向 `FixedDepositWS`\
  \ Web 服务发送网络请求\n\n上面的图显示 `MappingJackson2HttpMessageConverter` 用于将 `FixedDepositController`\
  \ 的 `getFixedDepositList` 方法的返回值转换为 JSON 格式。此外，`RestTemplate` 使用 `MappingJackson2HttpMessageConverter`\
  \ 将从 `FixedDepositController` 接收到的 JSON 响应转换为类型为 `List<FixedDepositDetails>` 的 Java\
  \ 对象。\n\n在示例代码 12-15 中，使用了 `RestTemplate` 的 `exchange` 方法向 `FixedDepositWS` Web\
  \ 服务发送 HTTP GET 请求。如果需要将来自 服务的 HTTP 响应转换为 Java 泛型类型并发送 HTTP 请求头，通常使用 `exchange`\
  \ 方法。`RestTemplate` 还定义了特定于 HTTP 方法的方法以简化 RESTful 客户端的编写。例如，你可以使用 `getForEntity`\
  \ 方法发送 HTTP GET 请求，使用 `postForEntity` 发送 HTTP POST 请求，使用 `delete` 发送 HTTP DELETE\
  \ 请求，等等。\n\n下面的示例代码显示了 `FixedDepositWSClient` 的 `openFixedDeposit` 方法，该方法向 `FixedDepositWS`\
  \ Web 服务发送 HTTP POST 请求以创建一个新的固定存款：\n\n**示例代码 12-16** – `FixedDepositWSClient` 的\
  \ `openFixedDeposit` 方法\n\n**项目** – `ch12-webservice-client`\n\n**源位置**- `src/main/java/sample/spring/chapter12`\n\
  \n```\npackage sample.spring.chapter12;\n\nimport org.springframework.http.ResponseEntity;\n\
  \nimport org.springframework.web.client.RestTemplate;\n\n.....\n\npublic class FixedDepositWSClient\
  \ {\n\n    .....\n\n    private static void openFixedDeposit(RestTemplate restTemplate)\
  \ {\n\n        FixedDepositDetails fdd = new FixedDepositDetails();\n\n        fdd.setDepositAmount(\"\
  9999\");\n\n        .....\n\n        ResponseEntity<FixedDepositDetails> responseEntity\
  \ = restTemplate\n                    .postForEntity(\"http://localhost:8080/ch12-webservice/fixedDeposits\"\
  ,\n                            fdd, FixedDepositDetails.class);\n        FixedDepositDetails\
  \ fixedDepositDetails = responseEntity.getBody();\n\n        .....\n    }\n}\n```\n\
  \n`FixedDepositWSClient` 的 `openFixedDeposit` 方法向 `FixedDepositWS` Web 服务发送固定存款。如果创建创建成功，`FixedDepositWS`\
  \ 返回新创建的对象。上面的示例显示 `RestTemplate` 的 `postForEntity` 接受 Web 服务 URL、要发送的对象（即 `FixedDepositDetails`）以及响应类型（即\
  \ `FixedDepositDetails.class`）。向 `http://localhost:8080/ch12-webservice/fixedDeposits`\
  \ 发送 HTTP 请求将调用 `FixedDepositController` 的 `getFixedDepositList` 方法（参见示例代码列表 12-3\
  \ 或 `ch12-webservice` 项目中的 `FixedDepositController` 类）。\n\n`FixedDepositController`\
  \ 的 `openFixedDeposit` 方法在尝试创建固定存款之前进行验证。`FixedDepositDetailsValidator` 负责验证固定存款。如果存款金额小于\
  \ 1000 或期限小于 12 个月或邮箱 ID 格式错误，则 `openFixedDeposit` 方法将抛出异常。下面的示例显示了 `FixedDepositController`\
  \ 的 `openFixedDeposit` 和 `handleException` 方法：\n\n**示例代码 12-17** – `FixedDepositController`\
  \ 的 `openFixedDeposit` 和 `handleException` 方法\n\n**项目** – `ch12-webservice`\n\n\
  **源位置**- `src/main/java/sample/spring/chapter12/web`\n\n```java\npackage sample.spring.chapter12.web;\n\
  \nimport org.springframework.validation.BindingResult;\nimport org.springframework.web.bind.annotation.*;\n\
  import sample.spring.chapter12.exception.ValidationException;\n// (注：此处省略部分 import\
  \ 和代码)\n\n@Controller\n@RequestMapping(value = \"/fixedDeposits\")\npublic class\
  \ FixedDepositController {\n\n    .....\n\n    @RequestMapping(method = RequestMethod.POST)\n\
  \    public ResponseEntity<FixedDepositDetails> openFixedDeposit(\n            @RequestBody\
  \ FixedDepositDetails fixedDepositDetails, BindingResult bindingResult) {\n    \
  \    new FixedDepositDetailsValidator().validate(fixedDepositDetails, bindingResult);\n\
  \        if (bindingResult.hasErrors()) {\n            throw new ValidationException(\"\
  Validation errors occurred\");\n        } else {\n            fixedDepositService.saveFixedDeposit(fixedDepositDetails);\n\
  \        }\n        .....\n    }\n\n    @ExceptionHandler(ValidationException.class)\n\
  \    @ResponseBody\n    @ResponseStatus(value = HttpStatus.BAD_REQUEST)\n    public\
  \ String handleException(Exception ex) {\n        return ex.getMessage();\n    }\n\
  \n    }\n\n    .....\n}\n```\n*(注：由于原文最后部分代码块存在截断和重复描述，译文已根据上下文对代码逻辑进行了对齐补全)*\n\n\
  \n\n\n上述示例列表显示，如果定期存款验证失败，`openFixedDeposit` 方法将抛出 `ValidationException`。由于 `handleException`\
  \ 方法标记了 `@ExceptionHandler(ValidationException.class)`，因此由 `openFixedDeposit` 方法抛出的\
  \ `ValidationException` 将由 `handleException` 方法处理。`@ResponseBody` 和 `@ResponseStatus(value=HttpStatus.BAD_REQUEST)`\
  \ 注解指定了 `handleException` 方法返回的异常消息将被写入响应体（response body），且状态码被设置为 `HttpStatus.BAD_REQUEST`\
  \ 常量（对应于 HTTP 状态码 400）。\n\n`FixedDepositWSClient` 的 `openInvalidFixedDeposit` 方法尝试创建一个存款金额为\
  \ 100 的定期存款，如下所示：\n\n**示例列表 12-18** – FixedDepositWSClient - openInvalidFixedDeposit\
  \ 方法\n\n**项目** – ch12-webservice-client\n\n**源码位置**- `src/main/java/sample/spring/chapter12`\n\
  \n```java\nprivate static void openInvalidFixedDeposit(RestTemplate restTemplate)\
  \ {\n    FixedDepositDetails fdd = new FixedDepositDetails();\n    fdd.setDepositAmount(\"\
  100\");\n    fdd.setEmail(\"99@somedomain.com\");\n    fdd.setTenure(\"12\");\n\
  \    ResponseEntity<FixedDepositDetails> responseEntity = restTemplate\n       \
  \     .postForEntity(\"http://localhost:8080/ch12-webservice/fixedDeposits\",\n\
  \                            fdd, FixedDepositDetails.class);\n    FixedDepositDetails\
  \ fixedDepositDetails = responseEntity.getBody();\n    logger.info(\"Details of\
  \ the newly created fixed deposit: \"\n            + fixedDepositDetails);\n}\n\
  ```\n\n`openInvalidFixedDeposit` 方法使用 `RestTemplate` 向 `FixedDepositController`\
  \ 的 `openFixedDeposit` 方法发送请求。由于存款金额指定为 100，`FixedDepositController` 的 `openFixedDeposit`\
  \ 方法会抛出 `ValidationException`（参见示例列表 12-17）。`FixedDepositController` 的 `handleException`\
  \ 方法（参见示例列表 12-17）处理该 `ValidationException`并将 HTTP 响应状态设置为 400。由于 `RestTemplate`\
  \ 接收到的响应状态码为 400，响应的处理被委托给我们为 `RestTemplate` 配置的 `MyErrorHandler` 实现（参见示例列表 12-12\
  \ 和 12-13）。\n\n`RestTemplate` 允许客户端同步访问 RESTful Web 服务。现在让我们来看看如何使用 Spring 的 `AsyncRestTemplate`\
  \ 异步访问 RESTful Web 服务。\n\n## 使用 AsyncRestTemplate 异步访问 RESTful Web 服务\n\n为了允许客户端异步访问\
  \ RESTful Web 服务，Spring 提供了 `AsyncRestTemplate`。接下来的示例列表显示了在 `ch12-webservice-client`\
  \ 项目的应用上下文 XML 文件中如何配置 `AsyncRestTemplate`：\n\n**示例列表 12-19** – applicationContext.xml\
  \ - AsyncRestTemplate 配置\n\n**项目** – ch12-webservice-client\n\n**源码位置**- `src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans .....>\n    .....\n    <bean id=\"errorHandler\" class=\"sample.spring.chapter12.MyErrorHandler\"\
  \ />\n    <bean id=\"asyncRestTemplate\" class=\"org.springframework.web.client.AsyncRestTemplate\"\
  >\n        <property name=\"errorHandler\" ref=\"errorHandler\" />\n    </bean>\n\
  </beans>\n```\n\n如果你将上述示例列表与示例列表 12-12 进行比较，你会发现 `AsyncRestTemplate` 和 `RestTemplate`\
  \ 类是以相同的方式配置的；它们使用同一个 `MyErrorHandler` 实例来处理 HTTP 错误。\n\n`AsyncRestTemplate` 类定义了与\
  \ `RestTemplate` 类定义相似的方法。接下来的示例列表显示了使用 `AsyncRestTemplate` 访问 `FixedDepositWS`\
  \ 服务的 `FixedDepositWSAsyncClient` 类：\n\n**示例列表 12-20** – FixedDepositWSAsyncClient\
  \ - openFixedDeposit 方法\n\n**项目** – ch12-webservice-client\n\n**源码位置**- `src/main/java/sample/spring/chapter12`\n\
  \n```java\npackage sample.spring.chapter12;\n\nimport org.springframework.http.HttpEntity;\n\
  import org.springframework.util.concurrent.ListenableFuture;\nimport org.springframework.util.concurrent.ListenableFutureCallback;\n\
  import org.springframework.web.client.AsyncRestTemplate;\n\npublic class FixedDepositWSAsyncClient\
  \ {\n    private static ApplicationContext context;\n    public static void main(String\
  \ args[]) {\n        context = new ClassPathXmlApplicationContext(\n           \
  \     \"classpath:META-INF/spring/applicationContext.xml\");\n        .....\n  \
  \      openFixedDeposit(context.getBean(AsyncRestTemplate.class));\n    }\n\n  \
  \  private static void openFixedDeposit(AsyncRestTemplate restTemplate) {\n    \
  \    FixedDepositDetails fdd = new FixedDepositDetails();\n        fdd.setDepositAmount(\"\
  9999\");\n        .....\n        HttpEntity<FixedDepositDetails> requestEntity =\
  \ new HttpEntity<FixedDepositDetails>(fdd);\n        ListenableFuture<ResponseEntity<FixedDepositDetails>>\
  \ futureResponseEntity =\n                restTemplate.postForEntity(\"http://localhost:8080/ch12-webservice/fixedDeposits\"\
  ,\n                                fdd, FixedDepositDetails.class)\n           \
  \             .addCallback(new ListenableFutureCallback<ResponseEntity<FixedDepositDetails>>()\
  \ {\n                            @Override\n                            public void\
  \ onSuccess(ResponseEntity<FixedDepositDetails> entity) {\n                    \
  \            FixedDepositDetails fixedDepositDetails = entity.getBody();\n     \
  \                       }\n                            @Override\n             \
  \               public void onFailure(Throwable t) { }\n });\n    }\n}\n```\n\n\
  上述示例列表显示 `openFixedDeposit` 方法使用 `AsyncRestTemplate` 向 `FixedDepositWS` 服务发送请求。`AsyncRestTemplate`\
  \ 的 `postForEntity` 方法向 `FixedDepositWS` 服务发送 HTTP POST 请求，从而调用 `FixedDepositController`\
  \ 的 `openFixedDeposit` 方法。如果你将上述的 `AsyncRestTemplate` 的 `postForEntity` 方法与 `RestTemplate`\
  \ 的 `postForEntity` 方法（参见示例列表 12-16）进行比较，你会发现 `AsyncRestTemplate` 的 `postForEntity`\
  \ 返回一个 `ListenableFuture` 类型的对象（继承自 `java.util.concurrent.Future`）。`ListenableFuture`\
  \ 的 `addCallback` 方法用于注册在 `ListenableFuture` 任务完成后触发的回调。`ListenableFuture` 的 `addCallback`\
  \ 方法接受一个 `ListenableFutureCallback` 类型的参数，该类型定义了 `onSuccess` 和 `onFailure` 方法。当\
  \ `ListenableFuture` 任务成功完成时会调用 `onSuccess` 方法，当 `ListenableFuture` 任务未能完成时，会调用\
  \ `onFailure` 方法。\n\n你需要注意，默认情况下 `AsyncRestTemplate` 使用 `SimpleAsyncTaskExecutor`\
  \ 在新线程中异步执行*每个*请求。你可以将 `ThreadPoolTaskExecutor` 传递给 `AsyncRestTemplate` 的构造函数，以便使用*线程池*中的线程异步执行任务。请参考第\
  \ 8 章第 6 节获取更多关于 `SimpleAsyncTaskExecutor` 和 `ThreadPoolTaskExecutor` 的信息。\n\n##\
  \ 12-5 使用 HttpMessageConverter 在 Java 对象与 HTTP 请求/响应之间进行转换\n\nSpring 在以下场景中使用 HttpMessageConverter\
  \ 执行转换：\n\n§ 如果方法参数标记了 `@RequestBody` 注解，Spring 将 HTTP 请求体转换为方法参数的 Java 类型。\n\n\
  § 如果方法标记了 `@ResponseBody` 注解，Spring 将方法返回的 Java 对象转换为 HTTP 响应体。\n\n如果方法返回 `HttpEntity`\
  \ 或 `ResponseEntity`，Spring 将方法返回的对象转换为 HTTP 响应体。\n\n传递给 `RestTemplate` 和 `AsyncRestTemplate`\
  \ 类方法（如 `getForEntity`、`postForEntity`、`exchange` 等）以及从方法返回的对象由 Spring 转换为 HTTP\
  \ 请求或从 HTTP 响应转换。\n\n\n\n\n\n下表描述了 Spring Web MVC 默认提供的某些 `HttpMessageConverter`\
  \ 实现类：\n\n| `HttpMessageConverter` 实现 | 说明 |\n| :--- | :--- |\n| `StringHttpMessageConverter`\
  \ | 在字符串与对象之间转换 |\n| `FormHttpMessageConverter` | 在表单数据与 `MultiValueMap<String,\
  \ String>` 类型之间转换。Spring 在处理表单数据和文件上传时会使用此 `HttpMessageConverter`。 |\n| `MappingJackson2HttpMessageConverter`\
  \ | 在 JSON 与对象之间转换 |\n| `MarshallingHttpMessageConverter` | 在 XML 与对象之间转换 |\n\n\
  上表提到的 `HttpMessageConverters` 会通过 Spring mvc 体系 中的 `<annotation-driven>` 元素自动注册到\
  \ Spring 容器。要查看由 `<annotation-driven>` 元素默认注册的 `HttpMessageConverters` 完整列表，请参考\
  \ Spring Framework 引用文档。\n\n现在让我们来看 `@PathVariable` 和 `@MatrixVariable` 注解，它们进一步简化了使用\
  \ Spring Web MVC 开发 RESTful Web 服务的工作。\n\n## 12-6 @PathVariable 和 @MatrixVariable\
  \ 注解\n\n`@RequestMapping` 注解可以指定一个 *URI 模板*（URI template）来访问请求 URI 的特定部分，而不是指定实际\
  \ URI。URI 模板包含*变量名*（在大括号内指定），其值源于实际的请求 URI。例如，URI 模板 `http://www.somebank.com/fd/{fixeddeposit}`\
  \ 包含变量名 `fixeddeposit`。如果实际的请求 URI 为 `http://www.somebank.com/fd/123`，则 `{fixeddeposit}`\
  \ URI 模板变量的值将变为 `123`。\n\n`@PathVariable` 是一个方法参数级别的注解，用于 `@RequestMapping` 方法将\
  \ *URI 模板* *变量*的值赋值给方法参数。\n\n**导入** `chapter 12/ch12-webservice-uritemplates` 和\
  \ `chapter 12/ch12-webservice-client-uritemplates`（ch12-webservice-uritemplates\
  \ 项目是 ch12-webservice 项目的变体，它展示了如何使用 `@PathVariable` 注解实现 `FixedDepositWS` RESTful\
  \ Web 服务。ch12-webservice-client-uritemplates 是 ch12-webservice-client 项目的变体，它用于访问由\
  \ ch12-webservice-uritemplates 项目表示的 FixedDepositWS Web 服务。）\n\n以下示例列表展示了 ch12-webservice-uritemplates\
  \ 项目中 `FixedDepositController` 对 `@PathVariable` 注解的使用：\n\n**示例列表 12-21** – `FixedDepositController`\
  \ - `@PathVariable` 的用法\n\n**项目** – `ch12-webservice-uritemplates`\n\n**源码位置**-\
  \ `src/main/java/sample/spring/chapter12/web`\n\n```java\npackage sample.spring.chapter12.web;\n\
  \nimport org.springframework.web.bind.annotation.PathVariable;\n\n.....\n\n@Controller\n\
  public class FixedDepositController {\n    .....\n    @RequestMapping(value=\"/fixedDeposits/{fixedDepositId}\"\
  , method = RequestMethod.GET)\n    public ResponseEntity<FixedDepositDetails> getFixedDeposit(\n\
  \            @PathVariable(\"fixedDepositId\") int id) {\n        return new ResponseEntity<FixedDepositDetails>(\n\
  \                fixedDepositService.getFixedDeposit(id), HttpStatus.OK);\n    }\n\
  \    .....\n}\n```\n\n上述示例列表中的 `@RequestMapping` 注解并没有指定实际 URI，而是指定了 `/fixedDeposits/{fixedDepositId}`\
  \ URI 模板。现在，如果传入的请求 URI 为 `/fixedDeposits/1`，则 `fixedDepositId` URI 模板变量的值设置为 `1`。由于\
  \ `@PathVariable` 注解指定 `fixedDepositId` 为 URI 模板变量名，值 `1` 被赋值给 `getFixedDeposit`\
  \ 方法的 `id` 参数。\n\n如果 URI 模板定义了多个变量，`@RequestMapping` 方法可以定义多个带有 `@PathVariable`\
  \ 注解的参数，如下示例列表所示：\n\n**示例列表 12-22** – 多个 URI 模板变量\n\n```java\n@Controller\npublic\
  \ class SomeController {\n    .....\n    @RequestMapping(value=\"/users/{userId}/bankstatements/{statementId}\"\
  , .....)\n    public void getBankStatementForUser(\n            @PathVariable(\"\
  userId\") String user,\n            @PathVariable(\"statementId\") String statement)\
  \ {\n        .....\n    }\n}\n```\n\n在上述示例列表中，URI 模板定义了 `userId` 和 `statementId`\
  \ 变量。如果传入的请求 URI 为 `/users/me/bankstatements/123`，则值 `me` 被赋值给 `user` 参数，值 `123`\
  \ 被赋值给 `statement` 参数。\n\n如果你想将所有的 URI 模板变量及其值都赋值给方法参数，可以在 `Map<String, String>`\
  \ 参数类型上使用 `@PathVariable` 注解，如下示例列表所示：\n\n**示例列表 12-23** – 访问所有 URI 模板变量及其值\n\n\
  ```java\n@Controller\npublic class SomeController {\n    .....\n    @RequestMapping(value=\"\
  /users/{userId}/bankstatements/{statementId}\", .....)\n    public void getBankStatementForUser(@PathVariable\
  \ Map<String, String> allVariables) {\n        .....\n    }\n}\n```\n\n你应该注意，URI\
  \ 模板也可以在类级别指定，如下所示：\n\n**示例列表 12-24** – 在类级和方法级指定的 URI 模板\n\n```java\n@Controller\n\
  @RequestMapping(value=\"/service/{serviceId}\", .....)\npublic class SomeController\
  \ {\n    .....\n    @RequestMapping(value=\"/users/{userId}/bankstatements/{statementId}\"\
  , .....)\n    public void getBankStatementForUser(@PathVariable Map<String, String>\
  \ allVariables) {\n        .....\n    }\n}\n```\n\n在上述示例列表中，URI 模板 `/service/{serviceId}`\
  \ 是通过类级 `@RequestMapping` 指定，而 `/users/{userId}/bankstatements/{statementId}` 是通过方法级\
  \ `@RequestMapping` 指定。如果请求 URI 为 `/service/bankingService/users/me/bankstatements/123`，则\
  \ `allVariables` 参数包含 `serviceId`、`userId` 和 `statementId` 的详情。\n\n到本节为止，我们已经学习了如何使用\
  \ `@PathVariable` 从请求 URI 路径中选择性地提取信息。现在让我们来看 `@MatrixVariable` 注解，它用于从路径段中提取*键值对*。\n\
  \n\n\n\n\n**注意** 你应该注意，Spring 默认会从 URL 中移除矩阵变量。为了确保矩阵变量不被移除，请将 Spring mvc schema\
  \ 中 `<annotation-driven>` 元素的 `enable-matrix-variables` 属性设置为 `true`。在使用矩阵变量时，包含矩阵变量的路径段必须由\
  \ URI 模板变量表示。\n\n下面的示例显示了 `@MatrixVariable` 注解的使用：\n\n**示例列表 12-26** – `@MatrixVariable`\
  \ 注解\n\n```java\n@Controller\n\npublic class SomeController {\n\n    .....\n\n \
  \   @RequestMapping(value=\"**/bankestatement/**{statementId}\", ..)\n    public\
  \ void getBankStatementForUser(@PathVariable(\"statementId\") String statement,\n\
  \            @MatrixVariable(\"responseType\") String responseTypeExtension) {\n\
  \        .....\n    }\n}\n```\n\n在上面的示例列表中，如果请求 URI 为 `/bankstatement/123;responseType=json`，则值\
  \ `json` 将被赋值给 `responseTypeExtension` 参数。上面的示例列表还展示了同时使用 `@PathVariable` 和 `@MatrixVariable`\
  \ 注解从请求 URI 获取信息的场景。\n\n由于矩阵变量可以出现在请求 URI 的任何路径段中，你应该指定应该从哪个路径段检索矩阵变量。下面的示例列表展示了两个同名的矩阵变量出现在不同路径段的场景：\n\
  \n**示例列表 12-27** – `@MatrixVariable` 注解 – 同名的矩阵变量\n\n```java\n@Controller\n\npublic\
  \ class SomeController {\n\n    .....\n\n    @RequestMapping(value=\"/bankestatement/{statementId}/user/{userId}\"\
  , ..)\n    public void getBankStatementForUser(\n            @MatrixVariable(value\
  \ = \"id\", pathVar = \"statementId\") int someId,\n            @MatrixVariable(value\
  \ = \"id\", pathVar = \"userId\") int someOtherId) {\n        .....\n    }\n}\n\
  ```\n\n`@MatrixVariable` 注解的 `pathVar` 属性指定包含矩阵变量的 URI 模板变量的。因此，如果请求 URI 为 `/bankstatement/123;id=555/user/me;id=777`，值\
  \ `555` 将被赋值给 `someId`，值 `777` 将被赋值给 `someOtherId` 参数。\n\n与 `@PathVariable` 注解一样，你可以对\
  \ `Map<String, String>` 类型的方法参数使用 `@MatrixVariable` 注解，将所有矩阵变量分配给方法参数。与 `@PathVariable`\
  \ 注解不同，`@MatrixVariable` 注解允许你使用 `defaultValue` 属性为矩阵变量指定默认值。此外，你可以将 `@MatrixVariable`\
  \ 注解的 `required` 属性设置为 `false`，表示该矩阵变量是可选的。默认情况下，`required` 属性的值设置为 `true`。如果 `required`\
  \ 属性设置为 `true` 且在请求中未矩阵变量，则会抛出异常。\n\n## 12-7 总结\n\n在本章中，我们学习如何开发并访问 RESTful Web\
  \ 服务。我们学习了如何结合 `@PathVariable` 和 `@MatrixVariable` 注解使用 URI 模板从请求 URI 获取信息。我们还学习了如何使用\
  \ `RestTemplate` 同步以及 `AsyncRestTemplate` 异步访问 RESTful Web 服务。\n\n# 第 13 章 – 更多\
  \ Spring Web MVC – 国际化、文件上传和异步请求处理\n\n## 13-1 引言\n\n在早的章节中，我们看到 Spring Web MVC 简化了\
  \ Web 应用程序和 RESTful Web 服务的创建。在本章中，我们将查看 Spring Web MVC 框架提供的某些你在 Web 应用程序中可能需要的其他功能。我们将特别关注：\n\
  \n- 使用 `handler interceptors`（处理器拦截器）预处理处理请求\n- Spring Web MVC 应用程序的国际化\n- 异步处理请求\n\
  - 执行类型转换和格式化，以及\n- 上传文件\n\n**重要** 13/ch13-bankapp（该项目是 ch10-bankapp 项目的变体，演示了如何在\
  \ MyBank Web 应用中整合国际化，以及如何使用处理器拦截器。）\n\n让我们先查看如何使用处理器拦截器预处理和处理请求。\n\n## 13-2 使用处理器拦截器预处理和处理请求\n\
  \n处理器拦截器允许你对请求进行预处理和处理。处理器拦截器的概念与 servlet 过滤器（filters）类似。处理器拦截器实现了 Spring 的 `HandlerInterceptor`\
  \ 接口。处理器拦截器包含了多个控制器所需的预处理处理逻辑。例如，你可以使用处理器拦截器进行日志记录、安全检查、切换区域等。\n\n现在让我们来看如何实现和配置处理器拦截器。\n\
  \n### 实现和配置处理器拦截器\n\n你可以通过实现 `HandlerInterceptor` 接口来创建处理器拦截器。`HandlerInterceptor`\
  \ 接口定义了以下方法：\n\n- `preHandle` – 该方法在控制器处理请求之前执行。如果 `preHandle` 方法返回 `true`，则 Spring\
  \ 调用控制器来处理请求。如果 `preHandle` 方法返回 `false`，则不调用控制器。\n- `postHandle` – 该方法在控制器处理请求之后、`DispatcherServlet`\
  \ 渲染视图之前执行。\n- `afterCompletion` – 该方法在请求处理完成后（即在 `DispatcherServlet` 渲染视图之后）调用，用于任何清理工作。\n\
  \n下面的示例显示了 `ch13-bankapp` 中实现 `HandlerInterceptor` 接口的 `RequestHandlerInterceptor`\
  \ 类：\n\n**示例列表 13-1** – `RequestHandlerInterceptor`\n**项目** – `ch13-bankapp`\n**源码位置**-\
  \ `src/main/java/sample/chapter13/web/RequestHandlerInterceptor.java`\n\n```java\n\
  package sample.spring.chapter13.web;\n\nimport org.springframework.web.servlet.HandlerInterceptor;\n\
  \npublic class RequestHandlerInterceptor implements HandlerInterceptor {\n\n   \
  \ .....\n\n    public boolean preHandle(HttpServletRequest request, HttpServletResponse\
  \ response, Object handler) throws Exception {\n        logger.info(\"HTTP method\
  \ --> \" + request.getMethod());\n        Enumeration<String> requestNames = request.getParameterNames();\n\
  \        .....\n        return true;\n    }\n\n    public void postHandle(HttpServletRequest\
  \ request, HttpServletResponse response, Object handler, ModelAndView modelAndView)\
  \ throws Exception {\n        logger.info(\"Status code --> \" + response.getStatus());\n\
  \    }\n\n    public void afterCompletion(HttpServletRequest request, HttpServletResponse\
  \ response, Object handler, Exception ex) throws Exception {\n        logger.info(\"\
  Request processing complete\");\n    }\n}\n```\n\n在上面的示例列表中，`preHandle` 方法检查每个传入请求并记录与请求相关的\
  \ HTTP 方法以及请求中的参数。`preHandle` 方法返回 `true`，这意味着请求将由控制器处理。`postHandle` 方法记录 HTTP 响应状态。`afterCompletion`\
  \ 方法记录请求处理完成的消息。\n\n**注意** 与于直接实现 `HandlerInterceptor` 接口，你可以扩展抽象的 `HandlerInterceptorAdapter`\
  \ 类，该类为 `postHandle` 和 `afterCompletion` 方法提供了空实现，而 `preHandle` 方法被定义为简单返回 `true`。\n\
  \n下面的示例显示了如何在 Web 应用上下文 XML 文件中配置处理器拦截器：\n\n**示例列表 13-2** – `RequestHandlerInterceptor`\n\
  **项目** – `ch13-bankapp`\n**源码位置**- `src/main/webapp/WEB-INF/spring/bankapp-config.xml`\n\
  \n```xml\n<beans xmlns:mvc=\"http://www.springframework.org/schema/mvc\">\n\n  \
  \  <mvc:annotation-driven />\n    <mvc:interceptors>\n        .....\n        <bean\
  \ class=\"sample.spring.chapter13.web.RequestHandlerInterceptor\" />\n    </mvc:interceptors>\n\
  </beans>\n```\n\n\n\n\n\n`</mvc:interceptors>`\n\n</beans>\n\n上面的示例列表显示，Spring mvc\
  \ schema 中的 `<interceptors>` 元素用于配置处理器拦截器（handler interceptors）。`<interceptors>`\
  \ 元素可以包含以下子元素：\n\n- Spring beans schema 中的 `<bean>` 元素 - 指定实现 `HandlerInterceptor`\
  \ 接口的 Spring bean。使用 `<bean>` 元素定义的处理器拦截器适用于所有请求。\n- Spring beans schema 中的 `<ref>`\
  \ 元素 - 引用实现 `HandlerInterceptor` 接口的 Spring bean。使用 `<ref>` 元素定义的处理器拦截器适用于所有请求。\n\
  - Spring mvc schema 中的 `<interceptor>` 元素 - 指定实现 `HandlerInterceptor` 接口的 Spring\
  \ bean，以及该 `HandlerInterceptor` 适用的请求 URIs。\n\n接下来的示例列表展示了将 `MyRequestHandlerInterceptor`\
  \ 映射到 `/audit/**` 请求 URI 的场景：\n\n**示例列表 13-3** – `<mvc:interceptor>` 的用法\n\n```xml\n\
  <beans .....xmlns:mvc=\"http://www.springframework.org/schema/mvc\".....>\n    <mvc:annotation-driven\
  \ />\n    <mvc:interceptors>\n        <mvc:interceptor>\n            <mvc:mapping\
  \ path=\"/audit/**\"/>\n            <bean class=\"sample.spring.chapter13.web.MyRequestHandlerInterceptor\"\
  \ />\n        </mvc:interceptor>\n    </mvc:interceptors>\n</beans>\n```\n\n在上面的示例列表中，Spring\
  \ mvc schema 中的 `<interceptor>` 元素用于将 `MyRequestHandlerInterceptor` 映射到 `/audit/**`\
  \ URI 模式。Spring mvc schema 中的 `<mapping>` 元素指定了 `<bean>` 元素定义的处理器拦截器所适用的请求 URI 模式。\n\
  \n现在让我们如何对 Spring Web MVC 应用进行国际化。\n\n## 13-3 使用资源包进行国际化\n\n在深入研究如何对 Spring Web\
  \ MVC 应用进行国际化之前，让我们先看看 MyBank Web 应用的国际化和本地化需求。\n\n### MyBank Web 的需求\n\n要求 MyBank\
  \ Web 应用支持英语（`en_US` 区域）和德语（`de_DE` 区域）。下面的图显示了 MyBank Web 应用在 `de_DE` 区域下的一个网页：\n\
  \n![](img/00066.jpeg)\n\n**图 13-1** 显示 `de_DE` 区域下存款列表的网页。用户可以从给定的选项中选择区域。\n\n上面的图显示，用户可以选择以下语言之一：英语（美国）、德语或英语（加拿大）。如果用户选择德语选项，网页将以\
  \ `de_DE` 区域显示。如果用户选择英语（美国）选项，网页将以 `en_US` 区域显示。如果用户选择英语（加拿大）选项，网页将以 `en_CA` 区域显示。\n\
  \n现在让我们来看看如何解决 MyBank Web 应用的国际化和本地化需求。\n\n### MyBank Web 应用的国际化和本地化\n\n在 Spring\
  \ Web MVC 中，`DispatcherServlet` 使用 `LocaleResolver` 根据用户的区域自动解析消息。为了支持国际化，你需要在 Web\
  \ 应用的上下文 XML 配置文件中配置以下 bean：\n\n- `LocaleResolver` – 解析用户当前的区域\n- `MessageSource`\
  \ – 根据用户当前的区域从资源包中解析消息\n- `LocaleChangeInterceptor` – 允许根据可配置的请求参数在每次请求时更改当前区域\n\
  \n接下来的示例列表显示了在 ch13-bankapp 项目的 Web 应用上下文 XML 文件中对 `LocaleResolver`、`LocaleChangeInterceptor`\
  \ 和 `MessageSource` bean 的配置：\n\n**示例列表 13-4** – `bankapp-config.xml`\n\n**Project**\
  \ – `ch13-bankapp`\n**Source location**- `src/main/webapp/WEB-INF/spring`\n\n```xml\n\
  <beans .....>\n    <bean class=\"org.springframework.web.servlet.i18n.CookieLocaleResolver\"\
  \ id=\"localeResolver\">\n        <property name=\"cookieName\" value=\"mylocale\"\
  \ />\n    </bean>\n    <bean class=\"org.springframework.context.support.ReloadableResourceBundleMessageSource\"\
  \ id=\"messageSource\">\n        <property name=\"basenames\" value=\"WEB-INF/i18n/messages\"\
  \ />\n    </bean>\n    <mvc:interceptors>\n        .....\n        <bean class=\"\
  org.springframework.web.servlet.i18n.LocaleChangeInterceptor\">\n            <property\
  \ name=\"paramName\" value=\"lang\" />\n        </bean>\n    </mvc:interceptors>\n\
  </beans>\n```\n\n在上面的示例列表中，`CookieLocaleResolver`（`LocaleResolver` 的一种实现）已配置用于区域解析。如果\
  \ Web 应用通过 cookie 存储区域信息，则使用 `CookieLocaleResolver`。`CookieLocaleResolver` 的 `cookieName`\
  \ 属性指定包含区域信息的 cookie 名称。如果在请求中没有找到 cookie，`CookieLocaleResolver` 将通过查看默认区域（使用 `defaultLocale`\
  \ 配置）或通过检查 `Accept-Language` 请求头来确定区域。Spring 额外提供了以下内置的 `LocaleResolver` 实现供你使用：`AcceptHeaderLocaleResolver`（返回由\
  \ `Accept-Language` 请求头指定的区域）、`SessionLocaleResolver`（返回存储在 `HttpSession` 中的区域）和\
  \ `FixedLocaleResolver`（始终返回固定的默认区域）。\n\n除了知道用户的区域，你可能还想知道用户的时区，以便在用户的时区转换转换日期。`LocaleContextResolver`（在\
  \ Spring 4.0 中引入）不仅提供区域信息，还提供用户的时区信息。`CookieLocaleResolver`、`SessionLocaleResolver`\
  \ 和 `FixedLocaleResolver` 都实现了 `LocaleContextResolver` 接口；因此，如果你使用这些任何一个解析器，都可以使用\
  \ `LocaleContextHolder`（或 `RequestContextUtils`）的 `getTimeZone` 方法在控制器中获取用户的时区。如果你只想在控制器中获取区域信息，可以使用\
  \ `LocaleContextHolder`（或 `RequestContextUtils`）的 `getLocale` 方法。\n\nSpring 提供了\
  \ `LocaleChangeInterceptor`（`HandlerInterceptor`），它使用可配置的请求参数（由 `paramName` 属性指定）在每次请求时更改当前区域。在示例列表\
  \ 13-4 中，`paramName` 属性设置为 `lang`。`LocaleResolver` 定义了 `setLocale` 方法，`LocaleChangeInterceptor`\
  \ 使用该方法更改当前区域。如果你不想使用 `LocaleChangeInterceptor`，可以通过调用 `LocaleContextHolder`（或 `RequestContextUtils`）的\
  \ `setLocale` 方法在控制器中更改用户的区域。\n\n一旦解析了用户的区域，Spring 将使用配置的 `MessageSource` 实现来解析消息。Spring\
  \ 提供了 `MessageSource` 接口的以下内置实现：\n\n- `ResourceBundleMessageSource`– 使用指定的 `basenames`\
  \ 访问资源包的 `MessageSource` 实现\n- `ReloadableResourceBundleMessageSource`– 与 `ResourceBundleMessageSource`\
  \ 实现类似。该实现支持资源包的*重载*。示例列表 13-4 显示 MyBank Web 应用使用了 `ReloadableResourceBundleMessageSource`。`basenames`\
  \ 属性被设置为 `WEB-INF/i18n/messages`，这意味着 `ReloadableResourceBundleMessageSource` 在\
  \ `WEB-INF/i18n` 文件夹中查找名为 `messages` 的资源包。因此，如果用户的区域解析为 `en_US`，`ReloadableResourceBundleMessageSource`\
  \ 将从 `messages_en_US.properties` 文件解析消息。\n\n\n\n\n\n如果你查看 `ch13-bankapp` 项目的 `/src/main/webapp/WEB-INF/i18n`\
  \ 文件夹，你会发现以下属性文件：`messages.properties`、`messages_en_US.properties` 和 `messages_de_DE.properties`。`messages_de_DE.properties`\
  \ 文件包含 `de_DE` 区域的消息和标签，`messages_en_US.properties` 包含 `en_US` 区域的消息和标签，而 `messages.properties`\
  \ 包含未找到特定区域资源包时显示的消息和标签。由于没有对应 `en_CA` 区域的 `messages_en_CA.properties` 文件，选择英语（加拿大）选项（如图\
  \ 13-1）将显示来自 `messages.properties` 文件的消息。\n\n在图 13-1 中，我们看到可以通过英语(US)、英语(Canada)\
  \ 和德语选项来更改 MyBank Web 应用程序的语言。我们之前看到，如果区域信息包含在名为 `lang` 的请求参数中，`LocaleChangeInterceptor`\
  \ 就可以更改 MyBank Web 应用程序的区域。为了简化区域的更改，`lang` 请求参数被附加到英语(US)、英语(Canada) 和德语语言选项显示的超链接中，如下：\n\
  \n**示例列表 13-5** – `fixedDepositList.jsp`\n\n**Project** – `ch13-bankapp`\n\n**源位置**-\
  \ `src/main/webapp/WEB-INF/jsp`\n\n```html\n<b>Language:</b>\n<a href=\"${pageContext.request.contextPath}/fixedDeposit/list?lang=en_US\"\
  >English(US)</a> |\n<a href=\"${pageContext.request.contextPath}/fixedDeposit/list?lang=de_DE\"\
  >German</a></a> |\n<a href=\"${pageContext.request.contextPath}/fixedDeposit/list?lang=en_CA\"\
  >English(Canada)</a>\n```\n\n现在让我们如何在 Spring Web MVC 应用中异步处理请求。\n\n## 13-4 13-4\
  \ 异步处理请求\n\n返回 `java.util.concurrent.Callable` 或 Spring 的 `DeferredResult` 对象的 `@RequestMapping`\
  \ 注解方法会异步处理 Web 请求。如果 `@RequestMapping` 方法返回 `Callable`，Spring Web MVC 会负责在应用线程（而不是\
  \ Servlet 容器线程）中处理 `Callable` 以产生结果。如果 `@RequestMapping` 方法返回 `DeferredResult`，则由应用程序负责在应用线程（而不是\
  \ Servlet 容器线程）中处理 `DeferredResult` 以产生结果。在深入研究 `Callable` 和 `DeferredResult` 返回值的细节之前，让我们来看看如何配置\
  \ Spring Web MVC 应用以支持异步请求处理。\n\n**导入** **第 13 章/ch13-async-bankapp**（此项目是 ch10-bankapp\
  \ 项目的变体，它异步处理请求。该项目 `FixedDepositController` 中定义的 `@RequestMapping` 方法返回 `Callable`。你应该部署并运行\
  \ `ch13-async-bankapp` 项目以查看异步请求处理的运行。）\n\n### 异步请求处理配置\n\n由于 Spring Web MVC 中的异步请求处理基于\
  \ Servlet 3，`web.xml` 必须引用 Servlet 3 XML 架构。此外，必须在 `web.xml` 文件中的 `DispatcherServlet`\
  \ 定义中添加 `<async-supported>` 元素以指示它支持异步请求处理。以下示例列表显示了 `ch13-async-bankapp` 项目的 `web.xml`\
  \ 文件：\n\n**示例列表 13-6** – `web.xml` – 异步请求处理配置\n\n**Project** – `ch13-async-bankapp`\n\
  \n**源位置**- `src/main/webapp/WEB-INF`\n\n```xml\n<web-app .....\n    xsi:schemaLocation=\"\
  java.sun.com/xml/ns/javaee java.sun.com/xml/ns/javaee/web-app_3_0.xsd\"\n    version=\"\
  3.0\">\n    .....\n    <servlet>\n        <servlet-name>bankapp</servlet-name>\n\
  \        <servlet-class>org.springframework.web.servlet.DispatcherServlet</servlet-class>\n\
  \        .....\n        <async-supported>true</async-supported>\n    </servlet>\n\
  \    .....\n</web-app>\n```\n\n上面的示例列表显示 `bankapp` servlet 已配置为支持异步请求处理。现在，`bankapp`\
  \ servlet 可以异步处理 Web 请求了。\n\n### 从 @RequestMapping 方法返回 Callable\n\n接下来的示例列表显示了\
  \ `FixedDepositController`，其 `@RequestMapping` 方法返回 `Callable`：\n\n**示例列表 13-7**\
  \ – `FixedDepositController` – 从 `@RequestMapping` 方法返回 `Callable`\n\n**Project**\
  \ – `ch13-async-bankapp`\n\n**源位置**- `src/main/java/sample/spring/chapter13/web`\n\
  \n```java\npackage sample.spring.chapter13.web;\n\nimport java.util.concurrent.Callable;\n\
  \n.....\n\npublic class FixedDepositController {\n    .....\n    @RequestMapping(value\
  \ = \"/list\", method = RequestMethod.GET)\n    public Callable<ModelAndView> listFixedDeposits()\
  \ {\n        return new Callable<ModelAndView>() {\n            @Override\n    \
  \        public ModelAndView call() throws Exception {\n                Thread.sleep(5000);\n\
  \                Map<String, List<FixedDepositDetails>> modelData = new HashMap<>();\n\
  \                modelData.put(\"fdList\", fixedDepositService.getDeposits());\n\
  \                return new ModelAndView(\"fixedDepositList\", modelData);\n   \
  \         }\n        };\n    }\n    .....\n}\n```\n\n上面的示例列表显示 `listFixedDeposits`\
  \ 方法返回一个 `Callable<T>` 对象，其中 `T` 是异步计算的结果的类型。`call` 方法包含了需要异步执行以产生结果的逻辑。\n\n如果在执行从控制器返回的\
  \ `Callable` 时抛出异常，则由控制器的 `@ExceptionHandler` 方法（或配置的 `HandlerExceptionResolver`\
  \ ）负责处理异常。关于 `@ExceptionHandler` 的更多信息，请参阅 10-9。\n\n示例列表显示，如果你想从同步请求处理切换到异步请求处理，你需要将逻辑从\
  \ `@RequestMapping` 方法移动到 `Callable` 的 `call` 方法，并将 `@RequestMapping` 方法的返回类型更改为\
  \ `Callable<T>`。\n\n### 从 @RequestMapping 方法返回 DeferredResult\n\n`DeferredResult`\
  \ 实例表示异步计算的结果。你通过调用 `setResult` 方法在 `DeferredResult` 实例上设置结果。通常，`@RequestMapping`\
  \ 方法将 `DeferredResult` 实例存储在 `Queue` 或 `Map` 或其他数据结构中，另一个线程负责计算结果并在 `DeferredResult`\
  \ 实例上设置结果。\n\n让我们先看看返回 `DeferredResult` 类型的 `@RequestMapping` 方法。\n\n**@RequestMapping**\
  \ **方法实现**\n\n接下来的示例列表显示了 `FixedDepositController`，其 `@RequestMapping` 方法返回 `DeferredResult`\
  \ 对象：\n\n**示例列表 13-8** – `FixedDepositController` – 从 `@RequestMapping` 方法返回 `DeferredResult`\n\
  \n**Project** – `ch13-async-webservice`\n\n\n\n\n\n### 源位置\n- `src/main/java/sample/spring/chapter13/web`\n\
  \n```java\npackage sample.spring.chapter13.web;\n\nimport java.util.Queue;\n\nimport\
  \ java.util.concurrent.ConcurrentLinkedQueue;\n\nimport org.springframework.web.context.request.async.DeferredResult;\n\
  \n.....\n\n@Controller\n@RequestMapping(value = \"/fixedDeposits\")\npublic class\
  \ FixedDepositController {\n\n    private static final String LIST_METHOD = \"getFixedDepositList\"\
  ;\n    private static final String GET_FD_METHOD = \"getFixedDeposit\";\n\n    .....\n\
  \n    private final Queue<ResultContext> deferredResultQueue =\n            new\
  \ ConcurrentLinkedQueue<ResultContext>();\n\n    .....\n\n    @RequestMapping(method\
  \ = RequestMethod.GET)\n    public DeferredResult<ResponseEntity<List<FixedDepositDetails>>>\
  \ getFixedDepositList() {\n        DeferredResult<ResponseEntity<List<FixedDepositDetails>>>\
  \ dr =\n                new DeferredResult<ResponseEntity<List<FixedDepositDetails>>>();\n\
  \        ResultContext<ResponseEntity<List<FixedDepositDetails>>> resultContext\
  \ =\n                new ResultContext<ResponseEntity<List<FixedDepositDetails>>>();\n\
  \        resultContext.setDeferredResult(dr);\n        resultContext.setMethodToInvoke(LIST_METHOD);\n\
  \        resultContext.setArgs(new HashMap<String, Object>());\n        deferredResultQueue.add(resultContext);\n\
  \        return dr;\n    }\n\n    .....\n}\n```\n\n`FixedDepositController` 的每个\
  \ `@RequestMapping` 方法都会执行以下步骤：\n\n**步骤 1** - 创建一个 `DeferredResult<T>` 对象的实例，其中\
  \ `T` 代表异步计算结果的类型。由于 `getFixedDepositList` 方法计算的结果类型为 `ResponseEntity<List<FixedDepositDetails>>`，因此创建了一个\
  \ `DeferredResult<ResponseEntity<List<FixedDepositDetails>>>` 实例。\n\n**步骤 2** -\
  \ 创建一个 `ResultContext` 对象的实例。`ResultContext` 对象持有了我们在步骤 1 中创建的 `DeferredResult`\
  \ 实例，以及异步计算 `DeferredResult` 对象结果所需的其他详细信息。对于 `FixedDepositController` 的 `getFixedDepositList`\
  \ 方法，结果由调用 `FixedDepositService` 的 `getFixedDeposits` 方法获得的固定存款列表来表示。\n\n下面的代码示例展示了\
  \ `ResultContext` 类：\n\n**示例代码 13-9** – 用于存储 `DeferredResult` 和其他信息的 `ResultContext`\
  \ 类\n\n**项目** – `ch13-async-webservice`\n**源位置** - `src/main/java/sample/spring/chapter13/web`\n\
  \n```java\npackage sample.spring.chapter13.web;\n\nimport java.util.Map;\n\nimport\
  \ org.springframework.web.context.request.async.DeferredResult;\n\npublic class\
  \ ResultContext<T> {\n\n    private String methodToInvoke;\n    private DeferredResult<T>\
  \ deferredResult;\n    private Map<String, Object> args;\n\n    public void setDeferredResult(DeferredResult<T>\
  \ deferredResult) {\n        this.deferredResult = deferredResult;\n    }\n\n  \
  \  .....\n}\n```\n\n`deferredResult` 属性引用 `DeferredResult` 实例，`methodToInvoke` 属性指定了用于计算\
  \ `DeferredResult` 对象结果调用的 `FixedDepositService` 方法名称，而 `args` 属性（类型为 `java.util.Map`）指定了传递给\
  \ `FixedDepositService` 方法的参数。一个单独的线程（在本节稍后解释）将使用 `methodToInvoke` 和 `args` 属性来调用指定的\
  \ `FixedDepositService` 方法，并将返回的结果设置在 `DeferredResult` 实例上。\n\n由于 `FixedDepositController`\
  \ 类中的 `LIST_METHOD`、`GET_FD_METHOD` 等常量引用 `FixedDepositService` 方法的名称（参见示例代码 13-8），`methodToInvoke`\
  \ 属性被设置为这些常量之一。在示例代码 13-8 中，`FixedDepositController` 的 `getFixedDepositList` 方法将\
  \ `methodToInvoke` 属性设置为 `LIST_METHOD` 常量（其值为 `getFixedDeposits`），因为需要调用 `FixedDepositService`\
  \ 的 `getFixedDeposits` 方法来获取为 `FixedDepositController.getFixedDepositList` 方法返回的\
  \ `DeferredResult` 对象所需的结果。\n\n**步骤 3** - 将步骤 2 中创建的 `ResultContext` 实例存储到 `Queue`\
  \ 中（参见示例代码 13-8 中的 `deferredResultQueue` 实例变量）\n\n**步骤 4** - 返回步骤 1 中创建的 `DeferredResult`\
  \ 对象\n\n上述步骤序列表明，对于每个 Web 请求，一个 `ResultContext` 实例会被存储在 `deferredResultQueue` 中。下面的图总结了\
  \ `FixedDepositController` 的 `getFixedDepositList` 方法执行的操作。\n\n图 13-2\n\n现在让我们来看看如何为\
  \ `DeferredResult` 实例计算结果。`processResults` 方法负责遍历 `ResultContext` 对象。下面的示例展示了：\n\
  \n**示例代码 13-10** – `processResults` 方法 – 计算并设置到 DeferredResult\n\n**项目** – `ch13-async-webservice`\n\
  **源位置** - `src/main/java/sample/spring/chapter13/web`\n\n```java\npackage sample.spring.chapter13.web;\n\
  \nimport org.springframework.scheduling.annotation.Scheduled;\nimport org.springframework.web.context.request.async.DeferredResult;\n\
  \n@Controller\n@RequestMapping(value = \"/fixedDeposits\")\npublic class FixedDepositController\
  \ {\n\n    private static final String LIST_METHOD = \"getFixedDepositList\";\n\
  \    .....\n    private final Queue<ResultContext> deferredResultQueue =\n     \
  \       new ConcurrentLinkedQueue<ResultContext>();\n    @Autowired\n    private\
  \ FixedDepositService fixedDepositService;\n    .....\n    @Scheduled(fixedRate\
  \ = 10000)\n    public void processResults() {\n        for (ResultContext resultContext\
  \ : deferredResultQueue) {\n            if (resultContext.getMethodToInvoke() ==\
  \ LIST_METHOD) {\n                resultContext.getDeferredResult().setResult(\n\
  \                    new ResponseEntity<List<FixedDepositDetails>>(\n          \
  \              fixedDepositService.getFixedDeposits(), HttpStatus.OK));\n      \
  \      }\n            .....\n            deferredResultQueue.remove(resultContext);\n\
  \        }\n    }\n}\n```\n\n`processResults` 方法上的 `@Scheduled` 注解（详细信息请参见第 8 章第\
  \ 8-6 节）指定了每 10 秒有一个应用程序线程执行 `processResults` 方法。`processResults` 方法使用存储在 `ResultContext`\
  \ 实例中的方法名称和参数信息来调用相应的 `FixedDepositService` 方法。然后 `processResults` 方法通过调用 `setResult`\
  \ 方法将结果设置在 `DeferredResult` 实例上。最后，`processResults` 方法从 `Queue` 中移除 `ResultContext`\
  \ 实例，这样当它在 10 秒后再次执行时，该实例就不会被重复处理。\n\n图 13-3\n\n\n\n\n\n如果你使用 `DeferredResult` 的\
  \ `setErrorResult` 方法设置了一个类型为 `java.lang.Exception` 的对象，该结果将由 `controller` 中带有 `@ExceptionHandler`\
  \ 注解的方法（或配置的 `HandlerExceptionResolver` bean）处理。有关 `@ExceptionHandler` 注解的更多信息，请参阅第\
  \ 10 章第 10-9 节。\n\n以下示例代码展示了 `FixedDepositController` 中开启新定期存款的 `openFixedDeposit`\
  \ 方法：\n\n**示例列表 13-11** – `FixedDepositController` 的 `openFixedDeposit` 方法\n\n**项目**\
  \ – `ch13-async-webservice`\n\n**源码位置**- `src/main/java/sample/spring/chapter13/web`\n\
  \n```java\npackage sample.spring.chapter13.web;\n\n@Controller\n@RequestMapping(value\
  \ = \"/fixedDeposits\")\npublic class FixedDepositController {\n    private static\
  \ final String OPEN_FD_METHOD = \"openFixedDeposit\";\n\n    .....\n\n    private\
  \ final Queue<ResultContext> deferredResultQueue =\n        new ConcurrentLinkedQueue<ResultContext>();\n\
  \n    @RequestMapping(method = RequestMethod.POST)\n    public DeferredResult<ResponseEntity<FixedDepositDetails>>\
  \ openFixedDeposit(\n            @RequestBody FixedDepositDetails fixedDepositDetails,\
  \ BindingResult bindingResult) {\n        DeferredResult<ResponseEntity<FixedDepositDetails>>\
  \ dr =\n            new DeferredResult<ResponseEntity<FixedDepositDetails>>();\n\
  \        ResultContext<ResponseEntity<FixedDepositDetails>> resultContext =\n  \
  \          new ResultContext<ResponseEntity<FixedDepositDetails>>();\n        resultContext.setDeferredResult(dr);\n\
  \        resultContext.setMethodToInvoke(OPEN_FD_METHOD);\n        Map<String, Object>\
  \ args = new HashMap<String, Object>();\n        args.put(\"fixedDepositDetails\"\
  , fixedDepositDetails);\n        args.put(\"bindingResult\", bindingResult);\n \
  \       resultContext.setArgs(args);\n        deferredResultQueue.add(resultContext);\n\
  \        return dr;\n    }\n\n    .....\n}\n```\n\n上述示例代码显示，传递给 `openFixedDeposit`\
  \ 方法的参数（`fixedDepositDetails` 和 `bindingResult`）被设置 `ResultContext` 实例上，这样当 `processResults`\
  \ 方法执行开启新定期存款的逻辑时，这些参数是可用的。`fixedDepositDetails` 参数包含了要开启的定期存款详情，而 `bindingResult`\
  \ 参数包含了数据绑定的结果。\n\n以下示例代码展示了 `processResults` 方法如何执行开启新定期存款的逻辑：\n\n**示例列表 13-12**\
  \ – `FixedDepositController` 的 `processResults` 方法\n\n**项目** – `ch13-async-webservice`\n\
  \n**源码位置**- `src/main/java/sample/spring/chapter13/web`\n\n```java\npackage sample.spring.chapter13.web;\n\
  \n@Controller\n@RequestMapping(value = \"/fixedDeposits\")\npublic class FixedDepositController\
  \ {\n    private static final String OPEN_FD_METHOD = \"openFixedDeposit\";\n\n\
  \    .....\n\n    private final Queue<ResultContext> deferredResultQueue =\n   \
  \     new ConcurrentLinkedQueue<ResultContext>();\n\n    @Autowired\n    private\
  \ FixedDepositService fixedDepositService;\n\n    .....\n\n    @ExceptionHandler(ValidationException.class)\n\
  \    @ResponseBody\n    @ResponseStatus(value = HttpStatus.BAD_REQUEST)\n    public\
  \ String handleException(Exception ex) {\n        logger.info(\"handling ValidationException\
  \ \" + ex.getMessage());\n        return ex.getMessage();\n    }\n\n    @Scheduled(fixedRate\
  \ = 10000)\n    public void processResults() {\n        for (ResultContext resultContext\
  \ : deferredResultQueue) {\n            .....\n            if (resultContext.getMethodToInvoke()\
  \ == OPEN_FD_METHOD) {\n                FixedDepositDetails fixedDepositDetails\
  \ = (FixedDepositDetails) resultContext\n                    .getArgs().get(\"fixedDepositDetails\"\
  );\n                BindingResult bindingResult = (BindingResult) resultContext.getArgs().get(\"\
  bindingResult\");\n                new FixedDepositDetailsValidator().validate(fixedDepositDetails,\
  \ bindingResult);\n                if (bindingResult.hasErrors()) {\n          \
  \          logger.info(\"openFixedDeposit() method: Validation errors occurred\"\
  );\n                    resultContext.getDeferredResult().setErrorResult(new ValidationException(\n\
  \                        \"Validation errors occurred\"));\n                } else\
  \ {\n                    fixedDepositService.saveFixedDeposit(fixedDepositDetails);\n\
  \                    resultContext.getDeferredResult().setResult(new ResponseEntity<>(\n\
  \                        fixedDepositDetails, HttpStatus.CREATED));\n          \
  \      }\n            }\n        }\n    }\n}\n```\n\n\n\n\n\n你可以使用 Spring 的 mvc\
  \ schema 中的 `<callable-interceptors>`元素来配置 `CallableProcessingInterceptor`。此外，你可以使用\
  \ Spring 的 mvc schema 中的 `<deferred-result-interceptors>`元素来配置 `DeferredResultProcessingInterceptor`。接下来的示例显示了\
  \ `MyDeferredResultInterceptor`（`DeferredResultProcessingInterceptor` 的实现）的配置：\n\
  \n**示例 13-14** – 配置 `DeferredResultProcessingInterceptor` 实现\n\n**项目** – `ch13-async-webservice`\n\
  \n**源位置**– `src/main/webapp/WEB-INF/spring/webservice-config.xml`\n\n```xml\n<mvc:annotation-driven>\n\
  \    <mvc:async-support default-timeout=\"30000\">\n        <mvc:deferred-result-interceptors>\n\
  \            <bean class=\"sample.spring.chapter13.web.MyDeferredResultInterceptor\"\
  />\n        </mvc:deferred-result-interceptors>\n    </mvc:async-support>\n</mvc:annotation-driven>\n\
  ```\n\n现在让我们来看 Spring 对类型转换和格式化的支持。\n\n## 13-5 Spring 中的类型转换和格式化支持\n\nSpring 的 `Converter`\
  \ 接口简化了将一种对象类型转换为另一种对象类型的过程。而 Spring 的 `Formatter` 接口在将对象类型转换为其 `localized` 字符串表示（反之）时非常有用。你可以在\
  \ `spring-core` JAR 文件的 `org.springframework.core.convert.support` 包中找到许多内置的 `Converter`\
  \ 实现。Spring 还为 `java.lang.Number` 和 `java.util.Date` 类型提供了内置的 `Formatters`，分别可以在\
  \ `org.springframework.format.number` 和 `org.springframework.format.datetime` 包中找到。\n\
  \n**导入** `chapter 13/ch13-converter-formatter-bankapp`（此项目是 `ch13-bankapp` 项目的变体，展示了如何创建自定义的\
  \ `Converters` 和 `Formatters`）\n\n让我们先看看如何创建一个自定义的 `Converter`。\n\n### 创建自定义 Converter\n\
  \n转换 实现 Spring 的 `Converter<S, T>` 接口，其中 `S`（称为 `source` 类型）是传递给转换器的对象类型，而 `T`（称为\
  \ `target` 类型）是转换器将 `S` 转换后的对象类型。`Converter` 接口定义了一个提供转换逻辑的 `convert` 方法。\n\n下面的示例显示了\
  \ `IdToFixedDepositDetailsConverter`，它将 `String` 类型的对象（代表定期存款 ID）转换为 `FixedDepositDetails`\
  \ 类型的对象（代表与定期存款 ID 对应的定期存款）：\n\n**示例 13-15** – Converter 实现\n\n**项目** – `ch13-converter-formatter-bankapp`\n\
  \n**源位置**– `src/main/java/sample/spring/chapter13/converter`\n\n```java\npackage\
  \ sample.spring.chapter13.converter;\n\nimport org.springframework.core.convert.Converter;\n\
  import org.springframework.beans.factory.annotation.Autowired;\n\npublic class IdToFixedDepositDetailsConverter\
  \ implements Converter<String, FixedDepositDetails> {\n\n    @Autowired\n    private\
  \ FixedDepositService fixedDepositService;\n\n    @Override\n    public FixedDepositDetails\
  \ convert(String source) {\n        return fixedDepositService.getFixedDeposit(Integer.parseInt(source));\n\
  \    }\n}\n```\n\n`IdToFixedDepositDetailsConverter` 实现了 `Converter<String, FixedDepositDetails>`，其中\
  \ `String` 是源类型，`FixedDepositDetails` 是目标类型。`IdToFixedDepositDetailsConverter` 的\
  \ `convert` 方法使用 `fixedDepositService` 来获取定期存款。\n\n### 配置和使用自定义 Converter\n\n要使用自定义的\
  \ `Converter`，你需要向 Spring 注册它。默认情况下，`<annotation-driven>`元素会注册内置的转换器和格式化。如果你想替换\
  \ `ConversionService` 实例，可以使用 `ConversionFactoryBean`。\n\n要向 `ConversionService`\
  \ 实例注册自定义转换器，请按照如下所示配置 `<annotation-driven>`元素：\n\n**示例 13-16** – 向 `ConversionService`\
  \ 注册 `Converter`\n\n**项目** – `ch13-converter-formatter-bankapp`\n\n**源位置**– `src/main/webapp/WEB-INF/spring`\n\
  \n```xml\n<mvc:annotation-driven conversion-service=\"myConversionService\"/>\n\n\
  <bean id=\"myConversionService\" class=\"org.springframework.web.servlet.ConversionFactoryBean\"\
  >\n    <property name=\"converters\">\n        <set>\n            <bean class=\"\
  sample.spring.chapter13.converter.IdToFixedDepositDetailsConverter\"/>\n       \
  \ </set>\n    </property>\n</bean>\n```\n\n默认情况下，`ConversionFactoryBean` 只注册内置的转换器和格式化。`<annotation-driven>`\
  \ 的 `conversion-service` 属性指向 `ConversionService` 实例。Spring 在*数据绑定*期间执行类型转换。在下面的示例中，`FixedDepositController`\
  \ 的 `viewFixedDepositDetails` 方法展示了一个场景：Spring 容器使用 `IdToFixedDepositDetailsConverter<String,\
  \ FixedDepositDetails>` 来转换存款 ID：\n\n**示例 13-17** – `FixedDepositController` 的 `viewFixedDepositDetails`\
  \ 方法\n\n**项目** – `ch13-converter-formatter-bankapp`\n\n**源位置**– `src/main/java/sample/spring/chapter13/web`\n\
  \n```java\npackage sample.spring.chapter13.web;\n\nimport org.springframework.web.bind.annotation.RequestParam;\n\
  import org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RequestMethod;\n\
  import org.springframework.web.servlet.ModelAndView;\nimport org.springframework.web.http.HttpServletRequest;\n\
  \npublic class FixedDepositController {\n\n    @RequestMapping(value = \"/view\"\
  , method = RequestMethod.GET)\n    public ModelAndView viewFixedDepositDetails(@RequestParam(value\
  \ = \"fixedDepositId\") FixedDepositDetails fixedDepositDetails) {\n        // ...\n\
  \    }\n}\n```\n\n`@RequestParam` 注解指定 `fixedDepositId` 请求参数的值赋值给方法参数 `fixedDepositDetails`。由于\
  \ `fixedDepositId` 请求参数类型为 `String` 而方法参数类型为 `FixedDepositDetails`，Spring 会使用 `FixedDepositDetails`。\n\
  \n`ConversionService` 的使用并不限于 Web 层。你可以使用 `ConversionService` 在应用程序的任何层中编程地执行类型转换。下面的示例显示了\
  \ `FixedDepositController` 的 `viewFixedDepositDetails` 方法的一个变体，它直接使用 `ConversionService`\
  \ 执行类型转换：\n\n```java\npackage sample.spring.chapter13.web;\n\nimport org.springframework.core.convert.ConversionService;\n\
  import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
  import org.springframework.web.bind.annotation.RequestMethod;\nimport org.springframework.web.servlet.ModelAndView;\n\
  import org.springframework.web.http.HttpServletRequest;\n\npublic class FixedDepositController\
  \ {\n\n    @Autowired\n    private ConversionService conversionService;\n\n    @RequestMapping(value\
  \ = \"/view\", method = RequestMethod.GET)\n    public ModelAndView viewFixedDepositDetails(HttpServletRequest\
  \ request) {\n        String id = request.getParameter(\"fixedDepositId\");\n  \
  \      FixedDepositDetails fixedDepositDetails = conversionService.convert(id, FixedDepositDetails.class);\n\
  \        return new ModelAndView();\n    }\n}\n```\n\n\n\n\n\n```java\nString fixedDepositId\
  \ = request.getParameter(\"fixedDepositId\");\n\nFixedDepositDetails fixedDepositDetails\
  \ =\n    conversionService.convert(fixedDepositId, FixedDepositDetails.class);\n\
  \n.....\n\n}\n}\n```\n\n在上面的示例列表中，注册到 Spring 容器的 `ConversionService` 实例被自动注入到 `FixedDepositController`\
  \ 中。`viewFixedDepositDetails` 方法使用 `ConversionService` 的 `convert` 方法将 `fixedDepositId`（类型为\
  \ `String`）转换为 `FixedDepositDetails`。在底层，`ConversionService` 利用注册到其内部的 `IdToFixedDepositDetailsConverter<String,\
  \ FixedDepositDetails>` 转换器来执行类型转换。\n\n既然我们已经了解了如何创建和使用自定义 Converter（转换器），现在让我们来看看如何创建和使用自定义\
  \ Formatter（格式化器）。\n\n## 创建自定义 Formatter\n\nFormatter 用于将类型为 `T` 的对象转换为用于显示的 `String`\
  \ 值，并将 `String` 值解析为对象类型 `T`。Formatter 实现了 Spring 的 `Formatter<T>` 接口，其中 `T` 是 Formatter\
  \ 要格式化的对象类型。这听起来与 Web 应用程序中 `PropertyEditors` 的功能相似。正如我们在本章中看到的，Matchers 提供了比 PropertyEditors\
  \ 更健壮的替代方案。\n\n**注意** Spring 的标签库使用注册到 `FormattingConversionService` 的 formatters\
  \ 在数据绑定和渲染期间执行类型转换。\n\n下面的示例列表显示了 `AmountFormatter`，它被 `MyBank` 用于以适用于用户本地化 en 货币显示定存金额，并解析用户输入的定存金额。为了简单起见，没有对定存金额进行货币转换；仅将适用于用户本地化\
  \ en 货币符号附加在定存金额之后。\n\n**示例列表 13-19** – `AmountFormatter` - 一个 Formatter 的实现\n\n\
  **项目** – `ch13-converter-formatter-bankapp`\n\n**源码位置**– `src/main/java/sample/spring/chapter13/formatter`\n\
  \n```java\npackage sample.spring.chapter13.formatter;\n\nimport java.text.ParseException;\n\
  import java.util.Locale;\nimport org.springframework.format.Formatter;\n\npublic\
  \ class AmountFormatter implements Formatter<Long>{\n\n    @Override\n    public\
  \ String print(Long object, Locale locale) {\n        String returnStr = object.toString()\
  \ + \" USD\";\n        if(locale.getLanguage().equals(new Locale(\"de\").getLanguage()))\
  \ {\n            returnStr = object.toString() + \" EURO\";\n        }\n       \
  \ return returnStr;\n    }\n\n    @Override\n    public Long parse(String text,\
  \ Locale locale) throws ParseException {\n        String str[] = text.split(\" \"\
  );\n        return Long.parseLong(str[0]);\n    }\n}\n```\n\n`AmountFormatter` 实现了\
  \ `Formatter<Long>` 接口，这意味着 `AmountFormatter` 适用于 `Long` 类型对象。`print` 方法将代表定存金额的\
  \ `Long` 类型对象转换为显示给用户的 `String` 值。根据从 `locale` 获取的语言代码，`print` 方法简单地为定存金额附加 `USD`（针对\
  \ `en` 语言代码）或 `EURO`（针对 `de` 语言代码）。例如，如果定存金额为 1000 语言代码为 `de`，`print` 方法返回‘1000\
  \ EURO’。`parse` 方法获取用户输入的定存金额（例如‘1000 EURO’），并通过从用户输入的值中提取定存金额将其转换为 `Long` 类型对象。\n\
  \n现在让我们来看看如何配置自定义格式化。\n\n## 配置自定义 Formatter\n\n你可以使用 `FormattingConversionServiceFactoryBean`\
  \ 的 `formatters` 属性向 `FormattingConversionService` 注册自定义格式，如下所示：\n\n**示例列表 13-20**\
  \ – 使用 `FormattingConversionService` 注册自定义 Formatter\n\n```xml\n<beans .....>\n\n\
  \    .....\n    <mvc:annotation-driven conversion-service=\"myConversionService\"\
  \ />\n    .....\n    <bean id=\"myConversionService\"\n        class=\"org.springframework.format.support.FormattingConversionServiceFactoryBean\"\
  >\n        <property name=\"formatters\">\n            <set>\n                <bean\
  \ class=\"sample.spring.chapter13.formatter.AmountFormatter\" />\n            </set>\n\
  \        </property>\n    </bean>\n</beans>\n```\n\n注册到 `FormattingConversionService`\
  \ 的 `AmountFormatter` 在数据绑定和渲染期间适用于*所有* `Long` 类型字段。\n\n你可以通过 Spring 的 `AnnotationFormatterFactory`\
  \ 来控制应用 Formatter 的字段。`AnnotationFormatterFactory` 的实现为带有特定*注解*的字段创建格式化器。让我们看看如何使用\
  \ `AnnotationFormatterFactory` 仅对标记了 `@AmountFormat` 注解的 `Long` 类型字段进行格式化。\n\n##\
  \ 创建 AnnotationFormatterFactory 以仅格式化标记 @AmountFormat 注解的字段\n\n下面的示例列表显示了 `@AmountFormat`\
  \ 注解的定义：\n\n**示例列表 13-21** – `AmountFormat` 注解\n\n**项目** – `ch13-converter-formatter-bankapp`\n\
  \n**源码位置**– `src/main/java/sample/spring/chapter13/formatter`\n\n```java\npackage\
  \ sample.spring.chapter13.formatter;\n\n.....\n\n@Target(value={ElementType.FIELD})\n\
  @Retention(RetentionPolicy.RUNTIME)\n@Documented\npublic @interface AmountFormat\
  \ { }\n```\n\n在上面的示例列表中，`@Target` 注解指定 `@AmountFormat` 可以出现在字段上。\n\n下面的示例列表显示了 `AnnotationFormatterFactory`\
  \ 的实现，它为标记了 `@AmountFormat` 注解的字段创建格式化器：\n\n**示例列表 13-22** – `AmountFormatterFactory`\
  \ 类\n\n**项目** – `ch13-converter-formatter-bankapp`\n\n**源码位置**– `src/main/java/sample/spring/chapter13/formatter`\n\
  \n```java\npackage sample.spring.chapter13.formatter;\n\nimport org.springframework.format.AnnotationFormatterFactory;\n\
  import org.springframework.format.Parser;\nimport org.springframework.format.Printer;\n\
  import java.util.HashSet;\nimport java.util.Set;\n\npublic class AmountFormatterFactory\
  \ implements AnnotationFormatterFactory<AmountFormat> {\n\n    public Set<Class<?>>\
  \ getFieldTypes() {\n        Set<Class<?>> fieldTypes = new HashSet<Class<?>>(1,\
  \ 1);\n        fieldTypes.add(Long.class);\n        return fieldTypes;\n    }\n\n\
  \    public Parser<?> getParser(AmountFormat annotation, Class<?> fieldType) {\n\
  \        return new AmountFormatter();\n    }\n\n    public Printer<?> getPrinter(AmountFormat\
  \ annotation, Class<?> fieldType) {\n        return new AmountFormatter();\n   \
  \ }\n}\n```\n\n`AmountFormatterFactory` 实现了 `AnnotationFormatterFactory<AmountFormat>`\
  \ 接口，这意味着 `AmountFormatterFactory` 为标记了 `@AmountFormat` 注解的字段创建格式化器。\n\n`getFieldTypes`\
  \ 方法返回可能标记有 `@AmountFormat` 注解的字段类型。上面示例中的 `getFieldTypes` 方法返回单一类型 `Long` 类型，这意味着只有标记了\
  \ `@AmountFormat` 注解的 `Long` 类型字段会被由 `AmountFormatterFactory` 创建的格式化器格式化。`getParser`\
  \ 和 `getPrinter` 方法为标记了 `@AmountFormat` 注解的字段返回格式化器。你应该注意 `Formatter` 接口是 `Parser`\
  \ 和 `Printer` 接口的子接口。\n\n## 配置 AnnotationFormatterFactory 实现\n\n与 Formatters 配置类似，`AnnotationFormatterFactory`\
  \ 实现通过 `FormattingConversionServiceFactoryBean` 的 `formatters` 属性注册到 `FormattingConversionService`：\n\
  \n**示例列表 13-23** – `AmountFormatterFormatterFactory` 配置\n\n\n\n\n\n```xml\n<bean\
  \ id=\"myConversionService\" class=\"org.springframework.format.support.FormattingConversionServiceFactoryBean\"\
  >\n    <property name=\"formatters\">\n        <set>\n            <bean class=\"\
  sample.spring.chapter13.formatter.AmountFormatAnnotationFormatterFactory\" />\n\
  \        </set>\n    </property>\n</bean>\n</beans>\n```\n\n现在我们已经看到了如何使用 `AnnotationFormatterFactory`\
  \ 来启用对带有特定注解的字段进行格式化，让我们来看看它在 `ch13-converter-formatter-bankapp` 项目中是如何被使用的。\n\n\
  下图显示了 `ch13-converter-formatter-bankapp` 项目中显示定期存款列表的网页：\n\n![](img/00069.jpeg)\n\
  \n**图 13-4** - “存款金额”列根据从用户当前区域设置获取的语言代码显示 USD 或 EURO\n\n从上面的图片显示，如果用户选择的语言是英语，则会在定期存款金额后附加\
  \ USD。如果你将语言切换为德语，USD 将被 EURO 替换。在示例代码 13-19 中，我们看到 `AmountFormatter` 包含了根据用户当前区域设置获取的语言代码显示\
  \ USD 或 EURO 的逻辑。\n\n为了确保通过 `FormattingConversionService` 配置的格式器在页面渲染和表单提交期间被调用，`ch13-converter-formatter-bankapp`\
  \ 项目的 JSP 页面使用了 Spring 的标签库标签（如 `<eval>` 和 `<input>`）。\n\n现在让我们 Spring Web MVC 如何简化文件上传。\n\
  \n## 13-6 Spring Web MVC 中的文件上传支持\n\n你可以通过配置 `MultipartResolver` 在 Spring Web MVC\
  \ 应用中处理多部分请求（multipart requests）。Spring 提供了 `MultipartResolver` 接口的内置实现，你可以在 Web\
  \ 应用中使用它们：\n\n- `CommonsMultipartResolver` – 基于 [Apache Commons FileUpload](http://commons.apache.org/proper/commons-fileupload/)\
  \ 库\n- `StandardServletMultipartResolver` – 基于 Servlet 3.0 Part API\n\n当接收到多部分请求时，`DispatcherServlet`\
  \ 使用配置的 `MultipartResolver` 将 `HttpServletRequest` 封装成 `MultipartHttpServletRequest`\
  \ 实例。在 Spring Web MVC 中，上传的文件由 `MultipartFile` 对象表示。负责处理文件上传的控制器通过 `MultipartHttpServletRequest`\
  \ 定义的方法或直接访问 `MultipartFile` 对象来获取上传的文件。\n\n让我们先看一个使用 `CommonsMultipartResolver`\
  \ 上传文件的示例 Web 应用。\n\n**导入** `chapter 13/ch13-commons-file-upload` （该项目展示了如何使用 `CommonsMultipartResolver`\
  \ 上传文件。由于 `CommonsMultipartResolver` 使用 Apache Commons FileUpload 库，该项目依赖 `commons-fileupload`\
  \ JAR 文件。）\n\n### 使用 CommonsMultipartResolver 上传文件\n\n下面的示例显示了 `ch13-commons-file-upload`\
  \ 项目显示的上传表单：\n\n**示例代码 13-24** – `uploadForm.jsp` – 显示上传表单\n\n**项目** – `ch13-commons-file-upload`\n\
  \n**源码位置**– `src/main/webapp/WEB-INF/jsp`\n\n.....\n\n```xml\n<form method=\"post\"\
  \ action=\"/ch13-commons-file-upload/uploadFile\" enctype=\"multipart/form-data\"\
  >\n    <table style=\"padding-left: 200px;\">\n        <tr>\n            <td colspan=\"\
  2\"><c:out value=\"${uploadMessage}\" /></td>\n        </tr>\n        <tr>\n   \
  \         <td><b>选择要上传的文件: &nbsp;</b></td>\n            <td><input type=\"file\"\
  \ name=\"myFileField\" /></td>\n        </tr>\n        <tr>\n            <td colspan=\"\
  2\" align=\"center\">\n                <input type=\"button\" value=\"Upload file\"\
  \ onclick=\"document.forms[0].submit(); />\n            </td>\n        </tr>\n \
  \   </table>\n</form>\n```\n\n.....\n\n上面的示例代码显示，`<form>` 元素的 `enctype` 属性被设置为 `multipart/form-data`，这意味着表单提交将导致向服务器发送多部分请求。`uploadMessage`\
  \ 请求属性显示了用户在选择文件并点击“Upload file（上传文件）”按钮后的成功或失败消息。\n\n下面的示例代码显示了解析多部分请求的 `CommonsMultipartResolver`\
  \ 配置：\n\n**示例代码 13-25** – `fileupload-config.xml` – `CommonsMultipartResolver` 配置\n\
  \n**项目** – `ch13-commons-file-upload`\n\n**源码位置**– `src/main/webapp/WEB-INF/spring`\n\
  \n```xml\n<bean id=\"multipartResolver\" class=\"org.springframework.web.multipart.commons.CommonsMultipartResolver\"\
  >\n    <property name=\"maxUploadSize\" value=\"100000\" />\n    <property name=\"\
  resolveLazily\" value=\"true\" />\n</bean>\n```\n\n需要注意的是，在 Web 应用上下文 XML 文件中，配置\
  \ `MultipartResolver` 实现时 `id` 必须为 `multipartResolver`。`maxUploadSize` 属性指定了可以上传的文件的最大大小（单位为字节）。如果你尝试上传一个大于\
  \ 100 KB 的文件，上面示例代码中的 `CommonsMultipartResolver` 将抛出异常。如果 `CommonsMultipartResolver`\
  \ 实例抛出异常，负责处理文件上传的控制器将没有机会处理异常。因此，将 `resolveLazily` 属性设置为 `true`。如果 `resolveLazily`\
  \ 属性被设置为 `true`，则只有当控制器访问上传的文件时，才会解析多部分请求。这为控制器提供了处理多部分请求解析期间发生异常的机会。\n\n下面的示例代码显示了处理文件上传的\
  \ `FileUploadController`：\n\n**示例代码 13-26** – `FileUploadController`\n\n**项目** –\
  \ `ch13-commons-file-upload`\n\n**源码位置**– `src/main/java/sample/spring/chapter13/web`\n\
  \n```java\npackage sample.spring.chapter13.web;\n\nimport org.springframework.web.multipart.MultipartFile;\n\
  \n.....\n\npublic class FileUploadController {\n    .....\n\n    @RequestMapping(value\
  \ = \"/uploadFile\", method = RequestMethod.POST)\n    public ModelAndView handleFileUpload(\n\
  \            @RequestParam(\"myFileField\") MultipartFile file) throws IOException\
  \ {\n        ModelMap modelData = new ModelMap();\n        if (!file.isEmpty())\
  \ {\n            // -- 将上传的文件保存到文件系统\n            String successMessage = \"File\
  \ successfully uploaded\";\n            modelData.put(\"uploadMessage\", successMessage);\n\
  \            return new ModelAndView(\"uploadForm\", modelData);\n        }\n  \
  \      .....\n    }\n\n    @ExceptionHandler(value = Exception.class)\n    public\
  \ ModelAndView handleException() {\n        .....\n    }\n}\n```\n\n\n\n\n\nServlet\
  \ 3 内置了对多部分请求（multipart request）的处理支持。如果你想使用 Servlet 3 提供的多部分支持，可以通过在 `DispatcherServlet`\
  \ 配置中指定 `<multipart-config>`元素来启用多部分请求处理，并在 Web 应用上下文 XML 文件中配置 `StandardServletMultipartResolver`。与\
  \ `CommonsMultipartResolver` 不同，`StandardMultipartResolver` 没有定义任何属性。\n\n下面的示例显示了\
  \ `web.xml` 文件中的 `DispatcherServlet` 配置：\n\n**示例列表 13-27** – `web.xml`\n\n**项目**\
  \ – `ch13-servlet3-file-upload`\n\n**源码位置**– `src/main/webapp`\n\n```xml\n<servlet>\n\
  \    <servlet-name>fileupload</servlet-name>\n    <servlet-class>org.springframework.web.servlet.DispatcherServlet</servlet-class>\n\
  \    .....\n    <multipart-config>\n        <max-file-size>10000</max-file-size>\n\
  \    </multipart-config>\n</servlet>\n```\n\n由于指定了 `<multipart-config>` 元素，fileupload\
  \ servlet 就可以处理多部分请求。`<max-file-size>` 元素指定了允许上传的最大文件大小。请注意，最大文件大小现在作为 `<multipart-config>`\
  \ 元素的一部分。\n\n## 13-7 总结\n\n在本章中，我们查看了 Spring Web MVC 框架的一些简化 Web 应用开发的重要特性。在下一章中，我们将学习如何使用\
  \ Spring Security 框架来保护 Spring 应用。\n\n# 第 14 章 – 使用 Spring Security 应用程序\n\n## 14-1\
  \ 引言\n\n安全性是任何应用程序的一个重要方面。Spring Security 构建在 Spring Framework 之上，为保护基于 Spring 的应用程序提供了一个全面的框架。在本章中，我们将学习如何使用\
  \ Spring Security 框架来：\n\n- 验证用户身份\n- 实现 Web 请求安全\n- 实现方法级安全\n- 使用基于 ACL（访问控制列表）的安全性保护领域对象\n\
  \n让我们先来看看我们将使用 Spring Security 解决的 MyBank 应用程序的安全需求。\n\n## 14-2 MyBank 应用程序的安全需求\n\
  \nMyBank 应用程序的用户是 `customers`（客户）和 `administrators`（管理员），他们管理系统中的定期存款。客户可以开启和编辑定期存款，但**不能**关闭它们。管理员**不能**创建或编辑定期存款，但可以关闭客户的定期存款。\n\
  \n由于只有经过验证的用户才能访问 MyBank 应用程序，因此会对未经过验证的用户显示登录表单：\n\n![](img/00070.jpeg)\n\n**图\
  \ 14-1** - 显示给未验证用户的登录表单\n\n上面的图显示了显示给未验证用户的登录表单。如果用户选择“在此计算机上记住我”复选框，MyBank 应用程序将记住用户输入的凭据，并在未来的访问中使用它对用户进行自动验证。\n\
  \n当 `customer` 登录时，将显示与客户相关的定期存款详情，如下：\n\n![](img/00071.jpeg)\n\n**图 14-2** - 验证后显示客户的定期存款\n\
  \n上面的图显示了一个注销（Logout）链接，客户可以点击该链接退出 MyBank 应用程序。客户可以通过点击与该定期存款对应的 Edit 链接来编辑定期存款详情。客户可以通过点击“Create\
  \ new Fixed Deposit”按钮查看开启新定期存款的表单。请注意，已验证用户的用户名显示在注销链接下方。\n\n当管理员登录时，MyBank 应用程序将显示系统中的`所有`定期存款详情，如下：\n\
  \n![](img/00072.jpeg)\n\n**图 14-3** - 向管理员显示`所有`客户的定期存款\n\n在上面的图中，管理员可以通过点击与该定期存款对应的\
  \ Close 链接来选择关闭定期存款。与客户的情况一样，管理员也能看到“Create new Fixed Deposit”按钮，但尝试保存新定期存款详情将导致应用程序抛出安全异常。\n\
  \n现在，让我们来看看如何使用 Spring Security 来解决 MyBank 应用程序的安全需求。\n\n**导入** `chapter 14/ch14-bankapp-simple-security`（该项目代表使用\
  \ Spring Security 框架来解决 14-2 节中描述的安全需求的 MyBank 应用程序。）\n\n## 14-3 使用 Spring Security\
  \ 保护 MyBank 应用程序\n\nSpring Security 框架由多个模块组成，处理应用程序的各个安全方面。下表描述了 Spring Security\
  \ 的一些重要模块：\n\n| 模块 | 描述 |\n| :--- | :--- |\n| `spring-security-core` | 定义 Spring\
  \ Security 框架的核心类和接口。任何使用 Spring Security 的应用程序都需要此模块。 |\n| `spring-security-web`\
  \ | 为保护 Web 应用程序提供支持 |\n| `spring-security-config` | 像 Spring 的 tx 和 mvc schema\
  \ 一样，Spring Security 定义了一个安全模式来简化 Spring Security 特性的配置。`spring-security-config`\
  \ 模块负责解析安全元素。 |\n| `spring-security-taglibs` | 定义了用于在 JSP 页面访问安全信息的标签 |\n| `spring-security-acl`\
  \ | 启用使用 ACL（访问控制列表）来保护实例 |\n\n在本节中，我们将查看 `spring-security-core`、`spring-security-web`、`spring-security-config`\
  \ 和 `spring-security-taglibs` 模块来保护 MyBank 应用程序。在本章稍后的部分，我们将查看 `spring-security-acl`\
  \ 模块来保护领域对象。\n\n让我们从如何配置 Web 请求安全开始。\n\n### Web 请求安全\n\n你可以通过以下方式为应用程序添加 Web 请求安全：\n\
  \n- 在 `web.xml` 中配置 Spring 的 `DelegatingFilterProxy` filter\n- 启用 Spring Security\
  \ 框架提供的 Web 请求安全\n\n让我们先看看如何配置 `DelegatingFilterProxy` filter。\n\n### DelegatingFilterProxy\
  \ 配置\n\nSpring Framework 的 `web` 模块（由 `spring-web-4.0.0.RELEASE.jar` 文件表示）定义了实现\
  \ Servlet `Filter` 接口的 `DelegatingFilterProxy` 类。下面的示例显示了 `web.xml` 文件中 `DelegatingFilterProxy`\
  \ filter 的配置：\n\n**示例 14-1** – `web.xml` - `DelegatingFilterProxy` filter 配置\n\n\
  **项目** – `ch14-bankapp-simple-security`\n\n**源码位置**– `src/main/webapp/WEB-INF`\n\
  \n```xml\n<filter>\n    <filter-name>springSecurityFilterChain</filter-name>\n \
  \   <filter-class>org.springframework.web.filter.DelegatingFilterProxy</filter-class>\n\
  </filter>\n<filter-mapping>\n    <filter-name>springSecurityFilterChain</filter-name>\n\
  \    <url-pattern>/***</url-pattern>\n</filter-mapping>\n```\n\n`<filter-mapping>`\
  \ 元素指定了 `DelegatingFilterProxy` filter 映射到所有传入的 Web 请求。`<filter-name>` 元素指定的过滤器名称在\
  \ `DelegatingFilterProxy` filter 的上下文中具有特殊意义。`DelegatingFilterProxy` filter 将请求处理委托给名称与\
  \ `<filter-name>` 元素值匹配的 Spring Bean。在上面的示例列表中，`DelegatingFilterProxy` filter 接收到的\
  \ Web 请求被委托给根应用程序上下文中名为 `springSecurityFilterChain` 的 Spring Bean。我们很快就会看到 springSecurityFilterChain\
  \ Bean 是由 Spring Security 框架创建的。\n\n\n\n\n\n下面的示例列表显示了使用安全架构中的`<http>`元素来配置 Web\
  \ 请求安全的应用上下文文件：\n\n**示例列表 14-2** – `applicationContext-security.xml` – Web 安全配置\n\
  \n**项目** – `ch14-bankapp-simple-security`\n\n**源位置**- `src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans:beans xmlns=\"http://www.springframework.org/schema/security\"\n\
  \    xmlns:beans=\"http://www.springframework.org/schema/beans\"\n    xsi:schemaLocation=\"\
  .....\n      http://www.springframework.org/schema/security\n          http://www.springframework.org/schema/security/spring-security-3.2.xsd\"\
  >\n    <http use-expressions=\"true\">\n        <intercept-url pattern=\"/**\" access=\"\
  hasAnyRole('ROLE_CUSTOMER', 'ROLE_ADMIN')\" />\n        <form-login />\n       \
  \ <logout />\n        <remember-me />\n        <headers>\n            <cache-control/>\n\
  \            <xss-protection/>\n        </headers>\n    </http>\n    .....\n</beans:beans>\n\
  ```\n\n上面的示例列表显示应用上下文 XML 文件引用了`spring-security-3.2.xsd`架构。`spring-security-3.2.xsd`架构包含在`spring-security-config-3.2.0.RELEASE.jar`文件的`org.springframework.security.config`包中。\n\
  \n`<http>`元素包含了应用程序的 Web 请求安全配置。Spring Security 框架解析`<http>`元素，并在 Spring 容器中注册一个名为`springSecurityFilterChain`的\
  \ bean。`springSecurityFilterChain`bean 负责处理 Web 请求安全。我们之前配置的`DelegatingFilterProxy`过滤器（参见示例列表\
  \ 14-1）将 Web 请求处理逻辑委托给`springSecurityFilterChain`bean。`springSecurityFilterChain`bean\
  \ 代表一个`FilterChainProxy`bean 的实例（更多信息请参阅 Spring Security 文档），它包含一个 Servlet 过滤器链，这些过滤器链是由`<http>`元素的子元素添加到链中的。\n\
  \n`<intercept-url>`元素的`access`属性指定了一个 Spring EL 表达式，该表达式被评估为一个布尔值。如果 Spring EL 表达式返回`true`，则与`pattern`属性匹配的\
  \ URL 将允许用户访问。如果 Spring EL 表达式返回`false`，则对与`pattern`属性匹配的 URL 拒绝访问请求。Spring Security\
  \ 框架提供了几个内置表达式，如`hasRole`、`hasAnyRole`、`isAnonymous`等。\n\n在示例列表 14-2 中，如果经过验证的用户拥有`ROLE_CUSTOMER`或`ROLE_ADMIN`角色，则`hasAnyRole('ROLE_CUSTOMER',\
  \ 'ROLE_ADMIN')`表达式将返回`true`。在 MyBank Web 应用程序中，`ROLE_CUSTOMER`角色分配给客户，`ROLE_ADMIN`角色分配给管理员。由于模式`/*`匹配所有\
  \ URL，示例列表 14-2 中的`<intercept-url>`元素指定只有拥有`ROLE_CUSTOMER`或`ROLE_ADMIN`角的用户才能访问\
  \ MyBank Web 应用程序。您应该注意，只有当将`<http>`元素的`use-expressions`属性值设置为`true`时，才允许在`access`属性中使用\
  \ Spring EL 表达式。\n\n`<form-login>`元素配置了一个用于身份验证用户的登录页面。你可以使用`<form-login>`元素的各种属性，如`login-page`、`default-target-url`等来定制登录页面。`login-page`属性指定了用于渲染登录面的\
  \ URL。如果未指定`login-page`属性，则会在`/spring_security_login` URL 自动渲染登录页面。\n\n`<logout>`元素配置了\
  \ Spring Security 框架的注销处理功能。你可以使用`<logout>`元素的各种属性，如`logout-url`、`delete-cookies`、`invalidate-session`等来配置注销功能。例如，你可以使用`delete-cookies`属性来指定用户注销应用程序时应删除的\
  \ Cookie 名称（这些名称之间用逗号分隔）。`logout-url`属性允许你配置执行注销处理的 URL。如果你没有指定`logout-url`属性，则`logout-url`属性的默认值被设置为`/j_spring_security_logout`。\n\
  \n`<remember-me>`元素配置了“记住我”身份验证，使 Web 应用程序在不同会话之间记住已验证用户的身份。当用户成功通过验证后，Spring Security\
  \ 框架会生成一个唯一的令牌，该令牌可以存储在持久化存储中，也可以通过 Cookie 发送给用户。在示例列表 14-2 中，`<remember-me>`元素配置了基于\
  \ Cookie 的记住我身份验证服务。当用户再次访问 Web 应用程序时，令牌将从 Cookie 中提取并自动通过身份验证。\n\n`<headers>`元素指定了\
  \ Spring Security 框架添加到 HTTP 响应中的安全头部。例如，在示例列表 14-2 中，`<cache-control>`元素增加了`Cache-Control`、`Pragma`和`Expires`头部，而`<xss-protection>`元素增加了`X-XSS-Protection`头部。当未验证的用户访问\
  \ MyBank Web 应用程序时，Spring Security 向用户显示由`<form-login>`元素配置的登录页面（参见图 14-1）。现在让我们用户输入凭据并点击登录按钮时是如何执行身份验证的。\n\
  \n### 身份验证配置\n\n当用户输入凭据并提交登录页面时，Spring Security 的`AuthenticationManager`负责处理身份验证请求。`AuthenticationManager`配置了一个或多个`AuthenticationProviders`，它尝试通过这些者对用户进行验证。例如，如果你要在\
  \ LDAP 服务器验证用户，可以配置一个`LdapAuthenticationProvider`（`AuthenticationProvider`的实现），它通过\
  \ LDAP 服务器验证用户。\n\n安全架构简化了`AuthenticationManager`和`AuthenticationProvider`对象的配置，如下例所示：\n\
  \n**示例列表 14-3** – `applicationContext-security.xml`\n\n**项目** – `ch14-bankapp-simple-security`\n\
  \n**源位置**- `src/main/resources/META-INF/spring`\n\n```xml\n<authentication-manager>\n\
  \    <authentication-provider>\n        <user-service>\n            <user name=\"\
  admin\" password=\"admin\" authorities=\"ROLE_ADMIN\" />\n            <user name=\"\
  cust1\" password=\"cust1\" authorities=\"ROLE_CUSTOMER\" />\n            <user name=\"\
  cust2\" password=\"cust2\" authorities=\"ROLE_CUSTOMER\" />\n        </user-service>\n\
  \    </authentication-provider>\n</authentication-manager>\n```\n\n`<authentication-manager>`元素配置一个`AuthenticationManager`实例。`<authentication-provider>`元素配置一个`AuthenticationProvider`实例。默认情况下，`<authentication-provider>`元素配置一个`DaoAuthenticationProvider`（`AuthenticationProvider`的实现），它使用\
  \ Spring 的`UserDetailsService`作为 DAO 来加载详情。\n\n`DaoAuthenticationProvider`使用配置的`UserDetailsService`根据用户名从用户库中加载用户详情。`DaoAuthenticationProvider`通过比较用户提供的登录凭据与配置的`UserDetailsService`加载的来执行身份验证。您应该注意，`UserDetailsService`可以从数据源、平面文件或任何其他用户库加载用户详情。\n\
  \n\n\n\n\n`<authentication-provider>` 的子元素 `<user-service>` 配置了一个 `in-memory` 的\
  \ `UserDetailsService`，它加载由 `<user>` 元素定义的用户。在示例 14-3 中，`<user-service>` 元素定义应用程序有三个用户：admin（`ROLE_ADMIN`\
  \ 角色）、cust1（`ROLE_CUSTOMER` 角色）和 cust2（`ROLE_CUSTOMER` 角色）。`name` 属性指定分配给用户的用户名，`password`\
  \ 属性指定分配给用户的密码，而 `authorities` 属性指定分配给用户的角色。\n\n现在，如果你部署了 `ch14-bankapp-simple-security`\
  \ 项目并通过 `http://localhost:8080/ch14-bankapp-simple-security` URL 访问它，将显示 Web 应用程序的登录页面（参考图\
  \ 14-1）。如果你通过输入用户名 `cust1` 和密码 `cust1` 进行身份验证，Web 将显示与 `cust1` 用户相关的定期存款（参考图 14-2）。同样，如果你用用户名\
  \ `cust2` 和密码 `cust2` 登录，Web 将显示与 `cust2` 用户相关的定期存款。如果你用用户名 `admin` 和密码 `admin`\
  \ 登录，Web 将显示 `cust1` 和 `cust2` 用户的定期存款。\n\n现在让我们来看如何使用 Spring Security 的 JSP 标签库来访问安全信息并对\
  \ JSP 页面显示的内容应用安全限制。\n\n### 使用 Spring Security 的 JSP 标签库保护 JSP 内容\n\nMyBank Web\
  \ 应用程序的要求之一是：只有具有 `ROLE_CUSTOMER` 角色的用户才能编辑定期存款（参考图 14-2）。此外，只有具有 `ROLE_ADMIN` 角色的用户才能关闭定期存款（参考图\
  \ 14-3）。由于我们需要根据已验证用户的角色来保护编辑和关闭的超链接，因此 MyBank Web 应用程序使用了 Spring Security 的 JSP\
  \ 标签库来保护 JSP 内容。\n\n下面的示例显示了如何使用 Spring Security 的 JSP 标签库访问已验证用户的用户名，并根据登录用户的角色来保护\
  \ JSP 内容：\n\n**示例 14-4** – `fixedDepositList.jsp`\n\n**项目** – `ch14-bankapp-simple-security`\n\
  \n**源位置**- `src/main/webapp/WEB-INF/jsp`\n\n```xml\n<%@ taglib uri=\"http://www.springframework.org/security/tags\"\
  \ prefix=\"security\"%>\n\n.....\n\n<body>\n    .....\n    <td style=\"font-family:\
  \ 'arial'; font-size: 12px; font-weight: bold\" align=\"right\">\n        <a href=\"\
  ${pageContext.request.contextPath}/j_spring_security_logout\">Logout</a>\n     \
  \   <p>\n            Username: <security:authentication property=\"principal.username\"\
  \ />\n        </p>\n    </td>\n    .....\n    <td class=\"td\">\n        <security:authorize\
  \ access=\"hasRole('ROLE_CUSTOMER')\">\n            <a href=\"${pageContext.request.contextPath}/fixedDeposit?.....\"\
  \ >Edit</a>\n        </security:authorize>\n        <security:authorize access=\"\
  hasRole('ROLE_ADMIN')\">\n            <a href=\"${pageContext.request.contextPath}/fixedDeposit.....\"\
  >Close</a>\n        </security:authorize>\n    </td>\n</body>\n</html>\n```\n\n\
  上面的示例示例显示，Logout（退出）超链接引用了 `${pageContext.request.contextPath}/**j_spring_security_logout`\
  \ URL。如前所述，如果你没有指定 `<logout>` 元素的 `logout-url` 属性，则 `logout-url` 的值被设置为 `/j_spring_security_logout`。因此，当用户点击\
  \ Logout 超链接时，用户将从 MyBank Web 应用程序注销。\n\n上面的示例还显示，JSP 页面通过 taglib 指令包含了 Spring Security\
  \ 的 JSP 标签库。Spring Security 的 `Authentication` 对象包含有关已验证用户的信息。例如，它包含了已验证用户的角色以及用户用于身份验证的用户名。<authentication>`\
  \ 元素打印 `Authentication` 对象的指定属性。在上面的示例中，`principal.username` 属性指的是已验证用户的用户名属性。\n\
  \n`<authorize>` 元素根据 `access` 属性指定的安全表达式的评估结果来保护其包含的 JSP 内容。如果安全表达式求值为 `true`，则渲染包含的内容，否则不渲染。在上面的示例中，如果已验证用户具有\
  \ `ROLE_CUSTOMER` 角色，则 `hasRole(‘ROLE_CUSTOMER’)` 表达式返回 `true`；如果已验证用户具有 `ROLE_ADMIN`\
  \ 角色，则 `hasRole(‘ROLE_ADMIN’)` 表达式返回 `true`。在上面的示例中，`hasRole` 表达式对 `ROLE_CUSTOMER`\
  \ 角色返回 `true`。\n\n现在让我们来看如何使用 Spring Security 结合方法级安全。\n\n### 保护方法\n\nMyBank 应用程序的要求之一是：具有\
  \ `ROLE_ADMIN` 角色的用户可以查看“创建新存款”按钮（参考图 14-3），但尝试保存新存款详情将导致安全异常。这是一个我们想要保护 `FixedDepositService`\
  \ 的示例。我们还希望保护 `FixedDepositService` 的其他方法，使它们不会被未经授权的用户调用。例如，以 `ROLE_CUSTOMER` 角色登录的\
  \ `cust1` 用户可以通过以下 URL 关闭定期存款：http://localhost:8080/ch14-bankapp-simple-security/fixedDeposit?fdAction=close&fixedDepositId=101\n\
  \n上述 URL 中的 `<fixedDepositId>` 如下所示：\n(images/0073.jpeg)\n\n**图 14-4** – 固定存款 ID\n\
  \n为你的应用程序添加方法级安全，你需要执行以下操作：\n- 使用安全架构中的 `<global-method-security>` 元素为应用程序配置方法级安全\n\
  - 在你想保护的方法上添加 `@Secured` 注解\n\n让我们先来看 `<global-method-security>` 元素。\n\n### 使用 global-method-security\
  \ 元素配置方法级安全\n\n下面的示例显示了 `<global-method-security>` 的用法：\n\n**示例 14-5** – `applicationContext-security.xml`\n\
  \n**项目** – `ch14-bankapp-simple-security`\n\n**源位置**- `src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans:beans xmlns=\"http://www.springframework.org/schema/security\"\
  >\n    .....\n    <global-method-security secured-annotations=\"enabled\" />\n</beans:beans>\n\
  ```\n\n`<global-method-security>` 元素配置方法级安全。`<global-method-security>` 元素仅适用于定义它的上下文中。例如，如果\
  \ `<global-method-security>` 元素定义在根 Web 应用程序上下文 XML 文件中，那么它仅适用于根 `WebApplicationContext`\
  \ 实例注册的 Bean。在 `ch14-bankapp-simple-security` 项目中，`applicationContext-security.xml`（如上面的示例所示）和\
  \ `applicationContext.xml` 文件（定义服务和 DAO）构成了根 Web 应用程序上下文 XML 文件；因此，`<global-method-security>`\
  \ 元素仅适用于这些应用程序上下文 XML 文件定义的 Bean。\n\n`<global-method-security>` 元素的 `secured-annotations`\
  \ 属性指定了对于注册到 Spring 容器的 Bean 启用或禁用 Spring 的 `@Secured` 注解的使用。\n\n\n\n\n\n注意：如果你想保护控制器方法，请在\
  \ Web 应用程序上下文 XML 文件中定义 `<global-method-security>` 元素，而不是根 Web 应用程序上下文 XML 文件。\n\
  \n现在让我们来看如何使用 Spring 的 `@Secured` 注解来保护方法。\n\n### 使用 @Secured 注解在 Bean 方法上指定安全约束\n\
  \n下面的示例列表展示了如何使用 Spring 的 `@Secured` 注解来定义方法的安全约束：\n\n**示例列表 14-6** – `FixedDepositService`\
  \ 接口\n\n**项目** – `ch14-bankapp-simple-security`\n\n**源码位置**- `src/main/java/sample/spring/chapter14/service`\n\
  \n```java\npackage sample.spring.chapter14.service;\n\nimport org.springframework.security.access.annotation.Secured;\n\
  \n.....\n\npublic interface FixedDepositService {\n\n    .....\n\n    @Secured(\"\
  ROLE_CUSTOMER\")\n    void saveFixedDeposit(FixedDepositDetails fixedDepositDetails);\n\
  \n    .....\n\n    @Secured(\"ROLE_ADMIN\")\n    void closeFixedDeposit(int fixedDepositId);\n\
  \n    @Secured(\"ROLE_CUSTOMER\")\n    void editFixedDeposit(FixedDepositDetails\
  \ fixedDepositDetails);\n}\n```\n\n上面的示例列表显示了 `FixedDepositService` 接口，它定义了操作定期存款的方法。`saveFixedDeposit`\
  \ 和 `editFixedDeposit` 方法上的 `@Secured(\"ROLE_CUSTOMER\")` 注解指定这些方法只能由角色为 `ROLE_CUSTOMER`\
  \ 的用户调用。`closeFixedDeposit` 方法上的 `@Secured(\"ROLE_ADMIN\")` 注解指定该方法只能由角色为 `ROLE_ADMIN`\
  \ 的用户调用。\n\n注意：默认情况下，方法级安全基于 Spring AOP。如果你想使用 AspectJ 代替 Spring AOP，请将 `<global-method-security>`\
  \ 元素的 `mode` 属性设置为 `aspectj`。此外，向你的项目添加 `spring-security-aspects` 模块，并在类而不是接口上指定\
  \ `@Secured` 注解。\n\n与其使用 `@Secured` 注解，你可以使用 Spring 的 `@PreAuthorize` 注解在方法上应用安全约束。与\
  \ `@Secured` 注解不同，`@PreAuthorize` 注解接受安全表达式，例如 `hasRole`、`hasAnyRole` 等。要启用 `@PreAuthorize`\
  \ 注解的使用，请将 `<global-method-security>` 元素的 `pre-post-annotations` 属性设置为 `enabled`。下面的示例列表展示了\
  \ `@PreAuthorize` 注解的使用：\n\n**示例列表 14-6** – @PreAuthorize 注解\n\n```java\nimport\
  \ org.springframework.security.access.prepost.PreAuthorize;\n\n.....\n\npublic interface\
  \ SomeService {\n\n    .....\n\n    @PreAuthorize(\"hasRole('ROLE_XYZ')\")\n   \
  \ void doSomething(.....);\n\n    .....\n}\n```\n\n在上面的示例列表中，`@PreAuthorize` 注解指定\
  \ `doSomething` 方法仅对角色为 `ROLE_XYZ` 的用户开放。\n\nSpring Security 还支持安全注解，例如 `@RolesAllowed`、`@DenyAll`、`@PermitAll`\
  \ 等，这些是由 JSR-250 – 通用注解定义的。要启用 JSR-250 安全注解的使用，将 `<global-method-security>` 的 `jsr250-annotations`\
  \ 属性设置为 `enabled`。下面的示例列表展示了 `@RolesAllowed` 注解的使用：\n\n**示例列表 14-7** – @RolesAllowed\
  \ 注解\n\n```java\nimport javax.annotation.security.RolesAllowed;\n\n.....\n\npublic\
  \ interface SomeService {\n\n    .....\n\n    @RolesAllowed(\"ROLE_XYZ\")\n    void\
  \ doSomething(.....);\n\n    .....\n}\n```\n\n在上面的示例列表中，`@RolesAllowed` 注解指定 `doSomething`\
  \ 方法仅对角色为 `ROLE_XYZ` 的用户开放。\n\n注意：我们在书前面的章节中看到，JSR 250 注解（如 `@PreDestroy`、`@PostConstruct`\
  \ 等）是 Java SE 的一部分（此处修正翻译逻辑：我们在书前面的章节中看到，JSR 250 注解，如 `@PreDestroy`、`@PostConstruct`\
  \ 等，是 Java SE 的一部分。*注：原文此处似乎逻辑有重复，已按原意翻译*）。要启用 JSR-250 安全注解，将 `<global-method-security>`\
  \ 的 `jsr250-annotations` 属性设置为 `enabled`。\n\n（由于提供的原文文本存在大量重复的描述，例如“JSR 250 注解，如\
