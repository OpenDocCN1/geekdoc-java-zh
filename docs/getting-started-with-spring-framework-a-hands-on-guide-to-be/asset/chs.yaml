  ## A-4 在 Tomcat 7 服务器上部署 Web 项目\n\n要在 Tomcat 7 服务器上部署 Web 项目（例如 ch10-helloworld），请遵循以下步骤：\n\
  \n- 在 Eclipse IDE 的 `Project Explorer` 选项卡中，右键点击示例 Web 项目。现在，您将看到可以对所选 Web 项目执行的一系列操作列表。\n\
  - 如果您只是想简单地部署 Web 项目，请选择 `Run As -> Run on Server` 选项。这将 Web 项目部署到我们在 A-3 节中配置的\
  \ Tomcat 7 服务器上。\n\n**或者**\n\n- 如果您想部署并调试 Web 项目，请选择 `Debug As -> Debug on Server`\
  \ 选项。这将 Web 项目部署到我们在 A-3 节中配置的 Tomcat 7 服务器上，并允许您通过在 Eclipse IDE 中设置断点来调试 Web 项目。\n\
  \n如果 Tomcat 7 服务器在 Eclipse IDE 中配置正确，您会注意到 Tomcat 7 服务器已启动且 Web 项目已部署在其上。如果您现在打开\
  \ 浏览器并访问 `http://localhost:8080/<sample-project-folder-name>`，您将看到 Web 项目的首页。在这里，`<sample-project-folder-name>`\
  \ 指的是示例项目的文件夹名称。\n\n### 在嵌入模式下运行 Tomcat 7 服务器\n\n部署和运行示例 Web 项目的更简单方法是使用嵌入式 Tomcat\
  \ 7 服务器。在所有示例 Web 项目中，Maven Tomcat 插件（http://tomcat.apache.org/maven-plugin-2.0/）已配置在\
  \ `pom.xml` 文件中。如果您进入示例项目目录并执行 Maven Tomcat 插件的 `tomcat7:run` 目标，插件将负责嵌入模式下载并启动\
  \ Tomcat 7，自动将示例 Web 项目部署到嵌入式 Tomcat 7 实例上。要停止服务器，您只需按 `Ctrl-C` 即可。\n\n"
