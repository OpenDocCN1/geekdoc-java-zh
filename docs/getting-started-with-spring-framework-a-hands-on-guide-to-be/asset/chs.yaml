  \n\n\n\n\n- `cust1` 和 `cust2` 只能编辑他们拥有的定期存款。例如，`cust1` 无法编辑由 `cust2` 创建的定期存款。\n\
  - `cust1` 和 `cust2` 只能让他们拥有的定期存款对管理员用户可见。例如，`cust1` 无法让由 `cust2` 创建的定期存款对管理员用户可见。\n\
  - `admin user`（`ROLE_ADMIN` 角色）只能查看由 `cust1` 和 `cust2` 用户开放可见的定期存款。\n- 只有管理员用户可以关闭定期存款。\n\
  \n在深入研究 MyBank 应用程序的实现细节之前，让我们先查看 Spring Security 存储 ACL 和用户信息所需的标准数据库表。\n\n## 存储\
  \ ACL 和用户信息的数据库表\n\nSpring Security 的 ACL 模块提供了领域对象实例安全性。MyBank 应用程序使用 Spring Security\
  \ 的 ACL 模块来保护 `FixedDepositDetails` 实例。Spring Security 表（`ACL_CLASS`、`ACL_ENTRY`、`ACL_OBJECT_IDENTITY`\
  \ 和 `ACL_SID`）包含了应用于存储在 `FIXED_DEPOSIT_DETAILS` 表中的定期存款的权限。当访问 `FixedDepositDetails`\
  \ 实例时，Spring Security 的 ACL 模块会验证通过验证的用户具有操作该 `FixedDepositDetails` 实例所需的权限。\n\n\
  让我们查看用于存储 ACL 信息的每个 Spring Security 表。\n\n### ACL_CLASS 表\n\n`ACL_CLASS` 表包含了我们想要在应用程序中保护的领域类的完全限定名。在\
  \ MyBank 应用程序中，`ACL_CLASS` 表包含了 `FixedDepositDetails` 类的完全限定名，所示：\n\n![](img/00078.jpeg)\n\
  \n**图 14-9** `ACL_CLASS` 表\n\n#### 表列描述\n\n- `id` – 包含主键\n- `class` – 我们想要保护的领域类类的完全限定名\n\
  \n### ACL_SID 表\n\n`ACL_SID` 表（`SID` 意味着“安全标识”）包含了系统中的主体（即用户名）或权限（即角色）。在 MyBank\
  \ 应用程序中，`ACL_SID` 表包含了 `admin`、`cust1` 和 `cust2` 用户名，所示：\n\n![图 14-10 ACL_SID 表](img/00079.jpeg)![](img/00080.jpeg)\n\
  \n#### 表列描述\n\n- `id` – 包含主键\n- `principal` – 指定 `sid` 列存储的是角色还是用户名。值 `true` 表示\
  \ `sid` 列存储用户名；值 `false` 表示 `sid` 列存储角色。\n- `sid` – 包含用户名或角色\n\n### ACL_OBJECT_IDENTITY\
  \ 表\n\n`ACL_OBJECT_IDENTITY` 表包含了我们想要保护的领域对象的标识标识符。在 MyBank 应用程序中，`ACL_OBJECT_IDENTITY`\
  \ 表包含了存储在 `FIXED_DEPOSIT_DETAILS` 表中的定期存款的标识，所示：\n\n![](img/00081.jpeg)\n\n**图 14-11**\
  \ `ACL_OBJECT_IDENTITY` 表\n\n在上面的图中，`object_id_identity` 列包含了存储在 `FIXED_DEPOSIT_DETAILS`\
  \ 表中的定期存款的标识。\n\n#### 表列描述\n\n- `id` – 包含主键\n- `object_id_class` – 指向 `ACL_CLASS`\
  \ 表中定义的领域类\n- `object_id_identity` – 指向 `FIXED_DEPOSIT_DETAILS` 表中的领域对象实例\n- `parent_object`\
  \ – 如果由 `object_id_identity` 列引用的领域对象存在父对象，则此列指向父对象的标识\n- `owner_sid` – 指向拥有该领域对象实例的用户或角色\n\
  - `entries_inheriting` – 标记，指示该对象是否继承了来自任何父 ACL 条目\n\n### ACL_ENTRY 表\n\n`ACL_ENTRY`\
  \ 表包含了分配给领域对象上的用户权限（读、写、创建等）。在 MyBank 应用程序中，`ACL_ENTRY` 表包含了分配给存储在 `FIXED_DEPOSIT_DETAILS`\
  \ 表中的定期存款的用户权限，所示：\n\n![](img/00082.jpeg)\n\n**图 14-12** `ACL_ENTRY` 表\n\n在上面的图中，`acl_object_identity`、`mask`\
  \ 和 `sid` 列决定了分配给用户（或角色）的领域对象实例的权限。你应该注意，`ACL_ENTRY` 表中的条目通常被称为 ACE（访问控制项）。\n\n\
  #### 表列描述\n\n- `id` – 包含主键\n- `acl_object_identity` – 指向 `ACL_OBJECT_IDENTITY` 表的\
  \ `id` 列，反过来标识该领域对象实例\n- `ace_order` – 指定访问控制项的顺序\n- `sid` – 指向 `ACL_SID` 表的 `id`\
  \ 列，反过来标识该用户（或角色）\n- `mask` – 指定分配给用户（或角色）的权限（读、写、创建等）。`1` 表示读，`2` 表示写，`8` 表示删除，`16`\
  \ 表示管理权限。\n- `granting` – 标记，指示 `mask` 列中的条目是标识授予访问还是拒绝访问。例如，如果 `mask` 列的值为 `1`\
  \ 且 `granting` 列为 `true`，意味着相应的 `SID` 具有读取权限。但如果 `mask` 列的值为 `1` 且 `granting` 列为\
  \ `false`，则意味着相应的 `SID` 没有读取权限。\n- `audit_success` – 标记，指示是否审计成功的权限。在本章稍后的部分，我们将看到\
  \ Spring Security 的 `ConsoleAuditLogger` 可用于记录成功的权限。\n- `audit_failure` - 标记，指示是否审计失败的权限。\n\
  \n如前面所述，图 14-13 描绘了 ACL 表之间的关系。图中的箭头表示来自表的外键引用。例如，`ACL_OBJECT_IDENTITY` 表包含了指向 `ACL_CLASS`、`ACL_SID`\
  \ 和 `FIXED_DEPOSIT_DETAILS` 表的外键。\n\n![](img/00083.jpeg)\n\n**图 14-13** ACL 表及其关系。箭头表示来自表的外键引用。\n\
  \n现在我们已经查看了存储 ACL 信息所需的 ACL 表，现在让我们查看存储用户和角色信息的 Spring Security 表。\n\n### USERS\
  \ 表\n\n`USERS` 表存储了用户的凭据，所示：\n\n![](img/00084.jpeg)\n\n**图 14-14** USERS 表\n\n####\
  \ 表列描述\n\n- `username` – 用户名\n- `password` – 用户密码\n- `enabled` – 标记，指示用户是否被启用或禁用\n\
  \n### AUTHORITIES 表\n\n`AUTHORITIES` 表包含了分配给 `USERS` 表定义的每个用户的角色。\n\n#### 表列描述\n\
  \n- `username` – 用户名\n- `authority` – 分配给用户的角色\n\n![](img/00085.jpeg)\n\n**图 14-15**\
  \ AUTHORITIES 表\n\n## 用户认证\n\n现在让我们查看 MyBank 应用程序中如何对用户进行验证。\n\nMyBank 应用程序显式配置了\
  \ `UserDetailsService` 以从 `USERS` 和 `AUTHORITIES` 数据库表加载用户详情，如下列表所示：\n\n**示例列表 14-8**\
  \ – `applicationContext-security.xml`\n\n**项目** – `ch14-bankapp-db-security`\n\n\
  **源位置** - `src/main/resources/META-INF/spring`\n\n\n\n\n在上面的示例列表中，`<authentication-provider>`\
  \ 元素的 `user-service-ref` 属性指向 `UserDetailsService` 的实现，该实现负责根据提供的用户名加载用户（及其权限）详情。`JdbcDaoImpl`\
  \ 是 `UserDetailsService` 的一种实现，它使用 JDBC 查询从数据源（由 `dataSource` 属性指定）加载用户（及其权限）详情。请参考\
  \ `ch14-bankapp-db-security` 项目的 `applicationContext.xml` 文件查看 `dataSource` bean\
  \ 的定义。默认情况下，`JdbcDaoImpl` 从 `USERS` 表（参见图 14-14）加载用户详情，并从 `AUTHORITIES` 表（参见图 14-15）加载权限信息。如果你已经有了包含用户和权限信息的自定义数据库表，可以设置\
  \ `JdbcDaoImpl` 的 `usersByUsernameQuery` 和 `authoritiesByUsernameQuery` 属性，从这些自定义表中检索用户详情及其权限。\n\
  \n`usersByUsernameQuery` 属性指定了根据给定用户名检索用户详情 SQL 查询。如果用户详情存储在名为 `MY_USERS` 且包含 `USERNAME`\
  \ 和 `PASSWORD` 列的表中，你可以将以下 SQL 查询设置为 `usersByUsernameQuery` 属性的值以检索用户详情：\n\n```sql\n\
  select USERNAME, PASSWORD, ‘true’ as ENABLED from MY_USERS where USERNAME = ?\n\
  ```\n\n你应该注意，SQL 查询返回的列必须是 `USERNAME`、`PASSWORD` 和 `ENABLED`。如果你的数据库表中不存在特定列（例如\
  \ `ENABLED`），则为该列返回一个默认值（如‘true’）。\n\n`authoritiesByUsernameQuery` 属性指定了根据给定用户名检索权限的\
  \ SQL 查询。如果权限详情存储在名为 `MY_ AUTHORITIES` 且包含 `USER` 和 `ROLE` 列的表中，你可以将以下 SQL 查询设置为\
  \ `authoritiesByUsernameQuery` 属性的值以检索权限：\n\n```sql\nselect USER AS USERNAME, ROLE\
  \ AS AUTHORITY from MY_AUTHORITIES where USER = ?\n```\n\n你应该注意，SQL 查询返回的列必须是 `USERNAME`\
  \ 和 `AUTHORITY`。\n\n如果你的应用程序在数据库中存储了加密后的密码，可以使用 `<authentication-provider>` 元素的子元素\
  \ `<password-encoder>` 来指定用于的密码编码器（Spring `PasswordEncoder` 接口的实现），用于将提交的密码转换为其编码形式。`BCryptPasswordEncoder`\
  \ 是 `PasswordEncoder` 的具体实现，它使用了 BCrypt 哈希算法（[`en.wikipedia.org/wiki/Bcrypt`](http://en.wikipedia.org/wiki/Bcrypt)）。`DaoAuthenticationProvider`\
  \ 使用配置的密码编码器对提交的密码进行编码，并将其与 `UserDetailsService` 加载的密码进行比较。\n\n现在来看 MyBank Web 应用中的请求安全配置。\n\
  \n### Web 请求安全\n\n下面的示例列表显示了如何为 MyBank Web 应用配置 Web 请求安全：\n\n**示例列表 14-9** – applicationContext-security.xml\
  \ – web 安全配置\n\n**项目** – ch14-bankapp-db-security\n\n**源位置**- src/main/resources/META-INF/spring\n\
  \n```xml\n<http use-expressions=\"true\">\n    <access-denied-handler error-page=\"\
  /access-denied\" />\n    <intercept-url pattern=\"/fixedDeposit/*\" access=\"hasAnyRole('ROLE_CUSTOMER',\
  \ 'ROLE_ADMIN')\" />\n    <form-login login-page=\"/login\" authentication-failure-handler-ref=\"\
  authFailureHandler\" />\n    <logout />\n    ....\n</http>\n\n<beans:bean id=\"\
  authFailureHandler\" class=\"sample.spring.chapter14.security.MyAuthFailureHandler\"\
  \ />\n```\n\n如果你将上述 Web 请求安全配置与我们在 `ch14-bankapp-simple-security` 项目中看到的（参见示例列表\
  \ 14-2）相比，你会发现我们添加了一些额外的配置信息。\n\n`<access-denied-handler>` 元素的 `error-page` 属性指定了错误页面（参见\
  \ scr/main/webapp/WEB-INF/jsp/access-denied.jsp 页面），当认证用户尝试访问未授权的 Web 页面时将重定向到该页面。`<form-login>`\
  \ 元素的 `login-page` 属性指定了渲染登录页面的 URL。`/login` 映射到 `LoginController`（参见 `ch14-bankapp-db-security`\
  \ 项目中的 `LoginController` 类），该类渲染登录页面（参见 scr/main/webapp/WEB-INF/jsp/login.jsp 页面）。`authentication-failure-handler-ref`\
  \ 属性指向处理身份验证失败的 `AuthenticationFailureHandler` bean。如上面的示例所示，`MyAuthFailureHandler`（`AuthenticationFailureHandler`\
  \ 的实现）负责处理 MyBank Web 应用中的身份验证失败。接下来的示例显示了 `MyAuthFailureHandler` 类的实现：\n\n**示例列表\
  \ 14-10** – MyAuthFailureHandler 类\n\n**项目** – ch14-bankapp-db-security\n\n**源位置**-\
  \ src/main/java/sample/spring/chatper14/security\n\n```java\npackage sample.spring.chapter14.security;\n\
  \n.....\n\nimport org.springframework.security.core.AuthenticationException;\nimport\
  \ org.springframework.security.web.authentication.AuthenticationFailureHandler;\n\
  \npublic class MyAuthFailureHandler implements AuthenticationFailureHandler {\n\n\
  \    @Override\n    public void onAuthenticationFailure(HttpServletRequest request,\n\
  \             HttpServletResponse response, AuthenticationException exception)\n\
  \             throws IOException, ServletException {\n        request.setAttribute(\"\
  exceptionMsg\", exception.getMessage());\n        response.sendRedirect(request.getContextPath()\
  \ + \"/login?exceptionMsg=\" +\n             exception.getMessage());\n    }\n}\n\
  ```\n\n`AuthenticationFailureHandler` 接口定义了身份验证失败时调用的 `onAuthenticationFailure`\
  \ 方法。该方法接受一个表示身份验证失败的 `AuthenticationException` 实例。在上面的示例列表中，`onAuthenticationFailure`\
  \ 将用户重定向到登录页面并将异常作为查询参数传递。如果你在 MyBank Web 应用的登录页面输入错误的凭据（或禁用用户的凭据），你会注意到 `MyAuthFailureHandler`\
  \ 的 `onAuthenticationFailure` 方法被调用。例如，如果你输入错误的凭据，你会看到消息“Bad credentials”。\n\n现在来看\
  \ MyBank 应用中特定的 ACL 配置。\n\n### JdbcMutableAclService 配置\n\n由于 ACL 权限存储在数据库表中，MyBank\
  \ 应用使用 Spring 的 `JdbcMutableAclService` 对表中的 ACL 执行 CRUD（**C**创建、**R**读、**U**更新、**D**删除）操作。下面的示例列表显示了\
  \ `JdbcMutableAclService` 的配置：\n\n**示例列表 14-11** – applicationContext-security.xml\
  \ – JdbcMutableAclService 配置\n\n**项目** – ch14-bankapp-db-security\n\n**源位置**- src/main/resources/META-INF/spring\n\
  \n```xml\n<beans:bean id=\"aclService\" class=\"org.springframework.security.acls.jdbc.JdbcMutableAclService\"\
  >\n    <beans:constructor-arg ref=\"dataSource\" />\n    <beans:constructor-arg\
  \ ref=\"lookupStrategy\" />\n    <beans:constructor-arg ref=\"aclCache\" />\n</beans:bean>\n\
  ```\n\n上面的示例列表显示 `dataSource`、`lookupStrategy` 和 `aclCache` bean 的引用被传递给 `JdbcMutableAclService`\
  \ 的构造函数。现在来看 `JdbcMutableAclService` 的依赖项（`dataSource`、`lookupStrategy` 和 `aclCache`）是如何配置的。\n\
  \n`dataSource` bean 标识持有 ACL 表的 `javax.sql.DataSource`（更多详情参见 `applicationContext.xml`\
  \ 文件中的 `dataSource` bean 定义）。\n\n`lookupStrategy` bean 代表 Spring `LookupStrategy`\
  \ 接口的实现，负责查找 ACL 信息。接下来的示例列表显示了 `lookupStrategy` bean 的定义：\n\n\n\n\n# 示例列表 14-12\
  \ – applicationContext-security.xml – LookupStrategy 配置\n\n**项目** – `ch14-bankapp-db-security`\n\
  \n**源位置** - `src/main/resources/META-INF/spring`\n\n```xml\n<beans:bean id=\"lookupStrategy\"\
  \ class=\"org.springframework.security.acls.jdbc.BasicLookupStrategy\">\n    <beans:constructor-arg\
  \ ref=\"dataSource\" />\n    <beans:constructor-arg ref=\"aclCache\" />\n    <beans:constructor-arg>\n\
  \        <beans:bean class=\"org.springframework.security.acls.domain.AclAuthorizationStrategyImpl\"\
  >\n            <beans:constructor-arg>\n                <beans:bean class=\"org.springframework.security.core.authority.SimpleGrantedAuthority\"\
  >\n                    <beans:constructor-arg value=\"ROLE_ADMIN\" />\n        \
  \        </beans:bean>\n            </beans:constructor-arg>\n        </beans:bean>\n\
  \    </beans:constructor-arg>\n     <beans:constructor-arg>\n        <beans:bean\
  \ class=\"org.springframework.security.acls.domain.DefaultPermissionGrantingStrategy\"\
  >\n            <beans:constructor-arg>\n                <beans:bean class=\"org.springframework.security.acls.domain.ConsoleAuditLogger\"\
  \ />\n            </beans:constructor-arg>\n        </beans:bean>\n    </beans:constructor-arg>\n\
  </beans:bean>\n```\n\n在上面的示例列表中，Spring 的 `BasicLookupStrategy`（`LookupStrategy`\
  \ 接口的实现类）使用 JDBC 查询从标准 ACL 表（`ACL_CLASS`、`ACL_ENTRY`、`ACL_SID` 和 `ACL_OBJECT_IDENTITY`）获取\
  \ ACL 详情。如果 ACL 信息存储在自定义数据库表中，则您可以通过设置 `BasicLookupStrategy` 的 `selectClause`、`lookupPrimaryKeysWhereClause`、`lookupObjectIdentitiesWhereClause`\
  \ 和 `orderByClause` 属性来自定义 JDBC 查询。有关这些属性的更多信息，请参考 Spring Security 的 API 文档。\n\n\
  `BasicLookupStrategy` 的构造函数接受类型为 `DataSource`（代表包含 ACL 表的数据库）、`AclCache`（代表 ACL\
  \ 缓存层）、`AclAuthorizationStrategy`（代表确定 `SID` 是否有对领域对象实例的 ACL 条目执行管理操作的策略）以及 `PermissionGrantingStrategy`（根据分配给\
  \ `SID` 的权限授予或拒绝对受保护对象的访问的策略）。\n\n在上面的示例列表中，`AclAuthorizationStrategyImpl` 类实现了\
  \ `AclAuthorizationStrategy`。`AclAuthorizationStrategyImpl` 的构造函数接受 `GrantedAuthority`\
  \ 实例，该实例指定了可以对领域对象实例的 ACL 条目（由 `MutableAcl` 类型的对象表示）执行管理操作（如更改 ACL 条目的所有权）的角色。在上面的示例列表中，将\
  \ `ROLE_ADMIN` 角色传递给 `AclAuthorizationStrategyImpl`，这意味着拥有 `ROLE_ADMIN` 角色的用户可以对\
  \ ACL 条目执行管理操作。在本章节后面我们将看到 `AclAuthorizationStrategy` 如何保护 `MutableAcl` 实例免受未经授权的修改。\n\
  \n在上面的示例列表中，`DefaultPermissionGrantingStrategy` 实现了 `PermissionGrantingStrategy`。`DefaultPermissionGrantingStrategy`\
  \ 的构造函数接受 `AuditLogger` 实例，该日志记录 `ACL_ENTRY` 表中 ACL 条目权限授予的成功和或失败。在上面的示例列表中，`ConsoleAuditLogger`（`AuditLogger`\
  \ 的实现类，向控制台上写入）如果 `audit_success` 列的值设置为 true（即 1），则记录成功的权限；如果 `audit_failure` 列的值设置为\
  \ true（即 1），则记录失败的权限。例如，以下消息显示了 `ConsoleAuditLogger` 在成功授予 ACL 条目权限时的输出内容：\n\n```\n\
  GRANTED due to ACE: AccessControlEntryImpl[id: 1037; granting: true; sid: PrincipalSid[cust1];\
  \ permission: BasePermission[...............................R=1]; auditSuccess:\
  \ true; auditFailure: true]\n```\n\n`BasicLookupStrategy` 接受 `AclCache` 对象实例（由示例列表\
  \ 14-12 中的 `aclCache` bean 表示），它代表缓存。\n\n# 示例列表 14-13 – applicationContext-security.xml\
  \ – 缓存配置\n\n**项目** – `ch14-bankapp-db-security`\n\n```xml\n<beans:bean id=\"aclCache\"\
  \ class=\"org.springframework.security.acls.persistence.MemoryBasedAclCache\">\n\
  \    <beans:constructor-arg>\n        <beans:bean class=\"org.springframework.cache.support.SimpleCacheFactoryBean\"\
  >\n            <beans:property name=\"cacheName\" value=\"acl\" />\n        </beans:bean>\n\
  \    </beans:constructor-arg>\n    <beans:property name=\"cacheManager\" ref=\"\
  org.springframework.cache.CacheManager\" />\n</beans:bean>\n```\n\n`MemoryBasedAclCache`\
  \ 是 `AclCache` 的实现类。`SimpleCacheFactoryBean` 创建 `org.springframework.cache.CacheManager`\
  \ 实例来管理缓存。`SimpleCacheFactoryBean` 的 `cacheName` 属性引用缓存中要创建的区域。\n\n现在，我们已经配置了 `JdbcAclService`\
  \ 来对 ACL 执行 CRUD 操作，让我们来看看使用 ACL 进行权限验证目的的方法级配置。\n\n# 示例列表 14-14 – applicationContext-security.xml\
  \ – 方法级安全\n\n**项目** – `ch14-bankapp-db-security`\n\n```xml\n<global-method-security\
  \ pre-annotations=\"enabled\">\n    <expression-handler ref=\"expressionHandler\"\
  \ />\n</global-method-security>\n```\n\n`<global-method-security>` 元素的 `pre-annotations`\
  \ 属性设置为 `enabled`，这将启用 `@PreAuthorize`（在本章前面介绍）、`@PostAuthorize`、`@PostFilter` 和\
  \ `@PostAuthorize` 注解。在上面的示例列表中，`<expression-handler>` 引用了配置 `SecurityExpressionHandler`\
  \ 的 `expressionHandler` bean。\n\n\n\n\n\n在上面的示例代码列表中，`permissionEvaluator` 属性引用\
  \ `AclPermissionEvaluator` 实例，该实例使用 ACL 来评估安全表达式。`permissionCacheOptimizer` 属性引用\
  \ `AclPermissionCacheOptimizer` 实例，该实例通过批量加载 ACL 来优化性能。\n\n现在让我们来看看在 MyBank Web\
  \ 应用程序中是如何实现领域对象实例安全性的。\n\n#### 领域对象实例安全\n\n我们之前看到过，`@PreAuthorize` 注解在方法上指定了基于角色的安全约束。如果标记了\
  \ `@PreAuthorize` 的方法接受领域对象实例作为参数，则 `@PreAuthorize` 注解可以指定认证用户调用该方法时对该领域对象实例所需的\
  \ ACL 权限。下面的示例列表显示了指定 ACL 权限的 `@PreAuthorize` 注解：\n\n**示例 14-16** – `FixedDepositService`\
  \ 接口 – 带有 ACL 权限的 `@PreAuthorize` 注解\n\n**Project** – `ch14-bankapp-db-security`\n\
  \n**Source location**- `src/main/java/sample/spring/chatper14/service`\n\n```java\n\
  package sample.spring.chapter14.service;\n\nimport org.springframework.security.access.prepost.PreAuthorize;\n\
  import sample.spring.chapter14.domain.FixedDepositDetails;\n\n.....\n\npublic interface\
  \ FixedDepositService {\n\n    .....\n\n    @PreAuthorize(\"hasPermission(#fixedDepositDetails,\
  \ write)\")\n    void editFixedDeposit(FixedDepositDetails fixedDepositDetails);\n\
  }\n```\n\n在上面的示例代码列表中，`FixedDepositService` 的 `editFixedDeposit` 方法接受 `FixedDepositDetails`\
  \ 实例。在 `hasPermission` 表达式中，`#fixedDepositDetails` 代表引用传递给 `editFixedDeposit` 方法的\
  \ `FixedDepositDetails` 实例表达式变量。如果认证用户对传递给 `editFixedDeposit` 方法的 `FixedDepositDetails`\
  \ 实例具有 `write` 权限，则 `hasPermission` 表达式为 `true`。在运行时，`hasPermission` 表达式由配置的 `AclPermissionEvaluator`\
  \ 评估（参见示例 14-15）。如果 `hasPermission` 为 `true`，则调用 `editFixedDeposit` 方法。\n\n如果方法接受领域对象\
  \ `identifier`（而不是实际的领域对象实例）作为参数，你仍然可以指定适用于该标识符所引领域对象实例的 ACL 权限。下面的示例显示了 `provideAccessToAdmin`\
  \ 方法，它接受 `fixedDepositId`（唯一标识 `FixedDepositDetails` 实例）作为参数：\n\n**示例 14-17** –\
  \ `FixedDepositService` 接口 – `@PreAuthorize` 注解用法\n\n**Project** – `ch14-bankapp-db-security`\n\
  \n**Source location**- `src/main/java/sample/spring/chatper14/service`\n\n```java\n\
  package sample.spring.chapter14.service;\n\nimport org.springframework.security.access.prepost.PreAuthorize;\n\
  \n.....\n\npublic interface FixedDepositService {\n\n    .....\n\n    @PreAuthorize(\"\
  hasPermission(#fixedDepositId,\n                  'sample.spring.chapter14.domain.FixedDepositDetails',\
  \ write)\")\n    void provideAccessToAdmin(int fixedDepositId);\n}\n```\n\n在上面的示例代码列表中，`#fixedDepositId`\
  \ 表达式变量引用传递给 `provideAccessToAdmin` 方法的 `fixedDepositId` 参数。由于 `fixedDepositId`\
  \ 参数标识了一个 `FixedDepositDetails` 对象的实例，因此 `FixedDepositDetails` 类的全限定名被指定 `hasPermission`\
  \ 表达式的第二个参数。如果认证用户对传递给 `provideAccessToAdmin` 方法的 `fixedDepositId` 参数所标识的 `FixedDepositDetails`\
  \ 实例具有 `write` 权限，则 `hasPermission(#fixedDepositId, 'sample.spring.chapter14.domain.FixedDepositDetails',\
  \ write)` true 为 `true`。\n\n还可以组合多个安全表达式以形成更复杂的安全表达式，如下示例所示：\n\n**示例 14-18** – `FixedDepositService`\
  \ 接口 – `@PreAuthorize` 注解用法\n\n**Project** – `ch14-bankapp-db-security`\n\n**Source\
  \ location**- `src/main/java/sample/spring/chatper14/service`\n\n```java\npackage\
  \ sample.spring.chapter14.service;\n\nimport org.springframework.security.access.prepost.PreAuthorize;\n\
  \n.....\n\npublic interface FixedDepositService {\n\n    .....\n\n    @PreAuthorize(\"\
  hasPermission(#fixedDepositId,\n                  'sample.spring.chapter14.domain.FixedDepositDetails',\
  \ read) or \"\n                  + \"hasPermission(#fixedDepositId,\n          \
  \        'sample.spring.chapter14.domain.FixedDepositDetails', admin)\")\n    FixedDepositDetails\
  \ getFixedDeposit(int fixedDepositId);\n\n    .....\n}\n```\n\n在上面的示例代码列表中，两个 `hasPermission`\
  \ 表达式使用 `or` 运算符组合形成了一个更复杂的安全表达式。只有当认证用户对由 `fixedDepositId` 参数标识的 `FixedDepositDetails`\
  \ 实例具有 `read` 或 `admin` 权限时，才会调用 `getFixedDeposit` 方法。\n\n如果方法返回领域领域对象实例列表，可以使用\
  \ `@PostFilter` 注解来过滤结果。下面的示例显示了 `@PostFilter` 注解的用法：\n\n**示例 14-19** – `FixedDepositService`\
  \ 接口 – `@PostFilter` 注解用法\n\n**Project** – `ch14-bankapp-db-security`\n\n**Source\
  \ location**- `src/main/java/sample/spring/chatper14/service`\n\n```java\npackage\
  \ sample.spring.chapter14.service;\n\nimport org.springframework.security.access.prepost.PostFilter;\n\
  \n.....\n\npublic interface FixedDepositService {\n\n    .....\n\n    @PreAuthorize(\"\
  hasRole('ROLE_ADMIN')\")\n    @PostFilter(\"hasPermission(filterObject, read) or\
  \ hasPermission(filterObject, admin)\")\n    List<FixedDepositDetails> getAllDeposits();\n\
  \n    .....\n}\n```\n\n与 `@PreAuthorize` 注解一样，`@PostFilter` 指定了一个安全表达式。如果方法标记了 `@PostFilter`，Spring\
  \ Security 会遍历方法返回集合，并移除指定安全表达式返回 `false` 的元素。在上面的示例代码列表中，Spring Security 会遍历 `getAllDeposits`\
  \ 方法返回的 `FixedDepositDetails` 实例集合，并移除认证用户没有 `read` 或 `admin` 权限的实例。`@PostFilter`\
  \ 注解中 `hasPermission` 表达式中的 `filterObject` 引用集合中的当前对象。注意 `getAllDeposits` 方法还标记了\
  \ `@PreAuthorize` 注解，这意味着只有当认证用户具有 `ROLE_ADMIN` 时，才会调用 `getAllDeposits` 方法。\n\n\
  ### 程序化管理 ACL 条目\n\n你可以通过使用在应用程序上下文 XML 文件配置的 `JdbcMutableAclService` 来程序化管理 ACL\
  \ 条目（参见示例 14-11）。\n\n\n\n\n当客户创建一个新的定期存款时，新创建的定期存款的读写权限将授予该客户。当客户点击对应定期存款的“向管理员提供访问”链接时，MyBank\
  \ Web 应用程序将该定期存款的读取、管理和删除权限授予管理员用户。\n\n下面的示例列表显示了 `FixedDepositServiceImpl` 的 `provideAccessToAdmin`\
  \ 方法，该方法在点击“向管理员提供访问”链接时被调用：\n\n**示例列表 14-20** – `FixedDepositServiceImpl` 类 – 添加\
  \ ACL 权限\n\n**Project** – `ch14-bankapp-db-security`\n\n**源码位置**- `src/main/java/sample/spring/chatper14/service`\n\
  \n```java\npackage sample.spring.chapter14.service;\n\nimport org.springframework.security.acls.domain.*;\n\
  \nimport org.springframework.security.acls.model.*;\n\n.....\n\n@Service\npublic\
  \ class FixedDepositServiceImpl implements FixedDepositService {\n\n    .....\n\n\
  \    @Autowired\n    private MutableAclService mutableAclService;\n\n    @Override\n\
  \    public void provideAccessToAdmin(int fixedDepositId) {\n        addPermission(fixedDepositId,\
  \ new PrincipalSid(\"admin\"), BasePermission.READ);\n        addPermission(fixedDepositId,\
  \ new PrincipalSid(\"admin\"), BasePermission.ADMINISTRATION);\n        addPermission(fixedDepositId,\
  \ new PrincipalSid(\"admin\"), BasePermission.DELETE);\n    }\n\n    private void\
  \ addPermission(long fixedDepositId, Sid recipient, Permission permission) { …..\
  \ }\n}\n```\n\n在上面的示例列表中，`provideAccessToAdmin` 方法使用 `addPermission` 方法向管理员用户授予读取、管理和删除权限。以下是传递给\
  \ `addPermission` 方法的参数：\n\n- `fixedDepositId` – 唯一标识我们想要其授予权限的 `FixedDepositDetails`\
  \ 实例。\n- `PrincipalSid` 对象 - 代表我们想要其授予权限的 SID（即用户或角色）。`PrincipalSid` 类实现了 Spring\
  \ Security 的 `Sid` 接口。\n- 授予的 `permission`（权限的权限）- `BasePermission` 类定义了一些常量，如 `READ`、`ADMINISTRATION`、`DELETE`\
  \ 等，代表了我们可以授予 `PrincipalSid` 的标准权限。`BasePermission` 类实现了 Spring Security 的 `Permission`\
  \ 接口。\n\n下面的示例列表显示了 `addPermission` 方法的实现：\n\n**示例列表 14-21** – `FixedDepositServiceImpl`\
  \ 类 – 添加 ACL 权限\n\n**Project** – `ch14-bankapp-db-security`\n\n**源码位置**- `src/main/java/sample/spring/chatper14/service`\n\
  \n```java\npackage sample.spring.chapter14.service;\n\nimport org.springframework.security.acls.domain.*;\n\
  \nimport org.springframework.security.acls.model.*;\n\n.....\n\n@Service\npublic\
  \ class FixedDepositServiceImpl implements FixedDepositService {\n\n    .....\n\n\
  \    @Autowired\n    private MutableAclService mutableAclService;\n\n    .....\n\
  \n    private void addPermission(long fixedDepositId, Sid recipient, Permission\
  \ permission) {\n        MutableAcl acl;\n        ObjectIdentity oid = new ObjectIdentityImpl(FixedDepositDetails.class,\
  \ fixedDepositId);\n        try {\n            acl = (MutableAcl) mutableAclService.readAclById(oid);\n\
  \        } catch (NotFoundException nfe) {\n            acl = mutableAclService.createAcl(oid);\n\
  \        }\n        acl.insertAce(acl.getEntries().size(), permission, recipient,\
  \ true);\n        mutableAclService.updateAcl(acl);\n    }\n\n    .....\n}\n```\n\
  \n由于 `JdbcMutableAclService` 类实现了 `MutableAclService` 接口，`JdbcMutableAclService`\
  \ 实例被自动注入到 `FixedDepositServiceImpl` 类中。\n\n为了授予权限，`addPermission` 方法遵循以下步骤：\n\n\
  1) 声明一个 `MutableAcl` 类型的对象。`MutableAcl` 对象代表领域对象实例的 ACL 条目。`MutableAcl` 定义了你可以用于修改\
  \ ACL 条目的方法。\n2) 通过通过将领域对象类型（即 `FixedDepositDetails.class`）和标识（即 `fixedDepositId`）作为构造函数的参数，创建一个\
  \ `ObjectIdentityImpl` 实例。\n3) 通过调用 `MutableAclService` 的 `readAclById` 方法获取领域对象实例的\
  \ ACL 条目。如果未找到 ACL 条目，`readAclById` 方法将抛出 `NotFoundException`。\n    - 如果抛出 `NotFoundException`，则使用\
  \ `MutableAclService` 的 `createAcl` 方法创建一个空的 `MutableAcl` 实例，该实例不包含任何 ACL 条目。这等同于在\
  \ ACL_OBJECT 中创建一个条目。\n4) 使用 `insertAce` 方法将 ACL 条目添加到 `MutableAcl` 实例中。添加到 `MutableAcl`\
  \ 的 ACL 条目最终会被持久化到 ACL_ENTRY 表。传递给 `insertAce` 的参数是：添加 ACL 条目的索引、要添加的权限、要授予权限的 SID，以及指示\
  \ ACL 条目是用于授予还是拒绝的标志（对应 GRANT）。\n5) 使用 `MutableAclService` 的 `updateAcl` 方法持久化对\
  \ `MutableAcl` 实例的更改。\n\n下面的示例列表显示了 `FixedDepositServiceImpl` 的 `closeFixedDeposit`\
  \ 方法，该方法在管理员用户点击“关闭”链接关闭定期存款时被调用：\n\n**示例列表 14-22** – `FixedDepositServiceImpl`\
  \ 类 – 移除 ACL\n\n**Project** – `ch14-bankapp-db-security`\n\n**源码位置**- `src/main/java/sample/spring/chatper14/service`\n\
  \n```java\npackage sample.spring.chapter14.service;\n\nimport org.springframework.security.acls.domain.ObjectIdentityImpl;\n\
  import org.springframework.security.acls.model.MutableAclService;\nimport org.springframework.security.acls.model.ObjectIdentity;\n\
  .....\n\n@Service\npublic class FixedDepositServiceImpl implements FixedDepositService\
  \ {\n\n    .....\n\n    @Autowired\n    private MutableAclService mutableAclService;\n\
  \n    .....\n\n    @Override\n    public void closeFixedDeposit(int fixedDepositId)\
  \ {\n        fixedDepositDao.closeFixedDeposit(fixedDepositId);\n        ObjectIdentity\
  \ oid = new ObjectIdentityImpl(FixedDepositDetails.class, fixedDepositId);\n   \
  \     mutableAclService.deleteAcl(oid, false);\n    }\n\n    .....\n}\n```\n\n在上面的示例列表中，`MutableAclService`\
  \ 的 `deleteAcl` 方法用于删除由 `ObjectIdentity` 实例标识的定期存款的 ACL 条目。例如，如果 `fixedDepositId`\
  \ 为 101，`deleteAcl` 方法从 ACL_ENTRY 和 ACL_OBJECT_IDENTITY 表中删除定期存款 101 的所有 ACL 条目。\n\
  \n### MutableAcl 与安全\n\nSpring Security 的 `MutableAcl` 接口定义了修改领域对象实例 ACL 条目的方法。我们看到\
  \ MyBank Web 应用程序使用 `MutableAcl` 的 `insertAce` 方法为领域对象实例添加 ACL 条目（参见示例 14-21）。我们提供的\
  \ `BasicLookupStrategy`（参见示例 14-12）的 `AclAuthorizationStrategyImpl` 实例在后台运行，以确保认证用户具有修改\
  \ ACL 条目的适当权限。\n\n如果满足以下任意条件，认证用户就可以修改领域对象实例的 ACL 条目：\n\n- 如果认证用户拥有该领域对象实例，则该用户可以修改该领域对象实例的\
  \ ACL 条目\n- 如果认证用户持有传递给 `AclAuthorizationStrategyImpl` 构造函数的权限。在示例 14-12 中，`ROLE_ADMIN`\
  \ 角色被传递给 `AclAuthorizationStrategyImpl` 的构造函数；因此，拥有 `ROLE_ADMIN` 角色的用户可以对任何领域对象实例的\
  \ ACL 条目进行更改\n- 如果认证用户对该领域对象实例拥有 `BasePermission` 的 `ADMINISTRATION` 权限。\n\n## 14-5\
  \ 总结\n\n\n\n\n\n在本章中，我们学习了如何使用 Spring Security 框架来保护 Spring 应用程序。我们研究了如何整合 Web 请求安全、方法级安全以及领域对象实例安全。\n\
  \n# 附录 A – 在 Eclipse IDE（或 IntelliJ IDEA）中导入和部署示例项目\n\n在本附录中，我们将介绍如何设置开发环境、将示例项目导入\
  \ Eclipse IDE（或 IntelliJ IDEA），并将其作为独立应用程序运行（如果示例项目代表一个独立的 Java 应用程序），或将其部署在 Tomcat\
  \ 7 服务器上（如果示例项目代表 Web 应用程序）。\n\n## A-1 设置开发环境\n\n在设置开发环境之前，您需要执行以下操作：\n\n- 下载并安装\
  \ `Eclipse IDE`（或 `IntelliJ IDEA`）—— 你可以从 [`www.eclipse.org/downloads`](http://www.eclipse.org/downloads)\
  \ 下载适用于 Java EE 开发人员的 Eclipse IDE。若要安装 Eclipse IDE，您只需要将下载的 ZIP 文件解压到目录中。\n- 下载并安装\
  \ `Tomcat 7` 服务器—— 你可以从 [`tomcat.apache.org/download-70.cgi`](http://tomcat.apache.org/download-70.cgi)\
  \ 下载 Tomcat 7 服务器。建议下载 ZIP 格式的 Tomcat 7 包，并将其解压到您的本地文件系统中。\n- 下载并安装 `Maven 3` 构建工具——\
  \ 你可以从 [`maven.apache.org/download.cgi`](http://maven.apache.org/download.cgi) 下载\
  \ Maven 3。若要安装 Maven，您只需要将下载的 ZIP 文件解压到目录中。Maven 用于将随书附的示例 Web 项目转换为 Eclipse IDE\
  \ 或 IntelliJ IDEA 项目。\n\n让我们来看如何将示例项目导入 Eclipse IDE。\n\n## A-2 将示例项目导入 Eclipse IDE（或\
  \ IntelliJ IDEA）\n\n建议您从以下 Google 代码 项目下载随书附的示例项目：\n\n[`code.google.com/p/getting-started-with-spring-framework-2edition/`](https://code.google.com/p/getting-started-with-spring-framework-2edition/)\n\
  \n本节的其余部分假设您已经在本地文件系统中创建了 `spring-samples` 目录，该目录包含了随书附的所有示例项目。\n\n若要成功导入示例项目，您需要执行以下操作：\n\
  \n- 将项目转换为 Eclipse IDE 或 IntelliJ IDEA 项目\n- 在 Eclipse IDE（或 IntelliJ IDEA）中配置 `M2_REPO`\
  \ 类路径变量。`M2_REPO` 变量指向包含项目依赖的 JAR 文件的本地 Maven 仓库。\n\n现在，让我们详细查看上述步骤。\n\n### 导入示例项目\n\
  \n每个示例项目都包含一个 `pom.xml` 文件，该文件包含了 Eclipse、IntelliJ IDEA 和 Tomcat Maven 插件的配置。Maven\
  \ 使用这些插件将示例项目转换为 Eclipse IDE 或 IntelliJ IDEA 项目，并将项目部署到嵌入的 Tomcat 7 实例上。您应该注意，Tomcat\
  \ Maven 插件 ([`tomcat.apache.org/maven-plugin.html`](http://tomcat.apache.org/maven-plugin.html))\
  \ 仅针对代表 Web 应用程序的示例项目配置。`pom.xml` 文件还指定了项目依赖的 JAR 文件（如 `spring-core`、`spring-beans`\
  \ 等）。\n\n要为示例项目创建 Eclipse IDE 或 IntelliJ IDEA 特定的配置文件，请遵循以下步骤：\n\n- 打开命令提示符，设置 `JAVA_HOME`\
  \ 环境变量指向 Java SDK 安装目录：\n```\nC:\\> set JAVA_HOME=C:\\Program Files\\Java\\jdk1.7.0_25\n\
  ```\n- 进入包含示例项目的目录：\n```\nC:\\> cd spring-samples\nC:\\spring-samples> cd ch01-bankapp-xml\n\
  C:\\spring-samples\\ch01-bankapp-xml>\n```\n- 将 Maven 安装路径下的 `bin` 目录路径添加到 `PATH`\
  \ 环境变量中：\n```\nC:\\spring-samples\\ch01-bankapp-xml> set path=%path%; C:\\apache-maven-3.0.4\\\
  bin\n```\n- 如果您想将示例项目导入 Eclipse IDE，执行 Maven Eclipse 插件 ([`maven.apache.org/plugins/maven-eclipse-plugin/`](http://maven.apache.org/plugins/maven-eclipse-plugin/))\
  \ 的 `eclipse:eclipse` 目标：\n```\nC:\\spring-samples\\ch01-bankapp-xml>mvn eclipse:eclipse\n\
  ```\n执行 `eclipse:eclipse` 目标会下载示例项目的依赖项，并为 Eclipse IDE 创建配置文件（如 `.classpath` 和 `.project`）。\n\
  \n**或者**\n\n- 如果您想将示例项目导入 IntelliJ IDEA，执行 Maven IDEA 插件 ([`maven.apache.org/plugins/maven-idea-plugin/`](http://maven.apache.org/plugins/maven-idea-plugin/))\
  \ 的 `idea:idea` 目标：\n```\nC:\\spring-web-mvc-samples\\ch01-xml-config>mvn idea:idea\n\
  ```\n执行 `idea:idea` 目标会下载示例项目的依赖项，并为 IntelliJ IDEA 创建配置文件（如 `.ipr`、`.iml` 和 `.iws`）。\n\
  \n**注意** 源码根目录下也提供了一个 `pom.xml` 文件，用于构建所有项目。您可以进入 `spring-samples` 目录并执行 `mvn eclipse:eclipse`（或\
  \ `mvn idea:idea`）命令将所有项目转换为 Eclipse IDE（或 IntelliJ IDEA）项目。\n\n现在，按照以下步骤将示例项目导入\
  \ Eclipse IDE：\n\n- 转到 File（文件） -> Import（导入）。\n- 从对话框中选择 General（常规）-> Existing\
  \ Projects into Workspace（现有项目导入工作区），并点击 Next（下一步）。\n- 从文件系统选择示例项目目录（例如 `ch01-bankapp-xml`），并点击\
  \ Finish（完成）。\n\n### 在 Eclipse IDE 中配置 M2_REPO 类路径变量\n\n当您执行 `eclipse:eclipse` 或\
  \ `idea:idea` 目标时，项目的依赖会被下载到 `<home-directory>/.m2/repository` 目录。在这里，`<home-directory>`\
  \ 是用户目录。在 Windows 上，这指的是 `C:\\Documents and Settings\\myusername\\.m2\\repository`\
  \ 目录。默认情况下，执行 `eclipse:eclipse` 目标生成的 `.classpath` 文件使用 `M2_REPO` 类路径变量引用项目的 JAR\
  \ 依赖。因此，您需要在 Eclipse IDE 中配置一个新的 `M2_REPO` 类路径变量，指向 `<home-directory>/.m2/repository`\
  \ 目录。\n\n要配置新的 `M2_REPO` 变量，请遵循以下步骤：\n\n- 转到 Window -> Preferences（首选项）。这将显示 Preferences\
  \ 对话框。\n- 在对话框中选择 Java -> Build Path -> Classpath Variables（类路径变量）以查看配置的类路径变量。\n\
  - 现在，点击 New（新建）按钮配置一个新的 `M2_REPO` 变量。重要重要的是，您将 M2_REPO 变量设置为 `<home-directory>/.m2/repository`。\n\
  \n现在，我们已成功将示例项目导入 Eclipse IDE 并设置了 `M2_REPO` 变量。如果项目代表一个独立应用程序，您可以按照以下步骤运行应用程序：\n\
  \n- 在 Eclipse IDE 的 Project Explorer（项目资源管理器）选项卡中，右键点击包含应用程序 main 方法的 Java 类。您现在将看到可以对所选\
  \ Java 类执行的操作列表。\n- 选择 Run As（运行）-> Java Application（Java 程序）。这将执行 Java 类的 main\
  \ 方法。\n\n## A-3 使用 Tomcat 7 服务器配置 Eclipse IDE\n\n您需要打开 Eclipse IDE 的 Servers（服务器）视图来配置\
