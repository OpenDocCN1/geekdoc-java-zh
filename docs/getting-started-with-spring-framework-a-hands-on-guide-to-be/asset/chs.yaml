  \ 获取两个不同的 `EventSender` 实例。如果你执行了 `BankApp` 的 `main` 方法，你将看到控制台上打印出以下消息：\n\n**Created\
  \ EventSenderFactoryBean**\n\nDependencyResolutionBeanPostProcessor 的 `postProcessBeforeInitialization`\
  \ 方法被调用用于.....EventSenderFactoryBean\n\nInstanceValidationBeanPostProcessor 的 `postProcessBeforeInitialization`\
