  \ 控制器（参见示例列表 10-3）。\n\n在本节中，我们看到了如何使用 Spring Web MVC 开发一个简单的“Hello World”Web 应用程序。现在，让我们仔细观察在\
  \ Spring Web MVC 应用程序中充当*前置控制器*的 `DispatcherServlet` servlet。\n\n## 10-4 DispatcherServlet\
  \ – 前置控制器\n\n在上一节中，我们看到 `DispatcherServlet` 充当*前置控制器*，通过与 Web 应用程序上下文 XML 文件定义的\
  \ `HandlerMapping` 和 `ViewResolver` bean 交互来处理请求。在本节中，我们将查看 `DispatcherServlet`\
  \ 在后台是如何工作的。\n\n(此处省略后续重复段落，以遵循“不要重复输出原文”原则)\n\n\n\n\n\n```java\nimport org.springframework.web.context.ServletContextAware;\n\
  \npublic class ABean implements ServletContextAware, ServletConfigAware {\n\n  private\
  \ ServletContext servletContext;\n\n  private ServletConfig servletConfig;\n\n \
  \   @Override\n  public void setServletContext(ServletContext servletContext) {\n\
  \        this.servletContext = servletContext;\n    }\n\n    @Override\n  public\
  \ void setServletConfig(ServletConfig servletConfig) {\n        this.servletConfig\
  \ = servletConfig;\n    }\n\n    public void doSomething() {\n        //--use ServletContext\
  \ and ServletConfig objects\n    }\n}\n```\n\n上面的示例列表显示 `ABean` 类实现了 `ServletContextAware`\
  \ 和 `ServletConfigAware` 接口。`ServletContextAware` 接口定义了一个 `setServletContext` 方法，该方法由\
  \ Spring 容器调用，为 `ABean` 实例提供 `ServletContext` 对象实例。`ServletConfigAware` 接口定义了一个\
  \ `setServletConfig` 方法，该方法由 Spring 容器调用，为 `ABean` 实例提供 `ServletConfig` 对象实例。\n\n\
  我们之前已经看到可以通过实现 `Controller` 接口来创建一个控制器。现在让我们来看看 `@Controller` 和 `@RequestMapping`\
  \ 注解，它们简化了控制器的开发。\n\n## 10-5 使用 `@Controller` 和 `@RequestMapping` 注解开发控制器\n\nSpring\
  \ Web MVC 提供了如 `MultiActionController`、`UrlFilenameViewController`、`AbstractController`\
  \ 等类，你可以扩展这些类来创建自己的控制器实现。如果你通过扩展 Spring 特定类或实现 Spring 特定接口来创建控制器，该控制器类将与 Spring\
  \ 紧耦合。Spring 2.5 引入了 `@Controller`、`@RequestMapping`、`@ModelAttribute` 等注解，允许你创建具有灵活方法名的控制器。在本节中，我们将介绍开发注解控制器的不同\
  \ Spring Web MVC 注解。\n\n让我们先来看一个使用注解控制器的 Hello World 应用程序，它用于显示“Hello World !!”消息。\n\
  \n**导入** `chapter 10/ch10-annotation-helloworld`（该项目展示了一个使用注解控制器显示“Hello World !!”消息的简单\
  \ Hello World 应用程序。如果你将项目部署在 Tomcat 服务器上并访问 URL `http://localhost:8080/ch10-annotation-helloworld/helloworld/saySomething/sayhello`，你将看到“Hello\
  \ World !!”消息。）\n\n### 使用注解控制器开发“Hello World” 应用程序\n\n`ch10-annotation-helloworld`\
  \ 项目与 `ch10-helloworld` 类似，不同之处在于 `ch10-annotation-helloworld` 项目使用注解控制器显示“Hello\
  \ World !!”消息。两个项目的 `web.xml` 和 `helloworld.jsp` 文件完全相同，但 `HelloWorldController.java`\
  \ 和 `myapp-config.xml` 文件是不同的。因此，我们在本节中将讨论限于 `HelloWorldController.java` 和 `myapp-config.xml`\
  \ 文件。\n\n让我们先看看使用 `@Controller` 和 `@RequestMapping` 注解创建控制器。\n\n### `@Controller`\
  \ 和 `@RequestMapping` 注解\n\n你通过 `@Controller` 注解将特定类指定为 Spring Web MVC 控制器。此外，你使用\
  \ `@RequestMapping` 注解将传入请求映射到控制器的相应方法。\n\n下面的示例列表显示了使用 `@Controller` 和 `@RequestMapping`\
  \ 注解的 `HelloWorldController` 类：\n\n**示例列表 10-6** – `HelloWorldController` 类 - `@Controller`\
  \ 和 `@RequestMapping` 的用法\n\n```java\npackage sample.spring.chapter10.web;\n\nimport\
  \ org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
  \nimport org.springframework.web.servlet.ModelAndView;\n\n.....\n\n@Controller(value=\"\
  sayHelloController\")\n@RequestMapping(\"/saySomething\")\npublic class HelloWorldController\
  \ {\n    @RequestMapping(\"/sayhello\")\n    public ModelAndView sayHello() {\n\
  \         Map<String, String> modelData = new HashMap<String, String>();\n     \
  \    modelData.put(\"msg\", \"Hello World !!\");\n         return new ModelAndView(\"\
  helloworld\", modelData);\n     }\n}\n```\n\n在上面的示例列表中，`HelloWorldController` 类被标记了\
  \ `@Controller` 和 `@RequestMapping` 注解，`sayHello` 方法被标记了 `@RequestMapping` 注解。`@Controller`\
  \ 注解是 `@Component` 注解的特殊形式（参考第 6 章），表示 `HelloWorldController` 是一个控制器组件。\n\n与被 `@Service`（参考第\
  \ 6 章）和 `@Repository`（参考第 7 章）注解的类一样，被 `@Controller` 注解的类会自动注册到 Spring 容器；你不需要在\
  \ Web 应用程序上下文 XML 文件中显式定义被 `@Controller` 注解的类。\n\n`@Controller` 注解的 `value` 属性指定了类注册到\
  \ Spring 容器时的名称。`value` 属性的作用与 `<bean>` 元素的 `id` 属性相同。如果没有指定 `value` 属性，则使用类的名称（首字母小写）来向\
  \ Spring 容器注册该类。\n\n`@RequestMapping` 注解将传入的 Web 请求映射到相应的控制器和控制器方法。类型级别的 `@RequestMapping`\
  \ 注解将请求映射到相应的控制器。例如，`HelloWorldController` 类上的 `@RequestMapping(\"/saySomething\"\
  )` 表示所有对 `/saySomething` 请求路径的请求都由 `HelloWorldController` 控制器处理。方法级别的 `@RequestMapping`\
  \ 将类型级别的 `@RequestMapping` 缩小到控制器类中的特定方法。例如，示例列表 10-6 中 `sayHello` 方法上的 `@RequestMapping(\"\
  /sayhello\")` 注解指定当请求路径为 `/saySomething/sayhello` 时调用 `sayHello` 方法。注意 `HelloWorldController`\
  \ 的 `sayHello` 方法没有接受任何参数并返回一个 `ModelAndView` 对象。这是因为注解控制器可以具有灵活的方法签名。在 10-7 节中，我们将查看\
  \ `@RequestMapping` 注解方法可以定义的各种参数和返回类型。\n\n类型级别的 `@RequestMapping` 注解通常指定请求路径或路径模式。方法级别的\
  \ `@RequestMapping` 注解通常指定 HTTP 方法或请求参数，以进一步缩小类型级别 `@RequestMapping` 注解指定的映射。下图显示了\
  \ `http://localhost:8080/ch10-annotation-helloworld/helloworld/saySomething/sayhello`\
  \ URL 如何通过 Spring Web MVC 调用 `HelloWorldController` 的 `sayHello` 方法：\n\n![](img/00053.jpeg)\n\
  \n**图 10-7** URL 如何映射到控制器的相应的 `@RequestMapping` 注解方法\n\n上面的图显示了特定的 URL 如何导致 `HelloWorldController`\
  \ 的 `sayHello` 方法。\n\n### 启用 Spring Web MVC 注解\n\n要在 Spring Web MVC 应用程序中使用注解控制器，你需要使用\
  \ Spring mvc 架构中的 `<annotation-driven>` 元素启用 Spring Web MVC 注解，如下例所示：\n\n**示例列表\
  \ 10-7** – `myapp-config.xml`\n\n**项目** – `ch10-annotation-helloworld`\n\n**源位置**-\
  \ `src/main/webapp/WEB-INF/spring`\n\n```xml\n<beans .....\n  xmlns:mvc=\"http://www.springframework.org/schema/mvc\"\
  \n  xsi:schemaLocation=\".....http://www.springframework.org/schema/mvc\n  http://www.springframework.org/schema/mvc/spring-mvc-4.0.xsd.....\"\
  >\n\n  <mvc:annotation-driven />\n  <context:component-scan base-package=\"sample.spring.chapter10.web\"\
  \ />\n\n  <bean id=\"viewResolver\"\n      class=\"org.springframework.web.servlet.view.InternalResourceViewResolver\"\
  >\n```\n\n\n\n\n\n```xml\n<property name=\"prefix\" value=\"/WEB-INF/jsp/\" />\n\
  <property name=\"suffix\" value=\".jsp\" />\n</bean>\n</beans>\n```\n\n在上面的示例列表中，Spring\
  \ mvc schema 中的 `<mvc:annotation-driven>` 元素允许在实现控制器时使用 Spring Web MVC 注解。此外，context\
  \ schema 中的 `<component-scan>` 元素（详情请参见第 6-2 节）用于将带有 `@Controller` 注解的类自动注册到 Spring\
  \ 。\n\n在本节中，我们看到了如何使用 `@Controller` 和 `@RequestMapping` 注解开发一个简单的“Hello World”Web\
  \ 应用程序。现在让我们来看在本章将用 Spring Web MVC 注解开发的 MyBank Web 应用程序的需求。\n\n## 10-6 MyBank Web\
  \ 应用程序的需求\n\n下图显示了 MyBank Web 应用程序的首页，该页面显示了系统中当前活跃的定期存款列表：\n\n![](img/00054.jpeg)\n\
  \n**图 10-8** MyBank Web 应用程序的首页显示了定期存款详情。网页提供了关闭、编辑和创建定期存款的选项。\n\n在上面的图中，ID 列显示了定期存款的唯一标识符。ID\
  \ 值在用户创建定期存款时分配给该存款。“关闭（Close）”和“编辑（Edit）”链接允许用户删除或编辑定期存款详情。“创建新的定期存款（Create new\
  \ Fixed Deposit）”按钮显示“开启定期存款”表单，用于输入要开启的定期存款详情，如下图所示：\n\n![](img/00055.jpeg)\n\n\
  **图 10-9** 用于开启定期存款的“开启定期存款”表单。金额（Amount）”、“期限（Tenure）和电子邮件（Email）字段是必填的。\n\n在上面的图中，点击保存（Save）按钮会将定期存款详情保存到数据存储中，而返回（Go\
  \ Back）链接将用户带回显示定期存款列表的网页（参见图 10-8）。上面的图显示，如果输入的数据不符合金额、期限和电子邮件字段设置的约束，将显示相应的错误信息。\n\
  \n当你点击图 10-8 中的“编辑”链接时，将显示一个与图 10-9 类似的表单，用于修改所选定期存款的详情。并且，点击图 10-8 中的“关闭”链接会将选定的定期存款从定期存款列表中移除。\n\
  \n现在，我们已经了解了 MyBank Web 应用程序的需求，让我们来看看如何使用 Spring Web MVC 注解来实现它。\n\n## 10-7 Spring\
  \ Web MVC 注解 - @RequestMapping 和 @RequestParam\n\n在第 10-5 节中，我们看到可以使用 `@Controller`\
  \ 和 `@RequestMapping` 注解开发一个简单的控制器。在本节中，我们将更仔细地查看 `@RequestMapping` 以及其他简化带注解控制器开发的\
  \ Spring Web MVC 注解。\n\n**导入第 10 章/ch10-bankapp**（此项目展示了 MyBank Web 应用程序，它允许用户管理定期存款。如果你将项目部署在\
  \ Tomcat 服务器上并访问 URL `http://localhost:8080/ch10-bankapp`，你将在系统中看到定期存款列表（如图 10-8\
  \ 所示）。\n\n让我们从查看 `@RequestMapping` 注解开始。\n\n### 使用 @RequestMapping 将请求映射到控制器或控制器方法\n\
  \n在第 10-5 节中，我们看到 `@RequestMapping` 注解用于类型级别和方法级别，以便将请求映射到控制器及其方法。在本节中，我们首先将查看 Spring\
  \ Web MVC 如何将 Web 请求映射到使用 `@RequestMapping` 注解的特定控制器方法。然后我们将查看 `@RequestMapping`\
  \ 注解的属性，以及带 `@RequestMapping` 注解的方法可以拥有的参数和返回类型。\n\n**@RequestMapping 注解和 RequestMappingHandlerMapping**\n\
  \n下面的示例列表显示了 `@RequestMapping` 注解在 `SomeController`（一个 Spring Web MVC 控制器）类中的用法：\n\
  \n**示例列表 10-8 – SomeController 类 - @RequestMapping 用**\n\n```java\n@Controller\n\
  \n@RequestMapping(\"/type_Level_Url\")\npublic class SomeController {\n\n  @RequestMapping(\"\
  /methodA_Url\")\n    public ModelAndView methodA() { ..... }\n\n  @RequestMapping(\"\
  /methodB_Url\")\n  public ModelAndView methodB() { ..... }\n}\n```\n\nSpring mvc\
  \ schema 中的 `<annotation-driven>` 元素会创建一个 `RequestMappingHandlerMapping` 实例（HandlerMapping\
  \ 的实现），它负责将 Web 请求映射到适当的带有 `@RequestMapping` 注解的方法。`RequestMappingHandlerMapping`\
  \ 将控制器方法视为端点，并负责根据类型级别和方法级别的 `@RequestMapping` 注解将请求唯一地映射到控制器方法。对于 `SomeController`，如果请求路径为\
  \ `/type_Level_Url/methodA_Url`，则调用 `methodA`；如果请求路径为 `/type_Level_Url/methodB_Url`，则调用\
  \ `methodB`。你应该注意，如果请求无法唯一地映射到控制器方法，则会返回 HTTP 404（意味着未找到资源）状态码。\n\n`@RequestMapping`\
  \ 注解的属性用于缩小请求到特定控制器或控制器方法的映射范围。你可以在类型级别和方法级别的 `@RequestMapping` 注解上指定这些属性。现在让我们来看\
  \ `@RequestMapping` 注解的属性。\n\n**根据请求路径映射请求**\n\n`@RequestMapping` 的 `value` 属性指定了控制器或控制器方法映射的请求路径。你可以在\
  \ `@RequestMapping` 注解中不显式指定 value 属性的情况下直接指定请求路径。例如，你可以将 `@RequestMapping(value\
  \ = \"/type_Level_Url\")` 指定为 `@RequestMapping(\"/type_Level_Url\")`。\n\n你也可以将 Ant\
  \ 风格模式作为 `value` 属性。例如，你可以指定 `/myUrl/*`、`/myUrl/**` 和 `/myUrl/*.do` 作为 `value` 属性。下面的示例列表显示了一个指定\
  \ `/myUrl/**` 为路径的 `@RequestMapping`：\n\n**示例列表 10-9 – SomeController 类 – Ant 风格路径用法**\n\
  \n```java\n@Controller\n\n@RequestMapping(\"/myUrl/**\")\npublic class SomeController\
  \ { ..... }\n```\n\n在上面的示例列表中，类型级别的 `@RequestMapping(\"/myUrl/**\")` 指定 `SomeController`\
  \ 控制器处理所有以 `/myUrl` 开头的请求。例如， `/myUrl/abc`、`/myUrl/xyz` 和 `/myUrl/123/something`\
  \ 的请求由 `SomeController` 处理。\n\n**根据 HTTP 方法映射请求**\n\n`@RequestMapping` 的 `method`\
  \ 属性指定了控制器或控制器方法处理的 HTTP 方法。因此，如果 `method` 属性指定了 HTTP GET 方法，控制器或方法只处理 HTTP GET\
  \ 请求。\n\n下面的示例列表显示了 `FixedDepositController` 的 `listFixedDeposits` 方法，它负责渲染系统的定期存款列表：\n\
  \n**示例列表 10-10 – @RequestMapping 的 method 属性用法**\n\n**项目 – ch10-bankapp**\n**源码位置\
  \ - src/main/java/sample/spring/chapter10/web**\n\n```java\npackage sample.spring.chapter10.web;\n\
  \nimport org.springframework.web.bind.annotation.RequestMethod;.....\n\n@Controller\n\
  \n@RequestMapping(value=\"/fixedDeposit\")\npublic class FixedDepositController\
  \ {\n\n  .....\n\n  @RequestMapping(value = \"/list\", method = RequestMethod.GET)\n\
  \  public ModelAndView listFixedDeposits() { ..... }\n\n  .....\n}\n```\n\n在上面的示例列表中，`listFixedDeposits`\
  \ 方法上的 `@RequestMapping` 注解将 `method` 属性的值指定为 `RequestMethod.GET`。`RequestMethod`\
  \ 是一个定义 HTTP 请求方法的枚举，如 `GET`、`POST`、`PUT`、`DELETE` 等。由于 `method` 属性的值为 `RequestMethod.GET`，只有当向\
  \ `/fixedDeposit/list` 路径发送 HTTP GET 请求时，才会调用 `listFixedDeposits` 方法。\n\n\n\n\n\
  你也可以指定一个 HTTP 方法数组作为 `method` 属性的值，如下例列表所示：\n\n**示例列表 10-11** – 将多个 HTTP 方法指定为 `method`\
  \ 属性的值\n\n```java\n@Controller\n\n@RequestMapping(value=\"/sample\")\npublic class\
  \ MyController {\n  @RequestMapping(value = \"/action\" method={ RequestMethod.GET,\
  \ RequestMethod.POST })\n    public ModelAndView action() { ..... }\n}\n```\n\n\
  在上面的示例列表 str，`action` 方法被标记了 `@RequestMapping` 注解，该注解的 `method` 属性的值为 `{ RequestMethod.GET,\
  \ RequestMethod.POST }`。这意味着如果向 `/sample/action` 路径发送 HTTP GET 或 POST 请求，将调用该 `action`\
  \ 方法。\n\n### 根据请求参数映射请求\n\n`@RequestMapping` 的 `params` 属性通常指定请求参数的名称和值，该参数*必须*出现在请求中。下面的示例显示了\
  \ `FixedDepositController` 的 `showOpenFixedDepositForm` 方法，该方法负责显示创建固定存款的表单：\n\n\
  **示例列表 10-12** – `@RequestMapping` 的 `params` 属性用法\n\n**项目** – `ch10-bankapp`\n\
  **源位置**- `src/main/java/sample/spring/chapter10/web`\n\n```java\npackage sample.spring.chapter10.web;\n\
  \nimport org.springframework.web.bind.annotation.RequestMethod;\n.....\n\n@Controller\n\
  @RequestMapping(value=\"/fixedDeposit\")\npublic class FixedDepositController {\n\
  \  .....\n  @RequestMapping(params = \"fdAction=createFDForm\", method = RequestMethod.POST)\n\
  \    public ModelAndView showOpenFixedDepositForm() { ..... }\n  .....\n}\n```\n\
  \n在上面的示例列表中，`showOpenFixedDepositForm` 方法上的 `@RequestMapping` 注解将 `params` 属性的值指定为\
  \ `fdAction=createFDForm`。由于 `FixedDepositController` 被映射到 `/fixedDeposit` 路径，如果向\
  \ `/fixedDeposit` 路径发送一个包含名为 `fdAction` 且值为 `createFDForm` 的请求参数的 HTTP POST 请求，将调用\
  \ `showOpenFixedDepositForm` 方法。\n\n如果你想根据多个请求参数的值将请求映射到控制器或控制器方法，你可以指定一个请求参数键值对数组作为\
  \ `params` 属性的值，如下例列表所示：\n\n**示例列表 10-13** – 将多个请求参数键值对指定为 `params` 属性的值\n\n```java\n\
  \  @RequestMapping(params = { \"x=a\", \"y=b\" })\n    public void perform() { .....\
  \ }\n```\n\n在上面的示例列表中，只有当请求包含名为 `x` 和 `y` 且值分别为 `a` 和 `b` 的参数时，才会调用 `perform` 方法。\n\
  \n你也可以根据请求中是否存在请求参数将请求映射到控制器或控制器方法。你只需要将请求参数的名称指定为 `params` 属性的值即可。例如，这里显示的 `perform`\
  \ 方法无论请求参数 `x` 的值如何都会调用：\n\n**示例列表 10-14** – 如果找到请求参数 `x` 则调用 `perform` 方法\n\n```java\n\
  \  @RequestMapping(params = \"x\")\n    public void perform() { ..... }\n```\n\n\
  若要在请求参数*不存在*时将请求映射到控制器或控制器方法，请使用 `!` 运算符。例如，如果请求中*没有找到*名为 `x` 的请求参数，则调用以下 `perform`\
  \ 方法：\n\n**示例列表 10-15** – 如果未找到请求参数 `x` 则调用 `perform` 方法\n\n```java\n  @RequestMapping(params\
  \ = \"!x\")\n    public void perform() { ..... }\n```\n\n你可以使用 `!=` 运算符在请求参数的值*不等于*指定的值时将请求映射到控制器或控制器方法，如下所示：\n\
  \n**示例列表 10-16** – 如果请求参数 `x` 的值*不等于* `a` 则调用 `perform` 方法\n\n```java\n  @RequestMapping(params\
  \ = \"x != a\")\n    public void perform() { ..... }\n```\n\n在上面的示例列表中，只有当请求包含名为\
  \ `x` 的请求参数且 `x` 的值*不等于* `a` 时，才会调用 `perform` 方法。\n\n### 根据请求的 MIME 类型映射请求\n\n`Content-Type`\
  \ 请求头指定了请求的 MIME 类型。`@RequestMapping` 的 `consumes` 属性指定控制器或控制器方法处理的请求 MIME 类型。因此，如果\
  \ `consumes` 属性的值与 `Content-Type` 请求头的值匹配，则该请求将被映射到特定的控制器或控制器方法。\n\n下面的示例列表显示，如果\
  \ `Content-Type` 头部的值为 `application/json`，则调用 `perform` 方法：\n\n**示例列表 10-17** –\
  \ 如果 `Content-Type` 头部值为 `application/json` 则调用 `perform` 方法\n\n```java\n  @RequestMapping(consumes\
  \ = \"application/json\")\n    public void perform() { ..... }\n```\n\n与 `params`\
  \ 属性一样，你可以使用 `!` 运算符来指定 `Content-Type` 头部值*不存在*的条件。例如，如果 `Content-Type` 头部的值*不是*\
  \ `application/json`，则调用以下 `perform` 方法：\n\n**示例列表 10-18** – 如果 `Content-Type` 头部值不是\
  \ `application/json` 则调用 `perform` 方法\n\n```java\n  @RequestMapping(consumes = \"\
  !application/json\")\n    public void perform() { ..... }\n```\n\n你可以在 `consumes`\
  \ 属性中指定值数组，如果 `Content-Type` 匹配 `consumes` 属性指定的值之一，则将请求映射到控制器或控制器方法。在下面的示例列表中，如果\
  \ `Content-Type` 为 `application/json` 或 `text/plain`，将调用 `perform` 方法：\n\n**示例列表\
  \ 10-19** – 如果 `Content-Type` 为 `application/json` 或 `text/plain` 则调用 `perform`\
  \ 方法\n\n```java\n  @RequestMapping(consumes = { \"application/json\", \"text/plain\"\
  \ })\n    public void perform() { ..... }\n```\n\n### 根据响应的 MIME 类型映射请求\n\n`Accept`\
  \ 请求头指定了响应的 MIME 类型。`@RequestMapping` 的 `produces` 属性指定了响应的 MIME 类型。因此，如果 `produces`\
  \ 属性的值与 `Accept` 请求头的值匹配，则请求将被映射到特定的控制器或控制器方法。\n\n下面的示例列表显示，如果 `Accept` 请求头部的值为\
  \ `application/json`，则调用 `perform` 方法：\n\n**示例列表 10-20** – 如果 `Accept` 请求头部值为 `application/json`\
  \ 则调用 `perform` 方法\n\n```java\n  @RequestMapping(produces = \"application/json\"\
  )\n    public void perform() { ..... }\n```\n\n与 `consumes` 属性一样，你可以使用 `!` 运算符来指定\
  \ `Accept` 头部值*不在*请求中的条件。如果你在 `produces` 属性中指定值数组，当 `Accept` 头部值匹配 `produces` 属性指定的值之一时，将映射到控制器或控制器方法。\n\
  \n### 根据请求头值映射请求\n\n要根据请求头映射请求，可以使用 `@RequestMapping` 的 `headers` 属性。下面的示例列表显示，如果\
  \ `Content-Type` 头部的值为 `text/plain`，则将请求映射到 `perform` 方法：\n\n**示例列表 10-21** – 如果\
  \ `Content-Type` 头部值为 `text/plain` 则调用 `perform` 方法\n\n```java\n  @RequestMapping(headers\
  \ = \"Content-Type=text/plain\")\n    public void perform() { ..... }\n```\n\n与\
  \ `params` 属性一样，在指定 `headers` 属性的值时可以使用 `!` 和 `!=` 运算符。例如，下面的示例列表显示，如果 `Content-Type`\
  \ 头部的值*不等于* `application/json`、请求中*不存在* `Cache-Control` 头部且请求中*存在*任意值的 `From` 头部，则将请求映射到\
  \ `perform` 方法：\n\n**示例列表 10-22** – 在指定 `headers` 属性的值时使用 `!` 和 `!=` 运算符\n\n```java\n\
  \  @RequestMapping(headers = { \"Content-Type != application/json\", \"!Cache-Control\"\
  , \"From\"} )\n```\n\n\n\n\n```java\npublic void perform() { ..... }\n```\n\n现在，我们已经查看了\
  \ `@RequestMapping` 注解的属性，让我们来看可以传递给 `@RequestMapping` 注解方法的参数。\n\n### @RequestMapping\
  \ 注解方法的参数\n\n被 `@RequestMapping` 注解的方法具有灵活的方法签名。可以传递给 `@RequestMapping` 注解方法的参数类型包括\
  \ `HttpServletRequest`、`HttpSession`、`java.security.Principal`、`org.springframework.validation.BindingResult`、`org.springframework.web.bind.support.SessionStatus`、`org.springframework.ui.Model`\
  \ 等。要查看传递给 `@RequestMapping` 注解方法的参数完整列表，请参考 `@RequestMapping` 的 Javadoc。\n\n在本书中讨论不同的\
  \ Spring Web MVC 特性时，我们会遇到需要向 `@RequestMapping` 注解方法传递不同参数类型的场景。目前，我们将查看一个需要发送 `HttpServletRequest`\
  \ 对象作为参数的场景。\n\n下面的示例显示了 `FixedDepositController` 的 `viewFixedDepositDetails` 方法，它接受类型为\
  \ `HttpServletRequest` 的参数：\n\n**示例列表 10-23** – `FixedDepositController` 类 - 传递\
  \ `HttpServletRequest` 参数\n\n**项目** – `ch10-bankapp`\n\n**源位置**- `src/main/java/sample/spring/chapter10/web`\n\
  \n```java\npackage sample.spring.chapter10.web;\n\nimport javax.servlet.http.HttpServletRequest;\n\
  \n.....\n\npublic class FixedDepositController {\n\n  .....\n\n    @RequestMapping(params\
  \ = \"fdAction=view\", method = RequestMethod.GET)\n\n    public ModelAndView viewFixedDepositDetails(HttpServletRequest\
  \ request) {\n\n        FixedDepositDetails fixedDepositDetails = fixedDepositService\n\
  \                .getFixedDeposit(Integer.parseInt(request.getParameter(\"fixedDepositId\"\
  ))));\n\n        .....\n\n    }\n\n  .....\n}\n```\n\n当您点击固定存款对应的编辑超链接时（参见图 10-8），将调用\
  \ `viewFixedDepositDetails` 方法。`viewFixedDepositDetails` 方法使用 `HttpServletRequest`\
  \ 来获取 `fixedDepositId` 请求参数，该参数唯一标识了系统中的某个固定存款。\n\n现在让我们来看 `@RequestMapping` 注解方法支持的返回类型。\n\
  \n### @RequestMapping 注解方法的返回类型\n\n`@RequestMapping` 注解方法支持的返回类型包括 `ModelAndView`、`org.springframework.web.servlet.View`、`String`、`java.util.concurrent.Callable`、`void`\
  \ 等。要查看 `@RequestMapping` 注解方法支持的返回类型完整列表，请参考 `@RequestMapping` 的 Javadoc。\n\n在本书中讨论不同的\
  \ Spring Web MVC 特性时，我们会遇到需要 `@RequestMapping` 注解方法具有不同返回类型的场景。在本节中，我们只查看具有 `String`\
  \ 或 `ModelAndView` 返回类型的示例。\n\n下面的示例列表显示了 `FixedDepositController` 的 `showOpenFixedDepositForm`\
  \ 方法，它渲染用于开启新固定存款的 HTML 表单（参见图 10-9）：\n\n**示例列表 10-24** – `FixedDepositController`\
  \ 类 - `ModelAndView` 返回类型示例\n\n**项目** – `ch10-bankapp`\n\n**源位置**- `src/main/java/sample/spring/chapter10/web`\n\
  \n```java\npackage sample.spring.chapter10.web;\n\nimport org.springframework.ui.ModelMap;\n\
  \n.....\n\npublic class FixedDepositController {\n\n  .....\n\n  @RequestMapping(params\
  \ = \"fdAction=createFDForm\", method = RequestMethod.POST)\n\n    public ModelAndView\
  \ showOpenFixedDepositForm() {\n\n        FixedDepositDetails fixedDepositDetails\
  \ = new FixedDepositDetails();\n\n        fixedDepositDetails.setEmail(\"You must\
  \ enter a valid email\");\n\n        ModelMap modelData = new ModelMap();\n\n  \
  \      modelData.addAttribute(fixedDepositDetails);\n\n        return new ModelAndView(\"\
  createFixedDepositForm\", modelData);\n\n    }\n\n  .....\n}\n```\n\n`showOpenFixedDepositForm`\
  \ 方法返回一个 `ModelAndView` 对象，该对象包含一个 `FixedDepositDetails` 实例作为模型属性，并将 `createFixedDepositForm`\
  \ 字符串作为视图名称。\n\n如果你将上述示例列表与 10-1 和 10-6 对比，你会发现 `showOpenFixedDepositForm` 方法使用\
  \ Spring 的 `ModelMap` 对象而不是 `java.util.Map` 来存储模型属性。`ModelMap` 是 `java.util.Map`\
  \ 接口实现，允许你在不显式指定名称的情况下存储模型属性。`ModelMap` 根据预定义的策略自动生成模型属性的名称。例如，如果你添加一个自定义的 Java\
  \ 对象作为模型属性，该对象的类名（首字母小写）将用作模型属性的名称。在上面的示例列表中，当 `FixedDepositDetails` 实例被添加到 `ModelMap`\
  \ 时，它将以 `fixedDepositDetails` 的名称存储在其中。\n\n当 `@RequestMapping` 注解方法返回字符串值时，它被视为视图名称，由为\
  \ Web 应用配置的 `ViewResolver` 解析为实际视图（如 JSP 页面或 servlet）。下面的示例列表显示了 `ch10-bankapp`\
  \ 项目中 `InternalResourceViewResolver` 的配置：\n\n**示例列表 10-25** – `bankapp-config.xml`\
  \ – ViewResolver 配置\n\n**项目** – `ch10-bankapp`\n\n**源位置**- `src/main/webapp/WEB-INF/spring`\n\
  \n```xml\n    <bean id=\"viewResolver\"\n        class=\"org.springframework.web.servlet.view.InternalResourceViewResolver\"\
  >\n        <property name=\"prefix\" value=\"/WEB-INF/jsp/\" />\n        <property\
  \ name=\"suffix\" value=\".jsp\" />\n    </bean>\n\n\n\n\n配置意味着当返回字符串 `xyz` 时，它会被解析为\
  \ `/WEB-INF/jsp/xyz.jsp`。要了解更多关于上述 `InternalResourceViewResolver` 配置的信息，请参见上述。如果\
  \ `@RequestMapping` 注解方法返回的字符串以 `redirect:` 开头，则它被视为重定向 URL 而不是视图名称。下面的示例列表显示了 `FixedDepositController`\
  \ 的 `closeFixedDeposit` 方法，当用户点击关闭按钮时（参见图 10-8）关闭固定存款：\n\n**示例列表 10-26** – `FixedDepositController`\
  \ 类 - String 返回类型示例\n\n**项目** – `ch10-bankapp`\n\n**源位置**- `src/main/java/sample/spring/chapter10/web`\n\
  \n```java\n  @RequestMapping(params = \"fdAction=close\", method = RequestMethod.GET)\n\
  \  public String closeFixedDeposit(int fdId) {\n    fixedDepositService.closeFixedDeposit(fdId);\n\
  \    return \"redirect:/fixedDeposit/list\";\n  }\n```\n\n`FixedDepositController`\
  \ 的 `closeFixedDeposit` 方法根据参数 `fdId` 关闭固定存款，并返回 `redirect:/fixedDeposit/list` 字符串。由于返回的字符串带有\
  \ `redirect:` 前缀，用户将被重定向到显示固定存款列表的 `/fixedDeposit/list` URL（参见图 10-8）。\n\n### 使用\
  \ @RequestParam 向控制器方法传递请求参数\n\n我们在示例列表 10-23 中看到，可以将 `HttpServletRequest` 对象传递给控制器方法并使用它来获取请求参数。与其向控制器方法传递\
  \ `HttpServletRequest` 对象，不如对方法参数使用 `@RequestParam` 注解，将请求参数的值赋值给方法参数。\n\n**注意**\
  \ 你应该注意，`@RequestParam` 注解只有在方法带有 `@RequestMapping` 或 `@ModelAttribute`（第 11 章解释）注解时才能使用。\n\
  \n下面的示例列表显示了 `FixedDepositController` 的 `closeFixedDeposit` 方法，当用户点击关闭按钮时（参见图 10-8）调用该方法以关闭固定存款：\n\
  \n**示例列表 10-27** – `FixedDepositController` 类 - `@RequestParam` 使用\n\n**项目** – `ch10-bankapp`\n\
  \n**源位置**- `src/main/java/sample/spring/chapter10/web`\n\n\n\n\n\n```java\npackage\
  \ sample.spring.chapter10.web;\n\nimport org.springframework.web.bind.annotation.RequestParam;\n\
  \n.....\n\npublic class FixedDepositController {\n\n    .....\n\n    @RequestMapping(params\
  \ = \"fdAction=close\", method = RequestMethod.GET)\n    public String closeFixedDeposit(@RequestParam(value\
  \ = \"fixedDepositId\") int fdId) {\n        fixedDepositService.closeFixedDeposit(fdId);\n\
  \        return \"redirect:/fixedDeposit/list\";\n    }\n\n    .....\n}\n```\n\n\
  `@RequestParam` 的 `value` 属性指定请求参数的名称，该值将被赋值给方法参数。在上面的示例列表中，`@RequestParam` 注解被用于将\
  \ `fixedDepositId` 请求参数的值赋值给 `fdId` 方法参数。由于 `fdId` 参数的类型为 `int`，Spring 负责将 `fixedDepositId`\
  \ 请求参数转换为 `int` 类型。默认情况下，Spring 会自动为简单的 Java 类型（如 `int`、`long`、`java.util.Date`\
  \ 等）提供类型转换。要将请求参数转换为自定义的 Java 类型（如 `Address`），你需要在向 Spring 的 `WebDataBinder` 实例注册自定义的\
  \ `PropertyEditors`，或者向 Spring 的 `FormattingConversionService` 实例注册 `org.springframework.format.Formatters`。我们将在第\
  \ 11 章详细学习 `WebDataBinder`，并在第 13 章学习 `Formatter` 和 `FormattingConversionService`。\n\
  \n现在让我们如何在控制器方法中访问所有的请求参数。\n\n### 将所有请求参数传递给控制器方法\n\n要将所有请求参数传递给控制器方法，请定义一个类型为 `Map<String,\
  \ String>` 或 `MultiValueMap<String, String>`（Spring 实现 `java.util.Map` 接口的对象）的参数，并使用\
  \ `@RequestParam` 注解对其标记。\n\n下面的示例显示了 `FixedDepositController` 的 `openFixedDeposit`\
  \ 方法，当用户输入存款详情并点击“开立存款”表单上的“保存”按钮时，该方法会创建一个存款（参见图 10-9）：\n\n#### 示例列表 10-28 – FixedDepositController\
  \ 类 – 访问所有请求参数\n\n**Project** – `ch10-bankapp`\n**Source location**- `src/main/java/sample/spring/chapter10/web`\n\
  \n```java\npackage sample.spring.chapter10.web;\n\nimport java.util.Map;\n\n.....\n\
  \n@RequestMapping(value = \"/fixedDeposit\")\npublic class FixedDepositController\
  \ {\n\n    .....\n\n    @RequestMapping(params = \"fdAction=create\", method = RequestMethod.POST)\n\
  \    public ModelAndView openFixedDeposit(@RequestParam Map<String, String> params)\
  \ {\n        String depositAmount = params.get(\"depositAmount\");\n        String\
  \ tenure = params.get(\"tenure\");\n        .....\n    }\n}\n```\n\n在上面的示例列表中，类型为\
  \ `Map<String, String>` 的参数 `params` 使用了 `@RequestParam` 注解。注意，`@RequestParam` 注解的\
  \ `value` 属性没有被指定。如果没有指定 `value` 属性且方法参数的类型为 `Map<String, String>` 或 `MultiValueMap<String,\
  \ String>`，Spring 会将所有请求参数拷贝到方法参数中。每个请求参数的值存储在 `Map`（或 `MultiValueMap`）中，并将请求参数名称作为键。\n\
  \n接下来的示例列表显示了 `FixedDepositController` 的 `editFixedDeposit` 方法，该方法负责对现有存款进行修改：\n\
  \n#### 示例列表 10-29 – FixedDepositController 类 – 访问所有请求参数\n\n**Project** – `ch10-bankapp`\n\
  **Source location**- `src/main/java/sample/spring/chapter10/web`\n\n```java\npackage\
  \ sample.spring.chapter10.web;\n\nimport org.springframework.util.MultiValueMap;\n\
  \n.....\n\npublic class FixedDepositController {\n\n    .....\n\n    @RequestMapping(params\
  \ = \"fdAction=edit\", method = RequestMethod.POST)\n    public ModelAndView editFixedDeposit(@RequestParam\
  \ MultiValueMap<String, String> params) {\n        String depositAmount = params.get(\"\
  depositAmount\").get(0);\n        String tenure = params.get(\"tenure\").get(0);\n\
  \        .....\n    }\n}\n```\n\n在上面的示例列表中，`editFixedDeposit` 的参数 `params` 类型为 `MultiValueMap<String,\
  \ String>`，并使用了 `@RequestParam` 注解。如果一个对象的类型为 `MultiValueMap<K, V>`，则意味着 `K` 是键的类型，`List<V>`\
  \ 是值的类型。由于 `params` 参数的类型为 `MultiValueMap<String, String>`，这意味着键的类型是 `String`，值的类型是\
  \ `List<String>`。在将请求参数存储在 `MultiValueMap<String, String>` 类型中时，Spring 使用请求参数名称作为键并将请求参数的值添加到\
  \ `List<String>` 值中。如果你有多个同名的请求参数，`MultiValueMap` 特别有用。\n\n由于与请求参数对应的值类型为 `List<String>`，调用\
  \ `params.get(String key)` 会返回一个 `List<String>` 类型。出于此原因，在返回的 `List<String>` 上调用\
  \ `get(0)` 以获取请求参数 `depositAmount`、`tenure` 等的值。或者，你也可以使用 `MultiValueMap` 的 `getFirst(String\
  \ key)` 方法从 `List<String>` 值中获取第一个元素。\n\n现在让我们详细查看 `@RequestParam` 注解的各种属性。\n\n\
  ### 使用 value 属性指定请求参数\n\n我们之前看到，`@RequestParam` 的 `value` 属性指定请求参数的名称，该值将被赋值给方法参数。如果你没有指定\
  \ `value` 属性，则方法参数名称被视为请求参数的名称。例如，在下面的示例列表中，名为 `param` 的请求参数的值被赋值给 `param`：\n\n\
  #### 示例列表 10-30 – @RequestParam 使用 – 未指定的请求参数名\n\n```java\n@RequestMapping(.....)\n\
  public String doSomething(@RequestParam String param) {.....}\n```\n\n在上面的示例列表中，`@RequestParam`\
  \ 未指定请求参数名称，因此 `param` 被视为请求参数的名称。\n\n### 使用 required 属性指定请求参数为可选或强制\n\n默认情况下，`@RequestParam`\
  \ 指定的请求参数是强制的；如果在请求中未找到指定的参数，将抛出异常。你可以通过将 `required` 属性的值设置为 `false` 来指定请求参数为可选，如下所示：\n\
  \n#### 示例列表 10-31 – @RequestParam 的 required 属性\n\n```java\n@RequestMapping(.....)\n\
  public String perform(@RequestParam(value = \"myparam\", required = false) String\
  \ param) {.....}\n```\n\n在上面的示例列表中，`@RequestParam` 的 `required` 属性值设置为 `false`，这意味着\
  \ `myparam` 请求参数是可选的。现在，如果请求中未找到 `myparam` 请求参数，将不会产生异常。相反，一个空值将被赋值给 `param` 方法参数。\n\
  \n### 使用 defaultValue 属性指定请求参数的默认值\n\n`@RequestParam` 的 `defaultValue` 属性指定请求参数的默认值。如果请求中未找到\
  \ `@RequestParam.value` 属性指定的请求参数，则由 `defaultValue` 属性指定的值赋值给方法参数。接下面的示例列表显示了 `defaultValue`\
  \ 属性的使用：\n\n#### 示例列表 10-32 – @RequestParam 的 defaultValue 属性\n\n```java\n@RequestMapping(.....)\n\
  public String perform(@RequestParam(value = \"location\", defaultValue = \"earth\"\
  ) String param) {.....}\n```\n\n在上面的示例列表中，如果请求中没有找到名为 `location` 的请求参数，则值 `earth`\
  \ 将赋值给 `param` 方法参数。\n\n\n\n\n在本节中，我们查看了通过 `@RequestMapping` 和 `@RequestParam` 注解创建\
  \ `MyBank` 应用程序 `FixedDepositController`。现在让我们来看看 `FixedDepositController` 类中如何执行表单数据的验证。\n\
  \n## 10-8 验证\n\n我们之前看到 `FixedDepositController` 的 `showOpenFixedDepositForm` 方法（参见示例\
  \ 10-24）渲染了 `createFixedDepositForm.jsp` 页面，该页面显示了开启新定期存款的表单。当提交表单时，表单中输入的数据将由 `FixedDepositController`\
  \ 的 `openFixedDeposit` 方法进行验证（参见示例 10-28）。如果在验证期间报告了错误，将重新渲染 `createFixedDepositForm.jsp`\
  \ 页面，并带有验证错误信息以及用户输入的原始表单数据（参见图 10-9）。\n\n下面的示例显示了 `createFixedDepositForm.jsp`\
  \ 页面的 `<form>` 元素：\n\n示例 10-33 – `createFixedDepositForm.jsp` – `<form>` 元素\n\n\
  Project – `ch10-bankapp`\n\nSource location- `src/main/webapp/WEB-INF/jsp`\n\n```html\n\
  <form name=\"createFixedDepositForm\" method=\"POST\" action=\"${pageContext.request.contextPath}/fixedDeposit?fdAction=create\"\
  >\n    .....\n    <input type=\"submit\" value=\"Save\" />\n</form>\n```\n\n在上面的示例中，`<form>`\
  \ 元素的 `method` 属性指定 `POST` 为 HTTP 方法，`action` 属性指定 `/fixedDeposit?fdAction=create`\
  \ 为用户点击 Save 按钮时表单提交的 URL。表单的提交将导致 `FixedDepositController` 的 `openFixedDeposit`\
  \ 方法被调用。\n\n下面的示例显示了 `openFixedDeposit` 方法如何执行验证，以及在发生验证错误时，用户输入的原始表单数据如何再次显示：\n\
  \n示例 10-34 – `FixedDepositController` 的 `openFixedDeposit` 方法\n\nProject – `ch10-bankapp`\n\
  \nSource location- `src/main/java/sample/spring/chapter10/web`\n\n```java\npackage\
  \ sample.spring.chapter10.web;\n\n.....\n\nimport org.apache.commons.lang3.math.NumberUtils;\n\
  \n@RequestMapping(value = \"/fixedDeposit\")\npublic class FixedDepositController\
  \ {\n\n    .....\n\n    @RequestMapping(params = \"fdAction=create\", method = RequestMethod.POST)\n\
  \    public ModelAndView openFixedDeposit(@RequestParam Map<String, String> params)\
  \ {\n        String depositAmount = params.get(\"depositAmount\");\n        .....\n\
  \        Map<String, Object> modelData = new HashMap<String, Object>();\n      \
  \  if (!NumberUtils.isNumber(depositAmount)) {\n            modelData.put(\"error.depositAmount\"\
  , \"enter a valid number\");\n        } else if (NumberUtils.toInt(depositAmount)\
  \ < 1000) {\n            modelData.put(\"error.depositAmount\", \"must be greater\
  \ than or equal to 1000\");\n        }\n        .....\n        FixedDepositDetails\
  \ fixedDepositDetails = new FixedDepositDetails();\n        fixedDepositDetails.setDepositAmount(depositAmount);\n\
  \        .....\n        if (modelData.size() > 0) { // --这意味着意味着存在验证错误\n       \
  \     modelData.put(\"fixedDepositDetails\", fixedDepositDetails);\n           \
  \ return new ModelAndView(\"createFixedDepositForm\", modelData);\n        } else\
  \ {\n            fixedDepositService.saveFixedDeposit(fixedDepositDetails);\n  \
  \          return new ModelAndView(\"redirect:/fixedDeposit/list\");\n        }\n\
  \    }\n\n    .....\n}\n```\n\n`openFixedDeposit` 方法验证了用户输入的存款金额、期限和电子邮件信息。注意，为了简化数据验证，使用了\
  \ Apache Commons Lang ([http://commons.apache.org/proper/commons-lang/]) 库中的 `NumberUtils`\
  \ 类。`modelData` 是一个 `java.util.Map` 对象，用于存储在验证错误时想要传递给 `createFixedDepositForm.jsp`\
  \ 页面的模型属性。\n\n由于我们希望在验证失败时显示错误信息和原始表单数据，因此这些内容存储在 `modelData` 中。例如，如果用户输入的存款金额验证失败，则会将名为\
  \ `error.depositAmount` 的相应验证错误信息存储在 `modelData` 中。用户输入的值设置在 `FixedDepositDetails`\
  \ 对象的新实例上。如果报告了验证错误，新创建的 `FixedDepositDetails` 实例将以 `fixedDepositDetails` 为名添加到\
  \ `modelData` 中，并渲染 `createFixedDepositForm.jsp` 页面。或者，如果没有报告验证错误，新创建的 `FixedDepositDetails`\
  \ 对象将保存到数据源中，并渲染显示完整定期存款列表的页面。\n\n由于我们使用 `FixedDepositDetails` 对象来存储用户输入的原始表单数据，`FixedDepositDetails`\
  \ 的所有属性都定义为 `String` 类型，如下所示：\n\n示例 10-35 – `FixedDepositDetails` 类\n\nProject –\
  \ `ch10-bankapp`\n\nSource location- `src/main/java/sample/spring/chapter10/domain`\n\
  \n```java\npackage sample.spring.chapter10.domain;\n\npublic class FixedDepositDetails\
  \ {\n    private long id; // id 由系统设置\n    private String depositAmount;\n    private\
  \ String tenure;\n    private String email;\n\n    // getters and setters\n}\n```\n\
  \n由于 `depositAmount` 和 `tenure` 字段被定义为 `String`，我们必须编写额外的逻辑将它们转换为数值。在第 11 章中，我们将查看\
  \ Spring MVC 如何简化数据到对象（如 `FixedDepositDetails`）的重新显示原始数据。\n\n以下来自 `createFixedDepositForm.jsp`\
  \ 的片段演示了验证错误信息和原始表单数据的显示：\n\n示例 10-36 – `createFixedDepositForm.jsp`\n\nProject\
  \ – `ch10-bankapp`\n\nSource location- `src/main/webapp/WEB-INF/jsp`\n\n```html\n\
  <%@taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\"%>\n<form name=\"\
  createFixedDepositForm\" method=\"POST\" action=\"${pageContext.request.contextPath}/fixedDeposit?fdAction=create\"\
  >\n    .....\n    <td>**<b>Amount (in USD):</b></b></td>\n    <td>\n        <input\
  \ type=\"text\" name=\"depositAmount\" value=\"${requestScope.fixedDepositDetails.depositAmount}\"\
  />\n        <font style=\"color: #C11B17;\">\n            <c:out value=\"${requestScope['error.depositAmount']}\"\
  />\n        </font>\n    </td>\n    .....\n    <input type=\"submit\" value=\"Save\"\
  \ />\n</form>\n```\n\n\n\n\n`ExceptionHandler` 注解用于在注解的控制器中，以识别负责处理控制器抛出的异常的方法。Spring\
  \ 的 `HandlerExceptionResolver` 负责将异常映射到负责处理异常的适当控制器方法。你应该注意，Spring 的 mvc 架构中的 `<annotation-driven>`\
  \ 配置了一个 `ExceptionHandlerExceptionResolver` 实例（`HandlerExceptionResolver` 的实现类），该实例将异常映射到适当带有\
  \ `@ExceptionHandler` 注解的方法。\n\n接下来的示例代码列表展示了 `ch10-bankapp` 项目中 `@ExceptionHandler`\
  \ 注解的使用：\n\n**示例列表 10-37** – `@ExceptionHandler` 注解用法\n\n**项目** – `ch10-bankapp`\n\
  \n**源码位置**- `src/main/java/sample/spring/chapter10/web`\n\n```java\npackage sample.spring.chapter10.web;\n\
  \nimport org.springframework.web.bind.annotation.ExceptionHandler;\n\n.....\n\n\
  @Controller\n\n@RequestMapping(value = \"/fixedDeposit\")\npublic class FixedDepositController\
  \ {\n    .....\n\n    @ExceptionHandler\n    public String handleException(Exception\
  \ ex) {\n        return \"error\";\n    }\n}\n```\n\n上面的示例代码列表显示，`FixedDepositController`\
  \ 的 `handleException` 方法标注了 `@ExceptionHandler` 注解。这意味着 `handleException` 方法由 Spring\
  \ Web MVC 调用，用于处理执行 `FixedDepositController` 控制器期间抛出的异常。`@ExceptionHandler` 方法通常渲染一个包含错误的错误页面。`@ExceptionHandler`\
  \ 注角的 `value` 属性指定了 `@ExceptionHandler` 注解方法处理的异常列表。如果没有指定 `value` 属性，则作为方法参数指定的异常类型将由带有\
  \ `@ExceptionHandler` 注解的方法处理。在上面的示例代码列表中，`handleException` 方法处理类型为 `java.lang.Exception`\
  \ 的异常。\n\n与 `@RequestMapping` 方法一样，`@ExceptionHandler` 方法具有灵活的方法签名。`@ExceptionHandler`\
  \ 方法支持的返回类型包括 `ModelAndView`、`View`、`String`、`void`、`Model` 等。`@ExceptionHandler`\
  \ 方法支持的参数类型包括 `HttpServletRequest`、`HttpServletResponse`、`HttpSession` 等。请参考 `@ExceptionHandler`\
  \ 的 Javadoc 获取支持的参数和返回类型的完整列表。\n\n带有 `@ExceptionHandler` 注解的方法返回的视图信息将由 `DispatcherServlet`\
  \ 用于渲染适当的错误页面。例如，在示例列表 10-37 中，`handleException` 方法返回的错误字符串值被 `DispatcherServlet`\
  \ 用于渲染 `/WEB-INF/jsp/error.jsp` 。如果 `@ExceptionHandler` 方法没有返回任何视图信息（即返回类型为 `void`\
  \ 或 `Model`），将使用 Spring 的 `RequestToViewNameTranslator` 类（详情请第 11 章第 11-2 节）来确定要渲染的视图。\n\
  \n你可以在控制器类中定义多个带有 `@ExceptionHandler` 注解的方法来处理不同类型的异常。`@ExceptionHandler` 注角的 `value`\
  \ 属性允许你指定方法处理的异常类型。接下来的示例代码列表显示，`myExceptionHandler` 方法处理类型为 `IOException` 和 `FileNotFoundException`\
  \ 的异常，而 `myOtherExceptionHandler` 方法处理类型为 `TimeoutException` 的异常：\n\n```java\n@Controller\n\
  \n.....\n\npublic class MyController {\n    .....\n\n    @ExceptionHandler(value\
  \ = {IOException.class, FileNotFoundException.class})\n    public String myExceptionHandler()\
  \ {\n        return \"someError\";\n    }\n\n    @ExceptionHandler(value = TimeoutException.class)\n\
  \    public String myOtherExceptionHandler() {\n        return \"otherError\";\n\
  \    }\n}\n```\n\n如果 `MyController` 抛出类型为 `IOException` 或 `FileNotFoundException`\
  \ 的异常（或 `IOException` 或 `FileNotFoundException` 的子类异常），将调用 `myExceptionHandler`\
  \ 方法来处理异常。如果 `MyController` 抛出类型为 `TimeoutException` 的异常（或 `TimeoutException` 的子类异常），将调用\
  \ `myOtherExceptionHandler` 方法来处理异常。\n\n现在让我们来看如何使用 Spring 的 `ContextLoaderListener`\
  \ 来加载根 Web 应用上下文 XML 文件。\n\n## 10-11 加载根 Web 应用上下文 XML 文件\n\n正如在本章开头提到的，根 Web 应用上下文文件定义了\
  \ Web 应用中所有 servlet 和过滤器共享的 bean。接下来的示例代码列表展示了 `ContextLoaderListener` 的配置：\n\n\
  **示例列表 10-39** – `ContextLoaderListener` 配置\n\n**项目** – `ch10-bankapp`\n\n**源码位置**-\
  \ `src/main/webapp/WEB-INF/web.xml`\n\n```xml\n<context-param>\n    <param-name>contextConfigLocation</param-name>\n\
  \    <param-value>classpath*:/META-INF/spring/applicationContext.xml</param-value>\n\
  </context-param>\n<listener>\n    <listener-class>org.springframework.web.context.ContextLoaderListener</listener-class>\n\
  </listener>\n```\n\n在上面的示例代码列表中，`<listener>` 元素配置了 `ContextLoaderListener`（`ServletContextListener`），它负责加载由\
  \ `contextConfigLocation` servlet 上文初始化参数指定的根 Web 应用上下文 XML 文件。`<context-param>`\
  \ 元素用于指定 servlet 上文初始化参数。`ContextLoaderListener` 创建根 `WebApplicationContext` 实例，从根应用上下文\
  \ XML 加载的 bean 将注册到其中。\n\n在上面的示例代码列表中，`contextConfigLocation` 参数指定 `/META-INF/spring/applicationContext.xml`\
  \ 为根应用上下文文件。你可以用逗号、换行或分号指定多个上下文文件。如果没有指定 `contextConfigLocation` 参数，`ContextLoaderListener`\
  \ 将把 `/WEB-INF/applicationContext.xml` 作为根应用上下文文件。\n\n## 10-12 总结\n\n在本章中，我们查看了简单\
  \ Spring Web 应用的一些重要对象。我们还查看了如何使用 `@Controller`、`@RequestMapping`、`@RequestParam`\
  \ 和 `@ExceptionHandler` 注解来创建注解控制器。在下一章中，我们将学习 Spring 如何将参数绑定到表单对象并进行验证。\n\n# 第\
  \ 11 章 Spring Web MVC 中的验证与数据绑定\n\n## 11-1 引言\n\n在上章中，我们查看了使用 `@Controller`、`@RequestMapping`\
  \ 和 `@RequestParam` 注解开发的 MyBank Web 应用。我们看到表单数据是从请求中获取的（参见示例列表 10-23、10-28 和 10-29）并设置到表单对象上的（`FixedDepositDetails`\
  \ 对象）。此外，验证逻辑写在控制器方法中（参见示例列表 10-34）。\n\n在本章中，我们将讨论：\n\n· 处理模型属性非常有用的 `@ModelAttribute`\
  \ 和 `@SessionAttributes` 注解\n· Spring 的 `WebDataBinder` 如何简化表单数据到表单对象的绑定\n· 使用 Spring\
  \ Validation API 和 JSR 303 约束注解验证表单对象\n· Spring 表单标签库如何简化编写 JSP 页面\n\n让我们先查看带有 `@ModelAttribute`\
  \ 注解的方法，它用于从 Spring 的 Model 中添加和获取模型属性。\n\n## 11-2 使用 @ModelAttribute 注解添加和获取模型属性\n\
  \n\n\n\n\n模型属性（model attribute）可以表示表单支持对象（form backing object）或 `reference data`。`MyBank`\
  \ Web 应用程序中的 `FixedDepositDetails` 对象就是表单支持对象的一个示例；当提交开启新固定存款的表单时，表单中包含的信息会被存储在\
  \ `FixedDepositDetails` 对象中。通常情况下，应用程序中的 `domain` 对象或实体被用作表单支持对象。`Reference data`（引用数据）指的是视图所需的额外信息（表单支持对象之外的其他信息）。例如，如果你为每笔固定存款添加一个用户类别（如军事人员、老年人等），那么开启新固定存款的表单将需要显示一个带有类别列表的组合框。该类别列表就是显示开启新固定存款表单所需的\
  \ `reference data`。\n\n`ModelAttribute` 注解分别用于在方法和方法参数上，以便从 Spring 的 `Model` 对象中存储和检索模型属性。方法上的\
  \ `@ModelAttribute` 注解表示该方法将向 `Model` 对象中添加一个或多个模型属性。而方法参数上的 `@ModelAttribute` 注解则用于从\
  \ `Model` 对象中检索模型属性，并将其分配给方法参数。\n\n### 章节 11/ch11-bankapp\n此项目了使用了 `@ModelAttribute`\
  \ 注解和 Spring 表单标签库的 `MyBank` Web 应用程序。`ch11-bankapp` 和 `ch10-bankapp` 项目提供的 `MyBank`\
  \ Web 应用程序功能是相同的。如果你将项目部署在 Tomcat 服务器并访问 URL `http://localhost:8080/ch11-bankapp`，你将看到系统中的固定存款列表。\n\
  \n让我们先查看带有 `@ModelAttribute` 注解的方法。\n\n### 使用方法级 @ModelAttribute 注解添加模型属性\n\n以下示例列表显示了\
  \ `FixedDepositController` 的 `getNewFixedDepositDetails` 方法，该方法标记了 `@ModelAttribute`\
  \ 注解：\n\n**示例列表 11-1** – 方法级 `@ModelAttribute` 注解的用法\n\n**项目** – `ch11-bankapp`\n\
  \n**源码位置**- `src/main/java/sample/spring/chapter11/web`\n\n```java\npackage sample.spring.chapter11.web;\n\
  \nimport org.springframework.web.bind.annotation.ModelAttribute;\nimport sample.spring.chapter11.domain.FixedDepositDetails;\n\
  \n.....\n\n@Controller\n@RequestMapping(value = \"/fixedDeposit\")\n.....\n\npublic\
  \ class FixedDepositController {\n    private static Logger logger = Logger.getLogger(FixedDepositController.class);\n\
  \    .....\n\n    @ModelAttribute(value = \"newFixedDepositDetails\")\n    public\
  \ FixedDepositDetails getNewFixedDepositDetails() {\n        FixedDepositDetails\
  \ fixedDepositDetails = new FixedDepositDetails();\n        fixedDepositDetails.setEmail(\"\
  You must enter a valid email\");\n        logger.info(\"****getNewFixedDepositDetails()\
  \ method****: Returning a new instance of FixedDepositDetails\");\n        return\
  \ fixedDepositDetails;\n    }\n\n    .....\n}\n```\n\n`getNewFixedDepositDetails`\
  \ 方法创建并返回一个 `FixedDepositDetails` 对象的新实例。由于 `getNewFixedDepositDetails` 方法标记了 `@ModelAttribute`\
  \ 注解，返回的 `FixedDepositDetails` 实例会被添加到 `Model` 对象中。`@ModelAttribute` 的 `value` 属性指定了返回的\
  \ `FixedDepositDetails` 对象以名称 `newFixedDepositDetails` 存储在 `Model` 对象中。请注意，`getNewFixedDepositDetails`\
  \ 方法记录了以下消息——“getNewFixedDepositDetails() method: Returning a new instance of FixedDepositDetails”。\n\
  \n**注意** 你应该注意模型属性的作用范围是 `request`。这意味着当请求完成或如果请求被重定向（redirected）时，模型属性将会丢失。\n\n\
  在本节的稍后部分，我们将看到 `ch11-bankapp` 项目的 `createFixedDepositForm.jsp` JSP 页面（参考 `src/main/webapp/WEB-INF/jsp/createFixedDepositForm.jsp`\
  \ 文件）如何使用 Spring 的表单标签库从 `Model` 对象访问名为 `newFixedDepositDetails` 的 `FixedDepositDetails`\
  \ 对象。\n\n如果你没有指定 `@ModelAttribute` 的 `value` 属性，返回的对象将使用其返回对象类型的简单名称存储在 `Model`\
  \ 对象中。在接下来的示例列表中，由 `getSample` 方法返回的 `Sample` 对象将以名称 `sample` 存储在 `Model` 对象中：\n\
  \n**示例列表 11-2** – `@ModelAttribute` 使用 – 未指定 `value` 属性\n\n```java\nimport org.springframework.ui.Model;\n\
  .....\n\npublic class SampleController {\n    @ModelAttribute\n    public Sample\
  \ getSample() {\n        return new Sample();\n    }\n}\n```\n\n带有 `@ModelAttribute`\
  \ 注解的方法接受与 `@RequestMapping` 方法相同类型的参数。以下示例列表显示了一个带有 `@ModelAttribute` 注解的方法，它接受一个类型为\
  \ `HttpServletRequest` 的参数：\n\n**示例列表 11-3** – 接受 `HttpServletRequest` 作为参数的 `@ModelAttribute`\
  \ 注解方法\n\n```java\n@ModelAttribute(value = \"myObject\")\npublic SomeObject doSomething(HttpServletRequest\
  \ request) { ..... }\n```\n\n在第 10 章中，我们看到 `@RequestParam` 注解用于将请求参数传递给带有 `@RequestMapping`\
  \ 注解的方法。`@RequestParam` 注解也可以用于请求参数传递给带有 `@ModelAttribute` 注解的方法，如下：\n\n**示例列表 11-4**\
  \ – 向 @ModelAttribute 方法传递请求参数\n\n```java\n@ModelAttribute(value = \"myObject\"\
  )\npublic SomeObject doSomething(@RequestParam(\"someArg\") String myarg) { .....\
  \ }\n```\n\n由于 `@RequestMapping` 和 `@ModelAttribute` 注解的方法都可以接受 `Model` 对象作为参数，因此你可以在\
  \ `@ModelAttribute` 或 `@RequestMapping` 方法中直接向 `Model` 对象添加模型属性。以下示例列表显示了一个直接向 `Model`\
  \ 对象添加属性的 `@ModelAttribute` 方法：\n\n**示例列表 11-5** – 直接向 Model 添加属性\n\n```java\nimport\
  \ org.springframework.ui.Model;\n.....\n\npublic class SampleWebController {\n \
  \   @ModelAttribute\n    public void doSomething(Model model) {\n        model.addAttribute(\"\
  myobject\", new MyObject());\n        model.addAttribute(\"otherobject\", new OtherObject());\n\
  \    }\n}\n```\n\n在上面的示例列表中，`Model` 对象作为参数传递给 `doSomething` 方法，该方法直接向 `Model` 对象添加属性。由于\
  \ `doSomething` 方法直接向 `Model` 对象添加属性，该方法的返回类型指定为 `void`，且没有 `@ModelAttribute` 的\
  \ `value` 属性。\n\n一个方法可以同时标记有 `@RequestMapping` 和 `@ModelAttribute` 注解。以下示例列表显示了\
  \ `FixedDepositController` 的 `listFixedDeposits` 方法，它同时标记了 `@RequestMapping` 和 `@ModelAttribute`\
  \ 注解：\n\n**示例列表 11-6** – 同一方法上的 `@ModelAttribute` 和 `@RequestMapping` 注解\n\n**项目**\
  \ – `ch11-bankapp`\n\n**源码位置**- `src/main/java/sample/spring/chapter11/web`\n\n\
  ```java\npackage sample.spring.chapter11.web;\n\n.....\n\n@Controller\n@RequestMapping(value\
  \ = \"/fixedDeposit\")\n.....\n\npublic class FixedDepositController {\n    private\
  \ static Logger logger = Logger.getLogger(FixedDepositController.class);\n\n   \
  \ @RequestMapping(value = \"/list\", method = RequestMethod.GET)\n    @ModelAttribute(value\
  \ = \"fdList\")\n    public List<FixedDepositDetails> listFixedDeposits() {\n  \
  \      logger.info(\"listFixedDeposits() method: Getting list of fixed deposits\"\
  );\n        return fixedDepositService.getFixedDeposits();\n    }\n\n    .....\n\
  }\n```\n\n\n\n\n\n`listFixedDeposits` 方法渲染 `list.jsp` JSP 页面（参考 `ch11-bankapp` 项目中的\
  \ `src/main/webapp/WEB-INF/jsp/fixedDeposit/list.jsp` 文件），该页面显示系统中固定存款列表。当一个方法同时带有\
  \ `@RequestMapping` 和 `@ModelAttribute` 注解时，该方法的返回值被视为模型属性，而*不是*视图名称。在这种情况下，视图名称由\
  \ Spring 的 `RequestToViewNameTranslator` 类决定，该类根据传入请求的请求 URI 来确定要渲染的视图。在本章的稍后部分，我们将详细讨论\
  \ `RequestToViewNameTranslator`。在示例代码段列表 11-6 中，请注意 `listFixedDeposits` 方法记录了以下消息——“`listFixedDeposits()`\
  \ method: Getting list of fixed deposits`”。\n\n需要注意的是，你可以在控制器中定义多个带有 `@ModelAttribute`\
  \ 注解的方法。当请求被分发到控制器的带有 `@RequestMapping` 注解的方法时，该控制器的*所有*带有 `@ModelAttribute` 注解的方法都会在\
  \ `@RequestMapping` 注解的方法被调用*之前*被调用。接下来的示例列表显示了一个定义了 `@RequestMapping` 和 `@ModelAttribute`\
  \ 注解方法的控制器：\n\n**示例代码列表 11-7** – `@RequestMapping` 方法在所有 `@ModelAttribute` 方法执行后才调用\n\
  \n```java\n@RequestMapping(\"/mycontroller\")\n\npublic class MyController {\n\n\
  \    @RequestMapping(\"/perform\")\n    public String perform() { ..... }\n\n  \
  \  @ModelAttribute(value = \"a\")\n    public A getA() { ..... }\n\n    @ModelAttribute(value\
  \ = \"b\")\n    public B getB() { ..... }\n}\n```\n\n在上面的示例代码列表中，如果请求映射到 `MyController`\
  \ 的 `perform` 方法，Spring Web MVC 将首先调用 `getA` 和 `getB` 方法，然后调用 `perform` 方法。\n\n\
  如果一个方法同时带有 `@RequestMapping` 和 `@ModelAttribute` 注解，则该方法在处理请求时仅被调用*一次*。接下来的示例列表显示了一个控制器，定义了一个同时带有\
  \ `@RequestMapping` 和 `@ModelAttribute` 注解的方法：\n\n**示例代码列表 11-8** – 同时带有 `@RequestMapping`\
  \ 和 `@ModelAttribute` 注解的方法在处理请求时仅被调用*一次*\n\n```java\n@RequestMapping(\"/mycontroller\"\
  )\n\npublic class MyController {\n\n    @RequestMapping(\"/perform\")\n    @ModelAttribute\n\
  \    public String perform() { ..... }\n\n    @ModelAttribute(value = \"a\")\n \
  \   public A getA() { ..... }\n\n    @ModelAttribute(value = \"b\")\n    public\
  \ B getB() { ..... }\n}\n```\n\n在上面的示例代码列表中，如果请求映射到 `MyController` 的 `perform` 方法，Spring\
  \ Web MVC 将首先调用 `getA` 和 `getB` 方法，然后调用 `perform` 方法。由于 `perform` 方法同时带有 `@RequestMapping`\
  \ 和 `@ModelAttribute` 注解，Spring 的 `RequestToViewNameTranslator` 类将用于在 `perform`\
  \ 方法执行后确定要渲染的视图名称。\n\n如果你现在在 Tomcat 上部署 `ch11-bankapp` 项目并访问 `http://localhost:8080/ch11-bankapp/fixedDeposit/list`\
  \ URL，你将看到一个显示固定存款列表的网页。同时，你会在控制台上看到以下顺序顺序的消息：\n\n```\nINFO sample.spring.chapter11.web.FixedDepositController\
  \ – getNewFixedDepositDetails() method: Returning a new instance of FixedDepositDetails\n\
  INFO sample.spring.chapter11.web.FixedDepositController – listFixedDeposits() method:\
  \ Getting list of fixed deposits\n```\n\n上述输出显示 `getNewFixedDepositDetails` 方法（带有\
  \ `@ModelAttribute` 注解）首先被调用，随后是 `listFixedDeposits`（同时带有 `@ModelAttribute` 和 `@RequestMapping`\
  \ 注解）。\n\n现在让我们来看如何通过在方法参数上使用 `@ModelAttribute` 注解从 `Model` 对象中获取模型属性。\n\n### 使用\
  \ @ModelAttribute 注解获取模型属性\n\n你可以在 `@RequestMapping` 注解方法的参数上使用 `@ModelAttribute`\
  \ 注解，从 `Model` 对象中获取模型属性。\n\n下面的示例列表显示了 `FixedDepositController` 的 `openFixedDeposit`\
  \ 方法，它使用 `@ModelAttribute` 注解从 `Model` 对象中获取 `newFixedDepositDetails` 对象：\n\n**项目**\
  \ – `ch11-bankapp`\n\n**源码位置** – `src/main/java/sample/spring/chapter11/web`\n\n\
  ```java\npackage sample.spring.chapter11.web;\n\n.....\n\n@Controller\n@RequestMapping(value\
  \ = \"/fixedDeposit\")\n\n.....\n\npublic class FixedDepositController {\n    .....\n\
  \n    @ModelAttribute(value = \"newFixedDepositDetails\")\n    public FixedDepositDetails\
  \ getNewFixedDepositDetails() {\n        .....\n        logger.info(\"****getNewFixedDepositDetails()\
  \ method****: Returning a new instance of FixedDepositDetails\");\n        .....\n\
  \    }\n\n    .....\n\n    @RequestMapping(params = \"fdAction=create\", method\
  \ = RequestMethod.POST)\n    public String openFixedDeposit(@ModelAttribute(value\
  \ = \"newFixedDepositDetails\") FixedDepositDetails fixedDepositDetails) {\n   \
  \     .....\n        fixedDepositService.saveFixedDeposit(fixedDepositDetails);\n\
  \        logger.info(\"openFixedDeposit() method: Fixed details successfully saved.\"\
  );\n        return \"redirect:/fixedDeposit/list\";\n    .....\n    }\n}\n```\n\n\
  **示例代码列表 11-9** – 方法参数上的 `@ModelAttribute` 注解\n\n在上面的示例代码列表中，带有 `@ModelAttribute`\
  \ 注解的 `getNewFixedDepositDetails` 方法在带有 `@RequestMapping` 注解的 `openFixedDeposit`\
  \ 方法之前被调用。当 `getNewFixedDepositDetails` 方法被调用时，返回的 `FixedDepositDetails` 实例存储在名为\
  \ `newFixedDepositDetails` 的模型中。现在，`openFixedDeposit` 方法的参数 `fixedDepositDetails`带有\
  \ `@ModelAttribute(value=\"newFixedDepositDetails\")`；因此，从 `Model` 中获取了 `newFixedDepositDetails`\
  \ 对象并将其赋值给该参数。\n\n如果你查看 `FixedDepositController` 的 `openFixedDeposit` 方法，你会发现我们并没有编写任何逻辑来从请求获取\
  \ `tenure`、`amount` 和 `email` 字段的值并填充 `newFixedDepositDetails` 实例。这是因为 Spring 的\
  \ `WebDataBinder` 对象（稍后介绍）负责透明地从请求中提取参数并填充 `newFixedDepositDetails` 实例的对应字段。例如，如果在请求中找到了名为\
  \ `tenure` 的参数，`WebDataBinder` 将 `newFixedDepositDetails` 实例的 `tenure` 字段的值设置为该请求参数的值。\n\
  \n图 11-1 总结了当请求分发到 `FixedDepositController` 的 `openFixedDeposit` 方法时 Spring 执行的操作序列。\n\
  \n![](img/00056.jpeg)\n\n**图 11-1** `FixedDepositController` 中 `@ModelAttribute`\
  \ 和 `@RequestMapping` 注解方法的调用顺序\n\n在上面的图中，Spring Web MVC 的 `RequestMappingHandlerAdapter`\
  \ 对象负责调用控制器的带有 `@ModelAttribute` 和 `@RequestMapping` 注解的方法。首先调用 `getNewFixedDepositDetails`\
  \ 方法并将返回的 `FixedDepositDetails` 实例存储在名为 `newFixedDepositDetails` 的模型中。接下来，从 `Model`\
  \ 中检索 `newFixedDepositDetails` 实例并作为参数传递给 `openFixedDeposit` 方法。\n\n### 请求处理与 @ModelAttribute\
  \ 注解方法\n\n在示例代码列表 11-6 中，我们看到 `listFixedDeposits` 方法执行记录了以下消息：\n\nlistFixedDeposits()\
