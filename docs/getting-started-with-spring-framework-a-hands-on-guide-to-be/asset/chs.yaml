  \ 方法被调用用于 bean .....EventSenderFactoryBean\n\n上述输出显示，`BeanPostProcessor` 的 `postProcessBeforeInitialization`\
  \ 和 `postProcessAfterInitialization` 方法为 Spring 容器创建的 `EventSenderFactoryBean` 实例被调用。\n\
  \n执行 `BankApp` 的 `main` 方法还在控制台上显示了以下输出：\n\n**getObject method of EventSenderFactoryBean\
  \ invoked**\n\nDependencyResolutionBeanPostProcessor 的 `postProcessAfterInitialization`\
  \ 方法被调用用于.....EventSender\n\n**getObject method of EventSenderFactoryBean invoked**\n\
  \nDependencyResolutionBeanPostProcessor 的 `postProcessAfterInitialization` 方法被调用用于.....EventSender\n\
  \n上述输出显示，*只有* `BeanPostProcessor` 的 `postProcessAfterInitialization` 方法为由 `EventSenderFactoryBean`\
  \ 创建的 `EventSender` 实例被调用。如果你需要，可以在 `postProcessAfterInitialization` 方法中对 `EventSender`\
  \ 实例进行修改。\n\n现在让我们来看 Spring 内置的 `RequiredAnnotationBeanPostProcessor`，你可以使用它来确保*必需的（或强制性的）bean\
  \ 属性在 application context XML 文件中进行了配置。\n\n### RequiredAnnotationBeanPostProcessor\n\
  \n如果 bean 属性的 setter 方法标记了 Spring 的 `@Required` 注解，Spring 的 `RequiredAnnotationBeanPostProcessor`（`BeanPostProcessor`\
  \ 的实现）会检查该 bean 属性是否在 application context XML 文件中进行了配置。\n\n**注意** 你应该注意，`RequiredAnnotationBeanPostProcessor`\
  \ 不会自动注册到 Spring 容器中，你需要通过在 application context XML 文件中定义它来显式注册。\n\n下面的示例列表显示了 `@Required`\
  \ 注解的一个用法示例：\n\n**示例列表 5-21** – @Required 注解用法\n\n```java\nimport org.springframework.beans.factory.annotation.Required;\n\
  \npublic class FixedDepositServiceImpl implements FixedDepositService {\n\n    private\
  \ FixedDepositDao fixedDepositDao;\n\n    @Required\n    public void setFixedDepositDao(FixedDepositDao\
  \ fixedDepositDao) {\n        this.fixedDepositDao = fixedDepositDao;\n    }\n\n\
  \    .....\n}\n```\n\n在上面的示例列表中，`FixedDepositDao` 属性的 `setFixedDepositDao` setter\
  \ 方法标记了 `@Required` 注解。如果你在 application context XML 文件中定义了 `RequiredAnnotationBeanPostProcessor`，该处理器将检查你是否指定了\
  \ `<property>` 元素或使用了 p 命名空间）来设置 `FixedDepositDao` 属性的值。如果你没有在 application context\
  \ XML 文件中 `FixedDepositServiceImpl` 类的 bean 定义中配置 `FixedDepositDao` 属性，将导致异常。这表明你可以使用\
  \ `RequiredAnnotationBeanPostProcessor` 来确保应用程序中的所有 bean 实例都在 application context\
  \ XML 文件中正确配置。\n\n`RequiredAnnotationBeanPostProcessor` 仅确保 bean 属性在 bean 定义中已配置。它*并没有*确保配置的属性值是正确的。例如，你可以将属性值配置为\
  \ null，而不是有效值。出于这个原因，bean 可能仍然需要实现初始化方法来检查属性是否正确设置。\n\n现在让我们来看 Spring 的 `DestructionAwareBeanPostProcessor`\
  \ 接口，它是 Spring `BeanPostProcessor` 接口的子接口。\n\n### DestructionAwareBeanPostProcessor\n\
  \n到目前为止我们已经看到 `BeanPostProcessor` 用于与新创建的 bean 实例交互。在某些场景下，你可能希望在 bean 实例销毁之前与其交互。为了在\
  \ bean 实例销毁之前与其交互，请在 application context XML 文件中配置实现 `DestructionAwareBeanPostProcessor`\
  \ 的 bean。`DestructionAwareBeanPostProcessor` 是 `BeanPostProcessor` 接口的子接口，并定义了以下方法：\n\
  \n```\nvoid postBeforeDestruction(Object bean, String beanName)\n```\n\n`postBeforeDestruction`\
  \ 方法接收即将销毁的 bean 实例及其名称作为参数。Spring 容器会在每个单例的 bean 实例销毁之前调用 `postBeforeDestruction`\
  \ 方法。通常，`postBeforeDestruction` 方法用于调用 bean 实例上的自定义销毁方法。需要注意的是，`postBeforeDestruction`\
  \ 方法*不会*为原型作用域的 bean 被调用。\n\n现在让我们来看 Spring 的 `BeanFactoryPostProcessor` 接口，它允许你对\
  \ bean 定义进行修改。\n\n## 5-4 使用 BeanFactoryPostProcessor 修改 bean 定义\n\nSpring `BeanFactoryPostProcessor`\
  \ 接口由想要修改 bean 定义的类实现。`BeanFactoryPostProcessor` 在 Spring 容器加载 bean 定义之后、但在任何 bean\
  \ 实例创建之前执行。`BeanFactoryPostProcessor` 在 application context XML 文件中定义的任何其他 bean\
  \ 之前创建，这为 `BeanFactoryPostProcessor` 提供了修改其他 bean 定义的机会。你像配置任何其他 Spring bean 一样在\
  \ application context XML 文件中配置 `BeanFactoryPostProcessor` 的实现。\n\n**注意** 如果你想修改或与\
  \ bean 实例交互，请使用 `BeanPostProcessor`（参阅第 5-3 节）而不是 `BeanFactoryPostProcessor`。\n\n\
  \n\n\n\n`BeanFactoryPostProcessor` 接口定义了一个方法 - `postProcessBeanFactory`。该方法接受一个类型为\
  \ `ConfigurableListableBeanFactory` 的参数，该参数可用于获取和修改由 Spring 容器加载的 bean 定义（bean definitions）。可以在\
  \ `postProcessBeanFactory` 方法内部通过调用 `ConfigurableListableBeanFactory` 的 `getBean`\
  \ 方法来创建 bean 实例，但不建议在 `postProcessBeanFactory` 方法内部创建 bean。需要注意的是，`BeanPostProcessors`（参见第\
  \ 5-3 节）不会为 `postProcessBeanFactory` 方法内部创建的 bean 实例执行。\n\n重要的是，`ConfigurableListableBeanFactory`\
  \ 就像 `ApplicationContext` 对象一样提供了对 Spring 容器的。`ConfigurableListableBeanFactory`\
  \ 还允许你配置 Spring 容器、遍历 beans 并修改 bean 定义。例如，使用 `ConfigurableListableBeanFactory`\
  \ 对象可以注册 `PropertyEditorRegistrars`（参见第 3 章第 3-6 节）、注册 `BeanPostProcessors` 等。在本节稍后的部分，我们将看到如何使用\
  \ `ConfigurableListableBeanFactory` 对象来修改 bean 定义。\n\n现在让我们来看看如何使用 `BeanFactoryPostProcessor`\
  \ 来修改 bean 定义。\n\n## IMPORT\n**`chapter 5/ch05-bankapp-beanfactorypostprocessor`**（此项目展示了\
  \ MyBank 应用，它使用 `BeanFactoryPostProcessor` 实现来禁用整个应用的自动装，并在发现单例作用（singleton-scoped）bean\
  \ 依赖于原型作用（prototype-scoped）bean 时打印错误消息。要验证 `BeanFactoryPostProcessor` 实现功能正常，请执行该项目中\
  \ `BankApp` 类的 main 方法。）\n\n### BeanFactoryPostProcessor example\n\n在上一章，我们看到自动装（autowiring）隐藏了应用程序的整体结构（参见第\
  \ 4 章第 4-6 节）。我们还讨论了不要使用 `<property>` 元素来指定单例作用 bean 依赖于原型作用 bean，而应该使用 `<lookup-method>`\
  \ 或 `<replaced-method>` 元素（详情参见第 4 章第 4-4 和 4-5 节）来以编程方式获取单例 bean 的原型作用依赖。现在我们将查看一个\
  \ `BeanFactoryPostProcessor` 实现，它可以使 bean 无法用于自动装（参见第 4 章第 4-6 节描述的 `<bean>` 元素的\
  \ `autowire-candidate` 属性），并在发现单例作用 bean 依赖于原型作用 bean 时记录错误消息。为了简单起见，我们假设单例作用 bean\
  \ 使用 `<property>` 元素来指定它依赖于原型作用 bean。\n\n**NOTE** 实现 Spring `BeanFactoryPostProcessor`\
  \ 接口的 bean 是一种特殊的 bean 类型；Spring 容器会自动检测并执行 `BeanFactoryPostProcessor` bean。\n\n\
  下面的示例列表了实现了 `BeanFactoryPostProcessor` 接口的 MyBank `ApplicationConfigurer` 类：\n\n\
  **Example listing 5-22** – `ApplicationConfigurer` 类 – 一个 `BeanFactoryPostProcessor`\
  \ 实现\n\n**Project** – `ch05-bankapp-beanfactorypostprocessor`\n\n**Source location**\
  \ - `src/main/java/sample/spring/chapter05/bankapp/postprocessor`\n\n```java\npackage\
  \ sample.spring.chapter05.bankapp.postprocessor;\n\nimport org.springframework.beans.factory.config.BeanDefinition;\n\
  import org.springframework.beans.factory.config.BeanFactoryPostProcessor;\nimport\
  \ org.springframework.beans.factory.config.ConfigurableListableBeanFactory;\n\n\
  public class ApplicationConfigurer implements BeanFactoryPostProcessor {\n\n   \
  \ public ApplicationConfigurer() {\n        logger.info(\"Created ApplicationConfigurer\
  \ instance\");\n    }\n\n    @Override\n    public void postProcessBeanFactory(ConfigurableListableBeanFactory\
  \ beanFactory) throws BeansException {\n        String[] beanDefinitionNames = beanFactory.getBeanDefinitionNames();\n\
  \        // -- get all the bean definitions\n        for (int i = 0; i < beanDefinitionNames.length;\
  \ i++) {\n            String beanName = beanDefinitionNames[i];\n            BeanDefinition\
  \ beanDefinition = beanFactory.getBeanDefinition(beanName);\n            beanDefinition.setAutowireCandidate(false);\n\
  \            // -- obtain dependencies of a bean\n            if (beanDefinition.isSingleton())\
  \ {\n                if (hasPrototypeDependency(beanFactory, beanDefinition)) {\n\
  \                    logger.error(\"Singleton-scoped \" + beanName + \" is dependent\
  \ on a prototype-scoped bean.\");\n                }\n            }\n        }\n\
  \    }\n```\n\n`postProcessBeanFactory` 方法执行以下顺序的操作：\n1. 首先，`postProcessBeanFactory`\
  \ 调用 `ConfigurableListableBeanFactory` 的 `getBeanDefinitionNames` 来获取由 Spring 容器加载的所有\
  \ bean 定义的名称。你应该注意，bean 定义的名称是 `<bean>` 元素 `id` 属性的值。\n2. 一旦获取了所有 bean 定义的名称，`postProcessBeanFactory`\
  \ 调用 `ConfigurableListableBeanFactory` 的 `getBeanDefinition` 来获取与每个 bean 定义对应的 `BeanDefinition`\
  \ 对象。`getBeanDefinition` 接受 bean 定义名称（在步骤 1 中获取）作为参数。\n3. `BeanDefinition` 对象表示一个\
  \ bean 定义，可用于修改配置。对于 Spring 容器加载的每个 bean 定义，`postProcessBeanFactory` 调用 `BeanDefinition`\
  \ 的 `setAutowireCandidate` 来使所有 bean 无法用于自动装。\n4. 如果 bean 定义是一个单例作用 bean 的，则 `BeanDefinition`\
  \ 的 `isSingleton` 返回 true。如果 bean 定义是单例作用 bean 的，`postProcessBeanFactory` 调用 `hasPrototypeDependency`\
  \ 来检查该单例作用 bean 是否依赖于任何原型作用 bean。如果单例作用 bean 依赖于原型作用 bean，`postProcessBeanFactory`\
  \ 将记录错误消息。\n\n下面的列表显示了 `ApplicationConfigurer` 的 `hasPrototypeDependency` 的实现，当\
  \ bean 依赖于原型作用 bean 时它返回 true：\n\n**Example listing 5-23** – `ApplicationConfigurer`\
  \ 的 `hasPrototypeDependency`\n**Project** – `ch05-bankapp-beanfactorypostprocessor`\n\
  **Source location** - `src/main/java/sample/spring/chapter05/bankapp/postprocessor`\n\
  \n```java\nimport org.springframework.beans.MutablePropertyValues;\nimport org.springframework.beans.PropertyValue;\n\
  import org.springframework.beans.factory.config.RuntimeBeanReference;\n\npublic\
  \ class ApplicationConfigurer implements BeanFactoryPostProcessor {\n\n    .....\n\
  \    private boolean hasPrototypeDependency(ConfigurableListableBeanFactory beanFactory,\
  \ BeanDefinition beanDefinition) {\n        boolean isPrototype = false;\n     \
  \   MutablePropertyValues mutablePropertyValues = beanDefinition.getPropertyValues();\n\
  \        PropertyValue[] propertyValues = mutablePropertyValues.getPropertyValues();\n\
  \        for (int j = 0; j < propertyValues.length; j++) {\n            if (propertyValues[j].getValue()\
  \ instanceof RuntimeBeanReference) {\n                String dependencyBeanName\
  \ = ((RuntimeBeanReference) propertyValues[j].getValue()).getBeanName();\n     \
  \           BeanDefinition dependencyBeanDef = beanFactory.getBeanDefinition(dependencyBeanName);\n\
  \                if (dependencyBeanDef.isPrototype()) {\n                    isPrototype\
  \ = true;\n                    break;\n                }\n            }\n      \
  \  }\n        return isPrototype;\n    }\n}\n```\n\n\n\n\n\n`hasPrototypeDependency`\
  \ 方法检查由 `BeanDefinition` 参数表示的 bean 是否依赖于原型作用域（prototype-scoped）的 bean。`ConfigurableListableBeanFactory`\
  \ 参数提供了访问 Spring 容器加载的 bean 定义 get。`hasPrototypeDependency` 方法通过执行以下操作序列来查找由 `BeanDefinition`\
  \ 参数表示的 bean 是否具有原型作用域依赖：\n\n1. 来说，`hasPrototypeDependency` 方法调用 `BeanDefinition`\
  \ 的 `getPropertyValues` 方法来获取由 `<property>` 元素定义的 bean 属性。`BeanDefinition` 的 `getPropertyValues`\
  \ 返回 `MutablePropertyValues` 类型的对象，可以使用它来修改 bean 属性。例如，你可以使用 `MutablePropertyValues`\
  \ 的 `addPropertyValue` 和 `addPropertyValues` 方法向 bean 定义中添加额外的属性。\n\n2. 由于我们需要遍历所有的\
  \ bean 属性并检查是否有任何 bean 属性引用了原型作用域的 bean，因此调用 `MutablePropertyValues` 的 `getPropertyValues`\
  \ 方法来获取一个 `PropertyValue` 对象数组。`PropertyValue` 对象持有关于 bean 属性的信息。\n\n3. 如果某个 bean\
  \ 属性引用了 Spring bean，调用 `PropertyValue` 的 `getValue` 方法将返回一个 `RuntimeBeanReference`\
  \ 对象实例，该实例持有被引用 bean 的名称。由于我们对引用 Spring bean 的 bean 属性感兴趣，将检查 `PropertyValue` `getValue`\
  \ 方法的返回值是否代表 `RuntimeBeanReference` 类型实例。如果是，则将 `PropertyValue` `getValue` 方法返回的对象转换为\
  \ `RuntimeBeanReference` 类型，并通过调用 `RuntimeBeanReference` 的 `getBeanName` 方法获取被引用\
  \ bean 的名称。\n\n4. 现在，既然已经获取了 bean 属性引用的 bean 名称，可以通过调用 `ConfigurableListableBeanFactory`\
  \ 的 `getBeanDefinition` 方法获取被引用 bean 的 `BeanDefinition` 对象。你可以通过 `BeanDefinition`\
  \ 的 `isPrototype` 方法检查被引用 bean 是否为原型作用域的 bean。\n\n以下序列图总结了 `hasPrototypeDependency`\
  \ 方法的工作原理：\n\n![](img/00027.jpeg)\n\n图 5-2 – `hasPrototypeDependency` 方法遍历依赖的 bean\
  \ 定义，如果发现原型作用域依赖，则返回 true\n\n在上面的序列图中，`ConfigurableListableBeanFactory` 对象被描绘为“Bean\
  \ factory”对象。\n\n以下示例列表显示了 `ch05-bankapp-beanfactorypostprocessor` 项目的应用上下文 XML\
  \ 文件，其中包含了 `ApplicationConfigurer` 类（一个 `BeanFactoryPostProcessor` 实现）、`InstanceValidationBeanPostProcessor`\
  \ 类（一个 `BeanPostProcessor` 实现）的 bean 定义，以及特定特定对象的 bean 定义：\n\n示例列表 5-24 – `applicationContext.xml`\
  \ - `BeanFactoryPostProcessor` bean 定义\n\n**Project** – `ch05-bankapp-beanfactorypostprocessor`\n\
  \n**源位置 -**`src/main/resources/META-INF/spring`\n\n```xml\n<beans .....>\n    .....\n\
  \    <bean id=\"FixedDepositDao\" class=\"sample.spring.chapter05.bankapp.dao.FixedDepositDaoImpl\"\
  ..... >\n        <property name=\"fixedDepositDetails\" ref=\"FixedDepositDetails\"\
  \ />\n    </bean>\n    <bean id=\"FixedDepositDetails\" class=\"sample.spring.chapter05.bankapp.domain.FixedDepositDetails\"\
  \ scope=\"prototype\" />\n    <bean class=\".....postprocessor.InstanceValidationBeanPostProcessor\"\
  >\n        <property name=\"order\" value=\"1\" />\n    </bean>\n    <bean class=\"\
  sample.spring.chapter05.bankapp.postprocessor.ApplicationConfigurer\" />\n</beans>\n\
  ```\n\n在上方显示的 bean 定义中，单例作用域的 `FixedDepositDao` bean 依赖于原型作用域的 `FixedDepositDetails`\
  \ bean。\n\n如果你执行 `ch05-bankapp-beanfactorypostprocessor` 项目中 `BankApp` 类的 `main`\
  \ 方法，将在控制台上看到以下输出：\n\n```\nCreated ApplicationConfigurer instance\nSingleton-scoped\
  \ FixedDepositDao bean is dependent on a prototype-scoped bean.\nCreated InstanceValidationBeanPostProcessor\
  \ instance\n```\n\n上述输出显示 Spring 容器在创建 `ApplicationConfigurer`（一个 `BeanFactoryPostProcessor`）之后并在创建\
  \ `InstanceValidationBeanPostProcessor`（一个 `BeanPostProcessor`）实例*之前*，执行了 `ApplicationConfigurer`\
  \ 的 `postProcessBeanFactory` 方法。注意的是，实现 `BeanFactoryPostProcessor` 接口的 bean 会在实现\
  \ `BeanPostProcessor` 接口的 bean *之前* 被处理。由于这个原因，你*不能*使用 `BeanPostProcessor` 对 `BeanFactoryPostProcessor`\
  \ 实例进行修改。`BeanFactoryPostProcessor` 为你提供了修改由 Spring 容器加载的 bean 定义的机会，而 `BeanPostProcessor`\
  \ 则为你提供了修改新创建的 bean 实例的机会。\n\n现在让我们来看看 `BeanPostProcessors` 和 `BeanFactoryPostProcessors`\
  \ 之间相似之处：\n\n- 你可以在应用上下文 XML 文件中配置多个 `BeanFactoryPostProcessors`。要控制 Spring 容器执行\
  \ `BeanFactoryPostProcessors` 的顺序，请实现 Spring 的 `Ordered` 接口（参阅第 5-3 节了解更多关于 `Ordered`\
  \ 接口的信息）。\n- 即使你指定 `BeanFactoryPostProcessor` 实现由 Spring 容器懒懒加载，这些处理器也会在 Spring\
  \ 容器实例创建时被创建。\n\n在第 3 章中，我们查看了 `CustomEditorConfigurer` —— 这是 Spring 开箱提供的用于注册自定义编辑器的\
  \ `BeanFactoryPostProcessor` 实现。现在让我们来看看 Spring 开箱提供的一些 `BeanFactoryPostProcessor`\
  \ 实现。\n\n### PropertySourcesConfigurer\n\n到目前为止，我们看到的 bean 定义使用 `<property>` 或 `<constructor-arg>`\
  \ 元素来指定 bean 属性或构造参数的实际字符串值。`PropertySourcesConfigurer`（一个 `BeanFactoryPostProcessor`）允许在属性文件中指定\
  \ bean 属性和构造参数的实际字符串值。在 bean 定义中，你只需指定占位符（格式为 `${property_name_in_properties_file}`）作为\
  \ `<property>` 或 `<constructor-arg>` 元素的值。当 Spring 容器加载 bean 定义时，`PropertySourcesConfigurer`\
  \ 从属性文件中提取实际值并替换 bean 定义中的占位符。\n\n**导入第 5 章（该项目展示了使用 Spring 的 PropertySourcesConfigurer\
  \ 从外部属性文件设置 bean 属性的 Spring 应用。要验证 `PropertySourcesConfigurer` 功能正常，请执行该项目中 `SampleApp`\
  \ 类的 `main` 方法。）\n\n以下示例列表了使用了占位符的 `DataSource` 和 `WebServiceConfiguration` 类的 bean\
  \ 定义：\n\n示例列表 5-25 – `applicationContext.xml` - 使用占位符的 bean 定义\n\n**Project** –\
  \ `ch05-propertySourcesConfigurer-example`\n\n**源位置 -**`src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"datasource\" class=\"sample.spring.chapter05.domain.DataSource\"\
  >\n    <property name=\"url\" value=\"${database.url}\" />\n    <property name=\"\
  username\" value=\"${database.username}\" />\n    <property name=\"password\" value=\"\
  ${database.password}\" />\n    <property name=\"driverClass\" value=\"${database.driverClass}\"\
  \ />\n</bean>\n<bean id=\"webServiceConfiguration\" class=\"sample.spring.chapter05.domain.WebServiceConfiguration\"\
  >\n    <property name=\"webServiceUrl\" value=\"${webservice.url}\" />\n</bean>\n\
  ```\n\n\n\n\n上面的示例列表显示，每个 `<property>` 元素的 `value` 属性指定了一个属性占位符。当 Spring 容器加载 bean\
  \ 定义时，`PropertySourcesPlaceholderConfigurer` 会将属性占位符替换为来自属性文件的值。例如，如果一个属性文件中定义了\
  \ `database.username` 属性，那么 `database.username` 属性的值将替换 `dataSource` bean 中 `${database.username}`\
  \ 属性占位符。\n\n`PropertySourcesPlaceholderConfigurer` 的 bean 定义指定了要搜索的属性文件，以查找用于替换属性占位符的属性，如下示例列表所示：\n\
  \n**示例列表 5-26** – `applicationContext.xml-PropertySourcesPlaceholderConfigurer`\
  \ bean 定义\n\n**项目** – `ch05-propertySourcesPlaceholderConfigurer-example`\n\n**源位置\
  \ -**`src/main/resources/META-INF/spring`\n\n```xml\n    <bean class=\"org.springframework.context.support.PropertySourcesPlaceholderConfigurer\"\
  >\n    <property name=\"locations\">\n        <list>\n            <value>classpath:database.properties</value>\n\
  \            <value>classpath:webservice.properties</value>\n        </list>\n \
  \   </property>\n    <property name=\"ignoreUnresolvablePlaceholders\" value=\"\
  false\" />\n</bean>\n```\n\n`PropertySourcesPlaceholderConfigurer` 的 `locations`\
  \ 属性指定了要搜索的属性文件，以查找属性占位符的值。在上面的示例列表中，`PropertySourcesPlaceholderConfigurer` 在 `database.properties`\
  \ 和 `webservice.properties` 文件中查找属性占位符的值。`ignoreUnresolvablePlaceholders` 属性指定了在\
  \ `locations` 属性指定的任何属性文件中未找到属性占位符的值时，`PropertySourcesPlaceholderConfigurer` 是静默忽略还是抛出异常。值\
  \ `false` 表示如果在 `database.properties` 或 `webservice.properties` 文件中未找到属性占位符的值，`PropertySourcesPlaceholderConfigurer`\
  \ 将抛出异常。\n\n下面的示例列表显示了 `database.properties` 和 `webservice.properties` 文件定义的属性：\n\
  \n**示例列表 5-27** – 在 `database.properties` 和 `webservice.properties` 文件中定义的属性\n\n\
  **项目** – `ch05-propertySourcesPlaceholderConfigurer-example`\n\n**源位置 -**`src/main/resources/META-INF`\n\
  \n**---------------- database.properties file ------------------**\n```properties\n\
  database.url=some_url\ndatabase.username=some_username\ndatabase.password=some_password\n\
  database.driverClass=some_driverClass\n```\n\n**---------------- webservice.properties\
  \ file ------------------**\n```properties\nwebservice.url=some_url\n```\n\n如果你将\
  \ `database.properties` 和 `webservice.properties` 文件中定义的属性与 `datasource` 和 `webServiceConfiguration`\
  \ bean 定义中指定的属性占位符进行比较（参考示例列表 5-25），你会发现对于每个属性占位符，在其中一个属性文件中都定义了一个属性。\n\n`ch05-propertySourcesPlaceholderConfigurer-example`\
  \ 项目中 `SampleApp` 类的 `main` 方法从 `ApplicationContext` 获取 `WebServiceConfiguration`\
  \ 和 `DataSource` bean，并在控制台上打印打印它们的属性。如果你执行 `SampleApp` 的 `main` 方法，你将在控制台上看到以下输出：\n\
  \n**DataSource** [url=some_url, username=some_username, password=some_password,\
  \ driverClass=some_driverClass]\n\n**WebServiceConfiguration** [webServiceUrl=some_url]\n\
  \n上面的输出显示：\n- `DataSource` 的 `url` 属性被设置为 `some_url`，`username` 设置为 `some_username`，`password`\
  \ 为 `some_password`，`driverClass` 为 `some_driverClass`。\n- `WebServiceConfiguration`\
  \ 的 `webServiceUrl` 属性被设置为 `some_url`。\n\n如果你从 `database.properties` 或 `webservice.properties`\
  \ 文件删除一个属性，执行 `SampleApp` 的 `main` 方法将导致异常。\n\n现在让我们来看 `PropertySourcesPlaceholderConfigurer`\
  \ 的 `localOverride` 属性。\n\n### localOverride 属性\n\n如果你希望本地属性（通过 `<props>` 元素设置）覆盖从属性文件中读取的属性，可以将\
  \ `PropertySourcesPlaceholderConfigurer` 的 `localOverride` 属性设置为 `true`。\n\n**导入章节\
  \ 5/ch05-localoverride-example**(此项目展示了一个使用 `PropertySourcesPlaceholderConfigurer`\
  \ 的 `localOverride` 属性的 Spring 应用程序。要运行应用程序，请执行该项目中 `SampleApp` 类的 `main` 方法。)\n\
  \n下面的示例列表显示了 `DataSource` 和 `WebServiceConfiguration` 类的 bean 定义：\n\n**示例列表 5-28**\
  \ – `applicationContext.xml` - 使用属性占位符的 bean 定义\n\n**项目** – `ch05-localOverride-example`\n\
  \n**源位置 -**`src/main/resources/META-INF/spring`\n\n```xml\n    <bean id=\"datasource\"\
  \ class=\"sample.spring.chapter05.domain.DataSource\">\n        <property name=\"\
  url\" value=\"${database.url}\" />\n        <property name=\"username\" value=\"\
  ${database.username}\" />\n        <property name=\"password\" value=\"${database.password}\"\
  \ />\n        <property name=\"driverClass\" value=\"${database.driverClass}\" />\n\
  \    </bean>\n    <bean id=\"webServiceConfiguration\" class=\"sample.spring.chapter05.domain.WebServiceConfiguration\"\
  >\n        <property name=\"webServiceUrl\" value=\"${webservice.url}\" />\n   \
  \ </bean>\n```\n\n`DataSource` 和 `WebServiceConfiguration` 的 bean 定义与我们在示例列表 5-25\
  \ 中看到的相同。\n\n下面的示例列表显示了 `database.properties` 和 `webservice.properties` 中定义的属性：\n\
  \n**示例列表 5-29** – 在 `database.properties` 和 `webservice.properties` 文件中定义的属性\n\n\
  **项目** – `ch05-localOverride-example`\n\n**源位置 -**`src/main/resources/META-INF`\n\
  \n**---------------- database.properties file ------------------**\n```properties\n\
  database.url=some_url\ndatabase.username=some_username\n```\n\n**----------------\
  \ webservice.properties file ------------------**\n```properties\nwebservice.url=some_url\n\
  ```\n\n下面的示例列表显示了 `PropertySourcesPlaceholderConfigurer` 的 bean 定义：\n\n**示例列表 5-30**\
  \ – `applicationContext.xml-PropertySourcesPlaceholderConfigurer` bean 定义\n\n**项目**\
  \ – `ch05-localOverride-example`\n\n**源位置 -**`src/main/resources/META-INF/spring`\n\
  \n```xml\n    <bean class=\"org.springframework.context.support.PropertySourcesPlaceholderConfigurer\"\
  >\n    <property name=\"locations\">\n        <list>\n            <value>classpath:database.properties</value>\n\
  \            <value>classpath:webservice.properties</value>\n        </list>\n \
  \   </property>\n    <property name=\"properties\">\n        <props>\n         \
  \   <prop key=\"database.password\">locally-set-password</prop>\n            <prop\
  \ key=\"database.driverClass\">locally-set-driverClass</prop>\n            <prop\
  \ key=\"webservice.url\">locally-set-webServiceUrl</prop>\n        </props>\n  \
  \  </property>\n    <property name=\"ignoreUnresolvablePlaceholders\" value=\"false\"\
  \ />\n    <property name=\"localOverride\" value=\"true\" />\n</bean>\n```\n\n\n\
  \n\n`ch05-localOverride-example` 项目中 `SampleApp` 类的主方法从 `ApplicationContext` 中检索\
  \ `WebServiceConfiguration` 和 `DataSource` bean，并并在控制台上打印它们的属性。如果你执行 `SampleApp`\
  \ 的主方法，你将在控制台上看到以下输出：\n\n`DataSource` [url=some_url, username=some_username, password=locally-set-password,\
  \ driverClass=locally-set-driverClass]\n\n`WebServiceConfiguration` [webServiceUrl=locally-set-webServiceUrl]\n\
  \n输出显示，`DataSource` 的 `password` 和 `driverClass` 属性值分别为 `locally-set-password` 和\
  \ `locally-set-driverClass`。这意味着 `DataSource` 的 `password` 和 `driverClass` 属性值来自于由\
  \ `PropertySourcesPlaceholderConfigurer` bean 定义的本地属性（参见示例 5-30）。这表明，如果 `PropertySourcesPlaceholderConfigurer`\
  \ 无法在外部属性文件中找到占位符的属性，它将在 `PropertySourcesPlaceholderConfigurer` bean 定义的本地属性中搜索该属性。输出还显示\
  \ `WebServiceConfiguration` 的 `webServiceUrl` 属性值也来自于 `PropertySourcesPlaceholderConfigurer`\
  \ bean 定义的本地属性（参见示例 5-30）。`PropertySourcesPlaceholderConfigurer` 的 `localOverride`\
  \ 属性被设置为 true；因此，本地定义的 `webservice.url` 属性优于从 `webservice.properties` 文件读取的 `webservice.url`\
  \ 属性。\n\n**注意** 与其使用 `PropertySourcesPlaceholderConfigurer` 的 `properties` 属性，你可以使用\
  \ Spring util schema 的 `<properties>` 元素（参见第 3 章第 8 节）或 `PropertiesFactoryBean`（参见第\
  \ 3 章第 8 节）来定义本地属性。\n\n与其在应用程序上下文 XML 文件中配置 `PropertySourcesPlaceholderConfigurer`\
  \ bean，你可以使用 Spring context schema 的 `<property-placeholder>` 元素。`<property-placeholder>`\
  \ 元素配置 `PropertySourcesPlaceholderConfigurer` 实例。现在让我们详细查看 `<property-placeholder>`\
  \ 元素。\n\n**导入** `chapter 5/ch05-property-placeholder-element-example`（该项目展示了一个使用\
  \ `<property-placeholder>` 元素的 Spring 应用程序。要运行该应用程序，请执行该项目中 `SampleApp` 类的主方法。）\n\
  \n### <property-placeholder> 元素\n\n下面的示例显示了如何使用 `<property-placeholder>` 元素配置一个\
  \ `PropertySourcesPlaceholderConfigurer` 实例，其配置与我们在示例 5-30 中配置的相同：\n\n**示例 5-31**\
  \ – `applicationContext.xml` - `<property-placeholder>` 元素\n\n**项目** – `ch05-property-placeholder-element-example`\n\
  \n**源位置 -** `src/main/resources/META-INF/spring`\n\n```xml\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\
  \n    xmlns:context=\"http://www.springframework.org/schema/context\"\n    xmlns:util=\"\
  http://www.springframework.org/schema/util\" .....>\n    \n    <context:property-placeholder\
  \ ignore-unresolvable=\"false\"\n        location=\"classpath:database.properties,\
  \ classpath:webservice.properties\"\n        local-override=\"true\" order=\"1\"\
  \ properties-ref=\"localProps\" />\n    \n    <util:properties id=\"localProps\"\
  >\n        <prop key=\"database.password\">locally-set-password</prop>\n       \
  \ <prop key=\"database.driverClass\">locally-set-driverClass</prop>\n        <prop\
  \ key=\"webservice.url\">locally-set-webServiceUrl</prop>\n    </util:properties>\n\
  </beans>\n```\n\n在上面的示例中，包含了对 Spring context schema 的引用，以便可以使用其元素。上面的示例显示，使用 `<property-placeholder>`\
  \ 元素使得 `PropertySourcesPlaceholderConfigurer` 的配置更加简洁。`ignore-unresolvable`、`location`\
  \ 和 `local-override` 属性对应 `PropertySourcesPlaceholderConfigurer` 的 `ignoreUnresolvablePlaceholders`、`locations`\
  \ 和 `localOverride` 属性。由于 `PropertySourcesPlaceholderConfigurer` 类实现了 Spring 的 `Ordered`\
  \ 接口，`order` 属性的值用于设置 `PropertySourcesPlaceholderConfigurer` 实例 `order` 属性。`properties-ref`\
  \ 属性引用代表本地属性的 `java.util.Properties` 对象。在上面的示例中，Spring util schema 的 `<properties>`\
  \ 元素（参见第 3 章第 8 节）创建了一个 `java.util.Properties` 对象实例，该实例被 `<property-placeholder>`\
  \ 元素的 `properties-ref` 属性引用。\n\n现在让我们来看看 Spring 的 `PropertyOverrideConfigurer`（一个\
  \ `BeanFactoryPostProcessor`），它允许你在外部属性文件中为 bean 属性指定值。\n\n### PropertyOverrideConfigurer\n\
  \n`PropertyOverrideConfigurer` 与 `PropertySourcesPlaceholderConfigurer` 的相似之处在于，它允许你在外部属性文件中指定\
  \ bean 属性值。在使用 `PropertyOverrideConfigurer` 时，在外部属性文件中以以下格式指定 bean 属性值：\n\n`<bean-name>.<bean-property-name>=<value>`\n\
  \n在这里，`<bean-name>` 是 bean 的名称，`<bean-property-name>` 是 bean 属性的名称，`<value>` 是你想赋值给\
  \ bean 属性的值。\n\n`PropertyOverrideConfigurer` 和 `PropertySourcesPlaceholderConfigurer`\
  \ 类之间的主要区别是：\n\n- 你只能使用 `PropertyOverrideConfigurer` 外部化 bean 属性的值，即你不能使用它来外部化构造函数参数。\n\
  - `PropertySourcesPlaceholderConfigurer` 未向你提供指定属性默认值的选项。但 `PropertyOverrideConfigurer`\
  \ 允许你为 bean 属性指定默认值。\n\n现在让我们来看看 `PropertyOverrideConfigurer` 的用法示例。\n\n**导入** `chapter\
  \ 5/ch05-property-placeholder-example`（该项目展示了一个使用 Spring `PropertyOverrideConfigurer`\
  \ 的 Spring 应用程序。要运行该应用程序，请执行该项目中 `SampleApp` 类的主方法。）\n\n### PropertyOverrideConfigurer\
  \ 示例\n\n下面的示例显示了 `DataSource` 和 `WebServiceConfiguration` 类的 bean 定义，我们将使用 `PropertyOverrideConfigurer`\
  \ 设置它们的属性：\n\n**示例 5-32** – `applicationContext.xml` - `DataSource` 和 `WebServiceConfiguration`\
  \ 的 bean 定义\n\n**项目** – `ch05-property-override-example`\n\n**源位置 -** `src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"datasource\" class=\"sample.spring.chapter05.domain.DataSource\"\
  >\n    <property name=\"url\" value=\"test url value\" />\n    <property name=\"\
  username\" value=\"test username value\" />\n    <property name=\"password\" value=\"\
  test password value\" />\n    <property name=\"driverClass\" value=\"test driverClass\
  \ value\" />\n</bean>\n<bean id=\"webServiceConfiguration\" class=\"sample.spring.chapter05.domain.WebServiceConfiguration\"\
  >\n    <property name=\"webServiceUrl\" value=\"this webservice url needs to be\
  \ replaced\" />\n</bean>\n```\n\n在上面的示例中，`<bean>` 元素的 `value` 属性指定了 bean 属性的默认值。\n\
  \n下面的示例显示了 `PropertyOverrideConfigurer` 类的 bean 定义，它用从 `database.properties` 和 `webservice.properties`\
  \ 文件读取的值替换示例 5-32 所示的 bean 属性默认值：\n\n**示例 5-33** – `applicationContext.xml` - PropertyOverrideConfigurer\
  \ 配置\n\n**项目** – `ch05-property-override-example`\n\n**源位置 -** `src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean class=\"org.springframework.beans.factory.config.PropertyOverrideConfigurer\"\
  >\n    <property name=\"locations\">\n        <list>\n            <value>classpath:database.properties</value>\n\
  \        </list>\n    </property>\n</bean>\n```\n\n\n\n\n```xml\n        <value>classpath:webservice.properties</value>\n\
  </list>\n</property>\n</bean>\n```\n\n在上面的示例列表中，`PropertyOverrideConfigurer` 的 `locations`\
  \ 属性指定了包含 bean 属性值的属性文件。\n\n注意：与其直接配置 `PropertyOverrideConfigurer`，你可以使用 Spring\
  \ context schema 中的 `<property-override>` 元素来配置 `PropertyOverrideConfigurer` 实例。\n\
  \n下面的示例显示了 `database.properties` 和 `webservice.properties` 文件，它们包含了 bean 属性的值：\n\
  \n**示例列表 5-34** – 在 `database.properties` 和 `webservice.properties` 中定义的属性\n\n**项目**\
  \ – `ch05-propertyOverrideConfigurer-example`\n\n**源位置 -** `src/main/resources/META-INF`\n\
  \n----------------** database.properties 文件 ------------------\n```properties\n\
  datasource.url=some_url\ndatasource.username=some_username\ndatasource.password=some_password\n\
  ```\n----------------** webservice.properties 文件 ------------------\n```properties\n\
  webServiceConfiguration.webServiceUrl=some_url\n```\n\n`database.properties` 和 `webservice.properties`\
  \ 文件中的条显示属性名遵循模式：`<bean-name>.<property-name>`。当 Spring 容器加载 bean 定义时，`PropertyOverrideConfigurer`\
  \ 会将 bean 属性的默认值替换为从 `database.properties` 和 `webservice.properties` 文件中读取的该属性值。例如，`datasource`\
  \ bean 的 `url` 属性设置为 `database.properties` 文件中定义的 `datasource.url` 属性值。同样，`webServiceConfiguration`\
  \ bean 的 `webServiceUrl` 属性设置为 `webservice.properties` 文件中定义的 `webServiceConfiguration.webServiceUrl`\
  \ 属性值。\n\n如果从外部属性文件中未找到 bean 属性的值，则该 bean 属性将保留其默认值。示例列表 5-32 显示 `datasource` bean\
  \ 的 `driverClass` 属性默认值为‘test driverClass value’。示例列表 5-34 显示 `database.properties`\
  \ 或 `webservice.properties` 文件中没有定义名为 `datasource.driverClass` 的属性；因此，`driverClass`\
  \ bean 属性保留其默认值。\n\n`ch05-propertyOverrideConfigurer-example` 项目中 `SampleApp` 类的\
  \ `main` 方法从 `ApplicationContext` 中检索 `WebServiceConfiguration` 和 `DataSource` bean，并在控制台上打印它们的属性。如果你执行\
  \ `SampleApp` 的 `main` 方法，你将在控制台上看到以下输出：\n\n```\nDataSource [url=some_url, username=some_username,\
  \ password=some_password, driverClass=test driver Class value]\nWebServiceConfiguration\
  \ [webServiceUrl=some_url]\n```\n\n上述输出显示，除了 `driverClass` 之外，所有 bean 属性的默认值都被外部属性文件中指定的属性值替换。\n\
  \n由于 `PropertyOverrideConfigurer` 和 `PropertySourcesPlaceholderConfigurer` 继承自 Spring\
  \ 的 `PropertyResourceConfigurer` 类，你会注意到这两个类共享许多共同配置选项。例如，你可以设置 `PropertyOverrideConfigurer`\
  \ 的 `localOverride` 属性来控制本地属性是否优先于从外部属性文件中读取的属性，你可以设置 `PropertyOverrideConfigurer`\
  \ 的 `properties` 属性来定义本地属性，等等。\n\n## 5-5 总结\n\n在本章中，我们学习了如何为 bean 实例添加自定义的初始化和销毁逻辑。我们还查看了如何使用\
  \ `BeanPostProcessor` 实现来修改新创建的 bean 实例，以及使用 `BeanFactoryPostProcessor` 实现来修改 bean\
  \ 定义。Spring 内部利用 `BeanPostProcessors` 和 `BeanFactoryPostProcessors` 来提供许多框架功能。在下一章中，我们将查看\
  \ Spring 对注解驱动开发的支持。\n\n# 第 6 章 - Spring 的注解驱动开发\n\n## 6-1 简介\n\n在之前的章节中，我们看到应用上下文\
  \ XML 文件中包含的 bean 定义被 Spring 容器用作创建 bean 实例的蓝图。bean 定义了 bean 依赖、bean 的初始化和销毁方法、bean\
  \ 实例的懒加载或预加载策略、bean 范围等信息。在本节中，我们将查看可以使用在 bean 类本身中指定相同信息的注解，从而节省在 application context\
  \ XML 文件中显式配置 bean 的精力。我们还将触及 *Spring 表达式语言* (SpEL) 以及如何使用 Spring 的 `Validator`\
  \ 接口和 JSR 303 注解来验证对象。本章将最后查看如何使用 Spring 的 `@Configuration` 和 `@Bean` 注解编程地定义 Spring\
  \ beans。\n\n让我们首先查看 Spring 的 `@Component` 注解，它表示特定类代表一个 Spring 组件。\n\n## 6-2 使用\
  \ @Component 标识 Spring 组件\n\nSpring 的 `@Component` 注解是一种类型级注解，表示一个类代表一个 Spring 组件。建议使用更专门的\
  \ `@Component` 注解形式来标记应用程序的控制器、和服务数据访问对象 (DAO)。例如，使用 `@Controller` 注解控制器，使用 `@Service`\
  \ 注解服务，使用 `@Repository` 注解 DAO。\n\n导入 `chapter6/ch06-bankapp-annotations`（该项目展示了使用注解向\
  \ Spring 容器注册 bean 并自动注入依赖的 MyBank 应用。要运行应用程序，请执行该项目 `BankApp` 类的 `main` 方法。）\n\n\
  下面的示例显示了使用 `@Service` 注解的 MyBank `FixedDepositServiceImpl` 类：\n\n**示例列表 6-1** –\
  \ `FixedDepositServiceImpl` 类 - `@Service` 注解用法\n\n**项目** – `ch06-bankapp-annotations`\n\
  \n**源位置 -** `src/main/java/sample/spring/chapter06/bankapp/service`\n\n```java\n\
  package sample.spring.chapter06.bankapp.service;\n\nimport org.springframework.stereotype.Service;\n\
  \n@Service(value=\"FixedDepositService\")\npublic class FixedDepositServiceImpl\
  \ implements FixedDepositService { ... }\n```\n\n由于 `FixedDepositServiceImpl` 类使用了\
  \ `@Service` 注解，该类代表一个 Spring 组件。`@Service` 注解接受一个 `value` 属性，该属性指定组件注册到 Spring\
  \ 容器时的名称。例如，`FixedDepositServiceImpl` 类以 `FixedDepositService` 的名称注册到 Spring 容器。`value`\
  \ 属性的作用与 `<bean>` 元素的 `id` 属性相同。\n\n`@Service`、`@Component`、`@Repository` 和 `@Controller`\
  \ 注解通过 `value` 属性指定名称。你可以在不显式指定 `value` 属性的情况下指定名称。这意味着 `@Service(value=\"FixedDepositService\"\
  )` 等于 `@Service(\"FixedDepositService\")`。如果你没有为组件名称，Spring 假设组件名称与类名称相同。唯一的区别是组件名称以小字母开头。你应该为组件指定自定义名称，因为这在按名称自动注入依赖时非常有帮助。\n\
  \n如果你启用了 Spring 的类路径扫描功能，带有 `@Component`、`@Controller`、`@Service` 或 `@Repository`\
  \ 注解的 bean 类将自动注册到 Spring 容器。你通过使用 Spring context schema 中的 `<component-scan>` 元素启用\
  \ Spring 的类路径扫描功能。\n\n下面的示例显示了 `<component-scan>` 元素用法：\n\n**示例列表 6-2** – `applicationContext.xml`\n\
  \n**项目** – `ch06-bankapp-annotations`\n\n**源位置 -** `src/main/resources/META-INF/spring`\n\
  \n\n\n\n\n```xml\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\n\
  \    xmlns:context=\"http://www.springframework.org/schema/context\"\n    xsi:schemaLocation=\"\
  .....http://www.springframework.org/schema/context\n        http://www.springframework.org/schema/context/spring-context-4.0.xsd\"\
  >\n    <context:component-scan base-package=\"sample.spring\"/>\n</beans>\n```\n\
  \n在上面的示例列表中，包含了对 Spring context schema 的引用，以便访问其元素。`<component-scan>` 元素的 `base-package`\
  \ 属性指定了用逗号分隔的包列表，用于在这些包中搜索 Spring 组件。由于 `base-package` 属性的值为 `sample.spring`，Spring\
  \ 会 `sample.spring` 包及其子包中搜索 Spring 组件。由于示例 6-1 所示的 `FixedDepositServiceImpl` 类使用了\
  \ `@Service` 注解，并且位于 `sample.spring.chapter06.bankapp.service` 包中，上述示例列表中的 `<component-scan>`\
  \ 元素会自动将 `FixedDepositServiceImpl` 类作为 bean 注册到 Spring 容器中。这等于在应用上下文 XML 文件中为 `FixedDepositServiceImpl`\
  \ 类进行如下 bean 定义：\n\n**示例列表 6-3** – `FixedDepositServiceImpl` 类的 bean 定义\n\n```xml\n\
  <bean id=\"FixedDepositService\" \n      class=\"sample.spring.chapter06.bankapp.service.FixedDepositServiceImpl\"\
  \ />\n```\n\n如果你想过滤掉考虑自动注册到 Spring 容器的组件类，可以使用 `<component-scan>` 元素的 `resource-pattern`\
  \ 属性。`resource-pattern` 属性的默认值为 `/*.class`，这意味着 `base-package` 属性所指定的包下的所有组件类都将会在考虑范围内自动注册。`<component-scan>`\
  \ 元素的子元素 `<include-filter>` 和 `<exclude-filter>` 提供了一种更简洁的方式来指定应该被考虑自动注册的组件类以及应该忽略的类。例如，下面的示例列表展示了\
  \ `<include-filter>` 和 `<exclude-filter>` 元素的用法示例：\n\n**示例列表 6-4** – `<include-filter>`\
  \ 和 `<exclude-filter>` 元素\n\n```xml\n<beans .....>\n    <context:component-scan\
  \ base-package=\"sample.example\">\n        <context:include-filter type=\"annotation\"\
  \ expression=\"example.annotation.MyAnnotation\"/>\n        <context:exclude-filter\
  \ type=\"regex\" expression=\".*Details\"/>   \n    </context:component-scan>\n\
  </beans>\n```\n\n`<exclude-filter>` 和 `<include-filter>` 元素定义了一个 `type` 属性，用于指定用于过滤组件类的策略，而\
  \ `expression` 属性指定了相应的过滤器表达式。在上面的示例列表中，`<include-filter>` 元素指定标记有 `MyAnnotation`\
  \ 类型级别注解的组件类将自动注册到 Spring 容器中，而 `<exclude-filter>` 元素指定名称以 `Details` 结尾的组件类将被 `<component-scan>`\
  \ 元素忽略。\n\n下表描述了 `<include-filter>` 和 `<exclude-filter>` 元素的 `type` 属性可以接受可能的值：\n\
  \n| `type` 属性的值 |  |\n| :--- | :--- |\n| annotation | 如果 `type` 属性的值为 `annotation`，则\
  \ `expression` 属性指定组件类*必须*标记的注解的全限定类名。例如，如果 `expression` 属性的值为 `example.annotation.MyAnnotation`，则标记有\
  \ `MyAnnotation` 注解的组件类将被考虑包含（对于 `<include-filter>` 元素）或排除（对于 `<exclude-filter>`\
  \ 元素）。 |\n| assignable | 如果 `type` 属性的值为 `assignable`，则 `expression` 属性指定组件类必须赋值的类或接口的全限定名。\
  \ |\n| aspectj | 如果 `type` 属性的值为 `aspectj`，则 `expression` 属性指定一个用于过滤组件类的 AspectJ\
  \ 表达式。 |\n| regex | 如果 `type` 属性的值为 `regex`，则 `expression` 属性指定一个通过名称过滤组件类的正则表达式。\
  \ |\n| custom | 如果 `type` 属性的值为 `custom`，则通过 `expression` 属性指定 `org.springframework.core.type.TypeFilter`\
  \ 接口的实现用于过滤组件类。 |\n\n**注意** 在本节中，我们查看了 `@Service` 注解的用法示例。`@Component`、`@Controller`\
  \ 和 `@Repository` 注解的指定方式与 `@Service` 注解相同。参考 `ch06-bankapp-annotations` 项目中的 `CustomerRegistrationDetails`\
  \ 和 `CustomerRequestDetails` 类查看 `@Component` 注解的用法。参考 `ch06-bankapp-annotations`\
  \ 项目包含的 DAO 类查看 `@Repository` 注解的用法。\n\n由于 Spring 组件*没有*定义在应用上下文 XML 文件中，你无法使用 `<property>`\
  \ 或 `<constructor-arg>` 元素来指定它们的依赖。因此，Spring 组件使用 `@Autowired`、`@Inject` 等注解来指定它们的依赖。\n\
  \n现在让我们来看 Spring 的 `@Autowired` 注解。\n\n## 6-3 @Autowired - *按类型*自动装配依赖\n\n`@Autowired`\
  \ 注解用于*按类型*自动装配依赖。`@Autowired` 注解提供了与第 4 章讨论的 Spring 自动装配功能相同的功能，但 `@Autowired`\
  \ 注解提供了一种更灵活的 bean 装配方式。`@Autowired` 注解可以使用*构造函数级别*、*方法级别*和*字段级别*。\n\n下面的示例列表了在字段级别使用\
  \ `@Autowired` 注解的 `AccountStatementServiceImpl` 类：\n\n**示例列表 6-5** – 字段级别的 `AccountStatementServiceImpl`\
  \ 类 - `@Autowired` 用法\n\n**项目** – `ch06-bankapp-annotations`\n\n**源文件** - `src/main/java/sample/spring/chapter06/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter06.bankapp.service;\n\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.stereotype.Service;\n\n@Service(\"accountStatementService\"\
  )\npublic class AccountStatementServiceImpl implements AccountStatementService {\n\
  \n    @Autowired\n    private AccountStatementDao accountStatementDao;\n\n    @Override\n\
  \    public AccountStatement getAccountStatement(Date from, Date to) {\n       \
  \ return accountStatementDao.getAccountStatement(from, to);\n    }\n}\n```\n\n在上面的示例列表中，类型为\
  \ `AccountStatementDao` 的 `accountStatementDao` 字段标记了 `@Autowired` 注解。当创建 `AccountStatementServiceImpl`\
  \ 的实例时，Spring 的 `AutowiredBeanPostProcessor`（一个 `BeanPostProcessor` 实现）负责自动装配 `accountStatementDao`\
  \ 字段。`AutowiredBeanPostProcessor` 从 Spring 容器中获取 `AccountStatementDao` 类型的 bean\
  \ 引用并将其赋值给 `accountStatementDao` 字段。需要注意的是，标记了 `@Autowired` 的字段*不需要*是公共的，也不需要相应的公共\
  \ setter 方法。\n\n**注意** Spring 的 `AutowiredBeanPostProcessor` 执行对标记有 Spring `@Autowired`\
  \ 注解或 JSR 330 的 `@Inject` 注解（在第 6-5 节解释）的字段、方法和构造函数的自动装配。\n\n下面的示例列表展示了在方法级别使用 `@Autowired`\
  \ 注解的 `CustomerRegistrationServiceImpl` 类：\n\n**示例列表 6-6** – 方法级别的 `CustomerRegistrationServiceImpl`\
  \ 类 - `@Autowired` 用法\n\n**项目** – `ch06-bankapp-annotations`\n\n**源文件** - `src/main/java/sample/spring/chapter06/bankapp/service`\n\
  \n```java\n@Service(\"customerRegistrationService\")\n```\n\n\n\n\n\n```java\n@Scope(value\
  \ = ConfigurableBeanFactory.SCOPE_PROTOTYPE)\n\npublic class CustomerRegistrationServiceImpl\
  \ implements CustomerRegistrationService {\n\n    private CustomerRegistrationDetails\
  \ customerRegistrationDetails;\n\n    .....\n\n    @Autowired\n    public void obtainCustomerRegistrationDetails(\n\
  \            CustomerRegistrationDetails customerRegistrationDetails) {\n      \
  \  this.customerRegistrationDetails = customerRegistrationDetails;\n    }\n\n  \
  \  .....\n\n    @Override\n    public void setAccountNumber(String accountNumber)\
  \ {\n        customerRegistrationDetails.setAccountNumber(accountNumber);\n    }\n\
  \n    .....\n}\n```\n\n在上面的示例列表中，`obtainCustomerRegistrationDetails` 方法标记了 `@Autowired`\
  \ 注解。如果一个方法被标记了 `@Autowired` 注解，该方法的参数将会被自动装。由于 `obtainCustomerRegistrationDetails`\
  \ 方法标记了 `@Autowired` 注解，其 `CustomerRegistrationDetails` 参数将*按类型*进行自动装。需要注意的是，被 `@Autowired`\
  \ 注解的方法*不需要*是公的（public）。\n\n**注意** 标记了 `@Autowired` 注解的方法会在组件实例创建后被调用，而带有 `@Autowired`\
  \ 注解的字段将会被注入匹配的 bean 实例。\n\n下面的示例列表展示了 `CustomerRequestServiceImpl` 类，它定义了一个标记了\
  \ `@Autowired` 注解的构造函数：\n\n**示例列表 6-7** – CustomerRequestServiceImpl 类 - 构造函数级别的\
  \ @Autowired 注解使用\n\n**项目** – `ch06-bankapp-annotations`\n\n**源位置** --src/main/java/sample/spring/chapter06/bankapp/service\n\
  \n```java\npackage sample.spring.chapter06.bankapp.service;\n\n@Service(value=\"\
  customerRequestService\")\npublic class CustomerRequestServiceImpl implements CustomerRequestService\
  \ {\n\n    private CustomerRequestDetails customerRequestDetails;\n    private CustomerRequestDao\
  \ customerRequestDao;\n\n    @Autowired\n    public CustomerRequestServiceImpl(CustomerRequestDetails\
  \ customerRequestDetails,\n            CustomerRequestDao customerRequestDao) {\n\
  \        this.customerRequestDetails = customerRequestDetails;\n        this.customerRequestDao\
  \ = customerRequestDao;\n    }\n\n    .....\n}\n```\n\n在上面的示例列表中，`CustomerRequestServiceImpl`\
  \ 的构造函数标记了 `@Autowired` 注解。如果一个构造函数被标记了 `@Autowired` 注解，该构造函数的参数将会被自动装。由于 `CustomerRequestServiceImpl`\
  \ 的构造函数标记了 `@Autowired` 注解，其 `CustomerRequestDetails` 和 `CustomerRequestDao` 参数将*按类型*进行自动装。需要注意的是，被\
  \ `@Autowired` 注解的构造函数*不需要*是公的（public）。\n\n当使用 `@Autowired` 注解时，如果找不到匹配所需类型的 bean，将抛出异常。例如，在示例列表\
  \ 6-7 中，如果未在 Spring 容器中找到注册类型为 `CustomerRequestDetails` 或 `CustomerRequestDao` 的\
  \ bean，则在创建 `CustomerRequestServiceImpl` 实例时会抛出异常。`@Autowired` 的 `required` 属性指定了自动装依赖是强制的还是可选的。如果你将\
  \ `@Autowired` 的 `required` 属性值设置为 `false`，则依赖的自动装被认为是*可选的*。这意味着如果 `required` 属性的值设置为\
  \ `false`，即使在 Spring 容器中没有找到匹配所需类型的 bean，也不会抛出异常。默认情况下，`required` 属性的值为 `true`；依赖必须由\
  \ Spring 容器满足。\n\n如果一个组件类定义了一个 `required` 属性值设置为 `true` 的 `@Autowired` 注解构造函数，它*不能*拥有另一个标记了\
  \ `@Autowired` 注解的构造函数。例如，考虑下面的示例列表，它定义了两个标记了 `@Autowired` 注解的构造函数：\n\n**示例列表 6-8**\
  \ – 定义了 2 个 @Autowired 注解构造函数的组件类\n\n```java\n@Service(value=\"customerRequestService\"\
  )\npublic class CustomerRequestServiceImpl implements CustomerRequestService {\n\
  \n    .....\n\n    @Autowired(required=false)\n    public CustomerRequestServiceImpl(CustomerRequestDetails\
  \ customerRequestDetails) { ..... }\n\n    @Autowired\n    public CustomerRequestServiceImpl(CustomerRequestDetails\
  \ customerRequestDetails,\n            CustomerRequestDao customerRequestDao) {\
  \ ..... }\n}\n```\n\n由于在上面的示例列表中，其中一个构造函数需要自动装依赖项（`@Autowired` 的 `required` 属性设置为\
  \ `true`），而另一个是可选的（`@Autowired` 的 `required` 属性设置为 `false`），这会导致 Spring 抛出异常。\n\n\
  一个组件类可以定义多个 `required` 属性值设置为 `false` 的 `@Autowired` 注解构造函数。在这种情况下，Spring 将调用其中一个构造函数来创建组件类的实例。下面的示例列表展示了一个组件类，它定义了两个标记了\
  \ `@Autowired`（required = `false`）的构造函数以及一个默认构造函数：\n\n**示例列表 6-9** – 定义了多个 `required`\
  \ 属性值设置为 false 的 @Autowired 注解构造函数的组件类\n\n```java\n@Service(value=\"customerRequestService\"\
  )\npublic class CustomerRequestServiceImpl implements CustomerRequestService {\n\
  \n    public CustomerRequestServiceImpl() { }\n\n    @Autowired(required=false)\n\
  \    public CustomerRequestServiceImpl(CustomerRequestDetails customerRequestDetails)\
  \ { ..... }\n\n    @Autowired(required=false)\n    public CustomerRequestServiceImpl(CustomerRequestDetails\
  \ customerRequestDetails,\n            CustomerRequestDao customerRequestDao) {\
  \ ..... }\n}\n```\n\n在上面的示例列表中，两个标记了 `@Autowired` 注解的构造函数都是 Spring 自动装的候选。将选择满足依赖数量最多的构造函数。对于\
  \ `CustomerRequestServiceImpl`，如果注册了类型为 `CustomerRequestDetails` 和 `CustomerRequestDao`\
  \ 的 bean，Spring 会调用 `CustomerRequestServiceImpl(CustomerRequestDetails, CustomerRequestDao)`\
  \ 构造函数。如果容器中注册了类型为 `CustomerRequestDetails` 的 bean 但没有注册类型为 `CustomerRequestDao`\
  \ 的 bean，则调用 `CustomerRequestServiceImpl(CustomerRequestDetails)` 构造函数。如果一个都没有找到，则调用\
  \ `CustomerRequestServiceImpl` 的默认构造函数。\n\n## 6-4 @Qualifier – 按名称自动装依赖*\n\n现在让我们看看如何将\
  \ Spring 的 `@Qualifier` 注解配合 `@Autowired` 注解来*按名称*自动装依赖。`@Qualifier` 注解可以用字段级别、方法参数级别和构造函数参数级别。\n\
  \n下面的示例列表展示未使用 `@Qualifier` 注解的 `FixedDepositServiceImpl` 类：\n\n**示例列表 6-10** –\
  \ FixedDepositServiceImpl 类 - @Qualifier 注解使用\n\n**项目** – `ch06-bankapp-annotations`\n\
  \n**源位置** --src/main/java/sample/spring/chapter06/bankapp/service\n\n```java\npackage\
  \ sample.spring.chapter06.bankapp.service;\n\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.beans.factory.annotation.Qualifier;\n\n@Service(value=\"\
  FixedDepositService\")\npublic class FixedDepositServiceImpl implements FixedDepositService\
  \ {\n\n    @Autowired\n    @Qualifier(value=\"myFixedDepositDao\")\n    private\
  \ FixedDepositDao myFixedDepositDao;\n\n    .....\n}\n```\n\n在上面的示例列表中，`myFixedDepositDao`\
  \ 字段标记了 `@Autowired` 和 `@Qualifier` 注解。`@Qualifier` 注解的 `value` 属性指定了分配给 `myFixedDepositDao`\
  \ 字段的 bean 名称。\n\n\n\n\nSpring 首先通过“类型”（by type）为标记了 `@Autowired` 注解的字段、构造函数和方法查找自动装配候选。然后，Spring\
  \ 使用 `@Qualifier` 注解指定的 Bean 名称从自动装配候选列表中定位一个*唯一*的 Bean。例如，在示例 6-10 中，Spring 首先为\
  \ `myFixedDepositDao` 字段查找类型为 `FixedDepositDao` 的 Bean，然后从自动装配候选列表中定位名为 `myFixedDepositDao`\
  \ 的 Bean。如果找到名为 `myFixedDepositDao` 的 Bean，Spring 将将其赋值给 `myFixedDepositDao` 字段。\n\
  \n**注意** -`@Qualifier(value=\"myFixedDepositDao\")` 等同于 `@Qualifier(\"myFixedDepositDao\"\
  )`；你不需要使用 `value` 属性来指定要自动装配的 Bean 名称。\n\n接下来的示例展示了在方法参数级别和构造函数参数级别使用 `@Qualifier`\
  \ 注解的方法：\n\n**示例 6-11** – 方法参数级别和构造函数参数级别的 `@Qualifier` 使用\n\n```java\npublic class\
  \ Sample {\n\n    @Autowired\n\n    public Sample(@Qualifier(\"aBean\") ABean bean)\
  \ { .... }\n\n    @Autowired\n\n    public void doSomething(@Qualifier(\"bBean\"\
  ) BBean bean, CBean cBean) { ..... }\n\n}\n```\n\n在上述示例中，`@Qualifier` 注解指定了构造函数参数和方法参数。在创建\
  \ `Sample` 类的实例时，Spring 找到一个名为 `aBean` 的类型为 `ABean` 的 Bean，并将其作为参数传递给 `Sample` 类的构造函数。调用\
  \ `Sample` 的 `doSomething` 方法时，Spring 找到一个类型为 `BBean`（名称为 `bBean`）的另一个 Bean，并将这两个\
  \ Bean 作为参数传递给 `doSomething` 方法。需要注意的是，`BBean` 依赖是*按名称*自动装配的，而 `CBean` 依赖是*按类型*自动装配的。\n\
  \n现在来看 JSR 330 的 `@Inject` 和 `@Named` 注解，你可以用它们代替 Spring 的 `@Autowired` 和 `@Qualifier`\
  \ 注解。\n\n## 6-5 JSR 330 的 `@Inject` 和 `@Named` 注解\n\nJSR 330（Java 依赖注入）标准化了 Java\
  \ 平台的依赖注入注解。JSR 330 定义了 `@Inject` 和 `@Named` 注解，分别类似于 Spring 的 `@Autowired` 和 `@Qualifier`\
  \ 注解。Spring 提供了 `@Inject` 和 `@Named` 注解的支持。\n\n**导入** `chapter 6/ch06-bankapp-jsr330`（该项目展示了\
  \ `MyBank` 应用，它使用 JSR 330 的 `@Inject` 和 `@Named` 注解来自动装配依赖。要运行该应用程序，请执行项目中 `BankApp`\
  \ 类的 main 方法。）\n\n接下来的示例展示了使用 JSR 330 的 `@Inject` 和 `@Named` 注解的 `FixedDepositServiceImpl`\
  \ 类：\n\n**示例 6-12** – `FixedDepositServiceImpl` 类\n\n**项目** – `ch06-bankapp-jsr330`\n\
  \n**源码位置** -`src/main/java/sample/spring/chapter06/bankapp/service`\n\n```java\n\
  package sample.spring.chapter06.bankapp.service;\n\nimport javax.inject.Inject;\n\
  import javax.inject.Named;\n\n@Named(value=\"FixedDepositService\")\npublic class\
  \ FixedDepositServiceImpl implements FixedDepositService {\n\n    @Inject\n\n  \
  \  @Named(value=\"myFixedDepositDao\")\n    private FixedDepositDao myFixedDepositDao;\n\
  \n    .....\n}\n```\n\n如果你将上述示例中的 `FixedDepositServiceImpl` 类与示例 6-10 中的 `FixedDepositServiceImpl`\
  \ 类对比，你会发现 JSR 330 的 `@Named` 注解取代了 `@Service` 和 `@Qualifier` 注解，而 JSR 330 的 `@Inject`\
  \ 注解取代了 `@Autowired` 注解。\n\n`@Autowired` 和 `@Inject` 注解具有相同的语义；它们用于*按类型*自动装配依赖。与\
  \ `@Autowired` 注解一样，`@Inject` 可以用于方法级别、构造函数级别和字段级别。构造函数的依赖注入首先执行，然后是字段，最后是方法。我们之前看到过\
  \ `@Autowired` 注解的 `required` 属性指定了自动装配依赖是强制性的还是可选的。`@Inject` 没有任何等同于 `@Autowired`\
  \ 注解 `required` 属性的属性。\n\n如果在类型级别使用 `@Named` 注解，它的作用类似于 Spring 的 `@Component` 注解。如果在方法参数级别或构造函数参数级别使用\
  \ `@Named` 注解，它的作用类似于 Spring 的 `@Qualifier` 注解。如果一个类标记了 `@Named` 注解，Spring 上下文架构的\
  \ `<component-scan>` 元素将其视为标记了 `@Component` 注解的组件类。\n\n要使用 `@Named` 和 `@Inject`\
  \ 注解，你需要在项目中包含 JSR 330 JAR 文件。`ch06-bankapp-jsr330` 项目通过 `pom.xml` 文件中的 `<dependency>`\
  \ 元素包含了 JSR 330 JAR 文件：\n\n```xml\n<dependency>\n    <groupId>javax.inject</groupId>\n\
  \    <artifactId>javax.inject</artifactId>\n    <version>1</version>\n</dependency>\n\
  ```\n\n在第 5 章中，我们查看了 JSR 250 的 `@PostConstruct` 和 `@PreDestroy` 注解，它们用于标识 Bean 的初始化和销毁方法。现在来看\
  \ JSR 250 的 `@Resource` 注解，你可以用它*按名称*自动装配依赖。\n\n## 6-6 JSR 250 的 `@Resource` 注解\n\
  \nSpring 通过 JSR 250 的 `@Resource` 注解支持*按名称*自动装配字段和方法。@Resource` 注解的 `name` 属性指定要自动装配的\
  \ Bean 名称。需要注意的是，你不能将 `@Resource` 注解用于构造函数参数。\n\n接下来的示例展示了如何使用 `@Resource` 注解重写示例\
  \ 6-12 中的 `FixedDepositServiceImpl` 类：\n\n**示例 6-13** – 字段级别的 `@Resource` 使用\n\n\
  ```java\nimport javax.annotation.Resource;\n\n@Named(value=\"FixedDepositService\"\
  )\npublic class FixedDepositServiceImpl implements FixedDepositService {\n\n   \
  \ @Resource(name=\"myFixedDepositDao\")\n    private FixedDepositDao myFixedDepositDao;\n\
  \n    .....\n}\n```\n\n在上述示例中，`@Resource` 注解用于装配 `myFixedDepositDao` 字段。由于 `name`\
  \ 属性的值为 `myFixedDepositDao`，Spring 在容器中定位名为 `myFixedDepositDao` 的 Bean 并将其赋值给 `myFixedDepositDao`\
  \ 字段。\n\n与其使用 `@Autowired` 和 `@Qualifier` 注解，不如使用 `@Resource` 注解*按名称*自动装配。正如之前提到的，如果你使用\
  \ `@Autowired`-`@Qualifier` 组合来按名称自动装配，Spring 首先根据字段（或构造函数参数）的类型查找 Bean，然后根据 `@Qualifier`\
  \ 注解指定的名称缩小到唯一的 Bean。但是，如果你使用 `@Resource` 注解，Spring 使用 `@Resource` 注解指定的 Bean 名称来定位唯一的\
  \ Bean。这意味着当你使用 `@Resource` 注解时，Spring *不*考虑字段（或 setter 方法参数）的类型。\n\n**注意** 由于 `@Autowired`、`@Inject`\
  \ 和 `@Resource` 注解是由 `BeanPostProcessor` 处理的，你不应该在实现了 `BeanFactoryPostProcessor`\
  \ 或 `BeanPostProcessor` 接口的组件类中使用这些注解。\n\n## 6-7 @Scope, @Lazy, @DependsOn 和 @Primary\
  \ 注解\n\n使用 Spring 的 `@Scope` 注解指定 Spring 组件的作用范围（原型或单例）。默认情况下，Spring 组件是单例作用的。如果你希望\
  \ Spring 组件是原型作用的，则必须通过 `@Scope` 注解进行指定。`@Scope` 注解的作用与 `<bean>` 元素的 `scope` 属性相同（参阅第\
  \ 2 章第 5 节了解更多关于 scope 属性的信息）。\n\n接下来的示例展示了使用 `@Scope` 注解的 `CustomerRequestDetails`\
  \ 类：\n\n**示例 6-14** – `@Scope` 使用\n\n**项目** – `ch06-bankapp-jsr330`\n\n**源码位置**\
  \ -`src/main/java/sample/spring/chapter06/bankapp/domain`\n\n```java\npackage sample.spring.chapter06.bankapp.domain;\n\
  ```\n\n\n\n\n```java\nimport javax.inject.Named;\n\nimport org.springframework.beans.factory.config.ConfigurableBeanFactory;\n\
  \nimport org.springframework.context.annotation.Scope;\n\n@Named(value=\"customerRequestDetails\"\
  )\n@Scope(value=ConfigurableBeanFactory.SCOPE_PROTOTYPE)\npublic class CustomerRequestDetails\
  \ { ..... }\n```\n\n`@Scope` 注解接受一个 `value` 属性，用于指定组件的作用范围。你可以将 `value` 属性的值设置为\
  \ `prototype` 或 `singleton` 来指示该组件是单例作用范围还是原型作用范围，你也可以将 `value` 属性的值设置为 `ConfigurableBeanFactory`\
  \ 的常量 `SCOPE_SINGLETON`（值为 `singleton`）或 `SCOPE_PROTOTYPE`（值为 `prototype`）。\n\n\
  默认情况下，单例作用范围的 Spring 组件是`eagerly`（积极）初始化的，也就是说它们在 Spring 容器创建时就会被实例化。如果你希望单例作用范围的组件被懒加载，可以在该单例作用范围组件的类定义上加上\
  \ `@Lazy` 注解。\n\n**注意** `@Lazy` 注解的作用与 `<bean>` 元素的 `lazy-init` 属性相同。请参阅第 2 章第 2-5\
  \ 节了解更多关于 lazy-init 属性的信息。\n\n下面的示例展示了 `@Lazy` 注解用法：\n\n**示例 6-15** – `@Lazy` 注解用法\n\
  \n```java\n@Lazy(value=true)\n@Component\npublic class Sample { ..... }\n```\n\n\
  `@Lazy` 注解的 `value` 属性指定组件是被懒加载还是积极初始化。如果 `value` 属性的值为 `true`，则意味着该组件是懒加载的。\n\n\
  你可以使用 `@DependsOn` 注解指定隐式的 bean 依赖。下面的示例展示了 `@DependsOn` 注解用法：\n\n**示例 6-16** –\
  \ `@DependsOn` 注解用法\n\n```java\n@DependsOn(value = {\"beanA\", \"beanB\"})\n@Component\n\
  public class Sample { ..... }\n```\n\n在上面的示例中，`Sample` 类上的 `@DependsOn` 注解指示 Spring\
  \ 容器在创建 `Sample` 类的实例之前先创建 `beanA` 和 `beanB` bean。\n\n**注意** `@DependsOn` 注解的作用与\
  \ `<bean>` 元素的 `depends-on` 属性相同。请参阅第 4 章第 4-3 节了解 `depends-on` 属性。\n\n如果一个依赖有多个自动装配候选，`@Primary`\
  \ 注解会将一个 bean 指定为自动装配的主候选。下面的示例展示了 `@Primary` 注解用法：\n\n```java\n@Primary\n@Component\n\
  public class Sample { ..... }\n```\n\n**注意** `@Primary` 注解的作用与 `<bean>` 元素的 `primary`\
  \ 属性相同。请参阅第 4 章第 4-6 节了解 `primary` 属性。\n\n现在让我们来看 Spring 的 `@Value` 注解，它简化了组件类的配置。\n\
  \n## 6-8 使用 @Value 注解简化组件配置 \n\n在之前的章节中，我们看到过示例，bean 所需的配置信息是通过 `<property>` 和 `<constructor-arg>`\
  \ 元素的 `value` 属性来指定的。由于 Spring 组件没有定义在应用程序上下文 XML 文件中，Spring 的 `@Value` 注解被用于实现\
  \ `<property>` 和 `<constructor-arg>` 元素 `value` 属性相同的功能。你应该注意，`@Value` 注解可以用于字段级、方法级、方法参数级和构造函数参数级。\n\
  \n**重要 第 6 章/ch06-value-annotation**（此项目展示了一个使用 Spring 的 `@Value` 注解来配置 Spring 组件的应用程序。要运行该应用程序，请执行该项目中\
  \ `SampleApp` 类的 main 方法。）\n\n下面的示例展示了字段级 `@Value` 注解的用法：\n\n**示例 6-18** – Sample\
  \ 类 - `@Value` 注解用法\n\n**项目** – ch06-value-annotation\n\n**源码位置** **-src/main/java/sample/spring/chapter06/beans\n\
  \n```java\npackage sample.spring.chapter06.beans;\n\nimport org.springframework.beans.factory.annotation.Value;\n\
  \n@Component(value=\"sample\")\npublic class Sample {\n    @Value(\"Some currency\"\
  )\n    private String currency;\n\n    .....\n}\n```\n\n在上面的示例中，`currency` 字段被 `@Value`\
  \ 注解标记。`@Value` 注解的 `value` 属性指定了字段的默认值。指定 `value` 属性是可选的；因此，`@Value(value=\"Some\
  \ currency\")` 与 `@Value(\"Some currency\")` 相同。\n\n你还可以使用 `Spring Expression Language`\
  \ (SpEL) 表达式作为 `@Value` 注解的值。SpEL 是一种你可以在运行时查询和操作对象的 `expression language`。下面的示例展示了利用\
  \ SpEL 表达式的 `@Value` 注解：\n\n**示例 6-19** – Sample 类 - 使用 SpEL 表达式的 `@Value` 注解\n\n\
  **项目** – ch06-value-annotation\n\n**源码位置** **-src/main/java/sample/spring/chapter06/beans\n\
  \n```java\npackage sample.spring.chapter06.beans;\n\nimport org.springframework.beans.factory.annotation.Value;\n\
  \n@Component(value=\"sample\")\npublic class Sample {\n    @Value(\"#{configuration.environment}\"\
  )\n    private String environment;\n\n    .....\n\n    @Value(\"#{configuration.getCountry()}\"\
  )\n    private String country;\n\n    @Value(\"#{configuration.state}\")\n    private\
  \ String state;\n\n}\n```\n\n上面的示例显示了 `@Value` 指定了一个值 `<spel-expression>`。由 `@Value`\
  \ 注解指定的 SpEL 表达式是由 `BeanPostProcessor` 处理的。SpEL 表达式可以使用 `<beanName>.<field or method>`\
  \ 格式来获取其值。例如，`#{configuration.environment}` 获取名为 bean 的属性，而 `#{configuration.getCountry()}`\
  \ 调用 `getCountry()` 方法。\n\n下面的示例展示了被 SpEL 表达式引用的 bean 类：\n\n**示例 6-20** – Configuration\
  \ 组件\n\n**项目** – ch06-value-annotation\n\n**源码位置** **-src/main/java/sample/spring/chapter06/beans\n\
  \n```java\npackage sample.spring.chapter06.beans;\n\nimport org.springframework.stereotype.Component;\n\
  \n@Component(\"configuration\")\npublic class Configuration {\n    public static\
  \ String environment = \"DEV\";\n\n    public String getCountry() {\n        return\
  \ \"Some country\";\n    }\n\n    public String getState() {\n        return \"\
  Some state\";\n    }\n\n    public String[] splitName(String name) {\n        return\
  \ name.split(\" \");\n    }\n\n    public String getCity() {\n        return \"\
  Some city\";\n    }\n}\n```\n\n上面的示例显示 `Configuration` 类是一个定义了字段和方法的 Spring 组件。如果你对比示例\
  \ 6-19 和 6-20，你会发现 `#{configuration.environment}` 表达式指向 `Configuration` 类中定义的静态\
  \ `environment` 变量，`#{configuration.getCountry()}` 表达式指向 `Configuration` 的 `getCountry()`\
  \ 方法，而 `#{configuration.state}` 表达式指向 `Configuration` 的 `getState()` 方法。\n\n`ch06-value-annotation`\
  \ 项目中 `SampleApp` 类的 main 方法从 `ApplicationContext` 获取 `Sample` bean 实例，并打印该 bean\
  \ 实例各种属性的值。如果你执行 `SampleApp` 的 main 方法，将看到如下输出：\n\nSample [**environment=DEV**,\
  \ currency=Some currency, **country=Some country**, **state=Some state**, splitName=[FirstName,\
  \ LastName], city=Some city]\n\n上面的输出显示：\n\n· `#{configuration.environment}` 表达式导致\
  \ `Sample` environment 字段的值设置为 `DEV`，这是由 `Configuration` 类的公静态字段 `environment` 指定的值。\n\
  \n· `#{configuration.getCountry()}` 表达式导致 `Sample` country 字段的值设置为 `Some country`，这是通过调用\
  \ `Configuration` 的 `getCountry()` 方法返回的值。\n\n\n\n\n\n- `#{configuration.state}`\
  \ 表达式的结果会将 Sample 的 state 字段值设置为 Some state，该值是由调用 `Configuration` 的 `getState`\
  \ 方法返回的。\n\n上面的示例显示，你可以使用 SpEL 从其他 bean 中检索配置信息。\n\n**注意** SpEL 是一种非常强大的表达式语言，它提供的功能比本书中描述的多得多。建议参考\
  \ Spring 参考文档以进一步了解 SpEL。\n\n接下来的示例列表展示在方法级别和方法参数级别上使用 `@Value` 注解的方法：\n\n**示例列表\
  \ 6-21** – Sample 类 - 方法级别和方法参数级别上的 `@Value` 注解用法\n\n**项目** – `ch06-value-annotation`\n\
  \n**源码位置** - `src/main/java/sample/spring/chapter06/beans`\n\n```java\npackage sample.spring.chapter06.beans;\n\
  \nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.beans.factory.annotation.Value;\n\
  \n@Component(value=\"sample\")\npublic class Sample {\n    .....\n\n    private\
  \ String[] splitName;\n    private String city;\n\n    @Autowired\n    public void\
  \ splitName(@Value(\"#{configuration.splitName('FirstName LastName')}\") String[]\
  \ splitName) {\n        this.splitName = splitName;\n    }\n\n    @Autowired\n \
  \   @Value(\"#{configuration.getCity()}\")\n    public void city(String city) {\n\
  \        this.city = city;\n    }\n\n    .....\n}\n```\n\n上面的示例列表显示，标记了 `@Autowired`\
  \ 注解的方法在方法级别和方法参数级别使用了 `@Value` 注解。你应该注意，*只有当*方法被标记了 `@Autowired` 或 `@Resource`\
  \ 或 `@Inject` 注解时，才能在方法级别和方法参数级别使用 `@Value` 注解。SpEL 表达式 `#{configuration.splitName('FirstName\
  \ LastName')}` 的结果是调用 `Configuration` 的 `splitName` 方法并将 ‘FirstName LastName’ 作为参数。这表明\
  \ SpEL 表达式可以调用接受参数的方法。\n\n**注意** `@Value` 注解由 `BeanPostProcessor` 处理；因此，你不应该在实现了\
  \ `BeanFactoryPostProcessor` 或 `BeanPostProcessor` 接口的组件类中使用 `@Value` 注解。\n\nSpEL\
  \ 的用法*并不限于* `@Value` 注解，你也可以在应用上下文 XML 文件的 bean 定义中使用 SpEL。\n\n**导入** `chapter 6/ch06-spel-example`\
  \ （此项目展示了一个在 bean 定义中使用 SpEL 表达式的应用程序。若要运行该应用程序，请执行该项目中 `SampleApp` 类的 main 方法。）\n\
  \n下面的示例列表展示了如何在 bean 定义中使用 SpEL：\n\n**示例列表 6-22** – `applicationContext.xml` – bean\
  \ 定义中的 SpEL 表达式\n\n**项目** – `ch06-spel-example`\n\n**源码位置** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans ..... >\n    <bean id=\"sample\" class=\"sample.spring.chapter06.beans.Sample\"\
  >\n        <property name=\"environment\" value=\"#{configuration.environment}\"\
  \ />\n        <property name=\"currency\" value=\"Some currency\" />\n        <property\
  \ name=\"country\" value=\"#{configuration.getCountry()}\" />\n        <property\
  \ name=\"state\" value=\"#{configuration.state}\" />\n    </bean>\n    <bean id=\"\
  configuration\" class=\"sample.spring.chapter06.beans.Configuration\" />\n</beans>\n\
  ```\n\n上面的示例列表显示，`Sample` 类的 bean 定义使用了 SpEL 表达式（引用 `Configuration` bean）来为 environment、currency、country\
  \ 和 state 属性设置默认值。\n\n现在让我们如何使用 Spring 的 `Validator` 接口在 Spring 应用中对对象进行验证。\n\n\
  ## 6-9 使用 Spring 的 Validator 接口验证对象\n\nSpring 的 `Validator` 接口是 Spring Validation\
  \ API 的一部分，允许你对对象进行验证。你可以在应用程序的任何层中使用 `Validator` 接口执行对象验证。例如，你可以使用 `Validator`\
  \ 接口验证 Web 层以及持久化层中的对象。\n\n**注意** 使用 `Validator` 接口的替代方案是使用 JSR 303 注解来指定应用于对象的约束。JSR\
  \ 303 注解将在下一节中解释。\n\n**导入** `chapter 6/ch06-validator-interface` （此项目展示了使用 Spring\
  \ `Validator` 接口验证 `FixedDepositDetails` 对象的 MyBank 应用程序。若要运行应用程序，请执行 `Bank` 类的\
  \ main 方法。）\n\n`FixedDepositDetails` 对象代表定期存款的详情。接下来的示例列表展示了 `FixedDepositDetails`\
  \ 类：\n\n**示例列表 6-23** – `FixedDepositDetails` 类\n\n**项目** – `ch06-validator-interface`\n\
  \n**源码位置** - `src/main/java/sample/spring/chapter06/domain`\n\n```java\npackage\
  \ sample.spring.chapter06.domain;\n\npublic class FixedDepositDetails {\n    private\
  \ long id;\n    private float depositAmount;\n    private int tenure;\n    private\
  \ String email;\n\n    public FixedDepositDetails(long id, float depositAmount,\
  \ int tenure, String email) {\n        this.id = id;\n        this.depositAmount\
  \ = depositAmount;\n        this.tenure = tenure;\n        this.email = email;\n\
  \    }\n\n    // 实例变量的 getters 和 setters\n    \n    public float getDepositAmount()\
  \ {\n        return depositAmount;\n    }\n    .....\n}\n```\n\n上面的示例列表显示 `FixedDepositDetails`\
  \ 类定义了 `id`、`depositAmount`、`tenure` 和 `email` 实例变量。假设在保存定期存款之前，我们需要确保定期存款金额（由 `depositAmount`\
  \ 实例变量表示）不为 0。\n\n为了验证 `FixedDepositDetails` 对象的 `depositAmount` 属性，我们需要创建一个 Spring\
  \ `Validator` 接口的实现。接下来的示例列表展示了针对 FixedDepositDetails 类型的验证器：\n\n**示例列表 6-24** –\
  \ `FixedDepositValidator` 类 – Spring 的 `Validator` 接口实现\n\n**项目** – `ch06-validator-interface`\n\
  \n**源码位置** - `src/main/java/sample/spring/chapter06/validator`\n\n```java\npackage\
  \ sample.spring.chapter06.validator;\n\nimport org.springframework.validation.Errors;\n\
  import org.springframework.validation.Validator;\n\npublic class FixedDepositValidator\
  \ implements Validator {\n    @Override\n    public boolean supports(Class<?> clazz)\
  \ {\n        return FixedDepositDetails.class.isAssignableFrom(clazz);\n    }\n\n\
  \    @Override\n    public void validate(Object target, Errors errors) {\n     \
  \   FixedDepositDetails fixedDepositDetails = (FixedDepositDetails) target;\n  \
  \      if (fixedDepositDetails.getDepositAmount() == 0) {\n            errors.reject(\"\
  zeroDepositAmount\");\n        }\n    }\n}\n```\n\n`Validator` 接口定义了 `supports`\
  \ 和 `validate` 方法。`supports` 方法检查传入的对象实例（由 `clazz` 属性表示）是否可以被验证。如果 `supports` 返回\
  \ true，则使用 `validate` 方法对对象进行验证。在上面的示例列表中，`FixedDepositValidator` 的 `supports` 方法检查传入的对象是否为\
  \ `FixedDepositDetails` 类型。如果 `supports` 返回 true，`FixedDepositValidator` 的 `validate`\
  \ 方法将验证该对象。`validate` 方法接受待验证的对象实例和一个 `Errors` 实例。`Errors` 实例的 `reject` 方法用于存储验证过程中发生的错误。稍后可以检查\
  \ `Errors` 实例以获取更多关于验证错误的信息。\n\n下面的示例列表显示 `FixedDepositServiceImpl` 的 `createFixedDeposit`\
  \ 方法使用了 `FixedDepositValidator`（参考示例列表 6-24）来验证 `FixedDepositDetails` 对象。\n\n\n\n\
  \n\n### 示例列表 6-25 – `FixedDepositServiceImpl` 类 – 验证 `FixedDepositDetails` 对象\n\n\
  **项目** – `ch06-validator-interface`\n\n**源码位置** - `/src/main/java/sample/spring/chapter06/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter06.bankapp.service;\n\nimport org.springframework.validation.BeanPropertyBindingResult;\n\
  import sample.spring.chapter06.bankapp.validator.FixedDepositValidator;\n\n@Service(value=\"\
  FixedDepositService\")\npublic class FixedDepositServiceImpl implements FixedDepositService\
  \ {\n\n    @Autowired\n    @Qualifier(value=\"myFixedDepositDao\")\n    private\
  \ FixedDepositDao myFixedDepositDao;\n\n    @Override\n    public void createFixedDeposit(FixedDepositDetails\
  \ fixedDepositDetails) throws Exception {\n        BeanPropertyBindingResult bindingResult\
  \ =\n                new BeanPropertyBindingResult(fixedDepositDetails, \"Errors\"\
  );\n        FixedDepositValidator validator = new FixedDepositValidator();\n   \
  \     validator.validate(fixedDepositDetails, bindingResult);\n        if(bindingResult.getErrorCount()\
  \ > 0) {\n            logger.error(\"Errors were found while validating FixedDepositDetails\
  \ instance\");\n        } else {\n            myFixedDepositDao.createFixedDeposit(fixedDepositDetails);\n\
  \            logger.info(\"Created fixed deposit\");\n        }\n    }\n}\n```\n\
  \n`FixedDepositServiceImpl` 的 `createFixedDeposit` 方法在由 `FixedDepositDao` 将 `FixedDepositDetails`\
  \ 对象（由参数 `fixedDepositDetails` 表示）保存到数据存储之前进行验证。上述示例中的 `createFixedDeposit` 方法执行了以下任务：\n\
  \n* 创建 `FixedDepositValidator` 实例和 Spring 的 `BeanPropertyBindingResult` —— 这是 Spring\
  \ 开箱即用的 `Errors` 接口的默认实现。\n* 调用 `FixedDepositValidator` 的 `validate()` 方法，传入 `FixedDepositDetails`\
  \ 对象和 `BeanPropertyBindingResult` 实例。\n* 调用 `BeanPropertyBindingResult` 的 `getErrorCount()`\
  \ 方法检查是否报告了任何验证错误。如果没有报告验证错误，则调用 `FixedDepositDao` 的 `createFixedDeposit()` 方法将定期存款详情保存到数据存储中。\n\
  \n接下来的示例显示了 `BankApp` 的 `main()` 方法，该方法通过调用 `FixedDepositServiceImpl` 的 `createFixedDeposit()`\
  \ 方法（参见示例列表 6-25）来检查 `FixedDepositValidator` 的 `validate()` 方法是否正确执行了验证：\n\n###\
  \ 示例列表 6-26 – `BankApp` 类\n\n**项目** – `ch06-validator-interface`\n\n**源码位置** - `/src/main/java/sample/spring/chapter06/bankapp`\n\
  \n```java\npackage sample.spring.chapter06.bankapp;\n\npublic class BankApp {\n\n\
  \    public static void main(String args[]) throws Exception {\n        ApplicationContext\
  \ context = new ClassPathXmlApplicationContext(\n                \"classpath:META-INF/spring/applicationContext.xml\"\
  );\n        FixedDepositService FixedDepositService = context.getBean(FixedDepositService.class);\n\
  \        FixedDepositService.createFixedDeposit(new FixedDepositDetails(1, 0, 12,\
  \ \"someemail@somedomain.com\"));\n        FixedDepositService.createFixedDeposit(new\
  \ FixedDepositDetails(1, 1000, 12, \"someemail@somedomain.com\"));\n    }\n}\n```\n\
  \n首先，向 `FixedDepositService` 的 `createFixedDeposit` 方法传递一个 `depositAmount` 值为 0\
  \ 的 `FixedDepositDetails` 对象，随后传递一个 `depositAmount` 值为 1000 的 `FixedDepositDetails`\
  \ 对象。\n\n如果你执行 `BankApp` 的 `main()` 方法，你将在控制台上看到以下输出：\n\n```\nErrors were found\
  \ while validating FixedDepositDetails instance\nCreated fixed deposit\n```\n\n\
  输出 `Errors were found while validating FixedDepositDetails instance` 显示，当验证 `depositAmount`\
  \ 值为 0 的 `FixedDepositDetails` 实例时，`FixedDepositValidator` 报告了错误。输出 `Created fixed\
  \ deposit` 显示，当验证 `depositAmount` 值为 1000 的 `FixedDepositDetails` 实例时，没有报告错误。\n\n\
  **注意** Spring 的 `Validator` 接口通常用于基于 Spring MVC 的 Web 应用程序，将用户在 HTML 表单中输入的信息绑定到相应的表单对象。\n\
  \n现在让我们来看看如何使用 JSR 303 注解对 bean 属性指定约束，并让 Spring 执行验证。\n\n## 6-10 使用 JSR 303 注解指定约束\n\
  \n**导入** `chapter 6/ch06-jsr303-validation`（此项目展示使用了 JSR 303 注解的 MyBank 。要运行该应用程序，请执行该项目中\
  \ `BankApp` 类的 main 方法。）\n\n接下来的示例显示了使用了 JSR 303 注角的 `FixedDepositDetails` 类：\n\n\
  ### 示例列表 6-27 – `FixedDepositDetails` 类 – JSR 303 注解\n\n**项目** – `ch06-jsr303-validation`\n\
  \n**源码位置** - `/src/main/java/sample/spring/chapter06/bankapp/domain`\n\n```java\n\
  package sample.spring.chapter06.bankapp.domain;\n\nimport javax.validation.constraints.*;\n\
  \npublic class FixedDepositDetails {\n\n    @NotNull\n    private long id;\n\n \
  \   @Min(1000)\n    @Max(50000)\n    private float depositAmount;\n\n    @Min(6)\n\
  \    private int tenure;\n\n    @NotBlank\n    @Size(min=5, max=100)\n    private\
  \ String email;\n\n    public FixedDepositDetails(long id, float depositAmount,\
  \ int tenure, String email) {\n        this.id = id;\n        this.depositAmount\
  \ = depositAmount;\n        this.tenure = tenure;\n        this.email = email;\n\
  \    }\n}\n```\n\n`@NotNull`、`@Min`、`@Max`、`@NotBlank` 和 `@Size` 是 JSR 303 定义的一些注解。上述列表显示通过使用\
  \ JSR 303 注解，`FixedDepositDetails` 类清晰地指定了适用于字段的约束。另一方面，如果你使用 Spring Validation\
  \ 验证对象，约束信息包含在 `Validator` 实现中（参见示例列表）。\n\n下表描述了 JSR 303 注解对 `FixedDepositDetails`\
  \ 对象强制的约束：\n\n| JSR 303 注解 | 约束描述 |\n| :--- | :--- |\n| `@NotNull` | 注解字段不能为空。例如，`FixedDepositDetails`\
  \ 的 `id` 字段不能为空。 |\n| `@Min` | 注解字段的值大于等于指定的值。例如，`FixedDepositDetails` 对象中 `depositAmount`\
  \ 字段上的 `@Min(1000)` 注解意味着 `depositAmount` 的值大于等于 1000。 |\n| `@Max` | 注解字段的值小于等于指定的值。例如，`FixedDepositDetails`\
  \ 对象中 `depositAmount` 字段上的 `@Max(50000)` 注解意味着 `depositAmount` 的值小于等于 50000。 |\n\
  | `@NotBlank` | 注解字段的值不能为空或 null。例如，`FixedDepositDetails` 的 `email` 字段不能为空或 null。\
  \ |\n| `@Size` | 注解字段的大小在指定的 min 和 max 属性之间。例如，`FixedDepositDetails` 对象中 `email`\
  \ 字段上的 `@Size(min=5, max=100)` 注解意味着 `email` 字段的大小大于等于 5 且小于等于 100。 |\n\n\n\n\n\
  如果你查看示例列表 6-27 中的导入语句，你会发现 `@NotBlank` 注解是由 Hibernate Validator 框架定义的，而不是 JSR 303。Hibernate\
  \ Validator 框架提供了额外的注解，你可以将其与 JSR 303 注解配合使用。\n\n现在，我们已经在 `FixedDepositDetails`\
  \ 类上指定了 JSR 303 约束，让我们如何使用 Spring 来验证 `FixedDepositDetails` 对象。\n\n### Spring 对\
  \ JSR 303 的支持\n\nSpring 支持使用 JSR 303 约束的对象。Spring 的 `LocalValidatorFactoryBean`\
  \ 类负责检测应用程序类路径中是否存在 JSR 303 实现者（如 Hibernate Validator）并对其初始化。需要注意的是，`LocalValidatorFactoryBean`\
  \ 实现了 JSR 303 的 `Validator` 和 `ValidatorFactory` 接口，同时也实现了 Spring 的 `Validator`\
  \ 接口。\n\n下面的示例列表显示了在应用上下文 XML 文件中 `LocalValidatorFactoryBean` 类的配置：\n\n**示例列表 6-28**\
  \ – `applicationContext.xml` – Spring 的 `LocalValidatorFactoryBean` 配置\n\n**Project**\
  \ – `ch06-jsr303-validation`\n\n**Source location** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"validator\" class=\"org.springframework.validation.beanvalidation.LocalValidatorFactoryBean\"\
  \ />\n```\n\n如你所示，`LocalValidatorFactoryBean` 的配置与其他任何 Spring bean 一样。现在我们已经配置了\
  \ `LocalValidatorFactoryBean`，让我们看看它是如何执行验证的。\n\n下面的示例列表显示了 `FixedDepositServiceImpl`\
  \ 类，该类要求在固定存款详情保存到数据存储之前，对 `FixedDepositDetails` 对象进行验证：\n\n**示例列表 6-29** – `FixedDepositServiceImpl`\
  \ 类 – 验证 `FixedDepositDetails` 对象\n\n**Project** – `ch06-jsr303-validation`\n\n\
  **Source location** - `src/main/java/sample/spring/chapter06/bankapp/service`\n\n\
  ```java\npackage sample.spring.chapter06.bankapp.service;\n\nimport org.springframework.validation.BeanPropertyBindingResult;\n\
  import org.springframework.validation.Validator;\n\n.....\n\n@Service(value=\"FixedDepositService\"\
  )\npublic class FixedDepositServiceImpl implements FixedDepositService {\n\n   \
  \ @Autowired\n    private Validator validator;\n\n    @Autowired\n    @Qualifier(value=\"\
  myFixedDepositDao\")\n    private FixedDepositDao myFixedDepositDao;\n\n    @Override\n\
  \    public void createFixedDeposit(FixedDepositDetails fixedDepositDetails) throws\
  \ Exception {\n        BeanPropertyBindingResult bindingResult = new BeanPropertyBindingResult(fixedDepositDetails,\
  \ \"Errors\");\n        validator.validate(fixedDepositDetails, bindingResult);\n\
  \        if(bindingResult.getErrorCount() > 0) {\n            logger.error(\"Errors\
  \ were found while validating FixedDepositDetails instance\");\n        } else {\n\
  \            myFixedDepositDao.createFixedDeposit(fixedDepositDetails);\n      \
  \      logger.info(\"Created fixed deposit\");\n        }\n    }\n}\n```\n\n上面的示例列表显示\
  \ Spring 的 `Validator` 实现被 `validator` 字段引用。由于 `LocalValidatorFactoryBean` 实现了 Spring\
  \ 的 `Validator` 接口，`LocalValidatorFactoryBean` 实例被赋值给 `validator` 字段。`FixedDepositServiceImpl`\
  \ 的 `createFixedDeposit` 方法调用 `Validator` 的 `validate` 方法对 `FixedDepositDetails`\
  \ 对象进行验证。\n\n示例列表 6-29 中值得注意的一个有趣点是，我们*没有*处理 JSR 303 API 来执行 `FixedDepositDetails`\
  \ 对象的验证。相反，我们使用了 Spring Validation API 来执行验证。这是因为 `LocalValidatorFactoryBean` 实现了\
  \ Spring `Validator` 接口的 `validate` 方法，使用 JSR 303 API 执行对象的验证，从而将开发者从特定的 JSR 303\
  \ API 中解放出来。\n\n由于 `LocalValidatorFactoryBean` 实现了 JSR 303 的 `Validator` 和 `ValidatorFactory`\
  \ 接口，你有选择使用 JSR 303 API 来验证 `FixedDepositDetails` 对象。下面的示例列表显示了 `FixedDepositServiceImpl`\
  \ 类的另一种实现，它使用 JSR 303 的 `Validator` 执行验证：\n\n**示例列表 6-30** – `FixedDepositServiceImplJsr303`\
  \ 类 - 验证 `FixedDepositDetails` 对象\n\n**Project** – `ch06-jsr303-validation`\n\n\
  **Source location** - `src/main/java/sample/spring/chapter06/bankapp/service`\n\n\
  ```java\npackage sample.spring.chapter06.bankapp.service;\n\nimport javax.validation.ConstraintViolation;\n\
  import javax.validation.Validator;\n\n@Service(value = \"FixedDepositServiceJsr303\"\
  )\npublic class FixedDepositServiceJsr303Impl implements FixedDepositService {\n\
  \n    @Autowired\n    private Validator validator;\n\n    @Autowired\n    @Qualifier(value=\"\
  myFixedDepositDao\")\n    private FixedDepositDao myFixedDepositDao;\n\n    @Override\n\
  \    public void createFixedDeposit(FixedDepositDetails fixedDepositDetails) throws\
  \ Exception {\n        Set<ConstraintViolation<FixedDepositDetails>> violations\
  \ = validator.validate(fixedDepositDetails);\n        Iterator<ConstraintViolation<FixedDepositDetails>>\
  \ itr = violations.iterator();\n        if (itr.hasNext()) {\n            logger.error(\"\
  Errors were found while validating FixedDepositDetails instance\");\n        } else\
  \ {\n            myFixedDepositDao.createFixedDeposit(fixedDepositDetails);\n  \
  \          logger.info(\"Created fixed deposit\");\n        }\n    }\n}\n```\n\n\
  \n\n\n**示例列表 6-31** – `BankAppConfiguration` 类 - `@Configuration` 和 `@Bean` 注解\n\
  \n**项目** – `ch06-bankapp-configuration`\n\n**源位置** - `src/main/java/sample/spring/chapter06/bankapp`\n\
  \n```java\npackage sample.spring.chapter06.bankapp;\n\nimport org.springframework.context.annotation.Bean;\n\
  import org.springframework.context.annotation.Configuration;\nimport org.springframework.context.annotation.Scope;\n\
  \n.....\n\n@Configuration\npublic class BankAppConfiguration {\n\n    .....\n\n\
  \    @Bean(name = \"customerRegistrationService\")\n    @Scope(value = ConfigurableBeanFactory.SCOPE_PROTOTYPE)\n\
  \    public CustomerRegistrationService customerRegistrationService() {\n      \
  \  return new CustomerRegistrationServiceImpl();\n    }\n\n    .....\n}\n```\n\n\
  `BankAppConfiguration` 类定义了带有 `@Bean` 注解的方法，这些方法返回 bean 实例。`@Bean` 的 `name` 属性指定了返回的\
  \ bean 实例在注册到 Spring 容器时使用的名称。`@Scope` 注解指定了返回的 bean 实例的范围（单例或原型）。\n\n**注意** `@Scope`\
  \ 注解也用于类型级别，以指定 Spring 组件的范围。请参考示例列表 6-14，该示例显示了在类型级别使用 `@Scope` 注解的用法。\n\n在示例列表\
  \ 6-31 中，`customerRegistrationService` 方法返回 `CustomerRegistrationService` bean 实例，该实例被注册到\
  \ Spring 容器中，作为一个名为 `customerRegistrationService` 的原型范围 bean。`customerRegistrationService`\
  \ 方法的效果与应用上下文 XML 文件中的以下 bean 定义相同：\n\n```xml\n<bean id=\"customerRegistrationService\"\
  \ scope=\"prototype\"\n      class=\"sample.spring.chapter06.bankapp.service.CustomerRegistrationServiceImpl\"\
  \ />\n```\n\n下表描述了你可以用来配置 bean 实例的 `@Bean` 注解属性：\n\n| `type` 属性值 | 描述 |\n| :---\
  \ | :--- |\n| Autowire | 与 `<bean>` 元素的 autowire 属性相同（参考第 4 章第 4-6 节了解更多关于 autowire\
  \ 属性的信息）。如果 `@Bean` 注解方法返回的 bean 依赖于其他 bean，你可以使用 autowire 属性指示 Spring 按名称或类型执行依赖的自动装。\
  \ |\n| initMethod | 与 `<bean>` 元素的 init-method 属性相同（参考第 5 章第 5-2 节了解更多关于 init-method\
  \ 属性的信息） |\n| destroyMethod | 与 `<bean>` 元素的 destroy-method 属性相同（参考第 5 章第 5-2 节了解更多关于\
  \ destroy-method 属性的信息） |\n\n需要注意的是，`@Bean` 注解的方法还可以带有 `@Lazy`、`@DependsOn`、`@Primary`\
  \ 和 `@Scope` 注解。这些注解应用于 `@Bean` 注解方法返回的对象实例。例如，`@DependsOn` 注解指定了 `@Bean` 注解方法返回的对象实例的隐式依赖。此外，如果\
  \ `@Bean` 注解方法返回的 bean 实例实现了生命周期接口（如 `InitializingBean` 和 `DisposableBean`）以及 Spring\
  \ 的*Aware 接口（如 `ApplicationContextAware`、`BeanNameAware` 等），它将接收来自 Spring 容器的回调。\n\
  \n在目前为止我们过的示例中，我们创建了 `ClassPathXmlApplicationContext` 类实例（`ApplicationContext` 接口的实现）来表示\
  \ Spring 容器。如果你使用带有 `@Configuration` 注解的类作为 bean 的源，你需要创建一个 `AnnotationConfigApplicationContext`\
  \ 类实例（另一个 `ApplicationContext` 接口的实现）来表示 Spring 容器。\n\n下面的示例列表显示了 `BankApp` 类，它创建了\
  \ `AnnotationConfigApplicationContext` 类实例并从新创建的 `AnnotationConfigApplicationContext`\
  \ 实例中检索 bean：\n\n**示例列表 6-32** – `BankApp` 类 - `AnnotationConfigApplicationContext`\
  \ 的用法\n\n**项目** – `ch06-bankapp-configuration`\n\n**源位置** - `src/main/java/sample/spring/chapter06/bankapp`\n\
  \n```java\npackage sample.spring.chapter06.bankapp;\n\nimport org.springframework.context.annotation.AnnotationConfigApplicationContext;\n\
  \npublic class BankApp {\n\n    public static void main(String args[]) throws Exception\
  \ {\n        AnnotationConfigApplicationContext context =\n                new AnnotationConfigApplicationContext(BankAppConfiguration.class);\n\
  \n        .....\n\n        FixedDepositService FixedDepositService = context.getBean(FixedDepositService.class);\n\
  \        FixedDepositService.createFixedDeposit(new FixedDepositDetails(1, 1000,\n\
  \                    12, \"someemail@somedomain.com\"));\n\n        .....\n    }\n\
  }\n```\n\n在上述示例列表中，`BankAppConfiguration` 类被作为参数传递给 `AnnotationConfigApplicationContext`\
  \ 的构造函数。由于 `AnnotationConfigApplicationContext` 类实现了 `ApplicationContext` 接口，你可以以与\
  \ `ClassPathXmlApplicationContext` 相同访问已注册的 bean。\n\n你应该注意，`@Bean` 注解的方法也可以定义在 `@Component`\
  \ 和 JSR 330 的 `@Named` 类中。如果你在 `@Configuration`、`@Component` 和 `@Named` 注解类中定义了\
  \ bean，请将所有这些类传递给 `AnnotationConfigApplicationContext`。\n\n下面的示例列表显示了 `BankAppConfiguration`\
  \ 类中返回 `BeanFactoryPostProcessor` 和 `BeanPostProcessor` 实现的带有 `@Bean` 注解的方法：\n\n\
  **示例列表 6-33** – `BankAppConfiguration` 类 – 定义 `BeanFactoryPostProcessor` 和 `BeanPostProcessor`\n\
  \n**项目** – `ch06-bankapp-configuration`\n\n**源位置** - `src/main/java/sample/spring/chapter06/bankapp`\n\
  \n```java\npackage sample.spring.chapter06.bankapp;\n\nimport org.springframework.context.annotation.Bean;\n\
  \n@Configuration\npublic class BankAppConfiguration {\n\n    .....\n\n    @Bean\n\
  \    public ExampleBeanPostProcessor exampleBeanPostProcessor() {\n        return\
  \ new ExampleBeanPostProcessor();\n    }\n\n    @Bean\n    public static BeanNamePostProcessor\
  \ applicationConfigurer() {\n        return new BeanNamePostProcessor();\n    }\n\
  }\n```\n\n在上述示例列表中，`ExampleBeanPostProcessor` 实例代表一个 `BeanPostProcessor`，它在新创建的\
  \ bean 实例初始化之前和之后在控制台上打印一条消息；`BeanNamePostProcessor` 实例代表一个 `BeanFactoryPostProcessor`，它打印注册到\
  \ Spring 容器的所有 bean 的名称。\n\n如果你进入 `ch06-bankapp-configuration` 项目并执行 `BankApp` 的主方法，你会发现\
  \ `BeanNamePostProcessor` 在 Spring 容器创建 `@Configuration` 注解类定义的任何 bean 之前被调用，而 `ExampleBeanPostProcessor`\
  \ 在 Spring 容器每次创建新的 bean 实例时被调用。\n\n## 6-12 总结\n\n本章查看了你可以用于简化 Spring 开发的注解。我们查看了如何使用\
  \ Spring 的 `@Component`、`@Service`、`@Repository` 和 `@Controller` 注解将 bean 类指定为 Spring\
  \ 组件，通过类路径扫描自动将 Spring 组件注册到容器中，使用 Spring Validation API 和 JSR 303 注解对对象进行验证，使用\
  \ Spring 的 `@Autowired`、JSR 330 的 `@Inject` 和 JSR 250 的 `@Resource` 注解执行依赖注入，以及使用\
  \ `@Configuration` 和 `@Bean` 注解通过编程方式配置 bean。下一章将展示 Spring 如何简化数据库交互。\n\n\n\n\n\n\
  # 7-1 简介\n\nSpring 通过在 JDBC 之上提供抽象层，简化了与数据库的交互。Spring 同时也简化了对 ORM（对象关系映射）框架的使用，例如\
  \ Hibernate ([`www.hibernate.org/`](http://www.hibernate.org/)) 和 MyBatis ([`www.mybatis.org`](http://www.mybatis.org))，用于数据库交互。在本章中，我们将通过示例来展示\
  \ Spring 如何简化与数据库交互的应用程序开发。\n\n注意：本章描述的示例使用了 Hibernate 4。如果你使用的是 Hibernate 3，对配置所需的更改已在相关处进行了说明。\n\
  \n本章中，我们将首先查看一个使用 Spring JDBC 抽象来与 MySQL 数据库交互的示例应用程序。之后，我们将使用 Spring 对 Hibernate\
  \ 框架的支持开发相同的应用程序。最后，我们将通过查看 Spring 对程序化和声明式事务管理的支持来结束本章。\n\n让我们先看看本章中要开发的 MyBank\
  \ 应用程序的需求。\n\n## 7-2 MyBank 应用的需求\n\nMyBank 应用程序是一个网上银行应用程序，允许银行客户查询账户详情、生成银行对单、创建定期存款、申请支票簿等。下图显示了存储\
  \ MyBank 应用程序数据的 `BANK_ACCOUNT_DETAILS` 和 `FIXED_DEPOSIT_DETAILS` 表：\n\n![](img/00028.jpeg)\n\
  \n图 7-1 MyBank 应用程序使用的数据库表\n\n`BANK_ACCOUNT_DETAILS` 表包含银行账户信息，`FIXED_DEPOSIT_DETAILS`\
  \ 表包含定期存款信息。上面的图显示了 `FIXED_DEPOSIT_DETAILS` 表与 `BANK_ACCOUNT_DETAILS` 表之间存在多对一的关系。当银行客户开启新的定期存款时，定期存款金额将从\
  \ `BANK_ACCOUNT_DETAILS` 表的 `BALANCE_AMOUNT` 列中扣除，定期存款详情保存在 `FIXED_DEPOSIT_DETAILS`\
  \ 表中。\n\n`BANK_ACCOUNT_DETAILS` 表的列为：\n\n*   `ACCOUNT_ID` – 账户标识符，唯一标识客户的银行账户。\n\
  *   `BALANCE_AMOUNT` – 持有银行账户的当前余额。当客户请求开启定期存款时，存款金额会从此列中扣除。\n*   `LAST_TRANSACTION_TS`\
  \ – 指定该账户最后一次交易的时间。\n\n`FIXED_DEPOSIT_DETAILS` 表的列为：\n\n*   `FIXED_DEPOSIT_ID` –\
  \ 定期存款标识符，唯一标识一份定期存款。当客户开启定期存款时，MyBank 会生成一个唯一的定期存款标识符供客户未来参考。`FIXED_DEPOSIT_ID`\
  \ 列的值由 MySQL 数据库自动生成。\n*   `ACCOUNT_ID` – 外键，标识与定期存款关联的银行账户。每个季度，定期存款产生的利息将存入该列所标识的银行账户。\n\
  *   `FD_CREATION_DATE` – 定期存款创建的日期\n*   `AMOUNT` – 定期存款金额\n*   `TENURE` – 定期存款期限（以月为单位）。存款期限必须大于等于\
  \ 12 个月且小于或等于 60 个月。\n*   `ACTIVE` – 表示该定期存款当前是否处于激活状态。激活的定期存款根据存款金额产生利息。\n\n现在让我们来看如何使用\
  \ Spring 的 JDBC 模块创建 MyBank 应用程序。\n\n## 7-3 使用 Spring JDBC 模块开发 MyBank 应用\n\nSpring\
  \ 的 JDBC 模块通过处理打开和关闭连接、管理事务、处理异常等底层细节，简化了与数据源的交互。在本节中，我们将使用 Spring JDBC 模块开发（如上一节所述）MyBank\
  \ 应用程序。为了简单起见，我们只开发构成 MyBank 应用程序部分的服务和 DAO。\n\n导入章节 7/ch07-bankapp-jdbc（此项目展示了使用\
  \ Spring JDBC 模块与数据库交互的 MyBank 应用程序。要运行该应用程序，请执行该项目中 `BankApp` 类的 main 方法。在执行 `BankApp`\
  \ 的 main 方法之前，请安装 MySQL 数据库并执行 `ch07-bankapp-jdbc` 项目 `sql` 文件夹下的 `spring_bank_app_db.sql`\
  \ SQL 脚本。执行 `spring_bank_app_db.sql` 脚本将创建 `SPRING_BANK_APP_DB` 数据库并向其中添加 `BANK_ACCOUNT_DETAILS`\
  \ 和 `FIXED_DEPOSIT_DETAILS` 表。此外，修改 `src/main/resources/META-INF/spring/database.properties`\
  \ 文件以你的 MySQL 安装路径。）\n\n在 MyBank 应用程序中，你首先需要配置一个 `javax.sql.DataSource` 对象来标识 MyBank\
  \ 应用程序交互的数据源，然后实现使用 Spring JDBC 模块类与数据源交互的 DAO。让我们详细查看这些每一个步骤。\n\n### 配置数据源\n\n\
  如果你使用 Spring 开发一个独立应用程序，可以在应用程序上下文 XML 文件中配置数据源。如果你正在开发企业级应用程序，可以定义一个绑定到应用服务器 JNDI\
  \ 的数据源，并在应用上下文 XML 文件中获取 JNDI 绑定的数据源供应用程序使用。在 `ch07-bankapp-jdbc` 项目中，数据源是在上下文 XML\
  \ 文件中配置的。\n\n以下示例显示了如何在上下文 XML 文件中配置 MyBank 的数据源：\n\n示例 7-1 – applicationContext.xml\
  \ – 数据源配置\n\n项目 – ch07-bankapp-jdbc\n\n路径 - src/main/resources/META-INF/spring\n\
  \n```xml\n<context:property-placeholder location=\"classpath*:META-INF/spring/database.properties\"\
  \ />\n<bean id=\"dataSource\" class=\"org.apache.commons.dbcp.BasicDataSource\"\
  \ destroy-method=\"close\">\n    <property name=\"driverClassName\" value=\"${database.driverClassName}\"\
  \ />\n    <property name=\"url\" value=\"${database.url}\" />\n    <property name=\"\
  username\" value=\"${database.username}\" />\n    <property name=\"password\" value=\"\
  ${database.password}\" />\n</bean>\n```\n\n在上面的示例中，Spring context 的 `<property-placeholder>`\
  \ 元素（参考第 5 章第 4 节）从 `META-INF/spring/database.properties` 文件加载属性，并使其应用于上下文 XML 文件中的\
  \ bean 定义。`dataSource` bean 代表 `javax.sql.DataSource` 对象，作为创建数据源连接的工厂。`BasicDataSource`\
  \ 类是 `javax.sql.DataSource` 接口的实现，支持连接池功能。`BasicDataSource` 是 Apache Commons DBCP\
  \ 项目 ([`commons.apache.org/dbcp/`](http://commons.apache.org/dbcp/)) 并支持数据库连接池功能。`BasicDataSource`\
  \ 类 `driverClassName`、`url`、`username` 和 `password` 属性值来自 `database.properties`\
  \ 文件定义的属性。`BasicDataSource` 类的 `close` 方法关闭池中的所有空闲连接。由于 `BasicDataSource` 类的 bean\
  \ 定义指定 `destroy-method` 属性为 `close`，当 Spring 容器销毁 `dataSource` bean 实例时，池中的所有空闲连接都会被关闭。\n\
  \n**在 Java EE 环境中配置数据源**\n\n如果你正在开发部署在应用服务器上的企业应用程序，可以使用 Spring jee 架构的 `<jndi-lookup>`\
  \ 元素将 JNDI 绑定的数据源作为 Spring bean 并在 `ApplicationContext` 中：\n\n```xml\n<jee:jndi-lookup\
  \ jndi-name=\"java:comp/env/jdbc/bankAppDb\" id=\"dataSource\" />\n```\n\n\n\n\n\
  \n在这里，`jndi-name` 属性指定了 `javax.sql.DataSource` 对象绑定到 JNDI 的 JNDI 名称，`id` 属性指定了 `javax.sql.DataSource`\
  \ 对象在 `ApplicationContext` 中注册为 bean 的名称。\n\n现在让我们来看下 Spring JDBC 模块中的一些类，你可以在 DAO\
  \ 中使用这些类来与数据库进行交互。\n\n### 创建使用 Spring JDBC 模块类的 DAOs\n\nSpring 的 JDBC 模块定义了多个简化数据库交互的类。我们将首先查看\
  \ Spring JDBC 模块核心的 `JdbcTemplate` 类。在本节中我们还将讨论的其他类是 `NamedParameterJdbcTemplate`\
  \ 和 `SimpleJdbcInsert`。要了解更多 Spring JDBC 模块的类，请参考 Spring 的参考文档。\n\n### `JdbcTemplate`\n\
  \n`JdbcTemplate` 类负责管理 `Connection`、`Statement` 和 `ResultSet` 对象，捕获 JDBC 异常并将其转换为易于理解的异常（例如\
  \ `IncorrectResultSetColumnCountException` 和 `CannotGetJdbcConnectionException`），执行批量操作等。应用程序开发人员只需要向\
  \ `JdbcTemplate` 类提供 SQL，并在 SQL 执行后提取结果即可。\n\n由于 `JdbcTemplate` 是 `javax.sql.DataSource`\
  \ 对象的包装器，你不需要直接处理 `javax.sql.DataSource` 对象。`JdbcTemplate` 实例通常使用引用其需要获取连接的 `javax.sql.DataSource`\
  \ 对象来初始化，如下面的示例列表所示：\n\n**示例列表 7-2** – `applicationContext.xml` – `JdbcTemplate`\
  \ 配置\n\n**Project** – `ch07-bankapp-jdbc`\n\n**Source location** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"jdbcTemplate\" class=\"org.springframework.jdbc.core.JdbcTemplate\"\
  >\n    <property name=\"dataSource\" ref=\"dataSource\" />\n</bean>\n<bean id=\"\
  dataSource\" class=\"org.apache.commons.dbcp.BasicDataSource\".....>\n    .....\n\
  </bean>\n```\n\n上面的示例列表显示 `JdbcTemplate` 类定义了一个 `dataSource` 属性，它引用了一个 `javax.sql.DataSource`\
  \ 对象。\n\n如果你的应用程序使用 JNDI 绑定的数据源，使用 jee schema 的 `<jndi-lookup>` 元素将 JNDI 绑定的数据源注册为\
  \ Spring 容器中的 bean。现在，`JdbcTemplate` 类可以引用由 `<jndi-lookup>` 元素注册的 `javax.sql.DataSource`\
  \ bean，如下面的示例列表所示：\n\n**示例列表 7-3** – 为 JNDI 绑定数据源的 `JdbcTemplate` 配置\n\n```xml\n\
  <beans .....\n      xmlns:jee=\"http://www.springframework.org/schema/jee\"\n  \
  \    xsi:schemaLocation=\".....\n                  http://www.springframework.org/schema/jee\n\
  \                  http://www.springframework.org/schema/jee/spring-jee-4.0.xsd\"\
  >\n    <bean id=\"jdbcTemplate\" class=\"org.springframework.jdbc.core.JdbcTemplate\"\
  >\n        <property name=\"dataSource\" ref=\"dataSource\" />\n    </bean>\n  \
  \  <jee:jndi-lookup jndi-name=\"java:comp/env/jdbc/bankAppDb\" id=\"dataSource\"\
  \ />\n    .....\n</beans>\n```\n\n在上面的示例列表中，对 Spring jee schema 的引用包含在应用上下文 XML\
  \ 文件中。`<jndi-lookup>` 元素从 JNDI 获取 `javax.sql.DataSource` 对象并将其暴露为名为 `dataSource`\
  \ 的 bean，该 bean 被 `JdbcTemplate` 类引用。\n\n`JdbcTemplate` 实例是线程安全的，这意味着应用程序的多个 DAO\
  \ 可以共享同一个 `JdbcTemplate` 类实例来与数据库交互。接下来的示例列表了 `FixedDepositDaoImpl` 的 `createFixedDeposit`\
  \ 方法，该方法利用 `JdbcTemplate` 在数据库中保存定期存款详情：\n\n**示例列表 7-4** – `FixedDepositDaoImpl`\
  \ 类 – 使用 `JdbcTemplate` 保存数据\n\n**Project** – `ch07-bankapp-jdbc`\n\n**Source location**\
  \ - `src/main/java/sample/spring/chapter07/bankapp/dao`\n\n```java\npackage sample.spring.chapter07.bankapp.dao;\n\
  \nimport java.sql.*;\nimport org.springframework.jdbc.core.JdbcTemplate;\nimport\
  \ org.springframework.jdbc.core.PreparedStatementCreator;\nimport org.springframework.jdbc.support.GeneratedKeyHolder;\n\
  import org.springframework.jdbc.support.KeyHolder;\nimport org.springframework.stereotype.Repository;\n\
  \n@Repository(value = \"FixedDepositDao\")\npublic class FixedDepositDaoImpl implements\
  \ FixedDepositDao {\n\n    @Autowired\n    private JdbcTemplate jdbcTemplate;\n\n\
  \    .....\n\n    public int createFixedDeposit(final FixedDepositDetails fixedDepositDetails)\
  \ {\n        final String sql = \"insert into fixed_deposit_details(account_id,\
  \ fixed_deposit_date, amount, tenure) values (?, ?, ?, ?)\";\n        KeyHolder\
  \ keyHolder = new GeneratedKeyHolder();\n        jdbcTemplate.update(new PreparedStatementCreator()\
  \ {\n            @Override\n            public PreparedStatement createPreparedStatement(Connection\
  \ con) throws SQLException {\n                PreparedStatement ps = con.prepareStatement(sql,\
  \ new String[] { \"fixed_id\" });\n                ps.setInt(1, fixedDepositDetails.getAccountId());\n\
  \                ps.setDate(2, new java.sql.Date(fixedDepositDetails.getCreationDate().getTime()));\n\
  \                ps.setDouble(3, fixedDepositDetails.getAmount());\n           \
  \     ps.setInt(4, fixedDepositDetails.getTenure());\n                return ps;\n\
  \            }\n        }, keyHolder);\n        return keyHolder.getKey().intValue();\n\
  \    }\n    .....\n}\n```\n\n在上面的示例列表中，`FixedDepositDaoImpl` 使用了 `@Repository` 注解，因为\
  \ `FixedDepositDaoImpl` 类代表一个 DAO。我们在应用上下配置（参考示例 7-2）的 `JdbcTemplate` 实例注入到了 `FixedDepositDaoImpl`\
  \ 类中。`JdbcTemplate` 的 `update` 方法接收 `PreparedStatementCreator` 实例和 `KeyHolder` 实例。`PreparedStatementCreator`\
  \ 用于对数据库执行插入、更新或删除操作。Spring 的 `KeyHolder` 接口表示执行插入 语句时自动生成的键。`GeneratedKeyHolder`\
  \ 类是 `KeyHolder` 的默认实现。\n\n一旦 `INSERT` SQL 语句成功执行，生成的键就会添加到 `GeneratedKeyHolder`\
  \ 实例中。通过调用 `getKey` 方法从 `GeneratedKeyHolder` 中提取生成的键。在示例 7-4 中，`createFixedDeposit`\
  \ 方法将定期存款详情插入 `FIXED_DEPOSIT_DETAILS` 表并返回生成的键。示例 7-4 显示你不需要担心捕获执行 `PreparedStatement`\
  \ 可能抛出的 `SQLException`。这是因为 `JdbcTemplate` 负责捕获并处理 `SQLException`。\n\n如示例 7-4 所示，如果你使用\
  \ `JdbcTemplate` 类进行数据库交互，传递给 SQL 语句的参数使用 `?` 占位符。Spring 的 `NamedParameterJdbcTemplate`\
  \ 是 `JdbcTemplate` 实例的包装器，允许你在 SQL 语句中使用命名参数而不是 `?`。\n\n下面的示例列表显示了如何在应用上下文 XML 文件中配置\
  \ `NamedParameterJdbcTemplate` 类：\n\n**示例列表 7-5** – `applicationContext.xml` – `NamedParameterJdbcTemplate`\
  \ 配置\n\n**Project** – `ch07-bankapp-jdbc`\n\n```xml\n<bean id=\"namedJdbcTemplate\"\
  \ class=\"org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate\"\
  >\n    <constructor-arg index=\"0\" ref=\"dataSource\" />\n</bean>\n```\n\n\n\n\n\
  上面的示例列表显示 `NamedParameterJdbcTemplate` 类接受 `javax.sql.DataSource` 对象作为构造函数参数。\n\n\
  接下来的示例列表显示了 `FixedDepositDaoImpl` 类，它使用 `NamedParameterJdbcTemplate` 从 `FIXED_DEPOSIT_DETAILS`\
  \ 表中获取固定存款详情：\n\n**示例列表 7-6** – `FixedDepositDaoImpl` 类 – `NamedParameterJdbcTemplate`\
  \ 的用法\n\n**项目** – `ch07-bankapp-jdbc`\n\n**源码位置** - `src/main/java/sample/spring/chapter07/bankapp/dao`\n\
  \n```java\npackage sample.spring.chapter07.bankapp.dao;\n\nimport java.sql.ResultSet;\n\
  import org.springframework.jdbc.core.RowMapper;\nimport org.springframework.jdbc.core.namedparam.MapSqlParameterSource;\n\
  import org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate;\nimport\
  \ org.springframework.jdbc.core.namedparam.SqlParameterSource;\n\n.....\n\n@Repository(value\
  \ = \"FixedDepositDao\")\npublic class FixedDepositDaoImpl implements FixedDepositDao\
  \ {\n    .....\n    @Autowired\n    private NamedParameterJdbcTemplate namedParameterJdbcTemplate;\n\
  \    .....\n    public FixedDepositDetails getFixedDeposit(final int FixedDepositId)\
  \ {\n        final String sql = \"select * from fixed_deposit_details where fixed_deposit_id\
  \ = :FixedDepositId\";\n        SqlParameterSource namedParameters = new MapSqlParameterSource(\n\
  \            \"FixedDepositId\", FixedDepositId);\n        return namedParameterJdbcTemplate.queryForObject(sql,\
  \ namedParameters,\n            new RowMapper<FixedDepositDetails>() {\n       \
  \         public FixedDepositDetails mapRow(ResultSet rs, int rowNum) throws SQLException\
  \ {\n                    FixedDepositDetails fixedDepositDetails = new FixedDepositDetails();\n\
  \                    fixedDepositDetails.setActive(rs.getString(\"active\"));\n\
  \                    .....\n                    return fixedDepositDetails;\n  \
  \              }\n            });\n    }\n}\n```\n\n我们在应用上下文 XML 文件中配置的 `NamedParameterJdbcTemplate`\
  \ 实例（参考示例列表 7-5）被自动注入到 `FixedDepositDaoImpl` 类中。在上面的示例列表中，传递给 `NamedParameterJdbcTemplate`\
  \ 的 `queryForObject` 方法的 SQL 查询包含一个命名参数 `FixedDepositId`。命名参数的值通过 Spring 的 `SqlParameterSource`\
  \ 接口的实现提供。`MapSqlParameterSource` 类是 `SqlParameterSource` 接口的实现，它将命名参数（及其值）存储在 `java.util.Map`\
  \ 中。在上面的示例列表中，`MapSqlParameterSource` 实例持有命名参数 `FixedDepositId` 的值。`NamedParameterJdbcTemplate`\
  \ 的 `queryForObject` 方法执行提供的 SQL 查询并返回单个对象。Spring 的 `RowMapper` 对象用于将每条返回的行映射到对象上。在上面的示例列表中，`RowMapper`\
  \ 将 `ResultSet` 中返回的行映射到 `FixedDepositDetails` 对象。\n\n现在让我们来看 Spring 的 `SimpleJdbcInsert`\
  \ 类。\n\n### SimpleJdbcInsert\n\n`SimpleJdbcInsert` 类利用数据库元数据来简化为表创建基础 SQL 插入语句。\n\
  \n接下来的示例列表显示了 `BankAccountDaoImpl` 类，它使用 `SimpleJdbcInsert` 将银行账户详情插入到 `BANK_ACCOUNT_DETAILS`\
  \ 表中：\n\n**示例列表 7-7** – `BankAccountDaoImpl` 类 – `SimpleJdbcInsert` 的用法\n\n**项目**\
  \ – `ch07-bankapp-jdbc`\n\n**源码位置** - `src/main/java/sample/spring/chapter07/bankapp/dao`\n\
  \n```java\npackage sample.spring.chapter07.bankapp.dao;\n\nimport javax.sql.DataSource;\n\
  import org.springframework.jdbc.core.simple.SimpleJdbcInsert;\n\n.....\n\n@Repository(value\
  \ = \"bankAccountDao\")\npublic class BankAccountDaoImpl implements BankAccountDao\
  \ {\n    private SimpleJdbcInsert insertBankAccountDetail;\n    @Autowired\n   \
  \ private void setDataSource(DataSource dataSource) {\n        this.insertBankAccountDetail\
  \ = new SimpleJdbcInsert(dataSource)\n            .withTableName(\"bank_account_details\"\
  )\n            .usingGeneratedColumns(\"account_id\");\n    }\n    @Override\n \
  \   public int createBankAccount(final BankAccountDetails bankAccountDetails) {\n\
  \        Map<String, Object> parameters = new HashMap<String, Object>();\n     \
  \   parameters.put(\"balance_amount\", bankAccountDetails.getBalanceAmount());\n\
  \        parameters.put(\"last_transaction_ts\", new java.sql.Date(\n          \
  \  bankAccountDetails.getLastTimestamp().getTime()));\n        Number key = insertBankAccountDetail.executeAndReturnKey(parameters);\n\
  \        return key.intValue();\n    }\n.....\n```\n\n由于 `setDataSource` 方法被标记了\
  \ `@Autowired`，`javax.sql.DataSource` 对象作为参数传递给 `setDataSource` 方法。在 `setDataSource`\
  \ 方法中，通过向 `SimpleJdbcInsert` 构造函数传递 `javax.sql.DataSource` 对象的引用创建一个 `SimpleJdbcInsert`\
  \ 实例。`SimpleJdbcInsert` 的 `withTableName` 方法设置要插入表的名称。由于我们要将银行账户详情插入 `BANK_ACCOUNT_DETAILS`\
  \ 表，因此将字符串值 `bank_account_details` 作为参数传递给 `withTableName` 方法。`SimpleJdbcInsert`\
  \ 的 `usingGeneratedColumns` 方法设置包含自动生成键的列名。对于 `BANK_ACCOUNT_DETAILS` 表，`ACCOUNT_ID`\
  \ 包含自动生成键；因此将字符串值 `account_id` 传递给 `usingGeneratedColumns` 方法。实际的插入操作通过调用 `SimpleJdbcInsert`\
  \ 的 `executeAndReturnKey` 方法执行。`executeAndReturnKey` 方法接受 `java.util.Map` 参数，该参数包含表列名及其对应的值，并返回生成的键。你应该注意，`SimpleJdbcInsert`\
  \ 类内部使用 `JdbcTemplate` 来执行实际的插入操作。\n\n如果你查看 `ch07-bankapp-jdbc` 项目中的 `BankAccountDaoImpl`\
  \ 类，你会注意到它同时使用了 `SimpleJdbcInsert` 和 `JdbcTemplate` 类与数据库交互。同样，`ch07-bankapp-jdbc`\
  \ 项目中的 `FixedDepositDaoImpl` 类也使用了 `JdbcTemplate` 和 `NamedParameterJdbcTemplate`\
  \ 类进行数据库交互。这表明你可以组合使用 Spring JDBC 模块类来与数据库交互。\n\n**注意** 由于 `ch07-bankapp-jdbc` 项目使用了\
  \ Spring 的 JDBC 模块并使用了 Spring 的事务管理功能（在第 7-5 节解释），`ch07-bankapp-jdbc` 项目的 `pom.xml`\
  \ 文件依赖于 `spring-jdbc` 和 `spring-tx` 包。\n\n现在让我们来看 `ch07-bankapp-jdbc` 项目中的 `BankApp`\
  \ 类，它创建一个银行账户并开设相应的固定存款。\n\n### BankApp 类\n\n`ch07-bankapp-jdbc` 项目的 `BankApp` 类作为一个独立的\
  \ Java 运行 `MyBank` 程序。`BankApp` 的 `main` 方法在 `BANK_ACCOUNT_DETAILS` 表中创建一个银行账户，并在\
  \ `FIXED_DEPOSIT_DETAILS` 表中创建一个对应于该新银行账户的固定存款。\n\n接下来的示例列表显示了 `BankApp` 类：\n\n\
  **示例列表 7-8** – `BankApp` 类\n\n**项目** – `ch07-bankapp-jdbc`\n\n**源码位置** - `src/main/java/sample/spring/chapter07/bankapp`\n\
  \n```java\npackage sample.spring.chapter07.bankapp;\n\n.....\n\npublic class BankApp\
  \ {\n    private static Logger logger = Logger.getLogger(BankApp.class);\n    public\
  \ static void main(String[] args[]) throws Exception {\n        ApplicationContext\
  \ context = new ClassPathXmlApplicationContext(\n            \"classpath:META-INF/spring/applicationContext.xml\"\
  );\n        BankAccountService bankAccountService = context.getBean(BankAccountService.class);\n\
  \        BankAccountDetails bankAccountDetails = new BankAccountDetails();\n   \
  \     .....\n        int bankAccountId = bankAccountService.createBankAccount(bankAccountDetails);\n\
  \        .....                FixedDepositService FixedDepositService = context.getBean(FixedDepositService.class);\n\
  \    }\n}\n```\n\n\n\n\n```java\nFixedDepositDetails fixedDepositDetails = new FixedDepositDetails();\n\
  \n.....\n\nint FixedDepositId = FixedDepositService.createFixedDeposit(fixedDepositDetails);\n\
  \n.....\n\n}\n\n}\n```\n\n在上面的示例列表中，`BankAccountService` 对象与 `BankAccountDaoImpl`（参见示例列表\
  \ 7-7）交互以创建银行账户，而 `FixedDepositService` 对象与 `FixedDepositDaoImpl` 对象（参见示例列表 7-4\
  \ 和 7-6）交互，以对应新创建的银行账户开设相应的定期存款。如果你执行 `BankApp` 的 `main` 方法，你将发现 `BANK_ACCOUNT_DETAILS`\
  \ 和 `FIXED_DEPOSIT_DETAILS` 表中都插入了一条新记录。\n\n在本节中，我们查看了 Spring 的 JDBC 模块如何简化从数据库中更新或获取数据。Spring\
  \ 的 JDBC 模块还可以用于以下目的：\n\n*   执行存储过程和函数。例如，你可以使用 Spring 的 `SimpleJdbcCall` 类来执行存储过程和函数\n\
  *   批量执行预编译语句 \n*   以面向对象的方式访问关系型数据库。例如，你可以扩展 Spring 的 `MappingSqlQuery` 类来创建一个\
  \ SQL 查询，并将返回的 `ResultSet` 映射到领域对象。\n*   配置嵌入式数据库实例。例如，你可以使用 Spring 的 `schema` 来创建\
  \ `HSQL`、`H2` 或 `Derby` 数据库实例，并将数据库实例作为类型 `javax.sql.DataSource` 的 bean 注册到 Spring\
  \ 容器中。\n\n现在让我们如何利用 Spring 对 Hibernate ORM 框架的支持与数据库交互。\n\n## 7-4 使用 Hibernate 开发\
  \ MyBank 应用程序\n\nSpring 的 ORM 模块提供了与 Hibernate、Java Persistence API (JPA)、MyBatis\
  \ 和 Java Data Objects (JDO) 的集成。在本节中，我们将看到 Spring 如何简化使用 Hibernate 框架进行数据库交互。由于\
  \ Hibernate 本身是一个 JPA 提供者，我们将使用 JPA 注解将我们的持久实体类映射到数据库表。\n\n**导入章节 7/ch07-bankapp-hibernate**（此项目展示了使用\
  \ Hibernate 与数据库交互的 MyBank 应用程序。要运行应用程序，请执行该项目中 `BankApp` 类的 `main` 方法。）\n\n让我们先如何配置\
  \ Hibernate 的 `SessionFactory` 实例。\n\n### 配置 SessionFactory 实例\n\n`SessionFactory`\
  \ 是用于创建 Hibernate `Session` 对象的工厂。DAO 使用该 `Session` 对象对持久化实体执行创建、读取、删除和更新操作。Spring\
  \ 的 `org.springframework.orm.hibernate4.LocalSessionFactoryBean`（一个 `FactoryBean`\
  \ 实现类）会创建一个 `SessionFactory` 实例，DAO 类可以使用它来获取 `Session` 实例。\n\n**注意** 如果你想在应用程序的\
  \ DAO 中使用 JPA 的 `EntityManager` 进行数据库交互，请配置 Spring 的 `LocalContainerEntityManagerFactoryBean`\
  \ 而不是 `org.springframework.orm.hibernate4.LocalSessionFactoryBean`。\n\n下面的示例列表显示了如何在应用程序上下文\
  \ XML 文件中配置 `LocalSessionFactoryBean` 类：\n\n**示例 7-9** – `applicationContext.xml`\
  \ - `LocalSessionFactoryBean` 配置\n\n**项目** – `ch07-bankapp-hibernate`\n\n**源位置**\
  \ - `src/main/java/sample/spring/chapter07/bankapp`\n\n```xml\n<bean id=\"sessionFactory\"\
  \n    class=\" org.springframework.orm.hibernate4.LocalSessionFactoryBean\">\n \
  \   <property name=\"dataSource\" ref=\"dataSource\" />\n    <property name=\"packagesToScan\"\
  \ value=\"sample.spring\" />\n</bean>\n```\n\n`dataSource` 属性指定了类型为 `javax.sql.DataSource`\
  \ 的 bean 引用。`packagesToScan` 属性指定了 Spring 查找持久化类的包。例如，上面的示例指定了如果持久化类被标记了 JPA 的 `@Entity`\
  \ 注解，并且位于 `sample.spring` 包（或其子包）中，它会被 `org.springframework.orm.hibernate4.LocalSessionFactoryBean`\
  \ 自动检测。使用 `packagesToScan` 属性的替代方案是使用 `annotatedClasses` 属性显式指定所有持久化类，如下示例所示：\n\n\
  **示例 7-10** `LocalSessionFactoryBean` 的 `annotatedClasses` 属性\n\n```xml\n<bean id=\"\
  sessionFactory\"\n    class=\"org.springframework.orm.hibernate4.LocalSessionFactoryBean\"\
  >\n    <property name=\"dataSource\" ref=\"dataSource\" />\n    <property name=\"\
  annotatedClasses\">\n        <list>\n            <value>sample.spring.chapter07.bankapp.domain.BankAccountDetails</value>\n\
  \            <value>sample.spring.chapter07.bankapp.domain.FixedDepositDetails</value>\n\
  \        </list>\n    </property>\n</bean>\n```\n\n在上面的示例列表中，`annotatedClasses`\
  \ 属性（类型为 `java.util.List`）列出了所有的持久化类。\n\n**注意** 如果你使用的是 Hibernate 3，请使用 `org.springframework.orm.hibernate3.annotation.SessionFactoryBean`\
  \ 而不是 `org.springframework.orm.hibernate4.LocalSessionFactoryBean`。\n\n既然我们已经配置了\
  \ `SessionFactory`，现在来看看使用 `SessionFactory` 的 DAO。\n\n### 使用 Hibernate API 创建 DAO\n\
  \n为了与数据库交互，DAO 需要访问 Hibernate 的 `Session` 对象。为了访问 `Session` 对象，将由 `LocalSessionFactoryBean`\
  \ 创建的 `SessionFactory` 实例（参见示例 7-9）注入 DAO 中，并使用注入的 `SessionFactory` 实例来获取 `Session`\
  \ 实例。\n\n下面的示例列表显示了使用 Hibernate API 保存和检索 `FixedDepositDetails` 的 `FixedDepositDaoImpl`\
  \ 类：\n\n**示例 7-11** – `FixedDepositDaoImpl` 类 - Hibernate API 使用\n\n**项目** – `ch07-bankapp-hibernate`\n\
  \n**源位置** - `src/main/java/sample/spring/chapter07/bankapp`\n\n```java\npackage\
  \ sample.spring.chapter07.bankapp.dao;\n\nimport org.hibernate.SessionFactory;\n\
  import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Repository;\n\
  \n@Repository(value = \"FixedDepositDao\")\npublic class FixedDepositDaoImpl implements\
  \ FixedDepositDao {\n\n    @Autowired\n    private SessionFactory sessionFactory;\n\
  \n    public int createFixedDeposit(FixedDepositDetails fixedDepositDetails) {\n\
  \        sessionFactory.getCurrentSession().save(fixedDepositDetails);\n       \
  \ return fixedDepositDetails.getFixedDepositId();\n    }\n\n    public FixedDepositDetails\
  \ getFixedDeposit(final int FixedDepositId) {\n        String hql = \"from FixedDepositDetails\
  \ as FixedDepositDetails where \"\n                + \"FixedDepositDetails.FixedDepositId\
  \ =\"\n                + FixedDepositId;\n        return (FixedDepositDetails) sessionFactory.getCurrentSession()\n\
  \                .createQuery(hql).uniqueResult();\n    }\n}\n```\n\n上面的示例列表显示了\
  \ `SessionFactory` 实例被注入到 `FixedDepositDaoImpl` 实例中，随后被 `createFixedDeposit` 和 `getFixedDeposit`\
  \ 方法用于保存和检索 `FixedDepositDetails` 持久实体。`SessionFactory` 实例的注入表明，你只需定义由 `FactoryBean`\
  \ 创建的类型并标有 `@Autowired` 注解，即可注入由 Spring `FactoryBean` 实现类创建的对象（有关 Spring 的 `FactoryBean`\
  \ 接口，请参阅第三章第 9 节）。`createFixedDeposit` 和 `getFixedDeposit` 方法调用 `SessionFactory`\
  \ 的 `getCurrentSession` 方法来获取 `Session` 实例。需要注意的是，调用 `getCurrentSession` 方法返回的是与*当前事务*或*当前线程*关联的\
  \ `Session` 对象。\n\n\n\n\n\n## 7-5 使用 Spring 进行事务管理\n\nSpring 框架支持编式和声明式事务管理。在编式事务管理中，使用\
  \ Spring 的事务管理抽象来显式地启动、结束和提交事务。在声明式事务管理中，你通过 Spring 的 `@Transactional` 注解对在事务中执行的方法进行标记。\n\
  \n让我们先来看 7-2 节描述的 MyBank 的事务管理需求。\n\n## MyBank 的事务管理需求\n\n在 7-2 节中提到，当银行客户开立定期存款时，存款金额将从\
  \ `BANK_ACCOUNT_DETAILS` 表的 `BALANCE_AMOUNT` 列中扣除，并且存款详情将保存到 `FIXED_DEPOSIT_DETAILS`\
  \ 表中。\n\n接下来的序图显示了 `FixedDepositServiceImpl` 类的 `createFixedDeposit` 方法将存款详情保存到\
  \ `FIXED_DEPOSIT_DETAILS` 表中，并从 `BANK_ACCOUNT_DETAILS` 表中相应的银行账户中扣除存款金额：\n\n![](img/00029.jpeg)\n\
  \n**图 7-2** 客户开立新存款时 MyBank 应用执行的操作序列\n\n上述序图显示，`FixedDepositServiceImpl` 的 `createFixedDeposit`\
  \ 方法调用了 `FixedDepositDaoImpl` 的 `createFixedDeposit` 方法以及 `BankAccountDaoImpl` 的\
  \ `subtractFromAccount` 方法。`FixedDepositDaoImpl` 的 `createFixedDeposit` 方法将存款详情保存到\
  \ `FIXED_DEPOSIT_DETAILS` 表中。`BankAccountDaoImpl` 的 `subtractFromAccount` 方法首先检查客户的银行账户是否有足够的余额来创建指定金额的定期存款。如果银行账户余额充足，`subtractFromAccount`\
  \ 方法将从客户的银行账户中扣除存款金额。如果余额不足，`BankAccountDaoImpl` 的 `subtractFromAccount` 方法将抛出一个异常。如果\
  \ `FixedDepositDaoImpl` 的 `createFixedDeposit` 或 `BankAccountDaoImpl` 的 `subtractFromAccount`\
  \ 方法由于原因失败，系统将处于不一致状态；因此，这两个方法必须在事务中执行。\n\n现在让我们来看如何在 MyBank 应用中使用 Spring 编式地管理事务。\n\
  \n## 编式事务管理\n\n你可以通过 Spring 的 `TransactionTemplate` 类或使用 Spring 的 `PlatformTransactionManager`\
  \ 接口的实现来实现编式事务管理。`TransactionTemplate` 类通过处理*启动*和*提交*事务简化了事务管理。你只需要提供一个 Spring `TransactionCallback`\
  \ 接口的实现，其中包含要在事务中执行的代码。\n\n**导入第 7 章/ch07-bankapp-tx-jdbc** (此项目展示了使用 Spring 的 `TransactionTemplate`\
  \ 类进行编式事务管理的 MyBank 应用。要运行该应用程序，请执行该项目 `BankApp` 类的 main 方法。请按照 ch07-bankapp-jdbcproject\
  \ 的描述创建 `SPRING_BANK_APP_DB` 数据库以及 `BANK_ACCOUNT_DETAILS` 和 `FIXED_DEPOSIT_DETAILS`\
  \ 表)\n\n接下来的示例代码列表显示了如何在应用上下文 XML 文件中配置 `TransactionTemplate` 类：\n\n**示例代码列表 7-12**\
  \ – `applicationContext.xml` - `TransactionTemplate` 配置\n\n**项目** – `ch07-bankapp-tx-jdbc`\n\
  \n**源位置** - `src/main/resources/META-INF/spring`\n\n```xml\n    <bean id=\"dataSource\"\
  \ class=\"org.apache.commons.dbcp.BasicDataSource\".....>\n        .....\n    </bean>\n\
  \    <bean id=\"txManager\" class=\"org.springframework.jdbc.datasource.DataSourceTransactionManager\"\
  >\n        <property name=\"dataSource\" ref=\"dataSource\" />\n    </bean>\n  \
  \  <bean id=\"transactionTemplate\" class=\"org.springframework.transaction.support.TransactionTemplate\"\
  >\n        <property name=\"transactionManager\" ref=\"txManager\"/>\n        <property\
  \ name=\"isolationLevelName\" value=\"ISOLATION_READ_UNCOMMITTED\" />\n        <property\
  \ name=\"propagationBehaviorName\" value=\"PROPAGATION_REQUIRED\" />\n    </bean>\n\
  ```\n\n`TransactionTemplate` 的 `transactionManager` 属性引用负责管理事务的 Spring `PlatformTransactionManager`\
  \ 实现。\n\n`TransactionTemplate` 的 `isolationLevelName` 属性指定了为事务管理的事务设置的隔离级别。`isolationLevelName`\
  \ 属性的值引用 Spring `TransactionDefinition` 接口定义的常量。例如，`ISOLATION_READ_UNCOMMITTED`\
  \ 是 `TransactionDefinition` 接口定义的一个常量，表示一个事务*未提交*的更改*可以*被其他事务读取。\n\n`TransactionTemplate`\
  \ 的 `propagationBehaviorName` 属性指定了事务的传播行为。`propagationBehaviorName` 属性的值引用 Spring\
  \ `TransactionDefinition` 接口定义的常量。例如，`PROPAGATION_REQUIRED` 是 `TransactionDefinition`\
  \ 接口定义的一个常量，表示：\n\n- 如果方法*没有*在事务内被调用，事务管理器将启动一个新的事务并在新创建的事务中执行该方法\n- 如果方法在事务内被调用，事务管理器将在同一个*事务中执行该方法\n\
  \nSpring 提供了一些内置的 `PlatformTransactionManager` 实现供选择，取决于应用程序使用的数据访问技术。例如，`DataSourceTransactionManager`\
  \ 适用于使用 JDBC 的应用程序事务管理，`HibernateTransactionManager` 适用于使用 Hibernate 的场景，而 `JpaTransactionManager`\
  \ 适用于 JPA。在列表 7-12 中，由于 `ch07-bankapp-tx-jdbc` 使用 JDBC，`TransactionTemplate` 的 `transactionManager`\
  \ 属性引用 `DataSourceTransactionManager`。接下来的示例代码列表了使用了 `TransactionTemplate` 的 `FixedDepositServiceImpl`：\n\
  \n**示例代码列表 7-13** – 使用 `TransactionTemplate` 的 `FixedDepositServiceImpl`\n**项目**\
  \ – `ch07-bankapp-tx-jdbc`\n**源位置** - `src/main/java/sample/spring/chapter07/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter07.bankapp.service;\n\nimport org.springframework.transaction.TransactionStatus;\n\
  import org.springframework.transaction.support.TransactionCallback;\nimport org.springframework.transaction.support.TransactionTemplate;\n\
  .....\n\n@Service(value = \"FixedDepositService\")\npublic class FixedDepositServiceImpl\
  \ implements FixedDepositService {\n    @Autowired\n    private TransactionTemplate\
  \ transactionTemplate;\n    .....\n\n    @Override\n    public int createFixedDeposit(final\
  \ FixedDepositDetails fixedDepositDetails) throws Exception {\n        transactionTemplate.execute(new\
  \ TransactionCallback<FixedDepositDetails>() {\n            public FixedDepositDetails\
  \ doInTransaction(TransactionStatus status) {\n                try {\n         \
  \           myFixedDepositDao.createFixedDeposit(fixedDepositDetails);\n       \
  \             bankAccountDao.subtractFromAccount(\n                        fixedDepositDetails.getBankAccountId(),\n\
  \                        fixedDepositDetails.getFixedDepositAmount()\n         \
  \           );\n                } catch (Exception e) {\n                    status.setRollbackOnly();\n\
  \                }\n            }\n        });\n    }\n}\n```\n\n\n\n\n```java\n\
  \                return fixedDepositDetails;\n          }\n      });\n      return\
  \ fixedDepositDetails.getFixedDepositId();\n    }\n\n.....\n}\n```\n\n上面的示例显示了 `FixedDepositServiceImpl`\
  \ 的 `createFixedDeposit` 方法（更多细节请参见图 7-2），该方法将定期存款详情保存在 `FIXED_DEPOSIT_DETAILS`\
  \ 表中，并从 `BANK_ACCOUNT_DETAILS` 表中相应的银行账户中扣除定期存款金额。\n\n你创建一个 `TransactionCallback`\
  \ 接口的实现来定义你想在事务中执行的操作。并且，`TransactionTemplate` 的 `execute` 方法会在事务中执行 `TransactionCallback`\
  \ 实例中所包含的操作。`TransactionCallback` 接口定义了一个 `doInTransaction` 方法，你通过实现该方法来提供应在事务内执行的操作。`TransactionCallback`\
  \ 的 `doInTransaction` 方法由 `TransactionTemplate` 的 `execute` 方法在事务内部调用。`doInTransaction`\
  \ 方法接受一个 `TransactionStatus` 对象，你可以用它来控制事务的结果。在示例列表 7-13 中，`TransactionCallback`\
  \ 的 `doInTransaction` 方法包含了对 `FixedDepositDaoImpl` 的 `createFixedDeposit` 方法和 `BankAccountDaoImpl`\
  \ 的 `subtractFromAccount` 方法的调用，因为我们希望这两个方法都在同一个事务中执行。由于如果任何一个方法失败，我们需要回滚事务，因此在发生异常时会调用\
  \ `TransactionStatus` 的 `setRollbackOnly` 方法。如果你调用 `TransactionStatus` 的 `setRollbackOnly`\
  \ 方法，`TransactionTemplate` 实例将回滚事务。如果 `doInTransaction` 方法中包含的操作导致 `java.lang.RuntimeException`，事务将自动回滚。\n\
  \n`TransactionCallback` 实例接受一个 `generic type` 参数，该参数引用了 `doInTransaction` 方法返回的对象类型。在示例列表\
  \ 7-13 中，`doInTransaction` 方法返回一个 `FixedDepositDetails` 对象。如果你不想让 `doInTransaction`\
  \ 方法返回任何对象，请使用实现 `TransactionCallback` 接口的 `TransactionCallbackWithoutResult` 抽象类。`TransactionCallbackWithoutResult`\
  \ 类允许你创建 `doInTransaction` 方法不返回值的 `TransactionCallback` 实现。\n\n接下来的示例列表显示了 `BankApp`\
  \ 类的 `main` 方法，该方法调用了 `BankAccountServiceImpl` 的 `createBankAccount` 方法来创建银行账户，并调用了\
  \ `FixedDepositServiceImpl` 的 `createFixedDeposit` 方法为新创建的银行账户创建定期存款：\n\n**示例列表\
  \ 7-14** – `BankApp` 类\n\n**项目** – `ch07-bankapp-tx-jdbc`\n\n**源位置**- `src/main/java/sample/spring/chapter07/bankapp`\n\
  \n```java\npackage sample.spring.chapter07.bankapp;\n\npublic class BankApp {\n\n\
  \    .....\n\n    public static void main(String args[]) throws Exception {\n  \
  \      ApplicationContext context = new ClassPathXmlApplicationContext(\n      \
  \          \"classpath:META-INF/spring/applicationContext.xml\");\n        BankAccountService\
  \ bankAccountService = context.getBean(BankAccountService.class);\n        FixedDepositService\
  \ FixedDepositService = context.getBean(FixedDepositService.class);\n        BankAccountDetails\
  \ bankAccountDetails = new BankAccountDetails();\n        bankAccountDetails.setBalanceAmount(1000);\n\
  \        .....\n        int bankAccountId = bankAccountService.createBankAccount(bankAccountDetails);\n\
  \        FixedDepositDetails fixedDepositDetails = new FixedDepositDetails();\n\
  \        fixedDepositDetails.setDepositAmount(1500);\n        fixedDepositDetails.setAccountId(bankAccountId);\n\
  \        .....\n        int fixedDepositId = FixedDepositService.createFixedDeposit(fixedDepositDetails);\n\
  \    }\n}\n```\n\n上面的示例显示首先创建了一个余额为 1000 的银行账户，随后创建了 1500 的定期存款。如果你执行 `BankApp`\
  \ 的 `main` 方法，你会发现定期存款已在 `FIXED_DEPOSIT_DETAILS` 表中，并从 `BANK_ACCOUNT_DETAILS` 表中扣除。\n\
  \n### 声明式事务管理\n\n编程式式事务管理将你的应用程序代码与 Spring 特有的类耦合。相比之下，声明式事务管理仅只需要用 `@Transactional`\
  \ 注解方法或类。\n\n**注意** 与其使用 `@Transactional` 注解进行声明式事务管理，可以使用 Spring 的 tx 元素来识别事务方法。\n\
  \n**导入** `ch07-bankapp-jdbc` 和 `ch07-bankapp-hibernate`。`ch07-bankapp-jdbc` 项目展示了使用\
  \ Spring JDBC 模块进行数据库交互的 MyBank 应用（参见章节 7-3 了解更多 `ch07-bankapp-jdbc` 的信息）。`ch07-bankapp-hibernate`\
  \ 项目展示了使用 Hibernate 与数据库交互的 MyBank 应用（参见章节 7-4 了解更多 `ch07-bankapp-hibernate` 的信息）。\n\
  \n你通过 Spring tx 架构的 `<annotation-driven>` 元素启用声明式事务管理。下面的示例列表显示了项目中 `<annotation-driven>`\
  \ 元素的使用：\n\n**示例列表 7-15** – `applicationContext.xml` - `<annotation-driven>`\n\n\
  **项目** – `ch07-bankapp-jdbc`\n\n**源位置**- `src/main/resources/META-INF/spring`\n\n\
  ```xml\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\n       xmlns:xsi=\"\
  http://www.w3.org/2001/XMLSchema-instance\"\n       xmlns:tx=\"http://www.springframework.org/schema/tx\"\
  \n       xsi:schemaLocation=\"http://www.springframework.org/schema/beans\n    \
  \       http://www.springframework.org/schema/beans/spring-beans.xsd\n         \
  \  http://www.springframework.org/schema/tx\n           http://www.springframework.org/schema/tx/spring-tx-4.0.xsd\"\
  >\n\n    .....\n\n    <tx:annotation-driven transaction-manager=\"txManager\" />\n\
  \n    <bean id=\"txManager\"\n          class=\"org.springframework.jdbc.datasource.DataSourceTransactionManager\"\
  >\n        <property name=\"dataSource\" ref=\"dataSource\" />\n    </bean>\n\n\
  \    .....\n</beans>\n```\n\n在上面的示例列表中，引入了 Spring 的 tx 架构，以便其元素可以在应用上下文 XML 文件中可用。`<annotation-driven>`\
  \ 元素启用了声明式事务管理。`<annotation-driven>` 元素的 `transaction-manager` 属性指定了用于事务管理的 `PlatformTransactionManager`\
  \ 实现的引用。上面的示例列表显示，在 `ch07-bankapp-jdbc` 项目中使用 `DataSourceTransactionManager` 作为事务管理器。\n\
  \n接下来的示例列表展示了如何在使用 Hibernate ORM 进行数据访问的 `ch07-bankapp-hibernate` 项目中使用声明式事务管理。\n\
  \n\n\n\n\n## 示例列表 7-16 – `applicationContext.xml` - `<annotation-driven>` \n\n**项目**\
  \ – `ch07-bankapp-hibernate`\n\n**源位置** - `/src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans ..... xmlns:tx=\"http://www.springframework.org/schema/tx\"\n \
  \   xsi:schemaLocation=\".....http://www.springframework.org/schema/tx\n       \
  \  http://www.springframework.org/schema/tx/spring-tx-4.0.xsd\">\n    .....\n  \
  \  <tx:annotation-driven transaction-manager=\"txManager\" />\n    <bean id=\"txManager\"\
  \ class=\"org.springframework.orm.hibernate4.HibernateTransactionManager\">\n  \
  \      <property name=\"sessionFactory\" ref=\"sessionFactory\"/>\n    </bean>\n\
  \    .....\n</beans>\n```\n\n如果你将上述示例列表与 7-15 进行比较，你会发现唯一的区别在于 `<annotation-driven>`\
  \ 元素的 `transaction-manager` 属性所引用的 `PlatformTransactionManager` 实现类。上面的示例列表显示，如果使用\
  \ Hibernate ORM 进行数据库交互，则使用 `PlatformTransactionManager` 的 `org.springframework.orm.hibernate4.HibernateTransactionManager`\
  \ 实现来管理事务。\n\n**注意** 如果你在使用 Hibernate 3，请将 `transaction-manager` 属性设置为 `org.springframework.orm.hibernate3.HibernateTransactionManager`\
  \ 而不是 `org.springframework.orm.hibernate4.HibernateTransactionManager`。\n\n接下来的示例列表显示了声明式事务管理的\
  \ `FixedDepositServiceImpl` 类：\n\n### 示例列表 7-17 – `FixedDepositServiceImpl` 类 -\
  \ `@Transactional` 注解用法\n\n**项目** – `ch07-bankapp-jdbc`\n\n**源位置** - `/src/main/java/sample/spring/chapter07/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter07.bankapp.service;\n\nimport org.springframework.transaction.annotation.Transactional;\n\
  \n.....\n\n@Service(value = \"FixedDepositService\")\npublic class FixedDepositServiceImpl\
  \ implements FixedDepositService {\n    .....\n    @Transactional\n    public int\
  \ createFixedDeposit(FixedDepositDetails fixedDepositDetails) throws Exception {\n\
  \        bankAccountDao.subtractFromAccount(fixedDepositDetails.getBankAccountId(),\n\
  \            fixedDepositDetails.getFixedDepositAmount());\n        return myFixedDepositDao.createFixedDeposit(fixedDepositDetails);\n\
  \    }\n    .....\n}\n```\n\n在上面的示例列表中，`createFixedDeposit` 方法标记了 `@Transactional`\
  \ 注解。这意味着 `createFixedDeposit` 方法是在事务中执行的。通过 `<annotation-driven>` 元素的 `transaction-manager`\
  \ 属性指定的事务管理器（参见示例列表 7-15 和 7-16）被用于管理事务。如果在执行 `createFixedDeposit` 方法期间抛出了 `java.lang.RuntimeException`，事务将自动回滚。\n\
  \n`@Transactional` 注解定义了多个属性，你可以使用这些属性来配置事务管理器的行为。例如，你可以使用 `rollbackFor` 属性来指定导致事务回滚的异常类。由\
  \ `rollbackFor` 属性指定的异常类*必须*是 `java.lang.Throwable` 类的子类。同样，你可以使用 `isolation` 属性来指定事务隔离级别。\n\
  \n如果你的应用程序定义了多个事务管理器，你可以使用 `@Transactional` 注解的 `value` 属性来指定用于管理事务的 `PlatformTransactionManager`\
  \ 实现的 Bean 名称。接下来的示例列表显示在应用上下文 XML 文件定义了两个事务管理器 `tx1` 和 `tx2`。`tx1` 事务管理器被 `SomeServiceImpl`\
  \ 的 `methodA` 使用，`tx2` 事务管理器被 `SomeServiceImpl` 的 `methodB` 使用：\n\n## 示例列表 7-18\
  \ – `@Transactional` 的 `value` 属性用法\n\n**----------------------- SomeServiceImpl\
  \ 类 ------------------------**\n\n```java\n@Service\npublic class SomeServiceImpl\
  \ implements SomeService {\n    .....\n    @Transactional(value = \"tx1\")\n   \
  \ public int methodA() {.....}\n    @Transactional(value = \"tx2\")\n    public\
  \ int methodB() {.....}\n}\n```\n\n**----------------------- application context\
  \ XML 文件 ------------------------**\n\n```xml\n    <tx:annotation-driven />\n  \
  \  <bean id=\"tx1\" class=\"org.springframework.orm.hibernate4.HibernateTransactionManager\"\
  >\n        <property name=\"sessionFactory1\" ref=\"sessionFactory1\"/>\n    </bean>\n\
  \    <bean id=\"tx2\" class=\"org.springframework.jdbc.datasource.DataSourceTransactionManager\"\
  >\n        <property name=\"dataSource\" ref=\"dataSource\" />\n    </bean>\n```\n\
  \n在上面的示例列表中，Spring tx 架构的 `<annotation-driven>` 元素没有指定 `transaction-manager` 属性，因为用于管理事务的事务管理器是由\
  \ `@Transactional` 注解本身指定的。在示例中，`@Transactional` 注解的 `value` 属性指定了管理事务的事务管理器。这意味着\
  \ `SomeServiceImpl` 的 `methodA` 在 `tx1` 事务管理器下执行，而 `SomeServiceImpl` 的 `methodB`\
  \ 在 `tx2` 事务管理器下执行。\n\n现在让我们 Spring 对 JTA（Java Transaction API）事务的支持。\n\n### Spring\
  \ 对 JTA 的支持\n\n在第 1 章中，我们讨论了当事务涉及多个事务资源时，使用 JTA 进行事务管理。Spring 提供了一个通用的 `JtaTransactionManager`\
  \ 类（一个 `PlatformTransactionManager` 实现），你可以在应用程序中使用它管理 JTA 事务。\n\n![](img/0030.jpeg)\n\
  \n**图 7-3** JTA 事务管理器和特定资源事务管理器实现了 `PlatformTransactionManager`\n\n在大多数应用服务器环境中，`JtaTransactionManager`\
  \ 都能满足你的需求。但 Spring 还提供了特定厂商的 `PlatformTransactionManager` 实现，利用应用服务器的功能管理 JTA 事务。Spring\
  \ 提供的特定厂商 JTA 事务管理器包括：`OCJJtaTransactionManager` 用于 Oracle OC4J`WebLogicJtaTransactionManager`\
  \ 用于 WebLogic 应用服务器，`WebSphereUowTransactionManager` 用于 WebSphere 应用服务器。图 7-3 总结了\
  \ JTA 事务管理器和特定资源事务管理器与 `PlatformTransactionManager` 的关系。该图显示 `PlatformTransactionManager`\
  \ 被 JTA 事务管理器类和特定资源事务管理器类实现。\n\n现在来看看 Spring 如何简化 XML 中配置 JTA 事务管理器。\n\n### 使用 `<jta-transaction-manager>`\
  \ 元素配置 JTA 事务管理器\n\nSpring tx 架构提供了 `<jta-transaction-manager>` 元素，它可以自动检测部署应用程序的应用服务器并配置相应的\
  \ JTA 事务管理器。这避免了在 XML 文件中显式配置特定应用服务器事务管理器的工作。例如，如果你在 WebSphere 应用服务器中部署应用程序，`<jta-transaction-manager>`\
  \ 元素将配置 `WebSphereUowTransactionManager` 实例。如果相同的应用程序部署在 WebLogic 应用服务器中，该元素将配置\
  \ `WebLogicJtaTransactionManager` 实例。如果部署在 OC4J、WebSphere 或 WebLogic 之外的任何应用服务器中，该元素将配置\
  \ `JtaTransactionManager` 实例。\n\n## 7-6 总结\n\n在本章中，我们看到了 Spring 支持使用 JDBC 和 Hibernate\
  \ ORM 框架进行数据库交互。我们还学习了如何使用 Spring 以编程式和声明式的方式管理事务。在下一章中，我们将研究 Spring 如何简化发送电子邮件、与消息中间件交互以及对数据进行透明缓存。\n\
  \n\n\n\n\n# 第 8 章 - 使用 Spring 进行消息、电子邮件、异步方法执行和缓存\n\n## 8-1 引言\n\n在上一章中，我们看到 Spring\
  \ 如何简化数据库交互。在 MyBank 应用的背景下，本章更进了一步，展示了 Spring 如何简化：\n\n· 从 JMS 供给者（如 ActiveMQ）发送和接收\
  \ JMS 消息\n· 发送电子邮件\n· 异步执行方法\n· 从缓存中存储和检索数据\n\n让我们先来看看本章中将实现的 MyBank 应用需求。\n\n##\
  \ 8-2 MyBank 应用需求\n\nMyBank 应用允许客户办理定期存款并查询其现有定期存款的详情。图 8-1 显示当客户请求开启新的定期存款时发生的事件序列。\n\
  \n首先，调用 `FixedDepositService` 的 `createFixedDeposit` 方法，该方法会发送 2 条 JMS 消息——一条包含客户电子邮件\
  \ ID 的消息，以及一条包含定期存款详情的消息。`EmailMessageListener` 获取包含客户电子邮件 ID 的 JMS 消息，并向客户发送电子邮件，通知其已收到开启定期存款的请求。`FixedDepositMessageListener`\
  \ 获取包含定期存款详情的 JMS 消息，并将定期存款详情保存到数据库。\n\n一个定时任务每 5 秒运行一次，检查数据库中是否创建了任何新的定期存款。如果任务发现了任何新的定期存款，它将从客户的银行账户中扣除存款金额，并向客户发送电子邮件通知定期存款请求已成功处理。\n\
  \n![](img/00031.jpeg)\n\n**图 8-1** 客户请求开启新定期存款时 MyBank 应用的行为\n\n下图显示了当调用 `FixedDepositService`\
  \ 的 `findFixedDepositsByBankAccount` 方法检索对应银行账户的所有定期存款时，MyBank 应用的行为：\n\n![](img/00032.jpeg)\n\
  \n**图 8-2** 客户请求所有定期存款详情时 MyBank 应用的行为\n\n上图显示，当调用 `FixedDepositService` 的 `findFixedDepositsByBankAccount`\
  \ 方法时，定期存款信息从数据库获取并缓存到内存中。如果你再次调用 `FixedDepositService` 的 `findFixedDepositsByBankAccount`，定期存款信息将从缓存而非数据库中获取。\n\
  \n现在让我们来看看如何在 MyBank 应用中使用 Spring 向在 ActiveMQ 中配置的 JMS 目标发送 JMS 消息。\n\n**导入** `chapter\
  \ 8/ch08-bankapp`（为了充分利用本章，请安装 MySQL 数据库并执行 `ch08-bankapp` 项目 sql 文件夹中的 `spring_bank_app_db.sql`\
  \ SQL 脚本。执行 `spring_bank_app_db.sql` 脚本将创建 `SPRING_BANK_APP_DB` 数据库，并在其中添加 `BANK_ACCOUNT_DETAILS`\
  \ 和 `FIXED_DEPOSIT_DETAILS` 表。修改 `src/main/resources/META-INF/spring/database.properties`\
  \ 以指向你的 MySQL 安装路径。要使电子邮件功能生效，请修改 `src/main/resources/META-INF/spring/email.properties`\
  \ 指定指定的服务器和用于发送邮件的账户。修改 `BankApp` 类以指定接收邮件的客户电子邮件 ID）\n\n## 8-3 发送 JMS 消息\n\nSpring\
  \ 通过在 JMS API 之上提供抽象层，简化了与 JMS 供给者的交互。在 MyBank 应用的背景下，本节展示了如何使用 Spring *同步*和*异步*地从\
  \ ActiveMQ 代理发送和接收消息。为了简单起见，`ch08-bankappproject` 中的 ActiveMQ 代理被配置为*嵌入*模式运行。\n\n\
  **注意** 在 Spring 中，JMS 支持类定义在 `spring-jms` JAR 包中；因此，你必须定义应用程序依赖 `spring-jms` JAR\
  \ 包以使用 Spring 对 JMS 的支持。\n\n### 配置 ActiveMQ 代理以嵌入模式运行\n\n嵌入式 ActiveMQ 代理在与应用程序*相同的*\
  \ JVM 中。你可以使用 ActiveMQ 的 XML 架构在 Spring 应用中配置嵌入式 ActiveMQ 代理。以下示例列表显示了如何使用 ActiveMQ\
  \ 的 XML 架构在 MyBank 应用中配置嵌入式 ActiveMQ 代理：\n\n**示例列表 8-1** – `applicationContext.xml`\
  \ – 嵌入式 ActiveMQ 代理配置\n\n**项目** – `ch08-bankapp`\n\n**源位置** – `src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans .....\n    xmlns:amq=\"http://activemq.apache.org/schema/core\"\
  \n    xsi:schemaLocation=\".....http://activemq.apache.org/schema/core\n       \
  \ http://activemq.apache.org/schema/core/activemq-core-5.7.0.xsd.....\">\n    <amq:broker>\n\
  \        <amq:transportConnectors>\n            <amq:transportConnector uri=\"tcp://localhost:61616\"\
  \ />\n        </amq:transportConnectors>\n    </amq:broker>\n    .....\n</beans>\n\
  ```\n\n在上面的示例列表中，`amq` 命名空间引用 ActiveMQ 的 XML 架构（`activemq-core-5.7.0.xsd`），它允许你配置嵌入式\
  \ ActiveMQ 代理。`<broker>` 元素配置了一个名为 `localhost` 的嵌入式 ActiveMQ 代理。`<transportConnectors>`\
  \ 元素指定了嵌入式 ActiveMQ 客户端连接的传输连接器。在上面的示例列表中，`<transportConnector>` 子元素指定了客户端可以通过 TCP\
  \ 端口 61616 连接到嵌入式 ActiveMQ。\n\n现在让我们看看如何配置 JMSFactory。\n\n### 配置 JMSFactory\n\n\
  以下示例列表显示了如何在应用上下配置 JMSFactory：\n\n**示例列表 8-2** – `applicationContext.xml` – JMSFactory\
  \ 配置\n\n**项目** – `ch08-bankapp`\n\n**源位置** – `src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans .....\n    xmlns:amq=\"http://activemq.apache.org/schema/core\"\
  \n    xsi:schemaLocation=\".....http://activemq.apache.org/schema/core\n       \
  \ http://activemq.apache.org/schema/core/activemq-core-5.7.0.xsd.....\">\n    .....\n\
  \    <amq:connectionFactory brokerURL=\"vm://localhost\" id=\"jmsFactory\" />\n\
  \    <bean class=\"org.springframework.jms.connection.CachingConnectionFactory\"\
  \ id=\"cachingConnectionFactory\">\n        <property name=\"targetConnectionFactory\"\
  \ ref=\"jmsFactory\" />\n    </bean>\n    .....\n</beans>\n```\n\n在上面的示例列表中，`amq`\
  \ 架构的 `<connectionFactory>` 元素创建一个用于连接嵌入式 ActiveMQ 实例的 JMSFactory 实例（参考示例列表 8-1）。`brokerURL`\
  \ 属性指定了连接 ActiveMQ 代理的 URL。由于我们使用的是嵌入式 ActiveMQ 代理，`brokerURL` 指定使用 VM 协议（由 `vm://`）连接到\
  \ ActiveMQ 代理实例。\n\nSpring 的 `CachingConnectionFactory` 是 JMS ConnectionFactory（通过\
  \ `targetConnectionFactory` 属性指定）的适配器，提供了缓存 `Session`、`MessageProducer` 和 `MessageConsumer`\
  \ 实例的额外功能。\n\n现在让我们看看如何使用 Spring 的 `JmsTemplate` 类发送 JMS 消息。\n\n### 使用 JmsTemplate\
  \ 发送 JMS 消息\n\nSpring `JmsTemplate` 类简化了*同步*发送和接收 JMS 消息。在本章中，我们只关注如何使用 `JmsTemplate`\
  \ 发送 JMS 消息。类似于 `TransactionTemplate`（参考第 7 章第 5 节）和 `JdbcTemplate`（参考第 7 章第 3 节）类，`JmsTemplate`\
  \ 类提供了一个抽象层，让你无需处理底层的 JMS API。\n\n下面的示例列表显示了如何在 MyBank 应用的应用 XML 文件中配置 `JmsTemplate`\
  \ 类，以便向嵌入式 ActiveMQ 实例发送消息：\n\n\n\n\n\n# 示例列表 8-3 – applicationContext.xml – JmsTemplate\
  \ 配置\n\n**项目** – ch08-bankapp\n**源文件** - `/src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans .....\n    xmlns:amq=\"http://activemq.apache.org/schema/core\"\
  \n    xsi:schemaLocation=\".....http://activemq.apache.org/schema/core\n       \
  \ http://activemq.apache.org/schema/core/activemq-core-5.7.0.xsd\".....\">\n   \
  \ .....\n    <bean class=\"org.springframework.jms.core.JmsTemplate\" id=\"jmsTemplate\"\
  >\n        <property name=\"connectionFactory\" ref=\"cachingConnectionFactory\"\
  \ />\n        <property name=\"defaultDestination\" ref=\"FixedDepositDestination\"\
  \ />\n    </bean>\n    <amq:queue id=\"FixedDepositDestination\" physicalName=\"\
  aQueueDestination\" />\n    <amq:queue id=\"emailQueueDestination\" physicalName=\"\
  emailQueueDestination\" />\n    .....\n</beans>\n```\n\n`JmsTemplate` 的 `connectionFactory`\
  \ 属性指定了用于与 JMS 提供者创建连接的 `JMS ConnectionFactory`。`JmsTemplate` 的 `defaultDestination`\
  \ 属性指的是 `JmsTemplate` 发送 JMS 消息的默认 JMS 目标。在上面的示例列表中，`connectionFactory` 属性引用 `CachingConnectionFactory`\
  \ 实例（参见示例列表 8-2），而 `defaultDestination` 属性引用由 `amq` 架构的 `<queue>` 元素创建的 JMS 队列目标。\n\
  \n`amq` 架构的 `<queue>` 元素在 ActiveMQ 中创建一个 JMS 队列目标。在示例 8-3 中，第一个 `<queue>` 元素在 ActiveMQ\
  \ 中创建了一个名为 `aQueueDestination` 的 JMS 队列目标，第二个 `<queue>` 元素在 ActiveMQ 中创建了一个名为 `emailQueueDestination`\
  \ 的 JMS 队列目标。`physicalName` 属性指的是在 ActiveMQ 中创建 JMS 队列目标时的名称，而 `id` 属性指的是 Spring\
  \ 容器中的其他 bean 访问 JMS 队列目标的名称。在示例列表 8-3 中，`JmsTemplate` 的 `defaultDestination` 属性引用创建\
  \ `aQueueDestination` JMS 目的的 `<queue>` 元素的 `id` 属性；因此，`aQueueDestination` 是 `JmsTemplate`\
  \ 实例发送 JMS 消息的默认 JMS 目标。\n\n`JmsTemplate` 使用的 `JMS Session` 确认模式设置为 `auto-acknowledge`，且本质上**不是事务的**\
  \ (`not transacted`)。如果你希望 `JmsTemplate` 使用事务型 Session，请将 `JmsTemplate` 的 `transacted`\
  \ 属性设置为 `true`。在事务 Session 的情况下，当应用程序创建 `Session` 或者当事务提交或回滚时，将开始一个新的事务。这意味着事务型\
  \ JMS Session `始终` 与事务相关联。你可以使用事务型 JMS Session 在事务内发送和接收 JMS 消息。如果你结合 Spring 的 `JmsTransactionManager`\
  \ 使用 `JmsTemplate`，则 `JmsTemplate` 实例将始终获得事务型 JMS Session。\n\n现在让我们来看看如何配置 `JmsTransactionManager`，以及如何通过\
  \ `JmsTemplate` 在事务内发送 JMS 消息。\n\n### 在事务内发送 JMS 消息\n\n在第 7 章中，我们看到 Spring 提供了几个\
  \ `PlatformTransactionManager` 实现，以提供特定资源的事务管理。在你的 JMS 应用中，你可以使用 Spring 的 `JmsTransactionManager`\
  \ 类（`PlatformTransactionManager` 的实现）来为单个 `JMS ConnectionFactory` 管理事务。由于 `JmsTransactionManager`\
  \ 实现了 `PlatformTransactionManager`，你可以使用 `TransactionTemplate` 以编程方式管理 JMS 事务，或者使用\
  \ `@Transactional` 注解来声明式地管理 JMS 事务。\n\n下面的示例列表展示了 application context XML 文件中 Spring\
  \ 的 `JmsTransactionManager` 的配置：\n\n**示例列表 8-4** – applicationContext.xml – JmsTransactionManager\
  \ 配置\n\n**项目** – ch08-bankapp\n**源文件** - `/src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"jmsTxManager\" class=\"org.springframework.jms.connection.JmsTransactionManager\"\
  >\n    <property name=\"connectionFactory\" ref=\"cachingConnectionFactory\" />\n\
  </bean>\n```\n\n`JmsTransactionManager` 的 `connectionFactory` 属性指定了 `JmsTransactionManager`\
  \ 管理事务的 `JMS ConnectionFactory` 引用。在上面的示例列表中，对 Spring 的 `CachingConnectionFactory`\
  \ bean 的引用（参见示例列表 8-2）被指定为 `connectionFactory` 属性的值。由于 `CachingConnectionFactory`\
  \ 会缓存 JMS Session，将 `CachingConnectionFactory` 与 `JmsTransactionManager` 使用会导致资源利用率降低。\n\
  \n如果你想使用 `TransactionTemplate` 类以编程方式管理 JMS 事务，请在 application context XML 文件中配置\
  \ `TransactionTemplate` 类。如果你想使用声明式事务管理，请使用 Spring `tx` 架构的 `<annotation-driven>`\
  \ 元素。\n\n下面的示例列表展示了 `FixedDepositServiceImpl` 类，它利用 `JmsTemplate` 向嵌入的 ActiveMQ\
  \ 代理发送消息：\n\n**示例列表 8-5** – FixedDepositServiceImpl 类 – 使用 JmsTemplate 发送 JMS 消息\n\
  \n**项目** – ch08-bankapp\n**源文件** - `/src/main/java/sample/spring/chapter08/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter08.bankapp.service;\n\nimport javax.jms.*;\n\
  import org.springframework.jms.core.JmsTemplate;\nimport org.springframework.jms.core.MessageCreator;\n\
  \n@Service(value = \"FixedDepositService\")\npublic class FixedDepositServiceImpl\
  \ implements FixedDepositService {\n\n    @Autowired\n    private JmsTemplate jmsTemplate;\n\
  \n    .....\n\n    @Override\n    @Transactional(\"jmsTxManager\")\n    public void\
  \ createFixedDeposit(final FixedDepositDetails fixedDepositDetails) throws Exception\
  \ {\n        jmsTemplate.send(\"emailQueueDestination\", new MessageCreator() {\n\
  \            public Message createMessage(Session session) throws JMSException {\n\
  \                TextMessage textMessage = session.createTextMessage();\n      \
  \          textMessage.setText(fixedDepositDetails.getEmail());\n              \
  \  return textMessage;\n            }\n        });\n        //这条 JMS 消息发送到 JmsTemplate\
  \ 配置的默认目标\njmsTemplate.send(new MessageCreator() {\n            public Message createMessage(Session\
  \ session) throws JMSException {\n                ObjectMessage objectMessage =\
  \ session.createObjectMessage();\n                objectMessage.setObject(fixedDepositDetails);\n\
  \                return objectMessage;\n            }\n        });\n    }\n\n  \
  \  .....\n}\n```\n\n\n\n\n\n在示例列表 8-5 中，`FixedDepositServiceImpl` 的 `createFixedDeposit`\
  \ 方法被标记了 `@Transactional(\"jmsTxManager\")`，这意味着 `createFixedDeposit` 方法在事务中执行，并且该事务由\
  \ `jmsTxManager` 事务管理器管理（请参阅示例列表 8-4 查看如何配置 `jmsTxManager`）。`JmsTemplate` 的 `send`\
  \ 方法接收 JMS 目的地的名称（要发送 JMS 消息的目的地）和一个 `MessageCreator` 实例。如果你没有指定 JMS 目的地，`send`\
  \ 方法将把 JMS 消息发送到你使用 `defaultDestination` 属性为 `JmsTemplate` 配置的 `default` 目的地（请参阅示例列表\
  \ 8-3）。\n\n在 `MessageCreator` 的 `createMessage` 方法中，你创建了想要发送的 JMS 消息。你不需要显式处理 JMS\
  \ API 抛出的受检异常，因为这些异常由 `JmsTemplate` 本身处理了。示例列表 8-5 显示，如果你使用 `JmsTemplate`，你不需要显式地从\
  \ `ConnectionFactory` 获取 `Connection`、从 `Connection` 创建 `Session` 等等来发送 JMS 消息。因此，使用\
  \ `JmsTemplate` 为开发者隐藏了底层的 JMS API 细节。\n\n在示例列表 8-5 中，`TextMessage` 和 `ObjectMessage`\
  \ 实例代表 JMS 消息。`TextMessage` 和 `ObjectMessage` 类都实现了 `javax.jms.Message` 接口。在 `MyBank`\
  \ 应用中，`TextMessage` 实例被用于发送请求开定的客户的电子邮件 ID（一个简单的字符串值），而 `ObjectMessage` 实例被用于发送包含存款信息的\
  \ `FixedDepositDetails` 对象（一个 `Serializable` 对象）。由于 `FixedDepositServiceImpl` 的\
  \ `createFixedDeposit` 方法在 JMS 事务中执行，因此两条消息要么都发送到 ActiveMQ 实例，要么都不发送。\n\n与其使用 `@Transactional`\
  \ 注解，你可以使用 `TransactionTemplate` 类通过编程方式管理 JMS 事务（参阅第 7 章第 7-5 节）。下面的示例列表显示了如何配置\
  \ `TransactionTemplate` 类使用 `JmsTransactionManager` 进行事务管理：\n\n#### 示例列表 8-6 – TransactionTemplate\
  \ 配置\n\n```xml\n<bean id=\"jmsTxManager\"\n    class=\"org.springframework.jms.connection.JmsTransactionManager\"\
  >\n    <property name=\"connectionFactory\" ref=\"cachingConnectionFactory\" />\n\
  </bean>\n<bean id=\"transactionTemplate\"\n    class=\"org.springframework.transaction.support.TransactionTemplate\"\
  >\n    <property name=\"transactionManager\" ref=\"jmsTxManager\" />\n</bean>\n\
  ```\n\n在上面的示例列表中，`TransactionTemplate` 的 `transactionManager` 属性引用了 `JmsTransactionManager`\
  \ bean。\n\n一旦你配置了 `TransactionTemplate` 类，就可以使用它来管理 JMS 事务。下面的示例列表显示了 `FixedDepositServiceImpl.createFixedDeposit`\
  \ 方法的一个变体，该方法使用 `TransactionTemplate` 管理 JMS 事务：\n\n#### 示例列表 8-7 – 使用 TransactionTemplate\
  \ 编化管理 JMS 事务\n\n```java\npackage sample.spring.chapter08.bankapp.service;\n\nimport\
  \ javax.jms.*;\n\nimport org.springframework.jms.core.JmsTemplate;\nimport org.springframework.jms.core.MessageCreator;\n\
  \n@Service(value = \"FixedDepositService\")\npublic class FixedDepositServiceImpl\
  \ implements FixedDepositService {\n\n    @Autowired\n    private JmsTemplate jmsTemplate;\n\
  \n    @Autowired\n    private TransactionTemplate transactionTemplate;\n\n    .....\n\
  \n    public void createFixedDeposit(final FixedDepositDetails fixedDepositDetails)\
  \ throws Exception {\n        transactionTemplate.execute(new TransactionCallbackWithoutResult()\
  \ {\n            protected void doInTransactionWithoutResult(TransactionStatus status)\
  \ {\n                jmsTemplate.send(\"emailQueueDestination\", new MessageCreator()\
  \ { ..... });\n                jmsTemplate.send(new MessageCreator() { ..... });\n\
  \            }\n        });    \n    }\n\n    .....\n}\n```\n\n上面的示例列表显示，JMS 消息是从\
  \ `TransactionCallbackWithoutResult` 类的 `doInTransaction` 方法内部发送的，因此它们处于同一个 JMS\
  \ 事务中。这与我们使用 `TransactionTemplate` 编程管理 JDBC 事务（参阅第 7 章第 7-5 节）的方式相似。\n\n到为止，我们已经看到了使用\
  \ `JmsTemplate` 将消息发送到预配置的 JMS 目的地的示例。现在让我们看看如果应用程序使用动态 JMS 目的地，应该如何配置 `JmsTemplate`\
  \ 类。\n\n### 动态 JMS 目的地和 JmsTemplate 配置\n\n如果你的应用程序使用动态 JMS 目的地（即 JMS 目的地是由应用程序在运行时创建的），你必须指定\
  \ JMS 目的地类型（队列或主题）。`JmsTemplate` 的 `pubSubDomain` 属性用于确定目的地类型。如果你没有指定 `pubSubDomain`\
  \ 属性，则假设目的地是队列。下面的示例列表显示了向以下位置发送消息的 `msTemplate`：\n\n#### 示例列表 8-8 – 使用 JmsTemplate\
  \ 处理动态目的地\n\n**applicationContext.xml**\n```xml\n<bean class=\"org.springframework.jms.core.JmsTemplate\"\
  \ id=\"jmsTemplate\">\n    <property name=\"connectionFactory\" ref=\"cachingConnectionFactory\"\
  \ />\n    <property name=\"defaultDestination\" ref=\"FixedDestination\" />\n  \
  \  <property name=\"pubSubDomain\" value=\"true\" />\n</bean>\n```\n\n**动态主题创建 --**\n\
  \n```java\njmsTemplate.send(\"dynamicTopic\", new MessageCreator() {\n    public\
  \ Message createMessage(Session session) throws JMSException {\n        session.createTopic(\"\
  dynamicTopic\");\n        ObjectMessage objectMessage = session.createObjectMessage();\n\
  \        objectMessage.setObject(someObject);\n        return objectMessage;\n \
  \   }\n});\n```\n\n在上面的示例列表中，`JmsTemplate` 的 `pubSubDomain` 属性设置为 `true`，这意味着当使用动态目的地时，Spring\
  \ 将动态目的地名称解析为主题。注意传递给 `jmsTemplate.send` 方法的 JMS 目的地名称为 `dynamicTopic`，`MessageCreator.createMessage`\
  \ 方法创建了同名的 JMS 主题。由于应用程序 XML 文件没有配置 `dynamicTopic` JMS 目的地，Spring 并不知道动态 JMS 目的地是队列还是主题。由于\
  \ `JmsTemplate` 的 `pubSubDomain` 属性设置为 `true`，Spring 的 `DynamicDestinationResolver`\
  \ 将 `dynamicTopic` JMS 目的地名称解析为 `MessageCreator.createMessage` 方法在运行时创建的 `dynamicTopic`\
  \ JMS 主题。如果你*没有*设置 `JmsTemplate` 的 `pubSubDomain` 属性，Spring 的 `DynamicDestinationResolver`\
  \ 将尝试将 `dynamicTopic` JMS 目的地名称解析为队列队列。\n\n### JmsTemplate 和消息转换\n\n现在让我们看看 `JmsTemplate`\
  \ 如何简化将 Java 对象作为 JMS 消息发送。`JmsTemplate` 定义了多个 `convertAndSend` 方法，用于转换并发送 Java\
  \ 对象作为 JMS 消息。默认情况下，`JmsTemplate` 配置了一个 `SimpleMessageConverter` 实例（Spring `MessageConverter`\
  \ 接口的实现），它用于将 Java 对象转换为 JMS 消息，反之亦然。\n\n`MessageConverter` 接口定义了以下方法：\n\n- `Object\
  \ toMessage(Object object, Session session)` – 使用提供的 `JMS Session`（由 `session` 参数表示）将\
  \ Java 对象（由 `object` 参数表示）转换为 `JMS Message`\n- `Object fromMessage(Message message)`\
  \ - 将 `message` 参数转换为 Java 对象\n\n\n\n\n\nSpring 的 `SimpleMessageConverter` 类提供了\
  \ `String` 与 `JMS TextMessage`、`byte[]` 与 `JMS BytesMessage`、`Map` 与 `JMS MapMessage`\
  \ 以及 `Serializable` 对象与 `JMS ObjectMessage` 之间的转换。如果你想修改由 `JmsTemplate` 的 `convertAndSend`\
  \ 方法创建的 JMS Message，可以使用 `MessagePostProcessor` 的实现来实现修改。\n\n下面的示例列表展示了使用 `MessagePostProcessor`\
  \ 实现来修改由 `JmsTemplate` `convertAndSend` 方法创建的 JMS 消息的场景：\n\n**示例 8-9** – `JmsTemplate`\
  \ 的 `convertAndSend` 方法用法\n\n```\njmsTemplate.convertAndSend(\"aDestination\", \"\
  Hello, World !!\",\n    new MessagePostProcessor() {\n        public Message postProcessMessage(Message\
  \ message) throws JMSException {\n            message.setBooleanProperty(\"printOnConsole\"\
  , true);\n            return message;\n        }\n    });\n```\n\n在上面的示例列表中，字符串\
  \ 'Hello, World !!' 被传递给 `convertAndSend` 方法。该 `convertAndSend` 方法会创建一个 `JMS TextMessage`\
  \ 实例，并让 `MessagePostProcessor` 实现能够在消息发送之前对消息进行任何后处理。在上面的示例列表中，`MessagePostProcessor`\
  \ 的 `postProcessMessage` 方法在消息发送到 aDestination 之前在 JMS 消息上设置了 `printOnConsole` 属性。\n\
  \n到为止，我们已经看到了如何使用 `JmsTemplate` 向 JMS 目标发送 JMS 消息。现在让我们来看看如何使用 `JmsTemplate` 和 Spring\
  \ 的消息监听容器从 JMS 目标接收 JMS 消息。\n\n## 8-4 接收 JMS 消息\n\n你可以使用 `JmsTemplate` 同步地接收 JMS\
  \ 消息，并使用 Spring 的消息监听容器 异步地接收 JMS 消息。\n\n### 使用 JmsTemplate 同步接收 JMS 消息\n\n`JmsTemplate`\
  \ 定义了多个 `receive` 方法，你可以使用这些方法*同步地*接收 JMS 消息。需要注意的是，调用 `JmsTemplate` 的 `receive`\
  \ 方法会导致调用线程阻塞，直到从 JMS 目标获取 JMS 消息。为了确保调用线程不会无限阻塞，必须为 `JmsTemplate` 的 `receiveTimeout`\
  \ 属性指定一个适当的值。`receiveTimeout` 属性指定了调用线程在放弃之前应该等待的时间（毫秒）。\n\n`JmsTemplate` 还定义了多个\
  \ `receiveAndConvert` 方法，它们会自动将接收到的 JMS 消息转换为 Java 对象。默认情况下，`JmsTemplate` 使用 `SimpleMessageConverter`\
  \ 执行转换。\n\n### 使用消息监听容器异步接收 JMS 消息\n\n你可以使用 Spring 的消息监听容器*异步地*接收 JMS 消息。消息监听容器会处理事务和资源管理方面，这样你就可以专注于编写消息处理逻辑。\n\
  \n消息监听容器从 JMS 目标接收消息并将其分发给 `JMS MessageListener` 实现进行处理。下面的示例列表展示了如何使用 Spring jms\
  \ schema 中的 `<listener-container>` 元素配置消息监听容器：\n\n**示例 8-10** – applicationContext.xml\
  \ – 消息监听容器配置\n\n**Project** – ch08-bankapp\n\n**Source location** - src/main/resources/META-INF/spring\n\
  \n```xml\n<beans ..... xmlns:jms=\"http://www.springframework.org/schema/jms\"\n\
  \    xsi:schemaLocation=\".....\n        http://www.springframework.org/schema/jms\n\
  \        http://www.springframework.org/schema/jms/spring-jms-4.0.xsd\">\n    .....\n\
  \    <jms:listener-container connection-factory=\"cachingConnectionFactory\"\n \
  \       destination-type=\"queue\" transaction-manager=\"jmsTxManager\">\n     \
  \   <jms:listener destination=\"aQueueDestination\" ref=\"FixedDepositMessageListener\"\
  \ />\n        <jms:listener destination=\"emailQueueDestination\" ref=\"emailMessageListener\"\
  \ />\n    </jms:listener-container>\n    <bean class=\"sample.spring.chapter08.bankapp.jms.EmailMessageListener\"\
  \n        id=\"emailMessageListener\" />\n    <bean class=\"sample.spring.chapter08.bankapp.jms.FixedDepositMessageListener\"\
  \n        id=\"FixedDepositMessageListener\" />\n</beans>\n```\n\n在上面的示例列表中，包含了\
  \ Spring 的 jms schema，以便其元素可用。`<listener-container>` 元素为每个 `MessageListener` 实现配置一个消息监听容器。`connection-factory`\
  \ 属性指定了消息监听容器所使用的 `ConnectionFactory` bean 的引用，该 bean 用于获取连接到 JMS 提供者的连接。`destination-type`\
  \ 属性指定了消息监听容器关联的 JMS 目标类型。`destination-type` 属性接受可能值为 `queue` 和 `topic`。\n\n`<listener-container>`\
  \ 的 `transaction-manager` 属性指定了一个 `PlatformTransactionManager` 实现，确保 JMS 消息的接收和\
  \ `MessageListener` 的消息处理发生在事务中。在上面的示例列表中，`transaction-manager` 的值引用 `JmsTransactionManager`\
  \ 实现。如果 `MessageListener` 实现与其他事务资源交互，请考虑使用 Spring 的 `JtaTransactionManager`。在独立应用程序中，你可以使用嵌入式事务管理器（如\
  \ Atomikos (http://www.atomikos.com/)）来执行 JTA。\n\n**注意** 默认情况下，`<listener-container>`\
  \ 元素为由 `<listener>` 子元素指定的每个 `MessageListener` 实现创建一个 Spring `DefaultMessageListenerContainer`\
  \ 类的实例。\n\n每个 `<listener>` 元素都指定了一个 `MessageListener` 实现，该实现由消息监听容器*异步地*调用。`<listener>`\
  \ 元素的 `destination` 属性指定了 `MessageListener` 通过消息监听容器接收消息的 JMS 目标名称。`<listener>`\
  \ 元素的 `ref` 属性指定了负责处理从目标接收的 JMS 消息的 `MessageListener` 实现引用。示例 8-10 显示，`FixedDepositMessageListener`（一个\
  \ `MessageListener` 实现）负责处理从 `aQueueDestination` 目标接收的消息，而 `EmailMessageListener`（一个\
  \ `MessageListener` 实现）负责处理从 `emailQueueDestination` 目标接收的消息。\n\n`MessageListener`\
  \ 接口定义了一个 `onMessage` 方法，该方法由消息监听容器*异步地*调用。消息监听容器将从 JMS 目标接收到的 `JMS Message` 传递给\
  \ `onMessage` 方法。`onMessage` 方法负责处理接收到的 JMS 消息。下面的示例列表展示了 MyBank 应用的 `FixedDepositMessageListener`\
  \ 的实现，它负责从 `JMS Message` 中检索 `FixedDepositDetails` 对象，然后将 `FixedDepositDetails`\
  \ 对象中包含的定期存款信息保存到数据库：\n\n**示例 8-11** – `FixedDepositMessageListener` 类 – 处理 JMS\
  \ 消息\n\n**Project** – ch08-bankapp\n\n**Source location** - src/main/java/sample/spring/chapter08/bankapp/jms\n\
  \n```java\npackage sample.spring.chapter08.bankapp.jms;\n\nimport javax.jms.MessageListener;\n\
  \nimport javax.jms.ObjectMessage;\n```\n\n\n\n\n```java\nimport sample.spring.chapter08.bankapp.domain.FixedDepositDetails;\n\
  \n.....\n\npublic class FixedDepositMessageListener implements MessageListener {\n\
  \n    @Autowired\n    @Qualifier(value = \"FixedDepositDao\")\n    private FixedDepositDao\
  \ myFixedDepositDao;\n\n    @Autowired\n    private BankAccountDao bankAccountDao;\n\
  \n    @Transactional\n    public int createFixedDeposit(FixedDepositDetails fixedDepositDetails)\
  \ {\n        bankAccountDao.subtractFromAccount(fixedDepositDetails.getBankAccountId(),\n\
  \            fixedDepositDetails.getFixedDepositAmount());\n        return myFixedDepositDao.createFixedDeposit(fixedDepositDetails);\n\
  \    }\n\n    @Override\n    public void onMessage(Message message) {\n        ObjectMessage\
  \ objectMessage = (ObjectMessage) message;\n        FixedDepositDetails fixedDepositDetails\
  \ = null;\n        try {\n            fixedDepositDetails = (FixedDepositDetails)\
  \ objectMessage.getObject();\n        } catch (JMSException e) {\n            e.printStackTrace();\n\
  \        }\n        if (fixedDepositDetails != null) {\n            createFixedDeposit(fixedDepositDetails);\n\
  \        }\n    }\n}\n```\n\n在上面的示例列表中，`FixedDepositMessageListener` 的 `onMessage`\
  \ 方法从 JMS 消息中获取 `FixedDepositDetails` 对象，并将定期存款详情存入数据库。`FixedDepositMessageListener`\
  \ 的 `createFixedDeposit` 方法负责将定期存款信息存入数据库。由于 `createFixedDeposit` 方法标记了 `@Transactional`\
  \ 注解，它在 `DataSourceTransactionManager` 管理的事务下执行（参考 `ch08-bankapp` 项目的 `applicationContext.xml`\
  \ 文件）。消息监听器容器接收 JMS 消息并在 `JmsTransactionManager` 管理的事务下执行 `FixedDepositMessageListener`\
  \ 的 `onMessage` 方法（参考示例列表 8-10）。\n\n由于 `onMessage` 和 `createFixedDeposit` 方法在不同的事务管理器下执行，如果\
  \ JMS 事务因某种原因失败，数据库更新将*不会*回滚；如果数据库更新因某种原因失败，JMS 消息将*不会*重新投递给 `MessageListener`。如果你希望\
  \ JMS 消息的接收（及处理）与数据库更新属于同一个事务，你应该使用 `JTA` 事务。\n\n在本节中，我们查看了如何使用 Spring 发送和接收 JMS\
  \ 消息。现在，让我们来看看 Spring 如何简化邮件的发送。\n\n## 8-5 发送邮件\n\nSpring 通过在 JavaMail API 之上提供抽象层，简化了应用程序发送邮件的过程。Spring\
  \ 负责资源管理和异常处理方面，这样你就可以专注于编写准备邮件消息所需的逻辑。\n\n要使用 Spring 发送邮件，你首先需要在应用程序上下文 XML 文件中配置\
  \ Spring 的 `JavaMailSenderImpl` 类。`JavaMailSenderImpl` 类充当 JavaMail API 的封装。下面的示例列表显示了如何在\
  \ `MyBank` 中配置 `JavaMailSenderImpl` 类：\n\n### 示例列表 8-12 – `applicationContext.xml`\
  \ – `JavaMailSenderImpl` 类配置\n\n**Project** – `ch08-bankapp`\n\n**源位置** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"mailSender\" class=\"org.springframework.mail.javamail.JavaMailSenderImpl\"\
  >\n    <property name=\"host\" value=\"${email.host}\" />\n    <property name=\"\
  protocol\" value=\"${email.protocol}\" />\n    .....\n    <property name=\"javaMailProperties\"\
  >\n        <props>\n            <prop key=\"mail.smtp.auth\">true</prop>\n     \
  \       <prop key=\"mail.smtp.starttls.enable\">true</prop>\n        </props>\n\
  \    </property>\n</bean>\n```\n\n\n\n到目前为止，我们已经了解如何在应用程序上下文 XML 文件中配置 `JavaMailSenderImpl`\
  \ 和 `SimpleMailMessage` 类。现在让我们来看看如何发送电子邮件消息。\n\n下面的示例列表显示了 MyBank 应用程序的 `EmailMessageListener`\
  \ 类（`JMS MessageListener` 的实现），该类从 `JMS` 消息中获取客户的电子邮件地址，并向客户发送电子邮件告知其已收到定期存款的请求：\n\
  \n**示例列表 8-16** – `EmailMessageListener` 类 – 使用 `MailSender` 发送邮件\n\n**项目** – `ch08-bankapp`\n\
  **源码位置** - `src/main/java/sample/spring/chapter08/bankapp/jms`\n\n```java\npackage\
  \ sample.spring.chapter08.bankapp.jms;\n\nimport org.springframework.mail.MailSender;\n\
  import org.springframework.mail.SimpleMailMessage;\n\n.....\n\npublic class EmailMessageListener\
  \ implements MessageListener {\n\n    @Autowired\n    private transient MailSender\
  \ mailSender;\n\n    @Autowired\n    @Qualifier(\"requestReceivedTemplate\")\n \
  \   private transient SimpleMailMessage simpleMailMessage;\n\n    public void sendEmail()\
  \ {\n        mailSender.send(simpleMailMessage);\n    }\n\n    public void onMessage(Message\
  \ message) {\n        TextMessage textMessage = (TextMessage) message;\n       \
  \ try {\n            simpleMailMessage.setTo(textMessage.getText());\n        }\
  \ catch (Exception e) {\n            e.printStackTrace();\n        }\n        sendEmail();\n\
  \    }\n}\n```\n\n上面的示例列表显示，`MailSender` 的 `send` 方法发送了由 `SimpleMailMessage` 实例表示的电子邮件消息。由于\
  \ `JavaMailSenderImpl` 类实现了 Spring 的 `MailSender` 接口，`JavaMailSenderImpl` 实例（参见示例列表\
  \ 8-12）被自动注入（autow）到 `EmailMessageListener` 实例中。名为 `requestReceivedTemplate` 的 `SimpleMailMessage`\
  \ 实例（参见示例列表 8-14）也被自动注入到 `EmailMessageListener` 实例中。由于 `SimpleMailMessage` 的 `to`\
  \ 属性标识邮件收件者，`onMessage` 方法从 `JMS` 消息中获取客户的电子邮件 ID 并将其设置为 `to` 属性的值。\n\nSpring 的\
  \ `MailSender` 接口表示了一个独立于 JavaMail API 的通用接口，适用于发送简单的电子邮件消息。Spring 的 `JavaMailSender`\
  \ 接口（`MailSender` 的子接口）依赖于 JavaMail API，并定义了发送 MIME 消息的功能。如果你想发送包含内联图片、附件等的电子邮件，则可以使用\
  \ MIME 消息。MIME 消息在 JavaMail API 中由 `MimeMessage` 类表示。Spring 提供了 `MimeMessageHelper`\
  \ 类和 `MimeMessagePreparator` 回调接口，可以使用它们来创建并填充 `MimeMessage` 实例。\n\n下面的示例列表显示了 MyBank\
  \ 应用程序的 `FixedDepositProcessorJob` 类，该类从客户的银行账户中扣除定期存款金额，并向客户发送电子邮件告知其定期存款的请求已处理：\n\
  \n**示例列表 8-17** – `FixedDepositProcessorJob` 类 – `JavaMailSender` 的用法\n\n**项目**\
  \ – `ch08-bankapp`\n**源码位置** - `src/main/java/sample/spring/chapter08/bankapp/job`\n\
  \n```java\npackage sample.spring.chapter08.bankapp.job;\n\nimport javax.mail.internet.MimeMessage;\n\
  import org.springframework.mail.javamail.JavaMailSender;\n\npublic class FixedDepositProcessorJob\
  \ {\n    .....\n\n    @Autowired\n    private transient JavaMailSender mailSender;\n\
  \n    @Autowired\n    @Qualifier(\"requestProcessedTemplate\")\n    private transient\
  \ SimpleMailMessage simpleMailMessage;\n\n    private List<FixedDepositDetails>\
  \ getInactiveFixedDeposits() {\n        return myFixedDepositDao.getInactiveFixedDeposits();\n\
  \    }\n\n    public void sendEmail() throws AddressException, MessagingException\
  \ {\n        List<FixedDepositDetails> inactiveFixedDeposits = getInactiveFixedDeposits();\n\
  \        for (FixedDepositDetails fixedDeposit : inactiveFixedDeposits) {\n    \
  \        MimeMessage mimeMessage = mailSender.createMimeMessage();\n           \
  \ MimeMessageHelper mimeMessageHelper = new MimeMessageHelper(mimeMessage);\n  \
  \          mimeMessageHelper.setTo(fixedDeposit.getEmail());\n            mimeMessageHelper.setSubject(simpleMailMessage.getSubject());\n\
  \            mimeMessageHelper.setText(simpleMailMessage.getText());\n         \
  \   mailSender.send(mimeMessage);\n        }\n        myFixedDepositDao.setFixedDepositsAsActive(inactiveDeposits);\n\
  \    }\n}\n```\n\n上面的示例列表显示，`JavaMailSender` 的 `send` 方法被用于发送 MIME 消息。由于 `JavaMailSenderImpl`\
  \ 实现 Spring 的 `JavaMailSender` 接口，`JavaMailSenderImpl` 实例（参见示例列表 8-12）被自动注入到 `FixedDepositProcessorJob`\
  \ 实例中。名为 `requestProcessedTemplate` 的 `SimpleMailMessage` 实例（参见示例列表 8-14）也被自动注入到\
  \ `FixedDepositProcessorJob` 实例中。变量 `mailSender` 定义为 `JavaMailSender` 类型而不是 `MailSender`），因为\
  \ `FixedDepositProcessorJob` 创建并发送 MIME 消息。`FixedDepositProcessorJob` 的 `sendEmail`\
  \ 方法使用 `JavaMailSender` 的 `createMimeMessage` 方法创建 `MimeMessage` 实例。然后使用 Spring\
  \ 的 `MimeMessageHelper` 来填充 `MimeMessage` 实例。\n\n下面的示例列表显示了如何使用 `MimeMessagePreparator`\
  \ 接口代替 `MimeMessageHelper` 来编写 `FixedDepositProcessorJob` 的 `sendEmail` 方法，以填充 `to`、`subject`\
  \ 和 `text` 属性：\n\n**示例列表 8-18** – `MimeMessagePreparator` 的用法\n\n```java\nimport\
  \ javax.mail.Message;\nimport javax.mail.internet.InternetAddress;\nimport org.springframework.mail.javamail.MimeMessagePreparator;\n\
  \n// ... (省略部分代码)\n\n    public void sendEmail() throws AddressException, MessagingException\
  \ {\n        List<FixedDepositDetails> inactiveFixedDeposits = getInactiveFixedDeposits();\n\
  \        for (FixedDepositDetails fixedDeposit : inactiveFixedDeposits) {\n    \
  \        mailSender.send(new MimeMessagePreparator() {\n                @Override\n\
  \                public void prepare(MimeMessage mimeMessage) throws Exception {\n\
  \                    mimeMessage.setRecipient(Message.RecipientType.TO, new InternetAddress(fixedDeposit.getEmail()));\n\
  \                    mimeMessage.setSubject(simpleMailMessage.getSubject());\n \
  \                   mimeMessage.setText(simpleMailMessage.getText());\n        \
  \        }\n            });\n        }\n        myFixedDepositDao.setFixedDepositsAsActive(inactiveDeposits);\n\
  \    }\n}\n```\n\n上面的示例显示，`MimeMessagePreparator` 实例被传递给 `JavaMailSender` 的 `send`\
  \ 方法以准备要发送的 `MimeMessage`。`MimeMessagePreparator` 的 `prepare` 方法提供了一个你需要填充的 `MimeMessage`\
  \ 新实例。在上面的示例列表中，注意设置 `MimeMessage` 的 `recipient` 属性需要处理底层的 JavaMail API。在示例列表 8-17\
  \ 中，`MimeMessageHelper` 的 `setTo` 方法接受接收者的电子邮件 ID 作为字符串参数来设置 `MimeMessage` 的 `recipient`\
  \ 属性。因此，你应该考虑使用 `MimeMessageHelper` 来填充传递给 `prepare` 方法的 `MimeMessage`。\n\n现在让我们来看看如何使用\
  \ Spring 异步执行任务并在未来调度任务执行。\n\n## 8-6 任务调度和异步执行\n\n你可以使用 Spring 的 `TaskExecutor`\
  \ 异步执行 `java.lang.Runnable` 任务，并使用 Spring 的 `TaskScheduler` 调度 `java.lang.Runnable`\
  \ 任务的执行。与其直接使用 `TaskExecutor` 和 `TaskScheduler`，不如使用 Spring 的 `@Async` 和 `@Scheduled`\
  \ 注解来分别异步执行方法和调度方法的执行。\n\n让我们先看看 `TaskExecutor` 和 `TaskScheduler` 接口。\n\n### TaskExecutor\
  \ 接口\n\n\n\nJava 5 引入了用于执行 `java.lang.Runnable` 任务的 `executors` 概念。`executor` 实现了\
  \ `java.util.concurrent.Executor` 接口，该接口定义了一个方法 `execute(Runnable runnable)`。Spring\
  \ 的 `TaskExecutor` 扩展了 `java.util.concurrent.Executor` 接口。Spring 还提供了几个 `TaskExecutor`\
  \ 实现供根据应用程序需求选择。取决于你选择的 `TaskExecutor` 实现，`Runnable` 任务可能会同步或异步执行，并使用线程池或 CommonJ\
  \ 等。Spring 提供的某些 `TaskExecutor` 实现包括：`ThreadPoolTaskExecutor`（使用线程池中的线程异步执行任务）、`SyncTaskExecutor`（同步执行任务）和\
  \ `SimpleAsyncTaskExecutor`（在新的线程中异步执行每个任务）。\n\n`ThreadPoolTaskExecutor` 是最常用的 `TaskExecutor`\
  \ 实现，它使用 Java 5 的 `ThreadPoolExecutor` 来执行任务。接下来的示例列表显示了如何在应用程序上下文 XML 文件中配置 `ThreadPoolTaskExecutor`\
  \ 实例：\n\n**示例列表 8-19** –`ThreadPoolTaskExecutor` 配置\n\n```xml\n<bean id=\"myTaskExecutor\"\
  \n        class=\"org.springframework.scheduling.concurrent.ThreadPoolTaskExecutor\"\
  >\n    <property name=\"corePoolSize\" value=\"5\" />\n    <property name=\"maxPoolSize\"\
  \ value=\"10\" />\n    <property name=\"queueCapacity\" value=\"15\" />\n    <property\
  \ name=\"rejectedExecutionHandler\" ref=\"abortPolicy\"/>\n</bean>\n<bean id=\"\
  abortPolicy\" class=\"java.util.concurrent.ThreadPoolExecutor.AbortPolicy\"/>\n\
  ```\n\n`corePoolSize` 属性指定线程池中的最小线程数。`maxPoolSize` 属性指定线程池可以容纳的最大线程数。`queueCapacity`\
  \ 属性指定当线程池中的所有线程都在忙执行任务时，在队列中等待的最大任务数。`rejectedExecutionHandler` 属性指定被 `ThreadPoolTaskExecutor`\
  \ 拒绝的任务的处理器。如果队列满且线程池中没有可用线程执行已提交的任务，则任务会被 `ThreadPoolTaskExecutor` 拒绝。`rejectedExecutionHandler`\
  \ 属性引用 `java.util.concurrent.RejectedExecutionHandler` 对象的实例。\n\n在示例列表 8-19 中，`rejectedExecutionHandler`\
  \ 属性引用了 `java.util.concurrent.ThreadPoolExecutor.AbortPolicy` 实例，该实例始终抛出 `RejectedExecutionException`。其他可能的被拒绝任务处理器还有：`java.util.concurrent.ThreadPoolExecutor.CallerRunsPolicy`（被拒绝的任务在调用者线程中执行）、`java.util.concurrent.ThreadPoolExecutor.DiscardOldestPolicy`（处理器丢弃队列中最旧的任务并重试执行被拒绝的任务）以及\
  \ `java.util.concurrent.ThreadPoolExecutor.DiscardPolicy`（处理器直接丢弃被拒绝的任务）。\n\nSpring\
  \ 任务架构中的 `<executor>` 元素简化了 `ThreadPoolTaskExecutor` 实例的配置，如下示例列表所示：\n\n**示例列表 8-20**\
  \ –使用 Spring 任务架构的 `ThreadPoolTaskExecutor` 配置\n\n```xml\n<beans ... xmlns:task=\"\
  http://www.springframework.org/schema/task\"\n        xsi:schemaLocation=\".....http://www.springframework.org/schema/task\n\
  \             http://www.springframework.org/schema/task/spring-task-4.0.xsd\">\n\
  \    <task:executor id=\"myTaskExecutor\" pool-size=\"5-10\"\n                 \
  \ queue-capacity=\"15\" rejection-policy=\"ABORT\"/>\n</beans>\n```\n\n在上述示例列表中，`<executor>`\
  \ 元素配置了一个 `ThreadPoolTaskExecutor` 实例。`pool-size` 属性指定核心池大小和最大池大小。在上述示例列表中，5 是核心池大小，10\
  \ 是最大池大小。`queue-capacity` 属性设置了 `queueCapacity` 属性，`rejection-policy` 属性指定了拒绝任务的处理器。`rejection-policy`\
  \ 属性的可能值为 `ABORT`、`CALLER_RUNS`、`DISCARD_OLDEST` 和 `DISCARD`。\n\n一旦你通过显式定义 Spring\
  \ bean（参考示例列表 8-19）或使用 Spring 任务架构（参考示例列表 8-20）配置了 `ThreadPoolTaskExecutor` 实例，你就可以将\
  \ `ThreadPoolTaskExecutor` 实例注入到想要异步执行 `java.lang.Runnable` 任务的 bean 中，如下示例列表所示：\n\
  \n**示例列表 8-21** –使用 `ThreadPoolTaskExecutor` 执行任务\n\n```java\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.core.task.TaskExecutor;\n\n@Component\npublic class Sample\
  \ {\n\n    @Autowired\n    private TaskExecutor taskExecutor;\n\n    public void\
  \ executeTask(Runnable task) {\n        taskExecutor.execute(task);\n    }\n}\n\
  ```\n\n在上述示例列表中，`ThreadPoolTaskExecutor` 实例被自动注入到 `Sample` 类中，并随后被 `Sample` 用于执行\
  \ `java.lang.Runnable` 任务。`TaskExecutor` 在 `java.lang.Runnable` 任务提交后立即执行它，且任务只执行一次。如果你想调度\
  \ `java.lang.Runnable` 任务的执行，并希望任务定期执行，则应该使用 `TaskScheduler` 实现。\n\n### TaskScheduler\
  \ 接口\n\nSpring 的 `TaskScheduler` 接口提供了调度 `java.lang.Runnable` 任务执行的抽象。Spring 的 `Trigger`\
  \ 接口抽象了 `java.lang.Runnable` 任务执行的时间。你将 `TaskScheduler` 实例与 `Trigger` 实例关联以调度 `java.lang.Runnable`\
  \ 任务的执行。如果你想定期执行任务，应该使用 `PeriodicTrigger`（`Trigger` 的一种实现）。`CronTrigger`（`Trigger`\
  \ 的另一种实现）接受一个指示任务执行时间的 cron 表达式。\n\n`ThreadPoolTaskScheduler` 是常用的 `TaskScheduler`\
  \ 实现之一，它内部使用 Java 5 的 `ScheduledThreadPoolExecutor`（Java 5 `ScheduledExecutorService`\
  \ 接口的实现）来调度任务执行。你可以配置 `ThreadPoolTaskScheduler` 实现并与 `Trigger` 关联以调度任务执行。接下来的示例列表显示了如何配置和使用\
  \ `ThreadPoolTaskScheduler`：\n\n**示例列表 8-22** –`ThreadPoolTaskExecutor` 配置与使用\n\n\
  **ThreadPoolTaskScheduler 配置**\n```xml\n<bean id=\"myScheduler\" class=\"org.springframework.scheduling.concurrent.ThreadPoolTaskExecutor\"\
  >\n    <property name=\"poolSize\" value=\"5\"/>\n</bean>\n```\n\n**ThreadPoolTaskScheduler\
  \ 使用**\n```java\nimport org.springframework.scheduling.TaskScheduler;\nimport org.springframework.scheduling.support.PeriodicTrigger;\n\
  \n@Component\npublic class Sample {\n\n    @Autowired\n    @Qualifier(\"myScheduler\"\
  )\n    private TaskScheduler taskScheduler;\n\n    public void executeTask(Runnable\
  \ task) {\n        taskScheduler.schedule(task, new PeriodicTrigger(5000));\n  \
  \  }\n}\n```\n\n在上述示例列表中，`ThreadPoolTaskScheduler` 的 `poolSize` 属性指定了线程池中的线程数。为了调度任务执行，调用\
  \ `ThreadPoolTaskScheduler` 的 `schedule` 方法并传入 `java.lang.Runnable` 任务和 `Trigger`\
  \ 实例。在上述示例列表中，将 `PeriodicTrigger` 实例传递给 `ThreadPoolTaskScheduler` 的 `schedule` 方法。`PeriodicTrigger`\
  \ 构造参数指定了任务执行之间的时间间隔（毫秒）。\n\n\n\n\n\nSpring 任务架构中的 `<scheduler>` 元素简化了 `ThreadPoolTaskScheduler`\
  \ 实例的配置。由 `<scheduler>` 元素创建的 `ThreadPoolTaskScheduler` 实例可以被 Spring 任务架构中的 `<scheduled-tasks>`\
  \ 元素用于调度 bean 方法。以下示例显示了 MyBank 应用程序如何使用 `<scheduler>` 和 `<scheduled-tasks>` 元素来每\
  \ 5 秒执行一次 `FixedDepositProcessorJob` 的 `sendEmail` 方法：\n\n**示例列表 8-23** –`<scheduler>`\
  \ 和 `<scheduled-tasks>` 元素\n\n**项目** – `ch08-bankapp`\n\n**源码位置** -`src/main/java/sample/spring/chapter08/bankapp/job`\n\
  \n```xml\n<task:scheduler id=\"emailScheduler\" pool-size=\"10\" />\n<task:scheduled-tasks\
  \ scheduler=\"emailScheduler\">\n    <task:scheduled ref=\"FixedDepositProcessorJob\"\
  \ method=\"sendEmail\" fixed-rate=\"5000\" />\n</task:scheduled-tasks>\n<bean id=\"\
  FixedDepositProcessorJob\"\n    class=\"sample.spring.chapter08.bankapp.job.FixedDepositProcessorJob\"\
  \ />\n```\n\n在上述示例列表中，`<scheduler>` 元素配置了一个 `ThreadPoolTaskScheduler` 实例。`<scheduler>`\
  \ 元素的 `id` 属性指定了 Spring 容器中其他 bean 访问该 `ThreadPoolTaskScheduler` 实例时使用的名称。`<scheduled-tasks>`\
  \ 元素的 `scheduler` 属性指定了用于调度 bean 方法执行的 `ThreadPoolTaskScheduler` 实例引用。在上述示例列表中，`<scheduled-tasks>`\
  \ 元素的 `scheduled` 属性引用了由 `<scheduler>` 元素创建的 `ThreadPoolTaskScheduler` 实例。\n\n`<scheduled-tasks>`\
  \ 元素包含一个或多个 `<scheduled>` 元素。`<scheduled>` 元素包含了要执行的方法 方法以及执行的触发器。`ref` 属性指定对 Spring\
  \ bean 的引用，`method` 属性指定 `ref` 引用的 bean 方法，而 `fixed-rate` 属性（基于间隔的触发器）指定了连续执行方法的时间间隔。在示例\
  \ 8-23 中，`<scheduled>` 元素指定 `FixedDepositProcessorJob` 的 `sendEmail` 方法每 5 秒执行一次。\n\
  \n与其使用 `<scheduled>` 元素的 `fixed-rate` 属性，你也可以使用 `fixed-delay`（基于间隔的触发器）或 `cron`（基于\
  \ cron 的触发器）或 `trigger`（对 `Trigger` 实现的引用）属性来指定 bean 方法执行的触发器。\n\n现在让我们 Spring 的\
  \ `@Async` 和 `@Scheduled` 注解。\n\n### @Async 和 @Scheduled 注解\n\n如果你在 bean 方法上使用 Spring\
  \ 的 `@Async` 注解，它将由 Spring 异步执行。如果你在 bean 方法上使用 Spring 的 `@Scheduled` 注解，它将由 Spring\
  \ 调度执行。\n\n`@Async` 和 `@Scheduled` 注解的使用通过 Spring 任务架构中的 `<annotation-driven>` 元素启用，如下所示：\n\
  \n**示例列表 8-24** – 启用 `@Async` 和 `@Scheduled` 注解\n\n```xml\n<task:annotation-driven\
  \ executor=\"anExecutor\" scheduler=\"aScheduler\"/>\n<task:executor id=\"anExecutor\"\
  />\n<task:scheduled-tasks scheduler=\"aScheduler\">\n    <task:scheduled ref=\"\
  sampleJob\" method=\"doSomething\" fixed-rate=\"5000\" />\n</task:scheduled-tasks>\n\
  ```\n\n`<annotation-driven>` 元素的 `executor` 属性指定了 Spring `TaskExecutor`（或 Java 5\
  \ 的 `Executor`）实例引用，用于执行带有 `@Async` 注解的方法。`scheduler` 属性指定了 Spring `TaskScheduler`（或\
  \ Java 5 的 `ScheduledExecutorService`）的引用，用于执行带有 `@Scheduled` 注解的方法。\n\n现在让我们详细查看\
  \ @Async 注解。\n\n#### @Async 注解\n\n以下示例列表突出了在使用 `@Async` 注解时需要了解的一些重要点：\n\n**示例列表\
  \ 8-25**–@Async 注解用法\n\n```java\nimport java.util.concurrent.Future;\nimport org.springframework.scheduling.annotation.Async;\n\
  import org.springframework.scheduling.annotation.AsyncResult;\nimport org.springframework.stereotype.Component;\n\
  \n@Component\npublic class Sample {\n\n    @Async\n    public void doA() { .....\
  \ }\n\n    @Async(value=\"someExecutor\")\n    public void doB(String str) { .....\
  \ }\n\n    @Async\n    public Future<String> doC() {\n        return new AsyncResult<String>(\"\
  Hello\");\n    }\n}\n```\n\n`@Async` 注解的 `value` 属性指定了用于异步执行方法的 Spring `TaskExecutor`（或\
  \ Java 5 的 `Executor`）实例。由于 `doA` 方法上的 `@Async` 注解没有指定使用的执行器，因此使用 Spring 的 `SimpleAsyncTaskExector`\
  \ 来异步执行 `doA` 方法。`doB` 方法上的 `@Async` 注解指定 `value` 属性值为 `someExecutor`，这意味着名为 `someExecutor`（类型为\
  \ `TaskExecutor` 或 Java 5 的 `Executor`）的 bean 被用于异步执行 `doB` 方法。带有 @Async 注解的方法可以返回\
  \ `void`（如 `doA` 和 `doB`），也可以返回 `Future` 实例（如 `doC`）。要返回 `Future` 实例，你需要将想要返回的值封装在\
  \ `AsyncResult` 中。\n\n现在让我们详细查看 @Scheduled 注解。\n\n#### @Scheduled 注解\n\n以下示例列表突出了在使用\
  \ `@Scheduled` 注解时需要了解的重要点：\n\n**示例列表 8-26**–@Scheduled 注解用法\n\n```java\nimport\
  \ org.springframework.scheduling.annotation.Scheduled;\n\n@Component\npublic class\
  \ Sample {\n\n    @Scheduled(cron=\"0 9-17 * * MON-FRI\")\n    public void doA()\
  \ { ..... }\n\n    @Scheduled(fixedRate = 5000)\n    public void doB() { ..... }\n\
  }\n```\n\n带有 `@Scheduled` 注解的方法必须返回 `void`，且不能接受任何参数。你必须指定 `@Scheduled` 的 `cron`、`fixedRate`\
  \ 或 `fixedDelay` 属性。\n\n注意的是，如果 `@Async` 或 `@Scheduled` 注解指定在类的一个或多个方法上，你需要包含 CGLIB\
  \ JAR 包。如果 `@Async` 或 `@Scheduled` 注解仅指定在接口的方法上，则不需要 CGLIB JAR 包。从 Spring 3.2 开始，CGLIB\
  \ 类已封装在 `spring-core` JAR 包中；因此，你不需要显式指定项目依赖 CGLIB JAR 包。\n\n**NOTE** 如果你想在 Spring\
  \ 应用程序中使用 Quartz Scheduler ([`quartz-scheduler.org/`](http://quartz-scheduler.org/))，你可以使用\
  \ Spring 提供的集成类来简化 Quartz Scheduler 的使用。\n\nSpring 通过在 `java.util.concurrent.ConcurrentMap`\
  \ 和 Ehcache 之上提供抽象，简化了缓存的使用。\n\n## 8-7 缓存\n\n如果你想在应用程序中使用缓存，可以考虑使用 Spring 的缓存抽象。Spring\
  \ 缓存抽象使开发者无需直接处理底层缓存实现的 API。从 Spring 3.2 开始，缓存抽象已内置支持 `java.util.concurrent.ConcurrentMap`、`Ehcache`\
  \ 以及实现了 JSR 107 – Java 临时缓存 API（称为 JCACHE）的缓存解决方案。\n\n**NOTE** 如果你正在使用 Spring 缓存抽象不支持的缓存解决方案，你可以选择直接使用该缓存解决方案的\
  \ API，或者创建将 Spring 缓存抽象映射到该解决方案的适配器。\n\n\n\n\nSpring 提供了一个 `CacheManager` 接口，定义了用于管理一组\
  \ `Cache` 实例的方法。`CacheManager` 实例作为底层缓存解决方案提供的缓存管理器的封装。例如，`EhCacheCacheManager`\
  \ 是 Ehcache 的 `net.sf.ehcache.CacheManager` 的封装，`JCacheCacheManager` 是 JSR 107 供应商提供的\
  \ `javax.cache.CacheManager` 实现的封装，依此类推。`Cache` 实例是对底层缓存的封装，它提供了与底层缓存进行交互的方法。例如，`EhCacheCache`（`Cache`\
  \ 的实现类）是 `net.sf.ehcache.Ehcache` 的封装，而 `JCacheCache`（`Cache` 的实现类）是 JSR 107 供应商提供的\
  \ `javax.cache.Cache` 实例的封装。\n\nSpring 还提供了一个 `ConcurrentMapCacheManager`，如果你想使用\
  \ `java.util.concurrent.ConcurrentMap` 作为底层缓存，可以使用它。由 `ConcurrentMapCacheManager`\
  \ 管理的 `Cache` 实例是 `ConcurrentMapCache`。底图总结了 Spring 缓存抽象提供的 `CacheManager` 和 `Cache`\
  \ 接口之间的关系：\n\n**注意** 如果你想将 Spring 的缓存抽象用于目前尚未被 Spring 缓存抽象支持的缓存解决方案，你只需要为该解决方案提供\
  \ `CacheManager` 和 `Cache` 实现即可。\n\n![](img/00033.jpeg)\n\n**图 8-3** `CacheManager`\
  \ 实现作为底层缓存解决方案缓存管理器的封装，而 `Cache` 实现提供了与底层缓存交互的操作。\n\n上面的图显示 `CacheManager` 管理 `Cache`\
  \ 实例。`EhCacheCacheManager` 管理 `EhCacheCache` 实例（底层缓存存储为 Ehcache），`JCacheCacheManager`\
  \ 管理 `JCacheCache` 实例（底层缓存存储为实现 JSR 107 的缓存解决方案），`ConcurrentMapCacheManager` 管理\
  \ `ConcurrentMapCache` 实例（底层缓存存储为 `java.util.concurrent.ConcurrentMap`），依此类推。\n\n\
  图 8-3 显示了一个实现 `CacheManager` 接口的 `SimpleCacheManager` 类。`SimpleCacheManager` 适用于简单的缓存场景和测试目的。例如，如果你想使用\
  \ `java.util.concurrent.ConcurrentMap` 作为底层缓存存储，可以使用 `SimpleCacheManager` 代替 `ConcurrentMapCacheManager`\
  \ 来管理缓存。\n\n现在让我们来看看如何在应用程序上下文 XML 文件中配置 `CacheManager`。\n\n#### 配置 CacheManager\n\
  \n在 MyBank 应用程序中，一组 `java.util.concurrent.ConcurrentMap` 实例作为底层缓存存储；因此，使用 `SimpleCacheManager`\
  \ 来管理缓存。\n\n接下来的示例列表显示了如何在 MyBank 应用程序中配置 `SimpleCacheManager` 实例：\n\n**示例代码列表 8-27**\
  \ – SimpleCacheManager 配置\n\n**项目** – ch08-bankapp\n\n**源码位置**- `src/main/resources/META-INF/spring/`\n\
  \n```xml\n<bean id=\"myCacheManager\" class=\"org.springframework.cache.support.SimpleCacheManager\"\
  >\n    <property name=\"caches\">\n        <set>\n            <bean class=\"org.springframework.cache.concurrent.ConcurrentMapCacheFactoryBean\"\
  >\n                <property name=\"name\" value=\"FixedDepositList\" />\n     \
  \       </bean>\n            <bean class=\"org.springframework.cache.concurrent.ConcurrentMapCacheFactoryBean\"\
  >\n                <property name=\"name\" value=\"FixedDeposit\" />\n         \
  \   </bean>\n        </set>\n    </property>\n</bean>\n```\n\n`SimpleCacheManager`\
  \ 的 `caches` 属性指定了由 `SimpleCacheManager` 实例管理的缓存集合。`ConcurrentMapCacheFactoryBean`\
  \ 是一个 `FactoryBean` 实现，它简化了 `ConcurrentMapCache` 实例的配置——该实例使用 `java.util.concurrent.ConcurrentHashMap`\
  \ 实例（`java.util.concurrent.ConcurrentMap` 接口的实现）作为底层缓存存储 `Cache` 实例。`ConcurrentMapCacheFactoryBean`\
  \ 的 `name` 属性指定了缓存的名称。在上面的示例列表中，`FixedDepositList` 和 `FixedDeposit` 缓存由 `SimpleCacheManager`\
  \ 实例管理。\n\n现在让我们如何在应用程序中使用 Spring 的缓存注解。\n\n#### 缓存注解 - @Cacheable, @CacheEvict\
  \ 和 @CachePut\n\n在为应用程序配置好适当的 `CacheManager` 后，你需要选择如何使用 Spring 的缓存抽象。你可以通过使用缓存注解（如\
  \ `@Cacheable`、`@CacheEvict` 和 `@CachePut`）或使用 Spring 的缓存方案来使用。由于使用 Spring 缓存方案缓存结果会导致应用程序上下文\
  \ XML 文件变得冗长，我们将只关注如何使用缓存注解进行声明式缓存。\n\n要使用缓存注解，你需要配置 Spring 缓存方案中的 `<annotation-driven>`\
  \ 元素，如下所示 Bank 应用程序所示：\n\n**示例代码列表 8-28** – 使用 `<annotation-driven>` 启用缓存注解\n\n\
  **项目** – ch08-bankapp\n\n**源码位置**- `src/main/resources/META-INF/spring/`\n\n```xml\n\
  <beans ..... xmlns:cache=\"http://www.springframework.org/schema/cache\"  \n   \
  \   xsi:schemaLocation=\".....\n      http://www.springframework.org/schema/cache\n\
  \      http://www.springframework.org/schema/cache/spring-cache.xsd\">\n\n    <cache:annotation-driven\
  \ cache-manager=\"myCacheManager\"/>\n\n</beans>\n```\n\n在上面的示例列表中，包含了 Spring 的缓存方案，以便其元素在上下文中可用。`<annotation-driven>`\
  \ 元素的 `cache-manager` 属性指向用于管理缓存的 `CacheManager` bean。如果 `CacheManager` bean 的名为\
  \ `cacheManager`，则不需要指定 `cache-manager` 属性。\n\n现在我们已经启用了缓存注解，让我们来看看不同的缓存注解。\n\n\
  #### @Cacheable\n\n`@Cacheable` 注解位于方法上，表示方法的返回值将被缓存。Spring 默认使用 `DefaultKeyGenerator`\
  \ 类来生成缓存键。`DefaultKeyGenerator` 使用方法签名和参数来计算键。你可以通过提供 Spring `KeyGenerator` 接口的实现并将其指定为\
  \ `<annotation-driven>` 元素的 `key-generator` 属性来使用自定义键生成器。\n\n接下来的示例显示了如何在 MyBank\
  \ 应用程序中使用 `@Cacheable` 缓存 `FixedDepositService` 的 `findDepositsByBankAccount` 方法返回值：\n\
  \n**示例代码列表 8-29** – @Cacheable 注解\n\n**项目** – ch08-bankapp\n\n**源码位置**- `src/main/java/sample/spring/chapter08/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter08.bankapp.service;\n\nimport org.springframework.cache.annotation.Cacheable;\n\
  .....\n\n@Service(value = \"FixedDepositService\")\npublic class FixedDepositServiceImpl\
  \ implements FixedDepositService {\n\n    .....\n    @Cacheable(value = { \"FixedDepositList\"\
  \ })\n    public List<FixedDepositDetails> findDepositsByBankAccount(int bankAccountId)\
  \ {\n        logger.info(\"findDepositsByBankAccount method invoked\");\n      \
  \  return myFixedDepositDao.findDepositsByBankAccount(bankAccountId);\n    }\n}\n\
  ```\n\n`@Cacheable` 注角的 `value` 属性指定了缓存值的缓存区域。在列表 8-27 中，我们为 MyBank 应用程序了名为 `FixedDepositList`\
  \ 的缓存区域。在上面的示例列表中，`@Cacheable` 注解指定 `findDepositsByBankAccount` 方法的返回值存储在 `FixedDepositList`\
  \ 缓存中。注意的是，如果传递给方法的参数值相同，则 `@Cacheable` 注解的方法不会被调用。但如果你对至少一个参数传递了不同的值，则 `@Cacheable`\
  \ 注解的方法将被调用。\n\n\n\n\n如果你想在调用方法时从缓存中移除数据，请在该方法上标记 `@CacheEvict` 注解。在 `MyBank` 应用中，当创建一个新的定期存款时，由由\
  \ `FixedDepositServiceImpl` 的 `findFixedDepositsByBankAccount` 方法缓存的定期存款详情必须从缓存中移除。这确保了下一次调用\
  \ `findFixedDepositsByBankAccount` 方法时，新创建的定期存款也将从数据库获取。以下示例列表显示了 `@CacheEvict`\
  \ 注解的使用：\n\n**示例列表 8-30** – `@CacheEvict` 注解\n\n**项目** – `ch08-bankapp`\n\n**源码位置**-\
  \ `src/main/java/sample/spring/chapter08/bankapp/service`\n\n```java\npackage sample.spring.chapter08.bankapp.service;\n\
  \nimport org.springframework.cache.annotation.CacheEvict;\n\n.....\n\n@Service(value\
  \ = \"FixedDepositService\")\n\npublic class FixedDepositServiceImpl implements\
  \ FixedDepositService {\n\n    .....\n\n    @Transactional(\"jmsTxManager\")\n\n\
  \    @CacheEvict(value = { \"FixedDepositList\" }, allEntries=true, beforeInvocation\
  \ = true)\n\n    public void createFixedDeposit(final FixedDepositDetails fixedDepositDetails)\
  \ throws Exception { ..... }\n\n    .....\n\n}\n```\n\n在上述示例列表中，`createFixedDeposit`\
  \ 方法上的 `@CacheEvict` 注解指示 Spring 从名为 `FixedDepositList` 的缓存区域中移除所有缓存条目。`value` 属性指定了要从中移除缓存项的缓存区域，`allEntries`\
  \ 属性指定了是否移除指定缓存区域中的所有条目。如果你想移除某个特定的缓存项，请使用 `key` 属性指定缓存该项时使用的键。你还可以通过 `condition`\
  \ 属性对项目进行条件条件移除。`condition` 和 `key` 属性支持使用 SpEL 指定值（更多详情请参阅第 6 章第 6-8 节），使得执行复杂的缓存移除成为可能。`beforeInvocation`\
  \ 属性指定缓存移除是在方法执行之前还是之后执行。由于 `beforeInvocation` 属性的值设置为 `true`，因此缓存会在调用 `createFixedDeposit`\
  \ 方法之前被移除。\n\n### @CachePut\n\nSpring 还提供了 `@CachePut` 注解，表示该方法总是被调用的，并且方法返回的值会被放入缓存中。`@CachePut`\
  \ 注解与 `@Cacheable` 注解的不同之处在于，`@Cacheable` 注解在用相同的参数值调用方法时，指示 Spring 跳过方法的调用。\n\n\
  以下示例列表显示了 `MyBank` 应用中 `FixedDepositServiceImpl` 类对 `@CachePut` 注解的使用：\n\n**示例列表\
  \ 8-31** – `@CachePut` 注解\n\n**项目** – `ch08-bankapp`\n\n**源码位置**- `src/main/java/sample/spring/chapter08/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter08.bankapp.service;\n\nimport org.springframework.cache.annotation.CachePut;\n\
  import org.springframework.cache.annotation.Cacheable;\n\n.....\n\n@Service(value\
  \ = \"FixedDepositService\")\n\npublic class FixedDepositServiceImpl implements\
  \ FixedDepositService {\n\n    .....\n\n    @CachePut(value={\"FixedDeposit\"},\
  \ key=\"#FixedDepositId\")\n\n    public FixedDepositDetails getFixedDeposit(int\
  \ FixedDepositId) {\n        logger.info(\"getFixedDeposit method invoked with FixedDepositId\
  \ \" + FixedDepositId);\n        return myFixedDepositDao.getFixedDeposit(FixedDepositId);\n\
  \    }\n\n    @Cacheable(value={\"FixedDeposit\"}, key=\"#FixedDepositId\")\n\n\
  \    public FixedDepositDetails getFixedDepositFromCache(int FixedDepositId) {\n\
  \        logger.info(\"getFixedDepositFromCache method invoked with FixedDepositId\
  \ \" + FixedDepositId);\n        throw new RuntimeException(\"This method throws\
  \ exception because \" + \"FixedDepositDetails object must come from the cache\"\
  );\n    }\n\n    .....\n}\n```\n\n在上述示例列表中，`getFixedDeposit` 方法被标记了 `@CachePut`\
  \ 注解，这意味着 `getFixedDeposit` 方法总是被调用的，并且返回的 `FixedDepositDetails` 对象被存储在名为 `FixedDeposit`\
  \ 的缓存中。`value` 属性指定了存储 `FixedDepositDetails` 对象的缓存名称。`key` 属性指定了将返回的 `FixedDepositDetails`\
  \ 对象存储到缓存中的键。正如你所，`key` 属性利用 SpEL 来指定键。`key` 属性的 `#FixedDepositId` 值引用传递给 `getFixedDeposit`\
  \ 方法的 `FixedDepositId` 参数。总结来说，`getFixedDeposit` 方法返回的 `FixedDepositDetails` 对象存储在名为\
  \ `FixedDeposit` 的缓存中，方法参数 `FixedDepositId` 的值被用作键。\n\n在示例 8-31 中，`FixedDepositServiceImpl`\
  \ 的 `getFixedDepositFromCache` 方法根据 `@Cacheable` 注解指定的 `key` 属性值从缓存中检索 `FixedDepositDetails`\
  \ 对象。注意，`getFixedDepositFromCache` 的体没有任何抛出一个 `RuntimeException`。\n\n让我们看看运行 `MyBank`\
  \ 应用会发生什么。\n\n### 运行 MyBank 应用\n\n`MyBank` 的 `FixedApp` 类定义了 `main` 方法。主方法访问 `FixedDepositService`\
  \ 和 `BankAccount` 实例以演示本章中的不同功能。以下示例列表显示了：\n\n**示例列表 8-32** – `FixedApp` 类\n\n**项目**\
  \ – `ch08-bankapp`\n\n```java\npackage sample.spring.chapter08.bankapp;\n\nimport\
  \ org.springframework.context.ApplicationContext;\nimport org.springframework.context.support.PathXmlApplicationContext;\n\
  \npublic class FixedApp {\n    public static void main(String[] args[]) throws Exception\
  \ {\n        ApplicationContext context = new PathXmlApplicationContext(\"classpath:META-INF/spring/applicationContext.xml\"\
  );\n        BankAccountService bankAccountService = context.getBean(BankAccountService.class);\n\
  \        BankAccountDetails bankAccountDetails = new BankAccountDetails();\n\n \
  \       int bankAccountId = bankAccountService.createBankAccount(bankAccountDetails);\n\
  \        FixedDepositService FixedDepositService = context.getBean(FixedDepositService.class);\n\
  \        FixedDepositDetails fixedDepositDetails = new FixedDepositDetails();\n\n\
  \        fixedDepositDetails.setEmail(\"someUser@Domain.com\");\n        FixedDepositService.createFixedDeposit(fixedDepositDetails);\n\
  \n        FixedDepositService.findFixedDepositsByBankAccount(bankAccountId);\n \
  \       FixedDepositService.findFixedDepositsByBankAccount(bankAccountId);\n   \
  \     FixedDepositService.createFixedDeposit(fixedDepositDetails);\n\n        List<FixedDepositDetails>\
  \ FixedDepositDetailsList = FixedDepositService.findFixedDepositsByBankAccount(bankAccountId);\n\
  \n        for (FixedDepositDetails detail : FixedDepositDetailsList) {\n       \
  \     FixedDepositService.getFixedDeposit(detail.getFixedDepositId());\n       \
  \ }\n\n        for (FixedDepositDetails detail : FixedDepositDetailsList) {\n  \
  \          FixedDepositService.getFixedDepositFromCache(detail.getFixedDepositId());\n\
  \        }\n    }\n}\n```\n\n在上述示例列表中，主方法执行了以下系列操作：\n\n**步骤 1.** 首先，通过调用 `BankAccountService`\
  \ 的 `createBankAccount` 方法在 `BANK_ACCOUNT_DETAILS` 表中创建一个银行账户。\n\n\n\n\n\n### 第\
  \ 2 步\n对应新创建银行账户，通过调用 `FixedDepositService` 的 `createFixedDeposit` 方法，在 `FIXED_DEPOSIT_DETAILS`\
  \ 表中创建了一笔定期存款。你应该确保 `FixedDepositDetails` 对象的 `email` 属性被设置为可以检查邮件的邮箱 ID。`createFixedDeposit`\
  \ 方法会发送 2 条 JMS 消息（请参见示例列表 8-5）。其中一条 JMS 消息包含由 `FixedDepositDetails` 对象 `email`\
  \ 属性指定的邮箱 ID，并由 `EmailMessageListener`（参见示例列表 8-16）处理，从而向客户发送电子邮件。另一条 JMS 消息由 `FixedDepositMessageListener`（参见示例列表\
  \ 8-11）处理，将定期存款详情保存到 `FIXED_DEPOSIT_DETAILS` 表中。你还应该注意，`FixedDepositServiceImpl`\
  \ 的 `createFixedDeposit` 方法被标记了 `@CacheEvict` 注解（参见示例列表 8-30），这将移除 `FixedDepositList`\
  \ 缓存中缓存的所有项。\n\n### 第 3 步\n调用 `FixedDepositService` 的 `findFixedDepositsByBankAccount`\
  \ 方法，检索与我们在第 1 步中创建的银行账户对应的定期存款。由于 `findFixedDepositsByBankAccount` 方法标记了 `@Cacheable`\
  \ 注解（参见示例列表 8-29），`findFixedDepositsByBankAccount` 方法返回的定期存款被存储在名为 `FixedDepositList`\
  \ 的缓存中。列表 8-29 显示 `findFixedDepositsByBankAccount` 方法向控制台了以下消息：“*findFixedDepositsByBankAccount\
  \ method invoked*”。在上面的示例列表中，针对同一个 `bankAccountId` 参数调用了两次 `findFixedDepositsByBankAccount`，但你会注意到控制台上只写入了一次“*findFixedDepositsByBankAccount\
  \ method invoked*”。这是因为第二次调用 `findFixedDepositsByBankAccount` 时是从名为 `FixedDepositList`\
  \ 的缓存中检索定期存款详情，而 `findFixedDepositsByBankAccount` 方法*没有*被执行。\n\n### 第 4 步\n对应第 1\
  \ 步中创建的银行账户，通过调用 `FixedDepositService` 的 `createFixedDeposit` 方法，在 `FIXED_DEPOSIT_DETAILS`\
  \ 表中创建了另一笔定期存款。现在，`FixedDepositServiceImpl` 的 `createFixedDeposit` 方法标记了 `@CacheEvict`\
  \ 注解（参见示例列表 8-30），这将移除 `FixedDepositList` 缓存中缓存的所有项。\n\n### 第 5 步\n再次调用 `FixedDepositService`\
  \ 的 `findFixedDepositsByBankAccount` 方法。这一次 `findFixedDepositsByBankAccount` 被执行了，因为之前对\
  \ `createFixedDeposit` 方法的调用（参见第 4 步）导致 `FixedDepositList` 缓存中的所有项被移除。此时，你会再次看到控制台上写入了“*findFixedDepositsByBankAccount\
  \ method invoked*”消息。由于 `findFixedDepositsByBankAccount` 方法标记了 `@Cacheable` 注解，该方法返回的定期存款被缓存在\
  \ `FixedDepositList` 缓存中。\n\n### 第 6 步\n对于第 5 步中检索到的每笔定期存款，都会调用 `FixedDepositService`\
  \ 的 `getFixedDeposit` 方法（参见示例列表 8-31）。`getFixedDeposit` 方法接受定期存款标识符并从数据库返回定期存款信息。`getFixedDeposit`\
  \ 方法标记了 `@CachePut`，这意味着它*总是*会被调用。由 `getFixedDeposit` 方法返回的定期存款被缓存在 `FixedDeposit`\
  \ 缓存中。\n\n### 第 7 步\n对于第 5 步中检索到的每笔定期存款，都会调用 `FixedDepositService` 的 `getFixedDepositFromCache`\
  \ 方法（参见示例列表 8-31）。`getFixedDepositFromCache` 方法接受定期存款标识符并在执行时抛出 `RuntimeException`。`getFixedDepositFromCache`\
  \ 方法标记了 `@Cacheable`，只有在 `FixedDeposit` 缓存中未找到定期存款时才会执行。由于所有定期存款已经在第 6 步被 `getFixedDeposit`\
  \ 方法缓存，因此 `getFixedDepositFromCache` 方法永远不会执行。\n\n### 第 8 步\n每隔 5 秒，`FixedDepositProcessorJob`（参见示例列表\
  \ 8-17）检查数据库中是否创建了新的定期存款。如果在数据库中发现新的定期存款，`FixedDepositProcessorJob` 将激活该定期存款并向客户发送电子邮件，确认定期存款请求已成功处理。\n\
  \n## 8-9 总结\n在本章中，我们接触了 Spring 的一些常用功能。我们看到 Spring 简化了发送和接收 JMS 消息、发送电子邮件、异步调用 Bean\
  \ 方法、调度 Bean 方法执行以及数据缓存。在下一章中，我们将介绍 Spring 对 AOP（面向切面编程）的支持。\n\n# 第 9 章 - 面向切面编程\n\
  \n## 9-1 引言\n面向切面编程（AOP）是一种编程方法，它将分布在多个类中的职责封装在一个单独的类中，该称为“切面”。这些分布在多个类中的职责被称为“交叉关注点”。日志记录、事务管理、缓存、安全等都是交叉关注点的示例。\n\
  \nSpring 提供了一个 AOP 框架，Spring 内部使用该框架来实现声明式服务，例如事务管理（参见第 7 章）和缓存（参见第 8 章）。与其使用 Spring\
  \ AOP 框架，你可以考虑使用 AspectJ ([http://www.eclipse.org/aspectj/]) 作为你的 AOP 框架。由于 Spring\
  \ AOP 框架对于大多数场景都是足够且与 Spring 容器集成，本章重点关注 Spring AOP 框架。\n\n让我们通过一个 AOP 使用示例开始本章。\n\
  \n## 9-2 简单的 AOP 示例\n假设为了审计目的，我们想要捕获传递给服务层类中方法的参数。记录方法参数详情的简单方法是在每个方法内部编写日志逻辑。但这意味着每个方法都*额外*负责记录参数详情。由于记录方法参数详情的职责分布在多个类中，它代表了一个“交叉关注点”。\n\
  \n使用 AOP 处理交叉关注点，需要遵循以下步骤：\n- 创建一个 Java 类（称为*切面*）\n- 在 Java 类中添加交叉关注点的实现\n- 使用正则表达式指定应用交叉关注点的方法\n\
  \n在 AOP 术语中，切面中实现交叉关注点的方法被称为*建议*（advices）。每个建议都与一个标识其应用方法的*切入点*（pointcut）相关。应用建议的方法被称为*连接点*（join\
  \ points）。\n\n在 Spring AOP 中，你可以选择 AspectJ *注解样式*或 XML *架构样式*来开发切面。在 AspectJ 注解样式中，使用\
  \ `@Aspect`、`@Pointcut`、`@Before` 等 AspectJ 注解来开发切面。在 XML 架构样式中，使用 Spring 的 aop\
  \ 架构元素将 Spring Bean 配置为切面。\n\n让我们通过一个 AOP 示例开始本章。\n\n\n\n\n\n```java\nimport org.aspectj.lang.annotation.Aspect;\n\
  import org.aspectj.lang.annotation.Before;\nimport org.springframework.stereotype.Component;\n\
  \n@Aspect\n@Component\npublic class LoggingAspect {\n    private Logger logger =\
  \ Logger.getLogger(LoggingAspect.class);\n\n    @Before(value = \"execution(* sample.spring.chapter09.bankapp.service.*Service.*(..))\"\
  )\n    public void log(JoinPoint joinPoint) {\n        logger.info(\"Entering \"\
  \n                    + joinPoint.getTarget().getClass().getSimpleName() + \"'s\
  \ \"\n                    + joinPoint.getSignature().getName());\n        Object[]\
  \ args = joinPoint.getArgs();\n        for (int i = 0; i < args.length; i++) {\n\
  \            logger.info(\"args[\" + i + \"] -->\" + args[i]);\n        }\n    }\n\
  }\n```\n\n在示例列表 9-1 中：\n\n* AspectJ 的 `@Aspect` 类型级注解指定 `LoggingAspect` 类是一个 AOP\
  \ *切面*（aspect）。\n* AspectJ 的 `@Before` 方法级注解指定 `log` 方法代表一种*通知*（advice），该通知将在由 `value`\
  \ 属性匹配的方法执行*之前*应用。请参考第 9-5 节以了解你可以创建的不同通知类型。\n* `@Before` 注解的 `value` 属性指定了一个*切入点表达式*（pointcut\
  \ expression），Spring AOP 框架通过它识别应用通知的方法（称为*目标方法*）。在第 9-4 节中，我们将深入研究切入点表达式。现在你可以假设切入点表达式\
  \ `execution(* sample.spring.chapter09.bankapp.service.*Service.*(..))` 指定 `LoggingAspect`\
  \ 的 `log` 方法被应用于 `sample.spring.chapter09.bankapp.service` 包中所有由类（或接口）定义的、且以 `Service`\
  \ 结尾的*所有*公有方法。\n* `log` 方法的 `JoinPoint` 参数表示应用通知的目标方法。`log` 方法使用 `JoinPoint` 实例来获取传递给目标方法的参数信息。在示例列表\
  \ 9-1 中，调用了 `JoinPoint` 的 `getArgs()` 方法来获取传递给目标方法的方法参数。\n\n你需要将切面注册到 Spring 容器中，以便\
  \ Spring AOP 框架感知到该切面。在示例列表 9-1 中，`LoggingAspect` 类使用了 Spring 的 `@Component` 注解，以便其自动注册到\
  \ Spring 容器中。\n\n下面的示例列表显示了 `BankApp` 类，它调用了 MyBank 应用中 `BankAccountServiceImpl`（实现了\
  \ `BankAccountService` 接口）和 `FixedDepositServiceImpl`（实现了 `FixedDepositService`\
  \ 接口）类的方法：\n\n**示例列表 9-2** – `BankApp` 类\n\n**项目** – `ch09-simple-aop`\n\n**源码位置**-\
  \ `src/main/java/sample/spring/chapter09/bankapp`\n\n```java\npackage sample.spring.chapter09.bankapp;\n\
  \n.....\n\npublic class BankApp {\n    public static void main(String args[]) throws\
  \ Exception {\n        ApplicationContext context = new ClassPathXmlApplicationContext(\n\
  \                \"classpath:META-INF/spring/applicationContext.xml\");\n      \
  \  BankAccountService bankAccountService = context.getBean(BankAccountService.class);\n\
  \        BankAccountDetails bankAccountDetails = new BankAccountDetails();\n   \
  \     bankAccountDetails.setBalanceAmount(1000);\n        bankAccountDetails.setLastTransactionTimestamp(new\
  \ Date());\n        bankAccountService.createBankAccount(bankAccountDetails);\n\
  \        FixedDepositService FixedDepositService = context.getBean(FixedDepositService.class);\n\
  \        FixedDepositService.createFixedDeposit(new FixedDepositDetails(1, 1000,\n\
  \                12, \"someemail@somedomain.com\"));\n    }\n}\n```\n\n在上面的示例列表，`BankApp`\
  \ 的 `main` 方法调用了 `BankAccountService` 的 `createBankAccount` 方法和 `FixedDepositService`\
  \ 的 `createFixedDeposit` 方法。如果你执行 `BankApp` 的 `main` 方法，你将在控制台上看到以下输出：\n\n```\n\
  INFO  LoggingAspect - Entering BankAccountServiceImpl's createBankAccount\nINFO\
  \  LoggingAspect - args[0] -->BankAccountDetails@balanceAmount=1000, lastTransactionTimestamp=...)\n\
  INFO  LoggingAspect - Entering FixedDepositServiceImpl's createFixedDeposit\nINFO\
  \  LoggingAspect - args[0] -->FixedDepositDetails@id=1, amount=1000, tenure=12,\
  \ email=someemail@somedomain.com\n```\n（注：上面的输出细节是根据所提供的代码逻辑为了清晰起见而重的）\n\n## 9-3\
  \ Spring AOP 框架\n\nSpring AOP 是*基于代理的*；对于作为通知目标的对象会创建一个*代理对象*（proxy object）。下图显示了\
  \ `LoggingAspect` 如何应用到目标对象上：\n\n![](img/00034.jpeg)\n\n**图 9-1** 代理对象负责拦截对目标对象的调用。\n\
  \n上面的图显示为 `BankAccountService` 和 `FixedDepositService` 都创建了代理。`BankAccountService`\
  \ 的代理拦截对 `BankAccountService.createBankAccount` 方法的调用，而 `FixedDepositService` 的代理拦截了对\
  \ `FixedDepositService.createFixedDeposit` 方法的调用。`BankAccountService` 的代理先执行 `LoggingAspect`\
  \ 的 `log` 方法，后执行 `BankAccountService` 的 `createBankAccount` 方法。同样，`FixedDepositService`\
  \ 的代理先执行 `LoggingAspect` 的 `log` 方法，后执行 `FixedDepositService` 的 `createFixedDeposit`\
  \ 方法。\n\n通知（如 `LoggingAspect` 的 `log` 方法）的执行时机取决于通知的*类型*。在 AspectJ 注解样式中，通知类型由 AspectJ\
  \ 注解指定。例如，AspectJ 的 `@Before` 注解指定通知在目标方法调用*之前*执行，`@After` 注解指定通知在目标方法调用*之后*执行，`@Around`\
  \ 注解指定通知在目标方法执行*之前和之后*都执行，依此类推。由于 `LoggingAspect` 的 `log` 方法使用了 `@Before` 注解，因此\
  \ `log` 方法在目标对象方法之前执行。\n\n### 代理创建\n\n在使用 Spring AOP 时，你可以选择通过 Spring 的 `ProxyFactoryBean`（参考\
  \ `org.springframework.aop.framework` 包）显式创建 AOP 代理，或者让 Spring 自动创建 AOP 代理。这种自动生成代理的方式被称为*自动代理*（autoproxying）。\n\
  \n如果你想使用 AspectJ 注解样式创建切面，你需要通过指定 Spring aop 体系的 `<aspectj-autoproxy>` 元素来启用对 AspectJ\
  \ 注解样式的支持。<aspectj-autoproxy>` 元素还指示 Spring AOP 框架为目标对象自动创建 AOP 代理。\n\n\n\n\n\n\
  # 示例列表 9-3 – `applicationContext.xml` - `<aspectj-autoproxy>` \n\n**项目** – `ch09-simple-aop`\n\
  \n**源码位置** - `/src/main/resources/META-INF/spring`\n\n```xml\n<beans .....\n   \
  \ xmlns:context=\"http://www.springframework.org/schema/context\"\n    xmlns:aop=\"\
  http://www.springframework.org/schema/aop\"\n    xsi:schemaLocation=\".....http://www.springframework.org/schema/aop\n\
  \               http://www.springframework.org/schema/aop/spring-aop-4.0.xsd\">\n\
  \    <context:component-scan base-package=\"sample.spring\" />\n    <aop:aspectj-autoproxy\
  \ proxy-target-class=\"false\" expose-proxy=\"true\"/>\n</beans>\n```\n\n`<aspectj-autoproxy>`\
  \ 元素的 `proxy-target-class` 属性指定了为目标对象创建基于 JavaSE 还是 CGLIB 的代理，而 `expose-proxy` 属性指定了\
  \ AOP 代理本身对目标对象可用。如果 `expose-proxy` 的值设置为 true，目标对象的方法可以通过调用 `AopContext.currentProxy()`\
  \ 静态方法访问 AOP 代理。\n\nSpring AOP 框架会创建一个基于 CGLIB 或 JavaSE 的代理。如果目标对象没有实现任何接口，Spring\
  \ AOP 会创建一个基于 CGLIB 的代理。如果目标对象实现了一个或多个接口，Spring AOP 会创建一个基于 JavaSE 的代理。如果 `<aspectj-autoproxy>`\
  \ 元素的 `proxy-target-class` 属性值设置为 false，它指示 Spring AOP 在目标对象实现一个或多个接口时创建一个基于 JavaSE\
  \ 的代理。如果你将 `proxy-target-class` 属性的值设置为 true，则即使目标对象实现了一个或多个接口，它也会指示 Spring AOP\
  \ 创建基于 CGLIB 的代理。\n\n**注意**：从 Spring 3.2 开始，CGLIB 类被封装在 `spring-core` JAR 文件本身中；因此，你不需要在应用程序中显式地包含\
  \ CGLIB JAR 包，即可允许 Spring AOP 框架为目标对象创建基于 CGLIB 的代理。\n\n现在让我们来看一个场景，在该场景中，你倾向于将\
  \ `<aspectj-autoproxy>` 元素的 `expose-proxy` 属性设置为 true。\n\n**导入** **第 9 章/ch09-aop-proxy**（`ch09-aop-proxy`\
  \ 项目展示了 MyBank 应用，其中目标方法使用 `AopProxy.currentProxy()` 方法来获取 Spring AOP 框架创建的 AOP\
  \ 代理对象。要运行该应用程序，请执行该项目中 `BankApp` 类的主方法）\n\n### expose-proxy 属性\n\n下面的示例列表显示了一个修改后的\
  \ `BankAccountServiceImpl` 类，其中 `createBankAccount` 方法调用 `isDuplicateAccount` 方法检查系统中是否存在相同相同的银行账户：\n\
  \n**示例 9-4 – BankAccountServiceImpl 类**\n\n```java\n@Service(value = \"bankAccountService\"\
  )\npublic class BankAccountServiceImpl implements BankAccountService {\n    @Autowired\n\
  \    private BankAccountDao bankAccountDao;\n\n    @Override\n    public int createBankAccount(BankAccountDetails\
  \ bankAccountDetails) {\n        if(!isDuplicateAccount(bankAccountDetails)) {\n\
  \            return bankAccountDao.createBankAccount(bankAccountDetails);\n    \
  \    } else {\n            throw new BankAccountAlreadyExistsException(\"Bank account\
  \ already exists\");\n        }\n    }\n\n    @Override\n    public boolean isDuplicateAccount(BankAccountDetails\
  \ bankAccountDetails) { ..... }\n}\n```\n\n上面的示例列表显示了 `createBankAccount` 方法调用 `isDuplicateAccount`\
  \ 方法检查系统中是否已存在该账户。\n\n现在问题出现了：当 `createBankAccount` 方法调用 `isDuplicateAccount` 方法时，`LoggingAspect`\
  \ 的 `log` 方法（参见示例 9-1）将会执行吗？尽管 `isDuplicateAccount` 方法匹配了 `LoggingAspect.log` 方法上\
  \ `@Before` 注解指定的切点表达式（参见示例 9-1），但 `LoggingAspect` 的 `log` 方法*没有*被调用。这是因为目标对象对自身调用的方法*不会*被\
  \ AOP 代理拦截。由于方法调用没有通过 AOP 代理对象，任何与目标方法相关的建议都*不会*被执行。\n\n为了确保对 `isDuplicateAccount`\
  \ 方法的调用通过 AOP 代理到达目标对象，请在 `createBankAccount` 方法中获取 AOP 代理对象，并在 AOP 代理对象上调用 `isDuplicateAccount`\
  \ 方法。下面的示例列表显示了如何在 `createBankAccount` 方法内部获取 AOP 代理对象：\n\n**示例 9-5 – BankAccountServiceImpl\
  \ 类**\n\n**项目** – `ch09-aop-proxy`\n\n**源码位置** - `/src/main/java/sample/spring/chapter09/bank`\n\
  \n```java\npackage sample.spring.chapter09.bank;\n\nimport org.springframework.aop.AopContext;\n\
  import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\n\
  \n@Service(value = \"bankAccountService\")\npublic class BankAccountServiceImpl\
  \ implements BankAccountService {\n    @Autowired\n    private BankAccountDao bankAccountDao;\n\
  \n    @Override\n    public int createBankAccount(BankAccountDetails bankAccountDetails)\
  \ {\n        // 获取代理并通过它调用 isDuplicateAccount\n        BankAccountService proxy\
  \ = (BankAccountService)AopContext.currentProxy();\n        boolean isDuplicateAccount\
  \ = proxy.isDuplicateAccount(bankAccountDetails);\n        if(!isDuplicateAccount)\
  \ {\n            return bankAccountDao.createBankAccount(bankAccountDetails);\n\
  \        } else {\n            throw new BankAccountAlreadyExistsException(\"Bank\
  \ account already exists\");\n        }\n    }\n\n    @Override\n    public boolean\
  \ isDuplicateAccount(BankAccountDetails bankAccountDetails) { ..... }\n}\n```\n\n\
  在上面的示例列表中，`AopContext.currentProxy()` 的返回值被强制转换为 `BankAccountService` 类型。如果 `<aspectj-autoproxy>`\
  \ 元素的 `expose-proxy` 属性为 false，调用 `currentProxy()` 将导致抛出 `java.lang.IllegalStateException`。`isDuplicateAccount`\
  \ 方法。\n\n现在让我们深入查看切点表达式。\n\n## 9-4 切点表达式\n\n在使用 Spring AOP 时，切点表达式识别要应用建议（advice）的连接点。在\
  \ Spring AOP 中，连接点*总是* Bean 方法。如果你想将建议应用于字段、构造函数、非公共方法以及非 Spring Bean 的对象，你应该使用\
  \ AspectJ 而不是 Spring AOP。\n\n切点表达式使用*切点设计器*，如 `execution`、`args`、`within`、`this`\
  \ 等来寻找匹配的方法。例如，在示例 9-1 中，`@Before` 注解利用了 `execution` 切点设计器来寻找应用到 `LoggingAspect.log`\
  \ 方法的方法。\n\n现在让我们来看看如何使用 `@Cutcut` 注解来指定切点表达式。\n\n`@Cutpoint` 注解的 `value` 属性指定切点表达式。要使用\
  \ `@Cutpoint` 注解，创建一个*空*方法并对其加上 `@Cutpoint` 注解。该空方法*必须*定义为返回 `void`。引用 `@Cutpoint`\
  \ 注解方法名的建议将被应用于由 `@Cutpoint` 注解指定的切点表达式所匹配的方法。\n\n\n\n\n\n**注意** 如果一个切点表达式（pointcut\
  \ expression）被相同或不同切面中的多个建议共享，使用 `@Pointcut` 注解特别有用。\n\n下面的示例显示了 `LoggingAspect`\
  \ 类的修改版本（参考示例列表 9-1），它使用了 `@Pointcut` 注解：\n\n**示例 9-6** – `LoggingAspect` 类\n\n\
  **项目** – `ch09-aop-pointcuts`\n\n**源码位置**- `src/main/java/sample/spring/chapter09/bankapp/aspects`\n\
  \n```java\npackage sample.spring.chapter09.bankapp.aspects;\n\nimport org.aspectj.lang.annotation.Before;\n\
  import org.aspectj.lang.annotation.Pointcut;\n\n@Aspect\n@Component\npublic class\
  \ LoggingAspect {\n\n    @Pointcut(value = \"execution(* sample.spring.chapter09.bankapp.service.*Service.*(..))\"\
  )\n    private void invokeServiceMethods() { }\n\n    @Before(value = \"invokeServiceMethods()\"\
  )\n    public void log(JoinPoint joinPoint) {\n        logger.info(\"Entering \"\
  \ + joinPoint.getTarget().getClass().getSimpleName() + \"'s \"\n               \
  \     + joinPoint.getSignature().getName());\n        .....\n    }\n}\n```\n\n在上面的示例列表中，`invokeServiceMethods`\
  \ 方法标记了 `@Pointcut` 注解，而 `@Before` 注解的 `value` 属性引用了 `invokeServiceMethods` 方法。这意味着\
  \ `log` 方法被应用于匹配 `invokeServiceMethods` 方法上 `@Pointcut` 注解所指定的切点表达式的方法上。\n\n由于 `execution`\
  \ 和 `args` 切点设计符（pointcut designators）最常用于指定切点表达式，让我们详细查看一下 `execution` 和 `args`\
  \ 切点设计符。\n\n### execution 和 args 切点设计符\n\n`execution` 切点设计符具有以下格式：\n\n`execution`(*<access-modifier-pattern>*\
  \ *<return-type-pattern> <declaring-type-pattern>* *<method-name-pattern>*(*<method-param-pattern>*)\
  \ *<throws-pattern>*)`\n\n如果你将一个执行表达式与方法声明进行比较，你会发现执行表达式与方法声明非常相似。\n\n![](img/00035.jpeg)\n\
  \n**图 9-2** 执行表达式的不同部分映射到方法声明的不同部分。\n\n图 9-2 显示了执行表达式的不同部分如何映射到方法声明：Spring AOP 框架通过匹配执行表达式的不同部分与方法声明的不同部分（如上所示），来找到应用建议（advice）的方法。`<declaring-type-pattern>*`\
  \ 未在上面的图中显示，因为只有当你想要引用包含在特定类型或包中的方法时，才会使用 `<declaring-type-pattern>*`。\n\n下表描述了执行表达式的各个不同部分：\n\
  \n| 表达式部分 | 说明 |\n| :--- | :--- |\n| *access-modifier-pattern* | 指定目标方法的访问修饰符。在\
  \ Spring AOP 中，此表达式部分可以指定的值只有 `public`。执行表达式的这部分是*可选的*。 |\n| *return-type-pattern*\
  \ | 指定目标方法返回类型的完全限定名。值 `*` 意味着方法的返回类型并不重要。 |\n| *declaring-type-pattern* | 指定包含目标方法的类型的完全限定名。执行表达式的这部分是*可选的*。值\
  \ `*` 意味着切点表达式会考虑应用程序中的所有类型（类和接口）。 |\n| *method-name-pattern* | 指定方法名模式。例如，值 `save*`\
  \ 意味着以 `save` 开头的方法是建议的目标。 |\n| *method-param-pattern* | 指定方法参数模式。如果值为 `(..)`，则意味着目标方法可以包含任意数量的参数，或者完全不包含参数。\
  \ |\n| *throws-pattern* | 指定目标方法抛出的异常。执行表达式的这部分是*可选的*。 |\n\n`args` 切点设计符指定了目标方法在*运行时*必须接受的参数。例如，如果你想让切点表达式定位到运行时接受\
  \ `java.util.List` 实例的方法，那么 `args` 表达式看起来如下：`args(java.util.List)`。在本节的稍后部分中，我们将看到如何使用\
  \ `args` 切点设计符使传递给目标方法的参数对建议可用。\n\n现在，让我们来看一些使用 `execution` 和 `args` 切点设计符的切点表达式：\n\
  \n**示例 1**\n\n![](img/00036.jpeg)\n\n**图 9-3** 使用方法名模式的执行表达式\n\n上述切点表达式匹配的方法是名称以\
  \ `createFixed` 开头的方法。返回类型指定为 `*`，意味着目标方法可以返回任何类型。`(..)` 指定了目标方法可以接受零或多个参数。\n\n\
  **示例 2**\n\n![](img/00037.jpeg)\n\n**图 9-4** 指定包含目标方法的*类型*（类或接口）的执行表达式\n\n上述切点表达式匹配的方法是由\
  \ `sample` 包中的 `MyService` 类型定义的方法。\n\n**示例 3**\n\n![](img/00038.jpeg)\n\n**图 9-5**\
  \ 为方法指定异常模式的执行表达式\n\n上述切点表达式匹配的方法是 `MyService` 类型中指定了 `throws` 子句的方法。\n\n**示例 4**\n\
  \n![](img/00039.jpeg)\n\n**图 9-6** args 切点设计符指定传递给目标方法的*实例*\n\n在上面的切点表达式中，使用了 `execution`\
  \ 和 `args` 切点设计符的组合。你可以使用 `&&` 和 `||` 运算符组合切点设计符以创建复杂的切点表达式。上述切点表达式匹配的方法是 `MyService`\
  \ 类型中运行时接受 `SomeObject` 实例的方法。上述切点表达式中的 `&&` 指定方法必须匹配 `execution` 和 `args` 切点设计符指定的表达式。\n\
  \n如果你希望建议能够访问传递给目标的一个或多个方法参数，请在 `args` 表达式中指定方法参数，如下：\n\n![](img/00040.jpeg)\n\n\
  **图 9-7** args 切点设计符指定必须对建议可见的方法参数\n\n在上面的切点表达式中，`args` 表达式指定方法必须接受类型为 `SomeObject`\
  \ 的参数，该参数通过 `xyz` 参数对建议可用。让我们来看此功能将参数传递给建议的真实示例。\n\n### 将目标方法的参数传递给建议\n\n下面的示例显示了\
  \ `LoggingAspect` 类的修改版本，其中只有当传递给目标方法的参数是 `FixedDepositDetails` 实例时，才会执行 `log` 方法，并且该\
  \ `FixedDepositDetails` 实例也会对 `log` 方法可用：\n\n**示例 9-7** – `LoggingAspect` 类 – 将目标方法的参数传递给建议\n\
  \n```java\npackage sample.spring.chapter09.bankapp.aspects;\n\nimport org.aspectj.lang.annotation.Before;\n\
  import org.aspectj.lang.annotation.Pointcut;\n\n@Aspect\n@Component\npublic class\
  \ LoggingAspect {\n\n    .....\n\n    @Pointcut(value = \"execution(* sample.spring.chapter09.bankapp.service.*Service.*(..))\n\
  \n              && args(FixedDepositDetails)\")\n    private void invokeServiceMethods(FixedDepositDetails\
  \ FixedDepositDetails) { }\n\n    @Before(value = \"invokeServiceMethods(FixedDepositDetails)\"\
  )\n    public void log(JoinPoint joinPoint, FixedDepositDetails FixedDepositDetails)\
  \ {\n        .....\n    }\n}\n```\n\n\n\n\n\n切点指示符（Pointcut designators），如 `execution`、`args`、`within`、`this`、`target`\
  \ 等由 AspectJ 定义。Spring AOP 定义了特定 Spring AOP 框架的 bean 切点指示符。让我们快速查看一下 bean 切点指示符。\n\
  \n### Bean 切点指示符\n\nbean 切点指示符用于将目标方法限制在指定的 bean id（或名称）。你可以指定确切的 bean id 或名称，也可以指定一个模式。让我们来看\
  \ bean 切点指示符的几个示例：\n\n**示例 1**\n\n![](img/00041.jpeg)\n\n**图 9-8** bean 切点指示符指定了其方法作为通知（advice）目标的\
  \ bean id 或名称。\n\n与上述切点表达式匹配的方法是按名为 `someBean` 的 bean 所定义的方法。\n\n**示例 2**\n\n![](img/00042.jpeg)\n\
  \n**图 9-9** bean 切点指示符指定将通知应用到 id 或名称以 `someBean` 开头的 bean 的方法上。\n\n在上述切点表达式中，bean\
  \ 切点指示符指定将通知应用到 id 或名称以 `someBean` 开头的 bean 的方法上。\n\n**注意** 与任何其他切点指示符一样，你可以使用 `&&`\
  \ 和 `||` 运算符将 bean 切点指示符与其他切点指示符结合，形成复杂的切点表达式。\n\n现在让我们来看看基于注解执行匹配的切点指示符。\n\n###\
  \ 基于注解的切点指示符\n\nAspectJ 还提供了切点指示符，如 `@annotation`、`@target`、`@within` 和 `@args`，你可以结合\
  \ Spring AOP 来查找目标方法。让我们来看几个这些切点指示符使用的示例：\n\n**示例 1**\n\n![](img/00043.jpeg)\n\n\
  **图 9-10** `@annotation` 切点指示符指定将通知应用到标注了 Spring 的 `@Cacheable` 注解的方法上。\n\n与上述切点表达式匹配的方法是标注了\
  \ Spring 的 `@Cacheable` 注解的方法。\n\n**示例 2**\n\n![](img/00044.jpeg)\n\n**图 9-11**\
  \ `@target` 切点指示符指定将通知应用到标注了 Spring 的 `@Component` 注解的对象的方法上。\n\n与上述切点表达式匹配的方法是包含在标注了\
  \ Spring 的 `@Component` 注解的对象中的方法。\n\n在本节中，我们查看了 AspectJ 定义的一些切点指示符。注意的是，并不是所有由\
  \ AspectJ 定义的切点指示符都受 Spring AOP 框架的支持。如果你在切点表达式中使用不支持的切点指示符，Spring AOP 框架将抛出 `java.lang.IllegalArgumentException`。例如，如果你在切点表达式中使用\
  \ `call`、`set` 和 `get` 切点指示符，Spring AOP 将抛出 `java.lang.IllegalArgumentException`。\n\
  \n现在让我们来看看不同的通知类型以及如何创建它们。\n\n## 9-5 通知类型\n\n到本章为止，我们已经看到了 *before*（执行前）通知类型的示例。*before*\
  \ 通知类型是通过在切面类的方法上标注 `@Before` 注解创建的（参见列表 9-1、9-6 和 9-7）。你可以创建的其他通知类型还有 `after`（执行后）、`after\
  \ returning`（返回后）、`after throwing`（抛出异常后）、`after`（最终）和 `around`（环绕）。\n\n**导入** **chapter\
  \ 9/ch09-aop-advices**（`ch09-aop-advices` 项目了使用了不同通知类型的 MyBank 应用程序。运行该应用程序，请执行该项目中\
  \ `BankApp` 类的 main 方法）\n\n现在让我们来看看各种通知类型的显著特征以及如何创建它们。\n\n### Before advice（执行前通知）\n\
  \n*before* 通知在目标方法执行之前执行。如果 *before* 通知没有抛出异常，则目标方法将始终被调用。你可以通过 *around*（环绕）通知（在本节稍后的部分解释）来控制目标方法是否执行。正如前面讨论的，AspectJ\
  \ 的 `@Before` 注解用于指示该通知是一个 *before* 通知。\n\n标注了 `@Before` 的方法可以定义其第一个参数类型为 `JoinPoint`。你可以在通知内部使用\
  \ `JoinPoint` 参数来获取有关目标方法的信息。例如，列表 9-1 显示 `JoinPoint` 实例可以用于获取目标对象的类以及传递给目标方法的参数。\n\
  \n### After returning advice（返回后通知）\n\n*after returning* 通知在目标方法返回后执行。你应该注意的是，如果目标方法抛出异常，则\
  \ *after returning* 通知不会执行。*after returning* 通知使用 AspectJ 的 `@AfterReturning` 注解标注。*after\
  \ returning* 通知可以访问目标方法返回的值，并在返回给调用对象之前对其修改。\n\n`ch09-aop-advices` 项目中的 `SampleAspect`\
  \ 类代表一个 AOP 切面。接下来的示例显示 `SampleAspect` 类定义了一个 *after returning* 通知，它打印了 `BankAccountService`\
  \ 的 `createBankAccount` 方法返回的值：\n\n**列表 9-8** – `SampleAspect` 类 – *after returning*\
  \ 通知\n\n**项目** – `ch09-aop-advices`\n\n**源码位置** -`src/main/java/sample/spring/chapter09/bankapp/aspects`\n\
  \n```java\npackage sample.spring.chapter09.bankapp.aspects;\n\nimport org.aspectj.lang.JoinPoint;\n\
  import org.aspectj.lang.annotation.AfterReturning;\nimport org.aspectj.lang.annotation.Aspect;\n\
  import org.aspectj.lang.annotation.Pointcut;\nimport org.slf4j.Logger;\nimport org.slf4j.LoggerFactory;\n\
  \n@Aspect\npublic class SampleAspect {\n    private Logger logger = LoggerFactory.getLogger(SampleAspect.class);\n\
  \n    @Pointcut(\"execution(* sample.spring.chapter09.bankapp..BankAccountService.createBankAccount(..))\"\
  )\n    public void createBankAccount() {}\n\n    @AfterReturning(value = \"createBankAccount()\"\
  , returning = \"aValue\")\n    public void afterReturning(JoinPoint joinPoint, int\
  \ aValue) {\n        logger.info(\"Value returned by {} is {}\", joinPoint.getSignature().getName(),\
  \ aValue);\n    }\n}\n```\n\n在上面的列表中，afterReturning 方法代表一个 *after returning* 通知。由\
  \ `@Pointcut` 注解定义的切点将连接点限制为 `BankAccountService` 的 `createBankAccount` 方法。`execution`\
  \ 表达式中的 `..` 指定了搜索 `sample.spring` 包及其子包以查找 `BankAccountService` 类型。\n\n在示例 9-8\
  \ 中，`SampleAspect` 的 `afterReturning` 方法在调用 `BankAccountService` 的 `createBankAccount`\
  \ 方法后执行。`@AfterReturning` 注解的 `returning` 属性指定了目标方法的返回值对通知可见的名称。在上面的列表中，`createBankAccount`\
  \ 方法返回的值通过 `aValue` 参数提供 `afterReturning` 方法。`aValue` 参数的类型被指定为 `int`，因为 `createBankAccount`\
  \ 返回一个 int 值。你应该注意，如果你指定了 `returning` 属性，通知仅应用于返回指定类型的方法。如果 *after returning* 通知应用到返回不同值类型（包括\
  \ void）的方法，可以将返回值的参数类型指定为 `Object`。\n\n如示例 9-8 所示，标注了 `@AfterReturning` 的方法可以定义第一个参数类型为\
  \ `JoinPoint` 以访问目标方法信息。\n\n### After throwing advice（抛出异常后通知）\n\n*after throwing*\
  \ 通知在目标方法抛出异常时执行。*after throwing* 通知可以访问目标方法抛出的异常。*after throwing* 通知使用 AspectJ\
  \ 的 `@AfterThrowing` 注解标注。\n\n接下来的示例显示了一个在目标方法抛出异常时执行的 *after throwing* 通知：\n\n\
  **示例 9-9** – `SampleAspect` 类 – *after throwing* 通知\n\n**项目** – `ch09-aop-advices`\n\
  \n**源码位置** -`src/main/java/sample/spring/chapter09/bankapp/aspects`\n\n```java\n\
  package sample.spring.chapter09.bankapp.aspects;\n\nimport org.aspectj.lang.JoinPoint;\n\
  import org.aspectj.lang.annotation.AfterThrowing;\nimport org.aspectj.lang.annotation.Aspect;\n\
  import org.aspectj.lang.annotation.Pointcut;\nimport org.slf4j.Logger;\nimport org.slf4j.LoggerFactory;\n\
  \n@Aspect\npublic class SampleAspect {\n    private Logger logger = LoggerFactory.getLogger(SampleAspect.class);\n\
  \n    @Pointcut(\"execution(* sample.spring.chapter09.bankapp..BankAccountService.createBankAccount(..))\"\
  )\n    public void createBankAccount() {}\n\n    @AfterThrowing(value = \"createBankAccount()\"\
  , throwing = \"ex\")\n    public void afterThrowing(JoinPoint joinPoint, Throwable\
  \ ex) {\n        logger.error(\"Exception thrown by {}: {}\", joinPoint.getSignature().getName(),\
  \ ex.getMessage());\n    }\n}\n```\n\n\n\n\n\n```java\n    private Logger logger\
  \ = Logger.getLogger(SampleAspect.class);\n\n    .....\n\n    @Pointcut(value =\
  \ \"** execution(* sample.spring..FixedDepositService.*(..)) \")\n    private void\
  \ exceptionMethods() {}\n\n    .....\n\n    @AfterThrowing(value = \"exceptionMethods()\"\
  , throwing = \"exception\")\n    public void afterThrowingAdvice(JoinPoint joinPoint,\
  \ Throwable exception) {\n        logger.info(\"Exception thrown by \" + joinPoint.getSignature().getName()\n\
  \                    + \" Exception type is : \" + exception);\n    }\n}\n```\n\n\
  在上面的示例列表中，`SampleAspect` 的 `afterThrowingAdvice` 方法代表了一个*抛出后*（after throwing）通知。当\
  \ `FixedDepositService` 对象的任何方法抛出异常时，`afterThrowingAdvice` 方法会被执行。在上面的示例列表中，`@AfterThrowing`\
  \ 注解的 `throwing` 属性指定了目标方法抛出的异常在供 `afterThrowingAdvice` 方法时使用的名称。由于 `throwing` 属性的值为\
  \ `exception`，该异常将通过名为 `exception` 的参数传递给 `afterThrowingAdvice` 方法。注意，异常参数的类型是 `java.lang.Throwable`，这意味着\
  \ `afterThrowingAdvice` 方法会在目标方法抛出所有异常时被执行。如果你希望 `afterThrowingAdvice` 方法仅在目标方法抛出特定异常类型时执行，请更改异常参数的类型。例如，如果你希望仅在目标方法抛出\
  \ `java.lang.IllegalStateException` 时才执行 `afterThrowingAdvice` 方法，请将 `java.lang.IllegalStateException`\
  \ 指定为异常参数的类型。\n\n如示例列表 9-9 所示，被 `@AfterThrowing` 注解的方法可以将第一个参数定义为 `JoinPoint` 类型，以便访问目标方法的信息。\n\
  \n### 后置通知 (After advice)\n\n*后置*（after）通知在目标方法执行后后执行，无论目标方法是正常完成还是抛出异常。*后置*通知使用\
  \ AspectJ 的 `@After` 注解标记。\n\n接下来的示例列表显示了一个针对 `BankAccountService` 的 `createBankAccount`\
  \ 方法以及 `FixedDepositService` 接口定义的方法执行的*后置*通知：\n\n**示例列表 9-10** – `SampleAspect`\
  \ 类 – *后置*通知\n\n**项目** – `ch09-aop-advices`\n\n**源文件** - `src/main/java/sample/spring/chapter09/bankapp/aspects`\n\
  \n```java\npackage sample.spring.chapter09.bankapp.aspects;\n\nimport org.aspectj.lang.annotation.After;\n\
  \n.....\n\n@Aspect\npublic class SampleAspect {\n\n    private Logger logger = Logger.getLogger(SampleAspect.class);\n\
  \n    @Pointcut(value = \"execution(* sample.spring..BankAccountService.createBankAccount(..))\"\
  )\n    private void createBankAccountMethod() {}\n\n    @Pointcut(value = \"execution(*\
  \ sample.spring..FixedDepositService.*(..))\")\n    private void exceptionMethods()\
  \ {}\n\n    .....\n\n    @After(value = \"exceptionMethods() || createBankAccountMethod()\"\
  )\n    public void afterAdvice(JoinPoint joinPoint) {\n        logger.info(\"After\
  \ advice executed for \" + joinPoint.getSignature().getName());\n    }\n}\n```\n\
  \n在上面的示例列表中，`SampleAspect` 的 `afterAdvice` 方法代表了一个*后置*通知。`afterAdvice` 方法在目标方法执行后执行。注意，`@After`\
  \ 注解的 `value` 属性使用 `||` 运算符将由 `createBankAccountMethod` 和 `exceptionMethods` 方法表示的切点表达式组合成一个新的切点表达式。\n\
  \n如示例列表 9-10 所示，被 `@After` 注解的方法可以将其第一个参数定义为 `JoinPoint` 类型，以便访问目标方法的信息。\n\n###\
  \ 环绕通知 (Around advice)\n\n*环绕*（around）通知在目标方法执行的*之前*和*之后* 都会执行。与其他通知不同，*环绕*通知可以控制是否执行目标方法。*环绕*通知使用\
  \ AspectJ 的 `@Around` 注解标记。\n\n接下来的示例列表显示了由 `ch09-aop-advices` 项目中的 `SampleAspect`\
  \ 类定义的*环绕*通知：\n\n**示例列表 9-11** – `SampleAspect` 类 – *环绕*通知\n\n**项目** – `ch09-aop-advices`\n\
  \n**源文件** - `src/main/java/sample/spring/chapter09/bankapp/aspects`\n\n```java\n\
  package sample.spring.chapter09.bankapp.aspects;\n\nimport org.aspectj.lang.ProceedingJoinPoint;\n\
  import org.aspectj.lang.annotation.Around;\nimport org.springframework.util.StopWatch;\n\
  \n.....\n\n@Aspect\npublic class SampleAspect {\n\n    .....\n\n    @Around(value\
  \ = \"execution(* sample.spring..*Service.*(..))\")\n    public Object aroundAdvice(ProceedingJoinPoint\
  \ pjp) {\n        Object obj = null;\n        StopWatch watch = new StopWatch();\n\
  \        try {\n            obj = pjp.proceed();\n        } catch (Throwable throwable)\
  \ {\n            // 执行你想做的任何操作\n        }\n        watch.stop();\n        logger.info(watch.prettyPrint());\n\
  \        return obj;\n    }\n}\n```\n\n在上面的示例列表中，`aroundAdvice` 方法代表了一个*环绕*通知。`ProceedingJoinPoint`\
  \ 参数用于控制目标方法的调用。需要注意的是，`ProceedingJoinPoint` 必须是通知的参数。\n\n到此为止，我们查看了如何使用 AspectJ\
  \ 注解风格创建通知的示例。现在我们来看看如何使用普通的 Spring Bean 作为 AOP Aspect。\n\n## 9-6 Spring AOP - XML\
  \ 模式风格\n\n在 XML 模式中，普通的 Spring Bean 充当 Aspect。切中的方法通过 Spring 的 aop 配置与通知类型和切点表达式关联。\n\
  \n**导入** `chapter 9/ch09-aop-xml-schema`（`ch09-aop-xml-schema` 项目与 `ch09-aop-advices`\
  \ 项目相同，但 `ch09-aop-xml-schema` 的 `SampleAspect` 类是一个没有使用 AspectJ 注解的简单 Java 类）\n\
  \n下面的示例列表显示了 `ch09-aop-xml-schema` 项目中定义通知的 `SampleAspect` 类：\n\n**示例列表 9-12** –\
  \ `SampleAspect` 类\n\n**项目** – `ch09-aop-xml-schema`\n\n\n\n\n\n### 源文件 - `src/main/java/sample/spring/chapter09/bankapp/aspects`\n\
  \n```java\npackage sample.spring.chapter09.bankapp.aspects;\n\n.....\n\npublic class\
  \ SampleAspect {\n\n    .....\n\n    public void afterReturningAdvice(JoinPoint\
  \ joinPoint, int aValue) {\n        logger.info(\"Value returned by \" + joinPoint.getSignature().getName()+\
  \ \" method is \" + aValue);\n    }\n\n    public void afterThrowingAdvice(JoinPoint\
  \ joinPoint, Throwable exception) {\n        logger.info(\"Exception thrown by \"\
  \ + joinPoint.getSignature().getName()\n                    + \" Exception type\
  \ is : \" + exception);\n    }\n\n    .....\n}\n```\n\n上面的示例列表显示了 `SampleAspect`\
  \ 类定义了代表 AOP 告（advices）的方法。请注意，`SampleAspect` 类*没有*使用 `@Aspect` 注解，且这些方法也没有使用 `@After`、`@AfterReturning`\
  \ 等注解。\n\n现在让我们来看看如何使用 Spring aop 架构中的 `<config>` 元素将一个普通的 Spring Bean 配置为 AOP 切面（aspect）。\n\
  \n### 配置一个 AOP 切面\n\n在 XML 架构风格中，AOP 特定的配置被封装在 Spring aop 架构的 `<config>` 元素中。此外，AOP\
  \ 切面是通过 `<config>` 元素的 `<aspect>` 子元素配置的。\n\n下面的示例列表显示了如何使用 `<config>` 元素的 `<aspect>`\
  \ 子元素配置 `SampleAspect` 类：\n\n**示例列表 9-13** – `applicationContext.xml` – Spring aop\
  \ 架构的使用\n\n**项目** – `ch09-aop-xml-schema`\n\n**源文件位置** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans ..... xmlns:aop=\"http://www.springframework.org/schema/aop\" .....\
  \ >\n    .....\n\n    <bean id=\"sampleAspect\" class=\"sample.spring.chapter09.bankapp.aspects.SampleAspect\"\
  \ />\n    <aop:config proxy-target-class=\"false\" expose-proxy=\"true\">\n    \
  \    <aop:aspect id=\"sampleAspect\" ref=\"sampleAspect\">\n            .....\n\
  \        </aop:aspect>\n    </aop:config>\n</beans>\n```\n\n由于`<config>` 元素依赖于自动代理，`<config>`\
  \ 元素定义了 `proxy-target-class` 和 `expose-proxy` 属性。如果你记得，相同的属性是由 Spring aop 架构中的 `<aspectj-autoproxy>`\
  \ 元素定义的。请参考第 9-3 节了解更多关于 `proxy-target-class` 和 `expose-proxy` 属性的信息。\n\n在示例列表 9-13\
  \ 中，`sampleAspect` Bean 定义将 `SampleAspect` 类为一个 Bean。`<aspect>` 元素将 `sampleAspect`\
  \ Bean 配置为 AOP 切面。`<aspect>` 元素的 `id` 属性为切面指定了唯一标识符，`ref` 属性指定了你想要配置为 AOP 切面的 Spring\
  \ Bean。\n\n现在，我们已经配置了一个 AOP 切面，让我们来看看如何将 AOP 切面中定义的方法映射到不同的告类型和切入点表达式（pointcut expressions）。\n\
  \n### 配置告\n\n你使用 `<aspect>` 元素的以下子元素之一来配置告：`<before>`（用于配置*前置*告类型）、`<after-returning>`（用于配置*返回后*告类型）、`<after-throwing>`（用于配置*抛异常后*告类型）、`<after>`（用于配置*后*告类型）和\
  \ `<around>`（用于配置*环绕*告类型）。\n\n现在来看看 `ch09-aop-xml-schema` 项目中 `SampleAspect` 类中定义的告在应用程序上下文\
  \ XML 文件中是如何配置的。\n\n#### 配置*返回后*告\n\n下图显示了如何使用 `<after-returning>` 元素将 `SampleAspect`\
  \ 的 `afterReturningAdvice` 方法配置为*返回后*告：\n\n![](img/00045.jpeg)\n\n**图 9-12** `SampleAspect`\
  \ 类的 `afterReturningAdvice` 方法使用 Spring aop 架构的 `<after-returning>` 元素配置为*返回后*告。\n\
  \n`<after-returning>` 元素的 `method` 属性指定了你想配置为*返回后*告的方法名称。`returning` 属性的作用与 `@AfterReturning`\
  \ 注解的 `returning` 属性相同；它使目标方法的返回值告可用。`pointcut` 属性指定了用于查找应用告的方法的切入点表达式。\n\n####\
  \ 配置*抛异常后*告\n\n下图显示了如何使用 `<after-throwing>` 元素将 `SampleAspect` 的 `afterThrowingAdvice`\
  \ 方法配置为*抛异常后*告：\n\n![](img/00046.jpeg)\n\n**图 9-13** `SampleAspect` 类的 `afterThrowingAdvice`\
  \ 方法使用 Spring aop 架构的 `<after-throwing>` 元素配置为*抛异常后*告。\n\n`<after-throwing>` 元素的\
  \ `method` 属性指定了你想配置为*返回后*告的方法名称。（等待，原文似乎被截断/重复了）。现在来看看如何将 AOP 切面中定义的方法映射到不同的告类型和切入点表达式。\n\
  \n### 将切入点表达式与告关联\n\nSpring aop 架构的 `<after>`、`<after-returning>`、`<after-throwing>`、`<before>`\
  \ 和 `<around>` 元素定义了你可以使用的切入点表达式。如果你想在不同的告之间共享切入点表达式，可以使用 `<config>` 元素的 `<pointcut>`\
  \ 子元素来定义切入点表达式。\n\n下面的示例列表显示了 `<pointcut>` 元素用于定义切入点表达式：\n\n**示例列表 9-14** – `application\
  \ context XML` - `<pointcut>` 元素\n\n```xml\n<beans ..... xmlns:aop=\"http://www.springframework.org/schema/aop\"\
  \ ..... >\n    .....\n\n    <bean id=\"sampleAspect\" class=\"sample.spring.chapter09.bankapp.aspects.SampleAspect\"\
  \ />\n    <aop:config proxy-target-class=\"false\" expose-proxy=\"true\">\n    \
  \    <aop:pointcut expression=\"execution(* sample.spring..*Service(..))\" id=\"\
  services\" />\n        <aop:aspect id=\"sampleAspect\" ref=\"sampleAspect\">\n \
  \           <aop:after method=\"afterAdvice\" pointcut-ref=\"services\" />\n   \
  \         <aop:around method=\"aroundAdvice\" pointcut-ref=\"services\"/>\n    \
  \    </aop:aspect>\n    </aop:config>\n</beans>\n```\n\n在上面的示例列表中，`<pointcut>` 元素指定了一个切入点表达式。`expression`\
  \ 属性指定切入点表达式，`id` 属性为切入点表达式指定唯一标识符。由 `<pointcut>` 元素定义的切入点表达式通过 `pointcut-ref` 属性被\
  \ `<after>`、`<after-returning>` 等告类型元素引用。例如，在上面的示例列表中，`<after>` 和 `<around>` 元素使用\
  \ `pointcut-ref` 引用 services 切入点表达式。\n\n#### 总结\n\n在本章中，我们查看了 AOP 概念以及如何使用 Spring\
  \ AOP 来解决 Spring 应用程序中的交叉关注点。我们学习了如何使用 AspectJ 注解风格和 XML 架构风格创建切面。我们还讨论了如何创建和配置不同的告类型。我们触及了用于查找应用程序中匹配方法的切入点表达式。有关\
  \ Spring AOP 的更全面介绍，请参考 Spring 参考文档。在下一章中，我们将查看如何使用 Spring Framework 的 Web MVC 模块开发\
  \ Web 应用程序。\n\n\n\n\n\nSpring Framework 的 Spring Web MVC 模块提供了一个 MVC（模型-视图-控制器）框架，你可以用它基于基于\
  \ servlet 的 Web 应用程序。Spring Web MVC 是一个`非侵入式`的框架，它在构成 Web 层的应用程序对象之间提供了清晰的`关注点分离`。例如，`controller`\
  \ 对象用于处理请求，`validator` 对象用于执行验证，而 `command` 对象用于存储表单数据等。需要注意的是，这些应用程序对象中没有一个实现或扩展了任何\
  \ Spring 特有的接口或类。\n\n在本章中，我们首先将查看本章讨论的所有示例 `web` 项目都将遵循的目录结构。然后，我们将查看一个使用 Spring\
  \ Web MVC 开发的简单“Hello World” Web 应用程序。在本章的剩余部分，我们将在我们的 MyBank Web 应用程序环境中介绍一些 Spring\
  \ Web MVC 注解。本章为下一章讨论更高级的 Spring Web MVC 特性奠定了基础。\n\n**IMPORT chapter 10/ch10-helloworld**（此项目展示了一个使用\
  \ Spring Web MVC 的简单“Hello World” Web 应用程序。参考附录 A 学习如何在 Tomcat 服务器上部署示例 Web 项目。一旦部署了该应用程序，访问以下\
  \ URL：`http://localhost:8080/ch10-helloworld/helloworld/sayhello`。如果应用程序部署成功，它将向你显示“Hello\
  \ World !!”消息。）\n\n## 10-2 示例 Web 项目的目录结构\n\n图 10-1 描述了 `ch10-helloworld` 项目的重要目录。你需要记住的一些重要点是：\n\
  \n- `src/main/resources/META-INF/spring` 文件夹包含 `root web application context XML`\
  \ 文件，该文件定义了 Web 应用程序所有 servlet 和过滤器共享的 bean。根 web application context XML 文件通常定义数据源、服务、DAO、事务管理器等。根\
  \ web application context XML 文件由 Spring 的 `ContextLoaderListener`（一个 `javax.servlet.ServletContextListener`\
  \ 的实现）加载。参考第 10-10 节学习如何在 `web.xml` 文件中配置 `ContextLoaderListener`。\n- `src/main/webapp/WEB-INF/spring`\
  \ 文件夹包含 `web application context XML` 文件，该文件定义了构成应用程序 `web` 层部分的 bean。web application\
  \ context XML 文件通常定义 `controllers`（也称为 `handlers`）、`handler mappings`、`view resolvers`、`exception\
  \ resolvers`等。我们将在本章稍后时候学习这些对象。\n- 在根 web application context XML 文件定义的 bean 对 web\
  \ application context XML 文件中定义的 bean 是`可用的`。这意味着，web application context XML 文件中定义的\
  \ bean 可以依赖于根 web application context XML 文件中定义的 bean，但反之不然。\n\n![](img/00047.jpeg)\n\
  \n**图 10-1** `ch10-helloworld` 项目的目录结构\n\n现在让我们查看一下构成 `ch10-helloworld` 项目的配置文件和类。\n\
  \n## 10-3 理解“Hello World” Web 应用程序\n\n如果你在 Eclipse IDE 中右键点击 `ch10-helloworld` 项目并选择\
  \ Build Path **à** Configure Build Path 选项，你会发现项目依赖于 `spring-beans`、`spring-context`、`spring-core`、`spring-expression`、`spring-web`\
  \ 和 `spring-webmvc` JAR 文件。构建基础的 Spring Web MVC 应用程序需要这些 JAR 文件。\n\n下表描述了构成 `ch10-helloworld`\
  \ 项目的配置文件和 Java 源文件。在本节的后面，我们将详细查看这些文件和类。\n\n| 配置文件或 Java 源文件 | 描述 |\n| :--- | :---\
  \ |\n| **HelloWorldController.java** | 负责处理请求的 Spring Web MVC `controller`。你可以在\
  \ `src/main/java` 文件夹下的 `sample.spring.chapter10.web` 包中找到该文件。 |\n| **helloworld.jsp**\
  \ | 显示“Hello World !!”消息的 JSP 文件。你可以在 `src/main/webapp/WEB-INF/jsp` 文件夹中找到该文件 |\n\
  | **myapp-config.xml** | Web application context XML 文件，包含控制器、处理器映射等的 bean 定义。你可以在\
  \ `src/main/webapp/WEB-INF/spring` 文件夹中找到该文件 |\n| **web.xml** | Web 应用程序部署描述符。你可以在\
  \ `src/main/webapp/WEB-INF` 文件夹中找到该文件 |\n\n除了上表所示的文件外，`ch10-helloworld` 项目还包含包含\
  \ Log4j 配置的 `log4j.properties` 文件以及作为 Maven 构建工具输入的 `pom.xml` 文件。要进一步了解这些文件，请参考\
  \ Log4j (`http://logging.apache.org/log4j/1.2/`) 和 Maven (`http://maven.apache.org/index.html`)\
  \ 文档。\n\n现在让我们详细查看上表描述的每个文件。\n\n### HelloWorldController.java – Hello World Web\
  \ 应用程序的控制器类\n\n在 Spring Web MVC 应用中，请求处理逻辑包含在控制器中。下面的示例列表显示了 `ch10-helloworld` 项目的\
  \ `HelloWorldController` 控制器类：\n\n**示例列表 10-1** – `HelloWorldController` 类\n\n**Project**\
  \ – `ch10-helloworld`\n**Source location** - `src/main/java/sample/spring/chapter10/web`\n\
  \n```\npackage sample.spring.chapter10.web;\n\nimport org.springframework.web.servlet.ModelAndView;\n\
  import org.springframework.web.mvc.Controller;\nimport java.util.HashMap;\nimport\
  \ java.util.Map;\n\npublic class HelloWorldController implements Controller {\n\n\
  \    @Override\n    public ModelAndView handleRequest(HttpServletRequest request,\
  \ HttpServletResponse response) throws Exception {\n        Map<String, String>\
  \ modelData = new HashMap<String, String>();\n        modelData.put(\"msg\", \"\
  Hello World !!\");\n        return new ModelAndView(\"helloworld\", modelData);\n\
  \    }\n}\n```\n\n上面的示例列表显示 `HelloWorldController` 实现了 Spring 的 `Controller` 接口。`Controller`\
  \ 接口定义了一个 `handleRequest` 方法，你需要实现它以提供请求处理逻辑。`handleRequest` 方法返回一个包含以下信息的 `ModelAndView`\
  \ 对象：\n\n- 显示给用户的数据（称为 `model` 数据），\n- 显示模型数据的 JSP 页面的逻辑名称（称为 `view`）\n\n模型数据通常表示为\
  \ `java.util.Map` 类型对象，`java.util.Map` 对象中的每个条目都代表一个 `model attribute`（模型属性）。显示给用户的视图（JSP\
  \ 页面）名称指定为 String 值。\n\n示例列表 10-1 显示 `HelloWorldController` 的 `handleRequest` 方法返回一个\
  \ `ModelAndView` 对象，该对象包含 `helloworld`（一个 String 值）作为视图名称以及 `modelData`（一个 `java.util.Map`\
  \ 类型对象）作为模型数据。`modelData` 包含一个 `msg` 模型属性，其值为“Hello World !!”消息。我们很快就会看到 `msg` 模型属性被\
  \ `helloworld` 视图（一个 JSP 页面）用于向用户显示“Hello World !!”消息。下面的图表总结了 `HelloWorldController`\
  \ 的 `handleRequest` 方法如何渲染 JSP 页面：\n\n![](img/00048.jpeg)\n\n**图 10-2** Spring Web\
  \ MVC 框架调用 `HelloWorldController` 的 `handleRequest` 方法并使用返回的 ModelAndView 对象渲染 `helloworld.jsp`\
  \ 页面\n\n\n\n\n上图显示 Spring Web MVC 框架拦截了传入的 HTTP 请求并调用了 `HelloWorldController` 的\
  \ `handleRequest` 方法。`handleRequest` 方法返回一个 `ModelAndView` 对象，该对象包含了模型数据和视图信息。从\
  \ `handleRequest` 方法接收到 `ModelAndView` 对象后，Spring Web MVC 框架将 HTTP 请求调度到 `helloworld.jsp`\
  \ 页面，并将模型属性作为 `request attributes` 提供给 `helloworld.jsp` 页面。\n\n**注意** Spring Web\
  \ MVC 以适用于视图技术（如 JSP 和 Velocity）的格式向视图技术提供模型属性。例如如果你使用 JSP 作为视图技术，模型属性将作为请求属性提供给\
  \ JSP 页面。\n\n### helloworld.jsp – 显示“Hello World !”消息的 JSP 页面\n\n下面的示例列表显示了 `ch10-helloworld`\
  \ 项目中的 `helloworld.jsp` 页面：\n\n**示例列表 10-2** – `helloworld.jsp` JSP 页面\n\n**项目**\
  \ – `ch10-helloworld`\n\n**源码位置**- `src/main/webapp/WEB-INF/jsp`\n\n```\n<%@taglib\
  \ uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n\n<c:out value=\"${msg}\"\
  />\n```\n\n在上面的示例列表中，`<c:out>` 打印了 `msg` 请求属性的值。`msg` 请求属性指的是 `HelloWorldController`\
  \ 的 `handleRequest` 方法返回的 `msg` 模型属性（参见示例列表 10-1）。由于 `msg` 模型属性的值为‘Hello World !!’，`helloworld.jsp`\
  \ JSP 页面显示了‘Hello World !!’消息。\n\n### myapp-config.xml – Web 应用上下文 XML 文件\n\n接下来的示例列表显示了\
  \ `ch10-helloworld` 项目中 `myapp-config.xml` 文件里配置的 豆：\n\n**示例列表 10-3** – `myapp-config.xml`\n\
  \n**项目** – `ch10-helloworld`\n\n**源码位置**- `src/main/webapp/WEB-INF/spring`\n\n```xml\n\
  <beans xmlns=\"http://www.springframework.org/schema/beans\"\n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \n    xsi:schemaLocation=\"http://www.springframework.org/schema/beans\n    http://www.springframework.org/schema/beans/spring-beans.xsd\"\
  >\n    <bean name=\"helloWorldController\"\n            class=\"sample.spring.chapter10.web.HelloWorldController\"\
  \ />\n    <bean id=\"handlerMapping\"\n            class=\"org.springframework.web.servlet.handler.SimpleUrlHandlerMapping\"\
  >\n        <property name=\"urlMap\">\n            <map>\n                <entry\
  \ key=\"/sayhello\" value-ref=\"helloWorldController\" />\n            </map>\n\
  \        </property>\n    </bean>\n    <bean id=\"viewResolver\"\n            class=\"\
  org.springframework.web.servlet.view.InternalResourceViewResolver\">\n        <property\
  \ name=\"prefix\" value=\"/WEB-INF/jsp/\" />\n        <property name=\"suffix\"\
  \ value=\".jsp\" />\n    </bean>\n</beans>\n```\n\n上面的示例列表显示，除了 `HelloWorldController`\
  \ 之外，Spring 的 `SimpleUrlHandlerMapping` 和 `InternalResourceViewResolver` 豆也在 `myapp-config.xml`\
  \ 文件中进行了配置。\n\n`SimpleUrlHandlerMapping` 豆（Spring `HandlerMapping` 接口的实现）将传入的 HTTP\
  \ 请求映射到负责处理请求的控制器。`SimpleUrlHandlerMapping` 豆使用 URL 路径将请求映射到控制器。`urlMap` 属性（类型为\
  \ `java.util.Map`）指定了 URL 路径到控制器豆的映射。在示例列表 10-3 中，`/sayhello` URL 路径（由 `key` 属性指定）映射到\
  \ `HelloWorldController` 豆（由 `value-ref` 属性指定）。你应该注意，由 `key` 属性指定的 URL 路径相对于 Web\
  \ 应用部署描述符中 Spring 的 `DispatcherServlet`（一个 servlet）映射的 URL 路径。`DispatcherServlet`\
  \ 将在本节稍后讨论。\n\n`InternalResourceViewResolver` 豆（Spring `ViewResolver` 接口的实现）根据 `ModelAndView`\
  \ 对象中包含的视图名称定位实际的视图（如 JSP 或 servlet）。通过在视图名称之前添加 `prefix` 属性的值并在之后添加 `suffix` 属性的值来定位实际的视图。示例列表\
  \ 10-3 显示 `prefix` 属性的值为 `/WEB-INF/jsp/`，`suffix` 属性的值为 `.jsp`。由于 `HelloWorldController`\
  \ 的 `handleRequest` 方法返回一个包含 `helloworld` 作为视图名称的 `ModelAndView` 对象，实际的视图是 `/WEB-INF/jsp/helloworld.jsp`（通过在\
  \ `helloworld` 视图名称之前添加 `/WEB-INF/jsp` 之后添加 `.jsp` 得到的字符串）。\n\n### web.xml – Web\
  \ 应用部署描述符\n\n下图显示了 `web.xml` 文件中 `DispatcherServlet` 的配置：\n\n```xml\n<web-app xmlns=\"\
  http://xmlns.jcp.org/xml/ns/javaee\"\n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \n    xsi:schemaLocation=\"http://xmlns.jcp.org/xml/ns/javaee\n    http://xmlns.jcp.org/xml/ns/javaee/web-app_3_0.xsd\"\
  \n    version=\"3.0\">\n    <servlet>\n        <servlet-name>hello</servlet-name>\n\
  \        <servlet-class>org.springframework.web.servlet.DispatcherServlet</servlet-class>\n\
  \        <init-param>\n            <param-name>contextConfigLocation</param-name>\n\
  \            <param-value>/WEB-INF/spring/myapp-config.xml</param-value>\n     \
  \   </init-param>\n        <load-on-startup>1</load-on-startup>\n    </servlet>\n\
  \    <servlet-mapping>\n        <servlet-name>hello</servlet-name>\n        <url-pattern>/helloworld/*</url-pattern>\n\
  \    </servlet-mapping>\n</web-app>\n```\n\n`DispatcherServlet` 关联一个 Web 应用上下文 XML\
  \ 文件，该文件通过 `contextConfigLocation` servlet 初始化参数进行标识。在上面的示例列表中，`contextConfigLocation`\
  \ 参数指向 `myapp-config.xml` 文件（参见示例列表 10-3）。\n\n如果没有指定 `contextConfigLocation` 参数，`DispatcherServlet`\
  \ 会在 Web 应用的 `WEB-INF` 目录下查找名为 `<name-of-DispatcherServlet>-servlet.xml` 的 Web 应用上下文\
  \ XML 文件。在这里，`<name-of-DispatcherServlet>` 的值是配置 `DispatcherServlet` 的 `<servlet>`\
  \ 元素中 `<servlet-name>` 子元素指定的 servlet 名称。例如，如果我们在示例列表 10-3 中没有指定 `contextConfigLocation`\
  \ 参数，`DispatcherServlet` 将查找名为 `hello-servlet.xml` 的文件。\n\n在 Web 应用上下文 XML 文件中定义的\
  \ `HandlerMapping` 和 `ViewResolver` 豆会被 `DispatcherServlet` 用于处理请求。`DispatcherServlet`\
  \ 使用 `HandlerMapping` 实现查找适用于请求的控制器，并使用 `ViewResolver` 实现根据控制器返回的视图名称解析实际的视图。\n\n\
  \n\n\n\n- `DispatcherServlet` 使用 `HandlerMapping` bean（在“Hello World”Web 应用程序中为\
  \ `SimpleUrlHandlerMapping` bean）来找到处理请求的合适控制器。\n- `DispatcherServlet` 调用控制器的请求处理方法（在“Hello\
  \ World”Web 应用程序中为 `HelloWorldController` 的 `handleRequest` 方法）。\n- `DispatcherServlet`\
  \ 将控制器返回的视图名称发送给 `ViewResolver` bean（在“Hello World”Web 应用程序中为 `InternalResourceViewResolver`\
  \ bean），以找到要渲染的实际视图（JSP 或 servlet）。\n- `DispatcherServlet` 将请求派发到实际视图（JSP 或 servlet）。控制器返回的模型数据将作为请求属性供视图使用。\n\
  \n“Hello World”Web 应用程序的 `DispatcherServlet` 被映射到 `/helloworld/*` 模式（参见示例列表 10-4），而\
  \ `SimpleUrlHandlerMapping` 将 `/sayhello` URL 路径映射到 `HelloWorldController` bean（参见示例列表\
  \ 10-3）。如果你访问 URL `http://localhost:8080/ch10-helloworld/helloworld/sayhello`，将导致调用\
  \ `HelloWorldController` 控制器的 `handleRequest` 方法。底图显示了 Spring Web MVC 如何将 URL `http://localhost:8080/ch10-helloworld/helloworld/sayhello`\
  \ 映射到 `HelloWorldController` 控制：\n\n![](img/00051.jpeg)\n\n**图 10-5** URL 路径 `http://localhost:8080/ch10-helloworld/helloworld/sayhello`\
  \ 如何被 Spring Web MVC 映射到 `HelloWorldController`\n\n在上面的图中，URL 的 `/ch10-helloworld`\
  \ 部分代表“Hello World”Web 应用程序的上下文路径，URL 的 `/helloworld` 部分映射到 `DispatcherServlet`\
  \ servlet（参见示例列表 10-4），而 URL 的 `/sayhello` 部分映射到 `HelloWorldController` 控制器（参见示例列表\
  \ 10-3）。\n\n在本节中，我们看到了如何使用 Spring Web MVC 开发一个简单的“Hello World”Web 应用程序。现在，让我们仔细观察在\
  \ Spring Web MVC 应用程序中充当*前置控制器*的 `DispatcherServlet` servlet。\n\n## 10-4 DispatcherServlet\
  \ – 前置控制器\n\n在上一节中，我们看到 `DispatcherServlet` 充当*前置控制器*，通过与 Web 应用程序上下文 XML 文件定义的\
  \ `HandlerMapping` 和 `ViewResolver` bean 交互来处理请求。在本节中，我们将查看 `DispatcherServlet`\
  \ 在后台是如何工作的。\n\n在初始化时，`DispatcherServlet` 会加载相应的 Web 应用程序上下文 XML 文件（这可以通过 `contextConfigLocation`\
  \ 参数指定，或者命名为 `<name-of-DispatcherServlet>-servlet.xml` 并放置在 `WEB-INF` 目录下），创建一个\
  \ Spring `WebApplicationContext` 对象的实例。`WebApplicationContext` 是 `ApplicationContext`\
  \ 接口的子接口，提供了特定于 Web 应用程序的功能。例如，WebApplicationContext 中的某些 bean 可以具有额外的作用域，如 request\
  \ 和 session。你可以将 `WebApplicationContext` 对象认为代表 Spring Web MVC 应用程序中 Spring 容器实例的对象。\n\
  \n下表描述了你可以为 Web 应用程序上下文 XML 文件中配置的 bean 指定的额外作用域：\n\n| Bean 作用域 | 说明 |\n| :--- |\
  \ :--- |\n| **request** | Spring 容器为每个 HTTP 请求创建一个*新的* bean 实例。当 HTTP 请求完成时，Spring\
  \ 容器会销毁该 bean 实例。此作用域仅对适用于 Web 应用程序场景的 `ApplicationContext` 实现有效。例如，如果你正在使用 `XmlWebApplicationContext`\
  \ 或 `AnnotationConfigWebApplicationContext`，才能为 bean 指定 request 作用域。 |\n| **session**\
  \ | 当创建 HTTP Session 时，Spring 容器创建一个新的 bean 实例。当 HTTP Session 销毁时，Spring 容器会销毁该\
  \ bean 实例。此作用域仅对适用于 Web 应用程序场景的 `ApplicationContext` 实现有效。例如，如果你使用 `XmlWebApplicationContext`\
  \ 或 `AnnotationConfigWebApplicationContext`，才能为 bean 指定 session 作用域。 |\n| **global**\
  \ | 如果 Web 应用包含多个模块，可以在 `web.xml` 中为每个模块定义 `DispatcherServlet`。在这种情况下，每个 `DispatcherServlet`\
  \ 都有自己的应用上下文文件（包含控制器、视图解析器等）。请注意，这些 bean *不会*在 `DispatcherServlet` 之间共享。如前所述，`WebApplicationContext`\
  \ 共享的 bean 定义在根应用上下文文件中。 | (注：此处原文逻辑较乱，已对应翻译)\n\n在上一节中，我们看到 `DispatcherServlet`\
  \ 充当*前置控制器*，通过与 Web 应用程序上下文 XML 文件定义的 `HandlerMapping` 和 `ViewResolver` bean 交互来处理请求。在本节中，我们将查看\
  \ `DispatcherServlet` 在后台是如何工作的。\n\n在初始化时，`DispatcherServlet` 会加载相应的 Web 应用程序上下文\
  \ XML 文件（这可以通过 `contextConfigLocation` 参数指定，或者命名为 `<name-of-DispatcherServlet>-servlet.xml`\
  \ 并放置在 `WEB-INF` 目录下），创建一个 Spring `WebApplicationContext` 对象的实例。`WebApplicationContext`\
  \ 是 `ApplicationContext` 接口的子接口，提供了特定于 Web 应用程序的功能。例如，WebApplicationContext 中的某些\
  \ bean 可以具有额外的作用域，如 request 和 session。你可以将 `WebApplicationContext` 对象认为代表 Spring\
  \ Web MVC 应用程序中 Spring 容器实例的对象。\n\n下表描述了你可以为 Web 应用程序上下文 XML 文件中配置的 bean 指定的额外作用域：\n\
  \n| Bean 作用域 | 说明 |\n| :--- | :--- |\n| **request** | Spring 容器为每个 HTTP 请求创建一个*新的*\
  \ bean 实例。当 HTTP 请求完成时，Spring 容器会销毁该 bean 实例。此作用域仅对适用于 Web 应用程序场景的 `ApplicationContext`\
  \ 实现有效。例如，如果你正在使用 `XmlWebApplicationContext` 或 `AnnotationConfigWebApplicationContext`，才能为\
  \ bean 指定 request 作用域。 |\n| **session** | 当创建 HTTP Session 时，Spring 容器创建一个新的 bean\
  \ 实例。当 HTTP Session 销毁时，Spring 容器会销毁该 bean 实例。此作用域仅对适用于 Web 应用程序场景的 `ApplicationContext`\
  \ 实现有效。例如，如果你使用 `XmlWebApplicationContext` 或 `AnnotationConfigWebApplicationContext`，才能为\
  \ bean 指定 session 作用域。 |\n| **global** | 如果 Web 应用包含多个模块，可以在 `web.xml` 中为每个模块定义\
  \ `DispatcherServlet`。在这种情况下，每个 `DispatcherServlet` 都有自己的应用上下文文件（包含控制器、视图解析器等）。请注意，这些\
  \ bean *不会*在 `DispatcherServlet` 之间共享。如前所述，`WebApplicationContext` 共享的 bean 定义在根应用上下文文件中。\
