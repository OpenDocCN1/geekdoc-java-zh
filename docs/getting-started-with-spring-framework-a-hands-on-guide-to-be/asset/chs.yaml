  \ setter 注入将原型作用的 `customerRequestDetails` 注入到 `customerRequestService`，Spring 容器在其生命周期内也只调用一次\
  \ setter 方法。这意味着无论使用 setter 还是构造函数注入，单例 bean 都只创建一次。现在，一旦 Spring 容器创建，任何对单例作用 `customerRequestService`\
  \ bean 的请求都返回相同的实例。\n\n由于单例作用的 `customerRequestService` bean 始终持有对原型作用 `customerRequestDetails`\
  \ bean 的引用，可能会影响 MyBank 应用的行为。例如，如果多个客户同时向 `CustomerRequestServiceImpl` 实例提交请求，所有请求都将导致修改同一个\
  \ `CustomerRequestDetails` 实例。理想情况下，`CustomerRequestServiceImpl` 应该每次请求都创建一个 `CustomerRequestDetails`\
  \ 实例。在第 5 节中，我们将看到对单例作用 bean 类需要进行哪些修改，以便每次调用都能获取原型作用 bean 的新实例。\n\n### 原型作用（Prototype-scoped）bean\
  \ 的依赖\n\n在 MyBank 中，客户通过一系列步骤在 MyBank 应用中注册。例如，客户首先输入个人信息账户详情，如果 MyBank 应用找到了匹配的记录，将要求客户提供借记卡详情。MyBank\
  \ 应用的 `CustomerRegistrationServiceImpl` 类包含了注册客户所需的业务逻辑。当客户按照一系列步骤在 MyBank 应用中注册时，`CustomerRegistrationServiceImpl`\
  \ 对象在方法调用之间维持会话状态。\n\n下面的示例列表显示了 MyBank 应用中原型作用的 `customerRegistrationService` bean（代表\
  \ `CustomerRegistrationServiceImpl` 类）及其依赖项：\n\n**示例列表 4-12** – `applicationContext.xml`\
  \ - `customerRegistrationService` bean 及其依赖项\n\n**项目** – `ch04-bankapp-dependencies`\n\
  \n```xml\n<bean id=\"customerRegistrationService\"\n    class=\"sample.spring.chapter04.bankapp.service.CustomerRegistrationServiceImpl\"\
  \n    scope=\"prototype\">\n```\n\n\n\n\n\n```xml\n<bean class=\"sample.spring.chapter04.bankapp.service.CustomerRegistrationServiceImpl\"\
  \ scope=\"prototype\">\n    <constructor-arg name=\"customerRegistrationDetails\"\
  \ ref=\"customerRegistrationDetails\" />\n    <constructor-arg name=\"customerRegistrationDao\"\
  \ ref=\"customerRegistrationDao\" />\n</bean>\n<bean id=\"customerRegistrationDetails\"\
  \ class=\"sample.spring.chapter04.bankapp.domain.CustomerRegistrationDetails\" scope=\"\
  prototype\" />\n<bean id=\"customerRegistrationDao\" class=\"sample.spring.chapter04.bankapp.dao.CustomerRegistrationDaoImpl\"\
  \ />\n```\n\n上面的示例列表显示，`customerRegistrationService`（原型作用域）bean 依赖于 `customerRegistrationDetails`（原型作用域）bean\
  \ 和 `customerRegistrationDao`（单例作用域）bean。\n\n`CustomerRegistrationServiceImpl` 实例维护并维护了注册过程的进度，并将客户在注册过程中提供的信息存储在\
  \ `CustomerRegistrationDetails` 对象中（由 `customerRegistrationDetails` 实例表示）。由于 `CustomerRegistrationServiceImpl`\
  \ 和 `CustomerRegistrationDetails` 对象在本质上都是有状态的，因此 `customerRegistrationService`\
  \ 和 `customerRegistrationDetails` bean 都被定义为原型作用域 bean。\n\n下面的示例列表显示了 `BankApp`\
  \ 类的主方法，该方法加载了客户注册相关的 bean（参见示例列表 4-12）并为 2 个客户执行了注册：\n\n**示例 4-13** – `BankApp`\
  \ 类\n\n**项目** – `ch04-bankapp-dependencies`\n\n**源码位置 -** `src/main/java/sample/spring/chapter04/bankapp`\n\
  \n```java\npackage sample.spring.chapter04.bankapp;\n\nimport org.springframework.context.ApplicationContext;\n\
  import org.springframework.context.support.ClassPathXmlApplicationContext;\nimport\
  \ java.util.logging.Logger;\n\npublic class BankApp {\n    private static Logger\
  \ logger = Logger.getLogger(BankApp.class);\n\n    public static void main(String\
  \ args[]) throws Exception {\n        ApplicationContext context = new ClassPathXmlApplicationContext(\n\
  \            \"classpath:META-INF/spring/applicationContext.xml\");\n        .....\n\
  \n        logger.info(\"Beginning with accessing CustomerRegistrationService\");\n\
  \        CustomerRegistrationService customerRegistrationService_1 = context\n \
  \           .getBean(CustomerRegistrationService.class);\n        customerRegistrationService_1.setAccountNumber(\"\
  account_1\");\n        customerRegistrationService_1.setAddress(\"address_1\");\n\
  \        customerRegistrationService_1.setDebitCardNumber(\"debitCardNumber_1\"\
  );\n        customerRegistrationService_1.register();\n\n        logger.info(\"\
  registered customer with id account_1\");\n        CustomerRegistrationService customerRegistrationService_2\
  \ = context\n            .getBean(CustomerRegistrationService.class);\n        .....\n\
  \        customerRegistrationService_2.setAccountNumber(\"account_2\");\n      \
  \  customerRegistrationService_2.setAddress(\"address_2\");\n        customerRegistrationService_2.setDebitCardNumber(\"\
  debitCardNumber_2\");\n        customerRegistrationService_2.register();\n\n   \
  \     logger.info(\"registered customer with id account_2\");\n        logger.info(\"\
  Done with accessing CustomerRegistrationService\");\n    }\n}\n```\n\n上面的示例列表显示，`BankApp`\
  \ 主方法调用了两次 `ApplicationContext` 的 `getBean` 方法来获取 `customerRegistrationService`\
  \ bean 的引用。一旦获取了 `customerRegistrationService` bean 实例，就会在其上调用 `setAccountNumber`、`setAddress`、`setDebitCardNumber`\
  \ 和 `register` 方法。如果你执行 `BankApp` 主方法，你将在控制台上看到以下输出：\n\n```\nCreated CustomerRegistrationDaoImpl\
  \ instance\n.....\nBeginning with accessing CustomerRegistrationService\nCreated\
  \ CustomerRegistrationDetails instance\nCreated CustomerRegistrationServiceImpl\
  \ instance\nregistered customer with id account_1\nCreated CustomerRegistrationDetails\
  \ instance\nCreated CustomerRegistrationServiceImpl instance\nregistered customer\
  \ with id account_2\nDone with accessing CustomerRegistrationService\n```\n\n上述输出中的“Created.....”消息是由相应\
  \ bean 类的构造函数打印的。上述输出显示单例作用域的 `customerRegistrationDao` bean（代表 `CustomerRegistrationDaoImpl`\
  \ 类）在 `ApplicationContext` 实例创建时*仅创建一次*。“Beginning.....”和“Done.....”消息之间的“Created.....”消息表示，每调用一次\
  \ `ApplicationContext` 的 `getBean` 方法，都会创建一个新实例。图 4-3 显示了 `ApplicationContext` 实例创建时发生的事件序列。该图显示单例作用域的\
  \ `customerRegistrationDao` bean 在 `ApplicationContext` 实例创建时*仅创建一次*。当从 Spring 容器中请求\
  \ `customerRegistrationService` bean 时，Spring 容器会创建 `customerRegistrationDetails`\
  \ 和 `CustomerRegistrationServiceImpl` 的新实例。\n\n\n\n\n\n`ApplicationContextAware`\
  \ 接口是一个*生命周期接口*（lifecycle interface），这意味着 Spring 容器会在 bean 生命周期周期内的适当时间调用实现 `ApplicationContextAware`\
  \ 接口的 bean。例如，`ApplicationContextAware` 的 `setApplicationContext` 方法会在 bean 实例创建*之后*但完全初始化*之前*由\
  \ Spring 容器调用。只有在 Spring 容器调用了其`初始化方法`（initialization method）（参见第 5 章第 5-2 节）后，bean\
  \ 实例才被认为完全初始化。要注意，在 bean 实例完全初始化后，Spring 容器会将其注入到依赖它的 bean 实例中。在第 5 章中，我们将查看 Spring\
  \ 中更多的生命周期接口。\n\n实现了 `ApplicationContextAware` 接口的 bean 可以通过调用 `ApplicationContext`\
  \ 的 `getBean` 方法来访问注册到 `ApplicationContext` 实例的其他 bean。这意味着，如果单例作用范围（singleton-scoped）bean\
  \ 的类实现了 `ApplicationContextAware` 接口，它就可以通过调用 `ApplicationContext` 的 `getBean` 方法从\
  \ Spring 容器获取原型作用范围（prototype-scoped）bean 的新实例。由于单例作用范围的 bean 通过调用 `ApplicationContext`\
  \ 的 `getBean` 方法显式地从 Spring 容器获取其原型作用范围的依赖，因此你不需要在应用上下文 XML 文件中将原型作用范围 bean 定义为单例\
  \ bean 的依赖。\n\n下面的示例列表显示了 `CustomerRequestServiceImpl` 类，每次调用 `CustomerRequestServiceImpl`\
  \ 的 `submitRequest` 方法时，都需要一个新的 `CustomerRequestDetails` 对象实例：\n\n**示例列表 4-14**\
  \ – `CustomerRequestServiceImpl` 类\n\n**项目** – `ch04-bankapp-context-aware`\n\n\
  **源码位置** - `src/main/java/sample/spring/chapter04/bankapp/service`\n\n```java\n\
  package sample.spring.chapter04.bankapp.service;\n\nimport sample.spring.chapter04.bankapp.dao.CustomerRequestDao;\n\
  import sample.spring.chapter04.bankapp.domain.CustomerRequestDetails;\n\npublic\
  \ class CustomerRequestServiceImpl implements CustomerRequestService {\n\n  private\
  \ CustomerRequestDetails customerRequestDetails;\n\n    private CustomerRequestDao\
  \ customerRequestDao;\n\n    @ConstructorProperties({ \"customerRequestDetails\"\
  , \"customerRequestDao\" })\n    public CustomerRequestServiceImpl(CustomerRequestDetails\
  \ customerRequestDetails,\n         CustomerRequestDao customerRequestDao) {\n \
  \     this.customerRequestDetails = customerRequestDetails;\n      this.customerRequestDao\
  \ = customerRequestDao;\n    }\n\n    public void submitRequest(String requestType,\
  \ String requestDescription) {\n        // -- 填充 CustomerRequestDetails 对象并保存\n\
  \        customerRequestDetails.setType(requestType);\n        customerRequestDetails.setDescription(requestDescription);\n\
  \        customerRequestDao.submitRequest(customerRequestDetails);    \n    }\n\
  }\n```\n\n上面的示例列表显示，`CustomerRequestDetails` 和 `CustomerRequestDao` 对象被作为参数传递给 `CustomerRequestServiceImpl`\
  \ 类的构造函数。`submitRequest` 方法通过调用 `CustomerRequestDao` 的 `submitRequest` 方法填充 `CustomerRequestDetails`\
  \ 实例并保存到数据库中。如果多个客户同时提交请求，`submitRequest` 方法将修改同一个 `CustomerRequestDetails` 对象实例，导致\
  \ MyBank 应用程序出现非预期的行为。为了解决这个问题，`submitRequest`*必须*在每次调用时从 Spring 容器获取一个新的 `CustomerRequestDetails`\
  \ 对象实例。\n\n下面的示例列表显示了实现了 `ApplicationContextAware` 接口的 `CustomerRequestServiceContextAwareImpl`\
  \ 类（我们在示例列表 4-14 中看到的 `CustomerRequestServiceImpl` 类的修改版本）：\n\n**示例列表 4-15** – 实现了\
  \ Spring `ApplicationContextAware` 接口的 `CustomerRequestServiceContextAwareImpl`\
  \ 类\n\n**项目** – `ch04-bankapp-context-aware`\n\n**源码位置** - `src/main/java/sample/spring/chapter04/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter04.bankapp.service;\n\nimport org.springframework.context.ApplicationContext;\n\
  import org.springframework.context.ApplicationContextAware;\n\npublic class CustomerRequestServiceContextAwareImpl\
  \ implements\n    CustomerRequestService, ApplicationContextAware {\n\n    private\
  \ CustomerRequestDao customerRequestDao;\n\n    private ApplicationContext applicationContext;\n\
  \n    @ConstructorProperties({ \"customerRequestDao\" })\n    public CustomerRequestServiceContextAwareImpl(CustomerRequestDao\
  \ customerRequestDao) {\n        this.customerRequestDao = customerRequestDao;\n\
  \    }\n\n  public void setApplicationContext(ApplicationContext applicationContext)\n\
  \             throws BeansException {\n      this.applicationContext = applicationContext;\n\
  \  }\n\n    public void submitRequest(String requestType, String requestDescription)\
  \ {\n      CustomerRequestDetails customerRequestDetails = applicationContext\n\
  \              .getBean(CustomerRequestDetails.class);\n      customerRequestDetails.setType(requestType);\n\
  \      customerRequestDetails.setDescription(requestDescription);\n      customerRequestDao.submitRequest(customerRequestDetails);\n\
  \    }\n}\n```\n\n在上面的示例列表中，`setApplicationContext` 方法为 `CustomerRequestServiceContextAwareImpl`\
  \ 提供了一个 `ApplicationContext` 实例。该 `ApplicationContext` 实例后被 `submitRequest` 方法用于获取\
  \ `CustomerRequestDetails` 对象。\n\n由于 `CustomerRequestServiceContextAwareImpl` 显式地从\
  \ Spring 容器获取 `CustomerRequestDetails` 对象，你不需要使用 Spring 的 DI 机制来注入 `CustomerRequestDetails`\
  \ 实例。出于这个原因，`CustomerRequestServiceContextAwareImpl` 类的构造函数（参见示例列表 4-15）没有指定 `CustomerRequestDetails`\
  \ 对象作为参数。如果你现在进入 `ch04-bankapp-context-aware` 项目并执行 `BankApp` 的主方法，你会发现每次调用 `submitRequest`\
  \ 方法时，都会从 Spring 容器获取一个新的 `CustomerRequestDetails` 对象实例。\n\n在 MyBank 的上下文中，我们看到如果\
  \ bean 需要访问其他 bean，`ApplicationContextAware` 接口是有用的。实现 `ApplicationContextAware`\
  \ 接口的缺点是它将 bean 类与 Spring 框架耦合。通过使用 Spring 架构中 `<lookup-method>` 和 `<replaced-method>`\
  \ 元素提供的*方法注入*技术，你可以避免 bean 类与 Spring 框架耦合，并从 Spring 容器访问其他 bean。\n\n让我们先查看 `<lookup-method>`\
  \ 元素。\n\n**导入** **第 4 章/ch04-bankapp-lookup-method**（该项目展示了使用 Spring 架构 `<lookup-method>`\
  \ 元素的 MyBank 应用程序。要运行应用程序，请执行项目中 `BankApp` 类的主方法）\n\n### `<lookup-method>` 元素\n\n\
  如果 bean 类定义了一个返回类型代表 bean 的*查找查找方法*（lookup method），`<lookup-method>` 元素指示 Spring\
  \ 容器为该方法提供实现。由 Spring 容器提供的实现负责从 Spring 容器检索 bean 实例并将其返回。\n\n`<lookup-method>`\
  \ 元素的 `bean` 属性指定了由方法实现查找并返回的 bean 名称，而 `name` 属性指定了由 Spring 容器提供实现的方法名称。\n\n\n\n\
  \n\n**注意** 使用 `<lookup-method>` 元素来指示 Spring 容器为 bean 查找方法提供实现被称为“方法注入技术”，因为 `<lookup-method>`\
  \ 元素会将 bean 查找方法的实现注入到 bean 类中。\n\n接下来的示例列表显示了 `CustomerRequestServiceImpl` 的 `getCustomerRequestDetails`\
  \ *抽象* 方法，该方法返回一个 `CustomerRequestDetails` 实例：\n\n**示例列表 4-16** – `CustomerRequestServiceImpl`\
  \ 类 – 定义 bean 查找方法\n\n**项目** – `ch04-bankapp-lookup-method`\n\n**源码位置**- `src/main/java/sample/spring/chapter04/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter04.bankapp.service;\n\npublic abstract class\
  \ CustomerRequestServiceImpl implements CustomerRequestService {\n\n    private\
  \ CustomerRequestDao customerRequestDao;\n\n    @ConstructorProperties({ \"customerRequestDao\"\
  \ })\n    public CustomerRequestServiceImpl(CustomerRequestDao customerRequestDao)\
  \ {\n        this.customerRequestDao = customerRequestDao;\n    }\n\n    public\
  \ abstract CustomerRequestDetails getCustomerRequestDetails();\n\n    @Override\n\
  \    public void submitRequest(String requestType, String requestDescription) {\n\
  \        // -- populate CustomerRequestDetails object and save it\n        CustomerRequestDetails\
  \ customerRequestDetails = getCustomerRequestDetails();\n        .....\n    }\n\
  }\n```\n\n上面的示例列表显示 `CustomerRequestServiceImpl` 类被定义为抽象类，因为它包含一个抽象的 bean 查找方法 `getCustomerRequestDetails`。如果我们不使用抽象方法，我们完全可以将\
  \ `getCustomerRequestDetails` 方法定义为具体的方法。`submitRequest` 方法通过调用 `getCustomerRequestDetails`\
  \ 方法来访问 `CustomerRequestDetails` 实例。\n\n接下来的示例列表显示了 `CustomerRequestServiceImpl`\
  \ 和 `CustomerRequestDetails` 类的 bean 定义：\n\n**示例列表 4-17** – `applicationContext.xml`\
  \ - `<lookup-method>` 元素用法\n\n**项目** – `ch04-bankapp-lookup-method`\n\n**源码位置**\
  \ - `src/main/resources/META-INF/spring`\n\n```xml\n<bean id=\"customerRequestService\"\
  \n    class=\"sample.spring.chapter04.bankapp.service.CustomerRequestServiceImpl\"\
  >\n    <constructor-arg name=\"customerRequestDao\" ref=\"customerRequestDao\" />\n\
  \    <lookup-method bean=\"customerRequestDetails\" name=\"getCustomerRequestDetails\"\
  />\n</bean>\n\n<bean id=\"customerRequestDetails\"\n    class=\"sample.spring.chapter04.bankapp.domain.CustomerRequestDetails\"\
  \n    scope=\"prototype\" />\n```\n\n上面的示例列表显示 `CustomerRequestServiceImpl` 类的 bean\
  \ 定义包含一个 `<lookup-method>` 元素。`<lookup-method>` 元素的 `name` 属性值为 `getCustomerRequestDetails`，它指示\
  \ Spring 容器为 `CustomerRequestServiceImpl` 类的 `getCustomerRequestDetails` 方法方法（参见示例列表\
  \ 4-16）提供实现。`<lookup-method>` 元素的 `bean` 属性值为 `customerRequestDetails`，这意味着 `getCustomerRequestDetails`\
  \ 方法的实现将从 Spring 容器获取 id 或名称为 `customerRequestDetails` 的 bean 并将其返回给调用方法。由于 `customerRequestDetails`\
  \ bean 代表一个 `CustomerRequestDetails` 对象（参见示例列表 4-17 中的 `customerRequestDetails`\
  \ bean 定义），因此 `getCustomerRequestDetails` 方法返回一个 `CustomerRequestDetails` 对象。\n\n\
  在示例列表 4-16 中，`CustomerRequestService` 的 `submitRequest` 方法通过调用 `getCustomerRequestDetails`\
  \ bean 查找方法来获取 `CustomerRequestDetails` 实例。由于 `CustomerRequestDetails` 类在应用上下文 XML\
  \ 文件中定义为原型（prototype）作用域 bean（参见示例列表 4-17），每次调用 `submitRequest` 方法都会从 Spring 容器获取一个新的\
  \ `CustomerRequestDetails` 对象实例。\n\n为了检查 `<lookup-method>` 元素是否为 `CustomerRequestService`\
  \ 的 `getCustomerRequestDetails` bean 查找方法提供了正确的实现，`BankApp` 类的 main 方法从 Spring 容器获取\
  \ `CustomerRequestService` 实例并多次调用其 `submitRequest` 方法。如果每次调用 `submitRequest` 方法都能从\
  \ Spring 容器获取一个新的 `CustomerRequestDetails` 对象实例，则说明 `<lookup-method>` 元素为 `CustomerRequestService`\
  \ 的 `getCustomerRequestDetails` 方法提供了正确的实现。\n\n接下来的示例列表显示了 `BankApp` 的 main 方法，它多次调用了\
  \ `CustomerRequestService` 的 `submitRequest` 方法：\n\n**示例列表 4-18** – `BankApp` 类\n\
  \n**项目** – `ch04-bankapp-lookup-method`\n\n**源码位置**- `src/main/java/sample/spring/chapter04/bankapp`\n\
  \n```java\npackage sample.spring.chapter04.bankapp;\n\n.....\n\npublic class BankApp\
  \ {\n\n    private static Logger logger = Logger.getLogger(BankApp.class);\n\n \
  \   public static void main(String args[]) throws Exception {\n        ApplicationContext\
  \ context = new ClassPathXmlApplicationContext(\n            \"classpath:META-INF/spring/applicationContext.xml\"\
  );\n\n        logger.info(\"Beginning with CustomerRequestService\");\n        CustomerRequestService\
  \ customerRequestService = context.getBean(CustomerRequestService.class);\n    \
  \    customerRequestService.submitRequest(\"type1\", \"desc1\");\n        customerRequestService.submitRequest(\"\
  type2\", \"desc2\");\n        logger.info(\"Done with CustomerRequestService\");\n\
  \    }\n}\n```\n\n如果你执行 `BankApp` 的 main 方法，你将在控制台上看到如下输出：\n\n**Beginning with CustomerRequestService**\n\
  \nCreated CustomerRequestDetails instance\n\nCreated CustomerRequestDetails instance\n\
  \n**Done with CustomerRequestService**\n\n上面输出显示的 *‘Created.....’* 消息是由 bean 类的构造函数打印的。上面的输出显示每次调用\
  \ `CustomerRequestService` 的 `submitRequest` 方法都会导致获取一个新的 `CustomerRequestDetails`\
  \ 实例。\n\n\n\n\n\n`<replaced-method>` 元素允许您将豆类（bean class）中的任意方法替换为不同的实现。下面的示例列表展示了\
  \ `CustomerRequestServiceImpl` 类，我们将作为示例来演示 `<replaced-method>` 元素的使用：\n\n**示例列表\
  \ 4-19** – `CustomerRequestServiceImpl` 类\n\n**项目** – `ch04-bankapp-replaced-method`\n\
  \n**源码位置** - `src/main/java/sample/spring/chapter04/bankapp/service`\n\n```java\n\
  package sample.spring.chapter04.bankapp.service;\n\n.....\n\npublic class CustomerRequestServiceImpl\
  \ implements CustomerRequestService {\n\n    private CustomerRequestDao customerRequestDao;\n\
  \n    .....\n\n    public Object getMyBean(String beanName) {\n        return null;\n\
  \    }\n\n    @Override\n    public void submitRequest(String requestType, String\
  \ requestDescription) {\n        // -- populate CustomerRequestDetails object and\
  \ save it\n        CustomerRequestDetails customerRequestDetails =\n           \
  \     (CustomerRequestDetails) getMyBean(\"customerRequestDetails\");\n        customerRequestDetails.setType(requestType);\n\
  \        customerRequestDetails.setDescription(requestDescription);\n        customerRequestDao.submitRequest(customerRequestDetails);\n\
  \    }\n}\n```\n\n上面的示例列表显示 `CustomerRequestServiceImpl` 类定义了一个 `getMyBean` 方法。`getMyBean`\
  \ 方法接受豆名作为参数，但它并没有返回与豆名参数对应的豆实例，`getMyBean` 方法返回了 `null`。`submitRequest` 方法将 `customerRequestDetails`\
  \ 字符串作为参数传递给 `getMyBean` 方法，并假设 `getMyBean` 方法返回一个 `customerRequestDetails` 豆的实例。使用\
  \ `<replaced-method>` 元素，你可以用一个返回与豆名参数对应的豆实例的方法来重写 `getMyBean` 方法。\n\n`<replaced-method>`\
  \ 元素需要知道关于*被覆盖*（overridden）方法（在我们的场景中是 `CustomerRequestServiceImpl getMyBean` 方法）和*覆盖*（overriding）方法的信息。覆盖方法由实现\
  \ Spring 的 `MethodReplacer` 接口的类提供。下面的示例列表展示了实现 `MethodReplacer` 接口的 `MyMethodReplacer`\
  \ 类：\n\n**示例列表 4-20** – `MyMethodReplacer` 类\n\n**项目** – `ch04-bankapp-replaced-method`\n\
  \n**源码位置** - `src/main/java/sample/spring/chapter04/bankapp/service`\n\n```java\n\
  package sample.spring.chapter04.bankapp.service;\n\nimport org.springframework.beans.factory.support.MethodReplacer;\n\
  import org.springframework.context.ApplicationContextAware;\n\npublic class MyMethodReplacer\
  \ implements MethodReplacer, ApplicationContextAware {\n\n    private ApplicationContext\
  \ applicationContext;\n\n    @Override\n    public Object reimplement(Object obj,\
  \ Method method, Object[] args) throws Throwable {\n        return applicationContext.getBean((String)\
  \ args[0]);\n    }\n\n    @Override\n    public void setApplicationContext(ApplicationContext\
  \ applicationContext)\n            throws BeansException {\n        this.applicationContext\
  \ = applicationContext;\n    }\n}\n```\n\nSpring 的 `MethodReplacer` 接口定义了一个 `reimplement`\
  \ 方法，其实现由 `MyMethodReplacer` 类提供。`reimplement` 方法代表了*覆盖*方法。`MyMethodReplacer` 类还实现了\
  \ Spring 的 `ApplicationContextAware` 接口，以便 `reimplement` 方法可以访问 `ApplicationContext`\
  \ 实例。`reimplement` 方法使用 `ApplicationContext` 的 `getBean` 方法从 Spring 容器中检索豆。\n\n\
  `reimplement` 方法接受以下参数：\n\n- `Object obj` – 标识我们正在重写方法的对象。在我们的场景中，`obj` 对象是 `CustomerRequestServiceImpl`\
  \ 对象。\n- `Method method` – 标识被 `reimplement` 方法覆盖的豆类方法。在我们的场景中，这是 `CustomerRequestServiceImpl`\
  \ 的 `getMyBean` 方法。\n- `Object[] args` – 标识传递给我们正在重写方法的参数。在我们的场景中，`args` 代表传递给 `CustomerRequestServiceImpl`\
  \ 的 `getMyBean` 方法的参数。在示例列表 4-20 中，`reimplement` 方法中的 `args[0]` 指向传递给 `CustomerRequestServiceImpl`\
  \ 的 `getMyBean` 方法的豆名参数。\n\n如果你现在查看示例列表 4-20 中 `MyMethodReplacer` 的 `reimplement`\
  \ 方法，你可以推断它使用 `args` 参数首先获取传递给 `CustomerRequestServiceImpl` 的 `getMyBean` 方法的豆名，然后调用\
  \ `ApplicationContext` 的 `getBean` 方法来获取相应的豆实例。由于 `MyMethodReplacer` 的 `reimplement`\
  \ 方法重写了 `CustomerRequestServiceImpl` 的 `getMyBean` 方法，运行时对 `getMyBean` 方法的调用将返回传递名称的豆实例。\n\
  \n`<replaced-method>` 元素通知 Spring 容器 `MyMethodReplacer` 的 `reimplement` 方法，如下面的示例所示：\n\
  \n**示例列表 4-21** – `applicationContext.xml` - `<replaced-method>` 用法\n\n**项目** –\
  \ `ch04-bankapp-replaced-method`\n\n**源码位置** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"customerRequestService\" class=\"sample.spring.chapter04.bankapp.service.CustomerRequestServiceImpl\"\
  >\n    <constructor-arg name=\"customerRequestDao\" ref=\"customerRequestDao\" />\n\
  \    <replaced-method name=\"getMyBean\" replacer=\"methodReplacer\" />\n</bean>\n\
  \n<bean id=\"methodReplacer\" class=\"sample.spring.chapter04.bankapp.service.MyMethodReplacer\"\
  \ />\n```\n\n上面的示例列表显示了 `MyMethodReplacer` 和 `CustomerRequestServiceImpl` 的豆定义。`<replaced-method>`\
  \ 元素的 `name` 属性指定要重写的方法，而 `replacer` 属性指定实现 `MethodReplacer` 接口的豆的引用。\n\n类似于 `<lookup-method>`\
  \ 元素，`ch04-bankapp-replaced-method` 中的 `BankApp` 类的主方法验证了 `<replaced-method>` 元素是否用\
  \ `replacer` 指定豆的 `reimplement` 方法覆盖了接口的 `getMyBean` 方法。`ch04-bankapp-replaced-method`\
  \ 中的 `BankApp` 类与我们在示例列表 4-18 中看到的 `ch04-bankapp-lookup-method` 中。如果你执行 `BankApp`\
  \ 类的主方法，你会发现 `<replaced-method>` 元素用 `MyMethodReplacer` 的 `reimplement` 方法覆盖了 `CustomerRequestServiceImpl`\
  \ 的 `getMyBean` 方法；因此，每次调用 `CustomerRequestServiceImpl` 的 `submitRequest` 方法（参考示例列表\
  \ 4-19）时，都会从 Spring 容器获取一个新的 `CustomerRequestDetails` 实例。\n\n注意的是，你可以使用 `<replaced-method>`\
  \ 元素将豆类中的抽象或具体方法替换为不同的方法实现。例如，我们可以将 `getMyBean` 方法定义为抽象方法，并按照本节描述的方式使用 `<replaced-method>`\
  \ 元素。\n\n**注意** 由于豆类需要在运行时由 Spring 容器进行子类化以替换豆方法，Spring 容器使用 CGLIB ([CGLIB](http://cglib.sourceforge.net/))\
  \ 库来执行子类化。从 Spring 3.2 开始，CGLIB 类被封装在 `spring-core` JAR 包中；因此，你不需要显式指定你的项目依赖 CGLIB\
  \ JAR 包。\n\n现在让我们来看看 `<replaced-method>` 元素如何唯一标识要覆盖的豆方法。\n\n\n\n\n\n你可能会遇到某些场景，其中你想使用\
  \ `<replaced-method>` 元素替换的 bean 方法无法通过名称唯一标识。例如，接下来的示例显示了一个包含重载 `perform` 方法的 bean\
  \ 类：\n\n**示例列表 4-22** – bean 类中的重载方法\n\n```java\npublic class MyBean {\n    public\
  \ void perform(String task1, String task2) { ..... }\n    public void perform(String\
  \ task) { ..... }\n    public void perform(my.Task task) { ..... }\n}\n```\n\n在上面的示例列表列表中，`MyBean`\
  \ 类包含了多个命名为 `perform` 的方法。为了唯一标识要重写的 bean 方法，`<replaced-method>` 元素使用 `<arg-type>`\
  \ 子元素来指定方法的参数类型。例如，接下来的示例显示了 `<replaced-method>` 元素如何指定替换 `MyBean` 类中的 `perform(String,\
  \ String)` 方法：\n\n**示例列表 4-23** – 带有 `<arg-type>` 子元素的 `<replaced-method>` 元素\n\n\
  ```xml\n<bean id=\"mybean\" class=\"MyBean\">\n    <replaced-method name=\"perform\
  \ \" replacer=\".....\">\n        <arg-type>java.lang.String</arg-type>\n      \
  \  <arg-type>java.lang.String</arg-type>\n    </replaced-method>\n</bean>\n```\n\
  \n与其使用全限定名作为 `<arg-type>` 元素的值，你可以使用全限定名的子字符串作为值。例如，在上面的示例列表列表中，与其使用 `java.lang.String`，你可以指定\
  \ `Str` 或 `String` 作为 `<arg-type>` 元素的值。\n\n现在让我们来看 Spring 的自动装配功能，它可以省去你在此应用程序上下文\
  \ XML 文件中手动指定 bean 依赖的精力。\n\n## 4-6 自动装配依赖\n\n在 Spring 中，你可以选择 `<property>` 和 `<constructor-arg>`\
  \ 元素显式指定 bean 依赖，也可以让 Spring 自动解析 bean 依赖。Spring 自动解析依赖的过程被称为“自动装配”（autowiring）。\n\
  \n**导入 第 4 章/ch04-bankapp-autowiring**（此项目展示了使用 Spring 自动装配功能进行依赖注入的 MyBank 应用。要运行该应用程序，请执行该项目\
  \ `BankApp` 类的主方法）\n\n`<bean>` 元素的 `autowire` 属性指定了 Spring 如何自动解析 bean 的依赖。`autowire`\
  \ 属性可以取以下任一值：`default`、`byName`、`byType`、`constructor` 和 `no`。现在让我们详细查看这些属性值。\n\n\
  **注意** 你应该注意 `<bean>` 元素的 `autowire` 属性不会被子 bean 定义继承。\n\n### byType\n\n如果你将 autowire\
  \ 属性的值指定为 `byType`，Spring 将根据类型自动装配 bean 属性。例如，如果 bean `A` 定义了一个类型为 `X` 的属性，Spring\
  \ 在 `ApplicationContext` 中寻找类型为 `X` 的 bean 并将其注入 bean `A`。让我们来看 MyBank 应用中 `byType`\
  \ 自动装配的一个示例用法。\n\n接下来的示例列表显示了 MyBank 应用的 `CustomerRegistrationServiceImpl` 类：\n\n\
  **示例列表 4-24** – `CustomerRegistrationServiceImpl` 类\n\n**项目** – ch04-bankapp-autowiring\n\
  \n**源位置** -`src/main/java/sample/spring/chapter04/bankapp/service`\n\n```java\n\
  package sample.spring.chapter04.bankapp.service;\n\npublic class CustomerRegistrationServiceImpl\
  \ implements CustomerRegistrationService {\n    private CustomerRegistrationDetails\
  \ customerRegistrationDetails;\n    private CustomerRegistrationDao customerRegistrationDao;\n\
  \    ....\n\n    public void setCustomerRegistrationDetails(CustomerRegistrationDetails\
  \ customerRegistrationDetails) {\n        this.customerRegistrationDetails = customerRegistrationDetails;\n\
  \    }\n\n    public void setCustomerRegistrationDao(CustomerRegistrationDao customerRegistrationDao)\
  \ {\n        this.customerRegistrationDao = customerRegistrationDao;\n    }\n  \
  \  .....\n}\n```\n\n上面的示例列表显示 `CustomerRegistrationServiceImpl` 类定义了名为 `customerRegistrationDetails`（类型为\
  \ `CustomerRegistrationDetails`）和 `customerRegistrationDao`（类型为 `CustomerRegistrationDao`）的属性。这意味着\
  \ `CustomerRegistrationDetails` 和 `CustomerRegistrationDao` 对象是 `CustomerRegistrationServiceImpl`\
  \ 对象的依赖。\n\n接下来的示例列表显示了 `CustomerRegistrationServiceImpl`、`CustomerRegistrationDetails`\
  \ 和 `CustomerRegistrationDaoImpl`（`CustomerRegistrationDao` 的实现）的 bean 定义：\n\n**示例列表\
  \ 4-25** – `applicationContext.xml` - 自动装配 `byType`\n\n**项目** – ch04-bankapp-autowiring\n\
  \n```xml\n<bean id=\"customerRegistrationService\" class=\"sample.spring.chapter04.bankapp.service.CustomerRegistrationServiceImpl\"\
  \ scope=\"prototype\" autowire=\"byType\"/>\n<bean id=\"customerRegistrationDetails\"\
  \ class=\"sample.spring.chapter04.bankapp.domain.CustomerRegistrationDetails\" scope=\"\
  prototype\"/>\n<bean id=\"customerRegistrationDao\" class=\"sample.spring.chapter04.bankapp.dao.CustomerRegistrationDaoImpl\"\
  />\n```\n\n在上面的示例列表中，`customerRegistrationService` bean 并不包含设置 `customerRegistrationDetails`\
  \ 和 `customerRegistrationDao` 的 `<property>` 元素（参见示例列表 4-24）。相反，`<bean>` 元素将 `autowire`\
  \ 属性的值指定为 `byType`，指示 Spring 根据类型自动解析 `customerRegistrationService` bean 的依赖。Spring\
  \ 在 `ApplicationContext` 中寻找类型为 `CustomerRegistrationDetails` 和 `CustomerRegistrationDao`\
  \ 的 bean，并将它们注入 `customerRegistrationService`。由于 `CustomerRegistrationDetails` 和\
  \ `CustomerRegistrationDao` bean 分别代表这些类型，Spring 将它们注入到 `customerRegistrationService`。\n\
  \n可能会出现 Spring 在 `ApplicationContext` 中找不到任何匹配属性类型的 bean。在这种情况下，不会抛出异常且 bean 属性不会设置。例如，如果\
  \ bean 定义了一个类型为 `Y` 的属性 `x`，且 `ApplicationContext` 中没有类型为 `Y` 的 bean，则属性 `x` 不会被设置。如果\
  \ Spring 在 `ApplicationContext` 中找到多个匹配属性类型的 bean，则会抛出异常。在这种情况下，与其使用自动装配功能，不如使用\
  \ `<property>` 元素显式标识依赖，或者通过 `<bean>` 元素的 `primary` 属性设置为 `true` 将 bean 设置为自动装配的首选候选。\n\
  \n### constructor\n\n如果你将 autowire 属性的值指定为 `constructor`，Spring 将根据类型自动装配 bean 类的构造函数参数。例如，如果\
  \ bean `A` 的构造函数接受类型为 `X` 和 `Y` 的参数，Spring 在 `ApplicationContext` 中寻找类型为 `X` 和 `Y`\
  \ 的 bean，并将它们作为参数注入 bean `A` 的构造函数。让我们来看 MyBank 应用中构造函数自动装配的一个示例用法。\n\n接下来的示例列表显示了\
  \ MyBank 应用的 `CustomerRequestServiceImpl` 类：\n\n**示例列表 4-26** – `CustomerRequestServiceImpl`\
  \ 类\n\n**项目** – ch04-bankapp-autowiring\n\n**源位置** -`src/main/java/sample/spring/chapter04/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter04.bankapp.service;\n\npublic class CustomerRequestServiceImpl\
  \ implements CustomerRequestService {\n    private CustomerRegistrationDetails customerRegistrationDetails;\n\
  \    private CustomerRegistrationDao customerRegistrationDao;\n\n    @ConstructorProperties({\
  \ \"customerRegistrationDetails\", \"customerRegistrationDao\" })\n    public CustomerRequestServiceImpl(\n\
  \        CustomerRegistrationDetails customerRegistrationDetails,\n        CustomerRegistrationDao\
  \ customerRegistrationDao) {\n```\n\n\n\n\n\n```java\nthis.customerRequestDetails\
  \ = customerRequestDetails;\n\nthis.customerRequestDao = customerRequestDao;\n\n\
  }\n\n.....\n}\n```\n\n`CustomerRequestServiceImpl` 类定义了一个构造函数，接受类型为 `CustomerRequestDetails`\
  \ 和 `CustomerRequestDao` 的参数。\n\n接下来的示例显示了 `CustomerRequestServiceImpl`、`CustomerRequestDetails`\
  \ 和 `CustomerRequestDaoImpl`（`CustomerRequestDao` 接口的实现）类的 bean 定义：\n\n**示例列表 4-27**\
  \ – `applicationContext.xml` - 构造器注入\n\n**项目** – `ch04-bankapp-autowiring`\n\n**源位置**\
  \ - `src/main/resources/META-INF/spring`\n\n```xml\n<bean id=\"customerRequestService\"\
  \n    class=\"sample.spring.chapter04.bankapp.service.CustomerRequestServiceImpl\"\
  \n    autowire=\"constructor\">\n</bean>\n<bean id=\"customerRequestDetails\"\n\
  \    class=\"sample.spring.chapter04.bankapp.domain.CustomerRequestDetails\" scope=\"\
  prototype\" />\n<bean id=\"customerRequestDao\"\n    class=\"sample.spring.chapter04.bankapp.dao.CustomerRequestDaoImpl\"\
  \ />\n```\n\n在上面的示例列表中，`customerRequestService` bean 定义将 `autowire` 属性的值设置为 `constructor`，这意味着\
  \ Spring 在 `ApplicationContext` 中查找类型为 `CustomerRequestDetails` 和 `CustomerRequestDao`\
  \ 的 bean，并将它们作为参数传递给 `CustomerRequestServiceImpl` 类的构造函数。由于 `customerRequestDetails`\
  \ 和 `customerRequestDao` bean 的类型分别是 `CustomerRequestDetails` 和 `CustomerRequestDao`，Spring\
  \ 会将这些 bean 的实例注入到 `customerRequestService` bean 中。\n\n如果 Spring 在 `ApplicationContext`\
  \ 中没有找到任何与构造函数参数类型匹配的 bean，则不会设置该构造函数参数。如果 Spring 在 `ApplicationContext` 中找到多个匹配构造函数参数类型的\
  \ bean，则会抛出异常；因此，在这种情况下使用 `<constructor-arg>` 元素来显式标识 bean 依赖，或者通过将 `<bean>` 元素的\
  \ `primary` 属性值设置为 true 来将某个 bean 设置为注入的*主要候选对象*。\n\n### byName\n\n如果你将 `autowire`\
  \ 属性的值设置为 `byName`，Spring 将根据属性名称自动注入 bean 属性。例如，如果 bean `A` 定义了一个名为 `x` 的属性，Spring\
  \ 会在 `ApplicationContext` 中找到名为 `x` 的 bean 并将其注入到 bean `A` 中。让我们来看 `MyBank` 应用中使用\
  \ `byName` 注入的示例。\n\n接下来的示例显示了 MyBank 应用的 `FixedDepositServiceImpl` 类：\n\n**示例列表\
  \ 4-28** – `FixedDepositServiceImpl` 类\n\n**项目** – `ch04-bankapp-autowiring`\n\n\
  **源位置** - `src/main/java/sample/spring/chapter04/bankapp/service`\n\n```java\npackage\
  \ sample.spring.chapter04.bankapp.service;\n\nimport sample.spring.chapter04.bankapp.dao.FixedDepositDao;\n\
  \nimport sample.spring.chapter04.bankapp.domain.FixedDepositDetails;\n\npublic class\
  \ FixedDepositServiceImpl implements FixedDepositService {\n\n    private FixedDepositDao\
  \ myFixedDepositDao;\n\n    public void setMyFixedDepositDao(FixedDepositDao myFixedDepositDao)\
  \ {\n        this.myFixedDepositDao = myFixedDepositDao;\n    }\n\n    .....\n}\n\
  ```\n\n上面的示例显示 `FixedDepositServiceImpl` 类定义了一个名为 `myFixedDepositDao`、类型为 `FixedDepositDao`\
  \ 的属性。\n\n接下来的示例显示了 `FixedDepositServiceImpl` 和 `FixedDepositDaoImpl`（`FixedDepositDao`\
  \ 接口的实现）类的 bean 定义：\n\n**示例列表 4-29** – `applicationContext.xml` - byName 注入\n\n\
  **项目** – `ch04-bankapp-autowiring`\n\n**源位置** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean id=\"FixedDepositService\"\n    class=\"sample.spring.chapter04.bankapp.service.FixedDepositServiceImpl\"\
  \n    autowire=\"byName\" />\n<bean id=\"myFixedDepositDao\"\n    class=\"sample.spring.chapter04.bankapp.dao.FixedDepositDaoImpl\"\
  \ />\n```\n\n在上面的示例列表中，`FixedDepositService` bean 定义将 `autowire` 属性的值设置为 `byName`，这意味着\
  \ `FixedDepositService` bean 的属性将根据其名称由 Spring 自动解析。在列表 4-28 中，我们看到 `FixedDepositServiceImpl`\
  \ 类定义了一个名为 `myFixedDepositDao` 的属性；因此，Spring 在 `ApplicationContext` 中查找名为 `myFixedDepositDao`\
  \ 的 bean 并将其注入到 `FixedDepositService` bean 中。在上面的示例列表中，`myFixedDepositDao` bean\
  \ 定义代表 `FixedDepositDaoImpl` 类，这意味着 `FixedDepositDaoImpl` 的实例被注入到 `FixedDepositService`\
  \ bean 中名为 `myFixedDepositDao` 的属性中。\n\n### default / no\n\n如果你将 `autowire` 属性的值设置为\
  \ `default` 或 `no`，则禁用该 bean 的自动注入。由于 Spring 默认使用自动注入，将 `autowire` 属性的值设置为 `no`\
  \ 意味着不对该 bean 执行自动注入。\n\n你可以通过设置 `<beans>` 元素的 `default-autowire` 属性来更改 bean 的默认注入行为。例如，如果你将\
  \ `default-autowire` 属性设置为 `byType`，它将适用于 `<bean>` 元素。你应该，如果 `<bean>` 元素的 `autowire`\
  \ 属性值不同于 `<beans>` 元素的 `default-autowire` 属性，则以 `<bean>` 元素的 `autowire` 属性为准。\n\n\
  接下来的示例显示了 MyBank 应用中 `CustomerRequestServiceImpl` 类的 bean 定义，其 `autowire` 属性值设置为\
  \ `no`：\n\n**示例列表 4-30** – `applicationContext.xml` - 无注入\n\n**项目** – `ch04-bankapp-autowiring`\n\
  \n**源位置** - `src/main/resources/META-INF/spring`\n\n```xml\n<bean id=\"customerRequestService\"\
  \n    class=\"sample.spring.chapter04.bankapp.service.CustomerRequestServiceImpl\"\
  \n    scope=\"prototype\" autowire=\"no\" />\n```\n\n示例 4-24 显示 `CustomerRequestServiceImpl`\
  \ 类定义了 `customerRequestDetails`（类型为 `CustomerRequestDetails`）和 `customerRequestDao`（类型为\
  \ `CustomerRequestDao`）属性。由于 `customerRequestService` bean 的 `autowire` 属性值设置为 `no`，因此禁用了该\
  \ bean 的自动注入。这意味着 `customerRequestService` bean 的 `customerRequestDetails` 和 `customerRequestDao`\
  \ 属性不会由 Spring 设置。\n\n在本节到为止，我们已经学习了 Spring 自动注入 bean 依赖的不同方式。现在让我们来看看如何使用 `<bean>`\
  \ 元素的 `autowire-candidate` 属性使 bean 在自动注入时不可用。\n\n### 使 bean 不可自动注入\n\nSpring 容器的默认行为是让\
  \ bean 可自动注入。通过将 `autowire-candidate` 属性的值设置为 false，你可以使某个 bean 不被其他 bean 自动注入。\n\
  \n在 MyBank 应用中，`AccountStatementServiceImpl` 类定义了一个类型为 `AccountStatementDao` 的属性。接下来的示例显示了\
  \ `AccountStatementServiceImpl` 类：\n\n\n\n\n\n以下示例列出了 `AccountStatementServiceImpl`\
  \ 和 `AccountStatementDaoImpl`（`AccountStatementDao` 接口的实现）类的 bean 定义：\n\n**示例列表\
  \ 4-32** – `applicationContext.xml` - autowire-candidate 属性\n\n**项目** – `ch04-bankapp-autowiring`\n\
  \n**源位置** - `src/main/resources/META-INF/spring`\n\n```xml\n<bean id=\"accountStatementService\"\
  \n        class=\"sample.spring.chapter04.bankapp.service.AccountStatementServiceImpl\"\
  \n        autowire=\"byType\" />\n\n<bean id=\"accountStatementDao\"\n        class=\"\
  sample.spring.chapter04.bankapp.dao.AccountStatementDaoImpl\"\n        autowire-candidate=\"\
  false\" />\n```\n\n在上述示例正文中，`accountStatementService` bean 定义将 `autowire` 属性的值设置为\
  \ `byType`，这意味着 `accountStatementService` bean 的 `accountStatementDao` 属性类型是通过类型进行自动装的。由于\
  \ `accountStatementDao` bean 的类型是 `AccountStatementDao`，你可能会认为 Spring 将把 `accountStatementDao`\
  \ bean 实例注入 `accountStatementService` bean 中。但 Spring 不会考虑 `accountStatementDao`\
  \ bean 用于自动装配，因为 `accountStatementDao` bean 定义将 `autowire-candidate` 属性的值设置为 `false`。\n\
  \n**注意** 你应该注意，一个无法用于其他 bean 自动装配的 bean，本身可以使用 Spring 的自动装配功能来自动解析其依赖。\n\n提到的，Spring\
  \ 容器的默认行为是让 bean 可用于自动装配。要让只有一组特定的 bean 可自动装配，请设置 `<beans>` 元素的 `default-autowire-candidates`\
  \ 属性。`default-autowire-candidates` 属性指定了一个 bean 名称模式 `pattern`，只有名称匹配指定模式的 bean\
  \ 才能用于自动装配。以下示例显示了 `default-autowire-candidates` 属性的一个用法示例：\n\n**示例列表 4-33** – default-autowire-candidates\
  \ 属性示例\n\n```xml\n<beans default-autowire-candidates=\"*Dao\" >\n    .....\n   \
  \ <bean id=\"customerRequestDetails\"\n          class=\"sample.spring.chapter04.bankapp.domain.CustomerRequestDetails\"\
  \n          scope=\"prototype\" autowire-candidate=\"true\"/>\n    <bean id=\"customerRequestDao\"\
  \n          class=\"sample.spring.chapter04.bankapp.dao.CustomerRequestDaoImpl\"\
  \ />\n    <bean id=\"customerRegistrationDao\"\n          class=\"sample.spring.chapter04.bankapp.dao.CustomerRegistrationDaoImpl\"\
  \ />\n    .....\n</beans>\n```\n\n在上述示例正文中，`default-autowire-candidates` 的值设置为 `Dao`，这意味着名称以\
  \ `Dao` 结尾的 bean（例如 `customerRequestDao` 和 `customerRegistrationDao` bean）将用于自动装配。如果\
  \ bean 名称不匹配 `default-autowire-candidates` 属性指定的模式（例如 `customerRequestDetails` bean），你仍然可以通过将相应的\
  \ `<bean>` 元素的 `autowire-candidate` 属性设置为 `true` 来让它也用于自动装配。\n\n现在让我们来看一看在应用程序中使用自动装配的局限性。\n\
  \n### 自动装配的局限性\n\n我们看到自动装配功能节省了使用 `<property>` 和 `<constructor-arg>` 元素显式指定 bean\
  \ 依赖的精力。使用自动装配功能的缺点是：\n\n- 你不能使用自动装配设置简单 Java 类型的属性或构造器参数（如 `int`、`long`、`boolean`、`String`、`Date`\
  \ 等）。如果 `autowire` 属性的值设置为 `byType` 或 `constructor`，你可以自动配数组、类型集合和映射。\n- 由于 bean\
  \ 依赖是由 Spring 自动解析的，这导致了应用程序整体结构的隐蔽。如果你使用 `<property>` 和 `<constructor-arg>` 元素来指定\
  \ bean 依赖，就会显式地记录应用程序的整体结构。对于显式记录 bean 依赖的应用程序，你可以轻松理解和维护。因此，不建议在大型应用程序中使用自动装配。\n\
  \n## 4-7 总结\n\n在本章中，我们查看了 Spring 如何适应不同的依赖注入场景。我们查看了如何使用 `ApplicationContextAware`\
  \ 接口、`<bean>` 元素的子元素 `<replaced-method>` 和 `<lookup-method>` 从 `ApplicationContext`\
  \ 中通过编程方式检索 bean 实例。我们还查看了 Spring 的自动装配功能如何节省在应用程序上下文 XML 文件中显式指定 bean 依赖的精力。在下一章中，我们将查看如何自定义\
  \ bean 和 bean 定义。\n\n# 第 5 章 - 自定义 bean 和 bean 定义\n\n## 5-1 引言\n\n到目前为止，我们在书中看到了\
  \ Spring 容器根据应用程序上下文 XML 文件指定的 bean 定义创建 bean 实例的示例。在本章中，我们将进一步探讨：\n\n- 如何为 bean\
  \ 整合自定义的初始化和销毁逻辑\n- 如何通过实现 Spring 的 `BeanPostProcessor` 接口与新创建的 bean 实例交互\n- 如何通过实现\
  \ Spring 的 `BeanFactoryPostProcessor` 接口修改 bean 定义\n\n## 5-2 自定义 bean 的初始化和销毁\n\n\
  我们在前面的章节中看到，Spring 容器负责创建 bean 实例并注入其依赖。在调用类的构造函数创建 bean 实例后，Spring 容器通过 setter\
  \ 方法设置属性。如果你想在属性设置之后、Spring 容器完成初始化 之前执行自定义初始化（例如打开文件、创建数据库连接等），可以通过将初始化方法的名称设置为\
  \ `<bean>` 元素的 `init-method`。同样，如果你想在包含 bean 实例的 Spring 容器销毁之前执行自定义清理工作，可以将清理方法的名称设置为\
  \ `<bean>` 元素的 `destroy-method`。\n\n**导入** `ch05-bankapp-customization`（该项目展示了 MyBank\
  \ 应用使用 `<bean>` 元素的 `init-method` 和 `destroy-method` 来指定自定义的初始化和销毁方法。要测试初始化方法是否执行，请运行项目的\
  \ `BankApp` 类的 main 方法。要测试销毁方法是否执行，请运行项目的 `BankWithHook` 类的 main 方法。）\n\n以下示例显示了\
  \ MyBank 的 `FixedDepositDaoImpl` 类，它定义了用于获取数据库连接的初始化方法 `initializeDbConnection`\
  \ 以及用于释放连接的销毁方法 `releaseDbConnection`：\n\n**示例列表 5-1** – `FixedDepositDaoImpl` 类\
  \ - 自定义初始化和销毁逻辑\n\n**项目** – `ch05-bankapp-customization`\n\n**源位置** - `src/main/java/sample/spring/chapter05/bankapp/dao`\n\
  \n```java\npackage sample.spring.chapter05.bankapp.dao;\n\npublic class FixedDepositDaoImpl\
  \ implements FixedDepositDao {\n    private static Logger logger = Logger.getLogger(FixedDepositDaoImpl.class);\n\
  \    private DatabaseConnection connection;\n\n    public FixedDepositDaoImpl()\
  \ {\n        logger.info(\"FixedDepositDaoImpl's constructor invoked\");\n    }\n\
  \n    public void initializeDbConnection() {\n        logger.info(\"FixedDepositDaoImpl’s\
  \ initializeDbConnection method invoked\");\n        connection = DatabaseConnection.getInstance();\n\
  \    }\n\n    public boolean createFixedDeposit(FixedDepositDetails fixedDepositDetails)\
  \ {\n        logger.info(\"FixedDepositDaoImpl’s createFixedDeposit method invoked\"\
  );\n        // -- save the fixed deposits and then return true\n        return true;\n\
  \    }\n\n    public void releaseDbConnection() {\n```\n\n\n\n\n\n```java\nlogger.info(\"\
  FixedDepositDaoImpl’s releaseDbConnection method invoked\");\n\nconnection.releaseConnection();\n\
  \n}\n```\n\n在上面的示例列表中，`DatabaseConnection` 对象用于与 MyBank 的数据库进行交互。`FixedDepositDaoImpl`\
  \ 类定义了一个 `initializeDbConnection` 方法，该方法初始化了 `DatabaseConnection` 对象，该对象随后被 `createFixedDeposit`\
  \ 方法调用，用于在 MyBank 的数据库中保存定期存款详情。\n\n接下来的示例显示了 MyBank 的 `FixedDepositServiceImpl`\
  \ 类，该类使用 `FixedDepositDaoImpl` 实例来创建新的定期存款：\n\n**示例列表 5-2** – `FixedDepositServiceImpl`\
  \ 类\n\n**项目** – `ch05-bankapp-customization`\n\n**源位置** - `/src/main/java/sample/spring/chapter05/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter05.bankapp.service;\n\npublic class FixedDepositServiceImpl\
  \ implements FixedDepositService {\n\n    private static Logger logger = Logger.getLogger(FixedDepositServiceImpl.class);\n\
  \n    private FixedDepositDao myFixedDepositDao;\n\n    public void setMyFixedDepositDao(FixedDepositDao\
  \ myFixedDepositDao) {\n        logger.info(\"FixedDepositServiceImpl's setMyFixedDepositDao\
  \ method invoked\");\n        this.myFixedDepositDao = myFixedDepositDao;\n    }\n\
  \n    @Override\n    public void createFixedDeposit(FixedDepositDetails fixedDepositDetails)\
  \ throws Exception {\n        // -- create fixed deposit\n        myFixedDepositDao.createFixedDeposit(fixedDepositDetails);\n\
  \    }\n}\n```\n\n上面的示例列表显示 `FixedDepositDaoImpl` 实例是 `FixedDepositServiceImpl`\
  \ 的依赖，并作为参数传递给 `setMyFixedDepositDao` setter 方法。而且，如果调用了 `FixedDepositServiceImpl`\
  \ 的 `createFixedDeposit` 方法，将导致 `FixedDepositDaoImpl` 的 `createFixedDeposit` 方法被调用。\n\
  \n接下来的示例列表显示了 `FixedDepositDaoImpl` 和 `FixedDepositServiceImpl` 类的 bean 定义：\n\n\
  **示例列表 5-3** – `applicationContext.xml` – `init-method` 和 `destroy-method` 属性的使用\n\
  \n**项目** – `ch05-bankapp-customization`\n\n**源位置** - `/src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans .....>\n    <bean id=\"FixedDepositService\"\n        class=\"\
  sample.spring.chapter05.bankapp.service.FixedDepositServiceImpl\">\n        <property\
  \ name=\"myFixedDepositDao\" ref=\"myFixedDepositDao\" />\n    </bean>\n    <bean\
  \ id=\"myFixedDepositDao\"\n        class=\"sample.spring.chapter05.bankapp.dao.FixedDepositDaoImpl\"\
  \n        init-method=\"initializeDbConnection\" destroy-method=\"releaseDbConnection\"\
  \ />\n</beans>\n```\n\n上面的示例列表显示对应于 `FixedDepositDaoImpl` 类的 `<bean>` 元素将 `initializeDbConnection`\
  \ 和 `releaseDbConnection` 分指定为 `init-method` 和 `destroy-method` 属性的值。\n\n**注意**\
  \ 注意，`<bean>` 元素通过 `init-method` 和 `destroy-method` 属性指定的初始化和销毁方法*不能*接受任何参数，但可以定义为抛出异常。\n\
  \n接下来的示例显示了 `BankApp` 类，其主方法从 `ApplicationContext` 获取 `FixedDepositServiceImpl`\
  \ 实例并调用 `FixedDepositServiceImpl` 的 `createFixedDeposit` 方法：\n\n**示例列表 5-4** – `BankApp`\
  \ 类\n\n**项目** – `ch05-bankapp-customization`\n\n**源位置** - `/src/main/java/sample/spring/chapter05/bankapp`\n\
  \n```java\npackage sample.spring.chapter05.bankapp;\n\npublic class BankApp {\n\n\
  \    public static void main(String args[]) throws Exception {\n        ApplicationContext\
  \ context = new ClassPathXmlApplicationContext(\n                \"classpath:META-INF/spring/applicationContext.xml\"\
  );\n        FixedDepositService FixedDepositService = context.getBean(FixedDepositService.class);\n\
  \        FixedDepositService.createFixedDeposit(new FixedDepositDetails(1, 1000,\n\
  \                12, \"someemail@somedomain.com\"));\n    }\n}\n```\n\n如果你现在执行 `BankApp`\
  \ 的主方法，你将在控制台上看到以下输出：\n\nFixedDepositDaoImpl's constructor invoked\nFixedDepositDaoImpl’s\
  \ initializeDbConnection method invoked\nFixedDepositServiceImpl's setMyFixedDepositDao\
  \ invoked\nFixedDepositDaoImpl’s createFixedDeposit method\n\n上面的输出显示 Spring 容器首先创建\
  \ `FixedDepositDaoImpl`，然后调用 `initializeDbConnection`。在方法调用之后，`FixedDepositDao`\
  \ 实例被注入到 `FixedDepositServiceImpl` 实例中。你可能注意到执行 `BankApp` 主方法的输出并不包含以下消息：*FixedDepositDaoImpl’s\
  \ releaseDbConnection method invoked*（参见示例列表 5-1）。这意味着 `FixedDepositDaoImpl` 持有的数据库连接从未被释放。在真实的应用场景中，让我们现在来看看如何通过调用清理方法来让\
  \ Spring 销毁单例作用域实例。\n\n### 让 Spring 调用由 destroy-method 指定清理方法\n\n`ApplicationContext`\
  \ 的 Web 版本由 Spring 的 `WebApplicationContext` 表示。`WebApplicationContext` 的实现包含了必要的逻辑，在\
  \ Web 应用关闭*之前*调用清理方法（由 `destroy-method` 指定）。\n\n**注意** 本节描述的让 Spring 销毁单例作用域实例的方法适用于独立应用程序。\n\
  \n接下来的示例显示了 `BankAppWithHook` 类（示例列表 5-4 中 `BankApp` 的修改版本），其主方法确保在方法退出时，调用注册到 Spring\
  \ 容器的单例作用域 bean 的清理方法（由 `<bean>` 元素的 `destroy-method` 属性指定）：\n\n**示例列表 5-5** – `BankAppWithHook`\
  \ 类 – 向 JVM 注册 钩子\n\n**项目** – `ch05-bankapp-customization`\n\n**源位置** - `/src/main/java/sample/spring/chapter05/bankapp`\n\
  \n```java\npackage sample.spring.chapter05.bankapp;\n\npublic class BankAppWithHook\
  \ {\n\n    public static void main(String args[]) throws Exception {\n        AbstractApplicationContext\
  \ context = new ClassPathXmlApplicationContext(\n                \"classpath:META-INF/spring/applicationContext.xml\"\
  );\n        context.registerShutdownHook();\n        FixedDepositService FixedDepositService\
  \ = context.getBean(FixedDepositService.class);\n        FixedDepositService.createFixedDeposit(new\
  \ FixedDepositDetails(1, 1000,\n                12, \"someemail@somedomain.com\"\
  ));\n    }\n}\n```\n\nSpring 的 `AbstractionApplicationContext` 类实现了 `ApplicationContext`\
  \ 接口，并定义了 `registerShutdownHook` 方法，用于向 JVM 注册钩子。该钩子负责在 JVM 关闭时关闭 `ApplicationContext`。在上面的示例列表中，你会注意到\
  \ `ClassPathXmlApplicationContext` 实例被赋值为 `AbstractionApplicationContext` 类型，并调用\
  \ `AbstractionApplicationContext` 的 `registerShutdownHook` 向 JVM 注册钩子。当 `BankAppWithHook`\
  \ 主方法退出时，钩子将销毁所有缓存的单例 bean 实例并关闭 `ApplicationContext` 实例。\n\n\n\n\n\n如果你执行 `ch05-bankapp-customization`\
  \ 项目中 `BankAppWithHook` 的主方法，你将在控制台上看到以下输出：\n\nFixedDepositDaoImpl's constructor\
  \ invoked\n\nFixedDepositDaoImpl’s initializeDbConnection method invoked\n\nFixedDepositServiceImpl's\
  \ setMyFixedDepositDao method invoked\n\nFixedDepositDaoImpl's releaseDbConnection\
  \ method invoked\n\n控制台上的消息 `FixedDepositDaoImpl's releaseDbConnection method invoked`\
  \ 证实 `FixedDepositDaoImpl` 的 `releaseDbConnection` 方法（参考示例 5-1 中 `FixedDepositDaoImpl`\
  \ 的 `releaseDbConnection` 方法）被调用。正如你所见，在 JVM 中注册关闭钩子导致了单例作用域 bean `myFixedDepositDao`（对应\
  \ `FixedDepositDaoImpl` 类）的清理方法的调用。\n\n现在让我们关闭钩子对原型作用域（prototype-scoped）bean 的影响。\n\
  \n## 清理方法与原型作用域 bean\n\n对于原型作用域 bean，Spring 容器会忽略 `destroy-method` 属性。忽略 `destroy-method`\
  \ 属性是因为 Spring 容器期望从 `ApplicationContext` 获取原型作用域 bean 实例的对象负责显式调用该原型作用域 bean 实例的清理方法。\n\
  \n**注意** 原型作用域和单例作用域 bean 的生命周期相同，但 Spring 容器*不会*调用原型作用域 bean 实例的清理方法（由 `destroy-init`\
  \ 属性指定）。\n\n现在让我们如何为应用程序上下文 XML 文件中包含的所有 bean 指定默认初始化和销方法。\n\n## 为所有 bean 指定默认初始化和销方法\n\
  \n你可以使用 `<beans>` 元素的 `default-init-method` 和 `default-destroy-method` 属性来指定 bean\
  \ 的默认初始化和销方法，如下例所示：\n\n**示例 5-6** – `default-init-method` 和 `default-destroy-method`\
  \ 属性\n\n```\n<beans ..... default-init-method=\"initialize\" default-destroy-method=\"\
  release\">\n    <bean id=\"A\" class=\".....\" init-method=\"initializeService\"\
  \ />\n    <bean id=\"B\" class=\".....\" />\n</beans>\n```\n\n如果多个 bean 定义了同名的初始化或清理方法，那么使用\
  \ `default-init-method` 和 `default-destroy-method` 属性是有意义的。通过指定 `init-method` 和\
  \ `destroy-method` 属性，`<bean>` 元素可以覆盖 `<beans>` 元素 `default-init-method` 和 `default-destroy-method`\
  \ 属性指定的值。例如，在上面的示例中，bean `A` 指定的 `init-method` 属性值为 `initializeService`，这意味着 `initializeService`\
  \ 方法（而不是 `<beans>` 元素 `default-init-method` 属性指定的 `initialize` 方法）是 bean `A` 的初始化方法。\n\
  \n与其使用 `<bean>` 元素的 `init-method` 和 `destroy-method` 属性来指定自定义初始化和销方法，你可以使用 Spring\
  \ 的 `InitializingBean` 和 `DisposableBean` 生命周期接口。\n\n## InitializingBean 和 DisposableBean\
  \ 生命周期接口\n\n实现生命接口（如 `ApplicationContextAware`（见第 4 章 4-5 节）、`InitializingBean`\
  \ 和 `DisposableBean`）的 bean 会接收 Spring 容器的回调，让 bean 实例有机会执行某些操作或为 bean 实例提供某些信息。例如，如果\
  \ bean 实现了 `ApplicationContextAware` 接口，容器会调用 bean 实例的 `setApplicationContext` 方法，为\
  \ bean 提供其部署所在的 `ApplicationContext` 引用。\n\n`InitializingBean` 接口定义了 `afterPropertiesSet`\
  \ 方法，该方法在 bean 属性设置后由 Spring 容器调用。bean 在 `afterPropertiesSet` 方法中执行初始化工作，如获取数据库连接、打开文件进行读取等。`DisposableBean`\
  \ 接口定义了 `destroy` 方法，该方法在 bean 实例销毁时由 Spring 容器调用。\n\n**注意** 与 `ApplicationContextAware`\
  \ 生命周期接口一样，bean 应避免实现 `InitializingBean` 和 `DisposableBean` 接口，因为会导致应用程序代码与 Spring\
  \ 耦合。\n\n现在让我们通过 JSR 250 的 `@PostConstruct` 和 `@PreDestroy` 注解来指定 bean 初始化和销方法。\n\
  \n### JSR 250 的 @PostConstruct 和 @PreDestroy 注解\n\nJSR 250（Java 平台通用注解）定义了跨不同 Java\
  \ 技术的标准注解。JSR 250 的 `@PostConstruct` 和 `@PreDestroy` 注解识别对象的初始化和销方法。Spring 中的 bean\
  \ 类可以通过使用 `@PostConstruct` 注解将某个方法设置为初始化方法，通过使用 `@PreDestroy` 注解将某个方法设置为销方法。\n\n\
  **注意** 更多详情请参考 JSR 250 首页 ([`jcp.org/en/jsr/detail?id=250`](http://jcp.org/en/jsr/detail?id=250))）。\n\
  \n**导入** **第 5 章/ch05-bankapp-jsr250**（该项目展示了 MyBank 应用，它使用 JSR 250 的 `@PostConstruct`\
  \ 和 `@PreDestroy` 注解分别识别自定义初始化和销方法。要测试初始化方法是否执行，请执行该项目中 `BankApp` 类的主方法。要测试销方法是否执行，请执行该项目中\
  \ `BankAppWithHook` 类的主方法。）\n\n以下示例显示 `ch05-bankapp-jsr250` 项目中使用 `@PostConstruct`\
  \ 和 `@PreDestroy` 注解的 `FixedDepositDaoImpl` 类：\n\n**示例 5-7** – `FixedDepositDaoImpl`\
  \ 类 - `@PostConstruct` 和 `@PreDestroy` 注解\n\n**项目** – `ch05-bankapp-jsr250`\n**源位置**\
  \ - `src/main/java/sample/chapter05/bankapp/dao`\n\n```java\npackage sample.spring.chapter05.bankapp.dao;\n\
  \nimport javax.annotation.PostConstruct;\nimport javax.annotation.PreDestroy;\n\n\
  public class FixedDepositDaoImpl implements FixedDepositDao {\n    private DatabaseConnection\
  \ connection;\n    .....\n    @PostConstruct\n    public void initializeDbConnection()\
  \ {\n        logger.info(\"FixedDepositDaoImpl initializeDbConnection method invoked\"\
  );\n        connection = DatabaseConnection.getInstance();\n    }\n\n    .....\n\
  \    @PreDestroy\n    public void releaseDbConnection() {\n        logger.info(\"\
  FixedDepositDaoImpl's releaseDbConnection method invoked\");\n        connection.releaseConnection();\n\
  \    }\n}\n```\n\n在上面的示例中，`FixedDepositDaoImpl` 类使用 `@PostConstruct` 和 `@PreDestroy`\
  \ 来识别初始化和销方法。你应该注意 `@PostConstruct` 和 `@PreDestroy` 注解并不是 Spring 特有的。\n\n**注意**\
  \ Java 6 提供了 JSR 250 定义的注解；如果你使用的是 Java 6 或更高版本，不需要类路径中包含 JSR 250 JAR 包。如果你使用的是\
  \ Java 5，需要在类路径中包含 JSR 250 JAR 包及相关的 JAR 包。\n\n要在应用程序中使用 `@PostConstruct` 和 `@PreDestroy`\
  \ 注解，你需要在应用程序上下文 XML 文件配置 Spring 的 `CommonAnnotationBeanPostProcessor` 类，如下所示：\n\
  \n**示例 5-8** – `applicationContext.xml` – `CommonAnnotationBeanPostProcessor` 配置\n\
  \n**项目** – `ch05-bankapp-jsr250`\n**源位置** - `src/main/resources/META-INF/spring`\n\
  \n```xml\n<beans .....>\n    <bean id=\"FixedDepositService\" class=\"sample.spring.chapter05.bankapp.service.FixedDepositServiceImpl\"\
  >\n        <property name=\"myFixedDepositDao\" ref=\"myFixedDepositDao\" />\n \
  \   </bean>\n    <bean id=\"myFixedDepositDao\" class=\"sample.spring.chapter05.bankapp.dao.FixedDepositDaoImpl\"\
  \ />\n    <bean class=\"org.springframework.context.annotation.CommonAnnotationBeanPostProcessor\"\
  />\n</beans>\n```\n\n\n\n\n\n`CommonAnnotationBeanPostProcessor` 实现了 Spring 的 `BeanPostProcessor`\
  \ 接口（将在下一节介绍），负责处理 JSR 250 注解。\n\n如果你执行 `BankApp` 和 `BankAppWithHook` 类的主方法，你会发现\
  \ `FixedDepositDaoImpl` 类中带有 `@PostConstruct` 和 `@PreDestroy` 注解的方法分别在 `FixedDepositDaoImpl`\
  \ 实例的创建和销毁时执行。\n\n现在我们我们来看 Spring 的 `BeanPostProcessor` 接口，它允许你在 Spring 容器初始化新创建的\
  \ bean 实例**之前**（before）或**之后**与之交互。\n\n## 5-3 使用 BeanPostProcessor 与新创建的 bean 实例交互\n\
  \n`BeanPostProcessor` 用于在 Spring 容器调用其初始化方法（参见第 5-2 节）**之前**和/或**之后**与新创建的 bean\
  \ 实例交互。你可以使用 `BeanPostProcessor` 在 Spring 容器调用 bean 初始化方法**之前**和/或**之后执行自定义逻辑。\n\
  \n**注意** 实现了 Spring `BeanPostProcessor` 接口的 bean 是一种特殊的 bean 类型；Spring 容器会自动检测并执行\
  \ `BeanPostProcessor` bean。\n\n`BeanPostProcessor` 接口定义了以下方法：\n\n- `Object postProcessBeforeInitialization(Object\
  \ bean, String beanName)` – 该方法在 bean 实例的初始化方法被调用**之前**执行\n- `Object postProcessAfterInitialization(Object\
  \ bean, String beanName)` – 该方法在 bean 实例的初始化方法被调用**之后**执行\n\n`BeanPostProcessor`\
  \ 方法接受新创建的 bean 实例及其名称作为参数，并返回相同或修改后的 bean 实例。例如，如果你在应用上下文 XML 文件中将 `FixedDepositDaoImpl`\
  \ 类配置为 id 为 `myFixedDepositDao` 的 bean（参见示例列表 5-8），`BeanPostProcessor` 的方法将接收 `FixedDepositDaoImpl`\
  \ 类的实例和字符串值 `myFixedDepositDao` 作为参数。`BeanPostProcessor` 的方法可能会原样返回原始 bean 实例，可能会修改该\
  \ bean 实例，可能会返回一个包装了原始 bean 实例的对象。\n\n你可以像配置其他 Spring bean 一样在应用上下文 XML 文件中配置 `BeanPostProcessor`\
  \ 实现。Spring 容器会自动检测实现 `BeanPostProcessor` 接口的 bean，并在创建应用上下文 XML 文件中定义的任何其他 bean\
  \ 实例之前之前创建它们的实例。一旦 `BeanPostProcessor` beans 被创建，Spring 容器将为由其创建的每个 bean 实例调用每个\
  \ `BeanPostProcessor` 的 `postProcessBeforeInitialization` 和 `postProcessAfterInitialization`\
  \ 方法。\n\n假设你在应用上下文 XML 文件定义了一个单例作用域的 bean `ABean` 和一个 `BeanPostProcessor` bean `MyBeanPostProcessor`。图\
  \ 5-1 显示了一个序列图，描述了 Spring 容器调用 `MyBeanPostProcessor` 方法的顺序。\n\n序列图中的 `init` 方法调用表示对\
  \ bean 初始化方法的调用。序列图显示 `MyBeanPostProcessor` 实例在 `ABean` bean 实例之前创建。由于 `BeanPostProcessor`\
  \ 实现像其他 bean 一样配置，如果 `MyBeanPostProcessor` 定义了初始化方法，容器就会调用 `MyBeanPostProcessor`\
  \ 实例的初始化方法。在 `ABean` 实例创建后，Spring 容器将调用 `ABean` 实例的 setter 方法以满足其依赖，并为 bean 实例提供所需的配置信息。在属性设置之后、`ABean`\
  \ 初始化方法被调用**之前**，Spring 容器会调用 `MyBeanPostProcessor` 的 `postProcessBeforeInitialization`\
  \ 方法。在 `ABean` 初始化方法被调用之后，Spring 容器调用 `MyBeanPostProcessor` 的 `postProcessAfterInitialization`\
  \ 方法。\n\n![](img/00026.jpeg)\n\n**图 5-1** –**Spring 容器在 `ABean` 初始化方法调用的之前和之后调用\
  \ `MyBeanPostProcessor` 的方法**\n\n只有在调用了 `postProcessAfterInitialization` 方法后，bean\
  \ 实例才被 Spring 容器认为已完全初始化。例如，如果 `BBean` 依赖于 `ABean`，只有在对 `ABean` 和 `BBean` 实例都调用了\
  \ `MyBeanPostProcessor` 的 `postProcessAfterInitialization` 后，容器才会将 `ABean` 实例注入到\
  \ `BBean`。\n\n你应该注意，如果 `BeanPostProcessor` bean 的定义指定应懒性创建（参见第 2 章 2-5 节中 `<bean>`\
  \ 元素的 `lazy-init` 属性或 `<beans>` 元素的 `default-lazy-init` 属性），Spring 容器将忽略懒性初始化配置，并在创建应用上下文\
  \ XML 文件中定义的单例作用域 bean 实例之前创建 `BeanPostProcessor` bean 实例。你应该注意，实现 `BeanFactoryPostProcessor`\
  \ 接口的 bean（在第 5-4 节中解释）是在实现 `BeanPostProcessor` 接口的 bean 之前创建的。\n\n现在让我们可以使用 Spring\
  \ `BeanPostProcessor` 的一些示例场景。\n\n**导入 chapter 5/ch05-bankapp-beanpostprocessor**（此项目展示了使用\
  \ `BeanPostProcessor`来实现验证 bean 实例并解析 bean 依赖的 `MyBank` 应用。要验证 `BeanPostProcessor`\
  \ 实现运行正常，请执行该项目中 `BankApp` 类的主方法。）\n\n### BeanPostProcessor 示例 – 验证 bean 实例\n\n\
  在 Spring 应用中，你可能希望在 bean 实例注入或被其他对象访问之前验证其配置是否正确。让我们看看如何使用 `BeanPostProcessor` 实现为每个\
  \ bean 实例提供验证配置的机会。以下示例列表显示了 `MyBank` 的 `InstanceValidator` 接口，我们希望使用 `BeanPostProcessor`\
  \ 验证的 bean 需要实现该接口：\n\n**示例列表 5-9** – `InstanceValidator` 接口\n**项目** – `ch05-bankapp-beanpostprocessor`\n\
  **源文件** – `src/main/java/sample/chapter05/bankapp/common`\n\n```java\npackage sample.chapter05.bankapp.common;\n\
  \npublic interface InstanceValidator {\n    void validateInstance();\n}\n```\n\n\
  `InstanceValidator` 接口定义了 `validateInstance` 方法用于验证 bean 实例是否正确初始化。我们很快就会看到该方法由\
  \ `BeanPostProcessor` 实现调用。以下示例列表了实现了 `InstanceValidator` 接口的 `FixedDepositDaoImpl`\
  \ 类：\n\n**示例列表 5-10** – `FixedDepositDaoImpl` 类\n**项目** – `ch05-bankapp-beanpostprocessor`\n\
  **源文件** – `src/main/java/sample/chapter05/bankapp/dao`\n\n```java\npackage sample.chapter05.bankapp.dao;\n\
  \nimport org.apache.log4j.Logger;\nimport sample.chapter05.bankapp.common.InstanceValidator;\n\
  \npublic class FixedDepositDaoImpl implements FixedDepositDao, InstanceValidator\
  \ {\n    private static Logger logger = Logger.getLogger(FixedDepositDaoImpl.class);\n\
  \    private DatabaseConnection connection;\n\n    public FixedDepositDaoImpl()\
  \ {\n        logger.info(\"FixedDepositDaoImpl's constructor invoked\");\n    }\n\
  \n    public void initializeDbConnection() {\n        logger.info(\"FixedDepositDaoImplís\
  \ initializeDbConnection method invoked\");\n        connection = DatabaseConnection.getInstance();\n\
  \    }\n\n    @Override\n    public void validateInstance() {\n        logger.info(\"\
  Validating FixedDepositDaoImpl instance\");\n        if(connection == null) {\n\
  ```\n\n\n\n\n```java\nlogger.error(\"Failed to obtain DatabaseConnection instance\"\
  );\n}\n}\n```\n\n在上面的示例列表中，`initializeDbConnection` 方法是初始化方法，它通过调用 `DatabaseConnection`\
  \ 类的静态方法 `getInstance` 来获取 `DatabaseConnection` 实例。如果 `FixedDepositDaoImpl` 实例未能获取\
  \ `DatabaseConnection` 实例，则 `connection` 属性为 null。如果 `connection` 属性为 null，`validateInstance`\
  \ 方法将记录错误消息，指示 `FixedDepositDaoImpl` 实例未被正确初始化。由于 `initializeDbConnection` 初始化方法设置了\
  \ `connection` 属性的值，`validateInstance` 方法*必须*在 `initializeDbConnection` 方法*之后*调用。在真实的应用程序开发场景中，如果\
  \ bean 实例配置错误，`validateInstance` 方法可能会采取某些纠正措施或抛出运行时异常以停止应用程序启动。为了简单起见，如果 bean 实例配置错误，`validateInstance`\
  \ 方法会记录错误消息。\n\n接下来的示例显示了 `InstanceValidationBeanPostProcessor` 类，它实现了 Spring 的\
  \ `BeanPostProcessor` 接口，并负责调用新创建 bean 的 `validateInstance` 方法：\n\n**示例列表 5-11**\
  \ – `InstanceValidationBeanPostProcessor` 类\n\n**项目** – `ch05-bankapp-beanpostprocessor`\n\
  \n**源位置** - `src/main/java/sample/spring/chapter05/bankapp/postprocessor`\n\n```java\n\
  package sample.spring.chapter05.bankapp.postprocessor;\n\nimport org.springframework.beans.BeansException;\n\
  import org.springframework.beans.factory.config.BeanPostProcessor;\nimport org.springframework.core.Ordered;\n\
  \npublic class InstanceValidationBeanPostProcessor implements BeanPostProcessor,\
  \ Ordered {\n\n    private static Logger logger = Logger.getLogger(InstanceValidationBeanPostProcessor.class);\n\
  \    private int order;\n\n    public InstanceValidationBeanPostProcessor() {\n\
  \        logger.info(\"Created InstanceValidationBeanPostProcessor instance\");\n\
  \    }\n\n    @Override\n    public Object postProcessBeforeInitialization(Object\
  \ bean, String beanName) throws BeansException {\n        logger.info(\"postProcessBeforeInitialization\
  \ method invoked\");\n        return bean;\n    }\n\n    @Override\n    public Object\
  \ postProcessAfterInitialization(Object bean, String beanName) throws BeansException\
  \ {\n        logger.info(\"postProcessAfterInitialization method invoked\");\n \
  \       if (bean instanceof InstanceValidator) {\n            ((InstanceValidator)\
  \ bean).validateInstance();\n        }\n        return bean;\n    }\n\n    public\
  \ void setOrder(int order) {\n        this.order = order;\n    }\n\n    @Override\n\
  \    public int getOrder() {\n        return order;\n    }\n}\n```\n\n上面的示例列表显示\
  \ `InstanceValidationBeanPostProcessor` 类实现了 Spring 的 `BeanPostProcessor` 和 `Ordered`\
  \ 接口。`postProcessBeforeInitialization` 方法简单地返回传递给方法的 bean 实例。在 `postProcessAfterInitialization`\
  \ 方法中，如果发现 bean 实例的类型为 `InstanceValidator`，则会调用 bean 实例的 `validateInstance` 方法。这意味着如果一个\
  \ bean 实现了 `InstanceValidator` 接口，`InstanceValidationBeanPostProcessor`将在 Spring\
  \ 容器调用 bean 实例的初始化方法*之后*调用该 bean 实例的 `validateInstance` 方法。\n\n`Ordered` 接口定义了一个返回整数值的\
  \ `getOrder` 方法。`getOrder` 方法返回的整数值决定了 `BeanPostProcessor` 实现相对于 `BeanPostProcessor`\
  \ 在应用上下文 XML 文件配置的其他 `BeanPostProcessor` 实现的优先级。order 值*较高*的 `BeanPostProcessor`\
  \ 被认为具有*较低*的优先级，并在 order 值*较低*的 `BeanPostProcessor` 实现执行后执行。由于我们希望将 `getOrder` 方法返回的整数值配置为\
  \ bean 属性，因此在 `InstanceValidationBeanPostProcessor` 类中定义了 `setOrder` 方法和 `order`\
  \ 实例变量。\n\n接下来的示例显示了 `InstanceValidationBeanPostProcessor` 类的 bean 定义：\n\n**示例列表\
  \ 5-12** – `InstanceValidationBeanPostProcessor` bean 定义\n\n**项目** – `ch05-bankapp-beanpostprocessor`\n\
  \n**源位置** - `src/main/resources/META-INF/spring`\n\n```xml\n<bean class=\"…...bankapp.postprocessor.InstanceValidationBeanPostProcessor\"\
  >\n    <property name=\"order\" value=\"1\" />\n</bean>\n```\n\n在上面的 bean 定义中，`<bean>`\
  \ 元素的 `id` 属性*没有*指定，因为我们通常不希望 `InstanceValidationBeanPostProcessor` 成为任何其他 bean\
  \ 的依赖。`<property>` 元素将 `order` 属性的值设为 1。\n\n现在来看一个用于解析 bean 依赖的 `BeanPostProcessor`\
  \ 实现。\n\n### BeanPostProcessor 示例 – 解析 bean 依赖\n\n在第 4 章中，我们看到如果 bean 实现了 Spring\
  \ 的 `ApplicationContextAware` 接口，它可以使用 `ApplicationContext` 的 `getBean` 方法编程地获取\
  \ bean 实例。实现 `ApplicationContextAware` 接口会将应用程序代码与 Spring 耦合，因此不建议实现 `ApplicationContextAware`\
  \ 接口。在本节中，我们将查看一个 `BeanPostProcessor` 实现，它为 bean 提供一个封装了 `ApplicationContext` 实例的对象，使得应用程序代码*不直接依赖于\
  \ Spring 的 `ApplicationContextAware` 和 `ApplicationContext` 接口。\n\n接下来的示例显示了 `MyBank’s\
  \ DependencyResolver` 接口，该接口由这些 bean 实现，这些 想要从 `ApplicationContext` 编程地检索它们的依赖：\n\
  \n**示例列表 5-13** – `DependencyResolver` 接口\n\n**项目** – `ch05-bankapp-beanpostprocessor`\n\
  \n**源位置** - `src/main/java/sample/spring/chapter05/bankapp/common`\n\n```java\n\
  package sample.spring.chapter05.bankapp.common;\n\npublic interface DependencyResolver\
  \ {\n    void resolveDependency(MyApplicationContext context);\n}\n```\n\n`DependencyResolver`\
  \ 定义了一个接收 `MyApplicationContext` 对象的方法，该对象是对 `ApplicationContext` 对象的封装。我们很快就会看到\
  \ `resolveDependency` 方法将被一个 `BeanPostProcessor` 实现调用。\n\n接下来的示例显示了实现 `DependencyResolver`\
  \ 接口的 `FixedDepositServiceImpl` 类：\n\n**示例列表 5-14** – `FixedDepositServiceImpl`\
  \ 类\n\n**项目** – `ch05-bankapp-beanpostprocessor`\n\n**源位置** - `src/main/java/sample/spring/chapter05/bankapp/service`\n\
  \n```java\npackage sample.spring.chapter05.bankapp.service;\n\nimport sample.spring.chapter05.bankapp.common.DependencyResolver;\n\
  import sample.spring.chapter05.bankapp.common.MyApplicationContext;\n\npublic class\
  \ FixedDepositServiceImpl implements FixedDepositService, DependencyResolver {\n\
  \n    private FixedDepositDao fixedDepositDao;\n    .....\n\n    @Override\n   \
  \ public void resolveDependency(MyApplicationContext context) {\n        fixedDepositDao\
  \ = context.getBean(FixedDepositDao.class);\n    }\n}\n```\n\n`FixedDepositServiceImpl`\
  \ 类定义了一个类型为 `FixedDepositDao` 的 `fixedDepositDao` 属性。`resolveDependency` 方法负责从 `MyApplicationContext`（Spring\
  \ `ApplicationContext` 对象的封装）获取 `FixedDepositDao` 实例并将其赋值给 `fixedDepositDao` 属性。\n\
  \n下面的示例显示 `DependencyResolutionBeanPostProcessor` 类对实现了 `DependencyResolver` 接口的\
  \ bean 调用 `resolveDependency` 方法：\n\n**示例列表 5-15** – `DependencyResolutionBeanPostProcessor`\
  \ 类\n\n**项目** – `ch05-bankapp-beanpostprocessor`\n\n\n\n\n\n# 源位置 - /src/main/java/sample/spring/chapter05/bankapp/postprocessor\n\
  \n```java\npackage sample.spring.chapter05.bankapp.postprocessor;\n\nimport org.springframework.beans.factory.config.BeanPostProcessor;\n\
  import org.springframework.core.Ordered;\nimport sample.spring.chapter05.bankapp.common.MyApplicationContext;\n\
  \npublic class DependencyResolutionBeanPostProcessor implements BeanPostProcessor,\
  \ Ordered {\n\n    private MyApplicationContext myApplicationContext;\n    private\
  \ int order;\n\n    public void setMyApplicationContext(MyApplicationContext myApplicationContext)\
  \ {\n        this.myApplicationContext = myApplicationContext;\n    }\n\n    public\
  \ void setOrder(int order) {\n        this.order = order;\n    }\n\n    @Override\n\
  \    public int getOrder() {\n        return order;\n    }\n\n    @Override\n  \
  \  public Object postProcessBeforeInitialization(Object bean, String beanName) throws\
  \ BeansException {\n        if (bean instanceof DependencyResolver) {\n        \
  \    ((DependencyResolver) bean).resolveDependency(myApplicationContext);\n    \
  \    }\n        return bean;\n    }\n\n    @Override\n    public Object postProcessAfterInitialization(Object\
  \ bean, String beanName) throws BeansException {\n        return bean;\n    }\n\
  }\n```\n\n`DependencyResolutionBeanPostProcessor` 类实现了 Spring 的 `BeanPostProcessor`\
  \ 和 `Ordered` 接口。`myApplicationContext` 属性（类型为 `MyApplicationContext`）代表 `DependencyResolutionBeanPostProcessor`\
  \ 的一个依赖。`postProcessBeforeInitialization` 方法会对实现 `DependencyResolver` 接口的 bean 实例调用\
  \ `resolveDependency` 方法，并将 `MyApplicationContext` 对象作为参数传递。`postProcessAfterInitialization`\
  \ 方法简单地返回传递给方法的 bean 实例。\n\n下面的示例显示了 `MyApplicationContext` 类，它是 Spring `ApplicationContext`\
  \ 对象的包装器：\n\n**示例列表 5-16** – `MyApplicationContext` 类\n\n**项目** – `ch05-bankapp-beanpostprocessor`\n\
  \n**位置** - `/src/main/java/sample/spring/chapter05/bankapp/common`\n\n```java\n\
  package sample.spring.chapter05.bankapp.common;\n\nimport org.springframework.context.ApplicationContext;\n\
  import org.springframework.context.ApplicationContextAware;\n\npublic class MyApplicationContext\
  \ implements ApplicationContextAware {\n\n    private ApplicationContext applicationContext;\n\
  \n    @Override\n    public void setApplicationContext(ApplicationContext applicationContext)\
  \ throws BeansException {\n        this.applicationContext = applicationContext;\n\
  \    }\n\n    public <T> T getBean(Class<T> klass) {\n        return applicationContext.getBean(klass);\n\
  \    }\n}\n```\n\n`MyApplicationContext` 类实现了 Spring 的 `ApplicationContextAware`\
  \ 接口，以获取部署 bean 的 `ApplicationContext` 对象的引用。`MyApplicationContext` 类定义了 `getBean`\
  \ 方法，从 `ApplicationContext` 实例返回给定名称的 bean 实例。\n\n下面的示例列表显示了 `DependencyResolutionBeanPostProcessor`\
  \ 和 `MyApplicationContext` 类的 bean 定义：\n\n**示例列表 5-17** – `applicationContext.xml`\n\
  \n**项目** – `ch05-bankapp-beanpostprocessor`\n\n**源位置** - `/src/main/resources/META-INF/spring`\n\
  \n```xml\n<bean class=\".....postprocessor.DependencyResolutionBeanPostProcessor\"\
  >\n    <property name=\"myApplicationContext\" ref=\"myApplicationContext\" />\n\
  \    <property name=\"order\" value=\"0\" />\n</bean>\n<bean id=\"myApplicationContext\"\
  \ class=\".....bankapp.common.MyApplicationContext\" />\n```\n\n`DependencyResolutionBeanPostProcessor`\
  \ 类的 bean 定义显示其 `order` 属性值被设置为 0。示例列表 5-12 显示 `InstanceValidationBeanPostProcessor`\
  \ 的 `order` 属性值为 1。由于*较低*的 `order` 属性值意味着*更高*的优先级，Spring 容器会对 bean 实例应用 `DependencyResolutionBeanPostProcessor`，然后是\
  \ `InstanceValidationBeanPostProcessor`。\n\n下面的示例列表显示了 `BankApp` 类，该类用于了 `DependencyResolutionBeanPostProcessor`\
  \ 和 `InstanceValidationBeanPostProcessor` 的功能：\n\n**示例列表 5-18** – `BankApp` 类\n\n\
  **项目** – `bankapp-beanpostprocessor`\n\n**位置** - `/src/main/java/sample/spring/chapter05/bankapp`\n\
  \n```java\npackage sample.spring.chapter05.bankapp;\n\npublic class BankApp {\n\
