    # # Presenting and Estimation


    The team has been working with scrum for several sprints, and is just done with
    sprint ten. At the end of sprint''s demo, there are several stories that have
    been completed. The shared electronic scrum board the team relies on to keep track
    of their progress looks something like this:'
  - '[PAGE 135]


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_135_0.png)


    There are two stories still in progress, and one that has been completed but not
    yet approved by QA before the demo. All the other stories from that sprint have
    been accepted at the demo, and are now done. The team has completed eleven points
    during sprint 10.


    In preparation for the planning meeting to kick off the next sprint, the product
    owner works out the copy changes that will be needed for the puppy story, and
    creates a document in a shared repository where the design assets will all live.


    After explaining the background of the new story to the team at the sprint planning
    ritual, the product owner reads the full story out to everybody, and asks for
    feedback.


    One of the first questions from the engineers is the puppies can be integrated
    into the existing site, instead of being separated out. Another engineer answers
    before the product owner has a chance, pointing out that integrating a different
    type of animal would make managing the data much more complicated.


    "But won''t the customers be confused when they come to a kitten site and get
    taken to a page without any kittens?" the first engineer asks.'
  - '[PAGE 136]


    "It''ll be just as confusing if they get kittens and puppies on a site that''s
    clearly just about kittens," the second engineer replies. "Besides, the whole
    navigation is built around kittens, including the URL scheme and the API."


    "Yeah, what about the URLs?" the first engineer asks the product owner. "Everything
    about our site is about kittens."


    "We''ll have to handle that with messaging," the product owner says. "This is
    a limited test, and people who opt in will do so intentionally, understanding
    that this is a beta."


    "Are all those edge cases handled in the copy?" the first engineer asks.


    "Yes, I have messaging written for all those conditions, and I plan to make myself
    very available to the team in things come while working, so we can address them
    without interrupting progress."


    At that point, the scrum master asks, "OK, everybody know enough about the story
    that they feel comfortable estimating it?"


    There is a moment or two of silence the engineers look around at each other, and
    then the first engineer who had spoken before says, "I think we need a little
    more clarity on the scope of this."


    # Defining Scope


    "So is this going to affect the experience of the rest of the site?" the first
    engineer asks. "I see that the user who''s chosen to see puppies will only see
    puppies on this particular page, but what about the rest of the site?"


    "The scope of the changes will be limited to the pages being changed," the product
    owner explains. "That means the users might experience a visual disconnect when
    they leave these pages and navigate to other parts of the site, such as the billing
    and confirmation pages. After all, we''ve got a lot of kittens and kitten-related
    themes running through all the pages. It''s out of scope to make broader changes
    to the entire site for this test"


    "Is there something else we can do?" another engineer asks. "We have the alert
    only on these pages. Can we have them on on the rest of the site as well?"'
  - '[PAGE 137]


    # The Lifecycle of a Story 117


    I’m worried about making changes that will affect people not involved in the test,"
    the product owner says. "I don''t want to make this any bigger than it has to
    be, and I certainly don''t want to put the stability of the site as a whole in
    danger.


    I don''t think it would be hard," the engineer goes on. "We already have the ability
    to turn on an alert that can be shown on every page of the site. Remember, we
    did that during the last holiday promotion."


    Can we make sure this will be limited to the people who opted in?" the product
    owner asks.


    Sure, that won''t be a problem," the engineer replies. "In fact, we could even
