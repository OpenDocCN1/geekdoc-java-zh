    ## Scrum 合约基础 101


    在 Scrum 团队中承担某个角色，意味着愿意在 Scrum 仪式（rituals）期间出现问题时，与同事以平等的身份交流。任何参与 Scrum 的人都应该自由地分享他们对项目和流程的意见，即使这些意见违背主流观点，或挑战了组织层级中职位较高人士的权威。当冲突发生时，Scrum
    Master（敏捷教练）有责任协助调解并促进对话。


    从更根本上说，参与 Scrum 意味着愿意成为团队的一部分。Scrum 的角色和仪式设立旨在让每个人都有机会、也有义务参与其中。团队中不分享意见和想法的成员会令团队其他成员感到失落。作为
    Scrum 团队的成员，无论你在公司中的职位如何，你的目标都是为了帮助支持每个人的流程。由于小组规模较小且亲密，且参与规则定义得明确，Scrum 为内向的人提供了一个尝试表达自我的安全空间。


    由于典型的公司会议与 Scrum 仪式之间存在区别，人们有时可能会对预期的行为方式感到有些困惑。当此类问题出现时，Scrum Master 应该是最终的裁决者。每个团队都需要自行定义什么是最有用的行为标准，并对其进行适当执行。


    最终，这归结为对同事、对流程以及对你在流程中所处的尊重。如果你有疑问，或者你认为某些事情不起作用，总有机会在回顾会议（retrospective）上提出这些问题。不要错过积极参与的机会。


    ## 提供透明度


    为了让 Scrum 高效运行，团队中的每个人在流程的各个阶段让其他人知道自己正在做什么。有些人称之为透明度。它让每个人都知道别人在做什么，以便每个人都能对项目状态有更清晰的感知，并知道自己如何提供帮助。


    透明度有许多用途。Scrum 的价值在于，它让关于项目状态的大量信息对公司任何人可见，这样负责项目的人就不会被中断。通过为团队预留一段非常短且定义明确的时间每天相互更新信息，Scrum
    避免了每位工程师都可能面临那些只想知道他们在做什么的人所带来的干扰。


    透明度还允许工程团队之外的人员跟踪对他们可能特别重要的问题状态。Scrum 定义冲刺（sprints）的方式使其不会被新的用户故事（stories）中断，但客户以及组织周围的其他人员经常会有想要引入的内容，并且他们可能认为这些变更是紧急的。Scrum
    的透明度让他们一眼就能看出团队正在忙什么，以及为什么你对这些事项进行了优先排序。


    Scrum 支持的透明度并不是为了微观管理。Scrum 的优势之一是为团队成员创造尽可能多的不受管理的时间，让他们自我管理。Scrum 提供了每日站会（daily
    standups）作为透明度的触点，以便工程师可以在向团队更新状态时分享有价值的见解，并在干扰最少的情况下开展工作。


    Scrum 假设参与流程的每个人从一开始就做出了在团队工作的自觉选择。在团队中共同工作意味着每个人都知道你在做什么，并愿意分享信息和资源。Scrum 在此类项目的
    Web 和移动端开发中运行良好的原因之一是，朝着共同目标共同努力，比孤立个人并在事后尝试协调他们的产出要高效高效得多。


    ## 建立工作边界


    信任是 Scrum 的很大组成部分，延伸之，这也是任何类型团队环境工作的很大组成部分。我们都相互依赖来履行义务并支持团队流程。


    人类天生好奇好奇。每当对别人在做什么感到困惑时，往往会有提问和探索的倾向。每个人对别人的所作都有意见，这就是团队共同工作的本质。这种好奇心是健康的。


    然而，记住人们需要空间按照他们认为的方式开展工作是非常重要的。在小组中拥有角色意味着允许他人也拥有他们的角色。当涉及到 Web 和移动端开发的 Scrum
    时，这意味着工程师能够以一种不受中断的方式，处理他们在冲刺期间内定要完成的故事。这是 Scrum 自主管理性质的一部分，只要保持生产力，它就允许高度程度的个人灵活性。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_123_0.png)


    > 每个人都需要尊重 Scrum 角色

    > 这种对 Scrum 角色的尊重需要超出团队的限制，甚至超出工程部门的限制，以为支持有效的 Scrum 流程提供所需的稳定性。管理层和 Scrum Master
    都有责任向公司其他人员传达 Scrum 的价值，这些人员可能对 Scrum 团队的预期产生影响，包括高层管理人员。


    在 Scrum 团队中，所有成员都被预期履行其角色的义务，他们相互依赖以做到这一点，以确保整个工作流程的进行。在流程可能出现崩溃的情况下，Scrum 提供了一个机会，让每个冲刺结束的回顾会议期间，团队中的任何人都可以质疑团队是如何协作工作的。


