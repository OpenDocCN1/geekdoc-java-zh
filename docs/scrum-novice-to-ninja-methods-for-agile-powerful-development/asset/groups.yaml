    ## 第一章


    ## Scrum 简介


    ### 什么是 Scrum？


    如果你拿起这本书是为了学习将 Scrum 应用于你的 Web 或移动端开发团队，你可能对 Scrum 和敏捷（agile）这些术语已经熟悉。也许你是从公司拿到这本书的，也许你被赋予了在组织内部实施敏捷流程的任务。无论原因如何，从相关术语的清晰、共享定义开始总是有用的。


    **Scrum** 是管理产品开发机构的多种技术之一，被归类在敏捷软件开发这一大类下。**敏捷**方法旨在支持迭代、灵活且持续的方法来运行产品工程组织。


    在各种敏捷技术中，Scrum 特别适用于开发网站和移动软件等产品的组织。它专注于开发凝聚力、模块化、可衡量的功能，这些功能可以进行相对估算、易于跟踪，并可能需要快速适应变化的市场状况，这使得
    Scrum 特别适用于这些类型的项目。


    ## Scrum：从新手到大师


    Scrum 鼓励团队在有限的时间内针对一组定义明确的功能进行专注工作，并理解下一组可能被要求工作的功能可能会由于市场变化、客户反馈或任何数量的因素而变得不可预测。Scrum
    允许团队根据之前开发的功能工作，提高其以相对方式估算产出新功能可能需要投入多少精力。Scrum 为团队创造了定期对流程进行反思和改进的机会，将每个人的反馈都考虑在内。


    > 不要将仅仅应用 Scrum 术语等同于真正执行 Scrum


    在试图掩盖自身流程问题的非敏捷组织中，一种常见的反模式是在其瀑布式技术和工具之上使用一套标记系统。这可能会导致混乱，甚至在那些错误地看到这些术语并误认为自己见过
    Scrum 运行的人群中产生负面影响。


    在我们阅读这本书的过程中，你将发现更多关于 Scrum 如何运作的知识。你将接触到 Scrum 的各个方面，包括它的仪式（rituals）、产出物（artifacts）以及它为组织中的人员创建的角色。我们将向你介绍一个在
    Scrum 环境工作的团队，并向你展示他们最初是如何采用 Scrum 的，以及他们是如何适应它的。


    在我们开始之前，花一点时间将 Scrum 置于历史背景中是值得的。Scrum 的出现恰恰当时 Web 开发在工程领域兴起，并随着移动技术成为我们生活的一部分而繁荣。如果你考虑
    Scrum 的工作原理、它的源于哪里以及我们如何应用它，我认为你会发现这可能有其原因。


    > Scrum 奇特的词汇


    Scrum 的词汇非常独特，听起来可能很奇怪。这是故意的。Scrum 使用了仪式（ritual）、产出物（artifact）和故事（story）等术语，以明确这些概念与其他项目管理方法中可能遇到的想法不同。


