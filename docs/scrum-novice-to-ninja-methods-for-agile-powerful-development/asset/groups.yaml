    # 166 Scrum：从新手到大师


    基于大局的决策，我做这行已经足够久了，清楚在处理工程师的时间时，这是一种昂贵的奢侈。


    Scrum 让我能够将工程组织视为一种可以用数字和统计数据来理解和追踪的资源，并为我提供了所需的信息，以便在不干扰他人的情况下了解组织中每个人正在工作的内容。最终，我需要将重点放在产出的工作上，而
    Scrum 为我提供了宝贵的洞察，让我了解团队将在保持公司实力壮大的所需的功能上投入多久时间。


    # 结论


    这些反馈反映了在解决 Scrum 团队过程中可能出现的问题。我们在这些许多评论中看到的观点之一是：解决方案源于与人的合作以及 Scrum 所提供的流程工作。Scrum
    不会解决组织中的所有问题，也不会解决与待完成工作的规划和估算之外的其他问题。


    Scrum 提供了必要的工具和技术，在每个冲刺（sprint）将问题暴露出来，并在这些问题变成标准操作规范之前进行处理。通过利用每个冲刺中的规划，以及通过回顾会议（retrospective）讨论问题并尝试解决办法的机会，团队可以不断提高其有效使用
    Scrum 的能力。


    也许 Scrum 最棒的一点在于，它创建了一个鼓励性的社区，这种社区基于对每个人正在做什么以及这一切如何相互结合的共同理解。在一个有效的 Scrum 团队中，成员们相互支持以维护流程，并解决可能损害
    Scrum 团队的实践。互相帮助对每个人都是有利的。


