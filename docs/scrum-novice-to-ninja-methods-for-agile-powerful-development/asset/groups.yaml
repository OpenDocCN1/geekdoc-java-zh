    and over again. If I didn''t believe in it, and I hadn''t seen how well it works,
    it would be much harder.


    # What I Do About It


    The bottom line is the quality of the product. Now that we''ve gone through several
    sprints, and I''ve seen ideas from the product backlog change as a result of data
    generated through the iterative process of scrum, I have examples to point to
    that demonstrate the value of this approach. I''m trying to build up more of these
    examples to help support the argument for scrum going forward.


    The ability to coordinate with external deadlines is going to get better over
    time, I can see that. The more we do that, the better the team gets at estimating
    how it''ll take to produce a particular feature. That''s the big win for us. When
    we can estimate more effectively, we''ll be in a better position to coordinate
    our scheduled delivery of features with the calendar. And unlike before, those
    dates will be a realistic indication of what the team is capable of, and not based
    on blind hope and brute force.


    # A Designer


    # Initial Concerns


    My biggest concern when I heard we were going to try scrum was the two-week sprint
    schedule we agreed to. The work I do doesn''t always fit into a two-week period,
    and it usually has to be completed before anybody else even get started. I didn''t
    want to be the reason the team was less agile, and I was very concerned about
    having enough time to do the work necessary to provide well-thought-out designs.


    At the same time, I wanted to make sure I could be available to the team to produce
    last-minute assets. I know there''s always a need for last-minute assets and quick
    decisions. Balancing against the quick turnaround time associated with scrum pretty
    intimidating.


    # What I''ve Learned


    At first I thought I was going to have to be part of the scrum team. The way we''re
    structured, my work sits outside the team, and I as a resource for them. I work'
  - '[PAGE 183]


    # Adapting to Scrum 163


    with the scrum master to make sure there''s always a queue of tasks for design
    waiting for me to work on. And Thanks to a kanban approach, I can put realistic
    limits on the number of projects that need to be worked on simultaneously.


    The product owner may switch priorities at any point on the items in that queue,
    so I anticipate what I''ll be working on, and lets me focus on the work at hand.
    The next thing I need to work on is a long-range design plan, and sometimes it''s
    generating assets or reviewing an implementation. It''s great to have the opportunity
    to do some out-of-the-box thinking one day, share my ideas with the product owner,
    and see the implementation show up in my queue next day. That almost never happened
    before we switched to this approach.


    I like to attend all the standups that I''m on top of what''s happening with the
    team, but I generally attend as an observer, not as team member. Sometimes I follow
    up with people after the standup to make sure the work is going according to the
    design plan. When I''m needed, I get the chance to roll up my sleeves and work
    side-by-side with the engineers to resolve some flow or refine the presentation
    of an interface. Otherwise, I''m able to focus on the work that''s in front of
    me, knowing that the scrum master will pull into discussions when required.


    # What Still Frustrates Me


    It never seems to me as if I get enough time to work on long-range planning. Some-times
    features that need to be developed are going to take longer than a sprint or two
    to design properly.


    It can also be a little unsettling having to shift gears without knowing for certain
    I''m going to be working on next. I need to be flexible about that so I can support
    the team and the product most effectively, but I miss being in total control of
    my day.


    # What I Do Do About It


    To be fair, my complaint about lack of long-range design planning isn''t any more
    of a problem now than it was before we started scrum. At least with scrum I get
    the opportunity to complain about it every time we have a retrospective. I to
    think this keeps the issue top of mind.'
  - '[PAGE 184]


    Since I''m not officially part of the team, I can work directly with the product
    owner on ideas that may be longer than what the team is working on. This gives
    me the opportunity to advance planning for design issues that may relate more
    to the product lifecycle than to the next released feature. The approach we''re
    following encourages me to focus my attention on reusable style patterns and guidelines,
    which can be more versatile than one-off implementation examples.


    I also take in lot of the data team generates from each iteration of the product.
    Part of our definition of done includes user acceptance testing, and we''re generating
    interesting statistics about what features the users are taking advantage of,
    and what doesn''t make any sense to them. That helps me focus my work in areas
    where I know can add the most value.


    # An Executive


    # Initial Concerns


    I trust the managers I hire. I brought in an engineering manager to make decisions
    about how to organize the team, and I try not to micromanage that sort of thing.
    Scrum talks about self-managed teams, and I like that idea in, in practice I''ve
    never seen it. On the other hand, it gets to overwhelming when managers have to
    go in and make decisions about every detail in the company. I learned that early
    on in my career, and even if it''s hard sometimes, it''s better to hand-off when
    it comes to the details of the job.


    From all the hype, scrum sounded a bit too good to be true. I''ve seen lots of
    buzzword management initiatives came and go. I was skeptical about the potential
    for scrum to make the team more flexible at the same time introducing all these
    formal processes. I wanted to make sure the engineering managers didn''t give
    the team enough rope to hang themselves. And frankly, I didn''t like the sound
    of adding all these meetings to the calendar.


    # What I''ve Learned


    The most surprising thing for me was that the extra meetings actually ended up
    taking the team away from work less than the meetings we used to. From what I
    hear, a lot gets decided in time, and it''s organized really. We''ve got a kick-ass
    scrum master. Our scrum process seems to run like clockwork. And my'
  - '[PAGE 185]


    # Adapting to Scrum 165


    engineering managers tell me there are fewer personal conflicts on the team, since
    everybody has a chance to raise issues and get them resolved every sprint.


    It''s also really great able to check the scrum board and know immediately what''s
    worked on, who''s doing the work, and where it stands. engineering used to be
    this black box that I couldn''t get a clear picture of without drawn explanations.
    And I do understand that nobody wants an executive looking over their shoulder,
    asking for lots of questions when they''re trying to do their job. But now I can
    get all the information I need just by looking at the board and asking the scrum
    master a few questions.


    # What Still Frustrates Me


    Looking at the overall picture, I''m getting to use the idea that scrum doesn''t
    add overhead, but it''s still something I''m adjusting to. We didn''t have a dedicated
    project manager before, and now the scrum master fills that role. I can see that
    things wouldn''t get done in the same way without somebody to run the process,
    and I''m impressed with what we''ve been able to achieve—though''m still keeping
    my eye on that bottom line.


    And to perfectly honest, the other thing about scrum that I still need to get
