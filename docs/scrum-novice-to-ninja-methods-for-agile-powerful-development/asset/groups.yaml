    # 138 Scrum 从新手到大师


    “我同意，”第二位工程师说，“但现在至少我们对哪里有些乱团有了数数，所以我们知道该关注哪里了。”


    “如果我当时能直接跳进去先修复那些东西，本会更简单的，”第三位工程师说，“我已经知道大部分问题在哪里了，但我们这种反道而行之做法仍然让我觉得很困扰。”


    “现在你不是唯一知道这些的人了，”第二位工程师指出。


    “是啊，但听起来我们可能也没有机会进行重构冲刺（refactoring sprint）了，”第三位工程师神色严地说。


    “在我听来也是这样的，”第四位工程师插道，“他们会坚持完成用户故事，以确保先完成 Beta 版本的设计更改。”


    “我们可能会有一些设计类故事来修复 Beta 版本的视觉效果，”Scrum 主管说，“但产品所有者同意，如果我们完成了故事，就会把重构作为首要任务留给我们时间，而我们确实完成了。我会在计划会议之前跟进这件事，以确保这一点。”


    “好吧，有一点，”第三位工程师说，“我想用细致的梳子仔细过一遍那些新设计，确保在估算它们之前它们确实是完美的。”


    “我们应该应该为下一次冲刺设定另一个目标吗？”Scrum 主管问。


    房间里的工程师们点了点头。在回顾会议结束时，他们列了一份想要改进流程的简短清单，以及几项需要 Scrum 主管向产品所有者跟进的任务。


    大家都能认同的两点是：跨越整个栈的工作虽然令人沮丧，但对于暴露代码中需要修复的问题非常有帮助；而且，下一次冲刺的优先级应该是解决这些问题。无论如何，进入下一次冲刺的计划会议将会是非常有趣的会议。


    # 总结


    我们从 Scrum 中中学到的点之一是，它无法给你一个你可能希望拥有的团队，但它可以帮助你优化现有的资源，并支持他们有效地协同工作。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_158_0.png)


    - 我们看到了团队是如何组织工作，并将一个大故事拆解为工程任务，以便进行并行开发的。

    - 我们看到团队在验收标准上遇到问题，并从产品所有者那里获得了关于如何在冲刺期间解决这些问题的反馈。

    - 我们看到了演示期间产生的妥协，以及这些妥协如何导致了对即将到来的冲刺预期的修订。

    - 然后我们听了团队在回顾会议中表达他们的顾虑，讨论了哪些做得很好，哪些可以做得更好，以及他们希望在下一次冲刺中看到什么。


    这一切中隐含了 Scrum 背后的协作、透明化和自我管理哲学。在下一章中，我们将讨论如何让 Scrum 为你的团队发挥作用。我们将讨论如何向组织引入 Scrum
    概念，支持 Scrum 需要的资源，以及如何处理学习应用 Scrum 时可能出现的某些反模式（anti-patterns）。


    # 第 9 章


    # 让 Scrum 在你的 Web 或移动团队中运作


    在本书的大部分内容中，我们都在讨论 Scrum 的实际操作。虽然 Scrum 的核心定义非常通用——支持广泛的应用——但我们针对 Web 和移动团队中适用的
    Scrum 机制，进行了相当有主见且详细的解释。（尽管如此，这些许多原则和实践同样适用于其他类型的开发工作。）


    既然我们已经有了通用的词汇和概念，在本章中，我们将讨论如何让一个团队开始使用 Scrum。我们将详细介绍在进行 Web 和移动开发中使用 Scrum 的论点。我们将讨论
    Scrum 最适合什么，它与替代方案相比如何如何，并为在公司中推广 Scrum 并应用它时出现的某些问题提供答案。


    # 向 Scrum 迈进


    我们已经学习了一些关于 Scrum 的知识，以及 Scrum 如何帮助你的 Web 和移动开发项目。下一个问题是如何让你的团队从零开始转向 Scrum。这对于每个团队来说都是不同的，你需要评估自己的情况，以确定组织对采用敏捷方法的准备就绪。


    # 认可（Buy-in）


    如果你的组织目前遵循类似于瀑布模型的流程，循环中每个阶段的人可能对他们目前的角色感到舒适，并且不会急于尝试新事物。你可能需要向他们展示，通过基于 Scrum
    的流程，组织可以变得多么高效和高产。


    执行人员可能担心他们对自我组织的团队控制权减少，并且对一个自己产生想法的流程投入较少。向他们指出，敏捷流程让他们有机会在每个冲刺中切换和调整优先顺序，从而更有效地适应市场，同时提供他们可以用来指导决策过程的宝贵反馈。


    工程经理可能对自己在自我管理的团队中扮演的角色感到困惑，但这种担忧源于对“自我管理”概念的语义上的误解。经理对于帮助团队分配资源、解决个人问题以及识别和留住人才仍然至关重要。经理还将自己的背景和知识带入整个开发过程。工程经理可以自由投入部分时间作为团队中的一名工程师从事一线工作，但他们的责任是确保团队在组织中的地位，确保他们拥有所需的工具和资源，并保护他们免受干扰。


    设计师可能会想他们如何融入 Scrum 流程，当他们的工作并不一定遵循同样的周期时。向他们展示 Scrum 为设计师提供了更大的影响力机会，因为设计师可以参与每一个阶段。


    工程师可能对角色的变化感到担忧，特别是他们已经擅长某一方面时。敏捷要求每位工程师在团队中承担更广泛的职责，但也开启了新的学习机会。通过对冲刺承诺提供的稳定性，以及确保在冲刺结束前不会更改需求，可能是存在问题的组织中强有力的卖点。


    采用敏捷不是单向的对话。Scrum 的推动者应该倾听，并从那些被要求改变方法的人的顾虑中学习。对于每个人来说，记住 Scrum 始终是一场实验，持续时间仅为下一次冲刺，并在那时有机会重新审并更改任何看起来不理想的地方。有时，
    Scrum 的实验性质是尝试它的最有说服力的理由之一。


    # 培训


    虽然 Scrum 并不复杂，可以在书中描述得很详尽，但让组织外部的人对团队进行培训是无价的。


    客观的第三方培训师可以进入组织，发现组织内部人员可能无法发现的问题。优秀的培训师还可以指导人们处理一些更微妙或复杂的方面，确保他们不仅理解在做什么，还理解为什么要这么做。


    Scrum 培训对整个团队可能需要一天或两天，并且最好在场外进行，在一个中立的地方，这样人们就不会被日常工作干扰。不要通过给他们少于所需的培训来改变你的组织。很容易将
    Scrum 的标签贴在任何完全不敏捷的流程上。


    > 不要仅仅将 Scrum 视为描述现有流程的新方法


    将 Scrum 视为描述现有流程的新方法是错误的。Scrum 不仅仅是一组华丽的词汇。有些团队在没有经过适当培训的情况下就开始使用 Scrum，结果仍然遵循过去对他们无效的破旧流程，同时应用诸如“冲刺”等标签。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_163_0.png)


