    ### 排序仪式

    该仪式各个部分的顺序——处理做得好的和不好的部分——可以根据团队的偏好进行反转。Scrum 导师（Scrum masters）也可以选择采用许多实践来提高团队对这一过程的参与度，包括游戏、卡片、提前提交等。在策划这一仪式时，有很大的创意空间。


    # 我们应该如何处理？


    在每个人都有机会讨论他们认为在冲刺（sprint）期间哪些做得好、哪些做得不好之后，就应该开放讨论。这让团队中的每个人都有机会进一步地阐述他们提出的问题，以及同事提出的问题，并他们认为团队应该针对这些问题采取什么措施。


    对于做得好的地方，团队应该尝试找到在未来的冲刺中复制这些成功的方法。他们可能在上一个冲刺中尝试了一些新方法并证明是成功的，这些方法可以整合到未来的流程中。


    对于做得不好的，团队有机会讨论哪里出了问题。有时问题在于没有遵循流程。其他时候，流程实际上造成了阻，需要进行调整。应该鼓励每个人对可能有益的改变发表意见。


    最终，讨论将集中在团队想要关注的四五个关键问题上。Scrum 导师应该引导讨论，使这些问题被表述为修订后的实践——然后团队可以同意在即将到来的冲刺中尝试这些实践。


    ### 仅在冲刺之间进行可控的更改

    虽然可能会讨论许多问题，但团队应该就一组微小且易于管理的更改达成共识，从一个冲刺过渡到下一个。对于用户体验测试来说，在测试之间进行的更改越多，就越难以隔离哪些是有用的，哪些引起了问题。


    在这一仪式结束时，Scrum 导师应该向团队提供一份简短易懂的流程变更列表。最重要的是，Scrum 导师应对全场进行投票，确保每个人对这些更改都赞同。然后，Scrum
    导师应该记录团队对下一次冲刺修订的承诺。团队反思和改进的能力对其发展至关重要，正如对冲刺待办列表（sprint backlog）的承诺对于产品的发展一样。


    # 结论


    在本章，我们回顾了 Scrum 的四个关键仪式：冲刺计划（sprint planning）、每日站会（daily standup）、冲刺演示（sprint
    demo）和冲刺回顾（sprint retrospective）。这些仪式在每个冲刺中重复一次，站会则是每天执行。


    这些仪式引导我们从产品所有者（product owner）编写的故事开始，通过团队估算、对冲刺待办列表做出承诺、完成所有故事、演示每个故事已完成并符合其所有的验收标准，最后对已完成的冲刺中哪些做得、哪些不好进行反思，以便团队不断改进。


    接下来，我们将查看 Scrum 的一些产物（artifacts）。这些工具帮助 Scrum 团队理解他们正在做什么、跟踪进度并有效协作。


    # 第 5 章


    ## Scrum 产物


    **产物 (Artifacts)** 是允许团队管理 Scrum 流程的工具。它们帮助团队成员就他们正在的工作进行交流，提供团队已经要做和已经完成成就的记录。任何人都可以指向
    Scrum 团队的产物，向人们展示他们正在做什么、完成了什么以及他们期望实现什么。


    许多产物可以帮助团队在 Scrum 工作过程中进行准备和管理。熟悉 Scrum 语言意味着理解每件产物的用途以及如何使用。在本章中，我们将回顾一些常用的 Scrum
    产物，例如：


    - 故事 (story)

    - 产品待办列表 (product backlog)

    - 冲刺待办列表 (sprint backlog)

    - Scrum 看板 (scrum board)

    - “完成”的定义 (definition of "done")

    - 速率图 (velocity charts)

    - 燃烧图 (burndown chart)

    - 产品增量 (product increment)


    不同的团队在创建和维护所使用的产物方面有不同的方法，但对于网页和移动开发，有些是值得记住的。


    # 产物概述


    尽管正式的 Scrum 不规定过程产物的具体使用方式，但我们将涵盖一些构建和维护产物的方法，这些方法被证明对网页和移动团队通常的工作类型非常有用。


    对于网页和移动工作，Scrum 最基本的产物之一是描述要开发的功能“故事”。故事在待办列表中开发和管理。维护两个独立的待办列表：一个供产品所有者跟踪产品的整体愿景，另一个供团队参与当前正在进行的冲刺。这两个待办列表都包含了为了推进产品而需要执行的操作描述，但产品待办列表中的项目看起来与冲刺待办列表上的故事不同。Scrum
    团队使用 Scrum 看板跟踪故事在冲刺中的进度，我们将讨论它们如何协同工作。


    Scrum 还提供了许多收集统计数据的工具，有助于跟踪团队绩效，并向 Scrum 团队内部外部人员传达产品开发的情况。其中我们我们将涵盖跨越多个冲刺的速率图，以及跟踪单个冲刺内进度的燃烧图。


    Scrum 团队会发现其他有用的产物，包括产品所有者同意的“完成定义”，以及产品增量。


    # 故事 (Stories)


    ![Stories](https://images.unsplash.com/photo-1517842386807-eca43a827777?w=800)


    **故事 (Stories)** 是产品所有者交流需要开发内容的方式。它们在产品待办列表中孵化，并以标准格式表示，以便在冲刺中进行评估。


    ## 使用故事的起源


    使用故事来封装离散工作部分的概念源于极端编程（XP）¹，它是敏捷开发的一种特殊变体，提倡许多开发实践，如结对编程。在进行网页和移动开发时，故事非常有用，因为它们通常具有相同的组件。


    ¹ http://www.extremeprogramming.org


