    without limiting the development of the rest of the site.


    At the same time, updating the infrastructure of a product to support a new feature
    may happen at any time in the process, so a team has to consider up front how
    to make those changes safely, without breaking the work done on other features.


    Another example, sometimes an API that every feature of the site relies on needs
    to be changed. Scrum encourages the team to manage the code in a modular, testable
    way, so that changes can be inherited by other feature stories that might be in
    progress without undue breakage.


    ## Flexible Scheduling


    Companies serving customers in the web and mobile space need to be able to respond
    quickly to changes. However, engineers need to be confident that what they''re
    working on isn''t going to change before they get the feature developed. It can
    be difficult to balance these two objectives.


    Scrum provides windows of opportunity that are long enough to allow a web or mobile
    feature to be fully developed, while allowing a product to change direction at
    the end of each sprint, based on data from the marketplace.


    ## Reflection and Improvement


    A scrum team isn''t only looking to improve the product: they''re also looking
    to improve their own process. Scrum teams get better at estimating how much work
    they can do, and improving their approach to working so that they can be the most
    productive.


    ## Introducing Scrum 11


    By giving the team the opportunity to look at its own process, and figure out
    how it works best together, scrum makes maximum use of the limited resources of
    any organization.


    ## Summary


    That was a quick overview of scrum, taken from a 30,000-foot perspective. We had
    a brief introduction to how scrum works, and why it can be effective for certain
    types of product development. We contrasted scrum with the more traditional waterfall
    approach for software development, and discussed why it emerged when it did. We
    also noted how well suited scrum is for web and mobile development projects.


    But scrum isn''t just an abstract concept and a bunch of unfamiliar buzzwords.
    Scrum is a practical and flexible approach to product development that relies
    on the active and engaged participation of real people. So in the next chapter,
    we''re going to meet a few of the typical people who might work in a web or mobile
    development organization. We''ll talk to them about some of their frustrations,
    find out what they hope to get out of scrum, and ask them about their concerns
    when they consider scrum.


    As we go through this book, keep these people in mind. We''ll be meeting them
    again, and following them through their process as they learn and start to apply
    scrum to their work.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_31_0.png)


