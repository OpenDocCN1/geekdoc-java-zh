    ## 前言


    如果你还没有听过 Scrum，而且你正在从事 Web 或移动端开发工作，那么现在是时候了解它了。Scrum 是一种围绕经过时间检验的技术来组织工程团队的方法，旨在改进沟通、增加产品开发过程的灵活性、支持持续改进，并提供一种痛苦感更少、参与度更高的可持续生产力节奏。


    Scrum 提供了一套核心运营原则，并为团队提供了极大的灵活性，使其能够根据特定需求调整流程。如果应用得当，Scrum 可以保护工程师免受干扰和微观管理的干扰，同时赋予产品经理定期适应市场变化的灵活性，以及预测团队能够承担并完成多少工作的能力。


    在书中，你将接触 Scrum 的基础知识，并获得一些可以立即应用的示例。由于 Scrum 既关乎流程，也关乎人，我们将向你介绍一个典型的 Web 和移动端开发团队，并为你展示
    Scrum 对他们工作、人际关系以及他们职业生涯中最关注的事物的影响。


    无论你是不确定 Scrum 是什么，还是你认为自己的流程没有达到理想状态，这本书都能提供帮助。Scrum 并不是魔法，但它能产生的结果非常值得花时间学习如何有效地应用它。


    ## 谁应该读这本书


    这本书适用于任何在团队中构建 Web 或移动端 App 的人员：工程师、测试（QA）、管理人员、设计师和产品经理。它假设读者不熟悉 Scrum 或项目管理技术。虽然它的目标读者是对
    Scrum 了解较少的读者，但对于那些目前正在使用 Scrum 但不确定是否获得了预期结果的人来说，这本书也会有用。


    ## 使用的规范


    你会注意到我们在书中使用了特定的排版和布局样式来表示不同类型的信息。请关注以下内容：


    ### 提示、备注和警告


    > ### 嘿，你！

    提示（Tips）提供有用的小贴士。


    > ### 咳，打扰一下……

    备注（Notes）是与当前主题相关但并非关重要的有用补充。你可以将它们视为额外的信息碎片。


    > ### 请务必始终……

    > ……注意这些重要要点。


    > ### 注意！

    警告（Warnings）强调了在过程中可能会让你绊脚的任何“陷阱”。


