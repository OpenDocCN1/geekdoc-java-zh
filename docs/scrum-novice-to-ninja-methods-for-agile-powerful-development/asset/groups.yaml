    我们已经支持 [redacted] 超过一年，而且对服务没有收到过任何投诉。他们目前占我们收入的百分之七以上。他们一直在询问为什么不能在图片中添加幼狗。幼狗在互联网上像小猫一样常见，他们希望能够吸引更广泛的受众。我们已经没有借口可找了。我们的竞争对手支持添加所有类型的动物，尽管我们知道他们在质量和控制方面无法与我们相比。但如果我们不更加灵活，那将毫无意义。如果我们无法满足
    [redacted] 的需求，我们肯定会失去他们。


    这封备忘录引起了公司所有者的注意，他经常召集产品负责人开会。他们讨论的问题包括适应不断变化的市场预期的价值，以及增加与公司历史初衷（更不用说公司名称）冲突服务的恰当性。


    他们共同决定需要对“幼狗友好型”功能做一些工作——即使只是为了弄清楚在现有基础设施支持下，在小猫功能中支持幼狗可能需要什么。他们认为需要记住的关键问题之一是：维护一个完全独立的服务的开销，与开发和支持一个集成服务的成本相比。


    由于销售备忘录的紧迫性，他们决定此任务优先级足够高，必须推迟关键的季节性推广，即整合假期期间新的波斯猫和安哥拉猫推广活动，团队计划在下周处理这项工作。产品负责人带着讨论的细节回到产品负责人处，并获得了对该优先级调整的批准。


    ## 产品待办列表 (Product Backlog)


    带着新的指令，产品负责人回到了产品待办列表，那里记录了该服务的所有未来想法。将列表中的一些其他高优先级想法向后推几乎让人感到痛苦，但很明显，这将是首要完成的任务。


    在对竞争服务进行了一一两天的研究后，产品负责人汇总了该想法的细节。大多数其他服务都将动物选择放在客户流程的后期，几乎是作为事后考虑。遵循这种方法，


    ## 故事生命周期 (The Lifecycle of a Story)


    如果他们要为客户提供幼狗的选择而不仅仅是小猫，这将要求对核心产品进行重大调整，并引入一个新的界面元素。


    只有一两个其他服务专门专注于一种幼体。在大多数情况下，它们规模很小，并且没有获得 WithKittens 所拥有的市场认可度。尽管存在市场碎片化的风险，但在核心服务中专注于小猫仍然具有优势。这还避免了在名为
    WithKittens 的服务中添加幼狗带来的困惑。


    最终，产品负责人决定最好的方法是要求团队克隆 WithKittens 服务的某些部分，并创建一个行的 WithPuppies 服务。他们已经预料到这种可能性并购买了
    WithPuppies.com 域名，设计师们已经在随性地围绕这个概念进行构思了。


    在继续执行该决定之前，产品负责人找其中一位高级工程师进行了聊天，并确认了这是技术上最直接的方法。他们越早向市场推出一个可以测试的服务，就越早能知道这是否可行。


    ## 制定功能草案 (Formulating a Feature)


    在勾勒出几个想法后，产品负责人决定快速高效地完成此任务的最佳方法是创建一个面向网页用户的精简版产品。公司可以使用其部署系统将受众限制在小比例的访问者中。


    这些访问者在登录时将看到一个提供幼狗而非小猫的链接。如果他们点击该链接，他们将被带离 WithKittens.com 域名进入 WithPuppies.com
    域名。在那里，网站的体验将是相同的，只是小猫被替换成了幼狗。


    由于这不是公司大多数客户关心的，它必须让用户非常方便地切换回小猫。如果能提供一种收集访问者反馈的方式就太好了。


    ## 安排设计资源 (Lining up Design)


    产品负责人检查了设计团队正在处理的项目队列。设计将采用看板流程，以便在设计师完成当前工作后可以立即插入新的设计故事。


    在与设计师坐下来讨论了从小猫转换为幼狗所引发的一些视觉和用户体验问题后，产品负责人创建了设计故事。设计师同意，在工程工作开始之前不需要完成所有设计。只要在现有参数范围内，这项工作可能在一个冲刺内完成。


    ## 编写故事 (Writing Stories)


    在获得设计和工程部门初步许可后，产品负责人开始编写围绕创建并行服务的想法故事。团队习惯以两周为一个冲刺进行工作，目标是看看是否可以将故事范围缩小得足够小，以便能在一个冲刺内完成。


