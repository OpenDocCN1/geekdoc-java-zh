  mdcn: '


    # Scrum：从新手到大师


    如果这涉及到核心功能，且有信息分享的价值，则应定期进行。不同的团队会有不同的方法，但每日站会（standup）是进行日常调整的好地方。


    站会也是团队成员相互告知的好机会，例如他们是否预计在下一次站会之前完成某个故事（story），以及他们近期是否有假期。了解团队其他成员的可用性可以启发队友根据即将到来的故事来规划工作，并安排切换配对或适当分配资源。


    > 下一步做什么？

    > 如果工程师不清楚下一步应该工作什么，应该由冲刺待办列表（sprint backlog）的优先级来引导决策。产品负责人（product owner）负责在整个冲刺期间维护冲刺待办列表，并确保它代表了应该处理故事的优先级。


    除非有充分的理由，否则任何没有当前故事的工程师都应该开始处理待办列表中优先级最高的故事，无论其专业领域如何。遵循这种模式可以为工程师提供在经验较少领域与他人配对的机会，并帮助在整个团队中传播代码库。


    最后，敏捷大师（scrum master）可以在站会结束时发布与整个团队相关的公告——每个人都有报告的机会，且仅在剩余时间的情况下进行。这不应成为公司会议、团队午餐和其他聚会等任何团队建设活动的替代品。


    # 冲刺演示 (Sprint Demo)


    在冲刺结束时，当前冲刺期间的所有工作都将向团队、产品负责人以及任何邀请观察的人员演示。这种仪式被称为冲刺演示，它让所有工程师都有机会演示他们认为已完成的故事。冲刺演示是产品负责人测试每个故事的机会，检查它是否符合验收标准（acceptance
    criteria），然后接受或拒绝它。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_87_0.png)


    图 4.4. 冲刺演示


    # 目标


    冲刺演示的目标是明确冲刺期间完成了多少工作，并查看整合了冲刺期间完成的工作后，产品的当前状态将如何。根据被接受的故事，团队可以了解到他们在单个冲刺中可以持续完成多少故事点（points），这提高了他们未来对故事和冲刺待办列表进行估计的能力。


    > 冲刺演示中的嘉宾

    > 冲刺演示通常是嘉宾非常欢迎的仪式，因为 团队之外的人员有机会看到团队一直在做什么，并根据最新产生的工作观察产品在下一次迭代中的状态。但不应允许嘉宾的存在干扰仪式的目标，或改变时间盒（time
    box）。嘉宾是观察者，而不是参与者。除非征求嘉宾的反馈，否则应要求他们不对产品或过程发表评论。


    # 时间盒 (Time Box)


    分配给冲刺计划的时间取决于冲刺完成的故事数量以及与验收标准相关的复杂度。如果团队使用两周一次冲刺，大多数团队会为冲刺演示分配半天时间。一旦团队决定投入多长时间进行演示，敏捷大师应负责确保所有内容都符合时间盒要求。


    # 安排演示与回顾


    团队经常会将与演示在同一天安排冲刺回顾（我们很快会涵盖这一点）。安排这些活动的优点是最大限度地减少了与仪式相关的生产力中断。对团队的缺点是，这些日子主要产生
    Scrum 产物，而不是具体的产品开发。这种权衡需要被考虑，不同的团队会有不同的偏好。


    # 准备


    冲刺演示是团队展示他们所做所有工作的机会，并证明他们工作的所有故事已完成并准备好纳入产品（假设它们尚未发布）。演示涵盖了从冲刺开始的所有故事工作，直到符合团队的“完成定义”（definition
    of done）。每个处理了准备好演示故事的人都需要准备解释他们的工作内容。


    通常，工程师会在演示前与产品负责人会合，确保每个人知道要演示的内容。这是演示前一个实用的步骤，因为它确保了演示的故事符合所有验收标准。它提醒工程师为未发布的故事做好准备。


    敏捷大师应该与所有完成故事的工程师见面，确保这些故事已为演示做好准备。运行仪式并确保需要演示的内容在分配的时间盒内完成是敏捷大师的责任。仪式的程程应包含所有演示列表。


    # Scrum 仪式


    # 由产品负责人引导演示


    有些团队让工程师演示故事，但一种良好的做法是让产品负责人参与现场测试产品。开发新功能的工程师了解代码的正常路径（happy path），但产品负责人将寻找边界情况（edge
    cases），并了解最重要的验收标准。让工程师设置演示并让产品负责人在场可以保持大家的参与度并确保故事已完成。


