    # 迭代计划 (Sprint Planning)


    标记每个迭代开始的仪式被称为迭代计划。迭代计划由 Scrum Master（敏捷大师）主持，但负责迭代计划中大部分内容的人是产品负责人（Product Owner）。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_76_0.png)


    图 4.2. 迭代计划


    # 目标 (Objective)


    迭代计划的目标是为即将到来的迭代设定日程。团队与产品负责人和 Scrum 聚在一起，了解在下一个迭代中应该完成的用户故事（Stories）。


    产品负责人展示了这些故事如何符合产品愿景，团队对产品负责人引入的故事进行估算，并根据他们的历史速率（Historical Velocity——该速率由平均每个迭代中能够完成的点数决定）承诺完成尽可能多他们能够胜任的任务。在迭代计划结束时，应该对一组每个人都能认同的特定故事达成承诺。这些故事都应该是清晰的，且它们所代表的工作量在团队在下一次迭代中完成的容量范围内。


    # 时间盒 (Time Box)


    取决于团队每个迭代承诺的周数，迭代计划可能需要几个小时，也可能需要一整天。对于为期两周的迭代，团队可能会发现三到四小时对于迭代计划来说是一项很好的投资。这看起来可能是很多时间，但正确的迭代计划对于团队需要产出的内容是非常详细且明确的。Scrum
    的核心价值之一是它促进了沟通。迭代计划正体现了这一点。


    大多数团队会发现，随着对流程的熟悉，他们能够高效地完成这些仪式的目标。一个强大的 Scrum Master 能够对仪式的不同方面维持清晰的时间盒，这有助于过程尽可能顺畅地进行。


    但在迭代计划期间有大量工作要完成，这些仪式需要有足够的空间来处理可能浮现的所有问题。从时间限制开始，会让每个人都有信心认为心中有一个目标和一个终点，并帮助人们保持专注。


    # 准备 (Preparation)


    为了准备这一仪式，产品负责人已经与设计师、客户、各个团队成员以及 Scrum Master 合作，创建一个待办列表（Backlog），其中包含的故事是清晰且具体的，并且对产品具有最高优先级。


    产品负责人负责确保每个故事都已准备好可以进行开发，并且表述方式让任何团队成员都能读并理解每个故事的描述和验收标准（Acceptance Criteria）。


    # 引入新故事 (Introducing New Stories)


    迭代计划为 Scrum 团队提供了了解产品负责人希望在产品下次迭代中完成的故事的机会。在仪式的这部分，产品负责人将回顾准备好的故事，将其提交给团队进行评估。


    团队的每个成员在演示期间积极参与是至关重要的，因为这是他们质疑并挑战每个故事的完整性和恰性的机会。一个优秀的产品负责人会在此仪式之前，先与团队中的专家讨论过这些故事，以确保预见到的反对意见得到解决。


    迭代计划鼓励围绕每个故事进行积极讨论。这一过程开启了对话，让产品负责人和团队能够详细考虑每个故事的影响和可行性。尽管产品负责人有权设定迭代待办列表（Sprint
    Backlog）中故事的优先级，但团队有权在故事添加到迭代待办列表之前，拒绝他们认为无法实现、定义不充分或技术上不恰的故事。


    迭代计划仪式的这部分团队还负责展示与代码本身相关的故事。如果说产品负责人负责产品的愿景，开发团队负责代码的质量和可维护性。Scrum 以产品为导向的关注并不是忽视技术债的借口。


    团队通常会引入围绕重构代码、更新代码以满足新标准以及对基础设施进行关键升级的故事。团队提供强有力的论据至关重要，因为产品负责人拥有最终决定权。不同的团队以不同的方式解决这种权力平衡，这取决于每个团队如何找出在满足产品开发预期的同时解决技术债的方法。


    # 故事估算 (Story Estimation)


    迭代计划的下一阶段是故事估算。在此过程中，团队将根据过去对类似故事的经验以及他们约定的“完成定义”（Definition of Done），估算完成每个故事所需的相对工作量。


    团队有许多方法来估算故事。估算时需要记住的一点是，分配给不同故事的值是任意且相对的，与实际时间没有关系。估算练习的目的是提高团队的能力，使其能够查看新故事并判断它与已经工作过的故事相比需要投入多少精力。


    大多数团队使用点数系统（Points system）来估算故事。一个较小、简单的故事可能被估为 1 分，而一个大型或复杂的故事可能被分配 20 分。许多团队使用改进的斐波那契数列，用数字
    0, 1, 2, 3, 5, 8, 13, 20 代表不断增加的工作量。随着时间的推移，目标是让团队对单个迭代内可以完成多少点数产生感，以便他们更有效地预测。


    每个团队对每个点数的含义都有自己的理解。点数之间不存在逻辑比较。Scrum 中的点数是主观的，仅对该团队有效。其他尺寸方案包括 T 恤尺寸（T-shirt
    sizing）：

    - 小（Small）

    - 中（Medium）

    - 大（Large）

    - 特大（Extra-large）


    # 所有人都应该同意 (Everyone Should Agree)


    > 你不需要为 Bug 预留容量


    没有预留团队百分比的容量来处理 Bug。在典型的迭代中可以预测完成的工作量，已经包含了在修复已接受但未符合验收标准的故事时投入的精力。


    # Bug (Bugs)


    有一个老笑话说Scrum 是一个改进团队技术债的系统。显然，开发 Web 或移动应用程序不仅仅是在不断增长、日益复杂的代码库上堆砌功能。最终，这些代码需要重构，基础设施必须进行更改，在解决这些问题之前，团队将无法开发新功能。这些必要的改进对客户可能没有特定价值，但对于保持代码不过时是必要的。


    # 任务 (Tasks)


    任务通常不交付任何实质的用户价值。但任务是必须的，如果团队在迭代计划期间意识到为了保持系统可维护性和避免技术债的必要工作被推迟以开发新功能，那么团队与产品负责人之间就需要进行谈判。


    # 刺探 (Spikes)


    大多数进入迭代计划的故事应该在团队的技术范围内，但有时会出现需要更深层次研究的故事。此类故事会触发称为刺探的新任务。刺探任务通常不被分配


