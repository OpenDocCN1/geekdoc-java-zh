    Unlike project managers, a scrum master comes with a clearly defined mission as
    a servant leader to the team. A scrum master has no formal authority within an
    organization, other than the authority to shepherd the team through the rituals
    of scrum, and maintain the artifacts that track the team''s progress. But the
    scrum master has ultimate authority when it comes to the scrum process and how
