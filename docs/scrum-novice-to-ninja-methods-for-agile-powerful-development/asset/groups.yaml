    # 产品经理


    ## 我的角色


    作为 WithKittens 网站的产品经理，我隶属于产品小组，该小组向首席执行官（CEO）汇报。我们负责确保提供给客户的服务尽可能完美。我必须平衡许多考量，包括销售部门的功能需求、高管对董事会和投资者的承诺，以及实际的预算和工程需求。同时，我还要关注视产品的演进情况，并为下一次发布和下一个版本进行规划。我们的网站需要在继续支持所有现有用户的同时，不断增长以触达新用户。


    ## 动力


    工作中最让我感到兴奋的是有机会构建一种超出客户预期的服务。当我收到用户的邮件，他们从我们获得了卓越的服务时，我会感到非常快乐。但邮件并不是我获取这些信息的唯一途径。我喜欢看到我们的数据随着时间的推移而改善。我们在网站中集成了许多不同的跟踪服务，以便我们衡量提供的服务在哪些方面获得了最大的价值。此外，我最喜欢的职责之一是用户测试，我可以与客户坐在一起，了解他们喜欢我们服务的哪些，以及哪些地方我们需要改进。归根结底，这是为了提供我们能提供的最好的服务，我很享受其中。


    ## 完美的一天


    我典型的一天是在与设计师就新功能反复往返工作、与客户沟通预期、与高管讨论功能预期，以及与工程师讨论这些功能如何开发。我喜欢这种能同时从多个视角观察项目的机会，但我必须频繁切换思路，有时在考虑未来的发展，有时在考虑现在正在发生的事情。我花了大量时间在会议上。当不在开会时，我通常在根据设计、测试和研究编写报告或规范。


    ## 挫败感


    你是否听过那句话：“计划本身一文不值，但规划的过程是无价之宝？”有时这句话描述了我的生活。我可以花费几周时间为 WithKittens 的下一次迭代建立一套完美的规范，结果却因为工程部门出于实用考虑的一次拒绝而让一切化为乌流，或者因为高管对某个我们从未想过的功能发表的一句评论。有时我的工作感觉就像在瓶中造船。我必须引导我对产品需要去向的愿景，但我无法实际触及那些部件。我还必须面对这样一个事实：我的日程安排不像设计师或工程师的时间那样是任务关键性的。作为产品经理，我需要在我手头的资源可用时让自己可用，而不是相反。


    ## 对 Scrum（敏捷开发）的担忧


    我对 Scrum 最大的担忧是为什么它似乎没有解决截止日期的问题。我生活在现实世界中，这意味着有时我们必须承诺某些将在特定日期交付。有时你必须非常具体地说明那个东西是什么。Scrum
    对截止日期和产品规范的处理似乎很松散，允许敏捷流程来定义它们，而不是相反。我喜欢这种想法：遵循 Scrum 的团队会更擅长估算时间，这样我就可以预先知道我们某些东西需要多久。我不喜欢这种想法：我们可能不确定在特定时间会交付什么。我了解我必须打交道的人，让他们习惯这种不确定性可能会很困难。


    # 设计师


    ## 我的角色


    设计是一门触及产品极深层次的学科。我尝试从内向外地设计产品，思考用户期待什么，以及我们如何满足并超越这些预期。这意味着我必须同时从视觉和实验两个角度进行思考。当然，我负责风格指南并维护视觉的一致性。我还负责确保功能的一致性。当用户访问
    WithKittens.com 时，我的职责是确保他们知道下一步应该做什么什么。如果我工作得当，我提供给团队的设计将解释用户如何在网站中流转，以及他们在此过程中的体验将是怎样的。


    ## 动力


    我有时会有点偏执，但当我穿过一个我设计的网站，并感到视觉和流程都具有整体的一致性时，会带给我很大的满足感。我希望我产出的能给用户提供一种合逻辑、愉快且能发挥产品潜力的体验。对于像
    WithKittens 这样的网站，我们有很多设计目标，即保持用户体验的趣味性、启发性和幽默感。对我来说，我的工作保持忠于这些设计目标非常重要。我不介意为我信仰的事情而战，尤其是当我知道会有多少人看到这个网站时。我对这些人负有责任，不能让那种体验变成负面的。


    ## 完美的一天


    我成为设计师是因为我喜欢发明、创造和创新。设计是关于观察现实世界的挑战，并提出合理的、能让用户愉悦的有趣解决方案。我认为我最好的日子是有有机会去相信并关注我所见的下一代产品面临的挑战。我有很多想改进我们现状的地方，但与此同时，我的脑子里总在思考我们下一个交付什么。我与产品小组紧密合作，头脑风暴创意并提出用户测试的有趣方法。我喜欢那种工作。


    ## 挫败感


    出于实用原因，团队有时把我当成生产工具。作为一名接受过视觉工具训练的人，我经常被要求在最后一刻生成资产。这种工作有时可能很枯燥，但我是唯一有技能来完成它的人。我见过当我们把设计任务交给工程师时会发生什么——通常并不好看。很多时候，最后一刻的需求从设计角度来看是不符合逻辑的，所以这种工作很消耗精力。


    ## 对 Scrum 的担忧


    我努力跟上开发技术，并且读过一些关于 Scrum 的东西。我一直在思考设计如何成为 Scrum 流程的一部分，它似乎从未明确。有些人说将设计整合到 Scrum
    流程最好的做法是在每个开发冲刺之前划分独立的设计冲刺，使整个流程敏捷化。另一些建议设计师融入 Scrum 流程的缝隙，成为团队中的伪工程师资源。这些听起来都不吸引我。我已经觉得我的大部分工作都是在最后一刻做的。我不喜欢这种想法：这样做可能会降低
    Scrum 流程的速度，或者让我发现自己为了适应团队而不得不面临时间压力。


    # 高管


    ## 角色


    我为整个公司提供领导。这可以意味着许多不同的方面。在工程方面，它意味着根据我对市场的理解，为产品需要的演进提供方向。我的责任是激励工程团队创造我们需要以保持竞争力和增长的产品。


    ## 动力


    归根结底，如果我没做好工作，公司里的所有人都没有工作做了。这是一份巨大的责任，我非常认真。我需要确保我们正在开发的的产品满足客户需求并支持底线。


    ## 挫败感


    由于我对市场的视角，我对自己周围发生的事情有一个俯瞰视角，以及我们下一步需要做什么。我不能总是向所有人解释我做决策时考虑的所有因素，但我需要人们相信，当我说某事现在必须发生时，我知道我在说什么。有时这感觉就像在瓶中造船。


