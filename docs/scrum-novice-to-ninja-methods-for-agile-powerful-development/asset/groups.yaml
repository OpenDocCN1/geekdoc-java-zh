    # What I''ve Learned


    The interesting thing is that the self-managing teams don''t actually manage the
    way I was expecting. I will be the manager of the team, and they rely on me for
    personnel issues, resource allocation, and general leadership. The rest of the
    company looks to me to take responsibility for what the team is working on, and
    make sure that we do coordinate with the needs of the company.


    Scrum is about the processes the team follows when it''s trying to get work done.
    Scrum doesn''t replace management, but it steps in and provides a pattern that
    everyone follow to improve their ability to estimate stories, and make sure everyone
    is working in a transparent and productive way. I particularly like the way scrum
    has coordination points between the product group and the engineering group. It
    takes some of responsibility off of my shoulders, so I can do the job of managing
    the team.


    And honestly, I like scrum gives me the opportunity to do some work on the team
    as a developer again. That''s something I''ve missed as a manager, and I''m glad
    to get back to it.


    # What Still Frustrates Me


    Scrum is great within the engineering team, but it would be so much more effective
    if everybody in the company was on board with it. I sometimes find myself caught
    in the middle, trying to explain the concepts of scrum to people in senior management
    or on the sales team who want to know that a particular feature can be delivered
    on a particular date. I mean, I understand why they need that, but it''s frustrating
    having to explain the trade-offs every time.


    # What I Do About It


    I think we''ve done a pretty good job of getting most people on board with supporting
    scrum, and recognizing the value of an iterative process that can respond quickly
    to changes. I like to explain to people that scrum allows an engineering team
    to estimate new ideas quickly, and adjust the trajectory of developments to adapt
    to market changes.


    The alternative is coming up with a long-term plan and committing to it, without
    knowing for sure what''s the marketplace is going to want. There will always be
    compromises when it comes to things like that, and that''s where people skills
    are necessary. Most executives would rather have the ability to change direction
    quickly, since they recognize that things change quickly in web and mobile development—features
    that are scheduled so far into the future usually never happen, regardless of
    what process the team follows.


