    the stories get completed. In either case, the standup should be an opportunity
    to make sure everyone has updated the status of everything they''re working on,
    and everyone on the team is aware of what everything is working on.


    For teams that do pair programming, the standup can be an opportunity to switch
    pairs, or switch stories. Some teams that do pairing prefer that every story have
    one engineer seeing it through from beginning to end. It can be beneficial for
    the flexibility of the team to allow multiple people to pair on the same story,
