    and feasibility of each story in detail. Although the product owner is authorized
    to set the priority of the stories on the sprint backlog, the team has the authority
    to reject stories that it considers impossible, inadequately defined, or technically
    inappropriate before they''re added to the sprint backlog.


    This part of the sprint planning ritual is also when the team has the responsibility
    to present stories that relate to the code itself. If the product owner is responsible
    for the vision of the product, the development team is responsible for the quality
    and maintainability of the code. The product-oriented focus of scrum is not an
    excuse to ignore technical debt.


    Often the team will introduce stories around refactoring code, updating code to
    meet new standards, and making crucial upgrades to the infrastructure. It''s important
    for the team to make a strong case, because the product owner has ultimate authority.
    Different teams resolve this balance of power in different ways, and it''s up
    to each team figure out how to address technical debt while still meeting the
    expectations of product development.


    # Story Estimation


    The next phase of sprint planning is story estimation. During this process, the
    team will estimate the relative level of effort to accomplish each story, based
    on the team''s experience with similar stories in the past and their agreed definition
    of done.


    There are many ways that teams estimate stories. The important thing to keep in
    mind when estimating is that the values assigned to the different stories are
    arbitrary and relative, and bear no resemblance to actual time. The point of the
    estimating exercise is to improve the team''s ability to look at a new story and
    figure out how much effort it''ll take relative to other stories they''ve already
    worked on.


    Most teams use a system of points to estimate stories. A smaller, easy story may
    be estimated at one point, while a large or complex story may be assigned 20 points.
    Many teams use a modified Fibonacci scale, with the numbers 0, 1, 2, 3, 5, 8,
    13,'
