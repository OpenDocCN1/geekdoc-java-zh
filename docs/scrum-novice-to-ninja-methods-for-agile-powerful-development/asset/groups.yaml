    ## 进度跟踪


    一旦定义了所有任务，最初的小组就决定了任务的优先级顺序，并决定需要先完成哪些任务，以支持其他任务的开发。他们之间认为自己具备完成第一个任务所需的技能，因此他们将自己分配给该任务，并开始编写必要的代码，而没有寻求任何帮助。


    此时，他们将第一个“小狗故事”（puppy story）移到了“进行中”列：


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_147_0.png)


    图 8.3 冲刺 11 的第一个任务


    过了一会儿，团队中的另一名工程师完成了一个故事，与 QA（质量保证）人员核对确保其已完成，然后就可以开始处理新故事了。该工程师检查了看板，发现这个高优先级故事中的几个新任务尚未开始。在与第一小组确认确保任务之间不会发生重叠后，该工程师接手了顶部故事中下一个优先级最高的任务，更新了
    Scrum 看板，并开始工作。


    一旦第二个任务进入进行状态，Scrum 看板看起来就像这样：


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_148_0.png)


    图 8.4 冲刺 11 的第二个任务


    产品负责人（Product Owner）也在跟进，对小狗故事的文案进行处理，并向设计部门确认资产状态。现在是检查 Scrum 看板查看情况的好时机。


    上一个迭代中正在进行但尚未完成的任务现在被列为“准备就绪演示”。创建小狗版网站的新故事已经开始，并被拆分为六个任务，其中两个正在进行中。产品负责人在心里记住，在明天站会（standup）后检查任务状态。


    在一天结束之前，Scrum Master 检查了看板上故事的状态。新任务已经添加，格式整洁，这意味着负责小狗故事的团队正确遵循了现有惯例。似乎不需要中断正在处理故事的工程师。


    ## 第一次站会


    第二天在每日站会上，负责小狗网站故事的 QA 工程师参加了，并记录了所有任务的状态。产品负责人也参加了。


    ## 执行 Scrum 流程


    ### QA 在站会的出席


    某些团队将 QA 视为核心团队成员，但对于 WithKittens 团队来说，QA 不需要积极参与所有团队活动。非直接加入团队的人员是否参加站会完全取决于他们自己。只有在被提醒可能会讨论新任务或故事时，WithKittens
    的 QA 才会参加站会。产品负责人喜欢尽可能参加所有的站会。当然，无论是 QA 还是产品负责人，在团队中所有工程师汇报状态之前都不会发言。即使如此，Scrum
    Master 也会限制他们只发表与整个团队相关的陈述。


    第一个报告由负责小狗故事的初级工程师做出，他解释了他们如何将故事拆分为任务，以及他们如何开始处理第一个任务。


    “我们感谢对任务拆分的任何反馈，”初级工程师说，“我认为我们涵盖了所有的验收标准，但越多的人关注，我心里越踏实。”


    “所以你今天剩下的时间都会处理这个任务吗？”Scrum Master 问。


    “是的，我想我们会这样。”


    “有任何阻塞因素（blockers）吗？”Scrum Master 问。


    “我不认为有，”初级工程师回答道。


    “不，我不认为有任何阻塞因素，”故事的另一位工程师同意道，“我们至少应该一直工作到明天。”


    “太棒了，”Scrum Master 说，他记录下要跟进，然后继续循环直到每个人汇报完毕。然后大家散会，工程师们回到各自的项目。


    站会结束后，产品负责人与 Scrum Master 讨论了设计工作已经开始。那些需要设计资产的任务尚未开始。


    ## 第二次站会


    在冲刺的第二天，产品负责人和 QA 工程师再次参加了站会。所有工程师都在场，他们处理的故事没有阻塞因素。正当 Scrum Master 准备解散团队时，一名工程师发言了。


    “关于这个狗故事如何与网站上的帮助页配合，我有一个简单的问题，”工程师说，“我昨晚考虑了这个问题，这会很困惑。”


    “这是一个很好的观点吗？”产品负责人问，“你认为这是我们可以处理的吗？”


    “我不确定，”工程师说，“网站的结构，帮助页……”


    “嗯，这将是一个棘手问题，”初级工程师说。


    “我们需要大家在这里讨论这个问题吗，”Scrum Master 问，“还是我们可以私下讨论？”


    “我不知道，”产品负责人说。


    “是的，我们可以私下讨论，”初级工程师回答道。


    “好的，太好了，”Scrum Master 说，“既然如此，站会结束了。”


    当其他团队成员回到办公桌继续工作项目时，Scrum Master 走向产品负责人和两名工程师，他们正在讨论帮助页。


    “我们三个人现在讨论这个，还是想稍后跟进？”Scrum Master 问。


    ## 执行 Scrum 流程


    “我想我知道问题所在，”产品负责人说，“我可以写一个故事来解决我想象的方法。”


    “我们要把它作为一个新故事添加吗？”Scrum Master 问。


    “对我来说这像是范围蔓延（scope creep),”第一个工程师说。


    “不，我认为原始故事的验收标准已经包含了，”产品负责人说，“这些是网站页面，我们需要像处理其他任何页面一样处理它们。”


    “让我们检查一下验收标准以确保万无，”，”四个人一起来到电脑前，打开 Scrum 看板，查看团队估算的故事的验收标准。事实上，验收标准说，支持小狗测试用户的头部更改需要适用于网站的所有页面，而不区分帮助页。


