    ## 模块化开发


    Scrum 支持以模块化的方式开发项目。因为 Scrum 是基于功能分片的思维方式，它非常适合创建独立的、可操作的特性，这些特性可以原子化的方式进行开发，并和谐地工作在一起。


    例如，网站的一个新章节可以从共享样式和 CSS 结构继承样式，并可能从共享模板继承其功能。构建该章节的工作依赖于其他组件保持足够长的时间以完成工作。Scrum
    提供了支持这种稳定的稳定性，而不会限制网站其他部分的开发。


    同时，更新产品的基础设施以支持新功能可能会在过程中的任何时候发生，因此团队必须预先考虑如何安全地进行这些更改，而不会破坏在其他功能上完成的工作。


    另一个例子是，有时网站的每个功能都依赖的 API 可能需要进行更改。Scrum 鼓励团队以模块化、可测试的方式管理代码，这样更改就可以被可能进行中的其他功能故事（feature
    stories）继承，而不会导致不必要的破坏。


    ## 灵活调度


    为 Web 和移动领域客户服务的公司需要能够快速响应变化。然而，工程师们需要确信在完成功能开发之前，他们工作的内容不会发生变化。要平衡这两个目标可能是困难的。


    Scrum 提供了足够长的窗口期，允许 Web 或移动功能被完全开发，同时允许产品在每个迭代（sprint）结束时根据市场数据改变方向。


    ## 反思与改进


    Scrum 团队不仅关注改进产品：他们还关注改进自己的流程。Scrum 团队在估计自己能完成多少工作方面变得越来越擅长，并改进工作方法，以发挥最大的效率。


    ## 简介 Scrum 11


    通过赋予团队机会审视自己的流程，并找出如何更好地协作工作，Scrum 最大程度地利用了任何组织的有限资源。


    ## 总结


    以上是对 Scrum 的快速概述，是从 30,000 英尺俯视角的角的。我们简要介绍了 Scrum是如何运作的，以及为什么它对某些类型的产品开发是有效的。我们将
    Scrum 与更传统的软件开发瀑布模型方法进行了对比，并讨论了它为什么在那个时候出现。我们还注意了 Scrum 多么适用于 Web 和移动开发项目。


    但 Scrum 不仅仅是一个抽象概念和一堆不熟悉的术语。Scrum 是一种实用且灵活的产品开发方法，它依赖于真实人的积极参与。因此，在下一章中，我们将认识几位可能在
    Web 或移动开发组织工作的典型人物。我们将与他们谈谈一些挫败感，找出他们希望从 Scrum 中获得什么，并询问他们在考虑 Scrum 时的顾虑。


    在我们阅读这本书的过程中，请记住这些人。我们将再次见到他们，并跟踪他们从学习并开始将 Scrum 应用于工作中的过程。


