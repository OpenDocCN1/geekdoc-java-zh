    # 发生了什么？


    演示结束后，冲刺结束，团队与敏捷大师坐在一起进行冲刺回顾（retrospective）。目的是让大家讨论上一个冲刺中哪些做得好的地方，哪些可以改进，以及他们认为未来应该对流程做出哪些更改。


