    # 团队资源


    Scrum 团队并非在真空环境中运行。通常会有一个围绕 Scrum 运行的组织，它通过提供 Scrum 团队产出工作所需的资源来支持其工作。Scrum 团队与组织的其余部分之间必须维持着一种双向关系，以便双方都能从这一流程中获益。


    仅仅组织及其层级结构不应对 Scrum 的仪式、产产物和角色产生任何影响；Scrum 对外部组织的结构没有正式的意见。Scrum 既可以在一个具有明确头衔和角色的紧密结合型团队中成功存在，也可以同样容易地在“全宜制”（一种没有任何指挥链的组织）中运行。只要
    Scrum 团队能够获得其工作所需的资源，并能通过产出组织想要的结果来证明其存在的合理性，这种关系就是可以维持的。


    关于如何提供资源团队所需的资源，有时会有不同的意见。解决这一问题的敏捷方法是尝试一种方式，观察其运行效果，并通过迭代找到产出最高的方法。


    特别是对于大多数表现良好的 Scrum 团队以及移动开发团队来说，他们发现需要的一些关键资源并没有被正式定义为 Scrum 的一部分。


    # 设计师


    任何 Web 或移动项目的关键输入都是设计师，他们帮助建立项目的用户体验、流程和视觉一致性。随着设计优先的趋势日益增强。


    # QA 工程师（质量保证工程师）


    质量保证是团队每个成员的责任，但大多数组织都有专门受过创建和管理测试套件技术培训的专业人员。对于 Web 和移动工作，这可能是一个错综复杂的过程，涉及模拟各种设备和浏览器行为的工具，以及跟踪产品常见和不常见路径的自动化技术。


    QA 工程师可能会被隔离在自己的小组中，独立于开发产品的团队进行工作。在这种情况下，与团队的协调至关重要。除非及早考虑 QA，否则 Scrum 团队可能会发现自己在冲刺演示（sprint
    demo）会议之前忙于完成用户故事，然后在最后时刻将大量工作堆给 QA 团队。与设计师类似，QA 工程师有时会被分配一个单独的迭代来进行测试。


    将 QA 与开发隔离开最大的问题是，工程师们可能会在上一个故事被验证之前就自自地接受列表上的下一个故事。在 Web 和移动开发背景下，即使用户故事在技术上是独立的，它们通常也会以微妙的方式相互构建。这可能导致这样的情况：由于测试先前的故事时发现的不一致之处，需要重新完成一个新的故事。理想情况下，QA
    应该被视为团队对任何故事“完成”（done）定义的一部分。这意味着 QA 工程师应该在开发者创建代码的同时开始为故事编写测试用例。故事的 QA 周期应该是冲刺的一部分，开发故事的开发者在
    QA 完成之前不应放弃。


    在某些团队中，QA 工程师直接整合到团队中。这提供了许多优势。开发工程师和 QA 工程师的技能和培训是互补的，这两个角色的人可以通过相互配对来学习更多他们所使用的技术和方法，从而在职业上受益。拥有集成
    QA 工程师的团队自然地将测试和验证视为完成一个故事的工作，并确保故事的大小划分合理，包含了这些内容。


    # 运维


    负责网络运行和为公司提供技术支持的人员通常与产品开发团队属于同一个工程部门。因此，一些公司尝试将这些团队的人员整合到他们的 Scrum 流程中。但组织的结构不应影响
    Scrum 团队的需求。


    除非有充分理由，否则将运维工程师整合到产品开发 Scrum 团队中可能是糟糕的做法。虽然运维人员是受过培训的工程师，但他们处理的职责应该独立于产品开发过程。保持网络运行、计算机工作和服务器在线是一项持续性的工作，其挑战性与产品开发不同。与设计或客户服务类似，将运维视为一个独立的团队可能是务实的做法，也许可以使用看板（kanban）方法来帮助他们管理可持续的工作流和优先级排序。


    '
