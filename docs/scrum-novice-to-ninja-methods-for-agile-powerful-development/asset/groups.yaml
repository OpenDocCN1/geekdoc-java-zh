    ## 动机


    我投身工程行业是因为我喜欢与计算机打交道。当他们给我机会参与 WithKittens.com 项目时，我非常兴奋，因为这是一个非常受欢迎的网站。这种经历会让我的简历看起来很出眼。我想做一些能让我感到自豪的项目。而且真的，我想向其他工程师学习。有时我会被周围有这么多才华横溢的人惊讶，我一直在想，我什么时候才能拥有和这些其他人一样的技能组合。


    ## 完美的一天


    大多数日子都是从完成前一天的工作开始的。我通常有一份很长的任务清单需要完成。任务堆积在我面前，我翻看清单，尝试一个一个地处理，直到完成。在好的日子里，我可以完成四五项任务，并在大家回家之前让它们进入评审阶段。在糟糕的日子里，我发现自己对着同一个任务苦干几个小时直到傍晚。但从某种意义上说，好的日子也是——那些让我有机会进一步了解
    WithKittens.com 背后的代码的日子。总之，我喜欢我所做的工作。


    ## 挫败感


    我觉得我最大的挫败感是感觉自己像个冒充者。有时我不敢相信他们给了我这份工作。和我一起工作的人似乎经验丰富得多，他们对问题的回答很有深度，而这些问题我完全不知道该如何回答。我在这不同公司工作的经验并不多，据我所知，这里的大多数人对工作都相当满意，所以我我不抱怨加班。我只是希望自己有机会做一些比他们分配给我的小任务更多的事情。有时感觉自己就像被困在
    CSS 的贫民窟里，而我知道如果给个机会，我可以做得更多。


    ## 对 Scrum 的担忧


    我读过一点关于 Scrum 的知识，我很奇当我们开始执行时会是什么感觉。现在我们有一套行之良好的流程。我知道我被期望要做什么，只要我完成了工作，一切都会进展得很顺畅。我听说在
    Scrum 中有很多讨论。我不是那种健谈的人。我倾向于安静地坐着完成工作，我不觉得自己有足够的知识来分享很多观点。我有点担心 Scrum 会把聚光灯打在我身上，强迫我走出超出我舒适范围的壳。


    ## 工程经理


    ### 我的角色


    我来到 WithKittens.com 时是一名高级工程师。在上一任经理离开后，我被晋升经理。作为经理，我负责确保我的团队拥有他们所需，并确保每个人都在他们应该做的事情。我向高级管理层汇报，必须为团队预算辩护，并提供报告证明我们正在做公司需要要做。有时我必须充当裁判，有时我必须做出一些艰难的决定。这是工作的一部分。这不像当工程师那么有趣，但在当时看来似乎是一个晋升的好机会。


    ### 动机


    我非常喜欢我的团队。我雇了他们一半的人，其他人大部分在我来到这里时就在这里工作了。我喜欢想，我所做的一切都是为了他们。我的工作是让每个人保持投入、有工作做并且满意。同时，我对代码如何演进有一些想法，我喜欢确保我的影响力在其中。从本质上说，是一个工程师，我喜欢与才华横溢的工程师合作。


    ### 完美的一天


    我最好的日子是最安静的日子。作为经理，我经常被要求解决与组织、行政甚至人力资源有关的问题。我享受与团队成员进行一对一会面的机会，并并尝试根据工作量安排这些会议。大多数日子的开始和结束都是查看团队正在工作的概览，这样我可以确保工作分配均匀。有时，这既是一门艺术，也是一门科学。


    ### 挫败感


    作为经理，我负责团队的所有人员和预算决策。我决定预算如何支出，我必须确保提供足够的预算，以维持团队拥有完成工作所需的一切。有时感觉我花了一半的时间向高级管理层辩护预算，另一半时间在解释为什么我们没有足够的预算来完成某些每个人知道应该做的事情。管理的责任还包括处理人际关系问题。人力资源部门可以发布他们喜欢的任何备忘录，但并没有手册可以教你如何让人们和平共处。


    ### 对 Scrum 的担忧


    我听到的关于 Scrum 的描述是他们谈到了自管理团队。这让我有点担心。毕竟，我在团队中的角色是管理。我不喜欢认为某种新流程的引入会绕过我的权威。对于经理在
    Scrum 中做什么，我还没有清晰的认识。我读过的很多关于 Scrum Master（Scrum 师）、产品所有者团队成员的内容——它们没有提到经理如何融入其中。


    ## QA 工程师（测试工程师）


    ### 我的角色


    在 WithKittens.com 这样的网站上，有很多工作要做。作为质量保证工程师，我需要关注网站的各个方面，以确保代码演进时不会出错。我的工作非常注重细节。我依赖某些测试工具，以便在功能更新时确保通过测试。部门的其他人并不知道如何工作。


    ### 动机


    有时我被屏幕上的绿点所驱动。当我运行测试套件并看到每一项测试都通过时，会有成就感。但发现那些其他人没有发现的细微 Bug 也是非常有意义的。我尝试测试每一个功能，找出边界情况。例如，如果用户输入一个数字，或者在没有数据的情况下提交表单会发生什么。如果我工作得好，就能让工程师们保持警惕。


    ### 完美的一天


    我最喜欢的情况是有一个定义良好的项目可以测试，并且我正在构建一套测试。我获取代码，运行测试，如果任何一项失败，我会编写报告并通知工程师。在开发新功能时，编写涵盖所有顾虑的测试既有趣又具有挑战性。


    ### 挫败感


    作为报告代码存在问题的人，有时我感觉自己是坏消息的传递者。我的工作在流程的最后，在工程师完成所有工作之后。通常我需要从工程师那里获得他们开发代码的答案以便进行测试。当他们转向下一个任务，并且没有时间回复我所需的信息时，这令人沮丧。当有截止日期时，我也会被要求快速完成工作。这意味着我可能会漏掉一些
    Bug。


    ### 对 Scrum 的担忧


    我不确定 Scrum 与我有什么关系。我读到的关于 Scrum 的大部分关于代码如何开发，而不是如何测试。我对在 Scrum 环境中工作持开放，但我作为 QA
    工程师的角色并没有转化为工程师在团队中做的工作。WithKittens.com 的 QA 结构涉及我向 QA 经理汇报，而不是工程团队经理汇报。我不确定我将如何融入。


