    Web and mobile technology moves too fast for a waterfall approach. By the time
    you''re developing a solution to one problem and gathering feedback from users,
    the technology has already moved on, and you may have a very small window of opportunity
    to capitalize on your solution.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_24_0.png)


    Figure 1.1. Waterfall


    In a waterfall approach, the ideas for what needs to be developed may come from
    customers, from the executives, from market research, or from the imagination
    of people making the decisions and setting the budgets. Those ideas are passed
    on to product managers, who create a large product roadmap. They establish and
    collect requirements, use out classic product requirement documents, and then
    pass those requirements to designers to create prototypes as wireframes and mockups.
    Those prototypes are passed on to an engineering team that implements those ideas,
