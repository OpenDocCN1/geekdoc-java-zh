    ## Scrum 简史


    Scrum 的最初概念源于日本，由 Hiroaka Takeuchi 和 Ikujiro Nonaka 在 1986 年《产品开发游戏》（New Product
    Development Game）中引入。他们借鉴了橄榄球的 Scrum 概念来描述跨职能团队组织。


    他们的概念由 Ken Schwaber 和 Jeff Sutherland 在 1995 年的一次联合演示中被规范化为 Scrum 方法论，基于他们在自己的组织中应用这些概念的个人经验。这项工作启发了
    Schwaber 和 Mike Beelde 在 2001 年编写的《敏捷开发》（Agile Development with Scrum）。


    当时，最流行的软件开发方法被称为瀑布模型（waterfall model）。在瀑布模型中，产品开发分阶段进行，从需求到设计、实现和发布顺序执行。直到 90
    年代，绝大多数软件开发都是针对桌面电脑的包装软件。计算机有很长的开发和发布周期。虽然瀑布模型适用于具有长期开发轨迹的产品，但它并不适应需要不断变化的情况。


    在 20 世纪 90 年代后期，出现了涉及电子媒体和互联网的新出版模式。为了支持这些，软件开发组织必须引入更多的活性，以适应变化的浏览器、紧迫的媒体截止日期以及具有不同要求的各种平台。不久，运行在桌面电脑上的大型单体应用程序开发让位于通过移动设备交付的更小、更灵活的
    App。开发这些 App 需要一种不同的方法。


    敏捷方法被规范化并迅速流行的时期，恰是市场从桌面软件转向 Web 和移动软件的时期，这并非巧合。


