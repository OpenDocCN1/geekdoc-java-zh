    # Releasing the Stories


    Releasing is the process that takes completed features and integrates them into
    the live product, so either the users can have access to them immediately, or
    so they can be evaluated for inclusion in a future release. The process may be
    overseen by release engineers, or integrated at the developer level with a set
    of fail-safes and rollback procedures.


    Web and mobile teams have many options when it comes to releasing. For teams,
    releasing a story to the customer as soon as it''s completed—sometimes several
    times in a single day—makes perfect sense. For others, the release process is
    more complicated, and it makes more sense to group stories from a whole sprint,
    or even utilize larger releases.


    **Continuous integration** is an approach that supports releasing stories as they''re
    completed, rather than waiting for the end of the sprint. This usually depends
    on a robust test suite and an orchestrated set of release scripts. For teams continuous
    integration, the release of the stories into the live product will already have
    been done as part of completion the stories themselves, and no further steps be
    needed after the demo.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_91_0.png)


    > Using Continuous Integration

    When a team has chosen to do continuous integration, it''s important that the
    engineers working on a story not abandon that story until it has been released,
    and demonstrated not to introduce any problems in the live product. While this
    can result in some downtime for engineers, that time can sometimes be applied
    to stories relating to maintaining and improving the code base.


    For teams not continuous integration, there will be another task needed to release
    all the stories from the sprint into production. The tasks associated with the
    release process are usually considered part of the definition of done for a story,
    but in this case they may need to be completed after the demo.


    Some teams regularly schedule releases at the start of each sprint. Others do
    releases more frequently, or may release only at certain times of the year, or
    on a schedule to coordinate with certain events related to the needs of the larger
    organization or the marketplace. Figuring out how to plan and schedule releases
    is an opportunity'
