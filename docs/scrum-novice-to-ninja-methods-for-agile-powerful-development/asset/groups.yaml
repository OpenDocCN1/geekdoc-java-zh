    no formal organizational authority over the team, otherwise the team may feel
    inhibited about raising issues with the scrum master because of the potential
    ramifications.


    # Responsibilities


    There are a few critical rituals that a scrum master must observe. At minimum,
    these include the daily standup, the sprint planning meeting, the end-of-sprint
    demo, and the sprint retrospective. We are getting into more detail about these
    rituals soon.


    In addition to hosting the rituals of scrum, a scrum master is responsible for
    coaching the team through the scrum process. This may involve stepping boldly
    into discussions about individual roles and duties, and helping people communicate
    their needs and expectations in a way that makes them understandable. In sense,
    a scrum master can become a team''s advocate, counselor, and liaison to other
    parts of the organization.


