  mdcn: '

    名称：简明易懂的功能名称


    - 作为一个用户

    - 我希望执行某项行为

    - 以便实现该行为的理由


    验收标准：


    - 给定一个定义的状态

    - 当满足一组条件或事件时

    - 得到一个一致且可测试的结果


    > 什么是好的故事（Story）？

    一个故事应该是短小且直接的。许多 Scrum 团队遵循惯例：故事应该写在三英寸乘五英寸的索引卡的一面，并将验收标准写在同一张卡片的背面。如果编写一个故事需要花费过多的信息，说明规范可能过于详细，或者故事可能太复杂，可能需要将其拆分为多个故事。


    例如，考虑一个正在开发画廊应用程序的团队。画廊的访问者可能想对显示的图像进行评分，以便跟踪他们的喜爱。画廊无论有无评分功能都可以运行，因此这项工作可以作为一个完整的功能切片被隔离。根据工程师的，添加评分组件涉及的工作可以在单个冲刺（Sprint）内完成。


    这就是一个故事可能的编写方式，以便团队对其进行评估、估算，并承诺在冲刺待办列表（Sprint Backlog）中完成：


    名称：画廊图像评分


    - 作为一个画廊访问者

    - 我想对图像进行评分

    - 这样我可以跟踪并排名我评分过的图像


    ## Scrum：从新手到大师


    验收标准：


    - 给定一个已登录的用户正在查看画廊

    - 当用户点击某个图像评分组件中的星级时

    - 则该星级的值应记录为该用户对该图像的评分


    和


    - 给定一个已登录的用户正在查看画廊

    - 当显示用户已评分的图像时

    - 则评分组件应反映该用户之前输入的评分


    和


    - 给定一个已登录的用户正在查看画廊

    - 当“收藏”开关被打开时

    - 则只显示用户已评分的图像，并按评分从高到低排序


    对于像这样的故事，团队可能有一套附带在故事上的标准线框图（Wireframes）或设计方案，并与其进行沟通。例如，如果这是一个新组件，设计师可能已经准备了一个模型图（Mockup）和一组工程师实现该功能所需的资源。产品可能还有一份样式指南或其他文档，需要用相关信息进行更新。


    故事与工程决策无关，例如 API 如何设计，或者在代码中使用哪些命名规范。虽然团队的完成定义（Definition of Done）可能需要创建关于此类技术方面的文档，但产品所有提出的故事通常不需要对这些点持有意见。


    当故事在冲刺计划（Sprint Planning）上提出时，工程师应该验证所有必要的资源和信息都已捕获并可用。即将进行的冲刺中要完成的实际工作由故事卡片上的描述以及产品所有与团队之间产生的对话所定义。


    ## 产品待办列表（Product Backlog）


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_105_0.png)


    图 5.2. 产品待办列表


    开发团队的故事源于产品所有的产品待办列表。产品待办列表记录了产品所有从客户那里获得的关于产品方向的所有输入，以及产品所有收集的调研、经验测试、设计和工程反馈。


    与冲刺待办列表的故事不同，产品待办列表的项不需要以任何特定方式结构化。它们的主要目的是让产品所有能够跟踪所有需要的功能。这些产品项在结晶为冲刺待办列表的清晰开发故事之前，可能相当模糊。产品待办列表中的项应该始终反映产品所有对产品长期目标的最新思考，而团队正在处理当前增量中的特定功能。


    ## Scrum：从新手到大师


    ## 产品待办列表是产品所有者的责任


    虽然产品所有可能选择定期与团队共享整个产品待办列表，但这里的项是产品所有者的责任。反复提醒团队产品待办列表中那些久未触碰的项可能是没有成效的，因为这会分散他们对完成当前增量所需要工作的注意力。


    虽然许多产品所有者倾向于跟踪产品待办列表中的项，就像它们将成为最终故事一样，但产品待办列表中的项与进入冲刺待办列表的故事之间并不一定有一一的对应关系。产品所有需要跟踪的功能和需求可能会变成多个故事，或者可以将几项合并成一个具有适当开发规模和范围的统一故事。


    例如，如果客户需要为网站添加一个支付系统，这对于开发团队来说可能是一个故事，也可能是多个故事。可能会有关于通过服务接受支付能力的开发者故事，以及关于接受信用卡、支票，甚至是维护一个可以使用虚拟货币进行购买的令牌系统的独立故事。可能独立地开发其中的每一个，并只通过其中一个发布系统。无论先推出哪一个，都需要承担所有其他功能共享的一些核心功能的实现。


    许多产品所有发现发现使用分阶段过程来跟踪产品待办列表项的状态是非常方便的，通过这种过程，项从构思经过设计到工程验证，直到准备好被表述。


    ## 在故事准备好之前不要编写故事


    产品所有者过早详细地编写故事是一个错误，而且这些故事很容易过时。在故事准备好之前编写故事可能会浪费产品所有者的时间。产品待办列表中的项应该保持模糊和灵活，以便能够适应。


    ## 冲刺待办列表（Sprint Backlog）


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_107_0.png)


    图 5.3. 冲刺待办列表


    冲刺待办列表是团队在冲刺期间承诺的故事。冲刺待办列表是在冲刺计划的一部分创建的，反映了团队对工作的共同理解。待办列表中的故事遵循我们之前描述的结构。


    ## Scrum：从新手到大师


    当前冲刺的待办列表大小基于冲刺计划期间的谈判。每个故事在冲刺计划期间进行估算，整个待办列表代表了团队认为可以完成的总点数。每个故事都有一个点值，反映了团队认为完成该故事所需的工作量。


    冲刺待办列表中的故事顺序最初在冲刺计划期间建立，但产品所有有权随时更改冲刺待办列表的顺序。产品所有可能不会向冲刺待办列表添加故事或移除故事，但可以根据需要重新排列，以指示哪些故事最重要的。


    ## 在冲刺期间对故事进行重大更改


    如果需要对冲刺待办列表的故事进行重大更改，且真的无法等到冲刺结束，Scrum Master 应该停止冲刺并启动一个新的冲刺，进行新的冲刺计划。由于中断和成本，这是一个非常激进的选择。它应该作为最后手段，或者当显然当前冲刺待办列表的工作都不符合已变化的需求时。


    冲刺期间，开发者每当完成一个故事并需要新任务时，就会从冲刺待办列表的顶部选择故事。每个工程师都应该选择待办列表顶部的故事，因为那是产品所有认为在当前冲刺中优先级最高的。选择不是待办列表顶部的故事将导致工作超出优先级顺序。

    '
