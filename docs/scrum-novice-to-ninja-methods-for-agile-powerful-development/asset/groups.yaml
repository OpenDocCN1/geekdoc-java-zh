    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_152_0.png)


    图 8.5 冲刺 11 的新任务


    # 冲刺的剩余部分


    在冲刺结束时，团队大部分成员都投入到了“小狗故事”中，但没有其他太多任务完成。设计人员已完成了前端用户体验流程和图像资产，并与工程师协作确保它们得到了适当的集成。


    当团队编写代码时，质量保证（QA）正在开发必要的测试来验证代码。QA 还多次与产品所有者（product owner）见面，以澄清验收标准。最终，每项任务都从看板上从“进行中（Progress）”移动到“待演示（To
    Demo）”。


    # 执行 Scrum


    ### 引入第三名工程师进行代码审查


    由于该故事中的许多任务是由结对完成的，因此需要第三名工程师参与代码审查。并不是每个团队都要求结对完成的代码由第三名工程师审查，但这个团队将其包含在“完成定义（definition
    of done）”中。


    尽管需要支持帮助页面，团队还是成功完成并审查了所有符合他们要求的代码。由于为了区分这些代码与网站的其他部分，他们采用了一些特殊的命名规范，代码审查过程中出现了一些混乱。这稍微减慢了开发速度，但不至于阻碍负责故事的初级工程师在冲刺结束前将其交付给
    QA 进行最终检查。


    该团队的“完成定义”包括代码审查和 QA 测试，以及客户验收。由于 QA 从一开始就融入了团队，他们在整个冲刺期间一直根据验收标准构建测试套件。


    该故事的大部分任务在完成后都产生了经过审查的代码，可以独立进行单元测试。现在只需运行集成测试，并验证功能从头到尾按预期运行。如果故事被接受并推送到生产环境，这些测试将添加到网站的通用套件中。


    # 演示故事


    在演示前一天，作为准备工作的一部分，产品所有者与“小狗故事”的初级工程师坐在一起。在冲刺期间他们已经多次过过各个组件，但产品所有者想要确保所有的验收标准都能得到演示。


    “我们能及时在生产就绪的服务器上妥善地演示这些吗？”产品所有者问。


    “基本可以，”工程师回答道，“那是 QA 一直在测试的服务器。演示应该没问题。”


    “我需要了解什么特殊的吗，”产品所有者说，“还是我可以直接去我们现在使用的那台服务器？”


    “我现在可以过一遍全部吗？”产品所有者问。


    “还不，”工程师回答道，“但 QA 已经通过了所有测试，我们只需要在明天之前完成部署。它应该能在演示前准备好。”


    “太好了，我很期待看到它，”产品所有者说。


    # 检查验收标准


    在演示会上，所有人到齐了，包括 QA 工程师和负责“小狗故事”的设计师。大家对结果如何非常好奇。Scrum 看板显示冲刺期间进行中的所有故事都已准备好演示：


    | 冲刺 11 - 演示 | 冲刺待办列表 (BACKLOG) | 进行中 (IN PROGRESS) | QA 中 (IN QA) | 待演示 (TO DEMO)
    | 已完成 (DONE) |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | | | | 故事 10-4分: 2 | | |

    | | | | 故事 10-5分: 3 | | |

    | | | | 故事 10-6分: 3 | | |

    | | | | 故事 11-5分: 3 | | |


    图 8.6 冲刺 11 准备演示


