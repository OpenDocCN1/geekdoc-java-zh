    Estimating the effort involved in doing the work to complete a story is also part
    of the team’s responsibilities. As a team works together and gains experience
    with different stories, they should begin to develop a shared and subjective scale
    of relative effort involved in stories of a similar nature. The effort, usually
    measured in arbitrary points, is assigned by the team to establish how much work
    they can do within a timeframe. That helps the product owner plan how quickly
    new features can be completed.


    The team is expected to push back against any attempts to sacrifice quality for
    the sake of speed, given the practical constraints of the project. Additionally,
    the team should be tracking the overall quality of the codebase, and proposing
    stories that would refactor the existing code to enhance maintainability, or to
    support emerging technical standards. Keeping the code clean, self-documenting,
    and internally consistent helps everyone on the team together more effectively.


    Every member of the team is also responsible for maintaining the scrum process
    for every other member. If anyone interrupts the standup, or tries to introduce
    changes to a story in the middle of a sprint, every team member should feel authorized
    to interrupt that behavior. Anyone on the team should have the authority to point
    out when scrum sidestepped.


    It’s critical for team members to take this responsibility for their fellow team
    members seriously. The power of scrum is in the dynamic it creates among a group
    of people. Failing to defend the scrum process is letting the other team members
    down.


