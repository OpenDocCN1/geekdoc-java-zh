    # Scrum 合约 105


    使其永久化——直到有人在后后的回顾会议上提出了一个充分的理由来更改它。如果人们不喜欢改变，他们就有机会在下一次回顾会议中提出这一点，并可能阻止实验继续进行。


    反思性迭代允许运行良好的团队能够继续运行和改进，让存在问题的团队能够识别并调整这些问题。流程中的所有事情都取决于团队的共识。因为总会有下一次回顾会议的到来，如果某些事情不起作用，将会有另一个机会重新审视任何决定并转变方向。


    # 遵循共同定义


    Scrum 鼓励人们共同工作而不是单打独斗。为了使这种工作变得高效且不具有压迫性，人们需要对工作背景的共同定义达成共识。如果没有一个所有人都能同意的通用词汇，团队将无法管理，Scrum
    的用处也将微乎其微。


    Scrum 为组织定义了一系列新术语，如冲刺（sprint）、故事（story）、产物（artifact）等。这其中的价值之一是，每个组织都有机会获取这些新术语，并以对它们最有效的方式使用它们。这并不意味着打破
    Scrum 的核心标准，但确实意味着每个团队对于如何选择在这些定义内部进行运营达成了有意识的协议。


    我们讨论的词汇是每个团队所独有的。虽然故事（stories）、每日站（standups）和分值（points）等共同概念在所有 Scrum 团队中可能是是的，但每个团队如何编写故事、每个团队如何管理其每日站，以及每个团队如何选择分配分值，都是该团队主观且不断演变的属性。


    例如，每个团队都需要为自己定义的唯一概念就是“完成定义”（definition of done）。Scrum 的产物之一就是完成定义，在定义中，团队可以对故事从开发阶段移动到验收阶段需要满足的标准达成一致。除非每个人都对一个故事什么才算“完成”有清晰的理解，否则对于如何处理一个故事以及在流程的每个阶段需要发生什么，可能会产生分歧。


    Scrum 并不尝试为团队定义什么是“完成”，但 Scrum 期望团队创建并共享一个所有人都能同意的自己的“完成定义”。Scrum 提供了松散的指南，并允许团队在定义自己的标准时具有很大的灵活性，以便他们发现自己通往可持续生产力的道路。


    # 总结


    在 Scrum 团队工作需要意愿。每个人都需要愿意承担他们正在做的工作，尊重定义每个人角色的边界，共同努力定期迭代和改进流程，并就大家将如何共同工作的定义达成共识。


    在记住这些概念的情况下，在下一章中，我们将观察一个正在特定项目的特定团队。它是我们之前见过的同一个团队，来自 WithKittens.com 网站，但现在他们正开始作为一个
    Scrum 团队的一部分开始工作。我们将展示该网站的新故事将如何从产品待办列表（product backlog）中的想法发展，以及团队如何评估这些故事以查看它们是否合理，以及它们需要多少精力。


