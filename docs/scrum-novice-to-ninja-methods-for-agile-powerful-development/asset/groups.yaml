    Scrum 时的顾虑。现在是时候查看实际的 Scrum 流程了。


    要做到这一点，让我们从最开始。在本章中，我们将遇到一位产品负责人（product owner），并学习一个现有网页和移动产品变更的想法如何从通用想法变为具体的用户预期，最后变为团队可以开始处理的故事。


