    # 发布故事（Stories）


    发布是将已完成的功能集成到现有产品中的过程，这样用户就可以立即访问这些功能，或者可以对其是否将其纳入未来的发布中进行评估。该过程可能由发布工程师监督，或者在开发人员层面通过一套安全机制和回滚程序进行集成。


    Web 和移动端团队在发布方面有许多选择。对于某些团队来说，在故事完成后立即将其向客户发布——有时在一天内会发布几次——是完全合逻辑的。对于其他团队来说，发布过程更为复杂，将整个冲刺阶段（Sprint）的故事进行分组，甚至利用更大规模的发布更符合逻辑。


    **持续集成**是一种支持在故事完成时就发布它们的方法，而不是等待冲刺结束。这通常依赖于稳健的测试套件和一套编排良好的发布脚本。对于采用持续集集的团队，故事向线上产品的发布已经作为完成故事本身的一部分完成，在演示后不再需要额外的步骤。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_91_0.png)


    > 使用持续集成

    > 当团队选择进行持续集成时，负责某个故事的工程师在该故事发布并证明其不会给线上产品引入任何问题之前，不要放弃该故事，这一点至关重要。虽然这可能导致工程师出现一些停机时间，但这些时间有时可以用于与维护和改进代码库相关的故事。


    对于不使用持续集的团队，还需要另一个任务来将冲刺阶段的所有故事发布到生产环境中。与发布过程相关的任务通常被认为是故事“完成定义（Definition of
    Done）”的一部分，但在这种情况下，它们可能需要在演示之后完成。


    有些团队会定期在每个冲刺阶段开始时安排发布。其他团队的发布频率更高，或者可能只在年的特定时间发布，或者根据与大型组织或市场需求的某些活动相关的时间表进行发布。确定如何计划和安排发布是团队反思和迭代其流程的机会，以找到最适合他们且最能满足产品所有者目标的节奏。


    # 按照发布计划工作


    无论实际的发布计划如何，团队中的每个人都理解“将发布的只有已完成的内容”是非常重要的。Scrum 并不是为了满足预定的时间表而匆忙于完成特定的故事。Scrum
    的核心是以可持续的节奏工作，了解团队的能力，并在准备就绪时发布已完成的内容。


    任何为了满足发布时间表而将新故事塞进特定冲刺的努力都应该受到团队的抵制。如果日期无法调整，产品所有者应该做好妥协的准备，决定哪些功能需要从计划发布中删除，以便为团队完成最关键的功能留出时间。


    # 冲刺回顾（Sprint Retrospective）


    如果每日站会是 Scrum 最标志仪式之一，那么冲刺回顾可能最代表敏捷哲学。冲刺回顾为团队提供了在每个冲刺结束时反思他们所做工作的机会，并确定未来希望如何修改流程。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_93_0.png)


    # 目标


    冲刺回顾将团队聚集在一起，考虑刚刚完成的冲刺对每个人来说进展如何。在仪式期间，房间里的每个人都将被要求说明哪些做得好，哪些做得不好，以及他们愿意作为一个小组做出什么承诺以在下一个冲刺中改进情况。目标是获得一组团队中所有成员都同意的用于下一个冲刺的流程修改方案。


    开发团队的所有成员、Scrum Master 和产品所有者都预期参加冲刺回顾。仪式由 Scrum Master 引导。


    > ![icon]()

    > 回顾会议中很少有访客

    > 很少邀请访客参加冲刺回顾。这样做是为了鼓励人们对冲刺期间可能发生错误的情况敞开心扉，并坦诚地表达他们的感受以及出现的问题。这种会议可能会带有情感色彩，而私密团队环境的亲密性提供了一个更具支持性的背景。


    # 时间箱（Time Box）


    团队可能会发现，他们在回顾上花费的时间与他们在冲刺演示（Sprint Demo）上可能花费的时间相似。对于一个为期两周的冲刺，团队投入半天时间进行回顾并不稀奇。在安排回顾时，在时间上留得宽裕是比较好的，以避免获得团队成员宝贵见解的机会。


    团队投入到冲刺回顾中的时间反映了他们对关注自身流程并在过程中不断改进的重视程度。有些团队可能会尝试限制在回顾上花费的时间。这可能会以沟通和改进为代价。Scrum
    最重要的方面之一是强调将讨论作为增强产品开发过程的手段。


    # 准备


    冲刺回顾可能是非常情绪激昂的。参与 Scrum 的每个人在参加仪式时都应该带着一些想法，思考冲刺期间可能发生了哪些他们想要评论的事情。对于某些人来说，这可能意味着列出一份长长的问题清单。


    Scrum Master 参加冲刺回顾时应带有一个议程，确保从所有参与者那里收集正负面反馈。确保每个人都有发言机会并做出贡献是 Scrum Master 的责任。


    > ### 确保回顾获得适当关注

    > 冲刺回顾是 Scrum 团队经常被缩短甚至被遗弃的仪式。这可能是流程出现问题的信号。如果对回顾没有给予足够的关注，团队就是放弃了改进的机会。通常，投入时间少、关注少的人是那些从现状中受益最多的人。确保这一仪式发生并获得团队每个人的适当关注，是表达关怀和关心的一种。


    # 哪些做得好？


    Scrum Master 应该询问房间里的每个人在冲刺期间哪些做得好。这通常通过绕场一圈让每个人报告一个或多他们做得好的事情来实现。除非这次冲刺是一场彻底的灾难，否则大多数人都应该能提出一些做得好的事情¹。


    让人们讨论哪些做得好的价值之一是将人们聚集在一起，并给他们一个机会去认可和感谢他们以及队友负责的良好工作。


    # 等待每个人都提出观点后再进行讨论


    虽然在会议结束之前应该鼓励每个人的参与，但在每个人有机会分享他们的清单之前，允许人们做出回应或讨论所提出的观点并不是一个好主意。Scrum Master 应该在之后提供进行更开放讨论的机会，但在这种深层讨论之前，给团队中的每个人一个发言的机会是最重要的。


    # 哪些做得不好？


    接下来，Scrum Master 应该绕场一圈询问人们报告他们在冲刺期间哪些做得不好。这是一个敏感的话题，因为人们可能会提出令人不安或不愉快的问题。


    和之前一样，应该要求每个人都参与。让人们对他们可能感到不舒服的话题给出诚实的回答是 Scrum Master 的技巧。如果有人真的不想发言，或者有不想在小组面前提到的想法，应该鼓励他们在仪式之外与
    Scrum Master 独立交流。


    ¹这个仪式之所以花费这么多时间的原因之一是因为每个人的参与都是至关重要的。不应该任何人被遗漏。


