  mdcn: '

    随着产品开发的进展，让运营部门（Operations）保持知情至关重要，这样任何可能影响服务和资源可靠可用性的产品变更都能得到考虑。一个优秀的 Scrum
    团队包含了工程师和产品所有者（Product Owners），他们能够识别何时何时可能对系统或网络负载产生影响，并征求合格运营工程师的意见，以帮助对用户故事（Story）进行规划。


    ## 运营与结对编程


    > 让运营人员脱离其职责来参与开发结对可能是不切实际的，但开发者偶尔与运营工程师进行结对编程，有助于增强他们对影响产品可用性问题的理解。


    ## 经理


    Scrum 的优势之一是团队有机会进行自组织，并弄出如何迭代地开发产品、进行测试、做出更改并在过程中不断改进。这意味着团队对自己的行为负责，并围绕以最有效的方式完成工作这一目标进行自我组织。结果，经理们有时会对自己在
    Scrum 组织中的角色感到困惑。


    Scrum 的自组织性质与公司的层级结构无关，尽管公司层级会为员工分配不同的角色和职责。Scrum 对组织的层级结构不应有任何意见，正如组织的层级结构也不应对
    Scrum 流程产生影响一样。


    在任何公司中，管理都是至关重要的角色。经理负责招聘、解雇、分配资源以及在整个组织代表员工。如果没有经理，当 Scrum 流程之外出现需要解决的问题时，员工将无处可求。经理通常对团队的生产力负责，包括向高级高管汇报结果，并证明
    Scrum 流程在运行中的价值。


    经理也可能以开发者的身份参与 Scrum 团队。通常，工程部门管理职位的人员对团队可能面临的某些问题具有更深丰富的经验。这些经理可能担任架构师或高级开发人员，并拥有可以分享的知识。在
    Scrum 团队内部，经理被视为开发人员之一，不享有比团队中任何其他开发人员更高的权限。


    ## 作为开发者的经理


    在某些组织中，经理的角色被视为轻蔑的对象。我们都可能见过《迪尔伯特》（Dilbert）漫画中那个留着尖头发的老板。Scrum 的优势之一是，它不在乎经理在
    Scrum 流程之外表现如何，只要提供了足够的资源来支持持续的 Scrum 流程。一个有效的 Scrum 团队应该独立于这种刻板印象运行，但在 Scrum
    团队中与经理作为同伴工作的机会也有助于改进 Scrum 沟通。


    团队中感到与经理作为同伴互动不适的员工，或者感到在 Scrum 内权威减少而感到不适的经理，应该与 Scrum 主（Scrum Master）讨论这个问题。一个强大的
    Scrum 主将具有处理管理和权威问题以及这些问题与 Scrum 之间关系的经验。


    ## 世界其他部分


    Scrum 团队并非在真空中运行。在 Scrum 团队之外，有一个组织出于某种原因需要开发某种产品。Scrum 主的职责之一是向公司的其他部分宣传 Scrum
    的价值。此外，还有责任确保 Scrum 真正服务于公司和 Scrum 流程利益者的需求。


    这些利益者包括公司内部的高高管、正在开发的产品的用户、可能委托创建该产品的客户（无论公司内部还是外部）以及公司内部的其他群体。


    从外部来看，Scrum 似乎是一个谜团。尽管强调透明性，但 Scrum 的术语可能会让不熟悉术语实际含义的人感到困惑。Scrum 创建的产物和图表似乎暗示了并不存在的意义。来自团队团队外部的任何困惑都可能影响
    Scrum 的稳定性，无论是在资源分配方面，还是在流程的故事流方面。


    ## 用户


    Scrum 团队最明显的利益者之一是产品开发旨在支持的用户群体。用户应该在几乎每一个故事中可见可见，即使该故事没有影响网站的前端界面，或没有出现在移动设备的屏幕上。管理员用户也是用户。填充内容的经理也是用户。任何与产品交互的人都是用户。


    对于使用 Scrum 方法开发的 Web 和移动产品，需要通过工具确保能够有效捕捉和跟踪用户体验。如果没有跟踪点击、手势、目标以及与关键功能交互的工具，产品所有者在决定下一步处理哪些故事最重要时将将更少的数据点供参考。Scrum
    的意图是支持一种敏捷流程，允许根据真实的用户需求对产品方向进行快速调整。


    ## 客户


    使用 Scrum 开发的产品客户可能是公司的客户，也可能是公司内部的部门。无论如何，与客户的直接互动是产品所有者的责任。强大的产品所有者将保护团队免受客户的影响，并保护客户不感到疏远。


    客户可能知道自己想要什么。通常客户会有一个想法，这需要通过 Scrum 流程来完善。这可能意味着与设计师进行几轮工作，可能并在产品开发过程中进行几次迭代。结果，通往现实的理想路径可能没有客户所希望的那么直接。产品所有者介入，让客户保持知情并满意，同时明确客户的愿景，直到团队可以高效地进行估算。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_67_0.png)


    一个优秀的产品所有者是团队与直接互动的混沌之间的坚实防线。这不是一个容易担任的角色，因为客户在付钱，或者为公司内部另一个部门工作。可能需要强大的 Scrum
    主的支持来帮助防御 Scrum 团队。如果团队觉得他们受到了客户的直接影响太大——这种影响没有通过产品所有者的适当过滤——他们应该随时联系 Scrum 主来帮助改进流程。

