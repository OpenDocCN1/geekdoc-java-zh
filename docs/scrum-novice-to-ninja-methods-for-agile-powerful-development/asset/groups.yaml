    But it''s also very satisfying to find those elusive little bugs that nobody else
    saw. I try to look at every specification for new product feature, and figure
    out the edge cases nobody is going to test. For example, if a user is supposed
    to enter a number, or a word, or submit the form without any data. I find out
    what happens if they enter a negative number. If I''m doing my job well, I''m
    keeping the engineers on their toes, and making sure they write code that''s resilient.


    # Perfect Day


    I like it best when I have a well-defined project to test, and I''m building up
    a set of tests that need to be run. I take the code, I run the tests, and if anything
    fails I write the report and let the engineers know. It''s interesting and challenging,
    writing tests that address all of the possible concerns when a new feature is
    being developed. Having the time to break apart a new feature, work out what the
    edge cases are, and build a test suite that''s very robust and comprehensive me
    feel like I''m doing my job.


    # Frustrations


    As one who reports there are problems with the code, sometimes I feel as I''m
    the bearer of bad news. My work comes at the end of the process, after the engineer
    has completed everything. Often I need to get answers from engineers about how
    they developed the code in order to test it. It''s frustrating when they''ve moved
    on to the next assignment, and they don''t have time to get back to me with the
    information I need. I also get pressured to do my work very quickly when there''s
    a deadline to be. That means some bugs I might have caught through.


