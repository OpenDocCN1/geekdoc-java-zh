    [content]

    # 总结


    Scrum 的角色已被明确定义，以确保平等成员之间存在权力平衡，并且所有以敏捷方式开发产品的职责都能得到处理。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_69_0.png)


    - Scrum 主管（Scrum Master）主持 Scrum 仪式，支持团队，并向 Scrum 内部和外部宣扬 Scrum 流程。


    - 产品所有者（Product Owner）维护产品的愿景和方向，并负责与客户进行交互。


    - 开发团队（Development Team）由工程师组成，他们通过组织自我来评估并执行构建产品的工作。


    现在我们已经回顾了 Scrum 中涉及的角色，在下一章节中，我们将查看他们参与的仪式。请观察这些角色的人员如何相互互动以支持他们的目标，以及他们所实现的稳健平衡如何帮助
    Scrum 团队保持高效生产。


    # 第 4 章


    ## Scrum 仪式（Scrum Rituals）


    在 Scrum 团队中工作的实践被组织成一系列仪式。这些仪式标记了执行冲刺（Sprint）工作过程中的关键事件。Scrum 主管有责任主持每项仪式，并确保他们专注于目标，为整个团队产生预期的结果。


    ### 什么是仪式？


    每个**仪式**（ritual）都是一次实时的面对面聚集，它让人们离开正在工作的工作，并提供了一个就该工作的背景进行针对性沟通的机会。Scrum 认为沟通优于文档，这就是为什么它为各种类型的有用面对面沟通提供了定期且定义明确的机会。


    ### 不要再开会了！


    许多在公司工作的人对会议产生“过敏”，这是有道理的。他们可能被过多的会议所淹没，会议占据了他们太多的时间，而且没有产生任何结果。他们可能习惯了召开会议来解决每一个微小的问题，而没有人负责确保问题得到解决。会议会带人们离开正在工作的工作，中断他们的注意力，而且往往无法提供太多的价值回报。


    让我们面对现实，大多数公司在开会方面都是*糟糕*的。


    与普通会议不同，Scrum 中的每项仪式都有特定的目标、针对特定的受众、完成目标所需的定义时间范围，以及一组可预测的结果。每个参加仪式的人都知道预期发生什么、如何表现以及承诺的结果应该是什么。Scrum
    仪式考虑了它们的整体目的，并尊重参与者的时间和注意力。


    ## 时间盒（Time Boxing）


    Scrum 仪式中最重要的概念之一是**时间盒**（time box）。主持仪式的 Scrum 主管有责任让每个人都确切地知道他们为这项仪式投入了多久，以及在仪式的任何一点他们还差多远。


    Scrum 主管通常会在房间前面的白板上写下时间，或者保持一个可见的大钟，以便每个人都能跟踪时间（我曾被记录带过一个标有“时间盒”的小立方体时钟参加仪式，并展示在大家都能看到的地方）。时间盒的概念赋予了仪式中所有活跃参与者力量，让他们在需要时互相鼓励奔主题，并专注于仪式的目标。


    > ### 每个时间盒应该多长？

    > 团队在每项仪式上花费的时间通常取决于每个冲刺分配的周数。唯一必须保持在 15分钟时间盒内的仪式是每日站会（daily standup）。团队需要在迭代和改进他们如何组织进行
    Scrum 的过程中，对每项仪式的时间盒达成共识。我在下方为团队提供了一些供参考的建议。


    Scrum 通过在每个仪式开始时确定时间盒是什么，以及这些时间如何分配给仪式的不同方面，表现出对每个参与者时间和承诺的尊重。预计所有参与者在仪式的时间盒内保持投入参与，并承诺如果没有良好且实际的理由，除非所有参与者同意延长，否则不会延长仪式。


    如果某项仪式似乎超出了时间盒，Scrum 主管应该请求大家继续仪式一段时间。这样每个人都预先知道要预算多少时间，而且如果需要延长预算，每个人都必须同意。


    当然，我们都是人，仪式期间会出现一些侧面问题，如果这些问题需要立即讨论的话。保持关注当前的仪式是 Scrum 主管以及团队其他成员的责任。优秀的 Scrum
    主管需要跟踪这些问题，并为了所有相关者的利益，对进行中的仪式时间盒保持尊重。


    确保重要的侧面讨论不丢失是共同的责任，但 Scrum 主管需要准备好在该过程中采取积极作用。如果人们确信以后可以重新捡起话题，他们会愿意放下离题讨论。


    ## 冲刺长度（The Length of the Sprint）


    在选择冲刺长度时，团队有一些选择。冲刺长度应该允许团队预计要处理的故事类型根据团队自己的“完成定义”（definition of done）在单个冲刺内完成。对于许多团队来说，仅持续一周的短冲刺与易于完成的短故事匹配。有些团队更倾向于处理更复杂的故事，这些故事无法在一个冲刺内完成，因此他们选择两周、三周、四周或更长的冲刺。


    冲刺长度是另一个可以根据团队反馈进行修改的因素，但对于团队来说，选择一个长度并坚持几个冲刺是很重要的。否则，团队可能永远从这种规律中获益，从而无法学习如何在各个冲刺之间一致地确定故事大小并正确地估计它们。通常，更改冲刺长度的选择仅仅可以通过改进故事编写的方式来解决，以便它们可以在一个冲刺内完成。


    ## 两周是一个良好的起点


    对于网页和移动端团队，两周的冲刺是一个很好的开始……即使你的故事倾向于是短且有限的，但一周一次冲刺也有值得考虑的缺点。一些较长的仪式每个冲刺会重复一次。一周一次冲刺意味着如此频繁地重复这些仪式可能会阻碍生产力。某些仪式，如回顾会议（retrospective），在某些周内甚至可能被缩减或跳过，这可能导致
    Scrum 迭代改进方面的崩溃。


    倾向于产生更复杂故事的团队可能更喜欢更长的冲刺。记住，超过两周的冲刺意味着问题需要更长时间才能暴露，对待办列表（backlog）的调整将需要延迟到冲刺完成。更长的冲刺还鼓励创建更复杂的故事。网页和移动端团队
    Scrum 的目标应该是创建简单且独特的故事。


    # Scrum 仪式 55


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_75_0.png)


    图 4.1. 两周冲刺周期


    此图表示了典型的网页或移动端开发冲刺的两周周期。每个较小的圆代表一个工作日，仪式是基于冲刺从顶部开始并每两周循环一次标记的。


    在接下来的几页中，我们将深入探讨每个仪式，确保你理解它们是如何工作的，以及它们如何应用于网页和移动端开发。

    '
