    a modified waterfall approach, using scrum techniques only for development. The
    rest of the organization structures itself around long-lived product timelines
    with static objectives. That may be an improvement over pure waterfall, in that
    it allows the engineers to iterate and improve their process, it doesn''t take
    full advantage of the potential of scrum. Isolating scrum inside the development
    loop without inviting the learnings of the team into the planning and market testing
    process is a waste of resources, and a wasted opportunity.


