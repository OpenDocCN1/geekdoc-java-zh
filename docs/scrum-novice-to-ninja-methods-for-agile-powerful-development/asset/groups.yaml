    # Scrum: Novice to Ninja


    A burndown chart shows the team''s progress toward completing all of the points
    they agreed to complete within a single sprint. This chart starts with the total
    number of points the team has taken on for the sprint, and tracks on a day-to-day
    basis how many of those points have been completed and are ready for a sprint
    demo.


    The burndown chart is usually maintained by the scrum master, and may be updated
    on a daily basis, perhaps after the daily stand up, or on a continuous basis if
    it''s generated automatically by the tools the team is using to maintain the scrum
    board. The primary audience for a burndown chart is the team itself, although
    there may be data points on a burndown chart that could be relevant to people
    outside the scrum team.


    A typical burndown chart starts with a straight diagonal line from the top left
    to the bottom right, showing an "ideal" burndown rate for the sprint. In practice,
    the point is not to match that ideal, but rather to keep in mind how much of the
    sprint is left at any point in time, and how much the team expects to be put toward
    the development of the product on any particular day of the sprint.


    Lines or columns on the burndown chart may be used to represent the number of
    points of effort actually remaining in the sprint from day-to-day, starting with
    the number of points the team has committed to at the sprint planning. As work
    is completed, these columns become shorter until they reach zero.


    Some teams also choose to track the daily work completed, in story points or in
    individual tasks toward completing stories. This can be done with a line or stacked
    columns, tracking these daily metrics against the burndown chart so they can be
    viewed in context.


    There are few legitimate reasons for a column to be taller than one day that she
    was on the previous day. If a bug is discovered before the end of the sprint,
    and a story that was marked as done or ready to demo needs to be worked on again,
    columns may increase in size from one day to the next. New stories introduced
    after the sprint has started may also cause day’s column to be higher than the
    previous day’s. A pattern of rising columns on a burndown chart may indicate that
    the scope of the work is exceeding the originally agreed sprint backlog, which
    is definitely an anti-pattern in scrum.'
  - '[PAGE 117]


    # Beware Scope Creep


    The scope of the sprint backlog should be respected by everyone. If new stories
    are regularly being added to the sprint after the sprint has started, the columns
    that reflect the amount of work left to be completed in the sprint on any given
    day may rise above the level of the previous day. This pattern is sometimes represented
    in a contrasting color, to highlight the fact that the originally agreed to scope
    may be creeping upward. If this happens frequently, it may reflect problems in
    the process that are worth addressing in a sprint retrospective.


    # Product Increment


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_117_0.png)


    Figure 5.8. Product Increment


    The final artefact of scrum is the actual product increment as it exists at the
    end of a sprint, with all of the stories in sprint that met the definition of
    done incorporated. At the end of each sprint, the completed features that were
    worked on should be added to the product for the sprint demo. At that point, the
    product itself is an artifact of the scrum process.


    A goal of the scrum process is to develop features in such a way that the product
    is in a completed state at the end of every sprint, so it could be released, demonstrated
    to clients for feedback, or used as a tool for testing. While it''s mandatory


