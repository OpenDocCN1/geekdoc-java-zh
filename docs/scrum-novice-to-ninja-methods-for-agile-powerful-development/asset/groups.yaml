    > It''s important for everyone on the team to agree to the point estimate for
    a story, regardless of whether member of the team will be working on that particular
    story. This is part of the transparency of scrum. Everyone on the team should
    be able to understand every story well enough to estimate its relative level of
    effort, and when one team is working on a story, everyone should have at least
    a concept of what that story is.


    # Bugs


    Other stories that are usually not assigned points are bugs. A bug has a specific
    definition in scrum, and it has nothing to do with unexpected or unwanted behavior
    in an existing product. Bugs in scrum are missed requirements for stories that
    are still in progress, or that have already been accepted in a prior sprint.


    If the team has completed a story, and it was accepted, and the points were included
    in the total for a sprint, but it later turns out the story was not completed
    correctly, no points are assigned for fixing the bugs to bring the story to a
    done state.


    Bug work does away from the team''s velocity, because it addresses points that
    were included in the velocity calculation inappropriately. That should be true
    regardless of whether the bug is fixed in the same sprint or in a subsequent sprint.'
