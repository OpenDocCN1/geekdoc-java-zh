    # Scrum：从新手到大师


    “我想我可以同意这一点，”产品负责人（Product Owner）说道。


    “我不认为代码量够 20 分，”另一位工程师说，“我们可以把它放在一个单独的分支里，并使用显式的命名规范。只要标记得当，很容易提取。”


    “那我选 13 分，”第一位工程师说。


    “太好了，”Scrum Master（Scrum Master）说，“那么这就是 13 分，我们还需要人负责编写重构任务（Chore）。”


    “我来吧，”第一位工程师说，他仍然皱着看着产品负责人，后者点头表示同意。“我一定会在回顾会议上提到这一点，确保我们像约定的那样落实它。”


    # 同意冲刺待办列表（Sprint Backlog）


    产品负责人除了关于小狗的故事外，没有其他故事要介绍。这使得建立一个优先的冲刺待办列表变得容易得多。使用团队的命名规范，该故事被标记为 11-1。


    有几个故事在上一个冲刺中尚未完成，还有一个仍在 QA（质量保证）阶段。产品负责人决定，让处理这些故事的工程师完成它们，而不是撤下它们让他们去处理新故事，这样比较务实。


    冲刺待办列表包含了上一个冲刺中完成的所有故事的分数，加上新的 13 分故事。考虑到团队之前的平均速率（Velocity）为 18 分，总目标 24 分略微高。但在这种情况下，它包含了几个已部分完成的故事的分数，因此团队认为这是可行的。


    那位主张小狗故事应该估为 20 分的工程师，计划留出时间编写一个所需的重构任务，以便尽快引入。


    一旦冲刺待办列表完成，Scrum Master 确保团队中的每个人都同意，并确保产品负责人会对这些故事所代表的产品增量满意。然后，在大家达成共识后，Scrum
    Master 启动了冲刺。


    以下是第 11 次冲刺开始时冲刺待办列表的情况：


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_141_0.png)


    图 7.2. 第 11 次冲刺初始待办列表


    # 总结


    所以，并不是一切都进展得完美顺畅，但生活中真的事事完美顺畅吗？在网页和移动开发团队中，通常有需要考虑的长期重构问题、性格差异、利益冲突，以及对下一步需要工作的细节的真实分歧。


    Scrum 不会让这些问题消失，但它提供了一套流程，能够以专业且高效的方式处理这些问题，并对其进行公开讨论，以便在每个冲刺中改进流程。


    在本章中，我们看到一个新需求出现在产品负责者的桌上，挤压了现有的未来开发计划，并迫使对代码库中的技术债务进行讨论。但团队已经能够评估该故事、估计它，并根据修改后的验收标准承诺完成它。


    在下一章中，我们将看到团队完成整个冲刺过程并处理新的小狗故事。我们将发现他们是否真的能在一个冲刺内完成它。


    # 第 8 章


    ## 执行 Scrum


    在上一章中，我们领略了产品负责人的世界，并体验了为团队开发和创建故事的过程。我们看到了需求是如何收集的、产品待办列表是如何构建的，以及内部和外部客户以及其他利益相关者的期望如何转化为团队清晰定义的
    Scrum 故事。


    然后，我们经历了观察故事如何引入团队的过程，以及团队如何与产品负责人进行谈判，以确保他们要工作的内容意义意义，并且能够在一个冲刺内完成。


    现在是时候跟踪这个故事完成整个冲刺了。在本章中，我们将看到团队如何将像我们一直讨论的那个大故事拆分成更小的任务，并分配这些任务，以便它们都能被处理和完成。我们将看到故事的各个方面如何得到解决，直到它们符合“完成定义（Definition
    of Done）”。


    最后，我们将看到团队与产品负责人一起演示（Demo）过程，如果运气的话，也许故事会在冲刺结束时被接受。


    无论如何，在回顾会议上肯定有很多待讨论的内容。让我们看看会发生什么。


    # 执行一个故事


    当计划会议结束时，团队已经承诺了一个新的冲刺待办列表。正如你可能记得的，Scrum 看板目前是这样的：


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_144_0.png)


    创建一个支持小狗的站点测试版本的新故事（标记为 11-1）位于优先级列表的高端，但它的优先级低于一些在上一个冲刺中仍在进行但尚未被接受的故事。这是产品负责人愿意做出的妥协，以确保团队在几乎完成的故事上不会失去势头。


    # 承担所有权


    第二天早上，团队进行了新冲刺的第一次站会（Standup）。像往常一样，团队围成一圈，汇报自上次站会以来做了什么、计划在下一次站会前做什么什么，以及是否有阻碍（Blockers）。前三位工程师有上一个冲刺的工作要做，而第四位工程师（团队中最初级的）没有任何阻碍。


    “看来我有了，”初级工程师说。


    “好的，我们把你的名字写上去，”Scrum Master 说。


    “我想我该开始分配任务了，”初级工程师说，“但我需要帮助。”


    “没问题，可以和我结对（Pair），”下一位工程师说。


    “太好了，”Scrum Master 说，“所以你们两个负责这个故事。现在有障碍吗？”


    “只有通常的畏畏感，”初级工程师说，“但我想我们能搞定。”


    # 定义任务


    接手一个大故事时的第一件事是将其任务化（Task it out）。这意味着定义可以并行处理的单个任务，以便故事不会困在某人的脑子里。有些人倾向于在计划会议期间将故事拆分为任务，但这个团队决定承担该故事所有权的人也将负责拆分任务。


    根据团队的偏好，任务可以像故事一样编写，也可以写成适合工程师间交流的技术规范。任务还可以输入到许多 Scrum 跟踪系统中，在开发、评审和 QA 过程中进行跟踪并分配给不同的人。


    负责小狗故事的两个工程师处理实现该故事所需的元素。这花费了几个小时，他们不得不联系产品负责人几次以澄清疑问。当他们完成时，已经拆分出了六多个任务，每个任务在进入
    QA 之前都需要完成。


    他们共同编写任务描述并将其添加到团队共享的电子 Scrum 看板。在看板上提供任务的另一个优势是，直接负责整个故事的团队成员仍然可以承担某个任务，从而更高效地完成工作。这对关于故事如何实现的知识在团队中传播也具有优势。


