    # Agreeing to a Sprint Backlog


    The product owner doesn''t have any stories to introduce other than the one over
    the puppies. That makes establishing a prioritized sprint backlog much easier.
    Using the team''s naming convention, that story is labeled 11-1.


    There are a couple of stories that haven''t been completed in the previous sprint,
    and one that''s still in QA. The product owner decides it''s practical to let
    the engineers working on those stories to finish them instead of pulling them
    off and making them work on the new story.


    The sprint backlog includes all the points for the stories that were completed
    the previous sprint, along with the new thirteen-point story. The total goal of
    24 points is a little high, given the team''s previous velocity average of 18.
    But in this case includes several points from stories already partially completed,
    so the team agrees that it is feasible.


    The engineer who argued that the puppy story should be estimated at 20 points
    plans to set aside time to write up a chore for the refactoring that''s needed,
    so it can be introduced as soon as possible.


    Once the sprint backlog is complete, the scrum master makes sure that everybody
    in the team agrees to it, and that the product owner will be satisfied with the
    product increment represented by those stories. Then, with everybody in agreement,
    the scrum master launches the sprint.


