    # Team Resources


    A scrum team doesn''t work in a vacuum. There''s usually an organization that
    exists around scrum, and supports the efforts of the scrum team with the resources
    it needs to produce the work. There''s a two-way relationship that must be maintained
    between the scrum team and the rest of the organization, so that each is to be-benefit
    the process.


    Just the organization and its hierarchy should have no influence on the rituals,
    artifacts, and roles of scrum, scrum has no formal opinions about how the outer
    organization is structured. Scrum can exist successfully in a rigidly tied team
    with clearly defined titles and roles just as easily as it can work in a “holacracy”
    (an organization without any chain of command). As long as the scrum team is provided
    with the resources it needs, and can justify its existence by producing the results
    that the organization wants, the relationship should be maintainable.


    There are sometimes different opinions about how the resources team needs should
    be provided. An agile approach to working this out is to try one way, notice how
    it works, and iterate to find what''s most productive.


    In particular, there are a few key resources most scrum teams doing well and mobile
    development find themselves needing aren''t formally defined as part of scrum.


    # Designers


    A critical input into any web or mobile project is Designers help establish the
    user experience, the flow, and the visual consistency of a project. With the trend
    toward design thinking as a process, designers become elemental in all phases
    of product development, from initial problem definition through wireframing, creating
    style guides, building graphical assets, validating visual consistency, and doing
    user experience testing.


    Designers work closely with product owners during the development of new stories.
    In most case design drive it ideation, and much of the innovation in a product
    evolves iteratively comes from the designer. Designers also need to be available
    to team members when questions of layout and style come up. Sometimes designers
    need to be prepared to drop everything and produce assets, or make decisions that
    are critical to unlock blockers in the middle of a story. Switching'
  - '[PAGE 62]


    # 42 Scrum: Novice to Ninja


    between high-concept thinking and detailed, hands-on production can make the designer''s
    role very challenging.


    Some teams choose to integrate designers into the team, and include them in all
    the rituals. The advantage of this approach is that the designer is constantly
    aware of how the team is working, and able to give immediate feedback by participating
    during story creation as well as estimation and development. A designer who chooses
    to work as part of the team should be prepared to commit to the scrum process
    just like any other team member.


    However, unlike most members of a scrum team, a designer is usually not trained
    or inclined to pair with other engineers on development work. Additionally, the
    skills and responsibilities of a designer may lend themselves to paired with engineers
    not trained in design themselves. Because of this, a designer who''s integrated
    into the team may need to be treated differently from other team resources. This
    sometimes create a sense of imbalance, leaving the designer role poorly integrated.


    Another approach that many teams use to create an extended sprint sequence, with
    a separate design sprint that precedes the development sprint. This helps isolate
    the work of designers from the work of engineers, while still keeping designers
    integrated into the scrum process as members of the team.


    Using the design sprint approach can be effective, but it limits the agility of
    scrum. Because design sprints happen before development sprints, the team is effectively
    committing to working in increments that are twice as long. This means that the
    product owner''s ability to adjust requirements needs to be pushed out an additional
    sprint, so changes needs to be planned much further in advance. For some teams
    this may be a good solution, as long as they''re prepared to accept the tradeoffs.


    A third method worth considering is maintaining a separate Design team, and treating
    them as a resource. Designers on the Design team can be called upon to participate
    in the ideation, story creation, asset development, user flow testing, or anything
    that the scrum process needs. Because the designers are independent of the scrum
    process, they''re welcome to attend the rituals as guests, but aren''t required
    to be active participants.


    A Design team that operates as an independent resource may choose to structure
    itself using a different agile approach known as kanban. Kanban is similar to
    scrum,'
  - '[PAGE 63]


    # Scrum Roles 43


    but instead operating in sprints with contracted deliverables at predetermined
    intervals, a kanban team commits to a specified amount of work-in-progress. Kanban
    teams can accept new stories from the product owner without advance planning,
    as long as the resources of the team are never committed more than the amount
    of work they''re capable of doing sustainably.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_63_0.png)


    # Kanban


    The details of the kanban are more complex than we''ve covered here, but it''s
    another approach worth looking into for organizing work that involves a constant
    flow of services. In particular, kanban is very effective for managing the workflow
    of organizations such as Operations and Customer Support, where there''s a steady
    stream of stories that all need to be addressed, and frequently require rapid
    response on a priority basis.


    # QA Engineers


    Quality assurance is the responsibility of every member of the team, but most
    organizations have professionals who are specially trained in the techniques of
    creating and managing test suites. For web and mobile work, this can be an intricate
    and complex process, involving tools that simulate the behavior of a wide range
    of devices and browsers, and automation to follow both common and uncommon paths
    through a product.


    QA engineers may be isolated within their own group, working independently of
    the team doing the development of the product. When this is the case, coordination
    with the team is critical. Unless QA is taken into account early, a scrum team
    may find itself rushing to complete stories before the sprint demo meeting, and
    then dumping a load of work onto the QA team at the last minute, so that stories
    will be ready to demo.


    Not unlike designers, QA engineers are sometimes given a separate sprint to do
    their testing. This avoids the issue of trying to get the stories verified quickly
    at the end of every sprint, but it introduces the same kind of reduced flexibility
    as having a separate design sprint. Further, when it comes for a demo of the stories,
    most of the team has already moved on newer stories, and the details of the previous
    sprint''s work may not be fresh in their minds.


