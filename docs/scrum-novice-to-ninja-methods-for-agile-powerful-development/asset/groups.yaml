    # Scrum 角色 31


    Scrum 师（Scrum masters）还维护着许多产物，帮助团队专注于目标，并衡量其实现承诺的进展的可持续性。这些产物及其包含的数据在团队内部外部都可能存在广泛的解读空间，因此
    Scrum 师需要能够用组织内外广泛受众都能理解的语言来解释团队的状态及其进展。


    # 职场的一天


    Scrum 师需要参与产品开发的每一个方面，因此他们必须与许多人紧密合作，并处理许多关键工具——如下列表所示。（如果现在这里有一些你不熟悉的术语，请不要担心。我们很快就会讨论
    Scrum 的产物和仪式。）因此，活动包括：


    - 计划和主持 Scrum 仪式，包括每日站会、迭代计划会议、迭代演示（Sprint demo）和迭代回顾会议


    - 协助团队识别阻碍其开发的阻塞因素


    - 向团队成员、产品负责人或组织内任何可以帮助消除障碍并让用户故事（stories）重新运行的人员寻求帮助


    - 维护 Scrum 产物并确保每个人都能访问


    - 就其角色和职责对团队成员进行辅导，同时关注问题并帮助解决


    - 与产品负责人合作，帮助澄清用户故事并维护维护良好的待办列表（backlog）


    - 为了产品和团队，向管理层和整个组织代表 Scrum 的需求。


    每个 Scrum 师每天都会尝试主持的一种仪式是与整个团队进行的15 分钟站会，以及任何感兴趣观察的访客。对于某些团队来说，这会在一天早早进行，而其他团队则倾向于在晚些时候进行。


    # Scrum：从新手到忍者


    Scrum 师可能会在站会结束后参与若干后续讨论。最重要的讨论将涉及消除那些在没有协调协助无法无法的团队成员的阻塞。Scrum 师还会以产品负责人和团队成员的身份与相关人员见面，跟进站会期间提出的其他问题。


    在安排了其他仪式（如迭代计划会议、迭代演示或迭代回顾会议）的日子里，Scrum 师引导整个过程，确保团队已同意的所有步骤都得到遵循，并遵守时间限制。


    更新 Scrum 产物是 Scrum 师的日常职责。这些产物始终维护在一种状态，让任何人都能一眼看出团队在做什么，从而支持维持 Scrum 运行的核心透明度。这包括计算和报告团队指标（如速率
    velocity），并向团队外的人员澄清这些概念的相关性。


    Scrum 师在支持团队每个成员的 Scrum 职责方面也起着关键作用。Scrum 师需要在问题出现时随时为团队提供指导，并在问题显现时识别这些问题。这可能意味着帮助产品负责人思考如何为待办列表表述一个故事，观察并参与开发者的结对编程以促进流程，或者用通俗的语言准备团队状态报告——为了那些不在团队中但需要了解发生情况的人。


    # 产品负责人


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_53_0.png)


    图 3.3. 产品负责者的角色


    与职责侧重于开发团队的 Scrum 师不同，**产品负责人（**product owner）**对团队和客户有共同责任。产品负责人是客户的声音，是客户需求、愿望和期望的代表。


    产品负责人通常属于产品或客户支持等部门，并直接与客户接触以理解他们的需求，并将这些需求转化为团队可以估算和处理的清晰描述，我们使用 Scrum 术语中称为“故事”（stories）的一致格式。


    产品负责人从客户的角度关注大局，查看产品的整体状态、发布周期的时间线以及不断变化的技术格局，同时决定哪些功能是团队在下一个迭代中工作的最高优先级。


    产品负责人直接与设计师合作，确保考虑了用户体验流，并确保设计资产已为团队准备就。他们还与质量保证（QA）工程师合作，验证故事的测试用例是否涵盖了必要的验收标准。产品负责人也与团队合作


    # Scrum：从新手到忍者


    产品负责人需要与客户保持定期沟通，以确保他们编写的故事和正在维护的待办列表符合当前的预期。虽然 Scrum 鼓励透明度，但并非所有团队都会邀请客户直接参与仪式和产物。产品负责人为客户翻译产品状态——演示并获得交付的每个功能片的批准——并从客户那里收集反馈，让团队知道他们是否处于正确的道路上。


    此外，产品负责人需要随时服务团队，以解决任何冲突或澄清团队正在处理的故事的细节。作为客户的内部声音，产品负责人需要体现产品的期望，并能够快速做出决策，以便团队继续工作。


    ## 一个人不应同时担任 Scrum 师和产品负责人


    一个人不应尝试同时担任 Scrum 师和产品负责人的角色。这些角色往往具有冲突利益。Scrum 师关注团队的健康和流程，而产品负责人关注客户需求和产品价值。一个人兼任这两个角色可能会导致利益冲突，从而损害项目。


    ## 职责


    产品负责人最关键的职责之一是澄清客户的需求，并确保团队有一个清晰的愿景。产品负责人需要随时为团队回答问题并对故事提供反馈。


    产品负责人不需要对团队正在工作的内容提前一一两个迭代进行详细计划。事实上，对于可能执行它们的迭代来说，提前太早的故事经常被丢弃或重写，因此详细列出它们通常是浪费时间。良好的产品负责人会维护一个关于产品随着单个功能的添加如何演进的愿景，并考虑到在当前迭代为未来可能需要的功能做好铺垫的重要性。


    # 职场的一天


    产品负责人将其时间分配给几项职责和相关人员：


    - 定期与客户见面，分享团队进展信息，并收集关于客户下一步想要什么的反馈


    - 直接与设计师合作，为团队计划并准备资产


    - 从团队处获得开发中故事的技术批准


    - 验证 QA 测试用例的完备性和相关性


    - 与 Scrum 师协调，确保每个人都有完成工作所需的信息


    - 在被要求澄清问题和做出决策时与团队成员见面

