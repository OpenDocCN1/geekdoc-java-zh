    # Scrum: Novice to Ninja


    Scrum masters will likely be involved in a number of follow-up discussions at
    the end of the standup. The most important ones will involve removing blockers
    from team members who cannot move forward without coordinated assistance. Scrum
    masters will also meet with constituents as product owners and team members to
    follow up on other issues that were raised during the standup.


    On days when other rituals are scheduled, such as the sprint planning meeting,
    the sprint demo, or the sprint retrospective, the scrum master leads the process,
    making sure all the steps the team has agreed to are followed, and that the time
    constraints are honored.


    Updating the artifacts of scrum is the daily duty of the scrum master. These are
    always maintained in a state that allows anyone to see at glance what the team
    is working on, to support the essential transparency that keeps scrum working.
    This includes calculating and reporting on team metrics such as velocity, and
    clarifying the relevance of these concepts to people outside the team.


    Scrum masters also play a key role in supporting the scrum responsibilities of
    every member of the team. A scrum master needs to be available to coach the team
    when issues arise, and to recognize these issues when they manifest. This can
    mean helping the product owner figure out how to phrase a story for the backlog,
    observing and participating in a pairing session with developers to facilitate
    the process, or preparing reports on the team’s status in plain language—for the
    sake of people who aren’t on the team but who need to understand what’s happening.'
  - '[PAGE 53]


    # Product Owners


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_53_0.png)


    Figure 3.3. The role of the product owner


    Unlike scrum master, whose responsibilities are focused on the development team,
    a **product owner** has a shared responsibility to the team and to the customer.
    The product owner is the voice of the customer, and stands in as the representative
    of the customer’s needs, wants, and expectations.


    A product owner usually belongs to a department such as Product or Customer Support,
    and spends time with customers directly to understand their needs and translate
    these into clear descriptions that the team can estimate and work on, using a
    consistent format we call stories in scrum terminology.


    The product owner keeps an eye on the big picture from the customer’s perspective,
    looking at the overall state of product and timeline for release cycles, and the
    changing technical landscape, while deciding what features are the highest priority
    for the team to work on in the next sprint.


    Product owners work directly with designers to make sure user experience flows
    have been considered, and that design assets are ready for the team. They also
    work with QA engineers to verify that the necessary acceptance criteria are accounted
    for in the test suite for a story. Product owners also collaborate with the scrum'
  - '[PAGE 54]


    # Scrum: Novice to Ninja


    master to remove blockers from outside the team that may be getting in the way
    of progress.


    At the same time, the product owner works closely with the team to decide whether
    a desired feature is technically achievable, given the practical constraints of
    the team and the technology, and to plan the sequence of stories based on their
    historical development velocity and their feedback about the product. Being close
    to the team is vital, a product owner needs to be available so developers can
    ask about details of a story and confirm the progress of their work. Product owners
    also usually attend all of the scrum rituals.


    > One Person Should Not Be Both Scrum Master and Product Owner

    One person should not try to take the roles of scrum master and product owner
    simultaneously. A product owner has a duty to the client or customer first, and
    usually isn''t part of the engineering department. The objectives of a scrum master
    center around sustainable productivity, and these may not align with the organizational
    objectives of anyone reporting outside the department.


    # Responsibilities


    One of the most critical duties of a product owner is clarifying the needs of
    the customer, developing a backlog of product features to work on, and writing
    clear stories that communicate the full expectations for the product, while meeting
    the standards of the team. A well-written story needs to encapsulate the full
    intention for a distinct slice of functionality, including any acceptance criteria,
    as well as the customer''s justification for needing this particular feature.
    Usually the product owner and the scrum master will collaborate to make sure each
    story is ready for the team.


    Once enough stories are written to occupy the team for the upcoming sprint, a
    product owner keeps track of them and organizes them to make sure the sequence
    of development for the product is planned out efficiently and to the expectations
    of the customer. Meanwhile, the product owner is diligently working on stories
    that may be needed if the team runs out of work in the current sprint, as well
    as outlining and drafting items that reflect the customer''s anticipated needs
    for sprints in the near future.'
  - '[PAGE 55]


    A product owner doesn''t need to do detailed planning more than a sprint or two
    ahead of what the team may be working on. In fact, stories too far in advance
    of the sprint in which they might be worked on are so frequently discarded or
    rewritten that it''s usually a waste of time to spell them out in detail. A good
    product owner maintains a vision for how the product will evolve as individual
    features are added, keeping in mind the importance of setting the stage in the
    current sprint for features that may be needed in the future.


    Product owners need to be in regular communication with the customer, to make
    sure the stories they''re writing and the backlog they''re grooming current expectations.
    While Scrum encourages transparency, not all teams invite customers directly into
    the rituals and artifacts. A product owner translates the state of the product
    for the customer—demonstrating and getting approval for each slice of functionality
    delivered—and gathers feedback from the customer to let the team know whether
    or not they are on the right path.


    In addition, the product owner needs to be available to the team to resolve any
    conflicts or clarify any details about stories the team is working on. As the
    internal voice of the customer, the product owner needs to embody the expectations
    of the product, and be able to make decisions quickly so the team can continue
    working.


    # A Day in the Life


    Product owners split their time among several responsibilities and constituents:


    +   - meeting regularly with customers to share information about the team''s
    progress and gather feedback about what the customer wants next


    +   - working directly with designers to plan and prepare assets for the team


    +   - getting technical approval from the team for stories in development


    +   - verifying the completeness and relevance of the QA test suite


    +   - coordinating with the scrum master to make sure everyone has the information
    they need to do their work


    +   - meeting with team members when asked to clarify issues and make decisions'
