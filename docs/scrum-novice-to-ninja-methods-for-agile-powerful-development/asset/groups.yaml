    ## Scrum 产物 95


    与业务环境中的许多图表不同，速率图（velocity chart）的目的不是看到持续增长，而是为了看到数值在一个一致的水平线附近收。该线代表了团队在单个迭代（sprint）中现实且可持续地完成的工作量。


    ## 速率是估计工具，而非 KPI


    Scrum 流程之外的人可能对速率图的本质感到困惑。从管理的角度来看，可能会倾向于增加团队的工作量，并希望速率随着时间的推移而增长。速率图的设计目的是趋于水平平均。你可能会听到高管们讨论尝试提高团队速率，或者对某个速率高于典型迭代的迭代表示庆祝。在这些讨论发生之前，请提醒大家：跟踪速率的目的是提高团队持续且可靠地估计他们可以完成多少工作的能力。显示随时间持续增长（或减少）的速率图通常反映了流程中的问题。


    ## 燃尽图（Burndown Chart）


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_115_0.png)


    图 5.7. 燃尽图


    ## Scrum：从新手到大师


    燃尽图显示了团队在单个迭代内完成其约定完成的所有点数的进度。该图始于团队在本次迭代中承担的总点数，并按天跟踪这些点中有多少完成并准备好进行迭代演示（sprint
    demo）。


    燃尽图通常由 Scrum Master（scrum master）维护，可能会每天更新一次（也许每日站会之后），如果是由团队用于维护 Scrum 看板的工具自动生成，则持续更新。燃尽图的主要受众是团队本身，尽管燃尽图上可能存在对
    Scrum 团队之外人员相关的数据点。


    典型的燃尽图从左上角到右下角有一条直线对角线，显示了迭代的“理想”燃尽速率。在实践中，重点并不是匹配这种理想状态，而是记住在任何时间点还剩下多少迭代，以及团队预计在迭代的某一天投入到产品开发中的工作量。


    燃尽图上的线条或列图可能用于表示迭代中每天实际剩余的工作量点数，从团队在迭代计划会议中承诺的点数开始。随着工作的完成，这些列会变短，直到达到零。


    一些团队还选择跟踪每日完成的工作，以故事点（story points）或完成故事的单个任务为单位。这可以通过线条或堆叠列来实现，将这些每日指标与燃尽图进行对比，以便在上下文中查看。


    燃尽图中的某一列比前一天高几乎没有合理的理由。如果在迭代结束前发现了漏洞（bug），并且一个被标记为已完成（done）或准备好演示的故事需要再次处理，列的大小可能会从一天到第二天增加。在迭代开始后引入的新故事也可能导致当列比前一天高。燃尽图上列不断上升的模式可能表明工作范围超过了最初约定的迭代待办列表（sprint
    backlog），这在 Scrum 中绝对是一个反模式。


    ## 警惕范围蔓（Scope Creep）


    每个人都应该尊重迭代待办列表范围。如果在迭代开始后经常添加新故事，那么反映某一天迭代内剩余工作量的列可能会超过前一天的水平。这种模式有时用对比颜色表示，以强调最初约定的范围可能向上蔓的事实。如果这种情况频繁发生，可能反映了流程中的问题，值得在迭代回顾（sprint
    retrospective）中解决。


    ## 产品增量（Product Increment）


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_117_0.png)


    图 5.8. 产品增量


    Scrum 的最后一个产物是迭代结束时的实际产品增量，其中包含了所有符合“完成定义”（definition of done）的故事。在每个迭代结束时，处理过的完成功能应该添加到产品中供迭代演示。此时，产品本身就是
    Scrum 流程的产物。


    Scrum 流程的目标是开发功能，使产品在每个迭代结束时都处于完成状态，以便发布、向客户演示以获取反馈或作为测试工具。虽然组织根据 Scrum 时间发布产品是强制性的，但此目标允许产品状态成为
    Scrum 鼓励的开发、测试、评估和创新的迭代过程的一部分。


    大多数组织中产品增量的所有权应属于发布工程师（release engineers），并对产品负责人（product owner）完全可用。对于 Web 和移动项目，产品通常是产品的实时演示分支，维护在一个安全但可访问的位置。


    对于进行持续集成的团队，实时站点可能反映团队完成的最新工作。在这些情况下，公共站点或 App 将就是产品。


    ## 结论


    这些都是需要熟悉的的新术语，但我们已经涵盖了故事（stories）、待办列表（backlogs）、看板板（boards）、速率图、燃尽图和产品增量。现在我们已经掌握了仪式（rituals）和产物（artifacts），是时候让我们查看
    Scrum 合同（scrum contract）了。


    '
