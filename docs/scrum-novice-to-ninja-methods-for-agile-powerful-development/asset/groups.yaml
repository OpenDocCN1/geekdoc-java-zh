    # Summary


    So not everything has gone perfectly smoothly, but in life does everything go
    perfectly smoothly? On web and mobile development teams there are often long-over
    refactorings that need to be considered, personality differences, conflicts of
    interest, and genuine disagreements over the details of what needs to be done
    next.


    Scrum isn’t going to make these things go away, but it provides processes for
    working through them in a professional and productive manner, and for discussing
    them openly so that the process can be improved every sprint.


    In this chapter, we’ve seen a new requirement show up on the product owner’s desk,
    pushing existing plans for future development down, and forcing a discussion about
    technical debt in the codebase. But the team has been able to evaluate the story,
    estimate it, and commit to it based on the modified acceptance criteria.


    In the next chapter, we''ll see the team work through the sprint and tackle the
    new puppy story. We''ll find out whether they can actually complete it within
    a single sprint.


    # Chapter 8


    ## Working Through Scrum


    In the last chapter, we were introduced to the product owner''s world, and taken
    through the process of developing and creating a story for the team. We saw how
    requirements were gathered, how the product backlog was built up, and how the
    expectations of internal and external clients, along with other interested parties,
    translated into clearly defined scrum stories for the team.


    Then we went through the process of seeing how stories are introduced to the team,
    and how the team negotiated them with the product owner to make sure that what
    they were going to work on made sense, and was capable of being finished within
    a sprint.


    Now it''s time to follow that story through a sprint. In this chapter, we''re
    going to see how the team divides up a large story like the one we''ve been discussing
    in smaller tasks, and distributes these out so they all be worked on and completed.
    We''re going to see how all aspects of the story get addressed until they meet
    the definition of done.


    Finally, we''re going to see the team go through the demo process with the product
    owner, and with any luck, maybe the story will be accepted at the end of the sprint.


    Either way, there''s certainly going to be a lot to discuss at the retrospective.
    Let''s find out what happens.


    # Working Through a Story


    By the time the planning meeting has ended, the team has committed to a new sprint
    backlog. As you may recall, the scrum board currently looks like this:


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_144_0.png)


    The new story for creating a test version of the site to support puppies, labeled
    11-1, is high on the priority list, but it''s a lower than some stories that are
    still in progress from the previous sprint, but haven''t been accepted yet. That''s
    a compromise the product owner is moving to make so that the team won''t lose
    momentum on stories that are almost complete.


    # Taking Ownership


    The next morning, the team has the first standup of the new sprint. As usual,
    the team goes around the circle, reporting on what they''ve done since last standup,
    what they''re planning to do until the next standup, and whether they have blockers.
    The first three engineers will have work to do from the previous sprint, and the
    fourth engineer, the most junior on the team, doesn''t have any blockers. But
    the fourth engineer, the most junior on the team, doesn''t have any blockers.


    “Looks like I get to,” the junior engineer says.


    “OK, we’re putting your name on it,” the scrum master says.


    “Guess I’ll start tasking out,” the junior engineer says, “but I’m gonna need
    help.”


    “Sure, we can pair with me,” the next engineer says.


    “Great,” the scrum master says. “So you two are working on this story. Got any
    blockers yet?”


    “Just the usual sense of intimidation,” the junior engineer says. “But I guess
    we got this.”


    # Defining Tasks


    The first thing to do when taking a big story is task it out. This means defining
    the individual tasks that can be worked on in parallel, so that the story doesn’t
    get trapped in one person’s head. Some prefer to split stories into tasks during
    the planning meeting, but this team has decided that the person who takes ownership
    of the story will also be responsible for breaking out the tasks.


    Depending on the preferences of the team, tasks can be written like stories, or
    they can be written as technical specifications more appropriate for sharing ideas
    among engineers. Tasks can also be entered into a number of scrum tracking systems,
    they can be tracked and assigned to different people as they go through development,
    review, and QA.


