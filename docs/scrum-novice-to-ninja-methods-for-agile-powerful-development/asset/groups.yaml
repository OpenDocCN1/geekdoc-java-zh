    "story," or having hour-long daily "standup" meetings. Don''t let your team be
    one of these.


    Getting everybody''s active and focused participation is important for the scrum
    training to take root. Anybody who isn''t properly trained may not understand
    how scrum is supposed to be applied, and that can lead to frustration and confusion
    that''s easily avoided with a little preparation.


    The list of people to invite to the training should include some representatives
    of senior management, as well as all the people in the organization who are going
    to be participating in the rituals on a daily basis. You don''t have to get everybody
    in the company trained, but anybody whose role involves direct interaction with
    the scrum team is a likely candidate.


    # Staffing


    It may not necessary to hire anybody new in order to implement scrum in your organization.
    Most of the roles in an agile team can be filled by people who already exist in
    the organizational hierarchy.


    A product manager may be a likely candidate for the product owner role on a scrum
    team. Engineers—whether junior, senior, or management—should all be considered
    equal on the development team for the sake of scrum, despite the differences in
    their ranks in the organization. Often QA engineers are also included in scrum,
    which provides a number of benefits in terms of redundancy, cross-training, and
    organizational reach.


    Project managers may be the best people already working in the organization to
    step into the role of scrum master, with some training about the differences between
    the skill set in managing projects versus scrum. In a pinch, any member of the
    development team can be trained to act as scrum master. However, a good scrum
    master may be the best hire to make when implementing scrum.


    Somebody who understands how scrum works, and is familiar with the issues that
    can arise, smooth out the rough edges more easily than a person just getting to
    speed with the process. It''s less important for a scrum master to be familiar
    with the type of work you''re doing than to have someone good at coaching people
    through the scrum process.'
  - '[PAGE 165]


    # Tracking Effectiveness


    Scrum is all about establishing a sustainable process that adds real value, and
    reviewing that process on a regular basis in order to make sure it''s producing
    the desired results. Why not use agile techniques to make sure scrum is working
    for your company?


    One of the most useful techniques when implementing scrum in a new organization
    is to establish a baseline of productivity before scrum, and use that to measure
    the effectiveness of scrum. Where you establish that baseline, and how you measure
    it, are very subjective. Each organization has its own standards and productivity
    indicators.


    For example, a web development team may judge itself by the number of comparable
    features it''s able to add to a website. A mobile development agency may track
    how quickly they are able to get from concept to implementation with a typical
    client. The ability to fix or address bugs may also be relevant. Ask around, and
    find out how the company judges its own performance. (You may be surprised at
    how low formal attention is paid to the matter).


    Before implementing scrum, pull together a representative sample of data about
    the performance of the organization without scrum. That, you''ll have a comparison
    point to use when evaluating how effective scrum is, and reporting on to interested
    parties. Keep updating the data as the team applies scrum and develops its agile
    abilities.


    If you don''t see improvements, you can use the scrum process to raise the issue
    during a retrospective, and figure out what''s working, what isn''t, and how you
    can improve.


    # Troubleshooting


    It would be lovely if everything worked as you expect it to perfectly, from the
    beginning to the end every single time. That doesn''t happen in the real world.
    One of the advantages of scrum is that it doesn''t pretend that things are always
    going to be perfect. Scrum has built-in checks and balances to make sure the team
    is always responding to changing conditions, and reinforcing scrum techniques
    to make sure they support their goals.'
  - '[PAGE 166]


    # Scrum: Novice to Ninja


    Scrum breakdowns tend to follow familiar patterns across organizations. Let''s
    take a look at a few of the aspects of scrum we''ve discussed, to see where issues
    are likely to crop up, and how to address them.


    # Undefined Time Boxes


    When a team is starting out scrum, they may not understand how much time to allocate
    for their rituals. Defining a time box in which the ritual must be completed helps
    everyone''s attention, and shows respect for the team''s time. There''s a temptation
    for new teams unsure about how much time to allocate to leave the time box for
    the various aspects of the ritual.


    It''s especially important when teams are starting to define time boxes explicitly
    for every aspect of a ritual. Sometimes these time boxes may just be guesses,
    and the team will need to learn by iterating from sprint to sprint just how much
    time they need. It''s better to propose a wildly incorrect time box and to enforce
    it than to leave the time box. The exercise of proposing and enforcing time boxes
    demonstrates respect for the team''s time, and respect for the process.


    There are some experts who advocate reducing the length of time boxes to the minimum
    length possible when teams start exceeding their time boxes consistently, and
    then working closely with the team to help them get through all the stages of
    each ritual within the very limited time that''s allocated. This helps establish
    the importance of defining and respecting the time box for each aspect of the
    ritual. And if the team mentions in the retrospective that the time box was too
    short, it can be extended by consensus for the next sprint.


    # Optimizing for Sprints


    There comes a point at the end of many planning rituals when the team is agreeing
    to a backlog for the sprint. At this stage, the product owner should already have
    organized into priority order the stories that have been estimated, and considered
    what would make a sensible incentive for the product at the end of the sprint.


    As estimated stories move into the sprint backlog, the team discusses how much
    work they believe they can get that sprint. Often, the last story added to a sprint
    backlog will not be large enough to bring the team up to projected velocity based
    on their historical performance. At that point, the team may try to negotiate
    with the product owner about the order of the remaining stories, in order'
  - '[PAGE 167]


    # Making Scrum Work for Your Web or Mobile Team 147


    to get a story with the optimum number of points added to the sprint backlog so
    their commitment exactly matches their expected velocity.


    This unwise exercise is optimizing for the sprint, and it demonstrates a basic
    misunderstanding of the point of scrum. The prioritization of stories, and the
    purpose of working in order, is about adding value to the product, not pushing
    forward an agenda around optimizing the scrum process. When it comes down to it,
    the work is more important, not the number of points completed in a sprint.


    It''s better to leave that backlog a little short, and agree with the team that
    they may start work on the next priority story once all the stories they committed
    to this sprint are done. After the commitment for the sprint backlog is completed,
    it''s perfectly fine for the team to start working on a story of any size that
    has the next highest priority, even if they don''t complete it within the same
    sprint. Ultimately, the team''s point velocity is estimated across multiple sprints,
    and it will average out.


    # Long, Lazy Standups


    The purpose of the daily standup is to capture the heartbeat of the team, for
    the sake of the team. These rituals are kept short in order everybody''s time.
    One of the first mistakes team tend to make is to treat the daily standup as if
    it were a team meeting. This could be played out in many ways, including having
    the team sit for the daily standup, planning announcements at the beginning of
    standup, and not limiting cross-talk during standup.


    Everybody is expected to stand during the ritual, so that nobody feels inclined
    to let the ritual exceed its time. No devices or other distraction should be in
    anybody''s hands, and nobody should be working on their laptop or talking about
    anything other than the story currently being discussed.


    It''s a slippery slope if you start allowing people outside of your team to include
    announcements at the beginning or the end of standup. Announcements tend to encourage
    more discussion, and that can quickly lead to stands that last longer than 15
    minutes.


    There should be only one person speaking at a time during the standup, and that
    person should be the engineer discussing what was done since the previous standup,
    what will be done by the next standup, and whether there are any blockers.'
