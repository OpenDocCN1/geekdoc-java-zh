    点。然而，一个适当的探针任务（spike）具有验收标准。任何探针任务都应该有一个清晰且达成共识的结果。


    探针任务会消耗团队的资源，因为个人需要执行并研究可能超出团队当前能力的各种解决方案。因此，为了实现产品负责人的目标，需要的探针任务越多，团队在每个迭代（sprint）中能完成的点数就越少。


    由于探针任务的不确定性，除非受到限制，否则它们会消耗团队大量的资源。通常，在同意将探针任务包含在迭代中，团队会决定在探针任务结束或放弃之前可以投入的最大时间和精力的投入。


    ## 承诺迭代待办列表


    **Committing to a Sprint Backlog**


    一旦产品负责人提交的所有故事（stories）都完成了估算，仪式中的所有参与者将共同制定一个对于即将到来的迭代合理的待办列表（backlog）。该待办列表的大小将根据团队过去能够完成的历史点数进行估算，并结合新故事的点数估值进行平衡。


    虽然产品负责人对迭代待办列表的内容以及顺序拥有最终决定权，但团队有机会在准备待办列表期间为某些更改提出主张。


    例如，尽管每个故事都应该是独立的，但对团队来说，按照特定顺序处理特定故事是有意义的。团队可能还希望完成在上一个迭代中开始但未完成的故事。完成进行中的故事对开发团队是有用的，因为这有助于他们保持连续性。虽然失去连续性是有成本的，但这种成本是产品负责人的责任，产品负责人有权为了产品的利益做出这些决策。


    一旦创建了最终的迭代待办列表，团队中的每个人都需要承诺该待办列表。并提出他们认为可能影响其完成所需工作能力的问题。如果仍然存在分歧，敏捷大师（scrum master）需要介入并引导对话，以达成共识。


    ## Sc捷：从新手到大师


    **Scrum: Novice to Ninja**


    迭代计划的最终产出是团队中每一个人都能同意的迭代待办列表。敏捷大师应该对现场进行询问，以确保每个人都同意承诺是现实的，并且他们愿意在接下来的迭代中承担它。然后，应该按照优先级将新故事输入团队同意用于迭代待办列表的跟踪工具中。


    迭代计划提醒每个人准确地知道自己在构建产品负责人产品愿景的过程中处于什么位置，以及下一次增长的目标是什么。在迭代计划结束时，团队中的每个人都应该对接下来需要做什么有一个良好的感觉，并对在下一次迭代期间完成的一系列优先级故事做出坚定的承诺。


    ## 每日站会


    **Daily Standup**


    每日站会可能是人们想到敏捷（scrum）时首先想到的仪式。每日站会为团队提供了心跳，让每个人都有定期的机会清晰地了解团队其他人在做什么，以及整个项目的状态。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_82_0.png)


    图 4.3 每日站会


    ## 目标


    **Objective**


    每日站会的目的是让团队中的每个人都有机会分享他们正在进行的工作状态，并在任何阻塞进展的问题时寻求帮助。团队中的每个人都应该注意同事的报告，以便他们对大家共同工作的整个迭代的状态有一个清晰的了解。


    对于团队之外感兴趣于了解故事进展以及下一步可能处理工作的任何人来说，这也是一个机会。只有团队成员允许参加每日站会，但公司里的任何人都可以参加，访客应被邀请作为沉默观察者参与。


    ## 时间盒


    **Time Box**


    传统上，每日站会限制在 15 分钟内。这是一个简短的仪式，它保持尽可能简短和方便，以便每个人都能承诺出席、积极参与并在他人发言时保持注意力。预计每个人都要站立，以保持注意力，并鼓励所有参与者在保持仪式简短和聚焦方面发挥作用。大多数团队尝试在办公桌外举行站会，并反对人们在仪式期间使用笔记本电脑和其他设备。


    > 保持站会时长

    >

    > 将每日站会控制在 15 分钟的时间盒内是敏捷大师的责任，但团队中的每个人都应该觉得有权去执行站会的规则，以防时间盒被打破。这包括确保每个人准时开始、保持注意力，并不允许访客干扰。


    不同的团队会选择一天的不同时间举行站会。早晨或午饭之前都是很好的时间。这些是团队中大多数人共有的日程自然休息时间，因此 15 分钟的站会不会破坏长时间编程时间所需的专注力。


    ## 敏捷：从新手到大师


    **Scrum: Novice to Ninja**


    对于没有协作的团队来说，为所有人找到一个时间可能是具有挑战性的，特别是当某些团队成员处于不同的时区时。没有人应该经常性地错过站会，但只要达到每日站会的目标，一直有灵活性空间。即使不是每个人都能参加特定的站会，敏捷大师也应该为在场的人维持仪式。


    有时团队可能需要制定自己的系统，此时敏捷大师需要介入并引导对话，以达成共识。首要任务应该是保持仪式的简短。


    ## 准备


    **Preparation**


    敏捷大师在站会之前不需要特殊的准备。唯一的准备是每个团队成员都要思考如何以最有效利用可用时间的方式进行陈述。


    ## 三个问题


    **Three Questions**


    每日站会的核心由敏捷大师绕着团队询问三个问题组成：


    - 自上一次站会以来，你做了什么？

    - 在下一次站会之前，你计划做什么？

    - 是否有事情在阻碍你？


    应该就这么简单。团队的每个成员都回答这些问题，一旦最后一个人结束，站会就结束。除非敏捷大师有需要向整个团队发布的紧急公告，否则所有与他人没有特定业务往来的人都可以自由回到工作。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_84_0.png)


    敏捷仪式 65


    ## 警惕站会中的访客


    **Beware Guests at Standups**


    作为访客参加站会的人有一种强倾向去提问、引入新信息或开始与整个团队无关的讨论。任何不是开发团队成员的人应该在站会期间发言。敏捷大师需要坚决压制这种行为。组织层级中的高层人员在这方面不会获得特殊对待。每个人都需要尊重工程师的时间和注意力，让他们尽快回到工作。


    在回答站会问题时，每位工程师都需要准备好一份简洁的描述，说明正在做什么、计划接下来做什么，以及他们是否有任何阻碍。这是一项需要练习的技能，敏捷大师应该准备指导每个团队成员如何以有意义的方式回答这些问题。


    如果一个人的报告引发了一定的往来讨论，且该对话对整个团队相关，敏捷大师可能会允许。但这种互动必须限制在尊重站会时间盒的范围内。如果对话超过几句话，敏捷大师应该介入并建议将对话移至线下。一个优秀的敏捷大师会记录站会结束后需要哪些对话，并在之后对其进行跟进。


    ## 其他状态更新


    **Other Status Updates**


    有些团队选择在每日站会期间在团队共享的看板看板上更新故事状态，而另一些团队则倾向于在故事完成后单独更新。无论哪种情况，站会都应该是确保每个人都更新了他们工作状态的机会，并且团队中的每个人都知道其他人正在做什么。


    对于进行配对编程的团队，站会可以是切换伙伴或切换故事的机会。一些进行配对的团队倾向于让一个工程师从头到尾完成故事。允许多人共同配对同一个故事对团队的灵活性是有益的，特-

