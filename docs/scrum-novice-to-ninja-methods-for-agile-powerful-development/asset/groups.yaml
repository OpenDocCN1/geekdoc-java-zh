    # 为什么 Scrum 不对每个团队进行标准化？


    你可能会问，为什么 Scrum 不简单地对每个团队进行标准化。Scrum 的优势之一是每个团队从一组共同的通用概念开始，然后迭代出最适合自己的流程。这通常会导致一个相当一致的“完成定义”，但它取决于每个团队的开发和部署背景。例如，分值完全取决于团队实际处理的任务，因此它们在团队之间可能会有巨大差异。


    # 什么是 WithKittens？


    WithKittens 团队由六名工程师、一名产品负责人和一名 Scrum 主管组成。他们已经合作了大约三年，人员流动较少，并制作了网站和移动应用程序，旨在为他们客户上传的任何图像添加猫咪照片。


    该服务的大部分用户一直留在免费层级，仅仅在自己的社交媒体图像中添加猫咪并分享它们，得益于叠加在生成图像上的嵌入文本，这推广了 WithKittens。但对于某些客户来说，这也是一项关键服务，他们支付高昂费用，以确保只有最好的猫咪会被持续且可靠地添加到他们的图像中，而且远不止此。


    团队包括图像处理专家、后端工程师、网页和移动端的前端工程师，以及安全专家。产品负责人具有产品管理背景，Scrum 主管拥有多年的端端经验。除了核心团队外，还有一位专门的设计师与产品负责人合作，以及一对向不同经理汇报的
    QA 工程师，一组 DevOps 工程师负责网站运行并处理 IT 问题。


    # 故事的生命周期


