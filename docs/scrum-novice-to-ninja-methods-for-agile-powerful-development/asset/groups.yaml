    I''m going to be working on next. I need to be flexible about that so I can support
    the team and the product most effectively, but I miss being in total control of
    my day.


    ## What I Do Out About It


    To be fair, my complaint about lack of long-range design planning isn''t any more
    of a problem now than it was before we started scrum. At least with scrum I get
    the opportunity to complain about it every time we have a retrospective. I do
    think this keeps the issue top of mind.


    Since I''m not officially part of the team, I can work directly with the product
