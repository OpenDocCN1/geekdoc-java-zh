  mdcn: "\n维护整个产品。这有助于团队变得更加全能，提供学习和成长机会，提高每个人估算新故事（stories）的能力，并防止关键信息成为某人的专有责任。在高效开发和知识共享之间找到恰好的平衡取决于每个团队。\n\
    \n## Scrum Board\n\n![](img/b1806dfc7ab8e46f442d54c1e56b9394_109_0.png)\n\n图 5.4.\
    \ Scrum \n\n板\n\n冲刺待办列表（sprint backlog）通常是 Scrum 板的第一列。Scrum 板跟踪当前冲刺中正在进行的所有故事的进度，直到它们符合团队的完成定义（definition\
    \ of done）。大多数 Scrum 板使用两到三列，并将故事从一列移动到下一列，以反映哪些故事是优先待办的、哪些正在进行、哪些在测试（QA）、以及哪些已准备好演示。\n\
    \nScrum 板为整个团队提供了焦点。通过在冲刺期间查看 Scrum 板上的故事，团队中的任何人应该能够立即获取冲刺当前状态，以及团队如何朝着其设定的目标进展。良好的\
    \ Scrum 板应该是公开的，这样团队外的人也可以查看并了解发生的情况，从而鼓励公司的透明度。\n\n有许多工具可用于通过 Scrum 板监控故事进度。最简单的方法简单地将索引卡贴在墙上，所有人都可以看到。对于同地工作的团队来说，这有许多用处。它不仅鼓励使用索引卡来保持故事简洁扼要，还为每日站会（daily\
    \ standups）创建了一个自然的聚集场所，并作为团队进展情况的共享视觉提醒。\n\n## 物理 Scrum 板带有风险\n\n在墙上由索引卡制成的物理\
    \ Scrum 板容易受到滥用、忽视和误操作。人们可能会不小心地重新排列索引卡。从一天到下一天的变化可能很难发现。如果你打算使用物理 Scrum 板，一个主意是每天对其进行拍照，并发布在所有人都可以访问的地方。这种方法并不完美，但如果板在业务过程中被打乱，它可以提供一种恢复机制。\n\
    \n除了使用物理板外，许多公司开发了电子工具，帮助团队在故事从一个状态移动到另一个状态时进行捕获和管理。这些工具包括跟踪点数、生成标准报告甚至设置访问权限。某些工具允许团队在持续集成中触发自动化构建过程。这些工具广泛应用于广泛行业，便于与客户和用户沟通。其他工具可能仅支持故事的电子跟踪，同时允许所有人看到一切并进行任何更改。\n\
    \n最流行的允许故事管理、点数跟踪以及故事各种状态的在线 Scrum 板工具包括：\n\n- Pivotal Tracker²\n> ² https://www.pivotaltracker.com/\n\
    - Jira Agile³\n- Trello⁴（带有插件⁵）\n\n有些团队倾向于使用电子跟踪工具以便远程访问或显示在团队可以看到的大屏幕上。工具领域不断演变，随着新成员的加入，任何特定的建议很快就会过。此外，创建这些工具的公司对\
    \ Scrum 应该如何运作有不同的哲学。这些哲学反映在工具的设计中。\n\n更改工具是一个困难的过程，很少有工具支持直接导出。每个团队都要决定哪种工具的哲学最符合他们的方法，并找到一个他们可以坚持使用的工具。优秀的\
    \ Scrum Master 应该熟悉不同选项相关的权衡。\n\n> ³ https://www.atlassian.com/software/jira/\n\
    ⁴ http://www.trello.com\n⁵ http://scrumfortrello.com/\n\n## Definition of Done（完成定义）\n\
    \n![](img/b1806dfc7ab8e46f442d54c1e56b9394_112_0.png)\n\n我们提了几次完成定义。**完成定义**适用于冲刺待办列表中的每个故事。宣布一个故事已完成，是根据团队的工作方式验证所有关键方面都已完成的一种。\n\
    \n对于团队来说，对“完成”对自己意味着什么有一个共同的想法至关重要。团队应该创建一个书面的完成定义，并将其作为他们工作的每个故事的清单。此定义应该独立于特定的故事或项目，因为完成定义应该适用于团队的工作方式，无论他们正在处理什么。\n\
    \n完成定义是团队应该共同提出的。它可能在第一次冲刺计划期间创建，并在冲刺回顾期间进行迭代。团队的完成定义可能会随着时间的推移发生剧变，团队在回顾中意识到流程的哪些可能需要改进。\n\
    \n在显著位置发布完成定义并不是一个坏主意。这让团队内部和外部的人都能理解完成任何故事需要多少努力。该文档为关于提议故事是否准备好工作的问题提供参考点。如果故事根据验收标准无法满足完成定义，那么已发布的完成定义可以帮助团队明确这一点。\n\
    \n通常，完成定义包含一系列熟悉的预期。例如，代码应该是完整的，构建不应失败，测试套件不应损坏，产品应该按预期运行。完成定义中经常包含的其他点包括同行评审代码、编写新的单元测试、代码注释和更新产品文档。不同的团队会有不同的需求，创建完成定义的练习对于帮助团队意识到每个故事（而不仅仅是某些故事）很重要。\n\
    \n## 完成定义必须是实用的\n\n虽然完成定义的详尽很重要，但其具有实用性也同样重要。完成定义对于每个故事都必须是可以实现的。团队可能认为为了代码库应该遵循某些做法，但在市场限制下这些做法是不现实的。通常，工程师会主张更详尽的范围，而产品经理可能会主张精简的方法，这取决于产品所有者的预见性和市场的稳定性。每个团队都要提出自己的论点，并在开始工作之前得出一个大家都能同意的完成定义。\n\
    \n## Velocity Chart（速率图）\n\n![](img/b1806dfc7ab8e46f442d54c1e56b9394_114_0.png)\n\
    \n图 5.6. 速率图\n\n速率是 Scrum 衡量他们在典型冲刺中可以完成的工作量的方式。速率是历史性的衡量，从一个冲刺到下一个冲刺。通过跟踪团队根据自己的完成定义可以完成的故事点数，他们可以建立起一种可靠且可预测的感，，判断完成新故事需要多长时间。\n\
    \n跟踪速率是 Scrum Master 的责任。在每次冲刺演示结束后，Scrum Master 应该计算在此冲刺期间被接受为完成的点数。这个数字应该作为数据点添加到该冲刺的速率图中。\n"
