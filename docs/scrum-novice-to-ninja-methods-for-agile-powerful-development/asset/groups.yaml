    # Definition of Done


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_112_0.png)


    We''ve mentioned the definition of done a few times. The **definition of done**
    applies to each story in a sprint backlog. Declaring a story to be done is a means
    of verifying that all of its critical aspects have been completed based on the
    way each team works.


    It''s vital for a team to have a shared idea of what done actually means for itself.
    Teams should create a written definition of done which they maintain as a checklist
    for every story they work on. This definition should be independent of the documentation
    for a specific story or project, because the definition of done should apply to
    the way a team works, independent of what they are working on.


    A definition of done is something the team should come up with together. It may
    be created during the first sprint planning, and iterated during sprint retrospectives.
    A team''s definition of done may evolve radically over time, the team realizes
    during retrospectives what aspects of the process may need improvement.


    It''s not a bad idea to publish the definition of done prominently. This allows
    people both on the team and outside the team to understand just much effort is
    involved in completing any story. This document provides a reference point for
    questions'
  - '[PAGE 113]


    about whether or not a proposed story is ready to be worked on. If it''s impossible
    for story to meet the definition of done based on the acceptance criteria, having
    a published definition of done can help the team make that clear.


    Usually a definition of done includes a number of familiar expectations. For example,
    the code should be complete, the build shouldn''t fail, the test suite shouldn''t
    be broken, and the product should run as expected. Other points often included
    in a definition of done include peer reviewing code, writing new unit tests, code
    commenting, and updating product documentation. Different teams will have different
    requirements, and the exercise of creating a definition of done is valuable for
    helping the team realize what''s important for every story, not just certain stories.


    # The Definition of Done Must Be Practical


    While it''s important for a definition of done to be thorough, it''s also important
    that it''s practical. the definition of done must be achievable for every story.
    There may be practices the team believes should be followed for the sake of the
    codebase, but which are impractical given the constraints of the marketplace.
    Usually the engineers will argue for a more thorough scope, while the product
    owner may argue for a more streamlined approach, depending on the foresight of
    the product owner and the stability of the market. It''s up to each team to make
    their cases and come up with a definition of done that everybody can agree to
    before they start working.'
  - '[PAGE 114]


    # Velocity Chart


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_114_0.png)


    Figure 5.6. Velocity Chart


    Velocity is how a scrum measures the amount of work they can complete in a typical
    sprint. Velocity is measured historically, from one sprint to the next. By tracking
    the number of story points the team can complete according to their own definition
    of done, they can build up a reliable and predictable sense of how long it will
    take them to complete new stories based on their relative point value.


    Keeping track of the velocity is the responsibility of the scrum master. At the
    end of each sprint demo, the scrum master should calculate the number of points
    that were estimated for the stories that were accepted as done during this sprint.
    This number should be added as a data point on the velocity chart for sprint.


    Velocity charts tend to start jumping around from very high numbers to low numbers,
    as the team learns how much work they can do in a sprint, and how to estimate
    stories consistently to each other. The longer a team works together, the better
    they get at estimating stories consistently to each other. That skill leads to
    a better sense of how many stories, and how many points, the team can accomplish
    in a single sprint.


    Over time, if the composition of the team stays consistent, a velocity chart that
    started off very erratic will find itself averaging toward a consistent value.


