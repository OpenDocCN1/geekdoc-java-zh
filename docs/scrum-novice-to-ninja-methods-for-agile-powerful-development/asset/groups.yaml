    # Scrum Roles and Organizational Roles


    The roles of scrum are independent of the formal job titles that may be assigned
    and managed as part of the hierarchy of a company. For some teams, this can cause
    confusion over how the people who are not part of the formal agile process fit
    into the process. Nobody the scrum team really needs to understand scrum for it
    to work. But an important part of scrum is transparency, and the activities of
    a scrum team may draw undue attention.


    In this chapter, we''ll go over the critical roles of scrum master, product owner,
    and team member. In addition, we will discuss the motivations and perspectives
