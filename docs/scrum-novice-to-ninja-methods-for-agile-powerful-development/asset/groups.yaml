    多年来，我见过了许多倡议兴起又落。每隔几年就会出现一种新的受宠的管理模式，并带着一套大家都在谈论的新术语。我读过一些关于 Scrum 的资料，它似乎为工程组织增加了一些额外开销。我想关注这一点。此外，我听到的所有讨论都是关于额外的会议，我确定工程师们不会喜欢这些。我们的工程团队是我们最宝贵的资源之一，我不希望看到我们做任何可能让他们感到不快的事情。


    # 总结


    这些观点仅代表了当你引入 Scrum 时可能从团队中获得的响应的子集。问题的数量与人数一样多，而你最了解和你共事的人。


    上面的响应展示了在 Web 开发项目中工作的典型人员是如何看待 Scrum 如何影响他们的工作的。思考你团队中成员的动机和挫败感。你是否看到了与上述相同的的担忧？他们说的话是否属实，或者是否引发了你在团队中看到类似情况时想要警惕的红旗？


    > Scrum 无法解决需要在管理层面处理的问题


    对于这个团队来说，幸运的是，With Kittens 面对的并不是那些对所做的工作从根本上没有动力，或不愿参与流程的人。那些信号可能表明在管理或人力资源层面（在
    Scrum 之外）有更深层次的问题需要解决。记住，Scrum 关乎完成工作并帮助团队协作和改进。它独立于组织层级结构和管理流程。


    在接下来的章节中，我们将涵盖 Scrum 如何运作的细节。我们将详细查看与 Scrum 流程相关的角色、仪式（rituals）和产物（artifacts），并展示它们如何应用于从事
    Web 和移动端开发的团队。


    在阅读关于 Scrum 的描述时，请记住上面的响应。问问自己，某些组织角色是否在逻辑上可以映射到任何敏捷角色。思考在团队和组织中共同工作的真实的人会对我们即将讨论的工具和技术做出什么反应。你可能开始看到上述提出的某些挫败感和担忧是如何通过
    Scrum 解决的。


    # 第3 章


    # Scrum 角色


    # 确定谁来做什么


    Scrum 是一个支持团队持续生产力的系统。但如果你尝试采用 Scrum，而没有充分考虑 Scrum 分配给参与者的每个角色的目的，你可能会在维护 Scrum
    的平衡和节奏时发现问题。在定义的角色上偷工取巧是 Scrum 中最常见的反模式之一，通过使角色分配变得审慎且明确，很容易避免这一点。


    传统的 Scrum 只定义了三个关键角色：Scrum Master（Scrum 师）、Product Owner（产品负责人）和团队成员。我们将从这些开始。但
    Scrum 运行在一个特定的背景下，对于 Web 和移动端开发来说，这个背景通常是一个试图为客户、用户或消费者创建体验技术实现的公司或组织。


    # 无层级制度


    敏捷 Scrum 团队运行在一个可能具有管理层级的组织内。但从流程的角度来看，Scrum 中的所有角色都是平等的。


    # Scrum 角色


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_48_0.png)


    图 3.1. Scrum 中的所有角色都是平等的


    虽然标题听起来可能很威严，但 Scrum Master 对于 Scrum 流程中作为“仆人领导者”角色所展现的领导力没有权威。Product Owner 除了维护产品愿景和引导其通过
    Scrum 流程外没有其他权威。团队除了估计、接受、拒绝、承诺工作和完成用户故事的权力外没有其他权威。每个人都应该被赋予执行这些角色的权力以维护敏捷环境。


    # 仆人领导者？


    在讨论 Scrum Master 所占据的微妙平衡的角色时，经常会使用“仆人领导者”一词。Scrum Master 对 Scrum 的仪式和产物之外的任何事情都没有正式权威，他们通过接受和宣扬
    Scrum 概念从内部领导团队。Scrum Master 服务于整个团队的需求——帮助消除障碍（Scrum 工作流的阻碍）并指导人们如何遵循 Scrum 实践——并在倡导和捍卫
    Scrum 时应该以身作则。


    # Scrum 角色与组织角色


    Scrum 角色独立于作为公司层级一部分被分配和管理的正式职位。对于某些团队来说，这可能会导致对不属于正式敏捷流程的人如何融入流程产生困惑。为了让 Scrum
    运行，Scrum团队每个人都需要理解 Scrum。但 Scrum 的重要部分是透明性，Scrum 团队的活动可能会引起过度关注。


    在本章中，我们将介绍 Scrum Master、Product Owner 和团队成员的关键角色。此外，我们还将讨论 Scrum 团队之外许多人的动机和观点，他们的参与可能会影响
    Scrum 的运行效果，并最终可能成为在组织中倡导和维护 Scrum 的关键。


    # Scrum Master


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_49_0.png)


    图 3.2. Scrum Master 的角色


    Scrum Master 是将 Scrum 团队结合在一起的胶水。Scrum Master 负责让人们明确自己的角色，管理 Scrum 的仪式和产物（我们很快就会涉及到），并指导团队内部的人。


    # Scrum：从新手到忍者


    以及跨整个组织，以帮助克服障碍并保持可持续的生产力节奏。


    与项目经理不同，Scrum Master 带着作为团队仆人领导者的明确定义的使命而来。Scrum Master 在组织内部没有正式权威，除了引导团队通过 Scrum
    仪式以及维护跟踪团队进度的产物的权威之外。但在当涉及 Scrum 流程及其应用时，Scrum Master 拥有最终权威。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_50_0.png)


    # Scrum Master 的参与


    Scrum Master 可能是开发团队的一部分，但同样，Scrum Master 可能不参与团队的日常开发工作。对于遵循实践一段时间且对 Scrum 感到熟悉的团队，一个没有开发职责的单一
    Scrum Master 能够同时负责两个团队。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_50_1.png)


    # Scrum Master 的职责


    Scrum Master 通常是工程部门的一部分，在某些情况下可能是开发团队的成员。Scrum Master 担任开发团队人员的经理存在利益冲突，否则团队可能会因为潜在的影响而抑制于向
    Scrum Master 提出问题。


    # 职责


    Scrum Master 必须遵守几个关键仪式。至少包括每日站会、Sprint 计划会议、Sprint 结束演示和 Sprint 回顾会议。我们很快将详细介绍这些仪式。


    除了主持 Scrum 仪式之外，Scrum Master 还负责指导团队通过 Scrum 流程进行。这可能涉及大胆地介入关于个人角色和职责的讨论，并帮助人们以易于理解的方式交流需求和期望。某种意义上，Scrum
    Master 可以成为团队的倡导者、顾问和联络员。

    '
