    The way I hear scrum described, they talk about self-managing teams. That concerns
    me a little bit. After all, my role on the team is managing. I don''t like to
    think of some new process coming in and bypassing my authority. I don''t have
    a clear picture of what a manager does in scrum. A lot of the things I''ve read
    about about scrum Masters, product owners, and team members—they don''t talk about
    how the manager fits in.


    ## A QA Engineer


    ### My Role


    There''s a lot of technical complexity behind a site like WithKittens.com. As
    a quality assurance engineer, I need to be aware of all the site''s specifications
    and test every aspect of the site to make sure nothing breaks as the code evolves.
    That means building a complex and comprehensive suite of tests whenever there''s
    a new feature, and making sure one of those tests passes every time the code changes.
    My job is very detail oriented. I rely on some testing tools that nobody else
    in the department has any idea how to work. They don''t have to, as long as I''m
    here.


    ### Motivations


    Sometimes I feel as if I''m motivated by little green dots on my screen. When
    I run my test suite, and I see that every single test is passing, there''s a sense
    of satisfaction. But it''s also very satisfying to find those elusive little bugs
    that nobody else saw. I try to look at every specification for new product feature,
    and figure out the edge cases nobody is going to test. For example, if a user
    is supposed to enter a number, or a word, or submit the form without any data.
    I find out what happens if they enter a negative number. If I''m doing my job
    well, I''m keeping the engineers on their toes, and making sure they write code
    that''s resilient.


    ### Perfect Day


    I like it best when I have a well-defined project to test, and I''m building up
    a set of tests that need to be run. I take the code, I run the tests, and if anything
    fails I write the report and let the engineers know. It''s interesting and challenging,
    writing tests that address all of the possible concerns when a new feature is
    being developed. Having the time to break apart a new feature, work out what the
    edge cases are, and build a test suite that''s very robust and comprehensive makes
    me feel like I''m doing my job.


    ### Frustrations


    As one who reports there are problems with the code, sometimes I feel as I''m
    the bearer of bad news. My work comes at the end of the process, after the engineer
    has completed everything. Often I need to get answers from engineers about how
    they developed the code in order to test it. It''s frustrating when they''ve moved
    on to the next assignment, and they don''t have time to get back to me with the
    information I need. I also get pressured to do my work very quickly when there''s
    a deadline to be. That means some bugs I might have caught.


    ### Concerns About Scrum


    I''m not sure if scrum has anything to do with me. Most of what I read about scrum
    has to do with how the code gets developed, not how it gets. I''m open to the
    idea of working in a scrum environment, but my role as a QA engineer doesn''t
    translate to the kind of work that the engineers are doing on the team. The QA
    structure here at WithKittens involves me reporting to the manager of QA, not
    the manager of the engineering team. I''m not sure how I''m going to fit in.

