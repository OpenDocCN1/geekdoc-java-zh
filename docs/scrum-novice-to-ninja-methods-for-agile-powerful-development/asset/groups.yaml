    +   - Trello⁴ (with scrum plugins⁵)


    Some teams prefer electronic tracking tools so that they can be accessed online
    remotely, or displayed on a large monitor where the team can see it. The field
    of possible tools is constantly evolving, and any specific recommendations would
    quickly grow stale as new players enter this fast-moving field. In addition, companies
    creating these tools have different philosophies about how scrum should work.
    Those philosophies are reflected in the way the tools are designed.


    Changing tools can be a difficult process, and few tools will support direct export
    in a format that a competing tool can import directly. It''s up to each team to
    decide which tool''s philosophy best matches their own approach, and find one
    can stick with. A good scrum master should be familiar with the tradeoffs associated
    with different options.


