    # A Day in the Life


    Most days, a team member will be working on code for the majority of the day,
    in blocks of time as long and as constant can be arranged. A team member''s core
    daily duties are fairly straightforward:


    +   - developing, checking, testing, and documenting code

    - getting clarifications, story details, and feedback from the product owner

    - participating in the rituals of scrum

    - working with the scrum master to remove blockers for fellow team members.


    The most prevalent image that springs to mind when picturing a scrum team is probably
    the team''s participation in a daily standup ritual, which will be discussing
    in more detail in the chapter on scrum rituals. Every team member is expected
    to be available and prepared for this brief, fifteen-minute window of time. A
    team will usually try to schedule this so that it doesn''t interfere with the
    flow of work for the team.


    # When to Do the Standup


    > For some teams, scheduling the standup right before or after lunch, or at the
    beginning of the work day, makes the most sense. Teams that are not co-located
    need to choose a time that works for people across multiple time zones. The time
    can be adjusted by the team in response to feedback gathered during sprint retrospectives.


    When other scrum rituals are scheduled, all team members are expected to be present
    and participate actively. The rituals of scrum are designed to make efficient
    use of limited time, while producing predictable and valuable results. A good
    scrum master will arrange to maintain a time box around each ritual the time commitment
    and the end result are predictable.


    Other than participating in the rituals of scrum, all team members should be spending
    their days taking stories from ready to done. If the organization interferes with
    this work by creating excessive meetings, the team should bring this issue to
    the scrum master so that it can be addressed. Preserving the uninterrupted day
    a developer needs to concentrate on coding is one of scrum''s top priorities.'
