    # Scrum Artifacts 95


    Unlike many charts in a business environment, the point of the velocity chart
    isn''t to see a constant increase, but rather to see the values converging around
    a consistent horizontal line. That line represents the amount of work the team
    can realistically and sustainably accomplish in a single sprint.


    # Velocity is a Tool for Estimation, not a KPI


    People outside the scrum process may be confused about the nature of the velocity
    chart. From a management perspective, there may be an impulse to favor an increase
    in the amount of work a team is doing, and look for velocity to grow over time.
    A velocity chart is intended to trend toward a horizontal average. You may hear
    executives talking about trying to increase the team''s velocity, or celebrating
    a sprint in which the velocity was higher than typical sprints. Get ahead of these
    conversations by reminding everyone that the point of velocity tracking is to
    improve the team''s ability to estimate how much work they can get done consistently
    and reliably. A velocity chart that shows a constant increase (or decrease) over
    time usually reflects a problem in the process.


