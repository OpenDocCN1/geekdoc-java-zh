    ## 第 10 章

    ## 适应 Scrum


    我们已经讨论了让 Scrum 运行起来的系统。我们讨论了 Scrum 在产品开发方面的方法，以及一些帮助承担 Scrum 角色的人以可持续、高效有效的方式完成工作的仪式和产物。


    但归根结底，Scrum 关乎人。如果你团队中的成员没有从工作中获得灵感和动力，Scrum 是无法介入并改变这一点的。Scrum 能做的是帮助擅长工作的人以更高效、更有效的方式合作，并不断改进。


    在第 2 章中，我们认识了团队的每位成员，并有机会讨论了他们对 Scrum 的一些担忧。现在，让我们回顾一下，看看他们是否学习了足够的知识来帮助他们解决这些担忧。


    ## 高级工程师

    ### 初步担忧


    我刚加入 Scrum 时，很担心所谓的“术语管理”。我见过太多公司随处乱用“敏捷”这个词，却并不真正理解它的含义。有些人把敏捷看作增加会议的借口。也许会议让他们觉得更从容，但这对我这样的人来说行不通，因为我的职责可能需要几个小时甚至几天的不中断时间才能正确完成。我不希望经理们在我头顶转转，把我拉进很多会议，并转移我的注意力，分散我工作中所需的思考精力。


    ### 我学到的东西


    Scrum 的理念是好的，重要的是将这些理念付诸实践。我们现在在与敏捷无关的会议上的时间已经大大减少，这让我松了一口气。当有人需要与我交谈时，我可以准确地指出我正在做的工作，并在我太忙时解释原因以及为什么这么忙。如果有人突然提出了他们认为紧急的变更，我周围有一整个团队愿意维护冲刺（sprint）的神圣性，这样我们就不必在处理这个新问题的同时调整我们正在工作的内容。


    同时，很容易看出谁在负责什么，所以所有问题都不会都汇聚到我这里。现在团队中更多人开始获得我以前负责 100% 的代码部分的经验。这让我能够抽出身来进行一些长期的思考，并利用我的知识来评审其他人的工作，而他们仍在学习我多年来积累的一些教训。


    ### 仍然让我感到沮丧的


    当你不确定项目下一步将走向什么方向时，规划和架构项目可能是困难的。例如，移动开发中的某些方面需要比单个冲刺更长的周期。有时我们必须分层开发，始终思考每个冲刺中哪些可以被视为一个完整的功能切片。


    从技术上来说，创建一个足够灵活以适应每个冲刺中潜在剧烈变化的架构是一个挑战。当我看到某些用户故事（stories）显然不符合冲刺范围且需要拆解时，我正习惯于向产品所有者（product
    owner）提出反对。这迫使我以更模块化的方式思考，并最终构建一个更灵活的代码库。


    现在我已经学会了 Scrum 是如何运作的，最让我感到沮丧的事情之一就是看到这种实践被误用。当产品所有者试图在冲刺中间引入新的用户故事时，我会迅速地挑战他们。这种情况确实会发生，有时它有良好的业务理由，但当我看到它时会感到很心恼。


    ### 我是如何处理的


    团队中的每一个人都达成共识非常有帮助。当我不认为某事事符合我的标准时，我可以参考“完成定义”（definition of done），当人们问我我尚未开始工作的功能状态时，我可以转向产品所有者。只要知道谁负责什么就非常有帮助。


    我最喜欢 Scrum 的点之一是，我可以对我认为运行不良好的事情发表意见，并看到我所说的话实际上产生了影响。例如，当新的用户故事被强加到冲刺中间时，我会放过它而不提出问题，并确保它的发生是有正当理由的。


    由于回顾会议（retrospectives），我有机会提出我脑海中的问题——相信我，我充分利用了这些机会。Scrum 中的每个人都有平等的发言权。如果我看到某些不起工作的地方，我可以说出来。


    ## 初级工程师

    ### 初步担忧


    我的角色对我来说还新鲜，我担心自己跟不上节奏。我见过许多经验丰富的开发者在流程中挣扎，我担心我会成为那个拖团队腿的人。我也担心自己没有足够的经验在讨论中做出有意义的贡献。


    ### 我学到的东西


    有一个愿意支持我的团队非常有帮助。我学到了不需要拥有所有的答案，寻求帮助也是可以的。通过与更有经验的开发者紧密工作，我对代码库有了了大量知识。我开始对这个流程感到更加舒适，并开始享受做出贡献。


    ### 仍然让我感到沮丧的


    有时当我卡在某项任务上不知道如何进展时，会感到非常沮丧。当我发现冲刺节奏太快，我没有时间完成我工作的所有时，我也觉得很困难。


    ### 我是如何处理的


    当我卡住时，我会确保寻求帮助，我还会利用回顾会议将我的顾虑提出团队。我还在学习更开放地表达我的想法，并发现与他人分享想法是有帮助的。


    ## 工程经理

    ### 初步担忧


    在管理了几年团队后，我对所谓的“自管理团队”的想法持警惕态度。我见过人们在缺乏监督的情况下尝试工作时会出现各种问题，而且自我往往会阻碍生产力。我曾被要求去处理人际问题，这需要的比抽象流程多得多。诚实地说，听起来就像
    Scrum 试图用一堆术语和固定的程序来取代管理。


