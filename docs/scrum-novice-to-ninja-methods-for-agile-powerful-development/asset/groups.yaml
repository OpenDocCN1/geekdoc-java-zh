    the first pair to make sure there won''t be any overlap between the tasks, the
    engineer takes ownership of the next highest priority task in the top story, updates
    the scrum board, and gets to work.


    Once the second task is in progress, the scrum board looks something like this:


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_148_0.png)


    Figure 8.4. Sprint 11 Second Task


    The product owner is following up as well, doing some work on the copy for the
    puppy story, and checking in Design with the status of the assets. Now it''s a
    good time to check the scrum board to see what''s going on.


    One that was in progress and not yet completed in the last print is now listed
    as ready to demo. The new story for creating the puppy version of the site is
    started, has been split out into six tasks, and two of those are in progress.
    The product owner makes a mental note to check up on the status of the tasks after
    the standup tomorrow.


    Before the end of the day, the scrum master checks the status of the stories on
    the board. The new tasks have been added, and the format is clean, which means
    the team working on the puppy story has followed existing conventions correctly.
    There doesn''t seem to be any need to interrupt the engineers who are working
    on their stories.


    ## The First Standup


    The next day at the daily standup, the QA engineer responsible for the puppy site
    story attends, and makes note of the status of all the tasks. The product owner
    attends as well.


    ## Working Through Scrum


    ### Attendance of QA in Standups


    Some teams consider QA as core team members, but for the WithKittens team QA is
    not required to participate actively in all team activities. It''s entirely up
    to the people not directly on the team whether or not they will attend a standup.
    WithKittens QA attends standups only when alerted that new tasks or story might
    be discussed. The product owner likes to be at all the standups when possible.
    Of course, neither QA nor the product owner speaks until after all the engineers
    on the team have reported on their status. Even then, the scrum master limits
    them to statements of relevance to the whole team.


    The first report is by junior engineer responsible for the puppy story, who explains
    how they have broken the story into tasks, and how they have begun working on
    the first task.


    “We appreciate any feedback on the task breakdown,” the junior engineer says.
    "I think we addressed all of the acceptance criteria, but the more eyes we have
    on this the better I’ll feel.”


    “So you’ll be working on this task for the rest of the day?” the scrum master
    asks.


    “Yeah, I think we will.”


    “Any blockers?” the scrum master asks.


    “I don’t think so,” the junior engineer replies.


    “No, I don’t think we have any blockers,” the other engineer on the story agrees.
    “We should be working on this at least least until tomorrow.”


    “Great,” the scrum master says, making a note to follow up on the request for
    feedback, and then continues around the circle until everybody has reported. Then
    the team is dismissed, and the engineers go back to their various projects.


    After the standup, the product owner checks in with the scrum master and the people
    working on the tasks for the puppy story, and lets them know that the design work
    has been started, and the code updates they discussed at the planning meeting
    are in the repository. None of the tasks that require design assets have been
    started yet. Based on the updates from the standup, they probably won’t be started
    until the designer has everything ready.


    ## The Second Standup


    On the second day of the sprint, the product owner and the QA engineer both attend
    standup again. All the engineers are present, and nobody has any blockers for
    the stories they''re working on. As the scrum master is just about to dismiss
    the team, one of the engineers speaks up.


    "I have a quick question about how this puppy story is going to work with the
    help pages on the site," the engineer says. "I was thinking about it last night,
    and it''s going to be confusing."


    "Is that a good point?" the product owner asks. "Do you think that''s something
    we can handle?"


    "I''m not sure," the engineer says. "The way the site is structured, the help
    pages"


    "Well, it’s going to be a tricky one," the first engineer says.


    "Do we need the whole here for this," the scrum master asks, "or can we take this
    offline?"


    "I''t know," the product owner says.


    "Yeah, we can take this offline," the first engineer replies.


    "OK, great," the scrum master says. "In that case, the standup is over."


    As the rest of the team step back to their desks to continue working on their
    projects, the scrum master comes over to the product owner and the two engineers,
    who are talking about the help pages.


    "Should the three of us discuss this now, or do we want to follow up on this?"
    the scrum master asks.


    ## Working Through Scrum


    “I think I see the problem,” the product owner says. “I can write a story that
    addresses the way I think it should work.”


    “Are we going to add that as a new story?” the scrum master asks.


    “It feels like scope creep to me,” the first engineer says.


    “No, I think it’s covered by the acceptance criteria for the original story,”
    the product owner says. “These are pages on the site, and they need to be handled
    like any other pages on the site.”


    “Let’s check the acceptance criteria and make sure,” the scrum master says.


    Together, the four of them go over to a computer, pull up the scrum board, and
    take a look at the acceptance criteria for the story as the team has estimated
    it. In fact, the acceptance criteria say that the changes in the header to support
    beta users of the puppy need to accommodate all of the pages on the site, without
    distinguishing the help pages.

