  mdcn: '

    +   给定一个选择了小狗选项的登录用户

    +   当该用户查看内容创建页面时

    +   该用户在所有选项中都应该看到小狗而不是小猫，并且一个自定义反馈表单，以及一个带有退出链接的警报横幅


    以及


    +   给定一个未选择小狗选项的登录用户

    +   当该用户查看内容创建页面时

    +   该用户应该看到标准的小猫网站，没有关于小狗或小狗测试版的指示


    ## 展示与估算


    团队已经使用 Scrum 模式运行了几个迭代（sprint），并且刚刚完成了第十个迭代。在迭代演示（demo）结束时，有几个故事（stories）已经完成。团队赖以跟踪进度的共享电子
    Scrum 看板像所示：


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_135_0.png)


    仍有两个故事正在进行中，有一个故事已完成但在演示前尚未通过 QA（质量保证）批准。该迭代的所有其他故事已在演示中被接受，现在已完成。团队在第 10 迭代中完成了11
    分。


    为了启动下一个迭代的计划会议做准备，产品负责人（product owner）制定了小狗故事所需的文案变更，并在共享存储库中创建了一个文档，设计资产都将放在那里。


    在迭代计划仪式上向团队解释了新故事的背景后，产品负责人向所有人朗读了整个故事并征求反馈。


    工程师们提出的第一个问题之一是小狗是否可以整合到现有网站中，而不是分离出来。另一位工程师在产品负责人有机会之前回答道，指出整合不同类型的动物会让数据管理变得复杂得多。


    “但当客户来到一个小猫网站，却被带到一个没有任何小猫的页面时，他们不会感到困惑吗？”第一个工程师问。


    “如果他们在明显只是关于小猫的网站上看到小猫和小狗，同样同样困惑。”第二个工程师回答道，“而且，整个导航都是围绕小猫的，包括 URL 方案和 API。”


    “是的，URL 呢？”第一个工程师问产品负责人，“我们网站的一切都是关于小猫的。”


    “我们必须通过消息来处理这个问题，”产品负责人说，“这是一次有限测试，选择加入的人是刻意为之，并且理解这是一个测试版。”


    “这些边缘情况都已经在文案中处理了吗？”第一个工程师问。


    “是的，我为所有这些情况都写了消息，我计划在工作期间随时为团队提供帮助，以便我们可以在不中断进度的情况下解决它们。”


    这时，Scrum 主管（scrum master）问：“好的，大家对这个故事的了解足够充分，可以放心进行估算了吗？”


    沉默了一两秒，工程师们互相相视，然后之前说话的第一个工程师说：“我认为我们需要对这个的范围有更清晰的认识。”


    ## 定义范围


    “那么这会影响网站其他部分的体验吗？”第一个工程师问，“我看到选择看小狗的用户只在这个特定页面上看到小狗，但网站的其他部分呢？”


    “变更的范围将局限于被修改的页面，”产品负责人解释道，“这意味着当用户离开这些页面并导航到网站的其他部分（如账单和确认页面）时，可能会感到视觉上的脱节。毕竟，我们在所有页面中都贯穿了许多小猫和小猫相关的主题。对于这次测试，对整个网站进行更广泛的更改是不在范围内的。”


    “我们还能做什么吗？”另一位工程师问，“我们只在这些页面上有警报。我们可以在网站的其他部分也加上它们吗？”


    ## 故事的生命周期

