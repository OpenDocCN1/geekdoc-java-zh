- pgno: 77
  md: '# Time Box


    Depending on the number of weeks a team has committed to each sprint, the sprint
    planning may take several hours, or it may take an entire day. For a two-week
    sprint, a team may find that setting three or four hours is like a good investment
    for a sprint planning. That might seem like a lot of time, but sprint planning
    right is very detailed and explicit about what the team needs to produce. A key
    value of scrum is the communication it facilitates. Sprint planning exemplifies
    this.


    Most teams will find they''re able to accomplish the objectives of these rituals
    efficiently as they get more familiar with the process. Having a strong scrum
    master who maintains a clear time box around the different aspects of the ritual
    can help make the process as smoothly as possible.


    But there''s a lot to get done during the sprint planning, and these rituals need
    to be given adequate room to accommodate all the issues that will come to the
    surface. Starting with time constraints gives everyone confidence that there''s
    a goal and an end point in mind, and helps keep people focused.


    # Preparation


    In preparation for this ritual, the product owner will have been working with
    designers, customers, various team members, and the scrum master to create a backlog
    of clear and specific stories that have the highest priority for the product.


    It''s the responsibility of the product owner to make sure each of these stories
    is ready to be worked on, and phrased in such a way that any team member can read
    and understand each story''s description and acceptance criteria.


    # Introducing New Stories


    Sprint planning provides the opportunity for the scrum team to get an introduction
    to the stories the product owner wants to work on for the next iteration of the
    product. During this part of the ritual, the product owner goes over the stories
    that have been prepared, presenting them to the team for evaluation.


    It''s important for every member of the team to participate actively during this
    presentation, because this is their opportunity to question and challenge the
    completeness and appropriateness of each story. A good product owner will have
    dis-'
