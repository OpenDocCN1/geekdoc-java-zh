- pgno: 65
  md: 'It''s always important to keep Operations informed as product development progresses,
    so that any changes in the product that might have an impact on the reliable availability
    of services and resources can be considered. A good scrum team includes engineers
    and product owners who can recognize when changes may have an impact on system
    or network load, and will call in the opinions of qualified Operations engineers
    to help with planning for a story.


    # Operations and Pair Programming


    > It may be impractical to pull Operations away from their duties to pair on development,
    although it can be useful for developers to pair occasionally with Operations
    engineers to enhance their understanding of the issues that affect the availability
    of the product.


    # Managers


    One of the benefits of scrum is that teams have the opportunity to self organize
    and figure out how to develop the product iteratively, testing things out, making
    changes, and improving as they go. What this means is that the team takes responsibility
    for what they do, and organizes themselves around the goal of completing the work
    in the most efficient way possible. As a result, sometimes managers can be confused
    by their role in a scrum organization.


    The self-organizing nature of scrum doesn''t have anything to do with the hierarchy
    of the company that assigns a manager in a different role and a set of responsibilities
    relative to an employee. Scrum should have no opinion about the hierarchy of the
    organization, just as the hierarchy of the organization should have no impact
    on the scrum process.


    In any company, management is a vital role. Managers are responsible for hiring,
    firing, allocating resources, and representing the employees throughout the organization.
    Without managers, employees would have no turn to in the event that there''s a
    problem outside the scrum process that needs to be addressed. Managers often have
    responsibility for the productivity of the team, including reporting results to
    senior executives, and demonstrating the value of the scrum process as it''s working.


    Managers may also participate as developers on a scrum team. Often people in management
    roles in engineering also have deeper experience with some of the'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 46 Scrum: Novice to Ninja


    problems the team may be facing. These managers may serve as architects or senior
    developers, and may have valuable knowledge to share. Within the scrum team, a
    manager is treated as one of the developers, and given no other authority than
    any developer on the team.


    # Managers as Developers


    In some organizations, the role of manager is viewed with disdain. We''ve all
    seen the image of the pointy haired boss from Dilbert cartoons. One of the advantages
    of scrum is that it doesn''t care how the manager performs outside the scrum process,
    as long as sufficient resources are provided to support a continuing scrum process.
    An effective scrum team should operate independent of this preconception, but
    the opportunity to work with a manager as a peer on a scrum team can help improve
    communications scrum as well.


    Employees on the team who feel uncomfortable interacting with their manager as
    a peer, or managers who feel uncomfortable with their reduced authority within
    scrum, should discuss the issue with the scrum master. A strong scrum master will
    be experienced in dealing with issues around management and authority, and how
    it relates to scrum.


    # The Rest of the World


    A scrum team doesn''t operate in a vacuum. Outside the scrum team, there''s an
    organization that needs a product developed, for whatever reason. Part of the
    responsibilities of the scrum master is to evangelize the value of scrum to the
    rest of the company. Along with that the responsibility to make sure scrum is
    actually serving the needs of the company and the constituents of the scrum process.


    Among these constituents are senior executives within the company, users of the
    product being developed, customers who may have commissioned the creation of the
    product—whether inside the company or outside—and other groups inside the company.


    From the outside, scrum can seem like a mystery. Despite the emphasis on transparency,
    the terminology of scrum can confuse people who aren''t familiar with what the
    terms actually mean. The artifacts and charts that scrum create seem to imply
    meaning that just isn''t there. Any confusion from outside the scrum team can'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Scrum Roles 47


    influence the stability of scrum, both in terms of resources being allocated,
    and the flow of stories into the process.


    # Users


    One of the most obvious constituents of the scrum team is the set of users the
    product is being developed to support. The user should be visible in practically
    every story, even if the story doesn''t affect the front-end interface of the
    website, or show up on the screen of the mobile device. Administrative users are
    users. Content managers who populate the product are users. Anyone who interacts
    with the product is a user.


    Instrumentation to make sure that user experience can be captured and tracked
    effectively for web and mobile products developed with a scrum approach. Without
    instrumentation to track clicks, gestures, goals, and interactions with critical
    features, the product owner will have fewer data points for reference when it
    comes time to decide what stories are most important to work on next. The intent
    of scrum is to support an agile process that allows quick adjustments in product
    direction based on real user needs.


    # Customers


    The customer for a product developed with scrum may be a client of the company,
    or may be an internal department inside the company. Regardless, direct interaction
    with the customer is the responsibility of the product owner. A strong product
    owner will shield the team from the customer, and protect the customer from feeling
    disconnected.


    Customers may or not know what they want. Often a customer will have an idea,
    and it will need to be worked out through the scrum process. This may mean several
    rounds of work with designers, and perhaps a few iterations through the product
    development process. As a result, the desired path to reality may not be as straight
    as a customer may wish. Product owners step in, keeping the


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_67_0.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# 48 Scrum: Novice to Ninja


    customer informed and satisfied, while clarifying the customer''s vision to the
    point that a team can estimate it work on it productively.


    A good product owner is a strong line of defense between the team and the chaos
    of direct interaction with the customer. This isn''t an easy role to fill, since
    the customer is paying the bills, or working for another department inside the
    same company. The support of a strong scrum master may be needed to help defend
    the scrum team. If the team feels they''re getting too much direct influence from
    the customer—that isn''t properly filtered through the product owner—they should
    feel free to engage the scrum master to help improve the process.


    # Executives and Other Employees


    A scrum master is both a coach and an evangelist when it comes to the rest of
    the company. Scrum masters need to be represent the power and value of scrum effectively,
    and explain it in terms that don''t rely on common vocabulary of scrum. Not only
    will the process attract interest from other employees, but also from executives,
    who will rightly be concerned about the value provided.


    Happily, scrum generates a lot of data. Among the artifacts of scrum will be real-world
    information about how much work the team can do in a given amount of time, how
    many stories have been completed, what features have been produced, working software
    to demonstrate, and the feedback of the team, the product owners, and the customers.
    The scrum master may choose to formulate reports for different audiences, host
    brown-bag lunches to explain scrum, or invite people to attend scrum rituals to
    see for themselves what''s going on.


    While managers are responsible for securing the resources necessary to support
    their employees, a scrum master is responsible for getting the buy-in and organizational
    support for the scrum process. If scrum is running well, everyone on the team
    will be an evangelist for it. Encourage scrum participants to let other employees
    know how it''s working. Positive word-of-mouth around the company is good for
    the careers of everyone on the scrum team, as well as the stability of the scrum
    process.'
