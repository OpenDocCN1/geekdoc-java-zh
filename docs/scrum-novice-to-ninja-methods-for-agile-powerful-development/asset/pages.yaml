  md: '![](img/b1806dfc7ab8e46f442d54c1e56b9394_87_0.png)


    Figure 4.4. Sprint Demo


    # # Objective


    The objective of the sprint demo is to get a clear picture of how much work has
    been completed during the sprint, and to see what the current state of the product
    will be after integrating the work that was done during the sprint. Based on the
    stories that get accepted, the team learns about how many points they can sustainably
    accomplish in a single sprint, and this improves their ability to estimate stories
    and sprint backlogs going forward.


    > > Guests in Sprint Demos

    The sprint demo is often a popular ritual for guests, because it''s the opportunity
    for people outside the scrum team to see what the team has been working on, and
    observe the state of the product in its next iteration based on the latest work
    produced. But the presence of guests shouldn''t be allowed to interfere with the
    objectives of the ritual, or alter the time box. Guests are observers, not participants.
    Unless feedback is solicited from guests, they should be asked not to comment
