- pgno: 162
  md: '# Taking Steps Toward Scrum


    Weve learned some things about scrum, and how scrum can help your web and mobile
    development project. The next question is how to take your team from zero to scrum.
    That''s going to be different for every team, and you''ll need to evaluate your
    own situation to determine how ready the organization is to adopt an agile approach.


    # Buy-in


    If your organization is currently following something like a waterfall process,
    the people at every stage in the cycle may be comfortable with the roles they
    have, and won''t be anxious to try something new. You may need to show them how
    much more effective and productive the organization could be with a scrum-based
    process.


    Executives may be concerned theyve less control over a team that self-organizes,
    and that they less input into a process that generates its own ideas. Point out
    to them that an agile process gives them the opportunity to shift and adjust priorities
    every sprint, adapting to the marketplace more effectively, while providing valuable
    feedback that they can use to help guide their decision-making process.


    Engineering managers may be confused about what their role is in a team that manages
    itself, but that concern grows out of a semantic misconception about the concept
    of being self-managing. Managers are still essential to help the team allocate
    resources, resolve personal issues, and identify and retain talent. Managers also
    bring their own background and knowledge to the whole development process. Engineering
    managers are free to dedicate a portion of their time to hands-on work as one
    of the engineers on a team, but their responsibility is securing the team s place
    in the organization, making sure they have the tools and resources they need,
    and defending them from distractions that they can continue with their scrum process.


    Designers may wonder how theyre going to fit into a scrum process, when their
    work doesnt necessarily follow the same cycle as the rest of the team. Show them
    that scrum provides designers with increased opportunities to have more impact
    before decisions get made, because designers can be involved in every stage of
    the development, and participate from the planning stages all the way through
    release.


    Engineers may be concerned about the change in their roles, especially if theyve
    gotten to doing one thing very well. Agile puts a greater responsibility on each'
