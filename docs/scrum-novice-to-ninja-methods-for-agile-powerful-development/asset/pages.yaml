  md: '# Chapter 9


    # Making Scrum Work for Your Web or Mobile Team


    For most of this book, we''ve been talking about the practicalities of scrum.
    Although the core definition of scrum is very versatile—supporting a wide range
    of applications—we''ve gone into a fairly opinionated and detailed explanation
    of the mechanics of scrum as it can be applied in web and mobile teams. (Many
    of these principles and practices, however, apply just as well to other kinds
    of development work.)


    Now that we have shared vocabulary and concepts, in this chapter we''re going
    to discuss how to get a team started with scrum. We''ll go into more detail about
    the arguments for scrum when doing web and mobile development. We''ll discuss
    what scrum is best for, how it compares to the alternatives, and provide answers
    to some of the questions that come up when making the case for scrum and applying
    it in a company.'
