    There''s wide range of tools available for monitoring the progress of stories
    through a scrum board. The most basic approach is simply keeping index cards taped
    to a wall where everybody can see them. For teams that are co-located, this serves
    a number of useful purposes. Not only does it encourage the use of index cards
    and handwriting for keeping stories short and succinct, it also creates a natural
    gathering place for daily standups, and as shared visual reminder of where the
    team is up to.


    # A Physical Scrum Board Carries Risk


    A physical scrum board made of index cards on the wall is subject to abuse, neglect,
    and possible mischief. People can brush against the board and knock index cards
    down. Cleaning staff can accidentally rearrange the board. And the changes from
    one day to the next may be difficult to spot. If you''re going to use a physical
    scrum board, it''s a good idea to take photographs of it on a daily basis, and
    publish photographs in a place where everybody can access them. This method isn''t
    perfect, but it can provide a recovery system if the board disrupted during the
    normal course of business.


    Apart from using a physical board, many companies have developed electronic tools
    and services that are designed to help teams capture and manage stories as they
    move from one state to the next. Some of these tools include the ability to track
    points, generate standard reports, and even set access and privacy levels. There
    are tools that allow teams to trigger automated build processes in a continuous
    integration by updating stories. Some tools tie into bug systems commonly used
    across a wide range of industries, facilitating communication with clients and
    users. Others tools may simply support the electronic tracking of a story as a
    card, while allowing everybody to see everything and make any changes.


