    # # Sprint Retrospective


    After the demo is completed and the sprint is closed, the team sits down with
    the scrum master to go through the sprint retrospective. The point is to get people
    talking about what they went well during the last sprint, what they could have
    done better, and what changes they think they should make to the process going
    forward.


    “One thing I think went really well was having the opportunity to follow that
