- pgno: 84
  md: '# Scrum: Novice to Ninja


    Finding a time for everybody can be challenging for teams that aren''t colocated,
    especially when some members of the team are in different time zones. Nobody should
    miss the standup on a regular basis, but there''s always room for flexibility,
    as long as the objectives of the daily standup are met. Even if not everybody
    can make it to a specific standup, the scrum master should keep the ritual for
    anyone who is there.


    Sometimes teams may need to come up with their own systems, and iterate on them
    reflectively from sprint to sprint. The priority should be keeping the rituals
    brief, maintaining them reliable, and making sure they provide the intended value
    without creating undue interruption.


    # Preparation


    Every team member should be present and available at the time of the standup.
    The only preparation necessary is for each team member to think about how to present
    the work done in the moment in such way that it''ll be clear and understandable
    to everybody, if a team is having blockers that relate to people outside the team,
    it''s reasonable to let those people know to be prepared to discuss the issue
    immediately after the standup.


    There''s no special preparation needed by the scrum master before the standup.
    A good scrum master may check the status of the stories being worked on before
    the standup, to see if any changes are pending, or arrange to round up any guests
    the scrum master thinks should be there who don''t normally attend.


    # Three Questions


    The core of the daily standup consists of the scrum master going around the team
    and asking every person three questions:


    +   - What have you done since the last standup?

    - What do you plan to do until the next standup?

    - Is there anything blocking your progress?


    It should be as simple as that. Every member of the team answers each of these
    questions, and once the last person has finished reporting, the standup is over.
    Unless the scrum master has urgent announcements that need to be made for the


