  md: '# Scrum: Novice to Ninja


    The size of the sprint backlog for the current sprint is based on the negotiations
    that happened during sprint planning at the beginning of the sprint. Each story
    is estimated during the sprint planning, and the backlog as a whole should represent
    the total number of points that the team believes it can accomplish in the upcoming
    sprint. Each story has a point value, and that reflects the amount of work the
    team believes will be necessary to complete that particular story.


    The order of the stories in the sprint backlog is established initially at the
    sprint planning, but it''s the prerogative of the product owner to change the
    order of stories in the sprint backlog at any point during the sprint. The product
    owner may not add stories to the sprint backlog, or remove stories from the sprint
    backlog, but may rearrange them as necessary to indicate which stories are most
    important.


    # Making Major Changes to Stories Within a Sprint


    If a significant change needs to be made to the stories in the sprint backlog,
    and that really can''t wait until the end of the sprint, the scrum master should
    stop the sprint and start a new one, with a new sprint planning. Because of the
    interruption and the cost, this is a very drastic option. It should only be employed
    as a last resort, or if it''s obvious that none of the work done in the current
    sprint backlog is appropriate for the changed needs of the product owner.


    During the sprint, developers pick stories from the top of the sprint backlog
    every time they complete a story and need something new to. Each engineer should
    choose the story at the top of the backlog, because that''s the one product owner
    considers the highest priority in the current sprint. Picking stories that aren''t
    for the top of the backlog will result in working done out of priority order.


