  md: '# Time Box


    The time allocated for sprint planning is contingent on the number of stories
    completed the sprint, and the level of intricacy associated with the acceptance
    criteria. Most teams allocate half a day for the sprint demo if they''re using
    a two-week sprint. Once the team has decided how long they want to devote to the
