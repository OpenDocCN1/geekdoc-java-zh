  md: '# Chapter 8


    # # Working Through Scrum


    In the last chapter, we were introduced to the product owner''s world, and taken
    through the process of developing and creating a story for the team. We saw how
    requirements were gathered, how the product backlog was built up, and how the
    expectations of internal and external clients, along with other interested parties,
    translated into clearly defined scrum stories for the team.


    Then we went through the process of seeing how stories are introduced to the team,
    and how the team negotiated them with the product owner to make sure that what
    they were going to work on made sense, and was capable of being finished within
    a sprint.


    Now it''s time to follow that story through a sprint. In this chapter, we''re
    going to see how the team divides up a large story like the one we''ve been discussing
    in smaller tasks, and distributes these out so they all be worked on and completed.
    We''re going to see how all aspects of the story get addressed until they meet
    the definition of done.


    Finally, we''re going to see the team go through the demo process with the product
    owner, and with any luck, maybe the story will be accepted at the end of the sprint.'
