- pgno: 114
  md: '# Velocity Chart


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_114_0.png)


    Figure 5.6. Velocity Chart


    Velocity is how a scrum measures the amount of work they can complete in a typical
    sprint. Velocity is measured historically, from one sprint to the next. By tracking
    the number of story points the team can complete according to their own definition
    of done, they can build up a reliable and predictable sense of how long it will
    take them to complete new stories based on their relative point value.


    Keeping track of the velocity is the responsibility of the scrum master. At the
    end of each sprint demo, the scrum master should calculate the number of points
    that were estimated for the stories that were accepted as done during this sprint.
    This number should be added as a data point on the velocity chart for sprint.


    Velocity charts tend to start jumping around from very high numbers to low numbers,
    as the team learns how much work they can do in a sprint, and how to estimate
    stories consistently to each other. The longer a team works together, the better
    they get at estimating stories consistently to each other. That skill leads to
    a better sense of how many stories, and how many points, the team can accomplish
    in a single sprint.


    Over time, if the composition of the team stays consistent, a velocity chart that
    started off very erratic will find itself averaging toward a consistent value.


