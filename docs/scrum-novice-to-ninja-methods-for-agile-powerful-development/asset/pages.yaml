    the acceptance criteria. It also reminds the engineers to make any preparations
    to allow unreleased stories to be demonstrated.


    The scrum master should meet with all engineers who have stories completed, to
    make sure these stories are prepared for the demo. It''s the responsibility of
    the scrum master to run the ritual, and to see to it everything that needs to
    be demonstrated can be presented within the time box allocated. The scrum master''s
