    to fits within time box.


    # Scheduling Demos and Retrospectives


    Frequently teams will schedule a sprint retrospective (which we will be covering
    shortly) on the same day as a demo. The advantage of scheduling these is the interruption
    in productivity associated with the rituals is minimized. The disadvantage for
    the team is that these days produce primarily scrum artifacts, as opposed to tangible
    product development. That tradeoff needs to be considered, and different teams
    will have different preferences.


    # Preparation


    The sprint demo is the opportunity for the team to show off all of the work they''ve
    been doing, and demonstrate that all of the stories they''ve been working on are
    done and ready to include in the product (assuming they haven''t been already).
    The demo covers all the work back to the beginning of the sprint that has taken
    a story to the team''s definition of done, whether or not that has been released.
    Each person who has worked on any stories that are ready to demo needs to be prepared
