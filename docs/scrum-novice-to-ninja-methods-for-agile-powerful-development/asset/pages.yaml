    # Beware Guests at Standups


    There''s a strong tendency for people attending standups as guests to ask questions,
    introduce new information, or start discussions that don''t relate to the entire
    team. Anyone who isn''t a member of the development team shouldn''t be speaking
    during standup. The scrum master needs to be strong about suppressing this kind
    of behavior. People of high rank in the organizational hierarchy don''t get special
    treatment in this regard. Everyone needs to respect the time and attention of
    the engineers, and allow them to get back to work as quickly as possible.


    In answering the questions of the standup, each engineer needs to be prepared
    with a succinct description of what''ve worked on, what they plan to work on next,
    and whether they have any blockers. This is a skill that takes practice, and the
    scrum master should be prepared to coach each team member on how to answer these
    questions in a way that makes the best use of the time available.


    If one person''s report invites a little bit of back-and-forth discussion, the
    conversation has relevance for the entire team, the scrum master may permit it.
    But this type of interaction must be limited to respect the time box of the standup.
    If the conversation gets beyond a few sentences, the scrum master should step
    in and suggest that the conversation be taken off-line. A good scrum master will
    keep track of what conversations need to happen at the end of the standup, and
    follow up on their status afterward.


