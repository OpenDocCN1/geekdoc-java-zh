- pgno: 21
  md: '# Chapter 1


    # Introducing Scrum


    # What Is Scrum?


    If you picked up this book to learn about applying scrum to your web or mobile
    development team, you may already be familiar with the terms scrum and agile.
    Perhaps you received this book from your company, or maybe you''ve been tasked
    with implementing an agile process in your own organization. Whatever the reason,
    it''s always useful to start with a clear, shared definition of the relevant terms.


    **Scrum** is one of several techniques for managing product development organizations,
    lumped under the broad category of agile software development. **Agile** approaches
    are designed to support iterative, flexible, and sustainable methods for running
    a product engineering organization.


    Among the various agile techniques, scrum is particularly suited to the types
    of organizations that develop products such as websites and mobile software. The
    focus on developing cohesive, modular, measurable features that can be estimated
    relatively, tracked easily, and that may need to adapt quickly to changing market
    conditions makes scrum particularly appropriate for these types of projects.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Scrum: Novice to Ninja


    Scrum encourages teams to work in a focused way for a limited period of time on
    a clearly defined set of features, understanding that the next set of features
    they may be asked to work on could be unpredictable de changes in the marketplace,
    feedback from customers, or any number of factors. Scrum allows teams to develop
    an improved ability to estimate how much effort it will take to produce a new
    feature in a relative way, based on the work in features they''ve developed before.
    Scrum creates the opportunity for a team to reflect on the process and improve
    it regularly, bringing everybody''s feedback into play.


    > Don''t Confuse Merely Applying Scrum Terms with Actually Scrum


    A familiar anti-pattern in non-agile organizations looking to mask their process
    problems is using a labeling system on top of their waterfall techniques and tools.
    That can create confusion, and even negative associations among people who have
    seen these terms incorrectly, and who mistakenly believe they''ve seen scrum in
    action.


    As we go through this book, you''re going to find out more about how scrum functions.
    You''re going to be introduced to all of the aspects of scrum, including its rituals,
    and its artifacts, and the roles that it creates for people in an organization.
    We''re going to introduce you to a team of people working in a scrum environment,
    and show you how they adopted scrum in the first place, and how they adapted to
    it.


    Before we get there, it''s worthwhile taking a moment to position scrum in its
    historical context. Scrum came into existence right around the time that web development
    emerged on the engineering landscape and it flourished as mobile technology became
    part of our daily lives. If you consider how scrum works, where it came from,
    and how we apply it, I think you''ll see there might be a reason for that.


    > Scrum''s Odd Vocabulary


    The vocabulary of scrum is distinctive, and may sound odd. That''s intentional.
    Scrum uses terms such as ritual, artifact, and story to make it clear that these
    concepts are different from related ideas that may be encountered in other project
    management approaches.


