- pgno: 96
  md: '# Scrum: Novice to Ninja


    their issues so that can be discussed in a productive way. This ritual isn''t
    about personal attacks, but finding ways in which the team can work better together.


    > ### Ordering Ritual

    The order of the sections of this ritual—dealing with what went well and what
    didn’t go well—may be reversed according to team preference. Scrum masters may
    also choose to follow any number of practices to get the team more engaged in
    this process, including games, note cards, advance submissions, etc. There''s
    a lot of room for creativity in planning this ritual.


    # What Should We Do about It?


    After everybody had an opportunity to discuss what they thought went well during
    the sprint, and what didn’t go well, the floor should be opened for discussion.
    This is a chance for everybody on the team to say more about the issues they raised,
    and as the issues raised by their teammates, and what they think the team should
    be doing about them.


    For things that went well, the team should try to find ways that the successes
    can be replicated in future sprints. They might have tried something new this
    past sprint that turned out to be successful, and that can be integrated into
    the process going forward.


    For things that didn’t go well, the team has the opportunity to discuss what went
    wrong. Sometimes the issue was that the process was not followed. Other times,
    the process actually got in of the way, and needs to be adjusted. Everybody should
    be encouraged to give their opinions about changes that might be beneficial.


    Eventually, the discussion will circle around four or five key issues that the
    team wants to focus on. The scrum master should guide the discussion in a way
    that these issues get phrased as revised practices—which the team can then agree
    to try for the upcoming sprint.


    > ### Only Make Manageable Changes Between Sprints

    While there may be many issues discussed, the team should agree on a small and
    manageable set of changes to make from one sprint to the next. With user ex-'
