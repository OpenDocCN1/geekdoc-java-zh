- pgno: 165
  md: '# Tracking Effectiveness


    Scrum is all about establishing a sustainable process that adds real value, and
    reviewing that process on a regular basis in order to make sure it''s producing
    the desired results. Why not use agile techniques to make sure scrum is working
    for your company?


    One of the most useful techniques when implementing scrum in a new organization
    is to establish a baseline of productivity before scrum, and use that to measure
    the effectiveness of scrum. Where you establish that baseline, and how you measure
    it, are very subjective. Each organization has its own standards and productivity
    indicators.


    For example, a web development team may judge itself by the number of comparable
    features it''s able to add to a website. A mobile development agency may track
    how quickly they are able to get from concept to implementation with a typical
    client. The ability to fix or address bugs may also be relevant. Ask around, and
    find out how the company judges its own performance. (You may be surprised at
    how low formal attention is paid to the matter).


    Before implementing scrum, pull together a representative sample of data about
    the performance of the organization without scrum. That, you''ll have a comparison
    point to use when evaluating how effective scrum is, and reporting on to interested
    parties. Keep updating the data as the team applies scrum and develops its agile
    abilities.


    If you don''t see improvements, you can use the scrum process to raise the issue
    during a retrospective, and figure out what''s working, what isn''t, and how you
    can improve.


    # Troubleshooting


    It would be lovely if everything worked as you expect it to perfectly, from the
    beginning to the end every single time. That doesn''t happen in the real world.
    One of the advantages of scrum is that it doesn''t pretend that things are always
    going to be perfect. Scrum has built-in checks and balances to make sure the team
    is always responding to changing conditions, and reinforcing scrum techniques
    to make sure they support their goals.'
