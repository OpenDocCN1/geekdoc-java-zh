  md: '# Chapter 10


    # Adapting to Scrum


    We''ve talked about the systems that make scrum work. We''ve discussed the approach
    that scrum takes to product development, and some of the rituals and artifacts
    that help the people taking on the roles of scrum to get their work done efficiently
    and effectively in a sustainable manner.


    But ultimately, scrum is about people. If the people on your team aren''t feeling
    inspired and motivated by their work, scrum can''t step in and change that. What
    scrum can do is help people who are good at their jobs work together in a more
    efficient and effective way, constantly improving.


    Way back in Chapter 2, we were introduced to everybody on the team, and we got
    a chance to discuss some of their concerns about scrum. So let''s take a look
