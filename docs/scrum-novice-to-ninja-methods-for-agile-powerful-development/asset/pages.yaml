- pgno: 71
  md: '# Chapter 4


    # # Scrum Rituals


    The practice of working on a scrum team is organized into a series of rituals.
    The rituals mark key events in the process of carrying out the work of a sprint.
    It''s the responsibility of the scrum master to host each of the rituals, and
    make sure that they focus on their objectives, and produce the desired results
    for the benefit of the entire team.


    # ## What Are Rituals?


    Each **ritual** is a face-to-face gathering in real time, which takes people away
    from the work they''re doing, and offers the opportunity to have targeted communication
    with each other about the context of that work. Scrum favors communication over
    documentation, which is why it provides regular and clearly defined opportunities
    for various types of useful face-to-face communication.


    # ## Not Another Meeting!


    Many people who work in companies are allergic to meetings, and for good reason.
    They may have been overwhelmed by too many meetings, taking up too much of their
    time, and not producing any results. They may be used to having meetings'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Scrum: Novice to Ninja


    called to address every little issue, without any person being responsible for
    making sure the issue gets resolved. Meetings can take people away from the work
    they''re doing, and interrupt their focus, often without providing much value
    in return.


    Let''s face it, most companies are *terrible* at meetings.


    Unlike the usual meeting, every ritual in scrum has a specific objective, addresses
    a particular audience, a defined time frame within which to accomplish its goals,
    and a predictable set of outcomes. Everyone attending a ritual knows what to expect,
    how to behave, and what the result of the commitment is supposed to be. The rituals
    of scrum are mindful of their overall purpose, and respect the time and attention
    of the participants.


    # Time Boxing


    One of the most important concepts in scrum rituals is that of the **time box**.
    It''s the responsibility of the scrum master who hosts the rituals to keep everybody
    aware of exactly how long they have committed for this ritual, and how far away
    they are at any point within it.


    Often scrum masters will write the time on the whiteboard in front of the room,
    or keep a large clock visible so everyone can keep track of the time (I have been
    known to bring a small cube-shaped clock labeled “Time Box” to rituals, and display
    where everyone can see it.) The concept of time boxing empowers all active participants
    in a ritual to encourage each other to get to the point when necessary, and remain
    focused on the objectives of the ritual.


    > ### How long should each time box be?

    The length of the team will spend on each ritual usually depends on the number
    of weeks allocated per sprint. The only ritual that must stay within a 15 minute
    time box is the daily standup. Teams need to come to an agreement on the time
    box for each ritual as part of the process of iterating and improving how they
    organize themselves for scrum. I''ve provided a few suggestions below for teams
    to start with.


    Scrum shows its respect for the time and commitment of every participant by establishing
    at the beginning of each ritual what the time box is, and how that time will'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Scrum Rituals 53


    be allocated for the different aspects of the ritual. All participants are expected
    to remain engaged and participate during the time box of the ritual, with the
    promise that the ritual won''t be extended without a good and practical reason,
    and unless all participants agree to the extension.


    If a ritual appears to be beyond its time box, the scrum master should ask everybody
    for their permission to continue the ritual for a specific length of time. That
    way everybody knows front how much time to budget, and everybody has to agree
    if the budget needs to be extended.


    Of course, we are all human, and side issues will come up during rituals that
    if they need to be discussed right and then. Keeping the focus on the ritual at
    hand is the responsibility of the scrum master, as well as the rest of the team.
    A good scrum master needs to keep track of these issues, and maintain respect
    for the time box of the ritual in progress for the sake of everyone involved.


    Making sure that important side discussions don''t get lost is a shared responsibility,
    but the scrum master needs to be prepared to take an active role in that process.
    People will more willingly set aside an off-topic discussion if confident that
    they''ll be able to pick it up again later.


    # The Length of the Sprint


    Teams have some choices to make when it comes to choosing the length of the sprint.
    Sprint length should allow the types of stories the team expects to work on to
    be completed, according to the team''s own definition of done, within a single
    sprint. For many teams, a short sprint of just one week matches with short stories
    that are easy to finish in a week. Some teams prefer to work with more complex
    stories that couldn''t be completed within one week sprint, so they opt for two-week,
    three-week, or even four-week or longer sprints.


    The length of the sprint is another factor that can be modified by feedback received
    from the team, but it''s important for a team to choose a length and stick it
    for several sprints. Otherwise, the team may never benefit from the regularity
    so they can learn how size stories consistently and estimate them correctly from
    one sprint to the next. Often the option to change sprint length can be addressed
    just by improving the ways stories are written, so they can be completed within
    a sprint.


