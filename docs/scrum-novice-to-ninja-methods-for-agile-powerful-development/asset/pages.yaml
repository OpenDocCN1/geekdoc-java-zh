    # Let the Product Owner Drive the Demo


    While some teams let the engineers demonstrate the stories, a good practice is
    to have the product owner participate, testing the product live. The engineer
    who was developing a new feature knows the happy path for the code that will always
    work. But a product owner will be looking for edge cases, and is aware of the
    acceptance criteria that are most important. Having the engineer set up the demo,
    and the product owner present, keeps everyone engaged and ensures that the stories
    are done to the satisfaction of the product owner.


    # Demonstrating a Story


    The process of demonstrating each story should be consistent. The scrum master
    should go through each story on the list, and have the engineers set up the demo
    for the team. Many teams choose to do this using a projector in a large monitor,
    or even through remote conferencing services, depending on the nature of the story
    and the preferences of the team.


    At this point in the sprint, the description of the story will be familiar to
    most of the people in the room, but the product owner should read the story—as
    well as any major acceptance criteria—to the team while the demo is being set
    up. That way, everybody will know what to look for, and will be aware of issues
    that might come up.


    Once the story is set up and ready to demo, the state of the product is the main
    focus of attention. Each story should be a complete slice of functionality added
    to the product, and the demo should show slice of functionality in context with
    the actual product. The demo should walk through each of the acceptance criteria,
    proving that they have been met.


    Sometimes during a demo, it''s realized that the acceptance criteria as they were
    originally written are inadequate, and may not have covered all the cases the
    product owner needed addressed. If this happens, keep in mind that a demo that
    meets all of the acceptance criteria—as they specified in a story that was estimated
    at the sprint planning—should be considered accepted and done. Any further'
