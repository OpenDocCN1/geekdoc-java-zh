    > What to work on next?

    If an engineer is unclear about what should be worked on next, the priority of
    the sprint backlog should guide these decisions. The product owner is responsible
    for grooming the sprint backlog throughout the sprint, and making sure that it
    represents the priority in which the stories should be addressed.


    Unless there''s a compelling reason, any engineer without a current story should
    start working on the story at the top of the backlog with the next highest priority,
    regardless of specialization. Following this pattern can provide an opportunity
    for engineers to pair with somebody in an area where they have less experience,
    and help spread knowledge the entire code base throughout the team.


    Finally, the scrum master may make announcements that have relevance to the entire
    team at the end of the standup—everyone has had a chance to report, and only if
    there''s time left. This shouldn''t become a replacement for any organizational
    team building that may come from company meetings, team lunches, and other gatherings.


    # Sprint Demo


    At the end of the sprint, everything that was worked on for the current sprint
    is demonstrated for the team, the product owner, and anybody who''s invited to
    observe. This ritual is called the sprint demo, and it gives all of the engineers
    the opportunity to demonstrate the stories they''ve been working on that consider
    complete. The sprint demo is the product owner''s opportunity to test each story,
    see if it meets the acceptance criteria, and then either accept or reject it.'
