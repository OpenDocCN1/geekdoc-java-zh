- pgno: 47
  md: '# Chapter 3


    # Scrum Roles


    # Establishing Who Does What


    Scrum is a system that supports sustained productivity for a team. But if you
    try to adopt scrum, and don''t give adequate consideration to the purpose of each
    of the roles that scrum assigns to the participants, you''re likely to find problems
    maintaining the balance and rhythm of scrum. Cutting corners on the defined roles
    is one of the most prevalent anti-patterns in scrum, and it''s easily avoided
    by making the assignment of roles deliberate and explicit.


    Traditional scrum defines only three critical roles: scrum master, product owner,
    and team member. We''ll start with these. But scrum plays out in a context, and
    for web and mobile development, that context is usually a company or organization
    trying to create technical embodiments of experiences for clients, users, or customers.


    # No Hierarchy


    An agile scrum team operates within an organization that may have a hierarchy
    of management. But the roles in scrum are all equals as far as the process is
    concerned.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# SCRUM ROLES


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_48_0.png)


    Figure 3.1. All roles are equal in scrum


    Although the title may sound imposing, the scrum master has no authority other
    the leadership demonstrated in the role of servant leader for the scrum process.
    The product owner has no authority other than maintaining the vision of the product
    and shepherding it through the scrum process. The team has no authority other
    than the power to estimate, accept, reject, commit to work on, and complete stories.
    And everyone should be empowered to enforce these roles to preserve an agile environment.


    # A servant leader?


    The term servant leader is often used when discussing the delicately balanced
    scrum master occupies. The scrum master has no formal authority over anything
    other than the rituals and artifacts of scrum, leads the team from within by embracing
    and evangelizing the concepts of scrum. A scrum master serves the needs of the
    entire team—helping to eliminate blockers (impediments to the scrum workflow)
    and coaching people about how to follow the practices of scrum—and should lead
    by example when advocating for and defending scrum.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Scrum Roles and Organizational Roles


    The roles of scrum are independent of the formal job titles that may be assigned
    and managed as part of the hierarchy of a company. For some teams, this can cause
    confusion over how the people who are not part of the formal agile process fit
    into the process. Nobody the scrum team really needs to understand scrum for it
    to work. But an important part of scrum is transparency, and the activities of
    a scrum team may draw undue attention.


    In this chapter, we''ll go over the critical roles of scrum master, product owner,
    and team member. In addition, we will discuss the motivations and perspectives
    of many people outside the scrum team whose involvement may have an effect on
    how well scrum works, and may ultimately be the key to advocating for and maintaining
    scrum in an organization.


    # Scrum Master


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_49_0.png)


    Figure 3.2. The role of the scrum master


    A scrum master is the glue that ties a scrum team together. Scrum masters are
    responsible for keeping people clear on their roles, managing the rituals and
    artifacts of scrum (which we''ll be getting to shortly), and coaching people within
    the team'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Scrum: Novice to Ninja


    and across the organization to help overcome blockers and maintain a sustainable
    productive pace.


    Unlike project managers, a scrum master comes with a clearly defined mission as
    a servant leader to the team. A scrum master has no formal authority within an
    organization, other than the authority to shepherd the team through the rituals
    of scrum, and maintain the artifacts that track the team''s progress. But the
    scrum master has ultimate authority when it comes to the scrum process and how
    it''s being applied.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_50_0.png)


    # The Scrum Master''s Involvement


    The scrum master may be part of the development team, but just as often a scrum
    master may have no involvement in the day-to-day development work of the team.
    For teams who have been following scrum practices for a while, and who are comfortable
    with scrum, a single scrum master with no development duties may be able to take
    responsibility simultaneously for two teams.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_50_1.png)


    # The Scrum Master''s Responsibilities


    A scrum master is usually part of the Engineering department, and in some cases
    may be a member of the development team. A conflict of interest for a scrum master
    to be the manager of the people on a development team. A scrum master should have
    no formal organizational authority over the team, otherwise the team may feel
    inhibited about raising issues with the scrum master because of the potential
    ramifications.


    # Responsibilities


    There are a few critical rituals that a scrum master must observe. At minimum,
    these include the daily standup, the sprint planning meeting, the end-of-sprint
    demo, and the sprint retrospective. We are getting into more detail about these
    rituals soon.


    In addition to hosting the rituals of scrum, a scrum master is responsible for
    coaching the team through the scrum process. This may involve stepping boldly
    into discussions about individual roles and duties, and helping people communicate
    their needs and expectations in a way that makes them understandable. In sense,
    a scrum master can become a team''s advocate, counselor, and liaison to other
    parts of the organization.


