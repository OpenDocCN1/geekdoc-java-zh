    # Don''t Go Into Detail About Issues Encountered


    > While it is tempting and valuable for the engineers who worked on a story to
    go into detail about the difficulties or new learnings that came out of developing
    particular story, the demo isn''t the time for this. If the conversation turns
    to those topics, the scrum master should encourage people to make a note of these
    points, and bring them up at the retrospective. Otherwise, the demo can turn into
    a long dialogue about the details of creating each story, rather than a demonstration
    of the product with the new stories in place.


    # Tallying the Points


    At the end of the demo, a number of stories will have been accepted, and some
    may have been rejected. The scrum master should add the number of points completed
    during the sprint, based solely on the estimated points assigned to stories that
    were accepted as done. Only stories that were accepted as done, and that were
    assigned points at the sprint planning, should be included in this total. The
    total number of points completed in the sprint should be recorded as the team''s
    velocity for that sprint.


    Some stories may have been rejected, or may not have been ready to demo despite
    being included in the sprint backlog. It''ll be to the product owner whether stories
    weren''t completed will be added to the next sprint, or on holding a possible
    future sprint. The scrum master needs to keep track of all the stories, both completed
    and not yet completed, and update their status in any tracking tools that the
    team may using.


    Often the scrum master will generate a set of reports that are sent out at the
    end of the sprint demo, updating interested parties about the status of the product.
    If the team has decided to both the sprint demo and the sprint retrospective on
    the same day, the scrum master may want to arrange the schedule so that the necessary
    data for these reports can be collected between the two rituals, making them available
    for reference.'
