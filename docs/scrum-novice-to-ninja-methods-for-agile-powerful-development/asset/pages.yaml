    # Loose Demos


    Every team needs to come up with a clear definition of done. Part of that definition
    should always include all of the story''s acceptance criteria as it was written.
    This gets tested during the demo. It''s important to be consistent about the way
    stories are accepted at demos, and not allow the standards to get too flexible.


    One common issue that comes up is teams that allow stories to be accepted when
    the acceptance criteria are not fully met. Sometimes, stories are accepted into
    a sprint, but the work on them lingers into the beginning of the next sprint,
    because they were "almost done.\ This confuses the end of one sprint and the beginning
    of the next, making it more difficult to say clearly what was done in one sprint,
    what needs to be done in the next, and what the team''s real velocity.


    It''s also vital that teams come to demos demonstrate all the work they did in
    the sprint. Frequently, teams find themselves sitting around waiting while the
    developer finishes deploying code, or adjusting the staging environment for the
    demonstration. While it''s reasonable to expect that there are emergencies that
    get in the way, it''s the responsibility of the developer who worked on the story
    to make sure it''s ready to demo, and that the product owner knows how to walk
    through the demonstration.


    Some teams take a very strict approach to this, not accepting any story that isn''t
    an exact fulfillment of all of the acceptance criteria and ready to demonstrate
    at the start of the demo. While that may seem harsh, the important thing to remember
    is getting things into the sprint is not as important as getting the work done.


    Teams can be as severe or as lax as they like around demo acceptance criteria,
    as long as they''re consistent. There''s nothing wrong with being on the side
    of being severe, and making sure that what was done in the sprint was completed
    within


