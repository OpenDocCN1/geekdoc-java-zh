    # Problem Solving During Retrospectives


    Without retrospectives, scrum doesn''t have the opportunity to learn from its
    mistakes, or benefit from its successes. Retrospectives also serve a strong team-building
    function, in that they allow the team members to share what is on their mind with
    their colleagues. While the most common problem teams have with retrospectives
    is not holding them at all, on the list would be trying to resolve the problems
    that come up during a retrospective at the ritual itself.


    Retrospectives are an opportunity for everybody on the team to bring up anything
    they think went or didn''t go well the previous print, and to discuss how to address
    the issues going forward. This touches on potentially sensitive topics, and can
    bring a lot of emotions to the surface. For people who feel they be on the negative
    side of a discussion, there''s a strong impulse to resolve the problem then and
    there.


    There are several reasons why a retrospective is not the best occasion for resolving
    issues that come up:


    +   - Some issues may involve too many of the people in the room, and may require
    more consideration before everyone can agree to a solution.


    +   - Not everybody is going to feel comfortable talking openly at the retrospective
    about some issues that may be sensitive, and that might be better addressed in
    smaller meetings.


    +   - It''s also easy for people who have louder voices or stronger opinions to
    take over large discussions, negotiating opinions that might be easier to recognize
    in a less open form.


    +   - In addition, trying to solve a problem that doesn''t affect everybody in
    the group is a waste of some people''s time.


    It''s up to the scrum master to remind everybody that the retrospective is not
    an occasion for solving problems, but rather for recognizing that they exist,
    and for committing to solve them during the upcoming sprint.'
