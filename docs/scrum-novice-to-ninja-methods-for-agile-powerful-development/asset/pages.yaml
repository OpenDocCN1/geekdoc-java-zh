- pgno: 40
  md: '# A Product Manager


    # My Role


    As the product manager for the WithKittens site, I work for the Product group,
    which reports up to the CEO. We''re responsible for making sure the services provide
    to our customers are the best they can possibly be. I have balance a lot of concerns,
    including feature requirements from Sales, promises that the executives make to
    the board of directors and the investors, as well as practical budgeting and engineering
    requirements. At the same time, I have to looking at how the product is evolving,
    and planning for the next release and the next version. Our site needs to continue
    support all of our existing users, while growing to reach new users.


    # Motivations


    What gets me most excited about my work is the opportunity to build a service
    that exceeds the expectations of our customers. I''m happy when I get an email
    from a user who''s received superior service from us. But email isn''t the only
    way I find out about that. I love to see our numbers improve over time. We''ve
    incorporated a lot of different tracking services into our site, so we can measure
    where we are getting the most out of what we provide. Beyond, one of my favorite
    responsibilities is user testing, where I can sit down with customers and find
    out what they like about our service, and where they need us to improve. Ultimately,
    it''s about providing the best service we possibly can, and I enjoy being a part
    of that.


    # Perfect Day


    A typical day for me goes back and forth work with the designers on new features,
    work with clients on expectations, work with executives on feature expectations,
    and work with the engineers on how those features are developed. I enjoy the opportunity
    to see a project from many perspectives simultaneously, but I have to switch gears
