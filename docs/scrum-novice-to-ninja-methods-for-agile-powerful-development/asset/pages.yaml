    traction WithKittens has managed to achieve. Despite the potential for fragmenting
    the market, there is an advantage in being able to stay focused on kittens on
    their core service. It also avoids the confusion of adding puppies as a service
    called WithKittens.


    Ultimately, the product owner decides the best approach will be to ask the team
    to clone some sections of the WithKittens service, and create a parallel WithPuppies
    service. They have already purchased the domain WithPuppies.com in anticipation
    of this possibility, and the designers have been playing with ideas around this
    concept casually.


    Before moving forward with that decision, the product owner calls one of the senior
    engineers for a chat, and confirms that this would be the most technically straightforward
    approach. The sooner they get a service into the market that they can test, the
    sooner they''ll know whether or not it makes sense.


    # Formulating a Feature


    After sketching out a few ideas, the product owner decides the best way to do
    this quickly and efficiently will be to create a scaled down version of the product
    exclusive for web users. The company can use its deploying system to limit the
    audience to a small percentage of visitors.


    These visitors will be presented with a link that offers them puppies instead
    of kittens as they log in. If they click that link, they''ll be taken out of the
    WithKittens.com domain and put into the WithPuppies.com domain. There, the experience
    of the site will be the same, except kittens will be replaced with puppies.


    Since this isn''t what most customers care to the company, it will have to be
    very easy for a visitor to switch back to kittens. It would also be great if they
    could include a way to gather feedback from visitors.'
