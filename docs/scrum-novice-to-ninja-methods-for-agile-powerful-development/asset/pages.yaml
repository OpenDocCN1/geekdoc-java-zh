    societies. The idea for the service became something to support one nonprofit
    organization, and grew quickly as other nonprofits—and eventually users—decided
    they also wanted to be able to add kittens to their pictures.


    Most of the paying customers for the service are high-end social media users,
    as well as people who want more control over how their kittens are presented in
    their pictures. But there''s also a growing business clientele, including companies
