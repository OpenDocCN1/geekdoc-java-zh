    # Summary


    So not everything has gone perfectly smoothly, but in life does everything go
    perfectly smoothly? On web and mobile development teams there are often long-over
    refactorings that need to be considered, personality differences, conflicts of
    interest, and genuine disagreements over the details of what needs to be done
    next.


    Scrum isn’t going to make these things go away, but it provides processes for
    working through them in a professional and productive manner, and for discussing
    them openly so that the process can be improved every sprint.


