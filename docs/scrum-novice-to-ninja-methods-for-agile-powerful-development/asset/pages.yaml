- pgno: 82
  md: '# Scrum: Novice to Ninja


    The end product of a sprint planning is a sprint backlog that everyone on the
    team can agree to. The scrum master should poll the room to make sure everyone
    agrees that the commitment is realistic, and that they are willing to take it
    on for the upcoming sprint. Then the new stories should be entered in order of
    priority into the tracking tools the team has agreed to use for the sprint backlog.


    Sprint planning reminds everybody exactly where they are in the process of building
    the product owner''s vision for the product, and what the objectives are for the
    upcoming increment. At the end of sprint planning, everyone on the team should
    have a good sense of what they need to do next, and a firm commitment to a set
    of prioritized stories to complete over the duration of the upcoming sprint.


    # Daily Standup


    The daily standup is probably the first ritual that comes to mind when people
    think of scrum. The daily standup provides a heartbeat for the team, giving everybody
    a regular opportunity to get a clear picture of what other people on the team
    are working on, and what the status of the project as a whole.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_82_0.png)


    Figure 4.3. Daily Standup'
