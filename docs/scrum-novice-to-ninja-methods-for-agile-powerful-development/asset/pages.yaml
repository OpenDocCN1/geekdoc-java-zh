  img_proc: true
- pgno: 121
  md: '# The Scrum Contract 101


    Part of assuming a role in the scrum team means being willing to act with your
    colleagues as an equal around issues that arise during scrum rituals. Anybody
    participating in scrum should feel free to share their opinions around the project
    and process, even when those opinions go against the mainstream, challenge the
    authority of somebody with a higher position in the organizational hierarchy.
    When a conflict occurs, it''s the responsibility of the scrum master to help mediate
    and facilitate the conversation.


    More fundamentally, participating in scrum assumes a willingness to be part of
    a team. The roles and rituals of scrum are set up so that everyone has an opportunity,
    and an obligation, to participate. A member of the team who doesn''t share opinions
    and ideas is leaving rest of the team down. As a member of a scrum team, regardless
    of your position in the company, your goal is to help support the process for
    everybody. Because the groups are small and intimate, and the rules of participation
    are clearly defined, scrum provides a safe space for shy people to experiment
    with expressing themselves.


    Because of the distinction between typical company meetings and scrum rituals,
    there may be some confusion from time to time about how people are expected to
    behave. The scrum master should be the ultimate arbiter when questions like this
    come up. It''s up to each team to define for itself what the most useful standards
    of behavior are, and to enforce them appropriately.


    Ultimately it comes down to respect for your colleagues, for the process, and
    for your place in the process. If you have questions, or you think something isn''t
    working, there''s always an opportunity to raise these at the retrospective. Don''t
    miss your chance to participate actively.


    # Providing Transparency


    For scrum to work effectively, everybody on the team needs to be letting other
    people know what they''re working on at all stages of the process. Some call this
    transparency. It allows everybody to know what everybody else is working, so that
    everybody can have a larger sense of the status of the project, and how they can
    help.


    Transparency serves a number of purposes. Part of the value of scrum is that it
    makes a lot of information about the status of the project visible to anybody
    in the'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 102 Scrum: Novice to Ninja


    company, so the people working on the project don''t have to be interrupted. By
    reserving a very short, clearly defined period of time for the team to update
    each other on a daily basis, scrum avoids the need for each engineer to face the
    possibility of interruptions from people who just want to find out what they''re
    working on.


    Transparency also allows people outside the engineering team to track the status
    of issues that may be particularly important to them. Scrum defines sprints in
    a way that cannot be interrupted by new stories, but clients and other people
    around the organization frequently have changes they want to introduce, and they
    may see these changes as urgent. The transparency of scrum allows them to see
    at a glance exactly what the team is working on, and why those things are prioritized
    by you.


    The transparency supported by scrum isn''t about micromanagement. One of the advantages
    of scrum is to create as much unmanaged time as possible for the individuals on
    the team to manage themselves. Nobody knows better than the engineer working on
    what''s going to be needed to get that story completed. Scrum provides daily standups
    as touchpoints for transparency, so that engineers can share valuable insights
    as they update the team on their status, and work with minimal interruptions.


    Scrum assumes everyone involved in the process has made the conscious choice to
    work on a team in the first place. Working together on a team means everybody
    know what you''re doing, and being willing to share information and resources.
    One of the reasons scrum works so well for web and mobile development in these
    types of projects, working together towards a shared goal is much more productive
    than isolating individuals and trying to coordinate what they produce after the
    fact.


    # Establishing Work Boundaries


    Trust is a large component of scrum, and by extension, a large component of working
    in any type of team environment. We all rely on each other to fulfill our obligations,
    and support the team process.


    Human beings are naturally curious. Any time there''s confusion about other people
    are working on, there''s a tendency to want to ask questions'
