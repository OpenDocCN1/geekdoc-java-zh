  md: '# Stories


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_101_0.png)


    **Stories** are how the product owner communicates to the development team what
    needs to be developed. Stories are incubated in the product backlog, and then
    expressed in a standard format so they can be presented to the team as part of
    the sprint planning meeting to be evaluated, estimated, and then included in a
    sprint backlog.


    # ## The Origin of Using Stories


    The concept of using a story to encapsulate discrete parts of the work comes from
    Extreme Programming (XP)¹, which is a specialized variation of agile that advocates
    a number of excellent development practices such as pair programming and writing
    feature stories. Stories come in handy when doing web and mobile development with
    scrum, where the work on a full slice of functionality generally includes many
    of the same components from the back end to the front end. The team will often
    see stories that all have the same components, and comparing one story to others
    the team has worked on before makes new stories easier to break


