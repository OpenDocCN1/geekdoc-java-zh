- pgno: 76
  md: '# Sprint Planning


    The ritual that marks the beginning of each sprint is called sprint planning.
    Sprint planning is hosted by the scrum master, but the person responsible for
    most of the content that goes into a sprint planning is the product owner.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_76_0.png)


    Figure 4.2. Sprint Planning


    # Objective


    The purpose of the sprint planning is to set the agenda for the upcoming sprint.
    The team gets together with the product owner and the scrum master to get an introduction
    to the stories that should be completed during the next sprint.


    The product owner shows how the stories fits into the vision for the product,
    and the team estimates the stories the product owner has introduced and commits
