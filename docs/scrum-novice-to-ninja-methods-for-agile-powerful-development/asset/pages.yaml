- pgno: 92
  md: 'for the team to reflect and iterate on their process, finding the rhythm that
    works best for them and best meets the objectives of the product owner.


    # Working to a Release Schedule


    Regardless of the actual release schedule, it''s important for everyone on the
    team to understand that what will be released is only what has been completed.
    Scrum isn''t about rushing to finish specific stories in order to meet a predetermined
    timeline. Scrum is about working at a sustainable pace, learning what the team
    is capable of, and releasing what has been completed when it''s ready.


    Any effort to stuff new stories into a particular sprint in order to meet a release
    schedule should be resisted by the team. If the dates cannot be adjusted, the
    product owner should be prepared to compromise, deciding what features need be
    left out of a scheduled release in order to make time for the team to complete
    the most critical features.


    # Sprint Retrospective


    If the daily standup is one of the most iconic rituals of scrum, the sprint retrospective
    may be the most representative of the agile philosophy. Sprint retrospectives
    offer the team the opportunity to reflect on what they''ve been doing at the end
    of every sprint, and figure out how they want to modify their process going forward.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '![](img/b1806dfc7ab8e46f442d54c1e56b9394_93_0.png)


    # # Objective


    Sprint retrospective gathers the team together to consider how the sprint was
    just completed went for everybody. During the ritual, everyone in the room will
    be asked what went went well, what didn''t go well, and what commitment they''re
    willing to make as a group to improve things in the next sprint. The goal is to
    come away with a set of modifications to the process that everybody on the team
    agrees to for the upcoming sprint.


    All the members of the development team, the scrum master, and the product owner
    are expected to participate in a sprint retrospective. The ritual is led by the
    scrum master.


    > > !![icon]()

    > Guests are Rare at Retrospectives


    Rarely guests are invited to attend the sprint retrospective. This is in order
    to encourage people to open up about what might have gone wrong during the sprint,
    and to be candid how they felt and what issues came up for them. This meeting
    can be emotional, and the intimacy of a private team environment provides a more
    supportive context.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Time Box


    Teams may find the amount of time they spend in the retrospective mirrors the
    amount of time they might spend in the sprint demo. For a two-week sprint, it''s
    not unusual for the team to devote half a day to the retrospective. When scheduling
    the retrospective, it''s good to err on the side of generosity with the time,
    to avoid cutting access to valuable insights from team members.


    The amount of time a team dedicates to the sprint retrospective reflects the importance
    they give to paying attention to their own process, and improving as they go.
    Some teams may try to limit the amount of time spent in the retrospective. This
    can come at the expense of communication and improvement. One of the most important
    aspects of scrum is its emphasis on discussion as a means of enhancing the product
    development process.


    # Preparation


    Sprint retrospectives can be highly charged. Everybody involved in the scrum should
    come to the ritual with some thought in mind about what might have happened during
    the sprint that they want to comment on. For some people, this can mean creating
    a long list of issues to raise.


    The scrum master should come to the sprint retrospective with an agenda that makes
    both positive and negative feedback is gathered from all participants. It''s the
    responsibility of the scrum master to see to that everybody has a voice and contributes
    to the process.


    > ### Make Sure the Retrospective Gets Proper Attention


    The sprint retrospective is the one ritual that''s most frequently shortened,
    or even abandoned, by scrum teams. That can be a sign that the process is in trouble.
    Without adequate attention to the retrospective, the team is giving up the opportunity
    to improve their process. Often the people giving less time and attention are
    the people who are benefiting most from the status quo, at the expense of constant
    improvement. Making sure this ritual takes place and is given proper attention
    by everybody on the scrum team is a way of showing care and concern for everybody
    on the team.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# What Went Well?


    The scrum master should ask everybody in the room what they went well during the
    past sprint. This is usually done by going around the room and having everybody
    report about one or more things they thought went well during the previous sprint.
    Unless this sprint was a total disaster, most people should be able to come up
    with something they went well¹.


    Part of the value of getting people to discuss what went well is to bring people
    together and give them an opportunity to recognize and appreciate the good work
    they and their teammates were responsible for.


    # Hold Off on Discussion Until Everyone Has Raised Their Points


    While everybody''s participation should be encouraged before the meeting is over,
    it''s not a good idea to allow people to respond, or discuss the points raised,
    until everyone has a chance to share their list. The scrum master should provide
    an opportunity for more open discussion later, but it''s most important to give
    everyone in the team a chance to speak before this deeper discussion starts.


    # What Didn''t Go Well?


    Next the scrum master should go around the room asking people to report what they
    didn''t think well during the sprint. This is a delicate subject, because people
    may tend to bring up uncomfortable or unpleasant issues.


    As before, everyone should be asked to participate. Bringing honest responses
    from people about subjects they may feel uncomfortable discussing is part of the
    skill of a scrum master. If somebody really doesn''t want to speak, or has something
    to say that they don''t want to bring up in front of the group, they should be
    encouraged to talk about it independently with the scrum master outside of this
    ritual.


    Saying negative things in front of teammates can feel uncomfortable. Part of the
    job of the scrum master is to help people from sprint to sprint in how to frame


    > ¹One the reasons this ritual takes as long as it does is because everybody''s
    participation is essential. Nobody should be left out.'
