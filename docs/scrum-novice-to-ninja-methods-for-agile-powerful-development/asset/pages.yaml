  md: '# A Senior Engineer


    # Initial Concerns


    I came into scrum worried about buzz management. I''ve seen too many companies
    where they threw words around agile without really understanding what they meant.
    Some people treat agile as an excuse to have more meetings. Maybe meetings make
    them more comfortable. That doesn''t work for somebody like, because I have responsibilities
    that can take hours or days of uninterrupted time to get right. I didn''t want
    managers hovering over me, pulling me into lots of meetings, and shifting my focus,
    getting distracted from the thinking that''s involved in my work.


    # What I''ve Learned


    The ideas of scrum are good. The important thing is to carry through on them.
    The time we spend now in meetings that don''t have to do with agile has been greatly
    reduced, and that''s a big relief. When somebody needs to talk with me, I can
    point to exactly what I''m working on, and explain if I''m too busy and why. And
    somebody suddenly comes up with a change they think is urgent, I have a whole
    team around me willing to stand up for the sanctity of sprint, so we don''t have
    to adjust what we''re working on while addressing this new issue.


    At the same time, it''s easy to see who''s working on what, so all the questions
    don''t end up coming to me. Now there are more people on the team getting experience
    with the parts of the code I used to be responsible for 100%. That frees me to
    do some of the long-term thinking, and apply my knowledge to reviewing the work
    of other people who are still learning some of the lessons I''ve had over the
    years.


    # What Still Frustrates Me


    It can be hard to plan and architect a project when you''re not sure what direction
    it''s going to take next. For example, there are aspects of mobile development
    that require longer time frames than a single sprint. Sometimes we have to develop
    in layers, always thinking about what could be considered a complete slice of
    functionality every sprint.'
