    # Product Backlog


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_105_0.png)


    Figure 5.2. Product Backlog


    Stories for the development team emerge from the product owner’s product backlog.
    A product backlog keeps track of all the input product owner has about the direction
    of the product from the client, along with the research, experience testing, design,
    and engineering feedback the product owner has gathered.


    Unlike stories for the sprint backlog, items for the product backlog don''t need
    to be structured in any particular way. That''s their main purpose is to allow
    the product owner to keep track of all of the features that are needed. These
    product items may be quite vague until they crystallize into a clear development
    story for the sprint backlog. Items in the product backlog should always reflect
    the product owner’s latest thinking about the long-term goals for the product,
    while the team is working on the specific features for the current increment.'
