  md: 'perience testing, the more changes you make between tests, the more difficult
    it is to isolate which ones were helpful, and which ones caused problems.


    By the end of this ritual, the scrum master should present the team with a short
    and understandablestand list of changes to the process. Most importantly, the
    scrum master should poll the entire room, and make sure everyone is in agreement
    with this of changes. Then the scrum master should record the team''s commitment
    to the revisions for the upcoming sprint. A team''s ability to reflect and improve
    is important to its development as the commitment to a sprint backlog is to the
    product''s development.


    # Conclusion


    In this chapter, we''ve gone over the four critical rituals for scrum: sprint
    planning, daily standup, sprint demo, and sprint retrospective. Each of these
    rituals is repeated once every sprint, except for the standup, which is performed
    every day.


    These rituals take us from feature stories—written by a product owner—through
    team estimation, commitment to a sprint backlog, working through all of the stories,
    demonstrating that each story was completed and meets all of its acceptance criteria,
    to finally reflecting on what was worked and what didn''t the completed sprint,
    so that the team can constantly improve.


    Next, we''re going to take a look at some of the artifacts of scrum. These tools
    help a scrum team to understand what they''re working on, track their progress,
    and work together effectively.'
