- pgno: 167
  md: '# Making Scrum Work for Your Web or Mobile Team 147


    to get a story with the optimum number of points added to the sprint backlog so
    their commitment exactly matches their expected velocity.


    This unwise exercise is optimizing for the sprint, and it demonstrates a basic
    misunderstanding of the point of scrum. The prioritization of stories, and the
    purpose of working in order, is about adding value to the product, not pushing
    forward an agenda around optimizing the scrum process. When it comes down to it,
    the work is more important, not the number of points completed in a sprint.


    It''s better to leave that backlog a little short, and agree with the team that
    they may start work on the next priority story once all the stories they committed
    to this sprint are done. After the commitment for the sprint backlog is completed,
    it''s perfectly fine for the team to start working on a story of any size that
    has the next highest priority, even if they don''t complete it within the same
    sprint. Ultimately, the team''s point velocity is estimated across multiple sprints,
    and it will average out.


    # Long, Lazy Standups


    The purpose of the daily standup is to capture the heartbeat of the team, for
    the sake of the team. These rituals are kept short in order everybody''s time.
    One of the first mistakes team tend to make is to treat the daily standup as if
    it were a team meeting. This could be played out in many ways, including having
    the team sit for the daily standup, planning announcements at the beginning of
    standup, and not limiting cross-talk during standup.


    Everybody is expected to stand during the ritual, so that nobody feels inclined
    to let the ritual exceed its time. No devices or other distraction should be in
    anybody''s hands, and nobody should be working on their laptop or talking about
    anything other than the story currently being discussed.


    It''s a slippery slope if you start allowing people outside of your team to include
    announcements at the beginning or the end of standup. Announcements tend to encourage
    more discussion, and that can quickly lead to stands that last longer than 15
    minutes.


    There should be only one person speaking at a time during the standup, and that
    person should be the engineer discussing what was done since the previous standup,
    what will be done by the next standup, and whether there are any blockers.'
