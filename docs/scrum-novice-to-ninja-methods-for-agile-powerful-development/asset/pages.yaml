- pgno: 163
  md: '# Making Scrum Work for Your Web or Mobile Team 143


    engineer to play a broader role on the team, but it also opens up new opportunities
    for learning and growth. The stability provided by engineers by commitment to
    a sprint, and the confidence that the requirements they''ve agreed to won''t change
    until the sprint is over, may be strong selling points in an organization where
    interruption and chaos have been a problem.


    Adopting agile isn''t a one-way conversation. The champions of scrum should listen,
    and learn from the concerns of the people who are going to be asked to change
    their approach during this process. For everybody, it is useful to remember that
    scrum is always an experiment that''s just lasting for the length of the next
    sprint, with the opportunity at that point to revisit and change anything that
    doesn''t seem to be working. Sometimes the experimental nature of scrum is one
    of the most compelling arguments for giving it a try.


    # Training


    Although scrum isn''t complicated, and can be described pretty thoroughly in a
    book, it''s invaluable to have the team trained by someone from outside the organization
    who understands agile.


    An objective, third-party trainer can step into an organization and see problems
    in a way that a person inside the organization may not be able to. A good trainer
    will also be able to coach people through some of the more subtle or complex aspects
    of the process, making sure they have a full understanding not of what they''re
    doing, but why they''re doing it.


    Scrum training can take one or two days for the entire team, and may be best done
    off-site, in a neutral place where people won''t be distracted by the day-to-day
    work going on. Don''t tochange your organization by giving them less training
    than they need. It''s too easy to start applying labels of scrum to a process
    that''s anything but agile.


    > Do Not Use Scrum as Simply a New Way to Describe Existing Processes


    It''s a mistake to think of scrum as a new way of talking about an existing process.
    Scrum isn''t just a set of fancy vocabulary words. There are teams that start
    using scrum without proper training, and end following the same broken process
    that hasn''t worked for them in the past, while applying labels such as "sprint"
    or


