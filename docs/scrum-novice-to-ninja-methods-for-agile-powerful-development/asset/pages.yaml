  md: '# Chapter 6


    # The Scrum Contract


    For the first half of this book, we''ve talked about scrum in the abstract. We
    discussed what it is, and how it works. We''ve broken it down into its roles,
    rituals, and artifacts. But scrum isn''t just about the details. Scrum is about
    the people.


    In the next section, we''re going to see scrum in action. We''re going to take
    a look at how web and mobile development teams work with the various features
    of scrum. And we''re going to start with the team we''ve already introduced to.


    # The Beginner''s Mind


    Starting scrum can feel a little uncertain. There are questions about how it''s
    going to affect the way we work and the way we interact. There are questions about
    how scrum itself interacts with the hierarchy of the organization. And as we saw
    in Chapter Two, some people come into scrum with preconceived notions that can
    limit the potential of scrum.


    In later chapters, we''re going to do some troubleshooting around problems that
    can come up for scrum teams. But in this chapter, we''re going to discuss what
    it means to agree to participate actively in the scrum process. Scrum can''t work
    to its full'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Scrum: Novice to Ninja


    potential without real people participating. Scrum relies on everyone to fulfill
    the responsibilities of their roles, and scrum makes those roles as lightweight
    and easy to support as possible.


    I call to this the scrum contract. Unlike the artifacts we''ve discussed before,
    this isn''t a physical contract. It''s a mindset that''s useful for people to
    adopt when approaching something like scrum. It doesn''t require setting aside
    skepticism, but it does call for replacing preconceived notions with open-mindedness.


    The scrum contract revolves around several key concepts:


    +   - Respecting Roles

    - Embracing Transparency

    - Maintaining Boundaries

    - Iterating Hopefully

    - Sharing Definitions


    Some of these concepts are familiar to anybody who has ever tried to work effectively
    on a team. Some of them apply specifically to the way scrum works. All of them
    rely on a willingness to work together toward a shared goal.


    # Respecting Scrum Roles


    As we saw in Chapter 3, scrum defines a number of roles for people to take on.
    These roles serve a purpose in the context of scrum, and everyone needs to understand
    them regardless of how they relate to a person''s position or title in an organization.
    Scrum isn''t about replacing the organizational hierarchy. In fact, scrum tries
    to be as independent of the organizational hierarchy as possible.


    Scrum expects people to be able to distinguish between their job and their role
    in the scrum process. This doesn''t mean that scrum releases you from the obligations
    of your job. What scrum provides is an alternate view onto the work you''re doing.
    When you assume a role in the scrum project, you are agreeing to participate actively
    in a shared process to facilitate the work everybody''s doing.'
