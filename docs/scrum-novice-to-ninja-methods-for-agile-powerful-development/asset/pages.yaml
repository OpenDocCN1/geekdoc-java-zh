- pgno: 57
  md: '# Team Members


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_57_0.png)


    Figure 3.4. The role of the development team


    Most scrum teams consist of a set of four to eight engineers. Their specializations
    should be planned to support the type of work the team is going to be responsible
    for, so they can estimate it well and produce results that meet the team''s definition
    of done.


    A team member is expected to participate actively in all the scrum rituals, and
    operate in a transparent way that allows everyone to be at least peripherally
    aware of what their teammates are working on.


    # Cross-Training


    Specialization is important to the development of an engineer''s career, but on
    a scrum team it''s not assumed that any engineer will have exclusive responsibility
    for any particular aspect of all stories. Part of the power of scrum is the transparency
    it provides, allowing engineers from all backgrounds to learn about what''s involved
    in developing any aspect of the work the team has accepted.


    Scrum encourages engineers to work together. A practice called pair programming,
    adapted from the agile technique known as Extreme Programming, is on practical'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Scrum: Novice to Ninja


    for the type of work done in web and mobile projects. Pair programming advocates
    matching people with different levels of experience to work together on the same
    code, so each can benefit from the perspective of the other.


    The advantage of this approach is that the knowledge about what the product is
    doing, and how to develop every part of it, is shared across the entire team.
    Silos of information that reside only in the head of a single engineer are discouraged,
    in favor of communication with others. Not everyone is expected to be an expert
    in all areas of the product, but everyone should be prepared to work together
    with the experts on areas outside of their usual comfort zones.


    The result is that the work may appear to go a little slower at first, as people
    come up to speed. Soon a deeper shared context will develop, which will speed
    up both estimation and development. The team will also become more resilient in
    the event that someone wins the lottery and decides to retire. Who will be a gaping
    hole of knowledge left behind. There may be large holes to fill, but at least
    there will be people who understand some of what was involved.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_58_0.png)


    # Pair Programming


    Pair programming is very demanding. Some of the expectations are that two people
    share a single monitor, trade responsibility for entering code (driving) and keeping
    track of what needs to happen next (navigating). A pair should be talking with
    each other constantly as they work, and neither member of a pair should allow
    distractions such as email to interfere with the process. Most pairs find they
    can work no more than six hours a day in this mode, but the productivity gains
    and benefits to the stability of the team are worth the tradeoffs.


    # Responsibilities


    As far as the scrum process is concerned, a team member is responsible for the
    quality of the product being developed, and for the preservation of the scrum
    process for the entire team. These are two aspects that every team member has
    the authority to affect by the way they perform their duties.


    The quality of the product is supported by the team''s ability to accept or reject
    stories. If stories are presented that aren''t fully clear, or may be impossible
    or impractical given the history of the project, the team should put the quality
    of their work first and insist that the product owner ewrite or rewrite the stories.


