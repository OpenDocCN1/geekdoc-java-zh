  md: '# Scrum: Novice to Ninja


    down and estimate relatively. For that reason, we''re going to consider stories
    basic artifact of scrum for the type of work we''re talking about.


    A story should capture a complete slice of functionality. Each story should be
    independent, that developers don''t have to complete one story before working
    on another. A story should be a small slice of functionality that can be worked
    on and completed over the course of a sprint.


    Stories help capture the essence of a feature, and give the team the ability to
    discuss the parameters and acceptance criteria in a meaningful and relative manner.
    Estimating working by sizing stories around what the team can accomplish in a
    sprint is a useful exercise.


    Every story should add to the value of the product, and bring it closer to the
    vision of the product owner. Each story should make it clear the product owner
    will test the final product to verify that the story has been completed.


    # Stories Aren''t Technical Specifications


    > Although new product owners with backgrounds in engineering or product management
    sometimes feel inclined to work out all the technical issues and propose static
    solutions with fully flushed specifications for every feature, it''s important
    to keep in mind that stories aren''t technical specifications. They are opportunities
    to open a discussion between product owners and engineers about how to implement
    a feature, and how much effort will be involved. That''s one of the reasons stories
    follow a short and consistent format. It undercuts the temptation to include more
    detailed specifications.


    The responsibility for writing the stories belongs to the product owner. Writing
    stories that capture the full intention and expectations of the client is a skill
    that may take time to develop, but it''s critical to an effective scrum master
    should be able to help the product owner in how to write stories that are the
    right size, express the appropriate acceptance criteria, and open a dialogue rather
    than close one off.


    There''s a simple formula that works for writing stories. People have tried many
    variations over the years. Through iteration and reflection, different teams may
    eventually evolve different approaches that work for them, but this is a good
    place to start:'
