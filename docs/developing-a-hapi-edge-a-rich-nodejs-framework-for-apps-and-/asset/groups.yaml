    \n所以，我们已经涵盖了在 hapi-plugins.com 中使用的所有验证情况，而 `joi` 的功能远比我们目前看到的要多。我们在这里花更多时间查看\
    \ `joi` 还能提供什么。\n\n一个需要记住的属性是 `joi` 是可链的，这意味着你可以为搜索创建快捷方式。\n\n想象一下你正在验证一个特定的字符串，可能是一个电子邮件\
    \ `Joi.string().email()` 或者更复杂的长字符串。例如，你可以将 `email` 赋值给较短的变量：\n\n```\nvar email\
    \ = Joi.string().email() 并在任何地方使用它，而不是使用较长的版本。\n```\n\n作者一直在处理列表：愿望清单、婚礼登记表、婴儿登记表等，并且必须确保每次发送的都是正确的列表类型。以下是该验证逻辑：\n\
    \n```\nJoi.string().insensitive().required().valid(['BR', 'SFL', 'WR', 'WL'])\n\
    ```\n\n"
