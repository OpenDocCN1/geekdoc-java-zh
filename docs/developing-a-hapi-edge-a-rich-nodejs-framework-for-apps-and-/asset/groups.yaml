    Next up, we''ll continue exploring models and how to connect and query a database.


    # Using a database


    In general, developers have complete flexibility when using databases hapi - any
    database, any ORM, or any library can be. hapi does not impose any restrictions
    whatsoever. You can use one database for one project, another for a second project,
    or use ten databases for a third project. hapi tries to make developers happy
    by not getting in the way.


    For the github.com/hapi-edge/hapi-plugins application, we have selected the popular
    MongoDB for our database and we will use the Mongoose driver to connect to our
    database. For information about other database options and why we chose MongoDB,
    please see the Models section of Chapter 13 Appendix.


    # Setting up the database


    Setting MongoDB for an application is fairly well documented on mongodb.org. However,
    for rapid development, it is faster to develop locally or to Compose (aka MongoHQ)
    to generate a free development database instance for.


    Once an instance is set up, a database name has to be created. We have chosen
    the instance name ''hapi-plugins'' and a database name ''hapi-plugins''. If you
    change these names, remember to replace them in the examples below in the connection
    string. If you set authentication using a username and password (like how we have
    up in our production database), remember to add that to the connection string.


    Collections are lists of documents. Mongoose will create these for you as use
    so it is not necessary to create by hand unless you want to impose size and maximum
    document limits.


    # Connecting to the database


    Mongoose provides a high level API for connecting the MongoDB instance. It accepts
    only a mongodb connection string that can contain host, username, password, database,
    and so on. Subsequent calls and queries to the database are automatically queued
    until the con'
