- md: "\n## View Loading\n\nViews are called and loaded from inside handlers as part\
    \ of the reply step. The reply.view function accepts three parameters (the last\
    \ one is optional): the relative path to the desired template file, the context\
    \ to apply to the template, and an options object to override global engine settings.\n\
    \n```\nhandler: function (request, reply) {\n  var context = {\n    content: 'hello\
    \ world'\n  };\n  // assumes file can be found in views.path + '/path/index'\n\
    \  reply.view('path/index', context, {compileMode: 'sync' });\n}\n```\n\nAs a\
    \ reminder, we do not need 'index.html' because we have already defined the extension\
    \ in the engines portion of the server.views function.\n\n## Layouts\n\nLayouts\
    \ enable you to wrap all templates inside another one. This is useful if your\
    \ website has the same general appearance (logo, header, and footer, for example).\
    \ Then, you only need to design the HTML for a general layout and nest the normal\
    \ template inside the {{content}} context variable.\n\n## Configuration\n\nThe\
    \ most important step in enabling layouts is the configuration. Only two additional\
    \ configuration fields are required: layoutPath and layout. The layoutPath tells\
    \ hapi where to look to layout.{ext}, where the extension is defined under the\
    \ engines option.\nConfiguration does not really change between the different\
    \ templating systems.\n\n```\nvar Hapi = require('hapi');\n\nvar server = new\
    \ Hapi.Server();\nserver.views({\n  engines: {\n    html: require('handlebars')\
    \ // .html is the suffix hapi will look for\n  },\n  path: __dirname + '/views',\n\
    \  layoutPath: __dirname + '/views',\n});\n```\n\n```\nlayout: true\n));\n```\n\
    \n## Usage\n\nUsage is actually very simple after a proper configuration. Nothing\
    \ changes on the handler side:\n\n```\nhandler: function (request, reply) {\n\
    \  var ctx = {\n    msg: 'Hello world!'\n  };\n  return reply.view('/path/' +\
    \ templateName, ctx);\n}\n```\n\nThe template will be loaded through the content\
    \ variable in the layout.\n\n## Exclusion\n\nSometimes you want to apply layouts\
    \ to all templates, except for certain ones. This is exceptionally easy to do.\
    \ You just need to include a third optional configuration parameter to reply.view\
    \ that sets layout to false.\n\n```\n// Inside an handler\nreturn reply.view(template_name,\
    \ context, { layout: false });\n```\n\n## Partials\n\nPartials are great. Partial\
    \ templates allow you to factor out shared snippets of templates to use between\
    \ other templates. This prevents you from being forced to modify code in multi-places;\
    \ you can edit once and reflect in all templates.\n\n## Configuration\n\nTo enable\
    \ partials, you need to add only a single view option, partialsPath, which tells\
    \ hapi where to look for partials. When you reference partials, the partials will\
    \ be relative to this path.\n\nConfiguration does not really change between the\
    \ different templating systems. Some engines, however, may require small tweaks\
    \ to work with hapi's partial system. For example, for Hogan.js mustache templates,\
    \ there is a convenient pre-tweaked version at hapihogan.\n\n## CHAPTER 9: Templating\n\
    \n```\nvar Hapi = require('hapi');\n\nvar server = new Hapi.Server(\nserver.views({\n\
    \  engines: {\n    html: require('handlebars') // .html is the suffix hapi\n \
    \   look for\n  },\n  path: __dirname + '/views',\n  partialsPath: __dirname +\
    \ '/views/partials'\n}););\n```\n\n## Helpers\n\nHelpers are extensions to the\
    \ templating language that allow you to create and use custom functions from inside\
    \ the template. This is a feature of Handlebars.js.\n\n## Configuration\n\nTo\
    \ enable helpers, you need to supply only one additional view option helpersPath.\
    \ This tells hapi where to find helpers.\n\n```\nvar Hapi = require('hapi');\n\
    \nvar server = new Hapi.Server();\nserver.views({\n  engines: {\n    html: require('handlebars')\
    \ // .html is the suffix hapi\n    look for\n  },\n  path: __dirname + '/views',\n\
    \  helpersPath: __dirname + '/views/helpers'\n}););\n```\n\n## Helper Files\n\n\
    Helper files should be named with the desired calling. If you want to create a\
    \ helper function such as toMoney, the file should be called toMoney.js and it\
    \ should mod-exports.s single function (which can take arguments).\n\n```\nmodule.exports\
    \ = function (val) {\n  return \"$\" + val.toFixed(2);\n};\n```\n\nThen, inside\
    \ the template, it will be possible to call toMoney with an argument (which could\
    \ be variable).\n\n```\n{{toMoney 25}}\n{{toMoney cost?}}\n```\n\n## Shared Contexts\n\
    \nIt is often desirable to include some data into every context object of every\
    \ view. For example it is easier to maintain an HTML page title in one place and\
    \ attach it to every view, rather than including in every single context.\nThe\
    \ example below ('shared-context.js') will add (or overwrite) the context.title\
    \ value with a new value. If the handler is not called with views, then the .context\
    \ will not be defined and will be affected.\n\n```\nserver.ext('onPreResponse',\
    \ function (request, reply) {\n  var response = request.response;\n  if (!response.isBoom)\
    \ {\n    if (response.source && response.source.context) {\n      response.source.context.title\
    \ = \"Hapi-Plugins\";\n    }\n  }\n  return reply();\n}\n```\n\nThe above example\
    \ is using onPreResponse, which we learned about Chapter 2 Server, the request\
    \ lifecycle cycle. We are using the server.ext to extend this functionality, right\
    \ before the response is given, we are adding this title context.\nAn alternative\
    \ method is to merge a shared object into the view context:\n\n```\n// Inside\
    \ the server.js\nserver.ext('onRequest', function (request, next) {\n  // This\
    \ could be loaded asynchronously from the database\n  request._sharedContext =\
    \ {\n    title: 'Hapi-Plugins'\n  };\n  next();\n}\n```\n\nHere are using the\
    \ onRequest part of the request lifecycle instead. Like the previous example,\
    \ we are extending this part of the request lifecycle by using the server.ext\
    \ function. Below we use a handler to merge the sharedContext before we reply\
    \ with the template.\n\n```\n// Inside the handler\nvar Hoek = require('hoek');\n\
    /* ... */\nhandler: function(request, reply) {\n  var ctx = {\n    content: 'Hello\
    \ world!'\n  };\n  var context = Hoek.applyToDefaults(request._sharedContext,\
    \ ctx);\n  return reply.view('/path/' + templateName, context);\n}\n```\n\nBy\
    \ using a shared context, like above, it is possible to group common values shared\
    \ between templates and views and place them in a single location (rather than\
    \ repeating in every handler). This is helpful if you need to repeatedly pass\
    \ in server-wide settings like feature flags or website information.\n\n## Summary\n\
    \nNow you know how to render HTML to the end user given a data context, you can\
    \ now create complete, functional websites using hapi. Views and templating systems\
    \ can save you a lot of development time and make your life easier by factoring\
    \ out shared text-data, shared partial templates, and entire templates.\n\nUsing\
    \ the knowledge you have learned so far, you can now create fully functional websites.\
    \ But, as you will see in Chapter 10 Testing, just being able to create a website\
    \ is not enough. We will show you how to test your application.\n\n## Testing\
    \ 10\n\nIn the last chapter (Chapter 9 Templating), we discovered how to respond\
    \ to requests to HTML. With that final piece, you can create your own complete,\
    \ fully functional web application. However, that is not enough! To build real,\
    \ production-worthy applications, you will need to test your code.\n\nIn the hapi\
    \ universe, testing is extremely important. Testing is important enough to the\
    \ hapi module maintainers that they developed their own testing library, named\
    \ lab, in order to get testing right. Before a pull request can be merged into\
    \ a core module, it must first have working tests as well as 100% test coverage\
    \ of the code in the module. Therefore, if you plan to contribute back to the\
    \ community, understanding how hapi tests are written and executed is essential.\n\
    \n## Chapter Overview\n\nThe following chapter will cover many basic testing principles\
    \ as well as the topics listed below:\n\n- History of lab\n- Installing lab\n\
    - Writing a simple test\n- Principles of lab\n- Writing a hapi test\n- Code coverage\n\
    - Reporters\n- Linting\n- Plugin testing\n"
  mdcn: "\n\n## 视图加载 (View Loading)\n\n视图是在响应步骤中从处理器内部调用并加载的。`reply.view` 函数接受三个参数（最后一个是可选的）：目标模板文件的相对路径、应用于模板的上下文（context），以及一个用于覆盖全局引擎设置的选项对象。\n\
    \n```\nhandler: function (request, reply) {\n  var context = {\n    content: 'hello\
    \ world'\n  };\n  // 假设可以在 views.path + '/path/index'找到文件\n  reply.view('path/index',\
    \ context, {compileMode: 'sync' });\n}\n```\n\n提醒一下，我们不需要 'index.html'，因为我们已经在\
    \ `server.views` 函数的 `engines` 部分定义了扩展名。\n\n## 布局 (Layouts)\n\n布局允许你将所有模板封装在另一个模板内部。如果你的网站具有相同的通用外观（例如：logo、页眉和页脚），这将非常有用。这样，你只需要为通用布局设计\
    \ HTML，并将普通模板嵌套在 `{{content}}` 上下文变量中。\n\n## 配置 (Configuration)\n\n启用布局最重要的步骤是配置。只需要两个额外的配置字段：`layoutPath`\
    \ 和 `layout`。`layoutPath` 告诉 hapi 去哪里查找 `layout.{ext}`，其中扩展名定义在 `engines` 选项下。\n\
    不同模板系统之间的配置实际上并没有太大区别。\n\n```\nvar Hapi = require('hapi');\n\nvar server = new\
    \ Hapi.Server();\nserver.views({\n  engines: {\n    html: require('handlebars')\
    \ // .html 是 hapi 将查找的后缀\n  },\n  path: __dirname + '/views',\n  layoutPath: __dirname\
    \ + '/views',\n});\n```\n\n```\nlayout: true\n));\n```\n\n## 使用 (Usage)\n\n在正确配置后，使用实际上非常简单。处理器端没有任何任何变化：\n\
    \n```\nhandler: function (request, reply) {\n  var ctx = {\n    msg: 'Hello world!'\n\
    \  };\n  return reply.view('/path/' + templateName, ctx);\n}\n```\n\n模板将通过布局中的\
    \ `content` 变量进行加载。\n\n## 排除 (Exclusion)\n\n有时你想对所有模板应用布局，但某些某些模板除外。这非常简单。你只需要向\
    \ `reply.view` 包含第三个可选的配置参数，将 `layout` 设置为 `false`。\n\n```javascript\n// 在处理器内部\n\
    return reply.view(template_name, context, { layout: false });\n```\n\n## 部分组件\
    \ (Partials)\n\n部分组件非常棒。部分组件模板允许你提取共享的模板片段，并在其他模板之间复用。这防止了你被迫在多处修改代码；你只需编辑一次，就会反映在所有模板中。\n\
    \n## 配置 (Configuration)\n\n要启用部分组件，你只需要添加一个视图选项 `partialsPath`，它告诉 hapi 去哪里查找部分组件。当你引用部分组件时，这些组件将相对于此路径。\n\
    \n不同模板系统之间的配置实际上并没有太大区别。但是，某些引擎可能需要微调以与 hapi 的部分组件系统配合。例如，对于 Hogan.js mustache\
    \ 模板，在 hapihogan 有一个方便的预微调版本。\n\n## 第 9 章：模板化 (CHAPTER 9: Templating)\n\n```\n\
    var Hapi = require('hapi');\n\nvar server = new Hapi.Server(\nserver.views({\n\
    \  engines: {\n    html: require('handlebars') // .html 是 hapi 查找的后缀\n  },\n \
    \ path: __dirname + '/views',\n  partialsPath: __dirname + '/views/partials'\n\
    }););\n```\n\n## 辅助函数 (Helpers)\n\n辅助函数是模板语言的扩展，允许你在模板内部创建并使用自定义函数。这是 Handlebars.js\
    \ 的功能。\n\n## 配置 (Configuration)\n\n要启用辅助函数，你只需要提供一个额外的视图选项 `helpersPath`。这告诉 hapi\
    \ 去哪里寻找辅助函数。\n\n```\nvar Hapi = require('hapi');\n\nvar server = new Hapi.Server();\n\
    server.views({\n  engines: {\n    html: require('handlebars') // .html 是 hapi\
    \ 查找的后缀\n  },\n  path: __dirname + '/views',\n  helpersPath: __dirname + '/views/helpers'\n\
    }););\n```\n\n## 辅助函数文件 (Helper Files)\n\n辅助函数文件应根据所需的调用名称命名。如果你想创建一个如 `toMoney`\
    \ 这样的辅助函数，文件应命名为 `toMoney.js`，并且它应该导出（mod.exports）单个函数（该函数可以接受参数）。\n\n```javascript\n\
    module.exports = function (val) {\n  return \"$\" + val.toFixed(2);\n};\n```\n\
    \n然后，在模板内部，就可以带参数调用 `toMoney`（该参数可以是变量）。\n\n```handlebars\n{{toMoney 25}}\n{{toMoney\
    \ cost?}}\n```\n\n## 共享上下文 (Shared Contexts)\n\n通常希望在每个视图的每个上下文对象中包含某些数据。例如，在一个地方维护\
    \ HTML 页面标题并将其附加到每个视图，比包含在每一个单独的上下文中容易得多。\n下方的示例（'shared-context.js'）将使用新值添加（或覆盖）`context.title`\
    \ 值。如果调用处理器时没有带视图，则 `.context` 将不会被定义并受到影响。\n\n```javascript\nserver.ext('onPreResponse',\
    \ function (request, reply) {\n  var response = request.response;\n  if (!response.isBoom)\
    \ {\n    if (response.source && response.source.context) {\n      response.source.context.title\
    \ = \"Hapi-Plugins\";\n    }\n  }\n  return reply();\n}\n```\n\n上面的示例使用了 `onPreResponse`，这是我们在第\
    \ 2 章服务器请求生命周期中学习过的。我们正在使用 `onPreResponse` 在响应之前合并这个标题。另一种方法是在回复视图之前合并共享对象：\n\n\
    ```javascript\nserver.ext('onRequest', function (request, next) {\n  // 这可以从数据库异步加载\n\
    \  request._sharedContext = {\n    title: 'Hapi-Plugins'\n  };\n  next();\n}\n\
    ```\n\n这里我们使用 `server.ext` 来扩展此功能：\n\n```javascript\n// 在处理器中\nvar Hoek = require('hoek');\n\
    /* ... */\nhandler: function(request, reply) {\n  var ctx = {\n    content: 'Hello\
    \ world!'\n  };\n  var context = Hoek.applyToDefaults(request._sharedContext,\
    \ ctx);\n  return reply.view('/path/' + templateName, context);\n}\n```\n\n通过使用共享上下文（如上所示），可以将视图之间共享的值放在在一个地方（而不是在每个处理器中重复）。这对于需要反复传递全局设置（如功能标志或网站信息）非常有用。\n\
    \n## 总结 (Summary)\n\n现在你已经知道如何在给定数据上下文的情况下向用户渲染 HTML，你现在可以使用 hapi 创建完整的网站。视图和模板系统通过提取共享文本数据、部分模板和整个模板，可以节省大量的开发时间并让你的生活更轻松。\n\
    \n利用你为止学到的知识，你现在可以创建功能完整的网站。但是，正如我们在第 10 章测试中所看到的，仅仅能够创建网站是不够的！为了构建真实的生产应用程序，你需要测试你的代码。\n\
    \n接下来的章节将涵盖许多基本的测试原理以及以下列出的主题：\n\n- lab 的历史\n- 安装 lab\n- 编写一个简单的测试\n- lab 的原理\n\
    - 编写一个 hapi 测试\n- 代码覆盖率\n- 报告器\n- 检查 (Linting)\n- 插件测试\n\n"
