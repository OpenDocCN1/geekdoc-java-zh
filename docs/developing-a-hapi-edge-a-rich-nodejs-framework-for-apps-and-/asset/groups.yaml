    \ read more about how to select and how to manage plugins in Chapter 6. This is\
    \ done using the server.register().\n\n```javascript\nserver.path(internals.files.redirectTo);\n\
    server.on('request-error', function (request, response) {\n  console.log('request-error:');\n\
    \  console.dir(response);\n});\n```\n\nserver.path indicates to have a path prefix\
    \ so that we can use relative paths and templates. We also set up an event for\
