    storing a Person''s data like names, addresses, in MongoDB, these fields can be
    stored in a single document for that individual. This is intuitive with with.


    MongoDB supports a simple but powerful JavaScript-based syntax for queries and
    has a very short learning curve. This makes MongoDB a popular choice for rapidly
    starting projects, for hackathons, and for teams already comfortable with JavaScript.


    There are two downsides to MongoDB. Scalability is not linear and requires setting
    up highly complicated replication systems. Write performance can be a problem
    due to database-wide locking and the default setting can potentially lead to data
    loss when writes are not verified.


    For practical purposes, at the time of writing, the choice of MongoDB ORM/driver
    to use is highly controversial.


    On the one hand, Mongongoose is popular and has a lot of helpful features, however,
    at the time of writing, the Mongongoose GitHub repository has over 400 open issues
