- md: '

    We hope by reading this book, we''ve helped you get started on your first hapi
    project. You can use hapi to make your dreams come true and build all sorts of
    interesting web applications.


    ## Appendix 13


    ## Models


    ### History


    Scalable applications typically follow an n-tiered architecture where the application
    service connects to an orthogonal database (meaning it is not tightly coupled
    with the application service and can be managed independently or even swapped
    out completely).


    Today, there are many databases available for use. There are three main classifications
    for databases:


    - Relational (RDBMS)

    - NoSQL

    - Other


    Relational databases are the workhorse of databases. They''ve worked effectively
    for decades and have proven performance characteristics. However, they do have
    a learning curve and are not always suited for handling sequential data, denormalized
    data, or series-high performance requirements.


    NoSQL databases are relatively new. Typically, these have a very short learning
    curve and high performance characteristics. However, due to trade-offs, they do
    not have all of the features typically associated with Relational databases (like
    transactions, atomicity, data durability, etc.).


    Other databases may include graph structure databases or anything else that does
    not fit the two above classifications.


    ## Overview of HTTP Clients


    ### HISTORY


    When the Internet was still completely Web 1.0, most websites and companies did
    not provide developer-friendly APIs. To grab data from a website required developers
    to scrape the website, process the HTML, and search extract data (sometimes manually).
    Some companies started offering SOAP APIs, which (thankfully) died out.


    Web 2.0 applications became the new normal around 2004, which supported APIs with
    XML and JSON responses. Java strongly coupled adopted XML. With the ubiquity of
    JavaScript being everywhere and amazing open source libraries with AJAX that came
    like jQuery, Dojo, Prototype, JSON basically won. JavaScript & Node.js play great
    with JSON.


    Most APIs today support JSON. Our examples show code for interacting with JSON.


    To fetch data from HTTP APIs, we have a few options. We will cover two of the
    most popular options: Wreck and Request.


    ### WRECK


    Wreck is one of the official hapi modules written by our own Wyatt Preul, a co-author
    of this book.


    It was created in response to the now infamous 4-byte memory leak. One of the
    culprits was an underlying piece of code used by the popular Request module.


    Additionally, Request was designed to accomplish a wide range of cases. Wreck
    takes the minimal approach and provides only the bare minimum feature set to ensure
    high performance and no memory leaks.


    ### REQUEST


    Request is the most well known HTTP request module for Node.js. It was originally
    created by Michael Rogers, a very well-known figure in the Node.js community at
    large, but now the project has grown a life of its own. It gained a huge following
    due to its simple, intuitive interface (it is lightyears better than the previous
    long-winded way of manually creating HTTP sockets).


    ## Overview of database clients


    hapi-plugins.com uses MongoDB through Mongoose driver so primary examples will
    reflect this choice.


    However, for maximum benefit, this book will also showcase separate examples for
    three of the most popular databases used in Node.js projects: MongoDB, Cassandra,
    and Postgres.


    ## MongoDB


    MongoDB is an explosively popular database. It was one of the first databases
    to embrace the NoSQL movement as well the open-source development model. It is
    available for free under the GNU License.


    Unlike MySQL or PostgreSQL, MongoDB is a document-oriented database. Instead of
    storing a Person''s data like names, addresses, in MongoDB, these fields can be
    stored in a single document for that individual. This is intuitive.


    MongoDB supports a simple but powerful JavaScript-based syntax for queries and
    has a very short learning curve. This makes MongoDB a popular choice for rapidly
    starting projects, for hackathons, and for teams already comfortable with JavaScript.


    There are two downsides to MongoDB. Scalability is not linear and requires setting
    up highly complicated replication systems. Write performance can be a problem
    due to database-wide locking and the default setting can potentially lead to data
    loss when writes are not verified.


    For practical purposes, at the time of writing, the choice of MongoDB ORM/driver
    to use is highly controversial.


    On the one hand, Mongoose is popular and has a lot of helpful features, however,
    at the time of writing, the Mongoose GitHub repository has over 400 open issues
    reported and almost 2000 closed issues. With so many bugs, it may not always be
    the best choice.


    The mongodb driver is simple and effective but provides very little high functionality;
    some development work is required.


    ### mongodb


    The mongodb driver, also known as node-mongodb-native, is the most popular library
    for accessing MongoDB database instances. It fairly accurately mimics MongoDB
    syntax with some asynchronous modifications made as necessary. As such, it is
    less an ORM and more of a manual database driver. Therefore, intimate knowledge
    of MongoDB query syntax is required. Fortunately, MongoDB syntax is very simple
    and easy to pick up.


    ### Mongoose


    Mongoose ODM is a high level resource mapper for using MongoDB. Created by LearnBoost
    (part of Automatic), Mongoose provides abstractions from pure MongoDB syntax in
    an attempt to make development using MongoDB driver faster and easier by adding
    support for queued operations, schemas, schema validators, defaults, methods,
    etc.


    ## CASSANDRA


    Cassandra is another popular, open-source NoSQL database. Instead of focusing
    on ease-of-use for developers, like MongoDB, Cassandra focuses on using mathematics
    and science to give developers scalability and high availability (can survive
    multiple machine failures) all while exhibiting extremely high performance. It
    also focuses on linear scalability means scaling up systems is as simple as adding
    machines to the cluster.


    Cassandra is a column-oriented database. Every record in the database can have
    any number of columns. Individual records can have a different number of columns.
    A Person object can have name and another Person has address, phone number. Every
    one of a Person''s columns is retrieved when read. Column databases may not be
    as intuitive as document databases but they have a lot of unexpected benefits
    (like being good with storing graph structures).


    The primary downside with Cassandra is its large learning curve. It is hard to
    get started with Cassandra. However, once things are configured correctly, Cassandra''s
    features are hard to manage.


    ### Apollo


    Apollo, by 3logic, is an upcoming Cassandra ORM. When development on Apollo started
    relatively recently (mid-2014), it is already completely functional and compatible
    with the latest breaking changes to Cassandra''s CQL interface. Technically, the
    authors point out in their README that Apollo is ''incomplete'' and probably not
    production ready. However, Apollo is far better than the alternative ORMs out
    there.


