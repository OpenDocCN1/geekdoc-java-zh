    \  validate: {\n    payload: internals.validationFunction\n  }\n};\n```\n\n##\
    \ Summary\n\nSo far, you have gotten an overview of what data validation is, how\
    \ to use it, and how happi-plugins.com uses it. There is a wide variety of data\
    \ types that joi supports, and we recommend you check out the documentation for\
    \ more details. It should be noted that joi hot have to be used specifically for\
    \ hapi. While validate is conveniently baked into hapi, joi can be used in other\
    \ frameworks. Next, you will see how hapi's architecture can enable one application\
    \ to become more than just the sum of its parts.\n\n## Plugins\n\nNow that we\
    \ understand how to validate inputs and outputs, next we want to talk about how\
    \ to utilize plugins in hapi to better manage our code. Releasing software as\
    \ monolithic pieces of code is no better than writing functions that span thousands\
    \ of lines of code. By writing software as smaller functions that serve a specific\
    \ role, we can test the functions easier, we can debug things easier and it's\
    \ easier to understand the architecture. Plugins follow this model as hapi, but\
    \ they are oriented towards functionality of the main software instead of being\
    \ snippets of code. Plugins allow you to extend current functionality, yet they\
    \ deily allows users to share code that is beneficial to everybody. For example,\
    \ you may have written code specific to Facebook authentication (bell) or a plugin\
    \ to do something simple as displaying the routes on startup (blip).\n\nIn this\
    \ chapter we're going to explore how to write a plugin and how to organize your\
    \ code around it. In addition, we're going to take a look at some of the more\
    \ popular plugins that we use, and the plugins that we used to be part of the\
    \ code project.\n\nA benefit of the plugin model and having replaceable parts\
    \ in hapi is that you're not bound to a particular way of doing things. If there\
