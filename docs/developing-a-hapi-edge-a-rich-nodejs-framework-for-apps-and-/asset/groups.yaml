    # hapi-auth-basic


    The next step up from a hard-coded username and password is basic authentication.
    It''s not much more secure than a username and password passed in the clear, but
    it serves a purpose for some internal applications. Aside from that usefulness
    that may or not exist, it makes for a simple starting point in understanding hapi
    authentication.


    In the early days of Chapter 6, the hapi authentication scheme was baked into
    the module itself. In Chapter 7, hapi has evolved and as authentication grew,
    so the need to split hapi up into plugins. You will need to install the hapi-auth-basic
    plugin in order to get any basic authentication support in hapi.


    For any authentication to support it, you must first have a scheme registered
    with the server. The scheme is the heart of authentication that will take place.
    In the case ofhapi-auth-basic the scheme is registered when the plugin itself
    registered. The only thing to do is to declare an authentication strategy that
    will use the scheme. It will become more obvious later, when bell is discussed,
    but strategies help hapi be an extremely flexible framework because it can support
    multiple strategies.


    Below demonstrates how to register the hapi-auth-basic plugin and set it up a
    strategy:


    ```

    var Hapi = require(''hapi'');

    var Basic = require(''hapi-auth-basic'');


    var server = new Hapi.Server();

    server.connection({ port: 3000 });


    server.register(Basic, function (err) {


    server.auth.strategy(''simple'', ''basic'', { validateFunc: validate });

    });

    ```


    After an authentication strategy is in place, it can be used by individual routes
    that expect authentication. If you expect all routes to have a certain strategy,
    you can pass an option when declaring the strategy for mode and set the mode to
    required.


