    ```\n\n# Summary\n\nIn this chapter, we covered how testing is central to the\
    \ happy ecosystem. Without testing and the tooling built around the happy testing\
    \ framework, lab, it would be far more difficult to ensure that quality code is\
    \ delivered. When you contribute back to any of the happy modules you will need\
    \ to be familiar with how to create tests and cover any new code 100% of what\
    \ you test. Additionally, when writing code for any of the core modules, use lab\
    \ to help ensure that the happy style guide is followed.\n\nThe tests and tooling\
    \ around them happy can always be improved. If you are looking for a good starting\
    \ point to jump into contributing back to the happy ecosystem, please take a look\
    \ at writing tests for modules. Even though the various modules have 100% code\
    \ coverage, further testing can be useful in many cases.\n\nIn the next chapter,\
    \ we will show you some powerful methods used to debug your hapi-systems and identify\
    \ major issues.\n\n# Debugging 11\n\nA debugged program is one for which you have\
    \ not yet found the conditions that make it fail.\n\n-- Jerry Ogdin\n\nIn the\
    \ last chapter, we learned a lot about how to test hapi applications and how to\
    \ write unit tests. In this chapter, we'll discover how to debug our hapi applications\
    \ using some advanced tools.\n\nDebugging in Node.js has always been a source\
    \ of pain for many developers. There is still a lack of great tooling to help\
    \ developers with debugging Node.js across platforms and throughout an applications\
    \ full lifecycle. While tools like DTrace exist, not all Node.js deployments have\
    \ the opportunity to use it. Joyent and other companies have done a great job\
    \ of documenting how to debug a Node.js application. In the hapi world, we have\
    \ created modules to help make debugging a hapi application even easier. This\
    \ chapter will cover specific hapi modules that can help with debugging a hapi\
    \ server in different environments. Additionally, this chapter covers how to setup\
    \ reporting that can help diagnose issues.\n\n# Chapter Overview\n\nThe following\
    \ chapter will cover many details on debugging hapi and Node.js in general. These\
    \ topics are:\n\n- console.log\n- debug mode\n- TV\n- Good\n- REPL\n- Heap Snapshots\n\
    - Core Files\n\n# console.log\n\nWhile many developers may look down console.log\
    \ as a viable debugging option, it serves a purpose and can be quite useful. There\
    \ are many instances where you simply need to know the value of a variable at\
    \ a certain point in a remote deployment. For situations like this, a REPL or\
    \ a remote debugging session is overkill, don't look down on using console.log.\
    \ When it comes to the scripting nature of node.js and how quickly a process can\
    \ be started is simple to ssh into a server and add a log statement. While not\
    \ the most elegant, it can help identify state at different points in your application.\n\
    \n# debug mode\n\nFortunately, in hapi, there is also the concept of a debug mode.\
    \ Instead of manually going in and typing a bunch of console.log statements within\
    \ hapi, you can start a server in debug mode and have console access to different\
    \ server events and error details. This mode can be verbose and is not necessary\
    \ for production, it is recommended that you only enable debug mode for development.\
    \ Below is an example of starting a server in debug mode and logging all errors\
    \ to the console.\n\n```javascript\nvar Hapi = require('hapi');\n\nvar options\
    \ = {\n  debug: {\n    log: ['error']\n  }\n};\n\nvar server = new Hapi.Server(options);\n\
    server.connection({ port: 8000 });\n\nserver.route({ method: 'GET', path: '/',\
    \ handler: function (request, reply) {\n\n  throw new Error('Tribbles');\n});\n\
    \nserver.start(function () {\n  console.log('server started');\n});\n```\n\nDebug:\
    \ internal, implementation, error\nError: Uncaught error: Tribbles\n\nAs you can\
    \ see in the previous example, when an error occurs, the error and the stack trace\
    \ is logged to the console with `Debug:` prefixing the message.\n\n# TV\n\nAnother\
    \ useful option for debugging hapi servers, in development, is with the use of\
    \ the tv module. Tv was designed primarily for front-end consumers of a hapi application.\
    \ The goal is to provide an easy to dashboard displays information about server\
    \ request activity. This is especially useful for a front-end developer to be\
    \ able to track the lifecycle of a request that their code makes to a hapi server.\
    \ A screenshot of tv is shown here:\n\n![](img/79450811086e2fc8749ec4d309ea2b79_142_0.png)\n\
    \nIn order to add tv to a server, you register it like any other hapi plugin.\
    \ Below shows how to register it with the default settings. After tv is registered\
    \ on a server you can access it at your server URL `/debug/console`.\n\n```javascript\n\
