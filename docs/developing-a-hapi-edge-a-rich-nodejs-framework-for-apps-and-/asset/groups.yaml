    \n## hapi 插件生态系统：一些常用插件\n\n让我们看看 hapi 生态系统中的一些流行插件。你可以在 `hapi-plugins.com` 上找到更多插件（当然了），但我们冒昧展示了其中一些主要的插件。\n\
    \n### hapi-auth-basic\n\n此插件为登录应用程序提供基本身份验证，或者只是通用的基本身份验证。大多数基于 Web 的系统都需要某种形式的身份验证来访问数据。许多框架作为框架的一部分包含了它，但通过这种模块化的方法，任何身份验证形式都是可能的。\n\
    \n关于 `hapi-auth-basic` 的更多信息请见第 7 章。\n\n### blipp\n\n虽然 `blipp` 不是核心插件，但它仍然非常有用。它只是在\
    \ hapi 服务器启动时显示路由和服务器:端口的组合。它能快速指示哪些路由是可用的，以及它们是否在正确的服务器连接上。\n\n### bell\n\n`bell`\
    \ 与 `hapi-auth-basic` 非常相似，但它使用了第三方登录，如 Facebook、GitHub、Instagram、Twitter、Yahoo、Foursquare、VK、ArcGIS\
