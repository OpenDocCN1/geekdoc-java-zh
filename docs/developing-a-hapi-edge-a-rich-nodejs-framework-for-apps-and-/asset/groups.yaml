    ```\n\n我们将看到值是一个数组：\n\n```json\n{ hello: ['hi', 'hey'] }\n```\n\n## payload (有效负载)\n\
    \n`request.payload` 包含了作为请求的一部分传输的但不适用于查询的信息。这可能是一个文件，或者是一个 JSON 或 XML 块。虽然对于所有请求方法（GET,\
    \ POST, DELETE, PUT, PATCH 等）发送 payload 是可能的，但通常不用于 GET。如果你确实为 GET 发送了 payload，可能应该重新考虑你的设计。\n\
    \n让我们从一个简单的处理器示例开始，其中我们将利用 POST 方法创建一个新用户。\n\n```javascript\nhandler: function\
    \ (request, reply) {\n  console.log('name: ' + request.payload.name);\n  console.log('email:\
    \ ' + request.payload.email);\n  return reply('success');\n}\n```\n\n如果你还记得我们之前讨论过\
    \ `params` 和 GET 方法，我们想要将此与 `payload` 进行对比。对于上面的处理器，我们按照如下设置了路由。\n\n```javascript\n\
    server.route({\n  method: 'POST',\n  path: '/user',\n  config: {\n    handler:\
    \ handler\n  }\n});\n```\n\n在这里你可以看到方法是 POST。在之前定义的处理器中，你可以引用你的负载请求 `request.payload`。在这种情况下，负载有两个键：name\
    \ 和 email。我们向用户路径发送一个 POST 请求。一旦此服务器启动，在 curl 中可以执行如下操作：\n\n```bash\ncurl -XPOST\
    \ -H \"Content-Type: application/json\" -d '{ \"name\": \"Author Name\", \"email\"\
    : \"author@hapi-plugins.com\" }' https://hapi-plugins.com/user\n```\n\n我们也可以使用\
    \ PUT，它的工作方式是相同的。\n\n## headers (请求头)\n\n`request.headers` 是存储所有请求头的地方。使用我们之前的\
    \ curl，我们会发现在你的处理器中可以引用 `request.headers.Content-Type`，该值将是 `application/json`。\n\
    \n## The reply (响应)\n\n处理器中的 `reply` 函数充当回调以及并将控制权返回给框架的方式。`reply` 函数负责回复请求，以提供所请求的任何结果。\n\
    \n`reply` 接收两个参数以符合常规回调约定，即两个参数都是 `err`（错误）和 `result`（结果）。在实践中，只有两个中的一个会被使用。如果第一个参数是错误对象，它将被封装在\
    \ Boom 对象中。`reply` 的参数类型可以是许多不同的类型：\n\n- null\n- undefined\n- string\n- number\n\
    - boolean\n- Buffer 对象\n- Error 对象\n- Stream 对象（Stream 对象必须与 \"streams2\" API\
    \ 兼容且不能为 objectMode）\n- Promise 对象（hapi 的测试使用 bluebird 库）\n- 任何其他对象或数组\n\n"
