    \  Routes\n]);\n```\n\n上面的代码针对我们的整个服务器实例。实际的 blipp 插件将有一个如下所示 `register` 函数：\n\
    \n```javascript\nexports.register = function (server, options, next) {\n  if (options.color\
    \ === true) {\n    // 执行颜色\n  } else {\n    // 关闭颜色\n  }\n};\n```\n\n在我们的服务器启动中，我们将\
    \ `options` 设置为 `{ colors: false }`。我们将这些选项传递给插件，插件知道关闭颜色。我们在第 2 章中看到过传递 `options`。如果你查看\
    \ rejoice 和 glue 部分，你将看到插件选项是如何传递给插件的。一个例子是 good 插件区域中的 `opsInterval`。\n\n"
