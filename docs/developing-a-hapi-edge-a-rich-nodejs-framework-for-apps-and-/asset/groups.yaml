    # Templating 9


    In the last chapter (Chapter 8 Models), we saw how easy it was to obtain and store
    data. Now, we will see how to present the data back to the user.


    hapi is primarily intended for building RESTful JSON APIs. However, working in
    it is often essential or helpful to respond to HTTP requests with HTML to be rendered
    by a browser. Since the output responses depend on the input, or on which user
    requests the data, it is not always possible or ideal to hardcode the same response
    for every response. The best method to customize responses is with templating.
    In hapi, templates are referred to as views.


    hapi supports most templating engines out of the box. This chapter will include
    working examples for six of the most popular engines: Handlebars.js, Mustache.js,
    Jade, Dust, eco and ECT. For an overview of them, please see the Appendix at the
    end of the book.


    In a typical web application, the user visits a URL, the URL maps to a handler
    in a web server, the handler does some business logic to prepare data, and finally,
    the web server responds with data to the end-user in HTML format.


    There are many different ways to respond with HTML. The two primary methods are
    concatenation and modern templating systems.


    In the old days of web development, HTML was generated by concatenating orating
    HTML strings with variables, like this:


    ```

    var html = ''<html><title>'' +

    page_title +\n''</title></head></body>'' +

    content +

    </body></html>'';

    return reply(html);

    ```


    Thankfully, this tedious and inflexible method has gone out of style and has been
    replaced by modern templating systems. However, this concatenation method is still
    possible, some teams may use it for the sake of efficiency in the case of one-line
    responses.


    Meanwhile, with respect to modern web applications, a templating system merges
    a template responsible for output formatting data into a consistent format - like
    HTML. For example, a Handlebars (or Mustache) template like this:'
- md: "\n```html\n<html>\n<head>\n  <title>{page_title}</title>\n</head>\n<body>\n\
    \  {content}\n</body>\n</html>\n```\n\ncombined with context data like this:\n\
    \n```javascript\nvar context = {\n  page_title: 'Templating is fun!',\n  content:\
    \ '<h1>Hello world!</h1>'\n}\nreturn reply.view('index', context);\n```\n\nwill\
    \ return HTML output like this:\n\n```html\n<html\n<head>\n  <title>Templating\
    \ is fun!</title>\n</head>\n<body>\n  <h1>Hello world!</h1>\n</body>\n</html>\n\
    ```\n\nUsing a template, data can quickly be added, moved around, or removed entirely.\
    \ The work can be split up - designers work on templates while developers supply\
    \ contexts. Templates can easily be swapped out as part of a redesign or conditionally\
    \ (show user X design if their settings specify a preference; otherwise, V).\n\
    So, a template is less tedious and far more flexible to use than the alternative.\n\
    \n# Configuration\n\nIn hapi, views must be configured before they can be used.\
    \ Views must know what engine(s) to run and where to find files - those are required.\
    \ The other options are not required.\n\n# Options\n\nWhen configuring views,\
    \ there are three main options to configure: engines, compileMode, paths. In the\
    \ next section, we'll discover the various sub-options you may need to make your\
    \ views work properly.\n\n# ENGINES\n\nThe engines configuration object tells\
    \ views what file extensions to look for and what templating engine should be\
    \ used.\n\nThe engines object expects file extensions (without the dot '.') as\
    \ keys and templating system compilers as values. The below example (\"engines-breakdown.js\"\
    ) would match any filename.extension and use the some_compiler engine.\n\n```javascript\n\
    engines: {\n  \"extension\": require('some_compiler')\n},\n/* ... */\n```\n\n\
    Using this system, it is possible to mix and match multiple templating systems\
    \ as long as all use different file extensions:\n\n```javascript\nvar Hapi = require('hapi');\n\
    \nvar server = new Hapi.Server(\nserver.views({\n  engines: {\n    html: require('mu'),\n\
    \    jade: require('jade'),\n    hbs: require('handlebars')\n  },\n  defaultExtension:\
    \ 'hbs',\n  path: __dirname + '/views'\n});});\n```\n\nIf you mix and match engines\
    \ for whatever reason, you should be aware of a couple of things. If you want\
    \ to use the reply.view('templateName', context) syntax, it is important to understand\
    \ what the default extension is. In the above example, you can see how we pick\
    \ hbs as that default extension. This setting isn't required. You can just add\
    \ the extension like reply.view('templateName', context). If the file has an extension\
    \ that isn't your defaultExtension then you need to give it that extension.\n\n\
    # CHAPTER 9: Templating\n\n# COMPILEMODE OPTION\n\nThe compileMode option is used\
    \ to tell hapi whether to expect a synchronous templating or an asynchronous one.\
    \ hapi expects the engine object to contain a compile method that can be either\
    \ format, but not both. By default, hapi expects synchronous engines. Here is\
    \ a synchronous compile function.\n\n```javascript\n{\n  compile: function(template,\
    \ options) {\n    return function(context, optionsOverride) {\n      // return\
    \ string template integrated with context\n    }\n  }\n}\n```\n\nNext we are doing\
    \ the same asynchronously.\n\n```javascript\n{\n  compile: function(template,\
    \ options, callback) {\n    var error = null;\n    return callback(error, function(context,\
    \ optionsOverride, internalCallback) {\n      var output = ''; /* set with string\
    \ template integrated with context */\n      return internalCallback(null, output);\n\
    \    });\n  }\n}\n```\n\nDepending on the templating engine, you will see later\
    \ on that the default compileMode may need to be overridden to 'async'.\n\n# PATHS\n\
    \nhapi views to know where to look for template files. There are multiple path\
    \ configurations depending on your project's needs.\n\n- path: points to the main\
    \ directory to look for template files\n- partialsPath: points to the directory\
    \ where to look for partials (if the engine supports Partials)\n- helpersPath\
    \ points to directory where template helper functions are defined (if the engine\
    \ supports Helpers)\n- layoutPath: the directory that contains the layout template\
    \ (usually layout.{extension}) or layout.html\n- relativeTo: path used as a prefix\
    \ to other directories (enables relative paths in the other paths)\n\nAdditionally,\
    \ there are two potentially important path-related settings:\n\n- allowAbsolutePaths:\
    \ (boolean) that enables the use of absolute paths in path settings (default:\
    \ false)\n- allowInsecureAccess: (boolean) that enables support for moving up\
    \ directories (using '../')\n\nThe allowInsecureAccess variable should be used\
    \ with extreme caution. can potentially enable users to access otherwise secure\
    \ files on the server's operating system such as password files, files with sensitive\
    \ data, and more.\n\n# GLOBAL SPECIFIC\n\nAll of the global view settings can\
    \ be applied to a specific individual templating engine that will override any\
    \ global settings. This requires moving the compiler object (typically, the result\
    \ of the call) to the module to leave room for additional options. In the below\
    \ example \"specific-view-settings.js\", the default compileMode changed to 'async'\
    \ or 'html' files will be executed or rendered using handlers in synchronous compile\
    \ mode.\n\n```javascript\nengines: {\n  compileMode: 'async',\n  engines: {\n\
    \    html: {\n      module: require('handlebars'),\n      compileMode: 'sync'\n\
    \    }\n  }\n  path: '/path'\n}\n```\n\n# MORE OPTIONS\n\nMore options are detailed\
    \ in the API documentation.\n\n# STARTER EXAMPLES\n\nFirst let's start out with\
    \ Mustache.js.\n\n```javascript\nvar Hapi = require('hapi');\n```\n\n# CHAPTER\
    \ 9: Templating\n\n```javascript\nvar server = new Hapi.Server();\nserver.views({\n\
    \  engines: {\n    html: require('mu')\n  },\n  path: __dirname + '/views'\n});\n\
    ```\n\nThis is pretty simple. It's going to look in the views directory for 'html'\
    \ files. When you call the request.view('templateName', { context }) type function\
    \ previously, it will compile and serve this up to the client. Next let's look\
    \ at Handle-bars.js.\n\n```javascript\nvar Hapi = require('hapi');\n\nvar server\
    \ = new Hapi.Server();\nserver.views({\n  engines: {\n    html: require('handlebars')\n\
    \  },\n  path: __dirname + '/views'\n});\n```\n\nYou can see this example is essentially\
    \ the same. This should make sense since Handle-bars.js is largely compatible\
    \ with Mustache. Next is up to\n\n```javascript\nvar Hapi = require('hapi');\n\
    \nvar server = new Hapi.Server();\nserver.views({\n  engines: {\n    jade: require('jade')\n\
    \  },\n  path: __dirname + '/views',\n  compileOptions: {\n    pretty: true\n\
    \  }\n});\n```\n\nWe need to add an additional setting called compileOptions here\
    \ and set pretty to true,hapi tries to handle these views in a generic way, and\
    \ depending on the templating-engine, we can see these differences. Next up, next:\n\
    \n```javascript\nvar Hapi = require('hapi');\n\nvar server = new Hapi.Server();\n\
    server.views({\n  engines: \n```\n\n```javascript\n// requires 'dustjs-linkedin'\
    \ to be npm installed\nhtml: require('hapi-dust')\n\n},\npath: __dirname + '/views'\n\
    ));\n```\n\nThis is pretty straight forward. There is only an additional note\
    \ here that you need to have dustjs-linkedin installed and in your package. json\
    \ file as a requirement.\nThe most complex example, ECT.\n\n```javascript\nvar\
    \ Hapi = require('hapi');\nvar ECT = require('ect');\nvar ECTRenderer = ECT({\n\
    \  watch: true,\n  root: __dirname + '/views'\n});\n```\n\n```javascript\nvar\
    \ server = new Hapi.Server(\n  server.views({\n  ect: {\n    compile: function\
    \ (tmpl, opts) {\n      return function (context, engineOptions) {\n        return\
    \ ECTRenderer.render(opts.filename,\n          context);\n      }\n    }compileMode:\
    \ 'sync'\n  },\n  basePath: __dirname,\n  path: './views'\n});\n```\n\nYou will\
    \ see a bit is more required. We need to help hapi along with how the-compiling\
    \ is done by providing a compile function. Additionally, you need to tell hapi\
    \ sync in the compileMode that was discussed previously in this chapter.\nBy showing\
    \ a variety of templating engines, you can show more clearly how hapi handles\
    \ the differing solutions. You can find additional templating solutions under\
    \ the Plugins sec-tion of the hapisjs website under Templating. If you don't find\
    \ what you need, open up d discussion or considering helping the community to\
    \ get this templating engine added.\n"
  mdcn: "\n\n```html\n<<html>\n<head>\n  <title>{page_title}</title>\n</head>\n<body>\n\
    \  {content}\n</body>\n</html>\n```\n\n与如下类似的上下文数据结合使用：\n\n```javascript\nvar\
    \ context = {\n  page_title: 'Templating is fun!',\n  content: '<h1>Hello world!</h1>'\n\
    }\nreturn reply.view('index', context);\n```\n\n将返回如下的 HTML 输出：\n\n```html\n<html\n\
    <head>\n  <title>Templating is fun!</title>\n</head>\n<body>\n  <h1>Hello world!</h1>\n\
    </body>\n</html>\n```\n\n使用模板，可以快速添加、移动或完全删除数据。这些工作可以分工进行——设计人员负责模板，而开发人员提供上下文数据。在重新设计时，可以轻松更换模板，或者根据条件显示（如果用户的设置指定了偏好，则显示用户\
    \ X 的设计；否则显示 V）。\n因此，与替代方案相比，模板的使用既不那么枯燥也灵活得多。\n\n# 配置\n\n在 hapi 中，视图在使用之前必须进行配置。视图必须知道要运行哪些引擎以及在何处找到文件——这些是必要的。其他选项不是必须的。\n\
    \n# 选项\n\n在配置视图时，有三个主要的选项可以配置：engines（引擎）、compileMode 和 paths（路径）。在下一节中，我们将发现可能需要的让视图正常工作的各种子选项。\n\
    \n# ENGINES\n\n`engines` 配置对象告诉视图要查找哪些文件扩展名以及应该使用哪种模板引擎。\n\n`engines` 对象期望文件扩展名（不带点\
    \ `.`）作为键，并将模板系统编译器作为值。下面的示例（\"engines-breakdown.js\"）将匹配任何 `filename.extension`\
    \ 并使用 `some_compiler` 引擎。\n\n```javascript\nengines: {\n  \"extension\": require('some_compiler')\n\
    },\n/* ... */\n```\n\n使用此系统，可以混合使用多个模板系统，只要它们都使用不同的文件扩展名：\n\n```javascript\nvar\
    \ Hapi = require('hapi');\n\nvar server = new Hapi.Server(\nserver.views({\n \
    \ engines: {\n    html: require('mu'),\n    jade: require('jade'),\n    hbs: require('handlebars')\n\
    \  },\n  defaultExtension: 'hbs',\n  path: __dirname + '/views'\n});});\n```\n\
    \n如果你出于某种原因混合使用引擎，你应该注意以下几点。如果你想使用 `reply.view('templateName', context)` 语法，那么理解默认扩展名是非常重要的。在上面的示例中，你可以看到我们如何选择\
    \ `hbs` 作为该默认扩展名。此设置不是必须的。你可以直接添加扩展名，如 `reply.view('templateName', context)`。如果文件的扩展名不是你的\
    \ `defaultExtension`，那么你需要为它指定该扩展名。\n\n# 第 9 章：模板化\n\n# COMPILEMODE 选项\n\n`compileMode`\
    \ 选项用于告诉 hapi 期望同步模板化还是异步模板化。hapi 期望引擎对象包含一个 `compile` 方法，该方法可以是其中一种格式，但不能两者兼有。默认情况下，hapi\
    \ 期望同步引擎。这里有一个同步编译函数。\n\n```javascript\n{\n  compile: function(template, options)\
    \ {\n    return function(context, optionsOverride) {\n      // 返回与上下文集成的字符串模板\n\
    \    }\n  }\n}\n```\n\n接下来我们以异步方式执行相同的操作。\n\n```javascript\n{\n  compile: function(template,\
    \ options, callback) {\n    var error = null;\n    return callback(error, function(context,\
    \ optionsOverride, internalCallback) {\n      var output = ''; /* 设置与上下文集成的字符串模板\
    \ */\n      return internalCallback(null, output);\n    });\n  }\n}\n```\n\n根据模板引擎的不同，你稍后会看到默认的\
    \ `compileMode` 可能需要覆盖为 `'async'`。\n\n# PATHS\n\nhapi 视图需要知道去哪里查找模板文件。根据你的项目需求，有多种路径配置。\n\
    \n- path：指向查找模板文件的主目录\n- partialsPath：指向查找部分模板（Partials）的目录（如果引擎支持 Partials）\n\
    - helpersPath：指向定义模板辅助函数的目录（如果引擎支持 Helpers）\n- layoutPath：包含布局模板（通常为 `layout.{extension}`）或\
    \ `layout.html` 的目录\n- relativeTo：用作其他目录前缀的路径（允许在其他路径中使用相对路径）\n\n此外， 还有两个潜在重要的与路径相关的设置：\n\
    \n- allowAbsolutePaths:（布尔值）允许在 path 设置中使用绝对路径（默认：false）\n- allowInsecureAccess:（布尔值）允许向上移动目录（使用\
    \ `../`）\n\n`allowInsecureAccess` 变量应极谨慎使用。它可能会允许用户访问服务器操作系统上原本安全的文件，例如密码文件、敏感数据文件等。\n\
    \n# GLOBAL SPECIFIC\n\n所有的全局视图设置都可以应用于特定的模板引擎，这将覆盖任何全局设置。这需要将编译器对象（通常是调用结果）移动到模块，以便为附加选项留空间。在下面的示例\
    \ \"specific-view-settings.js\" 中，默认的 `compileMode` 更改为 `'async'`，html 文件将使用同步编译模式下的处理器执行或渲染。\n\
    \n```javascript\nengines: {\n  compileMode: 'async',\n  engines: {\n    html:\
    \ {\n      module: require('handlebars'),\n      compileMode: 'sync'\n    }\n\
    \  }\n  path: '/path'\n}\n\n# MORE OPTIONS\n\n更多选项在 API 文档中有详细介绍。\n\n# STARTER\
    \ EXAMPLES\n\n首先我们从 Mustache 开始。\n\n```javascript\nvar Hapi = require('hapi');\n\
    ```\n\n# 第 9 章：模板化\n\n```javascript\nvar server = new Hapi.Server();\nserver.views({\n\
    \  engines: {\n    html: require('mu')\n  },\n  path: __dirname + '/views'\n});\n\
    ```\n\n这非常简单。需要注意的是，当你调用 `request.view('templateName', { context })` 时，它将去视图目录查找\
    \ html 文件。\n\n```javascript\nvar Hapi = require('hapi');\nvar server = new Hapi.Server();\n\
    server.views({\n  engines: {\n    hbs: require('handlebars')\n  },\n  path: __dirname\
    \ + '/views'\n});\n```\n\n你会看到这个示例基本上是一样的。由于 Handlebars.js 与 Mustache 高度兼容。接下来\n\
    \n```javascript\nvar Hapi = require('hapi');\n\nvar server = new Hapi.Server();\n\
    server.views({\n  engines: {\n    jade: require('jade')\n  },\n  path: __dirname\
    \ + '/views',\n  compileOptions: {\n    pretty: true\n  }\n});\n```\n\n我们需要在这里添加一个名为\
    \ `compileOptions` 的附加设置并将 `pretty` 设置为 `true`，hapi 尝试以通用方式处理这些视图，取决于模板引擎的不同，我们可以看到这些差异。接下来\n\
    \n```javascript\nvar Hapi = require('hapi');\n\nvar server = new Hapi.Server();\n\
    server.views({\n  engines: \n```\n\n```javascript\n// 需要 npm 安装 dust-linkedin\n\
    html: require('hapi-dust')\n\n},\npath: __dirname + '/views'\n));\n```\n\n这非常直观。这里唯一的额外说明是需要安装\
    \ dust-linkedin 并将其作为你的 package.json 文件中的依赖项。\n最复杂的示例，ECT。\n\n```javascript\n\
    var Hapi = require('hapi');\nvar ECT = require('ect');\nvar ECTRenderer = ECT({\n\
    \  watch: true,\n  root: __dirname + '/views'\n});\n```\n\n```javascript\nvar\
    \ server = new Hapi.Server(\n  server.views({\n  ect: {\n    compile: function\
    \ (tmpl, opts) {\n      return function (context, engineOptions) {\n        return\
    \ ECTRenderer.render(opts.filename,\n          context);\n      }\n    }compileMode:\
    \ 'sync'\n  },\n  basePath: __dirname,\n  path: './views'\n});\n```\n\n你会发现需要更多工作。我们需要通过提供一个编译函数来帮助\
    \ hapi 了解编译是如何进行的。此外，你需要在本章之前讨论过的 `compileMode` 告诉 hapi 是同步的。\n通过展示多种模板引擎，你可以更清楚地展示\
    \ hapi 如何处理不同的解决方案。你可以在 hapisjs 网站的插件部分下的 `Templating` 找到额外的模板解决方案。如果你没有找到需要的，可以开启讨论或考虑帮助社区添加此模板引擎。\n\
    \n"
