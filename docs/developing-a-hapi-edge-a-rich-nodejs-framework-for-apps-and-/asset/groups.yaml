    \ -> ../bin/pdx\n```\n\n在上述工具中，`pmap` 和 `pfiles` 特别有用，`pmap` 显示内核文件的内存映射，包括堆（heap）占用了多少空间。`pfiles`\
    \ 能够报告由内核文件创建的文件描述符，这有助于发现文件未被正确关闭或处于打开状态的情况。有时 `ulimit` 设置得不够高，`pflags` 能够报告启动进程的原始命令。\n\
    \n# 总结\n\n在本章中，我们查看了用于调试进程的不同工具。这些包括为了帮助识别内核问题而生成的特殊工具。对于生产问题，使用内核文件或 REPL 很有帮助。对于在\
    \ halt 中发现的任何问题，请确保在 halt repo 中修复。\n\n# 安全 12\n\n在第 11 章中，我们学习了调试应用程序的各种方法。现在我们的应用程序运行符合预期，我们需要确保它免受黑者的恶意攻击。安全是\
    \ Web 开发中至关重要的一部分。但对于新开发者来说，它通常是复杂的，且经常包含在入门教程或文档中。大型网站默认并不免疫，会成为黑者的目标。事实上，有些公司通过\
    \ XSS 遭受了损害。通过尽早基础工作，你可以防止最常见的攻击向量并让自己安心。\n\n本章暴露了一些常见问题、漏洞以及它们的解决方案。\n\n# 最佳实践\n\
    \n在使用 hapi 时，学习安全最佳实践。\n\n# 密码哈希：BCrypt\n\n在数据库中存储密码时，使用明文存储是非常糟糕的做法。如果黑客访问了数据库，他们可以直接使用这些凭据查看或操纵敏感数据。使用单向哈希算法安全地存储密码更好。然而，有许多单向哈希算法可用，某些比其他的好得多。在他关于密码方案的著名博文中，Ptacek\
    \ 提到，即使是最复杂的 MD5、DES、SHA1 和 SHA256 哈希也会瞬间被破解（游戏结束了）。\n\n# 解决方案\n\nBCrypt 专门为哈希密码等敏感字符串而设计。Node.js\
    \ BCrypt 实现自 2010 年以来一直存在，经历了多年的安全和代码审查（包括我们自己的）。Node-bcrypt 提供了一种相对安全的方法希你的密码：\n\
    \n```\nvar bcrypt = require('bcrypt');\n\n// 通过 2^rounds 次迭代来生成盐\n// 较大的数字需要显著的时间来计算\n\
    var rounds = 12;\n\nvar salt = bcrypt.genSalt(rounds);\nvar hash = bcrypt.hashSync(\"\
    password\", salt);\n```\n\n# XSS\n\n跨站脚本（XSS）是最常见的漏洞之一，攻击者能够插入由受害者执行的脚本或链接。由于网络的工作方式，同一网络上的任何人都可以查看所有数据流量，看到密码、URL、消息等。为网站增加安全性的最简单方法之一是强制用户使用\
    \ SSL/HTTPS。这需要购买并安装证书，但它会加密浏览器和服务器之间的所有流量。\n\n# 解决方案\n\n使用 hapi 的 crumb 模块。\n\
    \n```javascript\n// 服务器\nvar crumbOptions = {\n  restful: false, // 启用负载验证\n \
    \ crumb: true, // 使用 X-CSRF-Token 头部\n  addToViewContext: true, // 自动添加到视图上下文\n\
    \  isSecure: false // 如果未使用 HTTPS 则需要\n};\nserver.register({ register: require('crumb'),\
    \ options: crumbOptions }, function (err) {\n  if (err) {\n    throw err;\n  }\n\
    });\n```\n\n```javascript\n// 视图\n<form action=\"submit\" method=\"POST\">\n \
    \ <input name=\"crumb\" type=\"hidden\" value=\"{{crumb}}\"/>\n  <!-- ... -->\n\
    </form>\n```\n\n```javascript\n// /submit 处理器\nhandler: function (request, reply)\
    \ {\n  return reply('ok'); // 不需要进行任何特殊处理\n}\n```\n\n# CSRF\n\n跨站请求伪造（CSRF）是另一种常见漏洞，攻击者能够在另一个不同但熟悉的网站上插入表单。如果受害者拥有未使用的\
    \ cookie，该表单可能看起来就像受害者本意操作的一样。\n\n# 解决方案\n\n银行网站应该在表单加载时生成一个在提交时必选的自定义标识符。没有这个密钥，任何提交的负载都将被拒绝。\n\
    \n# SSL\n\n如今许多网站运行在裸 HTTP 上，而不是更安全的 HTTPS 上。这在网络上以明文形式执行浏览器到服务器之间的所有数据传输。由于网络的工作方式，同一网络上的任何人都可以查看所有数据流量并看到一切。\n\
    \n为网站增加安全性的最简单方法之一是强制用户使用 SSL/HTTPS。这需要购买并安装证书，但它会加密浏览器和服务器之间的所有流量。\n\n配置 Node.js\
    \ 服务的 SSL 有许多方法。最常见的方法是使用如 Apache 或 nginx/stunnel 等反向代理来处理 SSL 证书，终止加密，然后通过未加密的\
    \ HTTP 将流量转发到你的 Node.js 服务。这对于运行良好的 HTTP hapi 应用程序不需要任何更改。\n\n"
