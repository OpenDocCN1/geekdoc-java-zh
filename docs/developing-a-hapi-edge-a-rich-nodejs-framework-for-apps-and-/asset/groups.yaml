    \n在 `mdb` 之外，还有几个非常有用的工具可以处理 SmartOS 创建的内核文件（core file）。这些工具通常位于 `/usr/proc/bin`，并包含以下命令：\n\
    \n```\n# pwd\n/usr/proc/bin\n# ls -l\ntotal 13\nlrwxrxr-x 1 root root 15 Jun 29\
