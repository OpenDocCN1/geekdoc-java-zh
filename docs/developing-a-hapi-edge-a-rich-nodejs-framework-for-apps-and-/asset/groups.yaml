  - "[PAGE 109]\n\n```\n<html>\n<head>\n  <title>{page_title}</title>\n</head>\n<body>\n\
    \  {content}\n</body>\n</html>\n```\n\ncombined with context data like this:\n\
    \n```\nvar context = {\n  page_title: 'Templating is fun!',\n  content: '<h1>Hello\
    \ world!</h1>'\n}\nreturn reply.view('index', context);\n```\n\nwill return HTML\
    \ output like this:\n\n```\n<html>\n<head>\n  <title>Templating is fun!</title>\n\
    </head>\n<body>\n  <h1>Hello world!</h1>\n</body>\n</html>\n```\n\nUsing a template,\
    \ data can quickly be added, moved around, or removed entirely. The work can be\
    \ split up - designers work on templates while developers supply contexts. Templates\
    \ can easily be swapped out as part of a redesign or conditionally (show user\
    \ X design if their settings specify a preference; otherwise, V).\nSo, a template\
    \ is less tedious and far more flexible to use than the alternative.\n\n# Configuration\n\
    \nIn topi, views must be configured before they can be used. Views must know what\
    \ engine(s) to run and where to find files - those are required. The other options\
    \ are not required."
