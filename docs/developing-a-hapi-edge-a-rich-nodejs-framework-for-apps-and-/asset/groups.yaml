    \ -v. Beware of verbose mode enabled with the same test.\n\n```\n$ lab -v\n1)\
    \ lab exists\n\nFailed tests:\n1) lab exists:\n   Timed out (2000ms) - lab exists\n\
    \n1 of 1 tests failed\nTest duration: 2006 ms\nNo global variable leaks\n```\n\
    \n# Test scripts\n\nLab also doesn't assume that a JavaScript file in the test\
    \ folder is necessarily a test. Therefore, in order to tell lab that a script\
    \ file is a test script, you must execute Lab.script() and assign the result to\
    \ the lab property of the module.exports object. In order to help catch developer\
    \ mistakes with this style, lab will report instances when script() was executed\
    \ but a lab property wasn't exported. An example of this code is shown here:\n\
    \n```javascript\n// Load modules\n\nvar Code = require('code');\nvar Lab = require('lab');\n\
    \nvar lab = Lab.script();\n\nlab.test('lab exists', function (done) {\n  Code.expect(lab).to.exist();\n\
    \  done();\n});\n```\n\nWith this test, if you run lab, the error message for\
    \ this mistake would look like:\n\n```\n$ lab\nfile: test/index.js includes a\
    \ lab script that is not file: test/index.js includes a lab script that is not\
    \ exported via exports.lab\n```\n\n# Safe globals\n\nAnother assumption of lab\
    \ is that the global object shouldn't be polluted with test features. Whereas\
    \ other frameworks attach a describe or it to the global object, lab tries a different\
    \ approach of isolating each experiment. Each of the experiment or test functions\
    \ is only available on a lab object that's returned by executing script().\nLab\
    \ takes the global issue a step further and changes the global object for new\
    \ properties that exist after running tests. This is usually a sign of a missing\
    \ var declaring a variable. However, this feature can be disabled by passing -l\
    \ or --leaks to the lab binary. Similarly, if there is a global that should exist\
    \ you can pass it as an argument to -I or --ignore. For example, if you want to\
    \ ignore a property named foo, set on the global object, you would execute lab\
    \ as follows:\n\n```\n$ lab --ignore foo\n```\n\n# Experiments\n\nWhile lab tests\
    \ can be made to look like mocha and jasmine behavior-driven (BDD) style tests,\
    \ they can also be named something else entirely. Whereas BDD styles to use describe\
    \ and it, lab offers the options to use experiment and test instead. The functions\
    \ describe and experiment are interchangeable, just as it and test are. The style\
    \ you choose is entirely up to you, and there isn't a wrong answer. One of the\
    \ things that is nice about using the experiments style, however, is that it does\
    \ reinforce the notion that an engineer is creating the tests and there is some\
    \ attempt to be scientific about them.\n\nAn experiment is useful for wrapping\
    \ a group of similar tests. For example, if you are testing lab itself, you may\
    \ write experiment tests that are wrapped in an experiment demonstrated below.\n\
    \n```javascript\n// Load modules\n\nvar Code = require('code');\nvar Lab = require('lab');\n\
    \nvar lab = exports.lab = Lab.script();\n\nlab.experiment('lab', function () {\n\
    \  lab.test('exists', function (done) {\n    Code.expect(lab).to.exist();\n  \
    \  done();\n  });\n\n  lab.test('has properties', function (done) {\n    Code.expect(Object.keys(lab)).to.not.have.length(0);\n\
    \    done();\n  });\n});\n```\n\nThen if you run these tests in verbose mode,\
    \ you will get the following:\n\n```\n$ lab -v\nlab\n1) exists (3 ms)\n2) has\
    \ properties (1 ms)\n```\n\n2 tests complete\n\n# Writing a hapi test\n\nTest\
    \ duration: 6 ms\nNo global variable leaks detected\n\nYou can see here that with\
    \ verbose mode, you can also see how long each test took.\n\n# Writing a hapi\
    \ test\n\nhapi was designed with testing in mind. In order to ship a release,\
    \ every line and every code path must have a test run for it. As a result, there\
    \ are quite a lot of tests in hapi and its dependencies. In order to help speed\
    \ up the time it takes to run tests, as well as avoid issues with file descriptor\
    \ limits, hapi has built-in mock request support. This is delivered through a\
    \ function named inject provided by the module shot. To illustrate the power of\
    \ shot look at the test below. Also notice that using experiment style of testing,\
    \ the test is written with test shortcuts for the BDD style.\n\n```javascript\n\
    // Load modules\nvar Code = require('code');\nvar Hapi = require('hapi');\nvar\
    \ Lab = require('lab');\n```\n\n```javascript\nvar lab = exports.lab.script();\n\
    var describe = lab.describe;\nvar it = lab.it;\nvar expect = Code.expect();\n\
    ```\n\n```javascript\ndescribe('inject', function () {\n  it('returns the response\
    \ result', function (done) {\n    var handler = function (request, reply) {\n\
    \      return reply('hello');\n    };\n\n    var server = new Hapi.Server();\n\
    \    server.connection();\n\n    server.route({\n      method: 'GET',\n      path:\
    \ '/',\n      config: { handler: handler }\n    });\n\n    server.inject('/',\
    \ function (res) {\nexpect(res.statusCode).to.equal(200);\nexpect(res.result).to.equal('hello');\n\
    done();\n\n});});});\n```\n\nIn the previous example the server.start function\
    \ wasn't executed. As a result, a socket was created or attached to the server.\
    \ However, a request was made to the server and a response was received. The request\
    \ object includes all of the properties that hapi server cares about. Similarly,\
    \ the response object passed to the inject callback includes the response body\
    \ and relevant headers and status code.\n\nUnless the test is creating information\
    \ from a socket, the best solution is usually to use inject. If this is the approach\
    \ you take your tests should execute much faster than they relied on a real socket.\
    \ Also, it makes much easier to avoid the setup and teardown around a socket.\
    \ Speaking of which, if you need to use a socket, pass as port to the connection\
    \ function in order to ensure that the port is used. The code below notices that\
    \ the port ends up being used can be retrieved from the server.info property after\
    \ a server is started.\n\n```javascript\n// Load modules\n```\n\n```javascript\n\
    var Code = require('code');\nvar Hapi = require('hapi');\nvar Lab = require('lab');\n\
    var Wreck = require('wreck');\n```\n\n```javascript\nvar lab = exports.lab = Lab.script();\n\
    var describe = lab.describe;\nvar it = lab.it;\nvar expect = Code.expect;\n```\n\
    \n```javascript\ndescribe('real request', function () {\n\nit('returns a real\
    \ response', function (done) {\n\n\tvar handler = function (request, reply) {\n\
    \n\t\treturn reply('hello');\n\t}\n\n\tvar server = new Hapi.Server();\n\tserver.connection({\
    \ port: 0 });\n\tserver.route({\n\t\tmethod: 'GET',\npath: '/',\nconfig: { handler:\
    \ handler } };\nserver.start(function () { \n  Wreck.get('http://localhost:' +\
    \ \n  server.info.port,\n    function (err, res, payload) {\n\n      expect(res.statusCode).to.equal(200);\n\
    \      expect(payload).to.equal('hello');\n      server.stop(done);\n    }\n \
    \ });\n});\n```\n\nWreck is a lightweight HTTP/HTTPS client wrapper that was designed\
    \ for hapi. This is the module of choice when doing any requests. That being said,\
    \ the request module is completely supported as well. Locally, the difference\
    \ in test time between the inject example and the wreck example is around 18ms.\n\
    \n# Code coverage\n\nAside from all of the previous features that go into lab,\
    \ code coverage is one of its strongest features. Code coverage in lab depends\
    \ on the espree module for generating the AST. Other typical line by line coverage,\
    \ lab will also determine if different code branches are executed by tests. This\
    \ can be anything from many conditionals within the same if statement to standard\
    \ ternary statements. Furthermore, lab will also determine if a code path is unexecuted,\
    \ and can be deleted.\nThe 'html' and 'console' reporters are the most heavily\
    \ tested when it comes to showing coverage. By default, code coverage isn't enabled\
    \ when you run lab. To enable it you need to pass in the -c or --coverage flags.\
    \ The flag will enable code coverage reporting and ensure that the tests cover\
    \ 100% of the code. If less than 100% code coverage then you can use the -t or\
    \ --threshold flag following a number that represents the percent of code covered\
    \ before erroring. If the tests fail to pass the threshold, lab exits with an\
    \ error code.\nBelow there is an output of the console reporter that shows failed\
    \ test coverage looks like.\n\n```\n$ lab -c\n```\n"
