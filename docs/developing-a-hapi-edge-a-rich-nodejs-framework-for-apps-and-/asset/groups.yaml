    \ bug。\n\n# 总结\n\n废话不多说，让我们在下一章中开始学习 hapi 服务器。\n\n# 服务器 2\n\nhapi 是一个用于构建应用程序和服务的框架。在每个服务背后都有一个服务器；即满足客户端需求的实体。hapi\
