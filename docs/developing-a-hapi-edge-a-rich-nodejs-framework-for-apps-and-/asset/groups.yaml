    \nvar server = new Hapi.Server();\n\nserver.connection();\n\nserver.route({\n\
    \    method: 'GET',\n    path: '/',\n    handler: function (request, reply) {\n\
    \        return reply('hello hapi');\n    }\n})\n\nserver.start(function (err)\
    \ {\n    console.log(server.info.uri);\n});\n```\n\nWe created an instance of\
    \ a hapi server. We don't actually have to do anything at all to configure it.\
    \ The next step is to get a connection to the server. The connection is the port\
    \ and host that the server is listening to. By default, the host is set to localhost\
    \ and the port is generated randomly on ports that don't require system administrator\
    \ access, and that are available. Since we don't know what the port is, we print\
    \ the URI out at the end so we can see where our server is listening.\n\nWe add\
    \ a route so that we have somewhere we can actually send a request. We'll go a\
    \ lot further into routes in Chapter 3, but for now, think of a route as a configured\
    \ path that the request from the client (browser) can take in order to have a\
    \ particular response served.\n\nAt this point we start the server, and log the\
    \ server URI so we know what port the server started on. Next logical steps would\
    \ be to set a port for our server to start on so that we know it's the same time.\
    \ This can be accomplished by using the options for the connection: `server.connection({\
    \ port: 8088 });`\n\n# Setting up the server for hapi-plugins\n\nNow we have a\
    \ more basic understanding of how to set up a server, let's examine what we need\
    \ to do to up the server for hapi-plugins.\n\nA typical architecture for a Single\
    \ Page Application (SPA) is to have some HTML templates served through a front-end\
    \ framework such as Ember, AngularJS, React or others. We've chosen to use React\
    \ for our front-end. The information served to the framework can use the same\
    \ back-end methods of serving up the data to the framework, but a cleaner approach\
    \ is to have a separate API server handle the data and this is the approach we\
