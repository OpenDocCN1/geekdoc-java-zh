- md: "\n...\nand even have different options settings per environment. This allows\
    \ you to again keep all in one location so things are easier to manage.\n\n##\
    \ A word on labels and selecting plugins\n\nDuring registration, plugins can be\
    \ loaded on specifically designated connections for the server. This is a really\
    \ important feature of hapi. It allows for the handling of multiple distinct servers\
    \ as part of one package. The api can be separated from the logic of presenting\
    \ templates this way.\n\nActually debugging the setup and making sure the right\
    \ plugins are registered on the correct server can be a bit of a challenge. We\
    \ recommend the blipp plugin in order to see what's going on the routing table\
    \ when loading the server.\n\n```\nserver.register({\n  // plugins ...\n}, { select:\
    \ 'http' }, function (err) {\n  if (err) {\n    console.log('server.register err:',\
    \ err);\n  }\n  server.register({\n    // plugins ...\n  }, { select: 'api' },\
    \ function (err) {\n    if (err) {\n      console.log('server.register err:',\
    \ err);\n    }\n  });\n  server.start(function () {\n    console.log('server started\
    \ on port: ', server.info.port);\n    return callback(null, server);\n  });\n\
    });\n```\n\n## When to use a plugin\n\nThe goal was to better manage your code\
    \ -- EH\n\n## CHAPTER 6: Plugins\n\nWe've already touched on some cases of when\
    \ to use a plugin, let's go over them again and be more specific. Using plugins\
    \ correctly can help you architect your code well.\n\nYou'll want to create a\
    \ plugin if there's anything that you can do to separate from the rest and reuse\
    \ across different projects. You may have started looking at the various plugins\
    \ for a project, and not found one that suits yours. It's possible to create your\
    \ own plugin. One of the authors found that popular frameworks such as Ruby on\
    \ Rails, there was no way to have list the different routes that were available\
    \ at the start of the app. A plugin was created just to show that simple information.\n\
    \nA project may be, as mentioned earlier, also based on the routes available.\
    \ A plugin may be completely dedicated to serving up the routes for a specific\
    \ path. For example, we may have all of the routes in one of the plugins.\n\n\
    ```\nplugin.route([\n  { method: 'GET', path: '/plugins/upload', config: Controllers.Plugin.getUpload\
    \ },\n  { method: 'POST', path: '/plugins/upload', config: Controllers.Plugin.postUpload\
    \ },\n  { method: 'GET', path: '/plugins/{name}/download', config: Controllers.Plugin.download\
    \ }\n])\n```\n\nAnd we may have another plugin to handle user information.\n\n\
    ```\nplugin.route([\n  { method: 'GET', path: '/user', config: Controllers.User.get\
    \ },\n  { method: 'PUT', path: '/user/profile', config: Controllers.User.updateProfile\
    \ }\n])\n```\n\nThis will make more sense if you have a large project and you\
    \ need to divide up the work because routes take a lot of logic.\n\n## The hapi\
    \ plugin ecosystem: some common plugins\n\nLet's look at some of the popular plugins\
    \ in the hapi ecosystem. You can find more plugins on hapi-plugins.com (of course)\
    \ but we've taken the liberty to show some of the major ones.\n\n### hapi-auth-basic\n\
    \nThis plugin provides basic authentication for logging into the application,\
    \ or just basic authentication in general. Most web-based systems require some\
    \ form of authentication to gain access to the data. Many frameworks as part of\
    \ the framework, but by using this mod-approach, any authentication form is possible.\n\
    \nMore information on hapi-auth-basic is provided in Chapter 7.\n\n### blipp\n\
    \nWhile blipp isn't a core plugin, it's nevertheless very useful. It simply displays\
    \ the routes and the server:port combination when the hapi server is started.\
    \ It gives a very quick indication of what routes are available and that they're\
    \ available on the correct server connection.\n\n### bell\n\nBell is much like\
    \ hapi-auth-basic except that it uses third-party logins such as Facebook, GitHub,\
    \ Instagram, Twitter, Yahoo, Foursquare, VK, ArcGIS Online and Windows Live. If\
    \ you're looking for logins for these, this is the plugin to use. Third-party\
    \ plugins are getting added continually. Bell is usually used with hapi-auth-cookie\
    \ that isn't explicitly called out on its own.\n\nMore information on bell and\
    \ hapi-auth-cookie is provided in Chapter 7.\n\n### good\n\nIf you're running\
    \ a service in production, you'd almost certainly want to use good. You get to\
    \ see how your service is performing with cpu usage, memory, etc. There are many\
    \ reporters you can use with this program, you can have reports sent to a file\
    \ logger, to console, or any custom program you write your own reporter.\n\nMore\
    \ information on good is provided in Chapter 11.\n\n### tv\n\nTV is an interactive\
    \ module used for debugging. It becomes easy to see what requests are received\
    \ by your service and what it does to handle it.\n\nMore information on tv is\
    \ provided in Chapter 11.\n\n### lout / hapi-swagger\n\nLout and hapi-swagger\
    \ are documentation tools for your routes and setup. It provides api documentation\
    \ for you, so you don't have to this. This can save you some serious time for\
    \ something that you need to have anyway. \n\n### poop\n\nIn line with hapi's\
    \ goal of being silly, poop is a plugin for doing a process dump on exceptions.\
    \ It provides a heapdump (https://www.npmjs.com/package/heapdump) and a log file\
    \ will also be provided containing additional details for debugging.\n\n## More\
    \ plugins\n\nYou can find a large list of plugins at hapijs.com under Plugins.\n\
    \n## Summary\n\nOften hapi plugins started as part of the core project. As the\
    \ project grew, many sections of hapi were broken into their own plugins. This\
    \ happened for a variety of reasons. It helps keep things small and manageable.\
    \ It can be useful to reuse for other applications. It can also be useful to separate\
    \ out responsibilities between large teams.\n\nWriting plugins can also drive\
    \ the design in hapi applications. They keep it easy to manage the application\
    \ and allow for configuration-driven servers. We've shown you how use they are\
    \ and how to use options to keep your configurations manageable and flexible.\n\
    \nNext, we will utilize some of the hapi authentication plugins described above\
    \ and explain how to utilize hapi for your authentication needs.\n\n## Authentication\
    \ 7\n\nFrom the beginning, authentication has been front and center in hapi. A\
    \ robust application framework must consider authentication for any useful adoption\
    \ to take place. There are a large number of authentication strategies that now\
    \ exist for hapi. One of the nice about the approach that hapi takes to authentication\
    \ is while it's central to the framework itself, the strategies are expected to\
    \ be provided by external modules. Even to support basic authentication, an external\
    \ module needs to be installed. As a result, there are many options, some competing,\
    \ which are available to hapi developers.\n\n## Chapter Overview\n\nThe following\
    \ chapter will cover many details on authentication in hapi. Specifically, the\
    \ following plugins will be covered.\n\n- hapi-auth-basic\n- hapi-auth-cookie\n\
    - bell (with hapi-auth-cookie)\n\n## Scheme vs strategy\n\nIt can be a bit confusing\
    \ when talking about authentication on what the difference is between a scheme\
    \ and a strategy. \n\nYou can think of a scheme as a general auth type like basic\
    \ or digest. A strategy is a preconfigured and named instance of the scheme. Another\
    \ way to think about it is an authentication strategy sets how to authenticate\
    \ technically/mechanically. The strategy can be third party OAuth strategy, a\
    \ db, cookies, basic, or any custom one you can think of. They rely on authentication\
    \ scheme. An authentication scheme sets up who is authenticating. The scheme could\
    \ be an admin, user, or custom thing.\n\nComing up, we will talk about the hapi-auth-basic\
    \ plugin. The strategy for this is simple and it uses the basic scheme to implement\
    \ it. It will become more obvious later, when bell is discussed, but strategies\
    \ help hapi be an extremely framework framework because it can support multiple\
    \ strategies.\n\n## CHAPTER 7: Authentication\n\nthe name of basic. This is done\
    \ with the server.auth.scheme() method. Once thehapi-auth-basic plugin has been\
    \ registered, you use the server.auth.strategy() function to create a strategy\
    \ with the name of simple. Finally, you tell a route to use the strategy for authentication.\n\
    \nAs you go through this chapter and see specific examples, these concepts should\
    \ make more sense.\n\n### hapi-auth-basic\n\nThe next step up from a hard-coded\
    \ username and password is basic authentication. It's not much more secure than\
    \ a username and password passed in the clear, but it serves a purpose for some\
    \ internal applications. Aside from that usefulness that may or not exist, it\
    \ makes for a simple starting point in understanding hapi authentication.\n\n\
    In the early days of Chapter 6, the hapi authentication scheme was baked into\
    \ the module itself. In Chapter 7, hapi has evolved and as authentication grew,\
    \ so the need to split hapi up into plugins. You will need to install the hapi-auth-basic\
    \ plugin in order to get any basic authentication support in hapi.\n\nFor any\
    \ authentication to support it, you must first have a scheme registered with the\
    \ server. The scheme is the heart of authentication that will take place. In the\
    \ case ofhapi-auth-basic the scheme is registered when the plugin itself registered.\
    \ The only thing to do is to declare an authentication strategy that will use\
    \ the scheme.\n\nBelow demonstrates how to register the hapi-auth-basic plugin\
    \ and set it a strategy:\n\n```\nvar Hapi = require('hapi');\nvar Basic = require('hapi-auth-basic');\n\
    \nvar server = new Hapi.Server();\nserver.connection({ port: 3000 });\n\nserver.register(Basic,\
    \ function (err) {\n\n  server.auth.strategy('simple', 'basic', { validateFunc:\
    \ validate });\n});\n```\n\nAfter an authentication strategy is in place, it can\
    \ be used by individual routes that expect authentication. If you expect all routes\
    \ to have a certain strategy, you can pass an option when declaring the strategy\
    \ for mode and set the mode to required.\n"
