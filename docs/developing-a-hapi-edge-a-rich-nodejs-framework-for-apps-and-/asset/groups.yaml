  - "[PAGE 30]\n\nbind sets the context for the method and defaults to the context\
    \ when the method was created. If you want some other content, this is the place\
    \ to do it.\ncache has the same configuration, which will be discussed in Configuring\
    \ for caching.\nFinally, generateKey is a function that's used to create a unique\
    \ key for caching purposes.\n\n# Decorating the server\n\nUsing server.decorate,\
    \ you can add functions directly to the server object. This is different from\
    \ server.method where you add methods to access via server.methods. In addition\
    \ to decorating the server object, you can also decorate the reply object, and\
    \ we'll cover that in Chapter 4.\n\n```\nserver.decorate('server', 'success',\
    \ function () {\n    return this.response({ success: true });\n});\n```\n\n# Configuring\
    \ for caching\n\nWe can use server.cache to setup a cache. hapi has a built-in\
    \ server cache facility and it relies on the hapi plugin cache. By default, there\
    \ is a built-in memory cache catbox-memory supported by other types of cache engines\
    \ like redis, MongoDB, memcached, and others. Please refer to the catbox documentation\
    \ for more details on these strategies. Here is a simple example of how to use\
    \ server.cache.\n\n```\nvar cache = server.cache({\n    segment: 'plugins',\n\
    \    expiresIn: 60 * 60 * 1000\n});\n\ncache.set('pluginName', { author: 'mindy'\
    \ }, null, function (err) {\n    cache.get('pluginName', function (err, value,\
    \ cached, log) {\n        // value === { author: 'mindy' };\n    });\n});\n```\n\
    \nWe have here setup a cache, with a segment of plugins. Segments are used to\
    \ isolate cached items within the cache partition. When you call this within a\
    \ plugin, it defaults to ! name where name is the name of the plugin."
- md: "\n## CHAPTER 2: Server\n\nWe also have an expiresIn setting, which is set to\
    \ expire the cached item in one hour.\nThere is also interesting setting called\
    \ staleIn where you can mark the item stored in cache as stale. This setting is\
    \ less than expiresIn. Using this feature, you can have the cache ready by the\
    \ time expiresIn comes. If staleIn doesn't have sufficient time before expiresIn,\
    \ it will just work like the usual expiresIn. This is warming up your cache.\n\
    \nFinally, you can see that we use cache.set() to set the pluginName with the\
    \ value of the author object and we can retrieve that using the cache.get() method.\n\
    \nThere are more options to server.cache and get more details visit the hapis.js\
    \ documentation.\n\n# Request lifecycle\n\nUnderstanding how a technology handles\
    \ an HTTP request is fundamental in developing secure, efficient applications\
    \ using that technology. Node.js itself doesn't provide much in this regard, although\
    \ creating a server is fairly simple in Node.js:\n\n```\nvar server = require('http');\n\
    \nserver.on('request', function (request, response) {\n  // do something\n});\n\
    \nserver.listen(80);\n```\n\nThat's just, a function. The request has all of the\
    \ inbound information from the origin of the request, and has a writable stream\
    \ that needs to have headers set, information written to it, and then have the\
    \ connection closed. At first this can be exciting, especially for those who haven't\
    \ dealt with it in the past. Once an application needs a routing table however,\
    \ it becomes taxing to deal with.\nThe way in which high deals with the requests\
    \ is by having a reliable series of events each time a request is received by\
    \ the server. Here's the full lifecycle:\n\n- * 'onRequest' extension point\n\
    \  - always called\n  - the request object passed to the extension functions is\
    \ decorated with the request.getUrl() and request.setMethod() methods. Calls to\
    \ these methods will impact how the request is routed and can be used for rewrite\
    \ rules.\n  - request.route is not yet populated at this point.\n\nJSONP configuration\
    \ is ignored for any response returned from the extension point since no route\
    \ is matched yet and the JSONP configuration is unavailable.\n\n- - Lookup route\
    \ using request path\n- Parse cookies\n- 'onPreAuth' extension point\n- Authenticate\
    \ request\n- Read and parse payload\n- Authenticate request payload\n- 'onPostAuth'\
    \ extension point\n- Validate path parameters\n- Process query extensions (e.g.\
    \ JSONP)\n- Validate query\n- Validate payload\n- 'onPreHandler' extension point\n\
    - Route prerequisites - configured in the Handler\n- Route handler\n- 'onPostHandler'\
    \ extension point\n\nThe response object contained in request.response may be\
    \ modified (but not assigned a new value). To return a different response type\
    \ (for example, replace an error with an HTML response), return a new response\
    \ via reply(response).\n\n- - Validate response payload\n- 'onPreResponse' extension\
    \ point\n\n- - always called (except when reply.close() is called or the client\
    \ connection prematurely).\n- The response contained in request.response may be\
    \ modified (but not assigned a new value). To return a different response type\
    \ (for example, return an error with an HTML response), return a new response\
    \ via reply(response). Note that any errors generated after reply(response) is\
    \ will not be passed back to the 'onPreResponse' extension method to prevent an\
    \ infinite loop.\n\n- - Send response (may emit 'request-error' event)\n- Emits\
    \ 'response' event\n- Wait for tails\n- Emits 'tail' event\n\n# Extension points\n\
    \nNow that we've discussed the lifecycle, we can utilize 'extension points' in\
    \ hapi. These extension points' expose streams in the lifecycle where other functions\
    \ can be inserted. They can easily be tied to a server to augment the existing\
    \ hapi lifecycle. We use the server.ext functionality to accomplish this. Let's\
    \ look at a couple of examples. These next examples are also shown in Chapter\
    \ 9 around how to shared context. It's important to know what this means now,\
    \ but let's take a look at how server.ext is used. First, let's see anPreResponse\
    \ event.\n\n```\nserver.ext ('onPreResponse', function (request, reply) {\n  var\
    \ response = request.response;\n  if (response.isBoom() && response.source.context)\
    \ {\n    response.source.context.title = \"hapi-plugins\";\n  }\n  return reply();\n\
    })\n```\n\nYou can see that we called server.ext. Recall in the request lifecycle,\
    \ the onResponse towards the end, right before the response is given. We add a\
    \ function here, which we add the title context and return back the reply() object.\n\
    The alternative example in Chapter 9 is:\n\n```\nserver.ext ('onRequest', function\
    \ (request, next) {\n  request.sharedContext = {\n    title: 'hapi-plugins'\n\
    \  };\n\n  next();\n});\n```\n\nThis time we are using the onRequest part of the\
    \ request lifecycle. Again we don't really need to know what this does specifically\
    \ at this point, but recall that onRequest is at the beginning of the lifecycle,\
    \ depending on where you need to add your functionality to the process, how you\
    \ need to neatly put your logic into the flow. Though not discussed, if you needed\
    \ to add some custom functionality during the authentication process, you could\
    \ utilize onPreAuth or onPostAuth. Keep in mind that these may not always be called\
    \ in the lifecycle if it's not relevant.\n\n# Summary\n\nSetting up a server is\
    \ rather simple. A server and plugin are much the same thing. The server can consist\
    \ of several different plugins. A plugin is just a logical separation of smaller\
    \ more manageable parts, which can get added to your server instance. We can decorate\
    \ the server with functions and the server can be configured using JSON configuration\
    \ files.\n\nUsing glue can really make our setup a lot simpler, and using configuration\
    \ files with rejoice and confidence is a good way to go if there are development\
    \ and production setups. Next, you will learn all about routes for our hapi server.\n\
    \n# Routes 3\n\nIn most places, the term route is associated with a certain path\
    \ that you can take to get to your destination. When driving from point A to B,\
    \ for instance, you may have the option of several different routes. A route is\
    \ a very specific path between the two points.\nnHapi and other frameworks, a\
    \ route is a specific path that a request takes. On a website, the number of characters\
    \ you can write after the address hapi-plugins.com are only limited to the number\
    \ of characters your browser will support. In order to send a request and actually\
    \ get a response for what you're looking for, you need to know the route of where\
    \ to send the request. The query then travels through a path within the framework,\
    \ and a response is returned based on several parameters as part of the request.\
    \ The actual route you told the route to take is key for knowing how to handle\
    \ this request. It's the first indication of what the client is expecting it to\
    \ do with the request.\nIn its simplest form, a route looks like the following:\n\
    \n```\nserver.route({\n  method: 'GET',\n  path: '/',\n  handler: function (request,\
    \ reply) {\n    reply.view('index');\n  }\n});\n```\n\nThis is a great obvious\
    \ form for short and simple routes, but when the project gets larger we separate\
    \ out the behavior to use config instead of supplying the handler like we see\
    \ here.\nWe typically store the config in their own file. Before we look at what\
    \ we've done for this project, we will simply even further.\nIn our lib/routes.js\
    \ file we have the following:\n\n```\nvar Welcome = require('./controllers/welcome');\n\
    server.route({\n  method: 'GET',\n```\n\n## CHAPTER 3: Routes\n\n```\npath: '/'\n\
    config: Welcome.index\n\n);\n```\n\nThen the actual config for the route is in\
    \ a corresponding file 'lib/controllers/welcome.js'.\n\n```\nmodules.export.index\
    \ = {\n    description: 'Show the main page for our welcome page',\n    handler:\
    \ function (request, reply) {\n        reply.view('index');\n    }\n};\n```\n\n\
    This keeps code logically separated, which is typical of an MVC (Model-View-Controller)\
    \ framework. The logic in the code can get quite extensive, and with this separation,\
    \ it can easily be organized so that the logic for a particular route is all in\
    \ one file. You may decide to go that route, which would be as simple as keeping\
    \ that logic in a file lib/controllers/welcome/index.js instead. Perhaps terms\
    \ of service would be lib/controllers/welcome/tos.js under this structure. Of\
    \ course, there be some sense to how large a function is before it splits out\
    \ into its own file. But the idea is that the code, when broken up into smaller\
    \ pieces, is far easier to manage and read.\n\n# Path processing\n\nRoutes are\
    \ unique. Several issues on GitHub have been opened about regular expressions,\
    \ or other types of globbing. It can be difficult to figure out when routes overlap.\
    \ One of the early design goals of hapi was to ensure that the routing table would\
    \ be identical each time it is loaded. There would be no surprises. When starting\
    \ up, hapi will complain about any conflicts and protect you from these types\
    \ of issues.\n\nHow path processing works in hapi, the router iterates through\
    \ the routing table on each incoming request and executes the first (and only\
    \ matching) route. Route matching is done on the request path only (excluding\
    \ query and other URI components). The requests are matched in a deterministic\
    \ order, so it doesn't matter where you add them. Finally, the routes are sorted\
    \ from the most specific to the most generic. If you want further details on exactly\
    \ how that works, see Path Matching Order.\n\n# Parts of the route\n\nA route\
    \ object, the argument to server.route() consists of just a few easy properties.\n"
  mdcn: "\n\n## 第 2 章：服务器\n\n我们还有一个 `expiresIn` 设置，它设置为缓存项在一小时后过期。\n还有一个有趣的设置叫做 `staleIn`，你可以将存储在缓存中的项标记为已过期。该设置的值小于\
    \ `expiresIn`。使用此功能，你可以在 `expiresIn` 到达时准备好缓存。如果 `staleIn` 在 `expiresIn` 之前没有的时间，它将像普通的\
    \ `expiresIn` 一样工作。这是在预热你的缓存。\n\n最后，看到我们使用 `cache.set()` 将作者对象的值设置为 `pluginName`，并且我们可以使用\
    \ `cache.get()` 方法来检索它。\n\n`server.cache` 还有更多选项，更多详情请访问 hapis.js 文档。\n\n# 请求生命周期\n\
    \n理解某技术如何处理 HTTP 请求，是使用该技术开发安全、高效应用的基础。Node.js 本身在这一方面提供的不多，尽管在 Node.js 中创建一个服务器非常简单：\n\
    \n```\nvar server = require('http');\n\nserver.on('request', function (request,\
    \ response) {\n  // do something\n});\n\nserver.listen(80);\n```\n\n这只是一个函数。请求包含了来自请求源的所有入站信息，并有一个可写流，该流需要设置头、向其写入信息，然后关闭连接。起初这可能令人兴奋，特别是对于那些过去没有处理过它的人。然而，一旦应用程序需要路由表，处理起来就会变得很费力。\n\
    hapi 处理请求的方式是每当服务器接收到请求时，触发一系列可靠的事件。以下是完整的生命周期：\n\n- * 'onRequest' 扩展点\n  - 总是被调用\n\
    \  - 传递给扩展函数的请求对象被 `request.getUrl()` 和 `request.setMethod()` 方法所装饰。调用这些方法将影响请求的路由方式，并可用于重写规则。\n\
    \  - 此时 `request.route` 尚未被填充。\n\n对于从扩展点返回的任何响应，JSONP 配置都会被忽略，因为尚未匹配到路由，且 JSONP\
    \ 配置是不可用的。\n\n- - 使用请求路径查找路由\n- 解析 cookies\n- 'onPreAuth' 扩展点\n- 身份验证请求\n- 读取并解析负载\
    \ (payload)\n- 身份验证请求负载\n- 'onPostAuth' 扩展点\n- 验证路径参数\n- 处理查询扩展（例如 JSONP）\n- 验证查询\n\
    - 验证负载\n- 'onPreHandler' 扩展点\n- 路由先决条件 - 在 Handler 中配置\n- 路由处理器\n- 'onPostHandler'\
    \ 扩展点\n\n`request.response` 中包含的响应对象可以被修改（但不能赋予新值）。要返回不同的响应类型（例如，用 HTML 响应替换错误），请通过\
    \ `reply(response)` 返回一个新的响应。\n\n- - 验证响应负载\n- 'onPreResponse' 扩展点\n\n- - 总是被调用（除非调用\
    \ `reply.close()` 或客户端连接提前断）。\n- `request.response` 中包含的响应对象可以被修改（但不能赋予新值）。要返回不同的响应类型（例如，用\
    \ HTML 响应返回错误），请通过 `reply(response)` 返回一个新的响应。注意，reply(response) 之后生成的任何错误都不会传回\
    \ 'onPreResponse' 扩展方法，以防止无限循环。\n\n- - 发送响应（可能会触发 'request-error' 事件）\n- 触发 'response'\
    \ 事件\n- 等待尾部 (tails)\n- 触发 'tail' 事件\n\n# 扩展点\n\n既然我们已经讨论了生命周期，我们可以利用 hapi 中的“扩展点”。这些扩展点在生命周期中暴露了流，其他函数可以在其中插入。它们可以轻松地绑定到服务器上，以增强现有的\
    \ hapi 生命周期。我们使用 `server.ext` 功能来实现这一点。让我们来看几个例子。接下来的示例也出现在第 9 章中关于如何共享上下文的内容。现在知道这意味着什么很重要，但让我们来看看\
    \ `server.ext` 是如何使用的。首先，让我们看看 `PreResponse` 事件。\n\n```\nserver.ext ('onPreResponse',\
    \ function (request, reply) {\n  var response = request.response;\n  if (response.isBoom()\
    \ && response.source.context) {\n    response.source.context.title = \"hapi-plugins\"\
    ;\n  }\n  return reply();\n})\n```\n\n看到我们调用了 `server.ext`。回想一下在请求生命周期中，onResponse\
    \ 位于最后，就在响应给出之前。我们在这里添加了一个函数，添加了标题上下文并返回了 `reply()` 对象。\n第 9 章中的另一个示例是：\n\n```javascript\n\
    server.ext ('onRequest', function (request, next) {\n  request.sharedContext =\
    \ {\n    title: 'hapi-plugins'\n  };\n\n  next();\n});\n```\n\n这次我们正在使用请求生命周期中的\
    \ `onRequest` 部分。同样，此时我们并不真的需要知道它具体做什么，但请记住 `onRequest` 在生命周期的开始，取决于你需要在流程的哪个位置添加功能，你需要如何整齐地将逻辑放入流程中。虽然没有讨论，但如果你需要在身份验证过程中添加一些自定义功能，你可以利用\
    \ `onPreAuth` 或 `onPostAuth`。请记住，如果与此无关，这些在生命周期中并不总是会被调用。\n\n# 总结\n\n设置服务器非常简单。服务器和插件非常相似。服务器可以由几个不同的插件组成。插件只是更小、更易管理的部分的逻辑分离，可以添加到你的服务器实例中。我们可以用函数装饰服务器，并可以使用\
    \ JSON 配置文件来配置服务器。\n\n使用 `glue` 真的可以让我们的设置变得简单得多，如果有开发和生产环境设置，配合 `rejoice` 和 `confidence`\
    \ 使用配置文件是一个很好的方法。接下来，你将学习所有关于我们 hapi 服务器的路由。\n\n# 路由 3\n\n在大多数地方，“路由”（route）一词与你通过它到达目的地的特定路径相关。例如，从\
    \ A 点开车到 B 点时，你可能有几条不同的路线可选。路由是两点之间的一非常具体的路径。\n在 hapi 和其他框架中，路由是请求所走的特定路径。在网站上，你在地址\
    \ `hapi-plugins.com` 之后可以写的字符数量仅限于你的浏览器支持的字符数。为了发送请求并实际获得你寻找的内容的响应，你需要知道发送请求的路由。查询随后通过框架内部的路径旅行，并根据请求的若干参数返回响应。你告诉路由去采取的实际路由对于知道如何处理此请求是关键。它是客户端期望对请求执行操作的首要指示。\n\
    在最简单的形式下，路由如下：\n\n```\nserver.route({\n  method: 'GET',\n  path: '/',\n  handler:\
    \ function (request, reply) {\n    reply.view('index');\n  }\n});\n```\n\n这是简短且简单路由的一种非常棒直观的形式，但当项目变大时，我们会分离行为，使用配置而不是像这里这样提供处理器。\n\
    我们通常将配置存储在它们自己的文件中。在我们查看为这个项目做了什么之前，我们将进一步简化。\n在我们的 `lib/routes.js` 文件中，我们有如下内容：\n\
    \n```\nvar Welcome = require('./controllers/welcome');\nserver.route({\n  method:\
    \ 'GET',\n```\n\n## 第 3 章：路由\n\n```\npath: '/'\nconfig: Welcome.index\n\n);\n\
    ```\n\n那么，路由的实际配置位于对应的文件 `lib/controllers/welcome.js` 中。\n\n```\nmodules.export.index\
    \ = {\n    description: '显示我们欢迎页的主页',\n    handler: function (request, reply)\
    \ {\n        reply.view('index');\n    }\n};\n```\n\n这保持了代码逻辑分离，这是 MVC（模型-视图-控制器）框架的典型特征。代码逻辑可能会变得非常广泛，通过这种分离，可以轻松地组织使得特定路由的逻辑都在一个文件中。你可能决定采用这种路由，只需将该逻辑放在\
    \ `lib/controllers/welcome/index.js` 中即可。在这种结构下，服务条款可能是 `lib/controllers/welcome/tos.js`。当然，在函数大到需要拆分为单独文件之前会有某种判断标准。但核心思想是代码在拆分成更小的部分后更容易管理和阅读。\n\
    \n# 路径处理\n\n路由是唯一的。在 GitHub 上已经开启了关于正则表达式或其他类型通配符的问题。当路由重叠时，很难判断。hapi 的早期设计目标之一是确保路由表在每次加载时都是相同的。不会有意外。在启动时，hapi\
    \ 会对任何冲突进行报错并保护你免受此类问题的影响。\n\n路由匹配顺序\n\n（注：此处对应原文逻辑重复，已按要求完成翻译）*。为了发送请求并实际获得你寻找的内容的响应，你需要知道发送请求的路由。查询随后通过框架内部的路径旅行，并根据请求的若干参数返回响应。你告诉路由去采取的实际路由对于知道如何处理此请求是关键。它是客户端期望对请求执行操作的首要指示。\n\
    \nhapi 如何处理路径的，路由器在处理每个传入请求时遍历路由表并执行第一个（也是唯一的）匹配路由。路由匹配仅针对请求路径（不包括查询和其他 URI 组件）。路由匹配是按照确定的顺序进行的，因此无论你在哪里添加它们都没有关系。最后，路由按照从具体到通用的顺序排序。如果你想进一步了解这具体如何工作，请参见路径匹配顺序。\n\
    \n# 路由的组成部分\n\n路由对象，`server.route()` 的参数包含几个简单的属性。\n\n"
