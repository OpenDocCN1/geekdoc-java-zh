- md: "\n## Best practices\n\ndocumentation on how to use ssl termination, see DigitalOcean:\
    \ How To Set Up Nginx Load Balancing with SSL Termination.\n\nAlternatively, Node.js\
    \ can terminate the encryption by processing the certificates, as this can be\
    \ time consuming and increases the load on application machines. For information\
    \ on how to use ssl termination, see the API docs under server.connection.tls\
    \ option. Below is a basic example of enabling ssl termination in:\n\n```\nvar\
    \ fs = require('fs');\nvar options = {\n  port: 443,\n  key: fs.readFileSync(keyPath,\
    \ 'utf8'),\n  cert: fs.readFileSync(certPath, 'utf8')\n}\nserver.connection(options);\n\
    ```\n\n## Header stripping\n\nThere are may vulnerabilities that can be fixed\
    \ by either setting or removing an HTTP header. Before breaking down the various\
    \ vulnerabilities, here is a generic way to globally set or remove headers:\n\n\
    ```\nserver.ext('onPreResponse', function (request, reply) {\n  if (!request.response.isBoom)\
    \ {\n    request.response.output.headers.ToAdd = 'someValue';\n    delete request.response.output.headers.toRemove;\n\
    \  }\n  return reply();\n});\n```\n\nAlternatively, this can be done within a\
    \ single handler to apply just a single route:\n\n```\nhandler: function (request,\
    \ reply) {\n  return reply(output)\n    .header('Content-Type', 'application/json')\n\
    \    .header('X-Frame', 'DENY')\n}\n```\n\n# CHAPTER 12: Security\n\n## CLICKJACKING\n\
    \nClickjacking occurs when your web page is inserted into an HTML iframe where\
    \ users' clicks can be hijacked. If a user clicks on your home button, an attacker\
    \ could hijack the click and redirect the user to a malicious webpage.\n\n###\
    \ Solution\n\nSetting the X-Frame header to 'DENY' will prevent browsers from\
    \ allowing your web-pages from being put inside of a frame or iframe (<iframe>).\n\
    \n## X-POWERED-BY\n\nMost web server frameworks, by default, announce in the HTTP\
    \ header \"X-Powered-By\" what framework and version was used to generate the\
    \ page.\n\nBy default, hapi does not do this. But if you publicly blog about the\
    \ hapi tech stack, your attackers will also see that.\n\n### Solution\n\nA common\
    \ way to mitigate the risk of being open about your tech stack is to provide a\
    \ middle-man proxy in you and your users. Popular choices are CloudFlare, Fastest,\
    \ and Akamai.\n\n## IE OPEN WITHIN CONTEXT\n\nInternet Explorer 8 fixed an old\
    \ vulnerability where an attacker could open a remote or local HTML file within\
    \ the security context of your site to run malicious code. To read more about\
    \ the issue, please read the Microsoft Blog Post.\n\n### Solution\n\nSetting the\
    \ 'X-Download-Options' to 'noopen' will prevent this issue in Internet Explorer\
    \ 8 and up.\n\n## contentSecurityPolicy\n\nTechnically, by default, browsers will\
    \ allow you to embed arbitrary JavaScript (via script tags) from any domain. This\
    \ is normally acceptable. However, it is possible that a developer entering a\
    \ typo into their code could cause the wrong file to load and execute malicious\
    \ code.\n\nAlternatively, if the web application allows for users to specify their\
    \ own JavaScript to embed on the page, managing security can quickly get out of\
    \ hand.\n\n### SOLUTION\n\nModern browsers now support a system called Content\
    \ Security Policy. By returning a bunch of HTTP headers, it is possible to force\
    \ the browser to create a whitelist of acceptable domains and restrict script-src\
    \ calls to this list.\nUse blankie in combination with scooter to quickly define\
    \ CSP rules.\n\n```\nvar Hapi = require('hapi');\nvar Blankie = require('blankie');\n\
    var Scooter = require('scooter');\n\nvar server = new Hapi.Server();\n\nserver.pack.register([Scooter,\
    \ {\n  plugin: Blankie,\n  options: {} // specify options here\n}], function (err)\
    \ {\n  if (err) {\n    throw err;\n  }\n  server.start();\n});\n```\n\nBy default,\
    \ a modern browser will prevent AJAX calls to any domain that does not match the\
    \ current page's domain. This is because major browsers enforce a “Same-Origin”\
    \ policy. This Same-Origin policy is a critical aspect of web security.\nHowever,\
    \ as a developer, you might want to allow your web application to directly access\
    \ a third-party API, or use your own API but on a different domain.\nCORS, Cross-Origin\
    \ Resource Sharing allows you to do this in a safe and secure manner by explicitly\
    \ specifying to which domains the browser is allowed to connect to via AJAX. This\
    \ is done by sending custom headers to the browser on response.\n\n## CORS\n\n\
    hapi supports CORS out of the box, but it is disabled by default for security.\
    \ Enabling it is as simple as setting the ‘cors’ server option to true or passing\
    \ it a configuration object with one or more allowed ‘origins’.\n\n### SOLUTION\n\
    \n```\nvar serverOptions = {\n  // ...\n  cors: {\n```\n\n# CHAPTER 12: Security\n\
    \n```\norigin: [\n  'http://localhost:8080',\n  'http://localhost:8000'\n]\n;\n\
    var server = new Hapi.Server();\nserver.connection(serverOptions);\n```\n\nIn\
    \ hapi, CORS can also be applied on a route-based basis:\n\n```\nserver.route({\n\
    \  method: 'GET',\n  path: '/custom-cors',\n  origin: [\n    'http://localhost:9000',\n\
    \    'http://localhost:8000'\n  ],\n  handler: function (request, reply) {\n \
    \   return reply(\"This response has custom\");\n  }\n});\n```\n\nWith CORS configured,\
    \ hapi sets the correct headers. As mentioned above, CORS allows client-side JavaScript\
    \ to make requests. Then, hapi provides resources like Flash.\n\n### SOLUTION\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<crossdomain-policy xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\" xsi:noNamespaceLocation=\"http://www.adobe.com/Policy.xsd\"\
    >\n  <allow-from domain=\"your_domain.com\" />\n  <allow-from domain=\"other_domain.com\"\
    \ />\n  <site-control permitted-cross-requests=\"master-only\" headers=\"*\" secure=\"\
    true\" />\n</crossdomain-policy>\n```\n\n```javascript\nvar Fs = require('fs');\n\
    \nserver.route({\n  method: 'GET',\n  path: '/crossdomain.xml',\n  handler: function\
    \ (request, reply) {\n    return reply(Fs.readFileSync('./crossdomain.xml').toString());\n\
    \  }\n});\n```\n\n## Summary\n\nIn this chapter, you have now seen how to use\
    \ hapi to defend against the most common vulnerabilities.\n\n## Review\n\nIn this\
    \ book, we've gone through a quick introduction to hapi. We've learned how to\
    \ set up a server and how the request lifecycle works so that we can extend that\
    \ to meet our needs. We set up routes, handlers and learned to organize our code\
    \ into smaller components for reuse and durability. Validation was tied in to\
    \ enforce not only our inputs but also our output. Plugins organized our code\
    \ and we learned that utilizing these can create efficient clients and are more\
    \ beneficial to traditional middleware approaches. We've learned to leverage the\
    \ authentication plugins to enhance your application. We've shown some model use\
    \ cases and how to template for your application to separate your presentation\
    \ layer in the handlers. Finally, we've shown how to test, debug, and add security\
    \ to your application in order to make it production ready.\n\nIf you find yourself\
    \ still needing help, hapi has a great community. There are many options to get\
    \ help and the best place to start is found at hapis.com/help. We encourage you\
    \ to participate in the mentor program is mentioned in the help page to make the\
    \ community even stronger. Please be respectful by utilizing the Conference Code\
    \ of Conduct so we can continue to have a great community.\n\nOnce you have mastered\
    \ some skills, we encourage you to become an active participant in mentor others,\
    \ help with issues by contributing, or support in any way that you can continue\
    \ to strengthen the community.\n"
  mdcn: "\n\n## 最佳实践\n\n关于如何使用 SSL 终止的文档，请参见 [DigitalOcean: 如何设置带有 SSL 终止的 Nginx 负载均衡](https://www.digitalocean.com/community/tutorials/how-to-set-up-nginx-load-balancing)。\n\
    \n或者，Node.js 可以通过处理证书来终止加密，但这可能会消耗时间并增加应用程序服务器的负载。有关如何使用 SSL 终止的信息，请查看 `server.connection.tls`\
    \ 选项下的 API 文档。以下是一个启用 SSL 终止的示例示例：\n\n```\nvar fs = require('fs');\nvar options\
    \ = {\n  port: 443,\n  key: fs.readFileSync(keyPath, 'utf8'),\n  cert: fs.readFileSync(certPath,\
    \ 'utf8')\n}\nserver.connection(options);\n```\n\n## 移除头部\n\n许多漏洞可以通过设置或移除 HTTP\
    \ 头部来修复。在详细介绍各种漏洞之前，这里有一种全局设置或移除头部的通用方法：\n\n```\nserver.ext('onPreResponse', function\
    \ (request, reply) {\n  if (!request.response.isBoom) {\n    request.response.output.headers.ToAdd\
    \ = 'someValue';\n    delete request.response.output.headers.toRemove;\n  }\n\
    \  return reply();\n});\n```\n\n或者，这可以在单个处理器内完成，以便仅应用于单个路由：\n\n```\nhandler: function\
    \ (request, reply) {\n  return reply(output)\n    .header('Content-Type', 'application/json')\n\
    \    .header('X-Frame', 'DENY')\n}\n```\n\n# 第 12 章：安全\n\n## 点击劫持 (CLICKJACKING)\n\
    \n点击劫持发生在您的网页被插入到 HTML iframe 中，此时用户的点击可能会被劫持。如果用户点击了您的主按钮，攻击者可以劫持该点击并将用户重定向到恶意网页。\n\
    \n### 解决方案\n\n将 X-Frame 头部设置为 'DENY' 将防止浏览器允许您的网页放置在 frame 或 iframe (`<iframe>`)\
    \ 内部。\n\n## X-POWERED-BY\n\n大多数 Web 服务器框架默认会在 HTTP 头部 \"X-Powered-By\" 中声明用于生成页面的框架框架和版本。\n\
    \n默认情况下，hapi 不会这样做。但如果您在博客中公开讨论 hapi 技术栈，攻击者也会看到它。\n\n### 解决方案\n\n缓解公开技术栈风险的常用方法是在您和用户之间提供一个中间人代理。流行的选择有\
    \ CloudFlare、Fastest 和 Akamai。\n\n## IE 在上下文中打开 (IE OPEN WITHIN CONTEXT)\n\nInternet\
    \ Explorer 8 修复了一个旧漏洞，该漏洞允许攻击者在您的网站的安全上下文中打开远程或本地 HTML 文件以运行恶意代码。要了解更多关于此问题的信息，请阅读微软博客。\n\
    \n### 解决方案\n\n将 'X-Download-Options' 设置为 'noopen' 将防止 Internet Explorer 8 及更高版本出现此问题。\n\
    \n## 内容安全策略 (contentSecurityPolicy)\n\n从技术上讲，默认情况下，浏览器允许您从任何域嵌入任意 JavaScript（通过\
    \ script 标签）。这通常是可以接受的。然而，开发者在代码中输入错误可能会导致加载错误的文件并执行恶意代码。\n\n或者，如果 Web 允许用户指定要嵌入页面的自定义\
    \ JavaScript，那么安全管理可能会迅速失控。\n\n### 解决方案\n\n现代浏览器现在支持一种名为内容安全策略（Content Security\
    \ Policy）的系统。通过返回一系列 HTTP 头部，可以强制浏览器创建接受域的白名单，并将 script-src 调用限制在此列表中。\n结合使用 blankie\
    \ 和 scooter 来快速定义 CSP 规则。\n\n```\nvar Hapi = require('hapi');\nvar Blankie = require('blankie');\n\
    var Scooter = require('scooter');\n\nvar server = new Hapi.Server();\n\nserver.pack.register([Scooter,\
    \ {\n  plugin: Blankie,\n  options: {} // 在此处指定选项\n}], function (err) {\n  if\
    \ (err) {\n    throw err;\n  }\n  server.start();\n});\n```\n\n默认情况下，现代浏览器将阻止对与当前页面域不匹配的域进行\
    \ AJAX 调用。这是因为主流浏览器强制“同源”策略。同源策略是 Web 安全的一个关键方面。\n然而，作为开发者，您可能希望允许您的应用程序直接访问第三方\
    \ API，或者使用您自己的但位于不同域的 API。\nCORS（跨源资源共享）允许您通过显式指定浏览器允许通过 AJAX 连接的域，以安全的方式实现这一点。这是通过在响应中向浏览器发送自定义头部来实现的。\n\
    \n## CORS\n\nhapi 原生支持 CORS，但出于安全考虑默认禁用。启用它只需将‘cors’服务器选项设置为 true，或传递一个包含一个或多个允许‘origins’的配置对象。\n\
    \n### 解决方案\n\n```\nvar serverOptions = {\n  // ...\n  cors: {\n```\n\n# 第 12 章：安全\n\
    \n```\norigin: [\n  'http://localhost:8080',\n  'http://localhost:8000'\n]\n;\n\
    var server = new Hapi.Server();\nserver.connection(serverOptions);\n```\n\n在 hapi\
    \ 中，CORS 也可以基于路由应用：\n\n```\nserver.route({\n  method: 'GET',\n  path: '/custom-cors',\n\
    \  origin: [\n    'http://localhost:9000',\n    'http://localhost:8000'\n  ],\n\
    \  handler: function (request, reply) {\n    return reply(\"This response has\
    \ custom\");\n  }\n});\n```\n\n配置好 CORS 后，hapi 会设置正确的头部。如上所述，CORS 允许客户端 JavaScript\
    \ 发起请求。然后，hapi 提供了 Flash 等资源。\n\n### 解决方案\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<crossdomain-policy xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xsi:noNamespaceLocation=\"http://www.adobe.com/Policy.xsd\">\n  <allow-from\
    \ domain=\"your_domain.com\" />\n  <allow-from domain=\"other_domain.com\" />\n\
    \  <site-control permitted-cross-requests=\"master-only\" headers=\"*\" secure=\"\
    true\" />\n</crossdomain-policy>\n```\n\n```javascript\nvar Fs = require('fs');\n\
    \nserver.route({\n  method: 'GET',\n  path: '/crossdomain.xml',\n  handler: function\
    \ (request, reply) {\n    return reply(Fs.readFileSync('./crossdomain.xml').toString());\n\
    \  }\n});\n```\n\n## 总结\n\n在本章中，你现在已经如何使用 hapi 防御常见的漏洞。\n\n## 复习\n\n本书介绍了 hapi。我们学习了如何设置服务器以及请求生命周期的工作原理以便根据需要进行扩展。我们设置了路由和处理器，并学习了将代码组织成更小的组件以便复用和持久化。验证被整合进来以不仅约束输入，还约束输出。插件组织了我们的代码，我们学习了利用这些比传统的中间件方法更好。我们学习了利用身份验证插件增强您的应用程序。我们展示了一些模型用例以及如何使用模板为您的应用程序分离表示层。最后，我们展示了如何进行测试、调试和添加安全性以使其生产就绪。\n\
    \n如果你发现自己仍然需要帮助，hapi 有一个非常好的社区。有很多帮助的方法，最好的起点是 hapis.com/help。我们鼓励你参与帮助页面中提到的导师计划，以使社区更加强大。请遵守会议行为准则，以便我们继续拥有良好的社区。\n\
    \n一旦你掌握了某些技能，我们鼓励你成为积极参与者，指导他人，通过贡献解决问题，或以任何方式支持继续加强社区。\n\n"
