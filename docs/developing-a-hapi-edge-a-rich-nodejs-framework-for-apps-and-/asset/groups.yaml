  - "[PAGE 45]\n\n# CHAPTER 4: The handler\n\nAttached to the requests is a whole\
    \ slew of important and useful information that gets used in the handler in order\
    \ to fulfill a request. In the rest of this section we're going to take a look\
    \ at how to find this data and what you can do with it.\n\nBear in mind that there\
    \ are other functions in the request lifecycle (see Chapter 2) that can add data\
    \ to the request along the way. We're going to take a look at a few common ones.\n\
    \n# parameters\n\nSome of the request object data is set as part of direct configuration\
    \ of the route. For instance, if the route has defined a path that contains an\
    \ id of a hapi plugin to download, then that will be part of the parameters access\
    \ on the request object.\n\n```\nserver.route({\n  /\n    method: 'GET',\n   \
    \ path: '/plugins/(name)',\n    config: Controllers.Plugin.get\n  }\n///\n});\n\
    ```\n\nThe name is the identifier in our case, and this will be accessed via request.params.name.\
    \ In the above example we have a GET method. Assuming port 8080, if we did a:\n\
    \n```\ncurl -XGET http://localhost:8080/plugins/pluginName\n```\n\nWe'd get the\
    \ back what is returned in Controllers.Plugin.get. We will be contrasting this\
    \ with other methods when we talk about payload.\n\n# query\n\nIt can be confusing\
    \ for new people to hapi, the difference between a param and a query. The query\
    \ part of the URL in https://hapi-plugins.com/search?q=pluginName is the part\
    \ ?. Take a look at the previous example for /plugins/{name} to contrast this.\
    \ The name param was strictly part of the path.\n\nThe request.query contains\
    \ all of the value pairs that are sent along a query in the URL.\n\nFor example,\
    \ we could be a bit crazy with the URL to get the information about a particular\
    \ plugin on hapi-plugins.com and request something like:\n\n```\nhttp://localhost:8080/plugins/blipp?hello=hi\n\
    ```"
  - "[PAGE 46]\n\n# The request\n\nIf we log the output with `console.log(request.query)`\
    \ then the result we'll\nprint to the console would show as:\n\n```\n{ hello:\
    \ 'hi' }\n```\n\nIt's worth noting that the value can be an array. hapi handles\
    \ multiple query\nkeys automatically for you, but you do have to be aware that\
    \ the result can be a different\ntype expected.\nIf the URL looks like the following:\n\
    \n```\nhttp://localhost:8080/plugins/blipp?hello=hi&hello=hey\n```\n\nWe will\
    \ see the value as an array:\n\n```\n{ hello: ['hi', 'hey'] }\n```\n\n# payload\n\
    \nrequest.payload contains information that has been transmitted as part of the\
    \ request\nthat's not suitable as a query. This may be a file, or a blob of JSON\
    \ or XML. While it's certaintainly possible to send payload for all of the request\
    \ methods (GET, POST, DELETE, PUT,\nPATCH, etc), it's typically not used for GET.\
    \ If you do end up sending payload for GET,\nYou should probably rethink your\
    \ design.\nLet's start with a simple example for a handler where we'll utilize\
    \ the POST method\nof creating a new user.\n\n```\nhandler: function (request,\
    \ reply) {\n  console.log('name: ' + request.payload.name);\n  console.log('email:\
    \ ' + request.payload.email);\n  return reply('success');\n}\n```\n\nIf you recall\
    \ when we talked about `params` earlier and the GET method, we wanted to\ncontrast\
    \ this with `payload`. For the handler above, we set up a route as below.\n\n\
    ```\nserver.route({\n  method: 'POST',\n  path: '/user',\n  config: {\n    handler:\
    \ handler\n  }\n});\n```"
  - '[PAGE 47]


    Here you can see the method is POST. In the handler we defined previously, you
    can refer to your payload request.payload. In this case the payload has two keys,
    name and email. We send aPOST to the user'' path. Once this server was up, in
    curl we could do something like:


    ```

    curl -XPOST -H "Content-Type: application/json" -d ''{ "name": "Author Name",
    "email": "author@hapi-plugins.com" }'' https://nhapi-plugins.com/user

    ```


    We could also put PUT and it would work the same way.


    # headers


    request.headers is where all of the request headers are stored. Using our previous
    curl, we would see that in your handler, you could refer to request.headers.Content-Type
    and that value would be application/json.


    # The reply


    The reply function in the handler serves as a callback and as a way to return
    control to the framework. The reply function is in charge of replying back to
    the request to give the result of whatever it is that it has been requested.


    Reply takes two arguments in order to comply with the regular callback convention
    where both are an err, and result is passed back. In practice only one of the
    two will be used. If the first argument is an error object, this will be wrapped
    in a Boom object. The argument type of reply can be a wide range of different
    types:


    +   * null

    * undefined

    * string

    * number

    * boolean

    * Buffer object

    * Error object

    * Stream object (Stream objects must be compatible with the "streams2" API and
    not be in objectMode)

    * Promise object (hapi''s testing uses the bluebird lib)

    * any other object or array'
  - "[PAGE 48]\n\n# Organizing handlers\n\nThere are many ways to organize code. For\
    \ simple routes, perhaps it makes sense to throw everything in a route. Here is\
    \ the simplest example:\n\n```\nserver.route({\n  method: 'GET',\n  path: '/',\n\
    \  handler: function (request, reply) {\n\n    reply.view('index');\n\n  }\n});\n\
    ```\n\nHowever, when working on large projects, we have found that the use of\
    \ route configuration can get cluttered to do this way. This is where we use it\
    \ (see Chapter 3) to make life easier for us.\n\nWe have organized the code into\
    \ lib/routes.js, which is our destination for all of our routes. Whenever we add\
    \ a new route, or to see the routes, we have all in one simple location. It's\
    \ a nice convention to follow. It doesn't have to be a routes.js file, since we\
    \ could also put them in lib/index.js. This clearly named file, however, makes\
    \ it obvious to everyone where it is.\n\nA typical setup could have the config\
    \ for the route living in a completely different file instead, and in that file\
    \ is where the handler resides.\nOurhapi-plugins.com example, has only this in\
    \ the routes file:\n\n```\nserver.route({\n  method: 'GET',\n  path: '/',\n  config:\
    \ Controllers.Home.get\n},\n// ...\n});\n```\n\nWhen architected correctly and\
    \ the handlers are large, putting each route in its own file can really make the\
    \ code easier to read. When starting a new route, a file with conventions can\
    \ simply be copied over and the handler itself modified. It makes for a very clear\
    \ and easy to read structure.\n\nMore discussion on the above example can be found\
    \ in Chapter 6 if you want more details."
  - '[PAGE 49]


    # Built-in handlers


    File


    File handlers are used to generate static endpoints for serving files. You are
    likely to use this with single files that don''t fit in the directory handler
    explained shortly.


    We are using the file handler to serve up the favicon, or the little specific
    icon that browsers use to associate a website.


    We add the favicon to our lib/routes.js file as follows:


    ```

    {\method: ''GET'',

    path: ''/favicon.ico'',

    handler: Controllers.Static.favicon

    }

    ```


    There are multiple ways of using the file handler, all of which involve modifying
    lib/controllers/handlers/static.js in our particular setup.


    # STRING


    This is how we''re using the handler for hapi-plugins.com and is the most straight-forward
    approach.


    ```

    exports.favicon = {

    file: __dirname + ''../../public/favicon.ico''

    }

    ```


    # CALLBACK


    A callback takes the request object as an argument that returns the absolute or
    relative path.


    ```

    exports.favicon = {

    file: function (request) {

    return __dirname + ''../../public/favicon.ico''

    }

    }

    ```


    # OBJECT


    An object with several options.'
  - "[PAGE 50]\n\n```\nexports.favicon = {\n  file: {\n    // a path string or function\
    \ as described above\n    path: __dirname + '../public/favicon.ico',\n    filename:\
    \ '??',\n    mode: false,\n    lookupCompressed: false\n  }\n};\n\n```\n\nOur\
    \ path indicates where to find the file to serve up. This can also be set to the\
    \ callback function as discussed above.\n\nThe filename is an optional filename\
    \ to specify if spending a \"Content-Disposition\" header. This defaults to the\
    \ basename of the path.\n\nMode specifies whether or not the \"Content-Disposition\"\
    \ will be included. By default this is set to false, which means it's not included.\n\
    \nlookupCompressed, if true, looks for the same filename with the '.gz' suffix\
    \ for a pre-compressed version of the file to serve if the request supports content\
    \ encoding. It defaults to false.\n\n# DIRECTORY\n\nA more likely use-case than\
    \ the file handler is the directory to serve up multiple files. It is common in\
    \ order to serve files as images, CSS or JavaScript files used for the front-end.\n\
    \nSimilar to our file handler, the route is set up in lib/routes.js and in this\
    \ case, we're doing both images and CSS as follows:\n\n```\n{ method: 'GET', path:\
    \ '/css/{path}', handler: Controllers-Static.css },\n{ method: 'GET', path: '/img/{path}',\
    \ handler: Controllers-Static.img },\n{ method: 'GET', path: '/js/{path}', handler:\
    \ Controllers-Static.js },\n// ...\n\n```\n\nThe handler is defined in a way that's\
    \ so similar that we're only going to look at the first one as an example:\n\n\
    ```\nexports.css = {\n  directory: {\n    path: __dirname + '../public/css',\n\
    \    index: false\n  }\n};\n\n```"
- md: "\n## CHAPTER 4: The handler\n\nThe path is where the actual data is we'd like\
    \ to retrieve and display. There’s a number of options that can be set here as\
    \ well.\n\nWe're first and foremost setting index to false. There shouldn't be\
    \ any need to serve up any index.html in a CSS folder.\n\nThe options for directory\
    \ are as follows:\n\n- path - See handler for an explanation of the various ways\
    \ of setting this.\n- index - Can be true, false, or a string representing the\
    \ name of the index file to look for. The default file is index.html and it is\
    \ set to true.\n- listing - Determines whether a directory listing should show\
    \ in the absence of an index file. Defaults to false.\n- showHidden - Determines\
    \ if even hidden files should be displayed in the listing. Defaults to false.\n\
    - redirectToSlash - if there's a trailing slash, this will be redirected to the\
    \ path without the slash.\n- lookupCompressed - If true, it looks for the same\
    \ filename with '.gz' suffix for a pre-compressed version of the file to serve\
    \ if the request supports content encoding. Defaults to false.\n- defaultExtension\
    \ - A string that is appended to file requests if the requested file is not found.\
    \ Defaults to empty string.\n\n## VIEWS HANDLER\n\nThe views handler displays\
    \ information using templates. In practice, this option isn't very commonly used.\
    \ The more common approach is configuring the server with the views option, and\
    \ then using the regular handler with reply.views().\n\nBecause hapi supports\
    \ both, we'll take a look at the views handler, and focus more on how to configure\
    \ the server to directly support views with reply.views().\n\nFor our hapi-plugins\
    \ project, we're not using a views handler, but it should be mentioned how for\
    \ whatever reason, the regular server.views needs to be overridden.\n\nIn both\
    \ cases, the server is configured with a views manager.\n\n```\nplugin.views({\n\
    \  engines: {\n    html: {\n      module: require('handlebars')\n    }\n  },\n\
    \  path: __dirname + '/views'\n});\n```\n\nWe're setting the rendering engine\
    \ and specifying the relative path from which we will be reading the templates.\
    \ The property in the engines configuration sets the file extension that will\
    \ be used for that particular rendering engine.\nA very basic use-case would look\
    \ like the following:\n\n```\nexports.terms_of_service = {\n  view: 'terms_of_service'\n\
    }\n```\n\nHere just takes a string with the template filename.\nWhere we'd want\
    \ to override the server's views configuration, it would be more elaborate-with\
    \ the view you take an object:\n\n```\nexports.terms_of_service = {\n  view: {\n\
    \    template: 'terms_of_service',\n    context: {\n      serviceType: 'provider'\n\
    \    }\n  }\n}\n```\n\nFor a quick point of clarity, context is the json object\
    \ with the actual data that is sent to your template. In your template terms_of_service\
    \ you can refer to service in your template and it will fill the value provider.\
    \ More discussion on templating is in Chapter 9, and depending on the templating\
    \ engine, this syntax will differ.\n\nIf there's no context passed to the object,\
    \ then it's set to a context object with the following properties:\n\n- payload\
    \ - containing request.payload\n- params - containing request.params\n- query\
    \ - containing request.query\n- pre - containing request.pre\n\nThe view object\
    \ can also contain an options property, which can serve to override the server\
    \ view settings.\n\n## REGULAR HANDLER USING SERVER.VIEWS\n\nreply.view() is the\
    \ most common way to render a template file.\nFor the main page of hapi-plugins,\
    \ we're rendering just an index file and we're displaying a random quote on the\
    \ page.\n\n```\nmodule.exports.get = {\n  handler: function (request, reply) {\n\
    \    reply.view('index', {\n      finalmsg: internals.quotes[Math.floor(Math.random()*internals.quotes.length)]\n\
    \    });\n  }\n};\n```\n\nAnd in the template we see the following:\n\n```\n<div\
    \ id=\"finalfrontier\" class=\"col-md-12\">\n  {{finalmsg}}\n</div>\n```\n\nIf\
    \ you would like to know more about handlebars, you can read more at: handle-bars.com.\n\
    \n## proxy\n\nMany starting out with a proxy can be an easy way to start in a\
    \ project. You have some legacy service that you want to replace, and a proxy\
    \ can be a good way to start. In fact, the proxy feature was the most heavily\
    \ used feature of hapi. This is precisely we started to use hapi at WalmartLabs.\
    \ Below is an example of how you could proxy Google.\n\n```\nserver.route({\n\
    \  method: '*',\n  path: '/(path)*',\n  config: {\n    handler: {\n      proxy:\
    \ {\n        host: 'google.com',\n        port: 80,\n        protocol: 'http',\n\
    \        // 6th redirect get a 300 response\n        redirects: 5,\n        passThrough:\
    \ true,\n        xforward: true\n      }\n    }\n  }\n});\n```\n\nWe use a * wildcard\
    \ for the method. This will match any method that comes in. The path setting simply\
    \ says to route everything. Finally, in the config section under handler, we have\
    \ our proxy. You can see we are setting the proxy up for google.com. The redirects\
    \ setting says that we should only redirect five times as a max. The passThrough\
    \ setting specifies whether or not preserve headers on the original request. Finally,\
    \ the xforward setting tells hapi to add (or append) an 'x-forwarded-for' header\
    \ to the request.\n\nYou can do other powerful things with the proxy handler.\
    \ You can rewrite the request using mapUri, pass local-state from the hapi instance\
    \ using localStatePass-Through, reject unauthorized requests with rejectUnauthorized,\
    \ and you can even use a custom function with onResponse to whatever you want.\
    \ Refer to the documentation for more details.\n\nInstead of proxying Google,\
    \ you can proxy your own service here. Proxying is an easy way to get started\
    \ with something simple. As time permits, you can add routes to your application\
    \ to take over that downstream functionality. This approach leads to easier troubleshooting\
    \ due to the smaller change sets.\n\n## Adding common methods to the handler\n\
    \nSometimes there are functions that will need to be accessed multiple times.\
    \ When that's the case, we can use convenience functions. One way of accessing\
    \ these is to put all functions in a common library and draw on.\nhapi, however,\
    \ has a few other solutions up its sleeve to make this process easier.\n\n## Binding\
    \ to server\n\nThrough a binding in the global context, any variable or function\
    \ can be made available on the handler function. This can be useful if you need\
    \ shared functionality.\nThe context can be set in a plugin or in the server level.\
    \ We typically use this for some service that we don't want initialized each time,\
    \ as opposed to something that initialized for the duration of the app.\n\n```\n\
    server.bind(\n  service: new Service()\n));\n```\n\nThis function will be accessible\
    \ from any of the handlers as simply this.service().This can serve as a useful\
    \ shortcut.\n\nFor more information on binding see hapis.com/api#serverbind\n\n\
    ## Decorating the reply\n\nSimilar to server.bind this function itself to use\
    \ reply. Decorate is more narrow in the scope that it can be used, but it's perfect\
    \ for canned replies.\n\n```\nserver.decorate('reply', 'success', function ()\
    \ {\n  return this.response({ success: true });\n});\n```\n\nWe have an option\
    \ to decorate the reply object or the server object and the first argument where\
    \ we specify which one. The second argument specifies the name of the method and\
    \ the third argument is the callback. in our handler, we can simply call:\n\n\
    ```\nreply.success();\n```\n\nThis is a very nice shortcut and saves from changing\
    \ in multiple places if the JSON object changes. It's also a nice means to make\
    \ sure the replies for success are consistent because it eliminates typos.\nYou\
    \ can find more about decorating the server object in Chapter 2.\n\n## Tails\n\
    \nCertain actions do not require immediate completion. The type of calls may be\
    \ a background job of some sort, which is not necessary for the return of the\
    \ page served to the client. It may be a database call for some update, or it\
    \ may be any number of things. While not necessary to capture this, we are still\
    \ likely to capture this for logging purposes. When the tails are captured for\
    \ the request, the server emits a tail event.\n\n```\nserver.route({\n  method:\
    \ 'GET',\n  path: '/',\n  handler: function (request, reply) {\n    var publishTail\
    \ = request.tail('publish the book in the background for download');\n\n    HapiBook.publishForDownload({format:\
    \ 'pdf'}, function (downloadUri) {\n      var mail = Mail({to: user});\n     \
    \ mail.publishNotification(downloadUri, function () {\n        publishTail();\n\
    \      });\n    });\n  }\n});\n```\n"
  mdcn: "\n\n## 第 4 章：处理器 (handler)\n\npath 是我们想要检索并显示的实际数据所在的位置。这里还可以设置许多选项。\n\n\
    我们首先将 `index` 设置为 `false`。我们没有必要在 CSS 文件夹中提供任何 `index.html`。\n\n`directory` 的选项如下：\n\
    \n- path - 查看 handler 以获取设置此项各种方式的说明。\n- index - 可以是 `true`、`false` 或表示要查找的索引文件名的字符串。默认文件是\
    \ `index.html` 且被设置为 `true`。\n- listing - 决定在缺少索引文件的情况下是否显示目录列表。默认值为 `false`。\n\
    - showHidden - 决定在列表中是否也显示隐藏文件。默认值为 `false`。\n- redirectToSlash - 如果路径末尾有斜杠，则将将其重定向到不带斜杠的路径。\n\
    - lookupCompressed - 如果为 `true`，则如果请求支持内容编码，它将查找带有 `.gz` 后缀的相同文件名，以寻找预压缩的文件版本进行服务。默认值为\
    \ `false`。\n- defaultExtension - 如果未找到请求的文件，则会在文件请求后追加的字符串。默认值空字符串。\n\n## 视图处理器\
    \ (VIEWS HANDLER)\n\n视图处理器使用模板显示信息。在实践中，此选项并不常用。更常见的方法是使用 `views` 选项配置服务器，然后使用常规处理器并配合\
    \ `reply.views()` 使用。\n\n由于 hapi 支持这两种方式，我们将查看视图处理器，并更多关注如何配置服务器以直接通过 `reply.views()`\
    \ 支持视图。\n\n对于我们的 `hapi-plugins` 项目，我们没有使用视图处理器，但应该提到由于某种原因，如何覆盖常规的 `server.views`。\n\
    \n在这两种情况下，服务器都通过一个 `views` 调度器进行配置。\n\n```\nplugin.views({\n  engines: {\n   \
    \ html: {\n      module: require('handlebars')\n    }\n  },\n  path: __dirname\
    \ + '/views'\n});\n```\n\n我们正在设置渲染引擎，并指定从哪里读取模板的相对路径。`engines` 配置中的属性设置了用于特定渲染引擎的文件扩展名。\n\
    一个非常基础的用例如下：\n\n```\nexports.terms_of_service = {\n  view: 'terms_of_service'\n\
    }\n```\n\n这里直接接收一个模板文件名的字符串。\n在我们想要覆盖服务器的 `views` 配置时，情况会更复杂——你传入的是一个对象：\n\n```\n\
    exports.terms_of_service = {\n  view: {\n    template: 'terms_of_service',\n \
    \   context: {\n      serviceType: 'provider'\n    }\n  }\n}\n```\n\n为了方便说明，`context`\
    \ 是包含发送到你的模板的实际数据的 JSON 对象。在你的模板 `terms_of_service` 中，你可以在模板中引用 `service`，它将填充\
    \ `provider` 的值。关于模板的更多讨论在第 9 章，取决于模板引擎的不同，这种语法会有所不同。\n\n如果没有向对象传递 context，则它被设置为一个包含以下属性的\
    \ context 对象：\n\n- payload - 包含 `request.payload`\n- params - 包含 `request.params`\n\
    - query - 包含 `request.query`\n- pre - 包含 `request.pre`\n\n视图对象还可以包含一个 `options`\
    \ 属性，用于覆盖服务器的视图设置。\n\n## 使用 SERVER.VIEWS 的常规处理器\n\n`reply.view()` 是渲染模板文件最常用的方式。\n\
    对于 `hapi-plugins` 的主页，我们只渲染一个 `index` 文件并在页面上显示一个随机引言。\n\n```\nmodule.exports.get\
    \ = {\n  handler: function (request, reply) {\n    reply.view('index', {\n   \
    \   finalmsg: internals.quotes[Math.floor(Math.random()*internals.quotes.length)]\n\
    \    });\n  }\n};\n```\n\n在模板中我们看到以下内容：\n\n```\n<div id=\"finalfrontier\" class=\"\
    col-md-12\">\n  {{finalmsg}}\n</div>\n```\n\n如果你想了解更多关于 handlebars 的信息，可以访问 handle-bars.com\
    \ 阅读更多。\n\n## 代理 (proxy)\n\n对于许多刚开始的人来说，使用代理可能是开始项目的一个简单方式。你有一些想要替换的遗留服务，而代理是一个很好的开始点。事实上，代理功能是\
    \ hapi 使用最频繁的功能。这正是在我们在 WalmartLabs 开始使用 hapi 的原因。下面是一个如何代理 Google 的示例。\n\n```\n\
    server.route({\n  method: '*',\n  path: '/(path)*',\n  config: {\n    handler:\
    \ {\n      proxy: {\n        host: 'google.com',\n        port: 80,\n        protocol:\
    \ 'http',\n        // 第6次重定向将获得 300 响应\n        redirects: 5,\n        passThrough:\
    \ true,\n        xforward: true\n      }\n    }\n  }\n});\n```\n\n我们对方法使用了*通配符*。这将匹配任何进入的方法。`path`\
    \ 设置只是简单地表示路由所有内容。最后，在 `config` 部分的 `handler` 下，我们有了代理。你可以看到我们正在为 google.com 设置代理。`redirects`\
    \ 设置表示我们最多只重定向五次。`passThrough` 设置指定了是否保留原始请求的标头。最后，`xforward` 设置告诉 hapi 向请求添加（或追加）`x-forwarded-for`\
    \ 标头。\n\n你可以使用代理处理器执行其他强大的操作。你可以使用 `mapUri` 重写请求，使用 `localStatePass-Through` 从\
    \ hapi 实例传递本地状态，使用 `rejectUnauthorized` 拒绝未经授权的请求，你甚至可以使用 `onResponse` 配合自定义函数执行任何你想执行的操作。更多细节请参考文档。\n\
    \n与其代理 Google，你可以在这里代理你自己的服务。代理是开始简单任务的一种容易方法。随着时间允许，你可以向应用程序中添加路由来接管该下游功能。这种方法由于更改集较小，易于调试。\n\
    \n## 在处理器中添加常用方法\n\n有时某些函数需要被多次访问。在这种情况下，我们可以使用便利函数。访问这些函数的一种方法是将所有函数放在一个公共库中并调用。\n\
    然而，hapi 还有其他解决方案来让这个过程变得更容易。\n\n## 绑定到服务器 (Binding to server)\n\n通过在全局上下文中绑定，任何变量或函数都可以在处理器函数中可用。如果你需要共享功能，这将非常有用。\n\
    context 可以在插件中设置或服务器级别设置。我们通常将其用于不需要每次都初始化的服务，而不是在应用程序运行期间初始化的。\n\n```\nserver.bind({\n\
    \  service: new Service()\n});\n```\n\n你可以简单地从任何处理器中访问 `this.service()`。这可以作为一个实用的快捷方式。\n\
    \n关于绑定的更多信息，请访问 hapis.com/api#serverbind\n\n## 装饰响应 (Decorating the reply)\n\n\
    类似于 `server.bind`，此函数本身用于使用 `reply`。`server.decorate` 的范围更窄，但它非常适合预定义响应（canned\
    \ replies）。\n\n```\nserver.decorate('reply', 'success', function () {\n  return\
    \ this.response({ success: true });\n});\n```\n\n我们有一个选项来装饰 reply 对象或服务器对象，第一个参数指定装饰哪一个。第二个参数指定方法的名称，第三个参数是回调。在我们的处理器中，我们可以简单调用：\n\
    \n```\nreply.success();\n```\n\n这是一个非常好的快捷方式，如果 JSON 对象发生变化，可以避免修改多个处。它也是确保成功响应一致的一种良好方法，因为它消除了拼写错误。\n\
    你可以在第 2 章找到更多关于装饰服务器对象的信息。\n\n## Tails (尾任务)\n\n某些操作不需要立即完成。调用的类型可能是某种后台作业，这对于返回给客户端的页面来说是不必要的。它可能是为了更新的数据库调用，也可能是任何事情。虽然没有必要捕获这些，但我们仍然可能为了日志记录捕获它们。当请求捕获\
    \ tails 时，服务器会发出一个 tail 事件。\n\n```\nserver.route({\n  method: 'GET',\n  path:\
    \ '/',\n  handler: function (request, reply) {\n    var publishTail = request.tail('publish\
    \ the book in the background for download');\n\n    HapiBook.publishForDownload({format:\
    \ 'pdf'}, function (downloadUri) {\n      var mail = Mail({to: user});\n     \
    \ mail.publishNotification(downloadUri, function () {\n        publishTail();\n\
    \      });\n    });\n  }\n});\n```\n"
