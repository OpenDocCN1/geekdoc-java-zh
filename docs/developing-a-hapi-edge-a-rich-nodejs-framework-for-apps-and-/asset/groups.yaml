    \    },\n    {\n      port: 8088,\n      labels: ['api']\n    }\n  ]\n```\n\n\
    ```javascript\n  plugins: [{\n  bell: [['select': 'http']],\n  blip: [[]],\n \
    \ 'hapi-auth-cookie': [['select': 'http']],\n  './authentication': [['select':\
    \ 'http']],\n  './controllers': [['select': ['http', 'api']]],\n  './models':\
