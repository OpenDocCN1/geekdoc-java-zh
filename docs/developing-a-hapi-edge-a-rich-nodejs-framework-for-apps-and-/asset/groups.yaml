    \ 15 Jun 29 2013 pwait -> ../bin/pwait\nlrwxrxr-x 1 root root 14 Jun 29 2013 pdwx\
    \ -> ../bin/pdwx\n```\n\nOf the above process tools, the pmap and pfiles are especially\
    \ useful, pmap displays the memory map of the core file, including how much is\
    \ occupied by the heap and buffers. pfiles is able to report on file descriptors\
    \ by the process that created the core file. This can be useful for identifying\
    \ where a ulimit isn't high enough. Sometimes, using pfiles can help find situations\
    \ where files aren't being closed correctly or are left open. pflags is able to\
    \ report on the original command that started the process.\n\n# Summary\n\nIn\
    \ this chapter we looked at different tooling to debug processes. These include\
    \ specialty tools that were generated for the sole purpose of helping to identify\
    \ issues in halt servers. Using good for logging or tv for local debugging can\
    \ be helpful. For production issues, using core files or a REPL can also be useful.\
    \ For any issue that you find that in halt itself, be sure to fix an issue in\
    \ the halt github repo.\n\n# Security 12\n\nIn Chapter 11, we learned about the\
    \ various ways to debug our apps. Now that our application behaves as expected,\
    \ we need to ensure it continues to behave despite any malicious actions from\
    \ hackers.\n\nSecurity is a vital part of web development. But since it may often\
    \ be complex or scary for new developers, it is not often included in typical\
    \ beginner tutorials or documentation. As such, new web applications do not normally\
    \ include any protection and become ripe targets for hackers (malicious or otherwise).\n\
    \nLarge websites are not immune by default. One of the more famous (yet more prankish\
    \ than devastating) exploits Facebook. In fact, there are some companies whose\
    \ employees may or not have accidentally harmed a competitor’s product through\
    \ XSS.\n\nBy covering your bases early, you can prevent the most common attack\
    \ vectors and give yourself peace of mind.\n\nThis chapter exposes some of the\
    \ more common problems and vulnerabilities, as well as their solutions.\n\n# Best\
    \ practices\n\nFollow along to learn about best security practices to implement\
    \ when using hapi.\n\n# Password hashing: BCrypt\n\nWhen storing login passwords\
    \ in the database, it is very bad practice to store passwords in plain text. Should\
    \ a malicious hacker gain access to the database, they can directly use those\
    \ credentials immediately to create great harm. Employees would also be able to\
    \ view or manipulate sensitive data. It is better to use a one-way hashing algorithm\
    \ to securely store passwords in a hash that can be verified using the same hashing\
    \ algorithm.\n\nHowever, there are many different one-way hashing algorithms available\
    \ and some are significantly better than others. In his famous blog post about\
    \ password schemes, Thomas Ptacek walks through the typical simple hashing systems\
    \ that naive engineers implement and how terribly bad they are. He even links\
    \ to a super cheap FPGA implementation\n\n# CHAPTER 12: Security\n\ncan break\
    \ even the most complicated MD5, DES, SHA1, and SHA256 hashes in no time\nat all.\
    \ Thomas calls it the \"game-over\" hack.\n\n# SOLUTION\n\nBCrypt was designed\
    \ specifically for hashing sensitive strings like passwords.\nThe Node.js BCrypt\
    \ implementation has been around since 2010. It has gone through\nnumerous security\
    \ and code reviews over the years (including by our own Nguyen). Node-bcrypt makes\
    \ it very easy to hash your passwords in a comparatively secure\nmethod:\n\n```\n\
    var bcrypt = require('bcrypt');\n\n// goes through 2^rounds' iterations to generate\
    \ salt\n// higher numbers require SIGNIFICANTLY more time to calculate\nvar rounds\
    \ = 12;\n\nvar salt = bcrypt.genSalt(rounds);\nvar hash = bcrypt.hashSync(\"password\"\
    , salt);\n```\n\n# XSS\n\nCross-site scripting (XSS) is one of the most common\
