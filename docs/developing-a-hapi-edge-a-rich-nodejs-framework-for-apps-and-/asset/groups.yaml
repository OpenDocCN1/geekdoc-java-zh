    \ common vulnerability where an attacker is able to insert a form on a different\
    \ but familiar website. If the victim has unused cookies, the form may as if the\
    \ victim intended.\n\n# SOLUTION\n\nThe bank website should generate a custom\
    \ identifier on form load that is required in submit. Any submitted payloads will\
    \ be rejected without this key.\n\n# SSL\n\nMany websites today run on bare HTTP\
    \ instead of the more secure HTTPS. This performs all of the data transfer between\
    \ browser to server in plain text on the network. Due to the ways networks work,\
