    \ err:', err);\n}\nserver.start();\n});\n```\n\n这是包含了所有 `require` 的整个服务器文件。这样要清晰得多。在使用\
    \ `glue` 之前，我们必须定义两个函数来将插件应用到每个连接（http 和 api）。通过 `glue`，我们可以在地方定义所有插件，并为每个插件提供一个包含对应连接的数组。`Glue`\
    \ 会根据定义自动将插件应用到正确的连接上。\n\n## Rejoice\n\n`rejoice` 是一个 CLI 工具，用于从纯 JSON 配置启动 hapi\
    \ 实例。该模块以前被拆分并存在于 hapi 自身的 `bin/hapi` 中。它非常直观。现在我们已经学习了 `glue` 组合是如何工作的，你只需要前面提到的\
