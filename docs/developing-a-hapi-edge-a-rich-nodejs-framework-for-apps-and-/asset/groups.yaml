  - '[PAGE 157]


    # CHAPTER 12: Security


    # CLICKJACKING


    Clickjacking occurs when your web page is inserted into an HTML iframe where users''
    clicks can be hijacked. If a user clicks on your home button, an attacker could
    hijack the click and redirect the user to a malicious webpage.


    Solution


    Setting the X-Frame header to ''DENY'' will prevent browsers from allowing your
    web-pages from being put inside of a frame or iframe (<iframe>).


    # X-POWERED-BY


    Most web server frameworks, by default, announce in the HTTP header "X-Powered-By"
    what framework and version was used to generate the page.


    By default, hapi does not do this. But if you publicly blog about the hapi tech
    stack, your attackers will also see that.


    Solution


    A common way to mitigate the risk of being open about your tech stack is to provide
    a middle-man proxy in you and your users. Popular choices are CloudFlare, Fastest,
    and Akamai.


    # IE OPEN WITHIN CONTEXT


    Internet Explorer 8 fixed an old vulnerability where an attacker could open a
    remote or local HTML file within the security context of your site to run malicious
    code. To read more about the issue, please read the Microsoft Blog Post.


    Solution


    Setting the ''X-Download-Options'' to ''noopen'' will prevent this issue in Internet
    Explorer 8 and up.


    # contentSecurityPolicy


    Technically, by default, browsers will allow you to embed arbitrary JavaScript
    (via script tags) from any domain. This is normally acceptable. However, it possible
    that a developer entering a typo into their code could cause the wrong file to
    load and execute malicious code.


    Alternatively, if the web application allows for users to specify their own JavaScript
    to embed on the page, managing security can quickly get out of hand.'
