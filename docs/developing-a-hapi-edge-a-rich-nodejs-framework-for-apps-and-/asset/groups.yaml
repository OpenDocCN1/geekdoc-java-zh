    # Preface


    # Why use hapi?


    "A rich framework for building applications and services hapi enables developers
    to focus on writing reusable application logic instead of spending time building
    infrastructure."

    -- hapijs.com


    hapi is a web development framework designed for the rapid development of RESTful
    services APIs using JavaScript. While it is also simple and easy to use, hapi
    also includes a lot of features out-of-the-box that typically come from third-party
    tools, features like input validation, caching, authentication, and etc.


    Developers use hapi because it is easy to use, stable, robust, well-tested (and
    battle-tested by WalmartLabs during Black Friday), and powerful. It is specifically
    designed to work well in enterprise environments where multiple teams work on
    individual or overlapping pieces that connect together. Hapi does this by enabling
    developers to focus on writing reusable, modular code without forcing them to
    do so in a very narrowly defined way.


    # What should you know prior to reading this book?


    Readers should be comfortable with JavaScript, Node.js, and the design and implementation
    of basic websites and web applications.


    # Source code/sample app


    Throughout the book, we will be referencing code from our sample application:
    hapi-plugins.com. hapi-plugins.com is a searchable repository of hapi-related
    modules available on NPM. You can view the complete source code at https://github.com/hapijs-edge/hapi-plugins.com.
    You can see the completed application at https://hapi-plugins.com.'
- md: '

    Preface


    ## What will this book teach you?


    This book will teach you how to build awesome web applications using hapi. It
    covers many aspects of how and why hapi works the way it does. You will see helpful
    and advanced features such as authentication, validation, caching, templating,
    testing, and debugging. In this book, you will also walk through the creation
    of a fully operational hapi web application.


    ## Authors


    Daniel Bretoi is a contractor @WalmartLabs where he worked on Eran Hammer''s team,
    which developed the hapi framework. He has worked in the industry for 15 years
    and various interpreted languages. In 2002 he was an early adopter of Ruby and
    generally embraced new technologies.


    ## Wyatt Preul


    Wyatt Preul is a software developer for Walmart. He is one of the core maintainers
    of the hapi node.js framework. At Walmart, Wyatt was one of the investigators
    of the infamous node.js memory leak. In addition to this, he has helped many node.js
    projects within Walmart. Apart from his day job Wyatt loves all things node, web
    security, archery, coffee roasting, and beer brewing.


    ## Van Nguyen


    Van Nguyen is a Senior Software Engineer, Full-Stack, IDEA (Big Data) at Intuit.
    He is currently hacking on JavaScript Utils for managing and visualizing Big Data.


    ## Lloyd Benson


    Lloyd Benson is a consultant at Walmart. He is also the owner of Open Infrastructure
    LLC.


    ## Technical reviewers


    We would like to thank the following technical reviewers for their early feedback
    and careful critiques: Doron Pagot, Troy Whiteley, Jeffrey Jagada, Colin Irish,
    Daniel Barnes, Michael Caputo, James Butler, Alvin Teh, Josh Mock, Michael Parks,
    Jonathan Holmlund, Glenn Jones, and Jesse Newcomer.


    ## Introduction to hapi


    ![](img/79450811086e2fc8749ec4d309ea2b79_14_0.png)


    ### History


    hapi’s origin would start at Yahoo! late in the year of 2010 on a project called
    Sled. Sled was a collaborative list-making tool written as an experiment to explore
    empowerment through restrictions by Eran Hammer. Sled was eventually written in
    node and Eran fell in love with the technology. Sled was eventually shut down
    and was generously open-sourced by Yahoo! Postmile in August of 2011. Wanting
    to continue with node, Eran left for Walmart where he took the good parts of Postmile
    and hapi was born on the 5th of August, 2011. Tasked with working on a web services
    layer, the development of hapi continued at Walmart. The original versions in
    hapi used the Express framework. However, it was eventually realized that there
    were limitations with Express for particular requirements faced at Walmart. While
    Express was great, it was missing a lot of things and hapi evolved to it’s own
    standalone framework.


    The name hapi comes from HTTP API server, and once the name was repeated, the
    connection to Ren & Stimpy was made, a cult cartoon from cartoon network. The
    “Happy Happy Joy Song” was featured in many of the early presentations of hapi.


    With the Ren and Stimpy theme in mind, other tools in the hapi.js framework started
    referencing the show in one way or another, with the ultimate goal is that coding
    should


    ## CHAPTER 1: Introduction to hapi


    fun as coders can be a bit silly when we write code even though we''re put in
    large-enterprise environments. Relax, and have a bit of fun.


    Feature-wise, hapi was designed to prevent recurring problems experienced with
    other frameworks at the time. That included problems like: middleware ordering
    problems, lack of isolation, slow matching, testability, and lack of commonly
    used built-features. Middleware ordering problems are solved by the hapi Lifecycle,
    which provides controlled, dependency-mapped hook points throughout the life of
    a request when it hits the server, or a response is returned to the user. The
    lack of isolation was solved by domains and later replaced with an even better
    system. Path matching in hapi is built for speed and flexibility. hapi code is
    testable from start to finish (and well-tested, itself!). Finally, via the hapi
    universe (https://github.com/hapi), there are dozens of official hapi plugins
    that are as robust, well-tested, and as flexible as hapi itself. This is addition
    to the hundreds of community modules available on NPM.


    Designed and built entirely in open-source, hapi has also set a very high bar
    for open projects. From the thoroughly code coverage (a process ingress in) the
    beginning thanks to Wyatt Preill, anyone using hapi and related modules can trust
    that it works reliably and behaves as expected.


    hapi has an incredibly long list of satisfied users - not least which is WalmartLabs
    itself, who has prized itself on having the Node.js deployment in the world thanks
    to Black Friday.


    There are a lot of reasons to use hapi. Try it and you will see what a pleasant
    developing web applications in Node.js can be.


    > hapi was able to handle all of Walmart mobile Black Friday traffic with about
    100 CPUs and 28Gb RAM (of we used more but they were sitting idle at 0.75% load
    most of the time). This is mind blowing traffic going through VERY little resources.
    — Er Hammer, https://github.com/hapi/hapi/issues/1326


    ## Book overview


    This book will walk you through the process of developing a basic web application
    with hapi. We will be building a searchable repository of hapi plugins. A live
    demo is available at hapi-plugins.com.


    The first seven chapters are all about creating and configuring a hapi server.
    These chapters also cover a lot more tangential information in case you need to
    build in or use a feature not found in hapi-plugins.com. The next two chapters
    (8, 9) cover how to obtain data, process it, and format it. The last three chapters
    (10, 11, 12) cover more advanced topics including some very useful industry practices.


    - 1. Introduction

    This first chapter introduces hapi, the book overview, coding style guidelines,
    and a short walkthrough of the demo application.


    - 2. Server

    This chapter focuses on the configuration of a hapi server. It also covers commonly
    used best practices, examples, and how to customize within the request lifecycle.


    - 3. Routes

    Routes map URLs to code. In this chapter, you will gain a thorough understanding
    of how to match complicated patterns.


    - 4. Handlers

    Handlers are functions responsible for receiving a request from users and returning
    a response. In this chapter, you will see all of the different ways hapi can respond
    to requests.


    - 5. Validation

    Validation (through Joi) is another amazingly helpful feature of hapi. This chapter
    illustrates how powerful validation is and how it can make developers'' lives
    easier.


    - 6. Plugins

    Plugins are middleware done "right." This chapter shows you how plugins enable
    cross-functional, remote teams to work together without causing any of problems
    typically associated with middleware.


    - 7. Authentication

    This chapter provides a thorough step-by-step walkthrough of how to enable authentication
    and set cookies.


    - 8. Models

    This chapter walks through connecting to a third-party RESTful API for your hapi
    web application. Then, it also walks through connecting to a MongoDB database
    for your hapi web application. It also showcases examples of how to operate in
    two other popular databases (Cassandra & PostgreSQL).


    - 9. Templating

    In this chapter, you will see how to separate data from presentation in the handlers
    responses.


    - 10. Testing

    Testing is often misunderstood or difficult to learn. This chapter will empower
    you to add tests to your web application, which improves robustness and code quality.


    - 11. Debugging

    This chapter walks through some of the hard-earned debugging tricks we''ve learned
    running one of the largest Node.js deployments in the world. In this chapter,
    you will learn how to inspect a running service, track statistics, trace memory
    leaks, and identify other problems.


    - 12. Security

