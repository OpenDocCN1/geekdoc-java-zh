    \      server.stop(done);\n    }\n  });\n});\n```\n\nWreck 是一个轻量级 HTTP/HTTPS 客户端封装，为\
    \ hapi 设计。在进行任何请求时，它是首选模块。尽管如此，request 模块也被完全支持。本地，inject 示例和 wreck 示例之间的测试时间差异约为\
    \ 18ms。\n\n# 代码覆盖 (Code coverage)\n\n除了 lab 包含的所有上述功能外，代码覆盖是其最强大的功能之一。lab 的代码覆盖依赖\
    \ espree 模块来生成 AST。除了典型的行覆盖外，lab 还会确定不同的代码分支是否被执行。这可以是从同一个 if 语句中的多个条件，到标准的三元运算符。此外，lab\
    \ 还会确定某些代码路径未被执行并可以删除。\n'html' 和 'console' 报告在显示覆盖方面经过了最多的测试。默认情况下，运行 lab 时不会启用代码覆盖。要启用它，你需要传递\
    \ `-c` 或 `--coverage` 标志。该标志将启用代码覆盖报告并确保测试覆盖 100% 的代码。如果覆盖率低于 100%，你可以使用 `-t`\
    \ 或 `--threshold` 标志，后跟一个代表报错前百分比的数字。如果测试未能通过阈值，lab 将带有错误码退出。\n下面是控制台报告的输出，显示了失败测试覆盖的样子：\n\
    \n```\n$ lab -c\n```\n\n"
