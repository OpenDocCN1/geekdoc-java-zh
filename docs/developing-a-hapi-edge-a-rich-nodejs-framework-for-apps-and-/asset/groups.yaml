    ```\n\n一次性吸收这一大块代码是很困难的，但它们都是相关的，所以请耐心等待，我们将解释我们想要实现的目标。第一个目标是注册我们的插件并启动服务器。我们对代码的架构使用插件将其拆分为易于管理的块，但这在这一章和随后的章节中将会变得清晰。\n\
    \n"
