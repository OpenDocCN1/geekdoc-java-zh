  - '[PAGE 44]


    # The handler 4


    The handler at its core, is what handles the incoming request for a specific route.
    It determines how the request will be “handled.” The configuration for the route
    plays a critical part in how the handler needs to behave, and since it''s tightly
    coupled, some configuration for the route needs to be taken into consideration.


    When we specify a route for a request, for example, if you''re going to download
    a file from /downloads/<filename> then it is the handler that has all of the logic
    in it finding the file in question in order to send it to the client. The handler
    may also do several things, like counting many times the file has been downloaded,
    access control making sure not just anyone has access to download the file, and
    so on.


    The handler function “handles” all of the decisions and logic between accepting
    a request from the client and returning a response to the user. has some nice
    features to offload some work automatically, such as validation. We will look
    at this in more detail in Chapter 5. All of what could be done manually in the
    handler if we ignore the convenience of (why would we dream of doing that though?)


    The handler is generally a callback function that is comprised of two arguments:
    the request and the reply. There are multiple other-built handlers in that we
    will also go over and discover.


    This chapter will cover the various different use-cases for the handler. We''re
    going to delve into the arguments of the handlers and various methods for making
    life in the handler easier for ourselves.


    # The request


    The request object contains all of the information pertaining to the incoming
    request to the server whether it is from a browser, or some other tool using the
    API. Since the routing already determines which request will be handled depending
    on the method, the request received will be limited to whatever is specified.
    At the end of the day, the full request is available here, which contains the
    headers and the request to find out all of the data content.


    Refer back to the lifecycle of the request to find out how the request travels
    through the framework.'
- md: "\n# CHAPTER 4: The handler\n\nAttached to the requests is a whole slew of important\
    \ and useful information that gets used in the handler in order to fulfill a request.\
    \ In the rest of this section we're going to take a look at how to find this data\
    \ and what you can do with it.\n\nBear in mind that there are other functions\
    \ in the request lifecycle (see Chapter 2) that can add data to the request along\
    \ the way. We're going to take a look at a few common ones.\n\n## parameters\n\
    \nSome of the request object data is set as part of direct configuration of the\
    \ route. For instance, if the route has defined a path that contains an id of\
    \ a hapi plugin to download, then that will be part of the parameters access on\
    \ the request object.\n\n```\nserver.route({\n  method: 'GET',\n  path: '/plugins/(name)',\n\
    \  config: Controllers.Plugin.get\n});\n```\n\nThe name is the identifier in our\
    \ case, and this will be accessed via request.params.name. In the above example\
    \ we have a GET method. Assuming port 8080, if we did a:\n\n```bash\ncurl -XGET\
    \ http://localhost:8080/plugins/pluginName\n```\n\nWe'd get the back what is returned\
    \ in Controllers.Plugin.get. We will be contrasting this with other methods when\
    \ we talk about payload.\n\n## query\n\nIt can be confusing for new people to\
    \ hapi, the difference between a param and a query. The query part of the URL\
    \ in https://hapi-plugins.com/search?q=pluginName is the part ?. Take a look at\
    \ the previous example for /plugins/{name} to contrast this. The name param was\
    \ strictly part of the path.\n\nThe request.query contains all of the value pairs\
    \ that are sent along a query in the URL.\n\nFor example, we could be a bit crazy\
    \ with the URL to get the information about a particular plugin on hapi-plugins.com\
    \ and request something like:\n\n```\nhttp://localhost:8080/plugins/blipp?hello=hi\n\
    ```\n\n## The request\n\nIf we log the output with `console.log(request.query)`\
    \ then the result we'll print to the console would show as:\n\n```json\n{ hello:\
    \ 'hi' }\n```\n\nIt's worth noting that the value can be an array. hapi handles\
    \ multiple query keys automatically for you, but you do have to be aware that\
    \ the result can be a different type expected.\n\nIf the URL looks like the following:\n\
    \n```\nhttp://localhost:8080/plugins/blipp?hello=hi&hello=hey\n```\n\nWe will\
    \ see the value as an array:\n\n```json\n{ hello: ['hi', 'hey'] }\n```\n\n## payload\n\
    \nrequest.payload contains information that has been transmitted as part of the\
    \ request that's not suitable as a query. This may be a file, or a blob of JSON\
    \ or XML. While it's certainly possible to send payload for all of the request\
    \ methods (GET, POST, DELETE, PUT, PATCH, etc), it's typically not used for GET.\
    \ If you do end up sending payload for GET, you should probably rethink your design.\n\
    \nLet's start with a simple example for a handler where we'll utilize the POST\
    \ method of creating a new user.\n\n```javascript\nhandler: function (request,\
    \ reply) {\n  console.log('name: ' + request.payload.name);\n  console.log('email:\
    \ ' + request.payload.email);\n  return reply('success');\n}\n```\n\nIf you recall\
    \ when we talked about `params` earlier and the GET method, we wanted to contrast\
    \ this with `payload`. For the handler above, we set up a route as below.\n\n\
    ```javascript\nserver.route({\n  method: 'POST',\n  path: '/user',\n  config:\
    \ {\n    handler: handler\n  }\n});\n```\n\nHere you can see the method is POST.\
    \ In the handler we defined previously, you can refer to your payload request.payload.\
    \ In this case the payload has two keys, name and email. We send a POST to the\
    \ user's path. Once this server was up, in curl we could do something like:\n\n\
    ```bash\ncurl -XPOST -H \"Content-Type: application/json\" -d '{ \"name\": \"\
    Author Name\", \"email\": \"author@hapi-plugins.com\" }' https://hapi-plugins.com/user\n\
    ```\n\nWe could also put PUT and it would work the same way.\n\n## headers\n\n\
    request.headers is where all of the request headers are stored. Using our previous\
    \ curl, we would see that in your handler, you could refer to request.headers.Content-Type\
    \ and that value would be application/json.\n\n## The reply\n\nThe reply function\
    \ in the handler serves as a callback and as a way to return control to the framework.\
    \ The reply function is in charge of replying back to the request to give the\
    \ result of whatever it is that it has been requested.\n\nReply takes two arguments\
    \ in order to comply with the regular callback convention where both are an err,\
    \ and result is passed back. In practice only one of the two will be used. If\
    \ the first argument is an error object, this will be wrapped in a Boom object.\
    \ The argument type of reply can be a wide range of different types:\n\n- null\n\
    - undefined\n- string\n- number\n- boolean\n- Buffer object\n- Error object\n\
    - Stream object (Stream objects must be compatible with the \"streams2\" API and\
    \ not be in objectMode)\n- Promise object (hapi's testing uses the bluebird lib)\n\
    - any other object or array\n"
  mdcn: "\n\n# 第 4 章：处理器 (handler)\n\n请求中附带了大量重要且有用的信息，这些信息会在处理器中使用以完成请求。在本节的剩余部分中，我们将查看如何查找这些数据以及你可以对它们进行什么。\n\
