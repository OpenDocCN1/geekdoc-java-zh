    lrwxrxr-x 1 root root 14 Jun 29 2013 pdwx -> ../bin/pdwx

    ```


    Of the above process tools, the pmap and pfiles are especially useful, pmap displays
    the memory map of the core file, including how much is occupied by the heap and
    buffers. pfiles is able to report on file descriptors by the process that created
    the core file. This can be useful for identifying where a ulimit isn''t high enough.
    Sometimes, using pfiles can help find situations where files aren''t being closed
    correctly or are left open. pflags is able to report on the original command that
    started the process.


    # Summary


    In this chapter we looked at different tooling to debug processes. These include
    specialty tools that were generated for the sole purpose of helping to identify
    issues in halt servers. Using good for logging or tv for local debugging can be
    helpful. For production issues, using core files or a REPL can also be useful.
    For any issue that you find that in halt itself, be sure to fix an issue in the
    halt github repo.'
