    \n`Confidence` 是另一个 CLI 工具。你可以获取一个 JSON 文件并对其应用过滤器，以便处理该文件。为每个环境管理多个文件不仅可能很麻烦，而且容易出错。当你添加了一组新文件但忘记将其添加到其他文件中时。这会导致配置漂移问题，而有了\
    \ `confidence`，你可以“确信”自己只有一个来源可以去。\n\n```json\n{\n  \"connections\": [{\n    \"\
