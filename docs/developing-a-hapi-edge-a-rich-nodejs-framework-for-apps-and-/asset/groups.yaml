  - "[PAGE 62]\n\nmade into this parameter. Our method in the server route is a POST\
    \ and this JSON object gets translated to the payload object.\n\nYou can see that\
    \ validation is done on the payload. The password passed in the payload is a string\
    \ of at least eight characters and is a required field. In addition we are telling\
    \ happy that the response is expected to be a JSON structure with a success value\
    \ of true or false.\n\nYou may be asking yourself, why is response not under the\
    \ validate section? The validate section is strictly for inputs. It is not obvious\
    \ when you first use hash with joi. Output (the response) validation can be extremely\
    \ important if you rely on another API for your work. Having output validation\
    \ gives you confidence that you are getting the right things from it.\n\nAs you've\
    \ seen in our code far we like to have everything broken up and are using the\
    \ config quite extensively. Because the validation schema can get long we often\
    \ put the validation rules in the internals variable.\n\nThe internals variable\
    \ is the place to put all top-level variables in a file. This prevents pollution\
    \ in scope. This is especially useful in cases where we have to access the schema\
    \ in multiple places to handle the validation. The example below demonstrates\
    \ this.\n\n```\nvar internals = {\n  pluginSchema: Joi.object().keys({\n});\n\
    };\n// Get plugin data\\exports.get = {\n  description: 'get plugin data for a\
    \ specific plugin id',\n  response: {\n    schema: internals.pluginSchema\n  },\n\
    \  handler: function (request, reply) {\n    // ...\n  }\n};\n```\n\n# Validation\
    \ for hapi-plugins.com\n\nLet's take a look at the search function for hapi-plugins.com.\n\
    \n```\nmodule.exports.search = {\n  validate: {\n    query: {\n      q: Joi.string(),\n\
    \      sort: Joi.string().optional(),\n    }\n  }\n};\n```"
  - "[PAGE 63]\n\n```\nfields: Joi.string().optional()\n}\nresponse: {\n  schema:\
    \ Joi.array().includes(Joi.object()).keys({\n    name: Joi.string().required(),\n\
    \    authors: Joi.array(),\n    keywords: Joi.array(),\n    dependencies: Joi.array(),\n\
    \    dependents: Joi.array(),\n    homepage: Joi.string().allow(''),\n    version:\
    \ Joi.string(),\n    license: Joi.string(),\n    description: Joi.string(),\n\
    \  })\n}\n\n```\n\n```\nhandler: function (request, reply) {\n  var query = null;\n\
    \  var sort = null;\n  if (request.query.q) {\n    query = Xss(request.query.q);\n\
    \  }\n  if (request.query.sort) {\n    sort = Xss(request.query.sort);\n  }\n\
    \  DB.plugin.search(query, sort, function (err, results) {\n    var converted\
    \ = internals.convert(results);\n    return reply(converted);\n  });\n}\n\n```\n\
    \nYou can see that here validation is being done on query. It is expecting three\
    \ inputs to strings. One of these q, the only required input. The additional sort\
    \ fields inputs optional. However, if they are provided, they must be a valid\
    \ string. If the request to the API fails to give this, then the error for the\
    \ front-end will be very obvious and makes it easy to debug for.\n\nYou notice\
    \ that Xss is used. This is explained in more detail in Chapter 12, but helps\
    \ prevent cross scripting attacks.\n\nAnother important thing to notice with this\
    \ example, is that for homepage you can see that strings, an allow('') is added.\
    \ By default, strings aren't allowed to be empty. This may be annoying for some,\
    \ but it is better to err on the side of caution when it comes to validation."
  - '[PAGE 64]


    You will also notice that there is validation on the response. A schema is provided
    for each of these values should be. We have chosen not to separate it since it
    is small and easier to read together.


    For hapi-plugins.com, once the results are returned from the database, they are
    converted to an output format where all extraneous is removed and converted to
    only what is needed. This data is validated through this response schema, which
    is making sure each item in the array is the expected results.


    We can sleep peacefully at night.


    # Generic data validation with joi


    Not only do we use joi for validating inputs and outputs, we also use it internally
    for verifying all kinds of other data. Let''s say we''re making a call to an external
    service, or just to the database. While our data is hopefully not polluted with
    partial data that gives errors, it never hurts to be careful and validate the
    data if you''re relying on some-where, downstream.


    So we''re covering all the cases we use with our validation with hapi-plugins.com
    and there is a lot more to joi than we''ve seen so far. We''ll dedicate some more
    time here to look at what else joi has to offer.


    One property that be remembered is that joi is chainable, which means that you
    can create shortcuts for forsel.


    So imagine you are validating a specific string, maybe an email Joi.string().email()
    or something more complicated that''s a longer string. You could, for instance,
    assign email to a shorter variable:


    ```

    var email = Joi.string().email() and use this everywhere instead of the longer
    version.

    ```


    The author was working on lists: wish lists, wedding registries, baby registries,
    etc., and had to make sure a proper list type was being sent each time. This is
    the validation which:


    ```

    Joi.string().insensitive().required().valid([''BR'', ''SFL'', ''WR'', ''WL''])

    ```


    In this case we''re not caring about the case but we did care that the string
    needs to be one of the different list types. Otherwise it was invalid.


    # Using a validation function


    While joi is the heart of validation for hapi, it''s perfectly possible to do
    validation without joi. Instead of using the joi signature for the route option
    for the specific section we want validated, we instead use a validation function.'
  - "[PAGE 65]\n\nThe function accepts three arguments, value, the value to be validated,\
    \ options,\nthe server validation options, and a callback function with the signature\
    \ call-\nback(err, value)\n\n```\nvar internals = {};\n\ninternals.validationFunction\
    \ = function (value, options, next) {\n  //do something\n};\n```\n\n```\nvar routeOptions\
    \ = {\n  validate: {\n    payload: internals.validationFunction\n  }\n};\n```\n\
    \n# Summary\n\nSo far, you have gotten an overview of what data validation is,\
    \ how to use it, and how happi-\nplugins.com uses it. There is a wide variety\
    \ of data types that joi supports, and we recommend-\\mend you check out the documentation\
    \ for more details. It should be noted that joi\nhot have to be used specifically\
    \ for hapi projects. While validate is conveniently baked\ninto hapi, joi can\
    \ be used in other frameworks. Next, you will see how hapi's plugin archi-\nitecture\
    \ can enable one application to become more than just the sum of its parts."
  - '[PAGE 66]


    # Plugins 6


    Now that we understand how to validate our inputs and outputs, next we want to
    talk about how to utilize plugins in hapi to better manage our code. Releasing
    software as monolithic pieces of code is no better than writing functions that
    span thousands of lines of code. By writing software as smaller functions that
    serve a specific role, we can test the functions easier, we can debug things easier
    and it''s easier to understand the architecture. Plugins follow this model as
    hapi, but they are oriented towards functionality of the main software instead
    of being snippets of code. Plugins allow you to extend current functionality,
    yet they have the code compartmentalized to divide it and make it easier to maintain
    and test.


    The benefits of splitting code into plugins reaches beyond your own code, but
    easily allows users to share code that is beneficial to everybody. For example,
    you may have written code specific to Facebook authentication (bell) or a plugin
    to do something simple as displaying the routes on startup (blip).


    In this chapter we''re going to explore how to write a plugin and how to organize
    your code around it. In addition, we''re going to take a look at some of the more
    popular plugins that we use, and the plugins that we useded to be part of the
    code project.


    A benefit of the plugin model and having replaceable parts in hapi is that you''re
    not bound to a particular way of doing things. If there later comes along a better
    plugin than the one you''re currently using, switching it out is far easier than
    that part of the code is tightly coupled with the code you want to keep. This
    applies not just to third-party plugins but anything within your own system as
    well.


    When large companies work on plugins across multiple teams, things like caching
    can be determined on a per-plugin basis. The teams don''t have to communicate
    with each other, and even though the plugins run as part of the same server, routes
    in the different servers can be configured via the plugin to use, for example,
    different caching mechanisms that are suitable for that particular piece of code
    is doing.'
- md: "\n## Creating your own plugin\n\nNote how everything in our hapi-plugins-project\
    \ is architected to be a plugin. We have plugins for the router and we have plugins\
    \ for the models. Even authentication is a plugin.\nLet's start by taking a look\
    \ at our lib/index.js file where all of our plugins are loaded.\n\n```javascript\n\
    server.register([\n  Bell,\n  Blipp,\n  HapiAuthCookie,\n  Authentication,\n \
    \ Controllers,\n  Models,\n  Routes\n]), function (err) {\n  if (err) {\n    console.log('server.register\
    \ err:', err);\n    return callback(err);\n  }\n\n  server.start(function () {\n\
    \    console.log('server started on port:', server.info.port);\n    return callback(null,\
    \ server);\n  });\n});\n```\n\nAnyone using Async may recognize this pattern,\
    \ as it allows you to easily run many functions. We are big fans of async methods\
    \ and this pattern here is very similar. Internally, hapi uses items, which are\
    \ barebones async methods to accomplish its goals.\nThe register functions signature\
    \ is server.register(plugins, [options], callback).\nThere are a few different\
    \ ways to pass plugins, but the one we show here is how all of our projects are\
    \ organized, and we have many. The best part about the register function way of\
    \ passing plugins is that they can easily be made into their own separate npm\
    \ packages that can be loaded. They can be shared as their own repositories in\
    \ github.\n\nWhat we have found works well when there are many people working\
    \ on a bigger project is that having specific components that have some logical\
    \ divider be each in their own repo. For example, if you have a blogging system,\
    \ you could put all routes that have to deal with posts as their own plugin, and\
    \ all the routes that deal with comments as their plugin as well. Then you separate\
    \ owners for each individual piece and this tends to lead to less conflicts in\
    \ the code. This may not always work. For example, you may have tightly coupled\
    \ services. You are the expert when it comes to your own code. It is up to you\
    \ to decide what's best for your project, and hapi is flexible so you can organize\
    \ your project how you prefer.\n\nAnother separation for code could be to keep\
    \ your controllers slim and as much logic into models as possible. They can turn\
    \ in their own libraries with the code in them.\n\nWith the code separated into\
    \ smaller atomic parts, code becomes far easier. It is also easier to understand\
    \ the architecture. As an example, you may find that some of your testing setup\
    \ was easier to access between the project. You may end doing what we did, which\
    \ was creating another repo for common testing. This is a very nice approach even\
    \ when a project can also be reused across multiple projects.\nLet's take a look\
    \ at one of the pieces in detail by looking how our handlers are loaded.\n\n```javascript\n\
    var load = function (options, callback) {\n  options = options || {};\n  options.extension\
    \ = options.extension || '.js';\n  controllers = {};\n\n  var files = glob.sync('*'\
    \ + options.extension, {cwd: options.path || __dirname});\n  for (var i in files)\
    \ {\n    if (files[i] != path.basename(__filename)) {\n      var key = path.basename(files[i],\
    \ options.extension);\n      key = key.charAt(0).toUpperCase() + key.slice(1);\n\
    \n      controllers[key] = require(options.path || __dirname) + '/' + files[i];\n\
    \    }\n  }\n\n  if (callback) {\n    return callback(null, controllers);\n  }\n\
    \n  return controllers;\n};\n\nexports.register = function (plugin, options, next)\
    \ {\n  load({path: __dirname + '/handlers'}, function (err, handlers) {\n    if\
    \ (err) {\n      throw err;\n    }\n\n    if (process.env.DEV) {\n      console.log('handlers:');\n\
    \    }\n    plugin.expose('handlers', handlers);\n    next();\n  });\n};\n```\n\
    \n```javascript\nexports.register.attributes = {\n  pkg: require('./package.json')\n\
    };\n```\n\nWe begin with a convenience function called load(). The purpose of\
    \ load is to go through all the files in a given directory and require those files.\
    \ In addition, we're exposing the handlers to the server. The benefit of exposing\
    \ handlers is that they become available throughout the application.\n\n## Plugin\
    \ configuration\n\nPreviously, you may have noticed that options was not used\
    \ anywhere. However, options can be used to configure the plugin. Let's suppose\
    \ we wanted to pass some options for the blipp plugin. Recall this plugin just\
    \ lists the routes on startup. While routes don't currently support it, it's conceivable\
    \ that you wouldn't want blipp to actually print the routes in colors on startup,\
    \ so you may want to pass a flag saying to just print without ANSI colors. We\
    \ should be able to see something like the following instead of our original code:\n\
    \n```javascript\nserver.register([\n  Bell,\n  { register: Blipp, options: { colors:\
    \ false } },\n  HapiAuthCookie,\n  Authentication,\n  Controllers,\n  Models,\n\
    \  Routes\n]);\n```\n\nThe above code is for our entire server instance. The actual\
    \ blipp plugin would have a register function that would look like the following:\n\
    \n```javascript\nexports.register = function (server, options, next) {\n  if (options.color\
    \ === true) {\n    // do colors\n  } else {\n    // turn off colors\n  }\n};\n\
    ```\n\nIn our server startup, we had options set to { colors: false }. We pass\
    \ these options to the plugin, and the plugin knows to turn off the colors. We\
    \ saw options being passed back in Chapter 2. If you look in the rejoice and glue\
    \ areas, you will see how options for the plugins are being passed to the plugin.\
    \ An example of this was the opsInterval in the good plugin area.\n"
  mdcn: "\n\n## 创建你自己的插件\n\n请注意我们 hapi-plugins-project 中的所有内容是如何设计成插件架构的。我们为路由器提供了插件，也为模型提供了插件。甚至身份验证也是一个插件。\n\
    让我们先查看 `lib/index.js` 文件，所有的插件都在这里加载。\n\n```javascript\nserver.register([\n  Bell,\n\
    \  Blipp,\n  HapiAuthCookie,\n  Authentication,\n  Controllers,\n  Models,\n \
    \ Routes\n]), function (err) {\n  if (err) {\n    console.log('server.register\
    \ err:', err);\n    return callback(err);\n  }\n\n  server.start(function () {\n\
    \    console.log('server started on port:', server.info.port);\n    return callback(null,\
    \ server);\n  });\n});\n```\n\n任何使用过 Async 的人都可能熟悉这种模式，因为它允许你轻松地运行许多函数。我们是 async\
    \ 方法的实粉丝，这里的模式非常相似。在内部，hapi 使用 `items`（即基础的 async 方法）来实现其目标。\n`register` 函数的签名是\
    \ `server.register(plugins, [options], callback)`。\n传递插件有几种不同的方法，我们在这里展示的是我们所有项目的组织方式，而且我们有很多这样的项目。通过\
    \ `register` 函数传递插件的最好处是，它们可以轻松地转换为独立的 npm 包并进行加载。它们也可以作为独立的 GitHub 仓库进行共享。\n\n\
    我们发现，当许多人协作一个大项目时，将具有某些逻辑分段的特定组件放在各自的仓库中效果很好。例如，如果你有一个博客系统，你可以将所有处理文章的路由放在一个插件中，将所有处理评论的路由放在另一个插件中。这样你就可以为每个部分分配独立的所有者，这通常会减少代码冲突。这并不总是有效的。例如，你可能有紧密耦合的服务。在处理自己的代码时，你是专家。决定什么对你的项目最好取决于你，而\
    \ hapi 是灵活的，因此你可以按照自己喜欢的方式来组织项目。\n\n另一种代码分离的方法是保持控制器轻量，并将尽可能多的逻辑放入模型中。它们可以变成包含代码的独立库。\n\
    \n当代码被拆分成更小的原子部分后，代码变得容易维护得多。理解架构也变得更容易了。例如，你可能会发现某些测试设置在项目之间更容易访问。你可能会像我们所做的那样，为通用测试创建一个另一个仓库。即使一个项目可以在多个项目之间复用，这仍然是一个非常棒的方法。让我们通过查看处理程序是如何加载的，详细研究其中一个部分。\n\
    \n```javascript\nvar load = function (options, callback) {\n  options = options\
    \ || {};\n  options.extension = options.extension || '.js';\n  controllers = {};\n\
    \n  var files = glob.sync('*' + options.extension, {cwd: options.path || __dirname});\n\
    \  for (var i in files) {\n    if (files[i] != path.basename(__filename)) {\n\
    \      var key = path.basename(files[i], options.extension);\n      key = key.charAt(0).toUpperCase()\
    \ + key.slice(1);\n\n      controllers[key] = require(options.path || __dirname)\
    \ + '/' + files[i];\n    }\n  }\n\n  if (callback) {\n    return callback(null,\
    \ controllers);\n  }\n\n  return controllers;\n};\n\nexports.register = function\
    \ (plugin, options, next) {\n  load({path: __dirname + '/handlers'}, function\
    \ (err, handlers) {\n    if (err) {\n      throw err;\n    }\n\n    if (process.env.DEV)\
    \ {\n      console.log('handlers:');\n    }\n    plugin.expose('handlers', handlers);\n\
    \    next();\n  });\n};\n```\n\n```javascript\nexports.register.attributes = {\n\
    \  pkg: require('./package.json')\n};\n```\n\n我们从一个名为 `load()` 的便利函数开始。`load`\
    \ 的目的是遍历给定目录中的所有文件并引入这些文件。此外，我们将处理器暴露给服务器。暴露处理器的处是它们在整个应用程序中可用。\n\n## 插件配置\n\n\
    之前，你可能注意到 `options` 没有在任何地方使用。然而，可以使用 `options` 来配置插件。假设我们想为 blipp 插件传递一些选项。记得这个插件只是在启动时列出路由。虽然路由目前不支持它，但可以想象你可能并不希望\
