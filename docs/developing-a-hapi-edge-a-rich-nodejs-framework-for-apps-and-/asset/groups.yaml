  mdcn: "\n我们在风格方面对准则执行近乎严苛的标准。风格本应该是编程中最易于遵循的简单概念之一，但我们发现许多人做得很粗率。如果你连这些简单的事情都做不好，说明你没有关注自己在做什么。因此，我们形成了这样一个理念：代码离风格越远，在代码审查期间对代码的审查就越需要仔细。\n\
