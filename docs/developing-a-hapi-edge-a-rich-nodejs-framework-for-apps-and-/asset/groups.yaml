- md: "\nIn the above schema, we have defined all of the relevant fields in each document\
    \ and some data type requirements. In some cases, there are also fallback defaults\
    \ in case we do not provide a value for these fields on creation.\n\nMongoDB will\
    \ let us find items quickly on fields that are indexed. If we end up searching\
    \ something that is not indexed, MongoDB must search through the entire list of\
    \ documents. Since we must be able to query across different fields, we have to\
    \ use indexes.\n\n```javascript\n// ...\n\ninternals.plugin.index({\n  name: 1,\n\
    \  description: 1,\n  authors: 1,\n  keywords: 1\n});\n```\n\nNow for users, we\
    \ know they should have a username, possibly a display name, an address, create/update\
    \ timestamps and a list of likes. Since we're using MongoDB, data should be denormalized\
    \ (meaning they should be grouped instead of split into separate tables). The\
    \ plugin \"Likes\" makes sense to be associated with Users using abstraction;\
    \ each has a list of likes.\n\n```javascript\nvar internals = {};\n\ninternals.user\
    \ = new Mongoose.Schema({\n  'username': { type: String, required: false },\n\
    \  'name': { type: String, required: false },\n  'email': { type: String, required:\
    \ false },\n  'updated_at': { type: Date, default: Date.now },\n  'created_at':\
    \ { type: Date, default: Date.now },\n  'likes': [internals.plugin]\n});\n\nvar\
    \ user = Mongoose.model('user', internals.user);\n```\n\n## SEARCHING PLUGINS\n\
    \nThe most crucial part of the hapi-plugins.com application is the ability for\
    \ users to search for plugins. We want the search to be flexible. The visitor\
    \ may want to search for a plugin by name if they know it. They may only know\
    \ what a plugin \"needs\" to do and can search for a keyword or word that may\
    \ be in the description. Finally, visitors who may know who created the plugin,\
    \ and they can search for all plugins made by that author.\n\nThe logic for accommodating\
    \ this is a little complicated. It involves generating a MongoDB query that simultaneously\
    \ queries strings across all of the relevant fields. In the example, it is generating\
    \ a MongoDB query object matching our criteria and executing it.\n\n```javascript\n\
    internals.plugin.statics.search = function (queryString, sortString, callback)\
    \ {\n  var query = {};\n  if (queryString && queryString.length > 0) {\n    var\
    \ pattern = new RegExp(queryString, 'ig');\n    query = {\n      '$sort': [\n\
    \        'name': pattern,\n        'description': pattern,\n        'author':\
    \ pattern,\n        'authors': {\n          '$regex': pattern\n        },\n  \
    \      'keywords': {\n          '$regex': pattern\n        }\n      ]\n    };\n\
    \  }\n  var sortOrder = 1;\n  var sortBy = sortString || 'name';\n  if (sortBy[0]\
    \ === '-') {\n    sortOrder = -1;\n    sortBy = sortBy.slice(1);\n  }\n  var sort\
    \ = {};\n  sort[sortBy] = sortOrder;\n  return this.find(query).sort(sort).exec(callback);\n\
    };\n```\n\nThere is a lot going on in the search function above. The first function\
    \ accepts two important arguments: a callback where the results will be sent.\n\
    \nThe first is the query made by the user. We take the query and match it with\
    \ all the relevant fields: name, descriptions, author, authors, and keywords.\n\
    \nThe second argument determines sort order. When we grab results from database,\
    \ it has to know what to return (ascending or descending and by what field). We\
    \ are using the convention of \"-name\" to mean descending by name and a minus\
    \ sign, \"-\", to mean ascending. If sortString is null, we default to name ascending.\n\
    \nWe take these two arguments and execute a find query in the database.\n\nNow,\
    \ back in the controllers, we define a search handler to use our new database\
    \ search method. In this handler, we will also validate and sanitize the inputs\
    \ to make sure no invalid or malicious inputs are entered.\n\n```javascript\n\
    module.exports.search = {\n  validate: {\n    query: {\n      q: Joi.string(),\n\
    \      sort: Joi.string().optional(),\n      fields: Joi.string().optional()\n\
    \    },\n    handler: function (request, reply) {\n      var query = null;\n \
    \     var sort = null;\n      if (request.query) {\n        query = Xss(request.query.q);\n\
    \      }\n      if (request.query.sort) {\n        sort = Xss(request.query.sort);\n\
    \      }\n      DB.plugin.search(query, sort, function (err, results) {\n    \
    \    if (err) {\n          return reply({status:-1, error: err}).code(500);\n\
    \        }\n        return reply(JSON.stringify(results, null, 2));\n      });\n\
    \    }\n  }\n};\n```\n\nIn the search handler, we set validation rules on the\
    \ query parameters like we have shown in Chapter 5 Validation. A new convention\
    \ shown above involves the Xss module. This module sanitizes the inputs by escaping\
    \ HTML entities and other malicious tricks. You will learn more about this later\
    \ in Chapter 12 Security.\n\nAfter the inputs have been validated and sanitized,\
    \ we pass this to the model's search function. Inside the callback, if an error\
    \ is returned, we return a nice JSON error message. But if it is successful, we\
    \ return a pretty JSON response.\n\nAnd that is how we enable users to search\
    \ through our plugin repository. But there is nothing in there yet!\n\n## ADDING\
    \ PLUGINS\n\nIn order to search plugins, we need to add entries to the database.\
    \ In the previous chapter, we saw how to obtain and store data. Now we need to\
    \ add multiple plugins.\n\n```javascript\ninternals.plugin.statics.createUpdate\
    \ = function (pluginsJS, callback) {\n  var self = this;\n  var pluginObj = pluginsJS;\n\
    \n  self.update(pluginObj, function (err, numberAffected) {\n    if (err) {\n\
    \      return callback(err);\n    }\n    return callback(null, numberAffected);\n\
    \  });\n};\n```\n\n## CHAPTER 8: Models\n\nIn the last chapter, we saw how easy\
