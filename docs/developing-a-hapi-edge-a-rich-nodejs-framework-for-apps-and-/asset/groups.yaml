    \ mmap -> ../bin/mmap\nlrwxrxr-x 1 root root 14 Jun 29 2013 prune -> ../bin/prune\n\
    lrwxrxr-x 1 root root 14 Jun 29 2013 psig -> ../bin/psig\nlrwxrxr-x 1 root root\
