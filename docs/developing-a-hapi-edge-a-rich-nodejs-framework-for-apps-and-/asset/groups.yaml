    我们希望通过阅读这本书，能帮助你开启第一个 hapi 项目。你可以使用 hapi 来实现你的梦想，构建各种有趣的 Web 应用。


    ## 附录 13


    ## 模型


    ### 历史


    可扩展的应用程序通常遵循 n 层架构，其中应用服务连接到正交数据库（这意味着它与应用服务没有没有耦合，可以独立管理，甚至可以完全替换）。


    今天，有许多数据库可供。数据库主要分为三类：


    - 关系型数据库 (RDBMS)

    - NoSQL

    - 其他


    关系型数据库是数据库领域的骨干。它们在几十年里一直运行良好，并证明了其性能特性。然而，它们确实存在学习曲线，并且并不总是适用于处理顺序数据、反规范化数据或系列高性能需求。


    NoSQL 数据库相对较新。通常，这些数据库的学习曲线非常短且具有高性能特性。然而，由于权衡，它们并不具备通常与关系型数据库相关的所有功能（如事务、原子性、数据持久性等）。


    其他数据库可能包括图结构数据库或任何不符合上述两种分类的内容。


    ## HTTP 客户端概述


    ### 历史


    当互联网仍然完全处于 Web 1.0 时，大多数网站和公司并没有提供对开发者友好的 API。从网站获取数据需要开发者爬取网站、处理 HTML 并搜索和提取数据（有时是手动的）。一些公司开始提供
    SOAP API，幸运的是，它们现在已经消亡了。


    Web 2.0 应用在 2004 年左右成为新常，它支持带有 XML 和 JSON 响应的 API。Java 强力采用了 XML。随着 JavaScript
    无处不在以及带有 AJAX 的惊人开源库（如 jQuery、Dojo、Prototype）的出现，JSON 基本上赢了。JavaScript 和 Node.js
    与 JSON 配合得非常完美。


    如今大多数 API 都支持 JSON。我们的示例展示了与 JSON 交互的代码。


    要从 HTTP API 获取数据，我们有几种选择。我们将介绍两个最流行的选项：Wreck 和 Request。


    ### WRECK


    Wreck 是 hapi 的官方模块之一，由我们自己的 Wyatt Preul 编写，他本书的共同作者之一。


    它的创建是为了应对现在臭名昭著的 4 字节内存泄漏。罪祸首之一是流行的 Request 模块所使用的底层代码片段。


    此外，Request 设计用于完成广泛的情况。Wreck 采用极简方法，仅提供最基本的功能集，以确保高性能且无内存泄漏。


    ### REQUEST


    Request 是 Node.js 中广为人知的 HTTP 请求模块。它最初由 Michael Rogers 创建，他是 Node.js 社区中非常有名的人物，但现在该项目已经有了自己的生命。它由于其简单、直观的界面获得了大量的追随者（它比以前冗长的手动创建
    HTTP socket 的方法要好得多）。


    ## 数据库客户端概述


    hapi-plugins.com 通过 Mongoose 驱动程序使用 MongoDB，因此主要示例将反映这一选择。


    然而，为了获得最大收益，本书还将展示用于 Node.js 项目中最常用的三个数据库的独立示例：MongoDB、Cassandra 和 Postgres。


    ## MongoDB


    MongoDB 是一个极度受欢迎的数据库。它是最早拥抱 NoSQL 运动以及开源开发模型的数据库之一。它在 GNU 许可证下免费提供。


    与 MySQL 或 PostgreSQL 不同，MongoDB 是一个面向文档的数据库。在 MongoDB 中，存储一个人的数据（如姓名、地址）是存储在该个人的单个文档中。这非常直观。


    MongoDB 支持简单但强大的基于 JavaScript 的查询语法，且学习曲线非常短。这使得 MongoDB 成为快速启动、黑客松以及已经熟悉 JavaScript
    的团队的流行选择。


    MongoDB 有两个缺点。可扩展性不是线性的，需要建立极其复杂的复制系统。由于数据库范围锁定，写入性能可能会成为问题，且默认设置在未验证写入时可能会导致数据丢失。


    从实际角度考虑，在编写时，使用哪种 MongoDB ORM/驱动程序的选择具有很大争议。


    一方面，Mongoose 非常受欢迎并有很多实用的功能，但在编写时，Mongoose 的 GitHub 仓库有超过 400 个报告的开放 issue（问题）和近
    2000 个关闭的 issue。有这么多 bug，它可能并不总是最佳选择。


    mongodb 驱动程序简单有效，但提供的高级功能很少；需要一些开发工作。


    ### mongodb


    mongodb 驱动程序（也称为 node-mongodb-native）是访问 MongoDB 数据库实例最流行的库。它相当准确地模拟了 MongoDB
    语法，并根据需要进行异步修改。因此，与其说它是一个 ORM，不如说是一个手动数据库驱动程序。因此，需要深入了解 MongoDB 查询语法。幸运的是，MongoDB
    语法非常简单且易于掌握。


    ### Mongoose


    Mongoose ODM 是用于 MongoDB 的高级资源映射器。由 LearnBoost（Automatic 的一部分）创建，Mongoose 提供了从纯
    MongoDB 语法的抽象，通过添加对队列操作、schema、schema 验证器、默认值、方法等的支持，尝试使使用 MongoDB 驱动程序的开发更快更简单。


    ## CASSANDRA


    Cassandra 是另一个流行的开源 NoSQL 数据库。Cassandra 不像 MongoDB 那样关注开发者的易用性，而是专注于利用数学和科学为开发者提供可扩展性和高可用性（可以从多台机器故障），同时表现出极高的性能。它还关注线性扩展，这意味着扩展系统就像向集群中添加机器一样简单。


    Cassandra 是一个列式数据库。数据库中的每条记录都可以任意数量的列。单个记录可以有不同数量的列。一个 Person 对象可以有姓名，另一个 Person
    有地址、电话号码。读取时，Person 的每一个列都会被检索。列式数据库可能没有文档数据库那么直观，但它们有很多意料之外的优势（例如擅长存储图结构）。


    Cassandra 的主要缺点是其巨大的学习曲线。上手 Cassandra 比较困难。然而，一旦正确配置，Cassandra 的功能就很难管理。


    ### Apollo


    Apollo 由 3logic 开发，是一个即将推出的 Cassandra ORM。虽然 Apollo 的开发相对较晚（2014 年中期），但它已经完全完备，并兼容
    Cassandra CQL 接口的最新破坏性更改。从技术上讲，作者在 README 中指出 Apollo 是“不完全的”，可能尚未准备好投入生产环境。然而，Apollo
    远优于其他的替代 ORM。


    ### cassandra-driver


    Cassandra-driver 是 DataStax 官方的 node.js 驱动程序。它支持所有最新功能并由活跃维护。然而，它提供的高级功能很少或没有，因此需要一些开发来创建有效的模型。


    ## POSTGRES


    PostgreSQL 是一种流行的、开源 MySQL 或 Oracle SQL RDBMS 替代品。尽管它是免费使用的，但它提供了许多商业关系型数据库的功能。


    与 MongoDB 或 Cassandra 不同，PostgreSQL 遵循关系数据模型。这要求配置数据 schema 和索引需要花费大量时间。但这意味着数据验证是在数据库端免费完成的（而不是在所有
    NoSQL 数据库的驱动程序/客户端端完成）。


    PostgreSQL 的主要缺点是学习曲线。关系数据模型可能很难快速上手，并且在索引、数据分组等方面有很多特殊之处。


    ### PG


    类似于 ''mongodb'' 驱动程序，pg` 模块（也称为 node-postgres）更像是一个驱动程序，而不是一个全功能的 ORM。


    ### Sequelize


    Sequelize 是一个全功能的 ORM，支持许多基于 SQL 的数据库，包括 MySQL、MariaDB、SQLite、MSSQL，显然还有 PostgreSQL。它支持完整的
    schema


