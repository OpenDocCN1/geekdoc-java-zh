    ## hapi-plugins.com


    ![](img/79450811086e2fc8749ec4d309ea2b79_17_0.png)


    In this book, we will walk through how to use hapi to create the backend services
    for a real (but basic) web application, hapi-plugins. hapi-plugins (hapi-plugins.com)
    is a search-repository for hapi-related modules on NPM.

    This book will NOT cover how to build the client-side JavaScript portion of the
    application. However, the complete source code is available on GitHub.


    ## Style


    We will be following hapi-style-guidelines throughout this book. To find more
    about what they are, you can see them at the hapi Style Guide.

    We may not agree with everything in the styles, but it''s worth noting that just
    having this style guide is 99 percent good. Some practices may look odd, but it
    really helps with the visualization of the code. We recommend choosing this style
    not only for projects related to hapi, but for node development in general.

