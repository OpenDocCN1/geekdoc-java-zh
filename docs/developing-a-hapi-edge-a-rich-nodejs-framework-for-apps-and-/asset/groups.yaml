- md: "\n## CHAPTER 2: Server\n\nNow that we know what we're trying to accomplish,\
    \ let's see how it's done. registerHttpPlugins and registerApiPlugins are functions\
    \ to handle registering the plugins for the two separate connections on our server.\
    \ One function can only apply plugins to one connection at a time. Therefore,\
    \ we need to distinguish these two functions because we have hapi for two connections.\n\
    \nWe're using Async.auto to complete this asynchronously, which we can get away\
    \ with because it doesn't matter in what we register plugins. If you're not familiar\
    \ with the Async library, it's a great tool, and we use it everywhere for cleaner\
    \ code. It's worth noting here and taking a break to look at the documentation\
    \ for Async to get familiar with it. We'll wait.\n\nIf there are errors, we print\
    \ the error to the console. If there are no errors, we go ahead and start the\
    \ server.\n\nNote that server.register takes an array of plugins. This behavior\
    \ is similar to [Async].series in fact, hapi is internally using a lightweight\
    \ version of Async called items. If you're not finding yourself using all of the\
    \ features of Async, then this may be a better alternative for you.\n\nAs you\
    \ can see, setting up the server can be quite an ordeal. There's a lot to keep\
    \ track of. If however, a much cleaner approach. Next up, we're going to have\
    \ a look at the glue, rejoice, and confidence modules.\n\n## Glue\n\nGlue is a\
    \ way to compose server settings. Often it's desired to have server configuration\
    \ stay out of code because it's far more predictable.\n\nWhat we have above is\
    \ a rather complicated setup. In order to make what we have easier to go, we're\
    \ going to use glue. Below is how we do that.\n\n```javascript\n// Load modules\n\
    var Glue = require('glue');\nvar Hapi = require('hapi');\n```\n\n```javascript\n\
    // Internals\nvar internals = {\n  manifest: {\n    connections: [{\n      port:\
    \ 8080,\n      labels: ['http']\n    },\n    {\n      port: 8088,\n      labels:\
    \ ['api']\n    }\n  ]\n```\n\n```javascript\n  plugins: [{\n  bell: [['select':\
    \ 'http']],\n  blip: [[]],\n  'hapi-auth-cookie': [['select': 'http']],\n  './authentication':\
    \ [['select': 'http']],\n  './controllers': [['select': ['http', 'api']]],\n \
    \ './models': [['select': ['http', 'api']]],\n  './routes': [['select': ['http']]],\n\
    \  './api': [['select': ['api']]],\n  good: {\n    opsInterval: 5000,\n    reporters:\
    \ {\n      'reporter': 'good-console',\n      'events': {'ops': '*', 'log': '*'}\n\
    \    }\n  }\n}]\n};\n```\n\nGlue.compose(internals.manifest,\n{ relativeTo: __dirname\
    \ }, function (err, server) {\n\n```javascript\nif (err) {\n  console.log('server.register\
    \ err:', err);\n}\nserver.start();\n});\n```\n\nThis is the entire server file\
    \ with all the requires included. It is much cleaner to stand and for, before\
    \ glue, we had to define two functions to apply plugins to each connection (http\
    \ and api). With glue, we define all of the plugins in one place and give each\
    \ plugin an array containing the connection(s). Glue will automatically apply\
    \ the plugins to the right connection(s) as defined.\n\n## Rejoice\n\nRejoice\
    \ is a CLI tool to start up a hapi instance from a purely JSON configuration.\
    \ This module was split off and used to be in hapi itself as bin/hapi. It is pretty\
    \ straightforward. Now that we have learned how glue composition works, you simply\
    \ need the JSON result of the manifest that was mentioned. This results in:\n\n\
    ```json\n{\n  \"connections\": [{\n    \"port\": 8080,\n    \"labels\": [\"http\"\
    ]\n  },\n  {\n    \"port\": 8088,\n    \"labels\": [\"api\"]\n  }\n  ],\n  \"\
    plugins\": {\n    \"bell\": [{ \"select\": \"http\" }],\n    \"blip\": [{}],\n\
    \    \"hapi-auth-cookie\": [{ \"select\": \"http\" }],\n    \"/authentication\"\
    : [{ \"select\": \"http\" }],\n    \"/controllers\": [{ \"select\": [\"http\"\
    , \"api\" }],\n    \"/models\": [{ \"select\": [\"http\", \"api\" }],\n    \"\
    /routes\": [{ \"select\": \"http\" }],\n    \"/api\": { \"select\": [\"api\"]\
    \ },\n    \"good\": {\n      \"opsInterval\": 5000,\n      \"reporters\": {\n\
    \        \"reporter\": \"good-console\",\n        \"events\": { \"ops\": \"*\"\
    , \"log\": \"*\" }\n      }\n    }\n  }\n}\n```\n\nSince this is a json file we\
    \ have used double quotes. Assuming you have installed rejoice locally, you can\
    \ start it with rejoice -c example.json. It's nice to be able to work with a single\
    \ JSON file, but you may find that these files you want to do things differently\
    \ depending on environment. This is where confidence comes in.\n\n## Confidence\n\
    \nConfidence is another CLI tool. You can take a JSON file and apply filters to\
    \ it so you can process that file. Managing multiple files per environment can\
    \ not only be tedious but prone to errors. When you add a new set of these files\
    \ but forget to add it to the others. This leads to configuration drift problems\
    \ and with confidence you can be 'confident' that you have just one location to\
    \ go as the source of truth. Let's take a look at our rejoice file and apply filters\
    \ to it that we can generate with confidence.\n\n```json\n{\n  \"connections\"\
    : [\n    {\n      \"port\": 8080,\n      \"labels\": [\"http\"]\n    },\n    {\n\
    \      \"port\": 8088,\n      \"labels\": [\"api\"]\n    }\n  ],\n  \"plugins\"\
    : {\n    \"$base\": {\n      \"bell\": [[\"select\": \"http\"] ],\n      \"hapi-auth-cookie\"\
    : [[\"select\": \"http\"] ],\n      \"/authentication\": [[\"select\": \"http\"\
    ] ],\n      \"/controllers\": [[\"select\": [\"http\", \"api\"] ],\n      \"/models\"\
    : [[\"select\": [\"http\", \"api\"] ],\n      \"/routes\": [[\"select\": \"http\"\
    ] ],\n      \"/api\": [[\"select\": [\"api\"] ],\n      \"good\": {\n        \"\
    opsInterval\": 5000\n      }\n    },\n    \"dev\": {\n      \"blip\": [{}],\n\
    \      \"good\": {\n        \"reporters\": [{\n          \"reporter\": \"good-console\"\
    ,\n          \"events\": { \"ops\": \"*\", \"log\": \"*\" }\n        }]\n    \
    \  }\n    },\n    \"prod\": {\n      \"good\": {\n        \"reporters\": [{\n\
    \          \"reporter\": \"good-file\",\n          \"events\": { \"ops\": \"*\"\
    , \"log\": \"*\" }\n        }]\n      }\n    }\n  }\n}\n```\n\nTo generate a JSON\
    \ file we can use later for rejoice you can run: confidence -c --filter=dev >\
    \ rejoice.json. This will result in merging $base with dev specific entries. In\
    \ this case, you want blip and good-console only for the development environment\
    \ because they are handy for debugging. You don't want these in your prod environment.\
    \ For prod you've added good-file that logs your output to a file, which can later\
    \ be processed by a log aggregator (see discussion in Chapter 1). To generate\
    \ the prod config, you do the same command as before change the filter to --filter=prod.\
    \ Invalid JSON will result in errors. Also you will see that opsInterval setting\
    \ in $base gets merged for both filters. Confidence do even more, but this should\
    \ empower you to have one configuration for your server so you can easily maintain\
    \ your environments. Using confidence in combination with rejoice (which uses\
    \ glue) will keep your ever-changing environments manageable.\n\n## Server methods\n\
    \nYou may register methods that are available everywhere on the server. Doing\
    \ this is very easy as shown:\n\n```javascript\nserver.method('hako', function\
    \ (next) {\n  console.log('the hapi project was');\n  console.log('originally\
    \ called hako');\n  return next(null, 'called');\n});\n```\n\nThe server methods\
    \ are then accessed via the server.methods object.\n\n```javascript\nserver.methods.hako(function\
    \ (err, result) {\n  console.log(result); // prints \"called\"\n});\n```\n\nYou\
    \ may not want your method to require a callback. If so, you can toggle this behavior\
    \ in one of the options.\n\n```javascript\nserver.method('hako', function (arg)\
    \ {\n  console.log('the hapi project was');\n  console.log('originally called\
    \ hako');\n\n  return 'called';\n}, { callback: false });\n\nconsole.log(server.methods.hako());\
    \ // prints \"called\"\n```\n\nThe additional options that are available are bind,\
    \ cache and generateKey.\n\n- bind sets the context for the method and defaults\
    \ to the context when the method was created. If you want some other content,\
    \ this is the place to do it.\n- cache has the same configuration, which will\
    \ be discussed in Configuring for caching.\n- Finally, generateKey is a function\
    \ that's used to create a unique key for caching purposes.\n\n## Decorating the\
    \ server\n\nUsing server.decorate, you can add functions directly to the server\
    \ object. This is different from server.method where you add methods to access\
    \ via server.methods. In addition to decorating the server object, you can also\
    \ decorate the reply object, and we'll cover that in Chapter 4.\n\n```javascript\n\
    server.decorate('server', 'success', function () {\n    return this.response({\
    \ success: true });\n});\n```\n\n## Configuring for caching\n\nWe can use server.cache\
    \ to setup a cache. hapi has a built-in server cache facility and it relies on\
    \ the hapi plugin cache. By default, there is a built-in memory cache catbox-memory\
    \ supported by other types of cache engines like redis, MongoDB, memcached, and\
    \ others. Please refer to the catbox documentation for more details on these strategies.\
    \ Here is a simple example of how to use server.cache.\n\n```javascript\nvar cache\
    \ = server.cache({\n    segment: 'plugins',\n    expiresIn: 60 * 60 * 1000\n});\n\
    \ncache.set('pluginName', { author: 'mindy' }, null, function (err) {\n    cache.get('pluginName',\
    \ function (err, value, cached, log) {\n        // value === { author: 'mindy'\
    \ };\n    });\n});\n```\n\nWe have here setup a cache, with a segment of plugins.\
    \ Segments are used to isolate cached items within the cache partition. When you\
    \ call this within a plugin, it defaults to name where name is the name of the\
    \ plugin.\n"
  mdcn: "\n\n## 第 2 章：服务器\n\n现在我们已经知道了想要实现什么，让我们来看看具体是如何实现的。`registerHttpPlugins`\
