  - "[PAGE 36]\n\n# Routes 3\n\nIn most places, the term route is associated with\
    \ a certain path that you can take to get to your destination. When driving from\
    \ point A to B, for instance, you may have the option of several different routes.\
    \ A route is a very specific path between the two points.\nnHapi and other frameworks,\
    \ a route is a specific path that a request takes. On a website, the number of\
    \ characters you can write after the address hapi-plugins.com are only limited\
    \ to the number of characters your browser will support. In order to send a request\
    \ and actually get a response for what you're looking for, you need to know the\
    \ route of where to send the request. The query then travels through a path within\
    \ the framework, and a response is returned based on several parameters as part\
    \ of the request. The actual route you told the route to take is key for knowing\
    \ how to handle this request. It's the first indication of what the client is\
    \ expecting it to do with the request.\nIn its simplest form, a route looks like\
    \ the following:\n\n```\nserver.route({\n  method: 'GET',\n  path: '/',\n  handler:\
    \ function (request, reply) {\n    reply.view('index');\n  }\n});\n```\n\nThis\
    \ is a great obvious form for short and simple routes, but when the project gets\
    \ larger we separate out the behavior to use config instead of supplying the handler\
    \ like we see here.\nWe typically store the config in their own file. Before we\
    \ look at what we've done for this project, we will simply even further.\nIn our\
    \ lib/routes.js file we have the following:\n\n```\nvar Welcome = require('./controllers/welcome');\n\
    server.route({\n  method: 'GET',\n```"
  - "[PAGE 37]\n\n# CHAPTER 3: Routes\n\n```\npath: '/'\nconfig: Welcome.index\n\n\
    );\n```\n\nThen the actual config for the route is in a corresponding file called\
    \ 'lib/controllers/welcome.js'.\n\n```\nmodules.export.index = {\n    description:\
    \ 'Show the main page for our welcome page',\n    handler: function (request,\
    \ reply) {\n        reply.view('index');\n    }\n};\n```\n\nThis keeps code logically\
    \ separated, which is typical of an MVC (Model-View-Controller) framework. The\
    \ logic in the code can get quite extensive, and with this separation, it can\
    \ easily be organized so that the logic for a particular route is all in one file.\
    \ You may decide to go that route, which would be as simple as keeping that logic\
    \ in a file called lib/controllers/welcome/index.js instead. Perhaps terms of\
    \ service would be in lib/controllers/welcome/tos.js under this structure. Of\
    \ course, there be some sense to how large a function is before it splits out\
    \ into its own file. But the idea is that the code, when broken up into smaller\
    \ pieces, is far easier to manage and read.\n\n# Path processing\n\nRoutes are\
    \ unique. Several issues on GitHub have been opened asking about regular expressions,\
    \ or other types of globbing. It can be difficult to figure out when routes overlap.\
    \ One of the early design goals of hapi was to ensure that the routing table would\
    \ be identical each time it is loaded. There would be no surprises. When starting\
    \ up, hapi will complain about any conflicts and protect you from these types\
    \ of issues.\n\nHow path processing works in hapi, the router iterates through\
    \ the routing table on each incoming request and executes the first (and only\
    \ matching) route. Route matching is done on the request path only (excluding\
    \ query and other URI components). The requests are matched in a deterministic\
    \ order, so it doesn't matter where you add them. Finally, the routes are sorted\
    \ from the most specific to the most generic. If you want further details on exactly\
    \ how that works, see Path Matching Order.\n\n# Parts of the route\n\nA route\
    \ object, the argument to server.route() consists of just a few easy properties."
- md: "\n[content]\n\n## method\n\nThis determines the HTTP request method to be performed\
    \ on the resource. The method will be one of the following: GET HEAD POST PUT\
    \ DELETE TRACE OPTIONS CONNECT PATCH. In practice, it will likely be one of GET,\
    \ POST, PUT, DELETE or PATCH, and HEAD is not allowed. hapi allows wildcard methods\
    \ to be used, which means that when the exact match isn't found, it will use the\
    \ wildcard instead. The wildcard string is \\*.\n\n## vhost\n\nSpecify, this is\
    \ a virtual host for this route to listen to. A server can be listening to more\
    \ than one virtual host, but in order for the route to be triggered for one particular\
    \ host, it can specify the host to listen to. This way, the server can serve up\
    \ the route depending on the vhost defined. The vhost can be defined as either\
    \ a string or as an array of strings. The default is to allow any host to use\
    \ the route.\n\n## handler\n\nThe handler is a function that returns the output\
    \ from the route that has been called. It's contingent on the validation and any\
    \ authentication that precedes it. If the handler is defined by the server, an\
    \ object with the property for the name of the handler, as well as any options,\
    \ can be passed. For a deep dive into the intricacies of the handler, see Chapter\
    \ 4.\n\n## config\n\nIf you need additional configuration for your route, you\
    \ can use the config section to define those. For a simple app, you may not need\
    \ to specify additional configuration, so this isn't strictly required. However,\
    \ for more complex configurations, it is better to organize your code under this\
    \ structure. In this structure, you move your handler to this section so that\
    \ your configuration is all organized in the same location. An example of a more\
    \ complex configuration is if you add validation or caching.\n\nIt is important\
    \ to note that caching is different than the server.cache that was discussed in\
    \ Chapter 2. That functionality caches response objects. Caching in this section,\
    \ is strictly caching. It will set the Cache-Control header. Below is a trivial\
    \ example where it will set a cache header for one for our /hello route.\n\n```\n\
    server.route({\n  method: 'GET',\n  path: '/hello',\n  config: {\n    handler:\
    \ handler,\n    cache: {\n      expiresIn: 60 * 60 * 1000\n    }\n});\n```\n\n\
    There are so many options in the config section, we feel it's better to refer\
    \ you to the documentation. One that we will cover next, however, route prerequisites.\n\
    \n## ROUTE PREREQUISITES\n\nYou may need to initialize a database connection and\
    \ return it for every single endpoint you're using. This is a task's perfectly\
    \ suitable for route prerequisites. There are course many things you could need\
    \ to set up, but this is probably the most common. The prerequisite allows you\
    \ to run any number of functions in serial and parallel. The argument for pre\
    \ is a mixed array. It can contain either arrays or other objects. That is, anything\
    \ in an array will be executed in parallel, while all the other items are executed\
    \ in serial, e.g:\n\n```javascript\nserver.route({\n  method: 'GET',\n  path:\
    \ '/',\n  config: {\n    handler: function (request, reply) {\n      reply.view('index');\n\
    \      pre: [\n        series,\n        series,\n        [\n          parallel,\n\
    \          parallel\n        ],\n        series\n      ]\n    }\n  }\n});\n```\n\
    \nEach series and parallel item in the pre array are objects with two properties:\
    \ method and assign.\n\n```javascript\nvar dbSetup = function (request) {});\n\
    server.route({\n  // ...\n  config: [\n    { method: dbSetup, assign: 'connection'\
    \ }\n  ],\n  handler: function (request, reply) {\n    var conn = request.pre.connection;\n\
    \    conn.exec('select * from blah', function (err, result) {\n      if (err)\
    \ {\n        var msg = 'DB call failed';\n        return reply(Boom.internal(msg));\n\
    \      }\n      return reply(result);\n    });\n  }\n});\n```\n\n## path\n\nPaths\
    \ are divided into segments by the / character. That means anything not part of\
    \ / is a segment.\nIt's important to note that multiple parameters per segment\
    \ are not allowed. Because of the hapi rule to always have the routes in a predictable\
    \ order, hapi does not support any sort of regular expression syntax as it becomes\
    \ difficult to tell when paths overlap. But what hapi allows is using both optional\
    \ parameters, wildcard parameters and match multiple segments of a path.\n\n##\
    \ SIMPLE PATH\n\nThe named parameterized by paths of the path are indicated using\
    \ curly brackets as shown: /fixed/{name}. In the handler, the request object will\
    \ have a params object. You could use the name parameter in the handler with request.params.name.\
    \ We will cover more details on the request object in Chapter 4.\n\nThere are\
    \ many options for constructing the path. They are later accessed via request.path\
    \ in the handler, which is also discussed in more detail in Chapter 4.\nTo illustrate:\n\
    \n```javascript\nvar internals = {};\n\nserver.route({\n  method: 'GET',\n  path:\
    \ '/plugins/{name}',\n  config: internals.config\n});\n\ninternals.config = {\n\
    \  description: 'A path to get info for a specific plugin',\n  validate: {\n \
    \   params: {\n      name: Joi.string().required()\n    }\n  },\n  handler: function\
    \ (request, reply) {\n    var msg = 'The name of the plugin that was passed is:\
    \ ';\n    return reply(msg + request.params.name);\n  }\n};\n```\n\nThe paths\
    \ contain the parameter name which is then checked for validation to be sure it's\
    \ a string and nothing. For more validation, see Chapter 5.\nWe then access the\
    \ parameter through request.params to get the name.\n\n## OPTIONAL PARAMETERS\n\
    \nIn order to specify an optional parameter we use a question mark ?. In regular\
    \ expressions this also denotes optional matches and captures so this may already\
    \ be familiar to you.\n/plugins/{name?}\nin this case it may be unclear what to\
    \ serve up if the name is missing, but you may use it to serve up a list of plugins.\n\
    \n## WILDCARDS\n\nIf we need to accept any number of segments in order to, for\
    \ example, proxy a query for a particular route, then a wildcard (*) is a life-saver.\
    \ Anything using the wildcard character will be stored as an array in the named\
    \ parameter on the request object. Perhaps if we allowed a query to retrieve and\
    \ all results from npm directly we could allow for the path below:\n/npm/*\nBecause\
    \ of the nature of the capture here, similar to programming languages that allow\
    \ any number of arguments to a function (EcmaScript 6 offers the “rest parameter\
    \ using ......), you can only have the rest of the parameter wildcard at the end\
    \ of a path.\n\n"
  mdcn: "\n\n## method\n\n这决定了要在资源上执行的 HTTP 请求方法。该方法将是以下之一：GET HEAD POST PUT DELETE\
    \ TRACE OPTIONS CONNECT PATCH。在实际操作中，它很可能是 GET、POST、PUT、DELETE 或 PATCH 之一，且不允许\
    \ HEAD。hapi 允许使用通配符方法，这意味着当未找到精确匹配时，它将改用通配符。通配符字符串为 `*`。\n\n## vhost\n\n指定此路由监听的虚拟主机（virtual\
    \ host）。服务器可以监听多个虚拟主机，但为了让路由为特定主机被触发，可以指定要监听的主机。通过这种方式，服务器可以根据定义的 vhost 提供路由服务。vhost\
    \ 可以定义为字符串，也可以定义为字符串数组。默认情况下允许任何主机使用该路由。\n\n## handler\n\nhandler 是一个函数，用于返回被调用路由的输出。它取决于先前的验证和任何身份验证。如果\
    \ handler 是由服务器定义的，可以传递一个带有 handler 的属性以及任何选项的get。要深入研究 handler 的各种复杂性，请参阅第 4\
    \ 章。\n\n## config\n\n如果你需要为路由提供额外的配置，可以使用 config 部分来定义这些配置。对于简单的应用程序，你可能不需要指定额外配置，因此这并不是强制要求的。但对于更复杂的配置，最好在此结构下组织你的代码。在此结构中，你将\
    \ handler 移动到此部分，以便所有的配置都组织在同一个位置。更复杂配置的一个示例是添加验证或缓存。\n\n需要注意的是，这里的缓存与第 2 章讨论的\
    \ `server.cache` 不同。后者的功能缓存响应对象。而此部分的缓存是纯粹的缓存。它将设置 `Cache-Control` 头。下面是一个简单的示例，它为我们的\
    \ /hello 路由设置了缓存标头。\n\n```\nserver.route({\n  method: 'GET',\n  path: '/hello',\n\
    \  config: {\n    handler: handler,\n    cache: {\n      expiresIn: 60 * 60 *\
    \ 1000\n    }\n});\n```\n\nconfig 部分有很多选项，我们认为让你查阅文档更好。然而，接下来我们将介绍另一个内容：路由先决条件（route\
    \ prerequisites）。\n\n## ROUTE PREREQUISITES\n\n你可能需要为你使用的每个端点初始化数据库连接并将其返回。这是一个非常适合路由先决条件的任务。你可能需要设置很多事情，但可能是最常见的。先决条件允许你串行或并行运行任意数量的函数。`pre`\
    \ 参数是一个混合数组。它可以包含数组或其他对象。也就是说，数组中的任何内容都将并行执行，而所有其他项将串行执行，例如：\n\n```javascript\n\
    server.route({\n  method: 'GET',\n  path: '/',\n  config: {\n    handler: function\
    \ (request, reply) {\n      reply.view('index');\n      pre: [\n        series,\n\
    \        series,\n        [\n          parallel,\n          parallel\n       \
    \ ],\n        series\n      ]\n    }\n  }\n});\n```\n\npre 数组中的每个 series 和 parallel\
    \ 项都是具有两个属性的对象：`method` 和 `assign`。\n\n```javascript\nvar dbSetup = function (request)\
    \ {});\nserver.route({\n  // ...\n  config: [\n    { method: dbSetup, assign:\
    \ 'connection' }\n  ],\n  handler: function (request, reply) {\n    var conn =\
    \ request.pre.connection;\n    conn.exec('select * from blah', function (err,\
    \ result) {\n      if (err) {\n        var msg = 'DB call failed';\n        return\
    \ reply(Boom.internal(msg));\n      }\n      return reply(result);\n    });\n\
    \  }\n});\n```\n\n## path\n\n路径通过 `/` 字符分为多个段（segments）。这意味着任何不是 `/` 的内容都是一个段。\n\
    需要注意的是，每个段不允许包含多个参数。由于 hapi 规定路由必须具有可预测的顺序，hapi 不支持任何类型的正则表达式语法，因为这很难判断路径何时重叠。但\
    \ hapi 允许同时使用可选参数、通配符参数和匹配路径的多个段。\n\n## SIMPLE PATH\n\n路径中的命名参数使用大括号表示，如下：`/fixed/{name}`。在\
    \ handler 中，request 对象将拥有一个 `params` 对象。你可以在 handler 中通过 `request.params.name`\
    \ 使用 name 参数。我们将在第 4 章中介绍更多关于 request 对象的细节。\n\n构建路径有很多选项。稍后可以在 handler 中通过 `request.path`\
    \ 访问，这在第 4 章中也会更详细的讨论。\n为了说明：\n\n```javascript\nvar internals = {};\n\nserver.route({\n\
    \  method: 'GET',\n  path: '/plugins/{name}',\n  config: internals.config\n});\n\
    \ninternals.config = {\n  description: '一个获取特定插件信息的路径',\n  validate: {\n    params:\
    \ {\n      name: Joi.string().required()\n    }\n  },\n  handler: function (request,\
    \ reply) {\n    var msg = 'The name of the plugin that was passed is: ';\n   \
    \ return reply(msg + request.params.name);\n  }\n};\n```\n\n路径包含参数名，然后对其进行验证以确保它是字符串而不是其他内容。需要更多验证，请参阅第\
    \ 5 章。\n我们通过 `request.params` 访问参数获取名称。\n\n## OPTIONAL PARAMETERS\n\n为了指定可选参数，我们使用问号\
    \ `?`。在正则表达式中，这也表示可选匹配和捕获，因此你可能已经熟悉它。\n`/plugins/{name?}`\n在这种情况下，如果 name 缺失，可能不清楚应该提供什么，但你可以它来提供插件列表。\n\
    \n## WILDCARDS\n\n如果我们需要接受任意数量的段（例如，为特定路由代理查询），那么通配符 `*` 简直是救星。任何使用通配符字符的内容将作为数组存储在\
    \ request 对象的命名参数中。也许如果我们允许查询直接从 npm 获取并检索所有结果，我们就可以允许下面的路径：\n`/npm/*`\n由于此处捕获的性质，类似于允许函数接受任意数量参数的编程语言（EcmaScript\
    \ 6 提供了使用 `......` 的剩余参数），你只能将剩余参数通配符放在路径的末尾。\n\n"
