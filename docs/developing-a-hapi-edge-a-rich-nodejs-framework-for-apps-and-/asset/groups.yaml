    ```\n\n我们将得到 `Controllers.Plugin.get` 返回的内容。当我们谈论有效负载（payload）时，会将此与其他方法进行对比。\n\
    \n## query (查询)\n\n对于初学 hapi 的人来说，参数（param）和查询（query）之间的区别可能会让他们困惑。在 https://hapi-plugins.com/search?q=pluginName\
    \ 中，URL 的查询部分是 `?` 后。查看之前的 `/plugins/{name}` 示例进行对比。name 参数严格是路径的一部分。\n\n`request.query`\
    \ 包含了通过 URL 查询发送的所有键值对。\n\n例如，我们可以对 URL 进行“疯狂”操作以获取 hapi-plugins.com 上某个特定插件的信息，并请求如下内容：\n\
    \n```\nhttp://localhost:8080/plugins/blipp?hello=hi\n```\n\n## The request (请求)\n\
