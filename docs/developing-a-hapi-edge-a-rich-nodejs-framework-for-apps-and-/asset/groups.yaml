    Using coverage is a must when it comes to developing modules in the hapi ecosystem.
    All of the modules published under the hapijs organization demand 100% code coverage.
    Therefore, if you plan to contribute any changes or enhancements to these modules
    you must add tests for the changed code. There may be naysayers when it comes
    to code coverage, but it''s the mechanism that has been chosen to help gauge code
    works. In addition to adding tests that cover every line and code path in a module,
    hapijs maintainers also review the tests and code to help ensure its accuracy.
    A person can cover a line with a test that checks a wrong assumption, engineers
    are ultimately responsible for checking the code and the tests.


