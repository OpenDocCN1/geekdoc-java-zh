- md: "\n# History of lab\n\nFor best results, happy works well with the lab runner.\
    \ Lab is the testing framework that was developed for use with hapi plugins. happy\
    \ originally used mocha and chai to execute tests. However, with Node.js 0.10\
    \ was released, happy added support for the new release and incorporated domains.\
    \ Domains have a hairy feature ever since their release, testing support not excluded.\
    \ When 0.10 was released, mocha was slow to adopt support for adequately testing\
    \ domains. As a result of the feature for hapi to use domains, something had to\
    \ be done. As a result, lab was trimmed and more features were added.\n\nCode\
    \ coverage is an essential factor for ensuring that quality code is being committed\
    \ to repositories. Therefore, code support needs to be baked in the testing framework\
    \ as a simple flag when you run tests.\n\nBefore lab was created, mocha tests\
    \ in hapi were being run with the blanket coverage module. Blanket itself relies\
    \ on esprima to create abstract syntax trees (AST) of the code in order to help\
    \ identify statements to insert for code coverage analysis. Blanket was carried\
    \ over into lab when lab was created. However, over time, code coverage was baked\
    \ into lab, instead of being delivered by a third party.\n\nCode reporting evolved\
    \ as a result of incorporating the analysis within lab. This helps to make code\
    \ coverage a first class citizen in lab reports. As a result, the HTML reporter\
    \ now identifies the dead lines in their code that will never be reachable by\
    \ tests.\n\nThis makes it to identify areas of code that are dead and can be deleted,\
    \ making your code even more maintainable as a result.\n\nWhen hapi was using\
    \ mocha for testing, it was also using chai to help structure the assertions.\
    \ The hapi maintainers favor writing tests using the expect style, as opposed\
    \ to assert. Over time, the use of chai surfaced a couple of edge case function\
    \ names that weren't consistent with the larger framework. For example, the exist\
    \ property is not executed as a function, unlike some of the other parts of the\
    \ syntax. These inconsistencies led to a few bugs popping up from time to time.\
    \ These bugs had to do with the fact that it was too easy to forget a method ()\
    \ and would result in an assertion that was never executed. Because it was never\
    \ executed, it passed incorrectly.\n\nAs a result, the assertion library named\
    \ code was created. Code takes the chai syntax and makes exist a function, just\
    \ as all of the truthy for true, false, and null become functions. Below you can\
    \ see the differences between chai and code.\n\nFirst our example is:\n\n```\n\
    expect(foo).to.exist;\nexpect(bar).to.be;\n```\n\nNext you can see our code example\
    \ for doing the same thing. Notice that true and exist are functions in code.\n\
    \n```\nexpect(foo).to.be();\nexpect(bar).to.be.true();\n```\n\nIn addition to\
    \ inconsistencies described earlier, we wanted an assertion library that was small,\
    \ simple, and intuitive. Logic was stripped out that was dealing with plugins,\
    \ extensions, and the overhead of support testing the browser. This resulted in\
    \ much of the functionality that we needed, but it resulted in about 300 lines\
    \ that is trivial to read and understand.\n\nFinally, code allowed deeper integration\
    \ between the test runner and the assertion library. This allowed us to get total\
    \ assertion counts to measure the tests' comprehensiveness and to verify that\
    \ every assertion is executed correctly.\n\nLab involved in other ways as well.\
    \ For example, transpiler support has been added to support testing CoffeeScript\
    \ or JSX code. Additionally, lab now has lint support baked in, so pull requests\
    \ to hit repositories have the same coding style. This has been useful for developers\
    \ to know ahead of time if they are violating any style rules before asking for\
    \ a commit to be merged. One of the drawbacks to lab, however, it is designed\
    \ and runs only on the server at this point. However, this will likely change\
    \ as its popularity grows and more developers desire to use it for client-side\
    \ testing.\n\n# Installing lab\n\nLab may be useful to install globally in your\
    \ environment. Similarly to other node.js modules, the installation of lab can\
    \ be accomplished by using npm. This is shown below.\n\n```\n$ npm install -g\
    \ lab\n```\n\nWhile you can install globally, you don't need to. Instead, all\
    \ of the happy core modules include lab in the devDependencies section of the\
    \ package.json. Any recent version of lab is fine to install globally and locally,\
    \ as the two won't conflict when running tests. The next example shows how to\
    \ install lab only locally and save it to the devDependencies section of the package.json.\n\
    \n```\n$ npm install lab --save-dev\n```\n\nAfter you have installed lab you should\
    \ verify that it's working correctly. If installed globally, lab will be available\
    \ in the PATH environment variable. Otherwise, you will need to run the lab binary\
    \ from the node_modules/.bin folder. To verify a global install, simply run lab\
    \ -h. If you want to verify a local install, then you\n\n# Installing code\n\n\
    need to run node ./node_modules/.bin/lab -h. You should get the help page for\
    \ lab.\n\nAs an aside, it may be helpful to auto-update the PATH when navigating\
    \ into a folder with children node_modules/.bin folders. This will make local\
    \ binaries runnable the same way as global binaries.\n\nSimilar to how lab was\
    \ installed, you should also install code. Remember, lab doesn't have a built-in\
    \ assert library that is included out-of-the-box. Therefore you should use code,\
    \ chai, or any of the other modules that you prefer. You can, again, run npm install\
    \ code --save-dev to save this in your package.json file or add it manually.\n\
    \n# Writing a simple test\n\nAll tests should be located in a test folder within\
    \ the root of your project. This is a pattern that is nearly ubiquitous in the\
    \ Node.js community. How you choose to name your test files is up to you, as there\
    \ isn't an established naming convention across the board. However, a pattern\
    \ that is used throughout the happy organization is to name each test file the\
    \ same as the module that it's responsible for testing. For the purposes of this\
    \ exercise, create a file named index.js. Populate index.js with the code found\
    \ below.\n\n```javascript\n// Load modules\nvar Code = require('code');\nvar Lab\
    \ = require('lab');\n```\n\n```javascript\nvar lab = exports.lab = Lab.script();\n\
    \nlab.test('lab exists', function (done) {\n  Code.expect(lab).to.exist();\n \
    \ done();\n});\n```\n\nSimply type the command lab in the root of the project\
    \ to run the test above. The output will look like following:\n\n```\n$ lab\n\
    ```\n\n```\n1 tests complete\nNo global leaks detected\n```\n\nHopefully that\
    \ wasn't difficult or shocking. As you can see from the output, the time it takes\
    \ to run the test is reported along with a default reporter.\n\n# Principles of\
    \ lab\n\nLet's take a look at the core lab principles to keep in mind.\n\n# Always\
    \ asynchronous\n\nIn the previous section, you saw what a simple lab test looks\
    \ like. One of the defining characteristics of lab is that tests are always asynchronous.\
    \ Instead of inspecting the length of the arguments object and running tests differently\
    \ than have an argument done, all lab tests must receive a callback argument and\
    \ execute it when the test is complete. If an argument wasn't expected by the\
    \ test, then the test immediately deals with an explanation. For example, the\
    \ test below:\n\n```javascript\n// Load modules\n\nvar Code = require('code');\n\
    var Lab = require('lab');\n\nvar lab = exports.lab = Lab.script();\n\nlab.test('lab\
    \ exists', function () {\n  Code.expect(lab).to.exist();\n});\n```\n\nWhen we\
    \ run lab we get the following output:\n\n```\n$ lab\n\n\nError: Function for\
    \ test \"lab exists\" should take exactly one argument\n\nSimilarly, if an argument\
    \ is accepted in the test function but isn't executed, an error will occur. However,\
    \ this error will be a timeout for the test itself. We can have a timeout by removing\
    \ done ( ). This can be done by writing the following test.\n"
  mdcn: "\n\n# lab 历史\n\n为了获得最佳效果，happy 与 lab 运行器配合得很好。Lab 是专为 hapi 插件开发的测试框架。happy\
    \ 最初使用 mocha 和 chai 来执行测试。然而，随着 Node.js 0.10 的发布，happy 增加了对新版本的支持并引入了 domains。Domains\
    \ 自发布以来就一直带有一个棘手的特性，其中测试支持也不例外。当 0.10 发布时，mocha 在支持充分测试 domains 方面非常缓慢。由于 hapi\
    \ 使用 domains 的特性，必须采取一些措施。结果，lab 经过了精简并添加了更多功能。\n\n代码覆盖率是确保提交到仓库的代码具有质量的关键因素。因此，在运行测试时，测试框架需要以一个简单标志的形式内置代码支持。\n\
    \n在创建 lab 之前，hapi 中的 mocha 测试是使用 blanket coverage 模块运行的。Blanket 本身依赖 esprima 来创建代码的抽象语法树\
    \ (AST)，以帮助识别用于插入代码覆盖率分析的语句。Blanket 在 lab 创建时也被迁移了过来。然而，随着时间的推移，代码覆盖功能已直接内置到 lab\
    \ 中，而不是由第三方提供。\n\n代码报告随着在 lab 内部整合分析而演变。这有助于使代码覆盖率成为 lab 报告中的一等公民。结果，HTML 报告器现在可以识别代码中永远无法被测试到的死代码（dead\
    \ lines）。\n\n这使得识别可以删除的代码区域变得容易，从而使你的代码更具可维护性。\n\n当 hapi 使用 mocha 进行测试时，也使用 chai\
    \ 来帮助构建断言。hapi 的维护者更倾向于使用 expect 风格编写测试，而不是 assert。随着时间的推移，chai 的使用暴露了一些与大型框架不一致的边缘情况函数名。例如，`exist`\
    \ 属性不是作为函数执行的，这与语法的其他部分不同。这些不一致性导致了偶尔出现一些 bug。这些 bug 的产生在于人们很容易忘记写方法括号 `()`，导致断言从未被执行。因为它从未被执行，所以它错误地通过了。\n\
    \n结果，创建了名为 code 的断言库。code 接收了 chai 的语法并将 `exist` 变成一个函数，就像所有的 `true`、`false` 和\
    \ `null` 真值都变成了函数。下面你可以看到 chai 和 code 之间的区别。\n\n首先，我们的示例是：\n\n```\nexpect(foo).to.exist;\n\
    expect(bar).to.be;\n```\n\n接下来，你可以看到我们实现相同功能的代码示例。注意，在 code 中，`true` 和 `exist`\
    \ 是函数。\n\n```\nexpect(foo).to.be();\nexpect(bar).to.be.true();\n```\n\n除了上述描述的不一致性外，我们想要一个小型、简单且直观的断言库。去掉了处理插件、扩展以及支持浏览器测试开销的逻辑。这产生了我们所需的大部分功能，但也带来了大约\
    \ 300 行易于阅读和理解的代码。\n\n最后，code 允许测试运行器和断言库之间进行更深层的集成。这允许我们获取总断言计数来衡量测试的完整性，并验证每个断言都被正确执行。\n\
    \nlab 在其他方面也有参与。例如，已添加了转译支持以支持测试 CoffeeScript 或 JSX 代码。此外，lab 现在内置了 lint 支持，因此提交到仓库的拉请求（pull\
    \ requests）具有相同的编码风格。这对于开发者在请求合并提交之前预先知道是否违反了任何样式规则非常有用。然而，lab 的缺点之一是它目前设计并仅运行在服务器上。但随着其流行度的增加和更多开发者希望使用它进行客户端测试，这种情况可能会改变。\n\
    \n# 安装 lab\n\nlab 可能在全局安装到你的环境中会很有用。与其它 node.js 模块类似，lab 的安装可以通过 npm 完成。如下所示：\n\
    \n```\n$ npm install -g lab\n```\n\n虽然你可以全局安装，但并不需要这样做。相反，所有 happy 核心模块在 `package.json`\
    \ 的 `devDependencies` 部分中都包含了 lab。任何最新版本的 lab 都可以全局或本地安装，因为它们在运行测试时不会发生冲突。接接的示例显示了如何仅在本地安装\
    \ lab 并将其保存到 `package.json` 的 `devDependencies` 部分。\n\n```\n$ npm install lab\
    \ --save-dev\n```\n\n安装 lab 后，你应该验证它是否运行正常。如果是全局安装的，lab 将在 PATH 环境变量中可用。否则，你将需要从\
    \ `node_modules/.bin` 文件夹运行 lab 二进制文件。要验证全局安装，只需运行 `lab -h`。如果你想验证本地安装，那么你\n\n\
    # 安装 code\n\n需要运行 `node ./node_modules/.bin/lab -h`。你应该能得到 lab 的帮助页面。\n\n顺便提一下，在进入包含子\
    \ `node_modules/.bin` 文件夹的目录时，自动更新 PATH 可能会有帮助。这使得本地二进制文件可以像全局二进制文件一样运行。\n\n与安装\
    \ lab 类似，你也应该安装 code。记住，lab 并没有内置开箱即用的断言库。因此，你应该使用 code、chai 或你喜的任何其他模块。你可以再次运行\
    \ `npm install code --save-dev` 将其保存到你的 `package.json` 文件中或手动添加。\n\n# 编写简单的测试\n\
    \n所有测试都应该位于项目根目录下的 `test` 文件夹中。这是 Node.js 社区中几乎无处不在的模式。你选择如何命名测试文件取决于你，因为目前还没有一个统一的命名规范。然而，happy\
    \ 组织中使用的使用的模式是将每个测试文件命名为与其负责测试的模块相同的名称。为了这次练习，请创建一个名为 `index.js` 的文件。在 `index.js`\
    \ 中填充下面的代码。\n\n```javascript\n// Load modules\nvar Code = require('code');\nvar\
    \ Lab = require('lab');\n```\n\n```javascript\nvar lab = exports.lab = Lab.script();\n\
    \nlab.test('lab exists', function (done) {\n  Code.expect(lab).to.exist();\n \
    \ done();\n});\n```\n\n只需在项目根目录下输入 `lab` 命令即可运行上面的测试。输出将如下所示：\n\n```\n$ lab\n\
    ```\n\n```\n1 tests complete\nNo global leaks detected\n```\n\n希望这并不困难或令人震惊。正如你从输出中看到的，运行测试所需的时间将同默认报告器一起报告。\n\
    \n# lab 的原则\n\n让我们来看一下需要记住的内核 lab 原则。\n\n# 始终是异步的\n\n在上一节中，你看到了一个简单的 lab 测试是是什么样的。lab\
    \ 的定义性特征之一是测试总是异步的。lab 并不是通过检查参数对象的长度并以不同于带有 `done` 参数的方式来运行测试，所有的 lab 测试都必须接收一个回调参数，并在测试完成时执行它。如果测试没有期望该参数，则测试会立即处理解释。例如，下面的测试：\n\
    \n```javascript\n// Load modules\n\nvar Code = require('code');\nvar Lab = require('lab');\n\
    \nvar lab = exports.lab = Lab.script();\n\nlab.test('lab exists', function ()\
    \ {\n  Code.expect(lab).to.exist();\n});\n```\n\n当我们运行 lab 时，得到如下输出：\n\n```\n\
    $ lab\n\n\nError: Function for test \"lab exists\" should take exactly one argument\n\
    ```\n\n同样，如果测试函数中接受了参数但没有执行它，将会发生错误。然而，这个错误将是测试本身的超时。我们可以通过移除 `done ()` 来产生超时。这可以通过编写以下测试来实现。\n\
    \n"
