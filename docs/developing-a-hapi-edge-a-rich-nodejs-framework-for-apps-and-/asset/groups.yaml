    \    });\n      }\n    });\n  }\n};\n```\n\nNow you have seen two ways to create\
    \ Models that make calls to RESTful API endpoints. One was a general way to make\
    \ requests and the second was RESTful wrappers to make requests. It is beside\
    \ easy to adapt any of these examples to accommodate other third-party RESTful\
    \ APIs in your projects.\n\nNext up, we'll continue exploring models and how to\
    \ connect and query a database.\n\n# Using a database\n\nIn general, developers\
    \ have complete flexibility when using databases hapi - any database, any ORM,\
    \ or any library can be. hapi does not impose any restrictions whatsoever. You\
    \ can use one database for one project, another for a second project, or use ten\
    \ databases for a third project. hapi tries to make developers happy by not getting\
    \ in the way.\n\nFor the github.com/hapi-edge/hapi-plugins application, we have\
    \ selected the popular MongoDB for our database and we will use the Mongoose driver\
    \ to connect to our database. For information about other database options and\
    \ why we chose MongoDB, please see the Models section of Chapter 13 Appendix.\n\
    \n# Setting up the database\n\nSetting MongoDB for an application is fairly well\
    \ documented on mongodb.org. However, for rapid development, it is faster to develop\
    \ locally or to Compose (aka MongoHQ) to generate a free development database\
    \ instance for.\n\nOnce an instance is set up, a database name has to be created.\
    \ We have chosen the instance name 'hapi-plugins' and a database name 'hapi-plugins'.\
    \ If you change these names, remember to replace them in the examples below in\
    \ the connection string. If you set authentication using a username and password\
    \ (like how we have up in our production database), remember to add that to the\
    \ connection string.\n\nCollections are lists of documents. Mongoose will create\
    \ these for you as use so it is not necessary to create by hand unless you want\
    \ to impose size and maximum document limits.\n\n# Connecting to the database\n\
    \nMongoose provides a high level API for connecting the MongoDB instance. It accepts\
    \ only a mongodb connection string that can contain host, username, password,\
    \ database, and so on. Subsequent calls and queries to the database are automatically\
    \ queued until the connection is complete. Therefore, it is not necessary to nest\
    \ code in an asynchronous block while waiting for the connection to be made.\n\
    \nIn the hapi-plugins.com application, we want to connect to a locally running\
    \ instance of MongoDB while we develop, but then we also want to connect to the\
    \ production database when deployed. We use environment variables to dictate what\
    \ environment to run. Node.js global, process-wide variable process.env contains\
    \ all of the environment variables available to our application.\n\nTo enable\
    \ production, we run our application as PRODUCTION=1 node index.js.\n\nNote: Production\
    \ database credentials in this chapter have their passwords removed. Replace these\
    \ credentials with proper ones for the database that you created.\n\n```\nvar\
    \ databases = {\n  development: 'mongodb://localhost/hapi_plugins',\n  production:\
    \ 'mongodb://hapi:({PASSWORD})@c278.lighthouse.0.mongodbayer.com:10278,c278.lighthouse.1.mongodbayer.com:10278/hapi-plugins?replicaSet=set-54ebe69660d07ala000f09'\n\
    };\n```\n\n```\nif (process.env.PRODUCTION) {\n  Mongoose.connect(databases.production);\n\
    } else {\n  Mongoose.connect(databases.development);\n}\n```\n\nUsing this pattern,\
    \ we can easily differentiate the environments. When developing locally, we use\
    \ a local database. Then, production uses the live, scalable, hosted database.\
    \ An alternative pattern is to include the database connection string in the ENV\
    \ like so:\n\n```\n// MONGODBSTR='mongodb://localhost/hapi_plugins' node.js\n\
    Mongoose.connect(process.env.MONGODBSTR);\n```\n\nThis has the added benefit of\
    \ not storing your connection string anywhere in your code. This may be extremely\
    \ important if you plan to open your source code or in the event your application\
    \ becomes compromised.\n\n# Schema Design\n\nBefore we make any queries, it is\
    \ generally helpful to design a rough schema. Even though MongoDB does not require\
    \ or enforce Schemas, schemas define how your data is structured and can help\
    \ you enforce data types. It helps to know how you plan to access and use the\
    \ data first.\n\nFor the hapi-plugins.com application, we plan to allow anonymous\
    \ visitors to:\n\n- Search for plugins by name, description, author, and keyword.\n\
    - Log in & manage your plugins\n- Add your plugin to the list\n- Like or unlike\
    \ a plugin\n\nIn the background, we also need to be able to:\n\n- Add a plugin\
    \ to the list\n- Remove a plugin from the list\n\nTherefore, we know plugins must\
    \ have a name, description, author(s), and keywords. NPM prevents duplicate module\
    \ names, so we know that names will be unique and thus can use name as a primary\
    \ key. Also, we know from looking at NPM modules also have versions, licenses,\
    \ repository URLs, homepages, dependents, a bunch of statistics. It also has time\
    \ information about when the module was created and Updated. From this, we can\
    \ define our first schema for the hapi-plugins app.\n\n```javascript\nvar internals\
    \ = {};\n\ninternals.plugin = new Mongoose.Schema({\n  'name': { type: String,\
    \ required: true },\n  'description': { type: String, required: false },\n  'version':\
    \ { type: String, required: true },\n  'authors': { type: Array, required: false\
    \ },\n  'license': { type: String, required: false },\n  'repository': { type:\
    \ String },\n  'homepage': { type: String },\n  'updated_at': { type: Date, default:\
