  md: "# Creating your own plugin\n\nNote how everything in our hapi-plugins-project\
    \ is architected to be a plugin. We have plugins for the router and we have plugins\
    \ for the models. Even authentication is a plugin.\nLet's start by taking a look\
    \ at our lib/index.js file where all of our plugins are loaded.\n\n```\nserver.register([\n\
    \  Bell,\n  Blipp,\n  HapiAuthCookie,\n  Authentication,\n  Controllers,\n  Models,\n\
    \  Routes\n]),\n\nfunction (err) {\n  if (err) {\n    console.log('server.register\
    \ err:', err);\n    return callback(err);\n  }\n\n  server.start(function () {\n\
    \    console.log('server started on port:', server.info.port);\n    return callback(null,\
    \ server);\n  });\n});\n```\n\nAnyone using Async may recognize this pattern,\
    \ as it allows you to easily run many functions. We are big fans of async methods\
    \ and this pattern here is very similar. Internally, hapi uses items, which are\
    \ barebones async methods to accomplish its goals.\nThe register functions signature\
    \ is server.register(plugins, [options], callback).\nThere are a few different\
    \ ways to pass plugins, but the one we show here is how all of our projects are\
    \ organized, and we have many. The best part about the register function way of\
    \ passing plugins is that they can easily be made into their own separate npm\
    \ packages that can be loaded. They can be shared as their own repositories in\
    \ git-hub.\n\nWhat we have found works well when there are many people working\
    \ on a bigger project is that having specific components that have some logical\
    \ divider be each in their own repo. For example, if you have a blogging system,\
    \ you could put all routes that have to deal with posts as their own plugin, and\
    \ all the routes that deal with comments"
