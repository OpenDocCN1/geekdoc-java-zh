    \ (request, next) {\n  // This could be loaded asynchronously from the database\n\
    \  request._sharedContext = {\n    title: 'Hapi-Plugins'\n  };\n  next();\n}\n\
    ```\n\nHere are using the onRequest part of the request lifecycle instead. Like\
    \ the previ-\nous example, we are extending this part of the request lifecycle\
    \ by using the serv-"
