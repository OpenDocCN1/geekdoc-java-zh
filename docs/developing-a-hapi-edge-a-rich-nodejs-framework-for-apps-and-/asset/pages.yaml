- img_proc: true
  md: '# History of lab


    For best results, happy works well with the lab runner. Lab is the testing framework
    that was developed for use with hapi plugins. happy originally used mocha and
    chai to execute tests. However, with Node.js 0.10 was released, happy added support
    for the new release and incorporated domains. Domains have a hairy feature ever
    since their release, testing support not excluded. When 0.10 was released, mocha
    was slow to adopt support for adequately testing domains. As a result of the feature
    for hapi to use domains, something had to be done. As a result, lab was trimmed
    and more features were added.


    Code coverage is an essential factor for ensuring that quality code is being committed
    to repositories. Therefore, code support needs to be baked in the testing framework
    as a simple flag when you run tests.


    Before lab created, mocha tests in hapi were being with the blanket coverage module.
    Blanket itself relies on esprima to create abstract syntax trees (AST) of the
    code in order to help identify statements to insert for code coverage analysis.
    Blanket was carried over into lab when lab was created. However, over time, code
    coverage was baked into lab, instead of being delivered by a third party.


    Code reporting evolved as a result of incorporating the analysis within lab. This
    helps to make code coverage a first class citizen in lab reports. As a result,
    the HTML reporter now identifies the develop lines in their code that will never
    be reachable by tests.


    This makes it to identify areas of code that are dead and can be deleted, making
    your code even more maintainable as a result.


    When hapi was using mocha for testing, it was also using chai to help structure
    the assertions. The hapi maintainers favor writing tests using the expect style,
    as opposed to assert. Over time, the use of chai surfaced a couple of edge case
    function names weren''t consistent with the larger framework. For example, the
    exist property is not executed as a function, unlike some of the other parts of
    the syntax. These inconsistencies led to a few bugs popping up from time to time.
    These bugs had to do with the fact that it was too easy to forget a method ()
    and would result in an assertion that was never executed. Because it was never
    executed, it passed incorrectly.


    As a result, the assertion library named code was created. Code takes the chai
    syntax and make exist a function, just as all of the truthy for true, false, and
    null become functions. Below you can see the differences between chai and code.


    First our example is:


    ```

    expect(foo).to.exist;

    expect(bar).to.be;

    ```'
