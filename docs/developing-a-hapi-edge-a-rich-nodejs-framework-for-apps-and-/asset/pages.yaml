  md: '# # Introduction to hapi


    ![](img/79450811086e2fc8749ec4d309ea2b79_14_0.png)


    # ## History


    hapi’s origin would start at Yahoo! late in the year of 2010 on a project called
    Sled. Sled was a collaborative list-making tool written as an experiment to explore
    empowerment through restrictions by Eran Hammer. Sled was eventually written in
    node and Eran fell in love with the technology. Sled was eventually shut down
    and was generously open-sourced by Yahoo! Postmile in August of 2011. Wanting
    to continue with node, Eran left for Walmart where he took the good parts of Postmile
    and hapi was born on the 5th of August, 2011. Tasked with working on a web services
    layer, the development of hapi continued at Walmart. The original versions in
    hapi used the Express framework. However, it was eventually realized that there
    were limitations with Express for particular requirements faced at Walmart. While
    Express was great, it was missing a lot of things and hapi evolved to it’s own
    standalone framework.


    The name hapi comes from HTTP API server, and once the name was repeated, the
    connection to Ren & Stimpy was made, a cult cartoon from cartoon network. The
    “Happy Happy Joy Song” was featured in many of the early presentations of hapi.


    With the Ren and Stimpy theme in mind, other tools in the hapi.js framework started
    referencing the show in one way or another, with the ultimate goal is that coding
    should be'
