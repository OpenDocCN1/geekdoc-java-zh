  md: '# Testing 10


    In the last chapter (Chapter 9 Templating), we discovered how to respond to requests
    to HTML. With that final piece, you can create your own complete, fully functional
    web application. However, that is not enough! To build real, production-worthy
    applications, you will need to test your code.


    In the hapi universe, testing is extremely important. Testing is important enough
    to the hapi module maintainers that they developed their own testing library,
    named lab, in order to get testing right. Before a pull request can be merged
    into a core module, it must first have working tests as well as 100% test coverage
    of the code in the module. Therefore, if you plan to contribute back to the community,
    understanding how hapi tests are written and executed is essential.


    # Chapter Overview


    The following chapter will cover many basic testing principles as well as the
    topics listed below:


    +   * History of lab

    * Installing lab

    * Writing a simple test

    * Principles of lab

    * Writing a hapi test

    * Code coverage

    * Reporters

    * Linting

    * Plugin testing'
