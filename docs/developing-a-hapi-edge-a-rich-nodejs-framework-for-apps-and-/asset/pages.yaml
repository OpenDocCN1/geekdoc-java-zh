  md: 'Here you can see the method is POST. In the handler we defined previously,
    you can refer to your payload request.payload. In this case the payload has two
    keys, name and email. We send aPOST to the user'' path. Once this server was up,
    in curl we could do something like:


    ```

    curl -XPOST -H "Content-Type: application/json" -d ''{ "name": "Author Name",
    "email": "author@hapi-plugins.com" }'' https://nhapi-plugins.com/user

    ```


    We could also put PUT and it would work the same way.


    # headers


    request.headers is where all of the request headers are stored. Using our previous
    curl, we would see that in your handler, you could refer to request.headers.Content-Type
    and that value would be application/json.


    # The reply


    The reply function in the handler serves as a callback and as a way to return
    control to the framework. The reply function is in charge of replying back to
    the request to give the result of whatever it is that it has been requested.


    Reply takes two arguments in order to comply with the regular callback convention
    where both are an err, and result is passed back. In practice only one of the
    two will be used. If the first argument is an error object, this will be wrapped
    in a Boom object. The argument type of reply can be a wide range of different
    types:


    +   * null

    * undefined

    * string

    * number

    * boolean

    * Buffer object

    * Error object

    * Stream object (Stream objects must be compatible with the "streams2" API and
    not be in objectMode)

    * Promise object (hapi''s testing uses the bluebird lib)

    * any other object or array'
