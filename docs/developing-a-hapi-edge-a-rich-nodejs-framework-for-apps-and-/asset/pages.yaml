  md: "# CHAPTER 2: Server\n\ned good-file that logs your output to a file, which\
    \ can later be processed to a log aggregator (see discussion in Chapter 11). To\
    \ generate the prod config file, you do the same confidence command as before\
    \ change the filter to --filter.env=prod Many times it's convenient during a deploy\
    \ to generate this on the fly and ensure you have the same valid output before\
    \ you start up your server. Invalid JSON will result in errors. Also you will\
    \ see that the opsinterval setting in $base get merged for both filters.\n\nConfidence\
    \ can do even more, but this should empower you to have one configuration for\
    \ your hype server so you can easily maintain your environments. Using confidence\
    \ in combination with rejoice (which uses glue) will keep your ever-changing environments\
    \ manageable.\n\n# Server methods\n\nYou may register methods that are available\
    \ everywhere on the server for access. Doing this is very easy as shown\n\n```\n\
    server.method('spumko', function (next) {\n  console.log('the hapis project was');\n\
    \  console.log('originally called spumko');\n  return next(null, 'called');\n\
    });\n```\n\nThe server methods are then accessed via the server.methods object.\n\
    \n```\nserver.methods.spumko(function (err, result) {\n  console.log(result);\
    \ // prints \"called\"\n});\n```\n\nYou may not want your method to require a\
    \ callback. If so, you can toggle this behavior in one of the options.\n\n```\n\
    server.method('spumko', function (arg) {\n  console.log('the hapis project was');\n\
    \  console.log('originally called spumko');\n\n  return 'called';\n}, { callback:\
    \ false });\n\nconsole.log(server.methods.spumko())); // prints \"called\")\n\
    ```\n\nThe additional options that are available are bind, cache and generateKey.\n\
    \n30"
