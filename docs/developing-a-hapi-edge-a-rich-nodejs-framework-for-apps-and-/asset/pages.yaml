  md: "# Experiments\n\nWhile lab tests can be made to look like mocha and jasmine\
    \ behavior driven-ment (BDD) style tests, they can also be named something else\
    \ entirely. Whereas BDD styles to use describe and it, lab offers the options\
    \ to use experiment and test instead. The functions describe and experiment are\
    \ interchangeable, just as it and test are. The style you choose is entirely up\
    \ to you, and there isn't a wrong answer. One of the things that is nice about\
    \ using the experiments style, however, is that it does reinforce the notion that\
    \ an engineer is creating the tests and there is some attempt to be scientific\
    \ about them.\n\nAn experiment is useful for wrapping a group of similar tests.\
    \ For example, if you are testing lab itself, you may write experiment tests that\
    \ are wrapped in an experiment demonstrated below.\n\n```\n// Load modules\n\n\
    var Code = require('code');\nvar Lab = require('lab');\n\nvar lab = exports.lab\
    \ = Lab.script();\n\nlab.experiment('lab', function () {\n  lab.test('exists',\
    \ function (done) {\n    Code.expect(lab).to.exist();\n    done();\n  });\n\n\
    \  lab.test('has properties', function (done) {\n    Code.expect(Object.keys(lab)).to.not.have.length(0);\n\
    \    done();\n  });\n});\n```\n\nThen if you run these tests in verbose mode,\
    \ you will get the following:\n\n```\n$ lab -v\nlab\n1) exists (3 ms)\n2) has\
    \ properties (1 ms)\n```\n\n2 tests complete"
