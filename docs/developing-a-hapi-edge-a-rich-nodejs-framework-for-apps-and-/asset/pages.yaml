  md: "# Extension points\n\nNow that we've discussed the lifecycle, we can utilize\
    \ 'extension points' in hapi. These extension points' expose streams in the lifecycle\
    \ where other functions can be inserted. They can easily be tied to a server to\
    \ augment the existing hapi lifecycle. We use the server.ext functionality to\
    \ accomplish this. Let's look at a couple of examples. These next examples are\
    \ also shown in Chapter 9 around how to shared context. It's important to know\
    \ what this means now, but let's take a look at how server.ext is used. First,\
    \ let's see anPreResponse event.\n\n```\nserver.ext ('onPreResponse', function\
    \ (request, reply) {\n  var response = request.response;\n  if (response.isBoom()\
    \ && response.source.context) {\n    response.source.context.title = \"hapi-plugins\"\
    ;\n  }\n  return reply();\n})\n```\n\nYou can see that we called server.ext. Recall\
    \ in the request lifecycle, the onResponse towards the end, right before the response\
    \ is given. We add a function here, which we add the title context and return\
    \ back the reply() object.\nThe alternative example in Chapter 9 is:\n\n```\n\
    server.ext ('onRequest', function (request, next) {\n  request.sharedContext =\
    \ {\n    title: 'hapi-plugins'\n  };\n\n  next();\n});\n```\n\nThis time we are\
    \ using the onRequest part of the request lifecycle. Again we don't really need\
    \ to know what this does specifically at this point, but recall that onRequest\
    \ is at the beginning of the lifecycle, depending on where you need to add your\
    \ functionality to the process, how you need to neatly put your logic into the\
    \ flow. Though not discussed, if you needed to add some custom functionality during\
    \ the authentication process, you could utilize onPreAuth or onPostAuth. Keep\
    \ in mind that these may not always be called in the lifecycle if it's not relevant."
