  md: "# View Loading\n\nViews are called and loaded from inside handlers as part\
    \ of the reply step. The reply.view function accepts three parameters (the last\
    \ one is optional): the relative path to the desired template file, the context\
    \ to apply to the template, and an options object to override global engine settings.\n\
    \n```\nhandler: function (request, reply) {\n  var context = {\n    content: 'hello\
    \ world'\n  };\n  // assumes file can be found in views.path + '/path/index'\n\
    \  reply.view('path/index', context, {compileMode: 'sync' });\n}\n```\n\nAs a\
    \ reminder, we do not need 'index.html' because we have already defined the extension\
    \ in the engines portion of the server.views function.\n\n# Layouts\n\nLayouts\
    \ enable you to wrap all templates inside another one. This is useful if your\
    \ website has the same general appearance (logo, header, and footer, for example).\
    \ Then, you only need to design the HTML for a general layout and nest the normal\
    \ template inside the {{content}} context variable.\n\n# Configuration\n\nThe\
    \ most important step in enabling layouts is the configuration. Only two additional\
    \ configuration fields are required: layoutPath and layout. The layoutPath tells\
    \ hapi where to look to layout.{ext}, where the extension is defined under the\
    \ engines option.\nConfiguration does not really change between the different\
    \ templating systems.\n\n```\nvar Hapi = require('hapi');\n\nvar server = new\
    \ Hapi.Server();\nserver.views({\n  engines: {\n    html: require('handlebars')\
    \ // .html is the suffix hapi will look for\n  },\n  path: __dirname + '/views',\n\
    \  layoutPath: __dirname + '/views',\n});\n```"
  merge: -1
