  md: '# CHAPTER 1: Introduction to hapi


    fun as coders can be a bit silly when we write code even though we''re put in
    large-enterprise environments. Relax, and have a bit of fun.


    Feature-wise, hapi was designed to prevent recurring problems experienced with
    other frameworks at the time. That included problems like: middleware ordering
    problems, lack of isolation, slow matching, testability, and lack of commonly
    used built-features. Middleware ordering problems are solved by the hapi Lifecycle,
    which provides controlled, dependency-mapped hook points throughout the life of
    a request when it hits the server, or a response is returned to the user. The
    lack of isolation was solved by domains and later replaced with an even better
    system. Path matching in hapi is built for speed and flexibility. hapi code is
    testable from start to finish (and well-tested, itself!). Finally, via the hapi
    universe (https://github.com/hapi), there are dozens of official hapi plugins
    that are as robust, well-tested, and as flexible as hapi itself. This is addition
    to the hundreds of community modules available on NPM.


    Designed and built entirely in open-source, hapi has also set a very high bar
    for open projects. From the thoroughly code coverage (a process ingress in) the
    beginning thanks to Wyatt Preill, anyone using hapi and related modules can trust
    that it works reliably and behaves as expected.


    hapi has an incredibly long list of satisfied users - not least which is WalmartLabs
    itself, who has prized itself on having the Node.js deployment in the world thanks
    to Black Friday.


    There are a lot of reasons to use hapi. Try it and you will see what a pleasant
    developing web applications in Node.js can be.


    > hapi was able to handle all of Walmart mobile Black Friday traffic with about
    100 CPUs and 28Gb RAM (of we used more but they were sitting idle at 0.75% load
    most of the time). This is mind blowing traffic going through VERY little resources.
    — Er Hammer, https://github.com/hapi/hapi/issues/1326


    # Book overview


    This book will walk you through the process of developing a basic web application
    with hapi. We will be building a searchable repository of hapi plugins. A live
    demo is available at hapi-plugins.com.


    The first seven chapters are all about creating and configuring a hapi server.
    These chapters also cover a lot more tangential information in case you need to
    build in or use a feature not found in hapi-plugins.com. The next two chapters
    (8, 9) cover how to obtain data, process it, and format it. The last three chapters
    (10, 11, 12) cover more advanced topics including some very useful industry practices.


    +   1. Introduction


    This first chapter introduces hapi, the book overview, coding style guidelines,
    and a short walkthrough of the demo application.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '+   2. Server

    This chapter focuses on the configuration of a hapi server. It also covers commonly
    used best practices, examples, and how to customize within the request lifecycle.


    +   3. Routes

    Routes map URLs to code. In this chapter, you will gain a thorough understanding
    of how to match complicated patterns.


    +   4. Handlers

    Handlers are functions responsible for receiving a request from users and returning
    a response. In this chapter, you will see all of the different ways hapi can respond
    to requests.


    +   5. Validation

    Validation (through Joi) is another amazingly helpful feature of hapi. This chapter
    illustrates how powerful validation is and how it can make developers'' lives
    easier.


    +   6. Plugins

    Plugins are middleware done "right." This chapter shows you how plugins enable
    cross-functional, remote teams to work together without causing any of problems
    typically associated with middleware.


    +   7. Authentication

    This chapter provides a thorough step-by-step walkthrough of how to enable authentication
    and set cookies.


    +   8. Models

    This chapter walks through connecting to a third-party RESTful API for your hapi
    web application. Then, it also walks through connecting to a MongoDB database
    for your hapi web application. It also showcases examples of how to operate in
    two other popular databases (Cassandra & PostgreSQL).


    +   9. Templating

    In this chapter, you will see how to separate data from presentation in the handlers
    responses.


    +   10. Testing

    Testing is often misunderstood or difficult to learn. This chapter will empower
    you to add tests to your web application, which improves robustness and code quality.


    +   11. Debugging

    This chapter walks through some of the hard-earned debugging tricks we''ve learned
    running one of the largest Node.js deployments in the world. In this chapter,
    you will learn how to inspect a running service, track statistics, trace memory
    leaks, and identify other problems.


    +   12. Security

    This chapter covers some industry best practices regarding securing your web application.'
