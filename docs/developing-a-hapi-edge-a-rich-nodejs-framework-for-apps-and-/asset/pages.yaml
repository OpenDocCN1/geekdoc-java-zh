  md: '# Templating 9


    In the last chapter (Chapter 8 Models), we saw how easy it was to obtain and store
    data. Now, we will see how to present the data back to the user.


    hapi is primarily intended for building RESTful JSON APIs. However, working in
    it is often essential or helpful to respond to HTTP requests with HTML to be rendered
    by a browser. Since the output responses depend on the input, or on which user
    requests the data, it is not always possible or ideal to hardcode the same response
    for every response. The best method to customize responses is with templating.
    In hapi, templates are referred to as views.


    hapi supports most templating engines out of the box. This chapter will include
    working examples for six of the most popular engines: Handlebars.js, Mustache.js,
    Jade, Dust, eco and ECT. For an overview of them, please see the Appendix at the
    end of the book.


    In a typical web application, the user visits a URL, the URL maps to a handler
    in a web server, the handler does some business logic to prepare data, and finally,
    the web server responds with data to the end-user in HTML format.


    There are many different ways to respond with HTML. The two primary methods are
    concatenation and modern templating systems.


    In the old days of web development, HTML was generated by concatenating orating
    HTML strings with variables, like this:


    ```

    var html = ''<html><title>'' +

    page_title +\n''</title></head></body>'' +

    content +

    </body></html>'';

    return reply(html);

    ```


    Thankfully, this tedious and inflexible method has gone out of style and has been
    replaced by modern templating systems. However, this concatenation method is still
    possible, some teams may use it for the sake of efficiency in the case of one-line
    responses.


    Meanwhile, with respect to modern web applications, a templating system merges
    a template responsible for output formatting data into a consistent format - like
    HTML. For example, a Handlebars (or Mustache) template like this:'
  merge: -1
