  md: "bind sets the context for the method and defaults to the context when the method\
    \ was created. If you want some other content, this is the place to do it.\ncache\
    \ has the same configuration, which will be discussed in Configuring for caching.\n\
    Finally, generateKey is a function that's used to create a unique key for caching\
    \ purposes.\n\n# Decorating the server\n\nUsing server.decorate, you can add functions\
    \ directly to the server object. This is different from server.method where you\
    \ add methods to access via server.methods. In addition to decorating the server\
    \ object, you can also decorate the reply object, and we'll cover that in Chapter\
    \ 4.\n\n```\nserver.decorate('server', 'success', function () {\n    return this.response({\
    \ success: true });\n});\n```\n\n# Configuring for caching\n\nWe can use server.cache\
    \ to setup a cache. hapi has a built-in server cache facility and it relies on\
    \ the hapi plugin cache. By default, there is a built-in memory cache catbox-memory\
    \ supported by other types of cache engines like redis, MongoDB, memcached, and\
    \ others. Please refer to the catbox documentation for more details on these strategies.\
    \ Here is a simple example of how to use server.cache.\n\n```\nvar cache = server.cache({\n\
    \    segment: 'plugins',\n    expiresIn: 60 * 60 * 1000\n});\n\ncache.set('pluginName',\
    \ { author: 'mindy' }, null, function (err) {\n    cache.get('pluginName', function\
    \ (err, value, cached, log) {\n        // value === { author: 'mindy' };\n   \
    \ });\n});\n```\n\nWe have here setup a cache, with a segment of plugins. Segments\
    \ are used to isolate cached items within the cache partition. When you call this\
    \ within a plugin, it defaults to ! name where name is the name of the plugin."
