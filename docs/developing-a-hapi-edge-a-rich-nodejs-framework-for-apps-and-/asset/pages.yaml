    \ },n  'license': { type: String, required: false },n  'repository': { type: String\
    \ },n  'homepage': { type: String },n  'updated_at': { type: Date, default: Date.now\
    \ },\n  'created_at': { type: Date, default: Date.now },\n  'keywords': { type:\
    \ Array },\n  'dependencies': { type: Array },\n  'dependents': { type: Array\
    \ },\n  'stats': {\n    'releases': { type: String },\n    'downloads': { type:\
    \ String },\n    'downloads_this_month': { type: String },\n    'open_issues':\
    \ { type: String },\n    'pull_requests': { type: String }\n  }\n});\n\nvar plugin\
    \ = Mongoose.model('plugin', internals.plugin);\n```\n\n102"
