  md: "made into this parameter. Our method in the server route is a POST and this\
    \ JSON object gets translated to the payload object.\n\nYou can see that validation\
    \ is done on the payload. The password passed in the payload is a string of at\
    \ least eight characters and is a required field. In addition we are telling happy\
    \ that the response is expected to be a JSON structure with a success value of\
    \ true or false.\n\nYou may be asking yourself, why is response not under the\
    \ validate section? The validate section is strictly for inputs. It is not obvious\
    \ when you first use hash with joi. Output (the response) validation can be extremely\
    \ important if you rely on another API for your work. Having output validation\
    \ gives you confidence that you are getting the right things from it.\n\nAs you've\
    \ seen in our code far we like to have everything broken up and are using the\
    \ config quite extensively. Because the validation schema can get long we often\
    \ put the validation rules in the internals variable.\n\nThe internals variable\
    \ is the place to put all top-level variables in a file. This prevents pollution\
    \ in scope. This is especially useful in cases where we have to access the schema\
    \ in multiple places to handle the validation. The example below demonstrates\
    \ this.\n\n```\nvar internals = {\n  pluginSchema: Joi.object().keys({\n});\n\
    };\n// Get plugin data\\exports.get = {\n  description: 'get plugin data for a\
