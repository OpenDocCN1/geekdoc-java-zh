  md: "# CHAPTER 3: Routes\n\n```\npath: '/'\nconfig: Welcome.index\n\n);\n```\n\n\
    Then the actual config for the route is in a corresponding file called 'lib/controllers/welcome.js'.\n\
    \n```\nmodules.export.index = {\n    description: 'Show the main page for our\
    \ welcome page',\n    handler: function (request, reply) {\n        reply.view('index');\n\
    \    }\n};\n```\n\nThis keeps code logically separated, which is typical of an\
    \ MVC (Model-View-Controller) framework. The logic in the code can get quite extensive,\
    \ and with this separation, it can easily be organized so that the logic for a\
    \ particular route is all in one file. You may decide to go that route, which\
    \ would be as simple as keeping that logic in a file called lib/controllers/welcome/index.js\
    \ instead. Perhaps terms of service would be in lib/controllers/welcome/tos.js\
    \ under this structure. Of course, there be some sense to how large a function\
    \ is before it splits out into its own file. But the idea is that the code, when\
    \ broken up into smaller pieces, is far easier to manage and read.\n\n# Path processing\n\
    \nRoutes are unique. Several issues on GitHub have been opened asking about regular\
    \ expressions, or other types of globbing. It can be difficult to figure out when\
    \ routes overlap. One of the early design goals of hapi was to ensure that the\
    \ routing table would be identical each time it is loaded. There would be no surprises.\
    \ When starting up, hapi will complain about any conflicts and protect you from\
    \ these types of issues.\n\nHow path processing works in hapi, the router iterates\
    \ through the routing table on each incoming request and executes the first (and\
    \ only matching) route. Route matching is done on the request path only (excluding\
    \ query and other URI components). The requests are matched in a deterministic\
    \ order, so it doesn't matter where you add them. Finally, the routes are sorted\
    \ from the most specific to the most generic. If you want further details on exactly\
    \ how that works, see Path Matching Order.\n\n# Parts of the route\n\nA route\
    \ object, the argument to server.route() consists of just a few easy properties."
