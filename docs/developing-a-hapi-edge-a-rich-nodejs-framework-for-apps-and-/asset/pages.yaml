    # Server router config options


    There are just two options that can be set as part of the server itself.

    stripTrailingSlash is quite a useful one, but it''s false by default. The purpose
    of this route is if there''s a route that looks like /plugins/like and the request
    goes to /plugins/like/ then there will actually be a 404 error since it didn''t
    match the route. With this option set, the server will strip the trailing slash
    so that the route will work.

    isCaseSensitive defaults to true, which means the routes are case sensitive. It
    would be poor design to have a route called /blah and another called /Blah that
    do different things. This setting means both are treated the same.


    # Summary


    Routes are the path that requests go through in our system. It defines how the
    requests are handled, and defines how, and the variables we have access to when
    processing the request. Routes in hapi are unique and have no overlapping possibilities.
    They are predictable. Routes can be configured with cache settings as well as
    defined for a specific virtual host (domain name).


    Next''re going to look at the handlers that are defined as part of a route.'
