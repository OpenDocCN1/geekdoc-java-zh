  md: "# Routes 3\n\nIn most places, the term route is associated with a certain path\
    \ that you can take to get to your destination. When driving from point A to B,\
    \ for instance, you may have the option of several different routes. A route is\
    \ a very specific path between the two points.\nnHapi and other frameworks, a\
    \ route is a specific path that a request takes. On a website, the number of characters\
    \ you can write after the address hapi-plugins.com are only limited to the number\
    \ of characters your browser will support. In order to send a request and actually\
    \ get a response for what you're looking for, you need to know the route of where\
    \ to send the request. The query then travels through a path within the framework,\
    \ and a response is returned based on several parameters as part of the request.\
    \ The actual route you told the route to take is key for knowing how to handle\
    \ this request. It's the first indication of what the client is expecting it to\
    \ do with the request.\nIn its simplest form, a route looks like the following:\n\
    \n```\nserver.route({\n  method: 'GET',\n  path: '/',\n  handler: function (request,\
    \ reply) {\n    reply.view('index');\n  }\n});\n```\n\nThis is a great obvious\
    \ form for short and simple routes, but when the project gets larger we separate\
    \ out the behavior to use config instead of supplying the handler like we see\
    \ here.\nWe typically store the config in their own file. Before we look at what\
    \ we've done for this project, we will simply even further.\nIn our lib/routes.js\
    \ file we have the following:\n\n```\nvar Welcome = require('./controllers/welcome');\n\
    server.route({\n  method: 'GET',\n```"
