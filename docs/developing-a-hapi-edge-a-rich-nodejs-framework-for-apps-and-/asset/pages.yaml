    of the objects on the heap. This is useful for helping to identify memory leaks
    in an application, as you can often find large numbers of objects consuming a
    large percentage of the servers'' memory. A screenshot of the selected heap snapshot
    in the profile tab is shown here.


    ![](img/79450811086e2fc8749ec4d309ea2b79_148_1.png)


