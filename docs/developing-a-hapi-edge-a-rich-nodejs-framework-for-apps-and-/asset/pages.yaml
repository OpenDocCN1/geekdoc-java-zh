  md: "```\nlayout: true\n));\n```\n\n# Usage\n\nUsage is actually very simple after\
    \ a proper configuration. Nothing changes on the handler side:\n\n```\nhandler:\
    \ function (request, reply) {\n  var ctx = {\n    msg: 'Hello world!'\n  };\n\
    \  return reply.view('/path/' + templateName, ctx);\n}\n```\n\nThe template will\
    \ be loaded through the content variable in the layout.\n\n# Exclusion\n\nSometimes\
    \ you want to apply layouts to all templates, except for certain ones. This is\
    \ exceptionally easy to do. You just need to include a third optional configuration\
    \ parameter to reply.view that sets layout to false.\n\n```\n// Inside an handler\n\
    return reply.view(template_name, context, { layout: false });\n```\n\n# Partials\n\
    \nPartials are great. Partial templates allow you to factor out shared snippets\
    \ of templates to use between other templates. This prevents you from being forced\
    \ to modify code in multi-places; you can edit once and reflect in all templates.\n\
    \n# Configuration\n\nTo enable partials, you need to add only a single view option,\
    \ partialsPath, which tells hapi where to look for partials. When you reference\
    \ partials, the partials will be relative to this path.\n\nConfiguration does\
    \ not really change between the different templating systems. Some engines, however,\
    \ may require small tweaks to work with hapi's partial system. For example, for\
    \ Hogan.js mustache templates, there is a convenient pre-tweaked version at hapihogan."
