  md: "# CHAPTER 8: Models\n\ndefine how your data is structured and can help you\
    \ enforce data types. It helps to know\nhow you plan to access and use the data\
    \ first.\n\nFor the hapi-plugins.com application, we plan to allow anonymous visitors\
    \ to:\n\n+   - Search for plugins by name, description, author, and keyword.\n\
    - Log in & manage your plugins\n- Add your own plugin to the list\n- Like or unlike\
    \ a plugin\n\nIn the background, we also need to be able to:\n\n+   - Add a plugin\
    \ to the list\n- Remove a plugin from the list\n\nTherefore, we know plugins must\
    \ have a name, description, author(s), and keywords.\nPM prevents duplicate module\
    \ names, so we know that names will be unique and\nthus can use name as a primary\
    \ key. Also, we know from looking at NPM mod-\\ules also have versions, licenses,\
    \ repository URLs, homepages, dependents,\na a bunch of statistics. It also has\
    \ time information about when the module was created\nand Updated. From this,\
    \ we can define our first schema for our hapi-plugins app.\n\n```\nvar internals\
    \ = {};\n\ninternals.plugin = new Mongoose.Schema({\n  'name': { type: String,\
    \ required: true },n  'description': { type: String, required: false },n  'version':\
