  md: "# Decorating the reply\n\nSimilar to server.bind this function itself to use\
    \ reply. Decorate is more narrow in the scope that it can be used, but it's perfect\
    \ for canned replies.\n\n```\nserver.decorate('reply', 'success', function ()\
    \ {\n  return this.response({ success: true });\n});\n```\n\nWe have an option\
    \ to decorate the reply object or the server object and the first argument where\
    \ we specify which one. The second argument specifies the name of the method and\
    \ the third argument is the callback back.\nin our handler, we can simply call:\n\
    \n```\nreply.success();\n```\n\nThis is a very nice shortcut and saves from changing\
    \ in multiple places if the JSON object changes. It's also a nice means to make\
    \ sure the replies for success are consistent because it eliminates typos.\nYou\
    \ can find more about decorating the server object in Chapter 2.\n\n# Tails\n\n\
    Certain actions do not require immediate completion. The type of calls may be\
    \ a background job of some sort, which is not necessary for the return of the\
    \ page served to the client. It may be a database call for some update, or it\
    \ may be any number of things. While not necessary to capture this, we are still\
    \ likely to capture this for logging purposes. When the tails are captured for\
    \ the request, the server emits a tail event.\n\n```\nserver.route({\n  method:\
    \ 'GET',\n  path: '/',\n  handler: function (request, reply) {\n    var publishTail\
    \ = request.tail('publish the book in the background for download');\n\n    HapiBook.publishForDownload({format:\
    \ 'pdf'}, function (downloadUri) {\n      var mail = Mail({to: user});\n     \
    \ mail.publishNotification(downloadUri, function () {\n        publishTail();\n\
    \      });\n    });\n  }\n});\",\n```"
