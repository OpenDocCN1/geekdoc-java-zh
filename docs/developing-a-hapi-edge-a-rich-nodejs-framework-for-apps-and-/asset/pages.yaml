  md: '# ECT


    ECT was created by Vadim Baryshev. It claims to be the “fastest JavaScript templating
    engine with embedded CoffeeScript syntax”. ECT focuses on performance and quality-of-life
    development features such as automatic reload, JavaScript & CoffeeScript logic-port
    in templates, multi-line expressions, and tag customization.'
