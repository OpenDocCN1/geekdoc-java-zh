    \ you should use code, chai, or any of the other modules that you prefer. You\
    \ can, again, run npm install code --save-dev to save this in your package.json\
    \ file or add it manually.\n\n# Writing a simple test\n\nAll tests should be located\
    \ in a test folder within the root of your project. This is a pattern that is\
    \ nearly ubiquitous in the Node.js community. How you choose to name your test\
    \ files is up to you, as there isn't an established naming convention across the\
    \ board. However, a pattern that is used throughout the modules in the happy organization\
    \ is to name each test file the same as the corresponding module that it's responsible\
    \ for testing. For the purposes of this exercise, create a file in test named\
    \ index.js. Populate index.js with the code found below.\n\n```\n// Load modules\n\
    var Code = require('code');\nvar Lab = require('lab');\n```\n\n```\nvar lab =\
    \ exports.lab = Lab.script();\n\nlab.test('lab exists', function (done) {\n  Code.expect(lab).to.exist();\n\
    \  done();\n});\n```\n\nSimply type the command lab in the root of the project\
    \ to run the test above. The output will look like following:\n\n```\n$ lab\n\
    ```"
