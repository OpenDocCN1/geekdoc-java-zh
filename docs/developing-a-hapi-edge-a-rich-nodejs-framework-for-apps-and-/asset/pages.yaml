    \ TRACE OPTIONS CONNECT PATCH. In practice, it will likely be one of GET, POST,\
    \ PUT, DELETE or PATCH, and HEAD is not allowed. hapi allows wildcard methods\
    \ to be used, which means that when the exact match isn't found, it will use the\
    \ wildcard instead. The wildcard string is *.\n\n# vhost\n\nSpecify, this is a\
    \ virtual host for this route to listen to. A server can be listening to more\
