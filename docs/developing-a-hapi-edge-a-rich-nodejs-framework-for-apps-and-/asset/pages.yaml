  md: "# Organizing handlers\n\nThere are many ways to organize code. For simple routes,\
    \ perhaps it makes sense to throw everything in a route. Here is the simplest\
    \ example:\n\n```\nserver.route({\n  method: 'GET',\n  path: '/',\n  handler:\
    \ function (request, reply) {\n\n    reply.view('index');\n\n  }\n});\n```\n\n\
    However, when working on large projects, we have found that the use of route configuration\
    \ can get cluttered to do this way. This is where we use it (see Chapter 3) to\
    \ make life easier for us.\n\nWe have organized the code into lib/routes.js, which\
    \ is our destination for all of our routes. Whenever we add a new route, or to\
    \ see the routes, we have all in one simple location. It's a nice convention to\
    \ follow. It doesn't have to be a routes.js file, since we could also put them\
    \ in lib/index.js. This clearly named file, however, makes it obvious to everyone\
    \ where it is.\n\nA typical setup could have the config for the route living in\
    \ a completely different file instead, and in that file is where the handler resides.\n\
    Ourhapi-plugins.com example, has only this in the routes file:\n\n```\nserver.route({\n\
    \  method: 'GET',\n  path: '/',\n  config: Controllers.Home.get\n},\n// ...\n\
    });\n```\n\nWhen architected correctly and the handlers are large, putting each\
    \ route in its own file can really make the code easier to read. When starting\
    \ a new route, a file with conventions can simply be copied over and the handler\
    \ itself modified. It makes for a very clear and easy to read structure.\n\nMore\
    \ discussion on the above example can be found in Chapter 6 if you want more details."
  merge: -1
