    \  handler: function (request, reply) {\n    // ...\n  }\n};\n```\n\n# Validation\
    \ for hapi-plugins.com\n\nLet's take a look at the search function for hapi-plugins.com.\n\
    \n```\nmodule.exports.search = {\n  validate: {\n    query: {\n      q: Joi.string(),\n\
    \      sort: Joi.string().optional(),\n    }\n  }\n};\n```"
