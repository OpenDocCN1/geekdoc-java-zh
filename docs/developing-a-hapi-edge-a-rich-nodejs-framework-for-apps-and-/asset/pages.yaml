  md: '# The handler 4


    The handler at its core, is what handles the incoming request for a specific route.
    It determines how the request will be “handled.” The configuration for the route
    plays a critical part in how the handler needs to behave, and since it''s tightly
    coupled, some configuration for the route needs to be taken into consideration.


    When we specify a route for a request, for example, if you''re going to download
    a file from /downloads/<filename> then it is the handler that has all of the logic
    in it finding the file in question in order to send it to the client. The handler
    may also do several things, like counting many times the file has been downloaded,
    access control making sure not just anyone has access to download the file, and
    so on.


    The handler function “handles” all of the decisions and logic between accepting
    a request from the client and returning a response to the user. has some nice
    features to offload some work automatically, such as validation. We will look
    at this in more detail in Chapter 5. All of what could be done manually in the
    handler if we ignore the convenience of (why would we dream of doing that though?)


    The handler is generally a callback function that is comprised of two arguments:
    the request and the reply. There are multiple other-built handlers in that we
    will also go over and discover.


    This chapter will cover the various different use-cases for the handler. We''re
    going to delve into the arguments of the handlers and various methods for making
    life in the handler easier for ourselves.


    # The request


    The request object contains all of the information pertaining to the incoming
    request to the server whether it is from a browser, or some other tool using the
    API. Since the routing already determines which request will be handled depending
    on the method, the request received will be limited to whatever is specified.
    At the end of the day, the full request is available here, which contains the
    headers and the request to find out all of the data content.


    Refer back to the lifecycle of the request to find out how the request travels
    through the framework.'
  merge: -1
  pgno: 44
- img_proc: true
  md: "# CHAPTER 4: The handler\n\nAttached to the requests is a whole slew of important\
    \ and useful information that gets used in the handler in order to fulfill a request.\
    \ In the rest of this section we're going to take a look at how to find this data\
    \ and what you can do with it.\n\nBear in mind that there are other functions\
    \ in the request lifecycle (see Chapter 2) that can add data to the request along\
    \ the way. We're going to take a look at a few common ones.\n\n# parameters\n\n\
    Some of the request object data is set as part of direct configuration of the\
    \ route. For instance, if the route has defined a path that contains an id of\
    \ a hapi plugin to download, then that will be part of the parameters access on\
    \ the request object.\n\n```\nserver.route({\n  /\n    method: 'GET',\n    path:\
    \ '/plugins/(name)',\n    config: Controllers.Plugin.get\n  }\n///\n});\n```\n\
    \nThe name is the identifier in our case, and this will be accessed via request.params.name.\
    \ In the above example we have a GET method. Assuming port 8080, if we did a:\n\
    \n```\ncurl -XGET http://localhost:8080/plugins/pluginName\n```\n\nWe'd get the\
    \ back what is returned in Controllers.Plugin.get. We will be contrasting this\
    \ with other methods when we talk about payload.\n\n# query\n\nIt can be confusing\
    \ for new people to hapi, the difference between a param and a query. The query\
    \ part of the URL in https://hapi-plugins.com/search?q=pluginName is the part\
    \ ?. Take a look at the previous example for /plugins/{name} to contrast this.\
    \ The name param was strictly part of the path.\n\nThe request.query contains\
    \ all of the value pairs that are sent along a query in the URL.\n\nFor example,\
    \ we could be a bit crazy with the URL to get the information about a particular\
    \ plugin on hapi-plugins.com and request something like:\n\n```\nhttp://localhost:8080/plugins/blipp?hello=hi\n\
    ```"
  merge: -1
