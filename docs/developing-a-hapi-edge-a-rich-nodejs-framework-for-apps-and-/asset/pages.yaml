    \ are as follows:\n\n+   - path - See handler for an explanation of the various\
    \ ways of setting this.\n- index - Can be true, false, or a string representing\
    \ the name of the index file to look for. The default file is index.html and it\
    \ is set to true.\n- listing - Determines whether a directory listing should show\
    \ in the absence of an index file. Defaults to false.\n- showHidden - Determines\
    \ if even hidden files should be displayed in the listing. Defaults to false.\n\
    - redirectToSlash - if there's a trailing slash, this will be redirected to the\
    \ path without the slash.\n- lookupCompressed - If true, it looks for the same\
    \ filename with '.gz' suffix for a pre-compressed version of the file to serve\
    \ if the request supports content encoding. Defaults to false.\n- defaultExtension\
    \ - A string that is appended to file requests if the requested file is not found.\
    \ Defaults to empty string.\n\n# VIEWS HANDLER\n\nThe views handler displays information\
    \ using templates. In practice, this option isn't very commonly used. The more\
    \ common approach is configuring the server with the views option, and then using\
    \ the regular handler with reply.views().\n\nBecause hapi supports both, we'll\
    \ take a look at the views handler, and focus more on how to configure the server\
    \ to directly support views with reply.views().\n\nFor our hapi-plugins project,\
    \ we're not using a views handler, but it should be mentioned how for whatever\
    \ reason, the regular server.views needs to be overridden.\n\nIn both cases, the\
    \ server is configured with a views manager.\n\n```\nplugin.views({\n  engines:\
    \ {\n    html: {\n      module: require('handlebars')\n    }\n  },\n  path: __dirname\
