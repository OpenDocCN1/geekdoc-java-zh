  md: "# CHAPTER 2: Server\n\nWe also have an expiresIn setting, which is set to expire\
    \ the cached item in one hour.\nThere is also interesting setting called staleIn\
    \ where you can mark the item stored in cache as stale. This setting is less than\
    \ expiresIn. Using this feature, you can have the cache ready by the time expiresIn\
    \ comes. If staleIn doesn't have sufficient time before expiresIn, it will just\
    \ work like the usual expiresIn. This is warming up your cache.\n\nFinally, you\
    \ can see that we use cache.set() to set the pluginName with the value of the\
    \ author object and we can retrieve that using the cache.get() method.\n\nThere\
    \ are more options to server.cache and get more details visit the hapis.js documentation.\n\
    \n# Request lifecycle\n\nUnderstanding how a technology handles an HTTP request\
    \ is fundamental in developing secure, efficient applications using that technology.\
    \ Node.js itself doesn't provide much in this regard, although creating a server\
    \ is fairly simple in Node.js:\n\n```\nvar server = require('http');\n\nserver.on('request',\
    \ function (request, response) {\n  // do something\n});\n\nserver.listen(80);\n\
    ```\n\nThat's just, a function. The request has all of the inbound information\
    \ from the origin of the request, and has a writable stream that needs to have\
    \ headers set, information written to it, and then have the connection closed.\
    \ At first this can be exciting, especially for those who haven't dealt with it\
    \ in the past. Once an application needs a routing table however, it becomes taxing\
    \ to deal with.\nThe way in which high deals with the requests is by having a\
    \ reliable series of events each time a request is received by the server. Here's\
    \ the full lifecycle:\n\n+   * 'onRequest' extension point\n  * always called\n\
    \  * the request object passed to the extension functions is decorated with the\
    \ request.getUrl() and request.setMethod() methods. Calls to these methods will\
    \ impact how the request is routed and can be used for rewrite rules.\n  * request.route\
    \ is not yet populated at this point.\n\n32"
