  md: "# Options\n\nWhen configuring views, there are three main options to configure:\
    \ engines, compileMode, paths. In the next section, we'll discover the various\
    \ sub-options you may need to make your views work properly.\n\n# ENGINES\n\n\
    The engines configuration object tells views what file extensions to look for\
    \ and what templating engine should be used.\n\nThe engines object expects file\
    \ extensions (without the dot '.') as keys and templating system compilers as\
    \ values. The below example (\"engines-breakdown.js\") would match anyfilename.extension\
    \ and use the some_compiler engine.\n\n```\nengines: {\n  \"extension\": require('some_compiler')\n\
    },\n/* ... */\n```\n\nUsing this system, it is possible to mix and match multiple\
    \ templating systems as long as all use different file extensions:\n\n```\nvar\
    \ Hapi = require('hapi');\n\nvar server = new Hapi.Server(\nserver.views({\n \
    \ engines: {\n    html: require('mu'),\n    jade: require('jade'),\n    hbs: require('handlebars')\n\
    \  },\n  defaultExtension: 'hbs',\n  path: __dirname + '/views'\n});});\n```\n\
    \nIf you mix and match engines for whatever reason, you should be aware of a couple\
    \ of things. If you want to use the reply.view('templateName', context) syntax,\
    \ it is important to understand what the default extension is. In the above example,\
    \ you can see how we pick hbs as that default extension. This setting isn't required.\
    \ You can just add the extension like reply.view('templateName', context). If\
    \ the file has an extension that isn't your defaultExtension then you need to\
    \ give it that extension."
  merge: -1
  pgno: 110
- img_proc: true
  md: "# CHAPTER 9: Templating\n\n# COMPILEMODE OPTION\n\nThe compileMode option is\
    \ used to tell hapi whether to expect a synchronous templating or an asynchronous\
    \ one. hapi expects the engine object to contain a compile method that can be\
    \ either format, but not both. By default, hapi expects synchronous engines. Here\
    \ is a synchronous compile function.\n\n```\n{\n  compile: function(template,\
    \ options) {\n    return function(context, optionsOverride) {\n      // return\
    \ string template integrated with context\n    }\n  }\n}\n```\n\nNext we are doing\
    \ the same asynchronously.\n\n```\n{\n  compile: function(template, options, callback)\
    \ {\n    var error = null;\n    return callback(error, function(context, optionsOverride,\
    \ internalCallback) {\n      var output = ''; /* set with string template integrated\
    \ with context */\n      return internalCallback(null, output);\n    });\n  }\n\
    }\n```\n\nDepending on the templating engine, you will see later on that the default\
    \ compileMode may need to be overridden to 'async'.\n\n# PATHS\n\nhapi views to\
    \ know where to look for template files. There are multiple path configurations\
    \ depending on your project's needs.\n\n+   * path: points to the main directory\
    \ to look for template files\n* partialsPath: points to the directory where to\
    \ look for partials (if the engine supports Partials)\n* helpersPath points to\
    \ directory where template helper functions are defined (if the engine supports\
    \ Helpers)"
  merge: -1
  pgno: 111
- img_proc: true
  md: "+   - layoutPath: the directory that contains the layout template (usually\
    \ layout.{extension}) or layout.html\n\n+   - relativeTo: path used as a prefix\
    \ to other directories (enables relative paths in the other paths)\n\nAdditionally,\
    \ there are two potentially important path-related settings:\n\n+   - allowAbsolutePaths:\
    \ (boolean) that enables the use of absolute paths in path settings (default:\
    \ false)\n\n+   - allowInsecureAccess: (boolean) that enables support for moving\
    \ up directories (using '../')\n\nThe allowInsecureAccess variable should be used\
    \ with extreme caution. can potentially enable users to access otherwise secure\
    \ files on the server's operating system such as password files, files with sensitive\
    \ data, and more.\n\n# GLOBAL SPECIFIC\n\nAll of the global view settings can\
    \ be applied to a specific individual templating engine that will override any\
    \ global settings. This requires moving the compiler object (typically, the result\
