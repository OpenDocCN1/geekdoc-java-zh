    \      module: require('handlebars'),\n      compileMode: 'sync'\n    }\n  }\n\
    \  path: '/path'\n}\n```\n\n# MORE OPTIONS\n\nMore options are detailed in the\
    \ API documentation.\n\n# STARTER EXAMPLES\n\nFirst let's start out with Mustache.js.\n\
    \n```\nvar Hapi = require('hapi');\n```"
