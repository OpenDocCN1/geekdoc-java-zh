  md: "# Server 2\n\nhapi is a framework used for building applications and services.\
    \ Behind every service, there is a server; something that serves the client needs.\
    \ hapi is at its core a superset of an HTTP server. Everything else configured\
    \ is tied to this fact, so we kick off this book talking about the main functionality.\
    \ It's from this that everything else is configured and makes a difference. We're\
    \ going to be talking about a lot of concepts that are related to the server,\
    \ plugins, handlers, testing, and more.\n\nIn this chapter we look at how to set\
    \ up a server and how we've set up the server for our hapi-plugins.com example.\
    \ We're going to teach you the ins and outs of the server in the hapi framework.\
    \ You'll get how to know how to set up caching. You'll get a first glimpse into\
    \ plugins and how to add methods that will be available throughout your application.\
    \ Finally you will learn about the request lifecycle and how to add custom functions\
    \ for your application.\n\n# Setting up a simple server\n\nOf course we can't\
    \ start a book without first having a hello world example. Well, yes we can actually,\
    \ but we're not going to. It's important to know how to set up a server in its\
    \ simplest configuration before advancing to more complex setups.\n\n```\nvar\
    \ Hapi = require('hapi');\n\nvar server = new Hapi.Server();\n\nserver.connection();\n\
    \nserver.route({\n    method: 'GET',\n    path: '/',\n    handler: function (request,\
    \ reply) {\n        return reply('hello hapi');\n    }\n})\n```"
