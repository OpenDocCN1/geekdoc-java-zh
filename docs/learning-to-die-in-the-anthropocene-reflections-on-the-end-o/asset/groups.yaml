    much longer periods of colder temperatures every hundred thousand years or so.³31
    These periods are typically brief, geologically speaking, each lasting ten thousand
    years.


    So it was for our ancestors on the Sahara: After a few millennia, temperatures
    dropped, getting even colder than (between 7 and 10 degrees Fahrenheit colder
    than the present), glaciers once again advanced toward the equator, and the oceans
    shrank. The Sahara lost the warmth that it had kept, and our hunter-gatherer ancestors
    scattered back to tropical Africa, east to the Nile valley and beyond, and north
    around the Mediterranean and into Europe, where they lived alongside, interbred
    with, and then wiped out our cousin, the Neanderthal. Over a long winter lasting
    thousands and thousands of years, as minor climate variations shifted temperatures
    up and down slightly over decades and centuries, human hunting bands expanded
    across Asia, eventually crossing the Bering land bridge to the Americas.


    Sometimes in that period, between one hundred thousand and fifty years ago, we
    developed the key social technologies that have proven our most substantial predatory
    advantages: culture and symbolic reasoning.³32 This advance was undoubtedly part
    of what helped us exterminate the Neanderthals and survive the harsher winters,
    and it also helped us turn the basic tool-use we had inherited from earlier hominids
    into the intricate technologies of the Cro-Magnon hunter: multilayer winter clothing,
    mammoth-bone houses, sewing needles, antler-tipped spears, religious rituals,
    and sophisticated tribal organization. From from about fifty thousand to about
    ten thousand years ago, Upper Paleolithic peoples experienced a veritable cultural
    explosion. The artifacts they show technologies more advanced in almost every
    way than those of their predecessors, more varied, more elaborate, more refined,
    and more beautiful, with some tools seemingly designed to be purely aesthetic
    in function—which is to say, works of art.³33


    After about fifteen thousand years before Hurricane Katrina, the planet started
    to warm up again, entering another interglacial period, with the most intense
    and rapid warming happening around 11,000 BCE. Humans began developing villages,
    basic animal husbandry, and more deliberate systems of gathering. A brief, localized
    cold snap caused the Younger Dryas, caused by glacial meltwater spilling into
    the Atlantic Ocean and shutting off'
