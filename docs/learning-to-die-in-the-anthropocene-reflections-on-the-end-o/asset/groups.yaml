    Following Tang Jie, Harvard economist Robert Stavins delivered a brief executive
    summary of the carbon-pricing study he''d headed, “Facilitating Linkage of Heterogeneous
    Regional, National, and Sub-National Climate Policies Through a Future International
    Agreement."76 According to Stavins, the best result we could expect from the Paris
    2015 United Nations Framework Convention on Climate Change meeting would be a
    carbon market loosely linking various national, regional, local, and corporate
    systems of carbon pricing and regulation through a unified monitoring system in
    which nations would—”specify their targets, actions, policies—or some combination
    of these—to reduce greenhouse-gas emissions."77n This sounded ominously vague;
    I was soon to understand how empty it was really. The last panel featured spokespeople
    from Statoil, the Environmental Defense Fund, GDF Suez, and Barclay’s, all offering
    more or less hopeful perspectives on the wondrous possibilities of carbon trading,
    but the key message seemed to be the one delivered by David Home, Chief Climate
    Advisor for Shell, who translated Stavins’ bureaucratese into the much franker
    pronter that the only kind of carbon-pricing agreement that had any chance chance
    of being signed in Paris would have to be totally nonbinding—which meant totally
    unenforceable.


    As with the protesters downtown, everyone in the room seemed to agree that somebody
    needed to do something about climate change, and soon. But unlike the protesters
    at downtown to Flood Wall Street who saw capitalism as the underlying problem,
    the folks at the Harvard Club saw capitalism as the only possible framework for
    solutions. For the IETA, international legal agreements, corporate management,
    and market-based mechanisms were the only functional machinery for forging a global
    response to a global crisis. If this machinery was limited, slow, and troublesome,
    that didn’t mean that it was part of the problem; rather, such limitations were
    taken as the conditions through which concerned people had to work. Admitting
    failure was not an option, even if the grandstanding at the United Nations and
    technocratic equivocation at the IETA offered direct evidence for what Thomas
    Schelling argues: that the likelihood of the planet’s almost two hundred nations
