    Gulf Stream brought frigid temperatures to Europe and drought to southwest Asia
    for a thousand years.34 According to archaeologist Brian Fagan, it was almost
    certainly this drought that drove the people in a small village on the Euphrates,
    who had until then depended for their sustenance hunting desert gazelles, harvesting
    nuts, and gathering wild grasses, to begin deliberately cultivating rice, lentils,
    and a grain called einkorn.35 By 9000 BCE, after the Younger Dryas had ended and
    the Gulf Stream switched back on, the agricultural revolution had begun. Neolithic
    humans hunted, herded, gathered, and farmed from Europe to South America, thriving
    in the warm and mild climate of what is now called the Holocene.


    A few thousand years later, the Laurentide ice sheet in Canada collapsed, causing
    a rapid rise in sea levels, and as happened with the Younger Dryas, shutting off
    the Atlantic Gulf Stream. Cold, dry conditions descended on Europe and southwest
    Asia. This cold drought lasted four centuries before the Gulf Stream switched
    on. In the marshy confluence of the Tigris and Euphrates rivers, farmers began
    irrigation canals to control flooding and increase crop yields. Villages grew
    into towns, and as people living in these new towns struggled to deal with the
    complex, difficult group effort to construct and maintain levee systems, keep
    records of floods and farm yields, and bring in the harvest, they began to develop
    refined definitions of labor, hierarchical political structures, sophisticated
    regions, and writing. Temples and marketplaces were built, traders carried goods
    from one town to another, and priests accumulated power as they hoarded knowledge
    of weather patterns and seed growth. The settlements of Urid and Uruk grew from
    clusters of villages to immense cities of tens of thousands. Through a complex
    interplay of droughts, population growth, and the increasing centralization of
    agriculture, human society based and around cities—what we call “civilization”—emerged
    in the fertile crescent of land arcing from present-day Lebanon through Syria
    and Iraq to the Persian Gulf. From approximately 3100 to approximately 2200 BCE,
    Sumerian and then Akkadian kings ruled a vibrant form of life that stretched across
    Mesopotamia. But when a three-hundred-year-long drought hit the region, that vibrant
    empire fell apart.36 Mighty Uruk stood desolated.


    From ancient Uruk to modern-day Iraq we span about five thousand years, including
    nearly all of recorded human history—the Greeks, the'
  - '[PAGE 22]


    Romans, the Tang dynasty, the Mongolian khanate, World War II, the invention of
    the cellphone, and all seven seasons of Mad Men. If human existence on Earth were
    a day, our approximately five millennia of recorded history would take up the
    last half hour before midnight. 99.9 percent of humanity’s two hundred thousand
    years on Earth, the average planetary temperature never rose above 61 degrees
    Fahrenheit and carbon dioxide concentrations never went above 300 parts per million
    (ppm). Nearly all of our energy came from photosynthetic processes: most of our
    fuel was plant food, for ourselves directly, through the animals we used and preyed
    on, or through biomass like wood, with some use of water and air through technologies
    like mills and sails, and negligible use of coal and oil.


    Then, in 1781, James Watt invented the continuous-rotation steam engine. Suddenly
    power was portable, independent of living beings or natural forces, and able to
    run continuously. The steam turbine offered a vast improvement in energy production
    over wind, water, and animal labor, but it needed dense, hot-burning fuel for
    maximum output. Luckily for Watt, there happened to be loads of the stuff all
    over England: fossilized carbon in the form of coal.


    Industrial coal changed everything. For the last two hundred years, just one tenth
    of ten percent of human existence, most of our energy has come not from direct
    photosynthesis but from stored carbon in fossil fuels. Switching from a photosynthetic-based
    energy economy to a carbon-based energy economy increased human wealth beyond
    what anyone could possibly imagined, raising the overall standard of living across
    the world through technologies like diesel-fueled tractors, Haber-process nitrogen-fixed
    fertilizer, Bessemer steel, railroads, steamships, airplanes, electric power plants,
    the internal combustion engine, and the automobile. It also began a massive transformation
    of the physical systems regulating life on Earth. By transferring millions of
    tons of carbon from the ground into the air, we have wrought profound changes
    in the Earth’s climate, biosphere, and geology. Average atmospheric CO levels
    have rocketed from 290 ppm to over 400 ppm, a level the planet hasn’t seen in
    more than two million years. At the same time, methane (CH₄) levels have increased
    from 770 parts per billion to more than 1,800 parts per billion, the'
- md: '

    highest concentration of atmospheric methane in at least hundred thousand years.²37
    These changes have disrupted the climate patterns regulated by the Earth’s orbit
    around the Sun and will continue to disrupt them for thousands of years.


    Our planet can sustain life because when energy from the Sun strikes the Earth,
    some of it is trapped in the atmosphere as heat. There are several greenhouse
    gases that help this, including carbon dioxide, methane, water vapor, and nitrous
    oxide. These gases are integral to the planet’s complex geophysical homeostasis.
    That homeostasis has shifted, over millions of years, back and forth between “greenhouse”
    and “icehouse” states. During the last greenhouse state, in the Eocene, the planet
    was ice-free, tropical from pole to pole, up to 20 degrees Fahrenheit warmer than
    it is now, and had CO2 concentrations up to ten times of today.


    The oceans were 300 feet higher. Large reptiles and dwarf mammals ranged through
    lush forests: a forty-foot-long snake that weighed more than a ton, a tiny horse
    of a dog, sleek feline predators, and lemur-like primates. Crocodiles and palm
    trees thrived along the Arctic Circle. That was fifty million years ago. Since
    then, the Earth cooled, and it has been in an “icehouse” state for more than two
    and a half million years. We have very likely brought that state to a premature
    end.


    For the first sixty thousand years of Homo sapiens on Earth, global temperatures
    were 5 to 9 degrees Fahrenheit colder than an ice sheet covering what is now Chicago
    and New York. That same amount—5 to 9 degrees Fahrenheit—is as much as the planet
    is expected to warm up over the next few generations, and it doesn’t sound like
    a lot. After all, the temperature changes more than every day, and frequently
    much, depending on season and locale. But when you’re talking planetary averages,
    those differences are enormous. A future 5 degrees Fahrenheit warmer will mean
    the Arctic Ocean will be free in the summer. Mountain glaciers will all disappear,
    and with them, skiing, snowpack and a many freshwater streams. Weak weather will
    play havoc with agricultural systems, plant and animal habitats, and human infrastructure.
    We’ll have to contend with more extreme temperature fluctuations, more humidity,
    and more intense rainfall, stronger and longer-lasting storms, severe droughts,
    and unpredictable changes in formerly reliable climate dynamics, such as the jet
    streams, the El Niño southern oscillation, and the Gulf Stream. Coral reefs will
    go extinct, along with countless other species caught in ecosystems changing too
    swiftly for them to adapt to or migrate out of.


    More important, warming of 5 to 9 degrees Fahrenheit will eventually lead to sea
    levels up to 200 feet higher. No one is sure how quickly that will happen: If
    the ice melts slowly, we might see only a few feet of sea level rise by 2100.
    If the ice melts quickly and the Greenland ice sheet collapses, we could witness
    20 to 30 feet higher within decades. Ice sheets are already melting faster than
    models have predicted, there is evidence that they have broken apart very quickly
    in the past, and ice melt is a feedback phenomenon, meaning that the more it melts,
    the faster the remaining ice melts. These factors mean that a rapid, unpredictable
    rise in sea level is all too possible. According to James Hansen, the "empirical
    data show that natural ice sheet disintegration can be, at rates up to several
    meters of sea level rise per century.”*38 Whether it happens slowly or quickly,
    sea level rise will be disastrous for modern civilization: hundreds of millions
    of people living in low-lying coastal cities will be threatened not only by floods,
    but also by the increased storm surges resulting from the combination of higher
    seas, a wetter climate, and stronger storms.


    It gets worse. Global warming of 5 to 9 degrees Fahrenheit depends on “business
    as usual,” but there are good odds that business will not go as usual. Growing
    populations and surging carbon consumption, particularly in China and India, will
    mean that the amount of carbon being produced is likely to increase over the next
    eighty-five years, as it has increased over recent decades. Feedback dynamics
    in the global climate system will likely raise temperatures even faster. Melting
    permafrost in Canada and Siberia will significantly increase atmospheric carbon
    dioxide and potentially increase warming by up to 80 percent.”*39 And, as mentioned
    before, methane hydrates in permafrost and locked in sediments at the bottom of
    the ocean could “belch,” superheating the Earth and likely making it uninhabitable
    for the primate Homo sapiens.


    Our hominin ancestors evolved during a period of general planetary cooling, and
    humans themselves evolved in a glacial climate colder than the one we live in
    today. Civilization as we understand it developed during what has been an unusually
    long, stable period, the Holocene, which began after the last glacial period,
    about 10,000 years ago. During the Holocene, the climate was remarkably stable,
    allowing for the development of agriculture, cities, and civilization. But now,
    that stability is ending. The rapid increase in greenhouse gases in the atmosphere
    is causing the climate to change at a rate that is unprecedented in human history.
    We are witnessing the end of a millennia-long period of stability, and the consequences
    will be felt for generations to come.


    ## TWO SIDES

    OF THE PROBLEM


    The scientific study of climate change goes back to the early nineteenth century,
    when geologists and naturalists struggled to make sense of evidence suggesting
    that much of the Earth had once been covered in glaciers, and the science developed
    as physicists and chemists sought to understand the composition and mechanics
    of the atmosphere.


    The Swedish scientist Svante Arrhenius demonstrated the close relation between
    carbon dioxide levels and atmospheric temperature in 1895, theorizing what we
    now understand as the greenhouse effect and that widespread coal burning might
    increase global temperatures.¹42 By the 1950s and 1960s, the effects of industrial
    pollution on the global climate were being studied by many scientists, among them
    Charles David Keeling, whose graph measuring carbon dioxide at Mauna Loa Observatory
    in Hawai''i, the now-famous “Keeling Curve,” showed clearly that atmospheric CO2
    was increasing. Over the next thirty years, evidence for man-made global warming
    grew, and by the late 1980s a scientific consensus had been established.


    In 1988, James Hansen, director of the National Air and Space Administration''s
    Institute for Space Studies, testified before the US Senate that the Earth was
    definitely warming, and “that it was 99 percent the warming trend was not a natural
    variation but was caused by a buildup of carbon dioxide and other artificial gases
    in the atmosphere.”⁴3 The Intergovernmental Panel on Climate Change was founded
    that some year to report and advise the United Nations on the problem of climate
    change, and the United Nations Framework Convention on Climate Change was established
    in 1992, committing its signatories to stabilizing global greenhouse gas emissions
    at a safe level. Every member nation of the UN signed the UNFCCC treaty in 1992
    and had ratified it by 1995, but the commitments they made with no clear objectives,
    no viable mechanism for monitoring objectives were achieved, and no binding authority
    to enforce compliance.


