    The labor dispute Reece''s husband was embroiled in, referred to in the papers
    of the day as the Harlan County War, was a series of conflicts between Kentucky
    coal miners and the Harlan County Coal Operators Association. The trouble began
    when the Association cut the market price of their coal and paid for it by taking
    out of their miners'' wages. Already aggrieved because of predatory lending practices,
    cheating at the scales, excessive deductions for sick days, and a lack of health
    benefits, the miners went on strike. The coal companies hired private guards to
    protect the strikebreaking replacement workers they brought in, their “scabs,”
    and over the next several weeks increasingly violent skirmishes broke out between
    striking miners and company heavies. These hired guns, the “thugs” of Reece’s
    song, had been deputized by Harlan County sheriff J.H. Blair, and they given free
    rein to harass and arrest the miners. Several people were killed on both sides,
    and after miners ambushed a convoy of guards and killed three of them, the Kentucky
    National Guard was called in. With the National Guard behind him, Sheriff Blair
    outlawed all public assemblies, tear-gassed the miners, and within a few weeks
    broke the strike.


    Between 1877 and 1937 there were at 30 major labor conflicts in the United States,
    including Hay-market, the Pullman Strike, the Lattimer Massacre, the Ludlow Massacre,
    the Everett Massacre, and the Battle of Matewan. These conflicts were typically
    between striking workers and motley forces brought in by company bosses, usually
