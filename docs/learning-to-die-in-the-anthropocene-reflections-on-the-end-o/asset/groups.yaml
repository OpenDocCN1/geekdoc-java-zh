    The Civil Rights movement, often held up as the great American example of what
    mobilized nonviolent civil disobedience, was like the labor struggle, a violent,
    decades-long conflict over social and political power. As journalist and historian
    Charles Cobb shows in his book, This Nonviolent Stuff’ll Get You Killed: How Guns
    Made the Civil Rights Movement Possible, armed resistance and defense were foundational
    to the Civil Rights movement, protecting leaders and organizers, demonstrating
    political will on the part of black communities and activists, and making nonviolent
    civil disobedience practicable in a hostile environment.80


    In 1957, Robert F. Williams became one of the great examples of the effectiveness
    of armed resistance when he organized the Monroe, North Carolina, chapter of the
    National Association for the Advancement of Colored People (NAACP) to physically
    defend the home of his friend and ally Dr. Albert E. Perry. Perry had been targeted
    by the Monroe Kluz Klan (KKK) for leading a protest against rules prohibiting
    blacks from using a municipal swimming pool. When an armed motorcade came after
    Perry in his neighborhood, intending to terrorize him into submission, Williams,
    a US veteran of World War II, had his NAACP chapter meet the Klan with “disciplined,
    with volleys” of rifle fire.81 The Kl fought, and the very next day, the Monroe
    city council banned KKK parades.82


    Given the intense hostility and violence the Civil Rights movement faced in the
    South, it’s doubtful whether lunch-counter sitins, Freedom Rides, and marches
    would have even been possible without the substantiated threat of armed militancy
    looming in the background. As James Baldwin wrote in 1963, “Black has become a
    beautiful color—not because it is loved but because it is feared.”83 What’s more,
    the success of the Civil Rights movement can’t be properly understood without
