- md: '

    Iliad, these archaic people act in ways that strike us as not just primitive but
    irrational, superstitious, even insane. Yet they are us: not only historically,
    but genetically, technologically.


    A hairsbreadth of human time separates Aeschylus from the present, and in that
    moment grows everything we take for modernity. Our language, our thought, our
    architecture, and our culture carry ancient memories embedded in grammar, vocabularies,
    and syntax. Our symbolic-epistemological structures of cognition and democracy
    do not have histories, but are made of history, and are made from words such as
    “astron” and “nomas,” “ge” and “logos,” “anthropos” and “kainos.” Our thoughts
    and narratives are built from sedimented archetypes like Achilles and Cassandra,
    concepts such as fate, justice, democracy, and the very idea of an idea (*eidos*,
    meaning which is seen, form, or shape).


    Attending to the historical and philological genealogies of our current conceptual,
    symbolic structures of existence helps recognize who we are, who we have been,
    and who we might become. The comparative study of human cultures across the world
    and through time helps see that our particular way of doing things right here,
    now is a contingent adaptation to particular circumstances, yet at the same time
    an adaptation built with universal templates of meaning-making and symbolic reasoning,
    with tools and technologies we have inherited from the past. I’ve relied mainly
    on Greek examples, but the roots of our contemporary global civilization are also
    Akkadian, Sumerian, Chinese, Indian, Mesoamerican, Judaic, Egyptian, Nubian, Thule,
    Dorset, and Finno-Ugric. Wherever humans live, we make meaning. The record of
    that, the heritage of the dead, is our most valuable gift to the future.


    The study of the humanities is nothing less than the patient nurturing of the
    roots and heirloom variets of human symbolic life. This nurturing is a practice
    not strictly of curation, as many seem to think today, but of active attention,
    cultivation, making and remaking. It is not enough for the archive to be stored,
    mapped, or digitized. It must be worked. As Hannah Arendt writes:


    If it is true that all thought begins with remembrance, it is also true that no
    remembrance remains secure unless it is condensed and distilled into a framework
    of conceptual notions within which it can further exercise itself. Experiences
    and even the stories which grow out of what men do and endure, of happenings and
    events, sink back to the futility inherent in the living world and the living
    deed unless they are talked about over and over again. What saves the affairs
    of mortal men from their inherent futility is nothing but this incessant talk
    about them, which in its turn remains futile unless certain concepts, certain
    guideposts for future remembrance, and even for sheer reference, arise out of
    it.¹¹²


    Against the futility of life without memory, we have only this delicate accretion.
    Papyrus rots, paper museums get sacked, hard drives crash. The fragility of our
    collective cultural enterprise is well illustrated by the epigraph heading this
    chapter and the long poem it comes from. The Epic of Gilgamesh, one of the oldest
    works of literature on Earth, was possibly first inscribed on clay tablets in
    the 21st or 20th century BCE, later for nearly 2,500 years, then recovered in
    the middle of the 19th century by an Assyrian archaeologist from Mosul named Hormuz
    Rassam.¹¹³ The only reason the Epic survived was because it had been copied out
    by ancient scribes as rote training for more “important" bureaucratic and commercial
    work.


    The Epic tells the story of Gilgamesh, king of Uruk, a “bull on the rampage” admired
    for his strength but resented for his despotism.¹¹⁴ As the Epic recounts: “The
    young men of Uruk harries without warrant, / Gilgamesh lets no son go free to
    his father. / By day and night his tyranny grows harsher.” The women of Uruk pray
    for relief, complaining of Gilgamesh’s insistence on taking the virginity of all
    the brides in his city. The gods hear the women’s prayer, and one of them makes
    a wild man to match Gilgamesh, a hair-covered man-beast named Enidu, the “off-spring
    of silence.” Sent into the world, Enidu runs with gazelle herds and sabototeurs
    traps him mischief and sends a woman from Uruk named Shamhat to tame him. She
    finds Enidu, seduces him, dresses in clothes, teaches him how to eat and drink
    ale, and tells him of the wonders of city life. When Enidu hears about Gilgamesh’s
    habit of taking other men’s brides on their wedding night, though, “his face pale[s]
    in anger” and he speeds to Uruk. Once, there Enidu challenges Gilgamesh, their
    fight ends in a draw, with the two men kissing and becoming friends.


    In classic buddy-movie style, Enidu and Gilgamesh team up and journey to the Forest
    of Cedar, “the secret abode of the gods,” where they kill the ogre Humbaba and
    take his majestic trees. When they return to Uruk, the goddess of love, Ishtar,
    tries to seduce Gilgamesh. He rejects her, so she sends the monstrous Bull of
    Heaven to destroy Uruk and Gilgamesh turn the tables and slaughter the bull instead.
    That night, Enidu has a dream in which the gods declares that the heroes have
    gone too far, and that one of them will have to die. They name Enidu. He wakes
    and recounts his dream, then, after much lamenting, succumbs to a fatal illness.


    Gilgamesh is overcome with grief. “Afraid of death,” he wanders the Earth looking
    for his friend. Utnapishti tells Gilgamesh that he too can be immortal, if he
    goes six days and nights. But Gilgamesh tries to stay awake, but his eyes close
    the very night. Utnapishti rouses him, Gilgamesh is so distraught that he sleeps
    for a week. Utnapishti gives him a rejuvenating plant. On his way home, though,
    Gilgamesh loses the plant to a snake, which he steals from him. The mighty king
    curses the utility of existence: "For whom Urshanabi, toiled my arms so hard?
    he wails. "For whom dry the blood of my heart?"


    We might answer: Us. For the future. Almost four thousand years out of the past,
    the Epic of Gilgamesh carries forward a story of civilization. Its first main
    narrative, the taming of the wild Enidu, is reiterated in its final act, in the
    rampaging Gilgamesh learns to accept death. Enidu and Gilgamesh represent two
    phases of social development, the hunter-gatherer and the agricultural. The absolutist
    demands of agricultural civilization, embodied in Gilgamesh, are tyrannical without
    the tempering of the wild, but when civilization and wilderness join forces, they
    create an all-consuming machine that disrupts the sacred order. The gods decree
    the wild man must die and the mighty king submit to human limits.


    The Epic of Gilgamesh also offers a lesson in the importance of sustaining and
    recuperating cultural heritage in the wake of catastrophic climate change. As
    the Epic’s prologue reads, Gilgamesh “say what was secret, discovered what was
    hidden, / he brought back a tale of before the Deluge.” Translator and scholar
    Andrew George explains: “The implication of the prologue is that Gilgamesh played
    a key role in restoring the antediluvian order after the Flood, particularly in
    restoring the cults of the gods to their proper glory. . . It did not suit the
    poet’s need to include more than allusions to it, but evidently Gilgamesh was
    responsible for civilizing his country.”¹⁵


    Gilgamesh lives on death as a legend, a symbol, a reflection on ourselves. In
    this way, the Epic represents not only the fragility of our cultural heritage,
    but its persistence. I saw this firsthand when I talked to the Iraqi heavy metal
    band Accacasuda about their first full-length album, which they titled Gilgamesh.¹¹⁶
    Marwan Hussein, the band’s drummer and guiding force, told me that he’d decided
    to turn to the epic as a template for their album because it connected back to
    Iraq’s ancient Sumerian roots while at the same time offering a way of understanding
    the situation there.

