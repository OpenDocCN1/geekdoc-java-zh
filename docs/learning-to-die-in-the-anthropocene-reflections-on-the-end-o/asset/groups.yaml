    # 致谢


    这本书是无数次对话和思想碰撞的结晶，如果没有许多人的帮助、建议和支持，它是不可能实现的。首先，我要感谢我在城市之光出版社（City Lights）的编辑格雷格·鲁吉耶罗（Greg
    Ruggiero），他看到了这本书雏形——《纽约时报》文章的潜力，并滋养了从中产生的一些最重要的思想。其次，衷心感谢我在《纽约时报》哲学博客的编辑们——无与伦比的彼得·卡塔帕诺（Peter
    Catapano）和才华横溢的西蒙·克里奇莱（Simon Critchley）。不仅因为他们给予我的机会，更因为他们的思想、智慧和支持而深感无尽。特别感谢伊恩·鲍科姆（Ian
    Baucom）、阿曼达·安德森（Amanda Anderson）、简·贝内特（Jane Bennett），以及我在2013年夏天在康奈尔大学批评与理论学院的各位参与者，那段经历让我开阔眼界，关注人类世所带来的哲学问题，并帮助我开始思考如何应对这些问题。


    引言的大部分和其他章节的部分最初发表在《纽约时报》上，在此带着谢意予以转载。书中的部分曾以不同形式发表在《理论与事件》（Theory & Event）和《滚石石》（Rolling
    Stone）杂志上。我要感谢《2014年美国最佳科学与自然写作》（Mariner Books）的编辑德德波拉·布姆（Deborah Blum），她选择了我的文章收录于书中；以及《美国最佳科学与自然写作》的系列编辑提姆·福尔格（Tim
    Folger）。


    我很幸运能结识许多聪明、有才华的人，他们充满耐心且慷慨，愿意考虑我初期的想法并阅读我的草稿。这些朋友和同事的悉心帮助我对我本书的每一个方面进行了更深层次的思考，并将这本可能是相当孤独的冥想转变为了一系列充满活力的对话。


    我特别想感谢劳拉·卡弗（Laura Carver）、米汉·克里斯特（Meehan Crist）、约翰·弗里克（Johann Frick）、戴尔·杰米森（Dale
    Jamieson）、娜奥米·克莱因（Naomi Klein）、迪亚克·纳伯斯（Deak Nabers）、迈克尔·奥本海默（Michael Oppenheimer）以及雅各布·西格尔（Jacob
    Siegel）提供的对话与灵感。帕特里克·布兰奇尔德（Patrick Blanchfield）、玛丽亚·迪巴蒂斯（Maria DiBattista）、杰夫·多尔文（Jeff
    Dolven）、拉斐尔·克鲁特-兰道（Raphael Krut-Landau）、希拉里·普鲁姆（Hilary Plum）、多萝特亚·冯·莫特（Dorothea
    von Moltke）、杰森·丹尼尔·施瓦茨（Jason Daniel Schwartz）和苏珊·斯图华特（Susan Stewart）慷慨抽出时间阅读手稿，并给予我重要的反馈。特别感谢辩证法大师安德鲁·科尔（Andrew
    Cole），马丁·沃斯纳（Martin Woessner），后者自2007年在新学院修读他的《围城之城》课程以来，一直是我文明崩溃研究的导师，他们两人都读过书的草稿，但他们对我思想的帮助和影响比任何单一文本所显示的要深得多。


    书中的部分曾向不同的听众进行演讲，我对这些活动的参与者和组织者都表示感谢。具体来说，我要感谢多米尼克·鲍耶（Dominic Boyer）和人文科学能源与环境研究中心邀请我参加在莱斯大学举办的第四届年度能源文化会议（这在学术会议中很寻常），感觉像回到了一个我未曾梦想过的知识共同体；苏珊·安克（Suzanne
    Anker）在曼哈顿视觉学院邀请我参加“自然的超：自然的愿景”会议；斯蒂芬·韦克斯菲尔（Stephanie Wakefield）和皇后区的1882 Woodine
    邀请我去那里演讲；以及凯蒂·霍滕（Katie Holten）和迪隆·科恩（Dillon Cohen）邀请我参加关于人类世的沙龙。


    如果不感谢城市之光出版社明智且优雅的出版人埃莱诺·卡岑贝格（Elaine Katzenberger），以及细致入微的公关斯泰西·刘易斯（Stacey Lewis），我将是不称职的。还要感谢内特·多沃德（Nate
    Dorward）提供完美的校对。我还应该感谢我的代理人梅莉莎·钦奇基洛（Melissa Chinchillo）、塞尔维·格林伯格（Sylvie Greenberg）以及
    Fletcher & Co. 的唐纳德·拉（Donald Lamm），他们在手稿和出版方面提供的帮助。你们的指导和帮助至关重要。


    感谢普林斯顿大学和吉尔斯·惠廷基金会（Mrs. Giles Whiting Foundation）资助我对本书及其他课题的研究。感谢罗莎林德·帕里（Rosalind
    Parry），她的款待让我在缅因州的森林里有了完成这本书初稿的时间空间。还要感谢米尔斯（Miles），帮我赶走了郊狼。


    由于这是我的第一本书，请允许我花时间感谢几位在途中担任老师、激励者、朋友、有时甚至是守护天使的人：朱莉·福克斯（Julie Fox）、克里斯托弗·希特森斯（Christopher
    Hithens）、詹姆斯·米勒（James Miller）、梅莉莎·门罗（Melissa Monroe）、本·普罗查卡（Ben Prochazka）、菲丝·普维斯（Faith
    Purvis）、迈克尔·辛博德（Michael Reinbold）、克里斯·罗伯茨（Chris Roberts，他向我介绍了斯宾诺莎）以及苏珊·沃尔夫森（Susan
    Wolfson）。谢谢大家。


    最后，也是最重要的，感谢我最好的编辑、最挑剔的读者，以及我最顽强且不懈的对话者——莎拉·马库斯（Sara Marcus）。没有她坚强的耐心、执着的希望和温柔的关怀，我几乎没有理由在气候变化带来的绝望中写下去。这本书发出的任何光都只是她爱的反射。


    # 关于作者


    罗伊·斯克兰特（Roy Scranton）的新闻、随文和小说发表于《滚石》、《纽约时报》、《LIT杂志》、《波士顿评论》、《草原之燕》（Prairie Schooner）、洛杉矶书评、《当代文学》、《理论与事件》、《The
    Appendix》等杂志。他是《遗忘与记忆：长期战争短故事》（Fire and Forget: Short Stories from the Long War,
    Da Capo, 2013）的编辑之一。他在俄勒冈州长大，在新社会研究学院获得学士学位和硕士学位，目前正在普林斯顿大学攻读英语博士学位。


