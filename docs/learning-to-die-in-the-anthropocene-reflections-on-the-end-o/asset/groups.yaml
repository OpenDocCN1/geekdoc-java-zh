    1931年春天，一位肯塔基州名叫弗洛伦斯·里斯（Florence Reece）的女性重写了她在大约二十年前的一首歌，当时她才十二岁。这首歌原本关于她父亲（一名煤矿工）参加的一场罢工，具有直率的论战色彩。它的标题和副歌要求人们知道：“你站在哪边？”
    (Which Side Are You On?) 一新的罢工爆发了，里斯正在修改歌曲以适应一场新的战斗，只是这次是她的丈夫在游行和战斗。


    《你站在哪边？》后来成为一首经典的工会歌曲。艾兰·洛马克斯（Alan Lomax）在1937年录下了她本人演唱的版本。多年后，它被学生非暴力协调委员会自由歌手队（Freedom
    Singers）改编为一首民权歌曲。在里斯1931年的版本中，一些诗节这样写：


    - 他们说在哈兰县，

    那里没有中立者。

    你要么是工会人，

    要么是J.H.布莱尔的暴徒。


    - 噢，工人能忍受吗？

    噢，告诉我你是怎么做到的。

    你是要当一个卑劣的敲工（scab），

