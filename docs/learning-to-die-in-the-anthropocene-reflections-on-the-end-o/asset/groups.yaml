    best a voluntary and therefore functionally meaningless agreement. Meanwhile,
    on the very same day that the People''s Climate March kicked off, the Global Carbon
    Project released a new report showing that global greenhouse emissions rose 2.3
    percent in 2013, with China''s emissions growing 4.2 percent, India''s growing
    5.1 percent, and America''s growing 2.9 percent.^78 So much for Obama''s oratory.


    This seems to be the situation we''re stuck in. On the left and on the right,
    many diplomats, energy company executives, investors, scientists, anarchists,
    clergy, and activists, serious people are worried about global warming and the
    urgent need to do something about it. Across the spectrum, however, nobody seems
    to to have the tools, clout, or conceptual framework we need to fix, or to come
    up with a good plan to protect ourselves from the greatest dangers. There''s no
    “reset” button for civilization, and no viable plan for transforming global infrastructure,
    agriculture, and energy networks in the next ten to twenty years. And while simple,
    dedicated, and thoughtful people fumble with political machinery that doesn''t
    work, such as carbon-pricing markets, protests, and the United Nations, all of
    us in the Global North go about our business, driving, flying, leaving lights
    on, running heaters and air conditioners, eating meat, charging our devices, living
    unsustainable lives predicated on easy consumption.


    In a perverse irony, one of the main things that connected the disparate parties
    at the United Nations, Flood Wall Street, the IETA, and the People'' Climate March
    was a system of cultural technology that is silently burying masses of carbon
    while shunting outrage into impotent feedback loops. The most common sight at
    all the events that week was people on their iPhones and Androids, checking email,
    tweeting, and taking pictures. The global information and communications ecosystem
    that they were plugged into is now estimated to use about 10 percent of the world''s
    electricity.^79 That ecosystem relies on coal. Every time you check your email,
    you''re heating up the planet. We do it every day. We can''t stop. We won''t stop.


    The problem with the People'' Climate March wasn''t really that it lacked a goal,
    or that it was distracting, superficial, and vacuous. The problem with the United
    Nations isn''t that the politicians are ignorant, hidebound, self-interested,
    or corrupt. The problem with our response to climate change isn’t a problem with
    passing the right laws or finding the right price for carbon or changing people’s
    minds or raising awareness. Everybody already knows. The problem is that the problem
    is too big. The problem is that different people want different things. The problem
    is that nobody has real answers. The problem is that the problem is us.


