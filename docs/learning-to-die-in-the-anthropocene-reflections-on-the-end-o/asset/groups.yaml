    violence are biologically a part of human life as are sex, language, and eating,
    that aggression and the drive for dominance are neither vestigial behaviors nor
    social maladaptations but rather species traits, and that we have little reason
    to hope that war and murder might someday disappear.


    Our future promises to be as savage as our past. It may be that two centuries
    of carbon-fueled economic plenty and the widespread ramification of state control
