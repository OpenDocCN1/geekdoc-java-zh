    If you look up at the sky on a clear night, far from the city’s glow, you will
    see streaming out of the darkness that has taken millions, billions of years to
    reach you. The farthest observed galaxy, photographed by the Hubble Space Telescope,
    is 13.2 billion light years away.¹²³ Its photons have been hurtling toward Earth
    almost since the Big Bang. Its light is so dim that it is invisible to the naked
    eye. Most of the universe, in fact, cannot be unseen; of the 300 sextillion astronomers
    estimate that the known universe contains, you can see, on a dark, clear night,
    probably no more than a million.


    Our knowledge of this vast universe remains ridiculously limited. At the same
    time, that same knowledge is utterly awesome. For a growth of carbon scum on a
    spinning rock in the backwater of an unremarkable galaxy years from anywhere to
    develop the technology to send radio telescopes into space to measure the age
    of the universe is a prodigious achievement. Our primate curiosity and intellectual
    hubris have inspired breathtaking audities. Just a few thousand years ago, we
    were learning to make marks on clay. In the blink of an eye, we’ve brushed our
    fingers against eternity.


    It may be that we have crossed the summit of our knowledge and power, and the
    brief explosion of human life in the Holocene will turn out to have been as transient
    as an algae bloom. It may be, on the other hand, that we’ll find a way to survive
    in the Anthropocene, perhaps even find ways to maintain human civilization in
    some recognizable format. Whether we survive or not, however, has already been
    laid out in the explosion of quantum energy that, more than thirteen billion ago,
    began the chain of events and reactions that have led to this moment: we writing
    this page, you reading it.


    The universe, to adapt a proposition of Wittgenstein, is everything that is the
    case.¹²⁴ It is total and complete. There is no outside, it lacks nothing, and
    it cannot be other than what it is. A slight tweak in any variable and everything
    would be completely different. To have this moment, as you breathe and read, everything
    that happened for the last thirteen billion years had to happen in exactly the
    way it did. Not a single atom have been out'
