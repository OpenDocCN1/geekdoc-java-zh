  - '[PAGE 62]


    And since we can’t ever know how to do something until we do it, learning to die
    also means accepting the impossibility of achieving that knowledge as long as
    we live. We will always be practicing, failing, trying again and failing again,
    until our final day. The practice itself is the wisdom. In the words of Zen master
    Dōgen: “To practice the way single-handedly is, in itself, Enlightenment.”105


    As learned in Iraq and had to learn again and again, the practice of learning
    to die is the practice of learning to let go: Learning to die means let go of
    the ego, the idea of self, the future, certainty, attachment, the pursuit of pleasure,
    permanence, and stability. Learning to let go of salvation. Learning to let go
    of hope. Learning to let go of death. It means realizing the Stoic philosopher
    Marcus Aurelius that


    Of human life the time is a point, and the substance is in a flux, and the perception
    dull, and the composition of the whole body subject to putrefaction, and the soul
    whirl, and fortune hard to divine, and fame a thing devoid of judgment. And to
    say all in a word, everything which belongs to the body is a stream, and what
    belongs to the soul is a dream and vapor, and life is a warfare and a stranger’s
    sojourn, and after-f is oblivion106


    Learning to die means realizing along with the German philosopher G.W.F. Hegel
    that human consciousness operates through a dialectic of negation, and that enlightened
    self-consciousness is consciousness of one’s limits—and of one’s own death:


    The human being is Night, this empty nothing which contains everything in its
    simplicity—a wealth of infinitely many representations, images, none of which
    occur to it directly, and none of which are not present. This is the Night, the
    interior of human nature—pure Self—in phantasmoric representations it is night
    everywhere: here a bloody head suddenly shoots up and there another white shape,
    only to disappear as suddenly. We see this Night when we look a human being in
    the eye, looking into a Night which turns terrifying. For from his eyes the night
    of the world hangs out toward us.107'
  - '[PAGE 63]


    This Night the face I saw when I confronted the fact of my own mortality. It’s
    the face we all see sooner or later, because it’s our own face—our own consciousness,
    our own death mask. It waits for us in the mirror.


    Accepting this emptiness, letting go of myself, was only the first step in coming
    to understand my responsibility to participation in a larger collective self,
    a kind of human existence transcending any particular place or time, going back
    to our first moments in Africa 200,000 years ago, and living on today, fraught
    future of the Anthropocene. We are humanity. We are the dead. They have become
    us, as we will become the dead of future generations.


    We are born half-blind, confused, wired into a world we don’t understand. Within
    the night of this world, we apprehend our future as a field of freedom. We face
    this freedom as individuals, fully in the present, yet our actions are determined
    by the past and take their full meaning only in the future. As we gain in wisdom,
    individual consciousness reveals its complex entanglements with collective life,
    history, and the universe. We live in order our existence through conceptual and
    narrative structures that rationalize our impulses, pattern our habits, and connect
    our behaviors to collective rhythms. These conceptual and narrative structures
    are the cultural technology through which we make meaning and shape our desires.
    Facebook shapes desire differently than the Quran, each of which shapes desire
    differently than a West Elm catalog, Emily Dickinson’s poetry, Tai Chi, the Igbo
    New Yam festival, democracy, Passover market,” or Mexican telenovelas.


    The only inherent trait of the human that differentiates us from other animals
    is our knack for symbolic manipulation. Other species besides Homo sapiens communicate
    with language, organize socially, build structures, use tools, laugh, and show
    emotions. Even fire and simple social technologies were part of an inheritance
    passed down from Homo erectus and the Neanderthal.¹⁰⁸ Sometimes in the icy depths
    of prehistory, though, species began developing symbolic communication beyond
    anything that had ever been seen before. We learned to make the dead speak, and
    to speak ourselves to the unborn. We learned to see into the future. We learned
    to abstract from the present a conceptual reality transcending time and space.
    Through the ice ages of the past and into the long summer of the Holocene we carried
    tools, furs, fire, and our greatest'
  - '[PAGE 64]


    treasure and most potent adaptive technology, the only thing that might save us
    in the Anthropocene, because it is the only thing that can save those who are
    already dead: memory.


    Slightly more than 3,000 years ago, a band of Mycenaean shepherd-warriors raided
    and burned a walled city on the Anatolian coast. What exactly happened remains
    a matter of conjecture, as the empirical evidence is sketchy. On the one hand,
    we have the archaeological remains of a destroyed town, some evidence of fire,
    and a few arrowheads, all of which was only excavated in the last hundred and
    thirty years. On the other hand, we have two long poems, probably composed orally
    and written about 2,700 years ago, that tell the stories of these shepherd-warriors
    and their raid. Those two poems, originally recorded on papyrus or parchment rolls,
    grew to become authoritative texts for the ancient Greek city-states, the Roman
    empire, Byzantine civilization, and modern European and American literature, helping
    inspire and influence thinkers from Plato to Milton, Alexander Pope to Thomas
    Jefferson, Simon We to Derek Walcott. These long poems survived by being passed
    from family to family, preserved in temples and libraries, and recopied by monks
    and poets.


    While hundreds of scraps of Homeric poetry date as far back as 2,300 years ago,
    the oldest surviving full copy of Homer’s Iliad only dates to the 10th century
    CE. "The creation of this great book was no routine act of copying but a much
    scholarly enterprise," writes classicist Martin West.¹109 This book, the "Venetus
    A" manuscript, is stored in the Public Library of St. Mark in Venice, and has
    been digitized by Harvard University.¹110 You can look it up online.¹111


    About 400 years after somebody first transcribed the Iliad, an Athenian vintner
    named Aeschylus wrote a quartet of plays for performance in the annual religious
    festivals honoring Dionysus, the god of wine. Three plays in the quartet tell
    the bloody tale of the House of Atreus and the origins of Athenian law. In the
    first play, King Agamemnon returns home from the Trojan War and is murdered by
    his wife Clytaemestra, revenge for an even more heinous crime: years ago, Agamemnon
    had'
  - '[PAGE 65]


    sacrificed their daughter to secure his army''s passage to Troy. Agamemnon''s
    war-trophy rape-slave Cassandra prophesied the king''s murder, but no one heard
    her shouts until they turned to screams, as Clytanestra struck her down alongside
    her captor. The queen got her revenge, in the second play, The Libation Bearers,
    Clytanestra is murdered in turn by her son, Orestes. These plays give narrative
    shape to the compulsion of strife, the constant turn and return of violence, blood
    guilt and blood vengeance, the endless cycle of fear and aggression, desire and
    death.


    Yet they also show us a way out of that cycle: In the third play, The Eumenides,
    Apollo and Athena argue over Orestes'' fate and eventually decide to exonerate
    him. The Erinyes, the “Furies” who embodied the old law of vengeance and had to
    hunt Orestes to death, are transformed by Athena into the Eumenides, the “Kindly
    Ones,” and made the guardians of Athenian law. Through reflection, justice is
    transformed from revenge into mercy.


    The final play of the quartet, the cosmic satyr Proteus, is lost. Indeed, the
    three plays I described are the only extant dramatic trilogy to survive from ancient
    Greece at all. In total, we have only seven of Aeschylus''s plays, out of an estimated
    seventy to ninety that he wrote. This is fairly representative. The vast majority
    of classical Greek culture has disappeared. The little that persists, though,
    including much of Plato and Aristotle, some by Sophocles and Euripides, fragments
    of poems by Sappho and Callimachus, and the histories of Xenophon, Herodotus,
    and Thucydides, is an immensity of riches compared to the rumors and scraps that
    have endured from Homer''s time, only a few hundred years before, or from the
    Mycenaean and Hittite cultures whose Homer''s poems make legends of.


    Why even with these relics of a savage time? What do Homer and Aeschylus have
    to do with ISIS or global warming? When we look at them closely, these ancient
    Greeks to seem strange, even barbaric. They didn''t believe in free like we do,
    they didn''t believe in progress, and they certainly didn''t believe in universal
    human rights. The Greek concept of fate is hard to bear. Their ideas about justice
    seem cruel: kings and gods are capriciously brutal, and transgression is often
    punished with awesome suffering. Even in familiar stories such as Oedipus Rex
