    on, retweeting the story, reposting the video, hoping that others validate our
    reaction, thus assuring us by assuring ourselves that collective attention has
    been alerted to the threat. Other times we react with aversion, damping the vibrations
    by searching out positive reinforcements, pleasurable images and videos, something
    funny, something—anything—to ease the fear. We buy something. We eat food. We
    pop a pill.


