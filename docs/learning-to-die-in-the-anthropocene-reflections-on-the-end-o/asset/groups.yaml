    # FIVE

    A NEW ENLIGHTENMENT


    Let my eyes see the sun and be sated with light!

    The darkness is hidden, how much light is there left?

    When the dead see the rays of the sun?


    > —The Epic of Gilgamesh, Tablet IX⁹⁹⁸


    Death begins as soon as we are born. From our first moments in the world, blinking
    and crying in the light, we fly an unwavering arc to the grave. We are mortal,
    material, corporeal beings, blessed with quickening doomed to decay. In a very
    important sense, we don''t need to learn anything at all dying: it''s the one
    thing in life we can absolutely count on getting done.


    But while dying may be the easiest thing in the world to do, it''s the hardest
    thing in the world to do well—we are predisposed to avoid, ignore, flee, and fight
    till the very last hour. We are impelled in our deepest to struggle against it.
    Every time you feel hunger or taste ambition, every time your body yearns for
    recognition, every time you shake with anger or tremble in fear, the animal in
    you striving for life. We fall into the world caught between two necessities,
    compelled to live, born to die, and reconciling them has forever been one of our
    most challenging puzzles. The pieces just don''t fit together.


    Much of our energy is spent in denial. Some argue that denying the fact of death
    is the root and germ of human culture itself, from our first burials and ancestor-worship
    to plastic surgery and the space program.¹⁹⁹ “The idea of death, the fear of it,
    haunts the human animal like nothing else,” wrote anthropologist Ernest Becker
    in his Pulitzer Prize-winning book The Denial of Death. “It is a mainspring of
    human activity—activity designed largely to avoid the fatality of death, to overcome
    it by denying it in some way that it is the final destiny for man.¹¹⁰⁰ Throughout
    human history,'
  - '[PAGE 61]


    we have invested innumerable hours of labor in countless luminous visions of the
    afterlife, both physical and metaphysical: Heaven and Hell, family and nation,
    capitalism and Star Trek. We have children and pressure our children to give us
    grandchildren sending our genes into the future. We build pyramids, cathedrals,
    temples, mosques, monuments, and skyscrapers to prove to ourselves that some part
    of us will survive beyond our end. When our buildings crumble and ours grow weak,
    we distract ourselves with pleasure or rarely ourselves to war. As men who have
    experienced war have testified since the days of Homer, here is “a joyous feeling
    in the safety of killing” that washes away the bitter taste of death.”¹101


    Accepting the truth of our existence is the beginning of wisdom. When Montaigne
    wrote that “To philosophize is to learn how to die,” he was working in and with
    a philosophical tradition that was already centuries old. Citing one of his key
    predecessors, the Roman orator Cicero, Montaigne wrote: “Cicero says that to philosophize
    is nothing but to prepare for death. This is because study and contemplation draw
    our soul out to some extent and keep it outside the body; which is a sort of apprenticeship
    and semblance of death. Or else it is because all the wisdom and reasoning in
    this world boils down finally to this point: to teach us not to be afraid to die.”¹102
    Cicero was in his turn reworking Plato’s account of the death of Socrates in the
    Phaedo where Socrates argues that philosophy is the practice of learning how to
    separate the soul from the body.¹103


    Philosophical humanism in its most radical practice is the disciplined interruption
    of somatic and social flows, the detachment of consciousness from impulse, and
    the condensation of conceptual truths out of the granular data of experience.
    It is the study of “dying and being dead,” a divestment from this life in favor
    of deeper investments in a life beyond ourselves. In recognizing the dominion
    of death and the transience of individual existences we affirm a web being that
    connects to future, to us, to you. “One is responsible to life,” wrote James Baldwin.
    “It is the small beacon in terrifying darkness from which we come and to which
    we return. We must negotiate this passage as nicely as possible, for the sake
    of those who are coming after us.¹104


    Learning to die is hard. It takes practice. There is no royal road, firstclass
    lane. Learning to die demands daily cultivation of detachment and daily reminders
    of mortality. It requires long communion with the dead.'
