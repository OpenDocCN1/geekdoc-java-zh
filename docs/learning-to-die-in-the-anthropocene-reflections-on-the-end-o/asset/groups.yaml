    else—in fact more so. It does not provide an objective answer in a world of conflicting
    views, but unavoidably reflects the assumptions and values that people bring to
    tale. Climate policy will contend with “incommensurable benefits estimates.” Even
    the world’s top economists have accepted that they cannot reach an agreement on
    how to tackle the problem, even on the single component of how to weight impacts
    over time, let alone other dimensions.^59


    Populations and countries in economic competition, with wildly unequal investments
    in fossil fuel reserves and facing unequal impacts from the changing global climate,
    are highly unlikely to come to an agreement on how much a tone of CO2 should cost,
    thus making it improbable that strict, universal regulatory taxes on carbon will
    ever be established. If this seems unduly pessimistic, consider that neither the
    US, Russia, nor China—together responsible for around 48 percent of the world’s
    carbon dioxide emissions—have a national carbon tax, and that of those nations
    are fossil fuel exporters who depend on the growing energy markets of the third.
    Furthermore, carbon taxes have faced intense opposition not only from fossil fuel
    producers, but also from voters: most notably, Australia became famous in 2014
    as the first country in the world to repeal a national carbon tax.


    Instead of such taxes, many people advocate decarbonization through a global “cap-and-trade”
    mechanism similar to the one that helped solve the problem of acid rain.^60 In
    a cap-and-trade scheme, emissions limits are established and gradually tightened,
    while emitters are allowed to trade emissions credits among themselves to minimize
    the costs of compliance. But Thomas Schelling, a Nobel-winning economist and strategic
    systems theorist, makes a strong case that carbon trading simply will not work.'
