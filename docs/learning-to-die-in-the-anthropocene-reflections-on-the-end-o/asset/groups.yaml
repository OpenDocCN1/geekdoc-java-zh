    Pulling carbon dioxide out of the air has also been proposed as a technological
    fix to address emissions, though it would be tremendously expensive and, like
    capture and sequestration, so far remained underdeveloped. As Roger Pielke Jr.
    points out, “Presently, there are no experimental data on the complete process
    of carbon capture, especially at scale, to demonstrate the concept, its energy
    use, and the engineering costs."66 We should be researching and developing such
    technologies, of course, while recognizing that they are far from quick, easy
    solutions and may not ever be viable. The time for a speculative, miraculous,
    lastminute long-shot techno-fix is well over. We are living right now in the midst
