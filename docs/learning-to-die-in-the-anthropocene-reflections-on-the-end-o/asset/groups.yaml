    既然我们在未付诸实践之前无法知道如何做某事，那么学习死亡意味着接受：只要我们活着，就不可能获得那种知识。我们将一直在实践、在失败、不断尝试并一次一次地失败，直到我们生命的终点。实践本身就是智慧。正如禅师道元所说：“独坐修行，其本身即觉悟。”105


    正如在伊拉克所学到的，以及必须一次又一次重新学到的那样，学习死亡的练习就是学会放手的练习：学习死亡意味着放下自我、放下自我的观念、未来、确定性、执着、对享乐的追求、永恒和稳定。学会放下救赎。学会放下希望。学会放下死亡。这意味着要意识到斯多葛哲学家马库斯·奥勒留留所说：


    “对于人类生命而言，时间只是一个点，物质处于流变之中，感知是迟钝的，整个身体的构造易受腐烂的影响，灵魂在旋转，命运难以捉摸，名声是虚无判断的事物。简言之，一切属于身体的都是流水，一切属于灵魂的都是梦幻和云烟，生命是一场战争和异乡人的寄留，死后则是遗忘。”106


    学习死亡意味着与德国哲学家G.W.F.黑格尔一起意识到，人类意识通过否定的辩证法运作，而启蒙的自我意识是对自身局限的意识——也是对自己死亡的意识：


    “人是夜晚，这种在其简单性中包含万物的空虚无——无穷多表象、图像的财富，其中没有一个是它直接产生的，但也没有一个不在。这就是夜晚，人性的内在——纯粹的自我——在幻影般的表象中，处处是夜晚：这里一个血红的人头突然冒起，那里另一个白色的形状，随即又突然消失。当我们直视一个人的眼睛时，我们看到了这片夜晚，看向一个变得恐怖的夜晚。因为从他的眼中，世界的夜晚正向我们延伸而来。”107


    这片夜晚正当我面对自己死亡这一事实时所看到的脸。那是我们所有人迟早都会看到的脸，因为那是我们自己的脸——我们自己的意识，我们自己的死亡面具。它在镜子中等着我们。


    接受这种空虚，放下自我，只是理解我参与一个更大集体自我的责任的第一步，这是一种超越任何特定地点或时间的人类存在，回到我们20万年前在非洲的最初时刻，并生活在今天这个充满危机的人类世未来。我们是人类。我们是死者。他们已成为我们，正如我们将成为后世的死者一样。


    我们出生时是半盲的、困惑的，被连接在一个我们无法理解的世界里。在这个世界的夜晚中，我们将未来理解为一片自由的领域。我们作为个体面对这种自由，完全处于当下，但我们的行动是由过去决定的，并且只有在未来才具有完全的意义。随着我们智慧的增长，个体意识揭示了它与集体生活、历史和宇宙之间复杂的纠缠。我们通过概念和叙事结构来维系我们的生存，这些结构使我们的冲动合理化，使我们的习惯模式化，并将我们的行为与集体节奏联系起来。这些概念和叙事结构是我们创造意义和塑造欲望的文化技术。Facebook塑造欲望的方式与《古兰经》不同，后者塑造欲望的方式也不同于West
    Elm的目录、艾米莉·迪金森的诗歌、太极、伊博格人的新米节、民主、逾越节市场，”或墨西哥长剧。


    人类区别于其他动物的唯一内在特征是人对符号操纵的天赋。除了智人以外的其他物种也通过语言交流、进行社会组织、建造结构、使用工具、大笑并表现情感。甚至火和简单的社会技术也是从直立人和尼安德特人继承下来的部分.¹10⁸
    然而，有时在史前冰冷的深处，物种开始发展超越以往任何事物的符号交流。我们学会了让死者开口，学会了向未出生者诉说。我们学会了看到未来。我们学会了从现在抽象出一种超越时空的概念现实。通过过去的冰河时代进入全新世漫长的夏季，我们携带了工具、皮草、火，以及我们最大的宝藏和最强大的适应技术——这是在人类世可能拯救我们的唯一东西，因为它是唯一能拯救已经死者的东西：记忆。


    稍多3000年前，一群迈锡尼的牧羊人战士袭击并焚毁了安纳托利亚沿岸的一座围墙城市。究竟发生了什么仍然是一个推测问题，因为经验证据并不充分。一方面，我们有被毁之城镇的考古遗迹、一些火的痕迹和几个箭镞，这一切都是在过去的130年里才被挖掘出来的。另一方面，我们有两首长诗，可能是在2700年前通过口头创作并写下的，讲述了这些牧羊人战士和他们袭击的故事。那两首长诗最初记录在纸草或羊皮纸卷上，后来成为古希腊城邦国家、罗马帝国、拜占庭文明以及现代欧洲和美国文学的权威文本，启发并影响了从柏拉图到米尔顿、从亚历大·波普到托马斯·杰斐逊、从西蒙·韦到德德里克·沃尔科特的思想家。这些长诗通过世世代相传得以生存，保存在神庙和图书馆中，并由僧侣和诗人抄写。


    虽然数百片荷马史诗的碎片日期可以追溯到2300年前，但最老的《伊利亚特》完整副本只能追溯到10世纪。“《伊利亚特》的创作并非偶然行为，而是一项学术事业，”古典学者马丁·韦斯特写道¹
    这种手稿保存在威尼斯的圣马图书馆，并由哈佛大学数字化¹ 总之，我们拥有埃斯库留斯的七部剧，据估计他写了七十到九部。这具有代表性。大部分古典希腊文化已经消失了。然而，幸存下来的——包括柏拉图和亚里士多德的作品、索福克勒和欧里庇得的部分剧、莎荷和卡里马库斯的诗歌碎片，以及希罗诺丰、希罗多德和修昔底德的历史——与荷马时代或几百年前流传下来的传闻和碎片相比，仍是一笔巨大的财富。或者从


    在有人首次转抄《伊利亚特》后400年，一位雅典人埃斯库留斯为纪念狄奥尼索斯的年度节日创作了一部三部曲。我所描述的这三部剧讲述了阿特瑞斯家族的血腥故事。在第一部剧中，阿伽门农从特洛伊战争归来被他的妻子克吕忒斯特拉杀害，是为了一个更残忍的罪：多年前，阿伽门农为了确保军队进入特洛伊牺牲了他们的女儿。在第二部剧《酒神》中，克吕忒斯特拉反过来被她的儿子俄瑞斯特斯杀害。这些剧为冲突的强迫、暴力的不断循环、血债与血仇、欲望与死亡赋予了叙事形式。然而，它们也向我们展示了走出循环的方法：在第三部剧《欧墨尼德》中，阿波罗和雅典娜就俄瑞斯特斯的命运进行了辩论，最终判定他无罪。复仇女神作为旧复仇法律的化身，曾不得不追杀俄瑞斯特斯直到死亡，现在被雅典娜转化为“仁慈者”，并成为雅典法律的守护者。通过反思，正义从复仇转变为仁慈。这部三部曲的最后一部《普罗米修斯》已经失传了。

