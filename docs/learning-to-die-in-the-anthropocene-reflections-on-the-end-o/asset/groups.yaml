    activists put their bodies on the line to “Flood Wall Street,” while at the Harvard
    Club in midtown a group of government administrators, corporate representatives,
    bankers, and economists met to work out a global carbon pricing mechanism at the
    International Emissions Trading Association.


    At Flood Wall Street, which began with a marching band, dancing, and speeches
    from Naomi Klein, Chris Hedges, Mamadou Goita, Elisa Estronioli, and others, the
    message, mission, and enemy were clearly identified. The protesters were marching
    to Wall Street in a nonviolent direct action against what they saw as the real
    problem behind climate change: capitalism. Signs named the usual: the villainous
    Koch brothers, ExxonMobil, and Shell. The protest’s parade of anarchists, environmentalists,
    and Occupy veterans blocked traffic around Arturo di Modica’s “Charging Bull”
    for a few hours, then made their way to the intersection of Broadway and Wall
    Street. The New York City Police Department maintained over control of the situation
    the entire time, surrounding the marchers with a loose cordon from beginning to
    end. Helicopters buzzed low overhead, a natrally dressed community liaison observed
    the situation close.⁴ Wall Street itself had been blocked by barriers and horse-mounted
    police long before the protest began; the marchers never stood a chance of getting
    through. In terms of its own expressed goal, the action was a failure before it
    even began. The protesters did not give up, though; they held the intersection
    of Broadway and Wall, under the steeple of Trinity Church, all afternoon long.
    Once the set, the cops ordered the protesters to disperse. One hundred and four
    stalwart souls refused to leave and were arrested, including one sweaty activist
    in a polar bear suit.


    While the rabble faced off against the fuzz downtown, power-industry elites at
    the Harvard Club discussed how profitable to trade waste. The International Emissions
    Trading Association’s (IETA) first panel, government representatives talked about
    carbon-pricing schemes working to reduce carbon emissions in California and Europe,
    and Tang Jie, the vice mayor of Shenzhen, China, spoke about his country’s carbon
