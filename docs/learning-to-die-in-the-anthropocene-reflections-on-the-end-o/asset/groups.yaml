    # ACKNOWLEDGMENTS


    This book is the result of countless conversations and intellectual encounters,
    and it wouldn''t have happened without the help, advice, and support of quite
    a few people. Most immediately, of course, thanks are due to my editor at City
    Lights, Greg Ruggiero, who saw the potential in the New York Times this book grew
    from and nurtured some of the most important ideas that developed out of it. Second,
    my great thanks to my editors at the New York Times philosophy blog, the incomparable
    Peter Catapano and the bedazzling Simon Critchley. I am deep in their debt not
    only for the opportunity they gave me but also for their thoughts, wisdom, and
    their support. Special thanks as well to Ian Baucom, Amanda Anderson, Jane Bennett,
    and my fellow participants at the School of Criticism and Theory at Cornell University
    in the summer of 2013, which opened my eyes to the philosophical problems the
    Anthropocene poses and who helped me begin to think about how we address them.


    Much of the introduction and parts of other chapters were first published in the
    New York Times, and are reproduced here with grateful acknowledgment. Portions
    of this book were published previously in different form in Theory & Event and
    Rolling Stone magazine. I would like to thank Deborah Blum, editor of Best American
    Science and Nature Writing 2014 (Mariner Books), who chose my essay to appear
    in that volume, and Tim Folger, series editor of the Best American Science and
    Nature Writing.


    I''m very lucky to know a lot of smart, talented people with the patience and
    generosity to entertain my emerging ideas and read my rough drafts. The attentive
    care of such friends and colleagues helped me immensely in thinking more deeply
    about every aspect of this book, while transforming what could have been a rather
    lonely meditation into a series of invigorating conversations.


    I especially want to thank Laura Carver, Meehan Crist, Johann Frick, Dale Jamieson,
    Naomi Klein, Deak Nabers, Michael Oppenheimer, and Jacob Siegel for conversation
    and inspiration. Patrick Blanchfield, Maria DiBattista, Jeff Dolven, Raphael Krut-Landau,
    Hilary Plum, Dorothea von Moltke, Jason Daniel Schwartz, and Susan Stewart generously
    took time to read drafts of the manuscript and gave me important feedback. Special
    thanks goes to Andrew Cole, Jedi of the dialectical arts, and to Martin Woessner,
    my mentor in the study of civilizational collapse ever since I took his “Cities
    Under Siege” course at the New School in 2007, both of whom read drafts of the
    book but whose help and influence on my thought go far deeper than any one text
    might show.


    Parts of this book were delivered as presentations to various audiences, and I
    am grateful to both the participants and organizers of these events. Namely, I
    want to thank Dominic Boyer and the Center for Energy and Environmental Studies
    in the Human Sciences for inviting me to the 4th Annual Cultures of Energy Conference
    at Rice University, which (unusual for academic conferences) felt like coming
    home to an intellectual community I hadn’t dreamed; Suzanne Anker at the School
    of Visual Arts in Manhattan for inviting me to participate in the Naturally Hypernatural:
    Visions of Nature conference; Stephanie Wakefield and 1882 Woodbine in Ridgewood,
    Queens, for inviting me to speak there; and Katie Holten and Dillon Cohen for
    inviting me to their series of salons discussing the Anthropocene.


    I would be remiss if I did not thank City Lights’ wise and elegant publisher,
    Elaine Katzenberger, and its painstaking publicist, Stacey Lewis. Thank you for
    making this book what it is. Thanks as well as Nate Dorward, for their peerless
    proofing. I should also thank my agents, Melissa Chinchillo, Sylvie Greenberg,
    and Donald Lamm at Fletcher & Co., for their assistance with the manuscript and
    with the work of publishing it. Your guidance and help have been essential.


    My thanks also go to Princeton University and the Mrs. Giles Whiting Foundation,
    for funding my research on this and other topics. Thanks as well to Rosalind Parry,
    whose hospitality gave me the time and space in the woods of Maine to finish this
    book’s first draft. Also thanks to Miles, who kept the coyotes away.


    As this is my first book, I would ask indulgence to take a moment to thank a few
    people who have served as teachers, motivators, friends, and sometimes guardian
    angels along the way, without whom I would never have made it this far: Julie
    Fox, Christopher Hithens, James Miller, Melissa Monroe, Ben Prochazka, Faith Purvis,
    Michael Reinbold, Chris Roberts (who introduced me to Spinoza), and Susan Wolfson.
    Thank you all.


    Finally, and most important, my gratitude to my best editor, my most critical
    reader, and my most tenacious and unrelenting interlocutor, Sara Marcus. Without
    her tough patience, dogged hope, and tender care, there would have been little
    reason for me to write through the despair that confronting climate change induces.
    Any light this book might give off is only a reflection of her love.


    # ABOUT THE AUTHOR


    Roy Scranton’s journalism, essays, and fiction have been published in Rolling
    Stone, the New York Times, LIT, Boston Review, Prairie Schooner, Los Angeles Review
    of Books, Contemporary Literature, Theory & Event, The Appendix, and elsewhere.
    He is one of the editors of Fire and Forget: Short Stories from the Long War(Da
    Capo, 2013). He grew up in Oregon, earned a Bachelor’s degree and a Master’s degree
    at the New School for Social Research, and is completing a PhD in English at Princeton
    University.

