    To survive as a soldier, I had to learn to accept the inevitability of my own
    death. For humanity to survive in the Anthropocene, we need to learn to live with
    and through the end of our current civilization. Change, risk, conflict, strife,
    and death are the very processes of life, and we cannot avoid them. We must learn
    to accept and adapt.


    The human psyche naturally rebels against the idea of its end. Likewise, civilizations
    have throughout history marched blindly toward disaster, because humans are wired
    to believe that tomorrow will be much like today. It is hard for us to remember
    that this way of life, this present moment, this order of things is not stable
    and permanent. Across the world today, our actions testify to our belief that
    we can go on like we forever: burning oil, poisoning the seas, killing off other
    species, pumping carbon into the air, ignoring the ominous silence of our coalmine
    canaries in favor of the unending robotic tweets of our new digital imaginarium.
    Yet the reality of global climate change is going to keep intruding on our collective
    fantasies of perpetual growth, constant innovation, and endless energy, as the
    reality of individual mortality shocks our causal faith in permanence.


    The greatest challenge the Anthropocene poses isnt how the Department of Defense
    should plan for resource ways, whether we should put up sea walls to protect Manhattan,
    or when we should abandon Miami. It won''t be addressed by buying a Prius, turning
    off the air conditioning, or signing a treaty. The greatest challenge we face
    is a philosophical one: understanding that this civilization is already dead.
    The sooner we confront our situation and realize that there is nothing we can
    do to save ourselves, the sooner we can get down to the difficult task of adapting,
    with mortal humility, to our new reality.


    Carbon-fueled capitalism is a zombie system, voracious but sterile. This aggressive
    human monoculture has proven astoundingly virulent but also'
  - '[PAGE 16]


    toxic, cannibalistic, and self-destructive. It is unsustainable, both in itself
    and as a response to catastrophic climate change. Frankly, carbon-fueled capitalism
    is not the only way humans can organize their lives together. Again and again
    throughout our history, we have shown ourselves to be capable of shedding maladaptive
    systems of meaning and economic distribution, developing resilient social technologies
    in response to precity and threat, transforming obsolete social practices into
    novel forms of life. Humanity''s survival through the collapse of carbon-fueled
    capitalism and into the new world of the Anthropocene will hinge on our ability
    to be our old way of life while protecting, sustaining, and reworking our collective
    stories of cultural technology. After all, our capacities to innovate and adapt
    depend on our being able to draw from our immense heritage of intellectual production,
    living and dead, exotic and close at hand: from the Iphat and from Islam, from
    Heraclitus and Zhuangzi, from the Torah and from the Buddha, from the *Federalist
    Papers* and from the *Communist Manifesto*. Carbon-fueled capitalism has given
    rise to a truly marvelous liberal multiculturalism, but if we are to survive its
    death throws, tolerance must mature into conservation and synthesis, grounded
    in a faith in human community existing beyond any parochial identity, local time,
    or single place.


    The argument of this book is that we have failed to prevent unmanageable global
    warming and that capitalist civilization as we know it is already over, but humanity
    can survive and adapt to the new world of the Anthropocene if we accept human
    limits and transience as fundamental truths, and work to nurture the variety and
    richness of our collective heritage. Learning to die as an individual means letting
    go of our predispositions and fear. Learning to die as a civilization means letting
    go of this particular way of life and its ideas of identity, freedom, success,
    and progress. These two ways of learning to die come together in the role of the
    humanist thinker: the one who is willing to stop and ask troublesome questions,
    the one who is willing to interrupt, the one who resonates on other channels and
    with slower rhythms.


    The form this book takes is that of a story, but not a story about a person. Climate
    change is too big to be reduced to a single narrative, and the problems it presents
    us with demand that we transcend visually representative “picture-thinking” and
    work instead to create a sense of'
