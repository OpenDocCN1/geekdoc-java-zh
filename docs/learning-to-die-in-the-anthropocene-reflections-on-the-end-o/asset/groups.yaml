    impulse die in me or, should this fail, by my retransmitting it in a totally metamorphosed,
    verified, filtered, or recoded form. It serves nothing to contest it: I am free
    from the extent that I am able to immunize myself against infections of opinion.
    Precisely this continues to be the philosopher’s mission in society, if I may
    express myself in such pathetic terms. My mission is to show that a subject can
    be an interrupter, not merely a channel that allows thematic epidemics and waves
    of excitation to flow through it. The classics express this with the term ‘pondering.’
    With this concept, ethics and energetics enter into contact: as a bearer of a
