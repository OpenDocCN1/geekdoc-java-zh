    # ONE HUMAN ECOLOGIES


    Erpe toc of erpe erpe wyp woh,

    Erpe oper erpe to pe erpe droh,

    Erpe lyde erpe in erpe proh,

    Po heude erpe of erpe erpe ynoh.


    Earth took of Earth, Earth with woe,

    Earth other Earth to the Earth drew,

    Earth laid Earth in an Earthen trough,

    Then had Earth of Earth Earth enough.


    > Anonymous Middle English Lyric²²⁹


    The first human beings appeared in tropical Africa around two hundred thousand
    years ago, evolving out of proto-human hominids, born into a world that was even
    then undergoing intense climatic transformation.³⁰ The Earth was on average 3.5
    degrees Fahrenheit colder than it is today, and would soon average between 5 degrees
    and 9 degrees Fahrenheit colder. The global climate was frigid, dry, and harsh.
    The northern hemisphere was mantled in vast ice sheets up to two and a half miles
    thick that reached as far as Ohio, England, Germany, and northern China. Thirty
    percent of the Earth’s surface was covered in glaciers. The oceans were more than
    270 feet lower than they are now. This was the world in which we first evolved
    and learned to survive.


    Our ancestors, omnivorous hunter-gatherers who traveled in small bands, lived
    in equatorial Africa for many thousands of years. But when temperatures warmed
    up about 135,000 years ago, reaching averages as much as 5 degrees Fahrenheit
    warmer than the present, our ancestors fled the tropics for more temperate climates,
    hunting their way into the then-verdant grasslands of the Sahara. The Earth had
    entered what geoscientists call an interglacial period, a regular period of warming
    that occurs between much longer periods of colder temperatures every hundred thousand
    years or so.³31 These periods are typically brief, geologically speaking, each
    lasting ten thousand years.


    So it was for our ancestors on the Sahara: After a few millennia, temperatures
    dropped, getting even colder than the present (between 7 and 10 degrees Fahrenheit
    colder than the present), glaciers once again advanced toward the equator, and
    the oceans shrank. The Sahara lost the warmth that it had kept, and our hunter-gatherer
    ancestors scattered back to tropical Africa, east to the Nile valley and beyond,
    and north around the Mediterranean and into Europe, where they lived alongside,
    interbred with, and then wiped out our cousin, the Neanderthal. Over a long winter
    lasting thousands and thousands of years, as minor climate variations shifted
    temperatures up and down slightly over decades and centuries, human hunting bands
    expanded across Asia, eventually crossing the Bering land bridge to the Americas.


    Sometimes in that period, between one hundred thousand and fifty years ago, we
    developed the key social technologies that have proven our most substantial predatory
    advantages: culture and symbolic reasoning.³32 This advance was undoubtedly part
    of what helped us exterminate the Neanderthals and survive the harsher winters,
    and it also helped us turn the basic tool-use we had inherited from earlier hominids
    into the intricate technologies of the Cro-Magnon hunter: multilayer winter clothing,
    mammoth-bone houses, sewing needles, antler-tipped spears, religious rituals,
    and sophisticated tribal organization. From from about fifty thousand to about
    ten thousand years ago, Upper Paleolithic peoples experienced a veritable cultural
    explosion. The artifacts they show technologies more advanced in almost every
    way than those of their predecessors, more varied, more elaborate, more refined,
    and more beautiful, with some tools seemingly designed to be purely aesthetic
    in function—which is to say, works of art.³33


    After about fifteen thousand years before Hurricane Katrina, the planet started
    to warm up again, entering another interglacial period, with the most intense
    and rapid warming happening around 11,000 BCE. Humans began developing villages,
    basic animal husbandry, and more deliberate systems of gathering. A brief, localized
    cold snap caused the Younger Dryas, caused by glacial meltwater spilling into
    the Atlantic Ocean and shutting off the Gulf Stream brought frigid temperatures
    to Europe and drought to southwest Asia for a thousand years.34 According to archaeologist
    Brian Fagan, it was almost certainly this drought that drove the people in a small
    village on the Euphrates, who had until then depended for their sustenance hunting
    desert gazelles, harvesting nuts, and gathering wild grasses, to begin deliberately
    cultivating rice, lentils, and a grain called einkorn.35 By 9000 BCE, after the
    Younger Dryas had ended and the Gulf Stream switched back on, the agricultural
    revolution had begun. Neolithic humans hunted, herded, gathered, and farmed from
    Europe to South America, thriving in the warm and mild climate of what is now
    called the Holocene.


    A few thousand years later, the Laurentide ice sheet in Canada collapsed, causing
    a rapid rise in sea levels, and as happened with the Younger Dryas, shutting off
    the Atlantic Gulf Stream. Cold, dry conditions descended on Europe and southwest
    Asia. This cold drought lasted four centuries before the Gulf Stream switched
    on. In the marshy confluence of the Tigris and Euphrates rivers, farmers began
    irrigation canals to control flooding and increase crop yields. Villages grew
    into towns, and as people living in these new towns struggled to deal with the
    complex, difficult group effort to construct and maintain levee systems, keep
    records of floods and farm yields, and bring in the harvest, they began to develop
    refined definitions of labor, hierarchical political structures, sophisticated
    regions, and writing. Temples and marketplaces were built, traders carried goods
    from one town to another, and priests accumulated power as they hoarded knowledge
    of weather patterns and seed growth. The settlements of Urid and Uruk grew from
    clusters of villages to immense cities of tens of thousands. Through a complex
    interplay of droughts, population growth, and the increasing centralization of
    agriculture, human society based and around cities—what we call “civilization”—emerged
    in the fertile crescent of land arcing from present-day Lebanon through Syria
    and Iraq to the Persian Gulf. From approximately 3100 to 2200 BCE, Sumerian and
    then Akkadian kings ruled a vibrant form of life that stretched across Mesopotamia.
    But when a three-hundred-year-long drought hit the region, that empire fell apart.
    Mighty Uruk stood desolated. If human existence on Earth were a day, our approximately
    five millennia of recorded history would take up the last hour before midnight.
    99.9 percent of humanity’s two hundred thousand years on Earth, the average planetary
    temperature never rose above 61 degrees Fahrenheit and carbon dioxide concentrations
    never went above 300 parts per million. Nearly all of our energy came from direct
    photosynthesis: most of our fuel was plant food, for ourselves directly, through
    the animals we used and preyed on, or through biomass like wood, with some use
    of water and air through technologies like mills and sails, and negligible use
    of coal and oil. Then, in 1781, James Watt invented the modern steam engine. Suddenly
    power was portable, independent of living beings or natural forces, and able to
    run continuously. The steam turbine offered a vast improvement in energy production
    over wind, water, and animal labor, but it needed dense, hot-burning fuel for
    maximum output. Luckily for Watt, there happened to be loads of the stuff all
    over England: fossilized carbon in the form of coal.


    Industrial coal changed everything. For the last two hundred years, just one tenth
    of ten percent of human existence, most of our energy has come not from direct
    photosynthesis but from stored carbon in fossil fuels. Switching from a photosynthetic-based
    energy economy to a carbon-based energy economy increased human wealth beyond
    what anyone could possibly imagine, raising the overall standard of living across
    the world through technologies like diesel-fueled tractors, Haber-process nitrogen-fixed
    fertilizer, Bessemer steel, railroads, steamships, airplanes, electric power plants,
    the internal combustion engine, and the automobile. It also began a massive transformation
    of the physical systems regulating life on Earth. By transferring millions of
    tons of carbon from the ground into the air, we have wrought profound changes
    in the Earth’s climate, biosphere, and geology. Average atmospheric CO levels
    have rocketed from 290 ppm to over 400 ppm, a level the planet hasn’t seen in
    more than two million years. At the same time, methane (CH₄) levels have increased
    from 770 parts per billion to more than 1,800 parts per billion.

