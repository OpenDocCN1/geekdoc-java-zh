    # CODA


    # COMING HOME


    > When the last strip of light is dimming

    > When the spotlight starts to fade

    > If there''s no tomorrow

    > You better live


    —Sleater-Kinney, “Fade”


    The universe as we understand it began in a burst of light, and all we know came
    to being through the titanic explosions of stars. Slowly galaxies took shape as
    spinning accretions of rock began to circle individual suns. Our own planet formed
    out of gas and dust about four and a half billion years ago, and around a billion
    years after that, deep within Earth’s hot, turbulent oceans, life began.¹¹⁹ Microbial
    organisms flourished, diversified, and evolved, but within a billion years they
    faced a climatic transformation that almost sterilized the planet: proliferating
    photosynthetic cyanobacteria filled the atmosphere with oxygen, which was toxic
    to the planet’s dominant anaerobic life forms and nearly wiped them out. The oxygen
    also reacted with reduced methane, sending the Earth into a three-hundred-million-year-long
    ice age. The Great Oxygenation Event dramatically transformed the Earth’s biosphere.
    It also made possible the evolution of more complex plant and animal life.


    Over the past two billion years, complex single-celled and then multicellular
    life has developed in dynamic cycles of population booms and mass extinctions.
    Individual genetic lines, every species, and even whole ecosystems emerge, evolve,
    and disappear as environmental and climatic conditions change. A few billion years
    in the future, as our sun matures and grows brighter, it will heat the Earth to
    a super-greenhouse state, annihilating all terrestrial life. Eventually our sun
    will balloon into a red giant, then collapse. On an even grander scale, the universe
    will probably either expand entropically into a dim, frozen emptiness of slowly
    dissipating black holes, or collapse in itself and explode again, in an endless
    cycle of crunches and bangs.


    This astonishing cosmos is our home. There is no other. There is no Heaven, no
    Hell, no Judgment, no Elysium. We humans are precocious multicellular energy machines
    building hives on a rock in space, machines made up of and connected to countless
    machines, each of us a microcosm. Trillions and trillions of microorganisms live
    on our skin and in our stomachs, mouths, intestines, and respiratory tracts while
    we spin through our lives in innumerable intersecting orbits, shaped and pulled
    by forces beyond our reckoning. We are machines of machines in machines, all and
    seeking homeostatic perturbation, and our lives and deaths pass through this great
    cycle like mosquitos rising and falling in a puddling dry in the summer sun. Life,
    for a mosquito, a person, or a civilization, is a constant process of becoming,
    a continual emergence into patterns of attraction and aversion, desire and suffering,
    pleasure and pain. Life is a flow. The forms are transient. Death is nothing but
    the act of passing from one pattern into another.


    Planets do not decide to spin. Stars do not themselves ablaze. The universe to
    which we have been born breathes and burns by intricate, mathematical logic, yet
    the Earth''s formation had caused, it did not have reason or meaning. As Heraclitus
    wrote: “The universe, which is the same for all, has not been made by any god
    or man, but it has always been, and will be—an ever-living fire, kindling itself
    by regular measures and going out by regular measures.¹¹²⁰ No hand gave to the
    accretion of gas and dust that formed our sphere, and the dust itself did not
    intend to become a body. So might with the microbe in the Earth''s deep seas,
    the oxygen-spewing cyanobacteria, the first plants and reptiles, the monstrous
    dinosaurs, the earliest mammals, and the recent efflorescence of primate life.
    No intention gave rise to Homo sapiens and no outside form grants it value. The
    causality behind our human bloom is the same causality behind


    As humans evolved complex social networks, language, consciousness, and then culture,
    we came to organize our lives through systems of belief that saw not merely agency
    in the world, but will. We saw gods in the weather, in the trees, and in ourselves.
    When Homer''s Greeks stalk the battlefield, Ares drove them in frenies to kill
    and Athena stayed their hands. For those ancients, the will of men was subject
    to the will of gods, and all were ruled by fate. Causality was comprehended by
    seeing the universe as a well of personified forces. It was only later, after
    the rise of literacy, that Greek sages and poets began to articulate a difference
    we take as fundamental today, the distinction between human will and natural force.
    The independent persistence of written language—logos—became the structuring metaphor
    for the independent persistence of the human mind. We began to believe in the
    freedom of thought.


    As human civilizations rose and fell, devastated by plagues and famine, torn apart
    by changing climatic conditions, plundered by ravaging hordes, or collapsing under
    their own inertia, philosophers, priests, and poets kept trying to understand
    not only how the world worked, but what it meant. What does it mean to be human?
    What does it mean to live? What is good? What is truth? These questions plague
    us. We torture ourselves with them, making ourselves sick, driving ourselves insane.
    And even as we try to make sense of our lives, we are hurried on all sides and
    at all hours by stimuli, possessed by yearnings and passions we we’t choose, don’t
    understand, and can barely control. As we practice interrupting circuits of reaction,
    however, striving to recognize the forces that work and through us, we come more
    and more to see how these forces are the very wiring that connects us to each
    other and to the universe. As the god Krishna told Arjuna on the eve of battle,
    in the Bhagavad-Gita:


    Know that through lucid knowledge

    one sees in all creatures

    a single, unchanging existence, undivided within its divisions.¹¹¹²


    We are finite and limited machines, but we are not merely machines: we are vibrating
    bodies of energy, condensations of stellar dust and fire, at once matter and life,
    extension and thought, moment and frequency. The iron in our blood, the oxygen
    we breathe, and the carbon of which we are composed were all created in the dying
    hearts of stars. We are creatures of light, and can find in our history the lineaments
    of photohumanism going back to ancient days, a form of thought more powerful than
    any electronic web, more profound than merely social media. As was written in
    the Book of Proverbs parts, “The human spirit is the lamp of God, searching all
    the innermost parts.”¹²²


    If you look up at the sky on a clear night, far from the city’s glow, you will
    see streaming out of the darkness that has taken millions, billions of years to
    reach you. The farthest observed galaxy, photographed by the Hubble Space Telescope,
    is 13.2 billion light years away.¹²³ Its photons have been hurtling toward Earth
    almost since the Big Bang. Its light is so dim that it is invisible to the naked
    eye. Most of the universe, in fact, cannot be unseen; of the 300 sextillion astronomers
    estimate that the known universe contains, you can see, on a dark, clear night,
    no more than a million.


    Our knowledge of this vast universe remains ridiculously limited. At the same
    time, that same knowledge is utterly awesome. For a growth of carbon scum on a
    spinning rock in the backwater of an unremarkable galaxy years from anywhere to
    develop the technology to send radio telescopes into space to measure the age
    of the universe is a prodigious achievement. Our primate curiosity and intellectual
    hubris have inspired breathtaking audacity. Just a few thousand years ago, we
    were learning to make marks on clay. In the blink of an eye, we’ve brushed our
    fingers against eternity.


    It may be that we have crossed the summit of our knowledge and power, and the
    brief explosion of human life in the Holocene will turn out to have been as transient
    as an algae bloom. It may be, on the other hand, that we’ll find a way to survive
    in the Anthropocene, perhaps find ways to maintain human civilization in some
    recognizable format. Whether we survive or not, however, has already been laid
    out in the explosion of quantum energy that, more than thirteen billion ago, began
    the chain of events and reactions that have led to this moment: we writing this
    page, you reading it.


    The universe, to adapt a proposition of Wittgenstein, is everything that is the
