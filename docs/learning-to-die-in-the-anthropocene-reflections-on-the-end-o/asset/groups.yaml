    也就是自愿的、因此在功能上毫无意义的协议。与此同时，就在人民气候游行启动的同一天，全球碳项目发布了一份新报告，显示2013年全球温室气体排放增加了2.3%，其中中国增长了4.2%，印度增长了5.1%，美国增长了2.9%。^78
    奥巴马的口才也就如此了。


    这似乎是我们陷入的困境。在左翼和右翼，许多外交官、能源公司高管、投资者、科学家、无政府主义者、神职人员和活动人士——这些严肃的人都在对全球变暖以及迫切需要采取行动感到担忧。然而，跨整个光谱，似乎没有人拥有我们修复问题所需的工具、影响力或概念框架，来制定出保护我们免受最大危险的良好计划。文明没有“重置”按钮，也没有在未来十到二十年内转型全球基础设施、农业和能源网络的可行计划。当简单、专注且深思熟虑的人在那些失灵的政治机器（如碳定价市场、抗议活动和联合国）面前挣扎时，我们这些全球北方的人都在忙于自己的事情：开车、飞行、开着灯、运行暖气和空调、吃肉、为设备充电，过着基于廉价消费的不可持续的生活。


    一种荒谬的讽刺是，连接联合国、“冲击华尔街”、国际能源协会（IETA）和人民气候游行的这些不同群体的主要联系之一，是一种文化技术系统，它在默默埋没大量碳的同时，将愤怒转嫁到无能的反馈循环中。在那周的所有活动中，最常见的景象是人们在使用他们的
    iPhone 和安卓手机查看邮件、发推特和拍照。他们所接入的全球信息通信生态系统现在估计消耗了世界约10%的电力。^79 这个生态系统依赖煤炭。每当你查看邮件时，你都在加热地球。我们每天都这样做。我们停不下来。我们不会停止。


    人民气候游行的问题并不在于它缺乏目标，或者在于它分散注意力、肤浅和空洞。联合国的问题不在于政治家们无知、固执、自为利是或腐败。我们应对气候变化的方法的问题，不在于没有通过正确的法律、找到正确的碳价、改变人们的想法或提高意识。每个人已经很清楚了。问题在于问题太大了。问题在于不同的人想要不同的东西。问题在于没有人有真正的答案。问题在于，问题就是我们自己。


    # 冲突的强迫


