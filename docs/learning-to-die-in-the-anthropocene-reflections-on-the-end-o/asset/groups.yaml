    and all were ruled by fate. Causality was comprehended by seeing the universe
    as a well of personified forces. It was only later, after the rise of literacy,
    that Greek sages and poets began to articulate a difference we take as fundamental
    today, the distinction between human will and natural force. The independent persistence
    of written language—logos—became the structuring metaphor for the independent
    persistence of the human mind. We began to believe in the freedom of thought.


    As human civilizations rose and fell, devastated by plagues and famine, torn apart
    by changing climatic conditions, plundered by ravaging hordes, or collapsing under
    their own inertia, philosophers, priests, and poets kept trying to understand
    not only how the world worked, but what it meant. What does it mean to be human?
    What does it mean to live? What is good? What is truth? These questions plague
    us. We torture ourselves with them, making ourselves sick, driving ourselves insane.
    And even as we try to make sense of our lives, we are hurried on all sides and
    at all hours by stimuli, possessed by yearnings and passions we wouldn’t choose,
    don’t understand, and can barely control. As we practice interrupting circuits
    of reaction, however, striving to recognize the forces that work and through us,
    we come more and more to see how these forces are the very wiring that connects
