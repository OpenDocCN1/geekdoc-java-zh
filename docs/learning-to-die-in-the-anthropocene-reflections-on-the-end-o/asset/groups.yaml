  mdcn: '

    作为一名士兵为了生存，我必须学会接受死亡的必然性。为了让人类在人类世（Anthropocene）存续，我们需要学会与我们当前文明的终结共处。变化、风险、冲突、斗争和死亡是生命本身的过程，我们无法回避它们。我们必须学会接受并适应。


    人类心理本能地反抗“终结”的想法。同样，历史上的文明一直盲目地向灾难行进，因为人类天生倾向于相信明天会和今天大无相同。我们很难记住，这种生活方式、此时此刻、这种秩序并不是稳定且永久的。在当今世界，我们的行为证明了我们的信念：我们可以永远这样持续下去：燃烧石油、毒害海洋、杀灭其他物种、向空气中排放碳、、忽视煤矿井金丝雀那不祥的沉默，转而追求我们新数字想象空间中无止境的机器人推文。然而，全球气候变化的现实将继续侵入我们对永恒增长、持续创新和无尽能源的集体幻象，正如个体死亡的现实正冲击着我们对永恒的因果信仰。


    人类世带来的最大挑战并不是国防部应该如何规划资源路径，我们是否应该修筑海墙来保护曼哈顿，或者我们何时应该放弃迈阿密。这些问题无法通过买一辆普锐斯、关空调或签署条约来解决。我们面临的最大挑战是一个哲学问题：理解这个文明已经死亡了。我们越早面对自己的处境并意识到我们无能为力地自救自己，就越早能投入到艰巨的任务中——以凡人的谦卑适应我们的新现实。


    碳驱动的资本主义是一个僵尸系统，贪婪却贫瘠。这种侵略性的人类单质文化被证明具有惊人的毒性，但也具有毒性、自残性和自我毁灭性。它本身是不可持续的，对灾难性气候变化的反应也是不可持续的。坦率地说，碳驱动的资本主义并不是人类组织生活的唯一方式。在历史上，我们一次一次证明了自己有能力脱弃适应不当的意义和经济分配系统，针对贫困和威胁开发出韧性的社会技术，将过时的社会实践转化为新的生命形式。人类能否通过碳驱动资本主义的崩溃并进入人类世的新世界而生存，取决于我们是否能够在保护、维持和重塑我们集体文化技术故事的同时，保持我们旧的生活方式。毕竟，我们创新和适应的能力取决于我们是否能从庞大的知识生产遗产中汲取养分，无论生与死、异域与近旁：从《伊法特》到伊斯兰教，从赫拉克利特到庄子，从《托拉法》到佛陀，从《联邦党人文集》到《共产党宣言》。碳驱动的资本主义产生了一种真正奇妙的自由多元文化主义，但如果我们想在它的临终挣扎中幸存，宽容必须成熟为保护与综合，并植根于对超越任何派系认同、局部时间或单一地点的人类共同体的信仰。


    本书的观点是，我们未能防止无法调控的全球变暖，而且我们所熟知的资本主义文明已经结束，但如果我们接受人类的局限性和瞬时性是基本真理，并致力于培养我们集体遗产的多样性和丰富性，人类就可以生存并适应人类世的新世界。作为个体学会死亡意味着放下我们的偏见和恐惧。作为文明学会死亡意味着放弃这种特定的生活方式及其关于身份、自由、成功和进步的观念。这两种学习死亡的方式在人文主义思想者的角色中汇合：那个愿意停下来并提出棘手问题的人，那个愿意中断的人，那个在其他频道和更慢节奏上产生共鸣的人。


    本书的形式是一个故事，但不是关于某人的故事。气候变化太大了，无法简化为单一的叙事，它带给我们的问题要求我们超越视觉表性的“图像思维”，转而努力创造一种超越地点、生命或时间的集体感。这本书讲述的故事是人类灵魂在死亡中认清自的过程。它始于我们与地球关系的深层起源，在第一章“人类生态学”中，追溯到我们的当代困境。在第二章“棘手问题”中，我们思考这一困境。碳驱动资本主义及其技术乌托邦意识形态者推崇无限增长，但事实证明无法拯救我们。针对气候变化的各种“解决方案”从碳税到地球工程，没有一个是奏的。


    全球应对气候变化的失败根本上是一个集体行动问题，意味着是一个政治问题。在第三章“碳政治”中，我们思考应对气候变化的集体失败是如何成为政治体系的结果。我们所陷入的麻烦可能无法很好管理，如果我们能管理的话。面对人类世的死亡恐惧和冲突的必然性，是第四章“斗争的强制”的任务。接受我们的局限意味着与与生的纯真和不可避免的死亡和解。


    然而，通过学会死亡，我们可以连接并为人类未来开启可能，正如我在第五章“新启蒙”中所述。通过中断恐惧和反应的循环，深视死亡，并培养我们丰富的文化技术——从《吉尔伽美斯史》到《薄篇喜歌》，从想象的人类世未来——我们开启了与宇宙的新关系，在这种关系中，我们可能不是作为寄生消费者生存，而是作为创造者——在这种关系中，我们可能作为我们一切力量源头的光芒生存。

