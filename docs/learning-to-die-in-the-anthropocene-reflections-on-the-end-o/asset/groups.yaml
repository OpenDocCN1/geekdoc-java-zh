    > 吉尔伽美什史


    死亡从我们出生起就开始了。从我们生命的最初、闪眼、哭泣到死亡，我们是凡俗的，被赋予了生命，却注定要腐朽。在非常重要的意义上，我们并不需要学习死亡。


    虽然死亡可能是世界上最容易的事情，但它是最困难的事情——我们被驱使回避、逃避、战斗，直到最后一刻。每当你感到饥饿或野心，每当你因愤怒或恐惧颤抖，你体内的动物都在渴望生命。我们被困在两种需求之间：为了活着，注定死去。调和它们一直是我们最具挑战性的难题之一。我们的大部分能量消耗在否定死亡上。一些人认为否定死亡是文化的根源和胚胎，从我们的葬礼、祖先崇拜到整形手术和太空计划。人类学家埃内斯特·贝克（Ernest
    Becker）在他获得普利策奖的著作《死亡恐惧》中写道：“死亡的思想，对死亡的恐惧比任何事物都困扰人类。它是人类活动的主源——很大程度上是为了避免死亡的命运。”¹⁰⁰
    在整个人类历史上，我们在死后世界的无数光明愿景中投入了无数小时：天堂与地狱，家庭与国家，星际迷航。我们有了孩子，并将我们的基因传递给未来。我们建造金字塔、大教堂、寺庙、清真寺、纪念碑和摩天大楼，为了证明我们的某些部分将生存。当我们的建筑倒塌、身体衰弱时，我们通过快乐或战争分散注意力。自荷马时代以来，经历过战争的人就证明过，这里是“在杀戮中的喜悦感”，洗刷了死亡的苦味。”¹十¹


    接受存在的真相是智慧的开始。当蒙尔丹写下“哲学就是学习死亡”时，他正处于一个已经存在数百年的哲学传统之中工作。他引用了他的一位关键先驱——罗马修辞家西塞，蒙尔丹写道：“西塞说，哲学的意义无非是为了准备死亡。这是因为研究和沉思在某种程度上将我们的灵魂引出并保持在身体之外；这是一种死亡的学徒制和假象。或者是因为世界上所有的智慧和推理归结于一点：教我们不要害怕死亡。”¹۰²
    西塞反过来重新解读了柏拉图《斐多篇》中对苏格拉底死的描述，在书中苏格拉底认为哲学是学习如何将灵魂分离的练习。¹۰³

