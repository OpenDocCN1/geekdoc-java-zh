    这是至少十万年来大气甲烷浓度最高的一次。²37 这些变化破坏了由地球绕太阳运行调节的气候模式，并在未来数千年内继续产生破坏。


    我们的行星之所以能维持生命，是因为太阳能量击中地球时，部分能量会以热量的形式在大气中。有几种温室气体有助于这一点，包括二氧化碳、甲烷、水蒸气和氧化二氮。这些气体对于行星复杂的地球物理稳态至关重要。在数百万年里，这种稳态在“温室”状态和“冰室”状态之间来回移动。在上一次温室时期（始新世），地球是没有冰川的，从北极到南极都是热带气候，温度比现在高出20华氏度，二氧化碳浓度是现在的十倍。


    当时的海平面高出300英尺。大型爬行动物和矮小哺乳动物穿梭在茂密的森林中：长40英尺、重量超过一吨的蛇、像狗一样的小马、敏捷的猫科掠食者以及类猴的灵长类动物。鳄鱼和棕榈树在北极圈繁荣生长。那是五千万年前的事。从那以后，地球开始冷却，处于“冰室”状态已超过了250万年。我们很可能已经过早结束了那种状态。


    在智人出现在地球的前六万万年里，全球温度比覆盖现在的芝加哥和纽约的冰盖要低5到9华氏度。同样的幅度——5到9华氏度——正是地球预计在未来几代人内升升的幅度，这听起来并不多。毕竟，温度的变化每天都在发生，而且根据季节和地点，频率往往大得多。但当你谈论全球平均水平时，这些差异是巨大的。未来温度每升高5华氏度，意味着北大将在夏季不再结冰。山冰川将全部消失，随之消失的还有滑雪、雪层和许多淡水径。极端天气将对农业系统、植物动物栖息地以及人类基础设施造成破坏。我们将不得不应对更极端的温度波动、更高的湿度和剧烈的降雨、更强且持续时间更长的风暴、严重的干旱，以及曾经可靠的气候动力（如急流、厄尔尼诺南方涛动和湾流）发生不可预测的变化。珊瑚礁将灭绝，还有无数其他由于生态系统变化太快，以至于它们无法适应或迁迁的物种。


    更重要的是，5到9华氏度的升温最终将导致海平面上升高达200英尺。没有人确定这将发生得有多快：如果冰融化得缓慢，我们可能到2100年只看到海平面上升几英尺；如果冰融化迅速且格陵兰冰盖崩溃，我们可能在几十年内看到海平面上升20到30英尺。冰盖的融化速度已经比模型预测的快，有证据表明它们在过去曾迅速破碎，而且冰融化是一种反馈现象，这意味着融得越快，剩下的冰融化得就越快。这些因素意味着海平面快速且不可预测的上升完全可能。根据詹姆斯·汉森（James
    Hansen）的话，“经验数据显示，自然冰盖解体的速度可以达到每世纪海平面上升数米。”38无论是缓慢还是快速，海平面上升对现代文明来说都是灾难性的：居住在低洼沿海城市的数亿人不仅面临洪水的威胁，还将面临由于海平面升高、气候更湿润和风暴增强共同导致的风暴潮加剧的影响。


    情况更糟。5到9华氏度的全球变暖取决于“照常经营”，但有很大概率经营不会照常进行。人口的增长和碳消费的激增（特别在中国和印度）意味着在未来85年内，碳的产量可能会像最近几十年里那样增加。全球气候系统的反馈动力可能会让温度升高得更快。加拿大和西伯利亚的冻土融化可能会让温度升高得更快，显著增加大气中的二氧化碳，并可能导致温度升高80%。*39
    正如之前提到的，海洋底部的甲烷水化物可能会“释放，”使地球变得不再宜居。


    智人出现在地球的前六万万年里，全球温度比覆盖现在的芝加哥和纽约的冰盖要低5到9华氏度。我们的人类祖先是在一个冷却的气候中演化的，而我们现在所处的气候。人类文明的发展处于一个异常长且稳定的时期，即全新世，这个时期始一万年前最后一次冰期结束后开始。在全新世期间，气候非常稳定，允许了农业和城市的发展。但现在，这种稳定性正在结束。大气中温室气体的快速增加正导致气候以人类历史上未有的速度发生变化。我们正在见证一个持续千年稳定时期的结束，其后果将影响后代。


    ## 问题的两个方面


    对气候变化的科学研究可以追溯到19世纪初，当时地质学家和自然学家试图解释地球曾被冰川覆盖的证据，随着物理学家和化学家试图理解大气的组成和机制，科学得到了发展。


    瑞典科学家斯万特·阿伦尼斯（Svante Arrhenius）在1895年证明了二氧化碳水平与大气温度之间的密切关系，理论化了我们现在理解的温室效应，以及广泛的燃煤可能会升高全球温度.¹42
    在20世纪50年代和60年代，工业污染对全球气候的影响正被许多科学家研究，其中包括查尔斯·大卫·基林（Charles David Keeling），他在夏威夷马纳洛亚观测台测量的二氧化碳图表（即现在著名的“基林曲线”）清楚地显示大气中的二氧化碳正在增加。在接后的三十年里，人为全球变暖的证据不断增加，到20世纪80年代后期已经形成了科学共识。


    1988年，美国航空航天局空间研究所所长詹姆斯·汉森（James Hansen）在美国参议院作证，地球确实在变暖，并且“有99%的变暖趋势不是自然变率，而是由大气中二氧化碳和其他人工气体的积累引起的。”⁴3
    同同年，政府间气候变化委员会（IPCC）成立，就气候变化问题向联合国提供报告和建议，《联合国气候变化框架公约》于1992年建立，其签署承诺将全球温室气体排放稳定在安全水平。在随后的几十年里，虽然近两百个承诺履行公约的国家制定了各自的排放目标，但他们在监测或执行方面尚未达成任何共识。会议之后


