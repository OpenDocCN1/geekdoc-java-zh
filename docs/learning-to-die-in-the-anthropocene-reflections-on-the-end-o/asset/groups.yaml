    soon as 2040.^7 The collapse of the West Antarctic ice sheet alone, already underway,
    will eventually raise sea levels by as much as twenty feet.^8


    As glaciers and ice sheets melt, so too will carbon and methane long frozen in
    seabeds and permafrost. As a greenhouse gas, methane is more than twenty times
    more powerful than carbon dioxide, and thousands of gigatons of the stuff lies
    under the oceans in clathrate hydrates, waiting to be released: “These solid,
    ice-like structures are stable only under specific conditions,” writes oceanographer
    John Kessler, “and are estimated to contain a quantity of methane roughly equal
    in magnitude to the sum of all fuel reservoirs on Earth.^9 Methane-rich sinkholes
    have appeared in Siberia and methane bubbles have been tracked leaking from the
    floor of the Arctic Ocean, signaling the beginning of a massive planetary “belch”
    capable of generating catastrophic greenhouse effects.^10 As geicist David Archer
    warns, “The potential for planetary devastation by the methane hydrate reservoir
    ... seems comparable to the destructive potential from nuclear water or from a
    comet or asteroid impact.^11


    We’re fucked. The only questions are how soon and how badly. The Intergovernmental
    Panel on Climate Change’s (IPCC) 2014 report on climate impacts cautions: “Without
    additional mitigation efforts beyond those in today, and even with adaptation,
    by the end of the 21st century will lead to high to very risk of severe, widespread,
    and irreversible impacts globally.^12 According to the World Bank, 2.7 degrees
    of warming now appears inevitable, even if we were to stop emitting carbon dioxide
    (CO₂) worldwide right now.^13 Projections from researchers at the University of
    Hawaii find us dealing with “historically unprecedented” climates as soon as 2047.^14
    Climate scientist James Hansen, formerly with NASA, has argued that we face an
    “apocalyptic” future—a bleak view that is seconded by researchers worldwide.^15


    This chorus of Cassandras predicts a radically changing global climate causing
    widespread upheaval, and their visions of doom are backed by an overwhelming preponderance
    of hard data. Global warming is not the latest version of a hoary fable of annihilation.
    It is not hysteria. It is a fact. And we have likely already passed the point
    where we could have done anything about it. From the perspective of many policy
    experts, climate scientists, national security officials, the concern is not whether
    global warming exists or how we might prevent it, but how we are going to adapt
    to life in the hot, volatile world we’ve created.


    There is a name for this new world: the Anthropocene. The word comes from ancient
    Greek. All the epochs of the most recent geological era (the Cenozoic) end in
    the suffix “cene,” from kainos, meaning new. Anthro means human. The idea behind
    the “Anthropocene” is that we have entered a new epoch in Earth’s geological history,
    one characterized by the advent of the human species as a geological force.¹16
    The biologist Eugene F. Stoermer and Nobel-winning chemist Paul Crutzen advanced
    the term in 2000, and it has gained acceptance as evidence that has the changes
    brought by global warming will affect not only the world’s climate and biodiversity,
    but its very geological structure, and not just for centuries, but for millennia.¹17
    In the prophetic words of William Blake, written at the dawn of the carbon era
    more than two hundred years ago, “The generations of men run on the tide of Time
    / But leave their destin-delinements permanent for ever and ever.”¹⁸


    The International Commission on Stratigraphy, the geologists responsible for driving
    the “golden spikes” that demarc different geological periods, have adopted the
    Anthropocene as a term deserving further consideration, “significant on the scale
    of Earth history,” and are discussing what level of geological time-scale it might
    be and at what date we might say it began.¹⁹ Is it an “epoch” like the Holocene,
    or merely an “age” like the Calabrian? Did it start with the beginning of the
    Industrial Revolution, around 1800, or during the Great Acceleration in the middle
    of the 20th century? With the dawn of agriculture, 12,000 years ago, or on July
    16, 1945, with the first atomic bomb?”²⁰


    Whenever it be, it is the new world we live in. In a few generations we will face
    average temperatures 7 degrees Fahrenheit warmer than they are today, rising seas
    at least to ten feet higher, and worldwide shifts in crop belts, growing seasons,
    and population centers. Unless we stop emitting greenhouse gases wholesale now,
    humans will within a couple hundred years be living in a climate the Earth hasn’t
    seen since the Pliocene, three million years ago, when oceans were 75 feet higher.
    Once the methane hydrates under the oceans and permafrost begin to melt, we may
    soon find ourselves living in a hthouse climate closer to that of the Paleocene-Eocene
    Thermal Maximum, approximately 56 million years ago, when the planet was ice-free
    and tropical at the poles. We face the imminent collapse of the agricultural,
    shipping, and energy networks upon which the global economy depends, a large-scale
    die-off in the biosphere that''s already well under, and our own extinction as
    a species. If Homo sapiens survives the next millennium, it will be survival in
    a world unrecognizably different from the one we have known for last 200,000 years.


    In order for us to adapt to this strange new world, we''re going to need more
    than scientific reports and military policy. We''re going to need new myths and
    new stories, a new conceptual polyglot traditions of reality, and a new relationship
    to the deep quality of human culture that carbon-based capitalism has vitiated
    through commodification and assimilation. And against capitalism, we will need
    a new humanism. We need a new vision of humanism.


    Admittedly, ocean acidification, species extinction are problems that humanities,
    with their taste for fine-grained analysis, archival debates, might seem illsuited
    to address. After all, how will ancient philosophers, contemporary metaphysics
    protect us from colony collapse?


    But the conceptual and existential problems that the Anthropocene poses are precisely
    those that have at the heart of humanistic inquiry. What does it mean to be human?
    What is good? In the world of the Anthropocene, the question of individual mortality—What
    my life mean?—is universalized and framed in scales that baffle the imagination.
    As environmental philosopher Jamieson puts it, “The Anthropocene presents novel
    challenges for living a meaningful life.”22 Historian and theorist Dipesh Chakraborty
    has claimed that global warming calls us to visions of the human that neither
    rights talk ever contemplated.”23 Whether we are talking ethics or politics, ontology
    and epistemology, confronting the end of the world as we know dramatically challenges
    our learned perspectives and ingrained priorities. What does consumer choice mean
    against 100,000 years of ecological catastrophe? What does life mean in the face
    of mass death? How do we make meaningful decisions in the shadow of our inevitable
    end?


    These questions have no logical or empirical answers. They cannot be graphed or
    quantified. They are philosophical problems of Excellence. As Montaigne asserted,“To
    philosophize is to learn to die,” then we have entered humanity’s most philosophical
    age, for this is precisely the problem of the Anthropocene.”24 The rub is now
    that we have to learn to die not as individuals, but as a civilization.


    Learning to die isn''t easy. In Iraq, at the beginning, I was terrified by the
    idea. Baghdad seemed crazy dangerous, even though statistically I was relatively
    safe. We got shot, mortared, and blown up by IEDs, but we wore high-tech ballistic
    armor, we had great medics, and we were part of the most powerful military the
    world had ever seen.”25 The odds were good that I would come home, maybe wounded,
    but alive. Every day I drove out past the wire on mission, I looked in my Humvee’s
    mirror and saw a dark, empty hole.


    “For the soldier death is the future, the future profession assigns him,”wrote
    Simone Weil in her 1939 meditation on war, The Iliad, or the Poem of Force. Yet
    the idea of man’s having death for a future is abhorrent to nature. Once the experience
    of war makes visible the possibility of death that lies locked in each moment,
    our thoughts cannot travel from one day to the next without meeting death’s face.”26
    I recognized that face in the dark of my Humvee’s mirror. Its gaze almost paralyzed
    me.


    I found my way forward through an old book: Yamamoto Tsunetomo’s 18th-century
    Samurai manual, the Hagakure, which advised:

