    随着冰川和冰盖的融化，长期封锁在海底和永冻土中的碳和甲烷也将之释放。作为一种温室气体，甲烷的威力是二氧化碳的二十倍以上，数千千吨的这种物质以水水合物的形式存在海洋下，等待着释放：海洋学家约翰·凯斯勒（John
    Kessler）写道：“这些固态的冰状结构仅在特定条件下才是稳定的，估计其含量的甲烷总量相当于地球上所有燃料储量的总和.^9 西伯利亚出现了富含甲烷的塌洞，北冰洋海底也追踪到了泄漏的甲烷气泡，这标志着一场巨大的行星级‘打嗝’的开始，这种现象足以引发灾难性的温室效应.^10
    地质物理学家大卫·阿彻（David Archer）警告说：“甲烷水合物储层引发行星性毁灭的潜力……似乎与核水、彗星或小行星撞击的破坏潜力相当。”11


    我们完蛋了。唯一的问题是何时发生，以及程度有多严重。政府间气候变化专门委员会（IPCC）2014年关于气候影响的报告警告说：“如果不采取目前之外的额外缓解措施，即使采取适应措施，到21世纪末，全球将面临严重、广泛且不可逆影响的高风险至极高风险.^12
    根据世界银行的数据，即使我们现在在全球范围内停止二氧化碳（CO₂）排放，2.7度的升温似乎已不可避免.^13 夏威夷大学研究者的预测发现，早在2047年，我们将面临“史无前例”的气候.^14
    曾任职于NASA的气候科学家詹姆斯·汉森（James Hansen）认为，我们正面临着一个“末日性”的未来——这一阴暗的观点也得到了全球研究者的认同.^15


    这群“卡珊德拉”式的预言者预言了全球气候的剧烈变化将引发广泛动荡，而他们的末日愿景得到了压倒性的硬性数据的支持。全球变暖不是某个陈旧灭绝神话的最新版本。这不是歇斯底里。它是一个事实。而且我们可能已经过了可以采取任何行动的界点。从许多政策专家、气候科学家、国家安全官员的角度来看，担忧不是全球变暖是否存在或我们如何防止它，而是我们将如何适应我们所创造的炎热且不稳定的世界的生活。


    这个新世界有一个名字：人类世（Anthropocene）。这个词源于古希腊语。最近一个地质时代（新生世）的所有纪元都以后缀“cene”结尾，源自kainos，意为“新”。Anthro指人类。“人类世”背后的观点是，我们进入了地球地质历史上的一个新纪元，其特征是人类作为一种地质力量的出现16
    生物学家Eugene·F·斯托默（Eugene F. Stoermer）和诺贝尔奖化学家保罗·克鲁曾（Paul Crutzen）在2000年提出了这一术语，它已获得认可，证明全球变暖带来的变化不仅将影响世界的气候和生物多样性，还将影响其地质结构，而且持续不仅是几世纪，而是千年.^17
    廉·布莱克（William Blake）在两百多年前碳时代黎明写下的预言性诗句中写道：“人类的世代随时间的潮汐流逝 / 但他们留下的命运轨迹将永远永恒。”18


    国际地层学委员会（负责驱动划分不同地质时期‘金钉’的地质学家们）已采纳“人类世”作为一个值得进一步考虑的术语，认为“在地球历史尺度上具有重要意义”，并讨论它可能属于何种地质时间尺度，以及我们可能认为它是何时开始的19
    像全新世那样的“世”，还是仅仅像卡拉布里亚世那样的“代”？它是从1800年左右工业革命的开始开始，还是从20世纪中叶的大加速开始的？是从12,000年前农业的起源，还是从1945年7月16日第一枚原子弹开始的？”20


    无论何时，这都是我们居住的新世界。几代人之后，我们将面临比今天高出7华氏度的平均温度，海平面至少上升十英尺，以及全球作物带、生长季节和人口中心的迁移。除非我们现在就全面停止排放温室气体，否则人类将在几百年内生活在地球自300万年前上新世以来未曾过的气候中，那时的海平面高出75英尺。一旦海底和永冻土下的甲烷水合物开始融化，我们可能很快发现自己生活在接近古新世始新世极热气候中（大约5600万年前），那时地球没有冰，极地是热带气候。我们面临着全球经济所依赖的农业、航运和能源网络的迫在崩溃，生物圈中正在进行的大规模死亡，以及我们作为一个物种的灭绝。如果智人能活过下一个千年，那也将是在与我们过去20万年来所熟知的世界截然不同的世界中生存。


    为了适应这个奇特的新世界，我们需要的不仅仅是科学报告和军事政策。我们需要新的神话和新的故事，一种关于现实的新多语言概念传统，以及与人类文化深层品质的新关系，而碳基资本主义通过商品化和同化侵蚀了这种深度。面对资本主义，我们需要一种新的人文主义。我们需要一种新的人文主义愿景。


    诚然，海洋酸化、物种灭绝是人文科学通过其细微分析、档案辩论似乎无法解决的问题。但人类世提出的概念和存在性问题，正是人文探究的核心。作为人类意味着什么？什么是好的？在人类世的世界中，个体死亡的问题——我的生命意味着什么——被泛化到了难以想象的尺度。正如环境哲学家杰米森（Jamieson）所说，“人类世为生活带来了新的挑战。”22
    历史学家和理论家迪佩什·查克拉巴蒂（Dipesh Chakraborty）声称，全球变暖引发了我们从未考虑过的人类愿景。”23 无论我们讨论的是伦理还是政治、本体论还是认识论，面对终结都剧烈地挑战了我们的视角和优先事项。在不可避免的终结面前，我们如何做出有意义的决定？

