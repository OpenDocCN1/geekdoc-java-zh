    \ for gay pride, Halloween, and West Indian Day, and this march like those was\
    \ a carefully managed event. Indeed, the People’s Climate March was a logistical\
    \ behemoth involving more than 1,500 organizations, each with its own interests\
    \ and concerns. In order to keep those organizations united, the march’s leading\
    \ groups, Avaaz and 350.org, decided to forge message, unite demands, or a clear\
    \ target: the main message of the march was to be the march itself.\n\nYet the\
    \ message the march was supposed to embody was never clear. The intent was to\
    \ raise awareness, we would be right to ask what a march is supposed to do that\
    \ a preponderance of scientific data, decades of research, almost-daily articles\
    \ in major media outlets worldwide, and United Nations conferences on Climate\
    \ Change first met in Berlin in 1995 could not. If the plan of United Nations\
    \ Framework Convention was to convince conservative and mainstream Americans to\
    \ pay attention to climate change, it’s hard to see how a bunch of environmentalists\
    \ marching through a city most Americans consider a bastion of rich liberals might\
    \ be expected to accomplish such a thing. If the intent was to demonstrate the\
    \ political power that the umbrella organizations could motivate in terms of voters,\
    \ we would be right to ask which voters, where they’re from, what they usually\
    \ vote, and how many were there. None of that information was collected, so one\
    \ is left to wonder exactly what kind of pressure this march was supposed to put\
    \ on the American political process, or for that, any political process. The march\
    \ was tightly constrained by police barriers, directed through traffic streets\
    \ far from the location of the United Nations it was supposed to influence, and\
    \ dumped out in the empty blocks along the Hudson River west of midtown. With\
    \ no closing rally to the protesters, the march ended with an incoherent whimper,\
    \ as thousands of atomized individuals scattered back to their subways, cars,\
    \ and digitally wired but politically disconnected lives.\n\nIn truth, the People’s\
    \ Climate March was little more than an org of democratic emotion, an activist-themed,\
    \ real-world analogue to Twitter hashtag campaigns: something that gives you a\
    \ nice feeling, says you belong in a certain group, and is completely divorced\
    \ from actual legislation and governance<sup>73</sup> Given the march’s tremendous\
    \ built-in weaknesses, the best we might have hoped for is that it accomplished\
    \ nothing. What's more likely, though, is that it siphoned off organizing energy\
    \ that could have been more useful elsewhere, made a public display of climate\
    \ activism's political impotence, and soothed hundreds of thousands of people\
    \ with a false sense of hope.\n\nAt the Climate Summit two days after the march,\
    \ attendees didn't even get that spurious elixir, the only cure on there was bureaucratic\
    \ anesthetic. I made it to the upper balcony of the General Assembly Hall just\
    \ in time to catch the last few minutes of Leonardo DiCaprio's mellifluous opening\
    \ speech, and sat through much of the day with other journalists and observers\
    \ in the nosebleed seats, watching the statesmen' dull pageant take place far\
    \ below. While a range of development and finance schemes were presented as solutions,\
    \ as if the summit came down to a bleak ritual of stalemate, as if a business-class\
    \ version of Samuel Beckett's Endgame.\n\nAnother after they stood at the podium\
    \ mouthing vacuities, boldly committing to wholesale, voluntary reductions that\
    \ are too little, too late. The heads of Russia, Australia, Germany, India, and\
    \ China didn't even bother showing up. Barack Obama delivered a stirring oration\
    \ about how everyone needs to work together, chiding while glorifying America's\
    \ negligible emissions cuts, ignoring the roles that American coal and American\
    \ consumption play in stoking China's growth. The president of Tanzania, Jakaya\
    \ Kikwete, complained about how little African countries have contributed to the\
    \ problem and how much they stand to suffer, speaking poignantly about Mount Kilimanjaro's\
    \ disappearing glaciers. Baron Waqa, president of Nauru and chair of the Alliance\
    \ of Small Island States, argued passionately for more investment to help existentially\
    \ threatened nations like his own adapt. Chinese Vice Premier Zhang Gaoli addressed\
    \ the United Nations with a stiff and defensive speech in which he promised that\
    \ China would peak its carbon emissions “as soon as possible” and reduce its per-capita\
    \ emissions whenever it got around to it (a position only nationally mitigated\
    \ by the subsequent US-China climate agreement).\n\nBetween marching in the protest\
    \ on Sunday and going to the UN summit on Tuesday, I rushed up and down Manhattan\
