    Earth laid Earth in an Earthen trough,

    Then had Earth of Earth Earth enough.


    > 匿名中世纪英语抒歌²²⁹


    第一批人类大约在二十万年前出现在热带非洲，由原始人科人类演化而来，他们出生时的世界正经历着剧烈的气候变迁.³⁰。当时地球的平均温度比现在低 3.5 华氏度，很快将维持在平均低
    5 华氏度到 9 华氏度的水平。全球气候寒冷、干燥且严酷。北半球被厚达二五半英里的巨大冰盖覆盖，范围一直延伸到俄亥俄、英国、德国和中国北部。地球表面的 30%
    被冰川覆盖。海洋平面比现在低了 270 英以上。这就是我们最初演化并学习生存的世界。


    我们的祖先是成小群体旅行的杂食性狩猎采集者，在赤道非洲生活了数万年。但当大约 13.5 万年前温度升高，平均比现在高出达 5 华氏度时，我们的祖先逃离热带寻找更温和的气候，通过狩猎进入了当时撒哈拉绿葱葱的草原。地球进入了地理学家所谓的“间冰期”，即每隔十万年左右的漫长寒冷期之间发生的周期性变暖期.³31
    从地质学角度来说，这些时期通常很短暂，每个持续一万年。


    我们在撒哈拉的祖先所经历的如此：几千年后，温度下降，变得比现在还要冷（比现在低 7 到 10 华氏度），冰川再次向赤道推进，海洋面积萎缩。撒哈拉失去了它保持的温暖，我们的狩猎采集者祖先散回热带非洲，向东到达尼罗河谷及以外地区，向北环绕地中海进入欧洲；在那里，他们与我们的表亲尼安德特人生活在一起、杂交，并最终消灭了他们。在持续数千年的漫长冬季里，随着微小的气候变化在几十年或几个世纪内略微引起温度波动，人类狩猎部落扩张到整个亚洲，最终跨越白令陆桥到达美洲。


    在那个时期（即从 10 万年前到 5 万年前）的某些时候，我们开发出了证明我们拥有最实质捕食优势的关键社会技术：文化和符号推理.³32 这一进步无疑是帮助我们消灭尼安德特人并在严酷寒冬中生存的一部分，它还帮助我们将从早期人科那里继承的基础工具使用转化为克罗马格农人狩猎者的复杂技术：多层冬衣、猛犸骨房屋、缝纫针、鹿角尖矛、宗教仪式和精密的部落组织。从大约
    5 万年前到 1 万年前，上旧石器时代的人们经历了一场真正的文化爆炸。他们留下的器物展示的技术在几乎每一个方面都比前人更先进、更多样化、更复杂、更精细、更美丽，某些工具的设计似乎纯粹是为了审美——也就是说就是艺术品.³33


    在飓风卡特娜发生约 1.5 万年后，地球开始再次变暖，进入另一个间冰期，最剧烈和最快速的变暖发生在公元前 1100 年左右。人类开始建立村庄、基础畜牧业和更有计划的采集系统。一次短暂的局部冷潮由于冰川融水流入大西洋关闭了湾流，给欧洲带来了持续千年的严寒，给亚洲南部带来了干旱.³4
    根据考古学家布莱恩·法根（Brian Fagan）的说法，正是这种干旱促使了幼格拉底河畔一个小村庄的人们（他们此前一直依靠狩猎沙漠羚羊、采集坚果和野草生存）开始有意识地栽培水稻、扁豆和一种名为单粒的谷物.³5
    到公元前 9000 年，随着新冰期结束和湾流恢复，农业革命已经开始。新石器时代的人类从欧洲到南美进行狩猎、放牧、采集和耕作，在现在被称为全新世的温暖温和的气候中繁荣发展。


    几千年后，加拿大的劳伦德冰盖崩塌，导致海平面迅速上升，正如新冰期发生的情况一样，关闭了大西洋湾流。寒冷干燥的状况降临欧洲和亚洲南部。这种寒冷干旱在湾流恢复之前持续了四个世纪。在底格里斯河和幼发底河的沼泽交汇处，农民开始挖掘灌溉渠以控制洪水并增加产量。村庄发展成长城镇，随着住在新城镇的人们努力应对复杂艰巨的集体协作——建造和维护堤坝系统、记录洪水和农作物产量、运输收获——他们开始对劳动进行精细定义，建立阶级化的政治结构、复杂的地区管理和文字。神庙和市场落建成，商人将货物从一个城镇运到另一个，祭司通过积累天气模式和种子生长知识积累权力。乌里德（Urid）和乌鲁克（Uruk）的定居点从村落群发展为数万人的巨城。通过干旱、人口增长和农业日益中心化的复杂相互作用，以城市为基础和中心的人类社会——我们所谓的“文明”，出现在从现今黎巴嫩穿越叙利亚、伊拉克到达波斯湾的肥沃新月地带。大约从公元前
    3100 年到 2200 年，苏美尔和随后的阿卡德国王统治着横跨美索不达米亚的活力生命形态。但当一场持续三百年的干旱袭击该地区时，这个帝国崩溃了。伟大的乌鲁克沦为荒芜。如果人类在地球上的存在是一天，我们大约五千年的记载历史只占最后的一个小时。工业煤炭改变了一切。在过去的两百年里（仅占人类存在的百分比之十分之一），我们大部分能量不再来自直接光合作用，而是来自化石燃料中储存的碳。从光合作用的能量经济转向碳基能量经济，使人类创造了超乎想象的财富，通过柴油拖拉机、哈伯法固氮肥料、贝塞麦炼钢、铁路、蒸汽轮、飞机、发电厂、内燃机和汽车等技术，提高了全球整体生活水平。


