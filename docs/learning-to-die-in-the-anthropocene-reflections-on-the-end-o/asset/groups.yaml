    Fear comes to every day in our encounters with increasingly militarized police
    and our humiliating interactions at metal detectors and body-scan machines. Fear
    comes to us in the absence of job security, in our want of appeal when confronted
    by institutionalized inequality, and in our mistrust of corrupt institutions.
    Fear comes to us in widespread surveillance, in the form of a homeless woman or
    a hospitalized friend without adequate financial support, and in the constant
    nagging worry that we’re not working hard enough, not happy enough, never going
    to “make it.” Fear comes to us in weather porn, unpredictable shifts in formerly
    stable climate dynamics, and massive storms.


    More than any other way, fear comes to us in images and messages, as social media
    vibrations, products of cultural technologies that we have interpolated into our
    lives. Going about our daily business, we receive constant messages of apprehension
    and danger, ubiquitous warnings, insistent needing jabs to the deep lizard brain.
