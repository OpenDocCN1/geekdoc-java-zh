    Somebody killed somebody. Guns. Crime. Immigrants. Terrorists. Arabs. Mexicans.
    White supremacists. Killer cops. Demonic thugs. Rape. Murder. Global warming.
    Ebola. ISIS. Death. Death. Death.


    Sociologist Tom Pyszczynski: “People will do almost anything to avoid being afraid.
