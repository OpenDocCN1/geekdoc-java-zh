  mdcn: "\n每吨成本“从几美元到几百美元不等。”^58 正经济学家迈克尔·格鲁布（Michael Grubb）描述这个问题时说：\n\n应用于气候变化的经济效益分析的圣杯是建立“二氧化碳排放的社会成本”——即排放每吨二氧化碳所造成的损害。所示，这种计算结果与其他任何事情一样充满不确定性——事实上甚至如此。在观点分立的世界里，它并不能提供客观的答案，而是不可避免地反映了人们在讲述故事中所带入的假设和价值观。气候政策将面临“不可比拟的效益估算”。即使是世界顶尖的经济学家也承认，他们无法就如何解决这个问题达成共识，甚至在如何权衡随时间变化的影响这一单一维度上无法一致，更不用其他维度了.^59\n\
    \n处于经济竞争中的人口和国家，在化石燃料储备上的投资极不平等，且面临着全球气候变化带来的不平等影响，极不可能对每吨二氧化碳应该价值多少达成共识，因此，建立严格、通用的碳税几乎是不可能的。如果这听起来过于悲观，请考虑美国、俄罗斯和中国——它们共同承担了全球约48%的二氧化碳排放——都没有国家级碳税，而这些国家中的一些是化石燃料出口国，依赖第三个国家日益增长的能源市场。此外，碳税不仅面临化石燃料生产者的剧烈反对，还面临选民的反对：最引人注目的是澳大利亚在2014年成为第一个废除国家碳税的国家。\n\
    \n许多人主张的不是这种税收，而是通过全球性的“总量与交易”机制来实现去碳，这种机制曾帮助解决了酸雨问题。^60 在总量与交易方案中，会设定排放限制并逐渐逐步收紧，同时允许排放者在之间进行排放额度交易，以使合规成本最小化。但托马斯·谢林（Thomas\
    \ Schelling），一位诺贝尔奖得主经济学家和战略系统理论学家，强有力地论证了碳交易根本行不通。\n\n虽然谢林“相信激励的必要性、明确定义的义务以及交易的优处”，但他“无法想象出一种针对二氧化碳排放的此类制度”。⁶¹\
    \ 他的主要理由非常直白。首先，“任何严肃的制度都必须在几十年内分配排放权，而不仅仅是一次十年，而是累积的”，而且没有办法就未来百年的排放限制应该是多少达成共识，也无法决定超出限制的成本。其次，“在最初的半个世纪左右时间内，几乎不可能判断一个国家是否朝着实现其最终累积限制的目标。”第三，执行需要一个既能惩罚富国也能惩罚贫穷国家的独立机构，而很难想象这样一个执行机构将如何运作，或者它的权威从何处而来。正如谢林指出的，“历史上没有任何先例表明，有任何国际制度可以施加与全球变暖规模相称的惩罚……这种东西从未存在过，甚至难以想象。”⁶²\
    \ 考虑这样一个事实：人类贩卖、种族灭绝、酷刑或使用化学武器以及侵略战争都已受到国际协议的禁止，但此类犯罪仍在发生，而且往往是由许多禁止这些行为的条约的主要签署国实施的。在倾倒碳排放方面，期望事情会有所不同似乎是不负责任的。\n\
    \n由于我们不太可能通过监管来消除二氧化碳排放，也许我们应该把它们埋掉。碳捕集与封存（CCS）被提作为一种可以实现这一点的技术解决方案。通过CCS，你在烟囱顶部安装管道来收集CO₂，然后将其埋在任何地方。问题是，CCS是一项新型且昂贵的技术，在全球范围内快速开发以产生真正影响的机会很小。根据国际能源署（IEA）的数据，要将全球变暖控制在7.2华氏度以下，足够的CCS开发每年需要50亿到60亿美元的全球投资。截至2013年，全球对CCS技术的累计投资平均每年仅为20亿美元.³³\
    \ IEA2009年的路线图要求，足够的以保持全球变暖在7.2华氏度以下的CCS开发需要每年50亿到60亿美元的全球投资。全球CCS技术的累计投资平均每年仅为20亿美元。由于2012年，由于在大气层中注入了约5000万吨二氧化碳，由于变暖已经发生了气候变化，平层注入硫无法产生信心。IEA解释道：“由于市场并不看重CCS的效益，且由于化石燃料公司依然强大，我们没有理由预计其将在大规模上得到实施。”⁶⁵\n\
