    由人类活动引起。与此同时，收听 NPR 的自由主义者希望相信茶党共和党人负有责任，这样他们就可以将问题定性为可以通过道德教育和启蒙式消费主义来解决的问题，仿佛这一切仅仅取决于说服人们多吃羽衣甘蓝和开电动汽车。一位气候活动人士认为，仅
    90 家公司就承担了几乎历史室气体排放量的三分之二，这方便地免除了数十亿汽车司机、飞机乘客、肉食者和手机用户的责任。96 敌人并不在某处——敌人就是我们自己。不是作为个体，而是作为一个集体。一个系统。一个蜂巢。


    我们如何阻止自己沦为一个碳成瘾蜂巢中具有社会生产力的工蜂，履行命运，在某种精神病态的菌落崩溃综合中自我毁灭？我们又如何中断恐惧、侵略、危机和反应的持续循环，这些循环不断促使我们进入愈发疯狂的绝望状态？我们可能开始回答这些问题的方法之一是根据彼得·斯洛特里克（Peter
    Sloterijk）关于哲学家作为“中断者”的思想来思考全球变暖问题：


    > 我们不断生活在激发场中；只要我们还是社会生物，这一点就无法改变。压力输入进入我的体内；思想不是自由的，我们每一个人都能预判它们。它们源于报纸，最终回到报纸。我的主权，如果存在的话，只能通过我让整合的冲动在我体内死去来体现，或者如果失败了，通过我以一种完全蜕变、经过验证、过滤或重新编码的形式重新传输它。反抗它是毫无意义的：我的自由程度取决于我能在多程度上使自己免受意见感染。这恰恰是哲学家在社会中持续的任务，如果我可以用这样可怜的辞藻表达的话。我的使命是证明主体可以是一个中断者，而不仅仅是一个让主题流行病和激发浪潮流而过的通道。经典著作用“沉思”（pondering）一词表达了这一点。通过这个概念，伦理与能量学产生了联系：作为哲学功能的载体，我既没有权利也没有欲望成为压力-语义链中的导体，或伦理命令的自动机。97


    斯洛特里克将政治功能类比为集体震动的构想与哲学的中断功能相比较。与冲击系统并将整体粉碎的“破坏”（disruption）不同，“中断”（interruption）是悬停持续的过程。不是粉碎，而是共处。不是阻塞，而是反思。


    斯洛特里克认为，哲学家在人类群中的角色是一个异类的的“反工蜂”，它按照自己的节奏跳慢舞，既不适应集体的节拍，也不以机械的、教条的、义务论的方式运作，而是通过不断中断自身与生命的连接，对我们生活并穿行其中的社会能量浪潮不断进行自我免疫。只要一个人允许自己成为“压力-语义链中的导体”，无论内容如何，他都在加强重新传输的连接通道，加厚了大众社会的反射性结缔组织，使我们所有人更容易受到民族主义、替罪羊化、恐慌和战争狂热等病毒式现象的影响。中断社会生产的流向是无政府主义且适得其反的，就像所有优秀的哲学一样：如果它有效，它能帮助我们停下来，以新的方式看待我们的世界；如果它失败了（正如它经常且通常那样），中断者就会被整合、被逼疯、被忽视或被毁灭。


    斯洛特里克帮助我们看到的是，对社会激发的自主反应，意味着不对其做出反应，不传递它，而是中断它，然后让这种激发消失或将其完全转化。对持续的恐惧和暴力的图像做出自由反应，对永恒的快乐与恐惧媒体循环做出自由反应，对战争、环境灾难和全球毁灭的持续警报做出自由反应，需要情感的重新定位，以便每一个新冲动都能保持距离，直到它消退或可以被改变。当生命跳动着红色的节奏，人类群顺从冲突的强迫跳舞时，中断者在练习死亡。


