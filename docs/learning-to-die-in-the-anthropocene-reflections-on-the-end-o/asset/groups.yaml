    — 伊丽莎·科尔伯特，2015年普利策奖获得者，《第六次灭绝：非自然史》作者\n\n“罗伊·斯克兰顿以极其罕见的诚实清晰地阐述了气候危机的深度，然后呼吁一种重新想象的人性，以帮助我们以竭尽最大的尊严面对风暴肆虐的未来。虽然我不认同他关于社会运动推动雄心缓解措施潜力的结论，但这是由一位优雅作家和原创思想者提出的明智且重要的挑战。这是一次批判性的干预。”\n\
    — 娜奥米·克莱因（Naomi Klein，《改变一切：资本主义对抗气候》作者）\n\n“我们完蛋了。我们知道。某种程度上如此。但罗伊·斯克兰顿在这部灼热的新书中深入黑暗，凝视着它，目毫不眨眼。他带回了些丝来之不易的光亮……哲学是什么？它是在思想中被理解的时间。这是我们的时代，而罗伊·斯克兰顿有勇气用散文来思考它，这种文字有时感觉像子弹，但又是要点。”\n\
    — 西蒙·克里奇莱（Simon Critchley，《纽约时报》观点专栏编辑，《石块》作者，《无限的需求：承诺的伦理，抵抗的政治》作者）\n\n罗伊·斯克兰顿看透了。他骨子里知道这个文明已经结束了。他知道现在是时候重新开始人类的舞蹈，去创造另一种生活方式了。他以他独特且原创的方式，梳理了一种常见的文化遗产，为这些引人入胜的时代创造了新鲜的新事物。这篇简洁而精的文字既提供了令人不安的真相，也带来了意想不到的喜悦。\n\
    > — 麦肯齐·瓦克（McKenzie Wark，《分子红：人类世理论》作者）\n\n“一本雄辩、有野心且具有挑衅性的书籍。”\n> — 罗布·尼松（Rob\
    \ Nixon，《慢暴力与穷人的环保主义》作者）\n\n“罗伊·斯克兰顿为人类世写了一声哀嚎——一本充满激情、火花、科学和智慧的书。它比以往关于该主题写过的任何东西都更深刻。”\n\
