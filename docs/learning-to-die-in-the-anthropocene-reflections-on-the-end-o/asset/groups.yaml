    # TWO

    A WICKED PROBLEM


    I have seen this swan and

    I have seen you; I have seen ambition without

    understanding in a variety of forms.


    —Marianne Moore, “Critics and Connoisseurs”


    In Iraq today, as in Uruk four thousand years ago, human beings live at the

    mercy of a changing climate. Decreased rainfall and diminished snowpack

    in the mountains that the Tigris and Euphrates are drying up, a

    problem exacerbated by new dams, increased water use, and water

    diversion in Turkey, Iran, and Syria. Drought, Saddam Hussein’s draining

    of the Mesopotamian Marshes, and the devastation and abandonment of

    farmland due to years of war, neglect, and neoliberal economic policies

    favoring foreign imports over local produce have increased desertification,

    which in turn is unleashing dust storms on Iraq’s cities and

    crops.¹⁴¹


    There are, of course, many differences between Uruk’s distant collapse

    and Iraq’s crisis. One of the most important is that Iraq’s situation

    is man-made, while Uruk was not. Another is that in 2200 BCE, the only

    things that beleaguered Sumerians could do in response to a changing

    climate were ration their grain and pray. Today, national, regional, and local

    goverments worldwide, in cooperation with international bodies such as

    t IPCC, the United Nations Framework Convention on Climate Change

    (UNFCCC), the World Bank, the International Energy Agency (IEA), and

    the World Trade Organization (WTO), confront the problem of global

    warming with tremendous resources, the knowledge of thousands of highly

    trained scientists and engineers, and the support of hundreds of thousands

    of dedicated activists and concerned citizens. Yet for all that, we seem no'
  - '[PAGE 27]


    more capable than the people of Uruk when it comes to rescuing ourselves from
    imminent catastrophe.


    The scientific study of climate change goes back to the early nineteenth century,
    when geologists and naturalists struggled to make sense of evidence suggesting
    that much of the Earth had once been covered in glaciers, and the science developed
    as physicists and chemists sought to understand the composition and mechanics
    of the Earth''s atmosphere. The Swedish scientist Svante Arrhenius demonstrated
    the close relation between carbon dioxide levels and atmospheric temperature in
    1895, theorizing what we now understand as the greenhouse effect and that widespread
    coal burning might increase global temperatures.^42 By the 1950s and 1960s, the
    effects of industrial pollution on the global climate were being studied by many
    scientists, among them Charles David Keeling, whose graph measuring carbon dioxide
    at the Mauna Loa Observatory in Hawai''i, the now-famous “Keeling Curve,” showed
    clearly that atmospheric CO2 was increasing. Over the next thirty years, evidence
    for man-made global warming grew, and by the late 1980s a scientific consensus
    had been established.


    In 1988, James Hansen, director of the National Air and Space Administration''s
    Institute for Space Studies, testified before the US Senate that the Earth was
    definitely warming, and “that it was 99 percent the warming trend was not a natural
    variation but was caused by a buildup of carbon dioxide and other artificial gases
    in the atmosphere.”^43 The Intergovernmental Panel on Climate Change was founded
    that some year to report and advise the United Nations on the problem of climate
    change, and the United Nations Framework Convention on Climate Change was established
    in 1992, committing its signatories to stabilizing global greenhouse gas emissions
    at a safe level. Every member nation of the UN signed the UNFCCC treaty in 1992
    and had not ratified it by 1995, but the commitments they made with no clear objectives,
    no viable mechanism for monitoring objectives were achieved, and no binding authority
    to enforce compliance.


    In the decades since, while the almost two hundred nations committed to the UNFCCC
    have worked out individual emissions targets, they have not come to any agreement
    on monitoring or enforcement. Conference after'
- md: '

    conference has sunk under its own weight as a lack of accountability, intransigence
    from the US, China, and India, outsized goals set with no realistic plan for achieving
    them, bickering, and global power politics have led to failure after failure.
    Meanwhile, global greenhouse emissions have increased 35 percent since 1990, driven
    primarily by waste carbon dioxide from expanding energy consumption in North America
    and Asia.44


    The only way to keep global warming from accelerating out of control would be
    to stop dumping carbon dioxide immediately. In the stern words of the IPCC: “Climate
    change can only be mitigated and temperature stabilized when the total amount
    of CO2 is limited and emissions eventually approach zero.”45 With just the CO2
    in the atmosphere and oceans today, we are already set for at least 2 to 3 degrees
    Fahrenheit warming above pre-industrial levels, and it might be like 5 or 6 degrees
    Fahrenheit. Any more CO2 we put in from now on (by starting a car, for instance,
    or charging a phone) is only going to amplify that. So even if we banned CO2 right
    now, this very instant, would we still be facing severe climate impacts for centuries.
    Unfortunately for us, given the realities of global politics, a comprehensive,
    enforceable, worldwide ban on CO2 is sheer fantasy.


    But what other solutions? What about mitigation? What about decarbonizing our
    economy, replacing coal and oil with renewable energy or nuclear power? What about
    a carbon tax? What about cap-and-trade, carbon capture and sequestration, carbon
    extraction, and geoengineering? Might these strategies help us end, reduce, or
    at least mitigate our CO2 before we hit a tipping point and it''s too late?


    Ending our reliance on carbon-based fossil fuels—decarbonizing the global economy—would
    be the most reliable path to limit and eventually stop wasting CO2. The problem
    is that global decarbonization is effectively irreconcilable with global capitalism.
    Capitalism needs to produce profit in order to spur investment. Profit requires
    growth. Global economic growth, order even basic economic stability, depends on
    cheap, efficient energy.


    Decarbonizing the global economy without a replacement energy source would mean
    turning off approximately 80 percent of our power, causing a worldwide economic
    meltdown that would make the Great Depression look like a sluggish sales season.
    While not nearly as dire, worldwide decarbonization with replacement energy still
    looks pretty unpalatable. The most reliable studies suggest that even stabilizing
    CO2 at a relatively low but still unsafe level would require long-term economic
    austerity. According to the Potsdam Institute for Climate Research, stabilizing
    carbon dioxide levels at 450-500 ppm (which is 100–200 ppm over the upper limit
    for keeping warming anywhere near 3.6 degrees Fahrenheit [2 degrees Celsius])
    allows for slowing and probably even contracting the global economy indefinitely,
    basically extending the Recession into the indefinite future.46 No population
    on the planet today is going to willingly trade economic growth for lower carbon
    emissions, especially since economic power remains the key index of global status.47
    The political paroxysms of forced austerity ranking countries across Europe today
    are only a taste of what we would have to look forward to under a carbon-usterity
    regime.


    Offering a glimmer of hope, the IPCC’s 2014 report on mitigation argues that we
    can avoid the worst of global warming with what would be only a slight decrease
    in global economic growth—about .06 percent.48 The report claims shifting investment
    from oil and coal production to research and development of renewable energies,
    nuclear power, and carbon capture and sequestration could make it possible to
    decarbonize within thirty or forty years with only a slight cost to global domestic
    product. The report may be right, but the IPCC’s numbers are speculative, not
    predictive: The renewable and carbon capture technologies the report’s numbers
    depend on are still emerging, and we do not know yet whether they can work on
    a large enough scale to make a difference, or how much more they might cost than
    carbon fuels do. As well, critics have pointed out a variety of problems with
    the IPCC’s numbers on decarbonization, ranging from excessive political influence
    affecting data to biases in models underestimating economic impacts.49


    Adding to our troubles, it’s no simple thing to completely renovate worldwide
    energy infrastructure that has taken many years to build. Vaclav Smol, one of
    the world’s leading energy analysts, observes: “There are five major reasons that
    the transition from fossil to nonfossil supply will be much more difficult than
    is commonly realized: scale of the shift; lower energy density of replacement
    fuels; substantially lower power density of the renewable energy extractions;
    intermittency of renewable flows; and uneven distribution of renewable energy
    resources.^50 It would take decades to develop and implement new systems of carbon-free
    or carbon-minimal energy infrastructure, if it''s even possible, and we won''t
    have decades.^51 Even 2035, a twenty years from now, will be too late. It''s very
    likely already too late now.


    Another major problem we face in decarbonizing and rebuilding global energy infrastructure
    is that the prime candidates for clean renewable power, solar and wind, are in
    themselves not reliable enough to supply the baseline energy we need to keep our
    lights burning, our EKGs and medical respirators beeping and pumping, and our
    servers crunching data. “The central and deeply intractable fact about electricity,”
    writes journalist and historian Gwynne Dyer, “that it must be generated at the
    very moment it is used. This poses a major problem for those in charge of supplying
    a society with electricity, since . . . the demand can vary as much as threefold
    from a mild weekend day in summertime to a cold midwinter evening.^52 The problem
    of variable demand the problem of variable supply: they depend on the weather,
    which changes dramatically from day to day and hour to hour.


    The managers of the big grids, who already have to cope with wildly fluctuating
    levels of demand, are now asked to deal with uncontrollably fluctuating levels
    of supply and can only go so far; only Germany and Denmark have approached 20
    percent but most grid managers are very unhappy about going beyond that level.^53
    With better programs for predicting short-term wind fluctuations they might be
    persuaded to go up to 50 percent, but beyond . . you simply cannot go unless you
    are prepared to accept periodic collapses of the entire grid.^54 Many critics
    question whether renewable energy will ever be a feasible alternative to carbon
    fuels, pointing out that its cost-to-energy ratios are simply too high. Even James
    Hansen, one of the most outspoken scientists on the urgent need to address global
    warming, remains skeptical: “Most energy experts agree that, for the foreseeable
    future, renewable energies will not be a sufficient source of electric power.
    There is also widespread agreement that there are now just two options for nearly
    carbon-free large-scale power: coal with carbon capture and storage, and nuclear
    power.”55 As Hansen wrote with three other scientists in a controversial open
    letter in 2013, “Renewables like wind and solar and biomass will certainly play
    roles in a future energy economy, but those energy sources cannot scale up fast
    enough to deliver cheap and reliable power at the scale of the global economy.
    While it may be theoretically possible to stabilize the climate without nuclear
