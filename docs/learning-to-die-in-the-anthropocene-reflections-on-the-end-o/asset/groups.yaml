  - '[PAGE 66]


    Iliad, these archaic people act in ways that strike us as not just primitive but
    irrational, superstitious, even insane. Yet they are us: not only historically,
    but genetically, technologically.


    A hairsbreadth of human time separates Aeschylus from the present, and in that
    moment grows everything we take for modernity. Our language, our thought, our
    architecture, and our culture carry ancient memories embedded in grammar, vocabularies,
    and syntax. Our symbolic-epistemological structures of cognition and democracy
    do not have histories, but are made of history, and are made from words such as
    “astron” and “nomas,” “ge” and “logos,” “anthropos” and “kainos.” Our thoughts
    and narratives are built from sedimented archetypes like Achilles and Cassandra,
    concepts such as fate, justice, democracy, and the very idea of an idea (*eidos*,
    meaning which is seen, form, or shape).


    Attending to the historical and philological genealogies of our current conceptual,
    symbolic structures of existence helps recognize who we are, who we have been,
    and who we might become. The comparative study of human cultures across the world
    and through time helps see that our particular way of doing things right here,
    now is a contingent adaptation to particular circumstances, yet at the same time
    an adaptation built with universal templates of meaning-making and symbolic reasoning,
    with tools and technologies we have inherited from the past. I’ve relied mainly
    on Greek examples, but the roots of our contemporary global civilization are also
    Akkadian, Sumerian, Chinese, Indian, Mesoamerican, Judaic, Egyptian, Nubian, Thule,
    Dorset, and Finno-Ugric. Wherever humans live, we make meaning. The record of
    that, the heritage of the dead, is our most valuable gift to the future.


    The study of the humanities is nothing less than the patient nurturing of the
    roots and heirloom variets of human symbolic life. This nurturing is a practice
    not strictly of curation, as many seem to think today, but of active attention,
    cultivation, making and remaking. It is not enough for the archive to be stored,
    mapped, or digitized. It must be worked. As Hannah Arendt writes:


    If it is true that all thought begins with remembrance, it is also true that no
    remembrance remains secure unless it is condensed and distilled into a framework
    of conceptual notions within which it can'
  - '[PAGE 67]


    further exercise itself. Experiences and even the stories which grow

    out of what men do and endure, of happenings and events, sink back

    to the futility inherent in the living world and the living deed

    unless they are talked about over and over again. What saves the

    affairs of mortal men from their inherent futility is nothing but this

    incessant talk about them, which in its turn remains futile unless

    certain concepts, certain guideposts for future remembrance, and

    even for sheer reference, arise out of it.¹¹²


    Against the futility of life without memory, we have only this delicate

    accretion. Papyrus rots, paper museums get sacked, hard drives

    crash. The fragility of our collective cultural enterprise is well illustrated
    by

    the epigraph heading this chapter and the long poem it comes from. The

    Epic of Gilgamesh, one of the oldest works of literature on Earth, was

    possibly first inscribed on clay tablets in the 21st or 20th century

    BCE, later for nearly 2,500 years, then recovered in the middle of the

    19th century by an Assyrian archaeologist from Mosul named Hormuz

    Rassam.¹¹³ The only reason the Epic survived was because it had been

    copied out by ancient scribes as rote training for more “important"

    bureaucratic and commercial work.


    The Epic tells the story of Gilgamesh, king of Uruk, a “bull on the

    rampage” admired for his strength but resented for his despotism.¹¹⁴ As the

    Epic recounts: “The young men of Uruk harries without warrant, /\Gilgamesh lets
    no son go free to his father. / By day and night his

    tyranny grows harsher.” The women of Uruk pray for relief, complaining of

    Gilgamesh’s insistence on taking the virginity of all the brides in his city.

    The gods hear the women’s prayer, and one of them makes a wild man to

    match Gilgamesh, a hair-covered man-beast named Enidu, the “off-spring

    of silence.” Sent into the world, Enidu runs with gazelle herds and

    sabototeurs traps him mischief and sends a

    woman from Uruk named Shamhat to tame him. She finds Enidu, seduces

    him, dresses in clothes, teaches him how to eat and drink ale, and

    tells him of the wonders of city life. When Enidu hears about Gilgamesh’s

    habit of taking other men’s brides on their wedding night, though, “his face

    pale[s] in anger” and he speeds to Uruk. Once, there Enidu challenges'
  - '[PAGE 68]


    Gilgamesash, their fight ends in a draw, with the two men kissing and becoming
    friends.


    In classic buddy-movie style, Enidu and Gilgamesash team up and journey to the
    Forest of Cedar, “the secret abode of the gods,” where they kill the ogre Humbaba
    and take his majestic trees. When they return to Uruk, the goddess of love, Ishtar,
    tries to seduce Gilgamesash. He rejects her, so she sends the monstrous Bull of
    Heaven to destroy Uruk and Gilgamesash turn the tables and slaughter the bull
    instead. That night, Enidu has a dream in which the gods declares that the heroes
    have gone too far, and that one of them will have to die. They name Enidu. He
    wakes and recounts his dream, then, after much lamenting, succumbs to a fatal
    illness.


    Gilgamesash is overcome with grief. “Afraid of death,” he wanders the Earth weeping
    for his friend, looking for passage to the Netherworld in the hopes of uncovering
    the secret of immortality. Gilgamesash finds the gate to the Netherworld and passes
    through “double-hours” of darkness, emerging in a beautiful garden where he meets
    Uta-napishti, an immortal elder who had survived the legendary Deluge. Gilgamesash
    demands the secret of immortality, and Uta-napishti tells the story of how before
    the Deluge was ordered by the gods to build a great boat to carry “the beasts
    of the field, the creatures of the wild, and members of every skill and craft.”
    One day, as the gods foretold, the rain began to fall.


    For a day the gale flattened the country, quickly they blew, and then came the
    Deluge. Like a battle the cataclysm passed over the people. . . For six days and
    [seven] nights, there blew the wind, the downpour, the gale, the Deluge, flattened
    the land.


    After the rain stopped, Uta-napishti released a dove and a sparrow, both of which
    came back, and finally a raven, which did not. Once the waters receded, the gods
    made Uta-napishti and his wife immortal. Uta-napishti tells Gilgamesash that he
    too can be immortal, if he goes six days and seven nights without sleeping.'
  - '[PAGE 69]


    Gilgamesh tries hard to stay awake, but his eyes close the very first night and
    sleeps for a week. Uta-napishti rouses him, Gilgamesh is so distraught that the
    old man feels bad for him and gives him a miraculous rejuvenating plant. On his
    way home, though, Gilgamesh loses the plant to a snake, which he steals from him
    in the night. The mighty king curses the utility of existence: "For whom Urshanabi,
    toiled my arms so hard? he wails. "For whom dry the blood of my heart?"


    We might answer: Us. For the future. Almost four thousand years out of the past,
    the Epic of Gilgamesh carries forward a story of civilization. Its first main
    narrative, the taming of the wild Enkidu, is reiterated in its final act, in the
    rampaging Gilgamesh learns to accept the truth of death. Enkidu and Gilgamesh
    represent two phases of social development, the hunter-gatherer and the agricultural.
    The absolutist demands of agricultural civilization, embodied in Gilgamesh, are
    tyrannical without the tempering of the wild, but when civilization and wilderness
    join forces, they create an all-consuming machine that disrupts the sacred order.
    The gods decree the wild man must die and the mighty king submit to human limits.


    The Epic of Gilgamesh also offers a lesson in the importance of sustaining and
    recuperating cultural heritage in the wake of catastrophic climate change. As
    the Epic’s prologue reads, Gilgamesh “say what was secret, discovered what was
    hidden, / he brought back a tale of before the Deluge.” Translator and scholar
    Andrew George explains: “The implication of the prologue is that Gilgamesh played
    a key role in restoring the antediluvian order after the Flood, particularly in
    restoring the cults of the gods to their proper glory. . . It did not suit the
    poet’s need to include more than allusions to it, but evidently Gilgamesh was
    responsible for civilizing his country.”¹⁵


    Gilgamesh lives on death as a legend, a symbol, a reflection on ourselves. In
    this way, the Epic represents not only the fragility of our cultural heritage,
    but its persistence. I saw this firsthand when I talked to the Iraqi heavy metal
    band Accacasuda about their first full-length album, which they titled Gilgamesh.¹¹⁶
    Marwan Hussein, the band’s drummer and guiding force, told me that he’d decided
    to turn to the epic as a template for their album because it connected back to
    Iraq’s ancient Sumerian roots while at the same time offering a way of understanding
    the situation there'
- md: '

    now. “The Epic of Gilgamesh is a very weird story,” Hussein told me, “and in a
    very very modern. It’s a way to tell the story of what’s happening today in the
    Middle East: Gilgamesh was a tyrant. He was not a very good king. He was weak.
    The way I see him, he was a lost soul until the very last, when he comes to terms
    with his mortality. In the end, it’s a story about rebirth.”


    Rebirth is a resonant concept for the members of Acrassicauda: they grew up in
    Saddam’s Iraq, lived through the invasion in 2003, escaped the country’s brutal
    sectarian civil war in 2005 and 2006, and, with the help of VICE magazine co-founder
    Surosh Alvi and a documentary he made about them (Heavy Metal in Baghdad), made
    their way through Syria and Turkey to the United States.¹ Fifteen years after
    they formed a band in Baghdad, teaching themselves to play Metallica and Slayer
    off bootleg cassettes, they finally released their first album—an album which
    is at once a testament to their artistic ambitions, a reflection on their unique
    historical situation, and a remembrance of their heritage. As Hussein told me,
    “We tried to make a Middle Eastern metal album. We did the whole thing. We did
    the percussion, we did the darbuka, we did the time signature, we did the singing.


    Acrassuda are doing the hard work of cultivating and remaking their interwoven
    cultural technologies. They didn’t have to. Their fate could have been completely
    different. In Iraq, in Syria, even as refugees living in New Jersey, Acrassicauda
    would have had every excuse to confuse acceptance of their situation with giving
    up, or to mistake hatred for justice. They might have stayed in Baghdad and fought
    to free their country from foreign invaders. Many did. Many chose another side,
    and fought for the Americans, or for Al Qaeda. Instead, Hussein and his bandmates
    chose music and art. They chose to explore and strengthen the connections between
    cultures, our shared rhythms and common traditions. They embody for their fans
    the realized hope of transcending parochialism and strife while staying connected
    to tradition, the courage of surviving war not by violence but through decency
    and mutual support, and the lived possibility that we may—like the troubled Gilgamesh—learn
    to die and yet be.


    More than 6,000 years before Homer sang of Achilles’ rage and more than 5,000
    years before the Epic of Gilgamesh was written, humans living in what is now China,
    Serbia, and Iraq began to make marks on bone and clay. Agricultural and astronomical
    knowledge, relatively stable, had been stored in memorized rhythmic speech, but
    over time the novel technology of writing allowed us to keep track of more changeable
    data: property, grain stores, trade. The practice of writing integrated older
    social technologies developed for other purposes, and as writing grew in sophistication
    and importance it observed yet. Ritual song, image-making, mythology, religion,
    rhymed speech, memorization association, metaphorical abstraction—technologies
    of social attunement, information storage, ideological mapping, emotional regulation,
    and political organization—were all within a few thousand years intimately wired
    into graphic representations of language.


    First through clay and stone, then papyrus, vellum, and paper, writing became
    the most important human development after agriculture and before the steam engine,
    leading to widespread social transformations and enabling the creation of incredible
    new technologies. From writing, the ancient Sumerians in Uruk developed mathematics,
    allowing them to abstract yet accurately physical relations in the world. Written
    laws gave concrete form to political and religious authority. Being able to track
    and compare information allowed observers to adjudicate evidence, which gave rise
    over centuries to empiricism and the scientific method. The development of the
    press in 1450 and the later proliferation of affordable books (by means of hand
    presses in the 18th century, then steam and coal-powered industrial presses in
    the 19th and 20th centuries) meant that vast amounts of stored information could
    be accessed by anyone able to read. The full expression of human life soon come
    to be seen as synonymous with literacy itself. With the advent of mass-produced
    sound and image reproduction technologies in the 19th and early 20th centuries
    (phonograph, radio, film, TV), humanism-as-literacy was superseded, it has been
    re-integrated and transformed into humanism-as-digital-literacy, or what we might
    call photohumanism.


    A new form of life has become evident: humanity has revealed itself as collective
    energy, light swarming across a darkened planet, a geological forcing, data and
    flow. We live in networks, webs and hives, jacked in to remote-controlled devices
    and autonomous apps, moments of being in time, out of time. No longer individual
    subjects or discrete objects, we have become, channelers, tweeters and followers.
    By connecting us through our devices, photomanist technologies enable collective
    wiring at tremendous speeds, faster than those offered by radio, print, television,
    and film.


    Just as older technologies offered both great potential and great danger, so too
    do the newer technologies of phothumanism. Homo sapiens—perhaps remains biologically
    reactive, easily panicked, all too quickly stirred to hatred. Jaron Lanier warned
    in 2006 of what he called "digital Maoism": "It is at least possible that in the
    fairly near future enough communication and education will take place through
    anonymous Internet aggregation that we could become vulnerable to a sudden dangerous
    empowering of the hive mind. History has shown us and again that a hive mind is
    a cruel idiot when it runs on autopilot."118 The dangers of collective madness,
    with hunts, and totalitarian war exist in new social networks as much or more
    than they did in early 20th-century radio broadcasts, newspaper stories, and cinema
    reels. Our collective obligation to maintain traditional humanistic study in the
    photumanist era is at once developmental and prophylactic: we must practice interruption
    to nurture new flows and the same time to guard against them.


    As we struggle, awash in social vibrations of fear and aggression, to face the
    catastrophic self-destruction of global civilization, the only way to keep our
    long tradition of humanistic inquiry is to learn to die. We must practice suspending
    stress-semantic chains and our attachment to the continual press of the present
    by keeping alive the past, cultivating the into-garden of the archive, reading,
    interpreting, sorting, nurturing, and most important, reworking our stock of remembrance.
    We must keep renovating and innovating perceptual, affective, and conceptual fields
    through recombination, remixing, translation, transformation, and play. We must
    inculcate ruminative frequencies in the human animal by teaching slowness, attention
    to detail, argumentative rigor, careful reading, and meditative reflection. We
    must keep up our communion with the dead, for they are us, as we are the dead
    of future generations.


    Wars begin and end. Empires rise and fall. Buildings collapse, books burn, servers
    break down, cities sink into the sea. Humanity can survive the demise of fossil-fuel
    civilization and it can survive whatever despotism or barbarism will arise in
    its ruins. We may even be able to survive in a greenhouse world. Perhaps our descendants
    will build new cities on the shores of the Arctic Sea, where the rest of the Earth
    is scorching deserts and steaming jungles. If being human is to mean anything
    at all in the Anthropocene, if we are going to refuse to let ourselves sink into
    the futility of life without memory, then we must not lose our few thousand years
    of hard-won knowledge, accumulated at great cost and against great odds. We must
    not abandon the memory of the dead.

