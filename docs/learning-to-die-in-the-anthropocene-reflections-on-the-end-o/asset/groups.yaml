    # 尾声 (CODA)


    # 归家


    > 当最后一抹光芒变得暗淡

    > 当聚光灯开始消逝

    > 如果没有明天

    > 你最好活下去


    —Sleater-Kinney，“消逝”（Fade）


    正如我们所理解的，宇宙始于一次光之爆发，我们所知的一切都是通过恒星的剧烈爆炸而产生的。随着旋转的岩石吸积物开始环绕单个太阳运行，星系缓慢形成。我们的地球大约在45
    亿年前由气体和尘埃形成，在那之后的约十亿年，在地球炎热、动荡的海洋深处，生命开始了.¹¹⁹ 微生物繁荣、多样化并演化，但在十亿年内，它们面临了一场几乎杀灭了星球的气候变迁：大量繁殖的光合作用蓝细菌将氧气充满了大气，而氧气对地球上占统治的厌氧生命形式是有毒的，并几乎将它们消灭。氧气还与还原态甲烷发生反应，使地球进入了长达三亿年的冰期。大氧化事件事件剧烈地改变了地球的生物圈。它也为更复杂的植物动物生命的演化提供了可能。


    在过去的二十亿里，复杂的单细胞以及后的多细胞生命在人口爆发和物种灭绝的动态循环中发展。每一个遗传系、每一个物种，甚至整个生态系统都会随着环境和气候条件的改变而出现、演化和消失。几亿年后，随着我们的太阳成熟并变得更加明亮，它将把地球加热到超级温室状态，毁灭所有的陆地生命。最终，我们的太阳将膨胀成一颗红巨星，然后坍缩。在更宏大的尺度上，宇宙可能会由于熵增而扩张为由缓慢消散黑洞组成的黑暗冰冷空虚，或者自我坍缩并再次爆炸，陷入无尽的大挤压与大爆炸循环。


