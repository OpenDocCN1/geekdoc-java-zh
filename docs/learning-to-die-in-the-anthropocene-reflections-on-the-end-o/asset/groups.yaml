    We experience this world of strife today in one of two modes: either it is our
    environment, and we are in it, or it comes to us as images, social excitation,
    retransmitted fear. People are fighting and dying in ruined cities all over the
    planet. Neighbors are killing each other. Old women are bleeding to death in bombed
    rubble and children are being murdered, probably as you read this sentence. To
    live in that world is horrific. Constant danger strains every nerve. The only
    things that matter are survival, killing the enemy, and having a safe place to
    sleep. The experience of being human narrows to a cutting edge.


    I remember living that world many years ago in occupied Baghdad. Today that world
    seems impossibly distant, yet every day it presses on me in a never-ending stream
    of words, images, appeals, and reports. I see videos. I read stories. I see pictures
    of this or that suffering or injustice and I am moved. To act, perhaps, but more
    accurately to emote. To react. To feel to perform. We do not usually ask where
    these feelings come from or who they serve, but we all know that the technologies
    transmitting these affective vibrations are not neutral: news outlets shape information
    to fit their owners'' prejudices, while Facebook, Twitter, and Google shape our
    perceptions through hidden algorithms. The specialization and demographic targeting
    of contemporary media tend to narrow the channels of perception to the point that
    we receive only those images and vibrations which already harmonize with our own
    prejudices, our own pre-existing desires, intensifying our particular emotional
    reactions along an increasingly limited band, impelling us to discharge our emotions
    within the same field of ready listeners, for which we are rewarded with “Likes”
    and “Favorites.” Our consciousness is shaped through feedback systems where some
    post or headline provokes a feeling and we discharge that feeling by provoking
    it in others. Social media crowdsource catharsis, creating self-contained pools
    of aggression and fear, terror, stagnant flows that go nowhere and nothing.


    Pictures of children killed by bombs or police, or pictures of the devastation
    left in the wake of a tropical storm may move me to sadness and horror. Retransmitting
    such images will pass along that sadness and horror. My act of transmission will
    mark me as someone who has feelings about these things and who condemns them.
