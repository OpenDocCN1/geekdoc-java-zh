    我以前曾在纽约参加过游行，为了反对伊拉克战争、纪念退伍军人日、同性恋骄傲、万圣节以及西印度人日，而这次游行与那些一样，是一场精心管理的活动。事实上，“人民气候游行”是一个后勤保障上的巨兽，涉及超过
    1500 多个组织，每个组织都有自己的利益和关切。为了保持这些组织的团结，游行的领导小组 Avaaz 和 350.org 决定统一信息、汇合诉求，或设定一个明确的目标：游行的核心信息将是游行本身。


    然而，这场游行本应传达的信息从未明确。其意图是提高意识，我们有权质问，一场游行究竟能做哪些是海量的科学数据、数十年的研究、全球各大主流媒体几乎每天报道的文章，以及
    1995 年在柏林首次举行的联合国气候变化会议无法做到的呢？如果《联合国气候变化公约》的计划是说服保守和主流美国人关注气候变化，那么很难想象一群环保主义者穿过一个大多数美国人认为是富裕自由派堡垒的城市，如何能实现这一目标。如果意图是展示伞型组织在选民方面能激发的政治力量，我们有权质问是哪些选民、他们来自哪里、通常投给谁，以及有多少人。这些信息均未被收集，因此人们不禁疑惑，这场游行究竟想要对美国政治进程（或者说对任何政治进程）施加何种压力。游行受到警察路障的严格限制，被引导通过远离其本应影响的联合国所在地的街道，最后被驱散在曼哈顿中城哈德逊河边的空旷街区。由于没有没有游行者的结束集会，游行以一种无意义的哀鸣结束，成千上万个原子化的个体回到了自己的地铁、汽车，以及他们与数字连接但在政治上脱节的生活。


    事实上，“人民气候游行”只不过是一场民主情感的宣泄，是一个以行动主义为主题的、类似于推特标签活动的现实世界对应品：它让你感觉良好，说你属于某个群体，但与实际的立法和治理完全脱节<sup><sup>73</sup></sup></sup>。考虑到游行巨大的内在缺陷，我们最好的希望或许是它一无所获。然而，更有可能的情况是，它消耗了本可以在别处发挥作用的组织能量，公开展示了气候行动主义的政治无能，并用一种虚假的希望安慰了数十万人。


    在游行两天后的气候峰会期间，与会者甚至没有得到那种虚假的灵丹药，那里唯一的疗法是官僚主义的麻醉剂。我赶到大会厅的上层阳台，正好赶上了列奥纳多·迪卡普里那悦耳的开场白的最后几分钟，并和其他记者、观察者一起坐在高处的座席上度了一整天，看着政客们在下方举行那场乏味的表演。虽然一系列开发和融资方案被当作解决方案提出，仿佛峰会变成了一场冷酷的僵局仪式，仿佛是萨缪尔·贝克特《终局》的商业版。


    接一个，他们站在台上重复着空洞的话，大胆地承诺那些做得太少、为时已晚的全面自愿减排。俄罗斯、澳大利亚、德国、印度和中国的首脑甚至没懒得出席。巴拉克·奥巴马发表了激昂的演说，呼吁每个人都要共同努力，在赞美美国微不足道的排放减量的同时进行指责，忽视了美国煤炭和美国消费在推动中国增长方面所起的作用。坦桑尼亚总统贾贾亚·基基韦特抱怨非洲国家对问题的贡献是多么地小，而他们将遭受多少痛苦，深情地谈到了乞力马扎罗山消失的冰川。纳鲁鲁总统、小岛国联盟主席瓦卡（Baron
    Waqa）激昂地论证，需要更多投资来帮助像他的国家这样面临生存威胁的国家进行适应。中国副总理张高利在联合国发表了辞严厉且具有防御性的演讲，承诺中国将“尽快”实现碳排放达峰，并在时间合适时减少人均排放（这一立场仅在随后的美中气候协议中得到了缓解）。


    在周日的抗议游行和周二的联合国峰会之间，我周一整天在曼哈顿上下奔波，在两个似乎能带来具体结果的活动之间穿梭：在岛屿狭窄的南端，数百名核心活动主义者用身体筑挡以“占领华尔街”；而在中城的哈佛俱乐部，一群政府官员、企业代表、银行家和经济学家聚在一起，在国际排放贸易协会制定全球定价机制。


    在“占领华尔街”活动中，随着行进、舞蹈以及娜奥米·克莱因、克里斯·赫奇斯、马马杜·戈塔、伊莉莎·埃斯特罗尼等人的演讲，信息、使命和敌人被清晰地确定。游行者走向华尔街，对他们认为气候变化的真正问题——资本主义进行非暴力直接行动。标语上写着常见的：邪恶的科赫兄弟、埃克森美孚和壳牌。由无政府主义者、环保主义者和占领华街的退伍军人组成的游行队伍在阿尔图·莫迪卡设计的“公牛”周围堵塞了几个小时，然后前往布罗华和华尔街的交汇处。纽约警察局在整个过程中保持着控制，从头到尾用松散的警戒围着游行者。直升机在低空轰嗡，一名衣着自然的社区联系员密切观察着局面。⁴华尔街本身被路障和骑警封锁。游行者没有机会通过。唯一的唯一希望就是重蹈覆辙。

