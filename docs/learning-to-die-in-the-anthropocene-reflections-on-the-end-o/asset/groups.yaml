  mdcn: '

    在《伊利亚特》中，这些古老人的行为在我们看来不仅原始，而且不理性、迷信，甚至是疯狂。然而，他们就是我们：不仅在历史上，在基因和技术上也是如此。


    埃斯基琉斯与现在之间仅隔着人生的瞬间，而在那一瞬间，孕育了我们所认为的现代的一切。我们的语言、思想、建筑和文化都承载着嵌入在语法、词汇和句法中的古老记忆。我们认知和民主的符号-认识论结构并没有历史，而是由历史构成的，由如“astron”和“nomas”、“ge”和“logos”、“anthropos”和“kainos”等词汇构建的。我们的思想和叙事建立在阿基琉斯和卡珊德拉等沉淀的原型之上，建立在命运、正义、民主以及“理念”概念本身（*eidos*，意为所见之、形式或形状）等概念之上。


    关注我们当前存在的概念、符号结构的历史和语言学谱系，有助于识别我们是谁、我们曾经是谁，以及我们可能成为谁。对跨越全球和时代的人类文化进行比较研究，有助于我们看到，我们此时此地行事的特定方式是对特定环境的偶然适应，但同时，这也是一种用通用的意义创造和符号推理模板所构建的适应，利用了我们从过去继承的工具和技术。我主要依赖希腊案例，但我们当代全球文明的根源还包括阿卡德、苏美尔、中国、印度、中美洲、犹太、埃及、努比亚、图图勒、多尔塞和芬兰-乌格尔。无论人类生活在何处，我们都在创造意义。这一记录，逝者的遗产，是我们留给未来最宝贵的礼物。


    人文科学的研究无异于对人类符号生命的根源和传种品种的耐心培育。这种培育并非今天许多人所认为的那种严格的策展，而是一种积极的关注、培养、创造与重塑。仅仅让档案被存储、映射或数字化是不够的。它必须被不断运作。正如汉娜·阿伦特写道：


    如果所有的思考都始于记忆是事实，那么如果记忆不被浓缩和提炼成一个概念框架，使其在其中进一步发挥作用，那么也没有任何记忆是安全的。人们所为、所经而生长出的经历甚至是故事，以及种种发生和事件，如果不被反复谈论，就会退回活生世界和活生行为所固有的徒劳之中。拯救凡人事务免受其内在徒劳的，唯有对它们持续不断的谈论，而这种谈论除非从中产生某些概念、某些引导未来记忆的指南针，甚至是纯粹的参考，否则其本身也将是徒劳的。¹¹²


    面对没有记忆的生活的虚无，我们只有这种脆弱的积聚。纸莎草会腐烂，纸博物馆会被洗劫，硬盘会崩溃。我们集体文化事业的脆弱性，在本章标题的题铭以及它所自属的长诗中得到了很好的说明。《吉尔伽美什史诗》作为地球上最古老的文学作品之一，最早是在公元21世纪或20世纪被刻在粘泥板上的，随后在近2500年里，直到19世纪中叶被一位来自摩苏的亚索米亚考古学家霍尔穆兹·拉萨姆（Hormuz
    Rassam）重新发现¹¹³。《吉尔伽美什史诗》之所以能存下来的唯一原因是，它曾被古代书吏抄写，作为对其他更“重要”的行政和商业工作的机械化训练。


    史诗讲述了乌鲁克王吉尔伽美什的故事，他是一个“暴怒的牛”，因力量而受人仰仰，因暴政而招人怨恨¹¹⁴。正如史诗所叙：“乌鲁克的年轻人无故地骚扰百姓，/ 吉尔伽美什不让任何儿子自由回到父亲身边。/
    日日夜夜，他的暴政愈发严酷。”乌鲁克的妇女们祈求解脱，抱怨吉尔伽美什坚持夺取城中所有新娘的贞洁。神灵听到了妇女们的祈祷，其中一位神创造了一个与吉尔伽美什相匹的野人，一个长满毛发的人兽，恩基杜（Enidu），被称为“沉默的后裔”。恩基杜被投入世间，他与羚群奔跑，破坏者用陷阱恶作剧，并派了一位来自乌鲁克的名叫夏哈特（Shamhat）的女性来驯化他。她找到了恩基杜，诱惑他，给他穿上衣服，教他如何吃喝啤酒，并告诉他城市生活的奇妙。然而，当恩基杜听到吉尔伽美什在婚之夜掠夺他人新娘的习惯时，“他的脸因愤怒而苍白”，飞奔回到乌鲁克。在那里，恩基杜挑战了吉尔伽美什，他们的战斗以平局结束，两人拥吻并成为朋友。


    以经典的搭档电影风格，恩基杜和吉尔伽美什结队前往雪松森林，“神的秘密居所”，他们在那里杀死了巨魔昆姆巴，并夺了他雄伟的树木。当他们回到乌鲁克时，爱之女神伊什塔尔（Ishtar）试图诱惑吉尔伽美什。他拒绝了她，于是她派出巨大的的天牛摧毁乌鲁克，吉尔伽美什却反为主胜，杀掉了那头牛。那天晚上，恩基杜做了一个梦，梦中神灵宣布英雄们做得太过分，其中一人必须死。他们指名是恩基杜。他醒来讲述了自己的梦，随后在许多哀悼之后，死于一种致命疾病。


    吉尔伽美什被悲痛所淹没。“害怕死亡，”他在地球上寻找他的朋友。乌特纳皮什提（Utnapishti）告诉吉尔伽美什，如果他走六天六夜，他也可以永生。但吉尔伽美什试图保持清醒，他的眼睛在那个晚上闭上了。乌特纳皮什提叫醒了他，吉尔伽美什如此忧心以至于睡了一周。乌特纳皮什提给了他一株回春草。但在回家的路上，吉尔伽美什的草被蛇偷走了。这位强大的国王对存在的意义感到诅咒：“为了谁，乌沙纳比（Urshanabi）如此辛苦劳作？”他哀道，“为了谁，我的心血干涸了？”


    我们可能会回答：为了我们。为了未来。尽管是四千年前历史，《吉尔伽美什史诗》延续了一个文明的故事。它的第一个主叙事——驯化野人恩基杜，在结尾得到了重申，即暴怒的吉尔伽美什学会了接受死亡。恩基杜和吉尔伽美什代表了社会发展的两个阶段：狩猎采集和农业。吉尔伽美什身上体现的农业文明的绝对主义要求，如果没有野性的调和是暴政的；但当文明与荒野汇合时，它们创造了一个破坏神圣秩序的吞噬机器。神灵规定野人必须死，强大的国王必须屈从人类的极限。


    《吉尔伽美什史诗》也为在灾难性气候变化之后维持和恢复文化遗产提供了教训。正如史诗序言所示，吉尔伽美什“揭示了秘密，发现了隐藏，/他带回了洪水之前的故事。”翻译家兼学者安德鲁·乔治（Andrew
    George）解释道：“序言的含义是，吉尔伽美什在洪水后恢复洪水前的秩序中发挥了关键作用，特别是恢复了神灵崇拜应有的光。……对于诗人来说，仅仅包含这些引用是不够的，但显然吉尔伽美什负责了他国家的文明。”¹⁵

