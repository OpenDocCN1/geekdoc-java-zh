    Many critics question whether renewable energy will ever be a feasible alternative
    to carbon fuels, pointing out that its cost-to-energy ratios are simply too high.
    Even James Hansen, one of the most outspoken scientists on the urgent need to
    address global warming, remains skeptical: “Most energy experts agree that, for
    the foreseeable future, renewable energies will not be a sufficient source of
    electric power. There is also widespread agreement that there are now just two
    options for nearly carbon-free large-scale base electric power: coal with carbon
    capture and storage, and nuclear power.”55


    As Hansen wrote with three other scientists in a controversial open letter in
    2013, “Renewables like wind and solar and biomass will certainly play roles in
    a future energy economy, but those energy sources cannot scale up fast enough
    to deliver cheap and reliable power at the scale of the global economy. While
    it may be theoretically possible to stabilize the climate without nuclear power,
    in the real world there is no credible path to climate stabilization that does
    not include a substantial role for nuclear power.”56 Nuclear fission, however,
    presents significant and perhaps insurmountable waste issues, and in order to
    reduce carbon emissions to keep CO₂ below 450 ppm, the world would have to build
    more than 12,000 nuclear power plants in the next 35 years, “about the same as
    one new plant coming every day between now and 2050.”57 That seems unlikely, especially
    since disasters such as Three Mile Island, Chernobyl, and Fukushima forbidding
    reminders of the risks nuclear power poses.


    And then there''s the question of how the nations of the world would even go about
    implementing global decarbonization if they all agreed to do it. National taxes
    strict enough to actually decrease carbon use have been implemented in a few countries,
    but even so, global emissions have continued to rise, and we have to solve the
    problem of enforcement: Who is going to make the United States, China, Russia,
    and India pay more for their coal and oil? Would there necessarily be some kind
    of international agreement on the price of carbon, which seems unlikely, given
    that scientists and economists in the United States and the United Kingdom—both
    wealthy nations with shared economic interests and a long history of CO₂ emissions—disagree
    substantially, estimating the costs of carbon'
- md: '

    variously “from a few to several hundred dollars per tonne.”^58 As economist Michael
    Grubb describes the problem:


    The holy grail of an economic cost-benefit calculation applied to climate change
    is to establish the “social cost of CO2 emissions”—the damage inflicted by emitting
    each tonne. As shown, the calculation turns out to be just as uncertain as everything
    else—in fact more so. It does not provide an objective answer in a world of conflicting
    views, but unavoidably reflects the assumptions and values that people bring to
    tale. Climate policy will contend with “incommensurable benefits estimates.” Even
    the world’s top economists have accepted that they cannot reach an agreement on
    how to tackle the problem, even on the single component of how to weight impacts
    over time, let alone other dimensions.^59


    Populations and countries in economic competition, with wildly unequal investments
    in fossil fuel reserves and facing unequal impacts from the changing global climate,
    are highly unlikely to come to an agreement on how much a tone of CO2 should cost,
    thus making it improbable that strict, universal regulatory taxes on carbon will
    ever be established. If this seems unduly pessimistic, consider that neither the
    US, Russia, nor China—together responsible for around 48 percent of the world’s
    carbon dioxide emissions—have a national carbon tax, and that of those nations
    are fossil fuel exporters who depend on the growing energy markets of the third.
    Furthermore, carbon taxes have faced intense opposition not only from fossil fuel
    producers, but also from voters: most notably, Australia became famous in 2014
    as the first country in the world to repeal a national carbon tax.


    Instead of such taxes, many people advocate decarbonization through a global “cap-and-trade”
    mechanism similar to the one that helped solve the problem of acid rain.^60 In
    a cap-and-trade scheme, emissions limits are established and gradually tightened,
    while emitters are allowed to trade emissions credits among themselves to minimize
    the costs of compliance. But Thomas Schelling, a Nobel-winning economist and strategic
    systems theorist, makes a strong case that carbon trading simply will not work.


    While “believes in the essentiality of incentives, in clearly defined obligations,
    and in the virtues of trading,” Schelling “cannot imagine such a regime for carbon
    emissions.”⁶¹ His main reasons are straightforward. First, “any serious regime
    would have to allocate emission rights over many decades, not just a decade at
    a time but cumulatively,” and there is no way of reaching agreement on what emissions
    limits should be over the next hundred years or on deciding the costs of exceeding
    them. Second,“it would be almost impossible to determine, during the first half-century
    or so, whether a nation on target to meet its ultimate cumulative limit.” Third,
    enforcement would require an independent body able to punish poor and rich countries
    alike, and it is hard to see how such an enforcement body would function or from
    where it would derive its authority. As Schelling notes, “there is no historical
    example of any international regime that could impose penalties on a scale commensurate
    with the magnitude of global warming.. Nothing like this has ever existed and
    it is even hard to conceive.”⁶² Consider the fact that human trafficking, genocide,
    torture, or the use of chemical weapons, and wars of aggression have all been
    banned by international agreements, yet such crimes keep happening and are often
    committed by the leading signatories of very treaties that ban them. It seems
    irresponsible to expect things to be different when it comes to dumping carbon.


    Since we''re not likely to regulate our carbon dioxide emissions away, maybe we
    should bury them. Carbon capture and sequestration (CCS) has been proposed as
    a technological solution that would do just that. With CCS, you put pipes on top
    of smokestacks to collect CO₂, then bury it anywhere. The trouble is that CCS
    is a new and expensive technology that stands little chance of being developed
    on a global scale quickly to make a real difference. According to the International
    Energy Agency, robust enough CCS development to keep global warming below 7.2
    degrees Fahrenheit would take global investment of at 5 to 6 billion dollars a
    year. As of 2013, cumulative global investment in CCS technologies has only been
    averaging at 2 billion dollars a year.³³ The IEA''s 2009 roadmap called for 100
    CCS projects to be developed by 2020, but as of 2013, only four had been completed,
    with nine more under construction. The four functioning projects had cumulatively
    stored about 50 million tons of carbon, while dumped 200 times that amount of
    CO₂ into the atmosphere in 2012 alone.⁶As As more recent IEA reports have shown,
    progress on carbon capture and sequestration does not inspire confidence. The
    IEA explains: “Because markets do not value the public benefits of CCS demonstration
    and the benefits cannot be captured in full by early adopters, there is currently
    little commercial incentive for private entities to invest in CCS."⁶⁵ Absent commercial
    incentives and regulation, there''s no reason for anyone to expect that carbon
    capture and sequestration will be developed or implemented on a meaningful scale,
    and as long as coal and oil companies remain politically powerful, there''s no
    reason to expect robust government action in time for CCS to be a viable response
    to global warming.


    Pulling carbon dioxide out of the air has also been proposed as a technological
    fix to address emissions, though it would be tremendously expensive and, like
    capture and sequestration, so far remained underdeveloped. As Roger Pielke Jr.
    points out, “Presently, there are no experimental data on the complete process
    of carbon capture, especially at scale, to demonstrate the concept, its energy
    use, and the engineering costs."⁶⁶ We should be researching and developing such
    technologies, of course, while recognizing that they are far from quick, easy
    solutions and may not ever be viable. The time for a speculative, miraculous,
    last-minute long-shot techno-fix is well over. We are living right now in the
    midst of a global climate emergency and social crisis that demands immediate response.


    Some people believe we can hold off the storm by artificially cooling the planet
    with sulfur. We must prepare for the coming storm—not in thirty or forty years,
    but today. Solar Radiation Management is the term for this crude process: we lay
    a blanket of sulfur in the stratosphere to increase the Earth’s reflectivity,
    or albedo, thus shining back more of the Sun’s light into space and thereby cooling
    the planet. While cheap enough that a small country or large corporation could
    make it happen, this plan has serious flaws. Stratospheric aerosol cooling is
    dangerous because of the toxicity of sulfur, because it could degrade the ozone
    layer, and because the resulting increased albedo would make us more vulnerable
    to fallout from volcanic eruptions. If the atmosphere were already thick with
    sulfur, additional aerosols from an eruption like Pinatubo or Eyjafallajök could
    force sudden massive cooling like that happened when Tambora exploded in 1816,
    the so-called “Year Without Summer.” Such an event would be catastrophic for agricultural
    yields and likely cause widespread famine. We also don''t know how deliberate
    dumping of sulfur into the atmosphere would impact climatic changes already happening
    because of warming: clouds darkened with sulfur may absorb more heat, and sulfur
    drifting down onto ice and snow may worsen “dark snow” effect that is melting
    glaciers in Greenland and elsewhere. Finally, and most seriously, sulfur aerosol
    cooling simply doesn''t work over the long term. Reflecting light back into space
    deals with the symptom (warming) without addressing the cause (greenhouse gases).
    Sulfur aerosols are heavy and tend to settle back, a situation that sets up for
    sudden runaway heating if we should ever stop pumping them up—if there were another
    world war, for instance.⁶⁸


    Global warming is what is called a “wicked problem”; it offers no clear solutions,
    only better and worse responses. One of the most difficult aspects to deal with
    is that it is a collective-action problem of the highest order. One city, one
    country, even one continent cannot solve it alone. Any politician who honestly
    and frankly worked to detach her nation''s economy from oil and coal would not
    survive in any kind of democratic or oligarchic government, because the rigorous
    austerity necessary for such an effort would mean either economic depression and
    poverty for most of her constituency, a massive redistribution of wealth, or both.
    Moreover, any leader who forced her country to accept the austerity and redistribution
    to end its dependence on cheap coal would also be forcing her country into a weak
    and isolated position politically, economically, and militarily. The entire world
    has to work together to solve global warming, yet carbon powers the world’s political
    machinery and shapes our current form of collective life. It’s coal and oil that
    we have to thank for connecting the many nations of the world into one tight,
    integrated economy. Without the information, energy, and transportation

