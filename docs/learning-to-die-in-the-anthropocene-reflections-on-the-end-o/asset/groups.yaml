    Some like to say “violence never solved anything,” but this is a comforting lie,
    and it’s comforting to precisely the wrong people. The real reason that non-violence
    could be a virtue in the powerless is that the powerful do not want to see their
    lives or property threatened. As a matter of fact, violence has solved many conflicts.
    Violence enforced fascism and Nazism in World War II. Violence enforced the end
