    For most of human history, violence has been a central element of social conflict.
    The first clear evidence of mass human violence is as old as civilization; the
    first evidence of its end has yet to be seen.84 According to bioarchaeologist
    Philip Walker, “As far as we know, there are no forms of social organization,
    modes of production, or environmental settings that remain free from interpersonal
    violence for long.85 As Freud wrote in his famous debate with Einstein on the
