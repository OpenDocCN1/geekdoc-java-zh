    \ began with a marching band, dancing, and speeches from Naomi Klein, Chris Hedges,\
    \ Mamadou Goita, Elisa Estronioli, and others, the message, mission, and enemy\
    \ were clearly identified. The protesters were marching to Wall Street in a nonviolent\
    \ direct action against what they saw as the real problem behind climate change:\
    \ capitalism. Signs named the usual: the villainous Koch brothers, ExxonMobil,\
    \ and Shell. The protest’s parade of anarchists, environmentalists, and Occupy\
    \ veterans blocked traffic around Arturo di Modica’s “Charging Bull” for a few\
    \ hours, then made their way to the intersection of Broadway and Wall Street.\
    \ The New York City Police Department maintained over control of the situation\
    \ the entire time, surrounding the marchers with a loose cordon from beginning\
    \ to end. Helicopters buzzed low overhead, a naturally dressed community liaison\
    \ observed the situation close.⁴ Wall Street itself had been blocked by barriers\
    \ and horse-mounted police. The marchers had no chance of getting through. The\
