    # THREE


    # CARBON POLITICS


    From low to high doth dissolution climb,

    And sink from high to low, along a scale

    Of awful notes, whose concord shall fail.


    > —William Wordsworth, “Mutability”


    When a honeybee colony needs to find a new home, it sends out wave of scouts to
    search for a new hive site.⁶ When the scouts return, they dance for the other
    bees. Each scout''s dance communicates a possible location for the colony''s future.
    As new waves of scouts go out and return, they align themselves with one dance
    or another, depending on what they''ve found. Soon, in a vast rollicking caucus,
    masses of bees are all dancing to a variety of distinct rhythms, each dance offering
    a different vision of tomorrow. One dance may be for a nearby oak, another for
    a distant elm; one dance offers an ambitious journey, another is more conservative.
    Over time, a single dance grows more and more popular, until a majority of the
    bees are doing it. The swarm has made its decision and takes flight.


    Politics, whether for bees or for humans, the energetic distribution of bodies
    in systems. This is where the ideas of the vote, the town hall meeting, and the
    public debate get their power: humans come together to resonate on one frequency
    or another. Arrangements of bodies in systems don''t arise from ideal notions
    of how governance should work, but rather emerge out of the vibrating bodies themselves,
    the systems they inhabit, and the interactions between the two.


    The key is energy: energy production and social energetics. Just as a beehive
    is structured around the production of honey, so are human societies structured
    around labor, horses, wheat, coal, and oil. How bodies harvest, produce, organize,
    and distribute energy determines how power flows, shaping the political arrangements
    of a given collective organism behind whatever ideologies the ruling classes may
    use to manufacture consent, obscure the mechanisms of control, or convince themselves
    of their infallible omniscience.


    Humanity has three major revolutions in the political structures of energy production
    in the past 200,000 years: the Agricultural Revolution, the Industrial Revolution,
    and the Great Acceleration (the transition from coal to mixed fossil fuels). The
    Agricultural Revolution shifted human social organization from the pack to the
    herd, from nomadic to sedentary life, inaugurating politics as we understand it
    (meaning the life of the polis, the city, urban existence, “civilization”). With
    the advent of the farm and the city, humans no longer followed migrating stocks,
    tracking the sweeping herds of ungulates that were once a primary source of food,
    but cultivated stocks in fields: sheep, wheat, eikorn, dates. The distribution
    of bodies in fields, pastures, canals, and cities gave rise to new forms of social
    energetics that superseded tribes and confederations. In Ancient Uruk, despotism
    and empire emerged as political technologies to deal the intricate demands of
    flood-based irrigation: single farmers or clans couldn’t manage the intensive
    mass labor required to dredge canals and harvest grain at critical moments in
    the growing season, so centralized, absolutist systems and ideologies were invented
    to control production. Elsewhere, as agricultural technologies spread to fertile
    areas less dependent on annual floods and complex irrigation, less centralized
    political technologies were developed (such as feudalism).


    Around 12,000 years after the invention of agriculture, the Industrial Revolution
    shifted human social organization from photosynthetic to fossilized carbon stocks.
    This freed us from our dependence on plant and animal energy and opened up incredible
    new flows of power, while the organization of bodies around coal pits, railroads,
    and teeming concumbations in the 19th and early 20th centuries gave rise to mass
    social democracy, state nationalism, and industrial capitalism. As Timothy Mitchell
    argues in his book Carbon Democracy, the ability of tenacious, highly organized
    coal miners to interrupt energy flows gave them significant leverage in what had
    previously been feudal and absolutist systems.⁷⁰ Rulers were forced to listen
    to workers, because coal miners at the forefront of the labor movement could interrupt
    the operations of an entire country. Through labor unions, general strikes, and
    sabotage, sustained by the ability of coal miners, railroad workers, teamsters,
    and longshoremen to paralyze national economies, “working people in the industrialized
    West acquired a power that would have seemed impossible before the late 19th century.”
    Mitchell writes:


    “Workers were gradually connected together not so much by the ties of a class
    culture, collective ideology, or political organization, but by the increasing
    and highly concentrated quantities of carbon energy they mined, loaded, carried,
    stoked, and put to work. The coordinated acts of interrupting, slowing down, or
    diverting their movement created a decisive political machinery, a new form of
    collective capability built out of coalmines, railways, power stations, and their
    operators.¹⁷¹”


    That collective capability waned with the Great Acceleration in the middle of
    the 20th century, as industrial societies shifted from reliance on coal to the
    mixed use of coal, oil, and natural gas. Unlike a coal-based economy, which relies
    on raw labor in numbers, oil and gas production requires relatively fewer workers.
    Labor retained vestigial power for decades, but the realignment of energy flows
    from solid coal to liquid petroleum and natural gas severely weakened the effective
    political power coal miners and their allies could leverage, substantially undermining
    mass social democracy as a technology of power.


    Liquid carbon stocks come to us through decentralized networks managed by small
    crews and owned by a handful of. Coal must be physically dug out of the ground
    and transported by fixed rail lines to distribution centers, but oil and gas are
    mechanically pumped from remote wells to ports, where the liquids can be sent
    anywhere. As Mitchell explains,“whereas the movement of coal tended to follow
    dendritic networks, with branches at each end but a single channel, oil flowed
    along networks that had the properties of a grid, like an electricity network,
    where there is more than one path and the flow can switch to avoid blockages.”⁷²
    Populist movements that used to be able to organize around the centralized flows
    of coal are all but powerless when it comes to interrupting the much more flexible
    flows of oil and gas (isolated high-profile cases like the Keystone XL pipeline).


    Growing from and resonating with the flows of material power that sustain them,
    our political arrangements today are collective organisms of consuming bodies
    in decentralized systems managed by technicians for the few. At the top, there
    is an oligarchy of owners who control the lion''s share of energy production.
    They rule through a technocratic administrative class of operators and politicians,
    and run mass media elections to jockey for control amongst themselves and manufacture
    ritual consent. Most people participate if at all as consumers, watching the election
    games and voting for one of the officially sanctioned candidates. The few activists
    who try to effect reform are hobbled by systemic constraints. Protest politics
    and web-based outrage may send signals to the ruling elites, but these strategies
    exert no effective pressure.


    Take the People’s Climate March. On a mild, overcast morning in September 2014,
    more than three hundred thousand people gathered along the west side of Central
    Park in New York City for what was called the “largest march in history.” The
    march was being held in advance of a United Nations Climate Summit organized by
    Secretary General Ban Ki-moon, where more than a hundred heads of state planned
    to make public commitments to investing in renewable energy, supporting green
    development in the Global South, developing binding regulations on carbon, and
    working together to help the world''s most threatened countries adapt to climate-related
    risk. I was there as a freelance journalist, to talk to marchers and get a feel
    for the event, but I was there as one of the “people” whose march it supposedly
    was, a concerned global citizen, a worried and guilty American.

