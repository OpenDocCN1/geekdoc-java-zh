    caused by human activity. Meanwhile, NPR-listening liberals want to believe that
    Tea Party Republicans are responsible, so that they can frame the problem as one
    amenable to solution by moral education and enlightened consumerism, as if it
    were all matter of convincing people to eat more kale and drive electric cars.
    One climate activist has argued that just 90 companies are responsible for almost
    two-thirds of all historical greenhouse gas emissions, which conveniently absolves
    billions of automobile drivers, airline passengers, meat eaters, and cellphone
    users of responsibility.96 The enemy isn’t there somewhere—the enemy is ourselves.
    Not as individuals, but as a collective. A system. A hive.


    How do we stop ourselves from fulfilling our fates as socially productive drones
    in a carbon-addicted hive, destroying ourselves in some kind of psychopathic colony
    collapse disorder? How do we interrupt the perpetual circuits of fear, aggression,
    crisis, and reaction that continually prod us to ever more intense levels of manic
    despair? One way we might begin to answer these questions is by considering the
    problem of global warming in terms of Peter Sloterijk’s idea of the philosopher
    as an interrupter:


    > We live constantly in fields of excitation; this cannot be changed so long as
    we are social beings. The input of stress enters me; thoughts are not free, each
    of us can divine them. They come from the newspaper and wind up returning to the
    newspaper. My sovereignty, if it exists, can only appear by my letting the integrated
    impulse die in me or, should this fail, by my retransmitting it in a totally metamorphosed,
    verified, filtered, or recoded form. It serves nothing to contest it: I am free
    from the extent that I am able to immunize myself against infections of opinion.
    Precisely this continues to be the philosopher’s mission in society, if I may
    express myself in such pathetic terms. My mission is to show that a subject can
    be an interrupter, not merely a channel that allows thematic epidemics and waves
    of excitation to flow through it. The classics express this with the term ‘pondering.’
    With this concept, ethics and energetics enter into contact: as a bearer of a
    philosophical function, I have neither the right nor the desire to be either a
    conductor in a stress-semantic chain or the automaton of an ethical imperative.97


    Sloterdijk compares the conception of political function as collective vibration
    to a philosophical function of interruption. As opposed to disruption, which shocks
    a system and breaks wholes into pieces, interruption suspends continuous processes.
    It''s not smashing, but sitting with. Not blockage, but reflection.


    Sloterdijk sees the role of the philosopher in the human swarm as that of an aberrant
    anti-drone slow-dancing to its own rhythm, neither attuned to the collective beat
    nor operating mechanically, dogmatically, deontologically, but continually self-immunizing
    against the waves of social energy we live in and amongst by perpetually interrupting
    its own connection to life. So long as one allows oneself to be “a conductor in
    a stress-semantic chain,” one is strengthening connective channels of retransmission
    regardless of content, thickening the reflexive connective tissues of mass society,
    making all of us more susceptible to such viral phenomena as nationalism, scapegoating,
    panic, and war fever. Interrupting the flows of social production is anarchic
    and counterproductive, like all good philosophy: if it works, it helps us stop
    and see our world in new ways. If it fails, as it often and usually does, the
    interrupter is integrated, driven mad, ignored, or destroyed.


    What Sloterdijk helps us see is that responding autonomously to social excitation
    means not reacting to it, not passing on, but interrupting it, then either letting
    the excitation die or transforming it completely. Responding freely to constant
    images of fear and violence, responding freely to the perpetual media circuits
    of pleasure and terror, responding freely to the ongoing alarms of war, environmental
    catastrophe, and global destruction demands a reorientation of feeling so that
    every new impulse is held at a distance until it fades or can be changed. While
    life beats its red rhythms and human swarms dance to the compulsion of strife,
    the interrupter practices dying.


    # FIVE

    A NEW ENLIGHTENMENT


    Let my eyes see the sun and be sated with light!

    The darkness is hidden, how much light is there left?

    When the dead see the rays of the sun?


    > —The Epic of Gilgamesh, Tablet IX⁹⁹⁸


    Death begins as soon as we are born. From our first moments in the world, blinking
    and crying in the light, we fly an unwavering arc to the grave. We are mortal,
    material, corporeal beings, blessed with quickening doomed to decay. In a very
    important sense, we don''t need to learn anything at all dying: it''s the one
    thing in life we can absolutely count on getting done.


    But while dying may be the easiest thing in the world to do, it''s the hardest
    thing in the world to do well—we are predisposed to avoid, ignore, flee, and fight
    till the very last hour. We are impelled in our deepest to struggle against it.
    Every time you feel hunger or taste ambition, every time your body yearns for
    recognition, every time you shake with anger or tremble in fear, the animal in
    you striving for life. We fall into the world caught between two necessities,
    compelled to live, born to die, and reconciling them has forever been one of our
    most challenging puzzles. The pieces just don''t fit together.


    Much of our energy is spent in denial. Some argue that denying the fact of death
    is the root and germ of human culture itself, from our first burials and ancestor-worship
    to plastic surgery and the space program.¹⁹⁹. “The idea of death, the fear of
    it, haunts the human animal like nothing else,” wrote anthropologist Ernest Becker
    in his Pulitzer Prize-winning book The Denial of Death. “It is a mainspring of
    human activity—activity designed largely to avoid the fatality of death, to overcome
    it by denying it in some way that it is the final destiny for man.¹¹⁰⁰ Throughout
    human history, we have invested innumerable hours of labor in countless luminous
    visions of the afterlife, both physical and metaphysical: Heaven and Hell, family
    and nation, capitalism and Star Trek. We have children and pressure our children
    to give us grandchildren sending our genes into the future. We build pyramids,
    cathedrals, temples, mosques, monuments, and skyscrapers to prove to ourselves
    that some part of us will survive beyond our end. When our buildings crumble and
    ours grow weak, we distract ourselves with pleasure or rarely ourselves to war.
    As men who have experienced war have testified since the days of Homer, here is
    “a joyous feeling in the safety of killing” that washes away the bitter taste
    of death.”¹101


    Accepting the truth of our existence is the beginning of wisdom. When Montaigne
    wrote that “To philosophize is to learn how to die,” he was working in and with
    a philosophical tradition that was already centuries old. Citing one of his key
    predecessors, the Roman orator Cicero, Montaigne wrote: “Cicero says that to philosophize
    is nothing but to prepare for death. This is because study and contemplation draw
    our soul out to some extent and keep it outside the body; which is a sort of apprenticeship
    and semblance of death. Or else it is because all the wisdom and reasoning in
    this world boils down down this point: to teach us not to be afraid to die.”¹102
    Cicero was in his turn reworking Plato’s account of the death of Socrates in the
    Phaedo where Socrates argues that philosophy is the practice of learning how to
    separate the soul from the body.¹103


    Philosophical humanism in its most radical practice is the disciplined interruption
    of somatic and social flows, the detachment of consciousness from impulse, and
    the condensation of conceptual truths out of the granular data of experience.
    It is the study of “dying and being dead,” a divestment from this life in favor
    of deeper investments in a life beyond ourselves. In recognizing the dominion
    of death and the transience of individual existences we affirm a web being that
    connects to future, to us, to you. “One is responsible to life,” wrote James Baldwin.
    “It is the small beacon in terrifying darkness from which we come and to which
    we return. We must negotiate this passage as nicely as possible, for the sake
    of those who are coming after us.¹104


    Learning to die is hard. It takes practice. There is no royal road, firstclass
    lane. Learning to die demands daily cultivation of detachment and daily reminders
    of mortality. It requires long communion with the dead.

