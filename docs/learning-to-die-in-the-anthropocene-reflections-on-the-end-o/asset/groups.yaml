  mdcn: '

    时间，塑造了我们的习惯和性格。当我们训练自己去对恐惧和攻击性产生共鸣时，我们强化了那些塑造出一个产生此类现象的思想和情感模式。


    恐惧性逃避是引人注目的，因为它具有至重要的进化意义。它增加了警觉性和肾上腺素的流量，通常能维持人类动物的生存。然而，当我们进入人类世时，资本主义用来平衡恐惧、攻击性与欲望、快乐的文化机制正在咯咯作响并溅射火花。文化理论家劳伦·伯兰特（Lauren
    Berlant）所说的这种由永远无法实现的希望所维持的系统的“残酷乐观”，实际上实际上与一种被围困的焦虑氛围危险地混合，增加了对工人阶级和中产阶级经济停滞的挫败感，以及一种随着其所的对象而增长的普遍施虐窥淫癖。^{89}
    尽管美国破碎的社会基础设施仍维持着，我们的恐惧和攻击性可以引导到劳动、消费和经济竞争中，并通过职业体育、超暴力的电视和偶尔的抗议来宣泄。然而，一旦社会结构开始撕裂，我们面临的风险不仅是引发暴乱、叛乱和内战，还有足以让我们胆战心惊的杀人政治。


    想想：伊拉克曾是中东最现代、最西方国家之一，拥有强大且受过良好教育的中产阶级，但几十年来一直受到帝国主义侵略、犯罪团伙、国内政治干涉、经济自由化和教派冲突的祸害。今天，它正被一个腐败的石油政治政权、一个分裂的库尔德飞地和一个自封的伊斯兰教旨主义哈里发国撕裂，而邻国叙利亚的内战蔓延到了它的边界。这些冲突可能部分由中东历史上最严重的干旱引起，并因此加剧。自2006年以来，叙利亚一直遭受致命的水资源短缺，这在某些地区导致了75%的作物歉收，消灭了85%的牲畜，使超过80万叙利亚人失去生计，并导致成千上万贫困青年涌入其城市。^{90}
    这场干旱是正在改变中东的长期变暖和干燥趋势的一部分.¹¹ 不仅仅是水，石油这些冲突的要素。伊拉克拥有世界上第五大探明储量。与此同时，伊斯兰国之所以能够生存，是因为它控制了叙利亚大部分的油气生产。我们倾向于将气候变化和暴力的宗教基础主义视为孤立的现象，正如退役海军少将大卫·泰特利（David
    Titley）所说，“你现在可以对这场我们称为ISIS的灾难建立起一个非常可信的气候联系。”⁹²


    几百英里外，以色列士兵在2014年夏天于加沙杀杀了Palest勒斯坦人。以色列也遭受着干旱，而加沙正处于由于以色列军事侵略加剧的关键水危机之中。国际红十字委员会报告说，在2014年夏天，以色列轰炸机目标了Palest勒斯坦人的水井和水利设施。⁹³
    这不是水或石油的问题，一些观察者认为，以色列的“保护卫岸行动”旨在进一步控制2010年在地中海加沙离岸发现的巨大“利维坦”气田.¹¹⁴


    与此同时，在南方数千英外的北方，受俄罗斯支持的分离分子与捍卫乌克兰选任政府的准军事力量战斗，乌克兰也遭受着干旱。⁹⁵ 俄罗斯作为向欧洲出口油气的角色，不可能是冲突中的关键问题之一。在其他地区和天然气管道沿线，2014年的干旱导致来自危地拉和洪地拉斯的难民北上美国边境，摧毁了加州和澳大利亚的作物，并威胁到厄立特里亚、索马里、埃塞俄比亚、苏丹、乌干达、阿富汗、印度、摩洛哥、巴基斯坦和中国部分地区的生命。全球范围内，抗议和暴乱出现在波黑、委内瑞拉、巴西、土耳其、埃及和泰国，而冲突在哥伦比亚、利比亚、中非、苏丹、尼日利亚、也门和印度激烈进行。当世界燃烧时，美国一直在操控东欧和北极，并与中国争夺东南亚和南海控制权，威胁着七年来未见的全球性战争。这就是我们的现在和未来：干旱和飓风、难民和边卫、为了石油、水、气体和食物的战争。


    我们今天以两种模式之一经历这个动荡的世界：要么它是我们的环境，我们身处其中；要么它以图像、社会激发、重传的恐惧的形式找到我们。人们在地球各地的废墟城市中战斗和死亡。邻里之间互相残杀。老人在轰炸后的瓦砾中血死，孩子们正在被杀害，可能就在你读到这句话时。生活在那个世界是恐怖的。持续的危险紧绷着每一根神经。唯一重要的是生存、杀掉敌人以及有一个安全的地方睡觉。人类的体验收窄到了刀刃上。


    我记得多年前在被占的巴格达生活过那个世界。今天，那个世界似乎遥不可及，但它每天都通过无止尽的文字、图像、诉求和报告向我施压。我看到视频。我读到故事。我看到或或痛苦或不公的图片，我深受感动。也许是采取行动，但更准确地说是发情感。做出反应。去感受去表演。我们通常不问这些感觉来自哪里，或为谁服务，但我们都知道，传输这些情感波动的技术并不是中立的：新闻机构塑造信息以符合其所有者的偏见，而Facebook、Twitter和Google则通过隐藏的算法塑造我们的认知。当代媒体的专业化和人口统计学定位倾向于收窄感知通道，以至于我们只接收那些与我们自身偏见、与自身预偏见相和谐的图像和波动。


