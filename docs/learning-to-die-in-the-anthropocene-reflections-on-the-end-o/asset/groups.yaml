    In the spring of 1931, a Kentucky woman named Florence Reece rewriting a song
    she''d written almost twenty years before, when she was twelve years old. The
    song was originally about a strike her papa, a coal miner, had been marching in,
    and it was unashamedly polemical. Its title and refrain demand to know: “Which
    Side Are You On?” A new strike had broken out and Reece was revising her song
    to fit a new battle, only this time it was her husband who was marching and fighting.


    “Which Side Are You On?” went on to become a classic union anthem. Alan Lomax
    recorded herself singing it in 1937. Years later, it was adapted by the Student
    Nonviolent Coordinating Committee Freedom Singers as a Civil Rights song. In Reece’s
    1931 version some of the verses run:


    - They say in Harlan County,

    There are no neutrals there.

    You’ll either be a union man

    Or a thug for J.H. Blair.


    - Oh, workers can stand it?

    Oh, tell me how you can.

    Will you be a lousy scab

    Or will you be a man?


    - Don''t scab for the bosses,

    Don''t listen to their lies.

    Us poor folks haven''t got a chance

    Unless we organize.


    The labor dispute Reece''s husband was embroiled in, referred to in the papers
    of the day as the Harlan County War, was a series of conflicts between Kentucky
    coal miners and the Harlan County Coal Operators Association. The trouble began
    when the Association cut the market price of their coal and paid for it by taking
    out of their miners'' wages. Already aggrieved because of predatory lending practices,
    cheating at the scales, excessive deductions for sick days, and a lack of health
    benefits, the miners went on strike. The coal companies hired private guards to
    protect the strikebreaking replacement workers they brought in, their “scabs,”
    and over the next several weeks increasingly violent skirmishes broke out between
    striking miners and company heavies. These hired guns, the “thugs” of Reece’s
    song, had been deputized by Harlan County sheriff J.H. Blair, and they given free
    rein to harass and arrest the miners. Several people were killed on both sides,
    and after miners ambushed a convoy of guards and killed three of them, the Kentucky
    National Guard was called in. With the National Guard behind him, Sheriff Blair
    outlawed all public assemblies, tear-gassed the miners, and within a few weeks
    broke the strike.


    Between 1877 and 1937 there were at 30 major labor conflicts in the United States,
    including Hay-market, the Pullman Strike, the Lattimer Massacre, the Ludlow Massacre,
    wait, it''s including Hay-market, the Pullman Strike, the Lattimer Massacre, the
    Ludlow Massacre, the Everett Massacre, and the Battle of Matewan. These conflicts
    were typically between striking workers and motley forces brought in by company
    bosses, usually including National Guard troops. In the Ludlow Massacre of 1914,
    for example, mine workers and their families were killed including several women
    and children.


    Over time and after the Great Depression had sent hundreds of thousands of unemployed
    workers into the streets, the United States government passed the National Labor
    Relations Act of 1935, enacted various other labor laws, and deployed an array
    of New Deal social services, all of which helped make life better for working
    people. The ruling oligarchy did not give workers rights: organized labor won
    those rights through decades of struggle.


    The Civil Rights movement, often held up as the great American example of what
    nonviolent civil disobedience, was like the labor struggle, a violent, decades-long
    conflict over social and political power. As journalist and historian Charles
    Cobb shows in his book, This Nonviolent Stuff’ll Get Killed: How Guns Made the
    Civil Rights Movement, armed resistance and defense were foundational to the Civil
    Rights movement, protecting leaders and organizers, demonstrating political will
    on the part of black communities and activists, and making nonviolent civil disobedience
    practicable in a hostile environment.


    In 1957, Robert F. Williams became one of the great examples of the effectiveness
    of armed resistance when he organized the Monroe, North Carolina, chapter of the
    National Association for the Advancement of Colored People (NAACP) to physically
    defend the home of his friend and ally Albert E. Perry. Perry had been targeted
    by the Monroe Kluz Klan (KKK) for leading a protest against rules prohibiting
    blacks from using a municipal swimming pool. When an armed motorcade came after
    Perry in his neighborhood, intending to terrorize him into submission, Williams,
    a US veteran of World War II, had his NAACP chapter meet the Klan with “disciplined,
    with volleys” of rifle fire. The Klan fought, and the very next day, the Monroe
    city council banned KKK parades.


