    \n# Learning to Die in the Anthropocene\n\nREFLECTIONS ON THE\n**END OF A CIVILIZATION**\n\
    \nRoy Scranton\n\n> \"Scranton draws on his experiences in Iraq to confront the\
    \ grim realities of climate change. The result is a fierce and provocative book.\"\
    \n— Elizabeth Kolbert, author of The Sixth Extinction\n\n![](img/def99f2882281029bc4c39f7c642fcdd_1_0.png)\n\
    \n# PRAISE FOR ROY SCRANTON\nLEARNING TO DIE IN THE ANTHROPOCENE\n\n“In Learning\
    \ to Die in the Anthropocene, Roy Scranton draws on his experiences in Iraq to\
    \ confront the grim realities of climate change. The result is a fierce and provocative\
    \ book.”\n—Elizabeth Kolbert, 2015 Pulitzer Prize winner and author of The Sixth\
    \ Extinction: An Unnatural History\n\n“Roy Scranton lucidly articulates the depth\
    \ of the climate crisis with honesty that is all too rare, then calls for a reimagined\
    \ humanity that will help meet our stormy future with much decency as we can muster.\
    \ While I don’t share his conclusions about the potential for social movements\
    \ to drive ambitious mitigation, this is a wise and important challenge from an\
    \ elegant writer and original thinker. A critical intervention.”\n—Naomi Klein,\
    \ author of This Changes Everything: Capitalism vs. the Climate\n\n“We’re fucked.\
    \ We know it. Kind of. But Roy Scranton in this blistering new book goes down\
    \ to the darkness, looks hard and doesn’t blink. He brings back a few, hard-earned\
    \ slivers of light. . . . What is philosophy? It’s time comprehended in thought.\
    \ This is our time and Roy Scranton has the courage to think it in prose that\
    \ sometimes feels like bullets but bullet points.”\n—Simon Critchley, editor of\
    \ The New York Times Opinionator blog\n“The Stone,” author of Infinitely Demanding:\
    \ Ethics of Commitment, Politics of Resistance\n\nRoy Scranton gets it. He knows\
    \ in his bones that this civilization is over. He knows it is high time to start\
    \ again the human dance of making some other way to live. In his distinctive and\
    \ original way he works through a common cultural inheritance, making something\
    \ fresh and new for these all too interesting times. This compressed, essential\
    \ text offers both uncomfortable truths and unexpected joy.\n> —McKenzie Wark,\
    \ author of Molecular Red: Theory for the Anthropocene\n\n“An eloquent, ambitious,\
    \ and provocative book.”\n> —Rob Nixon, author of Slow Violence and the Environmentalism\
    \ of the Poor\n\n“Roy Scranton has written a howl for the Anthropocene—a book\
    \ full of passion, fire, science and wisdom. It cuts deeper than anything that\
    \ has yet been written on the subject.”\n> —Dale Jamieson, author of Reason in\
    \ a Dark Time: Why the Struggle Against Climate Change Failed—and What It Means\
    \ for Our Future\n\n# Learning to Die in the Anthropocene\n\nREFLECTIONS\nON THE\
    \ END OF A CIVILIZATION\n\nRoy Scranton\n\n![](img/def99f2882281029bc4c39f7c642fcdd_4_0.png)\n\
