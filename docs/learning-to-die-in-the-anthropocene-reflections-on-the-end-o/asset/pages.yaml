  md: 'collective humanity that exists beyond any place, life, or time. The story
    this book tells is of the human soul coming to know itself in its mortality. It
    begins in the deepest origins of our primal relationship with the Earth’s climate,
    in Chapter 1: Human Ecologies, which traces relationship up through our current
    moment and our contemporary predicament. In Chapter 2: A Wicked Problem, we consider
    that predicament. Carbon-fueled capitalism and its techno-utopian ideologues have
    promoted infinite growth and infinite innovation, yet they have proven incapable
    of saving us from the disaster they have made. Various “solutions” to climate
    change have been offered, from carbon taxes to geoengineering, none of them are
    likely to work. This chapter takes a look at the reasons why.


    The global failure to address climate change is fundamentally a collective action
    problem, meaning it is a political problem. In Chapter 3: Carbon Politics, we
    consider how our collective failure to respond to climate change is an effect
    of the very structures of our political systems and the way that they are built
    around decentralized flows of oil and gas. The systems that structure our political
    desires and constrain our political have a material history. As the human animal
    developed increasingly social technologies for producing power, from hunting bands
    tracking migrating herds of giant elk and mastodons to agricultural empires harvesting
    grain to fossil-burning global capitalism, we developed increasingly complex technologies
    of collective life. As our technologies of producing power changed, so did our
    technologies for distributing and controlling it. Today, global power is in the
    hands of a tiny minority, and the system they provide over threats to destroy
    us all. With this mind, we turn back to the collective danger that carbon-fueled
    climate change poses, this time considered in terms of our primal human responses
    to existential threat: fight or flight. Facing the fear of death and the inevitability
    of conflict in the Anthropocene is the task of Chapter 4: The Compulsion of Strife.
    Progressive belief in the infinite perfectibility of the human animal depends
    significantly on carbon-fueled capitalism’s promises of infinite economic growth.
    Accepting our limits means coming to terms with our innate innocence and our inescapable
    mortality.


    By learning to die, though, we can connect with and open up new possibilities
    for the human future, as I argue in Chapter 5: A New'
