  md: 'To survive as a soldier, I had to learn to accept the inevitability of my own
    death. For humanity to survive in the Anthropocene, we need to learn to live with
    and through the end of our current civilization. Change, risk, conflict, strife,
    and death are the very processes of life, and we cannot avoid them. We must learn
    to accept and adapt.


    The human psyche naturally rebels against the idea of its end. Likewise, civilizations
    have throughout history marched blindly toward disaster, because humans are wired
    to believe that tomorrow will be much like today. It is hard for us to remember
    that this way of life, this present moment, this order of things is not stable
    and permanent. Across the world today, our actions testify to our belief that
    we can go on like we forever: burning oil, poisoning the seas, killing off other
    species, pumping carbon into the air, ignoring the ominous silence of our coalmine
    canaries in favor of the unending robotic tweets of our new digital imaginarium.
    Yet the reality of global climate change is going to keep intruding on our collective
    fantasies of perpetual growth, constant innovation, and endless energy, as the
    reality of individual mortality shocks our causal faith in permanence.


    The greatest challenge the Anthropocene poses isnt how the Department of Defense
    should plan for resource ways, whether we should put up sea walls to protect Manhattan,
    or when we should abandon Miami. It won''t be addressed by buying a Prius, turning
    off the air conditioning, or signing a treaty. The greatest challenge we face
    is a philosophical one: understanding that this civilization is already dead.
    The sooner we confront our situation and realize that there is nothing we can
    do to save ourselves, the sooner we can get down to the difficult task of adapting,
    with mortal humility, to our new reality.


    Carbon-fueled capitalism is a zombie system, voracious but sterile. This aggressive
    human monoculture has proven astoundingly virulent but also'
