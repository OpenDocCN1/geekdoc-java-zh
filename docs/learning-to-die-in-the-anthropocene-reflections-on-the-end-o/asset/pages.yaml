    In order for us to adapt to this strange new world, we''re going to need more
    than scientific reports and military policy. We''re going to need new myths and
    new stories, a new conceptual polyglot traditions of reality, and a new relationship
    to the deep quality of human culture that carbon-based capitalism has vitiated
    through commodification and assimilation. And against capitalism, we will need
    a new way of thinking our collective existence. We need a new vision of “we” are.
    We need a new humanism—a new philosophical humanism, undergirded by renewed attention
    to the humanities.


    Admittedly, ocean acidification, social upheaval, and species extinction are problems
    that humanities, with their taste for fine-grained philological analysis, esoteric
    debates, and archival marginalia, might seem remarkably illsuited to address.
    After all, how will thinking about Kant or Frantz Fanon help us trap carbon dioxide?
    Can arguments between object-oriented ontology and historical materialism protect
    honeybees from colony collapse disorder? Are ancient Greek philosophers, medieval
    poets, and contemporary metaphysics going to save Bangladesh from being inundated
    by the Indian Ocean?


    Perhaps not. But the conceptual and existential problems that the Anthropocene
    poses are precisely those that have at the heart of humanistic inquiry. What does
    it mean to be human? What does it mean to live? What is truth? What is good? In
    the world of the Anthropocene, the question of individual mortality—What does
    my life mean in the face of death?—is universalized and framed in scales that
    baffle the imagination.²¹ As environmental philosopher Dale Jamieson puts it,
    “The Anthropocene'
