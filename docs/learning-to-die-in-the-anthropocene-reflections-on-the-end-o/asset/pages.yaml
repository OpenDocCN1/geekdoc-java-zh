  md: 'of place, not a single muon faulty. Nothing went wrong. No mistakes were made.
    There was no sin, no error, no fall. There was only necessity.


    And so it will be tomorrow, and the day after, and the day after that. If, like
    a god, we could see every photon''s arc and each neutrino''s wobble, we would
    see past and future laid out in a single mathematical design: infinite, determined,
    perfect.


    We will never achieve such knowledge. We only ever see the pattern dimly and in
    flashes. Yet we can practice and cultivate understanding the intimate, necessary
    connection of all things to each other. Light comes to us from millions of miles
    away, through the emptiness of space, and we can see it. Its heat warms our skin.
    Pleasure arises in feeling ourselves attuned and connected to such sublime power.
    The only practical question remaining is whether we, existing as we are, will
    be that light.'
