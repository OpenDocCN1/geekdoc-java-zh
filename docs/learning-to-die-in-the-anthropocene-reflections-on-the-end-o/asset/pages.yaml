  md: '# PRAISE FOR ROY SCRANTON

    LEARNING TO DIE IN THE ANTHROPOCENE


    “In Learning to Die in the Anthropocene, Roy Scranton draws on his experiences
    in Iraq to confront the grim realities of climate change. The result is a fierce
    and provocative book.”


    —Elizabeth Kolbert, 2015 Pulitzer Prize winner and author of The Sixth Extinction:
    An Unnatural History


    “Roy Scranton lucidly articulates the depth of the climate crisis with honesty
    that is all too rare, then calls for a reimagined humanity that will help meet
    our stormy future with much decency as we can muster. While I don’t share his
    conclusions about the potential for social movements to drive ambitious mitigation,
    this is a wise and important challenge from an elegant writer and original thinker.
    A critical intervention.”


    —Naomi Klein, author of This Changes Everything: Capitalism vs. the Climate


    “We’re fucked. We know it. Kind of. But Roy Scranton in this blistering new book
    goes down to the darkness, looks hard and doesn’t blink. He brings back a few,
    hard-earned slivers of light. . . . What is philosophy? It’s time comprehended
    in thought. This is our time and Roy Scranton has the courage to think it in prose
    that sometimes feels like bullets but bullet points.”


    —Simon Critchley, editor of The New York Times Opinionator blog

