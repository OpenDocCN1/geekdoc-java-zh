    The first human beings appeared in tropical Africa around two hundred thousand
    years ago, evolving out of proto-human hominids, born into a world that was even
    then undergoing intense climatic transformation.³⁰ The Earth was on average 3.5
    degrees Fahrenheit colder than it is today, and would soon average between 5 degrees
    and 9 degrees Fahrenheit colder. The global climate was frigid, dry, and harsh.
    The northern hemisphere was mantled in vast ice sheets up to two and a half miles
    thick that reached as far as Ohio, England, Germany, and northern China. Thirty
    percent of the Earth’s surface was covered in glaciers. The oceans were more than
    270 feet lower than they are now. This was the world in which we first evolved
    and learned to survive.


    Our ancestors, omnivorous hunter-gatherers who traveled in small bands, lived
    in equatorial Africa for many thousands of years. But when temperatures warmed
    up about 135,000 years ago, reaching averages as much as 5 degrees Fahrenheit
    warmer than the present, our ancestors fled the tropics for more temperate climates,
    hunting their way into the thenverdant grasslands of the Sahara. The Earth had
    entered what geoscientists call an interglacial period, a regular period of warming
    that occurs between'
