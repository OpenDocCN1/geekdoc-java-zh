  md: '# INTRODUCTION

    COMING HOME


    The knowledge of future things is, in a word, identical with

    that of the present.


    > —Plotinus, Enneads IV. 12


    Driving into Iraq in 2003 felt like driving into the future. We convoyed all

    day, all night, past Army checkpoints and burned-out tanks, till in the blue

    dawn Baghdad rose from the desert like a vision of hell: flames licked the

    bruised sky from the tops of refinery towers, cyclopean monuments bulged

    and leaned against the horizon, broken overpasses swooped and fell over

    ruined suburbs, bombed factories, and narrow ancient streets.


    With “shock and awe,” the US military had unleashed the end of the

    world on a city of six million—a city about the same size as Houston or

    Washington, D.C. Baghdad’s infrastructure was totaled: water, power,

    traffic, markets and security fell to anarchy and local rule. The government

    had collapsed, walls were going up, tribal lines were being drawn, and

    burial hierarchies were being savagely established. Over the next year, the

    city’s secular middle class would disappear, squeezed out by gangsters,

    profiteers, fundamentalists, and soldiers.


    I was a private in the United States Army. This damaged world was my

    home. If I survived.


    Two and half years later, in the Army but safe and lazy back in

    Fort Sill, Oklahoma, I thought I had made it out. Then I watched on

    television as Hurricane hit New Orleans. This time it was the

    weather that inspired shock awe, but I saw the same chaos and collapse

    I''d see in Baghdad, the same failure of planning and the same tide of

    anarchy. The 82nd Airborne Division took over strategic points and

    patrolled streets now de facto martial law. My unit was put on alert

    and trained for riot control operations. The grim future I''d seen in Baghdad'
  merge: -1
  pgno: 9
