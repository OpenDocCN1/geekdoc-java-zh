  md: 'national security officials, the concern is not whether global warming exists
    or how we might prevent it, but how we are going to adapt to life in the hot,
    volatile world we’ve created.


    There is a name for this new world: the Anthropocene. The word comes from ancient
    Greek. All the epochs of the most recent geological era (the Cenozoic) end in
    the suffix “cene,” from kainos, meaning new. Anthro means human. The idea behind
    the “Anthropocene” is that we have entered a new epoch in Earth’s geological history,
    one characterized by the advent of the human species as a geological force.¹16
    The biologist Eugene F. Stoermer and Nobel-winning chemist Paul Crutzen advanced
    the term in 2000, and it has gained acceptance as evidence that has the changes
    brought by global warming will affect not only the world’s climate and biodiversity,
    but its very geological structure, and not just for centuries, but for millennia.¹⁷
    In the prophetic words of William Blake, written at the dawn of the carbon era
    more than two hundred years ago, “The generations of men run on the tide of Time
    / But leave their destin-delinements permanent for ever and ever.”¹⁸


    The International Commission on Stratigraphy, the geologists responsible for driving
    the “golden spikes” that demarc different geological periods, have adopted the
    Anthropocene as a term deserving further consideration, “significant on the scale
    of Earth history,” and are discussing what level of geological time-scale it might
    be and at what date we might say it began.¹⁹ Is it an “epoch” like the Holocene,
    or merely an “age” like the Calabrian? Did it start with the beginning of the
    Industrial Revolution, around 1800, or during the Great Acceleration in the middle
    of the 20th century? With the dawn of agriculture, 12,000 years ago, or on July
    16, 1945, with the first atomic bomb?”²⁰


    Whenever it be, it is the new world we live in. In a few generations we will face
    average temperatures 7 degrees Fahrenheit warmer than they are today, rising seas
    at least to ten feet higher, and worldwide shifts in crop belts, growing seasons,
    and population centers. Unless we stop emitting greenhouse gases wholesale now,
    humans will within a couple hundred years be living in a climate the Earth hasn’t
    seen'
