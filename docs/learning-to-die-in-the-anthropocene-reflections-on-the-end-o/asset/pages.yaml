    States faces, more dangerous than terrorism, Chinese hackers, and North Korean
    nuclear missiles.¹ Upheaval from increased temperatures, rising seas, and climatic
    destabilization “is probably the most likely thing that is going to happen that
    will cripple the security environment, probably more likely than the other scenarios
    we all talk about,” said Thomas E. Donilon said the same thing in 2014 as National
    Security Advisor, arguing that the “environmental impacts of climate change present
    a national security challenge.”² James Clapper, Director of National Intelligence,
    told the Senate in 2013 that “Extreme weather events (floods, droughts, heat waves)
    will increasingly disrupt food and energy markets, exacerbating state weakness,
    forcing human migrations, and triggering riots, civil disobedience, and vandalism.³
    President Obama’s 2010 National Security Strategy, the Pentagon’s 2014 Quadrennial
    Defense Review, and the Department of Homeland Security’s 2014 Quadrennial Homeland
    Security Review all identify climate change as a severe and imminent danger⁴ More
    recently, the Pentagon’s 2014 Climate Change Adaptation Roadmap warned: “Rising
    global temperatures, changing precipitation patterns, climbing sea levels, and
    more extreme weather events will intensify the challenges of global instability,
    hunger, poverty, and conflict. They will likely lead to food and water shortages,
    pandemic disease, disputes over refugees and resources, and destruction by natural
    disasters in regions across the globe⁵


