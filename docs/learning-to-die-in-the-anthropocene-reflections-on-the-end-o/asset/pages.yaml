  md: 'Enlightenment. Through interrupting social circuits of fear and reaction, looking
    deep into the face of death, and cultivating our rich stocks of human cultural
    technology, from the Epic of Gilgamesh and the Bhagavad-Gita to imagined Anthropocene
    futures, we open up a new relationship to the universe in which we might not live
    as parasitic consumers, but as creators—a relationship in which we might learn
    to live as the very light from which all our power ultimately flows.


    The crisis of global climate change, the crisis of capitalism, and the crisis
    of the humanities in the university today are all aspects of the same crisis,
    which is the suicidal burnout of our carbon-fueled capitalist civilization. The
    odds of that civilization surviving are negligible. The odds of our species surviving
    for us are slim. The trouble we find ourselves in likely prove too intractable
    to manage well, if we can manage it at all. As German philosopher Peter Slotderijk
    observes: “It is characteristic of being human that human beings are presented
    with tasks that are too difficult for them, without having the option of avoiding
    them because of their difficulty.”228 We cannot escape our fate. Our future will
    depend on our ability to confront it not with panic, outrage, or denial, but with
    patience, reflection, and love.


    Our choice is a clear one. We can continue acting as if tomorrow will be like
    yesterday, growing less and less prepared for each new disaster as it comes, and
    more and more desperately invested in a life we can''t sustain. Or we can learn
    to see each day as the death of what came before, freeing ourselves to deal with
    whatever problems the present offers without attachment or fear.


    If we want to learn to live in the Anthropocene, we must first learn how to die.'
