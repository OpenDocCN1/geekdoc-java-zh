  \n# 第 4 章：过程优化与线性规划\n\n## 4.1 优化\n\n优化通常涉及寻找问题的“最佳结果”或最优解。因此，在建模的背景下，它们通常被称为“规范性模型”，因为它们可以被用于规定行动方案或最佳设计。\n\
  \n最优值是曲线平坦的点。在数学术语中，这对应于导数`f_(x)`等于零的`x`值。此外，二阶导数`f''(x)`指示最优值是最小值还是极大值：如果`f''(x)\
  \ < 0`，则该点为极大值；如果`f''(x) > 0`，则该点为最小值。\n\n### 4.1.1 工程中优化问题的示例\n\n- 设计具有最小重量和最大强度的飞行器。\n\
  - 航天器的最优轨迹。\n- 设计成本最低的土木工程结构。\n- 设计水利工程项目（如大坝）以减轻洪灾损害，同时产生最大的水能。\n- 通过最小化势能来预测结构行为。\n\
  - 最小成本的材料切割策略。\n- 设计泵和热传递设备以实现最大效率。\n- 在最小化热量产生的同时使电气网络和机械的功率输出最大。\n- 推销员一次销售期间访问各个城市的最短路线。\n\
  - 最优规划与调度。\n- 最小误差的统计分析和模型。\n- 最优管道网络。\n- 库存控制。\n- 最小化成本的维护计划。\n- 最小化等待和闲置时间。\n\
  - 设计废物处理系统以符合水质标准。\n\n## 4.2 优化的数学\n\n一个优化或数学规划问题通常可以述为：最小化或最大化`f(x)`，受限于\n```\n\
  di (x) ≤ ai = 1, 2, ... , p\n```\n\n其中 `x` 是一个 `n` 维向量，`f (x)` 是目标函数，`di(x)` 是不等式约束，`ai`\
  \ 是常量。优化根据 `f(x)` 的形式分类为：\n\n- 如果 `f(x)` 和约束是线性的，我们线性规划。\n- 如果 `f(x)` 是二次的且约束是线性的，我们二次规划。\n\
  - 如果 `f(x)` 不是线性或二次的且约束是非线性的，我们非线性规划。\n\n## 4.3 无约束优化\n\n无约束优化的函数`y=x1,x2,x3)`取决于单变量或多变量可以通过牛顿法找到`f\
  \ (x)`的最小值或最大值。应该注意的是，这是通过对`f (x)` 使用二阶泰勒级并将导数等于零得到的。牛顿法类似于牛顿法，因为它可能会发散。最后，最好检查二阶导数的符号是否正确以确认该技术收敛。\n\
  \n## 4.4 约束的线性规划\n\n线性规划(`LP`) 是一种在存在约束（如有限资源）的情况下满足预期目标（如最大化利润或最小化成本）的优化方法。线性表示表示目标和约束的数学函数都是线性的。规划并不是“计算机编程”，而是意味着“安排”。\n\
  \n线性规划问题包含两个主要部分：目标函数和一组约束。对于最大化问题，目标函数通常表示为：\n\n```\nMaximize Z = c1x1 + c2x2+·\
  \ ·+cnxn (4.3)\n```\n\n其中 `cj` 是每个 `j` 活动的收益，`xj` 是 `j` 活动的规模。因此，目标函数的值 `Z` 是由于活动总数\
  \ `n` 产生的总收益。\n\n约束通常表示为：\n\n```\nai1x1 + ai2x2+· ·+ainxn ≤ bi (4.4)\n```\n\n其中\
  \ `aij` 是每个 `j` 活动消耗的 `ith` 资源的量，`bi` 是 `ith` 资源的可用量。也就是说，资源是有限的。第二种通用约束规定所有活动必须具有正值，`xi\
  \ ≥ 0`。\n\n## 4.5 图形法\n\n线性规划优化可以通过绘制目标函数和约束的直线，然后将目标线移动到约束包围区域内的最大可能值来实现。可以通过以下示例来说明，图形如图\
  \ 4.1 所示。\n\n示例\n\n| 目标函数 MAXIMIZE: Z = 3 X1 + 2 X2 |\n| :--- |\n| 约束 |\n| 2 X1\
  \ + 1 X2 ≤ 18 |\n| 2 X1 + 3 X2 ≤ 42 |\n| 3 X1 + 1 X2 ≤ 24 |\n| X1, X2 ≥ 0 |\n\n\
  ![fig4.1.jpg](img/00033.jpeg)\n\n### 4.6 单纯形法\n\n\n\n\n\n单纯形法建立在最优解将是极点的假设之上。因此，该方法必须能够在求解过程中识别出极点的出现。为了做到这一点，通过引入所谓的松弛变量，将约束方程改写为等式方程。\n\
  \n### 4.6.1 松弛变量 (Slack Variables)\n正如其名所示，松弛变量用于衡量受限资源的可用性，即资源有多少“空闲”部分可用的。松弛变量代表未使用的资源量；它被添加到小于或等于（`<`）类型的约束条件中，以获得等式约束。\n\
  \n### 4.6.2 剩余变量 (Surplus Variables)\n剩余变量代表解值超过资源的数量。这些变量也称为“负松弛变量”。剩余变量与松弛变量一样，在目标函数中的系数为\
  \ 0。它被添加到大于或等于（`>`）类型的约束条件中，以获得等式约束。\n\n### 4.6.3 人工变量 (Artificial Variables)\n\
  人工变量被添加到带有等号（`=`）和大于或等于（`>`）符号的约束中。人工变量被加入约束条件中，是为了获得线性规划（LP）问题的初始解。人工变量在物理意义上没有意义，它们仅用作生成线性规划问题初始解的工具。在最大化问题中取\
  \ `-M`，在最小化问题中取 `+M`，其中 `M` 是任意大值，用于强制人工变量移出解。\n\n线性规划模型必须扩展以符合单纯形程序的要求，即：\n\n1.\
  \ 所有方程必须是等式。\n2. 所有变量必须出现在所有方程中。\n\n(I) 在“≤”约束的情况下，将松弛变量加到实际变量中，使方程成为等式。\n(II) 在“≥”约束的情况下，使用剩余变量使方程成为等式。\n\
  \n### 示例 4.6.1\n考虑以下线性规划问题：\n\n```\nMinimize cost = 6X1 + 8X2\nSubject to\nX1+x2=500\n\
  X1 ![](img/00034.jpeg) 1500\nX2![](img/00035.jpeg) 7500\nX1,X2 ![](img/00035.jpeg)0\n\
  ```\n\n共有三个约束条件，由一个等式、一个“小于或等于”和一个“大于或等于”组成：\n\n```\nX1+X2=500\nX1 +s1= 1500\nX2-s2\
  \ =500\nX1,X2 ![](img/00035.jpeg)0\n```\n\n其中 `S1` 是松弛变量，`S2` 是剩余变量。\n\n该问题通过向方程中添加人工变量（用\
  \ `Ai` 表示）来求解，即添加一个具有正值的变量。人工变量也用于已是等式的方程中，以符合上述要求 (1) 和 (2)。此时只需记住，人工变量对于问题的求解没有实际意义——它仅被用于在第一个单纯形表中找到一个解的组合。\n\
  \n因此，上述线性规划模型重写为：\n\n```\nMinimize cost = 6X1 + 8X2 + 0S1 + 0S2 + MA1 + MA2\nSubject\
  \ to\n![](img/00036.jpeg)\n```\n\n### 示例 4.6.2：单纯形法 (Simplex)\n我们将通过以下示例来解释单纯形法：\n\
  \n```\nObjective FunctionZ=3x1+2x2\nNo of variables 2 , x1, x2 : coefficient 3 2\n\
  ```\n\n![4.6 simplex.jpg](img/00037.jpeg)\n\n注意：对于最小化问题，请将主函数调用中的 Maximize 改为 Minimize。\n\
  运行程序 `4.3.3.3`。附录提供了 `SRP_Simplex.java`。\n\n![4.6 output.jpg](img/00038.jpeg)\n\n\
