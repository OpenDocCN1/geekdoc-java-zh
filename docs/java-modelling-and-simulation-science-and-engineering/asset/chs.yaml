  \ `x` 和时间变化的 `u`，该方法涉及基于独立变量的网格点网络，其中网格间距为距离的微增量 `x` 和时间 `t`。\n\n程序 `7.6.1 SRP_FEM_UnsteadyState.java`\
  \ 位于附录中。\n\n![7.6 output.jpg](img/00076.jpeg)\n\n# 第 8 章\n## 应用部分一：传热、凝固与铸造\n\n\
  ## 8.1 大尺寸钢板的冷却\n\n将随时间计算一个大钢板的温度分布，该钢板从预热炉取出时的温度假设为 `10000 C`，进入钢板堆场时的环境温度假设为 `450\
  \ C`。钢板一端是绝缘的。\n\n![fig8.1.jpg](img/00077.jpeg)\n\n问题在图 8.1 中进行了说明。给定时间间隔（例如 20\
  \ 分钟）后的温度分布解可以通过方程 (8.1) 得到。使用无量纲的时间、距离和开尔文度温度进行计算通常更方便。\n\n让我们从以下传热方程开始：\n\n当物体内部温度随时间变化时，就会发生非稳态热流。物理情况可以用以下偏微分方程表示。\n\
  \n```\nk( (��∂ 2u/��∂x2+ (��∂ 2u/��∂y2+ (��∂ 2u/��∂z2) = c( ��∂u/��∂t)      (8.1)\n\
  ```\n\n其中 `k` 是固体的导热系数，`c` 是其比热，`` 是其密度，`u` 是关于距离 `x, y z` 和时间 `t` 的温度函数。对于一维热流，它可以被写为：\n\
  \n```\n(��∂ 2u/��∂x2 ) =k/c( ��∂u/��∂t)      (8.2)\n```\n\n```\n或 (��∂ 2u/��∂x2\
  \ ) = ( ��∂u/��∂t)      (8.3)\n```\n\n其中 ` = k/c` 是热扩散率。\n\n方程 (8.3) 使用有限差法求解随距离\
  \ `x` 和时间变化的 `u`，该方法涉及基于独立变量的网格点网络，其中网格间距为距离的微增量 `x` 和时间 `t`（图 8.2）。\n\n![fig8.2.jpg](img/00078.jpeg)\n\
  \n这里 `u(i+1),i` 是时间 `t` 时距离 `ui,j` 距离 `x` 处的温度，`u(i+1),j+1` 是其在时间 `t + t` 的值。因此，当我们从左向右移动时，温度随距离步长\
  \ `x` 变化；从底部向上移动时，它随时间步长 `t` 变化。\n\n通过泰勒级数，可以写成：\n\n```\nu( i+1) = u(x+ x) =\
  \ u(x)+(x) ��∂u(x)/��∂x + (x)2/2! ��∂2u(x)/��∂x2 + (x)3/3! ��∂3u(x)/��∂x3+…\n\
  ```\n\n或者\n\n```\nu( i+1) = u(x+ x) = u(x)+(x) ��∂u(x)/��∂x + (x)2/2! ��∂2u(x)/��∂x2\
  \ + (x)3/3! ��∂3u(x)/��∂x3+…      (8.4)\n```\n\n以及\n\n```\nu( i-1) = u(x- x) =\
  \ u(x)-(x) ��∂u(x)/��∂x + (x)2/2! ��∂2u(x)/��∂x2 - (x)3/3! ��∂3u(x)/��∂x3+… \
  \     (8.5)\n```\n\n忽略三阶或更高阶项，求解导数的一阶近似：\n\n```\n��∂uj/��∂x = (u(i+1) –u(i-1) )/2\
  \      (8.6)\n```\n\n以类似的方法从方程 (8.4) 和 (8.5) 二阶导数，忽略四阶及更高阶：\n\n```\n��∂2u(x)/��∂x2\
  \ = (u(i+1) + u(i-1) - 2u(i) )/(x)2  (8.7)\n```\n\n方程 (8.2) 中关于 `t` 的导数是一阶的，也可以写为：\n\
  \n```\n��∂u/��∂t = (u(i),t+t –u(i),t )/2t      (8.8)\n```\n\n将方程 (8.6) 和 (8.7)\
  \ 代入方程 (8.2)，得到：\n\n```\nu(i),t+t = u(i),t + t/x2 (u(i+1),t + u(i-1),t )(8.9)\n\
  ```\n\n如果给出了边界条件，使用方程 (8.9) 可以得到一维热流随时间的温度分布解。应该注意选择较小的网格长度 `x` 或 `t` 精度更好。\n\n\
  #### 边界条件\n\n解还需要在区间边缘定义边界条件。这些可以通过数学关系或固定值给出。例如，物体的一面可能是绝缘的，另一面通过对流或辐射传热：\n\n```\n\
  ��∂u/��∂x= 0 at x= L\n```\n\n```\n��∂u/��∂x= h(ux – usr ) at x=0\n```\n\n其中 `h`\
  \ 是总传递系数，`usr` 是环境温度。通过考虑以下实际问题可以得到更好的说明。如果假设热属性保持不变，用无量纲距离和时间修改方程：\n\n```\nX= x/L\
  \ (A)\n=t/L2 (B)\n```\n\n并指定温度 `T`：\n\n```\nTi,+ = Ti, + /X(Ti+1, + Ti-1,\
  \ - 2Ti,)  (8.10)\n```\n\n可以证明，为了满足收敛标准，比例 `/x2` 应小于 `½`。让我们为该问题选择 `¼`：\n\n\
  ```\nTi,+ = ¼( Ti+1,+ 2Ti, + Ti-1, )  (8.11)\n```\n\n该问题的边界条件是热量从一端通过对流和辐射传递，另一端是绝缘的。因此数学上：\n\
  \n```\nq=k��∂T/��∂X= h(Ts – Ti )      (8.12)\n```\n\n这里无量纲 `Ti = (环境温度)/(炉炉温度)`，其中\
  \ `h` 是对流和辐射传热的总系数。在绝缘面上：\n\n```\n��∂T/��∂X= 0 at X=1 that x=L (8.13)\n```\n\n方程\
  \ (8.12) 中的导数项 `��∂T/��∂X` 可以如前解释用有限差法替换：\n\n```\n(Ti-1,1 - Ti+1,1 )/X = h/kL(Ts\
  \ – Ti) ....(8.14)\n```\n\n[ x/L=X ]\n\n将 (8.14) 和 (8.11) 结合并代入 `Ti-1,1`，因为它位于左边界之外：\n\
  \n```\nTi,+ = X hL (1- Ti)/2 + ½( Ti+1,妥 + Ti,)  (8.15)\n```\n\n同样从方程 (8.13)：\n\
  \n```\n(Ti-1,1 - Ti+1,1 )/X=0\n```\n\n以及从 (8.11)：\n\n```\nTi,1+妥 = ¼( Ti+1,1+\
  \ 2Ti,1 + Ti-1,1 )\n```\n\n代入 `Ti+1,1`，因为它位于右边界之外，我们得到：\n\n```\nTi,1+妥 =1/2 (Ti,1\
  \ + Ti-1,1 )  (8.16)\n```\n\n因此，使用方程 (8.15) 和 (8.16)，我们找到了两个边界的温度，并将这些数据作为输入馈方程\
  \ (8.11)，找到钢板内部不同网格点的温度分布。\n\n如果传热是通过对流和传导，方程 (8.15) 中的总传热系数 `h` 可以从方程 (8.17) 得到：\n\
  \n```\n( qconvection + qradiation)=h(ux=0 – usr )= hcon(ux=0 – usr )1.25 + ((\
  \ usr)4- ( ux=0)4) (8.17)\n```\n\n其中 `h` 是总传热系数，`hcon` 是对流传热系数，`\U0001F1E8` 和 ``\
  \ 是常数。\n\n我们将按照以下步骤编写 Java 程序来解决这个问题。\n\n##### 8.1. 算法\n1. 读取输入数据。\n2. 在 `t =0`\
  \ 时，初始化所有网格点值为预热温度。\n3. 使用方程 (8.14) 计算一端在下一步时间 `(+t)` 的温度。\n4. 使用方程 (8.15) 计算另一端在下一步时间\
  \ `(+t)` 的温度。\n5. 将步骤 3 和 4 计算的数据馈入方程 (8.10)，以找到内部网格点的温度分布。\n6. 重复步骤 3、4 和 5，以获取后续连续时间步的结果，直到达到最终时间。\n\
  7. 输出计算的数据。\n\n\n\n\n上述节介绍的方法是**显式法**，因为每个新的温度值都可以根据已知的量立即计算出来。该方法计算简单且经济，但收敛性和精度取决于比例\
  \ $\\Delta\\tau/\\Delta x²$ 的值是否在 0 到 ½ 之间。我们可以通过采用**隐式法**来消除这一限制。\n\n### 8.1.3\
