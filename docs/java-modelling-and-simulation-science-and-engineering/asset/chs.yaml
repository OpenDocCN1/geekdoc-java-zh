  \ 0.C4+0.C5=50(3.5a)\n3C1-3C2+0.C3+0.C4+0.C5=0(3.6a)\n0.C1-C2+9C3+0.C4+0.C5=160(3.7a)\n\
  C2+2C5+8C3-11C4+0.C5=0(3.58a)\n3C1+C2+0.C3+0.C4-4C5=0(3.9a)\n```\n\n可以使用数值方法求解这五个方程以得到五个未知数。使用这些数据，运行附录中提供的程序`2.4.6`\
  \ `SP_LinearMultiVariables.java`。\n\n### 3.5 建模与仿真的步骤\n\n- 步骤 1。识别问题。\n- 步骤 2。建立问题。\n\
