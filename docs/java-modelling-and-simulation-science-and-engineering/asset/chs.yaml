  \ 为 `12.36`，则生成的输出如下：\n\n`the diameter of the ball is 12.36`\n\n另一个示例：\n\n```java\n\
  System.out.print(\" My name is Raj I am “ +y“ years old”)\n```\n\n如果变量 `y=25`，则输出为：\n\
