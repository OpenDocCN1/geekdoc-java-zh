  ![fig8.4.jpg](img/00082.jpeg)\n\n### 8.4 隐式法（Crank-Nicolson）\n\n在该方法中，新的温度值是相邻点未知温度的函数。我们从方程\
  \ (8.2) 开始：\n\n$$(\\partial 2u/\\partial x² ) = \\alpha(\\partial u/\\partial t)$$\n\
  \n这里我们不使用向前差分，而是采用如下中心差分。\n\n关于 $t$ 的导数在方程中是一阶的，也可以写成：\n\n$$(u( i), j+1 –u( i),j\
  \ )/2\\Delta t=1/2\\alpha[(u( i+1),j +u( i-1),j - 2 u(i ),j)/(\\Delta x)² + (u(\
  \ i+1),j+1 + u( i-1), j+1 - 2 u(i ), j+1)/ (\\Delta x)²]$$\n\n$t_{j+1/2}$ 处的中心差分\
  \ $tj$ 处的中心差分 $t_{j+1}$ 处的中心差分\n\n关系式 $\\Delta\\tau/\\Delta x²=k\\Delta t/(c\\rho(\\\
  Delta x)²)$\n\n令 $r = k\\Delta t/(c\\rho(\\Delta x)²)$，\n\n重新整理方程，我们得到：\n\n$$-r\
  \ u( i-1),j+1 + (2+2r) u(i ), j+1 - r u( i+1),j+1 = r u( i-1),j + (2-2r) u(i ),j\
  \ + r u( i+1),j \\quad (8.18)$$\n\n与之前的显式法不同（$r$ 需要小于 ½ 以保证收敛），此这里 $r$ 可以取任何值，因此可以任意选择\
  \ $\\Delta x$ 和时间间隔 $\\Delta t$。但较小的 $r$ 值会产生更准确的结果。\n\n从方程 (8.18) 可以看出，所有 $u$ 的项在左侧后缀均为\
  \ $j+1$，在右侧均为 $j$。这里 $j$ 代表时间。因此，在时间 $t+\\Delta t$ 时的 $u$ 值是根据上一个时间 $t+\\Delta t$\
  \ 的值计算出的。为了简化起见，假设 $r=1$，方程变为：\n\n$$-u( i-1),j+1 + 4u(i ), j+1 - u( i+1),j+1 = u(\
  \ i-1),j + u( i+1),j \\quad (8.19)$$\n\n#### 8.4.1 钢坯加热-隐式法\n\n附录提供了程序 `8.4.1` `SP_BilletHeat_Implicit.java`。\n\
