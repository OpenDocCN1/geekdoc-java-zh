  \    double df; double dff;\n    double yy ;\n\n    public double fn( double xx)\
  \ {\n        double A,B,C,D,h;\n        A=2; B=1; C=2.5; D=3;\n        double yy=A*xx\
  \ + B*Math.pow(xx,2) + C*Math.log(xx) +D ;\n        return yy ;\n    }\n\n    public\
  \ double dfn( double []y,double h) {\n        double df;\n        d1[1]= ((y[2])\
  \ -(y[1]));\n        d1[2]= ((y[3]) -(y[2]));\n        d1[3]= ((y[4]) -(y[3]));\n\
  \        d1[4]= ((y[5]) -(y[4]));\n        d1[5]=((y[6]) -(y[5]));\n        d2[1]=d1[2]-d1[1];\n\
  \        d2[2]=d1[3]-d1[2];\n        d2[3]=d1[4]-d1[3];\n        d2[4]=d1[5]-d1[4];\n\
