  \ Java 变量\n\n以下是 Java 中的变量类型：\n\n* 局部变量\n* 类变量（静态变量）\n* 实例变量（非静态变量）\n\n### byte\n\
  \n* `byte` 数据类型是 8 位有符号的补码整数\n* 最小值为 `-128` ($-2⁷$)\n* 最大值为 `127`（包含）($2⁷ -1$)\n\
  * 默认值为 `0`\n* `byte` 数据类型用于在大型数组中节省空间，主要代替整数，因为一个字节是整数的四分之一。\n* 示例：`byte a = 100`,\
  \ `byte b = -50`\n\n### short\n\n* `short` 数据类型是 16 位有符号的补码整数\n* 最小值为 `-32,768`\
  \ ($-2^{15}$)\n* 最大值为 `32,767`（包含） ($2^{15} -1$)\n* `short` 数据类型也可以像 `byte` 数据类型一样节省内存。`short`\
  \ 是整数的一半。\n* 默认值为 `0`。\n* 示例：`short s = 10000`, `short r = -20000`\n\n### int\n\n\
  * `int` 数据类型是 32 位有符号的补码整数。\n* 最小值为 `-2,147,483,648` ($-2^{31}$)\n* 最大值为 `2,147,483,647`（包含）\
  \ ($2^{31} -1$)\n* 除非有内存问题，否则 `Integer` 通常用作整数值的默认数据类型。\n* 默认值为 `0`\n* 示例：`int a\
  \ = 100000`, `int b = -200000`\n\n### long\n\n* `long` 数据类型是 64 位有符号的补码整数\n* 最小值为\
  \ `-9,223,372,036,854,775,808` ($-2^{63}$)\n* 最大值为 `9,223,372,036,854,775,807`（包含）\
  \ ($2^{63} -1$)\n* 当需要比 `int` 更宽的范围时使用此类型\n* 默认值为 `0L`\n* 示例：`long a = 100000L`,\
  \ `long b = -200000L`\n\n### float\n\n* `float` 数据类型是单精度 32 位 IEEE 754 浮点数\n* `float`\
  \ 主要用于在大型浮点数数组中节省内存\n* 默认值为 `0.0f`\n* `float` 数据类型绝不用于货币等精确值\n* 示例：`float f1 = 234.5f`\n\
  \n### double\n\n* `double` 数据类型是双精度 64 位 IEEE 754 浮点数\n* 此 `double` 数据类型通常用作小数值的默认数据类型，通常是默认首选\n\
  * `double` 数据类型绝不用于货币等精确值\n* 默认值为 `0.0d`\n* 示例：`double d1 = 123.4`\n\n### boolean\n\
  \n* `boolean` 数据类型表示一个位信息\n* 只有两个可能的值：`true` 和 `false`\n* 此 `boolean` 数据类型用于跟踪 `true/false`\
