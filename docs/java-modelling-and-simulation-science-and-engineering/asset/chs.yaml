  \n注意我们如何设置这四个方程，我们的程序为 `4.7.1`。附录提供了 `SLinerProg.java` 用于上述问题。\n\n### 4.7.3 应用：材料强度优化\n\
  假设碳钢强度 `Z` 取决于碳（`X1`）、锰（`X2`）含量以及冷加工（在室温下加工）`X3`，如下：\n\n```\n22X1 + 5.2X2 + 2.75X3\
