  \ `float` 替换为 `double` 或 `int` 来修改上述程序即可。\n\n# 1.7 Java 图形编程\n\n`Graphics` 类提供了用于绘制三种类型图形对象的方法：\n\
  \n1. 文本字符串：通过 `drawString()` 方法。请注意 `System.out.println()` 打印到系统控制台，而不是图形屏幕。\n2.\
  \ 矢量图形元素和形状：通过方法 `drawXxx()` 和 `fillXxx()` 实现，其中 `Xxx` 可以是 `Line`（线）、`Rect`（矩形）、`Oval`（圆）、`Arc`（弧）、`PolyLine`（折线）、`RoundRect`（圆矩形）或\
  \ `3DRect`（三维矩形）。\n3. 位图图像：通过 `drawImage()` 方法实现。\n\n## 1.7.1 java.awt.Graphics\n\
  \n`java.awt.Graphics` 是一个抽象类，因为实际的绘制操作取决于系统和设备。每个操作系统平台都会提供 `Graphics` 的子类来在该平台下执行实际绘制，但它们都符合\
  \ `Graphics` 中定义的规范。\n\n![1.7.1 object.jpg](img/00005.jpeg)\n\n## 1.7.2 图形形状的方法\n\
  \n不同图形的方法如图图 1.4 所示。\n\n![fig1.4.jpg](img/00006.jpeg)\n\n图 1.7.1 不同图形的方法\n\n## 1.7.3\
  \ 示例 SP_Graphics\n\n下面给出了一个图形程序的示例。\n\n示例程序 1.7.1 SP_Graphics.java：\n\n```java\n\
  1 import java.awt.*;\n2 import java.awt.Graphics;\n3 import java.awt.event.*;\n\
  4 import java.awt.geom.*;\n5\n6 public  class SP_Graphics extends Frame\n7\n8  public\
