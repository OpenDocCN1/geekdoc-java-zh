  \n# 第 6 章：人工神经网络建模\n\n## 6.1 人工神经网络 (ANN)\n\n人工神经网络（ANN）是一种非线性统计数据建模操作系统，可以通过使用大量的实验生成数据进行训练，来模拟输入输出变量之间的复杂关系。神经网络能够泛化学习过程中获得的经验。因此，模拟实验结果集中不存在的情况变得可能。图\
  \ 1 展示了如何从输入集计算输出。\n\n![fig6.1.jpg](img/00049.jpeg)\n\n## 6.2 方法\n\n人工神经网络（ANN）的步骤如下：\n\
  \n- 从实验数据或真实数据接收输入 `X1` `X2` …`Xp`\n- 输入通过带有“权重”的连接馈入\n- 总输入 = 所有源输入的加权之和\n- 传递函数（激活函数）将输入转换为输出\n\
  - 输出到其他神经元或环境\n\n如图 6.2 所示，可能有三种传递函数。ANN 由 (i) 神经网络的架构、(ii) 训练算法和 (iii) 传递函数组成。“神经网络架构”一术是指神经网络中的层数，即输入层、隐藏层和输出层，如图\
  \ 6.3 所示。输入层和输出层的神经元数量分别由输入和输出参数的数量决定。为了找到最佳架构，会尝试隐藏层中不同数量的神经元（图 6.3）。在输入层，每个神经元都有某些特定的信息输入，其数量等于系统独立输入参数的数量，以及一定数量的输出。输出参数通过将一组输入参数代入某个函数（传递函数的选择，见图\
  \ 2），并考虑相应的权重系数集来计算得出。为了找到最佳架构，会尝试隐藏层中不同数量的神经元。\n\n![fig6.2.jpg](img/00050.jpeg)\n\
  \n### 6.2.1 训练\n\nANN 需要训练才能运行，并能够泛化学习过程中获得的经验。通常，使用大量带有相应输出数据的输入（输入/输出对）来训练神经网络，通过调整与神经元之间每个连接（突触）相关的权重，使得特定的输入集尽可能地产生一组特定的目标输出。因此，预测实验结果集中不存在的情况变得可能。\n\
  \n给定架构，有权重待决定：\n`W = (W1, W2, …, W8)`\n\n训练数据：`(Yi , X1i)`\n\n\n\n\n\n![fig6.4.jpg](img/00052.jpeg)\n\
  \n![fig6.5.jpg](img/00053.jpeg)\n\n## 6.3 应用\n\n神经网络已成功应用于广泛的数据密集型应用中。以下列表基于真实的成功案例。\n\
  \n### 6.3.1 数据挖掘：\n\na. 材料属性的预测；\nb. 响应与系统建模识别；\nc. 时间序列分析、动态建模；\n\n### 6.3.2 能源\n\
  \na. 能源需求预测\nb. 天然气/煤炭指数价格预测\nc. 电力控制系统\n\n### 6.3.3 材料科学\n\na. 材料识别\nb. 化学系统分析\n\
  c. 工艺优化\n\n### 6.3.4 金融与营销\n\na. 股市预测\nb. 价格预测\nc. 销售预测\n\n## 6.4 应用与程序\n\nANN 建模是从给定的具有\
  \ `X` 变化的海量已知数据集中，寻找一系列输入 `x1`、`x2`、`x3` 等与输出 `y1`、`y2` 之间的数学关系。所有数据输入和输出都需要是无量纲的，且处于\
  \ (-1,1) 之间。所有 ANN 程序在初始化时会将输入、输出数据转换为 -1 到最大 +1 之间，这被称为 `Mapminimax`。现在在应用 ANN\
  \ 方法后，ANN 输出也将 (-1,1) 范围内的无量纲形式出现。这些需要通过反向 `Mapminimax` 回实数。\n\n以下程序展示了如何将数据转换为\
  \ (-1,1) 之间的无量纲数据，并将 ANN 输出转换回实数。\n\n程序 6.4.1 `SP_Mapminmax.java` 位于附录。\n\n### 运行程序\n\
  \n```\nInput array[] = new double[]{10, 11, 88, 2, 12, 120};\n```\n\n输出 Mapminimax\n\
  ```\n{ -0.864406779661017, -0.847457627118644, 0.4576271186440677, -1.0, -0.8305084745762712,\
  \ 1.0,}\n```\n\n反向 Mapminimax\n```\n{ 9.99 , 11.0 , 88.0, 2.0, 12.0, 120.0,}\n```\n\
