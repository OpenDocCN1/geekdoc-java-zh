- "# JAVA 建模与仿真：科学与工程\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n## 前言\n本书旨在通过对科学与工程实验数据及真实数据进行建模与仿真，针对真实系统的核心工程问题开发软件。本书将教你如何开发\
  \ Java 程序来预测材料性能、结构退化、通过线性规划优化工艺或成本、热体温度分布仿真、反应器内反应仿真，以及铸件凝固前面的移动仿真。这些建模与预测基于遗传算法、人工神经网络和有限元法。\n\
  \n本书面向科学与工程领域的学生和专业人士，涵盖了从入门到精通的水平。读者将学习如何为工厂或工程中的实际问题建立数学模型。他们将学习如何开发并理解实际工程过程的仿真，发现反应器内部实际发生的反应，以及如何控制过程以使产品质量和产量最大化。本书的先不仅适用于具有\
  \ Java 编程知识的人，也适用于有学习和开发欲望的初。\n\n第一章从 Java 编程的基础和基本知识开始并给出示例，随后是数值方法和计算，用于处理求解工程问题的建模方程。第三章介绍了建模与仿真的概念。第四章在学习编程的过程中，可以学习受多个影响参数限制的工艺或成本优化。第五章将通过遗传算法学习使用数据挖掘进行统计建模，以预测材料性能或腐蚀结构寿命预测；第六章将学习人工神经网络。第七章讨论并应用了有限元法来解决工程问题。第\
  \ 8、9、10 和第 11 章均为实际工程问题的应用。所有程序代码均位于附录第 12 章。书中提供了 Java 语言参考和一些实用程序。所有 Java 代码均通过\
  \ `JGrasp` 编译和运行。\n\n访问我的网站 [`sptech.xyz/`](http://sptech.xyz/) 了解更多关于建模与仿真的知识。你可以下载更多工程科学领域的程序和应用。学习如何开发基于窗口程序、图形和动画。\n\
