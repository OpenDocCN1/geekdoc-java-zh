  ### 循环控制语句\n\n1. `for`\n2. `while`\n3. `do-while`\n\n| 循环名称 | 语法 | 描述 |\n| :---\
  \ | :--- | :--- |\n| `for` | `for (exp1; exp2; expr3) { 语句; }` | `void main(){int\
  \ i;for(i=0;i<10;i++){System.out.print (\"%d \",i);}}` |\n| `while` | `while (condition)\
  \ { 语句; }` | `void main(){int i=3;while(i<10){System.out.print (\"%d\\n\",i);i++;}}`\
  \ |\n| `do while` | `do { 语句; } while (condition);` | `void main(){int i=1;do{System.out.print\
  \ (\"Value of i is %d\\n\",i);i++;}while(i<=4 && i>=2);` |\n\n#### while 与 do while\
  \ 循环的区别\n\n| while | do while |\n| :--- | :--- |\n| 只有当条件为真时执行循环。 | 无论条件如何都执行一次循环。在第一次执行循环后检查条件。\
  \ |\n\n# 布尔值表达式\n\nJava 有一种名为 `boolean` 的数据类型。注意以下点：\n\n*   可能值为 `true` 或 `false`。\n\
  *   `boolean` 可以与逻辑或按位运算符进行操作，但在数学上不能被视为 0 或 1。\n\n\n\n\n\n*   `boolean` 可以指定为方法的参数类型或返回值。\n\
  *   布尔值将打印为 `true` 或 `false`。\n\n# 复杂的布尔表达式\n\nJava 提供了用于 AND（与）和 OR（或）逻辑组合布尔值的运算符，以及对值进行取反（`NOT`\
  \ 操作）。注意：\n\n*   还有用于 AND、OR 和位取反（将所有 1 位改为 0 位，反之亦然）的位运算运算符。\n*   由于 `boolean`\
  \ 以一个比特的形式存储，因此位运算 AND 和位运算 OR 运算符将产生相同的逻辑结果，但应用方式不同（见下文）。\n*   由于某些原因，位取反操作不能应用于布尔值。\n\
  \n| 逻辑 | 位运算 | |\n| --- | --- | --- |\n| `&&` | 逻辑与 | `&` | 位逻辑与 |\n| `||` | 逻辑或\
  \ | `|` | 位逻辑或 |\n| `!` | 逻辑非 | `~` | 位逻辑非（位反反） |\n\n### 示例：\n\n| | 效果 |\n| ---\
  \ | --- |\n| 测试值是否在范围内 | |\n| `((a >= 0) && (a <= 10))` | 如果 `a` 在 0 到 10 之间，则为真；它必须满足两个条件\
  \ |\n| 测试值是否在范围之外 | |\n| `((a < 0) || (a > 10))` | 如果 `a` 在 0 到 10 范围之外，则为真；它可能在范围的下方或上方\
  \ |\n| `(!((a >= 0) && (a <= 10)))` | 反转对 `a` 在 0 到 10 之间的测试；因此 `a` 必须在范围之外而不是范围之内\
  \ |\n\n`&&` 和 `||` 操作被称为短路操作，因为如果第一个条件已经决定了最终结果，则不会求值第二个条件。\n\n要强制求值两个条件，请分别使用 `&`\
  \ 和 `|` 分别与和或。\n\n# 13.5 数组\n\n数组是属于相同数据类型的变量集合。\n\n#### 一维数组\n\n*   `int a[10];`\
  \ // 整数数组\n*   `char b[10];` // 字符数组，即字符串\n\n#### 二维数组\n\n`arr[0][1] = 20; arr[1][0]\
  \ = 30; arr[1][1] = 40;`\n\n#### 数组声明\n\n1D `int A[]= new int [10];` `float x[]=\
  \ new float [12];` 2D `double T[][]= new double [10][5];`\n\n# 13.6 Java 中的目录\n\n\
  目录是一个包含其他文件和其他目录列表的 `File`。你使用 `File` 对象来创建目录、列出目录中可用的文件。详细信息，请检查 `File` 对象可以调用的所有方法列表以及与目录相关的方法。\n\
  \n### 创建目录\n\n有两个实用的 `File` 工具方法可以用于创建目录：\n\n*   `mkdir()` 方法创建一个目录，成功时返回 true，失败返回\
  \ false。失败表示 `File` 对象指定的路径已存在，或者由于整个路径尚不存在而无法创建目录。\n*   `mkdirs()` 方法同时创建目录及其所有的父级目录。\n\
  \n以下示例创建 `/tmp/user/java/bin` 目录：\n\n```java\nimport java.io.File;\n\npublic class\
  \ CreateDir {\n  public static void main(String args[]) {\n      String dirname\
  \ = \"/tmp/user/java/bin\";\n      File d = new File(dirname);\n      // 现在创建目录。\n\
  \      d.mkdirs();\n  }\n}\n```\n\n### 列出目录\n\n你可以使用 `File` 对象提供的 `list()` 方法列出目录中所有的可用文件和目录：\n\
  \n```java\nimport java.io.File;\n\npublic class ReadDir {\n  public static void\
  \ main(String[] args) {\n      File file = null;\n      String[] paths;\n      try\
  \ {\n        // 创建新文件对象\n        file = new File(\"/tmp\");\n        // 文件和目录数组\n\
  \        paths = file.list();\n        // 路径数组中的每个名称\n        for(String path:paths)\
  \ {\n          // 打印文件名和目录名\n          System.out.println(path);\n      }\n    \
  \  } catch(Exception e) {\n        // 发生任何错误\n        e.printStackTrace();\n   \
  \   }\n  }\n}\n```\n\n这将根据 `/tmp` 中可用的目录和文件产生以下结果：\n```\ntest1.txt\ntest2.txt\n\
  ReadDir.class\n```\n\n## 13.7 Java 关键字\n\n以下列表显示了 Java 中的保留字。这些保留字不能用常量、变量或其他标识符。\n\
