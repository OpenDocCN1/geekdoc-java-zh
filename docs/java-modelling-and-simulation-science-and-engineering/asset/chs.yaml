  * `null`（唯一的引用字面量）\n\n### 整数字面量\n\n整数字面量可以用进制、八进制或十六进制表示。\n\n* 十进制：0-9\n* 八进制：以\
  \ `0` 开头\n* 十六进制：以 `0x` 开头\n\n示例：\n`int a = 100;` // 十进制\n`int b = 0144;` // 八进制（十进制）\n\
  `int c = 0x64;` // 十六进制（十进制）\n\n### 浮点字面量\n\n浮点字面量可以用小数或科学计数法表示。\n\n* 小数：包含小数点\n\
  * 科学计数法：使用 `e` 或 `E` 表示 10 的幂\n\n示例：\n`double d = 3.14;` // 小数\n`double e = 1.2e3;`\
  \ // 科学计数法（1200.0）\n\n### 字符字面量\n\n字符字面量包含在单引号中。\n\n* 普通字符：`char c = 'A';`\n* Unicode\
  \ 字符：`char c = '\\u0041';`\n* 转义序列：`char c = '\\n';`\n\n### 字符串字面量\n\n字符串字面量包含在双引号中。\n\
