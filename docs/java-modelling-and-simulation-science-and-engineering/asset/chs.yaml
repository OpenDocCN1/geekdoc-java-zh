  \n## 9.5 CO/CO2 在垂直反应器中还原 Fe2O3 的模拟\n\n将赤铁矿送入反应器，并以 `U` 摩尔/秒的固定速率通过 CO/CO2 气体混合物。气体混合物从底部上升，通过不同阶段的氧化物层，氧化物被逐渐还原，即\
  \ `Fe2O3`、`Fe3O4`、`FeO` 和 `Fe`。某层的平衡气组成由该层的温度决定。任何层的温度取决于进入气体的温度、向下移动的氧化物/金属的温度，以及放热和吸热反应产生的热量。所提模型如图\
  \ 9.9 和 9.10 所示。\n\n![fig9.9.jpg](img/00103.jpeg)\n\n### 9.5.1 简化\n\n最初为了简化模型，我们假设区域内的反应是在等温条件下发生的，且反应器壁完全绝热。让我们考虑任意一个区域，例如中间区域\
