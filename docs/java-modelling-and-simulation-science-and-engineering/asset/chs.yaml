  \ (��∂ 2u/��∂y2+ (��∂ 2u/��∂z2) = c( ��∂u/��∂t)      7.39\n```\n\n其中 `k` 是固体的导热系数，`c`\
  \ 是其比热，`` 是其密度，`u` 是关于距离 `x, y z` 和时间 `t` 的温度函数。对于一维热流，它可以被写为方程 7.40。\n\n```\n\
  (��∂ 2u/��∂x2 ) =k/c( ��∂u/��∂t)\n```\n\n![](img/00075.jpeg)\n\n```\n或 (��∂ 2u/��∂x2\
