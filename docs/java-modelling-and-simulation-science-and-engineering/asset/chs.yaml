  \n## 10.1 海洋环境中腐蚀钢结构的寿命预测\n通过计算机建模对数学关系未知的系统行为预测，是应用科学和工程进步的一个非常重要的方面。在这种情况下，需要一组实验或真实数据，通过数据的统计分析来预测属性或参数。\n\
  \n对于海洋环境中钢结构的寿命预测，对于设计和腐蚀工程师来说，无论是现有结构还是新建结构，都是一项具有挑战性的任务。海洋腐蚀速率是流体性质和海水化学性质许多参数的复杂函数。影响速率的主要参数有盐度、硫酸盐、碳酸氢盐、pH\
  \ 温度和溶解氧。这些参数的变化范围很大，取决于结构的地理位置以及结构部分浸没的海水深度。参数之间的相互关系使得建立数学方程变得非常困难。寻找一个结构退化速率最小的地理位置也是很有意义的。\n\
  \n### 10.1.1 遗传算法 (GA) 建模\n我们在第 5 章中学习了`GA`。它是解决已知很少问题的最佳方法之一。算法从一组解（由染色体表示）开始，称为种群。从一个种群中提取解并用于形成新的种群，以找到比旧种群更好的解。被选中形成新解（后代）的解根据其适应度进行选择——它们越合适，繁殖的机会就越大。该算法包含以下步骤：\n\
  \n1. 生成一个包含 `n` 个染色体（问题的合适解）的随机种群。\n2. 评价种群中每个染色体 `x` 的适应度 `f(x)`。\n3. 重复以下步骤创建一个新种群：\n\
  \    - **选择**：根据适应度从种群中选择两个父染色体。在轮盘赌选择中，个体被选中的概率与其适应度直接成正比（适应度越高，被选中的概率越大）。\n  \
  \  - **交叉**：以交叉概率，父代进行交叉形成新的后代。最常见的类型是单点交叉。如果没有执行交叉，后代将是父代的精确拷贝。\n    - **变异**：以变异概率，新后代在每个位点（染色体中的位置）发生变异。\n\
  \    - **接受**：将新后代放入新种群中。\n4. 使用新生成的种群进一步运行算法。\n5. **测试**：如果满足终止条件，则停止并返回当前种群中的最佳解；否则（循环）回到步骤\
  \ 2。\n\n应用遗传算法从氯离子、硫酸盐、`PH`、温度和溶解氧含量这五个基因的组合中获得最佳拟合染色体，以最小化目标函数（公式 5），该函数代表作为所有参数复杂函数的腐蚀速率。每个基因长度是一个六位编码二进制数，染色体长度为\
  \ 30 位二进制。基因的解码值受约束限制，基因 `Cl` 的解码最小值和最大值为 15-24，基因 `SO4`为 0.8 – 3.4，基因 `[O]`为 5-12，基因\
  \ `PH`为 4-8，基因 `temp`为 10-40。\n\n该算法由以下步骤组成：\n1. 测试每个染色体，查看其解决当前问题的效果如何，并据此分配适应度评分。适应度评分是衡量染色体优坏的指标。\n\
  2. 程序中有 600 个种群，每个种群包含 2000 代。从种群中选择两个成员。被选中的概率与染色体的适应度成比。使用了轮盘赌选择。为每个成员分配轮盘区域。\n\
  3. 每次选取两个染色体进行`交叉`，取决于交叉率。在这里沿长度选择一个随机点交换位点。选择了交叉率为 0.7。\n4. 接下来在变异阶段，染色体内的位点将发生翻转（0\
  \ 变 1，1 变 0）。变异率取了一个很小的值 0.001。\n5. 重复步骤 2、3 和 4，直到创建新种群。\n\n附录中给出了程序 `10.1.1 SP_GeneticCorrosion.java`。\n\
  \n```\n![](img/0107.jpeg)\n```\n\n找到的最佳拟合染色体 = `010001000111000011001101`\n代数：586\n\
  种群：2\n\n基因组合：\n* 基因 1：`Cl-`（二进制`010001`）解码为 17 g/L\n* 基因 2：`PH`（二进制`000111`）解码为\
  \ 7\n* 基因 3：`SO42`（二进制`000011`）解码为 g/L\n* 基因 4：`Temp`（二进制`001101`）解码为 13°C\n* 基因\
  \ 5：`[O]`（二进制`000101`）解码为 5 ppm\n\n最小腐蚀速率 `Icorr= 16.0225 µA/cm2`\n\n从上述结果可以看出，2000\
  \ 代的第一个种群未能产生所需的染色体。在第二个种群中，经过 586 代后，找到了最佳基因组合。因此，浓度为 17 g/L 氯离子、3 g/L 硫酸盐、溶解氧为\
  \ 5 ppm、pH 值为 7、温度为 13°C 的水性海洋环境对低碳钢产生 16.0225 µA/cm2 的最小腐蚀速率。在这些成分、pH 值和温度下进行了实验，得到的腐蚀速率为\
  \ 18.28 µA/cm2。\n\n### 10.2 通过 ANN 研究环境化学影响下的材料腐蚀行为\n\n\n\n\n全球海水水均具有腐蚀性，但浸没金属结构的降解过程强度各不相同，这取决于结构的地理位置。这是由于主要控制结构寿命的参数，如氯离子(`Cl-`)、硫酸根(`SO42-`)、碳酸氢根(`(HCO3-)`)、`pH`、温度(`T)`)、溶解氧\
  \ `[O]`，在不同的海洋、海水以及沿深度方向存在变化。我们将尝试通过构建人工神经网络（`ANN`）计算机模型，研究海水成分变化对降解速率的影响。\n\nANN\
  \ 建模涉及一组均匀的关联神经元。“它们中的每一个都具有某些信息输入，其数量等于系统独立输入参数的数量，并具有一定数量的输出，由此形成输出参数。在设计和训练神经网络时，必须考虑以下事宜：(i)\
  \ 神经网络架构，(ii) 训练算法以及 (iii) 传递函数。\n\nANN 建模的细节已在第 6 章中讨论。使用了一个输入层、一个隐藏层和一个输出层的通用结构。输入层和输出层的神经元数量分别由输入参数和输出参数的数量决定”（9\
  \ ）。\n\n### 数据输入\n\n选取五个输入神经元，即氯离子、硫酸根(`SO4 --`)、`pH`、碳酸氢根(`HCO3 -`)和温度来预测输出——腐蚀电流。\n\
  \n首先，我们构建输入矩阵 `p` 和输出矩阵 `q`\n\n```\np= [ Cl, SO4, O, pH, T ]\n```\n```\nt= [ Icorr\
  \ ]\n```\n\n其中 `Cl`、`SO4`、`O` 是在 `pH` 和温度 `T` 下海氯离子、硫酸根和溶解氧的浓度。\n\n`Icorr` 是海水中材料的腐蚀速率，以电化学腐蚀电流表示。\n\
