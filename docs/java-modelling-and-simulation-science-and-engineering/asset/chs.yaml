  \ `w` 变量中。\n\n例如，如果用户输入 `25.21` 作为第一个数字，`l=25.21`；输入 `12.62` 作为第二个数字，`w=12.62`。\n\
  \n### 1.2.3.7 计算 (Computation)\n\n执行问题的实际计算和数学部分。首先注意代码：\n\n```java\nfor(int i=1;i<=n;i++)\n\
  \    {      \n      v[i] =(float)(Math.PI*(Math.pow(d[i],2.0))/4) ;\n      nm[i]=(int)((l*w*h)/v[i]);\n\
