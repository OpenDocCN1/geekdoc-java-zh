  \ `purelin` 和训练函数 `traingd` 的神经元。\n5. 将生成模型的仿真。\n\n#### 10.2.2 仿真结果与腐蚀研究\n\n图 10.1\
  \ 和`fig 10.2` 是通过 matlab 编程生成的图形，用于海水化学性质对海洋钢结构降解速率和寿命影响的建模与仿真。\n\n![fig10.1.jpg](img/00108.jpeg)\n\
  \n![fig10.2.jpg](img/00109.jpeg)\n\n### 10.3 阴极保护的建模与仿真\n\n![fig10.3.jpg](img/00110.jpeg)\n\
  \n用于阴极保护的电位随距离增加而衰减，导致过保护和保护不足的问题。如果管道上点 A（图 10.3）施加保护电位，则 B 点的电位降低，C 点的电位进一步降低所需的电位以下。如果增加\
  \ A 点的电位，周围区域可能得到良好保护，但在 C 点保护不足而在 A 点过保护。\n\n控制电位衰减的多个变量（如化学性质、流体属性、温度、极化行为等）之间复杂的相互关系使得不存在简单的关系。已基于拉普拉斯方程以及随后的数值分析和通过可视化\
  \ `C++` 编程开发了模型。模型能够发现某些真实系统中的电位分布。\n\n该模型对于寻找已安装结构的电位分布非常有用，可以进行现场测试或腐蚀监测来获取一些输入数据。程序已在一个非常大的矩形表面上运行，以研究电位下降到什么程度。\n\
  \n### 10.3.1 模型简化\n\n模型将电解质体积划分为一个细密节点`NODES`网络，其电属性根据拉普拉斯方程通过一组方程相互关联。因此，在提供边界条件的情况下，数值技术和随后的计算机编程可以获得方程的解。\n\
  \n在电解质浓度均匀的假设下，阴极保护系统附近的电位电流分布由拉普拉斯方程控制\n\n```\n∆2Φ = 0\n```\n```\n对于 2D d2Φ/ dx2\
  \ + d2Φ/ dy2 = 0\n```\n\n其中 `Φ` 是介质的任何电属性。模型将电解质体积划分为一个细密节点`NODES`网络，其电属性根据拉普拉斯方程通过一组方程相互关联。因此，在提供边界条件的情况下，数值技术和随后的计算机编程可以获得方程的解。\n\
  \n### 10.3.2 边界条件\n\n通过求解拉普拉斯方程，可以获得边界处的电位，施加外加电流或牺牲阳极。为了找到其他节点的边界值，需要更多输入数据。基于第一原理欧姆定律找到了其他节点的边界值。\n\
  \n程序 `10.3.3.SP_CathodicProtection.java` 见附录\n\n###### 10.3.3 第一种模型的数据输入\n\n长度(m)=1000\
  \ 宽度(m)=0.5\n节点间距(m)=10，跨越周角的 30 度\n施加电位(mV)对比 Cu/SO4950\n排水点的 C.D.(mA/sq.m)10\n\
  介质电阻(ohm cm)=500\n精度水平 0.01\n\n输出\n迭代次数 55\n55 次迭代后不同节点的电位(mV)\n\n![fig10.4.jpg](img/00111.jpeg)\n\
  \n#### 10.3.4 第二种模型的数据输入\n\n该模型用于受阴极保护的管道。由于管道周边的曲率，电位分布是以沿曲面的角距离和沿长度的纵距离获得的。该模型也适用于真实的地下燃气管道\n\
  \n输入\n长度=500 m 直径(m)=0.45 m\n节点间距(长度) ~50m\n节点间距(角度) = 60°\n节点总数 44\n极化电位=950 m\
  \ V .\n涂层钢上的施加电流=50 (J.l m/m2)\n土壤电阻=1000 ohm cm\n\n#### 10.3.5 窗口化编程\n\n开发了如图 10.5\
  \ 所示的窗口化软件。数据输入到如图 10.5 所示的对话框中，并将生成如图 10.6 所示的带有电位分布的管道图形。这将指导设计工程师对腐蚀环境下的钢结构进行正确的阴极保护设计。根据上述电位变化的信息，对于工程师来说，为了实现良好的阴极保护而正确放置阳极连接将非常容易。\n\
  \n![fig10.5.jpg](img/00112.jpeg)\n\n\n\n\n相图是使用强度变量 `T` 和 `x` 在保持 `p` 恒定的情况下对系统平衡态的图示表示。可以使用热力学数据结合所有相关相的\
  \ `G` 计算平衡态。\n\n```\nG=XA GA +XB GB +ΔHmix −TΔ Smix                            \
  \         (11.1)\n```\n\n### 对于理想溶液\n```\nGid = XA GA +XB GB + RT( XA lnXA +XB lnXB)\
  \                                  (11.2) \n```\n\n### 对于正则溶液\n```\nGreg = XA GA\
  \ +XB GB + ΩXA XB +  RT( XA lnXA +XB lnXB)                (11.3) \n``` \n\n其中 `Ω`\
  \ 是正则溶液的过剩自由能系数。\n\n![fig11.1.jpg](img/00114.jpeg)\n\n## 11.2 节从吉布斯自由能构建相图\n\n生成二元体系\
  \ A-B 相图的步骤如下：\n\n1. 获取在 A 和 B 熔点之间不同温度下液线和固相线的自由能随成分变化的图谱。\n2. 获取固定温度下不同成分处固相线和液相线曲线的斜率（化学势）。\n\
  3. 寻找公切线点，使得液相线的斜率等于固相线的斜率。在该温度下可以得到相图的两个点。\n4. 对其他温度下的其他点重复步骤 1-3。绘制出完整的相图。\n\n\
  **注意：** 成分 A-B 可以是理想溶液，也可以是正则溶液。我将展示针对等晶体系和共晶体系正则溶液的程序代码。\n\n```\n∆G ( regular )=\
  \ XAGA +XBGB +ΩXAXB + RT( XAlnXA +XBlnXB)\n```\n\n### 11.2.1 二元等晶体系（具有无限溶解度的二元溶液）\n\
  \n附录中程序 `11.2.1 SP_PhaseDiagram.java`。\n\n**数据输入**\n* A 的熔点 `Ta=1685 K`；\n* B 的熔点\
  \ `Tb=1210.4 K`；\n* A 的熔变为 = 50.5 Kj/mole；\n* B 的熔变为 = 36.94 Kj/mole；\n* 正则溶液固态混合热系数\
  \ `e1=6.5`；\n* 正则溶液液态混合热系数 `e2=3.5`；\n\n![fig11.2.jpg](img/00115.jpeg) \n\n### 11.2.2\
  \ 二元共晶体系（具有互溶间隙的二元溶液）\n\n考虑一个体系，其中液相近似理想，但对于固相有 `ΔHmix > 0`。\n\n在低温下，存在一个区域，固溶溶以成分为\
  \ `X1` 和 `X2` 的两相 `α1` 和 `α2` 的混合最为稳定。该区域被称为互溶间隙。\n\n![fig11.3.jpg](img/00116.jpeg)\n\
  \n可以修改程序 `11.2.1 SP_PhaseDiagram.java` 以处理二元共晶体系中的互溶间隙。使用以下输入数据运行程序：\n\n**输入数据**\n\
  * A 的熔点 `Ta=800 K`；\n* B 的熔点 `Tb=1200 K`；\n* A 的熔变为 = 8.0 Kj/mole；\n* B 的熔变为 = 12\
  \ Kj/mole；\n* 正则溶液固态混合热系数 `e1=0`；\n* 正则溶液液态混合热系数 `e2=-2000`；\n\n使用上述数据生成共晶图（图, 11.4）。\n\
  \n![fig11.4.jpg](img/00117.jpeg)\n\n## 11.3 合金设计\n\n改进或开发改良合金具有反复的需求，其动力可能是：\n*\
  \ 性能驱动（例如：提高排气门的工作温度）\n* 成本驱动（例如：降低铸铁的成本）\n\n传统的试错法合金开发方法既昂贵又耗时。在复杂的多组分体系中，改进合金成分的路径可能显而易见。\n\
  \n计算热力学和动力学建模工具已取得显著进展：\n* 可用的改进的多组分体系模型\n* 可用的大型相平衡实验数据库用于比较和验证\n\n### 11.3.1 经验建模\n\
  \n用于建模和模拟需要大量合金成分与合金属性（如强度、硬度）对应的数据，这可以通过插值/外推法、遗传算法和神经网络完成。这种经验建模的主要特征如下：\n\n*\
  \ 使用现有的材料成分与其属性之间关系的数据库\n* 利用这些关系来识别具有所需属性的新成分\n* 曲线拟合、神经网络等。\n\n**缺点**\n* 需要访问大型数据库（成分/结构）\n\
  \n### 11.3.2 现象学建模\n\n这种经验建模的主要特征是[脆性](https://en.wikipedia.org/wiki/Fracture_toughness)断裂。\n\
  \n断裂韧性是一种描述材料在存在裂纹时抗[断裂](https://en.wikipedia.org/wiki/Fracture)能力的属性。它用 `Ic` 表示。下标\
  \ `I` 表示 I 型模式，因为材料可以被制成剪切（II 型）或撕裂（III 型）。\n\n## 11.4 合金开发\n\n应力因子 `(K)` 是断裂韧性的参数，决定了带有特定缺口的试样所承受的最大应力值。根据试样的载荷方向和厚度，使用了四种类型的应力因子：`KC`、`KIC`、`KIIC`\
  \ 和 `KIII`。\n\n* `KC`：试样厚度小于关键值的应力因子，取决于厚度。这种状态称为平面应力。\n* `KIC`、`KIIC`、`KIII`：对应试样厚度大于关键值的应力因子，因此\
  \ `KIC`、`KIIC` 和 `KIII` 的值不取决于试样厚度。这种状态称为平面应变。\n\n## 11.5 断裂韧性\n\n神经网络设计了 8 个输入神经元（`YS`\
  \ 屈服强度以及 C、Si、Mn、Mo、Ni、Cr、V 的成分）和一个输出 `KIC`（断裂韧性），使用 100 多组数据（附录-2）研究成分和屈服强度对断裂韧性的影响。\n\
  \n**程序**\n程序 `11.5.2 SP_Fracture.m` 使用 Matlab 编写而非 Java，代码见录。程序使用的断裂韧性数据见附录中的 A1\
  \ 表。\n\n**注意：** 任何疑问请学习 ANN 第 6 章。\n\n![fig11.7.jpg](img/00120.jpeg)\n![fig11.8.jpg](img/00121.jpeg)\n\
  ![fig11.9.jpg](img/00122.jpeg)\n![fig11.10.jpg](img/00123.jpeg)\n\n\n\n\n\n## 12.1\
