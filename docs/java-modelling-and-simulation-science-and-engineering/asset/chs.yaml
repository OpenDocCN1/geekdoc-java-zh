  熔金属在模具中的流动以及随后的固化控制着良好铸件的质量。当液态金属倒入模具腔时，它的热量会被吸收并通过模壁传递。在熔点处，对于纯金属和共晶合金，固化从模壁向热点区域逐层进行，并伴有体积收缩，从相邻层抽取熔金属，导致最后层固化处产生收缩孔。移动的等温固液界面被称为凝固前沿。热通量穿过固化的液体通过正在形成的固态层通过模具。凝固前沿的形状由模壁两侧的温度梯度控制。理解温度梯度凝固前沿的移动有助于预测收缩缺陷的类型和位置，并通过更好的冒口和浇口设计成功克服这些缺陷。\n\
