  Int i,n ;\nfloat d, v ; \ndouble V, X ;\n```\n\n**数组变量声明**\n\n如果 `d` 是一个数组，那么 `d`\
  \ 将拥有许多值 `d1`, `d2`, `d3` ……d10`，其声明方式如下：\n\n```java\nfloat d[]= new float[n];//\
  \ 其中 n 是数组的大小。\n```\n\n例如，如果我的计算中可能 `d` 值最大数量为 100，则 `n=100`：\n\n```java\nfloat\
  \ d[]= new float[100];\ndouble V[]= new double [100];\nint nm[]= new int [100];//球的数量\n\
  ```\n\n### 1.2.3.6 从用户处输入数据 (Input Data from the user)\n\n为此，你必须使用带有头文件 `import\
  \ java.util.Scanner` 的 `Scanner` 类。\n\n取的对象为 `inpData`。代码如下：\n\n```java\nScanner\
