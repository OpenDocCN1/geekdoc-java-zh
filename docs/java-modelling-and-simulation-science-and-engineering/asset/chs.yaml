  \ 9.6 所示。\n\n![fig9.6.jpg](img/00100.jpeg)\n\n为了说明这一点，我们将以一种常见的炉——例如炼铁高炉为例。下表说明了高炉中不同物种的质量输入和质量输出。\n\
  \n| | | 成分的物质平衡 |\n| :--- | :--- | Fe | C | O | 二氧化硅 | 石灰 |\n| 待装铁矿石 (x) | 产出的铁水\
  \ (W) | 存在 | 存在 | 存在 | 存在 | |\n| 待装焦炭 (y) | 渣 | 存在 | 存在 | 存在 | 存在 | 存在 |\n| 待装助剂：石灰岩\
  \ (z) | 排出的气体 (g) | | 存在 | 存在 | 存在 | 存在 |\n| 氧气作为氧化剂的空气 | | | | 存在 | | |\n\n我们可以对物质平衡中任何感兴趣的成分进行处理。因此，可能有\
  \ `n` 种成分，我们需要建立 `n` 个方程。为了简单起见，让我们只考虑铁、碳和二氧化硅三种成分的平衡，以建立以下 3 个方程：\n\n### 铁平衡\n\
  `α1*x+ α2*y+ α3*z=W* α4 + O* α5` (9.1)\n\n### 二氧化硅平衡：\n`β1*x+ β2*y+ β3*z= W*β4*(60/28)\
  \ + O* β5+ (L*z)/B` (9.2) (因子 `60/28` 是由于硅到二氧化硅的转化)\n\n### 碳平衡：\n`γ1*x+ γ2*y+ γ3*z=W*\
  \ γ4+O* γ5` (9.3)\n\n其中：\n- 铁矿石中铁的比例 (`α1`)；焦炭中铁的比例 (`α2`)；石灰岩中铁的比例 (`α3`)\n- 铁水中铁的比例\
  \ (`α4`)；废气中铁的比例 (`α5`)；铁矿石中二氧化硅的比例 (`β1`) \n- 焦炭中二氧化硅的比例 (`β2`)；石灰岩中二氧化硅的比例 (`β3`)；铁水中硅的比例\
  \ (`β4`)\n- 废气中硅的比例 (`β5`)；铁矿石中碳的比例 (`γ1`)；焦炭中碳的比例 (`γ2`)\n- 石灰岩中碳的比例 (`γ3`)；铁水\
  \ (`γ4`)\n\n附录中给程序 `SP_MaterialBalanace.java`，基于 `LU` 分解，用于根据数值方法第二章中的讨论，从 `n` 个方程中找到\
  \ `n` 个变量的未知解。同样，人们可以建立所有成分的总物质平衡。\n\n# 9.4 炉内热与物质平衡（高炉）\n\n物种的热输入和输出如示意图 9.7 所示。\n\
