  \ | 当两个条件都为真时，返回真 |\n| 2 | `||` | 逻辑或 | `(x>=10)\\||(y>=10)` | 当至少有一个条件为真时，返回真 |\n\
  | 3 | `!` | 逻辑非 | `!((x>5)&&(y<5))` | 反转操作数 `((x>5) && (y<5))` 的状态。如果 `((x>5) &&\
  \ (y<5))` 为真，逻辑非运算符使其变为为假 |\n\n# 递增/递减运算符\n\n递增运算符：`i ++`；如果 `i=1` 则变为 `2, 3, 4`\n\
  递减运算符：`i --`；如果 `i=20` 则变为 `19, 18, 17`\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| **示例**\
  \ | **效果** | **位模式** |\n| `&` | 按位与，使用与操作结合单个位，因此在结果值位位中，只有当两个操作数在该位上均为 1 时，该位才为\
  \ 1。 |\n| `int a = 2;` | 第 2 位被设置 | `0...00000010` |\n| `int b = 6;` | 第 2 位和 4\
  \ 位被设置 | `0...00000110` |\n| `int c = a & b;` | 结果为 2 | `0...00000010` |\n| `|`\
  \ | 按位或，使用或操作结合单个位，因此在结果值位中，如果任一操作数在该位上为 1，该位就为 1。 |\n| `int a = 2;` | 第 2 位被设置\
  \ | `0...00000010` |\n| `int b = 4;` | 第 4 位被设置 | `0...00000100` |\n| `int c = a\
  \ | b;` | 结果为 6 | `0...00000110` |\n| `^` | 按位异异 (XOR)，结合单个位，使得两个操作数中相同的任何位都产生 0，任何不同的位在相应位置产生\
  \ 1；这通常用于加密，因为对结果重复该操作将得到原始值。 |\n| `int a = 3;` | 第 1 位和 2 位被设置 | `0...00000011`\
  \ |\n| `int b = 6;` | 第 2 位和 4 位被设置 | `0...00000110` |\n| `int c = a ^ b;` | 结果为\
  \ 5 | `0...00000101` |\n| `int d = c ^ b;` | 结果为 3 | `0...00000011` |\n| `~` | 位取反。反转所有位的状态。\
  \ |\n| `int a = 0;` | 无位被设置 | `0...00000000` |\n| `int b = ~a;` | 所有位被设置 | `1...11111111`\
  \ |\n\n### 位移\n\n这些运算符在 32 位 int 值内左移或右移位（它们不与其他类型工作）。\n\n| 运算符 | 示例 | 效果 |\n| :---\
  \ | :--- | :--- |\n| `<<` | `int a = 4;` | 第 4 位被设置 |\n| | `int b = a << 2;` | 左移\
  \ 2 位 |\n| `>>` | `int a = -16;` | 右移位（右侧位移出，左侧补 1；结果位为 63） |\n| | `int b = a >>\
  \ 1;` | 右移 1 位 |\n| `>>>` | `int a = -1;` | 无符号右移位。 |\n| | `int b = a >>> 31;` |\
  \ 右移 31 位，补 0 |\n\n# 复合运算符\n\n将多个效果合并在一个操作中：计算并存储到内存。注意 `++` 和 `--` 可以位于变量前面或后面。如果在前面（前置），应用运算符然后使用结果值；如果在后面（后置），先获取变量的值，作为表达式的结果，然后应用运算符。\n\
  \n| 运算符 | 目的（执行的操作） |\n| :--- | :--- |\n| `++` | 递增变量 |\n| `--` | 递减变量 |\n| `+=`\
  \ | 给变量增加一个值 |\n| `-=` | 从变量中减去一个值 |\n| `*=` | 变量乘以一个值 |\n| `/=` | 变量除以一个值 |\n|\
  \ `%=` | 变量等于除后的余数 |\n| `&=` | 左右之间执行按位与，结果存储到左侧 |\n| `|=` | 左右之间执行按位或，结果存储到左侧 |\n\
  | `^=` | 左右之间执行按位异异，结果存储到左侧 |\n| `>>=` | 带符号扩展将变量位右移 |\n| `>>>=` | 不带符号扩展将变量位右移\
  \ |\n| `<<=` | 将变量位左移位 |\n\n### 复合运算符示例\n\n| 语句 | 结果 |\n| :--- | :--- |\n| `i++;`\
  \ | 递增 i |\n| `i--;` | 递减 i |\n| `j = i++;` | 获取 `i` 的当前值，作为表达式的结果，将其赋值给 `j`，然后递增\
  \ i |\n| `j = ++i;` | 递增 i，然后 `j = i` |\n| `x *= 3;` | `x = x * 3` |\n| `y -= z\
  \ + 5;` | `y = y - (z + 5)` |\n\n认证考试不可避免会要求理解后置递增或递减步骤的问题：尝试以下程序：\n\n## 13.4 控制语句\n\
