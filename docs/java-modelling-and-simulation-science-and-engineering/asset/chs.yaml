  \n\n\n\n关于 Java 语言和规则的更多信息，可以参考“Java 语言参考”章节。\n\n## 1.3.2 Java 虚拟机 (JVM)\n\nJava\
  \ 是平台独立的。与许多编程语言（包括 `C` 和 `C++`）不同，Java 在编译时并不会编译成特定平台的机器码，而是编译成平台无关的字节码。这些字节码通过网络分发，并在运行它的任何平台上由虚拟机（`JVM`）进行解释。\n\
  \n`JVM` 是 Java 程序运行的环境。它是实现在真实硬件和操作系统之上的软件。当源代码（`.java` 文件）被编译时，它会被翻译成字节码并放入（`.class`）文件中。`JVM`\
  \ 执行这些字节码。因此，Java 字节码可以被看作是 `JVM` 的语言。\n\n### 1.3.3 安装 Java\n\n你最多需要安装两件软件：Java\
  \ 开发工具包（`JDK`）和一个 Java 编辑器。首先，你需要从 Oracle 的以下网站下载并安装 `JDK`：\n\nhttp://www.oracle.com/technetwork/java/javase/downloads/jdk9-downloads-3848520.html\n\
  \n根据你的系统平台（windows、linux 等）选择并下载 `JDK`。\n\n`JDK` 是 `JRE`（Java 运行环境）的超集，它包含了 `JRE`\
  \ 中的所有内容，以及用于开发 applet 和应用程序所需的编译器、调试器等工具。`JRE` 提供了库、Java 虚拟机（`JVM`）以及运行用 Java 编程语言编写的\
  \ applet 和应用程序的其他组件。\n\n网上有不同的编辑器可用：`NetBeans`、`jGrasp`、`Eclipse`、`Jdeveloper`、`BlueJ`、`jCreator`\
  \ 等。每个编辑器都有自己的优点。根据你处理的建模问题类型，你可以选择合适的编辑器。在本书中，`JGRASP` 被用作 windows 10 平台的 Java\
  \ 编辑器，所有程序都由它运行。你可以通过以下链接下载 `JGRASP`：\n\nhttp://spider.eng.auburn.edu/user-cgi/grasp/grasp.pl?;dl=download_jgrasp.html\n\
  \nhttp://jgrasp.software.informer.com/download/\n\n## 1.4 Java 包 (Package)\n\n如果一种常用的程序要在许多其他应用程序中使用，那么该程序在编码时会在顶部标明包名，并保存在包文件夹中。每当有其他应用程序程序需要该包程序时，只需使用\
  \ `Import 包名;` 即可调用该包程序。例如，各种科学和工程应用都需要图形，因此可以编写一个带有数据输入数组 `x[]`、`y[]` 的通用图形程序，并将其保存在包中，如下一节\
  \ 1.5.1 示例所示。\n\n在 Java 中使用包是为了防止命名冲突、控制访问、使类、接口、枚举和注解的搜索/定位及使用变得更加简单等。\n\n包（Package）可以定义为相关类型（类、接口、枚举和注解）的组合，提供访问保护和命名空间管理。\n\
  \nJava 中现有的一些包包括——：\n\n*   `java.lang` – 封装了基础类\n*   `java.io` – 用于输入、输出函数的类被封装在这个包中\n\
  \n程序员可以定义自己的包来封装一组类/接口等。将你所实现的相关的类进行分组是一是一种良好的习惯，这样程序员就可以轻松判断出这些类、接口、枚举和注解是相关的。\n\
  \n由于包创建了新的命名空间，因此与其他包中的名称不会发生任何冲突。使用包可以更容易提供访问控制，也更容易定位相关的类。\n\n### 1.4.1 创建包\n\n\
  通常，一些在许多其他应用程序中频繁使用的常用程序会被保存在包中，这样每当应用程序需要此类程序时，就不需要在应用程序中重新编码了。例如，许多其他应用程序中可能需要找到数据数组的最大值或最小值。同样，在许多应用程序中可能频繁需要绘制数组\
  \ `x[]` 对 `y[]` 的图表。\n\n在当前示例中，`SP_MaxMin.java` 编码如下并保存在 `sp_package` 中。\n\n包语句（package\
  \ statement）应该是源文件的第一行。每个源文件中只能有一个包语句，并且它适用于文件中的所有类型。程序应该保存在名为“包名”的文件夹中。\n\n###\
  \ 示例\n\n让我们来看创建一个名为 `sp_package` 包的示例。使用小写字母命名包名是一种良好的习惯，可以避免与类和接口名称发生冲突。\n\n程序\
  \ 1.4.1 `SP_MaxMin.java`\n\n```\npackage sp_package;\n\nimport java.util.Scanner;\n\
  import java.io.*;\nimport java.math.*;\nimport java.util.*;\n\npublic class SP_MaxMin\n\
  {\n    // Max value\n    public static double getMax(double[]x)\n    {\n       \
  \ double maxValue = x[0];\n        for(int i=1; i<x.length; i++)\n        {\n  \
  \          if(x[i] > maxValue)\n            {\n                maxValue = x[i];\n\
  \            }\n        }\n        return maxValue;\n    }\n\n    // Min value\n\
  \    public static double getMin(double[] x)\n    {\n        double minValue = x[0];\n\
  \        for(int i=1; i<x.length; i++)\n        {\n            if(x[i] < minValue)\n\
  \            {\n                minValue = x[i];\n            }\n        }\n   \
  \     return minValue;\n    }\n}\n```\n\n注意：提供的原始代码存在语法错误（缺少 `i<x.length` 以及括号错误），我在逻辑上对其进行了清理，使其成为有效的\
  \ Java 结构。\n\n程序 1.4.2 `SP_ReadPackage.java`\n\n```\npackage sp_package;\n\nimport\
  \ java.util.Scanner;\nimport java.io.*;\nimport java.math.*;\nimport java.util.*;\n\
  \npublic class SP_ReadPackage\n{\n    public static void main(String args[])\n \
  \   {\n        SP_MaxMin mn = new SP_MaxMin();\n        double x[] = {4.5, 2.3,\
  \ 100.56, 45.23};\n        double max= mn.getMax(x);\n        double min= mn.getMin(x);\n\
  \        System.out.println(\"max=\"+max+\" min=\"+min);\n    }\n}\n```\n\n程序输出：max=100.56\
  \ min=2.3\n\n## 1.5 Java 中的 Jar 文件\n\nJAR（Java Archive）是一种用于将许多类文件以及相关的元数据和资源（文本、图像等）聚合到一个文件中以分发应用程序或库。简单来说，JAR\
  \ 文件是包含压缩版本的 `.class` 文件、音频文件、图像文件或目录的文件。我们可以将 `.jar` 文件想象成使用 WinZip 软件创建的压缩文件（`.zip`）。即使是使用\
  \ WinZip 软件也可以提取 `.jar` 的内容。因此，你可以将它们用于无损数据压缩、归档、解压缩和归档提取。\n\nJAR 是唯一能处理音频和图像文件以及类文件的格式。开放标准、完全可扩展并用\
  \ Java 编写。打包 Java applet 组件的首选方式。\n\n在 Applet 中的示例：\n\n```html\n<applet code=Animator.class\
  \ archive=\"jars/animator.jar\" (archive=\"classes.jar, images.jar , sounds.jar\"\
  ) width=460 height=160>\n    <param name=\"foo\" value=\"bar\">\n</applet>\n```\n\
  \n## 1.6 Java - 文件与 I/O\n\n`java.io` 包包含了 Java 中可能需要的用于执行输入和输出（I/O）的所有类。这些流都代表一个输入源和一个输出目标。`java.io`\
  \ 包中的流支持许多数据，如基本数据类型、对象、本地化字符等。\n\n### 1.6.1 流 (Stream)\n\n流可以定义为数据序列。流有两种类型——\n\
  \n\n\n\n\n*   `InputStream` - `InputStream` 用于从数据源读取数据。\n*   `OutputStream` - `OutputStream`\
  \ 用于向目标写入数据。\n\nJava 为文件和网络相关的 I/O 提供了强大且灵活的支持，但本教程仅涵盖与流和 I/O 相关的基本功能。我们将逐一查看最常用的示例：\n\
  \n## 1.6.2 字节流\n\nJava 字节流用于执行 8 位字节的输入和输出。虽然有很多与字节流相关的类，但最常用的类是 `FileInputStream`\
  \ 和 `FileOutputStream`。以下是一个示例，它利用这两个类将输入文件复制到输出文件——\n\n## 标准流\n\n所有编程语言都提供标准 I/O\
  \ 支持，用户程序可以从键盘获取输入并在计算机屏幕上产生输出。如果你熟悉 C 或 C++ 编程语言，那么你一定知道三个标准设备 `STDIN`、`STDOUT`\
  \ 和 `STDERR`。同样，Java 提供了以下三个标准流——\n\n*   **标准输入 (Standard Input)** - 用于向用户程序提供数据，通常使用键盘作为标准输入流并表示为\
  \ `System.in`。\n*   **标准输出 (Standard Output)** - 用于输出用户程序产生的数据，通常使用计算机屏幕作为标准输出流并表示为\
  \ `System.out`。\n*   **标准错误 (Standard Error)** - 用于输出用户程序产生的错误数据，通常使用计算机屏幕作为标准错误流并表示为\
  \ `System.err`。\n\n以下是一个简单的程序，它创建 `InputStreamReader` 来读取标准输入流，直到用户输入 \"q\"—\n\n\
  ## 1.6.3 读取和写入文件\n\n如前所述，流可以被定义为数据的序列。`InputStream` 用于从数据源读取数据，而 `OutputStream`\
  \ 用于向目标写入数据。\n\n### 1.6.3.1 FileInputStream\n\n此流用于从文件中读取数据。可以使用 `new` 关键字创建对象，并有几种类型的构造函数可用。\n\
  \n以下构造函数接受字符串类型的文件名来创建一个输入流对象以读取文件——\n\n```\nInputStream f = new FileInputStream(\"\
  C:/java/hello\");\n```\n\n以下构造函数接受一个文件对象来创建一个输入流对象以读取文件。首先我们使用 `File()` 方法创建一个文件对象，如下：\n\
  \n```java\nFile f = new File(\"C:/java/hello\");\nInputStream f = new FileInputStream(f);\n\
  ```\n\n一旦你拿到了 `InputStream` 对象，就有一系列辅助方法可以用于读取流或对流执行其他操作。\n\n| 序号 | 方法与描述 |\n| :---\
  \ | :--- |\n| 1 | `public void close() throws IOException{}` 此方法关闭文件输出流。释放任何与文件相关的系统资源。抛出\
  \ `IOException`。 |\n| 2 | `protected void finalize()throws IOException {}` 此方法清理与文件的连接。确保当没有更多对此流的引用时，调用此文件输出流的\
  \ `close` 方法。抛出 `IOException`。 |\n| 3 | `public int read(int r)throws IOException{}`\
  \ 此方法从 `InputStream` 读取指定的字节数据。返回一个 `int`。返回下一个字节数据，如果是文件末尾，则返回 -1。 |\n| 4 | `public\
  \ int read(byte[] r) throws IOException{}` 此方法从输入流中读取 `r.length` 个字节到数组中。返回读取的字节总数。如果是文件末尾，将返回\
  \ -1。 |\n| 5 | `public int available() throws IOException{}` 提供可以从此文件输入流读取的字节数。返回一个\
  \ `int`。 |\n\n还有其他重要的流，更多细节可以参考以下链接——\n*   [ByteArrayInputStream](https://www.tutorialspoint.com/java_bytearraystream.htm)\n\
  *   [DataInputStream](https://www.tutorialspoint.com/java_datinputstream.htm)\n\n\
  ### 数据数组：文件中保存数据并从同一文件读取数据\n\n在执行工程问题时，你可能需要将数据数组（float 或整数类型）保存到文件中，并在以后通过调用文件和读取数据来重用这些数据。以下两个示例说明了将\
