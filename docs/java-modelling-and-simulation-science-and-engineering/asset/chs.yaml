  \n## 1.10 Java 时间函数\n\n### 睡眠某段时间 `Thread.sleep()` 当前 `Date()`\n你可以睡眠从毫秒到寿命的任何时间。例如，以下程序将产生当前时间，它睡眠\
  \ 10 秒 − 程序 1.10.1 `SP_Timefn.java`\n```java\nimport java.util.*;\npublic class\
  \ SP_Timefn {\n    public static void main(String args[]) {\n        try {\n   \
  \         System.out.println(new Date() + \"\\n\");\n            Thread.sleep(10000);\n\
  \            System.out.println(new Date() + \"\\n\");\n        } catch (Exception\
  \ e) {\n            System.out.println(\"发生异常!\");\n        }\n    }\n}\n```\n输出：\n\
  Mon Mar 12 19:46:51 2018 (10 秒)\nMon Mar 12 19:47:01 2018\n\n以下程序将产生时间差 程序 1.10.2\
  \ `SP_TimeDiff.java`\n```java\nimport java.util.*;\npublic class SP_TimeDiff {\n\
  \    public static void main(String[] args[]) {\n        try {\n            long\
  \ start = System.currentTimeMillis();\n            System.out.println(new Date()\
  \ + \"\\n\");\n            Thread.sleep(5*1000);\n            System.out.println(new\
  \ Date() + \"\\n\");\n            long end = System.currentTimeMillis();\n     \
  \       long diff = end - start;\n            System.out.println(\"差值为 : \" + diff);\n\
  \        } catch (Exception e) {\n            System.out.println(\"发生异常!\");\n \
