  \        d4[1]=d3[2]-d3[1];\n        d4[2]=d3[3]-d3[2];\n        d5[1]=d4[2]-d4[1];\n\
  \        df=(d1[1]-d2[1]/2 +d3[1]/3 -d4[1]/4 + d5[1])/h;\n        return df ;\n\
  \    }\n\n    public double ddfn( double []y,double h) {\n        double ddf;\n\
  \        d1[1]= ((y[2]) -(y[1]));\n        d1[2]= ((y[3]) -(y[2]));\n        d1[3]=\
