  \        d3[3]=d2[4]-d2[3];\n        d4[1]=d3[2]-d3[1];\n        d4[2]=d3[3]-d3[2];\n\
  \        d5[1]=d4[2]-d4[1];\n        ddf=(d2[1]-d3[1] + (11/12)*d4[1] -(5/6)*d5[1])/(Math.pow(h,2));\n\
  \        return ddf ;\n    }\n\n    public static void main(String[] args) {\n \
  \       double x[]= new double[150];\n        double y[]= new double[150];\n   \
