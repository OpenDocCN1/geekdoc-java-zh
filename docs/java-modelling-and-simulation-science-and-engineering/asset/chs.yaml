  import java.util.Scanner;\nimport java.math.*;\n\npublic class SRP_Simplex {\n \
  \   private double[][] tableaux; // 裸形\n    private int numberOfConstraints; //\
  \ 约束数量\n    private int numberOfVariables; // 变量数量\n    private boolean maximizeOrMinimize;\n\
  \    private static final boolean MAXIMIZE = true;\n    private static final boolean\
  \ MINIMIZE = false;\n    private int[] basis; // basis[i] 对应行的基变量\n\n    public\
  \ SRP_Simplex(double[][] tableaux, int numberOfConstraint, int numberOfVariable,\
  \ boolean maximizeOrMinimize) {\n        this.maximizeOrMinimize = maximizeOrMinimize;\n\
  \        this.numberOfConstraints = numberOfConstraint;\n        this.numberOfVariables\
  \ = numberOfVariable;\n        this.tableaux = tableaux;\n        basis = new int[numberOfConstraints];\n\
  \        for (int i = 0; i < numberOfConstraints; i++)\n            basis[i] = numberOfVariables\
  \ + i;\n        solve();\n    }\n\n    // 从初始可行基 (BFS) 开始运行单纯法算法\n    private void\
  \ solve() {\n        while (true) {\n            show();\n            int q = 0;\n\
  \            // 寻找入列\n            if (maximizeOrMinimize) {\n                q =\
  \ dantzig();\n            } else {\n                q = dantNegative();\n      \
  \      }\n            if (q == -1)\n                break; // 最优\n            //\
  \ 寻找离开行\n            int p = minRatioRule(q);\n            if (p == -1)\n      \
  \          throw new ArithmeticException(\"无界形\");\n            // 旋转\n        \
  \    pivot(p, q);\n            // 更新基\n            basis[p] = q;\n        }\n  \
  \  }\n\n    // 成本最大的非基列索引\n    private int dantzig() {\n        int q = 0;\n   \
  \     for (int j = 1; j < numberOfConstraints + numberOfVariables; j++)\n      \
  \      if (tableaux[numberOfConstraints][j] > tableaux[numberOfConstraints][q])\n\
  \                q = j;\n        if (tableaux[numberOfConstraints][q] <= 0)\n  \
  \          return -1; // 最优\n        return q;\n    }\n\n    // 成本最负的非基列索引\n   \
  \ private int dantNegative() {\n        int q = 0;\n        for (int j = 1; j <\
  \ numberOfConstraints + numberOfVariables; j++)\n            if (tableaux[numberOfConstraints][j]\
  \ < tableaux[numberOfConstraints][q])\n                q = j;\n        if (tableaux[numberOfConstraints][q]\
  \ >= 0)\n            return -1; // 最优\n        return q;\n    }\n\n    // 使用比例法则寻找行（如果没有这样的行则返回\
  \ -1）\n    private int minRatioRule(int q) {\n        int p = -1;\n        for (int\
  \ i = 0; i < numberOfConstraints; i++) {\n            if (tableaux[i][q] <= 0)\n\
  \                continue;\n            else if (p == -1)\n                p = i;\n\
  \            else if ((tableaux[i][numberOfConstraints + numberOfVariables] / tableaux[i][q])\
  \ < (tableaux[p][numberOfConstraints + numberOfVariables] / tableaux[p][q]))\n \
  \               p = i;\n        }\n        return p;\n    }\n\n    // 使用高斯-若旦法在\
  \ (p, q) 处旋转\n    private void pivot(int p, int q) {\n        // 除 p 行和 q 列\n  \
  \      for (int i = 0; i <= numberOfConstraints; i++) {\n            for (int j\
  \ = 0; j <= numberOfConstraints + numberOfVariables; j++) {\n                if\
  \ (i != p && j != q)\n                    tableaux[i][j] -= tableaux[p][j] * tableaux[i][q]\
  \ / tableaux[p][q];\n            }\n        }\n        // q 列置零\n        for (int\
  \ i = 0; i <= numberOfConstraints; i++) {\n            if (i != p)\n           \
  \     tableaux[i][q] = 0.0;\n        }\n        // p 行缩放\n        for (int j = 0;\
  \ j <= numberOfConstraints + numberOfVariables; j++) {\n            if (j != q)\n\
  \                tableaux[p][j] /= tableaux[p][q];\n        }\n        tableaux[p][q]\
  \ = 1.0;\n    }\n\n    // 返回最优目标值\n    public double value() {\n        return -tableaux[numberOfConstraints][numberOfConstraints\
  \ + numberOfVariables];\n    }\n\n    // 返回解向量\n    public double[] solution() {\n\
  \        double[] x = new double[numberOfVariables];\n        for (int i = 0; i\
  \ < numberOfConstraints; i++) {\n            if (basis[i] < numberOfVariables)\n\
  \                x[basis[i]] = tableaux[i][numberOfConstraints + numberOfVariables];\n\
  \        }\n        return x;\n    }\n\n    // 打印裸形\n    public void show() {\n\
  \        System.out.println(\"M = \" + numberOfConstraints);\n        System.out.println(\"\
  N = \" + numberOfVariables);\n        for (int i = 0; i <= numberOfConstraints;\
  \ i++) {\n            for (int j = 0; j <= numberOfConstraints + numberOfVariables;\
  \ j++) {\n                System.out.printf(\"%7.2f \", tableaux[i][j]);\n     \
  \       }\n            System.out.println();\n        }\n        System.out.println(\"\
  value = \" + value());\n    }\n}\n```\n\n\n\n\n\n```java\nSystem.out.println(\"\
