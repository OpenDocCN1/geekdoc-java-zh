  \ `FileNotFoundException`，编译器会提示程序员处理该异常。\n\n### 示例\n\n```java\nimport java.io.File;\n\
  import java.io.FileReader;\n\npublic class FilenotFound_Demo {\n  public static\
  \ void main(String args[]) {\n    File file = new File(\"E://file.txt\");\n    FileReader\
  \ fr = new FileReader(file);\n  }\n}\n```\n\n如果你尝试编译上述程序，你将得到以下异常。\n\n### 输出\n\n\
  ```\nC:\\>javac FilenotFound_Demo.java\nFilenotFound_Demo.java:8: error: unreported\
  \ exception File Not Found Exception; must be caught or declared to be thrown\n\
  \      FileReader fr = new FileReader(file);\n                            ^\n1 error\n\
  ```\n\n注意 − 由于 `FileReader` 类的 `read()` 方法和 `close()` 方法会抛出 `IOException`，你可以观察到编译器通知处理\
  \ `IOException`，以及 `File Not Found Exception`。\n\n- **未检查异常（Unchecked exceptions）**\
  \ − 未检查异常是在执行期间发生的异常。这些异常也被称为 `Runtime Exceptions`（运行时异常）。它们包含了编程错误，例如逻辑错误或对 API\
  \ 的使用不当。`Runtime exceptions` 在编译时会被忽略。\n\n例如，如果你在程序中声明了一个大小为 5 的数组，并尝试调用数组的第 6 个元素，则会发生\
  \ `Array Index Of Bounds Exception`。\n\n### 示例\n\n```java\npublic class Unchecked_Demo\
  \ {\n  public static void main(String args[]) {\n    int num[] = {1, 2, 3, 4};\n\
  \    System.out.println(num[5]);\n  }\n}\n```\n\n如果你编译并执行上述程序，你将得到以下异常。\n\n### 输出\n\
  \n```\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: 5\n\
  at Exceptions.Unchecked_Demo.main(Unchecked_Demo.java:8)\n```\n\n- **错误（Errors）**\
  \ − 这些完全不是异常，而是产生于用户或程序员控制之外的问题。错误在你的代码中通常被忽略，因为你几乎无法对错误做任何事情。例如，如果发生了栈溢出（stack\
  \ overflow），就会产生一个错误。它们在编译时也会被忽略。\n\n## 1.8.2 异常层次\n\n所有异常类都是 `java.lang.Exception`\
  \ 类的子类型。异常类是 `Throwable` 类的子类。除了异常类外，还有一个名为 `Error` 的子类，它派自 `Throwable` 类。\n\n错误是在严重故障时发生的异常情况，这些不会被\
  \ Java 程序处理。错误的产生表示由运行时环境产生的错误。例如：`JVM` 内存溢。通常情况下，程序无法从错误中恢复。`Exception` 类有两个主要的子类：`IO\
  \ Exception` 类和 `Runtime Exception Class`。\n\n![1.8.1 java excep.jpg](img/00010.jpeg)\n\
  \n以下是常见的 Java 内置检查异常和未检查异常的列表。\n\n## 1.8.3 异常方法\n\n以下是 `Throwable` 类中提供的重要方法列表。\n\
  \n| 序号 | 方法与描述 |\n| :--- | :--- |\n| 1 | `public String getMessage()` 返回有关已发生异常的详细消息。此消息在\
  \ `Throwable` 构造函数中初始化。 |\n| 2 | `public Throwable getCause()` 返回由 `Throwable` 对象表示的异常原因。\
  \ |\n| 3 | `public String toString()` 返回类名与 `getMessage()` 的结果连接起来。 |\n| 4 | `public\
  \ void printStackTrace()` 将 `toString()` 的结果以及堆栈轨迹打印到 `System.err`（错误输出流）。 |\n|\
  \ 5 | `public StackTraceElement [] getStackTrace()` 返回一个包含堆栈轨迹中每个元素的数组。索引 0 处的元素表示调用栈的顶端，数组中的最后一个元素表示调用栈底部的方法。\
  \ |\n| 6 | `public Throwable fillInStackTrace()` 用当前堆栈轨迹填充此 `Throwable` 对象的堆栈轨迹，添加到堆栈轨迹中的任何之前信息中。\
  \ |\n\n### 1.8.3.1 捕获异常\n\n方法使用 `try` 和 `catch` 关键字的组合来捕获异常。`try/catch` 块放在可能生成异常的代码周围。`try/catch`\
  \ 块中的代码被称为受保护代码，使用 `try/catch` 的语法如下如下\n\n### 语法\n\n```java\ntry {\n  // 受保护代码\n\
  }catch(ExceptionName e1) {\n  // 捕获块\n}\n```\n\n容易发生异常的代码放在 `try` 块中。当发生异常时，该异常将由与之相关的\
  \ `catch` 块处理。每个 `try` 块后面都应该紧跟一个 `catch` 块或 `finally` 块。\n\n`catch` 语句涉及声明你尝试捕获的异常类型。如果受保护代码中发生异常，将检查\
  \ `try` 之后的 `catch` 块（或块）。如果发生的异常类型列在 `catch` 块中，异常将传递给 `catch` 块，就像参数传递给方法参数一样。\n\
  \n## 1.8.4 示例\n\n以下是一个声明了 2 个元素 `a[0]` 和 `a[1]` 的数组，尝试访问数组的第 6 个元素会发生异常。\n\n程序 `SP_ExcepTest.java`\n\
  \n```java\nimport java.io.*;\nimport java.util.Scanner;\n\npublic class SP_ExcepTest\
  \ {\n  public static void main(String args[]) {\n    double a[] = new double [2];\n\
  \    a[0]=1; a[1]=3.2;\n    try {\n      System.out.println(\"Access element three\
  \ :\" + a[3]);\n    } catch(ArrayIndexOutOfBoundsException e) {\n      System.out.println(\"\
  Exception thrown :\" + e);\n    }\n    System.out.println(\"Out of block\");\n \
  \ }\n}\n```\n\n这将产生以下结果\n\n```\nException thrown :java.lang.ArrayIndexOutOfBoundsException:\
  \ 3\nOut of block\n```\n\n## 1.8.5 多个捕获块\n\n`try` 块可以跟随多个 `catch` 块。多个 `catch` 块的语法如下：\n\
  \n### 语法\n\n```java\ntry {\n  // 受保护代码\n}\ncatch(ExceptionType1 e1) {\n  // 捕获块\n\
  }\ncatch(ExceptionType2 e2) {\n  // 捕获块\n}\ncatch(ExceptionType3 e3) {\n  // 捕获块\n\
  }\n```\n\n前面的语句演示了三个 `catch` 块，但你可以在 `try` 后面跟跟任意数量的块。如果受保护代码中发生异常，异常将传递给列表中的第一个\
  \ `catch` 块。如果异常类型匹配 `ExceptionType1`，则在那里被捕获。如果不是，异常将传递到第二个 `catch`。这种情况持续到异常被捕获或用完所有\
  \ catch，此时当前方法停止并将异常传递到调用栈上的上一个方法。\n\n## 1.8.6 Finally 块\n\n`finally` 块跟随 `try`\
  \ 块或 `catch` 块。`finally` 块的代码无论是否发生异常都会执行。使用 `finally` 块允许你运行任何你想执行的清理语句，无论保护代码发生了什么。\n\
  \n`finally` 块出现在 `catch` 块的末尾并具有如下语法：\n\n### 语法\n\n```java\ntry {\n  // 受保护代码\n\
  }\ncatch(ExceptionType1 e1) {\n  // 捕获块\n}\ncatch(ExceptionType2 e2) {\n  // 捕获块\n\
  }\ncatch(ExceptionType3 e3) {\n  // 捕获块\n}\nfinally {\n  // finally 块始终执行。\n}\n\
  ```\n\n### 示例\n\n程序 `SP_ExcepTest2.java`\n\n```java\nimport java.io.*;\nimport java.util.Scanner;\n\
  \npublic class SP_ExcepTest2 {\n  public static void main(String args[]) {\n   \
  \ double a[] = new double [2];\n    a[0]=1; a[1]=3.2;\n    try {\n      System.out.println(\"\
  Access element three :\" + a[3]);\n    } catch(ArrayIndexOutOfBoundsException e)\
  \ {\n      System.out.println(\"Exception thrown :\" + e);\n    }\n    finally {\n\
  \      a[0] = 6;\n      System.out.println(\"First element value: \" + a[0]);\n\
  \      System.out.println(\"The finally statement is executed\");\n    }\n  }\n\
  }\n```\n\n\n\n\n\n```java\n      }\n  }\n}\n```\n\n这将产生以下结果 −\n\n### 输出\n抛出异常：`java.lang.ArrayIndexOutOfBoundsException`:\
  \ 3\n第一个元素值: 6\nfinally 语句已执行\n\n注意以下几点 −\n- 没有 `try` 语句不能存在 `catch` 子句。\n- 当存在\
  \ `try/catch` 块时，并不强制要求有 `finally` 子句。\n- `try` 块在没有 `catch` 子句或 `finally` 子句的情况下不存在。\n\
  - `try`, `catch`, `finally` 块之间不能包含任何代码。\n- 浏览：[首页](http://www.quicklyjava.com)\
  \ / 使用 JExcel API 在 Java 中处理 Excel 文件\n\n# 1.9 Java 中处理 Excel 文件\n\n由于 Excel 是微软\
  \ Office 软件，需要支持库文件来处理 Excel 文件。这里将使用 `JExcel API` 进行说明。需要从 [https://sourceforge.net/projects/jexcelapi/files/]\
  \ 下载 [jexcelapi](https://sourceforge.net/projects/jexcelapi/files/jexcelapi/) jar\
  \ 文件 `Jxl.jar`。\n\nJava Excel API 是一个成熟的开源 Java API，允许开发者动态地读取、写入和修改 Excel 表格。现在，Java\
  \ 开发者可以使用方便简单的 API 读取 Excel 表格、修改它们，并将更改写入到任何输出流中。\n\n## 1.9.1 使 Java 程序读取和写入 Excel\
  \ 文件的步骤\n\n1. 下载 [jexcelapi](https://sourceforge.net/projects/jexcelapi/files/jexcelapi/)\
  \ jar 文件。\n2. 解压并保存到 Java 程序所在的同一文件夹中。\n3. 按照如下方式将 jar 文件添加到你的编译器中：\n   a. 如果你使用\
  \ `JGRASPE`，前往 Setting—`Path/ClassPath` –`workspace` – 点击 `New` – 浏览并添加 jar 文件。\n\
  4. 编写 Java 程序来读取 Excel 数据，以及编写将程序生成的数据写入 Excel 文件的程序。\n\n## 1.9.2 读写 Java Excel\
  \ 文件的示例\n\n程序 1.9.1 `SRP_ReadExcel.java`\n\n```java\nimport java.io.File;\nimport\
  \ java.io.IOException;\nimport jxl.Cell;\nimport jxl.CellType;\nimport jxl.Sheet;\n\
  import jxl.Workbook;\nimport jxl.read.biff.BiffException;\n\npublic class SRP_ReadExcel\
  \ {\n    private String inputFile;\n\n    public void setInputFile(String inputFile)\
  \ {\n        this.inputFile = inputFile;\n    }\n\n    // 从 excel 读取数据的函数，将数据从字符串转换为\
  \ double 并保存到数组中\n    // 返回 x[][]\n    public double [][] read() throws IOException\
  \ {\n        File inputWorkbook = new File(inputFile);\n        Workbook w;\n  \
  \      double X[][] = new double[300][10];\n        // 用于保存 excel 数据的数组，取 300,10\
  \ 的数据大小\n        // 它应该比 excel 中的实际数据大小大\n        try {\n            w = Workbook.getWorkbook(inputWorkbook);\n\
  \            // 获取第一个表\n            Sheet sheet = w.getSheet(0);\n            //\
  \ 遍历前 10 列和行\n            int n = sheet.getRows();\n            int m = sheet.getColumns();\n\
  \            // double X[][] = new double [n][m];\n            double Y[] = new\
  \ double[n];\n            for (int i = 1; i < sheet.getRows(); i++) {\n        \
  \        for (int j = 0; j < sheet.getColumns(); j++) {\n                    Cell\
  \ cell = sheet.getCell(j, i);\n                    CellType type = cell.getType();\n\
  \                    if (type == CellType.LABEL) {\n                        X[i][j]\
  \ = Double.valueOf(cell.getContents());\n                        // System.out.print(\"\
  \ \" + X[i][j]);\n                    }\n                    if (type == CellType.NUMBER)\
  \ {\n                        X[i][j] = Double.valueOf(cell.getContents());\n   \
  \                     // System.out.print(\" + X[i][j]);\n                    }\n\
  \                }\n            }\n        } catch (BiffException e) {\n       \
  \     e.printStackTrace();\n        }\n        return X;\n    }\n\n    public static\
  \ void main(String[] args) throws IOException {\n        SRP_ReadExcel test = new\
  \ SRP_ReadExcel();\n        // 文件位置\n        test.setInputFile(\"E:/Java_Engg_Problem/data.xls\"\
  );\n        double xx[][] = test.read();\n        // 将从函数返回的数据保存到数组 xx\n       \
  \ int n = xx.length; // 数组 xx 的行\n        int m = xx[5].length; // 数组 [][] 的列\n\
  \        System.out.println(\"n,m=\" + n + \" \" + m);\n        int i, j; // 声明数组\n\
  \        double X[][] = new double[300][10];\n        int mk, nk; // X[][] 中存储数据的实际行和列数\n\
  \        // 数组 xx[][] 可能比实际数据更多的行和列\n        // 因此 X[][] 是 xx[][] 的子集\n        nk\
  \ = 0; mk = 0;\n        for (i = 1; i < xx.length; i++) {\n            j = 0;\n\
  \            if (xx[i][j] == 0.0) break; // 没有数据\n            mk = 0; // 在循环开始前置零\n\
  \            for (j = 0; j < xx[6].length; j++) {\n                if (xx[i][j]\
  \ != 0.0) { // 仅非零数据\n                    // X[nk][mk] 从 X[0][0] 开始的新非数据集\n    \
  \                X[nk][mk] = xx[i][j];\n                    System.out.print(\"\
  \ \" + X[nk][mk]);\n                    mk = mk + 1; // 列增\n                }\n\
  \            }\n            nk = nk + 1; // 行增\n            System.out.println();\n\
  \        }\n        System.out.println(\"nk, mk=\" + nk + \" \" + mk);\n    }\n\
  }\n```\n\n1.9.2.1 运行程序\n准备如 `data.xls` 的 excel 数据，将其放在文件夹 `E:/Java_Engg_Problem/data.xls`。复制并粘贴上述程序，编译并运行，你将看到程序可以从文件中读取所有的\
