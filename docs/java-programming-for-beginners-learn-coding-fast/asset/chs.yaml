  ```\n**解释：** `super ( x,y );` 调用了 `super` 类中的构造函数。\n\n## 重写 (Overriding)\n如果方法名和参数相同，子类的方法可以重写父类的方法。\n\
  \n### 示例 6.3\n```java\nclass Super_class{\n    int test( int num ) { return num;\
  \ } // 重写\n}\nclass Sub_class extends Super_class{\n    int test( int num ) { return\
  \ 100 + num; } // 重写\n}\npublic class OverridingClass {\n    public static void\
  \ main (String args[ ]){\n        Sub_class obj=new Sub_class( );\n        System.\
