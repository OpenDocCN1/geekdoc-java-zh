  \ 200 )` 调用 `int test( ){ }` 时，子类中的 `int test( ){ }` 重写了父类中的 `int test( ){ }`，因为它们具有相同的名称和相同的参数。\n\
  \n## 重载 (Overloading) 与 重写 (Overriding)\n\n| 类型 | 描述 |\n| :--- | :--- |\n| 重载 |\
  \ 方法名相同，参数不同，在同一个类中。 |\n| 重写 | 方法名相同，参数相同，位于父类和子类之间。 |\n\n### 示例 6.4 (重载)\n```java\n\
  class Color{ \n    String x,y;  \n    Color ( String a, String b) { x=a; y=b; }\
  \ // 重载\n    Color ( ) {  \n        x=”yellow\";  \n        y=”purple\";\n    }\
  \ // 重载\n}\n```\n\n### 示例 6.5 (重写)\n```java\nclass super_class{\n    int test( int\
  \ num ) { return num; } // 重写\n}\nclass sub_class extends super_class{\n    int\
  \ test( int num ) { return 100 + num; } // 重写\n}\n```\n**解释：** 示例 1 是重载。示例 2 是重写。\n\
  \n## 静态变量 (Static variable)\n`static variable` 被称为类变量，可以通过类或对象进行引用。\n- `非静态变量` 无法通过类引用。\n\
  - `非静态变量` 只能通过对象引用。\n\n### 示例 6.6\n```java\nclass MyClass {\n    static int count=100;\
  \ // 一个静态变量\n    public static void main (String args[ ]){\n        System. out.\
  \ print( MyClass.count );\n        /* MyClass 直接引用静态变量 “count” */\n    }\n}\n```\n\
  **输出：** 100\n**解释：** `static int count=100` 定义了一个静态变量。`MyClass. count` 意味着类 `MyClass`\
  \ 直接引用了静态变量 `count`。注意，对象也可以引用静态变量。\n\n## 静态方法 (Static Method)\n`static method`\
  \ 被称为类方法，可以通过类或对象进行调用。\n- `非静态方法` 无法通过类引用。\n- `非静态方法` 只能通过对象引用。\n\n### 示例 6.7\n\
  ```java\nclass MyClass {\n    static int count( ) { return 100 ;} // 定义一个静态方法\n\
  \    public static void main (String args[ ]){\n        System. out. print( MyClass.count(\
  \ ) );\n        /* MyClass 直接调用静态方法 “count()” */\n    }\n}\n```\n**输出：** 100\n**解释：**\
  \ `static int count( ) { return 100 }` 定义了一个静态方法。`MyClass. count( )` 意味着类 `MyClass`\
  \ 直接调用静态方法 `count()`。注意，对象也可以调用静态方法。\n\n## final 变量 (final Variable)\n`final` 是一个关键字。\n\
  `final+变量` 意味着该变量的值不能被。\n\n### 示例 6.8\n```java\nclass MyClass{\n    final int x\
  \ =100; // 定义一个 final 变量\n    static void test()){ x = 200 ;} // 错误！ “x” 是 final\
  \ 变量\n    public static void main (String args[ ]){\n        System. out. print(\
  \ MyClass. test( ) );\n    }\n}\n```\n**解释：** `final int x =100` 定义了一个 final 变量\
  \ `x`，其值为 100 且无法更改。`static void test( ) { x = 200;}` 试图修改 `x` 的值，但发生了错误。\n\n##\
  \ final 方法 (final Method( ))\n`final` 是一个关键字。\n`final method( )` 意味着该方法不能被重写。\n\n\
  ### 示例 6.9\n```java\nclass animal{\n    final void test ( ){ // 定义一个 final 方法\n\
  \        System. out. print(“animal”);\n    }\n}\nclass dog extends animal {\n \
  \   void test ( ){ // 错误！因为 test() 想要重写…\n        System. out. print(“dog”);\n \
  \   }\n}\n```\n**解释：** (由于原文未提供解释，此处保持格式逻辑)\n\n## final 类 (final class)\n`final`\
  \ 是一个关键字。\n`final class` 意味着该类不能被继承。\n\n### 示例 6.10\n```java\nfinal class animal\
  \ {\n    // 定义一个 final 类\n    // 定义一些变量;\n    // 定义一些方法;\n}\nclass elephant extends\
  \ animal { // 错误！无法继承\n}\n```\n**解释：** `final class` 定义了一个 final 类。`elephant extends\
  \ animal` 无法继承。\n\n## 多态 (Polymorphism)\n多态是指对不同对象执行相同方法的能力。\n\n### 示例 6.11\n```java\n\
  class Animal{\n    cry( ){ // 父类\n        System. out. print(\"crying...... \");\n\
  \    }\n}\nclass Dog extends Animal{ // 子类\n    cry( ){ // 重写\n        System. out.\
  \ print(\"Wow, Wow...... \");\n    }\n}\nclass Cat extends Animal{ // 子类\n    cry(\
  \ ){ // 重写\n        System. out. print(\"Meow, Meow...... \");\n    }\n}\nclass\
  \ PolymorphismDemo{\n    public static void main(String args[ ]){\n        Animal\
  \ animalVar;\n        animalVar = new Dog( ); // 创建 dog 对象\n        animalVar. cry(\
  \ ); // dog 调用 cry()\n        animalVar = new Cat( ); // 创建 cat 对象\n        animalVar.\
  \ cry( ); // cat 调用 cry()\n    }\n}\n```\n**输出：**\nWow, Wow......\nMeow, Meow......\n\
  **解释：** `animalVar = new Dog( )` 创建了一个 dog 对象，因此 `animalVar. cry( )` 调用了子类 `Dog`\
  \ 中的 `cry()` 方法`animalVar = new Cat( )` 创建了一个 cat 对象，因此 `animalVar. cry( )` 调用了子类\
  \ `Cat` 中的 `cry()` 方法。\n\n## 包与导入 (Package & Import)\n`package package-name;`\n\
  `import package. class;`\n\n`package package-name` 创建或使用一个包。`import package. class`\
  \ 导入一个包或其类。\n\n### 示例 6.12 (在 file1)\n```java\npackage myPackage;\n/* 创建包含两个类的包\
  \ */\nclass MyClass1 {…}\nclass MyClass2 {…}\n```\n\n### 示例 6.13 (在 file2)\n```java\n\
  package myPackage;\n// 使用包 “myPackage”\nimport myPackage. *; // 导入 myPackage 的所有类\n\
  ```\n**解释：** `package myPackage` 创建了一个名为 `myPackage` 的包，包含两个类（file1 中的 `MyClass1`\
  \ 和 `MyClass2`）。`import myPackage. * ` 将 file1 中包 `myPackage` 的所有类导入到 file2。注意 `package`\
  \ 命令必须位于 `import` 命令的上方。\n\n## 构建包，导入类\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `package\
  \ myPackage;` | 构建一个包 |\n| `import anyClass;` | 导入一个类 |\n\n\n\n\n\n### 示例 6.14 (在\
  \ Drive.java 中)\n\n```java\npackage myPackage;   // 创建一个包含类的包\npublic class Drive{\n\
  \    public void getDistance (int mph, float time){\n        System. out. println(\"\
  SPEED:\" + mph + \" MILES/HOUR\");\n        System. out. println(\"TIME:\" + time\
  \ + \" HOURS\");\n        System. out. println(\"DISTANCE:\" + time*mph + \" MILES\"\
  );\n    }\n}\n```\n\n### 示例 (在 TestDrive.java 中)\n\n```java\npackage myPackage;\
  \    // 使用 \"myPackage\"\nimport myPackage.Drive;    // 导入 myPackage 中的类 \"Drive\"\
  \npublic class TestDrive{\n    public static void main (String args[ ]) {\n    \
  \    Drive myDrive = new Drive( );\n        myDrive. getDistance(120, 5);\n    }\n\
  }\n```\n\n### 输出\n```\nSPEED: 120 MILES/HOUR\nTIME: 5 HOURS\nDISTANCE: 600 MILES\n\
  ```\n\n### 解释\n- `package myPackage;` 在 `Drive.java` 中创建了一个包 `myPackage`。\n- `import\
  \ myPackage. Drive;` 导入了 `myPackage` 中的类 `Drive`。\n- `Drive myDrive = new Drive(\
  \ )` 可以在文件 `TestDrive` 中创建一个对象 `myDrive`，因为 `Drive` 类已经从 `Drive.java` 导入。\n- `myDrive.\
  \ getDistance(120, 5);` 调用了 `Drive.java` 中的方法。\n\n**注意：** `package` 命令必须位于 `import`\
  \ 命令之上。\n\n## 练习：继承\n\n## 继承示例\n启动 Eclipse > 选择 `myPackage` > new > class > name\
  \ > `InheritanceDemo` > Finish（完成）。在 Eclipse 中编写以下代码。\n\n```java\npackage myPackage;\n\
  class code1{\n    // 父类\n    int x, y;\n    code1(int a, int b){\n        // 构造函数\n\
  \        x = a; y = b;\n    }\n}\nclass code2 extends code1{\n  // 子类\n    code2\
  \ (int a, int b){\n        // 构造函数\n        super (a,b); // 调用父类中的构造函数 \n    }\n\
  }\npublic class InheritanceDemo {\n    public static void main(String[] args) {\n\
  \      // 主函数\n      int result;\n      code2 number = new code2(100, 200); /* 创建对象\
  \ \"number\"，并自动调用 code2 构造函数 */\n      result = number. x + number. y;\n      System.\
  \ out . println(\"Sum = \" + result);\n    }\n}\n```\n\n点击工具栏中的白色三角形按钮运行程序并查看输出：\n\
  \n### 输出\n```\nSum = 300\n```\n\n### 解释\n- `class code1` 创建了一个超类 `code1`。\n- `code1(int\
  \ a, int b){ }` 定义了一个构造函数。\n- `class code2 extends code1` 创建了扩展超类 `code1` 的子类 `code2`。\n\
  - `code2 (int a, int b){ }` 定义了一个构造函数。\n- `super (a,b)` 调用超类中的构造函数，以便初始化变量 `x` 和\
  \ `y`。\n- `public class InheritanceDemo` 创建了一个主类。\n- `code2 number = new code2(100,\
  \ 200)` 创建了一个对象 `number`，自动调用构造函数 `code2( ){ }`并将两个参数 `100` 和 `200` 传递给构造函数，从而初始化变量\
  \ `x` 和 `y`。\n- `member. x` 引用变量 `x`，其值为 `100`。\n- `member. y` 引用变量 `y`，其值为 `200`。\n\
  \n## 总结\n- 类被子类扩展，这被称为继承。\n- 在子类中，`super` 用于调用父类的构造函数。\n- 如果方法名和参数相同，子类的方法可以重写超类的方法。\n\
  - `static variable` 称为类变量，可以通过类或对象引用。\n- `Non static variable` 无法通过类引用。\n- `Non\
  \ static variable` 只能通过对象引用。\n- `static method` 称为类方法，可以通过类或对象调用。\n- `Non static\
  \ method` 无法通过类引用。\n- `Non static method` 只能通过对象引用。\n- `final+ variable` 意味着变量值不能修改。\n\
  - `final method( )` 意味着该方法不能被重写。\n- `final class` 意味着该类不能被扩展。\n- 多态描述了对对象执行不同方法的能力。\n\
  - `package package-name` 创建或使用包。\n- `import package. class` 导入包或其类。\n\n# 第 7 章：抽象与接口\n\
  \n## 抽象\n`Abstract class` 当作父类使用，会被其子类扩展。子类的方法将重写抽象类的抽象方法。\n\n### 示例 7.1\n```java\n\
  abstract class books{\n  // 定义抽象类\n  abstract int read( );  // 定义抽象方法\n}\nclass\
  \ eBooks extends books{\n  // 扩展父类\n  int read ( ){ return 100; } // 重写方法\n}\n```\n\
  \n### 解释\n- `abstract class books{ }` 定义了一个抽象类。\n- `abstract int read( )` 定义了一个抽象方法。\n\
  - `class eBooks extends books { }` 意味着子类 `eBooks` 扩展了父类 `books`。\n- `int read (\
  \ ) { }` 意味着该方法重写了父类中的抽象方法。\n\n### 抽象示例\n```java\npackage myPackage;\nabstract class\
  \ Books{\n    // 创建抽象类\n    abstract void read();\n    // 创建抽象方法\n}\nclass eBooks\
  \ extends Books{\n  // 扩展父类\n  void read(){\n    // 重写抽象方法\n    System. out . println(\"\
  Overrides the abstract method! \");\n  }\n}\npublic class AbstractExample {\n  \
  \  public static void main(String[] args){\n        eBooks obj =new eBooks();\n\
  \        obj. read();\n    }\n}\n```\n\n### 输出\n```\nOverrides the abstract method!\n\
  ```\n\n## 权限\nJava 有四种修饰符来定义成员：`default`、`public`、`private`、`protected`。\n\n| 类\
  \ | default | public | private | protected |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| 同一类 | V | V | V | V |\n| 同一包父类 | V | V | X | V |\n| 同一包子类 | V | V | X | V\
  \ |\n| 不同包父类 | X | V | X | X |\n| 不同包子类 | X | V | X | V |\n\n\n\n\n\n`default member`\
  \ 无法被不同的包访问。`public member` 可以被任何包和类访问。`private member` 无法被不同的类访问。`protected member`\
  \ 可以被任何子类访问。\n\n### 默认成员 (Default Member)\n`default member` 无法被不同的包访问，注意包名必须与包所在的目录名称相同。`default\
  \ member` 无任何修饰符。\n\n示例 7.2\n同一包中包含两个文件如下：\n(在 myPackage 的 file1 中)\n```java\npackage\
  \ myPackage ;\npublic class ParentClass{\n  int num =100;  // 这是一个默认成员\n}\n```\n\
  (在 myPackage 的 file2 中)\n```java\npackage myPackage ;\npublic class SubClass extends\
  \ ParentClass{\npublic static void main(String[] args) {\n  SubClass s=new SubClass(\
  \ );\n  System. out. print ( s.num );  /* s 引用了同包中的 num，可以！  */\n}}\n```\n**输出：**\
  \ 100\n**解释：** `int num=100` 定义了一个默认成员。`s. num` 可以访问同包中的默认成员。\n\n### 公有成员 (Public\
  \ Member)\n`public member` 可以被任何包或任何类访问，特别是在不同的包之间。\n\n示例 7.3\n不同包中包含两个文件如下：\n(在\
  \ MyPackage 的 file1 中)\n```java\npackage myPackage ;\npublic class ParentClass{\n\
  \  public int num=100;  // 这是一个公成员\n}\n```\n(在 NewPackage 的 file2 中)\n```java\n\
  package newPackage ;\nimport myPackage. ParentClass;\npublic class SubClass extends\
  \ ParentClass{\npublic static void main(String[] args) {\n  SubClass s=new SubClass(\
  \ );\n  System. out. print ( s.num );  /* s 引用了不同包中的 num，可以！  */\n}}\n```\n**输出：**\
  \ 100\n**解释：** `public int num=100` 定义了一个公成员。`s. num` 可以访问不同包中的公成员。\n\n### 私有成员\
  \ (Private Member)\n`private member` 无法被不同的类访问。\n\n示例：\n```java\nclass MyClass {\n\
  \  private MyClass( ){  // 私有构造函数\n    System. out . println(“这是一个私有方法! ”);\n}\n\
  public class NewClass {\n  public static void main ( String args [ ] ) {\n    MyClass\
  \ obj = new MyClass ( );  /* 错误！访问私有构造函数  */\n  }\n}\n```\n**输出：** ( 错误信息! )\n**解释：**\
  \ `private MyClass( )` 定义了一个私有构造函数 `MyClass`。`new MyClass ( )` 尝试调用私有构造函数 `MyClass`，但发生了错误，因为它们位于不同的类。\n\
  \n#### 私有示例 (Private Example)\n`private member` 可以被同一个类访问。\n\n示例：\n```java\npackage\
  \ myPackage;\npublic class OurClass { \n  private int a = 100;  // 声明一个私有变量 \n \
  \ private int b = 200;  // 声明一个私有变量\npublic void accessVariable(){\n    System.\
  \ out . println(\"a = \" + a);  // 访问私有变量\n    System. out . println(\"b = \" +\
  \ b);   // 访问私有变量 \n  }\n}}\npublic class PrivateExample {\n  public static void\
  \ main ( String args [ ] ){\n    OurClass obj = new OurClass( ); /* 可以!，访问默认构造函数\
  \ */\n    obj. accessVariable();\n  }\n}\n```\n**输出：**\na = 100\nb = 200\n\n###\
  \ 受保护成员 (Protected Member)\n`protected member` 可以被任何子类访问。\n\n示例 7.5\n不同包中包含两个文件如下：\n\
  (在 MyPackage 的 file1 中)\n```java\npackage myPackage;\npublic class ParentClass{\n\
  \  // 父类\n  protected int num =100;  // 受保护成员\n}\n```\n(在 NewPackage 的 file2 中)\n\
  ```java\npackage newPackage;\nimport myPackage. ParentClass;\npublic class SubClass\
  \ extends ParentClass{\n  // 子类\n  public static void main(String[] args) {\n  \
  \  SubClass s=new SubClass( );\n    System. out. print ( s.num );  // 访问受保护成员\n\
  \  }\n}}\n```\n**输出：** 100\n**解释：** `protected int num =100` 定义了一个受保护成员。`s.num `\
  \ 可以访问不同包中子类的受保护成员。\n\n### 接口 (Interface)\n`Interface` 是一个特殊的类，会被类实现。接口包含一个或多个空方法，这些方法将由类的方法实现。\n\
  \n示例 7.6\n```java\ninterface books {\n  // 定义一个接口\n  int booknumber( );     // 定义一个空方法\n\
  }\nclass eBooks implement books {\n  // 实现接口\n  public int booknumber ( ) {  //\
  \ 实现空方法\n    return 100;\n  }\n}\n```\n**解释：** `interface books` 定义了一个名为 `books`\
  \ 的接口。`int booknumber( )` 定义了一个空方法 `booknumber`。`class eBooks implement books{}`\
  \ 意味着类 `eBooks` 实现 `books` 接口。`public int booknumber( ){` 实现了 `booknumber( )`。\n\
  \n#### 接口示例 (Interface Example)\n示例：\n```java\npackage myPackage;\ninterface Books{\n\
  \  // 定义一个接口\n  public void booksNumbers();  // 定义一个空方法\n}\nclass eBooks implements\
  \ Books{\n  // 实现接口\n  public void booksNumbers(){  // 实现空方法\n    System. out .\
  \ println(\"实现了空方法! \");\n  }\n}\npublic class InterfaceExample {\n  public static\
  \ void main(String args[]) {\n    eBooks obj = new eBooks();\n    obj. booksNumbers();\n\
  \  }\n}\n```\n**输出：** 实现了空方法!\n\n### 抽象与接口 (Abstract & Interface)\n\n| 抽象 | 解释 |\n\
  | :--- | :--- |\n| ```java\nabstract class books{\n  // 定义一个抽象类\n  abstract int\
  \ read( );  // 定义一个抽象方法\n}\nclass eBooks extends books{//继承父类\n  int read ( ){ return\
  \ …; } // 重写抽象方法\n}\n``` | |\n\n| 接口 | 解释 |\n| :--- | :--- |\n| ```java\ninterface\
  \ books {\n  // 定义一个接口\n  int booknumber( );     // 定义一个空方法\n}\nclass eBooks implement\
  \ books { //实现接口\n  public int booknumber ( ) {  // 实现空方法\n    return …;\n  }\n\
  }\n``` | |\n\n\n\n\n\n## 初始化变量\n在创建对象时，需要一个构造函数来初始化变量。\n\n### 示例 7.7\n```java\n\
  class Book {\n  // 创建一个类\n  public String title;\n  public int number;\n  public\
  \ Book ( ) {\n    // 定义构造函数\n    title = “Learning Java ”;  // 初始化\n    number =\
  \ 100;  // 初始化\n  }\n}\npublic class Publisher {\n  // 创建主类\n  public static void\
  \ main ( String args [ ]) { //主方法\n    Book eBook = new Book ( );  // 创建对象\n   \
  \ System. out. print( eBook. title + eBook. number);\n  }\n}\n```\n**输出:**\nLearning\
  \ Java 100\n\n**解释:** `public Book ( ) { }` 是一个初始化变量的构造函数。\n\n## 另一个类\n主类可以使用另一个类来调用另一个方法。\n\
  \n### 示例 7.8\n```java\nclass AnotherClass {\n    // 定义另一个类\n  public static void\
  \ AnotherMethod( ){ // 方法\n    System. out. print ( “Very Good” );\n}\npublic class\
  \ MainClass {\n  // 定义主类\n  public static void main (String args ]){ //主方法\n   \
  \ AnotherClass.AnotherMethod( ); // 调用另一个方法\n  }\n}\n```\n**输出:**\nVery Good\n\n\
  **解释:** `AnotherClass.AnotherMethod( )` 使用另一个类调用方法。\n\n## 练习：Max & Min\n\n### 示例\n\
  启动 Eclipse > 选择 “myPackage” > 新 > 类 > `AbstractDemo` > 完成。\n在 Eclipse 中编写以下代码：\n\
  \n```java\npackage myPackage;\nabstract class A {\n  // 定义抽象类\n  abstract int max\
  \ (int x, int y); // 定义抽象方法\n  int min(int x, int y);\n}\nclass B extends A {\n\
  \  // 继承父类\n  int max (int x, int y){\n  // 重写抽象方法\n  return x>y?x:y;\n}}\npublic\
  \ class AbstractDemo {\npublic static void main(String[] args) {\nA a;\nB b=new\
  \ B();\nint max=b. max(100, 200);\nint min=b. min(100, 200);\nSystem. out.println(\"\
  Max=\"+max);\nSystem. out.println(\"Min=\" +min);\n}}\n```\n点击工具栏中的白色三角形运行程序并查看输出：\n\
  **输出:**\nMax = 200\nMin = 100\n\n**解释:**\n- `abstract class A{ }` 定义了一个抽象类。\n- `abstract\
  \ int max( )` 定义了一个抽象方法。\n- `class B extends A { }` 表示子类继承父类 `A`。\n- `int max (\
  \ ) {` 表示子类重写了父类中的抽象方法。\n\n### 示例\n启动 Eclipse > 选择 “myPackage” > 新 > 类 > 名称 `InterfaceDemo`\
  \ > 完成。\n在 Eclipse 中编写以下代码：\n\n```java\npackage myPackage;\ninterface myInterface\
  \ {\n    // 定义接口\n  public void compareNumbers (int num1, int num2); /* 定义方法 */\n\
  }\nclass MaxNum implements myInterface {\n  // 实现接口\n  public void compareNumbers\
  \ (int num1, int num2){\n  /* 实现方法 */\n  if (num1>=num2)\n    System. out.println(\"\
  Two numbers are: \"+num1+\" \"+num2);\n  else\n    System. out.println(\"Maxmum\
  \ is:\"+num1);\n}\nclass MinNum implements myInterface {\n// 实现接口\n  public void\
  \ compareNumbers (int num1, int num2){\n  /* 实现方法 */\n  if (num1<=num2)\n    System.\
  \ out.println(\"Two numbers are: \"+num1+\" \"+num2);\n  else\n    System. out.println(\"\
  Minmum is:\"+num2);\n}}\npublic class InterfaceDemo {\npublic static void main(String[]\
  \ args) {\nMaxNum maxObject = new MaxNum();\nmaxObject.compareNumbers(100, 120);\n\
  MinNum minObject = new MinNum();\nminObject.compareNumbers(60, 80);\n}}\n```（注：此处原文代码逻辑存在多处括号未闭合错误，翻译已按原样保留）\n\
  点击工具栏中的白色三角形运行程序并查看输出：\n**输出:**\nTwo numbers are: 100 & 120\nMaxmum is:120\nTwo\
  \ numbers are: 60 & 80\nMinmum is:60\n\n**解释:**\n- `interface myInterface` 定义了一个名为\
  \ `myInterface` 的接口。\n- `void compareNumbers ( )` 定义了接口中的方法。\n- `class MaxNum implements\
  \ myInterface { }` 表示类 `MaxNum` 实现了接口 `myInterface`。\n- `class MinNum implements\
  \ myInterface { }` 表示类 `MinNum` 实现了接口 `myInterface`。\n- `public void compareNumbers(\
  \ )` 实现了接口中的方法。\n\n## 总结\n抽象类作为父类，会被其子类扩展。子类的方法将重写抽象类的抽象方法。\nJava 有四种修饰符来定义成员：`default`、`public`、`private`,\
  \ `protected`。\n- `default` 成员不能被不同的包访问，注意包名必须与目录名相同。\n- `default` 没有修饰符。\n- `public`\
  \ 成员可以被任何包或任何类访问，尤其是不同的包。\n- `private` 成员不能被不同的类访问。\n- `private` 成员可以被同类访问。\n- `protected`\
  \ 成员可以被子类访问。\n接口是一个特殊的类，会被类实现。接口包含一个或多个方法，会被类实现。\n\n# 第 8 章：异常\n异常是在运行过程中发生的错误，破坏命令的正常流。\n\
  \n### 示例 8.1\n```java\nint a=10, b=0;\nc = a/b; // 错误！因为 “b” 是 0\nSystem. out. print(\
  \ c );\n```\n**输出:**\njava.lang.ArithmeticException: / zero\n\n**解释:** `c = a/b`\
  \ 发生了，因为 `b` 是 0。\n\n### 示例 8.2\n```java\nint a=10, b=0;\ntry {\n  c = a/b;\n} catch\
  \ ( ArithmeticException e ) {\n  // 处理异常\nSystem. out. print (\" Divided By Zero\
  \ \");\n}\n```\n**输出:**\nDivided By Zero\n\n**解释:** `try-catch` 可以捕获 `ArithmeticException`。\n\
  \n### 示例 8.3\n```java\nint a[] = new int [10]; // 最后一个索引是 9\na[10]=100; // 错误！因为索引越界\n\
  System. out. print ( a[10] );\n```\n**输出:**\njava.lang.ArrayIndexOutOfBoundsException:\
  \ 10\n\n**解释:** `try{...}` 包含 `a[10]`，并导致了异常。\n\n### 示例 8.4\n```java\nchar ch =\
  \ \"ABC\". charAt(100); // 错误！索引越界\nSystem. out. print ( ch );\n```\n**输出:**\njava.lang.StringIndexOutOfBoundsException:\
  \ 100\n\n**解释:** `try{...}` 包含 `“ABC”.charAt(100)` 并导致了异常，因为 `“ABC” 的长度为 3，没有第 100\
  \ 个字符。\n\n## finally 命令\ntry-catch 块后面可以跟一个 `finally` 命令，它总是最后执行的。\n\n### 示例 8.5\n\
  ```java\npublic class ExceptionSample {\npublic static void main (String args [\
  \ ]) {\n  try {\n    char ch = \"ABC\". charAt(100); // 错误！\n  } catch (IndexOutOfBoundsException\
  \ e) {\n    System. out. print ( \"Character index out of bounds. \" );\n  }\n \
  \ finally {\n    System. out.print(\"The End\");\n  }  // 必须执行\n}}\n```\n**输出:**\n\
  Character index out of bounds. The End\n\n**解释:** `“finally { System. out.print(“The\
  \ End”); }”` 必须执行。\n\n## 抛出异常\n任何程序都可以准备好手动抛出自己的异常。\n\n```java\nthrow new exception\
  \ ( “exception message”);\n```\n\n\n\n\n\n`throw` 用于手动抛出异常和错误消息。`e.getMessage()`\
  \ 可以显示错误消息。\n\n### 示例 8.6\n```java\npublic class ExceptionSample {\n    public static\
  \ void main (String args []) {\n        try {\n            int a[] = new int[10];\
  \ // 最后元素是 a[9]，没有 a[10] .\n            if ( a[10] >0 ) throw new ArrayIndexOutOfBoundsException(\"\
  Error\"); // throw\n        } catch ( ArrayIndexOutOfBoundsException e) {\n    \
  \        System. out. print (\"Error index:\"+e. getMessage())); // alert\n    \
  \    }\n    }\n}\n```\n**输出：**\n`Error index: 10`\n\n**解释：**\n`throw new exception(\"\
  …\")` 可以抛出一个异常。抛出 `Exception`。任何方法都可以准备好手动抛出自己的异常。`e.getMessage()` 显示错误消息。\n\n|\
  \ `method()` 出异常 {…}` |\n\n### 示例 8.7\n```java\npublic class ExceptionSample {\n\
  \    public static void main (String args []) {\n        try {\n            int\
  \ b = 0;\n            calculate( b ); //调用函数，发生了异常！\n        } catch( Exception\
  \ e) {\n            System. out.println(\"The error is\"+ e. getMessage()));\n \
  \       }\n    }\n    public static int calculate( int num) throws ArithmeticException\
  \ {\n        // 手动抛出异常\n        int a=10, c;\n        c = a/num; // num 为 0，错误！\n\
  \        return c;\n    }\n}\n```\n**输出：**\n`(The error is: / by zero. )`\n\n**解释：**\n\
  `int calculate( int num) throws ArithmeticException` 抛出一个异常。`e.getMessage()` 显示错误消息。\n\
  \n## File 类\n`File` 类用于显示文件的属性、检查文件是否存在、可写、可读、重命名文件……\n\n| `File f = new File (file-name);`\
  \ // 创建文件对象 |\n| `f.exists();` // 检查是否存在 |\n| `f.canRead();` // 检查是否可读 |\n| `f.canWrite();`\
  \ // 检查是否可写 |\n| `f.isFile();` // 检查是否是文件 |\n\n### 示例 8.8\n```java\nFile f = new\
  \ File ( MyFile );\nif (f.exists( )) {\n    System. out.println(\"Exists:\"+ f.exists()\
  \ ); // Exists: true\n    System. out.println(\"Can read:”+ f.canRead()); // Can\
  \ read: true\n    System. out.println(\"Can write:”+ f.canWrite()); // Can write:\
  \ false\n    System. out.println(\"Is file:”+ f.isFile()); // Is file: true\n}\n\
  ```\n**解释：**\n以上所有方法都返回 `true` 或 `false`。\n\n## FileOutputStream\n`FileOutputStream`\
  \ 类用于处理输出流。\n\n| `FileOutputStream fout = new FileOutputStream (file-name);` |\n\
  | `System. in. read();` // 读取输入的字符 |\n| `fout. write();` // 将字符写入文件 |\n\n`new FileOutputStream\
  \ (file-name)` 创建一个输出流。`System. in.read()` 从键盘读取输入的字符。`fout.write()` 将字符写入文件。\n\n\
  ### 示例 8.9\n（在同一项目文件夹中准备一个空文件 `MyFile.txt`，以及以下 Java 文件 `OutputFile.java`）\n```java\n\
  package myPackage;\nimport java.io.*;\npublic class OutputFile {\n    public static\
  \ void main(String[] args) {\n        char ch;\n        int number;\n        try\
  \ {\n            FileOutputStream fout = new FileOutputStream(\"MyFile. txt\");\n\
  \            System. out.println(\"Please input some words, finish with # key and\
  \ enter:\");\n            while((ch = (char)System. in.read()) != '#') /*从键盘读取输入的字符*/\n\
  \                fout.write(ch); // 将字符写入文件\n            fout.close();\n       \
  \ } catch(FileNotFoundException e) {\n            System. err.println(e);\n    \
  \    } catch(IOException e) {\n            System. err.println(e);\n        }\n\
  \    }\n}\n```\n（运行程序，并在键盘上输入“C++ is very good!”）\n**输出：**\n`请检查 MyFile. txt，你会发现内容是\
  \ “C++ is very good!”.`\n\n**解释：**\n`fout` 是一个输出流对象。`System. in.read()` 从键盘读取字符。`fout.write(ch)`\
  \ 将字符写入文件。当你查看 `MyFile.txt` 时，其内容为：`C++ is very good`。\n\n## FileInputStream\n`FileInputStream`\
  \ 类用于处理输入流。\n\n| `FileInputStream fin = new FileInputStream (file-name);` |\n| `fin.\
  \ read();` // 读取文件内容 |\n\n`new FileInputStream (file-name)` 创建一个输入流。`fin.read()`\
  \ 读取文件内容。\n\n### 示例 8.10\n（假设同一项目文件夹中 `MyFile.txt` 内容为“C++ is very good!”，以及以下 Java\
  \ 文件 `InputFile.java`）\n```java\npackage myPackage;\nimport java.io.*;\npublic class\
  \ InputFile {\n    public static void main(String[] args) {\n        char ch;\n\
  \        int number;\n        try {\n            FileInputStream fin = new FileInputStream(\"\
  MyFile.txt\");\n            while((number=fin.read()) != -1) // 读取文件\n         \
  \       System. out.print((char)number); // 转换为字符\n            fin.close();\n  \
  \      } catch(FileNotFoundException e) {\n            System. err.println(e);\n\
  \        } catch(IOException e) {\n            System. err.println(e);\n       \
  \ }\n    }\n}\n```\n**输出：**\n`C++ is very good!`\n\n**解释：**\n`fin` 是一个输入流对象。`fin.read()`\
  \ 读取文件内容。`-1` 表示文件结束。\n\n## 创建线程\n线程可以用于同时执行多个任务。每个线程代表一个子任务。创建线程有两种方法。\n\n####\
  \ 方法一\n```java\npublic class ThreadDemo extends Thread { // 继承\n    public void\
  \ run() {\n        // 线程体\n    }\n    public static void main(String args[]) {\n\
  \        ThreadDemo myThread = new ThreadDemo();\n        myThread.start(); // 启动线程\n\
  \    }\n}\n```\n**解释：**\n方法一使用了 `Thread` 类。`run()` 在线程启动时自动运行。`myThread = new ThreadDemo()`\
  \ 创建了一个线程对象 `myThread`。`start()` 启动线程。\n\n#### 方法二\n```java\nclass ThreadDemo implements\
  \ Runnable { // 实现\n    public void run() {\n        // 线程体\n    }\n    public static\
  \ void main(String args[]) {\n        Thread myThread = new Thread(new ThreadDemo());\n\
  \        myThread.start(); // 启动线程\n    }\n}\n```\n\n\n\n\n## 解析\n方法二使用了 `implements\
  \ Runnable` 接口。线程启动时，`run()` 会自动运行。`new Thread(new ThreadDemo())` 创建了一个线程对象 `myThread`。`start()`\
  \ 启动线程。\n\n## 继承 Thread (示例 8.11)\n\n```java\npublic class ThreadDemo extends Thread\
  \ { \n    // extends\n    public void run() {\n        // 线程体\n        for(int i\
  \ = 0; i < 3; i++) {\n            System.out.println(\"Thread! \");\n        }\n\
  \    }\n    public static void main(String[] args) {\n        ThreadDemo myThread\
  \ = new ThreadDemo();\n        myThread.start(); // start thread\n    }\n}\n```\n\
  **输出：**\n```\nThread!\nThread!\nThread!\n```\n**解析：**\n线程启动时，`run()` 会自动运行。`myThread\
  \ = new ThreadDemo();` 创建了一个线程对象 `myThread`。`start()` 启动线程。\n\n## 实现 Runnable (示例\
  \ 8.12)\n```java\nclass ThreadDemo implements Runnable { \n    // implements\n \
  \   public void run() {\n        // 线程体\n        for(int i = 0; i < 3; i++) {\n\
  \            System.out.println(\"Thread! \");\n        }\n    }\n    public static\
  \ void main(String[] args) {\n        Thread myThread = new Thread(new ThreadDemo());\n\
  \        myThread.start(); // start thread\n    }\n}\n```\n**输出：**\n```\nThread!\n\
  Thread!\nThread!\n```\n**解析：**\n线程启动时，`run()` 会自动运行。`myThread = new Thread(new ThreadDemo())`\
  \ 创建了一个线程对象 `myThread`。`start()` 启动线程。\n\n## 多线程 (示例 8.13)\n```java\nclass ThreadDemo\
  \ extends Thread {\n    public ThreadDemo(String threadName) {\n        super(threadName);\
  \ // 初始化线程名\n    }\n    public void run() {\n        // 线程体\n        for(int i =\
  \ 0; i < 2; i++) {\n            System.out.println(getName() + \" running! \");\n\
  \        }\n    }\n}\npublic class UseThread {\n    public static void main(String[]\
  \ args) {\n        ThreadDemo myThread1 = new ThreadDemo(\"1st thread\");\n    \
  \    ThreadDemo myThread2 = new ThreadDemo(\"2nd thread\");\n        ThreadDemo\
  \ myThread3 = new ThreadDemo(\"3rd thread\");\n        myThread1.start(); // start\
  \ thread\n        myThread2.start(); // start thread\n        myThread3.start();\
  \ // start thread\n    }\n}\n```\n**输出：**\n```\n1st thread running!\n1st thread\
  \ running!\n2nd thread running!\n2nd thread running!\n3rd thread running!\n3rd thread\
  \ running!\n```\n**解析：**\n`super(threadName)` 通过 `Thread` 类构造函数初始化线程名。`getName()`\
  \ 返回线程名。线程启动时，`run()` 会自动运行。`new myThread(\"1st thread\")` 创建了一个名为 `1st Thread`\
  \ 的线程对象。`myThread1.start();` 启动线程 `myThread1`。\n\n## 线程的方法\n- `thread.start()` 启动线程。\n\
  - `thread.stop()` 停止线程。\n- `thread.sleep()` 让线程休眠一段时间。\n- `thread.wait()` 让线程处于等待状态。\n\
  - `thread.notify()` 唤醒正在等待的线程。\n- `thread.yield()` 让相同优先级的其他线程运行。\n- `thread.isAlive()`\
  \ 测试当前线程存活。\n- `thread.currentThread()` 获取当前线程。\n- `thread.interrupt()` 停止“阻塞”的线程。\n\
  - `thread.suspend()` 让线程暂停。\n- `thread.resume()` 重新启动线程。\n- `thread.join()` 在其他线程结束后后运行此线程。\n\
  \n**例如：**\n```java\nif(time_to_stop){\n    thread.currentThread().stop(); // 停止当前线程\
  \ .\n}\n```\n\n## 线程示例 (示例 8.14)\n```java\nclass ThreadDemo implements Runnable\
  \ {\n    public void run() {\n        // 线程体\n        ……\n        wait(); // 让线程处于等待状态\
  \ .\n        ……\n    }\n}\nclass TextThread {\n    public static void main(String\
  \ args[]) {\n        Thread myThread = new Thread(new ThreadDemo());\n        myThread.start();\
  \ // start thread\n        Thread.sleep(1000); // 让线程休眠 1 秒\n        notify(); //\
  \ 唤醒正在等待的线程\n        Thread.yield(); /* 让相同优先级的其他线程优先运行 . */\n    }\n}\n```\n**解析：**\n\
  `wait()` 让当前线程等待。`new Thread(new ThreadDemo())` 创建一个线程。`myThread.start()` 启动线程。`Thread.sleep(1000)`\
  \ 让线程休眠 1000 毫秒。`notify()` 唤醒正在等待的线程。`Thread.yield()` 让相同优先级的线程优先运行。\n**注意：** 现在不建议使用\
  \ `suspend()` 和 `resume()`。\n\n## 练习：OutOfRangeException 示例\n启动 Eclipse > 选择 \"\
  myPackage\" > new > class > name > `ArrayOutRange` > 完成。在 Eclipse 中编写以下代码。\n\n```java\n\
  package myPackage;\npublic class ArrayOutRange {\n    public static void main(String[]\
  \ args) {\n        try {\n            int n = 0;\n            String color[] = {\"\
  Red\", \"Yellow\", \"Green\"};\n            while (n < 4) {\n                System.out.println(color[n]);\n\
  \                n++;\n            }\n        } catch (ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"Exception Occurs!\");\n        }\n    }\n\
  }\n```\n点击运行 按钮运行程序，可以看到输出：\n**输出：**\n```\nRed\nYellow\nGreen\nException Occurs!\n\
  ```\n\n## 步骤说明\n- **第 1 步：多线程**：启动 Eclipse > 选择 \"myPackage\" > new > class > name\
  \ > `ArrayOutRange` > 完成。\n- **第 2 步：包**：`ThreadClass` 用于包含各种...\n- **第 3 步：类**：创建\
  \ `ThreadClass`。\n- **第 4 步：编写 Java 代码**：\n```java\npackage myPackage;\npublic class\
  \ ThreadClass {\n    public static void main(String[] args) {\n        ThreadDemo\
  \ myThread1 = new ThreadDemo(\"Thread One\");\n        ThreadDemo myThread2 = new\
  \ ThreadDemo(\"Thread Two\");\n        myThread1.start(); // start thread\n    \
  \    myThread2.start(); // start thread\n    }\n}\n\nclass ThreadDemo extends Thread\
  \ {\n    public ThreadDemo(String str) {\n        super(str); // 初始化线程名\n    }\n\
  \    public void run() {\n        // 线程体\n        for(int i = 0; i < 2; i++) {\n\
  \            try {\n                sleep((int)(Math.random() * 1500)); // 让线程休眠\n\
  \            } catch (InterruptedException e) {}\n            System.out.println(getName()\
  \ + \" running!\");\n        }\n    }\n}\n```\n- **第 5 步：运行程序**：点击运行 按钮运行程序，你可以看到输出：\n\
  **输出：**\n```\nThread One running!\nThread Two running!\nThread One running!\nThread\
  \ Two running!\n```\n**解析：** `thread1.start()` 和 `thread2.start()` 交替运行。`sleep((int)(Math.random()\
  \ * 1500))` 让一个线程休眠而另一个在运行。\n\n## 总结\n异常是程序运行发生的错误，会破坏正常执行流。`try-catch` 可以捕获并处理异常。当数组索引越界时，会发生异常。当字符索引越界时，会发生异常。`try-catch`\
  \ 块后面可以跟 `finally` 命令，它总是会被执行。`throw` 用于手动抛出异常和错误信息。任何方法都可以准备好手动抛出自己的异常。`e.getMessage()`\
  \ 显示错误信息。File 类用于显示文件的属性，检查文件是否存在、可写、可读、重命名文件。`new FileOutputStream(file-name)`\
  \ 创建输出流。`System.in.read()` 从键盘读取字符。`fout.write()` 将字符写入文件。`new FileInputStream(file-name)`\
  \ 创建输入流。`fin.read()` 读取文件内容。线程可以并发执行多个任务。每个线程代表一个子任务。创建线程有两种：1.继承 Thread；2. 实现 Runnable。\n\
