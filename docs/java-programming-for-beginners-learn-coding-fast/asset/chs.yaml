  \ 编程](https://www.amazon.com/-/e/B0863BQT8T)\n\n## 前言\n\n本书涵盖了所有必要的 Java 知识。你可以快速、轻松地掌握\
  \ Java 的核心技能。\n\n本书为初学者提供了超过 80 个实战示例，并包含了针对大学考试、工程师认证以及工作面试的测试与答案。\n\n\n\n\n\n\
  # 源代码下载\n\n本书提供了源代码下载；你可以下载源代码以便更好地学习，或者将源代码复制到你喜欢的编辑器中来测试程序。\n\n源代码下载链接：[https://forms.aweber.com/form/68/2126212468.htm]\n\
  \n**注意：** 本书仅适合初学者，不适合有经验的程序员。\n\n## 附录\n- 测试与答案\n- 推荐书籍\n\n# 第一章 开始 JAVA\n\n##\
  \ 安装 Java\n\n为了创建任何 Java 程序，需要在本地计算机系统上可用 Java 开发环境。\n\n`JDK`（也称为 `JSDK`, `Java\
  \ SE`）`JDK` (`Java Development Kit`) 包含了所有的 Java 类库以及所有构建和运行 Java 程序的工具。`JDK` 可以创建\
  \ Java 开发环境。\n\n下载 `JDK`：`http://oracle.com/download/com/download/http://www.oracle.com/technetwork/java/javase/downloads/index`\n\
  \n请点击链接在 Oracle 网站下载最新版本的 `JDK`。（图 1）\n\n如果你的计算机是 32 位操作系统，请下载 `x86` 版本的 `JDK`；如果你的计算机是\
  \ 64 位操作系统，请下载 `x64` 版本的 `JDK`。（图 2）\n\n将最新版本的 `JDK` 安装到你的计算机上。恭喜你！一旦成功安装 `JDK`，系统就准备好运行\
  \ Java 程序了！\n\n## IDE (集成开发环境)\n\n`IDE` (`Integrated Development Environment`) 用于编写、编辑和运行\
  \ Java。`IDE` 包含许多 Java 开发工具、编译器和调试器。互联网上有许多优秀的免费 IDE 可以下载，请通过以下链接下载一个 IDE：\n\n|\
  \ IDE(编辑器) | 网站地址 |\n| :--- | :--- |\n| Eclipse | `http://www.eclipse.org` |\n|\
  \ NetBeans | `https://netbeans.org/` |\n| DrJava | `http://www.drjava.org/` |\n\n\
  \n\n\n\n| Jedit | [`www.jedit.org/) [.`](http://www.jedit.org/) [jedit](http://www.jedit.org/)\
  \ [.](http://www.jedit.org/) [org/](http://www.jedit.org/) |\n| BlueJ | [`www.bluej.org/)\
  \ [.`](http://www.bluej.org/) [bluej](http://www.bluej.org/) [.](http://www.bluej.org/)\
  \ [org/](http://www.bluej.org/) |\n| JCreator | [`www.jcreator.com/) [.`](http://www.jcreator.com/)\
  \ [jcreator](http://www.jcreator.com/) [.](http://www.jcreator.com/) [com/](http://www.jcreator.com/)\
  \ |\n\n请在你的电脑上安装其中一种编辑器。（本本书使用 `Eclipse` 作为编辑器）。恭喜！一旦成功安装了 IDE，从现在起就可以编写、编辑和运行 Java\
  \ 程序了。\n\n## 什么是 Java？\nJava 是一种基于类的、面向对象的编程语言，它是一种安全、快速且可靠的程序，适用于互联网、数据库、手机以及无数种设备等通用领域。\n\
  \n### 示例 1.1\n```java\npublic class Hi{\n    public static void main (String [ ]\
  \ args){\n        System . out . print(“Hello World”);\n    }\n}\n```\n**输出：** Hello\
  \ World\n**解释：** `public class` 是两个关键字；它们用于声明 Java 程序。`Hi` 是程序名。`public static void\
  \ main (String [ ] args) {… }` 用于声明主方法。`main` 方法包含要执行的主程序代码。`String [ ] args` 用于手动接受输入。`System.\
  \ out. print( )` 用于显示或打印。每个 Java 命令都应该以分号（`;`）结束。\n\n## 运行第一个程序\n`Eclipse`是最流行的\
  \ Java IDE（集成开发环境）之一。它用于编写、编辑、调试和运行 Java 程序。\n\n### 下载 Eclipse 安装程序\n[`www.eclipse.org/downloads/)\
  \ [.`](http://www.eclipse.org/downloads/) [eclipse](http://www.eclipse.org/downloads/)\
  \ [.](http://www.eclipse.org/downloads/) [org/downloads/](http://www.eclipse.org/downloads/)\n\
  \n请点击链接从 `Eclipse` 网站下载最新版本的 `Eclipse Installer`（图 1）！\n\n### 解压 Eclipse 文件\n注意：不需要安装，`Eclipse`\
  \ 应该解压到你喜的目录中。例如，`C:\\Eclipse`。请在桌面上为 `eclipse.exe` 创建快捷方式。（重申：`Eclipse` 不需要安装，但应该解压到某个目录中。）\n\
  \n### 运行 Eclipse\n双击 `eclipse.exe` 运行 `Eclipse`，设置默认工作区，勾选“使用此作为默认且不再询问”，并点击确定，如图\
  \ 2 和图 3 所示。\n\n## 编写并运行第一个 Java 程序\n### 步骤 1：创建 Java 项目\n启动 `Eclipse` > `File`\
  \ > `New` > `Java Project` > `Project Name` > “FirstProject” > `Finish`。（图 4）\n\n\
  ### 步骤 2：创建包\n包（Package）用于包含不同类别的 Java 文件。不同的包包含不同的 Java 文件。选择项目 “FirstProject”\
  \ > `new` > `package` > `name` > “newPackage” > `Finish`。（图 5）\n\n### 步骤 3：创建类\n\
  选择包 “newPackage” > `new` > `class` > `name` > “HelloWorld” > `Finish`。（图 6）\n\n\
  ### 步骤 4：编写 Java 代码\n在 `Eclipse` 中编写 Java 代码。（图 7）\n\n### 示例 1.2\n```java\npackage\
  \ newPackage;\npublic class HelloWorld {\n  public static void main (String[] args){\n\
  \    System. out. print(\"Hello World! \");\n  }\n}\n```\n（图 7 Eclipse 中的 Java 程序）\n\
  \n### 步骤 5：运行程序\n点击工具栏中的白色三角形绿色按钮运行程序，你可以看到输出：（图 8）\n**输出：**\n恭喜！由 `Eclipse` 运行的第一个\
  \ Java 程序成功了！\n\n## Java 注释\n```java\n//*  ……  */\n```\nJava 注释用于解释当前代码，描述代码正在做什么。Java\
  \ 编译器将忽略注释。`//` 用于单行注释。`/*…*/` 用于多行注释。\n\n### 示例 1.3\n```java\nSystem. out. println\
  \ (“Hello World”);  // show “Hello World”\n/*   System . out . println( ) 是一个 Java\
  \ 输出命令，意味着显示或打印 .*/\n```\n**解释：** `// show “Hello World”` 是单行注释。`/* System . out\
  \ . println( ) is a Java output command, meaning display or print . */` 是多行注释。\n\
  \n## 输出命令\n```java\nSystem. out. print ( );  // 在同一行打印结果。\nSystem. out. println\
  \ ( );  // 在不同行打印结果。\n```\n\n### 示例 1.4\n```java\nSystem. out. print( \"1 \" );\n\
  System. out. print( \"2 \" );\nSystem. out. print( \"3\" );\n```\n**输出：** 1 2 3\n\
  解释解释 `System. out. print( )` 在同一行打印。`System. out. println( )` 在不同行打印。\n\n## 转义字符\n\
  `\\` 字符用于转义：\n- `\\n` 将内容输出到下一行。\n- `\\r` 产生返回。\n- `\\t` 制表符。\n\n### 示例 1.5\n```java\n\
  public class Hi{\n    public static void main (String [ ] args){\n        System.\
  \ out. print(\"Hello World\");\n    }\n}\n```\n**解释：** `\"` 输出双引号。注意 `Hello World`\
  \ 带有双引号。\n\n## 关键字\n某些单词被语言保留：\n| `abstract` | `byte` | `char` | `continue` | `double`\
  \ | `float` | `implements` | `interface` | `package` | `public` | `this` | `try`\
  \ | `const` | `new` | `while` |\n\n## 数据类型\n| 数据类型 | 解释 |\n| :--- | :--- |\n| `String`\
  \ | 双引号的字符串 |\n| `char` | 单引号的单字符 |\n| `int` | 整数 |\n| `float` | 浮点数 |\n| `boolean`\
  \ | 真或假的值 |\n| `double` | 大浮点数 |\n\n## 创建变量\n变量是与值关联的符号名称。使用以下语法可以创建变量：\n`dataType\
  \ variableName = value;`\n\n### 示例 1.8\n```java\npublic static void main (String\
  \ [ ] args ) {\n  String mystring = “Hello World”;\n  char mychar = ‘m’;\n  int\
  \ myinteger = 168168;\n  double myflt = 28.98;\n  boolean mybool = true;\n}\n```\n\
  **解释：** `mystring` 是变量名，其值为 “Hello World”。 `myinteger` 是变量名，其值为 168168。`mybool`\
  \ 是变量名，其值为 true。\n\n 算术运算符\n| 运算符 |\n| :--- |\n| `+` |\n| `-` |\n| `*` |\n| `/`\
  \ |\n| `%` |\n| `++` |\n| `--` |\n\n\n\n\n\n### 示例 1.9\n```java\npublic class TryClass{\n\
  \    public static void main (String [ ] args) {\n        int sum = 100 + 200;\n\
  \        String str = \"We love\" + \"Java\";\n        int incre = 10;\n       \
  \ incre = ++ incre;\n        System. out. println ( sum );    // 输出: 300\n     \
  \   System. out.println ( str );   // 输出: We love Java.\n        System. out.println\
  \ ( incre ); // 输出: 11\n    }\n}\n```\n**输出:**\n300\nWe love Java\n11\n\n### 解释\n\
  - `int sum = 100 + 200` 表示 100 加 200。\n- `String str = “We love” + “Java\"` 连接了两个字符串。\n\
  - `++incre` 将其值增加 1。\n\n## 逻辑运算符\n\n| 运算符 |\n| :--- |\n| `&&` |\n| `||` |\n| `!`\
  \ |\n\n使用逻辑运算符后，结果将为 `true` 或 `false`。\n\n### 示例 1.10\n```java\npublic class TryClass{\n\
  \    public static void main (String [ ] args) {\n        boolean x=true;\n    \
  \    boolean y=false;\n        boolean a, b, c;\n        a= x && y;\n        System.\
  \ out. print(a);   // 输出: false\n        b=x || y;\n        System. out. print(b);\
  \   // 输出: true\n        c=! x;\n        System. out. print(c);   // 输出: false\n\
  \    }\n}\n```\n\n### 解释\n- `true && true;` 返回 `true;`\n- `true && false;` 返回 `false;`\n\
  - `false && false;` 返回 `false;`\n- `true || true;` 返回 `true;`\n- `true || false;`\
  \ 返回 `true;`\n- `false || false;` 返回 `false;`\n- `! false;` 返回 `true;`\n- `! true;`\
  \ 返回 `false;`\n\n## 赋值运算符\n\n| 运算符 |\n| :--- |\n| `+=` |\n| `-=` |\n| `*=` |\n|\
  \ `/=` |\n| `%=` |\n\n### 示例 1.11\n```java\nint x=200; int y=100;\nx+= y; System.\
  \ out. print(x);\nx-= y; System. out. print(x);\nx/= y; System. out. print(x);\n\
  x%= y; System. out. print(x);\n```\n\n### 解释\n- `x+=y;` // `x=x+y`, `x=200+100`,\
  \ 输出 300 .\n- `x-=y;` // `x=x-y`, `x=200-100`, 输出 100 .\n- `x/=y;` // `x=x/y`, `x=200/100`,\
  \ 输出 2 .\n- `x%y;` // `x=%y`, `x=200%100`, 输出 0 .\n\n## 比较运算符\n\n| 运算符 |\n| :---\
  \ |\n| `>` |\n| `<` |\n| `>=` |\n| `<=` |\n| `==` |\n| `!=` |\n\n使用比较运算符后，结果将为 `true`\
  \ 或 `false`。\n\n### 示例 1.12\n```java\nint x=200; int y=100;\nboolean result1=(x>\
  \ y); System. out. print(result1);\nboolean result2=(x<= y); System. out. print(result2);\n\
  boolean result3=(x!= y ); System. out. print(result3);\n```\n\n### 解释\n- `x>y` //\
  \ 测试 200>100, 输出 true .\n- `x<=y` // 测试 200<=100, 输出 false .\n- `x!=y` // 测试 200\
  \ !=100, 输出 true .\n\n## 三元运算符\n三元运算符的语法如下所示：\n\n| `(test-expression) ? (if-true-do-this)\
  \ : (if-false-do-this);` |\n\n`(test-expression)` 例如 `a<b`、`x!= y`、`m==n` 等。\n\n\
  ### 示例 1.13\n```java\nint a=100; int b=200;\nString result1 = (a<b) ? ”apple” :\
  \ ”banana”;\nSystem. out. print ( result1);\n```\n**输出:**\napple\n\n### 示例 1.14\n\
  ```java\nint a=100; int b=200;\nString result2 = (a>b) ? ”apple” : ”banana”;\nSystem.\
  \ out. print ( result2 );\n```\n**输出:**\nbanana\n\n### 解释\n如果测试表达式返回 `true`，则输出“apple”。\n\
  如果测试表达式返回 `false`，则输出“banana”。\n\n## 练习：计算\n使用 Eclipse 编写运行 Java 程序\n\n### 步骤 1：创建\
  \ Java 项目\n启动 Eclipse > `File` > `New` > `Java Project` > `Project Name` > “Test”\
  \ > `Finish`。（图 1）\n\n### 步骤 2：创建包\n包（Package）用于包含各种类的 Java 文件。不同的包包含不同的 Java 文件。\n\
  选择项目 “Test” > `New` > `package` > “myPackage” > `Finish`。\n\n### 步骤 3：创建类\n选择 “myPackage”\
  \ > `New` > `class` > “Calculation” > `Finish`。（图 2）\n\n### 步骤 4：编写 Java 代码\n在 Eclipse\
  \ 中编写 Java 代码：\n```java\npackage myPackage;\npublic class Calculation{\n  public\
  \ static void main (String args ]){\n    int a=100; int b=200;\n    String result1\
  \ = (a<b) ? ”apple” : ”banana”;\n    System. out. print ( result1);\n\n  }\n}\n\
  ```\n\n### 步骤 5：运行程序\n点击运行按钮运行程序，你可以看到：\n**输出:**\napple\n\n## 总结\n- `//` 是单行注释。\n\
  - `/*...*/` 是多行注释。\n- `System. out.print() ` 会打印结果。\n- `System. out.println() `\
  \ 会打印并换行。\n- 三元运算符用于条件判断。\n- `if` 语句用于条件判断。\n- `if-else` 语句用于条件判断。\n- `switch` 语句用于多分支选择。\n\
  - `for` 循环用于指定次数循环。\n- `while` 循环用于条件循环。\n- `do-while` 循环用于至少执行一次的循环。\n\n\n\n\n\n\
  `do... while` 循环执行一次代码块，然后如果指定的条件为真，则重复该循环。\n\n示例 2.6\n```java\npublic class TryClass{\n\
  \    public static void main (String [ ] args){\n        int counter=0;\n      \
  \  do {\n            System. out. print ( \"@\");\n            counter++;\n    \
  \    } while (counter<8);\n        // 执行 8 次\n    }\n}\n```\n输出: `@@@@@@@@`\n解释：`“counter<\
  \ 8”` 是一个测试表达式，如果条件为真，代码将循环少于 8 次，直到 `counter` 等于 8 为止，此时条件为假，代码将停止运行。\n\n## break\
  \ 语句\n\n| `break;` |\n\n`break` 关键字用于根据条件停止循环的运行。\n\n示例 2.7\n```java\npublic class\
  \ TryClass{\n    public static void main (String [ ] args){\n        int num=0;\n\
  \        while (num<10){\n            if (num==5)\n                break;     //\
  \ 离开 while 循环\n            num++;\n        }\n        System. out. print( num );\n\
  \    }\n}\n```\n输出: `5`\n解释：`“if (num==5) break;”` 是一个 break 语句。如果 `num` 为 5，程序将执行\
  \ `break` 命令，break 语句将离开 while 循环，然后执行 `System. out. print(num)`。\n\n## continue\
  \ 语句\n\n| `continue;` |\n\n`continue` 关键字用于停止当前的迭代，忽略后续代码，然后继续下一次循环。\n\n示例 2.8\n\
  ```java\npublic class TryClass{\n    public static void main (String [ ] args){\n\
  \        int num=0;\n        while (num<10){\n            num++;\n            if\
  \ (num==5)\n                continue;     // 进入下一次 while 循环\n            System.\
  \ out. print( num );\n        }\n    }\n}\n```\n输出: `1234678910`\n解释：注意输出中没有 5。`“if\
  \ (num==5) continue;”` 包含了 `continue` 命令。当 `num` 为 5 时，程序将执行 `continue`，跳过下一个命令\
  \ `System. out. print( num )`，然后继续下一次 while 循环。\n\n## 布尔表达式\n\n| `If ( bool-expression\
  \ ) { statements }` | `while ( boolean-expression ) { statement }` |\n\n`boolean-expression`\
  \ 应该是一个测试表达式。例如：`a>b;`；`x<=y;`；`m!=n;`。它不能仅仅是一个变量。\n\n示例 2.9\n```java\npublic class\
  \ TryClass{\n    public static void main (String [ ] args){\n        int num=10;\n\
  \        if( num ){\n            // 错误！因为“num”不是布尔表达式\n            System. out.\
  \ print (\"No good\");\n        }\n        while ( num ){\n            // 错误！“num”不是布尔表达式\n\
  \            System. out. print (\"No good\");\n        }\n    }\n}\n```\n解释：`if(\
  \ num )` 和 `while ( num )` 不是正确的代码，因为 `()` 内部应该是一个 `boolean-expression`，例如 `if(num\
  \ ==10)` 和 `while(num<10)` 是正确的！\n\n## 练习：运行 100 次\n\n## While 语句程序\n\n启动 Eclipse\
  \ > 选择 `“myPackage” > new > class > name > `WhileStatement` > Finish。在 Eclipse 中编写以下代码。\n\
  \n```java\npackage myPackage;\npublic class WhileStatement {\n    public static\
  \ void main(String[ ] args) {\n        int n = 1;\n        int sum = 0;\n      \
  \  while(n <= 100) {\n            // 执行 100 次\n            sum += n;    // sum =\
  \ sum + n\n            n++;\n        }\n        System. out. println(\"Sum = \"\
  \ + sum);\n    }\n}\n```\n输出: `Sum = 5050`\n解释：`“n<=100”` 是一个测试表达式，如果条件为真，代码将循环少于\
  \ 100 次，直到 `counter` 等于 100 为止，此时条件为假，代码将停止运行。`“sum += n;”` 等同于 `“sum = sum + n”`。`“n++;”`\
  \ 意味着 `n` 在每次循环中增加 1。\n\n## 总结\n\n- `if 语句` 仅在指定条件为真时执行 `{ … }` 中的代码，如果条件为假，则不执行\
  \ `{…}` 中的任何代码。\n- `if... else 语句` 在条件为真时运行某些代码，在条件为假时运行另一部分代码。\n- `Switch 语句`：变量的值将与每个\
  \ `case` 进行比较，如果等于某个 `“case”` 值，将执行该 `“case”` 代码。`break;` 终止执行。\n- `for 循环` 按指定的次数运行代码块。\n\
