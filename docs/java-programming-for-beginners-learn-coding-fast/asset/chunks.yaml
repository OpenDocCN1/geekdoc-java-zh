  trans: "\n\n# 示例 1.9\n```java\npublic class TryClass{\n    public static void main\
    \ (String [ ] args) {\n        int sum = 100 + 200;\n        String str = \"We\
    \ love\" + \"Java\";\n        int incre = 10;\n        incre = ++ incre;\n   \
    \     System. out. println ( sum );    // 输出: 300\n        System. out.println\
    \ ( str );   // 输出: We love Java.\n        System. out.println ( incre ); // 输出:\
    \ 11\n    }\n}\n```\n**输出:**\n300\nWe love Java\n11\n\n### 解释\n- `int sum = 100\
    \ + 200` 表示 100 加 200。\n- `String str = “We love” + “Java\"` 连接了两个字符串。\n- `++incre`\
    \ 将其值增加 1。\n\n## 逻辑运算符\n\n| 运算符 |\n| :--- |\n| `&&` |\n| `||` |\n| `!` |\n\n使用逻辑运算符后，结果将为\
    \ `true` 或 `false`。\n\n## 示例 1.10\n```java\npublic class TryClass{\n    public\
    \ static void main (String [ ] args) {\n        boolean x=true;\n        boolean\
    \ y=false;\n        boolean a, b, c;\n        a= x && y;\n        System. out.\
    \ print(a);   // 输出: false\n        b=x || y;\n        System. out. print(b);\
    \   // 输出: true\n        c=! x;\n        System. out. print(c);   // 输出: false\n\
    \    }\n}\n```\n\n### 解释\n- `true && true;` 返回 `true;`\n- `true && false;` 返回\
    \ `false;`\n- `false && false;` 返回 `false;`\n- `true || true;` 返回 `true;`\n- `true\
    \ || false;` 返回 `true;`\n- `false || false;` 返回 `false;`\n- `! false;` 返回 `true;`\n\
    - `! true;` 返回 `false;`\n\n## 赋值运算符\n\n| 运算符 |\n| :--- |\n| `+=` |\n| `-=` |\n\
    | `*=` |\n| `/=` |\n| `%=` |\n\n## 示例 1.11\n```java\nint x=200; int y=100;\nx+=\
    \ y; System. out. print(x);\nx-= y; System. out. print(x);\nx/= y; System. out.\
    \ print(x);\nx%= y; System. out. print(x);\n```\n\n### 解释\n- `x+=y;` // `x=x+y`,\
    \ `x=200+100`, 输出 300 .\n- `x-=y;` // `x=x-y`, `x=200-100`, 输出 100 .\n- `x/=y;`\
    \ // `x=x/y`, `x=200/100`, 输出 2 .\n- `x%y;` // `x=%y`, `x=200%100`, 输出 0 .\n\n\
    ## 比较运算符\n\n| 运算符 |\n| :--- |\n| `>` |\n| `<` |\n| `>=` |\n| `<=` |\n| `==` |\n\
    | `!=` |\n\n使用比较运算符后，结果将为 `true` 或 `false`。\n\n## 示例 1.12\n```java\nint x=200;\
    \ int y=100;\nboolean result1=(x> y); System. out. print(result1);\nboolean result2=(x<=\
    \ y); System. out. print(result2);\nboolean result3=(x!= y ); System. out. print(result3);\n\
    ```\n\n### 解释\n- `x>y` // 测试 200>100, 输出 true .\n- `x<=y` // 测试 200<=100, 输出 false\
    \ .\n- `x!=y` // 测试 200 !=100, 输出 true .\n\n## 三元运算符\n三元运算符的语法如下所示：\n\n| `(test-expression)\
    \ ? (if-true-do-this) : (if-false-do-this);` |\n\n`(test-expression)` 例如 `a<b`、`x!=\
    \ y`、`m==n` 等。\n\n## 示例 1.13\n```java\nint a=100; int b=200;\nString result1 =\
    \ (a<b) ? ”apple” : ”banana”;\nSystem. out. print ( result1);\n```\n**输出:**\n\
    apple\n\n## 示例 1.14\n```java\nint a=100; int b=200;\nString result2 = (a>b) ?\
    \ ”apple” : ”banana”;\nSystem. out. print ( result2 );\n```\n**输出:**\nbanana\n\
    \n### 解释\n如果测试表达式返回 `true`，则输出“apple”。\n如果测试表达式返回 `false`，则输出“banana”。\n\n## 练习：计算\n\
    使用 Eclipse 编写运行 Java 程序\n\n### 步骤 1：创建 Java 项目\n启动 Eclipse > `File` > `New` >\
    \ `Java Project` > `Project Name` > “Test” > `Finish`。（图 1）\n\n### 步骤 2：创建包\n\
    包（Package）用于包含各种类的 Java 文件。不同的包包含不同的 Java 文件。\n选择项目 “Test” > `New` > `package`\
    \ > “myPackage” > `Finish`。\n\n### 步骤 3：创建类\n选择 “myPackage” > `New` > `class`\
    \ > “Calculation” > `Finish`。（图 2）\n\n### 步骤 4：编写 Java 代码\n在 Eclipse 中编写 Java\
    \ 代码：\n```java\npackage myPackage;\npublic class Calculation{\n  public static\
    \ void main (String args ]){\n    int a=100; int b=200;\n    String result1 =\
    \ (a<b) ? ”apple” : ”banana”;\n    System. out. print ( result1);\n\n  }\n}\n\
    ```\n\n### 步骤 5：运行程序\n点击运行按钮运行程序，你可以看到：\n**输出:**\napple\n\n## 总结\n- `//` 是单行注释。\n\
    - `/*...*/` 是多行注释。\n- `System. out.print() ` 会打印结果。\n- `System. out.println()\
    \ ` 会打印并换行。\n- 三元运算符用于条件判断。\n- `if` 语句用于条件判断。\n- `if-else` 语句用于条件判断。\n- `switch`\
    \ 语句用于多分支选择。\n- `for` 循环用于指定次数循环。\n- `while` 循环用于条件循环。\n- `do-while` 循环用于至少执行一次的循环。\n\
    \n"
- fmt: "\n`do... while` loops through a block of code once, and then repeats the loop\
    \ if the specified condition is true. \n\nExample 2.6\n```java\npublic class TryClass{\n\
    \    public static void main (String [ ] args){\n        int counter=0;\n    \
    \    do {\n            System. out. print ( \"@\");\n            counter++;\n\
    \        } while (counter<8);\n        // run 8 times\n    }\n}\n```\nOutput:\
    \ `@@@@@@@@`\nExplanation: `“counter< 8”` is a test expression, if the condition\
    \ is true, the code will loop less than 8 times, until the `counter` is 8, then\
    \ the condition is false, the code will stop running.\n\n## Break Statement\n\n\
    | `break;` |\n\n`break` keyword is used to stop the running of a loop according\
    \ to the condition.\n\nExample 2.7\n```java\npublic class TryClass{\n    public\
    \ static void main (String [ ] args){\n        int num=0;\n        while (num<10){\n\
    \            if (num==5)\n                break;     // leave the while loop\n\
    \            num++;\n        }\n        System. out. print( num );\n    }\n}\n\
    ```\nOutput: `5`\nExplanation: `“if (num==5) break;”` is a break statement. If\
    \ `num` is 5, the program will run the `break` command, the break statement will\
    \ leave the while loop, then run `System. out. print(num)`.\n\n## Continue Statement\n\
    \n| `continue;` |\n\n`continue` keyword is used to stop the current iteration,\
    \ ignoring the following code, and then continue the next loop.\n\nExample 2.8\n\
    ```java\npublic class TryClass{\n    public static void main (String [ ] args){\n\
    \        int num=0;\n        while (num<10){\n            num++;\n           \
    \ if (num==5)\n                continue;     // go to next while loop\n      \
    \      System. out. print( num );\n        }\n    }\n}\n```\nOutput: `1234678910`\n\
    Explanation: Note that the output has no 5. `“if (num==5) continue;”` includes\
    \ `continue` command. When the `num` is 5, the program will run `continue`, skipping\
    \ the next command `System. out. print( num )`, and then continue the next while\
    \ loop.\n\n## Boolean-Expression\n\n| `If ( bool-expression ) { statements }`\
    \ | `while ( boolean-expression ) { statement }` |\n\nThe `boolean-expression`\
    \ should be a test expression. For example: `a>b;`; `x<=y;`; `m!=n;`. It cannot\
    \ be a variable only.\n\nExample 2.9\n```java\npublic class TryClass{\n    public\
    \ static void main (String [ ] args){\n        int num=10;\n        if( num ){\n\
    \            // erro r ! because “num” is not a bool-expression\n            System.\
    \ out. print (\"No good\");\n        }\n        while ( num ){\n            //\
    \ erro r ! for “num” is not a bool-expression\n            System. out. print\
    \ (\"No good\");\n        }\n    }\n}\n```\nExplanation: `if( num )` and `while\
    \ ( num )` are not correct codes, because it should be a `boolean-expression`\
    \ inside the `()`, for example, `if(num ==10)` and `while(num<10)` are correct!\n\
    \n## Exercise: Run 100 Times\n\n## While Statement Program\n\nStart up Eclipse\
    \ > Select `“myPackage” > new > class > name > `WhileStatement` > Finish. Write\
    \ following codes in Eclipse.\n\n```java\npackage myPackage;\npublic class WhileStatement\
    \ {\n    public static void main(String[ ] args) {\n        int n = 1;\n     \
    \   int sum = 0;\n        while(n <= 100) {\n            // run 100 times\n  \
    \          sum += n;    // sum = sum + n\n            n++;\n        }\n      \
    \  System. out. println(\"Sum = \" + sum);\n    }\n}\n```\nOutput: `Sum = 5050`\n\
    Explanation: `“n<=100”` is a test expression, if the condition is true, the code\
    \ will loop less than 100 times, until the `counter` is 100, then the condition\
    \ is false, the code will stop running. `“sum += n;”` is the same as `“sum = sum\
    \ + n”`. `“n++;”` means `“n”` increases 1 in each loops.\n\n## Summary\n\n- `if\
    \ statement` executes codes inside `{ … }` only if a specified condition is true,\
    \ does not execute any codes inside `{…}` if the condition is false.\n- `if...\
    \ else statement` runs some code if a condition is true and another code if the\
    \ condition is false.\n- `Switch statement`: The value of the variable will compare\
    \ each `case` first, if equals one of the `“case”` values; it will execute that\
    \ `“case”` code. `break;` terminates the code running.\n- `for loop` runs a block\
    \ of code by the specified number of times.\n- `while loop` loops through a block\
    \ of code if the specified condition is true.\n- `do... while` loops through a\
    \ block of code once, and then repeats the loop if the specified condition is\
    \ true.\n- `break` keyword is used to stop the running of a loop according to\
    \ the condition.\n- `continue` keyword is used to stop the current iteration,\
    \ ignoring the following code, and then continue the next loop.\n\n## Chapter\
    \ 3 Array & Math\n\n## Create an Array (1)\n\nAn array is a variable, which can\
    \ contain multiple values. The first method to create an array as following:\n\
    \n| `int array-name[ ] = {“value0”, “value1”, “value2”,…};` |\n\nExample 3.1\n\
    ```java\nint myarray[ ] = { 10,20,30,40 }; // create an array\n```\nExplanation:\
    \ The above code creates an array named `“myarray”`, which has four elements:\n\
    - The 1st element is `myarray[0]` with value 10. Key is 0.\n- The 2nd element\
    \ is `myarray[1]` with value 20. Key is 1.\n- The 3rd element is `myarray[2]`\
    \ with value 30. Key is 2.\n- The 4th element is `myarray[3]` with value 40. Key\
    \ is 3.\n\n## Create an Array (2)\n\nAn array is a variable, which can contain\
    \ multiple values. The second method to create an array as following:\n\n| `int\
    \ array-name[ ] = new int[]{“value0”, “value1”, “value2”};` |\n\nExample 3.2\n\
    ```java\nint myArray[] = new int[3];\nmyArray[0] = 10;\nmyArray[1] = 20;\nmyArray[2]\
    \ = 30;\n```\nExplanation: The above code creates an array named `“myArray”`,\
    \ which has three elements:\n- The 1st element is `myArray[0]` with value 10.\n\
    - The 2nd element is `myArray[1]` with value 20.\n- The 3rd element is `myArray[2]`\
    \ with value 30.\n\n## Array Length\n\n| `array-name.length;` |\n\nThe `array-name.length`\
    \ returns the total number of elements.\n\nExample 3.3\n```java\npublic class\
    \ TryClass{\n    public static void main (String [ ] args){\n        int arr[\
    \ ] = {10,20,30};\n        int num = arr.length;\n        System. out. print(\
    \ num );\n    }\n}\n```\nOutput: `3`\nExplanation: `“arr. length;` is used to\
    \ get number of elements.\n\n## Element Value\n\n| `int value = array[index];`\
    \ |\n| `int array[index] = value;` |\n\nExample 3.4\n```java\npublic class TryClass{\n\
    \    public static void main (String [ ] args){\n        int arr[ ] = {10,20,30,40,50};\n\
    \        int value = arr[2];\n        System. out. print ( value );\n    }\n}\n\
    ```\nOutput: `30`\nExplanation: `int value = arr[2];` gets a value 30 from `arr[2]`.\n\
    \nExample 3.5\n```java\npublic class TryClass{\n    public static void main (String\
    \ [ ] args){\n        int num[ ] = new int[5];\n        num[2] = 800;\n      \
    \  System. out. println ( num[2]);\n    }\n}\n```\nOutput: `800`\nExplanation:\
    \ `“num[2] = 800;”` sets a value 800 to the element `num[2]`.\n\n## Sort Array\
    \ Elements\n\n| `Arrays.sort (array-name);` |\n\n`“Arrays. sort (array-name);”`\
    \ can sort the array, and display the result in order. Before using `Arrays.sort()`,\
    \ you must `import java.util.Arrays`.\n\nExample 3.6\n```java\npackage tryPackage;\n\
    import java. util. Arrays;\npublic class TryClass{\n    public static void main\
    \ (String [ ] args){\n        String myarray[ ] = { \"Cat\", \"Apple\", \"Dog\"\
    , \"Boy\"};\n        Arrays.sort (myarray); // sort the array\n        for(int\
    \ num=0; num<myarray. length; num++){\n            System. out. print (myarray[num]+\"\
    \ \"); //num is a key\n        }\n    }\n}\n```\nOutput: `Apple Boy Cat Dog `\n\
    Explanation: `“Arrays. sort (myarray);”` sorts the array `myarray` by its element.\
    \ `“myarray. length”` returns `myarray`’s length that is 4.\n\n## Math Methods\n\
    \n| Method | Returns |\n| :--- | :--- |\n| `abs()` | a number’s absolute value\
    \ |\n| `ceil()` | an integer greater than or equal to its argument |\n| `cos()`\
    \ | an angle’s trigonometric cosine |\n| `exp()` | a number’s `Math.E` to the\
    \ power |\n| `floor()` | an integer less than or equal to its argument. |\n| `log()`\
    \ | a number’s natural logarithm |\n| `random()` | a random positive value from\
    \ 0 to 1 |\n| `max()` | a greater between two numbers |\n| `min()` | a smaller\
    \ between two numbers |\n| `pow()` | the first argument to the power of the second\
    \ |\n| `round()` | the closest long or int |\n| `sin()` | an angle’s trigonometric\
    \ sine |\n| `sqrt()` | a number’s square root |\n| `tan()` | an angle’s trigonometric\
    \ tangent |\n"
