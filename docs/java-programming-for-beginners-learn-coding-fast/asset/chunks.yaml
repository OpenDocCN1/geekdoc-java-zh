    \ [.](http://www.jedit.org/) [org/](http://www.jedit.org/) |\n| BlueJ | [`www.bluej.org/)\
    \ [.`](http://www.bluej.org/) [bluej](http://www.bluej.org/) [.](http://www.bluej.org/)\
    \ [org/](http://www.bluej.org/) |\n| JCreator | [`www.jcreator.com/) [.`](http://www.jcreator.com/)\
    \ [jcreator](http://www.jcreator.com/) [.](http://www.jcreator.com/) [com/](http://www.jcreator.com/)\
    \ |\n\n请在你的电脑上安装其中一种编辑器。（本本书使用 `Eclipse` 作为编辑器）。恭喜！一旦成功安装了 IDE，从现在起就可以编写、编辑和运行\
    \ Java 程序了。\n\n## 什么是 Java？\nJava 是一种基于类的、面向对象的编程语言，它是一种安全、快速且可靠的程序，适用于互联网、数据库、手机以及无数种设备等通用领域。\n\
    \n### 示例 1.1\n```java\npublic class Hi{\n    public static void main (String [\
    \ ] args){\n        System . out . print(“Hello World”);\n    }\n}\n```\n**输出：**\
    \ Hello World\n**解释：** `public class` 是两个关键字；它们用于声明 Java 程序。`Hi` 是程序名。`public\
    \ static void main (String [ ] args) {… }` 用于声明主方法。`main` 方法包含要执行的主程序代码。`String\
    \ [ ] args` 用于手动接受输入。`System. out. print( )` 用于显示或打印。每个 Java 命令都应该以分号（`;`）结束。\n\
    \n## 运行第一个程序\n`Eclipse`是最流行的 Java IDE（集成开发环境）之一。它用于编写、编辑、调试和运行 Java 程序。\n\n###\
    \ 下载 Eclipse 安装程序\n[`www.eclipse.org/downloads/) [.`](http://www.eclipse.org/downloads/)\
    \ [eclipse](http://www.eclipse.org/downloads/) [.](http://www.eclipse.org/downloads/)\
    \ [org/downloads/](http://www.eclipse.org/downloads/)\n\n请点击链接从 `Eclipse` 网站下载最新版本的\
    \ `Eclipse Installer`（图 1）！\n\n### 解压 Eclipse 文件\n注意：不需要安装，`Eclipse` 应该解压到你喜的目录中。例如，`C:\\\
    Eclipse`。请在桌面上为 `eclipse.exe` 创建快捷方式。（重申：`Eclipse` 不需要安装，但应该解压到某个目录中。）\n\n###\
    \ 运行 Eclipse\n双击 `eclipse.exe` 运行 `Eclipse`，设置默认工作区，勾选“使用此作为默认且不再询问”，并点击确定，如图\
    \ 2 和图 3 所示。\n\n## 编写并运行第一个 Java 程序\n### 步骤 1：创建 Java 项目\n启动 `Eclipse` > `File`\
    \ > `New` > `Java Project` > `Project Name` > “FirstProject” > `Finish`。（图 4）\n\
    \n### 步骤 2：创建包\n包（Package）用于包含不同类别的 Java 文件。不同的包包含不同的 Java 文件。选择项目 “FirstProject”\
    \ > `new` > `package` > `name` > “newPackage” > `Finish`。（图 5）\n\n### 步骤 3：创建类\n\
    选择包 “newPackage” > `new` > `class` > `name` > “HelloWorld” > `Finish`。（图 6）\n\n\
    ### 步骤 4：编写 Java 代码\n在 `Eclipse` 中编写 Java 代码。（图 7）\n\n### 示例 1.2\n```java\npackage\
    \ newPackage;\npublic class HelloWorld {\n  public static void main (String[]\
    \ args){\n    System. out. print(\"Hello World! \");\n  }\n}\n```\n（图 7 Eclipse\
    \ 中的 Java 程序）\n\n### 步骤 5：运行程序\n点击工具栏中的白色三角形绿色按钮运行程序，你可以看到输出：（图 8）\n**输出：**\n\
    恭喜！由 `Eclipse` 运行的第一个 Java 程序成功了！\n\n## Java 注释\n```java\n//*  ……  */\n```\nJava\
    \ 注释用于解释当前代码，描述代码正在做什么。Java 编译器将忽略注释。`//` 用于单行注释。`/*…*/` 用于多行注释。\n\n### 示例 1.3\n\
    ```java\nSystem. out. println (“Hello World”);  // show “Hello World”\n/*   System\
    \ . out . println( ) 是一个 Java 输出命令，意味着显示或打印 .*/\n```\n**解释：** `// show “Hello\
    \ World”` 是单行注释。`/* System . out . println( ) is a Java output command, meaning\
    \ display or print . */` 是多行注释。\n\n## 输出命令\n```java\nSystem. out. print ( ); \
    \ // 在同一行打印结果。\nSystem. out. println ( );  // 在不同行打印结果。\n```\n\n### 示例 1.4\n```java\n\
    System. out. print( \"1 \" );\nSystem. out. print( \"2 \" );\nSystem. out. print(\
    \ \"3\" );\n```\n**输出：** 1 2 3\n解释解释 `System. out. print( )` 在同一行打印。`System. out.\
    \ println( )` 在不同行打印。\n\n## 转义字符\n`\\` 字符用于转义：\n- `\\n` 将内容输出到下一行。\n- `\\r` 产生返回。\n\
    - `\\t` 制表符。\n\n### 示例 1.5\n```java\npublic class Hi{\n    public static void\
    \ main (String [ ] args){\n        System. out. print(\"Hello World\");\n    }\n\
    }\n```\n**解释：** `\"` 输出双引号。注意 `Hello World` 带有双引号。\n\n## 关键字\n某些单词被语言保留：\n| `abstract`\
    \ | `byte` | `char` | `continue` | `double` | `float` | `implements` | `interface`\
    \ | `package` | `public` | `this` | `try` | `const` | `new` | `while` |\n\n##\
    \ 数据类型\n| 数据类型 | 解释 |\n| :--- | :--- |\n| `String` | 双引号的字符串 |\n| `char` | 单引号的单字符\
    \ |\n| `int` | 整数 |\n| `float` | 浮点数 |\n| `boolean` | 真或假的值 |\n| `double` | 大浮点数\
    \ |\n\n## 创建变量\n变量是与值关联的符号名称。使用以下语法可以创建变量：\n`dataType variableName = value;`\n\
    \n### 示例 1.8\n```java\npublic static void main (String [ ] args ) {\n  String\
    \ mystring = “Hello World”;\n  char mychar = ‘m’;\n  int myinteger = 168168;\n\
    \  double myflt = 28.98;\n  boolean mybool = true;\n}\n```\n**解释：** `mystring`\
    \ 是变量名，其值为 “Hello World”。 `myinteger` 是变量名，其值为 168168。`mybool` 是变量名，其值为 true。\n\
    \n 算术运算符\n| 运算符 |\n| :--- |\n| `+` |\n| `-` |\n| `*` |\n| `/` |\n| `%` |\n| `++`\
    \ |\n| `--` |\n\n"
- fmt: "\n# Example 1.9\n```java\npublic class TryClass{\n    public static void main\
    \ (String [ ] args) {\n        int sum = 100 + 200;\n        String str = \"We\
    \ love\" + \"Java\";\n        int incre = 10;\n        incre = ++ incre;\n   \
    \     System. out. println ( sum );    // Output: 300\n        System. out.println\
    \ ( str );   // Output: We love Java.\n        System. out.println ( incre );\
    \ // Output: 11\n    }\n}\n```\n**Output:**\n300\nWe love Java\n11\n\n### Explanation\n\
    - `int sum = 100 + 200` means 100 plus 200.\n- `String str = “We love” + “Java\"\
    ` connects two strings.\n- `++incre` increases its value by 1.\n\n## Logical Operators\n\
    \n| Operators |\n| :--- |\n| `&&` |\n| `||` |\n| `!` |\n\nAfter using logical\
    \ operators, the result will be `true` or `false`.\n\n## Example 1.10\n```java\n\
    public class TryClass{\n    public static void main (String [ ] args) {\n    \
    \    boolean x=true;\n        boolean y=false;\n        boolean a, b, c;\n   \
    \     a= x && y;\n        System. out. print(a);   // output: false\n        b=x\
    \ || y;\n        System. out. print(b);   // output: true\n        c=! x;\n  \
    \      System. out. print(c);   // output: false\n    }\n}\n```\n\n### Explanation\n\
    - `true && true;` returns `true;`\n- `true && false;` returns `false;`\n- `false\
    \ && false;` returns `false;`\n- `true || true;` returns `true;`\n- `true || false;`\
    \ returns `true;`\n- `false || false;` return `false;`\n- `! false;` returns `true;`\n\
    - `! true;` returns `false;`\n\n## Assignment Operators\n\n| Operator |\n| :---\
    \ |\n| `+=` |\n| `-=` |\n| `*=` |\n| `/=` |\n| `%=` |\n\n## Example 1.11\n```java\n\
    int x=200; int y=100;\nx+= y; System. out. print(x);\nx-= y; System. out. print(x);\n\
    x/= y; System. out. print(x);\nx%= y; System. out. print(x);\n```\n\n### Explanation\n\
    - `x+=y;` // `x=x+y`, `x=200+100`, output 300 .\n- `x-=y;` // `x=x-y`, `x=200-100`,\
    \ output 100 .\n- `x/=y;` // `x=x/y`, `x=200/100`, output 2 .\n- `x%y;` // `x=%y`,\
    \ `x=200%100`, output 0 .\n\n## Comparison Operators\n\n| Operators |\n| :---\
    \ |\n| `>` |\n| `<` |\n| `>=` |\n| `<=` |\n| `==` |\n| `!=` |\n\nAfter using comparison\
    \ operators, the result will be `true` or `false`.\n\n## Example 1.12\n```java\n\
    int x=200; int y=100;\nboolean result1=(x> y); System. out. print(result1);\n\
    boolean result2=(x<= y); System. out. print(result2);\nboolean result3=(x!= y\
    \ ); System. out. print(result3);\n```\n\n### Explanation\n- `x>y` // test 200>100,\
    \ output true .\n- `x<=y` // test 200<=100, output false .\n- `x!=y` // test 200\
    \ !=100, output true .\n\n## Conditional Operator\nThe syntax of conditional operator\
    \ looks like this:\n\n| `(test-expression) ? (if-true-do-this) : (if-false-do-this);`\
    \ |\n\n`(test-expression)` such as `a<b`, `x!= y`, `m==n`, etc.\n\n## Example\
    \ 1.13\n```java\nint a=100; int b=200;\nString result1 = (a<b) ? ”apple” : ”banana”;\n\
    System. out. print ( result1);\n```\n**Output:**\napple\n\n## Example 1.14\n```java\n\
    int a=100; int b=200;\nString result2 = (a>b) ? ”apple” : ”banana”;\nSystem. out.\
    \ print ( result2 );\n```\n**Output:**\nbanana\n\n### Explanation\nIf the test\
    \ expression returns `true`, then outputs “apple”.\nIf the test expression returns\
    \ `false`, then outputs “banana”.\n\n## Exercise: Calculation\nWrite & Run Java\
    \ Program by Eclipse\n\n### Step 1: Create a Java Project\nStart up Eclipse >\
    \ `File` > `New` > `Java Project` > `Project Name` > “Test” > `Finish`. (Figure\
    \ 1)\n\n### Step 2: Create a Package\nThe package is used to contain various categories\
    \ of Java files. Different package contains different Java files.\nSelect project\
    \ “Test” > `new` > `package` > `name` > “myPackage” > `Finish`. (Figure 2)\n\n\
    ### Step 3: Create a Class\nSelect package “myPackage” > `new` > `class` > `name`\
    \ > “Calculation” > `Finish`. (Figure 3)\n\n### Step 4: Write Java Codes\nWrite\
    \ Java codes in Eclipse.\n```java\npackage myPackage;\npublic class Calculation{\n\
    \  public static void main (String args[ ]){\n    int a = 100, b = 5;  // define\
    \ two variables\n    int c = a/b*10;      // calculation\n    System. out. print(\"\
    C = \" + c);    // output the value of “c”\n  }\n}\n```\n\n### Step 5: Run the\
    \ Program\nClick White Triangle Green Button in the tool bar to run the program,\
    \ you can see the output:\n**Output:**\nC = 200\n\n### Explanation\n“`int c =\
    \ a/b*10;`” calculates the expression and assigns the result value to variable\
    \ `c`”.\n\n## Summary\n- `//` is used to single line comment.\n- `/*…*/` is used\
    \ in multi line comments.\n- `System. out. print( )` will print the result at\
    \ the same line.\n- `System. out.println( )` will print the result at the different\
    \ line.\n- `\\n` outputs content to the next new line\n- `\\r` makes a return\n\
    - `\\t` makes a tab\n- `\\’` outputs a single quotation mark.\n- `”` outputs a\
    \ double quotation mark.\n- Java keywords are only used by the Java language itself.\
    \ They may not be used when choosing identifier names for variable, function,\
    \ and.\n- Java types: `String`, `char`, `int`, `boolean`, `float`, `double`.\n\
    - Java operators: `Arithmetical`, `Logical`, `Comparison`, `Conditional operator`,\
    \ `(test-expression) ? (if-true-do-this) : (if-false-do-this)`.\n\n## If Statement\n\
    The syntax of conditional operator looks like this:\n\n| `if (test-expression)\
    \ { ... }` |\n\nThe `if` statement executes the block of code if the condition\
    \ is true.\n\n### Example 2.1\n```java\nint x=200; int y=100;\nif (x> y) { //\
    \ test 200>100, output true\n}\n```\n**Output:**\ntrue\n\n### Explanation\n`x>y`\
    \ // test 200>100, output true .\n\n## If-else Statement\n| `if (test-expression)\
    \ { ... } else { ... }` |\n\nThe `if-else` statement executes the block of code\
    \ if the condition is true, and another block if it is false.\n\n### Example 2.2\n\
    ```java\nint x=200; int y=100;\nif (x<= y) { // test 200<=100, output false\n\
    } else { // test 200 !=100, output true\n}\n```\n**Output:**\ntrue\n\n### Explanation\n\
    `x<=y` // test 200<=100, output false .\n`x!=y` // test 200 !=100, output true\
    \ .\n\n## Switch Statement\n| `switch ( variable ) { case value: ...; default:\
    \ ...; }` |\n\nThe `switch` statement compares the value of a variable with a\
    \ list of values, called `case` labels.\n\n### Example 2.3\n```java\nint number=20;\n\
    switch ( number ) {\n    case 10: System. out. print (\"Running case 10\"); break;\n\
    \    case 20: System. out. print (\"Running case 20\"); break;\n    case 30: System.\
    \ out. print (\"Running case 30\"); break;\n    default: System. out. print (\"\
    Running default code\"); break;\n}\n```\n**Output:**\nRunning case 20\n\n### Explanation\n\
    The `number` value is 20; it will match case 20, so it will run the code in case\
    \ 20.\n\n## For Loop\n| `for( init, test-expression, increment) { ... }` |\n\n\
    The `for loop` runs a block of code by the specified number of times.\n\n### Example\
    \ 2.4\n```java\nint x;\nfor (x = 0; x <= 5; x++) { // repeat at most 5 times\n\
    \    System. out. print( x );\n}\n```\n**Output:**\n012345\n\n### Explanation\n\
    `x = 0` is initializer, `x <= 5` is test-expression, the code will run at most\
    \ 5 times. `x++` means that x will increase 1each loop.\n\n## While Loop\n| `while\
    \ ( test-expression ) { ... }` |\n\nThe `while loop` loops through a block of\
    \ code if the specified condition is true.\n\n### Example 2.5\n```java\nint counter=0;\n\
    while (counter < 8) { // run 8 tmes\n    System. out. print(\"&\");\n    counter++;\n\
    }\n```\n**Output:**\n&&&&&&&&\n\n### Explanation\n`counter< 8` is a test expression,\
    \ if the condition is true, the code will loop less than 8 times, until the counter\
    \ is 8, then the condition is false, the code will stop running.\n\n## Do-While\
    \ Loop\n| `do{ ... } while ( test-expression);` |\n"
