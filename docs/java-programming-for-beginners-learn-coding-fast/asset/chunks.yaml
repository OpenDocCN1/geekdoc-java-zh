    \ 中)\n\n```java\npackage myPackage;    // 使用 \"myPackage\"\nimport myPackage.Drive;\
    \    // 导入 myPackage 中的类 \"Drive\"\npublic class TestDrive{\n    public static\
    \ void main (String args[ ]) {\n        Drive myDrive = new Drive( );\n      \
    \  myDrive. getDistance(120, 5);\n    }\n}\n```\n\n### 输出\n```\nSPEED: 120 MILES/HOUR\n\
    TIME: 5 HOURS\nDISTANCE: 600 MILES\n```\n\n### 解释\n- `package myPackage;` 在 `Drive.java`\
    \ 中创建了一个包 `myPackage`。\n- `import myPackage. Drive;` 导入了 `myPackage` 中的类 `Drive`。\n\
    - `Drive myDrive = new Drive( )` 可以在文件 `TestDrive` 中创建一个对象 `myDrive`，因为 `Drive`\
    \ 类已经从 `Drive.java` 导入。\n- `myDrive. getDistance(120, 5);` 调用了 `Drive.java` 中的方法。\n\
    \n**注意：** `package` 命令必须位于 `import` 命令之上。\n\n# 练习：继承\n\n## 继承示例\n启动 Eclipse >\
    \ 选择 `myPackage` > new > class > name > `InheritanceDemo` > Finish（完成）。在 Eclipse\
    \ 中编写以下代码。\n\n```java\npackage myPackage;\nclass code1{\n    // 父类\n    int x,\
    \ y;\n    code1(int a, int b){\n        // 构造函数\n        x = a; y = b;\n    }\n\
    }\nclass code2 extends code1{\n  // 子类\n    code2 (int a, int b){\n        //\
    \ 构造函数\n        super (a,b); // 调用父类中的构造函数 \n    }\n}\npublic class InheritanceDemo\
    \ {\n    public static void main(String[] args) {\n      // 主函数\n      int result;\n\
    \      code2 number = new code2(100, 200); /* 创建对象 \"number\"，并自动调用 code2 构造函数\
    \ */\n      result = number. x + number. y;\n      System. out . println(\"Sum\
    \ = \" + result);\n    }\n}\n```\n\n点击工具栏中的白色三角形按钮运行程序并查看输出：\n\n### 输出\n```\n\
    Sum = 300\n```\n\n### 解释\n- `class code1` 创建了一个超类 `code1`。\n- `code1(int a, int\
    \ b){ }` 定义了一个构造函数。\n- `class code2 extends code1` 创建了扩展超类 `code1` 的子类 `code2`。\n\
    - `code2 (int a, int b){ }` 定义了一个构造函数。\n- `super (a,b)` 调用超类中的构造函数，以便初始化变量 `x`\
    \ 和 `y`。\n- `public class InheritanceDemo` 创建了一个主类。\n- `code2 number = new code2(100,\
    \ 200)` 创建了一个对象 `number`，自动调用构造函数 `code2( ){ }`并将两个参数 `100` 和 `200` 传递给构造函数，从而初始化变量\
    \ `x` 和 `y`。\n- `member. x` 引用变量 `x`，其值为 `100`。\n- `member. y` 引用变量 `y`，其值为 `200`。\n\
    \n## 总结\n- 类被子类扩展，这被称为继承。\n- 在子类中，`super` 用于调用父类的构造函数。\n- 如果方法名和参数相同，子类的方法可以重写超类的方法。\n\
    - `static variable` 称为类变量，可以通过类或对象引用。\n- `Non static variable` 无法通过类引用。\n- `Non\
    \ static variable` 只能通过对象引用。\n- `static method` 称为类方法，可以通过类或对象调用。\n- `Non static\
    \ method` 无法通过类引用。\n- `Non static method` 只能通过对象引用。\n- `final+ variable` 意味着变量值不能修改。\n\
    - `final method( )` 意味着该方法不能被重写。\n- `final class` 意味着该类不能被扩展。\n- 多态描述了对对象执行不同方法的能力。\n\
    - `package package-name` 创建或使用包。\n- `import package. class` 导入包或其类。\n\n# 第 7 章：抽象与接口\n\
    \n## 抽象\n`Abstract class` 当作父类使用，会被其子类扩展。子类的方法将重写抽象类的抽象方法。\n\n### 示例 7.1\n```java\n\
    abstract class books{\n  // 定义抽象类\n  abstract int read( );  // 定义抽象方法\n}\nclass\
    \ eBooks extends books{\n  // 扩展父类\n  int read ( ){ return 100; } // 重写方法\n}\n\
    ```\n\n### 解释\n- `abstract class books{ }` 定义了一个抽象类。\n- `abstract int read( )`\
    \ 定义了一个抽象方法。\n- `class eBooks extends books { }` 意味着子类 `eBooks` 扩展了父类 `books`。\n\
    - `int read ( ) { }` 意味着该方法重写了父类中的抽象方法。\n\n### 抽象示例\n```java\npackage myPackage;\n\
    abstract class Books{\n    // 创建抽象类\n    abstract void read();\n    // 创建抽象方法\n\
    }\nclass eBooks extends Books{\n  // 扩展父类\n  void read(){\n    // 重写抽象方法\n   \
    \ System. out . println(\"Overrides the abstract method! \");\n  }\n}\npublic\
    \ class AbstractExample {\n    public static void main(String[] args){\n     \
    \   eBooks obj =new eBooks();\n        obj. read();\n    }\n}\n```\n\n### 输出\n\
    ```\nOverrides the abstract method!\n```\n\n## 权限\nJava 有四种修饰符来定义成员：`default`、`public`、`private`、`protected`。\n\
    \n| 类 | default | public | private | protected |\n| :--- | :--- | :--- | :---\
    \ | :--- |\n| 同一类 | V | V | V | V |\n| 同一包父类 | V | V | X | V |\n| 同一包子类 | V |\
    \ V | X | V |\n| 不同包父类 | X | V | X | X |\n| 不同包子类 | X | V | X | V |\n\n"
- fmt: "\n`default member` cannot be accessed by different package. `public member`\
    \ can be accessed by any package & class. `private member` cannot be accessed\
    \ by a different class. `protected member` can be accessed by any sub class.\n\
    \n### Default Member\n`default member` cannot be accessed by different package\
    \ , Note that package name must be the same as directory name where the package\
    \ locates. `default member` has no any modifier.\n\nExample 7.2\nThere two files\
    \ in the same package as follows:\n(In file1 of myPackage)\n```java\npackage myPackage\
    \ ;\npublic class ParentClass{\n  int num =100;  // This is a default member .\n\
    }\n```\n(In file2 of myPackage)\n```java\npackage myPackage ;\npublic class SubClass\
    \ extends ParentClass{\npublic static void main(String[] args) {\n  SubClass s=new\
    \ SubClass( );\n  System. out. print ( s.num );  /* s references num in the same\
    \ package, ok !  */\n}}\n```\n**Output:** 100  \n**Explanation:** `int num=100`\
    \ defines a default member. `s. num` can access a default member in the same package.\n\
    \n### Public Member\n`public member` can be accessed by any package or any class,\
    \ especially in different packages.\n\nExample 7.3\nThere two files in the different\
    \ package as follows:\n(In file1 of MyPackage)\n```java\npackage myPackage ;\n\
    public class ParentClass{\n  public int num=100;  // This is a public member .\n\
    }\n```\n(In file2 of NewPackage)\n```java\npackage newPackage ;\nimport myPackage.\
    \ ParentClass;\npublic class SubClass extends ParentClass{\npublic static void\
    \ main(String[] args) {\n  SubClass s=new SubClass( );\n  System. out. print (\
    \ s.num );  /* s references num in different packages, ok !  */\n}}\n```\n**Output:**\
    \ 100  \n**Explanation:** `public int num=100` defines a public member. `s. num`\
    \ can access a public member in different packages.\n\n### Private Member\n`private\
    \ member` cannot be accessed by a different class.\n\nExample:\n```java\nclass\
    \ MyClass {\n  private MyClass( ){  // private constructor\n    System. out .\
    \ println(“This is a private method! ”);\n}\npublic class NewClass {\n  public\
    \ static void main ( String args [ ] ) {\n    MyClass obj = new MyClass ( ); \
    \ /* Error ! Access a private constructor  */\n  }\n}\n```\n**Output:** ( Error\
    \ message! )  \n**Explanation:** `private MyClass( )` defines a private constructor\
    \ `MyClass`. `new MyClass ( )` tries to calls private constructor `MyClass`, but\
    \ an error occurs, because they respectively locates different class.\n\n####\
    \ Private Example\n`private member` can be accessed by the same class.\n\nExample:\n\
    ```java\npackage myPackage;\npublic class OurClass { \n  private int a = 100;\
    \  // declare a private variable \n  private int b = 200;  // declare a private\
    \ variable\npublic void accessVariable(){\n    System. out . println(\"a = \"\
    \ + a);  // access private variable\n    System. out . println(\"b = \" + b);\
    \   // access private variable \n  }\n}}\npublic class PrivateExample {\n  public\
    \ static void main ( String args [ ] ){\n    OurClass obj = new OurClass( ); /*\
    \ OK ! , access a default constructor */\n    obj. accessVariable();\n  }\n}\n\
    ```\n**Output:**\na = 100\nb = 200\n\n### Protected Member\n`protected member`\
    \ can be accessed any sub class.\n\nExample 7.5\nThere two files in the different\
    \ package as follows:\n(In file1 of MyPackage)\n```java\npackage myPackage;\n\
    public class ParentClass{\n  // paraent class\n  protected int num =100;  // protected\
    \ member .\n}\n```\n(In file2 of NewPackage)\n```java\npackage newPackage;\nimport\
    \ myPackage. ParentClass;\npublic class SubClass extends ParentClass{\n  // sub\
    \ class\n  public static void main(String[] args) {\n    SubClass s=new SubClass(\
    \ );\n    System. out. print ( s.num );  // access a protected member\n  }\n}}\n\
    ```\n**Output:** 100  \n**Explanation:** `protected int num =100` defines a protected\
    \ member. `s.num ` can access a protected member from sub class in different packages.\n\
    \n### Interface\n`Interface` is a special class, which will be implemented by\
    \ a class. The interface contains one or more empty methods that will be implemented\
    \ by a method of the class.\n\nExample 7.6\n```java\ninterface books {\n  // define\
    \ an interface\n  int booknumber( );     // define an empty method\n}\nclass eBooks\
    \ implement books {\n  // implement interface\n  public int booknumber ( ) { \
    \ // implement the empty method\n    return 100;\n  }\n}\n```\n**Explanation:**\
    \ `interface books` defines an interface named `books`. `int booknumber( )` defines\
    \ an empty method `booknumber`. `class eBooks implement books{}` means class `eBooks`\
    \ implements `books` interface. `public int booknumber( ){` implements the `booknumber(\
    \ )`.\n\n#### Interface Example\nExample:\n```java\npackage myPackage;\ninterface\
    \ Books{\n  //define an interface\n  public void booksNumbers();  //define an\
    \ empty method\n}\nclass eBooks implements Books{\n  //implement interface\n \
    \ public void booksNumbers(){  //implement empty method\n    System. out . println(\"\
    Implement the empty method! \");\n  }\n}\npublic class InterfaceExample {\n  public\
    \ static void main(String[] args) {\n    eBooks obj = new eBooks();\n    obj.\
    \ booksNumbers();\n  }\n}\n```\n**Output:** Implement the empty method!\n\n###\
    \ Abstract & Interface\n\n| Abstract | Explanation |\n| :--- | :--- |\n| ```java\n\
    abstract class books{\n  //define an abstract class\n  abstract int read( ); \
    \ //define an abstract method\n}\nclass eBooks extends books{ //extend the parent\
    \ class\n  int read ( ){ return …; } //override the abstract method\n}\n``` |\
    \ |\n\n| Interface | Explanation |\n| :--- | :--- |\n| ```java\ninterface books\
    \ {\n  //define an interface\n  int booknumber( );     //define an empty method\n\
    }\nclass eBooks implement books {  //implement interface\n  public int booknumber\
    \ ( ) {  //implement the empty method\n    return …;\n  }\n}\n``` | |\n"
