- fmt: "\n| Jedit | [http://www.jedit.org/) [.](http://www.jedit.org/) [jedit](http://www.jedit.org/)\
    \ [.](http://www.jedit.org/) [org/](http://www.jedit.org/) |\n| BlueJ | [http://www.bluej.org/)\
    \ [.](http://www.bluej.org/) [bluej](http://www.bluej.org/) [.](http://www.bluej.org/)\
    \ [org/](http://www.bluej.org/) |\n| JCreator | [http://www.jcreator.com/) [.](http://www.jcreator.com/)\
    \ [jcreator](http://www.jcreator.com/) [.](http://www.jcreator.com/) [com/](http://www.jcreator.com/)\
    \ |\n\nPlease install one of the editors to your computer. (This book uses `Eclipse`\
    \ as editor). Congratulation! Once an IDE has been installed successfully, you\
    \ can write, edit and run Java programs from now on.\n\n## What is Java?\nJava\
    \ is a class-based, object-oriented programming language, which is a secure, fast,\
    \ and reliable program for general-purpose such as internet, database, cell phone,\
    \ countless variety of equipment.\n\n### Example 1.1\n```java\npublic class Hi{\n\
    \    public static void main (String [ ] args){\n        System . out . print(“Hello\
    \ World”);\n    }\n}\n```\n**Output:** Hello World\n**Explanation:** `public class`\
    \ is two keywords; they are used to declare a Java program. `Hi` is a program\
    \ name. `public static void main (String [ ] args) {… }` is used to declare a\
    \ main method. `main` method contains main program codes to execute. `String [\
    \ ] args` is used to accept the input manually. `System. out. print( )` is used\
    \ to display or print. Each Java command should be ended with a semicolon (`;`).\
    \ \n\n## Run First Program\n`Eclipse` is one of the most popular Java IDE (Integrated\
    \ Development Environment). It is used to write, edit, debug and run Java programs.\n\
    \n### Download Eclipse Installer\n[http://www.eclipse.org/downloads/) [.](http://www.eclipse.org/downloads/)\
    \ [eclipse](http://www.eclipse.org/downloads/) [.](http://www.eclipse.org/downloads/)\
    \ [org/downloads/](http://www.eclipse.org/downloads/)\n\nPlease click the link\
    \ to download the newest version `Eclipse Installer` at `Eclipse` website (Figure\
    \ 1)!\n\n### Uncompress Eclipse File\nNote: instead of installation, the `Eclipse`\
    \ should be uncompressed in a directory you prefer. For example, `C:\\Eclipse`.\
    \ Please create a shortcut of `eclipse.exe` to the desktop. (Restate: `Eclipse`\
    \ doesn’t need to be installed, but it should be uncompressed in a directory.)\n\
    \n### Run Eclipse\nDouble click `eclipse.exe` to run `Eclipse`, set the default\
    \ workplace, check the box of “Use this as the default and do not ask again”,\
    \ and click OK, as following Figure 2 and Figure 3.\n\n## Write & Run First Java\
    \ Program\n### Step 1: Create a Java Project\nStart up `Eclipse` > `File` > `New`\
    \ > `Java Project` > `Project Name` > “FirstProject” > `Finish`. (Figure 4)\n\n\
    ### Step 2: Create a Package\nPackage is used to contain various categories of\
    \ Java files. Different package contains different Java files. Select project\
    \ “FirstProject” > `new` > `package` > `name` > “newPackage” > `Finish`. (Figure\
    \ 5)\n\n### Step 3: Create a Class\nSelect package “newPackage” > `new` > `class`\
    \ > `name` > “HelloWorld” > `Finish`. (Figure 6)\n\n### Step 4: Write Java Codes\n\
    Write Java codes in `Eclipse`. (Figure 7)\n\n### Example 1.2\n```java\npackage\
    \ newPackage;\npublic class HelloWorld {\n  public static void main (String[]\
    \ args){\n    System. out. print(\"Hello World! \");\n  }\n}\n```\n(Figure 7 Java\
    \ program in Eclipse)\n\n### Step 5: Run the Program\nClick White Triangle Green\
    \ Button in the tool bar to run the program, you can see the output: (Figure 8)\n\
    **Output:**\nCongratulation! The first Java program run by `Eclipse` is successful!\n\
    \n## Java Comments\n```java\n//*  ……  */\n```\nJava comments are used to explain\
    \ the current code, describe what this code is doing. The Java compiler will ignore\
    \ comments. `//` is used for single line comment. `/*…*/` is used in multi line\
    \ comments.\n\n### Example 1.3\n```java\nSystem. out. println (“Hello World”);\
    \  // show “Hello World”\n/*   System . out . println( ) is a Java output command,\
    \ meaning display or print .*/\n```\n**Explanation:** `// show “Hello World”`\
    \ is a single line comment. `/* System . out . println( ) is a Java output command,\
    \ meaning display or print . */` is a multi line comment.\n\n## Output Commands\n\
    ```java\nSystem. out. print ( );  // print the result at the same line .\nSystem.\
    \ out. println ( );  // print the result at the different line .\n```\n\n### Example\
    \ 1.4\n```java\nSystem. out. print( \"1 \" );\nSystem. out. print( \"2 \" );\n\
    System. out. print( \"3\" );\n```\n**Output:** 1 2 3\nExplanationExplanation `System.\
    \ out. print( )` will print the result at the same line. `System. out. println(\
    \ )` will print the result at the different line.\n\n## Escaping Characters\n\
    The `\\` character can be used to escape:\n- `\\n` outputs content to the next\
    \ line.\n- `\\r` makes a return.\n- `\\t` makes a tab.\n\n### Example 1.5\n```java\n\
    public class Hi{\n    public static void main (String [ ] args){\n        System.\
    \ out. print(\"Hello World\");\n    }\n}\n```\n**Explanation:** `\"` outputs a\
    \ double quotation mark. Note that `Hello World` has a double quote.\n\n## Keywords\n\
    Some words are reserved by the language:\n| `abstract` | `byte` | `char` | `continue`\
    \ | `double` | `float` | `implements` | `interface` | `package` | `public` | `this`\
    \ | `try` | `const` | `new` | `while` |\n\n## Data Types\n| Data Types | Explanation\
    \ |\n| :--- | :--- |\n| `String` | a string with double quotes |\n| `char` | a\
    \ single character with single quotes |\n| `int` | an integer number |\n| `float`\
    \ | a floating point number |\n| `boolean` | a value true or false |\n| `double`\
    \ | large floating point number |\n\n## Create a Variable\nVariable is a symbolic\
    \ name associated with a value. Using following syntax can create a variable:\n\
    `dataType variableName = value;`\n\n### Example 1.8\n```java\npublic static void\
    \ main (String [ ] args ) {\n  String mystring = “Hello World”;\n  char mychar\
    \ = ‘m’;\n  int myinteger = 168168;\n  double myflt = 28.98;\n  boolean mybool\
    \ = true;\n}\n```\n**Explanation:** `mystring` is a name of a variable, its value\
    \ is “Hello World”. `myinteger` is a name of a variable, its value is 168168.\
    \ `mybool` is a name of a variable, its value is true.\n\n Arithmetical Operators\n\
    | Operators |\n| :--- |\n| `+` |\n| `-` |\n| `*` |\n| `/` |\n| `%` |\n| `++` |\n\
    | `--` |\n"
