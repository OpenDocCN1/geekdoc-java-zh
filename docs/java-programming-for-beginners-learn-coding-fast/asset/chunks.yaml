    \ data type of \"c\"\n        System.out.print(\"C = \" + c);\n    }\n}\n```\n\
    A. var\nB. string\nC. boolean\nD. int\n\n**(2)**\n```java\npackage myPackage;\n\
    public class WhileStatement {\n    public static void main(String[] args) {\n\
    \        int n = 1;\n        int sum = 0;\n        fill in here (n <= 100) { //\
    \ loop statement\n            sum += n;\n            n++;\n        }\n       \
    \ System.out.println(\"Sum = \" + sum);\n    }\n}\n```\n"
