  trans: "\n\n`throw` 用于手动抛出异常和错误消息。`e.getMessage()` 可以显示错误消息。\n\n### 示例 8.6\n```java\n\
    public class ExceptionSample {\n    public static void main (String args []) {\n\
    \        try {\n            int a[] = new int[10]; // 最后元素是 a[9]，没有 a[10] .\n\
    \            if ( a[10] >0 ) throw new ArrayIndexOutOfBoundsException(\"Error\"\
    ); // throw\n        } catch ( ArrayIndexOutOfBoundsException e) {\n         \
    \   System. out. print (\"Error index:\"+e. getMessage())); // alert\n       \
    \ }\n    }\n}\n```\n**输出：**\n`Error index: 10`\n\n**解释：**\n`throw new exception(\"\
    …\")` 可以抛出一个异常。抛出 `Exception`。任何方法都可以准备好手动抛出自己的异常。`e.getMessage()` 显示错误消息。\n\n\
    | `method()` 出异常 {…}` |\n\n### 示例 8.7\n```java\npublic class ExceptionSample {\n\
    \    public static void main (String args []) {\n        try {\n            int\
    \ b = 0;\n            calculate( b ); //调用函数，发生了异常！\n        } catch( Exception\
    \ e) {\n            System. out.println(\"The error is\"+ e. getMessage()));\n\
    \        }\n    }\n    public static int calculate( int num) throws ArithmeticException\
    \ {\n        // 手动抛出异常\n        int a=10, c;\n        c = a/num; // num 为 0，错误！\n\
    \        return c;\n    }\n}\n```\n**输出：**\n`(The error is: / by zero. )`\n\n\
    **解释：**\n`int calculate( int num) throws ArithmeticException` 抛出一个异常。`e.getMessage()`\
    \ 显示错误消息。\n\n### File 类\n`File` 类用于显示文件的属性、检查文件是否存在、可写、可读、重命名文件……\n\n| `File f\
    \ = new File (file-name);` // 创建文件对象 |\n| `f.exists();` // 检查是否存在 |\n| `f.canRead();`\
    \ // 检查是否可读 |\n| `f.canWrite();` // 检查是否可写 |\n| `f.isFile();` // 检查是否是文件 |\n\n\
    ### 示例 8.8\n```java\nFile f = new File ( MyFile );\nif (f.exists( )) {\n    System.\
    \ out.println(\"Exists:\"+ f.exists() ); // Exists: true\n    System. out.println(\"\
    Can read:”+ f.canRead()); // Can read: true\n    System. out.println(\"Can write:”+\
    \ f.canWrite()); // Can write: false\n    System. out.println(\"Is file:”+ f.isFile());\
    \ // Is file: true\n}\n```\n**解释：**\n以上所有方法都返回 `true` 或 `false`。\n\n### FileOutputStream\n\
    `FileOutputStream` 类用于处理输出流。\n\n| `FileOutputStream fout = new FileOutputStream\
    \ (file-name);` |\n| `System. in. read();` // 读取输入的字符 |\n| `fout. write();` //\
    \ 将字符写入文件 |\n\n`new FileOutputStream (file-name)` 创建一个输出流。`System. in.read()`\
    \ 从键盘读取输入的字符。`fout.write()` 将字符写入文件。\n\n### 示例 8.9\n（在同一项目文件夹中准备一个空文件 `MyFile.txt`，以及以下\
    \ Java 文件 `OutputFile.java`）\n```java\npackage myPackage;\nimport java.io.*;\n\
    public class OutputFile {\n    public static void main(String[] args) {\n    \
    \    char ch;\n        int number;\n        try {\n            FileOutputStream\
    \ fout = new FileOutputStream(\"MyFile. txt\");\n            System. out.println(\"\
    Please input some words, finish with # key and enter:\");\n            while((ch\
    \ = (char)System. in.read()) != '#') /*从键盘读取输入的字符*/\n                fout.write(ch);\
    \ // 将字符写入文件\n            fout.close();\n        } catch(FileNotFoundException\
    \ e) {\n            System. err.println(e);\n        } catch(IOException e) {\n\
    \            System. err.println(e);\n        }\n    }\n}\n```\n（运行程序，并在键盘上输入“C++\
    \ is very good!”）\n**输出：**\n`请检查 MyFile. txt，你会发现内容是 “C++ is very good!”.`\n\n\
    **解释：**\n`fout` 是一个输出流对象。`System. in.read()` 从键盘读取字符。`fout.write(ch)` 将字符写入文件。当你查看\
    \ `MyFile.txt` 时，其内容为：`C++ is very good`。\n\n### FileInputStream\n`FileInputStream`\
    \ 类用于处理输入流。\n\n| `FileInputStream fin = new FileInputStream (file-name);` |\n\
    | `fin. read();` // 读取文件内容 |\n\n`new FileInputStream (file-name)` 创建一个输入流。`fin.read()`\
    \ 读取文件内容。\n\n### 示例 8.10\n（假设同一项目文件夹中 `MyFile.txt` 内容为“C++ is very good!”，以及以下\
    \ Java 文件 `InputFile.java`）\n```java\npackage myPackage;\nimport java.io.*;\n\
    public class InputFile {\n    public static void main(String[] args) {\n     \
    \   char ch;\n        int number;\n        try {\n            FileInputStream\
    \ fin = new FileInputStream(\"MyFile.txt\");\n            while((number=fin.read())\
    \ != -1) // 读取文件\n                System. out.print((char)number); // 转换为字符\n\
    \            fin.close();\n        } catch(FileNotFoundException e) {\n      \
    \      System. err.println(e);\n        } catch(IOException e) {\n           \
    \ System. err.println(e);\n        }\n    }\n}\n```\n**输出：**\n`C++ is very good!`\n\
    \n**解释：**\n`fin` 是一个输入流对象。`fin.read()` 读取文件内容。`-1` 表示文件结束。\n\n### 创建线程\n线程可以用于同时执行多个任务。每个线程代表一个子任务。创建线程有两种方法。\n\
    \n#### 方法一\n```java\npublic class ThreadDemo extends Thread { // 继承\n    public\
    \ void run() {\n        // 线程体\n    }\n    public static void main(String args[])\
    \ {\n        ThreadDemo myThread = new ThreadDemo();\n        myThread.start();\
    \ // 启动线程\n    }\n}\n```\n**解释：**\n方法一使用了 `Thread` 类。`run()` 在线程启动时自动运行。`myThread\
    \ = new ThreadDemo()` 创建了一个线程对象 `myThread`。`start()` 启动线程。\n\n#### 方法二\n```java\n\
    class ThreadDemo implements Runnable { // 实现\n    public void run() {\n      \
    \  // 线程体\n    }\n    public static void main(String args[]) {\n        Thread\
    \ myThread = new Thread(new ThreadDemo());\n        myThread.start(); // 启动线程\n\
    \    }\n}\n```\n"
- fmt: "\n# Explanation\nMethod Two uses the `implements Runnable` interface. `run()`\
    \ automatically runs when the thread starts. `new Thread(new ThreadDemo())` creates\
    \ a thread object `myThread`. `start()` starts the thread.\n\n## Extends Thread\
    \ (Example 8.11)\n\n```java\npublic class ThreadDemo extends Thread { \n    //\
    \ extends\n    public void run() {\n        // thread body\n        for(int i\
    \ = 0; i < 3; i++) {\n            System.out.println(\"Thread! \");\n        }\n\
    \    }\n    public static void main(String[] args) {\n        ThreadDemo myThread\
    \ = new ThreadDemo();\n        myThread.start(); // start thread\n    }\n}\n```\n\
    **Output:**\n```\nThread!\nThread!\nThread!\n```\n**Explanation:**\n`run()` automatically\
    \ runs when the thread starts. `myThread = new ThreadDemo();` creates a thread\
    \ object `myThread`. `start()` starts the thread.\n\n## Implements Runnable (Example\
    \ 8.12)\n```java\nclass ThreadDemo implements Runnable { \n    // implements\n\
    \    public void run() {\n        // thread body\n        for(int i = 0; i < 3;\
    \ i++) {\n            System.out.println(\"Thread! \");\n        }\n    }\n  \
    \  public static void main(String[] args) {\n        Thread myThread = new Thread(new\
    \ ThreadDemo());\n        myThread.start(); // start thread\n    }\n}\n```\n**Output:**\n\
    ```\nThread!\nThread!\nThread!\n```\n**Explanation:**\n`run()` automatically runs\
    \ when the thread starts. `myThread = new Thread(new ThreadDemo())` creates a\
    \ thread object `myThread`. `start()` starts the thread.\n\n## Multi-Thread (Example\
    \ 8.13)\n```java\nclass ThreadDemo extends Thread {\n    public ThreadDemo(String\
    \ threadName) {\n        super(threadName); // initialize thread name\n    }\n\
    \    public void run() {\n        // thread body\n        for(int i = 0; i < 2;\
    \ i++) {\n            System.out.println(getName() + \" running! \");\n      \
    \  }\n    }\n}\npublic class UseThread {\n    public static void main(String[]\
    \ args) {\n        ThreadDemo myThread1 = new ThreadDemo(\"1st thread\");\n  \
    \      ThreadDemo myThread2 = new ThreadDemo(\"2nd thread\");\n        ThreadDemo\
    \ myThread3 = new ThreadDemo(\"3rd thread\");\n        myThread1.start(); // start\
    \ thread\n        myThread2.start(); // start thread\n        myThread3.start();\
    \ // start thread\n    }\n}\n```\n**Output:**\n```\n1st thread running!\n1st thread\
    \ running!\n2nd thread running!\n2nd thread running!\n3rd thread running!\n3rd\
    \ thread running!\n```\n**Explanation:**\n`super(threadName)` initializes the\
    \ thread name by `Thread` class constructor. `getName()` returns the thread name.\
    \ `run()` automatically runs when the thread starts. `new myThread(\"1st thread\"\
    )` creates a thread object named `1st Thread`. `myThread1.start();` starts the\
    \ thread `myThread1`.\n\n## Thread’s Methods\n- `thread.start()` starts the thread.\n\
    - `thread.stop()` stops the thread.\n- `thread.sleep()` makes the thread sleep\
    \ for some time.\n- `thread.wait()` makes the thread in waiting status.\n- `thread.notify()`\
    \ wakes up the thread that is waiting.\n- `thread.yield()` lets other threads\
    \ with same priority run.\n- `thread.isAlive()` tests the current thread alive.\n\
    - `thread.currentThread()` gets the current thread.\n- `thread.interrupt()` stops\
    \ the \"blocked\" thread.\n- `thread.suspend()` makes the thread pause.\n- `thread.resume()`\
    \ starts the thread again.\n- `thread.join()` runs this thread after other thread\
    \ ended.\n\n**For example:**\n```java\nif(time_to_stop){\n    thread.currentThread().stop();\
    \ // stop current thread .\n}\n```\n\n## Thread’s Example (Example 8.14)\n```java\n\
    class ThreadDemo implements Runnable {\n    public void run() {\n        // thread\
    \ body\n        ……\n        wait(); // make the thread in waiting status .\n \
    \       ……\n    }\n}\nclass TextThread {\n    public static void main(String args[])\
    \ {\n        Thread myThread = new Thread(new ThreadDemo());\n        myThread.start();\
    \ // start thread\n        Thread.sleep(1000); // make the thread sleep for 1\
    \ second\n        notify(); // wake up the thread that is waiting\n        Thread.yield();\
    \ /* let other threads with the same priority run first . */\n    }\n}\n```\n\
    **Explanation:**\n`wait()` makes the current thread waiting. `new Thread(new ThreadDemo())`\
    \ creates a thread. `myThread.start()` starts the thread. `Thread.sleep(1000)`\
    \ makes the thread sleep for 1000 milliseconds. `notify()` wakes up the thread\
    \ that is waiting. `Thread.yield()` lets other threads with the same priority\
    \ run first.\n**Note:** `suspend()` and `resume()` are not recommended to use\
    \ nowadays.\n\n## Exercise: OutOfRangeException Example\nStart up Eclipse > Select\
    \ \"myPackage\" > new > class > name > `ArrayOutRange` > Finish. Write the following\
    \ codes in Eclipse.\n\n```java\npackage myPackage;\npublic class ArrayOutRange\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ int n = 0;\n            String color[] = {\"Red\", \"Yellow\", \"Green\"};\n\
    \            while (n < 4) {\n                System.out.println(color[n]);\n\
    \                n++;\n            }\n        } catch (ArrayIndexOutOfBoundsException\
    \ e) {\n            System.out.println(\"Exception Occurs!\");\n            System.out.println(\"\
    Array Index of Range!\");\n        }\n    }\n}\n```\nClick White Triangle Green\
    \ Button to run the program and see the output:\n**Output:**\n```\nRed\nYellow\n\
    Green\nException Occurs!\nArray Index of Range!\n```\n\n## Step-by-Step Guide\n\
    - **Step 1: Multi-Thread Program**: Start up Eclipse > Select \"myPackage\" >\
    \ new > class > name > `ArrayOutRange` > Finish.\n- **Step 2: Create Package**:\
    \ Package is used to contain various files.\n- **Step 3: Create Class**: Create\
    \ `ThreadClass`.\n- **Step 4: Write Java Codes**:\n```java\npackage myPackage;\n\
    public class ThreadClass {\n    public static void main(String[] args) {\n   \
    \     ThreadDemo myThread1 = new ThreadDemo(\"Thread One\");\n        ThreadDemo\
    \ myThread2 = new ThreadDemo(\"Thread Two\");\n        myThread1.start(); // start\
    \ thread\n        myThread2.start(); // start thread\n    }\n}\nclass ThreadDemo\
    \ extends Thread {\n    public ThreadDemo(String str) {\n        super(str); //\
    \ initialize thread name\n    }\n    public void run() {\n        // thread body\n\
    \        for(int i = 0; i < 2; i++) {\n            System.out.println(getName()\
    \ + \" running! \");\n            try {\n                sleep((int)(Math.random()\
    \ * 1500));\n            } catch (InterruptedException e) {}\n        }\n    \
    \    System.out.println(getName() + \" completed!\");\n    }\n}\n```\n- **Step\
    \ 5: Run the Program**: Click White Triangle Green Button to run the program,\
    \ you can see the output like this:\n**Output:**\n```\nThread One running!\nThread\
    \ Two running!\nThread One completed!\nThread Two completed!\nThread One completed!\n\
    Thread Two completed!\n```\n**Explanation:** `thread1.start()` and `thread2.start()`\
    \ run in turns. `sleep((int)(Math.random() * 1500))` makes one thread sleep for\
    \ a moment while another is running.\n\n## Summary\nAn exception is an error that\
    \ occurs during the running of a program that breaks the normal flow of commands.\
    \ `try-catch` can catch the exception and handle it. When an array index is out\
    \ bound, an exception will occur. When a character index is out bound, an exception\
    \ will occur. The `try-catch` block can be followed by a `finally` command which\
    \ is always executed at last. `throw` is used to throw an exception and error\
    \ message manually. Any method can be ready to throw its own exceptions manually.\
    \ `e.getMessage()` displays the error message.\nFile class is used to display\
