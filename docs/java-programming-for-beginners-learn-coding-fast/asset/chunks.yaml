  trans: "\n\n`default member` 无法被不同的包访问。`public member` 可以被任何包和类访问。`private member`\
    \ 无法被不同的类访问。`protected member` 可以被任何子类访问。\n\n### 默认成员 (Default Member)\n`default\
    \ member` 无法被不同的包访问，注意包名必须与包所在的目录名称相同。`default member` 无任何修饰符。\n\n示例 7.2\n同一包中包含两个文件如下：\n\
    (在 myPackage 的 file1 中)\n```java\npackage myPackage ;\npublic class ParentClass{\n\
    \  int num =100;  // 这是一个默认成员\n}\n```\n(在 myPackage 的 file2 中)\n```java\npackage\
    \ myPackage ;\npublic class SubClass extends ParentClass{\npublic static void\
    \ main(String[] args) {\n  SubClass s=new SubClass( );\n  System. out. print (\
    \ s.num );  /* s 引用了同包中的 num，可以！  */\n}}\n```\n**输出：** 100\n**解释：** `int num=100`\
    \ 定义了一个默认成员。`s. num` 可以访问同包中的默认成员。\n\n### 公有成员 (Public Member)\n`public member`\
    \ 可以被任何包或任何类访问，特别是在不同的包之间。\n\n示例 7.3\n不同包中包含两个文件如下：\n(在 MyPackage 的 file1 中)\n\
    ```java\npackage myPackage ;\npublic class ParentClass{\n  public int num=100;\
    \  // 这是一个公成员\n}\n```\n(在 NewPackage 的 file2 中)\n```java\npackage newPackage ;\n\
    import myPackage. ParentClass;\npublic class SubClass extends ParentClass{\npublic\
    \ static void main(String[] args) {\n  SubClass s=new SubClass( );\n  System.\
    \ out. print ( s.num );  /* s 引用了不同包中的 num，可以！  */\n}}\n```\n**输出：** 100\n**解释：**\
    \ `public int num=100` 定义了一个公成员。`s. num` 可以访问不同包中的公成员。\n\n### 私有成员 (Private Member)\n\
    `private member` 无法被不同的类访问。\n\n示例：\n```java\nclass MyClass {\n  private MyClass(\
    \ ){  // 私有构造函数\n    System. out . println(“这是一个私有方法! ”);\n}\npublic class NewClass\
    \ {\n  public static void main ( String args [ ] ) {\n    MyClass obj = new MyClass\
    \ ( );  /* 错误！访问私有构造函数  */\n  }\n}\n```\n**输出：** ( 错误信息! )\n**解释：** `private MyClass(\
    \ )` 定义了一个私有构造函数 `MyClass`。`new MyClass ( )` 尝试调用私有构造函数 `MyClass`，但发生了错误，因为它们位于不同的类。\n\
    \n#### 私有示例 (Private Example)\n`private member` 可以被同一个类访问。\n\n示例：\n```java\npackage\
    \ myPackage;\npublic class OurClass { \n  private int a = 100;  // 声明一个私有变量 \n\
    \  private int b = 200;  // 声明一个私有变量\npublic void accessVariable(){\n    System.\
    \ out . println(\"a = \" + a);  // 访问私有变量\n    System. out . println(\"b = \"\
    \ + b);   // 访问私有变量 \n  }\n}}\npublic class PrivateExample {\n  public static\
    \ void main ( String args [ ] ){\n    OurClass obj = new OurClass( ); /* 可以!，访问默认构造函数\
    \ */\n    obj. accessVariable();\n  }\n}\n```\n**输出：**\na = 100\nb = 200\n\n###\
    \ 受保护成员 (Protected Member)\n`protected member` 可以被任何子类访问。\n\n示例 7.5\n不同包中包含两个文件如下：\n\
    (在 MyPackage 的 file1 中)\n```java\npackage myPackage;\npublic class ParentClass{\n\
    \  // 父类\n  protected int num =100;  // 受保护成员\n}\n```\n(在 NewPackage 的 file2 中)\n\
    ```java\npackage newPackage;\nimport myPackage. ParentClass;\npublic class SubClass\
    \ extends ParentClass{\n  // 子类\n  public static void main(String[] args) {\n\
    \    SubClass s=new SubClass( );\n    System. out. print ( s.num );  // 访问受保护成员\n\
    \  }\n}}\n```\n**输出：** 100\n**解释：** `protected int num =100` 定义了一个受保护成员。`s.num\
    \ ` 可以访问不同包中子类的受保护成员。\n\n### 接口 (Interface)\n`Interface` 是一个特殊的类，会被类实现。接口包含一个或多个空方法，这些方法将由类的方法实现。\n\
    \n示例 7.6\n```java\ninterface books {\n  // 定义一个接口\n  int booknumber( );     //\
    \ 定义一个空方法\n}\nclass eBooks implement books {\n  // 实现接口\n  public int booknumber\
    \ ( ) {  // 实现空方法\n    return 100;\n  }\n}\n```\n**解释：** `interface books` 定义了一个名为\
    \ `books` 的接口。`int booknumber( )` 定义了一个空方法 `booknumber`。`class eBooks implement\
    \ books{}` 意味着类 `eBooks` 实现 `books` 接口。`public int booknumber( ){` 实现了 `booknumber(\
    \ )`。\n\n#### 接口示例 (Interface Example)\n示例：\n```java\npackage myPackage;\ninterface\
    \ Books{\n  // 定义一个接口\n  public void booksNumbers();  // 定义一个空方法\n}\nclass eBooks\
    \ implements Books{\n  // 实现接口\n  public void booksNumbers(){  // 实现空方法\n    System.\
    \ out . println(\"实现了空方法! \");\n  }\n}\npublic class InterfaceExample {\n  public\
    \ static void main(String args[]) {\n    eBooks obj = new eBooks();\n    obj.\
    \ booksNumbers();\n  }\n}\n```\n**输出：** 实现了空方法!\n\n### 抽象与接口 (Abstract & Interface)\n\
    \n| 抽象 | 解释 |\n| :--- | :--- |\n| ```java\nabstract class books{\n  // 定义一个抽象类\n\
    \  abstract int read( );  // 定义一个抽象方法\n}\nclass eBooks extends books{//继承父类\n\
    \  int read ( ){ return …; } // 重写抽象方法\n}\n``` | |\n\n| 接口 | 解释 |\n| :--- | :---\
    \ |\n| ```java\ninterface books {\n  // 定义一个接口\n  int booknumber( );     // 定义一个空方法\n\
    }\nclass eBooks implement books { //实现接口\n  public int booknumber ( ) {  // 实现空方法\n\
    \    return …;\n  }\n}\n``` | |\n\n"
- fmt: "\n# Initializes Variables\nWhen creating an object, it needs a constructor\
    \ to initialize the variables.\n\n### Example 7.7\n```java\nclass Book {\n  //\
    \ create a class\n  public String title;\n  public int number;\n  public Book\
    \ ( ) {\n    // define a constructor\n    title = “Learning Java ”;  // initialization\n\
    \    number = 100;  // initialization\n  }\n}\npublic class Publisher {\n  //\
    \ create main class\n  public static void main ( String args [ ]) { //main method\n\
    \    Book eBook = new Book ( );  // create an object\n    System. out. print(\
    \ eBook. title + eBook. number);\n  }\n}\n```\n**Output:**\nLearning Java 100\n\
    \n**Explanation:** `public Book ( ) { }` is a constructor to initialize variables.\n\
    \n### Another Class\nMain class can use another-class to call another-method.\n\
    \n### Example 7.8\n```java\nclass AnotherClass {\n    // define another class\n\
    \  public static void AnotherMethod( ){ // another method\n    System. out. print\
    \ ( “Very Good” );\n }}\npublic class MainClass {\n  //define main class\n  public\
    \ static void main (String args [ ]){ // main method\n    AnotherClass. AnotherMethod(\
    \ ); //call another method\n  }\n}\n```\n**Output:**\nVery Good\n\n**Explanation:**\
    \ `“AnotherClass. AnotherMethod( )”` use another class to call another method.\n\
    \n## Exercise: Max & Min\n\n### Example\nStart up Eclipse > Select “myPackage”\
    \ > new > class > name > `AbstractDemo` > Finish.\nWrite following codes in Eclipse.\n\
    \n```java\npackage myPackage;\nabstract class A {\n  // define an abstract class\n\
    \  abstract int max (int x, int y);  // define an abstract method\n  int min(int\
    \ x, int y){return x<y?x:y;}}\n}\nclass B extends A {\n  // extend the parent\
    \ class\n  int max (int x, int y){\n  // override the abstract method\n  return\
    \ x>y?x:y;}}\n}\npublic class AbstractDemo {\npublic static void main(String[]\
    \ args) {\nA a;\nB b=new B();\nint max=b. max(100, 200);\nint min=b. min(100,\
    \ 200);\nSystem. out. println(\"Max=\"+max);\nSystem. out. println(\"Min=\" +min);\n\
    }}\n```\nClick White Triangle Green Button in tool bar to run the program and\
    \ see the output:\n**Output:**\nMax = 200\nMin = 100\n\n**Explanation:**\n- `“abstract\
    \ class A{ }”` defines a abstract class.\n- `“ abstract int max( )”` defines a\
    \ abstract method.\n- `“class B extends A { }”` means a sub class `“B”` extends\
    \ the parent class `\"A”`.\n- `“int max ( ) { }”` means this method in sub class\
    \ overrides the abstract method in parent class.\n\n### Example\nStart up Eclipse\
    \ > Select “myPackage” > new > class > name > `InterfaceDemo` > Finish.\nWrite\
    \ following codes in Eclipse.\n\n```java\npackage myPackage;\ninterface myInterface\
    \ {\n    // define an interface\n  public void compareNumbers (int num1, int num2);\n\
    \  /* define an empty method  */\n}\nclass MaxNum implements myInterface {\n \
    \ //implement interface\n  public void compareNumbers (int num1, int num2){\n\
    \  /* implement the empty method */\n  System. out. println(\"Two numbers are:\
    \ \"+num1+\" & \"+num2);\n  if (num1>=num2)\n    System. out. println(\"Maxmum\
    \ is:\"+num1);\n  else\n    System. out.println(\"Maxmum is:\"+num2);\n}}\nclass\
    \ MinNum implements myInterface {\npublic void compareNumbers (int num1, int num2){\n\
    System. out. println(\"Two numbers are: \"+num1+\" & \"+num2);\nif (num1<=num2)\n\
    System. out. println(\"Minmum is:\"+num1);\nelse\nSystem. out. println(\"Minmum\
    \ is:\"+num2);\n}}\npublic class InterfaceDemo {\npublic static void main(String[]\
    \ args) {\nMaxNum maxObject = new MaxNum();\nmaxObject. compareNumbers(100, 120);\n\
    MinNum minObject = new MinNum();\nminObject. compareNumbers(60, 80);\n}}\n```\n\
    Click White Triangle Green Button in the tool bar to run the program and see the\
    \ output:\n**Output:**\nTwo numbers are: 100 & 120\nMaxmum is:120\nTwo numbers\
    \ are: 60 & 80\nMinmum is:60\n\n**Explanation:**\n- `“interface myInterface”`\
    \ defines an interface named `“myInterface”`.\n- `“void compareNumbers ( )”` defines\
    \ an empty method `void compareNumbers( )`.\n- `“class MaxNum implements myInterface\
    \ { }”` means class `“MaxNum”` implements `“myInterface”` interface.\n- `“class\
    \ MinNum implements myInterface { }”` means class `“MinNum”` implements `“myInterface”`\
    \ interface.\n- `“public void compareNumbers( )”` implements the empty method\
    \ `compareNumbers( )` in the interface.\n\n## Summary\nAbstract class works as\
    \ a parent class, which will be extended by its sub class. The method of sub class\
    \ will override the abstract method of the abstract class.\n\nJava has four permission\
    \ modifiers to define a member: `default`, `public`, `private`, `protected`.\n\
    - `Default` member cannot be accessed by different package, Note that package\
    \ name must be the same as directory name where the package locates.\n- `Default`\
    \ member has no any modifier.\n- `Public` member can be accessed by any package\
    \ or any class, especially in different packages.\n- `private` member cannot be\
    \ accessed by a different class.\n- `Private` member can be accessed by the same\
    \ class.\n- `Protected` member can be accessed any sub class.\n\nInterface is\
    \ a special class, which will be implemented by a class. The interface contains\
    \ one or more empty methods that will be implemented by a method of the class.\
    \ Main class can use another-class to call another-method.\n\n## Chapter 8: Exception\n\
    An exception is an error that occurs during the running of a program that breaks\
    \ the normal flow of commands.\n\n### Example 8.1\n```java\nint a=10, b=0;\nc\
    \ = a/b; // error ! Because “b” is 0\nSystem. out. print( c );\n```\n**Output:**\n\
    java.lang.ArithmeticException: / zero\n\n**Explanation:** `“c = a/b”` occurs,\
    \ because `“b”` is zero.\n\n### Example 8.2\n```java\nint a=10, b=0;\ntry {\n\
    \  c = a/b;\n} catch ( ArithmeticException e ) {\n  // handle the exception\n\
    System. out. print (\" Divided By Zero \");\n}\n```\n**Output:**\nDivided By Zero\n\
    \n**Explanation:** `“try-catch”` can catch the `ArithmeticException`.\n\n### Example\
    \ 8.3\n```java\nint a[] = new int [10]; // the last index is 9\na[10]=100; //\
    \ error ! Because the index is out bound\nSystem. out. print ( a[10] );\n```\n\
    **Output:**\njava.lang.ArrayIndexOutOfBoundsException: 10\n\n**Explanation:**\
    \ `“try{...}”` has `a[10]`, and causes an exception.\n\n### Example 8.4\n```java\n\
    char ch = \"ABC\". charAt(100); // error ! Index out bound\nSystem. out. print\
    \ ( ch );\n```\n**Output:**\njava.lang.StringIndexOutOfBoundsException: 100\n\n\
    **Explanation:** `“try{...}”` has `“ABC”.charAt(100)` and causes an exception,\
    \ because the length of `“ABC”` is 3, and without the 100th character.\n\n###\
    \ Finally Command\nThe try-catch block can be followed by a `finally` command\
    \ which always be executed at last.\n\n### Example 8.5\n```java\npublic class\
    \ ExceptionSample {\npublic static void main (String args [ ]) {\n  try {\n  \
    \  char ch = \"ABC\". charAt(100); // error !\n  } catch (IndexOutOfBoundsException\
    \ e) {\n    System. out. print ( \"Character index out of bounds. \" );\n  }\n\
    \  finally {\n    System. out.print(\"The End\");\n  }  // must execute\n}}\n\
    ```\n**Output:**\nCharacter index out of bounds. The End\n\n**Explanation:** `“finally\
    \ { System. out.print(“The End”); }”` must be executed.\n\n### Throw Exception\n\
    Any program can be ready to throw its own exceptions manually.\n\n```java\nthrow\
    \ new exception ( “exception message”);\n```\n"
