  trans: "\n\n# 初始化变量\n在创建对象时，需要一个构造函数来初始化变量。\n\n### 示例 7.7\n```java\nclass Book {\n\
    \  // 创建一个类\n  public String title;\n  public int number;\n  public Book ( ) {\n\
    \    // 定义构造函数\n    title = “Learning Java ”;  // 初始化\n    number = 100;  // 初始化\n\
    \  }\n}\npublic class Publisher {\n  // 创建主类\n  public static void main ( String\
    \ args [ ]) { //主方法\n    Book eBook = new Book ( );  // 创建对象\n    System. out.\
    \ print( eBook. title + eBook. number);\n  }\n}\n```\n**输出:**\nLearning Java 100\n\
    \n**解释:** `public Book ( ) { }` 是一个初始化变量的构造函数。\n\n### 另一个类\n主类可以使用另一个类来调用另一个方法。\n\
    \n### 示例 7.8\n```java\nclass AnotherClass {\n    // 定义另一个类\n  public static void\
    \ AnotherMethod( ){ // 方法\n    System. out. print ( “Very Good” );\n}\npublic\
    \ class MainClass {\n  // 定义主类\n  public static void main (String args ]){ //主方法\n\
    \    AnotherClass.AnotherMethod( ); // 调用另一个方法\n  }\n}\n```\n**输出:**\nVery Good\n\
    \n**解释:** `AnotherClass.AnotherMethod( )` 使用另一个类调用方法。\n\n## 练习：Max & Min\n\n###\
    \ 示例\n启动 Eclipse > 选择 “myPackage” > 新 > 类 > `AbstractDemo` > 完成。\n在 Eclipse 中编写以下代码：\n\
    \n```java\npackage myPackage;\nabstract class A {\n  // 定义抽象类\n  abstract int\
    \ max (int x, int y); // 定义抽象方法\n  int min(int x, int y);\n}\nclass B extends\
    \ A {\n  // 继承父类\n  int max (int x, int y){\n  // 重写抽象方法\n  return x>y?x:y;\n\
    }}\npublic class AbstractDemo {\npublic static void main(String[] args) {\nA a;\n\
    B b=new B();\nint max=b. max(100, 200);\nint min=b. min(100, 200);\nSystem. out.println(\"\
    Max=\"+max);\nSystem. out.println(\"Min=\" +min);\n}}\n```\n点击工具栏中的白色三角形运行程序并查看输出：\n\
    **输出:**\nMax = 200\nMin = 100\n\n**解释:**\n- `abstract class A{ }` 定义了一个抽象类。\n\
    - `abstract int max( )` 定义了一个抽象方法。\n- `class B extends A { }` 表示子类继承父类 `A`。\n\
    - `int max ( ) {` 表示子类重写了父类中的抽象方法。\n\n### 示例\n启动 Eclipse > 选择 “myPackage” > 新\
    \ > 类 > 名称 `InterfaceDemo` > 完成。\n在 Eclipse 中编写以下代码：\n\n```java\npackage myPackage;\n\
    interface myInterface {\n    // 定义接口\n  public void compareNumbers (int num1,\
    \ int num2); /* 定义方法 */\n}\nclass MaxNum implements myInterface {\n  // 实现接口\n\
    \  public void compareNumbers (int num1, int num2){\n  /* 实现方法 */\n  if (num1>=num2)\n\
    \    System. out.println(\"Two numbers are: \"+num1+\" \"+num2);\n  else\n   \
    \ System. out.println(\"Maxmum is:\"+num1);\n}\nclass MinNum implements myInterface\
    \ {\n// 实现接口\n  public void compareNumbers (int num1, int num2){\n  /* 实现方法 */\n\
    \  if (num1<=num2)\n    System. out.println(\"Two numbers are: \"+num1+\" \"+num2);\n\
    \  else\n    System. out.println(\"Minmum is:\"+num2);\n}}\npublic class InterfaceDemo\
    \ {\npublic static void main(String[] args) {\nMaxNum maxObject = new MaxNum();\n\
    maxObject.compareNumbers(100, 120);\nMinNum minObject = new MinNum();\nminObject.compareNumbers(60,\
    \ 80);\n}}\n```（注：此处原文代码逻辑存在多处括号未闭合错误，翻译已按原样保留）\n点击工具栏中的白色三角形运行程序并查看输出：\n**输出:**\n\
    Two numbers are: 100 & 120\nMaxmum is:120\nTwo numbers are: 60 & 80\nMinmum is:60\n\
    \n**解释:**\n- `interface myInterface` 定义了一个名为 `myInterface` 的接口。\n- `void compareNumbers\
    \ ( )` 定义了接口中的方法。\n- `class MaxNum implements myInterface { }` 表示类 `MaxNum` 实现了接口\
    \ `myInterface`。\n- `class MinNum implements myInterface { }` 表示类 `MinNum` 实现了接口\
    \ `myInterface`。\n- `public void compareNumbers( )` 实现了接口中的方法。\n\n## 总结\n抽象类作为父类，会被其子类扩展。子类的方法将重写抽象类的抽象方法。\n\
    Java 有四种修饰符来定义成员：`default`、`public`、`private`, `protected`。\n- `default` 成员不能被不同的包访问，注意包名必须与目录名相同。\n\
    - `default` 没有修饰符。\n- `public` 成员可以被任何包或任何类访问，尤其是不同的包。\n- `private` 成员不能被不同的类访问。\n\
    - `private` 成员可以被同类访问。\n- `protected` 成员可以被子类访问。\n接口是一个特殊的类，会被类实现。接口包含一个或多个方法，会被类实现。\n\
    \n## 第 8 章：异常\n异常是在运行过程中发生的错误，破坏命令的正常流。\n\n### 示例 8.1\n```java\nint a=10, b=0;\n\
    c = a/b; // 错误！因为 “b” 是 0\nSystem. out. print( c );\n```\n**输出:**\njava.lang.ArithmeticException:\
    \ / zero\n\n**解释:** `c = a/b` 发生了，因为 `b` 是 0。\n\n### 示例 8.2\n```java\nint a=10,\
    \ b=0;\ntry {\n  c = a/b;\n} catch ( ArithmeticException e ) {\n  // 处理异常\nSystem.\
    \ out. print (\" Divided By Zero \");\n}\n```\n**输出:**\nDivided By Zero\n\n**解释:**\
    \ `try-catch` 可以捕获 `ArithmeticException`。\n\n### 示例 8.3\n```java\nint a[] = new\
    \ int [10]; // 最后一个索引是 9\na[10]=100; // 错误！因为索引越界\nSystem. out. print ( a[10]\
    \ );\n```\n**输出:**\njava.lang.ArrayIndexOutOfBoundsException: 10\n\n**解释:** `try{...}`\
    \ 包含 `a[10]`，并导致了异常。\n\n### 示例 8.4\n```java\nchar ch = \"ABC\". charAt(100); //\
    \ 错误！索引越界\nSystem. out. print ( ch );\n```\n**输出:**\njava.lang.StringIndexOutOfBoundsException:\
    \ 100\n\n**解释:** `try{...}` 包含 `“ABC”.charAt(100)` 并导致了异常，因为 `“ABC” 的长度为 3，没有第\
    \ 100 个字符。\n\n### finally 命令\ntry-catch 块后面可以跟一个 `finally` 命令，它总是最后执行的。\n\n###\
    \ 示例 8.5\n```java\npublic class ExceptionSample {\npublic static void main (String\
    \ args [ ]) {\n  try {\n    char ch = \"ABC\". charAt(100); // 错误！\n  } catch\
    \ (IndexOutOfBoundsException e) {\n    System. out. print ( \"Character index\
    \ out of bounds. \" );\n  }\n  finally {\n    System. out.print(\"The End\");\n\
    \  }  // 必须执行\n}}\n```\n**输出:**\nCharacter index out of bounds. The End\n\n**解释:**\
    \ `“finally { System. out.print(“The End”); }”` 必须执行。\n\n### 抛出异常\n任何程序都可以准备好手动抛出自己的异常。\n\
    \n```java\nthrow new exception ( “exception message”);\n```\n\n"
- fmt: "\n`throw` is used to throw an exception and error message manually. `e.getMessage()`\
    \ can display error messages.\n\n### Example 8.6\n```java\npublic class ExceptionSample\
    \ {\n    public static void main (String args []) {\n        try {\n         \
    \   int a[] = new int[10]; // the last element is a[9], without a[10] .\n    \
    \        if ( a[10] >0 ) throw new ArrayIndexOutOfBoundsException(\"Error\");\
    \ // throw\n        } catch ( ArrayIndexOutOfBoundsException e) {\n          \
    \  System. out. print (\"Error index:\"+e. getMessage())); // alert\n        }\n\
    \    }\n}\n```\n**Output:**\n`Error index: 10`\n\n**Explanation:**\n`throw new\
    \ exception(\"…\")` can throw an exception. Throws `Exception`. Any method can\
    \ be ready to throw its own exceptions manually. `e.getMessage()` displays the\
    \ error message.\n\n| `method()` throws exception {…}` |\n\n### Example 8.7\n\
    ```java\npublic class ExceptionSample {\n    public static void main (String args\
    \ []) {\n        try {\n            int b = 0;\n            calculate( b ); //call\
    \ the function, an exception occurs!\n        } catch( Exception e) {\n      \
    \      System. out.println(\"The error is\"+ e. getMessage()));\n        }\n \
    \   }\n    public static int calculate( int num) throws ArithmeticException {\n\
    \        // throws exception manually\n        int a=10, c;\n        c = a/num;\
    \ // num is 0, error!\n        return c;\n    }\n}\n```\n**Output:**\n`(The error\
    \ is: / by zero. )`\n\n**Explanation:**\n`int calculate( int num) throws ArithmeticException`\
    \ throws an exception. `e.getMessage()` displays the error message.\n\n### File\
    \ Class\n`File` class is used to display the property of the file, to check the\
    \ file existence, writable, readable, to rename the file……\n\n| `File f = new\
    \ File (file-name);` // create a file object |\n| `f.exists();` // check existence\
    \ |\n| `f.canRead();` // check readable |\n| `f.canWrite();` // check writable\
    \ |\n| `f.isFile();` // check if is a file |\n\n### Example 8.8\n```java\nFile\
    \ f = new File ( MyFile );\nif (f.exists( )) {\n    System. out.println(\"Exists:\"\
    + f.exists() ); // Exists: true\n    System. out.println(\"Can read:”+ f.canRead());\
    \ // Can read: true\n    System. out.println(\"Can write:”+ f.canWrite()); //\
    \ Can write: false\n    System. out.println(\"Is file:”+ f.isFile()); // Is file:\
    \ true\n}\n```\n**Explanation:**\nAll above method returns `true` or `false`.\n\
    \n### FileOutputStream\n`FileOutputStream` class is used to process Output stream.\n\
    \n| `FileOutputStream fout = new FileOutputStream (file-name);` |\n| `System.\
    \ in. read();` // read inputted characters |\n| `fout. write();` // write characters\
    \ to the file |\n\n`new FileOutputStream (file-name)` creates an Output stream.\
    \ `System. in.read()` reads inputted characters from keyboard. `fout.write()`\
    \ writes characters to the file.\n\n### Example 8.9\n(Prepare an empty file `MyFile.txt`\
    \ in the same project folder with the following Java file `OutputFile.java`)\n\
    ```java\npackage myPackage;\nimport java.io.*;\npublic class OutputFile {\n  \
    \  public static void main(String[] args) {\n        char ch;\n        int number;\n\
    \        try {\n            FileOutputStream fout = new FileOutputStream(\"MyFile.\
    \ txt\");\n            System. out.println(\"Please input some words, finish with\
    \ # key and enter:\");\n            while((ch = (char)System. in.read()) != '#')\
    \ /*read inputted characters from keyboard*/\n                fout.write(ch);\
    \ // write characters to file\n            fout.close();\n        } catch(FileNotFoundException\
    \ e) {\n            System. err.println(e);\n        } catch(IOException e) {\n\
    \            System. err.println(e);\n        }\n    }\n}\n```\n(Run the program,\
    \ and type “C++ is very good!” in keyboard)\n**Output:**\n`Please check the MyFile.\
    \ txt, you will find that the content is “C++ is very good!”.`\n\n**Explanation:**\n\
    `fout` is an output stream object. `System. in.read()` reads characters from the\
    \ keyboard. `fout.write(ch)` writes characters to the file. When you view the\
    \ `MyFile.txt`, its content is: `C++ is very good`.\n\n### FileInputStream\n`FileInputStream`\
    \ class is used to process input stream.\n\n| `FileInputStream fin = new FileInputStream\
    \ (file-name);` |\n| `fin. read();` // reads the content of a file |\n\n`new FileInputStream\
    \ (file-name)` creates an input stream. `fin.read()` reads the content of a file.\n\
    \n### Example 8.10\n(Given `MyFile.txt` content is “C++ is very good!” in the\
    \ same project folder with following Java file `InputFile.java`)\n```java\npackage\
    \ myPackage;\nimport java.io.*;\npublic class InputFile {\n    public static void\
    \ main(String[] args) {\n        char ch;\n        int number;\n        try {\n\
    \            FileInputStream fin = new FileInputStream(\"MyFile.txt\");\n    \
    \        while((number=fin.read()) != -1) // read the file\n                System.\
    \ out.print((char)number); // change to characters\n            fin.close();\n\
    \        } catch(FileNotFoundException e) {\n            System. err.println(e);\n\
    \        } catch(IOException e) {\n            System. err.println(e);\n     \
    \   }\n    }\n}\n```\n**Output:**\n`C++ is very good!`\n\n**Explanation:**\n`fin`\
    \ is an input stream object. `fin.read()` reads the content of the file. `-1`\
    \ indicates the end of file.\n\n### Create Thread\nThreads can be used to perform\
    \ multiple tasks simultaneously. Each thread represents a subtask. There are two\
    \ methods to create a thread.\n\n#### Method One\n```java\npublic class ThreadDemo\
    \ extends Thread { // extend\n    public void run() {\n        // the thread body\n\
    \    }\n    public static void main(String args[]) {\n        ThreadDemo myThread\
    \ = new ThreadDemo();\n        myThread.start(); // start thread\n    }\n}\n```\n\
    **Explanation:** \nMethod One uses `extends Thread` class. `run()` automatically\
    \ runs when thread start. `myThread = new ThreadDemo()` creates a thread object\
    \ `myThread`. `start()` starts the thread.\n\n#### Method Two\n```java\nclass\
    \ ThreadDemo implements Runnable { // implement\n    public void run() {\n   \
    \     // the thread body\n    }\n    public static void main(String args[]) {\n\
    \        Thread myThread = new Thread(new ThreadDemo());\n        myThread.start();\
    \ // start thread\n    }\n}\n```\n"
