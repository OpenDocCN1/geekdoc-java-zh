    \ args[ ]) {\n        String Str = \"Very Good\";\n        System. out. println(Str.substring\
    \ (5, 7) );  /* 从索引“5”到索引“7-1”提取某些字符 */\n    }\n}\n```\n**输出：** `Go`  \n**解释：**\
