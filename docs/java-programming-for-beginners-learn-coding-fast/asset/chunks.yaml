- fmt: "\n`obj = new Class-name( );` creates a new object named `obj` for the class.\
    \ `obj. variable;` means that `obj` references a variable. `obj. function-name\
    \ ( );` means that `obj` references a method.\n\n### Example 5.5\n```java\nColor\
    \ obj = new Color( ) ;  // create an object “obj”\nobj. c1= \"yellow\";  // an\
    \ object references a variable\nobj. c2=”purple”;     // an object references\
    \ a variable\nobj. brightness ( );  // an object references a method\n```\nExplanation:\
    \ `Color obj = new Color;` creates an object named `obj`, then references variable\
    \ `c1` and `c2`. `obj. brightness ( );` calls the function `brightness ( );` (in\
    \ previous page), and returns `blue`.\n\n### Class & Object\nExample:\n```java\n\
    public class Color {\n    // define a class\n    String c1, c2;\n    void brightness\
    \ ( ) { \n        System. out . println(\"This flower is \" + c1);\n        System.\
    \ out . println(\"That flower is \" + c2);\n    }\n    public static void main(String[]\
    \ args) {\n        Color obj = new Color( );      // create an object\n      \
    \  obj. c1= \"yellow. \";\n        obj. c2=\"purple. \";     // references\n \
    \       obj. brightness ( );      // an object references a method\n    }\n}\n\
    ```\nOutput:\n```\nThis flower is yellow.\nThat flower is purple.\n```\nExplanation:\
    \ `public class Color { }` defines a class. `Color obj = new Color( );` creates\
    \ an object.\n\n### Constructor\nThe constructor is used to initialize variable.\
    \ Constructor name is the same as class name.\n\n```java\nclass Class-name{\n\
    \    Class-name( ) { …}      // constructor for initialization\n}\n```\n`class\
    \ Class-name{ …}` defines a class. `Class-name( ) { …}` declares a constructor.\n\
    \n### Example 5.6\n```java\npublic class Color {  // create a class\n    String\
    \ c1, c2;\n    Color ( ) {\n      c1=”yellow\";\n      c2=”purple\"; \n    } \
    \ // constructor\n}\n```\nExplanation: `Color ( ) { c1=”yellow\"; c2=”purple\"\
    ; }` is a constructor. It initializes variable `c1` as `yellow` and `c2` as `purple`,\
    \ when an object is created the constructor will be called automatically.\n\n\
    ### Constructor Example\nExample:\n```java\npublic class Color {\n   // define\
    \ a class\n    String c1, c2;\n    Color ( ) {\n        c1=\"yellow\";\n     \
    \   c2=\"purple\";\n    }    // constructor\n    void brightness ( ) {\n     \
    \   System. out . println(\"This flower is \" + c1);\n        System. out . println(\"\
    That flower is \" + c2);\n    }\n    public static void main(String[] args) {\n\
    \        Color obj = new Color( );  //create an object, call constructor\n   \
    \     obj. brightness ( );\n    }\n}\n```\nOutput:\n```\nThis flower is yellow.\n\
    That flower is purple.\n```\nExplanation: `Color ( ) {c1=\"yellow\"; c2=\"purple\"\
    ;}` creates a constructor. `Color obj = new Color( );` creates an object, and\
    \ calls the constructor automatically.\n\n### Overloading\nOverloading means that\
    \ there are two or more same-name methods in a class, and their arguments are\
    \ different.\n\n### Example 5.7\n```java\npackage correctPackage;\nclass Color{\n\
    \    String x,y;  // declare a class\n    Color ( String a, String b) { x=a; y=b;\
    \ }  // overloading\n    Color ( ) {\n      x=\"yellow \";\n      y=\"purple \"\
    ;\n    }  //overloading\n    public static void main (String args[ ]) {\n    \
    \    Color obj1=new Color(\"green \", \"orange \");\n        Color obj2=new Color(\
    \ );\n        System. out . println(obj1. x + obj2. y);\n    }\n}\n```\nOutput:\n\
    ```\ngreenorange\nyellowpurple\n```\nExplanation: In this class, there are two\
    \ methods named `Color( )` with some arguments, which are known as `overloading`.\n\
    \n### `this` Keyword (1)\n`this` is used to represent current object.\n\n### Example\
    \ 5.8\n```java\npackage correctPackage;\nclass MyClass {\n    int num;\n    void\
    \ test(int num) {\n        this. num=num;  // “this” represents the “obj”\n  \
    \      System. out . println( this. num );\n    }\n    public static void main(String[\
    \ args) {\n        MyClass obj = new MyClass( );\n        obj. test(10);\n   \
    \ }\n}\n```\nOutput:\n```\n10\n```\nExplanation: In above, when `obj. test(10)`\
    \ calls `test ( ) {` method, `this` signifies the object `obj`.\n\n### `this`\
    \ Keyword (2)\n`this` can present another same-name constructor.\n\n### Example\
    \ 5.9\n```java\nclass MyClass {\n    int x, y;\n    MyClass ( ) {\n        this\
    \ ( 100, 200 );  // ”this” presents MyClass ( int a, int b){ }\n    }\n    MyClass\
    \ ( int a, int b){\n        x=a;\n        y=b;\n    }\n}\n```\nExplanation: `this\
    \ ( 100, 200 )` represents another same-name constructor `MyClass ( int a, int\
    \ b){ }`. Note that `this` cannot represent non-constructor method.\n\n### Instance\
    \ & Local variable\nAn instance variable is defined in a class. It works in the\
    \ current class. The local variable is defined in a method. It works in the current\
    \ method.\n\n### Example 5.10\n```java\nclass Point {\n    int x = 100, y = 200;\
    \  // instance variable\n    void test( ){\n        int x = 1, y = 2;  // local\
    \ variable\n    }\n}\n```\nExplanation: `int x = 100, y = 200;` defines two instance\
    \ variables inside a class. `int x = 1, y = 2;` defines two local variables inside\
    \ a method.\n\n### Exercise: Contact Info\nStart up Eclipse > Select `myPackage`\
    \ > new > class > name > Message > Finish. Write following codes in Eclipse\n\
    ```java\npackage myPackage;\npublic class Message {\n    // declare a class\n\
    \    String name, email, phone;\n    public Message (String theName, String theEmail,\
    \ String thePhone){\n      // declare a constructor for initialization\n     \
    \ name = theName;\n      email = theEmail;\n      phone = thePhone;\n    }\n \
    \   void displayEmail(){\n      // declare a function\n      System. out . println(\"\
    Email:\" + email);\n    }\n    void displayPhone(){\n      // declare a function\n\
    \      System. out . println(\"Phone:\" + phone);\n    }\n    public static void\
    \ main(String[] args) {\n      // main function\n      Message JACK = new Message\
    \ (\"JACK\", \"JACK@xxx. xxx\", \"678-xxx-9999\");  //create an object JACK, call\
    \ the constructor\n      System. out . println(JACK.name );\n      JACK.displayEmail(\
    \ );  // call a function\n      Message ANDY = new Message (\"ANDY\", \"ANDY@xxx.\
    \ xxx\", \"567-xxx-0000\");  //create an object ANDY, call the constructor\n \
    \     System. out . println(ANDY.name );\n      ANDY.displayPhone( );  // call\
    \ a function\n    }\n}\n```\nClick White Triangle Green Button in the tool bar\
    \ to run the program and see the output:\nOutput:\n```\nJACK\nEmail:JACK@xxx .\
    \ xxx\nANDY\nPhone:567-xxx-0000\n```\nExplanation: `public class Message` defines\
    \ a class `Message`. `public Message(……)` defines a constructor, initializes three\
    \ string variables. `Message JACK = new Message (……)` creates an object `JACK`,\
    \ and automatically calls the constructor to initialize three string variables.\
    \ `JACK.name` references the variable `name`. `JACK.displayEmail()` calls the\
    \ function `displayEmail( )`. `Message ANDY = new Message (……)` creates an object\
    \ `ANDY`, and automatically calls the constructor to initialize three string variables.\
    \ `ANDY.name` references the variable `name`. `ANDY.displayPhone()` calls the\
    \ function `displayPhone( )`.\n\n### Summary\n- The Method is a code block that\
    \ can be repeated to use.\n- `type method-name( ){….. }` declares a method.\n\
    - `method-name( )` calls a method.\n- A method sometimes has an argument.\n- `return\
    \ value` can return a value to the caller.\n- A class is a template for an object,\
    \ and creates an object.\n- `class Class-name { }` defines a class.\n- An object\
    \ is an instance of a class. `obj = new Class-name( );` creates an object.\n-\
    \ The constructor is used to initialize variable. Constructor name is the same\
    \ as class name.\n- Overloading means that there are two or more same-name methods\
    \ in a class, and their arguments are different.\n- `this` is used to represent\
    \ a current object.\n- `this` can present another same-name constructor.\n- An\
    \ instance variable is defined in a class. It works in the current class.\n- The\
    \ local variable is defined in a method. It works in the current method.\n\n###\
    \ Chapter 6 Inheritance & Modifiers\n### Inheritance\nA class can be extended\
    \ by a subclass.\n\n```java\nclass sub-class extends parent-class;\n```\n`extends`\
    \ is used in a sub class extends a parent class.\n\n### Example 6.1\n```java\n\
    class parent_class{\n    // parent class\n    // define variable here\n    //\
    \ define method here\n}\nclass sub_class extends parent_class{\n    // sub class\n\
    \    // define variable here\n    // define method here\n}\n```\nExplanation:\
    \ `class sub_class extends parent_class` means that a sub class extends a parent\
    \ class (also called super class). Sub class can access the variable and method\
    \ in the parent class, but cannot access the private variable and private method\
    \ in the parent class.\n\n### `super` keyword\nIn sub class, `super` is used to\
    \ call the constructor of the parent class.\n\n```java\nsuper ( argument );\n\
    ```\n"
