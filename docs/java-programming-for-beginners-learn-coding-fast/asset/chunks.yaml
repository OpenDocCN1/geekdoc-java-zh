  trans: "\n\n# 解析\n方法二使用了 `implements Runnable` 接口。线程启动时，`run()` 会自动运行。`new Thread(new\
    \ ThreadDemo())` 创建了一个线程对象 `myThread`。`start()` 启动线程。\n\n## 继承 Thread (示例 8.11)\n\
    \n```java\npublic class ThreadDemo extends Thread { \n    // extends\n    public\
    \ void run() {\n        // 线程体\n        for(int i = 0; i < 3; i++) {\n       \
    \     System.out.println(\"Thread! \");\n        }\n    }\n    public static void\
    \ main(String[] args) {\n        ThreadDemo myThread = new ThreadDemo();\n   \
    \     myThread.start(); // start thread\n    }\n}\n```\n**输出：**\n```\nThread!\n\
    Thread!\nThread!\n```\n**解析：**\n线程启动时，`run()` 会自动运行。`myThread = new ThreadDemo();`\
    \ 创建了一个线程对象 `myThread`。`start()` 启动线程。\n\n## 实现 Runnable (示例 8.12)\n```java\n\
    class ThreadDemo implements Runnable { \n    // implements\n    public void run()\
    \ {\n        // 线程体\n        for(int i = 0; i < 3; i++) {\n            System.out.println(\"\
    Thread! \");\n        }\n    }\n    public static void main(String[] args) {\n\
    \        Thread myThread = new Thread(new ThreadDemo());\n        myThread.start();\
    \ // start thread\n    }\n}\n```\n**输出：**\n```\nThread!\nThread!\nThread!\n```\n\
    **解析：**\n线程启动时，`run()` 会自动运行。`myThread = new Thread(new ThreadDemo())` 创建了一个线程对象\
    \ `myThread`。`start()` 启动线程。\n\n## 多线程 (示例 8.13)\n```java\nclass ThreadDemo extends\
    \ Thread {\n    public ThreadDemo(String threadName) {\n        super(threadName);\
    \ // 初始化线程名\n    }\n    public void run() {\n        // 线程体\n        for(int i\
    \ = 0; i < 2; i++) {\n            System.out.println(getName() + \" running! \"\
    );\n        }\n    }\n}\npublic class UseThread {\n    public static void main(String[]\
    \ args) {\n        ThreadDemo myThread1 = new ThreadDemo(\"1st thread\");\n  \
    \      ThreadDemo myThread2 = new ThreadDemo(\"2nd thread\");\n        ThreadDemo\
    \ myThread3 = new ThreadDemo(\"3rd thread\");\n        myThread1.start(); // start\
    \ thread\n        myThread2.start(); // start thread\n        myThread3.start();\
    \ // start thread\n    }\n}\n```\n**输出：**\n```\n1st thread running!\n1st thread\
    \ running!\n2nd thread running!\n2nd thread running!\n3rd thread running!\n3rd\
    \ thread running!\n```\n**解析：**\n`super(threadName)` 通过 `Thread` 类构造函数初始化线程名。`getName()`\
    \ 返回线程名。线程启动时，`run()` 会自动运行。`new myThread(\"1st thread\")` 创建了一个名为 `1st Thread`\
    \ 的线程对象。`myThread1.start();` 启动线程 `myThread1`。\n\n## 线程的方法\n- `thread.start()`\
    \ 启动线程。\n- `thread.stop()` 停止线程。\n- `thread.sleep()` 让线程休眠一段时间。\n- `thread.wait()`\
    \ 让线程处于等待状态。\n- `thread.notify()` 唤醒正在等待的线程。\n- `thread.yield()` 让相同优先级的其他线程运行。\n\
    - `thread.isAlive()` 测试当前线程存活。\n- `thread.currentThread()` 获取当前线程。\n- `thread.interrupt()`\
    \ 停止“阻塞”的线程。\n- `thread.suspend()` 让线程暂停。\n- `thread.resume()` 重新启动线程。\n- `thread.join()`\
    \ 在其他线程结束后后运行此线程。\n\n**例如：**\n```java\nif(time_to_stop){\n    thread.currentThread().stop();\
    \ // 停止当前线程 .\n}\n```\n\n## 线程示例 (示例 8.14)\n```java\nclass ThreadDemo implements\
    \ Runnable {\n    public void run() {\n        // 线程体\n        ……\n        wait();\
    \ // 让线程处于等待状态 .\n        ……\n    }\n}\nclass TextThread {\n    public static\
    \ void main(String args[]) {\n        Thread myThread = new Thread(new ThreadDemo());\n\
    \        myThread.start(); // start thread\n        Thread.sleep(1000); // 让线程休眠\
    \ 1 秒\n        notify(); // 唤醒正在等待的线程\n        Thread.yield(); /* 让相同优先级的其他线程优先运行\
    \ . */\n    }\n}\n```\n**解析：**\n`wait()` 让当前线程等待。`new Thread(new ThreadDemo())`\
    \ 创建一个线程。`myThread.start()` 启动线程。`Thread.sleep(1000)` 让线程休眠 1000 毫秒。`notify()`\
    \ 唤醒正在等待的线程。`Thread.yield()` 让相同优先级的线程优先运行。\n**注意：** 现在不建议使用 `suspend()` 和 `resume()`。\n\
    \n## 练习：OutOfRangeException 示例\n启动 Eclipse > 选择 \"myPackage\" > new > class >\
    \ name > `ArrayOutRange` > 完成。在 Eclipse 中编写以下代码。\n\n```java\npackage myPackage;\n\
    public class ArrayOutRange {\n    public static void main(String[] args) {\n \
    \       try {\n            int n = 0;\n            String color[] = {\"Red\",\
    \ \"Yellow\", \"Green\"};\n            while (n < 4) {\n                System.out.println(color[n]);\n\
    \                n++;\n            }\n        } catch (ArrayIndexOutOfBoundsException\
    \ e) {\n            System.out.println(\"Exception Occurs!\");\n        }\n  \
    \  }\n}\n```\n点击运行 按钮运行程序，可以看到输出：\n**输出：**\n```\nRed\nYellow\nGreen\nException\
    \ Occurs!\n```\n\n## 步骤说明\n- **第 1 步：多线程**：启动 Eclipse > 选择 \"myPackage\" > new\
    \ > class > name > `ArrayOutRange` > 完成。\n- **第 2 步：包**：`ThreadClass` 用于包含各种...\n\
    - **第 3 步：类**：创建 `ThreadClass`。\n- **第 4 步：编写 Java 代码**：\n```java\npackage myPackage;\n\
    public class ThreadClass {\n    public static void main(String[] args) {\n   \
    \     ThreadDemo myThread1 = new ThreadDemo(\"Thread One\");\n        ThreadDemo\
    \ myThread2 = new ThreadDemo(\"Thread Two\");\n        myThread1.start(); // start\
    \ thread\n        myThread2.start(); // start thread\n    }\n}\n\nclass ThreadDemo\
    \ extends Thread {\n    public ThreadDemo(String str) {\n        super(str); //\
    \ 初始化线程名\n    }\n    public void run() {\n        // 线程体\n        for(int i =\
    \ 0; i < 2; i++) {\n            try {\n                sleep((int)(Math.random()\
    \ * 1500)); // 让线程休眠\n            } catch (InterruptedException e) {}\n      \
    \      System.out.println(getName() + \" running!\");\n        }\n    }\n}\n```\n\
    - **第 5 步：运行程序**：点击运行 按钮运行程序，你可以看到输出：\n**输出：**\n```\nThread One running!\nThread\
    \ Two running!\nThread One running!\nThread Two running!\n```\n**解析：** `thread1.start()`\
    \ 和 `thread2.start()` 交替运行。`sleep((int)(Math.random() * 1500))` 让一个线程休眠而另一个在运行。\n\
    \n## 总结\n异常是程序运行发生的错误，会破坏正常执行流。`try-catch` 可以捕获并处理异常。当数组索引越界时，会发生异常。当字符索引越界时，会发生异常。`try-catch`\
    \ 块后面可以跟 `finally` 命令，它总是会被执行。`throw` 用于手动抛出异常和错误信息。任何方法都可以准备好手动抛出自己的异常。`e.getMessage()`\
    \ 显示错误信息。File 类用于显示文件的属性，检查文件是否存在、可写、可读、重命名文件。`new FileOutputStream(file-name)`\
    \ 创建输出流。`System.in.read()` 从键盘读取字符。`fout.write()` 将字符写入文件。`new FileInputStream(file-name)`\
    \ 创建输入流。`fin.read()` 读取文件内容。线程可以并发执行多个任务。每个线程代表一个子任务。创建线程有两种：1.继承 Thread；2. 实现\
    \ Runnable。\n\n## 测试与答案\n### 测试\n请选择正确答案\n\n**(1)**\n```java\npackage myPackage;\n\
    public class Calculation {\n    public static void main(String args[]) {\n   \
    \     int a = 100, b = 5;\n        fill in here c = a/b*10; // \"c\" 的数据类型\n \
    \       System.out.print(\"C = \" + c);\n    }\n}\n```\nA. var\nB. string\nC.\
    \ boolean\nD. int\n\n**(2)**\n```java\npackage myPackage;\npublic class WhileStatement\
    \ {\n    public static void main(String[] args) {\n        int n = 1;\n      \
    \  int sum = 0;\n        fill in here (n <= 100) { // 循环语句\n            sum +=\
    \ n;\n            n++;\n        }\n        System.out.println(\"Sum = \" + sum);\n\
    \    }\n}\n```\n\n"
