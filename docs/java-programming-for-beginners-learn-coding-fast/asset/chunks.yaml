    # Chapter 1 Start JAVA


    ## Install Java


    In order to create any Java program, the Java development environment needs to
    be available on the local computer system.


    `JDK` (also called `JSDK`, `Java SE`) `JDK` (`Java Development Kit`) contains
    all Java class libraries, all tools building and running Java programs. `JDK`
    can create a Java development environment.


    Download `JDK`: `http://oracle.com/download/com/download/http://www.oracle.com/technetwork/java/javase/downloads/index`


    Please click the link to download the newest version `JDK` at Oracle website.
    (Figure 1)


    If your computer is a 32-bit operating system, download the `JDK` with `x86`;
    If your computer is a 64-bit operating system, download the `JDK` with `x64`.
    (Figure 2)


    Please install the newest version of `JDK` to your computer. Congratulation! Once
    `JDK` has been installed successfully, the system is ready to start running Java
    programs!


    ## IDE (Integrated Development Environment)


    `IDE` (`Integrated Development Environment`) is used to write, edit and run Java.
    `IDE` contains many Java development tools, compiler and debugger. There are many
    excellent free IDEs for download on the internet, please download one IDE by the
    following links:


    | IDE(editor) | Web Sites |

    | :--- | :--- |

    | Eclipse | `http://www.eclipse.org` |

    | NetBeans | `https://netbeans.org/` |

    | DrJava | `http://www.drjava.org/` |

