  trans: "\n\n`super ( argument );` 位于子类构造函数的第一行，用于调用父类的构造函数。\n\n### 示例 6.2\n```java\n\
    class super_class{\n    super_class (int x, int y){   \n        // 构造函数\n    \
    \    this. x=x;  \n        this . y=y;\n    }\n}\nclass sub_class extends super_class{\n\
    \    sub_class(int x, int y){   \n        // 构造函数\n        super ( x,y ); // 调用父类的构造函数\n\
    \    }\n}\n```\n**解释：** `super ( x,y );` 调用了 `super` 类中的构造函数。\n\n### 重写 (Overriding)\n\
    如果方法名和参数相同，子类的方法可以重写父类的方法。\n\n### 示例 6.3\n```java\nclass Super_class{\n    int\
    \ test( int num ) { return num; } // 重写\n}\nclass Sub_class extends Super_class{\n\
    \    int test( int num ) { return 100 + num; } // 重写\n}\npublic class OverridingClass\
    \ {\n    public static void main (String args[ ]){\n        Sub_class obj=new\
    \ Sub_class( );\n        System. out. print( obj. test( 200 ));\n    }\n}\n```\n\
    **输出：** 300\n**解释：** 当 `obj. test( 200 )` 调用 `int test( ){ }` 时，子类中的 `int test(\
    \ ){ }` 重写了父类中的 `int test( ){ }`，因为它们具有相同的名称和相同的参数。\n\n### 重载 (Overloading) 与\
    \ 重写 (Overriding)\n\n| 类型 | 描述 |\n| :--- | :--- |\n| 重载 | 方法名相同，参数不同，在同一个类中。 |\n\
    | 重写 | 方法名相同，参数相同，位于父类和子类之间。 |\n\n### 示例 6.4 (重载)\n```java\nclass Color{ \n  \
    \  String x,y;  \n    Color ( String a, String b) { x=a; y=b; } // 重载\n    Color\
    \ ( ) {  \n        x=”yellow\";  \n        y=”purple\";\n    } // 重载\n}\n```\n\
    \n### 示例 6.5 (重写)\n```java\nclass super_class{\n    int test( int num ) { return\
    \ num; } // 重写\n}\nclass sub_class extends super_class{\n    int test( int num\
    \ ) { return 100 + num; } // 重写\n}\n```\n**解释：** 示例 1 是重载。示例 2 是重写。\n\n### 静态变量\
    \ (Static variable)\n`static variable` 被称为类变量，可以通过类或对象进行引用。\n- `非静态变量` 无法通过类引用。\n\
    - `非静态变量` 只能通过对象引用。\n\n### 示例 6.6\n```java\nclass MyClass {\n    static int count=100;\
    \ // 一个静态变量\n    public static void main (String args[ ]){\n        System. out.\
    \ print( MyClass.count );\n        /* MyClass 直接引用静态变量 “count” */\n    }\n}\n\
    ```\n**输出：** 100\n**解释：** `static int count=100` 定义了一个静态变量。`MyClass. count` 意味着类\
    \ `MyClass` 直接引用了静态变量 `count`。注意，对象也可以引用静态变量。\n\n### 静态方法 (Static Method)\n`static\
    \ method` 被称为类方法，可以通过类或对象进行调用。\n- `非静态方法` 无法通过类引用。\n- `非静态方法` 只能通过对象引用。\n\n###\
    \ 示例 6.7\n```java\nclass MyClass {\n    static int count( ) { return 100 ;} //\
    \ 定义一个静态方法\n    public static void main (String args[ ]){\n        System. out.\
    \ print( MyClass.count( ) );\n        /* MyClass 直接调用静态方法 “count()” */\n    }\n\
    }\n```\n**输出：** 100\n**解释：** `static int count( ) { return 100 }` 定义了一个静态方法。`MyClass.\
    \ count( )` 意味着类 `MyClass` 直接调用静态方法 `count()`。注意，对象也可以调用静态方法。\n\n### final 变量\
    \ (final Variable)\n`final` 是一个关键字。\n`final+变量` 意味着该变量的值不能被。\n\n### 示例 6.8\n```java\n\
    class MyClass{\n    final int x =100; // 定义一个 final 变量\n    static void test()){\
    \ x = 200 ;} // 错误！ “x” 是 final 变量\n    public static void main (String args[\
    \ ]){\n        System. out. print( MyClass. test( ) );\n    }\n}\n```\n**解释：**\
    \ `final int x =100` 定义了一个 final 变量 `x`，其值为 100 且无法更改。`static void test( ) { x\
    \ = 200;}` 试图修改 `x` 的值，但发生了错误。\n\n### final 方法 (final Method( ))\n`final` 是一个关键字。\n\
    `final method( )` 意味着该方法不能被重写。\n\n### 示例 6.9\n```java\nclass animal{\n    final\
    \ void test ( ){ // 定义一个 final 方法\n        System. out. print(“animal”);\n   \
    \ }\n}\nclass dog extends animal {\n    void test ( ){ // 错误！因为 test() 想要重写…\n\
    \        System. out. print(“dog”);\n    }\n}\n```\n**解释：** (由于原文未提供解释，此处保持格式逻辑)\n\
    \n### final 类 (final class)\n`final` 是一个关键字。\n`final class` 意味着该类不能被继承。\n\n###\
    \ 示例 6.10\n```java\nfinal class animal {\n    // 定义一个 final 类\n    // 定义一些变量;\n\
    \    // 定义一些方法;\n}\nclass elephant extends animal { // 错误！无法继承\n}\n```\n**解释：**\
    \ `final class` 定义了一个 final 类。`elephant extends animal` 无法继承。\n\n### 多态 (Polymorphism)\n\
    多态是指对不同对象执行相同方法的能力。\n\n### 示例 6.11\n```java\nclass Animal{\n    cry( ){ // 父类\n\
    \        System. out. print(\"crying...... \");\n    }\n}\nclass Dog extends Animal{\
    \ // 子类\n    cry( ){ // 重写\n        System. out. print(\"Wow, Wow...... \");\n\
    \    }\n}\nclass Cat extends Animal{ // 子类\n    cry( ){ // 重写\n        System.\
    \ out. print(\"Meow, Meow...... \");\n    }\n}\nclass PolymorphismDemo{\n    public\
    \ static void main(String args[ ]){\n        Animal animalVar;\n        animalVar\
    \ = new Dog( ); // 创建 dog 对象\n        animalVar. cry( ); // dog 调用 cry()\n   \
    \     animalVar = new Cat( ); // 创建 cat 对象\n        animalVar. cry( ); // cat\
    \ 调用 cry()\n    }\n}\n```\n**输出：**\nWow, Wow......\nMeow, Meow......\n**解释：**\
    \ `animalVar = new Dog( )` 创建了一个 dog 对象，因此 `animalVar. cry( )` 调用了子类 `Dog` 中的\
    \ `cry()` 方法`animalVar = new Cat( )` 创建了一个 cat 对象，因此 `animalVar. cry( )` 调用了子类\
    \ `Cat` 中的 `cry()` 方法。\n\n### 包与导入 (Package & Import)\n`package package-name;`\n\
    `import package. class;`\n\n`package package-name` 创建或使用一个包。`import package. class`\
    \ 导入一个包或其类。\n\n### 示例 6.12 (在 file1)\n```java\npackage myPackage;\n/* 创建包含两个类的包\
    \ */\nclass MyClass1 {…}\nclass MyClass2 {…}\n```\n\n### 示例 6.13 (在 file2)\n```java\n\
    package myPackage;\n// 使用包 “myPackage”\nimport myPackage. *; // 导入 myPackage 的所有类\n\
    ```\n**解释：** `package myPackage` 创建了一个名为 `myPackage` 的包，包含两个类（file1 中的 `MyClass1`\
    \ 和 `MyClass2`）。`import myPackage. * ` 将 file1 中包 `myPackage` 的所有类导入到 file2。注意\
    \ `package` 命令必须位于 `import` 命令的上方。\n\n### 构建包，导入类\n\n| 命令 | 描述 |\n| :--- | :---\
    \ |\n| `package myPackage;` | 构建一个包 |\n| `import anyClass;` | 导入一个类 |\n\n"
- fmt: "\n# Example 6.14 (In Drive.java)\n\n```java\npackage myPackage;   // create\
    \ a package containing a class\npublic class Drive{\n    public void getDistance\
    \ (int mph, float time){\n        System. out. println(\"SPEED:\" + mph + \" MILES/HOUR\"\
    );\n        System. out. println(\"TIME:\" + time + \" HOURS\");\n        System.\
    \ out. println(\"DISTANCE:\" + time*mph + \" MILES\");\n    }\n}\n```\n\n# Example\
    \ (In TestDrive.java)\n\n```java\npackage myPackage;    // use \"myPackage\"\n\
    import myPackage.Drive;    // import class \"Drive\" in myPackage\npublic class\
    \ TestDrive{\n    public static void main (String args[ ]) {\n        Drive myDrive\
    \ = new Drive( );\n        myDrive. getDistance(120, 5);\n    }\n}\n```\n\n###\
    \ Output\n```\nSPEED: 120 MILES/HOUR\nTIME: 5 HOURS\nDISTANCE: 600 MILES\n```\n\
    \n### Explanation\n- `package myPackage;` creates a package `myPackage` in `Drive.java`.\n\
    - `import myPackage. Drive;` imports a class `Drive` of `myPackage`.\n- `Drive\
    \ myDrive = new Drive( )` can create an object `myDrive` in file `TestDrive`,\
    \ because `Drive` class has been imported from `Drive.java`.\n- `myDrive. getDistance(120,\
    \ 5);` calls a method in `Drive.java`.\n\n**Note:** `package` command must be\
    \ in above of the `import` command.\n\n# Exercise: Inheritance\n\n## Inheritance\
    \ Example\nStart up Eclipse > Select `myPackage` > new > class > name > `InheritanceDemo`\
    \ > Finish. Write following codes in Eclipse.\n\n```java\npackage myPackage;\n\
    class code1{\n    // parent class\n    int x, y;\n    code1(int a, int b){\n \
    \       // constructor\n        x = a; y = b;\n    }\n}\nclass code2 extends code1{\n\
    \  // sub class\n    code2 (int a, int b){\n        // constructor\n        super\
    \ (a,b); // call the constructor in the parent class \n    }\n}\npublic class\
    \ InheritanceDemo {\n    public static void main(String[] args) {\n      // main\
    \ function\n      int result;\n      code2 number = new code2(100, 200); /* create\
    \ an object \"number\", and call code2 constructor automatically */\n      result\
    \ = number. x + number. y;\n      System. out . println(\"Sum = \" + result);\n\
    \    }\n}\n```\n\nClick White Triangle Green Button in the tool bar to run the\
    \ program and see the output:\n\n### Output\n```\nSum = 300\n```\n\n### Explanation\n\
    - `class code1` creates a super class `code1`.\n- `code1(int a, int b){ }` defines\
    \ a constructor.\n- `class code2 extends code1` creates sub class `code2` that\
    \ extends super class `code1`.\n- `code2 (int a, int b){ }` defines a constructor.\n\
    - `super (a,b)` calls the constructor in super class so as to initialize the variable\
    \ `x` and `y`.\n- `public class InheritanceDemo` creates a main class.\n- `code2\
    \ number = new code2(100, 200)` creates an object `number`, automatically calls\
    \ constructor `code2( ){ }`, and passes two parameters `100` and `200` to the\
    \ constructor, so as to initializes the variable `x` and `y`.\n- `member. x` references\
    \ variables `x`, its value is `100`.\n- `member. y` references variables `y`,\
    \ its value is `200`.\n\n## Summary\n- A class can be extended by a subclass,\
    \ which is called inheritance.\n- In sub class, `super` is used to call the constructor\
    \ of the parent class.\n- The method of sub class can override the method of the\
    \ super class, if the method name and argument are the same.\n- `static variable`\
    \ is known as a class variable, it can be referenced by the class or object.\n\
    - `Non static variable` cannot be referenced by class.\n- `Non static variable`\
    \ can be referenced by object only.\n- `static method` is known as a class method,\
    \ it can be called by the class or object.\n- `Non static method` cannot be referenced\
    \ by class.\n- `Non static method` can be referenced by object only.\n- `final+\
    \ variable` means that variable value cannot be modified.\n- `final method( )`\
    \ means that method cannot be overridden.\n- `final class` means that class cannot\
    \ be extended.\n- Polymorphism describes the ability to perform different method\
    \ for different objects.\n- `package package-name` creates or use a package.\n\
    - `import package. class` imports a package or its class.\n\n# Chapter 7: Abstract\
    \ & Interface\n\n## Abstract\n`Abstract class` works as a parent class, which\
    \ will be extended by its sub class. The method of sub class will override the\
    \ abstract method of the abstract class.\n\n### Example 7.1\n```java\nabstract\
    \ class books{\n  //define a abstract class\n  abstract int read( );  //define\
    \ a abstract method\n}\nclass eBooks extends books{\n  //extend the parent class\n\
    \  int read ( ){ return 100; } //override the abstract method\n}\n```\n\n### Explanation\n\
    - `abstract class books{ }` defines a abstract class.\n- ` abstract int read(\
    \ )` defines a abstract method.\n- `class eBooks extends books { }` means a sub\
    \ class `eBooks` extends the parent class `books`.\n- `int read ( ) { }` means\
    \ this method in sub class overrides the abstract method in the parent class.\n\
    \n### Abstract Example\n```java\npackage myPackage;\nabstract class Books{\n \
    \   //create an abstract class\n    abstract void read();\n    //create an abstract\
    \ method\n}\nclass eBooks extends Books{\n  //extend the parent class\n  void\
    \ read(){\n    //override the abstract method\n    System. out . println(\"Overrides\
    \ the abstract method! \");\n  }\n}\npublic class AbstractExample {\n    public\
    \ static void main(String[] args){\n        eBooks obj =new eBooks();\n      \
    \  obj. read();\n    }\n}\n```\n\n### Output\n```\nOverrides the abstract method!\n\
    ```\n\n## Permission\nJava has four permission modifiers to define a member. `default`,\
    \ `public`, `private`, `protected`.\n\n| Class | default | public | private |\
    \ protected |\n| :--- | :--- | :--- | :--- | :--- |\n| same class | V | V | V\
    \ | V |\n| same packageparent class | V | V | X | V |\n| same packagesub class\
    \ | V | V | X | V |\n| different packageparent class | X | V | X | X |\n| different\
    \ packagesub class | X | V | X | V |\n"
