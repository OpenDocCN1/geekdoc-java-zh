    \ ( );      // 一个对象引用一个方法\n    }\n}\n```\n输出：\n```\nThis flower is yellow.\nThat\
    \ flower is purple.\n```\n解释：`public class Color { }` 定义了一个类。`Color obj = new\
    \ Color( );` 创建了一个对象。\n\n### 构造函数\n构造函数用于初始化变量。构造函数名与类名相同。\n\n```java\nclass Class-name{\n\
