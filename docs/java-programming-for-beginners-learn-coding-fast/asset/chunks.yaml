    \ rename the file. `new FileOutputStream(file-name)` creates an Output stream.\
    \ `System.in.read()` reads inputted characters from keyboard. `fout.write()` writes\
    \ characters to the file. `new FileInputStream(file-name)` creates an input stream.\
    \ `fin.read()` reads the content of a file. Threads can be used to perform multiple\
    \ tasks simultaneously. Each thread represents a subtask. There are two methods\
    \ to create a thread: 1. Extends Thread; 2. Implements Runnable.\n\n## Appendix\
