- fmt: "\n`super ( argument );` is placed the first line in the constructor of sub\
    \ class, to call the constructor of the parent class.\n\n### Example 6.2\n```java\n\
    class super_class{\n    super_class (int x, int y){   \n        // constructor\n\
    \        this. x=x;  \n        this . y=y;\n    }\n}\nclass sub_class extends\
    \ super_class{\n    sub_class(int x, int y){   \n        // constructor\n    \
    \    super ( x,y ); // call the constructor of the parent class\n    }\n}\n```\n\
    **Explanation:** `super ( x,y );` calls the constructor in the `super` class.\n\
    \n### Overriding\nThe method of sub class can override the method of the super\
    \ class, if the method name and argument are the same.\n\n### Example 6.3\n```java\n\
    class Super_class{\n    int test( int num ) { return num; } // overriding\n}\n\
    class Sub_class extends Super_class{\n    int test( int num ) { return 100 + num;\
    \ } // overriding\n}\npublic class OverridingClass {\n    public static void main\
    \ (String args[ ]){\n        Sub_class obj=new Sub_class( );\n        System.\
    \ out. print( obj. test( 200 ));\n    }\n}\n```\n**Output:** 300\n**Explanation:**\
    \ When `obj. test( 200 )` calls the `int test( ){ }`, the `int test( ){ }` in\
    \ sub class overrides the `int test( ){ }` in the super class, because they have\
    \ the same name and same argument.\n\n### Overloading & Overriding\n\n| type |\
    \ description |\n| :--- | :--- |\n| overloading | same method name, different\
    \ argument, in the same class. |\n| overriding | same method name, same argument,\
    \ in between super class and sub class. |\n\n### Example 6.4 (overloading)\n```java\n\
    class Color{ \n    String x,y;  \n    Color ( String a, String b) { x=a; y=b;\
    \ } // overloading\n    Color ( ) {  \n        x=”yellow\";  \n        y=”purple\"\
    ;\n    } // overloading\n}\n```\n\n### Example 6.5 (overriding)\n```java\nclass\
    \ super_class{\n    int test( int num ) { return num; } // overriding\n}\nclass\
    \ sub_class extends super_class{\n    int test( int num ) { return 100 + num;\
    \ } // overriding\n}\n```\n**Explanation:** Example 1 is overloading. Example\
    \ 2 is overriding.\n\n### Static variable\n`static variable` is known as a class\
    \ variable, it can be referenced by the class or object.\n- `Non static variable`\
    \ cannot be referenced by class.\n- `Non static variable` can be referenced by\
    \ object only.\n\n### Example 6.6\n```java\nclass MyClass {\n    static int count=100;\
    \ // declare a static variable\n    public static void main (String args[ ]){\n\
    \        System. out. print( MyClass.count );\n        /* MyClass references a\
    \ static variable “count” directly */\n    }\n}\n```\n**Output:** 100\n**Explanation:**\
    \ `static int count=100` defines a static variable. `MyClass. count` means a class\
    \ `MyClass` references a static variable `count` directly. Note that an object\
    \ can also reference static variable.\n\n### Static Method\n`static method` is\
    \ known as a class method, it can be called by the class or object.\n- `Non static\
    \ method` cannot be referenced by class.\n- `Non static method` can be referenced\
    \ by object only.\n\n### Example 6.7\n```java\nclass MyClass {\n    static int\
    \ count( ) { return 100 ;} // declare a static method\n    public static void\
    \ main (String args[ ]){\n        System. out. print( MyClass.count( ) );\n  \
    \      /* MyClass calls a static method “count()” directly */\n    }\n}\n```\n\
    **Output:** 100\n**Explanation:** `static int count( ) { return 100 }` defines\
    \ a static method. `MyClass. count( )` means a class `MyClass` calls a static\
    \ method `count()` directly. Note that an object can also call static method.\n\
    \n### final Variable\n`final` is a keyword.\n`final+ variable` means that variable\
    \ value cannot be modified.\n\n### Example 6.8\n```java\nclass MyClass{\n    final\
    \ int x =100; // declare a final variable\n    static void test( )){ x = 200 ;}\
    \ // error ! for “x” is a final variable\n    public static void main (String\
    \ args[ ]){\n        System. out. print( MyClass. test( ) );\n    }\n}\n```\n\
    **Explanation:** `final int x =100` defines a final variable `x`, its value is\
    \ 100 and cannot be changed. `static void test( ) { x = 200;}` tries to modify\
    \ the value of `x`, but an error occurs.\n\n### final Method( )\n`final` is a\
    \ keyword.\n`final method( )` means that method cannot be overridden.\n\n### Example\
    \ 6.9\n```java\nclass animal{\n    final void test ( ){ // declare a final method\n\
    \        System. out. print(“animal”);\n    }\n}\nclass dog extends animal {\n\
    \    void test ( ){ // error ! Because test() want to override…\n        System.\
    \ out. print(“dog”);\n    }\n}\n```\n**Explanation:** `final void test( ){…}`\
    \ defines a final method. `void test ( ){…}` tries to override `final void test(\
    \ ){…}`, but error occurs.\n\n### final class\n`final` is a keyword.\n`final class`\
    \ means that class cannot be extended.\n\n### Example 6.10\n```java\nfinal class\
    \ animal { \n    // declare a final class\n    // define some variables;\n   \
    \ // define some method;\n}\nclass elephant extends animal { \n    // error !\
    \ cannot extends\n}\n```\n**Explanation:** `final class animal` defines a final\
    \ class. `class elephant extends animal` cannot extend the final class.\n\n###\
    \ Polymorphism\nPolymorphism describes the ability to perform different method\
    \ for different objects.\n\n### Example 6.11\n```java\nclass Animal{\n    cry(\
    \ ){ // parent class\n        System. out. print(\"crying...... \");\n    }\n\
    }\nclass Dog extends Animal{ // sub class\n    cry( ){ // overriding\n       \
    \ System. out. print(\"Wow, Wow...... \");\n    }\n}\nclass Cat extends Animal{\
    \ // sub class\n    cry( ){ // overriding\n        System. out. print(\"Meow,\
    \ Meow...... \");\n    }\n}\nclass PolymorphismDemo{\n    public static void main(String\
    \ args[ ]){\n        Animal animalVar;\n        animalVar = new Dog( ); // create\
    \ a dog object\n        animalVar. cry( ); // dog object calls cry()\n       \
    \ animalVar = new Cat( ); // create a cat object\n        animalVar. cry( ); //\
    \ cat object calls cry()\n    }\n}\n```\n**Output:**\nWow, Wow......\nMeow, Meow......\n\
    **Explanation:** `animalVar = new dog( )` creates a dog object, therefore, `animalVar.\
    \ cry( )` calls a method `cry()` in sub class `Dog`. `animalVar = new cat( )`\
    \ creates a cat object, therefore, `animalVar. cry( )` calls a method `cry()`\
    \ in sub class `Cat`.\n\n### Package & Import\n`package package-name;`\n`import\
    \ package. class;`\n\n`package package-name` creates or use a package. `import\
    \ package. class` imports a package or its class.\n\n### Example 6.12 (in file1)\n\
    ```java\npackage myPackage;\n/* create a package including two classes */\nclass\
    \ MyClass1 {…}\nclass MyClass2 {…}\n```\n\n### Example 6.13 (in file2)\n```java\n\
    package myPackage;\n// use package “myPackage”\nimport myPackage. *; // import\
    \ all classes of myPackage\n```\n**Explanation:** `package myPackage` creates\
    \ a package named `myPackage`, which contains two classes. `MyClass1` and `MyClass2`\
    \ in file1. `import myPackage. * ` imports any classes inside the package `myPackage`\
    \ from file1 to file2. Note that `package` command must be in above of the `import`\
    \ command.\n\n### Build a Package, Import a Class\n\n| command | description |\n\
    | :--- | :--- |\n| `package myPackage;` | build a package |\n| `import anyClass;`\
    \ | import a class |\n"
