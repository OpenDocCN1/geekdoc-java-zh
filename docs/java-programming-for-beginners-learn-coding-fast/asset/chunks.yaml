    # 第一章 开始 JAVA


    ## 安装 Java


    为了创建任何 Java 程序，需要在本地计算机系统上可用 Java 开发环境。


    `JDK`（也称为 `JSDK`, `Java SE`）`JDK` (`Java Development Kit`) 包含了所有的 Java 类库以及所有构建和运行
    Java 程序的工具。`JDK` 可以创建 Java 开发环境。


    下载 `JDK`：`http://oracle.com/download/com/download/http://www.oracle.com/technetwork/java/javase/downloads/index`


    请点击链接在 Oracle 网站下载最新版本的 `JDK`。（图 1）


    如果你的计算机是 32 位操作系统，请下载 `x86` 版本的 `JDK`；如果你的计算机是 64 位操作系统，请下载 `x64` 版本的 `JDK`。（图
    2）


    将最新版本的 `JDK` 安装到你的计算机上。恭喜你！一旦成功安装 `JDK`，系统就准备好运行 Java 程序了！


    ## IDE (集成开发环境)


    `IDE` (`Integrated Development Environment`) 用于编写、编辑和运行 Java。`IDE` 包含许多 Java 开发工具、编译器和调试器。互联网上有许多优秀的免费
    IDE 可以下载，请通过以下链接下载一个 IDE：


    | IDE(编辑器) | 网站地址 |

    | :--- | :--- |

    | Eclipse | `http://www.eclipse.org` |

    | NetBeans | `https://netbeans.org/` |

    | DrJava | `http://www.drjava.org/` |


