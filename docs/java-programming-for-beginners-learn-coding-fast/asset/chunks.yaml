    obj. c2=”purple”;     // 一个对象引用一个变量\nobj. brightness ( );  // 一个对象引用一个方法\n```\n\
    解释：`Color obj = new Color;` 创建了一个名为 `obj` 的对象，然后引用变量 `c1` 和 `c2`。`obj. brightness\
    \ ( );` 调用了函数 `brightness ( );`（在上一页），并返回 `blue`。\n\n### 类与对象\n示例：\n```java\n\
