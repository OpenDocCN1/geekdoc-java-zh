  md: '# Summary


    +   - Every time you open a new piece of logic (e.g., entering a new method that
    defines its logic), you open a new investigation plan.


    +   - Unlike a text paragraph, reading code is not linear. Each instruction might
    create a new plan you need to investigate. The more complex the logic you explore,
    the more plans you need to open. The more plans you open, the more complex the
    process becomes. One trick to speed up a code investigation is to open as few
    plans as possible.


    +   - A debugger is a tool that allows you to pause the app''s execution on a
    specific line so that you can observe the app''s execution, step by step, and
    the way it manages data. Using a debugger can help you to reduce some of the cognitive
    load of reading code.


    +   - You can use breakpoints to mark the specific lines of code where you want
    the debugger to pause an app''s execution so you can evaluate the values of all
    the variables in the scope.


    +   - You can step over a line, which means continuing to the next execution line
    in the same plan, or step into a line, which means going into detail the instruction
    on which the debugger paused the execution. You should minimize the number of
    times you step into a line and rely more on stepping over. Every time you step
    into a line, the investigation path gets longer and the process more consuming.


    +   - Even though using the mouse and the IDE''s GUI to navigate the code that
    is initially more comfortable, learning to use the keyboard shortcuts for these
    operations will help you debug faster. I recommend you learn the keyboard shortcuts
    of your favorite IDE and use them instead of triggering the navigation with the
    mouse.


    +   - After stepping into a line, first read the code and try to understand it.
    If you figure out what happens, use the step out operation to return to the previous
    investigation plan. If you don''t understand what happens, identify the unclear
    instruction, add a breakpoint, and start debugging from there.'
