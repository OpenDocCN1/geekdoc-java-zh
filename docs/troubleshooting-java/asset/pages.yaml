  md: '# 10.2 Reading thread dumps 211


    thread-related problem, so you want to generate a thread dump. If you can read
    the thread dump as text, you need nothing than the console itself.


    Let''s look at 10.3, which shows one of the threads in the thread dump. It is
    nothing more than similarly displayed details for each thread in the app when
    the dump was taken. Here are the details you get for a thread:


    +   - Thread name

    - Thread ID

    - Native ID

    - Priority of the thread at the operating system level

    - Total and CPU time the thread consumed

    - State description

    - State name

    - Stack trace

    - Who''s blocking the thread

    - What locks the thread acquires


    The first thing displayed is the *thread name*—in our case, "Producer". The thread
    name is essential since it''s one of the ways to identify the thread in the thread
    dump later if you need it. The JVM also associates the thread with a *thread ID*
    (in listing 10.3, tid=0x000002f96487690). Since the developer gives it a name,
    there''s a small change some which will get the same name. If this unlucky situation
    happens, you can still identify it in the dump by its ID (which is always unique).


    In a JVM app, a thread is a wrapper over a system thread, which means you can
    always identify the operating system (OS) thread running behind the scenes. If
    you need to do that, look for the *native thread ID* (in listing 10.3, nid=0xcac).


    Once you have identified a thread, you identify the details you are interested
    in. The first three pieces of information you get in a thread dump are the thread''s
    *priority*, the *CPU execution time*, and the *total execution time*. Every OS
    associates a priority to each of its running threads. I don''t often use this
    value in a thread dump. But if you see that a thread isn''t as active as you think
    it should be, and you see that the OS designates it as a lower priority, this
    may be the case. In this situation, the execution time is much higher than the
    CPU execution time. Remember from chapter 7 that the total execution time is how
    long the thread was alive, while the CPU execution time is how well it worked
    out.


    *State description* is a valuable detail. It tells you in plain English what happens
    to the thread. In our case, the thread is "waiting for monitor entry," meaning
    it is blocked at the entrance to a synchronized block. The thread could have been
    "timed waiting on a monitor," which would mean it''s sleeping for a defined time
    or running. A *State name* (Running, Waiting, Blocked, etc.) is associated with
    the state description. Appendix D offers a good refresher on thread life cycle
    and thread states in the case you need it.


    The thread dump provides a *stack trace* for every thread, which shows exactly
    what part of the code the thread was executing when the dump was taken. The stack
    trace is'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# CHAPTER 10 Investigating deadlocks with thread dumps


    valuable it shows you exactly what the thread was working on. You can use the
    stack trace to find a specific piece of code you want to further debug, or, in
    case of a slow trace, to determine which thread delays or blocks the thread.


    Finally, for threads that acquire or are locked, we can find which locks acquire
    and which they are waiting for. You''ll use these details every time you investigate
    a deadlock. They also give you optimization hints. For example, if you see that
    a thread acquires many locks, you may wonder why and how you can change its behavior
    so that it doesn''t block many other executors.


    # List 10.3 The anatomy of a thread''s details in a thread dump


    | Thread name and details about resource consumption and execution time | Thread
    ID and state description |

    |---|---|n| _Producer 16 prio=5 os_prio=0 cpu=46.8ms elapsed=73.9s | Thread state
    |

    | tid=00000002f9648769 nid=0xcac waiting for monitor entry [0x00000002ec6ff00]
    java.lang.Thread: BLOCKED (on object) | Lock ID that blocks the current thread
    and type of the monitor object |

    | at main.Producer.run(Unknown Source) | waiting waiting to lock <0x000000052e0313f8>
    (a java.util.ArrayList) |

    | locked <0x000000052e03a938> (a java.util.ArrayList) |


    An important thing to remember about thread dumps is that they give you just as
    many details as a normal lock profiling (discussed in chapter 9). Lock profiling
    offers an advantage over a thread dump: it shows the dynamics of the execution.
    Just like the difference between a picture and a movie, the thread dump is just
    a snapshot at a given time (here, during the execution), while profiling shows
    you how parameters change the execution. But in many situations, a picture is
    enough and much easier to obtain.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_228_0.png)


    The only thing you need to know is what code executes at a given time, a thread
    dump is sufficient. You have learned to use sampling for this purpose, but it''s
    good to know a thread dump can do this too. Say you don''t have access to memory
    to remotely profile an app, but you need to find out what code executes behind
    the scenes. You can get a thread dump.'
