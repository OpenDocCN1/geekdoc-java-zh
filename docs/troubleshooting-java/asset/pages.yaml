  md: '# 10.1.2 Generating a thread dump from the command line


    A thread dump can also be obtained using the command line. This approach is particularly
    useful when you need to get a thread dump from a remote environment. Most of the
    time, you won''t be able to remote profile an app installed in an environment
    (and remember, profiling and remote debugging aren''t recommended in a production
    environment, as discussed in chapter 4). Since in cases you can only access a
    remote environment using the command line, you need to know how to get a thread
    dump this too.


    Fortunately, getting a thread dump using the command line is quite easy (figure
    10.4):


    +   1 Get the process ID for which you want a thread dump.

    2 Get the thread dump as text data (raw data) and save it in a file.

    3 Load the saved thread dump to make it easier to read in a profiler.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_223_0.png)


    Figure 10.4 Follow three simple steps to get a thread dump using the command line.
    First, find the process ID for which you want the thread dump. Second, use a JDK
    tool to get the thread dump. Finally, open the thread dump in a profiler to read
    it.


    # STEP 1: FIND THE PROCESS ID FOR THE PROCESS UNDER INVESTIGATION


    Thus far, we have identified the process we want to profile using its name (represented
    as the main class name). But when getting a thread dump using the command line,
    you need to identify the process using its ID. How do you get a process ID (PID)
    for a running Java app? The simplest way is using the jps tool provided with the
    JDK. The next snippet shows the command you need to run. We use the -1 (lowercase
    "L.") option to get the main class names alongside the PIDs. This way, we can
    identify the processes the same way we we did in chapters 6 to 9 where we learned
    to profile an app''s execution:


    ```

    jps -1

    ```'
