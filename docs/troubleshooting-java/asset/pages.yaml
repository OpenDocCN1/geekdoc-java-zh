  md: '# 6.2 Using a profiler


    Note how the used memory grows continuously. The GC attempts to free the memory,
    but it can''t remove most of the instances because the app still keeps references
    in memory.


    When all the allocated memory is occupied, the app can''t store the new data,
    and the app throws an OutMemoryError.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_141_0.png)


    In many cases, you will also see intensified GC.


    **6.11** When a memory leak affects your app, the used memory grows continuously.
    The used memory increases until the app can''t allocate any new data. At this
    point, the app throws an OutMemoryError and stops. In many cases, a memory leak
    also intensifies activity, which can be seen in the CPU resource usage widget.


    6.12 compares normal behavior and the behavior of an app affected by a memory
    leak, as seen in VisualVM. For the app with a normal execution (not affected by
    a memory leak), the graph has peaks and valleys. The app allocates memory that
    fills up (the peaks), and from time to time, the GC removes the data''s no longer
    needed (the valleys). This ebb and flow is usually a good sign that the capability
    you are investigating is not affected by a memory leak.


    However, if you see the memory progressively grows and the GC doesn''t clean it,
    your app may have a memory leak. Once you suspect a memory leak, you need to investigate
    further using a heap dump.


    You can control the allocated heap size in a Java app. By this way, you can enhance
    the limit of the JVM memory to your app. However, giving the more memory is not
    a solution for a memory leak. But this approach can be a temporary solution to
