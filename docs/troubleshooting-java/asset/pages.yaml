  md: '# # Finding memory-related issues in an app’s execution


    # ## This chapter covers


    +   - Sampling an execution to find memory allocation issues

    - Profiling a part of the code to identify the root causes of memory allocation
    problems

    - Obtaining and reading heap dumps


    Every app processes data, and to do this, the app needs to store that data some-while
    working with it. The app allocates part of the system’s memory to work with the
    data, but the memory isn’t an infinite resource. All the apps running on a system
    share a finite amount of memory space that the system provides. If an app doesn’t
    wisely manage its allocated memory, it can run out of it, making it impossible
    to continue its work. Even if the app doesn’t run out of memory, using too much
    can make the app slower, so faulty memory allocation can cause performance issues.'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'An app can run slower if it doesn''t optimize its allocation of data in the
    memory. If the app requires more memory than the system provides, the app will
    stop working and throw an error. Thus, side effects of poor memory management
    are slowness in execution and even total app crashes. It''s essential we write
    app capabilities that make the best use of their allocated memory.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_238_0.png)


    An app should be as efficient as possible in managing its resources. When we discuss
    the resources of an app, we mainly think about CPU (processing power) and memory.
    In chapters 7 to 10, we discussed how to investigate issues with CPU consumption.
    In this chapter, we''ll focus on identifying problems with how an app allocates
    data in memory.


    We''ll start the chapter by discussing execution sampling and profiling for memory
    usage statistics in 11.1. You''ll learn how to identify if an app has issues with
    memory usage and how to find which part of the application causes them.


    In 11.2, we''ll discuss how to get a complete dump (i.e., heap dump) of the allocated
    memory to analyze its contents. In certain cases, when the app crashes because
    of faulty memory management, you cannot profile the execution. But getting and
    analyzing the contents of the app''s allocated memory at the moment the problem
    appears can help you to identify the problem''s root cause.


    You need to remember a few basic concepts about the way in which a Java app allocates
    memory before continuing with this chapter. appendix E provides all the information
    you need to properly understand the ideas in this chapter.


    # 11.1 Sampling and profiling for memory issues


    In this section, we use a small application that simulates a faulty implemented
    capability that uses too much of the allocated memory. We use this app to discuss
    techniques you can use to identify issues with memory allocation or places in
    code that can be optimized to use the system''s memory more efficiently.


    Suppose you have a real application, and you notice that some feature runs slowly.
    You use the techniques we discussed in chapter 6 to analyze resource consumption
    and find that although the app doesn''t “work” very often (consume CPU resources),
    it uses a large amount of memory. When an app uses too much memory, the JVM will
    trigger the garbage collector (GC), which will further consume CPU resources also.'
