    Even if most examples in this book use IntelliJ IDEA, that doesn''t mean this
    IDE is better than others. I''ve used many IDEs with Java, such as Eclipse, Netbeans,
    and JDeveloper. My recommendation is that you shouldn''t become too comfortable
    with'
