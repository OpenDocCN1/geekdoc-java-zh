    with how the app processes data

    - Using logging to identify problems in an app’s behavior or to identify security
    breaches

    - Using remote debugging to identify problems you cannot reproduce in a different
    environment

    - Correctly choosing what investigation techniques to use to make your investigation
    faster


    # Summary


    +   - You can use various investigation techniques to analyze software behavior.

    - Depending on your situation, one investigation technique may work better than
    another. You need to know how to choose the correct approach to make your investigation
    more efficient.

    - For some scenarios, using a combination of techniques helps you to identify
    a problem faster. Learning how each analyzing technique works gives you an excellent
    advantage in dealing with complex problems.

    - In many cases, developers use investigation techniques to learn new things rather
    than solve problems. When learning complex frameworks such as Spring Security
    or Hibernate, simply reading books or the documentation isn’t enough. An excellent
    way to accelerate your learning is debug examples that use a technology you want
    to better understand.

    - A situation is easier to investigate if you can reproduce it in an environment
    where you can study it. Reproducing a problem not only helps you find its root
    cause more easily, but it also helps you to confirm that a solution works when
    it is applied.'
