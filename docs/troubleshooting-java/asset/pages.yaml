  md: '# 4.2.1 The scenario


    Suppose you work on a team that implements and maintains a large application many
    clients to manage their product inventory. Recent, your team implemented a new
    capability that helps clients easily manage their costs. The team successfully
    tested the behavior in the dev environment and installed the app in the UAT environment
    to allow users to validate the feature before moving it to production. However,
    the person responsible for testing the new capability informs you that the web
    interface where the new data should be showing nothing.


    Concerned, you take a look and quickly see that the problem is not the frontend.
    But an endpoint on the backend seems to behave weirdly. When the endpoint is called
    in the UAT environment, the HTTP response status code is 200 OK, but the app doesn''t
    return the data in the HTTP response (figure 4.4). You check the logs, but nothing
    shows. Since you cannot observe the problem locally or in the dev environment,
    you decide to remotely connect your debugger in the UAT environment to find the
    cause of this issue.


    > NOTE Even if you debug this app running in a remote environment, to make the
    example simpler, we use the local system to run the app, to which we connect remotely.
    For this reason, you will see in the figures that I use "localhost" to access
    the environment running up. In a real-world scenario, the app would run on a different
    system, which would be identified with an IP address or DNS name.


    By calling the HTTP GET endpoint, the app exposes the local state at port 8080.

