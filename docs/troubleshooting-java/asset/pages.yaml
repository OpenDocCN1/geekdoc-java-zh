    The way a developer chooses to write the code may also add additional complexity.
    For example, starting with Java 10, developers can infer the type of a local variable
    using var. Inferring the variable type is not always a wise choice because it
    can make the code even more difficult to read (figure 2.5), bringing one more
    scenario in using the debugger would be useful.


    > TIP When investigating code with a debugger, start from the first line of code
    that you can''t figure out.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_42_0.png)


    While training junior developers and students over the past many years, I have
    observed that in many cases they start debugging on the first line of a specific
    code block. While you can certainly do this, it''s more efficient if you first
    read the code without the debugger and try to figure out whether you can understand
    the code. Then, start debugging directly from the point that causes difficulties.
    This approach will save you time since you might find out you don''t need the
    debugger to understand what happens in a specific piece of logic. After all, even
    if you use the debugger, you only need to go over the code you don''t understand.


    In scenarios, you add a breakpoint on a line because its intent is not obvious.
    Sometimes your app throws an exception; you see that in the logs, but you don''t
    know which previous line is causing the problem. In this case, you can add a breakpoint
    to pause the app''s execution just before the exception. The idea stays the same:
    avoid pausing the execution of the instructions you understand. Instead, use breakpoints
