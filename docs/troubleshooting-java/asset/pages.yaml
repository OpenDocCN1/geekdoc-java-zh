  md: '# When analyzing code is not enough


    # When analyzing code is not enough


    Let''s start by discussing how to read code and why sometimes reading the logic
    isn''t enough to understand it. In this section, I''ll explain how reading code
    works and how it is different from reading something else, like a story or a poem.
    To observe this difference and understand what causes the complexity in deciphering
    code, we''ll use a code snippet that implements a sort of logic. Understanding
    what''s behind the way our brain interprets code helps you realize the need for
    tools such as a debugger


    Any code investigation scene starts with reading the code. But reading code is
    different from reading poetry. When reading a verse, you move through text line
    by line in a linear order, letting your brain assemble and picture the meaning.
    If you read the same twice, you might understand different things.


    With code, however, it''s the opposite. Code is not linear. When reading code,
    you don''t go by line. Instead, you jump in and out of instructions to understand
    how the data is being processed. Reading code is more like a maze than a straight
    road. And, if you''re not attentive, you might get lost and forget where you started.
    Second, unlike a poem, the code always and for everyone means the same thing.
    Meaning is the objective of your investigation.


    Just like you''d use a compass to find your path, a debugger helps you more easily
    identify what your code does. As an example, we''ll use the `decode(List<Integer>input)`
    method. You can find this code in project-ch2-ex1 provided with the book.


    +   Listing 2.1 An example of a method to debug


    ```

    public class Decoder {

    public Integer decode(List<String> input) {

    int total = 0;

    for (String s : input) {

    var digits = new StringDigitExtractor(s).extractDigits();

    total += digits.stream().collect(Collectors.summingInt(i -> i));

    }

    return total;

    }

    ```


    If you read from the top line to the bottom line, you have to assume how things
    work to understand. Are those instructions really doing what you think they''re
    doing? When you are not sure, you have to dive deeper and observe what the code
    actually does—you have to analyze the logic behind it. Figure 2.1 points out the
    uncertainties in the given code snippet:


    +   * What does the StringDigitExtractor() constructor do? It might just create
    an object, or it might also do something else. It could be that it somehow changes
    the value of the given parameter.'
