  md: '# 10.2 Reading thread dumps 213


    Let''s now focus on how you can find the relationship between threads with a thread
    dump. How can we analyze the way in which threads interact with one another? We
    are particularly interested in threads locking each other. In 10.4.I added the
    details from the thread dump for the two threads that we are in a deadlock. But
    the question is, “How would we find they are in a deadlock if we didn''t know
    this detail up front?


    If you suspect a deadlock, you should focus your investigation on the locks the
    threads cause (10.8):


    +   1. Filter all threads that are not blocked so that you can focus on the threads
    that can cause the deadlock.

    2. Start with the first candidate thread (a thread you didn''t filter in step
    1) and search the lock ID that causes it to be blocked.

    3. Find the thread causing that lock, and check what blocks that thread. If at
    some point you return to the thread you started with, all the threads parsed in
    are a deadlock.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_229_0.png)


    Figure 10.8 To find a deadlock with a thread dump, follow these three easy steps.
    First, remove all threads that are not blocked. Then, start with one of the blocked
    threads and find what is blocking it using the lock ID. Continue this process
    for each thread. If you return to a thread you investigated, it means you found
    a deadlock.'
