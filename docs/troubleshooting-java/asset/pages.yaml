    But since the app uses two threads that use a common resource (the list), if we
    consider the fact that they can''t work at the same time with the shared resource,
    then we expect the following:


    +   - The total execution time should be the sum of the CPU execution times (because
    the threads can''t work at the same time, they will mutually exclude each other),
    approximately.

    - The threads will have a similar number of times allocated for execution and
    should be locked approximately. If one of them is preferred, the other can end
    up in *starvation*; the situation in which a thread is blocked in an "unfair"
    way and then not to execute.


    If you look again at thread analysis, you can see that the two threads are fairly
    treated. They indeed got a similar number of times, and they mutually exclude
    each other but have a similar active (CPU time) execution. This is optimal, and
    there''s not much we can do to enhance it. Remember that it depends on what the
    app does and our expectations about how should execute.


    Here''s an example of a different scenario where the app would not necessarily
    be considered optimal. Suppose that you had an app that was actually processing
    values. Say that the producer needed more time to add each value to the list than
