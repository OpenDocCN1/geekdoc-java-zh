  md: '# 1.2 Typical scenarios for using investigation techniques


    When nothing interferes with the app


    Instruction A on thread T1 most likely happens before instruction B on thread
    T2.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_27_0.png)


    When a debugger interferes with the app


    With a breakpoint, you pause the execution before instruction A on thread T1.
    Because of this interference, instruction B on thread T2 executes before A on
    thread T1. The app''s behavior changes, and you can no longer investigate the
    initial scenario.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_27_1.png)


    Figure 1.6 A Heisenberg execution. In a multithreaded app, when a debugger interferes
    with the app''s execution, it might change how the app behaves. This change doesn''t
    allow you to correctly investigate the initial app behavior that you wanted to
    research.


    For multithreaded functionality, in my opinion, the most difficult to test is
    scenarios that have a large variety of cases. Sometimes a profiler is a good option,
    even if the profiler interfere with the app''s execution, so that may not work
    either. Another alternative is to use logging (which we discuss in chapter 5)
    in the app. For certain issues, you can find ways to reduce the number of threads
    to one so that you can use a debugger for the investigation.


