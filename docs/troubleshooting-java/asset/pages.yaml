  md: '# CHAPTER 6 Identifying resource consumption problems using profiling techniques


    The first look at the code scared me a bit: the app lacked a class design, and
    there was a combination of Java and Scala with some Java reflection-driven code.


    How do you figure out code you need to investigate in such a case? Fortunately,
    a profiler is capable of sampling the executing code. The tool intercepts the
    methods and displays what executes, giving you just enough to start an investigation.
    Once you find the code in execution, you can run it and, eventually, use a debugger,
    as discussed in chapters 2 to 4.


    With a profiler, you can find code executes behind the scenes without first looking
    into the code. This capability is called sampling, and it is particularly useful
    when the code is so muddy that you can''t understand what is being called.


    # 6.1.3 Identifying slowness in an app''s execution


    In some cases, you have to deal with performance problems. The general question
    you want to answer for such cases is, “What is taking so to execute?” Empirically,
    developers always first suspect the parts of the code related to I/O communication.
    Calling a web service, connecting to a database, or storing data in a file are
    examples of I/O actions that often cause latencies in apps. Still, an I/O call
    isn''t always the cause of a slowdown. And even then, unless you know the codebase
    by heart (which rarely happens), it is still difficult to spot where the problem
    comes from.


    Fortunately, the profiler is quite “magical” and has ability to intercept code
    in execution and calculate the resources each piece of code consumes. We’ll discuss
    these abilities in chapter 7.


    # 6.2 Using a profiler


    In this section, we examine how to use a profiler to solve problems such as those
    discussed in section 6.1. We begin (in section 6.2.1) with installing and configuring
    VisualVM. We’ll then use a profiler’s investigative capabilities. I will use an
    app to demonstrate each case; the app is small enough to allow you to focus on
    the presented subject but complex enough to reveal our discussion.


    In section 6.2.2, we will discuss resource consumption and how to identify whether
    your app has any issues related to overconsumption. In section 6.2.3, you’ll learn
    what kind of memory issues an app may encounter and how to spot them.


    # 6.2.1 Installing and configuring VisualVM


    In this section, you will learn how to install and configure VisualVM. Before
    you use a profiler, you need to make sure you correctly install and configure
    this, or a similar, tool. Then, you can use the examples provided with the book
    to try out of the capabilities we discuss in this chapter. If you work on a real-world
    project, I recommend the techniques with the app you are implementing.'
  merge: -1
