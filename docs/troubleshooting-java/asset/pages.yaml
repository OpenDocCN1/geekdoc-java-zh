  md: '# E.2 The stack used by threads to store local data


    Because the beginning of any new block of code execution creates a new layer in
    the stack, any uncontrolled recursion can cause a stack overflow: the stack fills
    and the pant cannot allocate more layers to the local values. In this example,
    method a() calls method b() and method b() calls method a(), without any condition
    for this to stop at some point.


    # Stack


    | public static void main(String[] args) { } | a() | |

    | public static void a() { System.out.println("A executes"); } | b() | |

    | public static void b() { System.out.println("B executes"); } | main() |


    A stack overflow is a memory issue with the app cannot allocate more layers in
    the stack.


    E.9 Every execution of a method creates a new layer in the stack if it''s called
    too many times. In case of a recursion, a method may fill the stack if it''s called
    too many times. When the stack throws a StackOverflowError, the app throws a,
    and the current thread stops.


    Exception in thread "main" java.lang.StackOverflowError


    +   - at main.Main.a.Main.java:11

    - at main.Main.b.Main.java:16

    - at main.Main.a.Main.java:11

    - at main.Main.b.Main.java:16

    - at main.Main.a.Main.java:11

    - at main.Main.b.Main.java:16

    - at main.Main.a.Main.java:11

    - at main.Main.b.Main.java:16

    - at main.Main.a.Main.java:11


    > Whenever you get an exception stack like this looks like a dog chasing its tail,
    you are most likely facing recursion with a wrong condition.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_317_0.png)


    E.10 The stack trace caused by a StackOverflowError. Usually, a StackOverflowError
    is easy to identify. The stack trace shows a method calling itself repeatedly
    or a group of methods that call each other, as in this example. You can go directly
    to these methods to figure out how they started infinitely calling each other.'
