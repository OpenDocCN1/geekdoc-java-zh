  md: '# CHAPTER 1 Revealing an app''s obscurities


    In experience, the most frequent performance issues that occur in apps are related
    to how quickly an app responds. However, even if most developers consider slowness
    and performance quality, that''s not the case. Slowness problems (situations in
    which an app responds slowly to a given trigger) are just one of performance issue.


    For example, I once had to debug a mobile app that was consuming the device''s
    battery too quickly. I had an Android app using a library that connected to an
    external device via Bluetooth. For some reason, the library was creating lots
    of threads without closing them. These threads, which remain open and without
    purpose, are called zombie threads and typically cause performance and memory
    issues. They are also challenging to identify.


    However, this type of issue when the battery is consuming too fast is an app issue
    using too much bandwidth while transferring data over the network is another good
    example of a performance issue.


    Let''s discuss slowness problems, which are the most encountered. Many developers
    fear slowness. Usually, that''s not because those problems are difficult to identify,
    but because they can be challenging to solve. Finding the cause of a performance
    problem is usually an easy job with a profiler, as you''ll learn in chapters 6
    through 9. In addition to identifying code executes, as discussed in section 1.2.1,
    a profiler also displays the time the app spends on each instruction (1.9).


    > A profiler shows you the execution time for each instruction, which allows you
    to identify where a slowness problem comes.


    | | Total Time |

    |---|---|n| JPS event loop | |

    | java.lang.Thread.run | 15812 ms (100%) |

    | io.netty.util.internal.ThreadExecutorMap2 run | 15812 ms (100%) |

    | io.netty.util.concurrent.SingleThreadExecutor$run | 15812 ms (100%) |

    | io.netty.channel.nio.NioEventLoop | 15812 ms (100%) |

    | io.netty.channel.nio.NioEventLoop.select | 15812 ms (100%) |

    | sun.nio.ch.Selector.select | 0.0 ms (0%) |

    | Self time | 0.0 ms (0%) |

    | Self time | 0.0 ms (0%) |

    | Self time | 0.0 ms (0%) |


    Figure 1.9 Investigating slowness problems with a profiler. The profiler shows
    you the time spent on each instruction during code execution. This profiler feature
    is excellent for identifying the root causes of performance problems.'
