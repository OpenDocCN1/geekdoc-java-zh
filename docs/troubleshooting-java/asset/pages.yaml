  md: '# Understanding the app''s code design using call graphs


    In this section, we discuss one of my favorite techniques to understand an app''s
    class design: visualizing the execution as a call graph. This technique is especially
    helpful when dealing with messy code, an eventuality of working with a new app.


    Thus, we''ve used stack traces to understand execution. Execution stack traces
    are valuable tools, and we''ve already seen how many things we can do with them.
    They are helpful because of their straightforward way of representing as text,
    but from a visual point of view, they''re not great at quickly identifying the
    relationship between objects and method calls. Call graphs are a different way
    to represent the data a profiler collects and focus more on the relations between
    the objects and method calls.


    To demonstrate a call graph, we''ll use example da-ch8ex2 provided with the book
    to demonstrate how to use call graphs to quickly understand which objects and
    methods act behind an execution without analyzing the code. Of course, the idea
    isn''t to avoid the code completely; you''ll still end digging through the code,
    but by using call graphs first, you''ll have a better picture of what happens
    up front.


    We will continue to use JProfiler for our demonstration. Since call graphs are
    a way to represent CPU profiler data, we first need to start CPU profiling. Figure
    8.13 shows how to start CPU profiling, which results in a stack trace (referred
    to as a call tree in JProfiler). We''ll investigate what happens when calling
    the /products endpoint the app exposes.'
