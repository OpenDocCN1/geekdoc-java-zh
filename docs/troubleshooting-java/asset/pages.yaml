    **Figure 5.1** Sailors store events in logs that they can use to determine their
    route or analyze the crew’s response to a given event. The same way, apps store
    log messages so that developers can later analyze a potential issue or discover
    breaches in the app.


    used in the investigation to determine how the unfortunate event could have been
    avoided.


    If you’ve ever watched a chess game, you know that both players write down each
    piece’s movement. Why? These logs help re-create the entire game afterward. They
    study both theirs and their opponent’s moves to spot potential mistakes or vulnerabilities.


    For similar reasons, applications also log messages. We can use those messages
    to understand what happens when an app executes. By reading the log messages,
    we can re-create the execution in the same way that a chess player re-creates
    a whole chess game. We can use logs when we investigate a strange or unwanted
    behavior or more hard-to-see issues as security vulnerabilities.


    I’m sure you already know what logs looks like. You’ve seen logs, at least when
    running your app with an IDE (figure 5,2). All IDEs have a log console. It’s one
    of the first things all software developers learn. But an app doesn’t just log
    messages in the IDE’s console. Real-world apps store logs to allow developers
    to investigate a specific app behavior at a given time.'
