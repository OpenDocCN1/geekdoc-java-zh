  md: '# 6.1 Where would a profiler be useful?


    a mobile device. Slowness wasn''t the biggest problem. Users complained that their
    device''s battery was consumed unnaturally fast when they used this Android-based
    app. This behavior required investigation. After spending some time observing
    the app''s behavior, I discovered that one of the libraries the app used sometimes
    created threads in execution and did nothing but the system''s resources. In a
    mobile app, CPU resource use is often reflected in the battery''s consumption.


    Once you discover the potential problem, you can investigate it further with a
    thread dump, as you''ll learn in chapter 10. Generally, the root cause of such
    problems is a faulty synchronization of the threads.


    I also find memory leaks now and in apps. In most cases, the final result of a
    memory leak is an OutMemoryError that leads to an app crash. So when I hear about
    an app crash, I usually suspect a memory problem.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_125_0.png)


    > TIP Whenever you encounter an random crash, you should consider a memory leak.


    The root cause of abnormal resource use is often an error in coding that allows
    object references to exist even when the objects are no longer needed. Remember
    that although the JVM has an automatic mechanism that releases unneeded data from
    memory (we call this mechanism the garbage collector [GC]), it''s still the developer''s
    responsibility to ensure that all unnecessary data are removed. If we implement
    code that retains references to objects, the GC doesn''t know they are no used
    and won''t remove them. We call this situation a memory leak. In section 6.2.3,
    you''ll learn to use the profiler to identify when a problem exists; then, in
    chapter 11, you''ll learn to trace its root cause using a heap dump.


    # 6.1.2 Finding out what code executes


    As a developer and consultant, I sometimes worked with large, complex, and dirty
    codebase. Several times I have been in a situation where I had to investigate
    a particular app capability; I could reproduce the problem but had no idea which
    part of the code was involved. Some years ago, I investigated a problem with a
    legacy app running some processes. The company''s management made the uninspired
    decision to let just one developer be responsible for the code. No else had any
    idea what was there or how to work with it. When that developer departed, leaving
    behind no documentation or a friendly codebase, I was asked to help identify the
