    allocated to the socket. So, when the communication ends, the app needs to close
    the socket.


    # 12.2 The relevance of integrated log monitoring


    Today, many systems adopt a service-oriented approach and increase the number
    of apps they offer over time. These apps communicate with one another and exchange,
    store, and process data, executing business functions users need. With the increase
    in the number of applications and the applications'' sizes, the systems have become
    more and more difficult to monitor. Notices something goes wrong becomes considerably
    more challenging. To identify the system parts that cause issues, you can use
    the capabilities of a log-monitoring tool figures (12.7).


    > DEFINITION A log-monitoring tool is software you can integrate with apps to
    see exceptions happening throughout the whole system.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_274_0.png)


    The tool observes the executions of all apps and collects data whenever an app
    throws a run-time exception. It displays this information in a user-friendly way
    to help you more quickly identify the problem''s cause.


