  md: '# 3.3 Dynamically altering the investigation scenario


    # 3.3 Dynamically altering the investigation scenario


    In this section, you''ll learn another valuable technique that will make your
    code investigations easier: changing the values of the variables in scope while
    debugging. In some cases, this approach can save a significant amount of time.
    We will begin with discussing the scenarios where changing variables'' on the
    fly is the most effective approach. I will demonstrate how to use this approach
    with an example.


    Earlier in this chapter, we discussed conditional breakpoints. Conditional breakpoints
    allow you to tell the debugger to pause the execution under specific conditions
    (e.g., when a variable has a certain value). Often, we investigate that in a short
    time, and using conditional breakpoints is enough. For cases such as debugging
    a piece of logic called through a REST endpoint (especially if you have the right
    data to reproduce a problem in your environment), you would use a conditional
    breakpoint to pause the execution when appropriate. That''s because you won''t
    know how long to execute something called through an endpoint. But consider the
    following scenarios:


    +   - You investigate an issue that takes a long time to execute. Say it''s a
    scheduled process that takes over an hour to complete its execution.

    - You suspect that some parameter values are causing the wrong output, and you
    want to confirm your suspicion before you decide how to correct the problem.

    - You have a piece of code that executes quickly, but you can''t reproduce the
    issue in your environment. The problem appears only in the production environment
    where you do not have access to security constraints. You believe the issue appears
    when certain parameters have specific values. You want to prove your theory is
    right.


    In scenario 1, breakpoints (conditional or not) aren''t helpful. Unless you investigate
    some logic that happens at the very beginning of the process, running the process
    and waiting for the execution to pause on a line marked with a breakpoint would
    take too much time (figure 3.7).


    ![](img/c89c22ff51802d920b32d2b061ce5aea_67_0.png)


    3.7 Usually, investigating issues in a long-running process, using breakpoints
    is not really an option. It can take a long time for the execution to reach the
    part of code you are investigating, and if you have to rerun the process several
    times, you will definitely spend too much time on it.'
