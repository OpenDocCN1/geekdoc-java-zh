    The profiler shows it took about 5 seconds to understand the execution and find
    which methods caused the latency. In this particular case, we see that just one
    method caused the slowness: `getResponseCode()` of the HttpURLConnection class.


    > Remember it''s not the only method that spends the execution time in real-world
    scenarios. You''ll often find that the time spent is shared among multiple methods
    that execute. The rule is to focus on the method that takes the longest to execute.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_152_0.png)


    An important aspect of this example is that the CPU time (how long the method
    works) is zero. Although the method spends 5 seconds in execution, it doesn''t
    CPU resources because it is waiting for the HTTP call to end and get a response.
    We can conclude that the problem is not in the app; it''s slow only because it
    waits for a response to its HTTP request.


    It''s extremely valuable to differentiate between the total CPU and the total
    execution time. If a method spends CPU time, it means the method “works”. To improve
    the performance in such a case, you usually have to adjust (if possible) the algorithm
    to minimize its complexity. If the execution spends a small amount of CPU time
    but a long execution time, the method is likely waiting for something: an action
    may take a long time, but the app doesn''t doing. In this case, you need to figure
    out what your app is waiting for.


