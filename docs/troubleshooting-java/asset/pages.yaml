  md: '# 6.2 Using a profiler


    In this widget, you can also find the amount of CPU resources the GC uses. The
    GC is the JVM mechanism that deals with removing the data the app no longer needs
    from memory. The CPU usage is valuable information because it can indicate that
    the app has a problem with memory allocation. If the GC spends a lot of CPU resources,
    it can signify that the app has a memory leak.


    In this case, the GC doesn''t spend CPU resources. This is not a good sign either.
    In other words, the app is spending a lot of processing power but isn''t processing
    anything. These signs usually indicate zombie threads, which are generally a consequence
    of concurrency problems.


    The next step is to look at the widget showing memory consumption. This widget
