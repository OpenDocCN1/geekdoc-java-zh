    # 2.2.1 What is execution stack trace, and how do I use it?


    The execution stack trace is a valuable tool you use to understand the code while
    debugging it. Like a map, the execution stack trace shows you the execution''s
    path to the specific line of code where the debugger paused it helps you decide
    where to navigate further.


    Figure 2.8 provides a comparison of execution stack trace and the execution in
    a tree format. The stack trace shows how methods call one another up to the point
    where the debugger paused the execution. In the stack trace, you can find the
    method names, class names, and the lines that caused the calls.


    One of my favorite uses of the execution stack trace is finding hidden logic in
    the execution path. In most cases, developers use the execution stack trace simply
    to understand where a method has been called from. But you also need to consider
    that apps that use frameworks (such as Spring, Hibernate, etc.) sometimes alter
    the execution chain of the method.


    For example, Spring apps often use code that is decoupled in what is called (in
    Java/Jakarta EE terminology, they are named *interceptors*). These aspects implement
    logic that the framework uses to augment the execution of specific methods in
    certain conditions. Unfortunately, such logic is often difficult to observe since
    you'
