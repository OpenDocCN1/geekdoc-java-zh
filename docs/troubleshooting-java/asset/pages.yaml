    # 9.1 Monitoring threads for locks


    In this section, we discuss thread locks and how to analyze them to find eventual
    issues or opportunities to optimize an app''s execution. Thread locks are caused
    by different thread synchronization approaches, usually implemented to control
    the flow of events in a multithreaded architecture. Examples include these:


    +   - A thread wants to prevent other threads from accessing a resource while
    it’s changing resource.

    - A thread needs to wait for another one to finish or reach a certain point in
    its execution before one can continue its work.


    Thread locks are necessary; they help an app control. But implementing thread
    synchronization leaves a lot of mistakes. Wrongly implemented locks may cause
    app freezes or performance issues. We need to use profilers to make our implementations
    are optimal and to make an app more efficient by minimizing the lock time.


    In this section, we''ll use a small application (project-ch9-ex1) that implements
    a simple multithreaded architecture. We''ll use a profiler to analyze the locks
    during the app''s execution. We want to find out how the threads are locked and
    how they behave:


    +   - Which thread locks another

    - How many times a thread is locked

    - The time at which a thread pauses instead of executing


    These details allow us to understand whether the app execution is optimal and
    whether there are ways to improve our app''s execution. The app use for our example
    threads that run concurrently: the producer and the consumer. The producer generates
    random values and adds them to a list instance, and the consumer removes values
    from the same collection used by the producer (figure 9.1).


    ![](img/c89c22ff51802d920b32d2b061ce5aea_195_0.png)


    Let''s follow the app implementation in listings 9.1, 9.2, and 9.3 to see what
    to expect when we investigate the execution. In listing 9.1, you find the Main
    class, which starts the two thread instances. I made the app wait for 10 seconds
    before starting the'
