  md: '# 5.2 Implementing logging


    +   - Warn—An event that is potentially an error, but the application handles
    it. For example, if a connection to a third-party initially fails but the app
    manages to send the call on a second try, the problem should be logged as a warning.


    +   - Info—Common log messages. These messages represent the main execution events
    that you need to understand the app’s behavior in most situations.


    +   - Debug—Fine-grained details that you should enable only when info messages
    are not enough.


    Note that different libraries may use more than, or different names for, these
    four severity levels. For example, in some cases, apps or frameworks may use the
    severity levels fatal (more critical than error) and trace (less critical than
    debug). In this chapter, I focus only on the most encountered severities and terminologies
    in real-world apps.


