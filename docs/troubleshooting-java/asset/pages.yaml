  md: '# about this book


    # Who should read this book


    Since you opened this book, I assume you are a developer using a JVM language.
    You might use Java, but you could also use Kotlin or Scala. Regardless of the
    JVM techniques you can use, you''ll find this book''s content valuable. It teaches
    you relevant investigation techniques you can use to identify the root causes
    of problems (i.e., bugs) and how to easily learn new technologies. As a software
    developer, you may have already noticed how much time you spend understanding
    what an app does. Like other developers, you probably spend more time reading
    code, debugging, or using logs when writing code.

    Why not become more efficient in what you do most during your working day?

    In this book, we''ll discuss, and apply examples to, the following topics:


    +   - Simple and advanced debugging techniques

    - Efficiently using logs to understand app behaviors

    - Profiling CPU and memory resource consumption

    - Profiling to find executing code

    - Profiling to understand how an app works with persisted data

    - Analyzing how apps communicate with one another

    - Monitoring system events


    Regardless of your experience, you will find this book helpful in learning new
    investigation techniques, or if you''re already an experienced developer, you
    will find this is a good refresher.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'The prerequisite for reading this book is understanding the basics of the Java
    language. I intentionally designed all the examples with Java (even if they apply
    to any JVM language) for consistency. If you understand Java at a basic level
    (classes, methods, basics such as decisional or repetitive instructions), you
    should be able to understand the discussions in the book.


    # How this book is organized: a Roadmap


    The book is divided into three parts that cover 12 chapters. We''ll start our
    discussion (in the first part of the book) with debugging techniques. We will
    discuss and apply both simple and more advanced debugging techniques and where
    you can use them for time when investigating various scenarios. I chose to start
    our debugging because this is the first step in investigating how capability of
    an app behaves during its development phase. Some people asked me why I didn''t
    start with logs, since they are the first investigation technique for production
    issues. While this is true, a developer has to deal with a debugger when they
    start implementing features, so I figured a better arrangement of the chapters
    would be with beginning debugging techniques.


    In the first chapter, we discuss the relevance of the investigation techniques
    the book discusses and figure out a plan for learning them. Chapters 2, 3, and
    4 focus on debugging and teach you relevant skills, from adding a simple breakpoint
    to apps in remote environments. Chapter 5, which is the last chapter in part 1,
    discusses logging. Debugging and using logs are the simplest (and most frequently
    used) investigation techniques for building an application.


    The second part of the book discusses profiling techniques. The popular opinion
    is that profiling is more advanced and less used with modern apps than debugging
    and researching logs. While I agree that profiling is more advanced, I demonstrate
    that you can use many profiling techniques to be more efficient when investigating
    issues in modern JVM apps or studying frameworks considered.


    Chapter 6, which begins the second part, discusses whether your app has faults
    in CPU and memory resources. Chapter 7 goes into detail on this topic and shows
    how to get to the part of the app that causes specific latencies and to observe
    what your app executes at a given time. In chapters 6 and 7, we use VisualVM,
    a free tool. Chapter 8 continues the discussion from part 7 with more advanced
    visualization tools that you typically get with a licensed profiling tool. For
    the details discussed in this chapter, we use JProfiler, which is not free to
    use.


    Chapters 9 and 10 focus on more profiling techniques. You will learn skills that
    can save time when dealing with issues deeply hidden in the multithreaded architecture
    behind an app''s execution. Chapter 11 ends part 2 by addressing how to investigate
    an app''s memory management.


    The book ends with part 3, which has just one chapter: chapter 12. In it, we go
    beyond an app''s borders to discuss investigating issues in an extensive system
    composed of multiple apps.'
  merge: -1
