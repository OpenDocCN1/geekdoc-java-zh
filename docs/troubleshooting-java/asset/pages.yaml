  md: "# 7.3 Using a profiler to identify SQL queries an app executes\n\n# Summary\n\
    \n+   - Profiler intercepts the app's execution and provides essential details\
    \ about the code in execution, such as the execution stack trace for each thread,\
    \ how long it takes for each method to execute, and how many times a certain method\
    \ was called.\n\n+   - When investigating latency problems, the first step to\
    \ use a profiler is sampling—a way for the profiler to intercept the code without\
    \ getting many details. Sampling is less resource consuming and allows you to\
    \ observe the big picture of execution.\n\n+   - Sampling you three essentials:\n\
    \    - What code executes—When investigating an issue, sometimes you don't know\
    \ what part of the code executes, and you can find out by sampling.\n    - Total\
    \ execution time of every method—This detail helps you to identify what part of\
    \ the code causes potential latency problems.\n    - Total CPU execution time—This\
    \ detail helps you to identify whether your code spends the execution \"working\"\
    \ or waiting for something.\n\n+   - Sometimes sampling is enough to understand\
    \ where a problem comes from. But in many cases, you need more details. You can\
    \ get these details profiling the execution.\n\n+   - Profiling is a resource-consuming\
    \ process. With a real-world app, it's almost impossible to profile the whole\
    \ codebase. For this reason, when profiling for details, you should filter specific\
    \ packages and classes on which you want to focus on sampling determine what part\
    \ of the app to focus on the execution first.\n\n+   - An essential detail you\
    \ get by profiling is the number of invocations of a method. By sampling, you\
    \ know the total time a method spends executing, but not how often it was called.\
    \ This aspect is important in identifying a method that is slow or wrongly used.\n\
    \n+   - You can use a profiler to get SQL queries the app sends to a DBMS. The\
    \ profiler intercepts any queries, regardless of the technology used to implement\
    \ the app's persistence layer. This is invaluable when investigating slow queries\
    \ for apps that use frameworks (such as Hibernate) to work with a database."
