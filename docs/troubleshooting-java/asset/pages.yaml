  md: '# 304 APPENDIX E Memory management in Java apps


    ![](img/c89c22ff51802d920b32d2b061ce5aea_320_0.png)


    An object may be referred to from a variable in a stack of a thread.


    In such a case, the garbage collector cannot remove the object until the reference
    from the stack is gone.


    Figure E.13 A variable in the stack can also refer to an instance in the heap,
    which cannot be removed until all its references are gone (including the ones
    in the stack).


    # E.4 The metaspace memory location for storing data types


    The metaspace is a memory location the JVM uses to store the data types used to
    create instances stored in the heap (figure E.14). The app needs this information
    to handle the object instances in the heap. Sometimes, in specific conditions,
    an OutOfMemoryError can also affect the metaspace. If the metaspace becomes full
    and there''s no more space for the app to store new data types, the app throws
    an OutOfMemoryError, announcing that the metaspace is full. In my experience,
    these errors are rare, but I would like you to be aware of them.


    +   - The heap may contain several instances of several types of objects.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_320_1.png)


    The metaspace contains information that tells the JVM how to understand and create
    instances that are found in the heap.


    Figure E.14 The metaspace is a memory location where the app stores the data types''
    descriptors. It holds the blueprints to define the instances stored in the heap.'
