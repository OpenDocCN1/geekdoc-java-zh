  md: '# STORING LOGS IN NONRELATIONAL DATABASES


    Relational (NoSQL) databases help you make compromises between performance and
    consistency. You can use a NoSQL database to store logs in a more performant way,
    which gives the database a chance to miss log messages or not store them in the
    exact chronological order of which the app wrote them. But, as discussed earlier
    in this chapter, a log message should always contain the timestamp when the message
    was stored, preferably at the beginning of the message.


    Storing logs in NoSQL databases is common. In most cases, apps use a complete
    engine that stores the logs and has the capability to retrieve, search, and analyze
    the log messages. Today''s two most-used engines are the ELK stack (https://www.elastic.co/what-is-elk-stack)
    and Splunk (https://www.splunk.com/).


    # STORING LOGS IN FILES


    In the past, apps stored logs in files. You may still find other applications
    that write logs directly in files, but this approach is less common today because
    it is generally slower, and searching for logged data is more difficult. I bring
    this to your attention because you''ll find many tutorials and examples in which
    apps store their logs in files, but with more current apps, you should avoid this.


    # STORING LOGS IN A RELATIONAL DATABASE


    We rarely use relational databases to store log messages. A relational database
    mainly guarantees consistency, which ensures when log messages are not lost. Once
    they are, you can retrieve them with a compromise in performance.


    In most cases, losing a log message is not a big deal, and performance is generally
    preferred over consistency. But, as, in real-world apps, there are exceptions.
    For example, governments worldwide impose log message regulations for financial
    apps, especially for payment capabilities. Such capabilities should generally
    have specific log messages that the app is not allowed to lose. Failure to comply
    can result in sanctions and fines.


    # 5.2.2 Defining logging levels and using logging frameworks


    In this section, we discuss logging levels and properly implementing logging in
    an app using logging frameworks. We''ll start by examining why logging levels
    are essential and then implement an example.


    Logging levels, also called *severities*, are a way to classify log messages based
    on their importance to your investigation. An app usually produces a large number
    of log messages while running. However, you don''t need all the details in all
    the log messages. Some of the messages are more important to your investigation
    than others: some represent critical events that always require attention.


    The most common log levels (severities) are as follows:


    +   * Error—A critical issue. The app should always log such events. Usually,
    unhandled exceptions in Java apps are logged as errors.'
