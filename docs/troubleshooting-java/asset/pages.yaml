    \ deadlock where two threads lock each other. The three-step process discussed\
    \ earlier, you will see that the \"_Producer\" thread blocks the \"_Consumer\"\
    \ thread, and vice versa. A complex deadlock happens when than two threads are\
    \ involved. For example, thread A blocks B, thread B blocks C, and thread C blocks\
    \ A. You can discover a long chain of threads that lock each other. The longer\
    \ the chain of threads in the deadlock, the more difficult the deadlock is to\
    \ find, and solve. Figure 10.9 shows the difference between a complex deadlock\
    \ and a simple one."
