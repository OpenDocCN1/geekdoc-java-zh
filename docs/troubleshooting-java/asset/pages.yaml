  md: '# What is remote debugging?


    In this section, we discuss remote debugging is, when to use it, and when to avoid
    it. Remote debugging is nothing more than applying the debugging techniques learned
    in chapters 2 and 3 on an app that doesn''t run locally on your system but instead
    runs in an outside environment. Why would you need to use such techniques in a
    remote environment? To answer this question, let''s review a typical software-development
    process.


    When developers implement an app, they don''t write it for their local systems.
    The final purpose of an app is to deploy it in a production environment where
    it helps users solve various problems. Moreover, when implementing the software,
    we often don''t deploy the app directly in users'' environments, or production
    environments. Instead, we use similar environments to roughly test the capabilities
    and fixes we need to implement before installing them in an environment where
    they are officially used with real data.


    As described in 4.2, a development team uses at least three environments when
    developing an app:


    +   * The development environment (dev)—An environment similar to the app will
    be deployed. Developers mainly use this to test new capabilities and fixes they
    implement after developing them on their local system.

    * The user acceptance test environment (UAT)—Once successfully tested in the development
    environment, the app is installed in the user acceptance test environment. Users
    can test the new implementations and fixes and confirm they work before the app
    is delivered to an environment with real data.

    * The production environment (prod)—After users confirm a new implementation works
    as expected and they feel comfortable using it, the app is installed in the production
    environment.


    But what if an implementation works on your local computer but behaves differently
    in another environment? You might wonder how an app can work differently. Even
    when using the same compiled app, we can observe differences in the app''s behavior
    between two different environments. Some reasons for these differences include:


    +   * The data available in the app''s environments is different. Different environments
    use different database instances, different configuration files, and so on.

    * The operating systems in which the app is installed are not the same.

    * The way the deployment is orchestrated may be different. For example, one environment
    may use virtual machines for the deployment, while another uses a containerized
    solution.

    * Permission setup may be different in each environment.

    * The environments may have different memory or CPU.'
