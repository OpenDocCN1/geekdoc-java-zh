  md: '# CHAPTER 6 Identifying resource consumption problems using profiling techniques


    you''ll learn in this chapter, the profiler intercepts the executing JVM processes
    and offer extremely useful details:


    +   - How the app consumes resources such as the CPU and memory

    - The threads in execution and their current status

    - The code in execution and the resources spent by a given piece of code (e.g.,
    the duration of each method''s execution)


    In section 6.1, we will analyze some scenarios so you can see how the details
    provided by a profiler can be useful and why they are so important. In section
    6.2, we will discuss using a profiler to solve the scenarios in section 6.1. We''ll
    start by installing and configuring a profiler in section 6.2.1. Then, in section
    6.2.2., we''ll analyze how an app consumes resources, and in section 6.2.3, we''ll
    learn to identify when an app has issues with using the memory. We''ll continue
    our discussion about using a profiler in chapter 7, where you''ll learn how to
    identify the code in execution and the performance problems related to it.


    I use VisualVM for the examples in this chapter. VisualVM is a free profiler and
    an excellent tool I''ve successfully used for many years. You can download VisualVM
    here: https://visualvm.github.io/download.html. VisualVM is not the only profiling
    tool for Java apps. Some other well-known profiling tools are Java Mission Control
    (https://mng.bz/AVQE) and JProfiler (https://mng.bz/Zpjl).


    # Where would a profiler be useful?


    In this section, we analyze three scenarios in which a profiler can help you:


    +   - Identifying abnormal usage of resources

    - Finding which part of code executes

    - Identifying slowness in an app''s execution


    # Identifying abnormal usage of resources


    A profiler is commonly used to determine how an app consumes CPU and memory, which
    helps you to understand the app''s specific problems. Thus, it is the first step
    in investigating such issues. Observing how the app consumes resources will usually
    lead you to two categories of issues:


    +   - Thread-related issues—Usually causing issues by a lack of or improper synchronization

    - Memory leaks—Situations in which the app fails to remove unused data from memory,
    causing slowness in execution and potentially a complete failure of the app


    I''ve encountered both types of issues in real-world apps more than I would liked.
    The effects of resource usage issues are very diverse. In some cases, they just
    cause slowness in the app; in other cases, they may cause the app to fail entirely.
    My "favorite" thread-related issue I had to solve using a profiler was causing
    battery problems


    on'
