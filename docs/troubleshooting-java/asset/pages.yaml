    \ a friend working on a separate project calls you for your help and shows you\
    \ a problem. They don't give you many details about how their apps work (in a\
    \ real-world app, it could be a complicated case). Can you help them? We start\
    \ by analyzing the behavior they show us.\n\nWe want to find out what causes the\
    \ problem. You access the logs and immediately see the problem is related to the\
    \ JDBC connections. The exception message, shown in the following snippet, telt\
    \ us that the app can't connect, most likely because the DBMS does not allow other\
    \ connections to be opened. But let's assume we can't know for certain that framework\
    \ or library that your app uses doesn't generate the straightforward exception\
    \ message:\n\n```\njava.sql.TransientConnectionException:\n  HikariPool-1 — Connection\
    \ is not available,\n  requested timeout after 3001ms. <---- The exception message\n\
    \    at zaxxer.hikari.HikariPool.create(696) at\n    .createTimeoutException(HikariPool.java:...)\n\
    \    at zaxxer.hikari.HikariPool\n    .getConnection(HikariPool.java:157)\n  \
    \  at [com.zaxxer.hikari.HikariPool\n    .getConnection(HikariPool.java:162)\n\
    \    at [com.zaxxer.hikari.HikariDataSource\n    .getConnection(HikariDataSource.java:128)\n\
    \    at [com.example.repositories.PurchaseRepository\n    .findAll(PurchaseRepository.java:331)\n\
    \    at [com.example.repositories.PurchaseRepository\n    $$FastClassBySpringGLIBs$d6c9a0.invoke(<generated>)\n\
    ```\n\nAs I recommended in chapter 7, every profiling investigation should start\
    \ with sampling, which gives you an overview of the execution and the details\
    \ you need to continue your research. If you use VisualVM, the sampling result\
    \ would look like figure 8.3.\n\nAfter sampling and observing the stack trace\
    \ in the logs, we know our app has a problem connecting to the DBMS. But what\
    \ causes this problem? It could be one of two:\n\n+   - The communication between\
    \ the app and the DBMS fails because of some infrastructure or networking problems.\n\
    - The DBMS doesn't want to provide a connection to our application:\n  - Because\
