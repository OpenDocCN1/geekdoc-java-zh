    # 2.2.2 Navigating code with the debugger


    In this section, we discuss the basic ways you navigate code with a debugger.
    You''ll learn how to use three fundamental navigation operations:


    +   - Step over—Continue the execution with the next line of code in the same
    method.

    - Step into—Continue the execution inside one of the methods called on the current
    line.

    - Step out—Return the execution to the method that called the one you are investigating.


    To start the investigation process, you must identify the first line of code where
    you want the debugger to pause the execution. To understand the logic, you need
    to navigate through the lines of code and observe how the data changes when different
    instructions execute.


    There are buttons on the GUI and keyboard shortcuts to use the navigation operations
    in any IDE. Figure 2.12 shows you how these button appear in the IntelliJ IDEA
    Community GUI, the IntelliJ IDE.


