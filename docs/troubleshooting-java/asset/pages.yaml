  md: '# preface


    What does a software developer actually do for a living? “Implement software”
    is the most common answer to this question. But what does that mean? Is it only
    writing code? Well, no. While it is true that code is the result of everything
    a software developer does, the activity of writing code takes only a small part
    of a software developer''s working time. Most of a software developer''s time
    is actually used designing solutions, reading existing code, understanding how
    it executes, and learning new things. Writing code is the result of a software
    developer successfully accomplishing all of these tasks. Therefore

    fore, a programmer spends most of their time reading existing solutions rather
    than effectively writing new capabilities.


    Clean coding as a subject has, in the end, the same purpose: teaching developers
    how write easier-to-read solutions. Developers realize that it''s more efficient
    to write from the beginning than spend time trying to understand it later. But
    we need to be honest and admit that not all solutions are clean enough to quickly
    comprehend. We''ll always face scenarios in which we will need to understand the
    execution of some foreign capability.


    The reality is that software developers spend a lot of time investigating how
    they work. Well, they read examine code in their codebases and associated dependencies
    to figure out why something doesn''t work the way they expect. Developers sometimes
    read code only to learn about or better understand a given dependency. In many
    cases, reading code isn''t enough, and you have to find alternative (sometimes
    more complicated) ways to figure out what your app does. To understand how the
    environment affects your app or the JVM instance your app runs on,'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'may use a combination of profiling, debugging, and log investigations. If you
    know your options well and how to choose from among them, you will save valuable
    time. Remember, this is what developers spend most of their time doing. This development
    activity can be very beneficial.


    I designed this book to help people optimize the way they investigate software
    development challenges. In it, you''ll find the most relevant investigation techniques,
    which are applied with examples. We''ll discuss debugging, profiling, using logs,
    and efficiently combining these techniques. Throughout the book, I''ll give you
    valuable tips and tricks that will help you to become more efficient and solve
    problems (even the most difficult of them) faster. In other words, this book''s
    purpose, overall, is to make you more efficient as a developer.


    I hope this book brings significant value to you and helps you to become more
    efficient in quickly finding the root causes of issues you investigate.'
