  md: '# CHAPTER 11 Finding memory-related issues in an app''s execution


    +   - Find or query instance referees—Can tell you if the app has memory leaks

    - Find or query instance referees—Can tell you if specific instances are the cause
    of memory leaks

    - Find duplicates in instances—Can tell you if specific capabilities can be optimized
