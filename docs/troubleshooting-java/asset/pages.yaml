  md: '# D.4 Common issues in multithreaded architectures


    +   - Livelocks—Two or more threads fail to meet the conditions to stop and continuously
    run without executing any useful work.


    +   - Starvation—A thread is continuously blocked while the JVM executes other
    threads. The thread never gets to execute the instructions it defines.


    # D.4.1 Race conditions


    Race conditions happen when multiple threads try to change the same resource currently.
    When this happens, we can encounter either unexpected results or exceptions. Generally,
    we use synchronization techniques to avoid these situations. Figure D.12 visually
    shows such a case. T1 and T2 simultaneously attempt to change the value of x.
    T1 tries to increment the value, while T2 tries to decrement it. This scenario
    may result in different outputs for repeated executions of the app. The following
    scenarios are:


    +   - After the operations execute, x may be 5—If T1 changed the first value,
    and T2 already changed the value of the variable, or the other way around, the
    variable will still have a value of 5.


    +   - After the operations execute, x may be 4—If both threads read the value
    of x at the same time, but T2 wrote the last value, x will be (the value T2, 5,
    minus 1).


    +   - After the operations execute, x may be 6—If both threads read the value
    of x at the same time, but T1 wrote the last value, x will be 6 (the value T1,
    5, plus 1).


    Such situations usually lead to unexpected output. With a multithreaded architecture
    where multiple executions are possible, such scenarios can be challenging to reproduce.
    Sometimes, they happen only in specific environments, which makes investigations
    difficult.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_305_0.png)


    > Figure D.12 A race condition. Multiple threads concurrently to change a shared
    resource. In this example, threads T1 and T2 try to change the value of variable
    x simultaneously, which can result in different outputs.


    # D.4.2 Deadlocks


    Deadlocks are situations in which two or more threads pause and wait for something
    from each other to continue their execution (figure D.13). Deadlocks cause an
    app, or at least part of it, to freeze, preventing certain capabilities from running.'
