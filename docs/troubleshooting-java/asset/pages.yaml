    Here''s a trick I use when I have a stub to deal with a complex case like this
    one, in which, for some reason, I can''t straightforward identify where the app
    sends the request/to; I replace the other (app my app sends requests to) with
    a stub. Stub is a fake application that I control to help me identify the issue.
    For example, to determine what part of the code sends, I can make a stub block
    the request so my app indefinitely waits for a response. Then, I simply use a
    profiler to determine what code is stuck by the stub. Figure 1.8 shows the usage
    of a stub. Compare this figure to 1.7 to understand how the stub replaced the
    real app.


    You can create a fake app to replace the app calls. This is called a stub. You
    control the stub to make your investigation easier.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_28_1.png)


    For example, you can make the stub indefinitely block the HTTP request. In such
    a case, your app will remain blocked right on the instruction that sends the request.
    You can easily use a profiler to identify that instruction.


    Figure 1.8 You can replace the system component your calls with a stub. You control
