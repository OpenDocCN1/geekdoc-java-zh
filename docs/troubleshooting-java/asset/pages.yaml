  md: '# CHAPTER 1 Revealing an app''s obscurities


    +   - To understand why a particular piece of code or software capability provides
    a different result than expected

    - To learn how the technologies the app uses as dependencies work

    - To identify cases for performance issues such as app slowness

    - To find out root causes for cases in which an app suddenly stops


    For each presented case, you''ll find one or more techniques helpful in investigating
    the app''s logic. Later, we''ll dive into these techniques and demonstrate, with
    examples, how to use them.


    # 1.2.1 Demystifying the unexpected output


    The most frequent scenario in which you''ll need to analyze code is when some
    logic ends up with a different output than expected. This might sound simple,
    but it''s not easily solve.


    First, let''s define output. Output might have many definitions for an app. Output
    could be some text in the app''s console, or it could be some records changed
    in a database. We can consider output an HTTP request the app sends to a different
    system or some data sent in the HTTP response to a client''s request.


    > DEFINITION Any result of executing a piece of code that might result in data
    change, the exchange of information, or action against a different component is
    an output.


    How do we investigate a specific part of the app doesn''t have the expected result?
    We do so by choosing the proper technique based on the expected output. Let''s
    look at some examples.


    # SCENARIO 1: THE SIMPLE CASE


    Suppose an app should insert some records into a database. Yet, the app adds only
    part of the records. That is, you expected to find more data in the database than
    the app actually produces.


    The simplest way to analyze this is to use a debugger to follow the code execution
    and understand how it works (figure 1.4). You''ll learn about the main features
    of a debugger in 2 and 3. The debugger adds a breakpoint to pause the app execution
    at a specific line of code of your choosing, and then allows you to continue the
    execution manually. You run code instructions one by one so you can see how the
    values of the variables change and evaluate expressions on the fly.


    This scenario is the simplest, and by learning how to use all the relevant debugger
    features properly, you can find solutions to such issues in no time. Unfortunately,
    other cases are more complex, and a debugger tool isn''t always enough to solve
    the puzzle and find the cause of the problem.'
  merge: -1
