  md: '# 11.1 Sampling and profiling for memory issues


    +   1. Use memory sampling to get details about the object instances the app stores.

    2. Use memory profiling (instrumentation) to get additional details about a specific
    part of the code in execution.


    Let''s follow the same approach you learned in chapters 7 to 9 for CPU resource
    consumption: to sample an app execution for memory usage, select the Sampler tab
    in VisualVM. Then select the Memory button to start a memory usage sampling session.
    Call the endpoint and wait for the execution to end. The VisualVM screen will
    display the objects the app allocates.


    We are looking for what occupies most of the memory. In many cases, that will
    be one of these two scenarios:


    +   - Many instances of certain types are created and fill up the memory (this
    is what happens in our scenario).

    - There are not many instances of a certain type, but each instance is very large.


    Many instances filling this makes sense, but how could a small number of instances
    do that? Imagine this scenario: your app processes large video files. The app
    may load two or three files at a time, but since they are large, they fill the
    allocated memory. A developer can analyze whether the capability can be optimized.
    Maybe the app doesn''t need the full files loaded in memory but just strings at
    a time.


    When we start our investigation, we don''t know which scenario we''ll fall into.
    usually sort, in descending order, by the amount of memory occupied and by the
    number of instances. Notice in 11.3 that VisualVM shows you the memory spent and
    the number of instances for each sampled type. You need to sort, in descending
    order, by the second and the third columns in the table.


    In 11.3, you clearly see that I sorted the table in descending order by Live Bytes
    (space occupied). We can then look for the first type in our app''s codebase that
    appears in the table. Don''t look for primitives, strings, arrays of primitives,
    or arrays of strings. These are usually at the top when they are created as a
    side effect. However, in most cases, they don''t provide any clues about the problem.


    In 11.3, we clearly see that type Product is causing trouble. It occupies a large
    part of the allocated memory, and in the Live Objects column, we see that the
    app created one instances of this type.


    If you need the total number of instances of the type created throughout execution,
    you must use profiling (instrumentation) techniques. We''ll do this in this chapter.


    This app is just an example, but in a real-world app, simply sorting by the occupied
    space may not be enough. We need to figure out whether the problem is a large
    number of instances or whether each instance takes a lot of space. Know what you''re
    thinking: isn''t it clear in this case? Yes, but in a real-world app it may not,
    so I always recommend that developers sort descending by the number of instances'
