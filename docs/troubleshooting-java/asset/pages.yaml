  md: '# 11.2 Using heap dumps to find memory leaks


    Just as with memory sampling and profiling, we''re searching for the types that
    use the most memory. The best approach is to sort, in descending order, by both
    instances and occupied memory and look for the first types that are part of your
    app''s codebase. Don''t look for types as primitives, strings, or arrays of primitives
    and strings. There are usually a lot of them, they won''t give you many clues
    about what is wrong.


    In 11.13, you can see, after sorting, the Product type seems to be involved in
    the process. The Product type is the first type that is part of your app''s codebase,
    and it uses a large part of memory. We need to figure out why so many instances
    have been created and why the GC can''t remove them from the memory.


    Look for the object type in your app''s codebase that occupies the most memory.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_253_0.png)


    Figure 11.13 Using columns to identify which type created a large number of instances
    or takes up a lot of space. Always look for the first object in your app codebase.
    In this case, both in number of instances and size, the Product type is the one
    that is first.


    You can select the plus sign (+) on the left side of the row to get details about
    that type. We already know there are more than one million Product instances,
    but we still need to find


    +   * What part of the code creates those instances

    * Why the GC can''t remove them in time (through fields) and what refers to that
    instance.


    You can find what each instance refers to. Since we know the GC cannot remove
    an instance from the memory unless it has no references, we look for references
    to see whether it is still needed in the processing or if the app refers to it
    for removal.'
