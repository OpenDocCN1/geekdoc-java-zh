  md: "# Synchronizing threads\n\nIn this section, we'll discuss approaches to synchronizing\
    \ threads, developers use to control the threads in a multithreaded architecture.\
    \ Incorrect synchronization is also the root of many problems you'll have to investigate\
    \ and solve. We'll go through an overview of the most common ways used to synchronize\
    \ threads.\n\n# Synchronized blocks\n\nThe simplest way to synchronize threads,\
    \ and usually the first concept Java developer learns about synchronizing threads\
    \ is using a synchronized block of code. The purpose is to allow only one thread\
    \ at a time through the synchronized code—prohibit concurrent execution for a\
    \ given piece of code. There are two options for this:\n\n+   * Block synchronization—Applying\
    \ the synchronized modifier on a given block of code\n* Method synchronization—Applying\
    \ the synchronized modifier on an example of a synchronized block:\n\nThe next\
    \ code snippet shows an example of a synchronized block:\n\n```\nsynchronized\
    \ (s) {\n  // do something\n}\n```\n\n> The object between the parentheses is\
    \ the monitor of the synchronized block.\n\nThe next code snippet shows you a\
    \ method synchronization:\n\n```\nsynchronized void m() {\n  // do something\n\
    }\n```\n\n> Synchronized modifier applied to the method\n\n> The whole block of\
    \ code of the method defined between the curly braces is synchronized.\n\nBoth\
    \ of ways the synchronized keyword work the same, even if they look a a bit different.\
    \ You'll find two important components of each synchronized block:\n\n+   * The\
    \ monitor—An object managing the execution of the synchronized instructions\n\
    * The block of instructions—The actual instructions, which are synchronized\n\n\
    The method synchronization seems to be missing the monitor, but for this syntax\
    \ the monitor is actually implied. For a nonstatic, the instance \"this\" will\
    \ be used as a monitor, for a static method, the synchronized block will use the\
    \ class's type instance.\nThe synchronized block (which cannot lock) is the object\
    \ that gives sense to a synchronized instructions. This object decides whether\
    \ a thread can enter and execute the synchronized instructions. The rule is: once\
    \ a thread enters the synchronized block, it acquires a lock on the monitor. No\
    \ other thread will be accepted in the synchronized block until the one that has\
    \ releases it. To simplify things, let's assume that a thread releases the lock\
    \ only when it exits the synchronized block. Fig.D.5 shows a visual example. Imagine\
    \ the two synchronized blocks are different"
  merge: -1
