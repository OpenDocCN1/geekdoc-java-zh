    # 5.2.3 Problems caused by logging and how to avoid them


    We log messages so that we can understand how an app behaved at a certain point
    in time or over time. Logs are necessary and extremely helpful in many cases,
    but they also become malicious if mishandled. In this section, we discuss three
    main problems logs can cause and how to avoid them (figure 5.13):


    +   - Security and privacy issues—Caused by log messages exposing private data

    - Performance issues—Caused by the app storing too many or too-large log messages

    - Maintainability issues—Caused by log instructions that make the source code
    more difficult to read


    ![](img/c89c22ff51802d920b32d2b061ce5aea_113_0.png)


    > Figure 5.13 Small details can cause problems. Developers sometimes consider
    an app''s logging capability harmless by default and disregard the problems logging
    can introduce. Logging, however, like all the other software capabilities, deals
    can affect the app''s functionality and maintainability.


    # SECURITY AND PRIVACY ISSUES


    Security is one of my favorite topics and one of the most important subjects a
    developer needs to consider when they implement an app. One of the books I wrote
    concerns security, and if you implement an app using the Spring Framework and
    want to learn more about securing them, I recommend you read it: Spring Security
    in Action (Manning, 2020).


    Surprisingly, logs can sometimes cause vulnerabilities in applications, and in
    most cases, these issues happen because developers are not attentive to the details
    they expose. Remember that logs make specific details visible to anyone who can
    access them. You all need to think about the data you log to those who can access
    the logs (figure 5.14).'
