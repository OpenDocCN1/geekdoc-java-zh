- img_proc: true
  md: "# 11.2 Using heap dumps to find memory leaks\n\nThe first argument, -XX:+HeapDumpOutOfMemoryError,\
    \ tells the app to generate a heap dump when it encounters an OutOfMemoryError\
    \ (the heap fills). The second argument, XX:HeapDumpPath=heapdump.bin, specifies\
    \ the path in the filesystem where the dump will be stored. In this case, the\
    \ file containing the heap dump will be named heapdump.bin and will be located\
    \ close to the executable, from the root of the classpath (because we used a relative\
    \ path). Make sure you have “write” privileges on this path to be able to store\
    \ the file in the given location.\n\nThe following snippet shows the command for\
    \ running the app:\n\n```\njava -jar -XX:+HeapDumpOutOfMemoryError\n-XX:HeapDumpPath=heapdump.bin\
    \ app.jar\n```\n\nWe'll use an app named damch11-ex2 to demonstrate this approach.\
    \ You can find this app in the projects provided with the book. The app in the\
    \ following list continuously adds instances of type Product to a list until the\
    \ memory fills.\n\nListing 11.1 Generating a large number of instances that can\
    \ be deallocated\n\n```\npublic class Main {\n    private static List<Product>\
    \ products = new ArrayList<>();\n\n    public static void main(String[] args)\
    \ {\n        Random r = new Random();\n        while (true) {\n            Product\
    \ p = new Product();\n            p.setName(\"Product \" + r.nextInt());\n   \
