    # 6.2.2 Observing the CPU and memory usage


    One of the simplest things you can do with a profiler is observe how your app
    consumes the system''s resources. This way, you can spot problems like memory
    leaks or zombie threads in your app.


    > DEFINITION A memory leak is when your app doesn''t deallocate unused data. Over
    time, there will be no more free memory. This is a problem.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_129_1.png)


    As you''ll learn in this section, you can use a profiler to visually confirm that
    your app isn''t behaving correctly. For example, zombie threads are threads that
    remain in continuous execution, consuming the app''s resources. You can easily
    observe such problems using VisualVM.'
