  md: "# D.3 Synchronizing threads 285\n\nfrom executing if it doesn't make sense\
    \ to execute. At the same time, the wrong use of these methods can lead to deadlocks\
    \ or situations where threads wait indefinitely without ever being released to\
    \ execution.\n\nRemember that wait(), notify(), and notifyAll() make sense only\
    \ when they are used in a synchronized block. These are behaviors of the synchronized\
    \ monitor, so you can't use them without a monitor. With the wait() method, the\
