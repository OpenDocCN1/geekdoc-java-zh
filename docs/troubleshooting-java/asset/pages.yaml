  md: '# APPENDIX D Understanding threads


    The three consumers are waiting because the list is empty, so they don''t have
    a value to consume. It doesn''t make sense to execute when the list is empty,
    so they wait to save the system''s resources.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_302_0.png)


    When a producer adds an element to the list, it notifies the consumers using the
    notify() and notifyAll() methods. The consumers enter the runnable state again,
    and the JVM can execute them.


    **D.9 A case for wait() and notify().** When a thread waits by executing in the
    current conditions, we can make it wait until further notice. In this case, a
    consumer should not execute when it has no value to consume. We can make the consumers
    wait, and a producer can tell them to continue only after it adds a new value
    to the shared resource.


    # 3.3.3 Joining threads


    A common yet another synchronization approach is joining threads by making a thread
    wait until another has its execution. What''s different from the wait/notify pattern
    is that the thread doesn''t need to be notified. The thread simply waits for the
    other to finish its execution. Figure.10 shows a scenario that could benefit from
    this synchronization technique.


    Suppose you want to implement some data processing on data retrieved from two
    independent sources. Usually, retrieving the data from the first data source takes
    about 5 seconds, and getting the data from the second data source takes about
    8 seconds. If you execute the operations sequentially, the time needed to get
    all the data for processing is 5 + 8 = 13 seconds. But you know a better approach.
    Since the data sources are two independent databases, you can get the data from
    both at the same time if you use two threads. But then you need to make sure the
    thread that processes the data waits for both threads that retrieve the data to
    finish before it starts. To achieve this, you make the processing thread join
    the threads that retrieve the data (figure.10).


    Joining threads is, in many cases, a necessary synchronization technique. But
    when not used well, it can also cause problems. For example, if one thread is
    waiting for another, is stuck, or never ends, the one joining it will never execute.'
