  md: '# Normal behavior


    In an app that behaves normally, you will see this pattern. The memory fills,
    and at a certain point, the GC cleans the unneeded data, freeing up the memory.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_142_0.png)


    These are moments when the GC cleaned the unneeded data, making space for new
    data to be added in memory.


    # Abnormal behavior


    ![](img/c89c22ff51802d920b32d2b061ce5aea_142_1.png)


    When an app has a memory leak, the used memory continuously grows. The GC attempts
    to free the memory but cannot deallocate objects since the app holds references
    for most of them.


    Figure 6.12 A comparison between the memory usage for a healthy app versus an
    app suffering from a memory leak. The GC manages to free unneeded data from memory
    for a healthy app, and the allocated space never fills up. An app suffering from
    a memory leak does not allow the GC to remove enough data. At some point, memory
    fills up completely, generating an OutMemoryError.


    Aside from the normal space, any app also uses a metaspace: the memory location
    where the JVM stores the metadata needed for the app''s execution. In VisualVM
    you can observe the allocation of the metaspace in the memory allocation widget
    as well. To evaluate the metadata allocation, use the Metaspace tab of the widget,
    as presented in figure 6.13.


    An OutMemoryError on the metadata space happens less often, but it''s not impossible.
    I recently dealt with an app that was using a framework for data persistence.
    Generally, frameworks and libraries using Java reflection are the most likely
    to generate such problems if misused since they rely on dynamic proxies and indirect
    calls.


    In my situation, the app was using a framework Hibernate. I would not be surprised
    if you have already heard about Hibernate since today. it''s one of the most common
    solutions to manage persistent data in Java apps. Hibernate is an excellent tool
    that helps to implement the most-used persistence capabilities of an app'
