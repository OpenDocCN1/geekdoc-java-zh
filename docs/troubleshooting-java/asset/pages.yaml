  md: '# Tips for applying investigation techniques


    +   - Always look for the root cause of a problem before deciding how to solve
    it. Focusing on the apparent problem might only be sweeping it under the rug.

    - An exception thrown at run time is not always in itself the problem. It could
    be a consequence of the real problem. Always look for the root cause.

    - No one investigation technique applies to every troubleshooting situation. Remember
    that for most scenarios, you''ll have to apply a combination of investigation
    techniques.

    - The more you are aware of all the investigation techniques, the easier it will
    be for you to find the proper combination to quickly solve a scenario.

    - In most cases, complex investigation techniques can help, but always remember
    that times a simple log line in the right place can do miracles.

    - Sometimes a good night''s sleep is better than any troubleshooting technique.


    # Normal behavior


    ![](img/c89c22ff51802d920b32d2b061ce5aea_1_0.png)


    In an app that behaves normally, you will see this type of a pattern. The memory
    fills, and at a certain point the GC cleans the unneeded data, freeing up the
    memory.


    These are moments in which the GC cleaned the unneeded data, making space for
    new data to be added in memory.


    # Abnormal behavior


    ![](img/c89c22ff51802d920b32d2b061ce5aea_1_1.png)


    When an app has a memory leak, you will see the used memory continuously grows.
    The GC makes efforts to free the memory but can''t deallocate enough objects since
    the app holds the references for most of them.'
