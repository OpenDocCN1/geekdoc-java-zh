  md: '# D.3 Synchronizing threads


    287


    ![](img/c89c22ff51802d920b32d2b061ce5aea_303_0.png)


    Getting data from the two sources on the same thread would mean executing the
    operations sequentially. The result would be 5 + 8 = 13 seconds spent to get the
    data before processing can start.


    Because the two data sources are independent, we can implement the operations
    that get the data on separate threads, which is more efficient since we only spend
    the maximum time (8 seconds). But we need to make sure processing starts only
    after the data is retrieved. We use the join() method to ensure processing after
    the threads finish their execution.


    **Figure D.10** In some cases, you can improve the app''s performance using multiple
    threads. But you may need to make some wait for others since they depend on the
    execution result of those threads. You can make a thread wait for another using
    a join operation.


    # D.3.4 Blocking threads for a defined time


    Sometimes a thread needs to wait for a given amount of time. In this case, the
    thread is in a "timed waiting" state or "sleeping." The following operations are
    the most common to cause a thread to be timed out:


    +   - `sleep()`—You can use the static sleep() method to make the thread wait
    currently executing the code for a fixed amount of time.

    - `wait(long timeout)`—The wait with a timeout parameter can be used the same
    as the wait() method without any parameters, as discussed in section D.3.2. However,
    if you provide a parameter, the thread will give it time if not notified earlier.

    - `join(long timeout)`—This operation works the same as the join() method discussed
    in section D.3.3, but waits for the maximum timeout, which is given as a parameter.


    A common antipat I often find in apps is the use of sleep() to make a thread wait
    instead of the wait() method discussed in chapter 4. The producer-consumer architecture
    we discussed as an example. You could use sleep() instead of wait(), but how long
    should a consumer sleep to ensure the producer has time to run and add values
    to the shared resource? We don''t have an answer to this question. For example,
    making the thread sleep for 100 milliseconds (as shown in figure D.11) can be
    too long'
