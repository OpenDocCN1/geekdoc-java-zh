- img_proc: true
  md: '# CHAPTER 8 Using advanced visualization tools for profiled data


    way to cancel the execution of a stored procedure (a procedure running at the
    data-base level). The implementation was not complex, but it required directly
    accessing the connection object. In many cases, it was enough to allow Spring
    to use the connection behind the scenes. Spring is a robust framework and easy
    to customize, and you can easily access the connections it manages, but it still
    manage these connections after you access them? The answer is sometimes. And this
    “sometimes” is what makes things interesting (and also more challenging).


    The developers found that in a standard method execution the framework also closes
    the connections at the end. The procedure was cancelled with a batch approach,
    which was implemented from Spring Batch. In such cases, the framework didn''t
    close the connections; you must manage them. The developers used the same approach
    in both cases and didn''t realize that the connections were not closed in one
    of the cases, which could have caused a big problem. Fortunately, the development
    error was found in time and caused no harm.


    This story shows why the technique you''ll learn in this section is still relevant.
    The name of the frameworks you use doesn''t matter, and you may never know what
    happens behind the scenes, being prepared to investigate your app execution in
    any way will be relevant.


    We''ll use project da-ch8-ex with the book. This project defines a simple app
    with a huge problem: one of its methods “forgets” to close the JDBC connections
    it opens. An app creates a JDBC connection to send SQL queries to the DBMS. The
    JDBC connections must be closed when the app no longer needs them. All DBMS clients
    (i.e., apps) have the ability to get a limited number of connections (usually
    a small number, such as 100). When an app opens all these connections but doesn''t
    close them, it cannot connect to the database server (figure 8.1).


    The DBMS doesn''t always prefer 100 connections. This number is configurable at
    the database level. When working with a database, it''s best to find (usually
    by asking the database administrator) the maximum number of connections the app
    can open.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_172_0.png)


    To simplify our demonstration, we''ll use a persistence layer that limits the
    number of connections to 10.


