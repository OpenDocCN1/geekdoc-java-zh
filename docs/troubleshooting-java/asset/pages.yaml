    # 11.2.2 Reading a heap dump


    In this section, we will focus on using a heap dump to investigate memory allocation
    issues. The heap dump is like a "picture" of the memory when the dump was generated.
    It contains all the data that the app had, which means you can use it to examine
    the data and how it was structured. This way, you can determine which objects
    occupied a big part of the allocated memory and why the app couldn''t deallocate
    them.


    > Remember that in the "picture" (heap dump) you can see everything. If unencrypted
    passwords or any kind of private data is in memory, someone with the heap dump
    will be able to get these details.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_250_0.png)


    Unlike a thread dump, you cannot analyze a heap dump as plain text. Instead, you
    must use VisualVM (or any profiling tool in general). In this section, we''ll
    use VisualVM to analyze the heap dump we generated for project-ch11-ex2 in section
    11.2.1. You''ll learn to utilize this approach to find the root cause of OutMemoryError.


    When you open a heap dump in VisualVM, the profiling tool displays a summary of
    the heap dump (figure 11.11), which provides quick details on the heap dump


    234'
