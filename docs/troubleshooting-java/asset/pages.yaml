  md: '# 9.3 Analyzing waiting threads


    In such a case, you can enhance the app:


    +   - Minimize the number of locks for the consumer and make it wait to allow
    the producer to work.

    - Define producer threads or make the consumer thread read and process the values
    in batches (multiple at a time).


    Everything depends on what the app does, but understanding what you can do to
    make it better starts with analyzing the execution. Because you never have one
    approach you can apply to all apps. I recommend developers use a profiler and
    analyze the changes in app execution when they implement a multithreaded app.


    # 9.3 Analyzing waiting threads


    In this section, we analyze threads that are waiting to be notified. Waiting threads
    are different from locked threads. A monitor locks a thread for the execution
    of a synchronized block of code. In this case, we don''t expect the monitor to
    execute a specific action to "tell" the blocked thread to continue its execution.
    But a monitor can make the thread wait for an indefinite amount of time and later
    decide when to allow that thread to continue its execution. Once a monitor waits
    a thread, the thread will return to execution only after being notified by the
    same monitor. The ability to make a thread wait until notified gives great flexibility
    in controlling threads, but it can also cause issues when not used correctly.


    To visualize the difference between locked and waiting threads, look at figure
    9.14. Imagine the synchronized block is a restricted area managed by a police
    officer. The threads are cars. The police officer allows just one to run at a
    time in the restricted area (the synchronized block). The cars that are blocked
    we say are locked. The police officer can also manage the cars running in the
    restricted area. The police officer can order a car running inside this area to
    wait until they are explicitly ordered to continue; we say waiting.


    We''ll use the same application we analyzed earlier in this chapter and consider
    the following scenario: one of the developers working on the app thought about
    an improvement to our producer-consumer architecture. Now, the consumer thread
    can''t do anything when the list is empty, so it iterates multiple times over
    a false condition until the JVM makes it wait to allow a producer to run and add
    values to the list. The same thing happens when the producer adds 100 values to
    the list. The producer thread runs over a false condition until the JVM allows
    a consumer to remove some of the values from the list.'
