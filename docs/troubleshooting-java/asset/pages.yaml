  md: '# D.4 Common issues in multithreaded architectures


    # D.4.3 Livelocks


    Livelocks are more or less the opposite of deadlocks. When threads are in a livelock,
    the condition always changes in a way that the threads continue their execution
    even though they should stop on a given condition. The threads can''t stop, and
    continuously run, consuming the system''s resources without reason. Livelocks
    can cause performance issues in any app''s execution.


    Figure D.15 demonstrates a livelock with a sequence diagram. Two threads, T1 and
    T2, run in a loop. To stop its execution, T1 makes a condition true before its
    last iteration. The next time T1 comes back to the condition, it expects it to
    be true and to stop. However, this doesn''t happen since another thread, T2, changed
    it to false. T2 finds itself in the same situation. Each thread changes the condition
    so that it can stop, but at the same time, each change causes the other thread
    to continue running.


    +   1. T1 iterates continuously and stops only when the condition is true


    +   2. T2 iterates continuously and stops only when the condition is false


    +   3. Before its last iteration T1 changes the condition to true so it stops
    the next time.


    +   4. Before its last iteration, T2 changes the condition to false so it stops
    the next time.


    +   5. But because T2 changed back the condition, T1 continues running. The scenario
    repeats indefinitely.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_307_0.png)


    Figure D.15 An example of a livelock. Two threads rely on a condition to stop
    their execution. When changing the value of the condition so that they can, each
    thread changes the other to continue running. The threads cannot stop, and unnecessarily
    spend the system''s resources.


    Just as the deadlock example in chapter 4 (section 4.4.2), remember this is a
    simplified scenario. Livelocks can be caused by more complex scenarios in the
    real world, and more than two threads can be involved. Chapters 7 to 9 detail
    several ways one can approach the investigation of such scenarios.'
