  md: '# D.4.4 Starvation


    Another problem, although less likely to occur in today''s apps, starvation. Starvation
    is caused by a certain thread being constantly excluded from the execution even
    if it is runnable. The thread wants to execute its instructions, but the JVM continuously
    allows other threads to access the system''s resources. Because the thread cannot
    access the system''s resources and execute its defined set of instructions, we
    say that it is starving.


    In the early JVM versions, this situations occurred when the developer set a much
    lower priority to a given thread. Today, the JVM implementations are much smarter
    in treating these cases, so (at in my experience) starvation scenarios are less
    likely.


    # D.5 Further reading


    Threads are complex, and in this appendix we discussed the essential topics that
    will help you understand the techniques addressed throughout this book. But, for
    any Java developer, understanding how threads work in detail is a valuable skill.
    Here is a list of resources I recommend you read learn about threads in depth:


    +   - Oracle Certified Professional Java SE 11 Developer Complete Study Guide
    by Jeanne Boyarsky and Scott Selikoff (Sybex, 2020). Chapter 18 describes threads
    and concurrency, starting from zero and covering all the thread fundamentals OCP
    certification. I recommend you start with this book to learn threads.


    +   - The second edition of The Well-Grounded Java Developer by Benjamin Evans,
    Jason Clark, and Martij Verburg (Manning, 2022) teaches concurrency, from fundamentals
    to performance tuning.


    +   - Java Concurrency in Practice by Brian Goetz et al. (Addison-Wesley, 2006)
    is an older book, but it hasn''t lost its value. This book is a must-read for
    any Java developer wanting to improve their threads and concurrency knowledge.'
