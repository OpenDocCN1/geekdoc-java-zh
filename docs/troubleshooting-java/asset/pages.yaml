  md: '# 9.2 Analysing thread locks


    In 9.6, we are seeing something interesting: the method waits, as shown in the
    sampling data, it doesn''t wait for something else. It simply seems to wait on
    itself. The row marked as “Self time” tells us how much time it took to execute.
    Notice that the method spent only 700 ms CPU time as self time but a much larger
    value of 4903 ms as total execution time.


    In chapter 7, we worked on an example where the app was waiting for an external
    service to respond. In that case, the app was making a call and waiting for the
    other service to reply. But here the situation looks peculiar. What could cause
    such behavior?


    You may wonder, “How can a method be waiting for itself? It is too late to run?”
    When we observe such behavior, in which a method is waiting but not for something
    external, its thread has likely been locked. To get more details about what the
    thread, we need to engage in further analysis by profiling.


    > Note that the method doesn''t wait for something external. Its self-execution
    time is very long, even though CPU time is short.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_201_0.png)


    Figure 9.6 The method doesn''t wait for something, but instead it waits for itself.
    We observe that its self-execution time is longer than the total CPU time, which
    usually means that the thread is locked. The thread could have been blocked by
    another thread.


    Sampling didn''t answer all questions. We can see the methods waiting, but we
    don''t know what they are waiting for. We need to continue with profiling'
