    # Summary


    +   - A thread can be locked and forced to wait by a synchronized block of code.
    Locks appear when threads are synchronized to avoid changing shared resources
    at the same time.

    - Locks are needed to avoid race conditions, but sometimes apps use faulty thread
    synchronization approaches, which can lead to undesired results such as performance
    issues or even app freezes (in the case of deadlocks).

    - Locks caused by synchronized code blocks slow down the app''s execution because
    they force threads to wait instead of letting them work. Locks may be needed in
    certain implementations, but it''s better to find ways to minimize the time an
    app''s locks are locked.

    - We can use a profiler to identify which locks slow down an app, how many locks
    the app encounters during execution, and how much they slow performance.

    - When using a profiler, always sample the execution first to figure out if the
    app''s execution is affected by locks. You''ll usually identify locks when sampling
    by observing that a method is waiting on itself.

    - If you find by sampling that locks may be affecting the app''s execution, you
    can continue investigating using lock profiling (instrumentation), which will
    show'
