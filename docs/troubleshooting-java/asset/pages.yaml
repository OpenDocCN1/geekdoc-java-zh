    \ Conditional breakpoints are helpful in investigation scenarios when you are\
    \ only interested in how a part of the code works with given values; using conditional\
    \ breakpoints where appropriate saves time and helps you to more easily how your\
    \ app works.\n\n![](img/c89c22ff51802d920b32d2b061ce5aea_60_0.png)\n\nLet's look\
    \ at an example to understand how conditional breakpoints work and typical cases\
