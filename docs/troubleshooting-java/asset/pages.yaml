  md: '# 6.2.3 Identifying memory leaks


    In this section, we discuss memory leaks and how to determine when your app is
    affected by them. A memory leak is when an app stores and keeps references to
    unused objects (figure 6.10). Because of these references, the GC (the mechanism
    responsible for removing unneeded data from the app''s memory) cannot remove these
    objects. As the app continues to add more data, the memory fills up. When the
    app doesn''t have space to add the new data, it throws an OutOfMemoryError and
    stops. We''ll use a simple app that causes an OutOfMemoryError to demonstrate
    how to identify a memory leak using VisualVM.


    +   1. Suppose you have an app that creates object instances and keeps references
    to these instances in a list.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_139_0.png)


    +   2. The app continues to create new instances. Some of the previously created
    instances are no longer needed, but the app doesn''t remove their references from
    the list.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_139_1.png)


    +   3. Because the app keeps the references, the GC fails to remove the unneeded
    objects from the memory. The memory gets full, and at some point, the app can''t
    allocate more objects. The process stops, and the app fails with anOutOfMemoryError.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_139_2.png)


    > Figure 6.10 AnOutOfMemoryError is like a ticking bomb. An app fails to references
    to objects it no longer uses. The GC can''t remove these instances from the memory
    because the memory keeps their references. While other objects are created, the
    memory gets full. At some point, there''s no more space in the heap to allocate
    other objects, and the app fails with anOutOfMemoryError.


    In the example provided with project da-ch6-ex3, you can find a simple app that
    stores random instances in a list but never removes their references. The following
    code provides an example of a simple implementation that produces anOutOfMemoryError.'
  merge: -1
  pgno: 139
- img_proc: true
  md: "# Listing 6.7 Producing an OutOfMemoryError\n\n```\npublic class Main {\n \
    \   public static List<Cat> list = new ArrayList<>();\n\n    public static void\
    \ main(String[] args) {\n        while (true) {\n            list.add(new Cat(new\
    \ Random().nextInt(10)));\n        }\n    }\n}\n```\n\nContinuously adds new instances\
    \ to a list until the JVM runs out of memory\n\nThe class Cat is a simple java\
    \ object, as presented by the following code snippet:\n\n```\npublic class Cat\
    \ {\n    private int age;\n\n    public Cat(int age) {\n        this.age = age;\n\
    \    }\n\n    // Omitted getters and setters\n}\n```\n\nLet's run this and observe\
    \ resource usage with VisualVM. We're especially interested in the widget that\
    \ shows memory usage. When a memory leak affects your app, this will get confirm\
    \ that the used memory grows continuously. The GC tries deallocate unused data\
    \ from memory, but it removes too few. In the end, the memory gets filled, the\
    \ app cannot store the new data, and it throws an OutOfMemoryError (figure 6.11).\n\
    \nIf you let the app run long enough, you'll eventually see the error stack trace\
    \ in the app's console:\n\n```\nException in thread 'main': java.lang.OutOfMemoryError:\
    \ Java heap space\nat java.base/java.util.Arrays.copyOf(Arrays.java:3689)\nat\
    \ java.base/java.util.ArrayList.grow(ArrayList.java:238)\nat java.base/java.util.ArrayList.grow(ArrayList.java:243)\n\
    at java.base/java.util.ArrayList.add(ArrayList.java:486)\nat java.base/java.util.ArrayList.add(ArrayList.java:499)\n\
    at java.main.Main.main(Main.java:13)\n```\n\nIt's important to remember that an\
    \ OutOfMemoryError stack trace doesn't indicate the place that causes the problem.\
    \ Since an app has just one memory location, a certain thread can cause the problem,\
    \ whereas another thread may be unlucky enough to be the last one trying to use\
    \ the memory and gets the error. The only way to identify the root cause is using\
    \ a heap dump, which you'll learn in chapter 11."
