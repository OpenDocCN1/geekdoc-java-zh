  md: '# 4.2 Investigating in remote environments


    # 4.2.2 Finding issues in remote environments


    In this section, we use remote debugging to investigate the case studied in section
    4.2.1. We start by configuring and running the app to connect to a remote debugger
    and then attach the debugger to start our investigation.


    The app would already be running in a real-world case and most likely wouldn''t
    be already configured to allow remote debugging. Therefore, we begin starting
    with the app so that you are aware of the full picture of remote debugging and
    know the prerequisites of such an approach.


    When starting the app you want to remote debug, to the execution you need to make
    sure you attach a debugger agent to a Java app execution, use the -agentlib:jdwp
    parameter to the java command line, as in figure 4.5. You must specify the port
    to which you attach the debugger tool. Basically, the debugger agent acts as a
    server, listening for a debugger tool to connect on the configured port and allowing
    the tool to run the debug operations (pausing execution on a breakpoint, stepping
    over, stepping into, etc.).


    ![](img/c89c22ff51802d920b32d2b061ce5aea_83_0.png)


    Figure 4.5 When debugging an app locally, the IDE attaches the debugger. When
    running an app in a remote environment, you must attach a debugger agent at the
    app start yourself.


    You can copy this command:


    ```

    java -agentlib:jdwp:transport=dt_socket,server=y,suspend=n,address=:5005 app.jar

    ```


    Notice the following configurations specified in the command:


    +   - transport=dt_socket configures the way debugger communicates with the debugger
    agent. The dt_socket configuration means we use TCP/IP to establish the communication
    over a network. This is always how we establish the communication between the
    agent and the tool.


    +   - server=y means the agent acts as a server after attaching to it. The agent
    waits for a debugger tool to connect to and control the app execution through
    it. You would use the server=n configuration to connect to a debugger agent rather
    than starting one.'
