    When the debugger pauses code execution on a specific instruction from the line
    you mark with a breakpoint, you can use the valuable information the IDE displays.
    In 2.7, you can see that the IDE displays two essential pieces of information:


    +   * The value of all variables in scope—Knowing all the variables in scope and
    their values helps you understand what data is being processed and how the logic
    affects the data. Remember that the execution is paused before the execution of
    the line marked with a breakpoint, so the state data remains the same.

    * The execution stack trace—This shows you how the app executes the line of code
    where the debugger paused the execution. Each line in the stack trace helps you
    to visualize the execution path, without needing to remember how you got to a
    specific instruction when using the debugger to navigate through code.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_44_0.png)


    > TIP You can add as many breakpoints as you want, but it is best to use a limited
    number at a time and to focus only on those lines of code. I usually use no more
    than three breakpoints at the same time. I often see developers add too many breakpoints,
    forget them, and get lost in the investigated code.


    Generally, observing the values of variables in scope is easily understandable.
