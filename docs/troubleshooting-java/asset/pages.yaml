    a problem.


    As you''ll learn, you need to attach a piece of software name agent to the app
    execution to enable remote debugging. Some of the consequences of attaching the
    debugging agent (and why you shouldn''t do this in a production environment) include
    these:


    +   * The agent can solve the app''s execution; this sluggishness can cause performance
    problems.

    * The agent needs to communicate with the debugger tool through the network. To
    enable this, you need to make specific ports available, which can cause vulnerability
    issues.

    * Debugging a specific piece of code can interfere with functionality if the same
    part of the app is being used elsewhere simultaneously.

    * Sometimes debugging can block the app indefinitely and force you to restart
    the process.


