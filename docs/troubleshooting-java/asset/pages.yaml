  md: '# CHAPTER 5 Making the most of logs: Auditing an app''s behavior


    Table 5.1 Logs vs. remote debugging (continued)


    | Capability | Logs | Remote debugging |

    |---|---|--|

    | Allows to pause the execution on a given line of code to understand what the
    app does | ❌ | ✅ |

    | Can be used to understand an app''s behavior without interfering with the executed
    logic | 〽 | ❌ |

    | Is recommended for production environments | ✅ | ❌ |


    You use both logs and remote debugging to understand the behavior of a remotely
    executing app. But both approaches have their difficulties. Logging implies that
    the app writes the events and the data needed for the investigation. If that''s
    not the case, you need to add those instructions and redeploy the app. Remote
    debugging allows your debugger to connect to the remotely executing app, specific
    network configurations and permissions to be granted.


    A big difference is the philosophy each technique implies. Debugging focus on
    the present. You pause the execution and observe the app''s current state. Logging
    is more about the past. You get a bunch of log messages and analyze the execution,
    focusing on a timeline. It''s common to use debugging and logging simultaneously
    to understand more complex issues, and I can tell you from experience that sometimes
    using logs versus debugging depends on the developer''s preference. I see developers
    using a technique simply because they are more comfortable with one than another.


    # Summary


    +   - Always check the logs when you start investigating any issue. The logs may
    indicate what is wrong or at least give you a starting point for your investigation.

    - All messages should include a timestamp. Remember that in most cases a system
    doesn''t guarantee the order in which the logs are stored. The timestamp will
    help you to order the log messages chronologically.

    - Avoid saving too many log messages. Not every detail is relevant or helpful
    in investigating a potential issue, and storing too many log messages can affect
    the app''s performance and make the code more difficult to read.

    - You should implement more logging only if needed. A running app should only
    log essential messages. If you require more details, you can always enable more
    logging for a short time.'
