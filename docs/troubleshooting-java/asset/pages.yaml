  md: '# 5.1 Investigating issues with logs


    I also recommend reading 4 of Logging in Action by Phil Wilkins (Manning, 2022).
    This chapter focuses more on investigation techniques with logs, while Logging
    in Action moves more deeply into logs'' technicalities. You''ll also find logging
