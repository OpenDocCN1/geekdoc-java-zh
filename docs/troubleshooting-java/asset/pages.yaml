    # 5.1 Investigating issues with logs


    Like any other investigation technique, using logs makes sense in some situations
    and doesn''t in others. In this section, we examine various scenarios in which
    logs can help you to easily understand software behavior. We''ll begin by discussing
    key points of log messages and analyze how these characteristics assist developers
    in their investigation of apps.


    One of the biggest advantages of log messages is that they allow you to visualize
    the execution of a certain piece of code at a given time. When you use a debugger,
    as discussed in chapters 2 through 4, your attention is mainly on the present.
    You look at how the data works while the debugger pauses the execution on a specific
    line of code.


    A debugger doesn''t give you details on the execution history. You can use the
    execution stack trace to identify the execution path, but everything else is focused
    on the present.


    In contrast, logs focus on the app''s execution over a past period (figure 5.5).
    Log messages have a strong relationship with time.


    # Debugging


    ![](img/c89c22ff51802d920b32d2b061ce5aea_99_0.png)


    # Investigating with logs


    When investigating with logs, you focus on a past time period.


    Figure 5.5 When investigating with the debugger, you focus on the present. When
    you focus on a given period in the past. This difference can help you to decide
    which one to use.


    Remember to consider the time zone of the system on which your app is running.
    The log time may be shifted by a few hours because of different time zones (e.g.,
    between where the app runs and where the developer is), and this can be confusing.'
