  md: '# 10.1.1 Getting a thread dump using a profiler


    What do we do when we have a frozen app and we want to identify the problem''s
    root cause? Using a profiler to analyze the locks most likely won''t work in a
    scenario where the app, or part of it, is frozen. Instead of analyzing the locks
    during execution, as we did in chapter 9, we''ll take a snapshot of the app''s
    threads. We will read this snapshot (i.e., thread dump) and find out which threads
    are affecting each other and causing the app to freeze.


    You can obtain a thread dump either by using a profiler tool (e.g., VisualVM,
    jProfiler) or by directly calling a tool provided by the JVM command line. In
    this section, we''ll discuss how to obtain a thread dump using a profiler, and
    in section 10.1.2, we''ll learn how to get the same information using the command
    line.


    We''ll start our application (project da-ch10ex) and wait a few seconds for it
    to enter a deadlock. You''ll know the app gets into a deadlock when it no longer
    writes messages in the console (it gets stuck).


    Getting the thread dump using a profiler is a simple approach. It''s no more the
    click of a button. Let''s use VisualVM to get a thread dump. Figure 10.2 shows
    the


