  md: '# 1.2 Typical scenarios for using investigation techniques


    # 1.2.2 Clarifying certain technologies


    Another use of investigative techniques for analyzing code is learning how certain
    technologies work. Some developers joke that 6 hours of debugging can save 5 minutes
    of reading the documentation. While it''s true that reading documentation is essential
    when learning something new, some technologies are too complex to learn just from
    reading books or the specifications. I always advise my students to dive deeper
    into a specific framework or library to understand it properly.


    > TIP: For any technology (framework or library) you learn, spend some time reviewing
    the code you write. Always try to go deeper and debug the framework''s code.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_29_0.png)


    I will start with my favorite, Spring Security. At first glance, Spring Security
    may seem trivial. It''s just implementing authentication and authorization, isn''t
    it?—until you discover the variety of ways to configure these two capabilities
    into your app. You mix them wrong, and you may get in trouble. When things don''t
    work, you have to deal with what isn''t working, and the best choice to deal with
    what isn''t working is by investigating Spring Security''s code.


    More than anything, debugging helped me to understand Spring Security. To help
    others, I put my experience and knowledge into a book, Spring Security in Action
    (Manning, 2020). In it, I provide more than 70 projects for you not only recreate
    and run, but also for debug to learn various technologies.


    The second example of a technology I learned most while debugging Hibernate. Hibernate
    is a high-level framework used for implementing an app''s capability to work with
    SQL database. Hibernate is one of the best-known and most-used frameworks in the
    Java world, so it''s a must-learn for any Java developer.


    Learning Hibernate''s basics is easy, and you can do by simply reading books.
    But in the real world, using Hibernate (the how and the where) includes so more
    than the basics. And for me, digging deep into Hibernate''s code, I definitely
    wouldn''t have learned as much about this framework as I know today.


    # 1.2.3 Clarifying slowness


    Performance issues occur now and in apps, and like other problem, you need to
    investigate them before you know how to solve them. Learning the proper use of
    different debugging techniques to identify the causes of performance issues is
    vital.'
