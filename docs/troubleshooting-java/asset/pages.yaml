  md: '# # appendix D

    Understanding Java threads


    In this appendix, we''ll discuss the basics of threads in a Java app. A thread
    is an independent sequential set of instructions your app runs. Operations on
    a thread run concurrently with those on other threads. Any Java app relies on
    having multiple threads, so it''s almost impossible not to get into investigation
    scenarios where you have to more deeply understand why specific threads don''t
    do what they should or easily collaborate with other threads. That''s why you''ll
    find threads in several discussions throughout this book (especially chapters
    7 to 9, but also here and in the first half of the book when we discuss debugging).
    To properly understand these discussions, you need to know some basics about threads.
    This appendix teaches you elements that are essential for understanding other
    discussions we have throughout the book.


    We''ll start with section D.1, where I''ll remind you of the threads'' big picture
    and why we use them in apps. We''ll continue in section D.2 with more details
    on how a thread executes by discussing its life cycle. Knowing the states of a
    thread''s life cycle and the possible transitions is necessary for investigating
    any thread-related issue. In section D.3, we''ll discuss synchronization, which
    is a way to control the executing threads. Faulty synchronization implementations
    introduce most of the problems you need to investigate and solve. In section D.4,
    we''ll discuss the most common thread-related issues.


    Threads are a complex subject, so I''ll only focus on the topics you need to understand
    the techniques presented in this book. I can''t promise to make you an expert
    in the subject in only a few pages, so you''ll find a few resources I recommend
    at the end of this appendix.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# D.1 What is a thread?


    In this section, we discuss what threads are and how using multiple threads helps
    an app. A thread is an independent sequence of operations in a running process.
    A process can have multiple threads that run concurrently, enabling your app to
    solve multiple tasks, potentially in parallel. Threads are an essential component
    of how a language handles concurrency.


    I like to visualize a multithreaded app as a group of sequence timelines presented
    in Figure D.1. Notice that the app starts with one thread (the main thread). This
    thread launches other threads, which can start others, and so on. Remember that
    each thread is independent of the others. For example, the main thread can end
    its execution before the app itself. The process stops when all its threads stop.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_294_0.png)


    **Figure D.1** A multithreaded app visualized as a group of sequence timelines.
    Each arrow in the figure represents the timeline of a thread. An app starts with
    the main thread, which can launch other threads. Some threads run until the process
    ends, while others stop early. At a given time, an app can have one or more threads
    running in parallel.


    Instructions on a given thread are always in a defined order. You know that instruction
    A will happen before instruction B if instruction B is on the same thread. But
    two threads are independent of one another, you can''t say the same about two
    instructions A and B, each on a separate thread. In such a case, either A can
    execute before B, or vice versa (figure D.2). Sometimes we know that one case
    is more probable than another, but we can''t know how one flow will consistently
    execute.


    In many cases, you''ll see thread execution visually represented by tools as sequence
    timelines. Figure D.3 shows the way VisualVM (a profiler tool we use throughout
    the book) presents the thread execution as sequence timelines.'
  merge: -1
  pgno: 294
