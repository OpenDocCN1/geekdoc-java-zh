  md: '# Using Sentry team management


    Even though Sentry is a tool mainly used in auditing, monitoring, and investigating
    issues with apps, there is an alternative for it I consider quite helpful.


    As a development lead, I am both the team lead and the technical lead. Before
    the COVID-19 pandemic, when we all used to work in the office, close to each other,
    knowing someone was struggling with something was much easier for me, and vice
    versa: it was much easier to throw a ball of paper toward me to get my attention
    when they needed me. But things changed with remote, online work. One of the things
    that added delays to the team was the difficulty in communication between team
    members.


    Sentry can be configured to send emails for the events it encounters, to get emails,
    for events from local environments, to see what team members encountered. And
    since I know my team well I knew someone was stuck with a specific problem. In
    some cases, two or more team members experienced the same problem, because communication
    was flawed, they spent time investigating it.


    Using Sentry, I was able to right away and help someone before they spent too
    much time trying to investigate an error and was able to plan tasks efficiently.
    I could also stop them from working when I saw they ran over schedule or worked
    at the same time. Pretty cool, isn''t it?


    One of the things I find particularly useful is Sentry automatically collects
    details on the HTTP request in case the exception happened on a thread serving
    a request. You can use this information to replicate the problem in a development
    environment or to determine whether any of the data sent through the HTTP request
    could have caused the exception event. While Sentry doesn''t indicate the cause
    of a problem, it provides more pieces of the puzzle, helping you to quickly understand
    its root cause.


    > NOTE In many cases today, apps talk to each other HTTP, and it''s very likely
    that exception events happen as a consequence. Sentry takes the details of the
    HTTP request and associates them with the event.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_280_0.png)


    # 12.3 Using deployment tools in investigations


    One of the things I learned with time and by working on many projects is that
    environments are different and evolve. An important lesson I learned is that properly
    understanding the environment my apps run in can be tremendously helpful when
    investigating how an app behaves in a specific way. Let''s discuss how this can
    be helpful when ways of deploying service-oriented architectures and how investigating
    issues your apps might encounter: service meshes.'
  merge: -1
