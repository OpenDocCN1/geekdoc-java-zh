    # Summary


    +   - An app with capabilities that are not optimized for memory allocation can
    cause performance problems. Optimizing the app wisely allocate (avoid spending
    unnecessary memory space) the data in memory is essential to app''s performance.

    - A profiling tool allows you to sample and profile how the memory gets during
    your app''s execution. This can help you identify unoptimized parts of your app
    and provides you with details on what can be improved.

    - If new object instances are continuously added to the memory but the app removes
    the references to new instances, the GC won''t be able to delete the references
    and free the memory. When the memory gets fully occupied, the app cannot continue
    its execution and stops. Before stopping, the app throws an OutMemoryError.

    - To investigate an OutMemoryError, we use heap dumps. A heap dump collects all
    the data in the app''s heap memory and allows you to analyze it to figure out
    what went wrong.

    - You can start your app using a couple of JVM arguments to instruct it to generate
    a heap dump at a given path if the app fails with OutMemoryError.

    - You can also get a heap dump using a profiling tool or a command-line tool such
    as jmap.

    - To analyze a heap dump, load it in a profiling tool such as VisualVM, which
    allows you to investigate the instances in the dump and their relationships. This
    way, you can figure out what part of the app is not optimized or has memory leaks.

    - VisualVM offers more advanced ways to analyze the heap dump, such as OQL queries.
    OQL is a querying language similar to SQL that you use to retrieve data from a
    heap dump.'
