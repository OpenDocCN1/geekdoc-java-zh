  md: '# CHAPTER 3 Finding problem root causes using advanced debugging techniques


    You also need to pay attention when you decide to repeat particular instructions
    by dropping the frame. This approach can sometimes be more confusing than helpful.
    Remember that if you run any instruction that changes values outside of the app''s
    internal memory, you can''t change that by dropping the frame. Examples of such
    cases are (figure 3.15) as follows:


    +   - Modifying data in a database (insert, update, or delete)

    - Changing the filesystem (creating, removing, or changing files)

    - Calling another app, which changes the data for app

    - Adding a message into a queue that is read by a different app, which changes
    the data for app

    - Sending an email message


    You can drop a frame that results in committing a transaction that changes data
    in a database, but going back to a previous instruction won''t undo the changes
    made by the service, the changes resulting from the endpoint cannot be undone
    by dropping the frame. If the app sends an email message, dropping the frame cannot
    take back the message, and so on (on figure 3.15).


