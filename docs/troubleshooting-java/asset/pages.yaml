  md: 'My colleague''s statement was funny, but having such a feature in a debugger
    wouldn''t be a solution We have other ways to approach this problem. You would
    most likely narrow the possibilities of lines where you could add a breakpoint
    by using a profiler.

    A profiler is a tool you can use to identify code executes while the app is running
    (figure 1.5). This is an excellent option for any scenario because it would give
    you an idea of where to start the investigation with a debugger. We will discuss
    using a profiler in chapters 6 through 9, where you''ll learn that you have more
    options than simply observing the code in execution.


    # The sampling capability of a profiler tool shows the code in execution.


    Name


    ![](img/c89c22ff51802d920b32d2b061ce5aea_26_0.png)


    Figure 1.5 Identifying code in execution with a profiler. If you don''t know where
    to start debugging, the profiler can help you identify the code that is running
    and where of you to use the debugger.


    # SCENARIO 3: A MULTITHREADED APP


    Situations become even more complicated when dealing with logic implemented through
    multiple threads, or a multithreaded architecture. In many such cases, using a
    debugger is not an option because multithreaded architectures tend be sensitive
    to interference.


    In other words, the app behaves different when you use the debugger. Developers
    call this characteristic a Heisenberg execution or Heisenberg (figure 1.6). The
    name comes from the twentieth-century physicist Werner Heisenberg, who formulated
    the uncertainty principle, which states that you interfere with a particle, it
    behaves differently, so you cannot accurately predict both its velocity and position
    simultaneously (https://plato.stanford.edu/entries/qt-uncertainty/). A multithreaded
    architecture might change the way it behaves if you interfere with it, just like
    you interfere with a quantum mechanics particle.'
