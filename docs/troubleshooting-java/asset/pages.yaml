  md: '# # appendix E

    # Memory management in Java apps


    In this appendix, we discuss how the Java Virtual Machine (JVM) manages the memory
    of a Java app. Some of the most challenging problems you''ll have to investigate
    in Java apps are related to the way the apps manage memory. Frankly, we can use
    several techniques to analyze such problems and find their root causes, with minimal
    time invested. But to benefit from those techniques, you first need to know at
    least some basics about how a Java app manages its memory.


    An app''s memory is a limited resource. Even if today''s systems can offer a large
    amount of memory for an app to use during its execution, we still need to be careful
    with how an app spends this resource. No system can offer unlimited memory as
    a magical solution (figure E.1). Memory issues lead to performance problems (the
    app becomes slow, more costly to deploy, it starts more slowly, etc.) and some
    times can even bring the entire process to a complete stop (e.g., in the case
    of OutMemoryError).


    We cover the essential aspects of memory management. In E.1, we''ll discuss how
    the JVM organizes for an executing process. We''ll learn about three ways of allocating
    the app''s memory: the stack, the heap, and the metaspace. In E.2, we''ll discuss
    the stack, the memory space a thread uses to store locally declared variables
    and their data. Section E.3 discusses the heap and the way an app stores object
    instances in memory. We''ll end our discussion in section E.4 with the metaspace,
    a location where an app stores the object types'' metadata.


    Be aware that a Java app''s memory management is complex. In this appendix, I''ll
    present only the details you need to understand the discussions you''ll find throughout
    the book.'
