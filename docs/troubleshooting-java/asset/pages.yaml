  md: '# 12.3 Using deployment tools in investigations 269


    +   - JProfiler gives you excellent tools to observe low-level communication established
    by an app by investigating the socket events, which allows you to isolate the
    problem and determine whether the issues are related to either the communication
    channel or some part of your application.


    +   - With large, service-oriented systems, using a log-monitoring tool is an
    excellent way to observe issues and put puzzle pieces together to find a problem''s
    root cause. A log-monitoring tool is software that collects exceptional events
    in each app in the system and displays the information you need to understand
    the problem and where it comes from. Sentry is an excellent tool you can use for
    system log monitoring.


    +   - In some cases, you can take advantage of tools used to deploy apps. For
    example, if your service deployments rely on a service mesh, you can use service
    capabilities to reproduce scenarios you want to investigate. You can configure
    how other services are affected in this case.


    +   - Fault injection to simulate a service that doesn''t work properly and investigate
    how other services are affected in this case.


    +   - Mirroring to get a copy of all the requests an app sends to a replica of
    the receiver service. This replica is installed in a test environment, where you
    can investigate a scenario using debugging and profiling techniques without affecting
    the production system.'
