  md: '# 11.2 Using heap dumps to dump memory leaks


    # OBTAINING A HEAP DUMP USING A PROFILER


    Sometimes you need to get a heap dump for a running process. In this case, the
    solution is to use VisualVM (or a similar profiling tool) to generate the dump.
    Getting a heap dump with VisualVM is as easy as clicking a button. Just the Heap
    Dump button in the Monitor tab, as shown in figure 11.9.


    Click the Heap Dump button in the Monitor tab to get a heap dump. VisualVM opens
    the dump as, and you will be able to investigate it or save anywhere you want.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_249_0.png)


    Figure 11.9 Press the Heap Dump button in VisualVM''s Monitor tab to get a heap
    dump for the process. VisualVM opens the dump as, and you can further investigate
    it or save anywhere you want.


    # OBTAINING A HEAP DUMP WITH THE COMMAND LINE


    If you need to get a heap dump for a running process, but your app is deployed
    in an environment where you don''t have access to connect a profiler to it, don''t
    panic; you still have options. You can use jmap, a command-line tool provided
    with the JDK, to generate the heap dump.


    There are two steps for collecting a heap dump with jmap:


    +   1. Find the process (PID) of the running app for which you want to get the
    heap dump.

    2. Use jmap to save the dump into a file.


    To find the running-process PID, you can use jps, as we did in chapter 10:


    ```

    jps -l

    25320 main.Main

    132 jcmd/sun.tools.jps.Jps

    25700 org.jetbrains.jps.cmdline.Launcher

    ```'
