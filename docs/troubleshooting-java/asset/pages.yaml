  md: 'client needed. In many cases, investigating a slow query requires running it
    in a SQL client to observe which part of the query causes difficulty for the DBMS.


    The query is executed only once even though the method is called 10 times. The
    persistence frameworks usually do these kinds of tricks? Although they are smart,
    sometimes they do behind the scenes add complexity. Also, someone who does not
    properly understand the framework write code that causes problems. This is not
    another reason to use a profiler to check the queries the framework generates
    and make sure the app does what you expect.


    The issues I mostly encounter with frameworks that require investigation are as
    follows:


    +   * Slow queries causing latencies—Easy to spot using a profiler to examine
    the execution time

    * Multiple nested queries generated by the framework (usually caused by developers
    call the N+1 query problem)—Easy to spot using a profiler to determine the number
    of executions of a query

    * Long transaction commits generated by poor app design—Easy to spot using CPU
    profiling


    When a framework needs to get data from multiple tables, it usually to compose
    one query and get all the data in one call. However, if you don''t correctly use
    the framework, it may take just of the data with one query and then, for each
    initially retrieved, run a separate query. So, instead of running just one query,
    the framework will send one initial query plus N others (one for each of the N
    records retrieved by the first); we call this an N+1 query problem, which usually
    creates latency by using many queries instead of just one.


    Most developers seem to be tempted to work with logs or a debugger to investigate
    such problems. But, in my experience, neither is the best option to identify the
    problem''s root cause.


    The first issue with logs for this type of case is that it''s challenging to identify
    which query causes a problem. In real-world scenarios, the app may send dozens
    of queries—these multiple times, and in most cases, they are long and use a large
    number of parameters. With a profiler, which displays all the queries in a list
    with their execution time, you can instantly spot the problem. The second issue
    is, even if you identify the potential query causing the problem (say, while monitoring
    logs, you observe that the app takes a long time to execute a given query), it''s
    straightforward to take the query and run it. In the log, you find parameters
    separated from the query.


    You can configure your app to print the queries generated by Hibernate in the
    logs by adding some parameters to the application properties of the da-ch7ex3
    file:


    ```

    spring.jpa.show-sql=true

    spring.jpa.properties.hibernate.format_sql=true

    logging.level.org.hibernate.type.descriptor.sql=trace

    ```'
