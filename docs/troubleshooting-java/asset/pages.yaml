  md: '# CHAPTER 11 Finding-related issues in an app''s execution


    allocating objects will fill the memory at some point, causing the app to crash.
    In a JVM app, this is signaled with an OutOfMemoryError thrown at run time.


    If the app is not running, you have other alternatives to investigate the problem.
    You can use a heap dump, which is a snapshot of what the heap memory looked like
    when the app crashed. Although you can collect a heap dump anytime, it is most
    useful when you can''t profile the app for some reason—maybe the app crashed or
    you simply don''t have access to profile the process and you want to determine
    whether it suffers from any memory allocation issues.


    In the next section, we will discuss three ways to get a heap dump, and in section
    11.2.2, I will show you how to use the heap dump to identify memory allocation
    issues and their root causes. In section 11.2.3, we will discuss a more advanced
    way of reading a heap dump using a query language called Object Query (OQL). OQL
    is similar to SQL, but instead of querying a database, you will use OQL to query
    the data in a heap dump.


    # 11.2.1 Obtaining a heap dump


    In this section, we will discuss three ways to generate a heap dump:


    +   - Configure the application to generate one automatically in a given location
    when the app crashes because of a memory issue.

    - Use a profiling tool (such as VisualVM).

    - Use a command-line tool (such as jcmd or jmap).


    You can even get a heap dump programmatically. Some frameworks have capabilities
    to generate a heap dump, which allow developers to integrate app-monitoring tools.
    To learn more about this subject, see the HotSpotDiagnosticBean class in the Java
    official API documentation (http://mng.bz/19XZ).


    Project da-chillex1 implements an endpoint to generate a heap dump using the HotSpotDiagnosticBean
    class. Calling this endpoint using cURL or Postman will create a dump file:


    ```

    curl http://localhost:8080/jmap/heapDump?file=dump.prof

    ```


    CONFIGURING AN APP TO GENERATE A HEAP DUMP WHEN IT ENTERS A MEMORY ISSUE


    Developers often use a heap dump to investigate an app crash when they suspect
    faulty memory allocation is the cause. For this reason, apps are most configured
    to generate a heap dump of what the memory looked like when the app crashed. You
    should always configure an app to generate a heap dump when it stops due to a
    memory allocation problem. Unfortunately, the configuration is easy. You just
    need to add a couple of JVM arguments when the app starts:


    ```

    -XX:+HeapDumpOnOutOfMemoryError

    -XX:HeapDumpPath=heapdump.bin

    ```'
