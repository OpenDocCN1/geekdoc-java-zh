    # 8.4 Analyzing queries on NoSQL databases


    Applications often use relational databases, but in many cases, implementations
    need different persistence technologies. We call these NoSQL technologies, and
    apps we implement choose from a large variety of such implementations. Some of
    the best known examples are MongoDB, Cassandra, Redis, and Neo4j. Some profilers,
    such as JProfiler, can intercept queries the app sends to a NoSQL server to work
    with a database.


    JProfiler can intercept events to MongoDB and Cassandra, and these details may
    help save time when you are investigating the behavior of an app using such a
    persistence implementation. For reason, in this section, we will use a small app
    to demonstrate the use of JProfiler to observe an app''s interaction with a MongoDB
    database.


    Project da-ch8-ex works with MongoDB. The app implements a couple of endpoints:
    one stores details of products in the database and another returns a list of all
    added products. To make it simple, a product is only represented by a name and
    a unique ID.


    To follow this section, you first need to install a MongoDB server to which da-ch8-ex3
    will connect. You can download and install MongoDB Community Server from the official
    site: https://www.mongodb.com/try/download/community.


    Once you have installed the server, you can start da-ch8-ex3. We will attach JProfiler
    to the process. To begin monitoring MongoDB events, select the MongoDB database
    under Databases in the left menu and start recording. To observe how JProfiler
    presents the events, we will call the two endpoints exposes. You can call them
    using c commands (in the following snippet) or as a tool:


    ```

    curl -XPOST http://localhost:8080/product/Beer

    curl http://localhost:8080/product Get all the products in the database

    ```


    Adds a product named "Beer" to the database'
