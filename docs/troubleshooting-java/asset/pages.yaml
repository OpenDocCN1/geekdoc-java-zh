  md: '# 11.2.3 Using the SQL console to query a heap


    In this section, we''ll discuss a more advanced way of investigating a heap dump.
    We use a querying language similar to SQL to retrieve details from the heap dump.
    The simple approaches we discussed in 11.2.2 are usually enough to identify memory
    allocation problems root causes. But they aren''t sufficient when we need to compare
    the details of two or more heap dumps.


    Suppose you want to compare the heap dumps provided for two or more versions of
    an app to determine whether something faulty or unoptimized was implemented between
    the version releases. You can investigate them manually, or one will teach you
    how to write queries that you can easily run on each of them, which will save
    you time. Where OQL is an excellent approach. Figure 11.15 shows you how to change
