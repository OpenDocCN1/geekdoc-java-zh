  md: '# E.3 The heap app uses to store object instances


    problem (the memory leak). The OutOfError is signaled by the first thread that
    tries to add something in the memory but cannot because there is no free space.


    The garbage collector (GC) is the mechanism that frees the memory by removing
    unused data. The GC knows that an object instance is no longer needed when nothing
    references it. Thus, if an object isn''t needed the app fails to remove it, the
    GC won''t remove it. If an app continues to remove references to newly created
    objects until some point they fill the memory (causing an OutMemoryError), we
    say that the app has a memory leak.


    An object instance may be referred to another object in a heap (figure E.12).
    A common example of a memory leak is a collection in which we continuously add
    object references. If these references aren''t removed, then, as long as the collection
    is in the memory, the GC won''t remove them; they become a memory leak. You may
    pay special attention to static objects (object instances referred from static
    variables). These variables do not disappear once they are created, unless you
    explicitly remove them, you can assume that an object referred to a static variable
    will stay for the whole life of the process. If an object is a collection that
    refers to other objects that are never removed, it can potentially become a memory
    leak.


    +   The objects in a heap may refer to one another.

    In this case, the cat instance can''t be removed by the garbage collector until
    the reference made by the person instance is removed or the person is removed.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_319_0.png)


    Figure E.12 Any object in the heap can keep references to other objects in the
    heap. The GC can remove an object only when there no exists to it.


    An object instance can also be referred from the stack (figure E.13). Usually,
    references from the stack don''t cause memory leaks since (as discussed in section
    E.2) a stack layer automatically disappears when the execution reaches the end
    of the code block for which the app created the layer. But in specific cases,
    when combined with other issues, references from the stack can also cause trouble.
    A deadlock that keeps the execution from running through a whole block of code.
    The layer in the stack won''t be removed, and if it keeps references to objects,
    this may also become a memory leak.'
