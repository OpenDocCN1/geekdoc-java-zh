  md: '# D.2 A thread''s life cycle


    Once you visualize the thread execution, another essential aspect in understanding
    their execution is knowing the thread life cycle. Throughout its execution, a
    thread goes through multiple states (figure D.4). When using a profiler (as discussed
    in chapters 6-9) or a thread dump (as discussed in chapter 10), we''ll often refer
    to the thread''s state, which is important when trying to out the execution. Knowing
    how a thread can change from one state to another and how the thread behaves in
    each state is essential to following and investigating the app''s behavior.


    Figure D.4 visually presents the thread states and how a thread can transition
    from one state to another. We can identify the main states for a Java thread:


    +   - New—The thread is in this state right after its instantiation (before starting).
    While in this state, the thread is a simple Java object. The app can''t execute
    the instructions it defines.


    +   - Runnable—The thread is in this state after its start() method has been called.
    In this state, the JVM can execute the instructions defines. While in this state,
    the JVM will freely move the thread between two substates:


    +   - Ready—The thread doesn''t execute, but the JVM can put it in execution any
    time.


    +   - Running—The thread is in execution. A CPU currently executes instructions


    +   - Blocked—The thread was started, but it was temporarily taken out of the
    runnable state, so the JVM can''t execute its instructions. This state helps us
    to control the thread execution by allowing us to temporarily “hide” the thread
    from the JVM so that it can execute it. While blocked, a thread can be in one
    of the following substates:


    +   - Monitored—The thread is paused by a monitor of a synchronized block (object
    controlling the access to a synchronized block) and waits to be released to execute
    that block.


    +   - Waiting—During the execution, a monitor''s wait() method was called, which
    caused the current thread to be paused. The thread remains blocked until the notify()
    or notifyAll() methods are called to allow the JVM to release the execution in.


    +   - Sleeping—The sleep() method in the Thread class was called, which pauses
    the current thread for a defined time. The time is given as a parameter to the
    sleep() method. The thread becomes runnable after this time passes.


    +   - Parked—Almost the same as waiting, a thread will be parked after someone
    calls the park() method, which blocks the current thread until the unpark() method
    is called.


    +   - Dead—A thread is dead or terminated after it finishes its set of instructions,
    an Error or Exception halted it, or it was interrupted by another thread. Once
    dead, a thread cannot be started again.'
  merge: -1
  pgno: 296
