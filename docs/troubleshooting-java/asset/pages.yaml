- img_proc: true
  md: '# 12.3 Using deployment tools in investigations


    A service mesh is a way to control how different apps in a system communicate
    with one another, and they can be extremely helpful from many points of view,
    including making your apps easier to monitor and investigate when they have issues.
    The service mesh tool I use the most is Istio (https://istio.io); for more details,
    I recommend you read Istio in Action by Christian E. Posta and Rinor Malibu (Manning,
    2022).


    I''ll provide an overview of how service mesh works, and then we''ll discuss a
    couple of ways they are helpful when investigating app executions:


    +   - Fault injection—A way you can force the app communication to fail to create
    a specific scenario you need to investigate


    +   - Mirroring—A way to replicate events from a production application to investigate
    them in a testing environment


    Figure 12.12 visually shows three services deployed in a service mesh. Each service
    is accompanied by a side car that intercepts the data that app exchanges with
    other apps.


    This is the service that runs in a deployment unit.


    This is the side cart app. Any message/from the app goes through the side cart
    app.


    All services are accompanied by a side car app, which is their gate to the system.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_281_0.png)


    Figure 12.12 In a service mesh deployment, communication from and to each app
    is intercepted by a side cart app (a separate application). Since the side car
    app intercepts the data exchanges, you can configure it to log details you need
    and even alter the communication to force the system into scenarios you want to
    investigate.


    In this system design, the side cart app is a powerful element. You can configure
    it to protect the service, log the messages the service exchanges, and even redirect
    traffic of the traffic.'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'Because the side card app intercepts the communication between the service
    it''s linked to other apps, you can configure it to manage data in a way that
    is completely transparent to the service. We''ll discuss this in further sections
    12.3.1 and 12.3.2.


    # 12.3.1 Using fault injection to mimic hard-to-replicate issues


    Some of the most challenging scenarios to investigate are the ones that are hard
    to replicate in your local environment or in an environment where you have more
    access to debugging or profiling. In my experience, the environment can create
    some of the most difficult-to-replicate scenarios. Events such as the following
    can give you headaches and make investigating an app''s behavior quite challenging:


    +   * Some faulty device causes network failures.

    * Some additional software running where your app is installed makes the whole
    environment faulty or unstable.


    However, there''s something important to remember about such issues: your app
    should expect them to happen. The network is never 100% reliable, and you can''t
    trust the environment. If your app fails because of a network spike, your app
    isn''t reliable enough; don''t try to sweep the problem under someone''s rug—solve
    it!

    You need to design your apps to be robust and expect them to know how to act upon
    an external event that but designing a system in such a way is no easy job. As
    a developer, you should anticipate that, but if you have made efforts to cover
    all the bases, problems can still occur. You need to be ready to investigate where
    these problems come from and implement solutions to solve them.


    I''ve made this point multiple times throughout the book, but it repeating here:
    the best way to investigate a problem is to find a way to replicate it. Although
    some issues caused by the environment can be difficult to replicate, some scenarios
    can easily be re-created when you use a service mesh with your deployment.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_282_0.png)


    > The best way to investigate a scenario is to replicate the app''s or system''s
    behavior in a test environment.


    One of the easiest and most useful things to do is to simulate a faulty communication
    scenario. In a service-oriented or microservices system, the whole system relies
    on the apps communicate, with one another. For this reason, it is extremely important
    to be able to test what happens when a certain service in the system can be accessed.
    You need to simulate faulty behavior for testing or for investigation purposes.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# 12.3 Using deployment tools in investigations


    With a service mesh the communication to and from an app is managed by the side
    cart app, you can configure the side cart app to act abnormally, on purpose, to
    simulate faulty communication (figure 12.13). This way, you can investigate how
    the system behaves in such a case.


    +   1. Service A sends requests to service B. Want to investigate what happens
    if service B takes long to respond or doesn''t respond at all.


    +   2. To simulate this behavior in a development environment, you can configure
    the side cart app to reject the call or respond to the call more slowly.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_283_0.png)


    **Figure 12.13** You can use the side cart app of a service mesh to force the
    system into scenarios you want to investigate. Say you want to replicate a production
    case in which the communication is often disrupted between two services. You can
    easily configure a service mesh cart app to force the execution into a scenario
    to allow you to investigate.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_283_1.png)


    # 12.3.2 Using mirroring to facilitate testing and error detection


    When using service meshes, one technique you can use to replicate a problem in
    a different environment is mirroring. Mirroring is configuring the side cart app
    to send a copy of the same requests the service sends to a replica of the app
    it communicates with. This replica may run in a different environment that you
    use for testing (figure 12.14), which allows you to use the app running in the
    test environment to debug or profile the communication between services.'
  merge: -1
