    # OPENING A SOCKET TO ESTABLISH COMMUNICATION


    One thing that should draw your attention is a long execution time for the open

    socket event. Opening a socket shouldn''t take long time. If it does, this indicates
    a

    problem with the communication channel. For example, the system or virtual

    machine on which the app runs not be properly configured, or the network

    have issues. When the open socket event takes a long time, it is usually not

    cused by a problem with your code.


    # WRITING DATA THROUGH THE SOCKET OR READING DATA FROM IT


    Reading or writing data through the socket is the actual process of communication.

    the two apps are connected to each other, and they exchange data. If this operation
    is

    slow, it can be because either a large amount of data is transferred or the communica-

    tion channel is slow or faulty.'
