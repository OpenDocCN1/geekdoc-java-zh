  md: '# E.3 The heap uses you to store object instances


    In this section, we will discuss the heap: memory location shared by all threads
    of a Java app. The heap stores object instance data. As you''ll see in this section,
    the heap causes problems more often than the stack does. The root causes of heap-related
    issues are more challenging to find. We will analyze how objects are stored in
    the heap and who can keep references to them, which is relevant to understanding
    when they can be removed from the memory. Further, we will discuss the main causes
    of issues related to the heap. You need to know this information to understand
    the investigation techniques discussed in chapters 7 to 9.


    NOTE The heap has a complex structure. We won''t discuss all the heap details
    until you won''t immediately need them. We also won''t discuss details such as
    the string pool or heap generations.


    The first thing you need to remember about the heap is that it''s a memory location
    shared by all the threads (figure E.11). Not only does this allow for thread-related
    issues as race conditions to happen (discussed in appendix D), but it also makes
    memory issues more challenging to investigate. Since all the threads add the instances
    they create in the same memory location, there may impact the execution of others.
    If one thread suffers from a memory leak (which it adds instances to memory but
    never removes them), it affects the whole process because other threads also suffer
    from the lack of memory.


    In most cases, when an OutOfMemoryError occurs, as shown in figure E.11, the situation
    is signaled by a different thread than the root cause of


    One thread might suffer from a memory leak and fill the heap space.


    The heap is not unique. All threads use the same heap space.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_318_0.png)


    AnOutOfMemoryError can occur on a thread that doesn''t have issues, just because
    it was the unlucky one to try to reserve a part of the heap when no memory was
    left.


    > Figure E.11. All threads use the same heap. If the heap becomes full (memory
    leak), another thread may signal the problem. This scenario happens often because
    the problem will be reported by the first thread unable to store data in the heap.
    Because any thread can signal the problem and it''s not necessarily the one causing
    the problem, heap-related issues are more challenging to solve.'
