  md: '# CHAPTER 2 Understanding your app''s logic through debugging techniques


    # # Why the next execution line not always the next line?


    When discussing navigation with a debugger, I often talk about the "next execution
    line." I want to make sure I''m clear about the difference between the "next line"
    and the "next execution line."


    The next execution line is the line of the code it executes. When we debug paused
    execution on line 12, the next line is always line 13, but the next execution
    line can be different. For example, if line 12 doesn''t throw an exception, as
    shown in the following figure, the next execution line will be 13, if line 12
    throws an exception, the next execution line will be 18. You can find this example
    in project-da-ch2


    When using the step operation, the execution will continue to the next line.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_56_0.png)


    In this figure, we step over from line 12, and line 12 throws an exception; the
    execution continues on line 18, which is the next execution line. In other words,
    the next execution line is not always the next line.


    # ## 2.3 When using the debugger might not be enough


    The debugger is an excellent tool that can help you analyze code by navigating
    through the code to understand how it works with data. But not all code can be
    investigated with a debugger. In this section, we discuss some scenarios in which
    a debugger is possible or not enough. We should be aware of these cases so that
    you don''t waste time using a debugger.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# 2.3 When using the debugger might not be enough


    Here are some of the most often encountered scenarios when using a debugger (or
    only a debugger) is usually not the right approach:


    +   - Investigating output problems when you don''t know which part of the code
    output

    - Investigating performance problems

    - Investigating crashes where the entire app fails

    - Investigating multithreaded implementations


    > TIP Remember that a critical prerequisite for using a debugger is knowing where
    to pause the execution.


    Before you start debugging, you need to find the part of the code that is generating
    the wrong output. Depending on the app, it may be easier to find something happens
    in the implemented logic. If the app has a clean class design, it is relatively
    easy to find the part of the app responsible for the output. If the app lacks
    a class design, it may be more challenging to discover where things happen and
    thus to use the debugger. In the upcoming chapters, you''ll learn other techniques.
    Some of these techniques, such as profiling the app or using stubs, will help
    you identify where to start the investigation with a debugger.


    Performance problems are a particular of issues you usually can''t investigate
    with a debugger. Slow applications or those that stick completely are frequent
    performance issues. In most cases, profiling and logging techniques (which we
    will discuss in chapters 5–9) will help you to troubleshoot scenarios. For the
    particular instances in which the app blocks, getting and analyzing a thread dump
    is usually the most-forward investigation path. We''ll discuss analyzing dumps
    in chapter 10.


    If you encountered an issue and the execution stopped (the app crashed), you cannot
    use a debugger on it. A debugger allows you to observe the app in execution. If
    the application no longer executes, a debugger clearly won''t help. Depending
    on what happened, you might need to audit logs, which we''ll discuss in chapter
    5, or investigate heap dumps, which you''ll learn about in chapters 10 and 11.


    Most developers multithreaded implementations the most challenging to investigate.
    These implementations can be easily influenced by your interference with such
    a debugger. This interference can be a Heisenberg effect (discussed in chapter
    1): the app behaves differently when you use the debugger when you don''t interfere
    with it. As you''ll learn, you can sometimes isolate the investigation to one
    thread and use the debugger. But in most cases, you''ll have to apply a set of
    techniques that include debugging, mocking and stubbing, and profiling to understand
    the app''s behavior in the most complex scenarios.'
