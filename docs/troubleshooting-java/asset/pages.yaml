  md: '# CHAPTER 2 Understanding your app''s logic through debugging techniques


    Sometimes you need to better understand what happens with a particular instruction.
    In our example, you may need to enter the extractDigits() method to clearly understand
    what it does. For such a case, you use the step into operation. When you want
    to return to the decode() method, you can use step out.


    You can also visualize the operations on the execution stack trace, as presented
    in figure 2.14.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_52_0.png)


    Stepping closes out an investigation plan. A stack layer disappears as you return
    to the previous one. Stepping opens a new investigation plan. The execution stack
    trace becomes bigger. You go down in the stack trace.


    **Figure 2.14** The navigation operation seen from the execution stack trace point
    of view. When you step out, you go down in the stack trace and close an investigation
    plan. When you step into, you open a new investigation plan, so you go up in the
    stack trace and it becomes bigger. When stepping over, you remain in the same
    investigation plan. If the method ends (returns or throws an exception), stepping
    over closes the investigation plan, and you go down in the stack trace just as
    when you stepped out.


    Ideally, you use the step over operation as much as possible when trying to understand
    how a piece of code works. The more you step into, the more the investigation
    process becomes (figure 2.15). In many cases, you can deduct what a specific line
    of code does only by stepping over it and observing the output.


    Figure 2.16 shows the result of the step over navigation operation. The execution
    pauses on line 12, one line below where we initially paused the debugger with
    the breakpoint. The digits variable is now initialized as well, so you can see
    its value.'
