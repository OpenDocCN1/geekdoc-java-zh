  md: '# 9.2 Analyzing thread locks


    When working with an app architecture that uses thread locks, we want to make
    sure the app is optimally implemented. For that, we need a way to identify the
    locks to find how many times threads are blocked and the length of the lock time.
    We also need to understand what a thread waits in given scenarios. We can collect
    all this information however? Yes, a profiler can tell us everything we know about
    the thread''s behavior.


    We''ll continue using the same steps you learned in chapter 7 for profiling investigations:


    +   1. Use sampling at a high level what happens during execution and identify
    where to go into further detail.

    2. Use profiling (instrumentation) to get the details on a specific subject we
    want to investigate.


    Figure 9.5 shows the results of sampling the app''s execution. When looking at
    the execution times, we observe that the total time is longer than the total CPU
    time. In chapter 7, you saw a similar situation, and we figured out that this
    happens, it means the app waits for something.


    > For both, the total CPU time is much smaller than the total execution time.
    This indicates that the method was waiting for something.


    ![](img/c89c22ff51802d920b32d2b061ce5aea_200_0.png)


    Figure 9.5 When the total CPU time is shorter than the total execution time, it
    means the app is waiting for something. We want to figure out what the app waits
    for and if this time can be optimized.'
  merge: -1
