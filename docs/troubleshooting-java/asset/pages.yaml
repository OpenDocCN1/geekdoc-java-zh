- img_proc: true
  md: '# CHAPTER 1 Revealing an app''s obscurities


    Often, software developers use the word debugging for any investigation techniques;
    however, this is only one of the various tools available for examining logic implemented
    as code. While debugging should mean "finding issues and solving them," developers
    use it to name different purposes for analyzing how code works:


    +   - Learning a new framework

    - Finding the root cause of a problem

    - Understanding existing logic to extend it with new capabilities


    # 1.1 How to more easily understand your app


    First, it is important to understand what investigating code is and how developers
    do it in. In this next section, we look at several commonly encountered scenarios
    in which you can apply the techniques you''ll learn in this book.


    I define investigating code as the process of analyzing a software capability''s
    specific behavior. You might wonder, "Why such a generic definition? What is the
    investigation''s purpose?" Early in the history of software development, looking
    code had one precise purpose: finding and correcting errors (i.e., bugs). This
    is why many developers still use the term debugging for these techniques. Look
    at the way word debug formed:


    ```

    de-bug = take out, eliminate errors

    ```


    In many cases today, we still debug apps to find and correct errors. Unlike the
    early days of software development, apps today are more complex. In many cases,
    developers find themselves investigating how a particular software works, simply
    to learn a specific technology or library. Debugging is no longer only about finding
    a particular issue; it is also about correctly understanding its behavior (figure
    1.1; see also http://mng.bz/M012).


    ![](img/c89c22ff51802d920b32d2b061ce5aea_20_0.png)


    Figure 1.1 Code investigation is not only about finding problems in software.
    Today, apps are complex. We use investigation techniques to understand an app''s
    behavior or simply to learn new technologies.


    Why do we analyze code in apps?


    +   - To find a particular issue

    - To understand how a particular software capability works so we can enhance it

    - To learn a specific technology or library


    Many developers also investigate code for fun, because exploring how code works
    is fun. It can become frustrating as well, but nothing compares to the feeling
    of finding the root cause of an issue or finally understanding how things work
    (figure 1.2).'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 1.1 How to more easily understand your app


    ![](img/c89c22ff51802d920b32d2b061ce5aea_21_0.png)


    Figure 1.2 Investigating code doesn''t require much physical effort, but debugging
    sometimes makes you feel like Lara Croft or Indiana Jones. Many developers enjoy
    the unique sensation of solving the puzzle of a software issue.


    There are various investigation techniques we can apply to investigate how software
    behaves. As we''ll discuss later in the chapter, developers (especially beginners)
    wrongly consider debugging equivalent to a debugger tool. The debugger is a software
    program you can use to read and more easily understand the source code of an application,
    usually by pausing the execution on specific instructions and running the code
    step by step. It is a common way to investigate software behavior (and usually
    the first one developer learns). But it is not the only technique you can use,
    and it doesn''t help you in every scenario. We''ll discuss both standard and more
    advanced ways of using a debugger in chapters 2 and 3. Figure 1.3 presents the
    investigation techniques we''ll learn throughout this book.


    When a developer solves a bug, they spend most of their time on understanding
    a particular feature. The changes end up making sometimes reduce the problem to
    a single line of code—a missing condition, a missing instruction, or a misoperated
    operator. It''s not writing the code but understanding how the app works that
    occupies most of a developer''s time.'
  merge: -1
