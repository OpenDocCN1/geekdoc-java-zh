  md: "# D.2 A thread's life cycle\n\n# 281\n\n![](img/c89c22ff51802d920b32d2b061ce5aea_297_0.png)\n\
    \n**Figure D.4** A thread life cycle. During its life, a thread goes through multiple\
    \ states. First, the thread is new, and the JVM cannot run the instructions it\
    \ defines. After starting the thread, it becomes runnable and starts to be managed\
    \ by the JVM. The thread can be temporarily blocked during its life, and at the\
    \ end of its life goes to a dead state, from which it can't be restarted.\n\n\
    Figure D.4 also shows the possible transitions between thread states:\n\n+   -\
    \ The thread goes from new to runnable once someone calls its start() method.\n\
    - Once in the runnable state, the thread oscillates between ready and running.\n\
    - The JVM decides which thread is executed and when.\n- Sometimes, the thread\
    \ gets blocked. It can go into the blocked state in several ways:\n  - The sleep()\
    \ method in the Thread class is called, putting the current thread into a temporary\
    \ blocked state.\n  - Someone called the join() method, causing the current thread\
    \ to wait for another one.\n  - Someone called the wait() method, pausing the\
    \ execution of the current thread until the notify() or notifyAll() methods are\
    \ called.\n  - A monitor of a synchronized block paused the execution of a thread\
    \ until another active thread finished the execution of the synchronized block.\n\
    - The thread can go into a dead (terminated) state either when it finishes its\
    \ execution or when another thread interrupts it. The JVM considers transitioning\
    \ from the blocked state to the dead state unacceptable. If a blocked thread is\
    \ interrupted by another, the transition is signaled with an InterruptedException."
