  md: '# Detecting problems with JDBC connections


    even to lead to not responding at all, which makes finding the causes of such
    problems essential.


    In section 8.2, I''ll show you one of my favorite ways to understand the code
    behind a given execution scenario—simple approach using call graphs, which are
    visual representations of the dependencies between an app''s objects. I find call
    graphs helpful, especially when dealing with messy code I''ve never seen before.
    And since I''m sure most developers have to deal with messy codebases at some
    point in their careers, knowing this approach will be helpful.


    Chapter 7 discussed one of the most used ways to visualize an app''s execution
    stack. You learned how to generate an execution stack when sampling or profiling
    with VisualVM and how to use it to identify latencies. In 8.3, I''ll use a different
    representation of the execution stack—a flame graph. Flame graphs are a way to
    visualize an app''s execution that focuses on both the executed code and the execution
    time. Viewing the data from an additional perspective sometimes can help you find
    what you''re searching for. As you''ll learn in section 8.3, flame graphs offer
    you a different view of the execution, which helps you identify potential latencies
    and performance problems. In section 8.4, we''ll discuss techniques for analyzing
    how an app''s persistence layer works when it doesn''t use relational databases
    and instead uses different approaches from what we call the "NoSQL family of technologies."


    For the topics discussed in this chapter, VisualVM is not enough. VisualVM is
    an excellent tool that I use in more than 90% of the scenarios I investigate with
    a profile, but it has limitations.


    To demonstrate the features we discuss in this chapter, we''ll use JProfiler (https://www.com/),
    a licensed profiler. JProfiler provides everything we discussed with VisualVM,
    but it also has capabilities VisualVM doesn''t (for a small price). You can use
    the trial period of the software to try profiling the examples we use in this
    book and form your own opinion on the differences between VisualVM and JProfiler.


    # 8.1 Detecting problems with JDBC connections


    We discussed plenty of details about investigating with SQL queries in chapter
    7. But what about the connection an app needs with a DBMS to send the queries?
    Negligence connection management can cause problems, and in this section, we discuss
    these issues and how to find their root causes.


    Some may argue that apps uses frameworks and libraries that can care of connection
    management in most, and such problems no longer occur. However, experience tells
    me that these problems still happen, mainly because developers depend on many
    things to be automatic. We should use less common and more low-level implementations,
    instead of depending on what the framework offers, which is most of these types
    of problems occurs.


    Let me tell you story of an issue I had to deal with recently. In a particular
    service (implemented with Spring), developers had to implement a less common capability:
    a'
  merge: -1
