    In this particular case, the number of invocations doesn''t seem to cause issues:
    the method executes only once and takes 5 seconds to finish its execution. A small
    number of method invocations implies that we don''t repeated unnecessary executions
    (which, you''ll learn later in this chapter, is a common problem in many apps).


    In another scenario, you may have observed that the method call to the endpoint
    takes just 1 second, but the method (because of some poor design) called 5 times.
    Then, the problem would have been in the app, and we would know how and where
    to solve it. In 7.3, we''ll analyze such a problem.


    # 7.3 Using a profiler to identify SQL queries an app executes


    In this section, you will learn how to use a profiler to identify SQL queries
    an app sends to a DBMS. This subject is by far one of my favorites. Today, almost
    every app uses at least one relational database; and almost all encounters latency
    caused by SQL queries from time to time. Moreover, today uses fancy ways to implement
    the persistence layer; in many cases, the SQL queries that the app are created
    dynamically by a framework or library. These dynamically generated queries are
    hard to identify, but a profiler can do some magic and simplify your investigation.


    We''ll use a scenario implemented with project dach7-ex2 to learn how many times
    a method executes and intercepts a SQL query the app runs on a relational database.
    We''ll demonstrate that the executed SQL queries can be retrieved when the app
    works with a framework and doesn''t handle the queries directly. Finally, we''ll
    discuss this subject further using a couple of examples.


    # 7.3.1 Using a profiler to retrieve SQL queries not generated by a framework


    This section uses an example to demonstrate how to use a profiler to obtain the
    SQL queries an app executes. We''ll use a simple app that sends the queries directly
    to a DBMS without using a framework.


    Let''s start project dach7-ex2 and use the Profiler tab, as you learned in section
    7.2. Project dach7-ex2 is also a small app. It configures an in-memory database
    with two tables (product and purchase) and populate the tables with a few records.


    The app exposes all purchased products when calling the endpoint /purchased products.
    I mean products that have at least one purchase record in the purchase table.
    The purpose is to analyze the app''s behavior when calling this endpoint without
    analyzing the code. This way, we can see what we get just by using the profiler.


    In 7.9, we use the Profiler tab since you already learned sampling in section
    7.1, but remember that in any real-world scenario, you start with sampling. We
    start the app, and using cURL or Postman, we call the /products endpoint. The
    profiler shows us precisely what happens:


    +   - A method findPurchasedProductNames() that belongs to the Purchase-

    Controller class was called.

    - This method delegated the call to the method getProductNamesForPurchases() in
    class PurchaseService.'
