  md: '# 12.1 Investigating communication between services


    Let''s discuss how to use a profiling tool to investigate issues regarding how
    apps "talk"

    to other. We''ll use jProfiler to observe communication for a simple app (project

    da-ch12-ex1) to observe an endpoint you can call (/demo endpoint). When you send

    an HTTP request to this endpoint, the app sends a request to an endpoint exposed
    by

    httpbin.org, which delays the response for 5 seconds and responds with a 200 OK

    HTTP status.


    As you learn in this section, jProfiler offers a set of tools you can use to observe

    both the requests app receives and the requests app sends. Moreover, you can

    investigate low-level communication events on sockets. Such approaches can help
    you

    to identify the root of communication problems.


    In Section 12.1.1, we''ll use jProfiler to observe the requests app receives.
    In section

    12.1.2, we will investigate details about the requests app sends, and in section

    12.1.3, we will investigate low-level communication events on sockets.


    # Microservices


    Let''s talk about microservices. Most systems you work on claim they are

    microservices. Most often this is not true; they are simple service-oriented architect-

    entures. Microservices have become (for some reason I can''t fully understand)
    a

    brand that sells quite well:


    +   - Do you want to employ someone faster? Tell them they''re going to work with

    microservices.

    - Do you want to impress a customer during a presales meeting? Tell them you

    microservices.

    - Do you want more people to attend your presentation? You guessed it: just add
