    Figure 10.9 When only two threads block each other, it''s called a simple deadlock,
    a deadlock can be caused by multiple threads that block each other. More threads
    means more complexity. When more than two threads are involved, it''s a complex
    deadlock.


    Sometimes a complex deadlock can be confused with cascading blocked threads (figure
    10.10). Cascading blocked threads (also known as cascading locks) are a different
    issue you can spot using a thread dump. To find cascading threads, follow the
    same steps as investigating a deadlock. But instead of finding that one of the
    threads is blocked by another in the chain (in the case of a deadlock), in a cascade
    of locks, you''ll see that one of the threads is waiting for an external event,
    causing all others to wait.


    Cascading blocked threads usually signal a bad design in the multithreaded architecture.
    When we design an app with multiple threads, we implement threading to allow the
    app to process things concurrently. Having waiting for one another defeats the
    purpose of a multithreaded architecture. Although sometimes you need to make threads
    wait for one another, you shouldn''t expect long chains of threads with cascading
    locks.'
