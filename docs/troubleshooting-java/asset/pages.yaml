  md: '# 5.2 Implementing logging


    However, if you use a smaller, there''s a smaller chance the app will be affected
    while running. Logs also sometimes interfere in multithreaded apps, but they don''t
    have a big impact on the execution to change the app''s flow. Thus, they can be
    a solution for retrieving the data needed for your investigation.


    Since logs contain a timestamp (as discussed earlier in the chapter), you can
    order the log messages to find the sequence in which the operations execute. In
    a Java app, it is sometimes helpful to log the thread''s name that executes a
    particular. You can get the name of the current thread in execution using the
    following instruction:


    ```

    String threadName = Thread.currentThread().getName();

    ```


    In Java apps, all threads have a name. The developer can name them, or the JVM
    will identify the threads using a name with the pattern Thread-x, where x is an
    incremented number. For example, the first thread created will be named Thread-0;
    the next one, Thread-1; and so on. As we will discuss in chapter 10 when we address
    thread dumps, naming your app''s threads is good practice so that you can identify
    them when investigating a case.


    # 5.2 Implementing logging


    In this section, we discuss best practices for implementing logging capabilities
    in apps. To make your app''s log messages ready for investigations and avoiding
    trouble with the app''s execution, you need to take care of some implementation
    details.


    We''ll start by discussing how apps persist logs in section 5.2.1—specifically
    the advantages and disadvantages of these practices. In section 5.2.2, you''ll
    learn how to use the log messages more efficiently by classifying them by severity
    and thus make the app perform better. In section 5.2.3, we''ll discuss the problems
    log messages can cause and how to avoid them.


    # 5.2.1 Persisting logs


    Persistence is one of the essential characteristics of logging. As discussed earlier
    in this chapter, logging is different from other investigation techniques because
    it focuses more on the past than the present. We read logs to understand what
    happened, so the app needs to store them so that we can read them later. How log
    messages are stored can affect the logs'' usability and the app''s performance.
    I''ve worked with many apps and have had the chance to see various developers
    implement log persistence:


    +   - Storing logs in a nonrelational database

    - Storing logs in files

    - Storing logs in a relational database


    These can all be good choices depending on what your app does. Let''s look at
    some of the main things you need to consider to make the right decision.'
