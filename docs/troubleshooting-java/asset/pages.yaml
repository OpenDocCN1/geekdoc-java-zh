  md: '# # Using advanced visualization tools for profiled data


    This chapter covers


    +   - Detecting problems with connections to relational databases

    - Using call graphs to more quickly understand app''s design

    - Using flame graphs to more easily visualize app''s execution

    - Analyzing queries an app sends to a NoSQL database server


    In this chapter, we discuss valuable techniques that can make life easier when
    investigating specific scenarios. We start the chapter by examining an approach
    for identifying connection problems between a Java app and a relational database
    server. We already discussed profiling SQL queries in chapter 7, but sometimes
    problems appear when an app establishes communication with a DBMS. Such situations
    can'
