    # THE ARMORED AVENGER TEAMS UP WITH...


    # SPIDEY


    # #6


    MARVEL


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_0_0.png)


    # SPIDEY #6


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_4_0.png)


    MARVEL


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_4_1.png)


    # ABDOPUBLISHING.COM


    Reinforced library bound edition published in 2017 by Spotlight, a division of
    ABDO, PO Box 398166, Minneapolis, Minnesota 55439. Spotlight produces high-quality
    reinforced library bound editions for schools and libraries. Published by agreement
    with Marvel Characters, Inc.


    Printed in the United States of America, North Mankato, Minnesota.

    092016

    012017


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_5_0.png)


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_5_1.png)


    # PUBLISHER''S CATALOGING IN PUBLICATION DATA


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_5_2.png)


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_6_0.png)


    TESTS.

    I''VE BEEN TAKING A LOT LATELY.

    LIKE THIS ONE.


    Q: WHAT DO YOU DO WHEN A RADIOACTIVE SPIDER BITES YOU...


    A: ...GIVES YOU POWERS YOU''RE TOO YOUNG AND STUPID TO UNDERSTAND...


    HELP-- STOP THAT GUY!


    AND THEN WHEN YOU DO UNDERSTAND THEM, IT''S TOO LATE.


    A: YOU TAKE EVERYTHING YOU''VE LOST... .COMBINE IT WITH EVERYTHING YOU KNOW...
    AND YOU BECOME


    GRADE: A-PLUS!


    YEAH, PRETTY MUCH EVERY CLASS THAT BEGINS OR ENDS IN SCIENCE AND MATH? I CAN''T
    DO NO WRONG.


    BUT IN EVERY OTHER CLASS?


    OR, Y''KNOW, LIFE?


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_7_0.png)


    SO AWESOME.


    I''M GETTING HELP, THOUGH, I MEAN, AT SCHOOL, AT LEAST.


    MAYBE I SHOULD HIRE A LIFE COACH FOR THE LIFE STUFF?


    MY TEACHER, MR. MAXWELL, MATCHED ME UP WITH A GREAT TUTOR.


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_8_0.png)


    GWEN STACY.


    YEAH, THE GWEN STACY.

    SHE''S HELPED ME WITH HISTORY.

    AND I''VE HELPED HER WITH MATH.

    WE MAKE A PRETTY GREAT TEAM.


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_8_1.png)


    # RRRBRIIIIIIIIINNNNNG


    PHEW


    ALL RIGHT, GANG. PENCILS DOWN.

    YOU''LL KNOW YOUR FATES TOMORROW.


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_8_2.png)


    SO?

    I MEAN, I FINISHED.

    THAT''S A GOOD START.


    I''M SURE YOU DID GREAT, PETER.

    YOU HAVE, LIKE, THE WORLD''S GREATEST TUTOR.


    WORLD''S GREATEST TUTOR.

    WORLD''S GREATEST EVERYTHING.


    KEEP IT TOGETHER, PETER. PACE YOURSELF.


    I''M JUST GLAD THE LAST TEST IS OVER.

    WE''RE CLOSE TO WINTER BREAK.


    WINTER BREAK, AND BEFORE THAT?

    WINTER FORMAL THE SCHOOL DANCE.


    I DON''T HAVE A DATE AND GWEN AND FLASH, THEY''RE NOT REALLY SERIOUS.

    I CAN STILL ASK HER, CAN''T I?


    YEAH, WINTER BREAK.

    THE WINTER FORMAL IS COMING UP SO, AND THAT''S LIKE, FOR STUFF-


    I CAN''T DO THIS. I CAN''T DO THIS. I-


    C''MON, PETER. THIS IS THE REAL TEST.

    YOU CAN DO THIS. YOU CAN DO THIS.


    AAAHH!

    SPIDEY-SENSE (AWFUL) TIMING, AND ALWAYS.


    WAIT, WHAT WERE YOU SAYING, ABOUT THE--


    OH, UH, NOTHING. WAS JUST-I''M OKAY GOTTA RUN, LATE FOR DINNER.

    SEE YOU TOMORROW...


    WHY DID I ASK HER THAT LIKE IT WAS A QUESTION?

    INSTEAD OF ACTUALLY ASKING HER THE REAL QUESTION? DO YOU WANT TO GO THE WINTER
    FORMAL?


    SEE EASY. EXCEPT IMPOSSIBLE.

    I''M THE LITERAL WORST.

    YOU''RE GONNA GET A, I JUST KNOW IT!


    Q: HOW DO YOU ASK A GIRL OUT?

    A: ...GRADE: EPIC FAIL.


    WHY IS THIS SO HARD? "DO YOU WANT TO GO TO THE WINTER FORMAL?" SOUNDS EASY. IN
    MY HEAD.


    MAYBE I SHOULD TRY IT OUT LOUD.


    DO YOU WANT TO GO TO THE WINTER FORMAL?

    DO YOU! WANT TO GO TO THE WINTER FORMAL? (WORSE) (TERRIBLE) BREAK IN WHAT BUILDING
    IS THIS? WHOA, THIS IS SOME HIGH-END EQUIPMENT.


    DO YOU WANT TO GO TO THE WINTER FORMAL? I''LL PASS, THANKS.


    THE VULTURE. A.K.A. ADRIAN TOOMES. A.K.A. A DIRTY, ROTTEN THIEF. AND STEALING
    FROM TONY STARK? NOT SMART-- WOULDN''T WANT TANGLE WITH THAT BUCKET OF BOLTS.


    OUTTA MY WAY, KID. YOU JUST ASKED WHO''S THE WINTER FORMAL. WHO YOU CALLING KID?
    THANKS FOR LETTING ME DOWN.


    ONLY TAKIN'' A BEATIN'' TODAY IS.


    Q: WHY DO YOU UNDERESTIMATE MY ROGUES'' GALLERY?

    A: UM, WHO SAYS ROGUES'' GALLERY? GRADE: PARTIAL CREDIT.


    GAH! WHOA! RAZOR UP! YOUR... FACE IS A DUMMY.

    REALLY, PETER?

    SO LONG, DUMMY.

    HALT!


    SORRY ABOUT THAT, DIDN''T WANT TO MOVE. THERE''S BETTER SO GOTTA SAY HATE WITH
    JOHN JACKSON AND HIS RAG OF PAPER, BUT IT TURNS OUT... YOU ARE AMATEUR SPIDER-MAN.


    # MAKING the GRADE


    | Name | Role |

    | :--- | :--- |

    | Robbie Thompson | writer |

    | ANDRÉ LIMA ARAUJO | artist |

    | JIM CAMPBELL | letters |

    | RICH BRANSHALE & JIM CAMPBELL | colors |

    | Devin LEWIS | associate editor |

    | NICK LOWE | editor in chief |

    | JOE QUESADA | creator |

    | DAN BUCKLEY | publisher |

    | ALAN EIS | executive producer |

    | SPIDER-MAN created by STAN LEE and STEVEITIT |


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_13_0.png)


    STARK

    CAUTION

    SLIDING


    IRON MAN. TONY STARK''S BODYGUARD. AND HE THINKS I''M A MESSAGE. WAITASEC.

    I DIDN''T BREAK IN. HERE, IT WAS A VULTURE.

    AND HE''S GETTING AWAY.


    TALK TO ME, FRIDAY. SURVEILLANCE CAMERAS ARE DOWN-WIDE WIDE, MR. STARK.

    OKAY. WHAT ELSE YOU GOT?

    BASED ON HIS HEIGHT AND WEIGHT I WOULD SAY HE''S A TEENAGER.

    HIS HEART RATE IS NORMAL, SIR.

    IT WOULD APPEAR HE''S TELLING THE TRUTH.

    THEN HOW COME I CAN''T SEE HIS FACE?


    OKAY, MAKE YOU A DEAL. I WON''T HAND YOU OVER TO S.H.I.L.D.. YET.

    BUT YOU GOTTA TAKE OFF THE MASK, SO YOU CAN TALK ABOUT THIS LIKE THE GROWN-UP
    YOU ARE''T.

    THERE''S NO TIME. HE''S GETTING AWAY-- HE''S QUITE FAST, SIR.

    THANKS FOR THE UPDATE, FRIDAY.


    LOOK, IT''S BEEN A LONG DAY AND WHATNOT-SO RELATIVELY NEITHER NOT TO BLAST YOU
    OUT OF THE SKY, SO-


    YOU''RE JUST GONNA KEEP RUNNING ARE''T YOU?

    I''M NOT RUNNING. I''M CHASING.


    OKAY, BUDDY BOY, TIME FOR A LITTLE NAP.

    AND ON TOP OF THAT, I''M A HUGE FAN OF YOUR BOSS, TONY STARK.


    I WOULDN''T BREAK INTO STARK INDUSTRIES.

    FOR STARTERS I''M NOT A THIEF.

    DUDE''S A GENIUS.

    AND HEY, I WERE TO BREAK INTO STARK''S LAB, I WOULDN''T HAVE LEFT THAT BASTER
    GLOVE PROTOTYPE BEHIND. "THAT THING LOOKED BALLER."


    VULTURE DID''T GRAB THAT BASTER EITHER. HE GRABBED SPECIFIC PLANS. THIS WASN''T
    JUST A SMASH-AND-GRAB.

    VULTURE IS THE GUY YOU''RE LOOKING FOR. DON''T BELIEVE ME?


    # ASK HIM YOURSELF.


    FAIR POINTS, ESPECIALLY LIKE THE COMPLIMENT.

    OKAY, HAND IT OVER, THE BLASTER.

    AGENT COULSON, HE''S ALL YOURS.

    ALWAYS A PLEASURE, IRON MAN.


    Q: HOW DO YOU ELEVATE YOUR GAME AS SUPER HERO?

    A: TEAM UP WITH THE LEGENDARY IRON MAN!


    .ALL THE A''S. ALL OF THEM.


    AAAAAGH!


    SNAP


    SNAP


    HELP!


    THWHIP


    RISE OF THE LAND


    MY PENSION!


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_17_0.png)


    Q: HOW DO YOU FEEL ABOUT TEAMING UP?

    A: THAT ALMOST TICKLED.

    TEAM UP WITH YOU!


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_18_0.png)


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_18_1.png)


    WHAM

    GOTCHA.

    FWOSH

    OOOOOFF!


    GREAT.

    NOW HAND IT OVER.


    STARK


    FWOOSH


    ALL RIGHT, WE''RE DONE HERE.

    AND YOU''RE WELCOME FOR NOT MAKING A BARBECUED WINGS JOKE.


    WHAT THE...?!

    '
