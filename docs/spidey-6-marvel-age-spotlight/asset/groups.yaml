  mdcn: '


    噢，天哪，我是被捕了吗？


    他完全没发现。你根本不知道自己在做什么，彼得。


    你根本不知道自己在做什么，对吧？


    保持冷静。保持冷静。


    什么？不。是。你说什么？


    我懂了。我们得从某个地方开始。


    我现在是“复仇者者”了吗？


    但是——


    不。差得远了。


    我确实——


    闭嘴。


    你今天做得很好，而且你很聪明。有点让我想起——


    没错。那家伙。他是个……他是个天才。无无不晓，而且如果他在这……


    你的老板？斯塔克先生？！他是个天才！


    ……

    ……他会嘱咐你在外面注意安全。成交吗？


    是的，先生。


    等等，呃，先生，呃，伙计？


    嗯？

    你经常和斯塔克先生在一起，对吧？几乎一直都是。

    而且他，嗯，很擅长约会，对吧？那是他真正的艺术形式。


    有什么？嗯，关于约人出去，有什么建议吗？


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_22_0.png)


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_22_1.png)


    我的天哪，他真的只是个孩子。


    请善良点，先生。


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_22_2.png)


    上天青睐勇者。在你的约会对象有其他计划之前，去约吧。什么？


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_22_3.png)


    ## 市城高中，第二天


    “不得不说，帕克先生……”


    ……我对你的辅导……印象非常深刻。”


    “做得非常出色，斯泰西小姐。希望帕克先生能报答之情……”


    A+，我不敢相信！我们是个绝佳搭档，帕克。


    是的，团队。我们是一个团队。你想去参加冬季舞会吗？你想去参加冬季舞会吗？


    快吧，帕克——选一个！


    哥们。上天青睐勇者。


    谁在乎？做就完了！就---


    呃，格温？


    嗯？


    他还说了什么？


    是的……我的意思是，我当然想去…………我昨天告诉过我会和他一起去的。


    你要去吗？彼得？


    呃，不，我只是……我以为我们那天晚上可以一起学习，如果你没去，如果我们没去——


    ——，呃……明天见？


    ……好的。嘿，帕克？我们做到了……


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_25_0.png)


    “……我们通过了！——


    ……我不及格了。


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_25_1.png)


    考试。再也不要考试了。给我个可以揍的东西吧，纽约。好吗？


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_25_2.png)


    她已经约好人了，对吧？


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_25_3.png)


    什么？不。是。


    我经历过。你呢？真的吗？


    一直都是。有些时候。


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_26_0.png)


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_26_1.png)


    你揍过龙吗？什么？真的。真正的龙？


    是的，刚收到警报，有龙正试图吃掉布鲁克林。


    会很有趣的。能让你分散注意力。


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_26_2.png)


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_26_3.png)


    该如何忘记心碎？


    去找一条龙，然后把它揍了。


    这意味着我现在是“复仇者”了吗？


    闭嘴，小子。


    成绩：未完成……目前……


