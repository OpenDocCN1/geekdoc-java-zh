    # 装甲复仇者联手了...


    # 蜘蛛侠


    # #6


    MARVEL


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_0_0.png)


    # 蜘蛛侠 #6


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_4_0.png)


    MARVEL


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_4_1.png)


    # ABDOPUBLISHING.COM


    加固精装版，2017年由 Spotlight 出版，Spotlight 是 ABDO 的一个部门，邮地址：PO Box 398166, Minneapolis,
    Minnesota 55439。Spotlight 为学校和图书馆生产高质量的加固精装版。根据 Marvel Characters, Inc. 的协议出版。


    印刷于美国明尼苏达州北曼卡托。

    092016

    012017


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_5_0.png)


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_5_1.png)


    # 出版书目数据数据


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_5_2.png)


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_6_0.png)


    测试。

    我最近一直在做测试。

    就像这一个。


    Q：当一只放射性蜘蛛咬了你时，你会做什么...


    A：……它给了你由于太年轻太愚蠢而无法理解的力量……


    救命——拦住那个家伙！


    而当你真正理解这些力量时，已经太迟了。


    A：你把所失去的一切……与你所知的一切结合在一起……然后你就变成了


    等级：A+！


    是的，几乎每一个以科学和数学开头或结束的课程？我没犯过错。


    但在其他任何课上？


    或者，你懂的，生活？


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_7_0.png)


    太棒了。


    不过我得到了帮助，我的意思是，至少在学校里是。


    也许我应该为生活方面的事情请个生活教练？


    我的老师麦克斯韦先生为我引荐了一位很棒的导师。


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_8_0.png)


    格温·斯塔西。


    是的，就是格温·斯塔西。

    她帮过我的历史。

    而我帮过她的数学。

    我们是一个非常棒的团队。


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_8_1.png)


    # 嗡铃铃铃——


    呼


    好了，大家。笔下笔。

    你们明天就会知道自己的命运了。


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_8_2.png)


    所以呢？

    我的意思是，我完成了。

    这是一个很好的开始。


    我确定你做得很好，彼得。

    你是一个，世界上最棒的导师。


    最棒的导师。

    一切。


    保持冷静，彼得。控制好自己。


    我很高兴测试结束了。

    我们快要放假了。


    寒假，在那之前？

    学校舞会。


    我还没有约会对象，格温和闪电，他们并不认真。

    我还是可以问她的对吧？


    是的，寒假。

    舞会快到了了，而且——


    我不行。我做不到。我——来吧，彼得。这是真正的测试。

    你可以的。你可以的。


    啊啊！

    蜘蛛感（糟糕）的时机，总是这样。


    等等，你刚才说什么，关于——


    噢，什么也没有。我只是——得走了，赶晚饭了。

    明天见……


    为什么我问她时像是在问问题？

    而不是真的去问她？你想去舞会吗？


    看起来很容易。不可能。

    我是最差的。

    你会成功的，我直知道！


    Q：你如何约女孩出去？

    A：……等级：史诗级失败。


    为什么这么难？“你想去舞会吗？”听起来很容易。

    在我的脑子里。


    也许我应该大声试试。


    你想去舞会吗？

    （更糟了）（糟糕）是在哪栋建筑里？哇，这是一些高端设备。


    你想去舞会吗？我不打算了，谢谢。


    秃鹫。又名阿德里安·图姆斯。又名一个肮脏、腐烂的小偷。而且偷了托尼·斯克的？不聪明——不想和那堆螺丝钉纠在一起。


    让路，小子。你刚才问了舞会的事。你叫谁小子？谢谢你让我失望。


    今天只有挨打了。


    Q：你为什么低估了反派龙廊？

    A：嗯，谁说的反派龙廊？等级：部分认可。


    哇！哇！停下！你的你的……脸是个笨蛋。

    真的吗，彼得？

    再见，笨蛋。

    停！


    抱歉，那个，我不想动。与其说讨厌约翰·杰克逊和他的报纸，但结果发现……你是个业余蜘蛛侠。


    # 制作


    | 姓名 | 职位 |

    | :--- | :--- |

    | Robbie Thompson |get |

    | ANDRÉ LIMA ARAUJO | 画画 |

    | JIM CAMPBELL | 字 |

    | RICH BRANSHALE & JIM CAMPBELL | 上 |

    | Devin LEWIS | 副编辑 |

    | NICK LOWE | 总编辑 |

    | JOE QUESADA | 创作者 |

    | DAN BUCKLEY | 出版 |

    | ALAN EIS | 执行制片 |

    | 蜘蛛侠 由 STAN LEE 和 STEVE 创作 |


    ![](img/6148fe33e52baa9ce07ab021ab7c0ef2_13_0.png)


    斯塔克

    警告

    滑动


    钢铁侠。托尼·斯克的保镖。他认为我是信息。等一下。

    我不是闯入的。这里，是秃鹫。

    他正在逃跑。


    说话吧，周五。监控摄像头坏了——全覆盖的，斯塔克先生。

    好。你还有什么？

    根据他的身高体重，我认为他是个青少年。

    他的心率正常，先生。

    看起来他是在说真话。

    那为什么我看不见他的脸？


    好吧，和你做个交易。我暂时不会把你交给 S.H.I.E.L.D.。 但必须摘掉面具，这样你才能像你还没的大人那样谈论这件事。

    没时间了。他正在逃跑——他很快，先生。

    谢谢你的更新，周五。


    听着，这是漫长的一天，各种如此——相对来说没把你从天上轰下来，所以——


    你就打算一直跑下去对吗？

    我不是在跑。我在追。


    好了，伙计，是时候睡小觉了。

    而且而且，我还是你老板托尼·斯克的超级粉丝。


    我不会闯入斯塔克工业。

    首先，我不是小偷。

    那家伙是个天才。

    而且嘿，如果我闯入斯塔克的实验室，我不会留下那个大师手套原型型的。“那玩意儿看起来酷毙。”


    秃鹫也没有拿那个大师手套。他拿的是具体的计划。这不只是抢劫。

    秃鹫就是你要找的人。不信我吗？


    去问他自己吧。


