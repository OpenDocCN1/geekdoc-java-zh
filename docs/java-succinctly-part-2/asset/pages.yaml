  md: "# Chapter 3 Polymorphism\n\nPolymorphism is a term that refers to code that\
    \ might behave differently each time it is executed. There are many types of polymorphism\
    \ in programming, but the term is often used to refer to a particular mechanism\
    \ in object-oriented programming. Our objective is to define a parent class with\
    \ some method or methods, then to define multiple classes that inherit and define\
    \ different code for the methods. Then, when we execute the method using the child\
    \ classes, the child classes will perform their own specific versions of the methods.\n\
    \nIn order to illustrate how the same code can behave differently, imagine we\
    \ are creating a game (we will implement a game in the final chapter of this e-book).\
    \ In a game, there is often a virtual world populated by objects, nonplayer characters\
    \ (NPCs), and the player. Each object in the game is able to move, which means\
    \ we can create a generic GameObject class with an abstract method move (as Per\
    \ Code List 15).\n\n# Abstract classes\n\nCode 3.0: GameObject Class\n\n```\n\
    // Abstract parent class:\npublic abstract class GameObject {\n    // Abstract\
    \ method:\n    public abstract void move();\n}\n```\n\nNotice that the GameObject\
    \ class is marked with the abstract keyword. This is a safety measure—we do not\
    \ want to create any instances from the generic GameObject class, so we mark it\
    \ as abstract in order to prevent instances being created. Any class with one\
    \ or more abstract methods must be marked as abstract itself. This class has the\
    \ move method, which is abstract, so the entire class must be abstract. If you\
    \ try to create an instance of the GameObject class, Eclipse will give you an\
    \ error: Cannot because we cannot define a body for move in GameObject and remove\
    \ the abstract keywords altogether, but it may not be wise—order for an object\
    \ in our game to be useful, it must be of some specific type, not just a generic\
    \ \"nameless.\"\n\nNotice also that the move method has no body. It consists of\
    \ nothing more than a declaration with a semicolon. We are saying that there exists\
    \ another class, or classes, capable of performing the function move. We may want\
    \ to refer to instances of these other classes as GameObject objects, but they\
    \ must specify what the move method does or they themselves be abstract.\n\nLet\
    \ us now define some classes that inherit from our GameObject class. When the\
    \ NPCs move, we must execute different code when the player moves. NPCs are controlled\
    \ by the computer,"
  merge: -1
  img_proc: true
- pgno: 31
  md: "and they typically employ form of AI in order to talk to the player or wander\
    \ around a town. The player, on the other hand, is not controlled by the computer.\
    \ The player requires input from the user. So, we could create two derived classes\
    \ from our GameObject class called NPC and Player, as per Code Listings 3.1 and\
    \ 3.2.\n\n# Code Listing 3.1: NPC Class\n\n```\npublic class NPC extends GameObject\
    \ {\n    public void move() {\n        System.out.println(\"The shopkeeper wanders\
    \ around aimlessly...\");\n    }\n}\n```\n\n# Code Listing 3.2: Player Class\n\
    \n```\npublic class Player extends GameObject {\n    public void move() {\n  \
    \      System.out.println(\"It is the player's move...\");\n        // Poll the\
    \ keyboard or read the mouse movements, etc.\n    }\n}\n```\n\nIn Code Listings\
    \ 3.1 and 3.2, we have defined child classes that inherit from the GameObject\
    \ class by using the **extend** keyword. The **extends** keyword means that all\
    \ the member variables and the member methods in the GameObject class also belong\
    \ to this class. What we have created is called a class hierarchy, which is something\
    \ like a family tree. The parent class sits at the top and defines all the elements\
    \ that the lower classes inherit (see Figure 9). The lower classes describe more\
    \ specific items than the parent. In our case, the parent describes a generic\
    \ method and the child classes define what it means.\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_31_0.png)\n\
    \nFigure 9: GameObject Class Hierarchy\n\nWe can now store all the objects in\
    \ our game in a single collection, and we can iterate through the collection calling\
    \ the move methods—both are advantages derived from the class hierarchy."
