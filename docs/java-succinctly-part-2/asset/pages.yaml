    , \" + y);\n    }\n\n    // Abstract method:\n    public abstract void move();\n\
    }\n```\n\nAny classes that inherit from the GameObject class in Code Listing 3.4\
    \ will automatically have the x and y variables of their parent class. They will\
    \ also inherit the print method, which is not abstract. If we add a loop to our\
    \ main method to call print with each of our five objects (Code Listing 3.4),\
    \ each will use the only version of the print method so far defined—the parent's\
    \ print method.\n\nCode Listing 3.5: Calling the Parent's Print Method\n\n```\n\
    public class MainClass {\n    public static void main(String[] args) {\n     \
    \   // Same code as before\n\n        // Call print for all objects in the game.\n\
    \        for(int i = 0; i < 5; i++) {\n```"
