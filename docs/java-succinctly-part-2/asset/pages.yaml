  md: '![](img/d60259b161c11ca7d937b0831a48a5ef_76_0.png)


    GUI design is a very large topic and a profession of ones. But generally we should
    try to follow common conventions. Our users are familiar with thousands of layouts
    from their everyday lives—pocket calculators, food labels, applications, etc.
    Users understand these layouts, and if we want new users to understand our application
    with little effort, we should follow the principals of these layouts. The gold
    standard for a new application is that new user is able to use it without any
    instructions or manual of all. This is not possible, but it is a very good standard
    to aim for, and something we should keep in mind whenever we design software.


    Try drawing layouts on paper or using a design program and stylus. Even a project
    simple as a calculator offers many options of how we lay out our controls. Sketch
    several possible layouts for the GUI label, and ask yourself why certain patterns
    in the layouts work while others do not. In Figure 22, I have taken inspiration
    from the layout of the CASIO fx series pocket calculator, which is very popular
    and well-known—many people are familiar with it. We do not need to match the layout,
    and I have provided a space for "special function" that allow the functionality
    of our calculator to grow as we think of new features. I have also decided to
    include the arithmetic functions in a single column to save space, and I have
    increased the size of the Equals button because I believe this is particularly
    important and will be used more often than any other button.


    > Note: We will not be programming expression parsing. Our calculator will compute
    the result of a single operation, and will not include any of parentheses. If
    you are interested in programming a calculator that is capable of parsing and
    computing the result of an expression, such as "4+2/3", you should use the Shunting
    Yard algorithm and Reverse Polish. The Shunting Yard algorithm converts an expression
    into Reverse Polish notation, and it is very easy to compute the result of a Reverse
    Polish notation. For the Shunting Yard algorithm, visit Wikipedia at https://en.wikipedia.org/wiki/Shunting_yard_algorithm.
    For information on Reverse Polish, visit https://en.wikipedia.org/wiki/Reverse_Polish_notation.'
  merge: -1
