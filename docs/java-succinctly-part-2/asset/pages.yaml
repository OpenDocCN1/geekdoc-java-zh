    # Events and event listeners


    In order to make our controls functional, we need to add ActionListeners.


    ActionListeners are typically run on a separate thread from our main thread—they
    do nothing wait for the user to interact with our controls, then they call the
    appropriate method when the user does. ActionListeners repeatedly monitor the
    state of the controls and alert us to changes we are interested in, such as when
    the user clicks a button or changes the text in a text box. This is event-driven
    programming. We set up a collection of controls and assign methods that we want
    to call when specific actions occur with the controls. We do not have to specifically
    check the state of controls ourselves because Java does all of the backend code
    for you. You can check Wikipedia''s page on event-driven programming for more
    information on this fascinating topic at https://en.wikipedia.org/wiki/Event-driven_programming.


    Code Listing 6.3 shows how to implement the ActionListener interface and respond
    to the user clicking a button.'
