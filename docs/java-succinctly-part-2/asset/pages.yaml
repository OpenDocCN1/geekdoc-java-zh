  md: "# Sprite sheet class\n\nWhen we animate, we draw images of our objects in quick\
    \ succession that are slightly different from each other. For instance, an animation\
    \ of the player walking might consist of eight frames, slightly different from\
    \ the last. We could store each image of our animation in a separate image file,\
    \ but storing all the images of an animation in a single file is often more convenient.\
    \ Such images are called sprite sheets or sprite atlases.\n\nThere are many image\
    \ formats–BMP, PNG, JPG, TIFF, etc. Each format is designed for specific purposes.\
    \ The PNG is the format of choice for sprites because it is compressed, generally\
    \ smaller than a bitmap, and it allows alpha transparency. Unlike JPG (which is\
    \ also compressed), the compression for PNG images is lossless, which means we\
    \ retain the exact values of every pixel we draw in our.\n\nCode Listing 8.2:\
    \ Sprite Sheet Class\n\n```\nimport java.awt.Graphics2D;\nimport java.awt.image.BufferedImage;\n\
    import java.io.File;\nimport java.io.IOException;\nimport javax.imageio.ImageIO;\n\
    \npublic class SpriteSheet{\n    private BufferedImage bmp; // The loaded image.\n\
    \    private int spritesAcross = -1;// Number of sprites across the image.\n \
    \   private int totalSprites; // Total sprites in the image.\n    private int\
    \ spriteWidth, spriteHeight;// width/height of each sprite.\n\n    // Constructor\n\
    \    public SpriteSheet(String filename, int spriteWidth, int spriteHeight) {\n\
    \        // Load the bitmap.\n        try {\n            bmp = ImageIO.read(new\
    \ File(filename));\n        } catch(IOException e) {\n            // File not\
    \ found.\n            spritesAcross = -1;\n            return;\n        }\n  \
    \      // Save the sprite width and height.\n        this.spriteWidth = spriteWidth;\n\
    \        this.spriteHeight = spriteHeight;\n        // spritesAcross is used to\
    \ compute the\n        // source rectangles when rendering.\n        spritesAcross\
    \ = bmp.getWidth() / this.spriteWidth;\n        // totalSprites is used to ensure\
    \ we're not\n        // trying to render sprites that do not exist.)\n```"
  merge: -1
