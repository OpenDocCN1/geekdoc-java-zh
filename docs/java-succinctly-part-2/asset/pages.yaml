  md: "An interface is similar to an abstract parent class, except that it will contain\
    \ nothing but abstract methods (i.e. there are no methods specified at all in\
    \ an interface, only method names). Interfaces do not specify member variables\
    \ (though they can specify static member variables). When we derive a class from\
    \ an interface, we are saying that the derived class must perform the set of methods\
    \ specified in the interface (or the derived class must itself be an interface\
    \ or abstract class).\n\nInterfaces often describe some general aspect of a hierarchy.\
    \ Often, interfaces are introduced as some upper-abstract version of a class.\
    \ There is a subtle difference between the way an abstract class is typically\
    \ used and the way an interface is used used Interfaces describe how some particular\
    \ activity can be performed by the instances of a class rather than that the instances\
    \ can be used to perform some task. For example, an interface might describe objects\
    \ that are sortable. Many types of objects are-sorted alphabetically, playing\
    \ cards, numbers, and for example. While these objects are sortable, the each\
    \ mechanism for comparing each is different. We could implement an interface class\
    \ Comparable, meaning that any two objects that derive from the interface can\
    \ be compared and thus list of them might be sorted. Comparing and sorting objects\
    \ is very common, and Java includes an interface called Comparable.\n\n> In Java,\
    \ it is not possible to inherit from multiple parent classes. However, it is perfectly\
    \ legal to inherit from multiple interfaces.\n\nBegin a new project class Interfaces\
    \ and add the Point class in Code Listing 3.11.\n\n# Code Listing 3.11: The Point\
    \ Class\n\n```\npublic class Point implements Comparable {\n  // Member variables:\n\
