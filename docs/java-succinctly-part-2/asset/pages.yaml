    \ reverting to Eclipse's suggestions. Programming large-scale projects requires\
    \ a degree of fluency that can only be obtained through practice.\n\n# Creating\
    \ multiple packages\n\nLet's add another class in a different package and see\
    \ how we can import using the import keyword. Add a new class called `OtherClass`.\
    \ Place `OtherClass` into a package called `OtherPackage` using Eclipse's suggestion\
    \ or by adding it to the Package Explorer, as we did a moment ago with `MainClass`.\n\
