  md: "In the actionPerformed method, we want to pass the timeTotal and timeDelta\
    \ parameters to our update function by calling hpTimer.update() to ensure the\
    \ hpTimer has read the most up-to-date time, then we pass the total and delta\
    \ times to the Engine2D.update method, as in Code List 8.8.\n\n# Code List 8.8:\
    \ Updating the Timer and Passing the Times\n\n```\n// This event is called when\
    \ the timer fires at the specified fps.\npublic void actionPerformed(ActionEvent\
    \ e) {\n    // Read the up-to-date time:\n    hpTimer.update();\n\n    // Pass\
    \ HPimer's times to our update method:\n    update(hpTimer.timeTotal(), hpTimer.timeDelta());\n\
    \n    repaint();\n}\n```\n\nWe can now render our spaceship again, but this time\
    \ we will scale the ship's movement by the timeDelta. Code List 8.9 shows the\
    \ altered code. When we run the application, the ship will move at the rate of\
    \ one pixel every second. We should note our hardware's power doesn't matter here.\
    \ If a very slow computer runs this, it will take the exactly same amount of time\
    \ to reach the right edge of the screen as it would with a powerful computer—even\
    \ if the slow computer is only able to render three frames, the ship's speed will\
    \ be exactly the same. In general, when creating animations, we always want to\
    \ scale by timeDelta (which is the elapsed time since the last call to update).\n\
    \n# Code List 8.9: Very Slow Spaceship\n\n```\n// Temporary test, delete this\
