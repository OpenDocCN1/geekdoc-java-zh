  md: "# Animation class\n\nMany of the objects in our game will be rendered with\
    \ repeating animations. These animations will consist of consecutive frames from\
    \ our sprite sheet, such as the first two frames, which represent the ship. The\
    \ animations have a specific time for the frames and a start time. Code Listing\
    \ 68 shows the code for the Animation class.\n\nCode Listing 8.10: Animation Class\n\
    \n```\npublic class Animation {\n    private double speed, startTime;\n    private\
    \ int firstFrame, frameCount;\n    private int currentFrame;\n    private boolean\
    \ isComplete = false;\n    private boolean looping;\n\n    // Constructor for\
    \ looping/multiframe animation.\n    public Animation(double speed, double startTime,\
    \ int firstFrame, boolean looping) {\n        this.speed = speed;\n        this.startTime\
    \ = startTime;\n        this.firstFrame = firstFrame;\n        this.frameCount\
    \ = frameCount;\n\n        // Reset\n        currentFrame = firstFrame;\n    \
    \    isComplete = false;\n        this.looping = looping;\n    }\n\n    // Constructor\
    \ for single-frame animation.\n    public Animation(int frame) {\n        speed\
    \ = 1.0;\n        startTime = 0.0;\n        firstFrame = frame;\n        frameCount\
    \ = 1;\n        // Reset\n        currentFrame = firstFrame;\n        isComplete\
    \ = false;\n        this.looping = true;\n    }\n\n    // Compute the current\
    \ frame and the\n    // isComplete boolean.\n    public void update(double timeTotal)\
    \ {\n        double elapsedTime = timeTotal - startTime;\n        currentFrame\
    \ = (int)(elapsedTime / speed);\n\n        if(currentFrame < 0) currentFrame =\
    \ 0;\n    }\n```"
