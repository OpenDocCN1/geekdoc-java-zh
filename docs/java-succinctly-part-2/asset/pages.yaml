  md: "```\n// The only instance of this class is the following\n// private, static\
    \ instance:\nprivate static Keyboard staticInstance = null;\n\n// Private Constructor:\n\
    private Keyboard() {\n    keyStates = new boolean[256];\n}\n\n// Public init method\
    \ that creates the\n// static keys if they do not exist.\npublic static void init()\
    \ {\n    staticInstance = new Keyboard();\n    reset();\n}\n\npublic static Keyboard\
    \ getInstance() {\n    return staticInstance;\n}\n\n// Set all key states to false.\n\
    public static void reset() {\n    for(int i = 0; i < 256; i++)\n    staticInstance.keyStates[i]\
    \ = false;\n}\n\n// Test if a key is down.\npublic static boolean isKeyDown(int\
    \ keyCode) {\n    return staticInstance.keyStates[keyCode] & 255;\n}\n\n// Set\
    \ a key to down; true.\npublic void keyPressed(KeyEvent e) {\n    staticInstance.keyStates[e.getKeyCode()\
    \ & 255] = true;\n}\n\n// Set a key to up; false.\npublic void keyReleased(KeyEvent\
    \ e) {\n    staticInstance.keyStates[e.getKeyCode() & 255] = false;\n}\n\n// Extra,\
    \ unused method from KeyListener interface.\npublic void keyTyped(KeyEvent e)\
    \ { }\n```\n\nThe Keyboard consists of a static array of boolean variables. We\
    \ will use one element\nof this array for each of 256 possible keys. A value of\
    \ true will mean that a particular key is\nhold down, and a value of false will\
    \ mean it is not. In reality, there are more than 256 possible"
