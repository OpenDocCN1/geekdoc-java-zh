  img_proc: true
- pgno: 49
  md: 'Finally, the right side of Figure 10 shows a quad-core CPU. It is sometimes
    possible to split tasks into several sections, and in the diagram, we have assigned
    one of the cores of our quad-core CPU to execute a half of Tasks A or B. Execution
    of half of a task takes 2.5 seconds, and all four cores finish after approximately
    2.5 seconds. This speed represents four times the performance of the single core
    CPU.


    Figure 10 shows a hypothetical case. This is the best possible case, and in practice
    tasks do not often split in half so easily. However, you can see as the number
    of cores increases, the ability of the cores to share the workload becomes very
    useful. It is often practical to improve the performance of our applications by
    20% or even 400% by employing multithreading and by cleverly allocating our workloads
    to different cores. As we will see, particularly cores are required to communicate
    and coordinate your actions with each other, and often we do not get a straight
    100% improvement in speed when we add another core.


    Multithreading is an extremely vast and complex topic, and we will only scratch
    the very surface in this text, but you should practice your multithreading skills
    frequently because the future of computing is very heavily dependent on efficient
    multithreading.


    # # Threads


    A thread is an execution unit. For instance, when our application is run by the
    user, the JVM will create a single, main thread for us to begin executing the
    main method. It may also create several background threads for garbage collection
    (to delete unused objects beyond the scenes), and other background tasks. The
    main thread begins by executing the code from the main method, as we have seen
    many times.


    # # Call stack


    When a thread executes code, it jumps to various points in the code while it calls
    the methods. These method calls can be nested (i.e. a method can call itself;
    it can call methods). Methods may require parameters to be passed, and they can
    specify their own local variables. In order to return from methods in the correct
    order, to pass parameters to and from methods, and to keep track of the local
    variables of methods, an area of RAM is allocated called the "call stack". Each
    thread has its own call stack, and threads can potentially call any sequence of
    methods.


    Eclipse shows a simple version of the call stack when it pauses at a breakpoint.
    Figure 11 shows a screenshot of the Debug window while program runs. The information
    presented is the name of the running application class MainClass. The thread is
    called [main], and it suspended due to a breakpoint at line 18 in the Animal class
    source code. The next lines are the call stack. The program has executed the Animal.print
    method, with the method before that—the MainClass.main method (which called the
    Animal.print method).'
