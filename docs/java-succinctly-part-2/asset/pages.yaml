    \ increments 10000 times). It reports 12,672 and 13,722. It seems to report anything,\
    \ and we know why—the threads are incrementing their own copies of the shared\
    \ resource and only occasionally writing a successful update! Let's take a moment\
    \ to implement a mutex and see if we can fix the accesses to this shared resource.\n\
    \nCode Listing 5.4: Using a Mutex 1 (The Slow Way)\n\n```\npublic void run() {\n\
    \    for(int q = 0; q < 10000; q++) {\n        synchronized (counter) {\n    \
    \        counter.j++;\n        }\n    }\n\n    running = false;\n}\n```\n\nThe\
    \ second version of the run method is slightly better (Code Listing 5.4). We have\
    \ employed the synchronized keyword to lock the inside loop using the shared resource\
    \ as the key (this lock is a mutex). The synchronized keyword takes a resource\
    \ to synchronize with, and it is followed by a code block. Only one of the threads\
    \ is able to execute inside the synchronized code block at a time, therefore the\
    \ line of \"counter.j++\" is a critical section. The threads will wait until the\
    \ lock (or mutex) is released, and will turn to enter the critical section, increment\
    \ counter.j, then release the lock."
