    \ lastTime;\n    d /= 1000.0;\n\n    // If using nano time:\n    // d /= 1000000000.0;\n\
    \    return d;\n}\n\n// Return the time since the last call to reset.\npublic\
    \ double timeTotal() {\n    double d = (double) currentTime - (double) startTime;\n\
    \    d /= 1000.0;\n\n    // If using nano time:\n    // d /= 1000000000.0;\n \
    \   return d;\n}\n```\n\nCode Listing 8.6 shows the class for our timer. As our\
    \ application develops, if you find that the timer is not accurate enough, you\
    \ might want to try uncommenting the \"nano time\" lines in order to use System.nanoTime\
    \ instead of milliseconds. The class does more than read the time in milliseconds\
    \ each the update method calls, and it offers timeTotal and timeDelta methods\
    \ that return the total amount of time that has elapsed since the start of the\
