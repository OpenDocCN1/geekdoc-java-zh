  md: '# Chapter 5 Multithreading


    Multithreading is a technique for programming more than one execution unit at
    the same time. Computers traditionally run with a single CPU executing the code.
    The CPU runs through the instructions one after another, jumping to various methods.
    CPUs execute code very quickly, but there is a limit to the speed any CPU can
    execute. A modern CPU can execute billions of instructions every second, but it
    is very costly to increase this execution speed—the hardware begins to require
    extreme measures to prevent the CPU from melting or catching on fire (for instance,
    water and even liquid nitrogen have been used to cool very fast CPUs).


    Thankfully, we can greatly improve the performance of our CPUs without increasing
    the clock speed of units. Instead, manufacturers make multiple execution units
    to a single die (die is simply a word for the physical object inside the computer
    upon which the CPU is etched). The units are called cores, and each be thought
    of as being a complete CPU of its own.


    | Single Core | Dual-Core | Quad-Core |

    |---|---|---||

    | Task A: 5 seconds | | Task A 1st Half: 2.5 seconds | Task A 2nd Half: 2.5 seconds
    | Task B, 1st Half: 2.5 seconds | Task B, 2nd Half: 2.5 seconds |

    | | Task A: 5 seconds | Task B: 5 seconds | | | |

    | | Task B: 5 seconds | | | |


    Execution Time: 10 seconds Execution Time: 5 seconds Execution Time: 2.5 seconds


    Figure 10: Multithreading


    Figure 10 shows a hypothetical, best-case scenario for multicore CPUs. On the
    left, we see a single core performing two tasks. A single core executes Task A
    first, and when Task A is finished, it executes Task B. Both tasks take the CPU
    five seconds to execute, and thus the total execution time is 10 seconds.


    In the middle of Figure 10, the dual-core CPU can execute Tasks A and B at the
    same time by allowing each to be executed by one of its two cores. Each task takes
    five seconds to compute, but the tasks are executed at the same time, therefore
    they will finish at the same time, taking five seconds (plus a small amount of
    time for overhead).'
