    # ## Low-level concurrency pitfalls


    Let us take a moment to examine some important concepts and pitfalls involved
    in concurrent programming. This section might seem particularly low level, but
    not in concurrent programming makes sense unless we know why we must watch our
    step.


    In the current context, resources are variables. Shared resources are variables
    to which multiple threads can read or write. When we share variables between threads,
    we need to be careful not to allow race conditions. A race condition occurs when
    two threads potentially alter a variable at the same time. Imagine two threads
    trying to increment a shared resource that is initially set to 0. The operation
    appears trivial—we two threads to increment the variable, so the result should
    be two. The trouble is, the act of incrementing a variable is not atomic. If an
    operation is not atomic, it can be broken into several steps. These steps are
    called the Read/Modify/Write cycle. A first thread reads the current value of
    the variable from RAM, then it modifies it by performing the increment on a temporary
    copy of the variable, and finally writes the result back to the actual variable
    in RAM.


    Modern CPUs perform almost all operations on variables using a Read/Modify/Write
    cycle because they do not have the ability to perform arithmetic on the data in
    RAM. RAM does not work that way—it allows two operations: read a value at some
    address or write a value to some address. It does not allow a CPU to add two values
    together or subtract one from the other. Therefore, the CPU requests the value
    from RAM, storing a copy in its internal registers (a register is a variable inside
    the CPU). The CPU then performs the arithmetic operation on this copy and finally
    sends the results back to RAM.


    Figure 13 shows an example of a race condition. The example shows two threads
    trying to increment the shared variable from 0 to 2 at the same time. The two
    threads execute one step at a time, and the result is listed along the left side
    of the diagram. Both threads read the value of the shared variable as 0, increment
    it to 1 using their internal register, and write 1 as the result. We can see that
    the final result at time-step 4 is instead of 2. But this is not the only possibility—the
    CPU is making up the results as it schedules the threads for execution, and the
    result is out of the programmer''s control.'
