  md: "Grabbing and releasing the lock takes time. Ultimately, we want threads to\
    \ work independently for as long as possible before they synchronize. If you run\
    \ the application (and please do not) with the new version of the run method,\
    \ you may have to wait a very long time for the threads to throw the lock about\
    \ 30,000 times and increment `counter.j` all the way to 30,000. They will eventually\
    \ finish, but it could take 10 minutes or it take an hour. Code Listing 5.5 shows\
    \ a far better way of doing this.\n\n> > Note: You can also mark a method with\
    \ the synchronized keyword. When we mark a method as synchronized, we are saying\
    \ that the method can only be used by one thread at a time. However, we must be\
    \ very careful because a synchronized method actually synchronizes with the \"\
    this\" keyword as the object for the lock. That—if we have a synchronized method\
    \ in a class and we try to create multiple threads of that class, the threads\
    \ will not synchronize because each of them is using itself as the lock.\n\n#\
    \ Code Listing 5.5: Using a Mutex 2 (The Fast Way)\n\n```\npublic void run() {\n\
    \    synchronized (counter) {\n    for(int q = 0; q < 10000; q++) {\n\n      \
    \  counter.j++;\n    }\n}\n    running = false;\n}\n```\n\nIn Code Listing 5.5,\
    \ we place the lock outside the for loop. This is the only difference, but it\
    \ makes a huge difference in performance. Now, when a thread grabs the lock, it\
    \ increments `counter.j` 10,000 times before it releases the lock. This means\
    \ the lock grabs three times instead of 30,000, and the performance is far better.\n\
    \nCode Listing 5.5 might seem the obvious choice from the examples I have presented,\
    \ and in the present case. I would advise this. But the program has a big drawback—the\
    \ increments are now happening sequentially. Each one is incrementing the counter\
    \ or waiting for the lock. There is no point to incrementing a counter in this\
    \ way because the main thread can perform the increment without allocating any\
    \ new threads at. Concurrent programming is a juggling between coordinating threads\
    \ to perform independent tasks simultaneously and allowing them to synchronize/communicate\
    \ so that we avoid race conditions and the programmer remains in control of the\
    \ outcome.\n\nThis example is problematic because incrementing a counter is not\
    \ a suitable task for multithreading. Selecting which tasks in a program are suitable\
    \ for designing concurrently is one of the most important aspects of multithreading."
