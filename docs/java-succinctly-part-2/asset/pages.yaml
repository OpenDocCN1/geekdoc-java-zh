  md: 'In order to use a real-time loop, we want our update and render methods to
    be called repeatedly at some specific interval. The interval is called the frames
    per second (FPS). A higher frame rate (60 or 100 FPS) will look smoother but consumes
    more power. If the frame rate is too high, the animation may become jerky as the
    processor fails and skips frames. A lower frame rate (12 or 16 FPS) does not look
    smooth but it consumes power. There is a good chance that a lower frame rate can
    be rendered by the processor without skipping frames. One of the parameters to
    the constructor of our Engine2D is the frame rate. I have used 30 FPS for this
    value, which should look relatively smooth and run without consuming too much
    power on portable devices (and thus conserve some battery for the players of our
    game).


    We have employed a timer to call the actionPerformed method once per frame, and
    we have implemented the ActionListener class. If we perform too much computation
    or if we attempt to render too many sprites in our render method, we might not
    achieve the desired frame rate. Each time the timer ticks, the actionPerformed
    method will be called, which calls update, followed by paintComponent (which calls
    super.paintComponent to refresh the window), and render.


    > Note: Frame rates alone do not make animations smooth. Even at a very high frame
    rate, an animated object will not appear smooth to human eyes. The true key to
    creating smooth animations is to employ a technique called motion blur. That topic
    is outside of the scope of this e-book, but you should visit the page http://www.testudio.com/
    for some fantastic examples of how motion blur works and the effects of animation
    when implemented correctly.


    At the moment, the update method has two parameters, timeTotal and timeDelta,
    that do nothing. And the render method simply clears the screen to DARK_GRAY.
    After adding the Engine2D class, you should be able to test your application.
    If you do not see a dark gray screen, as in Figure 42, something has gone wrong.


    ![](img/d60259b161c11ca7d937b0831a48a5ef_99_0.png)


    Figure 42: Clearing the Screen'
