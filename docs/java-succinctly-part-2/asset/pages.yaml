  md: The examples we have seen so far show the basic syntax of an anonymous inner
    class—they do not illustrate the most common usage of this mechanism. Inner classes
    are most commonly used to provide functionality for callbacks in event-driven
    programming. We will see extensive use of inner classes in the section on GUI
    events in Chapter 7. The basic objective is to save code. We do not need to declare
    a class and create an instance to state what should occur when the user clicks
    a mouse or presses a key at the keyboard. Instead, we declare and define an anonymous
    inner class that specifies the action to be undertaken when these events occur.
    This makes our code easier to read, and shorter, because we define the functionality
    at the point where we need it (i.e. where the event is being created) instead
    of defining the functionality in some external class.
