  md: "# Chapter 4 Anonymous Classes\n\nAnonymous functions and classes appear in\
    \ the code itself. They are not declared external to the body of the calling function,\
    \ but instead are placed inline in the code, and they have no name (hence the\
    \ term anonymous). They are often used to define a functionality or a class that\
    \ is only required once at a point in the code. In order to use an anonymous class,\
    \ we must implement an interface or extend an existing class. An anonymous class\
    \ is a child class; it is an unnamed derived class that implements or extends\
    \ the functionality of a parent class. We will see extensive use of anonymous\
    \ classes in the event handling of the calculator application in Chapter 7.\n\n\
    Code List 4.0: Anonymous Inner Class vs. Class Instance\n\n```\npublic class MainClass\
    \ {\n    // Parent class\n    static class OutputLyrics {\n        public void\
    \ output() {\n            System.out.println(\"No lyrics supplied...\");\n   \
    \     }\n    }\n\n    public static void main(String[] args) {\n        // Create\
    \ a normal instance from the OutputLyrics class.\n        OutputLyrics regularInstance\
    \ = new OutputLyrics();\n\n        // Anonymous Inner Class\n        OutputLyrics\
    \ anonymousClass = new OutputLyrics() {\n            public void output() {\n\
    \                System.out.println(\"Desmond has a barrow in the market place.\"\
    );\n            }\n        };\n\n        // Call the output methods:\n       \
    \ regularInstance.output();\n\n        // And using the anonymous class:\n   \
    \     anonymousClass.output();\n    }\n}\n```"
