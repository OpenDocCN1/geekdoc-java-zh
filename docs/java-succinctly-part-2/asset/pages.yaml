  md: "# Chapter 8 2-D Game Programming\n\nJava is frequently used in 2-D game programming.\
    \ In this section, we will look at the basics for creating 2-D games using Java.\
    \ Game programming is an extremely broad and complex topic, so we will address\
    \ only some of its key concepts here. Practice is the key—you should take your\
    \ final chapter and run with it, create a platformer or an endless runner, and\
    \ explore 3-D game development and physics engines.\n\nIn this chapter, I will\
    \ use larger listings of code, and I will supply only a comparatively small amount\
    \ of explanation. One of the finest skills any programmer can develop is the ability\
    \ to read other programmers' code and see where they are wrong (or could be improved\
    \ upon). I encourage all folks who are new to programming to scour the Internet\
    \ for useful techniques. When you find a useful technique, snippet of code, make\
    \ sure the original author has allowed you to use it for your own projects, and\
    \ always make a record of where you got the code—that you can credit the original\
    \ author if you ever use the code in production programming. Feel free to use\
    \ any of the code in this e-book for whatever purpose you like!\n\n# MainClass\n\
    \nThere are many ways to set up a foundation for 2-D game programming. We want\
    \ our code to be maintainable, easy to understand, and quick to implement new\
    \ features. The difficulty in programming is not the syntax—an experienced programmer\
    \ can learn the syntax to a new language relatively easily. The difficulty is\
    \ implementing structures in such a way that our projects remain stable as the\
    \ project increases. We will create a basic MainClass does little more than an\
    \ instance of another class—the game's engine, which will be called Engine2D.\
    \ The engine will run with a simple render/update loop, and we will use Java's\
    \ facilities and event handlers to create the illusion of real-time and respond\
    \ to the keyboard.\n\nYou should create a new project. I have called my project\
    \ Graphics2D. Add a MainClass, exactly as we have done previously. The MainClass\
    \ will do little more than an instance of the engine class. The code for the MainClass\
    \ is presented in Code Listing 8.0 (please note this code will not run at this\
    \ point because we have not built the Engine2D class!).\n\n> Code Listing 8.0:\
    \ MainClass\n\n```\nimport java.awt.EventQueue;\nimport javax.swing.JFrame;\n\n\
    public class MainClass extends JFrame {\n    public static void main(String[]\
    \ args) {\n        EventQueue.invokeLater(new Runnable() {\n            @Override\n\
    \            public void run() {\n                MainClass m = new MainClass(640,\
    \ 480);\n            }\n        });\n\n```"
