    \      ---\n      continue;\n    }\n  }\n\n  // Check all baddies for collisions.\n\
    \  for(int j = 100; j < gameObjects.size(); j++) {\n    GameObject g = gameObjects.get(j);\n\
    \    // If this is a baddie:\n    if(g instanceof Baddie) {\n      // If the baddie\
    \ has hit the bullet:\n      if(o.getDistance(g) < 14) {\n        // Remove the\
    \ baddie.\n        gameObjects.remove(j);\n        ---\n      }\n    }\n  }\n\n\
    \  // If the object is a wall, or a baddie:\n```\n\nYou should be able to run\
    \ the game and shoot baddies. At this point, a score system might be added to\
    \ give the player a feeling of progress. The scoring should use an increasing\
    \ difficulty curve and deadly waves of baddies. All of these things can be implemented\
    \ easily and quickly, and I will again leave these adventures up to you.\n\nOur\
    \ game seems pretty dummy (I wouldn't play it for than a few minutes before becoming\
    \ bored and getting back to programming). However, the techniques in this chapter\
    \ are virtually identical to those we use easily to create Android games (the\
    \ Android platform runs Java programs almost exclusively). If you are interested\
    \ in developing Android applications, download and explore the Android Studio—you\
    \ will find that this IDE is very similar in many ways to Eclipse (in fact, for\
    \ a long time, Eclipse was the IDE of choice for Android developers). You will\
    \ also find the GUI tools in Android Studio very similar to those offered by Eclipse."
