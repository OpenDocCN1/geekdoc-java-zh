- pgno: 32
  md: "We can create instances of NPC Player and store them in a collection of GameObjects.\
    \ All NPCs are GameObjects, and all instances of the Player class are also GameObjects.\
    \ Code Listing 3.3 shows an example method that employs a collection of GameObjects\
    \ but that uses polymorphism to call the two different versions of move.\n\n#\
    \ Code Listing 3.3: Polymorphism\n\n```\npublic class MainClass {\n    public\
    \ static void main(String[] args) {\n        // Create 5 objects in our game.\n\
    \        GameObject[] gameObjects = new GameObject[5];\n\n        // First object\
    \ is the player.\n        gameObjects[0] = new Player();\n\n        // Other objects\
    \ are NPCs.\n        for(int i = 1; i < 5; i++) {\n            gameObjects[i]\
    \ = new NPC();\n        }\n\n        // Call move for all objects in the game.\n\
    \        for(int i = 0; i < 5; i++) {\n            gameObjects[i].move();\n  \
    \      }\n    }\n}\n```\n\nThe highlighted line in Code Listing 3.3 is an example\
    \ of polymorphism. The first time the loop iterates, the local variable i will\
    \ be set to 0, and this line will cause the method Player.move() to be called\
    \ because the first element of the gameObject array is of the Player type. The\
    \ other objects in the gameObjects array are all NPCs, which means the next iterations\
    \ of loop will call NPC.move(). The same line of code (gameObjects[i].move())\
    \ is being used to call different methods. We should understand that we did not\
    \ create instances from the GameObject class directly. We cannot do this because\
    \ the GameObject class is abstract. We created instances of the NPC and Player\
    \ classes, but then we used the generic term GameObject to store them and call\
    \ their methods.\n\nUpon running the application from Code Listing 3.3, the output\
    \ is as follows:\n\nIt is the player's move...\nThe shopkeeper wanders around\
    \ aimlessly...\nThe shopkeeper wanders around aimlessly...\nThe shopkeeper wanders\
    \ around aimlessly...\nThe shopkeeper wanders around aimlessly..."
