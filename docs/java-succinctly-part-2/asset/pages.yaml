- pgno: 13
  md: "# Code Listing 1.1: The OtherClass\n\n```\npackage OtherPackage;\n\npublic\
    \ class OtherClass {\n    public void sayHello() {\n        System.out.println(\"\
    No, say it yourself!\");\n    }\n}\n```\n\n# Code Listing 1.2: MainClass.java\n\
    \n```\npackage MainPackage;\n// Import OtherPackage.*;\nimport OtherPackage.OtherClass;\n\
    \npublic class MainClass {\n    public static void main(String[] args) {\n   \
    \     OtherClass o = new OtherClass();\n        o.sayHello();\n    }\n}\n```\n\
    \nCode Listing 1.2 shows how we can import the package OtherPackage into our MainClass,\
    \ create an object from the class, and call a sayHello method. The line that imports\
    \ the package is **import OtherPackage.OtherClass;**. We can also use the wildcard\
    \ symbol (*), to import all classes defined as the OtherPackage package with the\
    \ commented out line **import OtherPackage.*;**\n\nWe can write all the code for\
    \ a program into a single package or never specify a package at all (this would\
    \ mean all the classes in our project belong to the default package). As projects\
    \ become larger, we will typically collect algorithms and useful code that we\
    \ can tie up in a package and reuse from project to project.\n\n# Assert\n\nAssert\
    \ is a useful debugging mechanism. To **assert** a condition in Java is to ensure\
    \ that it is **true**. When we make an assertion, we are saying that if some statement\
    \ is false, terminate the application and let us know (assert is meant for debugging,\
    \ it is not designed for the end user or production code). We use **assert** to\
    \ include tests in our program. If we are careful in designing the tests throughout\
    \ our application's development, **assert** can let us know that something has\
    \ gone wrong, and it can improve our ability to maintain and debug our projects.\
    \ For the following, I have created a new project called **AssertTesting** and\
    \ added a MainClass. The code for the new class is listed in Code Listing 1.3."
  merge: -1
  img_proc: true
- pgno: 14
  md: "# Code Listing 1.3: Using Assert\n\n```\nimport java.util.Scanner;\npublic\
    \ class MainClass {\n    public static void main(String[] args) {\n        int\
    \ numerator; // Numerator for our fraction.\n        int denominator; // Denominator\
    \ for our fraction.\n        Scanner scanner = new Scanner(System.in);\n\n   \
    \     // Read a numerator.\n        System.out.println(\"Please enter a numerator:\
    \ \");\n        numerator = Integer.parseInt(scanner.nextLine());\n\n        //\
    \ Read a denominator.\n        System.out.println(\"Please enter a denominator:\
    \ \");\n        denominator = Integer.parseInt(scanner.nextLine());\n\n      \
    \  // Ensure that the denominator is not 0!\n        assert(denominator != 0);\n\
    \n        // If the passed assertion, print out some info using\n        System.out.println(numerator\
    \ + \" / \" + denominator + \" = \" + \n            (numerator / denominator)\
    \ + \" remainder \" + \n            (numerator % denominator));\n\n    }\n}\n\
    ```\n\nThe program in Code Listing 1.3 reads two integers from the user, a numerator,\
    \ and a denominator. It is designed to divide the numerator by the denominator\
    \ and output the results and remainder of the division. However, if the user inputs\
    \ 0 as the denominator, the program cannot proceed because the division by 0 is\
    \ not defined. The program uses `assert(denominator != 0)` to ensure that denominator\
    \ is not zero.\n\nNotice that the assertion has an associated boolean expression\
    \ in brackets. If the boolean expression is true, the assertion passes and the\
    \ program continues execution normally. If the expression is false (i.e, the user\
    \ typed as the denominator), the assertion fails and the program will exit. By\
    \ default, Eclipse is set to ignore assertions, and upon running the application\
    \ and inputting a denominator of 0, it will cause our program to crash. We need\
    \ to supply -ea as a command-line option to the JVM (-ea is short for enable assertions).\
    \ In order to supply command-line arguments to the program, select **Run** from\
    \ the menu, followed by **Run Configurations**. This will open the Run Configurations\
    \ dialog box, as shown in Figure 5."
  merge: -1
  img_proc: true
- pgno: 15
  md: '![](img/d60259b161c11ca7d937b0831a48a5ef_15_0.png)


    In order to turn on assertions, select the Arguments tab and type -ea to the VM
    arguments box. Do not forget to click Apply after you do this. After the -ea argument
    is passed to the VM, we can debug our application again, and Eclipse will react
    more appropriately to our assertions. In order to switch the assertions off (to
    have the JVM ignore all assertions), remove the -ea argument from the list as
    in Figure 5.


    When an assertion fails in debugging mode, the program will pause on the assertion
    and highlight it so that the programmer can examine exactly what went wrong. When
    an assertion fails in run mode, the console window will show a message that points
    the programmer to the problem assertion, and to which file the assertion failed.


    There are many command-line options available for the JVM and JVC. For more information
    on the available options, visit:


    http://docs.oracle.com/javase/7/docs/technotes/tools/windows/java.html


    http://docs.oracle.com/javase/7/docs/technotes/tools/solaris/javac.html#options'
