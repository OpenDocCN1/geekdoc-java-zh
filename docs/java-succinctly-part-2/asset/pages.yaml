    especially projects often involve many controls.


    Note: The "txt" prefix I use for my text field control is a reminder of the type
    of control. Adding a prefix to the names of your controls helps speed up development
    and maintenance. If we type "txt" in the code, Eclipse’s Content Assist will list
    all of them as long as we name all of them with the "txt" prefix. This means we
    do not need to remember the exact names of our controls, we only need to know
    their type. Content Assist will help us select the controls we need in our code.
    Likewise, we can name buttons with "btn" prefix, check boxes with "chk" prefixes,
    etc. These prefixes are completely optional and represent a programming style
    choice.'
