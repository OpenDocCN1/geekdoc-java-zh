    \n```\npublic class Player extends GameObject {\n    double shipSpeed = 320.0;\n\
    \n    public Player(double x, double y) {\n        // Set the x/y.\n        this.x\
    \ = x; this.y = y;\n\n        // Set the animation.\n        this.setAnimation(new\
    \ Animation(0.1, 0.0, 0, 2, true));\n    }\n\n    public void update(double timeTotal,\
    \ double deltaTime) {\n        // Call parent's update:\n        super.update(timeTotal,\
    \ deltaTime);\n\n        // Up/down\n        if(Keyboard.is(40)) y += shipSpeed\
    \ * deltaTime;\n        if(Keyboard.KeyDown(38)) y -= shipSpeed * deltaTime;\n\
    \n        // Left/right\n        if(Keyboard.KeyDown(37)) x -= shipSpeed * deltaTime;\n\
    \        if(Keyboard.KeyDown(39)) x += shipSpeed * deltaTime;\n\n        // Make\
    \ the player is on the screen.\n        if(x < 0) x = 0;\n        if(y < 0) y\
    \ = 0;\n        if(x > 320) x = 320.0;\n        if(y > 240) y = 240.0;\n    }\n\
    }\n```\n\nNotice that in Listing 8.23, when we use the keys, numbers such as 40,\
    \ 38. These are virtual keys, and there is a different code for each key on the\
