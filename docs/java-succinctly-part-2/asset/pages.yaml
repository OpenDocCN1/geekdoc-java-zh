- pgno: 126
  md: "keys that could be down a modern keyboard (taking into consideration languages\
    \ other than English). In game programming, we are typically interested only in\
    \ tracking keys such as the letters A to Z, digits 0 to 9, the arrow keys, space\
    \ bar, etc. So we will only store an array of 256 different keys at most, and\
    \ we will read only the lowest byte of any keys that the user hits (rather than\
    \ reading the Unicode short int—which would require an array of 2^16 different\
    \ states). When the array is created in the init method, we will reset to clear\
    \ all key states to false and ensure that the initial state of the keyboard has\
    \ no keys held down.\n\nthe keyDown method returns the current state of specified\
    \ keyCode. So, if the key is down, this method returns false. In the keyPressed\
    \ event, we read the key of the user has just pressed, limit the range of the\
    \ key from 0 to 255 with a bitwise, and we clear the corresponding state to true,\
    \ which means the key is not being held down. keyReleased is similar to keyPressed,\
    \ except that we clear the key's state to false, which means it is no longer held\
    \ down.\n\nWhen user presses a key, the keyPressed event will occur. When users\
    \ release a key, the keyReleased event will occur. And, when users type a key,\
    \ the keyTyped event will occur. Note that the keyTyped responds repeatedly if\
    \ the user holds the key, but we do not need this event in our game. However,\
    \ we must provide it as it is required by the KeyListener interface.\n\nNext,\
    \ we need to add a keyListener to our MainClass. The updated constructor for the\
    \ MainClass is listed in Code 8.22. A keylistener is any class that implements\
    \ the KeyListener interface.\n\n> Code 8.22: Initializing the Keyboard in the\
    \ MainClass\n\n```\nprivate MainClass(int windowwidth, int windowHeight) {\n \
    \   setSize(windowwidth, windowHeight);// Set window size.\n    setLocationRelativeTo(null);\
    \ // Default location.\n    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE); //\
    \ Exit on close.\n    setVisible(true);\n\n// Init the static singleton keyboard:\n\
    \    Keyboard.init();\n\n// Add a keylistener.\n    addKeyListener(Keyboard.getInstance());\n\
    \n// Create and add the engine JPanel\n    final Engine2D engine = new Engine2D(windowWidth,\
    \ windowHeight, 300);\n    add(engine);\n}\n```"
