- pgno: 50
  md: "# Figure 11: Debug Window\n\nIn Java, threads are resource-heavy. It takes\
    \ time for the system to create and run a new thread, creating a new thread results\
    \ in the allocation of other system resources (such as RAM for the stack call).\
    \ We should never attempt to create and kill threads within a tight loop. Thread\
    \ creation is slow, and the number of threads a system can concurrently execute\
    \ is limited by the physical hardware (i.e. the number of cores in the system,\
    \ the amount of RAM, the speed of the CPU, etc.). There are several methods by\
    \ which multiple threads are created in Java, and we will look at two—implementing\
