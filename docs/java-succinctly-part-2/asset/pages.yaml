    \nFigure 8.17: Stars, Walls, and Baddies\n\n# Reading the keyboard\n\nBefore we\
    \ add our hero's spaceship, we need to implement a method for controlling it.\
    \ Let's now look at how to respond to events caused by the user pressing and holding\
    \ keys on the keyboard. In order to allow our application to respond to input\
    \ from the keyboard, add a new class called **Keyboard** that implements the **KeyListener**\
    \ interface.\n\nThe **Keyboard** class in Code Listing 8.21 is an example of a\
    \ singleton. This means we will design a single class and never create multiple\
    \ instances from the class. A singleton class can be designed in Java in many\
    \ ways. I have marked the constructor as **private**, which prevents instances\
    \ of the class from being created (instead, we will call **Keyboard.init** to\
    \ initialize the singleton—using this approach is sometimes called a Factory Pattern).\
    \ Note also—the methods of this class and the key array are all static. They belong\
    \ to the class rather than an instance of it. This effectively means that the\
    \ **Keyboard** class exists as a single, static object. We cannot create nor interact,\
    \ we interact with the class itself.\n\n> Code Listing 8.21: Keyboard Class\n\n\
    ```\nimport java.awt.event.KeyEvent;\nimport java.awt.event.KeyListener;\n\npublic\
    \ class Keyboard implements KeyListener {\n    // 256 key states: true means the\
    \ key is down\n    // false means the key is up.\n    private boolean[] keyStates\
    \ = null;\n```"
