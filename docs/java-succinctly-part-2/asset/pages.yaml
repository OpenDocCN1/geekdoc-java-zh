    # Escape sequences


    Before we go any further, let''s take a brief detour into escape sequences. When
    we print text to the screen, sometimes we need to use special symbols to add new
    lines, tabs, or characters that would otherwise escape the string (i.e. printing
    the double-quote character: \""). Escape sequences can be used anywhere in Java
    that writes strings to the screen or a file. This includes `System.io` and the
    `PrintWriter.println`. Table 1 shows the escape sequences in Java.


    > Note: Escape sequences are not inherent to strings. There is nothing about "\t"
    that makes the JVM print a tab character by itself. Escape sequences are a programmed
    behavior in some of the methods that deal with strings (such as println).


    Table 1: Escape Sequences


    | Escape Sequence | Meaning |

    | --- | --- |

    | \t | Tab |

    | \b | Backspace |

    | \n | New Line |

    | \r | Carriage Return |'
