- pgno: 9
  md: '# Introduction


    This is the second e-book in the two-part series Java Succinctly. If you have
    not read the first book, Java Succinctly Part 1, and if you are not familiar with
    the basics of the Java language, I strongly recommend you read that e-book first.
    In this volume, we will concentrate on more advanced features of Java, including
    multithreading, building GUI applications, and 2-D graphics/game programming.
    Code samples can be found here.


    Programming computers requires a lot of practice, which means we will inevitably
    make mistakes and unintentionally cause our programs to crash, hang, and otherwise
    behave in ways that would make you an end user. I recommend that you copy and
    paste the code samples here to get an overview of how things work. Then, go ahead
    and change things later—add new functionality and features to the programs (particularly
    the Calculator and Space Game applications presented in Chapters 7 and 8). This
    will give you good insight into a computer programmer''s power. Remember that
    100 years ago, there was nobody on Earth who could sensibly demand a billion computations
    to be performed in one second, yet this is trivial for a modern computer programmer.
    We do it all the time!


    Test your programs constantly, and use the debugging features of the IDE (assert,
    which we will look at in this book), variable watches, and breakpoints, etc. Save
    your projects very frequently, too.


    Without further ado, let us explore some of the powerful and practical features
    of Java!'
  merge: -1
  img_proc: true
