    # Concurrency


    The point above not knowing the exact order of execution is important! When we
    look at the code from Code Listings 5.0 and 5.1, we cannot tell what will happen.
    Ned could count faster, or Kelly could count faster (the two will count at approximately
    one second per number, but on the nanosecond level, one will always beat the other).


    The two threads could count randomly—they could swap leader every number, so that
    each time we execute the application, we get a different output. Ned and Kelly
    are called "concurrent." If you determine in which order the threads will execute
    simply by looking at the code, then the code is concurrent. It is never safe to
    assume an order of execution for concurrent threads (fact, concurrency means we
    cannot assume the order!). We must be careful when we coordinate concurrent threads.
    We cannot tell what happen when we look at the code because the CPU is so complicated—it
    is executing the operating system and hundreds of background tasks. It executes
    times-slices of each thread and switches the background processes on and off the
    physical cores. Somewhere, in this mess of instructions, our humble Ned and Kelly
    threads will be given some time to execute on a core, then they are put to sleep
    for some other program to execute the core. We have no practical way of guessing
    in which our threads will execute, thus our threads are concurrent. Generally,
    we hope the CPU is not too busy executing background tasks, and when we create
    threads, we aim for them to be executed in their entirety, uninterrupted and simultaneously,
    but we cannot guarantee that this will happen.


    # Thread coordination


    When the threads that we perform are completely independent, the algorithm is
    called embarrassingly parallel. Embarrassingly parallel algorithms are the best-case
    scenario for multithreading where we can split the workload and threads do not
    need to communicate or synchronize in any way. This means each thread can perform
    its assigned task as quickly as possible without interruptions and without worrying
    about what other threads are doing. In real-world applications, many algorithms
    do not split perfectly into two or more parts. The workload of each thread is
    typically not 100% independent from that of the other threads. Threads need to
    communicate.


    In for one thread to communicate with another, the needs a shared resource. Imagine
    Ned and Kelly wish to perform two tasks—BoWater and PourCoffee. The problem is'
