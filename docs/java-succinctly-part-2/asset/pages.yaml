  md: "```\ngameObjects[i].print();\n}\n}\n```\n\nThe output from Code Listing 3.5\
    \ is as follows:\n\n```\nPosition: 0, 0\nPosition: 0, 0\nPosition: 0, 0\nPosition:\
    \ 0, 0\n```\n\nHowever, if we define a print method with the same signature as\
    \ the parent's method in one of the child classes, we will see that the child\
    \ classes can override the parent's method. Code Listing 3.6 shows the same code\
    \ as the original Player class, except that this time I have overridden the parent's\
    \ print method.\n\n# Code Listing 3.6: Overriding a Parent's Method\n\n```\npublic\
    \ class Player extends GameObject {\n    public void move() {\n        System.out.println(\"\
    It is the player's move...\");\n        // Poll the keyboard or read the mouse\
    \ movements, etc.\n    }\n\n    @Override\n    public void print() {\n       \
    \ System.out.println(\"Player position: \" + x + \", \" + y);\n    }\n}\n```\n\
    \nFirst, notice that the @Override annotation is optional. The print method in\
    \ the Player class of Code Listing 3.6 has exactly the same name as the parent's\
    \ print method and exactly the same arguments and return type. Now, when we run\
    \ our main method, we will see that the Player object calls its own version of\
    \ print, while the NPC objects (which do not define a specific version of the\
