    \ g) {\n        // Clear the screen\n        g.setBackground(Color.DARK_GRAY);\n\
    \        g.clearRect(0, 0, width, height);\n    }\n\n    private void update(double\
    \ timeTotal, double timeDelta) {\n    }\n\n    private void render(Graphics2D\
    \ g) {\n    }\n}\n```\n\nIn order to use a real-time loop, we want our update\
    \ and render methods to be called repeatedly at some interval. The interval is\
    \ called the frames per second (FPS). A higher frame rate (60 or 100 FPS) will\
    \ look smoother but consumes more power. If the frame rate is too high, the animation\
    \ may become jerky as the processor fails and skips frames. A lower frame rate\
    \ (12 or 16 FPS) does not look smooth but it consumes power. There is a good chance\
    \ that a lower frame rate can be rendered by the processor without skipping frames.\
    \ One of the parameters to the constructor of our Engine2D is the frame rate.\
    \ I have used 30 FPS for this value, which should look relatively smooth and run\
    \ without consuming too much power on portable devices (and thus conserve some\
    \ battery).\n\nWe have employed a timer to call the actionPerformed method once\
    \ per frame, and we have implemented the ActionListener class. If we perform too\
    \ much computation or if we attempt to render too many sprites in our render method,\
    \ we might not achieve the desired frame rate. Each time the timer ticks, the\
    \ actionPerformed method will be called, which calls update, followed by paintComponent\
    \ (which calls super.paintComponent to refresh the window), and render.\n\n> Note:\
    \ Frame rates alone do not make animations smooth. Even at very high frame rate,\
    \ an animated object will not appear smooth to human eyes. The true key to creating\
    \ smooth animations is to employ a technique called motion blur. That topic is\
    \ outside of the scope of this e-book, but you should visit the page http://www.testudio.com/\
    \ for some fantastic examples of how motion blur works and the effects of animation\
    \ when implemented correctly.\n\nAt the moment, the update method has two parameters,\
    \ timeTotal and timeDelta, that do nothing. And the render method simply clears\
    \ the screen to DARK_GRAY. After adding the Engine2D class, you should be able\
    \ to test your application. If you do not see a dark gray screen, as in Figure\
    \ 42, something has gone wrong.\n"
  mdcn: "\n\n在本电子书的剩余部分，我们将注意力转向一种完全不同的编程类型——二维图形和游戏编程。\n\n## 第 8 章 二维游戏编程\n\nJava\
    \ 经常被用于二维游戏编程。在本节中，我们将介绍使用 Java 创建二维游戏的基基础知识。游戏编程是一个极其广泛且复杂的话题，因此我们在这里只介绍一些核心概念。实践是关键——你应该利用最后一章的内容进行实践，创建一个平台跳跃游戏或无尽跑酷游戏，并探索三维游戏开发和物理引擎。\n\
    \n在本章中，我将使用较长的代码列表，并只提供相对少量的解释。任何程序员能培养的最优秀技能之一，就是阅读其他程序员代码并发现他们错误之处（或可以改进之处）的能力。我鼓励所有编程初学者在互联网上搜索实用的技术。当你发现一个实用的技术或代码段时，请确保原作者已允许你将其用于自己的项目，并始终记录代码的来源——这样如果你在生产环境编程中使用该代码，就可以注明原作者。你可以随时根据自己的需要，出于任何目的使用本电子书中的任何代码！\n\
    \n### MainClass\n\n搭建二维游戏编程的基础有许多方法。我们希望代码是可维护的、易理解的且能够快速实现功能的。编程的难度不在于语法——丰富的程序员可以相对容易地学习新语言的语法。难度在于如何实现结构，使得我们的项目在规模扩大时保持稳定。我们将创建一个基础的\
    \ `MainClass`，它的作用无非是实例化另一个类——游戏引擎，将其命名为 `Engine2D`。引擎将通过一个简单的渲染/更新循环运行，我们将使用\
    \ Java 的功能和事件处理器来创建实时幻觉并响应键盘。\n\n你应该创建一个新项目。我将我的项目命名为 Graphics2D。按照之前的做法添加一个 `MainClass`。`MainClass`\
    \ 仅仅是引擎类的实例。`MainClass` 的代码见代码列表 8.0（请注意，由于代码目前无法运行，因为我们还没有构建 `Engine2D` 类！）。\n\
    \n> 代码列表 8.0: MainClass\n\n```java\nimport java.awt.EventQueue;\nimport javax.swing.JFrame;\n\
    \npublic class MainClass extends JFrame {\n    public static void main(String[]\
    \ args) {\n        EventQueue.invokeLater(new Runnable() {\n            @Override\n\
    \            public void run() {\n                MainClass m = new MainClass(640,\
    \ 480);\n            }\n        \n```\n\n```java\n));\n}\nprivate MainClass(int\
    \ windowWidth, int windowHeight) {\n    setSize(windowWidth, windowHeight); //\
    \ 设置窗口大小\n    setLocationRelativeTo(null); // 默认位置\n    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\
    \ // 关闭时退出\n    setVisible(true);\n    // 创建并添加 JPanel\n    final Engine2D engine\
    \ = new Engine2D(windowWidth, windowHeight);\n    add(engine);\n}\n}\n```\n\n\
    `MainClass` 继承自 `JFrame` 并作为应用程序窗口。`MainClass` 包含一个方法，该方法创建一个新的 `MainClass m`\
    \ 实例，并使用 `EventQueue.invokeLater` 使用新线程执行该实例。这意味着我们的游戏将拥有自己的线程和事件队列。`MainClass`\
    \ 的构造函数接收 `windowWidth` 和 `windowheight` 参数，这将是我们的窗口的大小。设置窗口后，`MainClass` 创建了一个\
    \ `Engine2D` 实例，该实例本质上是一个自定义的 `JPanel` 对象，并将其添加到面板中。\n\n### 二维引擎骨架\n\n接下来，我们将实现\
    \ `update` 和 `render` 方法。我们使用 `Engine2D` 类。方法 8.1 显示了 `Engine2D`。\n\n> 代码列表 8.1:\
    \ Engine2D\n\n```java\nimport java.awt.Color;\nimport java.awt.Graphics;\nimport\
    \ java.awt.Graphics2D;\nimport java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\n\
    import javax.swing.JPanel;\nimport javax.swing.Timer;\n\npublic class Engine2D\
    \ extends JPanel implements ActionListener {\n    private int width, height;\n\
    \n    // 构造函数\n    public Engine2D(int windowWidth, int windowHeight) {\n    \
    \    width = windowWidth;\n        height = windowHeight;\n        Timer timer\
    \ = new Timer(1000/fps, this);\n        timer.start();\n    }\n\n    // 此事件\n\
    \    public void actionPerformed(ActionEvent e) {\n        repaint();\n    }\n\
    \n    @Override\n    protected void paintComponent(Graphics g) {\n        // 清除屏幕\n\
    \        g.setBackground(Color.DARK_GRAY);\n        g.clearRect(0, 0, width, height);\n\
    \    }\n\n    private void update(double timeTotal, double timeDelta) {\n    }\n\
    \n    private void render(Graphics2D g) {\n    }\n}\n```\n\n为了使用实时循环，我们希望 `update`\
    \ 和 `render` 方法在某些间隔内被重复调用。这个间隔被称为每秒帧（FPS）。较高的帧率（60 或 100 FPS）看起来会更流畅，但会消耗更多功率。如果帧率过高，由于处理器无法跟上并导致跳帧，动画可能会变得卡顿。较低的帧率（12\
    \ 或 16 FPS）看起来不流畅，但它消耗的电较少。很大概率处理器可以在不跳帧的情况下渲染较低的帧率。`Engine2D` 构造函数的参数之一是帧率。我使用了\
    \ 30 FPS 作为该值，这看起来应该是流畅的且不会在便携设备上消耗过多的电量。\n\n我们使用定时器每帧调用一次 `actionPerformed` 方法，并实现了\
    \ `ActionListener` 类。每当定时器跳动时，都会调用 `actionPerformed` 方法，然后调用 `update`，随后是 `paintComponent`（调用\
    \ `super.paintComponent` 刷新窗口），以及 `render`。\n\n> 注意：单靠帧率并不能让动画变得流畅。即使在很帧率下，动画物体在人类看来也并不流畅。创建流畅动画的关键在于使用一种称为运动模糊的技术。该主题超出了本电子书的范围，但你应该访问页面\
    \ http://www.testudio.com 查看关于运动模糊工作原理以及正确实现动画效果的绝佳示例。\n\n目前，`update` 方法有两个参数\
    \ `timeTotal` 和 `timeDelta`，但没有执行任何操作。而 `render` 方法只是将屏幕清除为 `DARK_GRAY`。在添加 `Engine2D`\
    \ 类后，你应该能够测试你的应用程序。如果你没有看到深灰色屏幕（如图 42 所示），说明出现了问题。\n\n"
