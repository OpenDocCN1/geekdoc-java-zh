  - "[PAGE 110]\n\n# Timing and frame skipping\n\nMany computing devices could move\
    \ different hardware, and each hardware has a specific performance—some devices\
    \ are faster than others. In order to make our games run at a smooth, consistent\
    \ rate, we need to move our sprites so they appear to move at the same speed regardless\
    \ of the hardware. We can do this by employing a technique called frame skipping.\n\
    \nA fast computer might be capable of rendering four frames in a short amount\
    \ of time, and a slower computer might render only two frames in the same amount\
    \ of time. However, our objects must move the same distance despite the number\
    \ of frames. The faster computer might render frames more smoothly, but the game\
    \ play must appear to run at the same speed. One way to achieve this effect is\
    \ to scale the movement of our objects by the amount of time that has elapsed\
    \ since the last call to update. We will include a new class HPTimer (short for\
    \ High-Precision Timer) that accurately records the amount of time passing so\
    \ that we can use it in our call to the update method. Create the HPTimer class\
    \ and add the code to Code Listing 8.6.\n\nCode Listing 8.6: HPTimer Class\n\n\
    ```\npublic class HPTimer {\n    // Member variables\n    long startTime, lastTime,\
    \ currentTime;\n\n    // Set the start, last and current times to now:\n    public\
    \ void reset() {\n        startTime = System.currentTimeMillis();\n\n        //\
    \ You can also use nano time:\n        startTime = System.nanoTime();\n\n    \
    \    lastTime = startTime;\n        currentTime = startTime;\n    }\n\n    //\
    \ Reset the timer.\n    public void start() {\n        reset();\n    }\n\n   \
    \ // Record the current time.\n    public void update() {\n        lastTime =\
    \ currentTime;\n        currentTime = System.currentTimeMillis();\n\n        //\
    \ If using nano time:\n        currentTime = System.nanoTime();\n    }\n\n   \
    \ // Return the time since the last call to update.\n```"
