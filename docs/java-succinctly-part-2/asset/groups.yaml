  md: "\nhigh—collision detection will be most accurate if objects are not allowed\
    \ to move more than 16 pixels per frame.\n\nFigure 8.17 shows a screenshot of\
    \ our game with stars, walls, and baddies. This is actually a snapshot of the\
    \ Death Wave. Without the Death Wave, the number of baddies generate at a speed\
    \ that there will be only one or two on screen at once.\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_124_0.png)\n\
    \nFigure 8.17: Stars, Walls, and Baddies\n\n## Reading the keyboard\n\nBefore\
    \ we add our hero's spaceship, we need to implement a method for controlling it.\
    \ Let's now look at how to respond to events caused by the user pressing and holding\
    \ keys on the keyboard. In order to allow our application to respond to input\
    \ from the keyboard, add a new class called **Keyboard** that implements the **KeyListener**\
    \ interface.\n\nThe **Keyboard** class in Code Listing 8.21 is an example of a\
    \ singleton. This means we will design a single class and never create multiple\
    \ instances from the class. A singleton class can be designed in Java in many\
    \ ways. I have marked the constructor as **private**, which prevents instances\
    \ of the class from being created (instead, we will call **Keyboard.init** to\
    \ initialize the singleton—using this approach is sometimes called a Factory Pattern).\
    \ Note also—the methods of this class and the key array are all static. They belong\
    \ to the class rather than an instance of it. This effectively means that the\
    \ **Keyboard** class exists as a single, static object. We cannot create nor interact,\
    \ we interact with the class itself.\n\n> Code Listing 8.21: Keyboard Class\n\n\
    ```java\nimport java.awt.event.KeyEvent;\nimport java.awt.event.KeyListener;\n\
    \npublic class Keyboard implements KeyListener {\n    // 256 key states: true\
    \ means the key is down\n    // false means the key is up.\n    private boolean[]\
    \ keyStates = null;\n```\n\n```java\n// The only instance of this class is the\
    \ following\n// private, static instance:\nprivate static Keyboard staticInstance\
    \ = null;\n\n// Private Constructor:\nprivate Keyboard() {\n    keyStates = new\
    \ boolean[256];\n}\n\n// Public init method that creates the\n// static keys if\
    \ they do not exist.\npublic static void init() {\n    staticInstance = new Keyboard();\n\
    \    reset();\n}\n\npublic static Keyboard getInstance() {\n    return staticInstance;\n\
    }\n\n// Set all key states to false.\npublic static void reset() {\n    for(int\
    \ i = 0; i < 256; i++)\n    staticInstance.keyStates[i] = false;\n}\n\n// Test\
    \ if a key is down.\npublic static boolean isKeyDown(int keyCode) {\n    return\
    \ staticInstance.keyStates[keyCode] & 255;\n}\n\n// Set a key to down; true.\n\
    public void keyPressed(KeyEvent e) {\n    staticInstance.keyStates[e.getKeyCode()\
    \ & 255] = true;\n}\n\n// Set a key to up; false.\npublic void keyReleased(KeyEvent\
    \ e) {\n    staticInstance.keyStates[e.getKeyCode() & 255] = false;\n}\n\n// Extra,\
    \ unused method from KeyListener interface.\npublic void keyTyped(KeyEvent e)\
    \ { }\n```\n\nThe Keyboard consists of a static array of boolean variables. We\
    \ will use one element of this array for each of 256 possible keys. A value of\
    \ true will mean that a particular key is hold down, and a value of false will\
    \ mean it is not. In reality, there are more than 256 possible keys that could\
    \ be down a modern keyboard (taking into consideration languages other than English).\
    \ In game programming, we are typically interested only in tracking keys such\
    \ as the letters A to Z, digits 0 to 9, the arrow keys, space bar, etc. So we\
    \ will only store an array of 256 different keys at most, and we will read only\
    \ the lowest byte of any keys that the user hits (rather than reading the Unicode\
    \ short int—which would require an array of 2^16 different states). When the array\
    \ is created in the init method, we will reset to clear all key states to false\
    \ and ensure that the initial state of the keyboard has no keys held down.\n\n\
    the keyDown method returns the current state of specified keyCode. So, if the\
    \ key is down, this method returns false. In the keyPressed event, we read the\
    \ key of the user has just pressed, limit the range of the key from 0 to 255 with\
    \ bitwise, and we clear the corresponding state to true, which means the key is\
    \ being held down. keyReleased is similar to keyPressed, except that we clear\
    \ the key's state to false, which means it no longer held down. When user presses\
    \ a key, the keyPressed event will occur. When users release a key, the keyReleased\
    \ event will occur. And, when users type a key, the keyTyped event will occur.\
    \ Note that keyTyped responds repeatedly if the user holds the key, but we do\
    \ not need this event in our game. Next, we need to add a listener to our MainClass.\
    \ The updated constructor for MainClass is listed in Code 8.22. A listener is\
    \ any class that implements KeyListener interface.\n\n> Code 8.22: Initializing\
    \ the Keyboard in MainClass\n\n```java\nprivate MainClass(int windowwidth, int\
    \ windowHeight) {\n    setSize(windowwidth, windowHeight);// Set window size.\n\
    \    setLocationRelativeTo(null); // Default location.\n    setDefaultCloseOperation(JFrame.EXIT_CLOSE);\
    \ // Exit on close.\n    setVisible(true);\n\n// Init the static singleton:\n\
    \    Keyboard.init();\n\n// Add a listener.\n    addKeyListener(Keyboard.getInstance());\n\
    \n// Create and add the engine\n    final Engine2D engine = new Engine2D(windowWidth,\
    \ windowHeight);\n    add(engine);\n}\n```\n\n## Keyboard controlled player\n\n\
    Now that we have a Keyboard class, we can add the player GameObject, which will\
    \ use the keyboard. Code 8.23 shows the basic Player class.\n\n> Code 8.23: Player\
    \ Class\n\n```java\npublic class Player extends GameObject {\n    double shipSpeed\
    \ = 320.0;\n\n    public Player(int x, int y) {\n        // Set the x/y.\n   \
    \     this.x = x; this.y = y;\n\n        // Set the animation.\n        this.setAnimation(new\
    \ Animation(0.1, 0.0, 2, true));\n    }\n\n    public void update(double timeTotal,\
    \ double deltaTime) {\n        // Call parent's update:\n        super.update(timeTotal,\
    \ deltaTime);\n\n        // Up/down\n        if(Keyboard.isKeyDown(40)) y += shipSpeed\
    \ * deltaTime;\n        if(Keyboard.isKeyDown(38)) y -= shipSpeed * deltaTime;\n\
    \n        // Left/right\n        if(Keyboard.isKeyDown(37)) x -= shipSpeed * deltaTime;\n\
    \        if(Keyboard.isKeyDown(39)) x += shipSpeed * deltaTime;\n\n        //\
    \ Make the player on the screen.\n        if(x < 0) x = 0;\n        if(y < 0)\
    \ y = 0;\n        if(x > 320) x = 320.0;\n        if(y > 240) y = 240.0;\n   \
    \ }\n}\n```\n\nNotice that in Listing 8.23, when we use the keys numbers such\
    \ as 40, 38. These are virtual keys, and there is a different code for each key\
    \ on the keyboard. For a complete list of the codes for every key, see the following:\n\
    http://docs.oracle.com/java/6/docs/api/constant-values.html#java.awt.event.KeyEvent.VK_\n\
    \nWe are reading only the keyDown and key events, so we will be able to hold two\
    \ keys at once and the ship will move diagonally.\n\nThe ship can be added to\
    \ the gameObjects array after we add the stars in the Engine2D constructor. I\
    \ have added a separate copy of the player to the Engine2D class as a member variable,\
    \ too. We do this because we need to test collisions between the player and the\
    \ walls/baddies, so we need to know which object is in the array. As it happens,\
    \ the player will always object number 100 in the array, so we can use item number\
    \ 100 in the gameObjects list, too. Also note that this is not a different instance\
    \ of the Player class but rather a different reference to the same instance. Code\
    \ Listing 8.24 shows the new player variables that will be added to the Engine2D\
    \ class and the changes for adding the new player object to the gameObjects array.\n\
    \n## Code Listing 8.24: Adding the Layer to Engine2D\n\n```java\nRandom baddie\
    \ = new Random();\n// Player variables:\nPlayer player;\nboolean playerExploded\
