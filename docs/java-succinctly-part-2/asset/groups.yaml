    \nFigure 20: New Swing Application Window\n\nIn the New Swing Application Window,\
    \ type a name for your main class and a package. I have used calculatorApp as\
    \ my package name and MainWindow for the name of my main class (See 20). Click\
    \ Finish when you have given your package and project names.\n\nEclipse will use\
    \ the WindowBuilder to create a new blank window. When we add a window using the\
    \ Swing builder, it automatically writes a main method for us, which creates and\
    \ shows the window using code similar to that used in the previous chapter. Code\
    \ Listing 7.0 is generated by the Swing Window Builder. We can edit the code however\
    \ we like, but be careful—this is automatically generated code, and in order for\
    \ the WindowBuilder to continue to manipulate and add new code, this code must\
    \ be kept somewhat close to the format that the builder prefers. In general, we\
    \ do not alter the program-generated code, but rather we add to it and program\
    \ around it.\n\nCode Listing 7.0: Swing WindowBuilder Generated Code\n\n```\n\
    package calculatorApp;\n\nimport java.awt.EventQueue;\n\nimport javax.swing.JFrame;\n\
