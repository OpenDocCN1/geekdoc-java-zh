    # Chapter 7 GUI Windows Builder


    In this section, we will use Eclipse''s WindowBuilder to build a more complex
    GUI using a WYSIWYG (what you see is what you get) drag-and-drop system. This
    greatly increases the control and speed of GUI development. We will build a simple
    calculator application. I will only include basic arithmetic operations, but we
    will see that adding new functionality to our calculator is quick and easy.


    > Note: I have used Eclipse exclusively throughout this e-book, but there are
    other IDEs available, and some have their own GUI building tools—IntelliJ has
    IDEA, for example. It is also possible to use GUI builders, such as JFormDesigner,
    that are designed for multiple IDEs.


    # Adding a window


    Next, let''s create a new Java project as we have done previously. I have called
    mine Calculator. When your new project is created, add a main window by right-clicking
    the src folder in the Package Explorer and clicking New and Other, as in Figure
    18.


    The Eclipse IDE does not come with the WindowBuilder packages already installed,
    which means you must install them separately. The detailed instructions on how
    to do this are outside the scope of this e-book, but they can be found with an
    Internet search. Briefly, you choose the Help | Install New Software menu item
    from the Eclipse toolbar, then use a step-by-step wizard to install the four or
    so packages (some, such as Documentation, are optional) that are used to create
    a GUI application using WindowBuilder/Swing.'
