    \ SpriteSheet sprites;\n```\n\n```\n// Constructor\npublic Engine2D(int windowWidth,\
    \ int windowHeight, int fps) {\nwidth = windowWidth;\nheight = windowHeight;\n\
    // Load the sprites:\nsprites = new SpriteSheet(\"graphics/spacer.png\", 16, 16);\n\
    \n// Start the render/update loop.\nTimer timer = new Timer(1000/fps, this);\n\
    timer.start();\n```\n\nNotice that the parameters for the sprite width and height\
    \ are 16, which occurs because the spacer.png image was drawn to have each separate\
    \ frame inside a 16x16 pixel box. When we render our sprite sheet, we have the\
    \ option of rendering only a portion of it (as we will see in a moment). If you\
    \ have sprites of sizes on your sprite sheet, you need to know where each sprite\
    \ begins and ends (in terms of the x and y coordinates) in order to correctly\
    \ render the portions of the sprite sheet. Because all sprites are the same size,\
    \ we can perform a simple calculation to correctly render the desired portion\
    \ of image. This is a fast way of including sprite sheets when all the sprites\
    \ are made to be exactly the same size and when they are properly spaced on a\
    \ grid in the PNG file. When we loaded our SpriteSheet object, we can render a\
    \ test sprite in our Engine2D render method in order to make sure everything is\
    \ running smoothly, as we see Listing 8.4.\n\nCode Listing 8.4: Rendering a Test\
    \ Sprite\n\n```\n// Temporary test, delete this line after making\n// sure the\
    \ program animates:\nstatic int x = 0;\n\nprivate void render(Graphics2D g) {\n\
    \    // Clear the screen to blue\n    g.setBackground(Color.DARK_GRAY);\n    g.clearRect(0,\
    \ 0, width, height);\n\n    // Temporary test:\n    sprites.render(g, x % 2, 0);\n\
    \    x++;\n}\n```\n\nIn Code 8.4, I have included an x variable and incremented\
    \ it each frame in the update method. In the render method, I have rendered sprite\
    \ number \"x%2\" at position x. This will cause the first frames of our sprite\
    \ sheet to be drawn so that they move across the screen from left to right, as\
    \ per Figure 55.\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_109_0.png)\n\nFigure\
    \ 55: Smallhip (Cropped)\n\n# Scaling sprites\n\nOur spaceship is very small.\
    \ As a stylistic choice, we might want our sprites to appear larger and pixelated,\
    \ similar to games from the 90s. The sprites will be easy for the player to see,\
    \ and our game will have a retro aesthetic. We can scale our sprites by multiplying\
    \ the coordinates of the destination in the render method. When you run the test\
    \ application after implementing the changes in Code 8.5, you should see a much\
    \ larger spaceship.\n\nCode Listing 8.5: Scaling the Sprite\n\n```\npublic void\
    \ render(Graphics2D g, int spriteIndex, int x, int y) {\n    // Make sure the\
    \ sprite is actually on the spriteSheet.\n    if (spriteIndex >= totalSprites)\
    \ return;\n    // Compute the source x and y.\n    int srcX = (spriteIndex % totalSprites)\
    \ * spriteWidth;\n    int srcY = (spriteIndex / totalSprites) * spriteHeight;\n\
    \    // Draw the image\n    g.drawImage(bmp, x, y, x + spriteWidth, y + spriteHeight,\
    \ null);\n}\n```\n\n# Timing and frame skipping\n\nMany computing devices move\
    \ differently, and each hardware has specific performance—some devices are faster\
    \ than others. In order to make our games run at a smooth, consistent rate, we\
    \ need to move our sprites so they appear to move at the same speed regardless\
    \ of hardware. We can do this by employing a technique called frame skipping.\n\
    \nA fast computer might be capable of rendering four frames in a short amount\
    \ of time, and a slower computer might render only two frames in the same amount\
    \ of time. However, our objects must move the same distance despite the number\
    \ of frames. The faster computer might render frames more smoothly, but the game\
    \ must appear to run at the same speed. One way to achieve this is to scale the\
    \ movement of our objects by the amount of time that has elapsed since the last\
    \ call to update. We will include a new class HPTimer (short for High-Precision\
    \ Timer) that accurately records the amount of time passing so that we can use\
    \ it in our update method. Create the HPTimer class and add the code to Listing\
    \ 8.6.\n\nCode Listing 8.6: HPTimer Class\n\n```\npublic class HPTimer {\n   \
    \ // Member variables\n    long startTime, lastTime, currentTime;\n\n    // Set\
    \ the start, last and current times to now:\n    public void reset() {\n     \
    \   startTime = System.currentTimeMillis();\n\n        // You can also use nano\
    \ time:\n        startTime = System.nanoTime();\n\n        lastTime = startTime;\n\
    \        currentTime = startTime;\n    }\n\n    // Reset the timer.\n    public\
    \ void start() {\n        reset();\n    }\n\n    // Record the current time.\n\
    \    public void update() {\n        lastTime = currentTime;\n        currentTime\
    \ = System.currentTimeMillis();\n\n        // If using nano time:\n        currentTime\
    \ = System.nanoTime();\n    }\n\n    // Return the time since the last call to\
    \ update.\n    public double timeDelta() {\n        double d = (double) currentTime\
    \ - (double) lastTime;\n        d /= 1000.0;\n\n        // If using nano time:\n\
    \        // d /= 1000000000.0;\n        return d;\n    }\n\n    // Return the\
    \ time since the last call to reset.\n    public double timeTotal() {\n      \
    \  double d = (double) currentTime - (double) startTime;\n        d /= 1000.0;\n\
    \n        // If using nano time:\n        // d /= 1000000000.0;\n        return\
    \ d;\n    }\n}\n```\n\nCode Listing 8.6 shows the class for our timer. As our\
    \ application develops, if you find that the timer is not accurate enough, you\
    \ might want to try uncommenting the \"nano time\" lines in order to use System.nanoTime\
    \ instead of milliseconds. The class does more than read the time in milliseconds\
    \ each the update method calls, and it offers timeTotal and timeDelta methods\
    \ that return the total amount of time that has elapsed since the start of the\
    \ timer, along with the elapsed time since the last call to update. Add an HPTimer\
    \ instance to the Engine2D class. In Code Listing 8.7, I have called my instance\
    \ hpTimer.\n\n# Code Listing 8.7: Create an HPTimer\n\n```\nprivate SpriteSheet\
    \ sprites;\nprivate HPTimer timer;\n\n// Constructor\npublic Engine2D(int windowWidth,\
    \ int windowHeight, int fps) {\n    width = windowWidth;\n    height = windowHeight;\n\
    \    // Load the sprites.\n    sprites = new SpriteSheet(\"graphics/spacer.png\"\
    , 16, 16);\n\n    // Start the HPTimer.\n    timer = new HPTimer();\n    timer.start();\n\
    \n    // Start the render/update loop.\n    Timer timer = new Timer(1000/fps,\
    \ this);\n    timer.start();\n}\n```\n"
