    \        }\n    }\n\n    running = false;\n}\n```\n\n`run` 方法的第二个版本稍微好（代码列表 5.4）。我们使用了\
    \ `synchronized` 关键字，以共享资源为键来锁定内部循环（这个锁就是一个互斥锁）。`synchronized` 关键字接受一个资源进行同步，其后面跟着一个代码块。一次时间只有一个线程可以执行\
    \ `synchronized` 代码块，因此 `counter.j++` 这一行是临界区。线程将等待锁（互斥锁）释放，然后进入临界区，增加 `counter.j`，最后释放锁。\n\
    \n获取和释放锁需要时间。最终，我们希望线程在同步之前尽可能地独立工作。如果你使用新的 `run` 方法版本运行应用程序（请不要这样做），你可能需要等待很长时间，让线程释放大约\
    \ 30,000 次锁并增加 `counter.j`。它们最终会完成，但可能需要 10 分钟或一小时。代码列表 5.5 显示了更好的方法。\n\n> 注意：你也可以用\
    \ `synchronized` 关键字标记方法。当我们把方法标记为 `synchronized` 时，意味着该方法一次只能由一个线程使用。然而，我们必须非常小心，因为\
    \ `synchronized` 方法实际上是以 `this` 关键字作为锁对象进行同步的。如果在类中有一个 `synchronized` 方法并尝试创建该类的多个线程，线程将不会进行同步，因为它们都将使用自己作为锁。\n\
    \n代码列表 5.5: 使用互斥锁 2（快速方法）\n\n```java\npublic void run() {\n    for(int q = 0;\
    \ q < 10000; q++) {\n        synchronized (counter) {\n            counter.j++;\n\
    \        }\n    }\n\n    running = false;\n}\n```\n"
