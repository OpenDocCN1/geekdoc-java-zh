    # # Conclusion and Thank You


    Java is a marvelous programming language full of rich, descriptive, a powerful
    mechanisms. It is currently the most-programmed computer language in the world
    (http://pypl.github.io/PYPL.html), and millions of Java applications are running
    at every moment all over the globe. I hope you have enjoyed reading the Java *Succinctly*
    e-books as much as I have enjoyed writing them. And I hope you learned something
    from the techniques presented. We have examined a multitude of syntaxes and techniques
    involved with Java programming, and we have only scratched the surface. Java is
    a vast language, and its powers are limited only by our own imaginations and ingenuity.


    When I sat down to write the Java Succinctly e-books, I was tempted to fill them
    with small, unrelated demonstrations of the various mechanisms of Java. This would''ve
    been an easy-book to write, and it would be useful as a reference. But such e-books
    are not the kind of references I wished when I was learning. So, instead of manuals,
    I decided on something more ambitious. I decided to share some of the techniques
    involved with wrangling the mechanisms into coherent projects. With the Calculator
    app and the Space game, we explored a different level of programming—the most
    important level of a language''s features together into a coherent project. This
    level of programming makes or breaks a it. It is not difficult to learn the syntax
    of any language, but the techniques for controlling the mechanisms together are
    what separates a student from a programmer. After you develop several applications
    on a similar scale to our Calculator and Space game, you will feel comfortable
    comfortable using Java at this level. And, luckily, these techniques are readily
    transferable to any other language. After you become fluent and comfortable in
    Java, you will find it very easy to move to other languages.


    If Java is your first language, I highly recommend that you become comfortable
    with it, to explore the magic and power of the parent languages: C and C++ (which
    are native languages). C and C++ have syntax that is very similar to Java, but
    they lack the safety mechanisms and garbage collection. They make up for power
    and speed by, using JNI (the Java Native Interface), to combine these native languages
    with your Java code). If you are interested in programming web applications, I
    recommend you study JavaScript (which is not related to Java, despite the name).
    And, if you are interested in mobile development, you will be happy to know that
    Android devices primarily run Java applications—it is a very small step from where
    we left off in our Space game to developing full Android applications!


    Finally—thank you for reading. I hope you have a beautiful day, and I hope to
    see you again shortly in my next book: *Scala Succinctly!*'
