    \ 来导入在 OtherPackage 包中定义的所有类。\n\n我们可以将程序的所有代码写在单个包中，或者完全不指定包（这意味着我们项目中的所有类都属于默认包）。随着项目的扩大，我们通常会将算法和有用的代码收集到一个包中，以便在项目之间重复使用。\n\
    \n## 断言 (Assert)\n\nAssert 是一种非常有调试机制。在 Java 中**assert**（断言）一个条件是为了确保它是 **true**（真）。当我们进行断言时，我们是在说：如果某个语句为假，则终止应用程序并通知我们（assert\
    \ 是用于调试，而不是为最终用户或生产环境代码设计的）。我们使用 **assert** 在程序中包含测试。如果我们在整个应用程序开发过程中仔细地设计了测试，**assert**\
    \ 可以让我们知道出了什么问题，并能够提高我们维护和调试项目的能力。对于后续内容，我创建了一个名为 **AssertTesting** 的新项目并添加了 `MainClass`。新类的代码列在代码列表\
    \ 1.3 中。\n\n# 代码列表 1.3: 使用 Assert\n\n```java\nimport java.util.Scanner;\npublic\
    \ class MainClass {\n    public static void main(String[] args) {\n        int\
    \ numerator; // 我们分数的分子。\n        int denominator; // 我们分数的分母。\n        Scanner\
    \ scanner = new Scanner(System.in);\n\n        // 读取分子。\n        System.out.println(\"\
    Please enter a numerator: \");\n        numerator = Integer.parseInt(scanner.nextLine());\n\
    \n        // 读取分母。\n        System.out.println(\"Please enter a denominator: \"\
    );\n        denominator = Integer.parseInt(scanner.nextLine());\n\n        //\
    \ 确保分母不为 0！\n        assert(denominator != 0);\n\n        // 如果通过断言，使用打印一些信息\n\
    \        System.out.println(numerator + \" / \" + denominator + \" = \" + \n \
    \           (numerator / denominator) + \" remainder \" + \n            (numerator\
    \ % denominator));\n\n    }\n}\n```\n\n代码列表 1.3 中的程序从用户处读取两个整数，分子和分母。它的设计是用分子除以分母，并输出除法的结果和余数。然而，如果用户输入\
    \ 0 作为分母，程序将无法进行，因为除以 0 是未定义的。程序使用 `assert(denominator != 0)` 来确保分母不为零。\n\n注意，断言在括号中有一个关联的布尔表达式。如果该布尔表达式为真，则断言通过，程序继续正常执行。如果表达式为假（即用户输入了0作为分母），则断言失败，程序将退出。默认情况下，Eclipse\
    \ 设置为忽略断言，在运行应用程序并输入分母 0 时，它会导致我们的程序崩溃。我们需要提供 -ea 作为 JVM 的命令行选项（-ea 是 enable assertions\
    \ 的缩写）。为了向程序提供命令行参数，请从菜单中选择 **Run**，然后选择 **Run Configurations**。这将打开 Run Configurations\
    \ 对话框，如图5 所示。\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_15_0.png)\n\n为了开启断言，选择\
    \ Arguments 选项卡并在 VM arguments 框中输入 -ea。完成此操作后不要忘记点击 Apply。在将 -ea 参数传递给 VM 之后，我们就可以使用断言了。\n\
    \n"
