    \n复制并粘贴的图像看起来与图 43 相似，但原本应该是透明的地方是黑色的。\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_103_0.png)\n\
    \n图 45：黑色背景的精灵\n\n为了将背景改为透明，我们需要打开几个窗口。从菜单中选择窗口 (Windows)、工具箱 (Toolbox)、工具选项 (Tool\
    \ Options) 和层 (Layers)，如图 46 所示。\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_103_1.png)\n\
    \n图 46：Gimp 窗口\n\n接下来，我们将为图像添加 Alpha 通道。在层框中右键点击层，并从右键菜单中选择 Alpha 通道（图 47）。Alpha\
