    # Figure 47: Add an Alpha Channel


    Next, select the entire black region in order to remove the black boxes from our
    pasted image. There are several ways to do this, and I will use the Select by
    Color tool, as in Figure 48.


    ![](img/d60259b161c11ca7d937b0831a48a5ef_104_1.png)


    # Figure 48: Select by Color


    When you select by color, the Tool Options window is updated to include controls
    for manipulating how the selection should be performed. Turn off Anti-aliasing
    and turn Feather Edges in the Tool Option box, as per Figure 48. Anti-aliasing
    and feather edges help selection appear smoother by adding slightly transparent
    edges to the selection—we do not want this. Make sure the Threshold is 0 so that
    we can select all the black regions without accidentally selecting nonblack but
    dark regions. After you have set up the Select by Color tool, click Select by
    Color tool will select all the matching black pixels. Hit the delete key on your
    keyboard in order to delete the black pixels—doing so will replace them with transparent
    pixels (pixels with an alpha value of 0), as per Figure 49.'
