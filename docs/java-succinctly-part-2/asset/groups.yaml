    \n\n## Let us know what you think\n\nIf you have any topics of interest, thoughts,\
    \ or feedback, please feel free to send them to us at succinctly-series@syncfusion.com.\n\
    \nWe sincerely hope you enjoy reading this book and that it helps you better understand\
    \ the topic of study. Thank you for reading.\n\nPlease follow us on Twitter and\
    \ \"Like\" us on Facebook to help us spread the word about the Succinctly series!\n\
    \n![](img/d60259b161c11ca7d937b0831a48a5ef_7_0.png)\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_7_1.png)\n\
    \n## About the Author\n\nChristopher Rose is an Australian software engineer.\
    \ His background is mainly in data mining and charting software for medical research.\
    \ He has also developed desktop and mobile apps and a series of programming videos\
    \ for an educational channel on YouTube. He is a musician and can often be found\
    \ accompanying silent films at the Majestic Theatre in Pomona, Queensland.\n\n\
    ## Introduction\n\nThis is the second e-book in the two-part series Java Succinctly.\
    \ If you have not read the first book, Java Succinctly Part 1, and if you are\
    \ not familiar with the basics of the Java language, I strongly recommend you\
    \ read that e-book first. In this volume, we will concentrate on more advanced\
    \ features of Java, including multithreading, building GUI applications, and 2-D\
    \ graphics/game programming. Code samples can be found here.\n\nProgramming computers\
    \ requires a lot of practice, which means we will inevitably make mistakes and\
    \ unintentionally cause our programs to crash, hang, and otherwise behave in ways\
    \ that would make you an end user. I recommend that you copy and paste the code\
    \ samples here to get an overview of how things work. Then, go ahead and change\
    \ things later—add new functionality and features to the programs (particularly\
    \ the Calculator and Space Game applications presented in Chapters 7 and 8). This\
    \ will give you good insight into a computer programmer's power. Remember that\
    \ 100 years ago, there was nobody on Earth who could sensibly demand it.\n\n##\
    \ Packages\n\nPackages offer a way to organize classes into groups. They allow\
    \ us to avoid name conflicts, as two classes with the same name can exist if they\
    \ are in different packages. Similarly, a package can contain many files.\n\n\
    ## Adding packages manually\n\nIn order to place a class in a package, you must\
    \ use the package declaration at the top of the file.\n\n```java\npackage MainPackage;\n\
    \npublic class MainClass {\n    public static void main(String[] args) {\n   \
    \     System.out.println(\"Hello, World!\");\n    }\n}\n```\n\nIf you place a\
    \ file in a folder that does not match its package declaration, the IDE will underline\
    \ the line. This is because the IDE expects the folder to match the package name.\n\
    \n## Adding packages using Eclipse suggestions\n\nWhenever there is an error or\
    \ warning, Eclipse will underline the suspect portion of code. We can hover our\
    \ cursor over it, and Eclipse will pop up suggestions.\n\n```java\npackage MainPackage;\n\
    // The declared package \"MainPackage\" does not match the expected \"\"\n// Two\
    \ quick fixes available:\n// Move 'MainClass.java' to package 'MainPackage'\n\
    // Remove package declaration 'package MainPackage'\n}\n```\n\nFigure 3 shows\
    \ two Eclipse suggestions for remedying the line `package MainPackage`. The first\
    \ suggestion is to move `MainClass.java` to package `MainPackage`. This is exactly\
    \ what we want to do, so we click this suggestion and Eclipse will create the\
    \ folder in the Package Explorer.\n\n## Creating multiple packages\n\nLet's add\
    \ another class in a different package and see how we can import using the import\
    \ keyword.\n\n```java\npackage OtherPackage;\n\nimport MainPackage.MainClass;\n\
    \npublic class OtherClass {\n    public static void main(String[] args) {\n  \
    \      MainClass mc = new MainClass();\n    }\n}\n```\n"
