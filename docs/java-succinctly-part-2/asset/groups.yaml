    \ `FileWriter` 类并在打开文件时将 `append` 参数设置为 \"true\" 来向文件中追加新数据（参见列表 2.2 中向文件追加文本的示例）。这在我们不希望覆盖日志数据时的日志记录非常有用。\n\
    \n### 代码列表 2.2：向文件追加文本\n\n```java\nimport java.io.FileWriter;\nimport java.io.IOException;\n\
    import java.io.PrintWriter;\n\npublic class MainClass {\n    public static void\
    \ main(String[] args) {\n        try {\n            // 使用 \"append\" 参数为 \"true\"\
    \ 创建文件写入器：\n            FileWriter file = new FileWriter(\"Example.txt\", true);\n\
    \n            // 从文件创建写入器对象：\n            PrintWriter writer = new PrintWriter(file);\n\
    \n            // 写入一些新文本：\n            writer.println(\"This text will be added\
    \ to the end!\");\n\n            // 关闭写入器：\n            writer.close();\n    \
    \    } catch (IOException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n\n我们可以将数据和变量写入文本文件，但必须意识到，当我们读取数据时必须对其进行解析。代码 2.3 显示了序列化部分中向文本文件写入数据的示例。\n\
    \n### 代码 2.3：向文本文件写入数据/变量\n\n```java\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
    import java.io.PrintWriter;\n\npublic class Main {\n    public static void main(String[]\
