  - '[PAGE 87]


    # Adding functionality


    Many arithmetic operators take two operands, such as 1+4. We will maintain a state
    variable that record which number we are reading (i.e. the left or right operand
    for an arithmetic operator). We will keep a variable that indicates which operand
    the user has initially selected, and we will instruct the calculator to read the
    digits of first number (the left operand for the operator). We will build two
    types of operations—that require two operands, such as Addition and Subtraction,
    and those that require a single operand, such as Natural Log and Square Root.


    ![](img/d60259b161c11ca7d937b0831a48a5ef_87_0.png)


    Figure 37: State Diagram


    Figure 37 shows a basic state diagram, depicting the operational flow of our calculator.
    Initially, the state variable will be set to 0, which corresponds to reading the
    first operand (called number1 in the following code). The user can input a number
    using the Digit buttons, then have two options—click a single operand operation
    (such as Square Root) or click a multiple operand operation (such as Addition).


    When the user clicks a single operand operation, we can store the current digits
    that the user has clicked as number1 and compute the result of the operation using
    this value. We can then store the result back to number1, output it to the screen,
    and start the process again.


    When the user clicks a two-operation, actions become slightly more complicated.
    We store the current digits in the number1 variable, we make a record of which
    operation the user has clicked (this is the operator variable in following code),
    and we set the state to 1, which means the program is reading the second value,
    number2. The user will input some new number and click Equals. When they click
    Equals, we store the current digits in number2, perform the selected operation
    between number1 and number2, write the result to txtOutput, and start again.'
