    \ 中右键点击文件并选择 Show In（显示），这将在 Windows Explorer 中打开文件位置。\n\n# 转义序列\n\n在继续之前，让我们简要了解一下转义序列。我们在屏幕上打印文本时，有时我们需要使用特殊符号来添加换行、制表符或字符。转义序列可以用于\
    \ Java 中任何写入字符串到屏幕或文件的。这包括 `System.out` 和 `PrintWriter.println`。表 1 显示了 Java 中的转义序列。\n\
    \n> **注意**：转义序列并不是字符串固有的。没有任何关于 \"\\t\" 能让 JVM 自动打印制表符。转义序列是处理字符串的方法（如 println）中的程序行为。\n\
    \n表 1：转义序列\n\n| 转义序列 | 含义 |\n| :--- | :--- |\n| \\t | 制表符 |\n| \\b | 退格 |\n| \\\
    n | 换行 |\n| \\r | 回车 |\n| \\f | 换页 |\n| \\' | 单引号 |\n| \\\" | 双引号 |\n| \\\\ |\
    \ 反斜杠 |\n\n### 代码 2.4：转义序列示例\n\n```java\n// \\n 导致换行：\nSystem.out.println(\"First\
    \ line\\nSecondline!\");\n```\n\n我们读取文件的顺序必须与写入的顺序匹配。当从文件中读取数值字符时，它必须匹配数据类型，否则将抛出异常（例如，我们无法读取\
    \ \"one\" 或 \"1\" 并期望 Java 自动将此文本转换为整数 1）。重要的是，数据到数值变量的读取和转换非常慢。我们通常不这样写入变量，而是更多地使用文本文件进行字符串。\n\
