    \ type a name for your main class and a package. I have used calculatorApp as\
    \ my package name and MainWindow for the name of my main class (See 20). Click\
    \ Finish when you have given your package and project names.\n\nEclipse will use\
    \ the WindowBuilder to create a new blank window. When we add a window using the\
    \ Swing builder, it automatically writes a main method for us, which creates and\
    \ shows the window using code similar to that used in the previous chapter. Code\
    \ Listing 7.0 is generated by the Swing Window Builder. We can edit the code however\
    \ we like, but be careful—this is automatically generated code, and in order for\
    \ the WindowBuilder to continue to manipulate and add new code, this code must\
    \ be kept somewhat close to the format that the builder prefers. In general, we\
    \ do not alter the program-generated code, but rather we add to it and program\
    \ around it.\n\nCode Listing 7.0: Swing WindowBuilder Generated Code\n\n```\n\
    package calculatorApp;\n\nimport java.awt.EventQueue;\n\nimport javax.swing.JFrame;\n\
    \npublic class MainWindow {\n\n    private JFrame frame;\n\n    /**\n    /* Launch\
    \ the application.\n    */\n    public static void main(String[] args) {\n   \
    \     EventQueue.invokeLater(new Runnable(){\n            public void run() {\n\
    \                try {\n                    MainWindow window = new MainWindow();\n\
    \                    window.frame.setVisible(true);\n                } catch (Exception\
    \ e) {\n                    e.printStackTrace();\n                }\n        \
    \    }\n        });\n    }\n}\n\n/** Create the application.\n */\npublic MainWindow()\
    \ {\n    initialize();\n}\n\n/**\n* Initialize the contents of the frame.\n */\n\
    private void initialize() {\n    frame = new JFrame();\n    frame.setBounds(100,\
    \ 100, 450, 300);\n    frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    }\n```\n\n## Designing a GUI in Design View\n\nThe code in Code Listing 7.0 does\
    \ little more than supply a main method and create and show a blank window. In\
    \ Eclipse, there are Source and Design tabs at the lower side of the main code\
    \ window. These are two views of our application, while the source view is the\
    \ normal code window. Select the Design View tab and Eclipse will open the window\
    \ for editing using the Swing WindowBuilder (see Figure 21).\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_76_0.png)\n\
    \nGUI design is a very large topic and a profession of ones. But generally we\
    \ should try to follow common conventions. Our users are familiar with thousands\
    \ of layouts from their everyday lives—pocket calculators, food labels, applications,\
    \ etc. Users understand these layouts, and if we want new users to understand\
    \ our application with little effort, we should follow the principles of these\
    \ layouts. The gold standard for a new application is that new user is able to\
    \ use it without any instructions or manual of all. This is not possible, but\
    \ it is a very good standard to aim for, and something we should keep in mind\
    \ whenever we design software.\n\nTry drawing layouts on paper or using a design\
    \ program and stylus. Even a project simple as a calculator offers many options\
    \ of how we lay out our controls. Sketch several possible layouts for the GUI\
    \ label, and ask yourself why certain patterns in the layouts work while others\
    \ do not. In Figure 22, I have taken inspiration from the layout of the CASIO\
    \ fx series pocket calculator, which is very popular and well-known—many people\
    \ are familiar with it. We do not need to match the layout, and I have provided\
    \ a space for \"special function\" that allow the functionality of our calculator\
    \ to grow as we think of new features. I have also decided to include the arithmetic\
    \ functions in a single column to save space, and I have increased the size of\
    \ the Equals button because I believe this is particularly important and will\
    \ be used more often than any other button.\n\n> Note: We will not be programming\
    \ expression parsing. Our calculator will compute expressions.\n"
  mdcn: "\n注意：存在多种窗口构建工具。如果你对 IBM 的 SWT 感兴趣，也可以使用 SWT 框架创建窗口。这允许你向项目中添加多个窗口，并在应用程序运行时打开和关闭它们。\n\
    \n![](img/d60259b161c11ca7d937b0831a48a5ef_74_0.png)\n\n图 20：新的 Swing 应用程序窗口\n\
    \n在“新建 Swing 应用程序”窗口中，为你的主类和包输入名称。我使用 `calculatorApp` 作为我的包名，使用 `MainWindow` 作为主类的名称（见图\
    \ 20）。在给出包名和项目名称后，点击“完成（Finish）”。\n\nEclipse 将使用 WindowBuilder 创建一个新的空白窗口。当我们使用\
    \ Swing 构建器添加窗口时，它会自动为我们编写一个主方法，该方法将使用与上一章类似的代码来创建并显示窗口。代码列表 7.0 是由 Swing WindowBuilder\
    \ 生成的。我们可以按照意意编辑代码，但要小心——这是自动生成的代码，为了让 WindowBuilder 能够继续操作并添加新代码，这些代码必须保持与构建器偏好的格式相似。通常情况下，我们不修改程序生成的代码，而是在其基础上添加内容并在其周围编程。\n\
    \n代码列表 7.0：Swing WindowBuilder 生成的代码\n\n```\npackage calculatorApp;\n\nimport\
    \ java.awt.EventQueue;\n\nimport javax.swing.JFrame;\n\npublic class MainWindow\
    \ {\n\n    private JFrame frame;\n\n    /**\n    /* 启动应用程序。\n    */\n    public\
    \ static void main(String[] args) {\n        EventQueue.invokeLater(new Runnable(){\n\
    \            public void run() {\n                try {\n                    MainWindow\
    \ window = new MainWindow();\n                    window.frame.setVisible(true);\n\
    \                } catch (Exception e) {\n                    e.printStackTrace();\n\
    \                }\n            }\n        });\n    }\n}\n```\n\n```java\n/**\
    \ 创建应用程序。\n */\npublic MainWindow() {\n    initialize();\n}\n```\n\n```java\n\
    /**\n* 初始化框架的内容。\n */\nprivate void initialize() {\n    frame = new JFrame();\n\
    \    frame.setBounds(100, 100, 450, 300);\n    frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    }\n```\n\n## 在设计视图中设计 GUI\n\n代码列表 7.0 中的代码仅仅是提供了一个主方法并创建且显示了一个空白窗口。在 Eclipse 中，主代码窗口底部有“源（Source）”和“设计（Design）”标签页。这些是我们应用程序的两种视图，而源视图是普通的代码窗口。选择“设计”标签页，Eclipse\
    \ 将打开使用 Swing WindowBuilder 进行编辑的窗口（见图 21）。\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_76_0.png)\n\
    \nGUI 设计是一个非常大的话题，也是一门专业。但通常，我们应该尝试遵循通用惯例。我们的用户对日常生活中的成千上种布局非常熟悉——口袋计算器、食品标签、应用程序等。用户理解这些布局，如果我们希望新用户能够毫不费力地理解我们的应用程序，我们应该遵循这些布局的原则。新应用程序的黄金标准是新用户能够在没有任何说明书或手册的情况下使用它。这虽然是不可能的，但是一个非常值得追求的标准，也是我们在设计软件时应该记住的。\n\
    \n尝试在纸上画出布局或使用设计程序和手写笔绘制。即使是像计算器这样简单的项目，对于我们如何布局控件也提供了许多选择。为 GUI 标签勾勒几种可能的布局，并问问自己为什么布局中的某些模式有效而另一些则无效。在图\
    \ 22 中，我从卡西（CASIO）fx 系列口袋计算器的布局中汲取了灵感，它非常受欢迎且知名——很多人对它都很熟悉。我们不需要完全匹配布局，我预留了一个“特殊功能”空间，允许我们的计算器功能在我们思考新功能时扩展。我还决定将算术功能放在一列中以节省空间，并增大了等号（Equals）按钮的大小，因为我相信这特别重要，而且它的使用频率任何任何按钮都高。\n\
    \n> 注意：我们不会编写表达式解析。我们的计算器将计算表达式。\n"
