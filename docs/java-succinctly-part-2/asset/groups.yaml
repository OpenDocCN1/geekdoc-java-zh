  - '[PAGE 16]


    # Chapter 2 Reading and Writing to Files


    Reading and writing to files is important because files retain their information
    even when the computer is turned off. Files are slower to read and write than
    RAM (which is where variables and classes are stored when the program runs), but
    files are more permanent. Hard drives represent a memory space nonvolatile. RAM,
    however, is volatile—it is cleared when the machine powers down. In addition,
    hard drives are generally much larger than RAM. In fact, many modern drives have
    terabytes, whereas the RAM in a desktop computer is often only a few gigabytes.


    There are two broad file categories in Java. The difference is arbitrary, and
    in reality, there is no separation between the two categories, except in how we
    want to treat the data in the files in our code. Figure 6 shows a binary file
    on the left and a text file on the right. The two files have been opened in Notepad,
    which is a plaintext editor (available from http://www.notepad.org/).


    ![](img/d60259b161c11ca7d937b0831a48a5ef_16_0.png)


    Figure 6: Binary file vs. Text File


    In Figure 6, the binary file on the left is an audio file, and it looks gibberish.
    It contains many strange characters or nothing is obviously human. Binary files
    represent data in a way that is easy for the computer to read—they are used to
    save information as variables and objects in our programs. Common binary files
    are audio files as WAV, MP3, etc., images as PNG or JPG, and files containing
    serialized versions of our objects (we will explore serialization in more).


    On the right of Figure 6 is a text file. This file consists mostly of human readable
    characters, such as letters of the alphabet, digits, and punctuation marks. The
    file on the right contains a description that can be easily read by a human but
    that often involves conversion, e.g., a computer could not easily understand.
    Computers can read these files, but often must perform a conversion from the string
    128 to the integer 128 from a text file before it is usable.'
  - "[PAGE 17]\n\nIn Java, when we open a file for reading or writing, we choose whether\
    \ we want to open it as a text file or a binary file. The difference between the\
    \ two is represented by the methods we can use to read and write data. In Java,\
    \ reading and writing to files is similar to reading from and writing to the console.\
    \ Reading and writing to binary files is quite different.\n\n# Writing to a text\
    \ file\n\nCreate a new project TextFiles, then add a MainClass and a main method.\
    \ Code Listing 2.0 shows some simple code for creating and writing a line of text\
    \ to a text file.\n\nCode Listing 2.0: Creating and Writing to a Text File\n\n\
    ```\nimport java.io.File;\nimport java.io.FileNotFoundException;\nimport java.io.PrintWriter;\n\
    public class MainClass {\n    public static void main(String[] args) throws FileNotFoundException\
    \ {\n        // Create a file:\n        File myFunction = new File(\"Example.txt\"\
    );\n\n        // Create a writer using the file.\n        PrintWriter writer =\
    \ new PrintWriter(myFile);\n\n        // Write a line of text to the file.\n \
    \       writer.println(\"This is some example text!\");\n\n        // Close the\
    \ writer.\n        writer.close();\n    }\n}\n```\n\nIn Code Listing 2.0, the\
    \ first line in the main method, \"File myFunction = new File(\"Example.txt\"\
    )\", creates a new File object called myFunction. The File constructor takes a\
    \ single parameter that is the path and name of the file: Example.txt. In our\
    \ case, there is no path, so the program will create the file in the current folder\
    \ (which will be the folder from which our application is running). Also, at the\
    \ top of Code Listing 2.0, we import java.io.File.\n\nThe File object in Code\
    \ Listing 2.0 is simply a filename reference. In order to write to the file, we\
    \ must open it as text using a PrintWriter. The \"PrintWriter writer = new PrintWriter(myFile)\"\
    , opens the file referenced by the File object for writing as text. java.io.PrintWriter\
    \ in order to use the PrintWriter class."
