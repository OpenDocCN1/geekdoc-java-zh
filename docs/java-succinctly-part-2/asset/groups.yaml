    等号按钮在 `GridBagLayout` 中占据三个框格的空间，但目前该空间尚未被填充。当选中一个控件时，我们在 Eclipse 顶部的工具栏中有几个布局选项。确保你的按钮已选中并点击
    Fill（填充）。这将导致 Eclipse 调整控件的大小，以填满 `GridBagLayout` 中的全部三个框格空间（见图 31）。


    ![](img/d60259b161c11ca7d937b0831a48a5ef_83_1.png)


    图 31：填充控件区域


    ## 快速更改多个控件


    我们的表单有很多按钮。为了快速选择它们，我们可以使用 Eclipse 中的 Components（组件）框。点击第一个按钮的名称并按住 shift 键，然后按键盘上的方向键，直到所有按钮都被选中，如图
    32 所示。


    当所有控件都被选中后，像我们之前处理等号按钮一样点击 Fill。这将导致我们的所有控件都被调整为完全相同的大小。注意，在 във点击 Fill 之前，我们的一些控件大小略有不同，但默认按钮的大小是根据其文本内容进行调整的（这并不是所有布局都如此），而且在文本中它们的宽度并不完全相同。


    ![](img/d60259b161c11ca7d937b0831a48a5ef_84_0.png)


    选择第一个控件


    按住 shift 然后向下移动选择剩余部分


    图 32：在组件窗口中选择多个控件


    ## 控件间距


    当我们运行程序时，我们会发现控件之间的间隙非常小，尽管它们在设计器中看起来是那样（见图 33）。我们希望在 `txtoutput` 和我们的特殊功能之间留一个小边距，并且希望在特殊功能按钮与数字及运算符按钮之间留一个小间隙。


    为了在 `GridItemLayout` 中包含间隙和边距，我们可以设置行和列的大小。在 System（系统）面板中点击 Selection（选择）工具，然后点击表单上不包含任何按钮任意任意：选中
    GridLayout。你会看到网格在设计器的顶部和左侧有编号的列标题和行标题（见图 34）。


    ![](img/d60259b161c11ca7d937b0831a48a5ef_85_0.png)


    图 33：没有间距的计算器


    ![](img/d60259b161c11ca7d937b0831a48a5ef_85_1.png)


    图 34：GridBagLayout 行和列标题


    如果你选中了 `GridBagLayout`，可以右键点击相应的行或列并执行一些非常有用的功能。我们可以轻松添加新行或列、删除现有的行或列，并更改任何现有行或列的属性。我们想要更改几行的最小尺寸，以便我们的控件间距更合理。右键点击行
    0 的按钮，从右键菜单中选择 properties（属性）（如图 35 所示）。


    ## 图 35：行属性


    在 Row Properties（行属性）框中，将最小尺寸更改为 50 并点击 Apply（应用），如图 35 所示。这确保了 `txtOutput` 控件与我们的特殊功能按钮之间有
    50 像素的间隙。接下来，同样地更改第 5 行的最小间隙。这将我们的特殊功能按钮与数字及运算符按钮之间添加至少 50 像素的间隙。注意，我们的计算器的间距在图
    36 中看起来稍微好了。


    ![](img/d60259b161c11ca7d937b0831a48a5ef_86_0.png)


    图 36：有间距的控件


    现在我们对控件的整体布局满意了，可以继续为计算器添加功能。


    ## 添加功能


    许多数学运算符需要两个操作数，例如 1+4。我们将维护一个状态变量来记录我们正在读取哪个数字（即运算符的左操作操作数）。我们将保留一个变量来指示用户最初选择了哪个操作数，并指示计算器读取第一个数字（运算符的左操作数）。我们将构建两种类型的操作——需要两个操作数的（例如加法和减法），以及需要单个操作数的（例如自然对数和平方根）。


    ![](img/d60259b161c11ca7d937b0831a48a5ef_87_0.png)


    图 37：状态图


    图 37 显示了一个基础状态图。图 37 显示了一个基础状态图，描述了操作流程。初始，状态将设置为 0，意味着第一个数字。当用户点击运算符时，我们将状态设置为
    1，意味着第二个数字。当用户点击等号时，我们存储结果，将其输出到 `txtOutput` 并重新开始。


    打开代码视图，滚动代码到指定所有成员变量的位置（这些应该是类中定义的第一个变量）。添加新的状态变量，如下：


    ```java

    // 状态变量

    private int state = 0; // 0 表示第一个数字，1 表示第二个。

    private int operator = 0; // 0 表示未知。

    private double number1 = 0.0; // 用于解析第一个操作数。

    private double number2 = 0.0; // 用于解析第二个操作数。

    private double[] memory = new double[5]; // 用于内存功能。

    ```


