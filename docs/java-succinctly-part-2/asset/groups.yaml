  mdcn: "\n\n# 精灵图类 (Sprite sheet class)\n\n当我们制作动画时，会连续快速绘制对象的图像，这些图像之间略有不同。例如，玩家走走的动画可能包含八帧图像，每一帧都与上一帧略有不同。我们可以将动画的每个图像存储在单独的文件中，但将动画的所有图像存储在单个文件中通常更方便。这类图像被称为精灵图（sprite\
    \ sheets）或精灵图集（sprite atlases）。\n\n有很多图像格式——BMP、PNG、JPG、TIFF 等。每种格式都为特定用途设计。PNG\
    \ 是精灵的首选格式，因为它经过压缩，通常比位图小，并且允许 Alpha 透明通道。与 JPG（也是压缩格式）不同，PNG 图像的压缩是无损的，这意味着我们保留了绘制的每个像素的精确值。\n\
    \n代码代码列表 8.2：精灵图类\n\n```java\nimport java.awt.Graphics2D;\nimport java.awt.image.BufferedImage;\n\
    import java.io.File;\nimport java.io.IOException;\nimport javax.imageio.ImageIO;\n\
    \npublic class SpriteSheet{\n    private BufferedImage bmp; // 加载的图像。\n    private\
    \ int spritesAcross = -1;// 图像水平方向精灵的数量。\n    private int totalSprites; // 图像中精灵的总数。\n\
    \    private int spriteWidth, spriteHeight;// 每个精灵的宽度/高度。\n\n    // 构造函数\n   \
    \ public SpriteSheet(String filename, int spriteWidth, int spriteHeight) {\n \
    \       // 加载位图。\n        try {\n            bmp = ImageIO.read(new File(filename));\n\
    \        } catch(IOException e) {\n            // 未找到文件。\n            spritesAcross\
    \ = -1;\n            return;\n        }\n        // 保存精灵的宽度和高度。\n        this.spriteWidth\
    \ = spriteWidth;\n        this.spriteHeight = spriteHeight;\n        // spritesAcross\
    \ 用于在渲染时计算\n        // 源矩形。\n        spritesAcross = bmp.getWidth() / this.spriteWidth;\n\
    \        // totalSprites 用于确保我们不是\n        // 尝试渲染不存在的精灵。）\n        totalSprites\
    \ = spritesAcross * (bmp.getHeight()) / spriteHeight);\n\n        // 此方法可以测试精灵是否已加载。\n\
    \    public Boolean isValid() {\n        return spritesAcross != -1;\n    }\n\n\
    \    public void render(Graphics2D g, int spriteIndex, int x, int y) {\n     \
    \   // 确保精灵确实在我们的精灵图上。\n        if(spriteIndex >= totalSprites) return;\n    \
    \    // 计算 x 和 y。\n        int srcX = (spriteIndex % spritesAcross) * spriteWidth;\n\
    \        int srcY = (spriteIndex / spritesAcross) * spriteWidth;\n        // 绘制图像。\n\
    \        g.drawImage(bmp,\n            x, // 目标 x1\n            y, // 目标 y1\n\
    \            x + spriteWidth, // 目标 x2\n            y + spriteHeight, // 目标 y2\n\
    \            srcX, // 源 x1\n            srcY, // 源 y1\n            srcX + spriteWidth,\
    \ // 源 x2\n            srcY + spriteHeight, // 源 y2\n            null); // 观察者\n\
    \    }\n}\n```\n\n代码列表 8.2 显示了一个简单的精灵图类。成员变量是一个缓冲图像（它只是从磁盘加载到 RAM 中以便快速访问的图像存储器）以及几个简单的记录——`spriteWidth/Height`、`totalSprites`\
    \ 和 `spritesAcross`。该类在构造函数中接收一个文件名以及精灵的宽度和高度。该文件可以是任何 2D 图像格式，但我们将使用 PNG。\n\n\
    # GNU 图像处理程序 (Gimp)\n\n我使用 Gimp 为我们的测试应用程序创建了精灵图（Gimp 是一个非常强大的绘画和照片处理程序，可以从 https://www.gimp.org/免费免费）。图\
    \ 43 中的精灵显示了一个飞船、一个看起来像陨石坑、一个子弹、一个绿墙、一些星形和一个小型爆炸。\n\n> 注意：我使用 Gimp 创建本文中的精灵是因为它强大、跨平台且功能丰富。读者可能感兴趣的许多应用程序也可用：Piskel\
    \ 是从 http://www.piskel.com/ 获取的在线精灵工具。Aseprite 是从 http://www.aseprite.org/ 获取的优秀桌面精灵编辑器。SpriteRing\
    \ 是从 https://brushmonkey.com/ 获取的免费和付费版精灵编辑器。\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_102_0.png)\n\
    \n图 43：精灵\n\n> 提示：我们在 Gimp（或其他图像编辑器）中绘制图像时，我们不希望丢失任何精度——我们想要每个像素的精确颜色。出于这个原因，我建议你在\
    \ Gimp 中处理图像，并将其保存为专用格式（包含层、像素颜色、路径等额外信息）。当我们在游戏中使用该图像时，将其导出为 PNG 图像（PNG 不包含层、路径等）。通过这种方式，如果你需要编辑图像，Gimp\
    \ 中的层和选择信息将被保留，并且最终导出图像将具有 PNG 的灵活性。\n\n右键点击图 43 并点击复制，然后将图像作为新图像粘贴到 Gimp 中（取决于使用的\
    \ PDF 阅读器，操作细节可能不同）。打开 Gimp（或你选择的其他图像编辑器），在**粘贴为 (Paste as)** 下选择**新建图像 (New Image)**，如图\
