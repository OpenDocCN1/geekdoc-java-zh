    \ \n                \"int: \" + i + \"\\n\" + \n                \"float: \" +\
    \ f + \"\\n\" + \n                \"boolean: \" + b + \"\\n\" + \n           \
    \     \"double: \" + d\n            );\n        } catch (FileNotFoundException\
    \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n# 序列化\n\n\
    我们经常想要保存对象以便在机器关闭并重新启动后恢复它们。将对象转换为机器保存到磁盘格式的行为被称为序列化。我们可以采用前面的文本读取/写入方法和\n\n"
