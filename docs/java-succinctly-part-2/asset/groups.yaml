  - "[PAGE 100]\n\n# Sprite sheet class\n\nWhen we animate, we draw images of our\
    \ objects in quick succession that are slightly different from each other. For\
    \ instance, an animation of the player walking might consist of eight frames,\
    \ slightly different from the last. We could store each image of our animation\
    \ in a separate image file, but storing all the images of an animation in a single\
    \ file is often more convenient. Such images are called sprite sheets or sprite\
    \ atlases.\n\nThere are many image formats–BMP, PNG, JPG, TIFF, etc. Each format\
    \ is designed for specific purposes. The PNG is the format of choice for sprites\
    \ because it is compressed, generally smaller than a bitmap, and it allows alpha\
    \ transparency. Unlike JPG (which is also compressed), the compression for PNG\
    \ images is lossless, which means we retain the exact values of every pixel we\
    \ draw in our.\n\nCode Listing 8.2: Sprite Sheet Class\n\n```\nimport java.awt.Graphics2D;\n\
    import java.awt.image.BufferedImage;\nimport java.io.File;\nimport java.io.IOException;\n\
    import javax.imageio.ImageIO;\n\npublic class SpriteSheet{\n    private BufferedImage\
    \ bmp; // The loaded image.\n    private int spritesAcross = -1;// Number of sprites\
    \ across the image.\n    private int totalSprites; // Total sprites in the image.\n\
    \    private int spriteWidth, spriteHeight;// width/height of each sprite.\n\n\
    \    // Constructor\n    public SpriteSheet(String filename, int spriteWidth,\
    \ int spriteHeight) {\n        // Load the bitmap.\n        try {\n          \
    \  bmp = ImageIO.read(new File(filename));\n        } catch(IOException e) {\n\
    \            // File not found.\n            spritesAcross = -1;\n           \
    \ return;\n        }\n        // Save the sprite width and height.\n        this.spriteWidth\
    \ = spriteWidth;\n        this.spriteHeight = spriteHeight;\n        // spritesAcross\
    \ is used to compute the\n        // source rectangles when rendering.\n     \
    \   spritesAcross = bmp.getWidth() / this.spriteWidth;\n        // totalSprites\
    \ is used to ensure we're not\n        // trying to render sprites that do not\
    \ exist.)\n```"
  - "[PAGE 101]\n\n```\ntotalSprites = spritesAcross * (bmp.getHeight()) /\nsppriteHeight);\n\
    \n// This method can be used to test if the sprites loaded.\npublic Boolean isValid()\
    \ {\n    return spritesAcross != -1;\n}\n```\n\n```\npublic void render(Graphics2D\
    \ g, int spriteIndex, int x, int y) {\n    // Make sure the sprite is actually\
    \ on our spriteSheet.\n    if(spriteIndex >= totalSprites) return;\n    // Compute\
    \ the x and y.\n    int srcX = (spriteIndex % spritesAcross) * spriteWidth;\n\
    \    int srcY = (spriteIndex / spritesAcross) * spriteWidth;\n    // Draw the\
    \ image.\n    g.drawImage(bmp,\n        x, // Destination x1\n        y, // Destination\
    \ y1\n        x + spriteWidth, // Destination x2\n        y + spriteHeight, //\
    \ Destination y2\n        srcX, // Source x1\n        srcY, // Source y1\n   \
    \     srcX + spriteWidth, // Source x2\n        srcY + spriteHeight, // Source\
    \ y2\n        null); // Observer\n}\n```\n\nCode Listing 8.2 shows a simple sprite\
    \ sheet class. The member variables are a buffered image (which is simply a storage\
    \ for an image loaded from the disk in RAM for quick access) and several simple\
    \ records—spriteWidth/Height,totalSprites, and spritesAcross. The class takes\
    \ a filename in a constructor and a width and height for the sprites. The file\
    \ can be any 2-D image format, but we will use PNG.\n\n# GNU image manipulation\
    \ program (Gimp)\n\nI created the image for our test application for our sprite\
    \ sheet using Gimp (which is a very powerful drawing and photo manipulation program,\
    \ available free from https://www.gimp.org/). The sprites in Figure 43 show a\
    \ spaceship, a nearly-looking crater, a bullet, a green wall, some stars, and\
    \ a small explosion.\n\n> Note: I used Gimp for creating our sprites in this text\
    \ because it is powerful, cross-platform, and powerful. Many applications that\
    \ readers might want to explore are also available. Piskel is an online sprite\
    \ creation tool available from http://www.piskel.com/. Asprite is an excellent,\
    \ small-desktop sprite editor available from http://www.aseprite.org/. Spriter\
    \ by BrushMonkey is an excellent sprite editor with free and paid versions available\
    \ from https://brashmonkey.com/."
