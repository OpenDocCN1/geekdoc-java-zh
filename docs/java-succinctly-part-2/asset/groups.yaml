    \ interface, we need to define what it means for the instances to be greater and\
    \ less than each other. I have selected the meaning to be based on the absolute\
    \ magnitude of the points (i.e. the distance from 0 on a 2-D plane, which is the\
    \ square root of (x*x+y*y)). You will notice that I used the boxed version, Double,\
    \ because the native double does not implement the Comparable interface, while\
    \ the boxed version, Double does. After we have computed the distance between\
    \ this and o, we call Double.compareTo and return the result. I also included\
    \ a comment at the end of the code that roughly how the Double.compareTo method\
    \ will behave.\n\nNow that we have a class that implements the Comparable interface,\
    \ we can create a collection of instances from our Point class and sort them using\
    \ the standard Java sorting. Next, let's create a new class called MainClass.\
    \ The code for this class is presented in Code Listing 3.12.\n\nCode Listing 3.12:\
    \ Sorting of Comparable Objects\n\n```\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
    \npublic class MainClass {\n    public static void main(String[] args) {\n   \
    \     // The total number of points in the demo:\n        int numberOfPoints =\
    \ 5;\n\n        // Create a list of random points:\n        ArrayList<Point> points\
    \ = new ArrayList<Point>();\n        for(int i = 0; i < numberOfPoints; i++)\n\
    \            points.add(new Point(Math.random() * 100));\n\n        // Print the\
    \ unsorted points:\n        System.out.println(\"Unsorted: \");\n        for(int\
    \ i = 0; i < numberOfPoints; i++)\n            points.get(i).print();\n\n    \
    \    // Sort a collection of Comparable objects:\n        Collections.sort(points);\n\
    \n        // Print the sorted points:\n        System.out.println(\"Sorted: \"\
    );\n        for(int i = 0; i < numberOfPoints; i++)\n            points.get(i).print();\n\
    \    }\n```"
