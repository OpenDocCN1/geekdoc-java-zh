    # # Threads


    A thread is an execution unit. For instance, when our application is run by the
    user, the JVM will create a single, main thread for us to begin executing the
    main method. It may also create several background threads for garbage collection
    (to delete unused objects beyond the scenes), and other background tasks. The
    main thread begins by executing the code from the main method, as we have seen
    many times.


    # # Call stack


    When a thread executes code, it jumps to various points in the code while it calls
    the methods. These method calls can be nested (i.e. a method can call itself;
    it can call methods). Methods may require parameters to be passed, and they can
    specify their own local variables. In order to return from methods in the correct
    order, to pass parameters to and from methods, and to keep track of the local
    variables of methods, an area of RAM is allocated called the "call stack". Each
    thread has its own call stack, and threads can potentially call any sequence of
    methods.


