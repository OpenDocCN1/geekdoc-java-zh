    points.sort(Collections.reverseOrder());\n\n// Print the points sorted in reverse:\n\
    System.out.println(\"Sorted in Reverse: \");\nfor(int i = 0; i < numberOfPoints;\
    \ i++)\n    points.get(i).print();\n\n```\n\nIn Code List 3.12, we use Collections.sort\
    \ and points.sort(Collections.reverseOrder) in order to sort the points and also\
    \ sort them in reverse order. These sorting methods are designed for use with\
    \ any objects that implement the Comparable interface. This means we do not have\
