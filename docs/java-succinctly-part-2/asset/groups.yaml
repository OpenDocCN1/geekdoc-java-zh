    \n![](img/d60259b161c11ca7d937b0831a48a5ef_7_1.png)\n\n## 关于作者\n\nChristopher\
    \ Rose 是一位澳大利亚软件工程师。他的背景主要是数据挖掘和用于医学研究的图表软件。他还开发过桌面和移动应用，并为 YouTube 上的教育频道制作了一系列编程视频。他也是一名音乐家，经常在昆兰州波马纳的帝国剧院为默电影伴奏。\n\
    \n## 引言\n\n这是《Java Succinctly》两部系列中的第二本电子书。如果你还没有读过第一本《Java Succinctly 第 1 部分》，而且你不熟悉\
    \ Java 语言的基础知识，我强烈建议你先读那本电子书。在本卷中，我们将专注于 Java 的更高级特性，包括多线程、构建 GUI 应用程序以及二维图形/游戏编程。代码示例可以在此处找到。\n\
    \n编程计算机需要大量的练习，这意味着我们不可避免地会出错，并无意中导致程序崩溃、挂机或以其他方式运行，这会让你变成终端用户。我建议你复制代码示例以了解工作原理。然后，继续添加功能和特性（记得100年前，地球上没有人能要求这一点）。\n\
    \n## 包\n\n包提供了一种组织类的方式。它们允许我们避免命名冲突，因为同名的类可以存在不同的包中。同样，一个包可以包含多个文件。\n\n## 手动添加包\n\
    \n为了将类放在包中，你必须在文件顶部使用包声明。\n\n```java\npackage MainPackage;\n\npublic class MainClass\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello, World!\");\n    }\n}\n```\n\n如果你将文件放在与包声明不匹配的文件夹中，IDE 会划线该行。这是因为 IDE 期望文件夹与包名匹配。\n\
    \n## 使用 Eclipse 建议添加包\n\n当出现错误或警告时，Eclipse 会划线出错的代码部分。我们可以将光标悬停在上面，Eclipse 会弹出建议。\n\
    \n```java\npackage MainPackage;\n// 声明的包 \"MainPackage\" 与预期的 \"\" 不匹配\n// 可快速修复：\n\
    // 将 'MainClass.java' 移动到包 'MainPackage'\n// 删除包声明 'package MainPackage'\n}\n\
    ```\n\n图3 显示了修复 `package MainPackage` 一行的 Eclipse 建议。第一个建议是将 `MainClass.java`\
    \ 移动到包 `MainPackage`。这正是我们想要的，所以点击此建议，Eclipse 就会在包管理器中创建文件夹。\n\n## 创建多个包\n\n让我们在不同的包中添加另一个类，并看看如何使用\
    \ `import` 关键字进行导入。\n\n```java\npackage OtherPackage;\n\nimport MainPackage.MainClass;\n\
    \npublic class OtherClass {\n    public static void main(String[] args) {\n  \
    \      MainClass mc = new MainClass();\n    }\n}\n```\n\n"
