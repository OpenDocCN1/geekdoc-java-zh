  mdcn: "\n\n## 第 6 章 GUI 编程简介\n\n在本章中，我们将介绍 Java 提供的一些机制，这些机制允许我们设计和实现图形用户界面（GUI）。在下一章中，我们将使用窗口生成器创建一个带有\
    \ GUI 的应用程序，但为了让代码具有意义，我们必须学习如何手动构建 GUI。\n\n在 Java 中，我们可以使用两个包之一为用户提供 GUI——抽象窗口工具包（AWT）或\
    \ Swing。AWT 已经在很大程度上被 Swing 取代，本章将介绍如何使用 Swing 进行 GUI 编程。Swing 工具包是 AWT 的封装，这意味着在使用\
    \ Swing 工具包进行编程时，我们需要同时导入 Swing 和 AWT。\n\nGUI是通过在窗口上放置控件（如按钮、图片框、组合框等）创建的。用户使用鼠标或键盘与控件交互。Swing\
    \ 控件的名称以字母 J 开头，例如 JFrame 和 JButton。\n\n从创建一个新项目开始。我将我的项目命名为 GUITesting。如代码列表\
    \ 6.0 所示，添加一个继承 JFrame 类的类。JFrame 是窗口——它在右上角有一个控制框，允许用户关闭窗口，并且窗口可以像普通窗口一样在用户的桌面上调整大小和移动。\n\
    \n> 代码列表 6.0：MainWindow.java\n\n```java\nimport java.awt.*;\nimport javax.swing.*;\n\
    \npublic class MainClass extends JFrame{\n    // Main 方法\n    public static void\
    \ main(String[] args) {\n        MainClass mainWindow = new MainClass();\n   \
    \ }\n\n    // 构造函数\n    public MainClass() {\n        // 设置窗口的大小。\n        this.setSize(640,\
    \ 480);\n\n        // 设置窗口关闭时应用程序关闭。\n        this.setDefaultCloseOperation(EXIT_ON_CLOSE);\n\
    \n        // 设置窗口为可见。\n        this.setVisible(true);\n    }\n}\n```\n\n代码列表 6.0\
    \ 显示了一个名为 **MainClass** 的简单类，它创建并显示了一个空白窗口（见图 14）。该类包含 **main** 方法，该方法的作用除了创建一个名为\
    \ **mainWindow** 的新 **MainClass** 对象外没有其他作用。在构造函数中，我们将窗口的大小设置为 **640**x480 像素，并将可见性设置为\
    \ **true**。注意该类继承（**extends**）JFrame 类。`setDefaultCloseOperation` 方法导致我们在关闭窗口时关闭应用程序。如果没有调用\
    \ `setDefaultCloseOperation`，即使用户关闭了窗口，应用程序也会继续在后台运行。\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_63_0.png)\n\
    \n图 14：空白 JFrame\n\n为了添加控件，我们可以创建一个新的 **JPanel** 对象。**JPanel** 是包含其他控件的控件。你也可以通过创建一个\
    \ Container 对象并调用 `this.getContent()` 方法直接将控件添加到 **JFrame** 本身，但我们将使用 **JPanel**。代码列表\
    \ 6.1 显示了如何向项目中创建并添加新的 **JPanel** 以及一些控件。\n\n代码列表 6.1：向 JPanel 添加控件\n\n```java\n\
    // 构造函数\npublic MainClass() {\n    // 创建一个 JPanel\n    JPanel panel = new JPanel(new\
    \ FlowLayout());\n\n    // 添加一些控件。\n    panel.add(new JLabel(\"Test Button: \"\
    ));\n    panel.add(new JButton(\"Click me!\"));\n\n    // 将当前内容面板设置为该面板。\n   \
    \ this.setContentPane(panel);\n\n    // 设置窗口的大小。\n    this.setSize(640, 480);\n\
    \n    // 设置窗口关闭时应用程序关闭。\n    this.setDefaultCloseOperation(EXIT_ON_CLOSE);\n\n\
    \    // 设置窗口为可见。\n    this.setVisible(true);\n}\n```\n\n为了在代码列表 6.1 中添加标签和按钮，我们使用了\
    \ JPanel 的 add 方法。该方法需要一个控件，而每个控件都有一个接收 String 的构造函数。该 String 通常用作控件在屏幕上显示时的标题。图\
    \ 15 显示了代码列表 6.1 中的标签和按钮。\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_64_0.png)\n\
    \n注意在代码列表 6.1 中，我们在构造函数中创建了 JPanel 并指定了布局。当我们向 JPanel 添加控件时，JPanel 会根据布局进行组织。FlowLayout\
    \ 实际上是 JPanel 的默认布局。使用 FlowLayout，所有控件将以单行方式添加。表 2 包含了所有的布局以及对种布局的简要描述。如需更多信息，请访问\
    \ https://docs.oracle.com/java/tutorial/Swing/layout/visual.html。\n\n## 表 2：布局\n\
    \n| 布局 | 描述 |\n|---|---|\n| BorderLayout | 面板被分为顶、底、左和中间。 |\n| BoxLayout | 将控件置于单行或单列。\
    \ |\n| CardLayout | 允许我们在几组控件之间切换。 |\n| FlowLayout | 将控件排列在单行中。 |\n| GridBagLayout\
    \ | 在网格中排列控件，其中控件可以占据多个单元格。 |\n| GridLayout | 在网格中排列控件。 |\n| GroupLayout | 分别提供水平和垂直布局；为\
    \ GUI 生成器设计。 |\n| SpringLayout | 根据位置之间的关系布局控件；为 GUI 生成器设计。\n\n控件是 GUI 的核心。每种控件类型都有特殊用途。类通常为控件提供特定方法，但许多方法适用于所有控件，如代码列表\
    \ 6.2 所示。\n\n## 代码列表 6.2：有用的控件方法\n\n```java\nJButton btn = new JButton(\"Initial\
    \ Text\");\n\n// 有用的控件方法：\nbtn.setText(\"New text\"); // 设置按钮上的文本。\nString text\
    \ = btn.getText(); // 读取当前文本。\nbtn.setVisible(false); // 从视图隐藏控件。\nbtn.setVisible(true);\
    \ // 显示控件。\nbtn.setMargin(new Insets(100, 100, 100, 100)); // 设置边距。\nDimension\
    \ dim = btn.getSize(); // 读取控件的大小。\nbtn.setBackground(Color.BLUE); // 设置背景颜色。\n\
    btn.setForeground(Color.WHITE); // 设置前景颜色（文本颜色）。\nbtn.setEnabled(false); // 禁用控件的交互。\n\
    btn.setEnabled(true); // 启用控件的交互。\n```\n\n"
