  mdcn: "\n高碰撞检测——如果不允许物体每帧移动超过 16 像素，碰撞检测将最为准确。\n\n图 8.17 显示了我们游戏的截图，其中有恒星、墙壁和敌人。这实际上是“死亡之浪”（Death\
    \ Wave）的一个快照。如果没有死亡之浪，敌人的生成速度将导致屏幕上同时只出现一两个敌人。\n\n![](img/d60259b161c11ca7d937b0831a48a5ef_124_0.png)\n\
    \n图 8.17：恒星、墙壁和敌人\n\n## 读取键盘\n\n在添加英雄的飞船之前，我们需要实现一个控制它的方法。现在让我们来看看如何响应由用户按下并按住键盘按键引起的事件。为了让我们的应用程序响应键盘输入，请添加一个名为\
    \ **Keyboard** 的新类，该类实现了 **KeyListener** 接口。\n\n代码列表 8.21 中的 **Keyboard** 类是单例的示例。这意味着我们将设计一个类，并且永远不会从该类创建多个实例。在\
    \ Java 中有很多种方法设计单例类。我将构造函数标记为 **private**，这防止了该类实例的创建（相反，我们将调用 **Keyboard.init**\
    \ 来初始化单例——这种方法有时被称为工厂模式）。还要注意——该类的方法和按键数组都是静态的（static）。它们属于类而不是类的实例。这实际上意味着 **Keyboard**\
    \ 类作为一个单一的静态对象存在。我们无法创建它，也无法与其交互，我们直接与类本身进行交互。\n\n> 代码列表 8.21：Keyboard 类\n\n```java\n\
    import java.awt.event.KeyEvent;\nimport java.awt.event.KeyListener;\n\npublic\
    \ class Keyboard implements KeyListener {\n    // 256 个按键状态：true 表示按键被按下\n   \
    \ // false 表示按键被松开。\n    private boolean[] keyStates = null;\n```\n\n```java\n\
    // 此类的唯一实例是以下这个\n// 私有的、静态的实例：\nprivate static Keyboard staticInstance = null;\n\
    \n// 私有构造函数：\nprivate Keyboard() {\n    keyStates = new boolean[256];\n}\n\n//\
    \ 公有 init 方法，如果静态键不存在则创建它们。\npublic static void init() {\n    staticInstance =\
    \ new Keyboard();\n    reset();\n}\n\npublic static Keyboard getInstance() {\n\
    \    return staticInstance;\n}\n\n// 将所有按键状态设置为 false。\npublic static void reset()\
    \ {\n    for(int i = 0; i < 256; i++)\n    staticInstance.keyStates[i] = false;\n\
    }\n\n// 测试按键是否被按下。\npublic static boolean isKeyDown(int keyCode) {\n    return\
    \ staticInstance.keyStates[keyCode] & 255;\n}\n\n// 将按键设置为按下；true。\npublic void\
    \ keyPressed(KeyEvent e) {\n    staticInstance.keyStates[e.getKeyCode() & 255]\
    \ = true;\n}\n\n// 将按键设置为松开；false。\npublic void keyReleased(KeyEvent e) {\n  \
    \  staticInstance.keyStates[e.getKeyCode() & 255] = false;\n}\n\n// 来自 KeyListener\
    \ 接口的额外未用方法。\npublic void keyTyped(KeyEvent e) { }\n```\n\nKeyboard 由一个静态的布尔变量数组组成。我们将使用该数组中的一个元素对应\
    \ 256 个可能的按键之一。值为 true 表示某个特定按键被按下，值为 false 表示未被按下。实际上，现代键盘上（考虑到英语以外的语言）有超过 256\
    \ 个可能的按下状态按键。在游戏编程中，我们通常只感兴趣跟踪字母 A 到 Z、数字 0 到 9、方向键、空格键等按键。因此，我们最多只存储包含 256 个不同键的数组，并且只读取用户击中的任何键的最低字节（而不是读取\
    \ Unicode 短整数——这需要一个包含 2^16 不同状态的数组）。当在 init 方法中创建数组时，我们将重置清除所有按键状态为 false，并确保键盘的初始状态没有键被按下。\n\
    \nkeyDown 方法返回指定 keyCode 的当前状态。因此，如果按键已按下，此方法将返回 false。在 keyPressed 事件中，我们读取用户刚刚按下的键，通过位运算将按键范围限制在\
    \ 0 到 255 之间，并将相应的状态清除为 true，这意味着按键正被按下。keyReleased 与 keyPressed 类似，不同在于我们将按键的状态清除为\
    \ false，这意味着它不再被按下。当用户按下按键时，会发生 keyPressed 事件。当用户松开按键时，会发生 keyReleased 事件。当用户输入按键时，会发生\
    \ keyTyped 事件。注意，如果用户按住按键，keyTyped 会重复响应，但我们的游戏并不需要此事件。接下来，我们需要为我们的 MainClass\
    \ 添加一个监听器。MainClass 更新后的构造函数列在代码 8.22 所示。监听器是任何实现了 KeyListener 接口的类。\n\n> 代码 8.22：在\
    \ MainClass 中初始化键盘\n\n```java\nprivate MainClass(int windowwidth, int windowHeight)\
    \ {\n    setSize(windowwidth, windowHeight);// 设置窗口大小。\n    setLocationRelativeTo(null);\
    \ // 默认位置。\n    setDefaultCloseOperation(JFrame.EXIT_CLOSE); // 关闭时退出。\n    setVisible(true);\n\
    \n// 初始化静态单例：\n    Keyboard.init();\n\n// 添加监听器。\n    addKeyListener(Keyboard.getInstance());\n\
    \n// 创建并添加引擎\n    final Engine2D engine = new Engine2D(windowWidth, windowHeight);\n\
    }```\n\nKeyboard 包含一个静态的布尔变量数组。我们将使用该数组中的一个元素对应 256 个可能的按键之一。值为 true 表示某个特定按键被按下，值为\
    \ false 表示未被按下。实际上，现代键盘上（考虑到英语以外的语言）有超过 256 个可能的按下状态按键。在游戏编程中，我们通常只感兴趣跟踪字母 A 到\
    \ Z、数字 0 到 9、方向键、空格键等按键。因此，我们最多只存储包含 256 个不同键的数组，并且只读取用户击中的任何键的最低字节（而不是读取 Unicode\
    \ 短整数——这需要一个包含 2^16 不同状态的数组）。当在 init 方法中创建数组时，我们将重置清除所有按键状态为 false，并确保键盘的初始状态没有键被按下。\n\
    \nkeyDown 方法返回指定 keyCode 的当前状态。因此，如果按键已按下，此方法将返回 false。在 keyPressed 事件中，我们读取用户刚刚按下的键，通过位运算将按键范围限制在\
    \ 0 到 255 之间，并将相应的状态清除为 true，这意味着按键正被按下。keyReleased 与 keyPressed 类似，不同在于我们将按键的状态清除为\
    \ false，这意味着它不再被按下。当用户按下按键时，会发生 keyPressed 事件。当用户松开按键时，会发生 keyReleased 事件。当用户输入按键时，会发生\
    \ keyTyped 事件。注意，如果用户按住按键，keyTyped 会重复响应，但我们的游戏并不需要此事件。接下来，我们需要为我们的 MainClass\
