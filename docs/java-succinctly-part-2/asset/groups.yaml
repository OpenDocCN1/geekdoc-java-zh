    for(Animal a: animals) {\n    a.print();\n}\n```\n\n# 第3章 多态\n\n多态（Polymorphism）是一个术语，指的是代码在每次执行时可能表现出不同的行为。在中中有许多类型的多态，但该术语通常指面向对象编程中的一种特定机制。我们的目标是定义一个带有某些方法或多个方法的父类，然后定义多个继承并为方法定义不同代码的类。然后，当使用子类执行该方法时，子类将执行它们自己特定版本的方法。\n\
    \n为了说明相同代码如何表现出不同的行为，想象一下我们正在创建一个游戏（我们将在本电子书的最后一章实现一个游戏）。在游戏中，通常有一个由对象、非玩家角色（NPC）和玩家组成的虚拟世界。游戏中的每个对象都能移动，这意味着我们可以创建一个带有抽象方法\
    \ `move` 的通用 `GameObject` 类（如代码列表15所示）。\n\n# 抽象类\n\n代码 3.0: GameObject 类\n\n```java\n\
    // 抽象父类：\npublic abstract class GameObject {\n    // 抽象方法：\n    public abstract\
    \ void move();\n}\n```\n\n注意 `GameObject` 类被标记了 `abstract`（抽象）关键字。这是一种安全措施——我们不想从通用的\
    \ `GameObject` 类创建任何实例，因此我们将其标记为抽象以防止实例的创建。任何带有一个或多个抽象方法的类都必须被标记为抽象。该类拥有 `move`\
    \ 方法，它是抽象的，因此整个类必须是抽象的。如果你尝试创建 `GameObject` 类的实例，Eclipse 将给出一个错误：无法创建，因为我们无法在\
    \ `GameObject` 中为 `move` 定义方法体并完全移除抽象关键字，但这样做可能并不明智——为了让我们我们游戏中的对象有用，它必须是某种特定类型，而不仅仅是通用的“无名”。\n\
    \n注意 `move` 方法没有方法体。它只包含一个带有分号的声明。我们表示存在另一个类（或多个类）能够执行 `move` 功能。我们可能想将这些其他类的实例称为\
    \ `GameObject` 对象，但它们必须指定 `move` 方法的作用，或者它们本身是抽象的。\n\n现在让我们定义一些继承自 `GameObject`\
    \ 类的类。当 NPC 移动时，我们在玩家移动时必须执行不同的代码。NPC 由计算机控制，它们通常采用某种人工智能（AI）的形式来与玩家交流或在城镇里闲逛。相反，玩家不受计算机控制。玩家需要用户的输入。因此，我们可以从\
    \ `GameObject` 类创建两个派生类，称为 `NPC` 和 `Player`，如代码列表 3.1 和 3.2 所示。\n\n# 代码列表 3.1:\
    \ NPC 类\n\n```java\npublic class NPC extends GameObject {\n    public void move()\
    \ {\n        System.out.println(\"店主在无目的地地闲逛...\");\n    }\n}\n```\n\n# 代码列表 3.2:\
    \ Player 类\n\n```java\npublic class Player extends GameObject {\n    public void\
    \ move() {\n        System.out.println(\"轮到玩家移动...\");\n        // 轮询键盘或读取鼠标移动等。\n\
    \    }\n}\n```\n\n在代码列表 3.1 和 3.2 中，我们使用 **extends** 关键字定义了继承自 `GameObject` 类的子类。**extends**\
    \ 关键字意味着 `GameObject` 类中的所有的成员变量和成员方法也属于这个类。我们创建的被称为类层次结构（class hierarchy），类似于家族树。父类位于顶部，定义了下级类继承的所有元素（见图9）。下级类描述比父类更具体的项目。在我们的案例中，父类描述了一个通用方法，而子类定义了它的含义。\n\
    \n![](img/d60259b161c11ca7d937b0831a48a5ef_31_0.png)\n\n图9: GameObject 类层次结构\n\
    \n现在我们可以将游戏中的所有对象存储在一个集合中，并可以通过遍历集合调用 `move` 方法——这两种都是源自类层次结构的优势。\n\n我们可以创建 `NPC`\
    \ 和 `Player` 的实例并将它们存储在 `GameObject` 集合中。所有的 NPC 都是 `GameObject`，所有的 `Player`\
    \ 类实例也是 `GameObject`。代码列表 3.3 显示了一个示例方法，它使用了 `GameObject` 集合，但利用多态来调用两个不同版本的 `move`。\n\
    \n# 代码列表 3.3: 多态\n\n```java\npublic class MainClass {\n    public static void\
    \ main(String[] args) {\n        // 在我们的游戏中创建5个对象。\n        GameObject[] gameObjects\
    \ = new GameObject[5];\n\n        // 第一个对象是玩家。\n        gameObjects[0] = new Player();\n\
    \n        // 其他对象是 NPC。\n        for(int i = 1; i < 5; i++) {\n            gameObjects[i]\
    \ = new NPC();\n        }\n\n        // 调用游戏中所有对象的 move。\n        for(int i =\
    \ 0; i < 5; i++) {\n            gameObjects[i].move();\n        }\n    }\n}\n\
