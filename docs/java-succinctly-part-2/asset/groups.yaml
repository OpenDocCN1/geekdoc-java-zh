- raw:
  - '[PAGE 6]


    # The Story Behind the Succinctly Series of Books


    Daniel Jebaraj, Vice President Syncfusion, Inc.


    # Staying on the cutting edge


    As many of you may know, Syncfusion is a provider of software components for the
    Microsoft platform. This puts us in the exciting but challenging position of always
    being on the cutting edge.


    Whenever platforms or tools are shipping out of Microsoft, which seems to be about
    every week these days, we have to educate ourselves, quickly.


    # Information is plentiful but harder to digest


    In reality, this translates into a lot of book orders, blog searches, and Twitter
    scans.


    While more information is becoming available on the Internet and more books are
    being published, even on topics that are relatively new, one aspect that continues
    to inhibit us is the inability to find concise technology overview books.


    We are usually faced with two options: read several 500+ page books or scour the
    web for relevant blog posts and articles. As everyone else has a job to do and
    customers to serve, we find this quite frustrating.


    # The Succinctly series


    This frustration translated into a deep desire to produce a series of concise
    technical books that would be targeted at developers working on the Microsoft
    platform.


    We firmly believe, given the background knowledge such developers have, that most
    topics can be translated into books that are between 50 and 100 pages.


    This is exactly what we resolved with the Succinctly series. Isn''t everything
    wonderful out of a deep desire to change things for the better?


    # The best authors, the best content


    Each author was carefully chosen from a pool of talented experts who shared our
    vision. The book you hold now in your hands, and others available in this series,
    are a result of the authors tireless work. You will find original content that
    is guaranteed to get you up and running about the time it takes to drink a few
    cups of coffee.


    # Free forever


    Syncfusion will be working to produce books on several topics. The books will
    always be free. Any updates we publish will also be free.'
  - '[PAGE 7]


    # Free? What is the catch?


    There is no catch here. Syncfusion has a vested interest in this effort.


    As a component vendor, our unique claim has always been that we offer deeper and
    broader frameworks than anyone else on the market. Developer education greatly
    helps us market and sell against competing vendors who promise to "enable AJAX
    support with one click," or "turn the moon to cheese!”


    # Let us know what you think


    If you have any topics of interest, thoughts, or feedback, please feel free to
    send them to us at succinctly-series@syncfusion.com.


    We sincerely hope you enjoy reading this book and that it helps you better understand
    the topic of study. Thank you for reading.


    Please follow us on Twitter and "Like" us on Facebook to help us spread the word
    about the Succinctly series!


    ![](img/d60259b161c11ca7d937b0831a48a5ef_7_0.png)


    ![](img/d60259b161c11ca7d937b0831a48a5ef_7_1.png)'
  - '[PAGE 8]


    # About the Author


    Christopher Rose is an Australian software engineer. His background is mainly
    in data mining and charting software for medical research, He has also developed
    desktop and mobile apps and a series of programming videos for an educational
    channel on YouTube. He is a musician and can often be found accompanying silent
    films at the Majestic Theatre in Pomona, Queensland.'
  - '[PAGE 9]


    # Introduction


    This is the second e-book in the two-part series Java Succinctly. If you have
    not read the first book, Java Succinctly Part 1, and if you are not familiar with
    the basics of the Java language, I strongly recommend you read that e-book first.
    In this volume, we will concentrate on more advanced features of Java, including
    multithreading, building GUI applications, and 2-D graphics/game programming.
    Code samples can be found here.


    Programming computers requires a lot of practice, which means we will inevitably
    make mistakes and unintentionally cause our programs to crash, hang, and otherwise
    behave in ways that would make you an end user. I recommend that you copy and
    paste the code samples here to get an overview of how things work. Then, go ahead
    and change things later—add new functionality and features to the programs (particularly
    the Calculator and Space Game applications presented in Chapters 7 and 8). This
    will give you good insight into a computer programmer''s power. Remember that
    100 years ago, there was nobody on Earth who could sensibly demand a billion computations
    to be performed in one second, yet this is trivial for a modern computer programmer.
    We do it all the time!


    Test your programs constantly, and use the debugging features of the IDE (assert,
    which we will look at in this book), variable watches, and breakpoints, etc. Save
    your projects very frequently, too.


    Without further ado, let us explore some of the powerful and practical features
    of Java!'
  - "[PAGE 10]\n\n# # Chapter 1 Packages and Assert\n\n# ## Packages\n\nPackages offer\
    \ a way to organize classes into groups. They allow us to have multiple classes\
    \ with the same name that belong to different packages, and they allow us to reuse\
    \ code. A package is like a folder on a computer. A folder can contain multiple\
    \ files, just like a package contains multiple classes. And there can be two files\
    \ with the exact same name, so long as they are in different folders. Similarly,\
    \ you can have two items with the exact same identifier in different packages.\
    \ When we use the import keyword, we can specify the packages and classes to import\
    \ from.\n\n# ## Adding a package manually\n\nIn order to place your class into\
    \ a new package, you must use the package keyword, followed by the package name,\
    \ as in Code Listing 1.0.\n\n> Code Listing 1.0: Package Keyword\n\n```\npackage\
    \ MainPackage;\n\npublic class MainClass {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"This class belongs to the MainPackage\
    \ package!\");\n    }\n}\n```\n\nYou will notice that the first line of this code\
    \ is underlined in red in Eclipse. This is because at the moment, there is no\
    \ package called MainPackage. We can add the main package in two ways. The first\
    \ is by right-clicking the src folder in the Package Explorer, then selecting\
    \ New and Package from the context menus. This will bring up a dialog box in which\
    \ you can type a name for your new package."
  - '[PAGE 11]


    ![](img/d60259b161c11ca7d937b0831a48a5ef_11_0.png)


    Figure 1: Adding a New Package


    In the New Package (the right window) you can specify a new folder for your package.
    I have left the folder as src. When you name the new package and click Finish,
    Eclipse will add the new package, but you will notice that MainClass is not included
    in our new package, it remains part of the default package. You drag the MainClass.java
    file into the MainPackage using the Package Explorer, as in Figure 2. When you
    move your mouse over MainClass to the Main package, you will be prompted to save
    the first file. When the move operation is complete, and if there are no classes
    in the default package, you will notice that the default package is removed from
    your project.


    ![](img/d60259b161c11ca7d937b0831a48a5ef_11_1.png)


    Figure 2: Drag MainClass.java into MainPackage


    # # Adding packages using Eclipse suggestions


    The second method for adding the package is to use Eclipse''s built-in suggestion
    feature. Whenever there is an error or warning in the code, Eclipse will underline
    the suspect portion of code. We can hover our mouse cursor over it, and Eclipse
    will pop up a box of suggestions as to how to remedy the problem.


    > > Note: In this e-book, I have Eclipse as the IDE, but many other IDEs allow
    you to create Java applications. You might like to explore other IDEs, such as
    NetBeans, IntelliJ, and Android Studio (which is a version of Eclipse primarily
    designed to assist Android application development).'
  - "[PAGE 12]\n\n```\n```java\nMainClass.java\npackage MainPackage;\n    // The declared\
    \ package \"MainPackage\" does not match the expected package \"\"\n    // 2 quick\
    \ fixes available:\n    public class MainClass {\n        // Move 'MainClass.java'\
    \ to package 'MainPackage'\n        // Remove package declaration 'package MainPackage'\n\
    \    }\n}\n```\n```\n\nFigure 3 shows two Eclipse suggestions for remedying the\
    \ problem line `package MainPackage` when there is no MainPackage. The first suggestion\
    \ is to move MainClass.java to package MainPackage. This is exactly what we want\
    \ to do, so we click this suggestion and Eclipse will create the problem in the\
    \ Package Explorer, then move MainClass.java there for us.\n\nBefore we fix the\
    \ problem, let's also note that there is a light bulb icon in the margin of the\
    \ code at the point where MainPackage is underlined. You can click this icon to\
    \ receive the same suggestions as you get by hovering with the mouse cursor.\n\
    \nBe sure to read Eclipse's suggestions very carefully—especially when dealing\
    \ with large-scale changes such as adding and removing classes from package. If\
    \ you are new to programming, good practice is to fix the problems manually before\
    \ reverting to Eclipse's suggestions. Programming large-scale projects requires\
    \ a degree of fluency that can only be obtained through practice.\n\n# Creating\
    \ multiple packages\n\nLet's add another class in a different package and see\
    \ how we can import using the import keyword. Add a new class called `OtherClass`.\
    \ Place `OtherClass` into a package called `OtherPackage` using Eclipse's suggestion\
    \ or by adding it to the Package Explorer, as we did a moment ago with `MainClass`.\n\
    \n![](img/d60259b161c11ca7d937b0831a48a5ef_12_0.png)\n\nFigure 4: Two Packages\n\
    \nFigure 4 shows the two classes, each in a separate package. The code for the\
    \ OtherClass.java is listed in Code Listing 1.1."
