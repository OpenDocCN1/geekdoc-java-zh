    # Chapter 5 Multithreading


    Multithreading is a technique for programming more than one execution unit at
    the same time. Computers traditionally run with a single CPU executing the code.
    The CPU runs through the instructions one after another, jumping to various methods.
    CPUs execute code very quickly, but there is a limit to the speed any CPU can
    execute. A modern CPU can execute billions of instructions every second, but it
    is very costly to increase this execution speed—the hardware begins to require
    extreme measures to prevent the CPU from melting or catching on fire (for instance,
    water and even liquid nitrogen have been used to cool very fast CPUs).


