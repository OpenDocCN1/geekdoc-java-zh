  \ Test”字样）。最后，通过调用打印管理器的 `print()` 方法启动打印任务，传递任务名称、适配器和默认属性。在运行 Android 5.0 或更高版本的设备或模拟器上编译并运行应用程序。启动后，将出现如图\
