  \n\n\n构建并重新运行应用以确保这些更改生效。\n\n## 36.5 使用 Binding 类\n\n下一步是修改 `FirstFragment.java`\
  \ 文件代码以膨胀数据绑定（data binding）。最佳方法是重写 `onCreateView()` 方法：\n\n```java\nimport androidx.databinding.DataBindingUtil;\n\
  import com.ebookfrenzy.viewmodeldemo.R;\n\npublic class MainFragment extends Fragment\
  \ {\n    public View onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup\
  \ container,\n                            @Nullable Bundle savedInstanceState) {\n\
  \        binding = FragmentMainBinding.inflate(inflater, container, false);\n  \
  \      binding = DataBindingUtil.inflate(\n                inflater, R.layout.fragment_first,\
  \ container, false);\n        binding.setLifecycleOwner(this);\n        return binding.getRoot();\n\
  \    }\n}\n```\n\n旧代码膨胀了 `fragment_first.xml` 布局文件（换句话说，创建了包含所有视图对象的布局），并返回根视图的引用（顶层布局容器）。Data\
  \ Binding Library 包含一个工具类，它提供了一个特殊的膨胀方法，该方法在构建 UI 之外，还会初始化并返回布局数据绑定类的实例。新代码调用此方法并将绑定类实例的引用存储在变量中：\n\
  \n```java\nbinding = DataBindingUtil.inflate(\n        inflater, R.layout.fragment_first,\
  \ container, false);\n```\n\n绑定对象必须在 fragment 存在期间保留在内存中。为了确保在 fragment 消失时销毁实例，将当前\
  \ fragment 声明为绑定对象的生命周期所有者（lifecycle owner）。\n\n```java\nbinding.lifecycleOwner\
  \ = this;\nreturn binding.getRoot;\n```\n\n## 36.6 将 ViewModel 实例分配给数据绑定变量\n\n此时，数据绑定已经知道它将绑定到类型为\
  \ `MainViewModel` 的类实例，但尚未连接到实际的 `MainViewModel` 对象。这需要额外的步骤，将应用内部使用的 `MainViewModel`\
  \ 实例赋值给布局文件中声明的 `viewModel` 变量。如下所示将此代码添加到 `FirstFragment.java` 文件的 `onViewCreated()`\
  \ 方法中：\n\n```java\nimport static com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\
  \n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.setVariable(myViewModel,\
  \ viewModel);\n}\n```\n\n如果 Android Studio 报告 `myViewModel` 未定义，请使用 `Build -> Make\
  \ Project` 菜单重新构建项目以强制生成类。完成这些更改后，下一步是在数据绑定布局文件的视图元素中插入一些绑定表达式。\n\n### 36.7 添加绑定表达式\n\
  \n第一个绑定表达式将将 `resultText` TextView 绑定到模型视图中的结果值。编辑 `fragment_first.xml` 文件，找到 `resultText`\
  \ 元素，并修改 text 属性，使元素显示如下：\n\n```xml\n<TextView\n    android:id=\"@+id/resultText\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"TextView\"\n    android:text='@{safeUnbox(myViewModel.result)\
  \ == 0.0 ? \"Enter value\" : String.valueOf(safeUnbox(myViewModel.result)) + \"\
  \ euros\"}'\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n该表达式首先检查结果值当前是否为零，如果是，则显示一条指示用户输入值的消息。然而，如果结果不为零，则将该值转换为字符串并与“euros”一词拼接，然后显示给用户。\n\
  \n结果值只需要单向绑定（one-way binding），因为布局永远不需要更新 `ViewModel` 中存储的值。相反，`dollarValue` EditText\
  \ 视图需要使用双向绑定（two-way binding），以便根据用户输入的最新值更新数据模型，并在发生如设备旋转触发的生命周期事件时允许在视图中重新显示当前值。`dollarText`\
  \ 元素现在应该声明如下：\n\n```xml\n<EditText\n    android:id=\"@+id/dollarText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  9dp\"\n    android:ems=\"10\"\n    android:importantForAutill=\"no\"\n    android:inputType=\"\
  number\"\n    android:text=\"@={myViewModel.dollarValue}\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_Horizontal_bias=\"0.5\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n现在已经了这些绑定表达式，必须编写一个方法来执行转换。\n\
  \n### 36.8 添加转换方法\n\n当点击按钮时，它将调用 `ViewModel` 上的方法。在 `MainViewModel.java` 中添加此方法：\n\
  \n```java\npublic class MainViewModel extends ViewModel {\n    private static Float\
  \ usd_to_rate = 0.74;\n    final MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    final MutableLiveData<Float> result = new MutableLiveData<>();\n\n    public\
  \ void convertValue() {\n        if (dollarValue.getValue() != null && !dollarValue.getValue().equals(\"\
  \")) {\n            result.setValue(Float.parseFloat(dollarValue.getValue()) * usd_to_rate);\n\
  \        } else {\n            result.setValue(0F);\n        }\n    }\n}\n```\n\n\
  注意，在没有美元值的情况下，为 `result` LiveData 分配零值。这确保了分配给 `resultText` 的绑定表达式在没有输入时会显示消息。\n\
  \n### 36.9 添加监听器绑定\n\n测试项目之前的最后一步是对布局文件中的 `Button` 添加监听器表达式以调用 `convertValue()`\
