  图 1-3\n\n### 31.4 将 Fragment 迁移到 View Binding\n\n与 `Empty Views Activity` 模板一样，Android\
  \ Studio 在添加新 fragment 时不会启用视图支持。因此，在继续教程的下一步之前，我们需要执行此迁移。首先编辑 `ToolbarFragment.java`\
  \ 文件并如下导入 fragment 的绑定：\n\n```java\nimport com.ebookfrenzy.fragmentexample.databinding.FragmentToolbarBinding;\n\
  ```\n\n接下来，找到 `onCreateView()` 方法并进行以下声明和更改（包括添加 `onDestroyView()` 方法以在 fragment\
  \ 销毁时移除引用）：\n\n```java\nprivate FragmentToolbarBinding binding;\n\n@Override\npublic\
  \ View onCreateView(LayoutInflater inflater, ViewGroup container, Bundle savedInstanceState)\
  \ {\n    // 加载 fragment 布局\n    return inflater.inflate(R.layout.fragment_toolbar,\
  \ container, false);\n    binding = FragmentToolbarBinding.inflate(inflater, container,\
  \ false);\n    return binding.getRoot();\n}\n\n@Override\npublic void onDestroyView()\
  \ {\n    super.onDestroyView();\n    binding = null;\n}\n```\n\n完成这些更改后，该 fragment\
  \ 就可以使用 view binding 了。\n\n### 31.5 添加第二个 Fragment\n\n重复创建工具栏 fragment 的步骤，添加另一个名为\
