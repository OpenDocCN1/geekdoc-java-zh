- "# Android Studio Hedgehog 必备：Java 版：使用 Android Studio 2023.1.1 和 Java 开发 Android\
  \ 应用\n\n\n\n![](img/java_hedgehog_front_cover_large.png)\n\n\n\n\n\n\n\n\n\n\n\n\
  \n## 4.9 总结\n\n典型的应用程序开发过程遵循测试环境中的编码、编译和运行周期。Android 可以在物理 Android 设备或 Android 虚拟设备\
  \ (`AVD`) 模拟器上进行测试。`AVDs` 使用 Android Studio `Device Manager` 工具创建和管理，该工具可以作为命令行工具使用，也可以通过图形用户界面使用。在创建\
  \ `AVD` 以模拟特定的 Android 设备型号时，虚拟设备的硬件规格应与物理设备匹配。\n\n`AVD` 模拟器会话可以以独立窗口的形式显示，也可以嵌入到\
  \ Android Studio 用户界面中。\n\n## 5. 使用和配置 Android Studio AVD 模拟器\n\n在下一章探索在物理 Android\
  \ 设备上测试之前，本章将花费一些时间提供 Android Studio `AVD` 模拟器的概述，并重点介绍许多可在独立模式和工具窗口模式下自定义环境的配置功能。\n\
  \n### 5.1 模拟器环境\n\n在独立模式下启动时，模拟器在加载过程中会显示初始启动屏幕。加载完成后，出现模拟器主窗口，其中包含所选设备类型的表示（对于图\
  \ 5-1，这是一个 `Pixel 4` 设备）：\n\n![](img/avd_running_standalone.jpg)\n\n图 5-1\n\n位于窗口右侧边缘的工具栏提供了对模拟器控制和配置选项的快速访问。\n\
  \n### 5.2 模拟器工具栏选项\n\n模拟器工具栏（图 5-2）提供了与外观和行为相关的系列选项的访问。\n\n![](img/as_3.5_avd_toolbar.jpg)\n\
  \n图 5-2\n\n工具栏中的每个按钮都有关联的快捷键，可以通过鼠标悬停在按钮上等待提示框出现来识别。\n\n虽然工具栏中的许多选项一言易懂，但为了完整起见，将对其进行介绍：\n\
  \n- `Exit / Minimize`: 工具栏顶部的 `x` 按钮退出模拟器会话，而 `-` 选项将窗口最小化。\n- `Power`: `Power`\
  \ 按钮模拟设备上的电源按钮。点击并释放此按钮将锁定设备并关闭屏幕。按住此按钮将启动关机请求。\n- `Volume Up / Down`: 控制模拟器内播放音量的两个按钮。\n\
  - `Rotate Left/Right`: 在竖屏和横屏之间旋转模拟设备。\n- `Take Screenshot`: 对设备屏幕内容截图。捕捉的存储在扩展控制面板的\
  \ `Settings` 屏幕指定的路径。\n- `Zoom Mode`: 此按钮进入和退出缩放模式，其细节将在本章介绍。\n- `Back`: 执行标准的 Android“返回”导航以返回上一个屏幕。\n\
  - `Home`: 显示设备主屏幕。\n- `Overview`: 模拟标准的 Android“概述”导航，显示设备上正在运行的应用。\n- `Fold Device`:\
  \ 模拟折叠设备的折叠和展开。此选项在模拟器运行折叠设备系统镜像时可用。\n- `Extended Controls`: 显示扩展控制面板，允许配置模拟位置和电话活动、电池强度、蜂窝网络类型和指纹识别等选项。\n\
  \n### 5.3 在缩放模式下工作\n\n位于模拟器工具栏的缩放按钮进入和退出缩放模式。当缩放模式激活时，工具栏按钮处于按下状态，鼠标指针悬停在设备屏幕上时显示为放大镜。点击左鼠标键将使显示相对于屏幕选点进行放大，重复点击将增加缩放级别。相反，点击右鼠标键将降低缩放级别。切换按钮会将显示恢复到默认大小。\n\
  \n在缩放模式下，点击并拖动将定义一个矩形区域，释放鼠标按钮后视图将缩放到该区域。\n\n在缩放模式下，可以使用模拟器窗口内的水平和垂直滚动条移动屏幕的可视区域。\n\
  \n### 5.4 调整模拟器窗口\n\n\n\n\n模拟器窗口的大小（以及设备相应的表示）可以通过启用缩放模式，并在窗口的任何角或侧边上点击并拖拽来随时更改。\n\
  \n## 5.5 扩展控制选项\n\n扩展控制工具栏按钮会显示如图 5-3 所示的面板。默认情况下，将显示位置设置。从左侧面板选择不同的类别，将显示相应的一组控件：\n\
  \n![](img/as_avd_extended_controls.jpg)\n\n图 5-3\n\n### 5.5.1 位置\n\n位置控制允许以十进制或六十进制坐标将模拟的位置信息发送到模拟器。位置信息可以是单个位置的形式，也可以是代表设备移动的点序列，后者通过\
  \ GPS 交换格式 (`GPX`) 或 Keyhole 标记语言 (`KML`) 格式的文件提供。或者，可以使用集成的 Google Maps 面板视觉化地选择单点或旅行路线。\n\
  \n### 5.5.2 显示\n\n除了模拟器屏幕内显示的主显示外，`Displays` 选项允许在同一个 Android 实例中运行额外的显示器。这对于测试适用于如\
  \ Microsoft Surface Duo 等双屏设备的应用非常有用。这些额外的屏幕可以配置为任何所需的尺寸，并与主屏幕一起出现在模拟器窗口中。\n\n###\
  \ 5.5.3 蜂窝\n\n可以在蜂窝设置屏幕内更改模拟的蜂窝连接类型。提供了用于模拟不同网络类型（`CSM`、`EDGE`、`HSDPA` 等）以及一系列语音和数据场景，例如漫游和拒绝访问。\n\
  \n### 5.5.4 电池\n\n在扩展控制屏幕的面板上可以模拟各种电池状态和充电条件，包括电池电量、电池健康状况以及是否连接了 AC 充电器。\n\n###\
  \ 5.5.5 摄像头\n\n当摄像头激活时，模拟器会模拟 3D 场景。这表现为虚拟建筑内部，在模拟器中录制视频或拍照之前，可以通过按住 `Option` 键（Windows\
  \ 上为 `Alt`）同时使用鼠标指针和键盘键在此进行导航。此扩展配置选项允许上传不同的图像显示在虚拟环境中。\n\n### 5.5.6 电话\n\n电话扩展控制在模拟器中提供了两个简单但实用的模拟。第一个选项模拟来自指定电话号码的入电。这在测试应用如何处理高级中断时特别有用。\n\
  \n第二个选项允许在模拟器会话中模拟接收短信。与现实世界一样，这些消息会出现在 `Message` 应用中，并触发模拟器内的标准通知。\n\n### 5.5.7\
  \ 方向键\n\n方向键（`D-Pad`）是内置于 Android 设备或外部连接（如游戏控制器）的另一组控件，提供方向控制（左、右、上、下）。方向键设置允许在模拟器中模拟\
  \ `D-Pad` 交互。\n\n### 5.5.8 麦克风\n\n麦克风设置允许启用麦克风并模拟虚拟耳机和麦克风连接。还提供了一个启动模拟器上 `Voice\
  \ Assistant` 的按钮。\n\n### 5.5.9 指纹\n\n许多 Android 设备现在内置指纹检测硬件。`AVD` 模拟器使得无需在带有指纹传感器的物理设备上测试应用即可测试指纹身份验证。模拟器内配置指纹测试的细节将在本章后续部分介绍。\n\
  \n### 5.5.10 虚拟传感器\n\n`virtual sensors` 选项允许模拟 `accelerometer`（加速度计）和 `magnetometer`（磁力计），以模拟设备的物理运动效果，例如通过\
  \ `yaw`、`pitch` 和 `roll` 设置模拟旋转、移动和倾斜。\n\n### 5.5.11 快照\n\n快照包含当前运行的 `AVD` 会话的状态，可进行保存并快速恢复，使模拟器轻松返回到精确状态。快照将在本章后续部分介绍。\n\
  \n### 5.5.12 录制与播放\n\n允许对模拟器屏幕和音频以 `WebM` 或动画 `GIF` 格式进行录制并保存。\n\n### 5.5.13 Google\
  \ Play\n\n如果模拟器运行的是安装了 `Google Play Services` 的 Android 版本，此选项将显示当前的 `Google Play`\
  \ 版本。它还提供了将模拟器更新到最新版本的选项。\n\n### 5.5.14 设置\n\n设置面板提供了一组配置选项。使用此面板为工具栏和扩展控制面板选择较深的主题，指定保存截图的文件系统位置，配置\
  \ `OpenGL` 支持级别，并配置模拟器窗口显示在桌面其他窗口之上。\n\n### 5.5.15 帮助\n\n`Help` 屏幕包含三个子面板，包含键盘快捷键列表、访问模拟器在线文档的链接、报告\
  \ Bug 和发送反馈，以及模拟器版本信息。\n\n## 5.6 使用快照\n\n当模拟器首次启动时，它会执行冷启动，就像物理 Android 设备上电一样。冷启动过程可能需要一些时间完成，因为操作系统需要加载且所有后台进程都要启动。为了避免每次启动模拟器都必须经过此过程，系统配置为每次退出时自动保存模拟器当前状态的快照（称为快速启动快照）。下次启动模拟器时，快速启动快照将加载到内存中并从上次中断的地方恢复，允许模拟器快速启动。\n\
  \n扩展控制面板的 `Snapshots` 屏幕可以在模拟器执行期间的任何点存储额外的快照。这保存了整个模拟器的状态，允许模拟器恢复到拍摄快照的确刻。在屏幕内可以使用\
  \ `Take Snapshot` 按钮（如图 5-4 中标记 `A`）拍摄快照。要恢复现有的快照，从列表中选择它（`B`）并点击屏幕底部的运行按钮（`C`）。还提供了编辑（`D`）快照名称和描述以及删除（`E`）当前选择快照的选项：\n\
  \n![](img/as_avd_snapshots.jpg)\n\n图 5-4\n\n你还可以通过主工具栏中的运行目标菜单中选择使用冷启动、最近的快速启动快照或之前的快照来启动模拟器，如图\
  \ 5-5 所示：\n\n![](img/as_avd_run_snapshot.jpg)\n\n图 5-5\n\n## 5.7 配置指纹模拟\n\n模拟器允许配置并使用最多\
  \ 10 个模拟指纹来测试 Android 应用中的指纹身份验证。配置模拟指纹从启动模拟器、打开 `Settings` 应用并选择 `Security` 选项开始。\n\
  \n在 `Security` 设置屏幕内，选择 `fingerprint` 选项。在随后的信息屏幕上，点击 `Next` 进入指纹设置屏幕。在启用指纹安全之前，必须配置备份屏幕解锁方法（如\
  \ `PIN`）。输入并确认一个合适的 `PIN`，并通过接受默认通知选项来完成 PIN 输入过程。\n\n继续后续屏幕，直到 `Settings` 应用要求在传感器上放置指纹。此时，显示扩展控制对话框，在左侧面板中选择\
  \ `Fingerprint` 类别，并确保主设置面板选择了 `Finger 1`。\n\n\n\n\n![](img/as_avd_touch_sensor.jpg)\n\
  \n图 5-6\n\n点击 `Touch Sensor` 按钮模拟 `Finger 1` 触摸指纹识别器。模拟器将报告指纹添加成功：\n\n![](img/as_avd_fingerprint_added.jpg)\n\
  \n图 5-7\n\n要添加额外的指纹，请点击 `Add Another` 按钮，并在再次点击 `Touch Sensor` 按钮之前，从扩展控制面板菜单中选择另一只手指。\n\
  \n## 5.8 工具窗口模式下的模拟器\n\n正如前一章（“在 Android Studio 中创建 Android 虚拟设备 (AVD)”）所述，Android\
  \ Studio 可以配置为在嵌入式工具窗口中启动模拟器，这样它就不会出现在独立的窗口中。当在此模式下运行时，工具栏中将提供与独立模式中相同的控件，如图 5-8\n\
  \n图 5-8\n\n从左到右，这些按钮执行以下任务（细节与独立模式一致）：\n\n• 电源\n• 音量增大\n• 音量减小\n• 左旋转\n• 右旋转\n•\
  \ 返回\n• 主页\n• 概览\n• 截图\n• 快照\n• 扩展控制\n\n## 5.9 创建可调整大小的模拟器\n\n除了配置为匹配特定 Android\
  \ 设备模型的模拟器外，Android Studio 还提供了一个可调整大小的 `AVD`，允许你在手机、平板和折叠屏设备尺寸之间切换。要创建一个可调整大小的模拟器，打开\
  \ `Device Manager` 并点击 `+` 工具栏按钮。接下来，选择如图 5-9 所示的 `Resizable` 设备定义，并按照通常步骤创建新的 `AVD`：\n\
  \n![](img/avd_create_resizable.jpg)\n\n图 5-9\n\n当你在工具窗口内的新模拟器上运行应用时，工具栏中会出现 `Display\
  \ mode` ，允许你在模拟器配置之间切换，如图 5-10 所示：\n\n![](img/as_avd_fold_button.jpg)\n\n图 5-10\n\
  \n如果模拟器在独立模式下运行，可以在侧边工具栏中找到 `Display mode` 选项，如下：\n\n![](img/avd_resizable_menu.jpg)\n\
  \n图 5-11\n\n## 5.10 总结\n\nAndroid Studio 包含一个 `Android Virtual Device` 模拟器环境，旨在使其在不于物理\
  \ Android 设备上运行的情况下更更容易测试应用程序。本章对模拟器进行了简要介绍，并强调了用于配置和自定义环境以模拟不同测试条件的关键功能。\n\n##\
  \ 6. Android Studio 用户界面导览\n\n虽然人们可能急于运行在前一章中创建的示例应用，但它涉及 Android Studio 用户界面的某些方面，这些内容最好先进行描述。\n\
  \nAndroid Studio 是一个强大且功能丰富的开发环境，在很大程度上用起来是直观的。尽管如此，现在花时间熟悉 Android Studio 用户界面的布局和组织结构，将缩短书中后续章节的学习曲线。基于此，本章将提供\
  \ Android Studio 环境中各个区域和组件的概述。\n\n### 6.1 欢迎屏幕\n\n欢迎屏幕（图 6-1）在 Android Studio 运行且当前没有打开任何项目时显示（可以通过选择\
  \ `File -> Close Project` 菜单选项随时关闭打开的项目）。如果是在项目仍打开时退出了 Android Studio，该工具在下次启动时将跳过欢迎屏幕，自动打开之前活跃的项目。\n\
  \n![](img/as_hedgehog_welcome2.jpg)\n\n图 6-1\n\n除了最近项目列表外，欢迎屏幕还提供了执行如打开和创建项目等任务的选项，并可以访问当前受版本控制的项目。此外，`Customize`\
  \ 屏幕提供了更改 `IDE` 和编辑器使用的主题和字体设置的选项。可以使用 `Plugins` 选项查看、安装和管理 Android Studio 插件。\n\
  \n通过选择 `More Actions` 链接或在最近项目列表取代 `More Actions` 链接时使用图 6-2 所示的菜单，可以获得更多选项：\n\n\
  ![](img/as_welcome_menu.jpg)\n\n图 6-2\n\n### 6.2 菜单栏\n\n当创建新项目或打开现有项目时，Android Studio\
  \ 主窗口将出现。当同时打开多个项目时，每个项目都将分配自己的主窗口。窗口的精确配置取决于 Android Studio 运行的操作系统，以及上次打开项目时显示了哪些工具和面板。例如，主菜单栏的外观将根据主机操作系统而不同。在\
  \ macOS 上，Android Studio 遵循将菜单栏放置在桌面顶的标准惯例，如图 6-3 所示：\n\n![](img/as_menu_bar.jpg)\n\
  \n图 6-3\n\n然而，当 Android Studio 在 Windows 或 Linux 上运行时，通过图 6-4 所示的高亮按钮访问主菜单：\n\n\
  ![](img/as_windows_main_menu.jpg)\n\n图 6-4\n\n### 6.3 主窗口\n\n一旦打开项目，Android Studio\
  \ 主窗口通常类似于图 6-5 所示：\n\n![](img/as_main_window.jpg)\n\n图 6-5\n\n主窗口的各种元素可以总结如下：\n\
  \n**A – 工具栏**：频繁操作的快捷键选择。工具栏按钮提供了对一组菜单操作的快速访问。可以通过右键点击工具栏并选择 `Customize Toolbar…`\
  \ 选项来自定义工具栏。图 6-6 所示的工具栏菜单提供了执行创建和打开项目以及在多个项目打开时切换的便捷方法：\n\n![](img/as_project_switch_menu.jpg)\n\
  \n图 6-6\n\n**B – 导航栏**：导航栏提供了在项目文件和文件夹之间移动的便捷方法。点击导航栏中的元素将弹出该位置的子文件夹和文件列表供选择。同样，点击类名将显示包含在该类的方法列表：\n\
  \n![](img/as_navigation_menu.jpg)\n\n图 6-7\n\n从列表中选择方法将进入代码编辑器的相应位置。可以使用 `View ->\
  \ Appearance -> Navigation Bar` 菜单选项隐藏、显示和更改此栏的位置。\n\n**C – 编辑器窗口**：编辑器窗口显示开发者正在处理的文件内容。当打开多个文件时，每个文件由编辑器顶部的标签表示，如[图\
  \ 6-8]所示：\n\n![](img/as_menu_bar_java.jpg)\n\n图 6-8\n\n**D – 状态栏**：状态栏显示关于项目和 Android\
  \ Studio 活动的信息消息。悬停在状态栏项目上将显示该字段的描述。许多字段是交互式的，允许用户点击以执行任务或获取更详细的状态信息。\n\n![](img/as_status_bar.jpg)\n\
  \n图 6-9\n\n可以使用 `View -> Appearance -> Status Bar Widgets` 更改状态栏中显示的小部件。\n\n\n\n\
  \n\n# E – 项目工具窗口 (Project Tool Window)\n\n项目工具窗口提供了项目文件结构的层次结构概述，允许对特定文件和文件夹进行导航。工具栏用于以不同的方式显示项目。默认设置是\
  \ `Android` 视图，这是本书后续内容主要使用的模式。\n\n项目工具窗口只是 Android Studio 环境中许多可用工具之一。\n\n## 6.4\
  \ 工具窗口 (Tool Windows)\n\n除了项目视图工具窗口外，Android Studio 还包含许多其他窗口，这些窗口在启用时会显示为沿主窗口左侧和右侧出现的工具窗口栏，其中包含用于显示和隐藏每个工具窗口的按钮。图\
  \ 6-10 显示了典型的工具窗口栏配置，尽管按钮及其位置可能会根据你安装的 Android Studio 而有所不同。\n\n![](img/as_tool_window_bars.jpg)\n\
  \n图 6-10\n\n点击按钮将显示相应的工具窗口，再次点击则会隐藏窗口。按钮在工具窗口栏中的位置表示窗口在显示时将出现在窗口的哪侧。可以通过点击并拖动按钮到其他窗口工具栏的不同位置来更改这些位置。\n\
  \nAndroid Studio 提供了广泛的工具窗口，最常用的如下：\n\n*   **Project 项目 (A)** – 项目视图提供了构成项目的文件结构概述，允许在文件之间快速导航。通常情况下，在项目视图中双击文件将导致该文件加载到适当的编辑工具中。\n\
  *   **Resource Manager 资源 (B)** - 用于项目内添加和管理资源与资产的工具，例如图像、颜色和布局文件。\n*   **More hơn\
  \ 工具窗口 (C)** - 显示包含当前未在工具窗口栏中显示的附加工具窗口的菜单。从此菜单中选择工具窗口后，它将作为工具窗口栏中的按钮出现。\n*   **Run\
  \ 运行 (D)** – 当应用程序运行时，运行工具窗口将可用，并提供运行结果视图以及停止或重启运行进程的选项。如果应用程序在设备或模拟器上安装和运行失败，此窗口通常会提供有关该问题的诊断信息。\n\
  *   **Logcat (E)** – Logcat 工具窗口提供了访问运行应用程序的监控日志输出，以及对应用程序进行截图、视频以及停止和重启进程的选项。\n\
  *   **Problems 问题 (F)** - 查看项目内所有当前错误或警告的中心位置。双击问题列表中的项将带你进入问题所在的文件和位置。\n*   **App\
  \ Quality Insights 应用质量洞察 (G)** - 提供对基于云的 Firebase 应用质量和崩溃分析平台的访问。\n*   **Terminal\
  \ 终端 (H)** – 提供对运行 Android Studio 的系统的终端窗口。在 Windows 系统上，这是命令提示符界面，而在 Linux 和 macOS\
  \ 系统上，它以终端提示符的形式存在。\n*   **Version Control 版本控制 (I)** - 当项目文件受版本控制时使用此工具窗口，允许访问\
  \ `Git` 仓库和代码更改历史。\n*   **Notifications 通知 (J)** - 当项目文件受版本控制时使用此工具窗口，允许访问 `Git`\
  \ 仓库和代码更改历史。\n*   **Gradle (K)** – Gradle 工具窗口提供了构成项目构建配置的 Gradle 任务视图。该窗口列出了将项目各种元素编译为可执行应用程序的涉及的任务。右键点击顶级\
  \ Gradle 任务并选择 `Open Gradle Config` 菜单选项，可以将当前项目的 Gradle 构建文件加载到编辑器中。本书稍后将更详细介绍\
  \ Gradle。\n*   **Device Manager 设备管理器 (L)** - 提供对设备管理器工具窗口的访问，可以在其中添加、删除和管理物理 Android\
  \ 设备连接和模拟器。\n*   **Running Devices 运行中的设备 (M)** - 如果启用了在 Android Studio 中创建 Android\
  \ 虚拟设备 (AVD)章节所述在工具窗口中运行模拟器的选项，则包含 AVD 模拟器。\n*   **App Inspection 应用检查** - 提供对数据库和后台任务检查器的访问。`Database\
  \ Inspector` 允许你在运行时检查、查询和修改应用程序的数据库。`Background Task Inspector` 允许对使用 `WorkManager`\
  \ 创建的后台工作任务进行监控和管理。\n*   **Bookmarks 书签** – 书签工具窗口提供了快速访问已标记的文件和代码行。例如，在项目视图中右键点击文件可以访问\
  \ `Add to Bookmarks` 选项。同样，你可以通过将光标移动到该行并按下 `F11` 键（macOS 上为 `F3`）对源文件中的代码行签名。所有书签项都可以此工具窗口访问。\n\
  *   **Build 构建** - 构建工具窗口显示项目编译和打包过程中的构建信息，以及遇到的任何错误详细信息。\n*   **Build Variants\
  \ 构建变体** – 构建变体工具窗口为当前应用程序项目配置不同的构建目标提供了快速方法（例如，针对应用程序调试和发布版本的不同构建，或针对不同设备类别的多个构建）。\n\
  *   **Device File Explorer 设备文件浏览器** - 通过 `View -> Tool Windows -> Device File Explorer`\
  \ 菜单可用，此工具窗口提供对当前连接的 Android 设备或模拟器文件系统的直接访问，允许浏览系统并将文件复制到本地文件系统。\n*   **Layout\
  \ Inspector 布局检查** - 提供构成用户界面布局的组件层次结构的视觉 3D 渲染。\n*   **Structure 结构** – 结构工具提供当前显示的源文件结构的高级视图。这些信息包括类、方法和变量列表。从结构列表中选择项将带你进入该位置。\n\
  *   **TODO 待办事项** – 正如所示，此工具提供了查看项目中待完成事项的地方。Android Studio 通过扫描项目源文件查找匹配 TODO 模式的注释来编译此列表。可以通过打开对话框并导航到\
  \ Editor 下的 TODO 来查看和更改这些模式。\n\n## 6.5 工具窗口菜单 (Tool Window Menus)\n\n每个工具窗口在顶部都有自己的工具栏。这些工具栏中的菜单按钮随工具而异，但所有工具窗口都包含一个选项菜单（如图\
  \ 6-11 中的 A 所示）：\n\n![](img/as_tool_window_buttons.jpg)\n\n图 6-11\n\n选项允许更改窗口的各个方面。例如，图\
  \ 6-12](#Guided_Tour.xhtml__idTextAnchor177)显示了项目工具窗口的选项菜单。可以使用设置，例如取消固定窗口并允许其在\
  \ Android Studio 主窗口边界之外浮动，以及移动和调整工具面板的大小：\n\n![](img/as_tool_window_menu.jpg)\n\
  \n图 6-12\n\n所有工具窗口在工具栏的最右侧还有一个按钮（如图 6-11 中的 B 所示），提供了隐藏工具窗口的另一种方法可以通过让该窗口获取焦点（点击它）然后输入搜索词（例如项目工具窗口中的文件名）来对工具窗口内的项进行搜索。搜索框将出现在窗口的工具栏中，并高亮匹配搜索的项。\n\
  \n## 6.6 Android Studio 快捷键 (Android Studio Keyboard Shortcuts)\n\n\n\n\n\nAndroid\
  \ Studio 包含了许多快捷键，以便在执行常用任务时节省时间。您可以通过在 Android Studio 项目窗口中选择 `Help` -> `Keyboard\
  \ Shortcuts PDF` 菜单选项来查看并打印完整的快捷键映射列表。您也可以通过打开 `Settings` 对话框并点击 `Keymap` 项来列出和修改快捷键，如下方的\
  \ 图 6-13 所示：\n\n![](img/as_keymap.jpg)\n\n图 6-13\n\n## 6.7 切换器（Switcher）与最近文件导航\n\
  \n在 Android Studio 主窗口中进行导航的另一个有用机制是使用切换器（Switcher）。通过 `Ctrl-Tab` 快捷键访问切换器，它将以面板的形式出现，列出所有工具窗口和当前打开的文件（图\
  \ 6-14）。\n\n![](img/as_switcher.jpg)\n\n图 6-14\n\n一旦显示，只要 `Ctrl` 键一直保持按下状态，切换器就会保持可见。在按住\
  \ `Ctrl` 键的同时反复点击 `Tab` 键可以在各种选择选项之间循环，而释放 `Ctrl` 键则可以选择当前高亮的项并在主窗口中显示。\n\n除了切换器之外，最近文件（Recent\
  \ Files）面板还提供了对最近打开的文件的导航（图 6-15）。可以使用 `Ctrl-E` 快捷键（macOS 上为 `Cmd-E`）访问此面板。一旦显示，可以使用鼠标指针选择选项，或者使用键盘方向键滚动浏览文件名和工具窗口选项。按下\
  \ `Enter` 键将选择当前高亮的项：\n\n![](img/as_recent_files.jpg)\n\n图 6-15\n\n## 6.8 更改 Android\
  \ Studio 主题\n\n可以使用 `Settings` 对话框更改 Android Studio 环境的整体主题。一旦显示了设置对话框，在左侧面板中选择\
  \ `Appearance & Behavior` 选项，然后选择 `Appearance`。接着，在点击 `OK` 按钮之前更改 `Theme` 菜单的设置。可用主题取决于平台，但通常包括\
  \ Light（浅色）、IntelliJ、Windows、High Contrast（高对比度）和 Darcula 等选项。图 6-16 显示了已选择 Dark（深色）主题的主窗口示例：\n\
  \n![](img/as_dark_theme.jpg)\n\n图 6-16\n\n要将 Android Studio 主题与操作系统的明暗模式设置同步，请启用\
  \ `Sync with OS` 选项并使用下拉菜单控制每个模式下使用哪个主题：\n\n![](img/as_theme_sync.jpg)\n\n图 6-17\n\
  \n## 6.9 总结\n\nAndroid Studio 环境的主要元素包括欢迎界面和主窗口。每个打开的项目都分配有自己的主窗口，该窗口反过来由菜单栏、工具栏、编辑和设计区域、状态栏以及一组工具窗口组成。工具窗口位于主窗口的侧侧。\n\
  \nAndroid Studio 中有极少的操作无法通过快捷键触发。可以随时从 Android Studio 主窗口中访问默认快捷键的键映射。\n\n## 7.\
  \ 在物理 Android 设备上测试 Android Studio 应用\n\n虽然使用 Android 虚拟设备 (AVD) 测试应用程序可以实现许多功能，但在物理\
  \ Android 设备上进行真实的应用测试是不可替代的，而且某些 Android 功能仅在物理 Android 设备上可用。\n\n与 AVD 实例和连接的\
  \ Android 设备之间的通信由 Android 调试桥接 (ADB) 处理。本章解释了如何在基于 macOS、Windows 和 Linux 的系统中配置\
  \ `adb` 环境，以便在 Android 设备上进行应用测试。\n\n### 7.1 Android 调试桥接 (ADB) 概述\n\nADB 的主要目的是促进开发系统（在此例中\
  \ Android Studio）与 AVD 模拟器以及 Android 设备之间的交互，以便运行和调试应用程序。ADB 允许您通过 WiFi 或 USB 线连接到设备。\n\
  \nADB 由客户端、运行在开发系统后台的服务器进程，以及一个运行在 AVD 或真实 Android 设备（如手机和平板电脑）上的守护后台进程组成。\n\nADB\
  \ 客户端有多种形式。例如，在 Android SDK 的 `platform-tools` 子目录下提供了一个名为 `adb` 的命令行工具作为客户端。同样，Android\
  \ Studio 也有一个内置的客户端。\n\n可以使用 `adb` 命令行工具执行多种任务。例如，可以使用 `devices` 命令行参数列出活跃的虚拟或物理设备。以下命令输出表示系统上存在一个\
  \ AVD，但没有物理设备：\n\n```\n$ adb devices\nList of devices attached\nemulator-5554 device\n\
  ```\n\n### 7.2 在 Android 设备上启用 USB 调试 ADB\n\n在 ADB 连接到 Android 设备之前，该设备必须配置为允许连接。在运行\
  \ Android 6.0 或更高版本的手机和平板设备上，实现此目的的步骤如下：\n\n1. 打开设备上的 `Settings` 应用并选择 `About tablet`关于平板电脑）或\
  \ `About phone`关于手机）选项（在某些 Android 版本中，可以在 `Settings` 应用的 `System` 页面找到）。\n2. 在关于屏幕上，向下滚动到\
  \ `Build number`版本号）字段（图 7-1）并点击七次，直到消息显示开发者模式已启用。如果关于屏幕上没有列出 `Build number`，它可能位于\
  \ `Software information（软件信息）`下。或者展开 `Advanced（高级）`部分。\n\nimage/as_3.2_build_number.jpg)\n\
  \n3. 返回到设置主屏幕，注意出现了 `Developer options（开发者选项）`（在较新的 Android 版本中，此选项位于 System 设置中）。选择此选项，并在生成的屏幕上找到图\
  \ 7-2 所示的 `USB debugging（USB 调试）`选项：\n\nimage/android_12_enable_debugging.jpg)\n\
  \n4. 启用 `USB debugging` 选项，并在请求权限时点击 `Allow（允许）`按钮。\n\n现在设备已配置为接受来自 adb 的连接。剩下的工作是配置开发系统在设备连接时检测它。虽然这是一个简单的过程，但步骤取决于开发系统运行的是\
  \ Windows、macOS 还是 Linux。以下步骤假设 Android SDK `platform-tools` 目录已包含在操作系统的 `PATH`环境变量中，如设置\
  \ Android Studio 开发环境章节所示。\n\n#### 7.2.1 macOS ADB 配置\n\n要在 macOS 系统上配置 ADB 环境，使用\
  \ USB 线将设备连接到电脑，打开终端窗口并执行以下命令重启 adb 服务器：\n\n```\n$ adb kill-server\n$ adb start-server\n\
  * daemon not running. starting it now on port 5037 *\n* daemon started successfully\
  \ *\n```\n\n一旦服务器成功运行，执行以下命令以验证设备是否已检测：\n\n```\n$ adb devices\nList of devices attached\n\
  74CE000600000001 offline\n```\n\n如果设备显示为 offline（离线），前往 Android 设备并检查图 7-3 所示的对话框，请求允许\
  \ USB 调试。在点击 OK 之前，勾选 Always allow from this computer（始终允许此计算机）旁边的复选框。\n\nimage/Image2856.jpg)\n\
  \n图 7-3\n\n重复 adb devices 命令现在应该列出设备为可用：\n\n```\nList of devices attached\n015d41d4454bf80c\
  \ device\n```\n\n如果设备未列出，尝试注销并重新登录 macOS 桌面，如果问题仍然存在，请重启系统。\n\n\n\n\n\n### 基于 Windows\
  \ 的 ADB 配置\n\n配置基于 Windows 的开发系统以使用 `ADB` 连接到 Android 设备的第一步是在系统上安装相应的 USB 驱动程序。需要安装的\
  \ USB 驱动程序取决于 Android 设备的型号。如果你拥有 Google 设备（例如 Pixel 手机），则有必要在 Windows 系统上安装并配置\
  \ Google USB 驱动程序包。实现此操作的详细步骤请参见下方网页：\n\n[`developer.android.com/sdk/win-usb.html`](https://developer.android.com/sdk/win-usb.html)\n\
  \n对于[Google USB 驱动](https://developer.android.com/sdk/win-usb.html)不支持的 Android\
  \ 设备，则需要下载由设备制造商提供的驱动程序。可以在以下在线获取驱动程序列表以及下载和安装信息：\n\n[`developer.android.com/tools/extras/oem-usb.html`](https://developer.android.com/tools/extras/oem-usb.html)\n\
  \n在安装驱动程序且设备现已识别为正确的设备类型后，打开命令提示符窗口并执行以下命令：\n\n```bash\nadb devices\n```\n\n该命令应输出与如下类似的连接设备信息：\n\
  \n```\nList of devices attached\nHT4CTJT01906 offline\n```\n\n如果设备被列为 `offline`\
  \ 或 `unauthorized`，请查看设备显示并检查是否显示寻求允许 USB 调试权限的对话框。在点击确定 之前，勾选“始终允许此计算机调试”选项旁边的复选框。再次执行\
  \ `adb devices` 命令现在应该会将设备列为已就绪：\n\n```\nList of devices attached\nHT4CTJT01906\
  \ device\n```\n\n如果设备未列出，请执行以下命令重启 `ADB` 服务：\n\n```bash\nadb kill-server\nadb start-server\n\
  ```\n\n如果设备仍然未列出，请尝试执行以下命令：\n\n```bash\nandroid update adb\n```\n\n注意，可能还需要需要重启系统。\n\
  \n#### 7.2.3 Linux ADB 配置\n\n在本章中，我们将再次使用 Ubuntu Linux 作为参考示例，在 Linux 上配置 `adb`\
  \ 以连接到物理 Android 设备进行应用测试。\n\n在 Ubuntu Linux 上进行物理设备测试需要安装名为 `android-tools-adb`\
  \ 的包，这反过来要求 Android Studio 用户必须是 `plugdev` 组的成员。这是大多数 Ubuntu 版本用户账户的默认设置，可以通过运行\
  \ `id` 命令进行验证。如果未列出 `plugdev` 组，请运行以下命令将您的账户添加到该组：\n\n```bash\nsudo usermod -aG\
  \ plugdev $LOGNAME\n```\n\n在满足组成员身份要求后，可以通过执行以下命令安装 `android-tools-adb` 包：\n\n```bash\n\
  sudo apt-get install android-tools-adb\n```\n\n完成上述更改后，重启 Ubuntu 系统。系统重启后，打开终端窗口，启动\
  \ `adb` 服务，并检查已连接的设备列表：\n\n```bash\n$ adb start-server\n* daemon not running. starting\
  \ it now on port 5037 *\n* daemon started successfully *\n$ adb devices\nList of\
  \ devices attached\n015d41d4454bf80c offline\n```\n\n如果设备被列为 `offline` 或 `unauthorized`，请前往\
  \ Android 设备并检查寻求寻求允许 USB 调试权限的对话框。\n\n## 7.3 解决 USB 连接问题\n\n如果你无法通过上述步骤成功连接到设备，请显示运行目标菜单并选择“故障排除设备连接”（Troubleshoot\
  \ Device Connections）选项：\n\n![](img/as_troubleshoot_device_connections.jpg)\n图 7-4\n\
  \n连接助手将扫描设备并报告问题及解决方案。\n\n## 7.4 在 Android 设备上启用无线调试\n\n遵循上述 7.2 节的第 1 至第 3 步，这次启用如下所示的无线调试选项：\n\
  \n![](img/android_12_enable_wifi_debugging.jpg)\n图 7-5\n\n接下来，点击上述无线调试条目以显示如下所示屏幕：\n\
  \n![](img/android_12_enable_wifi_debugging_settings.jpg)\n图 7-6\n\n如果你的设备带有摄像头，选择“通过\
  \ QR 代码配对设备”，否则选择“通过配对码配对设备”。根据你的选择，设置应用将启动摄像头会话或显示配对码，如下所示：\n\n![](img/as_pair_devices_code.jpg)\n\
  图 7-7\n\n选择选项后，返回 Android Studio，从运行目标菜单中选择“通过 WiFi 配对设备”选项，如下所示：\n\n![](img/as_pair_using_wifi.jpg)\n\
  图 7-8\n\n在配对对话框中，根据你之前在设备设置应用中的选择，选择“通过 QR 代码配对”或“通过配对码配对”：\n\n![](img/as_pair_using_wifi_qr_code.jpg)\n\
  图 7-9\n\n使用 Android 设备扫描 QR 代码，或将设备屏幕上显示的配对码输入 Android Studio 对话框中以完成配对过程：\n\n![](img/as_pair_devices_wifi_enter_code.jpg)\n\
  图 7-10\n\n如果配对过程失败，请尝试重启开发系统和 Android 设备。\n\n## 7.5 测试 ADB 连接\n\n假设在所选平台上已成功配置 `adb`，下一步是尝试运行测试应用程序。启动\
  \ Android Studio，打开项目，并验证设备是否出现在如下所示的设备列表中：\n\n![](img/as_run_on_device.jpg)\n图\
  \ 7-11\n\n从列表中选择设备并点击运行按钮。\n\n## 7.6 设备镜像\n\n设备镜像允许你在物理设备上运行应用，同时在 Android Studio\
  \ 中显示屏幕。换句话说，尽管你的应用运行在物理设备上，但它会像 AVD 实例一样显示在 Android Studio 中。\n\n将设备连接到 Android\
  \ Studio 后，显示运行设备窗口并点击设备设置链接显示设置对话框。在设置对话框中，启用物理 Android 设备镜像并点击确定。下次运行应用时，Android\
  \ Studio 将在运行设备窗口中镜像物理设备的显示。\n\n## 7.7 总结\n\n虽然 Android 虚拟机模拟器提供了一个极的测试环境，但记住，确保应用程序在物理\
  \ Android 设备上正确运行没有真正的替代品。\n\n然而，默认情况下，Android Studio 环境未配置为将 Android 设备作为目标测试设备。因此，必须执行某些步骤，通过\
  \ USB 线缆或 WiFi 网络从 Android Studio 开发环境将应用程序加载到 Android 设备。\n\n## 8. Android Studio\
  \ 代码编辑器基础\n\n为 Android 开发应用涉及大量的编程工作，根据定义，这涉及输入、审查和修改代码行。不出所料，开发者在使用 Android Studio\
  \ 的大部分时间内通常都在编辑器窗口内编辑代码。\n\n\n\n\n现代代码编辑器必须远超输入、删除、剪切和粘贴等基础功能。今天，代码编辑器的实用性通常由以下因素衡量：它在多大程度上减少了程序员的输入量、在大源文件中导航的便利性，以及编辑器在代码编写时实时检测并高亮编程错误的能力。正如本章所示，这些只是\
  \ Android Studio 编辑器出色的少数领域之一。\n\n本章并非对 Android Studio 编辑器功能的详尽概述，而是旨在提供该工具关键功能的指南。经验丰富的程序员会发现，其中某些功能是目前大多数代码编辑器所共的，而许多功能则是该编辑环境所特有的。\n\
  \n### 8.1 Android Studio 编辑器\n\n当选择 Java、Kotlin、XML 或其他文本文件进行编辑时，Android Studio\
  \ 编辑器出现在主窗口的中心。例如，图 8-1 显示了一个加载了 Java 源代码文件的典型编辑器界面：\n\n![](img/as_code_editor_java.jpg)\n\
  \n图 8-1\n\n构成编辑器窗口的元素可以总结如下：\n\n### A – 文档标签 (Document Tabs)\nAndroid Studio 可以随时打开多个文件进行编辑。每打开一个文件，它都会被分配一个文档标签，在编辑器窗口顶部边缘的标签栏中显示文件名。当空间不足以显示所有标签时，标签栏的最右侧会出现一个小的下拉菜单。点击此菜单将弹出其他已打开的文件列表。标签中文件名下方的红色波浪线表示该文件中的代码包含一个或多个错误，这些错误在编译和运行项目之前需要被解决。\n\
  \n在文件之间切换只需点击相应的标签或使用 `Alt-Left` 和 `Alt-Right` 键盘快捷键。文件之间的导航可以使用切换器（Switcher）机制（通过\
  \ `Ctrl-Tab` 键盘快捷键访问）进行。\n\n要将编辑器面板从 Android Studio 主窗口分离并使其在单独窗口中显示，请点击标签并将其拖到主窗口之外的桌面区域。要将编辑器返回主窗口，请点击分离的编辑器窗口中的文件标签，并将其拖放到主窗口的原始编辑器标签栏上。\n\
  \n### B – 编辑器行槽区域 (Editor Gutter Area)\n行槽区域用于编辑器显示信息图标和控件。行槽区域的一些典型项目包括调试断点标记、折叠和展开代码块的控件、书签、更改标记和行号。行号默认开启，但可以通过右行槽右右键并选择\
  \ `Appearance -> Show Line Numbers` 菜单选项来禁用。\n\n### C – 代码结构位置 (Code Structure Location)\n\
  编辑器底部的此栏显示光标当前位置及其与代码整体结构的关系。例如，在下面的图中，该栏指示当前正在编辑 `convertCurrency` 方法，且该方法包含在 `MainActivity`\
  \ 类中：\n\n![](img/as_code_structure.jpg)\n\n图 8-2\n\n双击栏内的任意元素将把光标移动到代码文件中的相应位置。例如，双击\
  \ `convertCurrency` 条目将把光标移动到源代码中 `convertCurrency` 方法的顶部。同样，点击 `MainActivity` 条目将显示一个可选择的代码导航点列表：\n\
  \n![](img/as_code_structure_menu.jpg)\n\n图 8-3\n\n### D – 编辑器区域 (The Editor Area)\n\
  用户在此处查看、输入和编辑代码的主区域。本章随后的章节将详细介绍编辑区域的关键功能。\n\n### E – 验证与标记侧边栏 (The Validation and\
  \ Marker Sidebar)\nAndroid Studio 集成了一个名为“即时代码分析”（on-the-fly code analysis）的功能。这意味着当你编写代码时，编辑器会分析代码以检查警告和语法错误。验证侧边栏顶部的指示器将实时更新，显示添加代码时的错误和警告数量。点击此指示器将显示一个弹出窗口，其中包含编辑器代码问题的摘要，如图\
  \ 8-4 所示：\n\n![](img/as_editor_validation_summary.jpg)\n\n图 8-4\n\n向上和向下箭头可以在代码中的错误位置之间移动。绿色勾号表示未检测到任何警告或错误。\n\
  \n侧边栏还使用相同的颜色编码在检测到问题的位置显示标记。当编辑器区域可见某行代码时，将鼠标指针悬停在标记上，将显示一个包含问题描述的弹出窗口：\n\n![](img/as_code_editor_problem_popup.jpg)\n\
  \n图 8-5\n\n当某行代码滚动出编辑器的可视区域时，将鼠标指针悬停在该代码标记的标记上，将显示一个“透镜”（lens）覆盖层，包含问题所在的代码块（图 8-6），从而无需滚动到编辑器的该位置即可查看：\n\
  \n![](img/as_code_editor_lens.jpg)\n\n图 8-6\n\n值得注意的是，透镜覆盖层不仅限于侧边栏中的警告和错误。悬停在侧边栏的任何部分都会导致出现一个透镜，其中包含源文件中该处的代码。\n\
  \n### F – 状态栏 (The Status Bar)\n虽然状态栏是主窗口的一部分，而不是编辑器本身，但它确实包含了一些关于当前活动编辑会话的信息。这些信息包括光标在行和字符上的当前位置以及文件的编码格式（UTF-8、ASCII\
  \ 等）。点击状态栏中的这些值可以更改相应的设置。例如，点击行号会显示 `Go to Line:Column` 对话框。使用 `View -> Appearance\
  \ -> Status Bar Widgets` 选项可以添加和删除部件。例如，如果你遇到 Android Studio 的性能问题，`Memory Indicator`内存指示器）是一个非常有用的部件。在提供了\
  \ Android Studio 编辑器元素概述后，本章的剩余部分将详细探讨编辑环境的关键功能。\n\n### 8.2 分割编辑器窗口\n\n默认情况下，编辑器将显示当前选中文件的单个面板。在同时处理多个源文件时，一个实用的功能是将编辑器拆分成多个窗格。要拆分编辑器，右键点击编辑器窗口中的文件标签并选择\
  \ `Split Right`向右拆分）或 `Split Down`向下拆分）菜单选项。例如图 8-7 显示了拆分器的用法，编辑器被拆分为三个面板：\n\n![](img/as_code_editor_split.jpg)\n\
  \n图 8-7\n\n随时可以通过右键点击相应的标签并选择 `Change Splitter Orientation`菜单选项来更改拆分面板的方向。重复这些步骤可以取消拆分面板，此时从菜单中选择\
  \ `Unsplit`选项。可以通过右键点击任何标签并选择 `Unsplit All`选项来移除所有拆分面板。\n\n窗口拆分可用于显示不同的文件，也可为同一个文件提供多个窗口，允许并发查看和编辑同一文件的不同区域。\n\
  \n### 8.3 代码补全\n\n\n\n\n\nAndroid Studio 编辑器内置了大量 Java 编程语法以及构成 Android SDK 的类和方法的知识，同时也包含了对你自己的代码库的了解。在输入代码时，编辑器会扫描输入的内容，并在适当的情况下就完成某个语句或引用可能需要的内容提供建议。当编辑器检测到补全建议时，会出现一个包含建议列表的面板。例如，在图\
  \ 8-8 中，编辑器正在为 `String` 声明的开头提供可能的选项：\n\n![](img/as_code_editor_completion.jpg)\n\
  \n图 8-8\n\n如果没有自动补全建议是正确的，请继续输入，编辑器将在适当的情况下继续精炼建议。要采纳最顶部的建议，请按键盘上的 `Enter` 或 `Tab`\
  \ 键。要选择不同的建议，请使用方向键在列表中上下移动，再次使用 `Enter` 或 `Tab` 键选择高亮显示的项。\n\n可以使用 `Ctrl-Space`\
  \ 键盘组合键手动调用补全建议。这在更改编辑器中的单词或声明时非常有用。当光标置于编辑器中的某个单词上时，该单词将自动高亮。按下 `Ctrl-Space` 将显示一组备选建议。按下\
  \ `Tab` 键可以将当前单词替换为建议列表中的高亮项。\n\n除了实时自动补全功能，Android Studio 编辑器还提供了智能补全（Smart Completion）系统。智能补全使用\
  \ `Shift-Ctrl-Space` 键盘组合键调用，选中后根据代码当前的上下文提供更详细的建议。再次按下 `Shift-Ctrl-Space` 快捷键将从更广泛的范围内提供更多建议。\n\
  \n对于许多程序员来说，代码补全可能取决于个人喜好。针对这一事实，Android Studio 对自动补全设置提供了高程度的控制。可以通过打开 `Settings`\
  \ 对话框并在设置面板中选择 `Editor` -> `General` -> `Code Completion` 来查看和修改这些设置，如图 8-9 所示：\n\
  \n![](img/as_code_completion_settings.jpg)\n\n图 8-9\n\n### 8.4 语句补全\n\nAndroid Studio\
  \ 编辑器提供的另一种自动补全形式是语句补全。它可以自动填充方法和循环语句等项的括号和大括号。语句补全使用 `Shift-Ctrl-Enter`（macOS 上为\
  \ `Shift-Cmd-Enter`）键盘组合键调用。考虑以下代码：\n\n```java\nmyMethod()\n```\n\n在编辑器中输入此代码后，触发语句补全会导致编辑器自动为方法添加大括号：\n\
  \n```java\nmyMethod() {\n\n}\n```\n\n### 8.5 参数信息\n\n还可以请求编辑器提供关于方法接受的参数参数的信息。当光标置于方法调用括号之间时，`Ctrl-P`（macOS\
  \ 上为 `Cmd-P`）键盘组合键将显示该方法接受的参数，并将最可能的建议用**加粗**显示：\n\n![](img/as_code_editor_parametre_info_java.jpg)\n\
  \n图 8-10\n\n### 8.6 参数名提示\n\n代码编辑器可以配置为在方法调用内部显示参数提示。例如，图 8-11 高亮了 `Snackbar` 类中\
  \ `make()` 和 `setAction()` 方法调用中的参数提示：\n\n![](img/as_code_editor_hints.jpg)\n\n\
  图 8-11\n\n此模式的设置可以通过打开 `Settings` 对话框并导航到侧边栏的 `Editor` -> `Inlay Hints` -> `Java`\
  \ 来配置。在结果屏幕上开启或关闭可选编程语言的 `Parameter names` 选项。调整提示设置请点击 `Exclude list...` 链接并进行任何调整。\n\
  \n### 8.7 代码生成\n\n除了在输入时补全代码外，编辑器在某些条件下还可以为你生成代码。当光标位于文件中需要生成代码的位置时，可以使用 `Alt-Insert`（macOS\
  \ 上为 `Cmd-N`）键盘快捷键访问图 8-12 中所示的可用代码生成选项列表。\n\n![](img/as_code_generate_menu.jpg)\n\
  \n图 8-12\n\n例如，考虑一种情况：我们希望在项目中的 `Activity` 准备被操作系统销毁时收到通知。正如本书后后的章节所概述的那样，这可以通过重写\
  \ `Activity` 超类的 `onStop()` 生命周期方法来实现。若要让 Android Studio 为此生成一个存根方法，请从代码生成列表中选择\
  \ `Override Methods…` 选项，并从可用方法列表中选择 `onStop()` 方法：\n\n![](img/as_code_editor_override_dialog.jpg)\n\
  \n图 8-13\n\n选择要重写的方法后，点击 `OK` 将在 Java 源文件的当前光标位置生成该存根方法，如下：\n\n```java\n@Override\n\
  protected void onStop() {\n    super.onStop();\n}\n```\n\n### 8.8 代码折叠\n\n一旦源代码达到一定大小，即使是格式最整齐、组织最好的代码也可能变得难以处理和难以导航。Android\
  \ Studio 认为并不总是需要让每个代码块的内容可见。使用 Android Studio 编辑器的代码折叠功能可以让导航变得更容易。代码折叠通过鼠标指针悬停在源文件每个代码块开头的时出现的折叠箭头进行控制。例如，图\
  \ 8-14 高亮了一个未折叠方法定义的折叠箭头：\n\n![](img/as_code_editor_folding.jpg)\n\n图 8-14\n\n点击此标记将折叠语句，使仅签名行可见，如图\
  \ 8-15 所示：\n\n![](img/as_code_editor_folded.jpg)\n\n图 8-15\n\n要展开折叠的代码，请点击编辑器中的折叠箭头。若要在不展开的情况下查看隐藏代码，请将鼠标悬停在\
  \ `{…}` 指示上，如图 8-16 所示。编辑器随后显示包含折叠代码的覆盖层：\n\n![](img/as_code_editor_folded_lens_java.jpg)\n\
  \n图 8-16\n\n可以使用 `Ctrl-Shift-Plus` 和 `Ctrl-Shift-Minus` 键盘组合键折叠或展开文件中所有的代码块（macOS\
  \ 为 `Cmd-Shift-Plus` 和 `Cmd-Shift-Minus`）。\n\n默认情况下，Android Studio 编辑器会在打开源文件时自动折叠某些代码。要配置发生这种情况的，请在\
  \ `Settings` 对话框中导航到 `Editor` -> `General` -> `Code Folding` 项（图 8-17）：\n\n![](img/as_code_editor_folding_settings.jpg)\n\
  \n图 8-17\n\n### 8.9 快速文档查询\n\n通过将光标置于所需文档的声明上并按下 `Ctrl-Q` 快捷键（macOS 上为 `Ctrl-J`），可以访问与上下文相关的\
  \ Java 和 Android 文档。这将显示一个包含该项相关参考文档的弹出窗口。例如，图 8-18 显示了 Android `FloatingActionButton`\
  \ 类的文档：\n\n![](img/as_code_editor_documentation_lookup_java.jpg)\n\n图 8-18\n\n###\
  \ 8.10 代码格式化\n\n\n\n\n\n# 通常情况下，Android Studio 编辑器会在添加语句和代码块时，自动对缩进、间距和嵌套进行代码格式化。在需要重新格式化代码的情况下（这是很常见的情况，例如从网站复制并粘贴示例代码时），编辑器提供了源代码重格式功能，选择该功能后，它将自动重格式代码以匹配当前流行的代码风格。\n\
  \n按下 `Ctrl-Alt-L`（macOS 上为 `Cmd-Opt-L`）快捷键组合可以重格式源代码。要显示“重格式代码”对话框（图 8-19），请使用 `Ctrl-Alt-Shift-L`（macOS\
  \ 上为 `Cmd-Opt-Shift-L`）。该对话框提供了仅重格式当前选中的代码、编辑器中活动的整个源文件或仅重格式由于源码控制更新而更改的代码选项：\n\n\
  ![](img/as_reformat_code.jpg)\n\n图 8-19\n\n可以通过打开 Settings（设置）对话框并在侧边面板中选择 `Code\
  \ Style`（代码样式）来更改完整的代码样式偏好，这将访问支持的编程语言和标记语言列表。选择一种语言将提供大量的格式样式选项，所有选项都可以从 Android\
  \ Studio 默认值修改以匹配你偏好的代码风格。例如，要配置上述对话框中 `Rearrange`（重排）代码选项的设置，请展开 `Code Style` 部分，选择\
  \ `Java`，并在 `Java` 设置中选择 `Arrangement`（排列）选项卡。\n\n### 8.11 查找示例代码\n\nAndroid Studio\
  \ 编辑器提供了访问与代码列表中高亮条目相关的示例代码的方法。这对于学习如何使用特定的 `Android` 类或方法非常有帮助。要查找示例代码，可以在编辑器中高亮方法或类名，右键点击它，并选择\
  \ `Find Sample Code`（查找示例代码）菜单选项。如果有示例代码，将出现 `Find Sample Code` 面并列出匹配的示例列表。从列表中选择一个示例会将相应的代码加载到右侧面板。\n\
  \n### 8.12 Live Templates（实时模板）\n\n在编写 Android 代码时，你会发现有一些常用的常用结构。例如，一个常见的需求是使用\
  \ `Android Toast` 类向用户显示弹出消息。Live Templates 是常用代码结构的集合，可以通过输入初始字符后跟一个特殊键（默认设置为 `Tab`\
  \ 键）向编辑器中插入模板代码。要体验这一操作，请在代码编辑器中输入 `toast` 后按 `Tab` 键，Android Studio 将在光标位置插入以下代码以供编辑：\n\
  \n```java\nToast.makeText(\"\", \"\", Toast.LENGTH_SHORT).show();\n```\n\n要列出并编辑现有模板、更改特殊键或添加自己的模板，请打开\
  \ Settings 对话框，并在左侧导航面板的 `Editor` 部分选择 `Live Templates`：\n\n![](img/as_code_live_templates.jpg)\n\
  \n图 8-20\n\n使用上方 图 8-20 中标记为 `A` 的按钮进行添加、删除、复制或重置模板。要修改模板，从列表中选择它 (B) 并更改标记为 `C`\
  \ 的面板中的设置。\n\n### 8.13 总结\n\nAndroid Studio 编辑器尽力减少编写代码所需的打字量，并使代码更易阅读和导航。本章涵盖了关键编辑器功能，包括代码补全、代码生成、编辑器窗口拆分、代码折叠、重格式、文档查询和实时模板。\n\
  \n## 9. Android 架构概述\n\n到目前为止，本书已经采取了步骤来建立适用于使用 Android Studio 开发 Android 应用的环境。通过创建\
  \ Android Studio 应用项目，也迈向了应用开发过程的第一步。\n\n然而，在深入研究 Android 应用开发的实际问题之前，理解 `Android\
  \ SDK` 以及通用的 Android 开发的一些更抽象的概念至关重要。现在清晰地理解这些概念将为构建进一步的知识提供坚实的基础。\n\n本章从 Android\
  \ 架构的概述开始，并在本书后的几章节中继续，目标是提供 Android 开发基础知识的详细概述。\n\n## 9.1 Android 软件栈\n\nAndroid\
  \ 结构化为一个软件栈，由应用程序、操作系统、运行时环境、中间件、服务和库组成。这种架构可以通过视觉方式最好地表示，如 图 9-1 所示。栈的每一层以及每层中相应的元素都是紧密集成并经过调优的，为移动设备提供最佳的应用开发和执行环境。本章的其余部分将介绍\
  \ Android 栈的不同层，从底部的 `Linux Kernel` 开始。\n\n![](img/Image2438.jpg)\n\n图 9-1\n\n##\
  \ 9.2 Linux 内核\n\n`Linux Kernel` 位于 Android 软件栈的底部，在设备硬件和 Android 软件栈上层之间提供了抽象。内核提供了抢占式多任务处理、底层核心系统服务（如内存、进程和电源管理），以及针对显示器、WiFi\
  \ 和音频等硬件的网络栈和设备驱动。\n\n原始 Linux 内核是由 Linus Torvalds 在 1991 年开发的。它与 Richard Stallman\
  \ 在自由软件基金会开发的一系列工具、实用程序和编译器结合起来，创建了一个名为 `GNU/Linux` 的完整操作系统。各种 Linux 发行版都是从这些基础衍生而来的，例如\
  \ `Ubuntu` 和 `Red Hat Enterprise Linux`。\n\n然而，重要的是 Android 只使用了 `Linux 内核`。尽管如此，值得注意的是，Linux\
  \ 内核最初是为桌面和服务器计算机系统设计的。事实上，Linux 现在在关键任务服务器环境中的部署最广泛。正是由于移动设备的强大以及 Linux 内核的效率和性能，我们发现这种软件位于\
  \ Android 软件栈的核心。\n\n## 9.3 Android 运行时 – ART\n\n当 Android 应用在 Android Studio 中构建时，它被编译为中间字节码格式（DEX\
  \ 格式）。当应用随后加载到设备时，Android 运行时 (ART) 使用称为预前编译 (AOT) 的过程将字节码翻译为设备处理器所需的原生指令。这种格式被称为可执行可链接格式\
  \ (ELF)。\n\n随后每次启动应用时都会运行 ELF 可执行版本，从而获得更快的性能并延长电池寿命。这与旧版 Android 中使用的即时编译 (JIT)\
  \ 方法形成对比，后者在每次启动应用时在虚拟机 (VM) 中翻译字节码。\n\n## 9.4 Android 库\n\n除了标准的 Java 开发库（为字符串处理、网络和文件操作等通用任务提供支持）之外，Android\
  \ 开发环境还包含 Android 库。这些是用于 Android 开发的 Java 库。此类类别的库包括应用框架库，以及促进用户界面构建、图形绘制和数据库访问的库。\n\
  \nAndroid 开发可以使用的一些核心 Android 库摘要如下：\n\n• `android.app` – 提供对应用模型的访问，是所有 Android\
  \ 应用的基石。\n\n\n\n\n\n- `android.content` – 促进应用程序与应用程序组件之间内容的访问、发布和传递。\n- `android.database`\
  \ – 用于访问内容提供程序（content providers）发布的数据，包含 SQLite 数据库管理类。\n- `android.graphics` –\
  \ 一个低层 2D 图形绘制 API，包括颜色、点、过滤器、矩形和画布。\n- `android.hardware` – 提供一个用于访问加速度计和光线传感器等硬件的\
  \ API。\n- `android.opengl` – 用于访问 OpenGL ES 3D 图形渲染 API 的 Java 接口。\n- `android.os`\
  \ – 为应用程序提供标准操作系统服务的访问，包括消息、系统服务和进程间通信。\n- `android.media` – 提供用于音频和视频播放的类。\n- `android.net`\
  \ – 一组提供网络栈访问的 API。包括 `android.net.wifi`，它提供了对设备无线网络栈的访问。\n- `android.print` – 包含一组类，允许从\
  \ Android 内部将内容发送到已配置的打印机。\n- `android.provider` – 一组便利类，提供对标准的 Android 内容提供程序数据库的访问，例如由日和联系人应用维护的数据库。\n\
  - `android.text` – 用于在设备显示上渲染和操作文本。\n- `android.util` – 一组工具类，用于执行字符串和数字转换、XML 处理以及日期处理等任务。\n\
  - `android.view` – 应用程序用户界面的基础构建模块。\n- `android.widget` - 丰富的预构建用户界面组件集合，如按钮、标签、列表视图、布局管理器、单选按钮等。\n\
  - `android.webkit` – 一组旨在允许在应用程序中构建网络浏览访问能力的类。\n\n在涵盖了 Android 运行时基于 Java 的库之后，现在是时候让我们关注\
  \ Android 软件栈这一层中基于 C/C++ 的库了。\n\n#### 9.4.1 C/C++ 库\n\n前一节概述的 Android 运行时核心库是基于\
  \ Java 的，为 Android 开发者提供了主要的 API。然而，需要注意的是，这些核心库并没有执行大部分实际工作，事实上，它们本质上是对一组 C/C++\
  \ 库的 Java “包装器”（wrappers）。例如，当调用 `android.opengl` 库在设备显示屏上绘制 3D 图形时，该库最终会调用 OpenGL\
  \ ES C++ 库，而该库又与底层 Linux 内核协作执行绘制任务。\n\n包含 C/C++ 库是为了满足广泛且多样的功能，包括 2D 和 3D 图形绘制、安全套接层\
  \ (SSL) 通信、SQLite 数据库管理、音频视频播放、位图和矢量字体渲染、显示子系统和图形层管理以及标准 C 系统库 (`libc`) 的实现。\n\n\
  在实践中，典型的 Android 开发者将仅通过 Java 的 Android 核心库 API 访问这些库。如果需要直接访问这些库，可以使用 Android Native\
  \ 开发包 (`NDK`) 实现，其目的是通过 Java Native Interface (`JNI`) 在 Java 代码中调用非 Java 或 Kotlin\
  \ 编程语言（如 C 和 C++）的原生方法。\n\n## 9.5 框架\n\n应用程序框架是一组服务，共同构成了 Android 应用程序运行和管理的环境。该框架实现了这样一个概念：Android\
  \ 应用程序是由复用、可交换和可替换的组件构建的。这一概念更进一步，应用程序还可以发布其功能以及任何相关数据，以便其他应用程序可以发现并复用它们。\n\nAndroid\
  \ 框架包含以下关键服务：\n\n- Activity 管理器（Activity Manager） – 控制应用程序生命周期和 Activity 栈的所有方面。\n\
  - 内容提供程序（Content Providers） – 允许应用程序与其他应用程序共享数据。\n- 资源管理器（Resource Manager） – 提供非代码嵌入资源的访问，如字符串、颜色设置和用户界面布局。\n\
  - 通知管理器（Notifications Manager） – 允许应用程序向用户显示警告和通知。\n- 视图系统（View System） – 用于创建应用程序用户界面的扩展视图集。\n\
  - 包管理器（Package Manager） – 查找设备上已安装的其他应用程序信息的系统。\n- 电话管理器（Telephony Manager） – 为应用程序提供设备可用电话服务的信息，例如状态和订阅者信息。\n\
  - 位置管理器（Location Manager） – 提供位置服务的访问，允许应用程序接收位置变化的更新。\n\n## 9.6 应用程序\n\n应用程序位于\
  \ Android 软件栈的顶部。它们由特定的 Android 实现提供的原生应用程序（例如网络浏览器和电子邮件应用）以及用户在购买设备后安装的第三方应用程序组成。\n\
  \n## 9.7 总结\n\n良好的 Android 开发基础需要理解 Android 的整体架构。Android 被实现为一种软件栈架构，由 Linux 内核、运行时环境、相应的库、应用程序框架和一组应用程序组成。应用程序主要用\
  \ Java 或 Kotlin 编写，并在 Android Studio 构建环境中被编译为字节码格式。当应用程序随后安装到设备上时，这些字节码会由 Android\
  \ 运行时 (`ART`) 编译为 CPU 使用的原生格式。Android 架构的关键目标是性能和效率，既体现在应用程序执行中，也体现在应用程序设计的复用中。\n\
  \n## 10. Android 应用程序剖析\n\n无论你之前的编程经验是基于 Windows、macOS、Linux 甚至 iOS 的，Android 开发很有可能与你以前遇到的任何事物都大不相同。\n\
  \n因此，本章的目标是帮助你理解 Android 应用程序架构背后的高级概念。通过这种方式，我们将详细探索用于构建应用程序的各种组件，以及允许这些组件协同工作以创建一个统一应用程序的机制。\n\
  \n### 10.1 Android Activity\n\n熟悉 Java、Kotlin、C++ 或 C# 等面向对象语言的人会熟悉这种概念：将应用程序功能的元素封装在类中，然后将其实例化为对象并进行操作以创建应用程序。对于使用\
  \ Java 和 Kotlin 编写的 Android 应用程序来说，事实依然如此。然而，Android 将组件组件的概念推向了更高的层次。\n\nAndroid\
  \ 应用程序是由一个或多个称为 Activity 的组件创建的。Activity 是一个独立的应用程序功能模块，通常直接对应于单个用户界面屏幕及其相应的功能。例如，一个预约应用程序可能有一个显示当天预约的\
  \ Activity 屏幕。该应用程序还可能使用另一个 Activity，它由一个用户可以输入新预约的屏幕组成。\n\n\n\n\nActivity（活动）被设计为完全可重用且可交换的区块，可以在不同的应用程序之间共享。现有的电子邮件应用程序可能包含一个用于编写和发送电子邮件消息的\
  \ Activity。开发者可能正在编写一个也需要发送电子邮件消息的应用程序。开发者无需为新应用程序专门开发一个邮件编写 Activity，而是可以直接使用现有电子邮件应用程序中的\
  \ Activity。\n\nActivity 是作为 `Android Activity` 类的子类创建的，并且必须实现为完全独立于应用程序中的其他 Activity。换句话说，共享的\
  \ Activity 不能依赖于在程序流的已知某一点被调用（因为其他应用程序可能会以意想不到的方式使用该 Activity），而且一个 Activity 不能直接调用另一个\
  \ Activity 的方法或访问其实例数据。相反，这通过 `Intents`（意图）和 `Content Providers`（内容提供者来实现。\n\n默认情况下，Activity\
  \ 不能向调用它的 Activity 返回结果。如果需要此功能，则必须显式地作为源 Activity 的子 Activity 启动该 Activity。\n\n\
  ## 10.2 Android Fragments（片段）\n\n如上所述，一个 Activity 通常代表应用内部的单个用户界面屏幕。一种方案是使用单个用户界面布局和一个对应的\
  \ Activity 类文件来构建 Activity。然而，更好的替代方案是将 Activity 拆分为不同的部分。每个部分都是一个 Fragment（片段），由用户界面布局的一部分和一个匹配的类文件（声明为\
  \ `Android Fragment` 类的子类）组成。在这种情况下，Activity 变成一个容器，可以在其中嵌入一个或多个 Fragment。\n\nFragment\
  \ 提供了一种高效的替代方案，无需为每个用户界面屏幕都表示一个独立的 Activity。相反，应用可以拥有一个 Activity，在不同的片段之间切换，每个片段代表不同的应用屏幕。\n\
  \n## 10.3 Android Intents（Android 意图）\n\n`Intents` 是一个 Activity 启动另一个 并 实现组成应用程序的\
  \ Activity 执行流的机制。`Intents` 由一个对要执行的操作的描述以及可选的要在其上执行的数据组成。\n\n`Intents` 可以是显式的（explicit），即通过通过类名引用\
  \ Activity 来请求启动特定的 Activity；也可以是隐式的（implicit），即通过陈明要执行的操作类型或提供要在其上执行操作的特定类型的数据。在隐式意图的情况下，Android\
  \ 运行时将使用称为 `Intent Resolution`（意图解析）的过程，选择最符合 `Intent` 所述标准的 Activity 进行启动。\n\n\
  ## 10.4 Broadcast Intents（广播意图）\n\n另一种 `Intent` 类型是 `Broadcast Intent`（广播意图），它是向所有注册了“感兴趣”`Broadcast\
  \ Receiver`（广播接收器）的应用程序发送的系统级意图。例如，Android 系统通常发送 `Broadcast Intents` 来指示设备状态的变化，例如系统启动完成、外部电源连接到设备或屏幕开启关闭。\n\
  \n`Broadcast Intent` 可以是正式的（异步的），即它在大约相同的时间发送给所有感兴趣的 `Broadcast Receiver`；也可以是有序的，即它一次发送给一个接收器，由接收器进行处理，然后要么终止，要么允许传递给下一个\
  \ `Broadcast Receiver`。\n\n## 10.5 Broadcast Receivers（广播接收器）\n\n`Broadcast Receivers`\
  \ 是应用程序响应 `Broadcast Intents` 的机制。`Broadcast Receiver` 必须由应用程序注册并配置 `Intent Filter`（意图过滤器），以指示其感兴趣的广播类型。当广播一个匹配的意图时，无论注册该接收器的应用程序当前是否正在运行，Android\
  \ 运行时都会调用该接收器。接收器随后有 5 秒钟来完成所需的任务（例如启动 `Service`、更新数据或向用户发出通知），然后返回。`Broadcast Receivers`\
  \ 在后台运行，没有用户界面。\n\n## 10.6 Android Services（Android 服务）\n\n`Android Services` 是在后台运行且没有用户界面的进程。它们可以从\
  \ Activity、`Broadcast Receivers` 或其他 `Services` 启动和管理。`Android Services` 适用于应用程序需要继续执行任务但不一定需要用户可见用户界面的情况。虽然\
  \ `Services` 缺乏用户界面，但它们仍然可以使用通知和 Toasts（在屏幕上显示且不中断当前可见 Activity 的小型通知消息）来通知用户事件，并且能够发出\
  \ `Intents`。\n\nAndroid 运行时赋予 `Services` 高于许多其他进程的优先级，系统只在最后情况下才会将其终止以释放资源。然而，如果运行时需要杀死一个\
  \ `Service`，它将在一旦可用资源时自动重启。`Service` 可以通过声明自己为需要在前台运行来降低被终止的风险。这是通过调用 `startForeground()`\
  \ 实现的。这仅建议用于终止会对用户体验不利的情况（例如，如果用户正在听由 `Service` 流出的音频）。\n\n`Service` 可能作为实际解决方案的示例场景包括：如之前提到的，当应用程序不再处于活动状态时应继续播放的音频流，或者当股票达到指定价格时需要通知用户的股票跟踪应用程序。\n\
  \n## 10.7 Content Providers（内容提供者）\n\n`Content Providers` 实现了一种在应用程序之间共享数据机机制。任何应用程序都可以通过实现\
  \ `Content Provider` 为其他应用程序提供访问其底层数据的权限，包括添加、删除和查询数据的能力（取决于权限）。对数据的访问通过由 `Content\
  \ Provider` 定义的通用资源标识符 (`URI`）提供。数据可以以文件或整个 `SQLite database` 的形式共享。\n\n原生 Android\
  \ 应用包含几个标准的 `Content Providers`，允许应用程序访问联系人和媒体文件等数据。Android 系统上当前可用的 `Content Providers`\
  \ 可以使用 `Content Resolver`（内容解析器）定位。\n\n## 10.8 Application Manifest（应用清单）\n\n`Application\
  \ Manifest` 文件是将应用程序的各种元素整合在一起的胶水。在这个基于 XML 的文件中，应用程序概述了组成完整应用程序的活动、服务、广播接收器、数据提供者和权限。\n\
  \n## 10.9 Application Resources（应用资源）\n\n除了清单文件和包含字节码的 `Dex` 文件外，Android 应用程序包通常包含一组资源文件。这些文件包含显示用户界面的字符串、图像、字体和颜色，以及用户界面布局的\
  \ XML 表示。这些文件默认存储在应用程序项目层次结构的 `/res` 子目录下。\n\n## 10.10 Application Context（应用上下文）\n\
  \n当应用程序编译时，会创建一个名为 `R` 的类，包含应用资源的引用。应用清单文件和这些资源创建了所谓的 `Application Context`。该上下文由\
  \ `Android Context` 类表示，可以在应用程序代码中使用并在运行时访问应用资源。此外，可以在上下文上调用广泛的方法来获取信息并在运行时更改应用程序的环境。\n\
  \n## 10.11 Summary（总结）\n\n\n\n\n\n可以将许多不同的元素组合在一起创建一个 Android 应用程序。在本章中，我们提供了 `Activities`、`Fragments`、`Services`、`Intents`\
  \ 和 `Broadcast Receivers` 的高级概述，以及对清单文件（manifest file）和应用资源的概述。\n\n通过以活动和意图的形式创建独立的独立功能模块，可以最大限度地提高重用性和互操作性，同时通过实现\
  \ `content providers`来实现应用之间的数据共享。\n\n虽然 `activities` 专注于用户与应用程序交互的区域（一个活动本质等同于单个用户界面屏幕，通常由一个或多个\
  \ `fragments` 组成），但后台处理通常由 `Services` 和 `Broadcast Receivers` 处理。\n\n构成应用程序的组件在清单文件中为\
  \ Android 运行时系统列出，该文件结合应用资源共同代表了应用程序的 `context`。\n\n本章涵盖了许多对普通开发者来说可能是新的内容。不过，请放心，在随后的章节中将对这些概念进行深入的探索和实际应用，以确保为构建自己的应用程序打下坚实的知识基础。\n\
  \n## 11. Android View Binding 概述\n\n开发 Android 应用的一个重要部分涉及代码与构成用户界面布局的视图之间的交互。本章将介绍在代码中访问布局视图的选项，重点强调名为\
  \ `view binding` 的选项。在涵盖了 view binding 的基础之后，本章将概述如何将 `AndroidSample` 项目转换为使用这种方法。\n\
  \n## 11.1 通过 Id 查找视图\n\n正如“Android 应用程序剖析”章节中所述，构成应用程序的所有资源都被编译成一个名为 `R` 的类。在这些资源中包含了定义布局的资源。`R`\
  \ 类中有一个名为 `layout` 的子类，它包含了布局资源，包括构成用户界面的视图。大多数应用都需要实现代码与这些视图之间的交互，例如，当读取输入到 `EditText`\
  \ 视图中的值或更改在 `TextView` 上显示的内容时。\n\n在 Android Studio 3.6 引入之前，从应用代码内部访问视图的最常用选项是编写代码通过\
  \ `findViewById()` 方法根据 id 手动查找视图。例如：\n\n```\nTextView exampleView = findViewById(R.id.exampleView);\n\
  ```\n\n获取引用后，就可以访问视图的属性了。例如：\n\n```java\nexampleView.setText(\"Hello\");\n```\n\n\
  虽然通过 id 查找视图仍然是一个可行选项，但它具有一些局限性，`findViewById()` 最显著的缺点是可能会获取到一个尚未在布局中创建的视图引用，导致在尝试访问视图属性时出现空指针异常。\n\
  \n从 Android Studio 3.6 开始，已经有了以 `view binding` 形式提供的另一种从应用代码访问视图的替代方法。\n\n## 11.2\
  \ View Binding\n\n当应用模块中启用 `view binding` 时，Android Studio 会为每个布局文件自动生成一个绑定类（binding\
  \ class）。在代码内部可以使用此绑定类访问布局视图，而无需使用 `findViewById()`。\n\nAndroid Studio 生成的绑定类名称基于布局文件名转换为所谓的“驼峰命名法”，并在结尾附加“Binding”单词。例如，对于\
  \ `activity_main.xml` 文件，绑定类将被称为 `ActivityMainBinding`。\n\nAndroid Studio Hedgehog\
  \ 在项目模板中使用 view bindings 的做法并不一致。例如，我们在创建 `AndroidSample` 项目时使用的 Empty Views Activity\
  \ 模板没有使用 view bindings。另一方面，Basic Views Activity 模板是使用 `view binding` 实现的。如果你使用不使用\
  \ `view binding` 的模板，了解如何将其添加到你的项目中将非常重要。\n\n## 11.3 转换 AndroidSample 项目\n\n在本章的剩余部分中，我们将通过将\
  \ `AndroidSample` 项目转换为使用 view binding 代替 `findViewById()` 来练习迁移到 view bindings。\n\
  \n首先启动 Android Studio 并打开在在 Android Studio 中创建示例 Android 应用章节中创建的 `AndroidSample`\
  \ 项目。\n\n## 11.4 启用 View Binding\n\n要使用 `view binding`，必须对需要 view binding 的每个模块的\
  \ `build.gradle.kts` 文件进行更改。对于 `AndroidSample` 项目，这将对 Gradle Scripts -> `build.gradle.kts\
  \ (Module: app)` 文件进行微调。将此文件加载到编辑器，找到 `android` 部分并添加以下项以启用 `viewBinding` 属性：\n\n\
  ```kotlin\nplugins {\n    id(\"com.android.application\")\n}\n\nandroid {\n    buildFeatures\
  \ {\n        viewBinding = true\n    }\n}\n```\n\n完成此更改后，点击编辑器面板顶部的 `Sync Now` 链接，然后使用\
  \ Build 菜单清理并重新构建项目，以确保生成绑定类。下一步是在代码中使用绑定类。\n\n## 11.5 使用 View Binding\n\n此过程的第一步是“膨胀”（inflate）view\
  \ binding 类以访问布局内的根视图。该根视图将将用作布局的内容视图。\n\n执行这些任务的逻辑位置是在与布局相关的活动的 `onCreate()` 方法中。一个典型的\
  \ `onCreate()` 方法读取如下：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  }\n```\n\n要切换到使用 view binding，需要导入视图绑定类并如下所示修改类。注意，由于布局名为 `activity_main`，我们可以推断\
  \ Android Studio 生成的绑定类将是 `ActivityMainBinding`。注意如果在创建项目时使用了 `com.example` 以外的域名，下面的导入语句需要更改：\n\
  \n```java\nimport android.widget.EditText;\nimport android.widget.TextView;\nimport\
  \ com.example.androidsample.databinding.ActivityMainBinding;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\n\
  \    // 现在我们有了绑定的引用，可以按名称访问视图：\n    public void convertCurrency(View view) {\n \
  \       EditText dollarText = findViewById(R.id.dollarText);\n        TextView textView\
  \ = findViewById(R.id.textView);\n        if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n            Float dollarValue = Float.valueOf(binding.dollarText.getText().toString());\n\
  \            Float euroValue = dollarValue * 0.85F;\n            binding.textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", euroValue));\n        } else {\n            binding.textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n## 11.6 选择选项\n\n尽管在 Empty Views Activity 项目模板中没有采用\
  \ view bindings，Google 强烈建议尽可能使用 view binding。因此，在开发自己的项目时应使用 view binding。\n\n\
  ## 11.7 书中示例中的 View Binding\n\n\n\n\n\n本书中任何依赖未实现视图绑定（view binding）项目模板的章节都将首先进行迁移。然而，为了避免在每次需要迁移时都重复这些步骤，这些章节将引导你回到此处复习记忆（别担心，在过了几个章节之后，必要的更改将变成你的本能）。为了帮助这一过程，接下来的部分更简要地总结了迁移步骤。\n\
  \n## 11.8 将项目迁移到视图绑定\n\n将项目模块转换为使用视图绑定的过程涉及以下步骤：\n\n1. 在 Project 工具窗口中找到列出的模块级 Gradle\
  \ 构建脚本文件，路径为 `Gradle Scripts -> build.gradle.kts (Module :app)`，其中 `<project name>`\
  \ 是项目名称（例如 `AndroidSample`）。\n\n2. 找到文件中的 `android` 部分，并添加如下条目以启用 `viewBinding`\
  \ 属性：\n\n```kotlin\nandroid {\n    buildFeatures {\n        viewBinding = true\n\
  \    }\n}\n```\n\n3. 点击编辑器顶部的 `Sync Now` 链接，使用这些新的构建设置重新同步项目。\n\n4. 编辑 `MainActivity.java`\
  \ 文件并将其修改为如下内容（其中 `<reverse domain>` 代表创建项目时使用的域名，`<project name>` 替换为项目的小写名称，例如\
  \ `androidsample`），`<binding name>` 是对应布局资源文件的绑定类名称（例如，`activity_main.xml` 的绑定为\
  \ `ActivityMainBinding`）。\n\n```java\nimport android.view.View;\nimport android.<reverse\
  \ domain>.<project name>.databinding.<binding name>;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private <binding name> binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        binding = <binding name>.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\
  }\n```\n\n5. 通过 `binding` 对象的属性名称访问视图。\n\n## 11.9 总结\n\n在 Android Studio 3.6 引入之前，在\
  \ App 代码中访问布局视图需要使用 `findViewById()` 方法。现在有了可用视图绑定这种形式的替代方案。视图绑定由 Android Studio\
  \ 为每个 XML 布局文件自动生成的类组成。这些类包含了对对应布局中每个视图的绑定，提供了比 `findViewById()` 方法更安全的选项。然而，从 Android\
  \ Studio Hedgehog 版本开始，某些项目模板默认未启用视图绑定。需要额外的步骤来手动在每个项目模块中启用并配置支持。\n\n## 12 理解 Android\
  \ 应用程序和 Activity 生命周期\n\n在早的章节中，我们学习了 Android 应用程序运行在进程中，并以 Activity、Service 和广播接收器的形式组成多个组件。本章旨在通过查看\
  \ Android 运行时系统内应用程序和 Activity 的生命周期来扩展这些知识。\n\n无论当今移动设备与过去的桌面系统相比拥有多少内存和计算能力并被如何宣扬，但重要的是记住，根据现代桌面和笔记本电脑系统的标准，这些设备仍然被认为是“资源受限的”，特别是在内存方面。因此，Android\
  \ 系统的核心职责之一是确保有效管理这些有限资源，并确保操作系统和运行其上的应用程序始终对用户保持响应。为了实现这一点，Android 对运行应用程序的进程以及组成这些应用程序的各个组件的生命周期和状态拥有完全控制权。因此，开发\
  \ Android 应用的重要因素是理解 Android 的应用程序和 Activity 生命周期管理模型，以及应用程序如何响应在其执行生命周期内可能对其施加的状态变化。\n\
  \n### 12.1 Android 应用程序与资源管理\n\n操作系统将每个运行的 Android 应用程序视为独立的进程。如果系统识别到设备上的资源达到容量，它将采取措施终止进程以释放内存。\n\
  \n在决定终止哪个进程以释放内存时，系统会同时考虑所有当前运行进程的优先级和状态，结合这些因素创建 Google 所说的“重要性层次结构”（importance\
  \ hierarchy）。然后进程会被终止，从最低优先级开始按层次向上移动，直到为系统释放了足够的资源。\n\n### 12.2 Android 进程状态\n\n\
  进程托管应用程序，应用程序由组件组成。在 Android 系统中，进程的当前状态由其所托管应用程序中排名最高的活动组件定义。如图 12-1 所示，进程在任何时刻都可以处于以下五种状态之一：\n\
  \n![android_process_priorities.png](img/Image24381.jpg)\n图 12-1\n\n#### 12.2.1 前台进程\n\
  \n这些进程被赋予最高优先级。在任何时刻，活跃的前台进程可能只有一个或两个，它们通常是系统最后终止的。一个进程必须满足以下一个或多个标准才能获得前台状态资格：\n\
  \n* 托管一个用户当前正在交互的 Activity。\n* 托管一个与用户正在交互的 Activity 连接的 Service。\n* 托管一个通过调用 `startForeground()`\
  \ 指明终止将破坏用户体验的 Service。\n* 托管一个正在执行 `onCreate()`、`onResume()` 或 `onStart()` 回调的\
  \ Service。\n* 托管一个正在执行其 `onReceive()` 方法的广播接收器（Broadcast Receiver）。\n\n#### 12.2.2\
  \ 可见进程\n\n包含对用户可见但不是用户正在交互的 Activity 的进程被归类为“可见进程”。这通常发生在进程中的某个 Activity 对用户可见，但另一个\
  \ Activity（如部分屏幕或对话框）处于前台时。如果一个进程托管的 Service 本身绑定到一个可见或前台 Activity，那么该进程也具备可见状态的资格。\n\
  \n#### 12.2.3 Service 进程\n\n包含已启动并正在执行的 Service 的进程。\n\n#### 12.2.4 后台进程\n\n包含一个或多个当前对用户不可见的\
  \ Activity，且未托管符合 Service 进程状态的 Service 的进程。落入此类别的进程如果需要为高优先级进程释放额外内存，则面临极高的终止风险。Android\
  \ 维护着后台进程动态列表，按时间顺序终止进程，使得最久处于前台的进程首先被杀死。\n\n#### 12.2.5 空进程\n\n空进程不再包含活动应用程序，并保留在内存中，准备好作为新启动应用程序的宿主。这比比在预计乘客到达时保持车门开启并引擎运转。此类进程被认为优先级最低，是释放资源时最先杀死的。\n\
  \n### 12.3 进程间依赖关系\n\n\n\n\n\n确定最高优先级进程比前一节描述的要复杂，因为进程之间往往存在相互依赖关系。因此，在确定进程的优先级时，Android\
  \ 系统还会考虑该进程是否以某种方式为另一个高优先级进程提供服务（例如作为前台进程的内容提供者的服务进程）。根据基本规则，Android 文档指出，进程的排名永远不会低于它当前正在服务的另一个进程。\n\
  \n### 12.4 Activity 生命周期\n\n正如我们之前所确定的，Android 进程的状态主要由其宿主应用程序的 Activity 和组件的状态决定。因此，重要的一点是，这些\
  \ Activity 在应用程序的执行生命周期内也会经历不同的状态。Activity 的当前状态部分取决于它在所谓的 `Activity Stack`（Activity\
  \ 栈）中的位置。\n\n### 12.5 Activity 栈\n\n运行时系统为运行在 Android 设备上的每个应用程序都维护一个 `Activity\
  \ Stack`。当应用程序启动时，首先启动的应用程序中的 Activity 会被放入栈中。当启动第二个 Activity 时，它被放置在栈顶，而上一个 Activity\
  \ 则被向下推。栈顶的 Activity 被称为活跃（或运行中）Activity。当活跃 Activity 退出时，运行时会将其从栈中弹出，位于栈中紧邻下方的\
  \ Activity 变为当前活跃 Activity。例如，栈顶的 Activity 退出可能是因为它负责的任务已经完成了。或者，用户可能选择了屏幕上的“返回”按钮以回到上一个\
  \ Activity，导致当前 Activity 被运行时系统从栈中弹出并销毁。Android `Activity Stack` 的视觉化表示见图 12-2。\n\
  \n如图所示，新的 Activity 在启动时会被推入栈顶。当前活跃 Activity 一直位于栈顶，直到它被新的 Activity 推入栈下方，或者在它退出或用户导航到上一个\
  \ Activity 时被从栈中弹出。如果资源变得紧张，运行时将杀死 Activity，从栈底的 Activity 开始。\n\n`Activity Stack`\
  \ 就是编程术语中所指的“后进先出”（LIFO）栈，因为最后一个推入栈的项是第一个被弹出的。\n\n![android_activity_lifecycle_diagram.png](img/Image2447.jpg)\n\
  \n图 12-2\n\n## 12.6 Activity 状态\n\n在应用程序的执行过程中，Activity 可以处于以下几种状态之一：\n\n*   **活跃\
  \ / 运行中 (Active / Running)** – Activity 位于 `Activity Stack` 栈顶，是设备屏幕上可见的前台任务，拥有焦点，并且正在与用户交互。在资源不足的情况下，这种\
  \ Activity 最不容易被终止。\n*   **已暂停 (Paused)** – Activity 对用户可见，但目前没有焦点（通常是因为当前活跃的 Activity\
  \ 部分遮挡了该 Activity）。暂停的 Activity 保留在内存中，保持与窗口管理器连接，保留所有状态信息，并在移动到 `Activity Stack`\
  \ 栈顶时可以快速恢复到活跃状态。\n*   **已停止 (Stopped)** – Activity 当前对用户不可见（换句话说，它在设备显示上被其他 Activity\
  \ 遮挡）。与暂停的 Activity 一样，它保留所有的状态和成员信息，但在低内存情况下终止风险更高。\n*   **已杀死 (Killed)** – 运行时系统已终止该\
  \ Activity 以释放内存，它不再存在于 `Activity Stack` 中。如果应用程序需要，则必须重启此类 Activity。\n\n## 12.7\
  \ 配置更改\n\n到本章为止，我们已经了 Android Activity 状态变化的两种原因，即 Activity 在前台和后台之间的移动，以及运行时系统终止\
  \ Activity 以释放内存。事实上，还有第三种情况会导致 Activity 的状态发生剧变，即涉及设备配置的更改。\n\n默认情况下，任何影响 Activity\
  \ 外观的配置更改（例如在竖屏和横屏之间旋转设备或更改系统字体设置）都会导致 Activity 被销毁并重建。这背后的原因是此类更改会影响用户界面布局等资源，而销毁并重建受影响的\
  \ Activity 是 Activity 响应配置更改的最快方式。然而，也可以配置 Activity，使系统不会响应特定的配置更改而重启它。\n\n## 12.8\
  \ 处理状态变化\n\n从本章可以清楚地看出，应用程序以及根据定义包含在其中的组件在其整个生命周期内将经历许多状态的转换。尤为重要的事实是，这些状态变化（包括完全终止在内）是\
  \ Android 运行时根据用户操作和设备资源的可用性强加给应用程序的。\n\n但在实践中，这些状态变化并非在完全没有通知的情况下强加的，在大多数情况下，应用程序将收到运行时系统关于更改的通知，并获得相应反应的机会。这通常涉及保存或恢复内部数据结构和用户界面状态，从而允许用户在应用程序之间无缝切换，并至少提供多个应用程序并发运行的假象。\n\
  \nAndroid 提供了两种处理应用内对象生命周期状态变化的方法。一种涉及响应操作系统的状态更改方法调用，将在下一章“处理 Android Activity\
  \ 状态更改`中详细介绍。\n\nGoogle 推荐的这种方法涉及 Jetpack Android 架构组件包含的生命周期类，这些组件在使用 Jetpack 构建现代\
  \ Android 架构中介绍，并在名为使用 Android 生命周期感知组件章节中进行更详细的解释。\n\n### 12.9 总结\n\n移动设备通常被认为资源受限，特别是在内置内存容量方面。因此，Android\
  \ 操作系统的首要任务之一是确保应用程序以及整个操作系统保持响应。\n\n应用程序托管在 Android 的进程中。每个应用程序又由 Activity 和 Service\
  \ 形式的组件组成。\n\n\n\n\n\n# 13. 处理 Android Activity 状态更改\n\n根据“理解 Android 应用程序和 Activity\
  \ 生命周期]章节中概述的信息，现在显而易见，组成应用程序的 Activity 和 Fragment 在应用程序生命周期内会经历各种不同的状态。Android\
  \ 运行时系统强制从一个状态到另一个状态的转换，因此在很大程度上不受 Activity 自身的控制。然而，这并不意味着应用无法对这些变化做出反应并采取适当行动。\n\
  \n本章的主要目标是概述 Activity 如何接收状态更改的通知，并概述建议保存或恢复状态信息的区域。在涵盖这些信息后，本书将简要介绍 Activity 的生命周期。\n\
  \n## 13.1 新旧生命周期技术\n\n直到最近，一直有一种在应用中构建生命周期感知的标准方法。这种方法在本章中介绍，涉及在 Activity 或 Fragment\
  \ 实例中实现一组方法（每个生命周期状态对应一个），操作系统当这些对象的生命周期状态发生时会调用这些方法。这种方法自 Android 操作系统早期以来一直没有变化，虽然在今天仍然是一个可行选项，但它确实存在一些局限性，我们将在本书的稍后部分解释。\n\
  \n随着 Jetpack Android 架构组件引入了生命周期类，现在有了更好的生命周期处理方法。这种现代的生命周期管理方法（结合 Jetpack 组件和架构指南）将在后面的章节中进行详细介绍。然而，由于几个原因，理解传统的生命周期方法仍然至关重要。首先，作为\
  \ Android 开发人员，你无法完全隔离开传统的生命周期方法，并且仍然会使用其中。更重要的是，理解处理生命周期的旧方法将为以后书中学习新方法提供坚实的基础。\n\
  \n## 13.2 Activity 和 Fragment 类\n\n在少数例外，应用程序的 Activity 和 Fragment 分别作为 Android\
  \ `AppCompatActivity` 类和 `Fragment` 类的子类创建。\n\n例如，考虑在在 Android Studio 中创建示例 Android\
  \ 应用]中创建并转换为视图绑定（view binding）的 AndroidSample 项目。将此项目加载到 Android Studio 环境中并找到 `MainActivity.java`\
  \ 文件（位于 `app -> java -> <your domain> -> androidsample`）。找到文件后，双击将其加载到编辑器中，其内容如下：\n\
  \n```java\npackage com.example.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.view.View;\n\nimport android.os.Bundle;\n\nimport java.util.Locale;\n\
  \nimport com.example.androidsample.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\n\
  \    public void convertCurrency(View view) {\n        if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n            float dollarValue = Float.parseFloat(\n                    binding.dollarText.getText().toString());\n\
  \            float euroValue = dollarValue * 0.85F;\n            binding.textView.setText(\n\
  \                    String.format(Locale.ENGLISH,\"%.2f\", euroValue));\n     \
  \   } else {\n            binding.textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n在创建项目时，我们指示 Android Studio 同时也创建一个名为 `MainActivity.java`\
  \ 的初始 Activity。如上面的代码所示，`MainActivity` 类是 `AppCompatActivity` 类的子类。\n\n查看 `AppCompatActivity`\
  \ 类的参考文档会发现它本身也是 `Activity` 类的子类。在 Android Studio 编辑器中使用层次结构（Hierarchy）工具窗口可以验证这一点。将\
  \ `MainActivity.java` 文件加载到编辑器中后，点击类声明行中的 `AppCompatActivity` 并按下键盘快捷键 `Ctrl-H`。随后将出现层次结构工具窗口，显示所选类的类层次结构。如图图\
  \ 13-1 所示，`AppCompatActivity` 是继承自 `Activity` 类的子类：\n\n![](img/as_hierarchy.jpg)\n\
  \n图 13-1\n\nActivity 和 Fragment 类包含系列方法，旨在由 Android 运行时调用，以便在对象状态更改时通知该对象。在本章中，我们将这些方法称为生命周期方法。其中一个方法命名为\
  \ `onCreate()`，再次回到上面的代码，我们可以此方法已经被重写。\n\n## 13.3 动态状态 vs. 持久化状态\n\n生命周期管理的关键目标是确保\
  \ Activity 的状态在适当的时间被保存和恢复。当我们在此语境下讨论状态时，指的是 Activity 当前持有的数据以及用户界面的显示。例如，Activity\
  \ 可能会在内存中维护一个数据模型，该模型需要保存到数据库、内容提供程序或文件。因为它从应用程序的一次调用持续到另一次调用，因此这种状态信息被称为持久化状态（persistent\
  \ state）。\n\n用户界面的显示（例如输入到字段但尚未提交到应用程序数据模型的文本）被称为动态状态（dynamic state），因为它通常只在应用程序的单次调用期间保留（也称为界面状态或实例状态）。\n\
  \n理解这两种状态之间的差异非常重要，因为它们保存的方式以及保存的原因有所不同。保存持久化状态的目的是避免 Activity 在后台被杀死而导致的数据丢失。另一方面，动态状态的保存和恢复的原因略为复杂。\n\
  \n例如，假设一个应用程序包含一个 Activity（我们称为 Activity A），该 Activity 包含一个文本框和一些单选按钮。在使用程序期间，用户在文本框中输入了一些文本并在单选按钮上做了选择。然而，在执行这些更改的操作之前，用户切换到了另一个\
  \ Activity，导致 Activity A 被推入 Activity 栈并置于后台。一段时间后，运行时系统确定内存不足并杀死 Activity A 以释放资源。然而，从用户的角度来看，Activity\
  \ A 被放在了后台，并且可以随时移动到前台。当返回 Activity A 到前台时，用户会合理预期输入的文本和单选按钮的选择已被保留。然而，在这种情况下，将创建一个\
  \ Activity A 的新实例，如果动态状态没有被保存和恢复，之前的用户输入将会丢失。\n\n\n\n\n因此，保存动态状态的主要目的是为了提供前台和后台活动之间无缝切换的感知，无论活动是否可能在用户不知情的情况下被杀死并重启。\n\
  \n保存持久化状态和动态状态的机制在本章的后续章节中将变得更加。\n\n## 13.4 Android 生命周期方法\n\n如前所述，`Activity` 和\
  \ `Fragment` 类包含几个生命周期方法，这些方法在实例状态发生时作为事件处理器。Android `Activity` 和 `Fragment` 类支持的主要方法如下：\n\
  \n- `onCreate(Bundle savedInstanceState)` – 当活动首次创建时调用的方法，是执行大多数初始化任务的理想位置。该方法接收一个\
  \ `Bundle` 对象形式的参数，该对象可能包含来自活动之前调用的动态状态信息（通常与用户界面状态有关）。\n- `onRestart()` – 当活动之前被运行时系统停止后，准备重启时调用。\n\
  - `onStart()` – 始终在调用 `onCreate()` 或 `onRestart()` 方法后立即调用。此方法指示活动它即将对用户可见。如果活动移动到活动堆栈的顶端，则此调用之后将调用\
  \ `onResume()`；如果它被另一个活动推到堆栈下方，则将调用 `onStop()`。\n- `onResume()` – 指示活动现在处于活动堆栈的顶端，并且是用户当前交互的活动。\n\
  - `onPause()` – 指示上一个活动即将成为前台活动。此调用之后将调用 `onResume()` 或 `onStop()` 方法，取决于活动是返回前台还是对用户不可见。在此方法中可以采取措施存储尚未由应用保存的持久化状态信息。为了避免活动之间切换的延迟，应该避免在此方法内执行耗时的操作，例如将数据存储到数据库或执行网络操作。此方法还应该确保任何\
  \ CPU 密集型任务（如动画）已停止。\n- `onStop()` – 活动不再对用户可见。此调用后的两种可能场景是：如果活动再次回到前台，则调用 `onRestart()`；如果活动被终止，则调用\
  \ `onDestroy()`。\n- `onDestroy()` – 活动即将被销毁，可能是因为活动完成任务并调用了 `finish()` 方法，也可能是因为运行时终止它以释放内存或由于配置更改（例如设备方向发生变化）。需要注意的是，当活动终止时并不总是会调用\
  \ `onDestroy()`。\n- `onConfigurationChanged()` – 当发生配置更改且活动已指示不要重启时调用。该方法接收一个 `Configuration`\
  \ 对象，概述了新的设备配置，然后由活动负责对该更改做出反应。\n\n以下生命周期方法仅适用于 `Fragment` 类：\n\n- `onAttach()`\
  \ – 当 fragment 分配给活动时调用。\n- `onCreateView()` – 调用以创建并返回 fragment 的用户界面布局视图层级结构。\n\
  - `onViewCreated()` – 在 `onCreateView()` 返回后调用。\n- `onViewStatusRestored()` – fragment\
  \ 保存的视图层级结构已恢复。\n\n除了列出的生命周期方法外，还有两个方法专门用于保存和恢复活动的动态状态：\n\n- `onRestoreInstanceState(Bundle\
  \ savedInstanceState)` – 如果活动是从之前保存了状态的调用重启的，则该方法在调用 `onStart()` 方法后立即调用。与 `onCreate()`\
  \ 类似，此方法传递一个包含之前状态数据的 `Bundle` 对象。当在 `onCreate()` 和 `onStart()` 中完成活动初始化后，恢复之前的状态更有意义时，通常会使用此方法。\n\
  - `onSaveInstanceState(Bundle outState)` – 在活动销毁之前调用，以便保存当前的动态状态（通常与用户界面有关）。该方法传递一个应将状态保存其中的\
  \ `Bundle` 对象，该状态随后将在活动重启时被传递给 `onCreate()` 和 `onRestoreInstanceState()` 方法。请注意，只有当运行时确定需要保存动态状态时，才会调用此方法。\n\
  \n在重写上述方法时，务必记住，除了 `onRestoreInstanceState()` 和 `onSaveInstanceState()` 之外，方法实现必须包含对父类中对应方法的调用。例如，下面的方法重写了\
  \ `onRestart()` 方法，但也包含了对父类实例该方法的调用：\n\n```\nprotected void onRestart() {\n    super.onRestart();\n\
  \    Log.i(TAG, \"onRestart\");\n}\n```\n\n在方法重写中未进行此父类调用会导致运行时在执行期间抛出异常。虽然在 `onRestoreInstanceState()`\
  \ 和 `onSaveInstanceState()` 方法中对父类的调用是可选的（例如，在实现自定义保存和恢复行为时可以省略它们），但使用它们有显著的收益，这一主题将在题为\
  \ \"保存和恢复 Android 活动的状态\" 的章节中介绍。\n\n### 13.5 生命周期\n\n涵盖的最后一个主题涉及活动或 fragment 在执行期间将经历的整个、可见和前台生命期的概述：\n\
  \n- **整个生命 (Entire Lifetime)** – “整个生命”一词用于描述从首次调用 `onCreate()` 方法到对象终止前调用 `onDestroy()`\
  \ 发生的一切。\n- **可见生命 (Visible Lifetime)** – 涵盖调用 `onStart()` 和 `onStop()` 之间的执行期间。在此期间，活动或\
  \ fragment 对用户可见，尽管它可能不是用户当前交互的对象。\n- **前台生命 (Foreground Lifetime)** – 指调用 `onResume()`\
  \ 和 `onPause()` 方法之间的执行期间。\n\n需要注意的是，在整个生命期间，活动或 fragment 可能会多次经过前台和可见生命。\n\n生命和生命周期方法的概念如图\
  \ 13-2](#Activity_State_Changes.xhtml__idTextAnchor322) 所示：\n\n![android_activity_lifecycle_methods.png](img/Image2446.jpg)\n\
  \n图 13-2\n\n## 13.6 折叠屏设备与多恢复\n\n如前所述，当活动移动到前台并是用户当前交互的活动时，该活动被认为处于恢复状态。在标准设备上，应用任何时候只能有一个活动处于恢复状态，而所有其他活动可能处于暂停或停止状态。\n\
  \n长期以来，Android 一直包含了多窗口支持，允许多个活动在分屏或自由形式配置中同时出现。虽然最初主要用于大屏幕平板设备，但但随着折叠屏设备的推出，这一功能可能会更加流行。\n\
  \n\n\n\n在运行 Android 10 且启用多窗口支持的设备上（大多数折叠屏设备也是如此），多个应用活动（activity）可以同时处于恢复（resumed）状态（这种概念被称为多重恢复），使得可见的活动能够继续运行（例如，播放流媒体内容或更新视觉数据），即使当前有另一个活动获取了焦点。虽然可以有多个活动处于恢复状态，但其中只有一个活动将被视为顶层恢复活动（换句话说，就是用户最近交互的那个活动）。\n\
  \n通过实现 `onTopResumedActivityChanged()` 回调方法，活动可以获取其已获得或丢失顶层恢复状态的通知。\n\n### 13.7\
  \ 禁用配置更改重启\n\n如前所述，活动可以指示在某些配置更改发生时不重新重启。这是通过在项目清单文件中的 activity 元素中添加 `android:configChanges`\
  \ 指令来实现。例如，下面的清单文件片段表明，当发生与方向或全设备字体大小相关的配置更改时，不应重启该活动：\n\n```xml\n<activity android:name=\"\
  .MainActivity\"\n          android:configChanges=\"orientation|fontScale\"\n   \
  \       android:label=\"@string/app_name\">\n```\n\n### 13.8 生命周期方法的局限性\n\n正如本章开头所讨论的，生命方法已经使用了多年，直到最近，它们仍然处理活动和\
  \ fragment 生命周期周期状态变化的唯一机制。然而，这种方法仍有改进空间。\n\n生命方法的一个问题是，它们没有提供一种简单的方法让活动或 fragment\
  \ 在应用执行过程中的任何时刻发现其当前的生命周期状态。相反，对象必须在内部跟踪状态，或者等待下一次生命方法的调用。\n\n此外，这些方法没有提供一种简单的方法让一个对象观察应用内其他对象的生命状态变化。这是一个严重的考虑因素，因为给定活动或\
  \ fragment 的生命状态变化可能会影响应用内的许多其他对象。\n\n生命方法仅适用于 `Fragment` 和 `Activity` 类的子类。因此，无法构建真正感知生命周期的自定义类。\n\
  \n最后，生命方法导致大多数生命周期处理代码被写在活动或 fragment 内部，这可能导致代码复杂且易出错。理想情况下，这些代码大部分应该位于受状态更改影响的其他类中。例如，一个流媒体视频的应用可能会包含一个专门设计用于管理输入流的类。如果应用需要在主活动停止时暂停流，那么相应的代码应该位于流类中，而不是主活动中。\n\
  \n所有这些以及其他问题都可以使用生命周期感知组件来解决，该主题将在题为使用 Jetpack 构建现代 Android 应用架构的章节开始介绍。\n\n###\
  \ 13.9 总结\n\n所有活动都派自 `Activity` 类，而该类反过来包含了若干生命方法，这些方法设计用于运行时系统在活动状态更改时进行调用。同样，`Fragment`\
  \ 类也包含了若干类似的类比方法。通过重写这些方法，活动和 fragment 可以响应状态变化，并在必要时采取步骤保存并恢复活动及应用程序当前状态。生命状态可以被认为有两种形式。持久状态是指在应用调用之间需要存储的数据（例如，存储到文件或数据库中）。而动态状态则涉及用户界面的当前显示。\n\
  \n尽管生命方法具有一些可以使用生命周期感知组件避免的局限性，但理解这些方法对于充分理解书中后面介绍的生命管理新方法至关重要。\n\n在本章中，我们强调了活动可用的生命方法，并涵盖了活动生命周期的概念。在下一章中，题为通过示例了解\
  \ Android 活动状态变化，我们将实现一个示例应用，将这些许多理论付诸实践。\n\n# 14. 通过示例了解 Android 活动状态变化\n\n之前的章节详细讨论了构成\
  \ Android 应用的活动的不同状态和生命周期。在本章中，我们将通过创建一个示例应用，将处理活动状态变化的理论付诸实践。该示例应用的目的是为活动在 Android\
  \ 运行时中通过各种状态的过程提供一个真实世界的演示。在下一章中，题为保存和恢复 Android 活动的状态中，在本章中构建的示例项目将得到扩展，以演示动态活动状态的保存和恢复。\n\
  \n### 14.1 创建状态更改示例项目\n\n此练习的第一步是创建一个新项目。启动 Android Studio，并在必要时使用 `File -> Close\
  \ Project` 菜单选项关闭任何当前打开的项目，以便显示欢迎界面。\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `StateChange`，并指定 `com.ebookfrenzy.statechange`\
  \ 为包名。在点击 `Finish` 按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为\
  \ `Java`。完成项目创建过程后，`StateChange` 项目应列在 Android Studio 主窗口左侧的 Project 工具窗口中。使用第 11.8\
  \ 将项目迁移到 View Binding 节概述的步骤将项目转换为视图绑定。\n\n接下来的操作涉及活动用户界的设计。它存储在名为 `activity_main.xml`\
  \ 的文件中，该文件应该已经加载到 Layout 编辑器中。如果没有，请在 Project 工具窗口中导航到它，可以在 `app -> res -> layout`\
  \ 文件夹找到它。找到后，双击该文件将其加载到 Android Studio Layout 编辑器中。\n\n![](img/as_state_change_main_window.jpg)\n\
  \nFigure 14-1\n\n### 14.2 设计用户界面\n\n用户界面布局加载到 Layout 编辑器后，是时候为示例应用设计用户界面了。对于当前用户界面设计中的“Hello\
  \ World!” `TextView`，活动需要一个 `EditText` 视图。在 Component Tree 面中选择 `TextView` 对象并按键盘上的\
  \ `Delete` 键将其从设计中删除。\n\n从 Layout 编辑器左侧的 `Palette` 中，选择 `Text` 类别，并从文本列表中点击并拖动 `Plain\
  \ Text` 组件到布局画布上。将组件移动到屏幕中心使中心指南线出现，并将其放置到位，使布局类似于图 14-2 所示。\n\n![](img/as_statechange_ui.jpg)\n\
  \nFigure 14-2\n\n\n\n\n\n在使用 `EditText` 部件时，必须为该视图指定输入类型（input type）。这定义了用户将输入的文本或数据类型。例如，如果输入类型设置为\
  \ `Phone`，用户将仅限制在视图中输入数字。或者，如果将输入类型设置为 `TextCapCharacters`，输入将默认为大写字母。输入类型设置还可以组合使用。\n\
  \n在本例中，我们将使用默认输入类型来支持普通文本输入。如果将来想选择不同的设置，请在布局中选择 `EditText` 部件，并在属性（Attributes）工具窗口中找到\
  \ `inputType` 条目。接下来，点击当前设置左侧的旗帜图标打开选项列表，如下方的图 14-3 所示。`Type` 菜单提供了将输入限制为文本、数字、日期时间以及电话号码的选项。`Variations`\
  \ 菜单为当前选的输入类型提供额外的选项。例如，文本输入类型有一种变体，可将电子邮件地址作为输入。\n\n一旦选择了类型和变体，可以使用旗帜复选框列表进一步自定义输入类型：\n\
  \n![](img/as_text_input_type_menu.jpg)\n\n图 14-3\n\n留在属性工具窗口中，将视图的 `id` 更改为 `editText`，并点击弹出对话框中的\
  \ `Refactor`（重构）按钮。\n\n默认情况下，`EditText` 显示文本为“Name”。继续留在属性面板中，删除 `text` 属性字段中的此内容，使布局中的视图为空。\n\
  \n在继续之前，点击布局编辑器工具栏上的 `Infer Constraints`（推断约束）按钮以添加任何缺失的约束。\n\n## 14.3 重写 Activity\
  \ 生命周期周期方法\n\n### 重写 `onCreate()` 方法\n\n此时，项目包含一个名为 `MainActivity` 的 Activity，它派自\
  \ Android 的 `AppCompatActivity` 类。该 Activity 的源代码包含在 `MainActivity.java` 文件中，该文件已经在编辑器会话中打开，并在编辑器标签栏中以标签页表示。如果文件未打开，请在项目工具窗口面板中导航到它（`app\
  \ -> java -> com.ebookfrenzy.statechange -> MainActivity`）并双击它将文件加载到编辑器。\n\n到为止，Activity\
  \ 重写的唯一生命周期方法是 `onCreate()` 方法，该方法已实现为在设置 Activity 的用户界面之前调用其父类的实例方法。现在我们将修改此方法，以便在每次执行时都在\
  \ Android Studio 的 Logcat 面板中输出一条诊断消息。为此，我们将使用 `Log` 类，这需要导入 `android.util.Log`\
  \ 并声明一个标签（tag），以便我们能够在日志输出中过滤这些消息：\n\n```java\npackage com.ebookfrenzy.statechange;\n\
  \n.\n\nimport android.util.Log;\n\nimport androidx.annotation.NonNull;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding\
  \ binding;\n\n    private static final String TAG = \"StateChange\";\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        Log.i(TAG, \"\
  onCreate\");\n    }\n}\n```\n\n### 添加额外的生命周期方法\n\n接的任务是重写更多方法，每个方法都包含相应的日志调用。这些重写方法可以手动添加，也可以使用\
  \ `Alt-Insert` 快捷键生成，正如章节“Android Studio 代码编辑器基础”概述的那样。请注意，如果方法是自动生成的，仍然需要手动添加 `Log`\
  \ 调用：\n\n```java\n@Override\nprotected void onStart() {\n    super.onStart();\n\
  \    Log.i(TAG, \"onStart\");\n}\n\n@Override\nprotected void onResume() {\n   \
  \ super.onResume();\n    Log.i(TAG, \"onResume\");\n}\n\n@Override\nprotected void\
  \ onPause() {\n    super.onPause();\n    Log.i(TAG, \"onPause\");\n}\n\n@Override\n\
  protected void onStop() {\n    super.onStop();\n    Log.i(TAG, \"onStop\");\n}\n\
  \n@Override\nprotected void onRestart() {\n    super.onRestart();\n    Log.i(TAG,\
  \ \"onRestart\");\n}\n\n@Override\nprotected void onDestroy() {\n    super.onDestroy();\n\
  \    Log.i(TAG, \"onDestroy\");\n}\n\n@Override\nprotected void onSaveInstanceState(@NonNull\
  \ Bundle outState) {\n    super.onSaveInstanceState(outState);\n    Log.i(TAG, \"\
  onSaveInstanceState\");\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ Bundle savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  \    Log.i(TAG, \"onRestoreInstanceState\");\n}\n```\n\n## 14.4 过滤 Logcat 面板\n\n\
  添加到 `MainActivity.java` 中的代码目的是将日志输出到 Logcat 面板，该面板显示在图 14-4 中：\n\n![](img/as_logcat_button.jpg)\n\
  \n图 14-4\n\nLogcat 工具窗口可以配置为显示来自设备或模拟器的所有事件，或限制为与当前应用相关的事件。如图 14-5](#Activity_State_Example.xhtml__idTextAnchor337)所示：\n\
  \n![](img/as_logcat_window.jpg)\n\n图 14-5\n\n默认键设置 `package:mine` 将输出限制为当前应用（在本例中为\
  \ `com.ebookfrenzy.statechange`）。留空此字段将允许显示操作系统的日志输出。键也可以组合使用以进一步过滤输出。例如，我们可以配置\
  \ Logcat 面板仅显示与 `StateChange` 标签相关的消息：`package:mine tag:StateChange`。\n\n可以通过在键前面加上减号（`-`）来排除输出。除了\
  \ `StateChange` 标签，我们可能还有使用另一个标签的诊断消息。为了过滤日志以排除第二个标签，我们可以输入以下选项：`package:mine tag:StateChange\
  \ -tag:OtherTag`。\n\n除了自定义的标签值，还可以从 Android 内置的定义标签范围内选择。当你在过滤器字段中输入时，Logcat 将显示匹配标签列表，如图\
  \ 14-6 所示：\n\n![](img/as_logcat_filter_suggestions.jpg)\n\n图 14-6\n\n或者，使用 `Ctrl-Space`\
  \ 获取完整的过滤建议列表。\n\n`level` 键可以根据严重性控制显示的消息。为了过滤掉错误以外的所有消息，将使用以下键：`level:error`。除了错误之外，Logcat\
  \ 面板还支持 `verbose`（详细）、`info`（信息）、`warn`（警告）和 `assert`（断言）级别设置。\n\nLogcat 还支持多个日志面板，每个面板都有自己的过滤设置。要添加另一个面板，点击上方图\
  \ 14-5 中标记为 D 的 `+` 按钮。使用相应的标签在不同面板之间切换，或者通过右键点击当前显示的面板并选择 `Split-Right`向右拆分）或 `Split-Down`向下拆分）菜单来水平或垂直排列面板。要重命名面板，右键点击标签并选择\
  \ `Rename Tab`（重命名标签）选项。在继续之前，关闭除一个以外的所有 Logcat 面板，并按配置配置：`package:mine tag:StateChange`\n\
  ## 14.5 运行应用程序\n\n\n\n\n\n为了获得最佳结果，应用程序应运行在物理 Android 设备或模拟器上。在配置好设备并连接到开发计算机后，点击\
  \ Android Studio 工具栏上的运行按钮，如下方的图 14-7 所示：\n\n![](img/as_run_button.jpg)\n\n图 14-7\n\
  \n如果出现了“选择设备”对话框，请从中选择物理 Android 设备或模拟器（假设你尚未将其配置为默认目标）。在 Android Studio 构建应用程序并将其安装到设备上后，它应该启动并在前台运行。\n\
  \n检查 `Logcat` 面板可以显示到目前为止哪些方法被触发了：\n\n![](img/as_logcat_app_running.jpg)\n\n图 14-8\n\
  \n## 14.6 实验 Activity\n\n既然诊断功能已工作正常，现在是时候运行应用程序以理解 Activity 的生命周期状态变化了。首先，考虑 `Logcat`\
  \ 面板中初始的日志事件序列：\n\n```\nonCreate\nonStart\nonResume\n```\n\n显然，初始状态变化与“理解 Android\
  \ 应用和 Activity 生命周期”中概述的完全相同。但注意，并没有调用 `onRestoreInstanceState()`，因为 Android 运行时检测到在这种没有需要恢复的状态。\n\
  \n点击设备屏幕底部状态栏上的 Home 图标，并注意日志中报告的方法调用序列如下：\n\n```\nonPause\nonStop\nonSaveInstanceState\n\
  ```\n\n在这种情况下，运行时注意到 Activity 不再处于前台，对用户不可见，并且已停止该 Activity，但并不是没有提供 Activity 保存动态状态的机会。取决于运行时最终是销毁了\
  \ Activity 还是重新启动了它，Activity 将通过调用 `onRestart()` 被通知其已重新启动，或者在用户返回 Activity 时再次经历创建序列。\n\
  \n正如“理解 Android 应用和 Activity 生命周期”概述的，Activity 的销毁和重建可以通过对设备进行配置更改来触发，例如从竖屏旋转到横屏。要查看此操作过程，请在\
  \ `StateChange` 应用程序处于前台时旋转设备。使用模拟器时，可以使用模拟器工具栏上的旋转按钮模拟设备旋转。为了完成旋转，可能还需要点击旋转按钮。它出现在设备或模拟器屏幕的底部，如图\
  \ 14-9 所示：\n\n![](img/android_rotate_button.jpg)\n\n图 14-9\n\n日志中产生的方法调用序列如下：\n\n\
  ```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，运行时系统允许 Activity 在被销毁和重启之前保存状态。\n\n### 14.7 总结\n\n“画画胜千言”的格言在学习新编程范式的示例中同样适用。在本章中，我们创建了一个示例\
  \ Android 应用程序，演示 Activity 可能会经过的不同生命周期状态。在开发本章项目中，我们还查看了从 Activity 内部生成诊断日志信息的机制。\n\
  \n在下一章中，我们将扩展 `StateChange` 示例项目，演示如何保存和恢复 Activity 的动态状态。\n\n## 15. 保存和恢复 Android\
  \ Activity 的状态\n\n如果前面的几章已经实现了目标，那么现在对于在 Activity 生命周期的特定点保存和恢复用户界面状态的重要性应该变得更加清晰了。\n\
  \n在本章中，我们将扩展在“通过示例理解 Activity 状态变化”中创建的示例应用程序，演示运行时系统销毁和重建 Activity 时涉及保存和恢复状态的步骤。\n\
  \n恢复动态状态的关键组件涉及使用 Android SDK 中的 `Bundle` 类，这个主题在本章也会涵盖。\n\n## 15.1 保存动态状态\n\n正如我们所学的，Activity\
  \ 可以通过运行时调用其实现的 `onSaveInstanceState()` 方法来保存动态状态信息。作为方法的参数传递的是 `Bundle` 对象的引用，该方法必须从中存储任何需要保存的动态数据。随后，`Bundle`\
  \ 对象由运行时代表 Activity 进行存储，并在它们被调用时，作为参数传递给 Activity 的 `onCreate()` 和 `onRestoreInstanceState()`\
  \ 方法。然后可以从这些方法内部的 `Bundle` 对象中检索数据并用于恢复 Activity 的状态。\n\n## 15.2 用户界面状态的默认保存\n\n\
  在上章中，`StateChange` 示例应用程序的诊断输出显示，当运行它的设备旋转得足够大以触发方向变化时，Activity 会经历几次状态变化。\n\n再次启动\
  \ `StateChange` 应用程序，在执行设备旋转之前，向 `EditText` 字段输入一些文本（在运行 Android 9 或更高版本的设备或模拟器上，可能需要点击状态栏中的旋转按钮来完成旋转）。旋转设备后，`Logcat`\
  \ 窗口会出现以下状态变化序列：\n\n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\n\
  onStart\nonRestoreInstanceState\nonResume\n```\n\n显然，这导致了 Activity 的销毁和重建。然而，检查运行应用程序的用户界面会发现输入\
  \ `EditText` 字段的文本已被保留。鉴于 Activity 被销毁并重建，且我们没有添加任何确保文本已保存的代码，这种行为需要一些解释。\n\n事实上，Android\
  \ SDK 包含的大多数控件已经实现了 Activity 重新启动时保存和恢复状态所需的行为。启用此行为的唯一是 Activity 中的 `onSaveInstanceState()`\
  \ 和 `onRestoreInstanceState()` 重写方法包含调用父类的同名方法：\n\n```java\n@Override\nprotected\
  \ void onSaveInstanceState(@NonNull Bundle outState) {\n    super.onSaveInstanceState(outState);\n\
  }\n\n@Override\nprotected void onRestoreInstanceState(@NonNull Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n}\n```\n\n可以通过在 XML\
  \ 布局文件中将 `saveEnabled` 属性设置为 `false` 来禁用用户界面状态的自动保存。可以通过在 XML 布局文件中将 `saveEnabled`\
  \ 属性设置为 `false` 来关闭用户界面视图的自动状态保存。在本示例中，我们将禁用用户界面布局中 `EditText` 视图的自动保存机制，然后在应用程序中添加代码来手动保存和恢复视图状态。\n\
  \n为了配置 `EditText` 视图使其在 Activity 重新启动时不保存状态，编辑 `activity_main.xml` 文件使该视图条目如下（注意可以按照“在\
  \ Android Studio 中创建 Android 应用”中概述的方法，将布局编辑器切换到代码视图来编辑 XML）：\n\n```xml\n<EditText\n\
  \    android:id=\"@+id/editText\"\n    android:layout_width=\"wrap_content\"\n \
  \   android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\n    android:inputType=\"\
  text\"\n    android:saveEnabled=\"false\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\" />\n```\n\n\n\n\n\n```xml\napp:layout_constraintEnd_toEndOf=\"parent\"\n\
  app:layout_constraintStart_toStartOf=\"parent\"\napp:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n完成更改后，运行应用程序，输入文本并旋转设备，以验证文本不再被保存和恢复。\n\n### 15.3 Bundle 类\n\n\
  对于需要在用户界面视图组件提供的默认功能之外保存状态的情况，`Bundle` 类提供了一个使用键值对机制来存储数据的容器。键的形式为字符串值，而与这些键关联的值可以是原始值（primitive\
  \ value），也可以任何实现 Android `Parcelable` 接口的对象。许多类已经实现了 `Parcelable` 接口。可以通过实现 `Parcelable`\
  \ 接口中定义方法集来使自定义类变为“可序列化（parcelable）”，细节可以在 Android 文档中找到：[`developer.android.com/reference/android/os/Parcelable.html`](https://developer.android.com/reference/android/os/Parcelable.html)\n\
  \n`Bundle` 类还包含一组方法，用于为各种数据类型获取和设置键值对，包括原始类型（包括 `Boolean`、`char`、`double` 和 `float`\
  \ 值）和对象（如 `String` 和 `CharSequence`）。\n\n在本例中，由于禁用了 `EditText` 视图的文本自动保存功能，我们需要确保用户输入\
  \ `EditText` 字段的文本被保存到 `Bundle` 对象并随后恢复。这将演示如何在 Android 应用程序中手动保存和恢复状态，并将分别使用 `Bundle`\
  \ 类的 `putCharSequence()` 和 `getCharSequence()` 方法来实现。\n\n### 15.4 保存状态\n\n扩展 StateChange\
  \ 应用的第一步是确保在 `MainActivity` Activity 的 `onSaveInstanceState()` 方法中从 `EditText` 组件提取用户输入的文本，然后将其作为键值对保存到\
  \ `Bundle` 对象中。\n\n要从 `EditText` 对象中提取文本，我们必须首先在用户界面中识别该对象。显然，这涉及到 Activity 的 Java\
  \ 代码（包含在 `MainActivity.java` 源文件中）与用户界面 XML 表示（包含在 `activity_main.xml` 资源文件中）之间的桥接。为了提取输入到\
  \ `EditText` 组件的文本，我们需要获得该用户界面对象的访问权限。\n\n用户界面中的每个组件都关联有一个唯一的标识符。默认情况下，布局编辑器工具根据对象类型为新添加的组件构建\
  \ `id`。如果布局中包含多个相同类型的视图，则类型名后面会跟一个顺序数字（尽管开发者可以并且应该将其更改为更具意义的内容）。正如在选择 `activity_main.xml`\
  \ 文件并显示布局编辑器工具时通过检查 Android Studio 主窗口中的组件树（Component Tree）面板所示，`EditText` 组件被分配了\
  \ `id editText`：\n\n![](img/as_component_tree1.jpg)\n\n图 15-1\n\n我们现在可以通过对象的 `getText()`\
  \ 方法获取 `editText` 视图包含的文本，该方法会返回当前文本：\n\n```java\nCharSequence userText = binding.editText.getText();\n\
  ```\n\n最后，我们可以使用 `Bundle` 对象的 `putCharSequence()` 方法保存文本，将键（可以是任何字符串值，但在本例中，我们将声明为“savedText”）和\
  \ `userText` 对象作为参数传递：\n\n```java\noutState.putCharSequence(\"savedText\", userText);\n\
  ```\n\n将这一切整合在一起，我们在 `MainActivity.java` 文件中得到了修改后的 `onSaveInstanceState()` 方法，其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.statechange;\n\n.\n.\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n\n.\n.\n.\n    protected void onSaveInstanceState(@NonNull\
  \ Bundle outState) {\n        super.onSaveInstanceState(outState);\n        Log.i(TAG,\
  \ \"onSaveInstanceState\");\n        CharSequence userText = binding.editText.getText();\n\
  \        outState.putCharSequence(\"savedText\", userText);\n    }\n.\n.\n```\n\
  ```\n\n现在已经了保存状态的步骤，下一阶段是在需要时恢复它。\n\n### 15.5 恢复状态\n\n保存的动态状态可以在传递 `Bundle` 对象作为参数的生命周期方法中恢复。这让开发者可以选择\
  \ `onCreate()` 或 `onRestoreInstanceState()`。使用哪种方法取决于 Activity 的性质。在 Activity 执行初始化任务后最适合恢复的情况下，`onRestoreInstanceState()`\
  \ 方法通常更合适。在本例中，我们将在 `onRestoreInstanceState()` 方法中添加代码，使用 “savedText” 键从 `Bundle`\
  \ 中提取保存的状态。然后我们可以使用对象的 `setText()` 方法在 `editText` 组件上显示文本：\n\n```java\n@Override\n\
  protected void onRestoreInstanceState(@NonNull Bundle savedInstanceState) {\n  \
  \  super.onRestoreInstanceState(savedInstanceState);\n    Log.i(TAG, \"onRestoreInstanceState\"\
  );\n    CharSequence userText = savedInstanceState.getCharSequence(\"savedText\"\
  );\n    binding.editText.setText(userText);\n}\n```\n\n### 15.6 测试应用程序\n\n剩下的工作就是再次构建并运行\
  \ StateChange 。一旦运行并处于前台，触碰 `EditText` 组件并在旋转设备到另一个方向之前输入一些文本。之前文本更改会丢失，但现在得益于我们添加到\
  \ Activity 中的代码，文本保留在了 `editText` 组件中。\n\n### 15.7 总结\n\nAndroid 应用中动态状态的保存和恢复是在适当的生命周期方法中实现的。对于大多数用户界面视图，这由\
  \ Activity 类自动处理。在其他情况下，这通常包括在 `onSaveInstanceState()` 方法中提取值和设置，并将作为键值对保存到传递给 Activity\
  \ 的 `Bundle` 对象中。\n\n可以通过 Activity 的 `onCreate()` 或 `onRestoreInstanceState()` 方法从\
  \ `Bundle` 对象提取值并更新 Activity 来恢复状态。\n\n在本章中，我们通过这些技术更新了 StateChange 项目，使其能够在 Activity\
  \ 销毁并随后重建时保留更改。\n\n# 16 理解 Android 视图、视图组和布局\n\n除了听流媒体音频外，用户与 Android 设备的交互主要是视觉和触觉的。所有这些交互都发生在设备上安装应用程序的用户界面上，包括内置应用程序和用户安装的任何第三方应用程序。因此，开发\
  \ Android 应用的一个关键要素涉及设计和创建用户界面，并不意外。\n\n本章涵盖了 Android 用户界面结构，包括组成用户界面的元素概述：视图（Views）、视图组（View\
  \ Groups）和布局（Layouts）。\n\n## 16.1 为不同的 Android 设备设计\n\n\n\n\n\n“Android 设备”一术涵盖了许多具有不同屏幕尺寸和分辨率的平板电脑和智能手机产品。因此，应用程序界面现在必须经过仔细设计，以确保在尽可能广泛的显示尺寸上正确呈现。其中的一个关键部分是确保用户界面布局在不同设备上运行时能够正确地重新调整大小。这在很大程度上可以通过细致的规划以及使用本章概述的布局管理器来实现。\n\
  \n同样重要的是要记住，大多数基于 Android 的智能手机和平板电脑都可以以竖屏和横屏两种方向由用户。良好的用户界面应该能够适应这些变化，并进行合理的布局调整，以利用每种方向下的可用屏幕空间。\n\
  \n### 16.2 视图 (Views) 与视图组 (View Groups)\n\n用户界面中的每个项目都是 Android `View` 类的子类（准确来说是\
  \ `android.view.View`）。Android SDK 提供了一组预构建的视图，用于构建用户界面。典型示例包括标准项，如 `Button`、`Checkbox`、`ProgressBar`\
  \ 和 `TextView` 类。这些视图也被称为控件（widgets）或组件（components）。对于 SDK 提供的控件无法满足的需求，可以通过子类和扩展现有类来创建新视图，或者通过直接在\
  \ `View` 类之上构建全新的全新的组件。\n\n视图还可以包含多个其他视图（否则称为复合视图）。此类视图派生自 Android `ViewGroup` 类（`android.view.ViewGroup`），而该类本身是\
  \ `View` 的子类。这种视图的一个示例是 `RadioGroup`，它旨在包含多个 `RadioButton` 对象，使得在任何时间只有一个对象处于“开启”状态。从结构上来说，复合视图由单个父视图（派自\
  \ `ViewGroup` 类，通常称为容器视图或根元素）组成，该视图能够包含其他视图（称为子视图）。\n\n另一类基于 `ViewGroup` 的容器视图是布局管理器。\n\
  \n### 16.3 Android 布局管理器 (Android Layout Managers)\n\n除了上一节讨论的控件样式视图外，SDK 还包含了一组被称为布局（layouts）的视图。布局是容器视图（因此派生自\
  \ `ViewGroup`），设计用于控制子视图在屏幕上的定位方式。\n\nAndroid SDK 包含了以下可能在 Android 用户界面设计中使用的布局视图：\n\
  \n- `ConstraintLayout` – 这种布局管理器在 Android 7 中引入，推荐用于大多数布局需求。`ConstraintLayout` 允许通过为每个子视图分配简单的约束设置来定义布局中视图的位置和行为。该布局的灵活性允许快速轻松地创建复杂布局，而无需在内部相互嵌套其他布局类型，从而提高了布局性能。`ConstraintLayout`\
  \ 也紧密集成到 Android Studio 布局编辑器工具中。除非另有说明，否则它是书中大多数示例的首选布局。\n\n- `LinearLayout` –\
  \ 根据所选的方向将子视图排列在单行或单列中。可以在每个子视图上设置权重（weight）值，以指定该子视图相对于其他子视图应占据布局空间的比例。\n\n- `TableLayout`\
  \ – 将子视图排列为行和列的网格格式。表格中的每一行由一个 `TableRow` 对象子项表示，该子项又包含每个单元格的视图对象。\n\n- `FrameLayout`\
  \ – `FrameLayout` 的目的是分配屏幕的一个区域，通常用于显示单个视图。如果添加了多个子视图，默认情况下它们将相互堆叠并定位在布局区域的左上角。通过为每个子视图设置重力（gravity）值可以实现单个子视图的交替定位。例如，在子视图上设置\
  \ `center_vertical` 重力值将使其位于包含它的的 `FrameLayout` 视图的垂直中心。\n\n- `RelativeLayout` –\
  \ `RelativeLayout` 允许通过对子视图指定对齐方式和边距，使子视图相对于彼此以及容器布局视图进行定位。例如，可以将子 View A 配置为位于容器\
  \ `RelativeLayout` 视图的垂直和水平中心。相反，视图 B 也可以配置为在布局视图内水平居中，但位于 View A 顶上方 30 像素处，从而使其相对于\
  \ View A 的垂直位置。在设计必须在各种屏幕尺寸和方向上运行的用户界面时，`RelativeLayout` 管理器非常有帮助。\n\n- `AbsoluteLayout`\
  \ – 允许将子视图定位在容器布局视图内特定的 X 和 Y 坐标上。不建议使用这种布局，因为它缺乏响应屏幕尺寸和方向变化的灵活性。\n\n- `GridLayout`\
  \ – `GridLayout` 实例由不可见的线划分，形成一个包含行和列单元格的网格。子视图被放置在单元格中，并可以配置为水平和垂直覆盖多个单元格，从而能够快速轻松地实现广泛的布局选项。`GridLayout`\
  \ 组件之间的间隔可以通过在相邻单元格中放置一种名为 `Space` 的特殊类型视图或设置边距参数来实现。\n\n- `CoordinatorLayout` –\
  \ `CoordinatorLayout` 作为 Android Design Support Library 的随 Android 5.0 引入，专门设计用于协调应用程序屏幕顶部应用栏（app\
  \ bar）与其他视图元素的外和行为。当使用 Basic Views Activity 模板创建新活动时，主布局中的父视图将使用 `CoordinatorLayout`\
  \ 实例实现。该布局管理器将从“使用 FloatingActionButton 和 Snackbar” 一章开始进行更详细介绍。\n\n在考虑 Android\
  \ 应用程序的用户界面布局时，值得记住，正如下一节所述，这些布局可以相互嵌套，以创建任何所需程度的用户界面设计。\n\n### 16.4 视图层次结构 (The\
  \ View Hierarchy)\n\n用户界面中的每个视图代表显示器的矩形区域。视图负责在该矩形内绘制内容并响应屏幕该区域的事件（如触摸事件）。\n\n用户界面屏幕由视图层次结构组成，其中根视图位于顶部，子视图位于下方。容器视图的子视图位于父视图之上，并被限制在父视图的显示边界内。例如，考虑图\
  \ 16-1 所示的用户界面：\n\n![](img/as_layout_views.jpg)\n\n图 16-1\n\n\n\n\n视图层级图可能最清晰地概述了构成用户界面的各种视图之间的关系，具体可见图\
  \ 16-1。当用户界面显示给用户时，Android 运行时会遍历视图层级，从根视图开始沿树形结构向下遍历，并渲染每一个视图。\n\n## 16.5 创建用户界面\n\
  \n在对视图（views）、布局（layouts）和视图层级概念有了更清晰的理解之后，后续章节将重点介绍为 Android Activity 创建用户界面的步骤。事实上，用户界面设计有三种不同的方法：使用\
  \ Android Studio Layout Editor 工具、手动编写 XML 布局资源文件或编写 Java 代码，每种方法都将得到涵盖。\n\n###\
  \ 16.6 总结\n\nAndroid 应用用户界面屏幕中的每个元素都是视图，它们最终都派自 `android.view.View` 类。每个视图代表设备显示器上的矩形区域，负责负责在该矩形内显示的内容，并处理在该视图范围内发生的事件。多个视图可以组合创建一个单个复合视图（composite\
  \ view）。复合视图中的视图是容器视图（container view）的子视图，容器视图通常是 `android.view.ViewGroup` 的子类（其本身又是\
  \ `android.view.View` 的子类）。用户界面是由视图层级形式构建的视图组成的。\n\nAndroid SDK 包含了一系列预构建的视图，可用于创建用户界面。这些包括文本字段和按钮等基本组件，以及用于控制子视图定位的一系列布局管理器。如果提供的视图不能满足特定需求，可以通过扩展或组合现有视图来创建自定义视图，也可以通过派生\
  \ `android.view.View` 并创建一个全新的视图类。\n\n用户界面可以使用 Android Studio Layout Editor 工具、手动编写\
  \ XML 布局资源文件或编写 Java 代码来创建。这些方法中的每一种都将在后续章节中进行介绍。\n\n## 17. Android Studio Layout\
  \ Editor 工具指南\n\n很难想象出一个不需要某种形式用户界面的 Android 应用概念。大多数 Android 设备都配备了触摸屏和键盘（虚拟或物理），点击和滑动是用户与应用程序之间主要的交互方式。这些交互不可避免地通过应用程序的用户界面进行。\n\
  \n良好的设计和实现的用户界面是创建一个成功且流行的 Android 应用的关键因素，根据单个应用程序的设计需求，它可以从简单到高度复杂不等。无论复杂程度如何，Android\
  \ Studio Layout Editor 工具都显著简化设计和实现 Android 用户界面的任务。\n\n### 17.1 基础与空视图 Activity\
  \ 模板\n\n如“Android 应用的剖析”章节概述的，Android 应用由一个或多个 Activity 组成。Activity 是应用程序功能的独立模块，通常直接对应于单个用户界面屏幕。因此，当使用\
  \ Android Studio Layout Editor 时，我们总是在为 Activity 编写布局。\n\n在创建新的 Android Studio 项目时，有多个模板可以作为主\
  \ Activity 用户界面的起点。最基础的模板是 `Basic Views Activity` 和 `Empty Views Activity` 模板。尽管它们初看起来看起来相似，但这两个选项之间存在显著差异。要在布局编辑器中查看这些差异，请使用\
  \ `View Options`（视图选项）菜单启用 `Show System UI`（显示系统界面），如下方的图 17-1：\n\n![](img/as_layout_editor_view_options.jpg)\n\
  \n图 17-1\n\n`Empty Views Activity` 模板创建一个单一布局文件，由一个包含 `TextView` 对象的 `ConstraintLayout`\
  \ 实例实例组成，如图 17-2 所示：\n\n![](img/as_layout_with_system_ui.jpg)\n\n图 17-2\n\n另一方面，`Basic\
  \ Views Activity` 包含多个布局文件。顶层布局文件具有 `CoordinatorLayout` 作为根视图、一个显示在设备屏幕顶部的可配置应用栏（包含工具栏，在图\
  \ 17-3 中标记为 A）以及一个浮动操作按钮（标记为 B 的电子邮件按钮）。除了这些项目，`activity_main.xml` 布局文件还包含指向名为 `content_main.xml`\
  \ 第二文件的引用，该文件包含内容布局（标记为 C）：\n\n![](img/as_basic_activity_layout.jpg)\n\n图 17-3\n\
  \n`Basic Views Activity` 包含两个屏幕的布局，包含一个按钮和一个文本视图。该模板旨在演示如何在应用的多个屏幕之间实现导航。如果运行一个使用\
  \ `Basic Views Activity` 模板且未修改过的应用，将显示这两个屏幕中的第一个（在图 17-4 中标记为 A）。按下 `Next`（下一个）按钮将导航到第二个屏幕（B），该屏幕反过来包含一个返回到第一个屏幕的按钮：\n\
  \n![](img/as_basic_activity_layout_1.jpg)\n\n图 17-4\n\n此应用行为使用了称为 `fragments`（片段）和\
  \ `navigation`（导航）的两个 Android 功能，将分别从“Android Fragment 简介”和“导航架构组件概述”章节开始介绍。\n\n\
  `content_main.xml` 文件包含一个特殊的片段，被称为 `Navigation Host Fragment`导航主机片段），它允许根据 `res\
  \ -> layout -> nav_graph.xml` 中的设置切换内容。在 `Basic Views Activity` 的情况下，`nav_graph.xml`\
  \ 文件配置为根据用户选择 `Next` 和 `Previous` 按钮在 `fragment_first.xml` 和 `fragment_second.xml`\
  \ 定义的布局之间切换。\n\n如果你的 Activity 既不需要浮动操作按钮也不需要菜单，不需要 `CoordinatorLayout` 提供的特殊应用栏行为（例如在某些滚动操作期间让应用栏和工具栏折叠的选项，该主题在“使用\
  \ AppBar 和折叠工具栏布局”](#AppBar.xhtml__idTextAnchor1023)章节中介绍），那么 `Empty Views Activity`\
  \ 模板很有用。然而，`Basic Views Activity` 很有用，因为它默认提供了这些元素。事实上，使用 `Basic Views Activity`\
  \ 模板创建新 Activity 并删除不需要的元素，通常比使用 `Empty Views Activity` 模板并手动实现折叠工具栏、菜单或浮动操作按钮要快得多。\n\
  \n然而，由于书中并非所有示例都需要 `Basic Views Activity` 模板的功能，因此本章的大多数示例将使用 `Empty Views Activity`\
  \ 模板，除非示例需要 `Basic Views Activity` 模板提供的一个或多个功能。\n\n为了以后参考，如果你需要菜单但不需要浮动操作按钮，请使用\
  \ `Basic Views Activity` 并按照以下步骤删除浮动操作按钮：\n\n1. 在项目工具窗口的 `app -> res -> layout`\
  \ 下双击主 `activity_main.xml` 布局文件，将其加载到 `Layout Editor` 中。在布局加载到 `Layout Editor` 工具后，选择浮动操作按钮并按键盘\
  \ `Delete` 键从布局中移除该对象。\n\n\n\n2. 找到并编辑 Activity 的 Java 代码（位于 `app` -> `java` ->\
  \ `<package name>` -> `<activity class name>`），并按照如下方式从 `onCreate` 方法中删除焦点操作按钮代码：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    NavController navController = Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                    .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n如果你需要悬浮操作按钮但不需要菜单，请使用 Basic\
  \ Views Activity 模板并遵循以下步骤：\n\n1. 编辑主类文件并删除 `onCreateOptionsMenu` 和 `onOptionsItemSelected`\
  \ 方法。\n2. 在 Project 工具窗口中选择 `res -> menu item`，并按键盘上的 Delete 键从项目中删除该文件夹及相应的菜单资源文件。\n\
  \n如果你需要使用 Basic Views Activity 模板，但既不需要导航功能也不需要第二个片段，请遵循以下步骤：\n\n1. 在 Project 工具窗口中，导航并双击\
  \ `app` -> `res` -> `navigation` -> `nav_graph.xml` 文件，将其加载到导航编辑器中。\n2. 在编辑器中，在图表面板中选择\
  \ `SecondFragment` 项，按键盘 delete 键将其从图中删除。\n3. 找到并删除 `SecondFragment.java`（`app`\
  \ -> `java` -> `<package name>` -> `SecondFragment`）和 `fragment_second.xml`（`app`\
  \ -> `res` -> `layout` -> `fragment_second.xml`）文件。\n4. 最后一个任务是从 `FirstFragment`\
  \ 类中移除一些代码，以便点击 `Button` 视图不再导航到已不存在的第二个片段。找到 `FirstFragment.java` 文件，双击将其加载到编辑器中，并移除\
  \ `onViewCreated()` 方法中的代码，使其如下：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n     \
  \   @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                    .navigate(R.id.action_FirstFragment_to_SecondFragment);\n \
  \       }\n    });\n}\n```\n\n### 17.2 Android Studio 布局编辑器\n\n如前面的章节所示，布局编辑器工具提供了一个“所见即所得”（WYSIWYG）的环境，在该环境中，可以从调板中选择视图并将其放置在代表\
  \ Android 设备显示的画布上。一旦视图放置在画布上，就可以对其进行移动、删除和调整大小（受父视图约束的限制）。此外，可以使用 Attributes 工具窗口修改与所选视图相关的各种属性。\n\
  \n在底层，布局编辑器工具会构建一个包含正在设计的的用户界面定义的 XML 资源文件。因此，布局编辑器工具以三种不同的模式运行：设计（Design）、代码（Code）和拆（Split）。\n\
  \n### 17.3 设计模式\n\n在设计模式下，用户可以通过直接操作视图调板和布局的图形表示来视觉化操作用户界面。图 17-5 突出了 Android Studio\
  \ 布局编辑器在设计模式下的关键区域：\n\n![](img/as_layout_editor1.jpg)\n\n图 17-5\n\n**A – 调板（Palette）**\
  \ – 调板提供了对 Android SDK 提供的视图组件的访问。这些组件被分类以便于导航。可以通过从调板中拖拽视图组件并将其放置到布局上的所需位置向布局中添加项。\n\
  \n**B – 设备屏幕（Device Screen）** – 设备屏幕提供了设计过程中用户界面布局的视觉“所见即所得”表示。该布局允许通过选择、删除和调整调整视图的大小来实现直接的设计操作。可以使用工具栏随时更改设备模型。\n\
  \n**C – 组件树（Component Tree）** – 如上一章所述（“理解视图和布局`]），用户界面是使用层级结构构建的。组件树提供了用户界面的视觉概述。从组件树中选择元素将选择布局中相应的视图。同样，从设备屏幕上选择视图将会在组件树中选中它。\n\
  \n**D – 属性（Attributes）** – 调板中列出的所有组件都带有一组属性，这些属性可用于调整所选视图的行为和外观。\n\n**E – 工具栏（Toolbar）**\
  \ – 布局编辑器工具栏提供了对广泛选项的快速访问，包括：放大和缩小设备屏幕布局、在竖屏和横屏之间旋转布局，以及切换到不同的 Android SDK 级别。工具栏还有敏感按钮。\n\
  \n**F – 模式切换控制（Mode Switching Controls）** – 这三个按钮提供了在设计、代码和拆模式之间来回切换。\n\n**G - 缩放和平移控制（Zoom\
  \ and Pan Controls）** – 此控制面板允许你对设计画布进行缩放、抓取画布并在放大时寻找被遮挡的区域。\n\n### 17.4 调板（Palette）\n\
  \n布局编辑器的调板分为两个面板，旨在便于查找和预览要添加到布局的视图组件。类别面板（图 17-6 中的 A）列出了 Android SDK 支持的不同视图组件类别。当列表中选择一个类别时，第二个面板（B）将更新并显示该类的组件列表：\n\
  \n![](img/as_layout_editor_pallette.jpg)\n\n图 17-6\n\n要从调板将组件添加到画布上，从组件列表或预览面板中选择该项，将其拖到画布上的所需位置并释放。\n\
  \n在所选类别内搜索特定组件可以通过点击调板工具栏上的搜索按钮（图 17-6 中的 C）并输入组件名称。随着字符的输入，匹配的结果将出现在组件列表中。如果不确定组件的类别，请在搜索操作之前或期间选择所有结果（All\
  \ Results）类别。\n\n### 17.5 设计模式与布局视图\n\n布局编辑器默认以设计模式出现，如图 17-5 中的 C 按钮来选择设计模式：\n\n\
  ![](img/as_layout_editor_view_mode_buttons1.jpg)\n\n图 17-7\n\n\n\n\n\n当 `Layout\
  \ Editor` 工具处于 `Design`（设计）模式时，可以通过方式查看布局。上方 图 17-5 所示的视图为 `Design` 视图，它显示了布局和控件在运行的应用程序中显示的样式。另一种模式\
  \ `Blueprint`（蓝图）视图可以替代 `Design` 视图或与 `Design` 视图同时显示。图 17-8 中的工具栏菜单提供了显示 `Design`、`Blueprint`\
  \ 或两者的视图的选项。还提供了用于调整色盲的设置。第五种选项 `Force Refresh Layout`（强制刷新布局）会导致布局重新构建并重绘。当布局进入意外状态或未能准确反映当前设计设置时，此功能非常有用：\n\
  \n![](img/as_layout_editor_design_surface.jpg)\n\nFigure 17-8\n\n显示布局视图、设计视图还是两者都取决于个人喜好。一种好的方法是如\
  \ 图 17-9 所示同时显示两者：\n\n![](img/as_3.5_show_layout_design_and_blueprint.jpg)\n\nFigure\
  \ 17-9\n\n### 17.6 夜间模式\n\n在设计工作期间以夜间模式查看布局，请选择下方 图 17-10 所示的菜单，并将设置更改为 `Night`（夜间）：\n\
  \n![](img/as_layout_editor_night.jpg)\n\nFigure 17-10\n\n模式菜单还包括测试动态颜色的选项，该主题在“Material\
  \ Design 3 主题与动态颜色教程”章节中有所介绍。\n\n### 17.7 代码模式\n\n在使用 `Android Studio Layout Editor`\
  \ 工具时，必须记住它所做的只是提供了一种易用户的方法来创建 `XML` 布局资源文件。在设计过程中，通过选择上方 图 17-7 中标记为 `A` 的按钮，可以查看并直接编辑底层的\
  \ `XML`。\n\n图 17-11 显示了 `Code` 模式下的 `Android Studio Layout Editor` 工具，允许通过修改 `XML`\
  \ 来更改用户界面声明：\n\n![](img/as_layout_editor_code.jpg)\n\nFigure 17-11\n\n### 17.8 Split\
  \ 模式\n\n在 `Split`（分屏）模式下，编辑器并排显示 `Design` 和 `Code` 视图，允许使用设计画布可视化地修改用户界面，并直接对 `XML`\
  \ 声明进行更改。使用上方 图 17-7 中标记为 `B` 的按钮选择 `Split` 模式。\n\n对 `XML` 的任何更改都会自动反映在设计画布上，反之亦然。图\
  \ 17-12 显示了 `Split` 模式下的编辑器：\n\n![](img/as_layout_editor_split.jpg)\n\nFigure 17-12\n\
  \n### 17.9 设置属性\n\n`Attributes`（属性）面板提供了对当前选中组件所有可用设置的访问。例如，图 17-13 显示了 `TextView`\
  \ 控件的某些属性：\n\n![](img/as_layout_editor_atrributes.jpg)\n\nFigure 17-13\n\n`Attributes`\
  \ 工具窗口分为以下不同部分。\n\n- `id` - 包含 `id` 属性，定义了在应用程序源码中引用当前选中对象时名称。\n- `Declared Attributes`（已声明属性）\
  \ - 包含所有已赋值的属性。\n- `Layout`（布局） - 定义当前选中视图对象相对于屏幕和其他布局中对象的定位和大小的设置。\n- `Transforms`（变换）\
  \ - 允许当前选中对象旋转、缩放和偏移的控件。\n- `Common Attributes`（常用属性） - 当前选中视图对象类通常需要更改的属性列表。\n\
  - `All Attributes`（所有属性） - 当前选中对象所有可用属性的完整列表。\n\n也可以通过选择 `attributes` 工具窗口工具栏中的搜索按钮并输入属性名称来搜索特定属性。\n\
  \n某些属性在值字段右侧有一个窄按钮。这表示可以使用 `Resources`（资源）对话框来帮助选择合适的属性值。\n\n要显示对话框，请点击按钮。该按钮的外将反映相应的属性值是存储在资源文件中还是硬编码的。如果值存储在资源文件中，则\
  \ `text` 属性字段右侧的按钮将填充，以指示该值不是硬编码的，如下方的 图 17-14 所示：\n\n![](img/as_layout_editor_not_hardcoded.jpg)\n\
  \nFigure 17-14\n\n具有有限有效选项的属性将呈现一个下拉菜单（图 17-15），可以从中进行选择。\n\n![](img/as_layout_editor_attr_options.jpg)\n\
  \nFigure 17-15\n\n可以点击滴管图标显示颜色选择调板。同样，当出现标志图标时，点击它可以打开资源选择面板。\n\n### 17.10 变换\n\n\
  图 17-16 所示的 `Attributes` 工具窗口中的 `transforms` 面板提供一组控件和属性，用于在 `rotation`（旋转）、`alpha`（用于淡入淡出）、`scale`（缩放）以及\
  \ `translation`（偏移）：\n\n![](img/as_layout_editor_transforms.jpg)\n\nFigure 17-16\n\
  \n该面板包含视图的视觉表示，当属性更改时，它随之更新。\n\n### 17.11 工具可见性切换\n\n在 `Code` 模式下查看 `Android` 布局文件时，你会发现定义视图外观和行为的许多属性以\
  \ `android:` 开头。这表示属性设置在 `android` 命名空间内，并在应用程序运行时生效。例如，以下布局摘录为 `Button` 设置了各种属性：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button\"\n    android:layout_width=\"wrap_content\"\
  \n    layout_height=\"wrap_content\"\n    android:text=\"Button\"\n```\n\n除了 `android`\
  \ 命名空间外，Android 还提供了 `tools` 命名空间。当属性设置在此命名空间时，它们仅在布局编辑器中生效。在设计布局时，你可能会发现 `EditText`\
  \ 视图显示某些文本，但在运行时要求视图为空。为了实现这一点，你将使用 `tools` 命名空间设置视图的 `text` 属性：\n\n```xml\n<EditText\n\
  \    android:id=\"@+id/editTextTextPersonName\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\n    android:inputType=\"\
  textPersonName\"\n    tools:text=\"Sample Text\"\n```\n\n此类工具属性通过在 `Attributes`\
  \ 工具窗口中标记有扳手图标的属性字段中输入值来设置，如 图 17-17 所示：\n\n![](img/as_layout_editor_tools_attribute.jpg)\n\
  \nFigure 17-17\n\n工具属性对于设计过程中更改视图的可见性非常有用。布局可能包含在运行时根据用户操作动态显示和隐藏的视图。为了模拟隐藏视图，可以在视图的\
  \ XML 声明中添加以下工具属性：\n\n```xml\ntools:visibility=\"invisible\"\n```\n\n虽然在使用 `invisible`\
  \ 设置时视图不再可见，但它仍然存在于布局中，并占据它可见时所占的空间。为了让布局表现得好像视图不再存在，应将 `visibility` 属性设置为 `gone`：\n\
  \n```xml\ntools:visibility=\"gone\"\n```\n\n\n\n\n\n在上述两个示例中，可见性设置仅适用于布局编辑器，而对运行中的\
  \ App 产生影响。要同时控制布局编辑器和运行中 App 的可见性，需要使用 `android` 命名空间设置相同的属性：\n\n`android:visibility=\"\
  gone\"`\n\n虽然这些可见性工具属性非常有用，但手动编辑 XML 布局文件是一个繁琐的过程。为了方便更改这些设置，Android Studio 在布局编辑器的“组件树（Component\
  \ Tree）”面板中提供了一组开关。要访问这些控件，请点击面板中对应视图右侧的边距区域。例如，图 17-18 显示了名为 `myButton` 的 `Button`\
  \ 视图的工具可见性开关：\n\n![](img/as_layout_editor_tools_attr_visibility.jpg)\n\n图 17-18\n\
  \n这些开关控制 `android` 和 `tools` 命名空间对应视图的可见性，并提供 `not set`（未设置）、`visible`（可见）、`invisible`（隐藏）和\
  \ `gone`（移除）选项。当设置了冲突的属性时（例如将 `android` 命名空间开关设置为 `visible`，而 `tools` 值设置为 `invisible`），在布局预览中，`tools`\
  \ 命名空间具有优先级。一旦选择了开关选项，Android Studio 会自动在布局文件的 XML 视图元素中添加相应的属性。\n\n除了组件树面板中的可见性开关外，布局编辑器还包含了工具可见性和位置切换按钮，如在下方图\
  \ 17-19 中高高亮显示所示：\n\n![](img/as_layout_editor_show_tools.jpg)\n\n图 17-19\n\n此按钮可切换当前的工具可见性设置。例如，如果上方所示的\
  \ `Button` 视图当前将 `tools` 可见性属性设置为 `gone`，则切换此按钮将使其变为 `visible`。这使得在视图添加到布局或从布局中移除时能够快速检查布局行为。该开关对于检查布局中的视图是否正确约束也非常有用，该主题在“在\
  \ Android Studio 中使用 ConstraintLayout 指南”章节中会有介绍。\n\n### 17.12 转换视图\n\n在布局中将视图从一种类型转换为另一种类型（例如将\
  \ `TextView` 转换为 `EditText`），可以在 Android Studio 布局编辑器中轻松完成，只需在屏幕布局或组件树窗口中右键点击视图，并选择\
  \ `Convert view...`（转换视图...）菜单选项（图 17-20）：\n\n![](img/as_layout_editor_convert_view.jpg)\n\
  \n图 17-20\n\n选中后，将弹出一个对话框，其中包含所选对象可以转换的兼容视图类型列表。例如，图 17-21 显示了现有 `TextView` 视图可以转换的类型：\n\
  \n![](img/as_layout_editor_convert_view_dialog.jpg)\n\n图 17-21\n\n这种技术对于将布局从一种类型转换为另一种类型也有帮助（例如将\
  \ `ConstraintLayout` 转换为 `LinearLayout`）。\n\n### 17.13 显示示例数据\n\n在 Android Studio\
  \ 中设计布局时，可能会出现这样的情况：用户界面中要显示的内容在 App 完成并运行之前是不可用的。这有时会导致很难从布局编辑器内部评估布局在 App 运行时的外观。为了解决这个问题，布局编辑器允许指定示例数据，这将用示例图像和数据填充布局编辑器中的视图。这些示例数据仅在布局编辑器中显示，在\
  \ App 运行时不会显示。可以通过直接编辑布局的 XML 或视觉化使用设计时助手（在设计区域右键点击小部件并选择 `Set Sample Data`（设置示例数据）菜单选项）来配置示例数据。设计时助手面板将为所选视图项显示一系列预配置的示例数据选项，包括各种配置的文本和图像组合。例如，图\
  \ 17-22 显示了选择在 `RecyclerView` 列表中显示示例数据时显示的示例选项：\n\n![](img/as_layout_editor_design_time_attrs.jpg)\n\
  \n图 17-22\n\n或者，也可以在布局设计过程中提供自定义文本和图像进行显示。在布局编辑器中使用示例数据的示例包含在随后的章节“布局编辑器示例数据教程`中。由于示例数据是通过\
  \ `tools` 属性实现的，可以使用上方图 17-19 中高亮显示的切换按钮来控制预览中数据的可见性。\n\n### 17.14 创建自定义设备定义\n\n\
  布局编辑器工具栏中的设备菜单（图 17-23）提供了预配置的设备类型列表，选择后它们将作为设备屏幕画布出现。除了预配置的设备类型，之前在 Android Studio\
  \ 环境中配置的任何 `AVD` 实例也将列在菜单中。要添加额外的设备配置，显示设备菜单，选择 `Add Device Definition`（添加设备定义）选项并按照“在\
  \ Android Studio 中创建 Android 虚拟设备 (AVD)`章节概述的步骤操作。\n\n![](img/as_layout_editor_device_menu.jpg)\n\
  \n图 17-23\n\n### 17.15 更改当前设备\n\n作为设备选择的另一种方式，可以通过从设备菜单中选择 `Custom`（自定义）选项，点击位于设备右下角的调整手（图\
  \ 17-24），并拖动来选择另一种设备格式。随着屏幕缩放，将出现指示可用尺寸和方向的标记：\n\n![](img/as_3.5_show_layout_resize_device.jpg)\n\
  \n图 17-24\n\n### 17.16 布局验证\n\n布局验证选项允许在范围内 Pixel 尺寸屏幕上同时预览用户界面布局。可以点击 Android Studio\
  \ 主窗口右边缘的标签或使用窗口左下角的工具窗口（Tool Window）菜单。加载后，面板将如图 17-25 所示显示，在多个设备屏幕配置上渲染布局：\n\n\
  ![](img/as_layout_editor_device_validation.jpg)\n\n图 17-25\n\n### 17.17 总结\n\n开发\
  \ Android 应用的关键部分是创建用户界面。这是在 Android Studio 环境中使用布局编辑器工具完成的，该工具以三种模式运行。在设计（Design）模式下，从调色板中选择组件并放置在代表\
  \ Android 设备屏幕的布局上，使用属性进行配置。在代码（Code）模式下，可以直接编辑代表用户界面的底层 XML。分割（Split）模式则允许通过视觉和直接编辑\
  \ XML 来创建和修改布局。这些模式结合提供了一个广泛且直观的用户界面设计环境。\n\n18\\. 在 Android Studio 中使用 ConstraintLayout\
  \ 指南\n\n\n\n\n\n正如“理解 Android View、视图组和布局”(#Views_and_Layouts.xhtml__idTextAnchor353)章节中所讨论的，Android\
  \ 提供了多种布局管理器来设计用户界面。在 Android 7 中，Google 引入了一种解决了旧版布局管理器许多缺点的布局。这种布局被称为 `ConstraintLayout`，它将一种简单、具表现力且灵活的布局系统，与\
  \ Android Studio 布局编辑器工具内置的强大功能相结合，以简化创建响应式用户界面布局，这些布局可以自动适应不同的屏幕尺寸和设备方向的变化。\n\n\
  本章将概述 `ConstraintLayout` 的基本概念，而下一章将详细介绍如何在 Android Studio 布局编辑器工具中使用 `ConstraintLayout`\
  \ 创建基于约束的布局。\n\n## 18.1 ConstraintLayout 的工作原理\n\n与所有其他布局一样，`ConstraintLayout` 管理其包含的视觉组件（也称为控件）的定位和尺寸行为。它是根据设置在每个子控件上的约束连接来完成此操作的。\n\
  \n要完全理解并使用 `ConstraintLayout`，掌握以下关键概念至关重要：\n\n- `Constraints`（约束）\n- `Margins`（外边距）\n\
  - `Opposing Constraints`（对立约束）\n- `Constraint Bias`（约束偏移）\n- `Chains`（链）\n- `Chain\
  \ Styles`（链样式）\n- `Guidelines`（指南线）\n- `Groups`（组）\n- `Barriers`（障碍）\n- `Flow`（流）\n\
  \n### 18.1.1 Constraints\n\n`Constraints` 是一组规则，规定了控件相对于其他控件、容器 `ConstraintLayout`\
  \ 边缘以及称为指南线的特殊元素的对齐和间距。约束还决定了 Activity 的用户界面布局如何响应设备方向的变化或在不同屏幕尺寸的设备上显示的情况。为了进行适当配置，控件必须具有足够的约束连接，以便其位置由\
  \ `ConstraintLayout` 布局引擎在水平和垂直平面上进行解析。\n\n### 18.1.2 Margins\n\n外边距（margin）是指定固定距离的约束形式。考虑一个需要放置在设备屏幕右上角的\
  \ `Button` 对象。这可以通过实现从 `Button` 顶部和右边缘的边缘约束，并连接到父 `ConstraintLayout` 的对应侧来实现，如图图\
  \ 18-1 所示：\n\n![](img/Image2437.jpg)\n\n图 18-1\n\n如上图所示，这些约束连接中的每一个都关联了一个外边距值，规定了控件距离父布局两侧的固定距离。在此配置下，无论屏幕尺寸或设备方向如何，`Button`\
  \ 对象将始终根据两个约束连接的指定，距离父 `ConstraintLayout` 的顶部和右边缘分别为 20 和 15 设备独立像素 (dp)，正如这两个约束连接所决定的。\n\
  \n虽然上述配置在某些情况下是可以接受的，但它并没有在允许 `ConstraintLayout` 布局引擎调整控件位置以响应设备旋转以及支持不同尺寸的屏幕方面提供任何灵活性。为了给布局中添加这种响应性，必须实现对立约束。\n\
  \n### 18.1.3 Opposing Constraints\n\n在单个控件上沿同一轴运行的两个约束被认为是对立约束。换句话说，左侧和右侧都有约束的控件被认为具有水平对立约束。例如，图\
  \ 18-2 展示了在之前的布局中添加水平和垂直对立约束：\n\n![](img/Image24461.jpg)\n\n图 18-2\n\n这里需要理解的关键点是，一旦在特定轴上实现了对立约束，控件的定位将变为基于百分比而非坐标。例如，控件不再被固定在布局顶部的\
  \ 20dp 处，而是位于距离顶部 30% 的位置。在不同的方向以及在较大或较小的屏幕上运行时，控件将始终位于布局顶部的 30% 处，而不是 20dp。\n\n\
  虽然上述配置在某些情况下是可以接受的，但它并没有在允许 `ConstraintLayout` 布局引擎调整控件位置以响应设备旋转以及支持不同尺寸的屏幕方面提供任何灵活性。为了给布局中添加这种响应性，必须实现对立约束。\n\
  \n### 18.1.3 Opposing Constraints\n\n在单个控件上沿同一轴运行的两个约束被认为是对立约束。换句话说，一个在左侧和右侧都有约束的控件被认为具有水平对立约束。\n\
  \n，注：例如，图 18-2 展示了在之前的布局中添加了水平和垂直对立约束：\n\n![](img/Image24461.jpg)\n\n图 18-2\n\n\
  这里需要理解的关键点是，一旦在特定轴上实现了对立约束，控件的定位将变为基于百分比而非坐标。例如，控件不再被固定在布局顶部的 20dp 处，而是位于距离顶部 30%\
  \ 的位置。在不同的方向以及在较大或较小的屏幕上运行时，控件将始终位于布局顶部的 30% 处，而不是 20dp。\n\n*(注：原文中 18.1.3 标题重复，此处译文按原文结构保留。)*\n\
  \n### 18.1.4 Constraint Bias\n\n已经确定，`ConstraintLayout` 中的控件可以受到对立约束的约束，并受偏移的影响。例如，控件不再被固定在布局顶部的\
  \ 20dp 处，而是位于距离顶部 30% 的位置。在不同的方向以及在较大或较小的屏幕上运行时，控件将始终位于布局顶部的 30% 处，而不是 20dp。\n\n\
  *(注：原文此处存在逻辑重复或排版错误，译文忠实反映原文。)*\n\n### 18.1.4 Constraint Bias\n\n已经确定，`ConstraintLayout`\
  \ 中的控件可以受到对立约束的约束，并受偏移的影响。例如，控件不再被固定在布局顶部的 20dp 处，而是位于距离顶部 30% 的位置。\n\n为了在对立约束的情况下调整控件的位置，`ConstraintLayout`\
  \ 引入了一种名为约束偏移的功能。约束偏移允许沿轴按指定的百分比进行偏移。例如，图 18-4 显示了具有 75% 水平偏移和 10% 垂直偏移的布局：\n\n\
  ![](img/Image2461.jpg)\n\n图 18-4\n\n### 18.1.5 Chains\n\n`ConstraintLayout` 链提供将多个控件的布局行为定义为一组的方法。链可以在垂直或水平轴上声明，并配置链中控件的间距和大小。\n\
  \n控件通过双向约束连接时即形成链。例如，图 18-5 展示了三个这样成链的控件：\n\n![](img/Image2468.jpg)\n\n图 18-5\n\n\
  链中的第一个元素是链头，在垂直链中对应顶部控件，在水平链的情况下对应最左侧控件。整个链的布局行为主要通过在链头控件上设置属性来配置。\n\n### 18.1.6\
  \ Chain Styles\n\n`ConstraintLayout` 链的布局行为由应用于链头控件的链样式设置决定。`ConstraintLayout` 类支持以下链布局样式：\n\
  \n- **Spread Chain（散布链）**：链中的控件在可用空间内均匀分布。这是链的默认行为。\n\n![](img/Image2478.jpg)\n\n\
  图 18-6\n\n- **Spread Inside Chain（内部散布链）**：链中的控件在链头和最后一个控件之间均匀分布。包含在间距分布中。\n\n![](img/Image2485.jpg)\n\
  \n图 18-7\n\n- **Weighted Chain（权重链）**：允许通过权重属性定义链中每个控件占据的空间。\n\n![](img/Image2492.jpg)\n\
  \n图 18-8\n\n- **Packed Chain（紧凑链）**：构成链的控件聚集在一起，没有间距。可以应用偏移来控制链相对于父容器的水平或垂直位置。\n\
  \n![](img/Image2500.jpg)\n\n图 18-9\n\n下一章名为“在 Android Studio 中使用 ConstraintLayout”(#Constraint_Layout_in_Studio.xhtml__idTextAnchor463)将详细介绍这些概念，并解释这些功能是如何集成到\
  \ Android Studio 布局编辑器中的。在此之前，还需要涵盖 `ConstraintLayout` 类的其他领域。\n\n### 18.2 Baseline\
  \ Alignment\n\n\n\n\n\n到目前为止，本章仅提到了相对于组件侧边进行对齐的约束（通常称为侧边约束）。然而，一个常见的需求是让组件相对于其显示的内容对齐，而不是相对于组件本身的边界。为了满足这一需求，`ConstraintLayout`\
  \ 提供了基线对齐（baseline alignment）支持。\n\n例如，假设之前图 18-1 中的理论布局需要将 `TextView` 组件置在 `Button`\
  \ 左侧 40dp 处。在这种情况下，`TextView` 需要与 `Button` 视图基线对齐。这意味着 `Button` 内部的文本需要与 `TextView`\
  \ 内部的文本在垂直方向上对齐。该布局的额外约束需要如图 18-10 所示进行连接：\n\n![](img/Image2508.jpg)\n\n图 18-10\n\
  \n现在 `TextView` 沿 `Button` 的基线进行垂直对齐，并在水平方向上距离 `Button` 对象的左边缘 40dp。\n\n### 18.3\
  \ 配置组件尺寸\n\n控制组件的尺寸是用户界面设计过程中的关键要素。`ConstraintLayout` 三个可以设置在单个组件上的选项，以管理尺寸行为。这些设置针对高度和宽度维度进行单独配置：\n\
  \n*   `Fixed`（固定）——组件固定为指定的尺寸。\n*   `Match Constraint`（匹配约束）——允许布局引擎调整组件大小以满足现有的约束。也称为\
  \ `AnySize` 或 `MATCH_CONSTRAINT` 选项。\n*   `Wrap Content`（环绕内容）——组件的大小由其内容（即文本或图形）决定。\n\
  \n### 18.4 Guideline 辅助组件\n\n指南线（Guidelines）是 `ConstraintLayout` 中可用的特殊元素，它们提供了一个可以连接约束的额外目标。可以在\
  \ `ConstraintLayout` 实例中添加多个指南线，这些指南线可以进一步配置为水平或垂直方向。一旦添加，就可以建立布局中的组件到指南线的约束连接。这在多个组件必须沿某一轴对齐时特别有用。例如，在图\
  \ 18-11 中，包含在 `ConstraintLayout` 中的三个 `Button` 对象沿一条垂直指南线进行约束：\n\n![](img/Image2519.jpg)\n\
  \n图 18-11\n\n### 18.5 Group 辅助组件\n\n`ConstraintLayout` 的这一功能允许将组件放入逻辑组中，并作为一个单一实体控制这些组件的可见性。`Group`\
  \ 是布局中其他组件的引用列表。一旦定义，更改 `Group` 实例的可见性属性（`visible`、`invisible` 或 `gone`）将该更改应用到所有组员。这使得通过单个属性的更改来隐藏和显示多个组件变得简单。一个布局可以包含多个组，一个组件也可以属于多个组。如果组之间发生冲突，XML\
  \ 文件中最后声明的组具有优先级。\n\n### 18.6 Barrier 辅助组件\n\n屏障（Barriers）类似于指南线，它们是用于约束布局内视图的虚拟视图。与指南线一样，屏障可以是垂直的或水平的，并且可以将一个或多个视图被约束在它上面（为了避免混淆，这些异称为受约束视图）。然而，与指南线在布局中保持固定位置不同，屏障的位置是由一组所谓的参考视图定义的。引入屏障是为了解决某些频繁发生的视图重叠问题。例如，考虑下方图\
  \ 18-12 所示的布局：\n\n![](img/Image2526.jpg)\n\n图 18-12\n\n上述布局需要注意的关键点是 `View 3` 的宽度被设置为匹配约束模式，且视图的左边缘连接到\
  \ `View 1` 的右边缘。按照目前的实现，增加 `View 1` 的宽度将产生缩小 `View 3` 宽度的预期效果：\n\n![](img/Image2533.jpg)\n\
  \n图 18-13\n\n但是，如果增加的是 `View 2` 的宽度而不是 `View 1`就会出现问题：\n\n![](img/Image2540.jpg)\n\
  \n图 18-14\n\n由于 `View 3` 仅受 `View 1` 约束，它不会调整大小以适应 `View 2` 宽度的增加，导致视图重叠。\n\n解决此问题的方法是添加一个垂直屏障并将\
  \ `View 1` 和 `View 2` 分配为屏障的参考视图，以便它们控制屏障的位置。`View 3` 的左边缘将相对于屏障进行约束，使其成为受约束视图。\n\
  \n现在，当 `View 1` 或 `View 2` 的任一宽度增加时，屏障将移动以适应两个视图中最宽的一个，导致 `View 3` 的宽度相对于新的屏障位置发生变化：\n\
  \n![](img/Image2548.jpg)\n\n图 18-15\n\n在使用屏障时，与单个屏障关联的参考视图和约束视图的数量没有限制。\n\n### 18.7\
  \ Flow 辅助组件\n\n`ConstraintLayout` Flow 辅助组件允许视图组以流式网格布局显示。与 `Group` 辅助组件一样，`Flow`\
  \ 包含了对其负责定位的视图的引用，并提供了配置选项，包括垂直和水平方向、换行行为（包括换行前的组件数量）、间距和对齐属性。链行为也可以应用于 `Flow` 布局，包括\
  \ spread、spread inside 和 packed 选项。\n\n图 18-16 代表了水平模式且无换行的 `Flow` 实例的等尺寸按钮布局：\n\
  \n![](img/Image2508.jpg)\n\n图 18-16\n\n图 18-17 显示了相同的按钮，配置为每三个组件换行一次：\n\n![](img/Image2519.jpg)\n\
  \n图 18-17\n\n图 18-18 则显示了使用 spread inside 模式的按钮（效果仅在第二行可见，因为第一行是满的）。该配置还设置了 `gap`\
  \ 属性以添加按钮之间的间距：\n\n![](img/Image2526.jpg)\n\n图 18-18\n\n作为 `Flow` 辅助组件灵活性的最后一个演示，图\
  \ 18-19 显示了不同尺寸的按钮在水平 packed 链模式下，每三个组件换行一次。此外，通过设置 `horizontal-bias` 值为 `1.0` 使网格内容右对齐（值为\
  \ `0.0` 将导致左对齐，而 `0.5` 将使网格内容居中）：\n\n![](img/Image2533.jpg)\n\n图 18-19\n\n### 18.8\
  \ 比例\n\n组件的尺寸可以使用比例设置来定义。例如，可以使用比例设置约束组件，使得无论缩放行为如何，宽度始终是高度的两倍。\n\n### 18.9 ConstraintLayout\
  \ 的优势\n\n`ConstraintLayout` 提供的灵活性允许使用单个布局实例实现许多旧布局的特性，而以前可能需要嵌套多个布局。通过允许设计所谓的“扁平”或“浅层”布局结构，可以避免布局嵌套固有的问题，既减少了布局的复杂性，又提高了运行时的用户界面渲染性能。\n\
  \n`ConstraintLayout` 也是为了解决当今存在的各种 Android 设备屏幕尺寸而实现的。`ConstraintLayout` 的灵活性使得设计能够响应并适应运行应用程序设备的用户界面变得更加容易。\n\
  \n\n\n\n最后，正如“Android Studio 中使用 ConstraintLayout 指南”章节所示的那样，`Android Studio Layout\
  \ Editor`工具已专门针对基于 `ConstraintLayout`的用户界面设计进行了增强。\n\n### 18.10 ConstraintLayout\
  \ 的可用性\n\n尽管 `ConstraintLayout` 是随 Android 7 引入的，但它是作为一个相对于主 `Android SDK` 的独立支持库提供的，并且兼容追溯到\
  \ `API Level 9`（Gingerbread）的更旧 Android 版本。这使得使用此布局的应用程序可以在运行旧旧版本 Android 的设备上运行。\n\
  \n### 18.11 总结\n\n`ConstraintLayout` 是随 Android 7 引入的布局管理器。它旨在简化创建灵活的布局，以适应市场上多种\
  \ Android 设备的尺寸和方向。`ConstraintLayout` 使用约束条件来控制控件相对于父 `ConstraintLayout` 实例、指南（guidelines）、屏障（barriers）以及布局中其他控件的对齐和定位。`ConstraintLayout`\
  \ 是新创建的 `Android Studio` 项目的默认布局，并在设计用户界面布局时推荐使用。这种简单而灵活的布局管理方法允许复杂且响应式的用户界面被轻松实现。\n\
  \n## 19. Android Studio 中使用 ConstraintLayout 指南\n\n正如前面的章节中多次提到的，Google 已经对 `Android\
  \ Studio Layout Editor` 工具进行了重大更改，其中许多更改仅是为了支持使用 `ConstraintLayout` 的用户界面布局设计。既然上一章已经概述了\
  \ `ConstraintLayout` 的基本概念，本章将更详细地探讨这些概念，同时概述 `Layout Editor` 工具如何设计和实现基于 `ConstraintLayout`\
  \ 的用户界面。\n\n### 19.1 设计与布局视图\n\n标题为“Android Studio Layout Editor 工具指南”的章节解释了 `Android\
  \ Studio Layout Editor` 工具提供了两种方式来查看 `activity` 的用户界面布局，即 `Design`（设计）视图和 `Layout`（布局）视图（也称为蓝图视图）。这些布局视图可以单独显示，也可以像图\
  \ 19-1\n\n图 19-1\n\n`Design` 视图（位于上图左侧）提供了布局的“所见即所得”表示，其中布局以其在运行应用程序中的形式呈现。另一方面，`Layout`\
  \ 视图显示的是蓝图风格的视图，其中阴影轮廓表示控件。如上方的图 19-1\n\n图 19-2\n\n两个视图中约束连接的显示方式可以使用图 19-3\n\n\
  图 19-3\n\n除了显示用户界面布局的两种模式外，`Layout Editor` 工具提供了三种建立特定布局设计所需约束的方法。\n\n### 19.2 自动连接模式（Autoconnect\
  \ Mode）\n\n自动连接（Autoconnect）顾其实名，在项添加到布局时会自动建立约束连接。可以使用图 19-4 所示的工具栏按钮开启或关闭 `Autoconnect`\
  \ 模式：\n\n![](img/as_layout_autoconnect.jpg)\n\n图 19-4\n\n`Autoconnect` 模式使用算法根据控件的位置以及控件与父布局侧边和其他元素的距离来决定建立最佳约束。如果任何自动约束连接未能提供预期的行为，可以手动对它们进行更改，正如本章稍后部分概述的那样。\n\
  \n### 19.3 推断模式（Inference Mode）\n\n推断模式使用涉及算法和概率的启发式方法，在控件已添加到布局后自动实现约束连接。这种模式通常在关闭\
  \ `Autoconnect` 功能且在没有任何约束连接的情况下将对象添加到布局时使用。这允许通过从调色板将对象拖放到布局画布上，并不断更改尺寸和位置，直到布局符合要求来设计布局。本质上，这涉及“绘制”布局而不必担心约束。推断模式也可以在设计过程中用于填充布局中缺缺的约束。\n\
  \n当点击 `Infer constraints`（推断约束）按钮（图 19-5）时，约束会自动添加到布局中：\n\n![](img/as_layout_infer.jpg)\n\
  \n图 19-5\n\n与 `Autoconnect` 模式一样，`Layout Editor` 工具始终存在推断错误约束的可能性，尽管这些约束可以手动修改和纠正。\n\
  \n### 19.4 手动操作约束\n\n实现约束连接的第三种选择是手动进行。这样做时，理解 `Layout Editor` 中控件周围出现的各种手柄将会有帮助。例如考虑图\
  \ 19-6 所示的控件：\n\n![](img/as_constraint_markers.jpg)\n\n图 19-6\n\n类似弹簧的线条（A）代表从控件侧到目标的已建立约束连接。对象每个角的小方形标记（B）是调整尺寸的手柄，点击并拖动即可调整控件。位于控件每侧的小圆形手柄（C）是侧约束锚点。要创建约束连接，点击手柄并将生成的线拖到要连接的元素（例如指南、父布局侧边或其他控件），如图\
  \ 19-7\n\n图 19-7\n\n如果约束线拖到控件但未连接到约束手柄，布局编辑器将显示一个可以附加约束的侧列表。例如，在图 19-8 中，约束可以连接到目标按钮的顶部或底部边缘：\n\
  \n![](img/as_constraint_drag_between_edges.jpg)\n\n图 19-8\n\n额外的标记指示基准约束的锚点，使用控件内部的内容（而非边缘）作为对齐点。要显示此标记，右键点击控件并选择\
  \ `Show Baseline`（显示基准）菜单选项。要从基准约束手柄建立连接，将鼠标指针悬停在柄上直到其高亮，然后点击并拖到目标（例如另一个控件的基准锚点，如图\
  \ 19-9\n\n图 19-9\n\n要隐藏基准锚点，再次右键点击控件并选择 `Hide Baseline`（隐藏基准）菜单选项。\n\n### 19.5 在检查器中添加约束\n\
  \n\n\n\n\n也可以通过属性（Attributes）工具窗口中的检查器（Inspector）面板，为 Android Studio 布局编辑器工具中的视图添加约束（Constraints），如图\
  \ 19-10 所示。中间的正方形表示当前选中的视图，正方形周围的区域则表示应用于视图对应侧的约束（如果存在的话）：\n\n![](img/as_constraint_attributes.jpg)\n\
  \n图 19-10\n\n视图某侧缺少约束时，其表现为一条指向包含加号的蓝色圆圈的虚线（如上图中视图底部边缘的情况所示）。要添加约束，点击此蓝色圆圈，布局编辑器将添加一个连接到其认为的布局内最合适目标的目标的约束。\n\
  \n### 19.6 在属性窗口中查看约束\n\n通过显示属性（Attributes）工具窗口中的约束（Constraints）部分，可以查看当前选中的小部件上配置的约束列表，如下文所示图\
  \ 19-11]所示：\n\n![](img/as_attributes_constraints_section.jpg)\n\n图 19-11\n\n点击列表中的约束将在设计布局中选中该约束。\n\
  \n### 19.7 删除约束\n\n要删除单个约束，请在设计布局或属性（Attributes）工具窗口中选择该约束使其高亮（例如，在图 19-12 中，选中了最右侧的约束），然后按下键盘上的删除（delete）键。该约束将从布局中移除。\n\
  \n![](img/as_constraint_selected.jpg)\n\n图 19-12\n\n另一种选项是在按住 `Ctrl` 键（macOS 上为\
  \ `Cmd`）的同时将鼠标指针悬停在约束锚点（constraint anchor）上，并在其变为红色后点击锚点：\n\n![](img/as_constraint_anchor_delete.jpg)\n\
  \n图 19-13\n\n或者，通过右键点击小部件并选择“清除选择约束”（Clear Constraints of Selection）菜单选项来移除该小部件的所有约束。\n\
  \n要移除布局中每个小部件的所有约束，请使用图 19-14 中高亮显示的工具栏按钮：\n\n![](img/as_layout_delete_constraint.jpg)\n\
  \n图 19-14\n\n### 19.8 调整约束偏置\n\n上一章概述了使用偏置（bias）设置来倾向于某一个对立约束而非另一个的概念。Android Studio\
  \ 布局编辑器工具中的偏置是通过属性（Attributes）工具窗口中的检查器（Inspector）调整的，如图 19-15 所示。图中箭头指示的两个滑块用于控制当前选中小部件的垂直和水平方向对立约束的偏置。\n\
  \n![](img/as_constraint_bias_sliders.jpg)\n\n图 19-15\n\n### 19.9 理解 ConstraintLayout\
  \ 边距\n\n约束可以配合边距（margins）使用，以便实现部件与其他元素（如另一个小部件、引导线或父布局的侧边）之间的固定间隙。例如，考虑应用于图 19-16\
  \ 中 `Button` 对象的水平约束：\n\n![](img/as_constraint_no_margins.jpg)\n\n图 19-16\n\n按照目前的配置，水平约束延伸到父\
  \ `ConstraintLayout` 的左左右边缘。因此，该小部件具有对立的水平约束，这表明 `ConstraintLayout` 布局引擎在运行时对小部件的实际位置具有一定的裁量权。这使得布局具有一定的灵活性，以适应不同的屏幕尺寸和设备方向。水平偏置设置还可以控制小部件的位置一直到达布局的右侧。例如，图\
  \ 19-17 显示了应用了 100% 水平偏置的同一个按钮：\n\n![](img/as_constraint_100_bias.jpg)\n\n图 19-17\n\
  \n`ConstraintLayout` 边距可能会出现在约束连接的末端，代表一个固定间隙，即使在调整偏置或响应活动其他部分的布局变化时，部件也无法移动到间隙内。在图\
  \ 19-18 中，右侧约束现在包含一个 50dp 的边距，即使偏置仍设置为 100%，部件也无法移动到该区域。\n\n![](img/as_constraint_bias_with_margin.jpg)\n\
  \n图 19-18\n\n小部件上的现有边距值可以在检查器（Inspector）中进行修改。如图 19-19 所示，正在使用下拉菜单将当前选中小部件的右侧边距更改为\
  \ 16dp。或者，点击当前值也可以在字段中输入数字。\n\n![](img/as_constraint_set_margin.jpg)\n\n图 19-19\n\
  \n新约束的默认边距可以随时使用图 19-20 中高亮显示的工具栏选项进行更改：\n\n![](img/as_constraints_default_margin.jpg)\n\
  \n图 19-20\n\n### 19.10 对立约束和偏置的重要性\n\n正如上一章中所讨论的，对立约束、边距和偏置是使用 `ConstraintLayout`\
  \ 设计响应式布局的基石。当小部件在没有对立约束的情况下约束时，这些约束在视觉上通过带有边距测量值的实线表示，如图 19-21 所示：\n\n![](img/as_constraint_no_opposing.jpg)\n\
  \n图 19-21\n\n上述约束固定了部件的位置。结果是，当设备旋转到横屏模式时，小部件将不再可见，因为垂直约束将其推出了设备边缘（如图 19-22 所示）。如果在一个比设计时更小的屏幕上运行应用程序，也会类似的问题。\n\
  \n![](img/as_constraint_no_opposing_landscape.jpg)\n\n图 19-22\n\n实施对立约束时，约束连接由波动的弹簧线表示（弹簧的比喻旨在指示位置没有固定在绝对\
  \ X 和 Y 坐标上）：\n\n![](img/as_constraints_opposing.jpg)\n\n图 19-23\n\n在上述布局中，垂直和水平偏置设置已配置为使小部件始终位于距离底部\
  \ 90% 和距离左侧边缘 35% 的位置。因此，旋转后，小部件仍然可见，并相对于屏幕尺寸保持相同的位置：\n\n![](img/as_constraint_opposing_landscape.jpg)\n\
  \n图 19-24\n\n在手动设计用户界面布局和纠正自动创建的约束时，对于设计响应式和适应性的用户界面布局是非常重要的。\n\n### 19.11 配置小部件尺寸\n\
  \n`ConstraintLayout` 内部的小部件尺寸也可以通过检查器（Inspector）进行配置。正如上一章概述，小部件尺寸可以设置为封装内容（wrap\
  \ content）、固定（fixed）或匹配约束（match constraint）模式。当前选中小部件每个维度的现有设置显示在检查器中代表部件的正方形内，如图\
  \ 19-25 所示：\n\n![](img/as_constraint_dimensions.jpg)\n\n图 19-25\n\n上图将水平和垂直维度设置为封装内容模式（由向内的箭头符号表示）。\n\
  \n\n\n\n\n| 固定尺寸 | ![](img/Image2826.jpg) |\n| 匹配约束 | ![](img/Image2834.jpg) |\n\
  | 包装内容 | ![](img/Image2844.jpg) |\n\n表 19-1\n\n要更改当前设置，点击指示器可以在三个设置之间循环。\n\n此外，可以使用\
  \ `Expand Horizontally`（水平扩展）和 `Expand Vertically`（垂直扩展）选项将组件的大小水平或垂直扩展到布局中约束和其他组件允许的最大范围。可以通过右键点击布局中的组件组件并从弹出的菜单中选择\
  \ `Organize`（组织）选项来访问（参见图 19-26）。使用时，当前选中的组件将在水平或垂直方向上增大以填充其周围的可用空间。\n\n![](img/as_constraint_expand_menu.jpg)\n\
  \n图 19-26\n\n### 19.12 设计时工具定位\n\n标题为 Android Studio 布局编辑器工具指南的章节介绍了 `tools` 命名空间的概念，并解释了如何使用它设置仅在布局编辑器中生效的可见性属性。在后台，Android\
  \ Studio 还使用 `tools` 属性在无约束的情况下放置于布局上时将组件保持在位置。例如，想象在禁用自动连接模式时将一个 `Button` 放到布局中。虽然该组件在预览画布上似乎处于正确位置，但在运行应用程序时，它将出现在屏幕的左上角。这是因为组件没有约束来告诉\
  \ `ConstraintLayout` 父布局应该将其放置在何处。\n\n该组件在布局编辑器中似乎位于正确位置，是因为 Android Studio 设置了绝对的\
  \ `X` 和 `Y` 定位工具 `tools` 属性，以便在添加约束之前将其保持在正确位置。在 XML 布局文件中，其内容可能如下：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button4\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:text=\"Button\"\n    tools:layout_editor_absoluteX=\"\
  111dp\"\n    tools:layout_editor_absoluteY=\"88dp\" />\n```\n\n一旦为组件添加了足够的约束，布局编辑器将移除这些\
  \ `tools` 属性。一种快速识别哪些组件缺少约束而无需等待应用程序运行的实用技巧，是点击图 19-27 中高亮显示的按钮，以切换 `tools` 位置的可视性。任何跳转到左上角的组件都是未完全约束的，它们正通过临时的\
  \ `tools` 绝对 `X` 和 `Y` 定位属性固定位置。\n\n![](img/as_constraint_tool_button.jpg)\n\n图\
  \ 19-27\n\n### 19.13 添加辅助线\n\n辅助线提供了可以用于锚定约束的额外元素。可以通过右键点击布局并选择 `Vertical Guideline`（垂直辅助线）或\
  \ `Horizontal Guideline`（水平辅助线）菜单选项，或者使用如图 19-28 所示的工具栏菜单选项来添加辅助线：\n\n![](img/as_layout_guideline_menu.jpg)\n\
  \n图 19-28\n\n或者，可以从 `Palette`（调色板）的 `Helpers`（辅助工具）部分拖动水平和垂直辅助线到布局画布或 `Component\
  \ Tree`（组件树）面板上，如图 19-29\n\n图 19-29\n\n一旦添加，辅助线将以虚线出现在布局中，可以通过点击并拖动线条来移动。要建立到辅助线的约束连接，点击组件的约束处理器并在释放之前将其拖到辅助线。在图\
  \ 19-30 中，两个 `Buttons` 的左侧通过约束连接到一条垂直辅助线。\n\n垂直辅助线的位置可以指定距离父布局左侧或右侧的绝对距离（水平辅助线为顶部或底部）。例如，下图中的垂直辅助线位于父布局左边缘的\
  \ `97dp` 处：\n\n![](img/as_constrain_guideline.jpg)\n\n图 19-30\n\n或者，辅助线也可以定位为父布局总宽度或高度的百分比。要在这三种模式之间切换，选择辅助线并点击辅助线底部或末端的圆（取决于辅助线是垂直还是水平的）。例如，图\
  \ 19-31\n\n图 19-31\n\n### 19.14 添加屏障\n\n可以通过右键点击布局并在 `Add helpers`（添加辅助工具）菜单中选择\
  \ `Vertical`（垂直屏障）或 `Horizontal Barrier`（水平屏障）选项，或使用工具栏菜单选项来添加屏障，如图 19-28\n\n图 19-32\n\
  \n要添加作为参考视图（即控制屏障位置的视图），从 `Component Tree` 中将组件拖到屏障项上。在图 19-33 中，名为 `textView2`\
  \ 和 `textView3` 的组件已被分配为屏障的引用：\n\n![](img/as_barrier_reference_views.jpg)\n\n图 19-33\n\
  \n添加参考视图后，需要配置屏障以指定相对于这些视图的方向。这是在 `Component Tree` 中选择屏障时在 `Attributes` 工具窗口定义的屏障方向设置：\n\
  \n![](img/as_barrier_direction.jpg)\n\n图 19-34\n\n下图显示了一个包含屏障的布局，`textView1` 和 `textView2`\
  \ 作为参考视图，`textview3` 作为约束视图。由于屏障从参考视图末端指向约束视图，屏障方向已设置为 `end`：\n\n![](img/as_3.5_constraints_barrier.jpg)\n\
  \n图 19-35\n\n### 19.15 添加组\n\n要向布局添加 `Group`（组），右键点击布局并在 `Add helpers` 菜单中选择 `Group`\
  \ 选项，或使用如图 19-28 所示的工具栏菜单选项。或者，在 `Palette` 的 `Helpers` 部分找到 `Group` 项，将其拖放到布局画布或\
  \ `Component Tree` 面板上。\n\n要向组添加组件，在 `Component Tree` 中选择它们并将其拖放到 `Group` 项上（由于原文未提供具体的拖拽操作描述，但上下文描述为在\
  \ `Component Tree` 中操作，此处保持翻译逻辑一致）。\n\n例如，图 19-36 显示了三个选中的组件被添加到组中：\n\n![](img/as_constrain_group.jpg)\n\
  \n图 19-36\n\n被组引用的任何组件都将在 `Component Tree` 中的组项下方以斜体形式显示，如图 19-37 所示。要从组中移除组件，选择它并按键盘删除键：\n\
  \n![](img/as_constrain_group_added.jpg)\n\n图 19-37\n\n一旦组件被分配给组，使用 `Attributes`\
  \ 工具窗口中的 `Constraints` 部分来修改可见性设置：\n\n![](img/as_group_invisible.jpg)\n\n图 19-38\n\
  \n\n\n\n\nFlow 辅助工具可以使用菜单或 `Palette`（调面板）添加，如之前提到的其他辅助工具所示。与 `Group` 辅助工具（图 19-36）类似，通过在\
  \ `Component Tree`（组件树）中将控件拖到 `Flow` 条目上添加到 `Flow` 实例。添加 `Flow` 辅助工具并为其分配控件后，在 `Component\
  \ Tree` 中选中它，并使用 `Attribute` 工具窗口的 `Common Attributes`（通用属性）部分配置流布局行为：\n\n![](img/as_flow_attributes.jpg)\n\
  图 19-39\n\n### 19.17 组对齐与分布\n\nAndroid Studio 布局编辑器工具提供了在选择两个或多个控件时可以执行的一系列对齐和分布操作。按住\
  \ Shift 点击要包含在操作中的每个控件，右键点击布局，并从 `Align`（对齐）菜单中显示的许多选项中进行选择：\n\n![](img/as_layout_align_menu.jpg)\n\
  图 19-40\n\n如下所示的图 19-41，这些选项也可以通过 `Layout Editor`（布局编辑器）工具栏上的 `Align` 按钮访问：\n\n\
  ![](img/as_layout_align_menu_2.jpg)\n图 19-41\n\n同样，`Pack`（打包）菜单（图 19-42）可以用于共同重新定位所选控件，使它们在垂直或水平方向上紧密排列在一起。它通过更改控件的绝对\
  \ `x` 和 `y` 坐标来实现这一点，但不会应用任何约束。另一方面，`Pack` 菜单中的两个分布选项会移动所选控件，使其在垂直或水平轴上均匀间距分布，并在视图之间应用约束以保持这种间距：\n\
  \n![](img/as_layout_pack_menu.jpg)\n图 19-42\n\n### 19.18 将其他布局转换为 ConstraintLayout\n\
  \n对于使用一个或多个其他 Android 布局类（如 `RelativeLayout` 或 `LinearLayout`）的现有用户界面布局，布局编辑器工具提供了一个将用户界面转换为使用\
  \ `ConstraintLayout` 的选项。\n\n当布局编辑器打开并处于 `Design`（设计）模式时，`Component Tree` 面板显示在\
  \ `Palette` 下方。要将布局转换为 `ConstraintLayout`，在 `Component Tree` 中找到它，右键点击它并选择 `Convert\
  \ <current layout> to Constraint Layout` 选项：\n\n![](img/as_layout_convert_view_menu.jpg)\n\
  图 19-43\n\n选择此菜单选项后，Android Studio 将将选定的布局转换为 `ConstraintLayout`，并使用推理建立设计以匹配原始布局类型行为的约束。\n\
  \n### 19.19 总结\n\n重新设计的布局编辑器工具结合 `ConstraintLayout`，使用 Android Studio 设计复杂的用户界面布局成为一个相对快速且直观的过程。本章详细介绍了约束（constraints）、边距（margins）和偏置（bias）的概念，同时探索了基于\
  \ `ConstraintLayout` 的设计如何集成到布局编辑器工具中。\n\n# 20 在 Android Studio 中处理 ConstraintLayout\
  \ 链和比例\n\n之前的章节介绍了 `ConstraintLayout` 类的关键特性，并概述了在 Android Studio 布局编辑器中基于 `ConstraintLayout`\
  \ 的用户界面设计的最佳实践。尽管在“Android ConstraintLayout 指南”章节中已经概述了 `ConstraintLayout` 链和比例的概念，但我们尚未讨论如何在布局编辑器中使用这些功能。因此，本章的重点是提供在使用\
  \ `ConstraintLayout` 类时创建和管理链和比例的实际步骤。\n\n### 20.1 创建链 (Chain)\n\n链可以通过向 Activity\
  \ 的 XML 布局资源文件添加几行代码，或使用布局编辑器的某些链特有功能来实现。\n\n考虑一个包含三个 `Button` 控件的布局，这些控件被约束在 `ConstraintLayout`\
  \ 父布局的左上角、顶部中央和右上，如图 20-1 所示：\n\n![](img/as_three_button_row.jpg)\n图 20-1\n\n为了表示此类布局，XML\
  \ 资源布局文件可能包含以下按钮控件的条目：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\n   \
  \ android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\n\
  \    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintEnd_toStartOf=\"button3\"\
  \n    app:layout_constraintStart_toEndOf=\"button1\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button3\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n目前的配置配置没有双向约束将这些控件组合成一条链。为了解决这个问题，需要添加从\
  \ `button1` 右侧到 `button2` 左侧，以及从 `button3` 左侧到 `button2` 右侧的约束，如下所示：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintEnd_toStartOf=\"button2\" />\n\n<Button\n   \
  \ android:id=\"@+id/button2\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toStartOf=\"button3\"\n    app:layout_constraintStart_toEndOf=\"\
  button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n\n<Button\n    android:id=\"\
  @+id/button3\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toEndOf=\"\
  button2\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n通过这些更改，控件现在已配置了双向水平约束。这构成了一个\
  \ ConstraintLayout 链，在布局编辑器中通过链连接进行视觉化表示，如下图 20-2 所示。注意，在此配置下，链默认使用了扩散链（spread chain）样式。\n\
  \n![](img/as_layout_chain.jpg)\n图 20-2\n\n也可以通过右键点击一个视图并选择 `Chains -> Create Horizontal\
  \ Chain`（创建水平链）或 `Chains -> Create Vertical Chain`（创建垂直链）菜单选项来创建链。\n\n### 20.2 更改链样式\n\
  \n\n\n\n如果没有配置链样式，`ConstraintLayout` 将默认使用散布（spread）链样式。可以通过右键点击链中的任何小部件并选择 `Cycle\
  \ Chain Mode`（循环链模式）菜单选项来更改链样式。每点击一次该菜单选项，样式就会按照散布（spread）、内散布（spread inside）和聚集（packed）的顺序切换到另一种设置。\n\
  \n或者，可以在属性（Attributes）工具窗口中指定样式，展开 `layout_constraints` 属性，并根据链的方向更改 `horizontal_chainStyle`\
  \ 或 `vertical_chainStyle` 属性：\n\n![](img/as_layout_chain_style.jpg)\n\n图 20-3\n\n\
  ### 20.3 内散布链样式\n\n图 20-4 展示了使用上述技术将链样式更改为内散布链样式的效果：\n\n![](img/as_layout_chain_spread_inside.jpg)\n\
  \n图 20-4\n\n### 20.4 聚集链样式\n\n使用相同的技术，将链样式属性更改为 `packed` 会导致布局发生变化，如图 20-5 所示：\n\
  \n![](img/as_layout_chain_packed.jpg)\n\n图 20-5\n\n### 20.5 带有偏置的聚集链\n\n聚集链的位置可能会受到偏置（bias）值的影响。偏置可以在\
  \ 0.0 到 1.0 之间，0.5 代表父容器的中心。可以通过选择链头小部件并在属性面板的 `layout_constraintHorizontal_bias`\
  \ 或 `layout_constraintVertical_bias` 属性中赋值来控制偏置。图 20-6 显示了一个水平偏置设为 0.2 的聚集链：\n\n\
  ![](img/as_layout_chain_packed_bias.jpg)\n\n图 20-6\n\n### 20.6 权重链\n\n最后一个需要探索的链区域涉及对单个小部件进行权重，以控制链中每个小部件在可用空间中所占空间。权重链只能使用散布链样式实现，并且链中任何响应权重属性的小部件都必须将其相应的维度属性（垂直链为高度，水平链为宽度）配置为匹配约束（match\
  \ constraint）模式。小部件维度的匹配约束模式可以通过选择小部件、显示属性面板并将维度更改为 `match_constraint`（等同于 0dp）来配置。例如，在图\
  \ 20-7 中，按钮的 `layout_width` 约束设置为 `match_constraint` (0dp)，表示小部件的宽度将根据现行的约束设置来确定：\n\
  \n![](img/as_match_constraints.jpg)\n\n图 20-7\n\n假设已选择散布链样式且所有三个按钮都配置为宽度维度设置为匹配约束，则链中的小部件将等宽扩展以填满可用空间：\n\
  \n![](img/as_layout_unweighted_chain.jpg)\n\n图 20-8\n\n每个小部件相对于链中其他小部件所占空间的大小可以通过向小部件添加权重属性来控制。图\
  \ 20-9 显示了在 `button1` 上将 `layout_constraintHorizontal_weight` 属性设为 4，在 `button2`\
  \ 和 `button3` 上设为 2 的效果：\n\n![](img/as_layout_weighted_chain.jpg)\n\n图 20-9\n\n\
  由于这些权重值，`button1` 占据了一半的空间 (4/8)，而 `button2` 和 `button3` 各占据空间的四分之一 (2/8)。\n\n###\
  \ 20.7 使用比例\n\nConstraintLayout 比例允许一个小部件的维度相对于该小部件的另一个维度进行调整（也称为宽高比）。例如，可以对 `ImageView`\
  \ 应用宽高比设置，以确保其宽度始终是高度的两倍。\n\n维度比例约束通过将受约束的维度设置为匹配约束模式，并在该小部件上将 `layout_constraintDimensionRatio`\
  \ 属性配置所需的比例来配置。例如，以下 XML 代码段为 `ImageView` 小部件配置了 2:1 的比例：\n\n```xml\n<ImageView\n\
  \    android:layout_width=\"0dp\"\n    android:layout_height=\"100dp\"\n    android:id=\"\
  @+id/imageView\"\n    app:layout_constraintDimensionRatio=\"2:1\" />\n```\n\n上面的示例演示了当仅设置一个维度为匹配约束时如何配置比例。当两个维度都设置为匹配约束模式时，也可以应用比例。这涉及指定比例并在前面加上\
  \ `H` 或 `W`，以指示哪一个维度是相对于另一个维度受约束的。\n\n例如，考虑以下 `ImageView` 对象的 XML 代码段：\n\n```xml\n\
  <ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"0dp\"\n\
  \    android:id=\"@+id/imageView\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintRight_toRight=\"parent\"\n    app:layout_constraintLeft_toLeft=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    app:layout_constraintDimensionRatio=\"\
  W:3\" />\n```\n\n在上面的示例中，高度将根据所应用的约束来定义。在这种情况下，约束已配置为附加父容器的顶部和底部，从而将小部件拉伸到整个父容器的高度。另一方面，宽度维度被约束为高度的三分之一。\n\
  \n因此，无论布局在什么尺寸或方向下显示，ImageView 的高度始终与父相同，宽度为高度的三分之一。\n\n### 20.8 总结\n\n链和比例是 `ConstraintLayout`\
  \ 类的强大功能，旨在为 Android 应用设计灵活且响应的用户界面提供额外的选项。如本章所述，Android Studio Layout Editor 已经增强，以便在用户界面设计过程中更容易使用这些功能。\n\
  \n### 21. ConstraintLayout 教程\n\n设计 Android 应用用户界面的简单且有效的方法是使用 Android Studio Layout\
  \ Editor 工具。本章将概述如何使用这种方法创建用户界面。本章中包含的练习也将作为一个机会，概述如何从一个“空白”的 Android Studio 项目开始创建一个活动。\n\
  \n### 21.1 Android Studio Layout Editor 工具示例\n\n此示例阶段的第一步创建一个新的 Android Studio 项目。启动\
  \ Android Studio 并通过选择 File -> Close Project 菜单选项关闭之前打开的项目。\n\n\n\n\n\n从欢迎界面选择 `New\
  \ Project` 选项，选择 `Empty Views Activity` 模板，并点击 `Next`。在 `Name` 字段中输入 `LayoutSample`\
  \ 并指定 `com.ebookfrenzy.layoutsample` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level`\
  \ 设置为 `API 26`：`Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。\n\n## 21.2 准备布局编辑器环境\n\
  \n在 `app` -> `res` -> `layout` 文件夹中找到并双击 `activity_main.xml` 布局文件，将其加载到 `Layout\
  \ Editor` 工具中。由于本教程旨在获得使用约束的经验，请使用位于 `Layout Editor` 工具栏上的按钮关闭 `Autoconnect` 功能。禁用后，按钮上将出现一条删除线，如\
  \ 图 21-1 所示：\n\n![](img/as_layout_sample_autoconnect_off.jpg)\n\n图 21-1\n\n如果 `Autoconnect`\
  \ 按钮右侧的默认边距值未设置为 `8dp`，请点击并在生成的面板中选择 `8dp`。\n\n用户界面设计还将使用 `ImageView` 对象来显示图像。在继续之前，应将此图像添加到项目中，以便稍后在章节中使用。该文件名为\
  \ `GalaxyS23.webp`，可以在从以下 URL 下载的示例代码 `project_icons` 文件夹中找到：\n\n[`www.payloadbooks.com/product/hedgehogjava`](https://www.payloadbooks.com/product/hedgehogjava%20)\n\
  \n在 Android Studio 中，显示 `Resource Manager` 工具窗口（`View` -> `Tool Windows` -> `Resource\
  \ Manager`）。在操作系统的文件系统导航器中找到 `GalaxyS23.webp` 图像，并将其拖入 `Resource Manager` 工具窗口。在弹出的对话框中，点击\
  \ `Next`，然后点击 `Import` 按钮，将图像添加到项目中。现在，图像应该出现在 `Resource Manager` 中，如下方的 图 21-2\
  \ 所示：\n\n![](img/as_resource_manager.jpg)\n\n图 21-2\n\n图像还会出现在 `Project` 工具窗口的 `res`\
  \ -> `drawables` 部分：\n\n![](img/as_layout_sample_image_added.jpg)\n\n图 21-3\n\n\
  ## 21.3 向用户界面添加控件\n\n从 `Common` 调色板类别中，将 `ImageView` 对象拖到显示视图的中心。注意，此时会出现水平和垂直虚线，表示显示的中心轴。当居中后，释放鼠标按钮将视图放置在指定位置。一旦放置在布局中，将出现\
  \ `Resources` 对话框，请求在视图中显示的图像。在对话框顶部的搜索栏中，输入“galaxy”以定位 `galaxysys6.png` 资源，如 图\
  \ 21-4 所示：\n\n![](img/as_pick_a_resource.jpg)\n\n图 21-4\n\n选择该图像并点击 `OK` 将其分配给 `ImageView`\
  \ 对象。如有必要，使用调整大小柄调整 `ImageView` 的尺寸，并将其重新置于布局的中心。此时，布局应与 图 21-5 匹配：\n\n![](img/as_layout_sample_image_layout.jpg)\n\
  \n图 21-5\n\n从调色板的 `Common` 部分点击并拖动 `TextView` 对象，并将其置于显示在 `ImageView` 上方，如 图 21-6\
  \ 所示。\n\n使用 `Attributes` 面板，展开 `Common Attributes` 部分中的 `textAppearance` 属性项，将 `textSize`\
  \ 属性更改 `24sp`，将 `textAlignment` 设置为居中，并将文本改为“Samsung Galaxy S23”。\n\n![](img/as_layout_sample_textview.jpg)\n\
  \n图 21-6\n\n接下来，在布局底部添加三个 `Button` 控件，并将这些视图的文本属性设置为“Buy Now”、“Pricing”和“Details”。完成后的布局现在应与\
  \ 图 21-7 匹配：\n\n![](img/as_layout_sample_full_ui.jpg)\n\n图 21-7\n\n此时，控件的约束尚不够充分，导致布局引擎无法运行时对控件进行定位和调整大小。如果现在运行应用，所有控件都将位于显示器的左上角。\n\
  \n将控件添加到布局后，使用位于 `Layout Editor` 工具栏上的设备旋转菜单（如 图 21-8 中的箭头所示）在横向取下下查看用户界面：\n\n![](img/as_layout_rotate.jpg)\n\
  \n图 21-8\n\n缺少约束会导致布局无法适应设备方向的变化，导致内容偏离中心，并且图像的一部分以及所有三个按钮都位于屏幕可视区域之外。要使此成为响应式用户界面，还需要做一些工作。\n\
  \n### 21.4 添加约束\n\n约束是创建适应设备方向变化的布局的关键。首先，将布局恢复为竖向模式并选择 `ImageView` 之上的 `TextView`。在选中控件后，将\
  \ `TextView` 的左侧和右侧约束到父布局的两侧，如 图 21-9 所示。将顶部的约束设置为 `16`：\n\n![](img/as_layout_sample_textview.jpg)\n\
  \n图 21-9\n\n对 `TextView` 完成约束后，选择 `ImageView` 并在其左侧和右侧建立到布局两侧约束。接下来，将 `ImageView`\
  \ 的顶部约束到 `TextView` 的底部，并将底部约束到中间 `Button` 控件的顶部。如有必要，点击并拖动 `ImageView` 以保持在布局的垂直中心。\n\
  \n在仍选中 `ImageView` 时，使用属性面板中的 `Inspector` 将 `ImageView` 的顶部和底部边距分别更改 `24` 和 `8`，并将控件的高度和宽度属性均改为\
  \ `match_constraint`。这些设置将允许布局引擎在需要时增大或缩小 `ImageView` 的尺寸：\n\n![](img/as_layout_sample_constraints.jpg)\n\
  \n图 21-10\n\n图 21-11 显示相对于布局其他元素实现的约束：\n\n![](img/as_layout_sample_ui_constraints.jpg)\n\
  \n图 21-11\n\n最后的任务是为三个 `Button` 控件添加约束。在本例中，这些按钮将以链的形式放置。首先通过点击 图 21-1 所示的工具栏按钮开启\
  \ `Autoconnect`。\n\n接下来，点击 `Buy Now` 按钮，然后按 Shift 点击另外两个按钮以选中所有按钮。右键点击 `Buy Now`\
  \ 按钮并在生成的菜单中选择 `Chains` -> `Create Horizontal Chain` 选项。默认情况下，链将使用分布样式显示，这是本例的的行为。\n\
  \n最后，在 `Buy Now` 按钮底部与布局底部建立约束，边距为 `8`。对剩余按钮重复此步骤。\n\n完成这些步骤后，按钮应如 图 21-12 所示受到约束：\n\
  \n![](img/as_layout_sample_button_chain.jpg)\n\n图 21-12\n\n### 21.5 测试布局\n\n为布局添加约束后，将屏幕旋转为横向，并验证布局是否适应新的屏幕尺寸。\n\
  \n\n\n\n\n虽然 `Layout Editor` 工具为设计用户界面布局提供了一个良好的视觉环境，但在涉及测试时，没有任何可以替代对运行中的应用进行测试。请在物理\
  \ Android 设备或模拟器会话上启动应用，并验证用户界面是否反映了在 `Layout Editor` 中创建的布局。例如图 21-13 显示了横屏模式下运行的应用：\n\
  \n![](img/as_layout_sample_landscape.jpg)\n\n图 21-13\n\n用户界面设计现在已完成。设计更复杂的用户界面布局是上述步骤的延续。将视图拖放到显示器上，根据需要进行定位、约束，并设置属性。\n\
  \n## 21.6 使用 Layout Inspector\n\n可以使用 `Layout Inspector` 工具查看组成用户界面布局的组件层级结构。应用必须在运行\
  \ Android API 29 或更高版本的设备或模拟器上运行才能访问此信息。应用运行后，选择 `Tools -> Layout Inspector` 菜单选项，然后使用标记为\
  \ A 的菜单项（见下方图 21-14 显示构成用户界面布局的组件层级结构。中间面板 (B) 可视化地表示布局设计。点击视觉布局中的小部件会导致该项在层级列表中突出显示，从而轻松找到视觉组件相对于整个布局层级结构的位置。\n\
  \n最右侧的面板（在图 21-14 中标记为 C）包含当前所选组件的所有属性设置，允许对组件的内部配置进行深层分析。在适当的情况下，值单元格将包含一个指向项目源代码中属性设置位置的链接。\n\
  \n![](img/as_layout_sample_layout_inspector.jpg)\n\n图 21-14\n\n要以 3D 视图查看布局，点击标记为\
  \ D 的按钮。这将显示层级结构的“爆炸式”表示，以便进行旋转和检查。这对于识别遮挡的视图等任务非常有用：\n\n![](img/as_layout_sample_layout_inspector_3d.jpg)\n\
  \n图 21-15\n\n点击并拖动渲染内容以进行三维旋转，使用上方箭头指示的滑块来增加层之间的间距。再次点击标记为 E 的按钮返回 2D 视图。\n\n###\
  \ 21.7 总结\n\nAndroid Studio 中的 `Layout Editor` 工具与 `ConstraintLayout` 类紧密集成。本章通过创建一个示例用户界面，概述了如何使用\
  \ `Layout Editor` 工具添加小部件并设置约束来实现基于 `ConstraintLayout` 的用户界面。本章还引入了 `Live Layout\
  \ Inspector` 工具，它对于分析用户界面布局的结构组成非常有用。\n\n## 22. 在 Android Studio 中手动设计 XML 布局\n\n\
  虽然使用 Android Studio `Layout Editor` 工具设计布局极大提高了效率，但仍然可以通过手动编辑底层 XML 创建 XML 布局。本章将介绍\
  \ Android XML 布局文件格式的基础。\n\n## 22.1 手动创建 XML 布局\n\nXML 布局文件的结构非常简单，遵循视图树的层级方法。XML\
  \ 资源文件的第一行理想情况下应包含以下标准声明：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  ```\n\n该声明之后应当是布局的根元素，通常是一个容器视图，例如布局管理器。这由起始标签和结束标签以及任何需要在视图上设置的属性表示。例如，下面的 XML\
  \ 将 `ConstraintLayout` 视图声明为根元素，并设置 `match_parent` 属性，使其填充设备显示器的可用空间：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"\
  16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingTop=\"16dp\"\n   \
  \ android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\">\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上面的示例中，布局元素在每个侧都配置了 16dp（密度无关像素）的内边距。Android 布局中的任何间距规范必须使用以下测量单位之一：\n\n\
  - `in` – 英寸。\n- `mm` – 毫米。\n- `pt` – 磅（1/72 英寸）。\n- `dp` – 密度无关像素。一种基于设备显示器物理密度相对于\
  \ 160dpi 显示基准的抽象测量单位。\n- `sp` – 比例无关像素。与 `dp` 类似，但根据用户的字体偏好进行缩放。\n- `px` – 实际屏幕像素。不建议使用，因为不同的显示每英寸像素不同。建议使用\
  \ `dp` 而非此单位。\n\n任何需要添加到 `ConstraintLayout` 的子元素必须嵌套在起始标签和结束标签之间。在下面的示例中，一个 `Button`\
  \ 被作为 `ConstraintLayout` 的子元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<androidx.constraintlayout.widget.ConstraintLayout\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  >\n    <Button\n        text=\"My Button\"\n        android:layout_width=\"wrap_content\"\
  \n        android:layout_height=\"wrap_content\" />\n</androidx.constraintlayout.ConstraintLayout>\n\
  ```\n\n按照目前的实现，按钮没有任何连接。在运行时，按钮将出现在屏幕左上角（根据父元素的内边距缩进 16dp）。如果为按钮两侧添加了相反的约束，它将居中于布局：\n\
  \n```xml\n<Button\n    text=\"My Button\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/button\"\n \
  \   app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n要在布局中添加第二个小部件，请将其嵌入 `ConstraintLayout` 元素的体内。例如，下面的修改在布局中添加了一个\
  \ `TextView`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"\
  16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingRight=\"16dp\"\n   \
  \ android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\">\n    <Button\n\
  \        text=\"@string/button_string\"\n        android:layout_width=\"wrap_content\"\
  \n        android:layout_height=\"wrap_content\"\n        android:id=\"@+id/button\"\
  \n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n    <TextView\n        android:text=\"My Text\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n\n\n\n\n```xml\n          android:layout_width=\"wrap_content\"\n       \
  \   android:layout_height=\"wrap_content\"\n          android:id=\"@+id/textView\"\
  \ />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n再次，新添加的 `TextView`\
  \ 缺少约束将导致它在运行时出现在布局的左上角。以下修改添加了与父布局连接的相对约束，以便使组件在水平方向居中，同时添加了一个将 `TextView` 底部连接到按钮顶部的约束：\n\
  \n```xml\n<TextView\n    android:text=\"My Text\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/textView\"\n\
  \    android:layout_marginTop=\"8dp\"\n    android:layout_marginBottom=\"8dp\"\n\
  \    app:layout_constraintBottom_toTopOf=\"@+id/button\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n此外，请注意 `Button` 和 `TextView` 视图声明了多个属性。这两个视图都被分配了 ID，并配置为显示由名为\
  \ `button_string` 和 `text_string` 的字符串资源表示的字符串。此外，两个对象都声明了 `wrap_content` 高和宽属性，以便它们的大小能够适应内容（在本情况下，即字符串资源值引用的文本）。\n\
  \n在设计模式下的 `Layout Editor` 预览面板中查看，上述布局将如图 22-1 所示所示：\n\n![](img/as_manual_xml_ui.jpg)\n\
  \n图 22-1\n\n## 22.2 手动 XML 与视觉化布局设计\n\n手动编写 XML 还是使用设计模式下的 `Layout Editor` 工具取决于个人喜好。然而，使用设计模式具有优势。\n\
  \n首先，设计模式通常会更快，因为避免了输入 XML 代码的需要。此外，设计模式避免了学习 `Android SDK` 视图类各种属性值的复杂之处。不需要不断查阅\
  \ Android 文档来查找正确的关键字和值，大多数属性可以通过参考 `Attributes` 面板找到。\n\n抛开设计模式的所有优势不谈，重要的是要记住用户界面设计的这两种方法绝不是互斥的。作为应用程序开发人员，你可能会在设计模式下创建用户界面，同时通过直接编辑生成的\
  \ XML 资源对设计进行微调和布局调整。界面设计的两种视图在 `Android Studio` 环境中并排显示，使得在 XML 和视觉布局之间进行无缝工作变得简单。\n\
  \n### 22.3 总结\n\n`Android Studio Layout Editor` 工具为设计用户界面提供了一种视觉上直观的方法。通过使用拖放范式结合一组属性编辑器，该工具为应用程序开发人员提供了巨大的生产力优势。\n\
  \n用户界面设计也可以通过手动编写 XML 布局资源文件来实现，其格式良好且易于理解。\n\n`Layout Editor` 工具生成 XML 资源文件的事实意味着，这两种界面设计方法可以结合起来，为用户界面开发提供一种“兼顾优点的”方法。\n\
  \n## 23. 使用约束集管理约束\n\n到本书为止，所有的用户界面设计任务都是使用 `Android Studio Layout Editor` 工具完成的，无论是使用文本模式还是设计模式。编写\
  \ XML 资源文件或或使用 `Android Studio Layout Editor` 的替代方案是编写 Java 代码来直接创建、配置和操作构成 Android\
  \ `activity` 用户界面的视图对象。本章将在描述编写 Java 代码创建用户界面的优缺点之前，将探索视图属性以及布局约束的创建和管理等关键概念。\n\n\
  在下一章中，将创建并使用一个示例项目，以演示这种方法创建 Android 用户界面涉及的一些典型步骤。\n\n### 23.1 Java 代码与 XML 布局文件\n\
  \n使用 XML 资源文件来设计用户界面比编写 Java 代码具有许多优势。事实上，Google 在 Android 文档中耗费了大量精力来赞扬 XML 资源优于\
  \ Java 代码的优点。正如上一章所讨论的，XML 方法的一个关键优势是使用 `Android Studio Layout Editor` 工具，它可以生成\
  \ XML 资源。第二个优势是，一旦创建了应用程序，就可以通过修改 XML 文件来对用户界面屏幕进行进行更改，从而避免重新编译应用程序。此外，即使是手动编写 XML\
  \ 布局，也可以使用 `Android Studio Layout Editor` 工具的预览功能获取用户界面外观的即时反馈。为了测试 Java 创建的用户界面的外观，开发者不可避免地将循环编写代码、编译和测试，以完成设计工作。\n\
  \n关于 Java 编码方法创建布局的优势，Java 相比 XML 资源文件的最显著优势是在处理动态用户界面时发挥作用。XML 资源文件在定义静态布局时本质上最有用，这些布局不太从一次\
  \ activity 的调用到下一次发生显著变化。另一方面，Java 代码非常适合在运行时动态创建用户界面。当用户界面可能受外部因素影响每次执行 activity\
  \ 时显示得不同时，这特别有用。\n\n当必须在 activity 运行时实时对基于 XML 的静态布局进行动态更改时，在 Java 代码中操作用户界面组件的知识也很有用。\n\
  \n最后，一些开发者倾向于编写 Java 代码而不是使用布局工具和 XML，无论后者提供了哪些优势。\n\n### 23.2 创建视图\n\n正如之前提到的，`Android\
  \ SDK` 包含一个类工具箱以满足大多数基础用户界面设计需求。在 Java 中创建视图是实例化这些类的问题，并作为参数传递与该视图关联的 activity 引用。\n\
  \n第一个视图（通常是一个可以添加子视图的容器视图）通过调用 activity 的 `setContentView()` 方法显示给用户。额外的视图可以通过调用对象的\
  \ `addView()` 方法添加到根视图中。\n\n当使用 Java 代码操作位于 XML 布局资源文件视图时，需要获取视图的 ID。对于在 Java 中创建的视图，规则同样适用。因此，对于任何后续\
  \ Java 代码需要某些类型访问的视图，都需要分配一个 ID。这是通过调用视图对象的 `setId()` 方法实现的。在随后的代码中，可以通过对象的 `getId()`\
  \ 方法获取视图的 ID。\n\n### 23.3 视图属性\n\n\n\n\n\n每个视图类（view class）都有一系列属性。这些属性设置直接作用在视图实例上，通常定义了视图对象的外观或行为。属性的示例包括显示在\
  \ `Button` 对象上的文本或 `ConstraintLayout` 视图的背景颜色。Android SDK 中的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以在 Java 代码中调用该方法将按钮上显示的文本设置为特定的字符串值。另一方面，`ConstraintLayout`\
  \ 对象的背景颜色可以通过调用对象的 `setBackground()` 方法来设置。\n\n### 23.4 约束集 (Constraint Sets)\n\n\
  虽然属性设置是视图内部的并决定了视图的外观和行为，但约束集（constraint sets）控制了视图相对于父视图和其他兄弟视图的显示方式。每个 `ConstraintLayout`\
  \ 实例都关联一组约束，定义了其子视图的定位和约束方式。\n\n在 Java 代码中处理约束集的关键是 `ConstraintSet` 类。该类包含一系列方法，允许执行创建、配置和将约束应用到\
  \ `ConstraintLayout` 实例等任务。此外，`ConstraintLayout` 实例的当前约束可以复制到 `ConstraintSet` 对象中，并应用到其他布局（可以进行修改）。\n\
  \n`ConstraintSet` 实例的创建就像创建任何其他 Java 对象一样：\n\n```java\nConstraintSet set = new ConstraintSet();\n\
  ```\n\n一旦创建了约束集，就可以在该实例上调用方法来执行广泛的任务。\n\n### 23.4.1 建立连接\n\n`ConstraintSet` 类的 `connect()`\
  \ 方法用于建立视图之间的约束连接。以下代码配置了一个约束集，其中 `Button` 视图的左侧连接到 `EditText` 视图的右侧，并留有 70dp 的间距：\n\
  \n```java\nset.connect(button1.getId(), ConstraintSet.LEFT,\n              editText1.getId(),\
  \ ConstraintSet.RIGHT, 70);\n```\n\n### 23.4.2 将约束应用于布局\n\n一旦配置了约束集，必须将其应用到 `ConstraintLayout`\
  \ 实例才能生效。通过调用 `applyTo()` 方法应用约束集，并传递应用设置的布局对象的引用：\n\n```java\nset.applyTo(myLayout);\n\
  ```\n\n### 23.4.3 父布局约束连接\n\n子视图与其父 `ConstraintLayout` 之间的连接也可以通过引用 `ConstraintSet.PARENT_ID`\
  \ 常量建立。在下面的示例中，约束集被配置为将 `Button` 视图的顶部连接到父布局的顶部，并留有 100dp 的间距：\n\n```java\nset.connect(button1.getId(),\
  \ ConstraintSet.TOP,\n              ConstraintSet.PARENT_ID, ConstraintSet.TOP,\
  \ 100);\n```\n\n### 23.4.4 尺寸约束\n\n有多种方法可以控制视图的尺寸行为。例如，以下代码将 `Button` 视图的水平尺寸设置为\
  \ `wrap_content`，并将 `ImageView` 实例的垂直尺寸设置为最大 250dp：\n\n```java\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainMaxHeight(imageView1.getId(), 250);\n\
  ```\n\n### 23.4.5 约束偏移 (Constraint Bias)\n\n正如“Android Studio 中使用 ConstraintLayout\
  \ 的指南” 章节中所述，当一个视图具有相反的约束时，它将沿约束轴居中显示（即水平或垂直方向）。这种居中位置可以通过在特定的约束轴上应用偏移来调整。在使用 Android\
  \ Studio 布局编辑器时，这是通过 Attributes 工具窗口中的控件来实现的。然而，在处理约束集时，可以使用 `setHorizontalBias()`\
  \ 和 `setVerticalBias()` 方法添加偏移，引用视图 ID 并将偏移作为 0 到 1 之间的浮点数值。\n\n例如，以下代码在应用 25% 的水平偏移之前，先将\
  \ `Button` 的左侧和右侧约束到父布局相应的侧边：\n\n```java\nset.connect(button1.getId(), ConstraintSet.LEFT,\n\
  \              ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\nset.connect(button1.getId(),\
  \ ConstraintSet.RIGHT,\n              ConstraintSet.PARENT_ID, ConstraintSet.RIGHT,\
  \ 0);\nset.setHorizontalBias(button1.getId(), 0.25f);\n```\n\n### 23.4.6 对齐约束\n\n\
  也可以使用约束集来应用对齐。Android Studio 布局编辑器中提供的完整对齐选项也可以通过约束集使用 `centerVertically()` 和 `centerHorizontally()`\
  \ 方法进行配置，这两个方法都会根据配置的对齐方式接受不同的参数。此外，`center()` 方法可以将视图在两个视图之间居中。\n\n在下面的代码中，`button2`\
  \ 的位置设置使其与 `button1` 在水平上对齐：\n\n```java\nset.centerHorizontally(button2.getId(),\
  \ button1.getId());\n```\n\n### 23.4.7 复制和应用约束集\n\n可以使用 `clone()` 方法将 `ConstraintLayout`\
  \ 实例的当前约束集复制到 `ConstraintSet` 对象中。例如，以下代码将名为 `myLayout` 的 `ConstraintLayout` 实例的设置复制到约束集中：\n\
  \n```java\nset.clone(myLayout);\n```\n\n复制后，可以将约束集应用到另一个布局，或者像下面的示例所示，在应用到第二个布局之前进行修改：\n\
  \n```java\nConstraintSet set = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(layout);\n```\n\n### 23.4.8 约束链 (Constraint\
  \ Chains)\n\n在约束集中还可以使用 `createHorizontalChain()` 和 `createVerticalChain()` 方法创建垂直和水平链。使用这些方法的语法如下：\n\
  \n`createHorizontalChain(int leftId, int leftSide, int rightId, int rightSide, int[]\
  \ chainIds, float[] weights, int style)`\n\n根据上述语法，下面的示例创建了一个从 `button1` 开始并到 `button4`\
  \ 结束的水平链。这些视图之间是 `button2` 和 `button3`，权重设置为零：\n\n```java\nint[] chainViews = {button2.getId(),\
  \ button3.getId()};\nfloat[] chainWeights = {0, 0};\nset.createHorizontalChain(button1.getId(),\
  \ ConstraintSet.LEFT,\n                          button4.getId(), ConstraintSet.RIGHT,\n\
  \                          chainViews, chainWeights, ConstraintSet.SPREAD);\n```\n\
  \n可以通过 `removeFromHorizontalChain()` 或 `removeFromVerticalChain()` 方法传递要移除的视图 ID\
  \ 将从链中移除。可以使用 `addToHorizontalChain()` 或 `addToVerticalChain()` 方法将视图添加到现有链中。在这两种情况下，方法都接收要插入新视图的两个视图\
  \ ID 作为参数：\n\n```java\nset.addToHorizontalChain(newViewId, leftViewId, rightViewId);\n\
  ```\n\n### 23.4.9 引导线 (Guidelines)\n\n使用 `create()` 方法将引导添加到约束集中，并使用 `setGuidelineBegin()`、`setGuidelineEnd()`\
  \ 或 `setGuidelinePercent()` 方法进行定位。在下面的代码中，创建一个垂直引导线并位于布局宽度的 50% 处。然后将 `button`\
  \ 视图的左侧连接到该引导线，不留间距：\n\n```java\nset.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDELINE);\n\
  set.setGuidelinePercent(R.id.myGuideline, 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT,\n\
  \              R.id.myGuideline, ConstraintSet.RIGHT, 0);\nset.applyTo(layout);\n\
  ```\n\n### 23.4.10 移除约束\n\n可以使用 `clear()` 方法从约束集的视图中移除约束，传递视图 ID 和要移除约束的锚点作为参数：\n\
  \n```java\nset.clear(button.getId(), ConstraintSet.LEFT);\n```\n\n\n\n\n同样，可以通过在\
  \ `clear()` 方法调用中仅引用该视图，一次性移除该视图的所有约束：\n\n```\nset.clear(button.getId());\n```\n\
  \n### 23.4.11 缩放\n\n布局内视图的缩放可以使用 `ConstraintSet` 的 `setScaleX()` 和 `setScaleY()`\
  \ 方法进行调整，这些方法的参数是执行操作的视图以及一个表示缩放的浮点值。在下面的代码中，按钮对象被缩放为原始宽度的两倍和高度的高度：\n\n```java\n\
  set.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(), 0.5f);\n```\n\
  \n### 23.4.12 旋转\n\n可以使用 `setRotationX()` 和 `setRotationY()` 方法分别沿 X 轴或 Y 轴旋转视图，这两个方法都必须传递要旋转视图的\
  \ ID 和表示旋转角度的浮点值。旋转发生的中心点可以通过调用 `setTransformPivot()`、`setTransformPivotX()` 和 `setTransformPivotY()`\
  \ 方法来定义。以下代码使用位于点 (500, 500) 的中心点将按钮视图沿 Y 轴旋转 30 度：\n\n```java\nset.setTransformPivot(button.getId(),\
  \ 500, 500);\nset.setRotationY(button.getId(), 30);\nset.applyTo(layout);\n```\n\
  \n在涵盖了从 Java 代码创建约束集的用户界面理论后，下一章将通过创建一个示例应用程序来将这些理论付诸实践。有关 `ConstraintSet` 类的更多细节，请参阅以下\
  \ URL 中的参考指南：\n\n[`developer.android.com/reference/androidx/constraintlayout/widget/ConstraintSet`](https://developer.android.com/reference/androidx/constraintlayout/widget/ConstraintSet)\n\
  \n### 23.5 总结\n\n作为编写 XML 布局资源文件或使用 Android Studio 布局编辑器工具的替代方案，Android 用户界面也可以\
  \ Java 代码中动态创建。\n\n在 Java 代码中创建布局包括创建视图类的实例，并在这些对象上设置属性以定义所需的显示和行为。\n\n视图相对于其 `ConstraintLayout`\
  \ 父视图以及任何兄弟视图的定位和大小是通过约束集定义的。约束集由 `ConstraintSet` 类的实例表示，一旦创建，就可以使用广泛的方法调用进行配置，以执行诸如建立约束连接、控制视图大小行为和创建链等任务。\n\
  \n在本章涵盖了 `ConstraintSet` 类的基础知识后，下一章将通过一个教程将这些功能应用于实际用途。\n\n# 24. Android ConstraintSet\
  \ 教程\n\n上一章介绍了在 Java 代码中使用中使用 `ConstraintLayout` 和 `ConstraintSet` 类创建和修改用户界面布局的基本概念。本章将通过创建一个完全使用\
  \ Java 代码创建且不使用 Android Studio 布局编辑器工具的示例布局，将这些概念付诸实践。\n\n## 24.1 在 Android Studio\
  \ 中创建示例项目\n\n启动 Android Studio 并在欢迎界面选择“New Project”选项，在出现的新项目对话框中，选择“Empty Views\
  \ Activity”模板，然后点击“Next”按钮。\n\n在“Name”字段中输入 `JavaLayout`，并指定 `com.ebookfrenzy.javalayout`\
  \ 为包名。在点击“Finish”按钮之前，将 Minimum API level 设置更改为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单设置为 Java。\n\n项目创建后，`MainActivity.java` 文件将自动加载到编辑面板中。正如我们预期的，Android Studio\
  \ 创建了一个模板 Activity 并重写了 `onCreate()` 方法，为添加 Java 代码以创建用户界面提供了一个理想位置。\n\n## 24.2\
  \ 向 Activity 添加视图\n\n`onCreate()` 方法目前设计为使用资源布局文件来构建用户界面。因此，首先从该方法中删除此行：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n下一次修改是向 Activity 添加一个包含单个\
  \ `Button` 视图子元素的 `ConstraintLayout` 对象。这涉及创建 `ConstraintLayout` 和 `Button` 类的新实例。然后需要将\
  \ `Button` 视图作为子视图添加到 `ConstraintLayout` 视图中，而后者通过调用 Activity 实例的 `setContentView()`\
  \ 方法进行显示：\n\n```java\npackage com.ebookfrenzy.javalayout;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.widget.Button;\nimport android.widget.EditText;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        configureLayout();\n\
  \    }\n\n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n## 24.3 设置视图属性\n\n对于这次练习，我们需要\
  \ `ConstraintLayout` 视图的背景为蓝色，并且 `Button` 视图显示为“Press Me”的文本。这些任务可以通过如下文片段所示，在 Java\
  \ 代码中为视图设置属性来实现。为了让按钮上的文本能够轻松翻译成其他语言，它将作为字符串资源添加。在 Project 窗口中，找到 `app` -> `values`\
  \ -> `strings.xml` 文件并修改它以为“Press Me”字符串添加资源值：\n\n```xml\n<resources>\n    <string\
  \ name=\"app_name\">JavaLayout</string>\n    <string name=\"press_me\">Press Me</string>\n\
  </resources>\n```\n\n虽然这是处理代码中直接引用字符串的推荐方式，但许多后续代码示例将直接在代码中输入字符串以避免重复此步骤。一旦字符串被存储为资源，就可以如下方式从代码内部访问它：`getString(R.string.press_me);`。\n\
  \n创建字符串资源后，在 `configureLayout()` 方法中添加代码设置按钮文本和颜色属性：\n\n```java\nimport android.graphics.Color;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        setContentView(myLayout);\n    }\n\
  }\n```\n\n当应用程序编译并运行时，布局将反映属性设置，使得布局呈现蓝色背景，按钮在黄色背景上显示分配的文本。\n\n## 24.4 创建视图 ID\n\
  \n\n\n\n当布局完成后，它将包含一个 `Button` 和一个 `EditText` 视图。在 `ConstraintSet` 类的方法中引用这些视图之前，必须为它们分配唯一的视图\
  \ ID。此过程的第一步是创建一个包含这些 ID 值的新资源文件。\n\n右键点击 app -> `res` -> `values` 文件夹，选择 `New`\
  \ -> `Values Resource File` 菜单选项，并将新资源文件命名为 `id.xml`。创建资源文件后，对其进行编辑如下如下：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <item name=\"myButton\"\
  \ type=\"id\" />\n    <item name=\"myEditText\" type=\"id\" />\n</resources>\n```\n\
  \n在教程的这一阶段，仅创建了 `Button`，因此编辑 `configureLayout()` 方法将相应的 ID 分配给对象：\n\n```java\n\
  private void configureLayout() {\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  }\n```\n\n## 24.5 配置约束集\n\n在没有约束的情况下，`ConstraintLayout` 视图将 `Button` 视图位于屏幕的左上角。为了指示布局视图将按钮放置在不同的位置（在这种情况下是水平和垂直居中），有必要创建一个\
  \ `ConstraintSet` 实例，使用适当设置对其进行初始化并将其应用于父布局。\n\n对于此示例，需要配置按钮，使其宽度和高度限制为其显示的文本大小，并将视图在父布局中居中。再次编辑\
  \ `configureLayout()` 方法以进行这些更改：\n\n```java\nimport androidx.constraintlayout.widget.ConstraintSet;\n\
  \nprivate void configureLayout() {\n    Button myButton = new Button(this);\n  \
  \  myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    setContentView(myLayout);\n    ConstraintSet set = new ConstraintSet();\n \
  \   set.constrainHeight(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n    set.constrainWidth(myButton.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\n    set.connect(myButton.getId(), ConstraintSet.START,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\n   \
  \ set.applyTo(myLayout);\n}\n```\n\n配置好初始约束后，编译并运行应用程序，验证 `Button` 视图现在是否出现在布局中心：\n\
  \n![](img/Image2444.jpg)\n图 24-2\n\n## 24.6 添加 EditText 视图\n\n下一个要添加到布局的项是 `EditText`\
  \ 视图。第一步是创建 `EditText` 对象，分配在 `id.xml` 资源文件中声明的 ID，并将其添加到布局中。实现这些步骤的代码更改现在需要对 `configureLayout()`\
  \ 方法进行如下：\n\n```java\nprivate void configureLayout() {\n    Button myButton = new\
  \ Button(this);\n    myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    EditText myEditText = new EditText(this);\n\
  \    myEditText.setId(R.id.myEditText);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    myLayout.addView(myEditText);\n    setContentView(myLayout);\n}\n```\n\n`EditText`\
  \ 小部件的大小应根据显示的内容调整，在布局中水平居中，并位于现有 `Button` 上方 70dp 处。在 `configureLayout()` 方法中添加代码，使其内容如下：\n\
  \n```java\nset.connect(myButton.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.START, 0);\nset.connect(myButton.getId(), ConstraintSet.END, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myButton.getId(), ConstraintSet.TOP, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.TOP, 0);\nset.connect(myButton.getId(), ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.BOTTOM, 0);\nset.constrainHeight(myEditText.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.constrainWidth(myEditText.getId(), ConstraintSet.WRAP_CONTENT);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.BOTTOM, myButton.getId(), ConstraintSet.TOP, 70);\nset.applyTo(myLayout);\n\
  ```\n\n测试应用程序应显示 `EditText` 位于按钮上方，间距为 70dp。\n\n## 24.7 将密度无关像素 (dp) 转换为像素 (px)\n\
  \n此练习的下一个任务是将 `EditText` 视图的宽度设置为 200dp。正如在 Android Studio 布局编辑器约束布局章节概述的，在用户界面布局中设置大小和位置时，最好使用\
  \ `dp` 而不是 `px`，以考虑屏幕密度。因此，为了将 `EditText` 视图的宽度设置为 200dp，需要向类中添加以下代码：\n\n```java\n\
  package com.ebookrenzy.javalayout;\n\nimport android.content.res.Resources;\nimport\
  \ android.util.TypedValue;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private int convertToPx(int value) {\n        Resources r = getResources();\n\
  \        return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value,\
  \ r.getDisplayMetrics());\n    }\n\n    private void configureLayout() {\n     \
  \   Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        myButton.setId(R.id.myButton);\n\
  \        EditText myEditText = new EditText(this);\n        myEditText.setId(R.id.myEditText);\n\
  \        int px = convertToPx(200);\n        myEditText.setWidth(px);\n    }\n}\n\
  ```\n\n再次编译并运行应用程序，注意 `EditText` 视图的宽度已经发生了变化，如图 24-3（ConstraintSet.xhtml__idAnchor608）所示：\n\
  \n![](img/Image2451.jpg)\n图 24-3\n\n### 24.8 总结\n\n在本章创建的示例 Activity（背景颜色和视图类型除外）与早之前在\
  \ Android Studio 中手动设计 XML 布局章节中创建的界面相似。尽管如此，本章应该让大家意识到 Android Studio 布局编辑器工具和\
  \ XML 资源在很大程度上保护了开发者，免受复杂的 Android 用户界面布局。\n\n然而，在某些情况下，使用 Java 创建用户界面是合理的。例如，这种方法在创建动态用户界面布局时最有用。\n\
  \n## 25. Android Studio 中使用 Apply Changes 的指南\n\n\n\n\n\n既然已经涵盖了使用 Android Studio\
  \ 进行 Android 开发的一些基本概念，现在是介绍 Android Studio 的“应用更改”（Apply Changes）功能的好时了。正如所有经验丰富的开发者所知，等待应用编译和运行的每一秒钟都应该用于编写和优化代码。\n\
  \n## 25.1 介绍应用更改\n\n在 Android Studio 的早期版本中，每次需要测试项目的更改时，Android Studio 都会重新编译代码、将其转换为\
  \ Dex 格式、生成 APK 包文件，并将其安装到设备或模拟器上。完成这些步骤后，应用才会启动并准备好测试。即使在快速的开发系统上，这个过程也需要相当的时间。对于大型应用程序，此过程花费一分钟或更多并不罕见。\n\
  \n相比之下，“应用更改”允许项目中的许多代码和资源更改在应用于设备或模拟器会话运行时，几乎瞬间反映到应用中。\n\n例如，考虑一个正在 Android Studio\
  \ 中开发并已在设备或模拟器上启动的应用。如果对资源设置或方法内的代码进行了更改，“应用更改”将更新后的代码和资源推送到运行中的应用，并动态地“交换”更改。随后，更改将反映在运行中的应用中，而无需构建、部署和重新启动整个应用。这通常允许在无需“应用更改”的情况下在极短时间内测试更改。\n\
  \n## 25.2 理解应用更改选项\n\nAndroid Studio 提供了三种对运行应用应用更改的选项，形式分别为运行应用（Run App）、应用更改（Apply\
  \ Changes）以及重启 Activity 并应用代码更改（Restart Activity and Apply Code Changes）。这些选项可以总结如下：\n\
  \n*   **运行应用** - 停止当前运行的应用并重启它。如果自上次启动以来项目未发生任何更改，此选项将重启应用。相反，如果项目发生了更改，Android\
  \ Studio 将在启动应用之前重新构建并将应用安装到设备或模拟器上。\n*   **应用代码更改** - 当对项目的唯一更改涉及对现有方法体的修改，或者添加了新类或新方法时，可以使用此选项。选中后，更改将应用到运行中的应用，而无需重启应用或当前运行的\
  \ Activity。然而，当对任何项目资源（如布局文件）进行更改时无法使用此模式。其他限制还包括删除方法、更改方法签名、重命名类以及其他结构代码更改。如果对项目清单（Manifest）进行了更改，也无法使用此选项。\n\
  *   **应用更改并重启 Activity** - 选中后，此模式将动态应用项目内对任何代码或资源的更改，并在不重新安装或重启应用的情况下重启 Activity。与“应用代码更改”选项不同，当对项目代码和资源进行更改时可以使用它。然而，涉及某些结构代码更改和清单修改的限制仍然适用。\n\
  \n## 25.3 使用应用更改\n\n当项目已加载到 Android Studio 但尚未在设备或模拟器上运行时，可以使用工具栏上的运行（在图 25-1 中标记为\
  \ A）或调试（B）按钮按 usual 启动：\n\n```\n![](img/as_run_debug_buttons.jpg)\n```\n图 25-1\n\
  \n在应用启动并运行后，将一个停止按钮（在图 25-2 中标记为 A），并且“应用更改并重启 Activity”（B）和“应用代码更改”（C）按钮将可用：\n\n\
  ```\n![](img/as_run_apply_changes.jpg)\n```\n图 25-2\n\n如果在选择其中一个“应用更改”按钮后无法应用更改，Android\
  \ Studio 将显示一条指示失败的消息和解释。例如，图 25-3 显示了在对资源文件进行更改后选择“应用代码更改”选项时由 Android Studio 显示的消息：\n\
  \n```\n![](img/as_instant_run_restart_resources.jpg)\n```\n图 25-3\n\n在这种情况下，解决方案是使用“应用更改并重启\
  \ Activity”选项（该选项提供了一个链接）。同样，当尝试应用涉及删除方法的更改时，将出现以下消息：\n\n```\n![](img/as_instant_run_restart_method_removed.jpg)\n\
  ```\n图 25-4\n\n在这种情况下，唯一的选项是点击“运行应用”按钮以重新安装并重启应用。作为手动选择正确选项的备选方案，可以配置 Android Studio\
  \ 以时自动回退到执行“运行应用”操作。\n\n## 25.4 配置应用更改回退设置\n\n“应用更改”的回退设置位于 Android Studio 设置（Settings）对话框中。在设置对话框中，在左侧面板中选择\
  \ `Build, Execution, Deployment`（构建、执行、部署），然后选择 `Deployment`（部署），如图 25-5 所示：\n\n\
  ```\n![](img/as_instant_run_settings.jpg)\n```\n图 25-5\n\n启用所需的选项后，点击 Apply（应用），然后点击\
  \ OK 按钮提交更改并关闭对话框。启用这些默认设置后，Android Studio 将需要自动重新安装并重启应用。\n\n## 25.5 应用更改教程\n\n\
  启动 Android Studio，从欢迎界面选择“新建项目”（New Project）选项，并在生成的新项目对话框中点击“下一步”（Next）按钮之前，选择“Basic\
  \ Views Activity”模板。\n\n在 `Name`（名称）字段中输入 `ApplyChanges`，并指定包名为 `com.ebookrenzy.applychanges`。在点击完成（Finish）按钮之前，将`Minimum\
  \ API level`（最低 API 级别）改为`API 26: Android 8.0 (Oreo)`并将`Language`（语言）菜单改为 Java。\n\
  \n## 25.6 使用应用更改\n\n通过点击运行按钮并选择模拟器或物理设备作为运行目标开始。在点击运行按钮后，跟踪示例应用出现的时间。\n\n运行后，“应用更改”按钮应已启用，表明某些项目更改可以在无需重新安装和重启应用的情况下应用。为了演示，点击操作按钮（屏幕右下角显示信封图标的按钮）。注意出现\
  \ `Snackbar` 实例，显示文本为“Replace with your own action”，如图 25-6 所示：\n\n```\n![](img/as_apply_changes_snackbar.jpg)\n\
  ```\n图 25-6\n\n编辑 `MainActivity.java` 文件，找到 `onCreate` 方法并修改操作代码，以便选择操作按钮时显示不同的消息：\n\
  \n```\nbinding.fab.setOnClickListener(new View.OnClickListener() {\n    @Override\n\
  \    public void onClick(View view) {\n        Snackbar.make(view, \"Apply Changes\
  \ is Amazing!\", Snackbar.LENGTH_LONG)\n            .setAction(\"Action\", null).show();\n\
  \    }\n});\n```\n\n实现代码更改后，点击“应用代码更改”按钮，注意几秒钟内出现消息显示应用已更新。点击操作按钮，注意新消息现在显示在 Snackbar\
  \ 中。\n\n## 25.7 使用应用更改并重启 Activity\n\n任何资源更改都要求使用“应用更改并重启 Activity”选项。在 Android\
  \ Studio 中，选择 `app -> res -> layout -> fragment_first.xml` 布局文件。在布局编辑器工具的 Design\
  \ 模式下，选择默认的 `TextView` 组件，并在属性工具窗口将 `text` 属性更改为“Hello Android”。\n\n\n\n\n\n在点击“应用代码更改”（Apply\
  \ Code Changes）按钮之前，请确保上方“配置应用更改回退设置”中列出的回退选项已关闭。请注意，请求失败是因为此更改涉及项目资源。点击“应用更改并重启”（Apply\
  \ Changes and Restart）按钮，验证活动已重启并在 `TextView` 组件上显示新文本。\n\n### 25.8 使用运行应用\n\n如前所述，移除方法需要完全重新安装并重启正在运行的应用程序。要体验这一点，请编辑\
  \ `MainActivity.java` 文件，并在 `onCreate` 方法之后添加如下新方法：\n\n```java\npublic void demoMethod()\
  \ {\n}\n```\n\n使用“应用代码更改”按钮并确认更改在不重新安装应用的情况下已应用。\n\n接下来，删除该新方法并验证点击两个“应用更改”按钮中的任意一个会导致请求失败。在此类更改后运行应用的唯一方法是点击“运行应用”（Run\
  \ App）按钮。\n\n### 25.9 总结\n\n应用更改是 Android Studio 的一项功能，旨在显著加速应用开发时的代码、构建和运行周期。在许多情况下，应用更改功能可以在不重新安装或重启应用的情况下将更新推送到运行中的应用程序。根据应用于项目的修改的性质，应用更改提供了几种不同层次的支持。\n\
  \n## 26. Android 事件处理概述与示例\n\n之前的章节中已经涵盖了许多关于 Android 应用用户界面设计的内容。然而，一个尚未涵盖的领域涉及用户与用户界面的交互如何触发底层活动执行任务。换句话说，从之前的章节中，我们知道如何创建一个包含按钮视图的用户界面，但不知道当用户触摸它时如何让应用程序内部发生某些事情。\n\
  \n因此，本章的主要目标是提供 Android 应用事件处理的概述，并结合一个基于 Android Studio 的示例项目。\n\n### 26.1 理解 Android\
  \ 事件\n\nAndroid 事件可以有多种形式，但通常是响应外部动作而生成的。常见的事件形式（特别是对于平板和智能手机等设备）涉及与触摸屏的某种交互。此类事件属于输入事件范畴。\n\
  \nAndroid 框架维护着一个事件队列，事件在发生时被放入队列。然后，事件按照先进先出（FIFO）的从队列中移除。对于输入事件（例如触摸屏幕），事件将传递给位于屏幕触摸位置的视图。除了事件通知外，视图还会接收到有关事件性质的一系列信息（取决于事件类型），例如用户手指与屏幕之间接触点的坐标。\n\
  \n为了处理已传递的事件，视图必须就绪一个事件监听器。所有用户界面组件都派生自 `View` 类包含了一系列事件监听器接口，每个接口都包含一个回调方法的抽象声明。为了能够响应特定类型的事件，视图必须注册相应的事件监听器并实现相应的回调。例如，如果按钮要响应点击事件（等同于用户触摸并松开按钮视图，就像点击物理按钮一样），它必须同时注册\
  \ `View.OnClickListener` 事件监听器（通过调用目标视图的 `setOnClickListener()` 方法）并实现相应的 `onClick()`\
  \ 回调方法。如果在按钮视图位置的屏幕上检测到“点击”事件，当该事件从事件队列中移除时，Android 框架将调用该视图的 `onClick()` 方法。当然，在\
  \ `onClick()` 回调方法的实现中，应该执行任何响应按钮点击而进行调用的任务或其他方法。\n\n### 26.2 使用 android:onClick\
  \ 资源\n\n在更详细地探索事件监听器之前，值得注意的是，当只需要在用户“点击”用户界面上的按钮视图时调用回调方法，可以使用一种快捷方法。考虑一个包含名为 `button1`\
  \ 的按钮视图的用户界面布局，其要求是当用户触摸按钮时，调用活动类中声明的 `buttonClick()` 方法。实现此行为只需要编写 `buttonClick()`\
  \ 方法（该方法的参数是触发点击事件的视图的引用），并在 XML 文件中的按钮视图声明中添加一行。例如：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:onClick=\"buttonClick\"\n    android:text=\"Click me\"\
  \ />\n```\n\n这提供了一种捕获点击事件的简单方法。然而，它没有提供事件处理程序提供的系列选项，而这是本章其余部分的主题。正如后续章节所述，`onClick`\
  \ 属性在涉及 fragment 的布局中也有局限性。在 Android Studio 布局编辑器中工作时，当设备屏幕布局中选择了合适的视图类型时，可以在属性面板（Attributes\
  \ panel）中找到并配置 `onClick` 属性。\n\n#### 26.3 事件监听器与回调方法\n\n在本章稍后概述的示例活动中，将详细介绍注册事件监听器和实现回调方法的步骤。在在此之前，值得花一些时间概述\
  \ Android 框架中提供的事件监听器以及与每个监听器相关的回调方法。\n\n- `onClickListener`: 用于检测点击式事件，即用户触摸然后释放由视图占据的设备区域。对应\
  \ `onClick()` 回调方法，该方法将接收事件的视图作为参数传递。\n- `onLongClickListener`: 用于检测用户在视图上保持触摸一段时间。对应\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数传递。\n- `onTouchListener`: 用于检测与触摸屏幕的任何接触，包括单次或多次触摸以及手势动作。对应\
  \ `onTouch()` 回调的主题将在 Android 触摸和多点事件处理章节中进行详细介绍。回调方法将接收事件的视图和 `MotionEvent` 对象作为参数传递。\n\
  - `onCreateContextMenuListener`: 监听由于长按创建上下文菜单。对应 `onCreateContextMenu()` 回调方法。回调接收菜单、接收事件的视图和一个菜单上下文对象。\n\
  - `onFocusChangeListener`: 检测由于与轨迹球或导航键交互导致焦点移出当前视图。对应 `onFocusChange()` 回调方法，该方法将接收事件的视图和一个布尔值，以指示是否获得或丢失焦点。\n\
  - `onKeyListener`: 用于检测当视图拥有焦点时按上的设备键。对应 `onKey()` 回调方法。它将接收事件的视图、按下的物理键的 `KeyCode`\
  \ 以及一个 `KeyEvent` 对象作为参数传递。\n\n### 26.4 事件处理示例\n\n\n\n\n在本章的剩余部分中，我们将创建一个 `Android\
  \ Studio` 项目，用于演示实现事件监听器和相应的回调方法，以检测用户何时点击了按钮。回调方法中的代码将更新文本视图（text view），以指示事件已处理。\n\
  \n从欢迎界面选择 `New Project` ，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\
  \n在 `Name` 字段中输入 `EventExample` 并指定 `com.ebookfrenzy.eventexample` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为\
  \ `Java`。按照第 11.8 Migrating a Project to View Binding 节概述的步骤，将项目转换为使用 view binding。\n\
  \n### 26.5 设计用户界面\n\n本示例中 `MainActivity` 类的用户界面布局将由一个 `ConstraintLayout`、一个 `Button`\
  \ 和一个 `TextView` 组成，如图图 26-1 所示。\n\n![](img/as_event_example_ui.jpg)\n\n图 26-1\n\
  \n找到并选择 `Android Studio` 创建的 `activity_main.xml` 文件（位于 Project 工具窗口的 `app -> res\
  \ -> layouts` 路径下），并双击将其加载到 `Layout Editor` 工具中。\n\n确保已启用 `Autoconnect`（自动连接），然后从调色板拖入一个\
  \ `Button` 组件，并使其位于布局的水平居中，且位于现有 `TextView` 组件的下方。当位置正确时，将组件释放到该位置，以便 `autoconnect`\
  \ 系统添加相应的约束条件。\n\n选择“Hello World!” `TextView` 组件，并使用 `Attributes` 面板将 `ID` 设置为 `statusText`。重复此步骤将\
  \ `Button` 组件的 `ID` 更改为 `myButton`。\n\n点击布局编辑器工具栏中的 `Infer Constraints`（推断约束）按钮以添加任何缺失的约束。\n\
  \n在选中 `Button` 组件的情况下，使用 `Attributes` 面板将 `text` 属性设置为 `Press Me`。将按钮上的文本字符串提取到名为\
  \ `press_me` 的资源中。\n\n完成界面布局后，下一步是注册事件监听器和回调方法。\n\n### 26.6 事件监听器和回调方法\n\n对于本示例，需要为\
  \ `myButton` 视图注册一个 `onClickListener`。这通过调用按钮视图的 `setOnClickListener()` 方法、传递一个新的\
  \ `OnClickListener` 对象作为参数，并实现 `onClick()` 回调方法来实现。由于此任务只需要在活动创建时执行，因此良好的位置是 `MainActivity`\
  \ 类的 `onCreate()` 方法。\n\n如果 `MainActivity.java` 文件已在编辑器会话中打开，请通过点击编辑器面板中的标签页选择它。或者，在\
  \ Project 工具窗口中导航到 `(app -> kotlin+java -> com.ebookfrenzy.eventexample -> MainActivity)`\
  \ 找到它，并双击将其加载到代码编辑器中。一旦加载，找到模板方法 `onCreate()` 方法并对其进行修改，以获取按钮视图的引用、注册事件监听器并实现 `onClick()`\
  \ 回调方法：\n\n```java\npackage com.ebookfrenzy.eventexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.view.View;\n\nimport android.widget.Button;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        binding.myButton.setOnClickListener(\n\
  \            new Button.OnClickListener() {\n                public void onClick(View\
  \ v) {\n                }\n            }\n        );\n    }\n.\n}\n```\n\n上述代码已经在按钮上注册了事件监听器并实现了\
  \ `onClick()` 方法。然而，如果此时运行应用程序，将没有迹象表明安装在按钮上的事件监听器正在工作，因为目前 `onClick()` 回调方法的体内部尚未实现任何代码。该示例的目标是在点击按钮时在\
  \ `TextView` 上显示一条消息，因此需要进行一些进一步的代码更改：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    binding.myButton.setOnClickListener(\n        new\
  \ Button.OnClickListener() {\n            public void onClick(View v) {\n      \
  \          binding.statusText.setText(\"Button clicked\");\n            }\n    \
  \    }\n    );\n}\n```\n\n### 26.7 消费事件\n\n检测视图上的标准点击（与长按相反）是一个简单的情况。现在示例将扩展以包含长按，长按是在用户点击并按住视图时发生。\n\
  \n考虑上一个节中的 `onClick()` 方法。它被声明为 `void`，因此不向框架返回值。相反，`onClickListener` 需要向 Android\
  \ 框架返回一个 `Boolean`。此返回值的目的是告诉 Android 运行时回调是否消费了该事件。如果回调返回 `true`，框架将丢弃该事件。反之，如果回调返回\
  \ `false`，Android 框架将认为事件仍然有效，并将其传递给同一视图上的下一个监听器。\n\n与许多编程概念一样，通过示例进行演示最佳。第一步是为按钮添加长按的事件监听器和回调方法：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n// ...\n\
  }\n```\n（等等，让我重新格式“消费事件”部分的特定块）：\n\n```java\nbinding.myButton.setOnLongClickListener(new\
  \ Button.OnClickListener() {\n    public boolean onLongClick(View v) {\n       \
  \ binding.statusText.setText(\"Long click\");\n        return true;\n    }\n});\n\
  ```\n\n当检测到长按时，`onLongClick()` 回调方法将在文本视图上显示“Long click”。然而，注意回调方法返回 `true` 值表示它已消费了事件。运行应用程序并按住按钮视图，直到文本视图出现“Long\
  \ click”文本。释放按钮时，文本视图显示“Long click”文本，表明 `onClick` 监听器代码未调用。\n\n接下来，修改代码使 `onLongClickListener`\
  \ 现在返回 `false` 值：\n\n```java\nbutton.setOnLongClickListener(new Button.OnLongClickListener()\
  \ {\n    public boolean onLongClick(View v) {\n        TextView myTextView = findViewById(R.id.myTextView);\n\
  \        myTextView.setText(\"Long button click\");\n        return false;\n   \
  \ }\n});\n```\n\n\n\n\n再次编译并运行应用程序，对按钮进行长按，直到出现长按消息。然而，这次松开按钮时，请注意 `onClick` 监听器也被触发了，且文本变为“Button\
  \ clicked”。这是因为 `onLongClick` 监听器代码返回的 `false` 值指示 Android 框架该事件未被该方法消费，并有权传递给该视图上注册注册的下一个监听器。在这种情况下，运行时确定按钮上的\
  \ `onClickListener` 也对此类类型的事件感兴趣，并随后调用了 `onClick` 监听器代码。\n\n### 26.8 总结\n\n如果用户界面所包含的视图（views）不对用户交互做出任何响应，那么该用户界面的实用价值就很小。Android\
  \ 通过事件监听器和回调方法的概念桥接了用户界面与应用程序后端代码之间的鸿沟。`View` 类定义了一 set 事件监听器，这些监听器可以注册在视图对象上。每个事件监听器都关联着一个回调方法。\n\
  \n当事件在用户界面的视图上发生时，该事件会被放入事件队列，并由 Android 运行时按照先进先出的原则进行处理。如果发生事件的视图注册了与该事件类型匹配的监听器，就会调用相应的回调方法。该代码会在返回之前执行活动\
  \ 所需的任何任务。某些回调方法要求返回一个 `Boolean` 值，以指示该事件需要传递给注册在视图上的其他事件监听器，还是由系统丢弃。\n\n既然已经涵盖了事件处理的基础知识，下一章将探索触摸事件，特别强调对多点触摸的处理。\n\
  \n## 27 Android 触摸和多点触摸事件处理\n\n大多数基于 Android 的设备使用触摸屏作为用户与设备之间的主要接口。上一章介绍了屏幕上的触摸如何转换为运行中的\
  \ Android 应用程序中的动作。然而，触摸事件的处理远不止于对视图对象上的单指点击做出响应。例如，大多数 Android 设备可以同时检测到多个触摸。触摸也不局限于设备显示器上的一点。当用户在屏幕表面滑动一个或多个接触点（contact\
  \ points）时，触摸可以是动态的。\n\n应用程序还可以将触摸解释为手势（gesture）。例如，水平滑动通常用于翻页电子书的页码，或者捏合动作（pinching\
  \ motion）如何对屏幕显示的图像进行放大或缩小。\n\n本章将解释涉及运动的触摸处理，并探索拦截多个并发触摸的概念。识别不同手势的主题将在下一章中介绍。\n\
  \n### 27.1 拦截触摸事件\n\n视图对象可以通过注册 `onTouchListener` 事件监听器并实现相应的 `onTouch()` 回调方法来拦截触摸事件。例如，以下代码确保了名为\
  \ `myLayout` 的 `ConstraintLayout` 视图实例上的任何触摸都会导致调用 `onTouch()` 方法：\n\n```\nbinding.myLayout.setOnTouchListener(\n\
  \    new ConstraintLayout.OnTouchListener() {\n        public boolean onTouch(View\
  \ v, MotionEvent m) {\n            // 在此处执行任务\n            return true;\n      \
  \  }\n    }\n);\n```\n\n如代码示例所示，`onTouch()` 回调要求返回一个 `Boolean` 值，指示 Android 运行时系统该事件应该传递给注册在同一视图上的其他事件监听器，还是丢弃。该方法被传递了触发事件的视图引用和一个类型为\
  \ `MotionEvent` 的对象。\n\n### 27.2 MotionEvent 对象\n\n传递 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象是获取事件信息的关键。对象中的信息包括触摸在视图中的位置以及执行的动作类型。`MotionEvent` 对象也是处理多点触摸的关键。\n\n### 27.3\
  \ 理解触摸动作\n\n触摸事件处理的一个重要方面是识别用户执行的动作类型。可以通过调用传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象的 `getActionMasked()` 方法获取与事件相关的动作类型。当视图上发生第一次触摸时，`MotionEvent` 对象将包含动作类型 `ACTION_DOWN`\
  \ 以及触摸的坐标。当该触摸从屏幕上抬起时，会生成一个 `ACTION_UP` 事件。在 `ACTION_DOWN` 和 `ACTION_UP` 事件之间的任何触摸运动都将由\
  \ `ACTION_MOVE` 事件表示。\n\n当在视图上同时进行多个触摸时，这些触摸被称为指针（pointers）。在多点触摸场景中，指针分别以类型为 `ACTION_POINTER_DOWN`\
  \ 和 `ACTION_POINTER_UP` 的事件动作开始和结束。要识别触发事件的指针索引，必须调用 `MotionEvent` 对象的 `getActionIndex()`\
  \ 回调方法。\n\n### 27.4 处理多点触摸\n\n标题为“事件处理概述与示例”的章节开始在单点触摸事件的狭窄背景下探索事件处理。在实践中，大多数 Android\
  \ 设备都可以响应多点触摸（尽管需要注意的是，同时触摸的数量随设备而异）。\n\n如之前所述，多点触摸情况下的每次触摸都被 Android 框架视为一个指针。每个指针又通过一个索引值被引用并分配一个\
  \ ID。当前的指针数量可以通过调用 `getPointerCount()` 方法获取。在列表中特定索引处的指针 ID 可以通过调用 `getPointerId()`\
  \ 获取。例如，以下代码获取指针计数以及索引为 0 处的 ID：\n\n```\npublic boolean onTouch(View v, MotionEvent\
  \ m) {\n    int pointerCount = m.getPointerCount();\n    int pointerId = m.getPointerId(0);\n\
  \    return true;\n}\n```\n\n注意，当 `onTouch` 监听器被触发时，指针计数始终大于或等于 1（因为必须发生过一次触摸才会触发回调）。\n\
  \n在视图上的触摸，特别是涉及跨屏幕运动的触摸，会在接触点抬起之前产生一系列事件。应用程序可能需要在多个触摸事件期间跟踪单个触摸。虽然特定触摸手势的 ID 在事件之间不会改变，但请记住，索引值会随着其他触摸事件的出现和消失而改变。在多个事件中处理触摸手势时，必须使用\
  \ ID 值作为触摸引用，以确保跟踪的是同一个触摸。当调用需要索引值的方法时，应通过调用 `MotionEvent` 对象的 `findPointerIndex()`\
  \ 方法将 ID 转换为相应的索引值。\n\n### 27.5 多点触摸示例应用程序\n\n在本章剩余部分中创建的示例应用程序将跟踪跨布局视图移动的最两个触摸手势。当每个触摸的事件触发时，每个触摸的坐标、索引和\
  \ ID 将显示在屏幕上。\n\n\n\n\n\n从欢迎界面选择 **New Project** 选项，在弹出的新项目对话框中，在点击 `Next` 按钮之前，选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `MotionEvent`，并指定 `com.ebookfrenzy.motionevent`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n按照 11.8 Migrating a Project to View Binding 部分所述，调整项目以使用\
  \ view binding。\n\n### 27.6 设计 Activity 的用户界面\n\n应用程序唯一 Activity 的用户界面将由一个包含两个 `TextView`\
  \ 对象的 `ConstraintLayout` 视图组成。在 `Project` 工具窗口中，导航到 `app` -> `res` -> `layout`，并双击\
  \ `activity_main.xml` 布局资源文件以将其加载到 Android Studio 布局编辑器工具中。\n\n选择并删除默认的“Hello World!”\
  \ `TextView` 小部件，然后在启用自动连接（autoconnect）的情况下，拖放一个新的 `TextView` 小部件，使其水平居中，并放置在布局顶部边缘的\
  \ `16dp` 边距线上：\n\n![](img/as_4.1_motion_event_one_textview.jpg)\n\n图 27-1\n\n拖入第二个\
  \ `TextView` 小部件，并对其进行定位和约束，使其与第一个组件的底部保持 `32dp` 的间距：\n\n![](img/as_4.1_motion_event_two_textviews.jpg)\n\
  \n图 27-2\n\n使用 `Attributes` 工具窗口，将 `TextView` 小部件的 ID 分别更改为 `textView1` 和 `textView2`。将组件上显示的文本更改为“Touch\
  \ One Status”和“Touch Two Status”，并使用布局右上角的警告按钮将字符串提取到资源文件中。\n\n## 27.7 实现触摸事件监听\n\
  \n为了接收触摸事件通知，有必要在 `MainActivity` Activity 类的 `onCreate()` 方法中为布局视图注册触摸监听器。从 Android\
  \ Studio 编辑器面板中选择 `MainActivity.java` 标签以显示源码。在 `onCreate()` 方法中，添加代码来注册触摸监听器并实现代码，在此情况下，代码将调用一个名为\
  \ `handleTouch()` 的第二个方法，并传递 `MotionEvent` 对象：\n\n```java\npackage com.ebookfrenzy.motionevent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.os.Bundle;\nimport android.view.MotionEvent;\nimport android.view.View;\n\
  import com.ebookfrenzy.motionevent.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ binding.activityMain.setOnTouchListener(\n            new ConstraintLayout.OnTouchListener()\
  \ {\n                public boolean onTouch(View v, MotionEvent m) {\n         \
  \           handleTouch(m);\n                    return true;\n                }\n\
  \            }\n        );\n    }\n```\n\n当我们设计用户界面时，父 `ConstraintLayout` 没有分配允许我们通过\
  \ view binding 机制访问它的 ID。由于此布局组件是 UI 布局层次结构中的顶层组件，我们能够使用上述代码中的 `root` 绑定属性引用它。\n\
  \n在测试应用程序之前，最后的任务是实现监听器调用的 `handleTouch()` 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent\
  \ m) {\n    int pointerCount = m.getPointerCount();\n    for (int i = 0; i < pointerCount;\
  \ i++) {\n        int x = (int) m.getX(i);\n        int y = (int) m.getY(i);\n \
  \       int id = m.getPointerId(i);\n        int action = m.getActionMasked();\n\
  \        int actionIndex = m.getActionIndex();\n        String actionString;\n \
  \       switch (action) {\n            case MotionEvent.ACTION_DOWN:\n         \
  \       actionString = \"DOWN\";\n                break;\n            case MotionEvent.ACTION_UP:\n\
  \                actionString = \"UP\";\n                break;\n            case\
  \ MotionEvent.ACTION_POINTER_DOWN:\n                actionString = \"PNTR DOWN\"\
  ;\n                break;\n            case MotionEvent.ACTION_POINTER_UP:\n   \
  \             actionString = \"PNTR UP\";\n                break;\n            case\
  \ MotionEvent.ACTION_MOVE:\n                actionString = \"MOVE\";\n         \
  \       break;\n            default:\n                actionString = \"\";\n   \
  \     }\n        String touchStatus = \"Action: \" + actionString + \" Index: \"\
  \ + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\n        if (id\
  \ == 0) {\n            binding.textView1.setText(touchStatus);\n        } else {\n\
  \            binding.textView2.setText(touchStatus);\n        }\n    }\n}\n```\n\
  \n在编译和运行应用程序之前，值得花时间系统地梳理这段代码，以强调所执行的任务。\n\n代码首先获取用户界面中两个 `TextView` 对象的引用，并识别视图上当前有多少活跃指针：\n\
  \n```java\nTextView textView1 = findViewById(R.id.textView1);\nTextView textView2\
  \ = findViewById(R.id.textView2);\nint pointerCount = m.getPointerCount();\n```\n\
  \n接下来，`pointerCount` 变量启动了一个 `for` 循环，为每个活跃指针执行任务。循环的前几行获取触摸的 `X` 和 `Y` 坐标，以及相应的事件\
  \ ID、动作类型和动作索引。最后，声明了一个字符串变量：\n\n```java\nfor (int i = 0; i < pointerCount; i++)\
  \ {\n    int x = (int) m.getX(i);\n    int y = (int) m.getY(i);\n    int id = m.getPointerId(i);\n\
  \    int action = m.getActionMasked();\n    int actionIndex = m.getActionIndex();\n\
  \    String actionString;\n}\n```\n\n由于动作类型等于整数值，使用了 `switch` 语句将动作类型转换为更有意义的字符串值，并将其存储在\
  \ `actionString` 变量中：\n\n```java\nswitch (action) {\n    case MotionEvent.ACTION_DOWN:\n\
  \        actionString = \"DOWN\";\n        break;\n    case MotionEvent.ACTION_UP:\n\
  \        actionString = \"UP\";\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n\
  \        actionString = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n\
  \        actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\n```\n\n最后，使用 `actionString` 值、动作索引、触摸 ID 以及 `X` 和 `Y` 坐标构建字符串消息。然后使用\
  \ `id` 值来决定字符串应该显示在第一个或第二个 `TextView` 对象上：\n\n```java\nString touchStatus = \"Action:\
  \ \" + actionString + \" Index: \" + actionIndex + \" ID: \" + id + \" X: \" + x\
  \ + \" Y: \" + y;\nif (id == 0) {\n    binding.textView1.setText(touchStatus);\n\
  } else {\n    binding.textView2.setText(touchStatus);\n}\n```\n\n### 27.8 运行示例应用程序\n\
  \n编译并运行应用程序，一旦启动，在屏幕上进行单次和多点触摸实验，并注意视图的更新以反映事件，如 图 27-3 所示。在模拟器上运行时，可以通过按住 `Ctrl`\
  \ 键（macOS 上为 `Cmd`）同时点击鼠标来模拟多点触摸（注意，如果模拟器在工具窗口中运行，模拟多点触摸可能无效）：\n\n![](img/as_motion_event_running.jpg)\n\
  \n图 27-3\n\n### 27.9 总结\n\n\n\n\nActivity 通过注册 `onTouchListener` 事件监听器并实现 `onTouch()`\
  \ 回调方法来接收触摸事件通知。当该方法被 Android 运行时调用时，会传递一个 `MotionEvent` 对象。该对象包含了有关触摸的信息，例如触摸事件的类型、触摸坐标以及当前与\
  \ view 接触的触摸次数。\n\n当涉及多次触摸时，每个接触点被称为一个 `pointer`，每个点被分配了一个索引（index）和一个 `ID`。虽然触摸的索引可能会在不同事件之间发生变化，但\
  \ `ID` 在触摸结束之前将保持不变。\n\n本章已经通过创建一个示例 Android 应用程序完成，该程序旨在显示设备屏幕上多达两个同时触摸的坐标和动作类型。\n\
  \n在概述了通用触摸操作后，下一章（标题为“使用 Android Gesture Detector 类检测常用手势”）将通过手势识别进一步研究触摸屏事件处理。\n\
  \n# 28. 使用 Android Gesture Detector 类检测常用手势\n\n“手势”一词定义了触摸屏与用户之间连续的交互序列。一个典型的手势开始于屏幕首次触摸的点，结束于最后一个手指或指向设备离开显示表面。如果利用得当，可以实现手势在用户与应用程序之间的通信。用于电子书翻的滑动动作，以及涉及两次触摸以放大或缩小图像的捏合动作，都是手势如何与应用程序交互的绝佳示例。\n\
  \nAndroid SDK 提供了在应用程序内检测常用和自定义手势的机制。常用手势涉及此类交互，如点击（tap）、双击（double tap）、长按（long\
  \ press）或水平或垂直方向的滑动动作（在 Android 术中称为 fling）。\n\n本章探讨了使用 `GestureDetector` 类检测在 Android\
  \ 设备屏幕上执行常用手势。下一章“在 Android 上实现自定义手势和捏合识别”将涵盖检测更复杂的自定义手势，例如圆形运动和捏合。\n\n## 28.1 实现常用手势检测\n\
  \n当用户与 Android 设备的屏幕交互时，系统会调用当前活动应用程序的 `onTouchEvent()` 方法，并传递包含用户接触屏幕数据的 `MotionEvent`\
  \ 对象。这些数据可以被解释，以识别屏幕上的动作是否匹配点击或滑动等常用手势。通过使用 `GestureDetectorCompat` 类，可以用极少的编程工作实现这一点。该类设计用于接收应用程序的运动事件信息，并根据检测到的（如果有）常用手势的类型触发方法调用。\n\
  \n检测常用手势的基本步骤如下：\n\n1. 声明实现 `GestureDetector.OnGestureListener` 接口的类，包括所需的 `onFling()`、`onDown()`、`onScroll()`、`onShowPress()`、`onSingleTapUp()`\
  \ 和 `onLongPress()` 回调方法。注意，这可以是一个全新的类，也可以是一个内部 activity 类。如果需要双击手势检测，该类还必须实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口并包含相应的 `onDoubleTap()` 方法。\n\n2. 创建 `GestureDetectorCompat` 实例，并将步骤 1 中创建的类实例作为参数传递。\n\
  \n3. 根据需要可选调用 `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()` 方法启用双击检测。\n\
  \n4. 在封装的 activity 中实现 `onTouchEvent()` 回调方法，该方法必须调用 `GestureDetectorCompat` 实例的\
  \ `onTouchEvent()` 方法，并将当前的运动事件对象作为参数传递。\n\n一旦实现，结果是应用程序代码中的一组方法，当检测到特定类型的手势时，这些方法将被调用。随后可以实现这些方法中的代码，以执行响应相应手势需要执行的任何任务。\n\
  \n在本章的剩余部分，我们将创建一个示例项目，将上述步骤付诸实践。\n\n## 28.2 创建示例手势检测项目\n\n该项目旨在检测 `GestureDetectorCompat`\
  \ 类目前支持的全范围常用手势，并向用户显示状态信息以指示检测到的手势类型。\n\n从欢迎界面选择 New Project 选项，在生成的新项目对话框中，在点击\
  \ Next 按钮之前选择 Empty Views Activity 模板。\n\n在 Name 字段中输入 `CommonGestures`，并指定 `com.ebookfrenzy.commongestures`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置更改为 `API 26`：Android 8.0 (Oreo)，并将 Language\
  \ 菜单设置为 Java。\n\n按照第 11.8 节“Migrating a Project to View Binding”所述概述调整项目以使用 view\
  \ binding。\n\n一旦创建了新项目，在 Project 工具窗口中导航到 `app -> res -> layout -> activity_main.xml`\
  \ 文件并双击它将其加载到 Layout Editor 工具中。\n\n在 Layout Editor 工具中，选择“Hello, World!” `TextView`\
  \ 组件，并在 Attributes 工具窗口中输入 `gestureStatusText` 作为 ID。最后，将 `textSize` 设置为 `20sp`\
  \ 并启用加粗的 `textStyle`：\n\n![](img/as_common_gestures_text_style.jpg)\n\n图 28-1\n\n\
  ### 28.3 实现监听器类\n\n如前所述，有创建一个实现 `GestureDetector.OnGestureListener` 接口的类，如果需要双击检测，还需要实现\
  \ `GestureDetector.OnDoubleTapListener` 接口。虽然这可以是一个全新的类，但在当前 activity 类中实现它也是完全有效的。因此，我们将修改\
  \ `MainActivity` 类为此示例实现这些监听器接口。编辑 `MainActivity.java` 文件使其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.commongestures;\n\nimport android.view.GestureDetector;\n\npublic\
  \ class MainActivity extends AppCompatActivity implements GestureDetector.OnGestureListener,\
  \ GestureDetector.OnDoubleTapListener {\n\n}\n```\n\n声明该类实现了监听器要求在类中实现相应的方法：\n\n\
  ```java\npackage com.ebookfrenzy.commongestures;\n\nimport android.view.MotionEvent;\n\
  \npublic class MainActivity extends AppCompatActivity implements GestureDetector.OnGestureListener,\
  \ GestureDetector.OnDoubleTapListener {\n\n    @Override\n    public boolean onDown(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onDown\");\n        return\
  \ true;\n    }\n\n    @Override\n    public boolean onFling(MotionEvent event1,\
  \ MotionEvent event2, float velocityX, float velocityY) {\n        binding.gestureStatusText.setText(\"\
  onFling\");\n        return true;\n    }\n\n    @Override\n    public void onLongPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onLongPress\");\n    }\n\
  \n    @Override\n    public boolean onScroll(MotionEvent e1, MotionEvent e2, float\
  \ distanceX, float distanceY) {\n        binding.gestureStatusText.setText(\"onScroll\"\
  );\n        return true;\n    }\n\n    @Override\n    public void onShowPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onShowPress\");\n    }\n\
  \n    @Override\n    public boolean onSingleTapUp(MotionEvent event) {\n```\n\n\n\
  \n\n```java\n        binding.gestureStatusText.setText(\"onSingleTapUp\");\n\n \
  \       return true;\n\n    }@Override\npublic boolean onDoubleTap(MotionEvent event)\
  \ {\n    binding.gestureStatusText.setText(\"onDoubleTap\");\n    return true;\n\
  }\n\n@Override\npublic boolean onDoubleTapEvent(MotionEvent event) {\n    binding.gestureStatusText.setText(\"\
  onDoubleTapEvent\");\n    return true;\n}\n\n@Override\npublic boolean onSingleTapConfirmed(MotionEvent\
  \ event) {\n    binding.gestureStatusText.setText(\"onSingleTapConfirmed\");\n \
  \   return true;\n}\n```\n\n注意，这些方法中的许多返回 `true`。这向 Android 框架表明该方法已消费了事件，不需要将其传递给栈中的下一个事件处理程序。\n\
  \n### 28.4 创建 GestureDetectorCompat 实例\n\n现在 activity 类已更新以实现这些监听器接口，下一步是创建 `GestureDetectorCompat`\
  \ 类的实例。由于这只需要在 activity 创建时执行一次，因此这段代码的最佳位置是 `onCreate()` 方法。由于我们还想检测双击，因此代码还需要调用\
  \ `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()` 方法：\n\n```java\npackage\
  \ com.ebookfrenzy.commongestures;\n\nimport androidx.core.view.GestureDetectorCompat;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n\
  \        GestureDetector.OnDoubleTapListener {\n\n    private ActivityMainBinding\
  \ binding;\n    private GestureDetectorCompat gDetector;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        this.gDetector\
  \ = new GestureDetectorCompat(this,this);\n        gDetector.setOnDoubleTapListener(this);\n\
  \    }\n}\n```\n\n### 28.5 实现 onTouchEvent() 方法\n\n如果此时编译并运行应用程序，即使在设备屏幕上执行手势，也不会发生任何事情。这是因为还没有添加代码来拦截触摸事件将其传递给\
  \ `GestureDetectorCompat` 实例。为了实现这一目标，需要在 activity 类中重写 `onTouchEvent()` 方法并对其进行实现，使其调用\
  \ `GestureDetectorCompat` 实例的 `onTouchEvent()` 方法。因此，留在 `MainActivity.java` 文件中，实现该方法并使其读取如下：\n\
  \n```java\n@Override\npublic boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // 确保调用父类的实现\n    return super.onTouchEvent(event);\n}\n```\n\n### 28.6 测试应用程序\n\
  \n在物理 Android 设备或 AVD 模拟器上上编译并运行应用程序。启动后，尝试滑动、按下、滚动动作以及双击和单击。请注意，如图 28-2 所示，文本框会更新以反映事件：\n\
  \n![](img/as_common_gestures_running.jpg)\n\n图 28-2\n\n### 28.7 总结\n\n用户与设备触摸屏器之间的任何物理接触都可以被视为“手势”。由于缺乏传统计算机系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间的交互方法。虽然手势可以由任何序列的动作组成，但有一组广泛使用的手势，触摸屏设备的用户对此非常熟悉。这些所谓的“常用手势”中的某些，可以通过\
  \ Android 手势检测器类在应用程序内轻松检测。在本章中，从理论和示例项目实现方面概述了该技术的使用。在本章涵盖了常用手势之后，下一章将介绍检测更广泛的手势类型，包括设计和检测自定义手势的能力。\n\
  \n## 29. 在 Android 上实现自定义手势和缩放识别\n\n上一章涵盖了在 Android 应用程序内部对所谓的“常用手势”的检测。然而，在实践中，手势完全可能涉及\
  \ Android 设备屏幕上几乎任何序列的触摸动作。考虑到这一点，Android SDK 允许应用程序开发者定义几乎任何性质的自定义手势，并在用户执行时触发事件。这是一个多阶段的过程，其细节是本章的主题。\n\
  \n### 29.1 Android Gesture Builder 应用程序\n\nAndroid SDK 允许开发者设计自定义手势，并将其存储在与 Android\
  \ 应用程序包捆绑的手势文件中。这些自定义手势文件可以使用 Gesture Builder 应用程序轻松创建。创建手势文件涉及在物理设备或模拟器上启动 Gesture\
  \ Builder 应用程序，并“绘制”应用程序需要检测的手势。一旦设计好手势，就可以下载包含手势数据的文件并添加到应用程序项目中。在应用程序代码中，该文件被加载到\
  \ `GestureLibrary` 类的实例中，可以用于搜索用户在设备屏幕上执行的任何手势的匹配。\n\n### 29.2 GestureOverlayView\
  \ 类\n\n为了方便在应用程序内检测手势，Android SDK 提供了 `GestureOverlayView` 类。这个透明视图可以放在用户界面的其他视图之上以检测手势。\n\
  \n### 29.3 检测手势\n\n通过加载使用 Gesture Builder 创建的手势文件，然后在 `GestureOverlayView` 实例上注册\
  \ `GesturePerformedListener` 事件监听器来检测手势。然后声明封装类实现 `OnPerformedListener` 接口以及该接口所需的\
  \ `onGesturePerformed` 回调方法。如果监听器检测到手势，Android 运行时系统将触发 `onGesturePerformed` 回调方法的。\n\
  \n### 29.4 识别特定手势\n\n当检测到手势时，会调用 `onGesturePerformed` 回调方法，并传递检测手势的 `GestureOverlayView`\
  \ 对象引用以及包含手势信息的 `Gesture` 对象。\n\n通过访问 `Gesture` 对象，`GestureLibrary`可以将检测到的手势与之前加载到应用程序的手势文件中的手势进行比较。`GestureLibrary`\
  \ 通过为每个手势计算预测分数来报告用户执行的手势与手势文件条目的匹配概率。1.0 或更高的预测分数通常被接受为文件中对手势与用户在设备屏幕上执行的手势之间的良好匹配。\n\
  \n### 29.5 安装并运行 Gesture Builder 应用程序\n\n创建手势文件的简单方法是使用允许捕获并保存手势动作的应用程序。虽然 Google\
  \ 曾提供过此用途的应用程序，但对较新 Android 版本的维护不足。幸运的是，有一种 Gesture Builder Tool 应用程序替代方案，该程序可以通过\
  \ Google Play Store 中的以下 URL 获取：\n\n[`play.google.com/store/apps/details?id=migueldp.runeforge`](https://play.google.com/store/apps/details?id=migueldp.runeforge)\n\
  \n### 29.6 创建手势文件\n\n\n\n\n\n一旦 Gesture Builder Tool 加载，点击设备屏幕底部的 `Create New Gesture`\
  \ 按钮，并在灰色画布上使用圆形运动“画出”手势，如 [图 29-1] 所示。假设手势按要求显示（由设备屏幕上的黄色线条表示），点击 `save` 按钮将该手势添加到手势文件中，在提示输入名称时输入“Circle\
  \ Gesture”：\n\n![](img/as_gesture_builder_app.jpg)\n\n图 29-1\n\n手势保存后，Gesture Builder\
  \ Tool 将显示当前定义的手势列表，该列表将仅包含新创建的 Circle Gesture。\n\n### 29.7 创建示例项目\n\n从欢迎界面选择 `New\
  \ Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name`\
  \ 字段中输入 `CustomGestures`，并指定包名为为 `com.ebookfrenzy.customgestures`。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level` 设置为 `API 26`：`Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Java`。按照\
  \ [11.8 Migrating a Project to View Binding] 节中的概述调整项目以使用 view binding。\n\n### 29.8\
  \ 从 SD 卡提取手势文件\n\n由于每个手势都是在 Gesture Builder 应用中创建的，它们会被添加到一个名为 `gesture.txt` 的文件中，该文件位于运行应用的模拟器或设备的存储空间中。然而，在将此文件添加到\
  \ Android Studio 项目之前，必须将其从设备存储中拷贝并保存到本地文件系统。使用 Android Studio 的 `Device File Explorer`\
  \ 工具窗口最容易实现。通过 `View -> Tool Windows -> Device File Explorer` 菜单选项显示此工具。显示后，从下拉菜单选择创建手势文件的设备或模拟器，然后导航到以下文件夹：\n\
  \n`/storage/emulated/0/Android/data/migueldp.runeforge/files/gestures.txt`\n\n在此文件夹中找到\
  \ `gesture.txt` 文件，右键点击它，选择 `Save As…` 菜单选项，并将文件保存到临时位置，命名为 `gestures`。\n\n![](img/as_device_explorer.jpg)\n\
  \n图 29-2\n\n一旦手势文件创建并从设备存储中拉取，就可以作为资源文件添加到 Android Studio 项目中。\n\n### 29.9 将手势文件添加到项目\n\
  \n在 Android Studio Project 工具窗口中，找到并右键点击 `res` 文件夹（位于 `app` 下），从弹出的菜单中选择 `New ->\
  \ Directory`。在 `New Directory` 对话框中，输入 `raw` 作为文件夹名称并按键盘回车键。使用适用于你操作系统类型的适当文件资源管理器工具，找到之前从设备存储中拉取的\
  \ `gestures` 文件，将其复制并粘贴到 Project 工具窗口中新的 `raw` 文件夹。\n\n### 29.10 设计用户界面\n\n此示例应用需要一个由\
  \ `ConstraintLayout` 视图组成的用户界面，并在其上叠加一个 `GestureOverlayView` 以拦截用户执行的任何手势。找到 `app\
  \ -> res -> layout -> activity_main.xml` 文件，双击它将其加载到 Layout Editor 工具中，选择并删除默认的\
  \ `TextView` 组件。\n\n切换到布局编辑器的 Code 模式并修改 XML，使其读取内容如下：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\" >\n    <android.gesture.GestureOverlayView\n\
  \        android:id=\"@+id/gOverlay\"\n        android:layout_width=\"0dp\"\n  \
  \      android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n### 29.11 加载手势文件\n\n现在手势文件已添加到项目中，下一步是编写代码在 activity 启动时加载该文件。对于此项目，实现此目的的代码将如下添加到\
  \ `MainActivity` 类中：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\n.\n\n\
  .\n\nimport android.gesture.GestureLibraries;\nimport android.gesture.GestureLibrary;\n\
  import android.gesture.GestureOverlayView;\nimport android.gesture.GestureOverlayView.OnGesturePerformed;\n\
  \npublic class MainActivity extends AppCompatActivity implements OnGesturePerformed\
  \ {\n    privateMainBinding binding;\n    private GestureLibrary gLibrary;\n\n \
  \   @Override\n    protected void onCreate(Bundle savedInstanceState) {\n      \
  \  super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ setup();\n    }\n\n    private void setup() {\n        gLibrary = GestureLibraries.fromResource(this,\
  \ R.raw.gestures);\n    }\n```\n\n除了必要的 import 语句外，上述代码还创建了一个 `GestureLibrary` 实例并将手势文件的内容加载其中。activity\
  \ 已修改为实现 `OnGesturePerformed`，这需要添加 `onGesturePerformed` 方法。\n\n### 29.12 注册监听器\n\
  \n为了让 activity 接收用户执行手势的通知，必须在 `gOverlay` 上注册 `OnGesturePerformed` 事件监听器，可以通过以下片段概述的方法获取其引用：\n\
  \n```java\nprivate void setup() {\n    gLibrary = GestureLibraries.fromResource(this,\
  \ R.raw.gestures);\n    if (!gLibrary.load()) {\n        finish();\n    }\n    GestureOverlayView\
  \ gOverlay = findViewById(R.id.gOverlay);\n    gOverlay.addOnGestureListener(this);\n\
  }\n```\n\n### 29.13 实现 onGesturePerformed 方法\n\n在首次运行应用程序之前，只需实现 `onGesturePerformed`\
  \ 回调方法。该方法在 `GestureOverlayView` 实例上执行手势时会被调用：\n\n（注：此处原文提供的代码块不完整，已根据上下文保持逻辑结构）\n\
  \n```java\n    public void onGesturePerformed(GestureOverlayView overlay, Gesture\
  \ gesture) {\n        ArrayList<Prediction> predictions = gLibrary.recognize(gesture);\n\
  \        if (predictions.size() > 0 && predictions.get(0).score > 1.0) {\n     \
  \       String action = predictions.get(0).name;\n            Toast.makeText(this,\
  \ action, Toast.LENGTH_SHORT).show();\n        }\n    }\n}\n```\n\n\n\n\n当 Android\
  \ 运行时在手势叠加视图对象上检测到手势时，会调用 `onGesturePerformed` 方法。作为参数传递的是检测到手势的那个 `GestureOverlayView`\
  \ 对象的引用，以及一个类型为 `Gesture` 的对象。`Gesture` 类用于存储定义特定手势的信息（本质上是屏幕上的一系列带时间的点，描绘了构成手势的笔画路径）。\n\
  \n`Gesture` 对象被传递给我们 `gLibrary` 实例的 `recognize()` 方法，以便将当前手势与从手势文件中加载的每个手势进行比较。一旦任务完成，`recognize()`\
  \ 方法将返回一个 `ArrayList` 对象，其中包含针对每次比较执行的 `Prediction` 对象。该列表按照从最匹配（位于数组位置 0）到最不匹配的顺序进行排序。每个预测对象中包含了手势文件中对应手势的名称，以及一个指示其与当前手势匹配程度的预测评分。\n\
  \n因此，上述方法中的代码获取位置 0 处的预测（最匹配的项），确保其得分大于 1.0，然后显示一个 `Toast` 消息（一种用于向用户显示通知弹窗的 Android\
  \ 类），显示匹配手势的名称。\n\n### 29.14 测试应用程序\n\n在模拟器或物理 Android 设备上构建并运行该应用程序，并在屏幕上执行圆形手势。执行后，应该出现包含检测到的手势名称的吐司通知。请注意，当手势被识别时，它会在屏幕上用亮黄色线条勾勒出来，而叠加层不确定的手势则显示为淡黄色线条。虽然这在开发期间很有用，但对于实际应用来说可能并不理想。因此，还需要一些配置工作需要完成。\n\
  \n### 29.15 配置 GestureOverlayView\n\n默认情况下，`GestureOverlayView` 配置为在手势期间显示黄色线条。可以通过\
  \ `android:gestureColor` 和 `android:uncertainGestureColor` 属性定义绘制识别和未识别手势的颜色。例如，要隐藏手势线条，请如下所示修改示例项目中的\
  \ `activity_main.xml` 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n    android:id=\"\
  @+id/gOverlay\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    android:gestureColor=\"#00000000\"\n    android:uncertainGestureColor=\"\
  #00000000\" />\n```\n\n重新运行应用程序后，手势现在应该是不可见的（因为它们被绘制在 `ConstraintLayout` 视图的白色背景上）。\n\
  \n### 29.16 拦截手势\n\n如前所述，`GestureOverlayView` 是一个透明的叠加层，可以放置在其他视图之上。这引出了问题：当手势被识别时，手势叠加层拦截的事件是否应该传递给底层视图？这通过\
  \ `GestureOverlayView` 实例的 `android:eventsInterceptionEnabled` 属性控制。当设置为 `true`\
  \ 时，当识别出手势时，手势事件不会传递给底层视图。当手势在可能配置为响应某些手势而滚动的视图上执行时，此设置可能特别有用。将此属性设置为 `true` 可以避免手势也被解释为底层视图向特定方向滚动的指令。\n\
  \n### 29.17 检测缩放手势\n\n在离开通用触摸处理和特别是手势识别之前，本章的最后一个主题是处理缩放手势。虽然可以使用本章之前分节中概述的步骤创建并检测各种手势，但实际上，使用目前为止讨论的技术无法检测缩放手势（即使用两个手指进行拉伸和捏合动作，通常用于放大或缩小视图或图像）。\n\
  \n检测缩放手势最简单的方法是使用 Android 的 `ScaleGestureDetector` 类。来说，检测缩放手势涉及以下三个步骤：\n\n1. 声明实现\
  \ `SimpleOnScaleGestureListener` 接口的新类，包括所需的 `onScale()`、`onScaleBegin()` 和 `onScaleEnd()`\
  \ 回调方法。\n2. 创建 `ScaleGestureDetector` 类的实例，并将步骤 1 中创建的类实例作为参数传递。\n3. 在封装的 Activity\
  \ 中实现 `onTouchEvent()` 回调方法，该方法反过来调用 `ScaleGestureDetector` 类的 `onTouchEvent()`\
  \ 方法。\n\n在本章的剩余部分，我们将创建一个演示缩放手势识别实现的示例。\n\n### 29.18 缩放手势示例项目\n\n从欢迎屏幕选择 New Project（新建项目）选项，在出现的新项目对话框中，点击\
  \ Next 按钮之前选择 Empty Views Activity 模板。\n\n在 Name 字段输入 `PinchExample` 并指定 `com.ebookfrenzy.pinchexample`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将 Language\
  \ 菜单设置为 `Java`。按照 [11.8 Migrating a Project to View Binding] 中的步骤将项目转换为使用 view binding。\n\
  \n在 `activity_main.xml` 文件中，选择默认的 `TextView` 对象并使用 Attributes 工具窗口将 ID 设置为 `myTextView`。找到并加载\
  \ `MainActivity.java` 文件到 Android Studio 并对文件进行如下修改：\n\n\n\n\n\n在 `onCreate()` 方法中，创建了一个新的\
  \ `ScaleGestureDetector` 实例，传递了外部 Activity 的引用以及新创建的 `MyOnScaleGestureListener`\
  \ 实例作为参数。最后，为 Activity 实现了 `onTouch()` 回调方法，调用 `ScaleGestureDetector` 对象的 `onTouchEvent()`\
  \ 方法。\n\n在模拟器或物理设备上编译并运行应用程序，并在屏幕上执行缩放手势，视图根据缩放动作显示放大或缩小。缩放手势可以通过按住 `Ctrl`（或 macOS\
  \ 的 `Cmd`）键并拖动鼠标指针在模拟器中模拟，如图 29-3\n\n图 29-3\n\n### 29.1 总结\n\n手势是用户在屏幕上的运动，涉及一次或多次触碰。Android\
  \ 允许使用 `Builder` 设计手势。一旦创建，手势可以保存到布局文件中并在运行时加载到 Activity 中。\n\n通过叠加现有视图的 `OverlayView`\
  \ 实例实现 `OnGestureListener` 事件监听器，可以检测手势。使用 `GestureDetector` 类，根据用户执行的手势生成匹配的列表，用以判断手势是否足够。\n\
  \n## 30. Android Fragment 简介\n\n随着对本书章节的深入学习，你将发现 Android 系统的许多设计理念是为了促进应用程序中不同元素之间的复用和交互。这样一个领域涉及使用\
  \ Fragment。\n\n本章将概述 Fragment 的基础，包括它们是什么以及如何在应用程序中创建和使用。下一章将通过在 Android Studio\
  \ 中开发应用程序来展示 Fragment 的实际运行效果。\n\n### 30.1 什么是 Fragment？\n\nFragment 是应用程序用户界面中自包含的模块化部分及其相应的行为，可以嵌入到\
  \ Activity 中。Fragment 可以在设计阶段组装，并在运行时添加到或从 Activity 中移除，以创建动态的用户界面。\n\nFragment\
  \ 只能作为 Activity 的一部分，不能作为独立的元素实例化。然而，Fragment 可以被视为具有与 Activity 相似生命周期的功能性子 Activity”。\n\
  \nFragment 以 XML 布局文件的形式存储。它们可以通过在 Activity 的布局文件中放置适当的 `<fragment>` 元素或者通过 Activity\
  \ 类中的代码添加到 Activity。\n\n### 30.2 创建 Fragment\n\n构成 Fragment 的两个组件是一个 XML 布局文件和一个对应的\
  \ Java 类。Fragment 的 XML 布局文件格式与任何 Activity 布局相同，可以包含任何组合的布局管理器和视图。例如，以下 XML 布局用于\
  \ Fragment 由一个红色背景的 `ConstraintLayout` 组成，其中包含一个白色前景的 `TextView`：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/constraintLayout\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:background=\"@android:color/holo_red_dark\"\
  \n    tools:context=\".FragmentOne\">\n    <TextView\n        android:id=\"@+id/textView1\"\
  \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:text=\"My First Fragment\"\n        android:textAppearance=\"\
  @style/TextAppearance.AppCompat.Large\"\n        android:textColor=\"@color/white\"\
  \n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n与布局对应的类必须是\
  \ `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载 Fragment。例如：\n\n```java\n\
  package com.example.fragmentdemo;\nimport android.os.Bundle;\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport androidx.fragment.app.Fragment;\n\
  \npublic class FragmentOne extends Fragment {\n    @Override\n    public View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container, Bundle savedInstanceState) {\n        // 加载此 fragment\
  \ 的布局\n        binding = FragmentBinding.inflate(inflater, container, false);\n\
  \        return binding.getRoot();\n    }\n}\n```\n\n除了 `onCreateView()` 方法外，该类还可以重写标准的生命周期方法。一旦创建了\
  \ Fragment 布局和类，Fragment 就可以准备在 Activity 中使用了。\n\n### 30.3 使用布局文件向 Activity 添加 Fragment\n\
  \n可以通过编写 Java 代码或将 Fragment 嵌入 Activity 的布局文件将其纳入 Activity 中。无论使用哪种方法，需要注意的关键点是，当为旧版本支持库时，任何使用\
  \ Fragment 的 Activity 必须实现为 `FragmentActivity` 的子类，而不是 `AppCompatActivity` 类：\n\n\
  ```java\npackage com.example.fragmentdemo;\nimport android.os.Bundle;\nimport androidx.fragment.app.FragmentActivity;\n\
  \npublic class MainActivity extends FragmentActivity {\n}\n```\n\nFragment 使用 `FragmentContainerView`\
  \ 类嵌入布局文件中。以下布局将本章上一节创建的 Fragment 嵌入到 Activity 中：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n   \
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <androidx.fragment.app.FragmentContainerView\n\
  \        android:id=\"@+id/fragment2\"\n        android:name=\"com.ebookfrenzy.myfragmentdemo.FragmentOne\"\
  \n        android:layout_width=\"0dp\"\n        android:layout_height=\"wrap_content\"\
  \n        android:layout_marginStart=\"32dp\"\n        android:layout_marginEnd=\"\
  32dp\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\"\n        tools:layout=\"@layout/fragment_one\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n\n\n\n\n`<fragment>` 元素的关键属性是 `android:name`（必须引用与 fragment 关联的类）和 `tools:layout`（必须引用包含\
  \ fragment 布局的 XML 资源文件）。\n\n一旦添加到 activity 的布局，就可以在 Android Studio Layout Editor\
  \ 工具中查看和操作 fragment。例如，图 30-1 显示了在 Android Studio Layout Editor 中嵌入 fragment 的上述布局：\n\
  \n![](img/as_4.1_my_first_fragment.jpg)\n\n图 30-1\n\n### 30.4 在代码中添加和管理 Fragment\n\
  \n通过 activity 的 XML 布局文件添加 fragment 虽然非常方便，但代价是 activity 在在运行时无法移除 fragment。为了实现在运行时对\
  \ fragment 进行完全动态控制，必须通过代码添加这些 activity。这样做的好处是，可以在应用程序运行时动态地添加、删除 fragment，甚至让它们动态地相互替换。\n\
  \n使用代码管理 fragment 时，fragment 仍然由一个 XML 布局文件和一个相应的类组成。区别在于在宿主 activity 中操作 fragment。使用代码向\
  \ activity 添加 fragment 有有一套标准的步骤序列：\n\n1. 创建 fragment 类的实例。\n2. 将任何额外的 intent 参数传递给该类实例。\n\
  3. 获取 fragment manager 实例的引用。\n4. 调用 fragment manager 实例上的 `beginTransaction()`\
  \ 方法。这会返回一个 fragment transaction 实例。\n5. 调用 fragment transaction 实例的 `add()` 方法，将要包含\
  \ fragment 的视图的资源 ID 和 fragment 类实例作为参数传递。\n6. 调用 fragment transaction 的 `commit()`\
  \ 方法。\n\n例如，下面的代码添加了一个由 `FragmentOne` 类定义的 fragment，使其显示在 ID 为 `LinearLayout1` 的容器视图中：\n\
  \n```\nFragmentOne firstFragment = new FragmentOne();\nfirstFragment.setArguments(getIntent().getExtras());\n\
  FragmentManager fragManager = getSupportFragmentManager();\nFragmentTransaction\
  \ transaction = fragManager.beginTransaction();\ntransaction.add(R.id.LinearLayout1,\
  \ firstFragment);\ntransaction.commit();\n```\n\n上述代码为了清晰起见，将每个步骤拆分为单独语句。然而，最后四行可以简写为一行代码，如下：\n\
  \n```\ngetSupportFragmentManager().beginTransaction()\n        .add(R.id.LinearLayout1,\
  \ firstFragment).commit();\n```\n\n一旦添加到容器中，随后可以通过调用 fragment transaction 实例的 `remove()`\
  \ 方法来移除，并传递要移除的 fragment 实例引用：\n\n```\ntransaction.remove(firstFragment);\n```\n\
  \n同样，可以通过调用 fragment transaction 实例的 `replace()` 方法用一个 fragment 替换另一个。该方法的参数是包含\
  \ fragment 的视图 ID 和新 fragment 的实例。被替换的 fragment 也可以放在所谓的返回栈（back stack）中，以便在用户导航返回时可以快速恢复。这是通过在调用\
  \ `commit()` 方法之前调用 fragment transaction 对象的 `addToBackStack()` 方法实现的：\n\n```\n\
  FragmentTwo secondFragment = new FragmentTwo();\ntransaction.replace(R.id.LinearLayout1,\
  \ secondFragment);\ntransaction.addToBackStack(null);\ntransaction.commit();\n```\n\
  \n### 30.5 处理 Fragment 事件\n\n如前所述，fragment 就像一个具有布局、类和生命周期的子 activity。fragment 内部视图组件（如按钮和文本视图）可以普通\
  \ activity 一样生成事件。这产生了一个问题：哪个类接收来自 fragment 中视图的事件？是 fragment 自身，还是嵌入 fragment 的\
  \ activity？这个问题的答案取决于事件处理器是如何声明的。\n\n在题为 “Android 事件处理概述与示例” 的章节中讨论了两种处理事件的方法。第一种方法是在\
  \ activity 代码中配置事件监听器和回调方法。例如：\n\n```\nbinding.button.setOnClickListener(\n    new\
  \ Button.OnClickListener() {\n        public void onClick(View v) {\n          \
  \  // 当点击按钮时\n            // 执行的代码\n        }\n    }\n);\n```\n\n在拦截点击事件的情况下，第二种方法是在\
  \ XML 布局文件中设置 `android:onClick` 属性：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:onClick=\"onClick\"\n    android:text=\"Click me\" />\n```\n\nfragment\
  \ 中视图生成的事件的通用规则是：如果事件监听器声明在 fragment 中，则事件将由 fragment 处理。然而，如果使用了 `android:onClick`，事件将传递给\
  \ activity。\n\n### 30.6 实现 Fragment 间通信\n\n一旦一个或多个 fragment 被嵌入到 中，那么 fragment 与\
  \ activity 之间以及 fragment 之间很有可能需要某种形式的通信。良好的实践要求 fragment 之间不要相互通信。所有通信都应该通过封装的\
  \ activity 进行。\n\n要与 fragment 通信，activity 必须通过分配给它的 ID 来识别 fragment 对象。一旦获取此引用，activity\
  \ 就可以调用 fragment 的公共方法。\n\n反方向的通信（从 fragment 到 activity）稍微复杂一些。首先，fragment 必须定义一个监听器接口，然后在\
  \ activity 类中实现该接口。例如，下面的代码在名为 `ToolbarFragment` 的 fragment 中声明了一个监听器接口。代码还声明了一个稍后存储\
  \ activity 引用的变量：\n\n```java\npublic class ToolbarFragment extends Fragment {\n\
  \    ToolbarListener activityCallback;\n\n    public interface ToolbarListener {\n\
  \        void onButtonClick(int position, String text);\n    }\n}\n```\n\n上述代码规定，实现\
  \ `ToolbarListener` 接口的类必须实现一个名为 `onButtonClick` 的回调方法，该方法接受一个整数和一个字符串。\n\n接下来，需要重写并实现\
  \ fragment 类的 `onAttach()` 方法。当 fragment 初始化并与 activity 关联时，Android 系统会自动调用该方法。该方法传递包含\
  \ fragment 的 activity 引用。该方法必须存储该 activity 的本地引用，并验证它实现了 `ToolbarListener` 接口：\n\
  \n```java\n@Override\npublic void onAttach(Context context) {\n    super.onAttach(context);\n\
  \    try {\n        activityCallback = (ToolbarListener) activity;\n    } catch\
  \ (ClassCastException e) {\n        throw new ClassCastException(activity.toString()\
  \ + \" must implement ToolbarListener\");\n    }\n}\n```\n\n执行此示例后，activity 的引用将存储在本地\
  \ `activityCallback` 变量中，如果 activity 没有实现 `ToolbarListener` 接口，将抛出异常。\n\n下一步是在 fragment\
  \ 内部调用 activity 的回调方法。何时以及如何发生完全取决于 fragment 需要联系 activity 的情况。\n\n\n\n\n\n```java\n\
  public void buttonClicked (View view) {\n    activityCallback.onButtonClick(arg1,\
  \ arg2);\n}\n```\n\n剩下的只需修改 activity 类以实现 `ToolbarListener` 接口。例如：\n\n```java\n\
  public class MainActivity extends FragmentActivity\n        implements ToolbarFragment.ToolbarListener\
  \ {\n\n    public void onButtonClick(String arg1, int arg2) {\n        // 实现回调方法的代码\n\
  \    }\n}\n```\n\n从上面的代码中我们可以看到，activity 声明它实现了 `ToolbarFragment` 类的 `ToolbarListener`\
  \ 接口，然后按照接口的要求实现了 `onButtonClick()` 方法。\n\n### 30.7 总结\n\nFragment（片段）为创建可重用的用户界面布局和应用程序行为模块提供了一种强大的机制，一旦创建，就可以嵌入到\
  \ activity 中。一个 fragment 由一个用户界面布局文件和一个类组成。可以通过将 fragment 添加到 activity 的布局文件中或编写代码在运行时管理\
  \ fragment，从而在 activity 中使用它们。通过代码添加到 activity 中的 fragment 可以在运行时动态地删除和替换。fragment\
  \ 之间的所有通信都应该通过嵌入它们的 activity 进行。\n\n在本章涵盖了 fragment 的基础知识后，下一章将通过一个教程来加强本章中概述的技巧。\n\
  \n## 31. 在 Android Studio 中使用 Fragments - 示例\n\n如上一章所述，fragment 为创建可重用的应用程序功能模块提供了一种方便的机制，这些模块由用户界面部分和相应的行为组成。一旦创建，fragment\
  \ 就可以嵌入到 activity 中。\n\n在上一章探索了 fragment 的通用理论后，本章旨在使用 Android Studio 创建一个示例 Android\
  \ 应用程序，用于演示创建和使用 fragment 的实际步骤，以及在 activity 内部实现 fragment 彼此之间的通信。\n\n### 31.1\
  \ 关于示例 Fragment 应用程序\n\n在本章创建的应用程序将由一个 activity 和两个 fragment 组成。第一个 fragment 的界面将包含一个工具栏，由\
  \ `EditText` 视图、`SeekBar` 和 `Button` 组成，所有这些都包含在一个 `ConstraintLayout` 视图中。第二个 fragment\
  \ 将仅由 `ConstraintLayout` 视图中的一个 `TextView` 对象组成。\n\n这两个 fragment 将嵌入应用程序的主 activity\
  \ 中，并实现如下通信：当按下第一个 fragment 中的按钮时，输入到 `EditText` 视图中的文本将显示在第二个 fragment 的 `TextView`\
  \ 上，字体大小由第一个 fragment 中 `SeekBar` 的位置决定。\n\n由于此应用程序旨在较早版本的 Android 版本上运行，我们需要使用相应的\
  \ Android 支持库。\n\n### 31.2 创建示例项目\n\n从欢迎界面选择 `New Project` 选项，在出现的新项目对话框中，点击 `Next`\
  \ 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `FragmentExample`，并指定 `com.ebookfrenzy.fragmentexample`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单改为 `Java`。按照 11.8 Migrating a Project to View Binding 中概述的步骤修改项目以使用\
  \ view binding。\n\n返回 `Gradle Scripts` -> `build.gradle.kts (Module :app)` 文件，并在\
  \ dependencies 部分添加以下指令（请注意，现在可能有更新版本的库）：\n\n```gradle\nimplementation 'androidx.navigation:navigation-fragment:2.7.5'\n\
  ```\n\n### 31.3 创建第一个 Fragment 布局\n\n下一步是为我们 activity 中使用的第一个 fragment 创建用户界面。\n\
  \n该用户界面将由一个 XML 布局文件和一个 fragment 类组成。虽然可以手动添加它们，但让 Android Studio 为我们创建它们更快。在项目工具窗口中，找到\
  \ `app` -> `java` -> `com.ebookfrenzy.fragmentexample` 项并对其右键点击。从弹出的菜单中，选择 `New`\
