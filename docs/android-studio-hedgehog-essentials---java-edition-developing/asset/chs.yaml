  \n由于突然出现“默认设置”界面可能会让普通用户感到困惑，建议在启动设置应用之前显示解释性对话框。为了给用户提供手动启用链接的选项，在尝试启动意图之前执行以下代码：\n\
  \n```java\n// 此处为显示需要启用链接的对话框\nIntent intent = new Intent(Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS,\n\
  \    Uri.parse(\"package:com.ebookfrenzy.mywebview\"));\nstartActivity(intent);\n\
  ```\n\n### 53.8 检查意图可用性\n\n假设某个 Activity 适用于特定的 intent 通常是不明智的，因为缺少匹配项通常会导致应用程序崩溃。幸运的是，在将意图发送到运行时之前，可以识别其可用性。可以使用以下方法来识别特定\
  \ `intent` 动作类型的 Activity 可用性：\n\n```java\npublic static boolean isIntentAvailable(Context\
  \ context, String action) {\n    final PackageManager packageManager = context.getPackageManager();\n\
  \    final Intent intent = new Intent(action);\n    List<ResolveInfo> list =\n \
  \       packageManager.queryIntentActivities(intent,\n            PackageManager.MATCH_DEFAULT_ONLY);\n\
  }\n```\n\n\n\n\n```java\nreturn list.size() > 0;\n\n}\n```\n\n### 53.9 总结\n\n意（Intent）是一个\
  \ Android Activity 启动另一个 Activity 的消息机制。显式意（Explicit intent）通过类名引用接收 Activity 来引用要启动的特定\
  \ Activity。显式意通常（但不仅限于）用于启动同一个应用程序内的 Activity。隐式意（Implicit intent）指定要执行的操作和要处理的数据类型，并允许\
  \ Android 运行时找到匹配的 Activity 进行启动。隐式意通常用于启动位于不同应用程序的 Activity。\n\n在处理隐式意时，安全限制要求用户在启动意之前，自动验证或手动启用包含意图目标\
  \ Activity 的应用程序。自动验证涉及在与链接 URL 对应的网站上放置 `Digital Assets Link` 数字资产链接链接文件。\n\nActivity\
  \ 可以将数据作为键值对封装在 `intent` 对象中，从而将数据发送给接收 Activity。只有当 Activity 作为发送方 Activity 的子\
  \ Activity（sub-activity）启动时，才能从该 Activity 返回数据。\n\nActivity 通过在应用程序清单文件中指定意过滤器（intent\
  \ filters），向 Android 意图解析过程声明其功能。发送和接收 Activity 也必须请求适当的权限来执行任务，如访问设备联系人数据库或互联网。\n\
  \n在涵盖意的理论之后，接下来的几章将在 Android Studio 中创建一些示例，将显式意和隐式意投入实践。\n\n## 54. Android 显式意\
  \ – 实例演示\n\n标题为[“Android 意图概览”]的章节涵盖了使用意图启动 Activity 的理论。本章将通过创建一个示例应用程序将该理论付诸实践。\n\
  \n在本章创建的示例 Android Studio 应用程序项目将演示使用显式意启动 Activity，包括在发送和接收 Activity 之间传输数据。下一章（[Android\
  \ 隐式意 – 实例演示]）将演示如何使用隐式意。\n\n### 54.1 创建显式意示例应用程序\n\n从欢迎界面选择 `New Project` 选项，在出现的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `ExplicitIntent`，并指定\
  \ `com.ebookfrenzy.explicitintent` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API` 级别设置为 `API\
  \ 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为 `Java`。按照章节 [11.8 迁移项目到 View Binding]\
  \ 中列出的步骤，将项目转换为使用 view binding。\n\n### 54.2 设计 MainActivity 的用户界面布局\n\n`MainActivity`\
  \ 的用户界面将由一个 `ConstraintLayout` 视图组成，其中包含 `EditText`（纯文本）、`TextView` 和分别名为 `editText1`、`textView1`\
  \ 和 `button1` 的 `Button` 视图。使用 `Project` 工具窗口找到 `MainActivity` 的 `activity_main.xml`\
  \ 资源文件（位于 `app -> res -> layout` 下），并双击将其加载到 Android Studio 布局编辑器工具中。选择默认的“Hello\
  \ World!” `TextView` 并使用 `Attributes` 工具窗口为其分配 ID `textView1`。\n\n从调色板中拖入 `Button`\
  \ 对象，将其放置在水平居中，并位于 `TextView` 底部边缘下方。将 `text` 属性更改为“Send Text”，并配置 `onClick` 属性调用名为\
  \ `sendText()` 的方法。\n\n接下来，添加一个水平居中并位于 `TextView` 顶部边缘方的 `Plain Text` 对象。使用 `Attributes`\
  \ 工具窗口移除分配给 `text` 属性的“Name”字符串，并将 ID 设置为 `editText1`。布局完成后，点击工具栏上的 `Infer constraints`\
  \ 按钮以添加适当约束：\n\n![](img/as_infer_constraints.jpg)\n\n图 54-1\n\n最后，点击布局编辑器窗口右上角的红色警告按钮，并使用生成的面板将“Send\
  \ Text”字符串提取到名为 `send_text` 的资源中。一旦布局完成，用户界面应该类似于图 54-2 所示：\n\n![](img/as_explicit_intent_send_ui.jpg)\n\
  \n图 54-2\n\n### 54.3 创建第二个 Activity 类\n\n当用户触摸“Send Text”按钮时，将发出一个 `intent`，请求启动第二个\
  \ Activity，用户可以在其中输入响应。因此，下一步是创建第二个 Activity。在 `Project` 工具窗口中，右键点击位于 `app -> java`\
  \ 的 `com.ebookfrenzy.explicitintent` 包名，并选择 `New -> Activity -> Empty Views Activity`\
  \ 菜单选项，显示如图 54-3 所示的新 Android Activity 对话：\n\n![](img/as_explicit_intent_new_activity_java.jpg)\n\
  \n图 54-3\n\n在 `Activity Name` 和 `Title` 字段中输入 `SecondActivity`，将布局文件命名为 `activity_second`，并将\
  \ `Language` 菜单改为 `Java`。由于此 Activity 不会在应用程序启动时启动（它将在点击按钮时通过 `MainActivity` 的 `intent`\
  \ 启动），在点击 `Finish` 按钮之前确保禁用 `Launcher Activity` 选项。\n\n### 54.4 设计 SecondActivity\
  \ 的用户界面布局\n\n第二个 Activity 用户界面需要的 `Plain Text EditText`、`TextView` 和 `Button`。考虑到这些要求，将\
  \ `activity_second.xml` 布局加载到布局编辑器中并添加视图。\n\n在设计过程中，注意按钮视图上的 `onClick` 属性已配置为调用名为\
  \ `returnText()` 的方法，`TextView` 和 `EditText` 视图分别分配了 ID `textView2` 和 `editText2`。完成后，布局应类似于图\
  \ 4。注意按钮上的文本（Return Text）已提取到名为 `return_text` 的字符串。\n\n布局完成后，点击 Infer constraints\
  \ 按钮添加约束：\n\n![](img/as_explicit_intent.jpg)\n\n图 5-4\n\n## 4.5 检查应用程序清单\n\n为了 `MainActivity`\
  \ 能够使用 `intent` 启动 `SecondActivity`，`AndroidManifest.xml` 文件必须存在 `SecondActivity`\
  \ 的项。在 `Project` 窗口（`app -> manifests`）找到此文件，双击将其加载到编辑器中，并验证 Android Studio 已自动添加该\
  \ Activity 的项：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:dataExtractionRules=\"@xml/data_extraction_rules\"\n   \
  \     android:fullBackupContent=\"@xml/backup_rules\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/Theme.ExplicitIntent\"\
  \n        tools:targetApi=\"31\">\n        <activity\n            android:name=\"\
  .SecondActivity\"\n            android:exported=\"false\" />\n        <activity\n\
  \            android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n\n\n\n\n在清单文件中创建并列出第二个活动后，现在是时候在 `MainActivity` 类中编写代码来发出意（intent）了。\n\n\
  ### 54.6 创建意（Intent）\n\n`MainActivity` 的目标是在用户点击“Send Text”按钮时创建并启动一个意。作为意创建过程的一部分，用户在\
  \ `EditText` 视图中输入的字符串将以键值对的形式添加到 `intent` 对象中。在创建 `MainActivity` 的用户界面布局时，按钮对象已配置为在被用户“点击”时调用名为\
  \ `sendText()` 的方法。现在需要按照如下方式将此方法添加到 `MainActivity` 类源文件 `MainActivity.java` 中：\n\
  \n```java\npackage com.ebookfrenzy.explicitintent;\n\n.\n.\n\nimport android.content.Intent;\n\
  \n.\n.\n\npublic class MainActivity extends AppCompatActivity {\n.\n.\n    public\
  \ void sendText(View view) {\n        Intent i = new Intent(this, SecondActivity.class);\n\
  \        String myString = binding.editText1.getText().toString();\n        i.putExtra(\"\
  qString\", myString);\n        startActivity(i);\n    }\n}\n```\n\n`sendText()`\
  \ 方法的代码遵循了“Android 意概述”中概述的技术。首先，创建一个新的 `Intent` 实例，并将当前活动和 `SecondActivity` 的类名作为参数传递。接下来，将输入\
  \ `EditText` 对象的文本以键值对的形式添加到 `intent` 对象中，并通过调用 `startActivity()` 启动意，并将 `intent`\
  \ 对象作为参数传递。\n\n编译并运行应用程序，点击“Send Text”按钮启动 `SecondActivity`。使用返回按钮（位于显示器底部的工具栏中）或在较新的\
  \ Android 版本上从屏幕边缘向右滑动返回 `MainActivity` 屏幕。\n\n### 54.7 提取意数据\n\n现在 `SecondActivity`\
  \ 已经从 `MainActivity` 启动，下一步是提取 `intent` 中包含的 `String` 数据值，并将其赋值给 `SecondActivity`\
  \ 用户界面中的 `TextView` 对象。这涉及到在 `SecondActivity.java` 源文件中 `SecondActivity` 的 `onCreate()`\
  \ 方法中添加一些代码，并且调整活动以使用视图绑定（view binding）：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  import android.content.Intent;\nimport android.view.View;\nimport com.ebookfrenzy.explicitintent.databinding.ActivitySecondBinding;\n\
  \npublic class SecondActivity extends AppCompatActivity {\n    private ActivitySecondBinding\
  \ binding;\n\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.SecondActivity);\n        binding = ActivitySecondBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ Bundle extras = getIntent().getExtras();\n        if (extras == null) {\n    \
  \        return;\n        }\n        String qString = extras.getString(\"qString\"\
  );\n        binding.textView2.setText(qString);\n    }\n}\n```\n\n在模拟器或物理 Android\
  \ 设备上编译并运行应用程序。在点击“Send Text”按钮之前，在 `MainActivity` 的文本框中输入一些文本。消息现在应该出现在 `SecondActivity`\
  \ 用户界面的 `TextView` 组件上。\n\n### 54.8 将 SecondActivity 作为子活动（Sub-Activity）启动\n\n为了让\
  \ `SecondActivity` 能够向 `MainActivity` 返回数据，必须将 `SecondActivity` 作为 `MainActivity`\
  \ 的子活动启动。这意味着我们需要调用 `registerForActivityResult()` 并声明一个在 `SecondActivity` 返回时调用的回调处理器。此回调将提取\
  \ `SecondActivity` 返回的数据并显示在 `textView1` 上。\n\n对 `registerForActivityResult()` 的调用返回一个\
  \ `ActivityResultLauncher` 实例，可以在 `sendText()` 内部调用启动意。编辑 `MainActivity.java` 文件，使其内容如下：\n\
  \n```java\n.\n.\n\nimport android.app.Activity;\nimport androidx.activity.result.ActivityResult;\n\
  import androidx.activity.result.ActivityResultCallback;\nimport androidx.activity.result.ActivityResultLauncher;\n\
  import androidx.activity.result.contract.ActivityResultContracts;\n.\n.\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n.\n.\n    ActivityResultLauncher<Intent>\
  \ startForResult = registerForActivityResult(\n            new ActivityResultContracts.StartActivityForResult(),\n\
  \            new ActivityResultCallback<ActivityResult>() {\n                @Override\n\
  \                public void onActivityResult(ActivityResult result) {\n       \
  \             if (result.getResultCode() == Activity.RESULT_OK) {\n            \
  \            Intent data = result.getData();\n                        String returnString\
  \ = data.getExtras().getString(\"returnData\");\n                        binding.textView1.setText(returnString);\n\
  \                    }\n                }\n            });\n\n    public void sendText(View\
  \ view) {\n        Intent i = new Intent(this, SecondActivity.class);\n        String\
  \ myString = binding.editText1.getText().toString();\n        i.putExtra(\"qString\"\
  , myString);\n        startActivity(i);\n        startForResult.launch(i);\n   \
  \ }\n.\n```\n\n### 54.9 从子活动返回数据\n\n`SecondActivity` 现在作为 `MainActivity` 的子活动启动，而\
  \ `MainActivity` 反之已被修改以处理从 `SecondActivity` 返回的数据。剩下的工作是修改 `SecondActivity.java`\
  \ 以实现 `finish()` 方法并添加名为 `returnText()` 的方法。`finish()` 方法在活动退出时触发（例如当用户选择设备上的返回按钮时）：\n\
  \n```java\npublic void returnText(View view) {\n    finish();\n}\n\n@Override\n\
  public void finish() {\n    Intent data = new Intent();\n    String returnString\
  \ = binding.editText2.getText().toString();\n    data.putExtra(\"returnData\", returnString);\n\
  \    setResult(RESULT_OK, data);\n    super.finish();\n}\n```\n\n`finish()` 方法创建一个新的\
  \ `intent`，将返回数据作为键值对添加，然后调用 `setResult()` 方法并传递结果代码和 `intent` 对象。`returnText()`\
  \ 方法调用 `finish()` 方法。打开 `activity_second.xml` 文件，选择按钮控件，并配置 `onClick` 属性以调用 `returnText()`\
  \ 方法。\n\n### 54.10 测试应用程序\n\n编译并运行应用程序，在 `MainActivity` 的文本字段输入一个问题，并点击“Send Text”按钮。当\
  \ `SecondActivity` 出现时，在 `EditText` 视图中输入文本，并使用返回按钮或“Return Text”按钮返回 `MainActivity`，响应应该出现在\
  \ `TextView` 对象中。\n\n### 54.11 总结\n\n在上一节中学习了意（intent）的基础知识后，本章的目标是通过在 Android Studio\
  \ 中创建一个应用程序项目，来演示显式意的使用，以及父活动与子活动之间数据传输的概念。\n\n下一节将通过示例演示隐式意的操作。\n\n## 55. Android\
  \ 隐式意 – 实例演示\n\n本章将在 Android Studio 中创建一个示例应用程序，用于演示隐式意的实际应用。目标是创建并发送一个意，请求加载并显示特定网页的内容。由于示例应用程序本身不包含能够执行此任务的活动，将发出一个隐式意，以便让\
  \ Android 意解析算法识别并启动另一个应用程序中的合适活动。这可能是 Android 操作系统附带的 Chrome 浏览器的活动。\n\n\n\n\n\n\
  在成功启动内置浏览器后，将创建一个能够显示网页的 Activity 新项目。该项目将安装到设备或模拟器上，以演示隐式意图（implicit intents）和链接验证。\n\
  \n## 55.1 创建 Android Studio 隐式意图示例项目\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中选择 `Empty\
  \ Views Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `ImplicitIntent`，并指定 `com.ebookfrenzy.implicitintent`\
  \ 为包名。由于此示例将使用仅适用于最新 Android 中的功能，在点击 `Finish` 按钮之前，请将 `Minimum API level` 设置为 `API\
  \ 31: Android 12.0 (S)`，并将 `Language` 菜单更改为 `Java`。\n\n### 55.2 设计用户界面\n\n`MainActivity`\
  \ 类的用户界面非常简单，由一个 `ConstraintLayout` 和两个 `Button` 对象组成。在 `Project` 工具窗口中，找到 `app\
  \ -> res -> layout -> activity_main.xml` 文件并双击将其加载到 `Layout Editor` 工具中。\n\n删除默认的\
  \ `TextView`，并在启用 `Autoconnect` 模式的情况下，将 `Button` 控件放置在布局中，使其显示如下：\n\n![](img/as_implicit_intent_ui.jpg)\n\
  \n图 55-1\n\n将按钮上的文本设置为 `Show Web Page` 和 `Enable Links`，并将文本提取到字符串资源。\n\n选择每个 `Button`\
  \ 并使用 `Attributes` 工具窗口配置 `onClick` 属性，分别调用名为 `showWebPage` 和 `enableLink` 的方法。\n\
  \n### 55.3 创建隐式意图\n\n如上所述，隐式意图将在名为 `showWebPage()` 的方法内部创建并发出，该方法随后需要在 `MainActivity`\
  \ 类中实现，其代码位于 `MainActivity.java` 源文件中。在 `Project` 工具窗口中找到该文件并双击将其加载到编辑面板。加载后，修改代码添加\
  \ `showWebPage()` 和 `enableLink()` 方法以及一些必要的导入语句：\n\n```java\npackage com.ebookfrenzy.implicitintent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  import android.net.Uri;\nimport android.content.Intent;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_implicit_intent);\n    }\n\n    public\
  \ void showWebPage(View view) {\n        Intent intent = new Intent(Intent.ACTION_VIEW,\n\
  \                    Uri.parse(\"https://www.ebookfrenzy.com\"));\n        startActivity(intent);\n\
  \    }\n\n    public void enableLink(View view) {\n    }\n}\n```\n\n`showWebPage()`\
  \ 方法执行的任务非常简单。首先，创建了一个新的意图对象。然而，代码并没有指定意图的类名，而是使用 `ACTION_VIEW` 选项指示了意图的性质（向用户显示某些内容）。意图对象还包含一个包含要显示的\
  \ URL 的 `URI`。这告诉 Android 意图解析系统该 Activity 正在请求显示网页。然后通过调用 `startActivity()` 方法发出意图。\n\
  \n在模拟器或物理 Android 设备上编译并运行应用程序，运行后，点击 `Show Web Page` 按钮。点击后，应该出现一个浏览器视图并加载 URL\
  \ 指定的网页。此时，一个成功的隐式意图已经执行完毕。\n\n### 55.4 添加第二个匹配的 Activity\n\n本章的剩余部分将演示设备上安装了多个符合隐式意图要求的\
  \ Activity 时的效果。将在设备或模拟器上创建并安装第二个应用程序来实现此目标。首先在 Android Studio 中创建一个新项目，应用程序名称设置为\
  \ `MyWebView`，使用与本章较早时候创建 `ImplicitIntent` 项目时相同的 SDK 配置选项，并再次选择 `Empty Views Activity`。\n\
  \n如果你有一个托管 `Digital Asset Links` 文件的网站，并想尝试自动验证，请在指定包名时使用你的网站 URL。例如，如果你的网站托管在 `www.mycompany.com`，则包名需要按如下方式设置：\n\
  \n`com.mycompany.mywebview`\n\n如果你没有网站或不打算使用自动验证，请使用以下包名：\n\n`com.ebookfrenzy.mywebview`\n\
  \n点击 `Finish` 创建项目，然后按照章节 11.8 Migrating a Project to View Binding 中的概述将项目转换为使用\
  \ view bindings。\n\n### 55.5 将 WebView 添加到 UI\n\n新 `MyWebView` 项目中包含的唯一 Activity\
  \ 的用户界面将包含一个 `Android WebView` 控件实例。在 `Project` 工具窗口中，找到 `activity_main.xml` 文件（它包含\
  \ Activity 的用户界面描述），双击将其加载到 `Layout Editor` 工具中。\n\n在设计模式下的 `Layout Editor` 工具中，选择默认的\
  \ `TextView` 控件并使用键盘删除键从布局中移除。\n\n从调色板将 `WebView` 对象拖放到现有的 `ConstraintLayout` 上，如图\
  \ 55-2 所示：\n\n![](img/as_implicit_intent_ui.jpg)\n\n图 55-2\n\n在继续之前，将 `WebView`\
  \ 的 ID 改为 `webView1`。\n\n### 55.6 获取 Intent\n\n当创建显示浏览器窗口的隐式意图时，网页将被封装在意图中。`MainActivity`\
  \ 类的任务是从意图中提取此 `Uri`，将其转换为 `URL` 并赋值给 `WebView`。为了实现这一点，修改 `MainActivity.java` 文件使其如下：\n\
  \n```java\npackage com.ebookfrenzy.mywebview;\n\nimport java.net.URL;\nimport android.net.Uri;\n\
  import android.content.Intent;\nimport android.webkit.WebView;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        handleIntent();\n\
  \    }\n\n    private void handleIntent() {\n        Intent intent = getIntent();\n\
  \        Uri data = intent.getData();\n        URL url = null;\n        try {\n\
  \            url = new URL(data.getScheme(), data.getHost(), data.getPath());\n\
  \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
  \        binding.webView1.loadUrl(url.toString());\n    }\n}\n```\n\n添加到 `onCreate()`\
  \ 方法的新代码执行了以下操作：\n\n- 获取触发此 Activity 的意图引用\n- 从意图中提取 `Uri` 数据\n- 将 `Uri` 数据转换为 `URL`\
  \ 对象\n- 将 URL 加载到 web view，在此过程中将 URL 转换为 `String`\n\n### 55.7 修改 MyWebView 项目清单文件\n\
  \n在测试之前，必须对 `MyWebView` 清单文件进行多处更改。首先，该 Activity 需要访问互联网的权限（因为它将需要加载网页）。这通过在清单文件中添加相应的权限行来实现：\n\
  \n```xml\n<uses-permission android:name=\"android.permission.INTERNET\" />\n```\n\
  \n此外，检查 `MyWebView` 项目 `AndroidManifest.xml` 文件中 `intent-filter` 部分的内容，将显示以下设置：\n\
  \n```xml\n<intent-filter>\n    <action android:name=\"android.intent.action.MAIN\"\
  \ />\n</intent-filter>\n```\n\n\n\n\n\n```xml\n<category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n</intent-filter>\n```\n\n在上述 XML 中，`android.intent.action.MAIN` 条目表示该活动在无数据输入启动时是应用程序的入口点——而\
  \ `android.intent.category.LAUNCHER` 指令则表示该活动应该列在设备的应用程序启动器屏幕上。\n\n由于该活动不需要作为应用程序的入口点启动，无法在没有数据输入（在此例中为\
  \ `URL`）的情况下运行，不需要显示在启动器中，因此在清单文件（manifest file）中不需要为此活动配置 `MAIN` 或 `LAUNCHER` 指令。\n\
  \n然而，需要修改 `MainActivity` 对应的意图过滤器（intent filter），以表明它能够处理 HTTP 数据方案的 `ACTION_VIEW`\
  \ 意图操作。\n\nAndroid 还要求，处理不包含 `MAIN` 和 `LAUNCHER` 条目的隐式意图的活动必须在意图过滤器中包含所谓的 `BROWSABLE`\
  \ 和 `DEFAULT` 类别。因此，修改后的意图过滤器部分应如下所示，其中 `<website url>` 应替换为你的网站地址或 `www.ebookfrenzy.com`，取决于你在创建\
  \ `MyWebView` 项目时使用的包名：\n\n```xml\n<intent-filter android:autoVerify=\"true\">\n\
  \    <action android:name=\"android.intent.action.VIEW\" />\n    <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n    <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n    <data android:scheme=\"https\" />\n    <data android:host=\"<website url>\"\
  />\n</intent-filter>\n```\n\n汇总这些要求后得到了如下完整的 `AndroidManifest.xml` 文件：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.mywebview\">\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyWebView\">\n        <activity\n \
  \           android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter android:autoVerify=\"true\">\n                <action\
  \ android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n                <category android:name=\"\
  android.intent.category.DEFAULT\" />\n                <data android:scheme=\"https\"\
  \ />\n                <data android:host=\"<website url>\"/>\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n通过双击 Project 工具窗口中的文件名，将\
  \ `AndroidManifest.xml` 文件加载到清单编辑器中。加载后，修改 XML 以匹配上述更改，并记得输入正确的网站 `URL`。\n\n在对清单文件进行恰当的修改后，新活动已准备好安装到设备上。\n\
  \n### 55.8 在设备上安装 MyWebView 包\n\n在 `MyWebView` 主活动可以作为隐式意图的接收者之前，它必须先安装到设备上。这是通过正常方式运行应用程序来实现的。由于清单文件中不包含\
  \ `android.intent.action.MAIN` 包含 `android.intent.category.LAUNCHER` 设置，必须指示 `Android\
  \ Studio` 只安装但不启动。要配置此项设置，请从工具栏中选择 `Edit` 菜单。\n\n### 55.9 测试应用程序\n\n通过双击 Project\
  \ 工具窗口中的文件名，将 `AndroidManifest.xml` 文件加载到清单编辑器中。加载后，修改 XML 以匹配上述更改，并记得输入正确的网站 `URL`。\n\
  \n在对清单文件进行恰当的修改后，新活动已准备好安装到设备上。\n\n### 55.10 手动启用链接\n\n在 `AndroidManifest.xml` 文件中，修改\
  \ `MainActivity` 活动对应的意图过滤器，以表明它能够处理 HTTP 数据方案的 `ACTION_VIEW` 意图操作。将 `<website url>`\
  \ 替换为你的网站地址或 `www.ebookfrenzy.com`。\n\n```xml\n<intent-filter android:autoVerify=\"\
  true\">\n    <action android:name=\"android.intent.action.VIEW\" />\n    <category\
  \ android:name=\"android.intent.category.BROWSABLE\" />\n    <category android:name=\"\
  android.intent.category.DEFAULT\" />\n    <data android:scheme=\"https\" />\n  \
  \  <data android:host=\"<website url>\"/>\n</intent-filter>\n```\n\n### 55.11 自动链接验证\n\
  \n如果你在创建 `MyWebView` 包名时使用了你自己的网站 `URL`，现在可以执行自动验证的额外步骤了。首先从设备或模拟器上卸载 `MyWebView`\
  \ 应用。在网站上放置 Digital Links 文件后，我们将重新安装应用以触发验证过程。\n\n### 55.12 总结\n\n\n\n\n\n隐式意图（Implicit\
  \ intents）提供了一种机制，一个活动可以通过指定操作类型以及可选的执行该操作所需的数据，来请求另一个服务的服务。然而，要成为隐式意图的目标候选者，活动必须配置为从传入的意图对象中提取适当的数据，并包含在配置正确的清单文件中，包括适当的权限和意图过滤器。包含目标活动的应用程序还必须通过数字资产链接（Digital\
  \ Asset Links）文件进行验证，或者由用户手动启用。\n\n在本在本章中，创建了一个示例来演示如何发送隐式意图、创建一个能够处理此类意图的示例活动，以及链接验证过程。\n\
  \n## 56. Android 广播意图与广播接收器\n\n意图（intents）除了提供启动应用程序机制外，还用于向系统的其他组件广播系统范围的消息。这涉及到广播意图（Broadcast\
  \ Intents）和广播接收器（Broadcast Receivers）的实现，两者都是本章的主题。\n\n### 56.1 广播意图概述\n\n广播意图是\
  \ `Intent` 对象，通过调用 `Activity` 类的 `sendBroadcast()`、`sendStickyBroadcast()` 或 `sendOrderedBroadcast()`\
  \ 方法进行广播（后者在需要广播结果时使用）。除了在应用程序组件之间提供消息和事件系统外，广播意图还被 Android 系统用于通知感兴趣的应用程序关键系统事件（例如外部电源或耳机的连接或断开连接）。\n\
  \n当创建一个广播意图时，它必须包含一个操作字符串（action string）、可选数据和一个类别字符串（category string）。与标准意图一样，数据是使用意图对象的\
  \ `putExtra()` 方法结合键值对被添加到广播意图中的。可选的类别字符串可以通过调用 `addCategory()` 方法分配给广播意图。\n\n标识广播事件的操作字符串必须是唯一的，并且通常使用应用程序的包名语法。例如，以下代码段创建并发送了一个广播意图，包括一个唯一的操作字符串和数据：\n\
  \n```java\nIntent intent = new Intent();\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n```\n\n上述代码将在 Android\
  \ 3.0 之前的 Android 设备上成功启动相应的广播接收器。然而，在较新版本的 Android 中，广播接收器将无法接收到该意图。这是因为 Android\
  \ 3.0 引入了启动控制安全措施，防止通过意图启动已停止应用程序的组件。如果应用程序刚刚安装且尚未启动过，或者被用户使用设备上的应用程序管理器手动停止，则该应用程序被认为处于停止状态。但为了解决这个问题，可以在发送意图之前为其添加一个标记，以指示允许该意图启动停止应用程序的组件。该标记是\
  \ `FLAG_INCLUDE_STOPPED_PACKAGES`，并将按照此处对之前代码段的适配进行使用：\n\n```java\nIntent intent\
  \ = new Intent();\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\nintent.setAction(\"\
  com.example.Broadcast\");\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n\
  ```\n\n### 56.2 广播接收器概述\n\n应用程序通过注册广播接收器来监听特定的广播意图。广播接收器是通过扩展 `Android BroadcastReceiver`\
  \ 类并重写 `onReceive()` 方法来实现的。广播接收器可以在代码中（例如，在活动内）或清单文件中注册。注册实现的一部分包括创建意图过滤器（intent\
  \ filters），以指示接收器需要监听的特定广播意图。这是通过引用广播意图的操作字符串来实现的。当检测到匹配的广播时，会调用广播接收器的 `onReceive()`\
  \ 方法，此时该方法有 5 秒钟在返回之前执行任何必要的任务。需要注意的是，广播接收器不需要持续运行。如果检测到匹配的意图，Android 运行时系统会在调用\
  \ `onReceive()` 方法之前自动启动广播接收器。\n\n以下代码概述了一个广播接收器子类的模板：\n\n```java\npackage com.example.broadcastdetector;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver {\n\
  \    public MyReceiver() {\n\n    }\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // 在此处实现当检测到\n        // 广播时要执行的代码\n    }\n\
  }\n```\n\n在清单文件中注册广播接收器时，必须为该接收器添加 `<receiver>` 条目。\n\n以下示例清单文件注册了上述示例广播接收器：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.example.broadcastdetector.broadcastdetector\"\n    android:versionCode=\"\
  1\"\n    android:versionName=\"1.0\" >\n    <uses-sdk android:minSdkVersion=\"17\"\
  \ />\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\" >\n        <receiver android:name=\"MyReceiver\" >\n        </receiver>\n\
  \    </application>\n</manifest>\n```\n\n在 Android 8.0 之前的 Android 版本上运行时，与接收器关联的意图过滤器可以放在清单文件的接收器元素中，如下：\n\
  \n```xml\n<receiver android:name=\"MyReceiver\" >\n    <intent-filter>\n       \
  \ <action android:name=\"com.example.Broadcast\" >\n        </action>\n    </intent-filter>\n\
  </receiver>\n```\n\n在 Android 8.0 或更高版本上，必须在代码中使用 `Activity` 类的 `registerReceiver()`\
  \ 方法结合适当配置的 `IntentFilter` 对象来注册接收器：\n\n```java\nIntentFilter filter = new IntentFilter(\"\
  com.example.Broadcast\");\nMyReceiver receiver = new MyReceiver();\nregisterReceiver(receiver,\
  \ filter);\n```\n\n当代码中注册的广播接收器不再需要时，可以通过调用活动类的 `unregisterReceiver()` 方法来取消注册，并传递接收器对象的引用作为参数。例如，以下代码将注销上述广播接收器：\n\
  \n```java\nunregisterReceiver(receiver);\n```\n\n需要记住，某些系统广播意图只有当接收器在代码中而不是在清单文件中注册时才能被检测到。可以在在线查看\
  \ `Intent` 类文档以获取系统广播意图和相应要求的详细概述：\n\nhttps://developer.android.com/reference/android/content/Intent\n\
  \n## 56.3 获取广播结果\n\n当使用 `sendBroadcast()` 方法发送广播意图时，启动活动无法从任何获取广播的广播接收器接收结果。如果需要返回结果，则必须使用\
  \ `sendOrderedBroadcast()` 方法。当使用此方法发送广播意图时，它将按顺序传递给每个感兴趣的广播接收器。\n\n\n\n\n\n`sendOrderedBroadcast()`\
  \ 方法接收几个参数，其中包含一个指向另一个广播接收器的引用（称为结果接收器），当所有其他广播接收器都处理了意图后，将通知该接收器，以及一组数据引用，这些接收器可以将结果数据放入这些引用中。当所有广播接收器都获得了机会处理广播时，结果接收器的\
  \ `onReceive()` 方法将被调用并传递结果数据。\n\n## 56.4 粘性广播意图 (Sticky Broadcast Intents)\n\n\
  默认情况下，广播意图在发送并被感兴趣的接收器处理后就会消失。然而，可以将广播意图定义为“粘性”。粘性意图及其包含的数据在执行完成后仍保留在系统中。粘性广播意图中存储的数据可以通过调用\
  \ `registerReceiver()` 方法的返回值获取，该方法使用常用的参数（广播接收器引用和意图过滤器对象）。许多 Android 系统广播都是粘性的，一个典型的例子是与电量状态状态的广播。\n\
  \n可以通过调用 `removeStickyBroadcast()` 方法随时移除粘性广播，并将要移除的广播意图引用作为参数传递。\n\n## 56.5 广播意图示例\n\
  \n本章的剩余部分将通过实现一个基于 Android Studio 的广播意图运行示例。在第一个实例中，将创建一个简单的应用程序来发出自定义广播意图。随后将创建一个相应的广播接收器，在检测到广播时在\
  \ Android 设备的显示屏上显示消息。最后，将修改广播接收器以检测系统发出的设备外部电源已断开的通知。\n\n## 56.6 创建示例应用程序\n\n从欢迎屏幕上选择“New\
  \ Project”（新建项目）选项，在弹出的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty Views Activity”模板。\n\n\
  在 Name 字段中输入 `SendBroadcast`，并指定 `com.ebookfrenzy.sendbroadcast` 为包名。在点击“Finish”（完成）按钮之前，将\
  \ Minimum API level 设置更改为 API 26: Android 8.0 (Oreo)，并将 Language（语言）菜单设置为 Java。\n\
  \n一旦创建了新项目，在 Project 工具窗口的 `app -> res -> layout` 下找到并加载 `activity_main.xml` 布局文件，并在\
  \ Design 模式下使用 Layout Editor 工具，将 `TextView` 对象替换为 `Button` 视图，并设置文本属性使其显示为“Send\
  \ Broadcast”。设置文本值后，按照通常步骤将字符串提取为名为 `send_broadcast` 的资源。\n\n在布局中仍选中按钮的情况下，在 Attributes（属性）面板中找到\
  \ `onClick` 属性并将其配置为调用名为 `broadcastIntent` 的方法。\n\n## 56.7 创建并发送广播意图\n\n创建 `SendBroadcast`\
  \ 应用程序的框架后，现在是实现发送广播意图代码了。这涉及之前指定的 `broadcastIntent()` 方法，该方法是用户界面中 `Button` 视图的\
  \ `onClick` 目标。找到并双击 `MainActivity.java` 文件，修改它以添加创建和发送广播意图的代码。修改后，该类的源代码应如下：\n\n\
  ```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.content.Intent;\n\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    public\
  \ void broadcastIntent(View view)\n    {\n\n        Intent intent = new Intent();\n\
  \        intent.setAction(\"com.ebookfrenzy.sendbroadcast\");\n        intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\
  \        sendBroadcast(intent);\n    }\n}\n```\n\n注意，在此实例中，意图的 action 字符串为 `com.ebookfrenzy.sendbroadcast`。在本章后面的章节中创建广播接收器类时，意图过滤器声明必须匹配此\
  \ action 字符串。\n\n发送广播意图的应用程序创建此结束。剩下的就是构建一个匹配的广播接收器。\n\n## 56.8 创建广播接收器\n\n要创建广播接收器，需要创建一个子自\
  \ `BroadcastReceiver` 父类的新类。在 Project 工具窗口中，导航到 `app -> java` 并右键点击包名。从弹出的菜单中选择\
  \ New -> Other -> Broadcast Receiver 选项，将类命名为 `MyReceiver`，并确保选择了 Exported（导出）和\
  \ Enabled（启用）选项。这些设置允许 Android 系统在需要时启动接收器，并确保该类能够接收其他应用程序发送的消息。配置好类后，点击 Finish。\n\
  \n一旦创建，Android Studio 将自动将新的 `MyReceiver.java` 类文件加载到编辑器中，其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\n\
  import android.content.Context;\n\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n\n        // TODO: 当 BroadcastReceiver 接收到\n      \
  \  // Intent 广播时会调用此方法。\n\n        throw new UnsupportedOperationException(\"Not\
  \ yet implemented\");\n\n    }\n}\n```\n\n如代码所示，Android Studio 生成了类的模板和 `onReceive()`\
  \ 方法的存根。需要对类进行一些更改以实现所需的行为。因此，留在 `MyReceiver.java` 文件中，修改代码如下：\n\n```java\npackage\
  \ com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.widget.Toast;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n    @Override\n    public\
  \ void onReceive(Context context, Intent intent) {\n        // TODO: 当 BroadcastReceiver\
  \ 接收到\n        // Intent 广播时会调用此方法。\n\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n        Toast.makeText(context, \"Broadcast Detected.\"\
  , Toast.LENGTH_LONG).show();\n    }\n}\n```\n\n广播接收器的代码现在完成了。\n\n## 56.9 注册广播接收器\n\
  \n项目需要公示广播接收器的存在，并必须包含一个意图过滤器来指定接收器感兴趣的广播意图。在上一节创建 `BroadcastReceiver` 类时，Android\
  \ Studio 自动在清单文件中添加了 `<receiver>` 元素。因此，剩下的就是在 `MainActivity.java` 文件中添加代码以创建意图过滤器并注册接收器：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\n.\n\n.\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.IntentFilter;\n\n...\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n    BroadcastReceiver receiver;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        configureReceiver();\n\
  \    }\n\n    private void configureReceiver() {\n        IntentFilter filter =\
  \ new IntentFilter();\n        filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n        receiver = new MyReceiver();\n        registerReceiver(receiver, filter);\n\
  \    }\n\n...\n\n}\n```\n\n```java\n@Override\nprotected void onDestroy() {\n  \
  \  super.onDestroy();\n    unregisterReceiver(receiver);\n}\n```\n\n## 56.10 测试广播示例\n\
  \n\n\n\n要测试广播发送者和接收者，请在设备或 AVD 上运行 `SendBroadcast` 应用并等待其显示在屏幕上。一旦运行，点击按钮，此时应该弹出“Broadcast\
  \ Intent Detected.”的 toast 消息，持续几秒钟后消失。\n\n## 56.11 监听系统广播\n\n此示例的最后一个阶段是修改广播接收器的意图过滤器（intent\
  \ filter），以监听当外部电源从设备断开时广播系统意图。该操作是 `android.intent.action.ACTION_POWER_DISCONNECTED`。修改\
  \ `MainActivity.java` 文件中的 `configureReceiver()` 方法以添加此过滤器：\n\n```java\nprivate\
  \ void configureReceiver() {\n    IntentFilter filter = new IntentFilter();\n  \
  \  filter.addAction(\"com.ebookfrenzy.sendbroadcast\");\n    filter.addAction(\n\
  \            \"android.intent.action.ACTION_POWER_DISCONNECTED\");\n    receiver\
  \ = new MyReceiver();\n    registerReceiver(receiver, filter);\n}\n```\n\n由于 `MyReceiver.java`\
  \ 文件中的 `onReceive()` 方法现在将监听两种类型的广播意图，因此值得修改代码，使当前意图的动作字符串也显示在 toast 消息中。该字符串可以通过调用作为\
  \ `onReceive()` 方法参数的 intent 对象的 `getAction()` 方法获取：\n\n```java\npublic void onReceive(Context\
  \ context, Intent intent) {\n    String message = \"Broadcast intent detected \"\
  \n                      + intent.getAction();\n    Toast.makeText(context, message,\n\
  \            Toast.LENGTH_LONG).show();\n}\n```\n\n通过重新安装修改后的 `SendBroadcast` 包来测试接收器。在\
  \ `SendBroadcast` 应用中点击按钮现在应该产生一个包含自定义动作字符串的新消息：\n\n`Broadcast intent detected com.ebookfrenzy.sendbroadcast`\n\
  \n接下来，移除当前为 Android 设备供电 USB 连接器，此时接收器应该在 toast 消息中报告以下内容（在竖屏设备上，消息可能会被截断）。如果应用在模拟器上运行，请显示扩展控制，选择\
  \ Battery 选项并将 Charger 连接设置设置为 None。\n\n`Broadcast intent detected android.intent.action.ACTION_POWER_DISCONNECTED`\n\
  \n为了避免每次设备断开电源时都出现此消息，请启动 Settings（设置）应用并选择 Apps 选项。从结果列表中选择 `SendBroadcast` 应用并点击\
  \ Uninstall（卸载）按钮。\n\n### 56.12 总结\n\n广播意图（Broadcast intents）是一种机制，可以发布意图供 Android\
  \ 系统上的多个组件消费。通过注册广播接收器（Broadcast Receiver）检测广播，接收器被配置为监听匹配特定动作字符串的意图。通常情况下，广播接收器保持休眠状态，直到检测到匹配的意图时由系统唤醒。Android\
  \ 系统还使用广播意图来发布事件通知，例如低电警告或外部电源与设备的连接或断开。\n\n本章除了提供广播意图和接收器的概述外，还通过发送广播意图并实现广播接收器的示例，来监听自定义和系统广播意图。\n\
  \n## 57. Android 本地绑定服务 – 示例\n\n正如前一节所述，绑定服务（Bound services）提供了一种实现 Android 服务与一个或多个客户端组件之间通信的机制。本章在“Android\
  \ 服务概览”中提供的绑定服务概述的基础上，开始本地绑定服务的示例实现。\n\n### 57.1 理解绑定服务\n\n提供绑定服务是为了允许应用程序在后台执行任务。多个客户端组件可以绑定到一个绑定服务，并在绑定后使用各种机制与该服务进行交互。\n\
  \n绑定服务作为 `Android Service` 类的子类被创建，并且至少必须实现 `onBind()` 方法。客户端组件通过调用 `bindService()`\
  \ 方法绑定到服务。对绑定服务的首次绑定请求将导致调用该服务的 `onBind()` 方法（随后的绑定请求不会触发 `onBind()` 调用）。想要绑定到服务的客户端还必须实现一个\
  \ `ServiceConnection` 子类，该子类包含 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 方法，这些方法分别在客户端-服务器连接建立或断开后被调用。在 `onServiceConnected()` 方法中，将传递一个 `IBinder` 对象，该对象包含了客户端与服务交互所需的信息。\n\
  \n### 57.2 绑定服务交互选项\n\n存在两种推荐的实现客户端组件与绑定服务之间交互的机制。假设该绑定服务是本地的，并且与客户端组件属于同一个应用程序（私有的，换句话说，它在同一个进程中运行，对其他应用程序中的组件不可用）。在这种情况下，推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。该 `Binder` 对象的实例由 `onBind()` 方法返回，随后被客户端组件用于直接访问服务中持有的方法和数据。\n\
  \n当绑定服务不是应用程序的本地服务时（换句话说，它在与客户端组件不同的进程中运行），最佳交互方式是使用 `Messenger/Handler` 实现。在本章的剩余部分中，将创建一个示例来演示创建、启动和与本地绑定服务交互的涉及步骤。\n\
  \n### 57.3 绑定服务示例\n\n在本章剩余部分创建的示例应用将由单个 activity 和一个绑定服务组成。绑定服务的目的是从系统获取当前时间并将该信息返回给\
  \ activity，并在其中显示。该绑定服务将是本地的且对同一应用程序私有。\n\n从欢迎界面选择 New Project 选项，在新项目对话框中，选择 Empty\
  \ Views Activity 模板然后点击 Next 按钮。\n\n在 Name 字段输入 `LocalBound`，指定 `com.ebookfrenzy.localbound`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 改为 `API 26: Android 8.0 (Oreo)`并将 Language\
  \ 菜单改为 Java。使用 11.8 迁移项目到视图绑定中的步骤将项目迁移到视图绑定。\n\n项目创建完成后，下一步是添加一个新类作为绑定服务。\n\n###\
  \ 57.4 为项目添加绑定服务\n\n要在项目中添加新类，请在 Project 工具窗口中右键点击包名（位于 app -> java -> com.ebookfrenzy.localbound），选择\
  \ New -> Service -> Service 选项。指定 BoundService 为类名，并在点击 Finish 创建类之前，确保勾选了 Exported\
  \ 和 Enabled 选项。Android Studio 将将 `BoundService.java` 文件加载到编辑器中，其内容如下：\n\n```java\n\
  package com.ebookfrenzy.localbound;\n\nimport android.app.Service;\nimport android.content.Intent;\n\
  import android.os.IBinder;\n\npublic class BoundService extends Service {\n    public\
  \ BoundService() {\n    }\n\n    @Override\n    public IBinder onBind(Intent intent)\
  \ {\n        // TODO: 返回到服务的通信通道。\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n    }\n}\n```\n\n### 57.5 实现 Binder\n\n\n\n\n\n如前所述，本地绑定服务可以通过向客户端传递配置适当的\
  \ `Binder` 对象来与客户端进行通信。这是通过在绑定服务类内部创建一个 `Binder` 子类，并通添加一个或多个客户端可以调用的新方法来扩展来实现的。这通常涉及实现一个返回绑定服务实例引用的方法。有了该实例的引用，客户端就可以访问绑定服务中的数据并调用其中的方法。\n\
  \n对于此示例，需要对前一节中创建的 `BoundService` 类模板进行一些更改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为 `getService()`\
  \ 的方法，该方法将返回当前服务对象实例的引用（由 `this` 关键字表示）。考虑到这些要求，编辑 `BoundService.java` 文件并进行如下修改：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\n\
  import android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        // TODO: Return the communication\
  \ channel to the service.\n        throw new UnsupportedOperationException(\"Not\
  \ yet implemented\");\n    }\n\n    public class MyLocalBinder extends Binder {\n\
  \        BoundService getService() {\n            return BoundService.this;\n  \
  \      }\n    }\n}\n```\n\n对类进行更改后，值得花一点时间回顾一下这里执行的步骤。首先，声明了一个 `Binder` 的新子类（命名为\
  \ `MyLocalBinder`）。该类包含一个返回 `BoundService` 类当前实例引用的方法。创建 `MyLocalBinder` 类的的新实例并将其赋值给\
  \ `myBinder` `IBinder` 引用（由于 `Binder` 是 `IBinder` 的子类，因此在此赋值中不存在类型匹配）。\n\n接下来，需要修改\
  \ `onBind()` 方法以返回 `myBinder` 对象的引用，并实现一个新的公共方法，以便在任何绑定到服务的客户端调用时返回当前时间：\n\n```java\n\
  package com.ebookfrenzy.localbound;\n\nimport java.text.SimpleDateFormat;\n\nimport\
  \ java.util.Date;\nimport java.util.Locale;\n\nimport android.app.Service;\n\nimport\
  \ android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        return myBinder;\n    }\n\n\
  \    public String getCurrentTime() {\n        SimpleDateFormat dateformat =\n \
  \           new SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\",\n                Locale.US);\n\
  \        return (dateformat.format(new Date()));\n    }\n\n    public class MyLocalBinder\
  \ extends Binder {\n        BoundService getService() {\n            return BoundService.this;\n\
  \        }\n    }\n}\n```\n\n此时，绑定服务已完成，并已准备好添加到项目清单文件中。在 Project 工具窗口中找到并双击 `LocalBound`\
  \ 项目的 `AndroidManifest.xml` 文件，一旦加载到 Manifest 编辑器，请验证 Android Studio 是否已如下添加了服务的\
  \ `<service>` 条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.localbound.localbound\"\
  \ >\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:theme=\"\
  @style/App\" >\n        <service\n            android:name=\".BoundService\"\n \
  \           android:enabled=\"true\"\n            android:exported=\"true\" >\n\
  \        </service>\n        <activity\n            android:name=\".MainActivity\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n下一阶段是在 activity 中编写代码以绑定服务并调用 `getCurrentTime()` 方法。\n\n### 57.6 将客户端绑定到服务\n\
  \n在本教程中，客户端是运行应用程序的 `MainActivity` 实例。如前所述，为了成功绑定到服务并接收服务 `onBind()` 方法返回的 `IBinder`\
  \ 对象，必须创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 回调方法。编辑 `MainActivity.java` 文件并进行如下修改：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.os.IBinder;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    final private ServiceConnection myConnection = new ServiceConnection()\
  \ {\n        @Override\n        public void onServiceConnected(ComponentName className,\
  \ IBinder service) {\n            MyLocalBinder binder = (MyLocalBinder) service;\n\
  \            myService = binder.getService();\n            isBound = true;\n   \
  \     }\n\n        @Override\n        public void onServiceDisconnected(ComponentName\
  \ name) {\n            isBound = false;\n        }\n    };\n}\n```\n\n### 57.7 完成示例\n\
  \n剩下的工作是添加一种调用 `getCurrentTime()` 方法并将结果显示给用户的机制。按照习惯，Android Studio 会为 activity\
  \ 创建一个仅包含 `TextView` 的模板 `activity_main.xml` 文件。将此文件加载到布局编辑器中，使用设计模式选择 `TextView`\
  \ 组件并将 ID 改为 `myTextView`。在 `TextView` 下方添加 `Button` 视图，并将按钮上的文本改为“Show Time”，将文本提取到名为\
  \ `show_time` 的字符串资源中。完成这些更改后，当客户端成功绑定到服务时，方法将作为参数接收服务 `onBind()` 方法返回的 `IBinder`\
  \ 对象。该参数被强制转换为 `MyLocalBinder` 类型对象。然后调用 binder 对象的 `getService()` 方法以获取服务的实例引用，该引用随后赋值给\
  \ `myService`。一个布尔标志表示连接已成功建立。\n\n当连接结束时，调用 `onServiceDisconnected()` 方法并将布尔标志设为\
  \ false。\n\n建立连接后，下一步是修改 activity 以绑定服务。这涉及创建一个 `intent` 并调用 `bindService()` 方法，这可以在\
  \ activity 的 `onCreate()` 方法中执行：\n\n```java\n@Override\npublic void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(this, BoundService.class);\n    bindService(intent,\
  \ myConnection, Context.BIND_AUTO_CREATE);\n}\n```\n\n\n\n通过选择 `Button` 并配置 `onClick`\
  \ 属性调用名为 `showTime` 的方法来完成用户界面设计。\n\n最后，编辑 `MainActivity.java` 文件代码以实现 `showTime()`\
  \ 方法。该方法调用服务的 `getCurrentTime()` 方法（得益于 `onServiceConnected()` 方法，现在可以通过 `myService`\
  \ 引用从 activity 访问它），并将结果字符串赋值给 `TextView`：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \n.\n\n.\n\nimport android.widget.TextView;\n\nimport com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    BoundService myService;\n\
  \n    boolean isBound = false;\n\n    public void showTime(View view)\n    {\n \
  \       String currentTime = myService.getCurrentTime();\n        TextView myTextView\
  \ = findViewById(R.id.myTextView);\n        myTextView.setText(currentTime);\n \
  \   }\n.\n.\n\n}\n```\n\n## 57.8 测试应用程序\n\n代码更改完成后，对应用程序进行测试运行。一旦可见，触摸按钮并注意文本视图更改为显示当前的日期和时间。该示例已成功启动并绑定到一个服务，然后调用该服务的方法来执行任务，并将结果返回给活动。\n\
  \n## 57.9 总结\n\n当绑定的服务是本地且对某个应用程序私有的时，该应用程序中的组件可以无需借助进程间通信（IPC）即可与服务进行交互。通常情况下，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含指向运行中的服务实例的引用。客户端组件实现 `ServiceConnection`\
  \ 子类，其中包含在服务连接和断开连接时调用的回调方法。前一个方法将接收由 `onBind()` 方法返回的 `IBinder` 对象，允许调用服务中的公共方法。\n\
  \n在涵盖了本地绑定服务的实现后，下一章将重点关注如何使用 IPC 与远程绑定服务进行交互。\n\n## 58. Android 远程绑定服务 – 实例示例\n\
  \n在专门用于 Android 服务的最后一个章节中，将开发一个示例应用程序，以演示使用 `messenger` 和 `handler` 配置来促进客户端与远程绑定服务之间的交互。\n\
  \n### 58.1 客户端到远程服务的通信\n\n如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回包含服务对象引用的 `IBinder` 对象来实现。然而，对于远程服务而言，这种方法不可行，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\
  \n在远程服务的情况下，必须创建一个 `Messenger` 和 `Handler` 配置，允许消息跨越客户端和服务之间的进程边界进行传递。\n\n具体而言，服务会创建一个\
  \ `Handler` 实例，当接收到客户端的消息时将调用它。在初始化方面，`Handler` 的职责是创建一个 `Messenger` 对象，该对象反过来创建一个\
  \ `IBinder` 对象并在 `onBind()` 方法中返回给客户端。客户端使用此 `IBinder` 对象创建 `Messenger` 对象的实例，随后向服务处理器发送消息。客户端每发送一条消息，处理器的\
  \ `handleMessage()` 方法就会被调用一次，并传递 `message` 对象。\n\n本章创建的示例将包含一个在单独进程中运行的 activity\
  \ 和绑定服务。`Messenger/Handler` 机制将向服务发送字符串，该字符串将显示在 `Logcat` 输出中。\n\n### 58.2 创建示例应用程序\n\
  \n在欢迎界面上选择 `New Project` 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `RemoteBound` 并指定 `com.ebookfrenzy.remotebound` 为包名。在点击\
  \ `Finish` 按钮之前，将 Minimum API level 设置更改为 `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为\
  \ `Java`。\n\n### 58.3 设计用户界面\n\n在 Project 工具窗口中找到 `activity_main.xml` 文件并双击它将其加载到\
  \ Layout Editor 工具中。在 Design 模式的 Layout Editor 工具下，右键点击默认的 `TextView` 实例，选择 `Convert\
  \ view...` 菜单选项，从弹出的对话框中选择 `Button` 视图并点击 `Apply`。将按钮的文本属性更改为“Send Message”，并将字符串提取到名为\
  \ `send_message` 的新资源中。\n\n最后，配置 `onClick` 属性调用名为 `sendMessage` 的方法。\n\n### 58.4\
  \ 实现远程绑定服务\n\n要实现此示例的远程绑定服务，在 Project 工具窗口中右键点击包名（位于 `app -> java` 下），并选择 `New ->\
  \ Service -> Service` 菜单选项来向项目添加新类。指定 `RemoteService` 为类名，并在点击 `Finish` 创建类之前确保勾选了\
  \ `Exported` 和 `Enabled` 选项。\n\n下一步是为新服务实现处理器类。这通过扩展 `Handler` 类并实现 `handleMessage()`\
  \ 方法来实现。该方法将在接收到来自客户端的消息时被调用。它将接收一个 `Message` 对象作为参数，其中包含客户端需要传递给服务的任何数据。在本例中，这将是一个包含要显示给用户的字符串的\
  \ `Bundle` 对象。实现后，`RemoteService.java` 文件中的修改后的类如下：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\
  \nimport android.app.Service;\n\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\n\
  import android.os.Message;\nimport android.os.Messenger;\nimport android.util.Log;\n\
  \npublic class RemoteService extends Service {\n    public RemoteService() {\n \
  \   }\n\n    static class IncomingHandler extends Handler {\n        String TAG\
  \ = \"RemoteService\";\n\n        public IncomingHandler() {\n            super(Looper.getMainLooper());\n\
  \        }\n\n        @Override\n        public void handleMessage(Message msg)\
  \ {\n            Bundle data = msg.getData();\n            String dataString = data.getString(\"\
  MyString\");\n            Log.i(TAG, \"Message = \" + dataString);\n        }\n\
  \    }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        //\
  \ TODO: 返回服务的通信通道\n        throw new UnsupportedOperationException(\"Not yet implemented\"\
  );\n    }\n}\n```\n\n实现处理器后，服务代码方面剩余的任务是修改 `onBind()` 方法，使其返回一个包含 `Messenger` 对象的\
  \ `IBinder` 对象，该对象反过来包含对处理器的引用：\n\n```java\nfinal Messenger myMessenger = new Messenger(new\
  \ IncomingHandler());\n\n@Override\npublic IBinder onBind(Intent intent) {\n   \
  \ return myMessenger.getBinder();\n}\n```\n\n### 58.5 在 Manifest 文件中配置远程服务\n\n\n\
  \n\n\n为了准确描绘客户端与远程服务之间的通信，有必要配置该服务使其与应用程序的其他部分分离开运行。这通过在清单文件中 `<service>` 标签内为服务添加\
  \ `android:process` 属性来实现。为了启动远程服务，还需要为该服务提供一个意图过滤器（intent filter）。要实现此更改，请修改 `AndroidManifest.xml`\
  \ 文件添加所需的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.remotebound\"\
  \ >\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\" >\n        <service\n        \
  \    android:name=\".RemoteService\"\n            android:enabled=\"true\"\n   \
  \         android:exported=\"true\"\n            android:process=\":my_process\"\
  \ >\n        </service>\n        <activity\n            android:name=\".MainActivity\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n## 58.6 启动并绑定到远程服务\n\n与本地绑定服务一样，客户端组件需要实现 `ServiceConnection` 类的实例，并包含 `onServiceConnected()`\
  \ 和 `onServiceDisconnected()` 方法。同样，与本地服务相同，`onServiceConnected()` 方法将接收由远程服务的 `onBind()`\
  \ 方法返回的 `IBinder` 对象，该对象将用于向服务器处理程序发送消息。在本例中，客户端是 `MainActivity`，其代码位于 `MainActivity.java`\
  \ 中。加载此文件并进行修改，添加 `ServiceConnection` 类，以及一个用于存储接收到的 `Messenger` 对象引用的变量，连同一个指示连接是否建立的\
  \ `Boolean` 标志位：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.os.Message;\n\
  import android.os.Messenger;\nimport android.os.RemoteException;\nimport android.content.ComponentName;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.ServiceConnection;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Messenger myService = null;\n    boolean isBound;\n\n    @Override\n  \
  \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    final private ServiceConnection\
  \ myConnection =\n            new ServiceConnection() {\n                public\
  \ void onServiceConnected(\n                            ComponentName className,\n\
  \                            IBinder service) {\n                    myService =\
  \ new Messenger(service);\n                    isBound = true;\n               \
  \ }\n                public void onServiceDisconnected(\n                      \
  \      ComponentName className) {\n                    myService = null;\n     \
  \               isBound = false;\n                }\n            };\n```\n\n接下来，必须添加一些代码来绑定到远程服务。这涉及创建一个与清单文件中声明的服务的意图过滤器相匹配的意图（intent），并调用\
  \ `bindService()` 方法，将意图和 `ServiceConnection` 实例引用作为参数提供。对于此示例，代码将在 Activity 的 `onCreate()`\
  \ 方法中实现：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(getApplicationContext(), RemoteService.class);\n\
  \    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n}\n```\n\n##\
  \ 58.7 向远程服务发送消息\n\n在测试应用程序之前，剩下的工作是在 `MainActivity` 类中实现 `sendMessage()` 方法，该方法被配置为在用户触摸界面上的按钮时调用。此方法需要检查服务是否已连接，创建一个包含由服务器显示的的字符串的\
  \ `bundle` 对象，将其添加到 `Message` 对象中，并发送到服务器：\n\n```java\npublic void sendMessage(View\
  \ view) {\n    if (!isBound) return;\n    Message msg = Message.obtain();\n    Bundle\
  \ bundle = new Bundle();\n    bundle.putString(\"MyString\", \"Message Received\"\
  );\n    msg.setData(bundle);\n    try {\n        myService.send(msg);\n    } catch\
  \ (RemoteException e) {\n        e.printStackTrace();\n    }\n}\n```\n\n代码更改完成后，编译并运行应用程序。加载后，打开\
  \ `Logcat` 工具窗口并在过滤器字段中输入以下内容：\n\n`package:mine tag:RemoteService`\n\n在保持 `Logcat`\
  \ 工具窗口可见的情况下，点击用户界面上的按钮，此时日志消息应如下所示：\n\n`Message = Message Received`\n\n### 58.8\
  \ 总结\n\n为了实现客户端与远程绑定服务之间的交互，应用程序必须实现一个处理器/消息通信框架。该技术背后的基本概念在本章中已经涵盖，并包含了用于演示客户端与绑定服务之间通信的示例应用程序实现。\n\
  \n## 59. Java 线程、处理器和执行器概述\n\n线程是多任务操作系统的基石，可以被认为是运行在进程中的微进程，其目的是实现应用程序的并行执行。在本章中，我们将探讨线程在\
  \ Android 开发中的应用，并演示如何创建和管理它们。\n\n### 59.1 主线程\n\n当 Android 应用程序启动时，运行时系统会创建一个所有组件默认运行在其中的单线程。该线程通常被称为主线程。主线程的主要作用是处理用户界面的事件和交互。应用程序中启动的任何额外组件默认也会运行在主线程上。\n\
  \n应用程序中任何使用主线程执行耗时任务的组件都会导致整个应用程序看起来被锁定，直到任务完成。这通常会导致操作系统向用户显示“应用程序无响应”的警告。显然，这并不是任何应用程序期望的行为。这可以通过将将要执行的任务启动在单独线程中来避免，从而让主线程不受干扰地继续处理其他任务。\n\
  \n\n\n\n\n如果线程中执行的代码需要与用户界面交互，它必须通过与主 UI 线程进行同步来实现。这是通过在主线程中创建一个处理器（handler）实现的，由该处理器接收来自另一个线程的消息并相应地更新用户界面。\n\
  \n# 59.3 线程示例\n\n本章的剩余部分将通过一些简单的示例，旨在对线程提供基础介绍。第一步将强调在主线程之外的线程中执行耗时任务的重要性。\n\n启动\
  \ Android Studio，在欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `ThreadExample`，并指定 `com.ebookfrenzy.threadexample` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单设置为 `Java`。按照第 11.8 Migrating a Project to View Binding 节中的步骤，将项目转换为使用 view\
  \ binding。\n\n# 59.4 构建应用\n\n将项目的 `activity_main.xml` 文件加载到 `Layout Editor` 工具中。选择默认的\
  \ `TextView` 组件，并在 `Properties` 工具窗口中将视图的 `ID` 改为 `myTextView`。\n\n在用户界面上添加一个 `Button`\
  \ 视图，直接位于现有 `TextView` 对象下方，如图图 59-1 所示。添加按钮后，点击工具栏上的 `Infer Constraints` 按钮以添加缺失的约束。\n\
  \n将文本改为“Press Me”，并将字符串提取为名为 `press_me` 的资源。在布局中仍选中按钮视图的情况下，找到 `onClick` 属性并输入 `buttonClick`\
  \ 作为方法名。\n\n![](img/as_thread_example_ui_one_button.jpg)\n\n图 59-1\n\n接下来，将 `MainActivity.java`\
  \ 文件加载到编辑面板，并为 `buttonClick()` 方法添加代码，该方法将在用户点击 `Button` 视图时被调用。由于这里的目标是演示在主线程上执行耗时任务的问题，代码将在\
  \ `TextView` 对象上显示不同文本之前简单的暂停 20 秒：\n\n```java\npublic void buttonClick(View view)\
  \ {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while (System.currentTimeMillis()\
  \ < endTime) {\n        synchronized (this) {\n            try {\n             \
  \   wait(endTime - System.currentTimeMillis());\n            } catch (Exception\
  \ e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"Button\
  \ Pressed\");\n}\n```\n\n完成代码更改后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，点击按钮，应用程序将会冻结。例如，无法再次点击按钮，在某些情况下，操作系统将报告应用程序无响应，如图图\
  \ 59-2 所示。\n\n![](img/as_4.2_threadexample_not_responding.jpg)\n\n图 59-2\n\n显然，`buttonClick()`\
  \ 方法中任何需要时间完成的操作都需要在独立的线程中执行。\n\n# 59.5 创建新线程\n\n要创建一个新线程，需要将要在在该中执行的代码放置在 `Runnable`\
  \ 实例的 `run()` 方法中。然后需要创建一个新的 `Thread` 对象，并将 `Runnable` 实例的引用传递给构造函数。最后，需要调用线程对象的\
  \ `start()` 方法来启动线程。因此，为了执行 `buttonClick()` 方法中的任务，需要进行以下更改：\n\n```java\npublic\
  \ void buttonClick(View view) {\n    Runnable runnable = new Runnable() {\n    \
  \    public void run() {\n            long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n            while (System.currentTimeMillis() < endTime) {\n   \
  \             synchronized (this) {\n                    try {\n               \
  \         wait(endTime - System.currentTimeMillis());\n                    } catch\
  \ (Exception e) {\n                }\n                }\n            }\n       \
  \ }\n        binding.myTextView.setText(\"Button Pressed\");\n    };\n    Thread\
  \ myThread = new Thread(runnable);\n    myThread.start();\n}\n```\n\n事实上，如果需要，可以使用\
  \ lambda 表达式简化 `runnable` 的声明。进行此更改将产生以下结果：\n\n```java\nRunnable runnable = () ->\
  \ {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while (System.currentTimeMillis()\
  \ < endTime) {\n        synchronized (this) {\n            try {\n             \
  \   wait(endTime - System.currentTimeMillis());\n            } catch (Exception\
  \ e) {\n            }\n        }\n    }\n};\nThread myThread = new Thread(runnable);\n\
  myThread.start();\n```\n\n现在运行应用程序时，点击按钮会导致延迟在新线程中执行，从而让主线程能够继续处理用户界面，包括响应额外的按钮按键。事实上，每次触摸按钮时都会创建一个新线程，允许任务执行多次。\n\
  \n仔细检查 `buttonClick()` 方法的更新后的代码将会发现更新 `TextView` 的代码已被移除。正如之前提到的，从主线程以外的线程更新用户界面元素违反了\
  \ Android 开发的一项关键规则。因此，为了更新用户界面，有必要为该线程实现一个 `Handler`。\n\n# 59.6 实现线程处理器\n\n线程处理器在应用程序的主线程中实现，主要用于响应由应用程序进程内运行的其他线程发送的消息来更新用户界面。\n\
  \nHandlers 继承自 Android 的 `Handler` 类，可以通过指定在线程需要时执行的 `Runnable`，或者通过重写 `Handler`\
  \ 子类中的 `handleMessage()` 回调方法来使用，当线程向处理器发送消息时将调用该方法。\n\n为了本示例，将实现一个处理器从之前创建的线程内部更新用户界面。将\
  \ `MainActivity.java` 文件加载到 Android Studio 编辑器中并修改代码，向 activity 添加一个 `Handler` 实例：\n\
  \n```java\nimport android.os.Handler;\nimport android.os.Message;\nimport android.os.Looper;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    Handler handler = new\
  \ Handler(Looper.getMainLooper()) {\n        @Override public void handleMessage(Message\
  \ msg) {\n            binding.myTextView.setText(\"Message Received\");\n      \
  \  }\n    };\n}\n```\n\n上述代码更改声明了一个处理器并在处理器内部实现了 `handleMessage()` 回调，当线程向处理器发送消息时将调用它。在此实例中，代码简单地在用户界面的\
  \ `TextView` 对象上显示一个字符串。\n\n现在只需修改 `buttonClick()` 方法中创建的线程，在延迟完成后向处理器发送消息：\n\n\
  ```java\npublic void buttonClick(View view) {\n    Runnable runnable = () -> {\n\
  \        long endTime = System.currentTimeMillis() + 20 * 1000;\n        while (System.currentTimeMillis()\
  \ < endTime) {\n            synchronized (this) {\n                try {\n     \
  \               wait(endTime - System.currentTimeMillis());\n                } catch\
  \ (Exception e) {\n                }\n            }\n        }\n        handler.sendEmptyMessage(0);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n\n\n\n\n请注意，唯一的更改是调用了 `handler` 的 `sendEmptyMessage()` 方法。由于 `handler` 目前没有对接收到的任何消息内容进行任何处理，因此向它发送了一个空消息对象。\n\
  \n编译并运行应用程序，执行后点击按钮。等待 20 秒后，新文本将出现在用户界面的 `TextView` 对象中。\n\n## 59.7 向 Handler 传递消息\n\
  \n虽然上一个示例触发了对 `handleMessage()` handler 回调的调用，但它并没有利用消息对象向 `handler` 发送数据。在教程的这一阶段，示例将进一步修改，以便在线程和\
  \ `handler` 之间传递数据。首先，`buttonClick()` 方法中更新后的线程将从系统获取字符串格式的日期和时间，并将该信息存储在 `Bundle`\
  \ 对象中。然后调用 `handler` 对象的 `obtainMessage()` 方法从消息池中获取一个消息对象。最后，在通过调用 `handler` 对象的\
  \ `sendMessage()` 方法发送之前，将 `bundle` 添加到消息对象中：\n\n```java\npublic void buttonClick(View\
  \ view) {\n    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        Message msg = handler.obtainMessage();\n\
  \        Bundle bundle = new Bundle();\n        bundle.putString(\"myKey\", \"Thread\
  \ Completed\");\n        msg.setData(bundle);\n        handler.sendMessage(msg);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n接下来，更新 `handler` 的 `handleMessage()` 方法，从消息中的 `bundle` 对象中提取日期时间字符串并将其显示在\
  \ `TextView` 对象上：\n\n```java\nHandler handler = new Handler(Looper.getMainLooper())\
  \ {\n    @Override\n    public void handleMessage(Message msg) {\n        Bundle\
  \ bundle = msg.getData();\n        String string = bundle.getString(\"myKey\");\n\
  \        binding.myTextView.setText(string);\n    }\n};\n```\n\n最后，编译并运行应用程序，并测试点击按钮后在线程结束后是否会在\
  \ `TextView` 对象上显示“Thread Complete”消息。\n\n## 59.8 Java Executor 并发\n\n到本章为止，我们专门查看了直接创建和管理\
  \ Java 线程。虽然对于简单的多线程任务是可以接受的，但在处理涉及大量线程的复杂情况时，这可能证明是不够的。例如，启动和停止线程涉及系统开销。因此，创建和销毁大量线程的应用程序面临性能下降的风险。基础线程\
  \ API 也没有提供用于调度或重复任务执行、或从任务返回结果的预构建选项。\n\n通过使用 Java 并发框架（`java.util.concurrent`\
  \ 包的一部分）的 `Executor` 类可以克服直接处理线程的缺点。该框架允许创建活动线程池并管理如何将任务分配给这些线程。这使得现有线程可以重用于其他任务，而无需不断创建新线程。\n\
  \n该框架还提供了额外功能，包括在任务完成后返回结果的能力（称为 `Callable` 任务）、检查线程状态以及调度任务在超时后或按重复的时间运行。\n\n##\
  \ 59.9 与 Runnable 任务工作\n\n探索此框架的第一步是修改 `buttonClicked()` 方法，使用并发框架 `Executor` 在单独线程中运行任务：\n\
  \n```java\n.\n.\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  .\n.\n    public void buttonClick(View view) {\n        ExecutorService executor\
  \ = Executors.newThreadExecutor();\n        executor.submit(new Runnable() {\n \
  \           public void run() {\n                long endTime = System.currentTimeMillis()\
  \ + 10 * 1000;\n                while (System.currentTimeMillis() < endTime) {\n\
  \                    synchronized (this) {\n                        try {\n    \
  \                        wait(endTime - System.currentTimeMillis());\n         \
  \               } catch (Exception e) {\n                        }\n           \
  \         }\n                }\n                Message msg = handler.obtainMessage();\n\
  \                Bundle bundle = new Bundle();\n                bundle.putString(\"\
  myKey\", \"Button Pressed\");\n                msg.setData(bundle);\n          \
  \      handler.sendMessage(msg);\n            }\n        });\n        executor.shutdown();\n\
  \    }\n.\n.\n```\n\n当执行上述代码时，超时将像之前一样在单独线程上执行。然而，对方法所做的更改需要一些解释。首先，是从系统 `Executors`\
  \ 实例获取 `ExecutorService` 实例引用：\n\n```java\nExecutorService executor = Executors.newSingleThreadExecutor();\n\
  ```\n\n在这种情况下，请求了一个只包含一个线程的池。可以通过以下方式请求具有指定数量线程的池：\n\n```java\nExecutorService executor\
  \ = Executors.newFixedThreadPool(10);\n```\n\n接下来，通过调用执行服务实例的 `submit()` 方法在线程上启动一个\
  \ `Runnable` 任务：\n\n```java\nexecutor.submit(new Runnable(){\n    public void run(){\n\
  \        long endTime = System.currentTimeMillis() + 20 * 1000;\n.\n.\n```\n\n注意，上面的声明可以通过转换为\
  \ lambda 表达式来简化：\n\n```java\nexecutor.submit(() -> {\n    long endTime = System.currentTimeMillis()\
  \ + 1000;\n.\n.\n```\n\n从现在开始，任务将运行到完成。然而，在任务完成后，执行服务将继续运行。如果你不再需要该服务，应该将其关闭。\n\n\
  ## 59.10 关闭 Executor 服务\n\n`ExecutorService` 提供了几种启动关闭的技术。要通知服务在当前运行的任务完成后自动关闭，应如下调用\
  \ `shutdown()` 方法：\n\n```java\nexecutor.shutdown();\n```\n\n另一方面，调用 `shutdownNow()`\
  \ 方法会停止服务上运行的所有任务并取消等待处理的任务：\n\n```java\nexecutor.shutdownNow();\n```\n\n## 59.11\
  \ 与 Callable 任务和 Future 工作\n\n如前所述，`ExecutorService` 支持任务完成后返回结果的所谓“Callable”任务。在单独线程上运行的任务通常需要一些时间才能完成（否则它们根本不需要在单独线程上运行）。这提出了结果如何返回到启动任务的线程的问题。这是通过使用\
  \ `Future` 类型实现的，它代表在未来某个时刻提供的值。\n\n当执行可调用任务时，它会返回一个 `Future` 实例，随后应用程序可以使用它在任务完成后获取结果。为了演示此功能，首先编辑\
  \ `activity_main.xml` 文件以添加一个标记为“Status”的按钮，并将 `onClick` 属性配置为调用名为 `statusClick`\
  \ 方法：\n\n![](img/as_thread_example_ui.jpg)\n\n图 59-3\n\n接下来，修改 `buttonClick()` 方法以执行\
  \ `Callable` 任务，通过 `Future` 变量返回字符串值：\n\n```java\n.\n.\nimport java.util.concurrent.Callable;\n\
  import java.util.concurrent.Future;\n.\n.\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Future<String> future;\n.\n.\n    public void buttonClick(View view) {\n\
  \        ExecutorService executor = Executors.newSingleThreadExecutor();\n     \
  \   future = executor.submit(new Callable<String>() {\n            @Override\n \
  \           public String call() throws Exception {\n                long endTime\
  \ = System.currentTimeMillis() + 20 * 1000;\n                while (System.currentTimeMillis()\
  \ < endTime) {\n                    synchronized (MainActivity.this) {\n       \
  \                 try {\n                            wait(endTime - System.currentTimeMillis());\n\
  \                        } catch (Exception e) {\n                        }\n  \
  \                  }\n                }\n                return \"Thread Complete\"\
  ;\n            }\n        });\n    }\n\n    public void statusClick(View view) {\n\
  \        try {\n            String result = future.get();\n            binding.myTextView.setText(result);\n\
  \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
  \    }\n}\n```\n\n\n\n\n```java\nfuture = executor.submit(new Callable<String>()\
  \ {\n    public String call() {\n        long endTime = System.currentTimeMillis()\
  \ + 10 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        return(\"Task Completed\");\n\
  \    }\n});\nexecutor.shutdown();\n```\n\n请注意，除了导入 `java.util.concurrent.Future`\
  \ 包并声明一个存储字符串值的 `Future` 变量外，启动任务的方式也发生了一些变化：\n\n```java\nfuture = executor.submit(new\
  \ Callable<String>() {\n    public String call() {\n}\n```\n\n这里的关键点是，我们不再向执行器服务提交\
  \ `Runnable` 任务，而是传递了一个 `Callable` 任务（声明返回 `String` 值）。同时请注意，任务的结果被赋值给 `Future`\
  \ 变量。此外，在提交 `Runnable` 任务时使用的 `run()` 方法现在被替换为 `call()` 方法。最后，添加了返回语句来返回一个字符串值：\n\
  \n```java\nreturn(\"Task Completed\")\n```\n\n# 59.12 处理 Future 结果\n\n`buttonClick()`\
  \ 方法现在配置为启动一个 `Callable` 任务，并将返回值赋值给 `Future` 变量。应用程序现在需要知道任务何时完成以及结果何时可用。一种方案是调用\
  \ `Future` 变量的 `get()` 方法。由于该方法在执行失败或被中断时可能会抛出异常，因此必须在 `try/catch` 语句中执行：\n\n```java\n\
  String result = null;\ntry {\n    result = future.get();\n} catch (ExecutionException\
  \ | InterruptedException e) {\n    e.printStackTrace();\n}\n```\n\n遗憾的是，`get()`\
  \ 方法会阻塞当前线程，直到线程中运行的任务完成，从而违背了最初在单独线程中运行任务的初衷。另一种方案是为 `get()` 方法提供超时时间，到期后会将控制权交还当前线程。例如，以下代码将导致\
  \ `get()` 调用在 3 秒后超时：\n\n```java\nresult = future.get(3, TimeUnit.SECONDS);\n```\n\
  \n更好的替代方案是调用 `Future` 实例的 `isDone()` 方法来检查线程状态，并且在任务完成后再调用 `get()` 方法。要实现这一行为，请在\
  \ `MainActivity.java` 文件中添加如下 `statusClick()` 方法：\n\n```java\nimport java.util.concurrent.ExecutionException;\n\
  import java.util.concurrent.TimeUnit;\nimport java.util.concurrent.TimeoutException;\n\
  \npublic void statusClick(View view) {\n    if ((future != null && future.isDone())\
  \ {\n        String result = null;\n        try {\n            result = future.get(3,\
  \ TimeUnit.SECONDS);\n        } catch (ExecutionException | InterruptedException\
  \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n\n\n\n对于许多类型的权限，这种场景仍然适用于\
  \ Android 6.0 或更高版本上的应用。这些权限被称为“普通权限”（normal permissions），仍然要求在安装时由用户接受。第二类权限被称为“危险权限”（dangerous\
  \ permissions），它们也必须像普通权限一样在清单文件（manifest file）中声明，但在应用程序首次启动时也必须向用户请求。当发出此类请求时，它将以对话框的形式出现，如图\
  \ 60-2 所示：\n\n![](img/Image24341.jpg)\n\n图 60-2\n\n属于危险类别的权限完整列表包含表 60-1 中：\n\n\
  | 权限组 | 权限 |\n| :--- | :--- |\n| 日历 (Calendar) | READ_CALENDARWRITE_CALENDAR |\n\
  | 摄像头 (Camera) | CAMERA |\n| 联系人 (Contacts) | READ_CONTACTSWRITE_CONTACTSGET_ACCOUNTS\
  \ |\n| 位置 (Location) | ACCESS_FINE_LOCATIONACCESS_COARSE_LOCATION |\n| 麦风 (Microphone)\
  \ | RECORD_AUDIO |\n| 通知 (Notifications) | POST_NOTIFICATIONS |\n| 电话 (Phone) |\
  \ READ_PHONE_STATECALL_PHONEREAD_CALL_LOGWRITE_CALL_LOGADD_VOICEMAILUSE_SIPPROCESS_OUTGOING_CALLS\
  \ |\n| 传感器 (Sensors) | BODY_SENSORS |\n| 短信 (SMS) | SEND_SMSRECEIVE_SMSREAD_SMSRECEIVE_WAP_PUSHRECEIVE_MMS\
  \ |\n| 存储 (Storage) | MANAGE_EXTERNAL_STORAGEREAD_EXTERNAL_STORAGEWRITE_EXTERNAL_STORAGE\
  \ |\n\n表 60-1\n\n`MANAGE_EXTERNAL_STORAGE`权限允许应用访问设备外部存储上的所有文件，包括属于其他应用的文件。因此，只有当\
  \ Google 在审核过程中验证需要此级别的访问权限时，该权限才会为您的应用启用。在将应用提交到 Google Play 商店之前，可以执行以下 `adb`\
  \ 命令来在测试设备上临时启用应用的访问：\n\n```bash\nadb shell appops set --uid <package name> MANAGE_EXTERNAL_STORAGE\
  \ allow\n```\n\n此模式可以通过以下方式关闭：\n\n```bash\nadb shell appops set --uid <package name>\
  \ MANAGE_EXTERNAL_STORAGE default\n```\n\n## 60.2 创建权限示例项目\n\n从欢迎界面选择“新建项目”（New\
  \ Project）选项，在出现的新项目对话框中，点击“下一步”（Next）按钮之前选择“Empty Views Activity”模板。\n\n在 Name\
  \ 字段中输入 `PermissionDemo` 并指定 `com.ebookfrenzy.permissiondemo` 为包名。在点击完成（Finish）按钮之前，将最低\
  \ API 级别（Minimum API level）设置为 `API 26`：`Android 8.0 (Oreo)`，并将语言（Language）菜单设置为\
  \ `Java`。\n\n## 60.3 检查权限\n\nAndroid Support Library 包含几种用于在 Android 应用代码中查找和管理危险的方法。无论应用运行的\
  \ Android 版本如何，这些 API 调用都是安全的，但只有在 Android 6.0 或更高版本上执行时才会执行有意义的任务。\n\n在应用尝试使用需要危险权限批准的功能之前，无论之前是否授予了权限，代码必须检查权限是否已授予。可以通过调用\
  \ `ContextCompat` 类的 `checkSelfPermission()` 方法来实现，并将当前活动的引用和请求的权限作为参数传递。该方法将检查权限是否之前已授予，并返回与\
  \ `PackageManager.PERMISSION_GRANTED` 或 `PackageManager.PERMISSION_DENIED` 匹配的整数值。\n\
  \n在示例项目的 `MainActivity.java` 文件中，修改代码以检查是否已授予了应用录音的权限：\n\n```java\npackage com.ebookfrenzy.permissiondemoactivity;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.os.Bundle;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\nimport android.util.Log;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private static final String TAG\
  \ = \"PermissionDemo\";\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_permission_demo);\n\
  \        setupPermissions();\n    }\n\n    private void setupPermissions() {\n \
  \       int permission = ContextCompat.checkSelfPermission(this,\n             \
  \   Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n        }\n    }\n\
  }\n```\n\n编辑 `AndroidManifest.xml` 文件（位于 Project 工具窗口的 `app` -> `manifests` 下），并添加一行代码来请求录音权限，如下：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.permissiondemo\"\
  >\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n  \
  \  <application\n        android:allowBackup=\"true\"\n        android:icon=\"@mipmap/launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:supportsRtl=\"true\"\
  \n        android:theme=\"@style/AppTheme\">\n        <activity android:name=\"\
  .MainActivity\">\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n在设备或模拟器上运行应用并打开 Logcat 窗口。注意，尽管权限已添加到清单文件中，但仍出现了权限被拒绝的消息。这是因为 Android 要求除了向清单文件添加请求之外，应用还必须在运行时请求危险权限。\n\
  \n## 60.4 在运行时请求权限\n\n权限请求是通过调用 `ActivityCompat` 类的 `requestPermissions()` 方法发出的。当调用此方法时，权限请求将进行异步处理，并在任务完成后将调用一个名为\
  \ `onRequestPermissionsResult()` 的方法。\n\n`requestPermissions()` 方法的参数是当前活动的引用、请求权限的标识符和一个请求代码。请求代码可以是任意整数值，并将用于识别是哪个请求触发了对\
  \ `onRequestPermissionsResult()` 方法的调用。修改 `MainActivity.java` 文件以声明请求代码，并在检查失败时请求录音权限：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final String TAG = \"PermissionDemo\"\
  ;\n    private static final int RECORD_REQUEST_CODE = 101;\n\n    @Override\n  \
  \  private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n            makeRequest();\n\
  \        }\n    }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \                new String[]{Manifest.permission.RECORD_AUDIO},\n             \
  \   RECORD_REQUEST_CODE);\n    }\n}\n```\n\n接下来，实现 `onRequestPermissionsResult()`\
  \ 方法，内容如下：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n\
  \        @NonNull String[] permissions, @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == RECORD_REQUEST_CODE) {\n \
  \       if (grantResults.length == 0\n                || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission has been denied by user\");\n        }\
  \ else {\n            Log.i(TAG, \"Permission has been granted by user\");\n   \
  \     }\n    }\n}\n```\n\n\n\n\n在模拟器或设备上编译并运行应用，注意会出现如图 60-3 所示的请求录音权限的对话框：\n\n\
  ![](img/android_permission_request.jpg)\n\n图 60-3\n\n点击`While using the app`（在使用应用期间）按钮，检查\
  \ Logcat 面板中出现了“Permission has been granted by user”消息。\n\n一旦用户授予了请求的权限，在随后的应用调用中，`checkSelfPermission()`\
  \ 方法将返回 `PERMISSION_GRANTED` 结果，直到用户卸载并重新安装应用，或者在设置中更改了该应用的权限。\n\n## 60.5 为权限请求提供理由\n\
  \n如图 60-3 所示，用户可以拒绝请求的权限。在这种情况下，用户每次启动应用时，应用都会继续请求该权限，除非用户在点击“拒绝”按钮之前选择了“不再询问”选项。用户反复拒绝可能表明用户不理解为什么应用需要该权限。因此，如果在请求时解释需求的原因，用户可能更容易授予权限。遗憾的是，无法更改请求对话框的内容来包含此类解释。\n\
  \n最好将解释包含在一个独立的对话框中，该对话框可以在请求对话框呈现给用户之前显示。这产生了一个何时显示此解释对话框的问题。Android 文档建议，只有在用户之前拒绝过权限时才显示解释对话框，并提供了一个方法来识别何时出现这种情况。\n\
  \n调用 `ActivityCompat` 类的 `shouldShowRequestPermissionRationale()` 方法，如果用户之前拒绝过对特定权限的请求，则返回\
  \ `true` 结果；如果之前未请求请求，则返回 `false`。在结果为 `true` 的情况下，应用应该显示一个包含权限理由的对话框，一旦用户阅读并关闭了对话框，就应该重复权限请求。\n\
  \n要向示例应用中添加此功能，请修改 `onCreate()` 方法如下所示：\n\n```java\nimport android.app.AlertDialog;\n\
  \nprivate void setupPermissions() {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.RECORD_AUDIO);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        Log.i(TAG, \"Permission to record denied\");\n        if (ActivityCompat.shouldShowRequestPermissionRationale(this,\n\
  \                Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder =\n                    new AlertDialog.Builder(this);\n            builder.setMessage(\"\
  Permission to access the microphone is required for this app to record audio.\"\
  )\n                    .setTitle(\"Permission required\");\n            builder.setPositiveButton(\"\
  OK\",\n                    (dialog, id) -> makeRequest());\n            AlertDialog\
  \ dialog = builder.create();\n            dialog.show();\n        } else {\n   \
  \         makeRequest();\n        }\n    }\n}\n```\n\n该方法仍然检查权限是否已授予，但现在还会识别是否需要显示理由。如果用户之前拒绝了请求，则会显示一个包含解释和\
  \ OK 按钮的对话框，并在按钮上配置了监听器，在点击按钮时调用 `makeRequest()` 方法。如果之前未请求过，代码将直接跳转到请求权限。\n\n###\
  \ 60.6 测试权限应用\n\n在执行测试的设备或模拟器会话上，启动设置应用，选择应用选项，滚动并选择 PermissionDemo 应用。在应用设置屏幕上，点击卸载按钮移除应用。\n\
  \n重新运行应用，当权限请求对话框出现时点击“不允许”（Don’t allow）按钮。停止并重启应用，验证理由对话框是否出现。点击 OK 按钮，当权限请求对话框出现时点击`While\
  \ using the app`按钮。\n\n### 60.7 总结\n\n在 Android 6 引入之前，应用请求某些功能的唯一步骤是在清单文件中添加一行代码。用户在安装应用时会被提示批准权限。对于大多数权限来说情况仍然如此，但一组被认为是“危险”的权限除外。被认为危险的权限可能允许应用违反用户隐私，例如访问麦克风、联系人或外部存储。\n\
  \n正如本章概述的，基于 Android 6 或更高版本的应用现在必须向用户请求危险权限，并在清单文件中包含该权限请求。\n\n## 61. Android 通知教程\n\
  \n通知提供了一种在应用未运行或处于后台时向用户传达消息的方式。例如，消息应用可能会通知用户有新消息到达。通知可以分为本地通知和远程通知。本地通知由运行在设备上的应用本身触发。另一方面，远程通知由远程服务器启动并投递到设备进行展示。\n\
  \n本章概述了在 Android 应用中实现本地通知的方法。下一章（Android 直接回复教程）将涵盖直接回复通知的实现。\n\n### 61.1 通知概述\n\
  \n当 Android 设备启动通知时，它会显示为状态栏中的图标。例如，图 61-1 显示了一个带有若干个通知图标的状态栏：\n\n![](img/Image24252.jpg)\n\
  \n图 61-1\n\n要查看通知，用户需要从状态栏开始向下滑动以拉下通知抽屉，如图 61-2 所示：\n\n![](img/as_4.1_android_11_notifications.jpg)\n\
  \n图 61-2\n\n在运行 Android 8 或更高版本的设备上，长按应用启动器图标将显示与应用相关的任何待处理通知，如图 61-3 所示：\n\n![](img/Image2442.jpg)\n\
  \n图 61-3\n\nAndroid 8 及更高版本还支持通知点，当有通知等待用户查看时，该点出现在应用启动器图标上。\n\n\n\n\n\n典型的通知会显示一条消息，并在被点击时启动负责发布该通知的应用程序。通知还可能包含操作按钮，点击这些按钮可以执行对应应用的特定任务。例如，图\
  \ 61-4 显示了一个包含两个操作按钮的通知，允许用户删除或保存收到的消息：\n\n![](img/Image2450.jpg)\n\n图 61-4\n\n\
  用户还可以在通知中输入内联文本回复并将其发送到应用程序，如下文的图 61-5 所示。这允许用户在不将相应的应用程序推至前台的情况下，对通知做出响应：\n\n![](img/Image2458.jpg)\n\
  \n图 61-5\n\n本章的剩余部分将介绍如何创建和发布一个包含操作的简单通知。直接回复支持的主将在下一节——标题为 Android 直接回复通知教程”的章节中介绍。\n\
  \n## 61.2 创建 NotifyDemo 项目\n\n从欢迎界面选择“新建项目”（New Project）选项，在出现的新项目对话框中，点击“下一步”（Next）之前选择“空视图活动”（Empty\
  \ Views Activity）模板。\n\n在 `Name` 字段中输入 `NotifyDemo` 并指定 `com.ebookfrenzy.notifydemo`\
  \ 为包名。在点击“完成”（Finish）按钮之前，将最低 API 级别设置设置为 `API 33`：Android 13 (Tiramisu)，并将语言菜单更改为\
  \ `Java`。\n\n### 61.3 设计用户界面\n\n主活动（MainActivity）将包含一个按钮，其目的是创建并发布意图（intent）。找到并加载\
  \ `activity_main.xml` 文件到布局编辑器（Layout Editor）工具中，并删除默认的 `TextView` 组件。\n\n在启用自动连接（Autoconnect）的情况下，如图\
  \ 61-6 所示，从面板中拖放一个 `Button` 对象到布局画布的中心。\n\n在布局中选中 `Button` 件后，使用属性面板（Attributes\
  \ panel）配置 `onClick` 属性，以调用名为 `sendNotification` 的方法。\n\n![](img/as_notification_ui.jpg)\n\
  \n图 61-6\n\n选中 `Button` 组件，将属性工具窗口中的 `text` 属性更改为“Notify”，并将该属性值提取到字符串资源。\n\n###\
  \ 61.4 创建第二个活动\n\n在此示例中，应用程序将包含第二个活动，该活动将由用户从通知内部启动。通过右键点击 `app -> java` 下的 `com.ebookfrenzy.notifydemo`\
  \ 包名，并选择 `New -> Activity -> Empty Views Activity` 菜单选项来显示新建 Android 活动对话框，将此新活动添加到项目中。\n\
  \n在 `Activity Name` 字段中输入 `ResultActivity`，并将布局文件命名为 `activity_result`。由于此活动不会在应用程序启动时启动（它将通过通知内部的意图启动），因此在点击“完成”按钮之前，必须确保禁用了“启动器活动”（Launcher\
  \ Activity）选项。\n\n打开第二个活动的布局（`app -> res -> layout -> activity_result.xml`），并拖放一个\
  \ `TextView` 组件，使其位于布局中心。编辑 `TextView` 的文本，使其显示为“Result Activity”，并将该属性值提取到字符串资源。\n\
  \n## 61.5 创建通知通道\n\n在应用程序发送通知之前，它必须创建一个通知通道。通知通道由一个唯一标识应用内通道的 ID、一个通道名称和一个通道描述组成（只有后两个对用户可见）。通道是通过通过配置\
  \ `NotificationChannel` 实例，然后将该对象传递给 `NotificationManager` 类的 `createNotificationChannel()`\
  \ 方法创建的。对于此示例，应用程序将包含一个名为“NotifyDemo News”的单一通知通道。编辑 `MainActivity.java` 文件并实现在应用启动时创建通道的代码：\n\
  \n```java\nimport android.app.NotificationManager;\nimport android.app.NotificationChannel;\n\
  import android.content.Context;\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    NotificationManager notificationManager;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        notificationManager =\n            (NotificationManager)\n            \
  \    getSystemService(Context.NOTIFICATION_SERVICE);\n        createNotificationChannel(\n\
  \            \"com.ebookfrenzy.notifydemo.news\",\n            \"NotifyDemo News\"\
  ,\n            \"Example News Channel\");\n    }\n\n    protected void createNotificationChannel(String\
  \ id, String name, String description) {\n        int importance = NotificationManager.IMPORTANCE_LOW;\n\
  \        NotificationChannel channel = new NotificationChannel(id, name, importance);\n\
  \        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLight(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400, 500, 400});\n\
  \        notificationManager.createNotificationChannel(channel);\n    }\n}\n```\n\
  \n该代码声明并初始化了一个 `NotificationManager` 实例，然后使用名称和描述创建了一个低重要性（其他选项为高、最高、无）的新通道。通道中还添加了一系列可选设置，以自定义如何提醒用户通知到达。这些设置适用于发送到该通道的所有通知。最后，通过将通道对象传递给\
  \ `createNotificationChannel()` 方法创建通道。\n\n## 61.6 请求通知权限\n\n在测试应用程序之前，必须在文件中请求相应的权限。具体而言，应用程序需要发布通知权限。在项目窗口中，找到并双击\
  \ `AndroidManifest.xml` 文件将其加载到编辑器，并修改 XML 添加权限：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.audioapp\">\n    <uses-permission android:name=\"\
  android.permission.POST_NOTIFICATIONS\" />\n</manifest>\n```\n\n上述步骤将确保用户在运行 Android\
  \ 6.0 之前的版本的设备上安装应用时启用通知权限。通知访问被 Android 分类为危险权限，因为它可能会损害用户的隐私。为了让示例应用在 Android\
  \ 6 或更高版本的设备上运行，必须添加运行时请求权限的代码。\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和一个作为请求请求标识代码的常量：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.widget.Toast;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final int NOTICATION_REQUEST_CODE = 101;\n}\n```\n\n接下来，需要向类中添加一个方法，其目的是以要请求的权限和对应的请求标识码作为参数。继续处理\
  \ `MainActivity.java` 类，按如下方式实现此方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n}\n```\n\n\n\n\n\n```java\nif (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n    ActivityCompat.requestPermissions(this,\n            new String[]{permissionType},\
  \ requestCode\n    );\n}\n```\n\n通过本书书中“在 Android 中请求运行时权限”章节概述的步骤，上述方法在发出请求之前会验证指定的权限是否已经获得授予，并将识别码作为参数传递。\n\
  \n当请求被处理后，活动上将调用 `onRequestPermissionsResult()` 方法，并传递识别码和请求结果。因此，下一步是在 `MainActivity.java`\
  \ 文件中如下所示实现该方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode,\n            @NonNull String[] permissions, @NonNull int[] grantResults)\
  \ {\n    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == NOTIFICATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0\n                || grantResults[0] !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            Toast.makeText(this,\n                    \"Notification permission\
  \ required\",\n                    Toast.LENGTH_LONG).show();\n        }\n    }\n\
  }\n```\n\n上述代码通过检查请求识别码来识别是哪个权限请求已返回，然后再检查相应的权限是否已被授予。如果权限被拒绝，将向用户显示一条消息，指示应用将无法运行且记录按钮将被禁用。\n\
  \n在测试应用之前，最后剩下的工作是在应用启动时调用新添加的 `requestPermission()` 方法。在 `MainActivity.java` 文件中，按如下修改\
  \ `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\n            NOTIFICATION_REQUEST_CODE);\n\
  }\n```\n\n代码更改完成后，在运行 Android 13 或更高版本的设备或模拟器上编译并运行应用。当图 61-7 中所示对话框出现时，点击允许（Allow）按钮以启用通知：\n\
  \n![](img/as_enable_notifications.jpg)\n\n图 61-7\n\n启动应用后，将其置于后台并打开“设置”应用。在“设置”应用中，选择“应用”选项，选择\
  \ NotifyDemo 项目，然后在随后的屏幕上点击“通知”项。通知屏幕应该列出 NotifyDemo 新分类对用户处于激活状态：\n\n![](img/as_app_notifications_enabled.jpg)\n\
  \n图 61-8\n\n在继续之前，确保已为该应用启用通知点。\n\n虽然这不是本示例的强制要求，但值得注意的是，可以通过调用管理器的 `deleteNotificationChannel()`\
  \ 方法从应用内部删除通道，并传递要删除的通道 ID：\n\n```java\nString channelID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\nnotificationManager.deleteNotificationChannel(channelID);\n```\n\n## 61.7 创建并发布通知\n\
  \n通知使用 `Notification.Builder` 类创建，并且必须包含图标、标题和内容。打开 `MainActivity.java` 文件并如下所示实现\
  \ `sendNotification()` 方法以构建基础通知：\n\n```java\nimport android.app.Notification;\n\
  import android.view.View;\n\npublic void sendNotification(View view) {\n    String\
  \ channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification\
  \ =\n            new Notification.Builder(MainActivity.this, channelID)\n      \
  \      .setContentTitle(\"Example Notification\")\n            .setContentText(\"\
  This is an example notification.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .build();\n}\n```\n\n一旦构建了通知，就需要使用\
  \ `NotificationManager` 的 `notify()` 方法进行发布。访问 `NotificationManager` 并发布通知的代码需要如下添加到\
  \ `sendNotification()` 方法中：\n\n```java\nprotected void sendNotification(View view)\
  \ {\n    int notificationID = 101;\n    String channelID = \"com.ebookfrenzy.demo.news\"\
  ;\n    Notification notification =\n            new Notification.Builder(MainActivity.this,\
  \ channelID)\n            .setContentTitle(\"New Message\")\n            .setContentText(\"\
  You've received new messages.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .build();\n    notificationManager.notify(notificationID,\
  \ notification);\n}\n```\n\n注意，当发布通知时，它会被分配一个通知 ID。这可以是任何整数，并可以在更新通知时使用。编译并运行应用，点击主活动上的按钮。当通知图标出现在状态栏中时，从状态栏向下触摸并滑动以查看完整通知：\n\
  \n![](img/as_notification.jpg)\n\n图 61-9\n\n长按通知以查看更多信息：\n\n![](img/as_notification_details.jpg)\n\
  \n图 61-10\n\n接下来，将应用置于后台，导航到显示所有应用启动图标的主屏幕，并注意 NotifyDemo 图标上出现了一个通知点，如图 61-11 中的箭头所示：\n\
  \n![](img/as_notification_dot.jpg)\n\n图 61-11\n\n在继续之前，确保已为该应用启用了通知点。\n\n如果没有显示点，请在“设置”应用中检查\
  \ NotifyDemo 的通知选项以确认已启用通知点，如前文所述。如果点仍然没有，长按设备主屏幕空白区域，从结果菜单中选择“桌面设置”选项，并启用“通知”选项。\n\
  \n长按启动图标将显示一个包含通知的弹出窗口：\n\n![](img/as_dot_detail.jpg)\n\n图 61-12\n\n如果一个应用有多个待处理通知，长按菜单弹出窗口将包含通知数量（如上所示）。此数字可以在应用内部通过构建构建时调用\
  \ `setNumber()` 方法进行配置：\n\n```java\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n    .setContentTitle(\"Example Notification\")\n    .setContentText(\"\
  This is an example notification.\")\n    .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \    .setChannelId(CHANNEL_ID)\n    .setNumber(10)\n    .build();\n```\n\n按照目前的实现，无论在何处访问，点击通知都没有反应。下一步是配置通知以便在点击时启动活动。\n\
  \n### 61.8 从通知启动活动\n\n通知应该允许用户执行某些操作，例如启动相应的应用或响应通知采取其他行动。常见需求是在用户点击通知时启动属于该应用的活动。\n\
  \n这种方法需要启动一个活动并配置一个启动该活动的 `Intent`。假设应用有一个名为 `ResultActivity` 的活动，则如下创建意图：\n\n```java\n\
  Intent resultIntent = new Intent(this, ResultActivity.class);\n```\n\n\n\n\n随后，该\
  \ intent 需要被封装在一个 `PendingIntent` 实例中。`PendingIntent` 对象的设计允许将 intent 传递给其他应用程序，本质上授予这些应用程序在未来某个时刻执行该\
  \ intent 的权限。在这种情况下，`PendingIntent` 对象被用于为通知系统提供一种方法，在用户点击通知面板时启动 `ResultActivity`\
  \ 活动：\n\n```java\nPendingIntent pendingIntent =\n    PendingIntent.getActivity(\n\
  \    this,\n    0,\n    resultIntent,\n    PendingIntent.FLAG_IMMUTABLE\n);\n```\n\
  \n剩下的工作是在通知构建过程中，使用 `setContentIntent()` 方法分配 `PendingIntent` 对象。\n\n将这些更改整合在一起，得到了一个修改后的\
  \ `sendNotification()` 方法，其内容如下：\n\n```java\n.\n.\nimport android.app.PendingIntent;\n\
  import android.content.Intent;\nimport android.graphics.drawable.Icon;\n.\n.\nprotected\
  \ void sendNotification(View view) {\n    int notificationId = 101;\n    Intent\
  \ resultIntent = new Intent(this, ResultActivity.class);\n    PendingIntent pendingIntent\
  \ =\n            PendingIntent.getActivity(\n                    this,\n       \
  \             0,\n                    resultIntent,\n                    PendingIntent.FLAG_IMMUTABLE\n\
  \            );\n    String CHANNEL_ID = \"com.ebookfrenzy.notifydemo.news\";\n\
  \    Notification notification = new Notification.Builder(MainActivity.this,\n \
  \                                                       CHANNEL_ID)\n          \
  \  .setContentTitle(\"Example Notification\")\n            .setContentText(\"This\
  \ is an example notification.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .setContentIntent(pendingIntent)\n\
  \            .build();\n    notificationManager.notify(notificationId, notification);\n\
  }\n```\n\n编译并重新运行应用，点击按钮并显示通知栏。这一次，点击通知将导致 `ResultActivity` 启动。\n\n## 61.9 为通知添加操作\n\
  \n为通知添加交互性的另一种方法是创建操作（actions）。这些操作显示为通知消息下按钮，并被设置为在用户点击时触发特定的 intent。如果将以下代码添加到\
  \ `sendNotification()` 方法中，将添加一个标记为“Open”的操作按钮，在选中时会启动引用的 pending intent：\n\n```java\n\
  final Icon icon = Icon.createWithResource(MainActivity.this,\n        android.R.drawable.ic_dialog_info);\n\
  Notification.Action action =\n        new Notification.Action.Builder(icon, \"Open\"\
  , pendingIntent)\n            .build();\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(R.drawable.ic_info_2dp)\n\
  \        .setChannelId(channelID)\n        .setContentIntent(pendingIntent)\n  \
  \      .setActions(action)\n        .build();\nnotificationManager.notify(notificationId,\
  \ notification);\n```\n\n将上述代码添加到方法中并运行应用。发布通知并注意 Open 操作的出现（取决于 Android 版本，可能需要向下拉通知面板才能显示\
  \ Open 操作）：\n\n(image/as_notification_action.jpg)\n**图 61-13\n\n点击该操作将触发 pending\
  \ intent 并启动 `ResultActivity`。\n\n### 61.10 捆绑通知（Bundled Notifications）\n\n如果一个应用程序经常发布通知，可能会导致这些通知迅速填满状态栏和通知栏，从而给用户带来不佳的体验。对于每当有突发新闻或新消息到达就发送通知的新闻或消息应用来说，尤为如此。例如，考虑图中的：\
  \ (image/as_3.2_unbundled_notifications.jpg)\n现在现在想象一下，如果收到了十条甚至二十条消息。为了避免这个问题，Android\
  \ 允许将通知捆绑成组。要捆绑通知，必须通过 `setGroup()` 方法指定每个通知属于同一个组，并且必须发布并配置额外的通知作为摘要通知（summary\
  \ notification）。例如，以下代码创建并发布了图 61-14 所示的三个通知，但将它们捆绑到了同一个组中。代码还发布了一个通知作为摘要：\n\n```java\n\
  final String GROUP_KEY_NOTIFY = \"group_key_notify\";\nNotification.Builder builderSummary\
  \ =\n    new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"A Bundle Example\")\n        .setContentText(\"You have\
  \ 3 new messages\")\n        .setGroup(GROUP_KEY_NOTIFY)\n        .setGroupSummary(true);\n\
  Notification.Builder builder1 =\n    new Notification.Builder(this, channelID)\n\
  \        .setSmallIcon(android.R.drawable.ic_dialog_info)\n        .setContentTitle(\"\
  New Message\")\n        .setContentText(\"You have a new message from Kassidy\"\
  )\n        .setGroup(GROUP_KEY_NOTIFY);\nNotification.Builder builder2 =\n    new\
  \ Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"New Message\")\n        .setContentText(\"You have a\
  \ new message from Caitlyn\")\n        .setGroup(GROUP_KEY_NOTIFY);\nNotification.Builder\
  \ builder3 =\n    new Notification.Builder(this, channelID)\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setContentTitle(\"New Message\")\n            .setContentText(\"You\
  \ have a new message from Jason\")\n            .setGroup(GROUP_KEY_NOTIFY);\n\n\
  int notificationId0 = 100;\nint notificationId1 = 101;\nint notificationId2 = 102;\n\
  int notificationId3 = 103;\nnotificationManager.notify(notificationId1, builder1.build());\n\
  notificationManager.notify(notificationId2, builder2.build());\nnotificationManager.notify(notificationId3,\
  \ builder3.build());\nnotificationManager.notify(notificationId0, builderSummary.build());\n\
  ```\n\n当代码执行时，即使应用程序发布了四个通知，状态栏中也只会显示一个通知图标。在通知栏中，会显示单个摘要通知，列出每个捆绑通知的信息：\n\n(image/Image2528.jpg)\n\
  **图 61-15\n\n进一步向下拉动通知条目，面板将展开并显示每个捆绑通知的详情：\n\n(image/Image2536.jpg)\n**图 61-16**\n\
  \n\n\n\n\n直接回复（Direct reply）是 Android 的一项功能，允许用户在通知中输入文本并将其发送到与通知关联的应用程序。这使用户无需启动应用内的活动（activity）即可直接在通知中回复消息。本章将基于上一章学到的知识，创建一个使用此通知功能的示例应用。\n\
  \n### 62.1 创建 DirectReply 项目\n\n从欢迎界面中选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next`\
  \ 按钮之前，选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `DirectReply`，并指定 `com.ebookfrenzy.directreply`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 33`（Android 13），并将 `Language`\
  \ 菜单更改为 `Java`。按照节 11.8 Migrating a Project to View Binding 中概述的步骤修改项目以支持视图绑定。\n\
  \n### 62.2 设计用户界面\n\n将 `activity_main.xml` 布局文件加载到布局工具中。启用 `Autoconnect` 后，在现有的“Hello\
  \ World!”标签下方添加一个 `Button` 对象，如图 62-1 所示。在布局中选中 `Button` 组件后，使用 `Attributes` 工具窗口将\
  \ `onClick` 属性设置为调用名为 `sendNotification` 的方法。如有，使用 `Infer Constraints` 按钮为布局添加任何缺失的约束。在继续之前，选择“Hello\
  \ World!” `TextView`，将 `id` 属性更改为 `textView`，并将按钮上的文本修改为“Notify”：\n\n![](img/as_direct_reply_ui.jpg)\n\
  \n图 62-1\n\n## 62.3 请求通知权限\n\n在 `Project` 工具窗口中找到并双击 `AndroidManifest.xml` 文件，将其加载到编辑器中并修改\
  \ XML 以添加 `permission` 元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"\
  com.ebookfrenzy.audioapp\" >\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"\
  \ />\n</manifest>\n```\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和一个常量，用作所请求权限的标识码：\n\
  \n```java\nimport androidx.annotation.NonNull;\nimport androidx.core.app.ActivityCompat;\n\
  import androidx.core.content.ContextCompat;\nimport android.widget.Toast;\nimport\
  \ android.Manifest;\nimport android.content.pm.PackageManager;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int NOTIFICATION_REQUEST_CODE\
  \ = 101;\n}\n```\n\n接下来，需要向类中添加一个方法，其目的是将要请求的权限和对应的请求标识码作为参数。留在 `MainActivity.java`\
  \ 类文件中，按照如下方式实现该方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  \    }\n}\n```\n\n当请求被处理后，活动将调用 `onRequestPermissionsResult()` 方法，并传递标识码和请求结果。因此，下一步是在\
  \ `MainActivity.java` 文件中按如下方式实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode,\n        @NonNull String[] permissions, @NonNull int[] grantResults)\
  \ {\n    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == NOTIFICATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n            Toast.makeText(this,\
  \ \"Notification permission required\", Toast.LENGTH_LONG).show();\n        }\n\
  \    }\n}\n```\n\n在测试应用之前，剩下的工作是在应用启动时调用新添加的 `requestPermission()` 方法。留在 `MainActivity.java`\
  \ 文件中，按如下方式修改 `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\
  \ NOTIFICATION_REQUEST_CODE);\n}\n```\n\n## 62.4 创建通知通道\n\n与上一章的示例一样，在发送通知之前必须创建一个通道。编辑\
  \ `MainActivity.java` 文件并添加代码来创建一个新通道如下：\n\n```java\nimport android.app.NotificationChannel;\n\
  import android.app.NotificationManager;\nimport android.content.Context;\nimport\
  \ android.graphics.Color;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private NotificationManager notificationManager;\n    private final String\
  \ channelID = \"com.ebookfrenzy.directreply.news\";\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        notificationManager = (NotificationManager)\
  \ getSystemService(Context.NOTIFICATION_SERVICE);\n        createNotificationChannel(channelID,\
  \ \"DirectReply News\", \"Example Channel\");\n    }\n\n    protected void createNotificationChannel(String\
  \ id, String name, String description) {\n        int importance = NotificationManager.IMPORTANCE_HIGH;\n\
  \        NotificationChannel channel = new NotificationChannel(id, name, importance);\n\
  \        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLightColor(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400, 500, 400, 300,\
  \ 200, 400});\n        notificationManager.createChannel(channel);\n    }\n}\n```\n\
  \n### 62.5 构建 RemoteInput 对象\n\n使通知内联直接回复成为的关键元素是 `RemoteInput` 类。之前的章节介绍了 `PendingIntent`\
  \ 类，并解释了它如何允许一个应用程序创建一个意，然后授予其他应用程序和服务从外部启动该意的能力。在名为 Android Notifications Tutorial\
  \ 的章节中，创建了一个等待许可，允许从通知内部启动应用中的活动。`RemoteInput` 类允许将用户输入请求包含在 `PendingIntent` 对象中。当\
  \ `PendingIntent` 对象中的意被触发时（例如启动活动），该活动也将接收用户提供的任何输入。\n\n在通知中实现直接回复的第一步是创建 `RemoteInput`\
  \ 对象。这是通过 `RemoteInput.Builder()` 方法实现的。为了构建 `RemoteInput` 对象，需要一个键字符串，用于从结果意中提取输入。该对象还需要一个标签字符串，显示在通知的输入字段中。编辑\
  \ `MainActivity.java` 文件并添加 `sendNotification()` 方法。同时注意添加了一些将在章节后续中将使用的导入指令和变量：\n\
  \n```java\npackage com.ebookfrenzy.directreply;\n\nimport android.app.PendingIntent;\n\
  import android.app.RemoteInput;\nimport android.content.Intent;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private static final int notificationId\
  \ = 101;\n}\n```\n\n\n\n\n\n```java\n    private static final String KEY_TEXT_REPLY\
  \ = \"key_text_reply\";\n\n    private NotificationManager notificationManager;\n\
  \n    private static final String channelID = \"com.ebookfrenzy.directreply.news\"\
  ;\n\n    public void sendNotification(View view) {\n        String replyLabel =\
  \ \"Enter your reply here\";\n        RemoteInput remoteInput =\n              \
  \  new RemoteInput.Builder(KEY_TEXT_REPLY)\n                    .setLabel(replyLabel)\n\
  \                    .build();\n    }\n```\n\n现在，`RemoteInput` 对象已经使用键和标签字符串完成了创建并初始化，它需要被放置在通知操作对象中。在执行该步骤之前，需要创建\
  \ `PendingIntent` 实例。\n\n### 62.6 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与 \"\
  Android 通知入门教程\"章节中概述的步骤相同，不同在于意图将配置为启动 `MainActivity`。留在 `MainActivity.java` 文件中，添加以下代码来创建\
  \ `PendingIntent`：\n\n```java\npublic void sendNotification(View view) {\n    String\
  \ replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput =\n     \
  \       new RemoteInput.Builder(KEY_TEXT_REPLY)\n                    .setLabel(replyLabel)\n\
  \                    .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n            PendingIntent.getActivity(\n\
  \                    this,\n                    0,\n                    resultIntent,\n\
  \                    PendingIntent.FLAG_MUTABLE\n            );\n}\n```\n\n### 62.7\
  \ 创建回复操作\n\n内联回复将通过操作按钮在通知中访问。该操作需要被创建，并配置图标、显示在按钮上的标签、`PendingIntent` 对象以及 `RemoteInput`\
  \ 对象。修改 `sendNotification()` 方法以添加创建此操作的代码：\n\n```java\nimport android.graphics.drawable.Icon;\n\
  import android.app.Notification;\n\npublic void sendNotification(View view) {\n\
  \    String replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput\
  \ =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n                    .setLabel(replyLabel)\n\
  \                    .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n            PendingIntent.getActivity(\n\
  \                    this,\n                    0,\n                    resultIntent,\n\
  \                    PendingIntent.FLAG_MUTABLE\n            );\n    final Icon\
  \ icon =\n            Icon.createWithResource(MainActivity.this,\n            android.R.drawable.ic_dialog_info);\n\
  \    Notification.Action replyAction =\n            new Notification.Action.Builder(\n\
  \                    icon,\n                    \"Reply\", resultPendingIntent)\n\
  \                    .addRemoteInput(remoteInput)\n                    .build();\n\
  }\n```\n\n在教程的这一阶段，我们已经构建并准备好使用的 `RemoteInput`、`PendingIntent` 和 `Notification`\
  \ 对象。下一阶段是构建并发布通知：\n\n```java\npublic void sendNotification(View view) {\n    String\
  \ replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput =\n     \
  \       new RemoteInput.Builder(KEY_TEXT_REPLY)\n            .setLabel(replyLabel)\n\
  \            .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n            PendingIntent.getActivity(\n\
  \                this,\n                0,\n                resultIntent,\n    \
  \            PendingIntent.FLAG_IMMUTABLE\n            );\n    final Icon icon =\n\
  \        Icon.createWithResource(MainActivity.this,\n        android.R.drawable.ic_dialog_info);\n\
  \    Notification.Action replyAction =\n            new Notification.Action.Builder(\n\
  \                icon,\n                \"Reply\", resultPendingIntent)\n      \
  \      .addRemoteInput(remoteInput)\n            .build();\n    Notification newMessageNotification\
  \ =\n        new Notification.Builder(this, channelID)\n        .setColor(ContextCompat.getColor(this,\n\
  \            android.R.color.holo_blue_dark))\n        .setSmallIcon(\n        \
  \    android.R.drawable.ic_dialog_info)\n        .setContentTitle(\"My Notification\"\
  )\n        .setContentText(\"This is a test message\")\n        .addAction(replyAction).build();\n\
  \    NotificationManager notificationManager =\n        (NotificationManager)\n\
  \        getSystemService(Context.NOTIFICATION_SERVICE);\n    notificationManager.notify(notificationId,\n\
  \        newMessageNotification);\n}\n```\n\n完成更改后，编译并运行应用，允许通知，并测试点击按钮是否会发布通知。查看通知栏时，通知应如图\
  \ 62-2 所示：\n\n![](img/as_direct_reply.jpg)\n\n图 62-2\n\n点击“回复”（Reply）操作按钮，出现文本输入字段，并显示创建\
  \ `RemoteInput` 对象时嵌入的回复标签。\n\n![](img/as_direct_reply_enter.jpg)\n\n图 62-3\n\n\
  输入一些文本并点击输入字段末端的发送箭头。\n\n### 62.8 接收直接回复\n\n现在通知成功向用户获取输入，应用需要对该输入进行处理。本教程的目标是将用户在通知中输入的文本显示在活动用户界面的\
  \ `TextView` 组件上。\n\n当用户输入文本并点击发送按钮时，`MainActivity` 通过 `PendingIntent` 对象中的 `intent`\
  \ 启动。该意图中包含了用户通过通知输入的文本。在 的 `onCreate()` 方法中，调用 `getIntent()` 方法将返回启动该活动的 `intent`\
  \ 副本。将其传递给 `RemoteInput.getResultsFromIntent()` 方法反而会返回一个包含回复文本的 `Bundle` 对象，该对象可以被提取并分配给\
  \ `TextView` 组件。这导致 `MainActivity.java` 文件中的 `onCreate()` 方法修改如下：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    createNotificationChannel(channelID,\
  \ \"DirectReply News\",\n            Example News Channel);\n    handleIntent();\n\
  }\n\nprivate void handleIntent() {\n    Intent intent = this.getIntent();\n    Bundle\
  \ remoteInput = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput !=\
  \ null) {\n        String inputString = remoteInput.getCharSequence(\n         \
  \       KEY_TEXT_REPLY).toString();\n        binding.textView.setText(inputString);\n\
  \    }\n}\n```\n\n在进行这些代码更改后，再次构建并运行应用。点击按钮发布通知，并在通知栏内输入并发送一些文本。注意 `MainActivity`\
  \ 中的 `TextView` 组件已更新，以显示所输入的内联文本。\n\n### 62.9 更新通知\n\n在通知中发送回复后，你可能会注意到通知栏中的进度指示器仍在旋转，如图\
  \ 62-4 所示：\n\n![](img/as_direct_reply_progress.jpg)\n\n图 62-4\n\n\n\n\n通知显示此指示器，是因为它正在等待活动确认接收已发送文本的响应。执行此任务的推荐方法是使用新消息更新通知，指示回复已收到并已处理。由于原始通知在发布时已分配了一个\
  \ ID，因此可以再次使用它来执行更新。将以下代码添加到 `handleIntent()` 方法中以执行此任务：\n\n```java\nprivate void\
  \ handleIntent() {\n    Intent intent = this.getIntent();\n    Bundle remoteInput\
  \ = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput != null) {\n\
  \        String inputString = remoteInput.getCharSequence(\n                KEY_TEXT_REPLY).toString();\n\
  \        binding.myTextView.setText(inputString);\n        Notification repliedNotification\
  \ =\n                new Notification.Builder(this, channelID)\n               \
  \         .setSmallIcon(\n                                    android.R.drawable.ic_dialog_info)\n\
  \                        .setContentText(\"Reply received\")\n                 \
  \       .build();\n        notificationManager.notify(notificationId,\n        \
  \        repliedNotification);\n    }\n}\n```\n\n最后测试一次应用程序，验证在行内回复文本发送后进度指示器会消失，并且会出现新面板，表示回复已收到：\n\
  \n![](img/as_direct_reply_received.jpg)\n\n图 62-5\n\n### 62.10 总结\n直接回复通知功能允许用户在通知内输入文本，并通过\
  \ intent 传递给相应应用程序的活动。直接回复通过 `RemoteInput` 类实现，该类的实例可以嵌入到操作（action）中并与通知打包。在处理直接回复通知时，让\
  \ `NotificationManager` 服务知道回复已收到并处理是非常关重要的。实现这一目标的最佳方法是使用首次发布通知时提供的 `notification\
  \ ID` 来更新通知消息。\n\n## 63 折叠屏设备与多窗口支持\n无论我们是否准备好，折叠屏设备都会到来（对于第一代三星 Galaxy Fold 来说，可能在设备本身准备好之前就出现了）。为了给这一新类设备做准备，注意一些需要采取的额外步骤，以确保您的应用在折叠屏设备上运行时运行正常。\n\
  \n幸运的是，支持折叠屏设备的大部分行为已经以多窗口支持的形式存在 Android 中。\n\n### 63.1 折叠屏与多窗口支持\n当应用在折叠屏设备上运行时，它可能会与其他应用共享屏幕，并遇到重大的配置更改（例如当用户折叠或展开显示器时屏幕尺寸发生的变化）。如果您的应用已经设计为可以处理设备方向的变化，那么它很可能也能处理由屏幕折叠引起的变化，尽管建议进行彻底测试。\n\
  \n多窗口支持最初是在 Android 7 中引入的。与之前的 Android 版本不同，Android 7 中的多窗口支持允许在设备屏幕上同时显示多个活动。\n\
  \nAndroid 中的多窗口支持提供了三种不同形式的窗口支持。分屏模式适用于大多数手机、折叠屏设备和平板设备，它提供了一个分屏环境，其中两个活动并排或上下堆叠显示。它提供了一个可移动的分隔符，用户拖动它时可以调整分配给每个相邻活动的屏幕百分比：\n\
  \n![](img/Image24272.jpg)\n\n图 63-1\n\n自由窗口模式（Freeform mode）为大屏幕设备提供了一个窗口化环境，目前由设备制造商决定启用。自由窗口与分屏模式的不同之处在于，它允许每个活动出现在独立的、可调整大小的窗口中，并且限制同时显示两个活动。例如，图\
  \ 63-2 显示了一个处于自由窗口模式的设备，计算器和另一个应用在单独窗口中显示：\n\n![](img/Image2472.jpg)\n\n图 63-2\n\
  \n画中画（Picture-in-picture）支持顾如其义，允许视频在用户执行其他任务时在较小的窗口中播放，将在“Android 画中画”部分介绍。\n\n\
  ### 63.2 使用折叠屏模拟器\n尽管在编写时市场上还没有可以进行测试的折叠屏设备，但 Android SDK 包含了折叠屏模拟器。创建折叠屏模拟器，选择\
  \ Android Studio -> AVD Manager 菜单，点击 Create Device 按钮，并在硬件选择屏幕上，如图 63-3 所示选择一个\
  \ Foldable 选项：\n\n![](img/avd.jpg)\n\n图 63-3\n\n选择折叠屏后，继续创建过程，选择 Android 10 或更高版本作为系统镜像。一旦模拟器启动，工具栏上将出现一个额外的按钮，允许模拟器在折叠和展开配置之间切换：\n\
  \n![](img/fold_button.jpg)\n\n图 63-4\n\n### 63.3 进入多窗口模式\n可以通过显示概览（Overview）屏幕、长按工具栏中的应用图标并按图\
  \ 63-5 所示选择分屏菜单选项来进入分屏模式：\n\n![](img/button.jpg)\n\n图 63-5\n\n进入分屏模式后，概览按钮将变为两个矩形（如图\
  \ 63-6 中标记为 A），当前活动将占据屏幕的一部分 (B)，概览屏幕将出现在屏幕的相邻部分，允许选择第二个活动进行显示 (C)：\n\n![](img/select_app.jpg)\n\
  \n图 63-6\n\n一旦选择了第二个应用，屏幕将如上文图 63-1 所示被平分。要退出分屏模式，只需将分离两个活动的分隔符拖到边缘，使一个活动占据整个屏幕，或者长按概览按钮直到它恢复为单个正方形。\n\
  \n### 63.4 启用并使用自由窗口支持\n虽然在所有设备上都得到正式支持，但在大屏幕设备和模拟器上启用自由窗口多窗口模式是可能的。要启用此模式，在模拟器运行时或设备连接时运行以下\
  \ `adb` 命令：\n\n```\nadb shell settings put global enable_freeform_support 1\n```\n\
  \n进行此更改后，可能需要重启设备使设置生效。\n\n\n\n如本章早期概述，Google 将是否启用自由窗口多窗口模式（freeform multi-window\
  \ mode）的选择交给了各个 Android 设备制造商。由于自由窗口仅在较大的设备上使用才有意义，因此无法保证每个可能运行应用程序的设备上都支持自由窗口模式。幸运的是，如果设备不支持自由窗口模式，系统将忽略所有与自由窗口特定的方法和属性，因此使用这些内容不会导致应用在不支持自由窗口的设备上崩溃。然而，可能会出现需要检测设备是否支持自由窗口多窗口模式的情况。幸运的是，可以通过检查包管理器（package\
  \ manager）中的自由窗口管理功能来实现。下面的代码示例检查了自由窗口多窗口的支持，并根据测试结果返回 `Boolean` 值：\n\n```java\n\
  public Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(\n\
  \            PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT);\n}\n```\n\n###\
  \ 63.6 在 App 中启用多窗口支持\n\n`android:resizableActivity` 清单文件设置控制应用是否支持多窗口行为。此设置可以在应用程序级或单个\
  \ Activity 级进行。例如，下面的代码片段配置了名为 `MainActivity` 的 Activity 同时支持分屏和自由窗口多窗口模式：\n\n```xml\n\
  <activity\n    android:name=\".MainActivity\"\n    android:resizeableActivity=\"\
  true\"\n    android:label=\"@string/app_name\"\n    android:theme=\"@style/AppTheme.NoActionBar\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n将该属性设置为 `false` 将防止该 Activity 在分屏或自由窗口模式下出现，且对应的按钮将出现在应用的概览（Overview）菜单中。在分屏配置中选择一个已禁用多窗口支持的\
  \ Activity 作为第二个 Activity，将显示一条消息，指示该应用可能不支持多窗口模式。\n\n### 63.7 指定多窗口属性\n\n`<layout>`\
  \ 元素提供了许多属性，用于指定 Activity 在以多窗口模式启动启动时的尺寸和位置。当 Activity 在自由窗口模式下启动时，其初始高度、宽度和位置可以使用以下属性指定：\n\
  \n- `android:defaultWidth` – 指定 Activity 的默认宽度。\n- `android:defaultHeight` – 指定\
  \ Activity 的默认高度。\n- `android:gravity` – 指定 Activity 的初始位置（start、end、left、right、top\
  \ 等）。\n\n注意，上述属性仅在 Activity 在自由窗口模式下显示时才生效。下面的示例配置了 Activity 在屏幕起始边缘的顶部以特定的高度和宽度显示：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:defaultHeight=\"\
  350dp\"\n             android:defaultWidth=\"450dp\"\n             android:gravity=\"\
  start|end\" />\n</activity>\n```\n\n可以使用以下 `<layout>` 属性来指定 Activity 在分屏视图或自由窗口模式下可以缩小的最小宽度和高度：\n\
  \n- `android:minimalHeight` – 指定 Activity 在分屏或自由窗口模式下可以缩减的最小高度。\n- `android:minimalWidth`\
  \ - 指定 Activity 在分屏或自由窗口模式下可以缩减的最小宽度。\n\n当用户将分屏分割线滑出最小高度或宽度边界时，系统将停止调整收缩中 Activity\
  \ 的布局，并简单地裁剪用户界面以为相邻的 Activity 留出空间。\n\n下面的清单文件片段为 Activity 实现了最小宽度和高度属性：\n\n```xml\n\
  <activity android:name=\".MainActivity \">\n    <layout android:minimalHeight=\"\
  400dp\"\n             android:minimalWidth=\"290dp\" />\n</activity>\n```\n\n###\
  \ 63.8 在 Activity 中检测多窗口模式\n\n可能会出现 Activity 需要检测其当前是否正以多窗口模式显示给用户的情况。可以通过调用 `Activity`\
  \ 类的 `isInMultiWindowMode()` 方法获取当前状态。调用此方法时，根据 Activity 当前是否处于全屏状态返回 `true` 或 `false`\
  \ 值：\n\n```java\nif (this.isInMultiWindowMode()) {\n    // Activity 运行在多窗口模式\n}\
  \ else {\n    // Activity 不处于多窗口模式\n}\n```\n\n### 63.9 接收多窗口通知\n\n如果 Activity 重写了\
  \ `onMultiWindowModeChanged()` 回调方法，将接收进入或退出多窗口模式的通知。传递给方法的第一个参数在进入多窗口模式时为 `true`，在\
  \ Activity 退出该模式时为 `false`。新的配置设置包含在作为第二个参数传递的 `Configuration` 对象中：\n\n```java\n\
  @Override\npublic void onMultiWindowModeChanged(boolean isInMultiWindowMode, Configuration\
  \ newConfig) {\n    super.onMultiWindowModeChanged(isInMultiWindowMode, newConfig);\n\
  \    if (isInMultiWindowMode) {\n        // Activity 进入了多窗口模式\n    } else {\n  \
  \      // Activity 退出了多窗口模式\n    }\n}\n```\n\n由于 Android 10 及更高版本允许多个 Activity 处于恢复状态（也称为多恢复，multi-resume），用户最近交互的\
  \ Activity 被称为顶层恢复 Activity（topmost resumed activity）。为了跟踪 Activity 获取或丢失顶层状态，可以在\
  \ Activity 中实现 `onTopResumedChanged()` 回调方法，例如：\n\n```java\n@Override\npublic void\
  \ onTopResumedChanged(boolean isTopResumedActivity) {\n    super.onTopResumedChanged(isTopResumedActivity);\n\
  \    // 注意：此处原文代码逻辑可能为示意， \n    // 实际开发中方法名和参数需根据具体 API 定义调整。\n}\n```\n\n在某些运行 Android\
  \ 9 的设备上，通过在应用清单文件中启用以下属性，也可能在应用中利用多恢复：\n\n```xml\n<meta-data android:name=\"android.allow_resumed_activities\"\
  \ android:value=\"true\" />\n```\n\n## 63.10 在多窗口模式下启动 Activity\n\n在本书的“显式 Intent\
  \ 实例演示”章节中，创建了一个示例应用，其中 Activity 使用 Intent 启动另一个 Activity。默认情况下，通过 Intent 启动的 Activity\
  \ 被认为位于源 Activity 同一任务栈中。然而，通过 Intent 传递相应的标记可以将 Activity 启动到新的任务栈。\n\n当多窗口模式下的\
  \ Activity 在同一任务栈中启动另一个 Activity 时，新 Activity 将替换分屏或自由窗口中的源 Activity（用户通过返回键回到原始\
  \ Activity）。\n\n然而，在分屏模式下启动新的任务栈时，第二个 Activity 将出现在原始 Activity 相邻的窗口中，允许同时查看两个 Activity。自由窗口模式下，启动的\
  \ Activity 将出现在原始 Activity 独立的窗口中。\n\n要将 Activity 启动到新的任务栈，必须启动 Intent 前设置以下标记：\n\
  \n- `Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT`\n- `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n\
  - `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n下面的代码示例配置并启动了设计在独立窗口中显示的第二个 Activity：\n\n\n\
  \n\n\n```java\nIntent i = new Intent(this, SecondActivity.class);\n\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n\
  \           Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  startActivity(i);\n```\n\n## 63.11 配置自由窗口活动的大小和位置\n\n默认情况下，在自由窗口（freeform）模式下启动到不同任务栈的活动将将置于屏幕中心，其大小由系统决定。通过通过\
  \ `ActivityOptions` 类向 `intent` 传递启动边界（launch bounds）设置，可以控制此窗口的位置和尺寸。此过程的第一步是创建一个\
  \ `Rect` 对象，并配置代表活动窗口的矩形的左 (`X`）、顶 (`Y`）、右 (`X`）和底 (`Y`）坐标。例如，以下代码创建了一个 `Rect` 对象，其左上角位于坐标\
  \ `(0, 0)`，右下角位于 `(100, 100)`：\n\n```java\nRect rect = new Rect(100, 800, 900, 700);\n\
  ```\n\n下一步是创建 `ActivityOptions` 类的基本实例，并通过 `setLaunchBounds()` 方法通过 `Rect` 设置对其初始化：\n\
  \n```java\nActivityOptions options = ActivityOptions.makeBasic();\nActivityOptions\
  \ bounds = options.setLaunchBounds(rect);\n```\n\n最后，将 `ActivityOptions` 实例转换为 `Bundle`\
  \ 对象，并连同 `Intent` 对象一起传递给 `startActivity()` 方法：\n\n```java\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n结合这些步骤，代码序列如下：\n\n```java\nIntent i = new Intent(this, SecondActivity.class);\n\
  \ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n           Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n\
  \           Intent.FLAG_ACTIVITY_NEW_TASK);\nRect rect = new Rect(100, 800, 900,\
  \ 700);\nActivityOptions options = ActivityOptions.makeBasic();\nActivityOptions\
  \ bounds = options.setLaunchBounds(rect);\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源活动处于自由窗口模式时，通过 intent 启动第二个活动，新活动窗口将以 `Rect` 对象中定义的位置和尺寸出现。\n\n### 63.12\
  \ 总结\n\nAndroid 7 引入了多窗口支持，这种系统允许在任何时候在屏幕上显示多个活动。此功能现在构成了为折叠设备提供支持的基础。多窗口支持提供的三种模式是分屏（split-screen）、自由窗口（freeform）和画中画（picture-in-picture）。在分屏模式下，屏幕水平或垂直分为两个窗格，每个窗格显示一个活动。自由窗口模式仅支持某些\
  \ Android 设备，允许每个活动出现在独立的、可移动且可调整大小的窗口中。如本章概述，Android SDK 提供了许多方法和属性设置，用于检测、响应和控制应用内部的多窗口行为。\n\
  \n## 64. Android SQLite 数据库概述\n\n不需要存储至少一些持久数据的移动应用寥寥无几。数据库的使用是大多数应用程序的一个要素，范围从几乎完全由数据驱动的应用到需要存储少量数据（如当前的游戏得分）的应用。\n\
  \n在考虑到典型的 Android 应用的瞬时生命周期时，持久数据存储的重要性变得更加明显。由于 Android 运行时系统始终存在终止应用组件以释放资源的风险，因此一个全面的数据存储策略以避免数据丢失是设计和实现任何应用的关键因素。\n\
  \n本章将提供 SQLite 和数据库表的概述。\n\n### 64.1 理解数据库表\n\n数据库表（Database Tables）提供了最基础的结构。每个表可以包含数据。例如，一个表可能包含客户信息。\n\
  \n### 64.2 引入数据库模式\n\n模式（Schemas）定义了数据的特征。例如，模式可以定义一个长度不超过 20 个字符的字符串。\n\n### 64.3\
  \ 列和数据类型\n\n在此阶段，将数据库视为类似于电子表格是有帮助的。每一列代表一个数据字段。每列定义了一个特定的类型。\n\n### 64.4 数据库行\n\
  \n保存到表的每个新记录都存储在行中。再次考虑电子表格类比。客户表中的每个条目都相当于电子表格中的行。\n\n### 64.5 引入主键\n\n每个数据库表都应该包含一个或多个列，用于唯一标识表中的每一行。这在数据库术语中被称为主键（Primary\
  \ Key）。主键允许数据库管理系统唯一地识别表中的特定行。\n\n\n\n\n\nSQLite 是一种嵌入式关系型数据库管理系统（RDBMS）。大多数关系型数据库（以\
  \ `Oracle`、`SQL Server` 和 `MySQL` 为例）都是独立运行的服务器进程，与需要数据库访问的应用程序协作。SQLite 被称为嵌入式，是因为它以库的形式提供并链接到应用程序中。因此，后台没有运行一个独立的数据库服务器。所有的数据库操作都是通过通过调用\
  \ SQLite 库中的函数在应用程序内部进行处理的。\n\nSQLite 的开发者已将该技术投入了公有领域，因此它现在已成为广泛部署的数据库解决方案。\n\n\
  SQLite 使用 `C` 语言编写，因此 Android SDK 在底层数据库接口之上提供了一个基于 Java 的“封装”。它由许多类组成，可以在应用程序的\
  \ `Java` 或 `Kotlin` 代码中使用这些类来创建和管理基于 SQLite 的数据库。\n\n有关关于 SQLite 的更多信息，请参考 [`www.sqlite.org`](https://www.sqlite.org)。\n\
  \n### 64.7 结构化查询语言 (SQL)\n\nSQLite 数据库使用一种名为结构化查询语言的高级语言来访问数据。这通常缩写为 `SQL`，读作 `sequel`。`SQL`\
  \ 是大多数关系型数据库管理系统使用的标准语言。SQLite 大多数符合 `SQL-92` 标准。\n\n`SQL` 是一种直观且易于使用的语言，专门设计用于读写数据库数据。由于\
  \ `SQL` 包含了一组较小的关键字，因此可以快速学习。此外，大多数 DBMS 实现之间的 `SQL` 语法在很大程度上是相同，因此在学习了某个系统的 `SQL`\
  \ 后，你的技能很可能会迁移到其他数据库管理系统。\n\n虽然本章将使用一些基本的 `SQL` 语句，但对 `SQL` 的详细概述超出了本书的范围。然而，许多其他资源提供了比我们在这里单个章节中能提供的详尽得多的\
  \ `SQL` 概述。\n\n### 64.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\n\n对于对数据库和 `SQLite` 不熟悉的读者来说，直接开始创建一个使用\
  \ `SQLite` 的 Android 应用程序可能看起来望而却步。幸运的是，Android 预装了 `SQLite`，包括一个交互式环境，可以在连接到运行中的\
  \ Android `AVD` 模拟器实例的 `adb shell` 会话中发布 `SQL` 命令。这是学习 `SQLite` 和 `SQL` 的实用方法，也是识别运行在模拟器中的应用程序创建的数据库问题的价值工具。\n\
  \n要启动交互式 `SQLite` 会话，首先运行 `AVD` 会话。这可以在 Android Studio 中通过启动 Android 虚拟机管理器（`Tools`\
  \ -> `AVD Manager`）、选择一个之前配置过的 `AVD` 并点击启动按钮来实现。\n\n一旦 `AVD` 启动，打开 `Terminal` 或\
  \ `Command-Prompt` 窗口并使用 `adb` 命令行工具连接到模拟器（注意 `-e` 标志指示工具查找要连接的模拟器，而不是物理设备）：\n\n\
  ```bash\nadb –e shell\n```\n\n连接后，shell 环境将提供一个可以输入命令的命令提示符（command prompt）。首先使用\
  \ `su` 命令获取超级用户权限：\n\n```bash\nGeneric_x86:/ su\nroot@android:/ #\n```\n\n如果消息显示不允许超级用户权限，则\
  \ `AVD` 实例可能包含 Google Play 支持。要解决这个问题，请创建一个新的 `AVD`，并在“选择设备定义”屏幕上选择一个“Play Store”列中没有标记的设备。\n\
  \n`SQLite` 数据库中的数据存储在运行应用程序的 Android 设备的文件系统的数据库文件中。默认情况下，这些数据库文件的文件系统路径如下：\n\n\
  `/data/data/<package name>/databases/<database filename>.db`\n\n例如，如果包名为 `com.example.MyDBApp`\
  \ 的应用程序创建了一个名为 `mydatabase.db` 的数据库，则设备上的文件路径将如下：\n\n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\
  \n因此，在 `adb shell` 中切换目录到 `/data/data` 并创建一个适用于某些 `SQLite` 实验的子目录层次结构：\n\n```bash\n\
  cd /data/data\nmkdir com.example.dbexample\ncd com.example.dbexample\nmkdir databases\n\
  cd databases\n```\n\n为数据库文件创建合适的位置后，按如下方式启动交互式 `SQLite` 工具：\n\n```bash\nroot@android:/data/data/databases\
  \ # sqlite3 ./mydatabase.db\nsqlite3 ./mydatabase.db\nSQLite version 3.8.10.2 2015-05-20\
  \ 18:17:19\nEnter \".help\" for usage hints.\nsqlite>\n```\n\n在 `sqlite>` 提示符下，可以输入命令来执行创建表、插入和检索数据等任务。例如，要在我们的数据库中创建一个包含存储\
  \ ID、名称、地址和电话字段的新表，需要以下语句：\n\n```sql\ncreate table contacts (_id integer primary\
  \ key autoincrement, name text, address text, phone text);\n```\n\n注意，表中的每一行都应该有一个对该行唯一的主键。在上面的示例中，我们将\
  \ `ID` 字段指定为主键，将其声明为 `integer` 类型，并要求 `SQLite` 在每次添加新行时自动增加该数字。这是确保每行都有一个唯一主键的常用方法。在大多数其他平台上，主键名称的选择是任意的。但在\
  \ Android 的情况下，为了能够使用所有 Android 相关的类访问数据库，主键必须命名为 `_id`。其余字段每个都声明为 `text` 类型。\n\n\
  要列出当前数据库中的表，使用 `.tables` 语句：\n\n```sql\nsqlite> .tables\ncontacts\n```\n\n向表中插入记录：\n\
  \n```sql\nsqlite> insert into contacts (name, address, phone) values (\"Bill Smith\"\
  , \"123 Main Street, California\", \"123-555-2323\");\nsqlite> insert into contacts\
  \ (name, address, phone) values (\"Mike Parks\", \"10 Upping Street, Idaho\", \"\
  444-444-1212\");\n```\n\n从表中检索所有行：\n\n```sql\nsqlite> select * from contacts;\n\
  1|Bill Smith|123 Main Street, California|123-555-2323\n2|Mike Parks|10 Upping Street,\
  \ Idaho|444-444-1212\n```\n\n提取符合特定标准的行：\n\n```sql\nsqlite> select * from contacts\
  \ where name=\"Mike Parks\";\n2|Mike Parks|10 Upping Street, Idaho|444-444-1212\n\
  ```\n\n退出 sqlite3 交互式环境：\n\n```sql\nsqlite> .exit\n```\n\n### 64.9 Android Room\
  \ 持久化库\n\n\n\n\n\n如前所述，SQLite 是 C 语言编写的，而 Android 应用主要使用 Java 或 Kotlin 开发。为了弥补过去的这种“语言鸿沟”，Android\
  \ SDK 包含了一组类，它们在 SQLite 数据库管理系统之上提供了一个层。尽管这些类在 SDK 中已可用，但使用它们仍然需要编写大量的代码，并且没有利用\
  \ `LiveData` 和生命周期管理等新的架构指南和特性。Android Jetpack 架构组件包含了 Room 持久化库来解决这些缺点。该库在 SQLite\
  \ 数据库系统之上提供了一个高层接口，使得能够以极少的代码在 Android 设备上进行本地数据存储，同时符合现代应用架构的建议。\n\n接下来的几章将提供使用\
  \ Room 持久化库进行 SQLite 数据库管理的概述和教程。\n\n### 64.10 总结\n\nSQLite 是一种轻量级的嵌入式关系型数据库管理系统，包含在\
  \ Android 框架中，为 Android 应用提供了组织的持久化数据存储机制。与 Room 持久化库结合使用，Android 提供了一种从应用内部实现数据存储的现代方法。\n\
  \n本章概述了 Android 应用开发背景下的通用数据库，特别是 SQLite。接下来的章节将提供 Room 持久化库的概述，之后我们将完成示例应用的创建。\n\
  \n## 65. Android Room 持久化库\n\nRoom 持久化库包含在 Android 架构组件中，旨在以符合 Android 架构指南的方式为\
  \ Android 应用更容易添加数据库存储支持。在上一章涵盖了 SQLite 数据库基础的基础上，本章将探索基于 Room 的数据库管理背后的基本概念、协作在\
  \ Android 应用中实现 Room 支持的关键元素，以及这些元素在架构和编码方面是如何实现的。在涵盖这些主题后，接下来的两章将通过示例 Room 数据库项目将这些理论付诸实践。\n\
  \n### 65.1 回顾现代应用架构\n\n标题为“使用 Jetpack 构建现代 Android 应用架构`的章节介绍了现代应用架构的概念，并强调了分离应用内不同责任区域的重要性。图\
  \ 65-1 中插示的图表概述了典型 Android 应用的推荐架构：\n\n![](img/room_diagram_1.jpg)\n\n图 65-1\n\n\
  由于本书的前几章节已详细介绍了该架构的前三个层次，现在是可以在 Room 持久化库的背景下探索仓库（Repository）和数据库架构层了。\n\n### 65.2\
  \ Room 数据库持久化的关键元素\n\n在章节后面详细介绍之前，首先值得总结使用 Room 持久化库处理 SQLite 数据库时涉及的关键元素：\n\n###\
  \ 65.2.1 仓库 (Repository)\n\n如前所述，仓库模块包含了直接处理应用所用所有数据源所需代码。这避免了 UI 控制器和 `ViewModel`\
  \ 需要包含直接访问数据库或网络服务的代码。\n\n### 65.2.2 Room 数据库\n\n`room database` 对象提供了访问底层 SQLite\
  \ 数据库的接口。它还为仓库提供了访问数据访问对象（`DAO`）的权限。应用应该只有一个 `room database` 实例，该实例可以用于访问多个数据库表。\n\
  \n### 65.2.3 数据访问对象 (DAO)\n\n`DAO` 包含了仓库在 SQLite 数据库中插入、检索和删除数据所需的 SQL 语句。这些 SQL\
  \ 语句被映射到方法，然后从仓库内部调用这些方法来执行相应的查询。\n\n### 65.2.4 实体 (Entities)\n\n实体是定义数据库中表结构的类，它定义了表名、列名和数据类型，并标识哪一列是主键。除了声明表结构外，实体类还包含提供对这些数据字段访问的\
  \ getter 和 setter 方法。`DAO` 响应 SQL 查询方法调用返回给仓库的数据将以这些实体类实例的形式存在。然后将调用 getter 方法从实体对象中提取数据。同样，当仓库需要向数据库写入新记录时，它会创建一个实体实例，通过\
  \ setter 调用在对象上配置值，然后调用 `DAO` 中声明的 `insert` 方法，并传递要保存的实体实例。\n\n### 65.2.5 SQLite\
  \ 数据库\n\nSQLite 数据库负责存储和提供数据的访问。应用代码（包括仓库）永远不应直接访问此底层数据库。所有的数据库操作都是通过 `room database`、`DAOs`\
  \ 和实体的组合完成的。\n\n图 65-2 中的架构图说明了这些不同元素如何交互以在 Android 应用中提供基于 Room 的数据库存储：\n\n![](img/room_architecture_diagram.jpg)\n\
  \n图 65-2\n\n上述架构图中的带编号连接可以总结如下：\n\n1. 仓库与 `Room Database` 交互以获取数据库实例，该实例反过来用于获取\
  \ `DAO` 实例的引用。\n2. 仓库创建实体实例并使用数据配置它们，然后将它们传递给 `DAO` 用于搜索和插入操作。\n3. 仓库调用 `DAO` 上的方法并传递要插入数据库的实体，并在响应搜索查询时接收实体实例。\n\
  4. 当 `DAO` 有结果要返回给仓库时，它将结果封装成实体对象。\n5. `DAO` 与 `Room Database` 交互以启动数据库操作并处理结果。\n\
  6. `Room Database` 处理与底层 SQLite 数据库的所有低级交互，提交查询并接收结果。\n\n在涵盖了使用 Room 持久库访问数据库的基本元素概述后，是时候详细探索实体、`DAOs`\
  \ 和 `room databases` 了。\n\n### 65.3 理解实体\n\n每个数据库表都有与其关联的实体类。该类定义了表结构，并呈现为一个插有 Room\
  \ 注解的 Java 类。一个声明存储在数据库中的示例 Java 类可能如下：\n\n```java\npublic class Customer {\n  \
  \  private int id;\n    private String name;\n    private string address;\n\n  \
  \  public Customer(String name, String address) {\n        this.id = id;\n     \
  \   this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public int getAddress() {\n        return\
  \ this.address;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n\
  \    }\n\n    public void setName(String name) {\n        this.name = name;\n  \
  \  }\n\n    public void setAddress(int quantity) {\n        this.address = address;\n\
  \    }\n}\n```\n\n按照目前的实现，上述代码声明了一个基础 Java 类，包含几个表示数据库表字段的变量以及一组 getter 和 setter\
  \ 方法。然而，该类尚未成为实体。要使此类变为实体并使其在 SQL 语句中可用，需要添加一些 Room 注解：\n\n```java\n@Entity(tableName\
  \ = \"customers\")\n```\n\n\n\n\n\n```java\npublic class Customer {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @NonNull\n    @ColumnInfo(name = \"customerId\")\n    private int\
  \ id;\n\n    @ColumnInfo(name = \"customerName\")\n    private String name;\n  \
  \  private String address;\n\n    public Customer(String name, String address) {\n\
  \        this.id = id;\n        this.name = name;\n        this.address = address;\n\
  \    }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public String getAddress()\
  \ {\n        return this.address;\n    }\n\n    public void setId(@NonNull int id)\
  \ {\n        this.id = id;\n    }\n\n    public void setName(String name) {\n  \
  \      this.name = name;\n    }\n\n    public void setAddress(int quantity) {\n\
  \        this.address = address;\n    }\n}\n```\n\n上述注解首先声明该类表示一个实体，并分配了一个名为“customers”的表名。在\
  \ DAO SQL 语句中，将通过此名称引用该表：\n\n`@Entity(tableName = \"customers\")`\n\n每个数据库表都需要一列作为主键。在这种情况下，customer\
  \ id 被声明为主键。还添加了注解来指定在 SQL 查询中引用的列名，并指明该字段不能存储空值。最后，id 值被配置为自动生成。这意味着系统会自动为新记录生成分配\
  \ id，以避免键冲突：\n\n`@PrimaryKey(autoGenerate = true)`\n`@NonNull`\n`@ColumnInfo(name\
  \ = \"customerId\")`\n`private int id;`\n\ncustomer name 字段也分配了一个列名。但请注意，address\
  \ 字段没有分配列名。这意味着 address 数据仍将存储在数据库中，但在 SQL 语句中不需要引用。如果实体中的某个字段不需要存储在数据库中，请使用 `@Ignore`\
  \ 注解：\n\n`@Ignore`\n`private String myString;`\n\n最后，对 `id` 变量的设置方法（setter method）进行了修改，以防止尝试分配空值：\n\
  \n```java\npublic void setId(@NonNull int id) {\n    this.id = id;\n}\n```\n\n实体类中也可以包含注解，以使用关系型数据库中称为“外键”（foreign\
  \ keys）的概念来与其他实体建立关系。外键允许一个表引用另一个表中的主键。例如，可以在名为 `Purchase` 的实体与我们现有的 `Customer`\
  \ 实体之间建立如下关系：\n\n```java\n@Entity(foreignKeys = {@ForeignKey(entity = Customer.class,\n\
  \        parentColumns = \"customerId\",\n        childColumns = \"buyerId\",\n\
  \        onDelete = ForeignKey.CASCADE,\n        onUpdate = ForeignKey.RESTRICT})\n\
  public class Purchase {\n    @PrimaryKey(autoGenerate = true)\n    @ColumnInfo(name\
  \ = \"purchaseId\")\n    private int purchaseId;\n\n    @ColumnInfo(name = \"buyerId\"\
  )\n    private int buyerId;\n}\n```\n\n注意，外键声明还指定了当父级记录被删除或更新时执行的操作。可用选项有 `CASCADE`、`NO_ACTION`、`RESTRICT`、`SET_DEFAULT`\
  \ 和 `SET_NULL`。\n\n### 65.4 数据访问对象 (Data Access Objects)\n\n数据访问对象（DAO）允许访问存储在 SQLite\
  \ 数据库中的数据。DAO 被声明为一个标准的 Java 接口，带有额外的注解，将特定的 SQL 语句映射到存储库（repository）调用的方法。\n\n\
  第一步是创建接口并使用 `@Dao` 注解将其声明为 DAO：\n\n```java\n@Dao\npublic interface CustomerDao {\n\
  }\n```\n\n接下来，添加包含 SQL 语句和对应方法名的条。例如，下面的声明允许通过调用名为 `getAllCustomers()` 的方法来检索 `customers`\
  \ 表中的所有行：\n\n```java\n@Dao\npublic interface CustomerDao {\n    @Query(\"SELECT\
  \ * FROM customers\")\n    LiveData<Customer> getAllCustomers();\n}\n```\n\n`getAllCustomers()`\
  \ 方法为每条记录返回一个 `LiveData<Customer>`。\n\n### 65.5 Room 数据库\n\nRoom 数据库通过扩展 `RoomDatabase`\
  \ 类创建，作为 SQLite 数据库之上的一个层。该类负责创建新的数据库实例并提供对关联 DAO 实例的访问。Room 持久库提供了一个用于创建实例的构建器（builder）。每个\
  \ Android 应用程序应该只有一个 Room 实例，因此最好在类内部实现防御性代码以防止创建多个实例。以下代码概述了用于客户表的示例 Room 实现：\n\
  \n```java\nimport android.content.Context;\nimport android.arch.persistence.room.Database;\n\
  import android.arch.persistence.room.Room;\nimport android.arch.persistence.room.RoomDatabase;\n\
  \n@Database(entities = {Customer.class}, version = 1)\npublic class CustomerRoomDatabase\
  \ extends RoomDatabase {\n    public abstract CustomerDao customerDao();\n\n   \
  \ private static CustomerRoomDatabase INSTANCE;\n\n    static CustomerRoomDatabase\
  \ getDatabase(final Context context) {\n        if (INSTANCE == null) {\n      \
  \      synchronized (CustomerRoomDatabase.class) {\n                if (INSTANCE\
  \ == null) {\n                    INSTANCE = Room.databaseBuilder(\n           \
  \                 context.getApplicationContext(),\n                           \
  \ CustomerRoomDatabase.class, \"customer_database\")\n                         \
  \   .build();\n                }\n            }\n        }\n        return INSTANCE;\n\
  \    }\n}\n```\n\n\n\n\n上述示例中需要注意的重要区域包括：类声明上方用于声明数据库操作实体（entities）的注解、用于检查类实例是否已经创建的代码，以及为该实例分配名称\
  \ `customer_database`的操作。\n\n### 65.6 仓库 (Repository)\n\n仓库负责获取 `Room Database`\
  \ 实例，使用该实例访问关联的 `DAOs`，然后调用 `DAO` 方法来执行数据库操作。一个设计用于与 `Room Database` 工作的典型仓库构造函数可能如下：\n\
  \n```java\npublic class CustomerRepository {\n    private CustomerDao customerDao;\n\
  \    private CustomerRoomDatabase db;\n\n    public CustomerRepository(Application\
  \ application) {\n        db = CustomerRoomDatabase.getDatabase(application);\n\
  \        customerDao = db.customerDao();\n    }\n}\n```\n\n一旦仓库可以访问 `DAO`，它就可以调用数据访问方法。例如，下面的代码调用了\
  \ `DAO` 的 `getAllCustomers()` 方法：\n\n```java\nprivate LiveData<List<Customer>> allCustomers;\n\
  allCustomers = customerDao.getAllCustomers();\n```\n\n在调用 `DAO` 方法时，需要注意的是，除非方法返回\
  \ `LiveData` 实例（它会自动在单独线程上运行查询），否则无法在应用的主线程上执行操作。尝试这样做会导致应用崩溃，并输出以下诊断信息：\n\n`Cannot\
  \ access database on the main thread since it may potentially lock the UI for a\
  \ long period of time`\n\n由于某些数据库事务可能需要较长时间才能完成，在单独线程上运行操作可以避免应用出现假死。正如名为“#Android\
  \ Room 数据库和仓库教程”的章节中所示，这个问题可以通过使用 Java 线程轻松解决（如需更多信息或关于如何使用线程的提醒，请参阅名为“#Java 线程、Handlers\
  \ 和 Executors 概述”的章节）。\n\n### 65.7 内存数据库 (In-Memory Databases)\n\n本章概述的示例使用了 `SQLite`\
  \ 数据库，它以数据库文件的形式存在于 Android 设备的持久存储中。这确保了即使在应用进程终止后数据依然存在。\n\n`Room` 数据库持久化库也支持内存数据库。这些数据库完全留在内存中，并在应用终止时丢失。与内存数据库工作所需的唯一更改是调用\
  \ `Room Database` 类的 `Room.inMemoryDatabaseBuilder()` 方法，而不是 `Room.databaseBuilder()`。下面的代码显示了方法调用之间的区别（注意内存数据库不需要数据库名称）：\n\
  \n```java\n// 创建一个基于文件存储的数据库\nINSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                               CustomerRoomDatabase.class, \"customer_database\"\
  )\n                               .build();\n\n// 创建一个内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n\
  \                               CustomerRoomDatabase.class)\n                  \
  \             .build();\n```\n\n### 65.8 数据库检查器 (Database Inspector)\n\nAndroid\
  \ Studio 包含一个 `Database Inspector` 工具窗口，允许查看、搜索和修改与运行应用关联的 `Room` 数据库，如图图 65-3 所示：\n\
  \n![](img/as_database_inspector_window.jpg)\n\n图 65-3\n\n`Database Inspector` 将在“Android\
  \ Room 数据库和仓库教程”章节中介绍。\n\n### 65.9 总结\n\nAndroid `Room` 持久化库随 Android 架构组件一起发布，作为低级\
  \ `SQLite` 数据库之上的抽象层。该库的设计旨在使其符合 Android 架构指南的同时，更容易与数据库交互。本章介绍了在 Android 应用 项目中构建基于\
  \ Room 的数据库存储的相互作用元素，包括实体（entities）、仓库（repositories）、数据访问对象（DAOs）、注解以及 `Room Database`\
  \ 实例。\n\n在涵盖了 `SQLite` 和 `Room` 架构组件的基础知识后，下一步是创建一个将这些理论付诸的示例应用。由于示例应用的用户界面需要基于表单的布局，名为“#Android\
  \ TableLayout 和 TableRow 教程”的章节将稍微偏离核心主题，介绍 `TableLayout` 和 `TableRow` 视图的基础。\n\n\
  ## 66. Android TableLayout 和 TableRow 教程\n\n在开始编写本书的下一章（“#Android Room 数据库和仓库教程”）时，最初打算包含设计用户界面的步骤。然而，很快明显，实现用户界面的最佳方式是使用\
  \ `TableLayout` 和 `TableRow` 视图。\n\n### 66.1 TableLayout 和 TableRow 视图\n\n`TableLayout`\
  \ 容器视图允许用户界面元素以由行和列组成的表格格式在屏幕上进行组织。`TableLayout` 中的每一行由一个 `TableRow` 占据，而 `TableRow`\
  \ 又被划分为多个单元格，每个单元格包含一个子视图。\n\n表格中的列数由列数最多的一行决定，默认情况下，每列的宽度由该列中最宽的单元格定义。列可以配置为可收缩或可伸展（或两者兼有），以便它们相对于父容器的大小发生变化。此外，单个单元格可以配置为跨越多个列。\n\
  \n考虑图 66-1 所示的用户界面布局：\n\n![](img/as_tablelayout_ui.jpg)\n\n图 66-1\n\n从布局的视觉上看，很难识别用于设计界面的\
  \ `TableLayout` 结构。然而，图 66-2 所示的层级树使得结构变得更容易理解：\n\n![](img/as3.2_tablelayout_tree.jpg)\n\
  \n图 66-2\n\n该布局包含一个父 `LinearLayout` 视图以及 `TableLayout`、`LinearLayout` 和 `RecyclerView`\
  \ 子视图。`TableLayout` 包含三个 `TableRow` 子，代表表格中的三行。`TableRows` 包含两个子视图，每个代表列单元格的内容。`LinearLayout`\
  \ 子视图包含三个 `Button` 子。\n\n图 66-2 所示的布局是下一章完成的数据库示例所需的精确布局。因此，本章的剩余部分将使用 Android Studio\
  \ 布局编辑器逐步完成该用户界的设计。\n\n## 66.2 创建 Room 数据库项目\n\n从欢迎界面上选择 `New Project` 菜单选项，并在生成的新项目对话框中选择\
  \ `Empty Views Activity` 模板，然后点击 `Next` 按钮。\n\n在 Name 字段输入 `RoomDemo`，并包名为 `com.ebookfrenzy.roomdemo`。在点击\
  \ `Finish` 按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将 Language\
  \ 菜单更改为 `Java`。\n\n按照节 #11.8 将项目迁移到视图绑定 中概述的步骤将项目迁移到视图绑定。\n\n\n\n\n\n### 66.3 转换为\
  \ LinearLayout\n\n在项目（Project）工具窗口（app -> res -> layout）中找到 `activity_main.xml`\
  \ 文件并双击将其加载到布局编辑器（Layout Editor）工具中。默认情况下，Android Studio 使用 `ConstraintLayout` 作为用户界面的根布局元素。这需要将其转换为垂直方向的\
  \ `LinearLayout`。\n\n在设计（Design）模式下的布局编辑器工具中，在组件树（Component Tree）面板中找到 `ConstraintLayout`\
  \ 组件，右键点击它显示如图 66-3 所示的菜单，并选择`Convert view...`转换视图...）选项：\n\n![](img/as_convert_view_menu.jpg)\n\
  \n图 66-3\n\n在弹出的对话框（图 66-4）中，点击`Apply`应用）按钮之前，先选择转换为`LinearLayout`的选项：\n\n![](img/as_convert_view_dialog.jpg)\n\
  \n图 66-4\n\n默认情况下，布局编辑器会将 `ConstraintLayout` 转换为水平方向的 `LinearLayout`，因此要在组件树窗口中选择布局组件，参考属性（Attributes）工具窗口，并将`orientation`方向属性更改为垂直（vertical）：\n\
