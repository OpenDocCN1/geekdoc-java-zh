  \ 中。使用 Project（项目）窗口，导航到 `FragmentExample` 项目的 `app` -> `res` -> `layout` 部分，并双击\
  \ `activity_main.xml` 文件将其加载到 Android Studio 布局编辑器（Layout Editor）工具中。\n\n在 Design（设计）模式下的布局编辑器工具中，选择并删除布局中的默认\
