  \ value”提示。此外，验证在设备旋转时用户界面显示的信息是否得以保留。\n\n### 36.11 总结\n\n本章的主要目标是完成设置项目使用数据绑定的步骤，并演示单向、双向和监听器绑定表达式的使用。本章还提供了一个实用的示例，说明了在结合\
  \ `LiveData` 连接用户界面视图与应用的后端数据和逻辑时，可以节省多少代码编写。\n\n37\\. 一个 Android ViewModel 保存状态教程\n\
  \n\n\n\n\n应用状态的保存与恢复是为了让用户在应用进入后台后，在外观和行为上能够获得连续性。用户期望能够在不同应用之间进行切换，并在返回原始应用时，发现它正处于切换前的完全相同的状态。\n\
  \n正如“理解 Android 应用和 Activity 周期”章节中概述的那样，当用户将应用置于后台时，如果资源受限，该应用将符合操作系统终止的条件。当用户尝试将已终止的应用返回到前台时，Android\
  \ 会在一个新的进程中重新启动该应用。由于这一切对用户来说是不可见的，因此应用有责任将自己恢复到最初置于后台时处于相同状态，而不是以其“初始启动”状态呈现。对于基于\
  \ `ViewModel` 的应用，这种行为的很大一部分可以通过使用 `ViewModel Saved State` 模块来实现。\n\n## 37.1 理解\
  \ ViewModel 状态保存\n\n如前面的章节所述，`ViewModel` 为应用开发带来了许多益处，包括在设备旋转等配置更改时恢复 UI 状态。要查看其操作效果，请运行\
  \ `ViewModelDemo` 应用（或者，如果你仍需要创建项目，请从随书下载的示例代码中加载 Android Studio 的 `ViewModelDemo_LiveData`\
  \ 项目）。\n\n运行后，输入一个美元数值并转换为欧元。在同时显示美元和欧元值的情况下，旋转设备或模拟器，并注意在应用响应方向变化后，这两个值仍然可见。\n\n\
  遗憾的是，这种行为并不延伸到后台应用进程的终止上。在应用仍在运行的情况下，点击设备主页按钮将 `ViewModelDemo` 应用置于后台，然后通过打开终端工具窗口并运行以下命令来终止它（其中\
  \ `<package name>` 是您创建项目时使用的名称，例如 `com.ebookfrenzy.viewmodeldemo`）：\n\n```bash\n\
  adb shell am kill <package name>\n```\n\n如果未找到 `adb` 命令，请参考“设置 Android Studio 开发环境”章节以获取设置\
  \ Android Studio 环境的步骤。\n\n一旦应用被终止，返回设备或模拟器并从启动器中选择该应用（不要在 Android Studio 内部重新运行应用）。一旦应用出现，它的表现就像刚刚启动一样，最后的美元值和欧元值丢失了。然而，从用户的角度来看，应用是从后台恢复的，本应该仍包含原始数据。在这种情况下，应用未能提供用户对\
  \ Android 应用所期望的连续性。\n\n## 37.2 实现 ViewModel 状态保存\n\n基础的 `ViewModel` 状态保存通过引入 `ViewModel\
