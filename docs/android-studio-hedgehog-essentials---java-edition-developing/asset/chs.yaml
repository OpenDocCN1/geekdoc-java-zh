  \                    WebView view, WebResourceRequest request) {\n             \
  \   return super.shouldOverrideUrlLoading(\n                        view, request);\n\
  \            }\n        });\n        myWebView.loadUrl(\"https://www.payloadbooks.com\"\
  );\n    }\n.\n}\n```\n\n## 76.9 添加打印菜单\n\n现在将使用“在 Android 上创建和管理菜单”章节中概述的技术将打印网页的选项添加到溢出菜单中。第一个要求是用于标记菜单的字符串资源。在项目（Project）工具窗口中，找到\
  \ `app -> res -> strings.xml`，双击它将其加载到编辑器，并修改它以添加字符串资源：\n\n```xml\n<resources>\n\
  \    <string name=\"app_name\">WebPrint</string>\n    <string name=\"action_settings\"\
  >Settings</string>\n    <string name=\"print_string\">Print</string>\n.\n</resources>\n\
  ```\n\n接下来，将 `app -> res -> menu -> menu_main.xml` 加载到菜单编辑器，切换到代码（Code）模式，并将 `Settings`\
  \ 菜单替换为 `print` 选项：\n\n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    tools:context=\"com.ebookfrenzy.webprint.MainActivity\"\
  \ >\n    <item\n        android:id=\"@+id/action_settings\"\n        android:title=\"\
  @string/action_settings\"\n        android:priority=\"100\"\n        app:showAsAction=\"\
  never\" />\n    <item\n        android:id=\"@+id/print_option\"\n        android:title=\"\
  @string/print_string\"\n        android:priority=\"100\"\n        app:showAsAction=\"\
  never\" />\n</menu>\n```\n*(注：原文提供的文本在 76.9 处有截断，我已根据常见结构翻译了可见部分。)*\n\n\n\n\n简单来说，自定义文档打印使用画布（canvas）来表示要打印的文档页面。应用程序将待打印的内容以形状、颜色、文本和图像的形式绘制在这些画布上。画布由\
  \ Android `Canvas` 类的实例表示，提供了丰富的绘图选项。一旦所有页面绘制完成，文档就会被打印。\n\n虽然这听起来很简单，但为了实现这一过程需要执行一些步骤，这些步骤可以总结如下：\n\
  \n*   实现一个子自 `PrintDocumentAdapter` 类的自定义打印适配器。\n*   获取`Print Manager Service`（打印服务）的引用。\n\
  *   创建一个 `PdfDocument`类的实例来存储文档页面。\n*   以`PdfDocument.Page`实例的形式将页面添加到 `PdfDocument`\
  \ 中。\n*   获取与文档页面相关的 `Canvas` 对象的引用。\n*   在画布上绘制内容。\n*   将 PDF 文档写入打印框架提供的目标输出流。\n\
  *   通知打印框架文档已准备好打印。\n\n本章将提供这些步骤的概述，随后将提供一个详细的教程，旨在演示如何在 Android 应用程序中实现自定义文档打印。\n\
  \n### 77.1.1 自定义打印适配器\n\n打印适配器的作用是为打印框架提供待打印的内容，并确保其根据用户的偏好进行正确格式化（考虑纸张大小和页面方向等因素）。\n\
  \n这大部分工作是由 Android 打印框架提供的打印适配器完成的，这些适配器专为打印 HTML 和图像等这些特定的打印任务设计。例如，在打印网页时，当调用\
  \ `WebView` 类实例的 `createPrintDocumentAdapter()` 方法时，系统会为我们创建一个打印适配器。\n\n然而，在自定义文档打印的情况下，由应用程序开发人员设计打印适配器并实现绘制和格式化内容的代码以准备打印工作。\n\
  \n自定义打印适配器通过子类 `PrintDocumentAdapter` 类并重写该类中的一组回调方法来创建，这些方法会在打印过程的各个阶段由打印框架调用。这些回调方法可以总结如下：\n\
  \n*   `onStart()` – 该方法在打印过程开始时被调用，提供它的目的是让应用程序代码执行任何必要的任务以创建打印作业。在 `PrintDocumentAdapter`\
  \ 子类中实现此方法是可选的。\n*   `onLayout()` – 该回调方法在调用 `onStart()` 方法后被调用，并且每当用户更改打印设置（如更改方向、纸张大小或颜色设置）时都会再次调用。此方法应调整内容和布局以适应这些更改。一旦完成这些更改，该方法必须返回要打印的页面数。在\
  \ `PrintDocumentAdapter` 子类中实现 `onLayout()` 方法是强制的。\n*   `onWrite()` – 该方法在每次调用\
  \ `onLayout()` 后被调用，负责在待打印页面的画布上渲染内容。在其他参数中，此方法还接收一个文件描述符，渲染完成后必须将生成的 PDF 文档写入该描述符。随后，将调用\
  \ `onWriteFinished()` 回调方法，并传递一个包含待打印页面范围信息的参数。在 `PrintDocumentAdapter` 子类中实现 `onWrite()`\
  \ 方法是强制的。\n*   `onFinish()` – 一个可选方法，如果实现，它将在打印过程完成时由打印框架调用一次，从而为应用程序提供执行任何必要的清理操作的机会。\n\
  \n### 77.2 准备自定义文档打印项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在出现的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Empty Views Activity`（空视图 Activity）模板。\n\n在 `Name` 字段中输入 `CustomPrint`，并指定包名为\
  \ `com.ebookfrenzy.customprint`。在点击 `Finish`（完成）按钮之前，将 Minimum API level 设置更改为 `API\
  \ 26`: Android 8.0 (Oreo)，并将语言菜单设置为 Java。\n\n将 `activity_main.xml` 布局文件加载到 Layout\
  \ Editor 工具中，并在 Design（设计）模式下，选择并删除“Hello World!” `TextView` 对象。从调色板的 Common（常用）部分拖入一个\
  \ `Button` 视图，并将其放置在布局视图的中心。选中 `Button` 视图后，将 text 属性改为“Print Document”，并将字符串提取到新资源中。完成后，用户界面布局应与图\
  \ 77-1 所示所示。\n\n当在应用程序中选择按钮时，需要调用一个方法来启动文档打印过程。留在 Attributes（属性）工具窗口中，将 `onClick`\
  \ 属性设置为调用名为 `printDocument` 的方法。\n\n![](img/as_custom_print_ui.jpg)\n\n图 77-1\n\n\
  ### 77.3 创建自定义打印适配器\n\n在 Android 应用程序内部打印自定义文档涉及的大部分工作涉及自定义打印适配器的实现。此示例需要一个实现了 `onLayout()`\
  \ 和 `onWrite()` 回调方法的打印适配器。在 `MainActivity.java` 文件中，添加此新类的模板，使其内容如下：\n\n```java\n\
  package com.ebookfrenzy.customprint;\n\n.\n\n.\n\nimport android.os.CancellationSignal;\n\
  import android.os.ParcelFileDescriptor;\nimport android.print.PageRange;\nimport\
  \ android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\nimport\
  \ android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    public static class MyPrintDocumentAdapter extends PrintDocumentAdapter\n\
  \    {\n        Context context;\n        MyPrintDocumentAdapter(Context context)\n\
  \        {\n            context = context;\n        }\n        @Override\n     \
  \   public void onLayout(PrintAttributes oldAttributes,\n            PrintAttributes\
  \ newAttributes,\n            CancellationSignal cancellationSignal,\n         \
  \   LayoutResult callback,\n            Bundle metadata) {\n        }\n        @Override\n\
  \        public void onWrite(PageRange[] pageRanges,\n            ParcelFileDescriptor\
  \ destination,\n            CancellationSignal cancellationSignal,\n           \
  \ WriteResultCallback callback) {\n        }\n    }\n}\n```\n\n按照该类目前的状态，它包含一个在创建新类实例时被调用的构造方法。该构造函数接受调用\
  \ activity 的 context 作为参数，然后将其存储，以便在随后的两个回调方法中引用它。\n\n建立好类大纲后，下一步是实现两个回调方法，从 `onLayout()`\
  \ 开始。\n\n### 77.4 实现 onLayout() 回调方法\n\n留在 `MainActivity.java` 文件中，开始添加 `onLayout()`\
  \ 方法中的代码所需的某些导入指令：\n\n```java\npackage com.ebookfrenzy.customprint;\n\n.\n\n.\n\n\
  import android.print.PrintDocumentInfo;\nimport android.print.pdf.PrintedPdfDocument;\n\
  import android.graphics.pdf.PdfDocument;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n.\n\n.\n}\n```\n\n接下来，修改 `MyPrintDocumentAdapter` 类以声明在 `onLayout()` 方法中使用的变量：\n\
  \n```java\npublic static class MyPrintDocumentAdapter extends PrintDocumentAdapter\n\
  {\n    Context context;\n    int pageHeight;\n    int pageWidth;\n    PdfDocument\
  \ myPdfDocument;\n    int totalpages = 4;\n\n.\n\n.\n}\n```\n\n\n\n\n\n注意，在本示例中，将打印一个四页的文档。在更复杂的情况下，应用程序可能需要根据内容的数量以及布局，相对于用户选择的纸张尺寸和页面方向动态动态计算需要打印的页数。\n\
  \n在声明变量后，请按照以下代码列表实现 `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes\
  \ oldAttributes,\n                    PrintAttributes newAttributes,\n         \
  \           CancellationSignal cancellationSignal,\n                    LayoutResultCallback\
  \ callback,\n                    Bundle metadata) {\n    myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n    pageHeight =\n            Objects.requireNonNull(\n     \
  \           newAttributes.getMediaSize()).getHeightMils()/1000 * 72;\n    pageWidth\
  \ =\n            newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n    if\
  \ (cancellationSignal.isCanceled() ) {\n        callback.onLayoutCancelled();\n\
  \        return;\n    }\n    if (totalpages > 0) {\n        PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo\n            .Builder(\"print_output.pdf\").setContentType(\n\
  \                PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n            .setPageCount(totalpages);\n\
  \        PrintDocumentInfo info = builder.build();\n        callback.onLayoutFinished(info,\
  \ true);\n    } else {\n        callback.onLayoutFailed(\"Page count is zero.\"\
  );\n    }\n}\n```\n\n该方法执行了相当多的任务，每个任务都需要详细的解释。\n\n首先，创建一个 `PdfDocument` 类的实例，作为新的\
  \ PDF 文档。当打印框架调用 `onLayout()` 方法时，传入的参数之一是 `PrintAttributes` 类型的对象，它包含了用户为打印输出选择的纸张尺寸、分辨率和颜色设置的详细信息。在创建\
  \ PDF 文档时，会使用这些设置以及构造方法之前为存储的活动上下文（context）：\n\n```java\nmyPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n```\n\n然后，该方法使用 `PrintAttributes` 对象提取文档页的高度和宽度值。这些维度以英寸千分之一为单位存储在对象中。由于本示例稍后使用这些值的方法是以\
  \ 1/72 英寸为单位运行的，因此这些数字在存储之前会被转换：\n\n```java\npageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;\npageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n```\n\
  \n虽然此示例没有使用用户的颜色选择，但可以通过调用 `PrintAttributes` 对象的 `getColorMode()` 方法获取此属性，该方法将返回\
  \ `COLOR_MODE_COLOR` 或 `COLOR_MODE_MONOCHROME` 之一的值。\n\n当调用 `onLayout()` 方法时，会传入一个\
  \ `LayoutResultCallback` 类型的对象。该对象提供了一种通过一组方法向打印框架反馈状态信息的方法。例如，如果用户取消打印，将调用 `onLayout()`\
  \ 方法。进程已取消的事实通过 `CancellationSignal` 参数中的设置来指示。如果检测到取消，`onLayout()` 方法必须调用 `LayoutResultCallback`\
  \ 对象的 `onLayoutCancelled()` 方法，以通知打印框架已收到取消请求且布局任务已取消：\n\n```java\nif (cancellationSignal.isCanceled()\
  \ ) {\n    callback.onLayoutCancelled();\n    return;\n}\n```\n\n当布局工作完成后，该方法要求调用\
  \ `LayoutResultCallback` 对象的 `onLayoutFinished()` 方法，并传入两个参数。第一个参数是 `PrintDocumentInfo`\
  \ 对象，包含有关打印文档的信息。这些信息由 PDF 文档的名称、内容类型（在此情况下是文档而非图像）以及页数组成。第二个参数是一个 `Boolean` 值，表示自上一次调用\
  \ `onLayout()` 方法以来布局是否发生了变化：\n\n```java\nif (totalPages > 0) {\n    PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo\n        .Builder(\"print_output.pdf\")\n    \
  \    .setContentType(\n            PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n  \
  \      .setPageCount(totalPages);\n    PrintDocumentInfo info = builder.build();\n\
  \    callback.onLayoutFinished(info, true);\n} else {\n    callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n如果页数为零，代码将通过调用 `LayoutResultCallback` 对象的 `onLayoutFailed()`\
  \ 方法向打印框架报告此失败。调用 `onLayoutFinished()` 方法通知打印框架布局工作已完成，从而触发对 `onWrite()` 方法的调用。\n\
  \n### 7.5 实现 `onWrite()` 回调方法\n\n`onWrite()` 回调方法负责渲染文档的页面，然后通知打印框架文档已准备好打印。完成后，`onWrite()`\
  \ 方法实现如下：\n\n```java\npackage com.ebookrenzy.customprint;\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\nimport android.graphics.pdf.PdfDocument.PageInfo;\n\
  \n@Override\npublic void onWrite(final PageRange[] pageRanges,\n               \
  \     finalFileDescriptor destination,\n                    final CancellationSignal\
  \ cancellationSignal,\n                    final WriteResultCallback callback) {\n\
  \    for (int i = 0; i < totalpages; i++) {\n        if (pageInRange(pageRanges,\
  \ i)) {\n            PageInfo newPage = new PageInfo.Builder(pageWidth,\n      \
  \          pageHeight, i).create();\n            PdfDocument.Page page = myPdfDocument.startPage(newPage);\n\
  \            if (cancellationSignal.isCanceled()) {\n                callback.onWriteCancelled();\n\
  \                myPdfDocument.close();\n                myPdfDocument = null;\n\
  \                return;\n            }\n            drawPage(page, i);\n      \
  \      myPdfDocument.finishPage(page);\n        }\n    }\n    try {\n        myPdfDocument.write(new\
  \ FileOutputStream(destination.getFileDescriptor()));\n    } catch (IOException\
  \ e) {\n        callback.onWriteFailed(e.toString());\n        return;\n    } finally\
  \ {\n        myPdfDocument.close();\n        myPdfDocument = null;\n    }\n    callback.onWriteFinished(pageRanges);\n\
  }\n```\n\n\n\n对于位于任何指定范围内的每一页，都会创建一个新的 `PdfDocument.Page` 对象。在创建新页面时，之前由 `onLayout()`\
  \ 方法存储的高度和宽度值将作为参数传递，以便使页面大小与用户选择的打印选项匹配：\n\n```\nPageInfo newPage = new PageInfo.Builder(pageWidth,\
  \ pageHeight, i).create();\nPdfDocument.Page page = myPdfDocument.startPage(newPage);\n\
  ```\n\n与 `onLayout()` 方法一样，`onWrite()` 方法也需要响应取消请求。在这种情况下，代码在关闭并取消引用 `myPdfDocument`\
  \ 变量之前，会通知打印框架取消已执行：\n\n```\nif (cancellationSignal.isCanceled()) {\n    callback.onWriteCancelled();\n\
  \    myPdfDocument.close();\n    myPdfDocument = null;\n    return;\n}\n```\n\n\
  只要打印过程没有被取消，该方法在调用 `myPdfDocument` 对象的 `finishedPage()` 方法之前，会调用一个方法在当前页面上绘制内容：\n\
  \n```java\ndrawPage(page, i);\nmyPdfDocument.finishPage(page);\n```\n\n`drawPage()`\
  \ 方法负责将内容绘制到页面上，并将在 `onWrite()` 方法完成后完成实现。\n\n当所需的页面数已添加到 PDF 文档后，文档将使用文件描述符写入目标流，该描述符是作为参数传递给\
  \ `onWrite()` 方法的。如果由于任何原因写入操作失败，方法将通过调用 `WriteResultCallback` 对象的 `onWriteFailed()`\
  \ 方法通知框架（该对象也作为参数传递给 `onWrite()` 方法）。\n\n```java\ntry {\n    myPdfDocument.writeTo(new\
  \ FileOutputStream(\n            destination.getFileDescriptor()));\n} catch (IOException\
  \ e) {\n    callback.onWriteFailed(e.toString());\n    return;\n} finally {\n  \
  \  myPdfDocument.close();\n    myPdfDocument = null;\n}\n```\n\n最后，将调用 `WriteResultsCallback`\
  \ 对象的 `onWriteFinish()` 方法，通知打印框架文档已准备好打印。\n\n## 77.6 检查页面是否在范围内\n\n如前所述，当调用 `onWrite()`\
  \ 方法时，会传递它一个 `PageRange` 对象数组，指示文档中要打印的页面范围。`PageRange` 类用于存储页面范围的起始和结束页，反之，可以通过该类的\
  \ `getStart()` 和 `getEnd()` 方法访问。\n\n在上一节中实现 `onWrite()` 方法时，调用了一个名为 `pageInRange()`\
  \ 的方法，该方法接受一个 `PageRange` 对象数组和一个页码作为参数。`pageInRange()` 方法的作用是识别指定的页码是否在指定的范围内，它并可以在\
  \ `MainActivity.java` 类的 `MyPrintDocumentAdapter` 类中如下实现：\n\n```java\npublic class\
  \ MyPrintDocumentAdapter extends PrintDocumentAdapter {\n    // ...\n    private\
  \ boolean pageInRange(PageRange[] pageRanges, int page) {\n        for (PageRange\
  \ pageRange : pageRanges) {\n            if ((page >= pageRange.getStart()) &&\n\
  \                (page <= pageRange.getEnd()))\n                return true;\n \
  \       }\n        return false;\n    }\n    // ...\n}\n```\n\n## 77.7 在页面画布上绘制内容\n\
  \n我们现在已经到了需要编写代码在页面上绘制内容的阶段，以便它们准备好进行打印。所绘制的内容完全取决于应用程序，仅限于使用 Android `Canvas` 类可以实现的功能。然而，在本示例中，将在画布上绘制一些简单的文本和图形。\n\
  \n`onWrite()` 方法被设计为调用名为 `drawPage()` 的方法，该方法接受代表当前页面的 `PdfDocument.Page` 对象和一个代表页码的整数作为参数。在\
  \ `MainActivity.java` 文件中，该方法应该如下实现：\n\n```java\npackage com.ebookrenzy.customprint;\n\
  \nimport android.graphics.Canvas;\nimport android.graphics.Color;\nimport android.graphics.Paint;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    public class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter {\n        private void drawPage(PdfDocument.Page\
  \ page, int pagenumber) {\n            Canvas canvas = page.getCanvas();\n     \
  \       pagenumber++; // 让页码从 1 开始\n            int titleBaseLine = 2;\n       \
  \     int leftMargin = 5;\n            Paint paint = new Paint();\n            paint.setColor(Color.BLACK);\n\
  \            paint.setTextSize(40);\n            canvas.drawText(\"Test Document\
  \ Page \" + pagenumber, leftMargin, titleBaseLine, paint);\n            paint.setTextSize(14);\n\
  \            canvas.drawText(\"This is some test content to verify that custom document\
  \ printing works\", leftMargin, titleBaseLine + 35, paint);\n            if (pagenumber\
  \ % 2 == 0)\n                paint.setColor(Color.RED);\n            else\n    \
  \            paint.setColor(Color.GREEN);\n            PageInfo pageInfo = page.getInfo();\n\
  \            canvas.drawCircle(pageInfo.getPageWidth()/2, pageInfo.getPageHeight()/2,\
  \ 150, paint);\n        }\n    }\n}\n```\n\n代码中的页码从 0 开始。由于文档从第 1 页开始，该方法首先增加页码。然后获取与页面相关的\
  \ `Canvas` 对象的引用，并声明了一些边距值：\n\n```java\nCanvas canvas = page.getCanvas();\npagenumber++;\n\
  int titleBaseLine = 72;\nint leftMargin = 54;\n```\n\n接下来，代码创建 `Paint` 和 `Color`\
  \ 对象用于绘制，设置字体大小并绘制包含当前页码的标题：\n\n```java\nPaint paint = new Paint();\npaint.setColor(Color.BLACK);\n\
  paint.setTextSize(40);\ncanvas.drawText(\"Test Document Page \" + pagenumber, leftMargin,\
  \ titleBaseLine, paint);\n```\n\n然后缩小字体大小，并在标题下方绘制一些正文：\n\n```java\npaint.setTextSize(14);\n\
  canvas.drawText(\"This is some test content to verify that custom document printing\
  \ works\", leftMargin, titleBaseLine + 35, paint);\n```\n\n该方法的最后一个任务是绘制一个圆（偶数页红色，奇数页绿色）。在确定页面奇偶性后，该方法获取页面的高度和宽度，然后使用这些信息将圆置于页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2,\
  \ pageInfo.getPageHeight()/2, 150, paint);\n```\n\n绘制完成后，方法将控制权返回给 `onWrite()` 方法。完成\
  \ `drawPage()` 方法后，`MyPrintDocumentAdapter` 类现在已经完成。\n\n## 77.8 启动打印作业\n\n当用户触摸“打印文档”按钮时，将调用\
  \ `printDocument()` onClick 事件处理方法。因此，在开始测试之前，剩余的工作是将此方法添加到 `MainActivity.java`\
  \ 文件中，特别注意确保将其放置在 `MyPrintDocumentAdapter` 类之外：\n\n```java\nimport android.print.PrintManager;\n\
  ```\n\n\n\n\n```java\nimport android.view.View;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n    public void printDocument(View view) {\n        PrintManager\
  \ printManager = (PrintManager) this\n                .getSystemService(Context.PRINT_SERVICE);\n\
  \        String jobName = this.getString(R.string.app_name) +\n                \
  \        \" Document\";\n        printManager.print(jobName, new\n             \
  \   MyPrintDocumentAdapter(this),\n                null);\n    }\n}\n```\n\n该方法在创建一个新的\
  \ `String` 对象作为打印任务的名称之前，获取设备上运行的 `Print Manager`（打印管理器）服务的引用。最后，调用 `Print Manager`\
  \ 的 `print()` 方法来启动打印任务，并传递 `jobName` 和我们自定义打印文档适配器类的实例。\n\n### 77.9 测试应用程序\n\n\
  在 Android 设备或模拟器上编译并运行应用程序。当应用程序加载后，点击“打印文档（Print Document）”按钮启动打印任务，并为输出选择合适的目标（“保存为\
  \ PDF”选项有助于避免浪费纸和打印机墨水）。\n\n检查打印输出结果，它应该包含 4 个页面，包括文本和图形。例如，图 77-3 显示了作为 `PDF` 文件准备好在设备上保存的文档四页。\n\
  \n尝试其他的打印配置选项，例如在打印面板中更改纸张大小、方向和页面设置。打印输出应反映每个设置的变化，这表明自定义打印文档适配器运行正常。\n\n![](img/as_4.1_custom_print_running.jpg)\n\
  \n图 77-3\n\n## 77.10 总结\n\n尽管实现比 Android 打印框架的 HTML 和图像打印选项复杂，但自定义文档打印为在 Android\
  \ 应用中打印复杂内容提供了极大的灵活性。实现自定义文档打印的大部分工作涉及创建一个自定义 `Print Adapter`（打印适配器）类，该类不仅在文档页面上绘制内容，而且在用户更改打印设置（如页面大小和打印范围）时做出正确响应。\n\
  \n## 78. Android App Links 简介\n\n随着技术的演进，Web 内容与移动内容之间的传统区别开始模糊。这一点特别突出的一个领域是渐进式\
  \ Web 应用（PWA）的日益流行，这些 Web 应用的外观和行为与传统的移动应用非常相似。\n\n另一个趋势是可以通过 Web 搜索和 URL 链接发现移动应用中的内容。在\
  \ Android 应用开发语境下，`App Links` 功能旨在让用户更轻松地发现和访问存储在 Android 应用中的内容，即使用户没有安装该应用也是如此。\n\
  \n### 78.1 Android App Links 概述\n\nApp link（应用链接）是一个标准的 `HTTP URL`，是从外部源（如网站或应用）直接链接到应用中特定位置的简单方法。App\
  \ links（也称为深度链接 deep links）主要用于鼓励用户与应用交互并允许用户分享应用内容。\n\nApp link 的实现是一个多步骤过程，涉及向项目清单（manifest）中添加\
  \ `intent filters`（意图过滤器）、在关联的应用 Activity 中实现链接处理代码，以及使用数字资产链接文件（digital asset links\
  \ files）将应用与基于 Web 的内容关联起来。\n\n这些步骤可以通过修改项目来手动完成，也可以使用 Android Studio App Links\
  \ 助手自动完成。\n\n本章的剩余部分将从项目必须进行的更改来概述 app links 的实现。下一章（“Android Studio App Links 教程”）将演示如何使用\
  \ App Links 助手来实现相同的结果。\n\n### 78.2 App Link Intent 过滤器\n\nApp link URL 需要映射到应用项目中的特定\
  \ Activity。这是通过向项目的 `AndroidManifest.xml` 文件中添加 `intent filters` 实现的，这些过滤器旨在响应 `android.intent.action.VIEW`\
  \ 动作以启动 Activity。意图过滤器声明在要启动的 Activity 元素内，并且必须包含概述 app link URL 方案（scheme）、主机（host）和路径（path）的数据。例如，下面的清单片段声明了一个意图过滤器，当检测到匹配\
  \ `http://www.example.com/welcome` 的 app link 时启动名为 `MyActivity` 的 Activity：\n\n\
  ```xml\n<activity android:name=\"com.ebookfrenzy.myapp.MyActivity\">\n    <intent-filter\
  \ android:autoVerify=\"true\">\n        <action android:name=\"android.intent.action.VIEW\"\
  \ />\n        <category android:name=\"android.intent.category.DEFAULT\" />\n  \
  \      <category android:name=\"android.intent.category.BROWSABLE\" />\n       \
  \ <data android:scheme=\"http\" android:host=\"www.example.com\" android:pathPrefix=\"\
  /welcome\" />\n    </intent-filter>\n</activity>\n```\n\n处理歧义意图过滤器的顺序可以使用意图过滤器的\
  \ `order` 属性指定，如下所示：\n\n```xml\n<application>\n<activity android:name=\"com.ebookfrenzy.myapp.MyActivity\"\
  >\n    <intent-filter android:autoVerify=\"true\" order=\"1\">\n```\n\n意图过滤器会导致\
  \ app link 启动 Activity，但仍必须在目标端添加代码来处理该意图（intent）。\n\n### 78.3 处理 App Link 意图\n\n\
  在大多数情况下，启动的 Activity 需要获取 app link 的权限，并根据 URL 的结构采取特定行动。接上上面的示例，当通过包含 `/welcome/newuser`\
  \ 路径的 URL 启动时，Activity 显示的内容可能与路径设置为 `/welcome/existinguser` 时不同。\n\n当链接启动 Activity\
  \ 时，它会接收一个包含启动动作数据的 `intent` 对象，其中包含 app link 的 `Uri` 对象。在 Activity 的初始化阶段，可以添加以下代码提取这些数据：\n\
  \n```java\nIntent appLinkIntent = getIntent();\nString appLinkAction = appLinkIntent.getAction();\n\
  Uri appLinkData = appLinkIntent.getData();\n```\n\n获取 app link 的 `Uri` 后，可以使用构成\
  \ URL 的各个部分来决定执行的操作。在下面的示例中，URL 的最后一个部分被用于识别为新用户还是现有用户显示内容：\n\n```java\nString userType\
  \ = appLinkData.getLastPathSegment();\nif (userType.equals(\"newuser\")) {\n   \
  \ // 显示新用户内容\n} else {\n    // 显示现有用户内容\n}\n```\n\n### 78.4 将应用关联网站\n\n在 app link\
  \ 起作用之前，必须将 app link URL 与其所在的网站关联。这是通过创建一个名为 `assetlinks.json` 的数字资产链接文件并将其安装在网站的\
  \ `.well-known` 中实现的。注意，数字资产链接适用于基于 `HTTPS` 的网站。\n\n数字资产链接文件包含一个 `relation` 声明（授予目标应用使用网站链接\
  \ URL 的权限）以及一个 `target` 声明（声明关联应用的包名和 SHA-256 证书指纹）。一个典型的资源链接文件可能如下：\n\n```json\n\
  [{\n  \"relation\": [\"delegate_permission/common.handle_all_urls\"],\n  \"target\"\
  \ : {\n    \"namespace\": \"android_app\",\n    \"package_name\": \"<app package\
  \ name here>\",\n    \"sha256_cert_fingerprints\": [\"<app certificate here>\"]\n\
  \  }\n}]\n```\n\n`assetlinks.json` 文件可以包含多个数字资产链接，允许单个网站与多个关联应用关联起来。\n\n### 78.5\
  \ 总结\n\n\n\n\nAndroid App Links 允许通过来自外部网站和其他应用程序的 URL 链接启动应用活动。App links 是通过项目清单文件中的意图过滤器（intent\
  \ filters）以及启动活动中的意图处理代码来实现的。通过数字资产链接（Digital Asset Links）文件，还可以将 app link 中使用的域名与相应的网站关联。一旦建立关联，当使用\
  \ app link 时，Android 将不再需要询问用户选择目标应用。\n\n## 79. Android Studio App Links 教程\n\n\
  本章将提供 Android app links 和 Android Studio App Link 助手（App Link Assistant）的实际演示。本章将为现有的\
  \ Android 应用添加应用链接支持，允许通过 app link URL 启动活动。除了启动活动外，显示的内容将在 URL 的路径中指定。\n\n### 79.1\
  \ 关于示例应用\n\n本章使用的项目名为 `AppLinking`，这是一个允许用户查找伦敦地标信息的基础应用。该应用使用通过标准 Android 内容提供者类（content\
  \ provider class）访问的 `SQLite` 数据库。应用有一个现有的数据库，包含伦敦一些热门旅游景点的记录。除了现有的数据库条目外，应用还允许用户添加和删除地标描述。\n\
  \n目前，该应用允许对现有记录进行搜索，并添加和删除新记录。\n\n项目由两个名为 `AppLinkingActivity` 和 `LandmarkActivity`\
  \ 的活动组成。`AppLinkingActivity` 是应用启动时启动的主活动。该活动允许用户输入搜索标准并向数据库添加记录。当搜索找到匹配的记录时，`LandmarkActivity`\
  \ 会启动并显示相关地标的信息。本章将增强该应用以支持应用链接，以便可以使用 URL 在应用内显示特定的地标记录。\n\n### 79.2 数据库架构\n\n\
  示例应用的数据包含在项目层次结构中 `app -> assets -> databases` 文件夹下的名为 `landmarks.db` 的文件中。数据库包含一个名为\
  \ `locations` 的表，其结构如表 79-1 所示：\n\n| 列 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| `_id`\
  \ | String | 主索引，此列包含唯一标识数据库中地标的字符串值。 |\n| `title` | String | 地标的名称（例如，伦敦桥）。 |\n\
  | `description` | String | 地标的描述。 |\n| `personal` | Boolean | 表示记录是私人的还是公共的。对于用户添加的所有记录，此值被设置为\
  \ true。数据库提供的现有记录被设置为 false。 |\n\n表 79-1\n\n### 79.3 加载并运行项目\n\n项目包含位于以下 URL 的示例源码下载压缩包的\
  \ `AppLinking` 文件夹中：\n\n[`www.payloadbooks.com/product/hedgehogjava`](https://www.payloadbooks.com/product/hedgehogjava)\n\
  \n找到文件夹后，在 Android Studio 中打开它，并在设备或模拟器上运行应用。一旦应用启动，将出现下方图 79-1 所示的屏幕：\n\n![](img/as_applinking_ui_home.jpg)\n\
  图 79-1\n\n按照目前的实现方式，地标是使用位置 ID 定位的。默认数据库配置当前包含两个由 ID “londonbridge”和“toweroflondon”引用的记录。通过在\
  \ ID 字段中输入 ``londonbridge` 并点击 Find（查找）按钮来测试搜索功能。当找到匹配的记录时，第二个活动（`LandmarkActivity`）会被启动，并传递有关要显示的记录的信息。这些信息以添加到\
  \ `Intent` 对象的额外数据的形式存在。`LandmarkActivity` 使用这些信息从数据库中提取记录，并使用图 79-2 所示的屏幕显示给用户：\n\
  \n![](img/as_applinking_ui_london_bridge.jpg)\n图 79-2\n\n## 79.4 添加 URL 映射\n\n现在应用已经加载到\
  \ Android Studio 并经过了测试，我们可以添加应用链接支持。目标是让 `LandmarkActivity` 屏幕响应 app link 的点击并启动并显示信息。这是通过将\
  \ URL 映射到 `LandmarkActivity` 实现的对于此示例，URL 的格式如下：\n\n`http://<website domain>/landmarks/<landmarkId>`\n\
  \n在完成所有步骤后，例如以下 URL 将导致应用显示有关伦敦塔的信息：\n\n`http://www.yourdomain.com/landmarks/toweroflondon`\n\
  \n要向项目添加 URL 映射，首先通过 `Tools -> App Links Assistant` 菜单选项打开 App Links 助手。打开后，助手将如图\
  \ 79-3 所示：\n\n![](img/as_app_links_assistant_main.jpg)\n图 79-3\n\n接下来，点击 `Create\
  \ Applink` 按钮显示下方所示面板：\n\n![](img/as_app_links_assistant.jpg)\n图 79-4\n\n点击 `Open\
  \ URL Mapping Editor` 按钮将 URL 映射到活动。在映射屏幕中，点击 `+` 按钮（如图 79-5 所示高亮）添加新的 URL：\n\n\
  ![](img/as_app_links_assistant_mappings.jpg)\n图 79-5\n\n在 `Add URL Mapping` 对话框的\
  \ `Host` 字段中，输入你自己的网站的 URL。如果你没有可用于此教程的网站，仍然可以遵循大部分内容。\n\n`Path` 字段（在下方图 79-6 中标记为\
  \ B）是声明 URL 路径组件的地方。路径必须以 `/` 开，因此在此字段中输入 `/landmarks`。`Path` 菜单提供了以下路径匹配选项：\n\n\
  - `path`：必须精确匹配 URL 的路径部分以启动活动。例如，如果路径设置为 `/landmarks`，则 `http://www.example.com/landmarks`\
  \ 被视为匹配。然而，`http://www.example.com/landmarks/londonbridge` 将不被视为匹配。\n计算 `pathPrefix`：指定的路径仅被视为前缀。在\
  \ `/landmarks` 之后可以包含额外的路径组件（例如，`http://www.example.com/landmarks/londonbridge`\
  \ 将视为匹配）。\n- `pathPattern`：允许使用基本正则表达式和通配符形式的模式指定路径，例如 `landmarks/*[l-L]ondon/*`。\n\
  \n由于示例中的路径是地标 ID 前缀，请选择 `pathPrefix` 菜单选项。最后，使用 `Activity` 菜单（C）选择 `LandmarkActivity`\
  \ 作为响应应用链接的活动：\n\n![](img/as_app_links_url_mapping.jpg)\n图 79-6\n\n完成对话框中的设置后，点击\
  \ `OK` 按钮提交更改。通过在映射屏幕的 `Check URL Mapping` 字段中输入以下 URL（将 `<your domain>` 设置为上方 `Host`\
  \ 字段指定的域名），检查 URL 是否格式正确并分配给相应的活动：\n\n`http://<your domain>/landmarks/toweroflondon`\n\
  \n如果映射正确，`LandmarkActivity` 将列为映射的活动：\n\n![](img/as_app_links_check_url.jpg)\n图\
  \ 79-7\n\n最新版本的 Android 要求为 HTTP 和 HTTPS 协议都声明 App Links，即使只使用其中一种。因此，在继续下一步之前，重复上述步骤向列表添加\
  \ HTTPS 版本的 URL。下一步也将将在该助手的 URL 映射屏幕中执行，因此请保持屏幕处于选中状态。\n\n## 79.5 添加意图过滤器\n\n\n\n\
  \n\n如上一章所述，需要一个意图过滤器（intent filter）来响应应用链接的点击并启动目标活动。实际上，当添加 URL 映射时，意图过滤器会自动添加到项目清单文件（manifest）。在\
  \ App Links 助手（App Links Assistant）的 URL 映射列表中选择了 URL 映射后，向下滚动屏幕，直到意图过滤器预览（Preview）部分进入视野。预览内容应包含修改后的\
  \ `AndroidManifest.xml` 文件，其中包含了新添加的意图过滤器：\n\n![](img/as_app_links_intent_filter.jpg)\n\
  \n图 79-8\n\n尽管 App Links 助手已经为我们添加了意图过滤器，但它可能没有包含处理应用链接时所需的 `autoVerify` 设置。打开 `manifests\
  \ -> AndroidManifest.xml` 文件，并如下所示将此设置添加到两个意图过滤器中：\n\n```xml\n<intent-filter android:autoVerify=\"\
  true\">\n.\n.\n    <data android:scheme=\"http\" />\n    <data android:host=\"www.example.com\"\
  \ />\n    <data android:pathPrefix=\"/landmarks\" />\n</intent-filter>\n\n<intent-filter\
  \ android:autoVerify=\"true\">\n.\n.\n    <data android:scheme=\"https\" />\n  \
  \  <data android:host=\"www.example.com\" />\n    <data android:pathPrefix=\"/landmarks\"\
  \ />\n</intent-filter>\n```\n\n### 79.6 添加意图处理代码\n\n到目前为止采取的步骤确保了在响应格式化正确的应用链接 URL\
  \ 时会启动正确的活动。下一步是在 `LandmarkActivity` 类中处理意图（intent），以便从数据库中提取正确的记录并显示给用户。在对 `LandmarkActivity.java`\
  \ 文件中的代码进行任何更改之前，值得检查现有代码的一些区域。在代码编辑器中打开 `LandmarkActivity.java` 文件，找到 `onCreate()`\
  \ 和 `handleIntent()` 方法，它们目前读取的内容应该如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    handleIntent(getIntent());\n}\n\nprivate void handleIntent(Intent\
  \ intent) {\n    String landmarkId =\n        intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```\n\n在当前形式下，代码期望在 Intent 包的额外数据（extra data）中找到地标\
  \ ID。由于活动现在可以通过应用链接启动，因此必须更改此代码以处理两种情况。首先删除 `onCreate()` 方法中对 `handleIntent()` 的调用：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    handleIntent(getIntent());\n\
  }\n```\n\n要添加初始的应用链接意图处理代码，返回 App Links 助手面板，并点击第 2 步列出的“选择活动（Select Activity）”按钮。在活动选择对话框中，点击“插入代码（Insert\
  \ Code）”按钮之前选择 `LandmarkActivity` 条目：\n\n![](img/as_app_links_select_activity.jpg)\n\
  \n图 79-9\n\n返回 `LandmarkActivity.java` 文件，注意以下代码已插入到 `onCreate()` 方法中（注意，如果 Android\
  \ Studio 无法完成请求，您可以手动添加此代码）：\n\n```java\n// 注意：这是自动生成的，用于处理应用链接。\nIntent appLinkIntent\
  \ = getIntent();\nString appLinkAction = appLinkIntent.getAction();\nUri appLinkData\
  \ = appLinkIntent.getData();\n```\n\n此代码访问 Intent 对象并提取 `Action` 字符串和 `Uri`。如果活动启动源于应用链接，则\
  \ action 字符串将设置为 `android.intent.action.VIEW`，这与添加到清单文件的意图过滤器中声明的 action 相匹配。相反，如果活动是由主活动\
  \ `findLandmark()` 方法中的标准意图启动代码启动的，则 action 字符串将为 `null`。通过检查赋值给 action 字符串的值，可以编写代码识别活动是如何启动的并采取适当的操作：\n\
  \n```java\n.\n.\nimport android.net.Uri;\n.\n.\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n.\n.\n    // 注意：这是自动生成的，用于处理应用链接。\n\
  \    Intent appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
  \    Uri appLinkData = appLinkIntent.getData();\n    String landmarkId = appLinkData.getLastPathSegment();\n\
  \    if (landmarkId != null) {\n        displayLandmark(landmarkId);\n    }\n}\n\
  ```\n\n剩下的只是向方法添加一些额外代码以识别应用链接 URL 路径中的最后一个组件，并在查询数据库时将其作为地标 ID：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n.\n.\n    // 注意：这是自动生成的，用于处理应用链接。\n\
  \    Intent appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
  \    Uri appLinkData = appLinkIntent.getData();\n    if (appLinkAction != null)\
  \ {\n        if (appLinkAction.equals(\"android.intent.action.VIEW\")) {\n     \
  \       String landmarkId = appLinkData.getLastPathSegment();\n            if (landmarkId\
  \ != null) {\n                displayLandmark(landmarkId);\n            }\n    \
  \    }\n    } else {\n        handleIntent(appLinkIntent);\n    }\n}\n```\n\n###\
  \ 79.7 测试应用\n\n在设备或模拟器上运行应用，确保仍然可以搜索地标。我们现在已成功为应用添加了链接支持。\n\n### 79.8 创建数字资产链接文件\n\
  \n正如“意图概述”章节所述，为了完全支持应用链接，我们需要在网站上安装数字资产链接文件。首先按照“意图概述”中列出的步骤找到 `debug.keystore`\
  \ 文件并识别您的 SHA256 指纹。\n\n接下来，在浏览器中打开以下页面：[`developers.google.com/digital-asset-links/tools/generator`](https://developers.google.com/digital-asset-links/tools/generator)\n\
  \n页面加载后，在托管站点域名（Hosting site domain）字段中输入您的网站 URL，输入 `com.ebookfrenzy.applinking`\
  \ 作为应用包名，并将您的 SHA256 指纹输入到应用包指纹（SHA256）字段中：\n\n![](img/asset_file_generator.jpg)\n\
  \n图 79-10\n\n点击“生成（Generate）”按钮以显示生成的语句，并将其命名为 `assetlinks.json` 的文件放在 Web 服务器上名为\
  \ `.well-known` 的文件夹中。返回生成器页面并点击“测试（Test）”按钮以验证文件位置正确。如果测试成功，将出现类似下面的输出：\n\n![](img/asset_file_link_test.jpg)\n\
  \n图 79-11\n\n### 79.9 测试应用链接\n\n假设测试成功，我们现在准备好尝试应用链接。返回 App Links 助手面板并点击“测试应用链接（Test\
  \ App Links）”按钮。在提示输入测试 URL 时，输入 `londonbridge` 地标 ID 的 URL（使用应用链接映射中引用的域名），然后点击“运行测试（Run\
  \ Test）”按钮：\n\n![](img/as_app_links_test_on_device.jpg)\n\n图 79-12\n\n\n\n\n\n一旦点击按钮，`Landmark`\
  \ 应用程序应在设备或模拟器上启动，并显示关于伦敦桥的信息。\n\n### 79.10 总结\n\n本章演示了在 Android 应用项目中实现 App Link\
  \ 支持的步骤，包括在 Android Studio 中使用 App Link 助手、App Link URL 映射、意图过滤器（intent filters）、使用数字资产链接（Digital\
  \ Asset Links）文件项处理网站关联，以及 App Link 测试。\n\n# 80. Android 生物识别认证教程\n\n触摸传感器现在已已内置于许多\
  \ Android 设备中，用于识别用户并提供设备和应用功能的访问，例如使用指纹识别的应用内支付选项。指纹识别仅是多种认证方法之一，还包括密码、`PIN` 以及最近推出的面部识别。\n\
  \n尽管目前市场上只有少数 Android 设备提供面部识别，但这在未来可能会变得更加常见。考虑到这一点，Google 已经开始从以指纹为中心的应用添加身份验证的方法转向一种更具通用性的方法，称为“生物识别认证”。\n\
  \n本章提供了生物识别认证的概述，并提供了一个详细的循步渐进教程，演示了在 Android 应用项目内实现生物识别认证的实用方法。\n\n### 80.1 生物识别认证概述\n\
  \n关键生物识别认证组件是 `BiometricPrompt` 类。该类执行了许多在早期 Android 版本中必须通过编写代码完成的工作，包括显示标准对话框引导用户完成认证过程、执行认证以及将结果报告给应用。该类还处理了过度失败的认证尝试，并在用户重试之前强制执行超时。\n\
  \n`BiometricPrompt` 类包含一个伴随类 `Builder`，可以使用它可以配置并创建 `BiometricPrompt` 实例，包括定义显示在生物识别认证框中的文本，以及对对话框中出现的取消按钮（也称为否定按钮）进行自定义。\n\
  \n`BiometricPrompt` 实例还分配了一组认证回调，这些回调将被调用以为应用提供认证操作的结果。`CancellationSignal` 实例也允许应用在认证进行过程中取消认证。\n\
  \n在涵盖这些基础之后，本章的其余部分将在示例项目中实现基于指纹的生物识别认证。\n\n## 80.2 创建生物识别认证项目\n\n从欢迎界面选择 `New Project`\
  \ 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `BiometricDemo`\
  \ 并指定 `com.ebookfrenzy.biometricdemo` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level`\
  \ 设置为 `API 29: Android (Q)`，并将 `Language` 菜单设置为 `Java`。\n\n## 80.3 配置设备指纹认证\n\n\
  指纹认证仅适用于带有触摸器的设备，并且已采取适当的配置步骤来保护设备并录入至少一个指纹。有关配置模拟器会话测试指纹认证的步骤，请参考章节 “Using and\
  \ Configuring the Android Studio AVD Emulator”。\n\n通过打开 `Settings` 应用并选择 `Security`\
  \ 选项在物理设备上配置指纹认证。在 `Security` 设置屏幕中，选择 `Fingerprint` 选项。点击信息屏幕上的 `Next` 按钮进入指纹设置屏幕。在启用指纹安全之前，必须配置备份锁屏幕解锁方法（例如\
  \ `PIN`）。如果锁屏幕未加保护，请按照步骤配置 `PIN`、`pattern` 或 `password` 安全。\n\n锁屏幕安全保护后，进入指纹检测屏幕并在提示时触摸传感器\
  \ (图 80-1)，如有需要重复此过程添加更多指纹。\n\n![](img/Image24253.jpg)\n\n图 80-1\n\n### 80.4 向文件中添加生物识别权限\n\
  \n生物识别认证要求应用在项目清单文件中请求 `USE_BIOMETRIC` 权限。在 Android Studio 项目工具窗口中，找到并编辑 `app ->\
  \ manifests -> AndroidManifest.xml` 文件，按如下方式添加权限请求：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.biometricdemo\">\n    <uses-permission\n       \
  \ android:name=\"android.permission.USE_BIOMETRIC\" />\n</manifest>\n```\n\n###\
  \ 80.5 设计用户界面\n\n为了使示例尽可能简单，用户界面中唯一的视觉元素将是一个 `Button` 视图。找到并选择 `activity_main.xml`\
  \ 布局资源文件将其加载到 `Layout Editor` 工具中。\n\n删除示例 `TextView` 对象，从调色板的 `Common` 类别拖放一个 `Button`\
  \ 对象并将其放置在布局画布的中心。使用 `Attributes` 工具窗口将按钮上的 `text` 属性更改为“Authenticate”并将字符串提取到资源。最后，配置\
  \ `onClick` 属性以调用名为 `authenticateUser` 的方法。\n\n完成上述步骤后，布局应与图 80-2 所示：\n\n![](img/as_biometric_demo_ui.jpg)\n\
  \n图 80-2\n\n## 80.6 添加 Toast 便利方法\n\n在示例代码的各个点，应用都将被设计为通过 `Toast` 消息向用户显示信息。与其多次重复相同的\
  \ `Toast` 代码，将在主活动中添加一个名为 `notifyUser()` 的便利方法。该方法将接受单个 `String` 值并作为 `Toast` 消息显示给用户。现在编辑\
  \ `MainActivity.java` 文件并添加该方法：\n\n```java\nimport android.widget.Toast;\n\nprivate\
  \ void notifyUser(String message) {\n    Toast.makeText(this, message, Toast.LENGTH_LONG).show();\n\
  }\n```\n\n### 80.7 检查安全设置\n\n在本章早期，已对测试应用的设备或模拟器配置了锁屏幕并注册了指纹。然而，在尝试请求指纹认证之前，在应用中包含防御性代码以确保满足这些要求是重要的。这些步骤将在\
  \ `MainActivity.java` 文件的 `onCreate` 方法中使用 `Keyguard` 和 `PackageManager` 管理服务执行。注意已添加代码验证验证配置了\
  \ `USE_BIOMETRIC` 权限：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.app.KeyguardManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_biometric_demo);\n\
  \        checkBiometricSupport();\n    }\n\n    private void checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);\n\
  \        if (!keyguardManager.isKeyguardSecure()) {\n            notifyUser(\"Lock\
  \ screen security not enabled in Settings\");\n        }\n    }\n}\n```\n\n\n\n\n\
  \n```java\nif (ActivityCompat.checkSelfPermission(this,\n        Manifest.permission.USE_BIOMETRIC)\
  \ !=\n        PackageManager.PERMISSION_GRANTED) {\n    notifyUser(\"Fingerprint\
  \ authentication permission not enabled\");\n}\n}\n```\n\n上述代码更改首先通过使用 `Keyguard`\
  \ 管理器来验证是否已配置备用屏幕解锁方法（换句话说，可以使用 own 或其他身份验证方法作为指纹认证的替代方案来解锁屏幕）。如果锁屏未加密，代码将向用户报告此问题并从该方法返回。\n\
  \n随后，该方法会在使用 `package manager` 验证设备是否支持指纹识别之前，先检查用户是否已为该应用启用了生物识别权限。\n\n### 80.8\
  \ 配置身份验证回调\n\n在配置生物识别提示对话框时，需要分配一组身份验证回调方法，通过这些方法可以通知应用身份验证过程的成功或失败。这些方法需要封装在 `BiometricPrompt.AuthenticationCallback`\
  \ 类实例中。在 `MainActivity.java` 文件中，添加一个方法来创建并返回该类的实例，并实现相应的方法：\n\n```java\nimport\
  \ android.hardware.biometrics.BiometricPrompt;\n\nprivate BiometricPrompt.AuthenticationCallback\
  \ getAuthenticationCallback() {\n    return new BiometricPrompt.AuthenticationCallback()\
  \ {\n        @Override\n        public void onAuthenticationError(int errorCode,\n\
  \                CharSequence errString) {\n            notifyUser(\"Authentication\
  \ error: \" + errString);\n            super.onAuthenticationError(errorCode, errString);\n\
  \        }\n        @Override\n        public void onAuthenticationHelp(int helpCode,\n\
  \                CharSequence helpString) {\n            super.onAuthenticationHelp(helpCode,\
  \ helpString);\n        }\n        @Override\n        public void onAuthenticationFailed()\
  \ {\n            super.onAuthenticationFailed();\n        }\n        @Override\n\
  \        public void onAuthenticationSucceeded(\n                BiometricPrompt.AuthenticationResult\
  \ result) {\n            notifyUser(\"Authentication Succeeded\");\n           \
  \ super.onAuthenticationSucceeded(result);\n        }\n    };\n}\n```\n\n\n\n\n\n\
  到本书为止，我们一直在以适用于测试和调试的模式构建应用程序项目。另一方面，要构建一个通过 Google Play 发布给客户的应用程序包，还需要额外的步骤。第一个要求是以发布模式（release\
  \ mode）而非调试模式（debug mode）编译应用程序。其次，必须使用私钥对应用程序进行签名，该密钥将唯一标识你作为应用程序的开发者。最后，必须将应用程序打包成\
  \ Android App Bundle（应用束）。\n\n虽然这些任务可以在 Android Studio 环境之外完成，但正如本章后续内容所述，使用 Android\
  \ Studio 的构建机制可以更方便地完成这些操作。不过，首先深入了解 Android App Bundles 是重要的。\n\n## 81.2 Android\
  \ App Bundles\n\n当用户从 Google Play 安装应用时，该应用是以 `APK` 文件的形式下载的。该文件包含了在用户设备上安装和运行应用所需的所有内容。在\
  \ `Android Studio 3.2` 引入之前，开发者会使用 Android Studio 生成一个或多个 `APK` 文件并将其上传到 Google\
  \ Play。支持多种设备类型、屏幕尺寸和语言区域需要为每个目标设备和语言创建并上传多个自定义的 `APK` 文件，或者生成一个包含所有不同配置资源和平台二进制文件的单包通用\
  \ `APK`。\n\n创建多个 `APK` 文件涉及大量工作，且在每次更新应用时都必须重复，这给应用发布过程带来了巨大的时间开销。\n\n通用 `APK` 选项虽然减轻了开发者的负担，但导致了一个完全意料之外的问题。通过分析应用安装指标，Google\
  \ 发现安装 `APK` 文件越大（导致下载时间变长和存储占用增加），应用收到的转化频次就越少。转化率的计算方式为：在 Google Play 上查看该应用后完成安装的用户所占的百分比。Google\
  \ 估计，`APK` 文件大小每增加 6MB，应用的转化率就会下降 1%。\n\nAndroid App Bundles 解决了这些问题，它允许开发者在 Android\
  \ Studio 内部创建一个单一包，并让 Google Play 为每个单独支持的配置自动生成自定义的 `APK` 文件（这一概念被称为“动态交付” Dynamic\
  \ Delivery）。\n\nAndroid App Bundle 是一个 `ZIP` 文件，包含了为应用项目内已支持的设备和语言区域构建 `APK` 文件所需的所有文件。例如，项目可能包含针对不同屏幕尺寸的资源和图像。当用户安装应用时，Google\
  \ Play 会接收有关设备的信息，包括显示屏、处理器架构和语言区域。利用这些信息，适当的预生成 `APK` 文件将传输到用户的设备上。\n\n动态交付的额外优势是将应用拆分为多个模块，称为“动态功能模块”，每个模块包含应用内特定功能区域的代码和资源。每个动态功能模块都包含在与基础模块分离的独立\
  \ `APK` 文件中，并且仅在用户需要该功能时才下载到设备。动态交付和应用束还允许创建“即时动态功能模块”，这种模块无需安装整个应用即可在设备上立即运行。\n\
  \n尽管仍然可以从 Android Studio 生成 `APK` 文件，但应用束现在是向 Google Play 上传应用的的推荐方式。\n\n## 81.3\
  \ 注册 Google Play 开发者控制台账户\n\n应用提交过程的第一步是创建一个 Google Play 开发者控制台账户。为此，访问 `https://play.google.com/apps/publish/signup/`\
  \ 并按照说明完成注册过程。请注意，注册需要支付一次性的 25 美元费用。一旦应用上市，Google 将保留与应用相关的所有收入的 30%。创建账户后，可以通过\
  \ `https://play.google.com/console` 访问开发者控制台。\n\n下一步是收集有关应用的信息。为了将你的应用推市场，需要以下信息：\n\
  \n- 标题 – 应用的标题。\n- 简短 – 最多 80 个单词的应用描述。\n- 完整说明 – 最多 4000 个字的应用描述。\n- 截图 – 最多 8\
  \ 张应用运行的截图（至少需要两张）。Google 建议提交在 7 英寸或 10 英寸平板电脑上运行的应用截图。\n- 语言 – 应用的语言（默认为美国英语）。\n\
  - 推广文本 – 当你的应用出现在 Google Play 环境内的特殊促销活动时将使用的文本。\n- 应用类型 – 你的应用被视为游戏还是应用程序。\n- 类别\
  \ – 最能描述你应用的类别（例如：金融、健康与健身、教育、体育等）。\n- 地区 – 你希望你的应用在哪些地理位置开放购买。\n- 联系方式 – 用户可以通过哪些方式联系你获取应用相关的支持。选项包括网页、电子邮件和电话。\n\
  - 定价与分发 – 有关应用价格以及要在哪些地理位置营销和销售的信息。\n\n收集上述信息后，点击 Google Play Console 内的 `Create\
  \ app` 按钮开始创建过程。\n\n### 81.4 在控制台中配置应用\n\n当首次点击 `Create app` 按钮时，将出现应用详情和声明屏幕，如图\
  \ 81-1 所示：\n\n```\n![](image/as_4.1_play_create_app.jpg\n```\n图 81-1\n\n一旦完全配置应用条目，点击\
  \ `Create app` 按钮（如上图高亮所示）添加应用并显示仪表板屏幕。在仪表板中，找到 `Initial setup` 部分并展开配置应用商店列表的步骤列表：\n\
  \n```\n![](image/as_4.1_play_app_initial_steps.jpg\n```\n图 81-2\n\n逐步完成列表中的链接并为你的应用提供所需信息，确保在每一步都保存更改。\n\
  \n## 81.5 启用 Google Play 应用签名\n\n直到最近，Google Play 的上传是在 Android Studio 内部使用发布应用签名密钥进行签名，然后上传到\
  \ Google Play 控制台。虽然该选项可用，但推荐的上传方式是使用名为“Google Play 应用签名”的过程。对于新创建的应用，这涉及启用 Google\
  \ Play 应用签名并生成一个上传密钥以在 Android Studio 内部签名应用束文件。当上传 Android Studio 生成的应用束文件时，Google\
  \ Play 控制台将移除上传密钥并使用安全存储在 Google Play 服务器中的应用签名密钥对文件进行签名。对于现有应用，启用 Google Play 签名还需要额外的步骤，将在章末尾介绍。\n\
  \n\n\n\n\n点击“创建发布”按钮 (C) 以启用 Google Play 应用签名。现在控制台已准备好为您的应用创建第一个测试版本。然而，在此之前，下一步是从\
  \ Android Studio 内部生成上传密钥。这是生成签名应用包（app bundle）过程的一部分。请保持当前 Google Play Console\
  \ 页面加载，因为我们将在本章节稍后返回此处。\n\n### 81.6 创建密钥库文件 (Keystore)\n\n要创建密钥库文件，选择 Android Studio\
  \ 中的 `Build` -> `Generate Signed Bundle / APK…` 菜单选项，显示如图 81-4 所示的 `Generate Signed\
  \ Bundle or APK Wizard` 对话框：\n\n![](img/as_generate_app_bundle.jpg)\n\n图 81-4\n\n\
  在点击 `Next` 按钮之前，确认已选择 `Android App Bundle` 选项。\n\n如果您已有现发布密钥库文件，点击下一个屏幕上的 `Choose\
  \ existing…` 按钮，导航并选择该文件。如果您尚未创建密钥库文件，点击 `Create new…` 按钮显示 `New Key Store` 对话框（图\
  \ 81-5）。点击 `Key store path` 字段右侧的按钮，导航到文件系统中合适的位置，为密钥库文件命名（例如 `release.keystore.jks`）并点击\
  \ `OK` 按钮。\n\n`New Key Store` 对话框分为两个部分。顶部部分与密钥库文件相关。在此部分中，在 `Password` 和 `Confirm`\
  \ 字段中输入一个强密码以保护密钥库文件。对话框的下部部分与存储在密钥库文件中的上传密钥相关。\n\n![](img/as_generate_new_key_store.jpg)\n\
  \n图 81-5\n\n在 `New Key Store` 对话框的 `Key` 部分，输入以下详细信息：\n\n• 引用密钥的别名（alias）。这可以是任何字符序列，尽管系统仅使用前八位。\n\
  • 用于保护密钥的足够强力的密码。\n• 密钥的有效期年数（Google 建议有效期超过 25 年）。\n\n此外，必须为剩余字段中的至少一个提供信息（例如，您的姓和名或组织名称）。\n\
  \n信息输入完成后，点击 `OK` 按钮创建应用包。\n\n### 81.7 创建 Android 应用包\n\n下一步是指示 Android Studio 以发布模式构建应用包文件，并使用新创建的私钥对其进行签名。此时，`Generate\
  \ Signed Bundle or APK` 对话框应仍显示状态，且密钥库路径、密码和密钥别名字段已填充信息：\n\n![](img/as_generate_app_bundle_keystore_ready.jpg)\n\
  \n图 81-6\n\n确保已启用 `Export Encrypted Key` 选项，并在假设其他设置正确的情况下，点击 `Next` 按钮进入应用包生成屏幕（图\
  \ 81-7）。在此屏幕中，检查 `Destination Folder:` 设置，以验证生成应用包文件所在的位置是否可以接受。如果偏于使用其他位置，点击文本字段右侧的按钮，并导航到所需的文件系统位置。\n\
  \n![](img/as_generate_app_bundle_generate.jpg)\n\n图 81-7\n\n点击 `Finish` 按钮并等待 `Gradle`\
  \ 系统构建应用包。一旦构建完成，将出现一个对话框，提供在资源管理器窗口中打开包含应用包文件的文件夹或将文件加载到 `APK Analyzer` 中的选项：\n\
  \n![](img/as_generate_app_bundle_ready.jpg)\n\n图 81-8\n\n此时，应用已准备好提交到 Google Play。点击\
  \ `locate` 链接打开文件浏览器窗口。除非指定了其他位置，否则文件应命名为 `bundle.aab`，并位于项目文件夹的 `app/release` 子目录下。\n\
  \n在此过程中生成的私钥应在签名和发布未来应用时使用，因此应将其保存在安全的地方并进行安全备份。\n\n### 81.8 生成测试 APK 文件\n\n此阶段的任可选步骤是从应用包生成\
  \ APK 文件，并将它们安装和运行在设备或模拟器会话上。Google 了一个了一个名为 `bundletool` 的命令行工具，该工具专门为此目的而设计，可以从以下\
  \ URL 下载：\n\n[`github.com/google/bundletool/releases`](https://github.com/google/bundletool/releases)\n\
  \n在编写本文时，`bundletool` 以 `.jar` 文件的形式提供，可以如下所示从命令行执行（请注意版本号自本书出版以来可能已经发生变化）：\n\n\
  ```bash\njava -jar bundletool-all-0.9.0.jar\n```\n\n运行上述命令将列出工具中所有可用选项。要从应用包生成 APK\
  \ 文件，使用 `build-apks` 选项。文件还需要签名，以生成可以安装到设备或模拟器上的 APK 文件。为了实现这一点，请包含 `--ks` 选项指定在本章之前创建的密钥库文件路径，以及\
  \ `--ks-key-alias` 选项指定生成密钥时提供的别名。\n\n最后，必须使用 `--output` 标志来指定生成 APK 文件的文件路径（称为\
  \ APK Set）。该文件不能已存在，并且必须具有 `.apks` 文件扩展名。综合这些要求，得出以下命令行（考虑到您的操作系统路径结构的可能差异）：\n\n\
  ```bash\njava -jar bundletool-all-0.9.0.jar build-apks --bundle=path/to/bundle.aab\
  \ --output=path/to/output.apks --ks=path/to/keystore.jks --ks-key-alias=yourAlias\n\
  ```\n\n当执行此命令时，会在生成 APK 文件到指定的 APK Set 文件之前弹出提示，请求密钥库密码。APK Set 是一个包含从应用包生成的所有 APK\
  \ 文件的 ZIP 文件。\n\n要将适当的文件安装到连接设备上，请使用类似下面的命令：\n\n```bash\njava -jar bundletool-all-0.9.0.jar\
  \ install-apks --apks=path/to/output.apks\n```\n\n此命令将指示工具识别适用于连接设备的适当 APK 文件并安装它们，以便启动和测试应用。\n\
  \n也可以从 APK Set 中提取 APK 文件而不安装它们。此过程的第一步是按如下方式获取连接设备的规范：\n\n```bash\njava -jar bundletool-all-0.9.0.jar\
  \ get-device-spec --output=path/to/device.json\n```\n\n上述命令将生成一个类似的 JSON 文件：\n\n\
  ```json\n{\n  \"supportedAbis\": [\"x86\"],\n  \"supportedLocales\": [\"en-US\"\
  ],\n  \"screenDensity\": 420,\n  \"sdkVersion\": 27\n}\n```\n\n接下来，使用此规范文件从 APK\
  \ Set 中提取匹配的 APK 文件：\n\n```bash\njava -jar bundletool-all-0.9.0.jar extract-apks\
  \ --apks=path/to/output.apks --output-dir=path/to/dir --device-spec=path/to/device.json\n\
  ```\n\n执行后，通过 `--output-dir` 指定的目录将包含 APK 文件。\n\n### 81.9 将应用包上传到 Google Play Developer\
  \ Console\n\n将 Android 应用推向市场的下一步将其提交到 Google Play Developer Console 以进行测试。\n\n\
  返回 Google Play Console，并在导航面板的 `Testing` 部分选择 `Internal testing` 选项（如图 81-9 所示 A），然后点击\
  \ `Create new release` 按钮 (B)：\n\n![](img/as_4.1_play_create_new_release.jpg)\n\n\
  图 81-9\n\n在生成的屏幕上，点击 `Continue` 按钮（下所示 A）以确认使用 Google Play 应用签名，然后将 Android Studio\
  \ 生成的应用包文件拖放到上传落点 (B)：\n\n![](img/as_4.1_play_upload_bundle.jpg)\n\n\n\n\n\n图 81-10\n\
  \n上传完成后，向下滚动屏幕，并输入发布名称和可选的发布说明。发布名称可以是任何帮助您识别该版本的信息，且对用户不可见。\n\n在应用包文件上传后，Google\
  \ Play 将生成所有必要的 `APK` 文件以供测试。一旦 `APK` 文件生成完毕，滚动到屏幕底部并点击“保存（Save）”按钮。保存设置后，点击“审核发布（Review\
  \ release）”按钮。\n\n## 81.10 探索 App Bundle\n\n在审核屏幕上，如图 81-11 所示，点击已上传包右侧的箭头：\n\n\
  ![](img/as_4.1_play_app_bundle_review.jpg)\n\n图 81-11\n\n在弹出的面板中，点击`探索包（Explore\
  \ bundle）`链接以加载应用包探索器。这提供了与应用包相关的 API 级别、屏幕布局和支持的平台等摘要信息：\n\n![](img/as_4.1_play_app_bundle_explorer.jpg)\n\
  \n图 81-12\n\n点击`前往设备目录（Go to device catalog）`链接将显示该 `APK` 文件支持的设备：\n\n![](img/as_4.1_play_device_catalog.jpg)\n\
  \n图 81-13\n\n目前，该应用已准备好进行测试，但只有在控制台中设置了某些测试人员后才能进行发布。\n\n## 81.11 管理测试人员\n\n如果应用仍处于内部（Internal）、Alpha\
  \ 或 Beta 测试阶段，可以通过以下步骤指定授权测试人员：在 Google Play 控制台中选择该应用，点击导航面板中的“内部测试（Internal testing）”，并如图\
  \ 81-14 所示选择“测试人员（Testers）”标签：\n\n![](img/as_4.1_play_testers.jpg)\n\n图 81-14\n\n\
  要添加测试人员，点击“创建电子邮件列表（Create email list）”按钮，为列表命名，并手动指定测试用户的电子邮件地址或上传 `CSV` 文件。\n\n\
  现在可以从屏幕复制“网页加入（Join on the web）” URL 并提供给测试人员，以便他们接受测试邀请并下载应用。\n\n## 81.12 发布应用进行测试\n\
  \n现在已经创建了内部发布并添加了测试人员列表，应用已准备好发布进行测试。留在内部测试屏幕中，在点击最近创建的版本的“编辑（Edit）”按钮之前，选择“发布（Releases）”标签：\n\
  \n![](img/as_4.1_play_ready_for_rollout.jpg)\n\n图 81-15\n\n在审核屏幕上，滚动到最后并点击“开始发布到内部测试（Start\
  \ rollout to Internal testing）”按钮。在发布处理稍作延迟后，应用即可供指定用户下载和测试。\n\n## 81.13 上传新的 App\
  \ Bundle 版本\n\n为您应用程序上传的第一个应用包文件版本号始终为 `1`。如果尝试上传具有相同版本号的另一个包文件，控制台将带有以下错误拒绝该文件：\n\
  \n`您需要为你的 APK 使用不同的版本号，因为您已经有一个版本号为 1 的版本了。`\n\n要解决这个问题，需要增加嵌入包文件中的版本号。这在项目的模块级\
  \ `build.gradle.kts` 文件中进行，如如图 81-16 中高亮所示：\n\n![](img/as_generate_module_gradle_file.jpg)\n\
  \n图 81-16\n\n该文件通常如下：\n\n```kotlin\nplugins {\n    id(\"com.android.application\"\
  )\n}\n\nandroid {\n    namespace = \"com.ebookfrenzy.biometricdemo\"\n    compileSdk\
  \ = 34\n    defaultConfig {\n        applicationId = \"com.ebookfrenzy.biometricdemo\"\
  \n        minSdk = 33\n        targetSdk = 34\n        versionCode = 1\n       \
  \ versionName = \"1.0\"\n    }\n}\n```\n\n要更改版本号，请更改 `versionCode` 声明的数字。要同时更改显示给应用程序用户的版本号，请更改\
  \ `versionName` 字符串。例如：\n\n```kotlin\nversionCode 2\nversionName \"2.0\"\n```\n\n\
  进行这些更改后，重新构建 `APK` 文件并再次上传。\n\n## 81.14 分析 App Bundle 文件\n\nAndroid Studio 提供了分析应用包内容的内容。要分析包文件，选择\
  \ Android Studio 的 `Build -> Analyze APK…` 菜单选项，导航并选择要审核的包文件。一旦加载到工具中，将显示包的原始大小和下载大小，以及包的文件结构列表，如图\
  \ 81-17 所示：\n\n![](img/as_analyze_apk.jpg)\n\n图 81-17\n\n选择 `classes.dex` 文件将在下面板中显示该文件的类结构。\n\
  \n![](img/as_analyze_apk.jpg)\n\n图 81-18\n\n同样，选择资源或图像文件将在面板中显示内容。可以通过点击`与之前的 APK\
  \ 比较（Compare with previous APK）`来查看包文件之间的差异。\n\n## 81.15 总结\n\n当应用项目完成或准备好测试后，可以将其上传到\
  \ Google Play 并发布到生产、内部或 Beta 测试。在上传应用之前，必须在控制台中创建应用条目，并应用信息。发布版包将在 Android Studio\
  \ 中生成并签名。\n\n\n\n\n一旦修改了构建文件并将应用包上传到控制台，下一步是为用户添加所需的应用内商品或订阅。\n\n## 82.2 创建应用内商品和订阅\n\
  \n商品和订阅是通过使用 Play Console 导航面板中 `Monetize`（变现）部分列出的选项来创建和管理的，如下方的图 82-1 所示：\n\n\
  ![](img/play_console_monetization.jpg)\n\n图 82-1\n\n每个商品或订阅都需要一个 ID、标题、描述和价格信息。购买分为三类：消耗性（用户在每次需要时都必须购买，例如游戏中的虚拟货币）、非消耗性（用户仅需购买一次，例如内容访问）和订阅制。消耗性和非消耗性产品统称为受管理商品。\n\
  \n订阅适用于销售需要定期续订的商品，例如新闻内容访问或应用的高级功能。在创建订阅时，基础方案指定了价格、续订周期（每月、每年等）以及订阅是否自动续订。还可以为用户提供折扣优惠和预购订阅的选项。\n\
  \n### 82.3 Billing Client 初始化\n\n应用与 Google Play Billing Library 之间的通信由 `BillingClient`\
  \ 实例处理。此外，`BillingClient` 包含一组可以调用的方法，用于执行同步和异步结算相关活动。当初始化结算客户端时，需要为它提供一个 `PurchasesUpdatedListener`\
  \ 回调处理程序的引用。客户端将调用此处理程序来通知应用任何购买活动的结果。为了避免重复通知，建议每个应用仅一个 `BillingClient` 实例。\n\n\
  可以使用 `newBuilder()` 方法创建 `BillingClient` 实例，并传入当前的 activity 或 fragment 上文。然后通过 `setListener()`\
  \ 方法将购买更新处理器分配给客户端：\n\n```java\nprivate final PurchasesUpdatedListener purchasesUpdatedListener\
  \ =\n    new PurchasesUpdatedListener() {\n        @Override\n        public void\
  \ onPurchasesUpdated(BillingResult billingResult,\n                            \
  \           List<Purchase> purchases) {\n            if (billingResult.getResponseCode()\
  \ ==\n                BillingClient.BillingResponseCode.OK\n                && purchases\
  \ != null) {\n                // 购买成功\n                for (Purchase purchase :\
  \ purchases) {\n                    // 处理购买\n                }\n            } else\
  \ if (billingResult.getResponseCode() ==\n                BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n                // 用户取消购买\n            } else {\n                //在此处处理错误\n\
  \            }\n        }\n    };\n\nprivate BillingClient billingClient = BillingClient.newBuilder(context)\n\
  \    .setListener(purchasesUpdatedListener)\n    .enablePendingPurchases()\n   \
  \ .build();\n```\n\n### 82.4 连接到 Google Play Billing Library\n\n在成功创建结算客户端后，下一步是初始化与\
  \ Google Play Billing Library 的连接。必须调用结算客户端实例的 `startConnection()` 方法来建立此连接。由于连接是异步执行的，必须实现\
  \ `BillingClientStateListener` 以接收指示连接是否成功的回调。还应该添加代码来重写 `onBillingServiceDisconnected()`\
  \ 方法。当与 Billing Library 的连接丢失时会调用此方法，用于向用户报告问题并重试连接。\n\n一旦设置和连接任务完成，`BillingClient`\
  \ 实例将调用 `onBillingFinished()` 方法，该方法可以检查客户端是否就绪：\n\n```java\nbillingClient.startConnection(new\
  \ BillingClientStateListener() {\n    @Override\n    public void onBillingSetup(@NonNull\
  \ BillingResult billingResult) {\n        if (billingResult.getResponseCode() ==\
  \ BillingClient.BillingResponseCode.OK) {\n            // 连接成功\n        } else {\n\
  \            // 连接失败\n        }\n    }\n    @Override\n    public void onBillingServiceDisconnected()\
  \ {\n        // 连接丢失\n    }\n});\n```\n\n### 82.5 查询可用商品\n\n一旦结算环境初始化并就绪，下一步是请求可购买的商品或订阅的详情。这是通过调用\
  \ `BillingClient` 的 `queryProductDetails()` 方法实现的，并传入一个配置适当的 `QueryDetailsParams`\
  \ 实例，该实例包含商品 ID 和类型（订阅使用 `ProductType.SUBS`，受管理商品使用 `ProductType.INAPP`）：\n\n```java\n\
  QueryDetailsParams queryProductDetailsParams =\n    QueryDetailsParams.newBuilder()\n\
  \        .setProductList(\n            ImmutableList.of(\n                QueryDetailsParams.Product.newBuilder()\n\
  \                    .setProductId(\"one_button_click\")\n                    .setProductType(BillingClient.ProductType.INAPP)\n\
  \                    .build()))\n        .build();\n\nbillingClient.queryProductDetailsAsync(queryProductDetailsParams,\n\
  \    new ProductDetailsResponseListener() {\n        @Override\n        public void\
  \ onProductDetailsResponse(@NonNull BillingResult billingResult,\n             \
  \                               @NonNull List<ProductDetails> productDetailsList)\
  \ {\n            if (!productDetailsList.isEmpty()) {\n                // 处理匹配的商品列表\n\
  \            } else {\n                // 未找到匹配的商品\n            }\n        }\n \
  \   });\n```\n\n`queryProductDetailsAsync()` 方法接收一个 `ProductDetailsResponseListener`\
  \ 处理器，该处理器会被调用并传入一个包含匹配商品信息的 `ProductDetail` 对象列表。例如，我们可以调用这些对象的方法来获取商品名称、标题、描述、价格和优惠信息。\n\
  \n### 82.6 启动购买流程\n\n一旦用户查询并选择了某个商品或订阅，购买流程就可以启动。我们通过调用 `BillingClient` 的 `launchBillingFlow()`\
  \ 方法来实现，传入当前 activity 和一个使用所购商品 `ProductDetail` 对象配置的 `BillingFlowParams` 实例。\n\n\
  ```java\nBillingFlowParams billingFlowParams =\n    BillingFlowParams.newBuilder()\n\
  \        .setProductDetailsParamsList(\n            ImmutableList.of(\n        \
  \        BillingFlowParams.ProductDetailsParams.newBuilder()\n                 \
  \   .setProductDetails(productDetails)\n                    .build()))\n       \
  \ )\n        .build();\n\nbillingClient.launchBillingFlow(this, billingFlowParams);\n\
  ```\n\n购买操作的成功或失败将通过在本章前面概述的 `PurchasesUpdatedListener` 回调处理器报告。\n\n### 82.7 完成购买\n\
  \n当购买成功时，`PurchasesUpdatedListener` 处理器将收到一个包含每个商品 `Purchase` 对象的列表。你可以通过调用 `Purchase`\
  \ 实例的 `getPurchaseState()` 方法来验证商品是否已购买：\n\n```java\nif (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PURCHASED) {\n    // 购买完成。\n} else if (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PENDING) {\n    // 支付处理中\n}\n```\n\n请注意，只有在初始化期间调用了\
  \ `enablePendingPurchases()` 方法，你的应用才会支持待付款购买。待付款购买将一直保持该状态，直到用户完成支付流程。\n\n\n\n\n\
  \n当非消耗性物品购买完成后，必须对其进行确认，以防止向用户退款。这需要物品的购买令牌（purchase token），该令牌可以通过调用 `Purchase`\
  \ 对象的 `getPurchaseToken()` 方法获取。此令牌用于创建 `AcknowledgePurchaseParams` 实例和 `AcknowledgePurchaseResponseListener`\
  \ 处理器。托管商品购买和订阅通过如下方式调用 `BillingClient` 的 `acknowledgePurchase()` 方法进行确认：\n\n```java\n\
  AcknowledgePurchaseParams acknowledgePurchaseParams =\n        AcknowledgePurchaseParams.newBuilder()\n\
  \                .setPurchaseToken(purchase.getPurchaseToken())\n              \
  \  .build();\n\nAcknowledgePurchaseResponseListener acknowledgePurchaseResponseListener\
  \ =\n                new AcknowledgePurchaseResponseListener() {\n\n    @Override\n\
  \    public void onAcknowledgePurchaseResponse(\n                            @NonNull\
  \ BillingResult billingResult) {\n        billingClient.acknowledgePurchase(\n \
  \                                   acknowledgePurchaseParams,\n               \
  \                     acknowledgePurchaseResponseListener);\n    }\n};\n```\n\n\
  对于消耗性购买，你需要在物品被消耗后通知 Google Play，以便用户可以再次购买。。这需要一个包含购买令牌的已配置 `ConsumeParams` 实例、一个\
  \ `ConsumeResponseListener` 以及调用结算客户端的 `consumeAsync()` 方法：\n\n```java\nConsumeParams\
  \ consumeParams =\n        ConsumeParams.newBuilder()\n                .setPurchaseToken(purchase.getPurchaseToken())\n\
  \                .build();\n\nConsumeResponseListener listener = new ConsumeResponseListener()\
  \ {\n    @Override\n    public void onConsumeResponse(BillingResult billingResult,\n\
  \                                    @NonNull String purchaseToken) {\n        if\
  \ (billingResult.getResponseCode() ==\n                            BillingClient.BillingResponseCode.OK)\
  \ {\n            // 购买消耗成功\n        }\n    }\n};\n\nbillingClient.consumeAsync(consumeParams,\
  \ listener);\n```\n\n### 82.8 查询之前的购买\n\n在处理应用内购买时，检查用户是否已经购买了商品或订阅是一个常见需求。通过调用\
  \ `BillingClient` 实例的 `queryPurchasesAsync()` 方法并实现 `PurchaseResponseListener`，可以生成用户特定类型的所有之前的购买列表。例如，以下代码获取了所有尚未消耗的先前购买物品列表：\n\
  \n```java\nQueryPurchasesParams queryPurchasesParams =\n        QueryPurchasesParams.newBuilder()\n\
  \                .setProductType(BillingClient.ProductType.INAPP)\n            \
  \    .build();\n\nbillingClient.queryPurchasesAsync(queryPurchasesParams,\n    \
  \                    new PurchasesResponseListener() {\n    @Override\n    public\
  \ void onQueryPurchasesResponse(@NonNull BillingResult billingResult,\n        \
  \                                    @NonNull List<Purchase> list) {\n        //\
  \ 处理列表\n    }\n                });\n```\n\n要获取活跃订阅的列表，请将 `ProductType` 值更改为 `SUBS`。或者，要获取最新购买列表，请调用\
  \ `queryPurchasesAsync()`：\n\n```java\nQueryPurchasesParams queryPurchasesParams\
  \ =\n        QueryPurchasesParams.newBuilder()\n                .setProductType(BillingClient.ProductType.INAPP)\n\
  \                .build();\n\nbillingClient.queryPurchasesAsync(queryPurchasesParams,\n\
  \                        new PurchasesResponseListener() {\n    @Override\n    public\
  \ void onQueryPurchasesResponse(@NonNull BillingResult billingResult,\n        \
  \                                    @NonNull List<Purchase> list) {\n        //\
  \ 处理列表\n    }\n                });\n```\n\n### 82.9 总结\n\n应用内购买通过销售订阅提供从应用内部产生收入的方式。本章探讨了托管商品和订阅，并解释了消耗性与非消耗性商品之间的区别。下一章将展示如何在测试期间启用购买。\n\
  \n## 83. Android 购买教程\n\n在上一章中，我们探索了如何将应用内购买集成到项目中，并查看了一些代码示例。本章将通过创建一个演示如何添加消耗性购买的示例，将这些理论付诸实践。\n\
  \n### 83.1 关于应用内购买项目\n\n该项目的简单概念是：在一个应用程序中，启用按钮之前必须购买应用内商品。该应用内商品在每次点击按钮时都会被消耗。在初始化时，应用将连接到应用商店，获取商品详情并显示商品名称。随后按钮将被启用。\n\
  \n### 83.2 创建 InAppPurchase 项目\n\n此练习的第一步是创建一个新项目。启动 Android Studio 并在欢迎界面上选择“New\
  \ Project”（新建项目）。在新项目对话框中选择“Empty Views Activity”模板。\n\n在“Name”字段中输入 `InAppPurchase`，并指定一个在\
  \ Google Play 生态系统中唯一标识您的应用的包名（例如，`com.<your company>.InAppPurchase`）。在点击“Finish”（完成）按钮之前，将\
  \ Minimum API level（最低 API 级别）设置为 API 26：Android 8.0 (Oreo)，并将语言菜单更改为 Java。项目创建完成后，使用\
  \ view binding（视图绑定）将项目转换为未使用。\n\n### 83.3 向项目添加库\n\n在编写代码之前，必须将某些库添加到项目构建配置中，包括标准的\
  \ Android 结算客户端库。在项目的后续，我们还需要使用 Google Guava Core Java 库中的 `ImmutableList` 类。现在通过修改\
  \ `build.gradle.kts (Module: app)` 文件并进行以下更改来添加这些库：\n\n```kotlin\ndependencies {\n\
  \    implementation (\"com.android.billingclient:billing:6.0.1\")\n    implementation\
  \ (\"com.google.guava:guava:24.1-jre\")\n    implementation (\"com.google.guava:guava:27.0.1-android\"\
  )\n}\n```\n\n点击编辑器面板顶部 Sync Now（立即同步）链接以提交这些更改。\n\n### 83.4 设计用户界面\n\n用户界面将由现有 `TextView`\
  \ 和两个按钮组成。在编辑器中加载 `activity_main.xml` 文件后，将两个 Button 视图拖放到布局中，使其一个位于 `TextView`\
  \ 上方，另一个位于下方。选择 `TextView` 并将 id 属性更改为 `statusText`。\n\n\n\n\n\n点击工具栏中的 `Clear all\
  \ Constraints` 按钮，并按住 Shift 键选择三个视图。在最顶部的 Button 视图上点击右键，选择 `Center -> Horizontally\
  \ in Parent` 菜单选项。再次重复此步骤，选择 `Chains -> Create Vertical Chain`。修改顶部按钮的文本属性使其显示为“Consume\
  \ Purchase”，并将 `id` 设置为 `consumeButton`。同时，配置 `onClick` 属性以调用名为 `consumePurchase`\
  \ 的方法。\n\n选择底部的按钮并重复上述步骤，将文本设置为“Buy Product”，将 `id` 设置为 `buyButton`，并将 `onClick`\
  \ 回调设为 `makePurchase`。完成后，布局应与图 83-1 所示所示：\n\n![](img/as_inapppurchase_ui.jpg)\n\
  \n图 83-1\n\n### 83.5 将应用添加到 Google Play 商店\n\n按照“创建、测试和上传 Android App Bundle”章节中概述的步骤，登录\
  \ Play Console，创建一个新应用，并设置一个新的内部测试轨道，包括指定测试人员的电子邮件地址。返回 Android Studio 并为项目生成一个签名的发布版应用包（release\
  \ app bundle）。生成文件后，将其上传到内部测试轨道并发布进行测试。\n\n现在应用已经在 Google Play 商店中，我们准备好为该项目创建一个应用内商品了。\n\
  \n### 83.6 创建应用内商品\n\n在 Play Console 中选中应用，向下滚动左侧面板中的选项列表，直到出现 `Monetize`（变现）部分。在该部分内，选择\
  \ Products 下的 `In-app products` 选项，如图 83-2 所示：\n\n![](img/play_console_monetization1.jpg)\n\
  \n图 83-2\n\n在 `In-app products` 页面上，点击 `Create product` 按钮：\n\n![](img/play_console_create_product.jpg)\n\
  \n图 83-3\n\n在新产品屏幕上，在保存新产品之前输入以下信息：\n\n- 产品 ID：`one_button_click`\n- 名称：`A Button\
  \ Click`\n- ：`This is a test in-app product that allows a button to be clicked once.`\n\
  - 默认价格：设置为您常用货币的最低价格。\n\n### 83.7 启用许可测试人员\n\n在测试应用内购买时，可以在不花费任何资金的情况下进行测试购买是非常用的。这可以通过为内部轨道测试人员启用许可测试来实现。许可测试人员在购买时可以使用测试付款卡，这样他们就不会被收费。\n\
  \n在 Play Console 中，返回主屏幕并选择 `Setup -> License testing` 选项：\n\n![](img/play_console_license_testing.jpg)\n\
  \n图 83-4\n\n在许可测试屏幕内，添加为内部测试轨道添加的测试人员，将 `License response` 设置更改为 `RESPOND_NORMALLY`\
  \ 并保存更改：\n\n![](img/play_console_license_testing_screen.jpg)\n\n图 83-5\n\n现在应用和应用内商品已在\
  \ Play Console 中设置完毕，我们可以为项目添加代码了。\n\n### 83.8 初始化 Billing Client\n\n编辑 `MainActivity.java`\
  \ 文件并进行以下更改以开始实现应用内购买功能：\n\n```java\nimport androidx.annotation.NonNull;\nimport\
  \ android.util.Log;\nimport com.android.billingclient.api.*;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ BillingClient billingClient;\n    private ProductDetails productDetails;\n   \
  \ private Purchase purchase;\n    static final String TAG = \"InAppPurchaseTag\"\
  ;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ billingSetup();\n    }\n\n    private void billingSetup() {\n        billingClient\
  \ = BillingClient.newBuilder(this)\n                    .setListener(purchasesUpdatedListener)\n\
  \                    .enablePendingPurchases()\n                    .build();\n\
  \        billingClient.startConnection(new BillingClientStateListener() {\n    \
  \        @Override\n            public void onBillingFinished(@NonNull BillingResult\
  \ billingResult) {\n                if (billingResult.getResponseCode() == BillingClient.ResponseCode.OK)\
  \ {\n                    Log.i(TAG, \"OnSetupFinish connected\");\n            \
  \        queryProduct();\n                } else {\n                    Log.i(TAG,\
  \ \"OnSetupFinish failed\");\n                }\n            }\n            @Override\n\
  \            public void onBillingServiceDisconnected() {\n                Log.i(TAG,\
  \ \"OnSetupFinish connection lost\");\n            }\n        });\n    }\n}\n```\n\
  \n当应用启动时，`onCreate()` 方法现在将调用 `billingSetup()`，该方法反过来创建一个新的 billing client 实例并尝试连接到\
  \ Google Play Billing Library。连接尝试完成后，将调用 `onBillingFinished()` 监听器并输出指示连接成功或失败的\
  \ Logcat 消息。最后，我们还实现了 `onBillingServiceDisconnected()` 回调，如果 Google Play Billing\
  \ 连接丢失，该回调将被调用。\n\n如果连接成功，则会调用 `queryProduct()`。必须添加此方法以及分配给 billing client 的 `purchasesUpdatedListener`。\n\
  \n### 83.9 查询商品\n\n为了确保商品可以购买，我们需要创建一个 `QueryProductDetailsParams` 实例，并配置在 Play\
  \ Console 中指定的商品 ID，然后将其传递给 billing client 的 `queryProductDetailsAsync()` 方法。这将要求我们添加\
  \ `onProductDetails()` 回调方法，在该方法检查产品是否存在、提取产品名称并在状态 `TextView` 上显示它。现在我们已获得商品详情，还可以安全地启用购买按钮。在\
  \ `MainActivity` 文件中，添加 `queryProduct()` 方法，其内容如下：\n\n```java\nimport com.google.common.collect.ImmutableList;\n\
  import java.util.List;\n\nprivate void queryProduct() {\n    QueryProductDetailsParams\
  \ queryProductDetailsParams =\n        QueryProductDetailsParams.newBuilder()\n\
  \            .setProductList(\n                ImmutableList.of(\n             \
  \       QueryProductDetailsParams.Product.newBuilder()\n                       \
  \ .setProductId(\"one_button_click\")\n                        .setProductType(BillingClient.ProductType.APP)\n\
  \                        .build())\n            )\n            .build();\n    billingClient.queryProductDetailsAsync(\n\
  \        queryProductDetailsParams,\n        new ProductDetailsListener() {\n  \
  \          @Override\n            public void onProductDetails(@NonNull BillingResult\
  \ billingResult, @NonNull List<ProductDetails> productDetailsList) {\n         \
  \       if (!productDetailsList.isEmpty()) {\n                    productDetails\
  \ = productDetailsList.get(0);\n                    runOnUiThread(() -> {\n    \
  \                    binding.buyButton.setEnabled(true);\n                     \
  \   binding.statusText.setText(productDetails.getName());\n                    });\n\
  \                } else {\n                    Log.i(TAG, \"onProductDetails: No\
  \ products\");\n                }\n            }\n        });\n}\n```\n\n\n\n\n\
  此处使用的许多代码在上一章中应该已经很熟悉。监听器代码检查至少有一个产品符合查询条件。然后从第一个匹配的产品中提取 `ProductDetails` 对象，将其存储在\
  \ `productDetails` 变量中，并在 `TextView` 上显示产品名称属性。\n\n需要注意的一点是，当我们在状态 `TextView` 上显示产品名称时，是通过调用\
  \ `runOnUiThread()` 实现的。这是必要的，因为监听器运行在主线程之外，因此无法安全地直接更改用户界面。`runOnUiThread()` 方法提供了一种不使用协程的情况下在主线程执行代码的快速方便的方法。\n\
  \n### 83.10 启动购买流程\n\n当用户点击购买按钮时，将调用 `makePurchase()` 来启动购买过程。我们现在可以如下添加此方法：\n\n\
  ```java\npublic void makePurchase(View view) {\n    BillingFlowParams billingFlowParams\
  \ =\n        BillingFlowParams.newBuilder()\n            .setProductDetailsParamsList(\n\
  \                ImmutableList.of(\n                    BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \                        .setProductDetails(productDetails)\n                  \
  \      .build()\n                )\n            )\n            .build();\n    billingClient.launchBillingFlow(this,\
  \ billingFlowParams);\n}\n```\n\n### 83.11 处理购买更新\n\n购买过程的结果将通过在初始化阶段分配给 billing\
  \ client 的 `PurchaseUpdatedListener` 报告给应用。现在如下添加此处理器：\n\n```java\nprivate final\
  \ PurchasesUpdatedListener purchasesUpdatedListener = new PurchasesUpdatedListener()\
  \ {\n    @Override\n    public void onPurchasesUpdated(BillingResult billingResult,\n\
  \                                   List<Purchase> purchases) {\n        if (billingResult.getResponseCode()\
  \ ==\n                            BillingClient.BillingResponseCode.OK\n       \
  \             && purchases != null) {\n            for (Purchase purchase : purchases)\
  \ {\n                completePurchase(purchase);\n            }\n        } else\
  \ if (billingResult.getResponseCode() ==\n                    BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n            Log.i(TAG, \"onPurchasesUpdated: Purchase Canceled\");\n      \
  \  } else {\n            Log.i(TAG, \"onPurchasesUpdated: Error\");\n        }\n\
  \    }\n};\n```\n\n如果用户取消购买或发生其他错误，处理器将输出日志消息。然而，成功的购买会导致调用 `completePurchase()`\
  \ 方法，该方法会通过当前的 `Purchase` 对象。如下所示添加此方法：\n\n```java\nprivate void completePurchase(Purchase\
  \ item) {\n    purchase = item;\n    if (purchase.getPurchaseState() == Purchase.PurchaseState.PURCHASED)\n\
  \        runOnUiThread(() -> {\n            binding.consumeButton.setEnabled(true);\n\
  \            binding.statusText.setText(\"Purchase Complete\");\n        });\n}\n\
  ```\n\n此方法在验证产品已购买且支付仍处于待处理状态之前存储了购买信息。启用“消耗”按钮，并通知用户购买成功。购买按钮也会被禁用，以防止用户在消耗之前进行重复购买。\n\
  \n### 83.12 消耗产品\n\n现在用户可以点击“消耗”按钮了，下一步是确保产品已通过消耗，这样在购买另一个按钮之前只能执行一次点击。这要求我们现在编写\
  \ `consumePurchase()` 方法：\n\n```java\npublic void consumePurchase(View view) {\n\
  \    ConsumeParams consumeParams =\n        ConsumeParams.newBuilder()\n       \
  \     .setPurchaseToken(purchase.getPurchaseToken())\n            .build();\n  \
  \  ConsumeResponseListener listener = new ConsumeResponseListener() {\n        @Override\n\
  \        public void onConsumeResponse(BillingResult billingResult,\n          \
  \                             @NonNull String purchaseToken) {\n            if (billingResult.getResponseCode()\
  \ ==\n                            BillingClient.BillingResponseCode.OK) {\n    \
  \            runOnUiThread(() -> {\n                    binding.consumeButton.setEnabled(false);\n\
  \                    binding.statusText.setText(\"Purchase consumed\");\n      \
  \          });\n            }\n        }\n    };\n    billingClient.consumeAsync(consumeParams,\
  \ listener);\n}\n```\n\n此方法创建一个 `ConsumeParams` 实例并使用当前购买的购买令牌（从之前在 `completePurchase()`\
  \ 方法中保存的 `Purchase` 对象获取）对其配置。它被传递给 `consumePurchase()` 方法，该方法在协程中使用 `IO` 调度器启动。如果成功消耗产品，将在主线程中执行代码以禁用消耗按钮、启用购买按钮并更新状态文本。\n\
  \n### 83.13 恢复之前的购买\n\n到目前为止添加的代码允许我们可以在单个会话中购买并消耗产品。如果在购买并在消耗之前退出应用，那么当应用重启时，购买将会丢失。我们可以通过配置\
  \ `QueryPurchasesParams` 实例来搜索未消耗的应用内产品，并连同带有结果的监听器引用一起传递给 billing client 的 `queryPurchasesAsync()`\
  \ 方法来解决这个问题。如下在 `MainActivity.java` 文件中添加新函数和监听器：\n\n```java\nprivate void reloadPurchase()\
  \ {\n    QueryPurchasesParams queryPurchasesParams = QueryPurchasesParams.newBuilder()\n\
  \            .setProductType(BillingClient.ProductType.INAPP)\n            .build();\n\
  \    billingClient.queryPurchasesAsync(\n        queryPurchasesParams,\n       \
  \ purchasesListener\n    );\n}\n\nprivate final PurchasesResponseListener purchasesListener\
  \ = new PurchasesResponseListener() {\n    @Override\n    public void onPurchasesResponse(@NonNull\
  \ BillingResult billingResult,\n                                    @NonNull List<Purchase>\
  \ list) {\n        if (!list.isEmpty()) {\n            purchase = list.get(0);\n\
  \            binding.consumeButton.setEnabled(true);\n        } else {\n       \
  \     binding.consumeButton.setEnabled(false);\n        }\n    }\n};\n```\n\n如果传递给监听器的购买列表为空，则将列表中的第一个购买赋值给\
  \ `purchase` 变量并启用消耗按钮（在更完整的实现中，应该添加代码通过比较 ID 来检查这是一个正确的产品并处理多个购买返回）。如果没有找到购买，则禁用消耗按钮直到再次购买。剩下的是在计单设置期间调用我们新的\
  \ `reloadPurchase()` 方法：\n\n```java\nprivate void billingSetup() {\n    if (billingResult.getResponseCode()\
  \ ==\n                    BillingClient.BillingResponseCode.OK) {\n        Log.i(TAG,\
  \ \"OnBillingSetup connected\");\n        queryProduct();\n        reloadPurchase();\n\
  \    } else {\n        Log.i(TAG, \"OnBillingSetup failed\");\n    }\n}\n```\n\n\
  ### 83.14 测试应用\n\n在测试应用之前，我们需要将最新版本上传到 Play Console。由于我们已经上传了版本 1，我们需要在 `build.gradle.kts`\
  \ (Module: app) 文件中增加版本号：\n\n```kotlin\ndefaultConfig {\n    applicationId = \"\
  com.ebookfrenzy.inapppurchase\"\n    minSdk = 26\n    targetSdk = 32\n}\nversionCode\
  \ = 2\nversionName = \"2.0\"\n```\n\n\n\n同步构建配置，然后按照“创建、测试和上传 Android App Bundle”章节中的步骤生成新的应用\
  \ bundle，将其上传到内部测试轨道，并将其发布给测试人员。接下来，使用内部测试链接，在登录了其中一个测试账户的设备或模拟器上安装应用。要找到测试链接，请在\
  \ Google Play Console 中选择该应用，并在导航面板中选择`Internal testing`（内部测试）选项，然后选择`Testers`（测试人员）标签页，如图\
  \ 83-6 所示：\n\n![](img/in-app-purchase-testers.jpg)\n\n图 83-6\n\n滚动到屏幕上的“How testers\
  \ join your test”（测试人员如何加入您的测试）部分并点击`Copy link`（复制链接）：\n\n![](img/in-app-purchase-copy_link.jpg)\n\
  \n图 83-7\n\n在测试设备或模拟器上打开`Chrome` 浏览器，输入测试链接，并按照指令从 Play Store 安装应用。应用启动后，经过短暂延迟，它应该会在`TextView`\
  \ 上显示产品名称。点击购买按钮将开始购买流程，如图 83-8 所示：\n\n![](img/in_app_billing_test_purchase.jpg)\n\
  \n图 83-8\n\n点击购买按钮使用测试卡完成购买，并等待`Consume Purchase`（消费购买）按钮启用。在点击此按钮之前，尝试再次购买该产品，并验证无法再次购买，因为你已经拥有了该产品。\n\
  \n点击`Consume Purchase` 按钮并等待`TextView` 上出现“Purchase consumed”（购买已消费）消息。产品被消费后，现在应该可以再次购买它。再次进行购买，然后终止并重启应用。应用应该能够找到之前的未消费购买记录，并启用消费按钮。\n\
  \n### 83.15 故障排除\n\n如果您在购买过程中遇到问题，请确保设备已通过 USB 线或 WiFi 连接到 `Android Studio`，并在 `Logcat`\
  \ 面板中选择它。在 `Logcat` 栏中输入 `InAppPurchaseTag` 并检查诊断输出，必要时在代码中添加额外的 `Log` 调用。关于失败的更多信息，一个实用的技巧是从\
  \ `BillingResult` 实例中访问调试消息，例如：\n\n```java\n} else if (billingResult.getResponseCode()\n\
  \              == BillingClient.BillingResponseCode.USER_CANCELED) {\n    Log.i(TAG,\
  \ \"onPurchasesUpdated: Purchase Canceled\");\n} else {\n    Log.i(TAG, billingResult.getDebugMessage());\n\
  }\n```\n\n注意，只要您保持模块级 `build.gradle.kts` 文件中的应用版本号不变，您现在应该就可以直接在设备或模拟器上运行修改后的应用版本，而无需重新打包并上传到控制台。\n\
  \n如果没有列出测试支付卡，请确保设备用户账户已添加到许可测试人员列表（license testers list）中。如果应用运行在物理设备上，请尝试在模拟器上运行。如果所有方法都失败，您可以输入有效的支付方式进行测试购买，然后通过从\
  \ Play Console 首页访问的`Order Management`（订单管理）屏幕退款。\n\n### 83.6 总结\n\n在本章节中，我们创建了一个演示如何在\
  \ Android 应用中添加应用内产品的项目。这包括在 Google Play Console 中创建产品，以及编写初始化并连接到计费客户端、查询可用产品、购买和消费产品的代码。我们还解释了如何使用\
  \ Play Console 添加许可测试人员，以便在测试期间在不花费资金的情况下进行购买。\n\n## 84. 在 Android 上创建和管理溢出菜单\n\n\
  书中尚未涵盖的用户界面设计领域之一是 Android 应用程序内部的菜单概念。菜单提供了一种机制，可以在用户界面布局中存在的视图组件之外，为用户提供额外的选择。虽然\
  \ Android 应用开发者可以使用多种不同的菜单系统，但本章将重点关注更常用的溢出菜单（Overflow menu）。本章将涵盖如何通过 XML 手动创建菜单以及如何使用\
  \ `Android Studio Layout Editor` 工具可视化地创建菜单。\n\n### 84.1 溢出菜单\n\n溢出菜单（也称为选项菜单）是用户可以通过设备显示器访问的菜单，允许开发者包含包含应用程序界面界面之外的其他应用程序选项。溢出菜单的位置取决于设备上运行的\
  \ Android 版本。从 Android 4.0 及更高版本开始，溢出菜单按钮位于操作工具栏的右上角（图 84-1），由三个正方形组成的堆叠表示：\n\n\
  ![](img/as_menu_button.jpg)\n\n图 84-1\n\n### 84.2 创建溢出菜单\n\n菜单中的项可以在 XML 文件中声明，然后根据需要进行膨胀并显示给用户。这涉及使用\
  \ `<menu>` 元素，其中为每个菜单项包含一个 `<item>` 子元素。例如，下面的 XML 定义了一个由两个与颜色选择相关的菜单项组成的菜单：\n\n\
  ```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\".MainActivity\">\n    <item\n        android:id=\"@+id/menu_red\"\
  \n        android:title=\"@string/red\"/>\n    <item\n        android:priority=\"\
  1\"/>\n    <item\n        android:id=\"@+id/menu_green\"\n        android:title=\"\
  @string/green\"/>\n</menu>\n```\n\n在上面的 XML 中，`android:priority` 属性决定了菜单项在菜单显示时的出现顺序。另一方面，`app:showAsAction`\
  \ 属性控制项作为操作工具栏项出现的条件。例如，如果设置为 `ifRoom`，则当空间足够时，项将出现在工具栏中。图 84-2 显示了对项设置此属性的效果：\n\
  \n![](img/as_menu_ifroom.jpg)\n\n图 84-2\n\n应谨慎使用此属性，以避免工具栏过于拥挤。\n\n默认情况下，Android\
  \ Studio 在创建新项目时创建一个菜单 XML 文件。该文件位于 `app -> res -> menu` 文件夹，并包含一个名为“Settings”（设置）的单个菜单项：\n\
  \n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\n \
  \   xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\".MainActivity\">\n    <item\n        android:id=\"@+id/action_settings\"\
  \n        android:priority=\"100\"\n        app:showAsAction=\"never\"\n       \
  \ android:title=\"@string/action_settings\" />\n</menu>\n```\n\n此菜单已配置为当用户在用户界面上选择溢出菜单时显示，因此只需根据需要对其进行修改。\n\
  \n### 84.3 显示溢出菜单\n\n溢出菜单是通过重写相应 Activity 的 `onCreateOptionsMenu()` 方法并膨胀菜单 XML\
  \ 文件创建的。例如，以下代码创建了名为 `menu_main` 的菜单 XML 文件中的菜单：\n\n```java\n@Override\npublic boolean\
  \ onCreateOptionsMenu(Menu menu) {\n    getMenuInflater().inflate(R.menu.menu_main,\
  \ menu);\n    return true;\n}\n```\n\n与菜单 XML 文件一样，Android Studio 在新创建 Android 应用项目的主\
  \ Activity 中已经重写了此方法。如果 Activity 中不需要溢出菜单，请删除或注释掉该方法。\n\n### 84.4 响应菜单项选择\n\n\n\n\
  \n\n一旦实现了菜单，问题就随之而来：应用程序如何在用户选择菜单项时接收通知？Activity 接收菜单选择通知唯一需要的就是重写 `onOptionsItemSelected()`\
  \ 方法。传递给此方法的参数是所选菜单项的引用。随后，可以在该项上调用 `getItemId()` 方法来获取 ID，该 ID 进而可以用来识别选中了哪一个项。例如：\n\
  \n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem item) {\n  \
  \  if (id == R.id.menu_red) {\n        // 选中了红色项\n    } else if (id == R.id.menu_green)\
  \ {\n        // 选中了绿色项\n    } else {\n        return super.onOptionsItemSelected(item);\n\
  \    }\n    return(true);\n}\n```\n\n## 84.5 创建可检查项组\n\n除了配置独立的菜单项外，还可以创建菜单项组。这在创建可检查菜单项时特别有用，因为在任何时候，你从多个选项中只能选择一个。通过将菜单项封装在\
  \ `<group>` 标签中，可以将它们分配到一个组。使用 `android:checkableBehavior` 属性将组声明为可检查，将其值设置为 `single`、`all`\
  \ 或 `none`。以下 XML 声明两个菜单项组成一个组，在任何给定时间只能选择其中一个：\n\n```xml\n<menu xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <group android:checkableBehavior=\"single\">\n        <item\n           \
  \ android:id=\"@+id/menu_red\"\n            android:title=\"@string/red_string\"\
  />\n        <item\n            android:id=\"@+id/menu_green\"\n            android:title=\"\
  @string/green_string\"/>\n    </group>\n</menu>\n```\n\n当菜单组被配置为可检查时，菜单中的项旁边会出现一个小圆圈，如图图\
  \ 84-3 所示。需要注意的是，该指示器的设置和取消设置不会自动发生。因此，检查和取消勾选菜单项是应用程序的责任。\n\n![](img/as_menu_checkable.jpg)\n\
  图 84-3\n\n继续本章之前使用的颜色示例，其实现方式如下：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem\
  \ item) {\n    if (id == R.id.menu_red) {\n        item.setChecked(!item.isChecked())\n\
  \        mainLayout.setBackgroundColor(android.graphics.Color.RED);\n    } else\
  \ if (id == R.id.menu_green) {\n        item.setChecked(!item.isChecked());\n  \
  \      mainLayout.setBackgroundColor(android.graphics.Color.GREEN);\n    } else\
  \ {\n        return super.onOptionsItemSelected(item);\n    }\n    return(true);\n\
  }\n```\n\n## 84.6 菜单与 Android Studio 菜单编辑器\n\nAndroid Studio 允许通过简单将菜单资源文件加载到菜单编辑器工具中、从调板中拖放菜单元素并设置属性，来视觉化设计菜单。这极大地简化了菜单设计过程，但重要的是，仍然需要在\
  \ `onOptionsItemSelected()` 方法中编写代码来实现菜单行为。\n\n要视觉化设计菜单，请找到菜单资源文件并双击它将其加载到菜单编辑器工具中。例如，图\
  \ 84-4 显示了在设计模式下加载到菜单编辑器的基础 Activity 菜单资源文件：\n\n![](img/as_menu_editor.jpg)\n图 84-4\n\
  \n调板 (A) 包含可以添加到设计区域 (C) 菜单中的项。组件树 (B) 是识别菜单层级结构的有用工具。属性面板 (D) 包含了当前选中项的一部分常用属性。\n\
  \n通过将对象拖放到设计区域，可以向菜单添加新元素。在与布局编辑器一起工作时，有时将项拖到树上会更简单。尽管菜单编辑器提供了一种视觉化方法，但底层的菜单仍然以\
  \ XML 格式存储，可以进行手动查看和编辑。\n\n### 84.7 创建项目\n\n要查看菜单的运行情况，点击 `New Project` 按钮并选择 `Basic\
  \ Activity` 模板。指定包名 `com.ebookrenzy.menueample` 和 API 级别为 `26` (Oreo)。\n\n### 84.8\
  \ 设计菜单\n\n在 Project 工具中，导航到 `app` -> `res` -> `menu.xml` 并双击它将其加载到菜单编辑器。切换到 Design\
  \ 模式并删除默认项。\n\n从调板中拖入一个 `<group>` 到布局画布上。虽然组已经添加，但请参考组件树并将 `checkable` 属性设置为 `single`，以便在任何时候只能选择一个菜单项。\n\
  \n接下来，从调板将 `<item>` 元素拖到组中。选择第一个项并使用属性面板将标题更改为 \"Red\"，ID 改为 `menu_red`。对剩余菜单项重复这些步骤，将标题设置为\
  \ \"Green\" 和 \"Blue\"，并设置相应的 ID `menu_green`、`menu_yellow` 和 `menu_blue`。\n\n完成这些步骤后，菜单布局应与图\
  \ 84-10 所示。将布局编辑器工具切换到 代码模式并检查菜单的 XML 表示，它应该与以下匹配：\n\n```xml\n<menu xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    tools:context=\"com.ebookrenzy.menueample.MainActivity\"\
  >\n    <group android:checkableBehavior=\"single\">\n        <item android:title=\"\
  @string/red_string\" android:id=\"@+id/menu_red\"/>\n        <item android:title=\"\
  @string/green_string\" android:id=\"@+id/menu_green\"/>\n        <item android:title=\"\
  @string/yellow_string\" android:id=\"@+id/menu_yellow\"/>\n        <item android:title=\"\
  @string/blue_string\" android:id=\"@+id/menu_blue\"/>\n    </group>\n</menu>\n```\n\
  \n\n\n\n\n## 84.9 修改 `onOptionsItemSelected()` 方法\n\n当从菜单中选择项目时，应用程序 activity 中重写的\
  \ `onOptionsItemSelected()` 方法会被调用。该方法的作用是识别选择了哪一个项目，并将布局视图的背景颜色更改为相应的颜色。找到并双击 `app`\
  \ -> `java` -> `com.ebookfrenzy.menuexample` -> `MainActivity` 文件，并按所示修改该方法：\n\n\
  ```java\npackage com.ebookfrenzy.menuexample;\n\n.\n\n.\n\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  \npublic class MainActivity extends AppCompatActivity {\n.\n.\n    public boolean\
  \ onOptionsItemSelected(MenuItem item) {\n        int id = item.getItemId();\n \
  \       ConstraintLayout mainLayout =\n                findViewById(R.id.layoutView);\n\
  \n        if (id == R.id.menu_red) {\n            item.setChecked(!item.isChecked());\n\
  \            mainLayout.setBackgroundColor(android.graphics.Color.RED);\n      \
  \  } else if (id == R.id.menu_green) {\n            item.setChecked(!item.isChecked());\n\
  \            mainLayout.setBackgroundColor(android.graphics.Color.GREEN);\n    \
  \    } else if (id == R.id.menu_yellow) {\n            item.setChecked(!item.isChecked());\n\
  \            mainLayout.setBackgroundColor(android.graphics.Color.YELLOW);\n   \
  \     } else if (id == R.id.menu_blue) {\n            item.setChecked(!item.isChecked());\n\
  \            mainLayout.setBackgroundColor(android.graphics.Color.BLUE);\n     \
  \   } else {\n            return super.onOptionsItemSelected(item);\n        }\n\
  \        return(true);\n    }\n.\n.\n```\n\n### 84.10 测试应用程序\n\n在模拟器或物理 Android\
  \ 设备上构建并运行该应用程序。使用溢出菜单（overflow menu）选择菜单项目，并验证布局背景颜色是否发生了相应的变化。请注意，当前选中的颜色将作为菜单中的选中项显示：\n\
  \n![](img/as_menu_running.jpg)\n\n图 84-11\n\n### 84.11 总结\n\nAndroid 溢出菜单可以通过运行中应用屏幕顶部操作工具栏（actions\
  \ toolbar）的最右侧访问。该菜单为应用程序向用户提供额外选项提供了位置。\n\n菜单的结构最易在 XML 文件中定义，而应用程序 activity 通过重写和实现\
  \ `onOptionsItemSelected()` 方法来接收菜单项选择的通知。\n\n## 85 使用 Material Design 3 主题\n\n\
  Android 应用程序的外观旨在符合 Material Design 定义的一系列指南。Google 开发 Material Design 是为了在不同应用程序之间提供设计的一致性，同时允许应用开发者在颜色、排版和形状选择方面包含自己的品牌标识（这一概念被称为\
  \ Material 主题，Material theming）。除了设计指南外，Material Design 还包含了一套用于设计用户界面布局的 UI 组件，其中许多我们在本书书中都使用过。\n\
  \n本章将概述主题化在 Android Studio 项目中如何工作，并探索如何修改为新创建的项目提供的默认设计配置以满足你的品牌需求。\n\n### 85.1\
  \ Material Design 2 与 Material Design 3\n\n在开始之前，重要的是 Google 正在从 Material Design\
  \ 2 过渡到 Material Design 3，并且 Android Studio Hedgehog 项目默认使用 Material Design 3。Material\
  \ Design 3 为 Material You 提供了基础，这是 Android 12 中引入的一项功能，允许应用程序自动调整主题元素，以适应用户在设备上配置的偏好。例如，Material\
  \ Design 3 提供的动态颜色支持允许应用使用的颜色自动适应以匹配用户的壁纸选择。\n\n### 85.2 理解 Material Design 主题\n\
  \n我们知道 Android 应用的用户界面是通过组装布局、文本字段和按钮等组件创建的。除非我们专门在 XML 布局资源文件中重写颜色属性或通过编写代码，否则这些组件将使用默认颜色显示。\n\
  \n### 85.3 Material Design 3 主题\n\n在探索 Material Design 3 之前，我们必须考虑在 Android Studio\
  \ 中如何使用它。主题声明为 `AndroidManifest.xml` 文件中的属性，例如：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    \n    <application\n        android:theme=\"@style/Theme.MyApp\"\n      \
  \  android:supportsRtl=\"true\">\n        ...\n    </application>\n</manifest>\n\
  ```\n\n如前所述，主题包含位于 `values` 文件夹下的 `themes.xml` 文件中。这些文件定义了设备处于亮色或深色（夜间）模式时的颜色调色板。注意每个文件中的样式名称必须与\
  \ `AndroidManifest.xml` 中引用的名称匹配，例如：\n\n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <!-- 基础应用主题。 -->\n    <style name=\"Base.Theme.MyApp\" parent=\"Theme.Material3.DayNight.NoActionBar\"\
  >\n        <!-- 在此处自定义你的亮色主题。\n        <item name=\"colorPrimary\">@color/my_light_primary</item>\n\
  \    </style>\n\n    <style name=\"Theme.MyApp\" parent=\"Base.Theme.MyApp\" />\n\
  </resources>\n```\n\n这些颜色槽（也称为颜色属性）被 Material 组件用于在屏幕上渲染时设置颜色。例如，`colorPrimary`\
  \ 颜色槽被用作 Material Button 组件的背景颜色。\n\nMD3 中的颜色槽分组为 Primary（主）、Secondary（次要）、Tertiary（三级）、Error（错误）、Background（背景）和\
  \ Surface（表面）。这些槽被进一步划分为由基础颜色和“on”基础颜色组成的对。这通常对应于 Material 组件的背景颜色和前景颜色。\n\n用于着色的特定分组在不同组件之间会有差异。例如，Material\
  \ Button 组件将使用 `colorPrimary` 基础颜色作为背景颜色，使用 `colorOnPrimary` 作为其内容（即它显示的文本或图标）。相反，FloatingActionButton\
  \ 组件使用 `colorPrimaryContainer` 作为背景颜色，使用 `colorOnPrimaryContainer` 作为前景。特定组件类型所需的正确分组通常可以通过更改主题文件中的颜色设置并查看布局编辑器中的渲染结果快速识别。\n\
  \n假设我们需要将 `colorPrimary` 改为红色。我们通过在 `colors.xml` 文件中为红色添加新条目，然后将其分配给 `themes.xml`\
  \ 文件中的 `colorPrimary` 槽来实现。因此，MD 主题夜间模式下的 `colorPrimary` 槽如下：\n\n```xml\n<resources\
  \ xmlns:tools=\"http://schemas.android.com/tools\">\n    <!-- 基础应用主题。 -->\n    <style\
  \ name=\"Base.Theme.MyApp\" parent=\"Theme.Material3.DayNight.NoActionBar\">\n```\n\
  \n\n\n\n\n```xml\n<resources>\n    <item name=\"colorPrimary\">@color/my_bright_primary</item>\n\
  </style>\n\n<style name=\"Theme.MyDemoApp\" parent=\"Base.Theme.MyDemoApp\" />\n\
  </resources>\n```\n\n该颜色随后在 `colors.xml` 文件中声明：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<resources>\n    <color name=\"my_bright_primary\">#FC0505</color>\n\
  </resources>\n```\n\n### 85.4 构建自定义主题\n\n如我们所见，实现主题的编码工作相对简单。然而，困难之处通常是选择互补色来构建主题。幸运的是，Google\
  \ 开发了一个工具，可以轻松地为你的应用程序设计自定义颜色主题。该工具被称为 `Material Theme Builder`（Material 主题构建器），可以在此处访问：\n\
  \n[`m3.material.io/theme-builder#/dynamiccustom`](https://m3.material.io/theme-builder#/dynamiccustom)\n\
  \n在自定义屏幕（图 85-2）上，通过点击颜色圆显示颜色选择对话框，为主色键值 (A) 进行颜色选择。一旦选择了颜色，预览 (B) 将发生更改，以反映适用于所有\
  \ MD3 颜色槽的推荐颜色，并附带示例应用程序界面和控件。此外，你可以通过点击相应的颜色圆显示颜色选择对话框，来覆盖二级（Secondary）、三级（Tertiary）和中性（Neutral）槽的生成的颜色。\n\
  \n标记为 B 的区域显示了示例应用程序界面、亮色和深色配色方案图表以及更新以预览你的颜色选择的控件。由于面板比典型的浏览器窗口长，你必须向下滚动以查看所有信息。\n\
  \n要将主题整合到你的设计中，点击 `Export`（导出）按钮 (C) 并选择 `Android View (XML)` 选项。下载后，可以使用 `colors.xml`\
  \ 和 `themes.xml` 文件替换项目中的现有文件。注意，两个导出的 `themes.xml` 文件中的主题名称必须更改以匹配你的项目。\n\n![](img/theme_builder_custom.jpg)\n\
  \n图 85-2\n\n### 85.5 总结\n\nMaterial Design 提供了定义 Android 应用程序外观的指南和组件。通过设计指定显示应用程序时所用颜色、字体和形状的主题，可以为应用程序应用个性化品牌。Google\
  \ 最近引入了 Material Design 3，它取代了 Material Design 2 并支持 Material You 的新功能，包括动态颜色。Google\
  \ 还提供了 `Material Theme Builder` 供你设计自己的自己的主题，这减轻了选择互补主题颜色的任务。一旦使用此工具设计了主题，就可以导出相应的文件并在\
  \ Android Studio 项目中使用。\n\n# 86. Material Design 3 主题与动态颜色教程\n\n本章将向你展示如何使用 `Material\
  \ Theme Builder` 工具创建一个新的 Material Design 3 主题，并将其集成到 Android Studio 项目中。教程还将演示如何为应用程序添加支持并测试动态主题颜色支持。\n\
  \n## 86.1 创建 ThemeDemo 项目\n\n从欢迎屏幕上选择 `New Project`（新建项目）选项，在生成的新项目对话框中，在点击 `Next`（下一步）按钮之前，选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name`（名称）字段中输入 `ThemeDemo`，并指定 `com.ebookfrenzy.themedemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26: Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单改为 `Java`。\n\n### 86.2 设计用户界面\n\n主 Activity 将包含一个简单的布局，其中一些用户界面组件将使我们能够看到在本章之后执行的主题工作的效果。有关\
  \ MD3 组件的信息，请参考以下网页：\n\n[`material.io/blog/migrating-material-3`](https://material.io/blog/migrating-material-3)\n\
  \n布局将在 `activity_main.xml` 文件中设计，该文件目前包含单个 `Text` 视图。在布局编辑器中打开此文件，删除 `Text` 视图，关闭\
  \ `Autoconnect`（自动连接）模式（在 图 86-1 中标记为 A），并点击按钮清除布局中的所有约束 (B)。\n\n![](img/as_theme_demo_layout_buttons.jpg)\n\
  \n图 86-1\n\n从 `Palette`（调色板）的 `Buttons` 部分将 `Chip`、`CheckBox`、`Switch` 和 `Button`\
  \ 视图拖到布局画布上。接下来，将 `FloatingActionButton` 拖到布局画布上将其放置在 `Button` 组件下方。当提示选择显示在 `FloatingActionButton`\
  \ 上的图标时，从资源工具窗口选择 `ic_lock_power_off` 图标，如 图 86-2 所示：\n\n![](img/as_theme_demo_layout_pick_icon.jpg)\n\
  \n图 86-2\n\n将 `Chip` 控件的 `text` 属性更改为“This is my chip”，并将 `chipIcon` 属性设置为 `@android:drawable/ic_btn_speak_now$，以便布局看起来像\
  \ 图 86-3 左侧所示：\n\n![](img/as_theme_demo_ui.jpg)\n\n图 86-3\n\n要设置约束，选择所有组件，右键点击并选择\
  \ `Chains -> Vertical`（垂直链）。重复此步骤，这次选择 `Chains -> Horizontal`（水平链）。\n\n### 86.3\
  \ 构建新主题\n\n首先打开浏览器窗口并导航到以下 URL 以访问工具：\n\n[`m3.material.io/theme-builder#/custom`](https://m3.material.io/theme-builder#/custom)\n\
  \n一旦加载构建器，选择屏幕顶部的 `wallpaper` 后的 `Custom` 按钮，然后点击 `Core` 部分中的主颜色圆以显示颜色选择器。从颜色选择器中选择任何颜色作为你主题的基础：\n\
  \n![](img/theme_builder_color_dialog.jpg)\n\n图 86-4\n\n在 `Your Theme` 面板中查看配色方案，并在对颜色槽满意。完成后，点击右上角的\
  \ `Export` 按钮并选择 `Android View (XML)` 选项。在提示时，将文件保存到计算机上的合适位置。主题将保存为名为 `material-theme.zip`\
  \ 的压缩文件。\n\n使用适用于操作系统的工具解压主题，它应包含以下文件夹和文件：\n\n- `values/colors.xml` - 颜色定义。\n- `values/themes.xml`\
  \ - 亮色模式主题。\n- `values-night/themes.xml` - 深色模式主题。\n\n## 86.4 将主题添加到项目\n\n在将新主题添加到项目之前，我们需要先删除旧的主题文件。如果\
  \ `Project` 工具窗口处于 `Project Files` 模式，这将更容易。要切换模式，使用下所示工具窗口顶部的菜单并选择 `Project Files`\
  \ 选项：\n\n![](img/as_project_files.jpg)\n\n图 86-5\n\n在选择 `Project Files` 模式后，导航到\
  \ `app -> src -> main -> res -> values` 文件夹，选择并删除 `colors.xml` 和 `themes.xml` 文件。还要删除\
  \ `values-night` 文件夹中的 `themes.xml` 文件。\n\n打开操作系统的文件导航工具，找到新 `material-theme` 中\
  \ `values` 文件夹下的 `colors.xml` 和 `themes.xml` 文件，将其并粘贴到 `Project` 工具窗口中的 `values`\
  \ 文件夹。重复此步骤复制 `values-night` 文件夹中的 `themes.xml` 文件，这次将其粘贴到 `values-night` 文件夹中。\n\
  \n将 `Project` 工具窗口切换回 `Android` 模式，此时值资源文件部分应匹配 图 86-6：\n\n\n\n\n\n![](img/as_theme_new_theme_files.jpg)\n\
  \n图 86-6\n\n接下来，修改 `themes.xml` 文件以匹配当前项目如下：\n\n```xml\n<resources>\n    <style\
  \ name=\"Base.Theme.ThemeDemo\" parent=\"Theme.Material3.Light.NoActionBar\">\n\
  \        <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n    \
  \    <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n    </style>\n\
  \    <style name=\"Theme.ThemeDemo\" parent=\"Base.Theme.ThemeDemo\" />\n</resources>\n\
  ```\n\n重复这些步骤，对 `themes.xml (night)` 文件进行相同的修改。\n\n返回 `activity_main.xml` 文件或重新运行应用，以确认用户界面是否已使用自定义主题颜色渲染。\n\
  \n## 86.5 启用动态颜色支持\n\n为了测试动态颜色，应用需要在运行 Android 12 或更高版本的设备或模拟器上运行，并配置了正确的壁纸设置。在设备或模拟器上，启动\
  \ `Settings`（设置）应用，并从选项列表中选择 `Wallpaper & style`（壁纸与样式）。在壁纸设置屏幕上，点击更改壁纸选项（在图 86-7\
  \ 中标记为 A），并选择一张与你的主题颜色显著不同的壁纸图像。一旦选择，将该壁纸分配到主屏幕。\n\n返回 `Wallpaper & styles` 屏幕，在从颜色方案按钮（C）选择选项之前，确保已选中\
  \ `Wallpaper colors`（壁纸颜色）选项（B）。每点击一个选项，壁纸示例都会发生变化以反映选择：\n\n![](img/compose_theme_wallpaper_and_styles.jpg)\n\
  \n图 86-7\n\n要启用动态颜色，我们需要调用 `DynamicColors` 类的 `applyToActivitiesIfAvailable()` 方法。为了为整个应用启用动态颜色支持，需要在自定义\
  \ `Application` 实例的 `onCreate()` 方法中调用它。首先，在项目的 `app -> java -> com.ebookfrenzy.themedemo`\
  \ 下添加一个名为 `ThemeDemoApplication.java` 的新 Java 类文件，并对其进行修改如下如下：\n\n```java\npackage\
  \ com.ebookfrenzy.themedemo;\n\nimport android.app.Application;\nimport com.google.android.material.color.DynamicColors;\n\
  \npublic class ThemeDemoApplication extends Application {\n    @Override\n    public\
  \ void onCreate() {\n        super.onCreate();\n        DynamicColors.applyToActivitiesIfAvailable(this);\n\
  \    }\n}\n```\n\n创建自定义的 `Application` 类后，我们必须配置项目使用该类而不是默认的 `Application` 实例。要此操作，编辑\
  \ `AndroidManifest.xml` 文件并添加一个引用新类的 `android:name` 元素：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.themedemo\">\n    <application\n        android:name=\"\
  .ThemeDemoApplication\"\n        android:allowBackup=\"true\">\n```\n\n构建并运行应用，注意布局使用了与壁纸颜色匹配的主题。将\
  \ `ThemeDemo` 应用置于后台，返回 `Wallpaper & styles` 设置屏幕，并选择不同的壁纸。再次将 `ThemeDemo` 应用带到前台。此时，它将已经动态适应以匹配新的壁纸。\n\
  \n## 86.6 预览动态颜色\n\n动态颜色行为也可以在 Android Studio 布局编辑器中预览。要尝试此操作，打开 `activity_main.xml`\
  \ 文件，点击主题菜单，并选择 `More Themes`（更多主题）选项，如图 86-8 所示：\n\n![](img/as_layout_editor_themes_menu.jpg)\n\
  \n图 86-8\n\n接下来，使用主题选择对话框中的搜索字段列出动态主题：\n\n![](img/as_layout_editor_select_theme.jpg)\n\
  \n图 86-9\n\n在点击 `OK` 按钮之前，选择 `Material3.DynamicColors.DayNight` 主题。返回布局编辑器后，选择 `System\
  \ UI Mode`（系统 UI 模式）菜单，并如图 86-10 所示选择一个壁纸选项：\n\n![](img/as_layout_editor_dynamic_themes.jpg)\n\
  \n图 86-10\n\n一旦选了壁纸，布局中组件的颜色将随之改变。\n\n### 86.7 总结\n\n在本章中，我们使用 Material Theme Builder\
  \ 设计了一个新主题，并解释了将生成的主题文件集成到 Android Studio 项目中的步骤。最后，章节演示如何实现和使用 Material You 动态颜色功能。\n\
  \n## 87. Android Studio 中的 Gradle 概述\n\n到目前为止，人们一直认为 Android Studio 会采取必要的步骤来编译和运行所创建的应用项目。Android\
  \ Studio 一直通过一个名为 Gradle 的系统在后台实现这一点。\n\n现在是时候查看如何使用 Gradle 来编译和打包应用项目，并开始探索更高级的需求了。\n\
  \n### 87.1 Gradle 概述\n\nGradle 是一个自动化构建工具包，它允许通过一组构建文件来配置项目的构建方式。这包括定义项目将如何构建、需要满足哪些依赖项以及构建过程的最终结果是什么。\n\
  \n\n\n\n\nAndroid Studio 项目使用另一个名为 `Maven` 的项目管理工具来处理远程依赖。如果在 `Gradle` 构建文件中使用 `Maven`\
  \ 语法声明了远程依赖，则该依赖将自动从指定的仓库下载并包含在构建过程中。例如，下面的依赖声明会将 `AppCompat` 库从 `Google` 仓库添加到项目中：\n\
  \n```\nimplementation(\"androidx.appcompat:appcompat:1.6.1\")\n```\n\n### 87.2.3\
  \ 构建变体 (Build Variants)\n除了依赖之外，`Gradle` 还为 Android Studio 项目提供了构建变体支持。这允许从单个项目构建应用程序的多个变。Android\
  \ 运行在许多不同的设备上，涵盖了各种处理器类型和屏幕尺寸。为了尽可能针对广泛设备类型和尺寸，通常需要构建应用程序的多个变体（例如，一个适用于手机的用户界面，另一个适用于平板电脑屏幕）。通过使用\
  \ `Gradle`，这在 Android Studio 中是可以实现的。\n\n### 87.2.4 Manifest 条目 (Manifest Entries)\n\
  每个 Android Studio 项目都关联着一个 `AndroidManifest.xml` 文件，其中包含了应用程序的配置详情。在 `Gradle` 构建文件中可以指定多个\
  \ manifest 条目，这些条目在项目构建时会自动生成到 manifest 文件中。此功能补充了构建变体功能，允许为每个构建变体配置不同的应用程序版本号、应用\
  \ ID 和 SDK 版本信息等元素。**\n\n### 87.2.5 APK 签名 (APK Signing)\n章节“创建、测试和上传 Android App\
  \ Bundle” 涵盖了如何使用 Android Studio 环境创建带签名的发布版 APK 文件。也可以将通过 Android Studio 用户界面输入的签名信息包含在\
  \ `Gradle` 构建文件中，以便从命令行生成带签名的 APK 文件。\n\n### 87.2.6 ProGuard 支持\n`ProGuard` 是 Android\
  \ Studio 自带的一个工具，它可以优化、压缩和混淆 Java 字节码，使其更高效且更难被反向工程（反向工程是指通过分析编译后的 Java 字节码来识别应用程序逻辑的方法）。`Gradle`\
  \ 构建文件允许你控制在构建应用程序时是否对你的应用运行 `ProGuard`。\n\n## 87.3 属性与设置 Gradle 构建文件\ngradle 构建配置由配置、属性和设置文件组成。例如，`gradle.properties`\
  \ 文件主要包含与 Java 虚拟机 (`JVM`) 使用的命令行标志相关的晦涩设置、项目是否使用 `AndroidX` 库以及对 Kotlin 编码风格的支持。作为典型用户，你可能不需要更改此文件中的任何设置。\n\
  \n相反，`settings.gradle.kts` 文件定义了当构建系统需要下载和安装构建项目所需的任何额外库和插件时，应该搜索哪些在线仓库。一个典型的 `settings.gradle.kts`\
  \ 文件如下：\n\n```kotlin\npluginManagement {\n    repositories {\n        google()\n\
  \        mavenCentral()\n        gradlePluginPortal()\n    }\n}\n\ndependencyResolutionManagement\
  \ {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories\
  \ {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name = \"\
  ThemeDemo\"\n\ninclude(\":app\")\n```\n\n与 `gradle.properties` 文件一样，可能不需要对此文件进行更改。\n\
  \n## 87.4 顶层 Gradle 构建文件\n一个完整的 Android Studio 项目包含构建 Android 应用程序所需的所有内容，由模块、库、manifest\
  \ 文件和 `Gradle` 构建文件组成。\n\n每个项目包含一个顶层 `Gradle` 构建文件。该文件列为 `build.gradle.kts` (Project:\
  \ `<project name>`)，可以在项目工具窗口中找到，如图 87-1 所示：\n\n![](img/as_app_gradle_file.jpg)\n\
  \n图 87-1\n\n默认情况下，顶层 `Gradle` 构建文件的内容如下：\n\n```kotlin\n// 顶层构建文件，可以在其中添加适用于所有子项目/模块的通用配置选项。\n\
  \nplugins {\n    id(\"com.android.application\") version \"8.2.0\" apply false\n\
  }\n```\n\n目前，该文件仅声明了将使用 `jcenter` 仓库获取远程库，并且构建依赖于 `Gradle` 的 Android 插件。在大多数情况下，对此构建文件进行任何更改都是没有必要的。\n\
  \n## 87.5 模块级 Gradle 构建文件\nAndroid Studio 应用程序项目由一个或多个模块组成。例如，名为 `GradleDemo` 的假设应用程序项目，它包含名为\
  \ `Module1` 和 `Module2` 的模块。在这种情况下，每个模块都需要自己的 `Gradle` 构建文件。在项目结构方面，它们的位置如下：\n\n\
  - `Module1/build.gradle.kts`\n- `Module2/build.gradle.kts`\n\n默认情况下，`Module1` 的\
  \ `build.gradle.kts` 文件将类似于列表所示：\n\n```kotlin\nplugins {\n    id(\"com.android.application\"\
  )\n}\n\nandroid {\n    namespace = \"com.example.gradlesample\"\n    compileSdk\
  \ = 34\n    defaultConfig {\n        applicationId = \"com.example.gradlesample\"\
  \n        minSdk = 26\n        targetSdk = 34\n        versionCode = 1\n       \
  \ versionName = \"1.0\"\n        testInstrumentationRunner = \"androidx.test.AndroidJUnitRunner\"\
  \n    }\n    buildTypes {\n        release {\n            isMinifyEnabled = false\n\
  \            proguardFiles(\n                ProguardFile(\"proguard-android-optimize.txt\"\
  ),\n                \"proguard-rules.pro\"\n            )\n        }\n    }\n  \
  \  compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_8\n     \
  \   targetCompatibility = JavaVersion.VERSION_8\n    }\n}\n\ndependencies {\n  \
  \  implementation(\"androidx.appcompat:appcompat:1.6.1\")\n    implementation(\"\
  com.google.android.material:material:10.0\")\n    implementation(\"androidx.constraintlayout:constraintlayout:2.1.4\"\
  )\n    testImplementation(\"junit:junit:4.13.2\")\n    androidTestImplementation(\"\
  androidx.test.ext:junit:1.1.5\")\n    androidTestImplementation(\"androidx.test.espresso:espresso-core:3.5.1\"\
  )\n}\n```\n\n从文件内容可见，构建文件首先声明使用插件：\n\n```kotlin\nplugins {\n    id(\"com.android.application\"\
  )\n}\n```\n\n文件的 `android` 部分声明了项目命名空间，然后说明了构建 `Module1` 时使用的 SDK 版本：\n\n```kotlin\n\
  android {\n    namespace = \"com.example.gradlesample\"\n    compileSdk = 34\n```\n\
  \n`defaultConfig` 部分声明的项定义了构建期间生成到模块 `AndroidManifest.xml` 中的元素。这些设置可以在构建文件中修改，它们取自最初创建模块时在\
  \ Android Studio 中输入的设置：\n\n```kotlin\ndefaultConfig {\n    applicationId = \"com.example.gradlesample\"\
  \n    minSdk = 26\n    targetSdk = 34\n    versionCode = 1\n    versionName = \"\
  1.0\"\n    testInstrumentationRunner = \"androidx.test.AndroidJUnitRunner\"\n}\n\
  ```\n\n`buildTypes` 部分包含了在构建应用程序发布版 APK 时是否以及如何运行 `ProGuard` 的指令：\n\n```kotlin\n\
  buildTypes {\n    release {\n        isMinifyEnabled = false\n        proguardFiles(\n\
  \            ProguardFile(\"proguard-android-optimize.txt\"),\n            \"proguard-rules.pro\"\
  \n        )\n    }\n}\n```\n\n\n\n\n按照当前的配置，构建 `Module1` 时不会运行 ProGuard。要启用 ProGuard，必须将\
  \ `minify` 项从 `false` 更改为 `true`。可以在项目的模块目录中找到 `proguard-rules.pro` 文件。对该文件所做的更改将覆盖\
  \ `proguard-android.txt` 文件中的默认设置，该文件位于 Android SDK 安装目录下的 `sdk/tools/proguard`\
  \ 路径。\n\n由于此文件中没有声明调试 `buildType`，因此将使用默认设置（不带 ProGuard 构建，使用调试密钥签名，并启用调试符号）。\n\n\
  在模块构建文件中，还可能包含一个名为 `productFlavors` 的额外部分，以便能够创建多个构建变体。\n\n接下来，包含了一些指令，用于指定构建项目时使用的\
  \ Java 编译器版本：\n\n```\ncompileOptions {\n    sourceCompatibility JavaVersion.VERSION_1_8\n\
  \    targetCompatibility JavaVersion.VERSION_1_8\n}\n```\n\n最后，`dependencies` 部分列出了模块所依赖的任何本地和远程依赖。上述示例文件中的依赖行指定了需要从\
  \ Android 仓库中包含的 Android 库：\n\n```\ndependencies {\n    implementation(\"androidx.appcompat:appcompat:1.6.1\"\
  )\n    implementation(\"com.google.android.material:material:1.10.0\")\n}\n```\n\
  \n注意，依赖声明包含了版本号，用于指示应该包含哪个版本的库。\n\n## 87.6 在构建文件中配置签名设置\n\n本书本书的“创建、测试和上传 Android\
  \ App Bundle”章节涵盖了使用 Android Studio 用户界面设置密钥和生成签名发布版 APK 文件的步骤。这些设置也可以在 `build.gradle.kts`\
  \ 文件的 `signingConfigs` 部分中进行声明。例如：\n\n```kotlin\ndefaultConfig {\n}\nsigningConfigs\
  \ {\n    release {\n        storeFile file(\"keystore.release\")\n        storePassword\
  \ \"your keystore password here\"\n        keyAlias \"your key alias here\"\n  \
  \      keyPassword \"your key password here\"\n    }\n}\nbuildTypes {\n}\n```\n\n\
  上述示例将密钥密码信息直接嵌入到构建文件中。这种方法的另一种替代方案是从系统环境变量中提取这些值：\n\n```kotlin\nsigningConfigs {\n\
  \    release {\n        storeFile file(\"keystore.release\")\n        storePassword\
  \ System.getenv(\"KEYSTOREPASSWD\")\n        keyAlias \"your key alias here\"\n\
  \        keyPassword System.getenv(\"KEYPASSWD\")\n    }\n}\n```\n\n另一种方法是配置构建文件，使得\
  \ `Gradle` 在构建过程中提示输入密码：\n\n```kotlin\nsigningConfigs {\n    release {\n       \
  \ storeFile file(\"keystore.release\")\n        storePassword System.console().readLine(\"\
  \\nEnter Keystore password: \")\n        keyAlias \"your key alias here\"\n    \
