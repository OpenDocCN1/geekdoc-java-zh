  \ `TextView` 和 `EditText` 组件中，这确认状态已成功保存并恢复。\n\n## 37.5 总结\n\n一个良好的应用程序在从后台返回前台时，应该始终向用户呈现相同的状态，无论操作系统在此期间是否终止了包含该应用的进程。在处理\
  \ `ViewModels` 时，可以通过利用 `ViewModel Saved State` 模块来实现这一点。这涉及修改 `ViewModel` 构造函数以接受一个\
  \ `SavedStateHandle` 实例，该实例反过来可以通过一系列方法调用来保存和恢复数据值。当创建 `ViewModel` 实例时，必须传递一个 `SavedStateViewModelFactory`\
  \ 实例。一旦实现了这些步骤，应用在后台被终止时将自动保存和恢复状态。\n\n## 38. 与 Android 生命周期周期感知组件一起工作\n\n前面的章节、“理解\
  \ Android 应用和 Activity 生命周期”](#Activity_Lifecycle.xhtml__idTextAnchor296) 描述了如何使用生命周期方法来跟踪\
  \ UI 控制器（如 activity 或 fragment）内的生命周期状态变化。这些方法的主要问题之一是它们将处理生命周期变化的负担交给了 UI 控制器。从表面上看，这似乎是逻辑方法，因为\
  \ UI 控制器终究是经历状态更改的对象。然而，事实是，受状态更改影响的代码通常位于应用中的其他类中。这导致 UI 控制器中出现了复杂的代码，这些需要根据生命周期状态的变化来管理和操作其他对象。在遵循\
  \ Android 架构准则时，最好避免这种情况。\n\n一种更清晰、更符合逻辑的方法是让应用中的对象能够观察其他对象的生命周期状态，并负责根据变化采取任何必要的行动。例如，负责跟踪用户位置的类可以观察\
  \ UI 控制器的生命周期状态，并在控制器进入暂停状态时挂起位置更新。当控制器进入恢复状态时，重新开始跟踪。这通过 Android 架构组件包含的 `Lifecycle`\
  \ 包所提供的类和接口得以实现。\n\n本章将引入使能够将生命周期感知构建到 Android 应用中的术语和关键组件。\n\n### 38.1 生命周期感知\n\
  \n如果一个对象能够检测并响应应用内其他对象生命周期状态的变化，则称该对象是生命周期感知的。某些 Android 组件（`LiveData` 是一个很好的例子）已经是生命周期感知的。通过在类中实现\
  \ `LifecycleObserver` 接口，也可以将任何类配置为生命周期感知。\n\n### 38.2 生命周期所有者\n\n生命周期感知组件只能观察作为生命所有者（lifecycle\
  \ owners）的对象的状态。生命所有者实现 `LifecycleOwner` 接口，并分配一个伴侣 `Lifecycle` 对象，负责存储组件的当前状态并向生命周期观察者提供状态信息。大多数标准的\
  \ Android Framework 组件（如 activity 和 fragment 类）都是生命周期所有者。自定义类也可以使用 `LifecycleRegistry`\
  \ 类并实现 `LifecycleObserver` 接口来配置为生命周期所有者。例如：\n\n```java\npublic class SampleOwner\
  \ implements LifecycleOwner {\n    private LifecycleRegistry lifecycleRegistry;\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   super.onCreate(savedInstanceState);\n        lifecycleRegistry = new LifecycleRegistry(this);\n\
  \    }\n    @NonNull\n    @Override\n    public Lifecycle getLifecycle() {\n   \
  \     return lifecycleRegistry;\n    }\n}\n```\n\n除非生命所有者是另一个生命周期感知组件的子类，否则该类需要通过调用\
  \ `LifecycleRegistry` 的方法来触发生命周期状态变化。`markState()` 方法可用于通过新的状态值触发生命周期状态传递：\n\n```java\n\
  public void resuming() {\n    lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n\
  }\n```\n\n上述调用也将导致调用相应的事件处理程序。或者，可以调用 `LifecycleRegistry handleLifecycleEvent()`\
  \ 方法并传递要触发的生命周期事件（这将同样导致生命周期状态的变化）。例如：\n\n`lifecycleRegistry.handleLifecycleEvent(Lifecycle.ON_START)`\n\
  \n### 38.3 生命周期观察者\n\n为了观察生命所有者的状态，生命周期感知组件必须实现 `DefaultLifecycleObserver` 接口，并覆盖其需要观察的任何生命周期更改的方法。\n\
  \n```java\npublic class SampleObserver implements DefaultLifecycleObserver\n```\n\
  \n然后创建此观察类的实例并将其添加到 `Lifecycle` 对象维护的观察者列表中。\n\n`getLifecycle().addObserver(new\
  \ SampleObserver())`\n\n当观察者不再需要跟踪生命周期状态时，可以从 `Lifecycle` 对象中移除。\n\n图 38-1 展示了提供生命周期感知的关键元素之间的关系：\n\
  \n![](img/lifecycle_component.jpg)\n\n图 38-1\n\n### 3.4 生命周期状态与事件\n\n当生命所有者的状态更改时，分配的\
  \ `Lifecycle` 对象将更新为新状态。在任何时刻，生命所有者都处于以下五个状态之一：\n\n- `Lifecycle.State.INITIALIZED`\n\
  - `Lifecycle.State.CREATED`\n- `Lifecycle.State.STARTED`\n- `Lifecycle.State.RESUMED`\n\
  - `Lifecycle.State.DESTROYED`\n\n当组件转换不同状态时，`Lifecycle` 对象将对任何添加的观察者触发事件。生命周期观察者内部可以覆盖以下事件方法：\n\
  \n- `onCreate()`\n- `onResume()`\n- `onPause()`\n- `onStop()`\n- `onStart()`\n-\
  \ `onDestroy()`\n\n例如，以下代码覆盖了 `DefaultLifecycleObserver onResume()` 方法：\n\n```java\n\
  @Override\npublic void onResume(@NonNull LifecycleOwner owner) {\n    //  Resume\
  \ 状态事件执行任务\n}\n```\n\n图 38-2 中的流程图说明了生命所有者的状态更改序列，以及在每个状态转换之间将在观察者上触发的生命周期事件：\n\n\
  ![](img/android_lifecycle_states_diagram.jpg)\n\n图 38-2\n\n\n\n\n\n### 38.5 总结\n\
  \n本章介绍了生命周期感知的基础知识，以及 Android Jetpack 包含的 Android Lifecycle 包中的类和接口。该包包含了若干用于创建生命周期所有者（lifecycle\
  \ owners）、观察者和生命周期感知组件的类和接口。生命周期所有者被分配了一个 `Lifecycle` 对象，该对象维护所有者的状态记录以及订阅的观察者列表。当所有者的状态发生变化时，观察者通过生命周期事件方法接收通知以响应这些变化。\n\
  \n下一章将创建一个 Android Studio 项目，演示如何使用和创建生命周期感知组件，包括生命周期观察者和所有者的创建，以及对生命周期状态更改和事件的处理。\n\
  \n# 39. Android Jetpack 生命周期周期感知教程\n\n上一节节提供了生命周期感知的概述，并概述了在 Android 应用项目中实现此点的关键类和接口。本章将在此知识基础的基础上，通过构建一个\
  \ Android Studio 项目来突出生命周期感知的实际应用。\n\n### 39.1 创建示例生命周期项目\n\n从欢迎界面选择 `New Project`\
  \ 快速启动选项，在生成的新项目对话框中，在点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入\
  \ `LifecycleDemo`，并指定 `com.ebookfrenzy.lifecycledemo` 为包名。在点击 `Finish` 按钮之前，将 `Minimum\
  \ API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为 `Java`。\n\n### 39.2 创建生命周期观察者\n\
  \n如前所述，activity 和 fragment 已经实现了 `LifecycleOwner` 接口，并准备好被其他对象观察。为了在实践中看到这一点，教程的下一步是向项目中添加一个新类，该类能够观察\
  \ `MainActivity` 实例。\n\n要添加新类，在 Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.lifecycledemo`，并在生成的菜单中选择\
  \ `New` -> `Java Class...`。在 New Class 对话框中，将类命名为 `DemoObserver` 并按键盘 Return 键创建\
  \ `DemoObserver.java` 文件。新文件应自动在编辑器中打开，其内容如下：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\
  \npublic class DemoObserver {\n\n}\n```\n\n留在编辑器中，修改类文件以声明它将实现 `DefaultLifecycleObserver`\
  \ 接口：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport androidx.lifecycle.DefaultLifecycleObserver;\n\
  \npublic class DemoObserver implements DefaultLifecycleObserver {\n\n}\n```\n\n\
  下一步是重写 `DefaultLifecycleObserver` 类的生命周期方法。对于此示例，所有事件将被处理，每个事件都会向 Logcat 面板输出消息显示事件类型。按照以下列表更新观察者类：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport android.util.Log;\n\
  import androidx.annotation.NonNull;\nimport androidx.lifecycle.LifecycleOwner;\n\
  \n...\n\npublic class DemoObserver implements DefaultLifecycleObserver {\n    private\
  \ String LOG_TAG = \"DemoObserver\";\n\n    @Override\n    public void onCreate(@NonNull\
  \ LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onCreate\");\n    }\n\n    @Override\n\
  \    public void onResume(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG,\
  \ \"onResume\");\n    }\n\n    @Override\n    public void onPause(@NonNull LifecycleOwner\
  \ owner) {\n        Log.i(LOG_TAG, \"onPause\");\n    }\n\n    @Override\n    public\
  \ void onStart(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onStart\"\
  );\n    }\n\n    @Override\n    public void onStop(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onStop\");\n    }\n\n    @Override\n    public void\
  \ onDestroy(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onDestroy\"\
  );\n    }\n}\n```\n\n完成 `DemoObserver` 类后，下一步是将其作为观察者添加到 `MainActivity` 类。\n\n###\
  \ 39.3 添加观察者\n\n观察者通过调用所有者 `Lifecycle` 对象的 `addObserver()` 方法添加到生命周期所有者，该对象的引用是通过调用\
  \ `getLifecycle()` 方法获得的。编辑 `MainActivity.java` 类文件并编辑 `onCreate()` 方法以添加观察者：\n\n\
  ```java\n...\nimport com.ebookfrenzy.lifecycledemo.DemoObserver;\n...\n\n@Override\n\
  public void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    getLifecycle().addObserver(new\
  \ DemoObserver());\n}\n```\n\n创建观察者并添加到生命周期后，应用已准备就绪。\n\n### 39.4 测试观察者\n\n由于 `DemoObserver`\
  \ 类向 Logcat 输出诊断信息，如果配置了过滤器仅显示 `DemoObserver`，则将更容易看到输出。使用先述说明的步骤，显示 Logcat 面板并输入以下键：`tag:DemoObserver`。\n\
  \n成功启动应用后，输出应指示：\n`onCreate`\n`onStart`\n`onResume`\n\n在应用仍运行时，执行设备旋转以触发 activity\
  \ 的销毁和重建，生成以下输出：\n`onPause`\n`onStop`\n`onDestroy`\n`onCreate`\n`onStart`\n`onResume`\n\
  \n在移动到本章的下一节之前，花时间将输出与图 38 中的流程图进行对比。\n\n### 39.5 创建生命周期所有者\n\n本章的最后一个任务是创建一个自定义生命周期所有者，并演示如何触发事件和修改生命周期状态。通过\
  \ Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.lifecycledemo` 并选择 `New`\
  \ -> `Java Class...` 来添加新类。在按 Return 键之前将类命名为 `DemoOwner`。将 `DemoOwner.java` 文件加载到编辑器后，将其修改如下：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport androidx.lifecycle.Lifecycle;\n\
  import androidx.lifecycle.LifecycleOwner;\nimport androidx.lifecycle.LifecycleRegistry;\n\
  import androidx.annotation.NonNull;\n\npublic class DemoOwner implements LifecycleOwner\
  \ {\n\n}\n```\n\n该类需要一个带有自身引用的 `LifecycleRegistry` 实例，以及一个返回该 `LifecycleRegistry`\
  \ 实例的 `getLifecycle()` 方法。声明变量来存储 `LifecycleRegistry` 引用并使用构造函数初始化它：\n\n```java\n\
  public class DemoOwner implements LifecycleOwner {\n    private final LifecycleRegistry\
  \ lifecycleRegistry;\n\n    public DemoOwner() {\n        lifecycleRegistry = new\
  \ LifecycleRegistry(this);\n    }\n\n    @NonNull\n    @Override\n    public Lifecycle\
  \ getLifecycle() {\n        return lifecycleRegistry;\n    }\n}\n```\n\n接下来，类必须通知注册表生命周期状态更改。这可以通过使用\
  \ `LifecycleRegistry` 对象的 `markState()` 方法标记状态，或者使用 `handleLifecycleEvent()` 方法触发生命周期事件来实现。自定义类内部什么构成状态更改取决于类的目的。对于此示例，我们将添加一些在调用时触发生命周期事件的方法：\n\
  \n```java\npublic void startOwner() {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  }\n\npublic void stopOwner() {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  }\n```\n\n\n\n\n\n`DemoOwner` 类中的最后一次更改是添加 `DemoObserver` 类作为观察者。此调用通过在类构造函数中添加以下内容来实现：\n\
  \n```java\npublic DemoOwner() {\n    lifecycleRegistry = new LifecycleRegistry(this);\n\
  \    getLifecycle().addObserver(new DemoObserver());\n}\n```\n\n将 `MainActivity.java`\
  \ 文件加载到代码编辑器，找到 `onCreate()` 方法，并添加代码来创建 `DemoOwner` 类的实例并调用 `startOwner()` 和 `stopOwner()`\
  \ 方法。请注意，添加 `DemoObserver` 作为观察者的调用已被移除。虽然一个观察者可以与多个所有者配合，但在本例中移除是为了避免在 `Logcat`\
  \ 工具窗口中出现重复且混乱的输出：\n\n```java\nimport com.ebookfrenzy.lifecycledemo.DemoOwner;\n\
  \nprivate DemoOwner demoOwner;\n\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    demoOwner = new DemoOwner();\n    demoOwner.startOwner();\n\
  \    demoOwner.stopOwner();\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n### 39.6 测试自定义生命周期所有者\n\n最后一次构建并运行应用，参考 `Logcat` 工具窗口，并确认观察者按照以下顺序检测到创建、开始和停止生命周期事件：\n\
  \n- `onCreate`\n- `onStart`\n- `onStop`\n\n注意，尽管没有在 `DemoOwner` 类中添加代码来手动执行此操作，“已创建”状态的变化也被触发了。这些变化是在所有者实例首次创建以及处理\
  \ `ON_STOP` 事件时自动触发的。\n\n### 39.7 总结\n\n本章提供了在 Android 应用中实现生命周期感知的实用演示，包括创建生命周期观察者以及设计和实现一个基础生命周期所有者类。\n\
  \n# 40. 导航架构组件概述\n\n如今很少有 Android 应用仅由单个屏幕组成。事实上，大多数应用由多个屏幕组成，用户通过屏幕手势、按钮点击和菜单选择在这些屏幕之间进行导航。在\
  \ Android Jetpack 引入之前，在应用内实现导航很大程度上是一个手动编码过程，没有简单的方法来查看和组织可能复杂的导航路径。然而，随着 Android\
  \ 导航架构组件的引入以及 Android Studio 中对导航图的支持，这种情况得到了显著的改善。\n\n### 40.1 理解导航\n\n每个应用都有一个主屏幕，它在应用启动且任何启动屏显示后出现（启动屏是应用在加载时临时显示的应用品牌屏幕）。用户通常会从此主屏幕执行任务，从而导致其他屏幕的出现。这些屏幕通常以应用内其他\
  \ Activity 和 Fragment 的形式存在。例如，消息应用可能有一个列出当前消息的主屏幕，用户可以从该屏幕导航到另一个屏幕以访问联系人列表或设置屏幕。联系人列表屏幕可能会允许用户导航到其他屏幕，在这些屏幕中可以添加新用户或更新现有联系人。从图形上看，应用的导航图可以如图\
  \ 40-1 所示：\n\n![](img/jetpack_navigation_graph_diagram.jpg)\n\n图 40-1\n\n构成应用的每个屏幕（包括主屏幕）被称为“目的地”（destination），通常是一个\
  \ Fragment 或 Activity。Android 导航架构使用导航栈来跟踪用户在应用内目的地之间的路径。当应用首次启动时，主屏幕是第一个被放入栈中的目的地，并成为当前目的地。当用户导航到另一个目的地时，该屏幕将成为当前目的地，并推入栈中主目的地之上。随着用户导航到其他屏幕，它们也会被推入栈中。例如，图\
  \ 40-2 显示了假设的消息应用在用户启动并导航到“添加联系人”屏幕后导航栈的当前状态：\n\n![](img/jetpack_navigation_stack_diagram.jpg)\n\
  \n图 40-2\n\n当用户使用系统返回键在屏幕间返回导航时，每个目的地都会从栈中弹出，直到主屏幕再次成为栈上的唯一目的地。在图 40-3 中，用户从“添加联系人”屏幕返回，将其从栈中弹出并使“联系人列表”屏幕成为当前目的地：\n\
  \n![](img/jetpack_navigation_stack_pop_diagram.jpg)\n\n图 40-3\n\n在目的地之间导航和管理导航栈的所有工作都由导航控制器处理，由\
  \ `NavController` 类表示。\n\n使用导航架构组件为 Android 项目添加导航是一个直接的过程，涉及导航宿（navigation host）、导航图（navigation\
  \ graph）、导航动作（navigation actions）以及用于获取导航控制器实例交互的少量代码。\n\n### 40.2 声明导航宿\n\n导航宿是一个特殊的\
  \ Fragment（`NavHostFragment`），嵌入到 Activity 的用户界面布局中，作为用户将导航的目的地的占位符。例如，图 40-4 显示了一个典型的\
  \ Activity 屏幕，并突出了由导航宿 Fragment 表示的区域：\n\n![](img/jetpack_navigation_navhost.jpg)\n\
  \n图 40-4\n\n`NavHostFragment` 可以放入 Android Studio 编辑器中的 Activity 布局中，方法是从调色板中拖放实例，或者通过手动编辑\
  \ XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<FrameLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\" >\n\n    <androidx.fragment.app.FragmentContainerView\n\
  \        android:id=\"@+id/demo_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n\n</FrameLayout>\n```\n\n上述导航宿元素的要点是 `name` 属性对 `NavHostFragment` 的引用、将 `defaultNavHost`\
  \ 设置为 `true` 以及将包含导航图的文件分配给 `navGraph` 属性。\n\n当 Activity 启动时，此导航宿将被图中指定的首页目的地替换。当用户在应用屏幕间导航时，宿\
  \ Fragment 将替换为对应目的地的 Fragment。\n\n### 40.3 导航图\n\n导航图是一个包含应用导航中所有目的地的 XML 文件。除了这些目的地，文件还包含了定义目的地之间导航的动作，以及从一个目的地向另一个目的地传递数据的可选参数。Android\
  \ Studio 包含一个导航图编辑器，可以使用可视化方式或通过手动编辑 XML 来设计图并实现动作。图 40-5 显示了设计模式下的 Android Studio\
  \ 导航图编辑器：\n\n![](img/as_4.1_navigation_graph_editor.jpg)\n\n图 40-5\n\n\n\n\n目的地列表\
  \ (A) 列出了图中的所有目的地。从列表中选择一个目的地将定位并选中图中对应的目的地（这对于在大型图表中定位特定目的地特别有用）。导航图面板 (B) 包含每个目的地的对话框，每个对话框代表一个用户界面布局。在示例中，此图包含两个名为\
  \ `mainFragment` 和 `secondFragment` 的目的地。目的地之间的箭头 (C) 代表导航动作连接。通过将鼠标指针悬停在起点的边缘上直到出现圆圈，然后从圆圈点击并拖动到目的地即可添加动作。属性面板\
  \ (D) 允许查看和修改当前选中目的地或动作连接的属性。在上面的图中，显示了动作的属性。通过点击标记为 E 的按钮并从菜单中选择选项可以添加新目的地。可用选项包括添加现有的\
  \ fragment 或 activity 作为目的地，或者创建新的空白 fragment 目的地。组件树面板 (F) 提供了导航图的分级概览。\n\n通过将编辑器切换到代码模式，可以查看和修改导航图的底层\
  \ XML。接下来的 XML 列表表示了上方 图 40-5 中所示目的地和动作连接的导航图：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"fragment_main\"\n        tools:layout=\"@layout/fragment_main\"\
  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ >\n    </fragment>\n</navigation>\n```\n\n导航图也可以拆分为多个文件，以改进组织结构并促进重用。当以这种方式构建时，嵌套图会被嵌入到根图中。要创建嵌套图，按住\
  \ Shift 点击要嵌套的目的，在第一个目的地上点击右键并选择 `Move to Nested Graph -> New Graph（移动到嵌套图 -> 新图）菜单选项。嵌套图将作为图中的新节点出现。双击嵌套图节点可将图文件加载到编辑器中以访问嵌套图。\n\
  \n## 40.4 访问导航控制器\n\n从一个目的地导航到另一个目的地通常是为了响应应用内的事件，例如按钮点击或菜单选择。在触发导航动作之前，代码必须先获取导航控制器实例的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，可以使用以下代码访问 activity\
  \ 的导航控制器。注意，为了使代码工作，activity 必须包含一个导航宿 fragment：\n\n```java\nNavController controller\
  \ = Navigation.findNavController(activity, R.id.demo_nav_host_fragment);\n```\n\n\
  在这种情况下，向方法传递了 activity 的引用以及嵌入在 activity 布局中的 `NavHostFragment` 的 id。\n\n或者，也可以通过将视图传递给方法来识别与任何视图关联的导航控制器：\n\
  \n```java\nNavController controller = Navigation.findNavController(binding.button);\n\
  ```\n\n最后一个选项是通过调用 `NavHostFragment` 类的 `findNavController()` 方法并传递 fragment 的引用来查找\
  \ fragment 的导航控制器：\n\n```java\nNavController controller = NavHostFragment.findNavController(fragment);\n\
  ```\n\n### 40.5 触发导航动作\n\n一旦找到导航控制器，通过调用控制器的 `navigate()` 方法并传递要执行动作的资源 id 即可触发导航动作。例如：\n\
  \n```java\ncontroller.navigate(R.id.goToContactsList);\n```\n\n当选中动作连接时，动作的 id 在导航图编辑器的属性面板中定义。\n\
  \n### 40.6 传递参数\n\n在导航动作期间，可以使用导航图文件中定义的参数将数据从一个目的地传递到另一个目的地。参数由名称、类型和可选的默认值组成，可以在\
  \ XML 中手动添加，也可以在选中目的地时使用属性面板添加。例如，在 图 40-6 中，声明了一个名为 `contactsCount` 的整数参数，默认值为\
  \ 0：\n\n![](img/as_argument_example.jpg) 图 40-6 添加添加后，参数被放置在接收目的地的 XML 元素中，例如：\n\
  \n```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\n    android:name=\"\
  com.ebookfrenzy.navigationdemo.SecondFragment\"\n    android:label=\"fragment_second\"\
  \n    tools:layout=\"@layout/fragment_second\" >\n    <argument\n        android:name=\"\
  contactsCount\"\n        android:defaultValue=\"0\"\n        app:type=\"integer\"\
  \ />\n</fragment>\n```\n\n导航组件提供了两种在目的地之间传递数据的技术。一种方法涉及将数据放入 `Bundle` 对象中，并在动作期间将其传递给目的地，然后在该处进行解包并提取参数。\n\
  \n这种特定方法的主要缺点是它不是类型安全的。换句话说，如果接收目的地对参数的处理类型与其声明的类型不同（例如将字符串视为整数），这种错误将不会被编译器捕获，并会在运行时引起问题。\n\
  \n更好的选择（也是本书中使用的）是 `safargs`。`safargs` 是一个 Android Gradle 构建系统插件，它会自动生成特殊类，允许以类型安全的方式传递参数。下一章将描述并演示\
  \ `safargs` 参数传递方法。\n\n### 40.7 总结\n\nAndroid 应用用户界面背景下的导航是指用户在不同屏幕之间来回移动的能力。曾经实现非常耗时且难以组织，现在\
  \ Android Studio 和导航组件使得在 Android 项目中实现和管理导航变得更加容易。\n\n\n\n\n上一章描述了 Android Jetpack\
  \ Navigation 组件以及它如何与 Android Studio 的导航图表功能集成，从而为实现 Android 应用屏幕之间的导航提供了一种简单的方法。在本章中，将创建一个新的\
  \ Android Studio 项目，该项目将使用这些导航功能来实现一个包含多个屏幕的示例应用。除了演示 Android Studio 导航图表编辑器的用法外，示例项目还将实现使用类型安全参数在源屏幕和目标屏幕之间传递数据。\n\
  \n## 41.1 创建 NavigationDemo 项目\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，在点击 `Next`\
  \ 按钮之前，选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `NavigationDemo`，并指定 `com.ebookfrenzy.navigationdemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n### 41.2 在构建配置中添加导航\n\n新的 `Empty Views Activity` 项目默认不会在构建文件中包含\
  \ Navigation 组件库。因此，在执行任何其他任务之前，第一步是修改 `app` 级 `build.gradle.kts` 文件。在 Project 工具窗口中（Gradle\
  \ Scripts -> build.gradle.kts (Module :app)`）找到该文件，双击将其加载到代码编辑器，并修改 `dependencies`\
  \ 部分以添加导航库。此外，借此机会启用此模块的视图绑定（view binding）：\n\n```kotlin\nandroid {\n    buildFeatures\
  \ {\n        viewBinding = true\n    }\n}\n\ndependencies {\n    implementation\
  \ (\"androidx.navigation:navigation-fragment:2.7.5\")\n    implementation (\"androidx.navigation:navigation-ui:2.7.5\"\
  )\n}\n```\n\n注意，自本书出版以来，可能发布了这些库的新版本。在文件中添加导航依赖后，点击 `Sync Now` 链接重新同步项目的构建配置。\n\n\
  ### 41.3 创建导航图资源文件\n\n在构建配置中添加导航库后，现在可以向项目中添加导航图资源文件。正如 #导航架构组件概述 中所示，这是一个 XML 文件，包含了用户可以进行导航的\
  \ fragment 和 activity，以及执行转换的动作和在目标之间传递的任何数据。\n\n在 Project 工具窗口中，找到 `res` 文件夹（app\
  \ -> res），右键点击它，选择 `New ->Android Resource File` 菜单选项：\n\n![](img/as_new_resource_file_menu.jpg)\n\
  图 41-1\n\n选择菜单项后，将出现 `New Resource File` 对话框。在该框中，将文件命名为 `navigation_graph`，并将 `Resource\
  \ type` 菜单更改为 `Navigation`（如 #图 41-2\n图 41-2\n\n导航图资源文件添加到项目后，它将出现在主面板中，准备添加新目标。将编辑器切换到\
  \ `Code` 模式，并在添加任何目标之前检查图表的 XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\n \
  \   xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/navigation_graph\"\
  >\n</navigation>\n```\n\n在编辑器内切换回 `Design` 模式，注意 `Destinations` 面板的 `Host` 部分表明项目中未检测到导航主机\
  \ fragment（navigation host fragments）：\n\n![](img/as_navigation_hosts_no_fragments.jpg)\n\
  图 41-3\n\n在向导航图添加任何目标之前，下一步是向项目添加一个导航主机 fragment。\n\n### 41.4 声明导航主机\n\n对于此项目，导航主机\
  \ fragment 将包含在主 activity 的用户界面布局中。首先，在 Project 工具窗口中找到主活动布局文件（app -> res -> layout\
  \ -> activity_main.xml），将其加载到布局编辑器中，并删除默认的 `TextView` 组件。\n\n在布局编辑器处于 `Design` 模式时，从\
  \ `Palette` 的 `Containers` 部分拖入 `NavHostFragment` 元素，并放置到活动布局的容器区域，如 #图 41-4 中的箭头所示：\n\
  \n![](img/as_navigation_add_navhostfragment.jpg)\n图 41-4\n\n从弹出的 `Navigation Graphs`\
  \ 对话框中选择上一节创建的 `navigation_graph.xml` 文件，并点击 `OK` 按钮。\n\n在布局中选中新添加的 `NavHostFragment`\
  \ 实例，使用 `Attributes` 工具窗口将元素的 ID 更改为 `demo_nav_host_fragment`，然后点击 `Infer constraints`\
  \ 按钮。\n\n将布局编辑器切换到 `Code` 模式并检查 XML 文件。注意编辑器已正确配置了 `navigation graph` 属性以引用 `navigation_graph.xml`\
  \ 文件，且 `defaultNavHost` 属性已设置为 `true`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\nxmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/demo_nav_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"409dp\"\n        android:layout_height=\"729dp\"\
  \n        app:defaultNavHost=\"true\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        app:navGraph=\"\
  @navigation/navigation_graph\" />\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n返回 `navigation_graph.xml` 文件，确认已检测到 `NavHostFragment` 实例（可能需要关闭并重新打开文件）：\n\
  \n![](img/as_navigation_hosts_fragment.jpg)\n图 41-5\n\n### 41.5 添加导航目标\n\n留在导航图中，现在是添加第一个目标了。点击\
  \ #图 41-6\n图 41-6\n\n接下来，从菜单中选择 `Create new destination` 选项。在对话框中，选择 `Fragment (Blank)`\
  \ 模板，在点击 `Finish` 按钮之前将新 fragment 命名为 `FirstFragment`并将布局命名为 `fragment_first`。项目重新构建后，新\
  \ fragment 将作为目标出现在图中，如 #图 41-7\n图 41-7\n\n节点上方的小图标表示它是起始目标。这意味着当创建 `NavHostFragment`\
  \ 活动时，该目标将第一个显示。要将起始目标更改为另一个，请选择图中该节点并点击工具栏上的主按钮。\n\n通过将编辑器切换到 `Code` 模式来检查导航图的\
  \ XML 内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\
  \n    app:startDestination=\"@id/firstFragment\">\n</navigation>\n```\n\n\n\n\n\n\
  ```xml\n<fragment\n    android:id=\"@+id/firstFragment\"\n    android:name=\"com.ebookfrenzy.navigationdemo.FirstFragment\"\
  \n    android:label=\"fragment_first\"\n    tools:layout=\"@layout/fragment_first\"\
  \ />\n</navigation>\n```\n\n在执行任何导航之前，图中至少还需要另外一个目标。重复上述步骤，添加一个名为 `SecondFragment`\
  \ 且布局文件名为 `fragment_second` 的片段。新片段将作为图中的另一个目标出现，如图 41-8 所示：\n\n![](img/as_navigation_two_fragments.jpg)\n\
  \n图 41-8\n\n### 41.6 设计目标片段的布局\n\n在添加用于在目标之间进行导航的动作（actions）之前，现在是为图中的两个目标片段添加一些用户界面组件的好时机。首先，双击\
  \ `firstFragment` 目标，使 `fragment_first.xml` 文件加载到布局编辑器，然后选择并删除默认的 `TextView` 实例。在组件树（Component\
  \ Tree）面板中，右键点击 `FrameLayout` 条目并选择 `Convert from FrameLayout to ConstraintLayout`\
  \ 选项，在弹出的对话框中接受默认设置：\n\n![](img/as_navigation_convert_to_constraint_layout.jpg)\n\
  \n图 41-9\n\n使用属性（Attributes）工具窗口，将 `ConstraintLayout` 的 ID 更改为 `constraintLayout`，然后将\
  \ `Button` 和 `Plain Text EditText` 控件拖到布局中，使其看起来像下方图 41-10 所示：\n\n![](img/as_navigation_first_fragment_ui.jpg)\n\
  \n图 41-10\n\n一旦视图位置正确正确，点击工具栏上的 `Infer constraints`（推断约束）按钮，为布局添加任何缺失的约束。选择 `EditText`\
  \ 视图并使用属性工具窗口删除默认的“Name”文本，并将控件的 ID 更改为 `userText`。接下来，将按钮的文本属性更改为“Navigate”（导航），并将其提取为字符串资源。\n\
  \n返回 `navigation_graph.xml` 文件并双击 `secondFragment` 目标，将 `fragment_second.xml` 文件加载到布局编辑器。选择并删除默认的\
  \ `TextView` 实例，重复上述步骤将 `FrameLayout` 转换为 `ConstraintLayout`，并将 id 更改为 `constraintLayout2`。接下来，拖入一个新的\
  \ `TextView` 控件将其放置在布局中心，并点击 `Infer constraints` 按钮添加任何缺失的约束。选中新的 `TextView` 后，使用属性面板将\
  \ ID 更改为 `argText`。\n\n### 41.7 为导航图添加动作\n\n现在两个目标都已添加到图中，并且设计了相应的用户界面布局，项目需要一种方法让用户从第一个片段导航到第二个片段。这将通过向图中添加一个动作来实现，然后可以在应用代码中引用该动作。\n\
  \n要建立一个以第一个片段为起点、第二个片段为目的的动作连接，请打开导航图并将鼠标指针悬停在 `firstFragment` 目标右侧边缘的垂直中心，此时会出现一个圆圈，如图\
  \ 41-11 所示：\n\n![](img/as_navigation_first_fragment_selected.jpg)\n\n图 41-11\n\n\
  点击圆圈并将生成的线条拖到 `secondFragment` 目标：\n\n![](img/as_navigation_add_connection.jpg)\n\
  \n图 41-12\n\n释放线条以建立起点和目的地之间的动作连接，此时线条将变为箭头，如图 41-13 所示：\n\n![](img/as_navigation_connected.jpg)\n\
  \n图 41-13\n\n可以随时通过选中动作连接并按下键盘上的 Delete 键来删除它。选中箭头后，检查属性工具窗口中可用的属性并将 ID 更改为 `mainToSecond`。这是代码中引用该动作的\
  \ ID。将编辑器切换到代码模式，注意该动作现在包含在 XML 中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/firstFragment\">\n    <fragment\n        android:id=\"\
  @+id/firstFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.FirstFragment\"\
  \n        android:label=\"fragment_first\"\n        tools:layout=\"@layout/fragment_first\"\
  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ />\n</navigation>\n```\n\n### 41.8 实现 OnFragmentListener\n\n在添加触发动作的代码之前，`MainActivity`\
  \ 必须实现 `OnFragmentListener`。该接口是在创建片段类时生成的。为了符合该接口，活动需要一个名为 `onFragmentInteraction()`\
  \ 的方法来实现片段与活动之间的通信。编辑 `MainActivity.java` 文件，使其如下：\n\n```java\nimport android.net.Uri;\n\
  \npublic class MainActivity extends AppCompatActivity implements SecondFragment.OnFragmentListener\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    @Override\n    public void onFragmentInteraction(Uri uri) {\n    }\n\
  }\n```\n\n如果 Android Studio 报告 `OnFragmentListener` 未定义（某些版本会自动添加，其他则不会），请编辑 `SecondFragment.java`\
  \ 文件并添加以下内容：\n\n```java\nimport android.net.Uri;\n\npublic interface OnFragmentListener\
  \ {\n    // TODO: 更新参数类型和名称\n    void onFragmentInteraction(Uri uri);\n}\n```\n\n\
  ### 41.9 为片段添加视图支持\n\n由于我们需要访问布局中的某些视图，必须修改代码以启用视图绑定（view binding）。首先编辑 `FirstFragment.java`\
  \ 文件并进行以下更改：\n\n```java\nimport com.ebookfrenzy.navigationdemo.databinding.FragmentFirstBinding;\n\
  \npublic class FirstFragment extends Fragment {\n    private FragmentFirstBinding\
  \ binding;\n\n    @Nullable\n    @Override\n    public View onCreateView(@NonNull\
  \ LayoutInflater inflater, @Nullable ViewGroup container, @Nullable Bundle savedInstanceState)\
  \ {\n        return inflater.inflate(R.layout.fragment_first, container, false);\n\
  \        binding = FragmentFirstBinding.inflate(inflater, container, false);\n \
  \       return binding.getRoot();\n    }\n\n    @Override\n    public void onDestroyView()\
  \ {\n        super.onDestroyView();\n        binding = null;\n    }\n}\n```\n\n\
  对 `SecondFragment.java` 文件重复上述步骤，引用 `FragmentSecondBinding`。\n\n### 41.10 触发动作\n\
  \n现在动作已添加到导航图中，下一步是在第一个片段中添加一些代码，以便在点击 `Button` 控件时触发动作。找到 `FirstFragment.java`\
  \ 文件，将其加载到代码编辑器，并重写 `onViewCreated()` 方法以获取按钮实例的引用，并配置 `OnClickListener` 实例以便在用户点击按钮时调用：\n\
  \n```java\nimport androidx.annotation.NonNull;\nimport androidx.annotation.Nullable;\n\
  \nimport android.widget.Button;\n```\n\n\n\n\n\n```java\nimport androidx.navigation.Navigation;\n\
  \npublic class FirstFragment extends Fragment {\n\n    @Override\n    public void\
  \ onViewCreated(@NonNull View view,\n                             @Nullable Bundle\
  \ savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.button.setOnClickListener(new View.OnClickListener() {\n      \
  \      @Override\n            public void onClick(View view) {\n               \
  \ Navigation.findNavController(view).navigate(\n                        R.id.mainToSecond);\n\
  \            }\n        });\n    }\n}\n```\n\n上述代码获取了导航控制器（navigation controller）的引用，并在实例上调用了\
  \ `navigate()` 方法，将导航动作的资源 ID 作为参数传递。\n\n编译并运行应用，验证点击第一个片段（fragment）中的按钮会跳转到第二个片段。\n\
  \n作为设置监听器方法的替代方案，`Navigation` 类还包含一个名为 `createNavigateOnClickListener()` 的方法，它提供了一种更高效的方法来设置监听器并跳转到目的地。因此，可以使用以下单行代码启动跳转：\n\
  \n```java\nbinding.button.setOnClickListener(Navigation.createNavigateOnClickListener(\n\
  \        R.id.mainToSecond, null));\n```\n\n### 41.11 使用 Safeargs 传递数据\n\n下一个目标是将第一个片段中\
  \ `EditText` 视图输入的文本传递到第二个片段，并在第二个片段中在 `TextView` 控件上显示。如上一章所述，Android Navigation\
  \ 组件支持两种传递数据的方法。本章将使用类型安全的参数传递。\n\n使用 `safeargs` 的第一步是在 Gradle 构建配置中添加 `safeargs`\
  \ 插件。使用 Project（项目）工具窗口，找到并编辑项目层级的 `build.gradle.kts` 文件（Gradle Scripts -> `build.gradle.kts\
  \ (Project: NavigationDemo)`），按如下方式添加插件依赖（再次提醒，请现在可能有更更新的版本）：\n\n```kotlin\n// 顶层构建文件，您可以在其中添加对所有子项目/模块通用的配置选项。\n\
  \nbuildscript {\n    dependencies {\n        classpath(\"androidx.navigation:navigation-safe-args-gradle-plugin:2.7.5\"\
  )\n    }\n}\n\nplugins {\n}\n```\n\n接下来，编辑模块级的 `build.gradle.kts` 文件（Gradle Scripts\
  \ -> `build.gradle.kts (Module :app)`），按如下方式应用插件并重新同步项目：\n\n```kotlin\nplugins {\n\
  \    id(\"com.android.application\")\n    id (\"androidx.navigation.safeargs\")\n\
  }\n\nandroid {\n}\n```\n\n下一步是定义目的地接收的任何参数，在本例中，为第二个片段。编辑导航图，选择 `secondFragment`\
  \ 目的地，并在 Attributes（属性）工具窗口中找到 `Arguments` 部分。点击 `+` 按钮（在图 41-14 中突出显示）为目的地添加新参数：\n\
  \n![](img/as_navigation_add_arguments.jpg)\n\n图 41-14\n\n点击 `+` 按钮后，会弹出一个对话框，需要在其中输入参数名称、类型和默认值。将参数命名为\
  \ `message`，将类型设置为 `String`，在默认值字段中输入 `No Message`，并点击 `Add` 按钮：\n\n![](img/as_navigation_add_argument_dialog.jpg)\n\
  \n图 41-15\n\n新配置的参数将出现在 `navigation_graph.xml` 文件的 `secondFragment` 元素中，如下：\n\n\
  ```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  \ >\n    <argument\n        android:name=\"message\"\n        app:argType=\"string\"\
  \n        android.defaultValue=\"No Message\" />\n</fragment>\n```\n\n下一步是在 `FirstFragment.java`\
  \ 文件中添加代码，以从 `EditText` 视图中提取文本并在导航动作期间将其传递给第二个片段。这将涉及使用一些由 `safeargs` 插件自动生成的特殊导航类。目前，导航涉及\
  \ `FirstFragment` 类、`SecondFragment` 类、名为 `mainToSecond` 的导航动作以及名为 `message` 的参数。\n\
  \n当项目被构建时，`safeargs` 插件将生成以下额外的类，用于在导航期间传递和接收参数。\n\n-   `FirstFragmentDirections`\
  \ - 此类表示导航动作的起点（使用导航源类名并在末尾加上“Directions”来命名），并提供对动作对象的访问。\n-   `ActionMainToSecond`\
  \ - 表示执行跳转的动作的类（根据导航图文件中分配给动作的 ID 命名，前缀为“Action”）。\n-   `SecondFragmentArgs` - 用于在目的地访问从起点传递的参数的类（使用目的地的类名并在末尾加上“Args”来命名）。该类为每个参数包含一个\
  \ getter 方法。\n\n使用这些类，可以对 `FirstFragment.java` 中 `onViewCreated()` 方法内的 `OnClickListener`\
  \ 代码进行修改：\n\n```java\nbinding.button.setOnClickListener(view1 -> {\n    FirstFragmentDirections.MainToSecond\
  \ action = FirstFragmentDirections.mainToSecond();\n    action.setMessage(binding.userText.getText().toString());\n\
  \    Navigation.findNavController(view1).navigate(action);\n});\n```\n\n上述代码获取了动作对象的引用，使用\
  \ `setMessage()` 方法设置消息字符串，然后调用导航控制器的 `navigate()` 方法并传递动作对象。如果 Android Studio 报告\
  \ `FirstFragmentDirections` 未定义，使用 `Build -> Make Project` 选项重新构建。\n\n剩下的工作是修改 `SecondFragment.java`\
  \ 类文件，以便在执行跳转后接收参数并在 `TextView` 控件上显示它。在本例中，实现这些任务的代码将添加到 `onStart()` 生命周期方法中。编辑\
  \ `SecondFragment.java` 文件并添加该方法，其内容如下：\n\n```java\n@Override\npublic void onStart()\
  \ {\n    super.onStart();\n    SecondFragmentArgs args = SecondFragmentArgs.fromBundle(getArguments());\n\
  \    String message = args.getMessage();\n    binding.argText.setText(message);\n\
  }\n```\n\n上述方法首先获取 `TextView` 控件的引用。接下来，调用 `SecondFragmentArgs` 类的 `fromBundle()`\
  \ 方法提取从起点传递的 `SecondFragmentArgs` 对象。由于示例中的参数在 `navigation_graph.xml` 文件中命名为 `message`，因此对\
  \ `args` 对象调用相应的 `getMessage()` 方法获取字符串值。并将该字符串显示在 `TextView` 控件上。\n\n编译并运行应用，并在点击\
  \ `Button` 控件之前输入文本。当第二个片段目的地出现时，`TextView` 应显示第一个片段中输入的文本，这表明数据已成功在导航目的地之间传递。\n\
  \n### 41.12 总结\n\n\n\n\n\n本章提供了一个示例，展示了如何使用 Navigation Architecture Component 和\
  \ Android Studio 导航图编辑器实现 Android 应用导航。涵盖的主题包括：创建一个包含现有和新目的地片段（destination fragments）的导航图、在\
  \ Activity 布局中嵌入导航主机片段（host fragment）、编写触发导航事件的代码，以及使用 safeargs 插件在目的地之间传递参数。\n\n\
  ## 42. MotionLayout 简介\n\n`MotionLayout` 类为用户界面布局中的视图添加动画效果提供了一种简单的方法。本章将首先概述 `MotionLayout`，并介绍\
  \ `MotionScenes`（动效场景）、`Transitions`（过渡）和 `Keyframes`（关键帧）的概念。在介绍这些基础之后，接下来的两个章节（标题分别为\
  \ Android MotionLayout 教程 和 MotionLayout KeyCycle 教程）将通过创建示例项目，提供 `MotionLayout`\
  \ 动画的更多细节和示例。\n\n### 42.1 MotionLayout 概述\n\n`MotionLayout` 是一个布局容器，其主要目的是使布局内视图从一个状态到另一个状态的过渡变为动画。例如，`MotionLayout`\
  \ 可以使 `ImageView` 实例在指定时间内从屏幕的左上角移动到右下角。除了视图的位置，其他属性的变化也可以变为动画，例如颜色、大小或旋转角度。这些状态变化也可以进行插值（使得视图在整个动画过程中移动、旋转并改变大小）。\n\
  \n使用 `MotionLayout` 的视图运动可以在两点之间沿直线执行，也可以实现为遵循由起点和终点之间不同位置中间点的路径。`MotionLayout`\
  \ 还支持使用触摸和滑动来启动和控制动画。\n\n`MotionLayout` 动画完全在 XML 中声明，通常不需要编写代码。这些 XML 声明可以在 Android\
  \ Studio 代码编辑器中手动实现、使用 `MotionLayout` 编辑器进行视觉化实现，或者结合这两种方法使用。\n\n### 42.2 MotionLayout\n\
  \n在实现动画时，用户界面中常用的 `ConstraintLayout` 容器必须先转换为 `MotionLayout` 实例（可以通过在布局编辑器中右键点击\
  \ `ConstraintLayout` 并选择 `Convert to MotionLayout` 菜单项来实现）。`MotionLayout` 还需要 `ConstraintLayout`\
  \ 库的 2.0.0 以上版本。\n\n意不意外，由于它是 `ConstraintLayout` 的子类，`MotionLayout` 支持 `ConstraintLayout`\
  \ 的所有布局功能。因此，当对不需要动画的视图使用 `MotionLayout` 时，可以同样设计用户界面布局。\n\n对于需要动画的视图，会声明两个 `ConstraintSets`，用于定义视图在动画开始和结束时的外观和位置。过渡（transition）声明定义了关键帧，用于在这些起结束状态之间对目标视图应用额外效果，以及用于启动和控制动画的点击和滑动处理程序。\n\
  \n开始和结束的 `ConstraintSets` 以及过渡均在 `MotionScene` XML 文件中声明。\n\n### 42.3 MotionScene\n\
  \n正如我们在前面的章节中看到的，XML 布局文件包含了配置呈现给用户的静态视图外观和布局行为所需的信息，在使用 `MotionLayout` 时也是如此。对于非静态视图（换句话说，将被动画化的视图），这些视图仍然声明在布局文件中，但与这些视图相关的开始、结束和过渡声明存储在一个独立的\
  \ XML 文件中，称为 `MotionScene` 文件（之所以命名是因为所有声明都定义在 `MotionScene` 元素内）。该文件被导入到布局 XML\
  \ 文件中，包含开始和结束的 `ConstraintSets` 以及 `Transition` 声明（一个文件可以包含多个 `ConstraintSet` 对和\
  \ `Transition` 声明，允许将不同的动画针对用户界面布局中的特定视图）。\n\n以下列表显示了 `MotionScene` 文件的模板：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n    <Transition\n\
  \        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在上述 XML 中，声明了名为 `start` 和 `end` 的 `ConstraintSets`（尽管可以使用任何名称），它们此时尚未包含任何约束元素。`Transition`\
  \ 元素定义这些 `ConstraintSets` 代表动画的开始和结束点，并包含一个空的 `KeyFrameSet` 元素，准备填充额外的动画关键帧条目。`Transition`\
  \ 元素还包含一个毫秒持续时间属性，用于控制动画的运行时间。\n\n`ConstraintSets` 并不意味着视图的运动。可以使开始和结束集声明屏幕上的相同位置，然后使用过渡来动画其他属性的变化，例如缩放和旋转角度。\n\
  \n### 42.4 配置 ConstraintSets\n\n`MotionScene` 文件中的 `ConstraintSets` 允许将全套 `ConstraintLayout`\
  \ 设置应用于视图的定位、尺寸和与父视图的关系。此外，在 `ConstraintSet` 中还可以包含以下属性：\n\n•alpha\n•visibility\n\
  •elevation\n•rotation\n•rotationX\n•rotationY\n•translationX\n•translationY\n•translationZ\n\
  •scaleX\n•scaleY\n\n例如，为了在动画期间旋转视图 180°，可以在开始和结束约束中声明以下内容：\n\n```xml\n<ConstraintSet\
  \ android:id=\"@+id/start\">\n    <Constraint\n        motion:layout_constraintStart_toStart=\"\
  parent\"\n        android:rotation=\"0\">\n    </Constraint>\n</ConstraintSet>\n\
  \n<ConstraintSet android:id=\"@+id/end\">\n    <Constraint\n        motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        android:rotation=\"180\">\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n上述更改告诉 `MotionLayout` 视图从 0° 开始，然后在动画过程中旋转完整的 180°，最后倒置停止。\n\n### 42.5 自定义属性\n\
  \n除了列出的标准属性外，还可以指定一系列自定义属性（使用 `CustomAttribute` 声明）。事实上，视图类型上可用的几乎任何属性都可以作为自定义属性包含在动画中。要标识属性名称，请从目标视图类的文档中找到\
  \ getter/setter 名称，删除 get/set 前缀并将剩余的第一个字母小写。例如，在代码中更改 `Button` 视图的背景颜色时，我们如下调用\
  \ `setBackgroundColor()` 设置方法：\n\n```\nmyButton.setBackgroundColor(Color.RED)\n\
  ```\n\n在约束集或关键帧中设置此属性时，属性名称将为 `backgroundColor`。除了属性名称外，还必须使用以下列表中的适当类型来声明值：\n\n\
  •`motion:customBoolean` - 布尔属性值。\n\n\n\n\n\n- `motion:customColorValue` - 颜色属性值。\n\
  - `motion:customDimension` - 维度属性值。\n- `motion:customFloatValue` - 浮点数属性值。\n- `motion:customIntegerValue`\
  \ - 整数属性值。\n- `motion:customStringValue` - 字符串属性值。\n\n例如，颜色设置需要使用 `motion:customColorValue`\
  \ 类型进行赋值：\n\n```xml\n<CustomAttribute\n    motion:attributeName=\"backgroundColor\"\
  \n    motion:customColorValue=\"#43CC76\" />\n```\n\n例如，以下来自 `MotionScene` 文件的片段除了将背景颜色从绿色改为红色外，还为视图声明了起始和结束约束：\n\
  \n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\" >\n       \
  \ <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n     \
  \       motion:customColorValue=\"#33CC33\" />\n    </Constraint>\n</ConstraintSet>\n\
  \n<ConstraintSet android:id=\"@+id/end\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteY=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintEnd_toEndOf=\"\
  parent\"\n        motion:layout_constraintBottom_toBottomOf=\"parent\" >\n     \
  \   <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n   \
  \         motion:customColorValue=\"#F80A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n### 42.6 触发动画\n\n如果没有某些事件告诉 `MotionLayout` 开始动画，`MotionScene` 文件中的任何设置都将影响布局（视图将根据起始\
  \ `ConstraintSet` 中的设置进行定位除外）。\n\n动画可以配置为响应屏幕点击（`OnClick`）或滑动（`OnSwipe`）手势开始。`OnClick`\
  \ 处理器会使动画开始并运行直到完成，而 `OnSwipe` 则将同步动画沿时间轴来回移动，以匹配触摸动作。`OnSwipe` 处理器还会响应屏幕上的“飞掷”（flinging）动作。`OnSwipe`\
  \ 处理器还提供了选项，用于配置动画如何响应不同方向的拖拽，以及滑动锚定的目标视图的哪侧。这允许例如，向左的拖拽动作使视图向相应方向移动，同时防止向上运动导致视图向侧移动（除非这确实是所需的行为）。\n\
  \n`OnSwipe` 和 `OnClick` 声明包含在 `MotionScene` 文件的 `Transition` 元素中。两种情况下，都必须指定视图 ID。例如，要实现一个响应锚定在名为\
  \ `button` 的视图底部的向下拖拽动作的 `OnSwipe` 处理器，可以将以下 XML 放在 `Transition` 元素中：\n\n```xml\n\
  <Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @+id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet></KeyFrameSet>\n \
  \   <OnSwipe\n        motion:touchAnchorId=\"@+id/button\"\n        motion:dragDirection=\"\
  dragDown\"\n        motion:touchAnchorSide=\"bottom\" />\n</Transition>\n```\n\n\
  或者，为同一个按钮添加一个 `OnClick` 处理器：\n\n```xml\n<OnClick motion:targetId=\"@+id/button\"\
  \ motion:clickAction=\"toggle\" />\n```\n\n在上面的示例中，动作已被设置为 `toggle` 模式。该模式和其他其他可用选项可以总结如下：\n\
  - `toggle`: 动画到相反状态。例如，如果视图当前处于过渡点，它将过渡到终点，反之亦然。\n- `jumpToStart`: 立即更改到起始状态，不带动画。\n\
  - `jumpToEnd`: 立即更改到结束状态，不带动画。\n- `transitionToStart`: 带有动画过渡到起始状态。\n- `transitionToEnd`:\
  \ 带有动画过渡到结束状态。\n\n### 42.7 弧线运动\n\n默认情况下，视图位置的移动将在起点和终点之间沿直线通过。要将运动改为弧线路径，请在起始约束中使用所示的\
  \ `motion:pathMotionArc` 属性，并配置 `startHorizontal` 或 `startVertical` 来定义弧线是凹的还是凸的：\n\
  \n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\"\n        motion:pathMotionArc=\"\
  startVertical\" >\n</ConstraintSet>\n```\n\n图 42-1 展示了 `startVertical` 和 `startHorizontal`\
  \ 弧线与默认直线的对比。\n\n### 42.8 关键帧 (Keyframes)\n\n为止概述的所有 `ConstraintSet` 属性仅适用于动画的起点和终点。句话说，如果将旋转属性设置为\
  \ 180°，则旋转将在动画开始时开始并在到达终点时完成。因此，无法配置旋转在动画进行 50% 处达到完全 180°，然后在结束时旋转回原始方向。幸运的是，这种效果可以使用关键帧实现。\n\
  \n关键帧用于定义动画过程中发生状态变化的中间点。例如，可以声明关键帧，使视图的背景颜色在动画的 50% 处变为蓝色，在 75% 处变为绿色，然后在动画结束时恢复原始颜色。关键帧实现在\
  \ `MotionScene` 文件的 `Transition` 元素中，嵌入在 `KeyFrameSet` 元素中。\n\n`MotionLayout` 支持多种关键帧，总结如下：\n\
  \n### 42.8.1 属性关键帧\n\n属性关键帧（使用 `KeyAttribute` ）允许在动画时间轴的中间点更改视图属性。`KeyAttribute`\
  \ 支持上述 `ConstraintSets` 列出的属性，并能够指定更改在动画时间轴何时生效。例如，以下关键帧声明将逐渐导致按钮视图水平（`scaleX`）和垂直（`scaleY`）方向尺寸翻倍，在时间轴\
  \ 50% 处达到最大尺寸。在时间轴的剩余时间内，视图将缩小到原始尺寸：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@+id/start\"\n    motion:duration=\"\
  1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n            motion:motionTarget=\"\
  @+id/button\"\n            motion:framePosition=\"50\"\n            android:scaleX=\"\
  2.0\" />\n        <KeyAttribute\n            motion:motionTarget=\"@+id/button\"\
  \n            motion:framePosition=\"50\"\n            android:scaleY=\"2.0\" />\n\
  \    </KeyFrameSet>\n</Transition>\n```\n\n\n\n\n\n- `parentRelative` - x 和 y 坐标相对于指定坐标的父容器，坐标以百分比表示（表现为\
  \ 0.0 到 1.0 之间的值）：\n\n![](img/motionlayout_parentRelative.jpg)\n\n图 42-2\n\n- `deltaRelative`\
  \ - x 和 y 坐标不再相对于父容器，而是相对于起点和终点。例如，起点为 (0, 0)，终点为 (1, 1)。注意 x 和 y 坐标可以是负值：\n\n![](img/motionlayout_deltaRelative.jpg)\n\
  \n图 42-3\n\n- `pathRelative` - x 和 y 坐标相对于路径，起点和终点之间的直线作为图表的 X 轴。再次，坐标以百分比（0.0 到\
  \ 1.0）表示。这与 `deltaRelative` 坐标系相似，但它考虑了路径的角。同样，坐标可能为负值：\n\n![](img/motionlayout_pathRelative.jpg)\n\
  \n图 42-4\n\n例如，以下 `ConstraintSets` 声明了设备屏幕两侧的起点和终点。默认情况下，使用这些点的视图过渡将跨屏幕直线移动，如图图\
  \ 42-5 所示：\n\n![](img/motionlayout_straight_path.jpg)\n\n图 42-5\n\n然而，假设视图需要遵循类似于下方图\
  \ 42-6 所示的路径：\n\n![](img/motionlayout_wave_path.jpg)\n\n图 42-6\n\n为了实现这一点，可以在过渡（transition）中如下声明关键帧位置点：\n\
  \n```xml\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\n    motion:framePosition=\"\
  25\"\n    motion:keyPositionType=\"pathRelative\"\n    motion:percentY=\"0.3\"\n\
  \    motion:percentX=\"0.25\"/>\n\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\
  \n    motion:framePosition=\"75\"\n    motion:keyPositionType=\"pathRelative\"\n\
  \    motion:percentY=\"-0.3\"\n    motion:percentX=\"0.75\"/>\n```\n\n上述元素使用 `pathRelative`\
  \ 坐标系在路径 25% 和 75% 处创建了关键帧位置点。第一个位置位于坐标 (0.25, 0.3)，第二个位置位于 (0.75, -0.3)。这些位置关键帧可以可视化如下方的图\
  \ 42-7 所示：\n\n![](img/motionlayout_curve_path.jpg)\n\n图 42-7\n\n### 42.9 时间线性度\n\
  \n在没有额外设置的情况下，上述动画将以恒定速度执行。要改变动画速度（例如，使其先加速后减速），可以在 `ConstraintSet` 或 `Keyframe`\
  \ 中使用过渡缓动属性（`transitionEasing`）。\n\n对于复杂的缓动需求，可以通过在三次贝塞尔曲线上绘制点点来定义线性度，例如：\n\n```xml\n\
  motion:layout_constraintBottom_toBottomOf=\"parent\"\nmotion:transitionEasing=\"\
  cubic(0.2, 0.7, 0.3, 1)\"\nandroid:rotation=\"360\"\n```\n\n如果你不熟悉贝塞尔曲线，可以考虑使用以下\
  \ URL 上的在线曲线生成器：[`cubic-bezier.com/`](https://cubic-bezier.com/)\n\n但对于大多数需求，可以使用内置的标准加速（accelerate）和减速（decelerate）值指定缓动：\n\
  \n```xml\nmotion:layout_constraintBottom_toBottomOf=\"parent\"\nmotion:transitionEasing=\"\
  decelerate\"\nandroid:rotation=\"360\"\n```\n\n### 42.10 KeyTrigger\n\n触发器关键帧（`KeyTrigger`）允许在动画到达动画时间线内指定的帧位置时，调用视图上的方法。这还考虑了动画的方向。例如，根据动画正向还是反向运行，可以调用不同的方法。考虑一个当动画移动超过时间线\
  \ 20% 时变为可见的按钮。`KeyTrigger` 将在 `Transition` 元素的 `KeyFrameSet` 中如下所示使用 `onPositiveCross`\
  \ 属性实现：\n\n```xml\n<KeyFrameSet>\n    <KeyTrigger\n        motion:framePosition=\"\
  20\"\n        motion:onPositiveCross=\"show\"\n        motion:motionTarget=\"@id/button\"\
  />\n</KeyFrameSet>\n```\n\n同样，如果同一个按钮在动画反向并降至 10% 以下时隐藏，可以使用 `onNegativeCross` 属性添加第二个触发器：\n\
  \n```xml\n<KeyTrigger\n    motion:framePosition=\"10\"\n    motion:onNegativeCross=\"\
  show\"\n    motion:motionTarget=\"@id/button2\"/>\n```\n\n如果动画使用切换操作（toggle action），请使用\
  \ `onCross` 属性：\n\n```xml\n<KeyTrigger\n    motion:framePosition=\"10\"\n    motion:onCross=\"\
  show\"\n    motion:motionTarget=\"@id/button\"/>\n```\n\n### 42.11 循环（Cycle）与时间（Time）\n\
  \n虽然位置关键帧可以向动画中添加中间变化，但如果需要实现大量位置，这将很快变得繁琐。对于需要重复执行状态更改的情况，MotionLayout 包含了循环（Cycle）和时间（Time）关键帧。MotionLayout\
  \ 教程将详细讨论这一主题。\n\n### 42.12 从代码启动动画\n\n到目前，我们只查看了如何使用 `OnSwipe` 和 `OnClick` 控制动画。也可以通过调用\
  \ `MotionLayout` 实例的方法从内部启动动画。以下代码示例为名为 `motionLayout` 的布局运行持续时间为 2000ms 的过渡：\n\n\
  ```java\nmotionLayout.setTransition(2000);\nmotionLayout.ToEnd();\n```\n\n在没有额外设置的情况下，动画使用的起点和终点状态将是文件中定义的。要使用特定的起点和终点约束集，通过调用\
  \ `MotionLayout` 实例的 `setTransition` 方法引用：\n\n```java\nmotionLayout.setTransition(R.id.myStart,\
  \ R.id.myEnd);\nmotionLayout.ToEnd();\n```\n\n要在动画运行时监控其状态，如下为 `MotionLayout` 实例添加过渡监听器：\n\
  \n```java\nMotionLayout.TransitionListener transitionListener = new MotionLayout.TransitionListener()\
  \ {\n    @Override\n    public void onTransitionStarted(MotionLayout motionLayout,\
  \ int startId, int endId) {\n        // 过渡开始时调用\n    }\n\n    @Override\n    public\
  \ void onTransitionChange(MotionLayout motionLayout, int startId, int endId, float\
  \ progress) {\n        // 属性变化时调用。跟踪进度值以查找\n// 当前位置\n    }\n\n    @Override\n  \
  \  public void onTransitionCompleted(MotionLayout motionLayout, int currentId) {\n\
  \        // 过渡完成时调用\n    }\n\n    @Override\n    public void onTransitionTrigger(MotionLayout\
  \ motionLayout, int triggerId, boolean positive, float progress) {\n        // 越过触发关键帧阈值时调用\n\
  \    }\n};\n\nmotionLayout.setTransitionListener(transitionListener);\n```\n\n###\
  \ 42.13 总结\n\nMotionLayout 是 `ConstraintLayout` 的子类，专门设计为用户界面布局中的视图添加动画效果。MotionLayout\
  \ 通过在起点和终点约束集定义的两个状态之间进行工作。\n\n动画可以通过 `OnClick` 或 `OnSwipe` 处理器触发，也可以通过调用 `MotionLayout`\
  \ 实例的方法从代码启动。\n\n### 43. 一个 Android MotionLayout 编辑教程\n\n\n\n\n\n现在已经涵盖了 `MotionLayout`\
  \ 的基础知识，本章将提供一个在示例项目中尝试 `MotionLayout` 的机会。除了继续探索 `MotionLayout` 的主要功能外，本章还将介绍 `MotionLayout`\
  \ 编辑器，并探索如何通过可视化方式构建和修改 `MotionLayout` 动画。\n\n在本章创建的项目将使用起始和结束 `ConstraintSets`、手势处理器以及属性（`Attribute`）和位置关键帧（`Position\
  \ Keyframes`）。\n\n### 43.1 创建 MotionLayoutDemo 项目\n\n点击欢迎界面上的 `New Project` 按钮，在出现的新项目对话框中选择\
  \ `Empty Views Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `MotionLayoutDemo`，并指定\
  \ `com.ebookfrenzy.motionlayoutdemo` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level`\
  \ 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。\n\n### 43.2 将 ConstraintLayout\
  \ 转换为 MotionLayout\n\nAndroid Studio 已在 `activity_main.xml` 布局文件中放置了一个 `ConstraintLayout`\
  \ 容器作为父视图。下一步是将该容器转换为 `MotionLayout` 实例。在 `Component Tree` 中，右键点击 `ConstraintLayout`\
  \ 条目并选择 `Convert to MotionLayout` 菜单选项：\n\n![](img/as_convert_to_motionlayout.jpg)\n\
  \n图 43-1\n\n做出选择后，点击确认对话框中的 `Convert` 按钮。一旦转换完成，`MotionLayout` 编辑器将出现在 Android Studio\
  \ 主窗口中，如 图 43-2 所示：\n\n![](img/as_motionlayout_editor.jpg)\n\n图 43-2\n\n作为转换过程的一部分，Android\
  \ Studio 将创建一个名为 `res -> xml` 的新文件夹，并在其中放置一个名为 `activity_main_scene.xml` 的 `MotionLayout`\
  \ 场景文件：\n\n![](img/as_motionlayout_scene_file.jpg)\n\n图 43-3\n\n该文件包含一个顶层 `MotionScene`\
  \ 元素，其中包含了 `ConstraintSet` 和 `Transition` 条目，这些条目将定义主布局中的动画。默认情况下，该文件将包含起始和结束约束集的空元素以及一个初始过渡：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n<MotionScene\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在 `MotionLayout` 编辑器中进行的任何更改都将存储在此文件中。同样，也可以直接编辑此文件，以在在 `MotionLayout` 编辑器之外实现和修改动画设置。\n\
  \n在本教程中，动画将主要通过 `MotionLayout` 编辑器界面来实现。然而，我们将在每个阶段回顾这些更改是如何反映在底层 `MotionScene`\
  \ 文件中的。随着章节的进行，你会发现 `MotionScene` 的 XML 语法简单且易于学习。\n\n本教程的第一阶段将演示如何使用 `MotionLayout`\
  \ 对 `Button` 对象进行动画处理，包括运动（包括遵循路径）、旋转和缩放。\n\n### 43.3 配置起始和结束约束\n\n当 `activity_main.xml`\
  \ 文件加载到 `MotionLayout` 编辑器后，确保选中了 Motion Layout 框（在下方 图 43-5 中标记为 E），然后在删除默认的 `TextView`\
  \ 之前，从调色板拖放 `Button` 视图到布局画布的左上角，如 图 43-4 所示：\n\n![](img/as_motionlayout_button.jpg)\n\
  \n图 43-4\n\n选中按钮后，使用 `Attributes` 工具窗口将 `id` 更改为 `myButton`。\n\n如上一章所述，`MotionLayout`\
  \ 动画本质上指定视图如何在两个状态之间进行过渡的案例。因此，实现动画的第一步是指定定义这些状态的约束。\n\n对于此示例，起始点将是布局视图的顶部中央。为了配置这些约束，选择编辑器窗口中的\
  \ `start` 约束集条目（在 图 43-5 中标记为 A）：\n\n![](img/as_motionlayout_editor_labelled.jpg)\n\
  \n图 43-5\n\n当选中起始框时，所有的约束和布局更改将应用于起始点约束集。要返回整个布局的标准约束和属性，请点击 Motion Layout 框 (E)。\n\
  \n接下来，在 `ConstraintSet` 列表中选择 `myButton` 条目 (B)。注意，`Source` 列显示按钮是根据布局文件中的约束进行定位的。相反，我们希望按钮根据约束进行定位。在\
  \ `myButton` 条目仍被选中的情况下，点击 `Edit` (C) 并从菜单中选择 `Constraint`，之后按钮条目将指示它是基于约束定位的：\n\
  \n![](img/as_layout_start.jpg)\n\n图 43-6\n\n起始约束集必须将按钮置于布局顶部，带有 `8dp` 偏移并水平居中。选中\
  \ `myButton` 后，使用 `Attributes` 工具窗口对 `left` 和 `right` 侧设置约束：\n\n![](img/as_layout_start.jpg)\n\
  \n图 43-7\n\n选择结束条目（在 图 43-5 中标记为 D），并重复步骤创建新约束，这次将按钮放置在布局底部带有 `8dp` 偏移：\n\n![](img/as_layout_end.jpg)\n\
  \n图 43-8\n\n配置好 `start` 和 `end` 约束后，打开 `activity_main_scene.xml` 文件，注意约束已添加到文件中：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <ConstraintSet android:id=\"@+id/start\">\n        <Constraint\n        \
  \    android:id=\"@+id/myButton\"\n            android:layout_width=\"wrap_content\"\
  \n            android:layout_height=\"wrap_content\"\n            android:layout_marginTop=\"\
  8dp\"\n            motion:layout_constraintTopTopOf=\"parent\"\n            motion:layout_constraintStart_toStartOf=\"\
  parent\"\n            motion:layout_constraintEnd_toEndOf=\"parent\" />\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n        <Constraint\n            android:id=\"\
  @+id/myButton\"\n            android:layout_width=\"wrap_content\"\n           \
  \ android:layout_height=\"wrap_content\"\n            android:layout_marginBottom=\"\
  8dp\"\n            motion:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    motion:layout_constraintEnd_toEndOf=\"parent\"\n            motion:layout_constraintBottom_toBottomOf=\"\
  parent\" />\n    </ConstraintSet>\n</MotionScene>\n```\n\n注意 `Transition` 元素已经预配置为\
  \ 1000 毫秒内动画起始和结束点之间的过渡。尽管我们尚未添加触发过渡的动作，但在 `MotionLayout` 编辑器中预览动画仍然是可能的。\n\n###\
  \ 43.4 预览 MotionLayout 动画\n\n要在不构建和运行应用程序的情况下预览动画，请选择 `MotionLayout` 编辑器中下方 图 43-9\
  \ 标记为 A 的过渡箭头。这将显示动画时间线面板（标记为 B）：\n\n![](img/as_motionlayout_test_animation.jpg)\n\
  \n图 43-9\n\n\n\n\n\n要测试动画，请点击滑块 (C) 并沿着时间轴拖动。随着滑块移动，布局画布中的按钮将沿着虚线路径 (D) 移动。使用工具栏按钮\
  \ (E) 执行完整动画，以便以不同的速度持续重复动画（向前、向后或来回切换）。\n\n### 43.5 添加 OnClick 点击手势\n\n尽管已经创建了一个简单的\
  \ `MotionLayout` 动画过渡，但我们仍然需要一种方法在运行中的 App 内部启动动画。这可以通过分配点击或滑动处理器来实现。在本例中，我们将配置动画在用户点击按钮时启动。在\
  \ `MotionLayout` 编辑器中，如果动画在循环设置下运行，请先暂停时间轴动画。接下来，选择过渡箭头（如上方 图 43-9 中标记的 A），在属性（Attributes）工具窗口中找到\
  \ `OnClick` 属性区域，并点击下方 图 43-10 中箭头所示的 `+` 按钮：\n\n![](img/as_motionlayout_add_onclick.jpg)\n\
  \n图 43-10\n\n`OnClick` 面板中会出现一个第一个属性的空行。对于属性名，输入 `targetId`；对于值字段，输入按钮的 id (`@id/myButton`)。在下一个空行中，在属性名字段输入\
  \ `app:clickAction`。在值字段中，点击向下箭头显示有效选项菜单：\n\n![](img/as_motionlayout_onclick_toggle.jpg)\n\
  \n图 43-11\n\n对于此示例，选择切换（toggle）切换操作。这将导致视图在被点击时动画到相反的位置。一旦输入了这些设置，它们应该与 图 43-12\
  \ 所示的内容匹配：\n\n![](img/as_4.0_motionlayout_onclick_added.jpg)\n\n图 43-12\n\n再次打开\
  \ `activity_main_scene.xml` 文件，并检查 `Transition` 条目中定义的 `OnClick` 属性：\n\n```xml\n\
  <Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnClick motion:targetId=\"@id/myButton\"\n        motion:clickAction=\"toggle\"\
  \ />\n</Transition>\n```\n\n在设备或模拟器上编译并运行 App，确认点击按钮会导致它在在 `MotionScene` 文件定义的起始点和终点之间来回切换。\n\
  \n### 43.6 在过渡中添加属性关键帧\n\n到目前为止，示例项目仅演示了按钮视图从屏幕上一个位置移动到另一个位置的运动。属性关键帧（`KeyAttribute`）提供了一种方法，用于指定过渡时间轴中的点，使其他属性的变化在该点生效。例如，可以定义一个\
  \ `KeyAttribute`，使得视图在移动通过时间轴 30% 时，其尺寸已经增加了 50%。在本例中，我们将在动画的中点处添加一个旋转效果。\n\n首先，在\
  \ `MotionLayout` 编辑器中打开 `activity_main.xml` 文件，选择过渡连接箭头以显示时间轴，然后点击 图 43-13 中高亮的的按钮：\n\
  \n![](img/as_motionlayout_add_keyframe.jpg)\n\n图 43-13\n\n从菜单中，选择 `KeyAttribute`\
  \ 选项：\n\n![](img/as_motionlayout_add_key_attribute.jpg)\n\n图 43-14\n\n一旦选中，将弹出 图\
  \ 43-15 所示的对话框。在对话框中，确保选择了 `ID` 选项并引用了 `myButton`。在位置字段中，输入 `50`（以百分比指定，0 是起点，100\
  \ 是终点）。最后，在点击 `Add` 按钮之前，从属性下拉菜单中选择旋转（rotation）项：\n\n![](img/as_motionlayout_create_key_attribute.jpg)\n\
  \n图 43-15\n\n添加 `KeyAttribute` 后，时间轴中会出现一个该属性的行。点击该行将其高亮，然后点击行最左侧边缘的展开箭头以展开属性过渡图。注意，时间轴上出现了一个小的菱形标记（如下方\
  \ 图 43-16 所示），表示关键帧的位置。图表表示效果的线性。在这种情况下，按钮将稳稳地旋转到指定的角度，并在关键帧位置达到最大旋转。当到达终点时，按钮将旋转回\
  \ 0 度：\n\n![](img/as_motionlayout_attribute_timeline.jpg)\n\n图 43-16\n\n要更改 `KeyAttribute`\
  \ 的属性，在时间轴中选择它，然后参考属性（Attributes）窗口。在 `KeyAttribute` 面板中，将旋转改为 `360`：\n\n![](img/as_motionlayout_key_attribute.jpg)\n\
  \n图 43-17\n\n通过来回拖动滑块并观察按钮旋转来检查属性是否生效。查看 `activity_main_scene.xml`，它应如下：\n\n```xml\n\
  <Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n\
  \            motion:targetId=\"@id/myButton\"\n            motion:frame=\"50\"\n\
  \            motion:rotation=\"360\" />\n    </KeyFrameSet>\n    <OnClick motion:targetId=\"\
  @id/myButton\"\n        motion:clickAction=\"toggle\" />\n</Transition>\n```\n\n\
  使用滑块或运行 App 来测试动画。\n\n### 43.7 为 Transition 添加 CustomAttribute\n\n`KeyAttribute`\
  \ 属性限于缩放和旋转等内置效果。通过声明 `CustomAttributes` 可以实现额外的更改。与存储在 `Transition` 元素中的 `KeyAttributes`\
  \ 不同，`CustomAttributes` 位于开始结束约束集中。因此，这些属性只能在起点终点声明（也就是说，你不能在过渡中间指定属性关键帧）。\n\n在本例中，我们将配置按钮颜色从红色变为绿色。首先选择\
  \ 图 43-18 中标记为 A 的起始框，然后是 `myButton` 约束集 (B)：\n\n![](img/as_motionlayout_custom_attr.jpg)\n\
  \n图 43-18\n\n参考属性窗口，点击下方高亮的 `CustomAttributes` 区域中的 `+` 按钮：\n\n![](img/as_motionlayout_add_attribute.jpg)\n\
  \n图 43-19\n\n在生成的对话框（图 43-20）中，将属性类型更改为 `Color` 并在名称字段输入 `backgroundColor`。最后，将值设置为\
  \ `#F80A1F`：\n\n![](img/as_motionlayout_custom_attribute_dialog.jpg)\n\n图 43-20\n\
  \n点击 OK 更改，然后选择上方 图 43-18 中标记为 C 的结束约束集，重复步骤添加自定义属性，这次指定 `#33CC33` 为颜色的 RGB 值。\n\
  \n使用时间轴滑块或运行 App，确保按钮在动画期间颜色变化。这些 `CustomAttributes` 的添加将反映在 `activity_main_scene.xml`\
  \ 文件中如下：\n\n```xml\n<ConstraintSet android=\"@+id/start\">\n    <Constraint android=\"\
  @+id/myButton\">\n        <CustomAttribute\n            motion:attributeName=\"\
  backgroundColor\"\n            motion:customColorValue=\"#F80A1F\" />\n    </Constraint>\n\
  </ConstraintSet>\n<ConstraintSet android=\"@+id/end\">\n    <Constraint android=\"\
  @+id/myButton\">\n        <CustomAttribute\n            motion:attributeName=\"\
  backgroundColor\"\n            motion:customColorValue=\"#33CC33\" />\n    </Constraint>\n\
  </ConstraintSet>\n```\n\n\n\n\n\n```xml\n<motion:attributeName=\"backgroundColor\"\
  \n      motion:customColorValue=\"#33CC33\" />\n</Constraint>\n</ConstraintSet>\n\
  ```\n\n### 43.8 添加位置关键帧\n\n本教程的终极任务是向动画路径添加两个位置关键帧（`KeyPosition`），以为动画引入一些横向移动。在\
  \ `MotionLayout` 编辑器中可见过渡时间轴的情况下，点击上方图 43-13 所示的亮亮按钮来创建关键帧，并从菜单中选择 `KeyPosition`\
  \ 选项，如下方的图 43-21 所示：\n\n![](img/as_motionlayout_keyposition_menu.jpg)\nFigure 43-21\n\
  \n在弹出的对话框中，按照图 43-22 所示设置属性：\n\n![](img/as_motionlayout_create_keyposition.jpg)\n\
  Figure 43-22\n\n点击 `Add` 按钮提交更改，然后重复上述步骤添加一个配置如下的第二个位置关键帧：\n\n* `Position`: 75\n\
  * `Type`: `parentRelative`\n* `PercentX`: 0.85\n* `PercentY`: 0.75\n\n完成这些更改后，`activity_main_scene.xml`\
  \ 文件中的过渡元素将添加了以下关键帧项：\n\n```xml\n<KeyFrameSet>\n  <KeyPosition\n      motion:motionTarget=\"\
  @+id/myButton\"\n      motion:framePosition=\"25\"\n      motion:keyPositionType=\"\
  parentRelative\"\n      motion:percentX=\"0.15\"\n      motion:percentY=\"0.25\"\
  \ />\n  <KeyPosition\n      motion:motionTarget=\"@+id/myButton\"\n      motion:framePosition=\"\
  75\"\n      motion:keyPositionType=\"parentRelative\"\n      motion:percentX=\"\
  0.85\"\n      motion:percentY=\"0.75\" />\n</KeyFrameSet>\n```\n\n最后一次测试应用，验证按钮现在是否遵循下方所示的路径，同时保持旋转并改变颜色：\n\
  \n![](img/as_motionlayout_path_1.jpg)\nFigure 43-23\n\n位置关键帧由预览画布中代表运动路径的虚线上的菱形标记表示，如图\
  \ 43-24 所示所示如果标记标记不可见，请确保在预览中选中了 `Button` 视图）：\n\n![](img/as_motionlayout_path_2.jpg)\n\
  Figure 43-24\n\n要从视觉上调整关键帧的位置，点击标记并将其拖到新位置。随着标记的移动，`Motion Layout` 编辑器将显示网格以及当前的\
  \ `x` 和 `y` 坐标：\n\n![](img/as_motionlayout_path_3.jpg)\nFigure 43-25\n\n### 43.9\
  \ 总结\n\n本章介绍了 Android Studio 内置的 `MotionLayout` 编辑器，并探索了如何使用它在无需手动编写 XML 声明的情况下为\
  \ Android 应用程序的用户界面添加动画。本章涵盖的示例包括将 `ConstraintLayout` 容器转换为 `MotionLayout`、在 `MotionScene`\
  \ 文件中创建起始和结束约束集及过渡，以及添加 `OnClick` 处理程序。此外还涵盖了动画预览器、自定义属性和位置关键帧。\n\n### 44. MotionLayout\
  \ 循环教程\n\n之前的章节介绍并演示了如何使用 `MotionLayout` 容器结合 Android Studio `MotionLayout` 编辑器的功能，将动画集成到\
  \ Android 应用程序用户界面的概念。标题为“MotionLayout 简介”的章节简要提到了循环（`KeyCycle`）和时间循环（`KeyTimeCycle`）关键帧，并解释了如何使用它们来实现涉及大量重复状态变化的动画。\n\
  \n本章将更详细地介绍循环关键帧，然后演示如何使用 Android Studio 和 `Cycle Editor` 在示例项目中创建它们。\n\n### 44.1\
  \ 循环关键帧概述\n\n位置关键帧可以为动画时间轴添加中间状态变化。虽然这对于少数量的状态变化效果良好，但要大量实现将非常繁琐。例如，为了让按钮在点击时抖动\
  \ 50 次以表示发生错误，将涉及手动创建 100 个位置关键帧来执行微小的顺时针和逆时针旋转。同样，在视图跨越屏幕时实现弹跳效果也将同样耗时。\n\n对于需要重复执行状态变化的情况，`MotionLayout`\
  \ 包含了 `Cycle` 和 `Time Cycle` 关键帧。两者执行相同的任务，区别在于 `KeyCycle` 帧基于动画路径中的帧位置，而 `KeyTimeCycles`\
  \ 是基于每秒循环次数（`Hz`）的时间基的。\n\n使用这些 `KeyCycle` 帧，动画时间轴本质上被分为子部分（称为循环），包含一个或多个波形，定义了视图的属性在整个时间轴上如何被修改。创建\
  \ `KeyCycle` 循环时需要以下信息：\n\n* `target view`: 将进行更改的视图的 ID。\n* `frame position`: 循环开始的时间轴位置。\n\
  * `wave period`: 循环中包含的波形数量。\n* `attribute`: 被波形修改的视图属性。\n* `wave offset`: 相对于关键帧的偏移量。\n\
  * `wave shape`: 波形的形状（`sin`、`cos`、`sawtooth`、`triangle`）。\n\n考虑以下循环关键帧集：\n\n```xml\n\
  <KeyFrameSet>\n  <KeyCycle\n      motion:framePosition=\"0\"\n      motion:motionTarget=\"\
  @+id/button\"\n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"50dp\" />\n  <KeyCycle\n\
  \      motion:framePosition=\"25\"\n      motion:motionTarget=\"@+id/button\"\n\
  \      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"50dp\" />\n  <KeyCycle\n      motion:framePosition=\"\
  50\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"1\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  50dp\" />\n  <KeyCycle\n      motion:framePosition=\"75\"\n      motion:motionTarget=\"\
  @+id/button\"\n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"50dp\" />\n  <KeyCycle\n\
  \      motion:framePosition=\"100\"\n      motion:motionTarget=\"@+id/button\"\n\
  \      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"50dp\" />\n</KeyFrameSet>\n```\n\n上述关键帧集将时间轴分为四个等等的循环。每个循环都配置为包含一个\
  \ `sin` 波形，调整按钮 50dp 的 `translationY` 属性。执行时，此动画将导致按钮在指定范围内多次波动。此关键帧集可以如图 44-1 所示进行可视化，其中五个点代表关键帧位置：\n\
  \n![](img/as_4.0_keycycle_simple_sin.jpg)\nFigure 44-1\n\n目前的实现每个循环包含一个波形。假设我们需要在最后一个循环中四个波形，而不是这些均匀分布的波形。可以通过如下增加最后一个\
  \ `KeyCycle` 元素的 `wavePeriod` 属性来轻松实现：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"\
  75\"\n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"4\"\n   \
  \ motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  50dp\" />\n```\n\n做出此更改后，帧集可以如下如下波形形式渲染：\n\n![](img/as_4.0_keycycle_sin_waveperiod.jpg)\n\
  Figure 44-2\n\n\n\n\n\n到目前为止，本章的示例一直使用的是正弦波。在 `MotionLayout` 中处理周期关键帧（cycle keyframes）时，还有其他几种波形可用。例如，图\
  \ 44-3 展示了将所有周期关键帧的 `waveShape` 属性更改为锯齿波的效果：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n\
  图 44-3\n\n除了正弦波和锯齿波，`MotionLayout` 还支持三角形、方形、弹性波（bounce）和 `reverseSawtooth`（反锯齿波）波形。\n\
  \n在上面的示例中，每个周期都在 Y 轴的相同范围内移动按钮。然而，假设我们需要第二个周期沿正 Y 轴移动按钮的距离更远。这涉及按照如下方式调整第二个周期的 `waveOffset`\
  \ 属性：\n\n```xml\n<KeyCycle\n      motion:framePosition=\"25\"\n      motion:target=\"\
  @+id/button\"\n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"100dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"50dp\"/>\n```\n\n\
  通过此更改，我们得到了一个类似于 图 44-4 的时间线：\n\n![](img/as_4.0_keycycle_sin_waveoffset.jpg)\n图\
  \ 44-4\n\n按钮在第二个周期期间的移动范围现在是 Y 轴上的大约 0 到 150dp 之间。如果仍然需要范围的下端与其他波形保持一致，我们当然可以为 `translationY`\
  \ 值增加 100dp：\n\n```xml\n<KeyCycle\n      motion:framePosition=\"25\"\n      motion:target=\"\
  @+id/button\"\n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"100dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"150dp\"/>\n```\n\n\
  此更改现在为我们提供了如下的波形：\n\n![](img/as_4.0_keycycle_sin_waveoffset_flat.jpg)\n图 44-5\n\n\
  ## 44.2 使用周期编辑器\n\n尽管并不特别复杂，但通过直接编辑 `MotionScene` 文件中的 XML `KeyCycle` 条目来获取所需的精确周期配置可能花费一些时间。为此，Google\
  \ 的 Android 工程师开发了 `Cycle Editor`（周期编辑器）。这个独立的 Java 工具尚未成为 Android Studio 的一部分。`Cycle\
  \ Editor` 允许你可视化地设计和测试周期关键帧集。\n\n`Cycle Editor` 工具是一个 Java 归文件（`.jar`），需要在你的开发系统中安装\
  \ Java 运行环境。\n\n一旦安装了 Java，可以从以下 URL 下载 `CycleEditor.jar` 文件：\n\nhttps://github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar\n\
  \n下载完成后，打开命令提示符或终端窗口，切换到 `jar` 文件所在的目录，并运行以下命令：\n\n```bash\njava -jar CycleEditor.jar\n\
  ```\n\n工具加载后，将显示 图 44-6 所示的屏幕：\n\n![](img/as_4.0_keycycle_editor_main.jpg)\n图 44-6\n\
  \n上图中标记为 A 的面板显示了关键帧集的 XML，可以直接编辑，也可以使用面板 B 中的控制控件进行编辑。面板 C 显示波形形式的周期渲染。遗憾的是，这在进行更改时不会实时重绘。相反，必须通过选择\
  \ `File -> parse xml` 菜单选项来刷新。当点击面板 B 中的播放按钮时，标记为 D 的面板将显示周期动画的实时渲染。`Examples` 菜单提供了一组示例关键帧集，这些示例集既可以用于学习，也可以作为你自己动画的基础。\n\
  \n本章的剩余部分将创建一个示例项目，实现一个基于 `KeyCycle` 的动画效果，以演示 `Cycle Keyframe` 和 `Cycle Editor`\
  \ 的用法。\n\n## 44.3 创建 KeyCycleDemo 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `KeyCycleDemo`，并指定\
  \ `com.ebookfrenzy.keycycledemo` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为\
  \ `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。\n\n在 `Design` 模式下使用布局编辑器并打开\
  \ `activity_main.xml` 文件时，右键点击 `ConstraintLayout` 条目，并选择 `Convert to MotionLayout`\
  \ 菜单选项：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n图 44-7\n\n## 44.4 配置起始和约束\n\n\
  本教程旨在实现按钮从一侧到另一侧的移动动画，包括导致视图沿 Y 轴上下移动的 `KeyCycle` 效果。第一步是配置起始和结束。\n\n将 `activity_main.xml`\
  \ 文件加载到 `MotionLayout` 编辑器中后，删除 `TextView`。从调板中拖入一个 `Button`，使其位于左边缘：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n\
  图 44-8\n\n要配置起始，选择 图 44-9 中标记为 `start` 的约束：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n\
  图 44-9\n\n接下来，在 `ConstraintSet` 中选择 `button` 条目。选中条目后，点击 (C) 创建一个新的约束：\n\n```xml\n\
  <KeyCycle\n      motion:framePosition=\"0\"\n      motion:target=\"@+id/button\"\
  \n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"0dp\"/>\n```\n\n使用属性窗口设置顶部、左侧和底部约束：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n\
  图 44-10\n\n选择 图 44-11 中标记为 `end` 的约束：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n\
  图 44-11\n\n重复这些步骤创建一个新的约束，这次是针对顶部、底部和右侧边缘：\n\n```xml\n<KeyCycle\n      motion:framePosition=\"\
  100\"\n      motion:target=\"@+id/button\"\n      motion:wavePeriod=\"1\"\n    \
  \  motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  150dp\"/>\n```\n\n## 44.5 创建周期\n\n下一步是使用 `Cycle Editor` 为动画生成关键帧。当 `Cycle Editor`\
  \ 运行时，参考 图 44-12 所示的控制面板：\n\n![](img/as_4.0_keycycle_editor.jpg)\n图 44-12\n\n使用标记为\
  \ A 的菜单，将要修改的属性从 `rotation` 更改 `translationY`。\n\n接下来使用 `Cycle` 控件 (B) 选择周期 `0`，这样面板中的其他更改将应用于第一个周期。将\
  \ `Period` 滑块移动到 `1`，并将 `translationY` 滑块移动到 `60`，如 图 44-13 所示（参考 XML 面板查看精确的 `translationY`\
  \ 值）：\n\n![](img/as_4.0_keycycle_editor.jpg)\n图 44-13\n\n选择 `File -> Parse XML`\
  \ 菜单选项查看图中的更改。使用 表 44-1 中列出的值，配置关键帧 1 到 4 的设置（记住你已经配置了 `KeyCycle 0` 列的设置）：\n\n|\
  \ | KeyCycle 0 | KeyCycle 1 | KeyCycle 2 | KeyCycle 3 | KeyCycle 4 |\n| --- | ---\
  \ | --- | --- | --- | --- |\n| Position | 0 | 25 | 50 | 75 | 100 |\n| Period | 1\
  \ | 2 | 3 | 2 | 1 |\n| translationY | 60 | 60 | 150 | 60 | 60 |\n\n完成这些更改后，关键帧集的\
  \ XML 应该如下：\n\n```xml\n<KeyFrameSet>\n    <KeyCycle\n      motion:framePosition=\"\
  0\"\n      motion:target=\"@+id/button\"\n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"\
  0dp\"\n      motion:waveShape=\"sin\"/>\n    ...\n</KeyFrameSet>\n```\n\n\n\n\n\
  ```xml\n    android:translationY=\"60dp\"/>\n\n    <KeyCycle\n        motion:framePosition=\"\
  25\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  2\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"60dp\"/>\n    <KeyCycle\n        motion:framePosition=\"\
  50\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  3\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"150dp\"/>\n    <KeyCycle\n        motion:framePosition=\"\
  75\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  2\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"60dp\"/>\n    <KeyCycle\n        motion:framePosition=\"\
  100\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  1\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"60dp\"/>\n</KeyFrameSet>\n```\n\n要查看带有新循环的图形，请选择 `File\
  \ -> Parse XML` 菜单选项以刷新波形图，它现在应该如[图 44-14]所示所示。\n\n![](img/as_4.0_keycycle_editor_cyclekeys_complete.jpg)\n\
  图 44-14\n\n### 44.6 预览动画\n\n现在可以从循环编辑器（Cycle Editor）工具内部预览基于循环的动画。点击播放按钮（在[图 44-15]中标记为\
  \ A）启动动画。将循环与水平移动相结合，将第二个菜单（B）从静态（Stationary）更改为从到东（West to East）。此外，花些时间尝试时间和线性度设置（C\
  \ 和 D）。\n\n![](img/as_4.0_keycycle_play_buttons.jpg)\n图 44-15\n\n### 44.7 将 KeyFrameSet\
  \ 添加到 MotionScene\n\n在循环编辑器中，仅从 XML 面板选中并复制 `KeyCycle` 元素，将其粘贴到 Android Studio 中\
  \ `res -> xml -> activity_main_scene.xml` 文件的 Transition 部分，使其置于现有的 `KeyFrameSet`\
  \ 标记之间。还要注意增加的持续时间设置以及用于启动动画的 `OnClick` 处理器：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"\
  7000\">\n    <KeyFrameSet>\n        <KeyCycle\n            motion:framePosition=\"\
  0\"\n            motion:motionTarget=\"@+id/button\"\n            motion:wavePeriod=\"\
  1\"\n            motion:waveOffset=\"0dp\"\n            motion:waveShape=\"sin\"\
  \n            android:translationY=\"60dp\"/>\n        <KeyCycle\n            motion:framePosition=\"\
  25\"\n.\n.\n    </KeyFrameSet>\n    <OnClick motion:target=\"@id/button\" motion:click=\"\
  toggle\" />\n```\n\n在继续之前，请检查每个目标是否已正确声明。在编写时，循环编辑器仍使用过时的 `motion:target` 标签。例如：`motion:target=\"\
  @+id/button\"` 需要为五个 `KeyCycle` 条目中的每一个进行更改为：`motion:motionTarget=\"@+id/button\"\
  `。\n\n完成这些更改后，在设备或模拟器上编译并运行应用，点击按钮启动动画。请注意，`KeyCycle` 的波形形成也可以 Android Studio Motion\
  \ 编辑器中查看，如图 4-16 所示：\n\n![](img/as_keycycle_demo.jpg)\n图 44-16\n\n`KeyCycle` 帧集并不限于每个动画只有一个。例如，将以下\
  \ `KeyFrameSet` 添加到 `activity_main_scene.xml` 文件的 Transition 部分，以便为按钮在移动时添加一些旋转效果：\n\
  \n```xml\n<KeyFrameSet>\n    <KeyCycle\n        motion:framePosition=\"0\"\n   \
  \     motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\n   \
  \     motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  60dp\"\n        android:rotation=\"45\"/>\n    <KeyCycle\n        motion:framePosition=\"\
  25\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  2\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"60dp\"\n        android:rotation=\"80\"/>\n    <KeyCycle\n\
  \        motion:framePosition=\"50\"\n        motion:motionTarget=\"@+id/button\"\
  \n        motion:wavePeriod=\"3\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"\
  sin\"\n        android:translationY=\"150dp\"\n        android:rotation=\"45\"/>\n\
  \    <KeyCycle\n        motion:framePosition=\"75\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"2\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"60dp\"\n    \
  \    android:rotation=\"80\"/>\n    <KeyCycle\n        motion:framePosition=\"100\"\
  \n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\n\
  \        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  60dp\"\n        android:rotation=\"45\"/>\n</KeyFrameSet>\n```\n\n### 44.8 总结\n\n\
  循环帧提供了一种构建帧动画的实用方法，涉及匹配波形的大量状态更改。正如本章概述的，使用循环编辑器应用程序可以显著简化生成这些循环帧的过程。\n\n# 45. 使用悬浮操作按钮和\
  \ Snackbar\n\n本章的目标之一是提供材料设计（Material Design）概念的概述。材料设计最初作为 Android 5.0 的一部分引入，是一套设计指南，规定了\
  \ Android 用户界面以及运行在其上的应用的外观和行为。\n\n### 45.1 材料设计\n\n材料设计的原理定义了 Android 环境的整体外观。材料设计由\
  \ Google 的 Android 团队，并规定构成 Android 用户界面和运行在其上的应用中的元素在行为、阴影、动画和样式方面以特定方式显示和运行。材料设计的一个原则是用户界面的元素看起来具有物理深度，并且感觉物品是用物理材料层构建的。例如，按钮通过阴影效果看起来似乎悬浮在它所在布局的表面之上。按下按钮时，按钮会弯曲并抬起，仿佛是由薄材料制成的，释放时会产生涟漪。\n\
  \n材料设计还规定了许多标准用户界面元素的布局和行为。一个关键示例是位于屏幕顶部的应用栏（App Bar）应该外观，以及它相对于活动主要内容内的滚动活动应该如何表现。\n\
  \n作为实现材料设计概念的一部分，Google 还引入了 Android 支持库（Support Library）。该库包含多个组件，允许将材料设计的许多功能构建到\
  \ Android 应用中。这些组件中的两个悬浮操作按钮（Floating Action Button）和 Snackbar 将在本章中介绍，并在随后的章节中介绍许多其他组件。\n\
  \n\n\n\n实现采用 Material 设计原则的 Android 应用所需的许多构建模块包含在 Android Design Support Library\
  \ 中。该库包含了一系列用户界面组件，这些组件可以包含在 Android 应用中，以实现 Material 设计的大部分外观、感觉和行为。库中的两个组件——悬浮按钮（FAB）和\
  \ Snackbar 将在本章中介绍，其他组件将在后面的章节中介绍。\n\n## 45.3 悬浮按钮 (FAB)\n\n悬浮按钮看起来悬浮在应用程序用户界面的上方。它通常用于促进用户界面屏幕中最常见的操作。可以将悬浮按钮放置在屏幕上，允许用户向联系人列表添加条目或在应用内发送电子邮件。例如，图\
  \ 45-1 显示了允许在标准 Android 联系人应用中添加新联系人的悬浮按钮：\n\n![](img/as_contacts_app.jpg)\n\n图\
  \ 45-1\n\n在使用悬浮按钮时，应遵循若干规则以符合 Material 设计指南。悬浮按钮 必须是圆形的，尺寸可以是 56 x 56dp（默认）或 40\
  \ x 40dp（微型）。按钮在手机上距离屏幕边缘至少 16dp，在桌面设备和平和平板设备上至少 24dp。无论尺寸如何，按钮内部必须包含一个大小为 24x24dp\
  \ 的图标，并且建议每个用户界面屏幕只有一个悬浮按钮。\n\n悬浮按钮可以带有动画，或者设计为在触摸时变形为其他项目。例如，悬浮按钮在点击时可以旋转，或变形为另一个元素，例如工具栏或列出相关操作的面板。\n\
  \n## 45.4 Snackbar\n\nSnackbar 组件提供以屏幕底部面板的形式向用户展示信息的方法，如图 45-2 所示。Snackbar 实例包含一条简短的文本消息和一个可选的操作按钮，用户点击该按钮时将执行某项任务。一旦显示，Snackbar\
  \ 将自动超时消失，也可以由用户通过滑动操作手动移除。在 Snackbar 显示期间，应用将继续正常运行并响应用户交互。\n\n![](img/as_snackbar_example.jpg)\n\
  \n图 45-2\n\n在本章的剩余部分中，将创建一个示例应用程序，使用悬浮按钮和 Snackbar 的基本功能向项目列表添加条目。\n\n## 45.5 创建示例项目\n\
  \n从欢迎屏幕选择“New Project”（新建项目）选项，在出现的新项目对话框中，点击“Next”（下一步）按钮之前选择“Basic Views Activity”模板。\n\
  \n在 `Name` 字段中输入 `FabExample` 并指定 `com.ebookfrenzy.fabexample` 为包名。在点击“Finish”（完成）按钮之前，将\
  \ Minimum API 级别设置设置为 `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为 `Java`。\n\n## 45.6 审查项目\n\
  \n由于选择了 Basic Views Activity 模板，该 activity 包含四个布局文件。`activity_main.xml` 文件由一个 `CoordinatorLayout`\
  \ 布局组成，该管理器包含应用栏、Material 工具栏和悬浮按钮的条目。\n\n`content_main.xml` 文件代表 activity 内容区域的布局，包含一个\
  \ `NavHostFragment` 实例。该文件通过以下包含指令嵌入到 `activity_main.xml` 文件中：\n\n```xml\n<include\
  \ layout=\"@layout/content_main\" />\n```\n\n`activity_main.xml` 文件中的悬浮按钮元素读取如下：\n\
  \n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_marginEnd=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @android:drawable/ic_dialog_email\" />\n```\n\n这声明按钮将出现在屏幕右下角，边距由 `values/dimens.xml`\
  \ 文件中的 `fab_margin` 标识表示（在这种情况下，它设置为 16dp）。XML 进一步声明按钮的内部图标将采用标准内置 drawable 电子邮件图标的形式。\n\
  \n空白模板还配置了悬浮按钮，在用户点击时显示 Snackbar 实例。实现此功能的代码可以在 `MainActivity.java` 文件的 `onCreate()`\
  \ 方法中找到，读取如下：\n\n```java\nbinding.fab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"\
  Action\", null).show();\n    }\n});\n```\n\n该代码通过 view 绑定访问悬浮按钮，并添加了一个 `onClickListener`\
  \ 处理器，在按钮被点击时调用。此方法显示一个配置了消息但没有操作的 Snackbar 实例。当项目编译并运行时，悬浮按钮将出现在底部，如图 45-3 所示：\n\
  \n![](img/as_default_fab.jpg)\n\n图 45-3\n\n点击悬浮按钮将触发 `onClickListener` 方法，导致 Snackbar\
  \ 出现在底部：\n\n![](img/as_default_fab.jpg)\n\n图 45-4\n\n## 45.7 移除导航功能\n\n如 Android\
  \ Studio 布局编辑器所述，Basic Views Activity 模板包含多个在 fragment 之间导航的按钮。这些功能对于本教程是不需要的，如果不移除将会导致问题。在继续教程之前，按照以下步骤修改项目：\n\
  \n1. 在项目工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件将其加载到编辑器。\n2.\
  \ 在组件树面板中选择 `SecondFragment` 项并按下键盘删除键从图中移除。\n3. 定位并删除 `SecondFragment.java`（`app\
  \ -> java -> <package name> -> SecondFragment`）和 `fragment_second.xml`（`app -> res\
  \ -> layout -> fragment_second.xml`）文件。\n4. 定位 `FirstFragment.java` 文件，双击将其加载到编辑器，并从\
  \ `onViewCreated()` 方法中移除代码，如下：\n\n```java\nbinding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        NavHostFragment.findNavController(FirstFragment.this)\n            .navigate(R.id.action_FirstFragment_to_SecondFragment);\n\
  \    }\n});\n```\n\n## 45.8 修改悬浮按钮\n\n由于此示例的目标是配置悬浮按钮向列表添加条目，因此按钮上显示的电子邮件图标需要更改为更符合所执行操作的图标。用于按钮的图标名为\
  \ `ic_add_entry.png`，可以在从以下 URL 下载的示例代码 `project_icons` 文件夹中找到：\n\n[`www.payloadbooks.com/product/hedgehogjava`](https://www.payloadbooks.com/product/hedgehogjava%20)\n\
  \n在操作系统的文件导航器中找到此图像并复制图像文件。在项目工具窗口的 `app -> res -> drawable` 项上右键点击并从菜单中选择“粘贴”，将文件添加到文件夹中：\n\
  \n![](img/as_fab_icon_added.jpg)\n\n图 45-5\n\n接下来，编辑 `activity_main.xml` 文件并将图标源从\
  \ `@android:drawable/ic_dialog_email` 更改为 `@drawable/ic_add_entry` 如下：\n\n\n\n\n\
  \n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @drawable/ic_add_entry\" />\n```\n\n在布局预览中，按钮内部的图标将变为加号。\n\n我们还可以通过向 `OnClickListener`\
  \ 添加代码，让悬浮操作按钮在点击时执行几乎任何操作。例如，对 `MainActivity.java` 文件进行以下更改，每次点击按钮时都会调用名为 `displayMessage()`\
  \ 方法来显示 toast 消息：\n\n```java\nimport android.widget.Toast;\n\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        displayMessage(\"Fab clicked\");\n        Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                 .setAction(\"\
  Action\", null).show();\n    }\n});\n\npublic void displayMessage(String message)\
  \ {\n    Toast.makeText(this,message,Toast.LENGTH_SHORT).show();\n}\n```\n\n###\
  \ 45.9 为 Snackbar 添加操作\n\n也可以向 `Snackbar` 添加一个操作，该操作会在用户轻触时执行某项任务。编辑 `MainActivity.java`\
  \ 文件并修改 `Snackbar` 的创建代码，添加一个标题为“My Action”的操作，并配置一个名为 `actionOnClickListener` 的\
  \ `OnClickListener`，该监听器反过来会显示 toast 消息：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                 .setAction(\"My Action\", actionOnClickListener).show();\n   \
  \ }\n});\n```\n\n在 `MainActivity.java` 文件中，添加监听器处理器：\n\n```java\nView.OnClickListener\
  \ actionOnClickListener = new View.OnClickListener() {\n    @Override\n    public\
  \ void onClick(View view) {\n        displayMessage(\"Action clicked\");\n     \
  \   Snackbar.make(view, \"Action Complete\", Snackbar.LENGTH_LONG)\n           \
  \      .setAction(\"Action\", null).show();\n    }\n};\n```\n\n运行应用并点击悬浮操作按钮，此时\
  \ toast 消息和 `Snackbar` 应该都会出现。当 `Snackbar` 可见时，点击 `Snackbar` 中的“My Action”按钮，并验证\
  \ `Snackbar` 上的文字已变为“Action Complete”：\n\n![](img/fab_action_clicked.jpg)\n\n图 45-6\n\
  \n### 45.10 总结\n\n在学习这些功能的示例项目之前，本章提供了物化设计（Material Design）、悬浮操作按钮和 `Snackbar` 的总体概述。\n\
  \n悬浮操作按钮和 `Snackbar` 是 Android 物化设计界面实现方法的一部分。悬浮操作按钮提供了一种在 Android 应用程序特定屏幕内推广最常用操作的方法。`Snackbar`\
  \ 则提供了一种应用程序向用户展示信息并允许用户对其操作的方法。\n\n### 46. 使用 TabLayout 组件创建标签页界面\n\n上一章概述了 Android\
  \ 中物化设计的概念。它引入了设计支持库提供的两个组件，形式为悬浮操作按钮和 `Snackbar`。本章将演示如何使用设计库的另一个组件 `TabLayout`，它可以与\
  \ `ViewPager` 类结合使用，在 Android Activity 中创建一个基于标签页的界面。\n\n### 46.1 ViewPager2 简介\n\
  \n虽然 `ViewPager2` 不属于设计支持库，但在与 `TabLayout` 组件配合使用实现标签页用户界面时，它是一个非常有用的辅助类。`ViewPager2`\
  \ 的主要作用是允许用户翻阅不同的信息页，其中布局片段（fragment）通常代表每一页。与 `ViewPager2` 关联的片段由 `FragmentStateAdapter`\
  \ 类的实例管理。\n\n至少，分配给 `ViewPager2` 的页面适配器（adapter）必须实现两个方法。第一个名为 `getItemCount()`，必须返回要向用户显示的页面片段总数。第二个方法\
  \ `createFragment()` 接收一个页码，并必须返回准备呈现给用户的相应片段对象。\n\n### 46.2 TabLayout 组件概述\n\n\
  正如之前提到的，`TabLayout` 是物化设计引入的组件之一，并包含在设计支持库中。`TabLayout` 的目的是向用户展示一组标签，可以通过选择这些标签来显示不同的页面。标签可以是固定的，也可以是滚动的，用户可以向左或向右滑动以查看当前屏幕上未显示的内容。标签上显示的信息可以是文本、图像或文本与图像的组合。\n\
  \n本章剩余部分将通过创建一个示例项目来演示 `TabLayout` 组件与 `ViewPager2` 结合使用。\n\n### 46.3 创建 TabLayout\n\
  \n从欢迎界面选择 New Project（新建项目），在新项目对话框中选择 Basic Activity 模板。在 Name 字段中输入 `TabLayoutDemo`，并指定\
  \ `com.ebookfrenzy.tablayoutdemo` 为包名。在点击 Finish（完成）按钮之前，将 Minimum API 设置更改为 API\
  \ 26: Android 8.0 (Oreo)，并将 Language 设置为 Java。\n\n项目创建完成后，在布局编辑器中加载 `content_main.xml`\
  \ 文件，选择 `HostFragment` 对象，然后将其删除。由于我们将不会使用 Basic Activity 的导航功能，编辑 `MainActivity.java`\
  \ 文件并修改 `onCreate()` 方法以移除导航代码：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment_content_main);\n    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController);\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                 .setAction(\"Action\", null).show();\n        }\n    });\n}\n\
  ```\n\n最后，删除 `onSupportNavigateUp()` 方法：\n\n```java\n@Override\npublic boolean onSupportNavigateUp()\
  \ {\n    NavController navController = Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    return NavigationUI.navigateUp(navController, appBarConfiguration) || super.onSupportNavigateUp();\n\
  }\n```\n\n### 46.4 创建第一个片段\n\n`TabLayout`上的每个标签在选中时都会显示不同的片段。通过右键点击项目窗口中的 `app ->\
  \ java -> com.ebookfrenzy.tablayoutdemo` 项并选择 New -> Fragment -> Fragment (Blank)\
  \ 选项，创建这些片段中的第一个。在出的对话框中，在 Fragment Name 字段中输入 `Tab1Fragment`，在 Fragment Layout\
  \ Name 字段中输入 `fragment_tab1`。点击 Finish 按钮创建新片段：\n\n![](img/as_tab_layout_fragment_java.jpg)\n\
  \n图 46-3\n\n\n\n\n\n编辑 `Tab1Fragment.java` 文件，如果 Android Studio 没有自动添加，请按照如下所示添加\
  \ `OnFragmentInteractionListener` 接口声明：\n\n```java\nimport android.net.Uri;\n\n\
  public interface OnFragmentInteractionListener {\n    // TODO: Update argument type\
  \ and name\n    void onFragmentInteraction(Uri uri);\n}\n```\n\n将新创建的 `fragment_tab1.xml`\
  \ 文件（位于 `app` -> `res` -> `layout` 下）加载到布局编辑器（Layout Editor）工具，在组件树（Component Tree）面板中右键点击\
  \ `FrameLayout` 条目，并选择 `Convert FrameLayout to ConstraintLayout` 菜单。在弹出的对话框中，点击\
  \ `OK` 之前确认已勾选所有转换选项。将布局的 ID 更改为 `constraintLayout`。\n\n一旦布局转换为 `ConstraintLayout`，从布局中删除\
  \ `TextView`。从调色板（Palette）中找到 `TextView` 控件，将其拖动到布局的中心位置。编辑对象的文本（text）属性使其显示为“Tab\
  \ 1 Fragment”，将字符串提取为命名为 `tab_1_fragment` 的资源，然后点击工具栏上的 `Infer Constraints`推理约束）按钮。此时，布局应该与图\
  \ 46-4 一致：\n\n![](img/as_3.5_tab_layout_fragment_ui.jpg)\n图 46-4\n\n## 46.5 复制 Fragment\n\
  \n到目前为止，项目包含了四个所需的 Fragment 之一。复制第一个 Fragment 会比使用之前的步骤创建剩余三个 Fragment 要快。每个 Fragment\
  \ 都由一个布局 XML 文件和一个 Java 类文件组成，每个文件都需要复制。\n\n在项目（Project）工具窗口中右键点击 `fragment_tab1.xml`\
  \ 文件，并从弹出的菜单中选择 `Copy`复制）选项。右键点击布局条目，这次选择 `Paste`粘贴）选项。在弹出的对话框中点击 `OK` 按钮之前，将新布局文件命名为\
