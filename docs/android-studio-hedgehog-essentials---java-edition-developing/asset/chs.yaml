  \n重复执行上述复制步骤两次，为剩余的两个 Fragment 创建布局和类文件。完成这些步骤后，项目结构应与图 46-5 一致：\n\n![](img/as_tab_layout_project_files_java.jpg)\n\
  图 46-5\n\n## 46.6 添加 TabLayout 和 ViewPager2\n\n现在 Fragment 的创建过程已经完成，下一步是向主活动布局文件添加\
  \ `TabLayout` 和 `ViewPager2`。编辑 `activity_main.xml` 文件并按照以下 XML 列表所示添加这些元素。注意 `TabLayout`\
  \ 组件嵌入在 `AppBarLayout` 元素中，而 `ViewPager2` 放置在 `AppBarLayout` 之后：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n\n    <com.google.android.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\">\n\n        <androidx.appcompat.widget.Toolbar\n            android:id=\"\
  @+id/toolbar\"\n            android:layout_width=\"match_parent\"\n            android:layout_height=\"\
  ?attr/actionBarSize\"\n            android:background=\"?attr/colorPrimary\" />\n\
  \n        <com.google.android.material.tabs.TabLayout\n            android:id=\"\
  @+id/tabLayout\"\n            android:layout_width=\"match_parent\"\n          \
  \  android:layout_height=\"wrap_content\"\n            app:tabMode=\"fixed\" />\n\
  \n    </com.google.android.material.appbar.AppBarLayout>\n\n    <androidx.viewpager2.widget.ViewPager2\n\
  \        android:id=\"@+id/view_pager\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        app:layout_behavior=\"\
  @string/appbar_scrolling_behavior\" />\n\n    <com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \        android:id=\"@+id/fab\"\n        android:layout_width=\"wrap_content\"\n\
  \        android:layout_height=\"wrap_content\"\n        android:layout_gravity=\"\
  bottom|end\"\n        android:layout_margin=\"16dp\"\n        app:srcCompat=\"@android:drawable/ic_dialog_email\"\
  \ />\n\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n```\n\n 创建 创建 Adapter\n\
  \n本示例将使用 `ViewPager2` 方法来处理分配给 `TabLayout` 的 Fragment，需要在项目中添加子自 `FragmentStateAdapter`\
  \ 的类来管理用户选择标签项时显示的 Fragment。\n\n在项目窗口中右键点击 `com.ebookfrenzy.tablayoutdemo` 条目并选择\
  \ `New -> Java Class`get。在新类对话框中，在 `Name:` 字段输入 `TabPagerAdapter`，选择列表中的 `Class`\
  \ 项并按 `Return` 键。\n\n编辑 `TabPagerAdapter.java` 文件使其内容如下：\n\n```java\npackage com.ebookfrenzy.tablayoutdemo;\n\
  \nimport androidx.annotation.NonNull;\nimport androidx.fragment.app.*;\nimport androidx.viewpager2.adapter.FragmentStateAdapter;\n\
  \npublic class TabPagerAdapter extends FragmentStateAdapter {\n    int tabCount;\n\
  \    public TabPagerAdapter(@NonNull FragmentActivity fragmentActivity, int numberOfTabs)\
  \ {\n        super(fragmentActivity);\n        this.tabCount = numberOfTabs;\n \
  \   }\n\n    @NonNull\n    @Override\n    public Fragment createFragment(int position)\
  \ {\n        switch (position) {\n            case 0:\n                return new\
  \ Tab1Fragment();\n            case 1:\n                return new Tab2Fragment();\n\
  \            case 2:\n                return new Tab3Fragment();\n            case\
  \ 3:\n                return new Tab4Fragment();\n            default:\n       \
  \         return null;\n        }\n    }\n\n    @Override\n    public int getItemCount()\
  \ {\n        return tabCount;\n    }\n}\n```\n\n### 46.7 执行初始化任务\n\n剩余的任务涉及初始化 `TabLayout`、`ViewPager2`\
  \ 和 `TabPagerAdapter` 实例，并声明主活动类实现四个标签 Fragment 的交互监听器。编辑 `MainActivity.java` 文件使其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.tablayoutdemo;\n```\n\n\n\n\n\n```java\nimport\
  \ android.net.Uri;\n\nimport com.google.android.material.tabs.TabLayoutMediator;\n\
  \npublic class MainActivity extends AppCompatActivity implements\n    Tab1Fragment.OnFragmentInteractionListener,\n\
  \    Tab2Fragment.OnFragmentInteractionListener,\n    Tab3Fragment.OnFragmentInteractionListener,\n\
  \    Tab4Fragment.OnFragmentInteractionListener {\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        configureTabLayout();\n  \
  \  }\n\n    protected void configureTabLayout() {\n        for (int i = 0; i < 4;\
  \ i++) {\n            binding.tabLayout.addTab(binding.tabLayout.newTab());\n  \
  \      }\n        final TabPagerAdapter adapter = new TabPagerAdapter\n        \
  \        (this, binding.tabLayout.getTabCount());\n        binding.viewPager.setAdapter(adapter);\n\
  \        new TabLayoutMediator(binding.tabLayout, binding.viewPager,\n         \
  \       (tab, position) -> tab.setText(\"Tab \" + (position + 1) + \" Item\")).attach();\n\
  \    }\n\n    @Override\n    public void onFragmentInteraction(Uri uri) {\n\n  \
  \  }\n}\n```\n\n代码首先创建了四个标签，并将它们如下添加到 `TabLayout` 实例中：\n\n```java\nfor (int i =\
  \ 0; i < 4; i++) {\n    binding.tabLayout.addTab(binding.tabLayout.newTab());\n\
  }\n```\n\n接下来，创建 `TabPagerAdapter` 类的实例。请注意，创建 `TabPagerAdapter` 实例的代码传递了分配给 `TabLayout`\
  \ 组件的标签数量。然后，将 `TabPagerAdapter` 实例赋值为 `ViewPager2` 实例的适配器：\n\n```java\nfinal TabPagerAdapter\
  \ adapter = new TabPagerAdapter\n        (this, binding.tabLayout.getTabCount());\n\
  binding.viewPager.setAdapter(adapter);\n```\n\n最后，使用 `TabLayoutMediator` 类的实例来连接\
  \ `TabLayout` 和 `ViewPager2` 对象：\n\n```java\nnew TabLayoutMediator(binding.tabLayout,\
  \ binding.viewPager,\n        (tab, position) -> tab.setText(\"Tab \" + (position\
  \ + 1) + \" Item\")).attach();\n```\n\n该类确保 `TabLayout` 标签与当前选中的 fragment 保持同步。此过程涉及确保在每个标签上显示正确的文本。在这种情况下，文本被配置为读取“Tab\
  \ <n> Item”，其中 <n> 被替换为当前选中标签的数字。\n\n### 46.8 测试应用程序\n\n在设备或模拟器上编译并运行该应用，确保选择一个标签会导致相应的\
  \ fragment 出现在屏幕的内容区域：\n\n![](img/as_tab_layout_running.jpg)\n\n图 46-6\n\n### 46.9\
  \ 自定义 TabLayout\n\n此示例项目中的 `TabLayout` 是使用固定模式（fixed mode）配置的。这种模式适用于数量有限且标题较短的标签。在使用固定模式时，标签数量更多或标题较长可能会迅速变成问题，正如图\
  \ 46-7 所示：\n\n![](img/as_4.1_tab_layout_truncated.jpg)\n\n图 46-7\n\n为了使标签适应可用的显示宽度，`TabLayout`\
  \ 使用了多行文本。尽管如此，第二行仍然仍被截断了，导致无法看到完整标题。解决此问题的最佳方案是将 `TabLayout` 切换到可滚动模式（scrollable\
  \ mode）。在这种模式下，标题将以全长度、单行格式出现，允许用户通过滑动水平滚动可用项目，正如图 46-8 所示：\n\n![](img/as_4.1_tab_layout_scrollable.jpg)\n\
  \n图 46-8\n\n要将 `TabLayout` 切换到可滚动模式，将 `activity_main.xml` 布局资源文件中的 `app:tabMode`\
  \ 属性从“fixed”更改为“scrollable”\n\n```xml\n<android.support.design.widget.TabLayout\n\
  \    android:id=\"@+id/tabLayout\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"wrap_content\"\n    app:tabMode=\"scrollable\"\n  \
  \  app:tabGravity=\"fill\"/>\n</android.support.design.widget.AppBarLayout>\n```\n\
  \n在固定模式下，可以配置 `TabLayout` 来控制标签项的显示方式，以占据屏幕上的可用空间。这是通过 `app:tabGravity` 属性控制的，其结果在更宽的显示器（如横屏模式下的平板电脑）上更为明显。例如，设置为“fill”时，项将均匀分布整个\
  \ `TabLayout` 的宽度，如图 46-9 所示：\n\n![](img/as_4.1_tab_layout_fill.jpg)\n\n图 46-9\n\
  \n将属性值更改为“center”将导致项相对于标签栏的中心进行定位：\n\n![](img/as_4.1_tab_layout_center.jpg)\n\n\
  图 46-10\n\n### 46.10 总结\n\n`TabLayout` 是 material design 引入的组件之一。`TabLayout` 的目的是在选中时展示一系列标签项。与\
  \ `ViewPager2` 和 fragment 结合时，可以相对容易地创建标签布局。\n\n## 47. 使用 RecyclerView 和 CardView\n\
  \n`RecyclerView` 和 `CardView` 控件共同工作，以卡片的形式提供可滚动的信息列表。这两个类的详细信息都将在本章中介绍。\n\n####\
  \ 47.1 RecyclerView 概述\n\n正如使用浮动按钮和 Snackbar 中概述 `ListView` 类一样，`RecyclerView` 的目的是允许信息以滚动列表的形式呈现给用户。然而，`RecyclerView`\
  \ 比 `ListView` 具有若干优势。特别是 `RecyclerView` 在管理视图方面更为高效，它会在视图离开屏幕时复用现有视图而不是创建新视图（这就是“回收”的由来）。这提高了性能并减少了列表使用的资源。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器来控制如何向用户呈现列表项：\n\n- `LinearLayoutManager`：列表项以水平或垂直列表的形式呈现。\n\
  ![](img/Image2427.jpg)\n图 47-1\n\n- `GridLayoutManager`：项以网格格式呈现。这种管理器适用于列表项大小相同的情况。\n\
  ![](img/Image2436.jpg)\n图 47-2\n\n- `StaggeredGridLayoutManager`：项以交错网格格式呈现。这种管理器适用于列表项大小不一的情况。\n\
  ![](img/Image2443.jpg)\n图 47-3\n\n对于内置管理器无法提供所需布局的情况，可以通过子类 `RecyclerView.LayoutManager`\
  \ 类来实现自定义布局管理器。\n\n`RecyclerView` 中显示的每个列表项都是作为 `ViewHolder` 类实例创建的。`ViewHolder`\
  \ 实例包含了 `RecyclerView` 显示列表项所需的所有内容，包括显示的信息和用于显示项的视图布局。\n\n与 `ListView` 一，`RecyclerView`\
  \ 依赖于适配器来作为 `RecyclerView` 实例与要向用户显示的数据之间的中间人。适配器作为 `RecyclerView.Adapter` 类的子类创建，并至少必须实现以下方法，这些方法由分配给适配器的\
  \ `RecyclerView` 对象在不同点调用：\n\n- `getItemCount()`：此方法必须返回列表中要显示的项的数量。\n- `onCreateViewHolder()`：此方法创建并返回一个带有用于显示数据的视图的\
  \ `ViewHolder` 对象。该视图通常通过加载 XML 布局文件创建。\n\n\n\n\n\n* `onBindViewHolder()` – 此方法接收由\
  \ `onCreateViewHolder()` 方法创建的 `ViewHolder` 对象，以及一个表示即将显示的列表项的整数值。`ViewHolder` 对象中包含了由\
  \ `onCreateViewHolder()` 方法分配的布局。`onBindViewHolder()` 方法负责将与指定项对应的文本和图形填充到布局中的视图中，并将该对象返回给\
  \ `RecyclerView`，由其将其呈现给用户。\n\n在布局中添加 `RecyclerView` 只需要在显示该组件的 activity 的 XML 内容布局文件中添加相应的元素即可。例如：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\n    tools:context=\"\
  .MainActivity\"\n    tools:showIn=\"@layout/activity_card_demo\">\n\n    <androidx.recyclerview.widget.RecyclerView\n\
  \        android:id=\"@+id/recycler_view\"\n        android:layout_width=\"0dp\"\
  \n        android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        tools:listItem=\"\
  @layout/card_layout\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上面的示例中，`RecyclerView` 已嵌入到主 activity 布局文件的 `CoordinatorLayout` 中，并带有 `AppBar`\
  \ 和 `Toolbar`。这提供了一些额外功能，例如配置 `Toolbar` 和 `AppBar`，当用户在 `RecyclerView` 中向上滚动时，它们滑出屏幕（该主题在与\
  \ AppBar 和 Collapsing Toolbar Layout 工作显示了三个 `CardView` 实例，配置为显示一个由 `ImageView`\
  \ 和两个 `TextView` 组成的布局：\n\n![](img/Image24511.jpg)\n\n图 47-4\n\n与 `CardView` 实例一起呈现的用户界面布局定义在\
  \ XML 布局资源文件中，并在运行时加载到 `CardView` 中。`CardView` 布局可以使用标准布局管理器（如 `RelativeLayout`\
  \ 和 `LinearLayout`）包含任何复杂性的布局。下面的 XML 布局文件表示了一个由 `RelativeLayout` 和单个 `ImageView`\
  \ 组成的卡片视图布局。卡片被配置为提升以创建阴影效果，并带有圆角显示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.cardview.widget.CardView\n    xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:id=\"\
  @+id/card_view\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_margin=\"5dp\"\n    card_view:cardCornerRadius=\"\
  12dp\"\n    card_view:cardElevation=\"3dp\"\n    card_view:contentPadding=\"4dp\"\
  >\n    <RelativeLayout\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\">\n        <ImageView\n            android:id=\"@+id/image\"\n   \
  \         android:layout_width=\"match_parent\"\n            android:layout_height=\"\
  200dp\"\n            android:scaleType=\"centerCrop\" />\n    </RelativeLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n与 `RecyclerView` 结合，`onCreateViewHolder()`\
  \ 方法填充布局，将其分配给 `ViewHolder` 并返回给 `RecyclerView`。\n\n### 47.3 总结\n\n本章介绍了 `RecyclerView`\
  \ 和 `CardView`。`RecyclerView` 提供了一种高效的列表显示方式。`CardView` 对于以卡片形式呈现数据非常有用。\n\n## 48.\
  \ RecyclerView 教程\n\n本章将创建一个同时使用 `CardView` 和 `RecyclerView` 来创建滚动列表的示例。\n\n###\
  \ 48.1 创建 CardDemo 项目\n\n从欢迎屏幕选择 New Project，在新项目对话框中选择 Basic Views Activity 模板。在\
  \ Name 字段中输入 `CardDemo` 并指定包名为 `com.ebookzy.carddemo`。在点击 Finish 按钮之前，将 Minimum\
  \ API 设置为 API 26: Android 8.0 (Oreo)，并将语言设置为 Java。\n\n### 48.2 修改 项目\n\n由于选择了 Basic\
  \ Views Activity，布局包含一个项目所需的悬浮按钮。在 Layout Editor 中加载 `activity_main.xml` 布局文件，选择悬浮按钮并按删除键将其从布局移除。编辑\
  \ `MainActivity.java`，并如下所示从 `onCreate` 方法中移除悬浮按钮和导航代码：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_content_main);\n    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"替换为你自己的操作\"\
  , Snackbar.LENGTH_LONG)\n                .setAction(\"Action\", null).show();\n\
  \        }\n    });\n}\n```\n\n此外，移除 `onSupportNavigateUp()` 方法，然后打开 `content_main.xml`\
  \ 文件并从布局中删除 `nav_host_content_main` 对象，只保留 ConstraintLayout。\n\n### 48.3 设计 CardView\
  \ 布局\n\n卡片包含的视图布局将在独立的 XML 布局文件中定义。在 Project 工具窗口，右键点击 `app -> res -> layout` 项并选择\
  \ New -> Layout Resource File 菜单选项。在新 Resource 对话框中，在 File name 字段中输入 `card_layout`并在\
  \ root element 字段中输入 `androidx.cardview.widget.CardView`，然后点击 OK 按钮。\n\n将 `card_layout.xml`\
  \ 文件加载到 Layout Editor 工具，切换到 Code 模式，并修改布局使其如下：\n\n\n\n\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:id=\"@+id/card_view\"\n    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"\
  #80B3EF\"\n    app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n  \
  \  app:contentPadding=\"4dp\" >\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        android:id=\"@+id/relativeLayout\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"wrap_content\"\n        android:padding=\"16dp\"\
  >\n        <ImageView\n            android:id=\"@+id/itemImage\"\n            android:layout_width=\"\
  100dp\"\n            android:layout_height=\"100dp\"\n            app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n            app:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n       \
  \     android:id=\"@+id/itemTitle\"\n            android:layout_width=\"236dp\"\n\
  \            android:layout_height=\"39dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:textSize=\"30sp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n\
  \            android:id=\"@+id/itemDetail\"\n            android:layout_width=\"\
  236dp\"\n            android:layout_height=\"16dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:layout_marginTop=\"8dp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\" />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n### 48.4 添加 RecyclerView\n\n选择 `content_main.xml`\
  \ 布局文件，从调色板的 `Containers` 部分将 `RecyclerView` 对象拖到布局中，使其位于屏幕中心，此时它将自动调整大小以填充整个屏幕。使用\
  \ `Infer constraints`（推断约束）按钮添加任何缺失的布局约束。使用 `Attributes` 窗口，将 `RecyclerView` 实例\
  \ `ID` 更改为 `recyclerView`，并将 `layout_width` 和 `layout_height` 属性更改为 `match_constraint`。\n\
  \n### 48.5 添加图像文件\n\n除了两个 `TextView` 外，卡片布局还包含一个 `ImageView`，已配置 `Recycler adapter`\
  \ 以显示图像。在项目项目之前，必须添加这些图像。项目将使用的图像命名为 `android_image_<n>.jpg`，可以在以下地址提供的示例代码 `project_icons`\
  \ 文件夹中找到：https://www.payloadbooks.com/product/hedgehog\n\n在您的操作系统的文件管理器中找到这些图像并复制这八张图片。在项目窗口中右键点击\
  \ `app` -> `res` -> `drawable` 项，并选择 `Paste` 将文件添加到文件夹：`card_demo_images.jpg`（图\
  \ 48-1）\n\n### 48.6 创建 RecyclerView 适配器\n\n如上一章所述，`RecyclerView` 需要一个适配器来处理列表项的创建。在项目窗口中右键点击\
  \ `app` -> `java` -> `com.ebookfzy.carddemo` 项，选择 `New -> Java Class` 选项向项目添加此新类。在新类对话框中，在\
  \ `Name` 字段输入 `RecyclerAdapter`，并在列表中选择 `Class`，然后按回车键创建新的 Java 文件。\n\n编辑新的 `RecyclerAdapter.java`\
  \ 文件以添加一些导入指令并声明该类自 `RecyclerView.Adapter`。与其创建一个单独的类来提供要显示的数据，不如在适配器中添加一些基础数组作为应用的数据：\n\
  \n```java\npackage com.ebookfzy.carddemo;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.ImageView;\n\
  import android.widget.TextView;\nimport androidx.annotation.NonNull;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n    final String[] titles = {\"Chapter One\", \"Chapter Two\", \"Chapter Three\"\
  , \"Chapter Four\", \"Chapter Five\", \"Chapter Six\", \"Chapter Seven\", \"Chapter\
  \ Eight\"};\n    final String[] details = {\"Item one details\", \"Item two details\"\
  , \"Item three details\", \"Item four details\", \"Item five details\", \"Item six\
  \ details\", \"Item seven details\", \"Item eight details\"};\n    final int[] images\
  \ = { R.drawable.android_image_1, R.drawable.android_image_2, R.drawable.android_image_3,\
  \ R.drawable.android_image_4, R.drawable.android_image_5, R.drawable.android_image_6,\
  \ R.drawable.android_image_7, R.drawable.android_image_8 };\n```\n\n`ViewHolder`\
  \ 类包含一个 `ImageView` 和两个 `TextView` 变量，以及一个将这些变量初始化为 `card_layout.xml` 中引用的构造方法：\n\
  \n```java\nstatic class ViewHolder extends RecyclerView.ViewHolder {\n    ImageView\
  \ itemImage;\n    TextView itemTitle;\n    TextView itemDetail;\n\n    ViewHolder(View\
  \ itemView) {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.itemImage);\n\
  \        itemTitle = itemView.findViewById(R.id.itemTitle);\n        itemDetail\
  \ = itemView.findViewById(R.id.itemDetail);\n    }\n}\n```\n\n`onCreateViewHolder`\
  \ 方法的实现是需要添加到 `RecyclerAdapter.java` 中的下一个项：\n\n```java\n@NonNull\n@Override\npublic\
  \ ViewHolder onCreateViewHolder(ViewGroup viewGroup, int i) {\n    View v = LayoutInflater.from(viewGroup.getContext()).inflate(R.layout.card_layout,\
  \ viewGroup, false);\n    return new ViewHolder(v);\n}\n```\n\n此方法由 `RecyclerView`\
  \ 调用以获取 `ViewHolder` 对象。它填充布局文件 `card_layout.xml` 并创建一个已初始化的 `ViewHolder` 类实例，然后将其返回给\
  \ `RecyclerView`。\n\n`onBindViewHolder` 方法的目的是为 `ViewHolder` 对象中的布局层次填充要显示的数据。它接收一个\
  \ `ViewHolder` 对象和一个指示要显示的列表项的整数值。现在应该添加此方法，使用项目编号作为数据数组的索引。然后使用 `ViewHolder` 类构造方法中创建的引用在布局上显示这些数据：\n\
  \n```java\n@Override\npublic void onBindViewHolder(ViewHolder viewHolder, int i)\
  \ {\n    viewHolder.itemTitle.setText(titles[i]);\n    viewHolder.itemDetail.setText(details[i]);\n\
  \    viewHolder.itemImage.setImageResource(images[i]);\n}\n```\n\n适配器的最后一个要求是实现\
  \ `getItemCount` 方法，在当前情况下，它返回 `titles` 数组的大小：\n\n```java\n@Override\npublic int\
  \ getItemCount() {\n    return titles.length;\n}\n```\n\n\n\n\n\n```java\nreturn\
  \ titles.length;\n\n}\n```\n\n## 48.7 初始化 RecyclerView 组件\n\n此时，项目包含一个 `RecyclerView`\
  \ 实例、用于 `CardView` 实例的 XML 布局文件以及一个 `RecyclerView` 适配器（adapter）。在测试目前进度之前，最后一步是使用\
  \ `layout manager` 初始化 `RecyclerView`，创建 `adapter` 实例并将该实例分配给 `RecyclerView` 对象。为了本示例，`RecyclerView`\
  \ 将配置为使用 `LinearLayoutManager` 布局选项。\n\n这里有一点小复杂之处，因为我们需要能够使用视图绑定（view binding）从\
  \ `MainActivity` 类内部访问 `recyclerView` 组件。问题是 `recyclerView` 包含在 `content_main.xml`\
  \ 布局文件中，而该文件又包含在 `activity_main.xml` 文件中。为了能够访问 `content_main.xml` 文件，我们需要在包含它时为其分配一个\
  \ `id`。要执行此操作，请编辑 `activity_main.xml` 文件并修改 `include` 元素，使其如下所示：\n\n```xml\n<include\n\
  \    android:id=\"@+id/contentMain\"\n    layout=\"@layout/content_main\" />\n```\n\
  \n为被包含的文件分配了 `id` 后，可以使用以下绑定访问 `recyclerView` 组件：\n\n`binding.contentMain.recyclerView`\n\
  \n现在编辑 `MainActivity.java` 文件并修改 `onCreate()` 方法以实现初始化代码：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\
  \nimport androidx.recyclerview.widget.LinearLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private RecyclerView\
  \ recyclerView;\n    private RecyclerView.LayoutManager layoutManager;\n    private\
  \ RecyclerView.Adapter adapter;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        setSupportActionBar(toolbar);\n        layoutManager\
  \ = new LinearLayoutManager(this);\n        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n}\n```\n\n## 48.8 测试应用程序\n\n在物理设备或模拟器会上编译并运行应用，然后滚动列表中的不同的卡片项目：\n\n![](img/as_card_demo_running.jpg)\n\
  \n图 48-2\n\n## 48.9 响应卡片选择\n\n该项目的最后阶段是使列表中的卡片变为可选，这样点击卡片时就会触发应用内的事件。对于此示例，卡片将被配置为在用户点击时在显示器上显示消息。为了响应点击，需要修改\
  \ `ViewHolder` 类，在每个项目视图上分配一个 `OnClickListener`。编辑 `RecyclerAdapter.java` 文件并修改\
  \ `ViewHolder` 类声明，使其如下所示：\n\n```java\nimport com.google.android.material.snackbar.Snackbar;\n\
  \nclass ViewHolder extends RecyclerView.ViewHolder {\n    ImageView itemImage;\n\
  \    TextView itemTitle;\n    TextView itemDetail;\n\n    ViewHolder(View itemView)\
  \ {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.item_image);\n\
  \        itemTitle = itemView.findViewById(R.id.item_title);\n        itemDetail\
  \ = itemView.findViewById(R.id.item_detail);\n        itemView.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
  \ v) {\n            }\n        });\n    }\n}\n```\n\n现在可以在 `onClick` 处理程序体中添加代码，以显示指示卡片已被点击的消息。鉴于点击后执行的操作可能取决于点击了哪张卡片，因此识别选定的卡片也很重要。此信息可以通过调用\
  \ `RecyclerView.ViewHolder` 类的 `getAdapterPosition()` 方法获取。在 `RecyclerAdapter.java`\
  \ 文件中，向 `onClick` 处理程序中添加代码，使其如下所示：\n\n```java\n@override\npublic void onClick(View\
  \ v) {\n    int position = getAdapterPosition();\n    Snackbar.make(v, \"Click detected\
  \ on item \" + position, Snackbar.LENGTH_LONG).show();\n}\n```\n\n最后一个任务是在项目项被点击时启用\
  \ Material Design 的波纹效果（ripple effect）。这涉及在布局的 `CardView` 中添加一些属性：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n   \
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/card_view\"\n \
  \   android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:clickable=\"true\"\n    android:foreground=\"?attr/selectableItemBackground\"\
  \n    app:cardBackgroundColor=\"#FFFFFF\"\n    app:cardRadius=\"12dp\"\n    app:cardElevation=\"\
  3dp\">\n```\n\n## 48.10 总结\n\n本章详细介绍了结合 `CardView` 和 `RecyclerView` 组件以显示可滚动卡片式项目列表的步骤。示例还涵盖了对列表项的点击检测，包括识别选中的项目以及启用波纹效果的视觉反馈。\n\
  \n## 49. 布局编辑器示例教程\n\n上一章中创建的 CardDemo 项目提供了一个很好的例子，说明了在测试完成的应用之前，从布局编辑器内部准确评估用户界面将如何显示将是多么困难的。\n\
  \n从过去一段时间以来，Android Studio 布局编辑器一直提供了指定简单属性的能力，这些属性仅在设计布局时有效。例如，可以将一个仅在设计时使用的字符串资源分配给布局编辑器中的\
  \ `TextView`，但它在应用运行时不会显示。随着布局编辑器中引入了样本数据支持，此功能得到了显著扩展，并将用于本章以改进布局编辑器的体验。\n\n###\
  \ 49.1 为项目添加样本数据\n\n在用户界面布局的设计阶段，`RecyclerView` 实例（图 49-1）与上一章末尾测试的运行应用几乎没有相似。为了演示样本数据的使用，现在将修改项目，使得完全填充的卡片出现在布局编辑器内部的\
  \ `RecyclerView` 中。但在在此之前，值得注意的是布局编辑器拥有一组预配置的样本数据模板，可以在设计用户界面时使用。要查看其中一些示例，请将 `content_main.xml`\
  \ 布局文件加载到布局编辑器并选择 `RecyclerView` 实例。右键点击 `RecyclerView` 并选择 `Set Sample Data` 菜单选项以显示设计时视图属性面板：\n\
  \n![](img/as_3.2_design_time_attributes.jpg)\n\n图 49-2\n\n将模板更改为 Email Client 并将并将计数更改为\
  \ 12，注意 `RecyclerView` 变化以显示来自模板的数据：\n\n![](img/as_3.6_recyclerview_sample_data_email.jpg)\n\
  \n图 49-3\n\n\n\n\n\n这些模板可以用于在无需任何额外工作的情况下显示示例数据，并且通常提供足够完成布局设计的信息。然而，在本示例中，将使用示例数据来显示\
  \ `RecyclerView` 中的卡片，就像它们在运行应用程序中预期出现的一样。在布局编辑器仍加载 `content_main.xml` 文件的情况下，切换到代码（Code）模式并找到\
  \ `RecyclerView` 元素，其内容如下：\n\n```xml\n<androidx.recyclerview.widget.RecyclerView\n\
  \    android:id=\"@+id/recyclerView\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:itemCount=\"12\"\n    tools:listitem=\"@layout/recycler_view_item\"\
  \ />\n```\n\n注意当前配置的两个特殊 `tools` 属性，用于在列表中显示 12 个项目，每个项目都使用名为 `recycler_view_item.xml`\
  \ 的文件中的布局。布局编辑器提供了一系列可以在布局文件中配置的 `tools` 选项。虽然涵盖所有这些设置超出了本书的范围，但每个设置的完整描述可以在以下 URL\
  \ 找到：\n\nhttps://developer.android.com/studio/write/tool-attributes#toolssample_resources\n\
  \n上述引用的 `recycler_view_item.xml` 文件是在选择示例数据模板时由布局编辑器自动生成的，可以在项目（Project）工具窗口中找到。\n\
  \n切换回设计（Design）模式，在选中 `RecyclerView` 后，使用设计时视图属性（Design-time View Attributes）面板将模板切换回默认设置。`recycler_view_item.xml`\
  \ 文件将从项目中被删除，同时 `content_main.xml` XML 文件中的两个 `tools` 属性行也随随之删除（如果 Android Studio\
  \ 未能自动删除这些行，则可以从代码视图中手动删除）。\n\n要切换到使用卡片布局显示示例数据，请添加 `listitem` 属性以引用 `card_layout.xml`\
  \ 文件。在布局中选中 `RecyclerView` 后，在属性（Attributes）工具窗口中搜索 `listitem` 属性，并在属性字段中输入如图 49-4\
  \ 所示的 `@layout/card_layout`：\n\n![](img/as_sample_data_list_item.jpg)\n\n图 49-4\n\
  \n注意每个列表项现在都显示了卡片布局，尽管没有任何图像且使用的是示例文本数据：\n\n![](img/as_sample_list_items.jpg)\n\n\
  图 49-5\n\n下一步是在卡片布局的视图中显示一些图像和不同的文本。这既可以是布局编辑器提供的模板示例数据，也可以是专门为此项目添加的自定义示例数据。将 `card_layout.xml`\
  \ 文件加载到布局编辑器中，选中 `ImageView` 并按照本章前面的介绍显示设计时视图属性面板。从 `srcCompat` 菜单中，选择下方图 49-6\
  \ 所示的内置背景/风景图集：\n\n![](img/as_sample_data_images.jpg)\n\n图 49-6\n\n接下来，右键点击 `itemTitle`\
  \ `TextView` 对象，选择“设置示例数据”（Set Sample Data）菜单选项，并在设计属性面板中选择 `cities` 文本选项。对 `itemDetail`\
  \ 视图重复此步骤，这次选择如图 49-7 所示的 `full_names` 选项：\n\n![](img/as_sample_data_names.jpg)\n\
  \n图 49-7\n\n在设计模式下打开 `content_main.xml` 文件，注意 `RecyclerView` 现在正在使用内置图像和示例文本数据：\n\
  \n![](img/as_sample_data_stage1.jpg)\n\n图 49-8\n\n## 49.2 使用自定义示例数据\n\n本章的最后一步是演示如何在布局编辑器中使用自定义示例数据图像。这需要创建一个示例数据目录并添加一些文本和图像文件。在项目（Project）工具窗口中，右键点击\
  \ app 入目并选择“新建  Sample 数据目录”（New -> Sample Data Directory）菜单选项，此时项目工具窗口中将出现名为 `sampledata`\
  \ 的新目录。如果看不到新文件夹，将项目工具窗口从 Android 模式切换到 Project 模式，并在图 49-9 所示的 `CardDemo -> app`\
  \ 下找到文件夹：\n\n![](img/as_sample_data_folder.jpg)\n\n图 49-9\n\n右键点击 `sampledata` 目录，创建一个名为\
  \ `images` 的目录，并按照上一章概述的步骤将 Android 图像复制并粘贴到新文件夹中。在 `card_layout.xml` 文件中再次显示 `ImageView`\
  \ 的设计视图属性面板，这次点击“浏览”（Browse）链接并在资源（Resources）对话框中选择新添加的 Android 图像（如果文件夹未出现，请尝试重建项目）：\n\
  \n![](img/as_sample_data_resource_manager.jpg)\n\n图 49-10\n\n再次右键点击 `sampledata`\
  \ 目录，选择“新建 文件”（New -> File）选项，将文件命名为 `chapters` 并输入以下内容：\n\n```\nChapter One\nChapter\
  \ Two\nChapter Three\nChapter Four\nChapter Five\nChapter Six\nChapter Seven\n```\n\
  \n接下来，创建第二个文本文件 `items`，内容如下：\n\n```\nItem details\nItem two details\nItem three\
  \ details\nItem four details\nItem five details\nItem six details\nItem seven\n\
  ```\n\n有了示例数据文件后，剩下的就是在 `card_layout.xml` 中引用它们如下：\n\n```xml\n<TextView\n    android:id=\"\
  @+id/itemTitle\"\n    android:layout_width=\"236dp\"\n    android:layout_height=\"\
  39dp\"\n    android:layout_marginStart=\"16dp\"\n    android:textSize=\"30sp\"\n\
  \    app:layout_constraintLeft_rightOf=\"@+id/image\"\n    app:layout_constraintStart_toEndOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    tools:text=\"@sample/chapters\"\
  \ />\n\n<TextView\n    android:id=\"@+id/itemDetail\"\n    android:layout_width=\"\
  236dp\"\n    android:layout_height=\"16dp\"\n    android:layout_marginStart=\"16dp\"\
  \n    android:layout_marginTop=\"8dp\"\n    app:layout_constraintLeft_rightOf=\"\
  @+id/image\"\n    app:layout_constraintStart_toEndOf=\"parent\"\n    app:layout_constraintTop_toBottomOf=\"\
  @+id/itemTitle\"\n    tools:text=\"@sample/items\" />\n```\n\n重建应用程序并返回 `content_main.xml`\
  \ 文件中的布局设计，自定义示例数据和图像现在应该显示了：\n\n![](img/as_sample_data_completed.jpg)\n\n图 49-11\n\
  \n与其使用两个文本文件和图像集引用，另一种选项是在 JSON 文件中声明示例数据。例如：\n\n```json\n{\n  \"mydata\": [\n \
  \   {\n      \"chapter\": \"Chapter One\",\n      \"details\": \"Item one details\"\
  ,\n      \"image\": \"@sample/images\"\n    },\n    {\n      \"chapter\": \"Chapter\
  \ Two\",\n      \"details\": \"Item two details\",\n      \"image\": \"@sample/images\"\
  \n    }\n  ]\n}\n```\n\n假设上述内容位于名为 `chapterdata.json` 的文件中，则在视图 XML 元素中引用方式如下：\n\
  \n```xml\n<ImageView\n    tools:src=\"@sample/chapterdata.json/mydata/image\" />\n\
  \n<TextView\n    tools:text=\"@sample/chapterdata.json/mydata/chapter\" />\n\n<TextView\n\
  \    tools:text=\"@sample/chapterdata.json/mydata/details\" />\n```\n\n### 49.3\
  \ 总结\n\n本章演示了如何在布局编辑器中使用示例数据，以提供用户界面在运行时更真实的表示。本教程涵盖的步骤包括使用预存的示例数据模板以及集成自定义示例数据。\n\
  \n## 50. 使用 AppBar 和折叠工具栏布局\n\n\n\n\n\n在本章中，我们将探索如何自定义 Activity 布局中的应用栏（app bar），并使其对其他屏幕视图中发生的滚动事件做出响应。通过结合\
  \ `CoordinatorLayout` 与 `AppBarLayout` 和 `CollapsingToolbarLayout` 容器，可以配置应用栏显示图像并实现视图的淡入淡出动画。例如，可以配置列表的向上滚动动作，使得应用栏在向上滚动时从视图中消失，而在执行向下滚动时重新出现。\n\
  \n本章将从概述构成应用栏的元素开始，介绍各种应用栏配置的示例。\n\n# 50.1 AppBar 的结构剖析\n\n应用栏是应用运行时显示在屏幕顶部的区域，它可以配置为包含各种项目，包括状态栏、工具栏（toolbar）、标签栏（tab\
  \ bar）和柔性空间区域。例如，图 50-1 显示了一个包含状态栏、工具栏和标签栏的应用栏：\n\n![](img/Image24271.jpg)\n\n图\
  \ 50-1\n\n可以使用空白的背景色填充柔性空间区域，或者如图 50-2 所示，在 `ImageView` 对象上显示图像：\n\n![](img/Image24361.jpg)\n\
  \n图 50-2\n\n正如本章后续部分将演示的，如果 Activity 用户界面布局的主内容区域包含可滚动的内容，则可以配置应用栏元素，随着屏幕内容的滚动而进行展开和收缩。\n\
  \n### 50.2 示例项目\n\n对于此示例，将对前面的章节创建的 `CardDemo` 项目进行修改，该项目名为“Android RecyclerView\
  \ 和 CardView 教程”。首先，启动 Android Studio 并加载此项目。\n\n项目加载后，运行应用并注意：当向上滚动列表时，工具栏保持可见，如图\
  \ 50-3 所示：\n\n![](img/as_app_bar_1.jpg)\n\n图 50-3\n\n第一步是更改配置，使工具栏在向上滚动运动期间收缩，并在向下滚动时展开。\n\
  \n# 50.3 协调 RecyclerView 和工具栏\n\n将 `activity_main.xml` 文件加载到布局编辑器工具中，切换到 Code 模式，并查看\
  \ XML 布局设计，其层级结构由图 50-4 中的图表示：\n\n![](img/as3.0_appbar_coordinatorlayout_tree.jpg)\n\
  \n图 50-4\n\n层级结构的顶层是 `CoordinatorLayout`，正如其所示，它协调其包含的各种子视图元素之间的交互。例如，在“使用浮动按钮和\
  \ Snackbar”中强调的，`CoordinatorLayout` 会自动将浮动按钮向上滑动，以适应 `Snackbar` 的出现，然后在状态栏消失后将按钮移回。\n\
  \n`CoordinatorLayout` 同样可以用于根据层级结构中某些视图的滚动动作，导致应用栏元素滑入或滑出视图。图 50-4 所示的布局层级结构中的其中一个元素是\
  \ `ConstraintLayout`。要实现这种协调行为，必须在发生滚动的元素以及需要与滚动进行协调的元素上设置属性。\n\n在滚动元素（在本例中为 `RecyclerView`）上，必须将\
  \ `android:layout_behavior` 属性设置为 `appbar_scrolling_view_behavior`。在 `content_main.xml`\
  \ 文件中，找到顶层 `ConstraintLayout` 元素并注意该属性已默认设置：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\" >\n```\n\n\
  接下来，在布局编辑器中打开 `activity_main.xml` 文件，切换到 Code 模式，并找到 `AppBarLayout` 元素。注意视图层级中 `AppBarLayout`\
  \ 的唯一子元素是 `Toolbar`。为了使工具栏对 `RecyclerView` 中发生的滚动事件做出响应，必须在该元素上设置 `app:layout_scrollFlags`\
  \ 属性。赋给此属性的值取决于所需的交互性质，并且由以下一个或多个部分组成：\n\n- `scroll` – 表示视图将滚动到屏幕外。如果不设置此项，在滚动事件期间，视图将固定在屏幕顶部。\n\
  - `enterAlways` – 当与 `scroll` 选项配合使用时，向上滚动运动会导致视图收回。在此模式下，任何向下滚动运动都会导致视图重新出现。\n\
  - `enterAlwaysCollapsed` – 设置在视图上时，该视图在向下滚动运动达到列表限制之前将不会从收起状态展开。如果设置了 `minHeight`\
  \ 属性，视图将在初始滚动期间出现，但仅到达到最小高度为止。随后它将保持在那里。\n- `exitUntilCollapsed` – 设置后，视图将在向上滚动运动期间收缩，直到达到\
  \ `minHeight` 阈值。此时，它将保持该高度，直到滚动方向改变。注意此选项仅在同时使用 `enterAlways` 和 `scroll` 选项时有效。例如：\n\
  \n```xml\napp:layout_scrollFlags=\"scroll|enterAlwaysCollapsed\"\nandroid:minHeight=\"\
  20dp\"\n```\n\n对于此示例，在 `Toolbar` 上设置 `scroll` 和 `enterAlways` 选项如下：\n\n```xml\n\
  <com.google.android.material.appbar.MaterialToolbar\n    android:id=\"@+id/toolbar\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"?attr/actionBarSize\"\
  \n    app:layout_scrollFlags=\"scroll|enterAlways\" />\n```\n\n设置好属性后，重新运行应用并在 `RecyclerView`\
  \ 中进行向上滚动。这将导致工具栏消失（图 50-5）。向下滚动运动将使工具栏重新出现。\n\n![](img/as_card_demo_appbar_scroll.jpg)\n\
  \n图 50-5\n\n# 50.4 引入折叠工具栏布局\n\n`CollapsingToolbarLayout` 容器通过为应用栏及其折叠提供更多选项和控制，增强了标准工具栏。`CollapsingToolbarLayout`\
  \ 类旨在作为 `AppBarLayout` 的子添加。它提供了诸如在工具栏收缩和展开时自动调整标题字体大小的功能。视差模式（parallax mode）允许应用栏中的指定内容在收缩时消失，而固定模式（pin\
  \ mode）则允许应用栏元素在收缩期间保持在固定位置。\n\n还可以使用 `scrim` 选项来指定工具栏在折叠序列期间过渡的颜色。\n\n为了演示这些功能，将修改\
  \ `activity_main.xml` 文件中的应用栏，使用 `CollapsingToolbarLayout` 类，并添加一个 `ImageView` 以更好地演示视差模式。使用\
  \ `CollapsingToolbarLayout` 的新视图层级结构由图 50-6 中的图表示：\n\n![](img/as3.0_appbar_collapsing_tree.jpg)\n\
  \n图 50-6\n\n将 `activity_main.xml` 文件加载到布局编辑器的 Code 模式中，并修改布局使其内容如下：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n```\n\n\n\n\n\n\
  ```xml\n<xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    android:fitsSystemWindows=\"true\"\
  \n    tools:context=\".MainActivity\">\n    <com.google.android.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:fitsSystemWindows=\"true\">\n        <com.google.android.material.appbar.CollapsingToolbarLayout\n\
  \            android:id=\"@+id/collapsing_toolbar\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"match_parent\"\n           \
  \ app:layout_scrollFlags=\"scroll|enterAlways\"\n            android:fitsSystemWindows=\"\
  true\"\n            app:expandedTitleMarginBottom=\"30dp\"\n            app:expandedTitleMarginStart=\"\
  15dp\"\n            app:expandedTitleMarginEnd=\"64dp\">\n            <ImageView\n\
  \                android:id=\"@+id/backdrop\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"200dp\"\n              \
  \  android:scaleType=\"centerCrop\"\n                android:fitsSystemWindows=\"\
  true\"\n                app:layout_collapseMode=\"parallax\"\n                android:src=\"\
  @drawable/appbar_image\" />\n            <com.google.android.material.appbar.MaterialToolbar\n\
  \                android:id=\"@+id/toolbar\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"?attr/actionBarSize\"\n\
  \                app:layout_scrollFlags=\"scroll|enterAlways\"\n               \
  \ app:layout_collapseMode=\"pin\" />\n        </com.google.android.material.appbar.CollapsingToolbarLayout>\n\
  \    </com.google.android.material.appbar.AppBarLayout>\n    <include\n        android:id=\"\
  @+id/contentMain\"\n        layout=\"@layout/content_main\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n使用你操作系统的文件导航器，在书籍代码示例下载的 `project_icons` 文件夹中找到 `appbar_image.jpg` 图片文件并复制。在\
  \ Project 窗口中右键点击 `app -> res -> drawable` 项并选择“粘贴”。\n\n运行应用时，标题栏应如图 50-7 所示：\n\n\
  ![](img/as_app_bar_2.jpg)\n图 50-7\n\n向上滚动列表将导致标题栏折叠。在收缩过程中，图像将淡变为由 `scrim` 属性定义的颜色，同时标题字体大小会按相应的比例缩小，直到只显示工具栏：\n\
  \n![](img/as_app_bar_3.jpg)\n图 50-8\n\n工具栏在滚动动作的初始阶段保持可见（如果继续向上滚动动作，工具栏也会移出视图），这是因为\
  \ `activity_main.xml` 文件中的工具栏元素被配置为使用 `app:layout_collapseMode=\"pin\"`。如果将折叠模式设置为\
  \ `parallax`，工具栏将随图像一起收回。继续向上滚动动作将导致工具栏也折叠，只留下状态栏可见：\n\n![](img/as_app_bar_4.jpg)\n\
  图 50-9\n\n由于 `CollapsingToolbarLayout` 元素的 `scroll flags` 属性包含了 `enterAlways` 选项，向下滚动动作将导致标题栏再次展开。要固定工具栏使其在向上滚动过程中不再移出视图，请将\
  \ `activity_main.xml` 文件中 `CollapsingToolbarLayout` 元素的 `layout_scrollFlags` 属性中的\
  \ `enterAlways` 替换为 `exitUntilCollapsed`，如下：\n\n```xml\n<com.google.android.material.appbar.CollapsingToolbarLayout\n\
  \    android:id=\"@+id/collapsing_toolbar\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    app:layout_scrollFlags=\"scroll|exitUntilCollapsed\"\
  \n    android:fitsSystemWindows=\"true\"\n    app:expandedTitleMarginBottom=\"30dp\"\
  \n    app:expandedTitleMarginStart=\"15dp\"\n    app:expandedTitleMarginEnd=\"64dp\"\
  >\n```\n\n## 50.5 更改标题和 scrim 颜色\n\n作为最后一个任务，编辑 `MainActivity.java` 文件并在 `onCreate()`\
  \ 方法中添加一些代码，以更改折叠布局实例上的标题文本，并设置不同的 scrim 颜色（注意 scrim 颜色也可以在布局资源文件中设置）：\n\n```java\n\
  package com.ebookrenzy.carddemo;\n\nimport com.google.android.material.appbar.CollapsingToolbarLayout;\n\
  import android.graphics.Color;\n\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    binding.collapsingToolbar.setTitle(\"My Toolbar Title\");\n    binding.collapsingToolbar.setContentScrimColor(Color.GREEN);\n\
  \    layoutManager = new LinearLayoutManager(this);\n    binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \    adapter = new RecyclerAdapter();\n    binding.contentMain.recyclerView.setAdapter(adapter);\n\
  }\n```\n\n最后运行一次应用，并注意新标题出现在标题栏中，并且现在滚动会导致工具栏在退出时变为绿色。\n\n### 50.6 总结\n\n大多数应用顶部的标题栏可以由多个元素组成，包括工具栏、标签布局和图像视图。当嵌入\
  \ `CoordinatorLayout` 父布局时，有多种不同的选项可以控制标题栏对内容滚动事件的行为。为了对这种行为进行更好的控制，`CollapsingToolbarLayout`\
  \ 布局提供了更多的标题栏内容相对于滚动的展开和收缩。\n\n## 51. Android Studio Primary/Detail Flow 教程\n\n\
  本章将在介绍 Primary/Detail 界面设计概念之前，详细探讨组成 Primary/Detail Flow 的元素。随后将创建一个示例应用程序，演示修改模板以满足开发人员特定需求的步骤。\n\
  \n### 51.1 什么是 Primary/Detail Flow\n\n主/详情流是一种界面设计概念，其中项目列表（称为主列表）显示给用户。当从列表中选择某项时，与该项目相关的更多信息将在详情格中呈现给用户。例如，电子邮件应用程序可能由一个包含发送者地址和消息主题的接收消息主列表组成。从主列表中选择一条消息后，邮件正文将显示在详情格中。\n\
  \n在横屏模式的平板电脑设备屏幕上，主列表显示在屏幕左侧的窄面板中。屏幕其余部分留给详情格，这种布局被称为双窗模式。图 51-1 展示了主/详情双窗布局，主列表列出了项目，并在详情格中显示项目一的内容：\n\
  \n![](img/as_detail_flow_tablet.jpg)\n图 51-1\n\n在较小的手机尺寸 Android 设备上，主列表占据整个屏幕，详情格在从主列表做出选择后在另一个单独屏幕上出现。在这种模式下，详情屏幕包含一个返回主列表的操作条项。图\
  \ 51-2 例如说明了在 4 英寸手机屏幕上同一项目列表的主屏幕和详情屏幕：\n\n![](img/as_detail_flow_phone.jpg)\n图\
  \ 51-2\n\n### 51.2 创建 Primary/Detail Flow Activity\n\n\n\n\n\n在本章的下一节中，将详细介绍组成主/详情流（Primary/Detail\
  \ Flow）模板的不同元素。实现这一点的最佳方法是使用 `Primary/Detail Views Flow` 模板创建一个项目，并在学习信息时使用它。该项目将作为本章最后教程的基础。\n\
  \n从欢迎屏幕选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `No Activity` 模板。\n\n在 `Name`\
  \ 字段中输入 `PrimaryDetailFlow`，并指定 `com.ebookfrenzy.primarydetailflow` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为\
  \ `Java`。\n\n### 51.3 添加主/详情流 Activity\n\n在 Project（项目）窗口中，右键点击 `app` -> `java`\
  \ -> `com.ebookfrenzy.primarydetailflow` 条目，并选择 `New -> Activity -> Primary/Detail\
  \ Views Flow` 菜单选项。在新 Activity 对话框（图 51-3）中，在点击 `Finish` 按钮之前，确保启用 `Launcher Activity`\
  \ 复选框：\n\n![](img/as_new_primary_detail_activity.jpg)\n\n图 51-3\n\n### 51.4 修改主/详情流模板\n\
  \n虽然 `Primary/Detail Flow` 模板的结构初看起来可能很困惑，但正如将会所示，对于许多主/详情实现需求，该模板提供的许多功能可以保持不变。\n\
  \n在本章的剩余部分中，将对 `PrimaryDetailFlow` 项目进行修改，使主列表显示网站名称列表，并将详情面板更改为包含一个 `WebView` 对象而不是当前的\
  \ `TextView`。当用户选择一个网站时，相应的网页随后将在详情面板中加载并显示。\n\n### 51.5 更改内容模型\n\n目前示例的内容由 `PlaceholderContent`\
  \ 类文件定义。因此，首先选择 `PlaceholderContent.java` 文件（位于 Project 窗口中 `app` -> `java` -> `com.ebookfrenzy.primarydetailflow`\
  \ -> `placeholder` 文件夹）并查看代码。文件底部声明了一个名为 `PlaceholderItem` 的类，该类目前能够存储三个 `String`\
  \ 对象（代表内容和详情字符串）和一个 `ID`。另一方面，更新后的项目需要每个项目对象包含一个 `ID` 字符串、一个网站名称字符串以及一个相应的网站 URL\
  \ 字符串。为了添加这些功能，请修改 `PlaceholderItem` 类，使其内容如下：\n\n```java\npublic static class PlaceholderItem\
  \ {\n\n    public String id;\n\n    public String website_name;\n\n    public String\
  \ website_url;\n\n    public PlaceholderItem(String id, String website_name,\n \
  \           String website_url)\n    {\n        this.id = id;\n        this.website_name\
  \ = website_name;\n        this.website_url = website_url;\n    }\n\n    @Override\n\
  \    public String toString() {\n            return website_name;\n    }\n}\n```\n\
  \n注意，封装类 `PlaceholderContent` 目前包含一个 `for` 循环，通过多次调用名为 `createPlaceholderItem()`\
  \ 和 `makeDetails()` 的方法添加 25 个项目。这些代码的大部分将不再需要，并应如下所示从类中删除：\n\n```java\npublic static\
  \ final Map<String, PlaceholderItem> ITEM_MAP = new HashMap<String, PlaceholderItem>();\n\
  \nprivate static final int COUNT = 25;\n\nstatic {\n    // Add some sample items.\n\
  \    for (int i = 1; i <= COUNT; i++) {\n        addItem(createPlaceholderItem(i));\n\
  \    }\n}\n\nprivate static void addItem(PlaceholderItem item) {\n    ITEMS.add(item);\n\
  \    ITEM_MAP.put(item.id, item);\n}\n\nprivate static PlaceholderItem createPlaceholderItem(int\
  \ position) {\n    return new PlaceholderItem(String.valueOf(position), \"Item \"\
  \ + position, makeDetails(position));\n}\n\nprivate static String makeDetails(int\
  \ position) {\n    StringBuilder builder = new StringBuilder();\n    builder.append(\"\
  Details about Item: \").append(position);\n    for (int i = 0; i < position; i++)\
  \ {\n        builder.append(\"\\nMore details information here.\");\n    }\n   \
  \ return builder.toString();\n}\n```\n\n此代码需要修改以用所需的网站数据初始化数据模型：\n\n```java\npublic\
  \ static final Map<String, PlaceholderItem> ITEM_MAP =\n        new HashMap<String,\
  \ PlaceholderItem>();\n\nstatic {\n    // Add 3 sample items.\n    addItem(new PlaceholderItem(\"\
  1\", \"Payload Publishing\",\n            \"https://www.payloadbooks.com\"));\n\
  \    addItem(new PlaceholderItem(\"2\", \"Amazon\",\n            \"https://amazon.com\"\
  ));\n    addItem(new PlaceholderItem(\"3\", \"New York Times\",\n            \"\
  https://nytimes.com\"));\n}\n```\n代码现在利用 `PlaceholderItem` 来存储 ID 和名称。\n\n### 51.6\
  \ 更改详情面板\n\n详情面板的布局（当用户从主列表中选择项目时显示的屏幕）包含在 `activity_item.xml` 文件中，该文件又包含一个用于显示实际内容的\
  \ `FrameView` 实例。如果应用处于单面板模式，该框架将显示 `fragment_item.xml` 文件；而在多面板模式下，它将显示 `fragment_item.xml`\
  \ (600dp)。Android 提供的 `fragment_item.xml` 模板包含一个 `Coordinator` 布局，其中有一个 app bar、浮动按钮和文本视图。对于本示例，我们需要显示\
  \ `WebView`，因此打开此文件并删除 `item_container` 以外的所有视图。最简单的方法是在如下所示的 `Component Tree` 中选择不需要的视图：\n\
  \n![](img/as_delete_items)\n\n从 `Palette` 拖入 `WebView` 对象并将其放置在布局中心，将 `id` 更改为 `website_detail`。接下来编辑\
  \ `fragment_item.xml` (600dp)，在将 `WebView` 拖入布局之前删除默认的 `TextView`，再次将 `id` 更改为 `website_detail`。这两个文件的布局现在应该像图\
  \ 51-5 所示：\n\n![](img/as_3.5_master_detail.jpg)\n\n图 51-5\n\n### 51.7 修改 ItemDetailFragment\
  \ 类\n\n此时用户界面已经修改，但对应的 Java 类仍为 `TextView` 设计。通过双击 Project 窗口中的 `ItemDetailFragment.java`加载该类的源码。\n\
  \n为了加载当前选中项目对应的网页，需要更改几行代码。完成更改后，代码应如下：\n\n```java\nimport android.webkit.ResourceRequest;\n\
  import android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\npublic class\
  \ ItemDetailFragment extends Fragment {\n\n    @Override\n    public View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container,\n            Bundle savedInstanceState) {\n   \
  \     binding = FragmentItemDetailBinding.inflate(inflater, container, false);\n\
  \        View rootView = binding.getRoot();\n        mToolbarLayout = rootView.findViewById(R.id.toolbar_layout);\n\
  \        mTextView = binding.ItemDetail;\n        updateContent();\n        rootView.setOnDragListener(dragListener);\n\
  \        return rootView;\n    }\n\n    private void updateContent() {\n       \
  \ if (mItem != null) {\n            binding.websiteDetail.setWebViewClient(new WebViewClient(){\n\
  \                @Override\n                public boolean shouldOverrideUrlLoading(\n\
  ```\n\n\n\n\n\n```java\nWebView view, WebResourceRequest request) {\n    return\
  \ super.shouldOverrideUrlLoading(\n        view, request);\n}\n});\nbinding.websiteDetail.loadUrl(mItem.website_url);\n\
  }\n}\n}\n```\n\n在上述代码中，删除了对工具栏布局和项目详情文本元素的引用，这些元素之前已从 `fragment_item_detail.xml`\
  \ 文件中移除。\n\n接下来，修改了 `updateContent()` 以访问 `website_detail` 视图（它之前是 `TextView`，现在是\
  \ `WebView`），并从所选项目中提取网站 URL。创建了 `WebViewClient` 类的实例，并为其分配了 `shouldOverrideUrlLoading()`\
  \ 回调方法。该方法的实现是为了强制系统使用 `WebView` 实例来加载页面，而不是使用 Chrome 浏览器。\n\n### 51.8 修改 `ItemListFragment`\
  \ 类\n\n还需要对 `ItemListFragment.java` 文件进行细微更改，以确保网站名称出现在主列表中。编辑此文件，定位到 `onBindViewHolder()`\
  \ 方法，并修改 `setText()` 方法调用，如下所示引用网站名称：\n\n```java\n@Override\npublic void onBindViewHolder(final\
  \ ViewHolder holder, int position) {\n    holder.mIdView.setText(mValues.get(position).id);\n\
  \    holder.mContentView.setText(mValues.get(position).website_name);\n}\n```\n\n\
  ```java\n// 获取内容的 id\nClipData.Item clipItem = new ClipData.Item(mValues.get(position).id);\n\
  ClipData dragData = new ClipData(\n    ((PlaceholderContent.PlaceholderItem) v.getTag()).website_name,\n\
  \    new String[]{ClipDescription.MIMETYPE_TEXT_PLAIN},\n    clipItem\n);\n```\n\
  \n### 51.9 添加 Manifest 权限\n\n最后一步是通过 manifest 文件为应用程序添加互联网权限。这将允许 `WebView` 对象访问互联网并下载网页。导航到\
  \ Project 工具窗口中的（app -> manifests），并加载 `AndroidManifest.xml` 文件，双击它将其加载到编辑器中。加载后，向文件中添加相应的权限行：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.PrimaryDetailflow\"\
  \ >\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\n\
  \        android:allowBackup=\"true\"\n```\n\n### 51.10 运行应用程序\n\n在配置适当的模拟器或连接的\
  \ Android 设备上编译并运行应用程序。根据显示屏的大小，应用程序将以小屏或双窗格模式出现。无论如何，主列表都应该预先显示内容模型中定义的三个网站名称。选择一个项目将导致相应的网站出现在详情窗格中，如双窗格模式下的图\
  \ 51-6 所示：\n\n![](img/as_primary_detail_running.jpg)\n\n图 51-6\n\n### 51.11 总结\n\
  \n主/详情用户界面由一个主列表组成，当选择某个项目时，会在详情窗格中显示关于该选择的附加信息。主/详情流（Primary/Detail Flow）是 Android\
  \ Studio 提供的一个模板，允许快速且相对轻松地创建主/详情布局。本章所示，通过对默认模板文件进行细微修改，可以用极少的代码和设计工作实现广泛基于主/详情的功能。\n\
  \n## 52. Android 服务概述\n\nAndroid `Service` 类旨在允许应用程序启动并执行后台任务。与旨在快速执行任务后退出的广播接收器（broadcast\
  \ receivers）不同，服务的设计是为了执行需要较长时间才能完成的任务（例如通过互联网连接下载文件或向用户流式音乐），但这些任务不需要用户界面。\n\n\
  本章将提供可用服务的概述，包括绑定服务（bound services）和启动服务（intent services）。在涵盖这些基础之后，后续章节将介绍一些服务的运行示例。\n\
  \n### 52.1 Intent Service\n\n如前所述，服务默认在启动它的组件所在的同一个主线程中运行。因此，任何需要服务执行的 CPU 密集型任务都应该在一个新的线程中进行，从而避免对调用应用程序性能产生影响。\n\
  \n`JobIntentService` 类是一个便利类（继承自 `Service` 类），它设置了一个工作线程来处理后台任务，并异步处理每个请求。一旦服务处理了所有队列中的请求，它就会退出。使用\
  \ `JobIntentService` 类时，只需要实现 `onHandleWork()` 方法，其中包含每个请求要执行的代码。\n\n对于不需要同步处理请求的服务，`JobIntentService`\
  \ 是推荐的选项。然而，需要同步处理请求的服务将需要继承自 `Service` 类。\n\n### 52.2 Bound Service\n\n绑定服务（bound\
  \ service）允许启动的组件与服务交互并接收其返回的结果。这种交互也可以通过实现进程间通信（interprocess communication）跨进程边界进行。例如，一个\
  \ activity 可以启动一个服务来处理播放。该 activity 可能会包含一个用户界面，为用户提供暂停播放或跳到下一曲的控制。同样，服务可能需要向 activity\
  \ 通信信息，以指示当前轨道已结束，并提供即将开始的下一曲的详细信息。\n\n组件（在此背景称为客户端）通过调用 `bindService()` 启动并绑定绑定服务。同样，多个组件可以同时绑定到某个服务。当客户端不再需要服务绑定时，应该调用\
  \ `unbindService()` 方法。当最后一个绑定客户端从服务上取消绑定时，Android 运行时系统将终止该服务。需要注意的是，绑定服务也可以通过调用\
  \ `startService()` 启动。一旦启动，组件就可以通过 `bindService()` 调用绑定到它。\n\n绑定服务必须包含 `onBind()`\
  \ 方法的实现，该方法在服务首次创建以及其他客户端随后绑定到正在运行的服务时都会调用。该方法的目的是向绑定客户端返回一个 `IBinder` 类型的对象，其中包含客户端与服务通信所需的信息。\n\
  \n### 52.3 服务的结构\n\n正如前面提到的，服务必须作为 Android `Service` 类（更具体地说是 `android.app.Service`）或其子类（例如\
  \ `android.app.IntentService`）的子类来创建。在子类过程中，根据所创建服务的具体性质，必须重写以下父类回调方法中的一个或多个：\n\n\
  \n\n\n\n- `onStartCommand()` – 当另一个组件通过调用 `startService()` 方法启动服务时，调用此方法。对于绑定服务（bound\
  \ services），不需要实现此方法。\n- `onBind()` – 当组件通过调用 `bindService()` 方法绑定到服务时，调用此方法。在实现绑定服务时，此方法必须返回一个\
  \ `IBinder` 对象，以便与客户端进行通信。\n- `onCreate()` – 意用于执行初始化任务的地方，此方法在调用 `onStartCommand()`\
  \ 或首次调用 `onBind()` 方法之前立即调用。\n- `onDestroy()` – 当服务被销毁时调用此方法。\n- `onHandleWork()`\
  \ – 仅适用于 `JobIntentService` 子类。调用此方法来处理服务的业务逻辑。它在与主应用程序不同的独立线程中执行。\n\n注意，`IntentService`\
  \ 类包含了其对 `onStartCommand()` 和 `onBind()` 回调方法的实现，因此在子类中不需要实现这些方法。\n\n## 52.4 控制已销毁服务的重启选项\n\
  \n`onStartCommand()` 回调方法要求返回一个整数值，以定义当 Android 运行时系统销毁该服务时应该采取何种操作。这些方法的可能返回值如下：\n\
  \n- `START_NOT_STICKY` – 告知系统，如果服务被销毁，则不应重启，除非有等待交付的意图（intents）。\n- `START_STICKY`\
  \ – 表示如果服务在 `onStartCommand()` 方法返回后被销毁，则应在销毁后尽快重启。如果没有等待交付的意图，则使用 `NULL` 意图值调用\
  \ `onStartCommand()` 回调方法。服务销毁时正在处理的意图将被丢弃。\n- `START_REDELIVER_INTENT` – 表示如果服务从\
  \ `onStartCommand()` 回调方法返回后被销毁，则应重启服务并将当前意图重新投递给 `onStartCommand()` 方法，随后是任何待处理的意图。\n\
  \n## 52.5 在清单文件中声明服务\n\n要使服务可用，必须首先在清单文件（manifest file）中声明。这涉及到在现有的 `<application>`\
  \ 条中嵌入一个配置适当的 `<service>` 元素。`<service>` 元素至少包含一个声明服务类名的属性，如下 XML 片段所示：\n\n```xml\n\
  <application\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \ >\n    <activity\n        android:label=\"@string/app_name\"\n        android:name=\"\
  .MainActivity\" >\n        <intent-filter>\n            <action android:name=\"\
  android.intent.action.MAIN\" />\n            <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n        </intent-filter>\n    </activity>\n    <service android:name=\".MyService\"\
  >\n    </service>\n</application>\n</manifest>\n```\n\n默认情况下，服务是公开的，因为它们可以被所在应用程序包之外的组件访问。要将服务设置为私有，必须在清单文件的\
  \ `<service>` 元素中将 `android:exported` 属性声明为 `false`。例如：\n\n```xml\n<service android:name=\"\
  MyService\"\n             android:exported=\"false\">\n</service>\n```\n\n在使用 `JobIntentService`\
  \ 时，清单中的服务声明还必须如下所示请求 `BIND_JOB_SERVICE` 权限：\n\n```xml\n<service\n    android:name=\"\
  .MyJobIntentService\"\n    android:permission=\"android.permission.BIND_JOB_SERVICE\"\
  \ />\n```\n\n如前所述，服务默认在与调用组件相同的进程中运行。要强制服务运行在自己的进程中，请向 `<service>` 元素添加一个 `android:process`\
  \ 属性，并声明一个以冒号（`:`）开头的进程名称：\n\n```xml\n<service android:name=\".MyService\"\n   \
  \ android:exported=\"false\"\n    android:process=\":myprocess\">\n</service>\n\
  ```\n\n冒号前缀表示新进程对本地应用程序是私有的。然而，如果进程名以小写字母而不是冒号开头，则该进程将是全局的，供其他组件使用。\n\n最后，通过与 Activity\
  \ 相同的意图过滤器机制，服务还可以向设备上运行的其他应用程序发布功能。有关意图过滤器的更多细节，请参考[意图概览](Overview of Intents）章节。\n\
  \n## 52.6 启动时运行的服务\n\n鉴于服务的后台性质，在 Android 系统首次启动时需要启动服务并不罕见。可以通过创建一个带有意图过滤器的广播接收器来监听\
  \ `android.intent.action.BOOT_COMPLETED` 来实现这一点。注意，为了运行，此类广播接收器必须请求 `BOOT_COMPLETED`\
  \ 权限。\n\n## 52.7 总结\n\nAndroid 服务是一种强大的机制，允许应用程序在后台执行任务。服务一旦启动，无论调用它的应用程序是否处于前台任务，即使启动服务的组件被销毁，它都将继续运行。\n\
  \n服务继承自 `Service` 类。绑定服务为其他客户端提供了通信接口，并且通常一直运行到最后一个客户端从服务解绑为止。\n\n默认情况下，服务在与调用应用程序相同的进程和主线程中本地运行。因此，应该在服务内部创建一个新线程来处理\
  \ CPU 密集型任务。通过对应用程序清单文件中相应的 `<service>` 条目进行细小的配置更改，可以在单独进程中启动远程服务。\n\n`IntentService`\
  \ 类（`Service` 类的子类）提供了一种在独立工作线程中处理异步服务请求的便利机制。\n\n## 53. Android 意图概览\n\n到本书的现在，应该清楚\
  \ Android 应用程序包含一个或多个 Activity 等。然而，一个尚未详细介绍的领域是一个 Activity 触发另一个 Activity 启动的机制。正如在[Android\
  \ 应用程序剖析]章节中简述的那样，这主要通过意图（Intents）来实现。\n\n### 53.1 意图概览\n\n意图（`android.content.Intent`）是一个\
  \ Activity 启动另一个 Activity 的消息系统。例如，Activity 可以发布意图来请求启动同一应用程序中的另一个 Activity。意图还超越了这一概念，允许\
  \ Activity 请求设备上任何适当注册且配置了权限的 Activity 的服务。考虑一个例子，应用程序中包含一个需要加载并向用户显示网页的 Activity。与其让应用程序包含一个第二个\
  \ Activity 来执行此任务，代码可以向 Android 运行时发送一个意图，请求任何注册了显示网页能力的 Activity 的服务。运行时系统会将请求与设备上的可用\
  \ Activity 进行匹配，并启动匹配的 Activity，或者在存在多个匹配项的情况下允许用户决定使用哪个 Activity。\n\n\n\n\n\n意（Intent）还允许数据从发送活动传输到接收方活动。例如，在之前描述的场景中，发送活动需要将要显示的网页\
  \ URL 发送给第二个活动。同样，接收活动也可以配置为在完成所需任务后将数据返回给发送活动。\n\n虽然在后面的章节中才会介绍，但值得强调的是，除了启动活动外，意还用于启动并与服务（services）以及广播接收器（broadcast\
  \ receivers）进行通信。\n\n意被分为显式意（explicit intents）和隐式意（implicit intents）。\n\n### 53.2\
  \ 显式意 (Explicit Intents)\n\n显式意通过引用目标活的组件名称（即类名）来请求启动特定的活动。当启动与发送活动位于同一个应用程序中的活动时，这种方法最为常见（因为开发者知道类名）。\n\
  \n显式意通过创建 `Intent` 类的实例来发出，并传入活动上下文（activity context）和要启动的活动的组件名称。然后调用 `startActivity()`\
  \ 方法，并将 `intent` 对象作为参数传递。例如，以下代码段发布了一个启动类名为 `ActivityB` 活动的意：\n\n```\nIntent i\
  \ = new Intent(this, ActivityB.class);\nstartActivity(i);\n```\n\n在通过调用 `intent`\
  \ 对象的 `putExtra()` 方法启动之前，可以将将其添加到 `intent` 对象中传输到接收活动。数据必须以键值对的形式添加。以下代码扩展了之前的示例，向意中分别添加了键为\
  \ `\"myString\"` 和 `\"myInt\"` 的字符串和整数值：\n\n```java\nIntent i = new Intent(this,\
  \ ActivityB.class);\ni.putExtra(\"myString\", \"This is a message for ActivityB\"\
  );\ni.putExtra(\"myInt\", 100);\nstartActivity(i);\n```\n\n目标活动作为 `Bundle` 对象的一部分接收数据，可以通过调用\
  \ `getIntent().getExtras()` 获取该对象。`Activity` 类的 `getIntent()` 方法返回启动该活动的意，而 `Intent`\
  \ 类的 `getExtras()` 方法返回一个包含数据的 `Bundle` 对象。例如，要提取传递给 `ActivityB` 的数据值：\n\n```java\n\
  Bundle extras = getIntent().getExtras();\nif (extras != null) {\n    String myString\
  \ = extras.getString(\"myString\");\n    int myInt = extras.getInt(\"myInt\");\n\
  }\n```\n\n当使用意在同一应用程序内启动其他活动时，这些活动必须列在应用程序清单文件（application manifest）。以下 `AndroidManifest.xml`\
  \ 内容正确配置了一个包含名为 `ActivityA` 和 `ActivityB` 活的应用程序：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.intent1.intent1\" >\n    <application\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\" >\n        <activity\n\
  \            android:label=\"@string/app_name\"\n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity\n   \
  \         android:name=\"ActivityB\"\n            android:label=\"ActivityB\" >\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n### 53.3 从活动返回数据\n\
  \n正如上一节的示例所示，虽然数据传输到了 `ActivityB`，但没有办法将数据返回给第一个活动（我们称之为 `ActivityA`）。然而，这可以通过将\
  \ `ActivityB` 作为 `ActivityA` 的子活动（sub-activity）来实现。通过创建 `ActivityResultLauncher`\
  \ 实例来启动子活动。通过调用 `registerForActivityResult()` 方法创建该实例，并以 lambda 的形式传递回调处理器。当子活动返回时，该处理器将被调用并传递返回的数据。一旦创建了\
  \ `ActivityResultLauncher` 实例，就可以带有 `intent` 参数调用它来启动子活动。创建 `ActivityResultLauncher`\
  \ 实例的代码通常如下：\n\n```java\nActivityResultLauncher<Intent> startForResult = registerForActivityResult(\n\
  \    new ActivityResultContracts.StartActivity(),\n    new ActivityResultCallback()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 处理返回数据的代码\n        \
  \    }\n        }\n    });\n```\n\n一旦启动器准备就绪，就可以调用它并传递 `intent`：\n\n```java\nIntent\
  \ i = new Intent(this, ActivityB.class);\nstartForResult.launch(i);\n```\n\n要向父活动返回数据，子活动必须实现\
  \ `finish()` 方法，其目的是创建一个包含数据的新 `intent`，然后调用活的 `setResult()` 方法。结果代码通常为 `RESULT_OK`\
  \ 或 `RESULT_ANCELED`，但也可以根据开发者的需求使用自定义值。以下代码示例展示了一个典型的子活动 `finish()` 方法：\n\n```java\n\
  public void finish() {\n    Intent data = new Intent();\n    data.putExtra(\"returnString\"\
  , \"Message to parent\");\n    setResult(RESULT_OK, data);\n    super.finish();\n\
  \n### 53.4 隐式意 (Implicit Intents)\n\n与引用要启动活动类名的显式意不同，隐式意通过指定要执行的操作和接收活动处理的数据类型来标识要启动的活动。例如，`ACTION_VIEW`\
  \ 操作类型配合 `URI` 对象形式的网页 URL，将指示 Android 系统搜索并启动支持浏览器的活动。以下隐式意在 Android 设备上执行时会导致指定的网页在浏览器中显示：\n\
  \n```java\nIntent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\nstartActivity(intent);\n```\n\n当活动发出上述隐式意时，Android 系统将搜索设备上注册了处理 `ACTION_VIEW`\
  \ 请求的活动。在使用隐式意启动活动之前，用户必须验证或启用该活动。如果未满足这些条件之一，意启动启动活动。在探索这两个选项之前，我们首先需要讨论意过滤器（intent\
  \ filters）。\n\n### 53.5 使用意过滤器 (Intent Filters)\n\n意过滤器是活动向 Android 解析过程宣告其支持的操作和数据处理能力的机制。这些声明还包含了链接验证过程所需的设置。以下\
  \ `AndroidManifest.xml` 文件展示了名为 `MyWebView` 的应用程序中名为 `WebActivity` 的活动的配置，其包含了配置正确的意过滤器：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<application\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:roundIcon=\"@mipmap/ic_launcher_round\"\n    android:supportsRtl=\"\
  true\"\n    android:theme=\"@style/Theme.MyWebView\">\n    <activity android:name=\"\
  WebActivity\">\n        <intent-filter>\n            <action android:name=\"android.intent.action.VIEW\"\
  \ />\n            <data android:scheme=\"https\" android:host=\"www.ebookfrenzy.com\"\
  \ />\n        </intent-filter>\n    </activity>\n</application>\n```\n\n\n\n\n\n\
  ```xml\n<android:exported=\"true\">\n    <intent-filter android:autoVerify=\"true\"\
  >\n        <action android:name=\"android.intent.action.VIEW\" />\n        <category\
  \ android:name=\"android.intent.category.BROWSABLE\" />\n        <category android:name=\"\
  android.intent.category.DEFAULT\" />\n        <data android:scheme=\"https\" />\n\
  \        <data android:host=\"www.ebookfrenzy.com\"/>\n    </intent-filter>\n</activity>\n\
  </application>\n</manifest>\n```\n\n此清单文件配置了 `WebActivity` Activity，使其在意图包含 `https://www.ebookfrenzy.com`\
  \ URL 时，能够响应来自另一个 Activity 的隐式意图并被启动。例如，以下代码将启动 `WebActivity` 模块（假设 `MyWebView`\
  \ 应用已通过用户验证或启用作为支持链接）：\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\n\
  \        Uri.parse(\"https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n\
  ```\n\n### 53.6 自动链接验证\n\n使用网页链接在 Android 设备上启动 Activity 被认为存在潜在的安全风险。为了降低这种风险，用于启动意图的链接必须是经过自动验证的，或者由用户在设备上手动添加为支持链接。要启用自动验证，目标\
  \ Activity 中对应的意图声明必须将 `autoVerify` 设置为 `true`，如下所示：\n\n```xml\n<intent-filter android:autoVerify=\"\
  true\">\n    .\n</intent-filter>\n```\n\n接下来，链接 URL 必须与应用链接所基于的网站相关。这是通过创建一个名为 `assetlinks.json`\
  \ 的数字资产链接文件并将其安装在网站的 `.well-known` 文件夹中实现的。\n\n数字资产链接文件包含一个关系声明（relation statement），允许目标应用使用网站的链接\
  \ URL 启动；以及一个目标声明（target statement），声明了配套应用的包名和该项目的 SHA-256 证书指纹。一个典型的资产链接文件内容可能如下：\n\
  \n```json\n[{\n  \"relation\": [\"delegate_permission/common.handle_all_urls\"],\n\
  \  \"target\": {\n    \"namespace\": \"android_app\",\n    \"package_name\": \"\
  com.ebookfrenzy.mywebview\",\n    \"sha256_cert_fingerprints\":\n    [\"<your certificate\
  \ fingerprint here>\"]\n  }\n}]\n```\n\n注意，你可以手动创建此文件，也可以使用以下 URL 提供的在线工具生成它：\n\
  `https://developers.google.com/digital-asset-links/tools/generator`\n\n在开发 Android\
  \ 应用时，`namespace` 值始终设置为“android_app”，而包名则对应于由意图启动的应用包。最后，证书指纹是用于构建应用的哈希值。当你测试应用时，它将是包含\
  \ `debug.keystore` 文件中的调试证书。在 Windows 系统上，Android Studio 将此文件存储在以下位置：\n\n`\\Users\\\
  <your user name>\\.android\\debug.keystore`\n\n在 macOS 和 Linux 系统上，可以在此处找到文件：\n\n\
  `$HOME/.android/debug.keystore`\n\n一旦找到该文件，可以在终端或命令提示符窗口中运行以下命令获取 SHA 256 指纹：\n\n\
  ```bash\nkeytool -list -v -keystore <path to debug.keystore file here>\n```\n\n\
  当提示输入密码时，输入“android”，随后将出现输出，包括 SHA 256 指纹：\n\n```text\nCertificate fingerprints:\n\
  SHA1: 11:E8:66:11:B6:94:3D:AA:7E:50:63:99:77:B8:6A:90:FF:B6:9C:6D\nSHA256: 7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29\n\
  ```\n\n当你准备好构建应用的发布版时，必须确保将发布版的 SHA256 指纹添加到资产文件中。关于生成发布版密钥库文件的详情请参阅“创建、测试和上传 Android\
  \ Bundle”章节。一旦拥有了发布版密钥库文件，运行上述 `keytool` 命令以获取指纹。\n\n一旦你将数字资产文件放置在网站的正确位置，在设备上安装应用并等待\
  \ 30 秒让链接通过验证。要检查验证状态，在终端运行以下命令：\n\n```bash\nadb shell pm get-app-links --user 0\
  \ com.example.mywebview\n```\n\n输出结果应包含链接已验证的确认：\n\n```text\ncom.example.mywebview:\n\
  \  ID: e399bca-bf58-4cfc-d1a6b0ec\n  Signatures: [7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29\n\
  ```\n\n[/content] (注：由于用户提供的待翻译文本似乎包含了一些重复的翻译片段，如示例中显示的译文逻辑，我已根据“不要重复输出原文”的原则进行了清理翻译)\n\
  \n[content]\n```xml\n<android:exported=\"true\">\n    <intent-filter android:autoVerify=\"\
  true\">\n        <action android:name=\"android.intent.action.VIEW\" />\n      \
  \  <category android:name=\"android.intent.category.BROWSABLE\" />\n        <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n        <data android:scheme=\"\
  https\" />\n        <data android:host=\"www.ebookfrenzy.com\"/>\n    </intent-filter>\n\
  </activity>\n</application>\n</manifest>\n```\n\n此清单文件配置了 `WebActivity` Activity，使其在意图包含\
  \ `https://www.ebookfrenzy.com` URL 时，能够响应来自另一个 Activity 的隐式意图并启动。例如，以下代码将启动 `WebActivity`\
