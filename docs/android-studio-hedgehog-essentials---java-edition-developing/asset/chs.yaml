  }\n```\n\n## 87.7 从命令行运行 Gradle \n\n每个 Android Studio 项目都包含一个 Gradle 包装工具，用于从命令行调用\
  \ `Gradle` 任务。该工具位于每个项目文件夹的根目录下。虽然该包装器在 Windows 系统上可以执行，但在 Linux 和 macOS 上可能需要先启用执行权限才能使用。要启用执行权限，请打开终端窗口，切换到需要该包装器的项目文件夹，并执行以下命令：\n\
  \n```bash\nchmod +x gradlew\n```\n\n一旦文件具有了执行权限，则需要将该文件的位置添加到你的 `$PATH` 环境变量中，或者在名称名前加上\
  \ `./` 才能运行。例如：\n\n```bash\n./gradlew tasks\n```\n\n`Gradle` 将项目构建视为几个不同的任务。通过在项目目录下运行以下命令，可以获取当前项目可用任务的完整列表（如果是在\
  \ macOS 或 Linux 上运行，请记住在命令前加上 `./`）：\n\n```bash\ngradlew tasks\n```\n\n要构建适用于设备或模拟器测试的调试发布版项目，请使用：\n\
  \n```bash\ngradlew assembleDebug\n```\n\n或者，构建一个发布版本：\n\n```bash\ngradlew assembleRelease\n\
  ```\n\n### 87.8 总结\n\n在大多数情况下，`Android Studio` 会无需任何干预即可处理构建。\n\n\n\n\n\n## 设备配对\
