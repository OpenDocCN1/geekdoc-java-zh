  \n### 31.7 让 Toolbar Fragment 与 Activity 通信\n\n当用户触摸 toolbar fragment 中的按钮时，片段类需要从\
  \ `EditText` 视图提取文本和 `SeekBar` 的当前值，并将它们发送到文本片段。如“Android Fragments 简介”所述，片段之间不应直接通信，而应使用嵌入它们的\
  \ activity 作为中间媒介。\n\n此过程的第一步是确保 toolbar fragment 对点击按钮有响应。我们还需要实现一些代码来跟踪 `SeekBar`\
  \ 视图的值。对于此示例，我们将在 `ToolbarFragment` 类中实现这些监听器。选择 `ToolbarFragment.java` 文件并进行修改如下列表所示：\n\
  \n```java\npackage com.ebookfrenzy.fragmentexample;\n\nimport androidx.annotation.NonNull;\n\
  import androidx.annotation.Nullable;\nimport android.content.Context;\nimport android.widget.SeekBar;\n\
  \npublic class ToolbarFragment extends Fragment implements\n                   \
  \             SeekBar.OnSeekBarChangeListener {\n\n    private static int seekvalue\
  \ = 10;\n\n    @Override\n    public void onViewCreated(@NonNull View view,\n  \
  \                           @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view,\
  \ savedInstanceState);\n        binding.seekBar1.setOnSeekBarChangeListener(this);\n\
  \        binding.button1.setOnClickListener(new View.OnClickListener() {\n     \
  \       public void onClick(View v) {\n                buttonClicked(v);\n     \
  \       }\n        });\n    }\n\n    public void buttonClicked (View view) {\n \
  \   }\n\n    @Override\n    public void onProgressChanged(SeekBar seekBar, int progress,\n\
  \                                  boolean fromUser) {\n        seekvalue = progress;\n\
  \    }\n\n    @Override\n    public void onStartTouch(SeekBar arg0) {\n    }\n\n\
  \    @Override\n    public void onStopTouch(SeekBar arg0) {\n    }\n}\n```\n\n在继续之前，我们需要花时间解释上面的代码。首先，该类被声明实现了\
  \ `OnSeekBarChangeListener` 接口。这是因为用户界面包含一个 `SeekBar` 实例，并且片段需要在用户滑动轨道时接收通知以更改字体大小。`OnSeekBarChangeListener`\
  \ 接口的实现要求 `onProgressChanged()`、`onStartTouch()` 和 `onStopTouch()` 方法。这些方法已经实现，但只有\
  \ `onProgressChanged()` 方法执行任务，在此情况下是将新值存储在类开头声明的名为 `seekvalue` 的变量中。还声明了一个用于存储\
  \ `EditText` 对象的引用变量。\n\n此过程的下一阶段是设置监听器，允许片段在点击按钮时调用 activity。这遵循了上一节概述的机制：\n\n\
  ```java\npublic class ToolbarFragment extends Fragment\n    implements SeekBar.OnSeekBarChangeListener\
  \ {\n    private static int seekvalue = 10;\n    private FragmentToolbarBinding\
  \ binding;\n    ToolbarListener activityCallback;\n\n    public interface ToolbarListener\
  \ {\n        public void onButtonClick(int position, String text);\n    }\n\n  \
  \  @Override\n    public void onAttach(Context context) {\n        super.onAttach(context);\n\
  \        try {\n            activityCallback = (ToolbarListener) context;\n    \
  \    } catch (ClassCastException e) {\n            throw new ClassCastException(context.toString()\n\
  \                + \" must implement ToolbarListener\");\n        }\n    }\n\n \
  \   public void buttonClicked (View view) {\n        activityCallback.onButtonClick(seekvalue,\n\
  \            binding.editText1.getText().toString());\n    }\n}\n```\n\n\n\n\n上述实现将导致当用户点击按钮时，属于\
  \ activity 类的名为 `onButtonClick()` 的方法被调用。因此，剩下的工作仅仅是声明该 activity 类实现了新创建的 `ToolbarListener`\
  \ 接口，并实现 `onButtonClick()` 方法。\n\n由于在早期的 Android 版本中使用了 Android Support Library\
  \ 来支持 fragment，因此 activity 也需要更改为继承 `FragmentActivity` 而不是 `AppCompatActivity`。结合这些要求，得到了如下修改的\
  \ `MainActivity.java` 文件：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport androidx.fragment.app.FragmentActivity;\n\
  \nimport android.os.Bundle;\n\npublic class MainActivity extends FragmentActivity\
  \ implements ToolbarFragment.ToolbarListener {\n\n.\n\n.\n\n    public void onButtonClick(int\
  \ fontsize, String text) {\n\n    }\n}\n```\n\n按照目前的代码更改，工具栏碎片（toolbar fragment）将检测用户何时点击按钮，并调用\
  \ activity 上的方法，同时传递 `EditText` 字段的内容和 `SeekBar` 视图的当前设置。现在 activity 的任务是与“文本碎片”（Text\
  \ Fragment）进行通信并传递这些值，以便碎片能够相应更新 `TextView` 对象。\n\n### 31.8 让 Activity 与文本碎片通信\n\
  \n正如“Android Fragments 简介” 所概述的那样，activity 可以获取碎片类实例的引用并调用该对象上的公共方法与碎片进行通信。因此，在\
  \ `TextFragment` 类中，我们现在实现一个名为 `changeTextProperties()` 的公共方法，该方法接受一个字体大小整数和一个显示的新文本字符串作为参数。该方法将使用这些值来修改\
  \ `TextView` 对象。在 Android Studio 编辑面板中，找到并修改 `TextFragment.java` 文件以添加此新方法：\n\n\
  ```java\npackage com.ebookfrenzy.fragmentexample;\n\n.\n\n.\n\npublic class TextFragment\
  \ extends Fragment {\n\n.\n\n.\n\n    public void changeTextProperties(int fontsize,\
  \ String text)\n\n    {\n        binding.textView2.setTextSize(fontsize);\n    \
  \    binding.textView2.setText(text);\n    }\n}\n```\n\n当 `TextFragment` 碎片放置在 activity\
  \ 的布局中，它被赋予了一个 ID：`text_fragment`。使用这个 ID，activity 现在可以获取碎片实例的引用并调用对象上的 `changeTextProperties()`\
  \ 方法。编辑 `MainActivity.java` 文件并如下修改 `onButtonClick()` 方法：\n\n```java\npublic void\
  \ onButtonClick(int fontsize, String text) {\n    TextFragment textFragment =\n\
  \    (TextFragment)\n      getSupportFragmentManager().findFragmentById(R.id.text_fragment);\n\
  \    textFragment.changeTextProperties(fontsize, text);\n}\n```\n\n### 31.9 测试应用程序\n\
  \n该项目的编码工作现在已经完成，最后一个剩余任务是运行应用程序。当应用程序启动时，主 activity 将启动，并创建创建显示两个碎片。当用户触摸工具栏碎片中的按钮时，工具栏碎片将调用\
  \ activity 的 `onButtonClick()` 方法，并传递来自 `EditText` 视图的文本和 `SeekBar` 的当前值。activity\
  \ 将调用第二个碎片的 `changeTextProperties()` 方法，该方法将修改 `TextView` 以反映新的文本和字体大小：\n\n![](img/as_fragment_example_running.jpg)\n\
  \n图 31-10\n\n### 31.10 总结\n\n本章的目标是通过创建一个示例项目，演示在 Android 应用程序中使用碎片时涉及的步骤。涵盖的主题包括使用\
  \ Android Support Library 以兼容在引入碎片之前的 Android 版本，包括在 activity 布局中的碎片，以及实现碎片间的通信。\n\
  \n# 32. 使用 Jetpack 构建现代 Android 应用架构\n\n多年来，Google 并没有推荐构建 Android 应用程序的特定方法，而是提供工具和开发工具包，让开发者决定哪种方法对特定项目或个人编程风格最有效。这种情况在\
  \ 2017 年随着 Android 架构组件（Android Architecture Components）的引入发生了改变，这些组件在 2018 年发布时成为了\
  \ Android Jetpack 的一部分。\n\n本章提供了 Jetpack 概念、Android 应用架构建议以及一些关键架构组件的概述。在涵盖基础知识后，这些主题将在后续章节中进行详细介绍，并通过实际示例进行演示。\n\
  \n### 32.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 Android Studio、Android 架构组件、Android\
  \ Support Library 以及一组建议 Android 应用如何构建结构的指南组成。Android 架构组件的设计旨在让开发 Android 应用时能够更快、更容易地执行常用任务，同时符合架构指南的核心原则。\n\
  \n虽然本书将涵盖所有的 Android 架构组件，但本章将重点介绍关键架构指南以及 `ViewModel`、`LiveData` 和 `Lifecycle`\
  \ 组件，同时引入数据绑定（Data Binding）和存储库（Repositories）。\n\n在继续之前，重要的是理解 Jetpack 应用开发方法是可选的。虽然它突出了几年多年来广受欢迎的其它技术的某些缺点，但\
  \ Google 并没有完全谴责那些应用开发方法。Google 的立场是，虽然开发应用没有绝对的对错之分，但存在一种推荐的方法。\n\n### 32.2 “旧”架构\n\
  \n在名为“在 Android Studio 中创建示例 Android 应用程序”(#Sample_App.xhtml__idTextAnchor040)的章节中，创建了一个包含单个\
  \ activity 的 Android 项目，该 activity 包含了所有呈现和管理用户界面的代码以及应用程序的后端逻辑。\n\n在 Jetpack 引入之前，最常见的架构遵循这种范式，即应用程序由多个\
  \ activity（每个应用内的每个屏幕对应一个）组成，每个 activity 类在某种程度上都混合了用户界面和后端代码。\n\n这种方法导致了一系列与应用生命周期相关的问题（例如，当用户每次旋转设备时，activity\
  \ 都会被销毁并重建，导致未保存到某种持久化存储中的任何应用数据丢失），以及诸如导航效率低下等问题（为用户访问的每个应用屏幕启动新的 activity）。\n\n\
  ### 32.3 现代 Android 架构\n\n在最基础的层，Google 现在提倡单 activity 应用程序，不同的屏幕作为内容加载在同一个 activity\
  \ 中。\n\n现代架构指南还建议将应用程序内部不同职责的划分到完全独立的模块中（一个被称为“关注点分离”的概念）。这种方法的关键之一是 `ViewModel`\
  \ 组件。\n\n### 32.4 ViewModel 组件\n\n`ViewModel` 的目的是将应用程序与用户界面相关的数据模型和逻辑与负责显示、管理用户界面以及与操作系统交互的代码隔离开。当以这种方式设计时，应用程序将由一个或多个\
  \ UI 控制器（如 activity）以及负责处理这些控制器所需数据的 `ViewModel` 实例组成。\n\n\n\n\n`ViewModel` 只负责数据模型和相应的逻辑。它对用户界面一无所知，也不会尝试直接访问或响应与用户界面内视图相关的事件。当\
  \ UI 控制器需要数据进行显示时，它会请求 `ViewModel` 提供。同样，当用户在用户界面的视图中输入数据时，UI 控制器会将其传递给 `ViewModel`\
  \ 进行处理。\n\n这种职责分离解决了与 UI 控制器生命周期相关的问题。无论 UI 控制器在应用的生命周期内被重建了多频繁，`ViewModel` 实例都会保留在内存中，从而保持数据的一致性。例如，activity\
  \ 使用的 `ViewModel` 将一直保留在内存中，直到 activity 结束；在单活动应用中，这意味着直到应用退出时才会结束。\n\n![](img/jetpack_diagram_1.jpg)\n\
  \n图 32-1\n\n## 32.5 LiveData 组件\n\n考虑一个显示实时数据的应用，例如金融股票的当前价格。该应用可以使用股票价格 Web 服务来持续更新\
  \ `ViewModel` 中的数据模型，以包含最新的信息。这些实时数据只有在被及时显示给用户时才有意义。UI 控制器只有两种方式可以确保在用户界面中显示最新数据。一种方案是控制器持续检查\
  \ `ViewModel`，以确定数据自上次显示以来是否发生了变化。然而，这种方法的问题是它可能不够高效。为了保持数据馈的实时性，UI 控制器必须运行在一个循环中，持续检查数据变化。\n\
  \n更好的解决方案是让 UI 控制器在 `ViewModel` 中的某个特定数据项发生变化时接收到通知。这通过使用 `LiveData` 组件实现。`LiveData`\
  \ 是一个数据持有者，允许一个值变为可观测的。简单来说，可观察对象可以在其数据发生变化时通知其他对象，从而解决确保用户界面始终与 `ViewModel` 中的数据匹配的问题。\n\
  \n这意味着，例如，对 `ViewModel` 值感兴趣的 UI 控制器可以设置一个观察者，该观察者反将在值变化时接收通知。例如，在我们假设的应用中，股票价格将被封装在\
  \ `ViewModel` 内部的 `LiveData` 对象中，UI 控制器为该值分配一个观察者，声明一个在值变化时调用的方法。当数据变化触发触发时，该方法将从\
  \ `ViewModel` 读取更新后的值并使用它来更新用户界面。\n\n![](img/Jetpack_diagram_2.jpg)\n\n图 32-2\n\n\
  `LiveData` 实例也可以被声明为可变的，允许观察实体更新 `LiveData` 对象中持有的底层值。例如，用户可能会在用户界面中输入一个需要覆盖存储在\
  \ `ViewModel` 中的存储值的值。\n\n使用 `LiveData` 的另一个关键优势是它可以感知观察者的生命周期状态。例如，如果一个 activity\
  \ 包含一个 `LiveData` 观察者，相应的 `LiveData` 对象将知道 activity 生命周期状态的变化，并做出相应响应。如果 activity\
  \ 被暂停（可能应用被放入后台），`LiveData` 对象将停止向观察者发送事件。假设 activity 刚刚启动或在暂停后恢复。在这种情况下，`LiveData`\
  \ 对象将向观察者发送一个 `LiveData` 事件，以便 activity 拥有最新的值。同样，`LiveData` 实例将知道 activity 被销毁并移除观察者以释放资源。\n\
  \n到目前为止，我们只讨论了 UI 控制器使用观察者。在实践中，观察者可以在任何符合 Jetpack 生命周期管理方法的对象内部使用。\n\n## 32.6 ViewModel\
  \ 保存状态\n\nAndroid 允许用户将活动应用置于后台，并在设备上执行其他任务（包括运行其他应用）后返回该应用。当设备资源不足时，操作系统将通过终止后台应用进程来纠正这一点，从最久未使用的应用开始。然而，当用户返回被销毁的后台应用时，它应该以与其被放入后台时相同的状态出现，无论它是否被销毁。在与\
  \ `ViewModel` 相关的数据方面，可以使用 `ViewModel Saved State`（ViewModel 保存状态）模块来实现。该模块允许将值存储在应用的保存状态中并在发生系统启动的进程终止时恢复。此主题将在稍后的\
  \ “Android ViewModel 保存状态教程” 章节中介绍。\n\n## 32.7 LiveData 和数据绑定\n\nAndroid Jetpack\
  \ 包含了数据绑定库（Data Binding Library），它允许 `ViewModel` 中的数据直接映射到 XML 用户界面布局文件中的特定视图。在之前创建的\
  \ AndroidSample 项目中，必须编写代码来获取 `EditText` 和 `TextView` 视图的引用，并设置和获取文本属性以反映数据变化。数据绑定允许存储在\
  \ `ViewModel` 中的 `LiveData` 值在 XML 布局文件中被直接引用，避免了编写代码来保持布局视图更新的需求。\n\n![](img/Jetpack_diagram_3.jpg)\n\
  \n图 32-3\n\n数据绑定将更详细地介绍，从 “Android Jetpack 数据绑定概述” 章节开始。\n\n## 32.8 Android 生命周期\n\
  \n从 Android 组件创建到其被销毁的时间段被称为生命周期。在生命周期期间，组件将在不同的生命周期状态之间切换，通常在操作系统的控制下并响应用户操作。例如，一个\
  \ activity 将初始化状态开始，然后过渡到创建状态。一旦 activity 运行，它将切换到启动状态，从那里它将循环各种状态，包括创建、启动、恢复和销毁。\n\
  \n许多 Android 框架类和组件允许其他对象访问其当前状态。也可以使用生命周期观察者，以便在另一个对象的生命周期状态变化时接收通知。`ViewModel`\
  \ 组件在后台使用这种技术来识别观察者何时已重启或被销毁。这种功能不仅限于 Android 框架和架构组件。它也可以使用架构组件包含的一组生命周期组件构建任何其他类。\n\
  \n能够检测并响应其他对象生命周期变化的对象被称为生命周期感知（lifecycle-aware）。相反，提供其生命周期状态访问的对象被称为生命周期所有者（lifecycle\
  \ owners）。“与 Android 生命周期感知组件协作”\n\n图 32-4\n\n## 32.10 总结\n\n\n\n\n\n直到最近，Google\
  \ 倾向于不推荐任何特定的 Android 应用结构方法。随着 Android Jetpack 的引入，这种情况现在发生了变化。Android Jetpack\
  \ 由工具、组件、库和架构指南组成。Google 现在建议将项目划分为不同的模块，每个模块负责特定的功能区域，即“关注点分离”（separation of concerns）。\n\
  \n特别是，指南建议将应用的视图数据模型（view data model）与处理用户界面的代码分离。此外，从网络服务或数据库等数据源收集数据的代码应该在独立的仓库（repository）模块中，而不是与视图模型捆绑。\n\
  \nAndroid Jetpack 包含了 Android 架构组件（Android Architecture Components），旨在更容易开发符合推荐指南的应用程序。本章介绍了\
  \ `ViewModel`、`LiveData` 和 `Lifecycle` 组件。从下一章开始，将详细介绍这些组件。本章中未提到的其他架构组件将在书中后后部分介绍。\n\
  \n## 33. Android ViewModel 教程\n\n上一章介绍了 Android Jetpack 的基本概念，并概述了现代 Android 应用架构的基础。Jetpack\
  \ 定义了一系列建议，描述了 Android 应用项目应该如何构建，同时提供了一系列库和组件，使用户能够更容易遵循这些指南，以更少的代码和更少的错误开发出可靠的应用。\n\
  \n为了帮助强化和澄清上一章提供的信息，本章将逐步演示创建一个使用 `ViewModel` 组件的示例应用项目。下一章将通过包含 `LiveData` 和数据绑定支持进一步增强此示例。\n\
  \n### 33.1 关于项目\n\n在标题为在 Android Studio 中创建示例 Android 应用的章节中，创建了一个名为 `AndroidSample`\
  \ 的项目，其中应用的所有代码都捆绑在主 `Activity` 类文件中。在接下来的章节中，创建并使用了 AVD 模拟器来运行该应用。在应用运行时，我们亲身体验了这种方式开发应用时出现的问题：当\
  \ `TextView` 组件上显示的数据在设备旋转期间丢失时。\n\n本章将使用 `ViewModel` 组件实现相同的货币转换应用，并遵循 Google 应用架构指南，以避免\
  \ `Activity` 生命周期带来的复杂性。\n\n## 33.2 创建 ViewModel 示例项目\n\n在创建 `AndroidSample` 项目时，选择了\
  \ `Empty Views Activity` 模板作为项目基础。然而，本项目将使用 `Basic Views Template` 模板。\n\n从欢迎界面选择\
  \ `New Project` 选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Basic Views Activity` 模板。\n\n在\
  \ `Name` 字段中输入 `ViewModelDemo`，并指定 `com.ebookfrenzy.viewmodeldemo` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API` 级设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。\n\
  \n## 33.3 移除不需要的项目元素\n\n正如 Android Studio 布局编辑器工具指南所示，`Basic Views Activity` 模板包含了并非所有项目都需要的功能。在将\
  \ `ViewModel` 添加到项目之前，我们首先需要按照如下方式移除导航、第二个内容碎片（fragment）和浮动操作按钮（floating action\
  \ button）：\n\n1. 在 Project 工具窗口中双击 `activity_main.xml` 布局文件，选择浮动操作按钮，并按键盘删除键从布局中移除该对象。\n\
  2. 编辑 `MainActivity.java` 文件，从 `onCreate` 方法中删除浮动操作按钮代码如下：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    .\n    .\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                      .setAnchorView(R.id.fab)\n                      .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n3. 在 Project 工具窗口中，导航并双击\
  \ `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n4. 在编辑器中，选择图面板中的\
  \ `SecondFragment` 项，按键盘删除键将其从图中移除。\n5. 找到并删除 `SecondFragment.java` 和 `fragment_second.xml`\
  \ 文件。\n6. 最后一个任务是从 `FirstFragment` 类中移除一些代码，以便 `Button` 视图在点击时不再导航到已不存在的第二个碎片。编辑\
  \ `FirstFragment.java` 文件并移除 `onViewCreated()` 方法中的代码，使其读取内容如下：\n\n```java\npublic\
  \ void onViewCreated(@NonNull View view, Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    binding.buttonFirst.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
  \   }\n    });\n}\n```\n\n## 33.4 设计 Fragment 布局\n\n下一步是设计碎片的布局。首先，在 Project 窗口中找到\
  \ `fragment_first.xml` 并双击将其加载到布局编辑器。一旦布局加载，选择并删除 `Button`、`TextView` 和 `ConstraintLayout`\
  \ 组件。接下来，右键点击 `NestedScrollView` 实例并选择 `Convert to ConstraintLayout`，如图 3-1](#ViewModel_Tutorial.xhtml__idTextAnchor757)所示，并在对话框中接受默认设置：\n\
  \n(Figure 3-1)\n\n选择转换后的 `ConstraintLayout` 组件并使用属性窗口将 `id`更改为 `constraintLayout`。添加一个新的\
  \ `TextView`，将其放置在布局中心，并将 `id` 更改为 `resultText`。接下来，从调色板拖入 `Number (Decimal)` 视图并将其放在现有\
  \ `TextView` 上方。选中视图后，参考属性窗口并将 `id` 更改为 `dollarText`。将一个 `Button` 组件拖到布局中，放在 `TextView`\
  \ 下方，并将 `text` 属性更改为“Convert”。在选中按钮时，将 `id` 属性更改为 `convertButton`。此时，布局应类似于所示（注意三个视图使用了垂直链约束）：\n\
  \n最后，点击布局编辑器右上角的警告图标，将硬编码字符串转换为资源。\n\n### 33.5 实现 ViewModel\n\n用户界面布局完成后，需要在 ViewModel\
  \ 中创建应用的数据模型。首先在 Project 工具窗口中找到 `com.ebookfrenzy.viewmodeldemo` 项，右键点击并选择 `New\
  \ -> Java Class` 选项。将新类命名为 `MainViewModel` 并按回车键。编辑新类文件如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    private Float result = 0F;\n\n    public void setAmount(String value)\
  \ {\n        this.dollarText = value;\n        result = Float.parseFloat(dollarText)*rate;\n\
  \    }\n\n    public Float getResult()\n    {\n        return result;\n    }\n}\n\
  ```\n\n\n\n\n该类声明了变量用于存储当前的美元字符串值以及转换后的金额，并提供了获取（getter）和设置（setter）方法来访问这些数据值。调用\
  \ `setAmount()` 方法时，它会将当前的美元金额作为参数并存储在局部变量 `dollarText` 中。美元字符串值被转换为浮点数，乘以一个虚拟的汇率，并将生成的欧元值被存储在\
  \ `result` 变量中。另一方面，`getResult()` 方法则返回赋值给 `result` 变量的当前值。\n\n## 33.6 将 Fragment\
  \ 与 ViewModel 关联\n\nFragment 需要某种方式来获取 `ViewModel` 的引用，以便访问模型并观察数据变化。`Fragment`\
  \ 或 `Activity` 通过 `ViewModelProvider` 类的实例来维护其所赖以获取数据的 `ViewModels` 引用。\n\n在 `Fragment`\
  \ 内部使用 `ViewModelProvider` 类创建 `ViewModelProvider` 实例。调用该类时，类初始化器会接收一个当前 `Fragment`\
  \ 或 `Activity` 的引用，并如下所示返回一个 `ViewModelProvider` 实例：\n\n```java\nViewModelProvider\
  \ viewModelProvider = new ViewModelProvider(this);\n```\n\n一旦创建了 `ViewModelProvider`\
  \ 实例，就可以使用索引值来请求特定的 `ViewModel` 类。提供程序随后将创建该 `ViewModel` 类的新实例，或者返回一个已存在的实例，例如：\n\
  \n```java\nViewModel viewModel = viewModelProvider.get(MainViewModel.class);\n```\n\
  \n编辑 `FirstFragment.java` 文件并重写 `onCreate()` 方法以设置 `ViewModelProvider`：\n\n```java\n\
  import androidx.lifecycle.ViewModelProvider;\nimport androidx.annotation.Nullable;\n\
  \npublic class FirstFragment extends Fragment {\n    private MainViewModel viewModel;\n\
  \n    @Override\n    public void onCreate(@Nullable Bundle savedInstanceState) {\n\
  \        super.onCreate(savedInstanceState);\n        viewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \    }\n}\n```\n\n获取模型视图访问后，现在可以向 `Fragment` 中添加代码以开始处理数据模型。\n\n### 33.7 修改 Fragment\n\
  \n需要更新 Fragment 类以响应按钮点击并与存储在 `ViewModel` 中的数据值进行交互。该类还需要用户界面布局中三个视图的引用，以便以响应按钮点击、提取当前的美元值并显示转换后的货币金额。\n\
  \n在标题为 [\"在 Android Studio 中创建一个 Android 示例应用”(#Sample_App.xhtml__idTextAnchor040)\
  \ 的章节中，`Button` 组件的 `onClick` 属性用于指定点击按钮时调用的方法。遗憾的是，此属性只能调用 `Activity` 的方法，而不能用于调用\
  \ `Fragment` 中的方法。为了克服这一局限性，我们必须向 `Fragment` 类添加一些代码，在按钮上设置 `onClick` 监听器。如下所示，这可以在\
  \ `FirstFragment.java` 文件的 `onViewCreated()` 生命周期方法中实现：\n\n```java\npublic class\
  \ MainFragment extends Fragment {\n    private MainViewModel viewModel;\n\n    @Override\n\
  \    public void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n        super.onViewCreated(view, savedInstanceState);\n        binding.convertButton.setOnClickListener(v\
  \ -> {\n        });\n    }\n}\n```\n\n添加监听器后，放置在 `onClick()` 方法中的任何代码都会会在用户点击按钮时被调用。\n\
  \n## 33.8 访问 ViewModel 数据\n\n点击按钮时，`onClick()` 方法需要从 `EditText` 视图读取当前值，确认该字段不为空，然后调用\
  \ `ViewModel` 实例的 `setAmount()` 方法。该方法随后需要调用 `ViewModel` 的 `getResult()` 方法并在 `TextView`\
  \ 组件上显示转换后的值。\n\n由于项目尚未未使用 `LiveData`，因此在每次创建 `Fragment` 时，也有必要从 `ViewModel` 获取最新的结果值。\n\
  \n在 `FirstFragment.java` 文件中，在 `onViewCreated()` 方法中按如下实现这些需求：\n\n```java\nimport\
  \ java.util.Locale;\n\n@Override\npublic void onViewCreated(@NonNull View view,\
  \ @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\",\n       \
  \     viewModel.getResult()));\n    binding.convertButton.setOnClickListener(v ->\
  \ {\n        if (!binding.dollarText.getText().toString().equals(\"\")) {\n    \
  \        viewModel.setAmount(String.format(Locale.ENGLISH,\"%s\",\n            \
  \        binding.dollarText.getText().toString()));\n        } else {\n        \
  \    binding.resultText.setText(\"No Value\");\n        }\n    });\n}\n```\n\n##\
  \ 33.9 测试项目\n\n完成此项目阶段后，在模拟器或物理设备上构建并运行应用，输入美元值并点击 Convert 按钮。转换后的金额应该出现在 `TextView`\
  \ 上，表明 ViewModel 结构化正在正常工作。\n\n当运行原始的 AndroidSample 应用时，旋转设备会导致显示在 `resultText`\
  \ TextView 上的值丢失。现在使用 ViewModel 应用重复此测试，并注意当前的欧元值被保留了。这是因为当 Fragment 被销毁时，ViewModel\
  \ 仍然留在内存中，并且在 `onViewCreated()` 方法中添加了代码来更新 `TextView`。\n\n虽然这对原始的 AndroidSample\
  \ 应用有所改进，但使用 `LiveData` 和数据绑定可以做更多事情，这两者都是后续章节的主题。\n\n## 33.10 总结\n\n在本章中，我们回顾了书中之前创建的\
  \ AndroidSample 项目，并创建了符合 Jetpack 架构指南的新版本项目。示例项目还演示了使用 ViewModel 将数据处理与用户界面代码分离。最后，章节展示了\
  \ ViewModel 方法如何解决 Fragment 和 Activity 的生命周期问题。\n\n## 34 Android Jetpack LiveData\
  \ 教程\n\n上一章节开始构建符合推荐的 Jetpack 架构指南的应用。这些初始步骤涉及在 `ViewModel` 实例中实现应用界面的数据模型。\n\n\
  本章将使用 `LiveData` 架构组件进一步增强应用设计。在本章为项目添加 `LiveData` 支持后，后续章节（从“Android Jetpack 数据绑定概述”开始）将使用\
  \ Jetpack Data Binding 库从项目中消除更多代码。\n\n### 34.1 LiveData 回顾\n\nLiveData 之前在 [\"\
  Jetpack 现代 Android 应用架构”(#Modern_App_Architecture_Jetpack.xhtml__idTextAnchor732)介绍过。如前所述，`LiveData`\
  \ 组件可以作为视图模型内部数据值的封装。一旦包含在 `LiveData` 实例中，这些变量对于应用内的其他对象（通常是 Activity 和 Fragment\
  \ 等 UI 控制器）即可可见。这允许 UI 控制器在底层 值每次变化时接收通知。通过创建 `Observer` 类的实例并定义在 `LiveData` 值变化时调用的\
  \ `onChange()` 方法可以设置观察者。一旦创建了 `Observer` 实例，通过调用 `LiveData` 对象的 `observe()` 方法将其附加到\
  \ `LiveData` 对象上。\n\n\n\n\n`LiveData` 实例可以使用 `MutableLiveData` 类声明为可变，允许 `ViewModel`\
  \ 和 UI 控制器都可以更改底层数据值。\n\n### 34.2 向 ViewModel 中添加 LiveData\n\n启动 Android Studio，打开上一章节创建的\
  \ `ViewModelDemo` 项目，并打开 `MainViewModel.java` 文件，该文件目前的内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.viewmodeldemo;\n\nimport androidx.lifecycle.ViewModel;\n\npublic\
  \ class MainViewModel extends ViewModel {\n    private static final Float rate =\
  \ 0.74F;\n    private String dollarText = \"\";\n    private Float result = 0F;\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public Float\
  \ getResult()\n    {\n        return result;\n    }\n}\n```\n\n本章的这一阶段旨在将 `result`\
  \ 变量封装在 `MutableLiveData` 实例中（该对象需要是可变的，以便在用户每次请求货币转换时都能更改值）。首先修改该类使其现在的内容如下，注意在使用\
  \ `LiveData` 时需要导入额外的包：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\nimport\
  \ androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.ViewModel;\n\n\
  public class MainViewModel extends ViewModel {\n    private static final Float rate\
  \ = 0.74F;\n    private String dollarText = \"\";\n    private Float result = 0F;\n\
  \    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\n\
  \    public void setAmount(String value) {\n        this.dollarText = value;\n \
  \       result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public Float getResult()\n\
  \    {\n        return result;\n    }\n}\n```\n\n既然 `result` 变量已包含在可变的 `LiveData`\
  \ 实例中，必须修改 `setAmount()` 和 `getResult()` 方法。在 `setAmount()` 方法中，不能再使用赋值运算符 `=` 直接向\
  \ `result` 变量赋值了。相反，必须调用 `LiveData.setValue()` 方法并将新值作为参数传递。按照目前的实现，`getResult()`\
  \ 方法声明为返回 `Float` 值，必须更改为返回 `MutableLiveData` 对象。\n\n这些剩余更改后的类文件如下：\n\n```java\n\
  package com.ebookfrenzy.viewmodeldemo;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public MutableLiveData<Float>\
  \ getResult()\n    {\n        return result;\n}\n```\n\n## 34.3 实现观察者 (Observer)\n\
  \n现在转换结果包含在 `LiveData` 实例中，下一步是在 UI 控制器中配置观察者，在本例中，该控制器是 `FirstFragment` 类。找到 `FirstFragment.java`\
  \ 类，双击它将其加载到编辑器，并修改 `onViewCreated()` 方法创建一个名为 `resultObserver` 的新 `Observer` 实例：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\nimport androidx.lifecycle.Observer;\n\
  \n@Override\npublic void onViewCreated(NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    final Observer<Float>\
  \ resultObserver = new Observer<Float>() {\n        @Override\n        public void\
  \ onChanged(Float result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", result));\n        }\n    };\n    // ... 后续代码 ...\n}\n```\n\n`resultObserver`\
  \ 实例声明了 `onChanged()` 方法，当它被调用时，会传入当前值，然后将其显示在 `TextView` 上。下一步是将观察者添加到 `LiveData`\
  \ 对象中，该引用可以通过调用 `getResult()` 方法获取。由于更新 `TextView` 现在是 `onChanged()` 回调的职责，现有的代码行可以删除了。\n\
  \n\n\n\n\n在标题为使用 Jetpack 构建现代 Android 应用架构的章节，我们引入了 Android 数据绑定（Data Binding）的概念。我们解释了如何使用它将用户界面布局中的视图直接连接到应用中其他对象所在的方法和数据，而无需编写代码。本章将提供更多关于数据绑定的详细信息，重点强调数据绑定如何在\
  \ Android Studio 项目中实现。下一章的教程（Android Jetpack 数据绑定教程）将提供一个数据绑定实际运行的实用示例。\n\n## 35.1\
  \ 数据绑定概述\n\nAndroid Jetpack Data Binding 库提供了数据绑定支持，主要提供了一种简单的方法，将用户界面布局中的视图与存储在应用代码中的数据（通常在\
  \ `ViewModel` 实例中）连接。数据绑定还提供了一种方便的方法，将用户界面控件（如 `Button` 控件）映射到其他对象（如 UI 控制器和 `ViewModel`\
  \ 实例）中的事件和监听方法。\n\n当数据绑定与 `LiveData` 组件结合使用时，会变得格外强大。例如，考虑一个使用数据绑定到 `ViewModel`\
  \ 中 `LiveData` 变量的 `EditText` 视图。通过这种方式连接后，`ViewModel` 中数据值的任何更改将自动显示在 `EditText`\
  \ 视图中；当使用双向绑定时，输入到 `EditText` 中的任何数据都将自动用于更新 `LiveData` 值。可能最令人印象深刻的是，这可以在除初始设置绑定所需的代码之外完全实现。\n\
  \n传统上，将交互式视图（如 `Button` 控件）连接到 UI 控制器中的方法需要开发者编写代码来实现监听器方法，以便在点击按钮时调用它。数据绑定使得这变得非常简单，只需在布局\
  \ XML 文件的 `Button` 元素中引用要调用的方法即可。\n\n## 35.2 数据绑定的关键组件\n\nAndroid Studio 项目默认并没有配置数据绑定的支持。在应用开始使用数据绑定之前，必须组合几个元素。这些涉及项目构建配置、布局\
  \ XML 文件、数据绑定类以及数据绑定表达式语言的使用。虽然初看起来看起来可能很复杂，但分离开来看，这些都是非常简单的步骤，一旦完成，在节省编码工作方面是非常值得的。本章的剩余部分将详细介绍每个元素。在介绍这些基础之后，下一章将通过详细的教程演示这些步骤。\n\
  \n### 35.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须配置为使用 Android Data Binding 库，并启用对数据绑定类和绑定语法的支持。坦率地说，这只需在模块级\
  \ `build.gradle.kts` 文件中添加几行代码即可（即项目工具窗口 Gradle Scripts 下列出的 `build.gradle.kts (Module:\
  \ app)` 的那一个）。以下列出了一个启用了数据绑定的部分构建文件：\n\n```kotlin\nandroid {\n    buildFeatures\
  \ {\n        dataBinding = true\n    }\n}\n```\n\n### 35.2.2 数据绑定布局文件\n\n正如我们在之前的章节中所看到的，应用的用户界面通常包含在\
  \ XML 布局文件中。在这些布局文件中的视图能够利用数据绑定之前，必须将布局文件转换为数据绑定布局文件。\n\n正如书前面概述的，XML 布局文件定义了布局中组件的层级结构，从顶层或根视图开始。通常情况下，这个根视图采用布局容器的形式，例如\
  \ `ConstraintLayout`、`FrameLayout` 或 `LinearLayout` 实例，正如 `ViewModelDemo` 项目中的 `fragment_main.xml`\
  \ 文件所示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n要使用数据绑定，布局层级必须有一个布局组件作为根视图，该组件反过来成为当前根视图的父级。\n\n在上面的示例中，这意味着对现有的布局文件进行以下更改：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n### 35.2.3 布局文件数据\n\n数据绑定布局文件需要某种方式来声明绑定的类（例如 `ViewModel` 或 UI\
  \ 控制器）。在声明这些类后，布局文件需要一个变量在绑定表达式中引用这些实例。\n\n这是通过 `data` 元素实现的示例所示：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\" />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n\n\
  上面的 `data` 元素声明了一个类型为 `MainViewModel` 的新变量 `myViewModel`（注意声明变量时需要使用 `MainViewModel`\
  \ 类的完整包名）。\n\n`data` 元素还可以导入其他类，这些类可以在布局文件的其他地方被引用。例如，如果你有一个类，在值显示给用户之前需要对其调用某个方法，可以如下方式导入该类：\n\
  \n```xml\n<data>\n    <import type=\"com.ebookfrenzy.MyFormattingTools\" />\n  \
  \  <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n</data>\n```\n\n### 35.2.4 绑定类\n\n对于数据绑定布局文件 `data` 元素中引用的每个类，Android Studio\
  \ 都会自动生成相应的绑定类。该 `AndroidDataBinding` 类的子类将根据布局文件名命名，使用单词首字母大写并加上 `Binding` 后缀。因此，名为\
  \ `fragment_main.xml` 的布局文件的绑定类将命名为 `FragmentMainBinding`。绑定类包含了布局文件中指定的绑定，并将它们映射到绑定对象中的变量和方法。\n\
  \n\n\n\n\n虽然绑定类是自动生成的，但必须编写代码根据相应的数据绑定布局文件来创建该类的实例。幸运的是，可以通过使用 `DataBindingUtil`\
  \ 类来实现这一点。\n\n`Activity` 或 `Fragment` 的初始化代码通常会设置内容视图或“充胀”（inflate）用户界面布局文件。这意味着代码会打开布局文件、解析\
  \ XML 并在内存中创建并配置所有的视图对象。对于现有的 `Activity` 类，实现此点的代码可以在 `onCreate()` 方法中找到，其内容如下：\n\
  \n```\nsetContentView(R.layout.activity_main);\n```\n\n对于 `Fragment`，这发生在 `onCreateView()`\
  \ 方法中：\n\n```java\nreturn inflater.inflate(R.layout.fragment_main, container, false);\n\
  ```\n\n在 `Activity` 类中创建绑定类实例，只需要按照如下方式修改此初始化代码：\n\n```java\nActivityMainBinding\
  \ binding;\nbinding = DataBindingUtil.setContentView(this, R.layout.activity_main,\
  \ false);\n```\n\n对于 `Fragment`，代码内容如下：\n\n```java\nFragmentMainBinding binding;\n\
  binding = DataBindingUtil.inflate(\n      inflater, R.layout.fragment_main, container,\
  \ false);\nbinding.setLifecycleOwner(this);\nView view = binding.getRoot();\nreturn\
  \ view;\n```\n\n### 35.2.5 数据绑定变量配置\n\n如上所述，数据绑定布局文件包含 `data` 元素，该元素包含变量元素，由变量名和要建立绑定的类类型组成。例如：\n\
  \n```xml\n<data>\n    <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    <variable\n        name=\"uiController\"\n        type=\"com.ebookfrenzy.viewmodeldemo_databinding.ui.main.MainFragment\"\
  \ />\n</data>\n```\n\n在上面的示例中，第一个变量知道它将绑定到类型为 `MainViewModel` 的 `ViewModel` 类实例，但尚未连接到实际的\
  \ `MainViewModel` 对象实例。这需要一个额外的步骤，将应用 内部使用的 `MainViewModel` 实例分配给布局文件中声明的变量。这是通过调用数据绑定实例的\
  \ `setVariable()` 方法实现的，该实例的引用在上一章中已获得：\n\n```java\nMainViewModel mViewModel = new\
  \ ViewModelProvider(this).get(MainViewModel.class);\nbinding.setVariable(viewModel,\
  \ mViewModel);\n```\n\n上述 `data` 元素中的第二个变量引用了名为 `MainFragment` 的 `Fragment` own\
  \ UI 控制器类。在这种情况下，UI 控制器（无论是 `Activity` 还是 `Fragment`）中的代码需要如下所示将自身赋值给变量：\n\n```java\n\
  binding.setVariable(uiController, this);\n```\n\n### 35.2.6 绑定表达式（单向）\n\n绑定表达式定义了特定视图与绑定对象交互的方式。例如，`Button`\
  \ 上的绑定表达式可能会声明响应点击时调用对象上的哪个方法。或者，绑定表达式可能会定义存储在 `ViewModel` 中的哪个数据值显示在 `TextView`\
  \ 中，以及如何进行展示和格式化。\n\n绑定表达式使用声明式语言，允许通过逻辑以及对其他类和方法的访问来决定绑定数据的使用。例如，表达式可以包含数学表达式、方法调用、字符串拼接、数组元素访问和比较操作。此外，所有标准的\
  \ Java 语言库都会默认导入，因此在 Java 中可以实现的许多功能在绑定表达式中也可以完成。正如已经讨论过的，`data` 元素也可以用于导入自定义类以为表达式添加更多功能。\n\
  \n绑定表达式以 `@` 符号开头，后跟用花括号 `{}` 包的表达式。\n\n例如，考虑一个包含名为 `result` 变量的 `ViewModel` 实例。假设该类已分配给数据绑定布局文件中名为\
  \ `viewModel` 的变量，并需要绑定到 `TextView` 对象，以便该视图始终显示最新的结果值。如果此值被存储为 `String` 对象，则在布局文件中的声明如下：\n\
  \n```xml\n<TextView\n    android:id=\"@+id/resultText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
  @{viewModel.result}\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n \
  \   app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n在上面的 XML 中，`text`\
  \ 属性被设置为存储在 `viewModel` 对象的 `result` `LiveData` 属性中的值。\n\n然而，考虑 `result` 在模型中被存储为\
  \ `Float` 值而不是 `String`。如果是这样，上面的表达式将导致编译错误。显然，在 `TextView` 显示它之前，必须将 `Float` 值转换为字符串。为了解决此类问题，绑定表达式可以包含使用标准\
  \ Java 语言类完成转换的必要步骤。\n\n\n\n\n\n`convertCurrency()` 方法按照以下代码进行声明：\n\n```java\npublic\
  \ void convertCurrency(View view) {\n\n.\n.\n}\n```\n\n请注意，这种类型的方法调用始终会被传递发生事件的\
  \ view 引用。在数据绑定中，可以使用以下表达式相同的效果（假设布局已绑定到一个变量名为 `uiController` 的类上）：\n\n`android:onClick=\"\
  @{uiController::convertCurrency}\"`\n\n另一个选项，并且由于该选项提供了向方法传递参数的能力，被称为“监听器绑定”（listener\
  \ binding）。以下表达式使用这种方法在同一个 `viewModel` 实例上调用一个不带参数的方法：\n\n`android:onClick='@{()\
  \ -> myViewModel.methodOne()}'`\n\n以下表达式调用了一个期望三个参数的方法：\n\n`android:onClick='@{()\
  \ -> myViewModel.methodTwo(viewModel.result, 10, \"A String\")}'`\n\n绑定表达式提供了一种丰富且灵活的语言，用于将用户界面视图绑定到其他对象的数据和方法。本章仅涵盖了最常见的用例。要了解更多关于绑定表达式的信息，请查阅\
  \ Android 在线文档：\n\nhttps://developer.android.com/topic/libraries/data-binding/expressions\n\
  \n### 35.3 总结\n\nAndroid 数据绑定提供了一种系统，可以在无需编写代码的情况下，在用户界面布局中的视图与应用架构内其他对象的数据和方法之间建立连接。一旦完成了初始配置步骤，数据绑定就涉及在布局文件的视图元素中使用绑定表达式。这些绑定表达式可以是单向的，也可以是双向的，还可以用于绑定在响应用户界面按钮点击等事件时调用的方法。\n\
  \n### 36. Android Jetpack 数据绑定教程\n\n到本书为止，我们已经涵盖了现代 Android 应用架构的基本概念，并详细地查看了 `ViewModel`\
  \ 和 `LiveData` 组件。数据绑定的概念在上一章中也介绍过，现在将在本章中使用它来进一步修改 `ViewModelDemo` 应用。\n\n####\
  \ 36.1 移除冗余代码\n\n如果你仍然需要，请复制 `ViewModelDemo` 项目文件夹并将其保存为 `ViewModelDemo_LiveData`\
  \ 以供下一使用。复制完成后，打开原始的 `ViewModelDemo` 项目，准备实现数据绑定。\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，将通过删除项目中所有在在本章结束时不再需要的代码来演示数据绑定的威力。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `FirstFragment.java` 文件，并修改代码如下：\n\n\
  ```java\npackage com.ebookfrenzy.viewmodeldemo;\n\n.\n.\nimport android.arch.lifecycle.Observer;\n\
  \n.\n.\npublic class MainFragment extends Fragment {\n    private MainViewModel\
  \ viewModel;\n.\n.\n    @Override\n    public void onViewCreated(@NonNull View view,\n\
  \                             @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view,\
  \ savedInstanceState);\n        final Observer<Float> resultObserver = new Observer<Float>()\
  \ {\n            @Override\n            public void onChanged(@Nullable final Float\
  \ result) {\n                binding.resultText.setText(String.format(Locale.ENGLISH,\n\
  \                        \"%.2f\", result));\n            }\n        };\n      \
  \  viewModel.getResult().observe(getViewLifecycleOwner(), resultObserver);\n   \
  \     binding.convertButton.setOnClickListener(v -> {\n            if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n                viewModel.setAmount(String.format(Locale.ENGLISH,\"%s\"\
  ,\n                        binding.dollarText.getText()));\n            } else {\n\
  \                binding.resultText.setText(\"No Value\");\n            }\n    \
  \    });\n    }\n.\n.\n```\n\n接下来，编辑 `MainViewModel.java` 文件并继续删除代码如下（同时注意 `dollarText`\
  \ 转换为 `LiveData`）：\n\n```java\npackage com.ebookfrenzy.viewdemo;\nimport android.arch.lifecycle.MutableLiveData;\n\
  import android.arch.lifecycle.ViewModel;\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final rate = 0.7F;\n    final MutableLiveData<String> dollarValue\
  \ = new MutableLiveData<>();\n    private String dollarText = \"\";\n    final MutableLiveData<Float>\
  \ result = new MutableLiveData<>();\n    public void setAmount(String value) {\n\
  \        this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText));\n\
  \    }\n    public MutableLiveData<Float> getResult() {\n        return result;\n\
  \    }\n}\n```\n\n虽然我们在实现数据绑定时会添加几行代码，但数据绑定显著减少了需要编写的代码。\n\n#### 36.2 启用数据绑定\n\n\
  使用数据绑定的第一步是在 Android 项目中启用它。这涉及向 `Gradle Scripts -> build.gradle.kts (:app)` 文件添加新属性。在\
  \ `build.gradle.kts` 文件中，添加以下元素以启用项目的数据绑定：\n\n```kotlin\nplugins {\n    id(\"com.android.application\"\
  )\n}\nandroid {\n.\n.\n    buildFeatures {\n        viewBinding = true\n       \
  \ dataBinding = true\n    }\n.\n}\n```\n\n一旦添加了条目，编辑器屏幕顶部会出现一个包含 `Sync Now` 链接的栏。点击此链接用新的构建配置重新同步项目。\n\
  \n#### 36.3 添加布局元素\n\n如“Android Jetpack 数据绑定概览”所述，布局层级必须有一个 `layout` 组件作为根视图才能使用数据绑定。这需要对\
  \ `fragment_first.xml` 布局文件（`app -> res -> layout -> fragment_first.xml`）进行以下更改。在布局编辑器中打开此文件，切换到\
  \ Code 并进行这些更改：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        xmlns:android=\"http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n        xmlns:tools=\"http://schemas.android.com/tools\"\
  \n        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".FirstFragment\"\
  >\n.\n.\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n\
  \n完成这些更改后，切换回 Design ，注意新的根视图虽然在布局画布上可见，但现在列在组件树中，如图 36-1 所示：\n\n![](img/as_live_data_component_tree.jpg)\n\
