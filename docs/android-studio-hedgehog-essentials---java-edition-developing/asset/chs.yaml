  \ Name”。在调色板中找到`Plain Text`（纯文本）对象，并将其拖放到放置在组件树中 Product Name `TextView`的下方，如图 66-8\
  \ 所示。接下来，从`text`属性中删除“Name”字符串，并将`ID`设置为`productName`。\n\n![](img/as_table_layout_second_row.jpg)\n\
  \n图 66-8\n\n将另一个`TextView`和一个`Number (Decimal)`（数字（小数））文本字段拖到第三个`TableRow`，使`TextView`在层次结构中位于`EditText`上方。将`TextView`上的文本更改为“Product\
  \ Quantity”，并将`EditText`对象的`ID`设置为`productQuantity`。\n\n按住 Shift 并点击选择布局中的所有小部件，如下方的图\
  \ 66-9 所示，并使用属性工具窗口将所有对象的`textSize`属性设置为 18sp：\n\n![](img/as_4.1_room_demo_views_selected.jpg)\n\
  \n图 66-9\n\n# 66.6 向布局中添加按钮栏\n\n下一步是向父`LinearLayout`视图添加一个水平`LinearLayout (Horizontal)`视图，放置在`TableLayout`视图的正下方。首先点击组件树中`TableLayout`条目左侧的小展开箭头，使`TableRows`折叠并隐藏视图。从布局编辑器调色板的布局（Layouts）部分拖入一个水平`LinearLayout\
  \ (horizontal)`实例，将其释放到组件树面板中`TableLayout`条目的正下方，并将`layout_height`属性更改为`wrap_content`：\n\
  \n![](img/as_table_layout_linear_added.jpg)\n\n图 66-10\n\n将三个`Button`对象拖到新的`LinearLayout`中，并为每个按钮分配分别读取为“Add”（添加）、“Find”（查找）和“Delete”（删除）的字符串资源。此类类型的按钮栏布局中的按钮通常应显示为无边框样式（borderless）。使用每个按钮的属性工具窗口将样式设置更改为`Widget.AppCompat.Button.Borderless`，并将`textColor`属性设置为`?attr/colorPrimary`。将按钮的`ID`分别更改为`addButton`、`findButton`和`deleteButton`。\n\
  \n![](img/as_borderless_button.jpg)\n\n图 66-11\n\n在组件树中选中新的水平`LinearLayout`，将`gravity`属性更改为`center_horizontal`，以便按钮水平方向居中。在继续之前，将上述步骤添加的所有`text`属性提取到字符串资源。\n\
  \n# 66.7 添加 RecyclerView\n\n在组件树中，点击新添加的`LinearLayout`条目左侧的箭头以折叠所有子项。\n\n从调色板的容器（Containers）部分将一个`RecyclerView`实例拖到组件树中，将其放置在按钮栏`LinearLayout`下方，如图\
  \ 66-12 所示。确保`RecyclerView`是作为父`LinearLayout`的直接子添加的，而不是作为按钮栏`LinearLayout`的子。\n\
  \n![](img/as_table_layout_recycler_added.jpg)\n\n图 66-12\n\n在布局中选中`RecyclerView`，将视图的`ID`设置为`product_recycler`并设置为`match_parent`。在继续之前，检查布局的层次结构是否如如下所示：\n\
  \n![](img/as_table_completed_tree.jpg)\n\n图 66-13\n\n# 66.8 调整布局间距\n\n剩下的工作是调整一些布局设置。首先点击组件树面板中的第一个`TableRow`条目使其选中。按住键盘上的\
  \ Cmd/Ctrl 键并点击第二个和第三个`TableRow`、水平`LinearLayout`以及`RecyclerView`，使所有五个项目都被选中。在属性面板中，找到`layout_margin`属性类别，一旦找到，将值更改为\
  \ 10dp，如图 66-14 所示：\n\n![](img/as_table_layout_margin.jpg)\n\n图 66-14\n\n设置间距后，用户界面应如图\
  \ 66-1 所示。\n\n# 66.9 总结\n\nAndroid `TableLayout`容器视图提供了一种以行列配置排列视图组件的方法。虽然`TableLayout`视图提供了整体容器，但每行及其包含的单元是通过`TableRow`实例实现的。在本章中，使用`TableLayout`和`TableRow`容器设计了用户界面。下一章将为此用户界面添加功能，使用存储库（Repository）和\
  \ Room 持久库来实现 SQLite 数据库功能。\n\n# 67. Android Room 数据库和存储库教程\n\n\n\n\n本章将结合 \"Android\
  \ Room 持久化库\"中获得的知识以及上一章创建的初始项目，提供一个详细的教程，演示如何使用 Room 持久化库实现基于 SQLite 的数据库存储。遵循\
  \ Android 架构指南，该项目将使用视图（ViewModel）和仓库（Repository）。本教程将使用 \"Android Room 持久化库\" 中涵盖的所有元素，包括实体（Entity）、数据访问对象（DAO）、Room\
  \ 数据库以及异步数据库查询。\n\n## 67.1 关于 RoomDemo 项目\n\n上一章中创建的用户界面布局是创建一个简单的库存管理应用的第一的第一步，该应用用于存储产品名称和数量。完成后，该应用将提供添加、删除和搜索数据库条目的功能，同时显示当前存储在数据库中的所有产品的可滚动列表。当数据库条目添加或删除时，此产品列表将自动更新。\n\
  \n## 67.2 修改构建配置\n\n启动 Android Studio 并打开上一章开始的 `RoomDemo` 项目。在向项目添加任何新类之前，第一步是向构建配置添加一些额外的库，包括\
  \ Room 持久化库。找到并编辑项目级 `build.gradle.kts` 文件（`app -> Gradle Scripts -> build.gradle.kts\
  \ (Project :RoomDemo)`），如下如下：\n\n接下来，对模块级 `build.gradle.kts` 文件（`app -> Gradle Scripts\
  \ -> build.gradle.kts (Module :app)`）进行以下更改：\n\n```kotlin\ndependencies {\n    implementation(\"\
  androidx.recyclerview:recyclerview:1.3.2\")\n    implementation(\"androidx.room:room-runtime:2.6.0\"\
  )\n    annotationProcessor(\"androidx.room:room-compiler:2.6.0\")\n}\n```\n\n###\
  \ 67.3 构建实体\n\n该项目将从创建定义数据库表结构的实体开始。该实体将包含一个用于产品 ID 的整数、一个用于存储产品名称的字符串列以及另一个用于存储数量的整数值。\n\
  \n该实体将包含一个用于产品 ID 的整数、一个用于存储产品名称的字符串列以及另一个用于存储数量的整数值。`productid` 列将作为主键并自动生成。表 67-1\
  \ 总结了实体的结构：\n\n| 列 | 数据类型 |\n| :--- | :--- |\n| productid | Integer / 主键 / 自动递增\
  \ |\n| productname | String |\n| productquantity | Integer |\n\n表 67-1\n\n通过右键点击\
  \ Project 工具窗口中的 `app -> java -> com.ebookfrenzy.roomdemo` 项并选择 `New -> Java Class`\
  \ 菜单选项，为实体添加一个类文件。在新建类对话框中，将类命名为 `Product`，选择列表中的 `Class` 项，并按键盘回车键生成文件。\n\n当 `Product.java`\
  \ 文件在编辑器中打开时，对其进行修改使其内容如下：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\npublic\
  \ class Product {\n    private int id;\n    private String name;\n    private int\
  \ quantity;\n\n    public Product(String name, int quantity) {\n        this.name\
  \ = name;\n        this.quantity = quantity;\n    }\n\n    public int getId() {\n\
  \        return this.id;\n    }\n\n    public String getName() {\n        return\
  \ this.name;\n    }\n\n    public int getQuantity() {\n        return this.quantity;\n\
  \    }\n\n    public void setId(int id) {\n        this.id = id;\n    }\n\n    public\
  \ void setName(String name) {\n        this.name = name;\n    }\n\n    public void\
  \ setQuantity(int quantity) {\n        this.quantity = quantity;\n    }\n}\n```\n\
  \n该类现在具有数据库列的变量以及对应的 getter（get）和 setter（set）方法。在进行注解之前，该类尚未成为实体。当该类文件仍在编辑器中打开时，添加以下注解和相应的\
  \ import 语句：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport androidx.room.ColumnInfo;\n\
  import androidx.room.Entity;\nimport androidx.room.PrimaryKey;\n\n@Entity(tableName\
  \ = \"products\")\npublic class Product {\n    @PrimaryKey(autoGenerate = true)\n\
  \    @ColumnInfo(name = \"productId\")\n    private int id;\n    \n}\n```\n\n这些注解声明了这是一个名为\
  \ `products` 的实体，并为变量配置了列名。`id` 列被配置为主键并自动自动生成。\n\n## 67.4 创建数据访问对象\n\n定义实体后，下一步是创建\
  \ DAO。引用 Project 工具窗口，右键点击 `app -> java -> com.ebookfrenzy.roomdemo` 并选择 `New ->\
  \ Java Class` 选项。在对话框中输入 `ProductDao` 并选择 `Interface`（图 67-1）。按回车键生成 `ProductDao.java`\
  \ 并进行以下更改：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport androidx.lifecycle.LiveData;\n\
  import androidx.room.Dao;\nimport androidx.room.Insert;\nimport androidx.room.Query;\n\
  import java.util.List;\n\n@Dao\npublic interface ProductDao {\n    @Insert\n   \
  \ void insert(Product product);\n\n    @Query(\"SELECT * FROM products WHERE productName\
  \ = :name\")\n    List<Product> find(String name);\n\n    @Query(\"DELETE FROM products\
  \ WHERE productName = :name\")\n    void delete(String name);\n\n    @Query(\"SELECT\
  \ * FROM products\")\n    LiveData<List<Product>> getAllProducts();\n}\n```\n\n\
  该 DAO 实现了插入、查找和删除数据库记录的方法。`insert` 方法接收要存储的 `Product` 对象，而 `find` 和 `delete` 方法接收用于执行操作的字符串。`getAllProducts()`\
  \ 方法返回包含所有记录的 `LiveData` 对象。此方法将用于保持界面中的 `RecyclerView` 列表与数据库同步。\n\n## 67.5 添加\
  \ Room 数据库\n\n向项目添加仓库之前的最后一个任务是实现 Room 数据库实例。向项目添加一个名为 `ProductDatabase` 的新类。在文件生成后，按照\
  \ \"Android Room 持久化库\"章节概述的步骤对其进行修改：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport android.content.Context;\nimport androidx.room.Database;\nimport androidx.room.Room;\n\
  import androidx.room.RoomDatabase;\n\n@Database(entities = {Product.class}, version\
  \ = 1)\npublic abstract class ProductDatabase extends RoomDatabase {\n    public\
  \ abstract ProductDao productDao();\n    private static ProductDatabase INSTANCE;\n\
  \n    static ProductDatabase getDatabase(final Context context) {\n        if (INSTANCE\
  \ == null) {\n            synchronized (ProductDatabase.class) {\n             \
  \   INSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n         \
  \               ProductDatabase.class, \"product_database\").build();\n        \
  \    }\n        }\n        return INSTANCE;\n    }\n}\n```\n\n## 67.6 添加仓库\n\n向项目添加一个名为\
  \ `ProductRepository` 的新类。\n\n\n\n\n\n`repository` 类将负责代表 `ViewModel` 与 `Room` 数据库进行交互。它必须提供使用\
  \ `DAO` 来插入、删除和查询产品记录的方法。除了 `getAllProducts()` DAO 方法（其返回一个 `LiveData` 对象）外，这些数据库操作必须在与主线程分离的线程中执行。\n\
  \n继续在 `ProductRepository.java` 文件中，添加一个处理程序的代码，将搜索结果返回给仓库线程：\n\n```java\npackage\
  \ com.ebookfrenzy.roomdemo;\n\nimport android.os.Handler;\nimport android.os.Looper;\n\
  import android.os.Message;\nimport java.util.concurrent.ExecutorService;\nimport\
  \ java.util.concurrent.Executors;\nimport androidx.lifecycle.MutableLiveData;\n\
  import java.util.List;\n\npublic class ProductRepository {\n    private final MutableLiveData<List<Product>>\
  \ searchResults = new MutableLiveData<>();\n    private List<Product> results;\n\
  \n    Handler handler = new Handler(Looper.getMainLooper()) {\n        @Override\
  \ public void handleMessage(Message msg) {\n            searchResults.setValue(results);\n\
  \        }\n    };\n}\n```\n\n上述代码声明了一个名为 `searchResults` 的 `MutableLiveData` 变量，每当异步搜索任务完成时，结果就会存储其中（在随后的教程中，`ViewModel`\
  \ 内部的观察者将监控此实时数据对象）。\n\n仓库类现在必须提供一些 `ViewModel` 可以调用以启动这些操作。然而然而仓库需要通过 `ProductRoomDatabase`\
  \ 实例获取 `DAO` 引用来实现。为 `ProductRepository` 类添加一个构造方法来执行这些任务：\n\n```java\nimport android.app.Application;\n\
  \npublic class ProductRepository {\n    private final MutableLiveData<List<Product>>\
  \ searchResults = new MutableLiveData<>();\n    private List<Product> results;\n\
  \    private final ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n    }\n}\n```\n\n在存储了 `DAO` 引用后，可以按照以下方式将方法添加到\
  \ `ProductRepository` 类文件中：\n\n```java\npublic void insertProduct(Product newproduct)\
  \ {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n    executor.submit(()\
  \ -> productDao.insertProduct(newproduct));\n    executor.shutdown();\n}\n\npublic\
  \ void deleteProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> productDao.deleteProduct(name));\n    executor.shutdown();\n\
  }\n\npublic void findProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> {\n        results = productDao.findProduct(name);\n\
  \        handler.sendEmptyMessage(0);\n    });\n    executor.shutdown();\n}\n```\n\
  \n在插入和删除方法中，创建并使用了适当的新线程来执行相应的数据库操作。在 `findProduct()` 方法中，会向 `handler` 发送消息，指示有新结果可用。\n\
  \n完成仓库类还剩最后一个任务。用户界面布局中的 `RecyclerView` 必须与数据库中存储的当前产品列表同步。`ProductDao` 类已经包含一个名为\
  \ `getAllProducts()` 的方法，该方法使用 SQL 查询选择所有数据库记录并将它们封装在 `LiveData` 对象中返回。仓库需要在初始化时调用此方法，并将结果存储在一个可以被\
  \ `ViewModel` 以及 UI 控制器观察的 `LiveData` 对象中。一旦设置好，每当数据库表发生变化时，UI 控制器观察者将收到通知，`RecyclerView`\
  \ 就可以更新最新的产品列表。继续在 `ProductRepository.java` 文件中，在构造函数中添加一个 `LiveData` 变量并调用 DAO\
  \ 的 `getAllProducts()` 方法：\n\n```java\nimport androidx.lifecycle.LiveData;\n\npublic\
  \ class ProductRepository {\n    private final MutableLiveData<List<Product>> searchResults\
  \ = new MutableLiveData<>();\n    private List<Product> results;\n    private final\
  \ LiveData<List<Product>> allProducts;\n    private final ProductDao productDao;\n\
  \n    public ProductRepository(Application application) {\n        ProductRoomDatabase\
  \ db;\n        db = ProductRoomDatabase.getDatabase(application);\n        productDao\
  \ = db.productDao();\n        allProducts = productDao.getAllProducts();\n    }\n\
  }\n```\n\n为了完成仓库，添加 `ViewModel` 可以调用以获取 `allProducts` 和 `searchResults` 实时对象引用的方法：\n\
  \n```java\nLiveData<List<Product>> getAllProducts() {\n    return allProducts;\n\
  }\n\nMutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n```\n\n### 67.7 添加 ViewModel\n\n`ViewModel` 负责创建仓库的实例，并提供 UI 控制器可以利用的方法和 `LiveData`\
  \ 对象，以保持用户界面与数据库同步。正如在 `ProductRepository.java` 中实现的那样，仓库构造函数需要访问应用上下文以获取 Room 实例。为了在\
  \ `ViewModel` 中访问应用上下文，它需要子类 `AndroidViewModel` 而不是 `ViewModel`。\n\n首先在 Project\
  \ 窗口中找到 `com.ebookfrenzy.viewmodel` 条目，右键点击它并选择 `New -> Java Class` 菜单选项。接下来，将新类命名为\
  \ `MainViewModel` 并按回车键。最后，编辑新文件将类改为扩展 `AndroidViewModel` 并实现默认构造函数：\n\n```java\n\
  package com.ebookfrenzy.viewdemo.main;\n\nimport android.app.Application;\nimport\
  \ androidx.lifecycle.AndroidViewModel;\nimport androidx.lifecycle.LiveData;\nimport\
  \ androidx.lifecycle.MutableLiveData;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import com.ebookfrenzy.roomdemo.ProductRepository;\nimport java.util.List;\n\npublic\
  \ class MainViewModel extends AndroidViewModel {\n    final ProductRepository repository;\n\
  \    final LiveData<List<Product>> allProducts;\n    final MutableLiveData<List<Product>>\
  \ searchResults;\n\n    public MainViewModel (Application application) {\n     \
  \   super(application);\n        repository = new ProductRepository(application);\n\
  \        allProducts = repository.getAllProducts();\n        searchResults = repository.getSearchResults();\n\
  \    }\n}\n```\n\n构造函数创建了一个仓库实例，然后使用它获取结果和 `LiveData` 数据对象的引用，以便 UI 控制器可以观察它们。现在\
  \ `ViewModel` 中剩下的所有工作是实现 UI 控制器内部响应按钮点击以及在设置 `LiveData` 对象观察者时调用的方法：\n\n```java\n\
  MutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n\nLiveData<List<Product>> getAllProducts() {\n    return allProducts;\n}\n\n\
  public void insertProduct(Product product) {\n    repository.insertProduct(product);\n\
  }\n\npublic void findProduct(String name) {\n    repository.findProduct(name);\n\
  }\n\npublic void deleteProduct(String name) {\n    repository.deleteProduct(name);\n\
  }\n```\n\n## 67.8 创建产品项布局\n\n\n\n\n\n数据库中的每个产品名称将出现在主用户界面的 `RecyclerView` 列表中。这需要一个布局资源文件，其中列表的每一行都包含一个\
  \ `TextView`。现在在 Project 工具窗口中右键点击 `app` -> `res` -> `layout` 项，并选择 `New` -> `Layout\
  \ Resource File` 菜单选项添加此文件。将文件命名为 `product_list_item`，并在点击 `OK` 创建文件并将其加载到布局编辑器之前，将根元素更改为垂直\
  \ `LinearLayout`。在布局编辑器的 Design（设计）模式下，从调色板中将 `TextView` 对象拖动到布局中，它将默认显示在布局的顶部：\n\
  \n![](img/as_3.5_roomdemo_item_layout.jpg)\n\n图 67-2\n\n在布局中选中 `TextView` 后，使用 Attributes（属性）工具窗口将视图的\
  \ ID 设置为 `product_row`，并将 `layout_height` 设置为 `30dp`。在 Component Tree（组件树）窗口中选择\
  \ `LinearLayout` 条目，并将 `layout_height` 属性设置为 `wrap_content`。\n\n### 67.9 添加 RecyclerView\
  \ 适配器\n\n正如 Working with the RecyclerView and CardView Widgets 章节中详细概述的那样，`RecyclerView`\
  \ 实例需要一个适配器类来提供要显示的数据。在 Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.roomdemo`\
  \ 项，并选择 `New` -> `Java Class` 菜单添加此类。在对话框中，将类命名为 `ProductListAdapter`，并在列表中选择 `Class`，然后按下键盘上的回车键。将生成的\
  \ `ProductListAdapter.java` 类加载到编辑器中，按如下方式实现该类：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  \nimport android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import android.widget.TextView;\nimport com.ebookfrenzy.roomdemo.R;\nimport androidx.annotation.NonNull;\n\
  import androidx.recyclerview.widget.RecyclerView;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import java.util.List;\n\npublic class ProductListAdapter extends RecyclerView.Adapter<ProductListAdapter.ViewHolder>\
  \ {\n\n    private final int productItemLayout;\n    private List<Product> productList;\n\
  \n    public ProductListAdapter(int layoutId) {\n        productItemLayout = layoutId;\n\
  \    }\n\n    public void setProductList(List<Product> products) {\n        productList\
  \ = products;\n        notifyDataSetChanged();\n    }\n\n    @Override\n    public\
  \ int getItemCount() {\n        return productList == null ? 0 : productList.size();\n\
  \    }\n\n    @NonNull\n    @Override\n    public ViewHolder onCreateViewHolder(ViewGroup\
  \ parent, int viewType) {\n        View view = LayoutInflater.from(parent.getContext()).inflate(productItemLayout,\
  \ parent, false);\n        return new ViewHolder(view);\n    }\n\n    @Override\n\
  \    public void onBindViewHolder(final ViewHolder holder, final int listPosition)\
  \ {\n        TextView item = holder.item;\n        item.setText(productList.get(listPosition).getName());\n\
  \    }\n\n    static class ViewHolder extends RecyclerView.ViewHolder {\n      \
  \  TextView item;\n        ViewHolder(View iteview) {\n            super(iteview);\n\
  \            item = iteview.findViewById(R.id.product_row);\n        }\n    }\n\
  }\n```\n\n### 67.10 准备 MainActivity\n\n最后一个需要修改的组件是 `MainActivity` 类，它需要为 `Button`\
  \ 视图配置监听器并为 `ViewModel` 类中的 live 数据 对象配置观察者。在添加这些代码之前，必须进行一些准备工作以添加导入导入和变量。编辑 `MainActivity.java`\
  \ 文件并进行如下修改：\n\n```java\nimport androidx.lifecycle.ViewModelProvider;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private MainViewModel viewModel;\n    private ProductListAdapter\
  \ adapter;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ viewModel = new ViewModelProvider(this).get(MainViewModel.class);\n        listenerSetup();\n\
  \        observerSetup();\n        recyclerViewSetup();\n    }\n```\n\n在代码的不同阶段，应用程序需要清除用户界面中显示的产品信息。为了避免重复，请添加以下\
  \ `clearFields()` 函数：\n\n```java\nprivate void clearFields() {\n    binding.productID.setText(\"\
  \");\n    binding.productName.setText(\"\");\n    binding.productQuantity.setText(\"\
  \");\n}\n```\n\n在应用构建和测试之前，需要将从 `onCreate()` 方法调用的三个方法添加到类中。\n\n### 67.1 添加按钮监听器\n\
  \n主 fragment 的用户界面布局包含三个按钮，每个按钮在用户点击时都需要执行特定的任务。编辑 `MainActivity.java` 文件并添加 `listenerSetup()`\
  \ 方法：\n\n```java\nimport com.ebookfrenzy.roomdemo.Product;\n\nprivate void listenerSetup()\
  \ {\n    binding.addButton.setOnClickListener(view -> {\n        String name = binding.productName.getText().toString();\n\
  \        String quantity = binding.productQuantity.getText().toString();\n     \
  \   if (!name.equals(\"\") && !quantity.equals(\"\")) {\n            Product product\
  \ = new Product(name, Integer.parseInt(quantity));\n            viewModel.insertProduct(product);\n\
  \            clearFields();\n        } else {\n            binding.productID.setText(\"\
  Incomplete information\");\n        }\n    });\n\n    binding.findButton.setOnClickListener(view\
  \ ->\n        viewModel.findProduct(binding.productName.getText().toString())\n\
  \    );\n\n    binding.deleteButton.setOnClickListener(view -> {\n        viewModel.deleteProduct(binding.productName.getText().toString());\n\
  \        clearFields();\n    });\n}\n```\n\n`addButton` 监听器执行一些基础验证，确保用户输入了名称和数量，并使用这些数据创建一个新的\
  \ `Product` 实体（注意数量字符串被转换为整数以匹配实体类型）。然后调用 `ViewModel.insertProduct()` 方法并传入 `Product`\
  \ 对象，最后清除字段。\n\n`findButton` 和 `deleteButton` 监听器将产品名称传递给 `ViewModel.findProduct()`\
  \ 或 `deleteProduct()` 方法。\n\n### 67.12 添加 LiveData 观察者\n\n用户界面现在需要添加观察者以与 `ViewModel`\
  \ 中的 `searchResults` 和 `allProducts` live 数据 对象保持同步。在 `MainActivity.java` 文件中，按如下方式实现\
  \ `observerSetup()` 方法：\n\n```java\nimport java.util.Locale;\n\nprivate void observerSetup()\
  \ {\n    viewModel.getAllProducts().observe(this, products ->\n        adapter.setProductList(products));\n\
  \n    viewModel.getSearchResults().observe(this, products -> {\n        if (products.size()\
  \ > 0) {\n            binding.productID.setText(String.format(Locale.US, \"%d\"\
  , products.get(0).getId()));\n            binding.productName.setText(products.get(0).getName());\n\
  \            binding.productQuantity.setText(String.format(Locale.US, \"%d\", products.get(0).getQuantity()));\n\
  \        } else {\n            binding.productID.setText(\"No Match\");\n      \
  \  }\n    });\n}\n```\n\n“所有产品”观察者将当前的产品列表传递给 `RecyclerViewAdapter` 的 `setProductList()`\
  \ 方法，从而更新显示的列表。\n\n\n\n\n“搜索结果”观察者会检查数据库中至少是否存在一个匹配的结果，从列表中提取第一个匹配的 `Product` 实体对象，从对象中获取数据，在必要时进行转换，并将其分配给布局中的\
  \ `TextView` 和 `EditText` 视图。如果产品搜索失败，将通过显示在产品 ID `TextView` 上的消息通知用户。\n\n### 67.13\
  \ 初始化 RecyclerView\n\n添加以下最终设置方法来初始化和配置 `RecyclerView` 适配器：\n\n```java\nimport androidx.recyclerview.widget.LinearLayoutManager;\n\
  \nprivate void recyclerSetup() {\n    adapter = new ProductListAdapter(R.layout.product_list_item);\n\
  \    binding.productRecycler.setLayoutManager(\n                new LinearLayoutManager(getContext()));\n\
  \    binding.productRecycler.setAdapter(adapter);\n}\n```\n\n### 67.14 测试 RoomDemo\
  \ 应用\n\n在设备或模拟器上编译并运行应用，添加一些产品，并确保它们自动显示在 `RecyclerView` 中。对现有产品进行搜索，并验证产品 ID 和数量字段是否随之更新。最后，输入现有产品的名称，将其从数据库中删除，并确认它已从\
  \ `RecyclerView` 产品列表中移除。\n\n### 67.15 使用数据库检查器\n\n正如之前在“Android Room 持久库”中概述的，可以使用\
  \ `Database Inspector` 工具检查与运行应用应用相关的 `Room` 数据库的内容，并执行细微的数据更改。在使用 `RoomDemo` 应用添加一些数据库记录后，通过\
  \ `View -> Tool Windows -> App Inspection` 菜单选项显示 `Database Inspector` 工具：\n\n在检查器窗口内部，从下方图\
  \ 67-3 中标记为 A 的菜单中选择正在运行的应用：\n\n![](img/as_database_inspector.jpg)\n\n图 67-3\n\n\
  在 `Databases` 面板 (B) 中，双击 `products` 表以查看当前存储在数据库中的表行。启用 Live updates（实时更新）选项 (C)，然后使用运行的应用向数据库添加更多记录。注意，`Database\
  \ Inspector` 会实时更新表数据 (D) 以反映更改。\n\n关闭 Live updates 以使表格不再是只读的，双击某表行的数量单元格，并在按下键盘\
  \ `Enter` 键之前更改值。返回运行的应用并搜索该产品，以确认在检查器中对数量的更改已保存到数据库表中。\n\n最后，点击表查询按钮（如文文图 67-4\
  \ 中的箭头所示）以显示新的查询标签页 (A)，确保选择了 `product_database` (B)，并在查询文本字段 (C) 中输入 SQL 语句并点击\
  \ `Run` 按钮 (D)：\n\n![](img/as_database_query.jpg)\n\n图 67-4\n\n行列表应会更新以反映 SQL 查询\
  \ (E) 的结果。\n\n### 67.16 总结\n\n本章演示了如何使用 `Room` 持久库在 `SQLite` 数据库中存储数据。完成的项目使用了存储库（repository）将\
  \ `ViewModel` 与所有数据库操作分离。它还演示了实体、`DAO` 和 `room` 数据库实例的创建，包括在执行某些数据库操作时使用异步任务。\n\n\
  # 68. 使用 Android 存储访问框架访问云存储\n\n近年来，远程存储服务（又称为“云存储”）在存储用户文件和数据方面被广泛采用。推动这一增长有两个关键因素。因素是，大多数移动设备现在都提供持续、高速的互联网连接，从而使数据传输变得快速且廉价。第二个因素是，与传统的计算机系统（如台式机和笔记本电脑）相比，这些移动设备在内部存储资源受到限制。例如，今天高规格的\
  \ Android 平板通常配备 128Gb 的存储容量。与带有 750Gb 硬盘的中端笔记本电脑系统相比，对文件进行无缝远程存储是今天许多移动应用的关键需求。\n\
  \n为了承认这一事实，Google 将 `Storage Access Framework`（存储访问框架）作为 Android 4.4 `SDK` 的一部分引入。本章将提供存储访问框架的高级概述，为下一章更详细的教程做准备，该章节标题为“Android\
  \ 存储访问框架示例。\n\n### 68.1 存储访问框架\n\n从用户的角度来看，`Storage Access Framework` 提供了一个直观的用户界面，允许用户在\
  \ Android 应用程序内部浏览、选择、删除和创建由存储服务（也称为文档提供程序）托管的文件。使用此浏览界面（也称为选择器），用户可以例如浏览他们所选文档提供程序托管的文件（如文档、音频、图像和视频）。例如，图\
  \ 68-1 显示了选择器用户界面显示了由文档提供程序服务托管的文件集合：\n\n![](img/as3.0_storage_picker.jpg)\n\n图\
  \ 68-1\n\n文档提供者可以从云端服务到运行在客户端应用程序同一台设备上的本地文档提供者不等。在编写本文时，兼容 `Storage Access Framework`\
  \ 的最著名的文档提供者是 `Box` 和，意料之中的 `Google Drive`。其他云存储提供者和应用程序开发者很快就会提供符合 `Storage Access\
  \ Framework` 的服务。\n\n除了云端文档提供者外，选择器还可以访问设备的内部存储，为应用程序提供一系列文件选项。\n\n通过一组 `Intents`，Android\
  \ 开发者只需几行代码即可将这些存储功能整合到应用程序中。对于开发者来说，`Storage Access Framework`特别吸引人的方面是，用户选择的底层文档提供程序对应用程序是完全透明的。一旦在应用程序中使用框架实现了存储功能，它就可以与任何文档提供者协同工作。\n\
  \n### 68.2 使用存储访问框架\n\nAndroid 包含了一组 `Intents`，用于将 `Storage Access Framework` 的功能集成到\
  \ Android 应用程序中。这些意向用户显示 `Storage Access Framework` 选择器用户界面，并通过调用启动意向的 `onActivityResult()`\
  \ 方法将交互结果返回给应用程序。当调用 `onActivityResult()` 方法时，将传递所选文件的 `Uri` 以及操作成功或失败的值。\n\n`Storage\
  \ Access Framework` 总结如下：\n\n- `ACTION_OPEN_DOCUMENT`：为用户提供选择器用户界面，以便从配置的文档提供程序中选择文件。所选文件以\
  \ `Uri` 对象的格式返回应用程序。\n- `ACTION_CREATE_DOCUMENT`：允许用户选择文档提供者、该提供器存储上的位置以及新文件的文件名。一旦选择，文件将由\
  \ `Storage Access Framework` 创建并将文件的 `Uri` 返回给应用程序进行进一步处理。\n\n### 68.3 过滤选择器文件列表\n\
  \n在启动 intent 时选择器用户界面中列出的文件可以使用多种选项进行过滤。考虑例如，配置 `ACTION_OPEN_DOCUMENT` intent 的代码：\n\
  \n\n\n\n\n```java\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n```\n\
  \n启动时，上述 intent 将导致显示文件选择器界面，允许用户浏览并选择由可用文档提供程序托管的任何文件。一旦用户选择了文件，应用程序将以 `Uri` 对象的形式获得该文件的引用。应用程序随后可以使用\
  \ `openFileDescriptor(Uri, String)` 方法打开该文件。然而，存在某种风险，即并非文档提供程序列出的所有文件都能通过这种方式打开。可以通过使用\
  \ `CATEGORY_OPENABLE` 选项修改 intent，从而在选择器中排除此类文件。例如：\n\n```java\nIntent intent =\
  \ new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  ```\n\n现在显示 intent 时，无法使用 `openFileDescriptor()` 方法打开的文件将列出，但用户无法选择它们。\n\n另一种实用的过滤方法允许根据文件类型限制可供选择的文件。这涉及指定应用程序能够处理的文件类型。例如，图像编辑应用程序可能只想为用户提供从文档提供程序中选择图像文件的选项。这是通过配置\
  \ intent 对象，指定用户可选的文件的 MIME 类型来实现的。例如，以下代码指定了只有图像文件适用于选择器选择：\n\n```java\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");\n```\n\n这可以进一步精炼以限制选择 JPEG 图像：\n\n```java\nintent.setType(\"\
  image/jpeg\");\n```\n\n或者，音频播放器应用可能只能处理音频文件：\n\n```java\nintent.setType(\"audio/*\"\
  );\n```\n\n该音频应用可能进一步限制为仅支持播放 MP4 格式的音频文件：\n\n```java\nintent.setType(\"audio/mp4\"\
  );\n```\n\n在使用存储访问框架（Storage Access Framework）时，可以使用广泛的 MIME 类型设置，其中更常见的可以在网上找到列表：\n\
  \nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n## 68.4 处理 Intent 结果\n\n由于我们正在启动将返回结果的 intent，需要使用 `registerForActivityResult()`\
  \ 方法（在“Android 显式 Intent – 示例”章节中介绍）来创建一个启动器并声明一个 lambda 表达式来处理返回的数据，例如：\n\n```java\n\
  ActivityResultLauncher<Intent> startOpenForResult = registerForActivityResult(\n\
  \    new ActivityResultContracts.StartActivityForResult(),\n    new ActivityResultCallback<ActivityResult>()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 在此处从 Uri 读取文件内容\n  \
  \          }\n        }\n    });\n```\n\n一旦声明，可以如下所示配置并启动 intent：\n\n```java\nIntent\
  \ intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"text/plain\");\nstartOpenForResult.launch(intent);\n```\n\n## 68.5\
  \ 读取文件内容\n\n读取文档提供程序托管的文件内容所需的具体步骤在很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与图像或音频文件的步骤不同。\n\
  \n可以通过从 `Uri` 对象中提取文件描述符，然后将图像解码为 `BitmapFactory` 实例，将图像文件赋值给 `Bitmap` 对象。例如：\n\n\
  ```java\nParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nFileDescriptor fileDescriptor = pFileDescriptor.getFileDescriptor();\n\
  Bitmap image = BitmapFactory.decodeFileDescriptor(fileDescriptor);\npFileDescriptor.close();\n\
  myImageView.setImageBitmap(image);\n```\n\n注意，文件描述符是以“r”模式打开的。这表示文件将以读取模式打开。其他选项是“w”用于写入访问，“rwt”用于读写访问，其中文件中的现有内容将被新内容截断。\n\
  \n读取文本文件的内容需要稍多工作，并使用 `InputStream` 对象。例如，以下代码从文本文件中读取行：\n\n```java\nInputStream\
  \ inputStream = getContentResolver().openInputStream(uri);\nBufferedReader reader\
  \ = new BufferedReader(new InputStreamReader(inputStream));\nString readline;\n\
  while ((readline = reader.readLine()) != null) {\n    // 对行进行某些操作\n}\ninputStream.close();\n\
  ```\n\n## 68.6 将内容写入文件\n\n写入文档提供程序托管的打开文件与读取相似，不同之处使用的是输出流而不是输入流。例如，以下代码向输出流写入文本：\n\
  \n```java\ntry {\n    ParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"w\");\n    FileOutputStream fileOutputStream = new FileOutputStream(pFileDescriptor.getFileDescriptor());\n\
  \    String textContent = \"Some text\";\n    fileOutputStream.write(textContent.getBytes());\n\
  \    fileOutputStream.close();\n    pFileDescriptor.close();\n} catch (FileNotFoundException\
  \ e) {\n    e.printStackTrace();\n} catch (IOException e) {\n    e.printStackTrace();\n\
  }\n```\n\n首先，从 `Uri` 中提取文件描述符，这次请求对目标文件的写入权限。随后使用文件描述符获取文件输出流的引用。在关闭文件描述符和输出流之前，将内容（示例中为文本）写入输出流。\n\
  \n## 68.7 删除文件\n\n是否可以从存储删除删除删除文件文件支持删除。假设允许删除，可以在指定的 `Uri` 上执行操作：\n\n```java\n\
  if (DocumentsContract.deleteDocument(getContentResolver(), uri)) {\n    // 删除成功\n\
  } else {\n    // 删除失败\n}\n```\n\n## 68.8 获取持久访问\n\n当应用程序通过存储访问框架获取文件访问时，该访问将一直有效，直到运行应用程序的\
  \ Android 设备重启。可以通过“获取” `Uri` 的必要权限来获取特定文件的持久访问。例如，以下代码为 `fileUri` 实例持久化读写权限：\n\n\
  ```java\nfinal int takeFlags = intent.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\ngetContentResolver().takePersistableUriPermission(fileUri,\
  \ takeFlags);\n```\n\n一旦应用程序获取了文件的权限，并且应用程序保存了 `Uri`，用户在设备重启后应该能够继续访问文件，而无需从选择器界面重新选择文件。\n\
  \n如果在任何时间不再需要持久化权限，可以通过调用内容解析器的 `releasePersistableUriPermission()` 方法释放它们：\n\n\
  ```java\nfinal int releaseFlags = intent.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\ngetContentResolver().releasePersistableUriPermission(fileUri,\
  \ releaseFlags);\n```\n\n### 68.9 总结\n\n\n\n\n\n思考近年来人们对“存储”的认知发生了怎样的变化很有趣。“存储”一词曾与大容量内置硬盘驱动器同义，但现在它同样可能指代远程托管在云端并通过互联网连接访问的存储空间。随着资源受限的“始终连接型”移动设备的广泛采用，这种情况正变得日益普遍。\n\
  \nAndroid 存储访问框架（Storage Access Framework）为用户和应用程序开发者提供了一种简单的机制，可以无缝访问存储在云端的文件。通过使用一组意图（intents）以及用于选择文档提供和文件的内置用户界面，现在可以使用少量代码将全面的云存储集成到\
  \ Android 应用中。\n\n# 69 Android 存储访问框架示例\n\n如前所述，存储访问框架极大地简化了将云存储访问集成到 Android 应用程序的过程。通过一个选择器用户界面和一组新意图，现在可以相对容易在\
  \ Android 应用程序中构建对 Google Drive 和 Box 等文档提供程序存储文件的访问。\n\n在上一节介绍了 Android 存储访问框架的基础知识后，本章将演示创建一个示例应用程序，该程序使用存储访问框架来存储和管理文件。\n\
  \n## 69.1 关于存储访问框架示例\n\n在本章创建的 Android 应用程序将作为一个原始文本编辑器的形式，旨在创建并将文本文件远程存储到云存储服务中。在实践中，该示例将与任何兼容存储访问框架的云文档存储提供程序配合，但为了本示例的目的，假设使用\
  \ Google Drive。\n\n在功能方面，该应用程序将为用户提供一个多行文本视图，可以在其中输入和编辑文本，并带一组允许创建、打开和保存基于存储的文本文件的按钮。\n\
  \n## 69.2 创建存储访问框架示例\n\n从欢迎界面选择“New Project”（新建项目）选项，在出现的新项目对话框中，选择“Empty Views\
  \ Activity”模板，然后点击“Next”（下一步）按钮。\n\n在 Name（名称）字段中输入 `StorageDemo`，并指定 `com.ebookfrenzy.storagedemo`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level（最低 API 级别）设置改为 `API 26: Android 8.0\
  \ (Oreo)`，并将语言菜单设置为 `Java`。\n\n按照 11.8 将项目迁移到 View Binding 节中的常规步骤，为项目添加 view binding\
  \ 支持。\n\n### 69.3 设计用户界面\n\n用户界面需要由三个 `Button` 视图和一个 `EditText` 视图组成。在 Project 工具窗口中，导航到位于\
  \ `app -> res -> layout` 的 `activity_main.xml` 布局文件，并双击将其加载到 Layout Editor 工具中。在工具的\
  \ Design（设计）模式下，选择并删除 Hello World! `TextView` 对象。\n\n在布局的左上角拖动并放置一个 `Button` 组件，以便在放置组件之前出现左侧和顶部的虚线边距指南（margin\
  \ guidelines）。放置第二个 `Button`，使中心和顶部的边距指南出现。然后放置第三个 `Button` 组件，使顶部和右侧的边距指南出现。\n\n\
  将三个按钮的文本属性分别改为“New”、“Open”和“Save”。接下来，放置一个 Plain Text（纯文本）组件，使其水平居中并位于中心按钮下方，以便用户界面的布局与\
  \ 图 69-1 所示。使用 Layout Editor 工具栏中的 `Infer Constraints`（推约束约束）按钮添加任何的约束。\n\n选择布局中的\
  \ Plain Text 组件，删除当前的文本属性设置，使字段初始为空，并将 ID 设置为 `fileText`。接下来，将字符串属性提取为命名为 `string`、`open_string`\
  \ 和 `save_string` 的资源值。\n\n![](img/as_storagedemo_ui.jpg)\n\n图 69-1\n\n使用 Attributes（属性）工具窗口，配置\
  \ `Button` 组件上的 `onClick` 属性，分别调用名为 `newFile`、`openFile` 和 `saveFile` 方法。\n\n##\
  \ 69.4 添加 Activity 启动器\n\n按照 Android 显式意图 – 实例示例章节概述的步骤，我们需要开始注册 activity 启动器（launchers）来处理文件内容的创建、打开和保存。\n\
  \n在 `MainActivity.java` 文件中，如下为三个操作中的每一个添加一个启动器：\n\n```java\nimport androidx.activity.result.ActivityResult;\n\
  import androidx.activity.result.ActivityResultCallback;\nimport androidx.activity.result.ActivityResultLauncher;\n\
  import androidx.activity.result.contract.ActivityResultContracts;\nimport android.app.Activity;\n\
  import android.content.Intent;\nimport android.net.Uri;\nimport java.io.IOException;\n\
  \nActivityResultLauncher<Intent> startOpenForResult =\n    registerForActivityResult(\n\
  \        new ActivityResultContracts.StartActivityForResult(),\n        new ActivityResultCallback<ActivityResult>()\
  \ {\n            @Override\n            public void onActivityResult(ActivityResult\
  \ result) {\n                if (result.getResultCode() == Activity.RESULT_OK) {\n\
  \                    Intent data = result.getData();\n                    if (data\
  \ != null) {\n                        Uri currentUri = data.getData();\n       \
  \                 try {\n                            String content = readFileContent(currentUri);\n\
  \                            binding.fileText.setText(content);\n              \
  \          } catch (IOException e) {\n                            // Handle error\n\
  \                        }\n                    }\n                }\n         \
  \   }\n        }\n    );\n\nActivityResultLauncher<Intent> startSaveForResult =\n\
  \    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        result -> {\n            if (result.getResultCode() == Activity.RESULT_OK)\
  \ {\n                Intent data = result.getData();\n                if (data !=\
  \ null) {\n                    Uri currentUri = data.getData();\n              \
  \      try {\n                        writeFileContent(currentUri);\n          \
  \          } catch (IOException e) {\n                        // Handle error\n\
  \                    }\n                }\n            }\n        }\n    );\n\n\
  ActivityResultLauncher<Intent> startCreateForResult =\n    registerForActivityResult(\n\
  \        new ActivityResultContracts.StartActivityForResult(),\n        new ActivityResultCallback<ActivityResult>()\
  \ {\n            @Override\n            public void onActivityResult(ActivityResult\
  \ result) {\n                if (result.getResultCode() == Activity.RESULT_OK) {\n\
  \                    Intent data = result.getData();\n                    if (data\
  \ != null) {\n                        binding.fileText.setText(\"\");\n        \
  \            }\n                }\n            }\n        }\n    );\n```\n\n###\
  \ 69.5 创建新的存储文件\n\n当选择 New 按钮时，应用程序需要触发一个配置为创建纯文本 MIME 类型文件的 `ACTION_CREATE_DOCUMENT`\
  \ 意图。在设计用户界面时，New 按钮被配置为调用名为 `newFile()` 的方法。正是在这个方法中需要启动相应的意图。\n\n继续留在 `MainActivity.java`\
  \ 文件中，按如下实现此方法：\n\n\n\n\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    public void newFile(View\
  \ view)\n    {\n        Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);\n\
  \        intent.addCategory(Intent.CATEGORY_OPENABLE);\n        intent.setType(\"\
  text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE, \"newfile.txt\");\n\
  \        startCreateForResult.launch(intent);\n    }\n\n.\n.\n}\n```\n\n这段代码创建了一个新的\
  \ `ACTION_CREATE_INTENT` `Intent` 对象。随后对该 intent 进行了配置，使得只有可以使用文件描述符打开的文件会被返回（通过\
  \ `Intent.CATEGORY_OPENABLE` 类别设置）。\n\n接下来，代码指定了要打开的文件具有纯文本 MIME 类型，并提供了一个占位符文件名（用户可以在选择器界面中更改该文件名）。\n\
  \n当执行此方法且该 intent 完成了分配的任务时，将调用 `startCreateForResult()` lambda 表达式，并传入新创建的的的 `Uri`。\n\
  \n## 69.6 保存到存储文件\n\n现在应用程序已经能够创建新的存储型文件，下一步是添加将用户输入的任何文本保存到文件的功能。用户界面配置为在用户选择保存（Save）按钮时调用\
  \ `saveFile()` 方法。该方法将负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新 intent，这将显示选择器用户界面，使用户从中选择要存储文本的文件。\n\
  \n由于我们只处理纯文本文件，因此需要对 intent 进行配置，将用户的选项限制为与 `text/plain` MIME 类型匹配的现有文件。在确定了 `saveFile()`\
  \ 方法要执行的操作后，现在可以按照如下所示将其添加到 `MainActivity.java` 类文件中：\n\n```java\npublic void saveFile(View\
  \ view)\n{\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startSaveForResult.launch(intent);\n}\n\
  ```\n\n分配给 `startSaveForResult()` 的 lambda 调用了名为 `writeFileContent()` 的方法，并传递了要写入文本的文件\
  \ `Uri`。\n\n继续留在 `MainActivity.java` 文件中，现在实现此方法，使其读取内容如下：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport java.io.FileOutputStream;\n\nimport android.os.ParcelFileDescriptor;\n\n\
  public class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    private void\
  \ writeFileContent(Uri uri) throws IOException\n    {\n        try{\n          \
  \  ParcelFileDescriptor pfd =\n                    this.getContentResolver().\n\
  \                            openFileDescriptor(uri, \"w\");\n            FileOutputStream\
  \ fileOutputStream =\n                    new FileOutputStream(\n              \
  \              pfd.getFileDescriptor());\n            String textContent =\n   \
  \                 binding.fileText.getText().toString();\n            fileOutputStream.write(textContent.getBytes());\n\
  \            fileOutputStream.close();\n            pfd.close();\n        } catch\
  \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n.\n}\n\
  ```\n\n该方法首先从用户选择的文件 `Uri` 中获取并打开文件描述符。由于代码需要写入文件，因此描述符以写入模式（“w”）打开。随后，使用该文件描述符作为创建输出流的基础，从而应用程序能够写入文件。用户输入的文本从编辑对象中提取，并在文件描述符和流关闭之前写入输出流。代码中还添加了处理文件写入期间任何\
  \ IO 异常的代码。\n\n## 69.7 打开并读取存储文件\n\n编写完创建和保存文件的代码后，最后的任务是添加从存储中打开和读取文件的功能。这将涉及编写\
  \ `openFile()` `onClick` 事件处理器并实现它，以便启动一个 `ACTION_OPEN_DOCUMENT` intent：\n\n```java\n\
  public void openFile(View view)\n{\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  \    intent.addCategory(Intent.CATEGORY_OPENABLE);\n    intent.setType(\"text/plain\"\
  );\n    startOpenForResult.launch(intent);\n}\n```\n\n下一个任务是实现由 `startOpenForResult()`\
  \ lambda 用的 `readFileContent()` 方法：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \n.\n\n.\n\nimport java.io.BufferedReader;\nimport java.io.InputStream;\nimport\
  \ java.io.InputStreamReader;\n\n.\n\n.\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n.\n\n.\n\n    private String readFileContent(Uri uri) throws IOException\
  \ {\n        InputStream inputStream =\n                getContentResolver().openInputStream(uri);\n\
  \        BufferedReader reader =\n                new BufferedReader(new InputStreamReader(\n\
  \                    inputStream));\n        StringBuilder stringBuilder = new StringBuilder();\n\
  \        String currentline;\n        while ((currentline = reader.readLine()) !=\
  \ null) {\n            stringBuilder.append(currentline).append(\"\\n\");\n    \
  \    }\n        inputStream.close();\n        return stringBuilder.toString();\n\
  \    }\n.\n\n.\n}\n```\n\n该方法首先提取所选文本文件的描述符并将其打开以便读取。随后打开与 `Uri` 关联的输入流并并作为 `BufferedReader`\
  \ 实例的输入源。\n\n文件中的每一行都被读取并存储在 `StringBuilder` 对象中。一旦读取完所有行，输入流和文件描述符都会被关闭。\n\n##\
  \ 69.8 测试存储应用程序\n\n编码阶段完成后，应用程序已准备好测试。编译并运行应用程序，选择新建（New）按钮。存储访问框架随后会显示如图 69-2 所示的下载界面。\n\
  \n\n\n\n\n需要注意的是，如果 Android 设备缺乏活跃的互联网连接，`Storage Access Framework` 将在本地缓存存储文件。然而，一旦重新连接，任何缓存数据都将与远程存储服务同步。因此，作为应用程序的最终测试，请在浏览器窗口登录您的\
  \ Google Drive 账号，导航到保存的文件并点击它查看内容，如果一切顺利，该内容应包含应用程序保存的文本。\n\n### 69.9 总结\n\n本章讲解了如何创建一个\
  \ Android Studio 应用程序示例，该程序是一个非常基础的文本编辑器，旨在使用云存储通过 `Android Storage Access Framework`\
  \ 来创建、保存和打开文件。\n\n# 70. 使用 VideoView 和 MediaController 类在 Android 上进行视频播放\n\n智能手机和平板电脑的主要用途之一是提供在线内容的访问。视频是一种广泛使用的关键内容形式，特别是在平板设备上。\n\
  \nAndroid SDK 包含了两个类，它们在开发应用程序时使得在 Android 设备上实现视频播放变得极其简单。本章将概述这两个类——`VideoView`\
  \ 和 `MediaController`，并创建一个视频播放应用程序。\n\n## 70.1 介绍 Android VideoView 类\n\n在 Android\
  \ 应用程序中显示视频的最简单方法是使用 `VideoView` 类。当此视觉组件被添加到 activity 的布局时，它提供了一个可以播放视频的表面。Android\
  \ 目前支持以下视频格式：\n\n• H.263\n• H.264 AVC\n• H.265 HEVC\n• MPEG-4 SP\n• VP8\n• VP9\n\
  \n`VideoView` 类拥有许多可以调用来管理视频播放的方法。一些常用的常用的方法如下：\n\n• `setVideoPath(String path)`\
  \ – 指定要播放的视频媒体路径（字符串格式）。这可以是远程视频文件的 URL，也可以是设备本地的视频文件。\n• `setVideoUri(Uri uri)`\
  \ – 执行与 `setVideoPath()` 方法相同的任务，但它接受 `Uri` 对象作为参数而不是字符串。\n• `start()` – 开始视频播放。\n\
  • `stopPlayback()` – 停止视频播放。\n• `pause()` – 暂停视频播放。\n• `isPlaying()` – 返回一个布尔值，指示视频是否正在播放。\n\
  • `setOnPreparedListener(MediaPlayer.OnPreparedListener)` – 允许在视频准备好播放时调用回调方法。\n\
  • `setOnErrorListener(MediaPlayer.OnErrorListener)` - 允许在视频播放期间发生错误时调用回调方法。\n• `setOnCompletionListener(MediaPlayer.OnCompletionListener)`\
  \ - 允许在视频结束时调用回调方法。\n• `getDuration()` – 返回视频的时长。除非从 `OnPreparedListener()` 回调方法内部调用，否则通常会返回\
  \ -1。\n• `getCurrentPosition()` – 返回一个指示当前播放位置的整数值。\n• `setMediaController(MediaController)`\
  \ – 指定一个 `MediaController` 实例，允许向用户显示播放控制控件。\n\n## 70.2 介绍 Android MediaController\
  \ 类\n\n如果使用 `VideoView` 类播放视频，用户将无法对播放进行任何控制，视频将一直运行到结束。这个问题可以通过将 `MediaController`\
  \ 类的实例挂载到 `VideoView` 实例上来解决。`MediaController` 将提供一组控制控件，允许用户管理播放（例如暂停以及在视频时间轴上后退/快进）。\n\
  \n控制控件的位置通过将控制器实例锚定到用户界面布局中的特定视图来指定。一旦挂载并锚定，控件在播放开始时会短暂出现，随后用户可以通过点击实例所锚定的视图来随时恢复它们。\n\
  \n该类的一些关键方法如下：\n\n• `setAnchorView(View view)` – 指定控制器将锚定的视图。这指定了控件在屏幕上的位置。\n• `show()`\
  \ – 显示控件。\n• `show(int timeout)` – 控件在指定时间（毫秒）内显示。\n• `hide()` – 向用户隐藏控制器。\n• `isShowing()`\
  \ – 返回一个布尔值，指示控件当前是否对用户可见。\n\n## 70.3 创建视频播放示例\n\n本章的剩余部分将创建一个示例应用程序，该程序使用 `VideoView`\
  \ 和 `MediaController` 类播放 MPEG-4 视频文件。\n\n从欢迎界面选择“New Project（新建项目）”选项，在出现的新项目对话框中，点击“Next（下一步）”按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在“Name（名称）”字段输入 `VideoPlayer` 并指定 `com.ebookfrenzy.videoplayer`\
  \ 为包名。在点击“Finish（完成）”按钮之前，将最小 API 级别设置为 `API 33: Android 13 (Tiramisu)`，并将语言菜单更改为\
  \ `Java`。使用第 11.8 Migrating a Project to View Binding 节中的步骤为项目启用视图绑定。\n\n## 70.4\
  \ 设计 VideoPlayer 布局\n\n主 activity 的用户界面将仅由 `VideoView` 类的实例组成。使用 Project 工具窗口找到\
  \ `app -> res -> layout -> activity_main.xml` 文件，双击它，将 Layout Editor 工具切换到 Design（设计）模式，并删除默认的\
  \ `TextView` 小部件。\n\n从 Palette 面板的 Widgets 类别中，将 `VideoView` 实例拖放到布局上以填充可用的画布区域，如图\
  \ 70-1 所示。使用 Attributes 面板将 `layout_width` 和 `layout_height` 属性分别更改为 `match_constraint`\
  \ 和 `wrap_content`。同时也将 `VideoView` 的底部连接到 `ConstraintLayout` 的底部。最后，将组件的 ID 改为\
  \ `videoView1`。\n\n![](img/as_3.5_videoplayer.jpg)\n图 70-1\n\n### 70.5 下载视频文件\n\n\
  `VideoPlayer` 应用程序播放的视频是用 MPEG-4 格式编码的短动画。使用网络浏览器导航到以下 URL 以播放视频：\n\nhttps://www.ebookfrenzy.com/android/demo.mp4\n\
  \n留在浏览器窗口中，右键点击视频，选择保存视频到本地文件，并选择合适的文件系统位置，命名为 `demo.mp4`。\n\n在 Android Studio 中，在\
  \ Project 工具窗口找到 `res` 文件夹，右键点击它，选择 `New -> Directory`，并在按下回键之前输入 `raw`。使用操作系统的文件导航器找到上面的\
  \ `demo.mp4` 文件并复制。返回 Android Studio，右键点击新创建的 `raw` 目录并选择 `Paste` 以将文件复制到项目中。添加后，`raw`\
  \ 文件夹应如 Project 工具窗口中的图 70-2 所示：\n\n![](img/as_video_player_movie_added.jpg)\n图\
  \ 70-2\n\n### 70.6 配置 VideoView\n\n下一步是为 `VideoView` 配置要播放的视频路径并开始播放。这将在主 activity\
  \ 初始化时执行，因此加载 `MainActivity.java` 文件到编辑器并按照列列出的进行修改：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.net.Uri;\n...\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n    }\n}\n```\n\n\n\n\n\n```java\n        setContentView(view);\n\
  \n        configureVideoView();\n\n    }\n\n    private void configureVideoView()\
  \ {\n        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n\
  \                + getPackageName() + \"/\" + R.raw.demo));\n        binding.videoView1.start();\n\
  \    }\n}\n```\n\n这段代码获取布局中 `VideoView` 实例的引用，为其分配一个指向 `raw` 资源目录中电影文件的 `Uri` 对象，然后开始播放视频。\n\
  \n通过在模拟器或物理 Android 设备上运行该应用程序来测试测试。应用程序启动后，在视频播放开始之前，视频内容缓冲时可能会有短暂的延迟（见图 70-3）。\n\
  \n![](img/as_video_player_running.jpg)\n\n图 70-3\n\n这展示了将视频播放集成到 Android 应用中是多么简单。示例中的所有内容都是通过一个\
  \ `VideoView` 实例和三行代码实现的。\n\n## 70.7 在 Video View 中添加 MediaController\n\n按照 `VideoPlayer`\
  \ 应用目前的状态，用户还无法控制播放。如之前所述，这可以通过 `MediaController` 类来实现。要为 `VideoView` 添加控制器，请再次修改\
  \ `configureVideoView()` 方法：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\n\
  .\n\n.\n\nimport android.widget.MediaController;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\n    private\
  \ MediaController mediaController;\n.\n.\n\n    private void configureVideoView()\
  \ {\n        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n\
  \                + getPackageName() + \"/\" + R.raw.demo));\n        mediaController\
  \ = new MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView.start();\n\
  \    }\n}\n```\n\n当实现这些更改并启动应用程序时，点击 `VideoView` 画布将使媒体控件出现在视频播放上层。这些控件应包含一个 `Seekbar`（进度条）以及快进、倒退和播放/暂停按钮。当控件从视图中消失后，可以随时再次点击\
  \ `VideoView` 画布来恢复。只需多写三行代码，我们的视频播放应用现在就有了媒体控件，如图 70-4 所示：\n\n![](img/as_3.6_video_player_media_controls.jpg)\n\
  \n图 70-4\n\n## 70.8 设置 onPreparedListener\n\n作为处理视频媒体的最后一个示例，该 Activity 将进一步扩展，以演示配置监听器的机制。在这种情况下，将实现一个监听器，用于将视频时长作为消息在\
  \ Android Studio Logcat 面板中输出。该监听器还将配置视频连续循环播放：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \n.\n.\n\nimport android.util.Log;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private ActivityMainBinding binding;\n\n    private MediaController mediaController;\n\
  \n    String TAG = \"VideoPlayer\";\n\n    private void configureVideoView() {\n\
  \        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n    \
  \            + getPackageName() + \"/\" + R.raw.demo));\n        MediaController\
  \ mediaController = new\n                    MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView1.setOnPreparedListener(mp\
  \ -> {\n            mp.setLooping(true);\n            Log.i(TAG, \"Duration: \"\
  \ + mp.getDuration());\n        });\n\n        binding.videoView1.start();\n   \
  \ }\n}\n```\n\n### 70.9 总结\n\nAndroid 是内容分发的极佳平台，特别是视频播放。如章所示，Android 提供了 `VideoView`\
  \ 和 `MediaController` 两个类，它们使得集成变得简单，通常只需要几行代码。\n\n## 71 画中画 (Picture-in-Picture)\n\
  \n在 Android 中进行多任务处理时，简单提到了画中画（PiP），但未详细介绍。本章将提供 PiP 模式的概述。\n\n### 71.1 画中画功能\n\n\
  如后文所述，Activity 会进入 PiP 模式。例如，图 71-1 展示了视频播放：\n\n![](img/Image2427.jpg)\n\n图 71-1\n\
  \n图 71-2 显示了用户点击后的 PiP 窗口：\n\n![](img/Image2436.jpg)\n\n图 71-2\n\n### 71.2 启用画中画模式\n\
  \nPiP 模式目前仅支持运行 API 26：Android 8.0 (Oreo) 或更高版本的设备。实现 PiP 模式的第一步是在项目的 manifest 文件中启用它。PiP\
  \ 模式通过向每个需要 PiP 支持的 Activity 添加以下行来按 Activity 进行配置：\n\n```xml\n<activity android:name=\"\
  .MyActivity\"\n    android:supportsPictureInPicture=\"true\"\n    android:configChanges=\"\
  screenSize|smallestScreenSize|screenLayout|orientation\">\n    <intent-filter>\n\
  \        <action android:name=\"android.intent.action.MAIN\" />\n        <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n`android:supportsPictureInPicture` 项启用了 Activity 的 PiP 功能，而 `android:configChanges`\
  \ 属性通知 Android 该 Activity 可以处理配置更改。如果没有此设置，每次 Activity 进入或退出 PiP 模式时，Activity 都会重新启动，导致视频在切换期间从头开始播放。\n\
  \n### 71.3 配置画中画参数\n\nPiP 行为通过使用 `PictureInPictureParams` 类定义，可以使用 `Builder` 类如下创建其实例：\n\
  \n```java\nPictureInPictureParams params = new PictureInPictureParams.Builder().build();\n\
  ```\n\n\n\n\n上述代码创建了一个具有定义特殊参数的默认 `PictureInPictureParams` 实例。也可以使用以下可选方法调用来自定义参数：\n\
  \n* `setActions()` – 用于定义当活动处于 PiP 模式时可以在 PiP 窗口中执行的操作。这些操作将在本章稍后部分进行详细介绍。\n* `setAspectRatio()`\
  \ – 声明 PiP 窗口显示的首选纵宽比。该方法接受一个包含高度/宽度比例的 `Rational` 对象作为参数。\n* `setSourceRectHint()`\
  \ – 接收一个 `Rect` 对象作为参数，定义在 PiP 窗口中显示的活动屏幕区域。\n\n例如，以下代码在 `PictureInPictureParams`\
  \ 对象中配置了纵宽比和操作参数。在纵宽比的情况下，它是使用 `VideoView` 实例的宽度和高度维度定义的：\n\n```java\nRational rational\
  \ = new Rational(videoView.getWidth(),\n                               videoView.getHeight());\n\
  PictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n    \
  \         .setAspectRatio(rational)\n             .setActions(actions)\n       \
  \      .build();\n```\n\n一旦定义，可以使用如下方式通过 `setPictureInPictureParams()` 方法随时设置 PiP\
  \ 参数：\n\n```java\nsetPictureInPictureParams(params);\n```\n\n在进入 PiP 模式时也可以指定参数。\n\
  \n## 71.4 进入画中画模式\n\n通过调用 `enterPictureInPictureMode()` 方法并传递 `PictureInPictureParams`\
  \ 对象，可以将活动置于画中画模式：\n\n```java\nenterPictureInPictureMode(params);\n```\n\n如果不需要参数，请按照上一个节所述的方法创建一个默认的\
  \ `PictureInPictureParams` 对象。如果之前已使用 `setPictureInPictureParams()` 方法设置了参数，则这些参数将与\
  \ `enterPictureInPictureMode()` 方法调用时指定的参数相结合。\n\n## 71.5 检测画中画模式的变化\n\n当活动进入 PiP\
  \ 模式时，隐藏不需要的视图是重要的，这样 PiP 窗口内就只可见视频播放。当活动重新进入全屏模式时，必须恢复被隐藏的用户界面组件。这些以及其他特定于应用程序的任务可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来实现。当该方法添加到活动后，每当活动在 PiP 和全屏模式之间切换时，都会调用该方法，并传递一个指示活动当前处于\
  \ PiP 模式的 `Boolean` 值：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(\n\
  \             boolean isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n        // Activity 进入画中画模式\n    } else {\n\
  \        // Activity 进入全屏模式\n    }\n}\n```\n\n## 71.6 添加画中画操作\n\n画中画操作会在用户点击 PiP\
  \ 窗口时以图标形式显示在窗口内。实现 PiP 操作是一个多步骤过程，首先要实现一种让 PiP 窗口通知活动已选择操作的方法。这通过在活动中设置广播接收器（broadcast\
  \ receiver），然后在 PiP 操作中创建一个 `pendingIntent` 来，该 `pendingIntent` 又被配置为广播接收器正在监听的意图（intent）。当意图触发广播接收器时，意图中存储的数据可用于识别执行的操作，并在活动中采取必要的行动。\n\
  \nPiP 操作使用 `RemoteAction` 实例声明，并用图标、标题、描述和 `PendingIntent` 对象初始化。一旦创建了一个或多个操作，它们会被添加到\
  \ `ArrayList` 中，并在构建 `PictureInPictureParams` 对象时传递给 `setActions()` 方法。\n\n以下代码片段演示了\
  \ `Intent`、`PendingIntent` 和 `RemoteAction` 对象的创建，并在构建 `PictureInPictureParams`\
  \ 对象时使用：\n\n```java\nfinal ArrayList<RemoteAction> actions = new ArrayList<>();\n\
  Intent actionIntent = new Intent(\"MY_ACTION\");\nfinal PendingIntent pendingIntent\
  \ = PendingIntent.getBroadcast(MyActivity.this, REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n\
  final icon = Icon.createResource(MyActivity.this, R.drawable.action);\nRemoteAction\
  \ remoteAction = new RemoteAction(icon, \"My Action Title\", \"My Action Description\"\
  , pendingIntent);\nactions.add(remoteAction);\nPictureInPictureParams params =\n\
  \    new PictureInPictureParams.Builder()\n             .setActions(actions)\n \
  \            .build();\n```\n\n### 71.7 总结\n\n画中画模式是引入的一项多任务功能，专门设计在执行其他应用程序任务时继续视频播放。在可以使用\
  \ PiP 模式之前，必须先在清单文件中启用。PiP 模式的行为使用 `PictureInPictureParams` 实例进行配置，并通过调用 `enterPictureInPictureMode()`\
  \ 启动。在 PiP 模式下，视频播放应该是唯一的，这需要隐藏其他用户界面元素。本章使用了广播接收器和等待队列通知活动。\n\n## 72. Android 画中画教程\n\
  \n遵循前面的章节，本章将对现有的 VideoPlayer 项目进行增强，添加画中画支持，包括检测 PiP 模式变化以及添加关于当前运行视频的操作。\n\n###\
  \ 72.1 在清单中添加画中画支持\n\n为 Android 应用添加 PiP 支持的第一步是在项目清单中启用它。打开 manifests -> AndroidManifest.xml\
  \ 文件并修改 activity 元素以启用 PiP 支持：\n\n```xml\n<activity\n    android:name=\".MainActivity\"\
  \n    android:supportsPictureInPicture=\"true\"\n    android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  \n    android:exported=\"true\">\n    <intent-filter>\n        <action android:name=\"\
  android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n    </intent-filter>\n</activity>\n```\n\n### 72.2 添加画中画按钮\n\n按照目前的的设计，VideoPlayer\
  \ 活动的布局仅包含一个 `VideoView` 实例。现在将添加按钮以切换到 PiP 模式。加载 `activity_main.xml` 文件到布局编辑器，并将调色板拖入\
  \ `Button` 对象到布局中，位置如图 72-1 所示。\n\n将按钮文本更改为“Enter PiP Mode”，并将其提取为名为 `enter_pip_mode`\
  \ 的资源。在继续之前，将按钮的 ID 改为 `pipButton`，并配置 `onClick` 属性调用方法 `enterPipMode`。\n\n### 72.3\
  \ 进入画中画模式\n\n\n\n\n\n现在必须将 `enterPipMode` onClick 回调方法添加到 `MainActivity.java` 类文件中。找到该文件并在代码编辑器中打开它，然后如下所示添加此方法：\n\
  \n```java\nimport android.app.PictureInPictureParams;\nimport android.util.Rational;\n\
  \npublic void enterPipMode(View view) {\n    Rational rational = new Rational(binding.videoView1.getWidth(),\n\
  \            binding.videoView1.getHeight());\n    PictureInPictureParams params\
  \ =\n            new PictureInPictureParams.Builder()\n                    .setAspectRatio(rational)\n\
  \                    .build();\n    binding.pipButton.setVisibility(View.INVISIBLE);\n\
  \    binding.videoView1.setMediaController(null);\n    enterPictureInPictureMode(params);\n\
  }\n```\n\n该方法首先获取 `Button` 视图的引用，然后创建一个包含 `VideoView` 宽度高度的 `Rational` 对象。接着使用 `PictureInPictureParams`\
  \ Builder 创建一组画中画参数，并将 `Rational` 对象作为视频播放的宽高比例传递。由于视频在 PiP 模式下不需要显示按钮，因此将其设置为不可见。视频播放控件也会被隐藏，这样视频视图在\
  \ PiP 模式下就不会被遮挡。\n\n在运行 Android 版本 8 或更高版本的设备或模拟器上编译并运行应用，并在视频开始前点击 PiP 模式按钮。视频播放将最小化并如所示显示在\
  \ PiP 窗口中：\n\n![](img/as_video_pip_window.jpg)\n\n图 72-2\n\n点击 PiP 窗口，然后点击窗口中心出现的全屏模式标记。虽然\
  \ activity 回到了全屏模式，但按钮和媒体播放控件仍然保持隐藏状态。\n\n显然，必须向项目中添加一些代码来检测 activity 发生 PiP 模式变化的情况。\n\
  \n## 72.4 检测画中画模式变化\n\n如上一节所述，通过重写受影响 activity 内部 `onPictureInPictureModeChanged()`\
  \ 方法可以检测 PiP 模式的变化。在这种情况下，必须编写该方法来检测 activity 是正在进入还是退出 PiP 模式，并采取适当的操作重新激活 PiP\
  \ 按钮和播放控件。留在 `MainActivity.java` 文件中，现在添加此方法：\n\n```java\n@Override\npublic void\
  \ onPictureInPictureModeChanged(boolean isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n\
  \        binding.videoView1.setMediaController(mediaController);\n    }\n}\n```\n\
  \n当调用该方法时，它会传入一个 `Boolean` 值，指示 activity 现在是否处于 PiP 模式。上述方法中的代码检查此值，以决定是否显示 PiP\
  \ 按钮并重新激活播放控件。\n\n### 72.5 添加广播接收器\n\n项目的最后一步是为 PiP 窗口添加一个动作。该动作的目的是显示一个包含当前播放视频名称的\
  \ `Toast` 消息。这需要在 PiP 窗口和 activity 之间进行通信。实现此点的最简单方法之一是在 activity 内部实现 `broadcastReceiver`，并使用\
  \ `pending intent` 从 PiP 窗口向 activity 广播消息。每次 activity 进入 PiP 模式时必须执行这些步骤，因此必须在\
  \ `onPictureInPictureModeChanged()` 方法中添加代码。现在找到该方法，并开始添加代码以创建 `intent filter` 并初始化\
  \ `broadcast receiver`：\n\n```java\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.IntentFilter;\n\
  import android.widget.Toast;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private BroadcastReceiver receiver;\n\n    @Override\n    public void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n        super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \        if (isInPictureInPictureMode) {\n            IntentFilter filter = new\
  \ IntentFilter();\n            filter.addAction(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n            receiver = new BroadcastReceiver() {\n                @Override\n\
  \                public void onReceive(Context context, Intent intent) {\n     \
  \               Toast.makeText(context, \"Favorite Movie\", Toast.LENGTH_LONG).show();\n\
  \                }\n            };\n            registerReceiver(receiver, filter,\
  \ Context.RECEIVER_EXPORTED);\n        } else {\n            binding.pipButton.setVisibility(View.VISIBLE);\n\
  \            binding.videoView1.setMediaController(mediaController);\n         \
  \   if (receiver != null) {\n                unregisterReceiver(receiver);\n   \
  \         }\n        }\n    }\n}\n```\n\n### 72.6 添加 PiP 动作\n\n实现广播接收器后，下一步是创建一个配置有图像的\
  \ `RemoteAction` 对象，用以表示 PiP 窗口中的动作。对于此示例，将使用名为 `ic_info_24dp.xml` 的图像文件。该文件可以在从以下\
  \ URL 下载的源码压缩包的 `project_icons` 文件夹中找到：https://www.payloadbooks.com/product/hedgehogjava\n\
  \n找到此图标文件并将其复制粘贴到项目窗口 `app -> res -> drawables` 文件夹中：\n\n![](img/as_video_pip_added.jpg)\n\
  \n图 72-3\n\n下一步创建一个发送广播接收器的 `Intent`。然后，该意需要被封装在 `PendingIntent` 对象中，以便在用户点击 PiP\
  \ 窗口中的按钮时触发该意。编辑 `MainActivity.java` 文件，添加一个创建 `Intent` 和 `PendingIntent` 对象的方法：\n\
  \n```java\nimport android.app.PendingIntent;\nimport static android.app.PendingIntent.FLAG_IMMUTABLE;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private static final\
  \ int REQUEST_CODE = 101;\n\n    private void createPipAction() {\n        Intent\
  \ actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n     \
  \   final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\n\
  \                REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    }\n}\n```\n\n\
  现在 `Intent` 对象和包含它的 `PendingIntent` 实例已经创建，需要创建一个 `RemoteAction` 对象，包含显示在 PiP 窗口中的图标以及\
  \ `PendingIntent` 对象。留在 `createPipAction()` 方法中，添加以下代码：\n\n```java\nimport android.app.RemoteAction;\n\
  import android.graphics.drawable.Icon;\nimport java.util.ArrayList;\n\nprivate void\
  \ createPipAction() {\n    ArrayList<RemoteAction> actions = new ArrayList<>();\n\
  \    Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\n\
  \            REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    final Icon icon =\
  \ Icon.createWithResource(MainActivity.this, R.drawable.ic_info_24dp);\n    RemoteAction\
  \ remoteAction = new RemoteAction(icon, \"Info\", \"Video Info\", pendingIntent);\n\
  \    actions.add(remoteAction);\n}\n```\n\n现在需要创建一个包含该动作的 `PictureInPictureParams`\
  \ 对象并应用这些参数，以便该动作在 PiP 窗口中显示：\n\n```java\nprivate void createPipAction() {\n   \
  \ ArrayList<RemoteAction> actions = new ArrayList<>();\n    Intent actionIntent\
  \ = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n}\n```\n\n\n\n\n```java\n\
  final PendingIntent pendingIntent =\n    PendingIntent.getBroadcast(MainActivity.this,\n\
  \        REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\nfinal Icon icon =\n    Icon.createWithResource(MainActivity.this,\n\
  \        R.drawable.ic_info_24dp);\nRemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\",\n    \"Video Info\", pendingIntent);\nactions.add(remoteAction);\nPictureInPictureParams\
  \ params =\n    new PictureInPictureParams.Builder()\n        .setActions(actions)\n\
  \        .build();\nsetPictureInPictureParams(params);\n```\n\n在测试操作之前的最后一个任务是在\
  \ Activity 进入 PiP 模式时，调用 `createPipAction()` 方法：\n\n```java\n@Override\npublic void\
  \ onPictureInPictureModeChanged(boolean isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  .\n.\n    registerReceiver(receiver, filter);\n    createPipAction();\n} else {\n\
  \    binding.pipButton.setVisibility(View.VISIBLE);\n    binding.videoView1.setMediaController(mediaController);\n\
  .\n.\n}\n```\n\n## 72.7 测试画中画操作\n\n重新运行应用并将 Activity 置于 PiP 模式。点击 PiP 窗口，使新的操作按钮出现，如图图\
  \ 72-4 所示：\n\n![](img/as_video_pip_with_actions.jpg)\n\n图 72-4\n\n点击操作按钮并等待 Toast\
  \ 消息出现，显示视频名称：\n\n![](img/as_video_pip_toast.jpg)\n\n图 72-5\n\n### 72.8 总结\n\n本章演示了如何在\
  \ Android Studio 应用项目添加添加画中画（PiP）支持，包括启用和进入 PiP 模式以及实现 PiP 操作。这包括使用广播接收器（broadcast\
  \ receiver）和等待意图（pending intents）来实现 PiP 窗口与 Activity 之间的通信。\n\n## 73 使用 MediaPlayer\
  \ 和 MediaRecorder 进行 Android 音频录制和播放\n\n本章将概述 `MediaRecorder` 类，并解释如何使用该类录制音频或视频。还将涵盖使用\
  \ `MediaPlayer` 类播放音频的内容。在介绍基础知识后，将创建一个示例应用来演示这些技术。除了处理音频和视频，本章还将涉及将文件保存到 SD 卡。\n\
  \n### 73.1 播放音频\n\n在音频播放方面，大多数 Android 的实现支持 AAC LC/LTP、`HE-AACv1` (AAC+)、`HE-AACv2`\
  \ (增强 AAC+)、`AMR-NB`、`AMR-WB`、`MP3`、`MIDI`、`Ogg Vorbis` 以及 `PCM/WAVE` 格式。\n\n可以使用\
  \ `MediaPlayer` 或 `AudioTrack` 类执行音频播放。`AudioTrack` 是更高级的选项，它使用流音频缓冲区并对音频提供更大的控制。而\
  \ `MediaPlayer` 类提供了更简单的编程接口来实现音频播放，能够满足大多数音频需求。\n\n`MediaPlayer` 类关联了一系列方法，应用程序可以通过这些方法来执行特定任务。该类一些关键方法的子集如下：\n\
  \n- `create()` – 调用以创建类的新实例，并传递要播放音频的 `Uri`。\n- `setDataSource()` – 设置音频播放的源。\n\
  - `prepare()` – 指令播放器准备好开始播放。\n- `start()` – 开始播放。\n- `pause()` – 暂停播放。可以通过调用 `resume()`\
  \ 方法恢复播放。\n- `stop()` – 停止播放。\n- `setVolume()` – 接受两个浮点参数，指定左右声道的音量。\n- `resume()`\
  \ – 恢复之前暂停的播放。\n- `reset()` – 重置播放器状态。\n- `release()` – 播放器使用的资源。\n\n### 73.2 使用\
  \ MediaRecorder 录制音频和视频\n\n与音频播放一样，录制可以使用不同的技术完成。一种方案是使用 `MediaRecorder` 类，它像 `MediaPlayer`\
  \ 类一样提供了一些用于录制的方法：\n\n- `setAudioSource()` – 指定要录制的音频源。\n- `setVideoSource()` –\
  \ 指定要录制的视频源。\n- `setOutputFormat()` – 指定录制的音频或视频存储的格式。\n- `setAudioEncoder()` –\
  \ 指定录制音频的编码器。\n- `setOutputFile()` – 配置录制音频或视频存储的文件路径。\n- `prepare()` – 准备 `MediaRecorder`\
  \ 实例以开始。\n- `start()` – 开始录制过程。\n- `stop()` – 停止录制过程。录制器停止后，重新启动前必须重新配置并准备。\n- `reset()`\
  \ – 重置录制器。重新启动前需要重新配置并准备。\n- `release()` – 在不再需要录制器实例时调用。此方法确保实例持有的所有资源被释放。\n\n\
  ### 73.3 关于示例项目\n\n本章剩余部分将创建一个示例应用，演示如何使用 `MediaPlayer` 和 `MediaRecorder` 类在 Android\
  \ 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能的应用（例如麦克风）时，在应用程序代码访问它之前检查该功能的可用性是重要的。因此，本章创建的应用还将包含检测设备是否存在麦克风的代码。\n\
  \n\n\n\n\n完成后，此应用程序将提供一个简单的界面，允许用户录制和播放音频。录制的音频将存储在设备上的音频文件中。尽管如此，本教程还将简要探索使用 SD\
  \ 卡存储的机制。\n\n### 73.4 创建 AudioApp 项目\n\n从欢迎界面选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击\
  \ Next（下一步）按钮之前，选择 Empty Views Activity 模板。\n\n在 Name（名称）字段中输入 `AudioApp`，并指定 `com.ebookfrenzy.audioapp`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 `API 31: Android 12.0`，并将 Language（语言）菜单更改为\
  \ `Java`。按照章节 11.8 将项目迁移到 View Binding 中概述的步骤为项目添加 view binding（视图绑定）支持。\n\n###\
  \ 73.5 设计用户界面\n\n创建新项目后，从 Project 工具窗口选择 `activity_main.xml` 文件，并在 Design（设计）模式下使用\
  \ Layout Editor（布局编辑器）工具，选择“Hello World!”TextView 并将其从布局中删除。\n\n将三个 `Button` 视图拖放到布局中。按钮的定位对于本示例来说至关重要，但图\
  \ 73-1 显示了使用垂直链的建议布局。\n\n配置按钮以显示读取为 Play（播放）、Record（录制）和 Stop（停止）的字符串资源，并分别为它们赋予\
  \ `playButton`、`recordButton` 和 `stopButton` 视图 ID。\n\n选择 Play 按钮，并在 Attributes（属性）面板中，配置\
  \ `onClick` 属性，以便在用户选择时调用名为 `playAudio` 的方法。重复这些步骤，配置其余按钮分别调用名为 `recordAudio` 和\
  \ `stopAudio` 的方法。\n\n![](img/as_audio_app_ui.jpg)\n\n图 73-1\n\n### 73.6 检查麦克风可用性\n\
  \n在没有麦克风的设备上尝试录音会导致 Android 系统抛出异常。因此，在进行此类尝试之前，代码检查麦克风的存在至关重要。实现这一点有多种方法，包括检查设备的物理存在。一种更简单且更有可能在不同\
  \ Android 设备上运行的方法是询问 Android 系统是否安装了针对特定功能的包。这涉及创建一个 `PackageManager` 类的实例，然后调用该对象的\
  \ `hasSystemFeature()` 方法。在这种情况下，`PackageManager.FEATURE_MICROPHONE` 是我们关注的功能。\n\
  \n对于此示例，我们将创建一个名为 `hasMicrophone()` 的方法，可以调用它来检查麦克风的存在。在 Project 工具窗口中，找到并双击 `MainActivity.java`\
  \ 文件并对其进行修改以添加此方法：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\n.\n.\n\nimport\
  \ android.content.pm.PackageManager;\n\n.\n.\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n.\n.\n    protected boolean hasMicrophone() {\n        PackageManager\
  \ pmanager = this.getPackageManager();\n        return pmanager.hasSystemFeature(\n\
  \                PackageManager.FEATURE_MICROPHONE);\n    }\n}\n```\n\n### 73.7\
  \ 初始化 Activity\n\n下一步是修改 activity 以执行若干初始化任务。留在 `MainActivity.java` 文件中，按如下方式修改代码：\n\
  \n```java\npackage com.ebookfrenzy.audioapp;\n\nimport java.io.File;\nimport java.io.IOException;\n\
  import androidx.annotation.NonNull;\nimport android.media.MediaRecorder;\nimport\
  \ android.os.Environment;\nimport android.media.MediaPlayer; \n.\n.\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \    private static MediaRecorder mediaRecorder;\n    private static MediaPlayer\
  \ mediaPlayer;\n    private static String audioFilePath;\n    private boolean isRecording\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ audioSetup();\n    }\n\n    private void audioSetup()\n    {\n        if (!hasMicrophone())\n\
  \        {\n            binding.stopButton.setEnabled(false);\n            binding.playButton.setEnabled(false);\n\
  \            binding.recordButton.setEnabled(false);\n        } else {\n       \
  \     binding.playButton.setEnabled(false);\n            binding.stopButton.setEnabled(false);\n\
  \        }\n        File audioFile = new File(this.getFilesDir(), \"audio.3gp\"\
  );\n        audioFilePath = audioFile.getAbsolutePath();\n    }\n.\n.\n```\n\n添加的代码调用了\
  \ `hasMicrophone()` 方法来确定设备是否包含麦克风。如果没有，则所有按钮都被禁用；否则，只有 Stop 和 Play 按钮被禁用。下一行代码需要稍微的解释：\n\
  \n`File audioFile = new File(this.getFilesDir(), \"audio.3gp\");`\n`audioFilePath\
  \ = audioFile.getAbsolutePath();`\n\n此代码在应用内部存储中创建一个名为 `myaudio.3gp` 的新文件以存储音频。\n\
  \n### 73.8 实现 recordAudio() 方法\n\n当用户触摸 Record 按钮时将调用 `recordAudio()` 方法。此方法需要开启关闭相应的按钮，并配置\
  \ `MediaRecorder` 实例，提供有关音频源、输出格式以及存储音频的文件位置的信息。最后，需要调用 `MediaRecorder` 对象的 `prepare()`\
  \ 和 `start()` 方法。这些要求产生了 `MainActivity.java` 文件中的以下方法：\n\n```java\npublic void recordAudio\
  \ (View view)\n{\n    isRecording = true;\n    binding.stopButton.setEnabled(true);\n\
  \    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    try {\n        mediaRecorder = new MediaRecorder(this);\n        mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  \        mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.THREE_GPP);\n\
  \        mediaRecorder.setOutputFile(audioFilePath);\n        mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);\n\
  \        mediaRecorder.prepare();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n    mediaRecorder.start();\n}\n```\n\n### 73.9 实现 stopAudio() 方法\n\n`stopAudio()`\
  \ 方法启用 Play 按钮，关闭 Stop 按钮，然后停止并重置 `MediaRecorder` 实例。实现此点的代码所示，并应添加到 `MainActivity.java`\
  \ 文件中：\n\n```java\npublic void stopAudio (View view)\n{\n    binding.stopButton.setEnabled(false);\n\
  \    binding.playButton.setEnabled(true);\n    if (isRecording)\n    {\n       \
  \ binding.recordButton.setEnabled(false);\n        mediaRecorder.stop();\n     \
  \   mediaRecorder.release();\n        mediaRecorder = null;\n        isRecording\
  \ = false;\n    } else {\n        mediaPlayer.release();\n        mediaPlayer =\
  \ null;\n        binding.recordButton.setEnabled(true);\n    }\n}\n```\n\n### 73.10\
  \ 实现 playAudio() 方法\n\n`playAudio()` 方法将创建一个新的 `MediaPlayer` 实例，将位于 SD 卡上的音频文件指定为数据源，然后准备并开始播放：\n\
  \n```java\npublic void playAudio (View view) throws IOException\n{\n    binding.playButton.setEnabled(false);\n\
  \    binding.recordButton.setEnabled(false);\n    binding.stopButton.setEnabled(true);\n\
  \    mediaPlayer = new MediaPlayer();\n    mediaPlayer.setDataSource(audioFilePath);\n\
  \    mediaPlayer.prepare();\n    mediaPlayer.start();\n}\n```\n\n### 73.11 配置和请求权限\n\
  \n\n\n\n在测试应用程序之前，必须在应用程序的清单文件中请求适当的权限。具体而言，应用程序将需要访问麦克风的权限。在 Project 工具窗口中，找到并双击\
  \ `AndroidManifest.xml` 文件将其加载到编辑器中，并修改 XML 添加权限标签：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\">\n    <uses-permission android:name=\"\
  android.permission.RECORD_AUDIO\" />\n    <application\n...\n```\n\n上述步骤将足以确保当应用安装在运行\
  \ Android 6.0 之前的版本的 Android 设备上时，用户会启用麦克风访问权限。在 Android 中，麦克风访问被归类为“危险权限”，因为它允许应用程序损害用户的隐私。为了让示例应用程序在\
  \ Android 6 或更高版本的设备上运行，需要添加代码以便在应用运行时请求权限。\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入直接指令和一个常量，用作所请求权限的请求标识码：\n\
  \n```java\n...\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\n...\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int RECORD_REQUEST_CODE\
  \ = 101;\n...\n```\n\n接下来，需要在类中添加一个方法，其目的是将要请求的权限和相应的请求标识码作为参数。在 `MainActivity.java`\
  \ 类文件中，如下所示实现该方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        ActivityCompat.requestPermissions(this,\n                new String[]{permissionType},\
  \ requestCode\n        );\n    }\n}\n```\n\n使用本书中“在 Android 中进行运行时权限请求”章节概述的步骤，上述方法会在发出请求之前验证指定的权限是否已经授予，并将标识码作为参数传递。\n\
  \n当请求处理完成后，将调用活动上的 `onRequestPermissionsResult()` 方法，并传递标识码和请求结果。因此，下一步是在 `MainActivity.java`\
  \ 文件中如下实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode,\n        @NonNull String[] permissions, @NonNull int[] grantResults)\
  \ {\n    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == RECORD_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0\n                || grantResults[0] !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            binding.recordButton.setEnabled(false);\n            Toast.makeText(this,\n\
  \                    \"Record permission required\",\n                    Toast.LENGTH_LONG).show();\n\
  \        }\n    }\n}\n```\n\n上述代码检查请求标识码，以识别哪个权限请求已返回，然后再检查相应的权限是否已授予。如果权限被拒绝，将向用户显示消息，指示应用程序将无法运行且录制按钮将被禁用。\n\
  \n在测试应用之前，剩下的工作工作是在应用启动时调用新添加的麦克风访问 `requestPermission()` 方法。在 `MainActivity.java`\
  \ 文件中，如下修改 `audioSetup()` 方法：\n\n```java\nprivate void audioSetup(){\n    binding.recordButton\
  \ = findViewById(R.id.recordButton);\n    binding.playButton = findViewById(R.id.playButton);\n\
  \    binding.stopButton = findViewById(R.id.stopButton);\n    if (!hasMicrophone()){\n\
  \        binding.recordButton.setEnabled(false);\n        binding.playButton.setEnabled(false);\n\
  \        binding.stopButton.setEnabled(false);\n    }\n}\n```\n\n### 73.12 测试应用程序\n\
  在带有麦克风的 Android 设备上编译并运行应用程序，允许麦克风访问，并点击 Record（录制）按钮。录制后，触摸 Stop（停止）。\n\n### 73.13\
  \ 总结\nAndroid SDK 提供了几种实现音频的机制。本章查看了其中两种：MediaPlayer 和 MediaRecorder 类。在涵盖了这些技术的理论后，本章通过创建一个示例应用程序来演示录制和回回放。在\
  \ Android 中处理音频时，本章还涉及了确保运行应用程序的设备具有麦克风的步骤。\n\n### 74. 在 Android Studio 中使用 Google\
  \ Maps Android API\n当 Google 在许多年前推出地图服务时，很难说他们是否曾预见到过会有可以集成到移动应用程序中的版本。当最终成为 Google\
  \ Maps 的第一个 Web 版本在 2005 年推出时，iPhone 尚未引发智能手机革命，而 Google 在几个月后才收购了开发 Android 操作系统的公司。无论\
  \ Google 对 Google Maps 的未来有什么抱负，考虑到现在可以通过 Android 应用程序直接访问 Google Maps 的所有功能，这是非常了不起的。\n\
  \n本章旨在提供 Google Maps 系统和 Google Maps Android API 的概述。本章将提供组成 API 的不同元素的概述，详细说明配置开发环境以用于\
  \ Google Maps 的必要步骤，然后通过一些代码示例演示 Google Maps 集成的一些基础知识。\n\n### 74.1 Google Maps\
  \ Android API 的元素\nGoogle Maps Android API 由一组核心类组成，这些类组合为 Android 应用程序提供地图功能。地图的关键元素如下：\n\
  \n- `GoogleMap`: Google Maps Android API 的主类。该类负责下载和显示地图瓦片，以及显示和响应地图控件。`GoogleMap`\
  \ 对象不是由应用程序直接创建的，而是在创建 `MapView` 或 `MapFragment` 实例时创建的。应用程序代码中，可以通过调用 `MapView`、`MapFragment`\
  \ 或 `SupportFragment` 实例的 `getMap()` 方法获取 `GoogleMap` 对象的引用。\n- `MapView`: `View`\
  \ 类的子类，该类提供了一个画布，`GoogleMap` 对象在上面绘制地图，从而允许将地图放置在活动的用户界面布局中。\n- `SupportFragment`:\
  \ `Fragment` 类的子类，该类允许在 Android 布局的 Fragment 中放置地图。\n\n\n\n\n-   **Marker（标记）**\
  \ – `Marker` 类的目的是允许在地图上标记位置。通过获取与地图关联的 `GoogleMap` 对象引用，然后调用该对象实例的 `addMarker()`\
  \ 方法即可将标记添加到地图。标记的位置通过 `Longitude`（经度）和 `Latitude`（纬度）定义。标记可以通过多种方式配置，包括指定标题、文本和图标。标记还可以设置为“可拖拽”，允许用户将标记移动到地图上的不同位置。\n\
  - **Shapes（形状）** – 使用 `Polyline`（折线）、`Polygon`（多边形）和 `Circle`（圆形）类可以在地图上绘制线条和形状。\n\
  - **UiSettings** – `UiSettings` 类自定义地图上显示的控件。例如，使用 `UiSettings`，应用程序可以控制地图上是否显示缩放、当前位置和指南针控件。该类还可以配置地图识别哪些触摸屏手势。\n\
  - **My Location Layer（我的位置层）** – 启用后，我的位置层会在地图上显示一个按钮，用户选择该按钮时，地图将中心到用户的当前地理位置。如果用户处于静止状态，蓝色标记将代表地图上的此位置。如果用户正在移动，则用一个指示用户行驶方向的箭头表示该位置。\n\
  \n熟悉 Google Maps Android API 的最佳方法是运行一个示例。本章的其余部分将创建一个基于 Google Maps 的应用程序，同时突出\
  \ API 的关键领域。\n\n### 74.2 创建 Google Maps 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框中选择\
  \ `No Activity`（无活动）模板，然后点击 `Next`（下一步）按钮。\n\n在 `Name` 字段输入 `MapDemo` 并指定 `com.ebookfrenzy.mapdemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26`：`Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单设置为 `Java`。\n\n接下来，在 Project 工具窗口中右键点击 `app` ->\
  \ `java` -> `com.ebookfrenzy.mapdemo` 项，选择 `New` -> `Google` -> `Google Maps Views\
  \ Activity` 菜单选项。最后，在 New Android Activity 对话框中点击 `Finish` 按钮之前，勾选 `Launcher Activity`\
  \ 复选框：\n\n![](img/as_map_activity.jpg)\n图 74-1\n\n## 74.3 创建 Google Cloud 结算账户在使用\
  \ Google Map APIs 之前，你必须创建一个 Google Cloud 结算账户（如果你已经有一个，可以跳到下一节）。要执行此操作，打开浏览器并使用以下链接导航到\
  \ Google Cloud 控制台：\n\n`https://console.cloud.google.com/`\n\n接下来，点击控制台页面左上角的菜单按钮，并如下图\
  \ 74-2 所示所示 `Billing`（结算）项：\n\n![](img/google_cloud_billing.jpg)\n图 74-2\n\n在 `Billing`\
  \ 页面上，选择添加新结算账户的选项，然后按照步骤开始免费试用。你必须提供信用卡开启账户，但在未经你同意的情况下，免费试用结束后 Google 不会收取费用。\n\
  \n### 74.4 创建新的 Google Cloud 项目\n\n下一步是创建一个与 `MapDemo` 应用程序关联的 Google Cloud 项目。要执行此操作，使用以下\
  \ URL 返回 Google Cloud 控制台仪表板：\n\n`https://console.cloud.google.com/home/dashboard`\n\
  \n在仪表板中，点击顶部工具栏上的 `Select a project`（选择项目）按钮：\n\n![](img/google_cloud_select_project.jpg)\n\
  图 74-3\n\n当项目选择对话框出现时，点击 `New Project`（新建项目）按钮（如图 74-4 所示）：\n\n![](img/google_cloud_new_project_button.jpg)\n\
  图 74-4\n\n当新项目屏幕出现时，为项目提供一个名称。控制台将在项目名称字段下方显示项目的默认 `id`。如果你不喜欢默认的 `id`，点击 `Edit`（编辑）按钮进行更改它：\n\
  \n![](img/google_cloud_new_project_dialog.jpg)\n图 74-5\n\n点击 `Create`（创建）按钮，稍作暂停后，你将返回仪表板，你的新项目将列在其中。\n\
  \n### 74.5 启用 Google Maps SDK\n\n现在我们已经创建了新的 Google Cloud 项目，下一步是允许项目使用 Google Maps\
  \ SDK。要启用 Google Maps 支持，在 Google Cloud 控制台中选择你的项目，点击左上角的菜单按钮，并选择 `Google Maps Platform`\
  \ 项。然后，从生成的菜单中选择如图 74-6 所示的 `APIs` 选项：\n\n![](img/google_cloud_maps_apis_menu.jpg)\n\
  图 74-6\n\n在 `APIs` 屏幕上，点击 `Maps SDK for Android` 选项，并在生成的屏幕上点击 `Enable`（启用）按钮：\n\
  \n![](img/google_cloud_enable_maps.jpg)\n图 74-7\n\n重复上述步骤以启用 `Geocoding API`（地理编码\
  \ API）凭据，本章稍后需要它来允许我们的应用程序显示用户的当前位置。\n\n一旦启用了项目的项目的凭据，点击返回箭头返回产品详情页，准备进行下一步。\n\n\
  ### 74.6 生成 Google Maps API 密钥\n\n在应用程序可以使用 Google Maps SDK 之前，必须配置 API 密钥以与 Google\
  \ Cloud 项目关联。要生成 API 密钥，选择 `Credentials`（凭据）菜单（如图 74-8 所示的 A），然后点击 `Create Credentials`（创建凭据）按钮（B）：\n\
  \n![](img/google_cloud_credentials.jpg)\n图 74-8\n\n凭据创建后，将显示 API 密钥的对话框：\n\n![](img/google_console_api_key_created.jpg)\n\
  图 74-9\n\n### 74.7 为 Android 添加 API 密钥\n\n现在我们已经了允许应用程序使用 Google Maps SDK 的 API\
  \ 密钥，必须将其添加到项目中。返回 Android Studio，编辑 `manifests` -> `AndroidManifest.xml` 文件并找到\
  \ API 密钥项，其内容如下：\n\n```xml\n<meta-data\n    android:name=\"com.google.geo.API_KEY\"\
  \n    android:value=\"YOUR_API_KEY\" />\n```\n\n删除 `YOUR_API_KEY` 并替换为密钥。\n\n接下来，编辑\
  \ `Gradle Scripts` -> `local.properties` 文件，添加如下的一行（用你的 API 密钥替换 `YOUR_API_KEY`）：\n\
  \n```properties\nMAPS_API_KEY=YOUR_API_KEY\n```\n\n### 74.8 测试应用程序\n\n运行应用程序以验证密钥\
  \ 配置是否正确。如果配置正确，应用程序将运行并在屏幕上显示地图。\n\n如果未显示地图，请检查以下区域：\n\n- 如果应用程序运行在模拟器上，请确保模拟器运行包含\
  \ Google APIs。可以通过选择 `Tools` -> `Android` -> `AVD Manager` 菜单选项更改操作系统，点击 AVD Actions\
  \ 列中的笔图标，然后点击当前 Android 版本旁 `Change…` 按钮。在系统映像对话框中选择包含 Google APIs 的目标。\n- 检查 `Logcat`\
  \ 输出是否有任何与 Google Maps API 身份验证相关的问题。通常意味着密钥输入错误。确保 `AndroidManifest.xml` 和 `local.properties`\
  \ 文件中的 API 密钥与在控制台中生成的密钥一致。\n\n### 74.9 理解地理编码和反向地理编码\n\n在讨论地图和地理位置之前，必须先涵盖地理编码（Geocoding）主题。地理编码是将基于文本的地理位置（例如街道地址）转换为以经度和纬度表示的地理坐标。\n\
  \n\n\n\n可以使用 Android 的 `Geocoder` 类来实现地理编码。例如，可以向 `Geocoder` 类的实例传递一个表示位置的字符串，例如城市名称、街道地址或机场代码。`Geocoder`\
  \ 将尝试查找与该位置匹配的项，并返回一个可能匹配该位置字符串的 `Address` 对象列表，这些对象按匹配程度排序，其中最匹配的项位于列表的索引 0。随后可以从这些\
  \ `Address` 对象中提取各种信息，包括潜在匹配项的经度和纬度。\n\n例如，以下代码请求位于华盛顿特区的国家航空航天博物馆的位置：\n\n```java\n\
  import java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\ndouble latitude;\ndouble longitude;\nList<Address>\
  \ geocodeMatches = null;\n\ntry {\n    geocodeMatches =\n        new Geocoder(this).getFromLocationName(\n\
  \            \"600 Independence Ave SW, Washington, DC 20560\", 1);\n} catch (IOException\
  \ e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n}\n\n\
  if (!geocodeMatches.isEmpty()) {\n    latitude = geocodeMatches.get(0).getLatitude();\n\
  \    longitude = geocodeMatches.get(0).getLongitude();\n}\n```\n\n注意，值 `1` 作为第二个参数传递给\
  \ `getFromLocationName()` 方法的。这告诉 `Geocoder` 在数组中仅返回一个结果。鉴于提供的地址具有特定性，应该只有一个潜在的匹配项。然而，对于更模糊的位置名称，可能需要请求更多的潜在匹配项并允许用户选择正确的项。\n\
  \n上述代码是正向编码的示例，其坐标是基于文本位置描述计算的。反向编码顾名思义，是将地理坐标翻译为人类可读的地址字符串。例如，考虑以下代码：\n\n```java\n\
  import java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\nList<Address> geocodeMatches = null;\nString\
  \ Address1;\nString Address2;\nString State;\nString Zipcode;\nString Country;\n\
  \ntry {\n    geocodeMatches =\n        new Geocoder(this).getFromLocation(38.8874245,\
  \ -77.0200729, 1);\n} catch (IOException e) {\n    // TODO Auto-generated catch\
  \ block\n    e.printStackTrace();\n}\n\nif (!geocodeMatches.isEmpty()) {\n    Address1\
  \ = geocodeMatches.get(0).getAddressLine(0);\n    Address2 = geocodeMatches.get(0).getAddressLine(1);\n\
  \    State = geocodeMatches.get(0).getAdminArea();\n    Zipcode = geocodeMatches.get(0).getPostalCode();\n\
  \    Country = geocodeMatches.get(0).getCountryName();\n}\n```\n\n`Geocoder` 对象通过\
  \ `getFromLocation()` 方法使用经度和纬度值进行初始化。再次，仅请求单个匹配结果。然后从生成的 `Address` 对象中提取基于的地址信息。\n\
  \n地理编码并不是在 Android 设备上执行的，而是在需要翻译时设备到的服务器上执行，并在翻译完成后返回结果。只有当设备具有活跃的互联网连接时才能进行地理编码。\n\
  \n### 74.10 为应用程序添加地图\n\n向应用程序添加地图最简单的方法是在 activity 的用户界面布局 XML 文件中指定它。以下布局文件显示了由\
  \ Android Studio 创建的 `activity_maps.xml` 文件添加的 `SupportMapFragment` 实例：\n\n```xml\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    android:id=\"@+id/map\"\n    tools:context=\"\
  .MapsActivity\"\n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n### 74.11 请求当前位置权限\n\n正如“在 Android 中请求运行时权限”章节中所述，某些权限是危险的，并且对于 Android\
  \ 6.0 或更高版本需要特殊处理。一组权限允许应用程序识别用户的位置。编辑 `AndroidManifest.xml` 文件并添加以下行：\n\n```xml\n\
  <uses-permission android:name=\"android.permission.FINE_LOCATION\" />\n<uses-permission\
  \ android:name=\"android.permission.COARSE_LOCATION\" />\n```\n\n这些设置确保了在旧版本上应用可以提供位置。然而，为了支持\
  \ Android 6.0 或更高版本，我们需要在 `MapsActivity.java` 中添加一些代码在运行时请求此权限。首先添加导入项和常量：\n\n```java\n\
  package com.demo;\n\nimport androidx.annotation.NonNull;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.core.app.ActivityCompat;\nimport android.Manifest;\nimport android.widget.Toast;\n\
  import android.content.pm;\n\npublic class MapsActivity extends FragmentActivity\
  \ implements OnMapReadyCallback {\n    static final int LOCATION_REQUEST_CODE =\
  \ 1;\n    private GoogleMap mMap;\n}\n```\n\n接下来，必须在类中添加一个方法向用户请求权限。在 `MapsActivity.java`\
  \ 文件中，实现此代码：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    ActivityCompat.requestPermissions(this, new String[]{permissionType},\
  \ requestCode);\n}\n```\n\n当用户响应权限请求时，将在 activity 上调用 `onRequestPermissionsResult()`。在\
  \ `MapsActivity.java` 中实现该方法，内容如下：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {\n \
  \   super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == LOCATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n            Toast.makeText(this,\
  \ \"Unable to show location - permission required\", Toast.LENGTH_LONG).show();\n\
  \        } else {\n            SupportMapFragment mapFragment = (SupportMapFragment)\
  \ getSupportFragmentManager()\n                .findFragmentById(R.id.map);\n  \
  \          mapFragment.getMapAsync(this);\n        }\n    }\n}\n```\n\n如果用户没有授予权限，应用将显示无法显示位置的消息。相反，如果授予了权限，地图将刷新以提供显示位置标记的机会。\n\
  \n### 74.12 显示用户的当前位置\n\n一旦获得了适当权限，可以通过获取与显示的地图相关的 `GoogleMap` 对象引用并调用该实例的 `setMyLocationEnabled()`\
  \ 方法（传递 `true` 值），在地图上显示用户的当前位置。\n\n\n\n\n当地图准备就绪显示时，activity 的 `onMapReady()` 方法会被调用。当地图在上面的\
  \ `onRequestPermissionsResult()` 方法中刷新时，此方法也会被调用。默认情况下，Android Studio 已经实现了此方法并添加了一些代码，将地图对准澳大利亚，并在悉尼市放置了一个标记。在\
  \ `MapsActivity.java` 文件中找到并编辑 `onMapReady()` 方法，移除此模板代码，并添加代码在启用显示用户当前位置之前检查是否授予位置权限。如果未授予权限，将通过调用之前添加的\
  \ `requestPermission()` 方法向用户请求：\n\n```java\n@Override\npublic void onMapReady(GoogleMap\
  \ googleMap) {\n    mMap = googleMap;\n    // 在悉德尼添加一个标记并移动相机\n    LatLng sydney\
  \ = new LatLng(-34, 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
  Marker in Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
  \    if (mMap != null) {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.ACCESS_FINE_LOCATION);\n        if (permission\
  \ == PackageManager.PERMISSION_GRANTED) {\n            mMap.setMyLocationEnabled(true);\n\
  \        } else {\n            requestPermission(\n                    Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                    LOCATION_REQUEST_CODE);\n        }\n    }\n}\n```\n\n现在运行应用，将弹出图\
  \ 74-10 所示的对话框请求位置权限。如果授予了权限，地图上将出现一个蓝点表示设备的位置。\n\n![](img/as_map_permission.jpg)\n\
  \n图 74-10\n\n### 74.13 更改地图类型\n\n可以通过调用相应 `GoogleMap` 对象的 `setMapType()` 方法并传递以下值之一来动态修改显示的地图类型：\n\
  \n- `GoogleMap.MAP_TYPE_NONE` – 一个不显示任何地图瓦片的空白网格。\n- `GoogleMap.MAP_TYPE_NORMAL`\
  \ – 由经典道路地图组成的标准视图。\n- `GoogleMap.MAP_TYPE_SATELLITE` – 显示地图区域的卫星图像。\n- `GoogleMap.MAP_TYPE_HYBRID`\
  \ – 在卫星图像上叠加道路地图。\n- `GoogleMap.MAP_TYPE_TERRAIN` – 显示等高线和颜色等地形信息。\n\n例如，对 `onMapReady()`\
  \ 方法进行以下代码更改可以将地图切换到卫星模式：\n\n```java\nif (mMap != null) {\n    int permission =\
  \ ContextCompat.checkSelfPermission(\n            this, Manifest.permission.ACCESS_FINE_LOCATION);\n\
  \    if (permission == PackageManager.PERMISSION_GRANTED) {\n        mMap.setMyLocationEnabled(true);\n\
  \    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n```\n\n或者，可以在嵌入地图的 XML 布局文件中通过 `map:mapType` 属性结合 none、normal、hybrid、satellite\
  \ 或 terrain 值来指定地图类型。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n       \
  \   xmlns:map=\"http://schemas.android.com/apk/res-auto\"\n          android:id=\"\
  @+id/map\"\n          android:layout_width=\"match_parent\"\n          android:layout_height=\"\
  match_parent\"\n          map:mapType=\"normal\"/>\n```\n\n### 74.14 向用户显示地图控件\n\
  \nGoogle Maps API 提供了多个可以启用或禁用的控件，例如缩放按钮、罗针和“我的位置”按钮。这些控件通过从 `GoogleMap` 实例获取的 `UiSettings`\
  \ 对象进行。\n\n```java\nUiSettings uiSettings = mMap.getUiSettings();\nuiSettings.setZoomControls(true);\n\
  uiSettings.setCompassEnabled(true);\nuiSettings.MyLocationButtonEnabled(true);\n\
  ```\n\n或者，这些控件可以在 XML 布局文件中配置：\n\n```xml\n<fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n          xmlns:map=\"http://schemas.android.com/apk/res-auto\"\n          android:id=\"\
  @+id/map\"\n          android:layout_width=\"match_parent\"\n          android:layout_height=\"\
  match_parent\"\n          map:mapType=\"normal\"\n          map:zoomControls=\"\
  true\"\n          map:compassEnabled=\"true\"\n          map:MyLocationButton=\"\
  true\"/>\n```\n\n### 74.15 处理地图手势\n\nGoogle Maps API 可以响应各种用户交互，如缩放、滚动、倾斜和旋转。\n\n\
  ### 74.15.1 缩放手势\n\n可以使用 `UiSettings` 实例的 `setZoomGestures()` 方法启用与放大和缩小相关的手势支持：\n\
  \n```java\nUiSettings uiSettings = mMap.getUiSettings();\nuiSettings.setZoomGestures(true);\n\
  ```\n\n在 XML 资源文件中，通过设置 `map:zoomGestures` 属性也可以实现相同的效果。启用后，用户在屏幕上进行捏合手势时会发生缩放。同样，双击会放大，而双指轻击会缩小。\n\
  \n### 74.15.2 滚动/平移手势\n\n滚动或平移手势允许用户通过单指拖动地图在地图上移动。这些可以通过 `setScrollGestures()`\
  \ 方法启用：\n\n```java\nUiSettings uiSettings = mMap.getUiSettings();\nuiSettings.setScrollGestures(true);\n\
  ```\n\n或者，可以在 XML 布局文件中使用 `map:scrollGestures` 属性启用地图的滚动。\n\n### 74.15.3 倾斜手势\n\n\
  倾斜手势允许用户通过将两个指放在屏幕上上下移动来倾斜地图的投影角度。可以通过 `UiSettings` 实例的 `setTiltGestures()` 方法开启或关闭：\n\
  \n```java\nUiSettings uiSettings = mMap.getUiSettings();\nuiSettings.setTiltGestures(true);\n\
  ```\n\n也可以在 XML 布局资源文件中使用 `map:tiltGestures` 属性开启或关闭倾斜功能。\n\n### 74.15.4 地图旋转手势\n\
  \n当启用地图旋转手势时，用户通过将两个指放在屏幕上并进行旋转运动可以旋转地图的方向。这种支持在代码中通过 `setRotateGestures()` 方法开启或关闭：\n\
  \n```java\nUiSettings uiSettings = mMap.getUiSettings();\nuiSettings.setRotateGestures(true);\n\
  ```\n\n## 74.16 创建地图标记\n\n\n\n\n标记（Markers）用于向用户标识地图上的位置，其形式可以是标准图标或自定义图标。标记还可以包含一个标题和可选文本（称为片段，snippet），并可以配置为允许用户拖动到地图上的不同位置。当用户点击标记时，将会出现信息窗口（info\
  \ window），显示关于标记位置的额外信息。\n\n标记由 `Marker` 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()`\
  \ 方法添加到地图上。该方法接收一个 `MarkerOptions` 类的实例，包含了标记所需的各种选项（如标题和片段文本），并作为参数传递给该方法。标记的位置通过指定纬度和经度值来定义，这些值也包含在\
  \ `MarkerOptions` 实例中。例如，以下代码在地图的特定位置添加了一个标记，包括标题、片段和位置：\n\n```java\nimport com.google.android.gms.maps.model.Marker;\n\
  import com.google.android.gms.maps.model.LatLng;\nimport com.google.android.gms.maps.model.MarkerOptions;\n\
  \nLatLng position = new LatLng(38.8874245, -77.0200729);\nMarker museum = mMap.addMarker(new\
  \ MarkerOptions()\n                .position(position)\n                .title(\"\
  Museum\")\n                .snippet(\"National Air and Space Museum\"));\n```\n\n\
  执行上述代码后将标记指定的位置，点击该位置时将显示一个包含标题和片段的信息窗口，如图 74-11 所示：\n\n![](img/Image24512.jpg)\n\
  \n图 74-11\n\n## 74.17 控制地图相机\n\n由于 Android 设备的屏幕是平面的，而地球是球体，Google Maps Android\
  \ API 使用墨卡托投影在平面上表示地球。地图的默认视图呈现给用户，就像通过一个悬挂在地图上方并直接指向地图的相机一样。Google Maps Android\
  \ API 允许在内部实时更改摄像机的目标（target）、缩放（zoom）、方位角（bearing）和倾斜（tilt）：\n\n- **Target** –\
  \ 地图在设备显示器内的中心位置，通过经纬度指定。\n- **Zoom** – 以级别单位指定的相机缩放级别。将缩放级别增加 1.0 会使显示的地图宽度增加一倍。\n\
  - **Tilt** – 相机的视角角度，指定为跨越可视地图区域正上方弧线上的位置，从弧顶开始以度测量（弧顶是弧的底点，即相机直接指向地图的位置）。\n- **Bearing**\
  \ – 地图的方向，以度表示，从北方向开始顺时针方向测量。\n\n相机的更改通过创建一个具有适当设置的 `CameraUpdate` 类实例来实现。`CameraUpdate`\
  \ 实例是通过调用 `CameraUpdateFactory` 类的方法创建的。一旦创建了 `CameraUpdate` 实例，就可以通过调用 `GoogleMap`\
  \ 实例的 `moveCamera()` 方法将其应用到地图。为了在相机变化时获得平滑的动画效果，可以调用 `animateCamera()` 方法代替 `moveCamera()`。\n\
  \n`CameraUpdateFactory` 方法的摘要如下：\n\n- `CameraUpdateFactory.zoomIn()` – 提供一个放大一级的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomOut()` - 提供一个缩小一级的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.zoomTo(float)` - 生成一个将缩放级别更改为指定值的 `CameraUpdate` 实例。\n\
  - `CameraUpdateFactory.zoomBy(float)` – 提供一个按指定量增加或减少缩放层级的 `CameraUpdate` 实例。\n\
  - `CameraUpdateFactory.zoomBy(float, Point)` - 创建一个按指定值增加或减少缩放级别的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLng(LatLng)` - 创建一个更改相机目标经纬度的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLngZoom(LatLng, float)` - 生成一个更改相机纬度、经度和缩放的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.newCameraPosition(CameraPosition)`\
  \ - 返回一个将相机移动到指定位置的 `CameraUpdate` 实例。可以使用 `CameraPosition.Builder()` 获取 `CameraPosition`\
  \ 实例。\n\n例如，以下代码使用动画将相机放大了一级：\n\n```java\nmMap.animateCamera(CameraUpdateFactory.zoomIn());\n\
  ```\n\n另一方面，以下代码将相机移动到新位置，并将缩放级别调整为 10，且不使用动画：\n\n```java\nprivate static final\
  \ LatLng position =\n    new LatLng(38.8874245, -77.0200729);\nmMap.moveCamera(CameraUpdateFactory.newLatLngZoom(position,\
  \ 10));\n```\n\n最后，下一个代码示例使用 `CameraPosition.Builder()` 创建了一个具有目标、缩放、方位角和倾斜更改的 `CameraPosition`\
  \ 对象。然后使用动画将此更改应用到相机：\n\n```java\nimport com.google.android.gms.maps.model.CameraPosition;\n\
  \nCameraPosition position = new CameraPosition.Builder()\n        .build();\nmMap.animateCamera(CameraUpdateFactory.newCameraPosition(position));\n\
  ```\n\n### 74.18 总结\n\n本章概述了构成 Google Maps Android API 的类和方法方法并概述了如何准备开发环境和应用程序项目以使用该\
  \ API。\n\n## 75 使用 Android 框架打印\n\nAndroid 框架用于打印内容。虽然后续章节将详细讨论为应用程序添加打印的选项，但本章将关注\
  \ Android 目前提供的各种选项。\n\n### 75.1 Android 打印架构\n\nAndroid 框架提供了打印功能。简单来说，该框架由一个打印管理器（Print\
  \ Manager）和若干打印服务插件（print service plugins）组成。\n\n打印管理器负责处理来自设备的打印请求，并与安装的打印服务插件交互，从而确保请求得到执行。\n\
  \n### 75.2 打印服务插件\n\n打印服务插件的作用是允许应用程序打印到通过局域无线网络或蓝牙对 Android 设备可见的打印机。可以通过加载 Google\
  \ Play 应用并搜索“Print Service Plugin”来验证 Android 设备上是否存在打印服务插件。例如，图 75-1 显示了 Google\
  \ Play 中的 HP 打印服务插件。\n\n\n\n\n\n![](img/as_4.1_hp_printer_plugin.jpg)\n图 75-1\n\n\
  ## 75.3 Google Cloud Print\n\nGoogle Cloud Print 是 Google 提供的一项服务，让您能够在任何连接到互联网的地方通过网络将内容打印到打印机上。Google\
  \ Cloud Print 支持“云就绪”（Cloud Ready）和“经典型”（Classic）打印机的多种设备型号。云就绪打印机内置了通过网络打印的技术。提供云就绪打印机的制造商包括\
  \ Brother、Canon、Dell、Epson、HP、Kodak 和 Samsung。如需确认您的打印机是否同时支持云就绪并受 Google Cloud\
  \ Print 支持，请查看以下 URL 中的打印机列表：\n\nhttps://www.google.com/cloudprint/learn/printers.html\n\
  \n对于经典的非云就绪打印机，Google Cloud Print 通过在连接经典打印机的计算机系统（直接连接或通过家庭或办公室网络）上安装软件来实现云打印支持。\n\
  \n要设置 Google Cloud Print，请访问以下网页并使用登录 Android 设备时相同的 Google 账号 登录：\n\nhttps://www.google.com/cloudprint/learn/index.html\n\
  \n一旦打印机添加到您的 Google Cloud Print 账户，当您从 Android 应用程序打印时，它们将作为打印目标选项列出。\n\n### 75.4\
  \ 打印到 Google Drive\n\n除了支持物理打印机，还可以将打印输出保存到您的 Google Drive 账户。从设备打印时，在打印面板中选择“保存到\
  \ Google Drive”选项。待打印的内容将被转换为 PDF 文件，并保存到与设备上当前活跃 Google 账号关联的 Google Drive 云存储中。\n\
  \n### 75.5 保存为 PDF\n\nAndroid 提供的最后一个打印选项允许将打印内容以 PDF 文件的格式本地保存到 Android 设备。一旦选择此选项，系统将要求为\
  \ PDF 文件命名并指定文档保存的设备位置。\n\n在测试自己的 Android 应用程序打印功能时，“保存为 PDF”和 Google Drive 选项在节约纸张方面极具价值。\n\
  \n### 75.6 从 Android 设备打印\n\nGoogle 建议能够打印内容的应用程序将打印选项放在溢出菜单（Overflow menu）中。许多与\
  \ Android 捆绑的应用现在都包含了“打印……”菜单选项。例如，图 75-2 显示了通过选择 Chrome 浏览器应用程序溢出菜单中的“共享……”选项来访问打印选项：\n\
  \n![](img/as_3.5_chrome_print_option.jpg)\n图 75-2\n\n一旦在应用程序内选择了打印选项，将标准的 Android\
  \ 打印屏幕，显示待打印内容的预览，如图 75-3 所示：\n\n![](img/as_3.5_chrome_print_panel.jpg)\n图 75-3\n\
  \n点击屏幕顶部的面板将显示完整的打印选项：\n\n![](img/as_3.5_save_as_pdf.jpg)\n图 75-4\n\nAndroid 打印面板提供标准的打印选项，如纸张大小、颜色、方向和副本数量。可以通过点击当前打印机或\
  \ PDF 输出选择来访问其他打印目标选项。\n\n## 75.7 在 Android 应用中构建打印支持的选项\n\n打印框架（Printing framework）为在\
  \ Android 中集成打印支持提供了多种选项。这些选项可以分类如下：\n\n### 75.7.1 图像打印\n\n顾如名，该选项允许将图像打印集成到 Android\
  \ 应用中。在应用中添加此功能时，第一步是创建 `PrintHelper` 类的一个新实例：\n\n```\nPrintHelper imagePrinter\
  \ = new PrintHelper(context);\n```\n\n接下来，可以通过调用 `PrintHelper` 实例的 `setScaleMode()`\
  \ 方法指定打印图像的缩放模式。选项如下：\n\n- `SCALE_MODE_FIT` – 图像将缩放以适应纸张大小，而不进行裁剪或更改宽高比例。这通常会导致在一个维度上出现留白。\n\
  - `SCALE_MODE_FILL` – 图像将缩放以填充纸张大小，并在必要时进行裁剪，以避免打印输出中出现留白。\n\n如果不设置缩放模式，系统将默认使用\
  \ `SCALE_MODE_FILL`。例如，以下代码将之前声明的 `PrintHelper` 实例的缩放模式设置为适应模式：\n\n```\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n\
  ```\n\n同样，也可以配置颜色模式以指示打印输出是彩色还是黑白。这是通过向 `PrintHelper` 实例的 `setColorMode()` 方法传递以下选项之一实现的：\n\
  \n- `COLOR_MODE_COLOR` – 表示图像将以彩色打印。\n- `COLOR_MODE_MONOCHROME` – 表示图像将以黑白打印。\n\n\
  除非按如下指定单色选项，否则打印框架将默认彩色打印：\n\n```\nimagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n\
  ```\n\n完成打印操作仅需要要打印的图像并调用 `PrintHelper` 实例的 `printBitmap()` 方法，该方法需要传递一个代表分配打印任务名称的字符串以及图像的引用（以\
  \ `Bitmap` 对象或 `Uri` 引用的形式）：\n\n```\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\
  \ ...);\nimagePrinter.printBitmap(\"Test Job\", bitmap);\n```\n\n一旦启动打印任务，框架将显示对话框并处理与用户的交互以及在目标上的打印。\n\
  \n### 75.7.2 创建并打印 HTML\n\nAndroid 打印框架还为在应用内打印 HTML 内容提供了方便的方法。这些内容可以是托管在网站上的页面\
  \ URL，也可以是可以在应用程序内动态创建的 HTML。要启用 HTML 打印（而不是加载现有页面），过程涉及创建 `WebView` 对象并为其关联 `WebViewClient`。\n\
  \n例如，考虑以下代码：\n\n```java\npublic void printContent() {\n    WebView webView = new\
  \ WebView(this);\n    webView.setWebViewClient(new WebViewClient() {\n        @Override\n\
  \        public boolean shouldOverrideLoading(WebView view, String url) {\n    \
  \        return false;\n        }\n        @Override\n        public void onPageFinished(WebView\
  \ view, String url) {\n            createWebPrintJob(view);\n            myWebView\
  \ = null;\n        }\n    });\n    String htmlDocument = \"<html><body><h1>Android\
  \ Print Test</h1><p>\" + \"This is some sample content.</p></body></html>\";\n \
  \   webView.loadDataWithBaseURL(null, htmlDocument, \"text/HTML\", \"UTF-8\", null);\n\
  \    myWebView = webView;\n}\n```\n\n\n\n\n此方法中的代码首先声明了一个名为 `myWebView` 的变量，其中将存储在方法中创建的\
  \ `WebView` 实例的引用。在 `printContent()` 方法中，创建了一个 `WebView` 类的实例，并为其分配了一个 `WebViewClient`\
  \ 实例。\n\n分配给 web 对象的 `WebViewClient` 被配置为指示 HTML 内容的加载将由 `WebView` 实例处理（通过从 `shouldOverrideUrlLoading()`\
  \ 方法返回 `false`）。更重要的是，声明并实现了一个 `onPageFinished()` 处理器方法，用于调用 `createWebPrintJob()`\
  \ 方法。当所有 HTML 内容加载到 web 视图时，`onPageFinished()` 回调方法将被自动调用。这确保了在内容就绪之前不会启动打印任务，从而确保所有内容都能被打印。\n\
  \n接下来，将创建一个包含某些 HTML 的字符串作为内容。然后将其加载到 web 视图中。一旦 HTML 加载，`onPageFinished()` 方法将触发触发。最后，该方法存储了对\
  \ web 对象的引用。如果没有这一至关重要的步骤，Java 运行时系统极可能会认为应用程序不再需要该 web 对象并将其丢弃以释放内存（Java 术语中称为垃圾回收），导致打印任务在完成之前就终止。\n\
  \n此示例中剩下的工作是按如下实现 `createWebPrintJob()` 方法：\n\n```java\nprivate void createWebPrintJob(WebView\
  \ webView) {\n    PrintManager printManager = (PrintManager) this\n            .getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter =\n            webView.createPrintDocumentAdapter(\"\
  MyDocument\");\n    String jobName = getString(R.string.app_name) + \" Document\"\
  ;\n    PrintJob printJob = printManager.print(jobName, printAdapter,\n         \
  \   new PrintAttributes.Builder().build());\n}\n```\n\n此方法获取 `PrintManager` 服务的引用，并指令\
  \ web 视图实例创建一个打印适配器。创建一个新字符串来存储打印任务的名称（在这种情况下，它是基于应用程序名称和“Document”一词）。\n\n最后，通过调用打印管理器的\
  \ `print()` 方法启动打印任务，传递任务名称、打印适配器和一组默认打印属性。如果需要，可以对打印属性进行自定义，以指定分辨率（每英寸点数）、边距和颜色选项。\n\
  \n### 75.7.3 打印网页\n\n打印网页的步骤与上述概述的步骤相似，区别在于向 web 视图传递要打印网页的 URL 而不是动态创建的 HTML，例如：\n\
  \n```java\nmyWebView.loadUrl(\"https://developer.android.com/google/index.html\"\
  );\n```\n\n同样重要的是，只有当网页在加载后需要自动打印时，才需要配置 `WebViewClient`。如果打印是由用户在页面加载后选择菜单选项来启动的，则只需要在应用程序代码中包含上述\
  \ `createWebPrintJob()` 方法中的代码即可。下一章[“Android HTML 和 Web 内容打印示例”(#HTML_Printing.xhtml__idTextAnchor1483)将演示此类场景。\n\
  \n### 75.7.4 打印自定义文档\n\n虽然打印框架引入的 HTML 和 Web 打印功能为从 Android 应用程序内部打印内容提供了方便路径，但显而易见，这些选项对于更高级的打印需求来说过于简单了。打印框架还为更复杂的打印任务提供了自定义文档打印支持。这允许将文本和图形形式的内容绘制到画布上然后进行打印。\n\
  \n与相对容易实现的 HTML 和图像打印不同，自定义文档打印是一个更复杂、多阶段的过程，将在本书的[“Android 自定义文档打印指南”(#Custom_Printing.xhtml__idTextAnchor1502)]章节中进行概述。这些步骤可以总结如下：\n\
  \n* 连接到 Android 打印管理器\n* 创建一个继承自 `PrintDocumentAdapter` 类的自定义打印适配器\n* 创建一个 `PdfDocument`\
  \ 实例来表示文档页面\n* 获取 `PdfDocument` 实例页面的引用，每个页面都关联一个 `Canvas` 实例\n* 在页面画布上绘制内容\n* 通知打印框架文档已准备好打印\n\
  \n上述步骤概述的自定义打印适配器必须实现几个 Android 系统在打印期间进行调用以执行特定任务的方法。其中最重要的是 `onLayout()` 方法，它负责根据用户更改如纸张大小或页面方向等设置来重新安排文档布局；以及\
  \ `onWrite()` 方法，它负责渲染待打印的页面。题为[“Android 自定义文档打印指南”(#Custom_Printing.xhtml__idTextAnchor1502)]的章节将详细介绍主题。\n\
  \n### 75.8 总结\n\nAndroid SDK 可以从运行中的应用程序内部打印内容。打印输出可以定向到配置适当的打印机、本地 PDF 文件或通过 Google\
  \ Drive 到云端。从 Android 应用程序开发者的角度来看，可以通过打印框架在应用程序中使用这些功能。到目前为止，最容易实现的打印选项是涉及图像和 HTML\
  \ 格式的内容。然而，更高级的打印可以使用该框架的自定义文档打印功能实现。\n\n### 76. Android HTML 和 Web 内容打印示例\n\n正如上一章（题为[“使用\
  \ Android 打印框架打印”(#Printing.xhtml__idTextAnchor1464)]）所述，Android 打印框架可以打印网页，也可以打印动态创建的\
  \ HTML 内容。虽然这两种打印方法有许多相似之处，但也存在需要考虑的细微差异。本章将通过创建示例应用程序来阐明这两个选项。\n\n### 76.1 创建 HTML\
  \ 打印应用程序\n\n在欢迎屏幕上选择 New Project，在出现的新项目对话框中，点击 Next 按钮之前选择 Empty Views Template。\n\
  \n在 Name 字段中输入 `HTMLPrint` 并指定 `com.ebookfzy.htmlprint` 为包名。在点击 Finish 按钮之前，将 Minimum\
  \ API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language 菜单更改为 Java。\n\n#### 76.2\
  \ 打印动态内容\n\n本教程的第一阶段是向项目添加代码以创建某些 HTML 内容并将其作为打印任务发送到打印框架。\n\n首先定位 `MainActivity.java`\
  \ 文件（位于项目窗口的 `app` -> `java` -> `com.ebookfzy.htmlprint` 下），并将其加载到编辑面板。加载后，修改代码如下列表所示：\n\
  \n\n\n\n```java\npublic boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest\
  \ request) {\n    return false;\n}\n\n@Override\npublic void onPageFinished(WebView\
  \ view, String url) {\n    createWebPrintJob(view);\n    myWebView = null;\n}\n\
  });\nString htmlDocument =\n\"<<html><body><h1>Android Print Test</h1><p>\"\n  \
  \  + \"This is some sample content.</p></body></html>\";\nwebView.loadDataWithBaseURL(null,\
  \ htmlDocument,\n    \"text/HTML\", \"UTF-8\", null);\nmyWebView = webView;\n}\n\
  ```\n\n代码更改从声明一个名为 `myWebView` 的变量开始，该变量将存储用于打印操作的 `WebView` 实例引用。在 `printWebView()`\
  \ 方法中，创建了一个 `WebView` 类实例，并为其分配了一个 `WebViewClient` 实例。\n\n分配给 web view 对象的 `WebViewClient`\
  \ 被配置为指示 HTML 内容的加载将由 `WebView` 实例处理（通过从 `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个\
  \ `onPageFinished()` 处理方法，用于调用 `createWebPrintJob()` 方法。当所有 HTML 内容加载到 web view\
  \ 后，`onPageFinished()` 方法将被自动调用。正如上一节所述，在打印动态创建的 HTML 内容时，这一步是必要的，以确保打印任务在内容完全加载到\
  \ `WebView` 后才启动。\n\n接下来，创建一个包含某些 HTML 的 `String` 对象作为内容，并随后将其加载到 web view 中。一旦\
  \ HTML 加载，`onPageFinished()` 回调方法将触发。最后，该方法将 web view 对象的引用存储在之前声明的 `myWebView`\
  \ 变量中。如果没有这一关键步骤，Java 运行时系统可能会认为应用程序不再需要该 web view 对象并丢弃它以释放内存，导致打印任务在完成之前终止。\n\n\
  此示例中剩下的只需实现 `createWebPrintJob()` 方法，该方法目前配置为由 `onPageFinished()` 回调方法调用。因此，在 `MainActivity.java`\
  \ 文件中实现此方法，使其内容如下：\n\n```java\nprivate void createWebPrintJob(WebView webView) {\n\
  \    PrintManager printManager = (PrintManager) this\n        .getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter =\n        webView.createPrintDocumentAdapter(\"\
  MyDocument\");\n    String jobName = getString(R.string.app_name) + \" Print Test\"\
