  \ `tab_2_fragment` 的资源。\n\n要复制 `Tab1Fragment` 类文件，右键点击 `app` -> `java` -> `com.ebookfrenzy.tablayoutdemo`\
  \ 下列出的类并选择 `Copy`。右键点击 `com.ebookfrenzy.tablayoutdemo` 条目并选择 `Paste`。在 `Copy Class`\
