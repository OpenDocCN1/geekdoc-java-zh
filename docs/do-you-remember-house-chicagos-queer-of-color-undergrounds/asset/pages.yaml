  md: '# 2 DO YOU REMEMBER HOUSE?


    was surely made for me. Years later I would learn that much of what I was hearing
    and loving what was coming from Chicago. Labels like Classic, Prescription, Dust
    Traxx, and Cajual were working with artists from the Windy City and to put out
    the particular four-to-floor brew I was living for. Once these sacred artifacts,
    mostly 12" vinyl records, made their way through production and distribution channels
    to the marketplace, they often reached consumers at a Chicago store called Gramophone.
    It was there that KC DJs purchased house music records before returning them on
    cheap Southwest flights or driving them on the 55 through St. Louis and then went
    to 170.


    I knew there was something special Chicago house music as soon as I knew that
    such a thing existed. These records were funky in the sense that they were full
    of driving drums and often featured sampled and synthesized hornabs, but they
    were also funky in the other sense of the word; they were lyrical, sexy, dirty
    even. There was something that felt rough-edged and sleek, something balancing
    on a fulcrum between energies that were light and dark, hard and soft, and masculine
    and feminine. DJ Sneak''s 1997 “You Can''t Hide from Your Bud” is a case in point.
    The song is built on the back of Teddy Pendergast’s 1977 “You Can''t Hide from
    Yourself.” Sneak loops in the original’s, its horn section, its lush strings,
    and eventually an all-too-brief snatch of the Harold Melvin and the Bluenotes
    singer-honey-toned vocal. While various sampled motifs of the original Pendergast
    single enter and exit his musical face, Sneak lets up on his insisted programmed
    drums. From the very beginning of the nearly nine-minute opus, a 128-beat-per-minute
    kick drives dancers to stop moving. There are congas, shekere, and clipped snares
    too; it’s brilliantly simple, and devastingly dance floor magic.


    An awkward, Jewish kid growing up in a weird blue college town surrounded by the
    conservative homeland, I started to hear house music around the same time I started
    to acknowledge my same-sex desires. If I couldn''t commune with gay people on
    the regular, I could have something gay in house music. Today I hear DJ Sneak-cum-Teddy
    Pendergast says “well,” I still feel it as an invitation to look myself in the
    mirror. I didn''t have to be well acquainted with the original track to know something
    of the pride implied by its lyrics: “You can''t hide from your self. Wherever
    you go, there you are.” Indeed, there was, a little faggot terrified of being
    myself. And yet, even though there were very few physical spaces where I could
    truly be myself, when house music was playing, I eased into a state that felt
    almost peaceful, even for only a few fleeting moments. House helped me create
    psychic spaces where I developed self-love and'
