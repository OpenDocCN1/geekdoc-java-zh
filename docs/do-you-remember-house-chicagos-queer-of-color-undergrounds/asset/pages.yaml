  md: '# 4 DO YOU REMEMBER HOUSE?


    When Williams and I finished after nearly three hours, we hadn''t even really
    gotten to the late 1980s. The senior was sparkling, animated by his own recollections;
    indeed, it felt like we could have kept going. He told me about his intentions
    to write a book about his amazing experiences and asked if maybe I would want
    to help him find a co-author; maybe I could help him write it! I told Williams
    I had hands full working on my house music project, but that I''d love to help
    him look for collaborators. He ended with inviting me to "see how they really
    did it" at his birthday celebration the following month.


    I left Z-Berry frozen yogurt, where we had our interview, astonished by this man
    I had come to know as a legend. I was amazed at how personable he remained after
    fifty years in the limelight and the connections we had drawn together with respect
    to our shared love for music. This was a queer elder that I had truly bonded around
    a set of shared cultural traditions, even if we accessed and experienced them
    in different ways because of our distinct generational affiliations, racial backgrounds,
    and myriad divergent experiences.


    Flash forward to February 22 as I pulled up the Hebrew Cultural Center, aka Da
    House Spot, on South Chicago Ave. It was still relatively early when Williams
    greeted me at the door. As my eyes adjusted to the darkness, I could see that
    there were already a few people dancing in the venue''s main room. The space was
    overflowing with bouquets of,, spherical balloons and there were chairs set against
    the walls where guests had to congregate in small clusters. Williams led me through
    Da House Spot''s two floors, showing me seating and dance areas, including a space
    with free hot food in the Cultural Center''s small theater/bar, and a windowless
    basement room where a solitary second DJ was warming up to the pulse of a blinding
    strobe light. As put it, the whole affair was "very after hours." Before he was
    pulled away to attend to his guests, Williams and I jumped into DJ Alexander.


    Alexander pulled back from Williams'' embrace and looked me up with a hand over
    his mouth, eyes wide in surprise. As he calmed and Williams introduced me, I realized
    he mistook me for the ghost of Ron Hardy, the legendary DJ of The Music Box, the
    club where many of the folks who followed there were first touched by Chicago
    house music and culture. Hardy died in 1992 when he was 34 years old, but during
    the height of his popularity in the late 1980s he would have been about my age
    at the time. At my height, with my slender build, facial hair, and six panel ball
    cap cocked to the side, I knew why I must have reminded of him.'
