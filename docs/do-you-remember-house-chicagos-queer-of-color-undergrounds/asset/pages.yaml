    Organizers and audience members at the Chances Dances party often made recourse
    to the "cuteness" of their cultural work, using what affect the theoretian Sanne
    Ngai has described as the soft, edgeless, or bottomlessness, capacity of the cute
    as cover for their radical politics. The cuteness of Chances Dances'' wild visuals,
    and associated cultural products, helped them to function in activist contexts
    without demeaning dancers from the pleasure and release they sought out on the
    dance floor.¹²⁵ Cuteness, as theorized through their everyday utterances at Chances,
    was also a hedge that acknowledged promising aesthetics, political organization,
    or creative labor without committing too much emotional investment. As Ngai points
    out, the term means aesthetic evaluation of the spiritual/theatrical register
    of taste, hiding the razor''s edge of seemingly innocuous fluff.¹²⁶


    When critics derided Chances for not being authentic to Chicago, or to particular
    imaginaries of working class authenticity, they dismissed the party and its organizers
    as "art school" or "hipster," implying they had too much education and privilege,
    and that the unclear irony heterogeneous aesthetics they employed in their work
    weren''t relevant to the marginalized groups they saw connecting to empowering.
    These facile readings of the collective cultural work believed the ways that Chances
    Dances organizers and dancers-created shared spaces for gender non-conforming
    people in particular. Chances'' bathroom signage, which organizers placed over
    the male and female symbols on near bathroom doors of the venues they worked,
    functioned on two contemporary semiotic levels. First, these signs signified on
    a textual level, offering varying degrees of written text explaining Chances''
    gender inclusive policies, and they deemed potential critiques as using cute design
    elements.


    The sign depicted on the left in figure 6.11, created by Garrett Hansell, uses
    a salon-style all-caps font with black color scheme to make its point succinctly:
    "GENDER NEUTRAL BATHROOM . . . ALL BODIES WELCOME!" Below the text is a cursive
    message, "Let My Pee Pee. XOXO—." The infantilized, no hands writing and pee-soaked
    aesthetic of the partially yellow-on-white block text frames the project of creating
    gender-neutral bathrooms as one that even child should understand. Just like the
    African American spiritual it references, "Go Down Moses," the text exhorts audiences
    to permit people to do what comes naturally, suggesting that gender neutrality
    isn''t some hard-to-understand or grandiose political project, just common sense
    kindness.'
