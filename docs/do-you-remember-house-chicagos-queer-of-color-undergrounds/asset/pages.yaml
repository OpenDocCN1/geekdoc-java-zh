  md: "I remember house before it was called house.\nI remember house when house respected\
    \ house.\nI remember house when house grew from the roots of house.\nI remember\
    \ house when house was soul music and r&b,\nbefore house was disco . . .\n\nI\
    \ remember house before the super-clubs.\nI remember house when people knew the\
    \ lyrics of house.\nI remember house before record labels sold the house.\nI remember\
    \ house when house was about love . . .\n\nI remember house.\n\nI remember house\
    \ when house was more than just a name\nto package the sound, this groove, this\
    \ emotion.\nI remember house when it was just one house.\nI remember house when\
    \ house had artists, songwriters, and personalities.\nI remember house when you\
    \ didn't have to be a DJ just to be into house.\nI remember house when house was\
    \ broke.\nI remember house when house was done in the house.\nI remember house\
    \ when it was a spiritual thing . . .\nI remember house.\n\nDo you remember house?\
    \ . . .\n\nI remember house before it was techno.\nI remember house before it\
    \ had an afro.\nI remember house before it was deep.\nI remember house before\
    \ it was hard.\n\nI remember house when house had tempos.\nI remember house before\
    \ MPC60s.\nI remember house before house had loops.\nI remember house before the\
    \ whole world knew.\nI remember house.\n\nDo you remember house? \n\nBlaze Feat.\
    \ Palmer Brown, \"Do You Remember House?\""
