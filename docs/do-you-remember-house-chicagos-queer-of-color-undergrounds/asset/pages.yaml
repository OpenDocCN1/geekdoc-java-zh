    to real communal gains, especially since those with capital could not leave their
    formerly class-diverse Black neighborhoods for the suburbs. Queer people suffered
    greatly from the ravages of redevelopment and gentrification and displacement
    during the 1980s, as well as the suburbanization and off-shoring of good jobs
    and the twin epidemics of HIV/AIDS and crack. Miraculously, they also created
    an expansive, loving cultural movement in the face of enormous odds. By the 1990s,
    innovations pioneered in Chicago''s queer of color underground were changing popular
    music scenes as far-ung as London and Johannesburg.


