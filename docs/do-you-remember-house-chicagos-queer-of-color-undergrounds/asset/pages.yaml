    While mostly concerned with the size and feel of the loft he was renting, Williams
    says he also wanted to re-inhabit abandoned sites of Black creativity.^97


    As this has shown, Chicago''s queer of color underground have been shaped by spatial
    continuities and ruptures; and affected by structural entanglements with oppressive
    forces, as well as congregation within spaces redolent with Black excellence and
    joy. As disco morphed and coalesced into a genre called house during the 1980s,
    its features, such as its structure, rhythm, and timbre, would just as important
    as what performance studies scholar Brian Currill calls deep and abiding sense
