    So what, may you ask, does a map have to do with preserving Chicago''s house music
    history and culture? The public, collective, and open-ended digital maps that
    HPP and I are creating make more sense if one understands a bit about the history
    of map-making in Western Europe, the US, and Chicago.


    Cartography, or the science of map-making, is a technique used for drawing political
    boundaries and geographically dispersed populations. It is also one of the nation''s
    most compelling tools of dominion. By the middle of the eighteenth century, hand-drawn
    maps became indispensable tools in the modern colonial project. In these maps,
    the flow of information about so-called new worlds, or at least new to Western
    European explorers, was no longer limited to surveys and descriptions of natural
    and human resources, as was it in the sixteenth century, but centered on scientific
    inventions, classifications, and interpretations of data. Science and imperialism
    were part of the same project; by converting what had been verbal, statistical,
    and graphic systems for recording information into seemingly value-neutral tools
    for gathering, inventorying, and representing it, eighteenth-century colonial
    maps made easier for explorers to exploit both land and sea.


    Map-making often masquerades as culturally neutral, as a bureaucratic function
    rather than a deeply ideological project. This fact of novelty developed with
    new technologies in cartography during the US''s westward expansion. In 1863,
    the US Army Corp. used hydro surveys were available in newly explored areas, as
    well as trigonometric triangulation and astronomical calculations to determine
    and define more precise political boundaries. After 1879, the Corp. was transferred
    to the war department and the national American Geological Survey was set up to
    plan expansion even further west. Thus, map-making became bound inextricably to
    genocidal fanaticism of manifest destiny.


