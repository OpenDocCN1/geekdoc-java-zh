    # Dancing the Loving Community


    The expansive love cultivated at The Chosen Few Picnic is served not only by the
    intensification and repetition of songs that lyr exhort the audience to love and
    be loved, but by social dancing that allows for a plurality of dancers to express
    this communal love kinesthetically. In the politically charged context of a massive
    public dance party in gentrifying Hyde/Jackson Park, beaming faces, outstretched
    hands, and two-stepping feet physicalize the ethic articulated in house music.


