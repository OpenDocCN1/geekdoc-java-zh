    # Introduction


    Much like the early years of The Warehouse/US Studios, a time during which social
    antagonisms threatened to halt the rise of house music before it even began to
    coalesce as a genre, the first half of the 1980s was a time marked by toxic interpersonal
    feuds, professional shifts, and competition, not only between juice bar promoters,
    radio station PDs, amateur producers, and DJs, but also between the auxiliary
    commercial and social institutions that grew to support them. The changing business
    of independent Black radio in Chicago, and the remediation of disco music in club
    spaces and on the airwaves, were critical to generating the interest among consumers
    that allowed for the re-booting of Chicago''s independent music industry. Like
    Frankie Knuckles and Ron Hardy before them, house music entrepreneurs deemed the
    prescribed compositional capabilities of their tools, stretching the technological
    affordances of the synthesizers and drum machines at their disposal to augment
    the stylistic templates of underground. By the mid-1980s, Chicago''s pioneering
    independent record of their work, and its DJ-friendly record stores were selling.


    Support from local independent labels became as critical to the spread of Chicago''s
    homegrown house sound as the support of its radio stations, juice bars, school
    dance halls, ballrooms, and club spaces, but getting one''s recording to market
    often meant signing up for a real deal. In the second half of the 1980s some of
