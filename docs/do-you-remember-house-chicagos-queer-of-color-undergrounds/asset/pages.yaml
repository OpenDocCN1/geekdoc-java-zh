- img_proc: true
  md: '# Introduction • 3


    self-knowledge. It also taught me to more fully inhabit public arenas where I
    could experiment with my sexual and social boundaries while dancing with others.


    As I got deeper into house music, and began to seek out more spaces where I could
    party to it, it began to occur to me that the affective change I was getting from
    Chicago sounds wasn''t strictly personal; it was social, and it could spread across
    a dance floor like wildfire. I started reading up on house music history whenever
    I could to better understand where it was from as to better comprehend what it
    did to, for me. Bill Brewster and Frank Boughton''s Last Night a DJ Saved My Life
    was a particularly important resource that helped me chart a path from the British
    and continental european house sounds I was being fed on so many dance floors,
    to the funkier fare still coming out of urban america. Learning that house music
    was originally made by gay Black and Latino people in Chicago was a revelation.
    New York could certainly claim to have the birthplace of disco, but house was
    midwestern, and it was not just subliminally gay, it was really gay! Of course
    it was Black, that came as no surprise to me as a musician who had studied Black
    music for years, but it seemed like many of the people I met dancing at raves
    and festivals and clubs and bars, especially the straight folks, and the white
    folks, blissfully unaware of where house came from, and what it was made for.
    These histories were hiding in plain sight, not even out of earshot. What follows
    nearly a decade of work toward making them not only more available, but also undeniable.


    In January of 2014, through a connection made by the Chicago house promoter Reggie
    Bonner, I had the opportunity to conduct a House Music Oral History interview
    with Robert Williams, one of the founding of Chicago house music and culture.
    A joke-cracking, fun-loving, and whip-smart music entrepreneur was surprisingly
    candid after so many years answering what probably wanted the very same sets of
    questions: what was it like when you brought Frankie Knuckles to Chicago? Was
    there rivalry between underground disco promoters? What was Ron Hardy like? Knowing
    that I was not going to our conversation with what might be due to Williams, I
    tried to create room for “the senior,” as many of my friends and fans in Chicago
    lovingly call him, to explore the edges of the well-known stories, and to dwell
    in the moments that may have been less explored by, or interesting to, the countless
    journalists and trend-spotters who have chronicled the still under-appreciated,
    by no means hidden, histories of Chicago house music and culture.'
  merge: -1
  pgno: 12
