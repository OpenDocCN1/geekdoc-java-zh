    the Black Atlantic.^99 The reverberation of these sounds in specific sites of
    underground consumption yokes them not only to neighborhoods like Bronzeville
    and the South Loop that have long-standing queer of color musical traditions,
    but also to more acute spatial legacies shaped by Black queer sociality in South
    Side flats, repurposed industrial lofts, and the juice that cultural created Ernest
    Hardy, speaking house music''s genesis, has called “unmistakably hot.”^100


