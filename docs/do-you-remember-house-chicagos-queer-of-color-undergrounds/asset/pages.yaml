    # Pressing and Selling Chicago House


    In the late 1970s a music entrepreneur named Paul Weisberg started a record pool
    called Independent Record Services (IRS) to connect DJs from Chicago''s clubs
    and juice bars with the freshest disco cuts. To expand his influence, and earn
    more money, he also decided to set up a brick-and-mortar vinyl emporium in his
    father''s Plymouth Court automotive garage; Weisberg called it Importes. While
    there were dozens of record stores that contributed to the early development of
    house music culture in Chicago, Importes Etc. is the most revered, and oft-cited,
    for being a critically important connecting Italo-disco distributors in Europe,
    amateur house music producers, and dancers from the city''s underground juice
    bars and clubs.


    When he founded IRS, Weisberg had the good fortune to have an encyclopedic lover
    Brett Wilcot who had defected from a rival record pool Dogs Of War. While he had
    experience creating playlists, playing music, and writing copy run by Eddie Thomas,
    Curtis Mayfield''s father at Custom Records) Wilcot also had down day job as a
    buyer for the 12” section at Sounds Good. Weisberg may have needed the building,
    but with his staff had the taste and the retail distribution experience to fill
    it with the best product. Frank Sells at Importes also played a critical role
    shepherding the sonic assemblage of The Warehouse to the city''s commercial marketplace.
    Leonard “Remix” Roy calls him “the backbone of many first generation Chicago house
    music DJ.” Sells would pay attention to how a particular DJ played out, then curate
