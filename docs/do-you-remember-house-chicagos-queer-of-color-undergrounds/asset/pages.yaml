  md: '# Introduction • 5


    I mention this account of mistaken identity to position myself as racially ambiguous,
    not to imply that my “passing” for Hardy, who was pictured prominently that evening
    in the shrine depicted in figure 1.1, constitutes some of privileged moment of
    reflection or insight, but rather to suggest that the spaces where Chicago house
    music enthusiasts produce their events are suffused with powerful ancestral spirits,
    and that these spirits affect the ways that house people come together to dance,
    worship, give thanks, and sweat in joyful communion. Taking its title from a 2002
    club track produced by New Jersey duo Blaze and vocalist Palmer Brown, “Do You
    Remember House?” Chicago’s Queer of Color Undergrounds suggests that Chicago’s
    house music re-telling, in the city of its birth, rehearsing and re-animating
    a variety of re-telling, personal and collective stories of the music’s emergence
    and resurgence of unsettled, but provisionally agreed-upon, narrative arcs in
    ways that both reinforce communal connections and strain them.


    Debates over the term “house music” are themselves indicative of the ways that
    house people layer stories like sounds in a polysemic DJ mix. Do You Remember
    House? simultaneously explores the ways that the concept of


    ![](img/84287b8b3972fcaafe61e5a8d6ee380d_14_0.png)


    FIG. 1.1 Ron Hardy altar, Da House Spot, 7130 S. Chicago Ave, February 22, 2014:
    photograph by Micah Salkind.'
