    the latter often more femme. Both parties made clear efforts to be inclusive of
    multiple types of difference while prioritizing nonwhite, non-middle-class, differently
    abled, and non-gender-normative expressions.¹ While I practiced taking up space
    at the two parties, I was simultaneously sensitive to what I perceived to be the
    demographics of their respective dances. That is to say I was hyperconscious of
    whether my white, masculine-presenting body was taking up too much space. In her
    work on queer phenomenology, philosopher Sara Ahmed correlates being behind, marginal,
    or oriented to a process of queering every spatial norms.¹² Queering my orientation
    to club space helped me to consider whether my limbs were under control, whether
    I was at the center of the dance floor or the periphery, whether I was blocking
    a short person or a femme. My sensitivity to my own position in the space of the
    dance floor was a part to noticing how social spaces connected to queer color
    of underground cultures without transforming into colonized free zones where queer
    seemed to be naï exploring the contours of their relative privilege against an
    anonymous tableau of bodies. D of color might be doing something pedestrian, as
    pleasurably flipping their hair or vogue, white dancers might see these movements
    as part of a special weekend floor show, or a display designed for their pleasure.
    When I decided to gravitate to the periphery at either party, I did so to enact
    a politics of yielding space; being smaller became a pleasurable corollary to
    being big.


