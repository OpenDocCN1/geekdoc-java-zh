    but by the many waves of African Americans who migrated for industrial employment
    before and after its construction. Imagined as a place where Irish, German, and
    Swedish immigrants would assimilate into middle-American culture, by the 1940s,
    Comiskey''s South Armour Square neighborhood was a majority-Black residential
    community. The post-war years, the ballpark became a place where Black baseball
    fans from the increasingly segregated South Side could come to join Negro League
    games and other amusements; distinctly South Side institution.^2 Yet, just as
