    # The Deep Times and Spaces of Chicago’s Black Social Dance Cultures


    To say that Chicago has long-standing, complex affinities with Don Cornelius’
    Soul Train dance show is a gross understatement. Before the show was filmed in
    Los Angeles, it was a local Chicago production, and beginning with its very first
    broadcast in August of 1970, an enormous hit with the city’s teens. Young Black
    and brown Chicagoans relied watching and moving alongside the Soul Train dancers
    in front of their TV sets, responding to and learning moves that might have been
    developed in their neighborhood streets and recreation rooms. To suggest just
    how popular the house had become, an article in the September 21 issue of The
    Chicago Defender, published just a month after its premiere, challenged readers
    to find a single Black Latino person under the age of 30 who was not watching
    Soul Train.⁶


    Cornelius’ program wasn’t Chicago’s first dance show on public access, but its
    rise to prominence was aided by the instantiation within the city’s unique public
    media landscape.⁷ According to cultural historian Adam Green, by pioneering innovative
    systems of delivery for new sounds, Black appeal DJs had helped create the necessary
    conditions for the birth of r&b, a synthesis of sacred and secular musical styles
    that is “perhaps Black folk’s most universally acclaimed modernity,”⁸ Jack Cooper
    had been'
