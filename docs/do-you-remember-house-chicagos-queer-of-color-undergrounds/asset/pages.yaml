    # Conclusion


    Chicago''s house music communities splintered once again at the beginning of the
    1990s. New licensing restrictions played a major role in fragmentation, but so
    too did the unfair remuneration of recording artists; the outgrowing of early
    adopting youth; the inescapable horror of HIV/AIDS-related illnesses and death
    in queer communities of color; and many concomitant issues related to cultural
    ownership, belonging, and visibility. Gentrifying suburban transplants had displaced
    the working class Black and Latino residents in neighborhoods like Lakeview that
    had been receptive to house music and culture. Simultaneously, promoters were
    bringing the music into new cultural spaces perhaps too far removed from its roots.
    As dance historian Michaelangelo Matos says, ravers that arrived from the suburbs
    during the 1990s were “different from house heads—younger, greater in number.”¹⁵
    Some of those who had participated longest in Chicago house music culture rightly
    questioned whether it was being taken away from them.


    Although Chicago house music cultures were undoubtedly changed by the early 1990s,
    its crossover communities remained vital to Chicago''s cultural fabric. Over the
    next two decades the cultural descendants of the city''s queer of color undergrounds
    continued to listen to and celebrate the sounds favored by their foremothers and
    forefathers in spaces that evoked the early days. They also re-animated and revised
    older traditions to adapt to the technological and social conditions of new times.
