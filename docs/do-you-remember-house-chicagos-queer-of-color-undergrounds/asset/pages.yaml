    garden at 601 S. Michigan the very same year that Daley made his proclamation.
    He imagined that future programming would take place not only in the Loop, but
    in all of the city''s neighborhood parks. To sustain the popular program, Orlove
    and Keiger booked artists from the many generations and scenes important to house
    music culture''development in Chicago, self-consciously worrying with the knowledge
    that the DJ series was the city''s first highly visible, public program acknowledging
    house as an important contribution to Chicago cultural heritage. Godfather Frankie
    Knuckles; pioneering producers like Jesse Saunders and Steve “Silk” Hurley; mixing
    radio stars like Badboy Boy, Ralphi Rosario, and Farley “Jackmaster” Funk; gay
    icons Psychobitch and Teri Bristol; and second and third generation cycles like
    Derrick Carver, Diz, Ron Trent, and Terry Hunter performed for the DJ series.
    According to Keiger, it was a beautiful, intergenerational convergence:


