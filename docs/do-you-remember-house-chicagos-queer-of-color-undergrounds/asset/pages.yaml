    stories; by banging together the ways that our work is never quite enough to shift
    the world.


    In many ways our participation and investment in Chicago house music spaces has
    relied on my use of privileged access to queer of color histories, a sense of
    benevolent entitlement unlike that of other white, masculine of center, music
    entrepreneurs in and beyond the Chicago scene. Like Smart Bar founder/owner Joe
    Shanahan, or Queen! DJ Garrett David, I at fetishize the expectations of freedom
    and creativity from the crucible of racial and sexual away in that risks covering
    over the queer people of color whose I hope to amplify. My experiences as an queer
    person distinguishing from Shanahan and David too. Having up searching for queer
    ancestry, role models, and traditions to which I could connect, finding Chicago
    house as a way into these connections as a teenager, my engagement and interests
    in shared authority are shaped by sameness as well as difference. It is not to
    say straight people don''t have a way in us. Indeed they do, and this is why house
    music remains a fruitful suite of possibility and promise for those interested
    in working against the fragmenting logics of racism, heterosexuality, classism,
    and other forms of social violence and structural discrimination.


    The working out of shared history across axes of difference through the matrices
    of neostalgia, at Queen!, and wild at Chances Dances, despite the various generational
    cleavages by HIV/AIDS death and shifting trends in dance music demonstrates why
    the “going in” Allen postulates in finding getting one''s life, rather than coming
    out, can be a useful way of understanding the affective possibilities of queer
    nightlife. As debates rage in Chicago who has the right to represent or define
    house, the artists involved in these functions continued to innovate and remember.
    They stayed rooted while creating new routes into and through Chicago house culture''s
    history, sustaining themselves and the dancers who got their lives together on
    their dance floors¹⁵.


    As David “Risqué” Walker suggests, the dancer is what makes the DJ. Without the
    dancer, you got no DJ. The dancer doesn''t need a DJ, the DJ needs the dancer.¹⁴⁶
    The final auto-ethnographic chapter that follows unpacks'
