    Each of the five DJs had their own personal perspective, and on any given night
    performing they created an amalgam of styles as they traded off playing in half-hour
    increments. The unique sonic combinations they created together with their programming,
    and their constant shuffling, helped ensure nobody’s musical narrative was wholly
    prioritized. The format challenged Chances to manage the areas where their musical
    overlapped, and challenged audiences, who often felt themselves pushed and unexpectedly
    out of their groves, to get used to awkward transitions. For those barred by Chances’
    punk kick off to musical linearity and seamlessness, there were plenty of places
    in Chicago to have flawlessly better matched music.


    The Chances were founded to be spaces where different sounds could be juxtaposed,
    if not seamlessly integrated; a sonic rebuttal to what organizers perceived to
    be Boystown’s aggressively homogeneous soundscape. As Zearfoss explains, “all
    of us disconnected from the bland, trance techno that was the particular musical
    flavor of Chicago’s gay male scenes.”88 What we call techno, or “circuit party”
    music, was less offensive to Chances organizers and audiences for its sonic textures
    than its ubiquity, and the homophobic social script it had become the soundtrack
    to: “We wanted [Chances] to not be homogenous in terms of who, who was participating
