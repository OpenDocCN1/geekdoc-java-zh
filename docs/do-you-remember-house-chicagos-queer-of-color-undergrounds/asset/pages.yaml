    Becoming oneself on the dance floor is a life-long process, but like other types
    of learning, the work that goes into one''s craft when one is young seems to stick
    to one''s bones. For example, there is a shoulder bounce and a head bob with a
    sideways grin that I never let go of in my body when I dance; I am certain I will
    have a home place as long as I live. In sense, these primary movements, practiced
