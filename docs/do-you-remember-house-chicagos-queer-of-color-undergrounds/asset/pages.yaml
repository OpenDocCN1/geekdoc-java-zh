    He faces the rear of the club and spins his arms like windmills. He has his back
    to the DJ booth, legs akimbo, collared white Oxford buttoned up almost the neck,
    his greying hair slicked back. He is in a trance. For me, I''m lost in music,
    in my feels, getting my life. Michael Serafini is on the decks now playing a track
