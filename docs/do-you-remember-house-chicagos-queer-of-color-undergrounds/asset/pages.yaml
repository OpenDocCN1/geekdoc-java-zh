    Adams and Kelsey Robinson suggested that, unlike Wicker Park''s Red Dog, Smart
    Bar has consistently upheld dancer-friendly policies. They noted that it is one
    of few purposely designed dance clubs in Chicago that has consistently allowed
    dancers to come early with their sweat rags, stretch out on the floor, and take
    up extra space with flips and partner-dancing routines.


    Unlike Smart Bar, with its purpose-built dance floor, none of the spaces used
    for Chances were created for dancers with big moves. Physically, I found myself
    clenched on these dance floors, my legs and muscles tensioning in ways that inhibited
    my ability to be big. However, like The Warehouse before, it (especially Off Chances)
    could be socially loose even if it felt tightly. When I danced there, I wanted
    to be big, to take up space, but also to fall into the crowd. I was trying to
    be big for me, not for the other dancers in the room. I was looking for a cipher
