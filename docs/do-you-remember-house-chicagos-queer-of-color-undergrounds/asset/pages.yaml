  md: '# 8  DO YOU REMEMBER HOUSE?


    always unfinished.¹15 The collection that I have assembled with the support of
    Columbia College''s Center for Black Music Research (CBMR) is one compliment to
    existing archival resources; a seed that will hopefully grow to be accompanied
    by more interviews and accounts in years. I created to ground my own historical
    research, but also to be a resource for others interested in developing new interpretations
    and artistic work reflecting on the seemingly boundless diversity and creativity
    of Chicago''s house music communities and culture-beurers.


    I designed my oral history to augment existing documental archives by capturing
    a range of investments, generational affiliations, experiences of race, class,
    gender, and sexuality. Ultimately, I hope to show the quotidian ways house music
    cultures infuses the lives of all kinds of Chicagoans. As such, it is important
    to read Do Remember House? not as a conclusion, but as a punctuation mark in an
    ongoing dialogue. Throughout its seven chapters it shows DJ performances, original
    music production, remixing, demining, storytelling, archiving, contesting, visual
