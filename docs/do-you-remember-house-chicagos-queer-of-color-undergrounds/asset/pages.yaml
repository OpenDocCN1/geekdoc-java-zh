  md: '# INTRODUCTION


    When I was a sixteen-year-old high school sophomore at the turn of the millennium,
    a group of event promoters based in Kansas City Deep Fix produced a totally legal,
    all-ages rave called "Where the Wild Things Are." Telling my parents I would be
    camping out with friends, I hopped in a car with my college-aged work buddies
    and made my way to the downtown KC center hosting the event. I remember standing
    in line and watching people take off their shoes. This was the height of rave
    panic and security guards were patting down the pockets of white kids adorned
    in day glow pony beads and fat pants, attempting to suss out there were pills
    in all those creases and folds. I hadn''t crafted an atypically elaborate lie
    about where I would be because I was dying to do drugs. No mam'', I was a good
    kid and although I had certainly experimented, I knew not enough to push the limits
    too far. I was out at all hours specifically to dance to music.


    At this particular point in my life it was frustratingly difficult to find spaces
    of any kind to hear what I thought I knew house. I had been recording MTV''s late-night
    electronic music program Amp with my family''s programmable VCR, and could find
    CDs and compilations of the down-tempo electronic music that was crossing over
    to radio in America at the time, but sounds were for the most part missing the
    mark. Seeking something deeper, I would scan the college station that occupied
    a narrow slice of the radio dial and peruse British clubbing magazines at the
    local big bookstore as they often included mixed CDs with more uptempo dance music
    on them. I realized pretty quickly to get the house music experience I was craving,
    a chugging blend of mixed sounds programmed by DJs on booming systems, I had to
    drive forty-five minutes to Kansas City.


    The Wild Things party was a turning point. I danced for hours, working myself
    into a trance I didn''t know, but knew


