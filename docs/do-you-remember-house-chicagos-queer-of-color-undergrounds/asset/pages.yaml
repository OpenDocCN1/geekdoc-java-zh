    # Setting the Stage: Reunion Picnics, Chosen Family, and Camp Culture


    The Hyde Park neighborhood, and its adjacent public parks, have been stages for
    self-fashioning in Black Chicago since southern migrants arriving to the city
    during the first half of the twentieth century. *The Chicago Defender* hailed
    communal Bud Billicken in Washington Park to cultivate young readers hailed by
    the fictitious character featured in the paper, and rally Black Chicagoans to
    support each other in the lean times of the Depression. Families with music, as
    well as churches, fraternal groups, and corporate and institutional sponsors like
    L. Fish Furniture Company, the YMCA, the YWCA, and the NAACP produced goods and
    services to the early Billicken pickles, helping to ensure that needy children
    were fed even if their parents were unemployed. Over time, the Billicken picnic
    became synonymous with South Side''s dynamic American cultural traditions and
    beneficial social cultures.


    In 1937, Billiken''s secured permits to use all of Washington Park, effectively
    transforming the space into the nation’s “first and largest Black public park.”
    The Billicken picnic, as well as the festive parade that kicked it off, inculcated
    rituals of social benevolence and performances of cultural continuity that bound
