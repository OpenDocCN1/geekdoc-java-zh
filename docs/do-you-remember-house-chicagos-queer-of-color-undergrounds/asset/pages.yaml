    She moved to Chicago after college and went straight to dance music entrepreneur
    Radoslaw "Radek" Hawryczuk, who brought her in to help him launch, and later manage,
    the digital distribution arm of his Dust Trax label.


    When Stamper began to gain acclaim as a dance music producer, she was earning
    money writing copy for online purveyors of underwear and dreaming about a sustainable
    career as an artist.^71 Her success, which began with her international touring
    opportunities, with a chance encounter with Queen! Sergei Garrett "David" Shirley.
    He was working as an intern at Dust Trax when he overheard her playing his track,"Exodus,"
    at work. She had built the sound around a sampled piano and vocal line from The
    Joubert Singers'' ''85 "Stand On The Word," a gospel house classic often attributed
