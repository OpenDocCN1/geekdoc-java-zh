    # Being Big


    Out dancing in Chicago I often found myself simultaneous need to open up and become
    invisible. This tension felt like an embodied response to spending a good quarter
    of my life trying to take up less space. My default posture as a teen was one
    of submission; as if I could make myself small enough to disappear from the radar
    of those who might call me out for comforting myself queer. House music spaces,
    even though I danced prior to my time in Chicago, have allowed me to feel safe
    enough to practice shedding this habitual embodied retreat. I open my heart, extend
    my limbs, and revel in my own voice and gait. I need to spread out, to feel the
    fascia connecting my muscles to my body taut. I want to take up physical space
    and become a bigger presence, but it doesn''t always come easy.


    My nights out Chicago often began with a scan and evaluation of the space I would
    have to move in. I considered Bollen proximity, the distance between my dancing
    body and those around me, as well as familiarity, the directions that I and my
    partners were facing. I asked myself upon entering a dance floor where there were
    enough people to fill it so that I wouldn''t feel lonely, or too many, such that
    I wouldn''t be able to let go and really throw myself into my movements with abandonment.
    More than not my nights at Queen! were characterized by expansive rather than
    restrictive terrain, and a room that wasn''t too crowded to move. On October 20,
    2013, people kept brushing my shoulders and touching me as we crossed paths;'
