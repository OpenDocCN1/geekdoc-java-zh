  md: '# 246 • DO YOU REMEMBER HOUSE?


    spin, or to see how Jamie Principle would come and sing on top of everybody''s
    over there gestures for Millennium Park] and like everybody knows the words.¹⁰


    On the evening of June 26, 2006, during a performance by acid house legend and
    Chicago native DJ Pierre, several teenagers got into a fight and the Chicago Police
    shut down the SummerDance DJ series early. According to Valencia ''Mother Diva''
    Danzler, who introduced DJ Pierre that evening, the event was remarkably peaceful;
    nobody even knew that there was a fracas going on beyond the scenes.¹¹ This peaceful
    vibe permeates a video shot at the event by 411 house collective. In its footage,
    now archived on YouTube, an unseen interviewer asked various members who is about
    house music that they like. The multigenerational, racially diverse respondents
    say that house makes them feel alive, like they can be themselves.¹²


    Following the incident at Daly Plaza, public safety officials told the DCASE it
    needed to produce the DJ series because the events were hazardous to public safety.
    As Keugh put it, the Chicago Police Department had no connection to house communities
    and was equating DJ culture with gang culture: "we basically reprimanded for booking
    DJs out in the public."¹ Kepler clashed to claim a favor in favor of Joe Shanahan,
    who agreed to the remaining scheduled performances of the 2006 series at Metro/Smart
    Bar. For the next ten years DCASE house music programming was inconsistent at
    best.


    By 2016 the DCA and the mayor''s office of special events offered, sanctioned,
    several regular house music programs, including long-hour "Wired Friday" lunchtime
    DJ sets at the Chicago Cultural Center, and open-air performances in Daly Plaza,
    Millennium Park, and at The Tate of Chicago. The City of Chicago had by that point
    also extended a hard-fought-for branches by commemorating sites of house music
    memory, as the block of Jefferson Street outside the original Warehouse, which
    was given the honorary name "Frankie Knuckles Way" in 2004, and the corner of
    Randolph and Halsted, which received recognition as "D.J. International Boulevard"
    in 2014. There was a Chicago music exhibition at the DCASE Cultural Center during
    the summer of 2015 called Move Your Body, after the hook from Marshall Jefferson''s
    "House Anthem."


    When Mayor Harold Washington established what is now DCASE in 1986, his team left
    house music out of any official language about the city''s heritage or its developing
    cultural priorities.¹⁴ Blues and western classical music earned special mentions,
    but despite the fact that the sounds and spaces of house were already firmly enshed
    in the cultural fabric of the'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'City, it was conspicuously absent. Even if one assumes that house music culture
    wasn''t on the Washington administration''s radar, the omission of house music
    from Chicago''s 2012 Cultural Plan, created under the leadership of commissioner
    Boone, speaks to the ways that the City remained committed to a vision of its
    cultural heritage that reifies divisions between genres.


    House is the product of people who never gave up on listening the sounds of jazz,
    blues, doo bap, r&b, soul, funk, and disco mixed together, despite noting that
    they were separate. It is, as Dana Powell so eloquently put it, "also always",
    a queer of color repertoire in motion that cannot be accounted for using the language
    of genre, and a wild harbinger of crossover communities that resist social fragmentation.^15
    Scholars of popular music must consider the many ways that house is a cultural
    reservoir that speaks to and archives ephemeral histories of violence, displacement,
    rootedness, and freedom. These are American experiences, widely shared, and yet
    they remain specific to Chicago''s African American migrants, their progeny, and
    their many musical interlocutors. Sounding house as a culturally specific Chicago
    amalgam made by queer people of color for ecstatic, spiritual, social dancing,
    rather than merely a style of music that emerged sui generis at the nexus of new
    technologies and ambitious entrepreneurialism, gives scholars of pop a chance
    to understand its relationships to a wide spectrum of ambivalent cultural experiences
    born in the shadow of late capitalism. When we remember house, we remember these
    experiences, and we remember our differences; our remembering becomes a constitutive
    part of our dance, and our dance becomes our way of being together, expansively
    loving, moving and building, and never forgetting.'
