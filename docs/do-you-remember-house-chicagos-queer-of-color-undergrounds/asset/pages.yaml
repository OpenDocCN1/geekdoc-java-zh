  md: '# 6 DO YOU REMEMBER HOUSE?


    "house music" is indebted to DJ Craig Cannon''s Black, gay house party scene in
    the South Shore neighborhood, as well as the dance floor at The Warehouse on South
    Jefferson, not to mention Frankie Knuckles'' legendary sets. It also leaves space
    for the work of DJ pioneers like “Remix”, who makes a compelling case for having
    used the term in a wind advertisement at the South juice bar The Bitter End. That
    being said, this book acknowledges that “house” likely catered as a sonic signifier
    before being codified in Various Black party scenes for the marketing efforts
    of the record store Imports Etc. Recognizing that many readers would feel better
    having a definitive answer to the question of the term’s origin, I resist pinning
    it down doing so would not resolve the overarching concerns of this project.


    My address of shared memory work in Do You Remember House? builds off calls in
    the field of memory studies and the public humanities to better understand how
    the individual and communal እንደሚ of the past interact and combat each other. Taking
    heed of the work of historian Stephanie Yuhl, I propose that progenitors of Chicago
    house music and culture re-animate house culture history by “re-remembering” their
    own and others coming of age stories, “reconstituting the past in a meaningful,
    often therapeutic, form.” Following Lisa Waxer, whose work draws out connections
    between music and civic identity, I suggest that re-remembering shared musical
    cultures in Chicago is shaped by mediated listening to club DJs. I argue that
    this memory work is often multifaceted and pragmatic, and that it involves the
    contradictory efforts of multiple, overlapping generations of stewards; both seniors,
    like Robert Williams, and the many juniors who have knowing, or incidentally,
    become keepers of the flame.


    Yuhl notes that culture-bearers don’t necessarily revise the stories passed down
    to them, but they often enlarge them and give them “imaginative representation
    to suit their psychological needs for continuity and control in a changing world.”
    I understand the communal memory of Chicago “house heads” to be responsive, creative,
    and world-making, however, I also seriously historian Michel-Rolph Trouillot’s
    assertion that, for generations inheriting widely cited myths, the mandate and
    relevance of origin are assumed. As such, Do You Remember House? continuously
    puts pressure on questions of not only what happened over the course of nearly
    four decades, but also of how and why particular events became important. Further,
    in its address of the City’s-sonic historiography, this book takes a page from
    Foucault’s genealogical framework for understanding continuity, rupture, and change;
    it is less concerned with origin stories and'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Introduction • 7


    "momentous finality” than with what the philosopher calls “the sentiments, love,
    conscience, instincts” found in places often believed to be without historical
    import.¹¹ Indeed, this is esoteric and impressionistic moments that remain when
    the lights come up and the music fades.


    At its core, Do You Remember House? provides robust context for how music revolutionized
    social culture for Chicago’s most marginalized; how it became legendary DJ Craig
    Cannon called the City’s “musical Stonewall."12 And yet, as Trouillot speaks of
    the silences and omissions in the popular historiography of the Haitian Revolution,
    “time here is not more chronological continuity."³ Do You Remember House? is an
    attempt at freeze-framing overall-recounted stories of the revolution that are
    told about where house comes from and why it matters so as to account for their
    enduring power. It argues that if, as Richard Schnacher tells us, performance
    is behavior-behaved, then communal memories derive from stories twice-believed.¹⁴
    The book builds its argumentation from a painstakingly programmed mix of nearly
    sixty of these stories. It would not exist without the contributions of many generous
    narrators who spent their time recounting them between 2012 and 2014.


    I approached potential interviewees for what I have called Chicago Music Oral
    History Project with several criteria. First, I reached out to Black and Latin
    queer people whose whose or cultural work had been alluded to in extant and primary
    sources but had not authored their own accounts detailing their involvement in
    Chicago house music culture, or perhaps had been interviewed only once or twice
    by music journalists. Second, to identify and interview females and women who
    participated in Chicago house music culture as promoters, DJs, producers, and
    dancers, but whose presence hadn''t been registered with force or clarity in discographic
    or hagiographic records created by other dance music historians and journalists.
    Third, this combination of deliberate focus and snowball sampling helped me orient
    my collection of oral histories around voices that were not represented in existing
    archives while remaining flexible and inclusive whenever possible.


    I freely admit that the group I interviewed is not an unbiased cross section of
    all Chicago’s house music communities. I followed threads that I was drawn to
    musically, using intuition, and prioritized particular personal relationships;
    indeed, this group is not meant to be comprehensive nor representative. Furthermore,
    I realize that, as pioneering oral historian Alessandro Portelli puts it, historical
    work using exclusively oral sources is'
