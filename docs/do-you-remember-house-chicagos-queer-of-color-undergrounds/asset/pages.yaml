    # Hotmixing DJs on the Airwaves


    With the rise of higher-powered FM stations on the radio dial in the late 1960s,
    geographically isolated AM broadcasters began to be supplanted by stations reaching
    larger, more diverse listening publics. Radio''s immateriality and its broad reach
    made it capable of influencing and connecting these disparate publics despite
    social, and geographic, distances. As media historian Tim Taylor suggests, even
    if radio audiences experienced their lives through distinct prisms of race, class,
    gender, and sexuality, they could still share the same music at the same time.³⁵
    In the late 1970s, young Chicagoans got their first tastes of mixed disco music
    on the radio with the advent of WDA 94.7 FM, the station that dumped Steve Dahl
    and invented the city''s lunchtime time'
