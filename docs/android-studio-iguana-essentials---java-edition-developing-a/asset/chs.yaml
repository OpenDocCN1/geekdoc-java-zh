  \ 定制 TabLayout\n\n此示例项目中的 `TabLayout` 是使用固定模式（fixed mode）配置的。这种模式适用于数量有限且标题较短的标签页。当使用固定模式时，标签页数量较或标题较长可能会迅速成为问题，如图\
  \ 47-7 所示：\n\n![](img/as_4.1_tab_layout_truncated.jpg)\n\n图 47-7\n\n为了适应标签页适应显示宽度，`TabLayout`\
  \ 使用了多行文本。尽管如此，第二行仍被截断，导致无法看到完整标题。解决此问题的方案是将 `TabLayout` 切换到可滚动模式（scrollable mode）。在这种模式下，标题以全长度单行格式显示，允许用户通过滑动水平滚动可用项目，如图\
  \ 47-8 所示：\n\n![](img/as_4.1_tab_layout_scrollable.jpg)\n\n图 47-8\n\n要将 `TabLayout`\
  \ 切换到可滚动模式，请将 `activity_main.xml` 布局资源文件中的 `app:tabMode` 属性从“fixed”更改为“scrollable”：\n\
  \n```xml\n<android.support.design.widget.TabLayout\n    android:id=\"@+id/tabLayout\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    app:tabMode=\"scrollable\"\n    app:tabGravity=\"fill\"/>\n</android.support.design.widget.AppBarLayout>\n\
  ```\n\n在固定模式下，可以配置 `TabLayout` 以控制标签页项的显示方式，以占据屏幕上的可用空间。这是通过 `app:tabGravity` 属性控制的，其结果在更宽的显示器（如横屏下的平板电脑）上更为明显。例如，设置为“fill”时，项目将均匀分布在\
  \ `TabLayout` 的宽度上，如图 47-9 所示：\n\n![](img/as_4.1_tab_layout_fill.jpg)\n\n图 47-9\n\
  \n将属性值更改为“center”会导致项目相对于标签栏中心进行定位：\n\n![](img/as_4.1_tab_layout_center.jpg)\n\n\
  图 47-10\n\n### 47.10 总结\n\n`TabLayout` 是 Android Material 设计 实现中引入的组件之一。`TabLayout`\
  \ 组件的目的是展示一系列标签页项，当被选中时向用户显示不同的内容。标签页项可以显示文本、图像或它们的组合。当与 `ViewPager2` 类和 fragment\
  \ 结合时，可以很容易地创建标签布局，每个标签页项的选择都会显示不同的 fragment。\n\n## 48. 使用 RecyclerView 和 CardView\
  \ 控件\n\n`RecyclerView` 和 `CardView` 控件共同工作，为用户提供滚动滚动列表，其中信息以单个卡片的形式呈现。在介绍示例项目的设计和实现之前，本章将涵盖这两个类的详细信息。\n\
  \n### 48.1 RecyclerView 概览\n\n与“使用悬浮操作按钮和 Snackbar”章节中概述的 `ListView` 类类似，`RecyclerView`\
  \ 的目的是以可滚动列表的形式向用户呈现信息。然而，`RecyclerView` 相比 `ListView` 具有多个优势。特别是，`RecyclerView`\
  \ 在管理组成列表的视图方面效率得多，它会在列表项滚动出屏幕时复用已有的视图，而不是创建新视图（因此得名为“回收器”）。这提高了性能并减少了列表使用的资源，这一特性在向用户展示大量数据时特别有益。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器的选择，以控制列表项如何呈现给用户：\n\n- `LinearLayoutManager`\
  \ – 列表项以水平或垂直滚动列表的形式呈现。\n\n![](img/Image2427.jpg)\n\n图 48-1\n\n- `GridLayoutManager`\
  \ – 列表项以网格格式呈现。当列表项大小均匀时，使用此管理器效果最好。\n\n![](img/Image2436.jpg)\n\n图 48-2\n\n- `StaggeredGridLayoutManager`\
  \ - 列表项以交错网格格式呈现。当列表项大小不一时，使用此管理器效果最好。\n\n![](img/Image2443.jpg) 图 48-3\n\n对于三种内置管理器无法提供所需布局的情况，可以通过子类\
  \ `LayoutManager` 类来实现自定义布局管理器。`RecyclerView` 中显示的每个列表项作为 `ViewHolder` 实例创建。`ViewHolder`\
  \ 实例包含了 `RecyclerView` 显示列表所需的信息，包括要显示的视图。\n\n与 `ListView` 一样，`RecyclerView` 依赖\
  \ `adapter` 作为 `RecyclerView` 实例和要显示数据之间的中介。`adapter` 创建为 `RecyclerView.Adapter`\
  \ 的子类，并至少实现以下方法，这些方法会在分配给 `RecyclerView` 时被调用：\n\n- `getItemCount()` – 该方法返回要显示的项目数量。\n\
  - `onCreateViewHolder()` – 该方法创建并返回初始化视图的 `ViewHolder`。该视图通常通过填充 XML 文件创建。\n- `onBindViewHolder()`\
  \ – 该方法传递由 `onCreateViewHolder()` 创建的 `ViewHolder` 以及要显示的列表项整数值。`ViewHolder` 对象包含了\
  \ `onCreateViewHolder()` 分配的布局。`onBindViewHolder()` 方法负责用相应的文本填充布局中的视图，并将其返回给 `RecyclerView`\
  \ 展示。\n\n在布局中添加 `RecyclerView` 只需要在其显示的 activity XML 内容布局中添加相应的元素。例如：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\n    tools:context=\"\
  .MainActivity\"\n    tools:showIn=\"@layout/activity_demo\">\n\n    <androidx.recyclerview.widget.RecyclerView\n\
  \        android:id=\"@+id/recycler_view\"\n        android:layout_width=\"0dp\"\
  \n        android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        tools:listItem=\"\
  @layout/card_layout\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n\n\n\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\n在上面的示例中，`RecyclerView`\
  \ 已与 `AppBar` 和 `Toolbar` 一起嵌入到主活动布局文件的 `CoordinatorLayout` 中。这提供了一些额外功能，例如配置 `Toolbar`\
  \ 和 `AppBar`，当用户在 `RecyclerView` 中向上滚动时它们会滚出屏幕（该主题在\"Working with the AppBar and\
  \ Collapsing Toolbar Layouts\" 章节中有更详细的介绍）。\n\n## 48.2 CardView 概述\n\n`CardView`\
  \ 类是一种用户界面视图，允许使用卡片隐喻以分组形式呈现信息。卡片通常使用 `RecyclerView` 实例以列表形式呈现，并可以配置为带有阴影效果和圆角。例如，图\
  \ 48-4 显示了三个 `CardView` 实例，它们被配置为显示由一个 `ImageView` 和两个 `TextView` 组成的布局：\n\n![](img/Image24511.jpg)\n\
  \n图 48-4\n\n由 `CardView` 实例呈现的用户界面布局定义在 XML 布局资源文件中并在运行时加载到 `CardView` 中。`CardView`\
  \ 布局可以包含任何复杂性的布局，使用如 `RelativeLayout` 和 `LinearLayout` 等标准布局管理器。以下 XML 布局文件表示一个由\
  \ `RelativeLayout` 和单个 `ImageView` 组成的卡片视图布局。卡片被配置为抬起以创建阴影效果，并带有圆角显示：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \      xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\n      xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n      android:id=\"@+id/card_view\"\
  \n      android:layout_width=\"match_parent\"\n      android:layout_height=\"wrap_content\"\
  \n      android:layout_margin=\"5dp\"\n      card_view:cardCornerRadius=\"12dp\"\
  \n      card_view:cardElevation=\"3dp\"\n      card_view:contentPadding=\"4dp\"\
  >\n    <RelativeLayout\n          android:layout_width=\"match_parent\"\n      \
  \    android:layout_height=\"wrap_content\"\n          android:padding=\"16dp\"\
  \ >\n        <ImageView\n              android:layout_width=\"100dp\"\n        \
  \      android:layout_height=\"100dp\"\n              android:id=\"@+id/item_image\"\
  \n              android:layout_alignParentLeft=\"true\"\n              android:layout_alignParentTop=\"\
  true\"\n              android:layout_marginRight=\"16dp\" />\n    </RelativeLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n当与 `RecyclerView` 结合创建一个可滚的卡片列表时，循环视图的\
  \ `onCreateViewHolder()` 方法会加载卡片的布局资源文件，将其分配给 `ViewHolder` 实例并返回给 `RecyclerView`\
  \ 实例。\n\n### 48.3 总结\n\n本章介绍了 Android `RecyclerView` 和 `CardView` 组件。`RecyclerView`\
  \ 提供了一种资源高效的方式，用于在 Android 应用中显示可滚的视图列表。当以卡片形式呈现数据组（例如名称和地址列表）时，`CardView` 非常有用。正如在下一章教程中所述和演示的那样，`RecyclerView`\
  \ 和 `CardView` 结合使用时特别有用。\n\n## 49. Android RecyclerView 和 CardView 教程\n\n本章将创建一个同时使用\
  \ `CardView` 和 `RecyclerView` 组件的示例项目，以创建一个滚动卡片列表。完成后的应用程序将显示包含图像和文本的卡片列表。除了显示卡片列表外，项目还将实现选择卡片时显示消息。\n\
  \n### 49.1 创建 CardDemo\n\n从欢迎界面选择 `New Project` 选项，在生成的项目对话框中，点击 `Next` 按钮之前选择 `Basic\
  \ Views Activity` 模板。在 `Name` 字段中输入 `CardDemo` 并指定 `com.ebookrenzy.carddemo` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API` 级别更改为 `API 26: Android 8.0 (Oreo)`并将 `Language`\
  \ 菜单设置为 `Java`。\n\n### 49.2 修改 Basic Views 项目\n\n由于选择了 `Basic Views Activity`，布局中包含一个此项目并不需要的悬浮操作按钮。将\
  \ `activity_main.xml` 布局加载到 Layout Editor 工具中，选择悬浮操作按钮并按删除键将该对象从布局中删除。编辑 `MainActivity.java`\
  \ 文件，如下所示从 `onCreate` 方法中移除悬浮操作按钮和导航控制器代码：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_content_main);\n    appBarConfiguration = AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your action\", Snackbar.LENGTH_LONG)\n                .setAction(\"Action\"\
  , null).show();\n        }\n    });\n```\n\n此外，移除 `onSupportUp()` 方法，然后打开 `content_main.xml`\
  \ 从布局中删除 `nav_host_main` 对象，只保留 `ConstraintLayout`。\n\n### 49.3 设计 CardView 布局\n\
  \n卡片内部的视图将定义在一个独立的 XML 布局文件中。在 `Project` 窗口中，右键点击 `app` -> `res` -> layout 并选择 `New`\
  \ -> `Layout Resource File`。在 `New Resource` 对话框中，在点击 `OK` 按钮之前在 `File name:` 字段中输入\
  \ `card_layout`并在 `root element` 中输入 `CardView`。\n\n将 `card_layout.xml` 文件加载到 Layout\
  \ Editor 中，切换到 `Code` 模式并修改布局如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<androidx.cardview.widget.CardView\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/card_view\"\
  \n    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#80B3EF\"\n \
  \   app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\" >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
  @+id/relativeLayout\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\">\n        <ImageView\n        \
  \    android:id=\"@+id/itemImage\"\n            android:layout_width=\"100dp\"\n\
  \            android:layout_height=\"100dp\"\n            app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n            app:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n       \
  \     android:id=\"@+id/itemTitle\"\n            android:layout_width=\"236dp\"\n\
  \            android:layout_height=\"39dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:textSize=\"30sp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n\
  \            android:id=\"@+id/itemDetail\"\n            android:layout_width=\"\
  236dp\"\n            android:layout_height=\"16dp\"\n            android:layout_marginStart=\"\
  16dp\" />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</androidx.cardview.widget.CardView>\n\
  ```\n\n\n\n\n\n```xml\n              android:layout_marginTop=\"8dp\"\n        \
  \      app:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\n              app:layout_constraintStart_toEndOf=\"\
  @+id/itemImage\"\n              app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\"\
  \ />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</androidx.cardview.widget.CardView>\n\
  ```\n\n# 49.4 添加 RecyclerView\n\n选择 `content_main.xml` 布局文件，从调色板的 Containers（容器）部分拖入\
  \ `RecyclerView` 对象到布局中，使其位于屏幕中心，它将会自动调整大小以填充整个屏幕。使用 `Infer constraints`（推约束）工具栏按钮为视图添加任何缺失的布局约束。使用\
  \ `Attributes`（属性）窗口，将 `RecyclerView` 实例的 `ID` 更改为 `recyclerView`，并将 `layout_width`\
  \ 和 `layout_height` 属性更改为 `match_constraint`。\n\n### 49.5 添加图片\n\n除了两个 `TextView`\
  \ 之外，卡片布局还包含一个 `ImageView`，Recycler 适配器已配置为在该视图上显示图片。在测试项目之前，必须添加这些图片。项目将使用的图片命名为\
  \ `android_image_<n>.jpg`，可以在以下 URL 下载的示例代码 `project_icons` 文件夹中找到：\n\n[`www.payloadbooks.com/product/iguanajava`](https://www.payloadbooks.com/product/iguanajava)\n\
  \n在操作系统的文件系统导航器中找到这些图片，选择并复制这八张图片。在 Project 工具窗口中右键点击 `app` -> `res` -> `drawable`\
  \ 项，并选择 `Paste`（粘贴）将文件添加到文件夹中：\n\n![](img/as_card_demo_images.jpg)\n\n图 49-1\n\n\
  # 49.6 创建 RecyclerView Adapter\n\n如上一节所述，`RecyclerView` 需要一个适配器来处理列表项的创建。在 Project\
  \ 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.carddemo` ，并选择 `New` -> `Java Class`\
  \ 菜单选项，将此新类添加到项目。。在新类对话框中，在 `Name` 字段中输入 `RecyclerAdapter`，并在列表中选择 `Class`，然后按回车键创建新的\
  \ Java 类文件。\n\n编辑 `RecyclerAdapter.java` 文件以添加一些导入指令，并声明该类现在继承 `RecyclerView.Adapter`。与其创建一个单独的类来提供要显示的数据，不如向适配器添加一些基础数组作为应用的数据：\n\
  \n```java\npackage com.ebookfrenzy.carddemo;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.ImageView;\n\
  import android.widget.TextView;\nimport androidx.annotation.NonNull;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n\n    final private String[] titles = {\"Chapter One\",\n                \"\
  Chapter Two\",\n                \"Chapter Three\",\n                \"Chapter Four\"\
  ,\n                \"Chapter Five\",\n                \"Chapter Six\",\n       \
  \         \"Chapter Seven\",\n                \"Chapter Eight\"};\n    final private\
  \ String[] details = {\"Item one details\",\n                \"Item two details\"\
  , \"Item three details\",\n                \"Item four details\", \"Item five details\"\
  ,\n                \"Item six details\", \"Item seven details\",\n             \
  \   \"Item eight details\"};\n    final private int[] images = { R.drawable.android_image_1,\n\
  \                               R.drawable.android_image_2,\n                  \
  \             R.drawable.android_image_3,\n                               R.drawable.android_image_4,\n\
  \                               R.drawable.android_image_5,\n                  \
  \             R.drawable.android_image_6,\n                               R.drawable.android_image_7,\n\
  \                               R.drawable.android_image_8 };\n}\n```\n\n在 `RecyclerAdapter`\
  \ 类中，我们现在需要自己实现 `ViewHolder` 类，以引用 `card_layout.xml` 文件中的视图元素。留在 `RecyclerAdapter.java`\
  \ 文件中，如下如下实现此类：\n\n```java\npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n\n    static class ViewHolder extends RecyclerView.ViewHolder {\n        ImageView\
  \ itemImage;\n        TextView itemTitle;\n        TextView itemDetail;\n\n    \
  \    ViewHolder(View itemView) {\n            super(itemView);\n            itemImage\
  \ = itemView.findViewById(R.id.itemImage);\n            itemTitle = itemView.findViewById(R.id.itemTitle);\n\
  \            itemDetail = itemView.findViewById(R.id.itemDetail);\n        }\n \
  \   }\n```\n\n`ViewHolder` 类包含一个 `ImageView` 和两个 `TextView` 变量，以及一个构造方法，该方法使用 `card_layout.xml`\
  \ 文件中的三个视图项初始化这些变量。要添加到 `RecyclerAdapter.java` 文件的下一项是 `onCreateViewHolder()` 方法的实现：\n\
  \n```java\n@NonNull\n@Override\npublic ViewHolder onCreateViewHolder(ViewGroup viewGroup,\
  \ int i) {\n    View v = LayoutInflater.from(viewGroup.getContext())\n         \
  \   .inflate(R.layout.card_layout, viewGroup, false);\n    return new ViewHolder(v);\n\
  }\n```\n\n此方法将由 `RecyclerView` 调用以获取 `ViewHolder` 对象。它填充（inflate）视图层级并返回一个新的 `ViewHolder`\
  \ 实例。\n\n此方法会被 `RecyclerView` 调用以获取 `ViewHolder` 对象。它填充 `card_layout.xml` 视图层级并返回我们的\
  \ `ViewHolder` 实例，将其返回给 `RecyclerView`。\n\n`onBindViewHolder()` 方法的目的是为 `ViewHolder`\
  \ 对象中的视图层级填充要显示的数据。它接收 `ViewHolder` 对象和一个表示要显示的列表项的整数值。现在可以使用该项索引访问数组并显示数据：\n\n\
  ```java\n@Override\npublic void onBindViewHolder(ViewHolder viewHolder, int i) {\n\
  \    viewHolder.itemTitle.setText(titles[i]);\n    viewHolder.itemDetail.setText(details[i]);\n\
  \    viewHolder.itemImage.setImageResource(images[i]);\n}\n```\n\n适配器的最后一个要求是实现\
  \ `getItem()` 方法，情况下返回 `titles` 数组的长度：\n\n```java\n@Override\npublic int getItemCount()\
  \ {\n    return titles.length;\n}\n```\n\n# 49.7 初始化 RecyclerView 组件\n\n此时，项目包含\
  \ `RecyclerView` 实例、`CardView` 实例的 XML 布局文件以及 `RecyclerView` 的适配器。测试之前的最后一步是用布局管理器初始化\
  \ `RecyclerView`，创建适配器实例并将其分配给 `RecyclerView` 对象。对于本示例，`RecyclerView` 将配置为使用 `LinearLayoutManager`\
  \ 布局选项。\n\n这里有一处小复杂之处，因为我们需要能够通过视图绑定在 `MainActivity` 类中访问 `recyclerView` 组件。问题是\
  \ `recyclerView` 包含在 `content_main.xml` 文件中，而该文件又包含在 `activity_main.xml` 中。为了进入\
  \ `content_main.xml` 文件，我们需要在包含处为其分配 ID。为此，编辑 `activity_main.xml` 文件并修改 `include`\
  \ 元素如下：\n\n```xml\n<include\n    android:id=\"@+id/contentMain\"\n    layout=\"\
  @layout/content_main\" />\n```\n\n为包含的文件分配 ID 后，可以使用以下绑定访问 `recyclerView` 组件：\n\n\
  `binding.contentMain.recyclerView`\n\n现在编辑 `MainActivity.java` 文件并修改 `onCreate()`\
  \ 方法以实现初始化代码：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\nimport androidx.recyclerview.widget.LinearLayoutManager;\n\
  import androidx.recyclerview.widget.RecyclerView;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n```\n\n\n\n\n\n```java\n    private RecyclerView recyclerView;\n\
  \n    private RecyclerView.LayoutManager layoutManager;\n\n    private RecyclerView.Adapter\
  \ adapter;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        setSupportActionBar(toolbar);\n        layoutManager = new LinearLayoutManager(this);\n\
  \        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n   \
  \     adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n}\n```\n\n### 49.8 测试应用程序\n\n在物理设备或模拟器会话上编译并运行应用，滚动列表中的不同的卡片项：\n\n![](img/as_card_demo_running.jpg)\n\
  \n图 49-2\n\n### 49.9 响应卡片选择\n\n本项目的最后一个阶段是让列表中的卡片变得可选，这样点击卡片就会触发应用内部的事件。在本示例中，卡片将被配置为在用户点击时在屏幕上显示一条消息。为了响应点击操作，需要修改\
  \ `ViewHolder` 类，以便为每个项视图分配一个 `onClickListener`。编辑 `RecyclerAdapter.java` 文件并修改\
  \ `ViewHolder` 类声明，使其内容如下：\n\n```java\nimport com.google.android.material.snackbar.Snackbar;\n\
  \nclass ViewHolder extends RecyclerView.ViewHolder{\n    ImageView itemImage;\n\
  \    TextView itemTitle;\n    TextView itemDetail;\n    ViewHolder(View itemView)\
  \ {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.item_image);\n\
  \        itemTitle = itemView.findViewById(R.id.item_title);\n        itemDetail\
  \ = itemView.findViewById(R.id.item_detail);\n        itemView.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override public void onClick(View v) {\n\
  \            }\n        });\n    }\n}\n```\n\n在 `onClick` 处理程序的体内部，现在可以添加代码来显示消息，指示卡片已被点击。由于点击后执行的操作可能取决于点击了哪张卡片，因此识别所选的卡片也很重要。此信息可以通过调用\
  \ `RecyclerView.ViewHolder` 类的 `getAdapterPosition()` 方法获取。留在 `RecyclerAdapter.java`\
  \ 文件中，为 `onClick` 处理程序添加代码，使其内容如下：\n\n```java\n@override\npublic void onClick(View\
  \ v) {\n    int position = getAdapterPosition();\n    Snackbar.make(v, \"Click detected\
  \ on item \" + (position + 1),\n            Snackbar.LENGTH_LONG)\n            .setAction(\"\
  Action\", null).show();\n}\n```\n\n最后一个任务是启用 Android 应用中点击项时出现的 Material Design\
  \ 波纹效果。这涉及在 `card_layout.xml` 文件的 `CardView` 实例声明中添加一些属性，如下所示：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n   \
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:card_view=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#80B3EF\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\"\n    android:foreground=\"?selectableItemBackground\"\n    android:clickable=\"\
  true\" >\n```\n\n### 49.10 总结\n\n本章详细介绍了结合 `CardView` 和 `RecyclerView` 组件显示列表的步骤。示例还涵盖了点击检测、识别所选项以及启用波纹效果。\n\
  \n## 50.1 为项目添加示例数据\n\n在用户界面设计阶段，`RecyclerView` 与运行中的应用相似性并不大。在此之前，值得注意的是，布局编辑器有一组可以使用示例数据模板。要查看这些模板的用法，请将\
  \ `content_main.xml` 文件加载到布局编辑器并选择 `RecyclerView` 实例。右键点击 `RecyclerView` 并选择 `Set\
  \ Sample Data` 菜单以显示设计时属性面板：\n\n![](img/as_3.2_design_time_attributes.jpg)\n\n图\
  \ 50-2\n\n将模板更改为 `Email` 选项，并将项计数更改为 `12`，注意 `RecyclerView` 发生了以显示数据：\n\n![](img/as_3.6_recyclerview_sample_data.jpg)\n\
  \n图 50-3\n\n这些模板对于在无需任何额外工作的情况下显示示例数据非常有用，并且通常足以完成布局设计。然而，在本示例中，将在布局内部按预期使用示例数据。切换到代码（Code）模式并找到\
  \ `RecyclerView` 元素，其内容应如下：\n\n```xml\n<androidx.recyclerview.widget.RecyclerView\n\
  \    android:id=\"@+id/recyclerView\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:itemCount=\"12\"\n    tools:listitem=\"@layout/recycler_view_item\"\
  \ />\n```\n\n注意当前配置的两个特殊工具属性，用于在列表中显示 12 个项，每个项都使用包含在 `recycler_view_item.xml` 文件中的布局。上述引用的\
  \ `recycler_view_item.xml` 文件是在选择示例数据模板时由布局编辑器自动生成的，可以在项目工具窗口中找到。\n\n\n\n\n切换回设计（Design）模式，并在选中\
  \ `RecyclerView` 的情况下，使用设计时视图属性（Design-time View Attributes）面板将模板切换回默认设置。`recycl_view_item.xml`\
  \ 文件将从项目里删除，同时 `content_main.xml` XML 文件中的两个 tools 属性行也将被删除（如果 Android Studio 未能删除这些行，则可以在代码（Code）视图中手动删除）。\n\
  \n要切换到使用卡片布局显示示例数据，请添加一个 `listitem` 属性以引用 `card_layout.xml` 文件。在布局中选中 `RecyclerView`\
  \ 后，在属性（Attributes）工具窗口中搜索 `listitem` 属性，并在属性字段中输入 `@layout/card_layout`，如图 50-4\
  \ 所示：\n\n![](img/as_sample_data_list_item.jpg)\n\n图 50-4\n\n注意，现在每个列表项都都显示了卡片布局，尽管没有任何图像且使用的是样本文本数据：\n\
  \n![](img/as_sample_list_items.jpg)\n\n图 50-5\n\n下一步是在卡片布局的视图中显示一些图像和不同的文本。这既可以通过布局编辑器提供的模板示例数据实现，也可以通过专门为此项目添加自定义示例数据来实现。将\
  \ `card_layout.xml` 文件加载到布局编辑器中，选中 `ImageView` 并按照本章早些介绍的方法显示设计时视图属性面板。从 `srcCompat`\
  \ 菜单选择内置的背景/风景图集，如下方的图 50-6 所示：\n\n![](img/as_sample_data_images.jpg)\n\n图 50-6\n\
  \n接下来，右键点击 `itemTitle` `TextView` 对象，选择“设置示例数据”（Set Sample Data）菜单选项，并在设计时属性面板中选择\
  \ `cities` 文本选项。对 `itemDetail` 视图重复此步骤，这次选择 `full_names` 选项，如图 50-7 所示：\n\n![](img/as_sample_data_names.jpg)\n\
  \n图 50-7\n\n在设计模式下打开 `content_main.xml` 文件，注意 `RecyclerView` 现在正在使用内置图像和示例文本数据：\n\
  \n![](img/as_sample_data_stage1.jpg)\n\n图 50-8\n\n### 50.2 使用自定义示例数据\n\n本章的最后一步是演示如何在布局编辑器中使用自定义示例数据和图像。这需要创建一个示例数据目录并添加一些文本和图像文件。在项目（Project）工具窗口中，右键点击\
  \ `app` 条目并选择“新建 -> 示例数据目录”（New -> Sample Data Directory）菜单选项，此时项目工具窗口中将一个名为 `sampledata`\
  \ 的新目录。如果新文件夹不可见，请将项目工具窗口从 Android 模式切换到 Project 模式，并在 `CardDemo -> app` 下找到该文件夹，如图\
  \ 50-9 所示：\n\n![](img/as_sample_data_folder.jpg)\n\n图 50-9\n\n右键点击 `sampledata`\
  \ 目录，创建一个名为 `images` 的目录，并按照上一章中概述的步骤将 Android 图像复制粘贴到新文件夹中。在 `card_layout.xml`\
  \ 文件中，再次为 `ImageView` 显示设计时视图属性面板，这次点击“浏览”（Browse）链接并在资源对话框中选择新添加的 Android 图像（如果图像文件夹未出现，请尝试重建项目）：\n\
  \n![](img/as_sample_data_resource_manager.jpg)\n\n图 50-10\n\n再次右键点击 `sampledata`\
  \ 目录，选择“新建 -> 文件”（New -> File）选项，将文件命名为 `chapters` 并输入以下内容：\n\n```\nChapter One\n\
  Chapter Two\nChapter Three\nChapter Four\nChapter Five\nChapter Six\nChapter Seven\n\
  Chapter Eight\n```\n\n接下来，创建一个名为 `items` 的第二个文本文件，内容如下：\n\n```\nItem one details\n\
  Item two details\nItem details\nItem four details\nItem five details\nItem six details\n\
  Item seven details\nItem eight details\n```\n\n创建示例数据文本文件后，剩下的只需如下在 `card_layout.xml`\
  \ 文件的视图元素中引用它们：\n\n```xml\n<TextView\n    android:id=\"@+id/itemTitle\"\n    android:layout_width=\"\
  236dp\"\n    android:layout_height=\"39dp\"\n    android:layout_marginStart=\"16dp\"\
  \n    android:textSize=\"30sp\"\n    app:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\
  \n    app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:text=\"@sample/chapters\" />\n\n<TextView\n    android:id=\"\
  @+id/itemDetail\"\n    android:layout_width=\"236dp\"\n    android:layout_height=\"\
  16dp\"\n    android:layout_marginStart=\"16dp\"\n    android:layout_marginTop=\"\
  8dp\"\n    app:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/itemImage\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    tools:text=\"\
  @sample/items\" />\n```\n\n重新构建应用并注意 `RecyclerView` 现在正在使用内置图像和示例文本数据：\n\n![](img/as_sample_data_completed.jpg)\n\
  \n图 50-11\n\n除了使用两个文本文件，另一种选择是在 JSON 文件中声明示例数据。例如：\n\n```json\n{\n  \"mydata\":\
  \ [\n    {\n      \"chapter\": \"Chapter One\",\n      \"details\": \"Item one details\"\
  ,\n      \"image\": \"@sample/images\"\n    },\n    {\n      \"chapter\": \"Chapter\
  \ Two\",\n      \"details\": \"Item two details\",\n      \"image\": \"@sample/images\"\
  \n    }\n  ]\n}\n```\n\n假设上述内容位于名为 `chapterdata.json` 的文件中，则在视图元素中的引用如下：\n\n```xml\n\
  <ImageView\n    tools:src=\"@sample/chapterdata.json/mydata/image\" />\n\n<TextView\n\
  \    tools:text=\"@sample/chapterdata.json/mydata/chapter\" />\n\n<TextView\n  \
  \  tools:text=\"@sample/chapterdata.json/mydata/details\" />\n```\n\n### 50.3 总结\n\
  \n本章演示了如何在布局编辑器中使用示例数据来提供用户界面更真实的表示。本教程涵盖的步骤包括现有示例数据模板以及自定义示例数据的集成。\n\n### 51. 与\
  \ AppBar 和折叠布局协作\n\n在本章中，我们将探索如何自定义活动内的 AppBar，并使其对屏幕发生的滚动事件做出响应。通过 `CoordinatorLayout`\
  \ 配合 `AppBarLayout` 和 `CollapsingToolbarLayout` 容器，可以配置 AppBar 显示图像并在视图中淡入淡出。例如，可以配置列表的向上滚动，使\
  \ AppBar 从视图中消失，并在执行向下滚动时重新出现。\n\n从组成 AppBar 的元素概述开始，本章将通过各种 AppBar 配置示例进行讲解。\n\n\
  #### 51.1 AppBar 的结构\n\nAppBar 是运行时位于显示器顶部的区域，可以配置包含各种项目，包括状态栏、工具栏、标签栏和灵活空间区域。图\
  \ 51-1 示例了一个包含状态栏、工具栏和标签栏的 AppBar：\n\n![](img/Image24271.jpg)\n\n图 51-1\n\n空白背景色可以填充灵活空间区域，或者如图\
  \ 51-2 所示，在 `ImageView` 对象上显示图像：\n\n![](img/Image24361.jpg)\n\n图 51-2\n\n正如本章其余部分将演示的，如果活动用户界面布局的主内容区域包含可滚动内容，当屏幕内容滚动时，可以配置\
  \ AppBar 的元素进行展开和收缩。\n\n\n\n\n\n在本示例中，我们将对早期章节中创建的 `CardDemo` 项目进行修改，该章节标题为 Android\
  \ RecyclerView 和 CardView 教程。首先，启动 Android Studio 并加载此项目。\n\n项目加载完成后，运行应用并注意在向上滚动列表时，工具栏保持可见，如图\
  \ 51-3 所示：\n\n![](img/as_app_bar_1.jpg)\n\n图 51-3\n\n第一步是进行配置更改，使工具栏在向上滚动运动期间收缩，并在向下滚动时展开。\n\
  \n## 51.3 协调 RecyclerView 和 Toolbar\n\n在布局编辑器工具中加载 `activity_main.xml` 文件，切换到代码（Code）模式并查看\
  \ XML 布局设计，其层级结构如图图 51-4 中的图所示：\n\n![](img/as3.0_appbar_coordinatorlayout_tree.jpg)\n\
  \n图 51-4\n\n层级结构的顶层是 `CoordinatorLayout`，顾其实名，它协调其包含的各种子视图元素之间的交互。例如在“使用浮操作按钮和 Snackbar”中强调的，`CoordinatorLayout`\
  \ 会在 `Snackbar` 出现时自动将浮操作按钮向上滑动以容纳其显示，然后在栏消失后将按钮移回下方。\n\n`CoordinatorLayout` 同样可以用于根据视图层级中某些视图的滚动操作，使应用栏元素滑入或滑出视图。图\
  \ 51-4 所示的布局层级中的一个元素是 `ConstraintLayout`。为了实现这种协调行为，需要在发生滚动的元素以及与滚动进行协调的元素上设置属性。\n\
  \n在滚动元素（在本例中为 `RecyclerView`）上，必须将 `android:layout_behavior` 属性设置为 `appbar_scrolling_view_behavior`。在\
  \ `content_main.xml` 文件中，找到顶层 `ConstraintLayout` 元素并注意该属性已默认设置：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\" >\n```\n\n\
  接下来，在布局编辑器中打开 `activity_main.xml` 文件，切换到代码模式并找到 `AppBarLayout` 元素。注意视图层级中 `AppBarLayout`\
  \ 的唯一子元素是 `Toolbar`。为了让工具栏响应 `RecyclerView` 中发生的滚动事件，必须在该元素上设置 `app:layout_scrollFlags`\
  \ 属性。分配给该属性的值所需的交互性质，并且必须由以下一个或多个选项组成：\n\n- `scroll` – 表示将视图滚动出屏幕。如果不设置此项，视图在滚动事件期间将固定在屏幕顶部。\n\
  - `enterAlways` – 与 `scroll` 选项配合使用，向上滚动运动会导致视图收回。在此模式下，任何向下滚动运动都会导致视图重新出现。\n- `enterAlwaysCollapsed`\
  \ – 设置在视图上时，该视图在向下滚动运动达到列表限制之前将不会从折叠状态展开。如果设置了 `minHeight` 属性，视图将在初始滚动期间出现，但仅持续到达到最小高度。随后它将保持在该高度，并且在到达列表顶部之前不会完全展开。注意，此选项仅在同时使用\
  \ `enterAlways` 和 `scroll` 选项时起作用。例如：\n\n```xml\napp:layout_scrollFlags=\"scroll|enterAlways|enterAlwaysCollapsed\"\
  \nandroid:minHeight=\"20dp\"\n```\n\n- `exitUntilCollapsed` – 设置后，视图将在向上滚动运动期间收缩，直到达到\
  \ `minHeight` 阈值。在某点上，它将保持在该高度，直到滚动方向改变。\n\n对于此示例，将在 `Toolbar` 上按如下所示设置 `scroll`\
  \ 和 `enterAlways` 选项：\n\n```xml\n<com.google.android.material.appbar.MaterialToolbar\n\
  \    android:id=\"@+id/toolbar\"\n    android:layout_width=\"match_parent\"\n  \
  \  android:layout_height=\"?attr/actionBarSize\"\n    app:layout_scrollFlags=\"\
  scroll|enterAlways\" />\n```\n\n设置好相应属性后，重新运行应用并在 `RecyclerView` 列表中进行向上滚动运动。这应该导致工具栏折叠出视图（图\
  \ 51-5）。向下滚动运动应导致工具栏重新出现。\n\n![](img/as_card_demo_appbar_scroll.jpg)\n\n图 51-5\n\
  \n### 51.4 引入折叠工具栏布局\n\n`CollapsingToolbarLayout` 容器通过提供更广泛的选项以及对响应协调滚动操作的应用程序栏及其子元素折叠的更强控制，增强了标准工具栏。`CollapsingToolbarLayout`\
  \ 类旨在作为 `AppBarLayout` 的子元素添加。它提供了诸如在工具栏折叠和展开时自动调整工具栏大小的功能。`parallax` 模式允许应用栏内容折叠消失，而\
  \ `pin` 模式允许应用栏元素在收缩期间保持固定位置。还有 `scrim` 选项用于指定工具栏在折叠期间过渡的颜色。\n\n为了演示这些功能，`activity_main.xml`\
  \ 文件中的应用栏将修改为使用 `CollapsingToolbarLayout` 并添加 `ImageView` 以演示 `parallax` 模式。使用 `CollapsingToolbarLayout`\
  \ 的新视图层级如图图 5-6 中的图所示：\n\n![](img/as3.0_appbar_collapsing_tree.jpg)\n\n图 5-6\n\n\
  在布局器的代码模式下加载 `activity_main.xml` 文件并修改如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    android:fitsSystem=\"\
  true\"\n    tools:context=\".MainActivity\">\n    <com.google.android.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:fitsSystemWindows=\"true\">\n        <com.google.android.material.appbar.CollapsingToolbarLayout\n\
  \            android:id=\"@+id/collapsing_toolbar\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"match_parent\"\n           \
  \ app:layout_scrollFlags=\"scroll|enterAlways\"\n            android:fitsSystemWindows=\"\
  true\"\n            app:expandedTitleMarginBottom=\"30dp\"\n            app:expandedTitleMarginStart=\"\
  15dp\"\n            app:expandedTitleMarginEnd=\"64dp\">\n            <ImageView\n\
  \                android:id=\"@+id/backdrop\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"200dp\"\n              \
  \  android:scaleType=\"centerCrop\"\n                android:fitsSystemWindows=\"\
  true\"\n                app:layout_collapseMode=\"parallax\"\n                android:src=\"\
  @drawable/appbar_image\" />\n            <com.google.android.material.appbar.MaterialToolbar\n\
  \                android:id=\"@+id/toolbar\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"?attr/actionBarSize\" />\n\
  \        </com.google.android.material.appbar.CollapsingToolbarLayout>\n    </com.google.android.material.appbar.AppBarLayout>\n\
  </androidx.coordinatorlayout.widget.CoordinatorLayout>\n```\n\n\n\n\n\n```xml\n\
  \            app:layout_scrollFlags=\"scroll|enterAlways\"\n            app:layout_collapseMode=\"\
  pin\" />\n    </com.google.android.material.appbar.CollapsingToolbarLayout>\n</com.google.android.material.appbar.AppBarLayout>\n\
  <include\n    android:id=\"@+id/contentMain\"\n    layout=\"@layout/content_main\"\
  \ />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n```\n\n使用你操作系统的文件导航器，在书籍代码示例下载的\
  \ `project_icons` 文件夹中找到 `appbar_image.jpg` 文件并复制它。在 Project 工具窗口中，右键点击 `app` ->\
  \ `res` -> `drawable` 项，并在弹出的菜单中选择“粘贴（Paste）”。\n\n运行应用时，应用栏应该如图 51-7 所示所示：\n\n![](img/as_app_bar_2.jpg)\n\
  \n图 51-7\n\n向上滚动列表会导致应用栏逐渐折叠。在收缩过程中，图像将淡变为由 `scrim` 属性定义的颜色，同时标题文本的字体大小按相应比例缩小，直到只显示工具栏：\n\
  \n![](img/as_app_bar_3.jpg)\n\n图 51-8\n\n在滚动动作的初始阶段，工具栏保持可见（如果继续向上滚动，工具栏也会移出视图），这是因为\
  \ `activity_main.xml` 文件中的工具栏元素被配置为使用 `pin` 模式，因此灵活区域发生了折叠：\n\n`app:layout_collapseMode=\"\
  pin\"`\n\n如果将折叠模式设置为 `parallax`，工具栏将随着图像视图一起退出。\n\n继续向上滚动将导致工具栏也折叠，只剩下状态栏可见：\n\n\
  ![](img/as_app_bar_4.jpg)\n\n图 51-9\n\n由于 `CollapsingToolbarLayout` 元素的 `scroll\
  \ flags` 属性包含了 `enterAlways` 选项，向下滚动动作将导致应用栏再次展开。\n\n要固定工具栏使其在向上滚动过程中不再移出视图，请如下修改\
  \ `activity_main.xml` 文件中 `CollapsingToolbarLayout` 元素的 `layout_scrollFlags` 属性，将\
  \ `enterAlways` 替换为 `exitUntilCollapsed`：\n\n```xml\n<com.google.android.material.appbar.CollapsingToolbarLayout\n\
  \    android:id=\"@+id/collapsing_toolbar\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    app:layout_scrollFlags=\"scroll|exitUntilCollapsed\"\
  \n    android:fitsSystemWindows=\"true\"\n    app:expandedTitleMarginBottom=\"30dp\"\
  \n    app:expandedTitleMarginStart=\"15dp\"\n    app:expandedTitleMarginEnd=\"64dp\"\
  >\n```\n\n## 51.5 修改标题和遮罩颜色\n\n作为最后一项任务，编辑 `MainActivity.java` 文件并在 `onCreate()`\
  \ 方法中添加一些代码，以更改折叠布局管理器实例上的标题文本，并设置不同的 `scrim` 颜色（注意 `scrim` 颜色也可以在布局资源文件中设置）：\n\n\
  ```java\npackage com.ebookfrenzy.carddemo;\n\nimport com.google.android.material.appbar.CollapsingToolbarLayout;\n\
  import android.graphics.Color;\n\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    binding.collapsingToolbar.setTitle(\"My Toolbar Title\");\n    binding.collapsingToolbar.setContentScrimColor(Color.GREEN);\n\
  \    layoutManager = new LinearLayoutManager(this);\n    binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \    adapter = new RecyclerAdapter();\n    binding.contentMain.recyclerView.setAdapter(adapter);\n\
  }\n```\n\n最后运行一次应用，注意新标题已出现在应用栏中，并且滚动现在会使工具栏在移出视图时过渡到绿色。\n\n### 51.6 总结\n\n大多数 Android\
  \ 应用顶部的应用栏可以由几个元素组成，包括工具栏、标签页布局和图像视图。当嵌入在 `CoordinatorLayout` 父容器时，可以使用多个选项来控制应用栏相对于滚动的行为。为了获得更大的控制，`CollapsingToolbarLayout`\
  \ 为应用栏的展开和收缩提供了额外的控制级别。\n\n## 52. 主列表/详情教程\n\n在本章的下一节中，将详细介绍组成主列表/详情流（Primary/Detail\
  \ Flow）模板的各种元素。最好的方法是使用该模板创建一个项目，并在学习信息的同时对其进行操作。\n\n### 52.1 主列表/详情流\n\n主列表/详情流是一种界面设计，其中显示一个项目列表（称为主列表）。当选择某个项目时，与该项目相关的额外信息将在详情面板中呈现。\n\
  \n在横屏模式的平板电脑尺寸显示器上，主列表出现在屏幕左边缘的狭窄垂直面板中。屏幕的其余部分分配给详情面板，这种布局被称为“双窗模式（two-pane mode）”。例如，图\
  \ 52-1 显示了主列表和详情面板中显示的项目内容：\n\n![](img/detail_flow_tablet.jpg)\n\n图 52-1\n\n在较小的手机尺寸设备上，主列表占据整个屏幕，当从主列表中做出选择时，详情面板将会在一个单独的屏幕上出现。在这种模式下，详情屏幕包含一个返回主列表的操作栏。例如，图\
  \ 52-2 展示了同一项目在 4 英寸手机屏幕上的主列表和详情页：\n\n![](img/detail_flow_phone.jpg)\n\n图 52-2\n\
  \n### 52.2 创建主列表/详情流 Activity\n\n在欢迎界面选择 New Project 选项，在出现的新项目对话框中选择 No Activity\
  \ 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 `PrimaryDetailFlow`，并指定包名为 `com.ebookfrenzy.primarydetailflow`。在点击\
  \ Finish 按钮之前，将 Minimum API 设置设置为 `API 26: Android 8.0 (Oreo)`，并将 Language 设置为 Java。\n\
  \n### 52.3 添加主列表/详情流 Activity\n\n在 Project 工具窗口中，右键点击 `app` -> `java` -> `com.ebookfrenzy.primarydetailflow`\
  \ 项，选择 `New` -> `Activity` -> `Primary/Detail Views Flow` 选项。在新活动对话框中（图 52-3），在点击\
  \ Finish 按钮之前，确保 Launcher Activity 复选框已启用：\n\n![](img/new_primary_detail_activity.jpg)\n\
  \n图 52-3\n\n\n\n\n\n在本章的剩余部分中，`PrimaryDetailFlow` 项目将进行修改，使主列表显示网站名称列表，并将详情面板更改为包含一个\
  \ `WebView` 对象，而不是当前的 `TextView`。当用户选择某个网站时，相应的网页随后将在详情面板中加载并显示。\n\n## 52.5 更改内容模型\n\
  \n该示例的内容目前由 `PlaceholderContent` 类文件定义。因此，请先选择 `PlaceholderContent.java` 文件（位于 Project\
  \ 工具窗口的 `app -> java -> com.ebookfrenzy.primarydetailflow -> placeholder` 文件夹中）并查看代码。在文件的底部，有一个名为\
  \ `PlaceholderItem` 的类声明，该类目前能够存储三个 `String` 对象，分别代表内容、详情字符串以及一个 ID。相比之下，更新后的项目需要每个项目对象包含一个\
  \ ID 字符串、一个网站名称字符串以及一个该网站对应的 URL 字符串。为了添加这些功能，请修改 `PlaceholderItem` 类，使其内容如下：\n\n\
  ```java\npublic static class PlaceholderItem {\n    public String id;\n    public\
  \ String website_name;\n    public String website_url;\n    public PlaceholderItem(String\
  \ id, String website_name, String website_url)\n    {\n        this.id = id;\n \
  \       this.website_name = website_name;\n        this.website_url = website_url;\n\
  \    }\n\n    @Override\n    public String toString() {\n        return website_name;\n\
  \    }\n}\n```\n\n注意，封装的 `PlaceholderContent` 类目前包含一个 for 循环，通过多次调用名为 `createPlaceholderItem()`\
  \ 和 `makeDetails()` 的方法添加 25 个项目。这些代码中的大部分将不再需要，并应如下所示从类中删除：\n\n```java\npublic\
  \ static final Map<String, PlaceholderItem> ITEM_MAP = new HashMap<String, PlaceholderItem>();\n\
  \nprivate static final int COUNT = 25;\n\nstatic {\n    // Add some sample items.\n\
  \    for (int i = 1; i <= COUNT; i++) {\n        addItem(createPlaceholderItem(i));\n\
  \    }\n}\n\nprivate static void addItem(PlaceholderItem item) {\n    ITEMS.add(item);\n\
  \    ITEM_MAP.put(item.id, item);\n}\n\nprivate static PlaceholderItem createPlaceholderItem(int\
  \ position) {\n    return new PlaceholderItem(String.valueOf(position), \"Item \"\
  \ + position, makeDetails(position));\n}\n\nprivate static String makeDetails(int\
  \ position) {\n    StringBuilder builder = new StringBuilder();\n    builder.append(\"\
  Details about Item: \").append(position);\n    for (int i = 0; i < position; i++)\
  \ {\n        builder.append(\"\\nMore details information here.\");\n    }\n   \
  \ return builder.toString();\n}\n```\n\n此代码需要修改以用所需的网站数据初始化数据模型：\n\n```java\npublic\
  \ static final Map<String, PlaceholderItem> ITEM_MAP = new HashMap<String, PlaceholderItem>();\n\
  \nstatic {\n    // Add 3 sample items.\n    addItem(new PlaceholderItem(\"1\", \"\
  Payload Publishing\", \"https://www.payloadbooks.com\"));\n    addItem(new PlaceholderItem(\"\
  2\", \"Amazon\", \"https://www.amazon.com\"));\n    addItem(new PlaceholderItem(\"\
  3\", \"New York Times\", \"https://www.nytimes.com\"));\n}\n```\n\n代码现在利用修改后的 `PlaceholderItem`\
  \ 类来存储每个项目的 ID、网站名称和 URL。\n\n## 52.6 更改详情面板\n\n详情面板的布局（用户从主列表中选择项目时显示的屏幕）包含在 `activity_item_detail.xml`\
  \ 文件中，该文件又包含一个用于显示实际详情面板的 `FrameLayout` 实例。如果以单面板模式显示，框架容器将显示 `fragment_item_detail.xml`\
  \ 中的布局，而多面板模式将显示 `fragment_item_detail.xml` 布局。\n\nAndroid Studio 为 `fragment_item_detail.xml`\
  \ 提供的模板布局包含一个带有应用栏、工具栏、浮动按钮和文本视图的 `CoordinatorLayout`。对于此示例，我们只需要显示一个 `WebView`，因此请打开此文件，并删除布局中除\
  \ `item_detail_container` 视图以外的所有视图。执行此操作最简单的方法是在按下删除键之前，如所示（此处缺少图片）在组件树（Component\
  \ Tree）中选择所有不需要的视图：\n\n从 Palette 的 Widgets 部分拖入 `WebView` 对象并将其放置在布局中心，然后将 `id`\
  \ 更改为 `website_detail`。接下来，编辑 `fragment_item_detail.xml` 文件，在将 `WebView` 拖入布局之前删除默认的\
  \ `TextView` 实例，并再次将 `id` 更改为 `website_detail`。两个文件的布局现在应该类似于：\n\n## 52.7 修改 ItemFragment\
  \ 类\n\n此时，用户界面详情面板已过修改，但相应的 Java 类仍设计用于处理 `TextView` 而不是 `WebView`。通过双击 Project\
  \ 工具窗口中的 `ItemDetailFragment.java` 文件来加载该类的源码。为了加载当前所选项目对应的网页，需要更改几行代码。完成此更改后，代码应如下：\n\
