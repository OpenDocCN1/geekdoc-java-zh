  \n### 32.7 让工具栏片段与 Activity 通信\n\n当用户触摸工具栏片段中的按钮时，片段类需要从 `EditText` 视图中提取文本以及 `SeekBar`\
  \ 的当前值，并将它们发送给文本片段。如“Android 片段简介”所述，片段之间不应直接相互通信，而是使用它们嵌入的 activity 作为中间介。\n\n\
  此过程的第一步是确保工具栏片段对点击的按钮有响应。我们还需要实现一些代码来跟踪 `SeekBar` 视图的值。对于此示例，我们将在 `ToolbarFragment`\
  \ 类中实现这些监听器。选择 `ToolbarFragment.java` 文件并对其进行修改，如下列表所示：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\
  \n.\n\n.\n\nimport androidx.annotation.NonNull;\n\nimport androidx.annotation.Nullable;\n\
  \nimport android.content.Context;\nimport android.widget.SeekBar;\n\npublic class\
  \ ToolbarFragment extends Fragment implements\n                              SeekBar.OnSeekBarChangeListener\
  \ {\n\n    private static int seekvalue = 10;\n\n...\n\n@Override\n    public void\
  \ onViewCreated(@NonNull View view,\n                             @Nullable Bundle\
  \ savedInstanceState) {\n\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.seekBar1.setOnSeekBarChangeListener(this);\n        binding.button1.setOnClickListener(new\
  \ View.OnClickListener() {\n            public void onClick(View v) {\n        \
  \        buttonClicked(v);\n            }\n        });\n    }\n    public void buttonClicked\
  \ (View view) {\n\n    }\n\n    @Override\n    public void onProgressChanged(SeekBar\
  \ seekBar, int progress,\n                                   boolean fromUser) {\n\
  \      seekvalue = progress;\n    }\n\n    @Override\n    public void onStartTrackingTouch(SeekBar\
  \ arg0) {\n    }\n\n    @Override\n    public void onStopTrackingTouch(SeekBar arg0)\
  \ {\n    }\n}\n```\n\n在继续之前，我们需要花时间解释上面的代码更改。首先，该类被声明实现了 `OnSeekBarChangeListener`\
  \ 接口。这是因为用户界面包含一个 `SeekBar` 实例，片段需要在用户滑动滑条更改字体大小时运行时接收通知。实现 `OnSeekBarChangeListener`\
  \ 接口要求实现 `onProgressChanged()`、`onStartTrackingTouch()` 和 `onStopTrackingTouch()`\
  \ 方法。这些方法已经实现，但只需要 `onProgressChanged()` 方法来执行任务，在这种情况下，即是将新值存储在名为 `seekvalue` 的变量中，该变量在类开始处声明。此外还声明了一个变量来存储\
  \ `EditText` 对象的引用。\n\n添加了 `onViewCreated()` 方法以在按钮上设置 `OnClickListener`，它配置为在检测到点击事件时调用名为\
  \ `buttonClicked()` 的方法。该方法随后也被实现，尽管它没有执行任何操作。\n\n此过程的下一阶段是设置监听器，允许片段在按钮被点击时调用 activity。这遵循上一一章中概述的机制：\n\
  \n```java\npublic class ToolbarFragment extends Fragment\n    implements SeekBar.OnSeekBarChangeListener\
  \ {\n    private static int seekvalue = 10;\n    private FragmentBinding binding;\n\
  \    ToolbarListener activityCallback;\n    public interface ToolbarListener {\n\
  \        public void onButtonClick(int position, String text);\n    }\n    @Override\n\
  \    public void onAttach(Context context) {\n        super.onAttach(context);\n\
  \        try {\n            activityCallback = (ToolbarListener) context;\n    \
  \    } catch (ClassCastException e) {\n            throw new ClassCastException(context.toString()\
  \ + \" must implement ToolbarListener\");\n        }\n    }\n...\n    public void\
  \ buttonClicked (View view) {\n        activityCallback.onButtonClick(seekvalue,\n\
  \        binding.editText1.getText().toString());\n    }\n...\n}\n```\n\n上述实现将导致当用户点击按钮时调用属于\
  \ activity 类的名为 `onButtonClick()` 方法。因此，剩下的工作就是声明 activity 类实现了新创建的 `ToolbarListener`\
  \ 接口并实现 `onButtonClick()` 方法。\n\n由于在早期的 Android 版本中使用 Android Support Library 来支持片段，activity\
  \ 也需要更改为继承自 `FragmentActivity` 而不是 `AppCompatActivity`。汇总这些需求形成了修改后的 `MainActivity.java`\
  \ 文件：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import androidx.fragment.app.FragmentActivity;\nimport android.os.Bundle;\n\npublic\
  \ class MainActivity extends FragmentActivity implements ToolbarListener {\n...\n\
  \    public void onButtonClick(int fontsize, String text) {\n    }\n}\n```\n\n正如目前代码所示，工具栏片段将在用户点击按钮时检测到点击\
  \ 并传递 `EditText` 字段的内容和 `SeekBar` 视图的当前设置。现在 activity 的工作是与文本片段通信，并传递这些值，以便片段相应地更新\
  \ `TextView` 对象。\n\n### 32.8 让 Activity 与文本片段通信\n\n如“Android 片段简介”所述，activity 可以通过获取片段类实例的引用并调用对象的方法与片段通信。因此，在\
  \ `TextFragment` 类中，我们现在实现一个名为 `changeTextProperties()` 的公共方法，它接收一个字体大小整数和一个要显示的新文本字符串。该方法将使用这些值来修改\
  \ `TextView` 对象。在 Android 编辑面板中，找到并修改 `TextFragment.java` 文件以添加此新方法：\n\n```java\n\
  package com.ebookfrenzy.fragmentexample;\n...\npublic class TextFragment extends\
  \ Fragment {\n...\n    public void changeTextProperties(int fontsize, String text)\n\
  \    {\n        binding.textView2.setTextSize(fontsize);\n        binding.textView2.setText(text);\n\
  \    }\n}\n```\n\n当 `TextFragment` 片段放置在 activity 布局中，它被赋予了 `text_fragment` 的 `ID`。通过这个\
  \ ID，activity 现在可以获取片段实例的引用并调用对象上的 `changeTextProperties()` 方法。编辑 `MainActivity.java`\
  \ 文件并如下所示修改 `onButtonClick()` 方法：\n\n```java\npublic void onButtonClick(int fontsize,\
  \ String text) {\n    TextFragment textFragment =\n    (TextFragment) getSupportFragmentById(R.id.text_fragment);\n\
  \    textFragment.changeTextProperties(fontsize, text);\n}\n```\n\n\n\n\n```java\n\
  getSupportFragmentManager().findFragmentById(R.id.text_fragment);\n\ntextFragment.changeTextProperties(fontsize,\
  \ text);\n\n}\n```\n\n### 32.9 测试应用程序\n\n现在该项目的代码工作已经完成，最后一个任务是运行应用程序。当应用程序启动时，主活动（main\
  \ activity）将启动，并创建创建显示两个片段（fragments）。当用户触摸工具栏片段中的按钮时，工具栏片段会调用活动的 `onButtonClick()`\
  \ 方法，并传递来自 `EditText` 视图的文本以及 `SeekBar` 的当前值。随后，活动将调用第二个片段的 `changeTextProperties()`\
  \ 方法，该方法将修改 `TextView` 以反映新的文本和字体大小：\n\n![](img/image_example_running.jpg)\n\n图\
  \ 32-10\n\n### 32.10 总结\n\n本章的目标是通过创建一个示例项目，来演示在 Android 应用程序中使用片段的步骤。涵盖的主题包括：使用\
  \ Android Support 库以兼容引入片段之前的 Android 版本、包括在活动布局中使用片段，以及实现片段间的通信。\n\n## 33 结合 Jetpack\
  \ 的现代 Android 应用架构\n\n多年来，Google 并没有推荐构建 Android 应用的特定方法，而是提供工具和开发工具包，让开发者决定什么方法最适合特定的项目或个人编程风格。这种情况在\
  \ 2017 年 Android 架构组件（Android Architecture Components）的引入后发生了改变，这些组件在 2018 年发布时成为了\
  \ Android Jetpack 的一部分。\n\n本章提供了 Jetpack 概念、Android 应用架构建议以及一些关键架构组件的概述。在涵盖基础知识后，将在后续章节中详细讨论这些主题，并通过实际示例进行演示。\n\
  \n### 33.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 Android Studio、Android 架构组件、Android\
  \ Support 库以及一组建议 Android 应用 应该结构的指南组成。Android 架构组件的设计是为了在开发 Android 应用时更快速、更容易地执行常见任务，同时符合架构指南的核心原则。\n\
  \n虽然本书将涵盖所有的 Android 架构组件，但本章将重点介绍关键的架构指南以及 `ViewModel`、`LiveData` 和 `Lifecycle`\
  \ 组件，同时介绍数据绑定（Data Binding）和存储库（Repositories）。\n\n在继续之前，重要的是理解 Jetpack 应用开发方法是可选的。虽然它强调了多年来流行的其他技术的一些缺点，但\
  \ Google 并没有完全谴责那些应用开发方法。Google 的立场是，虽然开发应用没有正确或错误之分，但有一种推荐的方法。\n\n### 33.2 “旧”架构\n\
  \n在标题为在 Android Studio 中创建 Android 应用示例的章节中，创建了一个包含单一活动的 Android 项目，该活动包含了显示和管理用户界面的所有代码，以及应用程序的后端逻辑。在\
  \ Jetpack 引入之前，最常见的架构遵循这种范式，即应用由多个活动（应用中的每个屏幕对应一个活动）组成，每个活动类在某种程度上都混合了用户界面和后端代码。\n\
  \n这种方法导致了许多与应用生命周期相关的问题（例如，用户每次旋转设备时，活动都会被销毁并重建，导致任何未保存到某种持久化存储形式的应用程序数据丢失），以及如导航效率低下等问题（涉及用户访问的每个应用屏幕都需要启动一个新活动）。\n\
  \n### 33.3 现代 Android 架构\n\n在最基础的层，Google 现在提倡单活动应用，不同的屏幕作为内容加载到同一个活动中。\n\n现代架构指南还建议将应用中不同职责区域划分到完全独立的模块中（这种概念被称为“关注点分离”）。这种方法的关键之一是\
  \ `ViewModel` 组件。\n\n### 33.4 ViewModel 组件\n\n`ViewModel` 的目的是将应用程序与用户界面相关的数据模型和逻辑与负责显示、管理用户界面以及与操作系统交互的代码隔离开。当这样设计时，应用将由一个或多个\
  \ UI 控制器（如活动）以及负责处理这些控制器所需数据的 `ViewModel` 实例组成。\n\n`ViewModel` 只感知数据模型和相应的逻辑。它对用户界面无所知，也不尝试直接访问或响应与用户界面内视图相关的事件。当\
  \ UI 控制器需要数据进行显示时，它请求 `ViewModel` 提供。同样，当用户在用户界面的视图中输入数据时，UI 控制器将其传递给 `ViewModel`\
  \ 进行处理。\n\n这种职责划分解决了与 UI 控制器生命周期相关的问题。无论 UI 控制器在应用生命周期内重建多频繁，`ViewModel` 实例都会保留在内存中，从而保持数据一致性。例如，活动使用的\
  \ `ViewModel` 将一直保留在内存中，直到活动结束，而在单活动应用中，直到程序退出时才会结束。\n\n![](img/jetpack_diagram_1.jpg)\n\
  \n图 33-1\n\n### 33.5 LiveData 组件\n\n考虑一个显示实时数据的应用，例如金融股票的当前价格。应用可以使用股票价格 Web 服务持续更新\
  \ `ViewModel` 中的数据模型以获取最新信息。这些实时数据只有在及时显示给用户时才有用。UI 控制器只有两种方式可以确保在用户界面中显示最新数据。一种方案是控制器持续检查\
  \ `ViewModel` 以判断数据自上次显示以来是否更改。然而，这种方法的问题是效率低下。为了保持数据馈的实时性，UI 控制器必须运行循环，持续检查数据变化。\n\
  \n更好的解决方案是，当 `ViewModel` 中的特定数据项更改时，让 UI 控制器接收通知。这通过使用 `LiveData` 组件实现。`LiveData`\
  \ 是一个数据持有者，允许值变为可观察的。简单来说，可观察对象在数据发生变化时可以通知其他对象，从而解决用户界面始终与 `ViewModel` 中的数据一致的问题。\n\
  \n这意味着，例如，对 `ViewModel` 值感兴趣的 UI 控制器可以设置一个观察者，观察者反会在值变化时被通知。在我们假设的应用中，例如，股票价格将封装在\
  \ `ViewModel` 中的 `LiveData` 对象中，UI 控制器为该值分配一个观察者，声明在值变化时调用的方法。当数据变化触发时，该方法将从 `ViewModel`\
  \ 读取更新后的值并用其更新用户界面。\n\n![](img/Jetpack_diagram_2.jpg)\n\n图 33-2\n\n`LiveData` 实例也可以声明为可变的，允许观察实体更新\
  \ `LiveData` 对象中持有的底层值。例如，用户可能会在用户界面中输入一个值，该值需要覆盖存储在 `ViewModel` 中的值。\n\n\n\n\n\
  使用 LiveData 的另一个关键优势是它可以感知观察者的生命周期状态。例如，如果一个 activity 包含一个 `LiveData` 观察者，相应的 `LiveData`\
  \ 对象将知道 activity 生命周期状态变化的时机并做出相应的响应。如果 activity 被暂停（可能是应用被置于后台），`LiveData` 对象将停止向观察者发送事件。假设\
  \ activity 刚刚启动或在暂停后恢复。在这种情况下，`LiveData` 对象将向观察者发送一个 `LiveData` 事件，以便 activity 获得最新的值。同样，`LiveData`\
  \ 实例会在 activity 被销毁时知道并移除观察者以释放资源。\n\n到目前为止，我们只讨论了 UI 控制器使用观察者的情况。但在实践中，观察者可以用于任何符合\
  \ Jetpack 生命周期周期管理方法的对象内部。\n\n### 33.6 ViewModel 状态保存\n\nAndroid 允许用户将活跃的程序置于后台，并在设备上执行其他任务（包括运行其他应用）后返回程序。当设备资源不足时，操作系统将通过终止后台应用进程来纠正此问题，从最久未使用的应用开始。然而，当用户返回被终止的后台应用时，无论它是否被终止，它都应该以进入后台时的相同状态出现。在与\
  \ `ViewModel` 关联的数据方面，可以使用 `ViewModel Saved State` 模块来实现。该模块允许将值存储在应用的保存状态中，并在发生系统发起的进程终止时进行恢复。此主题将在后的\
  \ “Android ViewModel 状态保存教程” 章节中介绍。\n\n### 33.7 LiveData 与数据绑定\n\nAndroid Jetpack\
  \ 包含了 `Data Binding Library`（数据绑定库），它允许将 `ViewModel` 中的数据直接映射到 XML 用户界面布局文件中的特定视图。在之前创建的\
  \ `AndroidSample` 项目中，必须编写代码来获取 `EditText` 和 `TextView` 视图的引用，并设置和获取文本属性以反映数据变化。数据绑定允许存储在\
  \ `ViewModel` 中的 `LiveData` 值可以直接在 XML 布局文件中被引用，从而避免了编写代码来更新布局视图的需求。\n\n![](img/Jetpack_diagram_3.jpg)\n\
  \n图 33-3\n\n数据绑定将更详细地介绍，从 “Android Jetpack 数据绑定 概述” 章节开始。\n\n### 33.8 Android 生命周期\n\
  \n从 Android 组件创建到其被销毁的时间被称为生命周期。在这一生命周期期间，组件会在不同的生命周期状态之间切换，这通常在操作系统的控制下并响应用户操作。例如，一个\
  \ activity 将从初始化状态开始，过渡到创建状态。一旦 activity 运行，它将切换到启动状态，从该状态开始它将循环经过各种状态，包括创建、启动、恢复和销毁。\n\
  \n许多 Android 框架类和组件允许其他对象访问其当前状态。也可以使用生命周期观察者（Lifecycle observers），以便对象在另一个对象的生命周期状态变化时接收到通知。`ViewModel`\
  \ 组件在后台使用这种技术来识别观察者何时重新启动或被销毁。此功能不仅限于 Android 框架和架构组件。它也可以构建在任何其他使用架构组件的生命周期组件的类中。能够检测并响应生命周期状态的对象被称为生命周期感知（lifecycle-aware）。相比之下，提供其生命周期访问的对象被称为生命周期所有者（lifecycle\
  \ owners）。标题为 “与生命周期感知组件一起工作” 的章节将更详细地介绍生命周期。\n\n### 33.9 仓库模块\n\n如果 `ViewModel`\
  \ 从一个或多个外部源（如数据库或网络服务）获取数据，将代码与 `ViewModel` 分离是非常重要的。毕竟，这样做会违反关注点分离。为了避免将此功能与 `ViewModel`\
  \ 混合，Google 的架构指南建议将此代码放在单独的仓库（repository）模块中。仓库不是 Android 组件，而是由应用开发者创建的 Java 类，负责与各种数据源建立接口。该类随后为\
  \ `ViewModel` 提供接口，允许数据存储在。\n\n### 33.10 总结\n\n直到最近，Google 倾向于不推荐任何特定的应用结构方法。随着\
  \ Android Jetpack 的引入（它由工具、组件、库和架构指南组成），这种情况现在发生了变化。Google 现在建议将应用项目划分为不同的模块，每个模块负责一个特定的功能区域，即所谓的“关注点分离”。特别是，指南建议将应用的\
  \ view model 与处理用户界面的代码分离。此外，负责从数据源收集数据的代码应该构建在单独仓库模块中，而不是与 view model 捆绑。\n\nAndroid\
  \ Jetpack 包含了 Android 架构组件，旨在使开发符合指南的应用变得更容易。本章引入了 `ViewModel`、`LiveData` 和 Lifecycle\
  \ 组件。这些将在从下一章开始进行更详细的介绍。\n\n# 34. Android ViewModel 教程\n\n上一章介绍了了 Android Jetpack\
  \ 的基本概念，并概述了现代应用架构的基础知识。为了帮助强化和澄清上一章中提供的信息，本章将逐步演示创建一个使用 `ViewModel` 组件的示例应用项目。下一章将通过包含\
  \ `LiveData` 和数据绑定支持来进一步增强此示例。\n\n### 34.1 关于项目\n\n在标题为 “在 Android Studio 中创建示例\
  \ Android 应用” 的章节中，创建了一个名为 `AndroidSample` 的项目，其中应用的所有代码都封装在主 `Activity` 类文件中。在接下来的章节中，创建并使用了\
  \ AVD 模拟器来运行应用。在应用运行时，我们亲身体验了以这种方式开发应用时，在设备旋转期间 `TextView` 小部件显示的数据会丢失的问题。\n\n本章将实现相同的货币转换器应用，使用\
  \ `ViewModel` 组件并遵循 Google 应用架构指南，以避免 `Activity` 生命周期带来的复杂性。\n\n### 34.2 创建 ViewModel\
  \ 示例项目\n\n在创建 `AndroidSample` 项目时，选择了 `Empty Views Activity` 模板作为项目基础。然而，本项目将使用\
  \ `Basic Views Activity` 模板。\n\n从欢迎屏幕选择 New Project 选项，并在出现的新项目对话框中选择 `Basic Views\
  \ Activity` 模板，然后点击 Next 按钮。\n\n\n\n\n\n在 `Name` 字段中输入 `ViewModelDemo`，并指定 `com.ebookfrenzy.viewmodeldemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26`：`Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单改为 `Java`。\n\n### 34.3 移除不需要的项目元素\n\n如 “Android Studio 布局编辑器指南” 所示，`Basic\
  \ Views Activity` 模板包含了并非所有项目都需要的功能。在向项目添加 `ViewModel` 之前，我们首先需要按照以下步骤移除导航功能、第二个内容片段和浮操作按钮：\n\
  \n1. 在 `Project` 工具窗口中双击 `activity_main.xml` 布局文件，选择浮操作按钮，并按下键盘上的删除键（delete）从布局中移除该对象。\n\
  2. 编辑 `MainActivity.java` 文件，并从 `onCreate` 方法中移除浮操作按钮的代码，如下所示：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    .\n    .\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                    .setAnchorView(R.id.fab)\n                    .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n3. 在 `Project` 工具窗口中，导航并双击\
  \ `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n4. 在编辑器中，选择图面板中的\
  \ `SecondFragment` 条目，并按下键盘上的删除键将其从图中移除。\n5. 找到并删除 `SecondFragment.java` 和 `fragment_second.xml`\
  \ 文件。\n6. 最后一项任务是从 `FirstFragment` 类中移除一些代码，使得 `Button` 视图在点击时不再导航到已不存在的第二个片段。编辑\
  \ `FirstFragment.java` 文件，并移除 `onViewCreated()` 方法中的代码，使其读取内容如下：\n\n```java\npublic\
  \ void onViewCreated(@NonNull View view, Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    binding.buttonFirst.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                    .navigate(R.id.action_FirstFragment_to_SecondFragment);\n \
  \       }\n    });\n}\n```\n\n### 34.4 设计片段布局\n\n下一步是设计片段的布局。首先，在 `Project` 工具窗口中找到\
  \ `fragment_first.xml` 文件并双击它将其加载到布局编辑器中。布局加载后，选择并删除现有的 `Button`、`TextView` 和 `ConstraintLayout`\
  \ 组件。接下来，在 `Component Tree`（组件树）面板中右键点击 `NestedScrollView` 实例，并选择 `Convert NestedScrollView\
  \ to ConstraintLayout` 菜单选项，如 图 34-1 所示，并在生成的对话框中接受默认设置：\n\n![](img/as_convert_to_constaintlayout.jpg)\n\
  \n图 34-1\n\n选择已转换的 `ConstraintLayout` 组件，并使用 `Attributes` 工具窗口将 `id` 改为 `constraintLayout`。\n\
  \n添加一个新的 `TextView`，将其放置在布局中心，并将 `id` 改为 `resultText`。接下来，从调色板中拖入一个 `Number (Decimal)`\
  \ 视图并将其放置在现有 `TextView` 之上。在布局中选中该视图，参考 `Attributes` 工具窗口并将 `id` 改为 `dollarText`。\n\
  \n将一个 `Button` 控件拖到布局中，放置在 `TextView` 下方，并将 `text` 属性更改为“Convert”。在按钮仍被选中状态下，将 `id`\
  \ 属性更改为 `convertButton`。此时，布局应该类似于图 34-2 所示所示（注意这三个视图已使用垂直链进行了约束）：\n\n![](img/as_view_model_demo_ui.jpg)\n\
  \n图 34-2\n\n最后，点击布局编辑器右上角的警告图标，并将硬编码字符串转换为资源。\n\n## 34.5 实现 View Model\n\n用户界面布局完成后，需要在\
  \ view model 中创建应用的数据模型。首先在 `Project` 工具窗口中找到 `com.ebookfrenzy.viewmodeldemo` 项，右键点击它并选择\
  \ `New -> Class` 。将类命名为 `MainViewModel` 并按回车。编辑新类使其内容如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.main;\n\
  import androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    private Float result = 0F;\n\n    public void setAmount(String value)\
  \ {\n        this.dollarText = value;\n        result = Float.parseFloat(dollarText)*rate;\n\
  \    }\n\n}\n```\n\n该类声明了变量来存储当前的美元字符串值以及转换后的金额，并提供了 getter 和 setter 方法以访问这些值。调用时，`setAmount`\
  \ 方法接收一个值并赋值给 `dollarText`，然后计算 `result = Float.parseFloat(dollarText)*rate`。\n\n\
  （注：此处原文代码缺少一个闭大括号，已按原文逻辑保留）\n\n该类声明了变量来存储当前的美元字符串值以及转换后的金额，并提供了 getter 和 setter\
  \ 方法以访问这些值。调用时，`setAmount` 方法接收一个值并赋值给 `dollarText`，然后计算 `result = Float.parseFloat(dollarText)*rate`。\n\
  \n## 34.6 将片段与 View Model 关联\n\n片段需要某种方式获取 `ViewModel` 的引用以便访问模型并观察。`Fragment` 或\
  \ `Activity` 使用 `ViewModelProvider` 实例来维护其依赖的 `ViewModels`。\n\n在 `Fragment` 内部使用\
  \ `ViewModelProvider` 类创建 `ViewModelProvider` 实例。调用时，构造函数传递了当前 `Fragment` 的引用，结果如下：\n\
  \n```java\nViewModelProvider viewModelProvider = new ViewModelProvider(this);\n\
  ```\n\n一旦创建了 `ViewModelProvider` 实例，可以使用索引值请求特定的 `ViewModel` 类。提供者将创建该 `ViewModel`\
  \ 类的新实例或返回现有实例，例如：\n\n```java\nViewModel viewModel = viewModelProvider.get(MainViewModel.class);\n\
  ```\n\n编辑 `FirstFragment.java` 文件并重写 `onCreate()` 方法以设置 `ViewModelProvider`：\n\n\
  ```java\n...\nimport androidx.lifecycle.ViewModelProvider;\nimport androidx.annotation.Nullable;\n\
  ...\npublic class FirstFragment extends Fragment {\n    private MainViewModel viewModel;\n\
  ...\n    @Override\n    public void onCreate(@Nullable Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        viewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \    }\n}\n```\n\n### 34.7 修改片段\n\n片段类需要更新以响应按钮点击并与 `ViewModel` 中存储的数据值进行交互。该类还需要用户界面布局中三个视图的引用，以便响应按钮点击、提取当前的美元值并显示转换后的货币金额。\n\
  \n\n\n\n\n在标题为在 Android Studio 中创建一个示例 Android 应用程序”的章节中，`Button` 控件的 `onClick`\
  \ 属性被用于指定用户点击按钮时要调用的方法。遗憾的是，此属性只能调用 `Activity` 上的方法，而不能用于调用 `Fragment` 中的方法。为了克服这一局限性，我们必须在\
  \ `Fragment` 类中添加一些代码，在按钮上设置 `onClick` 监听器。这可以在 `FirstFragment.java` 文件的 `onViewCreated()`\
  \ 周期方法中实现，如下文所示：\n\n```java\npublic class MainFragment extends Fragment {\n    private\
  \ MainViewModel viewModel;\n\n    @Override\n    public void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view,\
  \ savedInstanceState);\n        binding.convertButton.setOnClickListener(v -> {\n\
  \        });\n    }\n}\n```\n\n添加监听器后，每当用户点击按钮时，放在 `onClick()` 方法中的任何代码都会被调用。\n\n\
  ### 34.8 访问 ViewModel 数据\n\n当点击按钮时，`onClick()` 方法需要从 `EditText` 视图中读取当前值，确认该字段为空，然后调用\
  \ `ViewModel` 实例的 `setAmount()` 方法。随后，该方法需要调用 `ViewModel` 的 `getResult()` 方法，并在\
  \ `TextView` 控件上显示转换后的值。\n\n由于项目尚未使用 `LiveData`，因此在每次创建 `Fragment` 时，也有必要从 `ViewModel`\
  \ 获取最新的结果值。\n\n继续留在 `FirstFragment.java` 文件中，在 `onViewCreated()` 方法中按如下方式实现这些需求：\n\
  \n```java\nimport java.util.Locale;\n\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            viewModel.getResult()));\n    binding.convertButton.setOnClickListener(v\
  \ -> {\n        if (!binding.dollarText.getText().toString().equals(\"\")) {\n \
  \           viewModel.setAmount(String.format(Locale.ENGLISH,\"%s\",\n         \
  \           binding.dollarText.getText()));\n            binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n                    viewModel.getResult()));\n        } else {\n      \
  \      binding.resultText.setText(\"No Value\");\n        }\n    });\n}\n```\n\n\
  ### 34.9 测试项目\n\n完成此项目开发阶段后，在模拟器或物理设备上构建并运行应用，输入美元金额并点击 `Convert` 按钮。转换后的金额应该出现在\
  \ `TextView` 上，这表明 UI 控制器和 `ViewModel` 的重构按预期工作。\n\n当运行原始的 `AndroidSample` 应用时，旋转设备会导致\
  \ `resultText` `TextView` 控件上显示的值丢失。现在对 `ViewModelDemo` 应用重此此测试，并注意在旋转后当前的欧元值被保留了。这是因为当\
  \ `Fragment` 被销毁和重建时，`ViewModel` 仍然留在内存中，并且我们在 `onViewCreated()` 方法中添加了代码，以便在每次\
  \ `Fragment` 重启时使用 `ViewModel` 的结果数据值更新 `TextView`。\n\n虽然这是对原始 `AndroidSample` 应用的改进，但通过使用\
  \ `LiveData` 和数据绑定，可以做更多工作来简化项目，这两者都是后续章节的主题。\n\n### 34.10 总结\n\n在本章中，我们重新回顾了书中之前创建的\
  \ `AndroidSample` 项目，并创建了一个符合 Android Jetpack 架构指南的新版本项目。示例项目还演示了使用 `ViewModels`\
  \ 将数据处理与用户界面相关的代码分离。最后，本章展示了 `ViewModel` 方法如何避免处理 `Fragment` 和 `Activity` 生命周期产生的问题。\n\
