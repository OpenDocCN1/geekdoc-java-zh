  \nClipData dragData = new ClipData(\n    ((PlaceholderContent.PlaceholderItem) v.getTag()).website_name,\n\
  \    new String[]{ClipDescription.MIMETYPE_TEXT_PLAIN},\n    clipItem\n);\n```\n\
  \n## 52.9 添加 Manifest 权限\n\n最后一步是通过 manifest 文件为应用程序添加互联网权限。这将使 `WebView` 对象能够访问互联网并下载网页。在\
  \ Project 工具窗口（app -> manifests）中导航并加载 `AndroidManifest.xml` 文件，然后双击它将其加载到编辑器中。加载后，在文件中添加相应的权限行：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.PrimaryDetailflow\"\
  \ >\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\n\
  \        android:allowBackup=\"true\"\n```\n\n## 52.10 运行应用程序\n\n在配置良好的模拟器或已连接的\
  \ Android 设备上编译并运行应用程序。根据显示屏的大小，应用程序将以小屏模式或双窗格模式显示。无论如何，主列表都应该准备好内容模型中定义的三个网站的名称。选择一个项目将导致相应的网站出现在详情窗格中，如图\
  \ 52-6 中的双窗格模式所示：\n\n![](img/as_primary_detail_running.jpg)\n\n图 52-6\n\n## 52.11\
  \ 总结\n\n主/详情用户界面由主项目列表组成，当选择某一项时，详情窗格会显示关于该选择的额外信息。主/详情流（Primary/Detail Flow）是 Android\
  \ Studio 提供的一个模板，允许快速且相对轻松地创建主/详情布局。如本章所示，通过对默认模板文件进行细微修改，就可以以极少的编码和设计工作实现广泛基于主/详情的功能。\n\
  \n## 53. Android Service 概述\n\nAndroid Service 类旨在允许应用程序启动并执行后台任务。与旨在快速执行任务后退出的广播接收器（broadcast\
  \ receivers）不同，服务的设计目标是为了执行需要长时间才能完成的任务（例如通过互联网连接下载文件或向用户流式传输音乐），但不需要用户界面。\n\n本章将提供可用服务的概述，包括绑定服务（bound\
  \ services）和意图服务（intent services）。涵盖这些基础知识后，后续章节将通过一些服务运行的示例。\n\n### 53.1 Intent\
  \ Service\n\n如前所述，服务默认在与启动它的组件相同的主线程中运行。因此，任何需要由服务执行的 CPU 密集型任务都应该在新线程中进行，从而避免对调用应用程序性能的影响。\n\
  \n`JobIntentService` 类是一个便利类（派生自 `Service` 类），它设置了一个工作线程来处理后台任务，并异步地处理每个请求。一旦服务处理了所有队列中的请求，它就会退出。使用\
  \ `JobIntentService` 类时，只需要实现 `onHandleWork()` 方法，该方法包含为每个请求要执行的代码。\n\n对于不需要同步处理请求的服务，`JobIntentService`\
  \ 是推荐的选项。然而，需要同步处理请求的服务将需要派自 `Service` 类，并手动实现和管理线程，以高效地处理任何 CPU 密集型任务。\n\n### 53.2\
  \ Bound Service\n\n绑定服务（bound service）允许启动组件与服务交互并接收其结果。这种交互也可以通过实现进程间通信（IPC）跨越进程边界发生。例如，一个\
  \ activity 可能会启动一个服务来处理音频播放。该 activity 可能会包含一个用户界面，为用户提供暂停播放或跳到下一曲的控制控件。同样，服务可能需要向调用的\
  \ activity 通信信息，指示当前音频轨道已结束，并提供即将播放的下一曲的详情。\n\n组件（在此上下文中称为客户端）通过调用 `bindService()`\
  \ 方法启动并绑定到绑定服务。此外，多个组件可能同时绑定到某个服务。当客户端不再需要该服务绑定时，应该调用 `unbindService()` 方法。当最后一个绑定的客户端从服务解绑时，Android\
  \ 运行时系统将终止该服务。需要注意的是，绑定服务也可以通过调用 `startService()` 启动。一旦启动，组件就可以通过 `bindService()`\
  \ 调用绑定到它。当通过 `startService()` 启动绑定服务时，即使在最后一个客户端从其解绑后，它仍将继续运行。\n\n绑定服务必须包含 `onBind()`\
  \ 方法的实现，该方法在服务首次创建时以及其他客户端随后绑定到正在运行的服务时都会被调用。此方法的目的是向绑定客户端返回一个类型为 `IBinder` 的对象，包含了通信所需的信息。\n\
  \n在实现客户端和服务之间的通信时，推荐的技术取决于客户端和服务是否位于相同的进程或不同的进程中。本地通信可以通过扩展 `Binder` 类并从 `onBind()`\
  \ 方法返回一个实例来实现。另一方面，进程间通信需要 `Messenger` 和 `Handler`。这两种方法的详细细节将在后面的章节中介绍。\n\n###\
  \ 53.3 Service 的结构\n\n如前所述，服务必须创建为 Android Service 类（更具体说是 `android.app.Service`）或其子类（例如\
  \ `android.app.IntentService`）的子类。在派生过程中，根据所创建服务的性质，必须重写以下一个或多个回调方法：\n\n- `onStartCommand()`\
  \ – 当另一个组件通过调用 `startService()` 启动服务时调用。绑定服务不需要实现此方法。\n- `onBind()` – 当组件通过调用 `bindService()`\
  \ 绑定到服务时调用。在实现绑定服务时，此方法必须返回一个用于通信的 `IBinder` 对象。\n- `onCreate()` – 旨在作为初始化任务的地方，该方法在调用\
  \ `onStartCommand()` 或首次调用 `onBind()` 之前立即调用。\n- `onDestroy()` – 在服务销毁时调用。\n- `onHandleWork()`\
  \ – 仅适用于 `JobIntentService` 子类。该方法被调用以处理服务。它在独立于主应用程序的线程中执行。\n\n注意 `IntentService`\
  \ 类包含了了自己的 `onStartCommand()` 和 `onBind()` 回调实现，因此子类中不需要实现它们。\n\n### 53.4 控制销毁服务的重启选项\n\
  \n`onStartCommand()` 回调方法需要返回一个整数值，以定义当 Android 运行时系统销毁服务时发生。方法的可能返回值如下：\n\n- `START_NOT_STICKY`\
  \ – 告诉系统，如果服务被销毁，除非有等待交付的意图，否则不要重启它。\n\n\n\n\n\n- `START_STICKY` – 表示如果服务在 `onStartCommand()`\
  \ 方法返回后被销毁，则应尽快重启该服务。如果没有待传递的意图（intent），将调用 `onStartCommand()` 回调方法并传入 `NULL` 意图值。服务被销毁时正在处理的意图将被丢弃。\n\
  - `START_REDELIVER_INTENT` – 表示如果服务从 `onStartCommand()` 回调方法返回后被销毁，则应该重启服务，并将当前意图重新投递到\
  \ `onStartCommand()` 方法，随后传递任何待处理的意图。\n\n## 53.5 在清单文件中声明服务\n\n为了使服务可用，必须首先在清单文件（manifest\
  \ file）中进行声明。这涉及在现有的 `<application>` 条目中嵌入一个配置适当的 `<service>` 元素。至少，`<service>`\
  \ 元素必须包含一个声明服务类名的属性，如下所示 XML 片段所示：\n\n```xml\n<manifest>\n    <application\n   \
  \     android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \ >\n        <activity\n            android:label=\"@string/app_name\"\n       \
  \     android:name=\".MainActivity\" >\n            <intent-filter>\n          \
  \      <action android:name=\"android.intent.action.MAIN\" />\n                <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n\
  \        </activity>\n        <service android:name=\".MyService\">\n        </service>\n\
  \    </application>\n</manifest>\n```\n\n默认情况下，服务声明是公开的，这意味着它们可以被所在应用程序包之外的组件访问。要将服务设置为私有，必须在清单文件的\
  \ `<service>` 元素中将 `android:exported` 属性声明为 `false`。例如：\n\n```xml\n<service android:name=\"\
  MyService\"\n         android:exported=\"false\">\n</service>\n```\n\n在使用 `JobIntentService`\
  \ 时，清单中的服务声明还必须请求 `BIND_JOB_SERVICE` 权限，如下：\n\n```xml\n<service\n    android:name=\"\
  .MyJobIntentService\"\n    android:permission=\"android.permission.BIND_JOB_SERVICE\"\
  \ />\n```\n\n如前所述，服务默认在调用组件相同的进程中运行。要强制服务在自己的进程中运行，请为 `<service>` 元素添加 `android:process`\
  \ 属性，并声明一个以冒号（`:`）开头的进程名：\n\n```xml\n<service android:name=\".MyService\"\n    android:exported=\"\
  false\"\n    android:process=\":myprocess\">\n</service>\n```\n\n冒号前缀表示新进程对本地应用程序私有。然而，如果进程名是以小写字母而不是冒号开头，该进程将是全局的，并供其他组件使用。\n\
  \n最后，通过与 Activity 相同的意图过滤器机制，服务也可以向运行在设备上的其他应用程序发布功能。有关意图过滤器的更多细节，请参阅“Android 意图概述章节。\n\
  \n## 53.6 系统启动时运行的服务\n\n考虑到服务的后台性质，在基于 Android 系统首次启动时需要启动服务并不罕见。这可以通过创建一个广播接收器，并配置意图过滤器来监听系统的\
  \ `android.intent.action.BOOT_COMPLETED` 意图来实现。当检测到此类意图时，广播接收器将调用必要的服务然后返回。请注意，为了运行，此类广播接收器必须请求\
  \ `android.permission.RECEIVE_BOOT_COMPLETED` 权限。\n\n### 53.7 总结\n\nAndroid 服务是一种强大的机制，允许应用程序在后台执行任务。服务一旦启动，无论调用应用程序是否为前台任务，即使启动服务的组件被销毁，它也会继续运行。\n\
  \n服务是继承自 `Android Service` 类的子类。绑定服务（Bound services）为其他客户端组件提供了通信接口，并且通常一直运行到最后一个客户端从服务解绑为止。\n\
  \n默认情况下，服务在与调用应用程序相同的进程和主线程中本地运行。因此，应该在服务内部创建一个新线程来处理 CPU 密集型任务。通过对应用程序清单文件中的相应\
  \ `<service>` 条目进行微小的配置更改，可以在单独的进程中启动远程服务。`IntentService` 类（`Android Service` 的子类）在独立线程中处理异步请求提供了一种方便的机制。\n\
  \n\n\n\n可以通过调用 `intent` 对象的 `putExtra()` 方法，在启动 `intent` 之前将数据添加，并传输到接收活动中。数据必须以键值对的形式添加。以下代码扩展了之前的示例，分别向\
  \ `intent` 中添加了键名为 `\"myString\"` 和 `\"myInt\"` 的 `String` 值和整数值：\n\n```java\nIntent\
  \ i = new Intent(this, ActivityB.class);\ni.putExtra(\"myString\", \"This is a message\
  \ for ActivityB\");\ni.putExtra(\"myInt\", 100);\nstartActivity(i);\n```\n\n目标活动作为\
  \ `Bundle` 对象的一部分接收数据，该对象可以通过调用 `getIntent().getExtras()` 获取。`Activity` 类的 `getIntent()`\
  \ 方法返回启动该活动的 `intent`，而 `Intent` 类的 `getExtras()` 方法则返回一个包含数据的 `Bundle` 对象。例如，要提取传递给\
  \ `ActivityB` 的数据值：\n\n```java\nBundle extras = getIntent().getExtras();\nif (extras\
  \ != null) {\n    String myString = extras.getString(\"myString\");\n    int myInt\
  \ = extras.getInt(\"myInt\");\n}\n```\n\n当在同一应用程序中使用意图启动其他活动时，这些活动必须在应用程序清单文件中列出。以下\
  \ `AndroidManifest.xml` 内容为一个包含名为 `ActivityA` 和 `ActivityB` 的应用程序进行了正确配置：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.intent1.intent1\" >\n    <application\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\" >\n        <activity\n\
  \            android:label=\"@string/app_name\"\n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity\n   \
  \         android:name=\"ActivityB\"\n            android:label=\"ActivityB\" >\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n## 54.3 从活动返回数据\n\n\
  如上一节的示例所示，虽然数据传输到了 `ActivityB`，但没有办法将数据返回给第一个活动（我们称之为 `ActivityA`）。然而，这可以通过启动 `ActivityB`\
  \ 成为 `ActivityA` 的子活动来实现。通过创建 `ActivityResultLauncher` 实例可以将活动启动为子活动。`ActivityResultLauncher`\
  \ 实例是通过调用 `registerForActivityResult()` 方法创建的，并以 lambda 形式传递回调处理器。当子活动返回时，该处理器将被调用并传递返回的数据。一旦创建了\
  \ `ActivityResultLauncher` 实例，就可以带上 `intent` 参数调用它启动子活动。创建 `ActivityResultLauncher`\
  \ 实例的代码通常如下所示：\n\n```java\nActivityResultLauncher<Intent> startForResult = registerForActivityResult(\n\
  \    new ActivityResultContracts.StartActivityForResult(),\n    new ActivityResultCallback<ActivityResult>()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 处理返回数据的代码\n        \
  \    }\n        }\n    });\n```\n\n一旦启动器准备就，就可以如下方式调用并传递要启动的 `intent`：\n\n```java\n\
  Intent i = new Intent(this, ActivityB.class);\nstartForResult.launch(i);\n```\n\n\
  要将数据返回给父活动，子活动必须实现 `finish()` 方法，该方法的目的是创建一个包含数据的新 `intent` 对象，然后调用封装的活动的 `setResult()`\
  \ 方法，传递结果代码和包含返回内容的 `intent`。结果代码通常是 `RESULT_OK` 或 `RESULT_CANCELED`，但也可以根据开发者的需求自定义值。如果子活动崩溃，父活动将接收到\
  \ `RESULT_CANCELED` 码。例如，以下代码说明了典型子活动 `finish()` 方法的代码：\n\n```java\npublic void\
  \ finish() {\n    Intent data = new Intent();\n    data.putExtra(\"returnString\"\
  , \"Message to parent activity\");\n    setResult(RESULT_OK, data);\n    super.finish();\n\
  }\n```\n\n### 54.4 隐式意图\n\n与引用要启动的活动类名的显式意图不同，隐式意图通过指定要执行的操作和接收活动要处理的数据类型来标识要启动的活动。例如，`ACTION_VIEW`\
  \ 类型的的操作配以 `URI` 对象形式的网页 URL，将指示 Android 系统搜索并随后启动一个具有网络访问能力的活动。以下隐式意图在 Android\
  \ 设备上执行时，将导致指定的网页在浏览器活动中显示：\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\
  \ Uri.parse(\"https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n```\n\n\
  当活动发布上述隐式意图时，Android 系统将搜索设备上具有处理 HTTP 数据的 `ACTION_VIEW` 请求能力的活动，这一过程被称为意图解析。在系统使用隐式意图启动活动之前，用户必须验证或启用该活动。如果没有满足这些条件之一，意图将无法启动活动。在探索这两个选项之前，我们首先讨论意图过滤器。\n\
  \n## 54.5 使用意图过滤器\n\n意图过滤器是活动宣告支持的操作和数据处理能力的机制。这些声明还包含了链接验证所需的设置。以下 `AndroidManifest.xml`\
  \ 文件说明了名为 `MyWebView` 的应用中名为 `WebActivity` 的活动的配置，其包含了适当配置的意图过滤器：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<application\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:roundIcon=\"@mipmap/ic_launcher_round\"\n    android:supportsRtl=\"\
  true\"\n    android:theme=\"@style/Theme.MyWebView\">\n    <activity\n        android:name=\"\
  WebActivity\"\n        android:exported=\"true\">\n        <intent-filter android:autoVerify=\"\
  true\">\n            <action android:name=\"android.intent.action.VIEW\" />\n  \
  \          <category android:name=\"android.intent.category.BROWSABLE\" />\n   \
  \         <category android:name=\"android.intent.category.DEFAULT\" />\n      \
  \      <data android:scheme=\"https\" />\n            <data android:host=\"www.ebookfrenzy.com\"\
  />\n        </intent-filter>\n    </activity>\n</application>\n```\n\n\n\n使用 Web\
  \ 链接启动 Android 设备上的活动被认为存在潜在的安全风险。为了降低这种风险，用于启动意图的链接必须是经过自动验证，或者由用户在设备上手动将其添加为支持的链接。要启用自动验证，目标\
  \ Activity 中相应的意图声明必须将 `autoVerify` 设置为 `true`，如下所示：\n\n```xml\n<intent-filter android:autoVerify=\"\
  true\">\n\n.\n\n.\n\n</intent-filter>\n```\n\n接下来，链接 URL 必须与应用链接所在的网站建立关联。这是通过创建一个名为\
  \ `assetlinks.json` 的数字资产链接文件并将其安装网站的 `.well-known` 文件夹中来实现。\n\n数字资产链接文件包含一个关系声明（relation\
  \ statement），用于允许目标应用使用网站的链接 URL 启动，以及一个目标声明（target statement），用于声明伴侣应用的包名和该项目的\
  \ `SHA-256` 证书指纹。一个典型的资产链接文件可能如下所示：\n\n```json\n[{\n  \"relation\": [\"delegate_permission/common.handle_all_urls\"\
  ],\n  \"target\": {\n    \"namespace\": \"android_app\",\n    \"package_name\":\
  \ \"com.ebookfrenzy.mywebview\",\n    \"sha256_cert_fingerprints\": [\n      \"\
  <your certificate fingerprint here>\"\n    ]\n  }\n}]\n```\n\n注意，你可以手动创建此文件，也可以使用以下\
  \ URL 提供的在线工具生成它：\n\n`https://developers.google.com/digital-asset-links/tools/generator`\n\
  \n在与 Android 一工作时，`namespace` 值始终设置为 `android_app`，而包名对应于由意图启动的应用包名。最后，证书指纹是构建应用时使用的哈希值。当你测试应用时，这将是包含\
  \ `debug.keystore` 文件中的调试证书。在 Windows 系统上，Android Studio 将此文件存储在以下位置：\n\n`\\Users\\\
  <your user name>\\.android\\debug.keystore`\n\n在 macOS 和 Linux 系统上，可以在此处找到该文件：\n\
  \n`$HOME/.android/debug.keystore`\n\n一旦找到该文件，可以在终端或命令提示符窗口中运行以下命令获取 `SHA 256` 指纹：\n\
  \n```bash\nkeytool -list -v -keystore <path to debug.keystore file here>\n```\n\n\
  当提示密码时，输入 `android`，之后将出现输出，包括 `SHA 256` 指纹：\n\nCertificate fingerprints:\nSHA1:\
  \ 11:E8:66:11:B6:94:3D:AA:7E:50:63:99:77:B8:6A:90:FF:B6:9C:6D\nSHA256: 7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29\n\
  \n当你准备好构建应用的发布版本时，你必须确保已将发布版的 `SHA 256` 指纹添加到资产文件中。生成发布版 keystore 文件的详情请参见“创建、测试和上传\
  \ Android App Bundle”章节。获取发布版 keystore 文件后，运行上面的 `keytool` 命令来访问指纹。\n\n一旦将数字资产文件放置在网站上的正确位置，请在设备或模拟器上安装应用并等待\
  \ 30 秒以验证链接。要检查验证状态，请在命令或终端提示符中运行以下命令：\n\n```bash\nadb shell pm get-app-links --user\
  \ cur com.example.mywebview\n```\n\n结果输出应包含对链接已验证的确认：\n\n```text\ncom.example.mywebview:\n\
  \    ID: 0e399bca-bf58-4cfc-8c7b-d1a6c3b065ec\n    Signatures: [7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29]\n\
  \    Domain verification state:\n      www.ebookfrenzy.com: verified\n    User 0:\n\
  \      Verification link handling allowed: true\n      Selection state:\n      \
  \  Disabled:\n          www.ebookfrenzy.com\n```\n\n你也可以在设备或模拟器上的 `Settings` 应用内通过以下步骤检查状态：\n\
  \n1. 启动 `Settings` 应用。\n2. 从主列表中选择 `Apps`。\n3. 从已安装的应用列表中找到并选择你的应用。\n4. 在应用的设置页面上，选择\
  \ `Open by Default` 选项。\n\n在应用的设置页面上选择 `Open by Default` 选项。\n\n显示后，该页面应指示链接已验证，如图\
  \ 54-1 所示：\n\n![](img/as_verified_link)\n\n要查看哪些链接已验证，点击上图所示的按钮显示以下面板：\n\n![](img/as_verified_links)\n\
  \n`assetlinks.json` 文件可以包含多个资产链接，允许单个网站关联多个应用。\n\n### 54.7 手动启用链接\n\n如果无法使用上述方法自动验证链接，唯一的选项是请求用户手动启用链接。这涉及到启动\
  \ `Open by Default` 屏幕。由于突然出现 `Open by Default` 屏幕可能会让用户感到困惑，建议显示对话框。为了提供启用链接选项，需要执行以下代码：\n\
  \n```java\n// 此处为显示启用链接的对话框\nIntent intent = new Intent(Settings.ACTION_OPEN_DEFAULT_SETTINGS,\n\
  \    Uri.parse(\"package:com.example.mywebview\"));\nstartActivity(intent);\n```\n\
  \n上述示例将显示 MyWebView 应用的 Open by Default 设置屏幕，用户可以点击 `Add Link` 按钮：\n\n![](img/as_add_link)\n\
  \n点击后，将显示带有传入意图链接的对话框，如图 54-4 所示：\n\n![](img/adding_link)\n\n### 54.8 检查检查可用性\n\n\
  假设活动适用于特定的意图通常是不明智的，特别是缺少匹配项通常会导致应用程序崩溃。幸运的是，可以在发送到运行时系统之前识别活动的可用性。可以使用以下方法识别特定意图类型的活动可用性：\n\
  \n```java\npublic static boolean isIntentAvailable(Context context, String action)\
  \ {\n    final PackageManager packageManager = context.getPackageManager();\n  \
  \  final Intent intent = new Intent(action);\n    List<ResolveInfo> list = packageManager.queryIntentActivities(intent,\n\
  \        PackageManager.MATCH_DEFAULT_ONLY);\n    return list.size() > 0;\n}\n```\n\
  \n### 54.9 总结\n\nIntent 是 Android Activity 启动另一个 Activity 的消息机制。显式意图通过类名引用接收 Activity\
  \ 来启动特定的 Activity。显式意图通常（但不限于）用于同一应用程序内的 Activity。隐式意图指定要执行的操作和要处理的数据类型，并让 Android\
  \ 运行时找到匹配的 Activity。\n\n在使用隐式意图时，安全限制要求在启动意图之前，用户必须自动验证或手动启用意图目标应用。自动验证涉及在链接 URL\
  \ 对应的网站上放置数字资产链接文件。\n\n\n\n\n\nActivity 可以将数据封装成键值对并放入 `intent` 对象，从而将数据发送给接收 Activity。只有当\
  \ Activity 作为发送 Activity 的子活动启动时，才能从该 Activity 返回数据。\n\nActivity 通过在应用程序清单文件中指定意图过滤器（intent\
  \ filters），向 Android 意图解析过程声明功能。发送和接收 Activity 都必须请求适当的权限以执行访问设备联系人数据库或互联网等任务。\n\
  \n在涵盖了意图理论之后，接下来的章节将通过在 Android Studio 中创建示例，将显式意图和隐式意图付诸实践。\n\n# 55. Android 显式意图\
  \ – 实例演示\n\n标题为“意图概述” 的章节涵盖了使用意图启动 Activity 的理论。本章将通过创建一个示例应用程序将该理论付诸实践。\n\n在本章中创建的\
  \ Android Studio 应用项目将演示使用显式意图启动 Activity，包括在发送和接收 Activity 之间传输数据。下一章（“Android\
  \ 隐式意图 – 实例演示”）将演示使用隐式意图。\n\n## 55.1 创建显式意图示例应用程序\n\n从欢迎界面选择 `New Project` ，在生成的生成项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `ExplicitIntent` 并指定包名为\
  \ `com.ebookfrenzy.explicitintent`。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API\
  \ 26: Android 8.0 (Oreo)`并将语言菜单设置为 `Java`。按照节 11.8 将项目迁移到 View Binding 中列出的步骤，将项目转换为使用\
  \ view binding。\n\n## 55.2 设计 MainActivity 的用户界面布局\n\n`MainActivity` 的用户界面将由一个包含\
  \ `EditText`（纯文本）、`TextView` 以及命名为 `editText1`、`textView1` 和 `button1` 的 `Button`\
  \ 视图的 `ConstraintLayout` 组成。使用 Project 工具窗口找到 MainActivity 的 `activity_main.xml`\
  \ 资源文件（位于 `app -> res -> layout` 下），双击它将其加载到 Android Studio 布局编辑器工具。选择默认的“Hello\
  \ World!” `TextView` 并使用 `Attributes` 工具窗口为其分配 ID `textView1`。\n\n从调色板中拖入 `Button`\
  \ 对象并将其放置在水平居中且位于 `TextView` 底部边缘下方。将文本属性更改为“Send Text”，并配置 `onClick` 属性以调用名为 `sendText`\
  \ 的方法。\n\n接下来，添加一个纯文本对象，使其水平居中并位于 `TextView` 顶部边缘上方。使用 `Attributes` 工具窗口移除分配给文本属性的“Name”字符串，并将\
  \ ID 设置为 `editText1`。布局完成后，点击工具栏上的 `Infer constraints`（推断约束）按钮以添加相应的约束：\n\n![](img/as_infer_constraints.jpg)\n\
  \n图 55-1\n\n最后，点击布局编辑器窗口右上角的红色警告按钮，并使用生成的面板将“Send Text”字符串提取到命名为 `send_text` 的资源中。布局完成后，用户界面应该像图\
  \ 55-2 所示：\n\n![](img/as_explicit_intent_send_ui.jpg)\n\n图 55-2\n\n## 55.3 创建第二个\
  \ Activity 类\n\n当用户触摸“Send Text”按钮时，将发布一个 `intent`，请求启动第二个 Activity，用户可以在其中输入响应。因此，下一步是创建第二个\
  \ Activity。在 Project 工具窗口中，右键点击 `app -> java` 下的 `com.ebookfrenzy.explicitintent`\
  \ 包名，选择 `New -> Activity -> Empty Views Activity` 菜单选项，显示如图 55-3 所示的 New Android\
  \ Activity 对话框：\n\n![](img/as_explicit_intent_new_activity_java.jpg)\n\n图 55-3\n\
  \n在 `Activity Name` 和 `Title` 字段中输入 `SecondActivity`，将布局文件命名为 `activity_second`，并将语言菜单更改\
  \ `Java`。由于该 Activity 不会在应用程序启动时启动（它将在点击按钮时由 `MainActivity` 通过 `intent` 启动），在点击\
  \ `Finish` 按钮之前，确保禁用了 `Launcher Activity` 。\n\n## 55.4 设计 SecondActivity 的用户界面布局\n\
  \n第二个 Activity 用户界面所需的元素是纯文本 `EditText`、`TextView` 和 `Button` 视图。根据这些要求，将 `activity_second.xml`\
  \ 布局加载到布局编辑器工具并添加视图。\n\n在设计过程中，注意按钮视图上的 `onClick` 属性已配置为调用名为 `returnText` 的方法，且\
  \ `TextView` 和 `EditText` 视图分别分配了 ID `textView2` 和 `editText2`。完成后，布局应像图 55-4。注意按钮上的文本（“Return\
  \ Text”）已提取到命名为 `return_text` 的字符串资源。\n\n布局完成后，点击工具栏上的 `Infer constraints` 按钮为布局添加必要的约束：\n\
  \n![](img/explicit_intent_return_ui.jpg)\n\n图 55-4\n\n## 55.5 检查清单文件\n\n为了让 `MainActivity`\
  \ 能够使用 `intent` 启动 `SecondActivity`，`AndroidManifest.xml` 文件中需要存在 `SecondActivity`\
  \ 的条目。在 Project 工具窗口中找到此文件（app -> manifests），双击将其加载到编辑器，并验证 Android Studio 是否已添加了该\
  \ activity 条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:dataExtractionRules=\"@xml/data_extraction_rules\"\n   \
  \     android:fullBackupContent=\"@xml/backup_rules\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/ExplicitIntent\"\
  \n        tools:targetApi=\"31\">\n        <activity\n            android:name=\"\
  .SecondActivity\"\n            android:exported=\"false\" />\n        <activity\n\
  \            android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n第二个 Activity 已创建并列在清单文件中，现在是可以在 `MainActivity` 类中编写代码来发布意图了。\n\n## 55.6 创建意图\n\
  \n`MainActivity` 的目标是在用户触摸“Send Text”按钮时创建并启动 `intent`。在意图创建过程中，用户在 `EditText` 视图中输入的字符串将作为键值对添加到\
  \ `intent` 对象中。当创建 `MainActivity` 的用户界面布局时，按钮对象已配置为在用户点击时调用名为 `sendText()` 的方法。现在需要如下所示向\
  \ `MainActivity` 类 `MainActivity.java` 源文件中添加该方法：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  \n...\n\nimport android.content.Intent;\n\n...\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n...\n    public void sendText(View view) {\n        Intent\
  \ i = new Intent(this, SecondActivity.class);\n        String myString = binding.editText1.getText().toString();\n\
  \        i.putExtra(\"qString\", myString);\n    }\n}\n```\n\n\n\n\n```java\n  \
  \      startActivity(i);\n\n    }\n}\n```\n\n`sendText()` 方法的代码遵循了“Android Intent\
  \ 概述”中概述的技术。首先，创建一个新的 `Intent` 实例，并将当前 activity 和 `SecondActivity` 的类名作为参数传入。接下来，将输入到\
  \ `EditText` 对象中的文本以键值对的形式添加到 intent 对象中，然后通过调用 `startActivity()` 启动 intent，并将 intent\
  \ 对象作为参数传入。\n\n编译并运行应用程序，点击“Send Text”（发送文本）按钮启动 `SecondActivity`。使用返回按钮（位于显示屏底部的工具栏中）或在较新的\
  \ Android 版本上从屏幕边缘向右滑动返回 `MainActivity` 屏幕。\n\n## 55.7 提取 Intent 数据\n\n现在 `SecondActivity`\
  \ 已经从 `MainActivity` 启动，下一步是提取 intent 中包含的 `String` 数据值，并将其赋值给 `SecondActivity`\
  \ 用户界面中的 `TextView` 对象。这除了适配 activity 使用视图绑定（view binding）之外，还需要在 `SecondActivity.java`\
  \ 源文件中为 `SecondActivity` 的 `onCreate()` 方法添加一些代码：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  \n.\n\nimport android.content.Intent;\n\nimport android.view.View;\nimport com.ebookfrenzy.explicitintent.databinding.ActivitySecondBinding;\n\
  \npublic class SecondActivity extends AppCompatActivity {\n    private ActivitySecondBinding\
  \ binding;\n\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        EdgeToEdge.enable(this);\n        setContentView(R.layout.SecondActivity);\n\
  \        binding = ActivitySecondBinding.inflate(getLayoutInflater());\n       \
  \ View view = binding.getRoot();\n        setContentView(view);\n        ViewCompat.setOnApplyWindowInsetsListener(binding.main,\
  \ (v, insets) -> {\n            Insets systemBars =\n            insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  \            v.setPadding(systemBars.left, systemBars.top, systemBars.right,\n \
  \           systemBars.bottom);\n            return insets;\n        });\n     \
  \   Bundle extras = getIntent().getExtras();\n        if (extras == null) {\n  \
  \          return;\n        }\n        String qString = extras.getString(\"qString\"\
  );\n        binding.textView2.setText(qString);\n    }\n}\n```\n\n在模拟器或物理 Android\
  \ 设备上编译并运行应用程序。在点击“Send Text”按钮之前，在 `MainActivity` 的文本框中输入一些文本。现在，消息应该出现在 `SecondActivity`\
  \ 用户界面的 `TextView` 组件上。\n\n## 55.8 将 SecondActivity 作为子活动启动\n\n为了让 `SecondActivity`\
  \ 能够向 `MainActivity` 返回数据，`SecondActivity` 必须作为 `MainActivity` 的子活动启动。这意味着我们需要调用\
  \ `registerForActivityResult()` 并声明一个回调处理器，以便在 `SecondActivity` 返回时调用它。该回调将提取 `SecondActivty`\
  \ 返回的数据并显示在 `textView1` 上。\n\n调用 `registerForActivityResult()` 返回一个 `ActivResultLauncher`\
  \ 实例，可以在 `sendText()` 内部调用它来启动 intent。编辑 `MainActivity.java` 文件使其内容如下：\n\n```java\n\
  .\n\n.\n\nimport android.app.Activity;\nimport androidx.activity.result.ActivityResult;\n\
  import androidx.activity.result.ActivityResultCallback;\nimport androidx.activity.result.ActivityResultLauncher;\n\
  import androidx.activity.result.contract.ActivityResultContracts;\n.\n\n.\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n.\n\n.\n    ActivityResultLauncher<Intent>\
  \ startForResult = registerForActivityResult(\n            new ActivityResultContracts.StartActivityForResult(),\n\
  \            new ActivityResultCallback<ActivityResult>() {\n                @Override\n\
  \                public void onActivityResult(ActivityResult result) {\n       \
  \             if (result.getResultCode() == Activity.RESULT_OK) {\n            \
  \            Intent data = result.getData();\n                        String returnString\
  \ =\n                        data.getExtras().getString(\"returnData\");\n     \
  \                   binding.textView1.setText(returnString);\n                 \
  \   }\n                }\n            });\n    public void sendText(View view) {\n\
  \        Intent i = new Intent(this, SecondActivity.class);\n        String myString\
  \ = binding.editText1.getText().toString();\n        i.putExtra(\"qString\", myString);\n\
  \        startActivity(i);\n        startForResult.launch(i);\n    }\n}\n.\n```\n\
  \n## 55.9 从子活动返回数据\n\n`SecondActivity` 现在作为 `MainActivity` 的子活动启动，而 `MainActivity`\
  \ 也已修改以处理从 `SecondActivity` 返回的数据。剩下的工作是修改 `SecondActivity.java` 以实现 `finish()`\
  \ 方法并添加一个名为 `returnText()` 的方法。当 activity 退出时触发 `finish()` 方法（例如，当用户选择设备上的返回按钮时）：\n\
  \n```java\npublic void returnText(View view) {\n    finish();\n}\n\n@Override\n\
  public void finish() {\n    Intent data = new Intent();\n    String returnString\
  \ = binding.editText2.getText().toString();\n    data.putExtra(\"returnData\", returnString);\n\
  \    setResult(RESULT_OK, data);\n    super.finish();\n}\n```\n\n`finish()` 方法创建一个新的\
  \ intent，将返回数据作为键值对添加，然后调用 `setResult()` 方法传入结果代码和 intent 对象。`returnText()` 方法调用\
  \ `finish()`。打开 `activity_second.xml` 文件，选择按钮并配置 `onClick` 属性以调用 `returnText()`。\n\
  \n### 55.10 测试应用程序\n\n编译并运行应用程序，在 `MainActivity` 中输入问题并点击“Send Text”按钮。当 `SecondActivity`\
  \ 出现时，在 `EditText` 中输入文本，使用返回按钮或“Return Text”按钮返回 `MainActivity`，结果应该显示在那里。\n\n\
  ## 55.11 总结\n\n在上一节涵盖了 intent 的基础知识后，本章的目标是通过 Android Studio 创建应用程序项目，以演示显式意的使用以及父子活动之间数据传输的概念。\n\
  \n下一章将通过示例演示隐式意。\n\n## 56. Android 隐式意 —— 实例演示\n\n本章将在 Android Studio 中创建一个应用程序，用于演示隐式意的实际实现。目标是创建并发送一个请求加载并显示特定网页内容的\
  \ intent。由于示例本身不包含执行此任务的 activity，将发布一个隐式意，以便让 Android intent 解析算法识别并启动另一个应用程序中合适的\
  \ activity。这可能是 Android 操作系统自带的 Chrome 浏览器活动。\n\n## 56.1 创建 Android Studio 隐式意示例项目\n\
  \n欢迎界面上选择 New Project，在出现的新项目对话框中选择 Empty Views Activity 模板，然后点击 Next。\n\n在 Name\
  \ 字段中输入 `ImplicitIntent` 并指定 `com.ebookfrenzy.implicitintent` 为包名。由于此示例将使用仅适用于较新\
  \ Android 版本的功能，将 Minimum API level 设置为 `API 31: Android 12.0 (S)`并将 Language 菜单改为\
  \ Java，然后点击 Finish。\n\n### 56.2 设计用户界面\n\n\n\n\n`MainActivity` 类的用户界面非常直观，仅由一个 `ConstraintLayout`\
  \ 和两个 `Button` 对象组成。在 Project 工具窗口中，找到 `app -> res -> layout -> activity_main.xml`\
  \ 文件并双击将其加载到 Layout Editor（布局编辑器）工具中。\n\n删除默认的 `TextView`，并在 `Autoconnect`（自动连接）模式开启的情况下，在布局中放置\
  \ `Button` 组件，使其显示如下所示：\n\n![](img/as_implicit_intent_ui.jpg)\n\n图 56-1\n\n将按钮上的文本设置为\
  \ `Show Web Page` 和 `Enable Links`，并将文本提取到字符串资源中。\n\n选择每个 `Button`，并使用 Attributes（属性）工具窗口配置\
  \ `onClick` 属性，分别调用名为 `showWebPage` 和 `enableLink` 方法。\n\n### 56.3 创建隐式意图\n\n如上述，隐式意图（implicit\
  \ intent）将在名为 `showWebPage()` 的方法内部创建并发出，而该方法需要在 `MainActivity` 类中实现，该类的代码位于 `MainActivity.java`\
  \ 源文件中。在 Project 工具窗口中找到该文件并双击将其加载到编辑面板中。加载后，修改代码添加 `showWebPage()` 和 `enableLink()`\
  \ 方法，以及一些必要的导入语句：\n\n```java\npackage com.ebookfrenzy.implicitintent;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\nimport\
  \ android.net.Uri;\nimport android.content.Intent;\n\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n.\n\n.\n\n    public void\
  \ showWebPage(View view) {\n        Intent intent = new Intent(Intent.ACTION_VIEW,\n\
  \                    Uri.parse(\"https://www.ebookfrenzy.com\"));\n        startActivity(intent);\n\
  \    }\n\n    public void enableLink(View view) {\n    }\n}\n```\n\n`showWebPage()`\
  \ 方法执行的任务非常简单。首先，创建一个新的 `intent` 对象。然而，代码并没有指定意图的类名，而是使用 `ACTION_VIEW` 选项指示意图的性质（向用户显示某些内容）。意图对象还包含一个包含要显示的\
  \ URL 的 URI。这告诉 Android 意图解析系统，该 Activity 正在请求显示一个网页。然后，通过调用 `startActivity()` 方法发出意图。\n\
  \n在模拟器或物理 Android 设备上编译并运行应用程序，一旦运行，点击 `Show Web Page` 按钮。点击后，应该出现一个浏览器视图并加载由 URL\
  \ 指定网页。一个成功的隐式意图现在已经执行完毕。\n\n## 56.4 添加第二个匹配的 Activity\n\n本章的剩余部分将演示设备上安装了多个符合隐式意图要求的\
  \ Activity 时的效果。将在设备或模拟器上创建并安装第二个应用程序来实现这一目标。首先，在 Android Studio 中创建一个新项目，应用程序名称设置为\
  \ `MyWebView`，使用与在本章较早创建 `ImplicitIntent` 项目时相同的 SDK 配置选项，并再次选择 `Empty Views Activity`。\n\
  \n如果你有一个网站来托管 Digital Asset Links（数字资产链接）文件，并想尝试自动验证，请在指定包名时使用你的网站 URL。例如，如果你的网站托管在\
  \ `www.mycompany.com`，则包名需要设置为如下：\n\n`com.mycompany.mywebview`\n\n如果你没有网站或不计划使用自动验证，请使用以下包名：\n\
  \n`com.ebookfrenzy.mywebview`\n\n点击 Finish 创建项目，然后按照章节 11.8 Migrating a Project\
  \ to View Binding 所述将项目转换为使用 view bindings。\n\n## 56.5 将 WebView 添加到 UI\n\n新 `MyWebView`\
  \ 项目包含的唯一 Activity 的用户界面将由一个 Android `WebView` 组件实例组成。在 Project 工具窗口中，找到 `activity_main.xml`\
  \ 文件（该文件包含 Activity 的用户界面描述），双击将其加载到 Layout Editor 工具中。\n\n在 Layout Editor 工具的 Design（设计）模式下，选择默认的\
  \ `TextView` 组件并使用键盘 delete 键将其从布局中删除。\n\n从调板的 Widgets 部分将 `WebView` 对象拖放到放置到现有的\
  \ `ConstraintLayout` 视图上，如图 56-2 所示：\n\n![](img/as_3.5_implicit_intent_webview_ui.jpg)\n\
  \n图 56-2\n\n在继续之前，将 `WebView` 实例的 ID 改为 `webView1`，并使用 Infer constraints（推断约束）按钮添加任何缺失的约束。\n\
  \n## 56.6 获取意图 URL\n\n当创建用于显示浏览器窗口的隐式意图对象时，网页 URL 将封装在意图对象的 `Uri` 对象中。`MainActivity`\
  \ 类中 `onCreate()` 方法的任务是从意图对象提取此 `Uri`，将其转换为 URL 字符串并分配给 `WebView` 对象。为了实现此功能，修改\
  \ `MainActivity.java` 文件使其读取如下：\n\n```java\npackage com.ebookfrenzy.mywebview;\n\
  \n.\n\n.\n\nimport java.net.URL;\nimport android.net.Uri;\nimport android.content.Intent;\n\
  import android.webkit.WebView;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n..\n\n        handleIntent();\n    }\n\n\
  \    private void handleIntent() {\n        Intent intent = getIntent();\n     \
  \   Uri data = intent.getData();\n        URL url = null;\n        try {\n     \
  \       url = new URL(data.getScheme(),\n                        data.getHost(),\n\
  \                        data.getPath());\n        } catch (Exception e) {\n   \
  \         e.printStackTrace();\n        }\n        binding.webView1.loadUrl(url.toString());\n\
  \    }\n}\n```\n\n新添加到 `onCreate()` 方法的代码执行以下操作：\n- 获取启动此 Activity 的意图引用\n- 从意图中提取\
  \ `Uri` 数据\n- 将 `Uri` 数据转换为 `URL` 对象\n- 将 URL 加载到 web view，在此过程中将其转换为 String\n\n\
  MyWebView 项目的代码部分已完成。剩下的只是修改 manifest。\n\n## 56.7 修改 MyWebView Manifest 文件\n\n在测试之前，必须对\
  \ MyWebView Manifest 文件进行一些更改。首先，Activity 需要访问互联网的权限（因为它需要加载网页）。这通过在清单文件中添加相应的权限行来实现：\n\
  \n`<uses-permission android:name=\"android.permission.INTERNET\" />`\n\n此外，查看 MyWebView\
  \ 项目 `AndroidManifest.xml` 文件的 intent filter 部分将发现以下设置：\n\n```xml\n<intent-filter>\n\
  \    <action android:name=\"android.intent.action.MAIN\" />\n    <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n</intent-filter>\n```\n\n在上述 XML 中，`android.intent.action.MAIN`\
  \ 项表示该 Activity 在没有数据输入的情况下启动时是应用程序的入口点——而 `android.intent.category.LAUNCHER` 指令表示该\
  \ Activity 应列在设备的应用程序启动器屏幕上。\n\n由于 Activity 不需要作为应用程序的入口点启动，在没有数据输入（在此情况下为 URL）的情况下运行，不需要出现在启动器，因此该\
  \ Activity 的清单文件中不需要 `MAIN` 或 `LAUNCHER` 指令。\n\n`MainActivity` Activity 的 intent\
  \ filter 确实需要修改，以表明它可以处理针对 `HTTP` 数据方案的 `ACTION_VIEW` 意图操作。\n\n\n\n\nAndroid 还要求处理不包含\
  \ `MAIN` 和 `LAUNCHER` 目的的隐式意图的 必须在意图过滤器（intent filter）中包含所谓的可浏览和默认类别。因此，修改后的意图过滤器部分如下，其中\
  \ `<website url>` 应替换为你的网站地址或 `www.ebookfrenzy.com`，具体取决于你在创建 `MyWebView` 项目时使用的包名：\n\
  \n```xml\n<intent-filter android:autoVerify=\"true\">\n    <action android:name=\"\
  android.intent.action.VIEW\" />\n    <category android:name=\"android.intent.category.BROWSABLE\"\
  \ />\n    <category android:name=\"android.intent.category.DEFAULT\" />\n    <data\
  \ android:scheme=\"https\" />\n    <data android:host=\"<website url>\"/>\n</intent-filter>\n\
  ```\n\n整合这些要求后，完整的 `AndroidManifest.xml` 文件如下：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.mywebview\">\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyWebView\">\n        <activity\n \
  \           android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter android:autoVerify=\"true\">\n                <action\
  \ android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n                <category android:name=\"\
  android.intent.category.DEFAULT\" />\n                <data android:scheme=\"https\"\
  \ />\n                <data android:host=\"<website url>\"/>\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n在 Project 工具窗口中双击文件名，将\
  \ `AndroidManifest.xml` 文件加载到清单编辑器中。加载后，修改 XML 以匹配上述更改，记得输入正确的网站 URL。\n\n在对清单文件进行适当修改后，新的活动程序已准备好安装到设备上。\n\
  \n### 56.8 在设备上安装 MyWebView 包\n\n在 `MyWebView` 主活动可以作为隐式意图的接收者之前，必须先将其安装到设备上。这通过正常方式运行应用程序来实现。由于清单文件既不包含\
  \ `android.intent.action.MAIN` 也不包含 `android.intent.category.LAUNCHER` 设置，因此必须指示\
  \ Android Studio 安装但不启动该应用。要配置此行为，请从工具栏中选择 `app` -> `Edit configurations…` 菜单，如图图\
  \ 56-3 所示：\n\n![](img/as_edit_configurations.jpg)\n\n图 56-3\n\n在 `Run/Debug Configurations`\
  \ 对话框中，将面板中 `Launch Options` 区域的 `Launch` 选项更改为 `Nothing`，然后点击 `Apply` 后点击 `OK`：\n\
  \n![](img/as_launch_options.jpg)\n\n图 56-4\n\n配置好此设置后，照常运行应用。请注意，应用已安装到设备上，但尚未启动。\n\
  \n### 56.9 测试应用程序\n\n安装 `MyWebView` 应用后，重新运行 `ImplicitIntent` 并点击 `Show Web Page`\
  \ 按钮。注意，网页仍然加载到 `Chrome` 浏览器中，而不是设备的主活动程序。\n\n### 56.10 手动启用链接\n\n在对清单文件进行适当修改后，新的活动程序已准备好安装到设备上。（等待，提供的文本重复了某些部分，我将保持提供源的逻辑流）。\n\
  \n安装 `MyWebView` 应用后，重新运行 `ImplicitIntent` 并点击 `Show Web Page` 按钮。注意，网页仍然加载到 `Chrome`\
  \ 浏览器中，而不是设备的主活动程序。\n\n安装 `MyWebView` 应用后，重新运行 `ImplicitIntent` 并点击 `Show Web Page`\
  \ 按钮。注意，网页仍然加载到 `Chrome` 浏览器中，而不是设备的主活动程序。（注意：源包含重复段落；我将按照提供的内容进行处理）。\n\n### 56.11\
  \ 自动链接验证\n\n如果你选择为 `MyWebView` 包名使用自己的 URL，现在可以采取自动链接验证的额外步骤。\n\n### 56.12 总结\n\n\
  隐式意图提供了一种机制，一个活动程序可以通过指定操作类型以及可选的执行该操作的数据，来请求另一个活动程序的服务。然而，要成为隐式意图的目标候选，活动程序必须配置为从传入的意图对象中提取适当的数据，并包含在正确配置的清单文件中（包括适当的权限和意图过滤器）。包含目标活动程序的应用程序还必须使用\
  \ Digital Asset Links 文件进行验证，或由用户手动启用。\n\n\n\n\n\n除了提供启动应用程序活动的机制外，意图（intent）还用于向系统的其他组件广播系统级消息。这涉及到广播意图（Broadcast\
  \ Intents）和广播接收器（Broadcast Receivers）的实现，两者都是本章的主题。\n\n## 57.1 广播意图概述\n\n广播意图是 `Intent`\
  \ 对象，通过调用 `Activity` 类的 `sendBroadcast()`、sendStickyBroadcast()` 或 `sendOrderedBroadcast()`\
  \ 方法进行广播（后者用于需要从广播获取结果的情况）。除了在应用程序组件之间提供消息和事件系统外，Android 系统还使用广播意图通知感兴趣的应用程序关于关键系统事件（例如外部电源或耳机的连接或断开）。\n\
  \n在创建广播意图时，它必须包含一个动作字符串（action string）、可选数据（data）和一个类别字符串（category string）。与标准意图一样，数据是结合\
  \ `intent` 对象的 `putExtra()` 方法使用键值对添加到广播意图中。可选的类别字符串可以通过调用 `addCategory()` 方法分配给广播意图。\n\
  \n标识广播事件的动作字符串必须是唯一的，通常使用应用程序的包名语法。例如，以下代码段创建并发送了一个包含唯一动作字符串和数据的广播意图：\n\n```java\n\
  Intent intent = new Intent();\n\nintent.setAction(\"com.example.Broadcast\");\n\n\
  intent.putExtra(\"MyData\", 1000);\n\nsendBroadcast(intent);\n```\n\n上述代码将在 Android\
  \ 3.0 之前的 Android 设备上成功启动相应的广播接收器。然而，在较新版本的 Android 中，广播接收器将无法接收到该意图。这是因为 Android\
  \ 3.0 引入了启动控制安全措施，防止已停止应用程序的组件通过意图启动。如果应用程序刚刚安装且之前没有启动过，或者被用户使用设备上的应用程序管理器手动停止，则该应用程序被认为处于停止状态。然而，为了绕过这一点，可以在发送意图之前对其添加一个标记，以允许该意图启动已停止应用程序的组件。该标记是\
  \ `FLAG_INCLUDE_STOPPED_PACKAGES`，其用法如下述代码段的适配版本所示：\n\n```java\nIntent intent =\
  \ new Intent();\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\nintent.setAction(\"\
  com.example.Broadcast\");\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n\
  ```\n\n### 57.2 广播接收器概述\n\n应用程序通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展 Android 的 `BroadcastReceiver`\
  \ 类并重写 `onReceive()` 方法来实现。广播接收器可以在代码中（例如在活动内部）或清单文件（manifest file）中注册。注册实现的一部分涉及创建意图过滤器（intent\
  \ filters），以指示接收器需要监听的特定广播意图。这是通过引用广播意图的动作字符串来实现。当检测到匹配的广播时，会调用广播接收器的 `onReceive()`\
  \ 方法，此时该方法有 5 秒钟来执行任何必要的任务，然后返回。需要注意的是，广播接收器不需要持续运行。如果检测到匹配的意图，Android 运行时系统会在调用\
  \ `onReceive()` 方法之前自动启动广播接收器。以下代码概述了一个模板广播接收器子类：\n\n```java\npackage com.example.broadcastdetector;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver {\n\
  \n    public MyReceiver() {\n\n    }\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // 在此处实现检测到 \n        // 广播时要执行的代码\n    }\n\
  }\n```\n\n在清单文件中注册广播接收器时，必须为接收器添加 `<receiver>` 条目。以下示例清单文件注册了上述示例广播接收器：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.example.broadcastdetector.broadcastdetector\"\n    android:versionCode=\"\
  1\"\n    android:versionName=\"1.0\" >\n    <uses-sdk android:minSdkVersion=\"33\"\
  \ />\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\" >\n        <receiver android:name=\"MyReceiver\" >\n        </receiver>\n\
  \    </application>\n</manifest>\n```\n\n在 Android 8.0 之前的 Android 版本上运行时，与接收器关联意图过滤器可以如下所示放置在清单文件的\
  \ `receiver` 元素中：\n\n```xml\n<receiver android:name=\"MyReceiver\" >\n    <intent-filter>\n\
  \        <action android:name=\"com.example.Broadcast\" >\n    </intent-filter>\n\
  </receiver>\n```\n\n在 Android 8.0 或更高版本上，必须在代码中使用 `registerReceiver()` 方法结合适当配置的\
  \ `IntentFilter` 来注册接收器：\n\n```java\nIntentFilter filter = new IntentFilter(\"com.example.Broadcast\"\
  );\nMyReceiver receiver = new MyReceiver();\nregisterReceiver(receiver, RECEIVER_EXPORTED);\n\
  ```\n\n当代码中注册的广播接收器不再需要时，可以通过调用  的 `unregisterReceiver()` 方法进行注销，并将接收器引用作为参数传递。例如，以下代码将注销上述接收器：\n\
  \n```java\nunregisterReceiver(receiver);\n```\n\n重要的是，某些系统广播意图只有当接收器在代码中而非文件中注册时才能被检测。请在线查看\
  \ Intent 类文档获取系统广播意图的详细概述：[`developer.android.com/reference/android/Intent`](https://developer.android.com/reference/android/Intent)\n\
  \n### 57.3 从广播获取结果\n\n当使用 `sendBroadcast()` 方法发送广播意图时，启动活动无法从获取该广播的广播接收器获取结果。如果需要结果，则必须使用\
  \ `sendOrderedBroadcast()` 方法。使用 `sendOrderedBroadcast()` 时需要传入多个参数，包括另一个广播接收器（称为结果接收器），用于在所有其他广播接收器处理后通知它，以及一组供这些接收器向其放置结果的数据引用。当所有广播接收器都获得了处理广播的机会后，结果接收器的\
  \ `onReceive()` 方法将被调用并传递结果数据。\n\n## 57.4 粘性广播意图\n\n默认情况下，广播意图在发送并被感兴趣的接收器处理后就会消失。然而，广播意图可以定义为“粘性”（sticky）。粘性意图在执行完成后仍保留在系统中。粘性意图包含的数据可以通过调用\
  \ `registerReceiver()` 方法的返回值获取，使用常规参数（广播接收器和意图过滤器引用）。许多 Android 系统广播都是粘性的，一个典型的例子是与电量状态相关的广播。\n\
  \n\n\n\n\n可以通过调用 `removeStickyBroadcast()` 方法随时移除粘性广播（sticky broadcast），该方法通过一个参数传递要移除的广播意图的引用。\n\
  \n### 57.5 广播意图示例\n\n本章的剩余部分将通过创建一个基于 Android Studio 的示例来演示广播意图的操作。首先，将创建一个简单的应用程序来发送自定义广播意图。随后创建一个相应的广播接收器，以便检测到广播时在\
  \ Android 设备的屏幕上显示消息。最后，将修改广播接收器以检测系统发送的设备外部电源已断开的通知。\n\n### 57.6 创建示例应用程序\n\n从欢迎界面选择\
  \ `New Project`（新建项目）选项，在弹出的新项目对话框中选择 `Empty Views Activity` 模板，然后点击 `Next`（下一步）按钮。\n\
  \n在 `Name` 字段输入 `SendBroadcast`，并将 `com.ebookfrenzy.sendbroadcast` 为包名。在点击 `Finish`（完成）按钮之前，将\
  \ `Minimum API level`（最低 API 级别）设置为 `API 33`：`Android 13.0 (Tiramisu)`，并将 `Language`（语言）菜单设置为\
  \ `Java`。\n\n新项目创建完成后，在 Project 工具窗口的 `app -> res -> layout` 下找到并加载 `activity_main.xml`\
  \ 布局文件。在 Design 模式下使用 Layout Editor 工具，将 `TextView` 对象替换为 `Button` 视图，并设置 `text`\
  \ 属性使其显示为“Send Broadcast”。设置好文本值后，按照通常步骤将字符串提取到名为 `send_broadcast` 的资源中。\n\n在布局中仍选中按钮的情况下，在\
  \ `Attributes`（属性）面板中找到 `onClick` 属性，并配置其调用名为 `broadcastIntent` 的方法。\n\n## 57.7\
  \ 创建并发送广播意图\n\n在创建了 `SendBroadcast` 应用程序的框架后，现在是实现发送广播意图代码了。这涉及到实现之前指定的作为用户界面 `Button`\
  \ 视图的 `onClick` 目标的 `broadcastIntent()` 方法。找到 `MainActivity.java` 文件并双击它，修改它以添加创建和发送广播意图的代码。修改后，该类的源代码应如下所示：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    public\
  \ void broadcastIntent(View view)\n    {\n        Intent intent = new Intent();\n\
  \        intent.setAction(\"com.ebookfrenzy.sendbroadcast\");\n        intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\
  \        sendBroadcast(intent);\n    }\n}\n```\n\n注意，在本例中，意图的 action 字符串为 `com.ebookfrenzy.sendbroadcast`。当在本章后续章节创建广播接收器类时，意图过滤器声明必须匹配此\
  \ action 字符串。\n\n发送广播意图的应用程序创建完成。剩下的只需要构建一个匹配的广播接收器。\n\n### 57.8 创建广播接收器\n\n要创建广播接收器，需要创建一个类，该类继承自\
  \ `BroadcastReceiver` 超类。在 Project 工具窗口中，导航到 `app -> java` 并右键点击包名。从弹出的菜单中选择 `New\
  \ -> Other -> Broadcast Receiver` 菜单选项，将类命名为 `MyReceiver`，并确保选中了 `Exported`（导出）和\
  \ `Enabled`（启用）选项。这些设置允许 Android 系统在需要时启动接收器，并确保该类可以接收来自其他应用程序的消息。配置好类后，点击 `Finish`。\n\
  \n创建后，Android Studio 将自动将新的 `MyReceiver.java` 类文件加载到编辑器中，其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // TODO: 当 BroadcastReceiver 接收到\n        //\
  \ Intent 广播时调用此方法。\n        throw new UnsupportedOperationException(\"Not yet implemented\"\
  );\n    }\n}\n```\n\n如代码所示，Android Studio 为新类生成了一个模板以及 `onReceive()` 方法的存根。现在需要对类进行一些更改以实现所需的行为。因此，在\
  \ `MyReceiver.java` 文件中，修改代码使其如下所示：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\nimport android.widget.Toast;\n\npublic class MyReceiver\
  \ extends BroadcastReceiver {\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // TODO: 当 BroadcastReceiver 接收到\n        //\
  \ Intent 广播时调用此方法。\n        throw new UnsupportedOperationException(\"Not yet implemented\"\
  );\n        Toast.makeText(context, \"Broadcast Detected.\", Toast.LONG).show();\n\
  \    }\n}\n```\n\n广播接收器的代码现在已完成。\n\n### 57.9 注册广播接收器\n\n项目需要公开广播接收器的存在，并且必须包含一个意图过滤器来指定接收器感兴趣的广播。当在上一节中创建\
  \ `BroadcastReceiver` 类时，Android Studio 自动在清单文件中添加了 `<receiver>` 元素。因此，剩下的是在 `MainActivity.java`\
  \ 文件中添加代码以创建意图过滤器并注册接收器：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\n\
  import android.content.BroadcastReceiver;\nimport android.content.IntentFilter;\n\
  \n..\npublic class MainActivity extends AppCompatActivity {\n    BroadcastReceiver\
  \ receiver;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n..\n        configureReceiver();\n\
  \    }\n\n    private void configureReceiver() {\n        IntentFilter filter =\
  \ new IntentFilter();\n        filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n        receiver = new MyReceiver();\n        registerReceiver(receiver, filter);\n\
  \    }\n\n..\n}\n```\n\n在不再需要时，注销广播接收器也是重要的：\n\n```java\n@Override\nprotected onDestroy()\
  \ {\n    super.onDestroy();\n    unregisterReceiver(receiver);\n}\n```\n\n### 57.10\
  \ 测试广播示例\n\n要测试广播发送端和接收器，在设备或 AVD 上运行 `SendBroadcast` 应用程序并等待其显示在屏幕上。运行后，触摸按钮，此时“Broadcast\
  \ Detected.”的 toast 消息将弹出几秒钟然后消失。\n\n### 57.11 监听系统广播\n\n本示例的最后一个阶段是修改广播接收器的意图过滤器，以监听设备外部电源断开时广播的系统意图。该操作为\
  \ `android.intent.action.ACTION_POWER_DISCONNECTED`。修改 `MainActivity.java` 文件中的\
  \ `configureReceiver()` 方法以添加此过滤器：\n\n```java\nprivate void configureReceiver()\
  \ {\n    IntentFilter filter = new IntentFilter();\n    filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n    filter.addAction(\n        \"android.intent.action.ACTION_POWER_DISCONNECTED\"\
  );\n    receiver = new MyReceiver();\n    registerReceiver(receiver, filter);\n\
  }\n```\n\n\n\n\n\n由于 `MyReceiver.java` 文件中的 `onReceive()` 方法现在将监听两种类型的广播意图，值得修改代码以便将当前意图的操作（action）字符串也显示在\
  \ toast 消息中。该字符串可以通过调用作为 `onReceive()` 方法参数的 `intent` 对象的 `getAction()` 方法获取：\n\n\
  ```java\npublic void onReceive(Context context, Intent intent) {\n    String message\
  \ = \"Broadcast intent detected \"\n                    + intent.getAction();\n\
  \    Toast.makeText(context, message,\n            Toast.LENGTH_LONG).show();\n\
  }\n```\n\n重新安装修改后的 `SendBroadcast` 包来测试接收器。现在在 `SendBroadcast` 应用中点击按钮将会显示包含自定义操作字符串的新消息：\n\
  \n`Broadcast intent detected com.ebookfrenzy.sendbroadcast`\n\n接下来，移除当前为 Android\
  \ 设备供电的 USB 连接器，此时接收器应该会在 toast 消息中报告以下内容（在竖屏设备上，消息可能会被截断）。如果应用在模拟器上运行，请显示扩展控制面板，选择电池（Battery）选项并将充电器（Charger）连接设置为无（None）。\n\
  \n`Broadcast intent detected android.intent.action.ACTION_POWER_DISCONNECTED`\n\n\
  为了避免设备断开电源时出现此消息，请启动设置应用并选择应用（Apps）选项。从结果列表中选择 `SendBroadcast` 应用并点击卸载（Uninstall）按钮。\n\
  \n### 57.12 总结\n\n广播意图是一种供 Android 系统上的多个组件消费的意图发布机制。广播通过注册广播接收器（Broadcast Receiver）来检测，而接收器被配置为监听匹配特定操作字符串的意图。通常情况下，广播接收器在检测到匹配意图并被系统唤醒之前一直保持休眠状态。Android\
  \ 系统还使用广播意图发布事件通知，例如低电警告以及外部电源与设备的连接或断开。\n\n除了提供广播意图和接收器的概述外，本章还通过示例介绍了发送广播意图并实现广播接收器以监听自定义和系统广播意图的步骤。\n\
  \n## 58. Android 本地绑定服务——实例详解\n\n如前一节所述，绑定服务（Bound services）为实现 Android 服务与一个或多个客户端组件之间的通信提供了机制。本章基于“Android\
  \ 服务概述”中提供的绑定服务概述，开始进行本地绑定服务的示例实现。\n\n### 58.1 理解绑定服务\n\n提供绑定服务允许应用程序在后台执行任务。多个客户端组件可以绑定到一个绑定服务上，一旦绑定，就可以使用各种机制与该服务进行交互。\n\
  \n绑定服务作为 Android `Service` 类的子类创建，并且至少必须实现 `onBind()` 方法。客户端组件通过调用 `bindService()`\
  \ 方法绑定到服务。对绑定服务的首次绑定请求将导致调用该服务的 `onBind()` 方法（随后的绑定请求不会触发 `onBind()` 调用）。想要绑定到服务的客户端还必须实现一个\
  \ `ServiceConnection` 的子类，该子类包含 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 方法，这两个方法分别在客户端-服务器连接建立或断开时被调用。在 `onServiceConnected()` 方法中，将传递一个 `IBinder` 对象，该对象包含了客户端与服务交互所需的信息。\n\
  \n### 58.2 绑定服务的交互选项\n\n实现客户端组件与绑定服务之间交互有两种两种推荐的机制。假设该绑定服务是本地的，且与客户端组件属于同一个应用程序（私有的，也就是说它运行在同一个进程中，对其他应用程序中的组件不可用）。在这种情况下，推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。然后由 `onBind()` 方法返回此 `Binder` 对象的实例，随后由客户端组件使用它直接访问服务中持有的方法和数据。\n\
  \n当绑定服务不是应用程序的本地服务时（也就是说，它运行在与客户端组件不同的进程中），使用 `Messenger/Handler` 实现来实现交互是最佳的。\n\
  \n在本章的剩余部分中，将创建一个示例来演示创建、启动和与本地私有绑定服务交互的涉及步骤。\n\n### 58.3 本地绑定服务示例\n\n在本章剩余部分中创建的示例应用将包含单个活动（activity）和一个绑定服务。绑定服务的目的是从系统获取当前时间，并将该信息返回给活动，由活动将其显示给用户。该绑定服务将是本地的，且与活动属于同一个应用程序（私有的）。\n\
  \n从欢迎界面选择新建项目（New Project）选项，在出现的新项目对话框中，点击下一步（Next）按钮之前选择空视图活动（Empty Views Activity）模板。\n\
  \n在 Name 字段中输入 `LocalBound`，并指定 `com.ebookfrenzy.localbound` 为包名。在点击完成（Finish）按钮之前，将最小\
  \ API 级别设置为 API 26: Android 8.0 (Oreo)，并将语言菜单设置为 Java。使用第 11.8 迁移项目迁移到视图绑定 节中的步骤将项目迁移到视图绑定。\n\
  \n项目创建完成后，下一步是添加一个新类作为绑定服务。\n\n### 58.4 向项目添加绑定服务\n\n要向项目添加新类，在项目窗口中，右键点击包名（位于 `app\
  \ -> java -> com.ebookfrenzy.localbound` 下），并选择 New -> Service -> Service 选项。指定\
  \ `BoundService` 为类名，并在点击完成创建类之前确保勾选了导出（Exported）和启用（Enabled）选项。Android Studio 将\
  \ `BoundService.java` 文件加载到编辑器中，其内容如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport android.app.Service;\n\nimport android.content.Intent;\n\nimport android.os.IBinder;\n\
  \npublic class BoundService extends Service {\n    public BoundService() {\n   \
  \ }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        // TODO:\
  \ 返回指向服务的通信通道。\n        throw new UnsupportedOperationException(\"Not yet implemented\"\
  );\n    }\n}\n```\n\n### 58.5 实现 Binder\n\n如前所述，本地绑定服务可以通过向客户端传递配置适当的 `Binder` 对象来与绑定客户端通信。这通过在绑定服务类内部创建一个\
  \ `Binder` 子类并扩展它来添加一个或多个客户端可以调用的方法来实现。这通常涉及实现一个返回绑定服务实例引用的方法。有了该引用，客户端就可以直接访问绑定服务内部的数据并调用方法。\n\
  \n对于本示例，需要对上一节创建的模板 `BoundService` 类进行一些修改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为 `getService()`\
  \ 的方法，该方法将返回当前服务实例的引用（由 `this` 关键字表示）。根据这些要求，编辑 `BoundService.java` 文件并进行如下修改：\n\
  \n\n\n\n\n```java\nimport android.os.Binder;\n\npublic class BoundService extends\
  \ Service {\n\n    private final IBinder myBinder = new MyLocalBinder();\n\n   \
  \ public BoundService() {\n\n    }\n\n    @Override\n    public IBinder onBind(Intent\
  \ intent) {\n        // TODO: Return the communication channel to the service.\n\
  \        throw new UnsupportedOperationException(\"Not yet implemented\");\n   \
  \ }\n\n    public class MyLocalBinder extends Binder {\n        BoundService getService()\
  \ {\n            return BoundService.this;\n        }\n    }\n}\n```\n\n在完成对类的修改后，值得花一点时间回顾一下这里执行的步骤。首先，声明了一个\
  \ `Binder` 的新子类（命名为 `MyLocalBinder`）。该类包含一个单一方法，用于返回 `BoundService` 类当前实例的引用。创建\
  \ `MyLocalBinder` 类的的新实例并将其赋值给 `myBinder` `IBinder` 引用（由于 `Binder` 是 `IBinder` 的子类，因此这种赋值不存在类型不匹配的问题）。\n\
  \n接下来，需要修改 `onBind()` 方法以返回 `myBinder` 对象的引用，并实现一个新的公共方法，以便在任何绑定到服务的客户端调用时返回当前时间：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport java.text.SimpleDateFormat;\n\
  import java.util.Date;\nimport java.util.Locale;\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        return myBinder;\n    }\n\n\
  \    public String getCurrentTime() {\n        SimpleDateFormat dateformat =\n \
  \               new SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\",\n                \
  \        Locale.US);\n        return (dateformat.format(new Date()));\n    }\n\n\
  \    public class MyLocalBinder extends Binder {\n        BoundService getService()\
  \ {\n            return BoundService.this;\n        }\n    }\n}\n```\n\n此时，绑定的服务已经完成，并准备好添加到项目清单文件中。在\
  \ Project 工具窗口中找到并双击 `LocalBound` 项目的 `AndroidManifest.xml` 文件，一旦加载到 Manifest 编辑器，验证\
  \ Android Studio 是否已如下所示为服务添加了 `<service>` 条目：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.localbound.localbound\" >\n    <application\n  \
  \      android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <service\n            android:name=\".BoundService\"\n            android:enabled=\"\
  true\"\n            android:exported=\"true\" >\n        </service>\n        <activity\n\
  \            android:name=\".MainActivity\" >\n            <intent-filter>\n   \
  \             <action android:name=\"android.intent.action.MAIN\" />\n         \
  \       <category android:name=\"android.intent.category.LAUNCHER\" />\n       \
  \     </intent-filter>\n        </activity>\n    </application>\n</manifest>\n```\n\
  \n下一阶段是在 activity 内部编写代码以绑定到服务并调用 `getCurrentTime()` 方法。\n\n### 58.6 将客户端绑定到服务\n\
  \n对于本教程而言，客户端是应用程序的 `MainActivity` 实例。如前所述，要成功绑定到服务并接收服务 `onBind()` 方法返回的 `IBinder`\
  \ 对象，必须创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 回调方法。编辑 `MainActivity.java` 文件并进行如下修改：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.os.IBinder;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n\n    final ServiceConnection myConnection = new ServiceConnection()\n\
  \    {\n        @Override\n        public void onServiceConnected(ComponentName\
  \ className, IBinder service) {\n            MyLocalBinder binder = (MyLocalBinder)\
  \ service;\n            myService = binder.getService();\n            isBound =\
  \ true;\n        }\n        @Override\n        public void onServiceDisconnected(ComponentName\
  \ name) {\n            isBound = false;\n        }\n    };\n}\n```\n\n当客户端成功绑定到服务时，会调用\
  \ `onServiceConnected()` 方法。该方法接收的参数是 `onBind()` 方法返回的 `IBinder` 对象。该参数被强制转换为 `MyLocalBinder`\
  \ 类型的对象。然后调用 binder 对象的 `getService()` 方法以获取服务的实例引用，随后该引用被赋值给 `myService`。一个布尔标志表示连接已成功建立。\n\
  \n当连接结束时，会调用 `onServiceDisconnected()` 方法并将布尔标志设置为 false。\n\n### 58.7 完成示例\n\n剩下的工作是编写一个调用\
  \ `getCurrentTime()` 方法的机制并将结果显示给用户。按照惯例，Android Studio 为 activity 创建了一个仅包含 `TextView`\
  \ 的 `activity_main.xml` 文件。将此文件加载到布局编辑器中，并使用设计模式选择 `TextView` 组件，将其 ID 改为 `myTextView`。在\
  \ `TextView` 下方添加 `Button` 视图，并将按钮文本更改为“Show Time”，将其提取为名为 `show_time` 的字符串资源。完成后，布局应如图\
  \ 58-1 所示。如果缺少约束，点击布局工具栏上的推断约束（Infer Constraints）按钮。\n\n![](img/as_local_bound_ui.jpg)\n\
  \n图 58-1\n\n通过选择按钮并配置 `onClick` 属性调用名为 `showTime` 的方法。最后，编辑 `MainActivity.java`\
  \ 文件代码来实现 `showTime()` 方法。该方法调用服务的 `getCurrentTime()` 方法（得益于 `onServiceConnected()`\
  \ 方法，现在可以通过 `myService` 引用从 activity 获取），并将结果赋值给 `TextView`：\n\n```java\npackage\
  \ com.ebookfrenzy.localbound;\n\n...\n\nimport android.widget.TextView;\nimport\
  \ android.view.View;\nimport com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    BoundService myService;\n\
  \    boolean isBound = false;\n\n    public void showTime(View view) {\n       \
  \ String currentTime = myService.getCurrentTime();\n        TextView myTextView\
  \ = findViewById(R.id.myTextView);\n        myTextView.setText(currentTime);\n \
  \   }\n}\n```\n\n### 58.8 测试应用程序\n\n代码修改完成后，对应用程序进行测试运行。一旦显示，触摸按钮并注意文本视图更改为显示当前日期和时间。该示例成功启动并绑定到服务，然后调用该服务的方法来执行任务，并将结果返回给\
  \ activity。\n\n### 58.9 总结\n\n\n\n\n\n当一个绑定服务是本地的且仅属于某个应用程序时，该应用程序内的组件无需借助进程间通信（IPC）即可与服务进行交互。通常情况下，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含指向运行中的服务实例的引用。客户端组件实现 `ServiceConnection`\
  \ 子类，其中包含回调方法，这些方法会在服务连接和断开连接时被调用。前者方法将接收由 `onBind()` 方法返回的 `IBinder` 对象，从而允许调用服务中的公共方法。\n\
  \n在涵盖了本地绑定服务的实现后，下一章将重点介绍使用 IPC 与远程绑定服务进行交互。\n\n# 59. Android 远程绑定服务 – 实例演示\n\n\
  在专门用于 Android 服务的最后一章，将开发一个示例应用程序，演示如何使用 `messenger` 和 `handler` 配置来促进客户端与远程绑定服务之间的交互。\n\
  \n### 59.1 客户端到远程服务的通信\n\n如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回包含服务对象引用的 `IBinder` 对象来实现。然而，对于远程服务，这种方法不可行，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\
  \n对于远程服务，必须创建一个 `Messenger` 和 `Handler` 配置，允许消息跨越客户端与服务之间的进程边界传递。\n\n具体而言，服务会创建一个\
  \ `Handler` 实例，当接收到来自客户端的消息时会调用该实例。在初始化方面，由 `Handler` 负责创建一个 `Messenger` 对象，而 `Messenger`\
  \ 又会创建一个 `IBinder` 对象，并在 `onBind()` 方法中返回客户端。客户端使用此 `IBinder` 对象创建 `Messenger` 对象的实例，随后向服务处理程序发送消息。客户端每发送一次消息，处理程序的\
  \ `handleMessage()` 方法 就会被调用一次，并传递一个 `message` 对象。\n\n本章创建的示例将包含一个运行在单独进程中的 Activity\
  \ 和一个绑定服务。`Messenger/Handler` 机制将向服务发送一个字符串，该字符串将显示在 `Logcat` 输出中。\n\n### 59.2 创建示例应用程序\n\
  \n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\
  \n在 `Name` 字段中输入 `RemoteBound`，并指定包名为 `com.ebookfrenzy.remotebound`。在点击 `Finish`\
  \ 按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。\n\n\
  ### 59.3 设计用户界面\n\n在 Project 工具窗口中找到 `activity_main.xml` 文件并双击它将其加载到 Layout Editor\
  \ 工具中。在 Layout Editor 工具的 Design 模式下，右键点击默认的 `TextView` 实例，选择 `Convert view...`\
  \ 菜单选项，从生成的对话框中选择 `Button` 并点击 `Apply`。将按钮的文本属性更改为“Send Message”，并将该字符串提取到名为 `send_message`\
  \ 的新资源中。\n\n最后，配置 `onClick` 属性以调用名为 `sendMessage` 方法。\n\n### 59.4 实现远程绑定服务\n\n为了实现此示例的远程绑定服务，在\
  \ Project 工具窗口中右键点击包名（位于 `app -> java` 下），向项目添加一个新类，并选择 `New -> Service -> Service`\
  \ 菜单选项。指定 `RemoteService` 为类名，并在点击 `Finish` 创建类之前确保勾选了 `Exported` 和 `Enabled` 选项。\n\
  \n下一步是为新服务实现处理程序类。这通过扩展 `Handler` 类并实现 `handleMessage()` 方法来实现。该方法会在接收到客户端消息时被调用。它将接收一个\
  \ `Message` 对象作为参数，其中包含客户端需要传递给服务的任何数据。在本例中，这将包含一个显示给用户的字符串的 `Bundle` 对象。实现此功能后，`RemoteService.java`\
  \ 文件中的修改后的类应如下：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\nimport android.os.Bundle;\n\
  import android.os.Handler;\nimport android.os.Looper;\nimport android.os.Message;\n\
  import android.os.Messenger;\nimport android.util.Log;\n\npublic class RemoteService\
  \ extends Service {\n\n    public RemoteService() {\n    }\n\n    static class IncomingHandler\
  \ extends Handler {\n        String TAG = \"RemoteService\";\n\n        public IncomingHandler()\
  \ {\n            super(Looper.getMainLooper());\n        }\n\n        @Override\n\
  \        public void handleMessage(Message msg) {\n            Bundle data = msg.getData();\n\
  \            String dataString = data.getString(\"MyString\");\n            Log.i(TAG,\
  \ \"Message = \" + dataString);\n        }\n\n        @Override\n        public\
  \ IBinder onBind(Intent intent) {\n            // TODO: Return the communication\n\
  \            throw new UnsupportedException(\"Not implemented\");\n        }\n \
  \   }\n\n    final Messenger myMessenger = new Messenger(new IncomingHandler());\n\
  \n    @Override\n    public IBinder onBind(Intent intent) {\n        return myMessenger.getBinder();\n\
  \    }\n}\n```\n\n实现处理程序后，服务中剩下的任务是修改 `onBind()` 方法，使其返回一个 `IBinder` 对象，该对象包含一个\
  \ `Messenger`。\n\n### 59.5 在清单文件中配置远程服务\n\n为了准确演示客户端与远程服务之间的通信，必须配置服务与应用程序的其他部分分开运行。这通过在清单文件的\
  \ `<service>` 标签内添加 `android:process` 属性来实现。为了启动远程服务，还需要提供一个意图过滤器（intent filter）。要实现此操作，修改\
  \ `AndroidManifest.xml` 添加所需的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.remotebound\">\n\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  >\n\n        <service\n            android:name=\".RemoteService\"\n           \
  \ android:enabled=\"true\"\n            android:exported=\"true\"\n            android:process=\"\
  :my_process\" />\n\n        <activity\n            android:name=\".MainActivity\"\
  >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n### 59.6 启动并绑定到远程服务\n\n\n\n\n\n与本地绑定服务一样，客户端组件需要实现 `ServiceConnection` 类的实例，并包含\
  \ `onServiceConnected()` 和 `onServiceDisconnected()` 方法。此外，与本地服务相同，`onServiceConnected()`\
  \ 方法将接收由远程服务的 `onBind()` 方法返回的 `IBinder` 对象，该对象将用于向服务器处理器发送消息。在本例中，客户端是 `MainActivity`，其代码位于\
  \ `MainActivity.java` 中。加载此文件并对其进行修改，以添加 `ServiceConnection` 类以及一个用于存储接收到的 `Messenger`\
  \ 对象引用的变量，以及一个用于指示连接是否建立的 `Boolean` 标志位：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  \nimport android.os.IBinder;\nimport android.os.Message;\nimport android.os.Messenger;\n\
  import android.os.RemoteException;\n\nimport android.content.ComponentName;\n\n\
  import android.content.Context;\n\nimport android.content.Intent;\n\nimport android.content.ServiceConnection;\n\
  \nimport android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Messenger myService = null;\n    boolean isBound;\n\n    final private\
  \ ServiceConnection myConnection =\n        new ServiceConnection() {\n        \
  \    public void onServiceConnected(\n                        ComponentName className,\n\
  \                        IBinder service) {\n                myService = new Messenger(service);\n\
  \                isBound = true;\n            }\n            public void onServiceDisconnected(\n\
  \                        ComponentName className) {\n                myService =\
  \ null;\n                isBound = false;\n            }\n        };\n}\n```\n\n\
  接下来，必须添加一些代码来绑定到远程服务。这涉及到创建一个与清单文件中声明的服务的意图过滤器匹配的 `intent`，然后调用 `bindService()`\
  \ 方法，并将 `intent` 和 `ServiceConnection` 实例引用作为参数提供。对于此示例，这些代码将在 Activity 的 `onCreate()`\
  \ 方法中实现：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(getApplicationContext(),\n                     \
  \           RemoteService.class);\n    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n\
  }\n```\n\n### 59.7 向远程服务发送消息\n\n在测试应用程序之前，剩下的工作是在 `MainActivity` 类中实现 `sendMessage()`\
  \ 方法，该方法被配置为在用户触摸界面上的按钮时调用。此方法需要检查服务是否已连接，创建一个包含要由服务器显示的字符串的 `bundle` 对象，将其添加到服务器并发送给它：\n\
  \n```java\npublic void sendMessage(View view) {\n    if (!isBound) return;\n   \
  \ Message msg = Message.obtain();\n    Bundle bundle = new Bundle();\n    bundle.putString(\"\
  String\", \"Received\");\n    msg.setData(bundle);\n    try {\n        myService.sendMessage(msg);\n\
  \    } catch (RemoteException e) {\n        e.printStackTrace();\n    }\n}\n```\n\
  \n### 59.8 总结\n\n为了实现客户端与绑定服务之间的通信，应用必须实现一个处理器。该技术背后的基本概念在本章中已经介绍。\n\n## 60. 线程、处理器和执行器概述\n\
  \n线程是任何多任务操作系统的基石，可以被视为微进程。在本章中，我们将探索它们是如何创建和管理的。\n\n### 60.1 应用线程\n\n当 Android\
  \ 应用首次启动时，运行时会创建一个线程，所有组件都在该线程运行。此线程通常被称为主线程。主线程的主要作用是处理用户界面。任何启动的额外组件默认也会在主线程上运行。任何使用主线程执行耗时任务的组件会导致整个应用程序锁定。\n\
  \n### 60.2 线程处理器\n\nAndroid 开发的关键规则之一是永远不要在主线程上执行耗时操作。第二个同样重要的规则是，独立线程中的代码绝禁直接更新用户界面的任何部分。对用户界面的任何更改必须在主线程内部执行。如果在线程中执行的代码需要与用户界面交互，它必须通过与主\
  \ UI 线程同步来实现。\n\n### 60.3 线程示例\n\n本章的剩余部分将通过一些简单的示例，旨在对线程提供基础介绍。第一步将强调在主线程之外的线程中执行耗时任务的重要性。\n\
  \n启动 Android Studio，从欢迎界面选择 New Project（新建项目）选项，在生成的新项目对话框中，点击 Next（下一步）按钮之前选择 Empty\
  \ Activity（空活动）模板。\n\n在 Name（名称）字段中输入 `ThreadExample`，并指定 `com.ebookfrenzy.threadexample`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level（最低 API 级别）设置为 API 26: Android 8.0 (Oreo)，并将\
  \ Language（语言）菜单设置为 Java。\n\n### 60.4 构建应用\n\n将项目的 `activity_main.xml` 文件加载到 Layout\
  \ Editor 工具中。选择默认的 `TextView` 组件，并在属性窗口中将视图 ID 更改为 `myTextView`。\n\n向用户界面添加一个直接位于现有\
  \ `TextView` 对象下方的 `Button`。一旦添加了按钮，点击工具栏上的 Infer Constraints（推断约束）按钮以添加缺失的约束。\n\
  \n\n\n\n\n将文本改为“Press Me”，并将其字符串提取为名为 `press_me` 的资源。在布局中仍选中按钮视图的情况下，找到 `onClick`\
  \ 属性并输入 `buttonClick` 作为方法名。\n\n![](img/as_thread_example_ui_one_button.jpg)\n图\
  \ 60-1\n\n接下来，将 `MainActivity.java` 文件加载到编辑面板，并为 `buttonClick()` 方法添加代码，该方法将在用户点击\
  \ `Button` 视图时被调用。由于此的目标是演示在主线程上执行耗时任务的问题，代码将在 `TextView` 对象上显示不同的文本之前简单地暂停 20 秒：\n\
  \n```java\npublic void buttonClick(View view) {\n    long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n    while (System.currentTimeMillis() < endTime) {\n        synchronized\
  \ (this) {\n            try {\n                wait(endTime - System.currentTimeMillis());\n\
  \            } catch (Exception e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"\
  Button Pressed\");\n}\n```\n\n代码更改完成后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，点击按钮，此时应用程序将看起来假死。例如，将无法第二次点击按钮，在某些情况下，操作系统将报告应用程序无响应，如\
  \ [Java_Threads.xhtml__idTextAnchor1184] 所示。\n\n![](img/as_4.2_threadexample_not_responding.jpg)\n\
  图 60-2\n\n显然，`buttonClick()` 方法中任何需要时间完成的任务都需要在单独的线程中执行。\n\n### 60.5 创建新线程\n\n要创建一个新线程，需要将在该线程中执行的代码放置在\
  \ `Runnable` 实例的 `run()` 方法中。然后，需要创建一个新的 `Thread` 对象，并将 `Runnable` 实例的引用传递给构造函数。最后，需要调用线程对象的\
  \ `start()` 方法来启动线程运行。因此，要在 `buttonClick()` 方法中执行任务，需要进行以下更改：\n\n```java\npublic\
  \ void buttonClick(View view) {\n    Runnable runnable = new Runnable() {\n    \
  \    public void run() {\n            long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n            while (System.currentTimeMillis() < endTime) {\n   \
  \             synchronized (this) {\n                    try {\n               \
  \         wait(endTime - System.currentTimeMillis());\n                    } catch\
  \ (Exception e) {\n                    }\n                }\n            }\n   \
  \     }\n        binding.myTextView.setText(\"Button Pressed\");\n    };\n    Thread\
  \ myThread = new Thread(runnable);\n    myThread.start();\n}\n```\n\n事实上，如果需要，可以使用\
  \ Java Lambda 表达式来简化 `runnable` 的声明。此更改将导致如下声明：\n\n```java\n    Runnable runnable\
  \ = () -> {\n        long endTime = System.currentTimeMillis() + 20 * 1000;\n  \
  \      while (System.currentTimeMillis() < endTime) {\n            synchronized\
  \ (this) {\n                try {\n                    wait(endTime - System.currentTimeMillis());\n\
  \                } catch (Exception e) {\n                }\n            }\n   \
  \     }\n    };\nThread myThread = new Thread(runnable);\nmyThread.start();\n```\n\
  \n现在运行应用程序时，触摸按钮会导致延迟在新线程中执行，留出主线程继续处理用户界面。事实上，每当触摸按钮时，都会创建一个新线程，允许任务执行多次。仔细检查 `buttonClick()`\
  \ 方法的更新后的代码，会发现更新 `TextView` 的代码已被移除。如前所述，从主线程以外的线程更新用户界面违反了 Android 开发的一项关键规则。因此，要更新用户界面，需要为线程实现一个\
  \ `Handler`。\n\n### 60.6 实现线程处理器 (Thread Handler)\n\n线程处理器在应用程序的主线程中实现，主要用于响应由应用程序进程内运行的其他线程发送的消息来更新用户界面。Handler\
  \ 是自 Android `Handler` 类的子类，可以通过指定要由线程执行的 `Runnable`，或者通过重写 `Handler` 子类中的 `handleMessage()`\
  \ 回调来使用，当消息发送到处理器时，该回调将被调用。\n\n为了本例，将实现一个处理器，以便从之前创建的线程内部更新用户界面。将 `MainActivity.java`\
  \ 文件加载到 Android 编辑器并修改代码，为活动添加一个 `Handler` 实例：\n\n```java\nimport android.os.Handler;\n\
  import android.os.Message;\nimport android.os.Looper;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    Handler handler = new Handler(Looper.getMainLooper())\
  \ {\n        @Override public void handleMessage(Message msg) {\n            binding.myTextView.setText(\"\
  Message Received\");\n        }\n    };\n}\n```\n\n上述代码更改声明了一个处理器，并在该处理器中实现了 `handleMessage()`\
  \ 回调，当线程向处理器发送消息时将调用该回调。在此实例中，代码简单地在用户界面的 `TextView` 对象上显示字符串。\n\n现在剩下的只需修改 `buttonClick()`\
  \ 方法创建的线程，在延迟完成后向处理器发送消息：\n\n```java\npublic void buttonClick(View view) {\n   \
  \ Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        handler.sendEmptyMessage(0);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n注意，唯一的更改是调用了处理器的 `sendEmptyMessage()` 方法。由于处理器目前没有对接收的消息进行任何操作，它接收的是空对象。编译并运行应用程序，执行后点击按钮。20\
  \ 秒后，新文本将出现在 `TextView` 对象中。\n\n### 60.7 向处理器传递消息\n\n虽然之前的示例触发了 `handleMessage()`\
  \ 回调，但它没有利用消息对象向处理器发送数据。在教程的这一阶段，将进一步修改示例以便在线程和处理器之间传递数据。首先，`buttonClick()` 方法中更新的线程将从系统获取字符串格式的日期和时间，将其存储在\
  \ `Bundle` 对象中。然后调用处理器的 `obtainMessage()` 方法获取消息对象。最后，在通过调用处理器的 `sendMessage()`\
  \ 方法发送之前，将 `bundle` 添加到消息对象中：\n\n```java\npublic void buttonClick(View view) {\n\
  \    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        Message msg = handler.obtainMessage();\n\
  \        Bundle bundle = new Bundle();\n    };\n    Thread myThread = new Thread(runnable);\n\
  \    myThread.start();\n}\n```\n\n\n\n\n\n```java\nbundle.putString(\"myKey\", \"\
  Thread Completed\");\nmsg.setData(bundle);\nhandler.sendMessage(msg);\n};\n\nThread\
  \ myThread = new Thread(runnable);\nmyThread.start();\n}\n```\n\n接下来，更新 `handler`\
  \ 的 `handleMessage()` 方法，从消息的 `bundle` 对象中提取日期和时间字符串，并将其显示在 `TextView` 对象上：\n\n\
  ```java\nHandler handler = new Handler(Looper.getMainLooper()) {\n    @Override\n\
  \    public void handleMessage(Message msg) {\n        Bundle bundle = msg.getData();\n\
  \        String string = bundle.getString(\"myKey\");\n        binding.myTextView.setText(string);\n\
  \    }\n};\n```\n\n最后，编译并运行应用程序，测试点击按钮后是否在线程结束后，`TextView` 对象上会显示“Thread Complete”消息。\n\
  \n# 60.8 Java Executor 并发\n\n在这一章的目前为止，我们专门查看了如何直接创建和管理 Java 线程。虽然对于简单的多线程任务来说是可以的，但在处理涉及大量线程的复杂情况时，这可能证明是不够的。例如，启动和停止线程涉及到系统开销。因此，创建一个并销毁大量线程的应用程序面临性能下降的风险。基础线程\
  \ API 也没有提供调度或重复执行任务的、或从任务返回结果的预构建选项。\n\n通过使用 Java 并发框架的 `Executor` 类（是 `java.util.concurrent`\
  \ 包的部），可以克服直接操作线程的缺点。该框架允许创建活动线程池，并管理如何将任务分配给这些线程。这使得现有线程可以重用于其他任务，而不需要不断创建新线程。\n\
  \n该框架还提供了额外的功能，包括在任务完成后返回结果的能力（称为 `Callable` 任务）、检查线程状态，以及调度任务在超时后或重复的时间间隔内运行。\n\
  \n# 60.9 使用 Runnable 任务\n\n探索该框架的第一步是修改 `buttonClicked()` 方法，使用并发框架 `Executor` 在单独线程中运行任务：\n\
  \n```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  \npublic void buttonClick(View view) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(new Runnable() {\n        public void run() {\n           \
  \ long endTime = System.currentTimeMillis() + 10 * 1000;\n            while (System.currentTimeMillis()\
  \ < endTime) {\n                synchronized (this) {\n                    try {\n\
  \                        wait(endTime - System.currentTimeMillis());\n         \
  \           } catch (Exception e) {\n                    }\n                }\n\
  \            }\n            Message msg = handler.obtainMessage();\n           \
  \ Bundle bundle = new Bundle();\n            bundle.putString(\"myKey\", \"Button\
  \ Pressed\");\n            msg.setData(bundle);\n            handler.sendMessage(msg);\n\
  \        }\n    });\n    executor.shutdown();\n}\n```\n\n当执行上述代码时，超时将像以前一样在单独线程上执行。然而，对方法进行的更改需要一些解释。首先，从\
  \ `Executors` 实例获取获取 `ExecutorService` 实例的引用：\n\n`ExecutorService executor = Executors.newSingleThreadExecutor();`\n\
  \n在这种情况下，请求了一个仅包含一个线程的池。可以通过以下方式请求具有指定线程数量的池：\n\n`ExecutorService executor = Executors.newThreadPool(10);`\n\
  \n接下来，通过调用 `executor` 实例的 `submit()` 方法，在线程上启动 `Runnable` 任务：\n\n```java\nexecutor.submit(new\
  \ Runnable(){\n    public void run(){\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n    }\n});\n```\n\n注意，上述声明可以通过转换为 lambda 表达式来简化：\n\n```java\nexecutor.submit(()\
  \ -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n});\n```\n\n\
  从此开始，任务将运行直到完成。然而，如果你不再需要该服务，可以使用：\n\n## 60.10 关闭 Executor 服务\n\n`ExecutorService`\
  \ 提供了几种启动关闭的技术。为了在当前运行的任务完成后自动通知服务，应该调用 `shutdown()` 方法：\n\n`executor.shutdown();`\n\
  \n另一方面，调用 `shutdownNow()` 方法停止所有运行的任务并取消挂起的任务：\n\n`executor.shutdownNow();`\n\n\
  ## 60.11 使用 Callable 任务和 Future\n\n如前所述，`ExecutorService` 支持在任务完成后返回结果的“Callable”任务。这引发了关于如何将结果返回给启动线程的问题。这是通过使用\
  \ `Future` 类型来实现的，它代表未来某个点将提供的值。\n\n当执行 `callable` 任务时，它返回一个 `Future` 实例，随后可以使用它来获取结果。为了看到此效果，首先通过编辑\
  \ `activity_main.xml` 文件添加一个标记为“Status”的按钮，其 `onClick` 属性配置为调用名为 `statusClick` 的方法：\n\
  \nimage/thread_example_ui.jpg\n图 60-3\n\n接下来，修改 `buttonClick()` 方法通过 `Future` 变量执行返回值的\
  \ `Callable` 任务：\n\n```java\nimport java.util.concurrent.Callable;\nimport java.util.concurrent.Future;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    Future<String> future;\n\
  \n    public void buttonClick(View view) {\n        ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \        future = executor.submit(new Callable<String>() {\n            public String\
  \ call() {\n                long endTime = System.currentTimeMillis() + 10 * 1000;\n\
  \                while (System.currentTimeMillis() < endTime) {\n              \
  \      synchronized (this) {\n                        try {\n                  \
  \          wait(endTime - System.currentTimeMillis());\n                       \
  \ } catch (Exception e) {\n                        }\n                    }\n  \
  \              }\n                return(\"Thread Completed\");\n            }\n\
  \        });\n        executor.shutdown();\n    }\n}\n```\n\n# 60.12 处理 Future 结果\n\
  \n\n\n\n\n`buttonClick()` 方法现在已配置为启动一个 `Callable` 任务，并将返回值赋值给 `Future` 变量。应用程序现在需要知道任务何时完成以及结果何时可用。其中一种方案是调用\
  \ `Future` 变量的 `get()` 方法。由于该方法在执行失败或被中断时可能会抛出异常，因此必须在 `try/catch` 语句中执行，如下文所示：\n\
  \n```java\nString result = null;\n\ntry {\n    result = future.get();\n} catch (ExecutionException\
  \ | InterruptedException e) {\n    e.printStackTrace();\n}\n```\n\n遗憾的是，`get()`\
  \ 方法会阻塞当前线程，直到线程中运行的任务完成，这实际上违背了最初在独立线程中运行任务的初衷。另一个方案是为 `get()` 方法调用提供一个超时时间，到期后它会将控制权返回给当前线程。例如，以下代码将导致\
  \ `get()` 调用在 3 秒后超时：\n\n```java\nresult = future.get(3, TimeUnit.SECONDS);\n```\n\
  \n然而，更好的替代方案是调用 `Future` 实例的 `isDone()` 方法来检查线程状态，仅在任务完成后再调用 `get()` 方法。为了实现这一行为，请如下所示在\
  \ `MainActivity.java` 文件中添加 `statusClick()` 方法：\n\n```java\nimport java.util.concurrent.ExecutionException;\n\
  import java.util.concurrent.TimeUnit;\nimport java.util.concurrent.TimeoutException;\n\
  \npublic void statusClick(View view) {\n    if ((future != null && future.isDone())\
  \ {\n        String result = null;\n        try {\n            result = future.get(3,\
  \ TimeUnit.SECONDS);\n        } catch (ExecutionException | InterruptedException\
  \ | TimeoutException e) {\n            e.printStackTrace();\n        }\n       \
  \ binding.myTextView.setText(result);\n    } else {\n        binding.myTextView.setText(\"\
  Waiting\");\n    }\n}\n```\n\n完成更改后，运行应用并点击“Press Me”按钮。在任务运行期间，点击“Status”按钮。只要任务仍在运行，`TextView`\
  \ 中就会显示“Waiting”消息。然而，一旦任务完成，`isDone()` 方法将返回 `true` 值，随后调用 `get()` 方法，且任务返回的字符串（“Task\
  \ Complete”）将显示在 `TextView` 上。\n\n### 60.13 调度任务\n\n最后一个涵盖的领域涉及使用 `ExecutorService`\
  \ 来调度任务执行。这涉及到使用 `ScheduledExecutorService` 实例，并在该实例上调用 `schedule()` 方法，传递要执行的 `Runnable`\
  \ 任务以及一个时间延迟。`schedule()` 调用将返回一个 `ScheduledFuture` 实例，该实例可以识别任务到期开始前的剩余时间。\n\n\
  例如，以下代码调度了一个在 30 秒后运行的任务并访问了剩余的延迟时间：\n\n```java\nScheduledExecutorService executor\
  \ = Executors.newScheduledThreadPool(1);\nRunnable task = () -> {\n    // 在此处执行任务的代码\n\
  };\nScheduledFuture<?> future = executor.schedule(task, 30, TimeUnit.SECONDS);\n\
  long delayRemaining = future.getDelay(TimeUnit.SECONDS);\n```\n\n同样，`ScheduledExecutorService`\
  \ 可用于在可选的初始延迟后，按固定间隔重复执行任务。例如，以下代码导致任务在初始 30 秒延迟后每隔 10 秒执行一次：\n\n```java\nexecutor.scheduleAtFixedRate(task,\
  \ 30, 10, TimeUnit.SECONDS);\n```\n\n`scheduleAtFixedRate()` 方法无论上一个调度的任务是否完成，都会启动任务的下一个实例。要指定一个任务执行结束与下一次执行开始之间的固定时间，请使用\
  \ `scheduleWithFixedDelay()` 方法。在以下示例中，第一个任务在 0 秒延迟后调度，随后的每次执行都会在前一个任务完成 10 秒后进行：\n\
  \n```java\nexecutor.scheduleWithFixedDelay(task, 0, 10, TimeUnit.SECONDS);\n```\n\
  \n### 60.14 总结\n\n本章的目标是提供 Android 应用中线程的概述。当应用程序首次在进程中启动时，运行时系统会创建一个主线程，所有随后启动的应用组件默认都会在该线程中运行。主线程的主要作用是处理用户界面，因此在该线程中执行的任何耗时任务都会让应用程序看起来像死掉了。因此，将可能需要时间完成的任务启动在独立线程中是至关重要的。\n\
  \n由于 Android 用户界面工具包不是线程安全的，因此不应在主线程以外的任何线程中更改用户界面。可以通过在主线程中创建一个 `handler` 来实现用户界面更改，从其他非主线程向其发送消息。\n\
  \n线程可以直接创建，也可以使用 Java 并发框架的执行器服务。对于更复杂的线程需求，该框架提供了线程池的自动管理、任务结果的返回以及执行调调度。\n\n##\
  \ 61. 在 Android 中请求运行时权限\n\n在前面的章节中创建的许多示例项目中，已对 `AndroidManifest.xml` 文件进行了修改，以请求应用执行特定任务的权限。例如，在某些实例中，请求了互联网访问权限以允许应用下载和显示网页。在到此为止的每种情况下，只需在清单文件中添加请求，应用程序即可获得用户许可执行指定任务的权限。\n\
  \n然而，在 Android 6.0 或更高版本上运行时，某些权限需要额外的步骤才能让应用运行。这些所谓的“危险”权限中的第一个将在下一节介绍。在此之前，本章将概述在最新版本的\
  \ Android 上请求此类权限的步骤。\n\n### 61.1 理解普通权限和危险权限\n\nAndroid 通过要求用户授予应用执行某些任务的权限来确保安全性。在\
  \ Android 6 出现之前，总是在安装应用时请求权限。例如，图 61-1 显示了通过 Google Play 安装应用时寻求各种权限的典型界面。\n\n\
  对于许多类型的权限，这种情况对 Android 6.0 或更高版本的应用仍然适用。这些权限被称为“普通权限”，仍要求在安装时由用户接受。第二类权限被称为“危险权限”，必须以普通权限相同的方式在清单文件中声明，但必须在应用程序首次启动时向用户请求。当发出此类请求时，它将以对话框的形式出现，如图\
  \ 61-2 所示。\n\n属于危险类的权限完整列表包含在表 61-1 中：\n\n| 权限组 | 权限 |\n| :--- | :--- |\n| Calendar\
  \ | READ_CALENDAR,WRITE_CALENDAR |\n| 相机 | CAMERA |\n| 联系人 | READ_CONTACTS,WRITE_CONTACTS,GET_ACCOUNTS\
  \ |\n| 位置 | ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION |\n| 麦克风 | RECORD_AUDIO\
  \ |\n| 通知 | POST_NOTIFICATIONS |\n| 电话 | READ_PHONE_STATE,CALL_PHONE,READ_CALL_LOG,WRITE_CALL_LOG,ADD_VOICEMAIL,USE_SIP,PROCESS_OUTGOING_CALLS\
  \ |\n| 传感器 | BODY_SENSORS |\n| 短信 | SEND_SMS,RECEIVE_SMS,READ_SMS,RECEIVE_WAP_PUSH,RECEIVE_MMS\
  \ |\n| 存储 | MANAGE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE\
  \ |\n\n\n\n\n\n`MANAGE_EXTERNAL_STORAGE` 权限允许应用访问设备外部存储上的所有文件，包括属于其他应用的文件。因此，只有当\
  \ Google 在审核过程中验证您的应用需要此级别的访问权限时，该权限才会对您的应用启用。为了在提交到 Google Play 商店之前对其进行测试，可以执行以下\
  \ `adb` 命令来临时为测试设备上的应用启用访问权限：\n\n```bash\nadb shell appops set --uid <package name>\
  \ MANAGE_EXTERNAL_STORAGE allow\n```\n\n可以通过以下方式关闭此模式：\n\n```bash\nadb shell appops\
  \ set --uid <package name> MANAGE_EXTERNAL_STORAGE default\n```\n\n### 61.2 创建项目\n\
  \n从欢迎界面选择 `New Project` 选项，并在弹出的项目对话框中点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。在\
  \ `Name` 字段输入 `PermissionDemo` 并指定 `com.ebookfzy.permissiondemo` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。\n\
  \n### 61.3 检查权限\n\nAndroid Support Library 包含了多个方法，用于在 Android 代码中查找和管理危险权限。这些 API\
  \ 调用无论在何种 Android 版本上运行都是安全的，但要在 Android 6.0 或更高版本上才会执行相应的任务。\n\n在应用尝试使用需要危险权限的功能之前，无论之前是否授予了权限，都必须检查权限是否已授予。这可以通过调用\
  \ `Compat` 类的 `checkSelfPermission()` 方法来实现，并将当前应用的引用和请求的权限作为参数。该方法将检查权限是否已授予并返回与\
  \ `PackageManager.PERMISSION_GRANTED` 匹配的整数值或拒绝值。\n\n在示例项目的 `MainActivity.java`\
  \ 文件中，修改代码以检查是否授予了录音权限：\n\n```java\npackage com.ebookfzy.permissiondemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.os.Bundle;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\nimport android.util.Log;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private static final String TAG\
  \ = \"PermissionDemo\";\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setupPermissions();\n\
  \    }\n\n    private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n        }\n    }\n\
  }\n```\n\n编辑 `AndroidManifest.xml` 文件（位于项目窗口 `app` -> `manifests` 下），添加以下行以请求权限：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfzy.permissiondemo\"\
  \ >\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n\
  \    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\" >\n        <activity android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n在设备或模拟器上运行应用并打开 `Logcat` 窗口。注意，权限被拒绝是因为 Android 要求除了在清单文件中添加请求外，应用还在运行时请求权限。\n\
  \n### 61.4 运行时请求权限\n\n通过调用 `ActivityCompat` 类的 `requestPermissions()` 方法进行权限请求。当调用此方法时，权限请求将异步处理，并在任务完成后将调用名为\
  \ `onRequestResult()` 的方法。\n\n`requestPermissions()` 方法的参数是当前应用的引用、请求权限的标识符和一个请求代码。请求代码可以是任意整数值，用于标识是哪个请求触发了\
  \ `onRequestResult()` 方法。修改 `MainActivity.java` 文件以声明请求代码，并在权限检查失败时请求权限：\n\n```java\n\
  import androidx.core.app.ActivityCompat;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final String TAG = \"PermissionDemo\";\n    private static\
  \ final int RECORD_REQUEST_CODE = 101;\n\n    @Override\n    private void setupPermissions()\
  \ {\n        int permission = ContextCompat.checkSelfPermission(this,\n        \
  \        Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n            makeRequest();\n\
  \        }\n    }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \                new String[]{Manifest.permission.RECORD_AUDIO},\n             \
  \   RECORD_REQUEST_CODE);\n    }\n}\n```\n\n接下来，实现 `onRequestPermissionsResult()`\
  \ 方法，内容如下：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n\
  \        @NonNull String[] permissions, @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == RECORD_REQUEST_CODE) {\n \
  \       if (grantResults.length == 0\n                || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission has been denied by user\");\n        }\
  \ else {\n            Log.i(TAG, \"Permission has been granted by user\");\n   \
  \     }\n    }\n}\n```\n\n在模拟器或设备上编译并运行应用，注意会出现一个请求录音权限的对话框，如图 61-3 所示：\n\n![](img/android_permission_request.jpg)\n\
  \n图 61-3\n\n点击“在使用应用时”按钮，并检查 `Logcat` 面板是否出现了“权限已授予”的消息。\n\n一旦用户授予了请求的权限，在后续的应用调用中`checkSelfPermission()`\
  \ 方法将返回 `PERMISSION_GRANTED` ，直到用户卸载并重新安装应用或在“设置”中更改应用权限。\n\n### 61.5 为权限请求提供理由\n\
  \n如图 61-3 所示，用户可以拒绝请求的权限。在这种情况下，除非用户在点击“拒绝”按钮之前选择了“不再询问”，否则应用在用户每次启动它时都会继续请求权限。用户的多次拒绝可能表明用户不理解为什么应用需要该权限。因此，如果在使用请求时解释这些需求的原因，用户可能更容易授予权限。遗憾的是，无法更改请求对话框的内容以包含此类解释。\n\
  \n\n\n最好的解释是包含在一个独立的对话框中，该对话框可以在向用户展示请求对话框之前显示。这引发了一个何时显示此解释对话框的问题。Android 文档建议，只有当用户之前拒绝过权限且提供了一种方法来识别此类情况时，才显示解释对话框。\n\
  \n调用 `ActivityCompat` 类的 `shouldShowRequestPermissionRationale()` 方法，如果用户之前拒绝过对特定权限的请求，将返回\
  \ `true` 结果；如果之前未发出过请求，则返回 `false` 结果。在结果为 `true` 的情况下，应用应该显示一个包含权限所需的对话框，一旦用户阅读并关闭了该对话框，就应该重复权限请求。\n\
  \n要向示例应用中添加此功能，请修改 `onCreate()` 方法使其如下所示：\n\n```java\nimport android.app.AlertDialog;\n\
  \nprivate void setupPermissions() {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.RECORD_AUDIO);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        Log.i(TAG, \"Permission to record denied\");\n        if (ActivityCompat.shouldShowRequestPermissionRationale(this,\n\
  \                Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder =\n                    new AlertDialog.Builder(this);\n            builder.setMessage(\"\
  Permission to access the microphone is required for this app to record audio.\"\
  )\n                    .setTitle(\"Permission required\");\n            builder.setPositiveButton(\"\
  OK\",\n                    (dialog, id) -> makeRequest());\n            AlertDialog\
  \ dialog = builder.create();\n            dialog.show();\n        } else {\n   \
  \         makeRequest();\n        }\n    }\n}\n```\n\n该方法仍然检查权限是否已授予，但现在还会识别是否需要显示解释。如果用户之前拒绝了请求，则会显示一个包含解释和\
  \ OK 按钮的对话框，该按钮配置了一个监听器，在点击按钮时调用 `makeRequest()` 方法。如果之前没有请求权限，代码将直接跳转到寻求权限。\n\n\
  ### 61.6 测试权限应用\n\n在执行测试的设备或模拟器会话上，启动 `Settings` 应用，选择 `Apps` ，滚动并选择 `PermissionDemo`\
  \ 应用。在应用设置屏幕上，点击卸载按钮移除该应用。\n\n重新运行应用，当权限请求对话框出现时，点击 `Don’t allow` 按钮。停止并重启应用，验证解释对话框是否出现。点击\
  \ `OK` 按钮，并在权限请求对话框出现时点击 `While using the app` 按钮。\n\n返回 `Settings` 应用，选择 `Apps`\
  \ 选项，再次从列表中选择 `PermissionDemo` 应用。一旦列出应用的设置，验证 `Permissions` 部分是否列出了麦克风权限。\n\n返回\
  \ `Settings` 应用，选择 `Apps` 选项，再次从列表中选择 `PermissionDemo` 应用。一旦列出应用的设置，验证 `Permissions`\
  \ 部分是否列出了麦克风权限：\n\n![](img/as_permission_microphone.jpg)\n\n图 61-4\n\n### 61.7 总结\n\
  \n在 Android 6.0 引入之前，应用请求访问某些功能的权限的唯一必要步骤是在应用程序清单文件（manifest file）中添加适当的行。用户在安装应用时将会在提示下批准该权限。对于大多数权限，情况仍然如此，但一组被认为是“危险”的权限除外。被认为危险的权限通常具有允许应用违反用户隐私的，例如允许访问麦克风、联系人列表或外部存储。\n\
  \n正如本章所概述的，基于 Android 6 或更高版本的应用现在必须在应用启动时向用户请求危险权限的批准，并在清单文件中包含权限请求。\n\n# 62. Android\
  \ 通知教程\n\n通知为应用提供了一种方式，在应用未运行或当前处于后台时向用户传达消息。例如，消息应用可能会通知用户有新消息到达。通知可以分为本地通知和远程通知。本地通知由设备上的应用本身触发。相反，远程通知由远程服务器启动并递送到设备。\n\
  \n### 62.1 通知概览\n\n当在 Android 设备上启动通知时，它会作为状态栏中的一个图标出现。例如，`Figure 62-1` 显示了一个带有通知图标的状态栏：\n\
  \n![](img/2425.jpg)\n\n图 62-1\n\n要查看通知，用户需要从状态栏开始向下滑动的动作以拉下通知栏，如 `Figure 62-2` 所示：\n\
  \n![](img/11.jpg)\n\n图 62-2\n\n在运行 Android 8 或更高版本的设备上，对应用启动器图标进行长按将显示与该应用相关的任何待处理通知，如\
  \ `Figure 62-3` 所示：\n\n![](img/2442.jpg)\n\n图 62-3\n\nAndroid 8 及更高版本还支持通知点，当有通知等待用户查看时，该点会出现在启动器图标上。\n\
  \n典型的通知将显示一条消息，并在点击时启动负责该通知的应用。通知还可能包含操作按钮，在点击这些按钮时可以执行对应应用的特定任务。例如，`Figure 62-4`\
  \ 显示了一个包含两个操作按钮的通知，允许用户删除或保存入站消息：\n\n![](img/2450.jpg)\n\n图 62-4\n\n用户还可能在通知中输入内联文本回复并发送给应用，如下方的\
  \ `Figure 62-5` 所示。这允许用户在不将相应应用切换到前台的情况下响应通知：\n\n![](img/2458.jpg)\n\n图 62-5\n\n\
  本章的剩余部分将介绍创建和发布包含操作的简单通知。直接回复支持的主将在下一章“Android 直接回复教程”中介绍。\n\n## 62.2 创建 NotifyDemo\
  \ 项目\n\n在欢迎屏幕上选择 `New Project` 选项，并在出现的新项目对话框中选择 `Empty Views Activity` 模板，然后点击\
  \ `Next` 按钮。\n\n在 `Name` 字段中输入 `NotifyDemo`，并在 `package name` 中指定 `com.ebookfrenzy.notifydemo`。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 33: Android 13 (Tiramisu)`并将 `Language`\
  \ 菜单更改为 `Java`。\n\n### 62.3 设计用户界面\n\n\n\n\n\n主活动将包含单个按钮，其目的是创建并发出意图（intent）。在布局编辑器（Layout\
  \ Editor）工具中找到并加载 `activity_main.xml` 文件，并删除默认的 `TextView` 部件。\n\n在启用自动连接（Autoconnect）的情况下，从面板中拖放\
  \ `Button` 对象到布局画布的中心，如图 62-6 所示。\n\n在布局中选中 `Button` 部件后，使用属性面板（Attributes panel）配置\
  \ `onClick` 属性以调用名为 `sendNotification` 的方法。\n\n![](img/as_notification_ui.jpg)\n\
  \n图 62-6\n\n选择 `Button` 部件，在属性工具窗口中将文本（text）属性改为“Notify”，并将属性值提取到字符串资源。\n\n### ##\
  \ 62.4 创建第二个 Activity\n\n在本示例中，应用将包含第二个活动，该活动将由用户从通知内部启动。右键点击位于 `app` -> `java`\
  \ 下的 `com.ebookfrenzy.notifydemo` 包名，并选择 `New` -> `Activity` -> `Empty Views Activity`\
  \ 菜单选项以显示新建 Android Activity 对话框。\n\n在 Activity Name（活动名称）字段中输入 `ResultActivity`，并将布局文件命名为\
  \ `activity_result`。由于此活动在应用启动时不会启动（而是通过通知内部的意图启动），因此在点击 Finish（完成）按钮之前，确保禁用 Launcher\
  \ Activity（启动器活动）选项。\n\n打开第二个活动的布局（`app` -> `res` -> `layout` -> `activity_result.xml`），并拖放\
  \ `TextView` 部件使其位于布局中心。编辑 `TextView` 的文本使其显示为“Result Activity”，并将属性值提取到字符串资源。\n\
  \n### ## 62.5 创建通知通道\n\n在应用发送通知之前，它必须创建一个通知通道。通知通道由三部分组成：在应用内唯一标识通道的 ID、通道名称以及通道描述（只有后两个对用户可见）。通道通过配置\
  \ `NotificationChannel` 实例，然后将该对象传递给 `NotificationManager` 类的 `createNotificationChannel()`\
  \ 方法创建。在本示例中，应用将包含一个名为“NotifyDemo News”的单一通知通道。编辑 `MainActivity.java` 文件并实现应用启动时创建通道的代码：\n\
  \n```java\nimport android.app.NotificationManager;\nimport android.app.NotificationChannel;\n\
  import android.content.Context;\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    NotificationManager notificationManager;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n\n        notificationManager = (NotificationManager)\n\
  \                getSystemService(Context.NOTIFICATION_SERVICE);\n\n        createNotificationChannel(\n\
  \                \"com.ebookfrenzy.notifydemo.news\",\n                \"NotifyDemo\
  \ News\",\n                \"Example News Channel\");\n    }\n\n    protected void\
  \ createNotificationChannel(String id, String name,\n            String description)\
  \ {\n        int importance = NotificationManager.IMPORTANCE_LOW;\n        NotificationChannel\
  \ channel =\n                new NotificationChannel(id, name, importance);\n  \
  \      channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLightColor(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(\n                new long[]{100, 200, 300,\
  \ 400, 500, 400, 300, 200, 400});\n        notificationManager.createNotificationChannel(channel);\n\
  \    }\n}\n```\n\n该代码声明并初始化了一个 `NotificationManager` 实例，然后带有低重要性级别（其他选项为高、min、none）的名称和描述创建新通道。通知中还添加了可选设置。最后，通过传递通道对象创建通道。\n\
  \n### 请求权限\n\n在测试应用之前，必须在清单文件（manifest）中请求相应的权限。具体而言，应用需要发布通知权限。在 Project 窗口中，找到并打开\
  \ `AndroidManifest.xml` 并添加：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.notifydemo\">\n    <uses-permission android:name=\"\
  android.permission.NOTIFICATIONS\" />\n</manifest>\n```\n\n为了让应用在 Android 6 或更高版本上运行，必须在运行时请求代码。编辑\
  \ `MainActivity.java` 文件，首先添加额外的导入和请求代码的常量：\n\n```java\nimport androidx.core.app.ActivityCompat;\n\
  import androidx.core.content.ContextCompat;\nimport androidx.annotation.NonNull;\n\
  import android.widget.Toast;\nimport android.pm.PackageManager;\n\nprivate static\
  \ final int NOT_REQUEST_CODE = 101;\n```\n\n接下来，需要向类中添加一个方法，其目的是接收要请求的权限和相应的请求代码。在\
  \ `MainActivity.java` 文件中，如下实现此方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  \    }\n}\n```\n\n使用在 Android 中请求运行时权限中概述的步骤，上述方法在请求之前会验证指定的权限是否已授予。\n\n当请求处理完成后，活动将调用\
  \ `onRequestPermissionsResult()` 方法，并传递标识码和请求结果。因此，下一步是在 `MainActivity.java` 文件中如下实现此方法：\n\
  \n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode, @NonNull\
  \ String[] permissions, @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == NOT_REQUEST_CODE) {\n    \
  \    if (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Toast.makeText(this, \"Notification permission required\", Toast.LENGTH_LONG).show();\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n上述代码通过检查请求标识符代码来识别哪个权限请求已返回，然后再检查相应的权限是否已授予。如果权限被拒绝，将向用户显示一条消息，指示该应用将无法运行且记录按钮将被禁用。\n\
  \n在测试应用之前，最后剩下的工作是在应用启动时调用新添加的 `requestPermission()` 方法。在 `MainActivity.java` 文件中，按照如下方式修改\
  \ `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n.\n.\n    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\n\
  \            NOTIFICATION_REQUEST_CODE);\n    notificationManager =\n          \
  \      (NotificationManager)\n                          getSystemService(Context.NOTIFICATION_SERVICE);\n\
  .\n.\n```\n\n代码更改完成后，在运行 Android 13 或更高版本的设备或模拟器上编译并运行应用。当图 62-7 所示的对话框出现，点击“允许”按钮以启用通知：\n\
  \n![](img/as_enable_notifications.jpg)\n\n图 62-7\n\n启动应用后，将其置于后台并打开“设置”应用。在“设置”应用中，选择“应用”选项，选择\
  \ NotifyDemo 项目，并在后续屏幕上点击“通知”项。通知屏幕应该显示 NotifyDemo News 类别对用户处于状态：\n\n![](img/as_app_notifications_enabled.jpg)\n\
  \n图 62-8\n\n在继续之前，请确保已为应用启用了通知点。\n\n虽然在本示例中并非强制要求，但值得注意的是，可以通过调用通知器的 `deleteNotificationChannel()`\
  \ 方法从应用内部删除通道，调用时传递要删除的通道 ID：\n\n```java\nString channelID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\nnotificationManager.deleteNotificationChannel(channelID);\n```\n\n### 62.7 创建和发布通知\n\
  \n通知使用 `Notification.Builder` 类创建，并且必须包含图标、标题和内容。打开 `MainActivity.java` 文件并按照如下方式实现\
  \ `sendNotification()` 方法以构建基础通知：\n\n```java\n.\n.\nimport android.app.Notification;\n\
  import android.view.View;\n.\n.\npublic void sendNotification(View view) {\n   \
  \ String channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification\
  \ =\n                new Notification.Builder(MainActivity.this,\n             \
  \                                channelID)\n                .setContentTitle(\"\
  Example Notification\")\n                .setContentText(\"This is an example notification.\"\
  )\n                .setSmallIcon(android.R.drawable.ic_dialog_info)\n          \
  \      .setChannelId(channelID)\n                .build();\n}\n```\n\n一旦构建了通知，就需要使用\
  \ `NotificationManager` 实例的 `notify()` 方法进行发布。访问 `NotificationManager` 并发布通知的代码需要如下添加到\
  \ `sendNotification()` 方法中：\n\n```java\nprotected void sendNotification(View view)\
  \ {\n    int notificationID = 101;\n    String channelID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\n    Notification notification =\n                new Notification.Builder(MainActivity.this,\n\
  \                                             channelID)\n                .setContentTitle(\"\
  New Message\")\n                .setContentText(\"You've received new messages.\"\
  )\n                .setSmallIcon(android.R.drawable.ic_dialog_info)\n          \
  \      .setChannelId(channelID)\n                .build();\n    notificationManager.notify(notificationID,\
  \ notification);\n}\n```\n\n注意，当发布通知时，它会被分配一个通知 ID。这可以是任何整数，并在稍后更新通知时使用。编译并运行应用，然后点击主活动上的按钮。当通知图标出现在状态栏中时，从状态栏向下拖动以查看完整通知：\n\
  \n![](img/as_notification.jpg)\n\n图 62-9\n\n长按通知以查看更多信息：\n\n![](img/as_notification_details.jpg)\n\
  \n图 62-10\n\n接下来，将应用置于后台，导航到显示所有应用启动器图标的桌面，并注意到 NotifyDemo 启动器图标上出现了一个通知点，如图 62-1\
  \ 中的箭头所示：\n\n![](img/as_notification_dot.jpg)\n\n图 62-11\n\n如果未出现点，请在“设置”应用中检查 NotifyDemo\
  \ 的通知选项，以确认是否如前文所述启用了通知点。如果点仍未出现，长按设备主屏幕的空白区域，从弹出的菜单中选择“设置”，并启用“通知点”。在启动器图标上长按将显示一个包含通知的弹出窗口：\n\
  \n![](img/as_app_dot_detail.jpg)\n\n图 62-12\n\n如果一个应用有多个待处理通知，长按菜单将包含通知计数（如上图突出所示）。此数字可以在构建通知时通过调用\
  \ `setNumber()` 方法在应用内部进行配置：\n\n```java\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n    .setContentTitle(\"Example Notification\")\n    .setContentText(\"\
  This is an example notification.\")\n    .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \    .setChannelId(CHANNEL_ID)\n    .setNumber(10)\n```\n\n按照目前的实现方式，点击通知没有任何效果。下一步是配置通知在被点击时启动活动。\n\
  \n## 62.8 从通知启动活动\n\n通知应该允许用户执行某些操作，例如响应通知启动应用或采取其他行动。常见需求是在点击通知时启动属于该应用的活动。\n\n\
  这种方法需要一个要启动的活动以及一个配置用于启动该活动的 `Intent`。假设应用包含一个名为 `ResultActivity` 的活动，则 `intent`\
  \ 的创建如下：\n\n```java\nIntent resultIntent = new Intent(this, ResultActivity.class);\n\
  ```\n\n然后需要将此 `intent` 封装在 `PendingIntent` 实例中。`PendingIntent` 对象的设计允许将 `intent`\
  \ 传递给其他应用程序，从而授予这些应用程序在未来某个时刻执行该意图的权限。在这种情况下，`PendingIntent` 对象用于在用户点击通知面板时为通知系统提供启动\
  \ `ResultActivity` 活动的方法：\n\n```java\nPendingIntent pendingIntent =\n    PendingIntent.getActivity(\n\
  \            this,\n            0,\n            resultIntent,\n            IMMABLE);\n\
  ```\n\n剩下的工作是在构建通知过程中使用 `setContentIntent()` 方法分配 `PendingIntent` 对象。将这些更改整合后，`sendNotification()`\
  \ 方法将如下：\n\n```java\n.\n.\nimport android.app.PendingIntent;\nimport android.content.Intent;\n\
  import android.graphics.drawable.Icon;\n.\n.\nprotected void sendNotification(View\
  \ view) {\n    int notificationId = 101;\n    Intent resultIntent = new Intent(this,\
  \ ResultActivity.class);\n    PendingIntent pendingIntent =\n            PendingIntent.getActivity(\n\
  \                    this,\n                    0,\n                    resultIntent,\n\
  \                    PendingIntent.FLAG_IMMUTABLE\n            );\n\n    String\
  \ CHANNEL_ID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification\
  \ = new Notification.Builder(MainActivity.this, CHANNEL_ID)\n        .setContentTitle(\"\
  Example Notification\")\n        .setContentText(\"This is an example notification.\"\
  )\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n        .setChannelId(CHANNEL_ID)\n\
  \        .setContentIntent(pendingIntent)\n        .build();\n}\n```\n\n\n\n\n\n\
  ```java\n.setContentText(\"This is an example notification.\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setChannelId(channelID)\n        .setContentIntent(pendingIntent)\n  \
  \      .build();\n\nnotificationManager.notify(notificationId, notification);\n\n\
  }\n```\n\n编译并重新运行应用，点击按钮并显示通知栏。然而，这一次点击通知将导致 `ResultActivity` 启动。\n\n### 62.9 为通知添加动作（Actions）\n\
  \n为通知添加交互性的另一种方法是创建“动作”。这些动作以通知消息下方的按钮形式出现，并被程序为在用户点击时触发特定的意图。如果将代码添加到 `sendNotification()`\
  \ 方法中，将添加一个标记为“Open”的动作按钮，当选中时会启动引用的 `pendingIntent`：\n\n```java\nfinal Icon icon\
  \ = Icon.createWithResource(MainActivity.this,\n                android.R.drawable.ic_dialog_info);\n\
  \nNotification.Action action =\n    new Notification.Action.Builder(icon, \"Open\"\
  , pendingIntent)\n                .build();\n\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(R.drawable.ic_info_24dp)\n\
  \        .setChannelId(channelID)\n        .setContentIntent(pendingIntent)\n  \
  \      .setActions(action)\n        .build();\n\nnotificationManager.notify(notificationId,\
  \ notification);\n```\n\n将上述代码添加到该方法并运行应用。发布通知，并注意通知中出现的 Open 动作（取决于 Android 版本，可能需要向下滑动通知面板以显示\
  \ Open 动作）：\n\n![](img/as_notification_action.jpg)\n\n图 62-13\n\n点击动作将触发 `pendingIntent`\
  \ 并启动 `ResultActivity`。\n\n## 62.10 组绑通知（Bundled Notifications）\n\n如果一个应用倾向于定期发布通知，可能存在这些通知迅速拥堵状态栏和通知栏的危险，从而给用户带来欠佳的体验。这对于每当有突发新闻或联系人新消息到达时就发送通知的新闻或消息应用来说尤为如此。例如，考虑图\
  \ 62-14 中的通知：\n\n![](img/as_3.2_unbundled_notifications.jpg)\n\n图 62-14\n\n现在想象一下收到了十条甚至二十条新消息。为了避免这个问题，Android\
  \ 允许将通知合并成组。\n\n要对通知进行绑定，每条通知必须通过 `setGroup()` 方法被指定属于同一个组，并且必须发布一条额外的通知并配置为摘要通知（summary\
  \ notification）。例如，以下代码创建并发布了上方图 62-14 所示的三个通知，但将它们合并到了同一个组中。代码还发布了一个通知来作为摘要：\n\n\
  ```java\nfinal String GROUP_KEY_NOTIFY = \"group_key_notify\";\n\nNotification.Builder\
  \ builderSummary =\n    new Notification.Builder(this, channelID)\n            \
  \    .setSmallIcon(android.R.drawable.ic_dialog_info)\n                .setContentTitle(\"\
  A Bundle Example\")\n                .setContentText(\"You have 3 new messages\"\
  )\n                .setGroup(GROUP_KEY_NOTIFY)\n                .setGroupSummary(true);\n\
  \nNotification.Builder builder1 =\n    new Notification.Builder(this, channelID)\n\
  \                .setSmallIcon(android.R.drawable.ic_dialog_info)\n            \
  \    .setContentTitle(\"New Message\")\n                .setContentText(\"new message\
  \ from Kassidy\")\n                .setGroup(GROUP_KEY_NOTIFY);\n\nNotification.Builder\
  \ builder2 =\n    new Notification.Builder(this, channelID)\n                .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \                .setContentTitle(\"New Message\")\n                .setContentText(\"\
  new message from Caitlyn\")\n                .setGroup(GROUP_KEY_NOTIFY);\n\nNotification.Builder\
  \ builder3 =\n    new Notification.Builder(this, channelID)\n                .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \                .setContentTitle(\"New Message\")\n                .setContentText(\"\
  new message from Jason\")\n                .setGroup(GROUP_KEY_NOTIFY);\n```\n\n\
  ```java\nint notification0 = 100;\nint notification1 = 101;\nint notification2 =\
  \ 102;\nint notification3 = 103;\n\nnotificationManager.notify(notification0, builderSummary.build());\n\
  notificationManager.notify(notification1, builder1.build());\nnotificationManager.notify(notification2,\
  \ builder2.build());\nnotificationManager.notify(notification3, builder3.build());\n\
  ```\n\n### 62.11 总结\n\n通知提供了一种在应用未运行或处于后台时向用户传递消息的方式。通知出现在状态栏和通知栏中。本地通知由运行的应用触发，而远程通知由远程服务器发起。本地通知使用\
  \ `NotificationCompat.Builder` 类创建并使用 `NotificationManager` 发布。正如本章所示，可以使用动作、意图和\
  \ `PendingIntent` 类配置通知以提供选项（例如启动活动或保存消息）。通知绑定为发布大量通知的应用提供了一种分组机制。\n\n## 63 Android\
  \ 直接回复（Direct Reply）教程\n\n直接回复是 Android 的一项功能，允许用户在通知中输入文本并发送给与其关联的应用。这允许用户在不启动应用活动的情况下回复消息。本章将基于上一章的知识，创建一个使用此功能的示例应用。\n\
  \n### 63.1 创建 DirectReply 项目\n\n从欢迎屏幕选择 New Projectget，并在弹出的新项目对话框中选择 Empty Views\
  \ Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 DirectReply，并指定 `com.ebookrenzy.directreply`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 33: Android 13，并将 Language 设置为\
  \ Java。\n\n### 63.2 设计界面\n\n用布局工具加载 `activity_main.xml` 布局文件。启用 Autoconnect，在现有的“Hello\
  \ World!”标签下方添加一个 Button 对象，如图 63-1 所示。在布局中选中 Button 小部件后，使用 Attributes 工具窗口将 `onClick`\
  \ 属性设置为调用 `sendNotification` 方法。如有必要，使用 Infer Constraints 按钮为布局添加任何缺失的约束。在继续之前，选择“Hello\
  \ World!”TextView，将 id 属性更改为 `textView`，并将按钮上的文本改为“Notify”：\n\n![](img/as_direct_reply_ui.jpg)\n\
  \n图 63-1\n\n### 63.3 请求通知权限\n\n\n\n\n\n在 Project（项目）工具窗口中，找到并双击 `AndroidManifest.xml`\
  \ 文件，将其加载到编辑器中并修改 XML 以添加权限元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.audioapp\" >\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"\
  \ />\n</manifest>\n```\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令（import）和一个常量，作为所请求权限的请求识别码：\n\
  \n```java\nimport androidx.annotation.NonNull;\nimport androidx.core.app.ActivityCompat;\n\
  import androidx.core.content.ContextCompat;\nimport android.widget.Toast;\nimport\
  \ android.Manifest;\nimport android.content.pm.PackageManager;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int NOTIFICATION_REQUEST_CODE\
  \ = 101;\n}\n```\n\n接下来，需要在类中添加一个方法，该方法的作用是将待请求的权限和相应的请求识别码作为参数传递。继续留在 `MainActivity.java`\
  \ 类文件中，如下如下实现该方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  \    }\n}\n```\n\n当请求被处理后，活动将调用 `onRequestPermissionsResult()` 方法，并传递识别码和请求结果。因此，下一步是在\
  \ `MainActivity.java` 文件中按如下方式实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode,\n                    @NonNull String[] permissions, @NonNull int[]\
  \ grantResults) {\n    super.onRequestPermissionsResult(requestCode, permissions,\
  \ grantResults);\n    if (requestCode == NOTIFICATION_REQUEST_CODE) {\n        if\
  \ (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Toast.makeText(this, \"Notification permission required\", Toast.LENGTH_LONG).show();\n\
  \        }\n    }\n}\n```\n\n在测试应用之前，剩下的工作是在应用启动时调用新添加的 `requestPermission()` 方法。继续留在\
  \ `MainActivity.java` 文件中，按如下方式修改 `onCreate()` 方法：\n\n```java\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    View view\
  \ = binding.getRoot();\n    setContentView(view);\n    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\
  \ NOTIFICATION_REQUEST_CODE);\n}\n```\n\n### 63.4 创建通知通道（Notification Channel）\n\
  \n与上一章示例示例，在发送通知之前必须创建一个通道。编辑 `MainActivity.java` 文件并添加代码来创建一个新通道：\n\n```java\n\
  import android.app.NotificationChannel;\nimport android.app.NotificationManager;\n\
  import android.content.Context;\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private NotificationManager notificationManager;\n\
  \    private final String channelID = \"com.ebookfrenzy.directreply.news\";\n\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createNotificationChannel(channelID, \"Direct Reply\", \"Example Channel\"\
  );\n    }\n\n    protected void createNotificationChannel(String id, String name,\
  \ String description) {\n        int importance = NotificationManager.IMPORTANCE_HIGH;\n\
  \        NotificationChannel channel = new NotificationChannel(id, name, importance);\n\
  \        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLight(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400, 500, 400, 300,\
  \ 200});\n        notificationManager.createNotificationChannel(channel);\n    }\n\
  }\n```\n\n### 63.5 构建 RemoteInput 对象\n\n在通知中实现内联直接回复（direct reply）的关键元素是 `RemoteInput`\
  \ 类。之前的章节介绍了 `PendingIntent` 类，并解释了它如何允许一个应用程序创建一个意图（intent），然后授予其他应用程序或服务从原始应用外部启动该意图的能力。在名为“Android\
  \ 教程”的章节中，创建了一个等待意图，允许从通知内部启动原始应用中的一个活动。`RemoteInput` 类允许将用户输入请求与意图一起包含在 `PendingIntent`\
  \ 对象中。当 `PendingIntent` 对象中的意图被触发时（例如启动一个活动），该活动也将接收到用户提供的任何输入。\n\n在通知中实现直接回复的首要步骤是创建\
  \ `RemoteInput` 对象。这是通过使用 `RemoteInput.Builder()` 方法实现的。要构建 `RemoteInput` 对象，需要一个键字符串，用于从生成的意图中提取输入内容。该对象还需要一个标签字符串，该字符串将显示在通知的文本输入中。编辑\
  \ `MainActivity.java` 文件并添加 `sendNotification()` 方法。同时请注意添加的一些导入指令和变量，它们将在章节后续进展中被使用：\n\
  \n```java\npackage com.ebookfrenzy.directreply;\n\nimport android.app.PendingIntent;\n\
  import android.app.RemoteInput;\nimport android.content.Intent;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private static final int notificationId\
  \ = 101;\n    private static final String KEY_TEXT_REPLY = \"key_text_reply\";\n\
  \    private NotificationManager notificationManager;\n    private static final\
  \ String channelID = \"com.ebookfrenzy.directreply.news\";\n\n    public void sendNotification(View\
  \ view) {\n        String replyLabel = \"Enter your reply here\";\n        RemoteInput\
  \ remoteInput = new RemoteInput.Builder(KEY_TEXT_REPLY)\n                .setLabel(replyLabel)\n\
  \                .build();\n    }\n}\n```\n\n现在 `RemoteInput` 对象已经创建并使用键和标签字符串完成了初始化，将其放入通知对象中。在执行该步骤之前，需要创建\
  \ `PendingIntent` 实例。\n\n### 63.6 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与“Android\
  \ 教程”章节中的概述相同，但意图将配置为启动 `MainActivity`。继续留在 `MainActivity.java` 文件中，按如下方式添加创建 `PendingIntent`\
  \ 的代码：\n\n```java\npublic void sendNotification(View view) {\n    String replyLabel\
  \ = \"Enter your reply here\";\n    RemoteInput remoteInput = new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n            .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ = PendingIntent.getActivity(\n            this,\n            0,\n            resultIntent,\n\
  \            PendingIntent.FLAG_MUTABLE\n    );\n}\n```\n\n### 63.7 创建回复操作（Reply\
  \ Action）\n\n\n\n\n\n内联回复将可以通过操作按钮在通知中访问。该操作需要创建并配置，包含一个图标、显示在按钮上的标签、`PendingIntent`\
  \ 对象以及 `RemoteInput` 对象。修改 `sendNotification()` 方法以添加创建此操作的代码：\n\n```java\nimport\
  \ android.graphics.drawable.Icon;\n\nimport android.app.Notification;\n\npublic\
  \ void sendNotification(View view) {\n    String replyLabel = \"Enter your reply\
  \ here\";\n    RemoteInput remoteInput =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \                .setLabel(replyLabel)\n                .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ =\n            PendingIntent.getActivity(\n                this,\n           \
  \     0,\n                resultIntent,\n                PendingIntent.FLAG_MUTABLE\n\
  \            );\n    final Icon icon =\n            Icon.createWithResource(MainActivity.this,\n\
  \                android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction\
  \ =\n            new Notification.Action.Builder(\n                        icon,\n\
  \                        \"Reply\", resultPendingIntent)\n                     \
  \   .addRemoteInput(remoteInput)\n                        .build();\n}\n```\n\n\
  在教程的这一阶段，我们已经构建了并准备好使用 `RemoteInput`、`PendingIntent` 和 `Notification Action` 对象。下一阶段是构建并发布通知：\n\
  \n```java\npublic void sendNotification(View view) {\n    String replyLabel = \"\
  Enter your reply here\";\n    RemoteInput remoteInput =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \                .setLabel(replyLabel)\n                .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ =\n            PendingIntent.getActivity(\n                this,\n           \
  \     0,\n                resultIntent,\n                PendingIntent.FLAG_IMMABLE\n\
  \            );\n    final Icon icon =\n            Icon.createWithResource(MainActivity.this,\n\
  \                android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction\
  \ =\n            new Notification.Action.Builder(\n                        icon,\n\
  \                        \"Reply\", resultPendingIntent)\n                    .addRemoteInput(remoteInput)\n\
  \                    .build();\n    Notification newMessageNotification =\n    \
  \        new Notification.Builder(this, channelID)\n                .setColor(ContextCompat.getColor(this,\n\
  \                    android.R.color.holo_blue_dark))\n                .setSmallIcon(\n\
  \                    android.R.drawable.ic_dialog_info)\n                .setContentTitle(\"\
  My Notification\")\n                .setContentText(\"This is a test message\")\n\
  \                .addAction(replyAction).build();\n    NotificationManager notificationManager\
  \ =\n            (NotificationManager)\n                getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    notificationManager.notify(notificationId,\n                newMessageNotification);\n\
  }\n```\n\n完成更改后，编译并运行应用，允许通知，并测试点击按钮是否成功发布了通知。查看通知栏时，通知应如图 63-2 所示：\n\n![](img/as_direct_reply.jpg)\n\
  \n图 63-2\n\n点击“回复”（Reply）操作按钮，出现文本输入字段，并显示在创建 `RemoteInput` 对象时嵌入的回复标签。\n\n![](img/as_direct_reply_enter.jpg)\n\
  \n图 63-3\n\n输入一些文本并点击输入字段末端的发送箭头按钮。\n\n### 63.8 接收直接回复输入\n\n现在通知已成功向用户请求输入，应用需要对该输入进行处理。本教程的目标是将用户输入到通知中的文本显示在\
  \ Activity 用户界面的 `TextView` 上。\n\n当用户输入文本并点击发送按钮时，`MainActivity` 将通过 `PendingIntent`\
  \ 对象中的 Intent 启动。此 Intent 中嵌入了用户通过通知输入的文本。在 Activity 的 `onCreate()` 方法中，调用 `getIntent()`\
  \ 方法将返回启动该 Activity 的 Intent 副本。将其传递给 `RemoteInput.getFromIntent()` 方法，反过来将返回一个包含回复的\
  \ `Bundle`，该 `Bundle` 可以被提取并赋值给 `TextView`。这将产生一个修改后的 `MainActivity.java` 文件，其内容如下：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ createChannel(channelID, \"Reply\");\n    handleIntent();\n}\n\nprivate void handleIntent()\
  \ {\n    Intent intent = this.getIntent();\n    Bundle remoteInput = RemoteInput.getFromIntent(intent);\n\
  \    if (remoteInput != null) {\n        String inputString = remoteInput.get(KEY_TEXT_REPLY).toString();\n\
  \        textView.setText(inputString);\n    }\n}\n```\n\n完成这些更改后构建并运行应用。点击按钮发布通知，并在通知中输入一些文本。注意\
  \ Activity 中的 `TextView` 已更新。\n\n### 63.9 更新通知\n\n在通知中发送回复后，你可能会注意到进度指示器在通知面板中继续旋转，如图\
  \ 63-4 所示：\n\n![](img/as_direct_reply_progress.jpg)\n\n图 63-4\n\n通知显示此指示器是因为它正在等待\
  \ Activity 的响应。执行此任务的推荐方法是使用新消息更新通知，指示回复已收到。由于原始通知在发布时分配了 ID，因此可以再次使用它来执行更新。在 `handleIntent()`\
  \ 方法中添加以下代码以执行此任务：\n\n```java\nprivate void handleIntent() {\n    Intent intent\
  \ = this.getIntent();\n    Bundle remoteInput = RemoteInput.getFromIntent(intent);\n\
  \    if (remoteInput != null) {\n        String inputString = remoteInput.get(KEY_TEXT_REPLY).toString();\n\
  \        textView.setText(inputString);\n\n        Notification repliedNotification\
  \ =\n            new Notification.Builder(this, channelID)\n                .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \                .setContentText(\"Reply received\")\n                .build();\n\
  \        notificationManager.notify(notificationId,\n                repliedNotification);\n\
  \    }\n}\n```\n\n最后测试一次应用，验证在内联回复文本发送后进度指示器消失，并且出现了一个新面板指示回复已收到：\n\n![](img/as_direct_reply_received.jpg)\n\
  \n图 63-5\n\n### 63.10 总结\n\n直接回复通知功能允许用户在通知中输入文本，并通过 Intent 传递给相应应用的 Activity。直接回复通过\
  \ `RemoteInput` 类实现，该类的实例可以嵌入到操作中并与通知一起打包。处理直接回复通知时，重要的是让 `NotificationManager`\
  \ 服务知道回复已收到并处理。实现此点的最佳方法是使用发布通知时提供的通知 ID 来更新通知。\n\n\n\n\n折叠屏设备无论我们是否准备好都会到来（或者说，在第一代三星\
  \ Galaxy Fold 的情况下，可能甚至在设备本身准备好之前就出现了）。为了准备这类新类型的设备，了解一些需要采取的额外步骤以确保您的应用在折叠屏设备上运行正常。。\n\
  \n幸的是，支持折叠屏设备的大部分行为已经以多窗口（Multi-Window）支持的形式存在于 Android 中。\n\n## 64.1 折叠屏与多窗口支持\n\
  \n当应用在折叠屏设备上运行时，它可能会与其他应用共享屏幕，并遇到重大的配置更改（例如当用户折叠或展开显示器时屏幕尺寸发生变化）。如果您的应用已经设计为可以处理设备方向的变化，那么它很可能也能处理由屏幕折叠引起的更改，尽管建议进行彻底测试。\n\
  \n多窗口支持最初是在 Android 7 中引入的。与之前的 Android 版本不同，Android 7 中的多窗口支持允许在设备屏幕上同时显示多个 Activity。\n\
  \nAndroid 中的多窗口支持提供了三种不同的窗口形式。分屏模式（Split-screen mode）适用于大多数手机、折叠屏设备和平板设备，它提供了一个分屏环境，其中两个\
  \ Activity 并排或上下堆叠显示。系统提供了一个可移动的分割线，用户拖动它时可以调整分配给每个相邻 Activity 的屏幕百分比：\n\n![](img/Image24272.jpg)\n\
  图 64-1\n\n自由形式模式（Freeform mode）为大屏幕设备提供了一个窗口环境，目前由设备制造商决定是否启用。自由形式模式与分屏模式的区别在于，它允许每个\
  \ Activity 在一个独立的、可调整大小的窗口中显示，并且不限于同时显示两个 Activity。[图 64-2] 显示了一个处于自由形式模式下的的设备，其中计算器和第二个应用显示在独立的窗口中：\n\
  \n![](img/Image24362.jpg)\n图 64-2\n\n画中画支持（Picture-in-picture support）顾其实思义，允许视频在用户执行其他任务时在较小的窗口中继续播放，该主题将从“Android\
  \ 画中画模式”章节开始进行介绍。\n\n## 64.2 使用折叠屏模拟器\n\n尽管在编写本文时，市场上还没有可以进行应用测试的折叠屏设备，但 Android\
  \ SDK 中包含了折叠屏模拟器。要创建一个折叠屏模拟器，选择 `Android Studio Tools -> AVD Manager` 菜单选项，点击 `Create\
  \ Virtual Device` 按钮，并在硬件选择屏幕上选择下方 [图 64-3] 所示的高亮折叠屏选项之一：\n\n![](img/as_foldable_avd.jpg)\n\
  图 64-3\n\n在选择折叠屏选项后，继续创建过程，选择 `Android 10 API 29` 或更高版本作为系统镜像。\n\n一旦模拟器运行，工具栏上将出现一个额外的按钮，允许模拟器在折叠和展开的配置之间切换：\n\
  \n![](img/as_3.5_foldable_emulator_fold_button.jpg)\n图 64-4\n\n## 64.3 进入多窗口模式\n\
  \n可以通过显示最近任务（Overview）屏幕、长按列表应用工具栏中的应用图标，并选择如 [图 64-5] 所示的分屏（Split screen）菜单选项来进入分屏模式：\n\
  \n![](img/as_3.5_split_screen_button.jpg)\n图 64-5\n\n进入分屏模式后，最近任务按钮将变为显示两个矩形（如 [图\
  \ 64-6] 中的 A 所示），当前 Activity 将占据屏幕的一部分 (B)，最近任务屏幕将出现在屏幕的相邻部分，允许选择第二个 Activity 进行显示\
  \ (C)：\n\n![](img/as_3.5_split_screen_select_second_app.jpg)\n图 64-6\n\n一旦选择了第二个应用，屏幕将如此处上文\
  \ [图 64-1] 所示被均匀平分。\n\n要退出分屏模式，只需将分离两个 Activity 的分割线拖动到边缘，使一个 Activity 填充整个屏幕，或者长按最近任务按钮直到它恢复为单个正方形。\n\
  \n## 64.4 启用并使用自由形式支持\n\n虽然并不是所有设备都受到官方支持，但在大屏幕设备和模拟器上启用自由形式多窗口模式。要启用此模式，在模拟器运行或设备连接时运行以下\
  \ `adb` 命令：\n\n```bash\nadb shell settings put global enable_freeform_support 1\n\
  ```\n\n进行此更改后，可能需要重启设备才能使设置生效。\n\n一旦启用，在长按应用图标时，最近任务屏幕内会出现一个额外的选项，如 [图 64-7] 所示：\n\
  \n![](img/as_3.5_freeform_button.jpg)\n图 64-7\n\n## 64.5 检查自由形式支持\n\n如本章早期概述，Google\
  \ 将是否启用自由形式多窗口模式的选择权交给了各个 Android 设备制造商。由于自由形式仅在大屏幕设备上才有意义，因此无法保证每个应用可能运行的设备上都提供自由形式。幸运的是，如果设备不支持自由形式模式，系统将忽略所有针对自由形式特定的方法和属性，因此使用它们不会导致应用崩溃。然而，在某些情况下，能够检测设备是否支持自由形式模式可能是很有用的。幸运的是，可以通过检查包管理器中的自由窗口管理功能来实现。以下代码示例检查自由形式支持并返回一个\
  \ `Boolean` 值：\n\n```java\npublic Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(PackageManager.FEATURE_FREEFORM_MANAGEMENT);\n\
  }\n```\n\n 在应用中启用多窗口支持\n\n清单文件中的 `android:resizableActivity` 设置控制应用是否支持多窗口行为。此设置可以在应用程序级别或单个\
  \ Activity 级别进行。以下片段配置了名为 `MainActivity` 的 Activity 以支持分屏和自由形式模式：\n\n```xml\n<activity\n\
  \    android:name=\".MainActivity\"\n    android:resizableActivity=\"true\"\n  \
  \  android:label=\"@string/app_name\"\n    android:theme=\"@style/AppTheme.NoActionBar\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n将属性设置为 `false` 将阻止该 Activity 出现在分屏或自由形式模式中，且应用菜单中不会出现相应的按钮。在分屏配置中选择禁用多窗口支持的\
  \ Activity 作为第二个 Activity，将显示消息提示该应用可能不支持多窗口模式。\n\n## 64.7 指定多窗口属性\n\n`<layout>`\
  \ 元素中提供了许多属性，用于指定 Activity 在启动到多窗口模式时的尺寸和位置。在自由形式模式下启动时，可以使用以下属性指定初始高度、宽度和位置：\n\n\
  - `android:defaultWidth` – 指定 Activity 的默认宽度。\n- `android:defaultHeight` – 指定 Activity\
  \ 的默认高度。\n\n\n\n\n\n- `android:gravity` – 指定 activity 的初始位置（start、end、left、right、top\
  \ 等）。\n\n请注意，上述属性仅当 activity 在自由窗口模式（freeform mode）下显示时才生效。以下示例配置了一个 activity，使其在屏幕起始边缘以特定的高度和宽度出现：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:defaultHeight=\"\
  350dp\"\n              android:defaultWidth=\"450dp\"\n              android:gravity=\"\
  start|end\" />\n</activity>\n```\n\n可以使用以下 `<layout>` 属性来指定 activity 在分屏视图或自由窗口模式下可以缩减的最小宽度和高度：\n\
  \n- `android:minimalHeight` – 指定 activity 在分屏模式或自由窗口模式下可以缩减的最小高度。\n- `android:minimalWidth`\
  \ - 指定 activity 在分屏模式或自由窗口模式下可以缩减的最小宽度。\n\n当用户将分屏分割线滑动超出最小高度或宽度边界时，系统将停止调整收缩中 activity\
  \ 的布局，并简单地裁剪用户界面为相邻的 activity 留出空间。\n\n下面的清单文件片段为 activity 实现了最小宽度和高度属性：\n\n```xml\n\
  <activity android:name=\".MainActivity \">\n    <layout android:minimalHeight=\"\
  400dp\"\n              android:minimalWidth=\"290dp\" />\n</activity>\n```\n\n##\
  \ 64.8 在 Activity 中检测多窗口模式\n\n可能会出现某些情况，即 activity 需要检测其当前是否正以多窗口模式显示给用户。可以通过调用\
  \ `Activity` 类的 `isInMultiWindowMode()` 方法获取当前状态。调用此方法时，它将根据 activity 当前是否处于全屏状态返回\
  \ true 或 false 值：\n\n```java\nif (this.isInMultiWindowMode()) {\n    // Activity\
  \ 正在多窗口模式下运行\n} else {\n    // Activity 不在多窗口模式下\n}\n```\n\n## 64.9 接收多窗口通知\n\n\
  如果 activity 重写了 `onMultiWindowModeChanged()` 回调方法，它将接收进入或退出多窗口模式的通知。传递给方法的第一个参数在进入多窗口模式时为\
  \ true，在 activity 退出该模式时为 false。新的配置设置包含在作为第二个参数传递的 `Configuration` 对象中\n\n```java\n\
  @Override\npublic void onMultiWindowModeChanged(boolean isInMultiWindowMode,\n \
  \                                    Configuration newConfig) {\n    super.onMultiWindowModeChanged(isInMultiWindowMode,\
  \ newConfig);\n    if (isInMultiWindowMode) {\n        // Activity 已进入多窗口模式\n  \
  \  } else {\n        // Activity 已退出多窗口模式\n    }\n}\n```\n\n正如[处理 Android Activity\
  \ 状态更改]章节中所概述的，Android 10 及更高版本允许多个 activity 同时处于恢复（resumed）状态（也称为多恢复状态，multi-resume）。用户最近交互的\
  \ activity 被称为顶层恢复 activity（topmost resumed activity）。为了在 activity 获取和丢失顶层恢复状态进行追踪，可以在\
  \ activity 内部实现 `onTopResumedActivityChanged()` 回调方法，例如：\n\n```java\n@Override\n\
  public void onTopResumedActivityChanged(boolean isTopResumedActivity) {\n    super.onTopResumedActivityChanged(isTopResumedActivity);\n\
  \    if (isTopResumedActivity) {\n        // Activity 现在是顶层恢复 activity\n    } else\
  \ {\n        // Activity 不再是顶层恢复 \n    }\n}\n```\n\n在某些运行 Android 9 的设备上，通过在应用清单文件中启用以下属性，也可以在应用中利用多恢复功能：\n\
  \n```xml\n<meta-data\n    android:name=\"android.allow_multiple_resumed_activities\"\
  \ android:value=\"true\" />\n```\n\n## 64.10 在多窗口模式下启动 Activity\n\n在本书的[Android\
  \ 显式意图——实例示例]章节中，创建了一个示例应用，其中 activity 使用 intent 启动第二个 activity。默认情况下，通过 intent\
  \ 启动的 activity 被认为与源 activity 位于同一个任务栈（task stack）中。然而，可以通过向 intent 传递适当标志将 activity\
  \ 启动到新的任务栈中。\n\n当多窗口模式下的 activity 启动另一个 activity 时，新 activity 将出现在原始 activity 旁边。要将\
  \ activity 启动到新的任务栈，必须在 intent 设置以下标志：\n- `Intent.FLAG_ACTIVITY_ADJACENT`\n- `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n\
  - `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n例如，以下代码配置并启动了第二个 activity 在独立窗口中显示：\n\n```java\n\
  Intent i = new Intent(this, SecondActivity.class);\ni.addFlags(Intent.FLAG_ACTIVITY_ADJACENT\
  \ |\n           Intent.FLAG_ACTIVITY_MULTIPLE_TASK |\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  startActivity(i);\n```\n\n## 64.11 配置自由窗口 activity 的大小和位置\n\n默认情况下，在自由窗口模式下启动到不同任务栈的\
  \ activity 将位于屏幕中心，大小由系统决定。可以通过通过 `ActivityOptions` 类向 intent 传递启动边界（launch bounds）来控制此窗口的位置和尺寸。\n\
  \n此过程的第一步是创建一个 `Rect` 对象，并配置其 activity 窗口的左侧 (X)、顶部 (Y)、右侧 (X) 和底部 (Y) 坐标。例如，以下代码创建了一个\
  \ `Rect` 对象，其左上角位于 (0, 0)，右下角位于 (100, 100)：\n\n```java\nRect rect = new Rect(100,\
  \ 800, 900, 700);\n```\n\n下一步是创建 `ActivityOptions` 类的一个基础实例，并通过 `setLaunchBounds()`\
  \ 方法使用 `Rect` 设置初始化：\n\n```java\nActivityOptions options = ActivityOptions.makeBasic();\n\
  ActivityOptions bounds = options.setLaunchBounds(rect);\n```\n\n最后，将 `ActivityOptions`\
  \ 实例转换为 `Bundle` 对象，并同 intent 对象一起传递给 `startActivity()` 方法。结合这些步骤得到的代码如下：\n\n```java\n\
  Intent i = new Intent(this, SecondActivity.class);\ni.addFlags(Intent.FLAG_ACTIVITY_ADJACENT\
  \ |\n           Intent.FLAG_ACTIVITY_MULTIPLE_TASK |\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  \nRect rect = new Rect(100, 800, 900, 700);\nActivityOptions options = ActivityOptions.makeBasic();\n\
  ActivityOptions bounds = options.setLaunchBounds(rect);\n\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源 activity 在自由窗口模式下通过 intent 启动第二个 activity 时，新 activity 窗口将按照 `Rect` 对象定义的位置和尺寸出现。\n\
  \n### 64.12 总结\n\n\n\n\n\nAndroid 7 引入了多窗口支持，这使得屏幕在任何时候都可以显示多个活动。这一功能现在已成为为折叠屏设备提供支持的基础。多窗口支持提供了三种模式：分屏模式、自由窗口和画中画。在分屏模式下，屏幕被水平或垂直划分为两个窗格，每个窗格显示一个活动。自由窗口模式仅在某些\
  \ Android 设备上支持，它允许每个活动出现在独立的、可移动且可调整大小的窗口中。正如本章概述，Android SDK 中提供了许多方法和属性设置，用于检测、响应和控制应用内部的多窗口行为。\n\
  \n# 65. Android SQLite 数据库概览\n\n不需要存储至少某些持久化数据的移动应用程序寥寥无几。数据库的使用是大多数应用程序不可或缺的方面，其范围从几乎完全数据驱动的应用到需要存储少量数据（例如常见的游戏得分）的应用不等。\n\
  \n考虑到典型 Android 应用的瞬态生命周期，持久化数据存储的重要性变得更加明显了。由于 Android 运行时系统随时可能终止应用程序组件以释放资源，因此制定一个全面的数据存储策略以避免数据丢失，是设计和实现任何应用开发策略的关键因素。\n\
  \n本章将涵盖与 Android 操作系统捆绑的 SQLite 数据库管理系统，并概述用于在 Android 应用中实现持久化 SQLite 数据库存储的 Android\
  \ SDK 类。在深入探讨 Android 开发背景下的 SQLite 细节之前，将对数据库和 SQL 进行简要概述。\n\n## 65.1 理解数据库表\n\n\
  数据库表（Database Tables）提供了数据库中最基础的数据结构。每个数据库可以包含多个表，每个表设计用于存储特定类型的信息。例如，数据库可以包含一个客户表，其中包含特定业务的每个客户的姓名、地址和电话。同一个数据库可能还包含一个产品表，用于存储该业务销售的产品描述以及相关的产品代码。\n\
  \n数据库中的每个表都分配有一个名称，该名称在该特定数据库内必须唯一。表名一旦分配给某个数据库中的表，除非在另一个数据库范围内，否则不能用于另一个表。\n\n\
  ## 65.2 引入数据库模式\n\n数据库模式（Database Schema）定义了数据库表中数据的特征。例如，客户数据库表的模式可能定义客户名为长度不超过\
  \ 20 个字符的字符串，而客户电话为特定格式的数值数据字段。\n\n模式还用于定义整个数据库的结构以及数据库中各个表之间的关系。\n\n## 65.3 列与数据类型\n\
  \n在此阶段，将数据库表视为类似于电子表格（数据存储在行和列中）是有帮助的。\n\n每一列代表对应表中的一个数据字段。例如，表的名称、地址和电话数据字段都是列。\n\
  \n每一列又被定义为包含特定类型的数据。因此，用于存储数字的列被定义为包含数值数据。\n\n### 65.4 数据库行\n\n保存到表中的每个新记录都存储在行（row）中。每一行又由与保存记录相关的数据列组成。\n\
  \n再次考虑本章之前描述的电子表格类比。客户表中的每个条目等同于电子表格中的行，每一列包含每个客户的数据（姓名、地址、电话等）。当向表中添加新客户时，会创建一个新的一行，并将该客户的数据存储在该新行的对应列中。\n\
  \n行有时也被称为记录（records）或条目（entries），这些术语通常可以互换。\n\n## 65.5 引入主键\n\n每个数据库表都应该包含一个或多个列，这些列可以唯一标识表中的每一行。这在数据库术语中被称为主键（Primary\
  \ Key）。例如，一个表可以使用银行账户列作为主键。或者，客户表可以使用客户的社会安全号码作为主键。\n\n主键允许数据库管理系统唯一地标识表中的某个特定行。如果没有主键，将无法检索或删除表中的某个特定行，因为无法确定是否选择了正确的行。例如，假设存在一个表，客户的姓氏被定义为主键。想象一下，如果数据库中记录了多个姓“Smith”的客户，会产生什么问题。如果没有某种能保证的方法来唯一地标识某个特定行，那么确保在任何时候访问的都是正确的数据将是不可能的。\n\
  \n主键可以由表中的单列或多列组成。要符合单列主键的条件，任意行不能包含匹配的主键值。当使用多个列构造主键时，单个列的值不需要是唯一的，但所有列的值组合必须是唯一的。\n\
  \n## 65.6 什么是 SQLite？\n\nSQLite 是一种嵌入式关系型数据库管理系统（RDBMS）。大多数关系型数据库（Oracle、SQL Server\
  \ 和 MySQL 是主要示例）都是独立的服务器进程，独立运行并与需要数据库访问的应用程序协作。SQLite 被称为嵌入式，是因为它是以库的形式提供的，并链接到应用程序中。因此，后台没有运行独立的数据库服务器。所有的数据库操作都通过调用\
  \ SQLite 库中的函数在应用程序内部处理。\n\nSQLite 的开发者已将该技术投入了公共领域，结果是它现在是一种广泛部署的数据库解决方案。\n\nSQLite\
  \ 使用 C 语言编写，因此 Android SDK 为底层数据库接口提供了一个基于 Java 的“封装”。它由类组成，可以在应用程序的 Java 或 Kotlin\
  \ 代码中用于创建和管理基于 SQLite 的数据库。\n\n有关 SQLite 的更多信息，请参考 `https://www.sqlite.org`。\n\n\
  ## 65.7 结构化查询语言 (SQL)\n\nSQLite 数据库使用一种名为结构化查询语言的高级语言访问数据。这种语言通常缩写为 SQL，读作 sequel。SQL\
  \ 是大多数关系型数据库管理系统的标准语言。SQLite 大多符合 SQL-92 标准。\n\nSQL 是一种简单且易用的语言，专门为能够读取和写入数据库数据而设计。由于\
  \ SQL 包含较少的关键字，因此可以快速学习。此外，在大多数 DBMS 实现之间，SQL 的语法大相同，因此学习了一个系统的 SQL 后，你的技能可能会转移到其他数据库管理系统。\n\
  \n虽然本章内会使用一些基本的 SQL 语句，但 SQL 的详细概述超出了本书的范围。然而，许多其他资源提供的 SQL 概述比我们在这里这一章中能提供的好得多。\n\
  \n## 65.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\n\n\n\n\n\n对于熟悉数据库和 SQLite 的读者来说，直接开始创建一个使用\
  \ SQLite 的 Android 可能会令人生畏。幸运的是，Android 预装了 SQLite，其中包含一个交互环境，允许在连接到运行中的 Android\
  \ AVD 模拟器实例的 `adb shell` 会话中发布 SQL 命令。这是学习 SQLite 和 SQL 的有效方法，也是识别运行在模拟器中的应用程序所创建的数据库中问题的极佳工具。\n\
  \n## 启动 SQLite 会话\n\n要启动交互式 SQLite 会话，首先要运行 AVD 会话。这可以在 Android Studio 中通过启动 虚拟设备管理器（`Tools\
  \ -> Device Manager`）、选择一个之前配置过的 AVD 并点击启动按钮来实现。\n\n一旦 AVD 启动并运行，打开终端或命令提示符窗口，使用\
  \ `adb` 命令行工具连接到模拟器，命令如下：\n\n```bash\nadb shell\n```\n\n连接后，shell 环境将提供一个命令提示符，可以在其中输入命令。首先通过使用\
  \ `su` 命令获取超级用户权限：\n\n```\nGeneric_x86:/ su\nroot@android:/ #\n```\n\n如果消息显示不允许超级用户权限，则\
  \ AVD 实例可能包含 Google Play 支持。要解决这个问题，请创建一个新的 AVD，并在“选择设备定义”屏幕上选择一个在“Play Store”列没有标记的设备。\n\
  \n## 数据库位置\n\nSQLite 数据库中的数据存储在运行应用程序的 Android 设备文件系统上的数据库文件中。默认情况下，这些数据库文件的文件系统路径如下：\n\
  \n`/data/data/<package name>/databases/<database filename>.db`\n\n例如，如果一个包名为 `com.example.MyDBApp`\
  \ 的应用程序创建一个名为 `mydatabase.db` 的数据库，则设备上的文件路径将如下：\n\n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\
  \n因此，在此练习中，请在 `adb shell` 中切换到 `/data/data` 并创建一个适用于某些 SQLite 实验的子目录结构：\n\n```bash\n\
  cd /data/data\nmkdir com.example.dbexample\ncd com.example.dbexample\nmkdir databases\n\
  cd databases\n```\n\n为数据库文件创建合适的位置后，按如下方式启动交互式 SQLite 工具：\n\n```\nroot@android:/data/data/databases\
  \ # sqlite3 ./mydatabase.db\nsqlite3 ./mydatabase.db\n```\n\n```\nSQLite version\
  \ 3.8.10.2 2015-05-20 18:17:19\nEnter \".help\" for usage hints.\nsqlite>\n```\n\
  \n## SQLite 操作\n\n在 `sqlite>` 提示符下，可以输入命令来执行创建表、插入和检索数据等任务。例如，要在我们的数据库中创建一个包含 ID、名称、地址和电话号码字段的新表，需要以下语句：\n\
  \n```sql\ncreate table contacts (_id integer primary key autoincrement, name text,\
  \ address text, phone text);\n```\n\n注意，表中的每行都应该有一个对于该行唯一的的主键。在上面的示例中，我们把 `ID` 字段指定为主主键，将其声明为\
  \ `integer` 类型，并要求 SQLite 在每次添加新行时自动增加数字。这是确保每行都有唯一主键的常用方法。在大多数其他平台上，主键的名称选择是任意的。但在\
  \ Android 案例中，键必须命名为 `_id`，才能使用所有 Android 数据库相关类完全访问数据库。其余字段每个都声明为 `text` 类型。\n\n\
  要列出当前选定数据库中的表，使用 `.tables` 语句：\n\n```\nsqlite> .tables\ncontacts\n```\n\n向表中插入记录：\n\
  \n```sql\nsqlite> insert into contacts (name, address, phone) values (\"Bill Smith\"\
  , \"123 Main Street, California\", \"123-555-2323\");\nsqlite> insert into contacts\
  \ (name, address, phone) values (\"Mike Parks\", \"10 Upping Street, Idaho\", \"\
  444-444-1212\");\n```\n\n从表中检索所有行：\n\n```sql\nsqlite> select * from contacts;\n\
  1|Bill Smith|123 Main Street, California|123-555-2323\n2|Mike Parks|10 Upping Street,\
  \ Idaho|444-444-1212\n```\n\n提取符合特定标准的行：\n\n```sql\nsqlite> select * from contacts\
  \ where name=\"Mike Parks\";\n2|Mike Parks|10 Upping Street, Idaho|444-444-1212\n\
  ```\n\n退出 `sqlite3` 交互式环境：\n\n```\nsqlite> .exit\n```\n\n在模拟器环境中运行 Android 应用程序时，任何数据库文件将使用之前讨论的路径约定在模拟器的文件系统上创建。这种方法的优点是你可以可以使用\
  \ `adb` 连接，导航到数据库文件位置，将其加载到 `sqlite3` 交互式工具中，并对数据进行操作，以识别应用程序代码中可能出现。\n\n同样重要的是，虽然可以通过\
  \ `adb shell` 连接到物理 Android 设备，但默认情况下 shell 并没有获得足够的权限来创建和管理 SQLite 数据库。因此，数据库问题的调试最好使用\
  \ AVD 会话进行。\n\n## Android SQLite 类\n\n如前所述，SQLite 是用 C 语言编写的，而 Android 应用程序主要使用\
  \ Java 或 Kotlin 开发。为了弥补这种“语言鸿沟”，Android SDK 包含了一组类，在 SQLite 数据库系统之上提供了编程层。本章剩余部分将提供该类别中主要类的概述。\n\
  \n### 65.9.1 Cursor\n\nCursor 是一个专门用于访问查询结果的类。例如，对数据库执行的 `SELECT` 操作可能会返回多个匹配行。可以使用\
  \ `Cursor` 实例来遍历这些结果。该类的一些关键方法包括：\n\n- `close()`：释放游使用的所有资源并关闭它。\n- `getCount()`：返回结果集中的行数。\n\
  - `moveToFirst()`：移动到结果集中的第一行。\n- `moveToLast()`：移动到结果集的最后一行。\n- `moveToNext()`：移动到结果集中的下一行。\n\
  - `move()`：按当前位置移动指定的偏移量。\n- `get<type>`：返回当前行指定列索引的指定 `<type>` 值（变体包括 `getString()`、`getInt()`、`getShort()`、`getFloat()`\
  \ 和 `getDouble()`）。\n\n### 65.9.2 SQLiteDatabase\n\n该类提供了应用程序代码与底层 SQLite 数据库之间的主要接口，包括创建、删除和对数据库执行\
  \ SQL 操作。该类的一些关键方法包括：\n\n- `insert()`：向数据库表中插入新行。\n- `delete()`：从数据库表中删除行。\n- `query()`：执行指定的数据库查询并通过\
  \ `Cursor` 对象返回匹配结果。\n- `execSQL()`：执行不返回结果数据的单个 SQL 语句。\n- `rawQuery()`：执行 SQL\
  \ 查询语句并以 `Cursor` 对象的形式返回匹配结果。\n\n### 65.9.3 SQLiteOpenHelper\n\n这是一个旨在更容易创建和更新数据库的辅助类。该类必须在寻求数据库访问的应用程序代码中子类化，并在子类中实现以下回调方法：\n\
  \n- `onCreate()`：在首次创建数据库时调用。该方法将 `SQLiteDatabase` 对象作为新创建数据库的参数传递。这是初始化数据库（包括创建表和插入初始数据行）的理想位置。\n\
  - `onUpgrade()`：当应用程序代码包含更新的数据库版本号引用时调用。这通常用于应用程序在设备上更新，并且需要更新数据库架构以处理额外数据存储的情况。\n\
  \n\n\n\n\n除了上述强制性的回调方法外，在数据库打开时调用的 `onOpen()` 方法也可以在子类中实现。\n\n子类的构造函数也必须被实现，用以调用父类，并传递应用上下文、数据库名称和数据库版本。\n\
  \n`SQLiteOpenHelper`类的常用方法包括：\n\n- `getWritableDatabase()` – 打开或创建一个可读写的数据库。返回以\
  \ `SQLiteDatabase` 对象形式表示的数据库引用。\n- `getReadableDatabase()` – 创建或打开一个只读的数据库。返回以\
  \ `SQLiteDatabase` 对象形式表示的数据库引用。\n- `close()` – 关闭数据库。\n\n### 65.9.4 ContentValues\n\
  \n`ContentValues` 是一个便利类，允许声明键/值对，这些键/值对由表列标识符和存储在每列中的值组成。该类在数据库表中插入或更新条目时特别有用。\n\
  \n### 65.10 Android Room 持久化库\n\nAndroid SDK SQLite 类局限性在于它们需要中等代码工作量，并且没有利用新的架构指南和特性（如\
  \ `LiveData` 和生命周期管理）。Android Jetpack 架构组件包含了 Room 持久化库来解决这些缺点。该库在 SQLite 数据库系统之上提供了一个高层接口，使得能够以极少的代码在\
  \ Android 设备上本地存储数据，同时符合现代应用程序架构的建议。\n\n接下来的章节将提供使用 SQLite 和 Room 持久化库进行 SQLite\
  \ 数据库概述和教程。\n\n### 65.11 总结\n\n`SQLite` 是一种轻量级的嵌入式关系型数据库管理系统，包含在 Android 框架中，为 Android\
  \ 应用实现组织的持久化数据存储提供了机制。与 Room 持久化库结合时，Android 提供了一种在 Android 应用内部实现数据存储的现代方法。\n\n\
  本章在 Android 应用开发的背景下，概述了通用数据库，特别是 SQLite。\n\n# 66. Android SQLite 数据库教程\n\n标题为“Android\
  \ SQLite 数据库概述”的章节涵盖了使用 SQLite 数据库管理系统将关系型数据库存储集成到 Android 应用中的基本原理。在本章中，我们将创建一个使用\
  \ SQLite 数据库的项目，用于存储和检索数据。\n\n### 66.1 关于数据库示例\n\n示例项目是一个简单的数据输入和检索应用程序，允许用户添加、查询和删除数据库条目。该应用程序背后的想法是一个包含客户姓名和电话号码的简单联系人数据库。\n\
  \n数据库文件名将为 `customerDB.db`，它反将包含一个名为 `customers` 的单表。数据库表中的每条记录将包含一个唯一的客户 ID、客户姓名和客户电话，分别对应列名“customername”和“customerphone”。客户\
  \ ID 列将作为主键，并由数据库管理系统自动分配和递增。\n\n### 66.2 创建 SQLDemo 项目\n\n启动 Android Studio，从欢迎界面选择\
  \ New Project（新建项目）选项，在生成的新项目对话框中，在点击 Next（下一步）按钮之前选择 Empty Views Activity 模板。\n\
  \n在 `Name`（名称）字段中输入 `SQLDemo`，并指定 `com.ebookfrenzy.sqldemo` 为包名。在点击 Finish（完成）按钮之前，将\
  \ Minimum API level 设置更改为 `API 26`：Android 8.0 (Oreo)，并将 Language 菜单设置为 Java。使用节\
  \ 11.8 将项目迁移到 View Binding 中的步骤，为项目启用视图绑定。\n\n### 66.3 设计用户界面\n\n打开 `activity_main.xml`\
  \ 文件并删除默认的 `TextView` 组件。在布局中添加两个 Plain Text（纯文本）字段、三个 Buttons（按钮）和一个 `TextView`，并如图\
  \ 66-1 所示所示：\n\n![](img/sql_demo_layout.jpg)\n\n图 66-1\n\n将 Plain Text 视图的 `hint`\
  \ 属性分别改为“name”和“phone”，并移除默认的“Name”文本属性。修改按钮使其显示“Add”、“Find”和“Delete”，并将 `TextView`\
  \ 文本改为“Database Ready”，将所有字符串值提取到资源中，并手动或使用 Infer（推断）约束按钮应用布局。\n\n将 Plain Text 视图和\
  \ `TextView` 的 ID 分别更改为 `customerName`、`customerPhone` 和 `statusText`。最后，配置按钮调用名为\
  \ `addCustomer`、`findCustomer` 和 `deleteCustomer` 的方法。\n\n### 66.4 创建数据模型\n\n完成后，应用程序将由一个\
  \ activity（活动）和一个数据库 handler（数据库处理器）类组成。数据库处理器将是 `SQLiteOpenHelper` 的子类，并在底层 SQLite\
  \ 数据库和 activity 类之间提供一个抽象层，由 activity 调用数据库处理器与数据库进行交互（添加、删除和查询数据库条目）。为了以结构化的方式实现这种交互，需要实现第三个类，用于在数据库条目在\
  \ activity 和处理器之间传递时持有条目数据。这实际上是一个非常简单的类，能够持有客户 ID、姓名和电话值，以及用于访问这些值的 getter（获取）和\
  \ setter（设置）方法。可以在 activity 和数据库处理器中创建该类的实例，并根据需要来传递。本质上，此类类代表数据库模型。\n\n在 Project（项目）工具窗口中导航到\
  \ `app -> java` 并右键点击包名。从弹出菜单中选择 New -> Java Class 选项，并在 Create New Class 对话框中将类命名为\
  \ `Customer`，在按回键之前将 Kind 菜单更改为 `Class`。\n\n一旦创建，`Customer.java` 源文件将加载到 Android\
  \ Studio 编辑器。加载后，修改代码以添加相应的构造函数：\n\n```java\npackage com.ebookfrenzy.sqldemo;\n\n\
  public class Customer {\n    private int id;\n    private String customerName;\n\
  \    private String customerPhone;\n\n    public Customer() {\n    }\n\n    public\
  \ Customer(int id, String customerName, String customerPhone) {\n        this.id\
  \ = id;\n        this.customerName = customerName;\n        this.customerPhone =\
  \ customerPhone;\n    }\n\n    public Customer(String customerName, String customerPhone)\
  \ {\n        this.customerName = customerName;\n        this.customerPhone = customerPhone;\n\
  \    }\n\n    public void setID(int id) {\n        this.id = id;\n    }\n\n    public\
  \ int getID() {\n        return id;\n    }\n\n    public void setCustomerName(String\
  \ customerName) {\n        this.customerName = customerName;\n    }\n\n    public\
  \ String getCustomerName() {\n        return customerName;\n    }\n\n    public\
  \ void setCustomerPhone(String customerPhone) {\n        this.customerPhone = customerPhone;\n\
  \    }\n\n    public String getCustomerPhone() {\n        return customerPhone;\n\
  \    }\n}\n```\n\n完成后的类包含用于内部存储数据库条目列的数据成员。\n\n### 66.5 实现数据处理器\n\n数据处理器将通过继承 Android\
  \ `SQLiteOpenHelper` 类来实现，并按照“Android SQLite 数据库概述”中的概述，添加构造函数、`onCreate()` 和 `onUpgrade()`\
  \ 方法。由于处理器需要代表活动组件添加、查询和删除数据，因此该类中还需要添加相应的方法。\n\n\n\n\n首先，向项目添加第二个新类作为处理程序，命名为 `MyDBHandler`。创建新类后，对其进行修改使其读取如下：\n\
  \n```java\npackage com.ebookfrenzy.sqldemo;\n\nimport android.database.sqlite.SQLiteDatabase;\n\
  import android.database.sqlite.SQLiteOpenHelper;\nimport android.content.Context;\n\
  import android.content.ContentValues;\nimport android.database.Cursor;\n\npublic\
  \ class MyDBHandler extends SQLiteOpenHelper {\n    public MyDBHandler(Context context,\
  \ String name, SQLiteDatabase.CursorFactory factory, int version) {\n        super(context,\
  \ DATABASE_NAME, factory, DATABASE_VERSION);\n    }\n\n    @Override\n    public\
  \ void onCreate(SQLiteDatabase db) {\n    }\n\n    @Override\n    public void onUpgrade(SQLiteDatabase\
  \ db, int oldVersion, int newVersion) {\n    }\n}\n```\n\n现在我们已经在源文件中预填充了模板 `onCreate()`\
  \ 和 `onUpgrade()` 方法，接下来的任务是修改代码，为数据库名称、表名、表列和数据库版本声明常量如下：\n\n```java\npublic class\
  \ MyDBHandler extends SQLiteOpenHelper {\n    private static final int DATABASE_VERSION\
  \ = 1;\n    private static final String DATABASE_NAME = \"customerDB.db\";\n   \
  \ public static final String TABLE_CUSTOMERS = \"customers\";\n    public static\
  \ final String COLUMN_ID = \"id\";\n    public static final String COLUMN_CUSTOMERNAME\
  \ = \"customername\";\n    public static final String COLUMN_CUSTOMERPHONE = \"\
  customerphone\";\n}\n```\n\n接下来，需要实现 `onCreate()` 方法，以便在数据库首次初始化时创建客户表。这涉及构造一个 SQL\
  \ CREATE 语句，该语句包含创建具有适当列的新表所需的指令，然后通过传递给 `onCreate()` 参数的 `SQLiteDatabase` 对象的 `execSQL()`\
  \ 方法将其传递过去：\n\n```java\n@Override\npublic void onCreate(SQLiteDatabase db) {\n \
  \   String CREATE_CUSTOMERS_TABLE = \"CREATE TABLE \" +\n            TABLE_CUSTOMERS\
  \ + \"(\"\n            + COLUMN_ID + \" INTEGER PRIMARY KEY,\" +\n            +\
  \ COLUMN_CUSTOMERNAME\n            + \" TEXT,\" + COLUMN_CUSTOMERPHONE + \" TEXT\"\
  \ + \")\";\n    db.execSQL(CREATE_CUSTOMERS_TABLE);\n}\n```\n\n当调用处理程序时使用的数据库版本号大于之前使用的版本，就会调用\
  \ `onUpgrade()` 方法。在此情况下要执行的具体步骤将取决于应用程序，因此对于本示例，我们将删除旧数据库并创建一个新的：\n\n```java\n\
  @Override\npublic void onUpgrade(SQLiteDatabase db, int oldVersion, int newVersion)\
  \ {\n    db.execSQL(\"DROP TABLE IF EXISTS \" + TABLE_CUSTOMERS);\n    onCreate(db);\n\
  }\n```\n\n在 `MyDBHandler.java` 处理类中，剩余需要实现的是添加、查询和删除数据库表条目的方法。\n\n### 66.6 添加处理程序方法\n\
  \n插入数据库记录的方法将命名为 `addCustomer()`，并将我们的 `Customer` 数据模型类的实例作为参数。在方法体中将创建一个 `ContentValues`\
  \ 对象，并填充从 `Customer` 对象中提取的用于数据列的键值对。接下来，通过调用 `getWritableDatabase()` 获取数据库的引用，然后调用返回的数据库对象的\
  \ `insert()` 方法。最后，一旦完成插入，就需要关闭数据库：\n\n```java\npublic void addCustomer(Customer\
  \ customer) {\n    ContentValues values = new ContentValues();\n    values.put(COLUMN_CUSTOMERNAME,\
  \ customer.getCustomerName());\n    values.put(COLUMN_CUSTOMERPHONE, customer.getCustomerPhone());\n\
  \    SQLiteDatabase db = this.getWritableDatabase();\n    db.insert(TABLE_CUSTOMERS,\
  \ null, values);\n    db.close();\n}\n```\n\n### 66.7 查询方法\n\n查询数据库的方法将命名为 `findCustomer()`，并将一个包含要查找客户名称的\
  \ `String` 对象作为参数。使用此字符串，将构造一个 SQL SELECT 语句来查找表中所有匹配的记录。对于本示例，将仅返回第一个匹配项，它包含在一个新的\
  \ `Customer` 数据类实例中：\n\n```java\npublic Customer findCustomer(String customername)\
  \ {\n    String query = \"SELECT * FROM \" + TABLE_CUSTOMERS + \" WHERE \" + COLUMN_CUSTOMERNAME\
  \ + \" = \\\"\" + customername + \"\\\"\";\n    SQLiteDatabase db = this.getWritableDatabase();\n\
  \    Cursor cursor = db.rawQuery(query, null);\n    Customer customer = new Customer();\n\
  \    if (cursor.moveToFirst()) {\n        customer.setID(Integer.parseInt(cursor.getString(0)));\n\
  \        customer.setName(cursor.getString(1));\n        customer.setPhone(cursor.getString(2));\n\
  \    } else {\n        customer = null;\n    }\n    db.close();\n    return customer;\n\
  }\n```\n\n### 66.8 删除方法\n\n删除方法将命名为 `deleteCustomer()`，并将以 `Customer` 对象形式接收的待删除条目作为参数。该方法将使用\
  \ SQL SELECT 语句根据客户名称搜索该条目，如果找到，则将其从表中删除。删除的成功与否将反映在 `Boolean` 返回值中：\n\n```java\n\
  public boolean deleteCustomer(String customername) {\n    boolean result = false;\n\
  \    String query = \"SELECT * FROM \" + TABLE_CUSTOMERS + \" WHERE \" + COLUMN_CUSTOMERNAME\
  \ + \" = \\\"\" + customername + \"\\\"\";\n// ... (逻辑根据上文推断)\n    return result;\n\
  }\n```\n\n### 66.9 实现 Activity 事件方法\n\n在测试应用程序之前的最后一个任务是为用户界面中的三个按钮编写 `onClick`\
  \ 事件处理程序。将 `java` 源文件加载到编辑器并添加如下的 `onClick` 目标方法：\n\n```java\n// (此处根据上下文逻辑补全翻译代码结构)\n\
  ```\n\n\n\n\n```java\nbinding.customerName.getText().toString());\n\nif (result)\n\
  {\n    binding.statusText.setText(\"Record Deleted\");\n    binding.customerName.setText(\"\
  \");\n    binding.customerPhone.setText(\"\");\n}\nelse\n    binding.statusText.setText(\"\
  No Match Found\");\n}\n}\n```\n\n### 66.10 测试应用程序\n\n完成代码更改后，在 AVD 模拟器会话或物理 Android\
  \ 设备上编译并运行应用程序。程序运行后，在用户界面表单中输入姓名和电话号码，然后点击 `Add` 按钮。记录添加后，文本框将清空。重复这些步骤向数据库中添加第二个客户。接下来，将新添加客户之一的名称输入客户名称字段，并点击\
  \ `Find` 按钮。表单应更新为所选客户的 ID 和电话号码。点击 `Delete` 按钮删除所选记录。随后通过客户名称进行搜索，应显示该记录已不存在。\n\
  \n### 66.11 总结\n\n本章步步渐进地介绍了 Android 应用程序中基于 `SQLite` 数据库存储的实际应用。为了进一步开发你的新数据库技能集，可以考虑扩展示例，以包含更新数据库表中现有记录的能力。\n\
  \n## 67. 理解 Android 内容提供者 (Content Providers)\n\n上一章创建了一个旨在使用 `SQLite` 数据库存储数据的示例应用程序。通过这种方式实现时，数据对于该应用程序是私有的，因此运行在同一设备上的其他应用程序无法访问。虽然这可能是许多类型应用程序的预期行为，但不可避免地会出现某些情况，即代表应用程序存储的数据可以使其他应用程序受益。一个典型的例子是\
  \ Android 设备上内置 `Contacts` 应用存储的数据。虽然 `Contacts` 应用主要负责管理用户的联系人列表详情，但这些数据也提供给任何需要访问的其它应用程序。Android\
  \ 应用程序之间的这种数据共享通过实现内容提供者来实现。\n\n### 67.1 什么是内容提供者？\n\n内容提供者提供了不同 Android 应用程序之间对结构化数据的访问权限。这些数据以数据表的形式（类似于\
  \ `SQLite` 数据库）或文件句柄的形式暴露给应用程序。这本质上涉及实现一种客户端/服务器架构，其中请求访问数据的应用程序是客户端，而内容提供者是服务器，代表客户端执行操作并返回结果。\n\
  \n一个成功的内容提供者实现涉及多个元素，每个元素都将在本章的剩余部分详细介绍。\n\n### 67.2 内容提供者\n\n内容提供者是作为 `android.content.ContentProvider`\
  \ 类的子类的。通常，负责管理共享数据的应用程序将实现一个内容提供者，以便将该数据与其他应用程序共享。\n\n创建内容提供者涉及实现方法来代表其他客户端应用程序管理数据。这些方法如下：\n\
  \n#### 67.2.1 onCreate()\n\n此方法在内容提供者首次创建时被调用，用于执行内容提供者所需的任何初始化任务。\n\n#### 67.2.2\
  \ query()\n\n当客户端请求从内容提供者检索数据时，将调用此方法。该方法识别要检索的数据（单行或多行），执行数据提取，并将结果封装在 `Cursor`\
  \ 对象中返回。\n\n#### 67.2.3 insert()\n\n当需要向提供者数据库中插入新的一行时，将调用此方法。该方法必须识别数据的目标位置，执行插入并返回新添加行的完整\
  \ URI。\n\n#### 67.2.4 update()\n\n当需要代表客户端更新现有行时调用的方法。该方法使用传递的参数来更新相应的表行，并返回操作后更新的行数。\n\
  \n#### 67.2.5 delete()\n\n当需要从表中删除行时调用。此方法删除指定的行，并返回被删除的行数计数。\n\n#### 67.2.6 getType()\n\
  \n返回由内容提供者存储的数据的 MIME 类型。\n\n在内容提供者中实现这些方法时，有一点很重要：除 `onCreate()` 方法外，它们可以从多个进程同时被调用，因此必须是线程安全的。\n\
  \n一旦实现了内容提供者，随之产生的问题是如何在 Android 系统中识别该提供者。这正是内容 URI 发挥用场的地方。\n\n### 67.3 内容 URI\n\
  \nAndroid 设备可能包含多个内容提供者。因此，系统必须提供某种方式将一个提供者与另一个区分开来。同样，单个内容提供者可能提供对多种形式内容的访问（通常以数据库表的形式）。因此，客户端应用程序需要一种方法来指定所需的底层数据。这是通过使用内容\
  \ URI 实现的。\n\n内容 URI 用于识别特定内容提供者中的特定数据。URI 的 Authority（权限）部分标识内容提供者，通常采用内容提供者的包名形式。例如：\n\
  \n`com.example.mydbapp.myprovider`\n\n通过在权限 之后附加表名，可以引用提供者结构中的特定数据库表。例如，以下 URI 引用了内容提供者中名为\
  \ `products` 的表：\n\n`com.example.mydbapp.myprovider/products`\n\n同样，通过向 URI 附加行\
  \ ID，可以引用指定表中的特定行。例如，以下 URI 引用了 `products` 表中 `ID` 列存储的值等于 `3` 的行：\n\n`com.example.mydbapp.myprovider/products/3`\n\
  \n在内容提供者中实现 `insert`、`query`、`update` 和 `delete` 方法时，这些方法有责任识别传入的 URI 是指向表中的特定行，还是引用了多行，并采取相应的操作。由于\
  \ URI 可能会扩展到多个层次，这可能是一项复杂的任务。然而，通过使用 `UriMatcher` 类可以显著简化这一过程，将在下一章中概述。\n\n### 67.4\
  \ 内容解析器 (Content Resolver)\n\n对内容提供者的访问通过 `ContentResolver` 对象实现。应用程序可以通过调用应用上下文的\
  \ `getContentResolver()` 方法获取其内容解析器的引用。\n\n内容解析器对象包含一组与内容提供者镜像的方法（`insert`、`query`、`delete`\
  \ 等）。应用程序只需调用这些方法并指定要执行操作的内容 URI。内容解析器和内容提供者对象随后通信，代表应用程序执行请求的任务。\n\n### 67.5 <provider>\
  \ 清单元素\n\n为了让内容提供者在 Android 系统中可见，必须在所属应用程序的 Android 清单（Manifest）文件中进行声明。这是通过使用\
  \ `<provider>` 元素实现的，它必须包含以下项目：\n\n- `android:authority` – 内容提供者的完整权限 URI。例如 `com.example.mydbapp.mydbapp.myprovider`。\n\
  \n- `android:name` – 实现内容提供者的类名。大多数情况下，该值将与 authority 相同。\n\n\n\n\n同样地，`<provider>`\
  \ 元素可用于定义客户端应用程序必须具备的权限才能访问底层数据。如果没有声明任何权限，默认行为是允许所有应用程序访问。\n\n权限可以设置为涵盖整个内容提供者，也可以限制特定的表和记录。\n\
  \n### 67.6 总结\n属于应用程序的数据通常是私有的，其他应用程序无法访问。当需要共享数据时，就需要设置内容提供者。本章介绍了实现应用程序间数据共享的基本元素，并概述了内容提供者（content\
  \ provider）、内容 URI（content URI）和内容解析器（content resolver）的概念。\n\n在下一章中，将扩展之前创建的 `SQLdemo`\
  \ 项目，通过内容提供者使底层客户数据可用。\n\n## 68. Android 内容提供者教程\n如上一章所述，内容提供者提供了一种机制，一个 Android\
  \ 应用程序存储的数据可以被其他应用程序访问。在提供了内容提供者的理论概述后，本章将通过扩展在标题为“Android SQLite 数据库教程”章节中创建的 `SQLDemo`\
  \ 项目，继续实现基于内容提供者的数据库访问。\n\n### 68.1 复制 SQLDemo 项目\n为了保持原始 `SQLDemo` 项目完整，我们将在修改它以实现应用程序的内容提供者支持之前，为项目创建一个备份副本。如果\
  \ `SQLDemo` 项目当前 Android Android Studio 中，请使用 `File` -> `Close Project` 菜单选项关闭它。\n\
  \n使用你操作系统的文件管理器，导航到包含 Android Studio 项目的目录，并将 `SQLDemo` 项目文件夹复制到名为 `SQLDemo_provider`\
  \ 的新文件夹中。\n\n在 Android Studio 欢迎界面，打开 `SQLDemo_provider` 项目使其加载到主窗口。\n\n### 68.2\
  \ 添加内容提供者包\n下一步是向 `SQLDemo` 项目添加一个新包以包含内容提供者类。在 Project（项目）窗口中导航到 `app` -> `java`，右键点击它，并选择\
  \ `New` -> `Package` 菜单选项添加此新包。当 `Choose Destination Directory` 对话框出现时，从目录结构面板选择\
  \ `..\\app\\src\\main\\java` 选项并点击 OK。\n\n在 `New Package` 对话框中，按下回车键之前，在 name 字段中输入以下包名：\n\
  \n`com.ebookfrenzy.sqldemo.provider`\n\n新包现在应该列在 Project 窗口列表中，如图 38-1 所示：\n\n![](img/as_content_provider_package.jpg)\n\
  \n图 68-1\n\n### 68.3 创建内容提供者类\n如“理解 Android 内容提供者”所示，内容提供者是通过子类 `android.content.ContentProvider`\
  \ 类创建的。因此，下一步是在新的提供者包中添加一个类作为此应用程序的内容提供者。在 Project 窗口中找到新包，右键点击它并选择 `New` -> `Other`\
  \ -> `Content Provider` 菜单选项。在 `Configure Component` 对话框中，在 `Class Name` 字段中输入 `MyContentProvider`并在\
  \ `URI Authorities` 字段中输入以下内容：\n\n`com.ebookfrenzy.sqldemo.provider.MyContentProvider`\n\
  \n在点击 `Finish` 创建新类之前，确保新的内容提供者类已导出并启用。\n\n一旦新类创建完成，`MyContentProvider.java` 文件应列在\
  \ Project 窗口提供者包下方，并自动加载到编辑器中，其内容将如下列表所示：\n\n```java\npackage com.ebookfrenzy.sqldemo.provider;\n\
  \nimport android.content.ContentProvider;\n\nimport android.content.ContentValues;\n\
  \nimport android.database.Cursor;\n\nimport android.net.Uri;\n\npublic class MyContentProvider\
  \ extends ContentProvider {\n\n    public MyContentProvider() {\n\n    }\n\n   \
  \ @Override\n    public int delete(Uri uri, String selection, String[] selectionArgs)\
  \ {\n        // 实现此方法以处理删除一个或多行的请求。\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n    }\n\n    @Override\n    public String getType(Uri uri)\
  \ {\n        // TODO: 实现此方法以处理给定 URI 的 MIME 类型请求。\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n    }\n\n    @Override\n    public Uri insert(Uri uri,\
  \ ContentValues values) {\n        // TODO: 实现此方法以处理插入新行的请求。\n        throw new\
  \ UnsupportedOperationException(\"Not yet implemented\");\n    }\n\n    @Override\n\
  \    public boolean onCreate() {\n        // TODO: 实现此方法在启动时初始化你的提供者。\n        return\
  \ false;\n    }\n\n    @Override\n    public Cursor query(Uri uri, String[] projection,\
  \ String selection, String[] selectionArgs, String sortOrder) {\n        // TODO:\
  \ 实现此方法以处理来自客户端的查询。\n        throw new UnsupportedOperationException(\"Not yet implemented\"\
  );\n    }\n\n    @Override\n    public int update(Uri uri, ContentValues values,\
  \ String selection, String[] selectionArgs) {\n        // TODO: 实现此方法以更新一个或多行。\n\
  \        throw new UnsupportedOperationException(\"Not yet implemented\");\n   \
  \ }\n}\n```\n\n通过快速查看此文件的代码可以发现，Android Studio 已经填充了 `ContentProvider` 子类需要实现的每个方法的存根。很快就需要开始实现这些方法了，但首先需要声明与提供者内容机构（authority）相关的常量。\n\
  \n### 68.4 构建内容机构和内容 URI\n如上一章所述，所有内容提供者都必须关联一个机构（authority）和一个内容 URI。在实践中，机构通常是内容提供者类的完整包名，在此例为\
  \ `com.ebookfrenzy.sqldemo.provider.MyContentProvider`，正如在上一节创建新的内容提供者类时定义那样。\n\n\
  内容 URI 取决于应用程序，对于本示例，它将包含机构以及结尾的表名。在 `MyContentProvider.java` 文件中，进行以下修改：\n\n```java\n\
  package com.ebookfrenzy.sqldemo.provider;\n\n...\n\npublic class MyContentProvider\
  \ extends ContentProvider {\n\n    private static final String AUTHORITY = \"com.ebookfrenzy.sqldemo.provider.MyContentProvider\"\
  ;\n\n    private static final String CUSTOMERS_TABLE = \"customers\";\n\n    public\
  \ static final Uri CONTENT_URI = Uri.parse(\"content://\" + AUTHORITY + \"/\" +\
  \ CUSTOMERS_TABLE);\n\n    ...\n}\n```\n\n上述语句首先创建一个名为 `AUTHORITY` 的新字符串对象并将字符串赋值给它。同样，创建一个名为\
  \ `CUSTOMERS_TABLE` 的第二个字符串对象并初始化为我们的数据库表名（customers）。\n\n最后，将这两个字符串元素组合，加上前缀 `content://`\
  \ 并使用 `Uri` 类的 `parse()` 方法转换为 `Uri` 对象。结果被赋值给名为 `CONTENT_URI` 的变量。\n\n### 68.5\
  \ 在内容提供者中实现 URI 匹配\n\n\n\n\n\n当调用内容提供程序（content provider）的方法时，它们将接收一个 `URI` 作为参数，该\
  \ `URI` 指明要操作的数据。此 `URI` 的形式可以是指向特定表中特定行的引用。`URI` 也有可能更加通用，例如仅指定数据库表。每个方法都有责任识别\
  \ `Uri` 类型并采取相应的操作。通过使用 `UriMatcher` 实例可以极大地减轻这项任务。一旦创建了 `UriMatcher` 实例，就可以对其进行配置，使其在被要求时返回一个与其检测到的\
  \ `URI` 类型相对应的特定整数值。在本教程中，我们将配置 `UriMatcher` 实例，当 `URI` 引用整个 `customers` 表时返回值 `1`，而当\
  \ `URI` 引用 `customers` 表中特定行的 ID 时返回值 `2`。在开始创建 `URIMatcher` 实例之前，我们首先将创建两个整数变量来表示这两种\
  \ `URI` 类型：\n\n```java\npackage com.ebookfrenzy.sqldemo.provider;\n\nimport android.database.sqlite.SQLiteDatabase;\n\
  import android.database.sqlite.SQLiteQueryBuilder;\nimport android.content.UriMatcher;\n\
  import android.text.TextUtils;\nimport com.ebookfrenzy.sqldemo.MyDBHandler;\n\n\
  public class MyContentProvider extends ContentProvider {\n    private static final\
  \ String AUTHORITY = \"com.ebookfrenzy.sqldemo.provider.MyContentProvider\";\n \
  \   private static final String CUSTOMERS_TABLE = \"customers\";\n    public static\
  \ final Uri CONTENT_URI = Uri.parse(\"content://\" + AUTHORITY + \"/\" + CUSTOMERS_TABLE);\n\
  \    public static final int CUSTOMERS = 1;\n    public static final int CUSTOMER_ID\
  \ = 2;\n}\n```\n\n声明了 `URI` 类型变量后，现在是时候添加代码创建 `UriMatcher` 实例并配置其返回相应的变量了：\n\n```java\n\
  public class MyContentProvider extends ContentProvider {\n    private MyDBHandler\
  \ myDB;\n\n    public static final int CUSTOMERS = 1;\n    public static final int\
  \ CUSTOMER_ID = 2;\n\n    private static final UriMatcher sURIMatcher = new UriMatcher(UriMatcher.NO_MATCH);\n\
  \n    static {\n        sURIMatcher.addURI(AUTHORITY, CUSTOMERS_TABLE, CUSTOMERS);\n\
  \        sURIMatcher.addURI(AUTHORITY, CUSTOMERS_TABLE + \"/#\", CUSTOMER_ID);\n\
  \    }\n}\n```\n\n`UriMatcher` 实例（命名为 `sURIMatcher`）现在已准备好，当 `URI` 仅引用客户表时，返回 `CUSTOMER`\
  \ 的值；当 `URI` 包含表中特定行的 ID 时，返回 `CUSTOMER_ID` 值。\n\n## 68.6 实现内容提供程序的 `onCreate()`\
  \ 方法\n\n当内容提供程序类被创建并初始化时，将调用该类的 `onCreate()` 方法。在此方法内部，必须执行该类的任何初始化任务。对于此示例，所有需要执行的是创建一个在“Android\
  \ SQLite 数据库教程”中实现的 `MyDBHandler` 类的实例。一旦创建了该实例，它将需要被类中的其他方法访问，因此还需要对数据库句柄进行声明，这导致\
  \ `MyContentProvider.java` 文件发生以下代码更改：\n\n```java\n@Override\npublic boolean onCreate()\
  \ {\n    myDB = new MyDBHandler(getContext(), null, null, 1);\n    return false;\n\
  }\n```\n\n## 68.7 实现内容提供程序的 `insert()` 方法\n\n当客户端应用程序或活动请求向底层数据库插入数据时，将调用内容提供程序类的\
  \ `insert()` 方法。然而，此时项目中的 `MyContentProvider.kt` 文件中仅存在于一个存根方法，其内容如下：\n\n```java\n\
  public Uri insert(Uri uri, ContentValues values) {\n    TODO(\"实现此以处理插入新行的请求。\"\
  )\n}\n```\n\n作为参数传递给方法的是指定插入目的的 `URI` 和一个包含要插入数据的 `ContentValues` 对象。现在需要修改此方法以执行以下任务：\n\
  \n- 使用 `sUriMatcher` 对象识别 `URI` 类型。\n- 如果 `URI` 无效，则抛出异常。\n- 获取底层 `SQLiteDatabase`\
  \ 可写实例的引用。\n- 执行 SQL `insert` 操作将数据插入数据库表。\n- 通知相应的 `content resolver`（内容解析器）数据库已修改。\n\
  - 返回新添加行的 `URI`。\n\n将这些需求整合在一起得到了修改后的 `insert()` 方法，其内容如下：\n\n```java\n@Override\n\
  public Uri insert(Uri uri, ContentValues values) {\n    int uriType = sURIMatcher.match(uri);\n\
  \    SQLiteDatabase sqlDB = myDB.getWritableDatabase();\n    long id = 0;\n    switch\
  \ (uriType) {\n        case CUSTOMERS:\n            id = sqlDB.insert(MyDBHandler.TABLE_CUSTOMERS,\
  \ null, values);\n            break;\n        default:\n            throw new IllegalArgumentException(\"\
  Unknown URI: \" + uri);\n    }\n    getContext().getContentResolver().notifyChange(uri,\
  \ null);\n    return Uri.parse(CUSTOMERS_TABLE + \"/\" + id);\n}\n```\n\n## 68.8\
  \ 实现内容提供程序的 `query()` 方法\n\n当调用内容提供程序返回数据时，将调用该类的 `query()` 方法。调用时，该方法接收以下部分或全部参数：\n\
  \n- `URI` —— 执行查询的源。它可以可以是包含多个结果的通用查询，也可以是针对表中特定行 ID 的查询。\n- `Projection`（投影）——\
  \ 数据库中的多个列。在本应用程序中，这些对应于 ID、电话号码。`projection` 参数是一个包含要返回结果中每个列的数组。\n- `Selection`（选择）——\
  \ 查询中执行的“where”元素。此参数控制从数据库中选择哪些行。例如，如果查询需要选择名为“John”的客户，传递给 `query()` 方法的 `selection`\
  \ 将为 `name = “John”`。\n- `Selection Args`（选择参数）—— 需要传递给 SQL 查询以执行选择的附加参数。\n- `Sort\
  \ Order`（排序）—— 选中行的排序。\n\n`query()` 方法需要执行以下操作：\n\n- 使用 `sMatcher` 识别 `URI` 类型。\n\
  - 如果 `URI` 无效，则抛出异常。\n- 根据传递的标准构建 SQL 查询。为了方便起见，可以使用 `SQLiteQueryBuilder` 类来构建查询。\n\
  - 在数据库上执行查询。\n- 通知 `content resolver` 操作。\n- 返回包含结果的 `Cursor` 对象。考虑到这些需求，`MyContentProvider.kt`\
  \ 文件中 `query()` 方法的代码现在应该如下所示：\n\n```java\n@Override\npublic Cursor query(Uri uri,\
  \ String[] projection, String selection, String[] selectionArgs, String sortOrder)\
  \ {\n    SQLiteQueryBuilder queryBuilder = new SQLiteQueryBuilder();\n    queryBuilder.setTables(MyDBHandler.TABLE_CUSTOMERS);\n\
  \    int uriType = sURIMatcher.match(uri);\n    switch (uriType) {\n        case\
  \ CUSTOMER_ID:\n            queryBuilder.appendWhere(MyDBHandler.COLUMN_ID+\" +\
  \ uri.getLastPathSegment());\n            break;\n        case CUSTOMERS:\n    \
  \        break;\n        default:\n            throw new IllegalArgumentException(\"\
  Unknown URI\");\n    }\n    Cursor cursor = queryBuilder.query(myDB.getReadableDatabase(),\
  \ projection, selection, selectionArgs, null, null, sortOrder);\n    cursor.setNotificationUri(getContext().getContentResolver(),\
  \ uri);\n}\n```\n\n\n\n\nreturn cursor;\n}\n\n## 68.9 实现 Content Provider 的 `update()`\
  \ 方法\n\n当请求现有数据库表行的更改时，会调用 content provider 的 `update()` 方法。该方法会接收一个 `URI`、一个以 `ContentValues`\
  \ 对象形式表示的新值，以及常用的选择参数字符串。\n\n调用时，`update()` 方法通常会执行以下步骤：\n\n-   使用 `sUriMatcher`\
  \ 识别 `URI` 类型。\n-   如果 `URI` 无效，则抛出异常。\n-   获取底层 `SQLite database` 可写实例的引用。\n- \
  \  根据选择标准和 `URI` 类型在数据库上执行相应的更新操作。\n-   通知 `content resolver` 数据库发生了变化。\n-   返回因更新操作而更改的行数。\n\
  \n通用的 `update()` 方法（以及我们将在项目中使用的方法）其实现如下：\n\n```java\n@Override\npublic int update(Uri\
  \ uri, ContentValues values, String selection,\n                  String[] selectionArgs)\
  \ {\n    int uriType = sURIMatcher.match(uri);\n    SQLiteDatabase sqlDB = myDB.getWritableDatabase();\n\
  \    int rowsUpdated = 0;\n    switch (uriType) {\n        case CUSTOMERS:\n   \
  \         rowsUpdated =\n                sqlDB.update(MyDBHandler.TABLE_CUSTOMERS,\n\
  \                             values,\n                             selection,\n\
  \                             selectionArgs);\n            break;\n        case\
  \ CUSTOMER_ID:\n            String id = uri.getLastPathSegment();\n            if\
  \ (TextUtils.isEmpty(selection)) {\n                rowsUpdated =\n            \
  \        sqlDB.update(MyDBHandler.TABLE_CUSTOMERS,\n                           \
  \      values,\n                                 MyDBHandler.COLUMN_ID + \"=\" +\
  \ id,\n                                 null);\n            } else {\n         \
  \       rowsUpdated =\n                    sqlDB.update(MyDBHandler.TABLE_CUSTOMERS,\n\
  \                                 values,\n                                 MyDBHandler.COLUMN_ID\
  \ + \"=\" + id\n                                     + \" and \"\n             \
  \                        + selection,\n                                 selectionArgs);\n\
  \            }\n            break;\n        default:\n            throw new IllegalArgumentException(\"\
  Unknown URI: \" + uri);\n    }\n    getContext().getContentResolver().notifyChange(uri,\
  \ null);\n    return rowsUpdated;\n}\n```\n\n## 68.10 实现 Content 的 `delete()` 方法\n\
  \n与许多其他 content provider 方法一样，`delete()` 方法会接收一个 `URI`、一个选择字符串和一组可选的选择参数。典型的 `delete()`\
  \ 方法在调用时还会执行以下（现在已经很熟悉的）任务：\n\n-   使用 `sUriMatcher` 识别 `URI` 类型。\n-   如果 `URI` 无效，则抛出异常。\n\
  -   获取底层 `SQLite database` 可写实例的引用。\n-   根据选择标准和 `Uri` 类型在数据库上执行相应的删除操作。\n-   通知\
  \ `content resolver` 数据库发生了变化。\n-   返回因操作而更改的行数。\n\n典型的 `delete()` 方法在许多方面与 `update()`\
  \ 方法相似，可以如下方式实现：\n\n```java\n@Override\npublic int delete(Uri uri, String selection,\
  \ String[] selectionArgs) { \n    int uriType = sURIMatcher.match(uri);\n    SQLiteDatabase\
  \ sqlDB = myDB.getWritableDatabase();\n    int rowsDeleted = 0;\n    switch (uriType)\
  \ {\n        case CUSTOMERS:\n            rowsDeleted = sqlDB.delete(MyDBHandler.TABLE_CUSTOMERS,\n\
  \                                      selection,\n                            \
  \          selectionArgs);\n            break;\n        case CUSTOMER_ID:\n    \
  \        String id = uri.getLastPathSegment();\n            if (TextUtils.isEmpty(selection))\
  \ {\n                rowsDeleted = sqlDB.delete(MyDBHandler.TABLE_CUSTOMERS,\n \
  \                                         MyDBHandler.COLUMN_ID + \"=\" + id,\n\
  \                                          null);\n            } else {\n      \
  \          rowsDeleted = sqlDB.delete(MyDBHandler.TABLE_CUSTOMERS,\n           \
  \                               MyDBHandler.COLUMN_ID + \"=\" + id\n           \
  \                                  + \" and \" + selection,\n                  \
  \                        selectionArgs);\n            }\n            break;\n  \
  \      default:\n            throw new IllegalArgumentException(\"Unknown URI: \"\
  \ + uri);\n    }\n    getContext().getContentResolver().notifyChange(uri, null);\n\
  \    return rowsDeleted;\n}\n```\n\n实现这些方法后，根据本示例的要求，content provider 类就已经完成了了。下一步是确保在项目清单文件文件中声明了该\
  \ content provider，以便任何寻求访问的 content resolver 都能看到它。\n\n## 68.11 在清单文件中声明 Content\
  \ Provider\n\n除非 content provider 在其所属的应用程序清单文件中被声明，否则 content resolver 将无法定位并访问它。如所述，content\
  \ providers 使用 `<provider>` 标签进行声明，且清单条目必须正确引用 content authority（内容授权）。\n\n对于此项目，在\
  \ Project 窗口中找到 `AndroidManifest.xml` 并双击它以将其加载到编辑面板中。在编辑面板中，确保在向项目文件中添加 `ContentProvider`\
  \ 类时，已经添加了该 content provider：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ xmlns:tools=\"http://schemas.android.com/tools\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:dataExtraction=\"@xml/data_rules\"\n        android:fullBackup=\"\
  @xml/backup_rules\"\n        android:icon=\"@mipmap/launcher\"\n        android:label=\"\
  @string/app_name\"\n        android:roundIcon=\"@mipmap/launcher_round\"\n     \
  \   android:supportsRtl=\"true\"\n        android:theme=\"@style/Theme.Demo\"\n\
  \        tools:targetApi=\"31\">\n        <provider\n            authorities=\"\
  com.ebookrenzy.sqldemo.provider.ContentProvider\"\n            android:enabled=\"\
  true\"\n            android:exported=\"true\"\n            android:name=\".provider.ContentProvider\"\
  \ />\n        <activity\n            android:name=\".MainActivity\"\n          \
  \  android:exported=\"true\">\n            <intent-filter>\n                <action\
  \ android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n\
  \    </application>\n</manifest>\n```\n\n在测试应用程序之前，剩下的就是修改数据库 handler 使用 content\
  \ provider 而不是直接访问数据库。\n\n## 68.12 修改数据库 Handler\n\n当此应用程序最初创建时，设计为使用数据库 handler\
  \ 直接访问底层数据库。现在已经实现了 content provider，需要修改数据库 handler，通过 content resolver 使用 content\
  \ provider 执行所有数据库操作。\n\n第一步是修改 `MyDBHandler.kt` 类，使其获取 `ContentResolver` 实例的引用。这可以通过类的构造方法实现：\n\
  \n```java\npackage com.ebookrenzy.sqldemo;\n\nimport android.content.ContentResolver;\n\
  import com.ebookrenzy.sqldemo.provider.MyContentProvider;\n\npublic class MyDBHandler\
  \ extends SQLiteOpenHelper {\n\n    private ContentResolver myCR;\n\n    public\
  \ MyDBHandler(Context context, String name,\n                      SQLiteDatabase.CursorFactory\
  \ factory, int version) {\n        super(context, DATABASE_NAME, factory, version);\n\
  \        myCR = context.getContentResolver();\n    }\n}\n```\n\n\n\n\n接下来，需要重写 `addCustomer()`、`findCustomer()`\
  \ 和 `removeCustomer()` 方法，以使用内容解析者（content resolver）和内容提供者（content provider）进行数据管理：\n\
  \n```java\npublic void addCustomer(Customer customer) {\n    ContentValues values\
  \ = new ContentValues();\n    values.put(COLUMN_CUSTOMERNAME, customer.getCustomerName());\n\
  \    values.put(COLUMN_CUSTOMERPHONE, customer.getCustomerPhone());\n    myCR.insert(MyContentProvider.CONTENT_URI,\
  \ values);\n}\n\npublic Customer findCustomer(String customername) {\n    String[]\
  \ projection = {COLUMN_ID,\n            COLUMN_CUSTOMERNAME, COLUMN_CUSTOMERPHONE\
  \ };\n    String selection = \"customername = \\\"\" + customername + \"\\\"\";\n\
  \    Cursor cursor = myCR.query(MyContentProvider.CONTENT_URI,\n            projection,\
  \ selection, null,\n            null);\n    Customer customer = new Customer();\n\
  \    if (cursor.moveToFirst()) {\n        cursor.moveToFirst();\n        customer.setID(Integer.parseInt(cursor.getString(0)));\n\
  \        customer.setCustomerName(cursor.getString(1));\n        customer.setCustomerPhone(cursor.getString(2));\n\
  \        cursor.close();\n    } else {\n        customer = null;\n    }\n    return\
  \ customer;\n}\n\npublic boolean deleteCustomer(String customername) {\n    boolean\
  \ result = false;\n    String selection = \"customername = \\\"\" + customername\
  \ + \"\\\"\";\n    int rowsDeleted = myCR.delete(MyContentProvider.CONTENT_URI,\n\
  \            selection, null);\n    if (rowsDeleted > 0)\n        result = true;\n\
  \    return result;\n}\n```\n\n当数据库处理类更新为使用内容解析者和内容提供者后，应用程序现在就可以进行测试了。编译并运行应用程序，然后执行添加、查找和删除客户条目的操作。在操作和功能方面，该应用程序的行为与直接访问数据库时完全相同，区别在于它现在使用了内容提供者。\n\
  \n正如我们在下一章中看到的，由于现在已经实现并在清单文件中声明了内容提供者，任何其他应用程序都可能访问该数据（由于没有声明任何权限，因此默认的完全访问是有效的）。其他应用程序获取访问权限所需的唯一信息是内容\
  \ URI 和 customers 表格中的列名。\n\n### 68.13 总结\n\n本章的目标是提供关于实现 Android 内容提供者的具体步骤的详细概述，特别关注内容提供者类中查询、插入、删除和更新方法的结构和实现。还涵盖了使用内容解析者类访问内容提供者中数据的实际用法，并对数据库项目进行了修改，以同时使用内容提供者和内容解析者。\n\
  \n## 69. Android 内容提供者客户端教程\n\n在这一专门介绍内容提供者的最后一个章节中，我们将构建一个应用程序，访问我们的 SQLDemo 内容提供者中包含的数据并显示客户联系人列表。\n\
  \n### 69.1 创建 SQLDemoClient 项目\n\n启动 Android Studio，从欢迎界面选择“新建项目”（New Project）选项，在弹出的新项目对话框中点击“下一步”（Next）按钮之前，选择\
  \ Empty Views Activity 模板。\n\n在 Name 字段输入 `SQLDemoClient`，并指定 `com.ebookfrenzy.sqldemoclient`\
  \ 为包名。在点击“完成”（Finish）按钮之前，将最低 API 级别设置更改为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为\
  \ Java。使用第 11.8 迁移项目到 View Binding 节中的步骤为项目启用视图绑定。\n\n### 69.2 设计用户界面\n\n打开 `activity_main.xml`\
  \ 文件并删除默认的 TextView。在布局中添加一个按钮和一个 TextView，将按钮文本更改为“Reload”（重新加载），并调整视图的位置，使布局类似于图\
  \ 69-1：\n\n![](img/as_sql_demo_client_ui.jpg)\n\n图 69-1\n\n使用“推断约束”（Infer constraints）按钮来配置布局约束，将\
  \ TextView 的 `textAppearance` 属性更改为 Display1，并将按钮的 `onClick` 属性设置为名为 `reload()`\
  \ 的方法。\n\n### 69.3 访问内容提供者\n\n访问内容提供者的代码将包含在 `reload()` 方法中。第一步是通过调用 `Resolver`\
  \ 实例的 `query()` 方法获取 `Cursor` 对象。在调用 `query()` 时，我们需要为由 `SQLDemo` 内容提供者管理的 customers\
  \ 表提供内容 URI，其读取如下：`content://com.ebookfrenzy.sqldemo.provider.MyContentProvider/customers`\n\
  \n一旦我们获得了 `Cursor` 对象的引用，就可以遍历数据库记录并使用我们的 `TextView` 组件显示数据。编辑 `MainActivity.java`\
  \ 文件并按所示添加 `reload()` 方法：\n\n```java\npackage com.ebookfrenzy.sqldemclient;\n\n\
  import android.database.Cursor;\nimport android.net.Uri;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n\n    public void reload(View view) {\n        Cursor\
  \ cursor = getContentResolver().query(\n            Uri.parse(\"content://com.ebookfrenzy.sqldemo.provider.MyContentProvider/customers\"\
  ),\n            null, null, null);\n        if (cursor != null) {\n            if\
  \ (cursor.moveToFirst()) {\n                StringBuilder stringBldr = new StringBuilder();\n\
  \                while (!cursor.isAfterLast()) {\n                    int nameindex\
  \ = cursor.getColumnIndex(\"customername\");\n                    int phoneindex\
  \ = cursor.getColumnIndex(\"customerphone\");\n                    if ((nameindex\
  \ != -1) && (phoneindex != -1)) {\n                        String string = cursor.getString(nameindex)\
  \ + \"\\n\" +\n                            cursor.getString(phoneindex);\n     \
  \                   stringBldr.append(string).append(\"\\n\\n\");\n            \
  \            binding.textView.setText(stringBldr.toString());\n                \
  \    }\n                    cursor.moveToNext();\n                }\n          \
  \  }\n            cursor.close();\n        }\n    }\n}\n```\n\n### 69.4 添加查询权限\n\
  \n在我们测试应用程序之前，最后的任务是请求查询权限。要请求权限，请编辑 manifests -> `AndroidManifest.xml` 文件并进行如下修改：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <queries>\n        <provider android:authorities=\"com.ebookfrenzy.sqldemo.provider.MyContentProvider\"\
  \ />\n    </queries>\n</manifest>\n```\n\n### 69.5 测试项目\n\n在我们测试 SQLDemo 程序的设备或模拟器上构建并运行应用程序，然后点击\
  \ Reload 按钮。应用程序应该查询数据库中的记录并将它们显示在 TextView 上：\n\n![](img/as_sql_demo_client_running.jpg)\n\
  \n图 69-2\n\n### 69.6 总结\n\n在本章中，我们创建了一个简单的应用程序，演示了从客户端访问内容提供者存储的数据。这涉及向内容解析者实例的\
  \ `query()` 方法传递内容 URI，并在项目清单文件中请求查询权限。`query()` 调用返回了一个我们用于遍历记录的 `Cursor` 对象。\n\
  \n## 70. Android Room 持久库\n\nRoom 持久库包含在 Android 架构组件中，旨在以符合 Android 架构指南的方式为 Android\
  \ 应用添加数据库存储支持。在前面的章节涵盖了 SQLite 数据库的基础知识后，本章将探索基于 Room 的数据库管理、在 Android 应用中实现 Room\
  \ 支持的关键元素，以及这些元素在架构和代码方面的实现。在涵盖这些主题后，接下来的两个章节将通过示例 Room 数据库项目将理论付诸实践。\n\n\n\n\n\n\
  ### 70.1 重新回顾现代应用架构\n\n标题为 \"使用 Jetpack 构建现代 Android 应用架构的章节介绍了现代应用架构的概念，并强调了分离应用内不同职责区域的重要性。图\
  \ 70-1 所示的图表概述了典型 Android 应用的推荐架构：\n\n![](img/room_diagram_1.jpg)\n\n图 70-1\n\n\
  在本书之前的章节中已经详细介绍了该架构的前三个层，现在是时候在 `Room` 持久化库的背景下探索仓库和数据库架构层了。\n\n# 70.2 Room 数据库持久化的关键元素\n\
  \n在章节后面的部分进行详细讨论之前，首先值得总结在使用 `Room` 持久化库处理 SQLite 数据库时涉及的关键元素：\n\n#### 70.2.1 仓库\
  \ (Repository)\n\n如前所述，仓库模块包含了直接处理应用使用的所有数据源所需代码。这避免了 UI 控制器和 `ViewModel` 包含直接访问数据库或网络服务的代码。\n\
  \n### 70.2.2 Room 数据库\n\n`room database` 对象提供了访问底层 SQLite 数据库的接口。它还为仓库提供了访问数据访问对象\
  \ (`DAO`) 的权限。一个应用应该只有一个 `room database` 实例，该实例可以用于访问多个数据库表。\n\n#### 70.2.3 数据访问对象\
  \ (DAO)\n\n`DAO` 包含了仓库在 SQLite 数据库中插入、检索和删除所需的 SQL 语句。这些 SQL 语句映射到方法，然后在仓库内部调用这些方法来执行相应的查询。\n\
  \n#### 70.2.4 实体 (Entities)\n\n实体是定义数据库中表结构的类，它定义了表名、列名和数据类型，并指定哪一列作为主键。除了声明表结构外，实体类还包含\
  \ getter 和 setter 方法，用于提供对这些数据字段的访问。DAO 响应 SQL 查询方法调用返回给仓库的数据将以这些实体类实例的形式存在。随后将调用\
  \ getter 方法从实体对象中提取数据。同样，当仓库需要向数据库写入新记录时，它会创建一个实体实例，通过 setter 调用配置对象上的值，然后调用 `DAO`\
  \ 中声明的插入方法，传递要保存的实体实例。\n\n### 70.2.5 SQLite 数据库\n\nSQLite 数据库负责存储和提供对数据的访问。应用代码（包括仓库）绝不应直接访问底层数据库。所有的数据库操作都是通过\
  \ `room database`、`DAOs` 和实体的组合完成的。\n\n图 70-2 架构图说明了这些不同元素如何交互以为 Android 应用提供基于\
  \ `Room` 的数据库存储：\n\n![](img/room_architecture_diagram.jpg)\n\n图 70-2\n\n上述架构图中编号的连接可以总结如下：\n\
  \n1. 仓库与 `Room Database` 交互以获取数据库实例，该实例反过来用于获取 `DAO` 实例的引用。\n2. 仓库创建实体实例并配置其数据，然后将其传递给\
  \ `DAO` 用于搜索和插入操作。\n3. 仓库调用 `DAO` 上的方法并传递要插入数据库的实体，并在响应搜索查询时接收实体实例。\n4. 当 `DAO`\
  \ 有结果要返回给仓库时，它将结果封装成实体对象。\n5. `DAO` 与 `Room Database` 交互以启动数据库操作并处理结果。\n6. `Room\
  \ Database` 处理与底层 SQLite 数据库的所有低级交互，提交查询并接收结果。\n\n在涵盖了使用 `Room` 持久化库访问数据库的关键元素的基本概述后，是时候详细探索实体、`DAOs`、`room\
  \ databases` 和仓库了。\n\n### 70.3 理解实体\n\n每个数据库表都将关联一个实体类。该类定义了表的结构，表现形式为标准的 Java 类，并穿插着一些特殊的\
  \ Room 注解。一个声明要在数据库表中存储数据的 Java 类示例可能如下：\n\n```java\npublic class Customer {\n\n\
  \    private int id;\n    private String name;\n    private string address;\n\n\
  \    public Customer(String name, String address) {\n        this.id = id;\n   \
  \     this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public int getAddress() {\n        return\
  \ this.address;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n\
  \    }\n\n    public void setName(String name) {\n        this.name = name;\n  \
  \  }\n\n    public void setAddress(int address) {\n        this.address = address;\n\
  \    }\n}\n```\n\n按照目前的实现，上述代码声明了一个包含若干字段以及 getter 和 setter 方法的 Java Java 类。然而，该类还不是实体。要使该类成为实体并使其在\
  \ SQL 语句中访问，需要按照所示添加一些 Room 注解：\n\n```java\n@Entity(tableName = \"customers\")\n\
  public class Customer {\n\n    @PrimaryKey(autoGenerate = true)\n    @NonNull\n\
  \    @ColumnInfo(name = \"customerId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"customerName\")\n    private String name;\n\n    private String address;\n\
  \n    public Customer(String name, String address) {\n        this.id = id;\n  \
  \      this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public int getAddress() {\n        return\
  \ this.address;\n    }\n\n    public void setId(@NonNull int id) {\n        this.id\
  \ = id;\n    }\n\n    public void setName(String name) {\n        this.name = name;\n\
  \    }\n\n    public void setAddress(int address) {\n        this.address = address;\n\
  \    }\n}\n```\n\n上述注解首先声明该类表示一个实体，并分配了一个名为 `customers` 的表名。这是在 `DAO` SQL 语句中引用表的名称。每个数据库表都需要一个列作为主键。在这种情况下，客户的\
  \ `id` 被声明为主键。此外还添加了注解以分配在 SQL 查询中引用的列名，并指示该字段无法存储空值。最后，`id` 值被配置为自动生成。这意味着系统会自动为新记录生成\
  \ `id` 以以避免键冲突。如果实体中的某个字段不需要存储在数据库中，使用 `@Ignore` 注解：\n\n```java\n@Ignore\nprivate\
  \ String myString;\n```\n\n\n\n\n注解也可以包含在实体类中，以便使用称为“外键”（foreign keys）的关系型数据库概念与其他实体建立关系。外键允许一个表引用另一个表中的主键。例如，可以在名为\
  \ `Purchase` 的实体与我们现有的 `Customer` 实体之间建立如下关系：\n\n```java\n@Entity(foreignKeys =\
  \ {@ForeignKey(entity = Customer.class,\n        parentColumns = \"customerId\"\
  ,\n        childColumns = \"buyerId\",\n        onDelete = ForeignKey.CASCADE,\n\
  \        onUpdate = ForeignKey.RESTRICT})\npublic class Purchase {\n\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"purchaseId\")\n    private int purchaseId;\n\
  \n    @ColumnInfo(name = \"buyerId\")\n    private int buyerId;\n}\n```\n\n注意外键（`foreign\
  \ key`）声明还指定了当父记录被删除或更新时要执行的操作。可用选项有 `CASCADE`、`NO_ACTION`、`RESTRICT`、`SET_DEFAULT`\
  \ 和 `SET_NULL`。\n\n### 70.4 数据访问对象 (Data Access Objects)\n\n数据访问对象允许访问存储在 SQLite\
  \ 数据库中的数据。`DAO` 被声明为标准的 Java 接口，并带有额外的注解，将特定的 SQL 语句映射到存储库（repository）随后可以调用的方法。\n\
  \n第一步是创建接口并使用 `@Dao` 注解将其声明为 `DAO`：\n\n```java\n@Dao\npublic interface CustomerDao\
  \ {\n}\n```\n\n接下来，添加包含 SQL 语句和对应方法名的条目。例如，下面的声明允许通过名为 `getAllCustomers()` 的方法检索\
  \ `customers` 表中的所有行：\n\n```java\n@Dao\npublic interface CustomerDao {\n    @Query(\"\
  SELECT * FROM customers\")\n    LiveData<List<Customer>> getAllCustomers();\n}\n\
  ```\n\n`getAllCustomers()` 方法返回一个 `List` 对象，其中包含从数据库表中检索出的每条记录的 `Customer` 实体对象。`DAO`\
  \ 还使用了 `LiveData`，以便存储库可以观察数据库的变化。\n\n参数也可以传递给方法，并在相应的 SQL 语句中引用。考虑以下 `DAO` 声明，它搜索与客户名称匹配的数据库记录（注意\
  \ `WHERE` 条件中引用的列名是分配给实体类中列的名称）：\n\n```java\n@Query(\"SELECT * FROM customers WHERE\
  \ name = :customerName\")\nList<Customer> findCustomer(String customerName);\n```\n\
  \n在此示例中，方法传递了一个字符串值，该值通过在变量名前前加上冒号（`:`）包含在 SQL 语句中。\n\n可以使用 `@Insert` 方便注解声明一个基础的插入操作：\n\
  \n```java\n@Insert\nvoid addCustomer(Customer customer);\n```\n\n这被称为方便注解，因为 Room\
  \ 持久化库可以推导出传递给 `addCustomer()` 方法的 `Customer` 实体将要插入数据库，而无需提供 SQL `insert` 语句。也可以在单个事务中插入多条数据库记录，如下：\n\
  \n```java\n@Insert\npublic void insertCustomers(Customer... customers);\n```\n\n\
  下面的 `DAO` 声明删除了所有匹配提供的客户名称的记录：\n\n```java\n@Query(\"DELETE FROM customers WHERE\
  \ name = :name\")\nvoid deleteCustomer(String name);\n```\n\n作为使用 `@Query` 注解执行删除的替代方案，也可以使用\
  \ `@Delete` 方便注解。在以下示例中，所有与传递给 `deleteCustomers()` 方法的实体集匹配的 `Customer` 记录都将从数据库中删除：\n\
  \n```java\n@Delete\npublic void deleteCustomers(Customer... customers);\n```\n\n\
  `@Update` 方便注解在更新记录时提供类似的行为：\n\n```java\n@Update\npublic void updateCustomers(Customer...\
  \ customers);\n```\n\n这些类型数据库操作的 `DAO` 方法也可以声明为返回一个 `int` 值，表示受事务影响的行数，例如：\n\n```java\n\
  @Delete\npublic int deleteCustomers(Customer... customers);\n```\n\n# 70.5 Room\
  \ 数据库\n\n`RoomDatabase` 类通过扩展 `RoomDatabase` 类创建，并作为嵌入 Android 操作系统的实际 SQLite 数据库之上的层。该类负责创建并返回新的\
  \ Room 数据库实例，并提供对数据库相关 `DAO` 实例的访问。\n\nRoom 持久库提供了一个创建数据库实例的构建器。每个 Android 应用应该只有一个\
  \ `room database` 实例，因此最好在类内部实现防御性代码，以防止创建多个实例。\n\n下面的代码列表列出了用于与示例客户表的 `Room Database`\
  \ 实现示例：\n\n```java\nimport android.content.Context;\nimport android.arch.persistence.room.Database;\n\
  import android.arch.persistence.room.Room;\nimport android.arch.persistence.room.RoomDatabase;\n\
  \n@Database(entities = {Customer.class}, version = 1)\npublic class CustomerRoomDatabase\
  \ extends RoomDatabase {\n    public abstract CustomerDao customerDao();\n\n   \
  \ private static CustomerRoomDatabase INSTANCE;\n\n    static CustomerRoomDatabase\
  \ getDatabase(final Context context) {\n        if (INSTANCE == null) {\n      \
  \      synchronized (CustomerRoomDatabase.class) {\n                if (INSTANCE\
  \ == null) {\n                    INSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                            CustomerRoomDatabase.class, \"customer_database\")\n\
  \                            .build();\n                }\n            }\n     \
  \   }\n        return INSTANCE;\n    }\n}\n```\n\n上述示例中需要注意的重要区域是类上方声明数据库工作实体的注解、检查实例是否已创建的代码，以及为实例分配名称\
  \ `customer_database`。\n\n### 70.6 存储库 (Repository)\n\n存储库负责获取 Room 数据库实例，使用该实例访问\
  \ `DAOs`，然后调用 DAO 方法执行数据库操作。设计用于 Room 数据库的存储库典型构造函数可能如下：\n\n```java\npublic class\
  \ CustomerRepository {\n    private CustomerDao customerDao;\n    private CustomerRoomDatabase\
  \ db;\n\n    public CustomerRepository(Application application) {\n        db =\
  \ CustomerRoomDatabase.getDatabase(application);\n        customerDao = db.customerDao();\n\
  \    }\n}\n```\n\n一旦存储库可以访问 DAO，它就可以调用数据访问方法。例如，下面的代码调用了 `getAllCustomers()` DAO\
  \ 方法：\n\n```java\nprivate LiveData<List<Customer>> allCustomers;\nallCustomers =\
  \ customerDao.getAllCustomers();\n```\n\n在调用 DAO 方法时，重要的一是，除非方法返回 `LiveData` 实例（它会自动在单独线程上运行查询），否则无法在应用的主线程上执行操作。尝试这样做会导致应用崩溃并输出以下诊断信息：\n\
  \n`Cannot access database on the main thread since it may potentially lock the UI\
  \ for a long period of time`\n\n由于某些数据库事务可能需要较长时间才能完成，在单独线程上运行操作可以避免应用出现假死。\n\n\
  ### 70.7 内存数据库\n\n本章概述的示例使用存在于 Android 设备持久化存储中的数据库文件的 SQLite 数据库。这确保了即使在应用进程终止后，数据仍然存在。\n\
  \n\n\n\nRoom 数据库持久库也支持内存数据库。这些数据库完全存储在内存中，并在应用终止时丢失。与内存数据库配合工作，唯一需要的更改是调用 `Room\
  \ Database` 类中的 `Room.inMemoryDatabaseBuilder()` 方法，而不是 `Room.databaseBuilder()`。下面的代码显示了这些方法调用之间的区别（注意内存数据库不需要数据库名称）：\n\
  \n```java\n// 创建基于文件存储的数据库\nINSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                               CustomerRoomDatabase.class, \"customer_database\"\
  )\n                               .build();\n\n// 创建一个内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n\
  \                                         CustomerRoomDatabase.class)\n        \
  \                                 .build();\n```\n\n### 70.8 数据库检查器 (Database Inspector)\n\
  \nAndroid Studio 包含一个数据库检查器工具窗口，它允许查看、搜索和修改与运行应用相关的 Room 数据库，如图 70-3 所示：\n\n![](img/as_database_inspector_window.jpg)\n\
  \n图 70-3\n\n数据库检查器将在章节 “Android Room 数据库和仓库教程” 中进行介绍。\n\n### 70.9 总结\n\nAndroid\
  \ Room 持久库与 Android 架构组件一起发布，作为低级 SQLite 数据库之上的抽象层。该库的设计旨在更容易与数据库交互，同时符合 Android\
  \ 架构指南。本章介绍了构建基于 Room 的数据库存储到 Android 应用项目中的交互元素，包括实体、仓库、数据访问对象（DAO）、注解和 Room 数据库实例。\n\
  \n在在涵盖了 SQLite 基础和 Room 架构组件之后，下一步是创建一个将这些理论付诸的示例应用。由于示例应用程序的用户界面需要基于表单的布局，下一章题为\
  \ “Android TableLayout 和 TableRow 教程”，它将稍微偏离核心主题，介绍 `TableLayout` 和 `TableRow` 视图的基础知识。\n\
  \n## 71. Android TableLayout 和 TableRow 教程\n\n当开始编写本书下一章节（“Android Room 数据库和仓库教程”）的工作时，最初打算包含为\
  \ Room 数据库示例应用设计用户界面布局的步骤。然而，很快就会发现实现用户界最佳方法是使用 Android `TableLayout` 和 `TableRow`\
  \ 视图，而且这个主题值得作为一个独立的章节。因此，本章将专门专注于下一章将完成的数据库应用程序的用户界面设计，并在此花一些时间介绍 Android Studio\
  \ 中表格布局的基本概念。\n\n### 71.1 TableLayout 和 TableRow 布局视图\n\n`TableLayout` 容器视图允许以由行和列组成的表格格式在屏幕上组织用户界面元素。`TableLayout`\
  \ 中的每一行都由一个 `TableRow` 实例占据，而 `TableRow` 又被分为多个单元格，每个单元格包含单个子视图（该视图可能是一个包含多个子视图的容器）。\n\
  \n表格中的列数由列数最多的行决定，默认情况下，每列的宽度由该列中最宽的单元格定义。列可以被配置为可收缩或可扩展（或两者兼具），使其相对于父级 `TableLayout`\
  \ 改变大小。此外，单个单元格可以配置为跨越多个列。\n\n考虑图 71-1 所示的用户界面布局：\n\n![](img/as_tablelayout_ui.jpg)\n\
  \n图 71-1\n\n从布局的视觉外观来看，很难识别出用于设计界面的 `TableLayout` 结构。然而，图 71-2 所示的层级树使得结构稍微更容易理解：\n\
  \n![](img/as3.2_tablelayout_tree.jpg)\n\n图 71-2\n\n该布局包含一个父级 `LinearLayout` 视图，带有\
  \ `TableLayout`、`LinearLayout` 和 `RecyclerView` 子视图。`TableLayout` 包含三个 `TableRow`\
  \ 子视图，代表表格中的三行。`TableRows` 包含两个子视图，每个代表一个表格列单元格的内容。`LinearLayout` 子视图包含三个 `Button`\
  \ 子视图。\n\n图 71-2 所示的布局是下一章将完成的数据库示例确切所需的布局。因此，本章的剩余部分将用于使用 Android Studio 布局编辑器工具逐步完成此用户界面的的设计。\n\
  \n### 71.2 创建 Room 数据库项目\n\n从欢迎界面选择“New Project”菜单选项，并在弹出的新项目对话框中，点击“Next”按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在 `Name` 字段中输入 `RoomDemo`，并指定 `com.ebookfrenzy.roomdemo`\
  \ 为包名。在点击“Finish”按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单改为 `Java`。\n\n按照章节 11.8 将项目迁移到 View Binding 中列出的步骤将项目迁移到 view binding。\n\
  \n### 71.3 转换为 LinearLayout\n\n在 Project 窗口中（app -> layout）找到 `activity_main.xml`\
  \ 文件，并双击将其加载到布局编辑器中。默认情况下，Android Studio 使用 `ConstraintLayout` 作为布局元素。这需要将其转换为垂直的\
  \ `LinearLayout`。\n\n在布局编辑器的 Design 模式下，在 Component Tree 面中找到 `ConstraintLayout`\
  \ 组件，右键点击它以显示图 71-3 所示的菜单，并选择 `Convert view...` 选项：\n\n![](img/as_convert_view_menu.jpg)\n\
  \n图 71-3\n\n在图 71-4 的对话框中，点击“Apply”按钮之前选择转换为 `LinearLayout`：\n\n![](img/as_convert_view_dialog.jpg)\n\
  \n图 71-4\n\n默认情况下，布局编辑器会将 `ConstraintLayout` 转换为水平的 `LinearLayout`，因此在 Component\
  \ Tree 窗口中选择布局组件，参考 Attributes 工具窗口，并将 `orientation` 属性更改为 `vertical`\n\n![](img/as_linear_orientation.jpg)\n\
  \n图 71-5\n\n转换完成后，从布局删除默认 TextView。\n\n### 71.4 向用户界面添加 TableLayout\n\n留在 `activity_main.xml`\
  \ 文件中并参考面板中的 `Layouts` 分类，拖入 `TableLayout` 视图将其置于 `LinearLayout` 画布区域顶部。\n\n完成这些初始步骤后，布局的\
  \ Component Tree 应该类似于图 71-6 所示：\n\n![](img/as_table_layout.jpg)\n\n图 71-6\n\nAndroid\
  \ Studio 自动为 `TableLayout` 添加了四个 `TableRow` 实例。由于此示例只需要三行，选择并删除第四个 `TableRow` 实例。可以随时通过从面板拖入\
  \ `TableRow` 对象并到 Component Tree 工具窗口中的 `TableLayout` 项上向 `TableLayout` 添加额外的行。\n\
  \n选中 `TableLayout` 后，使用 Attributes 工具窗口将 `layout_height` 属性更改为 `wrap_content`并将\
  \ `layout_width` 更改为 `match_parent`。\n\n## 71.5 配置 TableRows\n\n\n\n\n从调板的 Text\
  \ 区域，将两个 `TextView` 对象拖到组件树（Component Tree）中最顶部的 `TableRow` 条目上（图 71-7）：\n\n![](img/as_table_layout_first_row.jpg)\n\
  \n图 71-7\n\n在屏幕布局中选择左侧的 `TextView`，并在属性（Attributes）窗口中将 `text` 属性更改为“Product ID”。对右侧的\
  \ `TextView` 重复此步骤，将 `text` 改为“Not assigned”并指定 ID 值 `productID`。\n\n将另一个 `TextView`\
  \ 小部件拖到组件树中的第二个 `TableRow` 条目上，并将视图上的 `text` 改为“Product Name”。在调板中找到 `Plain Text`\
  \ 对象，并将其拖放到如图 71-8 所示，位于组件树中 Product Name `TextView` 的下方。接下来，从 `text` 属性中删除“Name”字符串，并将\
  \ `ID` 设置为 `productName`。\n\n![](img/as_table_layout_second_row.jpg)\n\n图 71-8\n\
  \n将另一个 `TextView` 和一个 `Number (Decimal) Text Field` 拖到第三个 `TableRow` 上，使 `TextView`\
  \ 在层级中位于 `EditText`。将 `TextView` 的 `text` 改为“Product Quantity”，并将 `EditText` 对象的\
  \ `ID` 改为 `productQuantity`。\n\n按住 Shift 点击选择布局中的所有小部件，如下方的图 71-9 所示，并使用属性窗口将所有对象的\
  \ `textSize` 属性设置为 18sp：\n\n![](img/as_4.1_room_demo_views_selected.jpg)\n\n图 71-9\n\
  \n## 71.6 向布局中添加按钮栏\n\n下一步是在父级 `LinearLayout` 视图中添加一个 `LinearLayout (Horizontal)`\
  \ 视图，位置紧邻 `TableLayout` 视图下方。首先点击组件树中 `TableLayout` 条目左侧的小展开箭头，使 `TableRows` 折叠隐藏。从布局编辑器调板的\
  \ Layouts 部分拖入一个 `LinearLayout (horizontal)` 实例，将其释放到组件树面板中 `TableLayout` 条目的下方，并将\
  \ `layout_height` 属性更改为 `wrap_content`：\n\n![](img/as_table_layout_linear_added.jpg)\n\
  \n图 71-10\n\n将三个 `Button` 对象拖到新的 `LinearLayout` 中，并为每个按钮分配“Add”、“Find”和“Delete”的字符串资源。此类按钮栏布局中的按钮通常应以无边界样式显示。使用每个按钮的属性窗口将样式设置设置为\
  \ `Widget.AppCompat.Button.Borderless`，并将 `textColor` 属性设置为 `?attr/colorPrimary`。将按钮的\
  \ `IDs` 分别更改为 `addButton`、`findButton` 和 `deleteButton`。\n\n![](img/as_borderless_button_menu.jpg)\n\
  \n图 71-11\n\n在组件树中选中新的水平 `LinearLayout` 视图，将 `gravity` 属性更改为 `center_horizontal`，以便按钮在显示区域水平居中。在继续之前，将上述步骤添加的所有\
  \ `text` 属性提取到字符串资源中。\n\n## 71.7 添加 RecyclerView\n\n在组件树中，点击新添加的水平 `LinearLayout`\
  \ 条目左侧的展开箭头以折叠所有子项。\n\n从调板的 Containers 部分将一个 `RecyclerView` 实例拖到组件树中，将其置于按钮栏 `LinearLayout`\
  \ 下方，如图 71-12 所示。确保 `RecyclerView` 是父级垂直 `LinearLayout` 视图的直接子级，而不是水平按钮栏 `LinearLayout`\
  \ 的子级。\n\n![](img/as_table_layout_recycler_added.jpg)\n\n图 71-12\n\n在布局中选中 `RecyclerView`，将视图的\
  \ `ID` 更改 `product_recycler`并将 `layout_height` 属性设置为 `match_parent`。在继续之前，检查组件树面板中的布局层级结构是否与下图所示：\n\
  \n![](img/as_table_completed_tree.jpg)\n\n图 71-13\n\n## 71.8 调整布局边距\n\n最后只需调整一些布局设置。首先点击组件树面板中的第一个\
  \ `TableRow` 条目使其被选中。按住键盘上的 `Cmd/Ctrl` 键点击第二个和第三个 `TableRows`、水平 `LinearLayout`\
  \ 以及 `RecyclerView`，使所有五个项目被选中。在属性面板中，找到 `layout_margin` 属性类别，找到后将 `value` 更改为 10dp，如图\
  \ 71-14 所示：\n\n![](img/as_table_layout_margin.jpg)\n\n图 71-14\n\n设置好边距后，用户界面应该如图\
  \ 71-1 所示所示。\n\n### 71.9 总结\n\nAndroid `TableLayout` 容器视图提供了一种以行和列配置排列视图组件的方法。虽然\
  \ `TableLayout` 视图提供了整体容器，但每一行及其包含的单元格是通过 `TableRow` 视图的实例实现的。在本章中，在 Android Studio\
  \ 中使用 `TableLayout` 和 `TableRow` 容器设计了一个用户界面。下一章将为此用户界面添加功能，使用仓库和 Room 持久化库实现 SQLite\
  \ 数据库功能。\n\n## 72. Android Room 数据库和仓库教程\n\n本章将结合“The Android Room Persistence Library”中获得的知识与上一章创建的项目，提供详细教程，演示如何使用\
  \ Room 持久化库实现基于 SQLite 的存储。遵循 Android 架构指南，项目将使用视图模型（ViewModel）和仓库（Repository）。教程将使用“The\
  \ Android Room Persistence Library”中涵盖的所有元素，包括实体（Entity）、数据访问对象（DAO）、Room Database\
  \ 以及异步数据库查询。\n\n### 72.1 关于 Demo 项目\n\n上一章创建的用户界面布局是创建一个存储产品名称和数量的简单库存应用的第一步。完成后，该应用将提供添加、删除和搜索数据库条目的功能，同时显示存储在数据库中的所有产品的可滚动列表。随着数据库条目的添加或删除，此列表会自动更新。\n\
  \n### 72.2 修改构建配置\n\n启动 Android Studio 并打开上一章开始的项目 项目。在项目中添加任何新类之前，第一步是在构建配置中添加一些额外的库和插件，包括\
  \ Room 持久化库。第一步是在 Gradle 构建配置中添加 `ksp` 插件和额外库。使用项目窗口，找到并编辑 `Gradle Scripts -> libs.versions.toml`\
  \ 文件如下（请记住现在可能有更新版本的库）：\n\n```toml\n[versions]\nroomRuntime = \"2.6.1\"\nfragment\
  \ = \"1.6.2\"\n\n[libraries]\nandroidx-room-compiler = { module = \"androidx.room:room-compiler\"\
  , version.ref = \"roomRuntime\" }\nandroidx-room-runtime = { group = \"androidx.room\"\
  , name = \"room-runtime\", version.ref = \"roomRuntime\" }\nandroidx-fragment =\
  \ { group = \"androidx.fragment\", name = \"fragment\", version.ref = \"fragment\"\
  \ }\n```\n\n接下来，对模块级 `build.gradle.kts` 文件进行以下更改（app -> Gradle Scripts -> build.gradle.kts\
  \ (Module :app)）：\n\n```kotlin\ndependencies {\n    implementation(libs.androidx.room.runtime)\n\
  \    implementation(libs.androidx.fragment)\n    annotationProcessor(libs.androidx.room.compiler)\n\
  }\n```\n\n点击 Sync Now 链接提交更改。\n\n\n\n\n\n此项目将从创建一个定义数据库表模式的实体开始。该实体将包含一个用于产品 ID\
  \ 的整数、一个用于存储产品名称的字符串列，以及另一个存储数量的整数值。\n\n`productid` 列将作为主键并自动生成。表 72-1 汇总了该实体的结构：\n\
  \n| 列 | 数据类型 |\n| :--- | :--- |\n| productid | 整数 / 主键 / 自动递增 |\n| productname |\
  \ 字符串 |\n| productquantity | 整数 |\n\n表 72-1\n\n在 Project 工具窗口中，右键点击 `app` -> `java`\
  \ -> `com.ebookfrenzy.roomdemo` 项，并选择 `New` -> `Java Class` 菜单选项，为该实体添加一个类文件。在新建类对话框中，将类命名为\
  \ `Product`，在列表中选择 `Class` 项，并按键盘回车键生成文件。\n\n当 `Product.java` 文件在编辑器中打开时，对其进行修改使其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\npublic class Product {\n    private\
  \ int id;\n    private String name;\n    private int quantity;\n\n    public Product(String\
  \ name, int quantity) {\n        this.name = name;\n        this.quantity = quantity;\n\
  \    }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public int getQuantity()\
  \ {\n        return this.quantity;\n    }\n\n    public void setId(int id) {\n \
  \       this.id = id;\n    }\n\n    public void setName(String name) {\n       \
  \ this.name = name;\n    }\n\n    public void setQuantity(int quantity) {\n    \
  \    this.quantity = quantity;\n    }\n}\n```\n\n该类现在有了对应数据库表列的变量以及相应的 getter 和\
  \ setter 方法。当然，在类被注解之前，它还没有成为实体。在编辑器中保持类文件打开的情况下，添加注解和相应的导入语句：\n\n```java\npackage\
  \ com.ebookfrenzy.roomdemo;\n\nimport androidx.room.ColumnInfo;\nimport androidx.room.Entity;\n\
  import androidx.room.PrimaryKey;\n\n@Entity(tableName = \"products\")\npublic class\
  \ Product {\n    @PrimaryKey(autoGenerate = true)\n    @ColumnInfo(name = \"productId\"\
  )\n    private int id;\n    @ColumnInfo(name = \"productName\")\n    private String\
  \ name;\n    private int quantity;\n}\n```\n\n这些注解声明该实体为名为 `products` 的表的实体，并为 `id`\
  \ 和 `name` 变量分配了列名。`id` 列也被配置为主键并自动生成。由于在 SQL 查询中不需要引用 `quantity` 列，因此没有为 `quantity`\
  \ 变量分配列名。\n\n## 72.4 创建数据访问对象 (DAO)\n\n定义好产品实体后，下一步是创建 DAO 接口。再次参考 Project 工具窗口，右键点击\
  \ `app` -> `java` -> `com.ebookfrenzy.roomdemo` 项并选择 `New` -> `Java Class` 菜单选项。在新建类对话框中，在\
  \ Name 字段中输入 `ProductDao`，并在列表中选择 `Interface`，如图 72-1 所示：\n\n![](img/as_room_demo_java_interface.jpg)\n\
  \n图 72-1\n\n按下回车键生成新接口，并在 `ProductDao.java` 文件加载到代码编辑器后，进行以下更改：\n\n```java\npackage\
  \ com.ebookfrenzy.roomdemo;\n\nimport androidx.lifecycle.LiveData;\nimport androidx.room.Dao;\n\
  import androidx.room.Insert;\nimport androidx.room.Query;\nimport java.util.List;\n\
  \n@Dao\npublic interface ProductDao {\n    @Insert\n    void insertProduct(Product\
  \ product);\n\n    @Query(\"SELECT * FROM products WHERE productName = :name\")\n\
  \    List<Product> findProduct(String name);\n\n    @Query(\"DELETE FROM products\
  \ WHERE productName = :name\")\n    void deleteProduct(String name);\n\n    @Query(\"\
  SELECT * FROM products\")\n    LiveData<List<Product>> getAllProducts();\n}\n```\n\
  \n DAO 实现了从 products 数据库中插入、查找和删除记录的方法。插入方法传递一个包含要存储数据的 `Product` 实体对象，而查找和删除记录的方法则传递一个包含要操作产品名称的字符串。`getAllProducts()`\
  \ 方法返回包含数据库中所有记录的 `LiveData` 对象。此方法将用于保持界面布局中的 `RecyclerView` 产品列表与数据库同步。\n\n##\
  \ 72.5 添加 Room 数据库\n\n在将仓库添加到项目之前，最后一个任务是实现 Room 数据库实例。向项目添加一个名为 `ProductRoomDatabase`\
  \ 的新类，这次选择 `Class` 选项。\n\n文件生成后，按照“The Android Room Persistence Library”章节中概述的步骤对其进行修改：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport android.content.Context;\n\
  import androidx.room.Database;\nimport androidx.room.Room;\nimport androidx.room.RoomDatabase;\n\
  \n@Database(entities = {Product.class}, version = 1)\npublic abstract class ProductRoomDatabase\
  \ extends RoomDatabase {\n    public abstract ProductDao dao();\n    private static\
  \ ProductRoomDatabase INSTANCE;\n\n    static ProductRoomDatabase getDatabase(Context\
  \ context) {\n        if (INSTANCE == null) {\n            synchronized (ProductRoomDatabase.class)\
  \ {\n                if (INSTANCE == null) {\n                    INSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                            ProductRoomDatabase.class, \"product_database\").build();\n\
  \                }\n            }\n        }\n        return INSTANCE;\n    }\n\
  }\n```\n\n### 72.6 添加仓库\n\n向项目添加一个名为 `ProductRepository` 的新类，选择 `Class` 选项。\n\n\
  仓库类将代表 ViewModel 与 Room 数据库交互。它必须提供插入、删除和查询记录的方法。除了 `getAllProducts()` 方法返回 `LiveData`\
  \ 对象外，这些数据库操作必须在主线程之外执行。\n\n在 `ProductRepository.java` 文件中，添加用于将搜索结果返回线程的 handler：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport android.os.Handler;\nimport\
  \ android.os.Looper;\nimport android.os.Message;\nimport java.util.concurrent.ExecutorService;\n\
  import java.util.concurrent.Executors;\nimport androidx.lifecycle.MutableLiveData;\n\
  import java.util.List;\n\npublic class ProductRepository {\n    private final MutableLiveData<List<Product>>\
  \ searchResults = new MutableLiveData<>();\n    private List<Product> results;\n\
  \n    Handler handler = new Handler(Looper.getMainLooper()) {\n        @Override\n\
  \        public void handleMessage(Message msg) {\n            searchResults.setValue(results);\n\
  \        }\n    };\n}\n```\n\n上述代码声明了一个名为 `searchResults` 的 `MutableLiveData` 变量，当异步搜索任务完成后，会将搜索结果存储其中（之后，ViewModel\
  \ 中的观察者将监控此活动数据对象）。\n\n仓库类现在必须提供 ViewModel 可以调用以启动这些操作的方法。然而，仓库需要通过 `ProductRoomDatabase`\
  \ 实例获取 DAO 。为 `ProductRepository` 类添加一个构造方法来执行这些任务：\n\n```java\nimport android.app.Application;\n\
  \npublic class ProductRepository {\n    private final MutableLiveData<List<Product>>\
  \ searchResults = new MutableLiveData<>();\n    private List<Product> results;\n\
  \    private final ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.dao();\n    }\n}\n```\n\n\n\n\n在引用已存储的 `DAO` 的情况下，可以将以下方法添加到\
  \ `ProductRepository` 类文件中：\n\n```java\npublic void insertProduct(Product newproduct)\
  \ {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n    executor.submit(()\
  \ -> productDao.insertProduct(newproduct));\n    executor.shutdown();\n}\n\npublic\
  \ void deleteProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> productDao.deleteProduct(name));\n    executor.shutdown();\n\
  }\n\npublic void findProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> {\n        results = productDao.findProduct(name);\n\
  \        handler.sendEmptyMessage(0);\n    });\n    executor.shutdown();\n}\n```\n\
  \n在插入和删除方法中，创建创建并使用了适当的新线程来执行相应的数据库操作。在 `findProduct()` 方法中，会向 `handler` 发送消息，指示有新结果可用。\n\
  \n完成存储库类还剩最后一项任务。用户界面布局中的 `RecyclerView` 必须与数据库中存储的当前产品列表同步。`ProductDao` 类已经包含一个名为\
  \ `getAllProducts()` 的方法，该方法使用 SQL 查询选择所有数据库记录并将其封装在 `LiveData` 对象中返回。存储库需要在初始化时调用一次此方法，并将结果存储在\
  \ `LiveData` 对象中，该对象可以被 `ViewModel` 观察，并进而被 UI 控制器观察。一旦设置完成，每当数据库表发生变化时，UI 控制器观察者都会收到通知，`RecyclerView`\
  \ 就可以用最新的产品列表进行更新。在 `ProductRepository.java` 文件添加一个 `LiveData` 变量并在构造函数中调用 DAO 的\
  \ `getAllProducts()` 方法：\n\n```java\nimport androidx.lifecycle.LiveData;\n\npublic\
  \ class ProductRepository {\n    private final MutableLiveData<List<Product>> searchResults\
  \ =\n            new MutableLiveData<>();\n    private List<Product> results;\n\
  \    private final LiveData<List<Product>> allProducts;\n    private final ProductDao\
  \ productDao;\n\n    public ProductRepository(Application application) {\n     \
  \   ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n        allProducts = productDao.getAllProducts();\n\
  \    }\n}\n```\n\n为了完成存储库，添加 `ViewModel` 可以调用的方法以获取 `allProducts` 和 `searchResults`\
  \ 活数据对象的引用：\n\n```java\npublic LiveData<List<Product>> getAllProducts() {\n    return\
  \ allProducts;\n}\n\npublic MutableLiveData<List<Product>> getSearchResults() {\n\
  \    return searchResults;\n}\n```\n\n## 72.7 添加 ViewModel\n\n`ViewModel` 负责创建存储库实例并提供方法以及\
  \ `LiveData` 对象，UI 控制器利用这些对象来保持用户界面与底层数据库同步。正如在 `ProductRepository.java` 中实现的那，存储库构造函数需要访问应用程序上下文以获取\
  \ Room 数据库实例。为了在 `ViewModel` 内部访问应用程序上下文以便将其传递给存储库，`ViewModel` 需要继承 `AndroidViewModel`\
  \ 而不是 `ViewModel`。\n\n首先，在 Project 工具窗口中找到 `com.ebookfrenzy.viewmodeldemo` 条目，右键点击它并选择\
  \ New -> Java Class 菜单选项。接下来，将新类命名为 `MainViewModel` 并按下键盘回车键。最后，编辑新类文件，将类改为扩展 `AndroidViewModel`\
  \ 并实现默认构造函数：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\nimport android.app.Application;\n\
  import androidx.lifecycle.AndroidViewModel;\nimport androidx.lifecycle.LiveData;\n\
  import androidx.lifecycle.MutableLiveData;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import com.ebookfrenzy.roomdemo.ProductRepository;\nimport java.util.List;\n\npublic\
  \ class MainViewModel extends AndroidViewModel {\n    final private ProductRepository\
  \ repository;\n    final private LiveData<List<Product>> allProducts;\n    final\
  \ private MutableLiveData<List<Product>> searchResults;\n\n    public MainViewModel\
  \ (Application application) {\n        super(application);\n        repository =\
  \ new ProductRepository(application);\n        allProducts = repository.getAllProducts();\n\
  \        searchResults = repository.getSearchResults();\n    }\n}\n```\n\n构造函数创建一个存储库实例，然后使用它获取\
  \ `allProducts` 和 `searchResults` 对象的引用，以便 UI 控制器观察它们。在 `ViewModel` 中剩下的只需实现 UI\
  \ 控制器在响应设置 `LiveData` 对象时调用的方法：\n\n```java\nMutableLiveData<List<Product>> getSearchResults()\
  \ {\n    return searchResults;\n}\n\nLiveData<List<Product>> getAllProducts() {\n\
  \    return allProducts;\n}\n\npublic void insertProduct(Product product) {\n  \
  \  repository.insertProduct(product);\n}\n\npublic void findProduct(String name)\
  \ {\n    repository.findProduct(name);\n}\n\npublic void deleteProduct(String name)\
  \ {\n    repository.deleteProduct(name);\n}\n```\n\n## 72.8 创建产品布局\n\n数据库中每个产品的名称将出现在主界面的\
  \ `RecyclerView` 列表中。这需要一个包含每行 `TextView` 的布局文件。现在通过在 Project 窗口中右点击 app -> res\
  \ -> layout 条目并选择 New -> Layout File 选项来添加此文件。将文件命名为 `product_item` 并将根元素改为 `LinearLayout`。在点击\
  \ OK 创建文件之前，将其加载到布局编辑器中。在 Design 模式的布局编辑器中，将一个 `TextView` 对象拖到布局上，它将默认出现在顶部。\n\n\
  在布局中选中 `TextView`，使用 Attributes 窗口将视图的 ID 设置为 `product_row`并将 `layout_height` 设置为\
  \ `30dp`。在 Component Tree 中选择 `LinearLayout` 条目，并将 `layout_height` 属性设置为 `wrap_content`。\n\
  \n## 72.9 添加 RecyclerView 适配\n\n正如“使用 RecyclerView 和 CardView 组件”章节中详细概述的那样，`RecyclerView`\
  \ 实例需要一个适配器类来提供显示的数据。通过在 Project 工具窗口中右点击 app -> java -> `com.ebookfrenzy.roomdemo`\
  \ 条目并选择 New -> Java Class 添加此类。在对话框中，将类命名为 `ListAdapter` 并从列表中选择 Class 然后按回车键。将生成的\
  \ `ListAdapter.java` 类加载到编辑器中，按如下实现该类：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  \nimport android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import android.widget.TextView;\nimport com.ebookfrenzy.roomdemo.R;\nimport androidx.annotation.NonNull;\n\
  import androidx.recyclerview.widget.RecyclerView;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import java.util.List;\n\npublic class ListAdapter extends RecyclerView.Adapter<ListAdapter.ViewHolder>\
  \ {\n    private final int productItemLayout;\n    private List<Product> productList;\n\
  \n    public ListAdapter(int layoutId) {\n        productItemLayout = layoutId;\n\
  \    }\n\n    public void setProductList(List<Product> products) {\n        productList\
  \ = products;\n        notifyDataSetChanged();\n    }\n\n    @Override\n    public\
  \ int getItemCount() {\n        return productList == null ? 0 : productList.size();\n\
  \    }\n\n    @NonNull\n    @Override\n    public ViewHolder onCreateViewHolder(ViewGroup\
  \ parent, int viewType) {\n```\n\n\n\n\n```java\nView view = LayoutInflater.from(\n\
  \                parent.getContext()).inflate(productItemLayout, parent, false);\n\
  \nreturn new ViewHolder(view);\n}\n\n@Override\npublic void onBindViewHolder(final\
  \ ViewHolder holder, final int listPosition) {\n    TextView item = holder.item;\n\
  \    item.setText(productList.get(listPosition).getName());\n}\nstatic class ViewHolder\
  \ extends RecyclerView.ViewHolder {\n    TextView item;\n    ViewHolder(View iteview)\
  \ {\n        super(iteview);\n        item = iteview.findViewById(R.id.product_row);\n\
  \    }\n}\n```\n\n # 72.10 准备主 Activity\n\n最后一个需要修改的组件是 `MainActivity` 类，它需要对 `Button`\
  \ 视图配置监听器并在 `ViewModel` 类中的 live data 对象配置观察器。在添加这些代码之前，必须进行一些准备工作以添加一些导入和变量。编辑\
  \ `MainActivity.java` 文件并进行如下修改：\n\n```java\nimport androidx.lifecycle.ViewModelProvider;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private MainViewModel viewModel;\n    private ProductListAdapter\
  \ adapter;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n\n        viewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \        listenerSetup();\n        observerSetup();\n        recyclerSetup();\n\
  \    }\n```\n\n在代码的各个阶段，应用需要清除用户界面上显示的产品信息。为了避免代码重复，请添加以下 `clearFields()` 方便函数：\n\
  \n```java\nprivate void clearFields() {\n    binding.productID.setText(\"\");\n\
  \    binding.productName.setText(\"\");\n    binding.productQuantity.setText(\"\"\
  );\n}\n```\n\n在构建和测试应用之前，需要将上述从 `onCreate()` 方法中调用的三个设置方法添加到类中。\n\n## 72.11 添加按钮监听器\n\
  \n主片段的界面界面布局包含三个按钮，每个按钮在用户点击时都需要执行特定的特定的任务。编辑 `MainActivity.java` 文件并添加 `listenerSetup()`\
  \ 方法：\n\n```java\nimport com.ebookfrenzy.roomdemo.Product;\n\nprivate void listenerSetup()\
  \ {\n    binding.addButton.setOnClickListener(view -> {\n        String name = binding.productName.getText().toString();\n\
  \        String quantity = binding.productQuantity.getText().toString();\n     \
  \   if (!name.isEmpty() && !quantity.isEmpty()) {\n            Product product =\
  \ new Product(name,\n                    Integer.parseInt(quantity));\n        \
  \    viewModel.insertProduct(product);\n            clearFields();\n        } else\
  \ {\n            binding.productID.setText(\"Incomplete information\");\n      \
  \  }\n    });\n    binding.findButton.setOnClickListener(view ->\n        viewModel.findProduct(binding.productName.getText().toString())\n\
  \    );\n    binding.deleteButton.setOnClickListener(view -> {\n        viewModel.deleteProduct(binding.productName.getText().toString());\n\
  \        clearFields();\n    });\n}\n```\n\n`addButton` 监听器执行了一些验证，以确保用户输入了产品名称，并使用此数据创建一个新的\
  \ `Product` 对象（注意，数量字符串被转换为整数以匹配实体数据）。随后在清除字段之前，会调用 `insertProduct()` 方法并传入 `Product`\
  \ 对象。`findButton` 和 `deleteButton` 监听器将产品名称传递给 `findProduct()` 或 `deleteProduct()`\
  \ 方法。\n\n## 72.12 添加数据观察者\n\n用户界面现在需要添加观察器，以与 `ViewModel` 中的 `searchResults` 和 `allProducts`\
  \ 对象保持同步。继续留在 `MainActivity.java` 文件中，如下实现 `observerSetup` 方法：\n\n```java\nimport\
  \ java.util.Locale;\n\nprivate void observerSetup() {\n    viewModel.getAllProducts().observe(this,\n\
  \            products -> adapter.setProductList(products));\n    viewModel.getSearchResults().observe(this,\n\
  \            products -> {\n            if (!products.isEmpty()) {\n           \
  \     binding.productID.setText(String.format(Locale.US, \"%d\",\n             \
  \           products.get(0).getId()));\n                binding.productName.setText(products.get(0).getName());\n\
  \                binding.productQuantity.setText(\n                        String.format(Locale.US,\
  \ \"%d\",\n                        products.get(0).getQuantity()));\n          \
  \  } else {\n                binding.productID.setText(\"No Match\");\n        \
  \    }\n        });\n}\n```\n\n“所有产品”观察者将当前的产品列表传递给 `RecyclerAdapter` 的 `setProductList()`\
  \ 方法，在该处将更新展示的列表。“搜索结果”观察者检查数据库中是否至少找到一个结果，从列表中提取产品对象，在必要时进行转换，并将其赋值给 TextView。\n\
  \n## 72.13 初始化 RecyclerView\n\n添加最后的设置方法以初始化 `RecyclerView` 和适配器：\n\n```java\nimport\
  \ androidx.recyclerview.widget.LinearLayoutManager;\n\nprivate void recyclerSetup()\
  \ {\n    adapter = new ProductListAdapter(R.layout.product_item);\n    binding.productRecycler.setLayoutManager(new\
  \ LinearLayoutManager(getContext()));\n    binding.productRecycler.setAdapter(adapter);\n\
  }\n```\n\n## 72.14 测试 Room 应用\n\n在设备或模拟器上编译并运行应用，添加一些产品，并确保它们自动显示在 RecyclerView\
  \ 中。对现有产品进行搜索，并验证产品 ID 和数量字段是否已更新。最后，输入一个现有产品的名称，从数据库中将其删除，并确认它已从 RecyclerView 列表中移除。\n\
  \n## 72.15 使用数据库检查器\n\n正如之前在“Android 持久化库”中所提到的，可以使用数据库检查器工具检查与运行应用相关的 Room 数据库的内容，并执行细微的数据更改。在使用\
  \ RoomDemo 应用添加一些数据库记录后，使用 `View -> Tool Windows -> App Inspection` 菜单显示数据库检查器工具：\n\
  \n从数据库面板 (B) 中，双击 `products` 表以查看存储在数据库中的表行。启用实时更新选项 (C)，然后使用运行中的应用向数据库添加更多记录。注意，数据库检查器会实时更新表数据\
  \ (D) 以反映更改。\n\n关闭实时更新以使表格不再是只读的，双击表中的某行的数量单元格，并在按下键盘回车键之前更改该值。返回运行中的应用并搜索该产品，以确认在检查器中对数量的更改已保存到数据库表中。\n\
  \n最后，点击表查询按钮（如图 72-4 所示箭头所示）以显示新的查询标签页 (A)，确保选中了 `product_database` (B)，并在查询文本框中输入\
  \ SQL 语句 (C) 并点击运行按钮 (D)：\n\n\n\n\n\n![](img/as_database_query.jpg)\n\n图 72-4\n\n\
  行列表应当更新以反映 SQL 查询 (E) 的结果。\n\n### 72.16 总结\n\n本章演示了如何使用 `Room` 持久库在 `SQLite` 数据库中存储数据。完成的项目使用了存储库（repository）将\
  \ `ViewModel` 与所有数据库操作分离来。它演示了实体（entities）、`DAO` 以及 Room 数据库实例的创建，包括在执行某些数据库操作时使用异步任务。\n\
  \n## 73. 使用 Android 存储访问框架访问云存储\n\n近年来，远程存储服务（也称为“云存储”）在存储用户文件和数据方面被广泛采用。驱动这一增长有两个关键因素。其是，大多数移动设备现在都提供持续、高速的互联网连接，从而使得数据传输既快速又廉价。第二个因素是，与传统的计算机系统（如台式机和笔记本电脑）相比，这些移动设备的内部存储资源受到限制。例如，今天一台高规格的\
  \ Android 平板通常配备 256 GB 的存储容量。与配备 1 TB 硬盘驱动的中端笔记本电脑系统相比，无缝远程存储文件是今天许多移动应用的一项关键需求。\n\
  \n考虑到这一事实，Google 在 Android 4.4 SDK 中引入了 `Storage Access Framework`（存储访问框架）。本章将提供存储访问框架的高级概述，为下一章中更详细的教程做准备，该章节标题为\
  \ \"Android 存储访问框架示例”(#Cloud_Storage_Tutorial.xhtml__idTextAnchor1422) 。\n\n###\
  \ 73.1 存储访问框架\n\n从用户的角度来看，`Storage Access Framework` 提供了一个直观的用户界面，允许用户在 Android\
  \ 内部浏览、选择、删除和创建由存储服务（也称为文档提供者）托管的文件。使用此浏览界面（也称为选择器/picker），用户可以浏览所选文档提供者托管的文件（如文档、音频、图像和视频）。例如，[图\
  \ 73-1 显示了选择器界面展示了由文档提供者服务托管的文件集合：\n\n![](img/as3.0_storage_demo_picker.jpg)\n\n\
  图 73-1\n\n文档提供者可以从云端服务到运行在客户端应用程序同一设备上的本地文档提供者不等。在编写时，与 `Storage Access Framework`\
  \ 兼容的最著名的文档提供者是 Box 和，意所当然的，Google Drive。其他云存储提供商和应用程序开发者很快也会提供符合 Android 存储访问框架的服务。\n\
  \n除了云端文档提供者外，选择器还提供了设备内部存储的访问，为应用程序用户提供一系列文件存储选项。\n\n通过一组 `Intents`，Android 应用程序开发者只需几行代码将这些存储功能集成到应用程序中。从开发者的角度来看，`Storage\
  \ Access Framework` 特别吸引人的方面是，用户选择的底层文档提供者对应用程序完全透明的。一旦在应用程序中使用框架实现了存储功能，它就可以不修改任何代码的情况下与所有文档提供者配合。\n\
  \n### 73.2 使用存储访问框架\n\nAndroid 包含了一组 `Intents`，旨在将 `Storage Access Framework` 的功能集成到\
  \ Android 应用程序中。这些 intent 向用户显示存储访问框架选择器界面，并通过调用启动 intent 的 activity 的 `onActivityResult()`\
  \ 方法将交互结果返回给应用程序。当 `onActivityResult()` 方法被调用时，将传递所选文件的 `Uri` 以及一个指示操作成功与否的值。\n\n\
  `Storage Access Framework` 的 intents 可以总结如下：\n\n* `ACTION_OPEN_DOCUMENT` – 为用户提供访问选择器用户界面的权限，以便从设备上配置的文档提供者中选择文件。选的文件以\
  \ `Uri` 对象的形式返回给应用程序。 \n* `ACTION_CREATE_DOCUMENT` – 允许用户选择文档提供者、该提供者存储上的某个位置以及新文件的文件名。一旦选择完成，将由\
  \ `Storage Access Framework` 创建文件，并将该文件的 `Uri` 返回给应用程序以进行进一步处理。\n\n### 73.3 过滤选择器文件列表\n\
  \n在启动 intent 时，选择器界面中列出的文件可以使用各种选项进行过滤。例如，考虑以下用于配置 `ACTION_OPEN_DOCUMENT` intent\
  \ 的代码：\n\n```\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n```\n\n\
  启动时，上述 intent 将导致显示选择器界面，允许用户浏览并选择由可用文档提供者托管的任何文件。一旦用户选择了文件，将以 `Uri` 对象的形式向应用程序提供该文件的引用。应用程序随后可以使用\
  \ `openFileDescriptor(Uri, String)` 方法打开该文件。然而，存在某种风险，即并非所有提供者列出的文件都能通过这种方式打开。通过使用\
  \ `CATEGORY_OPENABLE` 选项修改 intent，可以在选择器中排除此类文件。例如：\n\n```java\nIntent intent =\
  \ new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  ```\n\n当现在显示 intent 时，无法使用 `openFileDescriptor()` 方法打开的文件将被列出，但用户无法选择。\n\n另一种有效的过滤方法允许根据文件类型限制可供选择的文件。这涉及到指定应用程序能够处理的文件类型。例如，一个图像编辑应用程序可能只想为用户提供从提供者处选择文件的选项。这是通过配置\
  \ intent 对象以供用户选择的 MIME 类型来实现的。例如，以下代码指定了图像文件适合选择器：\n\n```java\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");\n```\n\n这可以进一步细化为限制选择 JPEG 图像：\n\n```java\nintent.setType(\"\
  image/jpeg\");\n```\n\n或者，音频播放器可能只能处理音频文件：\n\n```java\nintent.setType(\"audio/*\"\
  );\n```\n\n音频应用可能被进一步限制为仅支持基于 MP4 的音频文件：\n\n```java\nintent.setType(\"audio/mp4\"\
  );\n```\n\n在处理存储访问框架时，可以使用广泛的 MIME 类型设置，其中常见的可以在网上列出：\n\nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n### 73.4 处理 Intent 结果\n\n由于我们要启动会返回结果的 intent，需要使用 `registerForActivityResult()`\
  \ 方法（在标题为 [\"Android 显式 Intent 实例示例”(#Explicit_Intents.xhtml__idTextAnchor1105)\
  \ 的章节中介绍）创建一个启动器并声明一个 lambda 来处理返回的数据，例如：\n\n```java\nActivityResultLauncher<Intent>\
  \ startOpenForResult = registerForActivityResult(\n    new ActivityResultContracts.StartActivityForResult(),\n\
  \    new ActivityResultCallback<ActivityResult>() {\n        @Override\n       \
  \ public void onActivityResult(ActivityResult result) {\n            if (result.getResultCode()\
  \ == Activity.RESULT_OK) {\n                Intent data = result.getData();\n  \
  \          }\n        }\n    });\n```\n\n\n\n\n\n```java\n// Read file content from\
  \ Uri here\n}\n}\n});\n```\n\n声明后，可以按照如下方式配置并启动 Intent：\n\n```java\nIntent intent\
  \ = new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"text/plain\");\nstartOpenForResult.launch(intent);\n```\n\n## 73.5\
  \ 读取文件内容\n\n读取文档提供者（document provider）托管的文件所需的步骤很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与读取图像或音频文件的步骤不同。\n\
  \n通过从 `Uri` 对象中提取文件描述符，并将图像解码为 `BitmapFactory` 实例，可以将文件分配给 `Bitmap` 对象。例如：\n\n```java\n\
  ParcelFileDescriptor pFileDescriptor =\n    getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nFileDescriptor fileDescriptor =\n    pFileDescriptor.getFileDescriptor();\n\
  Bitmap image = BitmapFactory.decodeFileDescriptor(fileDescriptor);\npFileDescriptor.close();\n\
  myImageView.setImageBitmap(image);\n```\n\n注意，文件描述符是以“r”模式打开的。这表示文件将用于读取。其他选项是“w”（用于写访问）和“rwt”（用于读写访问），其中文件中的现有内容会被新内容截断。\n\
  \n读取文本文件的内容需要稍多的工作，并需要使用 `InputStream` 对象。例如，以下代码从文本文件中读取每一行：\n\n```java\nInputStream\
  \ inputStream = getContentResolver().openInputStream(uri);\nBufferedReader reader\
  \ = new BufferedReader(new InputStreamReader(\n    inputStream));\nString readline;\n\
  while ((readline = reader.readLine()) != null) {\n    // 对文件中的每一行进行操作\n}\ninputStream.close();\n\
  ```\n\n## 73.6 向文件写入内容\n\n向文档提供者托管的打开文件写入内容与读取类似，不同之处使用的是输出流而不是输入流。例如，以下代码将文本写入指定\
  \ `Uri` 所引用的基于存储文件的输出流中：\n\n```java\ntry {\n    ParcelFileDescriptor pFileDescriptor\
  \ = this.getContentResolver().\n    openFileDescriptor(uri, \"w\");\n    FileOutputStream\
  \ fileOutputStream =\n    new FileOutputStream(pFileDescriptor.getFileDescriptor());\n\
  \    String textContent = \"Some sample text\";\n    fileOutputStream.write(textContent.getBytes());\n\
  \    fileOutputStream.close();\n    pFileDescriptor.close();\n} catch (FileNotFoundException\
  \ e) {\n    e.printStackTrace();\n} catch (IOException e) {\n    e.printStackTrace();\n\
  }\n```\n\n首先，从 `Uri` 中提取文件描述符，这次请求对目标文件的写权限。随后使用该文件描述符获取文件输出流的引用。内容（在本例中为某些文本）在文件描述符和输出流关闭之前被写入输出流。\n\
  \n## 73.7 删除文件\n\n能否从存储器中删除文件取决于该文件的文档提供者是否支持删除文件。假设允许删除，可以如下所示对指定的 `Uri` 执行删除：\n\
  \n```java\nif (DocumentsContract.deleteDocument(getContentResolver(), uri))\n  \
  \  // 删除成功\nelse\n    // 删除失败\n```\n\n## 73.8 获取对文件的持久访问权限\n\n当应用程序通过存储访问框架（Storage\
  \ Access Framework）获取文件访问时，该访问将一直有效，直到运行应用程序的 Android 设备重启。通过“获取” `Uri` 的必要权限，可以获得特定文件的持久访问权限。例如，以下代码对\
  \ `fileUri` `Uri` 实例引用的文件持久化读写权限：\n\n```java\nfinal int takeFlags = intent.getFlags()\n\
  \    & (Intent.FLAG_GRANT_READ_PERMISSION | Intent.FLAG_GRANT_WRITE_PERMISSION);\n\
  getContentResolver().takePersistableUriPermissions(uri, takeFlags);\n```\n\n###\
  \ 73.9 总结\n\n思考近年来人们对存储的感知是如何变化的是非常有趣的。“存储”一词曾与大容量内部硬盘驱动器同义，而现在它更有可能指代托管在远程云端并通过互联网连接访问的存储空间。对于资源受限的“始终连接”的移动设备来说，这种情况变得日益普遍。\n\
  \n存储访问框架为用户和应用程序开发者提供了一种简单的机制，使他们能够无缝访问存储在云端的文件。通过一组 Intent 和一个用于选择文档提供者的内置用户界面，现在可以集成全面的云端存储。\n\
  \n## 74. Android 存储访问框架示例\n\n如之前讨论的，存储访问框架极大地简化了将云端存储集成到 Android 应用程序的过程中。通过一个选择器用户界面和一组新的\
  \ Intent，现在可以构建对存储在 Google Drive 和 Box 等文档提供者上的文件的访问。\n\n### 74.1 关于存储访问框架示例\n\n\
  在本章创建的 Android 应用程序将采用原始文本编辑器的形式，旨在将文件创建并远程存储到云存储服务中。在实践中，该示例将与任何兼容存储访问框架的云存储提供者一起工作，尽管为了本示例我们假设使用\
  \ Google Drive。\n\n在功能方面，该应用程序将向用户提供一个多行文本视图，用户可以在其中输入和编辑文本，并有一组按钮允许创建、打开和保存基于存储的文本文件。\n\
  \n### 74.2 创建存储访问框架示例\n\n在欢迎界面选择 New Project（新建项目），并在新项目对话框中选择 Empty Views Activity\
  \ 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 StorageDemo，并指定 `com.ebookfrenzy.storagedemo`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将语言设置为\
  \ Java。\n\n### 74.3 设计用户界面\n\n用户界面需要由三个 `Button` 视图和一个 `EditText` 视图组成。在 Project\
  \ 工具窗口中，导航到位于 `app -> res -> layout` 的 `activity_main.xml` 布局文件并双击它将其加载到 Layout\
  \ Editor 工具。在工具处于 Design 模式时，选择并删除 Hello World! `TextView` 对象。\n\n\n\n\n\n将一个 `Button`\
  \ 小部件拖动并放置在布局的左上角，这样在释放部件之前，会显示左侧和顶部的虚线对齐线。放置第二个 `Button`，使中心和顶部的对齐线出现。第三个 `Button`\
  \ 小部件应被放置在顶部和右侧对齐线出现的位置。\n\n将三个按钮的文本属性分别更改为“New”（新建）、“Open”（打开）和“Save”（保存）。接下来，放置\
  \ `Plain Text` 小部件使其水平居中并位于中间按钮的下方，使用户界面布局与图 74-1 所示所示。使用布局编辑器工具栏中的 `Infer Constraints`（推断约束）按钮添加任何缺失的约束。\n\
  \n在布局中选择 `Plain Text` 小部件，删除当前的文本属性设置，使该字段初始为空白，并将 `ID` 设置为 `fileText`。接下来，将字符串属性提取为命名为\
  \ `string`、`open_string` 和 `save_string` 的资源值。\n\n![](img/as_storagedemo_ui.jpg)\n\
  \n图 74-1\n\n使用 `Attributes` 属性窗口配置 `Button` 小部件上的 `onClick` 属性，分别调用名为 `newFile`、`openFile`\
  \ 和 `saveFile` 的方法。\n\n## 74.4 添加活动启动器\n\n按照名为 Android 显式意图——实例示例章节概述的步骤，我们需要开始注册活动启动器，以处理文件内容的创建、打开和保存。\n\
  \n在 `MainActivity.java` 文件中，如下为每个三个操作分别添加一个启动器：\n\n```java\nimport androidx.activity.result.ActivityResult;\n\
  import androidx.activity.result.ActivityResultCallback;\nimport androidx.activity.result.ActivityResultLauncher;\n\
  import androidx.activity.result.contract.ActivityResultContracts;\nimport android.app.Activity;\n\
  import android.content.Intent;\nimport android.net.Uri;\nimport java.io.IOException;\n\
  \nActivityResultLauncher<Intent> startOpenForResult =\n    registerForActivityResult(\n\
  \        new ActivityResultContracts.StartActivityForResult(),\n        new ActivityResultCallback<ActivityResult>()\
  \ {\n            @Override\n            public void onActivityResult(ActivityResult\
  \ result) {\n                if (result.getResultCode() == Activity.RESULT_OK) {\n\
  \                    Intent data = result.getData();\n                    if (data\
  \ != null) {\n                        Uri currentUri = data.getData();\n       \
  \                 try {\n                            String content = readFileContent(currentUri);\n\
  \                            binding.fileText.setText(content);\n              \
  \          } catch (IOException e) {\n                            // Handle error\n\
  \                        }\n                    }\n                }\n         \
  \   }\n        });\n\nActivityResultLauncher<Intent> startSaveForResult =\n    registerForActivityResult(\n\
  \        new ActivityResultContracts.StartActivityForResult(),\n        result ->\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                if (data != null) {\n \
  \                   Uri currentUri = data.getData();\n                    try {\n\
  \                        writeFileContent(currentUri);\n                    } catch\
  \ (IOException e) {\n                        // Handle error\n                 \
  \   }\n                }\n            }\n        });\n\nActivityResultLauncher<Intent>\
  \ startCreateForResult =\n    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              binding.fileText.setText(\"\");\n                    }\n        \
  \        }\n            }\n        });\n```\n\n### 74.5 创建新文件\n\n当选择 New 按钮时，应用程序需要触发一个\
  \ `ACTION_CREATE_DOCUMENT` 意图来创建一个纯文本类型的文件。在设计用户界面时，New 按钮被配置为调用名为 `newFile()` 的方法。需要在该方法内部启动相应的意图。\n\
  \n在 `MainActivity.java` 文件中，如下实现该方法：\n\n```java\npackage com.ebookrenzy.storagedemo;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    public void newFile(View\
  \ view) {\n        Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);\n\
  \        intent.addCategory(Intent.CATEGORY_OPENABLE);\n        intent.setType(\"\
  text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE, \"newfile.txt\");\n\
  \        startCreateForResult.launch(intent);\n    }\n}\n```\n\n此代码创建了一个新的 `ACTION_CREATE_DOCUMENT`\
  \ `Intent` 对象。然后对该意图进行配置，以便仅返回可以通过文件描述符打开的文件（通过 `Intent.CATEGORY_OPENABLE` 设置）。接下来，代码指定要打开的文件类型为纯文本类型，并提供了一个占位符文件名（用户可以更改它）。当执行此方法且意图完成任务时，将调用\
  \ `startCreateForResult()` 并传递新创建文档的 `Uri`。\n\n## 74.6 保存到存储文件\n\n现在应用程序能够创建新的基于存储的文件，下一步是添加将用户输入的任何文本保存到文件中的功能。用户界面被配置为在用户选择\
  \ Save 按钮时调用 `saveFile()` 方法。该方法将负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新意图，这将导致选择器界面出现，以便用户可以选择要存储文本的文件。\n\
  \n由于我们只处理纯文本文件，因此需要配置意图将用户的选择限制为匹配 `text/plain` MIME 类型的现有文件。在确定了 `saveFile()` 方法要执行的操作后，现在可以将其添加到\
  \ `MainActivity.java` 类文件中如下：\n\n```java\npublic void saveFile(View view) {\n  \
  \  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startSaveForResult.launch(intent);\n}\n\
  ```\n\n分配给 `startSaveForResult()` 的空表达式调用名为 `writeFileContent()` 的方法，传递要写入文本的文件\
  \ `Uri`。在 `MainActivity.java` 文件中，现在实现该方法，其读取如下：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport java.io.FileOutputStream;\nimport android.os.ParcelFileDescriptor;\n\n\
  public class MainActivity extends AppCompatActivity {\n    private void writeFileContent(Uri\
  \ uri) throws IOException {\n        try {\n            ParcelFileDescriptor pfd\
  \ = this.getContentResolver().openFileDescriptor(uri, \"w\");\n            FileOutputStream\
  \ fileOutputStream = new FileOutputStream(pfd.getFileDescriptor());\n          \
  \  String textContent = binding.fileText.getText().toString();\n            fileOutputStream.write(textContent.getBytes());\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```java\nfileOutputStream.close();\npfd.close();\n\
  } catch (IOException e) {\n    e.printStackTrace();\n}\n}\n```\n\n该方法首先从用户选择的文件的\
  \ `Uri` 中获取并打开文件描述符。由于代码需要写入文件，因此文件描述符是以写入模式（`\"w\"`）打开的。随后，该文件描述符被作为创建输出流的基础，从而允许应用程序写入文件。\n\
  \n用户输入的文本从编辑框对象（edit text object）提取，并在关闭文件描述符和流之前写入输出流。代码还添加了处理以应对在文件写入过程中可能遇到的任何\
  \ `IO` 异常。\n\n## 74.7 打开和读取存储文件\n\n在完成创建和保存文本文件的代码编写后，最后的任务是添加一些从存储中打开和读取文件的功能。这将涉及编写\
  \ `openFile()` `onClick` 事件处理器方法并实现它，使其启动一个 `ACTION_OPEN_DOCUMENT` 节点：\n\n```java\n\
  public void openFile(View view)\n{\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  \    intent.addCategory(Intent.CATEGORY_OPENABLE);\n    intent.setType(\"text/plain\"\
  );\n    startOpenForResult.launch(intent);\n}\n```\n\n接下来的任务是实现由 `startOpenForResult()`\
  \ lambda 调用的 `readFileContent()` 方法：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport java.io.BufferedReader;\nimport java.io.InputStream;\nimport java.io.InputStreamReader;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    private String readFileContent(Uri\
  \ uri) throws IOException {\n        InputStream inputStream =\n            getContentResolver().openInputStream(uri);\n\
  \        BufferedReader reader =\n            new BufferedReader(new InputStreamReader(\n\
  \                inputStream));\n        StringBuilder stringBuilder = new StringBuilder();\n\
  \        String currentline;\n        while ((currentline = reader.readLine()) !=\
  \ null) {\n            stringBuilder.append(currentline).append(\"\\n\");\n    \
  \    }\n        inputStream.close();\n        return stringBuilder.toString();\n\
  \    }\n}\n```\n\n该方法首先提取所选文本文件的文件描述符并将其打开读取。随后打开与 `Uri` 关联的输入流，并将其作为 `BufferedReader`\
  \ 实例的输入源。\n\n文件中的每一行随后被读取并存储在 `StringBuilder` 对象中。一旦所有行都读取完毕，输入流和文件描述符都会被关闭，文件内容将以\
  \ `String` 对象的形式返回。\n\n## 74.8 测试存储\n\n代码编写完成后，应用程序已准备好进行测试。在设备或模拟器上运行应用程序。使用存储按钮从设备中选择文件。一旦选择了文件，内容将显示在屏幕上。\n\
  \n### 74.9 总结\n\n本章实现了一个处理存储的示例 Android 应用程序。\n\n## 75. 使用 VideoView 和 MediaController\
  \ 类在 Android 上进行视频播放\n\n智能手机和平电脑的主要用途之一是访问在线内容。视频是一种广泛使用的内容形式。\n\nAndroid SDK 包含了两个类使得在\
  \ Android 上实现播放变得极其简单。本章将概述这两个类：`VideoView` 和 `MediaController`。\n\n### 75.1 介绍\
  \ Android VideoView 类\n\n在 Android 应用程序中显示内容最简单的方法是使用 `VideoView` 类。这个视觉组件在添加到布局中时会提供一个可以播放视频的表面。Android\
  \ 目前支持以下格式：\n\n- H.263\n- H.264 AVC\n- H.265 HEVC\n- MPEG-4 SP\n- VP8\n- VP9\n\n\
  `VideoView` 类有一系列可以调用的方法来管理播放。一些较常用的方法包括：\n\n- `setVideoPath(String path)` – 指定要播放的视频媒体路径（字符串形式）。这可以是远程视频文件的\
  \ URL，也可以是设备本地视频文件。\n- `setVideoUri(Uri uri)` – 执行与 `setVideoPath()` 方法相同的任务，但它接收一个\
  \ `Uri` 对象而不是字符串。\n- `start()` – 开始播放。\n- `stopPlayback()` – 停止播放。\n- `pause()`\
  \ – 暂停播放。\n- `isPlaying()` – 返回一个布尔值，指示视频正在播放。\n- `setOnPreparedListener(MediaPlayer.OnPreparedListener)`\
  \ – 允许在视频准备好播放时调用回调方法。\n- `setOnErrorListener(MediaPlayer.OnErrorListener)` – 允许在播放过程中发生错误时调用回调方法。\n\
  - `setOnCompletionListener(MediaPlayer.OnCompletionListener)` – 允许在视频结束时调用回调方法。\n\
  - `getDuration()` – 返回视频时长。除非从 `OnPreparedListener()` 回调方法内部调用，否则通常会返回 -1。\n- `getCurrentPosition()`\
  \ – 返回一个表示当前播放位置的整数值。\n- `setMediaController(MediaController)` – 指定一个 `MediaController`\
  \ 实例，允许向用户显示播放控件。\n\n### 75.2 介绍 Android MediaController 类\n\n\n\n\n\n如果使用 `VideoView`\
  \ 类播放视频，用户将无法对播放进行任何控制，视频将一直运行到结束。此问题可以通过将 `MediaController` 类的实例挂载到 `VideoView`\
  \ 实例来解决。此后，`MediaController` 将提供一组控件，允许用户管理播放（例如暂停，以及在视频时间轴上向后/向前跳进）。\n\n控件的位置通过将控制器实例锚定到用户界面布局中的特定视图（View）来指定。一旦挂载并锚定，控件在播放开始时会短暂出现，随后用户可以通过点击该实例所锚定的视图，在任何时候重新恢复它们。\n\
  \n该类的一些关键方法如下：\n\n- `setAnchorView(View view)` – 指定控制器将锚定的视图。这确定了控件在屏幕上的显示位置。\n\
  - `show()` – 显示控件。\n- `show(int timeout)` – 控件显示指定的持续时间（以毫秒为单位）。\n- `hide()` – 向用户隐藏控制器。\n\
  - `isShowing()` – 返回一个布尔值，表示控件当前对用户是否可见。\n\n## 75.3 创建视频播放示例\n\n本章的剩余部分将创建一个使用 `VideoView`\
  \ 和 `MediaController` 类播放 MPEG-4 视频文件的示例应用程序。\n\n从欢迎屏幕选择 `New Project`选项，在弹出的新项目对话框中，选择\
  \ `Empty Views Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `VideoPlayer` 并指定\
  \ `com.ebookfrenzy.videoplayer` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为\
  \ `API 33: Android 13 (Tiramisu)`，并将 `Language` 菜单更改为 `Java`。使用节 11.8 Migrating\
  \ a Project to View Binding 节步骤为项目启用视图绑定（view binding）。\n\n## 75.4 设计 VideoPlayer\
  \ 布局\n\n主活动（main activity）的用户界面将仅由 `VideoView` 类实例组成。使用 `Project` 工具窗口找到 `app ->\
  \ res -> layout -> activity_main.xml` 文件，双击它，将 `Layout Editor` 工具切换到 `Design` 模式，并删除默认的\
  \ `TextView` 控件。\n\n从 `Palette` 面板的 `Widgets` 类别中，将 `VideoView` 实例拖放到布局上以填充可用画布区域，如图图\
  \ 75-1 所示。使用 `Attributes` 面板，将 `layout_width` 和 `layout_height` 属性分别改为 `match_constraint`\
  \ 和 `wrap_content`。同时，移除连接 `VideoView` 底部到父 `ConstraintLayout` 底部的约束。最后，将组件的 `ID`\
  \ 更改为 `videoView1`。\n\n![](img/as_3.5_videoplayer_ui.jpg)\n\n图 75-1\n\n## 75.5 下载视频文件\n\
  \n`VideoPlayer` 应用将播放的视频是一个 MPEG-4 格式编码的短动画片段。使用网络浏览器访问以下 URL 来播放视频：\n\n[`www.ebookfrenzy.com/android_book/demo.mp4`](https://www.ebookfrenzy.com/android_book/demo.mp4)\n\
  \n留在浏览器窗口内，右键点击视频播放，选择保存或下载视频到本地文件的选项，并选择合适的临时文件系统位置，文件名命名为 `demo.mp4`。\n\n在 Android\
  \ Studio 中，在 `Project` 工具窗口中找到 `res` 文件夹，右键点击它，选择 `New -> Directory` 菜单选项，在名称字段中输入\
  \ `raw` 然后按 `Return` 键。使用操作系统的文件系统导航器找到上述下载的 `demo.mp4` 文件并复制它。返回 Android Studio，右键点击新创建的\
  \ `raw` 目录并选择 `Paste` 选项将视频文件复制到项目中。添加完成后，`raw` 文件夹应与 `Project` 工具窗口中的图 75-2 一致：\n\
  \n![](img/as_video_player_movie_added.jpg)\n\n图 75-2\n\n## 75.6 配置 VideoView\n\n\
  下一步是为 `VideoView` 配置要播放的视频路径，然后开始播放。将在主活动初始化后执行，因此将 `MainActivity.java` 文件加载到编辑器中，并按照下方列出的代码对其进行修改：\n\
  \n```java\npackage com.ebookfrenzy.videoplayer;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.net.Uri;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        configureVideoView();\n    }\n\n    private void configureVideoView() {\n\
  \        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n    \
  \            + getPackageName() + \"/\" + R.raw.demo));\n        binding.videoView1.start();\n\
  \    }\n}\n```\n\n此代码获取了 `VideoView` 的引用，并为其分配了指向电影文件的 `Uri` 对象。在模拟器或物理设备上运行应用程序以测试它。在应用程序启动后，视频缓冲时可能会有延迟。\n\
  \n![](img/as_running.jpg)\n\n图 75-3\n\n## 75.7 在视图中添加 MediaController\n\n目前 `VideoPlayer`\
  \ 应用的状态是用户无法控制播放。如前所述，可以通过 `MediaController` 类来实现。要为 `VideoView` 添加控制器，修改 `configureVideoView()`\
  \ 方法如下：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\nimport android.widget.MediaController;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private MediaController mediaController;\n\n    private void configureVideoView()\
  \ {\n        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n\
  \                + getPackageName() + \"/\" + R.raw.demo));\n        mediaController\
  \ = new MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView1.start();\n\
  \    }\n}\n```\n\n当这些更改运行应用程序时，点击 `VideoView` 画布将在视频播放上方显示媒体控件。这些控件应包含进度条以及快进、倒退和播放/暂停按钮。控件消失后，可以通过再次点击\
  \ `VideoView` 画布随时恢复。只需三行代码，我们的视频播放器现在有了媒体控件，如图图 75-4 所示：\n\n![](img/as_3.6_video_player_media_controls.jpg)\n\
  \n图 75-4\n\n## 75.8 设置 onPreparedListener\n\n作为处理视频媒体的最后一个示例，将进一步扩展活动以演示配置监听器的机制。在这种情况下，将实现一个监听器，旨在将视频时长作为消息输出到\
  \ Android Studio Logcat 面板。该监听器还将配置视频播放为循环播放：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \nimport android.util.Log;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n    private MediaController mediaController;\n\
  \    String TAG = \"VideoPlayer\";\n\n    private void configureVideoView() {\n\
  \        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n    \
  \            + getPackageName() + \"/\" + R.raw.demo));\n```\n\n\n\n\n\n```java\n\
  + getPackageName() + \"/\" + R.raw.demo));\n\nMediaController mediaController =\
  \ new MediaController(this);\n\nmediaController.setAnchorView(binding.videoView1);\n\
  binding.videoView1.setMediaController(mediaController);\nbinding.videoView1.setOnPreparedListener(mp\
  \ -> {\n    mp.setLooping(true);\n    Log.i(TAG, \"Duration = \" + binding.videoView1.getDuration());\n\
  });\nbinding.videoView.start();\n}\n}\n```\n现在在视频播放开始之前，Android Studio Logcat 面板中会出现一条类似于所示的消息，并且视频将在播放结束后重新启动：\n\
  \n`2023-06-27 09:25:41.313 3050-3050 VideoPlayer com.ebookfrenzy.videoplayer I Duration\
  \ = 25365`\n\n# 75 总结\n\nAndroid 设备是向用户交付内容的极佳平台，尤其是视频媒体形式。正如本章概述，Android SDK 提供了两个类，即\
  \ `VideoView` 和 `MediaController`，它们结合使得在 Android 中集成视频播放变得快速且简单，通常只需要几行 Java 代码。\n\
  \n# 76 Android 画中画模式\n\n在之前的章节中介绍 Android 的多任务处理时，曾简要地提过画中画（PiP）模式，但没有进行详细介绍。画中画模式主要为视频播放设计，允许活动屏幕缩小尺寸并放置在屏幕上的任何位置。在此状态下，活动将继续运行，无论设备上运行着任何其他活动，窗口都会保持可见。这允许用户例如在执行如检查电子邮件或处理电子表格等任务的同时，继续观看视频播放。\n\
  \n本章将提供画中画模式的概述，在下一章将为 `VideoPlayer` 项目添加画中画支持。\n\n## 76.1 画中画功能\n\n正如本章后部分所解释以及在下一章中演示的那样，活动通过运行中应用内部的\
  \ API 调用进入 PiP 模式。进入 PiP 模式后，可以指定配置选项来控制 PiP 窗口的宽高比，并定义要包含的活动屏幕区域。例如，[图 76-1] 显示了\
  \ PiP 模式下的视频播放活动：\n\n![](img/Image24273.jpg)\n\n图 76-1\n\n[图 76-2] 显示了用户点击窗口后的 PiP\
  \ 模式窗口。在此模式下，窗口看起来更大，并在中心包含一个全屏操作，点击该操作会将窗口恢复到全屏模式；右上角还有一个退出按钮，用于关闭窗口并将应用置于后台。当在此模式下显示时，添加到\
  \ PiP 窗口的任何自定义操作将出现在屏幕上。在 [图 76-2] 的情况下，PiP 窗口包含了自定义的播放和暂停操作按钮：\n\n![](img/Image24363.jpg)\n\
  \n图 76-2\n\n本章的其余部分将概述如何在 Android 应用内部启用和管理 PiP 模式。\n\n## 76.2 启用画中画模式\n\nPiP 模式目前仅支持运行\
  \ API 26：Android 8.0 (Oreo) 或更高版本的设备。实现 PiP 模式的第一步是在项目的 manifest 文件中启用它。PiP 模式是基于活动进行配置的，通过在每个需要\
  \ PiP 支持的活动元素中添加以下行来实现：\n\n```xml\n<activity android:name=\".MyActivity\"\n    android:supportsPictureInPicture=\"\
  true\"\n    android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n`android:supportsPictureInPicture` 开启了该活动的\
  \ PiP 功能，而 `android:configChanges` 属性通知 Android 活动可以处理变化。如果没有此设置，每次活动进入或退出 PiP 模式，活动都将从头开始。\n\
  \n## 76.3 配置画中画参数\n\nPiP 行为通过使用 `PictureInParams` 定义，可以使用 `Builder` 类创建其实例，如下：\n\
  \n```java\nPictureInParams params = new PictureInParams.Builder().build();\n```\n\
  \n上述代码创建了一个默认的 `PictureInParams` 实例。可以使用以下方法调用来自定义参数：\n\n- `setActions()`：用于定义在活动处于\
  \ PiP 模式时在 PiP 窗口内可以执行的操作。操作将在本章后部分介绍。\n- `setAspectRatio()`：声明 PiP 窗口的首选宽高比。该方法接受一个\
  \ `Rational` 对象作为参数。\n- `setSourceHint()`：接受一个 `Rect` 对象作为参数，定义要显示的活动区域。\n\n例如，以下代码使用\
  \ `VideoView` 维度在 `PictureInParams` 中配置宽高比和操作：\n\n```java\nPictureInParams params\
  \ = new PictureInParams.Builder()\n    .setAspectRatio(rational)\n    .setActions(actions)\n\
  \    .build();\n```\n\n一旦定义，可以随时使用 `setPictureInParams()` 方法设置 PiP 参数：\n\n`setPictureInParams(params);`\n\
  \n也可以在进入 PiP 模式时指定参数。\n\n## 76.4 进入画中画模式\n\n通过调用 `enterPictureMode()` 方法进入画中画模式，并传递一个\
  \ `PictureInParams` 对象：\n\n`enterPictureMode(params);`\n\n如果不需要参数，请按照上一节所述创建一个默认的\
  \ `PictureInParams` 对象。如果之前使用 `setPictureInParams()` 方法设置了参数，这些参数将与在 `enterPictureMode()`\
  \ 方法中指定的参数相结合。\n\n## 76.5 检测画中画模式变化\n\n当活动进入 PiP 模式时，隐藏不必要的视图，这样在 PiP 窗口中只有视频播放可见。当活动重新进入全屏模式时，必须恢复隐藏的用户界面组件。这些以及其他应用特定的任务可以通过重写\
  \ `onPictureInModeChanged()` 方法来实现。当该方法添加到活动时，每次活动在 PiP 和全屏模式之间切换时都会调用该方法，并传递一个布尔值表示活动当前是否处于\
  \ PiP 模式：\n\n```java\n@Override\npublic void onPictureInModeChanged(boolean isInPictureInPictureMode)\
  \ {\n    super.onPictureInModeChanged(isInPictureInPictureMode);\n    if (isInPictureInPictureMode)\
  \ {\n        // 进入了画中画模式\n    } else {\n        // 进入了全屏模式\n    }\n}\n```\n\n# 76.6\
  \ 添加画中画操作\n\n\n\n\n\n当用户点击画中画（PiP）窗口时，画中画操作将以图标的形式显示在窗口窗口内。实现 PiP 操作是一个多步骤的过程，首先要实现让\
  \ PiP 窗口通知 activity 已选择某个操作的方法。这通过在 activity 中设置广播接收器（broadcast receiver），并在 PiP\
  \ 操作中创建一个 `pending intent`来实现，该 `pending intent` 随后被配置为广播广播接收器正在监听的意图（intent）。当意图触发广播接收器时，存储在\
  \ `intent` 中的数据可用于识别所执行的操作，并在 activity 中采取必要的行动。\n\nPiP 操作使用 `RemoteAction` 实例声明，并使用图标、标题、描述以及\
  \ `PendingIntent` 对象进行初始化。一旦创建了一个或多个操作，它们就会被添加到 `ArrayList` 中，并在构建 `PictureInPictureParams`\
  \ 对象时传递给 `setActions()` 方法。\n\n以下代码段演示了 `Intent`、`PendingIntent` 和 `RemoteAction`\
  \ 对象的创建，以及一个 `PictureInPictureParams` 实例的创建，随后将该实例应用到 activity 的 PiP 设置中：\n\n```java\n\
  final ArrayList<RemoteAction> actions = new ArrayList<>();\n\nIntent actionIntent\
  \ = new Intent(\"MY_PIP_ACTION\");\n\nfinal PendingIntent pendingIntent =\n    PendingIntent.getBroadcast(MyActivity.this,\n\
  \                               REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n\n\
  final Icon icon = Icon.createWithResource(MyActivity.this,\n                   \
  \                      R.drawable.action_icon);\n\nRemoteAction remoteAction = new\
  \ RemoteAction(icon,\n                                             \"My Action Title\"\
  ,\n                                             \"My Action Description\",\n   \
  \                                          pendingIntent);\nactions.add(remoteAction);\n\
  \nPictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n  \
  \          .setActions(actions)\n            .build();\nsetPictureInPictureParams(params);\n\
  ```\n\n# 6.7 总结\n\n画中画模式是 Android 8.0 引入的一项多任务功能，专门设计用于允许在执行其他应用和 activity 任务时在窗口中继续视频播放。在使用\
  \ PiP 模式之前，必须首先在清单文件（manifest）中启用支持 PiP 的 activity。\n\nPiP 模式的行为通过 `PictureInPictureParams`\
  \ 类的实例进行配置，并通过从 activity 内部调用 `enterPictureInPictureMode()` 方法启动。在 PiP 模式下，应只显示视频播放，这要求隐藏任何其他用户界面元素，直到选择全屏模式。这些以及与其他模式切换相关的任务可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来完成。\n\n当用户点击画中画窗口时，PiP 操作将以图标的形式叠加在 PiP 窗口上。当选中时，这些操作会触发\
  \ activity 内部的行为。PiP 窗口使用广播接收器和等待意图来通知 activity 操作。\n\n# 77. Android 画中画教程\n\n接上一章节，本章将采用现有的\
  \ `VideoPlayer` 项目并对其增强，以添加画中画支持，包括检测 PiP 模式变化以及添加一个设计用于显示当前正在运行视频信息的 PiP 操作。\n\n\
  ## 77.1 在 Manifest 中添加画中画支持\n\n在 Android 应用项目中添加 PiP 支持的第一步是在项目的 Manifest 文件中启用它。打开\
  \ `manifests -> AndroidManifest.xml` 文件并修改 `activity` 元素以启用 PiP 支持：\n\n```xml\n\
  <activity\n    android:name=\".MainActivity\"\n    android:supportsPictureInPicture=\"\
  true\"\n    android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  \n    android:exported=\"true\">\n    <intent-filter>\n        <action android:name=\"\
  android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n    </intent-filter>\n</activity>\n```\n\n## 77.2 添加画中画按钮\n\n按照目前的设计，`VideoPlayer`\
  \ activity 的布局仅由 `VideoView` 实例组成。现在将向布局添加一个按钮以切换到 PiP 模式。将 `activity_main.xml`\
  \ 文件加载到布局编辑器中，从调色板拖入一个 `Button` 对象到布局中，使其位置如图 77-1 所示。\n\n![](img/as_video_pip_ui.jpg)\n\
  \n图 77-1\n\n将按钮上的文本更改为“Enter PiP Mode”，并将字符串提取为名为 `enter_pip_mode` 的资源。在继续下一步之前，将按钮的\
  \ ID 改为 `pipButton` 并配置 `onClick` 属性以调用名为 `enterPipMode` 的方法。\n\n## 77.3 进入画中画模式\n\
  \n现在必须将 `enterPipMode` onClick 回调添加到 `MainActivity.java` 文件中。找到该文件，在编辑器中打开并添加此方法：\n\
  \n```java\nimport android.app.PictureInPictureParams;\nimport android.util.Rational;\n\
  \npublic void enterPipMode(View view) {\n    Rational rational = new Rational(binding.videoView1.getWidth(),\n\
  \                                    binding.videoView1.getHeight());\n    PictureInPictureParams\
  \ params = new PictureInPictureParams.Builder()\n            .setAspectRatio(rational)\n\
  \            .build();\n    binding.pipButton.setVisibility(View.INVISIBLE);\n \
  \   binding.videoView1.setMediaController(null);\n    enterPictureInPictureMode(params);\n\
  }\n```\n\n该方法首先获取 `Button` 的引用，然后创建一个包含 `VideoView` 宽和高的 `Rational` 对象。随后使用 `PictureInPictureParams.Builder`\
  \ 创建一组画中画参数，并将 `Rational` 对象作为视频播放的宽高比例。由于在 PiP 模式下不需要显示按钮，因此将其设置为 `invisible`。\n\
  \n在运行 Android 8 或更高版本的设备或模拟器上编译并运行应用，等待视频播放开始后再点击 PiP 模式按钮。视频播放应该最小化并如图 77-2 所示出现在\
  \ PiP 窗口中：\n\n![](img/as_video_window.jpg)\n\n图 77-2\n\n点击 PiP 窗口，然后点击窗口中心出现的全屏模式标记。虽然\
  \ activity 返回了全屏模式，但按钮和媒体播放控件仍然隐藏。显然，必须在项目中添加代码来检测 PiP 模式变化的发生。\n\n## 77.4 检测画中画模式变化\n\
  \n如上一章所述，通过重写相关 activity 内部的 `onPictureInPictureModeChanged()` 方法可以检测 PiP 模式变化。在这种情况下，编写编写方法以检测\
  \ activity 是正在进入还是退出 PiP 模式，并采取相应行动重新激活 PiP 按钮和播放控件。在 `MainActivity.java` 文件中，现在添加此方法：\n\
  \n```java\n@Override\npublic void onPictureInPictureModeChanged(boolean isInPictureInPictureMode)\
  \ {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n    if\
  \ (isInPictureInPictureMode) {\n    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n\
  \        binding.videoView1.setMediaController(mediaController);\n    }\n}\n```\n\
  \n### 77.5 添加广播接收器\n\n\n\n\n\n项目的最后一步是为 PiP 窗口添加一个操作。该操作的目的是显示一个包含当前播放视频名称的 `Toast`\
  \ 消息。这需要在 PiP 窗口和活动（activity）之间进行通信。实现此点的最简单方法之一是在活动中实现一个 `broadcast receiver`（广播接收器），并使用\
  \ `pending intent`（挂起意图）从 PiP 窗口向活动广播消息。每当活动进入 PiP 模式时必须执行这些步骤，因此必须在 `onPictureInPictureModeChanged()`\
  \ 方法中添加代码。现在找到该方法并开始添加代码以创建一个 `intent filter`（意图过滤器）并初始化广播接收器：\n\n```java\nimport\
  \ android.content.BroadcastReceiver;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.IntentFilter;\nimport android.widget.Toast;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private BroadcastReceiver receiver;\n\
  \n    @Override\n    public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode)\
  \ {\n        super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n  \
  \      if (isInPictureInPictureMode) {\n            IntentFilter filter = new IntentFilter();\n\
  \            filter.addAction(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n   \
  \         receiver = new BroadcastReceiver() {\n                @Override\n    \
  \            public void onReceive(Context context, Intent intent) {\n         \
  \           Toast.makeText(context, \"Favorite Home Movie Clips\", Toast.LENGTH_LONG).show();\n\
  \                }\n            };\n            registerReceiver(receiver, filter,\
  \ Context.RECEIVER_EXPORTED);\n        } else {\n            binding.pipButton.setVisibility(View.VISIBLE);\n\
  \            binding.videoView1.setMediaController(mediaController);\n         \
  \   if (receiver != null) {\n                unregisterReceiver(receiver);\n   \
  \         }\n        }\n    }\n}\n```\n\n## 77.6 添加 PiP 操作\n\n实现广播接收器后，下一步是创建一个\
  \ `RemoteAction` 对象，并配置一个图像来表示 PiP 窗口中的操作。\n\n在本例中，将使用一个名为 `ic_info_24dp.xml` 的图像图标文件。该文件可以在从以下\
  \ URL 获取的源码下载压缩包的 `project_icons` 文件夹中找到：\nhttps://www.payloadbooks.com/product/iguanajava\n\
  \n找到此图标文件，将其复制并粘贴到 Project 工具窗口中的 `app -> res -> drawables` 文件夹中：\n\n![](img/as_video_pip_icon_added.jpg)\n\
  图 77-3\n\n下一步是创建一个将发送给广播接收器的 `Intent`。然后，需要将该意图封装在 `PendingIntent` 对象中，以便在用户点击 PiP\
  \ 窗口中的操作按钮时以后触发该意图。\n\n编辑 `MainActivity.java` 文件，添加一个方法来创建 `Intent` 和 `PendingIntent`\
  \ 对象如下：\n\n```java\nimport android.app.PendingIntent;\nimport static android.app.PendingIntent.FLAG_IMMUTABLE;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private static final\
  \ int REQUEST_CODE = 101;\n\n    private void createPipAction() {\n        Intent\
  \ actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n     \
  \   final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\
  \ REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    }\n}\n```\n\n现在 `Intent` 对象和\
  \ `PendingIntent` 实例都已创建，需要创建一个 `RemoteAction` 对象，其中包含将出现在 PiP 窗口中的图标和 `PendingIntent`。保留\
  \ `createPipAction()` 方法，添加如下代码：\n\n```java\nimport android.app.RemoteAction;\n\
  import android.graphics.drawable.Icon;\nimport java.util.ArrayList;\n\nprivate void\
  \ createPipAction() {\n    ArrayList<RemoteAction> actions = new ArrayList<>();\n\
  \    Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\
  \ REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    final Icon icon = Icon.createWithResource(MainActivity.this,\
  \ R.drawable.ic_info_24dp);\n    RemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\", \"Video Info\", pendingIntent);\n    actions.add(remoteAction);\n}\n\
  ```\n\n现在需要创建一个包含该操作的 `PictureInPictureParams` 对象并应用参数，以便该操作显示在 PiP 窗口内：\n\n```java\n\
  private void createPipAction() {\n    ArrayList<RemoteAction> actions = new ArrayList<>();\n\
  \    Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\
  \ REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    final Icon icon = Icon.createWithResource(MainActivity.this,\
  \ R.drawable.ic_info_24dp);\n    RemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\", \"Video Info\", pendingIntent);\n    actions.add(remoteAction);\n  \
  \  PictureInPictureParams params = new PictureInPictureParams.Builder()\n      \
  \      .setActions(actions)\n            .build();\n    setPictureInPictureParams(params);\n\
  }\n```\n\n在测试操作之前的最后一个任务是在活动进入 PiP 模式时调用 `createPipAction()` 方法：\n\n```java\n@Override\n\
  public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode) {\n\
  \    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n    registerReceiver(receiver,\
  \ filter);\n    createPipAction();\n} else {\n    binding.pipButton.setVisibility(View.VISIBLE);\n\
  \    binding.videoView1.setMediaController(mediaController);\n}\n```\n\n## 77.7\
  \ 测试画中画操作\n\n重新运行应用并将活动放入 PiP 模式。点击 PiP 窗口以显示新的操作按钮，如图 77-4 所示：\n\n![](img/as_video_pip_with_actions.jpg)\n\
  图 77-4\n\n点击操作按钮并等待 `Toast` 消息出现，显示视频名称：\n\n![](img/as_video_pip_toast.jpg)\n图 77-5\n\
  \n### 77.8 总结\n\n本章演示了如何在 Android Studio 项目中添加画中画（PiP）支持，包括启用和进入 PiP 模式以及实现 PiP\
  \ 操作。这包含了使用广播接收器和挂起意来实现 PiP 窗口与活动之间的通信。\n\n## 78. 使用 MediaPlayer 和 MediaRecorder\
  \ 进行 Android 录制和播放\n\n本章将提供 `MediaRecorder` 概述，并解释如何使用该类录制音频或视频。还将介绍使用 `MediaPlayer`\
  \ 类来播放音频。在介绍基础知识后，将创建一个示例应用程序来演示这些技术。除了处理音频和视频之外，本章还将涉及将文件保存到 SD 卡。\n\n### 78.1\
  \ 播放音频\n\n在音频播放方面，大多数 Android 实现支持 AAC LC/LTP、HE-AACv1（AAC+）、HE-AACv2（增强 AAC+）、AMR-NB、AMR-WB、MP3、MIDI、Ogg\
  \ Vorbis 以及 PCM/WAVE 格式。\n\n\n\n\n音频播放可以使用 `MediaPlayer` 或 `AudioTrack` 类来实现。`AudioTrack`\
  \ 是一个更高级的选项，它使用流式音频缓冲区并对音频提供更强大的控制。相比之下，`MediaPlayer` 类为实现音频播放提供了一个更易用的编程接口，能够满足大多数音频需求。\n\
  \n`MediaPlayer` 类关联了一系列方法，应用程序可以调用这些方法来执行特定任务。该类中一些关键方法的子集如下：\n\n- `create()` –\
  \ 被调用以创建该类的新实例，并传递要播放音频的 `Uri`。\n- `setDataSource()` – 设置音频播放的源。\n- `prepare()`\
  \ – 指令播放器准备开始播放。\n- `start()` – 开始播放。\n- `pause()` – 暂停播放。可以通过调用 `resume()` 方法恢复播放。\n\
  - `stop()` – 停止播放。\n- `setVolume()` – 接收两个浮点数参数，指定左、右声道的播放量。\n- `resume()` – 恢复之前暂停的播放会话。\n\
  - `reset()` – 重置媒体播放器实例的状态。本质上是将实例重置为未初始化状态。至少，重置后的播放器需要重新设置数据源并调用 `prepare()` 方法。\n\
  - `release()` – 在播放器实例不再需要时调用。此方法确保播放器持有的任何资源都被释放。\n\n在典型的实现中，应用程序将实例化 `MediaPlayer`\
  \ 类的实例，设置要播放的音频源，然后调用 `prepare()` 随后调用 `start()`。例如：\n\n```\nMediaPlayer mediaPlayer\
  \ = new MediaPlayer();\nmediaPlayer.setDataSource(\"https://www.yourcompany.com/myaudio.mp3\"\
  );\nmediaPlayer.prepare();\nmediaPlayer.start();\n```\n\n## 78.2 使用 MediaRecorder\
  \ 类录制音频和视频\n\n与音频播放一样，录制可以使用不同的技术实现。一种方案是使用 `MediaRecorder` 类，与 `MediaPlayer` 类一样，它提供了几个用于录制音频的方法：\n\
  \n- `setAudioSource()` – 指定录制的音频源（通常，对于设备麦克风将是 `MediaRecorder.AudioSource.MIC`）。\n\
  - `setVideoSource()` – 指定录制的视频源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n- `setOutputFormat()`\
  \ – 指定录制的音频或视频存储的格式（例如 `MediaRecorder.OutputFormat.AAC_ADTS`）。\n- `setAudioEncoder()`\
  \ – 指定录制音频的音频编码器（例如 `MediaRecorder.AudioEncoder.AAC`）。\n- `setOutputFile()` – 配置录制的音频或视频存储的文件路径。\n\
  - `prepare()` – 准备 `MediaRecorder` 实例开始录制。\n- `start()` – 开始录制过程。\n- `stop()` –\
  \ 停止录制过程。一旦录制机停止，在重启之前必须完全重新配置并准备。\n- `reset()` – 重置录制机。实例在重启之前需要完全重新配置并准备。\n- `release()`\
  \ – 应在录制机实例不再需要时调用。此方法确保实例持有的所有资源都被释放。\n\n使用该类的典型实现将设置源、输出、编码格式和输出文件。然后将调用 `prepare()`\
  \ 和 `start()` 方法。录制结束后将调用 `stop()` 方法，紧接着调用 `reset()` 方法。当应用程序不再需要录制机实例时，建议调用 `release()`\
  \ 方法：\n\n```\nMediaRecorder mediaRecorder = new MediaRecorder();\nmediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\nmediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\n\
  mediaRecorder.setOutputFile(audioFilePath);\nmediaRecorder.prepare();\nmediaRecorder.start();\n\
  ...\nmediaRecorder.stop();\nmediaRecorder.reset();\nmediaRecorder.release();\n```\n\
  \n要录制音频，应用程序的清单文件必须包含 `android.permission.RECORD_AUDIO` 权限：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n```\n\n正如在 Android 中进行运行时权限请求\
  \ 章节中概述的，访问麦克风属于“危险权限”范畴。因此，为了支持 Android 6，在应用程序启动时必须必须对麦克风访问提出特定请求，相关步骤将在本章稍后介绍。\n\
  \n### 78.3 关于示例项目\n\n本章的剩余部分将创建一个示例应用程序，演示如何使用 `MediaPlayer` 和 `MediaRecorder` 类在\
  \ Android 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能的应用程序时（以麦克风为例），在尝试在代码中访问它之前，检查该功能的可用性非常重要。因此，本章创建的应用程序还将包含检测设备上是否存在麦克风的代码。\n\
  \n完成后，该应用程序将提供一个直观的界面，允许用户录制和播放音频。录制的音频将存储在设备上的音频文件中。既然如此，本教程还将简要探索使用 SD 卡存储的机制。\n\
  \n## 78.4 创建 AudioApp 项目\n\n从欢迎界面选择 New Project（新建项目）选项，在出现的项目对话框中选择 Empty Views\
  \ Activity 模板，然后点击 Next（下一步）按钮。\n\n在 Name 字段中输入 `AudioApp` 并指定 `com.ebookrenzy.audioapp`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 API 31: Android 12.0 并将 Language\
  \ 设置为 Java。按照 11.8 将项目迁移到视图绑定 节中概述的步骤为项目添加视图支持。\n\n### 78.5 设计用户界面\n\n项目创建后，从 Project\
  \ 窗口中选择 `activity_main.xml` 文件，并在布局编辑器的 Design 模式下选择“Hello World!”TextView 并将其删除。\n\
  \n拖放三个 `Button` 视图到布局中。按钮的位置对本示例至关重要，但图 78-1 显示了建议的垂直布局。\n\n配置按钮显示 Play、Record 和\
  \ Stop 字符串资源，并分别赋予视图 ID `playButton`、`recordButton` 和 `stopButton`。\n\n选择 Play 按钮并在\
  \ Attributes 面中配置 `onClick` 属性，在用户选择时调用 `playAudio` 方法。重复这些步骤配置其他按钮调用 `recordAudio`\
  \ 和 `stopAudio` 方法。\n\nas_audio_app_ui.jpg\n图 78-1\n\n### 78.6 检查麦克风可用性\n\n在没有麦克风的设备上尝试录音会导致\
  \ Android 系统抛出异常。因此，在进行尝试之前检查麦克风的存在至关重要。实现这一点有多种方法，包括检查物理是否存在。另一种更容易且更可能适用于不同 Android\
  \ 设备的方法是询问 Android 系统是否安装了特定功能的包。这涉及到创建一个 Android `PackageManager` 类的实例，然后调用对象的\
  \ `hasSystemFeature()` 方法。在此案例中，`PackageManager.FEATURE_MICROPHONE` 是关注的功能。\n\n\n\
  \n\n\n在本示例中，我们将创建一个名为 `hasMicrophone()` 的方法，该方法会被调用以检查麦克风是否存在。在 Project 工具窗口中，找到并双击\
  \ `MainActivity.java` 文件，并对其进行修改以添加该方法：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\
  \nimport android.content.pm.PackageManager;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n    protected boolean hasMicrophone() {\n        PackageManager\
  \ pmanager = this.getPackageManager();\n        return pmanager.hasSystemFeature(\n\
  \                PackageManager.FEATURE_MICROPHONE);\n    }\n}\n```\n\n## 78.7 初始化\
  \ Activity\n\n下一步是修改 activity 以执行几项初始化任务。在 `MainActivity.java` 文件中，按照如下所示修改代码：\n\
  \n```java\npackage com.ebookfrenzy.audioapp;\n\nimport java.io.File;\nimport java.io.IOException;\n\
  import androidx.annotation.NonNull;\nimport android.media.MediaRecorder;\nimport\
  \ android.os.Environment;\nimport android.media.MediaPlayer; \n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ static MediaRecorder mediaRecorder;\n    private static MediaPlayer mediaPlayer;\n\
  \    private static String audioFilePath;\n    private boolean isRecording = false;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        audioSetup();\n    }\n\n    private\
  \ void audioSetup() {\n        if (!hasMicrophone()) {\n            binding.stopButton.setEnabled(false);\n\
  \            binding.playButton.setEnabled(false);\n            binding.recordButton.setEnabled(false);\n\
  \        } else {\n            binding.playButton.setEnabled(false);\n         \
  \   binding.stopButton.setEnabled(false);\n        }\n        File audioFile = new\
  \ File(this.getFilesDir(), \"myaudio.3gp\");\n        audioFilePath = audioFile.getAbsolutePath();\n\
  \    }\n}\n```\n\n添加的代码调用了 `hasMicrophone()` 方法来确定设备是否包含麦克风。如果没有，所有按钮都将被禁用；否则，只有\
  \ Stop 和 Play 按钮被禁用。\n\n下一行代码需要更多的解释：\n\n```java\nFile audioFile = new File(this.getFilesDir(),\
  \ \"myaudio.3gp\");\naudioFilePath = audioFile.getAbsolutePath();\n```\n\n此代码在应用的内部存储空间中创建一个名为\
  \ `myaudio.3gp` 的新文件，用于存储音频录音。\n\n## 78.8 实现 recordAudio() 方法\n\n当用户触摸 Record 按钮时，将调用\
  \ `recordAudio()` 方法。该方法需要开启和关闭相应的按钮，并为 `MediaRecorder` 实例配置信息，包括音频源、输出格式和编码，以及准备要存储音频的文件位置。最后，需要调用\
  \ `MediaRecorder` 对象的 `prepare()` 和 `start()` 方法。这些要求共同构成了 `MainActivity.java` 文件中的以下方法实现：\n\
  \n```java\npublic void recordAudio (View view) {\n    isRecording = true;\n    binding.stopButton.setEnabled(true);\n\
  \    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    try {\n        mediaRecorder = new MediaRecorder(this);\n        mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  \        mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.THREE_GPP);\n\
  \        mediaRecorder.setOutputFile(audioFilePath);\n        mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);\n\
  \        mediaRecorder.prepare();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n    mediaRecorder.start();\n}\n```\n\n## 78.9 实现 stopAudio() 方法\n\n`stopAudio()`\
  \ 方法启用 Play 按钮，关闭 Stop 按钮，然后停止并重置 `MediaRecorder` 实例。实现此目的的代码如下所示，并应添加到 `MainActivity.java`\
  \ 文件中：\n\n```java\npublic void stopAudio (View view) {\n    binding.stopButton.setEnabled(false);\n\
  \    binding.playButton.setEnabled(true);\n    if (isRecording) {\n        binding.recordButton.setEnabled(false);\n\
  \        mediaRecorder.stop();\n        mediaRecorder.release();\n        mediaRecorder\
  \ = null;\n        isRecording = false;\n    } else {\n        mediaPlayer.release();\n\
  \        mediaPlayer = null;\n        binding.recordButton.setEnabled(true);\n \
  \   }\n}\n```\n\n## 78.10 实现 playAudio() 方法\n\n`playAudio()` 方法将创建一个新的 `MediaPlayer`\
  \ 实例，将位于 SD 卡上的音频文件分配为数据源，然后准备并开始播放：\n\n```java\npublic void playAudio (View view)\
  \ throws IOException {\n    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    binding.stopButton.setEnabled(true);\n    mediaPlayer = new MediaPlayer();\n\
  \    mediaPlayer.setDataSource(audioFilePath);\n    mediaPlayer.prepare();\n   \
  \ mediaPlayer.start();\n}\n```\n\n### 78.11 配置并请求权限\n\n在测试应用程序之前，必须在清单文件中请求相应的权限。具体而言，应用程序需要访问麦克风的权限。在\
  \ Project 工具窗口中，找到并双击 `AndroidManifest.xml` 文件将其加载到编辑器，并修改 XML 以添加权限标签：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \ xmlns:tools=\"http://schemas.android.com/tools\">\n    <uses-permission android:name=\"\
  android.permission.RECORD_AUDIO\" />\n    <application\n```\n\n上述步骤将确保当应用程序安装在运行旧版本\
  \ Android 的设备上时启用麦克风访问权限。麦克风访问在 Android 中分类为危险权限，因为它可能会损害用户的隐私。为了让示例应用程序在 Android\
  \ 6 或更高版本的设备上运行，需要添加运行时请求权限的代码。\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和一个作为请求请求标识码的常量：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int RECORD_REQUEST_CODE\
  \ = 101;\n}\n```\n\n接下来，需要在类中添加一个方法，其目的是接收要请求的权限和相应的请求标识码。继续在 `MainActivity.java`\
  \ 类文件中，按如下所示实现该方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  \    }\n}\n```\n\n使用本书中“在 Android 中进行运行时权限请求”章节概述步骤，上述方法在发出请求之前会验证指定的权限是否已经授予，并将标识码作为参数传递。\n\
  \n当请求被处理后，将将在 activity 上调用 `onRequestPermissionsResult()` 方法，并传递标识码和请求结果。因此，下一步是在\
  \ `MainActivity.java` 文件中实现该方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {\n \
  \   super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  }\n```\n\n\n\n\n\n```\nif (requestCode == RECORD_REQUEST_CODE) {\n    if (grantResults.length\
  \ == 0\n            || grantResults[0] !=\n            PackageManager.PERMISSION_GRANTED)\
  \ {\n        binding.recordButton.setEnabled(false);\n        Toast.makeText(this,\n\
  \                    \"Record permission required\",\n                    Toast.LENGTH_LONG).show();\n\
  \    }\n}\n```\n\n上述代码通过检查请求标识符代码，在检查相应的权限是否授予之前，识别哪个权限请求已返回。如果权限被拒绝，将向用户显示一条消息，指示应用将无法运行并禁用录音按钮。\n\
  \n在测试应用之前，剩下的工作是在应用启动时调用新添加的 `requestPermission()` 方法来获取麦克风访问。在 `MainActivity.java`\
  \ 文件中，按照如下方式修改 `audioSetup()` 方法：\n\n```java\nprivate void audioSetup(){\n    binding.recordButton\
  \ = findViewById(R.id.recordButton);\n    binding.playButton = findViewById(R.id.playButton);\n\
  \    binding.stopButton = findViewById(R.id.stopButton);\n    if (!hasMicrophone())\n\
  \    {\n        stopButton.setEnabled(false);\n        playButton.setEnabled(false);\n\
  \        recordButton.setEnabled(false);\n    } else {\n        playButton.setEnabled(false);\n\
  \        stopButton.setEnabled(false);\n    }\n    File audioFile = new File(this.getFilesDir(),\
  \ \"myaudio.3gp\");\n    audioFilePath = audioFile.getAbsolutePath();\n    requestPermission(Manifest.permission.RECORD_AUDIO,\
  \ RECORD_REQUEST_CODE);\n}\n```\n\n### 测试应用程序\n在包含麦克风的 Android 设备上编译并运行应用，允许访问麦克风，并点击录音按钮。录制完成后，点击停止，然后点击播放。录制的音频应通过设备扬声器回放。\n\
  \n### 总结\nAndroid SDK 提供了多种实现音频录制和播放的机制。本章介绍了了其中两种：`MediaPlayer` 和 `MediaRecorder`\
  \ 类。在涵盖了使用这些技术的理论后，我们完成了一个设计用于录制并播放音频的示例。在开发 Android 时，我们还查看了确保设备运行的涉及步骤。\n\n###\
  \ 在 Android 中使用 Google Maps API\nGoogle 在多年前引入了一项地图服务，最终被称为 Google Maps 的第一个 Web\
  \ 端版本于 2005 年推出，当时 iPhone 尚未引发智能手机革命，而 Google 已经在开发 Android 操作系统好几个月。无论对 Google\
  \ Maps 的未来有何愿景，考虑到现在可以通过 Android 应用直接访问 Google Maps 的所有功能，是非常令人惊叹的。本旨在概述 Google\
  \ Maps 系统和 Google Maps API、不同元素、配置开发环境以与 Google Maps 工作的必要步骤，然后通过一些代码示例演示基础知识。\n\
  \n### Google Maps API 的元素\nGoogle Maps API 由一组核心类组成，这些类结合在一起为 Android 应用程序提供地图功能。地图的关键元素如下：\n\
  \n- `GoogleMap`：Google Maps API 的主类。该类负责下载和显示地图瓦片，并响应地图控制。`GoogleMap` 对象不是直接由应用程序创建的，而是在创建\
  \ `MapView` 或 `SupportMapFragment` 实例时创建的。在应用程序代码中，可以通过调用 `MapView`、`SupportMapFragment`\
  \ 或实例的 `getMap()` 方法获取 `GoogleMap` 对象的引用。\n- `MapView`：`View` 类的类，该类提供了绘制地图的视图画布，允许将地图放置在\
  \ Activity 的用户界面布局中。\n- `SupportMapFragment`：`Fragment` 类的子类，该类允许将地图放置在 Android\
  \ 布局中的 Fragment 中。\n- `Marker`：`Marker` 类的目的是允许在地图上标记位置。通过获取与地图关联的 `GoogleMap` 引用并调用该实例的\
  \ `addMarker()` 方法向地图添加标记。标记的位置通过 `Longitude`（经度）和 `Latitude`（纬度）定义。Marker 可以以多种方式配置，包括指定标题、文本和图标。Marker\
  \ 还可以配置为“可拖拽的”，允许用户将标记移动到地图上的不同位置。\n- `Shapes`：使用 `Polyline`、`Polygon` 和 `Circle`\
  \ 类在地图上绘制线条和形状。\n- `UiSettings`：`UiSettings` 类用于自定义在地图上显示哪些控件。例如，使用 `UiSettings`，应用程序可以控制缩放、当前位置和罗盘控件是否显示在地图上。该类还可以配置地图识别哪些触摸屏手势。\n\
  - `My Location Layer`（我的位置层）：启用时，`My Location Layer` 会在地图上显示一个按钮，当用户选择该按钮时，地图将居中于用户当前的地理位置。如果用户处于静态状态，蓝色标记代表地图上的此位置。如果用户在移动中，位置由一个指示用户行驶方向的箭头（chevron）表示。\n\
  \n熟悉 Google Maps API 的最佳方法是完成一个示例。本章的剩余部分将创建一个基于 Google Maps 的应用程序，同时突出 API 的关键领域。\n\
  \n### 创建 Google Maps 项目\n从欢迎屏幕选择 `New Project`（新建项目）选项，并在点击 `Next` 按钮之前出现的新项目对话框中选择\
