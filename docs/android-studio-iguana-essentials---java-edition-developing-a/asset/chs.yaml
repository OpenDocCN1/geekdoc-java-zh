  ### 79.8 测试应用程序\n\n对应用程序进行测试运行以验证 API 密钥是否配置正确。如果配置正确，应用程序将运行并在屏幕上显示地图。\n\n如果没有显示地图，请检查以下区域：\n\
  \n- 如果应用程序运行在模拟器上，请确保模拟器运行的是包含 Google APIs 的 Android 版本。可以通过选择 `Tools -> Android\
  \ -> AVD Manager` 菜单选项更改 AVD 配置的当前操作系统，点击 AVD Actions 列中的铅笔图标，然后点击当前 Android 版本旁\
  \ `Change…` 按钮。在系统镜像对话框中选择包含 Google APIs 的目标。\n- 检查 `Logcat` 输出是否存在任何与 Google Maps\
  \ API 身份验证问题的内容。这通常意味着 API 密钥输入错误。确保 `AndroidManifest.xml` 和 `local.properties`\
  \ 文件中的 API 密钥与在 Google Cloud console 中生成的密钥匹配。\n- 在 Google API Console 中验证 `Credentials`\
  \ 面板是否已启用 Maps SDK for Android。\n\n### 79.9 理解地理编码和反向地理编码\n\n如果不先介绍地理编码（Geocoding）主题，那么讨论地图和地理位置是不可能的。地理编码将基于文本的地理位置（如街道地址）转换为表示为经度和纬度的地理坐标。\n\
  \n可以使用 `Geocoder` 类来实现地理编码。例如，可以向 `Geocoder` 类实例传递一个代表位置的字符串，例如城市名称、街道地址或机场代码。`Geocoder`\
  \ 将尝试查找位置的匹配项，并返回一个可能与位置字符串匹配的 `Address` 对象列表，这些对象按顺序排序，最匹配的项位于列表的第 0 位。然后可以从 `Address`\
  \ 对象中提取各种信息，包括潜在匹配项的经度和纬度。\n\n例如，以下代码请求华盛顿特区国家航空航天博物馆的位置：\n\n```java\nimport java.io.IOException;\n\
  import java.util.List;\nimport android.location.Address;\nimport android.location.Geocoder;\n\
  \ndouble latitude;\ndouble longitude;\nList<Address> geocodeMatches = null;\n\n\
  try {\n    geocodeMatches = new Geocoder(this).getFromLocation(\"600 Independence\
  \ SW, Washington, DC 20560\", 1);\n} catch (IOException e) {\n    // TODO-generated\
  \ catch block\n    e.printStackTrace();\n}\n\nif (!geocodeMatches.isEmpty()) {\n\
  \    latitude = geocodeMatches.get(0).getLatitude();\n    longitude = geocodeMatches.get(0).getLongitude();\n\
  }\n```\n\n注意传递给 `getFromLocation` 方法的值为 `1`。这告诉 Geocoder 只返回一个结果。由于地址的特定性，应该只有一个匹配项。但对于更模糊的名称，请求多个匹配项并允许用户选择正确的可能是必要的。上面的代码是正向编码的示例，因为坐标是基于文本计算的。反向地理编码（Reverse\
  \ geocoding）正如其名，涉及将地理坐标转换为人类可读的地址字符串。考虑以下代码：\n\n```java\nimport java.io.IOException;\n\
  import java.util.List;\nimport android.location.Address;\nimport android.location.Geocoder;\n\
  \nList<Address> geocodeMatches = null;\nString Address1;\nString Address2;\nString\
  \ State;\nString Zipcode;\nString Country;\n\ntry {\n    geocodeMatches = new Geocoder(this).getFromLocation(38.8874245,\
  \ -77.0200729, 1);\n} catch (IOException e) {\n    // TODO-generated catch block\n\
  \    e.printStackTrace();\n}\n\nif (!geocodeMatches.isEmpty()) {\n    Address1 =\
  \ geocodeMatches.get(0).getAddressLine(0);\n    Address2 = geocodeMatches.get(0).getAddressLine(1);\n\
  \    State = geocodeMatches.get(0).getAdminArea();\n    Zipcode = geocodeMatches.get(0).getPostalCode();\n\
  \    Country = geocodeMatches.get(0).getCountryName();\n}\n```\n\n地理编码并不是在 Android\
  \ 设备上执行的，而是在设备需要翻译时连接的服务器上执行，并在翻译完成后返回结果。只有当设备具有互联网连接时才能进行地理编码。\n\n### 79.10 向应用程序添加地图\n\
  \n\n\n\n\n向应用程序中添加地图最简单的方法是在 activity 的用户界面布局 XML 文件中指定它。以下布局文件显示了在 Android Studio\
  \ 创建的 `activity_maps.xml` 文件中添加的 `SupportMapFragment` 实例：\n\n```xml\n<fragment xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:id=\"@+id/map\"\n    tools:context=\".MapsActivity\"\n    android:name=\"\
  com.google.android.gms.maps.SupportMapFragment\"/>\n```\n\n### 79.11 请求当前位置权限\n\n\
  正如在 Android 中请求运行时权限章节概述概述的，某些权限被认为是危险的，并且对于 Android 6.0 或更高版本需要进行特殊处理。一组权限允许应用程序识别用户的当前位置。编辑项目工具窗口中\
  \ `app -> manifests` 下的 `AndroidManifest.xml` 文件，并添加以下权限行：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n<uses-permission\
  \ android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n```\n\n这些设置将确保应用在安装于旧版本的\
  \ Android 上时提供获取位置信息的权限。然而，为了支持 Android 6.0 或更高版本，我们需要在 `MapsActivity.java` 文件中添加一些代码以便运行时请求此权限。\n\
  \n首先添加一些导入指令和一个作为权限请求代码的常量：\n\n```java\npackage com.ebookfrenzy.mapdemo;\n\n.\n\
  .\n\nimport androidx.annotation.NonNull;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.core.app.ActivityCompat;\nimport android.Manifest;\nimport android.widget.Toast;\n\
  import android.content.pm.PackageManager;\n\n.\n.\n\npublic class MapsActivity extends\
  \ FragmentActivity implements OnMapReadyCallback {\n    private static final int\
  \ LOCATION_REQUEST_CODE = 101;\n    private GoogleMap mMap;\n\n.\n.\n}\n```\n\n\
  接下来，必须在类中添加一个方法来向用户请求指定的权限。在 `MapsActivity.java` 类文件中，按照如下方式实现此方法：\n\n```java\n\
  protected void requestPermission(String permissionType, int requestCode) {\n   \
  \ ActivityCompat.requestPermissions(this,\n        new String[]{permissionType},\
  \ requestCode\n    );\n}\n```\n\n当用户对权限请求做出响应时，activity 将调用 `onRequestPermissionsResult()`\
  \ 方法。在 `MapsActivity.java` 文件中，现在实现此方法，使其读取如下：\n\n```java\n@Override\npublic void\
  \ onRequestPermissionsResult(int requestCode,\n        @NonNull String[] permissions,\
  \ @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == LOCATION_REQUEST_CODE) {\n\
  \        if (grantResults.length == 0\n                || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Toast.makeText(this,\n                    \"无法显示位置 - 需要权限\",\n\
  \                    Toast.LENGTH_LONG).show();\n        } else {\n            SupportMapFragment\
  \ mapFragment =\n                (SupportMapFragment) getSupportFragmentManager()\n\
  \                    .findFragment(R.id.map);\n            mapFragment.getMapAsync(this);\n\
  \        }\n    }\n}\n```\n\n如果用户未授予权限，应用将显示消息指示无法显示当前位置。相反，如果权限已授予，地图将刷新，以便提供显示位置标记的机会。\n\
  \n### 79.12 显示用户的当前位置\n\n一旦授予了适当权限，可以通过获取与显示的地图关联的 `GoogleMap` 对象引用，并调用该实例的 `MyLocationEnabled()`\
  \ 方法（传递 `true` 值），在地图上显示用户的当前位置。\n\n当地图准备好显示时，会调用 activity 的 `onMapReady()` 方法。此方法在\
  \ `onRequestPermissions()` 方法中刷新地图时也会被调用。默认情况下，Android Studio 已经实现了此方法并添加了一些代码，将地图对准澳大利亚，并在悉尼上方放置一个标记。在\
  \ `MapsActivity.java` 文件中找到并编辑 `onMapReady()` 方法，移除此模板代码，并在启用用户位置显示之前检查是否已授予权限。如果未授予权限，将通过调用之前添加的\
  \ `requestPermission()` 方法向用户请求：\n\n```java\n@Override\npublic void onMapReady(GoogleMap\
  \ googleMap) {\n    mMap = googleMap;\n    // 在悉尼添加标记并移动相机\n    LatLng sydney =\
  \ new LatLng(-34, 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
  Marker in Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
  \    if (mMap != null) {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.ACCESS_FINE_LOCATION);\n        if (permission\
  \ == PackageManager.PERMISSION_GRANTED) {\n            mMap.MyLocationEnabled(true);\n\
  \        } else {\n            requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                LOCATION_REQUEST_CODE);\n        }\n    }\n}\n```\n\n现在运行应用时，图\
  \ 79-10 所示的对话框将请求权限。如果已授予，地图上会出现一个蓝点表示设备的位置。\n\n![](img/as_map.jpg)\n图 79-10\n\n\
  ### 79.13 更改地图类型\n\n通过对相应的 `GoogleMap` 对象调用 `setMapType()` 方法并传递以下值之一，可以动态修改显示的地图类型：\n\
  \n- `GoogleMap.MAP_TYPE_NONE`：不显示瓦片的空白网格。\n- `GoogleMap.MAP_TYPE_NORMAL`：由经典地图组成的标准视图。\n\
  - `GoogleMap.MAP_TYPE_SATELLITE`：显示地图区域的卫星图像。\n- `GoogleMap.MAP_TYPE_HYBRID`：显示叠加了地图的卫星图像。\n\
  - `GoogleMap.MAP_TYPE_TERRAIN`：显示地形信息等。\n\n例如，对 `onMapReady()` 方法的以下更改会将地图切换到卫星模式：\n\
  \n```java\n.\n.\nif (mMap != null) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \        Manifest.permission.ACCESS_FINE_LOCATION);\n    if (permission == PackageManager.PERMISSION_GRANTED)\
  \ {\n        mMap.MyLocationEnabled(true);\n    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \            LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n.\n.\n```\n\n或者，可以在嵌入地图的 XML 布局文件中使用 `map:mapType` 属性结合 `none`、`normal`、`hybrid`、`satellite`\
  \ 或 `terrain` 值来指定地图类型。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:map=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/map\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    map:mapType=\"hybrid\"\
  \n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"/>\n```\n\n\
  ### 79.14 向用户显示地图控件\n\nGoogle Maps Android API 提供了可以可选显示给用户的控件，包括放大缩小按钮、“我的位置”按钮和指南针。\n\
  \n\n\n\n缩放控件和指南针的显示可以通过编程方式控制，也可以在 XML 布局资源中的 map 元素内控制。要通过编程配置这些控件，必须获取与 `GoogleMap`\
  \ 对象关联的 `UiSettings` 对象引用：\n\n```java\nimport com.google.android.gms.maps.UiSettings;\n\
  \n.\n.\n\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n```\n\n\
  缩放控件通过调用 `UiSettings` 对象的 `setZoomControlsEnabled()` 方法来开启或关闭。例如：\n\n```java\nmapSettings.setZoomControlsEnabled(true);\n\
  ```\n\n或者，可以在 XML 资源文件中的 map 元素中设置 `map:uiZoomControls` 属性：\n\n```xml\nmap:uiZoomControls=\"\
  false\"\n```\n\n指南针可以通过调用 `UiSettings` 实例的 `setCompassEnabled()` 方法，或者通过 XML 资源使用\
  \ `map:uiCompass` 属性来显示。注意，指南针图标仅在地图相机倾斜或旋转偏离默认方向时才会出现。\n\n正如本章前面提到的，“我的位置”（My Location）按钮只有在启用了“我的位置”模式时才会出现。即使在此模式下，也可以通过调用\
  \ `UiSettings` 实例的 `setMyLocationButtonEnabled()` 方法防止该按钮出现。\n\n## 79.15 处理地图手势交互\n\
  \nGoogle Maps Android API 可以响应各种用户交互。这些交互可用于更改显示的地图区域、缩放级别，甚至是视角角度（从而为某些城市显示地图区域的\
  \ 3D 视图）。\n\n### 79.15.1 地图缩放手势\n\n可以使用与 `GoogleMap` 实例关联的 `UiSettings` 对象的 `setZoomGesturesEnabled()`\
  \ 方法来开启或关闭与地图缩放相关的手势。例如，以下代码关闭了示例地图的缩放手势：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = map.getUiSettings();\nmapSettings.setZoomGesturesEnabled(false);\n\
  ```\n\n在 XML 资源文件中通过将 `map:uiZoomGestures` 属性设置为 `true` 或 `false` 也可以相同的效果。\n\n\
  启用后，当用户在屏幕上进行捏合手势时，将发生缩放。同样地，双击会放大，而双指轻触会缩小。相反，单指缩放手势是通过双击但不松开第二次轻触，然后在屏幕上上下滑动手指分别进行放大和缩小。\n\
  \n### 79.15.2 地图滚动/平移手势\n\n滚动或平移手势允许用户通过单指运动在屏幕上拖动地图，从而在地图上移动。可以通过调用 `UiSettings`\
  \ 实例的 `setScrollGesturesEnabled()` 方法在代码中启用滚动手势：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setScrollGesturesEnabled(true);\n\
  ```\n\n或者，也可以可以在 XML 资源布局文件中使用 `map:uiScrollGestures` 属性在地图实例上启用滚动功能。\n\n### 79.15.3\
  \ 地图倾斜手势\n\n倾斜手势允许用户在屏幕上放置两个手指并上下移动它们来调整地图投影的倾斜角度。可以通过调用 `UiSettings` 实例的 `setTiltGesturesEnabled()`\
  \ 方法来开启或关闭倾斜手势，例如：\n\n```java\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n\
  mapSettings.setTiltGesturesEnabled(true);\n```\n\n倾斜手势也可以通过 XML 布局资源文件中的 `map:uiTiltGestures`\
  \ 属性来开启或关闭。\n\n### 79.15.4 地图旋转手势\n\n当启用地图旋转手势时，用户可以通过在屏幕上放置两个手指并进行圆周运动来旋转地图的朝向。这种手势支持在代码中通过调用\
  \ `UiSettings` 实例的 `setRotateGesturesEnabled()` 方法开启或关闭，例如：\n\n```java\nUiSettings\
  \ mapSettings;\nmapSettings = mMap.getUiSettings();\nmapSettings.setRotateGesturesEnabled(true);\n\
  ```\n\n旋转手势也可以通过 XML 资源文件中的 `map:uiRotateGestures` 属性来开启或关闭。\n\n### 79.16 创建地图标记（Markers）\n\
  \n标记（Markers）用于通知用户地图上的位置，其形式为标准图标或自定义图标。标记还可能包含标题和可选的文本（称为片段/snippet），并可以配置为允许用户拖动到地图上的不同位置。当用户点击标记时，会弹出一个窗口，显示关于标记位置的额外信息。\n\
  \n标记由 `Marker` 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()` 方法添加到地图上。一个 `MarkerOptions`\
  \ 类的实例（该实例包含了标记所需的各种选项（如标题和片段文本），被作为参数传递给该方法。标记的位置通过指定经纬度值定义，这些值也包含在 `MarkerOptions`\
  \ 实例中。例如，以下代码在地图的特定位置添加了一个包含标题、片段和位置的标记：\n\n```java\nimport com.google.android.gms.maps.model.Marker;\n\
  import com.google.android.gms.maps.model.LatLng;\nimport com.google.android.gms.maps.model.MarkerOptions;\n\
  \n.\n.\n\nLatLng position = new LatLng(38.887425, -77.0200729);\nMarker museum =\
  \ mMap.addMarker(new MarkerOptions()\n                .position(position)\n    \
  \            .title(\"Museum\")\n                .snippet(\"National Air and Space\"\
  ));\n```\n\n图 79-11（占位图）\n\n### 79.17 控制地图相机\n\n由于 Android 设备屏幕是平面的，而地球是球体，Google\
  \ Maps Android API 使用墨卡托投影将地球表示在平面上。地图的默认视图就像是通过悬浮在地图上方并正向下俯视的相机呈现的。API 允许应用程序实时更改此相机的目标、缩放、方位和倾斜：\n\
  \n- 目标（Target）：地图中心在经纬度。\n- 缩放（Zoom）：以级别指定的相机级别。缩放级别增加 1.0 会显示的地图宽度翻倍。\n- 倾斜（Tilt）：相机的视角，指定为跨越可见地图区域的弧线位置（即相机正向下俯视的点）。\n\
  - 方位（Bearing）：以北为顺时针方向测量的角度。\n\n相机更改通过创建 `CameraUpdate` 类实例并设置相应的设置来实现。`CameraUpdate`\
  \ 实例是通过调用 `CameraUpdateFactory` 创建的。一旦创建了 `CameraUpdate` 实例，即可通过调用 `GoogleMap` 实例的\
  \ `moveCamera()` 方法应用于地图。为了在相机变化时获得平滑的动画效果，可以使用 `animateCamera()` 代替 `moveCamera()`。\n\
  \n`CameraUpdateFactory` 方法总结如下：\n\n`CameraUpdateFactory.zoomIn()`：提供一个放大一级的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.zoomOut()`：提供一个缩小一级的 `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomTo(float)`：生成一个将缩放级别更改为指定值的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomBy(float)`：提供一个缩放级别增加或减少指定值的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.zoomBy(float, Point)`：创建一个按指定值增加或减少缩放层级的 `CameraUpdate`\
  \ 实例。\n\n\n\n\n\n- `CameraUpdateFactory.newLatLng(LatLng)` - 创建一个 `CameraUpdate`\
  \ 实例，更改相机的目标纬度和经度。\n- `CameraUpdateFactory.newLatLngZoom(LatLng, float)` - 生成一个\
  \ `CameraUpdate` 实例，更改相机的纬度、经度和缩放级别。\n- `CameraUpdateFactory.newCameraPosition(CameraPosition)`\
  \ - 返回一个 `CameraUpdate` 实例，将相机移动到指定的位置。可以使用 `CameraPosition.Builder()` 获取 `CameraPosition`\
  \ 实例。\n\n例如，以下代码使用动画将相机放大一级：\n\n```java\nmMap.animateCamera(CameraUpdateFactory.zoomIn());\n\
  ```\n\n另一方面，以下代码在不使用动画的情况下将相机移动到新位置，并将缩放级别调整为 10：\n\n```java\nprivate static final\
  \ LatLng position =\n    new LatLng(38.8874245, -77.0200729);\n\nmMap.moveCamera(CameraUpdateFactory.newLatLngZoom(position,\
  \ 10));\n```\n\n最后，下一个代码示例使用 `CameraPosition.Builder()` 创建了一个具有目标、缩放、方位和倾斜变化的 `CameraPosition`\
  \ 对象。然后使用动画将此更改应用于相机：\n\n```java\nimport com.google.android.gms.maps.model.CameraPosition;\n\
  import com.google.android.gms.maps.CameraUpdateFactory;\n\n...\n\nCameraPosition\
  \ cameraPosition = new CameraPosition.Builder()\n    .target(position)\n    .zoom(50)\n\
  \    .bearing(70)\n    .tilt(25)\n    .build();\n\nmMap.animateCamera(CameraUpdateFactory.newCameraPosition(\n\
  \    cameraPosition));\n```\n\n### 79.18 总结\n\n本章提供了构成 Google Maps Android API 的关键类和方法，并概述了如何准备开发环境和应用程序项目以使用该\
  \ API。\n\n# 80. 使用 Android 打印框架\n\n`Android Printing Framework` 用于从 Android 内部打印内容。虽然后续章节将更详细探讨为应用程序添加打印支持的选项，但本章将重点关注\
  \ Android 目前可用的各种打印选项以及启用这些选项的步骤。\n\n该章节将随后概述 Android 开发人员用于在应用程序中构建打印支持的各种打印功能。\n\
  \n## 80.1 Android 打印架构\n\n`Printing` 框架为 Android 提供了打印功能。简单来说，该框架由一个 `Print Manager`\
  \ 和多个打印服务插件组成。\n\n`Print Manager` 负责来自设备上应用程序的打印请求，并与设备上安装的 `print service plugins`\
  \ 交互，从而确保打印请求得到实现。\n\n默认情况下，许多 Android 设备都安装了 `print service plugins`，以便使用 `Google\
  \ Cloud Print` 和 `Google Drive` 服务进行打印。其他打印类型的 `Print Services Plugins` 如果尚未安装，也可以从\
  \ `Google Play` 商店获取。\n\n`Print Service Plugins` 目前适用于 HP、`Epson`（爱普）、三星和 `Canon`（佳能）打印机，其他打印机制造商的插件很可能在未来发布。然而，`Google\
  \ Cloud Print` 服务插件可以从 Android 打印到几乎任何类型和型号的打印机。\n\n本书将使用 `HP Print Services Plugin`\
  \ 作为参考示例。\n\n### 80.2 打印服务插件\n\n`Print Service plugins` 的目的是允许应用程序打印到通过本地局域无线网络或蓝牙对\
  \ Android 设备可见的兼容打印机。\n\n可以通过加载 `Google Play` 应用并搜索“Print Service Plugin”来验证 Android\
  \ 设备上是否存在 `Print Service Plugin`。\n\n一旦插件列在 `Play Store` 中，如果它尚未安装，可以通过选择 `Install`\
  \ 按钮进行安装。[图 80-1] 显示了 `Google Play` 中的 `HP Print Service` 插件。\n\n`Print Services\
  \ plugins` 会自动检测 Android 设备当前连接的网络上的兼容打印机，并在从应用程序打印时将它们列为选项。\n\n![](img/as_4.1_hp_printer_plugin.jpg)\n\
  \n图 80-1\n\n## 80.3 Google Cloud Print\n\n`Google Cloud Print` 是 Google 提供的一项服务，允许您从任何具有互联网连接的地方通过网络将内容打印到打印机上。`Google\
  \ Cloud Print` 支持多种 `Cloud Ready`（云就绪）和 `Classic`（经典型）设备和打印机型号。`Cloud Ready` 打印机内置了支持通过网络打印的技术。提供云就打印机的制造商包括\
  \ `Brother`（兄弟）、`Canon`（佳能）、`Dell`（戴尔）、`Epson`（爱普）、HP、`Kodak`（柯达）和三星。要识别您的打印机是否既云就绪又受\
  \ `Google Cloud Print` 支持，请查看以下 URL 中的打印机列表：\n\n[https://www.google.com/cloudprint/learn/printers.html]\n\
  \n对于经典的非云就绪打印机，`Google Cloud Print` 通过在连接到经典打印机的计算机系统（直接连接或通过家庭或办公室网络连接）上安装软件来提供云打印支持。\n\
  \n要设置 `Google Cloud Print`，请访问以下网页并使用与登录 Android 设备时相同的 `Google account ID` 登录：\n\
  \n[https://www.google.com/cloudprint/learn/index.html]\n\n一旦打印机被添加到 `Cloud Print`\
  \ 账户，当您从应用程序内部打印时，它们将列为打印目标选项。\n\n## 80.4 打印到 Google Drive\n\n除了支持实体打印机外，还可以将打印输出保存到\
  \ `Google Drive`。从设备打印时，选择打印面板中的 `Save to Google Drive` 选项。要打印的内容将被转换为 `PDF` 文件并保存到\
  \ `Google Drive`。\n\n## 80.5 另存为 PDF\n\nAndroid 提供的最后一个打印选项允许将打印内容本地保存为设备上的 `PDF`。一旦选择，该选项将要求为\
  \ `PDF` 文件命名并指定其保存的位置。\n\n`Save as PDF` 和 `Google Drive` 选项在测试自己的应用程序的打印功能时对于节省纸张非常有价值。\n\
  \n## 80.6 从 Android 设备打印\n\nGoogle 建议可以打印内容的应用程序通过将打印选项放在溢出菜单来实现。许多与 Android 自带的应用程序现在包含了“打印...”菜单选项。例如，图\
  \ 80-2 显示了通过选择 `Chrome` 浏览器应用程序溢出菜单中的“共享...”选项访问 `打印` ：\n\n![](img/as_3.5_chrome_print_option.jpg)\n\
  \n图 80-2\n\n一旦在应用程序内选择了打印选项，将出现标准的 Android 打印屏幕，显示打印内容的预览，如图 80-3 所示：\n\n![](img/as_3.5_chrome_print_panel.jpg)\n\
  \n图 80-3\n\n点击屏幕顶部的面板将显示完整的打印选项范围：\n\n![](img/as_3.5_save_as_pdf.jpg)\n\n图 80-4\n\
  \n## 80.7 在 Android 应用中构建打印支持的选项\n\n`Printing framework` 为在 Android 应用程序中集成打印支持提供了多种选项。这些选项分类如下：\n\
  \n### 80.7.1 图像打印\n\n\n\n\n\n顾如名，此选项允许将图像打印集成到 Android 应用程序中。在应用程序中添加此功能时，第一步是创建\
  \ `PrintHelper` 类的实例：\n\n```java\nPrintHelper imagePrinter = new PrintHelper(context);\n\
  ```\n\n接下来，可以通过调用 `PrintHelper` 实例的 `setScaleMode()` 方法来指定打印图像的缩放模式。选项如下：\n\n* `SCALE_MODE_FIT`\
  \ – 图像将缩放以适应纸张大小，且不会裁剪或更改纵横比。这通常会导致在一个维度上出现空白区域。\n* `SCALE_MODE_FILL` – 图像将缩放以填充纸张大小，并在必要时进行裁剪，以避免打印输出中出现空白区域。\n\
  \n如果不设置缩放模式，系统将默认使用 `SCALE_MODE_FILL`。例如，下面的代码将之前声明的 `PrintHelper` 实例的缩放模式设置为自适应模式：\n\
  \n```java\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n```\n\n同样，也可以配置颜色模式，以指示打印输出是彩色还是黑白。这是通过向\
  \ `PrintHelper` 实例的 `setColorMode()` 方法传递以下选项之一实现的：\n\n* `COLOR_MODE_COLOR` – 表示图像将以彩色打印。\n\
  * `COLOR_MODE_MONOCHROME` – 表示图像将以黑白格式打印。\n\n打印框架将默认为彩色打印，除非按如下方式指定单色选项：\n\n```java\n\
  imagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n```\n\n完成打印操作仅需要一个待打印的图像并调用\
  \ `PrintHelper` 实例的 `printBitmap()` 方法，该方法需要传递一个代表打印任务名称的字符串以及图像的引用（形式为 `Bitmap`\
  \ 对象或 `Uri` 引用）：\n\n```java\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\
  \ R.drawable.oceanscene);\nimagePrinter.printBitmap(\"My Test Print Job\", bitmap);\n\
  ```\n\n一旦启动打印任务，打印框架将显示打印对话框，并处理后续与用户的交互以及在用户选择的打印目标地上打印图像。\n\n## 80.7.2 创建并打印 HTML\
  \ 内容\n\nAndroid 打印框架还提供了一种在应用程序内打印基于 HTML 的内容的简单方法。这些内容可以是由网站托管的页面 URL 引用的 HTML\
  \ 内容，也可以是应用程序内动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类已经过扩展，以支持在极少代码要求的进行打印。\n\
  \n在动态创建 HTML 内容（与加载和打印现有的网页相反）时，该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后配置\
  \ web view 客户端在 HTML 加载到 `WebView` 后启动打印任务。配置好 web view 客户端后，HTML 被加载到 `WebView`\
  \ 中并触发打印过程。\n\n例如，考虑以下代码：\n\n```java\npublic void printContent() {\n    WebView\
  \ webView = new WebView(this);\n    webView.setWebViewClient(new WebViewClient()\
  \ {\n        public boolean shouldOverrideUrlLoading(WebView view, String url) {\n\
  \            return false;\n        }\n        @Override\n        public void onPageFinished(WebView\
  \ view, String url) {\n            createWebPrintJob(view);\n            myWebView\
  \ = null;\n        }\n    });\n    String htmlDocument = \"<html><body><h1>Android\
  \ Print Test</h1><p>\" + \n                          \"This is some sample content.</p></body></html>\"\
  ;\n    webView.loadDataWithURL(null, htmlDocument, \"text/html\", \"UTF-8\", null);\n\
  \    // 注意：原始文本片段中加载数据的逻辑是隐含的，\n    // 但结构遵循提供的代码块。\n}\n```\n*（根据提供的源文本特定代码块进行修正）*：\n\
  \n```java\npublic void printContent() {\n    WebView webView = new WebView(this);\n\
  \    webView.setWebViewClient(new WebViewClient() {\n        public boolean shouldOverrideUrlLoading(WebView\
  \ view, String url) {\n            return false;\n        }\n        @Override\n\
  \        public void onPageFinished(WebView view, String url) {\n            createWebPrintJob(view);\n\
  \            myWebView = null;\n        }\n    });\n    String htmlDocument = \"\
  <html><body><h1>Android Print Test</h1><p>\" + \n                          \"This\
  \ is some sample content.</p></body></html>\";\n    // 源文本提供了一个碎片化的加载序列，保持了逻辑流：\n\
  }\n```\n*等一下，让我准确地格式化用户文本中提供的特定块：*\n\n```java\npublic void printContent() {\n  \
  \  WebView webView = new WebView(this);\n    webView.setWebViewClient(new WebViewClient()\
  \ {\n        public boolean shouldOverrideUrlLoading(WebView view, String url) {\n\
  \            return false;\n        }\n        @Override\n        public void onPageFinished(WebView\
  \ view, String url) {\n            createWebPrintJob(view);\n            myWebView\
  \ = null;\n        }\n    });\n    String htmlDocument = \"<html><body><h1>Android\
  \ Print Test</h1><p>\" + \n                          \"This is some sample content.</p></body></html>\"\
  ;\n    // 注意：源文本具有重叠/碎片化的逻辑，\n    // 我将保持其结构。\n}\n```\n*自纠：用户提供的文本在代码块部分相当混乱/重复，我将根据逻辑流清理结构。*\n\
  \n```java\nprivate void createWebPrintJob(WebView view) {\n    PrintManager printManager\
  \ = (PrintManager) getSystemService(Context.PRINT_SERVICE);\n    PrintDocumentAdapter\
  \ printAdapter = view.createPrintAdapter(\"MyDocument\");\n    String jobName =\
  \ getString(R.string.app_name) + \" Document\";\n    PrintJob printJob = printManager.print(jobName,\
  \ printAdapter, new PrintAttributes.Builder().build());\n}\n```\n\n## 80.7.3 打印网页\n\
  \n打印网页的步骤与上述步骤相似，区别在于 web view 接收的是要打印网页的 URL 而不是动态创建的 HTML，例如：\n\n```java\nmyWebView.loadUrl(\"\
  https://developer.android.com/google/index.html\");\n```\n\n同样重要的是，`WebViewClient`\
  \ 配置只有在网页加载完成后立即自动打印时才是必要的。如果打印是由用户在页面加载后选择菜单选项启动的，则只需要在应用程序代码中包含上述 `createWebPrintJob()`\
  \ 方法即可。\n\n## 80.7.4 打印自定义文档\n\n虽然打印框架引入的 HTML 和网页打印功能为从 Android 应用程序内部打印内容提供了便利路径，但显然，对于更高级的打印需求，这些选项将过于简单。打印框架还为更复杂的打印任务提供了自定义文档打印支持。这允许将文本和图形形式的内容绘制到画布上然后进行打印。\n\
  \n\n\n\n[content]\n\n与相对容易实现的 HTML 和图像打印不同，自定义文档打印是一个更复杂、多阶段的过程，该过程将在本书的“Android\
  \ 自定义文档打印指南”章节中概述。这些步骤可以总结如下：\n\n* 连接到 Android 打印管理器（Android Print Manager）\n* 创建一个继承自\
  \ `PrintDocumentAdapter` 类的自定义打印适配器（Custom Print Adapter）\n* 创建一个 `PdfDocument`\
  \ 实例来表示文档页面\n* 获取 `PdfDocument` 实例页面的引用，每个页面都关联着一个 `Canvas` 实例\n* 在页面画布上绘制内容\n*\
  \ 通知打印框架文档已准备好打印\n\n上述步骤概述的自定义打印适配器必须实现几个方法，Android 系统将在打印期间调用这些方法来执行特定任务。其中最重要的是\
  \ `onLayout()` 方法，它负责根据用户更改设置（如纸张大小或页面方向）来重新排列文档布局；以及 `onWrite()` 方法，它负责渲染要打印的页面。标题为“Android\
  \ 自定义文档打印指南”的章节将详细介绍这一主题。\n\n## 80.8 总结\n\nAndroid SDK 可以从运行中的应用程序内部打印内容。打印输出可以重定向到配置适当的打印机、本地\
  \ PDF 文件或通过 Google Drive 到云端。从 Android 应用开发者的角度来看，通过打印框架（Printing framework），可以在应用程序中使用这些功能。到目前为止，最容易实现的打印选项是涉及图像和\
  \ HTML 格式的内容。然而，可以使用框架的自定义文档打印功能实现更高级的打印。\n\n## 81. 一个 Android HTML 和 Web 内容打印示例\n\
  \n如上一章“使用 Android 打印框架打印”所示，Android 打印框架可以同时打印网页和动态创建的 HTML 内容。虽然这两种打印方法之间有许多相似之处，但也存在一些需要考虑的细微差异。本章将通过创建两个示例应用程序，为这两种打印选项提供清晰说明。\n\
  \n### 81.1 创建 HTML 打印示例应用程序\n\n从欢迎界面选择“新项目（New Project）”选项，在出现的新项目对话框中，点击“下一步（Next）”按钮之前选择“空视图\
  \ Activity（Empty Views Activity）”模板。\n\n在名称（Name）字段中输入 `HTMLPrint`，并指定 `com.ebookfrenzy.htmlprint`\
  \ 为包名。在点击“完成（Finish）”按钮之前，将最小 API 级别（Minimum API level）设置改为 API 26：Android 8.0 (Oreo)，并将语言（Language）菜单设置为\
  \ Java。\n\n### 81.2 打印动态 HTML 内容\n\n本教程的第一阶段是向项目添加代码以创建一些 HTML 内容并将其作为打印作业发送到打印框架。\n\
  \n首先找到 `MainActivity.java` 文件（位于 Project 窗口的 `app` -> `com.ebookfrenzy.htmlprint`\
  \ 下）并将其加载到编辑面板。加载后，修改代码如下所示：\n\n```java\npackage com.ebookfrenzy.htmlprint;\n\n\
  import androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\n\
  import android.print.Attributes;\nimport android.print.PrintDocumentAdapter;\nimport\
  \ android.print.PrintManager;\nimport android.content.Context;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private WebView myWebView;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_htmlprint);\n        printWebView();\n\
  \    }\n\n    private void printWebView() {\n        WebView webView = new WebView(this);\n\
  \        webView.setWebViewClient(new WebViewClient() {\n            @Override\n\
  \            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest\
  \ request) {\n                return false;\n            }\n            @Override\n\
  \            public void onPageFinished(WebView view, String url) {\n          \
  \      createWebPrintJob(view);\n                myWebView = null;\n           \
  \ }\n        });\n        String htmlDocument = \"<html><body><h1>Android Print\
  \ Test</h1><p>\" + \"This is some sample content.</p></body></html>\";\n       \
  \ webView.loadDataWithBaseURL(null, htmlDocument, \"text/HTML\", \"UTF-8\", null);\n\
  \        myWebView = webView;\n    }\n}\n```\n\n代码更改从声明一个名为 `myWebView` 的变量开始，其中将存储用于打印操作的\
  \ `WebView` 实例引用。在 `printWebView()` 方法中，创建了一个 `WebView` 类的实例，并为其分配了一个 `WebViewClient`\
  \ 实例。\n\n分配给 web view 对象的 `WebViewClient` 配置为指示加载 HTML 内容将由 `WebView` 实例处理（通过从 `shouldOverrideUrlLoading()`\
  \ 方法返回 `false`）。更重要的是，声明并实现了一个 `onPageFinished()` 处理方法，以调用 `createWebPrintJob()`\
  \ 方法。当所有 HTML 内容加载到 web view 时，`onPageFinished()` 方法将被自动调用。如上一章所述，在打印动态创建的 HTML\
  \ 内容时，此步骤是必要的，以确保在内容完全加载到 `WebView` 后才启动打印作业。\n\n接下来，创建一个包含某些 HTML 的 `String` 对象作为内容，并随后加载到\
  \ web view 中。一旦 HTML 加载完成，`onPageFinished()` 回调方法将触发。最后，该方法将 web view 对象的引用存储在之前声明的\
  \ `myWebView` 变量中。如果没有这一至关重要的步骤，存在很大风险，即 Java 运行时系统可能会假设应用程序不再需要 web view 对象并将其丢弃以释放内存，导致打印作业在完成前终止。\n\
  \n此示例中剩下的只需实现 `createWebPrintJob()` 方法，该方法目前配置为由 `onPageFinished()` 回调方法调用。因此，在\
  \ `MainActivity.java` 文件中实现此方法，如下如下：\n\n```java\nprivate void createWebPrintJob(WebView\
  \ webView) {\n    PrintManager printManager = (PrintManager) this\n        .getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter = webView\n        .createPrintDocumentAdapter(\"\
  MyDocument\");\n    String jobName = getString(R.string.app_name) + \" Print Test\"\
  ;\n    printManager.print(jobName, printAdapter, new PrintAttributes.Builder().build());\n\
  }\n```\n\n在运行 Android 5.0 或更高版本的设备或模拟器上编译并运行应用程序。一旦启动，标准的 Android 打印页面将如图 81-1 所示所示。\n\
  \n![](img/as_html_print_running.jpg)\n\n图 81-1\n\n\n\n\n\n如果你已经配置了物理打印机，可以将其打印出来、保存到\
  \ Google Drive，或选择保存为 PDF 文件的选项。一旦启动打印任务，请在所选的目标位置检查生成的输出。请注意，使用 `Save to PDF` 选项时，系统会要求指定\
  \ PDF 文件的位置。`Downloads` 文件夹是一个很好的选择，可以通过点击设备上其他应用图标之间的 `Downloads` 图标（在 Android\
  \ 8 上重命名为 `Files`）来查看其内容。\n\n## 81.3 创建网页打印示例\n\n在本章中创建的第二个示例应用程序将为用户提供一个溢出菜单（Overflow\
  \ menu）选项，用于打印当前在 `WebView` 实例中显示的网页。\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击\
