  当完成了对状态的操作后，下一步是恢复它：\n\n15.5 恢复状态\n\n恢复状态的方法通过 `Bundle` 对象作为参数传递给 Activity。恢复状态取决于使用\
  \ `onCreate()` 或 `onRestoreInstanceState()`。对于大多数界面视图，这由 Activity 基类处理。在本例中，我们将使用\
  \ `EditText` 组件：\n\n```java\n@Override\nprotected void onRestoreInstanceState(Bundle\
  \ savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  \    Log.i(TAG, \"onRestoreInstanceState\");\n    CharSequence userText = savedInstanceState.getCharSequence(\"\
  savedText\");\n    binding.editText.setText(userText);\n}\n```\n\n\n\n\n一个视图（View）也可以包含多个其他视图（也称为复合视图）。此类视图继承自\
  \ Android `ViewGroup` 类（`android.view.ViewGroup`），而该类本身是 `View` 的子类。此类视图的一个示例是 `RadioGroup`，它旨在包含多个\
  \ `RadioButton` 对象，使得在任何时间只有一个对象可以处于“开启”状态。从结构上来说，复合视图由单个父视图组成（派自 `ViewGroup` 类，通常称为容器视图或根元素），该父视图能够包含其他视图（称为子视图）。\n\
  \n另一一类基于 `ViewGroup` 的容器视图是布局管理器（layout manager）。\n\n## 16.3 Android 布局管理器\n\n除了上一节讨论的控件风格的视图外，SDK\
  \ 还包含了一组被称为布局（layouts）的视图。布局是容器视图（因此也继承自 `ViewGroup`），用于控制子视图在屏幕上的布局方式。\n\nAndroid\
  \ SDK 包含以下可能在 Android 用户界面设计中使用的布局视图：\n\n- `ConstraintLayout` – 在 Android 7 中引入，该布局管理器推荐用于大多数布局需求。`ConstraintLayout`\
  \ 允许通过分配给每个子视图的简单约束设置来定义布局中视图的位置和行为。这种布局的灵活性允许快速轻松地创建复杂布局，而无需在内部之间嵌套其他布局类型，从而提高了布局性能。`ConstraintLayout`\
  \ 还紧密集成到 Android Studio 布局编辑器工具中。除非另有说明，否则它是书中大部分示例的首选布局。\n- `LinearLayout` – 根据所选的方向将子视图放置在单行或单列中。可以在每个子视图上设置权重（weight）值，以指定该子视图相对于其他子视图占据布局空间的比例。\n\
  - `TableLayout` – 将子视图排列为行和列的网格格式。表格中的每一行由一个 `TableRow` 对象子视图表示，该子视图又包含每个单元格的视图对象。\n\
  - `FrameLayout` – `FrameLayout` 的目的是分配屏幕的一个区域，通常用于显示单个视图。如果添加了多个子视图，它们默认将堆叠显示，并位于布局区域的左上角。通过为每个子视图设置重力（gravity）值可以实现单个子视图的交替定位。例如，在子视图上设置\
  \ `center_vertical` 重力值将使其置于容器 `FrameLayout` 视图的垂直中心。\n- `RelativeLayout` – `RelativeLayout`\
  \ 允许通过指定子视图的对齐方式和边距，使子视图相对于彼此以及相对于容器布局视图进行定位。例如，可以将子视图 A 配置为置位于容器 `RelativeLayout`\
  \ 视图的垂直和水平中心。相反，视图 B 也可以配置为在布局视图中水平居中，但位于 View A 顶部上方 30 像素处，从而产生相对于 View A 的垂直位置。`RelativeLayout`\
  \ 管理器在设计必须在各种屏幕尺寸和方向上运行的用户界面时非常有帮助。\n- `AbsoluteLayout` – 允许子视图定位在容器布局视图内的特定 X 和\
  \ Y 坐标上。不建议使用这种布局，因为它缺乏响应屏幕尺寸和方向变化的灵活性。\n- `GridLayout` – `GridLayout` 实例由不可见的线划分，形成一个包含行和列单元格的网格。子视图被放置在单元格中，并可以配置为水平和垂直覆盖多个单元格，从而快速轻松地实现各种布局选项。`GridLayout`\
  \ 中组件之间的间隙可以通过在相邻单元格中放置名为 `Space` 的特殊类型视图或设置边距参数来实现。\n- `CoordinatorLayout` – 作为\
  \ Android 5.0 的 Android 设计支持库的一部分引入，`CoordinatorLayout` 专门用于协调应用程序屏幕顶部应用栏与其他视图元素的外观和行为。当使用\
  \ Basic Views Activity 模板创建新活动时，主布局中的父视图将使用 `CoordinatorLayout` 实例实现。该布局管理器将在后面的章节中进行详细介绍，从“使用\
  \ Floating Action Button 和 Snackbar 所示的用户界面：\n\n![](img/as_layout_views.jpg)\n\n\
  图 16-1\n\n除了可见的按钮和复选框视图外，用户界面实际上包含许多控制可见视图定位方式的布局视图。图 16-2 显示了用户界面的另一种视图方式，这次强调了布局视图与子视图之间的关系：\n\
  \n![](img/Image2808.jpg)\n\n图 16-2\n\n正如之前讨论的，用户界面是以视图层次结构的形式构建的，顶部有一个根视图。正因如此，我们也可以以图\
  \ 16-3 所示的视图树的形式来视化上述用户界面示例：\n\n![](img/Image2815.jpg)\n\n图 16-3\n\n视图层次结构图可能对构成图\
  \ 16-1 所示的用户界面的各种视图之间关系的最清晰的概述。当用户界面显示给用户时，Android 运行时会遍历视图层次结构，从根视图开始向下遍历树，并渲染每个视图。\n\
  \n## 16.5 创建用户界面\n\n在对视图、布局和视图层次结构概念有更清晰的理解之后，接下来的几章将重点关注为 Android 活动创建用户界面的步骤。事实上，用户界面设计有三种不同的方法：使用\
  \ Android Studio 布局编辑器工具、手写 XML 布局资源文件或编写 Java 代码，每种方法都将被涵盖。\n\n## 16.6 总结\n\nAndroid\
  \ 应用程序用户界面屏幕中的每个元素都是最终继承自 `android.view.View` 类的视图。每个视图代表设备显示器的一个矩形区域，既负责该矩形内显示的内容，又处理在视图边界内发生的事件。可以将多个视图组合创建一个复合视图。复合视图中的视图是容器视图的子视图，容器视图通常继承自\
  \ `android.view.ViewGroup`（该类本身是 `android.view.View` 的子类）。用户界面是由视图层次结构形式构建的视图组成的。\n\
  \n\n\n\n\nAndroid SDK 包含了一系列预定义的视图（views），用于创建用户界面。这些视图包括文本字段和按钮等基础组件，以及一组用于控制子视图位置的布局管理器。如果提供的视图不能满足特定需求，可以创建自定义视图，方法包括扩展或组合现有视图，或者通过子类\
  \ `android.view.View` 并创建一个全新的视图类。\n\n可以使用 Android Studio 布局编辑器（Layout Editor）工具、手动编写\
  \ XML 布局资源文件或编写 Java 代码来创建用户界面。这些方法将在后续章节中逐一介绍。\n\n# 17. Android Studio 布局编辑器工具指南\n\
  \n想要出一个不需要某种形式用户界面的 Android 应用概念是具有挑战性的。大多数 Android 设备都配备了触摸屏和键盘（虚拟或物理），点击和滑动是用户与应用程序之间主要的交互方式。这些交互不可避免地通过应用程序的用户界面进行。\n\
  \n良好的设计和实现的用户界面是创建一个成功且流行的 Android 应用的关键因素，根据单个应用程序的设计需求，其复杂度可以从简单到高度复杂不等。无论复杂程度如何，Android\
  \ Studio 布局编辑器都显著简化了设计和实现 Android 用户界面的任务。\n\n### 17.1 基础视图活动与空视图活动模板\n\n如标题为“Android\
  \ 应用剖析”的章节所述，Android 应用程序由一个或多个活动（activities）组成。活动是应用程序功能的一个独立模块，通常直接对应于单个用户界面屏幕。因此，当使用\
  \ Android Studio 布局编辑器时，我们总是在为某个活动编写布局。\n\n在创建新的 Android Studio 项目时，有多个模板可用，作为主活动用户界面的起点。最基础的模板是基础视图活动（Basic\
  \ Views Activity）和空视图活动（Empty Views Activity）模板。尽管它们初看起来看起来相似，但两者之间存在显著差异。要在布局编辑器中查看这些差异，请使用视图选项（View\
  \ Options）菜单启用“显示系统 UI（Show System UI）”，如下方的图 17-1 所示：\n\n![](img/as_layout_editor_view_options.jpg)\n\
  \n图 17-1\n\n空视图活动模板创建一个单个布局文件，其由一个 `ConstraintLayout` 管理器实例组成，该实例包含一个 `TextView`\
  \ 对象，如图 17-2 所示：\n\n![](img/as_layout_with_system_ui.jpg)\n\n图 17-2\n\n另一方面，基础视图活动包含多个布局文件。顶层布局文件具有\
  \ `CoordinatorLayout` 作为根视图、一个可配置的应用程序栏（包含一个 `toolbar`）显示在设备屏幕顶部（在图 17-3 中标记为 A），以及一个浮动操作按钮（标记为\
  \ B 的邮件按钮）。除了这些项目，`activity_main.xml` 布局文件还引用了名为 `content_main.xml` 的第二个文件，该文件包含内容布局（标记为\
  \ C）：\n\n![](img/as_basic_activity_layout.jpg)\n\n图 17-3\n\n基础视图活动包含两个屏幕的布局，每个包含按钮和一个文本视图。该模板旨在演示如何实现应用内多个屏幕之间的导航。如果运行一个使用基础视图活动模板且未修改过的程序，将显示这两个屏幕中的第一个（在图\
  \ 17-4 中标记为 A）。点击 Next（下一个）按钮将导航到第二个屏幕（B），该屏幕又包含一个返回第一个屏幕的按钮：\n\n![](img/as_basic_activity_layout_1.jpg)\n\
  \n图 17-4\n\n此应用的行为使用了两个被称为片段（fragments）和导航（navigation）的 Android 功能，这些功能将分别从标题为“Android\
  \ 片片简介”和“导航架构组件概述”的章节开始介绍。\n\n`content_main.xml` 文件包含一个特殊的片段，即导航宿主片段（Navigation\
  \ Host Fragment），它允许根据 `res -> layout -> nav_graph.xml` 文件中配置的设置，在视图中切换出不同的内容。在基础视图活动模板的情况下，`nav_graph.xml`\
  \ 文件被配置为根据用户点击“下一个”和“上一个”按钮的选择，在 `fragment_first.xml` 和 `fragment_second.xml` 文件定义的用户界面布局之间进行切换。\n\
  \n如果你在活动中既不需要浮动操作按钮也不需要菜单，并且不需要 `CoordinatorLayout` 提供的特殊应用栏行为（例如在某些滚动操作期间使应用栏和工具栏从视图折叠的选项，该主题在标题为“使用\
  \ AppBar 和折叠工具栏布局”的章节中有所介绍），那么空视图活动模板将很有帮助。然而，基础视图活动之所以很有帮助，因为它默认提供了这些元素。事实上，使用基础视图活动模板创建一个新活动并删除你不需要的元素，比使用空视图活动模板并手动实现折叠工具栏、菜单或浮动操作按钮等行为要快得多。\n\
  \n然而，由于书中的并非所有示例都需要基础视图活动模板的功能，本章中的大多数示例将使用空视图活动模板，除非该示例需要基础视图活动模板提供的某项功能。\n\n\n\
  \n\n\n1. 在 Project（项目）工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器中，选择图表面板中的 `SecondFragment` 条目，并按下键盘上的删除键将其从图表中移除。\n3. 找到并删除 `SecondFragment.java`（`app\
  \ -> java -> <package name> -> SecondFragment`）和 `fragment_second.xml`（`app -> res\
  \ -> layout -> fragment_second.xml`）文件。\n4. 最后的任务是从 `FirstFragment` 类中移除某些代码，使得\
  \ `Button` 视图在被点击时不再导航到已不存在的第二个 fragment。找到 `FirstFragment.java` 文件，双击它加载到编辑器，并删除\
  \ `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n     \
  \   @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
  \   }\n    });\n}\n```\n\n## 17.2 Android Studio 布局编辑器\n\n如前面的章节所示，布局编辑器（Layout\
  \ Editor）工具提供了一个“所见即所得”（WYSIWYG）的环境，你可以从调色板中选择视图，然后将其放置在代表 Android 设备显示的画布上。一旦视图被放置在画布上，就可以对其进行移动、删除和调整大小（受父视图约束的限制）。此外，可以使用\
  \ Attributes（属性）工具窗口修改与所选视图相关的各种属性。\n\n在底层，布局编辑器会构建一个 XML 资源文件，该文件包含了正在设计的用户界面定义。因此，布局编辑器以三种不同的模式运行：Design（设计）、Code（代码）和\
  \ Split（拆）。\n\n### 17.3 设计模式（Design Mode）\n\n在设计模式下，可以通过直接操作视图调色板和布局的图形表示来可视化地操作用户界面。图\
  \ 17-5 展示了 Android Studio 布局编辑器在设计模式下的关键区域：\n\n![](img/as_layout_editor1.jpg)\n\n\
  图 17-5\n\n* **A – Palette（调色板）** – 调色板提供了 Android SDK 提供的系列视图组件的访问。这些组件被分为类别以便于导航。可以通过从调色板中拖拽视图组件并将其掉落在布局所需的位置来向布局添加项。\n\
  * **B – Device Screen（设备屏幕）** – 设备屏幕提供了正在设计中的用户界面布局的视觉“所见即所得”表示。该布局允许通过选择、删除、移动和调整大小视图来允许直接的设计操作。可以使用工具栏中的菜单随时更改布局所代表的设备模型。\n\
  * **C – Component Tree（组件树）** – 如上一章概述（“理解 Android 视图、视图组和布局”）所示用户界面是使用层次结构构建的。组件树提供了用户界面设计层次结构的视觉概览。从组件树中选择元素将导致布局中相应的视图被选中。同样，从设备屏幕布局中选择视图将选中组件树层级结构中的该视图。\n\
  * **D – Attributes（属性）** – 调色板列出的所有组件视图都有一组关联属性，用于调整该视图的行为和外观。布局编辑器的属性面板提供了对布局中当前选中视图属性的访问，允许进行更改。\n\
  * **E – Toolbar（工具栏）** – 布局编辑器工具栏提供了对广泛选项的快速访问，包括但不限于缩放设备屏幕布局、更改当前显示的设备模型、在竖屏和横屏之间旋转布局以及切换到不同的\
  \ Android SDK API 。工具栏还有一组上下文敏感按钮，当在设备屏幕布局中选择相关的视图类型时，这些按钮将会出现。\n* **F – Mode Switching\
  \ Controls（模式切换控制）** – 这三个按钮提供了在布局编辑器的 Design、Code 和 Split 模式之间来回切换。\n* **G - Zoom\
  \ and Pan Controls（缩放和平移控制）** – 此控制面板允许你对设计画布进行缩放、抓取画布并在放大时移动以寻找被遮挡的区域。\n\n### 17.4\
  \ 调色板（The Palette）\n\n布局编辑器调色板组织为两个面板，旨在方便查找和预览要添加到布局设计中的视图组件。类别面板（在图 17-6 中标记为\
  \ A）列出了 Android SDK 支持的不同视图组件类别。从列表中选择一个类别时，第二个面板 (B) 会更新以显示属于该类别的组件列表：\n\n![](img/as_layout_editor_pallette.jpg)\n\
  \n图 17-6\n\n要从调色板将组件添加到布局画布，请从组件列表或预览面板中选择该项，将其拖到画布上的所需位置，并放置到位。\n\n在所选类别内搜索特定组件，可以通过点击调色板工具栏中的搜索按钮（在图\
  \ 17-6 上方标记为 C）并输入组件名称来启动。随着字符的输入，匹配的结果将出现在组件列表中。如果不确定组件的类别，可以在搜索之前或期间选择 All（全部）类别。\n\
  \n### 17.5 设计模式与视图\n\n布局编辑器默认以 Design 模式出现，如图 17-5 所示。该模式提供了用户界面的视觉表示。可以通过点击图 17-7\
  \ 中标记为 C 的按钮来选择设计模式：\n\n![](img/as_layout_editor_view_buttons.jpg)\n\n图 17-7\n\n\
  当布局编辑器处于设计模式时，可以通过两种方式查看布局。图 17-5 所示的是 Design 视图，它显示了运行应用程序中的布局和控件。另一种模式是 Blueprint（蓝图）视图，可以代替\
  \ Design 视图显示。图 17-8 工具栏菜单提供了显示 Design、Blueprint 或两种视图的选项。还有用于调整色盲的设置。第五选项 Force\
  \ Refresh Layout（强制刷新布局）会导致布局重建并重绘。这在布局进入意外状态时非常有用：\n\n![](img/as_layout_editor_design_surface.jpg)\n\
  \n图 17-8\n\n显示布局视图、设计视图或两者取决于个人喜好。好的方法是同时显示两者，如图 17-9 所示：\n\n![](img/as_3.5_show_layout_design_and_blueprint.jpg)\n\
  \n图 17-9\n\n### 17.6 夜间模式（Night Mode）\n\n要在设计期间以夜间模式查看布局，请选择下方图 17-10 所示菜单并设置为 Night：\n\
  \n![](img/as_layout_editor_night.jpg)\n\n图 17-10\n\n模式菜单还包括测试动态颜色的选项，该主题在章节“Material\
  \ Design 3 主题和动态颜色教程中有所介绍。\n\n### 17.7 代码模式（Code Mode）\n\n\n\n\n\n在使用 Android Studio\
  \ 布局编辑器工具时，请记住，它所做的只是提供了一种用户友好的方法来创建 XML 布局资源文件。在设计过程中，可以通过选择上方图 17-7 中标记为 `A` 的按钮来查看并直接编辑底层的\
  \ XML。\n\n图 17-11 显示了代码模式下的 Android Studio 布局编辑器，允许通过修改 XML 来更改用户界面声明：\n\n```\n\
  ![](img/as_layout_editor_code.jpg)\n```\n图 17-11\n\n### 17.8 分屏模式 (Split Mode)\n\
  \n在分屏模式下，编辑器并排显示 `Design`（设计）和 `Code`（代码）视图，允许用户使用设计画布可视化地修改用户界面，并直接更改 XML 声明。通过点击上方标记为\
  \ `B` 的图 17-7 按钮选择分屏模式。\n\nXML 的任何更改都会自动反映在设计画布上，反之亦然。图 17-12 显示了处于分屏模式下的编辑器：\n\n\
  ```\n![](img/as_layout_editor_split.jpg)\n```\n图 17-12\n\n### 17.9 设置属性 (Setting\
  \ Attributes)\n\n属性面板提供了对当前所选组件的所有可用设置的访问。例如，图 17-13 显示了 `TextView` 小部件的一些属性：\n\n\
  ```\n![](img/as_layout_editor_atrributes.jpg)\n```\n图 17-13\n\n属性工具窗口分为以下不同部分：\n\
  \n- `id` - 包含 `id` 属性，它定义了在应用程序源代码中引用当前所选对象的名称。\n- `Declared Attributes`（已声明属性）\
  \ - 包含所有已分配数值的属性。\n- `Layout`（布局） - 定义当前所选视图对象相对于屏幕以及布局中其他对象的定位和大小的设置。\n- `Transforms`（变换）\
  \ - 包含允许当前所选对象进行旋转、缩放和偏移的控件。\n- `Common Attributes`（常用属性） - 当前所选视图对象类通常需要更改的属性列表。\n\
  - `All Attributes`（所有属性） - 当前所选对象所有可用属性的完整列表。\n\n也可以通过点击属性工具窗口工具栏中的搜索按钮并输入属性名称来对特定属性进行搜索。\n\
  \n某些属性在值字段右侧有一个窄按钮。这表示可以使用“资源 (Resources)”对话框来协助选择合适的属性值。要显示对话框，请点击该按钮。按钮的外观会 way，以反映相应的属性值是存储在资源文件中还是硬编码的。如果值存储在资源文件中，`text`\
  \ 属性字段右侧的按钮将填充，以指示该值不是硬编码的，如下方的图 17-14 所示：\n\n```\n![](img/as_layout_editor_not_hardcoded.jpg)\n\
  ```\n图 17-14\n\n对于具有有限有效选项的属性，将呈现下拉菜单（图 17-15），从中进行选择。\n\n```\n![](img/as_layout_editor_attr_options.jpg)\n\
  ```\n图 17-15\n\n可以点击滴管图标显示颜色选择调板。同样，当标志图标出现时，点击它可以显示该属性的可用列表，而图像图标会打开资源管理器面板，允许为属性选择图像和其他资源类型。\n\
  \n### 17.10 变换 (Transforms)\n\n属性工具窗口中的变换面板（图 17-16）提供了一组控件和属性，用于控制当前所选对象在旋转、`alpha`（用于视图淡入淡出）、`scale`（大小）和\
  \ `translation`（与当前位置的偏移）方面的视觉效果：\n\n```\n![](img/as_layout_editor_transforms.jpg)\n\
  ```\n图 17-16\n\n面板包含视图的视觉表示，该表示随属性的更改而更新。这些更改也会反映在布局画布的视图中。\n\n### 17.11 工具可见性切换\
  \ (Tools Visibility Toggles)\n\n在代码模式下查看 Android Studio XML 布局文件的内容时，你会注意到许多定义视图外观和行为的属性以\
  \ `android:` 前缀开头。这表示这些属性设置在 `android` 命名空间内，并将在应用程序运行时生效。例如，以下布局文件的摘录在 `Button`\
  \ 视图上设置了各种属性：\n\n```xml\n<Button\n    android:id=\"@+id/button\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
  Button\"\n```\n\n除了 `android` 命名空间外，Android Studio 还提供了一个 `tools` 命名空间。当在此命名空间内设置属性时，它们仅在布局编辑器预览中生效。在设计布局时，你可能会发现让\
  \ `EditText` 视图显示某些文本但在程序运行时需要视图为空是有帮助的。为了实现这一点，你会使用 `tools` 命名空间设置视图的 `text` 属性\n\
  \n```xml\n<EditText\n    android:id=\"@+id/editTextPersonName\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\
  \n    android:inputType=\"textPersonName\"\n    tools:text=\"Sample Text\"\n```\n\
  \n此类工具属性是通过在属性窗口中标记有扳手图标的字段中输入值来设置的，如图 17-17 所示：\n\n```\n![](img/as_layout_editor_tools_attribute.jpg)\n\
  ```\n图 17-17\n\n工具属性对于设计过程中更改视图的可见性非常有用。布局可能包含应用程序运行时根据用户操作显示或隐藏的视图。为了模拟隐藏视图，可以在视图上添加以下工具属性：\n\
  \n```xml\ntools:visibility=\"invisible\"\n```\n虽然使用 `invisible` 设置后视图不再可见，但它仍然存在于布局中并占据原来的空间。要让布局表现就像视图不存在一样，应将可见性属性设置为\
  \ `gone`：\n\n```xml\ntools:visibility=\"gone\"\n```\n在上述两个示例中，可见性设置仅适用于布局编辑器，对运行程序没有影响。要在布局编辑器和运行程序中控制可见性，可以使用\
  \ `android` 命名空间设置相同的属性：\n\n```xml\nandroid:visibility=\"gone\"\n```\n\n虽然这些可见性工具属性很有用，但手动编辑\
  \ XML 布局文件是一个麻烦的过程。为了方便更改这些设置，Android Studio 在布局编辑器组件树面板中提供了一组切换。要访问这些控件，请点击面板中对应视图右侧的边缘。例如，图\
  \ 17-18 显示了名为 `myButton` 的 `Button` 视图的工具可见性切换控件：\n\n```\n![](img/as_layout_editor_tools_attr_visibility.jpg)\n\
  ```\n图 17-18\n\n这些切换控制 `android` 和 `tools` 命名空间对应视图的可见性，并提供 `not set`（未设置）、`visible`（可见）、`invisible`（隐藏）和\
  \ `gone`（移除）选项。当设置冲突属性时（例如，`android` 命名空间切换设置为可见，而 `tools` 值设置为隐藏），`tools` 命名空间在布局预览中具有优先权。当做出切换选择时，Android\
  \ Studio 会自动为布局文件中的 XML 元素添加相应的属性。\n\n\n\n\n除了组件树（Component Tree）面板中的可见性切换开关外，布局编辑器还包含了工具的可见性和位置切换按钮，如下方的图\
  \ 17-19 所示的高亮显示：\n\n![](img/as_layout_editor_show_tools.jpg)\n\n图 17-19\n\n此按钮用于切换当前工具的可见性设置。例如，如果上方所示的`Button`视图当前的工具可见性属性设置为`gone`，则切换此按钮将使其可见。这使得在视图添加到布局或从布局中移除时，能够快速检查布局行为。该切换开关对于检查布局中的视图是否正确约束也很有用，该主题在名为“Android\
  \ Studio 中 ConstraintLayout 的使用指南”的章节中有介绍。\n\n### 17.12 转换视图\n\n在 Android Studio\
  \ 布局编辑器中，将布局中的视图从一种类型转换为另一种类型（例如将 `TextView` 转换为 `EditText`）很容易实现。只需在屏幕布局或组件树窗口中右键点击该视图，并选择\
  \ `Convert view...` 菜单选项（图 17-20）：\n\n![](img/as_layout_editor_convert_view.jpg)\n\
  \n图 17-20\n\n选中后，将出现一个包含所选对象可以转换为兼容视图类型列表的对话框。例如，图 17-21 显示了现有 `TextView` 视图可以转换的类型：\n\
  \n![](img/as_layout_editor_convert_view_dialog.jpg)\n\n图 17-21\n\n这种技术也有助于将布局从一种类型转换为另一种类型（例如，将\
  \ `ConstraintLayout` 转换为 `LinearLayout`）。\n\n### 17.13 显示示例数据\n\n在 Android Studio\
  \ 中设计布局时，可能会遇到这样的情况：即用户界面中要显示的内容在应用完成并运行之前是不可用的。这有时会导致很难从布局编辑器内部评估布局在应用运行时时的外观。为了解决这个问题，布局编辑器允许指定示例数据，这些数据将填充布局编辑器中的视图，为其提供示例图像和数据。这些示例数据仅在布局编辑器中显示，应用运行时不会显示。可以通过直接编辑布局的\
  \ XML 或视觉化设计时助手（通过在设计区域右键点击小部件并选择 `Set Sample Data` 菜单选项）来配置示例数据。设计时助手面板将为所选视图项上显示的示例数据提供的一系列预配置选项，包括各种配置的文本和图像组合。例如，图\
  \ 17-22 显示了选择在 `RecyclerView` 列表中示例数据时显示的示例数据选项：\n\n![](img/as_layout_editor_design_time_attrs.jpg)\n\
  \n图 17-22\n\n或者，可以在布局设计过程中提供自定义文本和图像进行显示。在布局编辑器中使用示例数据的示例包含在后续名为“布局编辑器示例数据教程”的章节中。由于示例数据是作为\
  \ `tools` 属性实现的，可以使用上方图 17-19 中高亮显示的切换按钮来控制预览中数据的可见性。\n\n### 17.14 创建自定义设备定义\n\n\
  布局编辑器工具栏中的设备菜单（图 17-23）提供了预配置设备类型的列表，选择后它们将作为设备屏幕画布出现。除了预配置的设备类型外，之前在 Android Studio\
  \ 环境中配置任何 AVD 实例也会列在菜单中。要添加其他设备配置，显示设备菜单，选择 `Add Device Definition` 选项并按照“在 Android\
  \ Studio 中创建 Android 虚拟设备 (AVD)”章节概述的步骤进行。\n\n![](img/as_layout_editor_device_menu.jpg)\n\
  \n图 17-23\n\n### 17.15 更改当前设备\n\n作为设备选择菜单的替代，可以通过从设备菜单中选择 `Custom` 选项，点击设备屏幕右下角的缩放手柄（图\
  \ 17-24），并拖动选择另一种设备显示格式。随着屏幕调整大小，将出现标记，指示可用的各种尺寸选项和方向：\n\n![](img/as_3.5_show_layout_resize_device.jpg)\n\
  \n图 17-24\n\n### 17.16 布局验证\n\n布局验证选项允许在一系列 Pixel 尺寸的屏幕上预览用户界面布局。要访问布局验证工具窗口，请点击\
  \ Android Studio 主窗口右边缘的标签页，或使用窗口左下角的工具窗口菜单。加载后，面板将如图 17-25 所示，在多个设备屏幕配置上渲染布局：\n\
  \n![](img/as_layout_editor_device_validation.jpg)\n\n图 17-25\n\n### 17.17 总结\n\n\
  开发 应用程序的关键部分是创建用户界面。这是在 Android Studio 环境中使用布局编辑器工具完成的，该工具有三种模式。在设计模式中，从调板中选择组件，放置在代表设备的布局上，并使用属性列表进行配置。在代码模式中可以直接编辑表示布局的底层\
  \ XML。而在拆模式中，可以通过可视化和直接编辑 XML 来创建和修改布局。这些模式结合提供了一个广泛且直观的用户界面设计环境。\n\n布局验证面板允许在各种设备尺寸上快速预览用户界面布局。\n\
  \n## 18. ConstraintLayout 使用指南\n\n正如名为“理解 Android 视图组和布局”的章节所示，Android 提供了多种布局管理器来设计用户界面。从\
  \ Android 7 开始，Google 引入了一种解决较旧布局管理器许多缺陷的布局。这种布局被称为 ConstraintLayout，它将简单、灵活且灵活的布局系统与\
  \ Android Studio 布局编辑器中强大的功能相结合，有助于创建自动适应不同屏幕尺寸和设备方向变化的响应式用户界面。\n\n本章将概述 ConstraintLayout\
  \ 的基本概念，下一章将详细介绍如何在 Android Studio 布局编辑器中使用 ConstraintLayout 创建基于约束的布局。\n\n### 18.1\
  \ ConstraintLayout 如何工作\n\n与其他所有布局一样，ConstraintLayout 管理其包含的视觉组件（也称为小部件）的位置和大小行为。它是根据每个子小部件设置的约束连接执行此操作。\n\
  \n为了充分理解并使用 ConstraintLayout，掌握以下核心概念至关重要：\n\n•约束（Constraints）\n•边距（Margins）\n•对向约束（Opposing\
  \ Constraints）\n•约束偏置（Constraint Bias）\n•链（Chains）\n•链样式（Chain Styles）\n•辅助线（Guidelines）\n\
  •组（Groups）\n•障碍（Barriers）\n•流布局（Flow）\n\n#### 18.1.1 约束\n\n\n\n\n约束（Constraints）是一组规则，规定了组件相对于其他组件、容器\
  \ `ConstraintLayout` 的边界以及称为引导（guidelines）的特殊元素的对齐和间距方式。约束还决定了活动的用户界面布局如何响应设备方向的变化或在不同屏幕尺寸的设备上的显示。为了进行充分的配置，组件必须具有足够的约束连接，以便\
  \ `ConstraintLayout` 布局引擎能够在水平和垂直平面上都解析其位置。\n\n#### 18.1.2 边距（Margins）\n\n边距是某种指定固定距离的约束形式。考虑一个需要放置在设备屏幕右上角的\
  \ `Button` 对象。这可以通过实现从 `Button` 顶部和右侧边缘的边距约束，并将其连接到父级 `ConstraintLayout` 的对应侧边来实现，如图\
  \ 18-1 所示：\n\n![](img/Image2437.jpg)\n\n图 18-1\n\n如上图所示，这些每一个约束连接都关联着一个边距值，规定了组件距离父级布局两个侧边的固定距离。在这种配置下，无论屏幕尺寸或设备方向如何，`Button`\
  \ 对象将始终根据两个约束连接的指定，分别距离父级 `ConstraintLayout` 的顶部和右侧边缘 20 和 15 设备独立像素（`dp`）。\n\n\
  虽然上述配置在某些情况下是可以接受的，但它并没有允许 `ConstraintLayout` 布局引擎调整组件位置以响应设备旋转并支持不同尺寸屏幕的活性。为了给布局添加这种响应性，必须实现对向约束（opposing\
  \ constraints）。\n\n#### 18.1.3 对向约束（Opposing Constraints）\n\n在单个组件上沿同一轴运行的两个约束被视为对向约束。换句话说，一个左侧和右侧都有约束的组件被认为具有水平对向约束。例如，图\
  \ 18-2 展示了如何在之前的布局中同时添加水平和垂直方向的对向约束：\n\n![](img/Image24461.jpg)\n\n图 18-2\n\n这里需要理解的关键点是，一旦在特定轴上实现了对向约束，组件的定位将变为基于百分比而非基于坐标。例如，组件不再固定在距离布局顶部\
  \ 20dp 处，而是位于距离顶部 30% 的位置。在不同的方向以及在较大或较小的屏幕上运行时，`Button` 将始终相对于父级布局的尺寸处于相同的位置。\n\
  \n现在重要的是理解，图 18-2 中概述的布局不仅使用了对向约束，还通过应用约束偏置（constraint bias）实现的。\n\n#### 18.1.4\
  \ 约束偏置（Constraint Bias）\n\n现在已经确定 `ConstraintLayout` 中的组件可能会受到对向约束连接的影响。默认情况下，对向约束是相等的，导致相应的组件在对向轴上居中。例如，图\
  \ 18-3 展示了一个使用对向水平和垂直约束的、在包含的 `ConstraintLayout` 中居中的组件：\n\n![](img/Image2453.jpg)\n\
  \n图 18-3\n\n为了在对向约束的情况下调整组件位置，`ConstraintLayout` 实现了一种名为约束偏置的功能。约束偏置允许组件在对向轴上的定位根据指定的百分比偏向其中一个约束。例如，图\
  \ 18-4 显示了之前的约束布局，具有 75% 的水平偏置和 10% 的垂直偏置：\n\n![](img/Image2461.jpg)\n\n图 18-4\n\
  \n下一章标题为“Android Studio 中使用 ConstraintLayout 指南`，将更详细地涵盖这些概念，并解释这些功能是如何集成到 Android\
  \ Studio 布局编辑器工具中的。然而，在此还需要涵盖 `ConstraintLayout` 类的另外几个领域。\n\n#### 18.1.5 链（Chains）\n\
  \n`ConstraintLayout` 链提供了一种将两个或多个组件的布局行为定义为一个组的方法。链可以在垂直或水平轴上声明，并配置为定义定义链中组件的间距和大小。\n\
  \n当组件通过双向约束连接时，它们就形成了链。例如，图 18-5 展示了三个以这种方式链联的组件：\n\n![](img/Image2468.jpg)\n\n\
  图 18-5\n\n链中的第一个元素是链头（chain head），它在垂直链中对应顶部的组件，或者在水平链中对应最左侧的组件。整个链的布局行为主要通过设置链头组件上的属性来配置。\n\
  \n#### 18.1.6 链样式（Chain Styles）\n\n`ConstraintLayout` 链的布局行为由应用于链头组件的链样式决定。`ConstraintLayout`\
  \ 类目前支持以下链布局样式：\n\n-   **散布链（Spread Chain）** – 链中的组件在可用空间内均匀分布。这是链的默认行为。\n\n![](img/Image2478.jpg)\n\
  \n图 18-6\n\n-   **内部散布链（Spread Inside Chain）** – 链中的组件在链头和最后一个组件之间均匀分布。头部和最后一个组件不包含在间距内。\n\
  \n![](img/Image2485.jpg)\n\n图 18-7\n\n-   **权重链（Weighted Chain）** – 允许通过权重属性定义链中每个组件占据的空间。\n\
  \n![](img/Image2492.jpg)\n\n图 18-8\n\n-   **紧凑链（Packed Chain）** – 组成链的组件聚集在一起。可以应用偏置来控制链相对于父级的水平或垂直位置。\n\
  \n![](img/Image2500.jpg)\n\n图 18-9\n\n###18.2 基线对齐（Baseline Alignment）\n\n到目前为止，本章仅提到了相对于组件侧边的对齐（通常称为侧边约束）。然而，常见的需求是让组件相对于其显示的内容对齐，而不是组件本身。为了满足这一需求，`ConstraintLayout`\
  \ 提供了基线对齐。\n\n例如，假设之前的图 18-1 理论布局需要一个 `TextView` 组件放置在 `Button` 左侧 40dp 处。在这种情况下，`TextView`\
  \ 需要与 `Button` 基线对齐。这意味着 `Button` 的文本需要与 `TextView` 的文本在垂直对齐。该布局的额外约束需要如图 18-10\
  \ 所示进行连接：\n\n![](img/Image2508.jpg)\n\n图 18-10\n\n现在 `TextView` 在垂直方向上与 `Button`\
  \ 基线对齐，并在水平方向上距离 `Button` 对象的左边缘 40dp。\n\n###18.3 配置组件尺寸\n\n控制组件尺寸是用户界面设计过程的关键元素。`ConstraintLayout`\
  \ 提供了可以设置在单个组件上的三个选项来管理尺寸行为。这些设置针对高宽维度单独进行配置：\n\n-   **固定（Fixed）** – 组件固定为指定的尺寸。\n\
  -   **匹配约束（Match Constraint）** – 允许布局引擎调整组件的大小以满足现有的约束。也称为 `AnySize` 或 `MATCH_CONSTRAINT`\
  \ 选项。\n\n\n\n\n- `Wrap Content` – 控件的大小由其内容（即文本或图形）决定。\n\n## 18.4 Guideline Helper（辅助线类）\n\
  \n辅助线是 `ConstraintLayout` 中可用的特殊元素，它们为约束连接提供了一个额外的目标。可以在 `ConstraintLayout` 实例中添加多个辅助线，这些辅助线可以被配置为水平或垂直方向。一旦添加，就可以从布局中的控件到辅助线建立约束连接。这在多个控件需要沿某一轴对齐时特别有用。例如，在图\
  \ 18-11 中，包含在 `ConstraintLayout` 的三个 `Button` 对象沿着垂直辅助线进行约束：\n\n![](img/Image2519.jpg)\n\
  \n图 18-11\n\n## 18.5 Group Helper（组辅助类）\n\n`ConstraintLayout` 的这一功能允许将组件放置在逻辑组中，并作为一个整体控制这些组件的可见性。`Group`\
  \ 是布局中其他组件的引用列表。一旦定义，更改 `group` 实例的可见性属性（`visible`、`invisible` 或 `gone`）将把更改应用到所有组成员。这使得通过更改单个属性就能轻松地隐藏和显示多个控件。一个布局可以包含多个组，一个控件也可以属于多个组。如果组之间发生冲突，则\
  \ XML 文件中最后声明的组具有优先级。\n\n## 18.6 Barrier Helper（屏障辅助类）\n\n与辅助线类似，屏障（barriers）是用于约束布局内视图的虚拟视图。与辅助线一样，`barrier`\
  \ 可以是垂直或水平的，并且一个或多个视图可以约束在其上方（为了避免混淆，这些视图被称为受约束视图）。与辅助线不同，辅助线在布局中保持在固定位置，而 `barrier`\
  \ 的位置是由一组所谓的参考视图定义的。引入屏障是为了解决某些频繁发生的视图重叠问题。例如，考虑下方的图 18-12 所示的布局：\n\n![](img/Image2526.jpg)\n\
  \n图 18-12\n\n关于上述布局需要注意的关键点是：`View 3` 的宽度设置为匹配约束模式，且该视图的左边缘连接到 `View 1` 的右边缘。按照目前的实现，增加\
  \ `View 1` 的宽度将产生预期的效果，即缩小 `View 3` 的宽度：\n\n![](img/Image2533.jpg)\n\n图 18-13\n\n\
  然而，如果增加的是 `View 2` 而不是 `View 1` 的宽度：\n\n![](img/Image2540.jpg)\n\n图 18-14\n\n由于\
  \ `View 3` 仅受 `View 1` 约束，它不会为了适应 `View 2` 宽度的增加而调整大小，导致视图重叠。\n\n解决此问题的方法是添加一个垂直屏障并将\
  \ `Views 1` 和 `View 2` 分配为屏障的参考视图，以便它们控制屏障的位置。这样 `View 3` 的左边缘将相对于屏障进行约束，使其成为受约束视图。\n\
  \n现在当 `View 1` 或 `View 2` 的宽度增加时，`barrier` 将移动以适应两个视图中最宽的一个，导致 `View 3` 的宽度相对于新的屏障位置发生变化：\n\
  \n![](img/Image2548.jpg)\n\n图 18-15\n\n在使用屏障时，与单个屏障关联的参考视图和受约束视图的数量没有限制。\n\n## 18.7\
  \ Flow Helper（流辅助类）\n\n`ConstraintLayout Flow` 辅助类允许组视图以流式网格布局方式显示。与 `Group` 辅助类一样，`Flow`\
  \ 包含了对其负责定位的视图的引用，并提供了各种配置选项，包括垂直和水平方向、换行行为（包括换行之前的最大控件数量）、间距和对齐属性。链（Chain）行为也可以应用于\
  \ `Flow` 布局，包括 spread（散开）、spread inside（内部散开）和 packed（打包）选项。\n\n图 18-16 表示了使用 `Flow`\
  \ 辅助实例在水平模式下布局的五个大小统一的按钮，且未设置换行：\n\n![](img/as_4.1_flow_no_wrap.jpg)\n\n图 18-16\n\
  \n图 18-17 显示了相同的按钮在水平流配置中，换行设置为每第三个控件后发生一次：\n\n![](img/as_4.1_flow_with_wrap.jpg)\n\
  \n图 18-17\n\n另一方面，图 18-18 显示了将换行设置为使用 spread inside 链模式的按钮（效果仅在第二行可见，因为第一行是满的）。该配置还设置了\
  \ `gap` 属性以增加按钮之间的间距：\n\n![](img/as_4.1_flow_chain_spread_inside.jpg)\n\n图 18-18\n\
  \n作为 `Flow` 辅助类灵活性的最后一个演示，图 18-19 显示了五个大小不同的按钮配置为水平打包链模式，并在每三个控件后换行。此外，通过设置 `horizontal-bias`\
  \ 值为 `1.0`，网格内容已右对齐（`0.0` 将导致左对齐，而 `0.5` 将使内容中对齐）：\n\n![](img/as_4.1_flow_right_align.jpg)\n\
  \n图 18-19\n\n## 18.8 Ratios（比例）\n\n控件的尺寸可以使用比例设置来定义。例如，可以使用比例设置使得无论缩放行为如何，宽度都是高度的两倍。\n\
  \n## 18.9 ConstraintLayout 的优势\n\n`ConstraintLayout` 提供了一种灵活性，允许在需要嵌套多个布局的情况下通过单个布局实例实现旧布局的许多功能。通过允许设计所谓的“扁平”或“浅层”布局层级，这避免了布局嵌套固有的问题，从而提高了运行时的用户界面性能。\n\
  \n`ConstraintLayout` 的引入也是为了解决目前存在的各种 Android 设备尺寸问题。`ConstraintLayout` 的灵活性使得设计能够适应应用程序运行设备的用户界面变得更容易。\n\
  \n最后，正如将在在 Android Studio 中使用 ConstraintLayout 指南章节中所示，Android Studio 布局编辑器已专门针对\
  \ `ConstraintLayout` 用户界面设计进行了增强。\n\n## 18.10 ConstraintLayout 的可用性\n\n尽管 `ConstraintLayout`\
  \ 是在 Android 7 中引入的，但它是作为独立的支持库从主 Android SDK 中提供的，并向下兼容到 API 9（Gingerbread）的 Android\
  \ 版本。这使得使用此布局的应用程序可以在运行较旧 Android 版本的设备上运行。\n\n## 18.11 总结\n\n`ConstraintLayout`\
  \ 是在 Android 7 中引入的布局管理器。它的设计旨在创建能够适应市场上各种 Android 设备尺寸和方向的灵活布局。`ConstraintLayout`\
  \ 使用约束来控制相对于父 `ConstraintLayout` 实例、辅助线、屏障以及布局中其他控件的对齐和定位。`ConstraintLayout` 是新创建的\
  \ Android Studio 项目的默认布局，并在设计用户界面布局时推荐使用。这种简单而灵活的布局管理方法可以轻松实现复杂的响应式用户界面。\n\n\n\n\
  \n\n正如在前章节中多次提到的那样，Google 对 `Android Studio Layout Editor` 工具进行了重大更改，其中许多更改完全是为了支持使用\
  \ `ConstraintLayout` 进行用户界面布局设计。在上一章概述了 `ConstraintLayout` 的基本概念之后，本章将更详细地探讨这些概念，同时概述\
  \ `Layout Editor` 工具如何允许设计和实现基于 `ConstraintLayout` 的用户界面。\n\n## 19.1 设计与布局视图\n\n\
  标题为“Android Studio Layout Editor 工具指南”的章节解释了，`Android Studio Layout Editor` 工具提供了两种方式来查看活动的用户界面布局，即\
  \ `Design`（设计）视图和 `Layout`（布局，也称为蓝图）视图。这些布局视图可以单独显示，也可以像图 19-1 所示那样并排显示：\n\n![](img/as_design_and_blueprint.jpg)\n\
  \n图 19-1\n\n`Design` 视图（位于上图左侧）提供了布局的“所见即所得”表示，其中布局的外观与其在运行程序中的显示一致。相反，`Layout`\
  \ 视图显示的是蓝图风格的视图，阴影边缘表示控件。如上方的图 19-1 所示，`Layout` 视图还显示了约束连接（在这种情况下，用于将按钮在布局中居中的对齐约束）。当选择布局中的特定控件或鼠标指针悬停在设计区域时，这些约束也会叠加在\
  \ `Design` 视图上，如图 19-2 所示：\n\n![](img/as_design_canvas_with_constraints.jpg)\n\n\
  图 19-2\n\n两种视图中约束连接的外观可以使用图 19-3 所示的 `View Options`（视图选项）菜单进行更改：\n\n![](img/as_layout_view_options.jpg)\n\
  \n图 19-3\n\n除了显示用户界面布局两种模式外，`Layout Editor` 工具提供了三种方法来建立特定布局设计所需的约束。\n\n## 19.2\
  \ 自动连接模式\n\n`Autoconnect`（自动连接）顾于名，会在项添加到布局时自动建立约束连接。可以使用图 19-4 所示的工具栏按钮开启或关闭 `Autoconnect`\
  \ 模式：\n\n![](img/as_layout_autoconnect.jpg)\n\n图 19-4\n\n`Autoconnect` 模式使用算法根据控件的位置以及控件与父布局两侧和其他元素的接近程度来决定建立的最佳约束。如果任何自动约束连接未能提供预期的效果，可以像本章稍后概述的那样对其进行手动修改。\n\
  \n### 19.3 推断模式\n\n`Inference`（推断）模式使用一种涉及算法和概率的启发式方法，在控件已添加到布局后自动实现约束连接。这种模式通常用于\
  \ `Autoconnect` 功能关闭且对象在没有任何约束连接的情况下被添加到布局中的场景。这允许通过从调色板将对象拖放到布局画布上进行布局设计，并不断更改尺寸和位置，直到布局符合要求。本质上，这涉及到在不担心约束的情况下“绘制”布局。`Inference`\
  \ 模式也可以在设计过程中用于填充布局中缺失的约束。\n\n点击 `Infer constraints`（推断约束）按钮（图 19-5）时，约束会自动添加到布局中：\n\
  \n![](img/as_layout_infer.jpg)\n\n图 19-5\n\n与 `Autoconnect` 模式一样，Layout Editor 工具始终存在推断错误约束的可能性，尽管可以手动修改和修正。\n\
  \n## 19.4 手动操作约束\n\n实现约束连接的第三种选择是手动进行。这样做时，理解 `Layout Editor` 工具中控件周围出现的各种句柄将帮助。例如，考虑图\
  \ 19-6 所示的控件：\n\n![](img/as_constraint_markers.jpg)\n\n图 19-6\n\n类似弹簧的线条 (A) 代表从控件侧边到目标已建立的约束连接。对象每个角的小正方形标记\
  \ (B) 是缩放句柄，点击并拖动时可缩放控件尺寸。位于控件每侧的小圆形句柄 (C) 是侧约束锚点。要创建约束连接，点击句柄并将生成的线条拖动到要连接约束的元素（例如引导线或父布局的侧边或另一个控件的侧边），如图\
  \ 19-7 所示。当连接到另一个控件的侧边时，将线条拖到该控件的侧约束句柄，并在控件和句柄高亮时释放线条：\n\n![](img/as_layout_drag_constraint.jpg)\n\
  \n图 19-7\n\n如果将约束线拖动到控件并释放但未附着到约束句柄，布局编辑器将显示一个包含可以附加约束的侧边列表。例如在图 19-8 中，约束可以附加到目标控件的顶部或底部：\n\
  \n![](img/as_constraint_drag_edges.jpg)\n\n图 19-8\n\n额外的标记表示基线约束的锚点，即使用控件内部（而非外部边缘）作为对齐点。要显示此标记，右键点击控件并选择\
  \ `Show Baseline`（显示基线）选项。要从基线约束句柄建立连接，将鼠标指针悬停在句柄上直到其高亮，然后拖向目标（如图 19-9 所示）：\n\n\
  ![](img/as_constraint_baselines.jpg)\n\n图 19-9\n\n要隐藏基线锚点，再次右键点击控件并选择 `Hide Baseline`（隐藏基线）选项。\n\
  \n## 19.5 在检查器中添加约束\n\n还可以使用图 19-10 所示的 `Attributes` 工具窗口中的 `Inspector`（检查器）面板向\
  \ `Android Studio Layout Editor` 中的视图添加约束。中间的正方形表示当前中的视图，周围的区域表示应用于视图对应侧的约束（如果有的话）：\n\
  \n![](img/as_attributes.jpg)\n\n图 19-10\n\n视图侧缺失约束由一条指向带有加号蓝色圆圈的虚线表示（如图中视图底部所示）。要添加约束，点击此蓝色圆圈，布局编辑器将添加连接到它认为的布局中最合适目标的约束。\n\
  \n## 19.6 在属性窗口中查看约束\n\n可以通过显示 `Attributes` 工具窗口的 `Constraints` 部分来查看在选中控件上配置的约束列表，如下图\
  \ 19-11 所示：\n\n![](img/as_attributes_constraints_section.jpg)\n\n图 19-11\n\n点击列表中的约束将选中设计布局中的该约束。\n\
  \n### 19.7 删除约束\n\n\n\n\n\n要删除单个约束，请在设计布局或 `Attributes` 工具窗口中选择该约束，使其呈现高亮状态（例如，在图\
  \ 19-12 中，最右侧的约束已被选中），然后按下键盘上的 delete 键。该约束将从布局中移除。\n\n![](img/as_constraint_selected.jpg)\n\
  \n图 19-12\n\n另一种选项是在按住 `Ctrl` 键（macOS 上为 `Cmd`）的同时将鼠标指针悬停在约束锚点上，并在其变为红色后点击该锚点：\n\
  \n![](img/as_constraint_anchor_delete.jpg)\n\n图 19-13\n\n或者，通过右键点击组件并选择 `Clear Constraints\
  \ of Selection`（清除选择的约束）菜单选项，移除该组件上的所有约束。\n\n要移除布局中每个组件的所有约束，请使用图 19-14 中高亮的工具栏按钮：\n\
  \n![](img/as_layout_delete_constraint.jpg)\n\n图 19-14\n\n### 19.8 调整约束偏置 (Constraint\
  \ Bias)\n\n上一节概述了使用偏置设置来倾向于某一个对立约束的概念。Android Studio 布局编辑器中的偏置通过位于 `Attributes`\
  \ 工具窗口中的 `Inspector` 进行调整，如图 19-15 所示。图中用箭头指示的两个滑块用于控制当前选中组件的垂直和水平对立约束的偏置。\n\n![](img/as_constraint_bias_sliders.jpg)\n\
  \n图 19-15\n\n# 19.9 理解 ConstraintLayout 距 (Margins)\n\n约束可以结合边距来实现组件与另一个元素（如另一个组件、引导线或父布局的侧边）之间的固定间隙。例如，考虑图\
  \ 19-16 中应用于 `Button` 对象的水平约束：\n\n![](img/as_constraint_no_margins.jpg)\n\n图 19-16\n\
  \n按照目前的配置，水平约束延伸到父 `ConstraintLayout` 的左右边缘。因此，该组件具有对立的水平约束，这意味着 `ConstraintLayout`\
  \ 布局引擎在运行时对组件的实际位置具有一定的裁量权。这使得布局具有灵活性，以适应不同的屏幕和设备方向。水平偏置设置还可以控制组件的位置一直到达布局的右侧。例如，图\
  \ 19-17 显示了应用了 100% 水平偏置的同一个按钮：\n\n![](img/as_constraint_100_bias.jpg)\n\n图 19-17\n\
  \n`ConstraintLayout` 边距可能会出现在约束连接的末端，并代表一个固定间隙，即使在调整偏置或响应活动其他部分的布局变化时，组件也无法移动到间隙内。在图\
  \ 19-18 中，右侧约束现在包含一个 `50dp` 的边距，即使偏置仍设置为 100%，组件也无法移动到该区域。\n\n![](img/as_constraint_bias_with_margin.jpg)\n\
  \n图 19-18\n\n组件上现有的边距值可以在 `Inspector` 内部修改。如图 19-19 所示，正在使用下拉菜单将当前选中组件的右边距更改为 `16dp`。或者，点击当前值也允许在字段中输入数字。\n\
  \n![](img/as_constraint_set_margin.jpg)\n\n图 19-19\n\n新约束的默认边距可以随时使用图 19-20 中高亮的工具栏选项进行更改：\n\
  \n![](img/as_constraints_default_margin.jpg)\n\n图 19-20\n\n# 19.10 对立约束和偏置的重要性\n\
  \n如上一节所述，在运行 `ConstraintLayout` 时，对立约束、边距和偏置构成了 Android 响应式布局设计的基石。当组件被施加约束但没有对立约束连接时，这些约束本质上是边距约束。这在布局编辑器工具中通过实线配合边距测量值在视觉上表示出来，如图\
  \ 19-21 所示。\n\n![](img/as_constraint_no_opposing.jpg)\n\n图 19-21\n\n上述约束将组件固定在相应位置。结果是，如果设备旋转到横屏模式，该组件将不再可见，因为垂直约束将其推出了设备屏幕顶边缘（如图\
  \ 19-22 所示）。如果应用程序运行在比设计过程中使用的屏幕更小的设备上，也会出现类似的问题。\n\n![](img/as_constraint_no_opposing_landscape.jpg)\n\
  \n图 19-22\n\n当实现对立约束时，约束连接由锯齿状弹簧线表示（弹簧比喻旨在表示组件的位置不是固定的）：\n\n![](img/as_constraints_opposing.jpg)\n\
  \n图 19-23\n\n在布局中，垂直和水平偏置设置已配置，使得组件始终位于距离底部 90% 和距离左侧 35% 的位置。因此，旋转后该组件仍然可见，且相对于屏幕尺寸的位置相同：\n\
  \n![](img/as_constraint_opposing_landscape.jpg)\n\n图 19-24\n\n在手动设计界面布局和修正自动创建的约束时，考虑偏置和对立约束很重要。\n\
  \n# 19.11 配置组件维度\n\n`ConstraintLayout` 中组件内部维度可以使用 `Inspector` 进行配置。如上一节所述，组件维度可以设置为内容自适应\
  \ (wrap content)、固定 (fixed) 或匹配约束 (match constraint)。当前选中组件的每个维度的现有设置显示在 Inspector\
  \ 中代表组件的正方形内，如图 19-25 所示：\n\n![](img/as_constraint_dimensions.jpg)\n\n图 19-25\n\n\
  上图将水平和垂直维度设置为内容自适应模式（由向内的 V 形符号表示）。inspector 使用以下视觉指示器表示三种维度模式：\n\n| 固定大小 (Fixed\
  \ Size) | ![](img/Image2826.jpg) |\n| :--- | :--- |\n| 匹配约束 (Match Constraint) |\
  \ ![](img/Image2834.jpg) |\n| 内容自适应 (Wrap Content) | ![](img/Image2844.jpg) |\n\n\
  表 19-1（注：上方表格内容根据原文由图像占位符表示）\n\n要更改当前设置，点击指示器循环切换设置。\n\n此外，可以使用 `Expand Horizontally`（水平扩展）和\
  \ `Expand Vertically`（垂直扩展）选项将组件的大小扩展到布局中约束和其他组件允许的最大值。这些选项通过右键点击布局中的组件并在生成的菜单中选择\
  \ `Organize`（组织）选项来访问（图 19-26）。使用时，当前选中的组件将水平或垂直方向增大，以填充其周围的空间。\n\n![](img/as_constraint_expand_menu.jpg)\n\
  \n图 19-26\n\n# 19.12 设计时工具定位\n\n\n\n\n标题为“Android Studio 布局编辑器指南”的章节引入了 `tools`\
  \ 命名空间的概念，并解释了如何使用它设置仅在布局编辑器中生效的可见性属性。在后台，Android Studio 还会使用 `tools` 属性在组件放置于布局上且没有约束时，将小部件保持在原有位置。例如，想象在禁用自动连接模式的情况下，向布局中放置了一个\
  \ `Button`。虽然该小部件在预览画布上似乎处于正确位置，但当运行应用程序时，它将出现在屏幕的左上角。这是因为该小部件没有约束来告诉父布局 `ConstraintLayout`\
  \ 将放置在何处。\n\n小部件在布局编辑器中似乎位于正确位置，是因为 Android Studio 设置了绝对 `X` 和 `Y` 定位 `tools` 属性，以便在添加约束之前将其保持在正确位置。在\
  \ XML 布局文件中，内容可能如下所示：\n\n```xml\n<Button\n    android:id=\"@+id/button4\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
  Button\"\n    tools:layout_editor_absoluteX=\"111dp\"\n    tools:layout_editor_absoluteY=\"\
  88dp\" />\n```\n\n一旦为小部件添加了足够的约束，布局编辑器将移除这些 `tools` 属性。一种快速识别哪些小部件缺少约束（而无需等待程序运行）的实用技巧是：点击在图\
  \ 19-27 中高亮的按钮，以切换 `tools` 位置的可见性。任何跳转到左上角的小部件都未被完全约束，它们正通过临时的 `tools` 绝对 `X` 和\
  \ `Y` 定位属性保持位置。\n\n![](img/as_constraint_tool_button.jpg)\n\n图 19-27\n\n### 19.13\
  \ 添加辅助线 (Guidelines)\n\n辅助线提供了可以锚定约束的额外元素。可以通过右键点击布局并选择 `垂直辅助线 (Vertical Guideline)`\
  \ 或 `水平辅助线 (Horizontal Guideline)` 菜单选项，或者使用工具栏菜单选项来添加辅助线，如图 19-28 所示：\n\n![](img/as_layout_guideline_menu.jpg)\n\
  \n图 19-28\n\n或者，也可以从 `调色板 (Palette)` 的 `帮助 (Helpers)` 部分拖动水平和垂直 `辅助线 (Guidelines)`，将其放置到布局画布或\
  \ `组件树 (Component Tree)` 面板中，如图 19-29 所示：\n\n![](img/as_adding_guidelines.jpg)\n\
  \n图 19-29\n\n添加后，辅助线将以虚线的形式出现在布局中，可以通过点击并拖动该线来移动。要建立到辅助线的约束连接，点击小部件的约束句柄，并在释放前将其拖动到辅助线处。在图\
  \ 19-30 中，两个 `Buttons` 的左侧通过约束连接到一条垂直辅助线。\n\n垂直辅助线的位置可以指定为距离父布局左侧或右侧的绝对距离（水平辅助线则为顶部或底部）。例如，下图中的垂直辅助线位于父布局左边缘\
  \ 97dp 处：\n\n![](img/as_constrain_guideline.jpg)\n\n图 19-30\n\n或者，辅助线也可以相对于父布局总宽度或高度的百分比进行定位。要在这三种模式之间切换，选择辅助线并点击辅助线底部或末端的圆圈（取决于辅助线是垂直还是水平）。例如，图\
  \ 19-31 显示了一个基于百分比定位的辅助线：\n\n![](img/as_adding_guideline_percent.jpg)\n\n图 19-31\n\
  \n### 19.14 添加屏障 (Barriers)\n\n可以通过右键点击布局并在 `添加帮助 (Add helpers)` 菜单中选择 `垂直屏障 (Vertical\
  \ Barrier)` 或 `水平屏障 (Horizontal Barrier)` 选项，或者使用工具栏菜单选项来添加屏障，如图 19-28 所示。或者，在 `调色板\
  \ (Palette)` 的 `帮助 (Helpers)` 部分中找到 `屏障 (Barrier)` 类型，将其拖放到布局画布或 `组件树 (Component\
  \ Tree)` 面板上。\n\n一旦在布局中添加了屏障，它将作为 `组件树` 面板中的一项出现：\n\n![](img/as_component_tree_barrier.jpg)\n\
  \n图 19-32\n\n要将视图作为引用视图（即控制屏障位置的视图），将小部件从 `组件树` 拖到屏障条目上。例如，在图 19-33 中，名为 `textView2`\
  \ 和 `textView3` 的小部件被分配为屏障的引用部件：\n\n![](img/as_barrier_reference_views.jpg)\n\n\
  图 19-33\n\n添加引用视图后，需要配置屏障以指定屏障相对于这些视图的方向。这是屏障方向设置，当在 `组件树` 面板中选中屏障时，在 `属性 (Attributes)`\
  \ 工具窗口中定义：\n\n![](img/as_barrier_direction.jpg)\n\n图 19-34\n\n下图显示了一个屏障，`textView1`\
  \ 和 `textView2` 是引用视图，`textView3` 是约束视图。屏障方向被设置为 `end`：\n\n![](img/as_3.jpg)\n\n\
  图 19-35\n\n### 19.15 添加组 (Group)\n\n要向布局添加`组 (Group)`，可以右键点击布局并在菜单中选择`组`选项，或使用如图\
  \ 19-28 所示的工具栏选项。或者，在 `调色板 (Palette)` 的 `帮助 (Helpers)` 部分中找到 `组` 项并将其拖放到画布或 `组件树`\
  \ 面板。\n\n要向组添加小部件，在 `组件树` 中选择它们并将其拖到 `组` 条目上。图 19-36 显示了三个选中的小部件被添加到组中：\n\n![](img/as_constraint_group.jpg)\n\
  \n图 19-36\n\n组引用的任何小部件在 `组件树` 中都会以斜体显示在组项下方，如图 19-37 所示。要从组中移除小部件，选择它并按下删除键：\n\n\
  ![](img/as_group_added.jpg)\n\n图 19-37\n\n一旦将小部件分配给组，可以使用 `属性 (Attributes)` 工具窗口中的\
  \ `约束 (Constraints)` 部分修改可见性设置：\n\n![](img/as_group_invisible.jpg)\n\n图 19-38\n\n\
  ## 19.16 使用流助手 (Flow Helper)\n\n流助手可以像之前提到的通过菜单或 `调色板` 添加。与 `组` 助手（图 19-36）一样，通过在\
  \ `组件树` 中将小部件拖到 `流` 实例上来添加。添加 `流` 助手并分配小部件后，在 `组件树` 中选中它，并使用 `属性 (Attribute)` 工具窗口中的\
  \ `常用属性 (Common Attributes)` 部分配置流布局行为：\n\n![](img/as_flow_attributes.jpg)\n\n图\
  \ 19-39\n\n## 19.17 小部件组的对齐与分布\n\n当布局中选择了两个或多个小部件时，Android Studio 布局编辑器提供了一系列对齐和分布操作。按\
  \ Shift 点击参与操作的小部件，右键点击布局并从 `对齐 (Align)` 菜单中显示的许多选项中进行选择：\n\n![](img/as_layout_align_menu.jpg)\n\
  \n图 19-40\n\n如下所示图 19-41，这些选项也可以通过布局编辑器工具栏上的 `对齐 (Align)` 按钮访问：\n\n![](img/as_layout_align_menu_2.jpg)\n\
  \n图 19-41\n\n\n\n\n图 19-41\n\n同样，`Pack` 菜单（图 19-42）可以用于对所选的小部件进行重新定位，使其紧密排列在一起，无论是垂直还是水平。它通过更改小部件的绝对\
  \ `x` 和 `y` 坐标来实现此点，但不会应用任何约束。另一方面，`Pack` 菜单中的两个分布选项会移动所选的小部件，使其在垂直或水平轴上均匀间隔开开，并在视图之间应用约束以保持这种间距：\n\
  \n![](img/as_layout_pack_menu.jpg)\n\n图 19-42\n\n## 19.18 将其他布局转换为 ConstraintLayout\n\
  \n对于使用一或多个其他 Android 布局类（如 `RelativeLayout` 或 `LinearLayout`）的现有用户界面布局，`Layout Editor`\
  \ 工具提供了一个将用户界面转换为使用 `ConstraintLayout` 的选项。\n\n当 `Layout Editor` 工具打开并处于 `Design`\
  \ 模式时，`Component Tree` 面板显示在 `Palette` 下方。要将布局转换为 `ConstraintLayout`，在 `Component\
  \ Tree` 中找到它，右键点击它，并选择 `Convert <current layout> to Constraint Layout` 菜单选项：\n\n\
  ![](img/as_layout_convert_view_menu.jpg)\n\n图 19-43\n\n选择此菜单选项时，`Android Studio`\
  \ 将将选定的布局转换为 `ConstraintLayout`，并使用推理来建立约束，以匹配原始布局类型的布局行为。\n\n### 19.19 总结\n\n重新设计的\
  \ `Layout Editor` 工具结合 `ConstraintLayout`，使得使用 `Android Studio` 设计复杂的用户界面布局成为一个相对快速且直观的过程。本章详细介绍了约束、外边距（margins）和偏置（bias）的概念，同时还探索了基于\
  \ `ConstraintLayout` 的设计如何集成到 `Layout Editor` 工具中。\n\n## 20. 在 Android Studio 中使用\
  \ ConstraintLayout 链（Chains）和比例\n\n之前的章节介绍了 `ConstraintLayout` 类的关键功能，并概述了在 `Android\
  \ Studio Layout Editor` 中基于 `ConstraintLayout` 的用户界面设计的最佳实践。虽然 `ConstraintLayout`\
  \ 链和比例的概念在标题为 “Android ConstraintLayout 指南” 的章节中已经概述，但我们还没有介绍如何在 `Layout Editor`\
  \ 中使用这些功能。因此，本章的重点是提供在使用 `ConstraintLayout` 类创建和管理链和比例的实用步骤。\n\n### 20.1 创建链\n\n\
  链可以通过在 Activity 的 XML 布局资源文件中添加几行代码，或使用 `Layout Editor` 的某些特定链的功能来实现。\n\n考虑一个由三个\
  \ `Button` 小部件组成的布局，它们被约束定位在 `ConstraintLayout` 父布局的左上角、顶部中央和右上角，如图 20-1](#Chains_and_Ratios.xhtml__idTextAnchor532)\
  \ 所示：\n\n![](img/as_three_button_row.jpg)\n\n图 20-1\n\n为了表示此类布局，XML 资源布局文件可能包含以下按钮小部件的条目：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n\n<Button\n\
  \    android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n按照目前的配置，没有双向约束将这些小部件分组成一条链。为了解决这个问题，需要从 `button1` 的右侧到 `button2`\
  \ 的左侧，以及从 `button3` 的左侧到 `button2` 的右侧添加额外的约束，如下：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintEnd_toStartOf=\"@+id/button2\" />\n\n<Button\n\
  \    android:id=\"@+id/button2\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\n\
  \    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    app:layout_constraintLeft_toEndOf=\"\
  @+id/button3\" />\n\n<Button\n    android:id=\"@+id/button3\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintLeft_toEndOf=\"@+id/button2\" />\n```\n*注：此处\
  \ XML 示例逻辑根据描述补全了双向约束关系以形成链。*\n\n通过这些更改，这些小部件现在有了双向约束。这在 `Layout Editor` 中通过链连接表示了一个\
  \ `ConstraintLayout` 链，如下方的图 20-2](#Chains_and_Ratios.xhtml__idTextAnchor534) 所示。注意链默认使用了散布（spread）样式。\n\
  \n![](img/as_layout_chain.jpg)\n\n图 20-2\n\n也可以通过右键点击视图并选择 `Chains -> Create Horizontal\
  \ Chain` 或 `Chains -> Create Vertical Chain` 菜单选项来创建链。\n\n### 20.2 更改链样式\n\n如果没有配置链样式，`ConstraintLayout`\
  \ 将默认使用散布样式。可以通过右键点击链中的任何小部件并选择 `Cycle Chain Mode` 来更改样式。每次点击该菜单选项，样式都会在 `spread`、`spread\
  \ inside` 和 `packed` 设置之间切换。\n\n或者，也可以在 `Attributes` 工具窗口中展开 `layout_constraints`\
  \ 属性，并根据链的方向更改 `horizontal_chainStyle` 或 `vertical_chainStyle` 属性：\n\n![](img/as_layout_chain_style.jpg)\n\
  \n图 20-3\n\n### 20.3 散布内部链样式（Spread Inside）\n\n[图 20-4 展示了使用上述技术将链样式更改为散布内部样式的效果：\n\
  \n![](img/as_layout_chain_spread_inside.jpg)\n\n图 20-4\n\n### 20.4 聚集链样式（Packed）\n\
  \n使用相同的技术，将链样式属性更改为 `packed` 会导致布局变化，如图 20-5](#Chains_and_Ratios.xhtml__idTextAnchor541)\
  \ 所示：\n\n![](img/as_layout_chain_packed.jpg)\n\n图 20-5\n\n### 20.5 带有偏置的聚集链样式\n\n\
  \n\n\n\n紧凑链（packed chain）的位置可以通过应用偏移值（bias value）来影响。偏移值介于 0.0 到 1.0 之间，其中 0.5 代表父视图中心。可以通过选择链头部控件，并在属性（Attributes）面板中为\
  \ `layout_constraintHorizontal_bias` 或 `layout_constraintVertical_bias` 属性赋值来控制偏移。图\
  \ 20-6 显示了一个水平偏移量设置为 0.2 的紧凑链：\n\n![](img/as_layout_chain_packed_bias.jpg)\n\n图\
  \ 20-6\n\n### 20.6 加权链\n\n链的最后待探索区域涉及对单个控件进行加权，以控制链中每个控件在可用空间中所占的比例。加权链只能使用扩散链（spread\
  \ chain）样式实现，并且链中任何响应权重属性的控件都必须将其相应的尺寸属性（垂直链为 `height`，水平链为 `width`）配置为匹配约束（match\
  \ constraint）模式。控件尺寸的匹配约束模式可以通过选择该控件、显示属性面板并将尺寸更改为 `match_constraint`（相当于 0dp）来配置。例如，在图\
  \ 20-7 中，按钮的 `layout_width` 约束已设置为 `match_constraint` (0dp)，表示该控件的宽度将根据现有的约束设置来确定：\n\
  \n![](img/as_match_constraints.jpg)\n\n图 20-7\n\n假设已选择扩散链样式且所有三个按钮都已配置为 `width`\
  \ 尺寸设置为匹配约束，链中的控件将等宽扩展以填充可用空间：\n\n![](img/as_layout_unweighted_chain.jpg)\n\n图 20-8\n\
  \n每个控件相对于链中其他控件所占的空间大小可以通过向控件添加权重权重属性来控制。图 20-9 显示了将 `button1` 的 `layout_constraintHorizontal_weight`\
  \ 属性设置为 4，将 `button2` 和 `button3` 的权重均设置为 2 的效果：\n\n![](img/as_layout_weighted_chain.jpg)\n\
  \n图 20-9\n\n由于这些权重值，`button1` 占据了一半的空间 (4/8)，而 `button2` 和 `button3` 各占据四分之一 (2/8)\
  \ 的空间。\n\n### 20.7 使用比例\n\nConstraintLayout 比例功能允许一个控件的尺寸相对于控件的另一个尺寸进行缩放（也称为宽高比）。例如，可以对\
  \ `ImageView` 应用宽高比设置，以确保其宽度始终是高度的两倍。\n\n尺寸比例约束的配置通过将受约束的维度设置为匹配约束模式，并将该控件上的 `layout_constraintDimensionRatio`\
  \ 属性配置为所需的比例来完成。该比例值可以指定为浮点值或 `width:height` 比例设置。例如，接的 XML 片段为 `ImageView` 控件配置了\
  \ 2:1 的比例：\n\n```xml\n<ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  100dp\"\n    android:id=\"@+id/imageView\"\n    app:layout_constraintDimensionRatio=\"\
  2:1\" />\n```\n\n上面的示例演示了当仅设置一个维度为匹配约束时如何配置比例。当两个维度都设置为匹配约束模式时，也可以应用比例。这需要在比例值前加上\
  \ `H` 或 `W`，以指示哪一个维度是相对于另一个维度受约束的。\n\n例如，考虑以下用于 `ImageView` 对象的 XML 片段：\n\n```xml\n\
  <ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"0dp\"\n\
  \    android:id=\"@+id/imageView\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintRight_toRightOf=\"parent\"\n    app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    app:layout_constraintDimensionRatio=\"\
  W,1:3\" />\n```\n\n在上面的示例中，`height` 将根据应用于其上的约束来定义。在这种情况下，配置了约束，使其连接到父视图的顶部和底部，实质上是拉伸控件以填充父视图的高度。另一方面，`width`\
  \ 维度被约束为 `ImageView` 高度的三分之一。因此，无论布局在什么尺寸的屏幕或方向上显示，`ImageView` 的高度始终与父视图相同，宽度为该高度的三分之一。\n\
  \n在不手动编辑 XML 资源文件的情况下也可以相同的结果。每当控件维度设置为匹配约束模式时，属性面板的检查器（Inspector）区域就会出现比例控制开关。例如，图\
  \ 20-10 显示按钮控件的布局 `width` 和 `height` 属性分别设置为匹配约束模式和 100dp，并高亮显示了比例控制开关：\n\n![](img/as_ratio_toggle.jpg)\n\
  \n图 20-10\n\n默认情况下，比例控制是关闭的。点击控制控件可以启用比例并显示一个可以在其中更改比例的额外字段：\n\n![](img/as_ratio.jpg)\n\
  \n图 20-11\n\n### 20.8 总结\n\n链和比例都是 `ConstraintLayout` 类的强大功能，旨在提供灵活且响应式的界面布局。如本章所述，Android\
  \ Studio 编辑器已经增强，以便在设计过程中更容易使用这些功能。\n\n## 21. Android Studio 编辑器教程\n\n使用布局器设计 Android\
  \ 应用程序最简单且最高效的方法是使用布局编辑器。本章将提供使用该方法创建用户界面的概述。本章包含的练习也将作为从基础 Android 项目开始的机会。在介绍了布局编辑器之后，本章还将引入布局检查器。\n\
  \n### 21.1 Android Studio 布局示例\n\n示例阶段的第一步是创建一个 Android 项目。启动 Android Studio 并通过\
  \ `File` -> `Close Project` 关闭任何已打开的项目。\n\n在欢迎界面上选择 `New Project` 选项，选择 `Empty Views\
  \ Activity` 模板并点击 Next。在 `Name` 字段中输入 `LayoutSample`，并将包名指定 `com.ebookrenzy.layoutsample`。在点击\
  \ `Finish` 按钮之前，将 `Minimum API` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 更改为\
  \ `Java`。\n\n\n\n\n\n在 Android Studio 中，显示 `Resource Manager` 工具窗口（`View -> Tool\
  \ Windows -> Resource Manager`）。在你操作系统的文件系统导航器中找到 `GalaxyS23.webp` 图像，并将其拖到 `Resource\
  \ Manager` 工具窗口中。在弹出的对话框中，点击 `Next`，然后点击 `Import` 按钮，将图像添加到项目中。该图像现在应该出现在 `Resource\
  \ Manager` 中，如下方的 图 21-2 所示：\n\n![](img/as_resource_manager.jpg)\n\n图 21-2\n\n该图像也会出现在\
  \ `Project` 工具窗口的 `res -> drawables` 部分：\n\n![](img/as_layout_sample_image_added.jpg)\n\
  \n图 21-3\n\n### 21.3 将控件添加到用户界面\n\n从 `Common` 调色板类别中，将一个 `ImageView` 对象拖到显示视图的中心位置。注意，此时会出现水平和垂直虚线，表示显示的中心轴。当对齐中心时，释放鼠标按钮将视图放置在指定位置。一旦放置在布局中，将出现\
  \ `Resources` 对话框，请求在视图显示的图像。在对话框顶部的搜索栏中输入“galaxy”以找到 `galaxys6.png` 资源，如 图 21-4\
  \ 所示：\n\n![](img/as_pick_a_resource.jpg)\n\n图 21-4\n\n选择图像并点击 `OK` 将其分配给 `ImageView`\
  \ 对象。如有必要，使用缩放句柄调整 `ImageView` 的大小，并将其重新定位在布局的中心。此时，布局应与 图 21-5 Consistent：\n\n\
  ![](img/as_layout_sample_image_layout.jpg)\n\n图 21-5\n\n从调色板的 `Common` 部分点击并拖动 `TextView`\
  \ 对象，并将其放置在 `ImageView` 上方，如 图 21-6 所示：\n\n![](img/as_layout_sample_textview.jpg)\n\
  \n图 21-6\n\n使用 `Attributes` 面板，展开 `Common Attributes` 部分中的 `textAppearance` 属性项，将\
  \ `textSize` 属性更改为 `24sp`，将 `textAlignment` 设置为 `center`，并将文本改为“Samsung Galaxy S23”。\n\
  \n![](img/as_layout_sample_textview.jpg)\n\n图 21-6\n\n接下来，在布局底部添加三个 `Button` 控件，并将这些视图的\
  \ `text` 属性设置为“Buy Now”、“Pricing”和“Details”。完成后的布局现在应与 图 21-7 一致：\n\n![](img/as_layout_sample_full_ui.jpg)\n\
  \n图 21-7\n\n此时，控件的约束还不足以让布局引擎能够在运行期间对控件进行定位和调整大小。如果现在运行应用程序，所有控件都将位于显示器的左上角。\n\n\
  将控件添加到布局后，使用位于 `Layout Editor` 工具栏中的设备旋转菜单（如 图 21-8 中的箭头所示）来横向查看用户界面：\n\n![](img/as_layout_rotate.jpg)\n\
  \n图 21-8\n\n缺少约束会导致布局无法适应设备方向的变化，导致内容偏离中心，并且图像部分以及所有三个按钮都定位在屏幕可视区域之外。要使其成为一个响应式用户界面，仍需进行一些工作。\n\
  \n### 21.4 添加约束\n\n约束是创建适应设备方向变化和不同屏幕尺寸布局的关键。首先，将布局旋转回竖屏模式，并选择 `ImageView` 上方的 `TextView`\
  \ 控件。选中控件后，从 `TextView` 的左侧、右侧和顶部建立到父级 `ConstraintLayout` 相应侧边的约束，如 图 21-9 所示。将顶部约束的间距设置为\
  \ `16`：\n\n![](img/as_layout_sample_textview_constraints.jpg)\n\n图 21-9\n\n约束好 `TextView`\
  \ 控件后，选择 `ImageView` 实例并在左右两侧建立对立约束，每个约束都连接到父布局的相应侧边。接下来，建立从 `ImageView` 顶部到 `TextView`\
  \ 底部的约束，以及从 `ImageView` 底部到中心 `Button` 控件顶部的约束。如有必要，点击并拖动 `ImageView` 以保持其位于布局的垂直中心。\n\
  \n在仍选中 `ImageView` 的情况下，使用 `attributes` 面板中的 `Inspector` 将 `ImageView` 的顶部和底部边距分别更改为\
  \ `24` 和 `8`，并将控件的高度和宽度维度属性均改为 `match_constraint`，以便控件能够调整大小以匹配约束。这些设置将允许布局引擎在需要时放大或缩小\
  \ `ImageView` 的大小以适应布局变化：\n\n![](img/as_layout_sample_constraints.jpg)\n\n图 21-10\n\
  \n图 21-11 显示了 `ImageView` 相对于布局中其他元素的当前实现约束：\n\n![](img/as_layout_sample_constraints.jpg)\n\
  \n图 21-11\n\n最后的任务是为三个 `Button` 控件添加约束。对于此示例，按钮将以链（Chain）的形式放置。首先在 `Layout Editor`\
  \ 中开启 `Autoconnect`（如 图 21-1 所示）。\n\n接下来，点击 `Buy Now` 按钮，然后按 Shift 点击其他按钮以选取三个。右键点击\
  \ `Buy Now` 按钮并选择 `Chains -> Create Horizontal Chain` 。默认情况下，链将使用 `spread` 样式，这符合示例要求。最后，在\
  \ `Buy Now` 按钮与布局底部之间建立间距为 `8` 的约束。对剩余按钮重复此步骤。完成完成后，按钮应如 图 21-12 所示进行约束：\n\n![](img/as_layout_sample_chain.jpg)\n\
  \n图 21-12\n\n21.5 测试布局\n\n向布局添加约束后，将屏幕旋转到横屏，验证布局是否适应新尺寸。\n\n虽然 `Layout Editor` 工具提供了一个设计用户界面的良好环境，但在测试方面，没有任何可以替代运行应用程序。在物理\
  \ Android 设备或模拟器会话上启动应用程序，验证用户界面是否反映了在 `Layout Editor` 中创建的布局。例如，图 21-13 显示了横屏模式下的应用程序：\n\
  \n![](img/as_layout_sample_landscape.jpg)\n\n图 21-13\n\n用户界面设计现在已完成。设计更复杂的用户界面布局是上述步骤的延续。根据需要将视图拖放到屏幕，定位、约束并设置属性。\n\
  \n21.6 使用 Layout Inspector\n\n可以使用 `Layout Inspector` 工具查看组成用户界面布局的层次结构。应用程序必须在运行\
  \ Android API 29 或更高版本的设备或模拟器上运行才能访问此类信息。一旦应用程序运行，选择 `Tools -> Layout Inspector`\
  \ 菜单选项，然后选择要检查的过程，如 图 21-14 中标记为 A 的菜单所示。\n\n一旦检查器加载，左侧面板 (A) 显示组成用户界面布局的组件层次结构。中间面板\
  \ (B) 可视化地表示布局设计。点击视觉布局中的控件将使该项在层次列表中亮起，从而轻松找到视觉组件相对于整个布局层次结构中的位置。\n\n\n\n\n\n右侧面板（在图\
  \ 21-14 中标记为 C）包含当前选中组件的所有属性设置，允许对组件的内部配置进行深度分析。在适当的情况下，值单元格将包含指向项目源代码中属性设置位置的链接。\n\
  \n![](img/as_layout_sample_layout_inspector.jpg)\n\n图 21-14\n\n要以 3D 视图布局，请点击标记为\
  \ D 的按钮。这将显示层级的“展开”表示，以便对其进行旋转和检查。这对于识别遮挡的视图等任务非常有用：\n\n![](img/as_layout_sample_layout_inspector_3d.jpg)\n\
  \n图 21-15\n\n点击并拖动渲染内容以进行三维旋转，使用上方箭头指示的滑块来增加层之间的间距。再次点击标记为 D 的按钮返回 2D 视图。\n\n##\
  \ 21.7 总结\n\nAndroid Studio 中的布局编辑器工具与 `ConstraintLayout` 类已紧密集成。本章通过创建一个示例用户界面，概述了如何使用布局编辑器工具添加小部件并设置约束，来实现基于\
  \ `ConstraintLayout` 的用户界面。本章还介绍了实时布局检查器工具，它对于分析用户界面布局的结构组成非常有用。\n\n## 22. 在 Android\
  \ Studio 中手动设计 XML 布局\n\n虽然使用 Android Studio 布局编辑器工具设计布局大大提高了效率，但仍然可以通过手动编辑底层 XML\
  \ 来创建 XML 布局。本章将介绍 Android XML 布局格式的基础知识。\n\n### 22.1 手动创建 XML 布局\n\nXML 布局文件的结构非常简单，遵循视图树的层次结构方法。XML\
  \ 资源文件的第一行理想情况下包含以下标准声明：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  ```\n\n该声明之后之后应该是布局的根元素，通常是一个容器视图（如布局管理器）。它由起始标签和结束标签以及任何需要在视图上设置的属性表示。例如，下面的 XML\
  \ 将 `ConstraintLayout` 视图声明为根元素，并设置 `match_parent` 属性，使其填充设备显示的所有可用空间：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingTop=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n在上面的示例中，布局元素还在每个侧配置了\
  \ 16dp（密度无关像素）的内边距。Android 布局中的任何间距规范都必须使用以下测量单位之一：\n\n*   `in` – 英寸。\n*   `mm`\
  \ – 毫米。\n*   `pt` – 磅（1/72 英寸）。\n*   `dp` – 密度无关像素。一种基于设备显示物理密度相对于 160dpi 显示基准的抽象测量单位。\n\
  *   `sp` – 比例无关像素。与 `dp` 类似，但根据用户的字体偏好进行缩放。\n*   `px` – 实际屏幕像素。不建议使用，因为不同的显示每英寸像素不同。建议使用\
  \ `dp` 而非此单位。\n\n任何需要添加到 `ConstraintLayout` 父元素的子元素必须嵌套在起始标签和结束标签之间。在接下来的示例中，添加了一个\
  \ `Button` 小部件作为 `ConstraintLayout` 的子元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <Button\n        android:text=\"My Button\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+id/button\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\
  按照目前的实现，`button` 没有约束连接。因此，在运行时，`button` 将出现在屏幕的左上角（尽管由于父元素分配的内边距缩进了 16dp）。然而，如果向\
  \ `button` 的两侧添加相对的约束，它将显示在布局正中：\n\n```xml\n<Button\n    android:text=\"My Button\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:id=\"@+id/button\"\n    app:layout_constraintBottom=\"parent\"\n \
  \   app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\" />\n```\n\n要向 `ConstraintLayout` 添加第二个小部件，应将其嵌入 `ConstraintLayout` 的主体内。例如，下面的修改添加了一个\
  \ `TextView`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingRight=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n    <Button\n        android:text=\"My Button\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+id/button\"\n        app:layout_constraintBottom=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n    <!-- 此处添加 TextView -->\n>\n```\n\n再次，新添加的 `TextView` 缺少约束将导致它在运行时出现在布局的左上角。接下来的修改通过向父布局添加相对约束来使其水平居中，同时添加一个连接\
  \ `TextView` 底部到 `button` 顶部的约束：\n\n```xml\n<TextView\n    android:text=\"My Text\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:id=\"@+id/textView\"\n    android:layout_marginTop=\"8dp\"\n    android:layout_marginBottom=\"\
  8dp\"\n    app:layout_constraintBottom_toTopOf=\"@+id/button\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n此外，注意 `Button` 和 `TextView` 视图声明了多个属性。两个视图都分配了 ID，并配置为显示名为 `button_string`\
  \ 和 `text_string` 的字符串资源。此外，两个对象都声明了 `wrap_content` 高和宽属性，以便它们的大小能够适应内容（在此情况下，为字符串资源值引用的文本）。\n\
  \n在布局编辑器设计模式的预览面板中查看，上述布局将呈现如图 22-1 所示所示：\n\n\n\n\n\n# 图 22-1\n\n## 22.2 手动编写 XML\
  \ 与 可视化布局设计\n\n在设计模式下使用 `Layout Editor` 工具还是手动编写 XML，取决于个人的偏好。然而，使用设计模式有其独特的优势。\n\
  \n首先，设计模式通常会更快，因为避免了输入 XML 行的需要。此外，设计模式还避免了学习 `Android SDK` 视图类中各种属性值的复杂细节。不需要不断查阅\
  \ Android 文档来查找正确的关键字和值，大多数属性都可以通过 `Attributes`（属性）面板来找到。\n\n抛开设计模式的所有优势不谈，重要的是，用户界面设计的这两种方法并非完全不是互斥的。作为一名应用开发者，你可能会在设计模式下创建用户界面，同时通过直接编辑生成的\
  \ XML 资源对设计进行微调和布局调整。界面设计的两种视图在 `Android Studio` 环境中并排显示，这使得在 XML 和视觉布局之间进行无缝工作变得非常简单。\n\
  \n### 22.3 总结\n\n`Android Studio Layout Editor` 工具提供了一种视觉直观的方法来设计用户界面。通过使用拖放范式结合一组属性编辑器，该工具为应用开发者带来了显著的生产力优势。\n\
  \n用户界面设计也可以通过手动编写 XML 布局资源文件来实现，其格式结构良好且易于理解。\n\n`Layout Editor` 工具生成 XML 资源文件的事实意味着，这两种界面设计方法可以结合起来，为用户界面开发提供一种“两者兼得”的方法。\n\
  \n## 23. 使用约束集管理约束\n\n到本书目前为止，所有的用户界面设计任务都是使用 `Android Studio Layout Editor` 工具完成的，无论是使用文本模式还是设计模式。编写\
  \ XML 资源文件或使用 `Android Studio Layout Editor` 的替代方案是编写 Java 代码来直接创建、配置和操作组成 Android\
  \ `activity` 用户界面的视图对象。本章将在描述编写 Java 代码创建用户界面的某些优缺点之前，先探索一些如视图属性以及布局约束的创建和管理等关键概念。\n\
  \n在下一章中，将创建并使用一个示例项目，以演示这种 Android 用户界面创建方法中涉及的一些典型步骤。\n\n### 23.1 Java 代码与 XML\
  \ 布局文件\n\n使用 XML 资源文件设计用户界面比编写 Java 代码具有许多优势。事实上，Google 在 Android 文档中花费了大量篇幅来赞扬\
  \ XML 资源优于 Java 代码的优点。如前一节所述，XML 方法的一个关键优势是使用 `Android Studio Layout Editor` 工具，它可以生成\
  \ XML 资源。另一个优势是，一旦创建了应用程序，就可以通过修改 XML 文件更改用户界面屏幕，从而避免重新编译应用程序。此外，即使是手动编写 XML 布局，也可以通过\
  \ `Android Studio Layout Editor` 工具的预览功能获取用户界面外观的即时反馈。要测试由 Java 创建的用户界外观，开发者不可避免地需要经历编写代码、编译和测试的循环以完成设计工作。\n\
  \n关于使用 Java 代码创建布局的优势，Java 优于 XML 资源文件的最显著优势在处理动态用户界面时显现出来。XML 资源文件在定义静态布局时本质上最有用，因为静态布局在每次调用\
  \ `activity` 时不太可能发生显著变化。相反，Java 代码非常适合在运行时动态创建用户界面。当用户界面受外部因素影响而在每次执行 `activity`\
  \ 时显示得不同时，这一点尤为有用。\n\n当在 `activity` 运行时实时对基于静态 XML 资源的布局进行动态更改时，在 Java 代码中操作用户界面组件的知识也会很有用。\n\
  \n最后，某些开发者更倾向于编写 Java 代码而不是使用布局工具和 XML，无论后两种方法提供了哪些优势。\n\n### 23.2 创建视图\n\n如前所述，`Android\
  \ SDK` 包含一个视图类工具箱以满足大多数基本的用户界面设计需求。在 Java 中创建视图就是创建这些类的实例，并传递与该视图关联的 `activity`\
  \ 引用作为参数。\n\n第一个视图（通常是一个可以添加额外子视图的容器视图）通过调用 `activity` 的 `setContentView()` 方法显示给用户。可以通过调用对象的\
  \ `addView()` 方法向根视图添加额外的视图。\n\n当使用 Java 代码操作包含在 XML 布局资源文件中的视图时，必须获取视图的 ID。对于在\
  \ Java 中创建的视图也遵循相同的规则。因此，对于在后续 Java 代码中需要某些类型访问的任何视图，必须为其分配一个 ID。这通过调用相关视图对象的 `setId()`\
  \ 方法来实现。在随后的代码中，可以通过对象的 `getId()` 方法获取视图的 ID。\n\n### 23.3 视图属性\n\n每个视图类都关联有一系列属性。这些属性设置直接设置在视图实例上，通常定义了视图对象将如何显示或行为。属性的示例包括显示在\
  \ `Button` 对象上的文本或 `ConstraintLayout` 视图的背景颜色。`Android SDK` 中的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以在 Java 代码内部调用它，将按钮上显示的文本设置为特定的字符串值。相反，`ConstraintLayout`\
  \ 对象的背景颜色可以通过调用对象的 `setBackground()` 方法设置。\n\n### 23.4 约束集\n\n属性设置是视图内部的，决定了视图的外观，而约束集则控制视图相对于父视图和其他兄弟视图的外观。每个\
  \ `ConstraintLayout` 实例都关联一组约束，定义了其子视图的定位和约束情况。\n\n在 Java 代码中处理约束集的关键是 `ConstraintSet`\
  \ 类。该类包含一系列方法，允许对 `ConstraintLayout` 实例进行创建、配置和应用约束。此外可以将 `ConstraintLayout` 实例的当前约束复制到\
  \ `ConstraintSet` 对象中并应用到其他布局（无论是否经过修改）。\n\n`ConstraintSet` 实例的创建就像任何其他对象一样：\n\n\
  ```java\nConstraintSet set = new ConstraintSet();\n```\n\n一旦创建了约束集，就可以调用该实例的方法来执行广泛的任务。\n\
  \n#### 23.4.1 建立连接\n\n`ConstraintSet` 类的 `connect()` 方法用于建立视图之间的约束连接。以下代码配置了一个约束集，其中\
  \ `Button` 视图的左侧连接到 `EditText` 视图的右侧，间距为 70dp：\n\n```java\nset.connect(button1.getId(),\
  \ ConstraintSet.LEFT,\n           editText1.getId(), ConstraintSet.RIGHT, 70);\n\
  ```\n\n#### 23.4.2 将约束应用到布局\n\n\n\n\n一旦配置了约束集（constraint set），必须将其应用到 `ConstraintLayout`\
  \ 实例上才能生效。约束集是通过调用 `applyTo()` 方法应用的，并传递一个要应用设置的布局对象的引用：\n\n```\nset.applyTo(myLayout);\n\
  ```\n\n### 23.4.3 父级约束连接\n\n通过引用 `ConstraintSet.PARENT_ID` 常量，也可以建立子视图与其父级 `ConstraintLayout`\
  \ 之间的连接。在接下来的示例中，配置约束集将一个 `Button` 视图的顶部边缘连接到父布局的顶部，并留有 100dp 的间距：\n\n```java\n\
  set.connect(button1.getId(), ConstraintSet.TOP,\n            ConstraintSet.PARENT_ID,\
  \ ConstraintSet.TOP, 100);\n```\n\n#### 23.4.4 尺寸约束\n\n提供了多种方法来控制视图的尺寸行为。例如，以下代码将\
  \ `Button` 视图的水平尺寸设置为 `wrap_content`，并将 `ImageView` 实例的垂直尺寸设置为最大 250dp：\n\n```java\n\
  set.constrainWidth(button1.getId(), ConstraintSet.WRAP_CONTENT);\nset.constrainMaxHeight(imageView1.getId(),\
  \ 250);\n```\n\n#### 23.4.5 约束偏移\n\n正如“在 Android Studio 中使用 ConstraintLayout 的指南章节概述的，当视图具有对立的约束时，它将沿着约束轴居中（即水平或垂直方向）。可以通过在特定的约束轴上应用偏移（bias）来调整这种居中位置。在使用\
  \ Android Studio 布局编辑器时，可以通过属性（Attributes）工具窗口中的控件来实现。然而，在使用约束集时，可以使用 `setHorizontalBias()`\
  \ 和 `setVerticalBias()` 方法添加偏移，引用视图 ID 和作为 0 到 1 之间的浮点值的偏移值。\n\n例如，以下代码先将 `Button`\
  \ 的左侧和右侧连接到父布局的对应侧，然后应用 25% 的水平偏移：\n\n```java\nset.connect(button1.getId(), ConstraintSet.LEFT,\n\
  \            ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\nset.connect(button1.getId(),\
  \ ConstraintSet.RIGHT,\n            ConstraintSet.PARENT_ID, ConstraintSet.RIGHT,\
  \ 0);\nset.setHorizontalBias(button1.getId(), 0.25f);\n```\n\n#### 23.4.6 对齐约束\n\
  \n也可以使用约束集应用对齐设置。Android Studio 布局编辑器中提供的全套对齐选项也可以通过 `centerVertically()` 和 `centerHorizontally()`\
  \ 方法使用约束集进行配置，这两个方法都根据正在配置的对齐方式接受不同的参数。此外，可以使用 `center()` 方法将视图在两个其他视图之间居中。\n\n\
  在下面的代码中，`button2` 的位置设置使其与 `button1` 水平对齐：\n\n```java\nset.centerHorizontally(button2.getId(),\
  \ button1.getId());\n```\n\n### 23.4.7 复制和应用约束集\n\n可以使用 `clone()` 方法将 `ConstraintLayout`\
  \ 实例当前的约束集复制到约束集对象中。例如，下行代码将名为 `myLayout` 的 `ConstraintLayout` 实例的约束设置复制到约束集对象：\n\
  \n```java\nset.clone(myLayout);\n```\n\n一旦完成复制，可以将约束集直接应用到另一个布局，或者像接下来的示例那样在应用到第二个布局之前进行修改：\n\
  \n```java\nConstraintSet set = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(mySecondLayout);\n```\n\n### 23.4.8\
  \ ConstraintLayout 链 (Chains)\n\n也可以使用 `createHorizontalChain()` 和 `createVerticalChain()`\
  \ 方法在约束集内部创建垂直和水平链。使用这些方法的语法如下：\n\n```java\ncreateHorizontalChain(int leftId, int\
  \ leftSide, int rightId,\n                      int rightSide, int[] chainIds, float[]\
  \ weights, int style);\n```\n\n根据上述语法，以下示例创建了一个从 `button1` 开始到 `button4` 结束的水平散布链（spread\
  \ chain）。在这些视图之间是 `button2` 和 `button3`，它们的权重都设置为零：\n\n```java\nint[] chainViews\
  \ = {button2.getId(), button3.getId()};\nfloat[] chainWeights = {0, 0};\nset.createHorizontalChain(button1.getId(),\
  \ ConstraintSet.LEFT,\n                          button4.getId(), ConstraintSet.RIGHT,\n\
  \                          chainViews, chainWeights, ConstraintSet.SPREAD);\n```\n\
  \n#### 23.4.9 引导线 (Guidelines)\n\n使用 `create()` 方法向约束集添加引导线，然后使用 `setGuidelineBegin()`、`setGuidelineEnd()`\
  \ 或 `setGuidelinePercent()` 方法进行定位。在接下来的代码中，创建了一个垂直引导线并将其放置在父布局宽度的 50% 处。然后将按钮视图的左侧连接到该引导线，且没有间距：\n\
  \n```java\nset.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDELINE);\nset.setGuidelinePercent(R.id.myGuideline,\
  \ 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT,\n            ConstraintSet.PARENT_ID,\
  \ ConstraintSet.RIGHT, 0);\n```\n\n#### 23.4.10 移除约束\n\n使用 `clear()` 方法从约束集中移除视图的约束，并传入视图\
  \ ID 和要移除约束的锚点：\n\n```java\nset.clear(button.getId(), ConstraintSet.LEFT);\n```\n\
  \n同样，可以通过在 `clear()` 方法中引用视图来移除视图的所有约束：\n\n```java\nset.clear(button.getId());\n\
  ```\n\n#### 23.4.11 缩放\n\n可以使用 `setScaleX()` 和 `setScaleY()` 方法调整布局内视图的缩放，这两个方法接收执行操作的视图以及表示缩放的浮点值。在接下来的代码中，一个按钮被缩放为原始宽度的两倍和高度的一半：\n\
  \n```java\nset.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(),\
  \ 0.5f);\n```\n\n#### 23.4.12 旋转\n\n可以使用 `setRotationX()` 和 `setRotationY()` 方法分别旋转视图，这两个方法都接收视图\
  \ ID 以及表示旋转角度的浮点值。旋转执行的中心点可以通过调用 `setTransformPivot()`、`setTransformPivotX()` 和\
  \ `setTransformPivotY()` 方法来定义。以下代码以位于 (500, 500) 点的中心点绕 Y 轴旋转 30 度：\n\n```\nset.setTransformPivot(button.getId(),\
  \ 500, 500);\nset.setRotationY(button.getId(), 30);\nset.applyTo(layout);\n```\n\
  \n在涵盖了从 Java 代码创建约束集和用户界面的理论后，下一章节将通过创建一个示例来将这些理论付实践。有关 `ConstraintSet` 类的更多信息，请参考以下\
  \ URL 中的参考指南：\n\n[`developer.android.com/reference/androidx/constraintlayout/widget/ConstraintSet`](https://developer.android.com/reference/androidx/constraintlayout/widget/ConstraintSet)\n\
  \n### 23.5 总结\n\n除了编写 XML 布局资源文件或使用 Android Studio 布局编辑器外，也可以在 Java 代码中动态创建 Android\
  \ 用户界面。\n\n在 Java 代码中创建布局包括创建类实例，并在这些对象上设置属性以定义所需的显示和行为。\n\n\n\n视图相对于其 `ConstraintLayout`\
  \ 父视图以及任何兄弟视图的位置和大小是通过约束集（constraint sets）定义的。约束集由 `ConstraintSet` 类的实例表示，该实例一旦创建，就可以使用广泛的方法调用来完成配置，以执行诸如建立约束连接、控制视图缩放行为以及创建链（chains）等任务。\n\
  \n在本章介绍 `ConstraintSet` 类的基础知识后，下一章将通过一个教程来将这些功能付诸实践。\n\n# 24. Android ConstraintSet\
  \ 教程\n\n上一节介绍了在 Java 代码中使用通过 `ConstraintLayout` 和 `ConstraintSet` 类创建和修改用户界面布局的基本概念。本章将通过创建一个完全在\
  \ Java 代码中创建且不使用 Android Studio 布局编辑器工具的示例布局，将这些概念付诸实践。\n\n## 24.1 在 Android Studio\
  \ 中创建示例项目\n\n启动 Android Studio，并在欢迎界面上选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，点击 `Next`（下一步）按钮之前，选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name`（名称）字段中输入 `JavaLayout`，并指定 `com.ebookfrenzy.javalayout`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26: Android\
  \ 8.0 (Oreo)`并将`Language`（语言）菜单设置为 `Java`。\n\n项目创建完成后，`MainActivity.java` 文件应自动加载到编辑面板。正如我们预期的那样，Android\
  \ Studio 创建了一个模板 Activity 并重写了 `onCreate()` 方法，为添加 Java 代码以创建用户界面提供了一个理想的位置。\n\n\
  ## 24.2 向 Activity 添加视图\n\n目前 `onCreate()` 方法被设计为使用资源布局文件作为用户界面。因此，首先从该方法中删除以下行：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    EdgeToEdge.enable(this);\n    setContentView(R.layout.activity_main);\n\
  \    ViewCompat.setOnApplyWindowInsetsListener(findViewById(R.id.main),\n      \
  \         (v, insets) -> {\n            Insets systemBars =\n                insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  \            v.setPadding(systemBars.left, systemBars.top,\n                   \
  \      systemBars.right, systemBars.bottom);\n            return insets;\n     \
  \   });\n}\n```\n\n下一次修改是向 Activity 添加一个带有单个 `Button` 视图子元素的 `ConstraintLayout`\
  \ 对象。这涉及创建 `ConstraintLayout` 和 `Button` 类的新实例。然后，需要将 `Button` 视图作为子视图添加到 `ConstraintLayout`\
  \ 视图中，随后通过调用 Activity 实例的 `setContentView()` 方法进行显示：\n\n```java\npackage com.ebookfrenzy.javalayout;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import androidx.constraintlayout.widget.ConstraintLayout;\nimport android.widget.Button;\n\
  import android.widget.EditText;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        configureLayout();\n    }\n\
  \n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n当以这种方式创建用户界面对象的新实例时，必须向构造方法传递创建该对象的上下文（context），在本例中就是当前的\
  \ Activity。由于上述代码位于 Activity 类内部，因此通过标准的 `this` 关键字引用上下文：\n\n```java\nButton myButton\
  \ = new Button(this);\n```\n\n完成上述添加后，编译并运行应用程序（在物理设备或模拟器上）。启动后，可见的结果结果是在 `ConstraintLayout`\
  \ 视图的左上角出现一个没有任何文本的按钮，如图 24-1 所示：\n\n![](img/Image2435.jpg)\n\n图 24-1\n\n### 24.3\
  \ 设置视图属性\n\n对于这个练习，我们需要 `ConstraintLayout` 视图的背景为蓝色，并让 `Button` 视图在黄色背景上显示“Press\
  \ Me”（点击我）的文本。这些任务可以通过如下代码片段所示，在 Java 代码中对视图进行设置属性来实现。为了让按钮上的文本能够轻松翻译成其他语言，将将其作为\
  \ String 资源添加。在 Project 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件并修改它，为“Press\
  \ Me”字符串添加一个资源值：\n\n```xml\n<resources>\n    <string name=\"app_name\">JavaLayout</string>\n\
  \    <string name=\"press_me\">Press Me</string>\n</resources>\n```\n\n虽然这是处理代码中直接引用字符串推荐方法，但许多后续代码示例将直接在代码中输入字符串，避免在书籍剩余部分重复此步骤。\n\
  \n一旦字符串存储为资源，就可以如下从代码内部访问它：\n\n```java\ngetString(R.string.press_me);\n```\n\n创建字符串资源后，向\
  \ `configureLayout()` 方法添加代码以设置按钮的文本和颜色属性：\n\n```java\nimport android.graphics.Color;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n        setContentView(myLayout);\n\
  \    }\n}\n```\n（注：此节提供的代码是碎片化的，已为了清晰进行了重构）。\n\n## 24.4 创建视图 ID\n\n当布局完成后，它将包含一个\
  \ `Button` 和一个 `EditText` 视图。在 `ConstraintSet` 类的方法引用这些视图之前，必须为它们分配唯一的 ID。此过程的第一步是创建一个包含这些\
  \ ID 的资源文件。\n\n右键点击 `app -> res -> values` 文件夹，选择 `New -> Values Resource File`（新建资源文件）选项，并将资源文件命名为\
  \ `id.xml`。创建资源文件后，将其修改为：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <resources>\n    <item name=\"myButton\" type=\"id\" />\n    <item name=\"myEditText\"\
  \ type=\"id\" />\n</resources>\n```\n\n在教程的此时只创建了 `Button`，因此编辑 `configureLayout()`\
  \ 方法为对象分配相应的 ID：\n\n```java\nprivate void configureLayout() {\n    Button myButton\
  \ = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n   \
  \ myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  }\n```\n\n## 24.5 配置约束集 在没有约束的情况下，`ConstraintLayout` 视图将 `Button` 视图放在显示器的左上角。为了指示布局视图将按钮放置在不同位置（在本例中为水平和垂直居中），需要创建一个\
  \ `ConstraintSet` 实例，使用适当设置对其初始化并将其应用于父布局。\n\n对于此示例，需要配置按钮，使其宽度和高度受限于显示的文本大小，并将视图在父布局中居中。再次编辑\
  \ `configureLayout()` 方法以进行这些更改：\n\n```java\nimport androidx.constraintlayout.widget.ConstraintSet;\n\
  \nprivate void configureLayout() {\n    Button myButton = new Button(this);\n}\n\
  ```\n\n\n\n```java\nmyButton.setText(getString(R.string.press_me));\nmyButton.setBackgroundColor(Color.YELLOW);\n\
  myButton.setId(R.id.myButton);\nConstraintLayout myLayout = new ConstraintLayout(this);\n\
  myLayout.setBackgroundColor(Color.BLUE);\nmyLayout.addView(myButton);\nsetContentView(myLayout);\n\
  ConstraintSet set = new ConstraintSet();\nset.constrainHeight(myButton.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainWidth(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.connect(myButton.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START,\
  \ 0);\nset.connect(myButton.getId(), ConstraintSet.END, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myButton.getId(), ConstraintSet.TOP, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.TOP, 0);\nset.connect(myButton.getId(), ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.BOTTOM, 0);\nset.applyTo(myLayout);\n```\n\n配置好初始约束后，编译并运行应用程序，验证\
  \ `Button` 视图现在是否出现在布局的中心：\n\n![](img/Image2444.jpg)\n\n图 24-2\n\n## 24.6 添加 EditText\
  \ 视图\n\n下一个要添加到布局中的项是 `EditText` 视图。第一步是创建 `EditText` 对象，按照 `id.xml` 资源文件中声明的分配\
  \ ID，并将其添加到布局中。现在需要对 `configureLayout()` 方法进行如下代码更改来实现这些步骤：\n\n```java\nprivate\
  \ void configureLayout() {\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  \    EditText myEditText = new EditText(this);\n    myEditText.setId(R.id.myEditText);\n\
  \    ConstraintLayout myLayout = new ConstraintLayout(this);\n    myLayout.setBackgroundColor(Color.BLUE);\n\
  \    myLayout.addView(myButton);\n    myLayout.addView(myEditText);\n    setContentView(myLayout);\n\
  }\n}\n```\n\n`EditText` 小组件旨在根据其显示的内容调整大小，在布局中水平居中，并位于现有 `Button` 视图上方 70dp 处。向\
  \ `configureLayout()` 方法添加代码，使其内容如下：\n\n```java\nset.connect(myButton.getId(), ConstraintSet.START,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\nset.constrainHeight(myEditText.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainWidth(myEditText.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.connect(myEditText.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START,\
  \ 0);\nset.connect(myEditText.getId(), ConstraintSet.END, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myEditText.getId(), ConstraintSet.BOTTOM,\
  \ myButton.getId(), ConstraintSet.TOP, 70);\nset.applyTo(myLayout);\n```\n\n应用程序的测试运行应显示\
  \ `EditText` 字段在按钮上方居中，并有 70dp 的间距。\n\n## 24.7 将密度无关像素 (dp) 转换为像素 (px)\n\n此练习的下一个任务是将将\
  \ `EditText` 视图的宽度设置为 200dp。正如名为“Android Studio 布局编辑器教程”的章节所述，在用户界面布局中设置大小和位置时，使用密度像素（dp）比使用像素（px）更好。要使用\
  \ `dp` 设置位置，需要在运行时考虑设备显示密度的情况下，将 `dp` 值转换为 `px` 值。因此，为了将 `EditText` 视图的宽度设置为 200dp，需要向类中添加以下代码：\n\
  \n```java\npackage com.ebookrenzy.javalayout;\n\nimport android.content.res.Resources;\n\
  import android.util.TypedValue;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private int convertToPx(int value) {\n        Resources r = getResources();\n\
  \        return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value,\
  \ r.getDisplayMetrics());\n    }\n\n    private void configureLayout() {\n     \
  \   Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        myButton.setId(R.id.myButton);\n\
  \        EditText myEditText = new EditText(this);\n        myEditText.setId(R.id.myEditText);\n\
  \        int px = convertToPx(200);\n        myEditText.setWidth(px);\n    }\n}\n\
  ```\n\n再次编译并运行应用程序，注意 `EditText` 视图的宽度已经发生变化，如图 24-3 所示：\n\n![](img/Image2451.jpg)\n\
  \n图 24-3\n\n### 24.8 总结\n\n在本章创建的示例活动（背景颜色和视图类型除外）与早期“Android Studio 中的手动 XML 布局设计”章节中创建的界面相似。尽管如此，本章应该让大家意识到\
  \ Android Studio 布局编辑器工具和 XML 资源在某些方面的作用。\n\n然而，在某些情况下，使用 Java 创建用户界面是合理的。例如，这种方法在创建动态用户界面布局时最为有用。\n\
  \n## 25. Android Studio 应用更改指南\n\n现在已经涵盖了使用 Android Studio 进行开发的基本概念，现在是介绍 Android\
  \ Studio 应用更改（Apply Changes）功能的好时机。正如所有经验丰富的开发者所，等待应用程序运行的每一秒都可以用于编写和优化代码。\n\n###\
  \ 25.1 简介应用更改\n\n在 Android Studio 的早期版本中，每当需要测试项目的更改时，Android Studio 都会重新编译代码、转换为\
  \ Dex 格式、生成 APK 包并将其安装到设备或模拟器上。完成这些步骤后，应用程序才能启动并准备好测试。即使在快速开发系统上，此过程也需要大量时间。对于大型应用程序，此过程通常需要一分钟或长时间。\n\
  \n相比之下，应用更改允许项目中的许多代码和资源更改在设备或模拟器会话运行时，几乎立即地反映在应用程序中。\n\n考虑正在 Android Studio 中开发并已在设备或模拟器上启动的应用程序。如果对资源设置或方法内部的代码进行更改，应用更改将更新后的代码和资源推送到运行的应用程序并动态地“交换”这些更改。然后更改将反映在运行的应用程序中，而无需重新构建、部署和启动整个应用程序。\n\
  \n### 25.2 理解应用更改选项\n\nAndroid Studio 提供了三种对运行应用程序应用更改的方法，分别是运行应用程序、应用更改以及重启活动和应用代码更改。这些选项可以总结如下：\n\
  \n\n\n\n\n- **运行应用 (Run App)** - 停止当前运行的应用并重启它。如果自上次启动以来项目未发生任何更改，此选项将重新启动应用。反之，如果项目发生了更改，Android\
  \ Studio 将在启动应用之前重新构建并将应用重新安装到设备或模拟器上。\n- **应用代码更改 (Apply Code Changes)** - 当对项目的唯一更改仅涉及对现有方法体的修改，或者添加了新类或新方法时，可以使用此选项。选中后，更改将应用到运行中的应用，而无需重启应用或当前运行的\
  \ Activity。然而，当对任何项目资源（如布局文件）进行更改时，无法使用此模式。其他限制还包括删除方法、更改方法签名、重命名类以及结构结构代码更改。如果项目清单（Manifest）发生了更改，也无法使用此选项。\n\
  - **应用更改并重启 Activity (Apply Changes and Restart Activity)** - 选中后，此模式将动态应用项目内的任何代码或资源更改，并在不重新安装或重启应用的情况下重启\
  \ Activity。与“应用代码更改”选项不同，当项目代码和资源发生更改时可以使用此选项。但是，仍然存在某些结构性代码更改和清单修改的相同限制。\n\n###\
  \ 25.3 使用应用更改\n\n当项目已加载到 Android Studio 但尚未在设备或模拟器上运行时，可以使用工具栏上的运行（在图 25-1 中标记为\
  \ A））或调试（B）按钮像往常一样启动：\n\n![](img/as_run_debug_buttons.jpg)\n\n图 25-1\n\n应用启动并运行后，将出现一个停止按钮（在图\
  \ 25-2 中标记为 A)），此时“应用更改并重启 Activity”（B）和“应用代码更改”（C）按钮将变为可用：\n\n![](img/as_run_apply_changes.jpg)\n\
  \n图 25-2\n\n如果在选择其中一个“应用更改”按钮时无法应用更改，Android Studio 将显示一条指示失败的消息，并附带说明。例如，图 25-3\
  \ 显示了在对资源文件进行更改后选择“应用代码更改”选项时，Android Studio 显示的消息：\n\n![](img/as_instant_run_restart_resources.jpg)\n\
  \n图 25-3\n\n在这种情况下，解决方案是使用“应用更改并重启 Activity”选项（此处提供了链接）。同样，当尝试应用涉及删除删除方法的更改时，将会出现以下消息：\n\
  \n![](img/as_instant_run_restart_method_removed.jpg)\n\n图 25-4\n\n在这种情况下，唯一的选项是点击“运行应用”按钮以重新安装并重启应用。作为手动选择正确选项的替代方案，可以配置\
  \ Android Studio 自动回退到执行“运行应用”操作。\n\n### 25.4 配置应用更改的回退设置\n\n应用更改的回退设置位于 Android\
  \ Studio 的设置（Settings）对话框中。在设置对话框中，选择左侧面板中的 `Build, Execution, Deployment`（构建、执行、部署），然后选择\
  \ `Deployment`（部署），如图 25-5 所示：\n\n![](img/as_instant_run_settings.jpg)\n\n图 25-5\n\
  \n启用所需的选项后，点击 Apply（应用），然后点击 OK（确定）按钮提交更改并关闭对话框。启用这些默认设置后，Android Studio 将必要时自动重新安装并重启应用。\n\
  \n### 25.5 应用更改教程\n\n启动 Android Studio，从欢迎屏幕上选择 New Project（新建项目）选项，并在点击 Next（下一步）按钮之前，在生成的新项目对话框中选择\
  \ `Basic Views Activity` 模板。\n\n在 `Name`（名称）字段输入 `ApplyChanges` 并指定 `com.ebookfrenzy.applychanges`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置更改为 `API 26: Android 8.0 (Oreo)`，并将语言菜单改为\
  \ `Java`。\n\n### 25.6 使用应用代码更改\n\n首先点击运行按钮并选择模拟器或物理设备作为运行目标。点击运行按钮后，跟踪示例应用在设备或模拟器上出现的时间。\n\
  \n运行后，点击操作按钮（屏幕右下角显示信封图标的按钮）。注意，会出现一个 `Snackbar` 实例，显示文本为“Replace with your own\
  \ action”（替换为你自己的操作），如图 25-6 所示：\n\n![](img/as_apply_changes_snackbar.jpg)\n\n图\
  \ 25-6\n\n应用运行后，“应用更改”按钮应该已经启用，表明某些项目更改可以在无需重新安装和重启应用的情况下应用。要查看此效果，请编辑 `MainActivity.java`\
  \ 文件，找到 `onCreate` 方法并修改操作代码，以便在选择操作按钮时显示不同的消息：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Apply Changes is Amazing!\", Snackbar.LENGTH_LONG)\n\
  \            .setAnchorView(R.id.fab)\n            .setAction(\"Action\", null)\n\
  \            .show();\n    }\n});\n```\n\n实现代码后，点击“应用更改”按钮，注意应用已更新。点击操作按钮，注意现在显示了消息。\n\
  \n## 25.7 使用应用更改并重启 Activity\n\n任何资源更改都需要使用“应用更改并重启 Activity”。在 Android Studio 中，选择\
  \ `app -> res -> layout -> fragment_first.xml` 布局文件。在布局编辑器处于设计模式时，选择 `TextView`\
  \ 组件并将属性窗口中的 text 属性更改为“Hello”。\n\n在点击“应用更改”按钮之前，确保上述配置应用更改的回退设置中的回退选项已关闭。点击“应用更改并重启\
  \ Activity”按钮，验证 Activity 重启并显示新文本。\n\n### 25.8 使用运行应用\n\n如前所述，删除方法需要重新安装并重启运行的应用。为了体验这一点，编辑\
  \ `MainActivity.java` 文件，并在 `onCreate` 方法之后添加一个新方法：\n\n```java\npublic void demoMethod()\
  \ {\n\n}\n```\n\n使用“应用更改”按钮并确认更改在无需重新安装应用的情况下应用。\n\n接下来，删除新方法并验证点击任一“应用更改”按钮都会导致请求失败。在此更改后运行应用的唯一方法是点击“运行应用”按钮。\n\
  \n### 25.9 总结\n\n应用更改是 Android Studio 的一项功能，旨在显著加快开发应用时执行的代码、构建和运行周期。在许多情况下，应用更改功能可以在不重新安装或重启应用的情况下将更新推送到运行中的应用。\n\
  \n## 26 Gradle 版本目录指南\n\n一个新的 Android Studio 项目将由 Android Studio 自动生成的约 80 个文件组成。当你点击运行按钮时，Android\
  \ Studio 使用名为 `Gradle` 的构建系统生成额外文件、编译源代码、解决库依赖并创建可安装的应用包。构建完成后，项目文件夹将包含约 700 个文件。\n\
  \n\n\n\n\n本章将解释 Gradle 构建系统如何确定在构建过程中需要包含哪些库，以及你如何如何使用该系统为项目添加库依赖项。\n\n### 26.1\
  \ 库和插件依赖\n\n在早之前标题为“Android 架构概述”的章节中，我们简要讨论了 Java API 框架及其包含的库。当 Gradle 构建一个项目时，它需要知道完成构建需要哪些库以及它们各自的版本号。例如，一个项目可能依赖于版本为\
  \ 2.6.0 的 Room 数据库运行时库（`androidx.room:room-runtime`）。遗憾的是，当我们在项目中编写 Room 数据库代码时，Gradle\
  \ 不会自动将相应的库依赖添加到构建配置中。相反，我们必须通过 Gradle 构建文件和版本目录（version catalog）手动添加它们。\n\n## 26.2\
  \ 项目级 Gradle 构建文件\n\n每个 Android Studio 项目都有一个项目级 Gradle 文件，你可以在 Project 工具窗口中导航到\
  \ `Gradle Scripts` -> `build.gradle.kts` (`<Project name>`) 来找到它。该文件的主要目的是定义负责构建整个项目的插件，其内容通常如下所示：\n\
  \n```\nplugins {\n    alias(libs.plugins.androidApplication) apply false\n}\n```\n\
  \n在实践中，只有在少数情况下才需要修改此文件。\n\n## 26.3 模块级 Gradle 构建文件\n\nAndroid Studio 项目由一个或多个模块组成，每个模块都有自己的构建配置和库依赖。新项目将包含一个模块，其\
  \ gradle 构建文件将列在 Gradle Scripts 文件夹中，名为 `build.gradle.kts` (Module: app)，其部分内容如下：\n\
  \n```kotlin\nplugins {\n    alias(libs.plugins.androidApplication)\n}\n\nandroid\
  \ {\n.\n.\n}\n\ndependencies {\n    implementation(libs.androidx.appcompat)\n  \
  \  implementation(libs.material)\n    implementation(libs.androidx.activity)\n \
  \   implementation(libs.androidx.constraintlayout)\n    testImplementation(libs.junit)\n\
  \    androidTestImplementation(libs.androidx.junit)\n    androidTestImplementation(libs.androidx.espresso.core)\n\
  }\n```\n\n`plugins` 部分再次包含了构建项目所需的插件，在大多数情况下，它们将与项目级构建文件中声明的插件保持一致。当某个模块需要其他模块不需要的插件时，这些插件将在此声明。\n\
  \n`dependencies` 部分包含了该模块依赖的库列表，这些库必须被解析以实现成功构建。\n\n### 26.4 版本目录文件\n\n早些时候提到，除了库名称外，依赖项还必须包含库的版本号。然而，你可能注意到，到目前为止的所有配置文件中没有一个包含版本信息。这就是版本目录文件（version\
  \ catalog file）的用场。版本目录位于 Project 工具窗口 Gradle Scripts 文件夹中名为 `libs.versions.toml`\
  \ 的文件中。版本目录文件示例如下：\n\n```toml\n[versions]\nagp = \"8.3.0\"\njunit = \"4.13.2\"\n\
  junitVersion = \"1.1.5\"\nespressoCore = \"3.5.1\"\nappcompat = \"1.6.1\"\nmaterial\
  \ = \"1.11.0\"\nactivity = \"1.8.0\"\nconstraintlayout = \"2.1.4\"\n\n[libraries]\n\
  material = { group = \"com.google.android.material\", name = \"material\", version.ref\
  \ = \"material\" }\nactivity = { group = \"androidx.activity\", name = \"activity\"\
  , version.ref = \"activity\" }\n\n[plugins]\nandroidApplication = { id = \"com.android.application\"\
  , version.ref = \"agp\"}\n```\n\n该目录分为标记为 `[versions]`、`[libraries]` 和 `[plugins]`\
  \ 的部分。为了帮助理解目录如何工作，我们将使用 material 库作为示例。在 `[libraries]` 部分，material 库的声明如下：\n\n\
  `material = { group = \"com.google.android.material\", name = \"material\", version.ref\
  \ = \"material\" }`\n\n上面的 `group` 条目告诉我们，Java API 框架中 Material 库组的实际名称是 `com.google.android.material`，而\
  \ `versions.ref` 赋值声明了在 `[versions]` 目录部分中如何引用该库。该声明被赋值给名为“material”的值，该值将作为在模块级构建文件中引用该库的名称。\n\
  \n参考 `[versions]` 部分，我们发现该库被分配了版本 1.11.0：\n\n`material = \"1.11.0\"`\n\n最后，该库在模块级构建文件的\
  \ `dependencies` 部分声明如下：\n\n```kotlin\ndependencies {\n.\n.\n    implementation(libs.material)\n\
  }\n```\n\n注意，在构建文件中引用库的语法是在 `[libraries]` 目录条目中使用使用的名称前加上前缀 `libs.`。\n\n虽然在这个示例中关注的是库，但插件的语法是相同的。\n\
  \n### 26.5 添加依赖项\n\n你将需要为书中的几个项目添加依赖项，在每种情况下，我们都会引导你完成整个过程。作为本章的最后一个示例，我们将演示如何为之前的假设项目添加\
  \ Room 数据库运行时库依赖项。首先，我们必须在 `libs.versions.toml` 版本目录文件的 `[libraries]` 部分添加以下条目：\n\
  \n```toml\n[libraries]\n.\n.\nandroidx-roomruntime = { group = \"androidx.room\"\
  , name = \"room-runtime\", version.ref = \"roomRuntime\" }\n```\n\n接下来，在 `[versions]`\
  \ 部分添加版本号：\n\n```toml\n[versions]\n.\n.\nroomRuntime = \"2.6.1\"\n```\n\n最后，将该库添加到模块级构建文件的依赖部分：\n\
  \n```kotlin\ndependencies {\n..\n    implementation(libs.androidx.room)\n}\n```\n\
  \n另一个示例是 `androidx.navigation:navigation-fragment` 库。在这种情况下，库组为 `androidx.navigation`，名称为\
  \ `navigation-fragment`。该库在版本目录中的声明如下：\n\n```toml\n[versions]\n.\n.\nnavigationFragment\
  \ = \"2.7.7\"\n\n[libraries]\n.\n.\nnavigation-fragment = { group = \"androidx.navigation\"\
  , name = \"navigation-fragment\", version.ref = \"navigationFragment\" }\n```\n\n\
  一旦库被添加到目录，gradle 文件依赖如下：\n\n```kotlin\ndependencies {\n.\n.\n    implementation(libs.navigation.fragment)\n\
  }\n```\n\n### 26.6 库更新\n\n虽然声明库和插件依赖项主要是手动任务，但 Android Studio 能为你做的一件事是告诉你是否有更高版本的库可用。它通过在你编辑目录时高亮版本来实现。将鼠标指针悬停在高亮的数字上将显示如图\
  \ 26-1 所示的面板，提供切换到最新版本的选项：\n\n![](img/as_new_version_popup.jpg)\n\n图 26-1\n\n###\
  \ 26.7 总结\n\nAndroid Studio 项目使用 Gradle 构建系统进行构建，过程涉及多个步骤。其中一个步骤是解析并包含成功构建项目所需的任何库。虽然新创建的项目将包含简单应用程序所需的基础库和插件，但更复杂的项目将具有额外的依赖项。这些依赖项在模块级\
  \ Gradle 构建文件中声明。为了提供跨项目模块的版本一致性，并提供单一位置添加新库或更新版本号，Gradle 使用了版本目录。\n\n\n\n\n\n在前章节中已经涵盖了许多关于\
  \ Android 用户界面设计的内容。然而，尚未涵盖的领域是用户与用户界面的交互如何触发底层活动（activity）执行任务。换句话说，从之前的章节中，我们知道如何创建一个包含按钮视图的用户界面，但不知道当用户触摸它时如何让应用程序内部发生某些操作。\n\
  \n因此，本章的主要目标是提供 Android 应用程序事件处理的概述，并结合一个基于 Android Studio 的示例项目。\n\n## 27.1 理解\
  \ Android 事件\n\nAndroid 事件可以采取多种形式，但通常是响应外部操作而产生的。最常见的事件形式（特别是对于平板和平智能手机等设备）涉及与触摸屏的某种形式的交互。此类事件属于输入事件。\n\
  \nAndroid 框架维护了一个事件队列，事件在发生时会被放入队列中。然后，事件按照先入先（FIFO）原则从队列中移除。对于输入事件（例如触摸屏幕），事件将传递给位于屏幕触摸发生位置的视图。除了事件通知外，视图还会接收到关于事件性质的一系列信息（取决于事件类型），例如用户手指与屏幕之间接触点的坐标。\n\
  \n为了处理已传递的事件，视图必须配备相应的事件监听器。所有用户界面组件均派生自 `View` 类包含一系列事件监听器接口，每个接口都包含一个回调方法的抽象声明。为了能够响应特定类型的事件，视图必须注册相应的事件监听器并实现相应的回调。例如，如果按钮要响应点击事件（等同于用户触摸并释放按钮视图，就像点击物理按钮一样），则它必须同时注册\
  \ `View.onClickListener` 事件监听器（通过调用目标视图的 `setOnClickListener()` 方法）并实现相应的 `onClick()`\
  \ 回调方法。如果在按钮视图所在的位置检测到“点击”事件，Android 框架将在该事件从事件队列中移除时，调用该视图的 `onClick()` 方法。当然，任何响应按钮点击而执行的任务或其他方法都应该在\
  \ `onClick()` 回调方法的实现中完成。\n\n## 27.2 使用 android:onClick 资源\n\n在详细探索事件监听器之前，值得注意的是，当仅需在用户“点击”用户界面中的按钮视图时调用一个回调方法时，提供了一种快捷方法。考虑一个包含名为\
  \ `button1` 的按钮视图的用户界面布局，其要求是当用户触摸按钮时，调用 activity 类中声明的名为 `buttonClick()` 的方法。实现此行为所需的仅是编写\
  \ `buttonClick()` 方法（该方法接受触发点击事件的视图引用作为参数），并在 XML 文件中按钮视图的声明中添加一行。例如：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:onClick=\"buttonClick\"\
  \n    android:text=\"Click me\" />\n```\n\n这提供了一种捕获点击事件的简单方法。但它并没有提供事件处理器所提供的系列选项，而这正是本章其余部分的主题。正如后续章节概述，`onClick`\
  \ 属性在涉及 fragment 的布局中也存在局限性。在 Android Studio 布局编辑器中工作时，当设备屏幕布局中选择了合适的视图类型时，可以在属性（Attributes）面板中找到并配置\
  \ `onClick` 属性。\n\n### 27.3 事件监听器和回调方法\n\n在本章稍后介绍的示例 activity 中，将详细介绍注册事件监听器和实现回调方法的步骤。但在在此之前，值得花些时间概述\
  \ Android 框架中可用的事件监听器以及与每个监听器相关的回调方法。\n\n- `onClickListener` – 用于检测点击样式事件，即用户触摸并释放由视图占据的设备显示区域。对应\
  \ `onClick()` 回调方法，该方法将接收事件的视图引用作为参数传递。\n- `onLongClickListener` – 用于检测用户是否在视图上长时间保持触摸。对应\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数传递。\n- `onTouchListener` – 用于检测与触摸屏的任何接触，包括单次或多次触摸以及手势动作。对应\
  \ `onTouch()` 回调，此主题将在名为[Android 触摸和多点事件处理]的章节中更详细地介绍。回调方法将接收事件的视图和一个 `MotionEvent`\
  \ 对象作为参数传递。\n- `onCreateContextMenuListener` – 监听由于长按产生上下文菜单的创建。对应 `onCreateContextMenu()`\
  \ 回调方法。回调传递菜单、接收事件的视图和一个菜单上下文对象（menu context object）。\n- `onFocusChangeListener`\
  \ – 检测焦点因与轨迹球或导航键的交互而离开当前视图。对应 `onFocusChange()` 回调方法，该方法传递接收事件的视图和一个表示焦点获得或丢失的布尔值。\n\
  - `onKeyListener` – 用于检测当视图拥有焦点时按下设备上的按键。对应 `onKey()` 回调方法。将接收事件的视图、物理按键的 `KeyCode`\
  \ 和一个 `KeyEvent` 对象作为参数传递。\n\n## 27.4 事件处理示例\n\n在本章的剩余部分，我们将创建一个 Android Studio\
  \ 项目，用于演示事件监听器和相应回调方法的实现，以检测用户何时点击按钮。回调方法中的代码将更新文本视图以指示事件已处理。\n\n在欢迎屏幕上选择 New Project\
  \ ，并在出现的新项目对话框中选择 Empty Views Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 `EventExample`，并将包名指定为\
  \ `com.ebookrenzy.eventexample`。点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android\
  \ 8.0 (Oreo)，并将 Language 菜单设置为 Java。按照第 11.8 节概述的步骤，将项目转换为使用 view binding。\n\n##\
  \ 27.5 设计用户界面\n\n示例中 `MainActivity` 类的用户界面布局将由一个 `ConstraintLayout`、一个 `Button`\
  \ 和一个 `TextView` 组成，如图 27-1 所示。\n\n![image/as_event_example_ui.jpg]\n图 27-1\n\n\
  找到并选择 Android Studio 创建的 `activity_main.xml` 文件（位于项目工具窗口的 app -> res -> layouts\
  \ 下），并双击将其加载到布局编辑器中。\n\n确保启用 Autoconnect，然后从调色板中拖入 `Button` 控件并移动它使其位于布局的水平居中并在现有\
  \ `TextView` 组件下方。当位置正确时，松开组件，以便自动连接系统添加相应的约束。\n\n\n\n\n选择“Hello World!” `TextView`\
  \ 小部件，并使用 `Attributes` 面板将 `ID` 设置为 `statusText`。重复此步骤将 `Button` 小部件的 `ID` 改为 `myButton`。\n\
  \n点击布局编辑器工具栏中的 `Infer Constraints` 按钮来添加任何缺失的约束条件。\n\n在选中 `Button` 小部件的情况下，使用 `Attributes`\
  \ 面板将 `text` 属性设置为 `Press Me`。将按钮上的文本字符串提取为名为 `press_me` 的资源。\n\n完成用户界面布局后，下一步是注册事件监听器和回调方法。\n\
  \n## 27.6 事件监听器和回调方法\n\n对于本示例，需要为 `myButton` 视图注册一个 `onClickListener`。这通过调用按钮视图的\
  \ `setOnClickListener()` 方法实现，并将一个新的 `onClickListener` 对象作为参数传递，同时实现 `onClick()`\
  \ 回调方法。由于此任务只需要在 activity 创建时执行，因此良好的位置是 `MainActivity` 类的 `onCreate()` 方法。\n\n\
  如果 `MainActivity.java` 文件已经在编辑器会话中打开，请通过点击编辑器面板中的标签页选择它。或者，在 `Project` 工具窗口中导航到\
  \ (`app -> kotlin+java -> com.ebookfrenzy.eventexample -> MainActivity`) 找到它，并双击将其加载到代码编辑器中。加载完成后，找到模板\
  \ `onCreate()` 方法并修改以获取按钮视图的引用、注册事件监听器并实现 `onClick()` 回调方法：\n\n```java\npackage\
  \ com.ebookfrenzy.eventexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.view.View;\n\nimport android.widget.Button;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \n.\n.\n\n        setContentView(view);\n\n        binding.myButton.setOnClickListener(\n\
  \                new Button.OnClickListener() {\n                    public void\
  \ onClick(View v) {\n\n                    }\n                }\n        );\n  \
  \  }\n.\n.\n}\n```\n\n上述代码已经在按钮上注册了事件监听器并实现了 `onClick()` 方法。然而，如果此时运行应用程序，将没有任何迹表明按钮上安装的事件监听器正在工作，因为目前\
  \ `onClick()` 回调方法的体内尚未实现任何代码。本示例的目标是在点击按钮时在 `TextView` 上显示一条消息，因此需要进行一些进一步的代码更改：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n.\n\
  .\n\n    binding.myButton.setOnClickListener(\n                new Button.OnClickListener()\
  \ {\n                    public void onClick(View v) {\n                       \
  \ binding.statusText.setText(\"Button clicked\");\n                    }\n     \
  \           }\n    );\n}\n```\n\n在 AVD 模拟器或物理 Android 设备上编译并运行应用程序以完成此教程阶段。在触摸并释放按钮视图（也称为“点击”）时，文本视图应该更改为显示“Button\
  \ clicked”文本。\n\n## 27.7 消费事件\n\n在视图上检测标准点击（相对于长按）是事件处理的一个简单用例。现在示例将扩展以包含对长按事件的检测，长按发生在用户点击并按住屏幕上的视图时，并借此涵盖了事件消费的主题。\n\
  \n考虑本章上一部分中 `onClick()` 方法的代码。回调被声明为 `void`，因此在执行完毕后不会向 Android 框架返回任何值。\n\n另一方面，分配给\
  \ `onLongClickListener` 的代码需要向 Android 框架返回一个 `Boolean` 值。此返回值的目的是指示 Android 运行时回调是否消费了该事件。\n\
  \n对于许多编程概念，通过示例进行演示效果最好：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n.\n.\n\n    binding.myButton.setOnClickListener(\n                new Button.OnClickListener()\
  \ {\n                    public void onClick(View v) {\n                       \
  \ binding.statusText.setText(\"Button clicked\");\n                    }\n     \
  \           }\n    );\n}\n```\n\n如果回调返回 `true` 值，框架将丢弃该事件。另一方面，如果返回 `false` 值，Android\
  \ 框架将认为该事件仍然激活并将其传递。\n\n要实现长按监听器，请使用：\n\n```java\nbutton.setOnLongClickListener(new\
  \ View.OnLongClickListener() {\n    @Override\n    public boolean onLongClick(View\
  \ v) {\n        TextView myTextView = findViewById(R.id.statusText);\n        myTextView.setText(\"\
  Long click\");\n        return true; // 消费事件\n    }\n});\n```\n\n\n\n大多数基于 Android\
  \ 的设备使用触摸屏作为用户与设备之间的主要接口。上一章介绍了屏幕上的触摸操作如何转换为运行中 Android 应用程序内部的动作。然而，触摸事件的处理远不止于对视图对象上单指点击的响应。例如，大多数\
  \ Android 设备可以同时检测到多个触摸点。触摸操作也不局限于设备显示器的某一点。当用户在屏幕表面上滑动一个或多个接触点时，触摸操作可以是动态的。\n\n\
  应用程序还可以将触摸操作解释为一种手势。例如，水平滑动通常用于翻页电子书的页码，捏合动作（pinching motion）可以用来放大或缩小屏幕上显示的图像。\n\
  \n本章将解释涉及运动的触摸处理，并探索拦截多个并发触摸操作的概念。识别不同手势的主题将在下一章中介绍。\n\n## 28.1 拦截触摸事件\n\n视图对象可以通过注册\
  \ `onTouchListener` 事件监听器并实现相应的 `onTouch()` 回调方法来拦截触摸事件。例如，以下代码确保了在名为 `myLayout`\
  \ 的 `ConstraintLayout` 视图实例上的任何触摸操作都会调用 `onTouch()` 方法：\n\n```java\nbinding.myLayout.setOnTouchListener(\n\
  \    new ConstraintLayout.OnTouchListener() {\n        public boolean onTouch(View\
  \ v, MotionEvent m) {\n            //在此执行任务\n            return true;\n        }\n\
  \    }\n);\n```\n\n如代码示例所示，`onTouch()` 回调需要返回一个 `Boolean` 值，指示 Android 运行时系统应该将该事件传递给在同一视图上注册的其他事件监听器，还是将其丢弃。该方法传递了触发事件的视图的引用以及类型为\
  \ `MotionEvent` 的对象。\n\n## 28.2 MotionEvent 对象\n\n传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象是获取事件信息的关键。对象中的信息包括触摸在视图中的位置以及所执行的动作类型。`MotionEvent` 对象也是处理多点触摸的关键。\n\n## 28.3\
  \ 理解触摸动作\n\n触摸事件处理的一个重要方面是识别用户执行的动作类型。可以通过调用传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象的 `getActionMasked()` 方法来获取与事件相关的动作类型。当视图上发生第一次触摸时，`MotionEvent` 对象将包含类型为 `ACTION_DOWN`\
  \ 的动作类型以及触摸坐标。当该触摸从屏幕上抬起时，会生成 `ACTION_UP` 事件。在 `ACTION_DOWN` 和 `ACTION_UP` 事件之间的任何触摸移动都将由\
  \ `ACTION_MOVE` 事件表示。\n\n当在视图上同时进行多次触摸时，这些触摸被称为指针（pointers）。在多点触摸场景下，指针的开始和结束分别对应类型为\
  \ `ACTION_POINTER_DOWN` 和 `ACTION_POINTER_UP` 的事件动作。要识别触发事件的指针索引，必须调用 `MotionEvent`\
  \ 对象的 `getActionIndex()` 回调方法。\n\n### 28.4 处理多触摸\n\n标题为“Android 事件处理概述与示例”的章节从单点触摸事件的狭窄范围内开始探索事件处理。在实践中，大多数\
  \ Android 设备可以响应多个连续的触摸（但需要注意的是，可以检测到的同时触摸数量取决于设备）。\n\n如前所述，在多点触摸情况下，每次触摸都被 Android\
  \ 框架视为一个指针。每个指针反过来通过一个索引值引用并分配一个 ID。可以通过调用当前 `MotionEvent` 对象的 `getPointerCount()`\
  \ 方法获取当前指针的数量。当前指针列表中特定索引处的指针 ID 可以通过调用 `MotionEvent.getPointerId()` 方法获得。例如，以下代码段获取了指针计数以及索引为\
  \ 0 的指针的 ID：\n\n```java\npublic boolean onTouch(View v, MotionEvent m) {\n    int\
  \ pointerCount = m.getPointerCount();\n    int pointerId = m.getPointerId(0);\n\
  \    return true;\n}\n```\n\n注意，当 `onTouch` 监听器被触发时，指针计数将始终大于或等于 1（因为回调的触发至少发生过一次触摸）。\n\
  \n视图上的触摸，特别是涉及跨屏幕运动的触摸，会在接触点抬起之前产生一系列事件。应用程序可能需要跨越多个触摸事件跟踪单个触摸操作。虽然特定触摸手势的 ID 在后续事件之间不会改变，但重要的是，随着其他触摸事件的到来和消失，索引值会发生变化。在跨多个事件处理触摸手势时，必须使用\
  \ ID 值作为触摸引用以确保跟踪的是同一个触摸。在调用需要索引值的方法时，应通过调用 `MotionEvent` 对象的 `findPointerIndex()`\
  \ 方法将触摸的 ID 转换为相应的索引值。\n\n## 28.5 多点触摸应用程序示例\n\n在本章剩余部分创建的示例应用程序将跟踪多两个触摸手势在布局视图上的移动。当每个触摸的事件被触发时，每个触摸的坐标、索引和\
  \ ID 将显示在屏幕上。\n\n从欢迎界面选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击 Next（下一步）按钮之前选择 Empty\
  \ Views Activity 模板。\n\n在 Name 字段中输入 `MotionEvent` 并指定 `com.ebookfrenzy.motionevent`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API 级别更改为 API 26: Android 8.0 (Oreo)，语言设置为 Java。\n\
  \n按照第 11.8 节所述调整项目使用视图绑定。\n\n## 28.6 设计 Activity 用户界面\n\n应用程序唯一 Activity 的界面由包含两个\
  \ `TextView` 对象的 `ConstraintLayout` 视图组成。在 Project 工具窗口中，导航到 app -> res -> layout\
  \ 并双击 `activity_main.xml` 布局资源文件将其加载到 Android Studio 布局编辑器。\n\n选择并删除默认的“Hello World!”\
  \ `TextView` 控件，然后在开启自动连接（autoconnect）的情况下，拖放一个新的 `TextView` 控件，使其水平居中并位于布局顶部的 16dp\
  \ 边界线上：\n\n![](img/as_4.1_motion_event_one_textview.jpg)\n\n图 28-1\n\n拖入第二个 `TextView`\
  \ 控件并进行定位和约束，使其与第一个控件之间保持 32dp 的间距：\n\n![](img/as_4.1_motion_event_two_textviews.jpg)\n\
  \n图 28-2\n\n使用 Attributes 工具窗口将 `TextView` 控件的 ID 分别更改为 `textView1` 和 `textView2`。将控件显示的文本更改为“Touch\
  \ One Status”和“Touch Two Status”，并使用编辑器右上角的警告按钮将字符串提取到资源文件中。\n\n## 28.7 实现触摸事件监听器\n\
  \n\n\n\n\n要接收触摸事件通知，需要在 `MainActivity`  类的 `onCreate()` 方法中在布局视图上注册触摸监听器。从 Android\
  \ Studio 编辑器面板中选择 `MainActivity.java` 标签以显示源代码。在 `onCreate()` 方法中，添加代码来注册触摸监听器并实现代码，在此情况下，代码将调用一个名为\
  \ `handleTouch()` 的第二个方法，并传递一个 `MotionEvent` 对象：\n\n```java\npackage com.ebookfrenzy.motionevent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.os.Bundle;\nimport android.view.MotionEvent;\nimport android.view.View;\n\
  import com.ebookfrenzy.motionevent.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n// ...\n\
  \        setContentView(view);\n        binding.main.setOnTouchListener(\n     \
  \       new ConstraintLayout.OnTouchListener() {\n                public boolean\
  \ onTouch(View v, MotionEvent m) {\n                    handleTouch(m);\n      \
  \              return true;\n                }\n            }\n        );\n    }\n\
  }\n```\n\n当我们设计用户界面时，父布局 `ConstraintLayout` 没有分配允许我们通过视图绑定（view binding）机制访问它的 ID。由于该布局组件是\
  \ UI 布局层级结构中的顶层组件，我们能够使用上述代码中的根绑定属性来引用它。\n\n在测试应用程序之前，最后一个任务是实现由监听器调用的 `handleTouch()`\
  \ 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent m) {\n    int pointerCount\
  \ = m.getPointerCount();\n    for (int i = 0; i < pointerCount; i++) {\n       \
  \ int x = (int) m.getX(i);\n        int y = (int) m.getY(i);\n        int id = m.getPointerId(i);\n\
  \        int action = m.getActionMasked();\n        int actionIndex = m.getActionIndex();\n\
  \        String actionString;\n        switch (action) {\n            case MotionEvent.ACTION_DOWN:\n\
  \                actionString = \"DOWN\";\n                break;\n            case\
  \ MotionEvent.ACTION_UP:\n                actionString = \"UP\";\n             \
  \   break;\n            case MotionEvent.ACTION_POINTER_DOWN:\n                actionString\
  \ = \"PNTR DOWN\";\n                break;\n            case MotionEvent.ACTION_POINTER_UP:\n\
  \                actionString = \"PNTR UP\";\n                break;\n         \
  \   case MotionEvent.ACTION_MOVE:\n                actionString = \"MOVE\";\n  \
  \              break;\n            default:\n                actionString = \"\"\
  ;\n        }\n        String touchStatus = \"Action: \" + actionString + \" Index:\
  \ \" + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\n        if (id\
  \ == 0)\n            binding.textView1.setText(touchStatus);\n        else\n   \
  \         binding.textView2.setText(touchStatus);\n    }\n}\n```\n\n在编译和运行应用程序之前，值得花时间系统地梳理这段代码，以强调所执行的任务。代码首先获取用户界面中两个\
  \ `TextView` 对象的引用，并识别视图上有多少个活跃的指针：\n\n```java\nTextView textView1 = findViewById(R.id.textView1);\n\
  TextView textView2 = findViewById(R.id.textView2);\nint pointerCount = m.getPointerCount();\n\
  ```\n\n接下来，`pointerCount` 变量启动了一个 `for` 循环，为每个活跃的指针执行任务。循环的前几行获取了触摸的 `X` 和 `Y` 坐标，以及相应的\
  \ `ID`、动作类型和动作索引。最后，声明了一个 `string` 变量：\n\n```java\nfor (int i = 0; i < pointerCount;\
  \ i++) {\n    int x = (int) m.getX(i);\n    int y = (int) m.getY(i);\n    int id\
  \ = m.getPointerId(i);\n    int action = m.getActionMasked();\n    int actionIndex\
  \ = m.getActionIndex();\n    String actionString;\n```\n\n由于动作类型等于整数值，使用 `switch`\
  \ 语句将动作类型转换为更有意义的字符串值，并将其存储在之前声明的 `actionString` 变量中：\n\n```java\nswitch (action)\
  \ {\n    case MotionEvent.ACTION_DOWN:\n        actionString = \"DOWN\";\n     \
  \   break;\n    case MotionEvent.ACTION_UP:\n        actionString = \"UP\";\n  \
  \      break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n        actionString =\
  \ \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n    \
  \    actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\n```\n\n最后，使用 `actionString` 值、动作索引、触摸 `ID` 以及 `X` 和 `Y` 坐标构建字符串消息。然后使用\
  \ `ID` 值来决定字符串应该显示在第一个还是第二个 `TextView` 对象上：\n\n```java\nString touchStatus = \"\
  Action: \" + actionString + \" Index: \" + actionIndex + \" ID: \" + id + \" X:\
  \ \" + x + \" Y: \" + y;\nif (id == 0)\n    binding.textView1.setText(touchStatus);\n\
  else\n    binding.textView2.setText(touchStatus);\n```\n\n### 28.8 运行示例应用程序\n\n\
  编译并运行应用程序，一旦启动，就如图 28-3 所示在屏幕上进行单次和多次触摸实验。在模拟器上运行时，可以通过按住 `Ctrl`（macOS 上为 `Cmd`）键的同时点击鼠标按钮来模拟多点触摸：\n\
  \n图 28-3\n\n### 28.9 总结\n\nActivity 通过注册 `onTouchListener` 事件监听器并实现 `onTouch()`\
  \ 回调方法来接收触摸事件通知，当该方法被 Android 运行时调用时，会传递一个 `MotionEvent` 对象。该对象包含了有关触摸的信息，例如触摸事件类型、触摸坐标以及当前与视图接触的触摸计数。\n\
  \n当涉及多个触摸时，每个接触点被称为一个指针（pointer），每个指针都分配了一个索引和一个 `ID`。虽然触摸的索引可能会从一个事件变为另一个事件，但在触摸结束之前，`ID`\
  \ 将保持不变。\n\n本章学习了如何创建一个示例 Android 应用程序，该程序旨在显示设备屏幕上多多两个同时触摸的坐标和动作类型。\n\n### 29.\
  \ 使用 GestureDetector 类检测常见手势\n\n“手势”（gesture）一词定义了用户与触摸屏之间连续的交互序列。Android SDK 提供了检测常见手势和自定义手势的机制。常见手势涉及点击（tap）、双击（double\
  \ tap）、长按（long press）或在水平或垂直方向上的滑动动作（在 Android 术语中称为 fling）。\n\n\n\n\n\n本章探讨了如何使用\
  \ `GestureDetector` 类来检测 Android 设备屏幕上常见的手势。下一章，“在 Android 上实现自定义手势和缩放识别”将涵盖检测更复杂的自定义手势，例如圆形运动和缩放。\n\
  \n## 29.1 实现常用手势检测\n\n当用户与 Android 设备的屏幕进行交互时，系统会调用当前活动应用程序的 `onTouchEvent()` 方法，并传递\
  \ `MotionEvent` 对象，该对象包含了用户与屏幕接触的数据。通过对这些数据进行解析，可以识别屏幕上的动作是否匹配常用手势（如点击或滑动）。通过使用\
  \ `GestureDetectorCompat` 类，可以以极少的编程工作实现这一点。该类设计用于接收应用程序的运动事件信息，并根据检测到的常用手势类型（如果有）触发方法调用。\n\
  \n检测常用手势的基本步骤如下：\n\n1. 声明一个 `GestureDetector.OnGestureListener` 接口的类，包括所需的 `onFling()`、`onDown()`、`onScroll()`、`onShowPress()`、`onSingleTapUp()`\
  \ 和 `onLongPress()` 回调方法。注意，这可以是一个全新的类，也可以是一个嵌套的 Activity 类。如果需要双击手势检测，该类还必须实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口并包含相应的 `onDoubleTap()` 方法。\n2. 创建 `GestureDetectorCompat` 类的实例，并将步骤 1 中创建的类实例作为参数传递。\n\
  3. 可选调用 `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()` 方法，以便根据需要启用双击检测。\n\
  4. 在嵌套的 Activity 中实现 `onTouchEvent()` 回调方法，该方法反过来必须调用 `GestureDetectorCompat` 实例的\
  \ `onTouchEvent()` 方法，并将当前的运动事件对象作为参数传递。\n\n一旦实现，应用程序代码中就会一组方法，当检测到特定类型的手势时，这些方法会被调用。可以实现这些方法中的代码来执行响应相应手势时所需的任何任务。\n\
  \n在本章的剩余部分中，我们将创建一个示例项目，旨在将上述步骤付实践。\n\n## 29.2 创建示例手势检测项目\n\n该项目旨在检测 `GestureDetectorCompat`\
  \ 类目前支持的所有常用手势，并向用户显示状态信息以指示检测到的手势类型。\n\n从欢迎屏幕选择“New Project”选项，在出现的新项目对话框中，在点击“Next”按钮之前，选择“Empty\
  \ Views Activity”模板。\n\n在 `Name` 字段中输入 `CommonGestures`，并指定 `com.ebookfrenzy.commongestures`\
  \ 为包名。在点击“Finish”按钮之前，将 Minimum API 级别设置改为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为\
  \ `Java`。\n\n按照节 11.8 将项目迁移到 View Binding 所述，调整项目以使用 view binding。\n\n一旦创建了新项目，在\
  \ Project 工具窗口中导航到 `app` -> `res` -> `layout` -> `activity_main.xml` 文件并双击它将其加载到\
  \ Layout Editor 工具中。\n\n在 Layout Editor 工具中，选择“Hello, World!” TextView 组件，并在 Attributes\
  \ 工具窗口中，输入 `gestureStatusText` 作为 ID。最后，将 `textSize` 设置为 `20sp` 并启用粗体 `textStyle`：\n\
  \n![](img/as_common_gestures_text_style.jpg)\n\n图 29-1\n\n## 29.3 实现监听器类\n\n如前所述，必须创建一个实现\
  \ `GestureDetector.OnGestureListener` 接口的类，如果需要双击检测，还需要实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口。虽然可以是一个全新的类，但在当前的 Activity 类中实现它也是完全有效的。因此，我们将修改 `MainActivity` 类为此示例实现这些监听器接口。编辑\
  \ `MainActivity.java` 文件使其内容如下：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \nimport android.view.GestureDetector;\n\n.\n.\n\npublic class MainActivity extends\
  \ AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n   \
  \     GestureDetector.OnDoubleTapListener\n{\n.\n.\n}\n```\n\n声明该类实现了监听器接口意味着在类中也实现相应的方法：\n\
  \n```java\npackage com.ebookfrenzy.commongestures;\n\n.\n.\n\nimport android.view.MotionEvent;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n\
  \        GestureDetector.OnDoubleTapListener {\n.\n.\n\n    @Override\n    public\
  \ boolean onDown(MotionEvent event) {\n        binding.gestureStatusText.setText\
  \ (\"onDown\");\n        return true;\n    }\n\n    @Override\n    public boolean\
  \ onFling(MotionEvent event1, MotionEvent event2,\n                            \
  \ float velocityX, float velocityY) {\n        binding.gestureStatusText.setText(\"\
  onFling\");\n        return true;\n    }\n\n    @Override\n    public void onLongPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onLongPress\");\n    }\n\
  \n    @Override\n    public boolean onScroll(MotionEvent e1, MotionEvent e2,\n \
  \                            float distanceX, float distanceY) {\n        binding.gestureStatusText.setText(\"\
  onScroll\");\n        return true;\n    }\n\n    @Override\n    public void onShowPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onShowPress\");\n    }\n\
  \n    @Override\n    public boolean onSingleTapUp(MotionEvent event) {\n       \
  \ binding.gestureStatusText.setText(\"onSingleTapUp\");\n        return true;\n\
  \    }\n\n    @Override\n    public boolean onDoubleTap(MotionEvent event) {\n \
  \       binding.gestureStatusText.setText(\"onDoubleTap\");\n        return true;\n\
  \    }\n\n    @Override\n    public boolean onDoubleTapEvent(MotionEvent event)\
  \ {\n        binding.gestureStatusText.setText(\"onDoubleTapEvent\");\n        return\
  \ true;\n    }\n\n    @Override\n    public boolean onSingleTapConfirmed(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onSingleTapConfirmed\");\n\
  \        return true;\n    }\n.\n.\n}\n```\n\n注意许多这些方法返回 `true`。这指示 Android 框架该方法已处理了事件，不需要传递给栈中的下一个事件处理器。\n\
  \n## 29.4 创建 GestureDetectorCompat 实例\n\n现在 Activity 类实现了监听器接口，下一步是创建 `GestureDetectorCompat`\
  \ 类的实例。由于只需要在 Activity 创建时执行一次，因此代码的最佳位置是 `onCreate()` 方法。由于我们还想检测双击，代码还需要调用 `GestureDetectorCompat`\
  \ 实例的 `setOnDoubleTapListener()` 方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \n.\n.\n\nimport androidx.core.view.GestureDetectorCompat;\n\npublic class MainActivity\
  \ extends AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n\
  \        GestureDetector.OnDoubleTapListener {\n\n    private ActivityMainBinding\
  \ binding;\n    private GestureDetectorCompat gDetector;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  .\n.\n        this.gDetector = new GestureDetectorCompat(this,this);\n        gDetector.setOnDoubleTapListener(this);\n\
  \    }\n\n.\n.\n}\n```\n\n## 29.5 实现 onTouchEvent() 方法\n\n\n\n\n如果此时编译并运行该应用程序，即使在设备屏幕上执行了手势，也不会发生任何事情。这是因为尚未添加任何代码来拦截触摸事件并将其传递给\
  \ `GestureDetectorCompat` 实例。要实现这一点，需要在活动类中重写 `onTouchEvent()` 方法，并实现使其调用 `GestureDetectorCompat`\
  \ 实例的 `onTouchEvent()` 方法。因此，在 `MainActivity.java` 文件中实现该方法，其代码如下：\n\n```java\n\
  @Override\npublic boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // Be sure to call the superclass implementation\n    return super.onTouchEvent(event);\n\
  }\n```\n\n### 29.6 测试应用程序\n\n在物理 Android 设备或 AVD 模拟器上编译并运行应用程序。启动后，尝试滑动、按压、滚动动作以及双击和单击。请注意，文本视图会更新以反映这些事件，如图图\
  \ 29-2 所示：\n\n![](img/as_common_gestures_running.jpg)\n\n图 29-2\n\n### 29.7 总结\n\
  \n用户与设备触摸屏之间的任何物理接触都可以被视为一种“手势”。由于缺乏传统计算机系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间交互的方法。虽然手势可以包含任何序列的动作，但有一组广泛使用的手势，触摸屏设备的用户对此非常熟悉。这些所谓的“常用手势”中的某些可以通过\
  \ Android 手势检测器（Gesture Detector）类在应用程序中轻松检测。在本章中，从理论和示例项目实现两个方面概述了该技术的使用。\n\n在本章介绍了常用手势之后，下一章将介绍检测更广泛的手势类型，包括设计和检测自定义手势的能力。\n\
  \n## 30.0 在 Android 上实现自定义手势和双缩指识别\n\n上一章涵盖了在 Android 应用程序内部检测所谓的“常用手势”。然而，在实践中，一个手势假设上可能涉及\
  \ Android 设备屏幕上几乎任何序列的触摸动作。针对此，Android SDK 允许应用程序开发者定义几乎任何性质的自定义手势，并在用户执行执行时触发事件。这是一个多阶段的过程，其细节是本章的主题。\n\
  \n### 30.1 Android Gesture Builder 应用程序\n\nAndroid SDK 允许开发者设计自定义手势，并存储在与 Android\
  \ 应用程序包捆绑的手势文件中。这些自定义手势文件最是可以使用 Gesture Builder 应用程序创建。创建手势文件涉及在物理设备或模拟器上启动 Gesture\
  \ Builder 应用程序，并“画出”应用程序需要检测的手势。一旦设计好手势，就可以下载包含手势数据的文件并添加到应用程序项目中。在应用程序代码中，该文件被加载到\
  \ `GestureLibrary` 类的实例中，该实例可用于搜索用户在设备屏幕上执行的任何手势的匹配项。\n\n### 30.2 GestureOverlayView\
  \ 类\n\n为了方便在应用程序中检测手势，Android SDK 提供了 `GestureOverlayView` 类。这个透明视图可以放置在用户界面的其他视图之上以检测手势。\n\
  \n### 30.3 检测手势\n\n手势的检测是通过加载使用 Gesture Builder App 创建的手势文件，然后在 `GestureOverlayView`\
  \ 类的实例上注册 `GesturePerformedListener` 事件监听器来实现的。然后声明外层类实现 `OnGesturePerformedListener`\
  \ 接口以及该接口所需的相应 `onGesturePerformed` 回调方法。如果监听器检测到手势，Android 运行时系统将触发对 `onGesturePerformed`\
  \ 回调方法的调用。\n\n### 30.4 识别特定手势\n\n当检测到手势时，会调用 `onGesturePerformed` 回调方法，并传递检测手势的\
  \ `GestureOverlayView` 对象的引用以及一个包含手势信息的 `Gesture` 对象。\n\n通过访问 `Gesture` 对象，`GestureLibrary`\
  \ 可以将检测到的手势与之前加载到应用程序的手势文件中包含的手势进行比较。`GestureLibrary` 通过为每个手势计算预测分，报告用户执行的手势与手势文件条目匹配的概率。1.0\
  \ 或更高的预测分通常被接受为文件中存储的手势与用户在设备屏幕上执行的手势之间的良好匹配。\n\n### 30.5 安装并运行 Gesture Builder\
  \ 应用程序\n\n创建手势文件最简单的方法是使用允许捕获和保存手势动作的应用程序。虽然 Google 最初提供了一个用于此目的应用程序，但它在较新版本的 Android\
  \ 上没有得到充分维护。幸运的是，以 Gesture Builder Tool App 的形式提供了替代方案，可以通过以下 URL 从 Google Play\
  \ 商店获取：\n\n[`play.google.com/store/apps/details?id=migueldp.runeforge`](https://play.google.com/store/apps/details?id=migueldp.runeforge)\n\
  \n### 30.6 创建手势文件\n\n一旦 Gesture Builder Tool 加载，点击设备底部的 Create New Gesture（创建新手势）按钮，并在灰色画布上使用圆形动作“画出”手势，如图图\
  \ 30-1 所示。假设手势显示正常（由设备屏幕上的黄色表示），点击保存按钮将手势添加到手势文件中，在提示名称时输入“Circle Gesture”。\n\n\
  ![](img/as_gesture_builder.jpg)\n\n图 30-1\n\n手势保存后，Gesture Builder Tool 将显示当前定义的手势列表，其中包含新的\
  \ Circle Gesture。\n\n### 30.7 创建示例项目\n\nGesture Builder Tool 加载后，在欢迎界面上选择 New Project（新建项目），并在生成的新项目对话框中选择\
  \ Empty Views Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段中输入 `Customures`，并将包名指定为 `com.ebookfzy.customgestures`。在点击\
  \ Finish 按钮之前，将 Minimum API level 设置为 26: Android 8.0 (Oreo)，并将 Language 菜单设置为 Java。按照\
  \ 11.8 迁移项目到 View Binding 节所述调整项目使用视图绑定。\n\n### 30.8 从 SD 卡提取手势文件\n\n由于每个手势都在 Gesture\
  \ Builder 应用程序内部创建的，它们被添加到名为 `gesture.txt` 的文件中，位于运行应用程序的模拟器或设备的存储中。但在将此文件添加到 Android\
  \ Studio 项目之前，必须将其从设备存储中导出并保存到本地文件系统。最简单的方法是使用 Android Studio 的 Device File Explorer\
  \ 工具。通过 View -> Tool Windows -> Device File Explorer 菜单显示此工具。显示后，从下拉菜单中选择创建手势文件的设备或模拟器，然后导航到以下文件夹：\n\
  \n`/storage/emulated/0/Android/data/migueldp.runeforge/files/gestures.txt`\n\n在此文件夹中找到\
  \ `gesture.txt` 文件，右键点击它，选择 Save As… 菜单选项，将其保存到临时位置并命名为 `gestures`。\n\n![](img/as_device_explorer.jpg)\n\
  \n图 30-2\n\n\n\n一旦手势文件创建并从设备存储中提取出来，就可以将其作为资源文件添加到 Android Studio 项目中。\n\n## 30.9\
  \ 将手势文件添加到项目\n\n在 Android Studio 的 Project 工具窗口中，找到并右键点击 `res` 文件夹（位于 `app` 下），从弹出菜单中选择\
  \ `New`（新建）-> `Directory`（目录）。在 `New Directory`（新建目录）对话框中，输入 `raw` 作为文件夹名称并按键盘回车键。使用适用于你操作系统的相应文件管理器工具，找到之前从设备存储中提取的手势文件，并将其复制并粘贴到\
  \ Project 工具窗口中新的 `raw` 文件夹中。\n\n### 30.10 设计用户界面\n\n此示例应用需要一个用户界面，由 `ConstraintLayout`\
  \ 视图组成，在其上层叠加一个 `GestureOverlayView` 以拦截用户执行的任何手势。找到 `app -> res -> layout -> activity_main.xml`\
  \ 文件，双击它将其加载到 Layout Editor 工具中，并选择并删除默认的 `TextView` 小部件。\n\n将布局编辑器切换到 Code 模式并修改\
  \ XML，使其内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\" >\n    <android.gesture.GestureOverlayView\n\
  \        android:id=\"@+id/gOverlay\"\n        android:layout_width=\"0dp\"\n  \
  \      android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n## 30.11 加载手势文件\n\n现在手势文件已添加到项目中，下一步是编写一些代码在 Activity 时加载该文件。对于此项目，实现此功能的代码将如下所示添加到\
  \ `MainActivity` 类中：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\nimport\
  \ android.gesture.GestureLibraries;\nimport android.gesture.GestureLibrary;\nimport\
  \ android.gesture.GestureOverlayView;\nimport android.gesture.GestureOverlayView.OnGesturePerformedListener;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements OnGesturePerformedListener\
  \ {\n\n    private ActivityMainBinding binding;\n    private GestureLibrary gLibrary;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        gestureSetup();\n    }\n\n   \
  \ private void gestureSetup() {\n        gLibrary = GestureLibraries.fromRawResource(this,\
  \ R.raw.gestures);\n        if (!gLibrary.load()) {\n            finish();\n   \
  \     }\n    }\n}\n```\n\n除了必要的导入指令外，上述代码还创建了一个名为 `gLibrary` 的 `GestureLibrary`\
  \ 实例，然后将 raw 资源文件夹中手势文件的内容加载其中。Activity 类也经过修改实现了 `OnGesturePerformedListener` 接口，这需要添加\
  \ `onGesturePerformed` 回调方法（该方法将在本章稍后创建）。\n\n## 30.12 注册事件监听器\n\n为了让 Activity 接收到用户在屏幕上执行手势的通知，有按照如下代码片段所示在\
  \ `gLayout` 视图上注册 `OnGesturePerformedListener` 事件监听器：\n\n```java\nprivate void gestureSetup()\
  \ {\n    gLibrary = GestureLibraries.fromRawResource(this, R.raw.gestures);\n  \
  \  if (!gLibrary.load()) {\n        finish();\n    }\n    binding.gOverlay.addOnGesturePerformed(this);\n\
  }\n```\n\n## 30.13 实现 onGesturePerformed 方法\n\n在首次运行应用程序之前，剩下的就是实现 `onGesturePerformed`\
  \ 方法。此方法如下：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\nimport android.gesture.Gesture;\n\
  import android.gesture.Prediction;\nimport android.widget.Toast;\nimport java.util.ArrayList;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements OnGesturePerformedListener\
  \ {\n\n    private GestureLibrary gLibrary;\n\n    public void onGesturePerformed(GestureOverlayView\
  \ overlay, Gesture gesture) {\n        ArrayList<Prediction> predictions = gLibrary.recognize(gesture);\n\
  \        if (!predictions.isEmpty() && predictions.get(0).score > 1.0) {\n     \
  \       String action = predictions.get(0).name;\n            Toast.makeText(this,\
  \ action, Toast.LENGTH_SHORT).show();\n        }\n    }\n}\n```\n\n当 Android 运行时检测到叠加层上的手势时，会调用\
  \ `onGesturePerformed`。作为参数传入检测到手势的 `GestureOverlayView` 对象引用以及一个 `Gesture` 对象。`Gesture`\
  \ 对象通过我们 `gLibrary` 的 `recognize()` 方法传递，将当前手势与加载的每个手势进行比较。一旦任务完成，`recognize()`\
  \ 返回一个包含每个比较对应的 `Prediction` 对象的 `ArrayList`。该列表按最匹配（位置 0）到最不匹配的顺序排序。每个 `prediction`\
  \ 对象包含了对应手势的名称以及指示与当前手势匹配程度的得分。\n\n因此，上述方法获取位置 0 的预测结果，确保其得分大于 1.0，然后显示 `Toast`\
  \ 消息（一种用于向用户显示提示的 Android 类）来显示匹配的手势名称。\n\n### 30.14 测试应用程序\n\n在模拟器或物理 Android 设备上构建并运行应用程序，然后在屏幕上执行圆形手势。执行后，应该弹出包含检测出手势名称的通知。注意，当手势被识别时，它会在屏幕上用黄色线条勾勒，而不确定的手势显示为淡黄色线条。这在开发期间很有用，但对于实际应用可能并不理想。因此，还有一些配置工作需要完成。\n\
  \n## 30.15 配置 GestureOverlayView\n\n默认情况下，`GestureOverlayView` 配置为在手势期间显示黄色线条。绘制识别和未识别手势的颜色可以通过\
  \ `android:gestureColor` 和 `android:uncertainGestureColor` 属性定义。例如，为了隐藏手势线条，如下修改示例项目中的\
  \ `activity_main.xml` 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n    android:id=\"\
  @+id/gOverlay\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    android:gestureColor=\"#00000000\"\n    android:uncertainGestureColor=\"\
  #00000000\" />\n```\n\n重新运行应用程序后，手势现在应该是不可见的（因为它们被绘制在 `ConstraintLayout` 视图的白色背景上）。\n\
  \n### 30.16 拦截手势\n\n\n\n\n\n`GestureOverlayView` 正如前所述，是一个放置在其他视图之上的透明覆盖层。这引出了问题：当识别出手势时，由手势覆盖层拦截的事件是否应该传递给底层的视图？这通过\
  \ `GestureOverlayView` 实例的 `android:eventsInterceptionEnabled` 属性来控制。当其设置为 `true`\
  \ 时，在识别出手势时，手势事件不会传递给底层视图。当在可能配置为响应特定手势而进行滚动的视图上执行手势时，此设置可能特别有用。将此属性设置为 `true` 可以避免手势被同时被解释为让底层视图向特定方向滚动的指令。\n\
  \n### 30.17 检测缩放手势\n\n在离开通用的触摸处理（特别是手势识别）之前，本章的最后一个主题是处理缩放手势。虽然可以使用本章之前章节概述的步骤来创建和检测各种手势，但实际上，使用目前讨论的技术还无法检测缩放手势（即使用两个手指进行拉伸和捏合动作，通常用于视图或图像的放大缩小）。\n\
  \n检测缩放手势最简单的方法是使用 Android 的 `ScaleGestureDetector` 类。泛而言，检测缩放手势涉及以下三个步骤：\n\n1. 声明一个实现\
  \ `SimpleOnScaleGestureListener` 接口的类类，包括所需的 `onScale()`、`onScaleBegin()` 和 `onScaleEnd()`\
  \ 回调方法。\n2. 创建 `ScaleGestureDetector` 类的实例，并将步骤 1 中创建的类实例作为参数传递。\n3. 在封装的 Activity\
  \ 中实现 `onTouchEvent()` 回调方法，该方法反过来调用 `ScaleGestureDetector` 类的 `onTouchEvent()`\
  \ 方法。\n\n在本章的剩余部分中，我们将创建一个示例，用于演示缩放手势识别的实现。\n\n### 30.18 缩放手势示例项目\n\n从欢迎界面选择 `New\
  \ Project` 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name`\
  \ 字段中输入 `PinchExample`，并指定 `com.ebookfrenzy.pinchexample` 为包名。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Java`。按照\
  \ 11.8 将项目迁移到 View Binding 中的步骤将项目转换为使用 view binding。\n\n在 `activity_main.xml` 文件中，选择默认的\
  \ `TextView` 对象并使用 `Attributes` 属性窗口将 ID 设置为 `myTextView`。\n\n找到并加载 `MainActivity.java`\
  \ 文件到 Android Studio 编辑器并按如下修改文件：\n\n```java\npackage com.ebookfrenzy.pinchexample;\n\
  \n.\n.\n\nimport android.view.MotionEvent;\n\nimport android.view.ScaleGestureDetector;\n\
  \nimport android.view.ScaleGestureDetector.SimpleOnScaleGestureListener;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    ScaleGestureDetector scaleGestureDetector;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  .\n.\n\n        scaleGestureDetector =\n                new ScaleGestureDetector(this,\n\
  \                        new MyOnScaleGestureListener());\n    }\n\n    @Override\n\
  \    public boolean onTouchEvent(MotionEvent event) {\n        scaleGestureDetector.onTouchEvent(event);\n\
  \        return true;\n    }\n\n    public class MyOnScaleGestureListener extends\n\
  \            SimpleOnScaleGestureListener {\n        @Override\n        public boolean\
  \ onScale(ScaleGestureDetector detector) {\n            float scaleFactor = detector.getScaleFactor();\n\
  \            if (scaleFactor > 1) {\n                binding.myTextView.setText(\"\
  Zooming In\");\n            } else {\n                binding.myTextView.setText(\"\
  Zooming Out\");\n            }\n        }\n    }\n}\n```\n\n\n\nFragment（碎片）只能作为活动的一部分使用，不能作为独立的应用程序元素进行实例化。然而，Fragment\
  \ 可以被视为一个功能性的“子活动”，其生命周期与完整活动周期相似。\n\nFragment 以 XML 布局文件的形式存储。它们可以通过在活动的布局文件中放置适当的\
  \ `<fragment>` 元素，或者通过活动类实现中的代码被添加到活动中。\n\n## 31.2 创建 Fragment\n\n构成 Fragment 的两个组件都是一个\
  \ XML 布局文件和一个对应的 Java 类。Fragment 的 XML 布局文件格式与任何其他活动布局的格式相同，可以包含任何组合和复杂度的布局管理器和视图。例如，下面的\
  \ XML 布局用于一个包含带有红色背景的 `ConstraintLayout` 的 Fragment，其中包含一个白色前景的 `TextView`：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/constraintLayout\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:background=\"@android:color/holo_red_dark\"\
  \n    tools:context=\".FragmentOne\">\n    <TextView\n        android:id=\"@+id/textView1\"\
  \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:text=\"My First Fragment\"\n        android:textAppearance=\"\
  @style/TextAppearance.AppCompat.Large\"\n        android:textColor=\"@color/white\"\
  \n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n与布局对应的类必须是\
  \ Android `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载 Fragment 布局。例如：\n\
  \n```java\npackage com.example.myfragmentdemo;\n\nimport android.os.Bundle;\nimport\
  \ android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import androidx.fragment.app.Fragment;\n\npublic class FragmentOne extends Fragment\
  \ {\n    @Override\n    public View onCreateView(LayoutInflater inflater,\n    \
  \                        ViewGroup container,\n                            Bundle\
  \ savedInstanceState) {\n        // Inflate the layout for this fragment\n     \
  \   binding = FragmentTextBinding.inflate(inflater, container, false);\n       \
  \ return binding.getRoot();\n    }\n}\n```\n\n除了 `onCreateView()` 方法外，类还可以重写标准的生命周期方法。\n\
  \n一旦创建了 Fragment 布局和类，Fragment 就可以在应用程序活动中使用。\n\n## 31.3 使用布局 XML 文件向活动添加 Fragment\n\
  \n可以通过编写 Java 代码或将 Fragment 嵌入到活动的 XML 布局文件中将其纳入活动中。无论使用哪种方法，需要注意的关键点是，当使用支持库以兼容旧版本的\
  \ Android 发布时，任何使用 Fragment 的活动必须实现为 `FragmentActivity` 的子类，而不是 `AppCompatActivity`\
  \ 类：\n\n```java\npackage com.example.myfragmentdemo;\n\nimport android.os.Bundle;\n\
  import androidx.fragment.app.FragmentActivity;\nimport android.view.Menu;\n\npublic\
  \ class MainActivity extends FragmentActivity {\n//\n.\n}\n```\n\nFragment 使用 `FragmentContainerView`\
  \ 类嵌入到活动布局文件中。下面的示例布局将本章上一节创建的 Fragment 嵌入到活动布局中：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n   \
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n\n    <androidx.fragment.app.FragmentContainerView\n\
  \        android:id=\"@+id/fragment_container\"\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"match_parent\"\n        tools:name=\"\
  com.example.myfragmentdemo.FragmentOne\" />\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n## 31.4 在代码中添加和管理 Fragment\n\n通过活动布局文件添加 Fragment 的便利性是以活动无法在运行时移除 Fragment\
  \ 为代价的。为了在运行时对 Fragment 实现完全动态控制，这些活动必须通过代码添加。当使用代码管理 Fragment 时，Fragment 仍然由一个\
  \ XML 布局文件和一个对应的类组成。区别在于宿主机活动内部操作 Fragment。使用代码向活动添加 Fragment 时有一套标准的步骤序列：\n\n1.\
  \ 创建 Fragment 类的实例。\n2. 通过类实例传递任何额外的意图参数（intent arguments）。\n3. 获取 `FragmentManager`\
  \ 实例的引用。\n4. 在 fragment 管理器实例上调用 `beginTransaction()` 方法。这返回一个 `FragmentTransaction`\
  \ 实例。\n5. 调用 fragment 事务实例的 `add()` 方法，参数传递包含 Fragment 的视图资源 ID 和 Fragment 类实例。\n\
  6. 调用 fragment 事务的 `commit()` 方法。\n\n例如，下面的代码将由 `FragmentOne` 类定义的 Fragment 添加到\
  \ ID 为 `LinearLayout1` 的容器中：\n\n```java\nFragmentOne firstFragment = new FragmentOne();\n\
  firstFragment.setArguments(getIntent().getExtras());\nFragmentManager fragManager\
  \ = getSupportFragmentManager();\nFragmentTransaction transaction = fragManager.beginTransaction();\n\
  transaction.add(R.id.LinearLayout1, firstFragment);\ntransaction.commit();\n```\n\
  \n上述代码将每个步骤拆分为单独语句以便于理解。然而，最后四行可以缩减为一行代码，如下：\n\n```java\ngetSupportFragmentManager().beginTransaction()\n\
  \          .add(R.id.LinearLayout1, firstFragment).commit();\n```\n\n一旦添加到容器中，随后可以通过调用\
  \ fragment 事务实例的 `remove()` 方法来移除 Fragment，该方法传递要移除的 Fragment 实例引用：\n\n```java\n\
  transaction.remove(firstFragment);\n```\n\n\n\n\n同样，可以通过调用片段事务（fragment transaction）实例的\
  \ `replace()` 方法将一个片段替换另一个片段。该方法的参数是包含片段的视图的 ID 以及新片段的实例。被替换的片段也可以放置在所谓的“回退栈”（back\
  \ stack）中，这样当用户导航回它时，可以快速恢复。这通过在调用 `commit()` 方法之前，先调用片段事务对象的 `addToBackStack()`\
  \ 方法来实现：\n\n```\nFragmentTwo secondFragment = new FragmentTwo();\n\ntransaction.replace(R.id.LinearLayout1,\
  \ secondFragment);\n\ntransaction.addToBackStack(null);\n\ntransaction.commit();\n\
  ```\n\n### 31.5 处理片段事件\n\n如之前讨论过的，片段就像一个子活动（sub-activity），拥有自己的布局、类和生命周期。片段内的视图组件（如按钮和文本视图）可以像普通活动一样产生事件。这引发了一个问题：由哪个类来接收来自片段中视图的事件？是片段本身，还是嵌入片段的活动？这个问题的答案取决于事件处理程序是如何声明的。\n\
  \n在标题为 Android 事件处理概述与示例的章节中，讨论了两种事件处理的方法。第一种方法是在活动代码中配置事件监听器和回调方法。例如：\n\n```java\n\
  binding.button.setOnClickListener(\n    new Button.OnClickListener() {\n       \
  \ public void onClick(View v) {\n            // 当按钮被点击时\n            // 执行的代码\n\
  \        }\n    }\n);\n```\n\n在拦截点击事件的情况下，第二种方法是在 XML 布局文件中设置 `android:onClick`\
  \ 属性：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:onClick=\"\
  onClick\"\n    android:text=\"Click me\" />\n```\n\n片段中视图生成的事件的通用规则是：如果在片段类中使用事件监听器和回调方法的方法声明了事件监听器，则事件将首先由片段处理。然而，如果使用了\
  \ `android:onClick` 资源，事件将直接传递给包含该片段的活动。\n\n### 31.6 实现片段通信\n\n一旦一个或多个片段嵌入到活动中，片段与活动之间、片段与片段之间很可能需要某种形式的通信。良好的做法规定片段之间不要直接通信。所有通信都应该通过封装它们的活动进行。\n\
  \n要与片段通信，活动必须通过分配给它的 ID 来标识片段对象。一旦获取了引用，活动就可以调用片段对象的公共方法。\n\n反方向的通信（从片段到活动）要稍微复杂一些。首先，片段必须定义一个监听器接口，然后在活动类中实现该接口。例如，以下代码在一个名为\
  \ `ToolbarFragment` 的片段上声明了一个 `ToolbarListener` 接口。该代码还声明了一个变量，稍后将在其中存储对活动的引用：\n\
  \n```java\npublic class ToolbarFragment extends Fragment {\n    ToolbarListener\
  \ activityCallback;\n\n    public interface ToolbarListener {\n        public void\
  \ onButtonClick(int position, String text);\n    }\n}\n```\n\n上述代码规定，任何实现 `ToolbarListener`\
  \ 接口的类都必须实现名为 `onButtonClick` 的回调方法，该方法反过来接受一个整数和一个 `String` 作为参数。\n\n接下来，需要重写并实现片段类的\
  \ `onAttach()` 方法。当片段初始化并与活动关联时，Android 系统会自动调用此方法。该方法会接收一个包含该片段的活动的引用。该方法必须存储该活动的本地引用，并验证它是否实现了\
  \ `ToolbarListener` 接口：\n\n```java\n@Override\npublic void onAttach(Context context)\
  \ {\n    super.onAttach(context);\n    try {\n        activityCallback = (ToolbarListener)\
  \ activity;\n    } catch (ClassCastException e) {\n    }\n}\n```\n\n### 31.7 总结\n\
  \n片段为创建可重用的界面布局和应用程序行为模块提供了一种强大的机制，这些模块一旦创建，就可以嵌入到活动中。可以通过将片段添加到活动的布局文件或编写代码在运行时管理片段并在活动中使用片段。在代码中添加到活动的片段可以在运行时动态地删除和替换。片段之间的所有通信都应该通过嵌入片段的活动进行。\n\
  \n### 32 在 Android Studio 中使用片段 - 示例\n\n如上一章所述，片段为创建可重用的功能模块提供了一种方便的机制，这些模块由用户界面的部分和相应的行为组成。\n\
  \n#### 32.1 关于示例片段应用程序\n\n在本章创建的应用程序由一个活动和两个片段组成。第一个片段的用户界面将包含一个工具栏，该工具栏由一个 `EditText`\
  \ 视图、一个 `SeekBar` 和一个 `Button` 组成，都包含在一个 `ConstraintLayout` 视图中。第二个片段将仅由 `ConstraintLayout`\
  \ 视图中的一个 `TextView` 对象组成。\n\n\n\n\n由于此应用程序旨在在较早版本的 Android 上运行，我们需要使用适当的 Android\
  \ 支持库。\n\n### 32.2 创建示例项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在出现的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name` 字段输入 `FragmentExample`，并将 `com.ebookfrenzy.fragmentexample`\
  \ 指定为包名。在点击 `Finish`（完成）之前，将 `Minimum API level`（最低  ）设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language`（语言）菜单更改为 `Java`。按照 11.8 将项目迁移到视图绑定 中概述的步骤修改项目以使用视图绑定（view binding）。\n\
  \n## 32.3 创建第一个 Fragment 布局\n\n下一步是为我们 Activity 中使用的第一个 Fragment 创建用户界面。\n\n该用户界面将由一个\
  \ XML 布局文件和一个 Fragment 类组成。虽然可以手动添加，但让 Android Studio 为我们创建会更快。在项目工具窗口中，找到 `app`\
  \ -> `java` -> `com.ebookfrenzy.fragmentexample` 项并右键点击它。从出现的菜单中，选择 `New` -> `Fragment`\
  \ -> `Gallery...` 选项以显示下方图 32-1 所示的对话框：\n\n![](img/as_fragment_gallery.jpg)\n\n\
  图 32-1\n\n在点击 `Next` 按钮之前选择 `Fragment (Blank)` 模板。在随后的屏幕上，将 fragment 命名为 `ToolbarFragment`，布局文件命名为\
  \ `fragment_toolbar`：\n\n![](img/as_new_fragment_java.jpg)\n\n图 32-2\n\n使用 `Design`\
  \ 模式将 `fragment_toolbar.xml` 文件加载到布局编辑器。接下来，右键点击 `Component Tree`（组件树）面板中的 `FrameLayout`\
  \ 项，选择 `Convert FrameLayout to ConstraintLayout`（将 FrameLayout 转换为 ConstraintLayout）菜单选项，并在确认对话框中接受默认设置。将\
  \ `id` 改为 `constraintLayout`。确保已启用 `Autoconnect`（自动连接）模式，然后选择并删除默认的 `TextView`，并布局添加\
  \ `Plain Text`、`Seekbar` 和 `Button` 控件，使其位置与图 32-3 所示。最后，分别将视图 ID 改为 `editText1`、`seekBar1`\
  \ 和 `button1`。\n\n将按钮文本改为“Change Text”，将文本提取为名为 `change_text` 的字符串资源，并从 `EditText`\
  \ 视图移除 `Name` 文本。最后，将 `Seekbar` 的 `layout_width` 属性设置为 `match_constraint`，左右边缘设置为\
  \ `16dp`。\n\n使用 `Infer constraints`（推断约束）工具栏按钮添加任何缺失的约束，此时布局应与下方图 32-3 所示：\n\n![](img/as_fragment_example_frag_one_ui.jpg)\n\
