  .\n}\n```\n\n## 81.9 添加打印菜单选项\n\n现在将根据“在 Android 上创建和管理溢出菜单”章节中概述的技术，将打印网页的选项添加到溢出菜单中。第一个要求是需要一个用于标记菜单选项标签的字符串资源。在\
  \ Project 工具窗口中，找到 `app` -> `res` -> `values` -> `strings.xml` 文件，双击将其加载到编辑器中，并修改它以添加新的字符串资源：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">WebPrint</string>\n    <string\
  \ name=\"action_settings\">Settings</string>\n    <string name=\"print_string\"\
  >Print</string>\n</resources>\n```\n\n接下来，将 `app` -> `res` -> `menu` -> `menu_main.xml`\
  \ 文件加载到菜单编辑器中，切换到 Code 模式，并将 Settings 选项替换为打印选项：\n\n```xml\n<menu xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\"com.ebookfrenzy.webprint.MainActivity\" >\n    <item\n   \
  \     android:id=\"@+id/action_settings\"\n        android:title=\"@string/action_settings\"\
  \n        android:orderInCategory=\"100\"\n        app:showAsAction=\"never\" />\n\
  \    <item\n        android:id=\"@+id/action_print\"\n        android:orderInCategory=\"\
  100\"\n        app:showAsAction=\"never\"\n        android:title=\"@string/print_string\"\
  />\n</menu>\n```\n\n在菜单选项配置方面，剩下的工作是修改 `MainActivity.java` 文件中的 `onOptionsItemSelected()`\
  \ 处理器方法：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem item)\
  \ {\n    int id = item.getItemId();\n    if (id == R.id.action_print) {\n      \
  \  createWebPrintJob(myWebView);\n        return true;\n    }\n    return super.onOptionsItemSelected(item);\n\
  }\n```\n\n实现 `onOptionsItemSelected()` 方法后，当从溢出菜单中选择打印选项时，活动将调用一个名为 `createWebPrintJob()`\
  \ 的方法。该方法的实现与之前的 HTMLPrint 项目中使用的相同，现在可以添加到 `MainActivity.java` 文件中，其内容如下：\n\n```java\n\
  package com.ebookfrenzy.webprint;\n\n.\n.\n.\n\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n.\n.\n    private void createWebPrintJob(WebView\
  \ webView) {\n        PrintManager printManager = (PrintManager) this\n        \
  \        .getSystemService(Context.PRINT_SERVICE);\n        PrintDocumentAdapter\
  \ printAdapter =\n                webView.createPrintDocumentAdapter(\"MyDocument\"\
  );\n        String jobName = getString(R.string.app_name) +\n                \"\
  \ Print Test\";\n        printManager.print(jobName, printAdapter,\n           \
  \     new PrintAttributes.Builder().build());\n    }\n}\n```\n\n实现 `onOptionsItemSelected()`\
  \ 方法后，当从溢出菜单中选择打印选项时，活动将调用一个名为 `createWebPrintJob()` 的方法。该方法的实现与之前的 HTMLPrint 项目中使用的相同，现在可以添加到\
  \ `MainActivity.java` 文件中，其内容如下所示（注：提供的文本在结尾包含几处重复/碎片句子；上述代码代表了所描述的核心逻辑）。\n\n\n\n\
  \n\n- `onWrite()` – 该方法在每次调用 `onLayout()` 之后被调用，负责在待打印页面的画布上渲染内容。除了其他参数外，该方法还会接收一个文件描述符，渲染完成后必须将生成的\
  \ PDF 文档写入该描述符。随后，将调用 `onWriteFinished()` 回调方法，并传递一个包含待打印页范围信息的参数。在 `PrintDocumentAdapter`\
  \ 子类中必须实现 `onWrite()` 方法。\n- `onFinish()` – 这是一个可选方法。如果实现了该方法，打印框架会在打印过程完成时调用它一次，从而为应用程序提供了执行任何必要的清理操作的机会。\n\
  \n## 82.2 准备自定义文档打印项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在出现的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `CustomPrint`，并指定 `com.ebookfrenzy.customprint`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置设置为 `API 26: Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单更改为 `Java`。\n\n将 `activity_main.xml` 布局文件加载到 `Layout\
  \ Editor`（布局编辑器）工具中，在 `Design` 模式的选择并删除“Hello World!” `TextView` 对象。从调面板的 `Common`\
  \ 部分拖入一个 `Button` 视图并将其放在布局视图的中心。选中 `Button` 视图，将 `text` 属性更改为“Print Document”并将字符串提取到资源。完成后，用户界面布局应与图\
  \ 82-1 所示一致。\n\n当应用程序中选中按钮时，需要调用一个方法来启动文档打印过程。留在 `Attributes` 工具窗口中，将 `onClick`\
  \ 属性设置为调用名为 `printDocument` 的方法。\n\n![](img/as_custom_print_ui.jpg)\n\n图 82-1\n\n\
  ## 82.3 创建自定义打印适配器\n\n在 Android 应用中打印自定义文档的大部分工作涉及自定义打印适配器的实现。此示例将需要一个实现了 `onLayout()`\
  \ 和 `onWrite()` 回调方法的打印适配器。在 `MainActivity.java` 文件中，添加此新类的模板，使其内容如下：\n\n```java\n\
  package com.ebookfrenzy.customprint;\n\n.\n\n.\n\nimport android.os.CancellationSignal;\n\
  import android.os.ParcelFileDescriptor;\nimport android.print.PageRange;\nimport\
  \ android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\nimport\
  \ android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    public static class MyPrintDocumentAdapter extends PrintDocumentAdapter\n\
  \    {\n        Context context;\n        MyPrintDocumentAdapter(Context context)\n\
  \        {\n            this.context = context;\n        }\n        @Override\n\
  \        public void onLayout(PrintAttributes oldAttributes,\n                 \
  \                    PrintAttributes newAttributes,\n                          \
  \           CancellationSignal cancellationSignal,\n                           \
  \          LayoutResultCallback callback,\n                                    \
  \ Bundle metadata) {\n        }\n        @Override\n        public void onWrite(final\
  \ PageRange[] pageRanges,\n                                     final ParcelFileDescriptor\
  \ destination,\n                                     final CancellationSignal cancellationSignal,\n\
  \                                     final WriteResultCallback callback) {\n  \
  \      }\n    }\n.\n\n.\n}\n```\n\n目前该新类的状态是它包含一个在创建新类实例时调用的构造方法。构造方法接收调用活动体的 `context`\
  \ 作为参数，并将其存储，以便稍后在两个回调方法中引用。\n\n在建立类大纲后，下一步是实现两个回调方法，从 `onLayout()` 开始。\n\n## 82.4\
  \ 实现 onLayout() 回调方法\n\n留在 `MainActivity.java` 文件中，开始添加 `onLayout()` 方法中的代码所需的某些导入指令：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n.\n\n.\nimport android.print.PrintInfo;\n\
  import android.print.PrintedDocument;\npublic class MainActivity extends AppCompatActivity\
  \ {\n.\n```\n\n接下来，修改 `MyPrintDocumentAdapter` 类，声明在 `onLayout()` 方法中使用的变量：\n\n\
  ```java\npublic static class MyPrintDocumentAdapter extends PrintDocumentAdapter\n\
  {\n    Context context;\n    int pageHeight;\n    int pageWidth;\n    PrintedDocument\
  \ myPdfDocument;\n    int pages;\n}\n```\n\n注意，对于此示例，将打印一个四页的文档。在复杂情况下，应用程序可能需要根据内容的布局动态计算页数。在声明变量后，按照下面的代码实现\
  \ `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes oldAttributes,\n\
  \                                     PrintAttributes newAttributes,\n         \
  \                            CancellationSignal cancellationSignal,\n          \
  \                           LayoutResultCallback callback,\n                   \
  \                  Bundle metadata) {\n    myPdfDocument = new PrintedDocument(context,\
  \ newAttributes);\n    pageHeight = Objects.requireNonNull(newAttributes.getMediaSize()).getHeightMils()/1000\
  \ * 72;\n    pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n\
  \    \n    if (cancellationSignal.isCanceled()) {\n        callback.onLayoutCancelled();\n\
  \        return;\n    }\n    if (pages > 0) {\n        PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo(\"print_output.pdf\")\n            .setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \            .setPageCount(pages);\n        PrintDocumentInfo info = builder.build();\n\
  \        callback.onLayoutFinished(info, true);\n    } else {\n        callback.onLayoutFailed(\"\
  Page count is zero.\");\n    }\n}\n```\n\n此方法执行了许多任务，每项都需要详细解释。\n\n首先，使用 `context`\
  \ 和 `newAttributes` 创建一个新的 `PrintedDocument`。传入 `onLayout()` 方法的一个参数是类型为 `PrintAttributes`\
  \ 的对象，包含了用户选择的纸张尺寸、分辨率和颜色设置。\n\n然后，方法从 `PrintAttributes` 对象中提取文档页面的高度和宽度值。这些维度以千分之一英寸为单位存储在对象中。由于示例中稍后使用这些值的方法以\
  \ 1/72 英寸为单位，因此在存储这些数字之前对其进行了转换。\n\n\n\n\n当调用 `onLayout()` 方法时，它会接收一个类型为 `LayoutResultCallback`\
  \ 的对象。该对象提供了一种方法，允许方法将状态信息传回给打印框架。例如，如果用户取消了打印过程，将调用 `onLayout()` 方法。进程已取消的事实通过\
  \ `CancellationSignal` 参数中的一个设置来指示。如果检测到取消，`onLayout()` 方法必须调用 `LayoutResultCallback`\
  \ 对象的 `onLayoutCancelled()` 方法，以通知打印框架已收到取消请求且布局任务已取消：\n\n```java\nif (cancellationSignal.isCanceled()\
  \ ) {\n    callback.onLayoutCancelled();\n    return;\n}\n```\n\n当布局工作完成后，该方法需要调用\
  \ `LayoutResultCallback` 对象的 `onLayoutFinished()` 方法，并传递两个参数。第一个参数是 `PrintDocumentInfo`\
  \ 对象，包含有关要打印文档的信息。这些信息由 PDF 文档的名称、内容类型（在本例中是文档而非图像）以及页数组成。第二个参数是一个 `Boolean` 值，表示自上一次调用\
  \ `onLayout()` 方法以来布局是否发生了变化：\n\n```java\nif (totalpages > 0) {\n    PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo\n            .Builder(\"print_output.pdf\")\n\
  \            .setContentType(\n                PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \            .setPageCount(totalpages);\n    PrintDocumentInfo info = builder.build();\n\
  \    callback.onLayoutFinished(info, true);\n} else {\n    callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n如果页数为零，代码将通过调用 `LayoutResultCallback` 对象的 `onLayoutFailed()`\
  \ 方法向打印框架报告此失败。调用 `onLayoutFinished()` 方法通知打印框架布局工作已完成，触发对 `onWrite()` 方法的调用。\n\n\
  ## 82.5 实现 `onWrite()` 回调方法\n\n`onWrite()` 回调方法负责渲染文档页面，然后通知打印框架文档已准备好进行打印。完成后，`onWrite()`\
  \ 方法的读取如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\n.\n.\nimport android.graphics.pdf.PdfDocument.PageInfo;\n\
  .\n.\n\n@Override\npublic void onWrite(final PageRange[] pageRanges,\n         \
  \           final ParcelFileDescriptor destination,\n                    final CancellationSignal\
  \ cancellationSignal,\n                    final WriteResultCallback callback) {\n\
  \    for (int i = 0; i < totalpages; i++) {\n        if (pageInRange(pageRanges,\
  \ i)) {\n            PageInfo newPage = new PageInfo.Builder(pageWidth,\n      \
  \                  pageHeight, i).create();\n            PdfDocument.Page page =\n\
  \                    myPdfDocument.startPage(newPage);\n            if (cancellationSignal.isCanceled())\
  \ {\n                callback.onWriteCancelled();\n                myPdfDocument.close();\n\
  \                myPdfDocument = null;\n                return;\n            }\n\
  \            drawPage(page, i);\n            myPdfDocument.finishPage(page);\n \
  \       }\n    }\n    try {\n        myPdfDocument.writeTo(new FileOutputStream(\n\
  \            destination.getFileDescriptor()));\n    } catch (IOException e) {\n\
  \        callback.onWriteFailed(e.toString());\n        return;\n    } finally {\n\
  \        myPdfDocument.close();\n        myPdfDocument = null;\n    }\n    callback.onWriteFinished(pageRanges);\n\
  }\n```\n\n`onWrite()` 方法通过遍历文档中的每一页开始。然而，重要的是需要考虑到用户可能请求只打印组成文档的某些页面。打印框架的用户界面面板提供了指定要打印特定页面或页码范围的选项。例如，图\
  \ 82-2 显示了打印面板配置为打印文档的第 1-4 页、第 9 页和第 11-13 页。\n\n![](img/Image24364.jpg)\n图 82-2\n\
  \n在将页面写入 PDF 文档时，`onWrite()` 方法必须采取措施确保只打印用户指定的页面。为了实现这一点，打印框架通过参数传递一个 `PageRange`\
  \ 对象数组，用以指示要打印的页码范围。在上述 `onWrite()` 实现中，对每一页都会调用 `pageInRange()` 方法，以验证该页是否在指定的范围内。`pageInRange()`\
  \ 方法的代码将在本章稍后的部分实现。\n\n```java\nfor (int i = 0; i < totalpages; i++) {\n    if (pageInRange(pageRanges,\
  \ i)) {\n```\n\n对于任何指定范围内的每一页，都会创建一个新的 `PdfDocument.Page` 对象。在创建新页面时，之前由 `onLayout()`\
  \ 方法存储的高度和宽度值将作为参数传递，以便使页面大小与用户选择的打印选项匹配：\n\n```java\nPageInfo newPage = new PageInfo.Builder(pageWidth,\
  \ pageHeight, i).create();\nPdfDocument.Page page = myPdfDocument.startPage(newPage);\n\
  ```\n\n与 `onLayout()` 方法一样，`onWrite()` 方法需要响应取消请求。在这种情况下，代码在关闭并取消引用 `myPdfDocument`\
  \ 之前通知打印框架已执行取消：\n\n```java\nif (cancellationSignal.isCanceled()) {\n    callback.onWriteCancelled();\n\
  \    myPdfDocument.close();\n    myPdfDocument = null;\n    return;\n}\n```\n\n\
  只要打印过程没有取消，方法就会调用一个方法在当前页面上绘制内容，然后调用 `myPdfDocument` 对象的 `finishPage()` 方法：\n\n\
  ```java\ndrawPage(page, i);\nmyPdfDocument.finishPage(page);\n```\n\n`drawPage()`\
  \ 方法负责在页面上绘制内容，并在 `onWrite()` 方法完成后实现。当所需的页面已添加到 PDF 文档后，会将文档写入作为 `onWrite()` 方法参数传递的文件描述符。如果由于任何原因写入操作失败，方法将通过调用\
  \ `WriteResultCallback` 对象的 `onWriteFailed()` 方法通知框架。\n\n```java\ntry {\n    myPdfDocument.writeTo(new\
  \ FileOutputStream(\n        destination.getFileDescriptor()));\n} catch (IOException\
  \ e) {\n    callback.onWriteFailed(e.toString());\n    return;\n} finally {\n  \
  \  myPdfDocument.close();\n    myPdfDocument = null;\n}\n```\n\n最后，调用 `WriteCallback`\
  \ 对象的 `onWriteFinished()` 方法通知打印框架文档已准备好打印。\n\n## 82.6 检查页面在范围内\n\n如前所述，当调用 `onWrite()`\
  \ 方法时，它会接收一个 `PageRange` 对象数组，指示要打印文档的页码范围。`PageRange` 类设计用于存储页范围的起始和结束页，这些可以通过类的\
  \ `getStart()` 和 `getEnd()` 方法访问。\n\n在上一节实现 `onWrite()` 方法时，调用了名为 `pageInRange()`\
  \ 的方法，该方法接收参数为 `PageRange` 对象数组和一个页码。`pageInRange()` 方法的作用是识别指定的页码是否在指定的范围内，并可以在\
  \ `MainActivity.java` 类中的 `MyPrintDocumentAdapter` 类中如下实现：\n\n```java\npublic class\
  \ MyPrintDocumentAdapter extends PrintDocumentAdapter {\n\n.\n.\n```\n\n\n\n\n```java\n\
  private boolean pageInRange(PageRange[] pageRanges, int page)\n{\n    for (PageRange\
  \ pageRange : pageRanges) {\n        if ((page >= pageRange.getStart()) &&\n   \
  \         (page <= pageRange.getEnd()))\n            return true;\n    }\n    return\
  \ false;\n}\n```\n\n## 82.7 在页面画布上绘制内容\n\n现在我们已经到了需要编写代码来在页面上绘制内容的阶段，以便这些页面准备好打印。所绘制的内容完全取决于具体的应用程序，仅受限于\
  \ Android `Canvas` 类能实现的功能。然而，在本示例中，我们将在画布上绘制一些简单的文本和图形。\n\n`onWrite()` 方法被设计为调用一个名为\
  \ `drawPage()` 的方法，该方法的参数是代表当前页面的 `PdfDocument.Page` 对象以及表示页码的整数。在 `MainActivity.java`\
  \ 文件中，该方法的实现方式如下所示：\n\n```java\npackage com.ebookfrenzy.customprint;\n\nimport android.graphics.Canvas;\n\
  import android.graphics.Color;\nimport android.graphics.Paint;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n\n    public static class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter {\n\n        private void drawPage(PdfDocument.Page\
  \ page, int pagenumber) {\n            Canvas canvas = page.getCanvas();\n     \
  \       pagenumber++; // 确保页码从 1 开始\n\n            int titleBaseLine = 72;\n   \
  \         int leftMargin = 54;\n            Paint paint = new Paint();\n       \
  \     paint.setColor(Color.BLACK);\n            paint.setTextSize(40);\n       \
  \     canvas.drawText(\n                \"Test Print Document Page \" + pagenumber,\n\
  \                leftMargin,\n                titleBaseLine,\n                paint);\n\
  \            paint.setTextSize(4);\n            canvas.drawText(\"This is some content\
  \ to verify that custom printing works\", leftMargin, titleBaseLine + 35, paint);\n\
  \            if (pagenumber % 2 == 0)\n                paint.setColor(Color.RED);\n\
  \            else\n                paint.setColor(Color.GREEN);\n            PageInfo\
  \ pageInfo = page.getInfo();\n            canvas.drawCircle(pageInfo.getPageWidth()/2f,\
  \ pageInfo.getPageHeight()/2f, 150, paint);\n        }\n    }\n}\n```\n\n代码中的页码计数从\
  \ 0 开始。由于文档通常从第 1 页开始，该方法首先递增存储的页码。然后获取与页面关联的 `Canvas` 对象引用，并声明了一些边距和基线值：\n\n```java\n\
  canvas = page.getCanvas();\npagenumber++;\nint titleBaseLine = 72;\nint leftMargin\
  \ = 54;\n```\n\n接下来，代码创建了 `Paint` 和 `Color` 对象用于绘制，设置了字体大小并绘制了页面标题文本，包括当前页码：\n\n\
  ```java\nPaint paint = new Paint();\npaint.setColor(Color.BLACK);\npaint.setTextSize(40);\n\
  canvas.drawText(\"Test Print Document Page \" + pagenumber, leftMargin, titleBaseLine,\
  \ paint);\n```\n\n随后减小了字体大小并在标题下方绘制了一些正文内容：\n```java\npaint.setTextSize(14);\ncanvas.drawText(\"\
  This is some content to verify that custom printing works\", leftMargin, titleBaseLine\
  \ + 35, paint);\n```\n\n该方法执行的最后一个任务是绘制一个圆（偶数页为红色，奇数页为绿色）。在确定页面是奇数还是偶数后，方法获取了页的高度和宽度，然后使用这些信息将圆放置在页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2f,\
  \ pageInfo.getPageHeight()/2f, 150, paint);\n```\n\n在画布上绘制完成后，该方法将控制权交回 `onWrite()`\
  \ 方法。随着 `drawPage()` 方法的完成，`MyPrintDocumentAdapter` 类编写完毕。\n\n## 82.8 启动打印任务\n\n\
  当用户点击“打印文档”按钮时，将调用 `printDocument()` 事件处理方法。测试之前剩下的工作是将此方法添加到 `MainActivity.java`\
  \ 文件中，特别注意确保将其放置在 `MyPrintDocumentAdapter` 类之外：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \nimport android.print.PrintManager;\nimport android.view.View;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    public void printDocument(View view)\
  \ {\n        PrintManager printManager = (PrintManager) this.getSystemService(Context.PRINT_SERVICE);\n\
  \        String jobName = this.getString(R.string.app_name) + \" Document\";\n \
  \       printManager.print(jobName, new MyPrintDocumentAdapter(this), null);\n \
  \   }\n}\n```\n\n该方法在创建新的 `String` 对象作为打印任务名称之前，获取了在设备上运行的打印管理器服务的引用。最后，调用 `PrintManager`\
  \ 的 `print()` 方法来启动打印任务，传递任务名称和我们的打印文档适配器类的实例。\n\n### 82.9 测试应用程序\n\n在 Android 设备或模拟器上编译并运行应用程序。当应用程序加载后，点击“打印文档”按钮启动打印任务，并选择一个合适的输出目标（保存为\
  \ PDF 选项可以节省纸张和墨水）。\n\n检查打印输出，它应该包含 4 页的文本和图形。例如，图 82-3 显示了准备保存到设备上的 PDF 文件页面。\n\
  \n尝试其他的打印配置选项，例如在打印面板中更改纸张大小、方向和页面设置。打印输出应反映每个设置的变化，表明自定义打印适配器工作正常。\n\n![](img/as_4.1_custom_print_running.jpg)\n\
  图 82-3\n\n## 82.10 总结\n\n虽然比 Android 框架提供的 HTML 和图像打印复杂，但自定义打印为 Android 应用程序打印复杂内容提供了很大的灵活性。实现自定义打印的大部分工作涉及创建一个打印适配器类，该类不仅要在页面上绘制内容，还要在用户更改设置（如纸张大小和页面范围）时做出正确响应。\n\
  \n## 83 Android App Links 简介\n\n随着技术的发展，Web 和移动内容之间的传统界限正变得模糊。这一点在领域尤为明显，渐进式 Web\
  \ 应用日益流行，这些应用的外观和行为非常类似于移动应用。\n\n另一个趋势是让移动应用的内容可以通过网络搜索和 URL 链接被发现。在 Android 应用开发背景下，App\
  \ Links 功能旨在让用户更容易发现并访问存储在 Android 应用中的内容，即使用户尚未安装该应用。\n\n### 83.1 Android App Links\
  \ 概述\n\n\n\n\n\n应用链接（App link）是一种标准的 HTTP URL，它是从外部源（如网站或应用）直接链接到应用中特定位置的便捷方式。应用链接（也称为深度链接\
  \ deep links）主要用于鼓励用户与应用交互，并允许用户共享应用内容。\n\n应用链接的实现是一个多步骤过程，涉及在项目清单（manifest）中添加意过滤器（intent\
  \ filters）、在关联的应用活动（activities）中实现链接处理代码，以及使用数字资产链接文件（digital asset links files）将应用与基于网络的内容关联。\n\
  \n这些步骤可以通过手动修改项目来完成，也可以使用 Android Studio App Links 助手自动完成。\n\n本章的剩余部分将从对项目必须进行的更改来概述应用链接的实现。下一章（“Android\
  \ Studio App Links 教程”）将演示如何使用 App Links 助手来实现相同的效果。\n\n## 83.2 应用链接意过滤器\n\n应用链接\
  \ URL 需要映射到应用项目中的特定活动。这是通过在项目的 `AndroidManifest.xml` 文件中添加意过滤器实现的，这些过滤器旨在响应 `android.intent.action.VIEW`\
  \ 动作来启动活动。意过滤器声明在要启动的活动元素内部，并且包含概述应用链接 URL 的方案（scheme）、主机（host）和路径（path）的数据。例如下面的清单片段声明了一个意过滤器，当检测到匹配\
  \ `http://www.example.com/welcome` 的应用链接时，启动名为 `MyActivity` 的活动：\n\n```xml\n<activity\
  \ android:name=\"com.ebookfrenzy.myapp.MyActivity\">\n    <intent-filter android:autoVerify=\"\
  true\">\n        <action android:name=\"android.intent.action.VIEW\" />\n      \
  \  <category android:name=\"android.intent.category.DEFAULT\" />\n        <category\
  \ android:name=\"android.intent.category.BROWSABLE\" />\n        <data\n       \
  \     android:scheme=\"http\"\n            android:host=\"www.example.com\"\n  \
  \          android:pathPrefix=\"/welcome\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n处理歧义意过滤器的顺序可以使用意过滤器标签的 `order` 属性指定，如下所示：\n\n```xml\n<application>\n    <activity\
  \ android:name=\" com.ebookfrenzy.myapp.MyActivity\">\n        <intent-filter android:autoVerify=\"\
  true\" android:order=\"1\">\n....\n```\n\n意过滤器会导致应用链接启动正确的活动，但仍必须在目标活动中添加代码以适当处理该意图。\n\
  \n## 83.3 处理应用链接意图\n\n在大多数情况下，启动的活动需要获取应用链接 URL 的访问权限，并根据 URL 的结构采取特定操作。接上例例，当通过包含\
  \ `/welcome/newuser` 路径的 URL 启动活动时，其显示的内容可能与路径设置为 `/welcome/existinguser` 的 URL\
  \ 不同。\n\n当链接启动活动时，会传递一个意图对象（intent object），该对象包含启动活动的动作的数据，以及一个包含应用链接 URL 的 `Uri`\
  \ 对象。在活动的初始化阶段，可以添加代码按如下方式提取这些数据：\n\n```java\nIntent appLinkIntent = getIntent();\n\
  String appLinkAction = appLinkIntent.getAction();\nUri appLinkData = appLinkIntent.getData();\n\
  ```\n\n获取应用链接的 `Uri` 后，可以使用构成 URL 路径的各种组件来决定在活动中执行的操作。在下面的代码示例中，使用 URL 的最后一个组件来识别是否应该为新用户或现有用户显示内容：\n\
  \n```java\nString userType = appLinkData.getLastPathSegment();\nif (userType.equals(\"\
  newuser\")) {\n    // 显示新用户内容\n} else {\n    // 显示现有用户内容\n}\n```\n\n### 83.4 将应用与网站关联\n\
  \n应用链接生效之前，应用链接 URL 必须与基于应用链接的网站关联。这是通过创建一个名为 `assetlinks.json` 的数字资产链接文件并将其安装在网站的\
  \ `.well-known` 文件夹实现的。注意，数字资产链接仅适用于基于 HTTPS 的网站。\n\n数字资产链接文件包含一个关系声明（relation statement），用于授予目标应用使用网站链接\
  \ URL 启动的权限，以及目标声明（target statement），用于声明该项目的伴侣应用包名和 SHA-256 证书指纹。例如，典型的资产链接文件可能如下：\n\
  \n```json\n[{\n    \"relation\": [\"delegate_permission/common.handle_all_urls\"\
  ],\n    \"target\" : { \"namespace\": \"android_app\",\n      \"package_name\":\
  \ \"<app package name here>\",\n      \"sha256_cert_fingerprints\": [\"<app certificate\
  \ here\"] }\n}]\n```\n\n`assetlinks.json` 文件可以包含多个数字资产链接，允许单个网站与多个应用关联。\n\n### 83.5\
  \ 总结\n\nAndroid App Links 允许通过来自网站的链接启动活动。应用链接通过项目清单中的意过滤器和启动活动中的处理代码来实现。通过使用数字资产链接文件，还可以将链接中使用的域名与相应的网站关联。一旦建立关联，在使用应用链接时\
  \ Android 就不再需要用户选择目标应用。\n\n# 84. Android Studio App Links 教程\n\n本章将提供 Android 应用链接和\
  \ Android Studio Link 助手的实际演示。本章将为现有应用添加应用链接支持，允许通过 URL 启动活动。除了启动活动外，显示的内容将由 URL\
  \ 的路径指定。\n\n### 84.1 关于示例应用\n\n本章使用的项目名为 `AppLinking`，是一个旨在让用户查找地点的基础应用。该应用通过标准内容提供者访问\
  \ SQLite 数据库。该应用有一个包含伦敦旅游景点的现有数据库。除了现有条目外，应用还允许用户添加和删除描述。\n\n该项目由两个活动组成，分别名为 `AppLinkingActivity`\
  \ 和 `LandmarkActivity`。`AppLinkingActivity` 是应用启动时的主活动。该活动允许用户输入搜索标准并向数据库添加记录。当搜索找到匹配记录时，`LandmarkActivity`\
  \ 将启动并显示相关景点的信息。\n\n本章将增强应用以支持应用链接，以便可以在应用内显示特定的景点记录。\n\n### 84.2 数据库模式\n\n示例应用的数据位于名为\
  \ `landmarks.db` 的文件中，位于项目层级的 app -> assets -> databases 。数据库包含一个名为 `locations`\
  \ 的表，其结构如表 84-1 所示：\n\n| 列 | 类型 | 说明 |\n| :--- | :--- | :--- |\n| `_id` | String\
  \ | 主索引，此列包含唯一标识数据库中地点的字符串。 |\n| `title` | String | 地点的名称（例如，伦敦桥）。 |\n| `description`\
  \ | String | 地点的描述。 |\n| `personal` | Boolean | 表明记录是私人的还是公共的。对于用户添加的所有记录，此值被设置为\
  \ true。数据库提供的现有记录设置为 false。 |\n\n表 84-1\n\n## 84.3 加载并运行项目\n\n该项目位于以下 URL 示例源码下载压缩包的\
  \ `AppLinking` 文件夹中：\n\n\n\n\n\n[`www.payloadbooks.com/product/iguanajava`](https://www.payloadbooks.com/product/iguanajava)\n\
  \n找到文件夹后，在 Android Studio 中打开它，并在设备或模拟器上运行应用。一旦应用启动，将出现下方图 84-1 所示的屏幕：\n\n![](img/as_applinking_ui_home.jpg)\n\
  \n图 84-1\n\n按照目前的实现方式，地标是使用位置 ID 进行定位的。默认数据库配置当前包含两个由 ID `londonbridge` 和 `toweroflondon`\
  \ 引用的记录。在 ID 字段中输入 `londonbridge` 并点击 Find 按钮来测试搜索功能。当找到匹配的记录时，将启动第二个活动（`LandmarkActivity`）并传递有关要显示记录的信息。这些信息以添加到\
  \ `Intent` 对象的额外数据的形式存在。`LandmarkActivity` 使用这些信息从数据库中提取记录，并使用图 84-2 所示的屏幕向用户显示：\n\
  \n![](img/as_applinking_ui_london_bridge.jpg)\n\n图 84-2\n\n## 84.4 添加 URL 映射\n\n\
  现在应用已经加载到 Android Studio 并经过了测试，我们可以添加应用链接（App Link）支持。目标是让 `LandmarkActivity` 屏幕响应应用链接点击而启动并显示信息。这是通过将\
  \ URL 映射到 `LandmarkActivity` 实现的。在本示例，URL 的格式如下：\n\n`http://<website domain>/landmarks/<landmarkId>`\n\
  \n完成所有步骤后，例如，以下 URL 将导致应用显示有关伦敦塔的信息：\n\n`http://www.yourdomain.com/landmarks/toweroflondon`\n\
  \n要向项目添加 URL 映射，首先通过 `Tools -> App Links Assistant` 菜单选项打开 App Links 助手。打开后，助手将如图\
  \ 84-3 所示：\n\n![](img/as_app_links_assistant_main.jpg)\n\n图 84-3\n\n接下来，点击 `Create\
  \ Applink` 按钮显示下方面板：\n\n![](img/as_app_links_assistant.jpg)\n\n图 84-4\n\n点击 `Open\
  \ URL Mapping Editor` 按钮将 URL 映射到活动。在映射屏幕中，点击 `+` 按钮（在图 84-5 中突出显示）添加新 URL：\n\n\
  ![](img/as_app_links_assistant_mappings.jpg)\n\n图 84-5\n\n在 `Add URL Mapping` 对话框的\
  \ `Host` 字段中，输入你网站的 URL。如果你没有可用于本教程的网站，仍然可以使用 `http://www.example.com` 遵循本章的大部分内容，但无法测试需要存在\
  \ Digital Asset Links 文件的功能。\n\n`Path` 字段（在下方图 84-6 中标记为 B）是声明 URL 路径组件的地方。路径必须以\
  \ `/` 开头，因此在此字段中输入 `/landmarks`。\n\n`Path` 菜单 (B) 提供了以下三种路径匹配选项：\n\n- `path` – URL\
  \ 必须与 URL 的路径组件完全匹配才能启动活动。例如，如果路径设置为 `/landmarks`，则 `http://www.example.com/landmarks`\
  \ 将被视为匹配。然而，`http://www.example.com/landmarks/londonbridge` URL 将不被视为匹配。\n- `pathPrefix`\
  \ – 指定路径仅被视为前缀。在 `/landmarks` 组件之后可以包含额外的路径组件（例如，`http://www.example.com/landmarks/londonbridge`\
  \ 仍被视为匹配）。\n- `pathPattern` – 允许使用基本正则表达式和通配符形式的模式匹配来指定路径，例如 `landmarks/*/[l-L]ondon/*`\n\
  \n由于此示例中的路径是地标 ID 组件的前缀，请选择 `pathPrefix` 菜单选项。\n\n最后，使用 `Activity` 菜单 (C) 选择 `LandmarkActivity`\
  \ 作为响应应用链接而启动的活动：\n\n![](img/as_app_links_url_mapping.jpg)\n\n图 84-6\n\n完成对话框中的设置后，点击\
  \ `OK` 按钮提交更改。通过在映射屏幕的 `Check URL Mapping` 字段中输入以下 URL（其中 `<your domain>` 设置为上方\
  \ `Host` 字段中指定的域名），检查 URL 格式是否正确并分配给相应的活动：\n\n`http://<your domain>/landmarks/toweroflondon`\n\
  \n如果配置正确，`LandmarkActivity` 将被列为映射的活动：\n\n![](img/as_app_links_check_url.jpg)\n\n\
  图 84-7\n\n最新版本的 Android 要求为 HTTP 和 HTTPS 协议声明 App Links，即使只使用其中一种。因此，在继续下一步之前，请重复上述步骤将\
  \ HTTPS 版本的 URL 添加到列表中。\n\n下一步也将在 App Links 助手的 URL 映射屏幕中执行，因此请保持该屏幕选中状态。\n\n##\
  \ 84.5 添加意过滤器\n\n正如上一节所述，需要意过滤器来响应应用链接启动目标活动。事实上，当添加 URL 映射时，意过滤器已自动添加到项目清单文件中。在助手中选中\
  \ URL 映射，向下滚动屏幕直到看到意过滤器。预览应包含修改后的 `AndroidManifest.xml` 文件：\n\n![](img/intent_filter.jpg)\n\
  \n8\n\n虽然 App Links 为我们添加了意过滤器，但在处理应用链接时可能没有包含 `autoVerify` 设置。打开 `manifests ->\
  \ Android.xml` 文件，为两个意过滤器添加此设置：\n\n```xml\n<intent-filter autoVerify=\"true\">\n\
  \    <data scheme=\"http\" />\n    <data host=\"www.example.com\" />\n    <data\
  \ pathPrefix=\"/landmarks\" />\n</intent-filter>\n<intent-filter autoVerify=\"true\"\
  >\n    <data scheme=\"https\" />\n    <data host=\"www.example.com\" />\n    <data\
  \ pathPrefix=\"/landmarks\" />\n</intent-filter>\n```\n\n## 84.6 添加意处理代码\n\n之前的步骤确保了响应相应的应用链接启动正确的活动。下一步是在\
  \ `LandmarkActivity` 类中处理意，以便从数据库中提取正确的记录并向用户显示。在修改 `LandmarkActivity.java` 文件中的代码之前，审查现有代码是有值得的。在代码编辑器中打开\
  \ `LandmarkActivity.java` 文件并找到 `onCreate()` 和 `handleIntent()` 方法，它们目前的内容如下：\n\n\
  ```\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view\
  \ = binding.getRoot();\n    setContentView(view);\n    handleIntent(getIntent());\n\
  }\n\nprivate void handleIntent(Intent intent) {\n    String landmarkId = intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```\n\n在当前形式下，代码期望在 `Intent` 包中找到地标 ID。由于活动现在可以通过应用链接启动，必须更改此代码以处理两种情况。首先从\
  \ `onCreate()` 方法中删除对 `handleIntent()` 的调用：\n\n```\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n}\n```\n\n\n\n\n\n要添加初始的 App 链接意图处理代码，返回 App Links 助手面板并点击步骤\
  \ 2 下列出的 `Select Activity` 按钮。在活动选择对话框中，在点击 `Insert Code` 按钮之前，选择 `LandmarkActivity`\
  \ 条目：\n\n![](img/as_app_links_select_activity.jpg)\n\n图 84-9\n\n返回 `LandmarkActivity.java`\
  \ 文件并注意以下代码已插入到 `onCreate()` 方法中（注意，如果 Android Studio 无法完成此请求，您可以手动添加此代码）：\n\n```java\n\
  // ATTENTION: This was auto-generated to handle app links.\n\nIntent appLinkIntent\
  \ = getIntent();\n\nString appLinkAction = appLinkIntent.getAction();\n\nUri appLinkData\
  \ = appLinkIntent.getData();\n```\n\n这段代码访问 `Intent` 对象并提取 `Action` 字符串和 `Uri`。如果活动启动由于\
  \ App 链接，则 action 字符串将设置为 `android.intent.action.VIEW`，这与添加到清单文件中的意图过滤器中声明的 action\
  \ 相匹配。相反，如果活动是由主活动中 `findLandmark()` 方法中的标准意图启动代码启动的，则 action 字符串将为 null。通过检查赋值给\
  \ action 字符串的值，可以编写代码识别活动是如何启动的并采取适当的操作：\n\n.\n\n.\n\n```java\nimport android.net.Uri;\n\
  \n.\n\n.\n\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n  \
  \  super.onCreate(savedInstanceState);\n.\n.\n    // ATTENTION: This was auto-generated\
  \ to handle app links.\n    Intent appLinkIntent = getIntent();\n    String appLinkAction\
  \ = appLinkIntent.getAction();\n    Uri appLinkData = appLinkIntent.getData();\n\
  \    String landmarkId = appLinkData.getLastPathSegment();\n    if (landmarkId !=\
  \ null) {\n        displayLandmark(landmarkId);\n    }\n}\n```\n\n只需在该方法中添加一些额外代码，以识别\
  \ App 链接 URL 路径中的最后一个组件，并在查询数据库时将其作为地标 ID：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n.\n.\n    // ATTENTION: This was auto-generated\
  \ to handle app links.\n    Intent appLinkIntent = getIntent();\n    String appLinkAction\
  \ = appLinkIntent.getAction();\n    Uri appLinkData = appLinkIntent.getData();\n\
  \    if (appLinkAction != null) {\n        if (appLinkAction.equals(\"android.intent.action.VIEW\"\
  )) {\n            String landmarkId = appLinkData.getLastPathSegment();\n      \
  \      if (landmarkId != null) {\n                displayLandmark(landmarkId);\n\
  \            }\n        }\n    } else {\n        handleIntent(appLinkIntent);\n\
  \    }\n}\n```\n\n如果 action 字符串不为 null，则进行检查验证其是否已设置为 `android.intent.action.VIEW`，然后提取\
  \ `Uri` 路径的最后一个组件。该组件随后在执行数据库查询时作为地标 ID。相反，如果 action 字符串为 null，则调用现有的 `handleIntent()`\
  \ 方法从意图数据中提取 ID。\n\n### 84.7 测试 App\n\n在设备或模拟器上运行应用，并仍然可以搜索示例地标。我们现在已成功地为应用添加了 App\
  \ 链接支持。如果您为 App 链接指定了了自己的网站 URL，我们现在可以通过创建并安装数字资产链接文件（Digital Asset Links file）来更进一步。\n\
  \n### 84.8 创建数字资产链接文件\n\n正如“Android Intents 概述”章节概述，为了完全支持 App 链接，我们需要在 App 链接引用的网站上安装数字资产链接文件。首先按照“Android\
  \ Intents 概述”中列出的步骤找到您的 `debug.keystore` 文件并识别您的 `SHA256` 指纹。\n\n接下来，在网络浏览器中打开以下页面：\n\
  \n[`developers.google.com/digital-asset-links/tools/generator`](https://developers.google.com/digital-asset-links/tools/generator)\n\
  \n![](img/asset_file_generator.jpg)\n\n页面加载后，在 Hosting site domain 字段中输入您的网站 URL，将\
  \ `com.ebookfrenzy.applinking` 作为 App 包名，并将您的 `SHA256` 指纹输入到 App 包指纹 (`SHA256`)\
  \ 字段中：\n\n![](img/asset_file_generator.jpg)\n\n图 84-10\n\n点击 `Generate` 按钮显示生成的语句，并将其放在\
  \ Web 服务器上名为 `.well-known` 的文件夹中名为 `assetlinks.json` 的文件中。返回生成器页面并点击 Test 按钮以验证文件是否位于正确位置。如果测试成功，将出现类似以下的输出：\n\
  \n![](img/asset_test.jpg)\n\n图 84-11\n\n假设测试成功，Landmark 活动应该在设备上启动并显示关于伦敦桥的信息。\n\
  \n### 84.1 总结\n\n本章演示了在 Android 项目中实现 App Link 链接支持的步骤，包括使用 App Link 助手、意图过滤器、使用数字资产链接文件进行网站关联以及\
  \ App 链接测试。\n\n# 85. 生物识别认证\n\n许多 Android 设备现在内置了触控传感器，用于识别用户并提供对设备和应用程序功能的访问，例如使用指纹识别的应用内支付选项。指纹识别只是多种身份验证方法之一，还包括密码、PIN\
  \ 以及最近的面部识别。\n\n尽管目前市场上只有少数 Android 设备提供面部识别，但这在未来可能会变得更加常见。为了应对这一点，Google 已开始从以指纹为中心的向应用添加身份验证的方法转向一种更通用的方法，称为生物识别认证（biometric\
  \ authentication）。\n\n本章提供了生物识别认证的概述，并提供了一个详细的逐步教程，演示了在 Android 项目中实现生物识别认证的实用方法。\n\
  \n### 85.1 生物识别认证概述\n\n关键生物识别认证组件是 `BiometricPrompt` 类。该类执行了许多以前必须通过编写代码完成的工作，包括显示标准对话框引导用户完成身份验证过程、执行身份验证并将结果报告给应用。该类还处理了过多的失败验证尝试，并在用户再次尝试之前强制执行超时。\n\
  \n`BiometricPrompt` 类包含一个伴侣类 `Builder`，用于配置和创建 `BiometricPrompt` 实例，包括定义要在生物识别认证对话框中显示的文本以及对对话框中取消按钮（也称为否定按钮）进行自定义。\n\
  \n`BiometricPrompt` 实例还分配了一组身份验证回调，这些回调将被调用以向应用提供身份验证操作的结果。`CancellationSignal`\
  \ 实例允许应用在处理过程中取消认证。\n\n在涵盖这些基础知识后，本章的剩余部分将在示例项目中实现基于指纹的生物识别认证。\n\n### 85.2 创建生物识别认证项目\n\
  \n从欢迎屏幕选择 `New Project` 选项，并在产生的新项目对话框中选择 `Empty Views Activity` 模板，然后点击 `Next`\
  \ 按钮。\n\n\n\n\n\n在 `Name` 字段中输入 `BiometricDemo`，并指定 `com.ebookfrenzy.biometricdemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 29: Android (Q)`，并将 `Language`\
  \ 菜单更改为 `Java`。\n\n# 85.3 配置设备指纹认证\n\n指纹认证适用于包含触摸传感器的设备，并且该设备已采取了适当的配置步骤以确保设备安全并录入至少一个指纹。有关配置模拟器会话以测试指纹认证的步骤，请参阅章节“使用和配置\
  \ Android Studio AVD 模拟器”。\n\n通过打开 `Settings` 应用程序并选择 `Security` 选项，可以在物理设备上配置指纹认证。在\
  \ `Security` 设置屏幕中，选择 `Fingerprint` 选项。在弹出的信息屏幕上点击 `Next` 按钮进入 `Fingerprint` 设置屏幕。在启用指纹安全之前，必须配置备用的锁屏解锁方法（例如\
  \ `PIN`）。如果锁屏未加密，请按照步骤配置 `PIN`、`pattern` 或 `password` 安全。\n\n锁屏加密后，继续进入指纹检测屏幕，并在提示时触摸传感器(图\
  \ 85-1)，如果需要，重复此过程添加额外的指纹。\n\n![](img/Image24253.jpg)\n\n图 85-1\n\n# 85.4 在 Manifest\
  \ 文件添加生物识别权限\n\n生物识别认证要求应用在项目 manifest 文件中请求 `USE_BIOMETRIC` 权限。在 Android Studio\
  \ 项目工具窗口中，找到并编辑 `app` -> `manifests` -> `AndroidManifest.xml` 文件，按如下方式添加权限请求：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.biometricdemo\">\n    <uses-permission\n       \
  \ android:name=\"android.permission.USE_BIOMETRIC\" />\n</manifest>\n```\n\n###\
  \ 85.5 设计用户界面\n\n为了使示例尽可能简单，用户界面中的唯一视觉元素将是一个 `Button` 视图。找到并选择 `activity_main.xml`\
  \ 布局资源文件，将其加载到 `Layout Editor` 工具中。\n\n删除示例 `TextView` 对象，从调色板的 `Common` 类别拖放一个\
  \ `Button` 对象并将其放置在布局画布的中心。使用 `Attributes` 工具窗口，将按钮上的 `text` 属性更改为“Authenticate”，并将字符串提取到资源中。最后，配置\
  \ `onClick` 属性以调用名为 `authenticateUser` 的方法。\n\n完成上述步骤后，布局应与图 85-2 所示所示：\n\n![](img/as_biometric_demo_ui.jpg)\n\
  \n图 85-2\n\n# 85.6 添加 Toast 便利方法\n\n在示例代码的各个点中，应用将设计为通过 `Toast` 消息向用户显示信息。为了避免多次重复相同的\
  \ `Toast` 代码，将在 `main activity` 中添加一个名为 `notifyUser()` 的便利方法。该方法将接受单个 `String` 值并将其作为\
  \ `Toast` 消息显示给用户。现在编辑 `MainActivity.java` 文件并按如下添加此方法：\n\n```java\nimport android.widget.Toast;\n\
  \nprivate void notifyUser(String message) {\n    Toast.makeText(this,\n        \
  \    message,\n            Toast.LENGTH_LONG).show();\n}\n```\n\n# 85.7 检查安全设置\n\
  \n在本章前面的部分，已经采取了步骤在测试应用的设备或模拟器上配置锁屏并注册了指纹。然而，在应用中包含防御性代码很重要，以确保在尝试请求指纹认证之前已满足这些要求。这些步骤将在\
  \ `MainActivity.java` 文件中的 `onCreate` 方法中执行，使用 `Keyguard` 和 `PackageManager` 管理服务。注意，还添加了代码来验证应用是否配置了\
  \ `USE_BIOMETRIC` 权限：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.app.KeyguardManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       checkBiometricSupport();\n    }\n\n    private void checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager =\n                (KeyguardManager)\
  \ getSystemService(KEYGUARD_SERVICE);\n        if (!keyguardManager.isGuardSecure())\
  \ {\n            notifyUser(\"Lock security not enabled\");\n        }\n       \
  \ if (ActivityCompat.checkSelfPermission(this,\n                Manifest.permission.USE_BIOMETRIC)\
  \ !=\n                PackageManager.PERMISSION_GRANTED) {\n            notifyUser(\"\
  Fingerprint permission not enabled\");\n        }\n    }\n}\n```\n\n上述代码首先使用 `Keyguard`\
  \ 管理器验证是否配置了备用解锁方法（也就是说，可以使用 `PIN` 或身份验证方法作为指纹认证的替代来解锁屏幕）。如果锁屏未加密，代码将向用户报告问题并从方法返回。该方法在使用包管理器验证设备上是否有指纹认证之前，检查用户是否为应用启用了生物识别权限。\n\
  \n# 85.8 配置回调\n\n配置生物识别提示时，需要分配一组回调以通知应用认证过程的成功或失败。这些方法需要封装在 `BiometricPrompt.AuthenticationCallback`\
  \ 实例中。在 `MainActivity.java` 文件中，添加一个方法来创建并返回一个实现了相应方法的类实例：\n\n```java\nimport android.hardware.biometrics.BiometricPrompt;\n\
  \nprivate BiometricPrompt.AuthenticationCallback getAuthenticationCallback() {\n\
  \    return new BiometricPrompt.AuthenticationCallback() {\n        @Override\n\
  \        public void onAuthenticationError(int errorCode,\n                CharSequence\
  \ errString) {\n            notifyUser(\"Authentication error: \" + errString);\n\
  \            super.onAuthenticationError(errorCode, errString);\n        }\n   \
  \     @Override\n        public void onAuthenticationHelp(int helpCode,\n      \
  \          CharSequence helpString) {\n            super.onAuthenticationHelp(helpCode,\
  \ helpString);\n        }\n        @Override\n        public void onAuthenticationFailed()\
  \ {\n            super.onAuthenticationFailed();\n        }\n        @Override\n\
  \        public void onAuthenticationSucceeded(\n                BiometricPrompt.AuthenticationResult\
  \ result) {\n            notifyUser(\"Authentication Succeeded\");\n           \
  \ super.onAuthenticationSucceeded(result);\n        }\n    };\n}\n```\n\n# 85.9\
  \ 添加 CancellationSignal\n\n\n\n\n一旦启动，生物识别身份验证过程将独立于 App 执行。为了为 App 提供取消操作的方法，将创建一个\
  \ `CancellationSignal` 类的实例并将其传递给生物识别身份验证过程。此 `CancellationSignal` 实例可以在需要时用于取消该过程。取消信号实例可以配置一个监听器，该监听器会在取消完成时被调用。在\
  \ Activity 类中添加一个新方法来配置并返回 `CancellationSignal` 对象，如下：\n\n```java\nimport android.os.CancellationSignal;\n\
  \nprivate CancellationSignal cancellationSignal;\n\nprivate CancellationSignal getCancellationSignal()\
  \ {\n    cancellationSignal = new CancellationSignal();\n    cancellationSignal.setOnCancelListener(()\
  \ ->\n            notifyUser(\"Cancelled via signal\"));\n    return cancellationSignal;\n\
  }\n```\n\n### 85.10 启动生物识别提示\n\n剩下的工作是在 `authenticateUser()` 方法中添加代码，创建并配置 `BiometricPrompt`\
  \ 实例并启动身份验证。如下所示添加 `authenticateUser()` 方法：\n\n```java\nimport android.view.View;\n\
  \npublic void authenticateUser(View view) {\n    BiometricPrompt biometricPrompt\
  \ = new BiometricPrompt.Builder(this)\n            .setTitle(\"Biometric Demo\"\
  )\n            .setSubtitle(\"Authentication is required to continue\")\n      \
  \      .setDescription(\n                    \"This app uses biometric authentication\
  \ to protect your data.\")\n            .setNegativeButton(\"Cancel\", this.getMainExecutor(),\n\
  \                    (dialogInterface, i) ->\n                            notifyUser(\"\
  Authentication cancelled\"))\n            .build();\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(),\n            getAuthenticationCallback());\n}\n```\n\n`BiometricPrompt.Builder`\
  \ 类创建了一个新的 `BiometricPrompt` 实例，该实例配置了显示在提示框中的标题、副标题和描述文本。负按钮被配置为显示“Cancel”文本，并配置了一个监听器，在点击此按钮时显示消息。最后，调用\
  \ `BiometricPrompt` 实例的 `authenticate()` 方法，并传递 `AuthenticationCallback` 和 `CancellationSignal`\
  \ 实例。生物识别提示还需要知道在哪个线程上执行身份验证。这是通过传递一个配置为所需线程的 `Executor` 对象定义的。在这种情况下，使用 `getMainExecutor()`\
  \ 方法将一个主 `Executor` 对象传递给 `BiometricPrompt` 实例，以便身份验证过程在 App 的主线程上进行。\n\n### 85.11\
  \ 测试项目\n\n现在项目已完成，在物理 Android 设备或模拟器会话上运行 App，并点击 Authenticate 按钮以显示如图 85-3 所示的\
  \ `BiometricPrompt` 对话框：\n\n![](img/as_3.2_biometric_prompt.jpg)\n\n图 85-3\n\n运行后，触摸指纹传感器或使用模拟器内的扩展控制面板来如\
  \ Using and Configuring the Android Studio AVD Emulator”章节所述模拟指纹触摸。假设检测到已注册的指纹，提示对话框将返回主\
  \ Activity，此时将出现来自成功身份验证回调方法的 toast 消息。\n\n再次点击 Authenticate 按钮，使用未注册的指纹尝试身份验证。这次生物识别提示对话框将指示指纹未识别：\n\
  \n![](img/as_3.2_biometric_prompt_failed.jpg)\n\n图 85-4\n\n通过点击生物识别对话框之外的 Activity\
  \ 来验证错误处理回调是否正常。提示对话框将消失，并带有以下消息显示 toast ：\n\nAuthentication error: Fingerprint\
  \ operation canceled by user.\n\n检查使用 Cancel 按钮取消提示对话框是否会触发“Authentication Canceled”\
  \ toast 消息。最后，使用未注册的指纹尝试多次身份验证，并注意在尝试几次后，提示对话框会指示失败过多，在稍后无法进行后续尝试。\n\n### 85.12\
  \ 总结\n\n本章概述了如何将生物识别身份验证集成到 Android App 项目中。这涉及使用 `BiometricPrompt` 类，该类会自动处理大部分身份验证。\n\
  \n# 86. 创建、测试和上传 Android Bundle\n\n一旦应用程序的开发工作完成并在系列设备上通过了测试，下一步是准备将应用程序提交到 Google\
  \ Play。然而，在提交之前，必须先对应用程序进行打包并使用私钥进行签名。本章将介绍如何获取私钥、准备 Android App Bundle 并将其上传到 Google\
  \ Play。\n\n### 86.1 发布准备流程\n\n在本书的到目前为止，我们一直在以适用于测试和调试的模式构建应用程序项目。另一方面，构建用于发布到 Google\
  \ Play 的应用程序包需要额外的步骤。第一个要求是以发布模式而非调试模式编译应用程序。其次，应用程序必须使用私钥签名，该私钥用于唯一标识你作为应用程序的开发者。最后，应用程序必须打包成\
  \ Android App Bundle。\n\n虽然这些任务可以在 Android Studio 之外执行，但使用 Android Studio 构建机制可以更更容易完成。首先，重要的是了解更多关于\
  \ Android Bundles 的信息。\n\n### 86.2 Android Bundles\n\n当用户从 Google Play 安装 App 时，App\
  \ 以 APK 文件的形式下载。该文件包含了在用户设备上安装和运行 App 所需的一切。在 Android Studio 3.2 引入之前，开发者会使用 Android\
  \ Studio 生成一个或多个 APK 文件并上传到 Google Play。支持多种设备类型、屏幕尺寸和本地语言需要为每个目标设备和语言创建并上传多个自定义的\
  \ APK 文件，或者生成一个包含所有不同配置资源和平台二进制文件的大型通用 APK。\n\n\n\n\nAndroid App Bundle（Android\
  \ 应用包）是一个 ZIP 文件，其中包含了构建 APK 文件所需的所有文件，这些文件适用于应用项目内已支持的设备和语言区域。例如，项目可能包含针对不同屏幕尺寸的资源和图像。当用户安装应用时，Google\
  \ Play 会接收有关设备的信息，包括显示器、处理器架构和语言。利用这些信息，系统会将适当的预生成 APK 文件传输到用户的设备上。\n\n动态交付（Dynamic\
  \ Delivery）的另一个优势是可以将应用拆分为多个模块，称为动态功能模块（dynamic feature modules），每个模块包含应用中特定功能区域的代码和资源。每个动态功能模块都包含在与基础模块分开的\
  \ APK 文件中，并且仅在用户需要该功能时才下载到设备。动态交付和应用包还允许创建即用动态功能模块（instant dynamic feature modules），它们可以在设备上立即运行，而无需安装整个应用。\n\
  \n尽管仍然可以从 Android Studio 生成 APK 文件，但应用包现在是向 Google Play 上传应用的推荐方式。\n\n## 86.3 注册\
  \ Google Play 开发者控制台\n\n提交应用的第一步是创建 Google Play 开发者控制台账号。要执行此操作，请导航至 `https://play.google.com/apps/publish/signup/`\
  \ 并按照说明完成注册过程。注意，注册需要支付一次性 25 美元的费用。一旦应用开始销售，Google 将保留与应用相关的所有收入的 30%。创建账号后，可以通过\
  \ `https://play.google.com/console` 访问开发者控制台。\n\n下一步是收集有关应用的相关信息。为了将您的应用推向市场，需要以下信息：\n\
  \n- `Title`（标题）——应用的标题。\n- `Short Description`（简短描述）——多达 80 个单词的应用描述。\n- `Full Description`（完整描述）——多达\
  \ 4000 个单词的应用描述。\n- `Screenshots`（截图）——最多 8 张应用运行截图（至少需要 2 张）。Google 建议提交在 7 英寸或\
  \ 10 英寸平板电脑上运行的应用截图。\n- `Language`（语言）——应用的语言（默认为美国英语）。\n- `Promotional Text`（推广文本）——当您的应用出现在\
  \ Google Play 环境内的特殊推广活动中时使用的文本。\n- `Application Type`（应用类型）——您的应用被归为游戏还是应用程序。\n\
  - `Category`（类别）——最能描述应用的类别（例如：金融、健康与健身、教育、体育等）。\n- `Locations`（地区）——您希望您的应用可以购买的地理位置。\n\
  - `Contact Details`（联系方式）——用户可以通过哪些方式与您联系以获取应用支持。选项包括网页、电子邮件和电话。\n- `Pricing & Distribution`（定价与投放）——有关应用价格以及营销和销售的地理位置的信息。\n\
  \n收集上述信息后，点击 Google Play 控制台中的 `Create app`（创建应用）按钮开始创建过程。\n\n## 86.4 在控制台中配置应用\n\
  \n当首次点击 `Create app` 按钮时，将出现下方[图 86-1]所示的应用详情和声明屏幕：\n\n![](img/as_4.1_play_create_app.jpg)\n\
  \n图 86-1\n\n一旦应用条目完全配置，点击 `Create app` 按钮（如上所示）来添加应用并显示仪表板屏幕。在仪表板中，找到 `Set up your\
  \ app`（设置您的应用）部分，并展开任务列表以配置应用商店列表：\n\n![](img/google_play_setup_app.jpg)\n\n图 86-2\n\
  \n逐一处理链接列表并为您的应用提供所需信息，确保在每一步都保存更改。\n\n## 86.5 启用 Google Play 应用签名\n\n直到最近，Google\
  \ Play 的上传文件是在 Android Studio 内部使用发布应用签名密钥进行签名，然后上传到 Google Play 控制台。虽然此选项仍然可用，但推荐的上传方式是使用称为\
  \ Google Play 应用签名（Google Play App Signing）的过程。对于新创建的应用，这涉及选择 Google Play 应用签名并在\
  \ Android Studio 中生成上传密钥以对应用包文件进行签名。当 Android Studio 生成的应用包文件被上传时，Google Play 控制台会移除上传密钥，并使用安全存储在\
  \ Google Play 服务器中的应用签名密钥对文件进行签名。对于现有应用，需要额外的步骤来启用 Google Play 签名，这将在章末尾介绍。\n\n\
  在 Google Play 控制台中，从 `All Apps`（所有应用）屏幕（通过左侧导航面板顶部的选项访问）选择新添加的应用条目，展开 `Setup`（设置）部分（在[图\
  \ 86-3]中标记为 A），并选择 `App Signing`（应用签名）选项（B）。\n\n![](img/as_4.1_play_enable_app_signing.jpg)\n\
  \n图 86-3\n\n点击 `Create release`（创建发布）按钮（C）加入 Google Play 应用签名。控制台现在已准备好为您的应用创建第一个测试发布版本。在此之前，下一步是在\
  \ Android Studio 内部生成上传密钥。这是生成签名应用包过程中的一部分。请保持当前 Google Play 控制台屏幕加载在浏览器中，因为我们将在本章稍后部分返回此处。\n\
  \n## 86.6 创建密钥库文件（Keystore File）\n\n要创建密钥库文件，选择 `Android Studio Build -> Generate\
  \ Signed Bundle / APK…` 菜单选项，显示如[图 86-4]所示的 `Generate Signed Bundle or APK Wizard`\
  \ 对话框：\n\n![](img/as_generate_app_bundle.jpg)\n\n图 86-4\n\n在点击 `Next`（下一步）按钮之前，验证已选择\
  \ `Android App Bundle`。\n\n如果您有现有的发布密钥库文件，在下一个屏幕上点击 `Choose existing…` 按钮并导航选择该文件。如果您尚未创建密钥库文件，点击\
  \ `Create new…` 按钮显示 `New Key Store` 对话框（[图 86-5]）。点击 `Key store path` 字段右侧的按钮导航到文件系统的合适位置，为密钥库文件命名（例如\
  \ `release.keystore.jks`）并点击 `OK` 按钮。\n\n`New Key Store` 对话框分为两个部分。顶部部分涉及密钥库。在此部分，在\
  \ `Password` 和 `Confirm` 字段中输入保护密钥库文件的强密码。对话框的下部分涉及存储在密钥库文件中的上传密钥。\n\n![](img/as_generate_new_key_store.jpg)\n\
  \n图 86-5\n\n在 `New Key Store` 对话框的 `Key` 部分，输入以下信息：\n\n- 用于引用密钥的别名（任何字符序列，但系统仅使用前八个）。\n\
  - 用于保护密钥的足够强力的密码。\n- 密钥有效年数（Google 建议超过 25 年）。\n\n此外，必须在剩余字段的至少一个中提供信息（例如，您的姓名或组织名称）。\n\
  \n输入信息后，点击 `OK` 按钮创建密钥库。\n\n## 86.7 创建 Android 应用包\n\n下一步是指示 Android Studio 在发布模式下构建应用包文件，并使用新创建的私钥对其进行签名。此时，`Generate\
  \ Signed Bundle or APK` 对话框应仍显示，且 `keystore path`、`passwords` 和 `key alias` 字段已填充信息：\n\
  \n\n\n\n\n![](img/as_generate_app_bundle_keystore_ready.jpg)\n图 86-6\n\n确保启用了 `Export\
  \ Encrypted Key`（导出加密密钥）选项，假设其他设置正确，点击 `Next`（下一步）按钮进入应用包生成屏幕（参见图 86-7）。在此屏幕上，检查\
  \ `Destination Folder:`（目标文件夹）设置，以验证生成应用包文件的位置是否合适。如果偏于其他位置，请点击文本字段右侧的按钮并导航到所需的文件系统位置。\n\
  \n![](img/as_generate_app_bundle_generate.jpg)\n图 86-7\n\n点击 `Create`（创建）按钮并等待 `Gradle`\
  \ 系统构建应用包。构建完成后，将出现对话框，提供在资源管理器窗口中打开包含应用包文件的文件夹，或将文件加载到 `APK Analyzer` 中的选项：\n\n\
  ![](img/as_generate_app_bundle_ready.jpg)\n图 86-8\n\n此时，已准备好提交到 Google Play。点击 `locate`（定位）链接打开文件系统浏览器窗口。除非指定了其他位置，否则文件应命名为\
  \ `bundle.aab` 并位于项目文件夹的 `app/release` 子目录下。在此过程中生成的私钥应在以后签名和发布应用程序时使用，因此，应将其保存在安全的地方并进行安全备份。\n\
  \n## 86.8 生成测试 APK 文件\n\n此阶段的可选步骤是从应用包生成 APK 文件，并并在设备或模拟器会话上安装并运行它们。Google 了一了一个名为\
  \ `bundletool` 的命令行工具，专门为此目的而设计，可以通过以下 URL 下载：\n\n[`github.com/google/bundletool/releases`](https://github.com/google/bundletool/releases)\n\
  \n在编写本文时，`bundletool` 以 `.jar` 文件的形式提供，可以如下所示从命令行执行（请注意版本号可能自本书出版以来已发生变化）：\n\n```\n\
  java -jar bundletool-all-0.9.0.jar\n```\n\n运行上述命令将列出工具中所有可用选项。要从应用包生成 APK 文件，将使用\
  \ `build-apks` 选项。还需要对文件进行签名，以生成可以安装到设备或模拟器上的 APK 文件。为了实现这一点，请包含 `--ks` 选项指定在本章之前创建的密钥库文件路径，并包含\
  \ `--ks-key-alias` 选项指定生成密钥时提供的别名。\n\n最后，必须使用 `--output` 标志来指定生成 APK 文件的路径（称为 APK\
  \ Set）。该文件不能已经存在，并且必须具有 `.apks` 文件扩展名。将这些要求结合起来，得到以下命令行（考虑到您的操作系统路径结构存在差异）：\n\n\
  ```\njava-jar bundletool-all-0.9.0.jar build-apks --bundle=/tmp/MyApps/app/release/bundle.aab\
  \ --output=/tmp/MyApks.apks --ks=/MyKeys/release.keystore.jks --ks-key-alias=MyReleaseKey\n\
  ```\n\n执行此命令时，在 APK 文件生成到指定的 APK Set 文件之前，将出现提示要求输入密钥库密码。APK Set 文件是一个包含从应用包生成的所有\
  \ APK 文件的 ZIP 文件。\n\n要将相应的 APK 文件安装到连接的设备或模拟器上，请使用类似下方的命令：\n\n```\njava-jar bundletool-all-0.9.0.jar\
  \ install-apks --apks=/tmp/MyApks.apks\n```\n\n此命令将指示工具识别适用于连接设备的相应 APK 文件并安装它们，以便启动和测试应用程序。\n\
  \n也可以在不安装它们的情况下从 APK Set 中提取适用于连接设备的 APK 文件。此过程的第一步是按照如下方式获取连接设备的规范：\n\n```\njava-jar\
  \ bundletool-all-0.9.0.jar get-device-spec --output=/tmp/device.json\n```\n\n上述命令将生成一个类似下面的\
  \ JSON 文件：\n\n```json\n{\n  \"supportedAbis\": [\"x86\"],\n  \"supportedLocales\"\
  : [\"en-US\"],\n  \"screenDensity\": 420,\n  \"sdkVersion\": 27\n}\n```\n\n接下来，使用此规范文件从\
  \ APK Set 中提取匹配的 APK 文件：\n\n```\njava-jar bundletool-all-0.9.0.jar extract-apks\
  \ --apks=/tmp/MyApks.apks --output-dir=/tmp/nexus5_apks --device-spec=/tmp/device.json\n\
  ```\n\n执行时，通过 `--output-dir` 标志指定的目录将包含指定设备配置的正确 APK 文件。\n\n将 Android 推向市场的下一步是将其提交到\
  \ Google Play 开发者控制台以进行测试。\n\n## 86.9 将应用包上传到 Google Play 开发者控制台\n\n返回 Google Play\
  \ 控制台，点击 `Create new release`（创建新发布）按钮（B）之前，在导航面板的 `Testing`（测试）部分选择 `Internal testing`（内部测试）选项（在图\
  \ 86-9 中标记为 A）：\n\n![](img/as_4.1_play_create_new_release.jpg)\n图 86-9\n\n在出现的屏幕上，点击\
  \ `Continue`（继续）按钮以确认 Google Play 签名，然后将由 Android Studio 生成的包文件拖放到上传点（B）：\n\n![](img/as_4.1_play_bundle.jpg)\n\
  图 86-10\n\n上传完成后，滚动屏幕并输入发布名称和可选发布说明。发布名称可以是帮助您识别发布的任何信息。在包文件上传后，Google Play 将生成所有测试所需的文件。一旦\
  \ APK 文件生成完成，滚动到屏幕底部并点击 `Save`（保存）按钮。设置保存后，点击 `Review release`（审核发布）按钮。\n\n### 86.10\
  \ 探索应用包\n\n在审核屏幕上，点击图 86-11 所示右侧的箭头：\n\n![](img/as_4.1_play_review.jpg)\n图 86-11\n\
  \n在出现的面板中，点击 `Explore`（探索）链接加载应用包。这提供了有关包的 API 级别、屏幕布局和平台的摘要信息：\n\n![](img/as_4.1_play_explorer.jpg)\n\
  图 86-12\n\n点击 `Go to device catalog`链接将显示支持该文件的设备目录：\n\n![](img/as_4.1_play_catalog.jpg)\n\
  图 86-13\n\n目前，已准备好进行测试，但只有在控制台中设置了某些测试人员后才能推出。\n\n### 86.11 管理测试人员\n\n如果应用程序仍处于内部、Alpha\
  \ 或 Beta 测试阶段，可以通过在 Google Play 控制台中选择应用程序、点击导航面板中的 `Internal testing` 并选择 `Testers`\
  \ 标签来指定授权的测试人员列表，如图 86-14 所示：\n\n![](img/as_4.1_play_testers.jpg)\n图 86-14\n\n要添加测试人员，点击\
  \ `Create email list`（创建电子邮件列表）按钮，命名列表并手动或通过上传 CSV 文件指定测试用户的电子邮件地址。\n\n现在可以从屏幕上复制\
  \ `Join on the web` URL 并提供给测试人员，以便他们接受测试邀请并下载应用程序。\n\n### 86.12 推推出测试\n\n在创建内部发布并添加测试人员列表后，应用程序已准备好推出测试。留在\
  \ `Internal testing` 屏幕中，在点击最近创建发布的 `Edit`（编辑）按钮之前，选择 `Releases`（发布）标签：\n\n![](img/as_4.1_play_ready_for_rollout.jpg)\n\
  )\n\n在审核屏幕上，滚动到最后并点击 `Start rollout to Internal testing`（开始内部测试推出）按钮。在发布处理的简短延迟后，应用程序将准备好供指定用户下载。\n\
  \n## 86.13 上传新的应用包版本\n\n\n\n\n为您的应用程序上传的第一个应用包（app bundle）文件版本号始终为 1。如果尝试上传另一个具有相同版本号的包文件，控制台将通过以下错误拒绝该文件：\n\
  \n您需要为 APK 使用不同的版本号，因为您已经有一个版本号为 1 的版本了。\n\n要解决这个问题，需要增加嵌入包文件中的版本号。这在项目的模块级 `build.gradle.kts`\
  \ 文件中进行，如图 86-16 所示所示：\n\n![](img/as_generate_module_gradle_file.jpg)\n\n图 86-16\n\
  \n该文件的内容通常如下：\n\n```kotlin\nplugins {\n    id(\"com.android.application\")\n}\n\n\
  android {\n    namespace = \"com.ebookfrenzy.biometricdemo\"\n    compileSdk = 34\n\
  \    defaultConfig {\n        applicationId = \"com.ebookfrenzy.biometricdemo\"\n\
  \        minSdk = 33\n        targetSdk = 34\n        versionCode = 1\n        versionName\
  \ = \"1.0\"\n    }\n}\n```\n\n要更改版本号，请修改 `versionCode` 声明的数字。若要更改显示给应用程序用户的版本名称，请修改\
  \ `versionName` 字符串。例如：\n\n```kotlin\nversionCode 2\nversionName \"2.0\"\n```\n\n\
  完成这些更改后，重新构建 APK 文件并再次尝试。\n\n## 86.14 分析应用包文件\n\nAndroid Studio 提供了分析应用包文件内容的功能。要分析包文件，请选择\
  \ Android Studio Build -> Analyze APK… 菜单选项，导航并选择要审查的包文件。一旦加载到工具中，将显示有关包的原始大小和下载大小，并列出包的文件结构列表，如图\
  \ 86-17 所示：\n\n![](img/as_analyze_apk.jpg)\n\n图 86-17\n\n选择 `classes.dex` 文件将在下面板中显示该文件的类结构。在此面板中，可以探索单个类的详细信息，一直到类内部方法的级别：\n\
  \n![](img/as_analyze_apk_dex.jpg)\n\n图 86-18\n\n同样，在文件列表中选择资源或图像文件将在下面板中显示文件内容。通过点击“Compare\
  \ with previous APK…”（与之前的 APK 比较）按钮并选择第二个包文件，可以查看两个包文件之间的大小差异。\n\n### 86.15 总结\n\
  \n一旦项目完成或准备好进行用户测试，即可将其上传到 Google Play 控制台并发布用于生产、内部、alpha 或 beta 测试。在上传应用之前，必须在控制台中创建一个应用条目，其中包含有关应用的信息以及用于\
  \ Play 商店的截图。发布的 Android App Bundle 文件将在 Android Studio 中生成并使用上传密钥进行签名。包文件上传后，Google\
  \ Play 会移除上传密钥并将其替换为安全地存储的应用签名密钥，随后应用程序即可发布。\n\n可以随时通过将包文件加载到 Android Studio APK\
  \ 分析器工具中来查看包文件的内容。\n\n## 87. Android 内应用计费概述\n\n在 Android 和 iOS 等操作系统的移动应用早期，最常见的盈利方式是收取下载和安装应用程序的预付费。不久后在应用程序中嵌入广告引入了另一种收入机会。最常见且获利的选择是让用户在安装应用程序后付费购买应用内物品。这通常表现为访问游戏的更高等级、获取虚拟商品或货币，或者订阅数字版杂志或报纸的高级内容。\n\
  \nGoogle 支持通过 Google Play 内应用计费 API（In-App Billing API）和 Play 控制台集成内应用购买。本章将提供内应用计费的概述，并概述如何将内应用计费集成到您的\
  \ Android 项目中。在探索这些主题后，下一章将引导您创建一个包含内应用计费功能的示例应用。\n\n### 87.1 为内应用购买准备项目\n\n在应用中构建内应用购买功能需要一个\
  \ Google Play 开发者控制台账户，其详情在之前的“创建、测试和上传 Android 应用包”章节中介绍过。您还必须注册 Google 商家账户。可以通过导航到\
  \ Play 控制台中的 Setup -> Payments profile（设置 -> 付款资料）找到这些设置。请注意，并非所有国家都提供商家注册服务。详情请参考以下页面：[`support.google.com/googleplay/android-developer/answer/9306917`](https://support.google.com/googleplay/android-developer/answer/9306917)\n\
  \n随后必须应用上传到控制台并启用内应用购买。然而，除非将 Google Play Billing Library 添加到模块级 `build.gradle.kts`\
  \ 文件中，否则控制台不会为应用激活内应用购买支持：\n\n```kotlin\ndependencies {\n    implementation(billing)\n\
  }\n```\n\n一旦修改了构建并将应用上传到控制台，下一步是为用户添加内应用产品或订阅。\n\n### 87.2 创建内应用产品和订阅\n\n产品和订阅使用\
  \ Play 控制台中的 Monetize（变现）部分创建和管理，如图 87 所示：\n\n![](img/play_console_monetization)\n\
  \n图 87\n\n每个产品或订阅都需要 ID、标题和价格信息。购买分为消耗性（每次都需要购买，例如游戏虚拟货币）、非消耗性（只需购买一次，例如内容）和订阅。消耗性和非消耗性产品统称为管理产品。订阅适用于需要定期续订的物品，例如新闻内容或应用程序的高功能。在创建订阅时，基础方案指定了价格、续订周期（每月、每年等）以及订阅是否自动续订。还可以为用户提供优惠和预购选项。\n\
  \n### 87.3 计费客户端初始化\n\n应用程序与 Google Play 库之间的通信由 `BillingClient` 实例处理。此外，`BillingClient`\
  \ 包含一组方法，可执行同步和异步计费活动。当初始化计费客户端时，需要提供一个 `PurchasesListener` 回调引用。客户端将调用此处理程序通知应用程序任何购买活动的结果。为了避免重复通知，建议每个应用只保留\
  \ `BillingClient` 实例。\n\n可以使用 `newBuilder()` 方法创建 `BillingClient` 实例，并传入当前的 Activity\
  \ 或 Fragment 上文。然后通过 `setListener()` 方法将购买更新处理程序分配给客户端：\n\n```java\nprivate final\
  \ PurchasesListener purchasesUpdatedListener = new PurchasesListener() {\n    @Override\n\
  \    public void onPurchasesUpdated(BillingResult billingResult, List<Purchase>\
  \ purchases) {\n        if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK\
  \ && purchases != null) {\n            // 购买成功\n            for (Purchase purchase\
  \ : purchases) {\n                // 处理购买\n            }\n        } else if (billingResult.getResponseCode()\
  \ ==\n```\n\n\n\n\n```java\n        if (BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n            // 用户取消购买\n        } else {\n            //在此处处理错误\n        }\n\
  \    }\n};\n\nprivate BillingClient billingClient = BillingClient.newBuilder(context)\n\
  \    .setListener(purchasesUpdatedListener)\n    .enablePendingPurchases()\n   \
  \ .build();\n```\n\n## 87.4 连接到 Google Play Billing Library\n\n在成功创建 `BillingClient`\
  \ 后，下一步是初始化与 Google Play Billing 库的连接。必须调用计费客户端实例的 `startConnection()` 方法来建立此连接。由于连接是异步执行的，必须实现\
  \ `BillingClientStateListener` 以接收指示连接是否成功的回调。还应该添加代码来重写 `onBillingServiceDisconnected()`\
  \ 方法。当与 Billing 的连接丢失时，会调用此方法，可以用它向用户报告问题并重试连接。\n\n一旦设置和连接任务完成，`BillingClient` 实例将调用\
  \ `onBillingSetupFinished()` 方法，可以通过该方法检查客户端是否就绪：\n\n```java\nbillingClient.startConnection(new\
  \ BillingClientStateListener() {\n    @Override\n    public void onBillingSetupFinished(\n\
  \            @NonNull BillingResult billingResult) {\n        if (billingResult.getResponseCode()\
  \ ==\n                    BillingClient.BillingResponseCode.OK) {\n            //\
  \ 连接成功\n        } else {\n            // 连接失败\n        }\n    }\n    @Override\n\
  \    public void onBillingServiceDisconnected() {\n        // 现有连接丢失\n    }\n});\n\
  ```\n\n### 87.5 查询可用商品\n\n一旦计费环境初始化并准备就绪，下一步是请求可购买的商品或订阅的详情。这是通过调用 `BillingClient`\
  \ 的 `queryProductDetailsAsync()` 方法实现的，并传递一个经过配置的 `QueryProductDetailsParams` 实例，该实例包含产品\
  \ ID 和类型（订阅使用 `ProductType.SUBS`，受管理商品使用 `ProductType.INAPP`）：\n\n```java\nQueryProductDetailsParams\
  \ queryProductDetailsParams =\n    QueryProductDetailsParams.newBuilder()\n    \
  \    .setProductList(\n            ImmutableList.of(\n                QueryProductDetailsParams.Product.newBuilder()\n\
  \                    .setProductId(\"one_button_click\")\n                    .setProductType(BillingClient.ProductType.INAPP)\n\
  \                    .build()))\n        .build();\nbillingClient.queryProductDetailsAsync(queryProductDetailsParams,\n\
  \    new ProductDetailsResponseListener() {\n        public void onProductDetailsResponse(\n\
  \                @NonNull BillingResult billingResult,\n                @NonNull\
  \ List<ProductDetails> productDetailsList) {\n            if (!productDetailsList.isEmpty())\
  \ {\n                // 处理匹配的商品列表\n            } else {\n                // 无匹配的商品\n\
  \            }\n        }\n    });\n```\n\n`queryProductDetailsAsync()` 方法接收一个 `ProductDetailsResponseListener`，该监听器会被调用并传入一个包含匹配商品信息的\
  \ `ProductDetail` 对象列表。例如，我们可以调用这些对象的方法来获取商品名称、标题、价格和优惠等信息。\n\n### 87.6 启动购买流程\n\
  \n一旦用户查询并选择了某个商品或订阅，就可以启动购买流程了。我们通过调用 `BillingClient` 的 `launchBilling()` 方法来实现，并传递当前\
  \ activity 以及一个包含购买项目的 `BillingFlowParams` 实例作为参数。\n\n```java\nBillingFlowParams\
  \ billingFlowParams =\n    BillingFlowParams.newBuilder()\n        .setProductDetailsList(\n\
  \            ImmutableList.of(\n                BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \                    .setProductDetails(productDetails)\n                    .build()\n\
  \            )\n        )\n        .build();\nbillingClient.launchBilling(this,\
  \ billingFlowParams);\n```\n\n购买操作的成功与否将通过之前概述的 `PurchasesUpdatedListener` 处理器进行报告。\n\
  \n### 87.7 完成购买\n\n当购买成功时，`PurchUpdatedListener` 处理器将收到一个包含每个项目 `Purchase` 对象的列表。你可以如下所示调用\
  \ `Purchase` 实例的 `getPurchaseState()` 方法来验证项目是否已购买：\n\n```java\nif (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PURCHASED) {\n    // 购买完成。\n} else if (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PENDING) {\n    // 付款待处理中\n}\n```\n\n注意，只有在初始化期间调用了\
  \ `enablePendingPurchases()` 方法时，你的应用才会支持待处理购买。待处理购买将保持待处理状态，直到用户完成付款流程。\n\n当非消耗性商品的购买完成后，必须对其进行确认（acknowledge），以防止向用户退款。这需要该项目的购买令牌，令牌通过调用\
  \ `Purchase` 对象的 `getPurchaseToken()` 方法获取。该令牌用于创建 `AcknowledgePurchaseParams` 实例和\
  \ `AcknowledgePurchaseResponseListener` 处理器。受管理的商品购买和订阅通过如下调用 `BillingClient` 的\
  \ `acknowledgePurchase()` 方法进行确认：\n\n```java\nAcknowledgePurchaseParams acknowledgePurchaseParams\
  \ =\n    AcknowledgePurchaseParams.newBuilder()\n        .setPurchaseToken(purchase.getPurchaseToken())\n\
  \        .build();\nAcknowledgePurchaseResponseListener acknowledgePurchaseResponseListener\
  \ =\n    new AcknowledgePurchaseResponseListener() {\n        @Override\n      \
  \  public void onAcknowledgePurchaseResponse(\n                @NonNull BillingResult\
  \ billingResult) {\n            billingClient.acknowledgePurchase(\n           \
  \     acknowledgePurchaseParams,\n                acknowledgePurchaseResponseListener);\n\
  \        }\n    };\n```\n\n对于消耗性商品，需要在商品消耗后通知 Google Play，以便再次购买。这需要一个 `ConsumeParams`\
  \ 实例、一个 `ConsumeListener` 以及对计费客户端 `consumeAsync()` 方法的调用：\n\n```java\nConsumeParams\
  \ consumeParams =\n    ConsumeParams.newBuilder()\n        .setPurchaseToken(purchase.getPurchaseToken())\n\
  \        .build();\nConsumeListener listener = new ConsumeListener() {\n    @Override\n\
  \    public void onConsumeResponse(BillingResult billingResult, @NonNull String\
  \ purchaseToken) {\n        if (billingResult.getResponseCode() ==\n           \
  \         BillingClient.BillingResponseCode.OK) {\n            // 消耗成功\n       \
  \ }\n    }\n};\nbillingClient.consumeAsync(consumeParams, listener);\n```\n\n###\
  \ 87.8 查询历史购买\n\n在处理应用内计费时，检查用户是否已购买商品或订阅是一个常见需求。通过调用 `BillingClient` 实例的 `queryPurchasesAsync()`\
  \ 方法并实现 `PurchaseResponseListener`，可以生成特定类型的所有历史购买列表。例如，以下代码获取所有尚未消耗的购买购买列表：\n\n\
  ```java\nQueryPurchasesParams queryPurchasesParams =\n    QueryPurchasesParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.INAPP)\n        .build();\nbillingClient.queryPurchasesAsync(queryPurchasesParams,\n\
  \    new PurchasesResponseListener() {\n        @Override\n```\n\n\n\n\n\n```java\n\
  public void onQueryPurchasesResponse(@NonNull BillingResult billingResult,\n   \
  \     @NonNull List<Purchase> list) {\n    // Process list of purchases\n}\n```\n\
  \n要获取活跃订阅列表，请将 `ProductType` 值从 `INAPP` 更改为 `SUBS`。\n\n或者，要获取每个产品的最近购买列表，请调用 `BillingClient.queryPurchaseHistoryAsync()`\
  \ 方法：\n\n```java\nQueryPurchaseHistoryParams queryPurchaseHistoryParams =\n    \
  \    QueryPurchaseHistoryParams.newBuilder()\n            .setProductType(BillingClient.ProductType.INAPP)\n\
  \            .build();\nbillingClient.queryPurchaseHistoryAsync(queryPurchaseHistoryParams,\n\
  \    new PurchaseHistoryResponseListener() {\n        @Override\n        public\
  \ void onPurchaseHistoryResponse(@NonNull BillingResult billingResult,\n       \
  \         @NonNull List<PurchaseHistoryRecord> list) {\n            // Process purchase\
  \ history\n        }\n    });\n```\n\n### 87.9 总结\n\n应用内购买通过向用户出售虚拟产品和订阅，提供了从 Android\
  \ 应用内部收入的方式。本章探讨了托管商品和订阅，并解释了消耗性产品和非消耗性产品之间的区别。通过使用 Google Play 内结算库为应用添加应用内购买支持。这涉及创建并初始化结算客户端，并在其上调用方法来执行诸如购买、列出可用产品和消耗现有购买等任务。下一章将包含一个教程，演示如何向\
  \ Android Studio 项目中添加应用内购买。\n\n# 88. Android 应用内购买教程\n\n在上一章中，我们探索了如何将应用内购买集成到\
  \ Android 项目中，并查看了一些在开发自己的项目时可以使用的代码示例。本章将通过创建一个示例项目，将这些理论付诸实践，演示如何向 Android 应用中添加消耗性应用内产品。该教程还将展示如何在\
  \ Google Play 管理控制台中添加和管理应用内产品，并解释如何启用测试支付，以便在测试期间进行购买，而无需花费真实资金。\n\n## 88.1 关于应用内购买示例项目\n\
  \n该项目背后的简单概念是：在一个应用程序中，点击按钮之前必须先购买应用内产品。该应用内产品在每次点击按钮时都会被消耗，要求用户每次想点击按钮时都要重新购买产品。在初始化时，应用将连接到应用商店，获取产品详情并显示产品名称。一旦应用确认该产品可用，购买按钮将启用，点击后将将进入购买流程。购买完成后，第二个按钮将启用，用户可以点击它并消耗购买的内容。\n\
  \n## 88.2 创建 InAppPurchase 项目\n\n此练习的第一步是创建一个新项目。启动 Android Studio 并在欢迎界面上选择“New\
  \ Project”（新建项目）。在新项目对话框中点击“Next”（下一步）之前，选择“Empty Views Activity”模板。\n\n在 `Name`\
  \ 字段中输入 `InAppPurchase`，并指定一个在 Google Play 生态系统中唯一标识您的应用的包名（例如，`com.<your company>\
  \ InAppPurchase`）。在点击“Finish”（完成）按钮之前，将 `Minimum API level` 设置更改为 `API 26`：Android\
  \ 8.0 (Oreo)，并将 `Language` 语言菜单设置为 `Java`。项目创建完成后，使用第 11.8 Migrating a Project to\
  \ View Binding 节概述的步骤将项目转换为使用视图绑定。\n\n### 88.3 向项目添加库\n\n在编写代码之前，必须向项目构建配置添加一些库，包括标准的\
  \ Android 结算客户端库。在项目的后续阶段，我们还需要使用 `ImmutableList` 类，它是 Google Guava Core Java 库的一部分。编辑版本目录（Gradle\
  \ Scripts -> `libs.versions.toml`）并添加以下内容：\n\n```toml\n[versions]\nbilling = \"\
  6.2.0\"\ngauvaJre = \"24.1-jre\"\ngauvaAndroid = \"27.0.1-android\"\n\n[libraries]\n\
  billingclient = { group = \"com.android.billingclient\", name = \"billing\", version.ref\
  \ = \"billing\" }\nguava-jre = { group = \"com.google.guava\", name=\"guava\", version.ref\
  \ = \"gauvaJre\"}\nguava-android = { group = \"com.google.guava\", name=\"guava\"\
  , version.ref = \"gauvaAndroid\"}\n```\n\n进行更改后，点击编辑器面板顶部的“Sync Now”（立即同步）链接，然后如下所示修改\
  \ Gradle Scripts -> `build.gradle.kts` (Module: app) 文件：\n\n```kotlin\ndependencies\
  \ {\n    implementation(libs.billingclient)\n}\n```\n\n### 88.4 设计用户界面\n\n用户界面将由一个\
  \ `TextView` 和两个 `Buttons` 组成。加载 `activity_main.xml` 文件后，将两个 `Button` 视图拖放到布局中，使一个位于另一个上方（TextView\
  \ 的下方）。选择 `TextView` 并将 `id` 更改为 `statusText`。\n\n点击工具栏上的 `Constraints` 按钮，并在 `Parent`\
  \ 菜单中选择 `Center -> Horizontally`。重复此步骤一次，选择 `Chains -> Vertical`。更改顶部按钮的文本属性使其显示为“Consume\
  \ Purchase”，并将 `id` 更改为 `consumeButton`。同时将 `onClick` 属性配置为 `consumePurchase`。\n\
  \n选择最底部按钮并重复上述步骤，将文本设置为“Buy Product”，`id` 设置为 `buyButton`，`onClick` 设置为 `makePurchase`。\n\
  \n![Figure 88-1](img/as_inapppurchase_ui.jpg)\n\n## 88.5 将添加到 Google Play Store\n\
  \n使用“Creating, Testing, and Uploading an Android Bundle”](#App_Bundles.xhtml__idTextAnchor1633)\
  \ 章节概述的步骤，登录 Play 控制台，创建一个新应用并设置一个新的内部测试轨道，包括指定测试人员的电子邮件地址。返回 Android Studio 为项目生成签名发布应用包。一旦生成了包文件，将其上传到内部测试轨道并发布测试。\n\
  \n## 88.6 创建应用内产品\n\n在新产品页面，点击“Create”（创建）按钮。在新产品屏幕上，保存新产品之前输入以下信息：\n\n• Product\
  \ ID：`one_button_click`\n• Name：`A Button Click`\n• Description：这是一个允许点击一次按钮的测试应用内产品。\n\
  • Default price：设置为您偏好货币的最低价格。\n\n![Figure 88-2](img/play_console_monetization1.jpg)\n\
  \n![Figure 88-3](img/play_console_create_product.jpg)\n\n### 88.7 启用许可测试人员\n\n在测试应用内购买时，可以在花费资金的情况下进行测试购买是非常用的。这可以通过对内部轨道测试人员启用许可测试来实现。许可测试人员在购买时可以使用测试付款卡，这样他们就不会被扣费。\n\
  \n在 Play 控制台中，返回主屏幕并选择 `Setup -> License testing` 选项。\n\n![Figure 88-4](img/play_console_license_testing.jpg)\n\
  \n\n\n\n\n在许可测试屏幕中，添加为内部测试轨道添加的测试人员，将许可响应设置更改为 `RESPOND_NORMALLY` 并保存更改：\n\n![](img/play_console_license_testing_screen.jpg)\n\
  \n图 88-5\n\n现在应用和应用内商品已在 Play Console 中设置好，我们可以向项目添加代码了。\n\n## 88.8 初始化 Billing\
  \ Client\n\n编辑 `MainActivity.java` 文件并进行以下更改以开始实现应用内购买功能：\n\n```java\nimport androidx.annotation.NonNull;\n\
  import android.util.Log;\nimport com.android.billingclient.api.*;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \    private BillingClient billingClient;\n    private ProductDetails productDetails;\n\
  \    private Purchase purchase;\n    static final String TAG = \"InAppPurchaseTag\"\
  ;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ billingSetup();\n    }\n\n    private void billingSetup() {\n        billingClient\
  \ = BillingClient.newBuilder(this)\n            .setListener(purchasesUpdatedListener)\n\
  \            .enablePendingPurchases()\n            .build();\n        billingClient.startConnection(new\
  \ BillingClientStateListener() {\n            @Override\n            public void\
  \ onBillingSetupFinished(@NonNull BillingResult billingResult) {\n             \
  \   if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK)\
  \ {\n                    Log.i(TAG, \"OnBillingSetupFinish connected\");\n     \
  \               queryProduct();\n                } else {\n                    Log.i(TAG,\
  \ \"OnBillingSetupFinish failed\");\n                }\n            }\n        \
  \    @Override\n            public void onBillingServiceDisconnected() {\n     \
  \           Log.i(TAG, \"OnBillingSetupFinish connection lost\");\n            }\n\
  \        });\n    }\n```\n\n当应用启动时，`onCreate()` 方法现在将调用 `billingSetup()`，这将反过来创建一个新的\
  \ billing client 实例并尝试连接到 Google Play Billing Library。当连接完成后，将调用 `onBillingSetupFinished()`\
  \ 监听器并输出指示连接尝试成功或失败的 `Log` 消息。最后，我们还实现了 `onBillingServiceDisconnected()`，如果 Google\
  \ Play Billing 连接丢失，该方法将被调用。如果连接成功，则会调用 `queryProduct()` 并必须添加给 billing client 的\
  \ `purchasesUpdatedListener`。\n\n### 88.9 查询商品\n\n为了确保商品可以购买，我们需要创建一个包含在 Play Console\
  \ 中指定的商品 ID 的 `ProductDetailsParams` 实例，并将其传递给 billing client 的 `queryProductDetailsAsync()`\
  \ 方法。这将要求我们添加 `onProductDetailsResponse()` 方法，我们将在该方法中检查商品是否存在，提取商品名称并将其显示在 `TextView`\
  \ 上。现在我们已经获取了商品详情，可以安全地启用购买按钮。在 `MainActivity` 文件中，添加 `queryProduct()` 方法，其读取内容如下所示：\n\
  \n```java\nimport com.google.common.collect.ImmutableList;\nimport java.util.List;\n\
  \nprivate void queryProduct() {\n    ProductDetailsParams queryDetailsParams = ProductDetailsParams.newBuilder()\n\
  \        .setProductList(\n            ImmutableList.of(\n                ProductDetailsParams.Product.newBuilder()\n\
  \                    .setProductId(\"one_button_click\")\n                    .setProductType(BillingClient.ProductType.INAPP)\n\
  \                    .build())\n        )\n        .build();\n    billingClient.queryProductDetailsAsync(\n\
  \        queryDetailsParams,\n        new ProductDetailsResponseListener() {\n \
  \           public void onProductDetailsResponse(\n                @NonNull BillingResult\
  \ billingResult,\n                @NonNull List<ProductDetails> productDetailsList)\
  \ {\n                if (!productDetailsList.isEmpty()) {\n                    productDetails\
  \ = productDetailsList.get(0);\n                    runOnUiThread(() -> {\n    \
  \                    binding.buyButton.setEnabled(true);\n                     \
  \   binding.statusText.setText(productDetails.getName());\n                    });\n\
  \                } else {\n                    Log.i(TAG, \"onProductDetails: No\
  \ products\");\n                }\n            });\n}\n```\n\n这里使用的许多代码在上一章中应该很熟悉了。监听器检查至少有一个商品符合标准。然后从第一个匹配的商品中提取\
  \ `ProductDetails` 对象，将其存储在 `productDetails` 变量中，并将商品名称显示在 `TextView` 上。需要注意的是，当我们在状态\
  \ `TextView` 上显示商品名称时，是通过调用 `runOnUiThread()` 实现的。这是必要的，因为监听器运行在主线程上的，所以它不能安全地更改用户界面。`runOnUiThread()`\
  \ 提供了一种在没有协程的情况下在主线程上执行代码的快速方便的方法。\n\n### 88.10 启动购买流程\n\n当用户点击购买按钮时，将调用 `makePurchase()`\
  \ 来启动购买过程。我们现在如下添加此方法：\n\n```java\npublic void makePurchase(View view) {\n    BillingFlowParams\
  \ billingFlowParams = BillingFlowParams.newBuilder()\n        .setProductDetailsList(\n\
  \            ImmutableList.of(\n                BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \                    .setProductDetails(productDetails)\n                    .build())\n\
  \        )\n        .build();\n    billingClient.launchBillingFlow(this, billingFlowParams);\n\
  }\n```\n\n### 88.11 处理购买更新\n\n购买过程的结果将初始化阶段分配给 billing client 的 `PurchaseUpdatedListener`\
  \ 报告给应用。现在如下添加此处理器：\n\n```java\nprivate final PurchasesUpdatedListener purchasesUpdatedListener\
  \ = new PurchasesUpdatedListener() {\n    @Override\n    public void onPurchasesUpdated(BillingResult\
  \ billingResult, List<Purchase> purchases) {\n        if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.OK && purchases != null) {\n            for\
  \ (Purchase purchase : purchases) {\n                completePurchase(purchase);\n\
  \            }\n        } else if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n            Log.i(TAG, \"onPurchasesUpdated: Purchase Canceled\");\n      \
  \  } else {\n            Log.i(TAG, \"onPurchasesUpdated: Error\");\n        }\n\
  \    }\n};\n```\n\n如果用户取消购买或发生其他错误，处理器将输出日志消息。然而，成功的购买将导致调用 `completePurchase()`\
  \ 方法，并向其传递当前的 `Purchase` 对象。如下添加此方法：\n\n```java\nprivate void completePurchase(Purchase\
  \ item) {\n    purchase = item;\n    if (purchase.getPurchaseState() == Purchase.PurchaseState.PURCHASED)\
  \ {\n        runOnUiThread(() -> {\n            binding.consumeButton.setEnabled(true);\n\
  \            binding.statusText.setText(\"Purchase Complete\");\n        });\n \
  \   }\n}\n```\n\n\n\n\n\n该方法在验证产品确实已购买且支付尚未处于挂起状态之前存储了购买记录。“消耗”按钮将被启用，用户将收到购买成功的通知。同时，“购买”按钮将被禁用，以防止用户在消耗购买内容之前重复购买。\n\
  \n### 88.12 消耗产品\n\n现在用户可以点击“消耗”按钮了，下一步是确保产品被消耗，以便在点击另一个按钮进行购买之前只能执行一次点击。这要求我们现在编写\
  \ `consumePurchase()` 方法：\n\n```java\npublic void consumePurchase(View view) {\n\
  \    ConsumeParams consumeParams =\n            ConsumeParams.newBuilder()\n   \
  \                 .setPurchaseToken(purchase.getPurchaseToken())\n             \
  \       .build();\n    ConsumeResponseListener listener = new ConsumeResponseListener()\
  \ {\n        @Override\n        public void onConsumeResponse(BillingResult billingResult,\n\
  \                @NonNull String purchaseToken) {\n            if (billingResult.getResponseCode()\
  \ ==\n                            BillingClient.BillingResponseCode.OK) {\n    \
  \            runOnUiThread(() -> {\n                    binding.consumeButton.setEnabled(false);\n\
  \                    binding.statusText.setText(\"Purchase consumed\");\n      \
  \          });\n            }\n        }\n    };\n    billingClient.consumeAsync(consumeParams,\
  \ listener);\n}\n```\n\n此方法创建了一个 `ConsumeParams` 实例，并配置当前购买的购买令牌（从之前在 `completePurchase()`\
  \ 方法中保存的 `Purchase` 对象获取）。将其传递给 `consumePurchase()` 方法，该方法在带有 `IO` 调度器的协程中运行。如果产品成功消耗，将在主线程执行代码以禁用消耗按钮、启用购买按钮并更新状态文本。\n\
  \n### 88.13 恢复之前的购买\n\n到目前为止的代码允许我们可以在单个会话中购买并消耗产品。如果我们购买产品并在消耗之前退出应用，购买记录将在应用重启时丢失。我们可以通过配置一个\
  \ `QueryPurchasesParams` 实例来搜索未消耗的应用内产品，并将其传递给结算客户端的 `queryPurchasesAsync()` 方法，同时带上一个将在结果时调用的监听器引用。在\
  \ `MainActivity.java` 文件中添加如下新函数和监听器：\n\n```java\nprivate void reloadPurchase()\
  \ {\n    QueryPurchasesParams queryPurchasesParams = QueryPurchasesParams.newBuilder()\n\
  \            .setProductType(BillingClient.ProductType.INAPP)\n            .build();\n\
  \    billingClient.queryPurchasesAsync(\n            queryPurchasesParams,\n   \
  \         purchasesListener\n    );\n}\n\nprivate final PurchasesResponseListener\
  \ purchasesListener = new PurchasesResponseListener() {\n    @Override\n    public\
  \ void onQueryPurchasesResponse(@NonNull BillingResult billingResult,\n        \
  \    @NonNull List<Purchase> list) {\n        if (!list.isEmpty()) {\n         \
  \   purchase = list.get(0);\n            binding.consumeButton.setEnabled(true);\n\
  \        } else {\n            binding.consumeButton.setEnabled(false);\n      \
  \  }\n    }\n};\n```\n\n如果传递给监听器的购买列表不为空，将列表中的第一个购买赋值给 `purchase` 变量，并启用消耗按钮（在更完整的实现中，应该添加代码通过比较产品\
  \ ID 来检查是否是正确的产品，并处理返回多个购买的情况）。如果没有找到任何购买，则禁用消耗按钮，直到进行下一次购买。剩下的工作是在结算设置期间如下所示调用我们的\
  \ `reloadPurchase()` 方法：\n\n```java\nprivate void billingSetup() {\n// ...\n   \
  \ if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK) {\n\
  \        Log.i(TAG, \"OnBillingSetup connected\");\n        queryProduct();\n  \
  \      reloadPurchase();\n    } else {\n        Log.i(TAG, \"OnBillingSetup failed\"\
  );\n    }\n}\n```\n\n### 88.14 测试应用\n\n在测试应用之前，我们需要将此最新版本上传到 Play Console。由于我们已经上传了版本\
  \ 1，因此我们需要在 `build.gradle.kts (Module: app)` 文件中增加版本号：\n\n```kotlin\ndefaultConfig\
  \ {\n    applicationId \"com.ebookrenzy.inapppurchase\"\n    minSdk 26\n    targetSdk\
  \ 32\n    versionCode 2\n    versionName \"2.0\"\n}\n```\n\n同步构建配置，然后按照“创建、测试和上传\
  \ Android 应用”章节中的步骤生成新的应用包（app bundle），将其上传到内部测试轨道，并发布给测试人员。接下来，使用内部测试链接，在登录了其中一个测试账户的设备或模拟器上安装应用。要找到测试链接，请在\
  \ Google Play Console 中选择应用，并在导航面板中选择 `Internal testing`（内部测试）选项，然后选择 `Testers`（测试人员）选项卡，如图\
  \ 88-6 所示：\n\n![](img/in-app-purchase-testers.jpg)\n图 88-6\n\n滚动到屏幕“How testers\
  \ join your test”（测试人员如何加入您的测试）部分并点击 Copy link（复制链接）：\n\n![](img/in-app-purchase-copy_link.jpg)\n\
  图 88-7\n\n在测试设备或模拟器上打开 Chrome 浏览器，输入测试链接，并按照指示从 Play Store 安装应用。应用启动后，经过短暂延迟，它将在\
  \ `TextView` 上显示产品名称。点击购买按钮将开始购买流程，如图 88-8 所示：\n\n![](img/in_app_billing_test.jpg)\n\
  图 88-8\n\n点击购买按钮使用测试卡完成购买，等待消耗按钮被启用。在点击此按钮之前，尝试再次购买并验证由于已拥有该产品而无法购买。\n\n点击消耗按钮，等待\
  \ `TextView` 上显示“Purchase consumed”消息。产品被消耗后，现在应该再次购买。再次进行购买，然后终止并重启应用。应用应该找到之前的未消耗购买记录并启用消耗按钮。\n\
  \n### 88.15 故障排除\n\n如果在购买时遇到问题，请确保设备已通过 USB 线或 WiFi 连接到 Android Studio，并在 Logcat\
  \ 面板中选择它。在 Logcat 搜索栏输入 `InAppPurchaseTag` 并检查诊断输出，必要时添加额外的 `Log` 调用。关于失败的附加信息，一个实用的技巧是从\
  \ `BillingResult` 实例访问调试消息，例如：\n\n```java\n} else if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.USER_CANCELED) {\n    Log.i(TAG, \"onPurchasesUpdated:\
  \ Purchase Canceled\");\n} else {\n    Log.i(TAG, billingResult.getDebugMessage());\n\
  }\n```\n\n如果没有看到测试支付卡，请确保设备用户账户已添加到许可测试人员列表中。如果应用运行在物理设备上，请尝试模拟器。如果所有方法都失败，你可以输入有效的支付方式进行测试购买，然后退款。\n\
  \n请注意，只要你不更改模块级 `build.gradle.kts` 文件中的应用版本号，你现在应该能够直接在设备或模拟器上运行修改后的应用，而无需重新打包并上传到控制台。\n\
  \n### 88.16 总结\n\n\n\n在本章中，我们创建了一个项目，演示了如何在 Android 应用中添加应用内商品。这包括在 Google Play\
  \ Console 中创建商品，以及编写代码来初始化并连接计费客户端、查询可用商品、购买并消费商品。我们还解释了如何使用 Play Console 添加许可测试人员，以便在测试期间无需花费费用即可进行购买。\n\
  \n# 89. 在 Android 上创建和管理溢出菜单\n\n用户界面设计中书中尚未涵盖的一个领域与 Android 应用程序菜单概念有关。菜单为用户提供了界面布局中视图组件之外提供额外选择的机制。虽然\
  \ Android 开发者可以使用多种不同的菜单系统，但本章将关注更常用的溢出菜单（Overflow menu）。本章将涵盖如何通过 XML 手动创建菜单，以及使用\
  \ Android Studio 布局编辑器工具可视化地创建菜单。\n\n### 89.1 溢出菜单\n\n溢出菜单（称为选项菜单）是用户可以通过设备屏幕访问的菜单，它允许开发者包含应用程序用户界面之外的其他选项。溢出菜单的位置取决于设备上运行的\
  \ Android 版本。从 Android 4.0 及更高版本开始，溢出菜单按钮位于操作栏的右上角（图 89-1），由三个正方形堆叠的图标表示：\n\n![](img/as_menu_button.jpg)\n\
  \n图 89-1\n\n### 89.2 创建溢出菜单\n\n菜单中的项可以在 XML 文件中声明，然后根据需要进行加载并显示给用户。这涉及使用 `<menu>`\
  \ 元素，其中每个菜单项包含一个 `<item>` 子元素。例如，以下 XML 定义了一个由两个颜色选择相关的菜单项组成的菜单：\n\n```xml\n<menu\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\".MainActivity\" >\n    <item\n        android:id=\"@+id/menu_red\"\
  \n        android:orderInCategory=\"1\"\n        app:showAsAction=\"never\"\n  \
  \      android:title=\"@string/red_string\"/>\n    <item\n        android:id=\"\
  @+id/menu_green\"\n        android:orderInCategory=\"2\"\n        app:showAsAction=\"\
  never\"\n        android:title=\"@string/green_string\"/>\n</menu>\n```\n\n在上面的\
  \ XML 中，`android:orderInCategory` 属性决定了菜单项在显示时在菜单中出现的顺序。另一方面，`app:showAsAction`\
  \ 属性控制相应项作为操作栏本身中的项出现的条件。例如，如果设置为 `ifRoom`，如果空间足够，则该项将出现在操作栏中。图 89-2 显示了对两个菜单项将此属性设置为\
  \ `ifRoom` 的效果：\n\n![](img/as_menu_ifroom.jpg)\n\n图 89-2\n\n应节节使用此属性，以避免操作栏过于拥挤。\n\
  \n默认情况下，当创建一个新的 Android 应用程序项目时，Android Studio 会创建一个菜单 XML 文件。该文件位于 `app -> res\
  \ -> menu` 项目文件夹中，包含一个名为“Settings”（设置）的菜单项：\n\n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    tools:context=\".MainActivity\">\n    <item\
  \ android:id=\"@+id/action_settings\"\n            android:title=\"@string/action_settings\"\
  \n            android:orderInCategory=\"100\"\n            app:showAsAction=\"never\"\
  \ />\n</menu>\n```\n\n此菜单已配置为在当应用运行时，用户在用户界面上选择溢出菜单时显示，因此只需修改此项以满足你的需求即可。\n\n###\
  \ 89.3 显示溢出菜单\n\n溢出菜单是通过重写相应 Activity 的 `onCreateOptionsMenu()` 方法并加载菜单创建的。例如，以下代码在名为\
  \ `menu_main` 的 XML 文件中创建菜单：\n\n```java\n@Override\npublic boolean onCreateOptionsMenu(Menu\
  \ menu) {\n    getMenuInflater().inflate(R.menu.menu_main, menu);\n    return true;\n\
  }\n```\n\n与菜单文件一样，Android Studio 在新创建的 Activity 中重写了此方法。如果不需要溢出菜单，可以注释掉此方法。\n\n\
  ### 89.4 响应项选择\n\n一旦实现了菜单，问题就变成了：当用户选择项时，应用程序如何接收通知。Activity 接收菜单通知仅需要重写 `onOptions()`。传递给此方法的参数是所选项的引用。然后可以调用\
  \ `getItemId()` 方法来识别选择了哪一项。例如：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem\
  \ item) {\n    if (id == R.id.menu_red) {\n        // 选择了红色项\n    } else if (id\
  \ == R.id.menu_green) {\n        // 选择了绿色项\n    } else {\n        return super.onOptionsItemSelected(item);\n\
  \    }\n    return true;\n}\n```\n\n### 89.5 创建可检查项组\n\n除了配置独立项外，还可以创建项组。这在创建可检查项（即从一组中选择一个）时特别有用。可以通过将菜单项封装在\
  \ `<group>` 标签中来分配组。使用 `android:checkable` 属性声明组的可检查性，设置为 `single` 或 `none`。以下 XML\
  \ 声明了两个项组成一个组，可以随时选择一项：\n\n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\">\n    <group android:checkable=\"\
  single\">\n        <item\n            android:id=\"@+id/menu_red\"\n           \
  \ android:title=\"@string/red_string\"/>\n        <item\n            android:id=\"\
  @+id/menu_green\"\n            android:title=\"@string/green_string\"/>\n    </group>\n\
  </menu>\n```\n\n当菜单组配置为可检查时，菜单项旁边会出现一个小圆圈，如图 89-3 所示。需要注意的是，此指示的设置和取消不会自动发生。因此，由应用程序负责检查和取消检查菜单项。\n\
  \n![](img/as_menu_checkable.jpg)\n\n图 89-3\n\n继续本章之前使用的颜色示例，其实现如下：\n\n```java\n\
  @Override\npublic boolean onOptionsItemSelected(MenuItem item) {\n    if (id ==\
  \ R.id.menu_red) {\n        item.setChecked(!item.isChecked());\n        mainLayout.setBackgroundColor(android.graphics.Color.RED);\n\
  \    } else if (id == R.id.menu_green) {\n        item.setChecked(!item.isChecked());\n\
  \        mainLayout.setBackgroundColor(android.graphics.Color.GREEN);\n    } else\
  \ {\n        return super.onOptionsItemSelected(item);\n    }\n    return true;\n\
  }\n```\n\n# 89.6 菜单与 Android Studio 菜单编辑器\n\n\n\n\nAndroid Studio 允许通过将菜单资源文件加载到菜单编辑器（Menu\
  \ Editor）工具、从调色板中拖放菜单元素并设置属性来以视觉方式设计菜单。这极大地简化了菜单设计过程，但重要的是，你仍然需要在 `onOptionsItemSelected()`\
  \ 方法中编写代码来实现菜单行为。\n\n要视觉化设计菜单，请找到菜单资源文件并双击它将其加载到菜单编辑器工具中。例如，图 89-4 显示了在设计模式下加载到菜单编辑器的基础\
  \ Activity 的默认菜单资源文件：\n\n![](img/as_menu_editor.jpg)\n\n图 89-4\n\n调色板 (A) 包含可以添加到设计区域\
  \ (C) 菜单中的项目。组件树 (B) 是识别菜单层级结构的一个有用工具。属性面板 (D) 包含了当前选中项的常用属性子集。\n\n可以通过将对象拖放到布局画布或组件树上来向菜单中添加新元素。在布局编辑器（Layout\
  \ Editor）工具中使用菜单时，有时将项目丢到组件树上会更容易，因为这可以对项目在树中的放置位置提供更大的控制。这在例如向组中添加项目时特别有用。\n\n\
  尽管菜单编辑器提供了构建菜单的视觉化方法，但底层菜单仍然存储在 XML 格式中，可以通过上方图中标记为 F 的标签页从设计模式切换到代码模式进行手动查看和编辑。\n\
  \n### 89.7 创建示例项目\n\n要查看溢出菜单的操作，点击欢迎屏幕上的“新建项目”（New Project）按钮，在出现的新项目对话框中，点击“下一步”（Next）按钮之前选择“Basic\
  \ Views Activity”模板。\n\n在 `Name` 字段中输入 `MenuExample`，并指定 `com.ebookfrenzy.menuexample`\
  \ 为包名。在点击“完成”（Finish）按钮之前，将最小 API 级别设置改为 `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为 Java。\n\
  \n项目创建后，在项目工具”窗口中导航到 `app -> res -> layout` 文件夹，并双击 `content_main.xml` 文件将其加载到 Android\
  \ Studio 菜单编辑器工具中。将工具切换到设计模式，从组件树面板选择 `ConstraintLayout`，并在属性面板的 `ID` 字段中输入 `layoutView`。\n\
  \n### 89.8 设计菜单\n\n在项目工具窗口中，找到项目的 `app -> res -> menu -> menu_main.xml` 文件并双击它将其加载到布局编辑器工具中。必要时切换到设计模式，并选择并删除\
  \ Android Studio 添加的默认设置菜单项，使菜单当前没有任何项目。\n\n从调色板中，点击并拖动菜单组（menu group）对象到布局画布的标题栏，如图\
  \ 89-5 所示：\n\n![](img/as_menu_add_group.jpg)\n\n图 89-5\n\n虽然已添加了组项，但它在布局中是不可见的。要验证元素的存在，请参考组件树面板，该组将作为菜单的子项列出：\n\
  \n![](img/as_menu_group_added.jpg)\n\n图 89-6\n\n在组件树中选择组项，参考属性面板将 `checkableBehavior`\
  \ 属性设置为 `single`，这样任何时间只能选择一个组菜单项：\n\n![](img/as_menu_single_check.jpg)\n\n图 89-7\n\
  \n接下来，从调色板中拖出四个菜单项（Menu Item）元素并将其丢到组件树中的组元素。选择第一个项目并使用属性面板将标题更改为“Red”，并将 ID 改为\
  \ `menu_red`：\n\n![](img/as_menu_item_attributes.jpg)\n\n图 89-8\n\n对其三个菜单项重复这些步骤，将标题设置为“Green”、“Yellow”和“Blue”，并设置相应的\
  \ ID `menu_green`、`menu_yellow` 和 `menu_blue`。使用组件树面板中菜单项右侧的警告按钮将字符串提取到资源中：\n\n\
  ![](img/as_menu_tree.jpg)\n\n图 89-9\n\n完成这些步骤后，菜单布局应与下方图 89-10 所示：\n\n![](img/Image2498.jpg)\n\
  \n图 89-10\n\n将布局编辑器工具切换到代码模式，并检查菜单的 XML 表示，它应该与以下代码段匹配：\n\n```xml\n<menu xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    tools:context=\"com.ebookfrenzy.menuexample.MainActivity\"\
  >\n    <group android:checkableBehavior=\"single\">\n        <item android:title=\"\
  @string/red_string\"\n              android:id=\"@+id/menu_red\" />\n        <item\
  \ android:title=\"@string/green_string\"\n              android:id=\"@+id/menu_green\"\
  \ />\n        <item android:title=\"@string/yellow_string\"\n              android:id=\"\
  @+id/menu_yellow\" />\n        <item android:title=\"@string/blue_string\"\n   \
  \           android:id=\"@+id/menu_blue\" />\n    </group>\n</menu>\n```\n\n## 89.9\
  \ 修改 onOptionsItemSelected 方法\n\n当从菜单中选择项时，应用程序重写的 `onOptionsItemSelected()` 方法将被调用。该方法的作用是识别所选项目并更改背景颜色。找到并双击\
  \ `app -> java -> com.ebookfrenzy.menuexample -> MainActivity` 文件并修改如下：\n\n```java\n\
  package com.ebookfrenzy.menuexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import androidx.constraintlayout.widget.ConstraintLayout;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n\n    @Override\n    public boolean onOptionsItemSelected(MenuItem\
  \ item) {\n        int id = item.getItemId();\n        ConstraintLayout mainLayout\
  \ = findViewById(R.id.layoutView);\n        if (id == R.id.menu_red) {\n       \
  \     item.setChecked(!item.isChecked());\n            mainLayout.setBackgroundColor(android.graphics.Color.RED);\n\
  \        } else if (id == R.id.menu_green) {\n            item.setChecked(!item.isChecked());\n\
  \            mainLayout.setBackgroundColor(android.graphics.Color.GREEN);\n    \
  \    } else if (id == R.id.menu_yellow) {\n            item.setChecked(!item.isChecked());\n\
  \            mainLayout.setBackgroundColor(android.graphics.Color.YELLOW);\n   \
  \     } else if (id == R.id.menu_blue) {\n            item.setChecked(!item.isChecked());\n\
  \            mainLayout.setBackgroundColor(android.graphics.Color.BLUE);\n     \
  \   } else {\n            return super.onOptionsItemSelected(item);\n        }\n\
  \        return true;\n    }\n}\n```\n\n### 89.10 测试应用程序\n\n在模拟器或物理 Android 设备上构建并运行应用程序。使用溢出菜单选择菜单项，并验证布局背景颜色是否发生了相应变化。注意当前选中的颜色在菜单中显示为选中项：\n\
  \n![](img/as_menu_running.jpg)\n\n图 89-11\n\n### 89.11 总结\n\nAndroid 溢出菜单通过运行应用时顶部操作栏的最右侧访问。该菜单为应用程序提供了提供额外选项的地方。\n\
  \n菜单结构最容易在 XML 文件中定义，应用程序通过重写和实现 `onOptionsItemSelected()` 方法来接收菜单项选择的通知。\n\n##\
  \ 90. 使用 Material Design 3 主题工作\n\n\n\n\nAndroid 应用的外观旨在符合 Material Design 定义的一系列指南。Google\
  \ 开发 Material Design 是为了在不同应用之间提供设计的一致性，同时允许应用开发者在颜色、字体和形状选择方面包含自己的品牌标识（这一概念被称为\
  \ Material 主题化，Material theming）。除了设计指南外，Material Design 还包含了一套 UI 组件，用于设计用户界面布局，我们在整本书中使用了其中许多组件。\n\
  \n本章将概述主题（theming）在 Android Studio 项目中是如何工作的，并探索如何修改为新项目提供的默认设计配置，以满足您的品牌需求。\n\n\
  ## 90.1 Material Design 2 对比 Material Design 3\n\n在开始之前，需要注意的是，Google 正在从 Material\
  \ Design 2 过渡到 Material Design 3，并且 Android Studio Iguana 项目默认使用 Material Design\
  \ 3。Material Design 3 为 Material You 提供了基础，Material You 是 Android 12 中引入的一个功能，允许应用自动调整主题元素，以匹配用户在设备上配置的偏好。例如，Material\
  \ Design 3 提供的动态颜色支持允许应用中使用的颜色自动适应以匹配用户的壁纸选择。\n\n## 90.2 理解 Material Design 主题化\n\
  \n我们知道 Android 应用的用户界面是通过组装布局、文本字段和按钮等组件创建的。除非我们通过在 XML 布局资源文件中显式覆盖某个颜色属性或通过编写代码，否则这些组件将使用默认颜色显示。项目的主题定义了这些默认颜色。主题由一组颜色槽（在\
  \ `themes.xml` 文件中声明）组成，这些颜色槽被分配了颜色值（在 `colors.xml` 文件中声明）。每个 UI 组件在内部都被编程为将主题颜色槽作为特定属性的默认颜色（例如\
  \ `Text` 控件的前景颜色和背景颜色）。因此，我们可以通过更改分配给特定主题槽的颜色来更改应用的全局主题。当应用运行时，在渲染用户界面时，所有控件都将使用新的默认颜色。\n\
  \n## 90.3 Material Design 3 主题化\n\n在探索 Material Design 3 之前，我们必须考虑它在 Android Studio\
  \ 项目中是如何使用的。应用项目使用的主题被声明为 `AndroidManifest.xml` 文件中 `application` 元素的属性，例如：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\">\n    <application\n    \
  \    ...\n        android:supportsRtl=\"true\"\n        android:theme=\"@style/Theme.MyDemoApp\"\
  \n        tools:targetApi=\"31\">\n        <activity\n        ...\n```\n\n如前所述，所有与项目主题相关的文件都包含\
  \ `res -> values` 文件夹下的 `colors.xml` 和 `themes.xml` 文件中，如图图 90-1 所示：\n\n![](img/as_theme_files.jpg)\n\
  \n图 90-1\n\n主题本身在位于 `themes` 文件夹的两个 `themes.xml` 文件中声明。这些资源文件声明了不同的调色板，其中包含供设备在亮色模式或深色模式（night\
  \ 模式，夜间模式）时使用的 Material 主题颜色槽。请注意，每个文件中的 `style` 名称属性必须与 `AndroidManifest.xml` 文件中引用的名称匹配，例如：\n\
  \n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\">\n<!-- Base\
  \ application theme. -->\n    <style name=\"Base.Theme.MyDemoApp\" parent=\"Theme.Material3.DayNight.NoActionBar\"\
  >\n    <!-- 在此处自定义您的亮色主题。 -->\n        <!-- <item name=\"colorPrimary\">@color/my_light_primary</item>\
  \ -->\n    </style>\n    <style name=\"Theme.MyDemoApp\" parent=\"Base.Theme.MyDemoApp\"\
  \ />\n</resources>\n```\n\n这些颜色槽（也称为颜色属性）被 Material 组件用于在屏幕上渲染时设置颜色。例如，`colorPrimary`\
  \ 颜色槽被作 `Material Button` 组件的背景颜色。\n\nMD3 中的颜色槽被分组为 `Primary`（主）、`Secondary`（次）、`Tertiary`（三级）、`Error`（错误）、`Background`（背景）和\
  \ `Surface`（表面）。这些槽进一步分为成对，由一个基础颜色和一个“在其上的”基础颜色（on base color）组成。这通常对应 Material\
  \ 组件的背景颜色和前景颜色。\n\n用于着色的特定分组在不同控件之间会有不同。例如，`Material Button` 控件将使用 `colorPrimary`\
  \ 基础颜色作为背景颜色，使用 `colorOnPrimary` 作为其内容（即它显示的文本或图标）。相反，`FloatingActionButton` 组件使用\
  \ `colorPrimaryContainer` 作为背景颜色，使用 `colorOnPrimaryContainer` 作为前景。通常可以通过更改主题文件中的颜色设置并查看布局编辑器中的渲染结果，来快速识别特定控件类型的正确分组。\n\
  \n假设我们需要将 `colorPrimary` 改为红色。我们通过在 `colors.xml` 文件中为红色添加新条目，然后将其分配给 `themes.xml`\
  \ 文件中的 `colorPrimary` 槽来实现。因此，MD3 主题夜间模式下的 `colorPrimary` 槽读取如下：\n\n```xml\n<resources\
  \ xmlns:tools=\"http://schemas.android.com/tools\">\n<!-- Base application theme.\
  \ -->\n    <style name=\"Base.Theme.MyDemoApp\" parent=\"Theme.Material3.DayNight.NoActionBar\"\
  >\n    </style>\n    <style name=\"Theme.MyDemoApp\" parent=\"Base.Theme.MyDemoApp\"\
  \ />\n</resources>\n```\n\n该颜色随后在 `colors.xml` 文件中声明：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<resources>\n    ...\n    <color name=\"my_bright_primary\"\
  >#FC0505</color>\n</resources>\n```\n\n## 90.4 构建自定义主题\n\n正如所见，实现主题的代码工作相对简单。然而，困难的部分是组成主题的互补颜色。幸运的是，Google\
  \ 开发了一个工具，可以轻松为您的应用设计自定义主题。该工具称为 Material Theme Builder，可以访问：\n\n[`m3.material.io/theme-builder#/`](https://m3.material.io/theme-builder#/)custom\n\
  \n在自定义屏幕（图 90-2](#Theming.xhtml__idTextAnchor1731））上，通过点击颜色圆显示颜色对话框，为主色键（A）进行颜色选择。一旦选择了颜色，预览（B）将改变，以反映所有\
  \ MD3 颜色槽的推荐颜色。此外，您可以通过点击相应的颜色圆显示颜色对话框，覆盖为 `Secondary`、`Tertiary` 和 `Neutral` 槽生成的颜色。\n\
  \n标记为 B 的区域显示了示例应用界面、亮色和深色配色方案图表，以及根据您的颜色选择更新的控件。由于该面板比典型的浏览器窗口长，您必须向下滚动查看所有信息。\n\
  \n要将主题整合到您的设计中，点击导出按钮（C）并选择 Android 视图（XML）选项。下载后，可以使用 `colors.xml` 和 `themes.xml`\
  \ 文件替换项目中的现有文件。注意，导出的两个 `themes.xml` 文件中的主题名称必须更改以匹配您的项目。\n\n## 90.5 总结\n\n\n\n\n\
  \nMaterial Design（材质设计）提供了定义 Android 应用外观的指南和组件。通过设计指定在显示应用时使用的颜色、字体和形状的主题，可以为应用应用个性化的品牌设计。Google\
  \ 最近引入了 Material Design 3，它取代了 Material Design 2 并支持 Material You 的新功能，包括动态颜色。Google\
  \ 还提供了 `Material Theme Builder` 工具用于设计你自己的主题，这大大简化了选择互补主题颜色的任务。一旦使用该工具设计好主题，就可以导出相应的文件并在\
  \ Android Studio 项目中使用它们。\n\n# 91. Material Design 3 主题化与动态颜色教程\n\n本章将向你展示如何使用 `Material\
  \ Theme Builder` 工具创建一个新的 Material Design 3 主题，并将其集成到 Android Studio 项目中。教程还将演示如何为应用添加对动态主题颜色的支持并测试。\n\
  \n## 91.1 创建 ThemeDemo 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在随后出现的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name`（名称）字段中输入 `ThemeDemo`，并指定 `com.ebookfrenzy.themedemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26`：`Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单设置为 `Java`。\n\n### 91.2 设计用户界面\n\n主活动将包含一个简单的布局，其中包含一些用户界面组件，这些组件让我们能够看到在本章之后的主题工作效果。有关\
  \ MD3 组件的信息，请参考以下网页：\n\n[`material.io/blog/migrating-material-3`](https://material.io/blog/migrating-material-3)\n\
  \n布局将在 `activity_main.xml` 文件中设计，该文件目前包含一个 `Text` 视图。在布局编辑器中打开此文件，删除 `Text` 视图，关闭\
  \ `Autoconnect`（自动连接）模式（在图 91-1 中标记为 `A`），并点击按钮清除布局中的所有约束（`B`）。\n\n![](img/as_theme_demo_layout_buttons.jpg)\n\
  \n图 91-1\n\n从 `Palette`（调色板）的 `Buttons` 部分将 `Chip`、`CheckBox`、`Switch` 和 `Button`\
  \ 视图拖到布局画布上。接下来，将一个 `FloatingActionButton` 拖到画布上，将其放置在 `Button` 组件下方。当提示选择显示在 `FloatingActionButton`\
  \ 上的图标时，从资源工具窗口选择 `ic_lock_power_off` 图标，如图 91-2 所示：\n\n![](img/as_theme_demo_layout_pick_icon.jpg)\n\
  \n图 91-2\n\n将 `Chip` 组件的 `text` 属性更改为“This is my chip”，并将 `chipIcon` 属性设置为 `@android:drawable/ic_btn_speak_now`，以便布局类似于图\
  \ 91-3 左侧所示的内容：\n\n![](img/as_theme_demo_ui.jpg)\n\n图 91-3\n\n要设置约束，选择所有组件，右键点击\
  \ `Chip` 视图，并从菜单中选择 `Chains -> Create Vertical Chain`（链 -> 创建垂直链）。重复此步骤，这次选择 `Center\
  \ -> Horizontally in Parent`（居中 -> 在父布局水平水平）选项。\n\n在设备或模拟器上编译并运行应用，验证用户界面是否与上述图\
  \ 91-3 所示。下一步是创建一个自定义主题并将其应用于项目。\n\n## 91.3 构建新主题\n\n首先打开浏览器窗口并导航到以下 URL 以访问构建工具：\n\
  \n[`m3.material.io/theme-builder#/custom`](https://m3.material.io/theme-builder#/custom)\n\
  \n一旦加载了构建器，选择一张壁纸，然后点击屏幕顶部的 `Custom` 按钮，点击 `Core Colors`（核心颜色）部分的 `Primary` 颜色圆形显示颜色选择器。从颜色选择器中选择任一种颜色作为你主题的基础：\n\
  \n![](img/theme_builder_color_dialog.jpg)\n\n图 91-4\n\n在 `Your Theme`（你的主题）面板中检查颜色方案，并使用\
  \ `Core colors` 设置进行必要的颜色调整，直到你对颜色槽满意为止。主题准备好后，点击右上角的 `Export`（导出）按钮并选择 `Android\
  \ Views (XML)` 选项。在提示时，将文件保存到计算机文件系统中的合适位置。主题将保存为名为 `material-theme.zip` 的压缩文件。\n\
  \n使用适用于你操作系统的相应工具解压主题文件，它应该包含在名为 `material-theme` 的文件夹中包含以下文件夹和文件：\n\n- `values/colors.xml`\
  \ - 颜色定义。\n- `values/themes.xml` - 浅色模式的主题。\n- `values-night/themes.xml` - 深色模式的主题。\n\
  \n现在主题文件已经生成，需要将其集成到 Android Studio 项目中。\n\n## 91.4 将主题添加到项目\n\n在将新主题添加到项目之前，我们首先需要删除旧的主题文件。如果\
  \ `Project` 工具窗口处于 `Project Files`（项目文件）模式，这样做会更简单。要切换模式，使用下所示 `Project` 工具窗口顶部的菜单并选择\
  \ `Project Files` 选项：\n\n![](img/as_project_files.jpg)\n\n图 91-5\n\n在 `Project Files`\
  \ 模式下，导航到 `app -> src -> main -> res -> values` 文件夹，选择并删除 `colors.xml` 和 `themes.xml`\
  \ 文件。同时删除 `values-night` 文件夹中的 `themes.xml` 文件。\n\n打开操作系统的文件系统工具，找到新主题 `values`\
  \ 文件夹中的 `colors.xml` 和 `themes.xml` 文件，将其复制到 `values` 文件夹。重复此步骤，将 `values-night`\
  \ 文件夹中的 `themes.xml` 文件粘贴到 `values-night` 文件夹。\n\n将 `Project` 工具窗口切换回 `Android`\
  \ 模式，此时值资源部分应匹配图 91-6：\n\n![](img/as_theme_new_theme_files.jpg)\n\n图 91-6\n\n接下来，修改浅色\
  \ `themes.xml` 文件以匹配当前项目：\n\n```xml\n<resources>\n    <style name=\"Base.Theme.ThemeDemo\"\
  \ parent=\"Theme.Material3.Light.NoActionBar\">\n        <item name=\"colorPrimary\"\
  >@color/md_theme_light_primary</item>\n        <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n\
  \    </style>\n    <style name=\"Theme.ThemeDemo\" parent=\"Base.Theme.ThemeDemo\"\
  \ />\n</resources>\n```\n\n重复这些步骤对 `themes.xml (night)` 文件进行相同的修改。\n\n返回 `activity_main.xml`\
  \ 文件或重新运行应用，确认用户界面使用自定义主题颜色渲染。\n\n## 91.5 启用动态颜色支持\n\n需要在运行 Android 12 或更高版本且具有正确壁纸设置设备或模拟器上运行应用以测试动态颜色。在设备或模拟器上，启动\
  \ `Settings`（设置）应用并选择 `Wallpaper & style`（壁纸与样式）。在壁纸设置屏幕上，点击更改壁纸的选项（在图 91-7 中标记为\
  \ `A`），选择一张与主题颜色差异巨大的壁纸图像。一旦选择，将壁纸分配到主屏幕。\n\n返回 `Wallpaper & styles` 屏幕，在从颜色方案按钮选择选项（`C`）之前，确保选择了\
  \ `Wallpaper colors`（壁纸颜色）选项（`B`）。点击每个选项时，壁纸示例将反映选择结果：\n\n![](img/compose_theme_wallpaper_and_styles.jpg)\n\
  \n图 91-7\n\n\n\n\n\n要启用动态颜色，我们需要调用 `DynamicColors` 类的 `applyToActivitiesIfAvailable()`\
  \ 方法。为了为整个应用启用动态颜色支持，需要在自定义 `Application` 实例的 `onCreate()` 方法内部调用该方法。首先，在项目的 `app\
  \ -> java -> com.ebookfrenzy.themedemo` 路径下添加名为 `ThemeDemoApplication.java` 的新 Java\
  \ 类文件，并对其进行如下修改：\n\n```java\npackage com.ebookfrenzy.themedemo;\n\nimport android.app.Application;\n\
  \nimport com.google.android.material.color.DynamicColors;\n\npublic class ThemeDemoApplication\
  \ extends Application {\n    @Override\n    public void onCreate() {\n        super.onCreate();\n\
  \        DynamicColors.applyToActivitiesIfAvailable(this);\n    }\n}\n```\n\n创建了自定义的\
  \ `Application` 类后，我们必须配置项目使用该类而不是默认的 `Application` 实例。要实现这一点，请编辑 `AndroidManifest.xml`\
  \ 文件并添加一个引用新类的 `android:name` 元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.themedemo\">\n    <application\n        android:name=\"\
  .ThemeDemoApplication\"\n        android:allowBackup=\"true\">\n```\n\n构建并运行应用，注意布局使用了与壁纸颜色匹配的主题。将\
  \ ThemeDemo 应用置到后台，返回壁纸与样式设置界面，并选择不同的壁纸。再次将 ThemeDemo 应用切回前台。此时，它将已经动态适应并匹配新的壁纸。\n\
  \n## 91.6 预览动态颜色\n\n动态颜色行为也可以在 Android Studio 布局编辑器中预览。要尝试这样做，请打开 `activity_main.xml`\
  \ 文件，点击主题菜单并选择 `More Themes`（更多主题）选项，如图图 91-8 所示：\n\n![](img/as_layout_editor_themes_menu.jpg)\n\
  \n图 91-8\n\n接下来，使用主题选择对话框中的搜索字段列出动态主题：\n\n![](img/as_layout_editor_select_theme.jpg)\n\
  \n图 91-9\n\n在点击 `OK` 按钮之前，选择 `Material3.DynamicColors.DayNight` 主。返回布局编辑器后，选择 `System\
  \ UI Mode`（系统 UI 模式）菜单并如图图 91-10 所示选择其中一个壁纸选项：\n\n![](img/as_layout_editor_dynamic_themes.jpg)\n\
  \n图 91-10\n\n一旦选择了壁纸，布局中组件的颜色将随之变化。\n\n### 91.7 总结\n\n在本章中，我们使用 Material Theme Builder\
  \ 设计了一个新主题，并解释了将生成的主题文件集成到 Android Studio 项目中的步骤。最后，章节介绍了如何实现和使用 Material You 动态颜色功能。\n\
  \n## 92. Android Studio 中的 Gradle 概述\n\n在《Gradle 版本目录指南》章节中，我们引入了库版本目录（library version\
  \ catalog），并解释了 Gradle 构建系统如何依赖它来确保项目使用正确的库和版本进行构建。除了中间章节对版本目录和库依赖进行了一些修改外，通常认为\
  \ Android Studio 会采取必要步骤来编译和运行创建的应用项目。Android Studio 一直通过一个名为 `Gradle` 的系统在后台实现这一点。\n\
  \n现在是时候了解如何使用 `Gradle` 来编译和应用项目的各种元素，并开始探索当为 Android Studio 中的构建项目有更高级需求时如何配置该系统了。\n\
  \n### 92.1 Gradle 概述\n\n`Gradle` 是一个自动化构建工具包，它允许通过一组构建配置文件来配置和管理项目的构建方式。这包括定义项目将如何被构建、成功构建需要满足哪些依赖，以及构建过程的最终结果（或结果）应该是什么。\n\
  \n`Gradle` 的优势在于它为开发者提供的灵活性。`Gradle` 系统是一个自包含的基于命令行的环境，可以通过插件集成到其他环境中。在 Android\
  \ Studio 的情况下，`Gradle` 集成是通过适当命名的 Android Studio 插件提供的。\n\n尽管 Android Studio 插件允许在\
  \ Android Studio 内部启动和管理 `Gradle` 任务，但仍然可以使用 `Gradle` 命令行包装器（wrapper）来构建基于 Android\
  \ Studio 的项目，包括在未安装 Android Studio 的系统中。\n\n构建项目的配置规则声明在基于 Groovy 编程语言的 Gradle 构建文件和脚本中。\n\
  \n### 92.2 Gradle 与 Android Studio\n\n`Gradle` 为构建 Android 应用项目带来了许多强大的功能。其中一些关键功能如下：\n\
  \n#### 92.2.1 优化的默认\n\n`Gradle` 实现了一种被称为“约定优于配置”（convention over configuration）的概念。这意味着\
  \ `Gradle` 有一组预定义的合理默认配置设置，除非构建文件中的设置覆盖了它们，否则将使用这些设置。这意味着可以使用开发者所需的最小配置进行构建。只有当默认配置不能满足你的构建需求时，才需要对构建文件进行更改。\n\
  \n#### 92.2.2 依赖\n\n`Gradle` 的另一个核心领域是依赖。例如，考虑 Android Studio 项目中的一个模块，它触发意图（intent）来加载另一个模块。第一个模块实际上对第二个模块有依赖，因为如果无法找到第二个模块，应用将失败。可以在第一个模块的\
  \ Gradle 构建文件中声明此依赖，以便将第二个模块包含在应用中，或者在找不到第二个模块时标记错误。其他依赖示例包括项目编译和运行所需的库和 JAR 文件。\n\
  \n`Gradle` 依赖可以分为本地和远程。本地依赖指的是执行构建的计算机系统本地文件系统中存在的项。远程依赖指的是存在远程服务器上的项（通常称为仓库）。\n\
  \nAndroid Studio 项目使用另一个名为 Maven 的项目管理工具处理远程依赖。如果在 Gradle 构建文件中使用 Maven 语法声明远程依赖，则该依赖将从指定的仓库自动下载并包含在构建中。例如，下面的依赖声明会将\
  \ AppCompat 库添加到项目中：\n\n```gradle\nimplementation(libs.androidx.appcompat)\n```\n\
  \n#### 92.2.3 构建变体\n\n除了依赖之外，`Gradle` 还为 Android Studio 项目提供了构建变体支持。这允许从单个项目构建多个应用变体。Android\
  \ 在许多不同的处理器类型和屏幕尺寸上。为了目标尽可能广泛的设备类型和尺寸，通常需要构建多个应用变体（例如，一个针对手机的用户界面，另一个针对平板电脑）。通过使用\
  \ `Gradle`，这在 Android Studio 中是可行的。\n\n#### 92.2.4 Manifest 条目\n\n\n\n\n\n每个 Android\
  \ Studio 项目都关联着一个 `AndroidManifest.xml` 文件，其中包含了应用程序的配置详情。在 Gradle 构建文件中可以指定若干清单条目，这些条目会在项目构建时自动生成到清单文件中。这一功能补充了构建变体（build\
  \ variants）功能，允许为每个构建变体配置不同的应用程序版本号、应用 ID 和 SDK 版本信息等元素。\n\n## 92.2.5 APK 签名\n\n\
  第 “创建、测试和上传 Android App Bundle” 章节涵盖了如何使用 Android Studio 环境创建签名的发布版 APK 文件。你也可以将通过\
  \ Android Studio 用户界面输入的签名信息包含在 Gradle 构建文件中，以便从命令行生成带带签名的 APK 文件。\n\n## 92.2.6\
  \ ProGuard 支持\n\nProGuard 是 Android Studio 自带的一个工具，它可以优化、收缩和混淆 Java 字节码，使其运行更高效且更难被反向工程（反向工程是指他人通过分析编译后的\
  \ Java 字节码来识别应用程序逻辑的方法）。Gradle 构建文件允许你控制在构建应用程序时是否对其应用运行 ProGuard。\n\n## 92.3 属性与设置\
  \ Gradle 构建文件\n\nGradle 构建配置由配置、属性和设置文件组成。例如，`gradle.properties` 文件主要包含与 Java 虚拟机（JVM）命令行标记相关的冷门设置，以及项目是否使用\
  \ AndroidX 库和 Kotlin 编码风格支持。作为普通用户，你可能不需要更改此文件中的任何设置。\n\n另一方面，`settings.gradle.kts`\
  \ 文件定义了当构建系统需要下载和安装构建项目所需的任何额外库和插件时搜索哪些在线仓库，以及项目名称。一个典型的 `settings.gradle.kts` 文件内容如下：\n\
  \n```kotlin\npluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n\
  \        gradlePluginPortal()\n    }\n}\n\ndependencyResolutionManagement {\n  \
  \  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories\
  \ {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name = \"\
  ThemeDemo\"\n\ninclude(\":app\")\n```\n\n与 `gradle.properties` 文件一样，可能不需要对此文件进行更改。\n\
  \n## 92.4 顶层 Gradle 构建文件\n\n一个完整的 Android Studio 项目包含了构建 Android 应用程序所需的一切，由模块、库、清单文件和\
  \ Gradle 构建文件组成。\n\n每个项目包含一个顶层 Gradle 构建文件。该文件列为 `build.gradle.kts` (Project: <project\
  \ name>)，可以在项目工具窗口中找到，如图 92-1 所示：\n\n![](img/as_app_gradle_file.jpg)\n\n图 92-1\n\
  \n默认情况下，顶层 Gradle 构建文件的内容如下：\n\n```kotlin\nplugins {\n    alias(libs.plugins.androidApplication)\
  \ apply false\n}\n```\n\n在大多数情况下，没有必要对此构建文件进行任何更改。\n\n## 92.5 模块级 Gradle 构建文件\n\n\
  一个 Android Studio 应用程序项目由一个或多个模块组成。例如，有一个名为 `GradleDemo` 的假设应用程序项目，它分别包含名为 `Module1`\
  \ 和 `Module2` 的模块。在这种情况下，每个模块都需要自己的 Gradle 构建文件。从项目结构来看，这些文件位于如下：\n\n- `Module1/build.gradle.kts`\n\
  - `Module2/build.gradle.kts`\n\n默认情况下，`Module1/build.gradle.kts` 文件将类似于下面列表所示：\n\
  \n```kotlin\nplugins {\n    alias(libs.plugins.androidApplication)\n}\n\nandroid\
  \ {\n    namespace = \"com.example.gradlesample\"\n    compileSdk = 34\n    defaultConfig\
  \ {\n        applicationId = \"com.example.gradlesample\"\n        minSdk = 26\n\
  \        targetSdk = 34\n        versionCode = 1\n        versionName = \"1.0\"\n\
  \        testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"\
  \n    }\n    buildTypes {\n        release {\n            isMinifyEnabled = false\n\
  \            proguardFiles(\n                getDefaultProguardFile(\"proguard-optimize.txt\"\
  ),\n                \"proguard-rules.pro\"\n            )\n        }\n    }\n  \
  \  compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_1_8\n   \
  \     targetCompatibility = JavaVersion.VERSION_1_8\n    }\n}\n\ndependencies {\n\
  \    implementation(libs.androidx.appcompat)\n    implementation(libs.material)\n\
  \    implementation(libs.androidx.activity)\n    implementation(libs.constraintlayout)\n\
  \    testImplementation(libs.junit)\n    androidTestImplementation(libs.junit)\n\
  \    androidTestImplementation(libs.espresso.core)\n}\n```\n\n\n\n\n```gradle\n\
  defaultConfig {\n\n    .\n    .\n}\n\nsigningConfigs {\n    release {\n        storeFile\
  \ file(\"keystore.release\")\n        storePassword \"your keystore password here\"\
  \n        keyAlias \"your key alias here\"\n        keyPassword \"your key password\
  \ here\"\n    }\n}\n\nbuildTypes {\n.\n    .\n}\n```\n\n上面的示例将密钥密码信息直接嵌入到构建文件中。这种方法的另一种替代方案是从系统环境变量中提取这些值：\n\
  \n```gradle\nsigningConfigs {\n    release {\n        storeFile file(\"keystore.release\"\
  )\n        storePassword System.getenv(\"KEYSTOREPASSWD\")\n        keyAlias \"\
  your key alias here\"\n        keyPassword System.getenv(\"KEYPASSWD\")\n    }\n\
  }\n```\n\n另一种方法是配置构建文件，让 Gradle 在构建过程中提示输入密码：\n\n```gradle\nsigningConfigs {\n \
  \   release {\n        storeFile file(\"keystore.release\")\n        storePassword\
  \ System.console().readLine(\"\\nEnter Keystore password: \")\n        keyAlias\
  \ \"your key alias here\"\n        keyPassword System.console().readLIne(\"\\nEnter\
  \ Key password: \")\n    }\n}\n```\n\n## 92.7 从命令行运行 Gradle 任务\n\n每个 Android Studio\
  \ 项目包含一个 Gradle 包装器工具（wrapper），用于从命令行调用 Gradle 任务。该工具位于每个项目文件夹的根目录下。虽然该包装器在 Windows\
  \ 系统上可以执行，但在 Linux 和 macOS 上使用之前可能需要启用执行权限。要启用执行权限，请打开终端窗口，切换到需要包装器的项目目录，并执行以下命令：\n\
  \n```bash\nchmod +x gradlew\n```\n\n一旦文件具有执行权限，则需要将该文件的路径添加到你的 `$PATH` 环境变量，或者在名称名前加上\
  \ `./` 才能运行。例如：\n\n```bash\n./gradlew tasks\n```\n\nGradle 将项目构建视为几个不同的任务。通过在项目目录中运行以下命令，可以获取当前可用任务的完整列表（如果在\
  \ macOS 或 Linux 上运行，请记住在命令前加上 `./`）：\n\n```bash\ngradlew tasks\n```\n\n要构建适用于设备或模拟器测试的项目调试发布版本，请使用\
  \ `assembleDebug` 选项：\n\n```bash\ngradlew assembleDebug\n```\n\n或者，要构建应用程序的发布版本：\n\
  \n```bash\ngradlew assembleRelease\n```\n\n### 92.8 总结\n\n在大多数情况下，Android Studio\
  \ 在后台执行应用构建，无需开发人员干预。此构建过程由 Gradle 系统处理，它是一个自动化构建工具包，旨在允许通过一组构建配置文件来配置和管理项目的构建方式。虽然\
  \ Gradle 的默认行为对于许多基础项目构建需求，但对于更复杂的项目，配置构建过程是不可避免的。本章概述了 Android Studio 项目背景下的 Gradle\
  \ 构建系统和配置文件。\n\n### 索引\n\n#### Symbols（符号）\n- `<application>` [436]\n- `<fragment>`\
