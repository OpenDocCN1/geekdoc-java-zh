  \n如果你发现错误列表中未列出的错误，请发送电子邮件至 `info@payloadbooks.com` 我们的技术支持团队告诉我们。他们将为你提供帮助，并努力解决你可能遇到的任何问题。\n\
  \n## 1.4 征求作者\n\nPayload Publishing 正在征求作者。\n\n你是一个心中有书籍想法的有志作者吗？与我们合作出版，我们将在每一步都为你提供全面的支持。我们提供指导以及技术和编辑协助，帮助你实现你的著作。一旦书籍完成，我们将通过我们的分销和渠道合作伙伴在全球范围内进行出版和营销，并支付比传统出版商更高的版税。\n\
  \n了解更多信息请访问：\n\n[`www.payloadbooks.com/authors-wanted`](https://www.payloadbooks.com/authors-wanted)\n\
  \n或发送电子邮件与我们联系：\n\n`authors@payloadbooks.com`\n\n## 2. 设置 Android Studio 开发环境\n\n\
  在开始开发 Android 应用程序之前，第一步是配置计算机系统作为开发平台。这涉及几个步骤，包括安装 Android Studio 集成开发环境 (IDE)，包括\
  \ Android 开发包 (SDK) 和 OpenJDK Java 开发环境。\n\n本章将涵盖在 Windows、macOS 和基于 Linux 的系统上安装\
  \ Android 应用开发所需组件的步骤。\n\n### 2.1 系统要求\n\nAndroid 应用程序开发可以在任何类型的系统上进行：\n\n* Windows\
  \ 8/10/11 64 位\n* 在 Intel 或 Apple 芯片上运行的 macOS 10.14 或更高版本\n* 配有 Intel i5 或更高处理器的\
  \ Chrome OS 设备\n* 版本 2.31 或更高版本的 Linux C Library (`glibc`) 系统\n* 至少 8GB RAM\n* 约\
  \ 8GB 可用磁盘空间\n* 屏幕分辨率最小 1280x800\n\n### 2.2 下载 Android Studio 程序包\n\n大多数 Android\
  \ 应用程序开发工作将在 Android Studio 环境中完成。书中的内容和示例是基于 Android Studio Iguana 2023.2.1 以及\
  \ Android 34 SDK (UpsideCake) 创建的，在写作时这些最新的稳定版本。\n\n然而，Android Studio 经常更新，因此自本书出版以来可能已经发布了新版本。\n\
  \n最新版本的 Android Studio 可以从主页面下载，该页面 URL 为：\n\n[`developer.android.com/studio/index.html`](https://developer.android.com/studio/index.html)\n\
  \n如果此页面提供了下载新版本 Android Studio 的说明，则书中与软件之间存在差异。如果这些差异引起问题，搜索“Android Studio Iguana”应该提供下载旧版本的选项。或者，访问以下网页可以在存档中找到\
  \ Android Studio Iguana 2023.2.1：\n\n[`developer.android.com/studio/archive`](https://developer.android.com/studio/archive)\n\
  \n### 2.3 安装 Android Studio\n\n下载完成后，安装 Android Studio 的具体步骤取决于执行的操作系统。\n\n####\
  \ 2.3.1 在 Windows 上安装\n\n在 Windows 资源管理器中找到下载的 Android Studio 安装可执行文件（命名为 `android-studio-<version>-windows.exe`），并双击它开始安装过程，如果弹出用户账户控制对话框，请点击\
  \ `是` 按钮。\n\n\n\n\n\n一旦 Android Studio 安装向导出现，请按照各个屏幕的操作完成配置，以满足你的需求，包括 Android\
  \ Studio 应该安装的文件系统位置，以及是否允许其他系统用户使用。在提示选择要安装的组件时，请确保选中了 **Android Studio** 和 **Android\
  \ Virtual Device**（Android 虚拟设备）选项。\n\n虽然对于 Android Studio 安装在系统的哪个位置没有严格规定，但本书的其余部分将假设安装路径为为`C:\\\
  Program Files\\Android\\Android Studio`，并且 Android SDK 包已安装在用户的 `AppData\\Local\\\
  Android\\sdk` 子文件夹中。配置好选项后，点击 `Install`（安装）按钮开始安装过程。\n\n在带有开始菜单的 Windows 版本中，可以从安装期间添加到菜单的项目中启动新安装的\
  \ Android Studio。可以通过进入 `Android Studio\\bin` 目录，右键点击 `studio64` 可执行文件，并选择 `Pin\
  \ to Taskbar`（固定到任务栏）菜单选项将其固定，以便访问（在 Windows 11 上，可以通过菜单中的 `Show more options`（显示更多选项）找到此选项）。\n\
  \n#### 2.3.2 在 macOS 上安装\n\nmacOS 版 Android Studio 以磁盘镜像（`.dmg`）文件的形式下载。下载 `android-studio-<version>-mac.dmg`\
  \ 文件后，在 Finder 窗口中找到它并双击打开，如图 2-1 所示：\n\n![](img/as_dmg_drag_to_applications.jpg)\n\
  \n图 2-1\n\n要安装该包，将 Android Studio 图标拖放到 `Applications`（应用程序）文件夹。Android Studio 包将被安装到系统的\
  \ `Applications` 文件夹中，此过程通常需要几秒钟完成。\n\n要启动 Android Studio，使用 Finder 窗口找到 `Applications`\
  \ 文件夹中的可执行文件并双击。\n\n为了以后更容易访问该工具，可以将 Android Studio 图标从 Finder 窗口拖动到 Dock 栏。\n\n\
  #### 2.3.3 在 Linux 上安装\n\n下载 Linux 版 Android Studio 包后，打开终端窗口，进入要安装 Android Studio\
  \ 的目录，并执行以下命令：\n\n```\ntar xvfz /<path to package>/android-studio-<version>-linux.tar.gz\n\
  ```\n\n注意，Android Studio 压缩包将安装到名为 `android-studio` 的子目录。因此，假设上述命令是在 `/home/demo`\
  \ 中执行的，软件包将将解压到 `/home/demo/android-studio`。\n\n要启动 Android Studio，打开终端窗口，切换到 `android-studio/bin`\
  \ 子目录，并执行以下命令：\n\n```\n./studio.sh\n```\n\n### 2.4 Android Studio 安装向导\n\n如果你之前安装过较早版本的\
  \ Android Studio，在首次启动此新版本时，可能会弹出一个对话框，提供从之前的 Android Studio 版本导入设置的选项。如果你有以前版本的设置并希望将它们导入到最新安装中，请选择相应的选项和位置。或者，指示你不需要导入任何之前的设置并点击\
  \ `OK`（确定）按钮继续。\n\n如果你是首次安装 Android Studio，安装过程一旦开始，出现的初始对话框可能类似于下方的图 2-2 所示：\n\n\
  ![](img/as_setup_wizard.jpg)\n\n图 2-2\n\n如果出现此对话框，点击 `Next`（下一步）按钮显示安装类型（Install\
  \ Type）屏幕（图 2-3）。在此屏幕上，在点击 `Next` 之前选择 `Standard`（标准）安装选项。\n\n![](img/as_setup_install_type.jpg)\n\
  \n图 2-3\n\n在“Select UI Theme”（选择 UI 主题）屏幕上，根据你的喜好选择 `Darcula` 或 `Light`（亮）主题。选择后，点击\
  \ `Next`，并在 `Verify Settings`（验证设置）屏幕上检查选项，然后进入 `License Agreement”（许可协议）屏幕。选择每个许可类别并启用\
  \ `Accept`（接受）复选框。最后，点击 `Finish`（完成）按钮启动安装。\n\n完成这些初始设置步骤后，点击 `Finish` 按钮使用你选择的\
  \ UI 主题显示 Welcome to Android Studio 界面：\n\n![](img/as_iguana_welcome.jpg)\n\n图 2-4\n\
  \n### 2.5 安装额外的 Android SDK 包\n\n到目前为止执行的操作安装了 Android Studio IDE 和当前一组默认 Android\
  \ SDK 包。在继续之前，值得花时间验证安装了哪些包，并安装任何缺失或更新的包。\n\n可以通过点击欢迎对话框中的 `More Actions`（更多操作）链接并从下拉菜单中选择\
  \ `SDK Manager`SDK 管理器）来执行此任务。一旦调用，将显示 `Settings`设置）对话框的 Android SDK 屏幕，如图 2-5 所示：\n\
  \n![](img/as_sdk_manager.jpg)\n\n图 2-5\n\nGoogle 的每一个 Android Studio 版本都对应 Android\
  \ SDK 支持的最大应用程序编程接口（API）级别。对于 Android Studio Iguana，该级别是 Android UpsideDownCake（API\
  \ Level 34）。可以通过以下链接确认此信息：\n\n[`developer.android.com/studio/releases#api-level-support`](https://developer.android.com/studio/releases#api-level-support)\n\
  \n在首次安装 Android Studio 之后，可能只安装了最新支持的 Android SDK 版本。要安装旧版本的 Android SDK，请选择相应的复选框并点击\
  \ `Apply`应用）按钮。本书其余部分假设已安装 Android UpsideDownCake（API Level 34）SDK。\n\n本书中的大多数示例将支持到\
  \ Android 8.0（Oreo）的旧版本 Android。这确保了应用程序可以在广泛的 Android 设备上运行。在 SDK 版本列表中，启用 Android\
  \ 8.0（Oreo）旁边的复选框并点击 `Apply`按钮。在生成的确认对话框中点击 `OK`按钮安装 SDK。随后的对话将在执行安装前寻求接受许可和条款。安装完成后点击\
  \ `Finish`。\n\n可能还会列出最新 SDK 的可用更新。要访问待更新包的详细信息，启用屏幕右下角的 `Show Package Details`显示包详情）选项。这将显示类似于图\
  \ 2-6 所示的信息：\n\n![](img/as_sdk_manager_update_available.jpg)\n\n图 2-6\n\n上述图突出了可用更新。要安装更新，启用项目名称左侧的复选框并点击\
  \ `Apply`按钮。\n\n除了 Android SDK 包，还安装了多个构建 Android 应用程序的工具。要查看已安装的包并检查更新，请留在 SDK\
  \ 设置屏幕并选择 `SDK Tools`工具卡，如图 2-7 所示：\n\n![](img/as_sdk_manager_tools.jpg)\n\n图 2-7\n\
  \n在 Android SDK Tools 屏幕中，确保以下包在状态列中显示为已安装（Installed）：\n\n• Android SDK Build-tools\n\
  • Android Emulator\n• Android SDK Platform-tools\n• Google Play Services\n• Intel\
  \ x86 Emulator Accelerator (HAXM installer)*\n• Google USB Driver（仅限 Windows）\n\
  • API 31-34 Layout Inspector image server\n\n*注意：Intel x86 加速器（HAXM 安装程序）无法在基于 Apple\
  \ 芯片的 Mac 上安装。*\n\n\n\n\n\n如果上述任何软件包被列为“未安装”（Not Installed）或需要更新，请勾选这些软件包旁的复选框并点击`Apply`按钮启动安装过程。如果出现\
  \ `HAXM` 模拟器设置对话框，请选择推荐的内存分配：\n\n![](img/as_haxm_memory.jpg)\n图 2-8\n\n安装完成后，检查软件包列表并确保所选软件包在`Status`（状态）列中显示为`Installed`（已安装）。如果任何一个包显示为未安装，请确保已已选中并再次点击`Apply`按钮。\n\
  \n### 2.6 安装 Android SDK 命令行工具\n\nAndroid Studio 包含了一些工具，允许你从操作系统的命令行执行某些任务。要在系统上安装这些工具，请打开`SDK\
  \ Manager`，选择`SDK Tools` 标签页，并如图 2-9 所示找到`Android SDK Command-line Tools (latest)`\
  \ 包：\n\n![](img/as_sdk_manager_command_line_tools.jpg)\n图 2-9\n\n如果命令行工具包尚未安装，请启用它并点击`Apply`，然后点击`OK`完成安装。安装完成后，点击`Finish`并关闭\
  \ `SDK Manager` 对话框。\n\n为了让你正在运行的操作系统能够找到这些工具，有必要将它们添加到系统的`PATH`环境变量中。\n\n无论你使用哪种操作系统，你都需要配置`PATH`环境变量以包含以下路径（其中`<path_to_android_sdk_installation>`代表你安装\
  \ Android SDK 的文件系统位置）：\n\n```\n<path_to_android_sdk_installation>/sdk/cmdline-tools/latest/bin\n\
  <path_to_android_sdk_installation>/sdk/platform-tools\n```\n\n你可以通过启动`SDK Manager`并参考设置面板顶部的`Android\
  \ SDK Location:`字段来识别 SDK 在你系统上的位置，如图 2-10 所示：\n\n![](img/as_sdk_location.jpg)\n\
  图 2-10\n\n一旦确定了 SDK 的位置，将此添加到`PATH`变量的步骤取决于具体的操作系统：\n\n#### 2.6.1 Windows 8.1\n\n\
  1. 在启动屏幕上，将鼠标移动到屏幕右下角，从弹出的菜单中选择`Search`搜索。在搜索框中输入`Control Panel`控制面板。当`Control Panel`图标出现在结果区域时，点击它在桌面上启动该工具。\n\
  2. 在`Control Panel`中，使用`Category`分类菜单将显示更改为`Large Icons`大图标。从图标列表中选择标记为`System`的的项。\n\
  3. 在`Environment Variables`（环境变量）对话框中，在`System variables`列表中找到`Path`变量，选中它并点击`Edit…`按钮。使用编辑对话框中的`New`按钮向路径添加两个新条目。例如，假设\
  \ Android SDK 安装在`C:\\Users\\demo\\AppData\\Local\\Android\\Sdk`，则需要添加以下项：\n\n```\n\
  C:\\Users\\demo\\AppData\\Local\\Android\\Sdk\\cmdline-tools\\latest\\bin\nC:\\\
  Users\\demo\\AppData\\Local\\Android\\Sdk\\platform-tools\n```\n\n4. 点击每个对话框中的`OK`并关闭系统属性控制面板。\n\
  \n通过按下键盘上的`Windows + R`键并在`Run`对话框中输入`cmd`来打开命令提示符窗口。在`Command Prompt`窗口中输入：\n\n\
  ```\necho %Path%\n```\n\n返回的路径变量值应包含 Android SDK 平台文件夹的路径。通过尝试如下所示运行`adb`工具来验证`platform-tools`值是否正确：\n\
  \n```\nadb\n```\n\n该工具在执行时应输出命令行选项列表。\n\n同样，通过尝试运行`AVD Manager`命令行工具来检查工具路径设置（如果`avdmanager`工具报告\
  \ Java 问题，请不要担心——这稍后会解决）：\n\n```\navdmanager\n```\n\n如果其中一个或两个命令都出现了类似下面的消息，那么很可能是向`Path`环境变量中添加了错误的路径：\n\
  \n```\n'adb' is not recognized as an internal or external command,\noperable program\
  \ or batch file.\n```\n\n#### 2.6.2 Windows 10\n\n右键点击`Start`菜单，从弹出的菜单中选择`Settings`设置，并在`Find\
  \ a setting`文本框中输入“编辑系统环境变量”。在`System Properties`对话框中，点击`Environment Variables...`按钮。按照\
  \ Windows 8.1 列出的步骤从第 3 步开始。\n\n#### 2.6.3 Windows 11\n\n右键点击任务栏上的`Start`图标，从弹出的菜单中选择`Settings`设置。当`Settings`对话框出现时，向下滚动列表并选择“关于”选项。在“关于”屏幕上，从`Related\
  \ links`部分选择`Advanced system settings`高级系统设置。当`System Properties`窗口出现时，点击`Environment\
  \ Variables...`按钮。按照 Windows 8.1 列出的步骤从第 3 步开始。\n\n#### 2.6.4 Linux\n\n在 Linux 上可以通过向家目录下的`.bashrc`文件添加命令来实现此配置（具体细节可能取决于所使用的特定\
  \ Linux 发行版）。假设 Android SDK 包安装在`/home/demo/sdk`，则`.bashrc`文件中的导出语句如下：\n\n```\n\
  export PATH=/home/demo/sdk/platform-tools:/home/demo/sdk/cmdline-tools/latest/bin:/home/demo/sdk/android-studio/bin:$PATH\n\
  ```\n\n注意，上面的命令将`android-studio/bin`目录添加到`PATH`中，这将允许在终端内执行`studio.sh`脚本。\n\n####\
  \ 2.6.5 macOS\n\n在 macOS 上可以使用多种技术来修改`PATH`变量。最干净的方法是在`/etc/paths.d`中创建一个文件，包含要添加到`PATH`的路径。假设\
  \ Android SDK 安装位置为`/Users/demo/Library/Android/sdk`，可以通过包含以下内容的`android-sdk`文件进行配置：\n\
  \n```\n/Users/demo/Library/Android/sdk/cmdline-tools/latest/bin\n/Users/demo/Library/Android/sdk/platform-tools\n\
  ```\n\n注意由于由于系统目录，创建文件时需要使用`sudo`命令。例如：\n\n```\nsudo vi /etc/paths.d/android-sdk\n\
  ```\n\n### 2.7 Android Studio 内存管理\n\nAndroid Studio 是一个大型且复杂的应用程序。尽管过去被批评性能欠佳，但\
  \ Google 在最近的发布中进行了重大的改进，并在每个版本中持续改进。这些改进包括允许用户配置 Android Studio IDE 以及用于构建和运行应用的后台进程所需的内存。这使得软件能够利用大内存系统。\n\
  \n如果你在具有足够空闲内存的系统上运行 Android Studio 并发现性能似乎下降，那么尝试这些内存设置是值得的。Android Studio 还可能通过类似所示的对话框提示你可以提高性能：\n\
  \n![](img/as_3.5_increase_memory_notification.jpg)\n图 2-11\n\n要查看并修改当前的内存配置，选择主菜单中的`File\
  \ -> Settings...`（macOS 上为`Android Studio -> Settings...`），并在弹出的对话框中，选择左侧导航面板中的`Appearance\
  \ & Behavior`，然后选择`System Settings`下的`Memory Settings`选项，如[图 2-12]所示：\n\n![](img/as_memory_settings.jpg)\n\
  图 2-12\n\n更改内存分配时，请确保分配的内存没有必要或系统在不影响其他进程的情况下提供的内存。\n\n\n\n\n\nIDE 堆栈大小设置调整分配给 Android\
  \ Studio 的内存，并且无论当前加载了什么项目都会生效。另一方面，当从 Android Studio 内部构建和运行项目时，会有几个后台进程（称为守护进程\
  \ daemon）执行编译和运行应用的任务。在编译和运行大型复杂项目时，可以通过调整守护进程堆栈设置来提高构建速度。与 IDE 堆栈设置不同，这些守护进程设置仅适用于当前项目，并且只有在\
  \ Android Studio 中打开项目时才能访问。若要在打开的项目内部显示 `SDK Manager`，请从主菜单中选择 `Tools -> SDK Manager...`\
  \ 菜单选项。\n\n### 2.8 更新 Android Studio 和 SDK\n\nAndroid Studio 和 Android SDK 会不定期发布新版本。新版本的\
  \ SDK 是通过 `Android SDK Manager` 安装的。当有可用的更新准备供安装时，Android Studio 通常会通知你。\n\n若要手动检查\
  \ Android Studio 更新，请在 Android Studio 主窗口中使用 ``Help -> Check for Updates...` 菜单选项（macOS\
  \ 上为 `Android Studio -> Check for Updates...`）。\n\n### 2.9 总结\n\n在开始开发 Android 应用程序之前，第一步是搭建一个合适的开发环境。这由\
  \ `Android SDKs` 和 `Android Studio IDE`（包含 `OpenJDK` 开发环境）组成。本章涵盖了在 Windows、macOS\
  \ 和 Linux 上安装这些包的必要步骤。\n\n## 3. 在 Android Studio 中创建一个示例 Android 应用\n\n本书前面的章节已经解释了如何使用\
  \ `Android Studio IDE` 配置适用于开发 Android 应用程序的环境。在进入稍为高级的话题之前，现在是验证所有所需的开发包已安装并正常运行的好时机。实现这一目标的最好方法是创建一个\
  \ Android 应用程序并编译运行它。本章将介绍如何使用 `Android Studio` 创建 Android 应用程序项目。项目创建完成后，后续章节将探索如何使用\
  \ Android 模拟器环境对应用程序进行测试运行。\n\n### 3.1 关于项目\n\n在本章创建的项目是一个基础的货币转换计算器（事实上，它非常简单，只将美元转换为欧元，并使用估算的汇率进行转换）。该项目还将使用最基础的\
  \ Android Studio 项目模板之一。这种简单性允许我们介绍 Android 应用开发的一些关键方面，而不会因为一次性引入过多的概念（例如推荐的应用程序架构和\
  \ Android 架构组件）让初学者感到无从。。在本章的教程过程中，请放心，这个初始示例项目使用的技术和代码在稍后会有更详细的介绍。\n\n### 3.2 创建新的\
  \ Android 项目\n\n应用程序开发过程的第一步是在 Android Studio 环境中创建一个新项目。因此，请先启动 `Android Studio`，直到出现如图图\
  \ 3-1 所示的“Welcome to Android Studio”屏幕：\n\n![](img/as_iguana_welcome1.jpg)\n\n图\
  \ 3-1\n\n一旦此窗口出现，`Android Studio` 已准备好创建新项目。要创建新项目，点击 `New Project` 选项以显示 `New Project`\
  \ 向向的第一个界面。\n\n### 3.3 创建 Activity（活动）\n\n下一步是为应用程序定义要创建的初始 Activity 类型。目前有可以为手机和平电脑、Wear\
  \ OS、电视或汽车创建项目的选项。在开发 Android 应用程序时有多种不同的 Activity 类型，其中许多将在后面的章节中详细介绍。然而，对于本示例，请从\
  \ `Templates` 面板中选择 `Phone and Tablet` 选项，然后选择创建 `Empty Views Activity` 的选项。`Empty\
  \ Views Activity` 选项会创建一个由单个 `TextView` 对象组成的模板用户界面。\n\n![](img/as_new_project_template.jpg)\n\
  \n图 3-2\n\n选中 `Empty Views Activity` 选项后，点击 `Next` 继续进行项目配置。\n\n### 3.4 定义项目和 SDK\
  \ 设置\n\n在项目配置窗口（图 3-3）中，将 `Name` 字段设置为 `AndroidSample`。应用程序名称是在 `Android Studio`\
  \ 内部用于引用和识别应用程序的名称，也是如果完成的应用程序要在 Google Play 商店出售时将用到的名称。\n\n`Package name`（包名）在\
  \ Android 应用程序生态系统中唯一标识该应用程序。虽然它可以设置为任何唯一标识你应用的的字符串，但传统上，它是基于域名的反转 URL，后面加上应用程序名称。例如，如果你的域名是\
  \ `www.mycompany.com`，且应用程序命名为 `AndroidSample`，那么包名可以指定如下：\n\n`com.mycompany.androidsample`\n\
  \n如果你没有域名，可以在 `Company Domain` 字段中输入任何其他字符串，或者可以使用 `example.com` 进行测试，尽管在应用程序发布之前需要进行更改：\n\
  \n`com.example.androidsample`\n\n`Save location`（保存位置）设置将默认位于你主目录下名为 `AndroidStudioProjects`\
  \ 的文件夹中，可以通过点击包含当前路径设置的文本字段右侧的文件夹图标进行更改。\n\n将 `minimum SDK` 设置为 `API 26`（Oreo；Android\
  \ 8.0）。除非某些功能仅在较新版本可用，否则本书中创建的大多数项目都将使用此最低 SDK。这里的目标是使用最新的 `Android SDK` 构建应用，同时保留与运行旧版本\
  \ Android 的设备的兼容性（在这种情况下，远可追溯到 Android 8.0）。`Minimum SDK` 设置下方的文本将概述目前运行该应用程序的 Android\
  \ 设备百分比。点击 `Help me choose` 按钮（在图 3-3 中已高亮显示）以查看仍在使用的各种 Android 版本的详细说明：\n\n![](img/as_java_project_settings.jpg)\n\
  \n图 3-3\n\n最后，将 `Language` 菜单更改为 `Java`，并在点击 `Finish` 创建项目之前选择 `Kotlin DSL (build.gradle.kts)`\
  \ 作为构建语言。\n\n### 3.5 启用新的 Android Studio UI\n\nAndroid Studio 正在转向全新的现代用户界面，该界面在\
  \ Iguana 版本中默认未启用。如果你的 Android Studio 安装类似于下方的图 3-4，则你需要在继续之前启用新 UI：\n\n![](img/as_old_ui.jpg)\n\
  \n图 3-4\n\n通过选择 `File -> Settings...` 菜单选项（macOS 上为 `Android Studio -> Settings...`）并在左侧面板的\
  \ `Appearance and Behavior` 下选择 `New UI` 选项来启用新 UI。在主面板中，点击 `Apply` 之前勾选 `Enable\
  \ new UI`，然后点击 `OK` 提交更改：\n\n![](img/as_new_ui.jpg)\n\n图 3-5\n\n根据提示，重启 `Android\
  \ Studio` 以激活新的用户界面。\n\n### 3.6 修改示例应用程序\n\n当 Android Studio 重启后，主窗口将使用新 UI 再次出现，并包含如图\
  \ 3-6 所示的我们的 `AndroidSample` 项目：\n\n![](img/as_main_window.jpg)\n\n图 3-6\n\n\n\n\
  \n\n新创建的项目以及相关文件的引用列在主项目窗口左侧的 `Project` 工具窗口中。`Project` 工具窗口有多种显示信息的模式。默认情况下，此面板应处于\
  \ `Android` 模式。此设置由面板顶部的菜单控制，如图 3-7 所示。如果面板当前未处于 `Android` 模式，请使用菜单切换模式：\n\n![](img/as_project_menu.jpg)\n\
  \n图 3-7\n\n### 3.7 修改用户界面\n\n我们 Activity 的用户界面设计存储在一个名为 `activity_main.xml` 的文件中，该文件随后位于\
  \ `Project` 工具窗口文件层级中的 `app` -> `res` -> `layout` 目录下。在 `Project` 工具窗口中找到该文件后，双击文件将其加载到用户界面\
  \ `Layout Editor` 工具中，该工具将显示在 Android Studio 主窗口的中间面板中：\n\n![](img/as_layout_editor.jpg)\n\
  \n图 3-8\n\n`Layout Editor` 窗口顶部工具栏上有一个菜单（上图中设置为 `Pixel`），它反映在 `Layout Editor` 面板内设备的视觉表示中。点击此菜单可以使用其他一系列设备选项。\n\
  \n使用 `System UI Mode` 按钮 `![](img/as_night_mode_button.jpg)` 来开启或关闭设备屏幕布局的 `Night`\
  \ 模式。要在设备表示的横屏和竖屏之间切换，请使用显示 `![](img/as_rotate_button.jpg)` 图标的下拉菜单。\n\n正如我们在设备屏幕上看到的，内容布局已经包含一个显示“Hello\
  \ World!”消息的标签。面板左侧是一个调色板，包含不同类别的用户界面组件，这些组件可以构建用户界面，例如按钮、标签和文本字段。但需要注意的是并不是所有的用户界面组件对用户都是的。其中一个类别就是布局。Android\
  \ 支持多种布局，它们对视觉用户界面组件在屏幕上的定位和管理提供了不同级别的控制。虽然很难从用户界面的视觉表示判断，但当前的设计是使用 `ConstraintLayout`\
  \ 创建的。这可以通过查看 `Component Tree` 面板中的信息来确认，该面板默认位于 `Layout Editor` 面板的左下角，如图 3-9 所示：\n\
  \n![](img/as_component_tree.jpg)\n\n图 3-9\n\n从组件树层级结构可以看出，用户界面布局由一个名为 `main` 的 `ConstraintLayout`\
  \ 父布局和一个 `TextView` 子对象组成。\n\n在继续之前，请检查 `Layout Editor` 的 `Autoconnect` 模式已启用。这意味着当向布局添加组件时，`Layout\
  \ Editor` 将自动添加约束，以确保组件在不同的屏幕尺寸和设备方向上正确定位（该主题将在后续章节中进行更详细的介绍）。`Autoconnect` 按钮出现在\
  \ `Layout Editor` 工具栏中，用 U 形图标表示。当被禁用时，图标上会显示一条对角线（图 3-10）。如有必要，通过点击此按钮重新启用 `Autoconnect`\
  \ 模式。\n\n![](img/as_autoconnect_disabled.jpg)\n\n图 3-10\n\n修改应用程序的下一步是向布局添加一些额外的组件，其中第一个将是\
  \ `Button`，供用户按下以启动货币转换。\n\n`Palette` 面板由两列组成，左侧列包含视图组件类别列表。右侧列列出当前选择类别包含的组件。在图\
  \ 3-11 中，例如，`Buttons` 类别中当前选择了 `Button` ：\n\n![](img/as_palette_button_selected.jpg)\n\
  \n图 3-11\n\n从 `Buttons` 列表中点击并拖动 `Button` 对象，将其释放到用户界面设计的水平中心，使其位于现有 `TextView`\
  \ 小部件下方：\n\n![](img/as_android_sample_button.jpg)\n\n图 3-12\n\n下一步是更改 `Button` 组件当前显示的文本。位于设计区域右侧的面板是\
  \ `Attributes` 面板。该面板显示分配给布局中当前选中组件的属性。在此面板中，在 `Common Attributes` 部分找到 `text` 属性，并将当前值从“Button”更改为“Convert”，如图\
  \ 3-13 所示：\n\n![](img/as_android_sample_button_text.jpg)\n\n图 3-13\n\n带有扳手图标的第二个文本属性允许设置文本属性，该属性仅显示在\
  \ `Layout Editor` 工具中，但在运行时不会显示。这对于测试视觉组件和布局在不同设置下的表现非常有用，而无需反复运行应用。\n\n以防 `Autoconnect`\
  \ 系统未能设置所有布局连接，请点击 `Infer Constraints` 按钮（图 3-14）为布局添加任何缺失的约束：\n\n![](img/as_layout_editor_autoconnect.jpg)\n\
  \n图 3-14\n\n说明 `Layout Editor` 工具右上角的警告按钮，如图 3-15 所示。此警告表示布局存在问题。要查看问题的详情，请点击该按钮：\n\
  \n![](img/as_warnings.jpg)\n\n图 3-15\n\n点击后，`Problems` 工具窗口（图 3-16）将会出现，描述问题的性质：\n\
  \n![](img/as_tool_window.jpg)\n\n图 3-16\n\n该工具窗口分为两个面板。左侧面板（图中标记为 A）列出了文件中发现的问题。在我们的示例中，列出了以下问题：\n\
  \nbutton `<Button>: Hardcoded text\n\n当从列表中选择项目时（B），右面板将更新以提供问题的细节（C）。在这种情况下，解释如下：\n\
  \nHardcoded string \"Convert\", should use @string resource\n\n工具窗口还包含一个预览编辑器（D），允许对布局文件进行手动修正。\n\
  \n此 I18N 信息提示我们项目未来的国际化存在潜在问题（“I18N”源于单词“internationalization”以“I”开头，以“N”结尾，中间有\
  \ 18 个字母）。该警告提醒我们，在开发 Android 应用时，应尽可能将属性字符串和值存储为资源。这样做可以通过修改资源文件而不是应用程序源代码来更改应用程序的外。这在将用户界面翻译成不同的语言时可能特别有用。如果用户界面的所有文本都包含在一个资源文件中（例如），可以将该文件交给翻译人员，他们将执行翻译工作并返回翻译后的文件包含在应用程序中。这使得能够针对多种语言，而无需更改任何源代码。在本例中，我们将创建一个名为\
  \ `convert_string` 的新资源，并为其分配字符串“Convert”。\n\n首先点击 `Show Quick Fixes` 按钮（E），并从菜单中选择\
  \ `Extract string resource` 选项，如图 3-17 所示：\n\n![](img/as_extract_button.jpg)\n\n\
  图 3-17\n\n\n\n\n\n选择此选项后，将出现提取资源面板（图 3-18）。在面板面板中，将资源名称字段更改为 `convert_string`，并将资源值保留为\
  \ `Convert`，然后点击 OK 按钮：\n\n![](img/as_extract_resource.jpg)\n\n图 3-18\n\n下一个要添加的控件是\
  \ `EditText` 控件，用户将在其中输入要转换的金额。从调色板（Palette）面板中，选择 `Text` 类别，点击并拖动一个 `Number (Decimal)`\
  \ 组件到布局中，使其水平居中并位于现有的 `TextView` 控件上方。选中该控件后，使用属性（Attributes）工具窗口将 `hint` 属性设置为“dollars”。点击警告图标并将字符串提取到命名为\
  \ `dollars_hint` 的资源。\n\n在本章稍后编写的代码将需要访问用户在 `EditText` 字段中输入的美元金额。它将通过引用分配给用户界面布局中控件的\
  \ `id` 来实现。当在布局中选中控件时，可以在属性工具窗口中查看并更改 Android Studio 为控件分配的默认 `id`，如图 3-19 所示：\n\
  \n![](img/as_widget_id.jpg)\n\n图 3-19\n\n将 `id` 更改为 `dollarText`，并在重命名对话框中点击重构（Refactor）按钮。这将确保项目其他地方对旧\
  \ `id` 的任何引用都会自动更新为使用新 `id`：\n\n![](img/as_rename_id_dialog.jpg)\n\n图 3-20\n\n如有必要，重复步骤将\
  \ `TextView` 控件的 `id` 设置为 `textView`。\n\n点击推断约束（Infer Constraints）按钮添加任何缺失的布局约束。此时，布局应该类似于图\
  \ 3-21 所示所示所示：\n\n![](img/as_android_sample_ui.jpg)\n\n图 3-21\n\n### 3.8 审查布局和资源文件\n\
  \n在继续后续步骤之前，我们将查看用户界面设计和资源处理的一些内部方面。在上一节中，我们使用布局编辑器（Layout Editor）工具通过修改 `activity_main.xml`\
  \ 文件更改了用户界面。事实上，布局编辑器所做的只是提供了一种易于编辑文件底层 XML 内容的内容方法。在实践中，你没有理由不直接修改 XML 来进行用户界面更改，在某些情况下，这实际上可能比使用布局编辑器工具更快。在布局编辑器面板的右上角有标记为\
  \ `A` 到 `C` 的视图模式（View Modes）按钮，见下面的图 3-22 所示\n\n![](img/as_layout_editor_view_mode_buttons.jpg)\n\
  \n图 3-22\n\n默认情况下，编辑器将处于 `Design` 模式（按钮 `C`），此时仅显示布局的可视表示。在 `Code` 模式（`A`）下，编辑器将显示布局的\
  \ XML，而在 `Split` 模式（`B`）下，将同时显示布局和 XML，如图 3-23 所示：\n\n![](img/as_layout_editor_split_mode.jpg)\n\
  \n图 3-23\n\n视图模式按钮左侧的按钮（在上面的图 3-22 中标记为 `B`）用于快速在 `Code` 和 `Split` 模式之间切换。\n\n从\
  \ XML 文件的结构可以看出，用户界面由 `ConstraintLayout` 组件组成，该组件又是 `TextView`、`Button` 和 `EditText`\
  \ 对象的父。我们还可以看到，例如，`Button` 的 `text` 属性设置为我们的 `convert_string` 资源。尽管复杂性和内容各异，所有用户界面布局都是以这种基于\
  \ XML 的层次结构组织的。\n\n随着 XML 布局的更改，这些更改将反映在布局画布上。可以在布局画布面板内对布局进行视觉化修改，更改将出现在 XML 列表中。要查看此操作，切换到\
  \ `Split` 模式并修改 XML 布局，将 `ConstraintLayout` 的背景颜色更改为红色调如下：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/main\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\"\n    android:background=\"#ff2438\" >\n\n\
  .\n\n.\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n注意，布局颜色会实时更改以匹配\
  \ XML 文件中的新设置。还要注意，在 XML 编辑器的左边距（也称为槽，gutter）包含颜色设置的行旁边会出现一个小的红色方块。这是在某个属性上设置了红色的视觉提示。点击红色方块将显示颜色选择器，允许选择不同的颜色：\n\
  \n![](img/as_layout_editor_color_selector.jpg)\n\n图 3-24\n\n在继续之前，删除布局中的背景属性，使其返回默认值。最后，使用项目面板找到\
  \ `app -> res -> values -> strings.xml` 文件并双击将其加载到编辑器。目前 XML 应该是：\n\n```xml\n<resources>\n\
  \    <string name=\"app_name\">AndroidSample</string>\n    <string name=\"convert_string\"\
  >Convert</string>\n    <string name=\"dollars_hint\">dollars</string>\n</resources>\n\
  ```\n\n为了演示资源的作用，将分配给 `convert_string` 的字符串更改为“Convert to Euros”，然后通过选择布局返回布局编辑器。注意布局已获取了字符串的新值。还有一种快速访问\
  \ XML 文件中引用资源的方法。在 `Split` 或 `Code` 模式下，点击 `@string/convert_string` 属性设置，然后按下键盘上的\
  \ `Ctrl-B`（macOS 上为 `Cmd-B`）。Android Studio 随后会打开 `strings.xml` 文件并带您进入定义资源的地方。利用此机会将字符串恢复为原始文本“Convert”，并为稍后引用的资源添加以下条目：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">AndroidSample</string>\n  \
  \  <string name=\"convert_string\">Convert</string>\n    <string name=\"dollars_hint\"\
  >dollars</string>\n    <string name=\"no_value_string\">No Value</string>\n</resources>\n\
  ```\n\n资源字符串也可以通过编辑器窗口右上角的 `Open editor` 链接使用 Android Studio 翻译编辑器进行编辑。这将翻译编辑器显示在\
  \ Android Studio 窗口的主面板中：\n\n![](img/as_translations_editor.jpg)\n\n图 3-25\n\n此编辑器允许编辑分配给资源键的字符串并管理多种语言的翻译。\n\
  \n### 3.9 添加交互\n\n此示例项目的最后一步是使应用程序具有交互性，当用户在输入美元金额并点击转换按钮时，转换后的欧元金额显示在 `TextView`\
  \ 上。这涉及在 `Button` 控件上实现某些事件处理。具体来说，需要配置 `Button` 在触发 `onClick` 事件时调用应用程序代码中的方法。事件处理可以通过多种方式实现，并在稍后的章节\
  \ Android 事件处理概述与示例中介绍。将布局编辑器返回 `Design` 模式，在布局编辑器中选择 `Button` 控件，参考属性工具窗口，并指定命名为\
  \ `convertCurrency` 的方法如下所示：\n\n![](img/as_onclick_attribute.jpg)\n\n图 3-26\n\n\n\
  \n\n\n接下来，双击 Project 窗口中的 `MainActivity.java` 文件（`app -> java -> <package name>\
  \ -> `MainActivity`）将其加载到代码编辑器中，并向类文件中添加 `convertCurrency` 方法的代码，使其读取内容如下。请注意，还需要导入一些额外的\
  \ Android 包：\n\n```java\npackage com.ebookfrenzy.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.view.View;\nimport android.widget.EditText;\n\
  import android.widget.TextView;\n\n.\n.\n\nimport java.util.Locale;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    public void convertCurrency(View view) {\n        EditText dollarText\
  \ = findViewById(R.id.dollarText);\n        TextView textView = findViewById(R.id.textView);\n\
  \        if (!dollarText.getText().toString().isEmpty()) {\n            float dollarValue\
  \ = Float.parseFloat(dollarText.getText().toString());\n            float euroValue\
  \ = dollarValue * 0.85F;\n            textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", euroValue));\n        } else {\n            textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n该方法首先通过调用名为 `findViewById` 方法并传递布局文件中分配的 `id` 来获取 `EditText`\
  \ 和 `TextView` 对象的引用。随后检查用户是否输入了美元金额，如果是，则提取该值将其从 `String` 转换为浮点数并转换为欧元。最后，将结果显示在\
  \ `TextView` 组件上。\n\n如果以上任何内容尚不清楚，请放心，这些概念将在后面的章节中详细介绍。特别是关于在代码中使用 `findByViewId`\
  \ 访问控件的主题，以及对视图绑定（view binding）这一替代技术的介绍，将在“Android View Binding 概述”章节中介绍。\n\n###\
  \ 3.10 总结\n\n虽然并不极端复杂，但设置 Android 开发环境涉及多个步骤。在完成这些步骤后，值得运行一个示例以确保环境已正确安装和配置。在本章中，我们创建了一个示例应用程序，并使用\
  \ Android Studio Layout 编辑器工具修改了用户界面布局。在此过程中，我们探索了尽可能使用资源（特别是字符串值）的重要性，并简要接触了布局。接下来，我们查看了用于存储\
  \ Android 应用程序用户界面设计的底层 XML。\n\n最后，在 `Button` 上添加了 `onClick` 事件，该按钮连接到一个已实现的方法，该方法用于从\
  \ `EditText` 组件中提取用户输入，将其美元转换为欧元，然后将结果显示在 `TextView` 上。\n\n应用程序已准备好进行测试，设置测试用模拟器所需的步骤将在下一章中详细介绍。\n\
  \n## 4. 在 Android Studio 中创建 Android 虚拟设备 (AVD)\n\n尽管 Android Studio 预览面板允许我们看到正在设计的布局，但仍需要编译并运行整个应用才能彻底测试其运行情况。Android\
  \ 应用程序可以通过在物理设备上安装运行进行测试，也可以在 Android 虚拟设备 (AVD) 模拟器环境中进行测试。在使用 AVD 之前，必须先创建它并配置它以匹配特定设备模型的规格。在本章中，我们将以\
  \ Pixel 4 手机作为参考示例，创建一个这样一个虚拟设备。\n\n### 4.1 关于 Android 虚拟设备\n\nAVD 是模拟器，允许在无需将应用程序安装到物理\
  \ Android 设备上的情况下测试 Android 应用程序。AVD 可以被配置为模拟各种硬件功能，包括屏幕尺寸、内存容量，以及是否存在摄像头、GPS 导航支持或加速度计等功能。Android\
  \ Studio 标准安装程序的一部分安装了几个模拟器模板，允许为各种设备配置 AVD。可以通过指定处理器类型、内存容量以及屏幕尺寸和像素密度等属性，创建自定义配置以匹配任何物理\
  \ Android 设备。\n\nAVD 会话可以以独立窗口的形式出现，也可以嵌入在 Android Studio 窗口中。\n\n新的 AVD 使用 Android\
  \ 虚拟设备管理器（Android Virtual Device Manager）进行创建和管理，该管理器可以在命令行模式下使用或配合更符合用户的图形界面使用。创建新\
  \ AVD 的第一步是启动 AVD 管理器。这可以通过 Android Studio 环境内点击右侧工具窗口中的 `Device Manager` 按钮来实现。\n\
  \n### 4.2 启动模拟器\n\n要测试新创建的 AVD 模拟器，请从 `Device Manager` 中选择该模拟器并点击启动按钮（Actions 列中的三角形）。模拟器将嵌入到\
  \ Android Studio 主窗口中并开始启动过程。模拟器启动所需的时间取决于 AVD 的配置以及运行它的系统的配置。\n\n\n\n\n\n虽然模拟器可能默认以竖屏显示，但此及其他默认选项都可以更改。在`Device\
  \ Manager`（设备管理器）中，选择新的 `Pixel 4` 项，并点击设备行`Actions`（操作）列中的铅笔图标。在配置屏幕中，找到`Startup\
  \ orientation`（启动方向）部分并更改方向设置。退出并重启模拟器会话以使此更改生效。关于模拟器的更多细节请参阅下一章节，“使用和配置 Android\
  \ Studio AVD 模拟器”]。\n\n为了在本章的下一节中节省时间，请在继续之前保持模拟器运行状态。\n\n### 4.3 在 AVD 中运行应用程序\n\
  \n配置好 AVD 模拟器后，现在可以对前面的章节中创建的示例应用程序 `AndroidSample` 进行编译和运行。在 `Android Studio` 中加载\
  \ `AndroidSample` 项目，确保新创建的 `Pixel 4` AVD 显示在设备菜单中（见下方图 4-7 中的标记 A），然后点击由三角形表示的运行按钮\
  \ (B)、选择 `Run -> Run ‘app’` 菜单选项，或使用快捷键 `Ctrl-R`：\n\n![](img/as_device_and_run_toolbar.jpg)\n\
  \n图 4-7\n\n设备菜单 (A) 可用于选择不同的 AVD 实例或物理设备作为运行目标，并可以在多个设备上运行应用。该菜单还提供了访问 `Device Manager`\
  \ 以及设备连接配置和故障排除选项的通道：\n\n![](img/as_select_run_device.jpg)\n\n图 4-8\n\n应用程序安装并运行后，第一个\
  \ fragment（碎片）的用户界面将出现在模拟器中（fragment 是 Android 项目中一个可重用的部分，通常由一个用户界面布局和一些代码组成，该主题将在本章标题为“Android\
  \ Fragment 简介”的章节中介绍）：\n\n![](img/as_androidsample_running.jpg)\n\n图 4-9\n\n运行过程开始后将出现\
  \ `Run` 工具窗口。在应用程序包安装和启动时，`Run` 工具窗口将显示诊断信息。图 4-10 显示了典型成功启动应用程序的 `Run` 工具窗口输出：\n\
  \n![](img/as_logcat.jpg)\n\n图 4-10\n\n如果在启动过程中遇到问题，`Run` 工具窗口将提供信息帮助隔离问题原因。\n\n\
  假设应用程序加载到模拟器并按预期运行，我们已经安全地验证了 Android 开发环境已正确安装和配置。在应用运行时，尝试进行货币换算以验证应用是否按预期工作。\n\
  \n### 4.4 在多个设备上运行\n\n上方图 4-8 所示的运行目标菜单包含一个在多个模拟器和设备上并行运行应用的选项。选中该选项后，将显示图 4-11\
  \ 所示的对话框，列出系统上配置的 AVD 以及任何已连接的物理设备。在点击 `Run` 按钮之前，启用目标模拟器或设备旁边的复选框：\n\n![](img/as_avd_multiple_devices.jpg)\n\
  \n图 4-11\n\n点击 `Run` 按钮后，`Android Studio` 将在选定的模拟器和设备上启动应用。\n\n### 4.5 停止运行的应用程序\n\
  \n要停止运行的应用程序，点击主工具栏上的停止按钮，如图 4-12 所示：\n\n![](img/as_stop_button.jpg)\n\n图 4-12\n\
  \n也可以使用 `Run` 工具窗口终止应用。首先通过在应用运行时可用的窗口栏按钮显示 `Run` 工具窗口。一旦 `Run` 工具窗口出现，点击下方图 4-13\
  \ 中高亮显示的停止按钮：\n\n![](img/as_logcat_stop.jpg)\n\n图 4-13\n\n### 4.6 支持深色主题\n\n为了测试应用在启用深色主题时的行为，请在模拟器中运行的\
  \ Android 实例内打开 `Settings`（设置）应用，选择 `Display`（显示）类别，并如图 4-14 所示启用 `Dark theme`（深色主题）选项：\n\
  \n![](img/as_avd_dark_theme_setting.jpg)\n\n图 4-14\n\n启用深色主题后，运行 `AndroidSample`\
  \ 应用，注意它以深色主题显示，包括黑色背景和按钮上的紫色背景，如图 4-15 所示：\n\n![](img/as_androidsample_running_dark.jpg)\n\
  \n图 4-15\n\n在继续之前，返回 `Settings` 应用并关闭 `Dark theme` 模式。\n\n### 4.7 在独立窗口中运行模拟器\n\n\
  到本章为止，我们仅将模拟器作为嵌入在主 `Android Studio` 窗口内的工具窗口使用。可以将模拟器配置为在 `Settings` 对话框中的独立窗口中显示，可以通过点击\
  \ `Android Studio` 工具栏上的 `IDE and Project Settings` 按钮显示该对话框，如图 4-16 所示：\n\n![](img/as_settings.jpg)\n\
  \n图 4-16\n\n在 `Settings` 对话框中，导航到 `Tools -> Emulator`，并禁用 `Launch in Running Devices`\
  \ 选项：\n\n![](img/as_tool_window.jpg)\n\n图 4-17\n\n禁用该选项后，点击 `Apply` 按钮以及 `OK` 提交更改，然后点击图\
  \ 4-5 中的关闭按钮退出模拟器会话。运行一次应用，它将以独立窗口的形式出现，所示：\n\n![](img/as_avd_separate_window.jpg)\n\
  \n图 18\n\n选择独立或工具窗口模式取决于个人喜好。如果你喜欢在工具窗口中运行模拟器，返回设置屏幕并重新启用 `Launch in Running Devices`\
  \ 选项。但在提交独立模式之前，请记住 `Running Devices` 工具窗口也可以从 `Options` 菜单中分离出来，通过点击图 4-19 所示的按钮访问：\n\
  \n![](img/as_running_devices_menu.jpg)\n\n图 4-19\n\n在 `Options` 菜单中，选择 `View Mode\
  \ -> Float` 以将工具窗口从 `Android Studio` 窗口分离：\n\n![](img/as_tool_window_options.jpg)\n\
  \n图 4-20\n\n要重新停靠 `Running Devices` 工具窗口，点击图 4-21 所示的 `Dock` 按钮：\n\n![](img/as_tool_window_dock_button.jpg)\n\
  \n图 4-21\n\n### 4.8 移除设备框\n\n模拟器可以配置为显示或不显示设备框。要更改设置，退出模拟器，打开 `Device Manager`，从列表中\
  \ AVD，并点击图 4-22 中箭头所示的菜单按钮：\n\n![](img/as_device_manager_avd_menu.jpg)\n\n图 4-22\n\
  \n选择 `Edit` 选项，并在设置屏幕找到并关闭 `Enable device frame` 选项，然后点击 `Finish` 按钮：\n\n![](img/as_avd_device_frame_option.jpg)\n\
  \n图 4-23\n\n禁用了设备框后，模拟器在下次启动时将如图 4-24 所示：\n\n![](img/as_avd_no_device_frame.jpg)\n\
  \n图 4-24\n\n### 4.9 总结\n\n\n\n\n\n典型的应用开发过程遵循在测试环境中的编码、编译和运行周期。Android 应用程序可以在物理\
  \ Android 设备或 Android 虚拟设备 (AVD) 模拟器上进行测试。`AVDs` 使用 `Android Studio Device Manager`\
  \ 工具创建和管理，该工具可以作为命令行工具使用，也可以通过图形用户界面使用。在创建 `AVD` 以模拟特定的 Android 设备模型时，应配置虚拟设备与物理设备匹配的硬件规格。\n\
  \n`AVD` 模拟器会可以独立窗口的形式显示，也可以嵌入到 Android Studio 主用户界面中。\n\n## 5. 使用和配置 Android Studio\
  \ AVD 模拟器\n\n在下一章探索在物理 Android 设备上测试之前，本章将花费一些时间提供 Android Studio AVD 模拟器的概述，并重点介绍独立模式和工具窗口模式下自定义环境的许多配置功能。\n\
  \n### 5.1 模拟器环境\n\n当在独立模式下启动时，模拟器会在加载过程中显示初始启动屏幕。加载完成后，会出现主模拟器窗口，其中包含所选设备类型的表示（在图\
  \ 5-1 中，这是一个 Pixel 4 设备）：\n\n![](img/avd_running_standalone.jpg)\n\n图 5-1\n\n位于窗口右边缘的工具栏提供了快速访问模拟器控制和配置选项的快捷。\n\
  \n### 5.2 模拟器工具栏选项\n\n模拟器工具栏 (图 5-2) 提供了与模拟器环境外观和行为相关的系列选项。\n\n![](img/as_3.5_avd_toolbar.jpg)\n\
  \n图 5-2\n\n工具栏中的每个按钮都有关联的键盘加速，可以通过将鼠标指针悬停在按钮上等待工具提示出现来识别，或者通过扩展控制面板的帮助选项来识别。\n\n\
  尽管工具栏中的许多选项是自言自明的，但为了完整起见，将涵盖每个选项：\n\n* **退出 / 最小化 (Exit / Minimize)** – 工具中最顶部的“x”按钮在选中时会退出模拟器会话，而“-”选项会最小化整个窗口。\n\
  * **电源 (Power)** – `Power` 按钮模拟物理 Android 设备上的硬件电源按钮。点击并释放此按钮将锁定设备并关闭屏幕。按住此按钮将启动设备“关机”请求序列。\n\
  * **音量增大 / 缩小 (Volume Up / Down)** – 两个控制模拟器环境内播放音频音量的按钮。\n* **左旋转/右旋转 (Rotate Left/Right)**\
  \ – 模拟设备在竖屏和横屏方向之间旋转。\n* **截图 (Take Screenshot)** – 对设备屏幕上显示的内容截图。截取的图像存储在扩展控制面板\
  \ `Settings` 屏幕指定的路径，如本章稍后概述。\n* **缩放模式 (Zoom Mode)** – 此按钮切换进入和退出缩放模式，细节将在本章稍后介绍。\n\
  * **返回 (Back)** 执行标准的 Android“返回”导航以返回上一个屏幕。\n* **首页 (Home)** 显示设备的主屏幕。\n* **总览\
  \ (Overview)** – 模拟标准的 Android“总览”导航，显示设备上正在运行的应用。\n* **折叠设备 (Fold Device)** – 模拟折叠设备的折叠和展开。此选项仅在模拟器运行折叠设备系统镜像时可用。\n\
  * **扩展控制 (Extended Controls)** – 显示扩展控制面板，允许配置如模拟位置和电话活动、电池强度、移动网络类型和指纹识别等选项。\n\n\
  ### 5.3 在缩放模式下工作\n\n模拟器工具栏上的缩放按钮切换进入和退出缩放模式。当缩放模式激活时，工具栏按钮被按下，当鼠标指针悬停在设备屏幕上时将显示为放大镜。点击鼠标左键将导致显示相对于屏幕上的选定点进行放大，重复点击将增加缩放级别。相反，点击鼠标右键会降低缩放级别。关闭缩放按钮将显示恢复到默认大小。\n\
  \n在缩放模式下点击并拖动将定义一个矩形区域，释放鼠标按钮时视图将缩放到该区域。\n\n在缩放模式下，可以使用模拟器窗口内的水平和垂直滚动条对屏幕可视区域进行移动。\n\
  \n### 5.4 调整模拟器窗口大小\n\n模拟器窗口的大小（以及设备相应表示）可以通过启用缩放模式并在窗口的任何角或侧边点击并拖动随时更改。\n\n###\
  \ 5.5 扩展控制选项\n\n扩展控制工具栏按钮显示图 5-3 所示的面板。默认情况下将显示位置设置。从左侧面板选择不同的类别将显示相应的控制组：\n\n![](img/as_avd_extended_controls.jpg)\n\
  \n图 5-3\n\n#### 5.5.1 位置\n\n位置控制允许以十进制或六进制坐标将模拟位置信息发送到模拟器。位置信息可以是单个位置或代表设备移动的点序列，后者通过\
  \ GPS Exchange (GPX) 或 Keyhole Markup Language (KML) 格式的文件提供。或者，可以使用集成的 Google Maps\
  \ 面板视觉化地选择单点或路线。\n\n#### 5.5.2 显示\n\n除了模拟器屏幕内显示的主显示外，`Displays`选项允许在相同的 Android\
  \ 实例中运行额外的显示器。这对于测试如 Microsoft Surface Duo 等双屏设备的应用非常有用。这些额外的屏幕可以配置为所需的尺寸，并与主屏幕在同一个模拟器窗口中显示。\n\
  \n#### 5.5.3 移动网络\n\n可以在移动设置中更改模拟的移动连接类型。提供了选项来模拟不同的网络类型（CSM、EDGE、HSDPA 等）以及一系列语音和数据场景，例如漫游和被拒绝访问。\n\
  \n#### 5.5.4 电池\n\n可以在扩展控制屏幕的此面板上模拟各种电池状态和充电条件，包括电池电量、电池健康以及当前是否连接了交流充电器。\n\n###\
  \ 5.5.5 摄像头\n\n当摄像头激活时，模拟器会模拟 3D 场景。这表现为虚拟建筑的内部，在模拟器内录制视频或拍照之前，可以通过按住 Option 键（Windows\
  \ 上的 Alt）同时使用鼠标指针和键盘键在此进行导航。此扩展配置选项允许上传不同的图像以显示在虚拟环境中。\n\n#### 5.5.6 电话\n\n电话扩展控制在模拟器内提供了两个简单直接但实用的模拟。第一个选项模拟来自指定电话号码的入入电话。这在测试应用如何处理高级中断时特别有用。\n\
  \n第二个选项允许在模拟器会话中模拟接收短信。与真实世界一样，这些消息将出现在消息应用中，并触发模拟器内的标准通知。\n\n#### 5.5.7 方向键\n\n\
  方向键 (D-Pad) 是内置在 Android 设备中或外部连接（如游戏控制器）的额外控制组，提供方向控制（左、右、上、下）。方向键设置允许在模拟器内模拟 D-Pad\
  \ 交互。\n\n#### 5.5.8 麦克风\n\n\n\n\n\n麦克风设置允许启用麦克风，并模拟虚拟耳机和麦克风连接。还提供了一个按钮，用于在模拟器上启动语音助手。\n\
  \n#### 5.5.9 指纹\n\n许多 Android 设备现在都配备了内置指纹检测硬件。AVD 模拟器使得你无需在带有指纹传感器的物理设备上测试应用，即可进行指纹身份验证测试。本章稍后将介绍在模拟器中配置指纹测试的细节。\n\
  \n#### 5.5.10 虚拟传感器\n\n虚拟传感器选项允许模拟加速度计和磁力计，以模拟设备的物理运动，例如通过偏航（yaw）、俯仰（pitch）和滚滚（roll）设置来实现旋转、移动和倾斜。\n\
  \n#### 5.5.11 快照\n\n快照包含当前运行 AVD 会话的状态以便保存并快速恢复，从而轻松让模拟器恢复到精确的状态。快照将在本章稍后介绍。\n\n\
  #### 5.5.12 录制与播放\n\n允许录制模拟器的屏幕和音频，并以 WebM 或动画 GIF 格式保存。\n\n#### 5.5.13 Google Play\n\
  \n如果模拟器运行的是安装了 Google Play 服务的 Android 版本，此选项将显示当前的 Google Play 版本。它还提供了将模拟器更新到最新版本的选项。\n\
  \n#### 5.5.14 设置\n\n设置面板提供了一组配置选项。使用此面板为工具栏和扩展控制面板选择更深色的主题，指定用于保存截图的文件系统位置，配置 OpenGL\
  \ 支持级别，并配置模拟器窗口显示在桌面上其他窗口之上。\n\n#### 5.5.15 帮助\n\n帮助屏幕包含三个子面板，分别包含键盘快捷键列表、访问模拟器在线文档的链接、报告\
  \ bug 和发送反馈的链接，以及模拟器版本信息。\n\n### 5.6 使用快照\n\n当模拟器首次启动时，它会执行冷启动，就像物理 Android 设备开机一样。由于需要加载操作系统并启动所有后台进程，冷启动过程可能需要一些时间才能完成。为了避免每次启动模拟器时都经历这一过程，系统配置为在每次退出时自动保存一份模拟器当前状态的快照（称为快速启动快照）。下次启动模拟器时，快速启动快照将加载到内存中，并从上次停止的地方继续执行，允许模拟器在冷启动所需时间的一小部分内重启。\n\
  \n扩展控制面板的快照屏幕可以在模拟器执行期间的任何点存储额外的快照。这保存了整个模拟器的精确状态，允许模拟器恢复到拍摄快照时的精确时间点。在屏幕中，可以使用\
  \ `Take Snapshot` 按钮（如图 5-4 中的 A 所示）拍摄快照。要恢复现有快照，请从列表中选择它 (B)，并点击屏幕底部的 `run` 按钮\
  \ (C)。还提供了选项来编辑 (D) 快照名称和描述，并删除 (E) 当前选中的快照：\n\n![](img/as_avd_snapshots.jpg)\n\n\
  图 5-4\n\n你还可以通过从主工具栏的运行目标菜单中进行选择，决定使用冷启动、最近的快速启动快照或之前的快照来启动模拟器，如图图 5-5 所示：\n\n![](img/as_avd_run_snapshot.jpg)\n\
  \n图 5-5\n\n### 5.7 配置指纹仿真\n\n模拟器允许配置最多 10 个模拟指纹，用于测试 Android 应用中的指纹身份验证。配置模拟指纹的第一步是启动模拟器，打开\
  \ `Settings` 应用，并选择 `Security` 选项。\n\n在 `Security` 设置屏幕中，选择 `fingerprint` 选项。在出现的信息屏幕上，点击\
  \ `Next` 按钮进入指纹设置屏幕。在启用指纹安全之前，必须配置备用屏幕解锁方法（例如 `PIN`）。输入并确认合适的 `PIN`，并通过接受默认通知选项完成\
  \ PIN 输入过程。\n\n继续通过剩余屏幕，直到 `Settings` 应用请求在传感器上的指纹。此时，显示扩展控制对话框，在左侧面板中选择 `Fingerprint`\
  \ 类别，并确保主设置面板中选中了 `Finger 1`：\n\n![](img/as_avd_touch_sensor.jpg)\n\n图 5-6\n\n点击\
  \ `Touch Sensor` 按钮模拟 `Finger 1` 触摸指纹传感器。模拟器将报告指纹添加成功：\n\n![](img/as_avd_fingerprint_added.jpg)\n\
  \n图 5-7\n\n要添加更多指纹，在再次点击 `Touch Sensor` 按钮之前，在扩展控制面板菜单中点击 `Add Another` 按钮并选择另一个手指。\n\
  \n### 5.8 工具窗口模式下的模拟器\n\n如上一章（在 Android Studio 中创建 Android 虚拟设备 (AVD)）所述，Android\
  \ Studio 可以配置为在嵌入工具窗口中启动模拟器，使其不会出现在独立窗口中。当在此模式下运行时，工具栏将提供与独立模式相同的控制按钮，如图图 5-8 所示：\n\
  \n![](img/avd_running_devices_toolbar.jpg)\n\n图 5-8\n\n从左到右，这些按钮执行以下任务（详细信息与独立模式一致）：\n\
  \n- `Power`（电源）\n- `Volume Up`（音量上）\n- `Volume Down`（音量减）\n- `Rotate Left`（左旋转）\n\
  - `Rotate Right`（右旋转）\n- `Back`（返回）\n- `Home`（主页）\n- `Overview`（总览）\n- `Screenshot`（截图）\n\
  - `Snapshots`（快照）\n- `Extended Controls`（扩展控制）\n\n### 5.9 创建可调整大小的模拟器\n\n除了配置特定设备模型的模拟器外，Android\
  \ Studio 还提供了可调整大小的 AVD，允许你在手机、平板和平折叠设备尺寸之间进行切换。要创建一个可调整大小的模拟器，打开 `Device Manager`\
  \ 并点击 `+` 按钮。接下来，选择如图图 5-9 所示的 `Resizable` 设备定义，并按照通常步骤创建新的 AVD：\n\n![](img/avd_create_resizable.jpg)\n\
  \n图 5-9\n\n当你在工具窗口中运行应用时，工具栏中会出现 `Display` 选项，允许你在模拟器配置之间进行切换，如图图 5-10 所示：\n\n![](img/as_avd_fold_button.jpg)\n\
  \n图 5-10\n\n如果模拟器在独立模式下运行，可以在侧边工具栏中找到 `Display` 选项，如下：\n\n![](img/avd_resizable_menu.jpg)\n\
  \n图 5-11\n\n一旦选择了折叠显示模式，可以使用 `Change posture` 菜单测试应用在打开、关闭和半开合配置下的表现：\n\n![](img/as_avd_posture.jpg)\n\
  \n图 5-12\n\n### 5.10 总结\n\nAndroid Studio 包含一个 Android 虚拟设备模拟器环境，旨在无需在物理 Android\
  \ 设备上运行程序即可进行测试。本章对模拟器进行了简要介绍，并强调了用于配置和自定义环境以模拟不同测试条件的关键功能。\n\n## 6. Android Studio\
  \ 用户界面概览\n\n虽然急于运行上一章创建的示例应用，但它涉及 Android Studio 用户界面的某些方面，最好预先对这些内容进行描述。\n\n\n\n\
  \n`Android Studio` 是一个强大且功能丰富的开发环境，在很大程度上，它的使用非常直观。尽管如此，现在花时间熟悉 Android Studio 用户界面的布局和组织结构，将缩短本书后续章节的学习曲线。基于此，本章将提供\
  \ Android Studio 环境中各个区域和组件的概览。\n\n### 6.1 欢迎界面\n\n欢迎界面（图 6-1）在 Android Studio 运行但当前没有打开任何项目时显示（可以通过选择\
  \ `File` -> `Close Project` 菜单选项随时关闭已打开的项目）。如果之前在项目仍处于打开状态时就直接退出了 Android Studio，则该工具在下次启动时将跳过欢迎界面，自动打开之前活跃的项目。\n\
  \n![](img/as_iguana_welcome2.jpg)\n\n图 6-1\n\n除了最近项目列表外，欢迎界面还提供了执行任务的选项，例如打开和创建项目，并可以访问当前受版本控制的项目。此外，`Customize`（自定义）界面提供了更改\
  \ IDE 和编辑器均用的主题设置和字体设置的选项。可以使用 `Plugins`（插件）选项查看、安装和管理 Android Studio 插件。\n\n通过选择\
  \ `More Actions`（更多操作）链接，或者当最近项目列表取代 `More Actions` 链接时使用`图 6-2`所示的菜单，可以获得更多选项：\n\
  \n![](img/as_welcome_menu.jpg)\n\n图 6-2\n\n### 6.2 菜单栏\n\n当创建新项目或打开现有项目时，将出现 Android\
  \ Studio 的主窗口。当同时打开多个项目时，每个项目都将分配到其自己的主窗口。窗口的精确配置取决于 Android Studio 运行的操作系统，以及上次打开项目时显示了哪些工具和面板。例如，主菜单栏的外观取决于宿主机操作系统。在\
  \ macOS 上，Android Studio 遵循标准惯，将菜单栏放置在桌面的顶部，如`图 6-3`所示：\n\n![](img/as_menu_bar.jpg)\n\
  \n图 6-3\n\n然而，当 Android Studio 运行在 Windows 或 Linux 上时，可以通过`图 6-4`中高亮显示的按钮访问主菜单：\n\
  \n![](img/as_windows_main_menu.jpg)\n\n图 6-4\n\n### 6.3 主窗口\n\n一旦打开项目，Android Studio\
  \ 的主窗口通常类似于`图 6-5`所示：\n\n![](img/as_main_window1.jpg)\n\n图 6-5\n\n主窗口的各种元素可以总结如下：\n\
  \n**A – 工具栏（Toolbar）** – 一组用于频繁执行的操作的快捷键。工具栏按钮提供了快速访问一组菜单栏操作的通道。可以通过右键点击工具栏并选择 `Customize\
  \ Toolbar…`（自定义工具栏）菜单选项来自定义工具栏。`图 6-6`所示的工具栏菜单提供了执行诸如创建和打开项目以及在多个项目打开时进行窗口切换的方便方法：\n\
  \n![](img/as_project_switch_menu.jpg)\n\n图 6-6\n\n**B – 导航栏（Navigation Bar）** –\
  \ 导航栏提供了一种在构成项目的文件和文件夹之间移动的方便方法。点击导航栏中的元素将弹出一个菜单，列出该位置的子文件夹和文件以供选择。同样，点击类名将显示列出该类中包含方法的菜单：\n\
  \n![](img/as_navigation_menu.jpg)\n\n图 6-7\n\n从列表中选择一个方法将跳转到代码编辑器中相应的位置。你可以使用 `View`\
  \ -> `Appearance` -> `Navigation Bar` 菜单选项来隐藏、显示和更改此栏的位置。\n\n**C – 编辑器窗口（Editor\
  \ Window）** – 编辑器窗口显示开发者当前正在工作的文件内容。当打开多个文件时，每个文件都由位于编辑器顶部的标签页表示，如`图 6-8`所示：\n\n\
  ![](img/as_menu_bar_java.jpg)\n\n图 6-8\n\n**D – 状态栏（Status Bar）** – 状态栏显示有关项目和 Android\
  \ Studio 活动的提示消息。悬停在状态栏项目上将显示该字段的描述。许多字段是可交互的，允许用户点击以执行任务或获取更详细的状态信息。\n\n![](img/as_status_bar.jpg)\n\
  \n图 6-9\n\n状态栏中显示的组件可以使用 `View` -> `Appearance` -> `Status Bar Widgets` 菜单进行更改。\n\
  \n**E – 项目工具窗口（Project Tool Window）** – 项目工具窗口提供了项目文件结构的分级概览，允许执行到特定文件和文件夹的导航。工具栏可以使用几种不同的方式显示项目。默认设置是\
  \ `Android view`（Android 视图），这是本书余部分中主要使用的模式。\n\n项目工具窗口只是 Android Studio 环境中众多工具之一。\n\
  \n### 6.4 工具窗口（Tool Windows）\n\n除了项目视图工具窗口外，Android Studio 还包含许多其他窗口，这些窗口在启用时会沿主窗口的左右边缘显示工具窗口栏，并包含显示和隐藏每个工具窗口的按钮。`图\
  \ 6-10`显示了典型的工具窗口栏配置，尽管按钮可能有所不同。\n\n![](img/tool_window_bars.jpg)\n\n图 6-10\n\n\
  点击按钮将显示相应的工具窗口，再次点击则将隐藏窗口。按钮在工具窗口栏中的位置指示了窗口出现的一侧。这些位置可以通过点击并拖动按钮来更改。\n\nAndroid\
  \ Studio 提供了大量的工具窗口，常用的如下：\n\n- **Project（项目）A** – 项目视图提供了项目文件结构的概览，允许在文件之间进行快速导航。通常，双击项目视图中的文件会将该文件加载到相应的编辑器中。\n\
  - **Resource Manager（资源管理器）B** – 用于添加和管理项目中的资源和资产，例如图像、颜色布局文件。\n- **More Tool Windows（更多工具窗口）C**\
  \ – 显示未显示在工具窗口栏中的其他工具窗口的菜单。从此菜单选择工具窗口，它将作为按钮出现在工具窗口栏中。\n- **Run（运行）D** – 运行工具窗口在应用程序运行时变为可用，并提供运行结果视图以及停止或重启运行进程的选项。如果应用程序无法在设备或模拟器上安装和运行，此窗口通常会提供有关问题的诊断信息。\n\
  - **Logcat E** – Logcat 工具窗口提供了访问运行应用程序监控日志输出的权限，并提供了获取应用程序截图和视频以及停止和重启进程的选项。\n\
  - **Problems（问题）F** – 一个查看项目内所有当前错误或警告的集中位置。双击问题列表中的项将带你进入问题所在所在位置。\n- **App Quality\
  \ Insights（应用质量洞察）G** – 提供访问云端 Firebase 应用质量和崩溃分析平台。\n- **Terminal（终端）H** – 提供访问运行\
  \ Android Studio 的系统上的终端窗口的权限。\n\n\n\n\n\n- **版本控制 (I)** - 当项目文件受源代码版本控制管理时，使用此工具窗口，允许访问\
  \ Git 仓库和代码更改历史。\n- **通知 (J)** - 当项目文件受源代码版本控制管理时，使用此工具窗口，允许访问 Git 仓库和代码更改历史。\n\
  - **Gradle (K)** – `Gradle` 工具窗口提供了项目构建配置的 `Gradle` 任务视图。该窗口列出了将项目各种元素编译为可执行应用程序所需的任务。右键点击顶级\
  \ `Gradle` 任务并选择 `Open Gradle Config`（打开 Gradle 配置）菜单选项，可以将当前项目的 `Gradle` 构建文件加载到编辑器中。本书稍后将更详细介绍\
  \ `Gradle`。\n- **设备管理器 (L)** - 提供访问 `Device Manager`（设备管理器）工具窗口，可以在其中添加、删除和管理物理\
  \ Android 设备连接和模拟器。\n- **运行中的设备 (M)** - 如果已启用在工具窗口中运行模拟器的选项，则该窗口包含 AVD 模拟器，详参见章节“在\
  \ Android Studio 中创建 虚拟设备 (AVD)”。\n- **应用检查 (App Inspection)** - 提供访问 `Database`（数据库）和\
  \ `Background Task`（后台任务）检查器的权限。`Database Inspector` 允许你在应用运行时检查、查询和修改应用数据库。`Background\
  \ Task Inspector` 允许监控和管理使用 `WorkManager` 创建的后台工作任务。\n- **书签 (Bookmarks)** – `Bookmarks`\
  \ 工具窗口提供了快速访问已书签的文件和代码行。例如，在项目视图中右键点击文件可以访问 `Add to Bookmarks`（添加到书签）菜单选项。同样，可以通过将光标移动到源文件的某行并按\
  \ `F11` 键（macOS 上为 `F3`）来标记代码行。所有书签项都可以此工具窗口访问。\n- **构建 (Build)** - `build` 工具窗口显示项目编译打包期间构建过程的信息，以及遇到的任何错误的详情信息。\n\
  - **构建变体 (Build Variants)** – 构建变体工具窗口为当前应用程序项目配置不同的构建目标提供了快捷方法（例如，针对应用程序调试和发布版本的不同构建，或针对不同设备类别的多个构建）。\n\
  - **设备文件管理器 (Device File Explorer)** - 通过 `View -> Tool Windows -> Device File Explorer`\
  \ 菜单可用，此工具窗口提供了访问当前连接的 Android 设备或模拟器文件系统的权限，允许浏览文件系统并将文件复制到本地文件系统。\n- **布局检查器 (Layout\
  \ Inspector)** - 提供构成用户界面布局的组件层次的可视化 3D 渲染。\n- **结构 (Structure)** – 结构工具提供了当前编辑器中显示的源文件结构的高级视图。此信息包含了文件中的类、方法和变量等项的列表。从结构列表中选择一个项将带你跳转到编辑器窗口中源文件的对应位置。\n\
  - **TODO** – 如名所示，此工具提供了一个查看项目中尚未完成的项的地方。`Android Studio` 通过扫描组成项目的源文件查找与指定 `TODO`\
  \ 模式匹配的注释来编译此列表。可以通过打开 `Settings`（设置）对话框并导航到 `Editor` 下的 `TODO` 项目来查看和更改这些模式。\n\n\
  ### 6.5 工具窗口菜单\n\n每个工具窗口在顶部边缘都有自己的工具栏。这些工具栏中的菜单按钮随工具的不同而异，尽管所有工具窗口都包含一个 `Options`（选项）菜单（在图\
  \ 6-11 中标记为 `A`）：\n\n![](img/as_tool_window_buttons.jpg)\n\n图 6-11\n\n`Options`\
  \ 菜单允许更改窗口的各个方面。例如图 6-12 显示了 `Project`（项目）工具窗口的 `Options` 菜单。可以使用 `Settings`（设置）取消窗口停靠并使其浮动在\
  \ `Android Studio` 主窗口边界之外，以及移动和调整工具面板的大小：\n\n![](img/as_tool_window_menu.jpg)\n\
  \n图 6-12\n\n所有工具窗口的工具栏上还包含一个最右侧按钮（在上述图 6-11 中标记为 `B`），提供了隐藏工具窗口的额外方法。可以通过点击该窗口使其聚焦，然后输入搜索词（例如\
  \ `Project` 工具窗口中的文件名）对工具窗口内的项进行搜索。窗口工具栏中将出现一个搜索框，并高亮显示匹配搜索词的项。\n\n### 6.6 Android\
  \ Studio 快捷键\n\n`Android Studio` 包含了许多快捷键以便在执行常用任务时节省时间。可以在 `Android Studio` 项目窗口内选择\
  \ `Help -> Keyboard Shortcuts PDF` 菜单选项来查看并打印完整的快捷键映射列表。你也可以通过打开 `Settings` 对话框并点击\
  \ `Keymap` 项来列出和修改快捷键，如下图 6-13 所示：\n\n![](img/as_keymap.jpg)\n\n图 6-13\n\n### 6.7\
  \ 切换器和最近文件导航\n\n在 `Android Studio` 主窗口内导航的另一种实用机制是使用 `Switcher`（切换器）。通过键盘快捷键 `Ctrl-Tab`\
  \ 访问切换器，切换器显示为一个列出工具窗口和当前打开文件的面板（图 6-14）。\n\n![](img/as_switcher.jpg)\n\n图 6-14\n\
  \n只要按下 `Ctrl` 键，切换器就会保持显示。在按下 `Ctrl` 键的同时反复按 `Tab` 键可以在切换选项之间循环。\n\n除了 `Switcher`\
  \ 外，`Recent Files`（最近文件）面板提供了对最近文件的导航（图 6-15）。可以通过 `Ctrl-E` 快捷键（macOS 上为 `Cmd-E`）访问。显示后，可以使用鼠标指针选择选项，或使用键盘方向键滚动列表。按下\
  \ `Enter` 键将选择当前高亮的项：\n\n![](img/as_recent_files.jpg)\n\n图 6-15\n\n### 6.8 修改 Android\
  \ Studio 主题\n\n可以使用 `Settings` 对话框更改 `Android Studio` 环境的整体主题。显示对话框后，选择左侧面板中的 `Appearance\
  \ & Behavior`（外观与行为），然后是 `Appearance`（外观）。在点击 `OK` 按钮之前更改 `Theme` 菜单设置。可用主题取决于平台，图\
  \ 6-16 显示了选择 `Dark` 主题的主窗口示例：\n\n![](img/as_dark_theme.jpg)\n\n图 6-16\n\n要将 `Android\
  \ Studio` 主题与操作系统的亮/深色模式同步，请启用 `Sync with OS` 选项并使用下拉菜单控制每模式下使用的主题：\n\n![](img/as_theme_sync.jpg)\n\
  \n图 6-17\n\n### 6.9 总结\n\n`Android Studio` 环境的主要元素包括欢迎界面和主窗口。每个打开的项目都分配了自己的主窗口，主窗口又包含菜单栏、工具栏、编辑和设计区域、状态栏以及一组工具窗口。工具窗口位于主窗口侧边。\n\
  \n`Android Studio` 中几乎没有操作是无法通过快捷键触发的。可以随时从 `Android Studio` 主窗口内访问默认快捷键映射。\n\n\n\
  \n\n虽然使用 Android 虚拟设备 (AVD) 测试应用程序可以实现许多功能，但在物理 Android 设备上进行真实世界的应用测试是不可比拟的，而且某些\
  \ Android 功能仅在物理 Android 设备上可用。\n\n与 AVD 实例和连接的 Android 设备之间的通信均通过 Android 调试桥 (ADB)\
  \ 处理。本章解释了如何在 macOS、Windows 和基于 Linux 的系统中配置 `adb` 环境，以便在 Android 设备上进行应用程序测试。\n\
  \n## 7.1 Android 调试桥 (ADB) 概述\n\n`ADB` 的主要目的是方便开发系统（在此例为 Android Studio）与 AVD 模拟器以及\
  \ Android 设备之间的交互，以便运行和调试应用程序。`ADB` 允许你通过 WiFi 或 USB 线连接到设备。\n\n`ADB` 由客户端、一个在开发系统后台运行的服务器进程以及一个在\
  \ AVD 或真实的 Android 设备（如手机和平板）上运行的后台守护进程组成。\n\n`ADB` 客户端有多种形式。例如，在 Android SDK `platform-tools`\
  \ 子目录下提供了一个名为 `adb` 的命令行工具客户端。同样，Android Studio 也有内置的客户端。\n\n可以使用 `adb` 命令行工具执行各种任务。例如，可以使用\
  \ `devices` 命令行参数列出活跃的虚拟或物理设备。以下命令输出表示系统上存在一个 AVD 但没有物理设备：\n\n```bash\n$ adb devices\n\
  List of devices attached\nemulator-5554 device\n```\n\n### 7.2 在 Android 设备上启用 USB\
  \ 调试 ADB\n\n在 `ADB` 连接到 Android 设备之前，该设备必须配置为允许连接。在运行 Android 6.0 或更高版本的手机和平板电脑设备上，实现此目的的步骤如下：\n\
  \n1. 打开设备上的 `Settings`（设置）应用并选择 `About tablet`（关于平板）或 `About phone`（关于手机）选项（在某些\
  \ Android 版本中，可以在 `Settings` 应用的 `System` 页面找到）。\n2. 在 `About` 屏幕上滚动到 `Build number`（版本号）字段（图\
  \ 7-1）并点击七次，直到消息显示已启用开发者模式。如果 `About` 屏幕上列出 `Build number`，则可以通过 `Software information`（软件信息）选项找到。或者，如果可用，展开列表的\
  \ `Advanced`（高级）部分。\n\n![](img/as_3.2_build_number.jpg)\n图 7-1\n\n3. 返回 `Settings`\
  \ 主屏幕，注意出现名为 `Developer options`（开发者选项）的新选项（在较新版本的 Android 中，此选项列在 `System` 设置屏幕上）。选择此选项，并在生成的屏幕上，找到如图\
  \ 7-2 所示的 `USB debugging`（USB 调试）选项：\n\n![](img/android_12_enable_debugging.jpg)\n\
  图 7-2\n\n4. 启用 `USB debugging` 并在请求确认时点击 `Allow`（允许）按钮。\n\n如果你使用三星 Galaxy 设备，可能需要在启用调试选项之前在\
  \ `Settings` 应用中关闭 `Auto Blocker`（自动锁定）功能。\n\n现在设备已配置为通过 USB 连接接受来自开发系统 `adb` 的调试连接。剩下的只需配置开发系统在设备连接时检测到设备。虽然这是一个相对简单的过程，但步骤取决于开发系统运行的是\
  \ Windows、macOS 还是 Linux。请注意，以下步骤假设 Android SDK `platform-tools` 目录已包含在操作系统的 `PATH`\
  \ 环境变量中，正如标题为设置 Android Studio 开发环境的章节描述的那样。\n\n#### 7.2.1 macOS ADB 配置\n\n要在 macOS\
  \ 系统上配置 `ADB` 环境，请使用 USB 线将设备连接到计算机系统，打开终端窗口并执行以下命令以重启 `adb` 服务器：\n\n```bash\n$\
  \ adb kill-server\n$ adb start-server\n* daemon not running. starting it now on\
  \ port 5037 *\n* daemon started successfully *\n```\n\n一旦服务器成功运行，执行以下命令以验证设备是否已检测：\n\
  \n```bash\n$ adb devices\nList of devices attached\n74CE000600000001 offline\n```\n\
  \n如果设备被列为 `offline`（离线），请前往 Android 设备并检查如图 7-3 所示请求 `Allow USB debugging`（允许 USB\
  \ 调试）权限的对话框。在点击 `OK` 之前，勾选 `Always allow from this computer`（始终允许来自此计算机）旁边的复选框。\n\
  \n![](img/Image2856.jpg)\n图 7-3\n\n现在执行 `adb devices` 命令应该列出设备可用：\n\n```text\nList\
  \ of devices attached\n015d41d4454bf80c device\n```\n\n如果设备未列出，尝试注销并重新登录 macOS 桌面，如果问题仍然存在重启系统。\n\
  \n#### 7.2.2 Windows ADB 配置\n\n配置 Windows 开发系统使用 `ADB` 连接到 Android 设备的第一步是在系统上安装相应的\
  \ USB 驱动程序。要安装的 USB 驱动取决于 Android 设备的型号。如果你有 Pixel 手机等 Google 设备，则需要在你的 Windows\
  \ 系统上安装并配置 `Google USB Driver` 程序包。实现此目的的详细步骤概述在以下网页：\n\n[`developer.android.com/sdk/win-usb.html`](https://developer.android.com/sdk/win-usb.html)\n\
  \n对于不支持 Google USB 驱动的 Android 设备，需要下载设备制造商提供的驱动程序。驱动列表以及安装信息可以在此处获取：\n\n[`developer.android.com/tools/extras/oem-usb.html`](https://developer.android.com/tools/extras/oem-usb.html)\n\
  \n驱动程序安装且设备识别为正确类型后，打开命令提示符窗口并执行以下命令：\n\n```bash\nadb devices\n```\n\n该命令应输出连接设备的信息：\n\
  \n```text\nList of devices attached\nHT4CTJT016 offline\n```\n\n如果设备列为 `offline`\
  \ 或 `unauthorized`（未授权），请查看设备屏幕并检查请求允许调试的对话框。在点击 `OK` 之前，勾选 `Always allow from this\
  \ computer` 旁边的复选框。重复执行 `adb devices` 命令现在应该列出设备就绪：\n\n```text\nList of devices\
  \ attached\nHT4CTJT016 device\n```\n\n如果设备未列出，执行以下命令重启 ADB 服务器：\n\n```bash\nadb\
  \ kill-server\nadb start-server\n```\n\n如果设备仍然未列出，尝试执行以下命令：\n\n```bash\nandroid\
  \ update adb\n```\n\n注意，可能还需要重启系统。\n\n#### 7.2.3 Linux ADB 配置\n\n在本章中，我们再次使用 Ubuntu\
  \ Linux 作为示例，在 Linux 上配置 `adb` 连接到物理 Android 设备进行应用程序测试。\n\n在 Ubuntu Linux 上进行物理测试需要安装名为\
  \ `android-tools-adb` 的包，该包要求 Android Studio 用户是 `plugdev` 组的成员。这是大多数 Ubuntu 版本用户账户的默认设置，可以通过运行\
  \ `id` 命令进行验证。如果没有列出 `plugdev` 组，请运行以下命令将账户添加到该组：\n\n```bash\nsudo usermod -aG plugdev\
  \ $LOGNAME\n```\n\n满足组权限要求后，可以通过执行以下命令安装 `android-tools-adb` 包：\n\n```bash\nsudo\
  \ apt-get install android-tools-adb\n```\n\n完成上述更改后，重启 Ubuntu 系统。系统重启后，打开终端窗口，启动\
  \ `adb` 服务器并检查连接的设备列表：\n\n```bash\n$ adb start-server\n* daemon not running. starting\
  \ it now on port 5037 *\n* daemon started successfully *\n\n$ adb devices\n```\n\
  \n\n\n\n\n015d41d4454bf80c 离线\n\n如果设备显示为离线（offline）或未授权（unauthorized），请检查 Android\
  \ 设备并查看图 7-3 所示的请求允许 USB 调试的对话框。\n\n### 7.3 解决 USB 连接问题\n\n若您无法通过上述步骤成功连接到设备，请显示运行目标菜单（图\
  \ 7-4）并选择`Troubleshoot Device Connections（排除设备连接）选项：\n\n![](img/as_troubleshoot_device_connections.jpg)\n\
  \n图 7-4\n\n连接助手将扫描设备并报告问题及解决方案。\n\n### 7.4 在 Android 设备上启用无线调试\n\n按照上述第 7.2 节的第\
  \ 1 至 3 步操作，这次启用如图 7-5 所示的`Wireless Debugging（无线调试）选项：\n\n![](img/android_12_enable_wifi_debugging.jpg)\n\
  \n图 7-5\n\n接下来，点击上面的`Wireless debugging`条目以显示图 7-6 所示的屏幕：\n\n![](img/android_12_enable_wifi_debugging_settings.jpg)\n\
  \n图 7-6\n\n如果您的设备带有摄像头，选择`Pair device with QR code（用二维码配对设备）`，否则选择`Pair device with\
  \ pairing code（用配对码配对设备）`选项。根据您的选择，“Settings（设置）”应用将启动摄像头会话或显示配对码，如图 7-7 所示：\n\n\
  ![](img/as_pair_devices_code.jpg)\n\n图 7-7\n\n选中选项后，返回 Android Studio，从运行目标菜单选择`Pair\
  \ Devices Using WiFi（通过 WiFi 配对设备）`选项，如图 7-8 所示：\n\n![](img/as_pair_using_wifi.jpg)\n\
  \n图 7-8\n\n在配对对话框中，根据您之前在设备“设置”应用中的选择，选择`Pair using QR code（用二维码配对）`或`Pair using\
  \ pairing code（用配对码配对）`：\n\n![](img/as_pair_using_wifi_qr_code.jpg)\n\n图 7-9\n\n\
  使用 Android 设备扫描二维码或将设备屏幕上显示的配对码输入 Android Studio 对话框中（图 7-10），以完成配对过程：\n\n![](img/as_pair_devices_wifi_enter_code.jpg)\n\
  \n图 7-10\n\n如果配对过程失败，请尝试重启开发系统和 Android 设备并重试。\n\n### 7.5 测试 adb 连接\n\n假设在所选开发平台上已成功配置了`adb`，下一步是尝试在设备上运行名为在\
  \ Android Studio 中创建示例 Android 应用章节中创建的测试应用程序。启动 Android Studio，打开`AndroidSample`项目，并验证设备是否出现在图\
  \ 7-11 所示的设备选择菜单中：\n\n![](img/as_run_on_device.jpg)\n\n图 7-11\n\n从列表中选择设备并点击运行按钮以安装并运行应用。\n\
  \n### 7.6 设备镜像\n\n设备镜像允许您在物理设备上运行应用，同时在 Android Studio 的 Running Devices（运行设备）工具窗口中查看显示。换句话说，尽管您的应用运行在物理设备上，但它在\
  \ Android Studio 中的显示方式与 AVD 实例相同。\n\n当设备连接到 Android Studio 时，显示 Running Devices\
  \ 工具窗口并点击 Device Mirroring 设置链接以显示设置对话框。在设置对话框中，启用物理 Android 设备的镜像并点击`OK`。下次运行应用时，Android\
  \ Studio 将会在 Running Devices 工具窗口中镜像物理设备的显示。\n\n### 7.7 总结\n\n虽然 Android 虚拟设备（AVD）模拟器提供了一个良好的测试环境，但务必记住，确保应用程序在物理\
  \ Android 设备上正常运行没有真正的替代品。\n\n但是，默认情况下，Android Studio 环境未配置为将 Android 设备作为目标测试设备。因此，必须执行一些步骤，通过\
  \ USB 线缆或通过 WiFi 网络从 Android Studio 开发环境直接将应用程序加载到 Android 设备上。实现此目标的具体步骤取决于开发平台。在本章中，我们涵盖了适用于\
  \ Linux、macOS 和 Windows 平台的步骤。\n\n## 8. Android Studio 代码编辑器基础\n\n为 Android 开发应用涉及大量的编程工作，根据定义，这涉及输入、审查和修改代码行。意料之中，开发者花在\
  \ Android Studio 大大部分时间通常花在编辑器窗口内编辑代码。\n\n现代代码编辑器必须远远超出输入、删除、剪切和粘贴的基本功能。今天，代码编辑器的实用性通常通过因素衡量，例如它减少程序员所需输入量、在大型源文件中导航的易用性，以及编辑器在编写代码时实时检测并高亮编程错误的能力。正如本章将证明的，这些只是\
  \ Android Studio 编辑器出色的少数领域之一。\n\n本章并非对 Android Studio 编辑器功能的详尽概述，但旨在提供该工具功能的指南。经验丰富的程序员会发现，这些功能中许多是通用的，而另一些则是该环境特有的。\n\
  \n### 8.1 Android Studio 编辑器\n\n当选择 Java、Kotlin、XML 或其他文本文件时，Android Studio 编辑器出现在主窗口的中心。图\
  \ 8-1 显示了一个加载了 Java 代码文件的典型编辑会话：\n\n![](img/as_code_java.jpg)\n\n图 8-1\n\n组成编辑器的元素总结如下：\n\
  \nA – 文档标签（Document Tabs）——Android Studio 可以同时打开多个文件。每打开一个文件时，它会被分配一个文档标签，显示在编辑器窗口顶部的标签栏中。当空间不足以显示所有标签时，标签栏的最右角会出现一个小小的下拉菜单。点击此菜单将列出打开的文件列表。标签中文件名下方的红色波浪线表示文件中代码包含错误，在编译和运行项目之前需要解决这些错误。\n\
  \n切换文件只需点击相应的标签或使用 `Alt-Left` 和 `Alt-Right` 快捷键。也可以通过切换器机制（通过 `Ctrl-Tab` 访问）进行文件切换。\n\
  \n要将编辑器面板从 Android Studio 主窗口中分离以便在单独窗口中显示，请点击标签并将其拖到主窗口之外的桌面区域。要将编辑器返回主窗口，请点击分离编辑器窗口中的文件标签并将其拖放到主窗口的原始编辑器标签栏上。\n\
  \nB – 编辑器槽区域（Editor Gutter Area）——槽区域被编辑器用于显示信息图标和控件。该区域中的典型项目包括调试断点标记、折叠和展开代码块的控件、书签、更改标记和行号。行号默认开启，但可以通过右键点击槽区域并选择`Appearance\
  \ -> Show Line Numbers`菜单选项来禁用。\n\nC – 代码结构位置（Code Structure Location）——编辑器底部的此栏显示光标当前位置相对于代码整体结构。例如，在下面的图中，该栏显示正在编辑\
  \ `convertCurrency` 方法，且该方法包含在 `MainActivity` 类中。\n\n\n\n\n\n![](img/as_code_structure.jpg)\n\
  \n图 8-2\n\n双击栏中的某个元素会将光标移动到代码文件中对应的位置。例如，双击 `convertCurrency` 条目将把光标移动到源代码中 `convertCurrency`\
  \ 方法的顶部。同样，点击 `MainActivity` 条目将显示一个可用的代码导航点列表以供选择：\n\n![](img/as_code_structure_menu.jpg)\n\
  \n图 8-3\n\n### D – 编辑器区域 – 用户查看、输入和编辑代码的主要区域。本章随后的章节将详细介绍编辑区域的关键功能。\n\n### E – 验证和标记侧边栏\
  \ – Android Studio 集成了一项名为“即时代码分析”的功能。这本质上意味着，当您输入代码时，编辑器会分析代码以检查警告和语法错误。验证侧边栏顶部的指示器会随着代码的添加而实时更新，显示已发现的错误和警告数量。点击此指示器将显示弹出窗口，其中包含编辑器中代码发现的问题摘要，如图\
  \ 8-4 所示：\n\n![](img/as_editor_validation_summary.jpg)\n\n图 8-4\n\n上下箭头可以在代码内的错误位置之间移动。绿色勾钩表示未检测到警告或错误。\n\
  \n侧边栏还会使用相同的颜色代码在检测到问题的位置显示标记。当代码行在编辑器区域中可见时，将鼠标指针悬停在标记上，将显示一个包含问题描述的弹出窗口：\n\n![](img/as_code_editor_problem_popup.jpg)\n\
  \n图 8-5\n\n当某行代码当前滚动出编辑器的视图区域时，将鼠标指针悬停在该代码行的标记上，将显示一个“透镜（lens）”覆盖层，其中包含问题所在的代码块（图\
  \ 8-6），从而无需滚动到编辑器的该位置即可查看：\n\n![](img/as_code_editor_lens.jpg)\n\n图 8-6\n\n值得注意的是，透镜覆盖层不仅限于侧边栏中的警告和错误。将鼠标悬停在侧边栏的任何部分，都会出现透镜，其中包含源文件中该处的代码。\n\
  \n### F – 状态栏 – 尽管状态栏是主窗口的一部分而非编辑器，但它确实包含有关当前活动编辑会话的信息。这些信息包括光标在行和字符方面的当前位置，以及文件的编码格式（UTF-8、ASCII\
  \ 等）。点击状态栏中的这些值可以更改相应的设置。例如，点击行号会显示“跳转到行:列”对话框。使用 `View -> Appearance -> Status\
  \ Bar Widgets` 菜单选项可以添加和删除小部件。例如，如果您遇到 Android Studio 的性能问题，“内存指示器（Memory Indicator）”是一个非常有用的小部件。\n\
  \n在概述了构成 Android Studio 编辑器的元素后，本章的剩余部分将更详细地探索编辑环境的关键功能。\n\n## 8.2 分拆编辑器窗口\n\n默认情况下，编辑器将显示当前所选文件内容的单个面板。在同时处理多个源文件时，一个实用的功能是将编辑器拆分为多个窗格。要拆分编辑器，右键点击编辑器窗口内的文件标签，并选择\
  \ `Split Right（向右拆分）或 `Split Down（向下拆分）菜单选项。例如，图 8-7 显示了拆分器的工作状态，编辑器被拆分为三个面板：\n\n\
  ![](img/as_code_editor_split.jpg)\n\n图 8-7\n\n拆分面板的方向可以随时右键点击相应的标签并选择 `Change Splitter\
  \ Orientation（更改拆分器方向）` 选项进行更改。重复这些步骤可以取消单个面板的拆分，此时从菜单中选择 `Unsplit（取消拆分）`选项。可以通过右键点击任何标签并选择\
  \ `Unsplit All（取消所有拆分）`选项来移除所有拆分面板。\n\n窗口拆分可用于显示不同的文件，或为同一个文件提供多个窗口，以便同时查看和编辑同一文件的不同区域。\n\
  \n 代码补全\n\nAndroid Studio 编辑器拥有大量关于 Java 编程语法、构成 Android SDK 的类和方法等内置知识，以及关于您自己的代码库的知识。随着代码的输入，编辑器会扫描正在输入的内容，并在适当的情况下，针对完成语句或引用可能需要的内容提供建议。当编辑器检测到补全建议时，会出现一个包含建议列表的面板。例如，在图\
  \ 8-8 中，编辑器正在为 `String` 声明的开头提供可能性：\n\n![](img/as_code_editor_completion.jpg)\n\n\
  图 8-8\n\n如果没有任何自动补全建议是正确的，请继续输入，编辑器将会在适当的情况下继续完善建议。要接受最顶部的建议，请按键盘上的 `Enter` 或 `Tab`\
  \ 键。要选择不同的建议，请使用方向键在列表中上下移动，再次使用 `Enter` 或 `Tab` 键选择高亮项。\n\n可以使用 `Ctrl-Space` 键盘组合键手动调用补全建议。这在更改编辑器中的单词或声明时非常有用。当光标置于编辑器中的某个单词上时，该单词会自动高亮。按下\
  \ `Ctrl-Space` 将显示备选建议列表。按 `Tab` 键用高亮项替换当前单词。\n\n除了实时自动补全功能外，Android Studio 编辑器还提供了智能补全（Smart\
  \ Completion）系统。智能补全通过 `Shift-Space` 序列调用，选择后将根据代码的上下文提供更多建议。再次按下 `Shift-Space`\
  \ 序列将从更广泛的范围提供建议。\n\n代码补全对许多程序员来说是一个个人偏好问题。为了这一这一事实，Android Studio 为自动补全设置提供了高水平的控制。可以通过打开设置对话并在设置面板中选择\
  \ `Editor -> General -> Code Completion` 来查看和修改设置，如图 8-9 所示：\n\n![](img/as_code_completion_settings.jpg)\n\
  \n图 8-9\n\n## 8.4 语句补全\n\nAndroid Studio 编辑器的另一种补全形式是语句补全。它可以自动填充方法和循环语句等项目的括号和大括号。语句补全通过\
  \ `Shift-Ctrl-Enter`（macOS 上为 `Shift-Cmd-Enter`）键盘序列调用。考虑以下代码：\n\n```\nmyMethod()\n\
  ```\n\n在编辑器中输入这些代码后，触发语句补全将导致编辑器自动为方法添加括号：\n\n```\nmyMethod() {\n\n}\n\n```\n\n\
  \ 8.5 参数信息\n\n还可以请求编辑器提供方法接受的参数信息。当光标位于方法调用括号之间时，`Ctrl-P`（macOS 上为 `Cmd-P`）键盘序列将显示该方法接受的参数，其中最可能的建议将加粗显示：\n\
  \n![](img/as_code_editor_parametre_info_java.jpg)\n\n图 8-10\n\n## 8.6 参数名称提示\n\n\
  \n\n\n代码编辑器可以配置为在方法调用内部显示参数名提示。例如，图 8-11 显示了 `Snackbar` 类中 `make()` 和 `setAction()`\
  \ 方法调用中的参数名提示：\n\n![](img/as_code_editor_hints.jpg)\n\n图 8-11\n\n此模式的设置可以通过打开 Settings（设置）对话框，并在侧边面板中导航到\
  \ `Editor（编辑器） -> Inlay Hints（内联提示） -> Java` 即可完成配置。在生成的屏幕上开启或关闭所选编程语言的 Parameter\
  \ names（参数名）选项。如需调整提示设置，点击 Exclude list...（排除列表...）链接并进行必要的调整。\n\n### 8.7 代码生成\n\
  \n除了在输入时完成代码外，编辑器在某些条件下还可以为你生成代码。图 8-12 所示的可用代码生成选项列表可以在当光标位于文件中需要生成代码的位置时，使用`Alt-Insert`（macOS\
  \ 上为 `Cmd-N`）快捷键进行访问。\n\n![](img/as_code_generate_menu.jpg)\n\n图 8-12\n\n例如，考虑一种情况：我们希望在项目中的\
  \ `Activity` 准备被操作系统销毁时收到通知。正如本书后续章节概述的，这可以通过重写 `Activity` 超类的 `onStop()` 生命周期方法来实现。若要让\
  \ Android Studio 为此生成一个存根方法，请从代码生成列表中选择 Override Methods…（重写方法...）选项，并在生成的可用方法列表中选择\
  \ `onStop()` 方法：\n\n![](img/as_code_editor_override_dialog.jpg)\n\n图 8-13\n\n选择好要重写的方法后，点击\
  \ OK 将在 Java 源文件的当前光标位置处生成如下存根方法：\n\n```\n@Override\nprotected void onStop() {\n\
  \    super.onStop();\n}\n```\n\n```]\n\n### 8.8 代码折叠\n\n一旦源代码文件达到一定大小，即使是格式化最仔细、组织良好的代码也可能变得难以处理和导航。Android\
  \ Studio 认为，并不总是需要让每个代码块的内容始终可见。通过使用 Android Studio 编辑器的代码折叠功能，可以使代码导航变得更容易。代码折叠使用展开箭头进行控制，当鼠标指针悬停在源文件的行号栏（gutter）区域时，这些箭头会出现在每个代码块的开头。例如，图\
  \ 8-14 突出了一个当前未折叠的方法声明的展开箭头：\n\n![](img/as_code_editor_folding.jpg)\n\n图 8-14\n\n\
  点击此标记将折叠语句，使仅保留签名行可见，如图 8-15 所示：\n\n![](img/as_code_editor_folded.jpg)\n\n图 8-15\n\
  \n要展开已折叠的代码段，请点击编辑器行号栏中的展开箭头。若要在不展开代码的情况下查看隐藏代码，请将鼠标指针悬停在“{…}”指示器上，如图 8-16 所示。编辑器将显示包含折叠代码块的透镜覆盖层（lens\
  \ overlay）：\n\n![](img/as_code_editor_folded_lens_java.jpg)\n\n图 8-16\n\n文件中的所有代码块都可以使用`Ctrl-Shift-Plus`\
  \ 和 `Ctrl-Shift-Minus` 键盘序列（macOS 上为 `Cmd-Shift-Plus` 和 `Cmd-Shift-Minus`）进行折叠或展开。\n\
  \n默认情况下，Android Studio 编辑器会在打开源文件时自动折叠某些代码。要配置发生这种情况的条件，请导航到 Editor（编辑器） -> General（通用）\
  \ -> Folding（折叠）。\n\n\n\n\n\n到目前为止，本书已经采取步骤，为使用 `Android Studio` 开发 Android 应用程序搭建适用于的环境。通过创建一个\
  \ `Android Studio` 应用程序项目，已经在应用开发过程中迈出了第一步。\n\n然而，在深入研究 Android 应用程序开发的实际问题之前，理解\
  \ `Android SDK` 以及通用的 Android 开发的一些较为抽象的概念至关重要。现在对这些概念建立清晰的理解将为进一步构建知识打下坚实的基础。\n\
  \n本章将从 Android 架构概述开始，并在本书的后续章节中继续，目标是提供关于 Android 开发基础知识的详细概述。\n\n# 9.1 Android\
  \ 软件栈\n\nAndroid 结构化为一个软件栈，由应用程序、操作系统、运行时环境、中间件、服务和库组成。这种架构可以通过视觉化的方式最好地表示，如图 9-1\
  \ 所示。堆栈的每一层以及每层中对应的元素都紧密集成并经过仔细调优，以为移动设备提供最优的应用开发和执行环境。本章的剩余部分将介绍 Android 软件栈的不同层，从底部的\
  \ `Linux Kernel` 开始。\n\n![](img/architecture_stack_small.jpg)\n\n图 9-1\n\n# 9.2\
  \ Linux 内核\n\n`Linux Kernel` 位于 Android 软件栈的底部，在设备硬件和 Android 软件栈上层之间提供抽象抽象。内核提供了抢占式多任务处理、底层核心系统服务（如内存、进程和电源管理），以及用于设备器、WiFi\
  \ 和音频硬件的网络栈和设备驱动程序。\n\n原始的 `Linux kernel` 由 Linus Torvalds 于 1991 年开发。它与 Richard\
  \ Stallman 在自由软件基金会（Free Software Foundation）开发的一系列工具、实用程序和编译器相结合，创建了一个名为 `GNU/Linux`\
  \ 的完整操作系统。各种 `Linux` 发行版都是从这些基础架构衍生出来的，例如 `Ubuntu` 和 `Red Hat Enterprise Linux`。\n\
  \n然而，重要的是，Android 仅使用了 `Linux kernel`。尽管如此，值得注意的是，`Linux kernel` 最初是为传统的桌面和服务器计算机系统设计的。事实上，`Linux`\
  \ 现在最广泛地部署在任务关键的企业级服务器环境中。我们发现这种软件位于 Android 软件栈的核心，既证明了当今移动设备的强大，也证明了 `Linux kernel`\
  \ 的效率和性能。\n\n# 9.3 硬件抽象层\n\n硬件抽象层（`HAL`）由一组库模块组成，与摄像头、麦克风和加速度计等设备组件建立接口。当 Android\
  \ 栈需要访问硬件组件时，它使用 `HAL` 库模块。每个 Android 设备制造商都为其特定的硬件配置有一个抽象层，允许标准的 Android 库和框架在任何设备上运行，无需针对特定硬件进行修改。\n\
  \n# 9.4 Android 运行时 – ART\n\n在 `Android Studio` 中构建 Android 应用时，它会被编译成中间字节码格式（`DEX\
  \ format`）。当应用程序随后加载到设备上时，`Android Runtime` (`ART`) 使用一种称为“预编译”（Ahead-of-Time, AOT）的过程将字节码翻译为设备处理器所需的本地指令。这种格式被称为可执行和链接格式（`ELF`）。\n\
  \n每当随后启动应用程序时，都会运行 `ELF` 执行版本，从而获得更快的性能和更长的电池寿命。\n\n这与旧版 Android 实现中使用的即时编译（Just-in-Time,\
  \ JIT）方法形成对比，在那种方法中，字节码在每次启动应用程序时都在虚拟机（`VM`）内部进行翻译。\n\n### 9.5 Android 库\n\n除了一组标准的\
  \ Java 开发库（提供对字符串处理、网络和文件操作等通用任务的支持）外，Android 开发环境还包含了 `Android Libraries`。这些是专门用于\
  \ Android 开发的一组基于 Java 的库。此类库的示例包括应用程序框架库，以及用于促进用户界面构建、图形绘制和数据库访问的库。\n\nAndroid\
  \ 开发者可用的某些核心 Android 库总结如下：\n\n*   `android.app` – 提供对应用程序模型的访问，是所有 Android 应用程序的基石。\n\
  *   `android.content` – 促进应用程序与应用组件之间的内容访问、发布和消息传递。\n*   `android.database` – 用于访问内容提供者（content\
  \ providers）发布的数据，并包含 `SQLite` 数据库管理类。\n*   `android.graphics` – 一种底层 2D 图形绘制 API，包括颜色、点、过滤器、矩形和画布。\n\
  *   `android.hardware` – 提供一个访问加速度计和光传感器等硬件的 API。\n*   `android.opengl` – 连接到 `OpenGL\
  \ ES` 3D 图形渲染 API 的 Java 接口。\n*   `android.os` – 为应用程序提供标准操作服务的访问，包括消息、系统服务和进程间通信。\n\
  *   `android.media` – 提供启用音频视频播放的类。\n*   `android.net` – 一组提供网络栈访问的 API。包括 `android.net.wifi`，提供了对设备无线栈的访问。\n\
  *   `android.print` – 包括一组类，允许从 Android 应用程序内部将内容发送到配置的打印机。\n*   `android.provider`\
  \ – 一组便利类，提供对标准 Android 内容提供者数据库的访问，例如日历和联系人应用程序维护的数据库。\n*   `android.text` – 用于在设备显示上渲染和操作文本。\n\
  *   `android.util` – 一组工具类，用于执行字符串和数字转换、XML 处理以及日期和时间操作。\n*   `android.view` – 用户界面的基础构建块。\n\
  *   `android.widget` - 预构建用户界面组件的丰富集合，如按钮、标签、列表视图、布局管理器、单选按钮等。\n*   `android.webkit`\
  \ – 一一组允许构建应用程序构建网络浏览功能的类。\n\n在涵盖了 Android 运行时的 Java 库后，现在是我们将注意力转向 Android 栈这一层中的\
  \ C/C++ 库了。\n\n#### 9.5.1 C/C++ 库\n\n前面介绍的 Android 核心库是基于 Java 的，并为 Android 开发者提供了主要的\
  \ API。然而，重要的是，核心库并没有执行许多实际工作，事实上它们是对一组 C/C++ 库的 Java “封装器”（wrappers）。例如，当调用 `android.opengl`\
  \ 库在设备显示器上绘制 3D 图形时，该库最终调用 `OpenGL ES` C++ 库，而该库又与底层的 `Linux kernel` 工作以完成绘制任务。\n\
  \n包含 C/C++ 库是为了满足广泛多样的功能，包括 2D 和 3D 图形绘制、安全套接层（SSL）通信、`SQLite` 数据库管理、音频视频播放、位图和矢量字体渲染、显示子系统和图形层管理，以及标准\
  \ C 库（`libc`）的实现。\n\n\n\n\n\n在实践中，典型的 Android 开发者仅通过基于 Java 的 Android 核心库 API 访问这些库。如果需要直接访问这些库，可以使用\
  \ Android 原生开发包（`NDK`），其目的是通过 Java Native Interface（`JNI`）从 Java 代码调用非 Java 或 Kotlin\
  \ 编程语言（如 C 和 C++）的原生方法。\n\n## 9.6 应用程序框架 (Application Framework)\n\n应用程序框架是一组服务，它们共同组\
  \ Android 应用程序运行和管理的环境。该框架实现了 Android 应用程序由可用、可交换和可替换的组件构建的概念。这一概念更进一步，应用程序还可以发布其功能以及任何相关数据，以便其他应用程序可以发现并重用它们。\n\
  \nAndroid 框架包含以下关键服务：\n\n- `Activity Manager` – 控制应用程序生命周期的所有方面和活动栈。\n- `Content\
  \ Providers` – 允许应用程序发布并与其他应用程序共享数据。\n- `Resource Manager` – 提供对非代码嵌入资源的访问，如字符串、颜色设置和用户界面布局。\n\
  - `Notifications Manager` – 允许应用程序向用户显示警报和通知。\n- `View System` – 一组可扩展的视图，用于创建应用程序用户界面。\n\
  - `Package Manager` – 应用程序通过其查找设备上当前安装的其他应用程序信息的系统。\n- `Telephony Manager` – 向应用程序提供设备上可用电话服务的信息，例如状态和订阅者信息。\n\
  - `Location Manager` – 提供对位置服务的访问，允许应用程序接收位置更改的更新。\n\n### 9.7 应用程序 (Applications)\n\
  \n位于 Android 软件栈顶端的是应用程序。它们由特定的 Android 实现提供的原生应用程序（例如网络浏览器和电子邮件应用程序）以及用户购买设备后安装的第三方应用程序组成。\n\
  \n### 9.8 总结 (Summary)\n\n良好的 Android 开发知识基础需要对 Android 的整体架构有理解。Android 实现为一种软件栈架构，由\
  \ Linux 内核、运行时环境、相应的库、应用程序框架和一组应用程序组成。应用程序主要用 Java 或 Kotlin 编写，并在 Android Studio\
  \ 构建环境中编译为字节码格式。当应用程序随后安装在设备上时，这些字节码将由 Android 运行时（`ART`）编译为 CPU 使用的原生格式。Android\
  \ 架构的关键目标是性能和效率，无论是在应用程序执行中还是在应用程序设计的重用实现中。\n\n## 10.  Android 应用程序剖析 (The Anatomy\
  \ of an Android App)\n\n无论你之前的编程经验如何（无论是基于 Windows、macOS、Linux 甚至 iOS），都有很大可能 Android\
  \ 开发与你以前遇到过的任何事物都完全不同。\n\n因此，本章的目标是提供对 Android 应用程序架构背后的高级概念的理解。为此我们将详细探索用于构建应用程序的各种组件，以及允许这些组件协同工作以创建一个内贯应用程序的机制。\n\
  \n### 10.1 Android 活动 (Activities)\n\n熟悉 Java、Kotlin、`C++` 或 `C#` 等面向对象编程语言的人会熟悉将应用程序功能元素封装在类中的概念，然后将类实例化为对象并进行操作以创建应用程序。这仍然适用，因为\
  \ Android 应用程序是用 Java 和 Kotlin 编写的。然而，Android 将可用组件的概念提升到了更高的水平。\n\nAndroid 应用程序通过组合一个或多个称为\
  \ Activity 的组件来创建。Activity 是应用程序功能的单个、独立模块，通常直接对应于单个用户界面屏幕及其相应的功能。例如，一个预约应用程序可能会有一个\
  \ Activity 屏幕，显示当天安排的预约。应用程序还可能使用第二个 Activity，它由一个用户可以在其中输入新预约的屏幕组成。\n\nActivity\
  \ 被设计为完全可重用的可交换的构建块，可以在不同的应用程序之间共享。现有的电子邮件应用程序可能包含一个用于编写和发送电子邮件消息的 Activity。开发者可能正在编写一个也需要发送电子邮件消息的应用程序。开发者无需为新应用程序专门开发一个邮件编写\
  \ Activity，而是可以使用现有电子邮件应用程序中的 Activity。\n\nActivity 是作为 `Android Activity` 类的子类创建的，并且必须实现为与应用程序中的其他\
  \ Activity 完全独立。换句话说，共享的 Activity 不能依赖于在程序流的已知点处被调用（因为其他应用程序可能会以意料之外的方式使用该 Activity），而且一个\
  \ Activity 不能直接调用其他 Activity 的方法或访问其实例数据。相反，这是通过使用 `Intents` 和 `Content Providers`\
  \ 实现的。\n\n默认情况下，Activity 无法向调用它的 Activity 返回结果。如果需要此功能，则必须显式地作为源 Activity 的子 Activity\
  \ 启动它。\n\n### 10.2 Android 片段 (Fragments)\n\n如上所述，Activity 通常代表应用内部的单个用户界面屏幕。一种方案是使用单个用户界面布局和一个相应的\
  \ Activity 类文件来构建 Activity。然而，一种更好的替代方案是将 Activity 拆分为不同的部分。每个部分都是一个 Fragment，由用户界面布局的一部分和匹配的类文件（声明为\
  \ `Android Fragment` 类的子类）组成。在这种情况下，Activity 变成一个容器，嵌入一个或多个 Fragment。\n\nFragment\
  \ 提供了一种高效的替代方案，无需让每个用户界面屏幕由单独的 Activity 表示。相反，应用程序可以单个 Activity 在 Fragment 之间切换，每个\
  \ Fragment 代表不同的应用屏幕。\n\n### 10.3 Android Intent (Android Intents)\n\n`Intents`\
  \ 是一个 Activity 启动另一个 Activity 并实现组成应用程序的 Activity 流的机制。Intent 由对要执行的操作的描述以及可选的、在该操作上执行的数据组成。\n\
  \nIntent 可以是显式的，即通过类名引用 Activity 来请求启动特定的 Activity；也可以是隐式的，通过阐述要执行的操作类型或提供要执行该操作的特定类型的数据。对于隐式\
  \ Intent，Android 运行时将使用称为 `Intent Resolution`（意 解析）的进程选择最符合 `Intent` 所述标准的 Activity\
  \ 进行启动。\n\n### 10.4 广播 Intent (Broadcast Intents)\n\n另一种类型的 Intent——广播 Intent（`Broadcast\
  \ Intent`），是系统级发送到所有注册了“感兴趣”的 `Broadcast Receiver` 应用程序的 Intent。例如，Android 系统通常会发送广播\
  \ Intent 来指示设备状态的变化，例如系统启动完成、设备连接外部电源源或屏幕开启或关闭。\n\n\n\n\n广播意图（Broadcast Intent）可以是普通的（异步的），即在大致相同的时间发送给所有感兴趣广播接收器（Broadcast\
  \ Receivers）；也可以是有序的，即一次发送给一个接收器，接收器对其进行处理，然后终止或允许其传递给下一个广播接收器。\n\n### 10.5 广播接收器\n\
  \n广播接收器是应用程序响应广播意图的机制。广播接收器必须由应用程序注册，并配置 `Intent Filter`（意图过滤器）以指示它感兴趣的广播类型。当广播匹配的意图时，无论注册接收器的应用程序当前是否运行，Android\
  \ 运行时都会调用该接收器。接收器随后有 5 秒的时间在返回之前完成所需的任务（例如启动 `Service`、更新数据或向用户发送通知）。广播接收器在后台运行，没有用户界面。\n\
  \n## 10.6 Android 服务\n\nAndroid 服务（Android Services）是在后台运行且没有用户界面的进程。它们可以从活动（activities）、广播接收器或其他服务启动并管理。对于应用程序需要继续执行任务但不一定需要用户可见的用户界面的情况，Android\
  \ 服务是理想的选择。尽管服务缺少用户界面，但它们仍然可以使用通知和吐司（出现在屏幕上且不中断当前显示活动的小型通知消息）来通知用户事件，并且能够发布 `Intents`。\n\
  \nAndroid 运行时赋予服务的优先级高于许多其他进程，系统仅在释放资源的最后手段情况下才会将其终止。然而，如果运行时需要杀死某个服务，一旦有了足够的资源，它将自动重启。服务可以通过声明自己为需要在前台运行来降低终止的风险。这通过调用\
  \ `startForeground()` 实现。这仅建议用于终止会对用户体验产生不利的情况（例如，如果用户正在听由服务流的音频）。\n\n服务可能作为实际解决方案的示例情况包括（如之前提到的）：当应用程序不再活动时仍继续播放的音频流，或者在股票达到指定价格时通知用户的股票市场跟踪应用程序。\n\
  \n## 10.7 内容提供者\n\n内容提供者（Content Providers）实现了一种应用程序之间数据共享的机制。任何应用程序都可以通过实现内容提供者为其他应用程序提供访问其底层数据的权限，包括添加、删除和查询数据的能力（受权限限制）。对数据的访问通过内容提供者定义的通用资源标识符（`URI`）提供。数据可以作为文件或整个\
  \ `SQLite` 数据库进行共享。\n\n原生 Android 应用程序包含几个标准的内容提供者，允许应用程序访问联系人和媒体文件等数据。Android 系统上当前可用的内容提供者可以使用\
  \ `Content Resolver`（内容解析器）定位。\n\n### 10.8 应用程序清单\n\n应用程序清单（Application Manifest）文件是组成应用程序的各种元素结合在一起的胶水。在这个基于\
  \ XML 的文件中，应用程序概述了构成完整应用程序的活动、服务、广播接收器、数据提供者和权限。\n\n### 10.9 应用程序资源\n\n除了清单文件和包含字节码的\
  \ `Dex` 文件外，Android 应用程序包通常包含一组资源文件。这些文件包含在用户界面中显示的资源，如字符串、图像、字体和颜色，以及用户界面布局的 XML\
  \ 表示。默认情况下，这些文件存储在应用程序项目层次结构中的 `/res` 子目录中。\n\n### 10.10 应用程序上下文\n\n当应用程序被编译时，会创建一个名为\
  \ `R` 的类，其中包含对应用程序资源的引用。应用程序清单文件和这些资源结合创建了所谓的应用程序上下文（Application Context）。此上下文由\
  \ `Android Context` 类表示，可以在应用程序代码中使用它以便在运行时访问应用程序资源。此外，可以在应用程序上下文中调用广泛的方法来收集信息并在运行时更改应用程序的环境。\n\
  \n### 10.11 总结\n\n许多不同的元素可以组合成一个 Android 应用程序。在本章中，我们提供了活动、片段（Fragments）、服务、意图和广播接收器的层级概述，以及对清单文件和应用程序资源的概述。\n\
  \n通过以活动和意图的形式创建单个、独立的功能模块，并实现内容提供者来实现应用程序之间的数据共享，可以促进最大的重用性和操作性。\n\n虽然活动专注于用户与应用程序交互的区域（活动本质上等同于单个用户界面屏幕，通常由一个或多个片段组成），但后台处理通常由服务和广播接收器处理。\n\
  \n构成应用程序的组件在清单文件中为 Android 运行时进行了概述，该文件结合应用程序资源代表了应用程序的上下文。\n\n本章涵盖了许多对普通开发者来说可能是新的内容。但请放心，在后续章节中将对这些概念进行深入探索和实际应用，以确保为构建自己的应用程序奠定坚实的知识基础。\n\
  \n## 11. Android 视图绑定概述\n\n开发 Android 应用程序的一个部分涉及代码与构成用户界面布局的视图之间的交互。本章将查看在代码中获取布局视图的选项，重点强调名为视图绑定（view\
  \ binding）的选项。在涵盖视图绑定的基础知识后，本章将概述如何将 `AndroidSample` 项目转换为使用这种方法。\n\n### 11.1 通过\
  \ ID 查找视图\n\n正如标题为“[Android 应用程序分析]”的章节概述的，构成应用程序的所有资源都被编译成一个名为 `R` 的类。这些资源中包含了定义布局的资源。在\
  \ `R` 类中有一个名为 `layout` 的子类，它包含布局资源，包括构成用户界面的视图。大多数应用程序都需要实现代码与这些视图之间的交互，例如在读取 `EditText`\
  \ 视图中输入的值或更改 `TextView` 显示的内容时。\n\n在 Android Studio 3.6 之前，从应用程序代码内部访问视图的最常用选项是编写代码通过\
  \ `findViewById()` 方法根据 ID 手动查找视图。例如：\n\n```\nTextView exampleView = findViewById(R.id.exampleView);\n\
  ```\n\n获取引用后，就可以访问该视图的属性。例如：\n\n```\nexampleView.setText(\"Hello\");\n```\n\n虽然通过\
  \ ID 查找视图仍然是一个可行的方案，但它具有一些局限性，`findViewById()` 最显著的缺点可能是获取到一个尚未在布局中创建的视图的引用，从而在尝试访问该视图属性时抛出空指针异常。\n\
  \n自 Android Studio 3.6 以来，已经以视图绑定的形式提供了另一种从应用程序代码访问视图的方法。\n\n### 11.2 视图绑定\n\n\n\
  \n\n\n当应用模块中启用视图绑定（view binding）时，Android Studio 会为每个布局文件自动生成一个绑定类。在代码中可以使用此绑定类访问布局视图，而无需使用\
  \ `findViewById()`。\n\nAndroid Studio 生成的绑定类名称基于布局文件名，转换为所谓的“驼峰命名法”（camel case），并在末尾添加“Binding”单词。例如，对于\
  \ `activity_main.xml` 文件，绑定类将命名为 `ActivityMainBinding`。\n\nAndroid Studio Iguana\
  \ 在项目模板中使用视图绑定的情况是不一致的。例如，我们在创建 `AndroidSample` 项目时使用的空视图活动（Empty Views Activity）模板没有使用视图绑定。而相反，基础视图活动（Basic\
  \ Views Activity）模板是使用视图绑定来实现的。如果你使用了没有使用视图绑定的模板，那么了解如何将其添加到项目中是至关重要的。\n\n## 11.3\
  \ 转换 AndroidSample 项目\n\n在本章的剩余部分中，我们将通过将 `AndroidSample` 项目转换为使用视图绑定代替 `findViewById()`\
  \ 来练习迁移到视图绑定。\n\n首先，启动 Android Studio 并打开在在 Android Studio 中创建示例 Android 应用章节中创建的\
  \ `AndroidSample` 项目。\n\n## 11.4 启用视图绑定\n\n要使用视图绑定，必须对需要视图绑定的每个模块的 `build.gradle.kts`\
  \ 文件进行更改。对于 `AndroidSample` 项目，这需要微调 `Gradle Scripts -> build.gradle.kts (Module:\
  \ app)` 文件。将此文件加载到编辑器中，找到 `android` 部分并添加以下项以启用 `viewBinding` 属性：\n\n```kotlin\n\
  plugins {\n    alias(libs.plugins.androidApplication)\n}\n\nandroid {\n    buildFeatures\
  \ {\n        viewBinding = true\n    }\n}\n```\n\n完成此更改后，点击编辑器面板顶部的 `Sync Now` 链接，然后使用\
  \ `Build` 菜单清理并重建项目，以确保生成绑定类。下一步是在代码中使用绑定类。\n\n## 11.5 使用视图绑定\n\n此过程的第一步是“膨胀”（inflate）视图绑定类，以访问布局中的根视图。该根视图将被作为布局的内容视图。\n\
  \n执行这些任务的逻辑位置位于与布局相关的活动的 `onCreate()` 方法中。一个典型的 `onCreate()` 方法如下：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    EdgeToEdge.enable(this);\n    setContentView(R.layout.activity_main);\n   \
  \ ViewCompat.setOnApplyWindowInsetsListener(findViewById(R.id.main),\n         \
  \     (v, insets) -> {\n            Insets systemBars =\n                insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  \            v.setPadding(systemBars.left, systemBars.top,\n                   \
  \      systemBars.right, systemBars.bottom);\n            return insets;\n     \
  \   });\n}\n```\n\n切换到使用视图绑定，需要导入视图绑定类并按如下所示修改类。注意，由于布局文件名为 `activity_main.xml`，我们可以推断出\
  \ Android Studio 生成的绑定类命名为 `ActivityMainBinding`。注意，如果你在创建项目时使用了 `com.example` 以外的域名，则下面的导入语句需要更改以反映这一点：\n\
  \n```java\nimport android.widget.EditText;\nimport android.widget.TextView;\nimport\
  \ com.example.androidsample.databinding.ActivityMainBinding;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        EdgeToEdge.enable(this);\n        setContentView(R.layout.activity_main);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        ViewCompat.setOnApplyWindowInsetsListener(binding.main,\
  \ (v, insets) -> {\n            Insets systemBars =\n                insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  \            v.setPadding(systemBars.left, systemBars.top, systemBars.right,\n \
  \                        systemBars.bottom);\n            return insets;\n     \
  \   });\n    }\n}\n```\n\n现在我们有了对绑定的引用，可以如下方式通过名称访问视图：\n\n```java\npublic void convertCurrency(View\
  \ view) {\n    EditText dollarText = findViewById(R.id.dollarText);\n    TextView\
  \ textView = findViewById(R.id.textView);\n    if (!binding.dollarText.getText().toString().isEmpty())\
  \ {\n        Float dollarValue = Float.valueOf(\n                            binding.dollarText.getText().toString());\n\
  \        Float euroValue = dollarValue * 0.85F;\n        binding.textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n                                             euroValue));\n    } else {\n\
  \        binding.textView.setText(R.string.no_value_string);\n    }\n}\n```\n\n\
  编译并运行应用，验证货币转换过程是否如以前一样工作。\n\n### 11.6 选择选项\n\n尽管在空视图活动（Empty Views Activity）项目模板中未能采用视图绑定，但\
  \ Google 强烈建议尽可能使用视图绑定。因此，在开发项目时应该使用视图绑定。\n\n## 11.7 书中的视图绑定\n\n本书中任何依赖未实现视图绑定的模板的章节将首先进行迁移。不需要每次需要迁移都重复这些步骤，这些章节将引导你回到此处刷新（不用担心，几个章节之后就会变成自然）。\n\
  \n## 11.8 将项目转换为视图绑定\n\n将项目转换为视图绑定涉及以下步骤：\n\n1. 编辑位于 `Gradle Scripts -> build.gradle.kts\
  \ (:app)` 的模块级 Gradle 脚本。\n2. 找到文件的 `android` 部分并添加项以启用 `viewBinding`：\n```kotlin\n\
  android {\n    buildFeatures {\n        viewBinding = true\n    }\n}\n```\n3. 点击编辑器顶部的\
  \ `Sync Now` 链接根据这些构建设置同步项目。\n4. 编辑 `MainActivity.java` 文件并进行修改，其中 `<reverse domain>`\
  \ 代表创建项目时的域名，`<project name>`替换为项目的小写名称（例如 `androidsample`），`<binding name>` 是对应布局文件的绑定（例如\
  \ `activity_main.xml` 的绑定为 `ActivityMainBinding`）。\n\n```java\nimport android.widget.EditText;\n\
  import android.widget.TextView;\nimport com.example.androidsample.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        EdgeToEdge.enable(this);\n\
  \        setContentView(R.layout.activity_main);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ ViewCompat.setOnApplyWindowInsetsListener(binding.main, (v, insets) -> {\n   \
  \         Insets systemBars =\n                insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  \            v.setPadding(systemBars.left, systemBars.top, systemBars.right,\n \
  \                        systemBars.bottom);\n            return insets;\n     \
  \   });\n    }\n}\n```\n5. 通过绑定对象的属性按名称访问视图。\n\n### 11.9 总结\n\n\n\n\n在 Android Studio\
  \ 3.6 引入之前，从应用代码内部访问布局视图需要使用 `findViewById()` 方法。现在提供了一种名为视图绑定（view bindings）的替代方案。视图绑定由\
  \ Android Studio 为每个 XML 布局文件自动生成的类组成。这些类包含了对对应布局中每个视图的绑定提供了比 `findViewById()` 方法更安全的选项。然而，从\
  \ Android Studio Iguana 版本开始，某些项目模板默认未启用视图绑定。需要手动执行额外步骤在每个项目模块中启用并配置支持。\n\n# 12.\
  \ 理解 Android 应用程序和 Activity 生命周期\n\n在前面的章节中，我们学习了 Android 应用程序在进程中运行，并由活动（activities）、服务（services）和广播接收器（broadcast\
  \ receivers）形式存在的多个组件组成。本章旨在通过查看 Android 运行时系统内应用程序和 Activity 的生命周期来扩展这些知识。\n\n\
  无论对于当今移动设备中的内存和计算能力与过去的桌面系统相比有多么的天花乱坠，但请记住，根据现代桌面和笔记本电脑系统的标准，这些设备仍被认为是“资源受限的”，特别是在内存方面。因此，Android\
  \ 系统的一项核心职责是确保有效管理这些有限资源，并确保操作系统及其运行的应用程序始终对用户保持响应。为了实现这一点，Android 对运行应用程序的进程以及构成这些应用程序的各个组件的生命周期和状态拥有完全控制权。\n\
  \n因此，开发 Android 应用的关键在于理解 Android 的应用程序和 Activity 生命周期模型，以及应用程序如何响应在其执行生存期间可能被施加的状态变化。\n\
  \n## 12.1 Android 应用程序与资源管理\n\n操作系统将每个运行的 Android 应用程序视为一个独立的进程。如果系统识别到设备资源达到容量，它将采取措施终止进程以释放内存。\n\
  \n在确定终止哪个进程以释放内存时，系统会同时考虑所有当前运行进程的优先级和状态，结合这些因素创建 Google 所称的“重要性层次结构”（importance\
  \ hierarchy）。然后进程会被终止，从最低优先级开始按层级向上移动，直到释放出足够的资源供系统运行。\n\n## 12.2 Android 进程状态\n\
  \n进程托管应用程序，而应用程序由组件组成。在 Android 系统中，进程的当前状态由其托管应用程序中排名最高的活动组件定义。如图 12-1 所示，进程在任何给定时刻都可以处于以下五种状态之一：\n\
  \n![android_process_priorities.png](img/Image2438.jpg)\n\n图 12-1\n\n#### 12.2.1\
  \ 前台进程 (Foreground Process)\n\n这些进程被赋予最高级别的优先级。在任何时刻，活跃的前台进程可能只有一个或两个，它们通常是系统最后终止的进程。进程必须满足以下标准之一或多个才能获得前台状态：\n\
  \n- 托管用户当前正在交互的 Activity。\n- 托管与用户正在交互的 Activity 连接的 `Service`。\n- 托管通过调用 `startForeground()`\
  \ 表示终止将破坏用户体验的 `Service`。\n- 托管执行其 `onCreate()`、`onResume()` 或 `onStart()` 回调的 `Service`。\n\
  - 托管正在执行 `onReceive()` 方法的广播接收器（Broadcast Receiver）。\n\n#### 12.2.2 可见进程 (Visible\
  \ Process)\n\n包含用户可见但不是用户正在交互的 Activity 的进程被归类为“可见进程”。这通常发生在进程中的 Activity 对用户可见，但另一个\
  \ Activity（如部分屏幕或对话框）处于前台时。如果进程托管一个本身绑定到可见或前台 Activity 的 `Service`，该进程也具备可见状态。\n\
  \n#### 12.2.3 服务进程 (Service Process)\n\n包含已启动并正在执行的 `Service` 的进程。\n\n#### 12.2.4\
  \ 后台进程 (Background Process)\n\n包含一个或多个当前对用户不可见的 Activity，且不托管任何符合服务进程状态的 `Service`\
  \ 的进程。属于此类别的进程如果需要为高优先级进程释放额外内存，则面临很高的终止风险。Android 维护着后台进程的动态列表，按时间顺序终止进程，使得最久处于前台的进程首先被杀死。\n\
  \n#### 12.2.5 空进程 (Empty Process)\n\n空进程不再包含活跃的应用程序，并保留在内存中，准备为新启动的应用程序提供托管。这比比在预期乘客到达时保持公交的大门开启并引擎运转。此类进程被认为优先级最低，是释放资源时第一个要被杀死的。\n\
  \n### 12.3 进程间依赖\n\n确定最高优先级的进程比上一节概述的要复杂，因为进程通常是相互依赖。因此，在确定进程的优先级时，Android 系统还会考虑该进程是否以某种方式为另一个更高优先级的进程服务（例如，服务进程作为前台进程的内容提供者）。根据基本规则，Android\
  \ 文档规定一个进程的排名永远不会低于它当前正在服务的另一个进程。\n\n## 12.4 Activity 生命周期\n\n正如我们之前确定的，Android\
  \ 进程的状态主要由构成其托管应用程序的 Activity 和组件的状态决定。因此，重要的是理解这些 Activity 在应用程序的执行生存期间也会经历不同的状态转换。Activity\
  \ 的当前状态部分取决于它在所谓的“Activity 栈”（Activity Stack）中的位置。\n\n## 12.5 Activity 栈\n\n运行时系统为\
  \ Android 设备上运行的每个应用程序维护一个 Activity 栈。当应用程序启动时，应用程序中第一个启动的 Activity 会被放入栈中。当第二个\
  \ Activity 启动时，它被放置在栈顶，先前的 Activity 则被向下推。栈顶的 Activity 称为活跃 Activity（或运行中的的 Activity）。当活跃\
  \ Activity 退出时，它会被运行时从栈中弹出，栈中紧随下方的 Activity 变为当前的活跃 Activity。例如，栈顶的 Activity 可能因为其负责的任务已完成而退出。或者，用户可能选择了屏幕上的“返回”按钮以返回之前的\
  \ Activity，导致当前 Activity 被运行时系统从栈中弹出并销毁。Android Activity 栈的视觉表示如图 12-2 所示。\n\n如图所示，新的\
  \ Activity 在启动时会被推入栈顶。当前的活跃 Activity 位于栈顶，直到它被新的 Activity 向下推，或者在退出或用户导航到之前的 Activity\
  \ 时从栈中弹出。如果资源变得紧张，运行时将杀死 Activity，从栈底开始。\n\n\n\n\n\n活动栈（Activity Stack）即编程术语中的“后进先出”（LIFO）栈，因为最后一个推入栈的项是第一个被弹出的项。\n\
  \n![android_activity_lifecycle_diagram.png](img/Image2447.jpg)\n图 12-2\n\n### 12.6\
  \ 活动状态\n\n在应用程序执行过程中，活动可以处于以下几种状态之一：\n\n*   **活跃 / 运行（Active / Running）** – 该活动位于活动栈的顶端，是设备屏幕上可见的前台任务，拥有焦点，并且正在与用户进行交互。在资源短缺的情况下，这种活动最不容易被终止。\n\
  *   **已暂停（Paused）** – 该活动对用户可见，但当前没有焦点（通常是因为当前活跃的活动部分遮挡了该活动）。已暂停的活动保留在内存中，仍然连接到窗口管理器，保留所有的状态信息，并在移动到活动栈顶端时可以快速恢复到活跃状态。\n\
  *   **已停止（Stopped）** – 该活动当前对用户可见（换句话说，它在设备显示上被其他活动遮挡）。与已暂停的活动一样，它保留了所有的状态和成员信息，但在低内存情况下被终止的风险更高。\n\
  *   **已杀死（Killed）** – 运行时系统已终止该活动以释放内存，该活动不再存在于活动栈中。如果应用程序需要，必须重启此类活动。\n\n### 12.7\
  \ 配置更改\n\n到本章为止，我们已经查看了 Android 活动状态变化的两个原因，即活动在前台和后台之间的移动，以及运行时系统通过终止活动来释放内存。事实上，还有第三种活动状态可能发生剧烈变化的情景，即涉及设备配置的更改。\n\
  \n默认情况下，任何影响活动外观的配置更改（例如在竖屏和横屏之间旋转设备方向，或更改系统字体设置）都会导致活动被销毁并重建。这背后的逻辑是，此类更改会影响如用户界面布局等资源，而销毁并重建受影响的活动是活动响应配置更改最快的方法。然而，也可以配置活动，使系统不会响应特定的配置更改而重启它。\n\
  \n### 12.8 处理状态变化\n\n从本章可以得很的是，应用程序以及根据定义包含其中的组件在整个生命周期内将经历许多状态。特别重要的一点是，这些状态变化（包括完全终止）是\
  \ Android 运行时根据用户的操作和设备上资源的可用性施加给应用程序的。\n\n但在实践中，这些状态变化并非完全在没有通知的情况下强加的，在大多数情况下，应用程序会收到运行时系统的变化通知，并有机会做出相应的反应。这通常涉及保存或恢复内部数据结构和用户界面状态，从而允许用户在应用程序之间无缝切换，并至少提供多个应用程序并发运行的假象。\n\
  \nAndroid 提供了两种方法来处理应用内对象生命周期状态的变化。一种涉及响应操作系统的状态变化方法调用，将在下一章名为处理 Android 活动状态变化的章节中详细介绍。\n\
  \nGoogle 推荐的另一种方法涉及 Jetpack Android 架构组件中包含的生命周期类，这些类在使用 Jetpack 构建现代 Android 架构中引入，并在标题为与\
  \ Android 生命周期感知组件协作的章节中进行了更详细的解释。\n\n### 12.9 总结\n\n移动设备通常被认为资源受限，特别是在内置内存容量方面。因此，Android\
  \ 操作系统的主要职责之一是确保应用程序以及整个操作系统对用户保持响应。\n\n应用程序托管在 Android 的进程中。每个应用程序反过来又由活动和 `Services`\
  \ 形式的组件组成。\n\nAndroid 运行时系统有权终止进程和单个活动以释放内存。运行时系统在决定一个进程是否为终止的合适候选人时会考虑进程状态。进程的状态在很大程度上取决于该进程托管的活动状态。\n\
  \n本章的核心信息是，应用程序在整个执行生命周期内会经历各种状态，并且对其在 Android 运行时环境中的命运几乎没有控制权。那些不直接与用户交互的进程和活动被运行时系统终止的风险更高。因此，Android\
  \ 应用开发的一个基本要素是应用程序响应来自操作系统的状态变化通知的能力。\n\n## 13. 处理 Android 活动状态变化\n\n根据理解 Android\
  \ 和活动生命周期章节中概述的信息，现在显而易见，组成应用程序的活动和片段在应用程序的生命周期内会经过各种不同的状态。Android 运行时系统实施从一个状态到另一个状态的转换，因此在很大程度上不受活动本身的控制。然而，这并不意味着应用无法响应这些变化并采取适当行动。\n\
  \n本章的主要目标是提供关于活动如何被通知状态变化的高级概述，并概述建议保存或恢复状态信息的区域。在涵盖这些信息后，本章将简要提到活动的生命周期。\n\n##\
  \ 13.1 新旧生命周期技术\n\n直到最近，一直有一种标准方法可以向应用程序中构建生命周期感知能力。这种方法在本章中有所介绍，涉及在活动或片段实例中实现一组方法（每个生命周期状态对应一个），操作系统在对象生命周期状态发生变化时调用这些方法。这种方法自\
  \ Android 操作系统的早期以来一直没有改变，虽然今天仍然是一个可行选择，但它确实有一些局限性，将在本章稍后解释。\n\n随着 Jetpack Android\
  \ 架构组件引入生命周期类，现在有了更好的处理处理方法。这种现代生命周期管理方法（结合 Jetpack 组件和架构指南）将在后面的章节中详细介绍。然而，理解传统的生命周期方法仍然至关重要，原因有两个：首先，作为\
  \ Android 开发人员，你不会完全隔绝传统的生命周期方法，并且仍然会使用其中的一些；更重要的是，理解旧的生命周期处理方法将为以后学习新方法奠下坚实的基础。\n\
  \n### 13.2 Activity 和 Fragment 类\n\n除外，应用程序的活动和片段分别创建为 Android `AppCompatActivity`\
  \ 类和 `Fragment` 类的子类。\n\n\n\n\n\n例如，考虑在“在 Android Studio 中创建示例 Android 应用”中创建并随后转换为使用视图绑定（view\
  \ binding）的 `AndroidSample` 项目。将此项目加载到 `Android Studio` 环境中并找到 `MainActivity.java`\
  \ 文件（位于 `app` -> `java` -> `<your domain>` -> `androidsample`）。找到该文件后，双击将其加载到编辑器中，其内容如下：\n\
  \n```java\npackage com.example.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\nimport androidx.core.view.ViewCompat;\nimport androidx.core.view.WindowInsetsCompat;\n\
  import androidx.activity.EdgeToEdge;\nimport androidx.core.graphics.Insets;\nimport\
  \ android.view.View;\nimport com.example.androidsample.databinding.ActivityMainBinding;\n\
  \nimport java.util.Locale;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        EdgeToEdge.enable(this);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ ViewCompat.setOnApplyWindowInsetsListener(binding.main, (v, insets) -> {\n   \
  \         Insets systemBars = insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  \            v.setPadding(systemBars.left, systemBars.top, systemBars.right, systemBars.bottom);\n\
  \            return insets;\n        });\n    }\n\n    public void convertCurrency(View\
  \ view) {\n        if (!binding.dollarText.getText().toString().isEmpty()) {\n \
  \           float dollarValue = Float.parseFloat(binding.dollarText.getText().toString());\n\
  \            float euroValue = dollarValue * 0.85F;\n            binding.textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", euroValue));\n        } else {\n            binding.textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n在创建项目时，我们指示 `Android Studio` 也创建一个名为 `MainActivity.java`\
  \ 的初始活动。如上面的代码所示，`MainActivity` 类是 `AppCompatActivity` 类的子类。\n\n查看 `AppCompatActivity`\
  \ 类的参考文档可以发现它本身也是 `Activity` 类的子类。在 `Android Studio` 编辑器中使用 `Hierarchy`（层次结构）工具窗口可以验证这一点。将\
  \ `MainActivity.java` 文件加载到编辑器中后，点击类声明行中的 `AppCompatActivity` 并按下键盘快捷键 `Ctrl-H`。随后会弹出\
  \ `Hierarchy` 工具窗口，显示所选类的类层级结构。如图 13-1 所示，`AppCompatActivity` 继承自 `FragmentActivity`\
  \ 类，而 `FragmentActivity` 最终本身也是 `Activity` 类的子类：\n\n![](img/as_class_hierarchy.jpg)\n\
  \n图 13-1\n\n`Activity` 和 `Fragment` 类包含一系列方法，旨在由 `Android runtime` 调用，以便在状态发生变化时通知对象。在本章中，我们将这些方法称为生命周期方法。活动或碎片类需要重写这些方法并实现必要的功能，以对状态变化做出相应响应。\n\
  \n其中一个方法名为 `onCreate()`，再次回到上面的代码段，我们可以看到该方法已经在 `MainActivity` 类中为我们进行了重写和实现。在随后的章节中，我们将探索\
  \ `onCreate()` 以及 `Activity` 和 `Fragment` 类的其他相关生命周期方法。\n\n### 13.3 动态状态 vs. 持久状态\n\
  \n生命周期管理的一个关键目标是确保活动的状态在适当的时间被保存和恢复。当我们在此语境下讨论状态时，指的是活动当前持有的数据以及用户界面的外观。例如，活动可能内存中维护一个数据模型，该模型需要保存到数据库、内容提供程序或文件中。因为它从应用程序的一次调用到另一次调用都持续存在，因此指的是持久状态。\n\
  \n用户界面的外观（例如输入到文本框但尚未提交到程序的文本）被称为动态状态，因为它只在活动的单次调用期间存在。理解这两种状态之间的差异非常重要，因为它们的保存方式以及保存的原因有所不同。保存持久状态的目的是避免活动在后台运行时被杀死时可能导致的数据丢失。另一方面，考虑一个应用程序包含一个活动（我们将其称为\
  \ Activity A），该活动包含一个文本框和单选按钮。在使用应用程序的过程中，用户在文本框中输入了一些文本并选择了某个单选按钮。然而，在执行保存这些更改的操作之前，用户切换到另一个活动，导致\
  \ Activity A 被推入栈并放入后台。一段时间后，运行时系统确定内存不足并杀死 Activity A 以释放资源。在返回 Activity A 到前台时，用户理所当然地期望输入的文本和单选按钮选择已被保留。然而，在这种情况下，将创建一个\
  \ Activity A 的新实例，如果未保存动态状态，之前的用户输入将会丢失。\n\n保存动态状态的主要目的是为了提供一种在前台和后台活动之间进行无缝切换的感知，无论活动是否已被杀死并重启。保存持久状态和动态状态的机制将在后续章节中变得更加明确。\n\
  \n### 13.4 Android 生命周期周期方法\n\n如前所述，`Activity` 和 `Fragment` 类包含若干生命周期方法，在实例状态变化时作为事件处理程序。Android\
  \ Activity 和 Fragment 类支持的主要方法如下：\n\n- `onCreate(Bundle savedInstanceState)`：在首次创建时调用的方法，是执行大多数初始化任务的理想位置。该方法接收一个\
  \ `Bundle` 对象作为参数，其中可能包含来自活动之前调用的动态状态信息（通常与用户界面的状态有关）。\n- `onRestart()`：当活动之前被运行时系统停止后，准备重新启动时调用。\n\
  - `onStart()`：始终在调用 `onCreate()` 或 `onRestart()` 方法后立即调用。此方法指示活动即将变为用户可见。如果活动移动到活动栈顶，此调用将随后跟随\
  \ `onResume()`；如果被另一个活动推入栈中，则跟随 `onStop()`。\n- `onResume()`：指示活动现在处于活动栈顶，并且是用户当前交互的活动。\n\
  \n\n\n\n\n- `onPause()` – 表示上一个活动即将成为前台活动。此调用之后将分别调用 `onResume()` 或 `onStop()` 方法，取决于该活动是返回前台还是变得对用户不可见。在此方法中可以采取某些步骤来存储尚未被应用保存的持久化状态信息。为了避免切换活动时的延迟，应避免在此方法中执行耗耗操作操作，例如将数据存储到数据库或执行网络操作。此方法还应该确保停止任何\
  \ CPU 密集型任务（如动画）。\n- `onStop()` – 活动不再对用户可见。此调用后的两种可能场景是：如果活动再次移动到前台，则调用 `onRestart()`；如果活动被终止，则调用\
  \ `onDestroy()`。\n- `onDestroy()` – 活动即将被销毁，可能是因为活动已完成任务并调用了 `finish()` 方法而主动，也可能是运行时为了释放内存或由于配置更改（如设备方向发生变化）而终止它。需要注意的是，当活动终止时并不总是会调用\
  \ `onDestroy()`。\n- `onConfigurationChanged()` – 当发生配置更改且该活动指示不需要重启时调用。该方法接收一个概述新设备配置的\
  \ `Configuration` 对象，然后由活动负责对更改做出响应。\n\n以下生命周期方法仅适用于 `Fragment` 类：\n\n- `onAttach()`\
  \ - 当 fragment 分配给活动时调用。\n- `onCreateView()` - 用于创建并返回 fragment 的用户界面布局层级结构。\n-\
  \ `onViewCreated()` - 在 `onCreateView()` 返回后调用。\n- `onViewStatusRestored()` - fragment\
  \ 保存的视图层级结构已恢复。\n\n上述上述的生命周期方法外，还有两个专门用于保存和恢复活动动态状态的方法：\n\n- `onRestoreInstanceState(Bundle\
  \ savedInstanceState)` – 如果活动是从之前保存了状态的调用处重启的，此方法会在调用 `onStart()` 方法后立即被调用。与 `onCreate()`\
  \ 一一样，此方法传递了一个包含先前的状态数据的 `Bundle` 对象。通常在在 `onCreate()` 和 `onStart()` 完成活动初始化后，恢复之前的状态更有意义时，就会使用此方法。\n\
  - `onSaveInstanceState(Bundle outState)` – 在活动销毁之前调用，以便保存当前的动态状态（通常与用户界面相关）。该方法接收一个应将状态保存其中的\
  \ `Bundle` 对象，当活动重启时，该对象随后会被传递给 `onCreate()` 和 `onRestoreInstanceState()` 方法。注意，只有当运行时确定需要保存动态状态时，才会调用此方法。\n\
  \n在重写上述方法时，必须记住，除了 `onRestoreInstanceState()` 和 `onSaveInstanceState()` 之外，方法实现必须包含对父类中对应方法的调用。例如，下例方法重写了\
  \ `onRestart()` 方法，但也包含了对父类实例该方法的调用：\n\n```java\nprotected void onRestart() {\n\
  \      super.onRestart();\n      Log.i(TAG, \"onRestart\");\n}\n```\n\n在方法重写中未进行此父类调用将导致运行时在执行期间抛出异常。虽然在\
  \ `onRestoreInstanceState()` 和 `onSaveInstanceState()` 方法中对父类的调用是是可选的（例如，在实现自定义的保存和恢复行为时可以省略），但使用它们有显著的益处，主题将在题为“保存和恢复\
  \ Android 活动的状态”的章节中介绍。\n\n### 13.5 生命周期\n\n最后一个要涵盖的话题涉及活动或 fragment 在执行过程中将经历的整个、可见和前台生命期的概述：\n\
  \n- **整个生命 (Entire Lifetime)** – “整个生命”一词用于描述从首次调用 `onCreate()` 方法到对象终止前调用 `onDestroy()`\
  \ 方法之间发生的一切。\n- **可见生命 (Visible Lifetime)** – 涵盖调用 `onStart()` 和 `onStop()` 之间的执行期间。在此期间，活动或\
  \ fragment 对用户可见，尽管它可能不是用户当前正在交互的对象。\n- **前台生命 (Foreground Lifetime)** – 指调用 `onResume()`\
  \ 和 `onPause()` 方法之间的执行期间。\n\n需要注意的是，活动或 fragment 在整个生命周期可能会多次经过前台和可见生命。\n\n生命周期和生命周期方法的概念在图\
  \ 13-2 中所示：\n\n![android_activity_lifecycle_methods.png](img/Image2446.jpg)\n\n\
  图 13-2\n\n### 13.6 折叠屏设备与多恢复 (Multi-Resume)\n\n如前所述，当活动移动到前台并是用户当前交互的活动时，它被认为处于恢复状态。在标准设备上，应用在任何时候只能有一个活动处于恢复状态，而所有其他活动可能处于暂停或停止状态。\n\
  \n从一段时间以来，Android 已经包含了多窗口支持，允许多个活动同时出现在分屏或自由窗口配置中。虽然最初主要用于大屏平板设备，但随着折叠设备的引入，此功能可能会变得更加流行。\n\
  \n在运行 Android 10 并启用多窗口支持的设备（这种概念被称为多恢复），允许这些可见活动在另一个活动获得焦点时继续运行（例如流媒体内容或更新视觉数据）。尽管多个活动可以处于恢复状态，但这些活动中只有一个会被视为顶层恢复活动（换句话说，用户最近交互的活动）。\n\
  \n通过实现 `onTopResumedActivityChanged()` 回调方法，可以通知活动其获得了或丢失了顶层恢复状态。\n\n## 13.7 禁用配置更改重启\n\
  \n如前所述，活动可以指示在发生某些配置更改时不需要重启。这是通过在项目清单文件中的活动元素中添加 `android:configChanges` 指令来实现的。例如，下面的清单文件片段表明在发生与方向或全设备字体大小相关的配置更改时，该活动不应重启：\n\
  \n```xml\n<activity android:name=\".MainActivity\"\n      android:configChanges=\"\
  orientation|fontScale\"\n      android:label=\"@string/app_name\">\n```\n\n### 13.8\
  \ 生命周期方法的局限性\n\n如本章开头所述，生命周期方法已经使用了多年，并且直到最近，它们是处理活动和 fragment 生命周期周期状态更改的唯一机制。然而，这种方法仍有改进空间。\n\
  \n生命周期方法的一个问题是，它们没有让活动或 fragment 在应用执行期间的任何点轻松地发现其当前的生命周期状态。相反，对象必须内部跟踪状态，或者等待下一次生命周期方法的调用。\n\
  \n\n\n\n此外，这些方法并没有提供一种简单让一个对象观察应用内其他对象的生命周期状态变化。这是一个严肃考虑，因为特定活动（activity）或片段（fragment）的生命周期状态变化可能会影响应用的许多其他对象。\n\
  \n生命周期方法仅适用于 `Fragment` 和 `Activity` 类的子类。因此，无法构建真正感知生命周期的自定义类。\n\n最后，生命周期方法导致大多数生命周期处理代码被写在活动或片段中，这可能导致代码复杂且易出错。理想情况下，这些代码大部分应该存在于受状态变化影响的其他类中。例如，一个流媒体视频应用可能会包含一个专门设计用于管理输入流的类。如果应用在主活动停止时需要暂停流，那么执行该操作的代码应该位于流处理类中，而不是主活动中。\n\
  \n所有这些以及更多问题都可以使用生命周期感知组件（lifecycle-aware components）来解决，该主题将从“使用 Jetpack 构建现代 Android\
  \ 应用架构章节开始介绍。\n\n### 13.9 总结\n\n所有活动都派生自 Android `Activity` 类，而该类又包含了几个生命周期方法，这些方法旨在当活动状态变化时由运行时系统调用。同样，`Fragment`\
  \ 类也包含了几个类似的方法。通过重写这些方法，活动和片段可以响应状态变化，并在必要时采取措施保存并恢复活动及应用程序当前当前。生命周期状态可以被认为有两种形式。持久状态（persistent\
  \ state）是指在应用程序调用之间需要存储的数据（例如，存储到文件或数据库）。另一方面，动态状态（dynamic state）与用户界面的当前显示有关。\n\
  \n尽管生命周期方法具有一些可以使用生命周期感知组件避免的限制，但理解这些方法对于充分理解书中后面介绍的生命周期管理新方法至关重要。\n\n在本章中，我们强调了活动可用的生命周期方法，并涵盖了活动生命周期的概念。在下一章名为“通过示例理解\
  \ Android 活动状态变化的章节中，我们将实现一个示例应用程序，将这些许多理论付诸实践。\n\n## 14. 通过示例理解 Android 活动状态变化\n\
  \n之前的章节详细讨论了构成 Android 应用的活动的各种状态和生命周期。在本章中，我们将通过创建一个示例应用程序，将处理活动状态变化的理论付诸实践。该示例应用程序的目的是提供活动在\
  \ Android 运行时中通过各种状态的真实世界演示。在下一章名为“保存和恢复 Android 活动状态的章节中，本章构建的示例项目将得到扩展，以演示动态活动状态的保存和恢复。\n\
  \n### 14.1 创建状态变化示例项目\n\n此项练习的第一步是创建一个新项目。启动 Android Studio，如有必要，使用 `File -> Close\
  \ Project` 菜单选项关闭任何当前打开的项目，以便显示欢迎界面。\n\n从欢迎界面上选择 `New Project`选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `StateChange`，并指定 `com.ebookfrenzy.statechange`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。完成项目创建过程后，`StateChange` 项目应列在 Android Studio 主窗口左侧的 `Project`\
  \ 工具窗口中。使用章节 11.8 迁移项目到 View Binding 中列出的步骤将项目转换为使用 view binding。\n\n接下来的操作涉及活动用户界面的设计。它存储在一个名为\
  \ `activity_main.xml` 的文件中，该文件应该已经加载到 `Layout Editor` 工具中。如果没有加载，请在 `Project` 工具窗口中导航到它，可以在\
  \ `app -> res -> layout` 文件夹中找到它。一旦找到，双击该文件将其加载到 Android Studio 的 `Layout Editor`\
  \ 工具中。\n\n![](img/as_state_change_main_window.jpg)\n\n图 14-1\n\n### 14.2 设计用户界面\n\
  \n当用户界面布局加载到 `Layout Editor` 工具后，是时候为示例应用程序设计用户界面了。与其当前用户界面设计中的“Hello World!” `TextView`，活动需要一个\
  \ `EditText` 视图。在 `Component Tree` 面板中选择 `TextView` 对象并按下键盘上的 `Delete` 键将其从设计中删除。\n\
  \n从 `Layout Editor` 左侧的 `Palette` 中，选择 `Text` 类别，并从文本组件列表中点击并拖动 `Plain Text` 组件到布局画布上。将组件移动到显示中心，使中心引导线出现并将其放置到位，使布局类似于图\
  \ 14-2。\n\n![](img/as_statechange_ui.jpg)\n\n图 14-2\n\n在使用 `EditText` 小件时，有必要为视图指定\
  \ `input type`。这定义了用户将输入的文本或数据类型。例如，如果 `input type` 设置为 `Phone`，用户将被限制输入数字。或者，如果\
  \ `input type` 设置为 `CapCharacters`，输入将默认为大写字母。`Input type` 设置也可以组合。\n\n对于本示例，我们将使用默认的\
  \ `input type` 支持通用文本输入。以后要选择不同的设置，请在布局中选择 `EditText` 组件，并在 `Attributes` 窗口中找到 `inputType`\
  \ 项。接下来，点击当前设置左侧的标志图标打开选项列表，如下方的图 14-3 所示。`Type` 菜单提供了限制输入为文本、数字、时间和号码的选项。`Variations`\
  \ 菜单为当前选择的类型提供额外选项。例如，对于 `text` 输入有一个用于电子邮件地址的变体。\n\n一旦选择了 `type` 和 `variation`，可以使用标志复选框列表进一步自定义\
  \ `input type`：\n\n![](img/as_text_input_type_menu.jpg)\n\n图 14-3\n\n在 `Attributes`\
  \ 窗口中，将视图的 `id` 改为 `editText` 并点击对话框中的 `Refactor` 按钮。\n\n默认情况下，`EditText` 显示文本为“Name”。在\
  \ `Attributes` 面板中，从 `text` 属性字段删除此内容，使布局中的视图为空。\n\n在继续之前，点击布局编辑器工具栏中的 `Infer Constraints`\
  \ 按钮以添加任何的约束。\n\n### 14.3 重写活动生命周期方法\n\n此时，项目包含一个名为 `MainActivity` 的活动，它派生自 Android\
  \ `AppCompatActivity` 类。该活动的源代码包含在 `MainActivity.java` 文件中，该文件应该已经在编辑器会话中打开，并在编辑器标签栏的标签中表示。如果文件不再打开，请在\
  \ `Project` 工具窗口面板中导航到它（app -> java -> com.ebookfrenzy.statechange -> MainActivity）并双击它将文件加载到编辑器。\n\
  \n\n\n\n\n到为止，Activity 重写的唯一生命周期方法是 `onCreate()` 方法，该方法已实现为在为 Activity 设置用户界面之前调用父类的实例方法。现在我们将修改此方法，以便在每次执行时都在\
  \ Android Studio 的 Logcat 面板中输出一条诊断消息。为此，我们将使用 `Log` 类，这要求我们导入 `android.util.Log`\
  \ 并声明一个标签（tag），以便我们能够在日志输出中过滤这些消息：\n\n```java\npackage com.ebookfrenzy.statechange;\n\
  \nimport android.util.Log;\nimport androidx.annotation.NonNull;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private static final String TAG = \"StateChange\";\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        Log.i(TAG, \"\
  onCreate\");\n    }\n}\n```\n\n下一个任务是重写更多方法，每个方法都包含一个相应的日志调用。这些重写方法可以手动添加，也可以使用\
  \ `Alt-Insert` 快捷键生成，具体参见名为“Android Studio 代码编辑器基础”](#Code_Editor.xhtml__idTextAnchor221)的章节。注意，如果方法是自动生成的，仍然需要手动添加\
  \ `Log` 调用：\n\n```java\n@Override\nprotected void onStart() {\n    super.onStart();\n\
  \    Log.i(TAG, \"onStart\");\n}\n\n@Override\nprotected void onResume() {\n   \
  \ super.onResume();\n    Log.i(TAG, \"onResume\");\n}\n\n@Override\nprotected void\
  \ onPause() {\n    super.onPause();\n    Log.i(TAG, \"onPause\");\n}\n\n@Override\n\
  protected void onStop() {\n    super.onStop();\n    Log.i(TAG, \"onStop\");\n}\n\
  \n@Override\nprotected void onRestart() {\n    super.onRestart();\n    Log.i(TAG,\
  \ \"onRestart\");\n}\n\n@Override\nprotected void onDestroy() {\n    super.onDestroy();\n\
  \    Log.i(TAG, \"onDestroy\");\n}\n\n@Override\nprotected void onSaveInstanceState(@NonNull\
  \ Bundle outState) {\n    super.onSaveInstanceState(outState);\n    Log.i(TAG, \"\
  onSaveInstanceState\");\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ Bundle savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  \    Log.i(TAG, \"onRestoreInstanceState\");\n}\n```\n\n### 14.4 过滤 Logcat 面板\n\n\
  在 `MainActivity.java` 的重写方法中添加代码的目的是将日志信息输出到 Logcat 工具窗口，该窗口通过图 14-4 所示的按钮显示：\n\n\
  ![](img/as_logcat_button.jpg)\n图 14-4\n\nLogcat 工具窗口可以配置为显示与设备或模拟器会话相关的所有事件，也可以限制为与当前所选应用相关的事件。输出也可以限制为仅匹配特定过滤器的日志事件。\n\
  \n当在当前应用运行时显示时，Logcat 工具窗口将如下图 14-5 所示：\n\n![](img/as_logcat_tool_window.jpg)\n\
  图 14-5\n\n上图中标记为 `A` 的菜单允许你选择要显示日志输出的设备或模拟器。此输出出现在标记为 `C` 的输出面板中。可以通过在标记为 `B` 的字段中输入选项来过滤日志输出。默认键设置\
  \ `package:mine` 将输出限制为由当前应用包（在本例中 `com.ebookfrenzy.statechange`）生成的日志消息。留空此字段将允许显示所选设备或模拟器的日志输出，包括由操作系统生成的诊断消息。也可以组合键来进一步过滤输出。例如，我们可以如下所示配置\
  \ Logcat 面板，仅显示与我们的 `StateChange` 标签关联的消息：\n\n`package:mine tag:StateChange`\n\n\
  我们可以通过在键名前面加上一个减号（`-`）来排除输出。除了 `StateChange` 标签外，我们可能还有使用不同标签的诊断消息。为了过滤日志以排除此第二个标签的输出，我们可以输入以下键选项：\n\
  \n`package:mine tag:StateChange -tag:OtherTag`\n\n除了你自己的标签值外，还可以从 Android 内置的一系列预定义标签中进行选择。当你向过滤器输入内容时，Logcat\
  \ 将显示匹配标签的列表，如图 14-6 所示：\n\n![](img/as_logcat_filter.jpg)\n图 14-6\n\n或者，使用 `Ctrl-Space`\
  \ 访问完整的过滤建议列表。`level` 键可根据严重程度控制显示的消息。要过滤掉错误以外的所有消息，将使用以下键：\n\n`level:error`\n\n\
  除了错误外，Logcat 还支持 `verbose`、`info`、`warn` 和 `assert` 级别设置。Logcat 还支持多个面板，每个面板都有自己的过滤器。要添加另一个面板，点击上方图\
  \ 14-5 中标记为 `D` 的 `+` 按钮。使用相应的标签在不同面板之间切换，或通过右键点击当前显示的面板并选择任意项来并排显示它们。在进行之前，关闭其他一个\
  \ Logcat 面板并配置过滤器：\n\n`package:mine tag:StateChange`\n\n### 14.5 运行应用程序\n\n为了获得最佳效果，应该在物理\
  \ Android 设备上运行应用程序。在设备已配置并连接到开发计算机的情况下，点击 Android Studio 工具栏中的运行按钮，如图 14-7 所示：\n\
  \n![](img/as_run_button.jpg)\n图 14-7\n\n如果出现（假设你尚未将其配置为默认目标），请从 `Choose Device`\
  \ 对话框中选择物理 Android 设备或模拟器。Android Studio 构建并安装应用程序后，它将启动。查看 Logcat 面板可以看到到为止触发了哪些方法：\n\
  \n### 14.6 实验 Activity\n\n既然诊断功能运行正常，现在是时候测试应用程序以理解 Activity 生命周期周期状态变化了。首先，考虑 Logcat\
  \ 面板中的初始日志序列：\n\n`onCreate`\n`onStart`\n`onResume`\n\n显然，初始状态变化完全如理解 Android 应用和\
  \ Activity 生命周期所示。然而请注意，并没有调用 `onRestoreInstanceState()`，因为 Android 运行时检测到在这种情况下没有恢复的状态。\n\
  \n点击设备屏幕状态栏上的 `Home` 图标，并在日志中报告的方法调用序列：\n\n`onPause`\n`onStop`\n`onSaveInstanceState`\n\
  \n在这种情况下，运行时注意到 Activity 不再处于前台，用户不可见，并且停止了 Activity，但在此没有提供 Activity 保存动态状态的机会。取决于运行时最终销毁了还是重启了\
  \ Activity，当用户返回 Activity 时，Activity 将通过调用 `onRestart()` 被通知已重启，或者将再次通过创建序列。\n\n\
  \n\n\n\n正如“理解 Android 应用和 Activity 生命周期”中所述，activity 的销毁和重建可以通过对设备进行配置更改来触发，例如从竖屏旋转到横屏。要观察这一过程，请在\
  \ `StateChange` 处于前台时旋转设备。当使用模拟器时，可以使用模拟器工具栏上的旋转按钮来模拟设备旋转。为了完成旋转，可能还需要点击旋转按钮。这显示在设备或模拟器屏幕的底部，如图\
  \ 14-9 所示：\n\n![](img/android_rotate_button.jpg)\n\n图 14-9\n\n日志中产生的方法调用序列应当如下：\n\
  \n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，运行时系统允许 activity 在销毁和重启之前保存其状态。\n\n### 14.7 总结\n\n“一画胜千千言”这句谚语在学习新编程范式的示例中同样适用。在本章中，我们创建了一个\
  \ Android 示例应用程序，以演示 activity 可能会经历的不同生命周期状态。在在本章开发项目期间，我们还查看了从 activity 内部生成诊断日志信息的机制。\n\
  \n在下一章中，我们将扩展 `StateChange` 示例项目，以演示如何保存和恢复 activity 的动态状态。\n\n## 15. 保存和恢复 Android\
  \ Activity 的状态\n\n如果前面的几章节已经实现了目标，那么现在对于在 activity 生命的特定时间点保存和恢复用户界面状态的重要性应该变得更加清晰了。\n\
  \n在本章中，我们将扩展在通过示例理解 Android Activity 状态变化中创建的示例应用程序，以演示运行时系统销毁和重建 activity 时保存和恢复状态涉及的步骤。\n\
  \n保存和恢复动态状态的一个关键组件涉及使用 Android SDK 中的 `Bundle` 类，该主题也本章中涵盖。\n\n### 15.1 保存动态状态\n\
  \n正如我们所学的，activity 可以通过运行时系统调用其 的 `onSaveInstanceState()` 方法实现来保存动态状态信息。作为方法的参数传递的是一个\
  \ `Bundle` 对象的引用，该方法必须向其中存储任何需要保存的动态数据。随后，运行时系统会代表 activity 存储该 `Bundle` 对象，并在调用\
  \ activity 的 `onCreate()` 和 `onRestoreInstanceState()` 方法时作为参数传递。然后，可以在这些方法内部从 `Bundle`\
  \ 对象中检索数据并用于恢复 activity 的状态。\n\n### 15.2 用户界面状态的默认保存\n\n在上一章中，`StateChange` 示例应用程序的诊断输出显示，当运行它的设备旋转得足够大以触发方向变化时，activity\
  \ 会经历几次状态变化。\n\n再次启动 `StateChange` 应用程序，并在执行设备旋转之前在 `EditText` 字段中输入一些文本（在运行 Android\
  \ 9 或更高版本的设备或模拟器上，可能需要点击状态栏中的旋转按钮来完成旋转）。旋转设备后，以下状态变化序列将出现在 `Logcat` 窗口中：\n\n```\n\
  onPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，这导致了 activity 的销毁和重建。然而，检查运行中应用程序的用户界面，应该显示输入到 `EditText` 字段中的文本已被保留。鉴于\
  \ activity 被销毁并重建了，且我们没有添加任何特定代码来确保文本被保存和恢复，这种行为需要一些解释。\n\n事实上，Android SDK 包含的大多数视图小控件已经实现了\
  \ activity 自动重启时所需的保存和恢复状态的行为。启用此行为唯一的要求是 activity 中的 `onSaveInstanceState()` 和\
  \ `onRestoreInstanceState()` 覆盖方法包含对父类对应方法的调用：\n\n```java\n@Override\nprotected\
  \ void onSaveInstanceState(@NonNull Bundle outState) {\n    super.onSaveInstanceState(outState);\n\
  }\n\n@Override\nprotected void onRestoreInstanceState(@NonNull Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n}\n```\n\n可以通过在 XML\
  \ 布局文件中将 `android:saveEnabled` 属性设置为 `false` 来禁用用户界面视图的状态自动保存。对于此示例，我们将禁用用户界面布局中\
  \ `EditText` 视图的自动状态保存机制，然后在应用程序中添加代码来手动保存和恢复视图的状态。\n\n要配置 `EditText` 视图以便在 activity\
  \ 重启时时不保存和恢复状态，请编辑 `activity_main.xml` 文件，使视图的条目内容如下（注意，可以通过“在 Android Studio 中创建\
  \ Android 示例”所述的方法将布局编辑器切换到代码视图模式来编辑 XML）：\n\n```xml\n<EditText\n    android:id=\"\
  @+id/editText\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:ems=\"10\"\n    android:inputType=\"text\"\n    android:saveEnabled=\"\
  false\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n更改后，运行应用程序，输入文本并旋转设备，以验证文本不再保存和恢复。\n\n### 15.3 Bundle 类\n\n\
  对于需要在用户界面视图提供的默认功能之外保存状态的情况，`Bundle` 类提供了一个使用键值对机制存储数据的容器。键的形式为字符串值，而与这些键关联的值可以是原始值或任何实现\
  \ Android `Parcelable` 接口的对象。许多类已经实现了 `Parcelable` 接口。自定义类可以通过实现 `Parcelable` 接口定义的方法集转变为“可序列化的”，这些方法的细节可以在\
  \ Android 文档中找到：\n\n[`developer.android.com/reference/android/os/Parcelable.html`](https://developer.android.com/reference/android/os/Parcelable.html)\n\
  \n`Bundle` 类还包含一组可用于各种数据类型获取和设置键值对的方法，包括原始类型（包括 boolean、char、double 和 float 值）和对象（如\
  \ String 和 CharSequence）。\n\n对于此示例，在我们禁用了 `EditText` 视图的自动保存后，我们需要确保用户输入到 `EditText`\
  \ 字段中的文本被保存到 `Bundle` 对象中并在随后恢复。这将通过分别使用 `Bundle` 类的 `putCharSequence()` 和 `getCharSequence()`\
  \ 方法在 Android 应用程序中手动保存和恢复状态。\n\n### 15.4 保存状态\n\n\n\n\n扩展 StateChange 应用的第一步是确保用户输入的文本已从\
  \ `MainActivity` Activity get `onSaveInstanceState()` 方法中的 `EditText` 组件中提取出来，然后以键值对的形式保存到\
  \ `Bundle` 对象中。\n\n要从 `EditText` 对象中提取文本，我们必须首先在用户界面中识别出该对象。显然，这涉及到在 Activity 的\
  \ Java 代码（包含在 `MainActivity.java` 源代码文件中）与用户界面的 XML 表达式（包含在 `activity_main.xml`\
  \ 资源文件中）之间建立桥梁。为了提取在 `EditText` 组件中输入的文本，我们需要获得对该用户界面对象的访问权限。\n\n用户界面中的每个组件都关联着一个唯一标识符。默认情况下，布局编辑器（Layout\
  \ Editor）工具根据对象类型为新添加的组件构建 `id`。如果布局中包含多个相同类型的视图，则在类型名称后会跟上顺序数字（尽管开发者可以、也应该将其更改为更具意义的内容）。通过在选中\
  \ `activity_main.xml` 文件并显示布局编辑器工具时，检查 Android Studio 主窗口中的组件树（Component Tree）面板可以看到，`EditText`\
  \ 组件被分配了 id `editText`：\n\n![](img/as_component_tree1.jpg)\n\n图 15-1\n\n我们现在可以通过对象的\
  \ `getText()` 方法获取 `editText` 视图包含的文本，该方法反过来会返回当前文本：\n\n```\nCharSequence userText\
  \ = binding.editText.getText();\n```\n\n最后，我们可以使用 `Bundle` 对象的 `putCharSequence()`\
  \ 方法保存文本，将键（这可以是任何字符串值，但在本例中我们将将其声明为“savedText”）和 `userText` 对象作为参数传递：\n\n```java\n\
  bundle.putCharSequence(\"savedText\", userText);\n```\n*(注：由于原文示例代码最后一行未完整显示变量名，此处根据逻辑补全了翻译语境，或按原文意图保持)*\n\
