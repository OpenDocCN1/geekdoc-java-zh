  md: '# Author’s Note


    This book traces the cultural history of what I want to refer to as juice: that
    surge of fluid at the height of sexual pleasure in some women and people with
    vulvlas. Telling this story hasn’t been easy, as attitudes towards these effusions
    and the language used to describe them have forever been in flux. Although lovers
    have delighted in women’s wetness for thousands of years, it later came to be
    known as “seed” or “pollution,” diluted and degraded, reduced to its role in conception
    and fertility.


    For more than a century, the Western world used the term “female ejaculate” for
    this physical phenomenon and its attendant efflux in the last ten years or so,
    there’s been a major shift in our understanding. Recent scientific studies have
    concluded that during sex, people with vulvas may sprout two different fluids
    produced in two different organs. In short, we’re looking at two different things:
    female ejacuation and squirting.


    I believe in manifold genders. The separation of humans into two categories—man
    and woman—with mutually exclusive skills, traits, and behaviors is problematic
    and scientifically obsolete. The concept of a gender binary docks identities,
    hinders diversity, and creates or upholds hierarchies. In exploring the history
    of genital fluids produced by individuals seen as women, I am compelled to work
    with these very categories, as they have been employed for millennia to view,
    comprehend, and explain the world. I use the term female ejaculate as it is one
    of the two bodily functions scientific studies have identified, although I recognize
    the error of linking anatomy to gender. And on making this connection, we wind
    up caught between visibility and invisibility, known and unknown, swarmed by questions.


    For a long time, the patriarchal conception of bodies has employed language to
    obscure certain things by not naming them. “Female ejacuation” and the “female
    prostate” allude directly to their male equivalents, which highlights similarities
    between human bodies. On the other hand, they also perpetuate the notion of a
    gender binary, and attach'
