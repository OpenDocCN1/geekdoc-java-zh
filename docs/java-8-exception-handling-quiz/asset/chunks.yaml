    \ i=10;\n        int j=11;\n        if (j> i)\n            throw new MyException(\"\
    j is greater\");\n    }\n}\n```\n\n| Option | Result |\n|---|---|\n| A | Object\
    \ Exception |\n| B | JVM Error |\n| C | Runtime Exception <----Right Answer |\n\
    | D | Compiler Error |\n"
