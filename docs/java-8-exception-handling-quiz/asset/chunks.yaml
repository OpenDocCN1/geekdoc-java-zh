  trans: "\n\n![](img/cover00319.jpeg)\n\n# 黑书系列\n## Java™ 8 异常处理测试题\n### Mahavir\
    \ DS Rathore\n\n### 版权\n由 Mahavir DS Rathore 编写 Java 8 异常处理测试题。在编写本书时已采取一切预防措施，但作者对错误或遗漏，或因使用本文所包含的信息而导致的损害不承担任何责任。\n\
    \n### 关于作者\n在过去的 18 年里，我一直从事 Java 编程和教学。这本书是我记录自己的知识并与全球的人分享的努力。我可以在世界任何地方提供 Java\
    \ 培训。我的邮箱地址是 `gurumahaveer@gmail.com`。\n\n### 谁应该读这本书？\n本书适用于已经掌握核心 Java（Java\
    \ 标准版）的程序员。\n\n### 致谢\nJava 归 Oracle 所有，其注册商标已获得认可。\n\n### 献辞\n致 Java 语言的发明者。\n\
    \n## 目录\n\n| 序号 | 章节 | 超链接 |\n| :--- | :--- | :--- |\n| 1 | Java 环境搭建 | 前往 |\n\
    | 2 | 什么是异常？ | 前往 |\n| 3 | 什么是异常处理？ | 前往 |\n| 4 | Java 异常层次结构 | 前往 |\n| 5 | Try\
    \ 和 Catch 块 | 前往 |\n| 6 | 异常处理 API | 前往 |\n| 7 | 多重 Catch | 前往 |\n| 8 | 多种异常 |\
    \ 前往 |\n| 9 | Finally 块 | 前往 |\n| 10 | Finally 和 return 关键字 | 前往 |\n| 11 | 检查点异常与未检查异常\
    \ | 前往 |\n| 12 | 嵌套异常 | 前往 |\n| 13 | Throw 关键字 | 前往 |\n| 14 | 异常链 | 前往 |\n| 15\
    \ | Try with Resource | 前往 |\n| 16 | 重写异常 | 前往 |\n| 17 | 自定义异常 | 前往 |\n\n# 第 1\
    \ 章：软件安装\n\n**Q.1: Java 的最新版本是什么？**\n- A | 7\n- B | 6\n- C | 9\n- D | 8\n(正确答案：D)\n\
    \n**Q.2: JRE 的含义是 ……..................**\n- A | Java Robust Engine\n- B | Java\
    \ Required Engine\n- C | Java Runtime Engine\n- D | Java Runnable Engine\n(正确答案：C)\n\
    \n**Q. 3: JDK 的含义是 ……..................**\n- A | Java Debugging Kit\n- B | Java\
    \ Development Kit\n- C | Java Documentation Kit\n- D | Java Database Kit\n(正确答案：B)\n\
    \n**Q. 4: 编译和执行 Java 程序需要 …….............**\n- A | JDK\n- B | JRE\n- C | JME\n\
    - D | JEE\n(正确答案：A)\n\n**Q.5: 设置了哪个环境变量（Windows 操作系统）以便在命令行访问 Java 编译器和 Java 解释器？**\n\
    - A | CLASSPATH\n- B | JAVAHOME\n- C | PATH\n- D | HOME\n(正确答案：C)\n\n**Q.6: 仅执行\
    \ Java 程序最少需要 ……................**\n- A | JME\n- B | JDK\n- C | JEE\n- D | JRE\n\
    (正确答案：D)\n\n**Q.7: Java 解释器的命令（Windows 操作系统）是 ……..........**\n- A | Javaip.exe\n\
    - B | Javac.exe\n- C | Java.exe\n- D | Javai.exe\n(正确答案：C)\n\n**Q.8: Java 编译器的命令（Windows\
    \ 操作系统）是 ……..........**\n- A | Java.exe\n- B | Javacompiler.exe\n- C | Javacomp.exe\n\
    - D | Javac.exe\n(正确答案：D)\n\n**Q.9: 32 位 JDK（Windows 操作系统）默认安装在哪个文件夹下？**\n- A\
    \ | `C:\\Program Files\\`\n- B | `C:\\Windows\\`\n- C | `C:\\Java`\n- D | `C:\\\
    Program Files (x86)\\`\n(正确答案：D)\n\n**Q.10: 64 位 JDK（Windows 操作系统）默认安装在哪个文件夹下？**\n\
    - A | `C:\\Program Files\\`\n- B | `C:\\Windows\\`\n- C | `C:\\Java`\n- D | `C:\\\
    Program Files (x86)\\`\n(正确答案：A)\n\n### 第 1 章答案\n| 题号 | 答案 | 解析 |\n| :--- | :---\
    \ | :--- |\n| 1 | D | Java 的最新版本是 8。 |\n| 2 | C | `JRE` 代表 Java Runtime Engine。\
    \ |\n| 3 | B | `JDK` 代表 Java Development Kit。 |\n| 4 | A | 编译和执行 Java 程序需要 JDK。\
    \ |\n| 5 | C | `PATH` 环境变量包含 Java 命令的位置。 |\n| 6 | D | 仅执行程序时只需要 JRE。 |\n| 7 |\
    \ C | `java.exe` 是激活 Java 解释器的命令。 |\n| 8 | D | `javac.exe` 是激活 Java 编译器的命令。 |\n\
    | 9 | D | Windows 操作系统上的 32 位应用程序默认安装在 `C:\\Program Files (x86)\\`。 |\n| 10 |\
    \ A | Windows 操作系统上的 64 位应用程序默认安装在 `C:\\Program Files\\`。 |\n\n# 第 2 章：什么是异常？\n\
