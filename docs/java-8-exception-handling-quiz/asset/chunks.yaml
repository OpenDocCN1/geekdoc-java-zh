  trans: "\n\n# 第 17 章：自定义异常\n\n```java\nclass Shape {\n    void draw () throws Exception\
    \ {\n        System.out.println (\"Drawing shape\");\n    }\n}\nclass Circle extends\
    \ Shape {\n    void draw() throws Exception {\n        System.out.println(\"Drawing\
    \ Circle\");\n    }\n}\nclass Program {\n    public static void main(String args[])\
    \ throws Exception {\n        Circle obj = new Circle();\n        obj.draw();\n\
    \    }\n}\n```\n\n**Q.5: 输出是什么？**\n\n| 选项 | 结果 |\n|---|---|\n| A | 编译错误 |\n| B\
    \ | 无输出 |\n| C | Drawing shape |\n| D | Drawing Circle <----正确答案 |\n\n---\n\n\
    ```java\nclass Shape {\n    void draw () throws Exception {\n        System.out.println(\"\
    Drawing shape\");\n    }\n}\nclass Circle extends Shape {\n    void draw() throws\
    \ RuntimeException {\n        System.out.println(\"Drawing Circle\");\n    }\n\
    }\nclass Program {\n    public static void main(String args[]) throws Exception\
    \ {\n        Circle obj = new Circle();\n        obj.draw();\n    }\n}\n```\n\n\
    **Q.5: 输出是什么？**\n\n| 选项 | 结果 |\n|---|---|\n| A | 编译错误 <----正确答案 |\n| B | 无输出 |\n\
    | C | Drawing shape |\n| D | Drawing Circle |\n\n### 重写方法中的异常规则\n\n1. 如果父类方法 `throws`\
    \ 一个异常，则子类可以 `throws` 相同的异常或该异常的子类。\n2. 如果父类方法没有 `throws` 任何异常，则子类的重写方法可以 `throws`\
    \ 未检异常（unchecked exception）。\n3. 如果方法声明了受检异常（checked exception），则它必须被抛出（`throw`）。\n\
    \n### 答案\n\n| 题号 | 答案 | 解析 |\n|---|---|---|\n| 1 | D | 经计算输出为：Drawing Circle |\n\
    | 2 | A | 编译错误 |\n| 3 | A | 编译错误 |\n| 4 | D | 经计算输出为：Drawing Circle |\n| 5 | D\
    \ | 经计算输出为：Drawing Circle |\n\n![](img/image00318.jpeg)\n\n---\n\n### Q.1: 如何创建自定义的受检异常？\n\
    \n| 选项 | 结果 |\n|---|---|\n| A | 继承自 Error 类 |\n| B | 继承自 Throwable 类 <----正确答案\
    \ |\n| C | 继承自 RuntimeException 类 |\n| D | 继承自 Object 类 |\n\n### Q.2: 如何创建自定义的未检异常？\n\
    \n| 选项 | 结果 |\n|---|---|\n| A | 继承自 Error 类 |\n| B | 继承自 Exception 类 |\n| C |\
    \ 继承自 RuntimeException 类 <----正确答案 |\n| D | 继承自 Object 类 |\n\n### Q.3: 输出是什么？\n\
    \n```java\nclass MyException extends Object {\n    MyExcetion(String str) {\n\
    \        super(str);\n    }\n}\nclass Program {\n    public static void main(String\
    \ args[]){ {\n        int i=10;\n        int j=11;\n        if (j> i)\n      \
    \      throw new MyException(\"j is greater\");\n    }\n}\n```\n\n| 选项 | 结果 |\n\
    |---|---|\n| A | 编译错误 <----正确答案 |\n| B | 运行时异常 |\n| C | J is greater |\n\n###\
    \ Q.4: 输出是什么？\n\n```java\nclass MyException extends Exception {\n    MyException(String\
    \ str) {\n        super(str);\n    }\n}\nclass Program {\n    public static void\
    \ main(String args[]){\n        int i=0;\n        int j=1;\n        if (j> i)\n\
    \            throw new MyException(\"j is greater\");\n    }\n}\n```\n\n| 选项 |\
    \ 结果 |\n|---|---|\n| A | 编译错误 |\n| B | 运行时异常 |\n| C | J is greater |\n| D | 以上都不是\
    \ <----正确答案 |\n\n### Q.5: 输出是什么？\n\n```java\nclass MyException extends RuntimeException\
    \ {\n    MyException(String str) {\n        super(str);\n    }\n}\nclass Program\
    \ {\n    public static void main(String args[]){\n        int i=10;\n        int\
    \ j=1;\n        if (j> i)\n            throw new MyException(\"j is greater\"\
    );\n    }\n}\n```\n\n| 选项 | 结果 |\n|---|---|\n| A | RuntimeException <----正确答案\
    \ |\n| B | 编译错误 |\n| C | JVM Error |\n| D | 以上都不是 |\n\n### Q.6: 输出是什么？\n\n```java\n\
    class MyException extends Exception {\n    MyException(String str) {\n       \
    \ super(str);\n    }\n}\nclass Program {\n    public static void main(String args[])\
    \ throws Exception{\n        int i=10;\n        int j=11;\n        if (j> i)\n\
    \            throw new MyException(\"j is greater\");\n    }\n}\n```\n\n| 选项 |\
    \ 结果 |\n|---|---|\n| A | Object Exception |\n| B | JVM Error |\n| C | Runtime\
    \ Exception <----正确答案 |\n| D | 编译错误 |\n\n"
