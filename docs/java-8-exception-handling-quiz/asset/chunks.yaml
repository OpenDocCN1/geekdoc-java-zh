    \ output |\n| C | Drawing shape |\n| D | Drawing Circle <----Right Answer |\n\n\
    ---\n\n```java\nclass Shape {\n    void draw () throws Exception {\n        System.out.println(\"\
    Drawing shape\");\n    }\n}\nclass Circle extends Shape {\n    void draw() throws\
    \ RuntimeException {\n        System.out.println(\"Drawing Circle\");\n    }\n\
    }\nclass Program {\n    public static void main(String args[]) throws Exception\
    \ {\n        Circle obj = new Circle();\n        obj.draw();\n    }\n}\n```\n\n\
    **Q.5: What is the output?**\n\n| Option | Result |\n|---|---|\n| A | Compiler\
    \ error <----Right Answer |\n| B | No output |\n| C | Drawing shape |\n| D | Drawing\
    \ Circle |\n\n### Rules for exceptions in overridden methods\n\n1. If the super\
    \ class method `throws` an exception then child class can `throws` the same exception\
    \ or child class of that exception.\n2. If super class method does not `throws`\
    \ any exception then the child class overridden method can `throws` unchecked\
    \ exception.\n3. If checked exception is declared for a method then it should\
    \ be raised (`throw`).\n\n### Answers\n\n| Q.No | Ans | Explanation |\n|---|---|---|\n\
    | 1 | D | By computation the output is : Drawing Circle |\n| 2 | A | Compiler\
    \ Error |\n| 3 | A | Compiler Error |\n| 4 | D | By computation the output is\
    \ : Drawing Circle |\n| 5 | D | By computation the output is : Drawing Circle\
    \ |\n\n![](Images/image00318.jpeg)\n\n---\n\n### Q.1: How to create user defined\
    \ checked exception?\n\n| Option | Result |\n|---|---|\n| A | Derive from Error\
    \ class |\n| B | Derive from Throwable class <----Right Answer |\n| C | Derive\
    \ from RuntimeException class |\n| D | Derive from Object class |\n\n### Q.2:\
    \ How to create user defined unchecked exception?\n\n| Option | Result |\n|---|---|\n\
    | A | Derive from Error class |\n| B | Derive from Exception class |\n| C | Derive\
    \ from RuntimeException class <----Right Answer |\n| D | Derive from Object class\
    \ |\n\n### Q.3: What is the output?\n\n```java\nclass MyException extends Object\
    \ {\n    MyExcetion(String str) {\n        super(str);\n    }\n}\nclass Program\
    \ {\n    public static void main(String args[]){ {\n        int i=10;\n      \
    \  int j=11;\n        if (j> i)\n            throw new MyException(\"j is greater\"\
    );\n    }\n}\n```\n\n| Option | Result |\n|---|---|\n| A | Compiler Error <----Right\
    \ Answer |\n| B | Runtime Exception |\n| C | J is greater |\n\n### Q.4: What is\
    \ the output?\n\n```java\nclass MyException extends Exception {\n    MyException(String\
    \ str) {\n        super(str);\n    }\n}\nclass Program {\n    public static void\
    \ main(String args[]){\n        int i=0;\n        int j=1;\n        if (j> i)\n\
    \            throw new MyException(\"j is greater\");\n    }\n}\n```\n\n| Option\
    \ | Result |\n|---|---|\n| A | Compiler Error |\n| B | Runtime Exception |\n|\
    \ C | J is greater |\n| D | None of the above <----Right Answer\n\n### Q.5: What\
    \ is the output?\n\n```java\nclass MyException extends RuntimeException {\n  \
