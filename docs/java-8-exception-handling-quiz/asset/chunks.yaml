    \        if (j> i)\n            throw new MyException(\"j is greater\");\n   \
    \ }\n}\n```\n\n| Option | Result |\n|---|---|\n| A | RuntimeException <----Right\
    \ Answer |\n| B | Compiler Error |\n| C | JVM Error |\n| D | None of the above\
    \ |\n\n### Q.6: What is the output?\n\n```java\nclass MyException extends Exception\
