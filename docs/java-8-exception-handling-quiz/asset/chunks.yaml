- fmt: "\n![](Images/cover00319.jpeg)\n\n# Black Book Series\n## Java™ 8 Exception\
    \ Handling Quiz\n### Mahavir DS Rathore\n\n### Copyright\nJava 8 Exception handling\
    \ quiz by Mahavir DS Rathore. While every precaution has been taken in the preparation\
    \ of this book the author assume No responsibility for errors or omissions, or\
    \ for damages resulting from the use of the information contained herein.\n\n\
    ### About the author\nI have has programming & teaching Java for last 18 years.\
    \ This book is an effort to document my knowledge to share with everyone across\
    \ the world. I am available to do training on Java anywhere in the world. My email\
    \ id is `gurumahaveer@gmail.com`\n\n### Who should read the book?\nThis book is\
    \ for programmers who already know Core Java (Java Standard Edition).\n\n### Acknowledgement\n\
    Java is owned by Oracle and trademark is acknowledged.\n\n### Dedication\nTo the\
    \ inventors of the Java Language.\n\n## Table of Content\n\n| Sl.No | Chapter\
    \ | HyperLink |\n| :--- | :--- | :--- |\n| 1 | Java Setup | [Go](#part0000.xhtml_Chapter1)\
    \ |\n| 2 | What is Exception? | [Go](#part0000.xhtml_Chapter2) |\n| 3 | What is\
    \ Exception Handling? | [Go](#part0000.xhtml_Chapter3) |\n| 4 | Java Exception\
    \ Hierarchy | [Go](#part0000.xhtml_Chapter4) |\n| 5 | Try and Catch Block | [Go](#part0000.xhtml_Chapter5)\
    \ |\n| 6 | Exception Handling API | [Go](#part0000.xhtml_Chapter6) |\n| 7 | Multiple\
    \ Catch | [Go](#part0000.xhtml_Chapter7) |\n| 8 | Multiple Exceptions | [Go](#part0000.xhtml_Chapter8)\
    \ |\n| 9 | Finally Block | [Go](#part0000.xhtml_Chapter9) |\n| 10 | Finally and\
    \ return keyword | [Go](#part0000.xhtml_Chapter10) |\n| 11 | Checked and Unchecked\
    \ Exception | [Go](#part0000.xhtml_Chapter11) |\n| 12 | Nested Exception | [Go](#part0000.xhtml_Chapter12)\
    \ |\n| 13 | Throw Keyword | [Go](#part0000.xhtml_Chapter13) |\n| 14 | Exception\
    \ Chaining | [Go](#part0000.xhtml_Chapter14) |\n| 15 | Try with Resource | [Go](#part0000.xhtml_Chapter15)\
    \ |\n| 16 | Overriding Exception | [Go](#part0000.xhtml_Chapter16) |\n| 17 | User\
    \ Defined Exception | [Go](#part0000.xhtml_Chapter17) |\n\n# Chapter 1: Software\
    \ Setup\n\n**Q.1: What is the latest version of Java?**\n- A | 7\n- B | 6\n- C\
    \ | 9\n- D | 8\n(Right Answer: D)\n\n**Q.2: JRE stands for …..................**\n\
    - A | Java Robust Engine\n- B | Java Required Engine\n- C | Java Runtime Engine\n\
    - D | Java Runnable Engine\n(Right Answer: C)\n\n**Q. 3: JDK stands for …..................**\n\
    - A | Java Debugging Kit\n- B | Java Development Kit\n- C | Java Documentation\
    \ Kit\n- D | Java Database Kit\n(Right Answer: B)\n\n**Q. 4: To compile and execute\
    \ Java application …............. is needed**\n- A | JDK\n- B | JRE\n- C | JME\n\
    - D | JEE\n(Right Answer: A)\n\n**Q.5: Which environment variable (Windows OS)\
    \ is set for accessing java compiler and java interpreter at command line?**\n\
    - A | CLASSPATH\n- B | JAVAHOME\n- C | PATH\n- D | HOME\n(Right Answer: C)\n\n\
    **Q.6: To just execute a Java application …................ is needed at the minimum.**\n\
    - A | JME\n- B | JDK\n- C | JEE\n- D | JRE\n(Right Answer: D)\n\n**Q.7: The command\
    \ for java interpreter (Windows OS) is …..........**\n- A | Javaip.exe\n- B |\
    \ Javac.exe\n- C | Java.exe\n- D | Javai.exe\n(Right Answer: C)\n\n**Q.8: The\
    \ command for Java compiler (Windows OS) is …..........**\n- A | Java.exe\n- B\
    \ | Javacompiler.exe\n- C | Javacomp.exe\n- D | Javac.exe\n(Right Answer: D)\n\
    \n**Q.9: In which folder is 32-bit JDK (Windows OS) is installed by default?**\n\
    - A | `C:\\Program Files\\`\n- B | `C:\\Windows\\`\n- C | `C:\\Java`\n- D | `C:\\\
    Program Files (x86)\\`\n(Right Answer: D)\n\n**Q.10: In which folder is 64-bit\
    \ JDK (Windows OS) installed by default?**\n- A | `C:\\Program Files\\`\n- B |\
    \ `C:\\Windows\\`\n- C | `C:\\Java`\n- D | `C:\\Program Files (x86)\\`\n(Right\
    \ Answer: A)\n\n### Answers Chapter 1\n| Q.No | Ans | Explanation |\n| :--- |\
    \ :--- | :--- |\n| 1 | D | The latest version of Java is 8. |\n| 2 | C | `JRE`\
    \ stands for Java Runtime Engine. |\n| 3 | B | `JDK` stands for Java Development\
    \ Kit. |\n| 4 | A | `JDK` is required for a Java program to be compiled and executed.\
    \ |\n| 5 | C | `PATH` environment variable contains the location of Java commands.\
    \ |\n| 6 | D | To just execute a application only JRE is required. |\n| 7 | C\
    \ | `java.exe` is the command to activate Java interpreter. |\n| 8 | D | `javac.exe`\
    \ is the command to activate Java compiler. |\n| 9 | D | 32-bit application on\
    \ Windows OS is installed in `C:\\Program Files (x86)\\` by default. |\n| 10 |\
    \ A | 64-bit application on Windows OS is installed in `C:\\Program Files\\` by\
    \ default. |\n\n# Chapter 2: What is Exception?\n\n**Q.1: …........ at Runtime.**\n\
    - A | Error\n- B | Exception\n- C | Trigger\n- D | None of the above\n(Right Answer:\
    \ B)\n\n**Q.2: Runtime error is also called as …...........**\n- A | Error\n-\
    \ B | Compiler error\n- C | Exception\n- D | None of the above\n(Right Answer:\
    \ C)\n\n**Q.3: Syntax error yields into a ..................**\n- A | Runtime\
    \ error\n- B | Exception\n- C | Compiler error\n- D | All of the above\n(Right\
    \ Answer: C)\n\n**Q.4: Dividing an integer by zero yields into a ........**\n\
    - A | Compiler error\n- B | JVM error\n- C | Nothing\n- D | Exception\n(Right\
    \ Answer: D)\n\n**Q.5: A missing semi-colon for an instruction yields into a ...................**\n\
    - A | Exception\n- B | Runtime error\n- C | Compiler error\n- D | JVM error\n\
    (Right Answer: C)\n\n**Q.6: What will be the output?**\n```java\nclass Program\
    \ {\n    public static void main(String args[]) {\n        String ar = new String[1];\n\
    \        ar[2] =\"Ram\";\n        System.out.println(ar[0]);\n    }\n}\n```\n\
    - A | Compiler error\n- B | Exception\n- C | No error\n- D | JVM\n(Right Answer:\
    \ B)\n\n**Q.7: An exception can occur when …...........**\n- A | `throw` is called\n\
    - B | Abnormal code is executed\n- C | Asynchronous error happen\n- D | All of\
    \ the above\n(Right Answer: D)\n\n### Answers Chapter 2\n| Q.No | Ans | Explanation\
    \ |\n| :--- | :--- | :--- |\n| 1 | B | Exception occur at Runtime i.e. during\
    \ program execution. |\n| 2 | C | Another name for Runtime error is Exception.\
    \ |\n| 3 | C | Syntax error yields into a Compiler error. |\n| 4 | D | Division\
    \ by zero yields into `ArithmeticException`. |\n| 5 | C | Missing semi-colon is\
    \ captured as a Compiler error. |\n| 6 | B | Exception `ArrayOutOfBounds` occur.\
    \ |\n| 7 | D | An exception can occur when any of below is called a. `throw` b.\
    \ Abnormal code is executed c. Asynchronous error |\n\n# Chapter 3: What is Exception\
    \ Handling?\n\n**Q.1: .......... helps in avoiding runtime crash of a program.**\n\
    - A | Error handling\n- B | Exception handling\n- C | Compiler handling\n- D |\
    \ Database handling\n(Right Answer: B)\n\n**Q.2: Which of the following is not\
    \ a keyword?**\n- A | Throw\n- B | Throws\n- C | throwing\n- D | Try\n(Right Answer:\
    \ C)\n\n**Q.3: Which of the following is not a keyword?**\n- A | Try\n- B | Catch\n\
    - C | except\n- D | Finally\n(Right Answer: C)\n\n**Q.4: How to raise an exception?**\n\
    - A | throws\n- B | Throw\n- C | except\n- D | Raise\n(Right Answer: B)\n\n**Q.5:\
    \ Who handles unhandled exceptions?**\n- A | JVM\n- B | OS\n- C | catch\n- D |\
    \ finally\n(Right Answer: A)\n\n### Answers Chapter 3\n| Q.No | Ans |  |\n| :---\
    \ | :--- | :--- |\n| 1 | B | Exception handling is used for avoiding crash of\
    \ a program. |\n| 2 | C | `throwing` is not a keyword in Java. |\n| 3 | C | `except`\
    \ is not keyword in Java. |\n| 4 | B | The `throw` keyword is used for raising\
    \ an exception. |\n"
