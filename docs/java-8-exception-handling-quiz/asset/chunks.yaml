    \ |\n| D | `getReason()` |\n| | <----正确答案 |\n\n### 答案\n| 题号 | 答案 | 解释 |\n| :---\
    \ | :--- | :--- |\n| 1 | B | `Throwable` 类具有链式的基础设施。 |\n| 2 | D | `getCause()`\
    \ 方法在 `Throwable` 中声明。 |\n| 3 | A | 有效的构造函数：`Throwable(String, Throwable)` |\n\
    | 4 | D | `initCause()` 初始化异常的因。 |\n| 5 | C | 有效的构造函数：`Throwable(Throwable)` |\n\
    | 6 | B | `initCause()` 方法在 `Throwable` 中声明。 |\n| 7 | C | `getCause()` 返回 'throwable'\
    \ 的原因。 |\n\n![](img/image0318.jpeg)\n\n# 第 15 章：Try with Resource\n\n### Q.1:\
    \ 'try with resource' 在哪个 Java 版本中引入的？\n| A | 5 |\n| B | 6 |\n| C | 7 |\n| D |\
    \ 8 |\n| | <----正确答案 |\n\n### Q.2: 在单个 try 块中可以创建多少资源？\n| A | 无 |\n| B | 2 |\n\
    | C | 3 |\n| D | 任意 |\n| | <----正确答案 |\n\n### Q.3: 对象必须实现 ..... 才能在 try with resource\
    \ 块中使用。\n| A | `Autoable` |\n| B | `Closeable` |\n| C | `Try` |\n| D | `Closed`\
    \ |\n| | <----正确答案 |\n\n### Q.4: `Autoable` 接口的方法是？ |\n| A | `close()` |\n| B\
    \ | `close()` |\n| C | `finish()` |\n| D | `end()` |\n| | <----正确答案 |\n\n### Q.5:\
    \ `Closeable` 接口的方法是？ |\n| A | `close()` |\n| B | `closing()` |\n| C | `finish()`\
    \ |\n| D | `end()` |\n| | <----正确答案 |\n\n### Q.6: 资源在 try with resource 中以 .........\
    \ 顺序关闭。 |\n| A | Custom |\n| B | Forward |\n| C | Reverse |\n| D | Conditional\
    \ |\n| | <----正确答案 |\n\n### Q.7: 输出输出是什么？\n```java\nimport java.io.*;\nclass Shape\
    \ implements Closeable {\n    public void close() {\n        System.out.println(\"\
    Shape is closed\");\n    }\n}\nclass Program {\n    public static void main(String\
    \ args[]) {\n        try (Shape obj = new Shape()) {\n        } catch (Exception\
    \ e) {\n            System.out.println(\"Exception happened\");\n        }\n \
    \   }\n}\n```\n| 选项 | 结果 |\n| :--- | :--- |\n| A | 无输出 |\n| B | 编译错误 |\n| C |\
    \ Shape is closed |\n| D | Exception happened |\n| | <----正确答案 |\n\n*(注：由于原始文本中\
