- "# Java 8 异常处理测验\n\n\n\n![](img/cover00319.jpeg)\n\n\n\n## 关于作者\n在过去的 18 年里，我一直从事\
  \ Java 编程和教学。这本书是我记录自己的知识并与全球的人分享的努力。我可以在世界任何地方提供 Java 培训。我的邮箱地址是 `gurumahaveer@gmail.com`。\n\
  \n## 谁应该读这本书？\n本书适用于已经掌握核心 Java（Java 标准版）的程序员。\n\n## 致谢\nJava 归 Oracle 所有，其注册商标已获得认可。\n\
  \n## 献辞\n致 Java 语言的发明者。\n\n\n# 第 1 章：软件安装\n\n**Q.1: Java 的最新版本是什么？**\n- A | 7\n\
