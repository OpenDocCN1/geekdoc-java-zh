  - A | `C:\\Program Files\\`\n- B | `C:\\Windows\\`\n- C | `C:\\Java`\n- D | `C:\\\
  Program Files (x86)\\`\n(正确答案：A)\n\n## 第 1 章答案\n| 题号 | 答案 | 解析 |\n| :--- | :---\
  \ | :--- |\n| 1 | D | Java 的最新版本是 8。 |\n| 2 | C | `JRE` 代表 Java Runtime Engine。\
