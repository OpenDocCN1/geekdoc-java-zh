  \ Windows 操作系统上的 64 位应用程序默认安装在 `C:\\Program Files\\`。 |\n\n# 第 2 章：什么是异常？\n\n**Q.1:\
  \ ……........ 在运行时发生。****\n- A | 错误 (Error)\n- B | 异常 (Exception)\n- C | 触发 (Trigger)\n\
  - D | 无 (None)\n\n**Q.2: 运行时错误被称为 ……...........**\n- A | 错误\n- B | 异常\n- C | 触发\n\
