  \n\n\n\n\n# 第 17 章：自定义异常\n\n```java\nclass Shape {\n    void draw () throws Exception\
  \ {\n        System.out.println (\"Drawing shape\");\n    }\n}\nclass Circle extends\
  \ Shape {\n    void draw() throws Exception {\n        System.out.println(\"Drawing\
  \ Circle\");\n    }\n}\nclass Program {\n    public static void main(String args[])\
  \ throws Exception {\n        Circle obj = new Circle();\n        obj.draw();\n\
  \    }\n}\n```\n\n**Q.5: 输出是什么？**\n\n| 选项 | 结果 |\n|---|---|\n| A | 编译错误 |\n| B |\
  \ 无输出 |\n| C | Drawing shape |\n| D | Drawing Circle <----正确答案 |\n\n---\n\n```java\n\
  class Shape {\n    void draw () throws Exception {\n        System.out.println(\"\
  Drawing shape\");\n    }\n}\nclass Circle extends Shape {\n    void draw() throws\
  \ RuntimeException {\n        System.out.println(\"Drawing Circle\");\n    }\n}\n\
  class Program {\n    public static void main(String args[]) throws Exception {\n\
  \        Circle obj = new Circle();\n        obj.draw();\n    }\n}\n```\n\n**Q.5:\
  \ 输出是什么？**\n\n| 选项 | 结果 |\n|---|---|\n| A | 编译错误 <----正确答案 |\n| B | 无输出 |\n| C |\
  \ Drawing shape |\n| D | Drawing Circle |\n\n## 重写方法中的异常规则\n\n1. 如果父类方法 `throws`\
  \ 一个异常，则子类可以 `throws` 相同的异常或该异常的子类。\n2. 如果父类方法没有 `throws` 任何异常，则子类的重写方法可以 `throws`\
  \ 未检异常（unchecked exception）。\n3. 如果方法声明了受检异常（checked exception），则它必须被抛出（`throw`）。\n\
  \n## 答案\n\n| 题号 | 答案 | 解析 |\n|---|---|---|\n| 1 | D | 经计算输出为：Drawing Circle |\n\
  | 2 | A | 编译错误 |\n| 3 | A | 编译错误 |\n| 4 | D | 经计算输出为：Drawing Circle |\n| 5 | D |\
  \ 经计算输出为：Drawing Circle |\n\n![](img/image00318.jpeg)\n\n---\n\n## Q.1: 如何创建自定义的受检异常？\n\
