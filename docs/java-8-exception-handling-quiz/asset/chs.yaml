  - A | JDK\n- B | JRE\n- C | JME\n- D | JEE\n(正确答案：A)\n\n**Q.5: 设置了哪个环境变量（Windows\
  \ 操作系统）以便在命令行访问 Java 编译器和 Java 解释器？**\n- A | CLASSPATH\n- B | JAVAHOME\n- C | PATH\n\
  - D | HOME\n(正确答案：C)\n\n**Q.6: 仅执行 Java 程序最少需要 ……................**\n- A | JME\n\
  - B | JDK\n- C | JEE\n- D | JRE\n(正确答案：D)\n\n**Q.7: Java 解释器的命令（Windows 操作系统）是 ……..........**\n\
  - A | Javaip.exe\n- B | Javac.exe\n- C | Java.exe\n- D | Javai.exe\n(正确答案：C)\n\n\
  **Q.8: Java 编译器的命令（Windows 操作系统）是 ……..........**\n- A | Java.exe\n- B | Javacompiler.exe\n\
  - C | Javacomp.exe\n- D | Javac.exe\n(正确答案：D)\n\n**Q.9: 32 位 JDK（Windows 操作系统）默认安装在哪个文件夹下？**\n\
