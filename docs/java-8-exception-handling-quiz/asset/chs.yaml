  \ C | 编译器\n- D | 无\n(正确答案：C)\n\n**Q.4: 整数除以零产生 ........**\n- A | 编译器\n- B | 运行时\n\
  - C | 无\n- D | 异常\n(正确答案：D)\n\n**Q.5: 缺少分号会导致指令产生 ……..**\n- A | 异常\n- B | 运行时错误\n\
  - C | 编译器错误\n- D | 虚拟机\n(正确答案：C)\n\n**Q.6: 输出是什么？**\n```java\nclass Program {\n\
  \    public static void main(String args[]) {\n        String[] ar = new String[1];\n\
  \        ar[2] =\"Ram\";\n        System.out.println(ar[0]);\n    }\n}\n```\n- A\
  \ | 编译器错误\n- B | 异常\n- C | 无\n- D | 虚拟机\n(正确答案：B)\n\n**Q.7: 异常可以在……时发生**\n- A |\
  \ `throw` 被调用\n- B | 执行异常代码\n- C | 异步错误发生\n- D | 以上所有\n(正确答案：D)\n\n## 第 2 章答案\n\
  | 题号 | 答案 | 解析 |\n| :--- | :--- | :--- |\n| 1 | B | 异常在运行时发生。 |\n| 2 | C | 运行时错误称为异常。\
  \ |\n| 3 | C | 语法错误产生编译器错误。 |\n| 4 | D | 除以零产生 `ArithmeticException`。 |\n| 5 | C\
  \ | 缺少分号会导致编译器错误。 |\n| 6 | B | 发生 `ArrayIndexOutOfBounds` 异常。 |\n| 7 | D | 异常可以在以下任何情况下发生：a.\
  \ `throw` 被调用 b. 执行异常代码 c. 异步错误。 |\n\n# 第 3 章：什么是异常处理？\n\n**Q.1: .......... 有助于避免程序崩溃。**\n\
  - A | 错误处理\n- B | 异常处理\n- C | 编译器处理\n- D | 数据库处理\n(正确答案：B)\n\n**Q.2: 下列哪一个不是关键字？**\n\
  - A | Throw\n- B | Throws\n- C | throwing\n- D | Try\n(正确答案：C)\n\n**Q.3: 下列哪一个不是关键字？**\n\
  - A | Try\n- B | Catch\n- C | except\n- D | Finally\n(正确答案：C)\n\n**Q.4: 如何抛出异常？**\n\
  - A | throws\n- B | Throw\n- C | except\n- D | Raise\n(正确答案：B)\n\n**Q.5: 谁处理未被处理的异常？**\n\
  - A | JVM\n- B | 操作系统\n- C | catch\n- D | finally\n(正确答案：A)\n\n## 第 3 章答案\n| 题号\
  \ | 答案 | 解析 |\n| :--- | :--- | :--- |\n| 1 | B | 异常处理有助于避免程序崩溃。 |\n| 2 | C | `throwing`\
  \ 不是 Java 中的关键字。 |\n| 3 | C | `except` 不是 Java 中的关键字。 |\n| 4 | B | `throw` 关键字用于抛出异常。\
  \ |\n| 5 | A | JVM 处理未被处理的异常。 |\n\n\n\n\n\n| 5 | A | JVM 处理程序中未处理的异常。 |\n\n![](img/image00318.jpeg)\n\
