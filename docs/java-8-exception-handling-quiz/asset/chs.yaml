  \n**Q.4: 'try' 块无法封装？**\n- A: 方法内部的代码\n- B: 构造函数内部的代码\n- C: 静态块内部的代码\n- D: 类\n-\
  \ **正确答案：D**\n\n**Q.5: 如果不按照继承层次结构的自下而上顺序处理异常，会遇到什么错误？**\n- A: 编译错误\n- B: 运行时异常\n\
  - C: 什么都没有发生\n- D: JVM 异常\n- **正确答案：A**\n\n## 答案：\n| 题号 | 答案 | 解析 |\n| :--- | :---\
