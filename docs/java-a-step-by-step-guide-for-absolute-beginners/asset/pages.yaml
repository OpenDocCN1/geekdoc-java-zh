  md: '# 18-Java AWT


    AWT stands for Abstract Window kit is an API that we use to develop window-based
    or GUI applications in Java. The components of Java AWT are platform-independent,
    meaning that these components are displayed based on the operating system. This
    API is heavyweight, meaning that its components use the resources of the operating
    system.


    The java.awt package comes with many classes for the AWT api like TextField, Label,单独,
    CheckBox, TextArea, Choice, List. Let us discuss some of its important components:


    +   - Container- this is an AWT component capable of holding components like textfields,
    labels, buttons, textareas, etc. it is extended by classes such as Frame, Panel,
    and Dialog.

    - Window- this is a container with no menu bars and borders. To create a window,
    use a dialog, a frame or another window.

    - Panel- this is a container with no menu bars and title bar. You can add other
    components like textfields and buttons to it.

    - Frame- this is a container with a title bar and it may have menu bars. You can
    add other components like textfields and buttons to it.


