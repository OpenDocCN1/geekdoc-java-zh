  md: "# Multiple Catch Blocks\n\nWe can create a try block followed by many catch\
    \ blocks. This should be done following the syntax given below:\n\n```\ntry {\n\
    \  // the protected code\n} catch (ExceptionType1 ex1) {\n  // A Catch block\n\
    } catch (ExceptionType2 ex2) {\n  // A Catch block\n} catch (ExceptionType3 ex3)\
    \ {\n  // A Catch block\n}\n```\n\nIn the above syntax, we have created three\
    \ catch blocks and a single try block. However, it is possible to use any number\
    \ of catch blocks for a single try block. When an exception has occurred within\
    \ the protected code, it will be thrown to the first catch block. If the exception's\
    \ data type matches ExceptionType, then it will be caught there. If this doesn't\
    \ occur, the exception will be thrown to the second catch block. This will continue\
    \ for all the catch blocks in the code. If the exception is not caught, the method\
    \ will halt the execution.\n\nThe following is an example of a code that shows\
    \ how to use multiple catch statements:\n\n```\ntry {\n  f = new FileInputStream(file_Name);\n\
    \  x = (byte) f.read();\n} catch (IOException io) {\n  io.printStackTrace();\n\
    \  return -1;\n} catch (FileNotFoundException ex) // Not valid! {\n  ex.printStackTrace();\n\
    \  return -1;\n}\n```\n\n# Throw/Throws Keywords"
