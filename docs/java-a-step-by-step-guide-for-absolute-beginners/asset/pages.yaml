  md: '# 4-Java Data Types


    In Java, a data type can be primitive or non-primitive.


    # Primitive Data Types


    These are the pre-defined data types that are already provided by Java. They are
    **8** in number including **byte, short, long, char, int, float, Boolean** and
    **double** data types.


    Let us now discuss the various primitive data types in Java:


    # Boolean


    This data type stores only two values, which are **true** and **false**. It is
    used in simple statements that track only **true/false conditions**. It specifies
    only one bit of information, but we cannot define its size precisely.


    # Byte


    This has a default value of **0**, and its minimum value is **-128 (-2^7)**. It
    helps in saving space in large arrays as it is 4 times smaller than integers.


    # Short


    It has a default value of **0** and values lying with the range of **-32,768**
