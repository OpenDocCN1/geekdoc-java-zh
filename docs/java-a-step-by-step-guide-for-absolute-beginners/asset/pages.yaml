  md: '# Conclusion


    This marks the end of this book. Java is a coding language. It is popular for
    being one of the wide programming languages. A lot can be achieved with Java.
    It is good for the development of desktop applications, commonly referred to as
    standalone applications. It can be added/embedded on web pages. It is easy to
    learn Java, especially with a background in object-oriented programming. Java
    supports features of object-oriented programming, encapsulation, etc. To code
    in Java, you need the Java compiler. This tells you Java is compiled, not interpreted.
    The compiler is installed automatically after installing JDK (Java Development
    Kit).


    The JDK is open-source software, so get it for free and install it on your computer.
    A text editor is needed, which is where you will write your Java code. Examples
    include NetBeans, Notepad, Eclipse, etc. With those, you can write your Java codes
    and run them from the console/terminal of your OS. You invoke the java compiler
    (javac) to compile the code and generate a .class file, then execute the .class
    file. The .class file has byte-code, which is platform-independent, it can be
    run on any platform, example, Unix, Windows, Mac OS, Solaris, etc.'
