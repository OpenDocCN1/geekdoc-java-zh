  md: '# Java Environment


    To write and run your Java programs, you must have the Java compiler and a text
    editor such as Notepad in Windows. To get the Java compiler, you must install
    the Java Development (JDK) on your computer. Once this is installed, your computer
    will have the Java compiler.


    Now you have the Java compiler, you must have a text editor in which you will
    write your programs. You can use either a basic text editor or an advanced text
    editor. Examples of advanced text editors you can use for Java programming include
    NetBeans and Eclipse. You can download the JDK from the following


    URL:http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html


    Once the download is complete, just double click the setup file and the installation
    process will begin. You will be taken through a sequence of simple on-screen instructions
    for the installation to be done. Installation alone is not enough as you have
    to set the path environment variable. This way, you will be able to invoke the
    Java compiler from the terminal of your operating system. In most cases, the installation
    of JDK is done in the c:Program Files\java\jdk directory. On windows, you can
    set the path environment variable by right clicking “My Computer” then choosing
    “Properties”. Next, open the “Advanced” tab then choose “Environment variables”.
    Add the “c:\Program Files\java\jdk\bin” path. Linux users are advised to read
    the documentation of their shells.


