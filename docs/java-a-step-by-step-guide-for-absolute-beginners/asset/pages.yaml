    \ error: unexpected exception FileNotFoundException; must\nbe caught or declared\
    \ to be thrown\nFileReader fr = new FileReader(f);\nerror\nC:\\Users\\admin>\n\
    ```\n\nThe read() and write() methods have thrown the IOException, but the Java\
    \ compiler could handle this together with the FileNotFound exception.\n\nAn unchecked\
    \ exception is a kind of exception that occurs during the program execution time.\
    \ Such exceptions are also referred to as runtime exceptions. Examples of such\
    \ exceptions are programming bugs like improper use of APIs and logic errors.\
    \ A good example of that is when you try to access an array element that is out\
    \ of bounds as showed below:\n\npublic class ArrayException\n\n```\npublic static\
    \ void main(String[] args) {\n    int values[] = {10, 25, 38, 46};\n    System.out.println(values[6]);\n\
    }\n```\n\nIn the above example, we have created an array of 4 elements, but we\
    \ are trying to access the element at index 6 of the array. This will raise an\
    \ ArrayIndexOutOfBoundsExceptionexception exception.\n\nThere is a difference\
    \ between errors and exceptions. Errors are problems that occur and they are beyond\
    \ the control of the programmer or the user. Errors are normally ignored code\
    \ since there is nothing you can do about them. A good example of where an error\
    \ can occur after the occurrence of a stack overflow. Errors are ignored during\
    \ compile time.\n\n# Catching Exceptions"
