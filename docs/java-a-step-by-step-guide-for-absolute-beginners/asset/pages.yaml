  md: 'The KeyListener interface has three important methods which include:


    +   - public abstract void keyPressed(KeyEvent ev);

    - public abstract void keyReleased(KeyEvent ev);

    - public abstract void keyTaped(KeyEvent ev);


    Consider the example given below:


    ```

    import java.awt.*;

    import java.awt.event.*;

    public class MyKeyListener extends implements KeyListener {

    Label lab;

    TextArea area;

    MyKeyListener() {

    nlab=new Label();

    lab.setBounds(20,50,100,20);

    area=new TextArea();

    area.setBounds(20,80,300,300);

    area.addKeyListener(this);


    add(lab);

    add(area);

    setSize(400,400);

    setLayout(null);

    setVisible(true);

    }


    public void keyPressed(KeyEvent ev) {

    lab.setText("Key Pressed!");

    }

    public void keyReleased(KeyEvent ev) {

    lab.setText("Key Released!");

    }

    public void keyTaped(KeyEvent ev) {

    lab.setText("Key Taped!");

    }


    public static void main(String[] args) {

    new MyKeyListener();

    }

    ```


