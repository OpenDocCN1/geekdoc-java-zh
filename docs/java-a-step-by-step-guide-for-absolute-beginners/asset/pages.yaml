  md: "To catch exceptions in Java, we combine the try and catch keywords. The code\
    \ that is more likely to generate an error is surrounded using the try/catch block.\
    \ The code placed within the try/catch block is referred to as the protected code.\
    \ Here is the syntax for this statement:\n\n```\ntry {\n  // the protected code\n\
    \  catch (ExceptionName ex1) {\n    // the catch block\n}\n```\n\nAfter the occurrence\
    \ of the exception, it will be handled by the catch block you created. Anytime\
    \ you create a try block, it must be followed by either the catch or the finally\
    \ block. If the exception that has occurred has been defined in the catch block,\
    \ it will be passed to the same way that an argument is passed to a method.\n\n\
    Here is an example:\n\n```\nimport java.io.*;\n\npublic class ArrayException {\n\
    \  public static void main(String[] args) {\n    try {\n      int x[] = new int[3];\n\
    \      System.out.println(\"Access element four : \" + x[4]);\n    } catch (ArrayIndexOutOfBoundsException\
    \ ex) {\n      System.out.println(\"Exception thrown : \" + ex);\n    }\n    System.out.println(\"\
    Outside the block\");\n  }\n}\n```\n\nIn the above example, we have defined an\
