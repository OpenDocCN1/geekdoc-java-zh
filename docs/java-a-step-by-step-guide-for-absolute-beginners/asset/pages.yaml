  md: "# 13-Interfaces\n\nAn interface is a blueprint for a class. It comes with both\
    \ abstract methods and static constants. The Interface provides a mechanism for\
    \ achieving abstraction. An interface must only have abstract methods rather than\
    \ the method body. It's very important for achieving multiple inheritances. It's\
    \ similar to a class, but with abstract methods. Any class must implement an interface\
    \ to use its methods. Other than abstract methods, it may have constants, static\
    \ methods, default methods, nested types, etc.\n\nAn interface has methods that\
    \ can be implemented by classes. To implement interface methods, a class must\
    \ be abstract. Otherwise, all interface methods must be defined in the class.\
    \ An interface can't be instantiated. It also can't have constructors. All its\
    \ fields must be final or static, not instance fields.\n\nTo set one, we use the\
    \ interface keyword.\n\nHere is the Syntax:\n\n```\ninterface <interfaceName>{\n\
    \  //constant fields\n  // abstract methods\n}\n```\n\nAn interface is an implicit\
    \ abstract; hence we don't add abstract keyword when declaring it. The methods\
    \ are implicitly abstract; hence we don't use"
