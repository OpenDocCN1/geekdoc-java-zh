  md: '# Introduction


    Java is a great programming language that can be used for the development of both
    standalone and distributed applications. These types of applications are on high
    demand today for both small and large enterprises. Java comes with a feature known
    as apples which are web pages that can be embedded on web browsers. This means
    that Java can help you add some functionality to your web applications. You can
    now tell why Java is a popular programming language with a high demand worldwide.
    It also has many other features which you can take advantage of when developing
    your application. For instance, Java is an object-oriented programming language.
    If are familiar with any other object-oriented programming language, it will be
    easy for you to learn Java. Java has a simple syntax to grasp, even by beginners.


    It is easy to get started with writing and running Java programs. You only need
    to have the Java compiler installed on your computer and a text editor where you
    will write your code. With these, you can write your Java programs and get instant
    results. For the case of the text editor, a basic text editor like Notepad is
    okay although there are more advanced text editors for Java-like NetBeans and
    Eclipse. Once you compile your Java code, you get the Java byte-code which is
    platform independent, meaning you can execute it on a machine running any type
    of operating system. This book is an excellent guide for you to learn everything
    about Java. The author takes you'
