  md: '# 12-Encapsulation


    Encapsulation is a feature of object-oriented programming that helps grouping
    data and methods together. The data are the variables methods are the codes that
    let us act on the data. With encapsulation, class variables can be hidden from
    other classes and the access to them may only be possible via methods of the class.
    Encapsulation works as a Data Hiding. It''s achieved by setting class variables
    as private. The “setter” and “getter” methods for the variables should be set
    as public and used to change the value of the variables.


