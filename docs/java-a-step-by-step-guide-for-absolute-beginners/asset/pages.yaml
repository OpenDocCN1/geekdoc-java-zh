  md: "# 17-Exception Handling\n\nDuring the run-time of a program, an unexpected\
    \ condition may occur may stop its execution. We need to have a mechanism that\
    \ will handle such conditions so that our programs will be executed without problems.\n\
    \nProblems that occur during the program execution are referred to as exceptions.\
    \ Exceptions disrupt the normal flow of a program, and the program may not work\
    \ as it was intended. Examples of exceptions that can occur during program execution\
    \ include a case where the user enters an invalid data, a file that cannot open,\
    \ loss of network connection during program execution, etc.\n\nConsider the example\
    \ given below in which we are trying to access a file that is not there:\n\n```\n\
    import java.io.File;\nimport java.io.FileReader;\n\npublic class ExceptionExample\
    \ {\n    public static void main(String[] args) {\n        File f = new File(\"\
    hello.txt\");\n        FileReader fr = new FileReader(f);\n    }\n}\n```\n\nThe\
    \ code will give the following exception when compiled:"
