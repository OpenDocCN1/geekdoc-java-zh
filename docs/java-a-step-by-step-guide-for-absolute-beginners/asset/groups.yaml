    \n## KeyListener Interface\n\nThe KeyListener will be notified after you have\
    \ changed the state of the key. The notification is done against the KeyEvent.\
    \ You can find the KeyListener listener in java.awt.event package.\n\nThe KeyListener\
    \ interface has three important methods which include:\n\n- public abstract void\
    \ keyPressed(KeyEvent ev);\n- public abstract void keyReleased(KeyEvent ev);\n\
    - public abstract void keyTyped(KeyEvent ev);\n\nConsider the example given below:\n\
    \n```java\nimport java.awt.*;\nimport java.awt.event.*;\npublic class MyKeyListener\
    \ implements KeyListener {\n    Label lab;\n    TextArea area;\n    MyKeyListener()\
    \ {\n        lab=new Label();\n        lab.setBounds(20,50,100,20);\n        area=new\
    \ TextArea();\n        area.setBounds(20,80,300,300);\n        area.addKeyListener(this);\n\
    \n        add(lab);\n        add(area);\n        setSize(400,400);\n        setLayout(null);\n\
