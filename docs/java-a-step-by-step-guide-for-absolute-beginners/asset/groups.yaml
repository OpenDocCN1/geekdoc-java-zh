    \  x = (byte) f.read();\n} catch (IOException io) {\n  io.printStackTrace();\n\
    \  return -1;\n} catch (FileNotFoundException ex) // Not valid! {\n  ex.printStackTrace();\n\
    \  return -1;\n}\n```\n\n## Throw/Throws 关键字\n\n对于不处理受检异常的方法，必须通过使用 **throws 关键字**\
    \ 进行声明。该关键字应该添加到方法签的末尾。\n\n可以使用 `throw` 关键字抛出异常，该异常可以是新实例化的，也可以是你刚刚捕获的异常。\n\n\
    了解并标记 **throw 关键字** 和 **throws 关键字**之间的区别是非常重要的。我们使用 **throws 关键字** 来推迟已受检异常的处理，而\
    \ **throw 关键字** 用于显式地调用异常。\n\n这是一个示例：\n\n```java\nimport java.io.*;\npublic class\
    \ ExceptionTest {\n    public void save(double val) throws RemoteException {\n\
    \        // Implement the method\n        throw new RemoteException();\n    }\n\
    \    // The rest of class definition\n}\n```\n\n在上面的示例中，我们有一个 `save()` 方法，它声明了它\
    \ **throws a RemoteException**。一个方法可以声明它将 **throw** 许多异常，此时你应该使用逗号 (,) 来分隔这些异常。\n\
    \n考虑下面的示例，它展示了如何实现这一点：\n\n```java\nimport java.io.*;\npublic class ExceptionTest\
    \ {\n    public void save(double val) throws RemoteException, InadequateFundsException\
    \ {\n        // Implement the method\n    }\n    // The rest of class definition\n\
    }\n```\n\n## Finally 语句\n\n**finally** 块位于 `try` 或 `catch` 块之后。无论是否发生异常，此块始终会被执行。`finally`\
    \ 语句为你提供了一种运行清理类型语句的好方法，这些语句无论你的受保护代码内部发生了什么，都需要执行。它应该被添加到 **catch 块** 的末尾，如下语法所示：\n\
    \n```java\ntry {\n //The protected code\n} catch (Exception1 ex1) {\n // A Catch\
    \ block\n} catch (ExceptionType2 ex2) {\n} catch (ExceptionType3 ex3) {\n // A\
    \ Catch block\n} finally {\n // The finally block to always execute.\n}\n```\n\
    \n下面的示例展示了这一点：\n\n```java\npublic class ExceptionTest {\n public static void main(String[]\
    \ args[]) {\n int x[] = new int[3];\n try {\n System.out.println(\"Access element\
    \ four :\" + x[4]);\n} catch (ArrayIndexOutOfBoundsException ex) {\n System.out.println(\"\
    Exception thrown :\" + ex);\n} finally {\n x[0] = 10;\n System.out.println(\"\
    Element at index 0 is :\" + x[0]);\n System.out.println(\"The finally statement\
    \ has been executed\");\n}\n}\n```\n\n代码将返回如下：\n\n```\nException thrown : java.lang.ArrayIndexOutOfBoundsException:\
    \ 4\nElement at index 0 is : 10\nThe finally statement has been executed\n```\n\
    \n## Try-with-resources\n\n除了你在括号内声明的资源外，其他一切都与普通 `try/catch` 块中的内容相似。你在 `try`\
    \ 块中声明的资源将在 `try` 块开始之前实例化。`try` 块内声明的任何资源都将隐式声明为 `final`。\n\n类要使用 `try-resources`\
    \ 语句，必须实现 `AutoCloseable` 接口和 `close()` 方法，后者将被自动调用。Java 还允许在 `try-resources`\
    \ 语句中使用多个类。如果你这样做，这些类必须以反序声明。\n\n## 自定义异常\n\nJava 允许你创建自己的异常。然而，你创建的任何异常都应该是 `Throwable`\
    \ 的子类。每当你需要创建一个受检异常由 Handle 自动强制或设置规则时，你应该扩展 `Exception` 类。\n\n为了创建我们自定义的异常，我们使用以下语法：\n\
    \n```java\nclass NewException extends Exception {\n}\n```\n\n上面的语法显示，你只需要扩展预定义的\
    \ `Exception` 类即可创建你自己的异常。这些异常被称为受检异常。让我们展示如何在 Java 中创建一个异常：\n\n```java\nimport\
    \ java.io.*;\n\npublic class InadequateFundsException extends Exception {\n  \
    \  private double deposit;\n\npublic InadequateFundsException(double deposit)\
    \ {\n    this.deposit = deposit;\n}\n\npublic double getDeposit() {\n    return\
    \ deposit;\n}\n}\n```\n"
