    <TITLE>Hello World</TITLE>\n<HEAD>Our Hello Applet</HEAD>\n<applet code=\"OurPaintClass.class\"\
    \ width=500 height=500>\n</applet>\n</body>\n</html>\n```\n\nCompile the OurPaintClass.java\
    \ class then run OurPaint.html with appletviewer. You will get the result below:\n\
    \n![](img/ea1f2ffaf9eb812ac57c6338a9bb324a_101_0.png)\n\n## Displaying Images\n\
    \nImages can be displayed on applets as applets are popular in animations and\
    \ games. The class java.awt.Graphics has a drawImage() method for image display.\
    \ The method getImage() returns image object. The method getCodeBase() returns\
    \ URL in which image has been embedded.\n\nExample:\n\n```java\nimport java.awt.*;\n\
    import java.applet.*;\npublic class ImageDisplay extends Applet {\n\n    Image\
    \ img;\n\n    public void init() {\n        img = getImage(getCodeBase(), \"image.png\"\
    );\n    }\n\n    public void paint(Graphics gc) {\n        gc.drawImage(img, 30,\
    \ 30, this);\n    }\n}\n```\n\nThe drawImage() method displays the image. Its\
    \ 4th parameter is an object for Observer. Save the code in a file named ImageDisplay.java.\
    \ Add this code to a file named imaged.html:\n\n```html\n<html>\n<body>\n<applet\
    \ code=\"ImageDisplay.class\" width=\"350\" height=\"350\">\n</applet>\n</body>\n\
    </html>\n```\n\nCompile Java class via command javac ImageDisplay.java, then invoke\
    \ imaged.html file via appletviewer. If you specified correct image in the same\
    \ directory with these files, it will be shown on the window.\n\n## Applet Animations\n\
    \nSince applets are common in games, images should be moved. Example: Create file\
    \ AnimationExample.java. Add this code:\n\n```java\nimport java.applet.*;\nimport\
    \ java.awt.*;\npublic class AnimationExample extends Applet {\n\n    Image img;\n\
    \n    public void init() {\n        img = getImage(getCodeBase(), \"car.gif\"\
    );\n    }\n\n    public void paint(Graphics gc) {\n        for(int p=0; p<500;\
    \ p++){\n            gc.drawImage(img, p, 30, this);\n        }\n        try {\n\
    \            Thread.sleep(100);\n        } catch(Exception ex) {\n        }\n\
    \    }\n}\n```\n\nThe method drawImage() helps us display an image. Create new\
    \ file named animation.html. and add this code:\n\n```html\n<html>\n<body>\n<applet\
    \ code=\"AnimationExample.class\" width=\"350\" height=\"300\">\n</applet>\n</body>\n\
    </html>\n```\n\nCompile the .java class then run the .html file. Ensure the correct\
    \ image is specified in the .java class and keep it in the same directory as the\
    \ files. It will move after running the code.\n\n## Events on Applets\n\nEvents\
    \ may be added on applets. Here, we add an event for applet to display a message\
    \ after clicking button:\n\nCreate file Applet.java then add this code:\n\n```java\n\
    import java.applet.*;\nimport java.awt.event.*;\nimport java.awt.*;\npublic class\
    \ AppletEventExample implements ActionListener {\n    Button btn;\n    TextField\
    \ txt;\n\n    public void init() {\n        txt = new TextField();\n        txt.setBounds(30,\
    \ 40, 150, 20);\n\n        btn = new Button(\"Click\");\n        btn.setBounds(80,\
    \ 150, 60, 50);\n\n        add(btn);\n        add(txt);\n        btn.addActionListener(this);\n\
    \        setLayout(null);\n    }\n\n    public void actionPerformed(ActionEvent\
    \ ev) {\n        txt.setText(\"Text on Applet\");\n    }\n}\n```\n\nNote the applet\
    \ class implements an interface named ActionListener. This has methods for listening\
    \ to action events and responding appropriately. New classes have been introduced:\
    \ Button and TextField classes. We created instances of these classes, that is,\
    \ btn and txt respectively to get a button and a textField. The text Click was\
    \ added to the button, and setBounds() method is for setting the bounds for the\
    \ two. Consider this:\n\n`btn.addActionListener(this);`\n\nThe command adds action\
    \ listener event to our button, the button will wait or listen to be clicked.\
    \ After the click, the action specified in the actionPerformed() method will be\
    \ performed.\n\nCreate new file myapplet.html then add this:\n\n```html\n<html>\n\
    <body>\n<applet class=\"AppletEventExample.class\" width=\"350\" height=\"350\"\
    >\n</applet>\n</body>\n</html>\n```\n\nCompile your Java code via command javac\
    \ AppletEventExample.java, then invoke the .html file via appletviewer myapplet.html.\
    \ The following applet window will pop up:\n"
