    \ interfaces, etc. With packages, it's easy to access variables and methods defined\
    \ in classes and interfaces in the same package.\n\nA Java package can be user-defined\
    \ or built-in. Examples of built-in Java packages include lang, awt, java, javafx,\
    \ net, io, swing, util, sql, and others. To use these packages, use the import\
    \ statement to be made available in your class. To create packages, use package\
    \ keyword then create package name.\n\nExample:\n\n```java\npackage firstpackage;\n\
    public class MyPackage{\n    public static void main(String args[]){\n       \
    \ System.out.println(\"My first package\");\n    }\n}\n```\n\nExecution of the\
    \ above codes will return the following output:\n\nMy first package\n\nThe package\
    \ definition statement is always with a semicolon (; ). When we create packages,\
    \ we should use lowercase letters for the name to avoid conflicting with the interface/class\
    \ names.\n\nAnother Example:\n\n```java\npackage animal;\ninterface Mammals {\n\
    \    public void run();\n    public void eat();\n}\n```\n\nWe have created a package\
    \ named animal with an interface named Mammals. We can now implement the interface\
    \ in package animal:\n\n```java\npackage animal;\npublic class Cow implements\
    \ Mammals {\n    public void run() {\n        System.out.println(\"Cows run\"\
    );\n    }\n    public void eat() {\n        System.out.println(\"Cows eat\");\n\
    \    }\n    public int legCount() {\n        return 0;\n    }\n    public static\
    \ void main(String args[]) {\n        Cow c = new Cow();\n        c.run();\n \
    \       c.eat();\n    }\n}\n```\n\nThe code will return the following result:\n\
    \n```\nCows run\nCows eat\n```\n\nIf we do not use a package, the two may be combined\
    \ into one:\n\n```java\ninterface Mammals {\n    public void run();\n    public\
    \ void eat();\n}\n```\n\n```java\npublic class Cow implements Mammals {\n    public\
    \ void run() {\n        System.out.println(\"Cows run\");\n    }\n\n    public\
    \ void eat() {\n        System.out.println(\"Cows eat\");\n    }\n\n    public\
    \ int legCount() {\n        return 0;\n    }\n\n    public static void main(String[]\
    \ args) {\n        Cow c = new Cow();\n        c.run();\n        c.eat();\n  \
    \  }\n}\n```\n\n# Import Keyword\n\nYou can access packages outside a certain\
    \ package. Using the import keyword is one of the possibilities to do it. To access\
    \ a class in the same package, it is unnecessary for a package to be used. After\
    \ importing class using the packagename.classname syntax, only methods in imported\
    \ class will be accessible.\n\nExample:\n\n```java\npackage hellopackage;\npublic\
    \ class HelloClass{\n    public void message(){\n        System.out.println(\"\
    Hello there!\");\n    }\n}\n```\n\nWe have a class named **HelloClass** defined\
    \ in a package named **hellopackage** and we save it in the file *HelloClass.java*.\
    \ We have this class:\n\n```java\npackage studentspackage;\nclass HelloStudentsClass{\n\
    \    public static void main(String args[]){\n        HelloClass hello = new HelloClass();\n\
    \        hello.message();\n    }\n}\n```\n\nThe second program will generate an\
    \ error once executed. We have instantiated the class **HelloClass** to get the\
    \ instance **hello**. We have used the instance to access **message()** method\
    \ defined in **HelloClass**. Note that they are not in a single package. This\
    \ will generate an error. The reason is we instantiate a class not in the same\
    \ package as the current one. We have to import the class, **HelloClass** from\
    \ package **hellopackage**. We use `classname.classname` syntax at the top of\
    \ the class:\n\n```java\npackage studentspackage;\nimport hellopackage.HelloClass;\n\
    class HelloStudentsClass{\n    public static void main(String args[]){\n     \
    \   HelloClass hello = new HelloClass();\n        hello.message();\n    }\n}\n\
    ```\n\nA name for **package** and **class** is useful to avoid an error. With\
    \ this method, we do not need to use the import keyword since the name will direct\
    \ us to the package and class, and then the method will be accessible from there.\n\
    \nExample:\n\n```java\npackage hellopackage;\npublic class HelloClass{\n    public\
    \ void message(){\n        System.out.println('Hello there!');\n    }\n}\n```\n\
    \nTo use the message() method in a class in another package, we can do it as:\n\
    \n```java\npackage studentspackage;\nclass HelloStudentsClass{\n    public static\
    \ void main(String[] args) {\n        HelloClass hello = new HelloClass();\n \
    \       hello.message();\n    }\n}\n```\n\nConsider this line:\n\n```\nhellopackage.HelloClass\
    \ hello = new hellopackage.HelloClass();\n```\n\nThe hellopackage.HelloClass helps\
    \ access HelloClass in a package. After that, we can access the message() method\
    \ defined in the class. Note that you access methods in that class only, not in\
    \ other classes.\n\nAnother example\n\n```java\npackage armory;\ninterface guns\
    \ {\n    public void pistol();\n}\n```\n\nThe guns interface is in armory. We\
    \ can implement the interface in the similar package:\n\n```java\npackage armory;\n\
    public class ceska implements guns {\n    public void bullets() {\n        System.out.println(\"\
    Ceska has bullets\");\n    }\n    public void pistol() {\n        System.out.println(\"\
    It has 5 bullets\");\n    }\n    public int owner() {\n        return 0;\n   \
    \ }\n    public static void main(String args[]) {\n        ceska cs = new ceska();\n\
    \        cs.bullets();\n    }\n}\n```\n\n# 15-Java Applets\n\nApplets are Java\
    \ programs that run on web browsers. An applet may act as a fully functional app\
    \ since it comes with a full Java API. The applet class extends java.applet.Applet.\
    \ Applets don't have the main method, hence they don't invoke main(). They are\
    \ instead embedded on HTML pages. After an HTML page with an applet is opened,\
    \ its code is downloaded to the local machine. The JVM (Java Virtual Machine)\
    \ is mandatory for you to view applets.\n\nApplets are processed on the client\
    \ side; hence they give users a quick response compared to other apps. Applets\
    \ offer good security.\n\n# Applets' Lifecycle\n\nApplets go through these steps:\n\
    \n- **Initialization-** the init() method initializes applets.\n- **Starting-**\
    \ the start() method starts applets.\n- **Painting-** done after calling paint()\
    \ method.\n- **Stopping-** we invoke stop() method to stop an applet.\n- **Destroying-**\
    \ the applet is destroyed by invoking destroy() method.\n"
