- md: "\nTo catch exceptions in Java, we combine the try and catch keywords. The code\
    \ that is more likely to generate an error is surrounded using the try/catch block.\
    \ The code placed within the try/catch block is referred to as the protected code.\
    \ Here is the syntax for this statement:\n\n```\ntry {\n  // the protected code\n\
    } catch (ExceptionName ex1) {\n  // the catch block\n}\n```\n\nAfter the occurrence\
    \ of the exception, it will be handled by the catch block you created. Anytime\
    \ you create a try block, it must be followed by either the catch or the finally\
    \ block. If the exception that has occurred has been defined in the catch block,\
    \ it will be passed to the same way that an argument is passed to a method.\n\n\
    Here is an example:\n\n```java\nimport java.io.*;\n\npublic class ArrayException\
    \ {\n  public static void main(String[] args) {\n    try {\n      int x[] = new\
    \ int[3];\n      System.out.println(\"Access element four : \" + x[4]);\n    }\
    \ catch (ArrayIndexOutOfBoundsException ex) {\n      System.out.println(\"Exception\
    \ thrown : \" + ex);\n    }\n    System.out.println(\"Outside the block\");\n\
    \  }\n}\n```\n\nIn the above example, we have defined an array with 3 elements\
    \ but we are trying to access its 4th element. The code will return the following\
    \ result upon execution:\n\n```\nException thrown : java.lang.ArrayIndexOutOfBoundsException:\
    \ 4\nOutside the block\n```\n\n## Multiple Catch Blocks\n\nWe can create a try\
    \ block followed by many catch blocks. This should be done following the syntax\
    \ given below:\n\n```java\ntry {\n  // the protected code\n} catch (ExceptionType1\
    \ ex1) {\n  // A Catch block\n} catch (ExceptionType2 ex2) {\n  // A Catch block\n\
    } catch (ExceptionType3 ex3) {\n  // A Catch block\n}\n```\n\nIn the above syntax,\
    \ we have created three catch blocks and a single try block. However, it is possible\
    \ to use any number of catch blocks for a single try block. When an exception\
    \ has occurred within the protected code, it will be thrown to the first catch\
    \ block. If the exception's data type matches ExceptionType, then it will be caught\
    \ there. If this doesn't occur, the exception will be thrown to the second catch\
    \ block. This will continue for all the catch blocks in the code. If the exception\
    \ is not caught, the method will halt the execution.\n\nThe following is an example\
    \ of a code that shows how to use multiple catch statements:\n\n```java\ntry {\n\
    \  f = new FileInputStream(file_Name);\n  x = (byte) f.read();\n} catch (IOException\
    \ io) {\n  io.printStackTrace();\n  return -1;\n} catch (FileNotFoundException\
    \ ex) // Not valid! {\n  ex.printStackTrace();\n  return -1;\n}\n```\n\n## Throw/Throws\
    \ Keywords\n\nFor a method that doesn't handle a checked exception, it must declare\
    \ by use of the **throws keyword**. This keyword should be added to the end of\
    \ the signature of the method.\n\nIt is possible to throw an exception, which\
    \ can be newly instantiated or the one that you have just caught by use of the\
    \ throw keyword.\n\nIt will be important to know and mark the difference between\
    \ the **throw** and **throws keywords**. We use **throws keyword** to postpone\
    \ the handling of an already checked exception while the **throw keyword** is\
    \ used for explicitly invoking an exception.\n\nHere is an example:\n\n```java\n\
    import java.io.*;\npublic class ExceptionTest {\n    public void save(double val)\
    \ throws RemoteException {\n        // Implement the method\n        throw new\
    \ RemoteException();\n    }\n    // The rest of class definition\n}\n```\n\nIn\
    \ the above example, we have the method save() which has declared that it **throws\
    \ a RemoteException**. It is possible for one method to declare that it will **throw**\
    \ many exceptions, in which you should use commas (,) to separate the exceptions.\n\
    \nConsider the following example that shows how to implement this:\n\n```java\n\
    import java.io.*;\npublic class ExceptionTest {\n    public void save(double val)\
    \ throws RemoteException, InadequateFundsException {\n        // Implement the\
    \ method\n    }\n    // The rest of class definition\n}\n```\n\n## Finally Statement\n\
    \nThe **finally** block comes after the **try** or **catch** block. This block\
    \ will always be executed, regardless of whether or the exception occurred. The\
    \ final statement provides you with a good way of running your cleanup-type statements\
    \ you need to be executed regardless of what happens inside your protected code.\
    \ It should be added at the end of the **catch blocks** as showed in the following\
    \ syntax:\n\n```java\ntry {\n //The protected code\n} catch (Exception1 ex1) {\n\
    \ // A Catch block\n} catch (ExceptionType2 ex2) {\n} catch (ExceptionType3 ex3)\
    \ {\n // A Catch block\n} finally {\n // The finally block to always execute.\n\
    }\n```\n\nThe following example shows this:\n\n```java\npublic class ExceptionTest\
    \ {\n public static void main(String[] args[]) {\n int x[] = new int[3];\n try\
    \ {\n System.out.println(\"Access element four :\" + x[4]);\n} catch (ArrayIndexOutOfBoundsException\
    \ ex) {\n System.out.println(\"Exception thrown :\" + ex);\n} finally {\n x[0]\
    \ = 10;\n System.out.println(\"Element at index 0 is :\" + x[0]);\n System.out.println(\"\
    The finally statement has been executed\");\n}\n}\n```\n\nThe code will return\
    \ the following:\n\n```\nException thrown : java.lang.ArrayIndexOutOfBoundsException:\
    \ 4\nElement at index 0 is : 10\nThe finally statement has been executed\n```\n\
    \n## Try-with-resources\n\nOther than the resources you declare within parenthesis,\
    \ everything is similar to what we have in a normal try/catch block. The resource\
    \ you declare in the try block will be instantiated before the beginning of try-block.\
    \ Any resource declared within the try block will be implicitly declared as final.\n\
    \nFor a class to use the try-resources statement, it must implement AutoCloseable\
    \ interface and close() method which will be invoked automatically. Java also\
    \ allows you to have multiple classes within a try-resources statement. If you\
    \ do this, the classes will have to be declared in reverse order.\n\n## User-defined\
    \ Exceptions\n\nJava allows you to create your own exceptions. However, any exception\
    \ that you create should be a child of Throwable. Anytime you need to create a\
    \ checked exception to be automatically enforced by the Handle or set the rule,\
    \ you should extend the Exception class.\n\nTo create our user-defined exceptions,\
    \ we use the following syntax:\n\n```java\nclass NewException extends Exception\
    \ {\n}\n```\n\nThe above syntax shows that you are only required to extend the\
    \ Exception class which is predefined so to create your own exception. These are\
    \ referred to as checked exceptions. Let us show how to create one in Java:\n\n\
    ```java\nimport java.io.*;\n\npublic class InadequateFundsException extends Exception\
    \ {\n    private double deposit;\n\npublic InadequateFundsException(double deposit)\
    \ {\n    this.deposit = deposit;\n}\n\npublic double getDeposit() {\n    return\
    \ deposit;\n}\n}\n```\n"
