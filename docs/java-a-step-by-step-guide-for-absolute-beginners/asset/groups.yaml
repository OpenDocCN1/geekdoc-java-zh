- md: "\n# Variable Types\n\nJava supports three variable types:\n\n- 1. Local Variables\n\
    - 2. Static Variables\n- 3. Instance Variables\n\n# Local Variables\n\nThese are\
    \ variables declared within a method body. They can only be accessed from within\
    \ that method.\n\n# Instance Variables\n\nThese are the variables that have been\
    \ defined without the use of a STATIC keyword. These variables are specific to\
    \ an object.\n\n# Static Variables\n\nThese are variables initialized once and\
    \ at the beginning of program execution. You should initialize them before instance\
    \ variables.\n\nThe following example shows the different Java variables:\n\n\
    ```\nclass VariablesExample {\n    int p = 1; //an instance variable\n    static\
    \ int q = 5; //a static variable\n    void methodExample() {\n        int r =\
    \ 10; //a local variable\n    }\n}\n```\n\nThe variable **integer q** is a static\
    \ variable since it has been defined with the **static keyword**. The variable\
    \ **int r** has been declared within the **methodExample** method, making it a\
    \ local variable. It can only be accessed from within that method.\n\n# 4-Java\
    \ Data Types\n\nIn Java, a data type can be primitive or non-primitive.\n\n# Primitive\
    \ Data Types\n\nThese are the pre-defined data types that are already provided\
    \ by Java. They are **8** in number including **byte, short, long, char, int,\
    \ float, Boolean** and **double** data types.\n\nLet us now discuss the various\
    \ primitive data types in Java:\n\n# Boolean\n\nThis data type stores only two\
    \ values, which are **true** and **false**. It is used in simple statements that\
    \ track only **true/false conditions**. It specifies only one bit of information,\
    \ but we cannot define its size precisely.\n\n# Byte\n\nThis has a default value\
    \ of **0**, and its minimum value is **-128 (-2^7)**. It helps in saving space\
    \ in large arrays as it is 4 times smaller than integers.\n\n# Short\n\nIt has\
    \ a default value of **0** and values lying with the range of **-32,768** to 32,767.\
    \ It can also be used for saving on space just like the byte data type.\n\n# Int\n\
    \nThis also has a default value of 0 and values ranging between -2,147,483,648\
    \ and 2,147,483,647. It has a minimum value of -2,147,483,648 and a maximum value\
    \ of 2,147,483,647.\n\n# Long\n\nThis data type also has a default value of 0\
    \ with its values ranging between -9,223,372,036,854,775,808 and 9,223,372,036,854,775,807.\
    \ Its minimum value is -9,223,372,036,854,775,808 while its maximum value is 9,223,372,036,854,775,807.\
    \ It is the best data type to use when you want to have a long range of values\
    \ than the ones provided by the int data type.\n\n# Float\n\nThis data type has\
    \ an unlimited range of values. It can help you save on space compared to the\
    \ use of a double. Avoid using this data type for precise values like currency.\
    \ Its default value is 0.0F.\n\n# Double\n\nThis data type has a default value\
    \ of 0.0d and it comes with an unlimited range of values. It is used to represent\
    \ values with the decimal part just like the float data type. Avoid using it for\
    \ precision values like currency.\n\n# Char\n\nThis data type is used for storing\
    \ characters.\n\n# Non-Primitive Data Types\n\nThese are defined by the use of\
    \ the defined class constructors. They help programmers' access objects. They\
    \ include Strings and arrays.\n\nThe example given below shows the use of variables:\n\
    \n```java\npublic class AddVariables{\n    public static void main(String[] args)\
    \ {\n        int p=10;\n        int q=22;\n        int r=p+q;\n        System.out.println(r);\n\
    \    }\n}\n```\n\nWe have defined three integer variables p, q, and r. The values\
    \ for p and q have been initialized, while the value for r is the addition of\
    \ the previous two variables. We have then invoked the println function to print\
    \ the value of r. It should print 32, the result of the addition of 10 and 22.\
    \ This is shown below:\n\n32\n\n# Type Casting and Type Conversion\n\nIt is possible\
    \ for a variable of a particular type to get a value of some other type. Type\
    \ conversion is when a variable of a smaller capacity is assigned a variable of\
    \ a bigger capacity.\n\nExample:\n\n```java\ndouble p;\nint q=6;\np= (double)q;\n\
    ```\n\nTypecasting is when a variable of larger capacity is assigned some other\
    \ variable of a smaller capacity.\n\nExample:\n\n```java\ndouble p=G;\nint q;\n\
    q=(int) p;\n```\n\nThe **(int) is known as the type cast operator.** If it is\
    \ not specified you get an error. Typecasting example:\n\n```java\npublic class\
    \ TypecastingExample{\n    public static void main(String[] args){\n        float\
    \ p=19.7f;\n        //int q=p/a compile error\n        int q=(int)p;\n       \
    \ System.out.println(p);\n        System.out.println(q);\n    }\n}\n```\n\nThe\
    \ code returns the following upon execution:\n\n19.7\n19\n\n# 5-Arrays in Java\n\
    \nArrays are storage structures used for storing same-type elements. An array\
    \ has a fixed size, which cannot be increased after definition. The first element\
    \ in an array is at index 0.\n\n# Single Dimensional Arrays\n\nThese are arrays\
    \ in which the elements are stored linearly. The declaration of an array takes\
    \ the syntax given below:\n\n```\n<elementDataType>[arrayName];\n```\n\nAnother\
    \ syntax:\n\n```\n<elementDataType> <arrayName>;\n```\n\nExample:\n\n```java\n\
    int arrayExample[];\nint [arrayExample]; \n```\n\nAn array can be initialized\
    \ as follows:\n\n```java\narrayExample[0]=20;\n```\n\nThe line states that the\
    \ element 1 should be stored at index 0 of the array. An array can also be initialized\
    \ simultaneously: \n\n```java\nint arrayExample[] = {19, 21, 34};\n```\n\nExample:\n\
    \n```java\npublic class JavaArray{\n    public static void main(String[] args){\n\
    \        int arrayExample[] = new int[15];\n        for (int p=0;p<arrayExample.length;p++){\n\
    \            arrayExample[p]=p;\n        }\n        System.out.println(\"Array\
    \ Length = \"+arrayExample.length);\n        System.out.println(\"arrayExample[0]=\
    \ \"+arrayExample[0]);\n    }\n}\n```\n\nThe program will print the following:\n\
    \nArray Length = 15\narrayExample[0]=0\n\n# Multi Dimensional Arrays\n\nThese\
    \ are arrays in which the elements are stored in multiple dimensions. The declaration\
    \ of a multi-dimensional array takes the syntax given below:\n\n```\n<elementDataType>\
    \ <arrayName>[][];\n```\n\nAnother syntax:\n\n```\n<elementDataType> [arrayName][];\n\
    ```\n\nExample:\n\n```java\nint arrayExample[][];\nint [arrayExample][];\n```\n\
    \nAn array can be initialized as follows:\n\n```java\nint arrayExample[][] = {{1,\
    \ 2}, {3, 4}};\n```\n\nThe line states that the element 1 should be stored at\
    \ index 0 of the array. Example:\n\n```java\npublic class MultiDimensionalArray\
    \ {\n    public static void main(String[] args) {\n        int arrayExample[][]\
    \ = {{1, 2}, {3, 4}};\n        for (int i=0; i<arrayExample.length; i++) {\n \
    \           for (int j=0; j<arrayExample[i].length; j++) {\n                System.out.print(arrayExample[i][j]\
    \ + \" \");\n            }\n            System.out.println();\n        }\n   \
    \ }\n}\n```\n\nThe program will print the following:\n\n1 2 \n3 4 \n\n# 6-Operators\
    \ in Java\n\nOperators are symbols used to perform operations. For example, the\
    \ + symbol is used for arithmetic operations. Java supports different operators:\n\
    \n# Unary Operator\n\nThis is an operator that takes one operand. They increment/decrement\
    \ a value. They include ++ **(increment)** and -- **(decrement)**.\n\nExample:\n\
    \n```java\npublic class JavaUnaryOperator{\n    public static void main(String[]\
    \ args){\n        int p=0;\n        System.out.println(++p);//from 0 to 1\n  \
    \      System.out.println(++p);//2\n        System.out.println(p--);//1\n    \
    \    System.out.println(-p);//0\n    }\n}\n```\n\nThe program prints the following:\n\
    \n1\n2\n1\n0\n\n# Arithmetic Operators\n\nThese operators are used for performing\
    \ mathematical operations like multiplication, addition, division, etc. They are\
    \ used as mathematical operators.\n\nExample:\n\n```java\npublic class ArithmeticOperators{\n\
    \    public static void main(String[] args){\n        int p=13;\n        int q=4;\n\
    \        System.out.println(p+q); //17\n        System.out.println(p-q); //9\n\
    \        System.out.println(p*q); //52\n        System.out.println(p/q); //3\n\
    \        System.out.println(p%q); //6\n    }\n}\n```\n\nThe code returns the following\
    \ result upon execution:\n\n```\n17\n9\n52\n3\n6\n```\n\nThe p++ means that the\
    \ value of p is read before the increment is done; hence we got the value of p\
    \ as 0. If it was ++p, then we would get a 1 as the first value of p. You can\
    \ try it.\n"
