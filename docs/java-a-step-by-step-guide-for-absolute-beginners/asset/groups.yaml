    \nGraphics library comes with functions/methods that can draw numerous shapes.\
    \ To draw an oval shape, call drawOval() method. Pass parameters to it, which\
    \ are points of the oval. To draw a rectangle, call drawRect() method and pass\
    \ coordinates to it which specify its corners. The drawLine() method helps draw\
