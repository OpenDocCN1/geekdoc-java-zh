    \n## 显示图像\n\n可以在 applet 上显示图像，因为 applet 在游戏中很流行。`java.awt.Graphics` 类有一个用于显示的\
    \ `drawImage()` 方法。`getImage()` 方法返回图像对象。`getCodeBase()` 方法返回图片的 URL。\n\n示例：\n\
    \n```java\nimport java.awt.*;\nimport java.applet.*;\npublic class ImageDisplay\
    \ extends Applet {\n\n    Image img;\n\n    public void init() {\n        img\
    \ = getImage(getCodeBase(), \"image.png\");\n    }\n\n    public void paint(Graphics\
    \ gc) {\n        gc.drawImage(img, 30, 30, this);\n    }\n}\n```\n\n`drawImage()`\
    \ 方法显示图像。它的第 4 个参数是观察者。将代码保存到名为 `ImageDisplay.java` 的文件中。向名为 `image.html` 的文件添加此代码：\n\
    \n```html\n<html>\n<body>\n<applet code=\"ImageDisplay.class\" width=\"350\" height=\"\
    350\">\n</applet>\n</body>\n</html>\n```\n\n通过命令 `javac ImageDisplay.java` 编译\
    \ Java 类，然后通过 `appletviewer` 调用 `image.html` 文件。如果在目录下指定了正确的图像，它将显示在窗口上。\n\n##\
    \ Applet 动画\n\n由于 applet 在游戏中很常见，图像应该是移动的。示例：创建文件 `AnimationExample.java`。添加此代码：\n\
    \n```java\nimport java.applet.*;\nimport java.awt.*;\npublic class AnimationExample\
    \ extends Applet {\n\n    Image img;\n\n    public void init() {\n        img\
    \ = getImage(getCodeBase(), \"car.gif\");\n    }\n\n    public void paint(Graphics\
    \ gc) {\n        for(int p=0; p<500; p++){\n            gc.drawImage(img, p, 30,\
    \ this);\n        }\n        try {\n            Thread.sleep(100);\n        }\
    \ catch(Exception ex) {\n        }\n    }\n}\n```\n\n`drawImage()` 方法帮助我们显示图像。创建一个名为\
    \ `animation.html` 的新文件，并添加此代码：\n\n```html\n<html>\n<body>\n<applet code=\"AnimationExample.class\"\
