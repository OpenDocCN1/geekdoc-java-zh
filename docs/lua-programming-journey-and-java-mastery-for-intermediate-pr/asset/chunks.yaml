    \ they're no longer needed. One effective strategy is to use weak tables. Weak\
    \ tables allow their keys or values to be garbage collected even if they're referenced\
    \ by the table.\n\nFor instance, the `{\"__mode\" = \"v\"}` mode creates a weak\
    \ table where values are weak references. This can be useful when implementing\
