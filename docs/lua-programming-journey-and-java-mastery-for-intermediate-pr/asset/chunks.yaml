    provide a powerful way to abstract and generalize behavior, promoting code reusability.


    Consider a scenario where you need to transform a list of numbers into their squares.
    With a higher-order function, you can pass a transformation function as an argument.


    ```lua


    -- Higher-order function to transform a list using a transformation function


    function transform_list(list, transform_fn)


