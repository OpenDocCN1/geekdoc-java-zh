    Functional programming is a paradigm that treats computation as the evaluation
    of mathematical functions, avoiding changing state and mutable data. In this chapter,
    we''ll explore how to harness the power of functional programming in Lua. We''ll
    delve into higher-order functions, closures, and anonymous functions, uncovering
    their role in writing elegant and efficient code. Let''s embark on a journey to
    master functional programming techniques in Lua.


    ## Understanding Higher-Order Functions


    At the core of functional programming are higher-order functions – functions that
    can take other functions as arguments or return functions as results. These functions
    provide a powerful way to abstract and generalize behavior, promoting code reusability.


    Consider a scenario where you need to transform a list of numbers into their squares.
    With a higher-order function, you can pass a transformation function as an argument.


    ```lua

    -- Higher-order function to transform a list using a transformation function

    function transform_list(list, transform_fn)

    local result = {}

    for _, value in ipairs(list) do

    table.insert(result, transform_fn(value))

    end

    return result

    end


    -- Using the transform_list function to square a list of numbers

    numbers = { 2, 5, 8, 10 }

    squared_numbers = transform_list(numbers, function(x) return x * x end)

    -- squared_numbers now holds { 4, 25, 64, 100 }

    ```


    Higher-order functions enable you to create flexible and reusable code, making
    your programs more modular and easier to maintain.


    ## Embracing Closures


    Closures are a key feature of functional programming. A closure is a function
    that "closes over" its surrounding environment, encapsulating both the function
    itself and its lexical scope. This allows for data encapsulation and privacy.


    Imagine you''re creating a counter that you want to initialize with a specific
    value. Closures let you achieve this by preserving the counter value within the
    function''s scope.


    ```lua

    -- Creating a closure-based counter

    function create_counter(initial_value)

    local count = initial_value

    return function()

    count = count + 1

    return count

    end

    end


    -- Creating two separate counters with different initial values

    counter1 = create_counter(10)

    counter2 = create_counter(20)

    print(counter1())  -- Outputs: 11

    print(counter2())  -- Outputs: 21

    ```


    Closures empower you to manage state in a controlled and encapsulated manner,
    making your code more reliable.


    ## Leveraging Anonymous Functions


    Anonymous functions, also known as lambda functions, are functions without a fixed
    name. They''re especially useful when you need a small, one-time-use function.
    In functional programming, anonymous functions are often used as arguments to
    higher-order functions.


    Let''s say you have a list of strings and you want to filter out the ones that
    are too short. You can use an anonymous function in combination with `table.filter`
    to achieve this.


    ```lua

    -- Using an anonymous function to filter out short strings

    function filter_short_strings(strings)

    return table.filter(strings, function(s) return #s > 5 end)

    end


    words = { "apple", "banana", "grape", "kiwi", "orange" }

    filtered_words = filter_short_strings(words)

    -- filtered_words now holds { "banana", "orange" }

    ```


    Anonymous functions provide a concise and effective way to define logic in-place,
