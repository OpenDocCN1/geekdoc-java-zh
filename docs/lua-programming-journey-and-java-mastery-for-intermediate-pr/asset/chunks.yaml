    \ 示例：**\n\n```python\ni = 1\nwhile i <= 5:\n    print(\"Iteration:\", i)\n   \
    \ i += 1\n```\n\n## 第 4 节：使用 Break 和 Continue 的控制流\n\n### Break 语句\n\n**Java 示例：**\n\
    \n```java\nfor (int i = 1; i <= 10; i++) {\n    if (i == 6) {\n        break;\n\
    \    }\n    System.out.println(\"Iteration: \" + i);\n}\n```\n\n**Python 示例：**\n\
    \n```python\nfor i in range(1, 11):\n    if i == 6:\n        break\n    print(\"\
    Iteration:\", i)\n```\n\n### Continue 语句\n\n**Java 示例：**\n\n```java\nfor (int\
    \ i = 1; i <= 5; i++) {\n    if (i == 3) {\n        continue;\n    }\n    System.out.println(\"\
    Iteration: \" + i);\n}\n```\n\n**Python 示例：**\n\n```python\nfor i in range(1,\
    \ 6):\n    if i == 3:\n        continue\n    print(\"Iteration:\", i)\n```\n\n\
    ---\n\n本章涵盖了 Java 和 Python 中的控制流和决策结构。条件语句（如 `if-else` 和 `switch`（仅限 Java））允许程序员根据条件的评估结果做出决策。循环（如\
    \ `for` 和 `while`）有助于代码块的重复执行。此外，`break` 和 `continue` 语句提供了对循环内执行流的控制。\n\n通过掌握这些控制流结构，你将能够创建灵活且高效的程序，动态地响应不同的场景。\n\
    \n# 第 5 章：函数与方法\n\n函数和方法是编程中的关键构建模块，允许开发者将复杂任务分解为更小、易于管理的代码段。它们促进了代码的可重用、模块化和组织，使开发过程更加高效且可维护。在本章中，我们将探索\
    \ Java 和 Python 中的函数和方法，并结合实际示例说明它们的用法。\n\n## 第 1 节：Python 中的函数\n\n### 函数定义与调用\n\
    \n在 Python 中，使用 `def` 关键字定义函数，后面跟着函数名和包含可选参数的括号。函数体缩进，`return` 语句指定函数返回的值。\n\n\
    **Python 示例：**\n\n```python\ndef greet(name):\n    return \"Hello, \" + name +\
    \ \"!\"\nmessage = greet(\"John\")\nprint(message) # 输出: Hello, John!\n```\n\n\
    ### 默认参数\n\nPython 函数可以有默认参数值，当调用者没有为该参数提供特定参数时，就会使用该值。\n\n**Python 示例：**\n\n\
    ```python\ndef greet(name=\"Guest\"):\n    return \"Hello, \" + name + \"!\"\n\
    ```\n\n### 可变参数\n\nPython 函数可以接受变数量的参数。\n\n**Python 示例：**\n\n```python\ndef sum_values(*args):\n\
    \    total = 0\n    for arg in args:\n        total += arg\n    return total\n\
    ```\n\n## 第 2 节：Java 中的函数\n\n### 方法定义与调用\n\n在 Java 中，函数是定义在类中的方法。\n\n**Java 示例：**\n\
    \n```java\nclass Main {\n    public static String greet(String name) {\n     \
    \   return \"Hello, \" + name + \"!\";\n    }\n    public static void main(String[]\
    \ args) {\n        String message = greet(\"John\");\n        System.out.println(message);\n\
    \    }\n}\n```\n\n### 方法重载\n\nJava 支持方法重载，允许具有相同名称但参数列表不同的方法。\n\n**Java 示例：**\n\
    \n```java\nclass MathUtils {\n    public int add(int a, int b) {\n        return\
    \ a + b;\n    }\n    public double add(double a, double b) {\n        return a\
    \ + b;\n    }\n}\n```\n\n## 第 3 节：递归函数\n\nPython 和 Java 都支持递归函数，即函数在执行过程中调用自己。\n\
    \n**Python 示例：**\n\n```python\ndef factorial(n):\n    if n == 0:\n        return\
    \ 1\n    else:\n        return n * factorial(n - 1)\n\nprint(factorial(5)) # 输出:\
    \ 120\n```\n\n**Java 示例：**\n\n```java\nclass MathUtils {\n    public static int\
    \ factorial(int n) {\n        if (n == 0) {\n            return 1;\n        }\
    \ else {\n            return n * factorial(n - 1);\n        }\n    }\n    public\
    \ static void main(String[] args) {\n        System.out.println(factorial(5));\n\
    \    }\n}\n```\n\n## 第 4 节：Lambda 函数（仅限 Python）\n\nPython 支持 Lambda 函数，即使用 `lambda`\
    \ 关键字定义的匿名函数。\n\n**Python 示例：**\n\n```python\nadd = lambda a, b: a + b\nresult\
    \ = add(10, 20)\nprint(result) # 输出: 30\n```\n\n## 第 5 节：方法链\n\nPython 和 Java\
    \ 都允许方法链式，即在同一个对象上顺序调用多个方法。\n\n**Python 示例：**\n\n```python\nclass Calculator:\n\
    \    def __init__(self):\n        self.value = 0\n    def add(self, num):\n  \
    \      self.value += num\n        return self\n    def multiply(self, num):\n\
    \        self.value *= num\n        return self\n\ncalc = Calculator()\nresult\
    \ = calc.add(10).multiply(5).value\nprint(result) # 输出: 50\n```\n\n**Java 示例：**\n\
    \n```java\npublic class Calculator {\n    private int value;\n    public Calculator()\
    \ {\n        this.value = 0;\n    }\n    public Calculator add(int num) {\n  \
    \      this.value += num;\n        return this;\n    }\n    public Calculator\
    \ multiply(int num) {\n        this.value *= num;\n        return this;\n    }\n\
    \    public int getValue() {\n        return value;\n    }\n    public static\
    \ void main(String[] args) {\n        Calculator calc = new Calculator();\n  \
    \      int result = calc.add(10).multiply(5).getValue();\n        System.out.println(result);\
    \ // 输出: 50\n    }\n}\n```\n\n"
- fmt: "\nThis chapter covered functions and methods in both Python and Java, demonstrating\
    \ how they enable code modularity, reusability, and organization. Functions in\
