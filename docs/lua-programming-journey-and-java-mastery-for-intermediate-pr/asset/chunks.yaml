    ## Section 3: URL Handling


    ### Working with URLs


    URLs (Uniform Resource Locators) are used to identify resources on the internet
    or intranet.


    ### URL Class


    Java provides the `URL` class in the `java.net` package to work with URLs.


    **Example:**


    ```java


    import java.net.*;


    public class URLExample {


    public static void main(String[] args) {


    try {


    URL url = new URL("https://www.example.com/index.html");


    System.out.println("Protocol: " + url.getProtocol());


    System.out.println("Host: " + url.getHost());


    System.out.println("Port: " + url.getPort());


    System.out.println("Path: " + url.getPath());


    } catch (MalformedURLException e) {


    e.printStackTrace();


    }


    }


    }


    ```


    ## Section 4: HTTP Communication


    ### HTTP Basics


    HTTP (Hypertext Transfer Protocol) is the foundation of data communication on
    the internet.


    ### HttpURLConnection Class


    Java provides the `HttpURLConnection` class in the `java.net` package for making
    HTTP requests and processing responses.


    **Example:**


    ```java


    import java.io.*;


    import java.net.*;


    public class HTTPExample {


    public static void main(String[] args) {


    try {


    URL url = new URL("https://api.example.com/data");


    HttpURLConnection conn = (HttpURLConnection) url.openConnection();


    conn.setRequestMethod("GET");


    int responseCode = conn.getResponseCode();


    System.out.println("Response Code: " + responseCode);


    BufferedReader in = new BufferedReader(new InputStreamReader(conn.getInputStream()));


    String inputLine;


    StringBuffer response = new StringBuffer();


    while ((inputLine = in.readLine()) != null) {


    response.append(inputLine);


    }


    in.close();


    System.out.println("Response Data: " + response.toString());


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    ```


    ## Section 5: DatagramSocket and DatagramPacket


    ### UDP Communication


    UDP (User Datagram Protocol) is a connectionless protocol for sending and receiving
    data packets.


    ### DatagramSocket Class


    The `DatagramSocket` class in the `java.net` package is used for UDP communication.


    ### DatagramPacket Class


    The `DatagramPacket` class in the `java.net` package represents a data packet
    used in UDP communication.


    **Example:**


    ```java


    import java.net.*;


    import java.util.Arrays;


    public class UDPExample {


    public static void main(String[] args) {


    try {


    DatagramSocket socket = new DatagramSocket();


    byte[] sendData = "Hello, server!".getBytes();


    InetAddress serverAddress = InetAddress.getByName("localhost");


    int serverPort = 1234;


    DatagramPacket sendPacket = new DatagramPacket(sendData, sendData.length, serverAddress,
    serverPort);


    socket.send(sendPacket);


    byte[] receiveData = new byte[1024];


    DatagramPacket receivePacket = new DatagramPacket(receiveData, receiveData.length);


    socket.receive(receivePacket);


    String response = new String(receivePacket.getData(), 0, receivePacket.getLength());


    System.out.println("Server response: " + response);


    socket.close();


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    ```


    ## Conclusion


    Networking is a vital aspect of modern applications, and Java provides a robust
    set of APIs for handling networking tasks. In this chapter, we covered the fundamentals
    of networking in Java, including socket programming, URL handling, HTTP communication,
    and UDP communication. With the knowledge gained, you can build networked applications,
    client-server systems, and interact with resources across networks using Java.


    # **Chapter 12: GUI Development with Java**


    Graphical User Interfaces (GUIs) play a critical role in modern software applications,
    providing an intuitive and user-friendly way for users to interact with the program.
    Java offers robust GUI development capabilities through the Swing and JavaFX libraries.
    In this chapter, we will explore the fundamentals of GUI development in Java,
    covering Swing and JavaFX, and provide practical examples to demonstrate how to
    create interactive and visually appealing user interfaces.


    ## Section 1: Introduction to GUI Development in Java


    ### What is GUI Development?


    GUI development involves creating graphical interfaces for software applications,
    enabling users to interact with the program using visual elements.


    ### Java GUI Libraries


    Java provides two primary libraries for GUI development: Swing and JavaFX. Swing
    is the older library, while JavaFX is the newer and more modern one.


    ## Section 2: Swing GUI Development


    ### Introduction to Swing


    Swing is a part of the Java Foundation Classes (JFC) and has been around since
    Java''s early days. It provides a set of components and utilities for building
    desktop applications.


    ### Creating a Simple Swing Application


    **Example: HelloWorldSwing.java**


    ```java


    import javax.swing.*;


    public class HelloWorldSwing {


    public static void main(String[] args) {


    SwingUtilities.invokeLater(() -> {


    JFrame frame = new JFrame("Hello World Swing");


    frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);


    frame.setSize(300, 200);


    JLabel label = new JLabel("Hello, World!");


    frame.add(label);


    frame.setVisible(true);


    });


    }


    }


    ```


    ### Swing Components


    Swing provides various components, such as buttons, labels, text fields, checkboxes,
    etc., to build GUIs.


    ### Event Handling in Swing


    Event listeners are used to handle user interactions with Swing components.


    **Example: ButtonClickExample.java**


    ```java


    import javax.swing.*;


    import java.awt.event.ActionEvent;


    import java.awt.event.ActionListener;


    public class ButtonClickExample {


    public static void main(String[] args) {


    SwingUtilities.invokeLater(() -> {


    JFrame frame = new JFrame("Button Click Example");


    frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);


    frame.setSize(300, 200);


    JButton button = new JButton("Click Me!");


    frame.add(button);


    button.addActionListener(new ActionListener() {


    @Override


    public void actionPerformed(ActionEvent e) {


    JOptionPane.showMessageDialog(frame, "Button Clicked!");


    }


    });


    frame.setVisible(true);


    });


    }


    }


    ```


    ## Section 3: JavaFX GUI Development


    ### Introduction to JavaFX


    JavaFX is a modern GUI library that offers rich visual components and a more flexible
    architecture compared to Swing.


    ### Creating a Simple JavaFX Application


    **Example: HelloWorldJavaFX.java**


    ```java


    import javafx.application.Application;


    import javafx.scene.Scene;


    import javafx.scene.control.Label;


    import javafx.scene.layout.StackPane;


    import javafx.stage.Stage;


    public class HelloWorldJavaFX extends Application {


    @Override


    public void start(Stage primaryStage) {


    Label label = new Label("Hello, World!");


    StackPane root = new StackPane(label);


    Scene scene = new Scene(root, 300, 200);


    primaryStage.setTitle("Hello World JavaFX");


    primaryStage.setScene(scene);


    primaryStage.show();


    }


    public static void main(String[] args) {


    launch(args);


    }


    }


    ```


    ### JavaFX Components


    JavaFX provides a wide range of components, including layouts, controls, charts,
    media, and more.


    ### Event Handling in JavaFX


    JavaFX uses event handlers, similar to Swing, to handle user interactions.


