    ## Section 3: Thread Management


    ### Thread States


    Threads in Java can be in different states, such as `NEW`, `RUNNABLE`, `BLOCKED`,
    `WAITING`, `TIMED_WAITING`, and `TERMINATED`, depending on their execution status.


    ### Thread Priority


    Threads can be assigned different priorities using the `setPriority()` method,
    but it is platform-dependent, and its usage is limited.


    **Example:**


    ```java


    public class PriorityExample {


    public static void main(String[] args) {


    Thread thread1 = new Thread(() -> {


    for (int i = 0; i < 5; i++) {


    System.out.println("Thread 1 - Priority: " + Thread.currentThread().getPriority());


    }


    });


    Thread thread2 = new Thread(() -> {


    for (int i = 0; i < 5; i++) {


    System.out.println("Thread 2 - Priority: " + Thread.currentThread().getPriority());


    }


    });


    thread1.setPriority(Thread.MAX_PRIORITY);


    thread2.setPriority(Thread.MIN_PRIORITY);


    thread1.start();


    thread2.start();


    }


    }


    ```


    ### Daemon Threads


    Daemon threads are threads that run in the background and do not prevent the program
    from exiting when all non-daemon threads have finished.


    **Example:**


    ```java


    public class DaemonThreadExample {


    public static void main(String[] args) {


    Thread daemonThread = new Thread(() -> {


    while (true) {


    System.out.println("Daemon Thread is running...");


    }


    });


    daemonThread.setDaemon(true);


    daemonThread.start();


    System.out.println("Main thread is exiting...");


    }


    }


    ```


    ## Section 4: Thread Synchronization


    ### Thread Interference


    Thread interference occurs when multiple threads access shared resources concurrently,
    leading to unpredictable behavior.


    ### Synchronized Methods


    Synchronized methods ensure that only one thread can access the method at a time,
    preventing thread interference.


    **Example:**


    ```java


    public class Counter {


    private int count = 0;


    public synchronized void increment() {


    count++;


    }


    public synchronized int getCount() {


    return count;


    }


    }


    ```


    ### Synchronized Blocks


    Synchronized blocks allow more fine-grained control over synchronization by locking
    on specific objects.


    **Example:**


    ```java


    public class SynchronizedBlockExample {


    private final Object lock = new Object();


    private int count = 0;


    public void increment() {


    synchronized (lock) {


    count++;


    }


    }


    public int getCount() {


    synchronized (lock) {


    return count;


    }


    }


    }


    ```


    ## Section 5: Concurrent Collections


    ### ConcurrentHashMap


    `ConcurrentHashMap` is a thread-safe version of `HashMap`, suitable for concurrent
    access.


    **Example:**


    ```java


    import java.util.concurrent.ConcurrentHashMap;


    public class ConcurrentHashMapExample {


    public static void main(String[] args) {


    ConcurrentHashMap<String, Integer> map = new ConcurrentHashMap<>();


    map.put("one", 1);


    map.put("two", 2);


    map.forEach((key, value) -> System.out.println(key + " : " + value));


    }


    }


    ```


    ### CopyOnWriteArrayList


    `CopyOnWriteArrayList` is a thread-safe version of `ArrayList`, optimized for
    read-heavy workloads.


    **Example:**


    ```java


    import java.util.List;


    import java.util.concurrent.CopyOnWriteArrayList;


    public class CopyOnWriteArrayListExample {


    public static void main(String[] args) {


    List<String> list = new CopyOnWriteArrayList<>();


    list.add("Alice");


    list.add("Bob");


    list.forEach(System.out::println);


    }


    }


    ```


    ## Section 6: Thread Communication


    ### Using `wait()` and `notify()`


    `wait()` and `notify()` methods allow threads to communicate and coordinate their
    activities.


    **Example:**


    ```java


    public class WaitNotifyExample {


    public static void main(String[] args) {


    Object lock = new Object();


    Thread producer = new Thread(() -> {


    synchronized (lock) {


    System.out.println("Producer is producing data...");


    lock.notify(); // Notify the waiting consumer


    }


    });


    Thread consumer = new Thread(() -> {


    synchronized (lock) {


    try {


    lock.wait(); // Wait for the producer to produce data


    System.out.println("Consumer is consuming data...");


    } catch (InterruptedException e) {


    e.printStackTrace();


    }


    }


    });


    producer.start();


    consumer.start();


    }


    }


    ```


    ## Section 7: Thread Safety


    ### Thread Safety in Java


    Thread safety refers to the ability of a program to perform correctly and safely
    in a multithreaded environment.


    ### Immutable Objects


    Immutable objects are inherently thread-safe as their state cannot be modified
    after creation.


    **Example:**


    ```java


    public final class ImmutablePoint {


    private final int x;


    private final int y;


    public ImmutablePoint(int x, int y) {


    this.x = x;


    this.y = y;


    }


    public int getX() {


    return x;


    }


    public int getY() {


    return y;


    }


    }


    ```


    ## Conclusion


    Concurrency is a crucial aspect of modern programming, and Java provides powerful
    tools and APIs to manage threads and concurrent programming effectively.


    # **Chapter 11: Networking with Java**


    Networking is an essential part of modern applications, enabling communication
    between different devices and systems over the internet. Java provides robust
    networking capabilities through its networking APIs, allowing developers to create
    client-server applications, transfer data, and communicate across networks. In
    this chapter, we will explore the fundamentals of networking in Java, covering
    socket programming, URL handling, and HTTP communication, with practical examples
    to demonstrate how to build networked applications.


    ## Section 1: Introduction to Networking in Java


    ### What is Networking?


    Networking involves the communication between different devices or systems over
    a network, such as the internet or an intranet.


    ### Java Networking API


    Java provides a comprehensive set of classes and interfaces in the `java.net`
    package to facilitate network programming.


    ### Client-Server Model


    The client-server model is a common networking architecture where one device (the
    client) requests services from another device (the server).


    ## Section 2: Socket Programming


    ### Understanding Sockets


    Sockets are the endpoints for communication between two devices over a network.
    In Java, socket programming enables the establishment of connections and data
    transfer between client and server applications.


    ### Socket Types


    Java supports two types of sockets: client sockets and server sockets. Client
    sockets initiate connections to servers, while server sockets listen for incoming
    client connections.


    ### Client Socket Example


    **Example: Client.java**


    ```java


    import java.io.*;


    import java.net.*;


    public class Client {


    public static void main(String[] args) {


    try {


    Socket clientSocket = new Socket("localhost", 1234);


    PrintWriter out = new PrintWriter(clientSocket.getOutputStream(), true);


    BufferedReader in = new BufferedReader(new InputStreamReader(clientSocket.getInputStream()));


    out.println("Hello, server!");


    String response = in.readLine();


    System.out.println("Server response: " + response);


    clientSocket.close();


    } catch (IOException e) {


    e.printStackTrace();


    }


    }


    }


    ```


