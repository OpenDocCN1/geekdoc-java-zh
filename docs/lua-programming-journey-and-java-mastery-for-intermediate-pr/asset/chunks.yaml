    \ class:\n\n```lua\n-- Implementing encapsulation for the BankAccount class\n\
    BankAccount = {}\n\nfunction BankAccount:new(balance)\n  local obj = { _balance\
    \ = balance }  -- Convention: Use \"_\" to indicate private\n  setmetatable(obj,\
    \ self)\n  self.__index = self\n  return obj\nend\n\nfunction BankAccount:getBalance()\n\
    \  return self._balance\nend\n\nfunction BankAccount:deposit(amount)\n  self._balance\
    \ = self._balance + amount\nend\n\nfunction BankAccount:withdraw(amount)\n  if\
    \ amount <= self._balance then\n    self._balance = self._balance - amount\n \
    \ else\n    print(\"Insufficient balance\")\n  end\nend\n```\n\nIn this example,\
    \ the `_balance` attribute is considered private due to the naming convention.\
    \ While it's not enforced by the language, using `_` as a prefix signifies that\
    \ the attribute should not be accessed directly from outside the class.\n\n###\
