    ```


    在这个示例中，我们创建了一个简单的计算器界面，包含两个输入字段、“加”和“减”按钮以及一个结果标签。点击按钮会根据用户输入计算并显示结果。


    ### GUI 编程的最佳实践


    使用 Lua 创建 GUI 应用程序时，请考虑以下最佳实践：


    1\. **保持界面直观：** 在设计界面时考虑用户友好性。逻辑化地组织元素并提供清晰的指令。


