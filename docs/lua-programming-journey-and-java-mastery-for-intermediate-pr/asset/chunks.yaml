    ### Reading and Writing Text Files


    Lua provides simple and effective functions for reading and writing text files.
    The `io.open` function allows you to open files in different modes, such as reading
    (`"r"`), writing (`"w"`), or appending (`"a"`).


    Let''s start by creating a text file and writing data to it:


    ```lua


    -- Writing data to a text file


    file = io.open("data.txt", "w")


    file:write("Hello, world!\n")


