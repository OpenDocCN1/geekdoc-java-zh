    file:close()


    ```


    Now, let''s read the binary data from the file:


    ```lua


    -- Reading binary data from a file


    file = io.open("binary_data.bin", "rb")


    data = file:read("*all")


    file:close()


    for i = 1, #data do


    print(data:byte(i))


    end


    ```


    This code reads each byte of binary data and prints its ASCII value.


