    # **Chapter 2: Understanding Object-Oriented Programming**


    Object-oriented programming (OOP) is a programming paradigm that revolves around
    the concept of "objects" - self-contained units that encapsulate data and behavior.
    OOP enables developers to model real-world entities and relationships, making
    it a powerful and widely used approach in modern software development. In this
    chapter, we will explore the fundamental principles of OOP, including classes,
    objects, inheritance, polymorphism, and encapsulation, with practical examples
    in both Java and Python.


    ## Section 1: Classes and Objects


    ### Classes


    A class is a blueprint or template for creating objects. It defines the structure
    and behavior of objects that will be instantiated from it. In Java, a class is
    defined using the `class` keyword, while in Python, the `class` keyword is used.


    Let''s consider a simple example of a class representing a "Car" in both Java
    and Python:


    **Java Example:**


    ```java


    public class Car {


    // Fields or instance variables


    String make;


    String model;


    int year;


    // Constructor


    public Car(String make, String model, int year) {


    this.make = make;


    this.model = model;


    this.year = year;


    }


    // Method to display car information


    public void displayInfo() {


    System.out.println("Make: " + make);


    System.out.println("Model: " + model);


    System.out.println("Year: " + year);


    }


    }


    ```


    **Python Example:**


    ```python


    class Car:


    # Constructor


    def __init__(self, make, model, year):


    self.make = make


    self.model = model


    self.year = year


    # Method to display car information


    def display_info(self):


    print("Make:", self.make)


    print("Model:", self.model)


    print("Year:", self.year)


    ```


    ### Objects


    An object is an instance of a class, representing a specific entity. It has its
    own unique state (data) and behavior (methods). To create an object in both Java
    and Python, we use the class constructor.


    **Java Example:**


    ```java


    // Creating a Car object


    Car car1 = new Car("Toyota", "Camry", 2022);


    ```


    **Python Example:**


    ```python


    # Creating a Car object


    car1 = Car("Toyota", "Camry", 2022)


    ```


    ## Section 2: Inheritance


    Inheritance is a key principle of OOP that allows a class (called the "subclass"
    or "derived class") to inherit properties and methods from another class (called
    the "superclass" or "base class"). This facilitates code reusability and promotes
    a hierarchical relationship between classes.


    Let''s consider an example of inheritance using a base class "Animal" and two
    subclasses, "Dog" and "Cat," in both Java and Python:


    **Java Example:**


    ```java


    class Animal {


    void makeSound() {


    System.out.println("Animal makes a sound");


    }


    }


    class Dog extends Animal {


    @Override


    void makeSound() {


    System.out.println("Dog barks");


    }


    }


    class Cat extends Animal {


    @Override


    void makeSound() {


    System.out.println("Cat meows");


    }


    }


    ```


    **Python Example:**


    ```python


    class Animal:


    def make_sound(self):


    print("Animal makes a sound")


    class Dog(Animal):


    def make_sound(self):


    print("Dog barks")


    class Cat(Animal):


    def make_sound(self):


    print("Cat meows")


    ```


    ## Section 3: Polymorphism


    Polymorphism allows objects of different classes to be treated as objects of a
    common superclass. It enables a single interface to represent different types
    of entities, providing flexibility and extensibility in the code.


    In the example above, both the `Dog` and `Cat` classes inherit from the `Animal`
    class. This means that we can treat objects of `Dog` and `Cat` as objects of the
    `Animal` class.


    **Java Example:**


    ```java


    public class Main {


    public static void main(String[] args) {


    Animal animal1 = new Dog();


    Animal animal2 = new Cat();


    animal1.makeSound(); // Output: Dog barks


    animal2.makeSound(); // Output: Cat meows


    }


    }


    ```


    **Python Example:**


    ```python


    # Polymorphism in Python


    animals = [Dog(), Cat()]


    for animal in animals:


    animal.make_sound()


    # Output:


    # Dog barks


    # Cat meows


    ```


    ## Section 4: Encapsulation


    Encapsulation is the principle of hiding the internal implementation details of
    a class and providing access to the class''s functionalities through methods (getters
    and setters). This ensures data security and prevents unauthorized access to the
    class''s state.


    In the car example from the first section, we can encapsulate the fields using
    getter and setter methods.


    **Java Example:**


    ```java


    public class Car {


    private String make;


    private String model;


    private int year;


    public String getMake() {


    return make;


    }


    public void setMake(String make) {


    this.make = make;


    }


    // Similar methods for model and year


    }


    ```


    **Python Example:**


    ```python


    class Car:


    def __init__(self, make, model, year):


    self._make = make


    self._model = model


    self._year = year


    def get_make(self):


    return self._make


    def set_make(self, make):


    self._make = make


    # Similar methods for model and year


    ```


    ---


    This chapter provided a comprehensive introduction to object-oriented programming,
    covering the concepts of classes, objects, inheritance, polymorphism, and encapsulation.
    These principles form the foundation of OOP, enabling developers to create modular,
    maintainable, and extensible code.


