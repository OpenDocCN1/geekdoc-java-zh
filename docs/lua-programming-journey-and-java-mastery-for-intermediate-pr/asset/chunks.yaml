    \ \" + model);\n        System.out.println(\"Year: \" + year);\n    }\n}\n```\n\
    \n**Python 示例：**\n\n```python\nclass Car:\n    # 构造函数\n    def __init__(self,\
    \ make, model, year):\n        self.make = make\n        self.model = model\n\
    \        self.year = year\n\n    # 显示汽车信息的方法\n    def display_info(self):\n  \
    \      print(\"Make:\", self.make)\n        print(\"Model:\", self.model)\n  \
    \      print(\"Year:\", self.year)\n```\n\n### 对象\n\n对象是类的实例，代表一个特定的实体。它有自己独特的状态（数据）和行为（方法）。在\
    \ Java 和 Python 中创建对象时，我们使用类的构造函数。\n\n**Java 示例：**\n\n```java\n// 创建一个 Car 对象\n\
    Car car1 = new Car(\"Toyota\", \"Camry\", 2022);\n```\n\n**Python 示例：**\n\n```python\n\
    # 创建一个 Car 对象\ncar1 = Car(\"Toyota\", \"Camry\", 2022)\n```\n\n## 第 2 节：继承\n\n\
    继承是 OOP 的核心原则，允许一个类（称为“子类”或“派生类”）从另一个类（称为“父类”或“基类”）继承属性和方法。这促进了代码重用并促进了类之间的层次级关系。\n\
    \n让我们考虑在 Java 和 Python 中使用基类“Animal”（动物）以及两个子类“Dog”（狗）和“Cat”（猫）的继承示例：\n\n**Java\
    \ 示例：**\n\n```java\nclass Animal {\n    void makeSound() {\n        System.out.println(\"\
    Animal makes a sound\");\n    }\n}\n\nclass Dog extends Animal {\n    @Override\n\
    \    void makeSound() {\n        System.out.println(\"Dog barks\");\n    }\n}\n\
    \nclass Cat extends Animal {\n    @Override\n    void makeSound() {\n        System.out.println(\"\
    Cat meows\");\n    }\n}\n```\n\n**Python 示例：**\n\n```python\nclass Animal:\n \
    \   def make_sound(self):\n        print(\"Animal makes a sound\")\n\nclass Dog(Animal):\n\
    \    def make_sound(self):\n        print(\"Dog barks\")\n\nclass Cat(Animal):\n\
    \    def make_sound(self):\n        print(\"Cat meows\")\n```\n\n## 第 3 节：多态\n\
    \n多态允许不同类的对象被视为公共父类的对象。它允许一个接口表示不同的类型，从而提供了代码的灵性和扩展性。\n\n在上面的示例中，`Dog` 和 `Cat`\
    \ 类继承自 `Animal` 类。这意味着我们可以将 `Dog` 和 `Cat` 的对象视为 `Animal` 的对象。\n\n**Java 示例：**\n\
    \n```java\npublic class Main {\n    public static void main(String[] args) {\n\
    \        Animal animal1 = new Dog();\n        Animal animal2 = new Cat();\n  \
    \      animal1.makeSound(); // 输出: Dog barks\n        animal2.makeSound(); //\
    \ 输出: Cat meows\n    }\n}\n```\n\n**Python 示例：**\n\n```python\n# Python 中的多态\n\
    animals = [Dog(), Cat()]\nfor animal in animals:\n    animal.make_sound()\n# 输出：\n\
    # Dog barks\n# Cat meows\n```\n\n## 第 4 节：封装\n\n封装是隐藏类内部细节并通过方法（getter 和 setter）提供类功能访问的原则。这确保了数据安全，并防止了对类状态的未经访问。\n\
    \n在第一节的汽车示例中，我们可以使用 getter 和 setter 方法封装字段。\n\n**Java 示例：**\n\n```java\npublic\
    \ class Car {\n    private String make;\n    private String model;\n    private\
    \ int year;\n\n    public String getMake() {\n        return make;\n    }\n\n\
    \    public void setMake(String make) {\n        this.make = make;\n    }\n  \
    \  // 对于 model 和 year 的类似方法\n}\n```\n\n**Python 示例：**\n\n```python\nclass Car:\n\
    \    def __init__(self, make, model, year):\n        self._make = make\n     \
    \   self._model = model\n        self._year = year\n\n    def get_make(self):\n\
    \        return self._make\n\n    def set_make(self, make):\n        self._make\
    \ = make\n    # 对于 model 和 year 的类似方法\n```\n"
- fmt: "\nIn any programming language, data types and variables play a crucial role\
    \ in defining and manipulating data. Understanding data types allows programmers\
    \ to handle different kinds of data efficiently, while variables enable the storage\
    \ and manipulation of data during the program's execution. In this chapter, we\
    \ will explore data types and variables in both Java and Python, along with practical\
    \ examples to demonstrate their usage.\n\n## Section 1: Data Types\n\n### Data\
    \ Types in Java\n\nJava is a statically typed language, which means that the data\
    \ type of a variable must be explicitly declared before it can be used. Java provides\
    \ several built-in data types to represent various kinds of data:\n\n1. **Primitive\
    \ Data Types:** These are the basic data types representing single values. There\
    \ are eight primitive data types in Java:\n\n- `byte`: 8-bit signed integer (-128\
    \ to 127)\n\n- `short`: 16-bit signed integer (-32,768 to 32,767)\n\n- `int`:\
    \ 32-bit signed integer (-2^31 to 2^31 - 1)\n\n- `long`: 64-bit signed integer\
    \ (-2^63 to 2^63 - 1)\n\n- `float`: 32-bit floating-point number (approx. ±3.40282347E+38F)\n\
    \n- `double`: 64-bit floating-point number (approx. ±1.79769313486231570E+308)\n\
    \n- `char`: 16-bit Unicode character (0 to 65,535)\n\n- `boolean`: Represents\
    \ true or false\n\n2. **Reference Data Types:** These data types refer to objects\
    \ created from classes or interfaces. Examples include strings, arrays, and user-defined\
    \ classes.\n\n### Data Types in Python\n\nPython is a dynamically typed language,\
    \ meaning the data type of a variable is determined automatically based on the\
    \ assigned value. Python provides the following built-in data types:\n\n1. **Numeric\
    \ Types:** These include `int` (integers with unlimited precision), `float` (floating-point\
    \ numbers), and `complex` (complex numbers).\n\n2. **Sequence Types:** These represent\
    \ sequences of values. The main sequence types are `list`, `tuple`, and `range`.\n\
    \n3. **Text Type:** The `str` data type represents strings of characters.\n\n\
    4. **Boolean Type:** The `bool` data type represents the truth values `True` and\
    \ `False`.\n\n5. **Set Types:** These include `set` (unordered collection of unique\
    \ elements) and `frozenset` (immutable set).\n\n6. **Mapping Type:** The `dict`\
    \ data type represents key-value pairs.\n\n## Section 2: Variables\n\n### Declaring\
    \ Variables in Java\n\nIn Java, variables must be declared with an explicit data\
    \ type before they can be used. The syntax for declaring variables is as follows:\n\
    \n```java\n<dataType> <variableName>;\n```\n\nHere's an example of declaring and\
    \ initializing variables in Java:\n\n```java\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        int age;\n        double salary;\n\
    \        char grade;\n        age = 30;\n        salary = 45000.50;\n        grade\
    \ = 'A';\n        System.out.println(\"Age: \" + age);\n        System.out.println(\"\
    Salary: \" + salary);\n        System.out.println(\"Grade: \" + grade);\n    }\n\
    }\n```\n\n### Declaring Variables in Python\n\nIn Python, you can directly assign\
    \ values to variables without explicitly declaring their data types. Python infers\
    \ the data type based on the assigned value. Here's an example of declaring and\
    \ initializing variables in Python:\n\n```python\nage = 30\nsalary = 45000.50\n\
    grade = 'A'\nprint(\"Age:\", age)\nprint(\"Salary:\", salary)\nprint(\"Grade:\"\
    , grade)\n```\n\n### Variable Naming Rules\n\nBoth Java and Python have specific\
    \ rules for variable naming:\n\n- Variable names can contain letters (a-z, A-Z),\
    \ digits (0-9), and underscores (`_`).\n- The first character of a variable name\
    \ cannot be a digit.\n- Variable names are case-sensitive, meaning `age`, `Age`,\
    \ and `AGE` are considered different variables.\n\n## Section 3: Type Conversion\
    \ and Casting\n\n### Type Conversion in Java\n\nJava provides automatic type conversion\
    \ for compatible data types, known as widening conversion. For example, converting\
    \ an `int` to a `double`:\n\n```java\nint number = 10;\ndouble result = number;\
    \ // Automatic conversion from int to double\n```\n\nHowever, explicit type conversion,\
    \ known as casting, is required when converting from a larger data type to a smaller\
    \ data type to avoid data loss:\n\n```java\ndouble largeNumber = 1234.56;\nint\
    \ smallNumber = (int) largeNumber; // Casting from double to int\n```\n\n### Type\
    \ Conversion in Python\n\nPython also performs automatic type conversion, but\
    \ it is referred to as \"type coercion.\" For example, converting an `int` to\
    \ a `float`:\n\n```python\nnumber = 10\nresult = float(number) # Automatic conversion\
    \ from int to float\n```\n\nSimilarly, explicit type conversion is used when converting\
    \ between different data types:\n\n```python\nlarge_number = 1234.56\nsmall_number\
    \ = int(large_number) # Casting from float to int\n```\n\n## Section 4: Type Checking\
    \ and Type Conversion Functions\n\n### Type Checking in Java\n\nIn Java, you can\
    \ check the data type of a variable using the `instanceof` operator. It returns\
    \ `true` if the variable is an instance of the specified variable.\n\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        int\
    \ age = 30;\n        double salary = 45000.50;\n        char grade = 'A';\n\n\
    \        if (age instanceof Integer) {\n            System.out.println(\"age is\
    \ an Integer\");\n        }\n        if (salary instanceof Double) {\n       \
    \     System.out.println(\"salary is a Double\");\n        }\n    }\n}\n```\n\n\
    ### Type Checking in Python\n\nPython uses the `type()` function to check the\
    \ data type of a variable:\n\n```python\nage = 30\nsalary = 45000.50\ngrade =\
    \ 'A'\n\nprint(type(age))\nprint(type(salary))\nprint(type(grade))\n```\n\n###\
    \ Type Conversion Functions\n\nPython provides built-in functions to convert between\
    \ types:\n\n- `int()`: Converts to an integer.\n- `float()`: Converts to a floating-point\
    \ number.\n- `str()`: Converts to a string.\n- `bool()`: Converts to a boolean.\n\
    \n## Section 5: Examples of Data Types and Variables\n\n### Example 1: Working\
    \ with Numeric Types\n\n**Java Example:**\n\n```java\nint num1 = 10;\nint num2\
    \ = 20;\nint sum = num1 + num2;\nSystem.out.println(\"Sum: \" + sum);\n```\n\n\
    **Python Example:**\n\n```python\nnum1 = 10\nnum2 = 20\nsum = num1 + num2\nprint(\"\
    Sum:\", sum)\n```\n\n### Example 2: Manipulating Strings\n\n**Java Example:**\n\
    \n```java\nString firstName = \"John\";\nString lastName = \"Doe\";\nString fullName\
    \ = firstName + \" \" + lastName;\nSystem.out.println(\"Full Name: \" + fullName);\n\
    ```\n\n**Python Example:**\n\n```python\nfirst_name = \"John\"\nlast_name = \"\
    Doe\"\nfull_name = first_name + \" \" + last_name\nprint(\"Full Name:\", full_name)\n\
    ```\n\n### Example 3: Using Boolean Variables\n\n**Java Example:**\n\n```java\n\
    boolean isRaining = true;\nif (isRaining) {\n    System.out.println(\"Take an\
    \ umbrella.\");\n} else {\n    System.out.println(\"Enjoy the sunshine.\");\n\
    }\n```\n\n**Python Example:**\n\n```python\nis_raining = True\nif is_raining:\n\
    \    print(\"Take an umbrella.\")\nelse:\n    print(\"Enjoy the sunshine!\")\n\
    ```\n"
  raw: 'In any programming language, data types and variables play a crucial role
    in defining and manipulating data. Understanding data types allows programmers
    to handle different kinds of data efficiently, while variables enable the storage
    and manipulation of data during the program''s execution. In this chapter, we
    will explore data types and variables in both Java and Python, along with practical
    examples to demonstrate their usage.


    ## Section 1: Data Types


    ### Data Types in Java


    Java is a statically typed language, which means that the data type of a variable
    must be explicitly declared before it can be used. Java provides several built-in
    data types to represent various kinds of data:


    1\. **Primitive Data Types:** These are the basic data types representing single
    values. There are eight primitive data types in Java:


    - `byte`: 8-bit signed integer (-128 to 127)


    - `short`: 16-bit signed integer (-32,768 to 32,767)


    - `int`: 32-bit signed integer (-2^31 to 2^31 - 1)


    - `long`: 64-bit signed integer (-2^63 to 2^63 - 1)


    - `float`: 32-bit floating-point number (approx. ±3.40282347E+38F)


    - `double`: 64-bit floating-point number (approx. ±1.79769313486231570E+308)


    - `char`: 16-bit Unicode character (0 to 65,535)


    - `boolean`: Represents true or false


    2\. **Reference Data Types:** These data types refer to objects created from classes
    or interfaces. Examples include strings, arrays, and user-defined classes.


    ### Data Types in Python


    Python is a dynamically typed language, meaning the data type of a variable is
    determined automatically based on the assigned value. Python provides the following
    built-in data types:


    1\. **Numeric Types:** These include `int` (integers with unlimited precision),
    `float` (floating-point numbers), and `complex` (complex numbers).


    2\. **Sequence Types:** These represent sequences of values. The main sequence
    types are `list`, `tuple`, and `range`.


    3\. **Text Type:** The `str` data type represents strings of characters.


    4\. **Boolean Type:** The `bool` data type represents the truth values `True`
    and `False`.


    5\. **Set Types:** These include `set` (unordered collection of unique elements)
    and `frozenset` (immutable set).


    6\. **Mapping Type:** The `dict` data type represents key-value pairs.


    ## Section 2: Variables


    ### Declaring Variables in Java


    In Java, variables must be declared with an explicit data type before they can
    be used. The syntax for declaring variables is as follows:


    ```java


    <dataType> <variableName>;


    ```


    Here''s an example of declaring and initializing variables in Java:


    ```java


    public class Main {


    public static void main(String[] args) {


    int age;


    double salary;


    char grade;


    age = 30;


    salary = 45000.50;


    grade = ''A'';


    System.out.println("Age: " + age);


    System.out.println("Salary: " + salary);


    System.out.println("Grade: " + grade);


    }


    }


    ```


    ### Declaring Variables in Python


    In Python, you can directly assign values to variables without explicitly declaring
    their data types. Python infers the data type based on the assigned value. Here''s
    an example of declaring and initializing variables in Python:


    ```python


    age = 30


    salary = 45000.50


    grade = ''A''


    print("Age:", age)


    print("Salary:", salary)


    print("Grade:", grade)


    ```


    ### Variable Naming Rules


    Both Java and Python have specific rules for variable naming:


    - Variable names can contain letters (a-z, A-Z), digits (0-9), and underscores
    (_).


    - The first character of a variable name cannot be a digit.


    - Variable names are case-sensitive, meaning `age`, `Age`, and `AGE` are considered
    different variables.


    ## Section 3: Type Conversion and Casting


    ### Type Conversion in Java


    Java provides automatic type conversion for compatible data types, known as widening
    conversion. For example, converting an `int` to a `double`:


    ```java


    int number = 10;


    double result = number; // Automatic conversion from int to double


    ```


    However, explicit type conversion, known as casting, is required when converting
    from a larger data type to a smaller data type to avoid data loss:


    ```java


    double largeNumber = 1234.56;


    int smallNumber = (int) largeNumber; // Casting from double to int


    ```


    ### Type Conversion in Python


    Python also performs automatic type conversion, but it is referred to as "type
    coercion." For example, converting an `int` to a `float`:


    ```python


    number = 10


    result = float(number) # Automatic conversion from int to float


    ```


    Similarly, explicit type conversion is used when converting between different
    data types:


    ```python


    large_number = 1234.56


    small_number = int(large_number) # Casting from float to int


    ```


    ## Section 4: Type Checking and Type Conversion Functions


    ### Type Checking in Java


    In Java, you can check the data type of a variable using the `instanceof` operator.
    It returns `true` if the variable is an instance of the specified data type, otherwise
    `false`.


    ```java


    public class Main {


    public static void main(String[] args) {


    int number = 10;


    double salary = 45000.50;


    System.out.println(number instanceof Integer); // Output: true


    System.out.println(salary instanceof Double); // Output: true


    }


    }


    ```


    ### Type Checking in Python


    Python provides the `type()` function to check the data type of a variable:


    ```python


    number = 10


    salary = 45000.50


    print(type(number)) # Output: <class ''int''>


    print(type(salary)) # Output: <class ''float''>


    ```


    ### Type Conversion Functions in Python


    Python offers built-in functions to explicitly convert variables between different
    data types:


    - `int()`: Converts a value to an integer.


    - `float()`: Converts a value to a floating-point number.


    - `str()`: Converts a value to a string.


    - `bool()`: Converts a value to a boolean.


    ## Section 5: Examples of Data Types and Variables


    ### Example 1: Working with Numeric Data Types


    **Java Example:**


    ```java


    int num1 = 10;


    int num2 = 20;


    int sum = num1 + num2;


    System.out.println("Sum: " + sum);


    ```


    **Python Example:**


    ```python


    num1 = 10


    num2 = 20


    sum = num1 + num2


    print("Sum:", sum)


    ```


    ### Example 2: Manipulating Strings


    **Java Example:**


    ```java


    String firstName = "John";


    String lastName = "Doe";


    String fullName = firstName + " " + lastName;


    System.out.println("Full Name: " + fullName);


    ```


    **Python Example:**


    ```python


    first_name = "John"


    last_name = "Doe"


    full_name = first_name + " " +


    last_name


    print("Full Name:", full_name)


    ```


    ### Example 3: Using Boolean Variables


    **Java Example:**


    ```java


    boolean isRaining = true;


    if (isRaining) {


    System.out.println("Take an umbrella.");


    } else {


    System.out.println("Enjoy the sunshine!");


    }


    ```


    **Python Example:**


    ```python


    is_raining = True


    if is_raining:


    print("Take an umbrella.")


    else:


    print("Enjoy the sunshine!")


    ```


    ---


    This chapter covered the essential concepts of data types and variables in both
    Java and Python. Data types enable the representation of different kinds of data,
    while variables serve as containers to store and manipulate this data during program
    execution. Understanding data types and variables is fundamental to writing efficient
    and error-free code.


    # **Chapter 4: Control Flow and Decision Making**


    Control flow and decision-making structures are essential elements of any programming
    language that enable the execution of code in a controlled and conditional manner.
    In this chapter, we will explore control flow statements like conditionals and
    loops in both Java and Python, along with practical examples to demonstrate their
    usage.


    ## Section 1: Conditional Statements


    ### If-Else Statement in Java


    The if-else statement is used to make decisions in Java based on the evaluation
    of a condition. If the condition is true, the code block inside the if statement
    is executed; otherwise, the code block inside the else statement is executed.


    **Java Example:**


    ```java


    int age = 25;


    if (age >= 18) {


    System.out.println("You are an adult.");


    } else {


    System.out.println("You are a minor.");


    }


    ```'
