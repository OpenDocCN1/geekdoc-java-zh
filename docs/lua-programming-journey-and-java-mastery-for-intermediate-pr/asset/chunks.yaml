    # **Chapter 5: Functions and Methods**


    Functions and methods are crucial building blocks in programming that allow developers
    to break down complex tasks into smaller, manageable pieces of code. They promote
    code reusability, modularity, and organization, making the development process
    more efficient and maintainable. In this chapter, we will explore functions and
    methods in both Java and Python, along with practical examples to illustrate their
    usage.


    ## Section 1: Functions in Python


    ### Function Declaration and Invocation


    In Python, functions are defined using the `def` keyword followed by the function
    name and a pair of parentheses containing optional parameters. The function block
    is indented, and the `return` statement specifies the value to be returned from
    the function.


    **Python Example:**


    ```python


    def greet(name):


    return "Hello, " + name + "!"


    message = greet("John")


    print(message) # Output: Hello, John!


    ```


    ### Default Parameters


    Python functions can have default parameter values, which are used when the caller
    does not provide a specific argument for that parameter.


    **Python Example:**


    ```python


    def greet(name="Guest"):


    return "Hello, " + name + "!"


    message1 = greet("John")


    message2 = greet()


    print(message1) # Output: Hello, John!


    print(message2) # Output: Hello, Guest!


    ```


    ### Variable Number of Arguments


    Python functions can accept a variable number of arguments using the `*args` and
    `**kwargs` syntax.


    **Python Example:**


    ```python


    def sum_values(*args):


    total = 0


    for num in args:


    total += num


    return total


    result = sum_values(1, 2, 3, 4, 5)


    print(result) # Output: 15


    ```


    ## Section 2: Functions in Java


    ### Method Declaration and Invocation


    In Java, functions are called methods and are defined inside classes. A method
    declaration includes the access modifier, return type, method name, and a pair
    of parentheses containing optional parameters. The method block is enclosed in
    curly braces.


    **Java Example:**


    ```java


    public class MathUtils {


    public static int add(int a, int b) {


    return a + b;


    }


    public static void main(String[] args) {


    int result = add(10, 20);


    System.out.println(result); // Output: 30


    }


    }


    ```


    ### Method Overloading


    Java supports method overloading, allowing multiple methods in the same class
    with the same name but different parameter lists.


    **Java Example:**


    ```java


    public class MathUtils {


    public static int add(int a, int b) {


    return a + b;


    }


    public static double add(double a, double b) {


    return a + b;


    }


    public static void main(String[] args) {


    int result1 = add(10, 20);


    double result2 = add(2.5, 3.5);


    System.out.println(result1); // Output: 30


    System.out.println(result2); // Output: 6.0


    }


    }


    ```


    ## Section 3: Recursive Functions


    Both Python and Java support recursive functions, where a function calls itself
    during its execution.


    **Python Example:**


    ```python


    def factorial(n):


    if n == 0:


    return 1


    else:


    return n * factorial(n - 1)


    result = factorial(5)


    print(result) # Output: 120


    ```


    **Java Example:**


    ```java


    public class MathUtils {


    public static int factorial(int n) {


    if (n == 0) {


    return 1;


    } else {


    return n * factorial(n - 1);


    }


    }


    public static void main(String[] args) {


    int result = factorial(5);


    System.out.println(result); // Output: 120


    }


    }


    ```


    ## Section 4: Lambda Functions (Python Only)


    Python supports lambda functions, which are anonymous functions defined using
    the `lambda` keyword.


    **Python Example:**


    ```python


    add = lambda a, b: a + b


    result = add(10, 20)


    print(result) # Output: 30


    ```


    ## Section 5: Method Chaining


    Both Python and Java allow method chaining, where multiple methods are called
    in sequence on the same object.


    **Python Example:**


    ```python


    class Calculator:


    def __init__(self):


    self.value = 0


    def add(self, num):


    self.value += num


    return self


    def multiply(self, num):


    self.value *= num


    return self


    calc = Calculator()


    result = calc.add(10).multiply(5).value


    print(result) # Output: 50


    ```


    **Java Example:**


    ```java


    public class Calculator {


    private int value;


    public Calculator() {


    this.value = 0;


    }


    public Calculator add(int num) {


    this.value += num;


    return this;


    }


    public Calculator multiply(int num) {


    this.value *= num;


    return this;


    }


    public int getValue() {


    return value;


    }


    public static void main(String[] args) {


    Calculator calc = new Calculator();


    int result = calc.add(10).multiply(5).getValue();


    System.out.println(result); // Output: 50


    }


    }


    ```


