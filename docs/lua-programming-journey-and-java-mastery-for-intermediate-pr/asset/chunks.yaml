    Here, we''ve defined the `__lt` metamethod to compare characters based on their
    total damage. When we use the `<` operator, Lua calls the metamethod to determine
    the result.


    ### Customizing Standard Operations


    Metatables and metamethods can also be used to customize various standard operations
    like indexing, arithmetic, and string representation.


    Consider the following example where we use the `__tostring` metamethod to provide
    a custom string representation for character objects:


    ```lua

    -- Defining a metatable with a __tostring metamethod

    character_metatable = {

    __index = {

    calculate_total_damage = function(self)

    return self.hp + self.attack

    end

    },

    __tostring = function(self)

    return self.name .. " (HP: " .. self.hp .. ", Attack: " .. self.attack .. ")"

    end

    }

    -- Creating a character and using the metatable

    character = {

    name = "Warrior",

    hp = 150,

    attack = 25

    }

    setmetatable(character, character_metatable)

    print(character)  -- Outputs: Warrior (HP: 150, Attack: 25)

    ```


    In this example, the `__tostring` metamethod defines the string representation
    for character objects. When we use `print(character)`, Lua automatically calls
    this metamethod to provide a custom string.


    ### Conclusion


    Metatables and metamethods offer an advanced level of customization and flexibility
    in Lua programming. They empower you to create objects with custom methods, define
    operator overloading, and customize standard operations. By understanding and
    effectively utilizing metatables and metamethods, you can write code that''s not
    only powerful but also elegant and expressive. As you continue your journey with
    Lua, remember that metatables and metamethods are potent tools in your programming
    arsenal, enabling you to create sophisticated and feature-rich applications.


    # Chapter 4: Advanced File I/O Operations


    File input and output (I/O) is a crucial aspect of many programming tasks, from
    reading and writing configuration files to managing data persistence. In this
    chapter, we''ll explore advanced file I/O operations in Lua, diving into techniques
    for manipulating files, handling different formats, and even implementing file-based
    databases. Let''s unravel the intricacies of file I/O and discover how to perform
    these tasks effectively and efficiently.


    ### Reading and Writing Text Files


    Lua provides simple and effective functions for reading and writing text files.
    The `io.open` function allows you to open files in different modes, such as reading
    (`"r"`), writing (`"w"`), or appending (`"a"`).


    Let''s start by creating a text file and writing data to it:


    ```lua

    -- Writing data to a text file

    file = io.open("data.txt", "w")

    file:write("Hello, world!\n")

    file:write("Lua programming is fascinating.")

    file:close()

    ```


    Now, let''s read the data from the file:


    ```lua

    -- Reading data from a text file

    file = io.open("data.txt", "r")

    data = file:read("*a")

    file:close()

    print(data)

    ```


    The `"*a"` parameter in `file:read` reads the entire content of the file.


    ### Reading and Writing Binary Files


    For handling binary data, Lua provides similar functions. Binary files require
    careful handling due to the differences in character encoding. You can use the
    `"wb"` mode for writing binary data and `"rb"` for reading binary data.


    Let''s create a binary file and write binary data to it:


    ```lua

    -- Writing binary data to a file

    file = io.open("binary_data.bin", "wb")

    data = string.char(72, 101, 108, 108, 111)  -- "Hello" in ASCII

    file:write(data)

    file:close()

    ```


    Now, let''s read the binary data from the file:


    ```lua

    -- Reading binary data from a file

    file = io.open("binary_data.bin", "rb")

    data = file:read("*all")

    file:close()

    for i = 1, #data do

    print(data:byte(i))

    end

    ```


    This code reads each byte of binary data and prints its ASCII value.


    ### Parsing and Manipulating CSV Files


    Comma-separated values (CSV) files are a common format for storing tabular data.
    To manipulate CSV files, we''ll need to parse and handle the data appropriately.
    The `string.split` function can be used to split a string into an array using
    a delimiter.


    Let''s consider an example where we have a CSV file containing names and ages:


    ```csv

    John,25

    Emma,30

    Michael,28

    ```


    We can read and parse this data using the following Lua code:


    ```lua

    -- Parsing and manipulating CSV data

    file = io.open("data.csv", "r")

    data = file:read("*all")

    file:close()

    lines = {}

    for line in data:gmatch("[^\r\n]+") do

    table.insert(lines, line)

    end

    for _, line in ipairs(lines) do

    local name, age = line:split(",")

    print("Name:", name, "Age:", age)

    end

    ```


    ### Implementing File-Based Databases


    For applications that require data storage, implementing a file-based database
    can be a viable solution. In this approach, you store data in a structured format
    within files. JSON is a popular format for this purpose, as it''s human-readable
    and supported by Lua libraries.


    Let''s create a simple example where we store user data in a file:


    ```lua

    -- Storing user data in a file

    local json = require("json")

