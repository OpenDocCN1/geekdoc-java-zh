    第2单元：Scratch 中的基础程序


    程序看起来如下：


    - 要添加一个列表，你需要点击“变量”类中的“制作列表 (Make a List)”按钮。在这个例子中，列表的名称是 Results。

    - 在其他编程语言中，列表被称为“数组 (array)”。


