    ## 计算中的优先级


    我们已经知道如何进行计算并应用数学规则。例如，


    在**计算数学**中，你学习了算术运算的优先级：


    3 + 4 * 5 = 3 + (4 * 5) = 3 + 20 = 23。


    大多数编程语言内置了计算优先级的“知识”；例如，乘法和除法在加法和减法之前执行：


    | 括号 () |

    | :--- |

    | 幂 ^ |

    | 乘 除 取模数 (* / %) (左侧运算符先执行) |

    | 加 减 (+ -) (左侧运算符先执行) |


    第 2 单元：Scratch 中的基础程序


    不是同一个答案！


    如果给计算机进行以下计算，它将先计算 12/4。


    3 + 8 + 12/4 = 3 + 8 + 3 = 14


    当你希望加法或减法先执行时，需要使用括号。例如，在计算三个数的平均值时，应该这样做：


    ```math

    (3 + 8 + 12) / 3 = 23 / 3 = 7.66

    ```


    > 除法在加法之前完成。如果给计算机进行以下计算，它将先计算 12/4。


    3 + 8 + 12/4 = 3 + 8 + 3 = 14


    在 Scratch 中，使用括号来确保计算的执行顺序。例如，在伪代码语言中，括号的使用方式如下：


    (70 + 65 + 81) / 3 = 216 / 3 = 72


    以下是使用运算符 块来实现计算优先级的步骤：


    - 1. 将乘法块添加到脚本区域。

    - 2. 将加法块添加到脚本区域。

    - 3. 将乘法块添加到加法块的右侧。

    - 4. 在块中输入值。

    - 5. 点击块查看结果。


