    part of the value is 0, you will want to display 2 decimal values, e.g. R50.00,
    or R67.70. Note: The ''R'' character is not part of the value the variable contains.
    As the programmer you have to display the letter ''R'' in output values in Scratch.


    ![](img/760028ee1a0ddba727157948af276099_36_3.png)


    # Naming conventions for variables


    Scratch does not have rules about variable names. However, most programming languages
    have strict rules about this, and may return an error if the rules are disregarded.
    To prevent from becoming confused when programming in another language, we suggest
    that you adhere to the following rules when naming variables:


    +   * The first character of a variable name should be an alphabetical character
    (not a number or symbol), and should be an indication of the type of value that
    should be stored in the variable. For example: iCount (an integer value), rAverage
    (a real value), sName (a string).

    * Do not use spaces in variable names. For example, instead of ''Term Mark'',
    rather use the name TermMark or Term_Mark.


    Unit 2 : Basic programs in Scratch


