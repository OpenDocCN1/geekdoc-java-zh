  - '[PAGE 5]


    +   - A solution can be planned using an input-output-processing (IPO) table.

    - An algorithm to solve a basic mathematical problem requiring sequential steps
    can be designed, presented in pseudo code and implemented in a programming language
    providing correct output.

    - Comments can be added in a program to clarify the flow of the program..'
  - '[PAGE 6]


    # Introduction to variables


    In algebra in Mathematics you have learned about using variables. Usually a single
    letter is used to represent a variable, and it represents a value that is unknown.
    For example, in the equation p = 21 + 2w, the letters 1 and w represents the length
    and width of a rectangle. Once a person measures the length and width of the rectangle,
    the values can be replaced in the equation, for example, p = 2(5) + 2(2) = 10
    + 4. The perimeter of the rectangle is 14. A variable therefore represents a value,
    or you can say it is a ''keeper'' for a value. In programming, a variable can
    also be referred to as a ''storage space'' or a ''container'' for a value and
    it is used in the program to remember a value. Let us look at an example where
    a program needs to use a variable.


    In Unit 1 you created a program (small game) where the user had to click on a
    moving sprite (The Ball sprite). When the user managed to click on the ball, it
    changed position, and a sound was played (Boing).


    We would like to improve on this game, so that we can keep score of the number
    of times the ball has been hit. This is what we will need to do:


    +   - Create a ''container'' where the computer can put the score to ''remember''
    the number of hits (a variable).

    - When the program starts, we have to place the value (0) in the container, to
    indicate that no hits have yet made.

    - Every time the ball is hit, we instruct the computer to increase the value in
    the container by one.


    ![](img/760028ee1a0ddba727157948af276099_6_0.png)


    > In programming languages, this ''container'' for a value is called a variable.
    A variable has a name and can hold only one data item (for example a number, or
    a name) at a time. In the following activity we will show you how to add a variable
    to the existing program to count the number of hits.


    ![](img/760028ee1a0ddba727157948af276099_6_1.png)


    ![](img/760028ee1a0ddba727157948af276099_6_2.png)'
  - "[PAGE 7]\n\n# Activity 1: Add a variable to an existing program\n\nOpen the program\
    \ you wrote in Unit 1, Activity 11.\n* Add a variable (a container).\n  * Click\
    \ on the Variables class in the blocks palette.\n  * Choose Make a Variable.\n\
    \  * Select the radiobutton For this Sprite only\n  * Enter a variable name, e.g.\
    \ iHits, and click OK.\n\n+   * Radiobutton\n* Checkbox\n\n![](img/760028ee1a0ddba727157948af276099_7_0.png)\n\
    \n> > It is good programming practice to use meaningful names for variables, that\
    \ describe both the purpose and the type of the value which will be stored in\
    \ them. The type of value which will be stored in this variable must be a whole\
    \ number, i.e. an integer, therefore we add the number, i in front of the variable\
    \ name to remind ourselves that the variable name contains an integer value.\n\
    \nNote: When you write more complex programs, it will matter whether a variable\
    \ is visible to all sprites, or to a specific sprite only. The difference will\
    \ be explained later. In this specific program it does not matter what option\
    \ you choose, as there is only one sprite. However, it is a good programming principle\
    \ to assign variables to the sprite it 'belongs'\n* Tick the checkbox next to\
    \ the name of the variable.\n\n![](img/760028ee1a0ddba727157948af276099_7_1.png)\n\
    \n+   * Initialise\n* Assignment statement\n\nUnit 2 : Basic programs in Scratch"
  - '[PAGE 8]


    Add code blocks as indicated (the blocks can be found in the Variables class).


    Readout: The Scratch terminology for the small window on the stage that displays
    information about a variable. The readout appears on the screen when you tick
    the checkbox next to the name of the variable in the Variables class.


    ![](img/760028ee1a0ddba727157948af276099_8_0.png)


    To create the instruction to increase the variable iHits by 1, look at the colours
    of the blocks to determine from which class to obtain the separate blocks. Add
    them in the scripts area.


    Now combine the different blocks, and add the number 1.


    Unit 2 : Basic programs in Scratch'
  - '[PAGE 9]


    +   Run the program. Notice how the variable name and the value of the variable
    are displayed on the stage.


    +   Every time you click on the ball, the value of the variable will increase
    by one, and the updated value will be displayed in the readout.


    +   The name of the sprite variable ''belongs''.


    ![](img/760028ee1a0ddba727157948af276099_9_0.png)


    +   Right click on the readout. You can then select the format of the readout.


    ![](img/760028ee1a0ddba727157948af276099_9_1.png)


    ![](img/760028ee1a0ddba727157948af276099_9_2.png)


    ![](img/760028ee1a0ddba727157948af276099_9_3.png)


    # Note the following programming language concepts


    +   This statement 0 is called an assignment statement.


    +   The value 0 is assigned to (placed into) the variable iHiits.


    +   This corresponds to an algebra equation such as x = 0. In this case iHiits
    = 0.


    ![](img/760028ee1a0ddba727157948af276099_9_4.png)


    +   This statement is also an assignment statement.


    +   The current value of iHiits is increased by 1. The result is ''placed back''
    in the variable iHiits.


    +   This corresponds to an algebra equation such as y = y + 1. In this case, iHiits
    = iHiits + 1.


    ![](img/760028ee1a0ddba727157948af276099_9_5.png)


    # Remember


    +   Programming variables are given meaningful names. You can name a variable
    x, or y. But in longer programs with many variables become confused if you use
    single-letter variable names. In programming we use meaningful variable names
    such as iNumStudents, iTestTotal, iScore of x, y and z.


    +   An integer is a number that is not a fraction, a number, such as 10; 25; 166.


    +   In programming languages that have a decimal point in them, such as 12.8;
    145.07823; 0.678 are called floating point numbers. They can also be called real
    numbers, measuring or measurement numbers. In programming languages it is important
    to note that the value 5 is an integer, but the value 5.0 is a decimal (real value).


    +   When we name variables in a program, it helps to include a reference to the
    type of number that will be stored in a variable. For example, iHiits indicates
    that an integer value will be stored in the variable. rAvg indicates that a real
    number will be stored in the variable.'
  - '[PAGE 10]


    In algebra you learned when the answer of an expression is calculated, it becomes
    an equation. For example: if we calculate speed, we can write an equation (using
    meaningful variable names0):


    ```

    speed = \frac{distance}{time}

