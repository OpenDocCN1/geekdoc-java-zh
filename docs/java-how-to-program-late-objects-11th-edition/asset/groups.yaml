  mdcn: "\n\n• 此程序可用于跟踪停车场内的汽车数量。当汽车驶入停车场时，用户点击字母 I。当汽车驶出时，他们点击字母 O。\n\n• 停车场内的汽车总数应该显示在舞台（stage）上。\n\
    \n- 点击积木调面板中的*变量*（Variables）。\n- 选择*建立变量*（Make a Variable）。\n- 选择*对于所有角色*（For\
    \ all sprites）旁边的单选按钮。\n- 输入变量名称，例如 *iNumCars*，并点击确定。\n- 为每个角色添加一个脚本。当用户点击字母 I\
    \ 时，*iNumCars* 的值加 1。当用户点击字母 O 时，变量 *iNumCars* 的值减 1（这是同一个变量）。\n\n![](img/760028ee1a0ddba727157948af276099_12_0.png)\n\
    \n![](img/760028ee1a0ddba727157948af276099_12_1.png)\n\n![](img/760028ee1a0ddba727157948af276099_12_2.png)\n\
    \n![](img/760028ee1a0ddba727157948af276099_12_3.png)\n\n• 在舞台上添加一条指令，将变量 iNumCars\
    \ 初始化为 0。\n- 点击舞台（Stage）图标。为[当绿旗被点击]事件添加代码。\n\n![](img/760028ee1a0ddba727157948af276099_12_4.png)\n\
    \n# 注意\n\n- 在活动 3 中，你使用了 2 个角色，但只使用了 1 个变量 (iNumCars)。\n- 当创建变量 iNumCars 时，你选择了*对于所有角色*选项。这意味着所有角色都可以访问该变量（并对其进行修改）。此变量“属于”舞台。就像演员可以看到舞台上的所有物体一样，角色也可以看到并更改舞台上的所有变量。\n\
    - 为了初始化变量 iNumCars，最好将代码添加到舞台的脚本中。\n\n## “对于所有角色”与“对于此角色”的区别\n\n| 对于此角色 (For this\
    \ sprite only) | 对于所有角色 (For all sprites) |\n| :--- | :--- |\n| 只有该角色可以访问变量的值。\
    \ | 舞台上的所有角色都可以访问该变量。 |\n| 变量具有角色作用域。 | 变量具有舞台作用域。 |\n| 类似于演员只能读取自己脚本上的文字，而不能读取其他演员的脚本。\
    \ | 类似于一个可以看到舞台上放置的所有横幅或道具的演员。 |\n| 舞台上的显示在变量名称和值之前显示角色的名称。 | 舞台上的显示只显示变量的名称和值。\
    \ |\n\n![](img/760028ee1a0ddba727157948af276099_13_0.png)\n\n![](img/760028ee1a0ddba727157948af276099_13_1.png)\n\
    \n- 横幅 (Banner)\n- 道具 (Prop)\n\n演员表演时在舞台或屏幕上使用的物体被称为戏剧道具。这简短为“道具”（props）。因此，道具指的是舞台上任何可移动或携带的物品。\n\
    - 舞台作用域\n- 角色作用域。\n\n在下一个活动中，你将使用 4 个角色和 1 个变量。每个角色都必须能够访问该变量。\n\n![](img/760028ee1a0ddba727157948af276099_13_2.png)\n\
    \n## 单元单元：Scratch 基础程序\n\n## 活动 4：食物营养 – 舞台作用域变量\n\n编写一个程序，让用户点击他们每天吃的食物。每种食物都有一个与其相关的分值。\n\
    \n| | | |\n| :--- | :--- |\n| 玛芬蛋糕 (Muffin) | +10 |\n| 蛋糕 (Cake) | -20 |\n| 水果沙拉\
    \ (Fruit salad) | +25 |\n| 奶酪泡泡 (Cheesy Puffs) | -12 |\n\n初始分为 0。每当选择一个项目，分数就会根据该食物类型的分值进行调整。程序应该为用户显示总分。\n\
    \n![](img/760028ee1a0ddba727157948af276099_14_0.png)\n\n记得通过在舞台上放置代码来将变量 iScore\
    \ 初始化为 0。\n\n你将使用的赋值语句示例：\n\niFoodScore = iFoodScore + 10\niFoodScore = iFoodScore\
    \ - 12\n\n> 此变量具有舞台作用域。因此，在显示之前不会显示角色的名称。所有角色都可以访问同一个变量。\n\n此程序与之前的程序的唯一区别在于，你有更多的角色，而且变量不是简单的加\
    \ 1 或减 1。\n\n## 从用户处获取值（用户交互 - 输入）\n\n大多数程序都会与程序的用户进行交互——用户需要点击屏幕上的某处或在键盘上输入数据（如数值）。我们现在将学习如何从用户处获取值。\n\
    \n## 活动 5：根据伪代码编写程序\n\n根据提供的伪代码，在 Scratch 中编写以下程序。\n\n# 伪代码\n\n- 当用户点击绿旗时\n- 重复\
    \ 3 次\n    - 向屏幕顶部移动 100 步\n    - 等待 0.5 秒\n    - 向底部移动 100 步\n- 等待 0.5 秒\n结束\n\
    \n![](img/760028ee1a0ddba727157948af276099_15_0.png)\n\n注意，你需要创建一个变量。[询问]（ask）积木会提示用户通过键盘输入数据。\n\
    \n## 活动 6：从用户处获取值（输入）\n\n使用以下伪代码从用户处获取值。\n\n# 伪代码\n\n```\n当用户点击绿旗时\n重复 iJumps\n\
    \  向上移动 100 步\n  等待 0.5 秒\n结束\n```\n\n![](img/760028ee1a0ddba727157948af276099_16_0.png)\n\
    \n[询问]积木来自传感器（Sensing）组。[回答] 变量位于传感器类。注意：跳转次数是一个整数。\n\n## 新知识\n\n| 伪代码 | Scratch\
    \ 积木 | 说明 |\n| :--- | :--- | :--- |\n| 询问“我应该跳转几次？” | ![询问 我应该跳转几次?] | [询问]积木（传感器组）提示用户通过键盘输入数据。\
    \ |\n| 输入 iJumps | ![将 Jumps为为] | [设置]积木（来自变量）将*回答*的内容传递给右侧的变量 Jumps。 |\n\n##\
    \ 活动 7：获取两个值\n\n使用以下伪代码创建一个 Scratch 程序。选择一个较小的角色，例如球。注意你需要创建变量。\n\n- 当用户点击绿旗时\n\
    - 清除所有之前的图形\n- 抬笔\n- 移动到位置 (-160, 160)\n- 看屏幕右侧\n- 落笔\n- 询问“画正方形我应该走多少步（100 到\
    \ 300 之间）？”\n- 输入 `steps`\n\n![](img/760028ee1a0ddba727157948af276099_17_0.png)\n\
    \n用于画笔的代码块可以在画笔（Pen）类中找到。你需要点击*添加扩展*图标使画笔类可见。\n\n```\n询问“画笔必须有多厚（1 到 10 之间）？”\n\
    输入 iPen\n将画笔大小设置为 iPen\n重复 4 次\n    移动 steps\n    顺时针旋转 90 度\n    等待 1 秒\n结束\n\
    \n## 在屏幕上显示消息（输出）\n\n当计算机程序在屏幕上显示内容时，这被称为程序的输出。在单元 1 中，你曾在许多程序中使用 [说] 积木在角色旁边的气泡中显示文字。\n\
    \n> [说] 积木用于创建程序的输出。\n\n在这个例子中，“Hello!” 是程序的输出。\n\n![](img/760028ee1a0ddba727157948af276099_18_0.png)\n\
    \n> 指示这种类型消息的伪代码如下：\n显示 \"Hello!\"\n\n"
