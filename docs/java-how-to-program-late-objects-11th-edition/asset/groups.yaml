    # Scratch-specific programming principle


    Most programming languages require you to indicate the data type of a variable
    when the variable is declared. Scratch does not require this. Instead, the data
    type is determined by Scratch, based on the operations and calculations performed
    on the variable.


    ![](img/760028ee1a0ddba727157948af276099_36_1.png)


