    [删除全部 (delete all of)] 模块移除列表中的所有行。因此，当程序第二次执行时，之前的输出将被删除。


    [添加到 (add ..to)] 模块会将[拼接 (join)] 模块创建的字符串添加到列表底部。


    - 角色被重命名为 Calculator。

    - 每个 [添加 (add)] 模块都会将输出字符串添加到列表底部。

    - 列表中的每行都有编号（在本例中为1到4）。

    - 列表中的行数显示在列表底部（在本例中为4）。


