    \ it is best to add the code to the script of the stage.\n\n## The difference\
    \ between For all sprites and For this sprite only\n\n| For this sprite only |\
    \ For all sprites |\n| :--- | :--- |\n| Only the sprite can access the value of\
    \ the variable. | All sprites on the stage have access to the variable. |\n| The\
    \ variable has sprite scope. | The variable has stage scope. |\n| Similar to an\
