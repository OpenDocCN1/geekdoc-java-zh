    在活动 13 中：我们编写了以下程序：


    当你购买若干物品时，在向收银员付钱之前，你会先等待收银台显示你需要支付的金额。例如，如果你需要支付 R45.00，你可以用一张 R50.00 的钞票支付，并找回
    R5.00 的找。或者你可以用一张 R100.00 的钞票支付，找回 R55.00 的找。


    ![](img/760028ee1a0ddba727157948af276099_59_0.png)我们将对该程序进行调整：


    - 这一次我们在显示金额后，将询问用户支付金额，

    - 然后计算并显示返回给客户的找零金额。


    为该程序编写算法。


    ```scratch

    when the user clicks the green flag

    // Constant value

    VAT_PERC = 0.15

    // Input

    ask "What is the amount spent? "

    ```


    第 2 单元：Scratch 基础程序


    ```scratch

    enter rSpent

    // Processing

    rVat = VAT_PERC * rSpent

    rTotalPay = rSpent + rVat

    // Output to a List

    addToList("Amount is R" + rSpent)

    addToList("VAT R" + rVat)

    addToList("Customer needs to pay R" + rTotalPay)

    // Input - user needs to see the total amount before deciding what to pay

    ask "How much does the customer pay? "

    enter rMoney

    // Processing

    rChange = rMoney - rTotalPay

    // Output to a List

    addToList("Customer paid R" + rMoney)

    addToList("Change is R" + rChange)

    ```


    应付金额将在列表中。程序的用户可以看到需要支付的金额。


    程序将显示一个提示，询问用户客户支付的金额，并从键盘读取一个值（输入）。


