    # Writing basic programs


    The programs we have written up till now have been very plain, designed to introduce
    you to the Scratch interface and basic programming language terminology. However,
    the actual usefulness of computers lies in their ability to perform calculations
    and quickly and accurately. The aim of learning to program is learning how to
    instruct the computer to process data and perform calculations.


    Before attempting to write code to solve problems, we need to understand how computers
    work. In short, computers receive input, process the input and give output.


    ![](img/760028ee1a0ddba727157948af276099_22_0.png)


    Here are some examples of input and output.'
  - '[PAGE 23]


    | Input | Processing | Output |

    | --- | --- | --- |

    | Values entered by the user of the program. | | Results / answers displayed by
    the computer. |

    | How many books did you borrow? How many days late? | | Your fine is R 20 |

    | 5 | Calculations done by the computer. As the user of the program, you do not
    have to know how the cacluations are done. |

    | Length of rectangle Width of rectangle | | The area is 44.1 The perimeter is
    32.2 |

    | 12.6 3.5 | |


    For computers to accomplish a task

