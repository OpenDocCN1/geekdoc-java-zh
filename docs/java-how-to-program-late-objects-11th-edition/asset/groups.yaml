    \ based on the pseudocode provided.\n\n# Pseudocode\n\n- when the user clicks\
    \ the green flag\n- repeat 3 times\n    - go 100 steps towards top of screen\n\
    \    - wait 0.5 seconds\n    - go 100 steps towards bottom of screen\n    - wait\
    \ 0.5 seconds\nend\n\n![](img/760028ee1a0ddba727157948af276099_15_0.png)\n\nNote\
    \ that you have to create a variable. The [ask] block (in Sensing group) prompts\
    \ the user to enter data requested by the keyboard.\n\n## Activity 6: Get values\
    \ from the user (input)\n\nGet a value from the user using the following pseudocode.\n\
    \n# Pseudocode\n\n```\nwhen the user clicks the green flag\nask \"How times should\
