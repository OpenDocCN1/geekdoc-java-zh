    # # Unit 2: Basic programs in Scratch


    ## Assessment criteria

    The content covered in this unit relates to the following outcomes and assessment
    criteria:


    | Module descriptor UNIT 1: Problem solving |

    | Outcome: The student must be able to apply logic and knowledge to solve basic
    problems. |

    | Assessment Criteria |

    | Redundant information can be excluded from a basic programming problem statement
    by rewriting the problem without redundant information. |

    | Missing data can be identified in a basic programming statement, by listing
    the missing data elements. |

    | Problems requiring logical thought flow can be analysed and solutions provided
    by providing narratives, diagrams or completing tables. |


    | Module descriptor UNIT 2: Basic programming principles |

    | Outcome: The student must be able to apply algorithmic problem solving to basic
    mathematical and programming problems. |

    | Assessment Criteria |

    | Input and output can be identified for a given programming problem. |

    | The variables needed as part of an algorithm can be identified by completing
    an input-processing-output (IPO) table. |

    | Valid variable names can be provided following the best practices of the OOP
    language used. |

    | Constants to be used in a program can be identified by writing it in the correct
    section of an algorithm. |

    | Valid data types for variables can be suggested by indicating the data type
    in an algorithm. |

    | The rules of the order of processing can be applied in writing pseudo code for
    a mathematical calculation. |'
