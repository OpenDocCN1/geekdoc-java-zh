    \ display the total score for the user.\n\n![](img/760028ee1a0ddba727157948af276099_14_0.png)\n\
    \nRemember to initialize the variable iScore to 0 by placing code on the stage.\n\
    \nExamples of the assignment statements you will use:\n\niFoodScore = iFoodScore\
    \ + 10\niFoodScore = iFoodScore - 12\n\n> This variable has stage scope. Therefore\
