    \ to the same variable.\n\nThe only difference between this program and the previous\
    \ ones are that you have more sprites, and that the variable is not just increased\
    \ or decreased by 1.\n\n## Getting values from the user (user interactivity -\
    \ input)\n\nMost programs interact with the user of the program – the user needs\
