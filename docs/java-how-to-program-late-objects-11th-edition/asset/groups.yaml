    此示例中的输出是一个单词。在编程术语中，由字母字符和/或数字和/或或其他特殊字符（例如 $ 或 *）组成的“单词或句子”被称为**字符串**（string）或**文本**（text）。


    在伪代码和大多数编程语言的代码中，使用双引号表示某个值是一个字符串，例如，"Hallo!" 就是一个字符串。这些是字符串的更多例子：


    - "I am dancing"

    - "This is gr8!"

    - "PO Box 58234"


    你可以使用操作符类中的 [join] 块来组合模块以创建输出。 [join] 块有两个编辑框，你可以在其中输入要显示的句子或变量名。


    以下是使用 [say]（说）、[join] 和其他块创建输出的示例：


    ![](img/760028ee1a0ddba727157948af276099_19_0.png)


    你可以使用多个 [join] 块来拼接（相加）不同的组件，以形成一条输出消息。


    表示此代码的伪代码如下：


    iAge = 8

    display "I am " + iAge + " years old"


    + 符号表示不同的组件必须连接以形成输出。这些组件是：


    | " I am " | + | iAge | + | " years old |

    | :--- | --- | : | --- | :--- |


    | 字符串 字符串 | | | 变量 | | | | 字符串 |


