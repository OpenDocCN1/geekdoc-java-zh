  md: '# Determine results for integer division and MOD


    You can use any of the following methods to determine the results for the MOD
    and integer division (/) operators:


    # Example 1


    15 ÷ 6 = 2 remainder


    15 = 6 * 2 + 3


    15 MOD 6 = 3



    (The remainder after long division)


    On your pocket calculator the result of the division will be 2.5. The result of
    integer division is the number before the decimal point. Just ignore the fraction.


    15 + 6 = 25


    # Example 2


    5 ÷ 7 = 0 remainder


    5 = 7 * 0 + 5


    5 \ 7 = 0


    5 MOD 7 = 5'
