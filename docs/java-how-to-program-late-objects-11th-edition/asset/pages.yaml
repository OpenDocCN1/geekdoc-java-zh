- pgno: 13
  md: '# Note


    +   - In Activity 3, you used 2 sprites, but just 1 variable (iNumCars).

    - When the variable iNumCars was created, you chose the option For all sprites.
    This means all sprites can access the variable (make changes to

    it). This variable ''belonged'' to the stage. Like actors can see all objects
    on the stage, the sprites can see and change all variables on the

    stage.

    - To initialise the variable iNumCars, it is best to add the code to the script
    of the stage.


    # The difference between For all sprites and For this sprite only


    | For this sprite only | For all sprites |

    |---|---|

    | Only the sprite can access the value of the variable. | All sprites on the stage
    have acceses to the variable. |

    | The variable has sprite scope. | The variable has stage scope. |

    | Similar to an actor who can only read the words on his own script, not that
    of another actor. | Similar to an actor that can see all banners or props that
    is placed on the stage. |

    | The readout on the stage displays the name of the sprite before the name and
    value of the variable. | The readout on the stage only displays the name and value
    of the variable. |


    ![](img/760028ee1a0ddba727157948af276099_13_0.png)


    ![](img/760028ee1a0ddba727157948af276099_13_1.png)


    +   - Banner

    - Prop

    The objects used on a stage or screen by actors when they perform is called theatrical
    property. This has been shortened to ''props''. So a prop refers to anything movable
    or portable on a stage.

    - Stage scope

    - Sprite scope.


    In the next Activity you will use 4 sprites, and 1 variable. Each sprite must
    have access to the variable.


    Unit 2 : Basic programs in Scratch


    ![](img/760028ee1a0ddba727157948af276099_13_2.png)'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# ## Activity 4: Food nutrition – variable with stage scope


    Write a program where the user should click on the food he eats every day. Every
    type of food has a point associated with it.


    | | |

    |---|---|

    | Muffin | +10 |

    | Cake | -20 |

    | Fruit salad | +25 |

    | Cheesy Puffs | -12 |


    The starting score is 0. Every time an item is chosen, the score should be adjusted
    by the points for that type of food. The program should display the total score
    for the user.


    ![](img/760028ee1a0ddba727157948af276099_14_0.png)


    Remember to initialise the variable ifScore to 0 by placing code on the stage.


    Examples of the assignment statements you will use:


    iFoodScore = iFoodScore + 10

    iFoodScore = iFoodScore - 12


    > This variable has stage scope. Therefore no name of a sprite is displayed infront
    of the readout. All sprites have access to the same variable.


    The only difference between this program and the previous ones are that you have
    more sprites, and that the variable is not just increased or decreased by 1.


    # ## Getting values from the user (user interactivity - input)


    Most programs interact with the user of the program – the user needs to click
    somewhere on the screen or enter data (such as numeric values) on the keyboard.
    We will now learn how to write programs that can read values entered by a user
    on the keyboard, and then use that data to display a message or perform some operations.'
  merge: -1
  img_proc: true
- pgno: 15
  md: "# Activity 5: Write a Scratch program based on pseudocode\n\nWrite the following\
    \ program in Scratch (the pseudocode is provided just to remind you again how\
    \ instructions for a program can be given in a way that is not specific to a programming\
    \ language).\n\n# Pseudocode\n\n# Scratch code\n\n+   when the user clicks the\
    \ green flag\nrepeat 3 times\n    go 100 steps towards top of screen\n    wait\
    \ 0.5 seconds\n    go 100 steps towards bottom of screen\n    wait 0.5 seconds\n\
    end repeat\nend\n\n![](img/760028ee1a0ddba727157948af276099_15_0.png)\n\nSave\
    \ the program as Unit1 JUMP.\n\nThis program will let the sprite jump up and down\
    \ the screen 3 times. Now we want to change the program so it will ask the user\
    \ how many times the sprite should jump up and down. The user will type a value\
    \ on the keyboard, and push the <Enter> key. The program will then use the value\
    \ entered by the user in the [repeat] block. When values are provided by the user\
    \ on the keyboard, it is called input to the program. (A value is placed IN to\
    \ the program)."
  merge: -1
  img_proc: true
- pgno: 16
  md: "# Activity 6: Get a value from the user (input)\n\nChange the program Unit\
    \ 2 JUMP to ask the user how many times the sprite should jump. You need to create\
    \ a variable iJ.\n\n# Pseudocode\n\n# Scratch code\n\n```\nwhen the user clicks\
    \ the green flag\nask \"How many times should I jump?\"\nenter iJumps\nrepeat\
    \ iJumps times\n  go up 100 steps\n  wait 0.5 seconds\n  go down 100 steps\n \
    \ wait 0.5 seconds\nend\n```\n\n![](img/760028ee1a0ddba727157948af276099_16_0.png)\n\
    \nThe [ask] block is from the Sensing class\n\nThe [answer] variable can be found\
    \ in the Sensing class. It is the variable that is typed on the keyboard is stored\
    \ automatically.\n\n> Note: The number of jumps will be an integer value (the\
    \ sprite cannot jump a decimal number of times – for exampl, 4.5 times). So a\
    \ lower case i is added in front of the name of the variable."
  merge: -1
  img_proc: true
- pgno: 17
  md: "# New knowledge explained\n\n| Pseudocode | Scratch block | Description |\n\
    | --- | --- | --- |\n| ask \"How many times should I jump? \" | ![ask How many\
    \ times should I jump? and wait] | The [ask] block (in the Sensing group) prompts\
    \ the user to enter the data requested by the programmer using the keyboard. |\n\
    | enter iJumps | ![set Jumps to answer] | - Scratch automatically puts the value\
    \ that is entered into the keyboard into its own variable, *answer*.<br>- The\
    \ [set] block (from the Variables class), then transfers the data from the variable\
    \ *answer* to the variable iJumps (declared by the programmer.) |\n| | | The content\
    \ of the variable changed answer, is on the right hand of the block, and it is\
    \ transferred to the variable sName -on the left hand of the block. |\n\n# Activity\
    \ 7: Obtain two input values\n\nCreate a Scratch program using the following pseudocode.\
    \ Choose a smaller sprite such as a ball. Note that you have to create two variables.\n\
    \n+   - when the user clicks on the green flag\n  - clear all previous graphics\
    \ effects\n  - lift the pen up\n  - move to position (-160, 160)\n  - look to\
    \ the right of the screen\n  - put the pen down\n  - ask \"How many steps should\
    \ I take to draw a square (between 100 and 300)?\"\n  - enter `steps`\n\nCode\
    \ blocks to manipulate a pen can be found in the *Pen* class. You need to click\
    \ on the *Add extension* icon to make the Pen class visible\n\n![](img/760028ee1a0ddba727157948af276099_17_0.png)"
  merge: -1
  img_proc: true
