  md: '# Data types of variables


    All programming languages can manipulate different types of data. For example,
    you have already used


    +   * integer values (whole numbers, negative or positive e.g. -5; 8; 350)

    * real values (decimal values, e.g. 3.44; -6.768686)

    * strings (text values, e.g., a name "James", or an address "2 College Road ",
    or a cell phone "08845561289 \ You cannot do a numerical calculation with a string
    value.


    There are more types of data, and we will learn to use them in this module:


    +   * Manipulate

    * Decimal value


    ![](img/760028ee1a0ddba727157948af276099_36_0.png)


    5_Different DataTypes


    # Scratch-specific programming principle


    Most programming languages require you to indicate the data type of a variable
    when the variable is declared. Scratch does not require this. Instead, the data
    type is determined by Scratch, based on the operations and calculations performed
    on the variable.


    ![](img/760028ee1a0ddba727157948af276099_36_1.png)


    +   * Declare a variable


    ![](img/760028ee1a0ddba727157948af276099_36_2.png)


    > Monetary values have a decimal value – even if the amount is R5.00 and the decimal
    part of the value is 0, you will want to display 2 decimal values, e.g. R50.00,
    or R67.70. Note: The ''R'' character is not part of the value the variable contains.
    As the programmer you have to display the letter ''R'' in output values in Scratch.


    ![](img/760028ee1a0ddba727157948af276099_36_3.png)


    # Naming conventions for variables


    Scratch does not have rules about variable names. However, most programming languages
    have strict rules about this, and may return an error if the rules are disregarded.
    To prevent from becoming confused when programming in another language, we suggest
    that you adhere to the following rules when naming variables:


    +   * The first character of a variable name should be an alphabetical character
    (not a number or symbol), and should be an indication of the type of value that
    should be stored in the variable. For example: iCount (an integer value), rAverage
    (a real value), sName (a string).

    * Do not use spaces in variable names. For example, instead of ''Term Mark'',
    rather use the name TermMark or Term_Mark.


    Unit 2 : Basic programs in Scratch


    ![](img/760028ee1a0ddba727157948af276099_36_4.png)'
