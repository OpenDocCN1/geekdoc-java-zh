    Real values (also called floating point values), are not stored with complete
    accuracy. For example, the value 0.5 is stored as 0.500000000000001. Therefore,
    when real values are displayed, the programming language approximate the values.
    However, the developers of Scratch did not build this functionality into Scratch
    when displaying values to a List. When you program in Java, you will learn how
    to prevent this type of display issue.


