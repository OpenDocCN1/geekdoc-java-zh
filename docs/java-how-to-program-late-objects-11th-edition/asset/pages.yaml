- pgno: 30
  md: 'subtraction. If the following calculation is given to a computer, it will calculate
    12/4 first.


    3 + 8 + 12/4 = 3 + 8 + 3 = 14


    When you want addition or subtraction to happen first in a calculation, you need
    to use parentheses to ensure that does is done first. For example, when calculating
    the average of three numbers, it should be done as follows:


    ```

    (70 + 65 + 81) / 3 = 216 / 3 = 72

    ```


    as pseudocode we can write rAvg = (iMark1 + iMark2 + iMark3) / 3


    However, if the calculation is performed as follows (no brackets):


    avg = iMark1 + iMark2 + iMark3 / 3 it will be interpreted as 70 + 65 + 81 / 3
    = 70 + 65 + 27 = 162


    > Division is done before plus.


    When writing a program, the programmer has to handle mathematical principles correctly
    when programming calculations – such as using parentheses – the programming language
    has no way of ''knowing'' that parentheses should have been used to calculate
    the average. It only performs the instruction as it provided.


    In Scratch, the effect of parentheses and the order of precedence in calculations
    is achieved by stacking various program blocks from the Operators group. In other
    programming language the calculations are typed on one line, and the language
    will automatically do the calculations in the correct way (following rules for
    order of operations).


    Here are the steps to perform the calculation 3 + 4 * 5 in Scratch:


    +   1. The multiplication has to be completed first. So drag a multiplication
    block from the Operators class to the script area, and enter the values 4 and
    5.

    2. Drag an addition block onto the scripts area. Enter the value 3.

    3. Now plug the multiplication operator into the open slot on the right side of
    the addition


    ![](img/760028ee1a0ddba727157948af276099_30_0.png)


    Unit 2 : Basic programs in Scratch'
  merge: -1
  img_proc: true
