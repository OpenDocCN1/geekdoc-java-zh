    +   - Create a variable for each sprite. Choose the option For this sprite only.
    The variables for the different sprites can have the same name (iVote). The readouts
    on the stage includes the names of the sprites, so it is clear to see whose each
    each value belongs to.

    - Add instructions for each sprite to initialise the variables to 0 when the green
