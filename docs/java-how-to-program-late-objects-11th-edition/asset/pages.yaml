  md: '• This program can be used to keep track of the number of cars inside a parking
    lot. When a car drives into the parking lot, the user clicks on the letter I.
    When a car drives out, they click on the letter O.


    • The total number of cars in the parking lot should be displayed on the stage.


    +   - Click on *Variables* in the blocks palette.

    - Choose *Make a Variable.*

    - Select the radiobutton *For all* sprites.

    - Enter a variable name, e.g. *iNumCars*, and click OK.

    - Add a script for each sprite. When the user clicks on the letter I, the value
    of *iNumCars* should be increased by 1. When the user clicks on the letter O,
    the value of the variable *iNumCars* should be decreased by 1 (it is the same
    variable).


