  md: "operator.\nNotice how the multiplication block appears to be raised higher.\
    \ It is at the top of the stack.\nScratch will perform the calculation at the\
    \ top of the stack (i.e. the multiplication) first.\n\nHere are more examples\
    \ of the way stacking should be used to ensure the correct order of precedence:\n\
    \n![](img/760028ee1a0ddba727157948af276099_31_0.png)\n\n12 \\div 6 \\div 2\n=\f\
    rac{12}{6}/2\n12/6/2\nThis should be programmed as (12/6)/2, since the rules for\
    \ the order of precedence indicate that division is carried out from left to right.\n\
    \n12 \\div (6 \\div 2)\n=\frac{12}{6/2}\n12/(6/2)\n\n12 \\div 2 \\times 2\n=\f\
    rac{12}{2} \\times 2\n12 / 2 * 2\nThis should be programmed as (12/2)*2, since\
    \ division and multiplication are on the same 'level' in the order of precedence,\
    \ and should be performed from left to right.\n\n12 \\div (2 \\times 2)\n=\frac{12}{2*2}\n\
    12 / (2 * 2)"
