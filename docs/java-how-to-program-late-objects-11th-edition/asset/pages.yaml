    \ number of children? \n\nUse the following variables:\n\n`iNumsweets; iNumChildren;\
    \ iNumEach` \n`iNumEach = iNumsweets / iNumChildren` \nor\n`iNumEach = |iNumsweets/iNumChildren|`\
    \ | set #NumEach to floor of #Numsweets / NumChildren |\n\nWe have 13 sweets,\
    \ and need to divide equally between 4 children. How many sweets will be left\
