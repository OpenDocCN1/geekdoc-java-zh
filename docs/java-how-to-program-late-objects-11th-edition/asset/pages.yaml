- pgno: 19
  md: 'The output in this example is a word. In programming terminology a word or
    a sentence consisting of alphabetical characters and/or digits and/or other special
    characters (e.g. $ or *) is referred to as a string or text.


    In pseudocode and most programming languages'' code, double quotes are used to
    indicate that a value is a string, for example, "Hallo!" is a string. These are
    more examples of strings:


    +   "I am dancing"

    "This is gr8!"

    "PO Box 58234"


    You can combine blocks to create output using a [join] block from the operators
    class. The [join] block has two editboxes where you can enter sentences or variable
    names to display.


    These are examples of using [say], [join] and other blocks to create output:


    ![](img/760028ee1a0ddba727157948af276099_19_0.png)


    You can use multiple [join] blocks to concatenate (add together) different components
    to form one output message.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'The pseudocode to indicate this code will look as follows:


