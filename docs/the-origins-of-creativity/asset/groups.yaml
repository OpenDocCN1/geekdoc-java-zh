    \ diagnosing, as Updike himself put it, the lives and foibles of an American small-town\
    \ Protestant middle class. In particular, during the late twentieth century.\n\
    \nInnovation of this kind in the creative arts is important in a second way. The\
    \ evolution of the arts parallels organic evolution in the manner they both work.\
    \ The best artists and performers seek original ways to express themselves in\
    \ image, sound, and story. Originality and style are everything, measured by the\
    \ degree to which the innovations attract imitation. Thus the challenge of the\
    \ Salon des Refusés to the Salon of Paris in 1863 is a classic example in the\
    \ visual arts. Cubism against literalism, marked by Picasso's *Les Demoiselles\
    \ d'Avignon* in 1907 is another. In popular culture color motion pictures in 1932\
    \ with Walt Disney's *Flowers and Trees*, and Motown in the late 1960s from a\
    \ blend of soul, blues, and pop. The process is potentially eternal. More and\
    \ still more: breakthroughs will race the heart of the innovators, stiffen their\
    \ spine, encourage their search for breakthroughs. By the late twentieth century,\
    \ experiments in new techniques and styles in all the creative arts were multiplying\
    \ exponentially. Absurdly wild abstract art was displayed against a background\
    \ of mystifying atonal music. Originality for its own sake joined the masters\
    \ of the creative arts.\n\nFor the origin of cubism, Picasso gave metamorphosis\
    \ as his central goal: “Any artist who sports his weight,” he said,\n\n> must\
    \ oblige to be represented the most possible plasticity. Thus for the representation\
    \ of an apple: if you draw a circle, it will be the first degree of plasticity.\
    \ It is possible, however, that the artist wishes for a greater degree of plasticity,\
    \ and in this case the represented object will end depicted in the shape of a\
    \ square or cube which in no way negates the model.\n\nThe drive for innovation\
    \ can be viewed as an analogue of genetic evolution, and to good effect. Cultural\
    \ evolution adapts us to the inevitable and constantly changing conditions of\
    \ the environment. Its innovations are the equivalent of mutations in the genome.\
    \ These biological accidents have occurred throughout the history of humanity,\
