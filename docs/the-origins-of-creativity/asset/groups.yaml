    more spines project to the rear from the first segment of the waist across its
    joint and approach the second segment.


    The first specimen of this species was described in 1915 by a German entomologist,
    who gave it the scientific name Lordomyrma rupicapra. The first term includes
    the Greek expression for "ant." The second, rupicapra, borrows the name of the
    European "rock goat" (Rupicapr rupicapra), because when viewed from above, the
    lines and shapes of the midbody are reminiscent of a Chamois goat.


    The history of the discovery more than a century ago, was but one very small event
    in an expedition conducted in the grand style of European natural history, even
    when less was known of New Guinea''s fauna and flora, with the one specimen captured
    the record and equally important the spirit of the enterprise. The account is
    among the best for exploratory natural history, and worth quoting in full.


    L. rupicapra holotype was very likely collected at a high-elevation, provably
    clouded-forest site. The collector S. G. Burgers was medical officer and zoologist
    with the remarkable German Kaiserin-Augusta-Fluss Expedition (1912-1913), for
    which 19 months explored the basin of the Sepik River and its headwaters. The
    scientific party travelled well upstream of the 560 miles of speedboat-navigable
    water. Four upriver overland trips averaging 3 months duration were maintained.
    All Sepik tributaries extending beyond the former (that of modern-day Papua New
    Guinea and Indonesian West Papua) were explored to their headwaters, and the Bewani
    and Torcelli Ranges (north) and central cordillera (south) penetrated (Sauer,
    1915); Behmann, 1917, 1922). Geographer Behmann''s narratives mention specimen
    collecting on a "damp, cold 2000 meter high peak," and crossing over the "2,000
    m Schrader Range" ca 4°59'' S, 144° 05'' E). Nationaal Herbarium collection-locality
    records of the expedition botanist C. L. Ledermann include four sites above 1,000
    m elevation at 4°50'' S, 142°29'' E), 1,000 m; Mt Hunstein (4°29'' S, 142° 42''
    E), 1,350 m (where 17 days were spent at the summit); and "Holrungberg, 1,800–2,000
    m.\ The cited coordinates are those of expedition camp sites.'
  - '[PAGE 99]


    I might have left the discovery of this species unremarked here, except the account
    of its capture combines two archetypes resident in both science and the humanities.
    The lure of geographical exploration and scientific discovery that brought me
    to New Guinea can still be summoned in Earth''s remaining wildlands. They cannot
    help but to the creative arts, pleading for closer attention to the natural world.


    To the same end, I''ll close my account of the hunter''s ethics with a story of
    my meeting in 1952 with Vladimir Nabokov, who was my natural history soulmate.
    I was a twenty-three-year-old graduate student, working on my Ph.D. thesis in
    Harvard''s Museum of Comparative Zoology. Nabokov was fifty-three years old, his
    fame as an English-language novelist to come. I knew him only as a lepidopterist,
    a specialist on butterflies. His expertise was on the butterflies—small, beautifully
    colored insects that compose the taxonomic family Lycaenidae. Nabokov had earlier
    held a job working on Harvard''s butterfly collection, and the specimens he added
    are now celebrated by many literary historians as by entomologists. Unaware of
    his literary talent, I visited him to broaden my knowledge of butterflies and
    other insects, as did all entomologists coming to the museum.


    Nabokov entertained me with a personal story about butterflies that had an amusing
    twist. He''d met the captain of a ship that had recently visited Kerguelen, a
    remote archipelago off Antarctica seldom visited by anybody and with a still mostly
    unknown natural history. Nabokov was excited by the promise of such a remote environment.
    "Were there any butterflies?" I asked. "No," the captain responded. "None. Only
    a bunch of little blue things."


    Kerguelen! We rhapsodized about such places on Earth where awaited our discovery.
    The next year, with a three-year fellowship that allowed me to go anywhere and
    do anything I wished (provided I accomplished "something extraordinary" as the
    membership pledge demanded), I traveled around the world for unknown species:
    mountain forests in Cuba, the upper slopes of volcanic peaks in Mexico, rain forests
    in the South Pacific archipelago of New Caledonia and Vanuatu, the Saruwaged Range
    and other parts of New Guinea, and the mostly unexplored western fringe of the
    Nullabar Plain of Australia. In each place I searched joyously for something extraordinary.
    How could I help but find it in the adventure of natural history?'
  - '[PAGE 100]


    And so I understand very well both the Rocky Mountain elk hunter and the long-ago
    visiting lepidopter. As Nabokov later expressed his vision: “The highest enjoyment
    of timelessness,” he wrote, “is when I stand among rare butterflies and their
    food plants.”


    That is ecstasy, and behind the ecstasy is something else, which is hard to explain.
    It is like a momentary vacuum into which rushes all that I love. A sense of oneness
    with sun and stone. A thrill of gratitude to whom it may concern—to the contrapuntal
    genius of human fate or the tender ghosts humoring a lucky mortal.


    For me, the same feeling returned fleetingly in full force in 2016, when I was
    invited to be the Honorary Principal Scientist (absentee, alas, due to age) on
    an expedition to Heard Island. This second island off Antarctica is even more
    remote and rugged than Kerguelen and features an active volcano. I wrote the expedition
    leader Robert W. Schmieder that I was of course greatly honored. I would accept,
    I added, on condition that the team looked for ants. “You won’t find any. It’s
    just too wet and cold. But just knowing you looked will make me feel better.”'
  - '[PAGE 101]


    # 15


    # GARDENS


    Across the Paleolithic steppes of Europe and Asia, and back in time for more 35,000
    years, the ancestors of modern humans and their Neanderthal sister species buried
    their dead, leaving a treasure trove for present-day archaeologists. In shallow
    graves, the ancients often included household items and upper body ornaments owned
    by the dead. A very few of the graves, only three per thousand years discovered
    thus far, had been elaborately decorated, suggesting a high rank of its occupant.


    At the dawn of the Neolithic, characterized by agriculture, stored food surpluses,
    and settled villages, mourners began to add flower beds to the graves. The oldest
    known, dated to 13,700 years before the present, are at four sites in the Raqef
    Cave at Mt. Carmel in northern Israel.


    There is a logical reason flowers and gardens should rank so high on into modern
    times. The poet-naturalist Diane Ackerman has expressed it close to perfection:


    A flower''s fragrance declares to all the world that it is fertile, available,
    and desirable, its sex organs oozing with nectar. Its smell reminds us in vestigial
    ways of fertility, vigor, life-force, all the optimum expectancy and passionate
    bloom of youth. We inhale its'
  - '[PAGE 102]


    ardent aroma and, no matter what our ages, we feel young and nubile in a world
    aflame with desire.


    Flowers grace our literature, our fashions, our religious ceremonies. They announce
    our rites of passage and signify our celebrations. Made into boutonnières and
    garlands, they advertise our status, our purpose, and our demeanor for the day.


    The beauty and scent of flowers did not emerge just for human delectation. Among
    the plants that produce them, namely the angiosperms (the more than 370,000 species
    of flowering plants of the world), our purpose is purely sexual. Flowers serve
    to attract pollinators, most insects, but in addition and to species, a large
    array of birds and a few mammals. The relationship is symbiotic, “mutually symbiotic”
    to be precise, in which both partners benefit from the symbiosis.


    The strategies used by different species to achieve the symbiosis has evolved
    as though to delight the human artistic ego. Dendrolobium orchids, tropical epiphytes,
    thrust clusters of delicate, modestly pink flowers among their narrow leaves.
    Cyclamens offer amorphous red or white flowers in the midst of broad leaves, conspicuously
    bright with green and white, pretending to be the real stars of the show. Christmas
    coral columna, challenging in brilliance any human art, dangle tubular red flowers
    from creeping vines amidst mostly seamless.


    These examples and countless others are plants arranging parts of their bodies
    for display. They depend on daytime animals that possess color vision. To equal
    degree, the relationship has evolved the other way. Some animals have evolved
    color vision by natural selection in order to harvest pollen and nectar offered
    by plants. The two kinds of partners, plant and animal, coevolved as necessarily
    equal partners.


    Humans have picked up this worldwide symbiosis and taken it further, creating
    a new art form based on flowers. In a 1640\u045 imagined portrait of St. Francis,
    for example, the Spanish painter Francisco de Zubarán depicts the full length
    of the saint’s robe emerging from a dark, sparse array of surrounding lilies that
    reflect the skin tones of the saint’s upturned face. Shrouded by palm leaves,
    they repeat the angles of his robe.


    Pursuing a wholly different mood, Jean Honoré Fragonard’s Mademoiselle Marie-Madleine
    expresses the self-indulgent'
- md: '

    excesses of the ancien régime on full display. The celebrated singer and dancer,
    judged to be one of the most beautiful in France by standards of the day, is surrounded
    by trains of her beloved roses that cross her head and run down arms, while her
    form is wreathed by a cascade of other roses. Mlle. Guimard, in short, has become
    a flower.


    Radically different from those classical examples is Paul Manship’s stunning The
    Moods of Morning (1935). A sculpture of a supine awakening is paralleled at the
    base by buds of many species, which push forward to an apical cluster of lilies
    and birds of paradise flowers. In the words of the art critic Victoria Jane Realm,
    the final bouquet is “more open, more intense, ending in an explosion of color
    and form” that represents the full awakening of the human subject.


    In a different realm, flowers and fruits surrounded by sculpture have graced ornamental
    gardens since the beginning of civilization. Gardens in general have been the
    key instruments of agriculture, and agriculture was the means by which humanity
    evolved from Paleolithic hunting and gathering bands into civilized communities.
    Agriculture was invented multiple times independently worldwide, and on every
    inhabited continent except Australia, variously from about 12,000 years before
    the present in the Middle East to 5,000 years ago in the New World. It probably
    originated in one of the other two ways. First was direct observation that edible
    seeds and fruit give rise to plants that produce more edible seeds and fruit.
    Alternatively, there would be a tendency for clusters of people to settle close
    to trees, shrubs, and herbaceous plants that are exceptionally productive, leaving
    the rest away. Domestication by selection of the most productive plants, hence
    agriculture, logically followed.


    Gardens, like the natural world they represent, have a restorative and healing
    effect. Lay people have always felt their power, and scientists have tested and
    proven their salutary effects. In one test, volunteers were first shown a stressful
    movie, then videos of nature experienced a subsidence of stress, measured in heartbeat
    rate, systolic blood pressure, facial muscle tension, and electrical skin conductance.
    But not those scenes of cities. Other studies have revealed, as expected, a similar
    reduction of stress symptoms in the presence of plants and aquariums prior to
    surgery and dental work. Furthermore, postoperative patients recover more quickly,
    suffer fewer complications, and need smaller dosages of painkillers, when allowed
    to look over natural environments or even just pictures of nature covering the
    hospital walls.


    With the accumulation of wealth and the rise of social hierarchies, rulers and
    the wealthy could afford ornamental gardens for display and pleasure. Later, as
    for example in France, Spain, Japan, and Sri Lanka, these gardens were opened
    to the public. Today, public gardens are universal in most societies and give
    pleasure to all classes.


    Homeowners in North America and most of Europe routinely convert their property
    into simulations of nature, usually consisting of lawns and mostly ornamental
    trees and shrubs. Yet, even though the benefits of nature are undeniable, landscape
    developers routinely commit two unintentional errors that harm the greater environment
    that they and their customers instinctively love. First is their obsession with
    lawns. People enjoy open spaces, and have most likely since the birth of humanity
    on Africa’s savannas. A lawn, however, ranks among the worst possible environments
    worldwide, just above bare concrete. Every lawn (if we put aside the heroically
    rebellious dandelions) is a monoculture of alien species, ferocious consumers
    of water that also demand regular applications of fertilizers, toxic herbicides
    and insecticides, the excess of which eventually seep into aquifers and streamwaters.


    Of equal concern, most landscape planners select ornamental trees and shrubs on
    the basis of their perceived beauty, with little or no concern for their geographical
    origin. Choosing exotic over native species has profound implications for the
    environment, most significantly the much higher production of insects supported
    by native plants. The wildlife ecologist Douglas W. Tallamy produced four times
    the biomass of insects feeding on exotics than on native woody plants in Pennsylvania.
    Tallamy attributed the difference to the reduced ability of native insects with
    chewing maws to eat alien plants, on which their species did not evolve. He found
    that native species supported thirty-five times more biomass of caterpillars—chiefly
    moth larvae—than did exotic


    Preferring trees and shrubs that produce more insects may seem the wrong way to
    go in landscape planning, but the opposite is the case. Insects, especially caterpillars,
    are the preferred diet of songbird nestlings. Native woody plants produce more
    birds and thereby an all-around richer ecosystem. A healthy population of birds
    provides a check on runaway population increases of insect pests, such as the
    Eurasian gypsy moth emerald ash borer. Further, by supporting native bird populations
    at a sustainable level, we help ease the extinction risk of the rarest species
    among them. Replacing exotic plant species with alternative native species, which
    are comparably attractive and in every respect more interesting, is not just environmentally
    wise but also cost effective. It is personalized conservation at its best.


    Biophilia, an instinct that is well supported by humanistic scholarship and scientific
    research, draws humans to the rest of life on Earth and provides us with deep
    satisfaction. While we have just begun to understand the evolutionary origin and
    neurobiological impact of this instinct, biophilic design has become a growing
    new development in architecture. The celebrated prototype is Frank Lloyd Wright''s
    Fallingwater. Nested in woodland aisle beside a waterfall, with a front facing
    downslope, its cantilevered tell two stories reminiscent of rock edges and the
    murmuring of water heard within, this dwelling, first occupied in 1937, still
    stands as an historic ideal of humanity''s accommodation to nature.


    A later biophilic masterpiece is the Finnish Embassy in Washington, DC, designed
    by Mikko Heikkinen and Markku Komonen, and a recipient of major awards for design
    and energy efficiency. The interior is open all over to sunlight, bringing visibility
    in every direction. In my opinion, the building''s most remarkable feature is
    its placement, not a manicured lawn but on the edge of undisturbed nature. Half
    of Finland is enclosed by a glass wall at ground level that looks into the forest
    from only a feet away.


    By the end of the twenty-first century, if current demographic projections are
    correct and the planet is lucky, the human population will peak at roughly twelve
    billion people, about 50 percent more than are today. The vast majority will live
    in cities. What will those cities be, serving as the home of an abnormally dense
    biomass? Will they become ranges of stone, climate-controlled skyscrapers, fulfilling
    all dystopian visions, within which all the needs and desires of their inhabitants
    are met (much as termite hills)? Or will their planners find some way to let nature
    in, to bring people close to their own genetic heritage? Will they enable us to
    remain fully human?


    One means to bring nature in, which I proposed in Half-Earth, would be wall-sized
    television screens on which we could watch the best remaining wild habitats in
    our homes, in real time. My own personal choices would include a Serengeti waterhole,
    an Amazon forest canopy, an Indonesian coral reef, the journey of a tagged great
    white shark down the Pacific coast, and the microscopic bacterial and algal forest
    of a hot spring (thought by many experts to be a remnant of one of the earliest
    ecosystems on Earth).


    It would furthermore not be too difficult to bring parts of the natural world
    into our cities, as argued by Timothy Beatley in Biophilic Cities: Integrating
    Nature into Urban Design and Planning (2011) and other like-minded urban architects.
    Existing parks and others being planned can be seeded to sustain a rich native
    biodiversity. Vacant lots, interstices between buildings, and unused strips of
    riverside land can be allowed to regenerate their natural faunas and floras and
    used for recreation and education (as practiced by the Chicago Wilderness program,
    for example). Gardens and managed natural ecosystems can be planted on unused
    rooftop space and, using vines and natural cliffside vegetation, adorn even the
    sides of skyscrapers. There is no city whose inhabitants, once secure with personal
    necessities, could not enjoy a flutter of butterflies, a parade of early spring
    flowers, and even an occasional thrilling swoop of a falcon through a small yet
    authentic stand of native forest.

