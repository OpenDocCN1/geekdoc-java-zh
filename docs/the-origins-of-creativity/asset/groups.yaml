    hiss raised by countless tinyfalls. The nocturnal harvests are used to grow an
    edible fungus in subterranean gardens.


    The macrotermites are true superorganisms. The collective intelligence of each
    of the colonies is still far below the level of humans and other mammals, even
    below most birds, but well above that of solitary insects.


    Yet their creativity remains zero. Let us suppose they had ascended during their
