    Sometimes extraordinary species are found by careful search, other times they
    are spotted accidentally in a fleeting glimpse. In 1955, I was in a biologically-explored
    part of New Guinea, on the move with a party of local Papuan men, all expert hunters.
    We were climbing through trackless forest at the base of the Huon Peninsula toward
