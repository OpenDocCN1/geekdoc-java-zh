    “人文”一词包括但不限于以下内容的研究与解释：语言，包括现代和古典语言；语言学；文学；历史；法学；哲学；考古学；比较宗教；伦理学；艺术的历史、批判和理论；具有人文内容并采用人文方法的社会科学领域；以及人文在人类环境中的研究与应用，特别关注反映我们多样化的遗产、传统和历史，以及人文对当前国家生活状况的现实意义。


