    后来得知，这确实是艺术家所想要表达的自然呈现。无论波洛克在他的作品中对他人还有什么其他想法，我也有同样的感受，也许这只是我个人的特异感受，特别是对于波洛克的《8号》。


    尽管如此，所有领域的创意艺术家都未能充分探索荒野及其内部的生物多样性。既有导致物种倍增的进化，也有从初始混沌结成有序生态系统的过程；还有入侵物种破坏古老的自然生态系统；以及许多许多可以通过启发性的诗意和视觉描述转化为思想和情感的自然人为过程。


    > “自然在说话——朱莉娅·罗伯茨是大自然母亲，”国际自然保护会（CI）（https://www.youtube.com/watch?v=WmVlcj-XKnM）。


    # 猎人的入迷


    沉浸在错综复杂的岸边，是顶级猎人为了特定的植物或动物进入的一种入迷状态。为了寻找猎物，猎人像老虎一样独自工作，而不是像狼一样结群行动。他对猎物所生活的场所和环境细节了如指掌。他对地面和植被中任何可能出卖目标动物路径的细微变化都保持警觉。他必须准备好从远处跟踪目标，每一步都小心翼翼，这在字面上是关乎死的。或者，他可能会伏伏中静静等待数小时。为了完成猎杀，他必须知道猎物会有什么行为——它们何时能感知到他，从哪个方向，以及何时准备好逃跑。当顶级猎人感知到与猎物相似的“环境世界”（Umwelt）时，他的表现最好。对于少数人来说，这种体验是精神性的，将猎人提升到更高的意识水平。


    在《猎人的入迷》（2007）中，卡尔·冯·埃森引用了一位猎人在科罗拉多高地追踪过一群瓦麋马鹿的经历：


    我发现了几只马鹿的新足迹，其中还有一头公鹿。早晨明媚阳光，微风拂过面庞，让我我有把握很近地接近猎物。在经过大约小时缓慢而仔细的追踪后，我来到一个宽五十码的长空地。如果马鹿在附近，它们就会发现我穿过了这片积雪和泥泞的草地。剩下的就是完全静止，并全神贯对面的山坡。我感受到了它们的存在，并以某种方式知道它们也感受到了我。当我站在那里时，时间感发生了显著的变化。几分钟后，感觉似乎像过了一个小时。一种强烈的场景清晰感席卷了我。我所有的感官似乎都锐利得像精细的刀刃。我听到远处溪流和叶叶沙动的细微声音，仿佛在天界的放大器中放大了。一切似乎都离我更近，我惊讶地感到自己与万物的某种融合，一种归属感。我与那全景中的一切都相连：草、树、岩石、昆虫、鸟类，以及我知道正安静地在山上、在我的视线之外的马鹿。我感到巨大的情感涌动，对生命的喜悦，以及与万物共存的机会。我永远不会忘记那一天。


    想要进入猎人的入迷状态，并不需要温彻步枪或对倒下的猎物进行血祭的仪式。作为一名自然主义者，我曾接近这种状态。但对自然主义者来说，比全方位意识的禅定更重要的是“搜索影像”，即某种植物或动物特征的组合，使追踪者能够将其发现隐藏在广阔生态系统数千元素中的其中之一。直到今天，我无法用语言来描述作为自然主义者猎寻稀有且鲜为人知的物种时感受到的愉悦。我可以告诉你们几个故事。


    我体现自然主义者搜索引擎力量的最佳经历之一，是发现了金蚁（zorapapterans），一种极其稀有且难以捉摸的昆虫。在大春的一个早晨，在阿拉巴马大学大一期间，我正沿着飓风溪附近的针阔叶混交林小径穿行，寻找新型且不寻常的蚂蚁。我剥开了一根腐烂松木的树皮。下面是铺满碎屑的石板，这种特定的生态位是罕见小蚂和其他和其他隐藏居民的喜爱的筑巢地。我选择这根木头上寥寥无几。它们开始移动，朝向了一个杂烩，一种由小蝎子状节肢动物、跳虫、粉细螨和矮小无名甲虫组成的稀疏混合物。但这个微型洞穴中的其他东西特别吸引了我的眼睛：像白蚁的小昆虫，但体型更长、更小、更精致、速度更快。我拿起放大镜观察它们，发现它们是一种长着弯大颚的蚂蚁。它们就是它们，我知道我发现了特别的东西。


    我收集了几具标本并将它们带回哈佛，在在那里我在显微镜下检查了它们。它们是一个新属，我后来将其命名 zorapapterus。这些蚂蚁具有奇特的构造，身体覆盖着细小的金毛，腿异常地长。它们还发现于洪恩半岛海拔一万二千英尺的高森林。我发现这些蚂蚁是社会性的，生活在大型群体中。这些昆虫的发现是我职业生涯的最高光，它提醒了我自然界无限的奇迹。


