    ## GARDENS


    Across the Paleolithic steppes of Europe and Asia, and back in time for 35,000
    years, the ancestors of modern humans and Neanderthal species buried their dead,
    leaving a treasure trove for present-day archaeologists. In shallow graves, the
    ancients often included household items and upper body ornaments by the dead,
    suggesting a high rank of its occupant.


    At the dawn of the Neolithic, characterized by agriculture, stored food surpluses,
    and settled villages, mourners began to add flower beds to the graves. The oldest
    known, dated to 13,700 years before the present, are at four sites in the Reef
    Cave at Mt. Carmel in northern Israel.


    There is a logical reason flowers and gardens should rank so high into modern
    times. The poet-naturalist Diane Ackerman has expressed it close to perfection:


    A flower''s fragrance declares to all the world it is fertile, available, and
    desirable, its sex organs oozing with nectar. Its smell reminds us in vestigial
    ways of fertility, vigor, life-force, the expectancy and passionate bloom of youth.
    We inhale its ardent aroma and, no matter what our ages, we feel young and nubile
    in a world aflame with desire.


    Flowers grace our literature, our fashions, our religious ceremonies. They announce
    our rites of passage and signify our celebrations. Made into boutonnières and
    garlands, they advertise our status, our purpose, and our demeanor for the day.


    The beauty and scent of flowers did not emerge just for human delectation. Among
    the plants that produce them, namely the angiosperms (the more than 370,000 species
    of flowering plants of the world), our purpose is purely sexual. Flowers serve
    to attract pollinators, most insects, but in addition to species a large array
    of birds and a few mammals. The relationship is symbiotic, “mutually symbiotic”
    to be precise, in which both partners benefit from the symbiosis.


    The strategies used by different species to achieve the symbiosis has evolved
    as though to delight the human artistic ego. Dendrolobium orchids, tropical epiphytes,
    thrust clusters of delicate, modestly pink flowers among their narrow leaves.
    Cyclamens offer amorphous red or white flowers in the midst of broad leaves, conspicuously
    bright with green and white, pretending to be the real stars of the show. Christmas
    coral columna, challenging in brilliance any human art, dangle tubular red flowers
    from creeping vines amidst.


    These examples and countless others are plants arranging parts of their bodies
    for display. They depend on daytime animals that possess color vision. To equal
    degree, the relationship has evolved the other way. Some animals have evolved
    color vision by natural selection in order to harvest pollen and nectar offered
    by plants. The two kinds of partners, plant and animal, coevolved as necessarily
    equal partners.


    Humans have picked up this worldwide symbiosis and taken it further, creating
    a new art form based on flowers. In a 1640 imagined portrait of St. Francis, for
    example, the Spanish painter Francisco de Zubarán depicts the full length of the
    saint’s robe emerging from a dark, sparse array of surrounding lilies that reflect
    the skin tones of the saint’s upturned face. Shrouded by palm leaves, they repeat
    the angles of his robe.

