    Fifty-one percent ranked it as very important, 42 percent fairly important, and
    only 6 percent somewhat important.


    Moreover, Americans respect the creative arts. At one level of sophistication
    or another, we depend on them as a perpetual source of both entertainment and—however
    we may put it—intellectual enrichment. Much of what we value is of high quality
    and growing better. The fine arts of Bel Canto and symphonic cadenzas are familiar
    companions to rock, folk, country, and western, even if less attended. Great visual
    art is accepted as authentically great, and well worth seeing in the original.
    A survey made by the National Endowment for the Humanities found that for the
    period 1982–2008 the percentage of Americans visiting an art gallery or museum
    at least once a year ranged between 20 and 25 percent.


    In short, the humanities are widely viewed as immensely important for society,
    and accordingly esteemed. But institutions identified with the humanities do not
    receive support and operate anywhere close to their value as subjectively judged,
    unlike universities, like Yale, now stress the sciences in accepting freshmen
    and creating new courses.


    The overwhelming problem is poverty, and a lack of respect. The humanities almost
    never receive enough funds to finish the projects to which their artists and scholars
    aspire. They have relatively few long-term wealthy sponsors of the Renaissance
    mode. Monasteries and other religious retreats no longer serve them as creative
    sanctuaries. They are classified as luxury items in national and state budgets.
    They offer too few jobs for the legion of young men and women yearning to devote
    their lives to some form of the arts and humanities.


    Above them both, casting a deep shadow like some alien ship parked above Manhattan,
    are the natural sciences. In the United States, from 2005 through 2011, the physical
    and biological sciences, along with mathematics, consistently received 70 percent
    of support for academic research and development from the federal government.
    The medical sciences and engineering did almost well, with just above 60 percent
    of their needs. Educational research together with the behavioral and social sciences
    came in close to 50 percent. At the bottom were the humanities, which, with the
    exception of law, stayed close to 20 percent. The rest of support for the humanities
    came principally from academic institutions.


    Science and technology have been supported massively by taxes from the American
    people for what is generally considered the public good. The knowledge obtained
    from this largesse is a contributing reason for America’s global economic and
    technoscientific dominance.


    The humanities, in contrast, are supported primarily by educational institutions,
    which receive their income from tuition and endowments, along with a tax-based
    sliver of government. In the competition between science and the humanities for
    funds provided by the American people, the humanities rank consistently lower
    than science.


    Americans typically assign prestige of an occupation by the salaries provided
    its professionals. A good measure of this valuation is the annual starting salary
    of college graduates. The U.S. Department of Labor reported in 2014 that the new
    STEM professionals were kings, receiving between $50,000 and $80,000. Liberal
    arts graduates, namely in architecture, English, elementary education, journalism,
    and psychology, were at the bottom, with starting salaries at $40,000 or less.


    Americans are often reminded that research and development in basic science are
    good for the nation. This is obviously true. But it is equally true for the humanities,
    all across their domain from philosophy and jurisprudence to literature and history.
    We preserve our values. They turn us into patriots and not just cooperating citizens.
    They clear why we abide by law built upon moral precepts and do not depend on
    inspired leadership by autocratic rulers. They remind us that in ancient times
    science itself was a dependent child of the humanities. It was called “natural
    philosophy.”


    Why are the humanities kept on starvation rations? Partly because much of our
    available resources are appropriated by organized religions. The vast majority
    of people around the world belong to one particular religious faith or another,
    which is defined not so much by a belief in God as by its idiosyncratic creation
    myth. Each member is committed to believe that his religion’s creation myth, accounting
    for the supernatural origin of the universe and humanity, is superior to all others.
    The problem is that all the myths cannot be correct; no two can be correct; and
    almost certainly none.


    Across the centuries organized religions have created transcendent music, literature,
    and art. The most moving ritual I have witnessed (if I may be indulged) is the
    Roman Catholic Easter celebration of Lumen Christi. It begins with a darkened
    cathedral filled with the faithful. The rear door opens, and the bishop enters
    holding a lighted candle. He calls to the still unseen assembled, “Lumen Christi”—the
    light of Christ. He then walks slowly down the center aisle, followed by attending
    priests. The faithful, standing silently, each holds an unlit candle. The episcopal
    group lights their candles by row, until the cathedral is fully illuminated. At
    the altar, the Easter service begins.


    Gripped by such majestic displays evolved over centuries, it is easy to forget
    that religious art is dedicated to the regnant creation story, that deviation
    from the story is not permitted, and that brutal wars have been fought to replace
    one story over another. The secular humanities, to put the matter plainly, must
    compete with organized religions and religious-like ideologies for attention and
    volunteer public funding. The first is free to explore and innovate, and the other
    is not.


    Competition from faith-based culture is not the only force suppressing the humanities.
    Far more potent is the digital revolution. Science and technology are not hostile
    to the humanities. They bind them to supernatural dogma or blind ideology. Nevertheless,
    their competition can become overwhelming. Artisanal manufacture, garden agriculture,
    and commercial wild fishing are shrinking toward extinction. Automation, mass
    production, and global communication increase the world economy, not the influence
    of the humanities, such that the best jobs are taken by those trained in science,
    technology, and technology-aided commerce.


    STEM has become the American symbol of power, the equivalent of Rome’s SPQR (Senatus
    Populusque Roman). There seems almost nothing a technological culture cannot accomplish
    in time—cure every disease, create artificial body parts and organisms, produce
    unlimited food in vertical LED illuminated farms, desalinate seawater with solar
    or fusion energy. Leaders in brain science and artificial intelligence have begun
    to search for the origins of mind and spirit, once territories exclusive to the
    humanities.


    It is self-evident that to succeed in the new scientific world, people need high-quality
    education—and lots of it. Very few countries have been able to meet the challenge
    the new reality presents. In particular, the United States, having led the world
    in the STEM juggernaut, has slipped to a low point in teaching it to the young.
    According to a 2013 study published by the Organization for Economic Cooperation
    and Development, adults aged sixteen to sixty-five in the United States ranked
    twenty-first out of twenty-three top-level countries in mathematics and seventeenth
    out of nineteen countries in problem solving.

