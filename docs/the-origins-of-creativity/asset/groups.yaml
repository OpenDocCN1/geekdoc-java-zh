  mdcn: "\n经济上的困难迫使我们小家陷入了贫困。在父亲的照顾下，我过着近乎流浪的生活，几乎每年搬一次家，在华盛顿特区以及遍布南方深南部地区的学校上学：包括密西西比州的比洛克西、乔治亚州的亚特兰大、佛罗里达州的奥兰多和彭萨科，以及阿拉拉巴马州的布鲁宁、迪凯特、埃格林和摩比尔。\n\
    \n我通过步行或骑自行车来补偿这种漂泊的生活，探索那里的昆虫和爬行动动物。当我十岁时，我们搬进距离华盛顿洛克溪公园只有几个街区的住宅里，我决定带着蝴蝶网和一本昆虫野外指南去探索。我有英雄来激励自己。他们包括我在附近的国家自然历史博物馆楼上听过的、那些被神化为神灵的科学家，还有《国家地理》杂志的作家们。特别是威廉·M·曼，他1934年发表的论文《追踪野蛮与文明》最终对我产生了深远的影响。此后，当我的父亲、新妻子我和像移民一样在南方各地流浪时，我结识了几个同龄的朋友，但大多数出于偏好，我选择独自探索附近的荒野。在即将高中毕业之际（当时恰好在阿拉拉巴马州的迪凯特），我假设自己会以某种方式上大学，然后找到一份昆虫学家的职业——永远留在户外，探索未知的荒野，越走越远，最终到达我所谓的“大热带（Big\
    \ Tropics）”地区，即亚马逊森林和刚果森林。\n\n然而，我从事这种职业的前景比我当时意识到的要低得多。我的学校记录并不完整，成绩平庸，并夹杂着缺勤和不及格。阿拉拉巴马大学拯救了我（并使我至今仍是其极其忠诚的校友）。根据当时的州法律，该大学的入学要求只有两个：高中毕业和阿拉拉巴马州居民。我的表现足够优秀，足以进入诺克斯维尔的田纳西大学攻读博士学位，一年后进入哈佛大学完成学位，并在余后的职业生涯中一直担任教职工作。\n\
    \n当我搬到哈佛攻读博士学位时，我童年的职业梦想变得更加强烈。我保持着对独自探索的偏好。在奖学金的支持下，我有前往我所谓的真正的“大热带”——地球上范围最广阔、受干扰最少、动植物区系最丰富的地区。那时以及在博士后的二十岁期间，我能够在墨西哥、中美洲、巴西亚马逊地区、澳洲内陆、新几内亚、新喀里多尼和斯里兰卡进行各种野外工作。\n\
    \n我发现，在陌生的地方保持持续的孤独（即使只有几个小时）在身体上可能是危险的，而且对思想和发现也是没有产的。我当时并不理解其中的原因，但大多数人都有强烈的交流欲望。他们每天都会聊一会儿，如果可能的话越频繁越好；对我来说，至少是在独处荒野时不停地。因此，在访问的陌生地点进行独自野外工作期间，我演化出了一个第二人格。这个人没有名字，也不是任何意义上的独立实体（我并没有疯）。简单来说，我的第二人格只是切换到一个独立的思维框架。每当我对周围环境的意识增强，每当行动优先顺序发生强制改变，每当我从字面上对自己自言自语但内心却是沉默的时，他就会出现。例如，第二人格会说话，追踪我在穿越小径时支散经验所构成的序列。\n\
    \n等一下！停！不要错过那个附植物（长在树干上的），即使它很难够着。那上面可能藏着某些非常有趣的东西，一个蚁巢或上帝知道是什么；你得看它一眼。[爆炸性内容已删除]\
    \ 够不着。继续走。[稍后] 注意你在做什么！脚下要格外小心！左侧茂密植被后面可能有一个深沟。小心，小心，看一眼。等一下！看！看！那里有一列蚂。某种非常新的东西。几乎隐藏在落叶层中。也许是军蚁——那不太对；也许是大蚁（Leptogenys）吗？继续走，进去，小心，小心，小心，这可能是某种新东西，真正的新东西。\n\
    \n通过和我那几乎沉默的合猎人以及喋喋不休的顾问来回交谈，我进行了野外研究，并吸收了我所访问环境的自然史。我的重点一直放在蚂蚁身上，这是野外研究的明智选择。我逐渐了解到，在数量、生物量和全球范围内，它们主宰了同体型等级的昆虫；直到21世纪的第二个十年，专家们已经鉴定出全球范围内14,000种。我并不是分类学家（专门从事分类的生物学家），因为在我访问过的每个地方它们都极其丰富，通过一辈子的野外工作以及对他人收集但未被研究的博物馆标本的研究，我发现并为450种新物种命名了拉丁科学名称。\n\
    \n当我沉默地穿过世界各地的森林和草原时，我的目的是尽可能发现各种蚂蚁，但最重要的是发现新物种和稀有物种，然后尽可能多学习它们的社会生活——它们在哪里筑巢、种群数量、等级、食物以及它们的通信系统。每种物种在解剖结构和社会行为上都是独特的，而且往往是根本然不同的。每一个都是新科学知识的来源。我了解了它们，几乎与其中几种蚂蚁生活在一起，并发现了它们对自然荒野环境所做出的精确适应。我是它们的故事故事，是绝大多数蚂蚁从未有过的记录者。\n\
    \n科学家和自然学家会告诉你，每一种蚂蚁都有它自己的故事，与众不同。从一个蚁群的行为中可以重建一个物种的历史。阿拉拉巴马大学拯救了我（并使我至今是其极其忠诚的校友）。根据当时的州法律，该大学的入学要求只有两个：高中毕业和阿拉拉巴马州居民。我的表现足够优秀，足以进入诺克斯维尔的田纳西大学攻读博士学位，一年后进入哈佛大学完成学位，并在余后的职业生涯中一直担任教职工作。\n\
    \n因此，弗兰森小说的特征是一种宏大的、模拟的精确性。他们的主角被一系列品牌名称、未定义的技术术语、哲学引用杂乱在一起所驱动着。\n\n## 4. \n\n\
    ## 创新\n\n虽然我意识到我没有作为小说评论家的资历，但对我来说，这听起来是一个极具才华的哈佛大二学生痛苦的、矫学的学识展示。人们觉得，作为文学作品，这本长书可能并不算出众。对某些人来说它是的；但对我来说不是。因此，弗兰森小说的特征是一种宏大的、模拟的精确性。他们的主角被一系列品牌名称、未定义的技术术语、哲学引用以及作者在沉思中能加入其文学鸡汤的任何其他东西杂乱在一起所驱动。它们属于詹姆斯·伍德称为“歇斯底里现实主义”的一个类别。在它们破碎的意识流中，对于人性的深度和根源几乎没有意识或兴趣。\n\
    \n但让我补充一点，在弗兰森随后广受好评的小说《自由》和《纯洁》，以及类似的后现代主义作品中，实际上是有价值的。它们是民族学的，对功能障碍家庭的人格和历史进行了精细的描述。它们当然是八卦（弗兰森听起来像你那话多的朋友），这就是为什么人们喜欢传记和第一人称小说。这种乐趣是天生的，非常符合达尔文主义，是从上述石器时代的营火谈话演化而来的。后现代叙述不能：它提供了特定地点和时间的文化片段的精确快照。这些作品就像照片一样，保留了人们看起来、看起来甚至是真实的样子，包括他们的装扮、姿态和面部表情，以及对他们最重要的环境——他们的家、宠物、交通工具、他们的小径和街道。谁能不被最古存的照片所吸引呢？那是约瑟夫·尼普斯在1826年或1827年拍摄的，确切日期不确定，内容是如此平凡的勃艮地区的屋顶——紧接着是街道场景，甚至有一个行人站在空旷街道旁的路边等候——为了什么，直到？那时你意识到自己被带回了多么遥远的过去。在那个时刻，林肯和达尔文还只是青少年，佛罗里达还是一片荒野，没有欧洲人知道尼罗河的源头。\n"
