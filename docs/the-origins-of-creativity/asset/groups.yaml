    typically authored by one to three contributors. The historic 1953 article in
    Nature by James D. Watson and Francis Crick, first to describe the structure of
    DNA, was typical of opportunities that lay open to scientists working alone or
    in very small teams. Today much larger teams are the rule. Dozens of coauthors
    heading a single article are not unusual. In a few subjects, such as the description
    of the complete DNA of an important species, their number may exceed a hundred.


    The 1950s and 1960s were the heroic age of modern biology, when a small number
    of talked-about champions made impressive advances against long odds. The excitement
    they generated was reflected in the popular culture. In the 1953 original film
    version of The World World, an alien spaceship enclosed in a large meteorite has
    just struck Earth—southern California, of course. As a crowd of locals stand around
    the center, wondering what it means, Ann Robinson’s character, a young local schoolteacher
    with unbearably feminine sweetness popular in the 1950s, says to Gene Barry’s
    character, a visitor, “There’s a scientist coming from Pacific Tech. He’ll tell
    us, ‘If the same scene were repeated today, the line would have to be, ‘Are terms
    coming from NASA and Cal Tech. They’ll try to figure out what’s going on.’”


    Just in the humanities, necessary specialization has driven biologists and other
    scientists into territories growing ever smaller. Much of the advanced technology
    and technical language of one discipline is best only comprehensible to experts
    in other disciplines, even those closely related.


    Will there be heroic ages of the intellect in the future? I feel certain there
    will be, and especially in the new border disciplines that combine scientific
    discovery with the innovations and insights of the humanities. It will come in
    multiple dimensions. Outside our sensory bubble are countless prospects for the
    creative arts. The challenge is to translate the previously unperceived into the
    limited audiovisual world of human consciousness. The advance will also come from
    an increasingly clear view of the biological origins of human consciousness, which
    can bring history into alignment with history. And, finally, the advance will
    come with understanding the evolutionary forge in which culture was shaped, slowly
    and often painfully, from animal instinct.


    The philosopher’s stone of human self-understanding is the relation between biological
    and cultural evolution. Why are human beings built and behaving in such and such
    a way and not some other? Only now, two-and-a-half millennia after the Athenian
    agora, are we beginning to understand the reason why some of our social behavior
    is hardwired instinct, some of it is acquired by genetically predisposed learning,
    and the rest is the product of cultural invention. The whole of it can be deeply
    understood only as a stage in our long-term evolution and not just through descriptions
    of the contemporary human condition.


    Meanwhile, it needs to be recognized, and talked about more frankly, for philosophy
    the elephant in the kitchen is organized religion. More precisely, the understanding
    of the human condition often foretold by the blending of science and religion
    is inhibited by the intervention of supernatural creation stories, each defining
    a separate tribe. It is one thing to hold and share the elevated spiritual values
    of religion, with a belief in the divine and in the existence of an afterlife.
    It is another thing entirely to adopt a particular supernatural creation story.
    Faith in a creation story gives comforting membership in a tribe. But bears stressing
    that not all creation stories are true, no one can be true, and most assuredly,
    all are false. Each is sustained by blind materialistic faith.


    The study of religion is an essential part of the humanities. It should nonetheless
    be studied as an element of human nature, and the evolution thereof, and not,
    in the manner of Christian bible colleges and Islamic madrassas, a manual for
    the promotion of a faith defined by a particular creation story.


    Meanwhile, because humanity is still swept along by animal passions in a digitized
    global, and because we are conflicted between what we are and what we wish to
    become, and because we are drowning in information and starved for wisdom, it
    would seem appropriate to return philosophy to its once esteemed position, this
    time as the center of a humanistic science and a scientific humanities.


    How much such a restoration be accomplished? It is worth bearing in mind that
    philosophy flourished within Western civilization during two bursts of creativity
    that lasted about 150 years each. Their essence has been concisely described by
    Anthony Gottlieb in The Dream of Enlightenment, a history of the rise of modern
    philosophy.


    The first was the Athens of Socrates, Plato, and Aristotle, from the middle of
    the fifth century to the late fourth century BC. The second was in northern Europe,
    in the wake of Europe’s wars of religion. It stretches from 1630s to the eve of
    the French Revolution in the late eighteenth century. Descartes, Spinoza, Locke,
    Leibniz, Hume, Rousseau and Voltaire—most, that is, best-known philosophers—made
    their mark.


    The second [Enlightenment] had mostly faded when science failed to meet its grandiose
    expectations. Today, what passes for present-day philosophy is not authorial logic
    but incoherence, due to inattention science. This is curious, since we are in
    what can reasonably be called the Age of Science, and science is positioned to
    combine with the humanities to rekindle the earlier Enlightments. I believe that
    we, meeting in common inquiry, can solve the great questions. It is time to ask
    again, fairly and with a great deal more confidence than ever before, the great
    questions of history. At the base, we need to explore more deeply the meaning
    of humanity, why we exist opposed to never existed. And further, why nothing remotely
    like us existed before. The grail we sought is nature of consciousness, and how
    it originated. Originally fundamental is the origin and proliferation of life
    as a whole.


    In a narrower focus, how are we to explain the existence of two genders—or more,
    considering the range of sexuality acknowledged today? Why is there sex in the
    first place? If we could reproduce parthenetically, or just bust offspring from
    our bodies, life would be so much simpler. These are not idle questions, to be
    left to salonists and after-dinner guests. They are not mind games, nor exercises
    to sharpen skills in logic. They address matters literally of life and death.


    We must ask not just how, but why, we are fixed by an exact schedule of genetically
    programmed growth and decline. And now, finding ourselves in the Age of Artificial
    Intelligence, we are forced to define, with exactitude, a human being. Might build
    one from chemicals taken off the shelf, at least to the level of a fertilized
    egg begun with a designated genome? And if that proves impossible, which I doubt,
    we need to seriously discuss humanoid robots, endowed with emotions and even the
    power of creativity.


    Scientists and scholars in the humanities, working together, will, I believe,
    serve as the leaders of a new philosophy, one that blends the best and most relevant
    from these two great branches of learning. Their effort will be the third Enlightenment.
    Unlike the first two, this one might well endure. If so, it will bring our species
    closer to realizing the prayer for reason inscribed by Diogenes and still visible
    in original form on the Oinoanda stoa in the ancient Greek region of Lycia.


    Not least for those who are called foreigners, for they are not foreigners. For,
    while the various segments of the Earth give different people a different country,
    the whole compass of this world gives all people a single country, the entire
    Earth, and a single home, the world.

