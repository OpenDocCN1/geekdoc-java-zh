    During interactions with strangers, the presence of a smile reliably predicts
    trust and sharing resources. Moreover, observing smiles that accompany cooperative
    behavior increases one''s cooperation in the future. Negotiating status is another
    matter. This type of social interaction is complex and potentially disruptive
    in homogeneous cultures, such as Japan and China, where long-term population stability
    created conditions favorable to the development of fixed hierarchies. In similar
    circumstances, a smile can signal that the interaction will not disturb the social
