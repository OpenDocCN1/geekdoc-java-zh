    Returning to biology, the variability in form and meaning of deict signals leads
    to a part of the fundamental process of gene-culture coevolution: the narrowing
    and hardening of variation itself as an inbuilt trait by evolution through natural
    selection. First called the Baldwin effect, after the American psychologist James
    Mark Baldwin, who conceived it in 1896, gene-culture coevolution has substantial
    relevance to the evolutionary origin of human nature. In essence, it is the principle
    that a variant in a learned behavior proves advantageous and is repeated, mutations
    prescribing rather than leaving it as merely a learned option will increase in
    frequency, and in time the new trait will become fixed.


    The Baldwin effect is strikingly illustrated in the castes of ants and termites.
    Charles Darwin was fascinated by these insects. He spent long hours seated in
    Down Gardens, watching and thinking about the anthills there—so much a housemaid
    is reported to have remarked, while referring to William Makepeace Thackeray,
    the prolific novelist who lived nearby, "It is a pity that Mr. Darwin doesn''t
    have something to pass his time, like Mr. Thackeray."


    In fact, the great naturalist was more troubled than Thackeray could ever have
    been while struggling over any of his plots and denouements. Darwin had noticed
    something about ants that appeared to contradict the theory of evolution by natural
    selection and could prove fatal to it. He knew that typical ant colonies consist
    of the mother queen plus a few males that if present are temporary guests, and
    finally, a great many female workers who run the colony and perform all the labor.
    His dilemma was: workers do not reproduce; they are sterile, and in some species
    they lack ovaries altogether. If worker cannot reproduce, and if they are unable
    to pass on their servile anatomy and behavior, how can these traits evolved through
    natural selection? The answer Darwin conceived proved correct (the man was annoyingly
    almost correct). All the female members of the colony, he reasoned, had the same
    heredity. Which caste each female becomes, whether queen or worker with its distinctive
    body form and behavior, depends on the environment in which she is raised. Especially
    important is the amount and quality of food she receives while growing up as a
    little grublike into a six-legged, antennae-waving adult. The details of caste
    determination vary greatly among the 14,000 known species of ants, but of those
    studied so far, the development proved to be a genetically based version of linear
    programming. One code solved by researchers has the following rule: If a larva
    reaches a certain size by a predetermined age, its development continues unabated
    to the new queen, with a full set of wings and ovaries. If instead the larva fails
    to reach the critical point in time, growth of the tissues destined to become
    wings and ovaries is shut down, and the adult emerges as a worker—wingless, sterile,
    and smaller than its sister virgin queens—even when all in the colony are genetically
