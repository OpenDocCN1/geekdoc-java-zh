    \ silent recessives to dominant beneficial genes. Only a tiny fraction of mutations\
    \ are successful, benefiting the individuals that they carry and spreading through\
    \ the population as a whole. Sometimes they have enormous consequences. One example\
    \ is the ensemble of mutant genes that prescribe lactose tolerance. A small random\
