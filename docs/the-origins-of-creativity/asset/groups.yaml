    In the evening mood relaxes. In the chiaroscuro firelight the talk turns to storytelling,
    which drifts easily into singing, dancing, and religious ceremonies. Storytelling,
    especially among the men, turns frequently to successful hunts and epic adventures,
    their dominant daytime activity. As described by Elizabeth Marshall Thomas in
    her 2006 classic The Old Way: A Story of the First People, the stories are (or
    once were) commonly mythlike accounts of actual hunts. They were recited over
    and over by men in special voices, becoming almost chants, to which everyone listened.
    There follows one story, in the actual words of the hunter, of how an antelope
    is taken down by a poison arrow. I especially like it, even in full translation,
    because it could be a performance made under hundred thousand years earlier. As
    paleontologists reconstruct extinct animal species from skeletons, it seems possible
    to reconstruct ancient social life from such least evolved progenitors.


    Ai! What? Is that an ear? Yes, an ear! There''s his ear against the sky, he''s
    in bushes, just there, the edge of the bushes. I watch it. Yes, it moves, he turns
    a little, a little, he lifts his head, he''s worried, he sniffs, he knows! He
    looks, I''m down low, down low, just very quiet, down low, he doesn''t see me!
    He! He''s safe, he thinks. He turns around. I am behind him. I creep forward,
    eh! I creep I creep, I''m just that far, eh! just from me to there, quiet, quiet,
    I''m quiet, I''m slow, I have my bow, I set the arrow. Ai! I shoot. Waugh! I hit
    him! He jumps. Ha ha! He jumps. He''s gone! I shot him. Right here, just here
    the arrow went in. He jumped, he ran that way, going that way, but I got him.


    Storytelling, including especially recorded tales of successful hunts and epic
    adventures, consumed 6 percent of the overall recorded time during the day, but
    they consumed 81 percent of the evening. The overall effect was to convey the
    big picture of the group''s existence. It united them into a rule-based community
    with a single culture. As the elder Di/xao explained in an earlier Ju/''hoansi
    account, “Our old people long ago had a government, and it was an ember from the
    fire where we lived which we used to light the fire at the new place we were going.'
