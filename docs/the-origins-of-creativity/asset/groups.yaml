    世界。它最近的邻居是复活节岛，星球上最孤立的居住岛，距离这里两百公里。


    现在，作为一名对地理有特殊兴趣的生物学家，我特别想知道，什么样的植物动物可能到达并现存于这个近乎外星的地方。我发现，答案只有极少数访问者才能获得，即萨拉斯斯与戈梅斯岛（Isla
    Salas y Gómez）。这片礁石是四种陆生植物的家园，其中包括一种骨刺蕨类植物，这种植物在偏远的大西洋岛屿圣海勒拿和升势岛也能发现。这里还有一些非常稀见的昆虫，以叶片为食（我没能找到它们的名称）。共有12种海鸟在此繁殖和抚养幼鸟。至于比昆虫大的其他陆地动物，则一个也没有。


    如果我们把那十左右的海鸟视为访客并排除，但考虑到那些尚未计数的、可能也存在的昆虫、微小线虫和轮虫，那么这个微小世界的陆生植物动物物种数量可能不足百种。面积相当的热带雨林拥有的物种是这里的百倍，甚至千倍。鉴于该岛已经存在了几个世纪（复活节岛人在仍使用双体船进行海洋旅行时访问），难道没有更多的植物动物殖民到萨拉斯斯与戈梅斯岛吗？它为什么依然如此毫无生？


    生物学家可以告诉你，可能的答案是，减少的动植物群处于平衡状态。距离最近其他陆地的遥远使得只有极少数物种能在漫长的时间间隔到达这片礁石，而萨拉斯斯与戈梅斯岛狭小的面积加速了它们消失的速度。当迁移率等于灭绝率时，任何给定时刻存在的物种数量保持在低水平。因此，萨拉斯斯与戈梅斯岛在“最简约”名单上又添了一项：世界极地之外岛屿上最小的动植物。


