    So perhaps it is a blessing that the mind does not travel easily to vast and unfamiliar
    regions, but instead prefers to cruise and repeat its excursions in small familiar
    circles. Further, as a rule, people do not like the solitude of their own thoughts.
    A team of psychologists from the University of Virginia and Harvard University
    recently found that volunteers disliked sitting alone for even as little as six
    minutes with nothing to do but think. They enjoyed mundane eternal activities
    more. They preferred administering electric shocks to themselves if nothing else
    was available.


    The full explanation of any biological phenomenon, including creativity in both
    science and the humanities, engages three levels of thought. First, for any conceivable
    living entity or process—a bird taking flight, growing toward the sun, your reading
    of this sentence—the first inquiry must be, What is it? Provide the structure
    and functions that define the phenomenon. If it involves music or theater, perform
    it. The second level is the question, How was it put together? What made it into
    existence? What were the events that resulted in the conditions of its origin,
    whether ten seconds or a thousand years ago? The third and final level is, Why
    do the phenomenon and its preconditions exist in the first place? Why not a different
    mode of evolution not present on this planet that might have produced a different
    kind of thinking brain?


    Scientists living phenomena at all three of these levels. As a rule, they choose
    entities and processes that engage the what, how, and why in whatever detail and
    dimension that lie within their reach.


    Biologists, however, perhaps even than other scientists, feel it necessary to
    seek cause and effect at all three levels. The causes that bring about a living
    phenomenon, such as the flight of a bird or our perception of a flower''s colors,
    are called proximate causes. The events that guided the evolution of the phenomenon
    to its present state are called ultimate causes. Proximate causes are the what
    and how of a full explanation. Ultimate causes are the why.'
  - '[PAGE 14]


    Scientific explanations of organic life, including human life, routinely entail
    both proximate and ultimate causes. In contrast, accounts that govern inquires
    in the humanities attempt at best only proximate explanations. Ultimate causation
    tends to be left to the God of Genesis, ancient alien visitors, or a mysterium
    tremendum et fascinans imagined to be resident deep within the human mind. Take
    as a random example the red color of a flower petal placed before you. The redness,
    like all hues, is distinguished by the stimulation of a particular portion of
    the electromagnetic spectrum composing the visual spectrum. The receptors are
    red-sensitive cones in the retina. The latter transmit signals to a staging center
    in the brain cortex, thence in relays back to the rear of the cortex, then to
    integrating units of perception and emotion, and finally back out to the centers
    of the conscious forebrain, causing you to say “red” (or perhaps rot, rouge, or
    krasny, or bombu, depending on your native language).


    Having this far, scientists have in decades tracked down the interacting segments
    of DNA that compose the genes prescribe recognition of colors.


    Thus, scientific research has brought us close to solving the first line of mysteries
    in human color vision. The way is now open to the still deeper question of ultimate
    causation: Why can humans see a particular spectrum of color but cannot see infrared,
    or ultraviolet, or other frequencies outside the narrow segment of the electromagnetic
    spectrum yielding visible light? And even deeper, why does DNA, and not some other
    coding chemical, prescribe color vision and all the other processes of life on
    Earth? Might we expect to find fundamentally different codes on life-bearing exoplanets?
    And why do we see color in the first place, instead of just shades of light and
    dark?


    The answers of such why questions await the reconstruction of prehistory, during
    our species emerged from earlier hominins, and much further over tens of millions
    of years when basic properties of our present brain and senses were shaped within
    the earliest ancestral primates.


    Scholars in the humanities have traditionally confined themselves to the what.
    They have touched lightly on the how. They have seldom ventured into the world
    of why. They build upon the biological particularities of the senses and emotions
    already in place at the dawn of the Neolithic, some ten thousand years ago—hence
    the almost exclusive contemporary content of'
