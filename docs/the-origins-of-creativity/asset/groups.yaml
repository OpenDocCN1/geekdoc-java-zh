    ## HUMAN NATURE


    The human condition—what we are as a species, what we wish to become, and what
    we fancy we can become in flesh and dreams—depends upon phenomena at four levels.
    The first is the processing of sensory input, as in hearing, sight, and smell;
    the second is the reflexes, as typified by eyebelinks and the autonomic nervous
    system; and the third is paraluinguistic, comprising facial expressions, hand
    movements, and laughter. The fourth and final level is symbolic language, the
    capacity that distinguishes Homo sapiens absolutely from other creatures. Each
    of the four levels is altered to extent by emotional centers of the brain. Subject
    to decision at the checkpoint centers of the subconscious brain, they summon memories
    that form future scenarios in the conscious mind. The result of all these processes
    is what we call “thinking."


    Sensory perception is heavily tilted in humans toward sight and sound, whereas
    the vast majority of other kinds of organisms rely on chemical cues. As researchers
    in gestalt psychology long ago discovered, incoming sensory information tends
    to be be distorted and ambiguous in predictable ways. The visual anomalies include
    the Rubin vase, an image shaped to switch (in our minds) from a vase to a pair
    of opposed facial profiles, then back and forth between vase and faces. When a
    Necker cube, composed of six faces of equal area, is turned and tilted, the front
    and rear vertical edges appear to exchange places fast and repeatedly. The most
    delusional frustrating of all is the Müller-Lyer illusion, where, like magic,
    a V-shaped figure opening the ends of a line makes the line seem longer than an
    identical line with the V placed closing the ends. The mind strains to verify
    the physical proof it is programmed to deny.


    ![](img/4f9a8e761ebbf74595dea645718a093a_80_0.png)


    There are countless other ways in which the visual system copes with the ambiguities
    of the real world. The brain manages the confusion of visual input by automatically
    reordering and simplifying the information it provides. When laboratory volunteers
    were asked to make drawings of figures they had memorized earlier, they proceeded
    to create shapes more generalized than those experienced. In particular, they
    improved the symmetry, simplified the figure, enhanced the subdivisions, straightened
    oblique lines, and isolated incompatible details.


    Reflexes, forming the second level of behavior, are truly hardened and of way
    of conscious thought, except in later memory. The sneeze is a reflex, as is the
    knee jerk, involuntary eyelid blink, blushing, yawn, salivation. The most complex
    reflex is the startle response. Imagine coming unseen and very close behind someone,
    almost touching, and making a loud noise (I don''t recommend that you actually
    try this). The person will instantly slump forward, drop the head, close the eyes,
    and open the mouth. The function of the startle reflex is defense. Think of a
    Paleolithic hunter who, who stalked from behind and attacked by a predator (say
    a leopard), rolls forward and away in an overall relaxed posture. This correct
    decision and swift action is actuated with no conscious thought needed.


    Facial expressions, postures, and bodily movements, the paralinguistic signals
    composing the third level of human nature, are both consciously dis and shared
    to some degree by all cultures. They are also used universally as substitutes
    or enhancements for verbal language. During his classic field research in the
    1960s, the German anthropologist Irenäus Eibl-Ebesfeldt demonstrated in minute
    detail that people in all societies, from primitive and preliterate to modern
    and urbanized, use the same wide range of paralinguistic signals. These entail
    facial expressions, denoting variously fear, pleasure, surprise, horror, and disgust.
    Eibl-Eibesfeldt lived with his subjects and further, to avoid self-conscious behavior,
    filmed them in their daily lives with a right-angle lens, by which the subject
    is made to think that the camera is pointed elsewhere. His general conclusion
    was that paralinguistic signals are hereditary traits shared by the whole of humanity.


