    plots and characters in stories. They may be imprecise and even trite, but they
    are the bread and butter of literature and drama.


    # 17


    # ARCHETYPES


    Whereas metaphors are the building blocks of language, archetypes form part of
    the common groundwork of human emotion. Archetypes, composed of universal stories
    and images, have been recognized in Western culture since Aristotle analyzed Sophocles''
    tragic hero in Oedipus Rex. Their provenance is not an accident of cultural evolution.
    They are part of deep history, obedient to instinctive genetic biases acquired
    through evolution by natural selection. Some of their ultimate causes date back
    tens of thousands of years to a time when humans were spreading out from Africa
    to all the habitable globe. Others were forged in our distant animal ancestors,
    millions of years ago.


    Examples of archetypes risen from genetically based instinct can be found in the
    propensity of present-day humans to acquire unreasoning phobias against snakes,
    spiders, and other perils. It is also evidently displayed in the ideal habitat
    described by the savanna hypothesis, the open, elevated terrain next to a body
    of water. Both propensities have a demonstrable hereditary basis. In other words,
    they are instincts comparable to the wired habitat-seeking that drives all other
    organisms.


    It makes sense that narratives in literature and the dramatic arts tend to cluster
    into natural categories. The propensity is clearly delineated in cinema. Movies
    are art, and great movies are great art. If that much be granted, it is natural
    to ask which among them are the greatest, and more importantly, why? In 1999 Richard
    D. McCracken, an anthropologist and cinema expert, polled... (text cuts off)


    ## Archetypes in Movies


    ### THE HERO

    Usually, the hero overcomes obstacles to save the tribe.


    Examples:

    - *Alexander Nevsky (1938)*: A masterful battle against the invaders.

    - *Alien (1979)* and *Aliens (1986)*: Ripley, played by Sigourney Weaver, defeats
    the ultimate warrior.

    - *Bad Day at Black Rock (1955)*: The showdown between Gary Cooper and a gang
    of desperados.

    - *Casablanca (1942)*: Bogart makes a sacrifice for others.

    - *Fitzcarraldo (1982)*: The protagonist hauls a ship through the jungle.

    - *Gunga Din (1934)*: A hero rises among the common people to save his colonial
    masters.

    - *Henry V (1944)*: The king gives an inspiring speech at Agincourt.

    - *High Noon (1952)*: The electrifying duel between Henry Fonda and Charles Bronson.

    - *Once Upon a Time in the West (1969)*: Eastwood seeks revenge.

    - *The Last of the Mohicans (1992)*: Hawkeye protects the tribe amidst conflict.


    ### THE TRAGIC HERO

    A tribal leader, and sometimes the entire, possesses high status and power. Because
    of a fatal flaw, however, the leader fails and is destroyed. Throughout both prehistory
    and history, the mighty have thus risen high only to fall.


    Examples:

    - *The Caine Mutiny (1954)*: A naval captain follows protocol into insanity.

    - *Citizen Kane (1941)*: A searing indictment of overreaching material power.

    - *Gallipoli (1981)*: Tribe versus tribe (British invade Turkey).

    - *The Godfather (1972), I, II, and III*: Tracks power from power to degradation.

    - *Lawrence of Arabia (1962)*: A global hero watches his dream evaporate.

    - *Sunset Boulevard (1950)*: The tragic end of Norma Desmond’s brilliant career.


    ### THE MONSTER

    Prehuman and human ancestors lived constantly in fear of large predators that
    stalked and ate them. Venomous snakes across almost all of humanity’s geographical
    range are still able to kill.

