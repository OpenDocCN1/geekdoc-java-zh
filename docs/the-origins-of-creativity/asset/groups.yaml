    通往同情的大门，至少在人类中，正是我们视作怜悲之德的东西。


    共情与镜像显然已经进化到某种程度，这种程度与群体成员之间相互作用的平均时间相对应。时间测量显示这种相关性确实存在。自由漫步的草原狒类（Papio cyunculus）不到
    10% 的时间用于社交，而 60% 的时间用于觅食和进食。绿环矮猴（Cercopithecus aethiops）将 40% 的时间用于觅食和进食，在社交上花费的时间比狒类短。


    人类在社交上花费的时间比这些及其他旧世界灵长类多得多。尽管他们的时间表根据职业而存在巨大，但人们总是倾向于成群聚集，并在孤独的间隙进行社交交换。在发达世界，社交生活通过公共娱乐和社交媒体得到了几乎无止境的扩张。


    人类的群居性是导致我们产生高水平社会智能（特别是共情、镜像和问题解决）的达尔文式动力吗？是的，但群居性只是创造人类状况的进化过程的一部分。为了了解完整的故事，我们需要转向祖先人类到现代社会行为的独特起源，正如专家们所构建的那样。信号性事件是大脑尺寸急剧增加，主要涉及额叶。从大约三百万年前开始，我们前人类祖先的脑容量从接近黑猩的
    400 立方厘米（cc）增长到能人期的 600 cc，然后一百万后增长到我们直接祖先直立人（Homo erectus）的 900 cc，最后在智人（Homo
    sapiens）中达到了现代水平（约 1300 cc）。


    在自然选择的进化过程中，就像在日常生活中一样，微小事件可能产生巨大、甚至是巨大的后果。前人类进化中的微小事件似乎是从主要以植物素为主的饮食（果实、种子、软叶子）向含有更多肉类的饮食的转变。这种转变由于其发生的环境而变得更容易。非洲草原是一片广阔的草地，点缀着河岸森林和热带树木。由于开放平原上存在易于追踪的动物（对于那些知道方法的人来说），采集变得更加容易。频繁发生的雷火进一步起到了帮助作用，火灾困住并杀死了许多逃跑的动物。


    火还煮熟了部分受害者，提供了高能量、富含蛋白质和脂肪且易于咀嚼的食物。


    随着这种变化的发生，它使得整个胃肠系统（从口到肛门）必须发生改变。它还促使南方古人祖先变得更具社交性。食草的猿类和猴类倾向于独立寻找和发现，而我们的祖先则必要在出没时进行更紧密的合作。那时，当通过食腐或捕猎猎物发现大型食物块时，必须以一种避免潜在致命斗殴的方式进行分享。对大型动物的狩猎和食腐，与采集植物材料相反，需要一个集体的聚会点、洞穴，或两者兼有。


    最后，为了完成这种适应性转变（进化生物学家如是说），对火的控制加强了食肉主义的优势。从附近的地面火很容易获得肢体和树枝并将它们带回营地。我曾作为童军兵，在阿拉巴马州松树草原的一处熄灭的火堆旁这样做过。我发现，当营火不小心引发森林火灾时，反过来亦然：火可以被采集并带回营地。前人类实际上不需要使用易燃材料配合燧石或转轮来点火。


    专家们广泛认为，现代人类的能人祖先遵循了这种食肉的情景，并因此实现了脑容量和社交智能的激进进化。这一理论尚未得到定论性的证明，但得到了直立人（能人的后代，我们物种的直接祖先）营地遗迹和和控火化石证据的支持。


    现在让我们回到更深层次的遗传历史。大约六百万年前，一种居住在非洲草原的类人猿分成了两个物种。一条通向黑猩猩支系，注定以后再次分裂为两个现代物种：“普通”黑猩猩与其更像人类的表亲倭猩猩。另一支原始物种以及随后的多个人属，经历了南方古人物种的进化迷宫，产生了现代人类，即唯一的、注定走向末日的物种——智人（Homo
    sapiens）。


    由于黑猩猩与人类有密切的遗传关系——我们通过共同祖先共享 98% 的基因——科学家们一直在深入研究这些猿类，以发现它们可能揭示的秘密。（注：原文 OCR 文本此处存在大量重复，已根据要求进行对齐和清理）。


