    ## 人性


    人类状态——我们作为一个物种的本质、我们渴望变成的样子，以及我们幻想在肉体和梦想中能变成的样子——取决于四个层面的现象。第一层是感官输入的处理，如听觉、视觉和嗅觉；第二层是反射，以眨眼和自主神经系统为典型；第三层是旁语言符号，包括面部表情、手势和笑声。第四层也是最后一层是符号语言，这是将智人与其他生物绝对区分开来的能力。这四个层面在不同程度上都受到大脑情绪中心的影响。它们在潜意识大脑检查点枢纽的决策支配下，唤起记忆，并在意识中中形成未来的情景。所有这些过程的结果就是我们所说的“思考”。


    人类的感官感知高度倾向于视觉和听觉，而绝大多数其他生物则依赖化学信号。正如格式心理学研究者很久以前发现的那样，传入的感官信息往往以可预测的方式被扭曲和模糊。视觉异常包括鲁宾花瓶，这种图像的形状可以（在我们脑海中）从花瓶切换到一对相对的侧脸，然后在花瓶和人脸之间反复切换。当一个由六个面积相等的面组成的内克立方体被旋转和倾斜时，前方和后方的垂直边缘似乎快速且反复地交换位置。最令人幻觉且沮丧的是穆勒莱尔错觉，就像魔术一样，一个在线条末端开口的V形图形使线条看起来比另一个V形在末端关闭的相同线条更长。大脑努力去验证它被程序设定为否认的物理证据。


    ![](img/4f9a8e761ebbf74595dea645718a093a_80_0.png)


    视觉系统还有无数其他方式来应对现实世界的模糊性。大脑通过自动重新排列和简化其提供的信息来管理视觉输入的混乱。当实验室志愿者被要求画出他们之前记忆的图形时，他们创作的形状往往比他们经历过的更具概括性。特别是，他们改进了对称性，简化了图形，增强了划分，拉直了斜线，并孤立了不兼容的细节。


    反射构成了行为的第二层，是真正硬化的，与意识思维无关，除非是在后期的记忆中。喷喷嚏是一种反射，膝跳反射、不自主的眨眼、脸红、哈欠、唾液分泌也是。最复杂的反射是惊跳反应。想象在对方不知情的情况下从某人身后走近，几乎触碰到，并发出巨响（我不建议你真的尝试）。那个人会立即向前倾倒，低头，闭上眼睛并张嘴。惊跳反射的功能是防御。想象一个石器时代的猎人，在背后追踪并被捕食者（如豹子）攻击时，以整体放松的姿态向前翻滚回避。这种正确的决策和迅速的行动不需要任何意识思维即可。


    面部表情、姿态和身体动作构成了人性的第三层——旁语言信号，它们是有意识的并在某种程度上被所有文化共享。它们还被通用地作为口语言的替代或增强。在20世纪60年代经典的野外研究中，德国人类学家伊雷纽斯·艾布尔-埃贝尔斯费尔特（Irenäus
    Eibl-Ebesfeldt）详尽地证明，从原始前文字社会到现代城市化的所有社会的人都使用同样广泛的旁语言信号。这些信号包括表示各种恐惧、快乐、惊讶、恐怖和厌恶的面部表情。艾布尔-埃贝尔斯费尔特与受试者生活在一起，此外为了避免自我意识行为，他使用广角镜头拍摄他们的日常生活，从而让受试者认为相机指向了别处。他的总体结论是，旁语言信号是全人类共有的遗传特质。


    普遍或近普遍的固定动作模式包括表达遇到时愉快惊讶的“眉闪”：眼睛睁大，眉毛抬起，嘴角微笑。在儿童和某些女性身上，遇到时的害羞通过切断视觉接触来表达，通常用手捂住脸并转过头。家有幼儿的成年人会表现出嬉戏脸，通常包含嘲弄。男孩女孩之间的游戏不同于一种遗传特质，男孩倾向于通过模仿战斗（单打或结盟）来表达主导地位。


    新生儿用手脚抓握，并四肢着地寻找乳头。婴儿使用五感：接触、不悦、睡眠声（后者如果出现，则向母亲信号一切无事；如果没有，则说明出了问题）。婴儿吸奶时的吸水声也意味着一切良好，而它的缺失再次暗示了问题的存在。最后，剧烈哭泣强烈意味着饥饿、疼痛、不适或恐惧。


    所有这些信号和动作都是遗传性的硬连接，这一点在盲、聋、哑婴儿身上的表现中得到了支持。尽管这些婴儿没有之前的视觉或听觉经验，但他们会进行同样的适当微笑和哭泣，并用冷静表示中性的心理状态。此外，当被单独留下（没有触觉接触）时，他们会抓挠性哭和绝望表情。如果被打扰，他们会伸出手掌，一种驱逐的手势。


    随着对原始交流形式分析的进步，观察到的通用词汇丰富性也随之增加。一组包含了显示组内主导地位的姿态，以及最初实现这种地位的手段。事实证明它们与旧世界猴相似。斯坦福大学的社会心理学家德波拉·格鲁芬尔德（Deborah
    Gruenfeld）发现，当人们表现出以下特质时会感到更有力量——实际上也是如此：

    - 行为具有扩张性

    - 让手远离身体

    - 说话时保持眼神交流

    - 随意移开视线

    - 不要做任何解释

    - 占据你周围空间的主权，无论是会议室还是办公室隔间

    - 暗示他人，“这是我的桌子，这是我的房间，你们是观众。”


    实践主导地位的人睾酮水平较高，皮质醇水平较低。另一个遗传的、主导地位的标志是在高于下属的物理位置上休息——无论是在舞台、宝座、塔楼还是顶层。俯视他人，尤其是以一种放松的姿态。


