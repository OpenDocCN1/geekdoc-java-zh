    # I


    The humanities arose from symbolic language, a capacity that singly and dramatically
    distinguishes our species from all others. Coevolving with the structure of the
    brain, language freed the mind from the animal to be creative, thence to enter
    and imagine other worlds infinite in time and space. We were empowered but, as
    I will show in this first part, we retained the emotions of our ancient primate
    ancestors. The combination, composing what we roughly call the humanities, is
    why we are both superbly advanced, and supremely dangerous.'
  - '[PAGE 12]


    # 1


    # THE REACH OF CREATIVITY


    Creativity is the unique and defining trait of our species; and its ultimate goal,
    self-understanding: What we are, how we came to be, and what destiny, if any,
    will determine our future historical trajectory.


    What, then, is creativity? It is the innate quest for originality. The driving
    force is humanity’s instinctive love of novelty—the discovery of new entities
    and processes, the solving of old challenges and disclosure of new ones, the aesthetic
    surprise of unanticipated facts and theories, the pleasure of new faces, the thrill
    of new worlds. We judge creativity by the magnitude of the emotional response
    it evokes. We follow it inward, toward the greatest depths of our shared minds,
    and outward, to imagine reality across the universe. Goals achieved to further
    goals, and the quest never ends.


    The great branches of learning, science and the humanities, are complementary
    in our pursuit of creativity. They share the same roots of innovative endeavor.
    The realm of science is everything in the universe; the realm of the humanities
    is everything conceivable to the human mind.


    Drawing on the combined consciousness of our species, each one of us can go anywhere
    in the universe, seize any power, achieve any goal, search for infinity in space
    and time. Of course, it is also true that when ruled by wildmise and the animal
    passions we all share, our unbounded fantasy'
