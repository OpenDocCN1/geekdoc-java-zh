    of physical nature for metaphors. The sun, for example, represents enlightenment
    and wisdom; ice and snow, stillness, retreat, or death. The sea stands often for
    vastness, mother, birth, or mystery.'
  - '[PAGE 112]


    Metaphors are not intended to express the true nature of the entities that inspired
    them. Their meaning comes from the way a few of their traits affect our idiosyncratic
    human senses and emotion. In this perception, they are part instinctual and part
    learned, part genetic and part cultural. Predictable metaphors are woven together
    to create the archetypes of the creative arts. They are easily detected as stereotypical
    plots and characters in stories. They may be imprecise and even trite, but they
    are the bread and butter of literature and drama.'
  - '[PAGE 113]


    # 17


    # ARCHETYPES


    Whereas metaphors are the building blocks of language, archetypes form part of
    the common groundwork of human emotion. Archetypes, composed of universal stories
    and images, have been recognized in Western culture since Aristotle analyzed Sophocles''
    tragic hero in Oedipus Rex. Their provenance is not an accident of cultural evolution.
    They are part of deep history, obedient to instinctive genetic biases acquired
    through evolution by natural selection. Some of their ultimate causes date back
    tens of thousands of years to a time when humans were spreading out from Africa
    to all the habitable globe. Others were forged in our distant animal ancestors,
    millions of years ago.


    Examples of archetypes risen from genetically based instinct can be found in the
    propensity of present-day humans to acquire unreasoning phobias against snakes,
    spiders, and other perils. It is also evidently displayed in the ideal habitat
    described by the savanna hypothesis, the open, elevated terrain next to a body
    of water. Both propensities have a demonstrable hereditary basis. In other words,
    they are instincts comparable to thewired habitat-seeking that drives all other
    organisms.


    It makes sense that narratives in literature and the dramatic arts tend to cluster
    into natural categories. The propensity is clearly delineated in cinema. Movies
    are art, and great movies are great art. If that much be'
  - '[PAGE 114]


    granted, it is natural to ask which among them are the greatest, and more importantly,
    why? In 1999 Richard D. McCracken, an anthropologist and cinema expert, polled
    members of the Directors Guild of America for their opinions of the ten most distinguished
    movies and scenes of history to that date, and also the reasons for their choice.
    The directors were asked to evaluate as relevant the quality of their favored
    story in the originality of its content, the performance of the actors, the theme
    music, and photography. In drawing on McCracken''s analysis, and adding a few
    amateur but heartfelt opinions of my own, I have identified key archetypes I believe
    they variously illustrate. I''ve also speculated on the forces of natural selection
    that guided their genetic evolution.(Any errors made in grouping and interpretation
    are my responsibility.)


    # Archetypes in the Great Films


    THE HERO.

    Usually, but increasingly she, fights singly or else rallies others in the struggle
    against enemies of seemingly overwhelming power. A viscerally pleasing scenario
    that can be rationally interpreted as the instinctive product of endless prehuman
    and primitive human warfare.


    Examples:


    +   * Alexander Nevsky (1938). Destroyer of the Teutonic knights in an epic battle
    on the frozen Neva River.

    * Alien (1979) and Aliens (1986). Ripley, played by Sigourney Weaver, the ultimate
    female warrior, defeats some of the most terrifying aliens to invade a Hollywood
    set.

    * Bad Day at Black Rock (1955). One-armed War II veteran thrashes a racist bully.

    * Billy Jack (1971). Indian martial arts expert whips a whole group of racist
    bullies.

    * Casablanca (1942). In the end, a noble character shines through Bogart''s bluster
    and cynicism.

    * Fitzcarraldo (1982). With great effort, the protagonist, helped by a native
    tribe, overcomes the supreme difficulty of hauling a large ship out of one Amazonian
    river over a foothill ridge and into another.'
  - '[PAGE 115]


    Gunga Din (1934). In India, a hero improbably rises from among the common people
    to save his colonial masters.


    Henry V (1944). At the Battle of Agincourt, the king’s superbly inspiring speech
    is followed by victory over the better-armed French.

    High Noon (1952). The showdown between Gary Cooper’s character and a gang of desperados
    bent on revenge is widely considered the best of its kind, although I prefer the
    electrifying final duel between Henry Fonda’s assassin and Charles Bronson’s avenger
    in Once Upon a Time in the West (1969).


    The Last of the Mohicans (1992). Tribe versus tribe, then both versus a third
    tribe, with Hawkeye the noble savage.


    # THE TRAGIC HERO.


    A tribal leader, and sometimes the entire, possesses high status and power. Because
    of a fatal flaw, however, the leader fails and is destroyed. Throughout both prehistory
    and history, the mighty have thus risen high only to fall.


    Examples:


    +   The Caine Mutiny (1954). A naval captain rigidly follows protocol into insanity,
    met finally with revolt by his crew.


    +   Citizen Kane (1941). A searing indictment of overreaching material power.


    +   Gallipoli (1981). Tribe versus tribe (British invade Turkey); a perfect expression
    of the fluidity of modern war.


    +   The Godfather (1972), I, II, and III (1972, 1974, 1990). The greatest crime
    series in movie history tracks tribalism from power to greater power, thence to
    betrayal, degradation, and death.


    +   Lawrence of Arabia (1962). A global hero watches his dream evaporate at the
    hands of the diplomatic leaders of his own, European tribe.


    +   Sunset Boulevard (1950). Drama, ego, and insanity at the end of Norma Desmond’s
    brilliant career.


    # THE MONSTER.


    Prehuman and human ancestors lived constantly in fear of large predators that
    stalked and ate them. Venomous snakes across almost all of humanity’s geographical
    range are still able to kill.


