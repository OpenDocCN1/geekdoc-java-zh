    Individual chimpanzees, the scientists have found, know other group members thoroughly.
    They behave according to their own rank and relationship among the groupmates.
    They have surprisingly high IQs. They can learn sequences of numbers, for example
    “64136 . . .” faster and retain them better than humans. Because free-ranging
    chimps spend half their time in trees, this ability may be an adaptation for quick
    recall and assessment of limbs and trunks, and the best sequence that can support
    the chimps'' weight. Their arithmetic must also have been useful in following
    worm paths along the ground in an environment crowded with large predators. Lions,
    Crocodiles, and, above all, deadly tree-climbing leopards—each masters of ambush
    with their own techniques—lay almost everywhere hidden and waiting.


    Yet, although highly intelligent in at least one aspect, chimps score far below
    humans in others. They live in the here and now. They cannot plan their actions
    for the next day, whereas humans can construct thousands of years into the future
    and millions of miles into space. When supplied with paint and brush, chimps can
    draw pictures, but not as well as humans of any age beyond. For example, chimps
    can spontaneously draw the outline of a face, but not details within it, a feat
    any young human performs effortlessly.


    Chimpanzees also fall short in the ability to cooperate or act altruistically.
