    # 3


    # LANGUAGE


    The Ju/''hoansi are fully human. They have a history they carry in their heads.
    They know who they are. Their massive forebrain is balanced unsafely on the slender
    vertical neck as in any city-dwelling citizen. Their species—our species—is uniquely
    endowed with language, the greatest evolutionary advantage since the eukaryotic
    cell.


    A very few animal species have rudimentary culture. A local troop of Japanese
    macaques have learned, from the example an innovative female in their midst provided,
    how to clean sweet potatoes by washing them in water. Equally impressive, members
    of at least one chimpanzee troop use stems stripped of leaves to fish for termite
    soldiers, the suicidally aggressive insect fighters I mentioned earlier that bite
    and hold on any invader of their nest. Members of a second group of chimpanzees
    have learned from one another how to swim and dive or otherwise move through water.
    These are among the very rare examples of true cultures—behavior invented by individuals
    and groups and passed on by the social learning of others. No animal species,
    at least none out of the more than one million known, has a language. What then
    is language—what exactly? Linguists define it as the highest form of communication,
    an endless combination of words translatable into symbols, and (this is the important
    part) arbitrarily'
  - '[PAGE 26]


    chosen to confer meaning. They are used to label any conceivable entity, process,
    or one or more attributes that define entity and process.


    Each society has one or more languages. At the present time there exist about
    sixty-five hundred languages, of which two thousand are descending in use and
    in danger of extinction. A few are spoken by no more than a dozen survivors.


    Language is necessary for human existence, but in a way wholly different from
    the service of our spine, heart, and lungs. It is the basis of society, from the
    simplest to most complex. By inquiry and knowledge made possible, our minds are
    able to travel lightning-fast through space and time, and with increasing scientific
    precision, visit any place on the planet, and beyond. By any measures of liberation
    and empowerment, language is not just a creation of humanity, it is humanity.


    Language in the Ju/''hoanshi and Manhattan alike is the substance of intelligent
    thought. It recounts epodes of the past and those imaginable into the future—among
    choices made constitute constitution and we call free will. The mind as experiences
    and constructs stories from them. It never pauses. It evolves continuously. As
    old stories fade with time, new ones are laid upon them. At the highest level
    of creativity, all human beings talk and sing and tell them.


    If language is universal, is it cultural or instinctive? Many independent studies
    of child development have demonstrated that language is both. That is to say,
    language is globally the same as the form in which its capacity began. In the
    vocabulary acquired, on the other hand, speech is almost completely learned, hence
    varies drastically from one culture to another. Yet, among the culturally advanced
    societies, the use of emotional coloring by melody and rhythm has remained the
    same. (For an example of the latter, Let me explain, please. Let me explain, please.
    Let me explain, please. Let me explain, please.)


    Grammatical rules, on the other hand, are mostly learned. The theory of a universal
    grammar, famously advanced by Noam Chomsky in the twentieth century, was so complex
    and jargonized as to escape the indignity of being understood, and has in recent
    years been largely abandoned for lack of evidence by researchers on linguistic
    psychology.


    The acquisition of language unfolds like any instinct as a predictable series
    of steps. The key early formative stage of its ontogeny is the babbling of infants.
    Even newborns are as twelve as hours from the womb to'
  - '[PAGE 27]


    spoken words but not to other kinds of sounds equally loud. The infantile sounds
    they subsequently produce are not taught to them arise autonomously. Even blind
    and deaf children babble in the absence of external audiovisual stimulation. A
    few primal words, including *mama* and *papa*, serve as innate attractants for
    adults, who respond with attention and love.


    In adult speech, each of the words may be peculiar to the language spoken, hence
    cultural in origin, tone and emotion have remained hardwired and universal during
    genetic evolution. People are able to listen to texts in unfamiliar languages
    yet comprehend the mood of the speaker, a conclusion supported by common experience
    but also by experimental evidence. In one notable case, psychologists were able
    to tease out the effect with the use of dramatic stages performances. The experiment,
    reported by Ireneäus Eib-Eiselsfeldt, a pioneer researcher of human instinct,
    deserves to be quoted in:


    +   K. Sedlaček and Y. Sychro had the stated Tož už má ustané (“The bed is already
    made”) from Leo Janič’s *Diary of One Who Vanished* interpreted by 23 different
    actresses. In these the gypsy Zelfka seduces the village boy Janíček, whereby
