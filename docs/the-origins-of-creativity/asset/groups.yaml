    exquisitely well designed. In some species, the nests are air-conditioned by elaborate
    systems of ducts that continuously circulate air from the surrounding ground and
    used air by heat convection, from the amassed inhabitants and out of the mound.
    Each macrotermite colony contains a proletariat of sterile workers and their two
    parents, a royal pair responsible for all reproduction. How is this possible?
    The massive queen, the size of your two thumbs, lays a continuous stream of tiny
