    compete or to cooperate. The informed interplay between competition and cooperation
    is the flywheel of a successful social organization.


    Social primates, from langurs and macaques at the low end to chimpanzees and bonobos
    at the high end, have brains large enough to perceive the mood and likely response
    of a groupmate to a variety of situations. A member of such a well-organized society
