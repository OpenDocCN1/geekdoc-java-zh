    \ very diverse. They are individually rare, and in the great majority of cases\
    \ either harmful (hence the hundreds of unhappy familiar hereditary disorders\
    \ such as color blindness, cystic fibrosis, and hemophilia) or neutral, having\
    \ no detectable effect on health or reproduction. In time they disappear or remain\
