    especially caught my eye: several little insects vaguely resembling termites,
    similarly white and elongated, but smaller in size, more delicate, with faster
    and more erratic movements as they, too, edged back toward shelter.


    I collected several live specimens and took them back to my laboratory space in
    Josiah Nutt Hall to examine under a microscope. They were, quickly learned, a
    species of the genus Zorotypus, an insect so distinctive in anatomy as to deserve
    placement in an entire insect order of its own, called the Zoroptera, equal in
    rank within zoological classification to all the flies (Order Diptera), as well
    as all the beetles (Order Coleoptera), and all of the moths and butterflies (Order
    Lepidoptera).


    They are also, learned, among the racers of insects, the first having been discovered
    only in 1918. Since that time zoropterans have picked up the common name "angel
    insects." They fully deserve the appellation. They are like little lambs racing
    about, white and pure (the Greek zor means "pure"), harmless, and vulnerable to
    the sharp-jawed predators around, feeding on fungus spores as we would eat freshly
    picked mushrooms.


    It occurred to me then that one reason zoropterans had remained hidden for so
    long might be they are specialized to live only in the particular microenvironment
    in which I had by good luck found. That guess proved correct. I soon easily turning
    my little angel insects as I tore apart the pine logs chosen to be exactly the
    right degree of decomposition. A rotting log proved to be the zoropter search
    image everywhere I looked. I soon published of my first scientific articles, "The
    Zoroptera of Alabama." The report was read, because some other entomologists were
    having a kind of sport finding them across much of the eastern American landscape.
    Might I find zoropterans elsewhere? Yes! Later, in postdoctoral research at Harvard,
    I casually located the first known zoropterans from Caledonia and New Guinea in
