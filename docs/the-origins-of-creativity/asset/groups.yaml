    通常由一到三位贡献者完成。1953年在《自然》杂志上，詹姆斯·D·沃森和弗朗西斯·克里克发表了首次描述DNA结构的历史性论文，那是当时独立工作或在极小团队工作的科学家们的典型机会。今天，更大的团队已成为常态。一篇文章由几十位合著者领导并不罕见。在某些领域，例如描述一个重要物种的完整DNA，其人数可能会超过一百。


    20世纪的50年代和60年代是现代生物学的英雄时代，当时少数受瞩目的冠军在极度困难的情况下取得了令人印象深刻的进展。他们激发的兴奋情绪反映在流行文化中。在1953年电影《世界世界》（The
    World World）的原版中，一艘包裹在巨大陨石中的外星飞船刚刚击中地球——当然是南加利福尼亚。当当地人聚集在中心周围，好奇这意味着什么时，安·罗宾逊（Ann
    Robinson）的角色——一位在50年代广受欢迎的带有不可抑制的女性化甜美的年轻小学教师，对吉恩·巴里（Gene Barry）的角色（一位访客）说：“有一个来自太平洋理工学院的科学家过来。他会告诉我们，如果今天重复这一场景，台词将会是：‘信息来自美国航空航天局（NASA）和加州理工学院。他们将试图弄清楚发生了什么’”


    仅仅在人文科学领域，必要的专业化已将生物学家和其他科学家推向日益狭小的领域。一个学科的大部分先进技术和术语，只有其他学科的专家（即使是那些密切相关的学科专家）才能最好地理解。


    未来还会有智力的英雄时代吗？我确信会有，特别是在那些将科学发现与人文的创新和洞察相结合的新型交叉学科中。它将以多维的形式出现。在我们感官泡泡之外，创意艺术有着无数愿景。挑战在于如何将此前未被察觉的事物翻译成人类意识有限的视听世界。这种进步也将源于对人类意识生物学起源日益清晰的认知，这可以使历史与历史达成一致。最后，进步将随着对塑造文化的演化熔炉的理解而来——文化是从动物本能中缓慢且往往伴随着痛苦地塑造而成的。


    人类自我理解的“哲者之石”是生物演化与文化演化之间的关系。人类为什么被这样构造并以这样行为，而不是其他方式？直到现在，在雅典广场（agora）两半世纪之后，我们才开始理解为什么我们的某些社会行为是天设的本能，某些是通过遗传倾向性学习获得的，而另一部分则是文化发明的产物。这整体只有被视为我们长期演化中的一个阶段，才能被深刻理解，而不仅仅通过对当代人类状况的描述。


    同时，需要承认并更坦诚地讨论的是，对于哲学而言，“房间里的大象”（不可回避的问题）是组织化宗教。更准确地说，科学与宗教融合所预言的人类状况的理解，往往受到超自然创世故事的干预，每种故事都定义了一个独立的部落。持有并分享宗教高尚的精神价值（相信神性和死后世的存）是一回事；采纳一个特定的超自然创世故事完全是另一回事。对创世故事的信仰提供了部落中令人慰藉的成员身份。但必须强调的是，并非所有创世故事都是真实的，没有人可能是真的，而且无疑，所有的都是假的。每一个故事都由盲目的唯物主义信仰所维持。


    宗教研究是人文科学不可或缺的一部分。尽管如此，它应该被视为人性及其演化的元素来研究，而不是像基督教圣经学院和伊斯兰经堂学校（madrasas）那样，作为推广由特定创世故事定义的信仰的手册。


    与此同时，由于人类在数字化的全球中仍被动物本能所驱动，由于我们在现状与渴望成为的样子之间挣扎，以及由于我们淹没在信息中却渴求智慧，似乎让哲学回归它曾经受推崇的地位是恰当的，这一次作为人文科学和科学人文的核心。


    这种复兴能完成多少？值得记住，哲学在西方文明中曾在两个各持续约150年的创造力浪潮中繁荣过。安东尼·戈特布利（Anthony Gottlieb）在《启蒙之梦》（The
    Dream of Enlightenment，一部关于现代哲学兴起的历史）中曾简洁地描述了它们的本质。


    第一次是苏格拉底、柏拉图和亚里士多德的雅典，从公元前5世纪中期到公元前4世纪末。第二次是在北欧，在欧洲宗教战争之后。它从17世纪30年代一直延伸到18世纪法国大革命前夕。笛卡尔、斯宾诺莎、洛克、莱布尼茨、休谟、卢梭和伏尔泰——即最著名的哲学家们——留下了他们的印记。


    第二次[启蒙]在科学未能满足其宏大预期时已大多褪色。今天，所谓的当代哲学不是作者逻辑，而是不连贯，由于对科学的关注不足。这很奇怪，因为我们处于一个可以合理被称为科学时代，而科学正处于能够与人文相结合以重新点燃早期的启蒙运动。我相信，我们在共同探究中相遇，可以解决这些大问题。是时候再次公正且比以往任何时候都更有心地去提问历史的大问题了。在基础上，我们需要更深入地探索人性的意义，为什么我们存在而不是从未存在。此外，为什么在此之前没有任何与我们相似的东西存在。我们寻找的圣杯是意识的本质，以及它是如何起源的。最根本的是生命整体的起源和繁衍。


    在更窄的聚焦上，我们该如何解释两种性别的存在——考虑到今天承认的性取向范围，甚至是更多？为什么最初会有性？如果我们能通过孤雌生殖，或者直接从身体中产生后代，生活将变得简单得多。这些不是闲散的问题，留给沙龙人士和晚宴宾客的。它们不是智游戏，不是逻辑技巧的练习。它们关乎切的生死。


    我们不仅要问“如何”，还要问“为什么”，我们被基因设定的增长和衰老时间表所固定。现在，当我们发现自己处于人工智能时代，我们被迫精确地定义什么是人类。是否可以从货架上取下的化学物质制造一个，至少达到具有指定基因组的受精卵水平？如果被证明是不可能的（我对此怀疑），我们需要认真讨论拥有情感甚至创造力的人形机器人。

