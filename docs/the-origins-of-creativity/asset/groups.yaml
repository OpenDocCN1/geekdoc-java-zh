    possessing free hands and greater intelligence, likely learned to bring fire to
    the site, keep it alive and controlled.


    This theoretical reconstruction has gained traction from fossil remains and the
    lifestyles of contemporary hunter-gatherers. Meat from larger prey was shared,
    as it is by wolves, African dogs, and lions. Given, in addition, the relatively
    high degree of intelligence possessed by large ground-dwelling primates in general,
    the stage was then set in prehuman evolution for an unprecedented degree of cooperation
    and division of labor. These traits were also favored by heightened competition
    in social skills among group members, leading to natural selection at the individual
    level, and increasingly enhanced by competition between groups. Natural selection
    at the group level especially favored altruism and cooperation.


    The result that logically follows from these processes is a positive reinforcement
    between cultural evolution and genetic evolution. Each, alone, could be expected
    to increase the rate of brain growth. Together, the two would experience mutual
    reinforcement. There followed exponential growth of the brain, from the habelines
    to the neanderthals and modern humans—slow at first, then faster and faster until
    a limit was reached due to the counterbalance created by physical limits on the
    relative size of the cranium. A simple anatomical circumstance finally lowered
    and halted the advance of human genius. The whole human organism was not designed,
    especially during the long era of stone knapping and spear throwing, to support
    an infinitely more massive bobble head on an increasingly slender neck behind
    what attained by the primitive races of Homo sapiens. It stood about three hundred
    thousand years ago with the best that could be done.


    The occurrence of gene-culture coevolution is fundamental to the unity of science
    and the humanities. Consider, as an example, the process of aging. Why must we
    die? More generally, why does each species in turn, ours included and each hereditary
    strain within each species, of which humanity possesses a characteristic lifespan?
    If you seek a long-lived dog as a companion, as opposed to a sheep herder or wild-board
    hunter, you would be better off with a Chihuahua (lifespan twenty years) than
    with a Great Dane (lifespan six years). Plants also have programmed lifespans.
    Some northern conifers live on average about a century, magnolias a century-and-a-half,
    and sequoias and pines of the Southwestern United States for as long as several
    millennia. But they, too, age'
  - '[PAGE 78]


    eventually. What could be more important to both science and the humanities than
    the human life cycle and preordained human life-spans The prevailing theory in
    evolutionary biology to explain programmed aging and death recognizes that each
    species of plant and animal has evolved a lifestyle in which most individuals
    died from external causes—disease, accident, congenital defect, malnutrition,
    murder, war—well short of their maximum potential longevity. Such was severely
    the rule in Paleolithic times, when few people reached an age of fifty years.
    As a result of this idiosyncratic pre-longevity death rate, which is improved
    but still applies to most humans today, natural selection has front-loaded vigor
    and reproductive death. It has programmed the vital physiology and mental state
    of youth in the youngest ages, while disfavoring older adults. It has bet, to
    speak, against investment in middle and old age.


    With the dawn of Neolithic civilization, and advent of agriculture and food storage,
    along with an easing of eternal mortality, conditions changed in a way that redirects
    natural selection along the human life cycle. Thanks to the weakening of Paleolithic
    mortality factors through cultural evolution, average longevity is increasing
    and the age of reproduction expanding up to the age of menopause.


    One inevitable result in in future generations may be an overall population-level
    hereditary shift and not just an extension of youthfulness and fertility into
    middle age. The onset of menopause will be pushed back. The impact on both cultural
    evolution and heredity will increase accordingly.


    Gene-culture coevolution probably played a critical role throughout human history.
    The coevolution follows a constant repetitive cycle. Language and technology edged
    forward, with the Darwinian gains favoring hereditary lines best to use them.


    In fact, it is possible, I believe even likely, that the habiline revolution—the
    giant step toward the human condition—was fueled by gene-culture coevolution.
    During this period of the earliest Homo, culture would have created very little
    technological innovation. If it did, the Neolithic revolution would have come
    much earlier than the case, and no stone-age hunter-gatherer societies would have
    survived to the present time. On the other hand, logic and the accumulated evidence
    point to gene-culture coevolution as a powerful force in the origin of early oral
    language, along with complex social behavior featuring higher levels of empathy
    and cooperation.'
