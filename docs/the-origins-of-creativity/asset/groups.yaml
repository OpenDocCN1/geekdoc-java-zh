  - '[PAGE 70]


    “living fossils.” Familiar examples with traits two hundred million years old
    or older include horseshoe crabs, dragonflies, beetles, and cycads.


    In the elementary theory of evolution by natural selection, the unit of heredity
    that mutates the gene, and the target of natural selection by the environment
    is the trait prescribed by the gene. The distinction might be made more memorable
    with the aid of Hollywood science fiction horror movies: the monstrous mutant
    of insects and crocodiles that escape from secret government laboratories cause
    local mayhem, but they have no chance to reproduce and spread in Darwinian competition
    with their normal progenitors. So we we hope.


    There has unnecessary confusion, especially by popular writers on evolution, between
    individual-level selection and group-level selection. The problem arises from
    an erroneous distinction between the unit of heredity and the target of selection.
    The problem is simply resolved when referred to the well-developed discipline
    of population genetics, as follows: Individual-level selection acts on the traits
    that affect a group member’s survival and reproduction, apart from its interaction
    with other members of its group. Individual selection predominates in the early
    stages of social evolution, when many of the hereditary traits affect the success
    of the individual independently of its groupmates. The individual may, live alone
    during part of its life cycle. Among its groupmates, it may take larger shares
    of food and space for itself and for its offspring.


    Group-level selection affects the traits that are interactive with groupmates,
    so that the success of an individual’s genes depends at least partially on the
    society to which the individual belongs. In the most advanced social organizations,
    characterized by a sterile worker caste and illustrated by siphonophores, which
    resemble jellyfish, as well as ants, bees, wasps, and termites, group selection
    almost entirely overrides individual selection.


    So, where does humanity fit in the spectrum of individual-to-group selection?
    We are located near the center. As a consequence, human nature is driven by conflict
    between individual selection, which promotes selfishness on the part of individuals
    and their immediate families, and group selection, which promotes altruism and
    cooperation in service to the larger society. This admixture in levels of selection,
    forged in an arena of instinct and reason, is part of what makes humanity.'
  - '[PAGE 71]


    The role of group selection in social evolution is consistent with the proven
    fundamentals of population genetics. Its occurrence throughout the animal kingdom
    is supported by massive evidence from the field and laboratory. It has nevertheless
    been challenged by an alternative explanation of social evolution called inclusive
    fitness theory. In essence, the theory says that social behavior evolves in accordance
    with the degrees of kinship among members of the group. The closer their kinship,
    the more likely the group members will share their resources and cooperate in
    labor. The price for each of the group members in survival and reproduction is
    compensated by the increase of genes identical to its own shared with others in
    the group by kinship. If you sacrifice your life for your extended family, it
    matters more than if they are only distantly related or not at all. More of your
    bravery genes will persist in the population if you make the sacrifice for close
    relatives.


    At first thought, this concept of kin selection, extended beyond nepotism to cooperation
    and altruism within an entire group, appears to have considerable merit. I said
    so when I first synthesized the discipline of sociobiology in the 1960s and early
    1970s. It is deeply flawed. In spite of the excited attention at first given to
    it, no one has ever succeeded in measuring “inclusive fitness,” as its core property
    is called. To succeed, not would it be necessary to determine pairwise kinship
    throughout the group, but also to assess reciprocal gains and losses in fitness
    through time. Beside the technical difficulty, the equations offered to conduct
    the overall analysis have proven mathematically incorrect. There is a basic reason
    for this mistake. The perusal of inclusive fitness theory, the individual group
    member, not the gene, was the unit of selection. Inclusive fitness means how well
    the individual does in its relation to every groupmate, discounted by the percentage
    of the shared appropriate genes, through its entire reproductive life. However
    outwardly attractive, there exists no evidence of such a process, or any need
    for it to explain the origin of advanced social behavior.


    I''ve come down strongly on this issue, knowing well that a proper scientist is
    supposed to express some degree of uncertainty and speak in terms of probability.
    But there is a need to cut through the confusion caused by the dwindling corps
    who support the inclusive fitness theory, and place less emphasis on the theoretically
    grounded and documented process of group selection.'
  - '[PAGE 72]


    Why does this disagreement matter? It is impossible to overestimate the importance
    of group selection to both science and the humanities, and further, to the foundation
    of moral and political reasoning. This is a subject we need to get clear and straight.


    As Darwin first observed in The Descent of Man (forgive me an appeal to authority),
    competition among humans has been a major contributor to traits universally considered
    noble, that is, manifesting generosity, bravery, self-sacrificing patriotism,
    justice, and wise leadership. To explain these qualities with individual selection
    alone, it is necessary to take a thoroughly cynical view of humanity, based on
    selfish genes and the convoluted methods of deception and manipulation they prescribe.
    Common sense tells us there is something ruling humanity that is a great deal
    better. We admire the band of brothers in battle, the fireman who risks all, the
    anonymous philanthropist, the emblatt teacher in Appalachia. Heroes are real and
    all around us. Their good deeds are the safety net of civilization.


    Because of group selection, and its obvious consequences in the evolution of human
    social behavior, there is reason to suppose that the better angels of our nature
    are not drilled into us under the threat of divine retribution, but are instead
    biologically inherited. We are by a fortuitous consequence of the fundamental
    principles of natural selection far more than trained savages.


    It is equally the case that the the love of nature, leading to the floras and
    faunas within the wildlands, comes easily to people everywhere, even those whose
    entire lives have been spent in cities. It would be a mistake to justify parks
    and reserves primarily as economic assets, or as outdoor health clinics. Wildlife
    conservation stands on a moral foundation independent and sufficient unto itself.


    The origin of morals or lack thereof is suggested by the fable of the scorpion
    and the frog, ancient in origin. A scorpion wishes to cross a stream, but cannot
    swim, and asks the frog for a ride. The frog demurs, saying the scorpion might
    sting and kill it. The scorpion argues that would not happen, because both of
    them would be killed. They start off, and at midstream the scorpion stings the
    frog. As they sink, the frog asks the scorpion how it could such a terrible thing.
    The scorpion replies, "Because it is my nature."'
