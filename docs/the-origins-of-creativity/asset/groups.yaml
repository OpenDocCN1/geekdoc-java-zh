  - '[PAGE 43]


    # II


    The humanities, particularly the creative arts and philosophy, continue to lose
    esteem and support relative to the sciences for two primary reasons. First, their
    leaders have kept stubbornly within the narrow audiovisual bubble we inherited
    happenstance from our prehuman ancestors. Second, they have paid scant attention
    to the reasons why (and not just how) our thinking species acquired its distinctive
    traits. Thus, unaware of most of the world around us, and shorn of their roots,
    the humanities remain needlessly static.'
  - '[PAGE 44]


    # 6

    LIMITATIONS OF THE HUMANITIES


    Until a better picture can be drawn of prehistory, and by that means the evolutionary
    steps that led to present-day human nature can be clarified, the humanities will
    remain rootless. Human nature, the centerpiece, is not the genes that prescribe
    it. Nor is it just the traits of culture most widespread in present-day human
    populations. It is the hereditary propensity to learn certain forms of behavior
    and to avoid others—what psychologists call "prepared learning" versus "counter-prepared
    learning." Among many examples of prepared learning that have been thoroughly
    documented, infants pick up language obsessively, and as older children they are
    prone to play in ways that imitate adult behavior. We are counterprepared, on
    the other hand, to trust strangers or enter unknown dark forests, and we form
    a lifetime dread of snakes and spiders by as little as a single frightening encounter.


    During the biological evolution of our species, the origin of language evidently
    preceded music, and music visual art. Is that timeline correct, and, if so, what
    are the implications? How thereby are the emotions stirred by literature, music,
    and art related to one another? From studies on evolutionary change in, and other
    species, we know that intermediate stages, the “links” of evolution, often produce
    mosaics. That is to say, some traits are advanced, others have reached an'
  - '[PAGE 45]


    intermediate state, and still others have changed scarcely if all. When, for example,
    in 1968 I examined the first discovered primitive of Mesozoic age, preserved in
    amber ninety million years old, I found it to have been in the middle of major
    mosaic evolution. This “missing link” between ancestral wasps and modern ants
    had wasp mandibles, an ant waist, and antennae between the ancestral wasp and
    descendant ants. I gave it the scientific name Sphecomyrma (“wasp ant”).


    To what level did humans evolve these and other capabilities at the time of the
    breakout from Africa and spread around the world? And why did they evolve? The
    full meaning of the humanities will not come from STEM (science, technology, engineering,
    mathematics). It will come from a combination of many less vaunted disciplines,
    of which the most important are the Big Five: paleontology, anthropology, psychology,
    evolutionary biology, and neurobiology. These fields of research are the friendly
    ground of science, where the humanities will find full and ready alliances. They
    will encounter some of the same in astrophysics and planetology also, but chiefly
    mega-threats for the player of human emotion, because they have no way to explain
    its meaning.


    The main shortcoming of humanistic scholarship is its extreme anthropocentrism.
    Nothing, it matters in the creative arts and critical humanistic analyses except
    as it can be expressed as a perspective of present-day literate cultures. Everything
    tends to be weighed by its immediate impact on people. Meaning is drawn from that
    which is valued exclusively in human terms. The most important consequence is
    that we are left with little to compare with the rest of life. The deficit shrinks
    the ground on which we can understand and judge ourselves.


    History, conceived in the conventional sense, is a product of cultural evolution.
    Historians are scholars who tease apart the proximate causes of cultural evolution—in
    trade, migration, economics, ideology, war, leadership, and fashion. They have
    successfully taken us back to the dawn of the Neolithic, when agriculture was
    invented and food surpluses and villages added, these chiefdoms, paramount chiefdoms,
    nations, and empires. All this change together, we understand, drive the cultural
    evolution that created the modern world. But history truncated incomplete without
    prehistory, and prehistory falls short without biology. The Neolithic revolution
    began only long enough ago, about ten thousand years, to produce a few changes
    in small ensembles of genes among the'
- md: '

    newly settled populations. That amount of time is way too little to explain the
    hereditary and environmental origin of human nature itself. As populations spread
    around the world, they carried intact the basic genome prescribing human intelligence
    and the fundamentals of human social behavior.


    Sixty thousand years to ten thousand years before the present—the approximate
    time span of global settlement by humanity—is the equivalent of, very roughly,
    five hundred generations. That is still not enough to account for the origin of
    those traits that hold us together as a single species, including our bizarre
    hairiness and bipedal bodies, our globular skull crammed with an oversized brain,
    our apish emotions. Then, of great consequence, there was the common instinct
    to generate languages composed of arbitrary sounds and meanings. Also, there was
    the shared capacity to practice creative arts, as well as explore and innovate
    control of the environment, and invent creation myths that reinforce tribal regions.


    I think it fortunate that five hundred generations proved too short a time for
    our human species to split into multiple species, each reproductively isolated
    from the other, not hybridizing but with each generation diverging further apart.
    Such multiplication had been common in our older, prehuman ancestors. The moral
    and political problems presented would have been insoluble. The extermination
    of all but one could worked, which is how our species (Homo sapiens) evidently
    dealt with our sister species, the Neanderthals (Homo neanderthalensis).


    Human beings are not only weak in grasping but nearly unconscious of what is going
    around them in present time. In our daily lives we imagine ourselves to be aware
    of everything in the immediate environment. In fact, we sense fewer than one thousand
    of one percent of the diversity of molecules and energy waves that constantly
    sweep around and through us. The part perceived is just enough to safeguard our
    personal survival and reproduction, and for the most part appropriate for the
    stresses endured by our Paleolithic ancestors. This is the way that evolution
    by natural selection works. We are the product of a force that is both powerful
    and maximally parsimonious.


    Biologists use the German word Umwelt (roughly, "the world around us") to denote
    that part of the environment we are able to perceive by our unaided senses. The
    Umwelt was all our prehuman ancestors needed for millions of years to deal with
    the African savanna environment, but it was enough. We survived, while other hominin
    species related to us, but with different perceptions and bad luck, did not. The
    same is true of condors patrolling the Andes, with telescopic vision and a keen
    sense of smell; of hagfish above the abyssal benthos, forever lost in midnight
    darkness, but geniuses at detecting faint traces of rotting flesh; or agelenid
    spiders, crouched far back in their funnel-shaped nests, alert to the slightest
    tug on a silken thread that betrays the passage of an insect prey.


    What then is the human Umwelt, and how did it come to be, and why? These are among
    the central questions of science and the humanities. A quick answer to the first
    part is that our species, having evolved as bright children of the African savannah,
    is adequate in several sensory modalities, weak in most, and a complete blank
    in others.


    We are primarily audiovisual, one of the few animals on the planet, with birds
    and a smattering of insects and other invertebrates, that depend on sight and
    sound to find their way. In vision, however, the only particle to which we respond
    is the photon. Still more restrictive, our photoreceptors detect no more than
    razor-thin slices of the electromagnetic spectrum. Our vision begins at the low-frequency
    end with red (and not even earlier to infrared) and ends short of ultraviolet
    at the high-frequency end. If we had a better set of colors and shades of colors
    for us to behold and name. If we potentially have a vast spread of colors and
    could add the vision of hawks and butterflies, the impact on the visual arts would
    be revolutionary.


    And sound? It is essential to our communication, but by comparison with the auditory
    journeys of the animal world, we are close to deaf. Bats of many species swoop
    and spin through the air and pluck-flying insects with almost unimaginable precision.
    Even more impressively, the bats don’t rely on sounds from the insects: they make
    high-frequency sounds of their own and locate the prey by the echoes that bounce
    back to them. Some kinds of moths are equipped with ears tuned to the bat emission
    frequency, and they are programmed to drop to the ground the instant they hear
    the clicking of bat echolocation. Other bats detect ripples on the surface of
    the water and snare fish by raking their claws through the water. Vampire bats
    of South America smell their prey—including humans who forget to close the windows—make
    small slices through the skin, and lap up the blood trickling out. (Perhaps the
    time has come to write)


