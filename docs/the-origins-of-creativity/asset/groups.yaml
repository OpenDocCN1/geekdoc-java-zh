    # I


    The humanities arose from symbolic language, a capacity that singly and dramatically
    distinguishes our species from all others. Coevolving with the structure of the
    brain, language freed the mind to be creative, thence to imagine other worlds
    infinite in time and space. We were empowered but, as I will show in this first
    part, retained the emotions of ancient ancestors. The combination, composing what
    we roughly call the humanities, is why we are both superbly advanced and dangerous.


    ## THE REACH OF CREATIVITY


    Creativity is the unique trait of our species and its ultimate goal: What we are,
    how we came to be, and what destiny, if any, will determine our future. What,
    then, is creativity? It is the innate quest for originality. The driving force
    is humanity’s instinctive love of novelty—the discovery of new entities and processes,
    the solving of old challenges and disclosure of new ones, the aesthetic surprise
    of unanticipated facts, the thrill of new worlds. We judge creativity by the magnitude
    of the emotional response it evokes. We follow it inward, toward the greatest
    depths of our shared minds, and outward, to imagine reality across the universe.
    Goals achieved further, and the quest never ends.


    The great branches of learning, science and the humanities, are complementary
    in our pursuit of creativity. They share the same roots of endeavor. The realm
    of science is everything in the universe; the realm of the humanities is everything
    conceivable to the human mind. Drawing on the combined consciousness of our species,
    each one of us can go anywhere in the universe, achieve any goal, search for infinity
    in space and time. Of course, it is also true that when ruled by wild our unbounded
    fantasy can disintegrate into madness. Milton expressed this greatest risk of
    the human condition very well. A mind is its own place, and in itself can make
    a heaven, or a hell.


    So perhaps it is a blessing that the mind does not travel easily to unfamiliar
    regions, but instead prefers to repeat its excursions in familiar circles. Further,
    as a rule, people do not like the solitude of their own thoughts. A team of psychologists
    from the University of Virginia and Harvard University recently found that sitting
    alone for as little as six minutes with nothing to do but think enjoyed administering
    electric shocks to themselves.


    The full explanation of any biological phenomenon, including creativity in both
    science and the humanities, engages three levels of thought. First, for any conceivable
    living entity or process—a bird taking flight, growing toward the sun—the first
    inquiry must be: What is it? Provide the structure and functions that define the
    phenomenon. If it involves music or theater, the second level is the question:
    How was it put together? What were the events that resulted in the conditions
    of its origin, whether ten seconds or a thousand years ago? The third and final
    level is: Why do the phenomenon and its preconditions exist in the first place?
    Why not a different mode of evolution present on this planet that might have produced
    a different kind of thinking brain?


    Scientists living phenomena at all three of these levels. As a rule, they choose
    entities and processes that engage the what, how, and why in whatever detail and
    dimension lie within their reach. Biologists, however, perhaps even more than
    other scientists feel it necessary to seek cause and effect at all three levels.
    The causes that bring about a living phenomenon, such as the flight of a bird
    or our perception of a flower''s colors, are called proximate causes. The events
    that guided the evolution of the phenomenon to its present state are called ultimate
    causes. Proximate causes are the what and how of a full explanation. Ultimate
    causes are the why.


    Scientific explanations of organic life, including human life, routinely entail
    both proximate and ultimate causes. In contrast, accounts that govern inquiries
    in the humanities attempt at best only proximate explanations. Ultimate causation
    tends to be left to the God of Genesis, ancient alien visitors, or a mysterium
    tremendum et fascinans imagined to be resident deep within the human mind. Take
    as a random example the red color of a flower petal placed before you. The redness,
    like all hues, is distinguished by the stimulation of a particular portion of
    the electromagnetic spectrum composing the visual spectrum. The receptors are
    red-sensitive cones in the retina. The latter transmit signals to a staging center
    in the brain cortex, thence in relays back to the rear of the cortex, then to
    integrating units of perception and emotion, and finally back out to the centers
    of the conscious forebrain, causing you to say “red” (or perhaps rot, rouge, or
    krasny, or bomb, depending on your native language).


    Having this far, scientists have in decades tracked down the interacting segments
    of DNA that compose the genes prescribe recognition of colors.


    Thus, scientific research has brought us close to solving the first line of mysteries
    in human color vision. The way is now open to the still deeper question of ultimate
    causation: Why can humans see a particular spectrum of color but cannot see infrared,
    or ultraviolet, or other frequencies outside the narrow segment of the electromagnetic
    spectrum yielding visible light? And even deeper, why does DNA, and not some other
    coding chemical, prescribe color vision and all the other processes of life on
    Earth? Might we expect to find fundamentally different codes on life-bearing exoplanets?
    And why do we see color in the first place, instead of just shades of light and
    dark?


    The answers of such why questions await the reconstruction of prehistory, during
    our species emerged from earlier hominins, and much further over tens of millions
    of years when basic properties of our present brain and senses were shaped within
    the earliest ancestral primates.


    Scholars in the humanities have traditionally confined themselves to the what.
    They have touched lightly on the how. They have seldom ventured into the world
    of why. They build upon the biological particularities of the senses and emotions
    already in place at the dawn of the Neolithic, some ten thousand years ago—hence
