    economic hardship caused drove our little family to near poverty. Placed under
    my father’s care I grew up as a near-itinerant, moving almost yearly, attending
    ১৪ schools in Washington, DC, and in localities scattered through the deep southern
    states: among Biloxi, Mississippi; Atlanta, Georgia; Orlando and Pensacola, Florida;
    and Brewing, Decatur, Evergreen, and Mobile, Alabama.


    I compensated for this peregrine existence by walking or cycling distance, exploring
    it for insects and reptiles. When I was ten years old, we landed in a residence
    only a few city blocks from Washington’s Rock Creek Park, which I decided to explore
    with a butterfly net and a field guide on insects. I had heroes to inspire me.
    They include the scientists I heard about dwelling gods on the upper floor of
    the nearby National Museum of Natural History, as well as writers in National
    Geographic. In particular, there was William M. Mann, whose 1934 article “Stalking
    Savage and Civilized” was eventually transformative. Thereafter, as my father,
    my new wife, and I wandered immigrants across the South, I picked up a few friends
    my age but, mostly by preference, explored close by the wildlands alone. Approaching
    graduation from high school, which at that time happened to be in Decatur, Alabama,
    I assumed that I would go on to college somehow, then find a career as an entomologist—to
    remain forever in the outdoors, exploring unknown wildlands, farther and farther
    away, eventually to what I called the “Big Tropics,” the Amazon and Congo forests.


    My prospects for such a career, however, were far lower than I realized at the
    time. My school records were incomplete, my grades were mediocre and sprinkled
    with absences and failures. The University of Alabama saved me (and made me a
    fiercely loyal alumnus to this day). By state law the time, the university’s requirements
    for admission were only two in number: graduate of a high school, and resident
    of Alabama. I did well enough to go on a Ph.D. program at the University of Tennessee
    in Knoxville, and a year later to Harvard University for the completion of the
    degree and the rest of my career as a faculty member.


    By the time I moved on to the Ph.D. program at Harvard, my boyhood career dreams
    had grown even stronger. I retained my preference for solitary exploration. With
    scholarship support, I had the means to travel to what I called the true “big
    tropics”—the most extensive and least disturbed'
  - '[PAGE 29]


    reaches Earth with the largest faunas and floras. I was able then and into my
    postdoctoral twenties to conduct field work variously in Mexico, Central America,
    the Brazilian Amazon, the Australian outback, New Guinea, New Caledonia, and Sri
    Lanka.


    I found that sustained solitude in strange places without human contact, even
    for a few hours at a time, might be physically dangerous but also unproductive
    of ideas and discovery. Most people, it bore on me at the time without understanding
    the reason, have a compelling need to talk a lot. They carry on for a while every
    day, if possible frequently, and for me least while alone in wildernesses, constantly.
    So I evolved an alter ego during solitary field work in the strange places I visited.
    This person had no name, nor was it in any manner an independent entity (I wasn''t
    insane). My alter ego was, simply put, just a shift to a separate frame of mind.
    It appeared with each heightening of awareness of my surroundings, each forced
    change in priority of action, when I spoke to myself literally in words, but silently.
    Then, for example, spoke Alter Ego, tracking a sequence as my disjointed experience
    across the trailed.


    Hold on! Stop! Don''t pass by epiphyte (up on a tree trunk) even if it''s hard
    to reach. There might be something hiding in on it really interesting, an ant
    colony or God knows; you need to see it. [Explosive deleted.] Can''t reach it.
    Move on. [Later] Watch what you''re doing! Step real carefully! There could be
    a ravine behind the heavy vegetation right ahead on the left. Careful, care—ful,
    take a look. Wait! Look! Look! There''s a column of ants. Something really new.
    Almost hidden in the litter. Maybe army ants that''s not quite right; Leptogenys
    (ants), maybe? Move on, move in, careful, careful, careful, it might be something
    new, something really new.


    Talking back and forth to one another, and my all-but-silent fellow hunter and
    chattering adviser, I conducted my field research and absorbed the natural history
    of the environments I visited. My focus stayed on ants, a wise choice for field
    research. I came to know that in numbers, in biomass, and in global range, they
    dominate the insects of their size class, and now by the second decade of the
    twenty-first century, specialists have come to identify 14,000 species worldwide.
    I''m not a taxonomist, a biologist who specializes on classification, because
    of their exuberant abundance in'
  - '[PAGE 30]


    every place I visited, I was able over a lifetime in the field and among already-collected
    but unstudied museum accessions by others, to discover and give Latinized scientific
    names to 450 new species.


    My purpose as I silently talked my way through the forests and savannas around
    the world was to find many kinds of ants as I could, but them most importantly
    new and rare species, and then to learn as much as possible about their social
    lives—where they nested, their population, castes, their food, their communication
    system. Each species was unique in anatomy and social behavior, often radically
    so. Each was a source of new scientific knowledge. I learned about them, I virtually
    lived with a few of them, and I discovered the precise adaptations they had made
    to the natural wild environment. I was their storyteller, the first the great
    majority ever had.


    Each one of the ant species, scientists and naturalists will tell you, has its
    own story, different from those of all the others. Its scouts and battalions went
    forth on forays, while at home, nurses and builders reinforced the nests and drove
    off invaders. And if the story has much the same from day to day, it has unrolled
    with new chapters through the colony cycles that may take a century to complete.
    The story is not one of culture but of genetic social evolution stretching across
    millions of years. Putting the big picture of ant social behavior, species upon
    species, it is possible to reconstruct some of the history of the modern world
    they dominate.


    It has taken a lifetime of study, and talking, talking, talking, talking, finally
    to recognize the tribe to which all people belong. It is the Ju/''hoansi.'
