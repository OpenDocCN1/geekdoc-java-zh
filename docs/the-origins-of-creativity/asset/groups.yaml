    在与陌生人互动时，微笑的出现可以可靠地预测信任和资源共享。此外，观察伴随合作行为的微笑会增加一个人未来合作的意愿。地位则是另一回事。在同质文化中（如日本和中国），这种社会互动是复杂且可能具有破坏性的，因为长期的人口稳定为固定等级制度的发展创造了有利条件。在类似的情况下，微笑可以信号互动不会扰乱社会秩序，而微笑的特定特征在其他优越地位信号中传达了嘲讽和批评。


    回到生物学，指示信号在形式和意义上的变异导致了基因-文化共同演化的基本过程之一：即通过自然选择进化为一种内在特征，使变异本身收窄并硬化。这种现象最初被称为鲍尔温效应，以美国心理学家詹姆斯·马马克·鲍尔温命名，他在1896年构想出了这一概念。基因-文化共同演化与人性的进化起源具有实质性的相关性。本质上，它是这样一个原则：学习行为中的变异被证明是有益的并被重复，规定而非仅仅留作为一种学习选择的突变其频率将会增加，随着时间的推移，新特征将变得固定。


    鲍尔温效应在蚂蚁和白蚁的等级制度中得到了显著的说明。查尔斯·达尔文对这些昆虫非常着迷。他花大量时间坐在下花园（Down Gardens），观察并思考那里的蚁丘——据一位女佣提到，她在提到住在附近的多产作家威廉·麦克皮斯·特克莱利时道：“遗憾的是达尔文先生没有像特克莱利先生那样有些可以打发时间的事情。”


    事实上，这位伟大的自然学家在挣扎于任何情节和结局时，比特克莱利要苦恼得多。达尔文注意到蚂蚁身上某些现象，这些似乎与自然选择进化论相矛盾，并对该理论可能是致命的。他知道，典型的蚁群由母后加上几只雄性（如果存在，它们是临时客人）以及大量经营蚁群并承担所有工作的雌性工蚁组成。他的困境在于：工蚁不繁殖；它们是不孕育的，在某些物种中完全缺乏卵巢。如果工蚁不能繁殖，如果它们无法传递其服从的构造和行为，这些特征是如何通过自然选择演化的呢？达尔文构想出的答案是正确的（那个人几乎正确得令人讨厌）。他推断，蚁群中所有的雌性具有相同的遗传性。每个雌性变成哪个等级——是王后还是具有独特体型和行为的工蚁——取决于她成长的环境。特别重要的是她在从一条小幼虫成长为六六足、摇动触角的成虫过程中所接收的食物数量和质量。等级决定的细节在已知的14000种蚂蚁中差异巨大，但在迄为止研究的物种中，这种发育证明是基于遗传的线性规划版本。研究人员解决的一种代码遵循以下规则：如果幼虫在预定年龄达到特定尺寸，它的发育将不受抑制地持续成为新后，拥有完整的翅膀和卵巢。相反，如果幼虫未能达到关键时间点，旨在成为翅膀和卵巢的组织生长就会停止，成年虫作为工蚁出现——无翅、不孕育，且比它的姐妹处女后更小——即使蚁群中的所有成员在基因上完全相同。


    人类等同等级决定（由动态编程的遗传形式产生变异）存在于心理学家所说的“学习”中。这种现象是人类本能以及我们所感知的人性的基础，而反过来，通过创造性的方式表达，它是人文科学的管理核心。


    准备性学习的一个教科书级例子是对蛇的恐惧——不是面对咆哮的狗或闪电时普通的恐惧和谨慎，而是那种令胃翻江倒海、导致瘫痪的厌恶。孩子可以学会喜欢蛇。他们可以无畏地把蛇当成宠物带着，就像我在阿拉罗巴马州布鲁顿的T.R.米勒高中那样，我在那里获得了“蛇类·威尔逊”的绰号，那是一个美丽的小镇（我小说《蚁丘》中的克莱维尔），有一支获胜的橄榄球队和唯一的居民爬物学家，也就是我。我喜欢向别人展示，当蛇适应了人类触摸时，它们会在你手中休息，或在你的衣服下无害地捕猎，可能是为了老鼠和青蛙。它们的皮肤摸起来像皮革，不像许多人想的那样粘滑，它们闪烁的舌头是一个无辜的嗅觉器官，而不是致命毒。


    但如果一个人被蛇吓到了——仅仅一次，仅仅一点点，并且以几乎任何可以想象的方式，即使只是通过可怕的照片和故事看到地面上的某个圆柱体——他就会倾向于瞬间获得对所有蛇的深层厌恶，更糟，通过瘫痪效应产生完全的终身恐惧症。


    换句话说，蛇恐惧症看起来像是一种本能，在某种意义上确实如此（正如该词的传统意义）。对蛇的厌恶也是学习来的，而且很容易学会，其方式被设定为快速且目标明确的。清晰的答案是人类及其史前祖先数百万年来面临的致命危险。只有极少数的蛇类是有毒的，但很少有是地球陆地表面最危险的动物。蛇咬死亡率最高的是东南亚（蝰、加巴蛇、眼镜蛇和眼镜蛇）。世界上最危险的职业之一是在隐藏着大量攻击性圆鼻蝰蛇的地方采集叶子——它们体型大、具有侵略性、致命且难以发现。毒蛇在世界的热带和温带地区几乎无处不在。致命的咬伤虽然罕见，但在芬兰和瑞士仍然发生。


    就像我们地质过去的幽灵一样，其他潜在危险的动物也施加了它们自己的遗传恐惧。对蜘蛛的本能恐惧（蜘蛛恐惧症）一直以轻微的形式存在且从未完全消除，其敏感期从三岁半开始，并持续整个童年。对昆虫的普遍恐惧（易恐的小虫类）在六到八岁的儿童中比此后更大。对大型动物的准备性恐惧通常在五岁之前不会发育，但对于狗，在两岁时就可以出现。


    一个惊人的事实是，获得条件厌恶和恐惧症的触发能力几乎完全限于我们遥远的史前祖先在野外数万年获得的风险。除了各种动物敌人，这些风险还包括狭窄的空间、高度、流动的水以及暴露在陌生环境中。我们的物种还没有时间进化出对刀、、枪和汽车的恐惧，而这些到目前为止是生活中最常见的死亡因素。


