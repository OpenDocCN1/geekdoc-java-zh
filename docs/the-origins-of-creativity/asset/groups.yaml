    威廉·布莱克的《古代之神》（The Ancient of Days，1794）是他最喜的作品，展示了神灵乌瑞曾（Urizen）正在创造第二次启蒙运动。布莱克认为，乌瑞曾是一个邪神，因为他发明了科学，强制人类进入单一的思维方式。换句话说，他们某种程度上受到了本能的限制。在动物比喻中，例如，“狐的”（vulpine）意味着狡猾、隐秘、自私；“猪的”（porcine）寓意肥胖、贪婪、统一；“狮的”（leonine）象征着力量、勇气、威严；蛇（serpent）意味着招人嫉忌、诱惑、邪恶，在某些社会中也代表强大和恩赐。跨越文化，人类始终使用物理自然界的特征进行比喻。例如，太阳代表启蒙与智慧；冰雪则代表静止、退缩或死亡。海洋通常代表广阔、母亲、诞生或神秘。


    比喻并非为了表达激发其灵感的实体的本质。它们的意义源于其中某些特征如何影响我们特有的人类感官和情感。在这种感知中，它们既是本能的，也是学习的；既是遗传的，也是文化的。可预测的比喻交织在一起，创造了创作艺术的原型。它们在故事中很容易被识别为定型的情节和人物。它们可能不精确，甚至陈腐，但它们是文学和戏剧的基石。


