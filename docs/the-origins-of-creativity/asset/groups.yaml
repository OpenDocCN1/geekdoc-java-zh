    and sometimes after the experience when it is stored in long-term memory and is
    the first thought that comes to the conscious mind upon recall.


    The signature introduces the aesthetic surprise, which merely beautiful or otherwise
    instinctively deeply compelling. In visual art, for example, it exists in both
    the parade of the tall sails and the apocalyptic tilt of the sinking Titanic;
    Gustav Klimt''s surreal setting in his portrait of Adele-Bauer that seems to melt
    the lady into the metal; Francis Bacon''s exaggerations in his brutal self-portraits,
    which shout the damning consequences of complete honesty; and the lithograph of
    the great racehorse Citation, 1948''s Triple Crown winner, lifted by C. W. Anderson
    in full triumphant stride, to be compared with the horrific screaming steed in
    Picasso''s Guernica.


