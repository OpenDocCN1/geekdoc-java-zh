    matter of fact), while others were a spontaneous choice but were asked what sort
    of feeling they meant to convey reciting the line. The recordings of their readings
    were played before 70 listeners of various origins and educational levels.


    The response to the reactions were organized into the following categories: (1)
    simple statement; (2) amorous; (3) joyful; (4) solemn; (5) comical; (6) ironic
    and angry; (7) sorrowful, resigned; (8) fearful, frightened. If 60% of all responses
