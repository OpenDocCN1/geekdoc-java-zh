    《沉默的羔羊》(1990)。另一个同样令人毛骨悚然的疯狂杀手描写。


    ## 探索之旅。


    史前和人类祖先是狩猎和采集者，被迫在觅食范围内不断寻找猎物和植物资源。发现丰富的新水源、动物群或植物食物对部落来说是生命的源，也是他们许多故事和传说的来源。


    示例：


    - 《2001太空漫游》(1968)。人类的起源与进化，在寻找外星文明的飞行中，从一个神秘走向另一个神秘。


    - 《火战车》(1981)。争夺林匹克金牌过程中的宗教、荣誉与勇气。


    - 《印第安纳琼斯与最后的十字军》(1989)。终于！圣杯找到了！然而，这一发现具有灾难性的后果，并以第二次消失告终。


    - 《夺宝奇士》(1981)。约之约也被找回了！同样具有灾难性的后果并消失。


    - 《马德拉山山的藏宝》(1948)。进入危险区域获取易财的旅程成功了，但以谋杀结束。


    ## 伙伴纽结。


    除了性之外，两个男人、两个女性，或偶尔是一个男人和一个女人，在敌对力量的追捕下为了自由并肩作战。这是一个关于古今以来英雄利他主义和合作力量寓言。


    示例：


    - 《非洲女王》(1951)。由鲍嘉特和赫本饰演的性格迥然不同的角色，在第一次世界大战期间的殖民地非洲顺河流逃避德国人，建立了亲密的关系。


    - 《不奇·凯西迪与桑德斯小子》(1969)。犯罪伙伴关系得到了回报，一直持续到血腥的结局。


    - 《鹿猎人》(1978)。俄罗斯轮盘场景是勇敢与牺牲的终极电影表达——亲密、惊心动魄且令人难忘。


    - 《致命武器》(1989)。性格截然不同的伙伴们结合在一起，将一些非常坏的人绳之于法。


    - 《自由华兰斯的枪手》(1962)。两个浪漫对手之间意想不到的联盟，击败了一个持枪恶棍。


    - 《德尔玛与露易丝》(1991)。被怀疑杀人，受困在峡谷边缘，这对迷人的组合选择了开车自杀。


    ## 其他世界。


    史前和人类部落一直通过发现和征服，在不断寻找额外领土中生活。在6万多年前人类走出非洲散发后的几千年里，人类人口扩散到我们物种完全未知的土地。在边界处相遇时，他们冲突或结成联盟。


    示例：


    - 《异形》(1979)。对新发现行星的深度氛围探索，那里有一个等待的高效怪物寄生虫。与《异形2》和《怪物》(2011年，约翰·卡珀蒂1982年电影重拍版）一起是史上最好的科幻恐怖电影。


    - 《外星人首页1982)。对友好外星人（也许人类部落）可能样子的表达。


    - 《第三类接触》(1977)。关于可以想象的友好外星人的第二个杰作。


    - 《想当王的人》(1975)。肖·康纳的角色穿越遥远的山脉以获得权力、财富，并最终导致背叛和死亡。


    - 《夺宝奇士》(1981)。约之约（由不幸的纳粹打开）的开启揭示了超自然的、信仰决定的世界的恐怖。


    异世界原型的磁力在最好的文学科幻和电影中达到最高强度。这些艺术作品在故事和科学及仪器细节的准确性上越来越具有吸引力。


    示例：


    科幻电影可能比其他任何类型的电影都更成熟，正如我最喜欢的电影之一《愤怒的红色行星》(1960)所示。一艘飞船降落在火星表面。宇航员们像亲切的邻家美国人，兴奋地等待人类首次距离观察另一个行星表面。一个标有
    BULOVA 的挂钟告诉他们时间。他们一起透过视窗望向红雾。其中一个问：“有生命的迹象吗？”另一个回答：“没有。只是一群植物。”观众的兴趣被一个预感的想法所维持：植物可能会吃掉宇航员，而它们确实如此。


