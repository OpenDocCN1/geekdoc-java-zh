    into theirs. Our bodies are specialized for the ecosystem in which our species
    evolved. Our minds are accordingly limited. Our hope for full self-understanding
    depends on knowledge not just of ourselves but of the specialization of the other
    living systems around us.


    Is there a place for creative arts in the invisible codes and rhythms of the millions
    of species that share the planet with us? Perhaps in music and the visual arts?
    And what possibilities might await in synesthesia, the blending of sensory modalities
    into one another, say chemical into auditory or visual? Consider this surprise
    one step further. We may in the near future be able, with brain-science technology,
    to read the minds of at least songbirds, apes and reptiles, new butterflies, ants,
    and water striders. Then it will be possible to simulate their *Umwelten* with
    virtual reality.


    For the moment, however, we are physically trapped inside the humanity bubble,
    and worse, remain unconscious of its limitations. The grotesquely lopsided content
    restrictions on us is illustrated vividly by comparing the number of words used
    in different languages to classify sensory response in different modalities. With
    our celebrated Ju''/hoansi, the Kalahari Desert Bantu, who are hunter-gatherers
    with a social organization and daily activity schedule thought to have characteristic
    of the distant ancestors of all present-day humanity. In the full known vocabulary
    of 117 words in combined Ju''/hoansi dialects specifying senses, 25 percent refer
    to vision and 37 percent to hearing, but only 8 percent refer to either smell
    or taste. This disparity should be of no surprise, since the rest of us the Ju''/hoansi
    are relatively weak in smell and taste.


    The rest of humanity is remarkably similar in its sensory vocabularies. In the
    languages of Teton Dakota Sioux, Zulu, Japanese, and English-speaking people,
    words applying to vision from 25 to 49 percent of the whole, while only 6 to 10
    percent apply to smell and taste combined.


    The isolation of our specialized, audiovisual species is even more severe when
    compared with other animals. We are close to “blind” when speaking of touch, humidity,
    and temperature. Some kinds of freshwater fishes use electric fields to communicate
    with one another and hunt prey. We witness the activity with technology, but otherwise
    are oblivious to it (unless we grab one and suffer a potentially fatal shock).
    Nor can we detect Earth’s magnetic field, used by some bird species to navigate
    during their yearly migrations.


    The shortcomings of the creative arts and humanistic scholarship that are becoming
    more apparent in the age of STEM have resulted, even in the outer reaches of science
    fiction, in an extreme anthropocentrism. Nothing, it seems, counts except on the
    impact on people. One result is that we are left with little to compare and therefore
    to understand and judge ourselves.


    To summarize, the humanities suffer from the following weaknesses: they are rootless
    in their explanations of causation and they exist within a bubble of sensory experience.
    Because of these shortcomings, they are needlessly anthropocentric and therefore
    weak in their ability to recognize the ultimate causation of the human condition.


    Protagoras of Abdera, in the Fifth Century BCE, declared that “Man is the measure
    of all things.” That world view was challenged in his time, and it should be more
    so today. We need another perception in order to get the story straight. It should
    read,“All things must be measured in order to understand man.”


    # THE YEARS OF NEGLECT


    A little hymn I first heard sung by a tenor in a church in Pensacola, Florida,
    when I was fourteen years old, brought tears to my eyes and compelled me to ask
    for baptism and formal membership in the Southern Baptist faith. That, I was told,
    is the way to affirm belief in Jesus and join Him forever in Paradise.


    > Oh that old rugged cross, so despised by the world,

    has a wondrous attraction for me;

    for the dear lamb of God left his glory above

    to bear it to dark Calvary.


    So I''ll cherish the old rugged cross,

    till my troubles at last I''ll lay down;

    I will cling to the old rugged cross,

    and exchange it some day for a crown.*


    Any child reaching the age of reason can understand the promise: a transformation
    of the social mind, a masterpiece of proselytization. In just one stanza and the
    chorus, “The Old Rugged Cross” captures suffering,


    love, redemption, and community, together the heart of evangelical Christianity.


    It also serves as a reminder of how the humanities, of which the study of religion
    is an integral part, differ fundamentally from science in mode of thought. The
    humanities alone create social value. Their languages, buoyed by the creative
    acts, evoke feelings and actions instinctively felt to be correct and true. When
    knowledge is deep enough and all set in place, the humanities become the preeminent
    source of moral judgment.


    But—wait a minute! Some things are inherently good, others inherently evil, are
    they not? It may seem that way, but it is also true that every thought and every
    action must be placed in a context, both scientific and humanistic, before it
    can be morally judged.


    Consider nuclear weapons, a risk to all life and a curse upon the Earth. On the
    other hand, the dropping of two atomic bombs stopped World War II in the Pacific
    and, at least as Americans saw, saved millions of American and Japanese lives.
    Subsequently the fear of nuclear exchange constrained the Cold War and national
    wars in general. In the interpretion of world history, where does the solution
    to this moral conundrum lie? How might we go finding it?


    Enter the humanities.


    Science owns the warrant to explore everything deemed factual and possible, but
    the humanities, borne aloft by both fact and fantasy, have the power of everything
    not only possible but also conceivable.


    Because the humanities also consist of everything that is human, all that is comprises
    the humanities. It should be axiomatic that education of the young consists of
    a wisely chosen balance between science and the humanities. Such a curriculum
    was once called a rounded education; now it is usually called a liberal education.
    The idea of a liberal education provided all citizens has one of the greatest
    achievements of the American democratic tradition.


    The idea was well stated after the beginning of the republic by Thomas Jefferson,
    in his 1818 commission report for the establishment of the University of Virginia.
    All should receive an education, Jefferson wrote (putting aside the glaring hypocrisy
    of slavery), both to provide a citizen’s own livelihood but also to improve his
    morals and faculties. “To understand his duties to his neighbors and country,”
    Jefferson continued, “and to discharge with competence the functions confined
    to him either;


    To know his rights . . . And, in general, to observe with intelligence and faithfulness
    all the social relations under which he shall be placed.”


    The ideals for public education as expressed by Jefferson have remained the core
    of the American tradition to this day. Yet the humanities become the weak sister
    of the sciences in the esteem and support it receives from the American people.


    In 2010, conscious of this disparity, a bipartisan group of members of both the
    Senate and House of Representatives called on the American Academy of Arts and
    Sciences to prepare a report on the condition of the humanities and social sciences
    in the United States, and to evaluate their role in American life. The model was
    the 2007 report sponsored by the U.S. National Academies, *Rising Above the Storm*,
    (science, technology, engineering, and mathematics). The focus was to be national,
    but the conclusions reached could be expected to have global implications.


    The central committee of the American Academy was drawn from senior leaders of
    universities, learned societies, government agencies, and cultural institutions.
    Their final report, released in 2013 and titled *The Heart of the Matter*, reached
    far beyond the Jeffersonian prescription to bring educational philosophy into
    the modern era.


    The Heart of the Matter confirms that for all our frivolities and foibles, we
    are a decent people. We overreach, we boast, we fumble, we have an inordinate
    fondness for guns. Our most celebrated heroes are not poets or scientists; few
    Americans can name a dozen of either living among us. Our heroes instead are billionaires,
    start-up innovators, nationally ranked entertainers, and champion athletes.

