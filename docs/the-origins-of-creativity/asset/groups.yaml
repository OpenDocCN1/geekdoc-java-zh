    # THE HUNTER’S TRANCE


    Absorption in the tangled bank is the trance an expert hunter enters for a particular
    kind of plant or animal. Hunting for a single prey, the hunter works like a tiger,
    alone, rather than in a pack, like a wolf. He is intimate with the fine details
    of the place and environment in which his quarry lives. He is alert to every subtle
    change in the ground and vegetation that can betray the route of the animal he
    seeks. He must be prepared to stalk his target from a distance, placing each foot
    carefully, as a literal matter of life or death. Or he may wait quietly for hours
    in ambush. To accomplish a kill, he must know what behavior to expect from the
    prey—when it can sense him, from what direction, and when it is ready to bolt.
    The expert hunter performs best when he perceives the Umwelt like his prey. For
    a few, the experience is spiritual, lifting the hunter to a higher level of consciousness.


    In The Hunter’s Trance (2007), Carl von Essen cites a hunter who one day stalked
    a herd of wapiti elk in the Colorado uplands:


    I came across fresh tracks of several elk, including one bull. The morning was
    bright and sunny, with a slight wind in my face, assuring me of getting a reasonably
    close approach to my quarry. After perhaps an hour of slow and careful tracking,
    I came upon a long'
  - '[PAGE 95]


    glade fifty yards wide. If the elk were nearby they would detect my crossing the
    snowy and slushy meadow. It remained for me to be completely still and pay complete
    attention to the opposite hillside. I felt now their presence and somehow knew
    that they felt mine. As I stood there, the sense of time had remarkably changed.
    What seemed like minutes later to have been over an hour. An intense feeling of
    the clarity of the scene swept over me. All my senses seemed to sharpen to an
    exquisite razor''s edge. I heard the tiniest sounds of distant streams and rustling
    leaves as if magnified in a celestial amplifier. Everything seemed closer to me
    and I felt, amazingly, a sort of merger of myself with everything, a sense of
    belonging. I was connected with everything in that panorama, the grass, trees,
    rocks, insects, birds, the elk that I knew were quietly uphill, out of my sights.
    I felt a great rush of emotion, a joy at being alive, the chance to exist along
    with everything else. I will never forget that day.


    One does not require a Winchester rifle or list for a blood ritual over the fallen
    prey to endure the hunter''s trance. As a naturalist I''ve come close. But even
    more important to the naturalist than a Zen-like state of total awareness is the
    search image, the combination of traits of a species of plant or animal allows
    the tracker to find it as one element among thousands hidden in the vastness of
    an ecosystem. I cannot find words to describe the pleasure I feel, even to this
    day, as naturalist hunting rare and little-known species. I can tell you a couple
    of stories.


    One of my best experiences evincing the power of the naturalist''s search engine
    was the discovery of zorapapterans, an exceptionally rare and elusive group of
    insects. One early spring day, during my freshman year at the University of Alabama,
    I was working my way through the mixed coniferous-hardwood forest track nearby
    Hurricane Creek in search of new and unusual kinds of ants. I pulled away the
    bark from a decayed pinewood log. Beneath were debris-lined slabs this particular
    niche is a favorite nesting site for small, rarely seen ants and other cryptic
    inhabitants. Few were there in the log I chose. They began to move away, toward
    they formed a mélange, a sparse mix of little scorpion-like schiz arachnids, springtails,
    oribatid mites, and undersized anonymous beetles. But something else in this miniature
    cave'
