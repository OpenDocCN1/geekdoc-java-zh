    # ABOUT THE AUTHOR


    Edward O. Wilson was born in Birmingham, Alabama, in 1929 and was drawn to the
    natural environment from a young age. After studying evolutionary biology at the
    University of Alabama, he spent his career focused on scientific research and
    teaching, including forty-one years on the faculty of Harvard University. His
    twenty-nine books and more than a hundred articles have won him over one hundred
    awards in science, including two Pulitzer Prizes for On Human Nature (1979) and
    The Ants (1991), given by the Royal Swedish Academy. For his contributions to
    conservation biology, he received the National Medal of Science and Freedom. Much
    of his personal and professional life is chronicled in Naturalist, which won the
    Los Angeles Times Book Award. More recently, Wilson has ventured into fiction,
    the result being Anthill, a New York Times best-selling novel published in 2010,
    with his wife, Irene, in Lexington.


