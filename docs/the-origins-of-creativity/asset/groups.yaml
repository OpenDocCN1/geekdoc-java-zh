    # 18


    # THE MOST DISTANT ISLAND


    Let me illustrate the promise of a unified creativity in science and the humanities
    with two stories. The first concerns the most remote island in the world outside
    the Antarctic continent.


    “Sberry” and “seastack” are words that are only rarely encountered in ordinary
    English speech. Of Norse origin, skerry means a small rocky island, and a seastack
    is a column of rock cut out by waves that have worn away the deposits of higher
    land around it. The two words have an almost magical pull on me. They summon my
    traveler’s mind to mysterious forgotten places, offering sanctuaries somewhere
    on the other side of the ocean, constantly wave-washed, worlds unto themselves.
    Even if the islands are too small to support human life, I want to go there!


    I confess to being a neophile, an ordinate lover of islands. My mind drifts easily
    to Isla Salas y Gómez, a skerry in the temperate Pacific off the coast of Chile.
    Standing alone in the open sea, measuring fifteen hectares in area and seven hundred
    seventy meters in maximum length, it is one of the smallest islands in the world.
    It began as a se, one of the thousands of volcanic peaks that rise from the ocean
    floor to varying depths beneath the surface. Isla Salas y Gómez is one of the
    rare peaks in the southeastern Pacific that has risen free to create a lonesome
    skerry. This relatively microscopic spot of land is also the most isolated island
    in the'
- md: '

    world. Its nearest neighbor is Easter Island, the planet’s most isolated inhabited
    island, two hundred kilometers away.


    Now, being a biologist with a special interest in geography, I especially wanted
    to know what kinds of plants and animals might have reached and now survive on
    this almost extraterrestrial place. The answer, I found, has been obtained by
    a very few visitors to make it to Isla Salas y Gómez. This skerry is home to four
    land-dwelling species of plants, including a species of Asplenium fern also found
    on the remote Atlantic islands of St. Helena and Ascension. A few very insects
    are also present, feeding on foliage (I have not been able to find their names).
    A total of twelve species of seabirds there to breed and raise their young. Of
    other terrestrial animals larger than insects there are none.


    If we exclude the dozen or so species of seabirds as visitors but include the
    still-uncounted insects and tiny nematodes and rotifers probably also present,
    the number of land-dwelling plant and animal species on this tiny world is probably
    under one hundred. A comparable area of tropical rain forest would possess a hundred
    times, even a thousand times, this. Given that the island has existed for several
    centuries (Easter Islanders visited when they still used catamarans for oceanic
    travel), haven''t more kinds of plants and animals colonized Isla Salas y Gómez?
    Why does it remain so lifeless?


    The probable answer, biologists can tell you, that the diminished fauna and flora
    are in equilibrium. The great distances from the nearest other land allows only
    very few species to reach the skerry during long intervals of time, while the
    small size of Isla Salas y Gómez raises the rate at which they disappear. As the
    immigration rate equals the extinction rate, the number of species present at
    any given time remains very low. As a result, Isla Salas y Gómez adds another
    distinction to "most modest" list: smallest flora and fauna of an island outside
    the world’s polar regions.


    Isla Salas y Gómez cannot support people. If it had never been seen, could it
    be? The question is not nonsensical as it might at first seem. It is just a version
    of the falling tree paradox: if there is no one in the forest to hear, does the
    fall of a tree make a sound? Common sense says that the answer is immediately
    obvious. The tree cannot fall without sending forth a wave of compressed air.


    But a “sound” that has meaning for our species requires a human to hear that change
    in the air. A physicist and a biologist together predict and simulate in fine
    detail the first crack of the trunk, the ominous susurration of the downward arcing
    canopy, the snaps and crashes of the plummeting branches, and the final thump!
    of the trunk hitting the ground. But neither the scientists nor anyone else can
    hear the actual fall. A human or recording device on the scene is necessary. Otherwise
    the event has no meaning. Nietzsche captured the larger point when Zarathustra
    addressed the Sun: "You great star! What would your happiness be if you had not
    those for whom you shine!"


    Wallace Stevens developed more fully the import of the paradox in his 1943 poem
    "Somnambulism" (that is, sleepwalking), using the image of an unseen ocean and
    unheard surf.


    On an old shore, the vulgar ocean rolls

    Noiselessly, noiselessly, resembling a thin bird,

    Thinks of settling, yet never settles, on a nest.


    The wings keep spreading and yet are never wings.

    The claws keep scratching on the shale, the shallow shale,

    The sounding shallow, until by water washed away.


    The generations of the bird are all

    By water washed away. They follow after,

    They follow, follow, follow, in water washed away.


    Without this bird that never settles, without

    Its generations that follow in their universe,

    The ocean, falling and falling on the hollow shore,


    Would be a geography of the dead; not of that land

    To which they may have gone, but of of the place in which

    They lived, in which they lacked a pervasive being,


    In no scholar, separately dwelling,

    Poured forth the fins, the gawky beaks, the personalia,

    Which, as a man feeling everything, were his.


    The critic Helen Vendler broadens the key question as well as can be phrased:
    "If there did not exist, floating over us, all the symbolic representations that
    art and music, religion, philosophy, and history, have invented, and afterward
    all the interpretations and explanations of them that scholarly activity have
    passed on, what sort of people would we be?


    Neither the question nor the answer is rhetorical. There would be no literature,
    little or no abstract or symbolic language, no tribal government (with a radius
    greater than can be run on foot in a day). The technology would be Paleolithic,
    and art would still be crude figurines and stick figures drawn on rock walls,
    with little meaning left to decipher. Science and technology would consist of
    the sharpening of spear points, the knapping of stone axes, and perhaps the piercing
    of snail shells to thread for necklaces.


    # 19


    ## IRONY: A VICTORY OF THE MIND


    The theme of humanistic science converging on the scientific humanities is a commanding
    example in the haunting ballad “Send in the Clowns,” Stephen Sondheim’s signature
    piece in the Broadway production A Little Night Music. Written in 1973 with the
    actress Glynis Johns in mind, “Send in the Clowns” has been performed by a host
    of leading artists. Its rendition by Judy Collins was named Song of the Year at
    the Grammy Awards ceremony of 1976.


    The central character and voice of the play is Desirée, a beautiful and successful
    actress, who many years earlier had an affair and bore a child with Fredrik, a
    lawyer. This charming fellow, even while unaware he is a father, proposes marriage
    to Desirée. Wedded to her career, she refuses. When the act commences, Fredrik
    is trapped in a failed, unconsummated marriage with an equally beautiful and much
    younger woman. This embittered Desirée responds with an ironic little song that
    begins,


    Isn''t it rich? Are we a pair?

    Me here at last on the ground, you in mid-air.

    But where are the clowns? Send in the clowns.

    Don''t bother, they''re here.


    Desirée


    Few of the performing artists of “Send in the Clowns” whose recordings I have
    heard express these qualities I feel they should. In varying degree, the artists
    translate the emotions into what they perceive behind the irony, without forcing
    themselves out of their customary styles. Judy Collins is warm, sweet, and loving.
    Of all the singers, she is the partner you would regret leaving. Barbra Streisand
    delivers her own musicality, her voice mood rising and falling dramatically. Glynis
    Johns is stricken with disbelief and anger, while Judi is just grief-stricken.
    Carol Burnett is the image of disappointed stoicism. Catherine Zeta-Jones embellishes
    her delivery with facial and tonal drama. Sarah Vaughan infuses us with a love
    song and a touch of jazz.


    Glenn Close alone gets it right—start to finish. She is, in my admittedly judgment,
    perfect. Her demeanor at the microphone, her calm erect posture, her ironic smile
    suggest a cultivated and highly intelligent woman on the edge of middle age. Her
    Desirée is deeply disappointed, angry, and perhaps resigned, but still open to
    the distant possibility that the world might yet change her way. The importance
    of the situation is recognized in subtle mannerisms. The word “clowns” is pronounced
    with care and slight emphasis, each letter enunciated clearly. Desirée is a walking
    tragedy, but her demeanor is entirely civilized, and the more powerful for it.


    > Don''t you love farce? My fault, I fear.

    I thought that you''d want what I want,

    Sorry my dear.

    Desée


    Anger, jealousy, and retribution are animal emotions. They are part of the instinctual
    programs already set in place in the hypothalamus and other emotional control
    centers of our ancestors tens of millions of years ago. Irony is something different.
    It is ours alone, cerebral, pacific, and shaped substantially by cultural evolution
    in social environments created by language. To explain animal emotions we must
    lean toward biology, engaging the humanities of course. To explain irony requires
    the reverse.

