    # 13


    # WHY NATURE IS MOTHER


    For almost all of the 100,000 years that humanity has existed, nature has our
    home. In our hearts, in our deepest fears and desires, we are still adapted to
    it. Ten thousand years after the invention of farms, villages, and empires, our
    spirits still dwell in the ecological motherland of the natural world.


    We do not and cannot live for long outside of this self-sustaining environment.
    We exist in a narrow biological niche ultimately dependent on its largeness. The
    natural world has humbling power and eternal life, so that with good reason we
    call it Mother Nature. She has been damaged by our activity, but that is nothing
    new. For the long geologic haul, humanity is just another perturbation. Let her
    speak for the ages, metaphorically, as did the actress Julia Roberts performing
    on behalf of Conservation International:*


    > I don''t really need people but people need me

    Yes, your future depends on me

    When I thrive, you thrive

    When I falter, you falter or worse

    But I''ve been here for eons

    I have fed species greater than you, and

    I have starved species greater than you'
  - '[PAGE 90]


    My oceans, my soil, my flowing streams, my forests,

    all they can take you or leave you

    How you choose to live each day, whether you regard or

    disregard me doesn''t really matter to me

    One way or the other your actions will determine your fate not mine.


    We are Earth’s unruly children who left home to make it in the city. But as scientists
    are finding out, and I''ve stressed, there is a lot of Mother

    Nature still in our genes. Evolution during our long tenure in the natural

    world has left an indelible stamp—Darwin’s metaphor—in the way we

    communicate by posture and facial expression. We are also innately fixed in

    the choice of the environment we most want to inhabit. Thanks to

    pioneering research by Gordon H. Orians at the University of Washington

    and other scientists and humanities scholars, we have a good idea of what

    may be called the instinct of habitat selection. People tested diverse

    cultures expressed preference for the following home location: placed

    enlevated land looking across a broad expanse of savanna sprinkled

    with small trees and copses with a barrier of rocky surface or dense

    forest to the rear; and finally, to a lake, river, or other body of water.

    Their landscape of desire closely approaches the African environment in

    which our human and prehuman ancestors originated.


    Artists from Asia, Europe, and North America show the same

    combination in their paintings of pastoral and woodland environments. By

    and large, they avoid primeval environments of the north temperate zone,

    characterized by dense deciduous and coniferous forests. When such an

    environment is depicted, it is typically softened by an insertion of meadows

    and lakes. It leaves space for the instinctive preferences of humanity’s

    ancestors.


    Orians has refined the “savanna hypothesis” by including organisms as

    well. The shape of trees widely used by gardeners—from the temples of

    Kyoto to the baronial estates of England—possess traits in common with

    the dominant acacias of the African savannas: they tend to have

    exceptionally broad canopies relative to their modest height, short trunks,

    and small, divided leaves. The Japanese have been breeding maples and

    oaks over a thousand years, aiming to perfect just these qualities. I can

    testify that, even prior to learning of the savanna hypothesis, my favorite

    trees (and they remain) the Japanese maples.'
  - '[PAGE 91]


    What might arouse the adaptive advantage of the human preference for a habitat
    like the African savanna? It is logical to search for one. All known animal species
    that are mobile are required to seek the environment best suited to their survival
    and reproduction. They must find their way to the exact suitable place, and get
    there fast and with unerring accuracy. Why should we not expect to find at least
    a vestige of this propensity in modern human beings?


    I once addressed a convention of landscape architects, during which I emphasized
    biophilia, the innate love of contact with other living organisms. Biophilia architecture
    was just then coming into professional acceptance. I included the savanna hypothesis
    of human habitat preference. I was puzzled by what seemed to be their relatively
    tepid response. Had I failed to make my case? Later I asked an architect friend
    if I had been unclear, and he responded, "Oh no, it''s just that we already knew
    all stuff."


    There is a simple, easily tested reason why the savanna homeland shaped our primal
    yearnings. From a high perch, early humans had a wide view of grazing animals
    approaching enemies. Living close to a body of water ensured a supply during severe
    droughts. It also provided an extra source of food. The distinctive physiognomy
    of the acacia, with low, horizontally spreading branches, allowed a quick climb
    to escape lions and other predators big and fierce enough to take down a human.
    The spacious horizontal branches were supports on which to rest and wait out the
    pursuers. They also served as a station from which to scan the local terrain for
    prey of their own.


    It is within the domain of evolutionary biology to inquire why most people enjoy
    a walk in the woods, and why the experience contributes to sound physical and
    mental health. There''s the value of exercise, of course, but there is something
    else at work deep in our psyche. In our hearts, we are still in some fashion or
    other hunters and gatherers. So follow me back in imagined time to hunt alongside
    one of our Pleistocene ancestors.


    In order to survive we must keep our eyes open and our ears keen. Walk a quarter-mile,
    cross-country, not along a trail—predators and enemy scouts to wait hidden along
    trails. A good habitat would be a mature hardwood forest, anywhere in temperate
    Europe, Asia, or North America. You will see plants and animals previously unnoticed;'
  - '[PAGE 92]


    and they will only be a tiny fraction of the species alive and unseen a few feet
    distance to the side: scores of plants, moss, and lichen species; countless fungi,
    and thousands of spiders, millipedes, centipedes, mites, springtails, and so on
    through a roster of creatures whose biology is still mostly or entirely unknown.
    (A handful may contain, even if you are in Washington, DC’s Rock Creek Park or
    New York’s Central Park, species waiting to be discovered by science.)


    This is the point I want to make: the experience of nature, to those who have
    learned to absorb it, is a magic well. The more you draw, the more there is to
    draw. In early visits to wild environments, you will miss most of what is interesting.
    You will subsequently spot more, and then more, and begin to put names on what
    you see. Then will come some more details. Each species, which you will learn,
    is a story in itself. An entomologist friend who upon retirement in Florida tracked
    each Red Admiral butterfly in his backyard generation after generation, caterpillar
    to adult. This may seem an empty pursuit, but I can tell you that he found Red
    Admirals to be complex territorial butterflies with individual personalities.
    His observations had scientific merit.


    You need not travel to the Amazon or Congo to experience a wilderness. There exists
    enough novelty and challenge in what I call microwildernesses. A new genre of
    nature writing has emerged to explore the potential of small plots and fine detail.
    Annie Dillard was a pioneer in her Pilgrim at Tinker Creek, which won a Pulitzer
    Prize in 1974. Many other notable examples are David M. Carroll’s Following the
    Water: A Hydromancer’s Notebook (2009); David George Haskell’s Forest Unseen (2012);
    and Dave Gould’s A Buzz in the Meadow: The Natural History of a French Farm (2015).
    These works, combining scientific natural history with poetic interpretation,
    the invisible appear, the small grow large, and the beauty of life plainly experienced
    in all dimensions.


    Seemingly infinite biodiversity packed into a small space, an image Darwin famously
    labeled the “tangled bank” in the closing paragraph of the Origin of Species,
    cannot have escaped the attention of at least some creative artists. I have been
    drawn to Jackson Pollock’s well-known-1950 piece Autumn Rhythm, in astigmatic
    viewing could represent the first glimpse of an overgrown English roadside or
