    旧政权的奢侈被展现得淋漓尽致。这位声名显赫的歌舞演员按照当时的标准被认为是法国最美丽的女性之一，她被心爱的玫瑰簇环绕，横跨额头并垂落在手臂，身躯被层层叠叠的玫瑰包裹。简而言之，吉马德小姐（Mlle.
    Guimard）已变成了一朵花。


    与那些经典案例截然不同的是保罗·曼希普（Paul Manship）惊艳的作品《晨间情绪》（The Moods of Morning, 1935）。这尊表现仰卧觉醒的雕塑，底座是许多物种的花芽，它们向上延伸顶端的百合花和天堂鸟花。正如艺术评论家维多利亚·杰恩·雷姆（Victoria
    Jane Realm）所说，最后的花束“更加开放、更加浓烈，在色彩与形式的爆发中结束”，代表了人类主体的完全觉醒。


    在另一个领域，被雕塑环绕的花果自文明初期以来一直点缀着装饰性花园。总的来说，花园一直是农业的关键工具，而农业是人类从石器时代的狩猎采集部落进化为文明社区的手段。农业在世界范围内多次独立发明，在除澳大利亚以外的每个有人居住的大洲，时间跨度从中东的现今约12,000年前到新大陆的5,000年前不等。它可能起源于另外两种方式之一：第一种直接观察到可食种子和果实能生长出更多可食种子和果实的植物；另一种是人群倾向于定居在产量极高的树木、灌木和草本植物附近，而远离其他地区。逻辑上，通过选择产量最高的植物进行驯化，农业便随之产生了。


    花园与其所代表的自然界一样，具有恢复和治愈的作用。普通人一直感受到这种力量，科学家也测试并证明了它们的益处。在一次测试中，志愿者先看了一部压力巨大的电影，然后观看自然视频，其心率、收缩压、面部肌肉张力和皮肤电导率测得的压力得到了缓解。但不是那些城市场景。其他研究正如预期的那样，在手术和牙科治疗前，植物和水族的存在会让压力症状也有类似的减轻。此外，如果允许术后患者观察自然环境，甚至只是看着医院墙上的自然图片，他们的恢复更快，并发症更少，且所需的痛药剂量更小。


    随着财富的积累和社会阶层的兴起，统治者和富人负担得起装饰性花园用于展示和享乐。后来，在法国、西班牙、日本和斯里兰卡等地，这些花园向公众开放。如今，公共花园在大多数社会中都是普遍的，为所有阶层带来快乐。


    北美和欧洲大部分地区的房屋主经常将自己的物业转化为自然的模拟物，通常由草坪和大部分装饰性树木灌木组成。然而，尽管自然的益处不言而喻，景观开发人员经常会犯两个无意的错误，损害了他们和客户本能喜爱的大环境。首先是他们对草坪的痴迷。人们喜欢开放空间，自人类诞生于非洲萨瓦纳以来很可能一直如此。然而，草坪是全球最糟糕的环境之一，仅次于裸露混凝土。每一片草坪（如果我们撇开那些英雄式反抗的蒲英的话）都是外来物种的单一种栽培，是水的凶猛消耗者，还需要定期施肥、使用有毒除草剂和杀虫剂，这些物质的过量最终会渗透进地下水和溪流。


    同样令人担忧的是，大多数景观规划根据感官美感选择装饰性树木灌木，几乎不关心它们的地理起源。选择外来物种而非本土物种对环境有深远影响，最显著的是本土植物支持的昆虫产量高得多。野生生态学家道格拉斯·W·塔拉米（Douglas
    W. Tallamy）在宾夕法尼亚州发现，取食外来植物的昆虫生物量是本土木本植物的四倍。塔拉米将这种差异归于具有咀嚼口器的本土昆虫食用外来植物的能力降低，因为它们并非在这些植物上演化出来的。他发现，本土物种支持的毛虫（主要是蛾类幼虫）生物量是外来物种的三十五倍。


    在景观规划中，优先选择产生更多昆虫的树木似乎是错误的，但事实恰恰相反。昆虫，尤其是毛虫，是鸣鸟雏鸟的首选食物。本土木本植物产生更多的鸟，从而形成全方位更丰富的生态系统。健康的鸟类种群可以抑制害虫（如欧亚吉普蛾、云杉八蠹虫）的爆发性增长。此外，通过维持可持续水平的本土鸟类种群，我们有助于缓解其中稀有物种的灭绝风险。用外来植物物种替换为同样吸引力且在各方面更有趣的替代本土物种，不仅环保上是明智的，而且具有成本效益。这是个性化保护的最高境界。


    亲生命力（Biophilia）是一种受到人文学术和科学研究充分支持的本能，它吸引人类走向地球上的其他生命，并带给我们深层的满足。尽管我们刚刚开始理解这种本能的进化起源和神经生物学影响，但亲生命设计已成为建筑领域一个日益增长的新趋势。著名的原型是弗兰克·洛埃德·赖特的落水别墅（Fallingwater）。这栋建筑坐落在瀑布旁的林间小径，面向下坡，其悬挑式的两层结构让人联想到岩石边缘，室内能听到水的低语。这栋建筑于1937年首次被入住，至今仍是人类适应自然的历史典范。


    另一件亲生命设计的杰作是位于华盛顿的芬兰大使馆，由米科·海基肯森（Mikko Heikkinen）和马库·科农宁（Markku Komonen）设计，因设计和能源效率获得过许多大奖。室内处处采光。在我看来，这栋建筑最显著的特征是它的位置，不是修剪整齐的草坪，而是未受干扰的自然边缘。芬兰的玻璃墙让你从地面就能看到森林。


    到21世纪末，如果目前的人口预测准确且地球幸运，人类人口将达到约120亿，比现在多出50%。大多数人将住在城市里。这些城市将变成什么样，作为异常密集的生物量的家？它们会变成石质的、气候控制的大楼，满足居民所有乌托邦式的愿景和愿望（就像蚁丘一样）？还是规划者会找到某种方法让自然进入，让人们接近自己的遗传遗产？它们能让我们保持完全的人性吗？


    我在《半地球》（Half-Earth）中提出的另一种让自然进入的方法是使用墙大的电视屏幕，让我们在家中观看世界上最棒的野外栖息地。我个人的选择将包括塞伦盖地的水坑、亚马逊森林冠层、印度尼西亚的珊瑚礁、一只被标记的大白鲨沿太平洋岸的旅行，以及热泉中微小的细菌和藻类森林（许多专家认为那是地球上最早生态系统之一的遗迹）。


    此外，正如蒂莫·比特利（Timothy Beatley）在《亲生命城市：将自然融入城市设计与规划》（Biophilic Cities: Integrating
    Nature into Urban Design and Planning, 2011）以及其他志同建筑师所言，将自然的一部分引入我们的城市并不困难。现有的公园和其他规划中的公园可以播种以维持丰富的本土生物多样性。空地、建筑间的缝隙和闲置的河岸带可以允许其自然动植物群再再生，并用于休闲和教育（例如芝加哥野外计划的实践）。花园和管理的自然生态系统可以种在闲置的屋顶空间，利用藤植物和自然岩地植物装饰即使摩天大楼的侧面。没有哪座城市的居民在满足了个人需求后，不能享受蝴蝶的飞舞、早春花的游行，甚至偶尔体验到猎隼在狭小但真实的本土森林中俯梭的惊险。


