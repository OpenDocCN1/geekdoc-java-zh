    人文科学；创意艺术、语言学、历史、法学、哲学——道德推理和神学。


    人们似乎——用“感觉”或许更贴切——人类智力与情感的结合是唯一可能获得创造力的。我们物种的这种诊断性特征经过了近四十亿年的形成，似乎需要演化中的某种独特特征，或者是上帝之手特别向我们族群的延伸。


    这种统治了数千年宗教思想的假设几乎可能是错误的。在自然界中很容易找到先进社会组织作为替代的跳板，其中某些在演化过程中可能已经转向了人类水平。考虑一下非洲和南美卓越的筑巢蚁，技术上称为大白蚁（macrotermites）。它们由土壤和粪便筑成的土巢中聚居着数十万到数百万蚂蚁，高度甚至超过人头。像人类的居所一样，它们的住所设计得极其精妙。在某些物种中，蚁穴通过复杂的管道系统进行空调调节，这些系统持续从周围地面循环空气，并通过对流将聚集聚集产生的热空气从蚁穴中排出。每个大白蚁群落都包含一个由不育工人组成的无产阶级和它们的两个父母，一对负责所有繁殖的皇室成员。这如何可能呢？体型如两个拇指大小的蚁后连续产下一系列微小的卵。工人通过分工形成不同的体力阶层，包括一支由自杀性的、凶猛的、大头士兵组成的大军。（我曾需要帮助将它们镰剑状的大颚从我右拇指的网膜中剥离。）


    居民留在蚁穴的地下以及在蚁穴下方挖掘的数米深迷宫般的走廊和室室内，只有少数显著的例外：飞行的处女蚁和它们的配种雄建立新的群落，以及晚上出来寻找死枯植物碎片的工人群。将耳朵贴近蚁穴（不要太近！），能听到无数微小蚂蚁移动发出的细微嘶嘶声。这些夜间收获被用于在地下花园中种植一种食用真菌。


    大白蚁是真正的超级有机体。每个群落的集体智能仍然远低于人类和其他哺乳动物的水平，甚至低于大多数鸟类，但远高于独栖昆虫。


    然而，它们的创造力仍然为零。让我们假设它们在演化过程中上升到了人类水平。如果我允许创造一个术语，它们的“蚁巢城”（termitories）将包括：对绝对黑暗的热爱（以及对微弱光亮的产生类似德古拉式的恐慌）；专门食用培养的蘑菇；性活动限于皇室；以及对所有潜在移民的死亡，即使是来自同一物种。群落中的病患和伤员会被立即且预防性地吃掉；没有医院，没有怜。


    考虑这一点。在未来一两个世纪内，空间技术可能让我们近距离观察系外行星，其他星系的行星。随后将会对生命的证据进行密集搜索。如果发现了生命，而且是一个或多个智能物种，我们应该做好面对任何事情。


    # 2


    # 人文科学的诞生


    人文科学并非诞生于迈锡希腊的口头史诗、早期苏美尔压在粘土上的文字，或是古王朝时期埃及雕刻的神灵。这些元素都未超过一万年，在我们物种的历史中只是弹指之间。我们也不会在肖韦特和苏洛拉西的洞穴壁画，或在施瓦比亚的侏拉山脉的鸟骨笛中发现人文科学的黎明。这些器物是已知同类器物中最古老的，它们是在三千年前制造的。


    人文科学的诞生发生在更久远的时间，接近一万年前，它发生在一个回想起来最符合逻辑的地点和环境中：早期人类营地的夜晚火光下。


    这是由来自古古生物学、人类学、心理学、脑科学和演化生物学不同领域的研究人员拼凑出的结论。这项研究是寻找人类物种自身起源的一部分，也是科学和人文科学的圣杯。它提醒我们，历史是文化演化的故事，而史前是基因演化的故事。史前不仅告诉我们文化历史之前发生了什么，还告诉我们为什么人类物种整体遵循了某条特定的轨迹而非另一条。


    让我们暂时回溯深邃的时光。为了比较可能遵循的各种轨迹，研究人员拥有大量现有的旧世界灵长类动物。这些受体包括猴子和类人，它们是我们现存最接近的系统发育亲戚。反过来，它们包含了最可能是人类先决条件的阶段。


    我有幸专注于社会演化，在野外观察了两个物种：绿矮猴和狒狒。我曾在一个半野生的恒河猴群中度过三天，并由先驱灵长类学家斯图特·阿尔特曼（Stuart Altman）指导。我曾在埃莫里大学的耶克斯灵长类研究中心与坎西（Kanzi）共进午餐，它是一个被高度研究的圈养黑猩。坎西所在的物种曾被称为矮黑猩，被认为是灵长类动物中最像人类的。


    对这些及相似物种的专家级研究表明，它们的大部分时间都用于探索环境寻找食物。较小比例用于社交互动，包括结带和服从、理毛、求偶、交配、处理幼崽、食物的发现与获取、领导力和顺从。


    对每个旧世界猴类和类人猿的研究越来越多地关注于每个成员在观察和与其他成员互动时学到了什么。兴趣的中心是这种动物如何利用这些社交信息。当它模仿同伴时，科学家们会问，它究竟在模仿什么——是同伴的精确动作，还是动作的结果？例如，如果同伴在拉，科学家们会问，它究竟在模仿什么——是同伴的精确动作，还是动作的结果？（此处原文存在大量重复错误，翻译时已去重并保持逻辑）

