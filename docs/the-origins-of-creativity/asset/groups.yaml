    in the presence of this continent, compelled into a aesthetic contemplation he
    neither understood nor desired, face to face for the last time in history with
    something commensurate to his capacity to wonder.


    The understanding of the creative arts by critics, as experts in the subject are
    called, tends to approach through stages. Their reviews of a particular work by
    its signature often features a comparison with the artist’s earlier work and reputation.
    It holds the readers’ interest until (in longer reviews) the details of its contents
    are scanned. Next may come contemplation of what the artist intended, taking into
    account his life story and circumstances leading to this particular work. Finally
    there is judgment, a summing up with placement on a scale ranging from dismissal
    to fulsome praise. Reviews and criticisms themselves can be works of art, albeit
    of a separate kind. Brahms’ Second Symphony is a great work of art; its analysis
