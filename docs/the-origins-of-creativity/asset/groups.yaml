    paradigms.”


    Therewith she conjures the magic in the unknowable, once called by Nietzsche the
    colors at the edge of the rainbow. She chooses Joseph Conrad, who spoke of “that
    mysterious, almost miraculous, power of producing striking effects by means of
    detection, which is the last word of the highest art.” She appends the source
    of her own conviction that we take poetry in particular, unclassified, exactly
    as the poet conceived it:


    “All my later work has stemmed,” she concludes, “from the compulsion to explain
    the direct power of idiosyncratic style, to convey the import of poetry.”


    What a lovely journey Helen Vendler has taken, and how well she has marked her
    trail for others to follow. Nevertheless, art criticism needs to excavate much
    more deeply. It stands to make a lot more sense, most certainly amplified with
    knowledge originating in science. Otherwise the creative arts will continue to
    grow like trees sprouted outside the forest, less a part of the living world ecosystem.


    ![](img/4f9a8e761ebbf74595dea645718a093a_41_0.png)


    The ever-fluctuating colors, the spectral pygmies rolling, flying, leaping among
    the letters; the ripe bloom of quiet corners, the living light and bursts of flame
    . . . make the page seem to move and quiver within the boundaries.


    And sometimes a description has a compelling beauty, even when much of visual
    art, it exaggerates the factual claims within it. Such is the exquisite closing
    by F. Scott Fitzgerald of *The Great Gatsby*.


    And as the moon rose higher the inessential house began to melt away until gradually
    became aware of the old island that featured once for Dutch sailors’ eyes—a fresh,
    green breast of the new world. Its vanished trees, the trees that had made way
    for Gatsby’s house, had once pandered in whispers to the last and greatest of
    all human dreams; for a transitory enchanted moment must have held his breath
    in the presence of this continent, compelled into a aesthetic contemplation he
    neither understood nor desired, face to face for the last time in history with
    something commensurate to his capacity to wonder.


    The understanding of the creative arts by critics, as experts in the subject are
    called, tends to approach through stages. Their reviews of a particular work by
    its signature often features a comparison with the artist’s earlier work and reputation.
    It holds the readers’ interest until (in longer reviews) the details of its contents
    are scanned. Next may come contemplation of what the artist intended, taking into
    account his life story and circumstances leading to this particular work. Finally
    there is judgment, a summing up with placement on a scale ranging from dismissal
    to fulsome praise. Reviews and criticisms themselves can be works of art, albeit
    of a separate kind. Brahms’ Second Symphony is a great work of art; its analysis
    by Reinhold Brinkmann is an excellent example of art criticism.


    Some of the best within the creative arts do not disturb the aesthetic sense,
    they astonish. The best way to raise this bar is to follow a statement immediately
    by its contradictions. This device used by Charles Dickens in *A Tale of Two Cities*
    may never be surpassed.


    It was the best of times, it was the worst of times, it was the age of wisdom,
    it was the age of foolishness, it was the epoch of belief, it was the epoch of
    incredulity, it was the season of Light, it was the season of Darkness, it was
    the spring of hope, it was the winter of despair, we had everything before us,
    we were all going direct to heaven, we were all going direct the other way—in
    short, the period was so far like the present period, that some of its noisiest
    authorities insisted on its being received, good or for evil, in the superlative
    degree of comparison only.


    In yet another medium, photography, Rachel Sussman''s collection *The Oldest Times
    in the World* presents candidate teachers and other plants thousands of years
    in age. Like rare human supercentenarians (110 years old or older), they tend
    to inspire awe, forcing us to think back to the reality of the vanished time in
    which they spent their youth. Seeing these thoroughly remarkable individual organisms
    brings with it a troubling negative correlation: many of the species to which
    the ancients belong are very rare, some close to extinction. The international
    champion in both categories is a 43,000-year-old King''s holly (Lomatia tasmanica)
    living in Australia, which correctly dated is not only the oldest recorded but
    also the last of it.


