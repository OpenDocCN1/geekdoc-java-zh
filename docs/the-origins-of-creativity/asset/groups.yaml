    Number 8.


    Creative artists in all fields have nevertheless fallen short of exploring the
    potential of wildlands and the biological diversity within them. There is the
    evolution leading to the multiplication of species, as well as initial chaos crystalizing
    into orderly ecosystems; and invasive species obliterating ancient natural ecosystems;
    and many more natural and human-caused processes that can be translated into ideas
