    ## 为什么自然是母亲


    在人类存在的几乎十万年里，自然一直是我们的家园。在我们的内心，在最深处的恐惧和渴望中，我们仍然适应于它。在农场、村庄和帝国发明一万年后，我们的灵魂仍然栖息在自然世界的生态母体内。


    我们无法在这个自给自足的环境之外长期生存。我们存在于狭窄的生物生态位中，最终取决于它的广阔。自然世界拥有令人谦卑的力量和永的生命，所以我们有理由称之为大自然母亲。她被我们的活动所破坏，但这并不是什么新事。从长远的地质尺度来看，人类只是另一个扰动。就让她隐喻地为万世说话吧，就像演员朱莉娅·罗伯茨代表国际自然保护协会表演的那样：


    > 我并不真正需要人类，但人类需要我

    > 是的，你的未来取决于我

    > 当我繁荣时，你就繁荣

    > 当我衰落，你就衰落，甚至更糟

    > 但我已在这里万古

    > 我曾喂养过比你伟大的物种，

    > 我也饿死过比你伟大的物种


    > 我的海洋，我的土壤，我流动的溪流，我的森林，

    > 它们可以接纳你，也可以抛弃你

    > 你每天选择如何生活，无论你是关注还是

    > 忽视我，对我来说并不真的重要

    > 无论如何，你的行为将决定你的命运，而不是我的。


    我们是地球上不听话的孩子，离开家去城市闯荡。但正如科学家们发现的，正如我所强调的，我们的基因中仍然含有许多大自然的特征。在我们在自然界漫长的居住期间，演化在我们通过姿态和面部表情交流的方式中留下了不可磨的印记——达尔文的隐喻。我们在最想居住的环境选择上也是与生固定的。得益于华盛顿大学的
    Gordon H. Orians 以及其他科学家和人文学者的开创性研究，我们对所谓的“栖息地选择本能”有了很好的了解。测试过不同文化背景的人对以下居住位置表现出偏好：位于高地土地，俯瞰一片点缀着小树和树丛的广阔稀树草原；背后有岩石表面或茂密森林作为屏障；最后是湖泊、河流或其他水域。他们的欲望景观与我们人类和史前人类起源的非洲环境非常接近。


    来自亚洲、欧洲和北美的艺术家在他们乡村和森林环境的绘画中展现了同样的组合。总的来说，他们避开了以温带落叶林和针叶林为特征的北方温带原始环境。当描绘这种环境时，通常会插入草地和湖泊来柔化。这为人类祖先的本能偏好留下了空间。


    Orians 通过引入生物完善了“稀树草原假设”。园艺师广泛使用的树木形状——从京都的寺庙到英国的男爵庄园——与非洲稀树草原上金金树具有共同特征：相对于矮矮的高度，它们倾向于拥有异常宽大的树冠、短的树干和小而分裂的叶子。日本人已经育了一千多年的枫树和橡树，目标正是为了完善这些品质。我可以证明，甚至在了解到稀树草原假设之前，我最喜欢的树（现在仍然是）就是日本枫。


    是什么引发了人类对像非洲稀树草原这类栖息地的偏好的适应性优势？寻找答案是逻辑。所有已知的移动动物物种都需要寻找最适合其生存和繁殖的环境。它们必须找到恰恰合适的地方，并且快速且准确无误地到达那里。我们为什么不应该在现代人类身上发现至少这种倾向的痕迹呢？


    我曾在一场景观规划师大会上演讲，期间我强调了生物亲和力，即与其他生物体接触的本能喜爱。生物亲和建筑当时正获得专业界的认可。我引入了人类栖息地偏好的稀树草原假设。我对他们相对冷淡的反应感到困惑。难道我没说清楚吗？后来我问一位建筑师朋友我是否表达了，他回答道：“噢不，只是我们早就知道这些东西了。”


    有一个简单且易于测试的原因解释了为什么稀树草原家园塑造了我们的原始渴望。从高处观察，早期人类可以广阔地观察接近敌人的食草动物。靠近水源确保了在严重干旱期间的供应。它还提供了额外的食物来源。金树独特的相貌，拥有低矮且水平延伸的树枝，允许快速攀爬以逃避狮子和其他足以捕杀人类的大型捕食者。宽敞的水平树枝是支撑物，可以在上面休息等待追击。它们还作为一个观测站，从那里扫描当地地形以寻找他们自己的猎物。


    探究为什么大多数人喜欢在森林中散步，以及为什么这种经历有助于身心健康，属于演化生物学的范畴。当然，运动有其价值，但在我们内心深处还有其他东西在起作用。在内心，我们仍然以某种方式是猎人和采集者。所以，请随我回到想象中的时代，与我们的更新世祖先之一一起狩猎。


    为了生存，我们必须睁大眼睛，保持耳朵灵敏。走四分之一里，越野行走，而不是沿着小径——捕食者和敌方侦兵躲在小径旁。良好的栖息地应该是成熟的阔叶林，位于温带欧洲、亚洲或北美任何地方。你将看到以前未注意到的植物和动物；它们只是侧面几英尺处活着而见的物种的一小部分：数十种植物、苔藓和地衣物种；无数真菌，以及成千上万的蜘蛛、马足虫、蜈蚣、螨、跳虫等。（即使在华盛顿特区的罗克溪公园或纽约的中央公园，一把抓也可能包含等待被发现的物种。）


    这就是我想表达的观点：对于那些学会吸收自然的人来说，自然的体验是一口魔井。你越努力汲取，可汲取的就越多。在早期访问野生环境时，你会错过大部分有趣的事。随后你会发现更多，更多，并开始为你看到的事物命名。接着会有一些细节。每种物种，正如你所学到的，都是一个故事。一位昆虫学家朋友在佛罗里达退休后，在他的后院一代又一代地追踪每一只红蝶，从幼虫到成虫。这看起来可能是一个徒劳的追求，但我可以告诉你，他发现红蝶是具有独立个性的复杂蝴蝶。


    你不需要旅行到亚马逊或刚果就能体验荒野。在我所谓的“微荒野”中，存在足够的新奇和挑战。一种新的自然写作流派已经出现，探索小斑块和精细细节的潜力。安妮·迪拉德是《丁克尔溪朝之旅》的先驱，该书在1974年获得了普利策奖。许多其他值得关注的例子包括
    David M.Carroll 的《追水：一个水文学者的笔记》（2009）、David George Haskell 的《未见的森林》（2012）以及 Dave
    Gould 的《草地里的嗡嗡声：一个法国农场的自然史》（2015）。这些作品将科学自然史与诗意诠释相结合，使不可见的显现，微小的变得巨大，并在所有维度直观地体验生命的美。


    在小空间内看似无限的生物多样性，这一达尔文在《物种起源》结尾处著名的命名为“错综复杂的岸”的图像，不可能逃过至少一些创意艺术家的注意。我被杰克逊·波洛克著名的1950年作品《秋之节奏》所吸引，在散视时可能代表了对荒疏的英国路边或其他生态系统的初见，以及


