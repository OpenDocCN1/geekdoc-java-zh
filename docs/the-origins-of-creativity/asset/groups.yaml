    这种物种的第一件标本由一位德国昆虫学家于 1915 年描述，他将其命名为科学学名 *Lordomyrma rupicapra*。首个术语包含了希腊语中表示“蚂蚁”的表达。第二个术语
    *rupicapra* 借用了欧洲“岩羊”（*Rupicra rupicapra*）的名字，因为从上方看，其身体中部的线条和形状让人联想到岩羊。


    这场一个多世纪前的发现，仅仅是按照欧洲自然史宏大风格进行的探险中的一个极微小的事件，尽管当时对新几内亚的动植物了解尚较少，但捕获的那个标本记录了历史，而且这项事业的精神同样重要。这段描述是探索性自然史中最好的记录之一，值得全文引用。


    *L. rupicapra* 的模式标很可能采集于一个高海拔、经证明的云雾森林地区。采集者 S. G. Burgers 是军医官兼动物学家，参加了著名的德国“奥古斯塔皇后河探险”（1912-1913），在为期
    19 个月的时间探索了塞皮克河流域及其源头。科学考察队进入了 560 英里快艇可航水区域的远上游。他们进行了四次平均 3 个月的上游陆路。所有延伸至上述地区的塞皮克支流（现在的巴布亚新几内亚和印度尼西亚西巴几内亚）均已探至其源头，并进入了贝瓦尼山脉、托尔切利山脉（北部）以及中央山脉（南部）（Sauer,
    1915; Behmann, 1917, 1922）。地理学家 Behmann 的叙述提到在“潮湿、寒冷的 2000 米高峰”上采集标本，并穿过了“2000
    米高的施拉德山脉”（约南纬 4°59''，东经 144° 05''）。国家植物馆采集探险植物学家 C. L. Ledermann 的采集地记录包括四处海拔高于
    1000 米的地点：南纬 4°50''，东经 142°29''，1000 米；胡恩斯坦因山（南纬 4°29''，东经 142° 42''），1350 米（在山顶停留了
    17 天）；以及“Holrungberg，1800–2000 米”。引用的坐标为探险营地的坐标。


    我本可以在此处此处不提这一物种的发现，但关于捕获的描述结合了科学和人文领域共同存在的两种原型。带我来到新几内亚的地理探索和科学发现的吸引力，在地球剩余的荒野中依然可以唤起。它们不由地投向创作艺术，恳求对自然世界给予更多关注。


    为了同样的目的，我将结束关于猎人伦理的描述，讲述 1952 年与弗拉基米尔·纳博科夫（Vladimir Nabokov）的相遇，我是自然史领域的灵魂伴侣。我当时是一个二十三岁的研究生，在哈佛大学比较动物学博物馆写博士论文。纳博科夫五十三岁，他作为英语小说家的名声尚未到来。我当时只知道他是一个鳞翅目专家，一位蝴蝶专家。他的专长是蝴蝶——这种构成蓝蝶科分类的小型、色彩鲜艳的昆虫。纳博科夫早年在哈佛大学蝴蝶标本室工作，他添加的标本现在被许多文学历史学家昆虫学家所推崇。[等等，由于原文似乎不完整，此处翻译可能存在断层]


