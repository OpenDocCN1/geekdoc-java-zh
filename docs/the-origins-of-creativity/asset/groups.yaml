    \ can value no less the innovations, only a few of which prove successful, that\
    \ drive the creative arts.\n\n# 5\n\n# AESTHETIC SURPRISE\n\nSerious art, whether\
    \ expressed in score, script, or image, seizes you on first encounter. It then\
    \ holds and distracts you long enough to lead your mind away and through the remainder\
