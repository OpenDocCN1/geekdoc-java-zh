    The humanities and science address segments in the single continuum of creative
    thought, from the molecular processes of heredity to the emotional responses they
    program, reaching through all space and time. Above, the underside of an African
    swallowtail (*Papilio lormieri*), produced by the evolution of one particular
    genetic code. (Photograph by Robert Clark.) Below, a segment of DNA with a fragment
    of the histone proteins around which DNA is wound. (Image created with Molecular
    Maya [Clarafi.com] by Gaël McGill, precisely as it would appear if viewed by ultra-magnification.)


    # III


    Science and the humanities share the same origin and brain processes of creativity.
    They can be drawn closer together and widely joined in substance through a more
    thorough application of five disciplines—paleontology, anthropology, psychology,
    evolutionary biology, and neurobiology—bound together by the evolutionary process
    in heredity and culture.


    # 8


    # ULTIMATE CAUSES


    The best criticism is often brilliant, rising from deep intuitive wisdom. Nevertheless,
    due to the extreme subjectivity of the subject, the insights easily slide across
    the surface and off target. We are told by Wallace Stevens, for example, Picasso
    meant for cubism to serve as a metaphor of the fractured disorder of the modern
    world. Picasso himself explained that cubism was to possess “flexibility,” with
    the figure on canvas depicting a stage of development capable of transformation
    to other stages.


    The intent of the artist is intensely idiosyncratic and difficult to assess. For
    his part, Matisse allowed that he was in a fury to create new perceptions, delivering
    repetitive shocks of the new. Gauguin assembled his Tahitian masterpiece, *Where
    Do We Come From? What Are We? Are We Going?* as a panopy of the human life. He
    then set out to commit suicide in the hills above Papeete, but changed his mind
    and moved to the Marquesas Islands. In the Rothko Chapel at Rice University, the
    artist’s last work, subjectless and formless, represents, according to the master
    critic Robert Hughes, an astonishing degree of self-banishment. All the world
    has been drained out of them, leaving only a void . . the viewer is meant to confront
    the paintings in the same way as the fictional viewers, gazing for the sea in
    a Caspar David Friedrich, were seen confronting nature: art, in a convulsion of
    pessimistic inwardness, is meant to replace the world.


    In the house climate of experimental arts and criticism, it is not surprising
    that bizarre subcultures sprout abruptly and randomly, like courageous mushrooms
    and dandelions on an otherwise well-tested lawn. They defy coherent explanation
    itself: Dadaism, hyper-realistic cans of tomato soup, postmodern philosophy and
    literature, heavy metal and atonal music. Whether emanating from ordered or disordered
    minds, they give us glimpses of, still disordered unfortunately, of the emotional
    checkpoints and decision centers of the subconscious- (Note: decision centers
    of the subconscious mind.)


    Preliterate societies of pure hunter-gatherers and primitively agricultural hunter-gatherers
    still surviving have a great deal to tell us about the natal millennia of prehistoric
    culture. Their lives may look simple. They don''t watch television (most don''t,
    yet!), or search the Internet, or drive to the supermarket for groceries. Still,
    the Kalahari Ju/''hoansi, to take my favorite and one of the hunter-gather societies
    closely studied, know the geography of their territories like a street map, and
    back across hundreds of square kilometers—and within them every fruit tree, waterhole,
    potential campsite, and lookout hillock. Their vocabulary may be very small compared
    to that of modern urbanites, but they can name and describe plants and animals
    with expertise rivaling that of taxonomy-trained naturalists. Their conversations
    and storytelling, focused on business in daylight and at most everything else
    in firelight, are diverse and detailed, and in the case of the Ju/''hoansi sprinkled
    with words abetted by three kinds of clicks, each made in a different part of
    the air passage.


    So what can we learn from the Ju/''hoansi and more generally, the Old Way of life?
    As background, each human being, with no exception, belongs to a single, reproductively
    isolated species of animal confined by its idiosyncratic biology and social behavior.
    Before this characterization can be read as a hint of divine interpretation, be
    aware that the same can be said of hundreds of other social species, from siphonophore
    jellyfish and spinning communal spiders to female mammals like porpoises and wolves.
    Whales grow to great size by seining tiny crustaceans, bats fly at night by echolocation,
    birds fly at night by the polar magnetic field. Humans think.


    From scientists we''ve learned about the early stages of this evolution. It turns
    out that three preconditions came together to produce human-grade species. The
    first was the creation of the campsite, made possible by the shift in diet as
    the ancestral Homo erectus. A review I have made of the origins of all known complex
    societies throughout the history of the animal kingdom, representing twenty independent
    lines in total, revealed that each was preceded by the instinctive construction
    of nests in which the young were raised with the aid of parental care. For the
    social bees, wasps, and ants, the nests were variously subterranean or arboreal,
    and contained special compartments for the developing young. For social thrips
    and aphids the nurseries were cavities already present within living plants. Social
    marine shrimp used chambers excavated in living sponges. The nests of early humans
    were campsites warmed and lit by controlled fire. A widespread but uncommon adaptation,
    nest building to accommodate progressive rearing of offspring, was the base from
    which the rare human level could be approached.


    This most advanced trait of social organization, possessed by the twenty evolutionary
    lines, is "eusocial" behavior, in which division of labor is not based on cooperation
    among equals but on organized cooperation in which the group members assume long-term
    roles. To qualify as eusocial in scientific classification, the roles are marked
    by the programmed survival and reproductive success of some of the members. Put
    simply, altruism exists. A portion of the group members make sacrifices for the
    good of the group.


    The second precondition for the origin of human societies was high levels of cooperation
    among members of the group. Each person knew all the others, and something about
    their labor roles, their ability, and their character. Division of labor, altruism,
    and cooperation evolving together put a high premium on social intelligence. In
    particular, their combination enriched communication. Because the earliest humans
    were audiovisual, they were able to evolve a capacity for spoken language. The
    words were created originally arbitrary in meaning and became universal in usage
    within groups. Sounds are made and fade swiftly. Unlike visual signals they pass
    through opaque obstacles, if thin, and turn corners. (Note: grow rapidly in numbers.)


    Within groups, those with better capacity for language had enjoyed higher survival
    and reproductive rates than their primate rivals. More importantly, in competition
    between groups, those who won were superior not only in mortal territorial aggression
    but also in the ability to form alliances, develop trade, and extract materials
    and energy from sources in the natural environment.


    Thereafter the brain grew from 900 cc in the ancestral Homo erectus to 1,300 cc
    or even higher in the early Homo sapiens. Viewed from a distance, it should be
    no surprise that we spend most of our time chattering while scribbling pictures
    and symbols. And why, in societies too large to know all its members, we treasure
    and gossip about celebrities.

