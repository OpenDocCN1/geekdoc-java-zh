    精美的小说和古董照片是历史的像素。它们组合在一起，创造出一幅人们真实生活的影像，日复一日，一分一刻；在文学领域，则是他们感受到的情感。最后，它们追踪了随之而来的某些似乎无尽的后果。这就是为什么我们珍视普鲁斯特，为什么我们在约翰·阿普迪克（John
    Updike）的殿堂中为他留席——正如阿普迪克本人所说，他卓越地诊断了美国小镇新教徒中产阶级的生活与弱点，特别是在20世纪后期。


    创意艺术领域的这种创新在另一个方面至关重要。艺术的演变与有机演化在运作方式上是相似的。顶尖艺术家和表演者寻求原创的方式，通过图像、声音和故事来表达自己。原创性和风格就是一切，其程度通过创新吸引模仿的程度来衡量。因此，1863年拒绝沙龙（Salon
    des Refusés）对巴黎沙龙（Salon of Paris）的挑战是视觉艺术中的一个经典案例。立体主义与写实主义的对抗，以毕加索1907年的*亚维农少女*（*Les
    Demoiselles d''Avignon*）为标志是另一个例子。流行文化中，则是1932年华特迪士尼的彩色电影《花与树》（*Flowers and Trees*），以及20世纪60年代融合灵魂乐、布鲁斯和流行音乐而成的摩塔唱（Motown）。这一过程可能是永恒的。而且突破层出不穷：突破将加速创新者的心，坚起他们的脊梁，鼓励他们寻求突破。到20世纪后期，所有创意艺术中新技巧和新风格的实验呈指数级增长。荒诞狂野的抽象艺术在神秘无调性音乐背景下展现。为了原创而原创加入了创意艺术大师的行列。


    对于立体主义的起源，毕加索将“变形”作为他的核心目标：他说：“任何展示自己分量的艺术家，”


    > 都必须表现出尽可能的塑性。因此，表现一个苹果：如果你画一个圆，它就是第一级的塑性。然而，艺术家可能希望具有更大的塑性，在这种情况下，所表现的对象最终将描绘成方形或立方体的形状，而这并不否定模型。


    对创新的追求可以被视为基因进化的类比，且效果良好。文化演化使我们适应不可避免且不断变化的环境条件。它的创新等同于基因组中的突变。这些生物学事故发生在人类历史中，其方式和程度与其他物种相同。突变是非常多样化的。它们个体上是罕见的，在大多数情况下要么是有害的（因此导致了数百种令人不快且熟悉的遗传性疾病，如色盲、囊性纤维化和血友症），要么是中性的，对健康或生殖没有可检测的影响。随着时间的推移，它们会消失，或者最多保持极低的频率，后者是通过作为隐性性基因与显性有利基因在同一位点共存。只有极少数突变是成功的，它们使携带这些突变的个体受益并在整个群体中传播。有时它们会产生巨大的后果。一个例子是规定乳糖耐受的突变基因群。DNA碱基对的小随机变化使得饮用牛奶成为可能，乳制品业随后遍布世界大部分地区。另一个案例是镰型细胞突变基因，双剂量会导致致命性贫血，但单剂量却能防止同样致命的疟疾。


    我们身体中携带的所有失败和中性基因被遗传学家称为“突变负荷”（mutation load）。从这些之中，通过进一步的突变和偶然有利于它们的环境变化，形成了今天的人类有机生物学。我们同样珍视驱动创意艺术的创新，尽管只有少数被证明是成功的。


    # 5


    # 审美惊喜


    严肃的艺术，无论是通过乐谱、剧本还是图像表达，在第一次相遇时就能抓住你。然后，它会吸引并分散你足够的时间，引导你的思想离开并穿过其剩余的内容——也许是为了理解全部意图，也许是为了出于纯粹的快乐而重温某个片段。创意作品的整体感觉（称之为“特征”）可能出现在开头或结尾，有时甚至在体验之后，当它被存储在长期记忆中时，它是回想时进入意识的第一个念头。


    特征引入了审美惊喜，这种惊喜仅仅是美的，或者在本能上极具吸引力。例如在视觉艺术中，它既存在于高帆的巡游中，也存在于泰坦尼号沉没时末日般的倾斜中；古斯塔·克里姆特（Gustav
    Klimt）在阿德勒·鲍尔肖像中超现实的设定，似乎将女士融进了金属里；弗朗西斯·培根（Francis Bacon）在他残酷的自画像中的夸张，喊出了完全诚实带来的毁灭性后果；以及由C.W.安德森描绘的1948年三冠王赛马“Citation”的石版，它与毕加索《格尼卡》（*Guernica*）中恐怖的尖叫马形成对比。


    创意艺术家在审美光谱上从美和宏伟到恐怖和死亡之间反复往复，使用定义性的特征来捕捉并吸引你的注意力。传统风景艺术的一个典型例子是阿尔弗雷德·汤普森·布里彻（Alfred
    Thompson Bricher）在沉闷的褐色和橄榄色岸景背景下，在破碎的海浪上方放置醒目的白色泡沫。在抽象艺术中，汉斯·霍夫曼（Hans Hoffmann）的《杰作》（*Magnum
    Opus*）在大片亮红色色块中呈现出一个显眼的黄色矩形，侧增加了一个神秘的黑块。眼睛被迫移动：从黄到红，再到黑。其目的留给你的潜意识决定。


    呈现和响应简单识别特征的本能并非人类所有。它等同于行为科学家识别的“信号刺激”（sign stimulus）或“释放器”（releaser）。突变是非常多样化的。它们个体上是罕见的，在大多数情况下要么是有害的（因此导致了数百种令人不快且熟悉的遗传性疾病，如色盲、囊性纤维化和血友症），要么是中性的，对健康或生殖没有可检测的影响。随着时间的推移，它们会消失，或者最多保持极低的频率，后者是通过作为隐性性基因与显性有利基因在同一位点共存。只有极少数突变是成功的，它们使携带这些突变的个体受益并在整个群体中传播。有时它们会产生巨大的后果。一个例子是规定乳糖耐受的突变基因群。DNA碱基对的小随机变化使得饮用牛奶成为可能，乳制品业随后遍布世界大部分地区。另一个案例是镰型细胞突变基因，双剂量会导致致命性贫血，但单剂量却能防止同样致命的疟疾。


