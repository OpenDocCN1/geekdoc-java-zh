    # 11


    # GENETIC CULTURE


    The exponential growth of brain size launched during the habiline period of prehistory
    around two million years ago was the most rapid transformation in the complexity
    of an organism in the history of life. It was driven by a unique mode of evolution,
    called gene-culture coevolution, in which cultural innovation increased the rate
    at which genes favoring intelligence and cooperativeness were spread more rapidly;
    and, acting in reciprocity, the resulting genetic change increased the likelihood
    of cultural innovation.


    By a widespread consensus, the scenario drawn by scientists thus far begins with
    the shift by one of the African australopiths away from a vegetarian diet to one
    rich in cooked meat. The event was not a casual change as choosing from a menu,
    nor was it a mere re-wiring of the palate. Rather the change was a full hereditary
    makeover in anatomy, physiology, and behavior. The body was slimmed, the jaws
    and teeth shrunk and grew lighter, the skull swelled and assumed a globular shape.
    The society changed, from a band wandering in the merry of chimpanzees through
    a protected territory, with its members foraging for food independently or in
    small troops, into a larger, better coordinated assembly comprising teams of hunters
    and gatherers. All left and returned, in the manner of wolf packs, to fixed dens
    and rendezvous. These habilines,'
