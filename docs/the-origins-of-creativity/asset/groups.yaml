    it became necessary for our ancestors to cooperate more closely for forays. Then,
    when a large food item was found by scavenging or the down of prey, there had
    to be sharing in a way that avoided potentially lethal combat. The hunting and
    scavenging of large animals opposed to collecting vegetable materials required
    a communal rendezvous, or den, or both.


    Finally, to cap this adaptive shift (as evolutionary biologists call it), the
    advantage of carnivory was strengthened by the control of fire. From a nearby
