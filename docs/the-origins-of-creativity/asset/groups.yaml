    I did it myself as a Boy Scout on the edge of a dying fire in the pine savanna
    of Alabama. I found that when camp fires carelessly tended start forests, the
    reverse is also true: fire can be harvested and brought to camp. There was really
    no need for prehumans to start fires using flammable material with flints or spinning
    wheel.


    It is widely believed by experts that the habiline ancestors of modern humanity
    followed this scenario of carnivory and thereby a radical evolution of brain size
    and social intelligence. The theory has not yet been proven conclusively, but
    is supported by the fossil evidence of campsites and controlled fire in Homo erectus,
    a descendant of Homo habilis and direct ancestor of our species.


