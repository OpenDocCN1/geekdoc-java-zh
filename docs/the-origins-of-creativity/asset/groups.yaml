    # 4


    # INNOVATION


    What exactly is creative literature, by what means language rendered as art? And
    how are we to judge it as such? The answer: by its innovation of style and metaphor,
    by its aesthetic surprise, by the lasting pleasure it gives. Let me begin by example.


    A reader knows he is in the presence of greatness when he reads the following
    lines by Vladimir Nabokov:


    > Lolita, light of my life, fire of my loins. My sin, my soul. Lo-lee-ta: the
    tip of the tongue taking a trip of three steps down the palate to stop, at three,
    Lo. Lee. Ta.


    To shed light on the infinite importance of literary style, I believe useful to
    add for comparison the first lines of Jonathan Franzen''s Corrections, winner
    of the 2011 National Book Award and widely praised for its innovative style:


    The madness of an autumn cold front coming through. You could feel it: something
    terrible was going to happen. The sun in the sky, a minor light, a cooling star.
    Gust after gust of disorder. Trees restless, temperatures falling, the whole northern
    region of things coming to an'
  - '[PAGE 32]


    end. No children in the yards here. Shadows lengthened by yellowing zoysia. Red
    oaks and pin oaks and swamp white oaks rained acorns on houses with no mortgage.


    While I realize have no credentials as a critic of fiction, this sounds to me
    like a painfully ostentatious display of learning by a Harvard sophomore with
    a great deal of promise. One gets the feeling that as literature this long book
    may not lift the runway. For some it does; for me it does not. The Franzen novels
    thus are characterized by a sweeping simulated exactitude. Their protagonists
    are steered by a jumble of brand names, undefined technical terms, allusions to
    philosophy, and whatever else the author has come in his ruminations and can add
    to his literary soup. They belong to a category the critics James Wood has called
    hysterical realism. In their fractured stream of consciousness there exists little
    awareness of or even interest in the depths and roots of human nature.


    But let me add a perfect that in fact value in The Franzen''s subsequent, well-regarded
    novels Freedom and Purity, and in similar postmodernist works. They are ethnographic,
    giving fine-grained descriptions of the personalities and histories of dysfunctional
    Midwestern families. They are gossip of course (Franzen sounding as though he
    is your talkative friend), which is why people love biographies and fiction in
    the first person. The enjoyment is innate and very Darwinian, having evolved from
    the aforementioned Paleolithic campfire talk. Postmodern narrations cannot: it
    provides an exact snapshot of a segment of culture in a particular place and time.
    The productions are like photographs that preserve for all the people as they
    seemed, looked, or even truly, including their dress and posture and facial expressions,
    but also the surroundings most important to them—their homes, their pets, their
    transportation, their trails and streets. Who can fail to be riveted by the oldest
    surviving photograph, taken by Joseph Niepce in 1826 or 1827, the exact date uncertain,
    of so mundane as a Burgundy rooftop—immediately to be followed by street scenes
    and even a pedestrian standing, waiting at a curb next to an empty street—for
    what, until? It strikes you then how far back you have been taken in time. Lincoln
    and Darwin are still teenagers at this moment, Florida is still a wilderness,
    and no European knows the source of the Nile.'
