  md: 'five days, and found ourselves in a cold, rainy grassland dotted with palm-like
    cycads. At the time, I thought I was the first non-native to explore this part
    of the Saruwaged Range, but discovered later that an American botanist, Mary Strong
    Clemens, a very tough middle-aged lady, preceded me in the 1930s. (Surely she
    deserves a niche in the pantheon of pioneer feminists.)


    My aim, apart from the thrill of seeing a mountaintop ecosystem visited by very
    few other scientists, was to collect ants for Harvard’s global research collection.
    I looked out for other specimens of possible interest (and did pick up new species
