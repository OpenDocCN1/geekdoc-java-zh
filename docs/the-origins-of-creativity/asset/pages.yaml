  md: '# THE THIRD ENLIGHTENMENT


    Contrary to common belief, the humanities are not distinct from science. No fundamental
    chasm in the real world or process of the human mind separates them. Each permeates
    the other. No matter how distant phenomena addressed by the scientific method
    may seem from ordinary experience, no matter how vast in expanse or microscopic
    purview, all scientific knowledge must be processed by the human mind. The act
    of discovery is completely a human story. Its telling is a human achievement.
    Scientific knowledge is the idiosyncratic, absolutely humanistic product of the
    human brain.


    It follows that the relationship between science and the humanities is fully reciprocal.
    Regardless of how subtle, fleeting, and personalized human thought may be, all
    of it has a physical basis ultimately explainable by the scientific method.


    If science is thereby the bedrock of the humanities, the humanities have the farther
    reach. Where scientific observation addresses all phenomena existing in the real
    world, scientific experimentation addresses all possible real worlds, and scientific
    theory addresses all conceivable real worlds, the humanities encompass all three
    of these levels and one more, the infinity of all fantasy worlds.'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'The European Enlightenment that progressed from the seventeenth into the late
    eighteenth centuries divided knowledge into the three great branches of learning:
    the natural sciences, the social sciences, and the humanities. The social sciences
    have now largely split amoeba-like into two divisions, one fusing with the natural
    sciences and the other hewing closely in language and style to the humanities.
    Contributions from the social sciences of the first kind can be seen in premier
    journals such as Nature, Science, and The Proceedings of the National Academy
    of Sciences. Those of the second kind, allant to the humanities, are to be found
    in The New Yorker, The New Review of Books, Public Interest, and Daedalus, the
    journal of the American Academy of Arts and Sciences.


    Science and the humanities may still remain apart, but they are ever closely bonded
    in many ways. The degree of their relationship forms a continuum. At the extreme
    scientific end, the style of a typical research report in a professionally respected
    journal is relentlessly factual in content, heavy with observation and analysis,
    ostentiously cautious in conclusions, and dull in the reading. Speculation, if
    any is ventured at all, must be presented as a hypothesis subject to new observations
    and experimentation. Metaphors, which are regarded by professionals as the equivalent
    of a lighted match in an ammunition dump, must be sparse and handled gingerly.


    At the opposite end of the science-humanities continuum, where dwell the most
    creative of the creative arts, metaphors are coin of the realm. The emotional
    bump delivers aesthetic surprises, however in literature, music, or the visual
    arts, is the goal of the artist''s effort, novelty and virtuosity is its measure.
    The cognosci tend to speak about a scientific discovery in detail but not about
    the scientist, and, in reverse, critics in the creative arts say a great deal
    about the art but not much about the art.


    The blending of scientific and humanistic thought is increasing with time. The
    seismic gap that once separated them, made famous in 1954 by C. P. Snow’s “two
    cultures,” has closed, not by a narrow bridge but by a broad borderland of emerging
    new disciplines.


    As science and the humanities draw closer together, the synergy between them is
    accelerating. The humanities have always been viewed as an ensemble of disciplines
    that explain “what it means to be human.” However, this is not quite correct.
    They have described a goodly part of the human condition, largely failed to explain
    what it all means. To achieve'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'this goal will require a great deal more of the information available from
    scientific research than has been used by scholars of the humanities.


    A notable characteristic of poets and other creative artists judged major stature,
    along with the best of critics who assess their work, ignorance of the very biology
    they celebrate. They are astonished when confronted by the architecture of the
    human body, charted from organ to molecule; by the true range of the human senses;
    by the turbulent and always chaotic evolutionary history of the hominins; and
    not least by the living world that gave us birth and upon which our every breathes.
    But as a rule they remain confidently ignorant of the details. They are content
    to talk exclusively to one another.


    What exactly we have learned, for example, from the immense library of novels
    that the public devours? T. S. Eliot''s assessment is hard to refute: "Knowledge
    of life ofened through fiction is only possible by another stage of self-consciousness.
    That is to say, it can only be a knowledge of other people''s knowledge of life,
    not of life itself.


    A salient emotional trait of human nature is to watch humans closely, to learn
    their stories, and thereby to judge their character and dependability. And so
    it has ever been since the Pleistocene. The first bands classifiable to the genus
    Homo and their descendants hunter-gatherers. Like the Kalahari Ju/hoansi of today,
    they almost certainly depended on sophisticated cooperative behavior to survive
    from one day to the next. That, in turn, required exact knowledge of the personal
    history and accomplishments of each of their groupmates, and equally needed an
    empathetic sense of the feelings and propensions of others. It gives deep satisfaction—call
    it, if you will, a human instinct—not to learn but also to share emotions stirred
    by the stories told by our companions. The whole of these pays off off survival
    and reproduction. Gossip and storytelling are Darwinian phenomena.


    A major cause of the alarming decline in public esteem and support of the humanities
    is their overly narrow focus on the human condition during present and recent
    historical times. As a formal definition of the humanities, that might at first
    seem acceptable. But it has confined humanistic awareness entirely to the tiny
    bubble within the vast and biological world in which our species originated and
    in which we continue to exist. Another effect of this narrow epistemological focus
    is that it renders the humanities rootless. Although humanistic arts and analyses'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'superbly capture details of history, they remain largely unaware uncaring about
    the evolutionary events of prehistory that created the human mind, which after
    all created the creative arts and critical analyses leave unknown and unmentioned
    most of the nonhuman physical and biological processes that churn ceaselessly
    around and through each of us. We remain largely blind to the environment and
    the forces within that guide us to whatever destiny our activities foreordain.


    In their own way, scientists are equally unprepared for collaboration with creative
    artists and scholars of the humanities. The great majority of scientists are journeymen,
    researchers living out their careers within small specialized territories of knowledge
    and inquiry (nowadays often called silos). They can tell you almost everything
    known about, say, cell membranes, and the megalomorph spiders, or whatever narrow
    subject in which they are experts, but not much in depth about anything else.
    The reason is to be a real scientist—and not, regardless of how gifted, a journalist,
    a nonfiction writer, or a historian of science—is to make a certifiable scientific
    discovery. The acid test among professionals is to be able to finish this sentence:
    "I discovered . .." The importance of the discovery is judged by peers who dwell
    in the same and nearby silos. Public scientists seek above all the acceptances
    and esteem of their peers; public approval is secondary. They tend to value election
    to a national academy of science over a prize given to a best-selling book.


    The necessarily rigorous definition of authentic science is the reason that the
    great majority of scientists are content to journeymen. To conduct original scientific
    research requires an apprenticeship, during which the beginning bound subjects
    are learned, techniques mastered, and finally, in most cases, postdoctoral research
    conducted in collaboration with a senior scientist or team of scientists. The
    candidate chooses his or her specialization by personal interest and opportunity.
    In biology, which is the discipline closet in life and mind to the humanities,
    the young scientist develops a range of learning and experience that has been
    aptly called “a feel for the organism."


    Because most scientific knowledge is growing exponentially, doubling every ten
    to twenty years according to subject, specialties within disciplines multiply—while
    at the same time narrowing in scope. In the early 1950s, when I was a graduate
    student, an original research report in biology was'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'typically authored by one to three contributors. The historic 1953 article
    in Nature by James D. Watson and Francis Crick, first to describe the structure
    of DNA, was typical of opportunities that lay open to scientists working either
    or in very small teams. Today much larger teams are the rule. Dozens of coauthors
    heading a single article are not unusual. In a few subjects, such as the description
    of the complete DNA of an important species, their number may exceed a hundred.


    The 1950s and 1960s were the heroic age of modern biology, when a small number
    of talked-about champions made impressive advances against long odds. The excitement
    they generated was reflected in the popular culture. In the 1953 original film
    version of The Worlds, an alien spaceship enclosed in a large meteorite has just
    struck Earth—southern California, of course. As a crowd of locals stand around
    the center, wondering what it means, Ann Robinson’s character, a young local schoolteacher
    with unbearably feminine sweetness popular in the 1950s, says to Gene Barry’s
    character, a visitor, “There’s a scientist coming from Pacific Tech. He’ll tell
    us, ‘If the same scene were repeated today, the line would have to be, ‘Are terms
    coming from NASA and Cal Tech. They’ll try to figure out what’s going on.’


    Just in the humanities, necessary specialization has driven biologists and other
    scientists into territories growing ever smaller. Much of the advanced technology
    and technical language of one discipline is best only comprehensible to experts
    in other disciplines, even those closely related.


    Will there be heroic ages of the intellect in the future? I feel certain there
    will be, and especially in the new border disciplines that combine scientific
    discovery with the innovations and insights of the humanities. It will come in
    multiple dimensions. Outside our sensory bubble are countless prospects for the
    creative arts. The challenge is to translate the previously unperceived into the
    limited audiovisual world of human consciousness. The advance will also come from
    an increasingly clear view of the biological origins of human consciousness, which
    can bring history into alignment with history. And, finally, the advance will
    come with understanding the evolutionary forge in which culture was shaped, slowly
    and often painfully, from animal instinct.


    The philosopher’s stone of human self-understanding is the relation between biological
    and cultural evolution. Why are human beings built and'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'behaving in such and such a way and not some other? Only now, two-and-a-half
    millennia after the Athenian agora, are we beginning to understand the reason
    why some of our social behavior is hardwired instinct, some of it is acquired
    by genetically predisposed learning, and the rest is the product of cultural invention.
    The whole of it can be deeply understood only as a stage in our long-term evolution
    and not just through descriptions of the contemporary human condition.


    Meanwhile, it needs to be recognized, and talked about more frankly, for philosophy
    the elephant in the kitchen is organized religion. More precisely, the understanding
    of the human condition often foretold by the blending of science and religion
    is inhibited by the intervention of supernatural creation stories, each defining
    a separate tribe. It is one thing to hold and share the elevated spiritual values
    of religion, with a belief in the divine and in the existence of an afterlife.
    It is another thing entirely to adopt a particular supernatural creation story.
    Faith in a creation story gives comforting membership in a tribe. But bears stressing
    that not all creation stories are true, no one can be true, and most assuredly,
    all are false. Each is sustained by blind materialistic faith.


    The study of religion is an essential part of the humanities. It should nonetheless
    be studied as an element of human nature, and the evolution thereof, and not,
    in the manner of Christian bible colleges and Islamic madrassas, a manual for
    the promotion of a faith defined by a particular creation story.


    Meanwhile, because humanity is still swept along by animal passions in a digitized
    global, and because we are conflicted between what we are and what we wish to
    become, and because we are drowning in information and starved for wisdom, it
    would seem appropriate to return philosophy to its once esteemed position, this
    time as the center of a humanistic science and a scientific humanities.


    How much such a restoration be accomplished? It is worth bearing in mind that
    philosophy flourished within Western civilization during two bursts of creativity
    that lasted about 150 years each. Their essence has been concisely described by
    Anthony Gottlieb in The Dream of Enlightenment, a history of the rise of modern
    philosophy.


    The first was the Athens of Socrates, Plato, and Aristotle, from the middle of
    the fifth century to the late fourth century BC. The second'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'was in northern Europe, in the wake of Europe’s wars of religion and the rise
    of Galilean science. It stretches from the 1630s to the eve of the French Revolution
    in the late eighteenth century. In those relatively few years, Descartes, Hobbes,
    Spinoza, Locke, Leibniz, Hume, Rousseau and Voltaire—most, that is, of the best-known
    modern philosophers—made their mark.


    The second eloquence of philosophy, hence the foundation of the second Enlightenment,
    had mostly faded by the early 1800s, when science failed to meet its grandiose
    expectations, and the humanities alone could pick up the extra burden. Today,
    what passes for twenty-first-century philosophy is to a large extent pundits,
    in which comments on current issues are issued mostly by scholars trained in the
    humanities and economics. The real limitation of present-day philosophy is not
    clashes of authorial logic but incoherence, due chiefly to inattention to science.
    This is curious, since we are in what can reasonably be called the Age of Science,
    and science is positioned to combine with the humanities to rekindle the spirit
    of the earlier Enlightments. I believe that we, meeting in common inquiry, can
    at solve the great questions of philosophy. It is time to ask again, fairly and
    with a great deal more confidence than ever before, the great questions of history.


    At the base, we need to explore more deeply the meaning of humanity, why we exist
    opposed to have never existed. And further, why nothing remotely like us existed
    on Earth before. The grail we sought is nature of consciousness, and how it originated.
    Originally fundamental is the origin and proliferation of life as a whole.


    In a narrower focus, how are we to explain the existence of two genders—or more,
    considering the range of sexuality acknowledged today? Why is there sex in the
    first place? If we could reproduce parthenogenetically, or just bust offspring
    from our bodies, life would be so much simpler. These are not idle questions,
    to be left to salonists and after-dinner guests. They are not mind games, nor
    exercises to sharpen skills in logic. They address matters literally of life and
    death.


    We must ask not just how, but why, we are fixed by an exact schedule of genetically
    programmed growth and decline. And now, finding ourselves in the Age of Artificial
    Intelligence, we are forced to define, with exactitude, a human'
  merge: -1
  pgno: 133
- img_proc: true
  md: "being. Might build one from chemicals taken off the shelf, at least to the\
    \ level of a fertilized egg begun with a designated genome? And if that proves\
    \ impossible, which I doubt, we need to seriously discuss humanoid robots, endowed\
    \ with emotions and even the power of creativity.\n\nScientists and scholars in\
    \ the humanities, working together, will, I believe, serve as the leaders of a\
    \ new philosophy, one that blends the best and most relevant from these two great\
    \ branches of learning. Their effort will be the third Enlightenment. Unlike the\
    \ first two, this one might well endure. If so, it will bring our species closer\
    \ to realizing the prayer for reason inscribed by Diogenes and still visible in\
    \ original form on the Oinoanda stoa in the ancient Greek region of Lycia. \n\n\
    Not least for those who are called foreigners, for they are not foreigners. For,\
    \ while the various segments of the Earth give different people a different country,\
    \ the whole compass of this world gives all people a single country, the entire\
    \ Earth, and a single home, the world."
