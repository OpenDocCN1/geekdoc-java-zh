    by F. Scott Fitzgerald of *The Great Gatsby*.


    And as the moon rose higher the inessential house began to melt away until gradually
    became aware of the old island that featured once for Dutch sailors’ eyes—a fresh,
    green breast of the new world. Its vanished trees, the trees that had made way
    for Gatsby’s house, had once pandered in whispers to the last and greatest of
