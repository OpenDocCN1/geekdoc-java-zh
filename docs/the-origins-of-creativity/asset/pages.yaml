  md: '# 15


    # GARDENS


    Across the Paleolithic steppes of Europe and Asia, and back in time for more 35,000
    years, the ancestors of modern humans and their Neanderthal sister species buried
    their dead, leaving a treasure trove for present-day archaeologists. In shallow
    graves, the ancients often included household items and upper body ornaments owned
    by the dead. A very few of the graves, only three per thousand years discovered
    thus far, had been elaborately decorated, suggesting a high rank of its occupant.


    At the dawn of the Neolithic, characterized by agriculture, stored food surpluses,
    and settled villages, mourners began to add flower beds to the graves. The oldest
    known, dated to 13,700 years before the present, are at four sites in the Raqef
    Cave at Mt. Carmel in northern Israel.


    There is a logical reason flowers and gardens should rank so high on into modern
    times. The poet-naturalist Diane Ackerman has expressed it close to perfection:


    A flower''s fragrance declares to all the world that it is fertile, available,
    and desirable, its sex organs oozing with nectar. Its smell reminds us in vestigial
    ways of fertility, vigor, life-force, all the optimum expectancy and passionate
    bloom of youth. We inhale its'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'ardent aroma and, no matter what our ages, we feel young and nubile in a world
    aflame with desire.


    Flowers grace our literature, our fashions, our religious ceremonies. They announce
    our rites of passage and signify our celebrations. Made into boutonnières and
    garlands, they advertise our status, our purpose, and our demeanor for the day.


    The beauty and scent of flowers did not emerge just for human delectation. Among
    the plants that produce them, namely the angiosperms (the more than 370,000 species
    of flowering plants of the world), our purpose is purely sexual. Flowers serve
    to attract pollinators, most insects, but in addition and to species, a large
    array of birds and a few mammals. The relationship is symbiotic, “mutually symbiotic”
    to be precise, in which both partners benefit from the symbiosis.


    The strategies used by different species to achieve the symbiosis has evolved
    as though to delight the human artistic ego. Dendrolobium orchids, tropical epiphytes,
    thrust clusters of delicate, modestly pink flowers among their narrow leaves.
    Cyclamens offer amorphous red or white flowers in the midst of broad leaves, conspicuously
    bright with green and white, pretending to be the real stars of the show. Christmas
    coral columna, challenging in brilliance any human art, dangle tubular red flowers
    from creeping vines amidst mostly seamless.


    These examples and countless others are plants arranging parts of their bodies
    for display. They depend on daytime animals that possess color vision. To equal
    degree, the relationship has evolved the other way. Some animals have evolved
    color vision by natural selection in order to harvest pollen and nectar offered
    by plants. The two kinds of partners, plant and animal, coevolved as necessarily
    equal partners.


    Humans have picked up this worldwide symbiosis and taken it further, creating
    a new art form based on flowers. In a 1640\u045 imagined portrait of St. Francis,
    for example, the Spanish painter Francisco de Zubarán depicts the full length
    of the saint’s robe emerging from a dark, sparse array of surrounding lilies that
    reflect the skin tones of the saint’s upturned face. Shrouded by palm leaves,
    they repeat the angles of his robe.


    Pursuing a wholly different mood, Jean Honoré Fragonard’s Mademoiselle Marie-Madleine
    expresses the self-indulgent'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'excesses of the ancien régime on full display. The celebrated singer and dancer,
    judged to be one of the most beautiful in France by standards of the day, is surrounded
    by trains of her beloved roses that cross her head and run down arms, while her
    form is wreathed by a cascade of other roses. Mlle. Guimard, in short, has become
    a flower.


    Radically different from those classical examples is Paul Manship’s stunning The
    Moods of Morning (1935). A sculpture of a supine awakening is paralleled at the
    base by buds of many species, which push forward to an apical cluster of lilies
    and birds of paradise flowers. In the words of the art critic Victoria Jane Realm,
    the final bouquet is “more open, more intense, ending in an explosion of color
    and form” that represents the full awakening of the human subject.


    In a different realm, flowers and fruits surrounded by sculpture have graced ornamental
    gardens since the beginning of civilization. Gardens in general have been the
    key instruments of agriculture, and agriculture was the means by which humanity
    evolved from Paleolithic hunting and gathering bands into civilized communities.
    Agriculture was invented multiple times independently worldwide, and on every
    inhabited continent except Australia, variously from about 12,000 years before
    the present in the Middle East to 5,000 years ago in the New World. It probably
    originated in one or the other two ways. First was direct observation that edible
    seeds and fruit give rise to plants that produce more edible seeds and fruit.
    Alternatively, there would be a tendency for clusters of people to settle close
    to trees, shrubs, and herbaceous plants that are exceptionally productive, leaving
    the rest away. Domestication by selection of the most productive plants, hence
    agriculture, logically followed.


    Gardens, like the natural world they represent, have a restorative and healing
    effect. Lay people have always felt their power, and scientists have tested and
    proven their salutary effects. In one test, volunteers were first shown a stressful
    movie, then videos of nature experienced a subsidence of stress, measured in heartbeat
    rate, systolic blood pressure, facial muscle tension, and electrical skin conductance.
    But not those scenes of cities. Other studies have revealed, as expected, a similar
    reduction of stress symptoms in the presence of plants and aquariums prior to
    surgery and dental work. Furthermore, postoperative patients recover more quickly,
    suffer fewer complications, and need smaller dosages of painkillers, when allowed
    to'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'look over natural environments or even just pictures of nature covering the
    hospital walls.


    With the accumulation of wealth and the rise of social hierarchies, rulers and
    the wealthy could afford ornamental gardens for display and pleasure. Later, as
    for example in France, Spain, Japan, and Sri Lanka, these gardens were opened
    to the public. Today, public gardens are universal in most societies and give
    pleasure to all classes.


    Homeowners in North America and most of Europe routinely convert their property
    into simulations of nature, usually consisting of lawns and mostly ornamental
    trees and shrubs. Yet, even though the benefits of nature are undeniable, landscape
    developers routinely commit two unintentional errors that harm the greater environment
    that they and their customers instinctively love. First is their obsession with
    lawns. People enjoy open spaces, and have most likely since the birth of humanity
    on Africa’s savannas. A lawn, however, ranks among the worst possible environments
    worldwide, just above bare concrete. Every lawn (if we put aside the heroically
    rebellious dandelions) is a monoculture of alien species, ferocious consumers
    of water that also demand regular applications of fertilizers, toxic herbicides
    and insecticides, the excess of which eventually seep into aquifers and streamwaters.


    Of equal concern, most landscape planners select ornamental trees and shrubs on
    the basis of their perceived beauty, with little or no concern for their geographical
    origin. Choosing exotic over native species has profound implications for the
    environment, most significantly the much higher production of insects supported
    by native plants. The wildlife ecologist Douglas W. Tallamy produced four times
    the biomass of feeding on exotics. Pennsylvania produced that insects feeding
    on native woody plants in Pennsylvania. Tallamy attributed the difference to the
    reduced ability of native insects with chewing maws to eat alien plants, on which
    their species did not evolve. He found that native species supported thirty-five
    times more biomass of caterpillars—chiefly moth larvae—than did exotic


    Preferring trees and shrubs that produce more insects may seem the wrong way to
    go in landscape planning, but the opposite is the case. Insects, especially caterpillars,
    are the preferred diet of songbird nestlings. Native woody plants produce more
    birds and thereby an all-around richer ecosystem. A healthy population of birds
    provides a check on runaway'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'population increases of insect pests, such as the Eurasian gypsy moth emerald
    ash borer. Further, by supporting native bird populations at a sustainable level,
    we help ease the extinction risk of the rarest species among them. Replacing exotic
    plant species with alternative native species, which are comparably attractive
    and in every respect more interesting, is not just environmentally wise but also
    cost effective. It is personalized conservation at its best.


    Biophilia, an instinct that is well supported by humanistic scholarship and scientific
    research, draws humans to the rest of life on Earth and provides us with deep
    satisfaction. While we have just begun to understand the evolutionary origin and
    neurobiological impact of this instinct, biophilic design has become a growing
    new development in architecture. The celebrated prototype is Frank Lloyd Wright''s
