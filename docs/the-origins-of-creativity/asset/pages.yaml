- img_proc: true
  md: 'The ever-fluctuating colors, the spectral pygmies rolling, flying, leaping
    among the letters; the ripe bloom of quiet corners, the living light and bursts
    of flame . . . make the page seem to move and quiver within the boundaries.


    And sometimes a description has a compelling beauty, even when much of visual
