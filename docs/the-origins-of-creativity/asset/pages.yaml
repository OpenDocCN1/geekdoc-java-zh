  md: 'inevitable and constantly changing conditions of the environment. Its innovations
    are the equivalent of mutations in the genome. These biological accidents have
    occurred throughout the history of humanity, in the same manner and at the same
    degree as in other species. Mutations are very diverse. They are individually
    rare, and in the great majority of cases either harmful (hence the hundreds of
    unhappy familiar hereditary disorders such as color blindness, cystic fibrosis,
    and hemophilia) or neutral, having no detectable effect on health or reproduction.
    In time they disappear or remain at most at a very low frequency, the latter by
    coexisting at the same site as silent recessives to dominant beneficial genes.
    Only a tiny fraction of mutations are successful, benefiting the individuals that
    they carry and spreading through the population as a whole. Sometimes they have
    enormous consequences. One example is the ensemble of mutant genes that prescribe
    lactose tolerance. A small random change in DNA base pairs made possible milk
    consumption, and the dairy industry thereafter spread throughout most of the world.
    Another case is the mutant sickle-cell gene, which in double dose causes lethal
    anemia but in single dose protects against equally lethal malaria.


    The unsuccessful and neutral genes we all carry around in our bodies are called
    by geneticists the mutation load. From their midst, by further mutation and changes
    in the environment that perchance favor them, has come the biology of the human
    organism as it exists today. We can value no less the innovations, only a few
    of which prove successful, that drive the creative arts.'
