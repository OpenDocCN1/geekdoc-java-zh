  md: '# 1


    # THE REACH OF CREATIVITY


    Creativity is the unique and defining trait of our species; and its ultimate goal,
    self-understanding: What we are, how we came to be, and what destiny, if any,
    will determine our future historical trajectory.


    What, then, is creativity? It is the innate quest for originality. The driving
    force is humanity’s instinctive love of novelty—the discovery of new entities
    and processes, the solving of old challenges and disclosure of new ones, the aesthetic
    surprise of unanticipated facts and theories, the pleasure of new faces, the thrill
    of new worlds. We judge creativity by the magnitude of the emotional response
    it evokes. We follow it inward, toward the greatest depths of our shared minds,
    and outward, to imagine reality across the universe. Goals achieved to further
    goals, and the quest never ends.


    The great branches of learning, science and the humanities, are complementary
    in our pursuit of creativity. They share the same roots of innovative endeavor.
    The realm of science is everything in the universe; the realm of the humanities
    is everything conceivable to the human mind.


    Drawing on the combined consciousness of our species, each one of us can go anywhere
    in the universe, seize any power, achieve any goal, search for infinity in space
    and time. Of course, it is also true that when ruled by wildmise and the animal
    passions we all share, our unbounded fantasy'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'can disintegrate into madness. Milton expressed this greatest risk of the human
    condition very well.


    A mind is its own place, and in itself

    Can a Heav’n of Hell, and a Hell of Heav’n.


    So perhaps it is a blessing that the mind does not travel easily to vast and unfamiliar
    regions, but instead prefers to cruise and repeat its excursions in small familiar
    circles. Further, as a rule, people do not like the solitude of their own thoughts.
    A team of psychologists from the University of Virginia and Harvard University
    recently found that volunteers disliked sitting alone for even as little as six
    minutes with nothing to do but think. They enjoyed mundane eternal activities
    more. They preferred administering electric shocks to themselves if nothing else
    was available.


    The full explanation of any biological phenomenon, including creativity in both
    science and the humanities, engages three levels of thought. First, for any conceivable
    living entity or process—a bird taking flight, growing toward the sun, your reading
    of this sentence—the first inquiry must be, What is it? Provide the structure
    and functions that define the phenomenon. If it involves music or theater, perform
    it. The second level is the question, How was it put together? What made it into
    existence? What were the events that resulted in the conditions of its origin,
    whether ten seconds or a thousand years ago? The third and final level is, Why
    do the phenomenon and its preconditions exist in the first place? Why not a different
    mode of evolution not present on this planet that might have produced a different
    kind of thinking brain?


    Scientists living phenomena at all three of these levels. As a rule, they choose
    entities and processes that engage the what, how, and why in whatever detail and
    dimension that lie within their reach.


    Biologists, however, perhaps even than other scientists, feel it necessary to
    seek cause and effect at all three levels. The causes that bring about a living
    phenomenon, such as the flight of a bird or our perception of a flower''s colors,
    are called proximate causes. The events that guided the evolution of the phenomenon
    to its present state are called ultimate causes. Proximate causes are the what
    and how of a full explanation. Ultimate causes are the why.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Scientific explanations of organic life, including human life, routinely entail
    both proximate and ultimate causes. In contrast, accounts that govern inquires
    in the humanities attempt at best only proximate explanations. Ultimate causation
    tends to be left to the God of Genesis, ancient alien visitors, or a mysterium
    tremendum et fascinans imagined to be resident deep within the human mind. Take
    as a random example the red color of a flower petal placed before you. The redness,
    like all hues, is distinguished by the stimulation of a particular portion of
    the electromagnetic spectrum composing the visual spectrum. The receptors are
    red-sensitive cones in the retina. The latter transmit signals to a staging center
    in the brain cortex, thence in relays back to the rear of the cortex, then to
    integrating units of perception and emotion, and finally back out to the centers
    of the conscious forebrain, causing you to say “red” (or perhaps rot, rouge, or
    krasny, or bombu, depending on your native language).


    Having this far, scientists have in decades tracked down the interacting segments
    of DNA that compose the genes prescribe recognition of colors.


    Thus, scientific research has brought us close to solving the first line of mysteries
    in human color vision. The way is now open to the still deeper question of ultimate
    causation: Why can humans see a particular spectrum of color but cannot see infrared,
    or ultraviolet, or other frequencies outside the narrow segment of the electromagnetic
    spectrum yielding visible light? And even deeper, why does DNA, and not some other
    coding chemical, prescribe color vision and all the other processes of life on
    Earth? Might we expect to find fundamentally different codes on life-bearing exoplanets?
    And why do we see color in the first place, instead of just shades of light and
    dark?


    The answers of such why questions await the reconstruction of prehistory, during
    our species emerged from earlier hominins, and much further over tens of millions
    of years when basic properties of our present brain and senses were shaped within
    the earliest ancestral primates.


    Scholars in the humanities have traditionally confined themselves to the what.
    They have touched lightly on the how. They have seldom ventured into the world
    of why. They build upon the biological particularities of the senses and emotions
    already in place at the dawn of the Neolithic, some ten thousand years ago—hence
    the almost exclusive contemporary content of'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'the humanities; the creative arts, linguistics, history, jurisprudence, philosophy—moral
    reasoning, and theology.


    It might seem—feel is perhaps the better word—that the human suite of intellect
    and emotion is the only one that could have attained creativity. This diagnostic
    trait of our species, almost four billion years in the making, might seem to require
    some unique feature of evolution or else the hand of God extended special to our
    lineage.


    That supposition, which dominated religious thinking for millennia, would almost
    certainly be wrong. It is easy to find in nature alternative springboards in advanced
    social organization, of some which in time might have swerved in evolution to
    the human level. Consider the remarkable mound-building termites, technically
    called macrotermites, of Africa and South America. Their earthen nests, built
    of soil and feces, deem with populations of hundreds of thousands to millions,
    and rise in places to higher than a human head. Like those of humans, their abodes
    are exquisitely well designed. In some species, the nests are air-conditioned
    by elaborate systems of ducts that continuously circulate air from the surrounding
    ground and used, air by heat convection, from the amassed inhabitants and out
    of the mound. Each macrotermite colony contains a proletariat of sterile workers
    and their two parents, a royal pair responsible for all reproduction. How is this
    possible? The massive queen, the size of your two thumbs, lays a continuous stream
    of tiny eggs. The workers divide labor by division into physical castes, including
    a large army of suicidal ferocious, large-headed soldiers. once required assistance
    to dissect their scimitar-shaped mandibles out of the web of my right thumb.)


    The inhabitants remain underground within the mound and the meters-deep labyrinth
    of galleries and chambers excavated below the mound, with a couple of notable
    exceptions: the flights of virgin queens and their consort males establish new
    colonies, and swarms of workers that come out at night to search for bits of dead
    vegetation. Placing an ear close to the nests (not too close!), one hears a faint
    hiss raised by countless tinyfalls. The nocturnal harvests are used to grow an
    edible fungus in subterranean gardens.


    The macrotermites are true superorganisms. The collective intelligence of each
    of the colonies is still far below the level of humans and other mammals, even
    below most birds, but well above that of solitary insects.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Yet their creativity remains zero. Let us suppose they had ascended during
    their evolution to the human level. Their “termitories,” if I may coin a term,
    would include the following: a love of absolute darkness (and a Dracula-like panic
    at the merest hint of daylight); an exclusive diet of cultivated mushrooms; sex
    limited to royals; and death to all would-be immigrants, even from the same species.
    The sick and the injured of the colony promptly and preemptorily eat; no hospitals,
    no pity.


    Consider this. In a century or two, space technology may well provide a first
    close look at exoplanets, the planets of other star systems. An intensive search
    for evidence of life will certainly follow. If life is found, and one or more
    intelligent species, we should be prepared for, well, anything.'
  merge: -1
