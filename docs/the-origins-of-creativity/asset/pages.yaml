  md: '# 9


    # BEDROCK


    Humanity is a chimeric species. The physiological basis of our senses and emotions
    remains much the same as in our apish ancestors. Our capacity for the creative
    arts—narrative language, dance, song, pictures—dates before the African breakout
    over sixty thousand years ago. Everything else has changed. Science and technology
    is doubling, according to discipline, every ten to twenty years. They address
    everything in the universe, all space and time and everything on Earth and on
    every conceivable star system and exoplan. The humanities, on the other hand,
    are stuck with people.


    Therein lies the dilemma of the humanities. They, and with them large part of
    liberal education, are expected to describe and explain the essence of a social
    world of Paleolithic emotions, medieval institutions, and godlike technology with
    no clear idea of meaning or purpose. In the search for meaning, science and technology
    have roles disjunct from the humanities. Science (with technology) tells us whatever
    is needed in order to go wherever we choose, and the humanities tell us where
    to go with whatever is produced by science. Where science has created new modes
    of intellect and vast material power, the humanities have addressed the issues
    of aesthetics and value or lack thereof mostly raised by the relentless Stakhanovite
    energies of science.'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'The human enterprise has been to dominate Earth and everything on it, while
    remaining constrained by a swarm of competing nations, organized religions, and
    other selfish collectivities, most of whom are blind to the common good of the
    species and planet. The humanities alone can correct this imperfection. Being
    focused on aesthetics and value, they have the power to surely the moral trajectory
    into a new mode of reasoning, one that embraces scientific and technological knowledge.


    To fulfill this role, the humanities will need to blend with science, because
    the new mode above all depends on a self-understanding of our species, which cannot
    be acquired without objective scientific research. Like the sunlight and the firelight
    that guided our birth, we need a unified humanities and science to construct a
    full and honest picture of what we truly are and what we can become. That combination
    is the potential bedrock of the human intellect.


    It seems clear, as I''ve argued, that the humanities can be broadened enough to
    make the connection in three ways. First, escape the bubble in which the unaided
    human sensory world remains unnecessarily trapped. Second, sink roots connecting
    the deep history of genetic evolution to the history of cultural evolution. And
    third, diminish the extreme anthropocentrism that hobbles the bubble of humanistic
    endeavors.


    It is common for writers to turn to the mysteries of human existence to astrophysics
    and quantum mechanics. Alternatively, they look to the future map of brain neurons
    and circuitry. In more traditional modes, many writers seek spiritual enlightenment,
    thereby to God or to some *mysterium tremendum*, the core of which guides us but
    stays beyond our grasp.


    All of these archetypes are guaranteed to continue, and fail. They play in one
    of the most powerful of archetypes, the quest for the ultimate unknown. That quest
    has taken form through the ages variously in the holy grail, the sword in the
    stone, the secret code of the ancients, messages left by extraterrestrials, the
    key to the inner sanctum, or the physics-based Theory of Everything.


    In truth, self-understanding of the deep, genetic qualities of our species has
    already been attained, a substantial part of it anyway, with the long path to
    the rest laid out in principle. Many surprises await, especially in molecular
    and developmental genetics, but that add to the paradigm shift needed to explain
    why we are and what we can expect to attain'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'without leaving planet Earth. The answers thus far, as I''ve stressed, are
    being provided by the relevant bedrock disciplines we would logically expect.
    They comprise paleontology, anthropology (including archeology), psychology (primarily
    cognitive and social), evolutionary biology, and neurobiology.


    The common thread that unifies this Big Five most relevant to humanity is evolution
    by natural selection. The preeminence of this universal process was nicely expressed
    in 1973 by the great geneticist Theodosius Dobzhansky and often quoted since:
    "Nothing in biology makes sense except in the light of evolution." That claim
    should now be boldly expanded to the science and the humanities. As the philosopher
    Daniel Dennett has put it, evolution by natural selection is the acid that burns
    through every myth about ordained purposes and meanings.


    Biological evolution is defined as the hereditary change of traits within populations
    from one generation to the next, eventually causing one species to give rise to
    another, and sometimes splitting into two or more species. Most educated people
    know this characterization, but very few can tell much about how it actually works.
    This spectacular shortfall in education is due to poor science education in schools,
    and is probably the most formidable barrier to any effort to bring science and
    the humanities together to create an authentic general education. The whole is
    actually quite simple compared, say, to general relativity or to a randomly selected
    school of abstract modern art. It can be summarized as follows.


    The first principal is that genetic evolution (often called organic evolution)
    cannot be made comprehensible as a single lineage, parent to offspring, offspring
    to grandoffspring, and ever onward backward and forward, ad seriam. Rather, it
    is a hereditary change throughout an entire population. Its magnitude is measured
    as a shift in the percentages of competing traits within the population as a whole.
    The population comprises freely interbreeding individuals. It may be an entire
    species or a geographically isolated part of a species. It may occupy an offshore
    island, for example, where other populations of the same species live on the mainland.


    Among the genes of individuals making up the population, mutations are constantly
    occurring, albeit at a very low rate for any particular gene. One in a million
    per generation in a population is not an unusual figure. A'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'mutation broadly defined is a random change that occurs by an addition or subtraction
    of the DNA letters making up the genes, or by changes in the numbers of the genes,
    or even by a shift in the locations of the genes on the chromosomes. Mutations
    can affect any biological or psychological trait, large or small.


    If the change in the traits prescribed by a mutation prove relatively favorable
    in the surrounding environment to the survival and reproduction of the individuals
    carrying it, then the mutant multiplies and spreads through the population in
    competition with other genes located at the same site on the chromosome. An aforementioned
    human example of such mutation prescribes lactose tolerance, which renders milk
    and all its products palatable and makes the cultural invention of dairy. If,
    on the other hand, the traits prove unfavorable in the surrounding environment
    (say preserving lactose intolerance), the mutant gene will either persist in a
    very low percentage of individuals in the population or disappear entirely. Traits
    with significant impact on human health persisting in marginal numbers of rare
    genetic diseases and disorders such as Duchenne muscular dystrophy, haemophilia,
    and a propensity to develop cancers.


    Evolution is a change in the population the frequencies of competing genes affecting
    the same traits. When, for example, the frequency of lactose-tolerant genes increases
    by even just several percent, evolution has occurred. The competition is between
    those newly arrived as mutations versus those already in place. Because winning
    or losing among alternative genes is almost entirely determined by the environment,
    biological evolution is said to occur by “natural selection,” the phrase introduced
    by Charles Darwin to distinguish the process from artificial selection, which
    is the breeding of plant and animal strains by human choice.


    Evolution by natural selection occurs continuously in every population of every
    species, either changing the frequency of genes or holding them steady. At one
    extreme, its pace is fast enough to create a new species in a single generation—as,
    for example, by a simple doubling of all the chromosomes and all the genes they
    carry. At the opposite end, evolution is so slow that some traits of the species
    have remained similar to those of ancestors living tens of millions or even hundreds
    of millions of years ago. With only a little exaggeration, these laggard species
    are often called'
  merge: -1
  pgno: 69
- img_proc: true
  md: '“living fossils.” Familiar examples with traits two hundred million years old
    or older include horseshoe crabs, dragonflies, beetles, and cycads.


    In the elementary theory of evolution by natural selection, the unit of heredity
    that mutates the gene, and the target of natural selection by the environment
    is the trait prescribed by the gene. The distinction might be made more memorable
    with the aid of Hollywood science fiction horror movies: the monstrous mutant
    of insects and crocodiles that escape from secret government laboratories cause
    local mayhem, but they have no chance to reproduce and spread in Darwinian competition
    with their normal progenitors. So we we hope.


    There has unnecessary confusion, especially by popular writers on evolution, between
    individual-level selection and group-level selection. The problem arises from
    an erroneous distinction between the unit of heredity and the target of selection.
    The problem is simply resolved when referred to the well-developed discipline
    of population genetics, as follows: Individual-level selection acts on the traits
    that affect a group member’s survival and reproduction, apart from its interaction
    with other members of its group. Individual selection predominates in the early
    stages of social evolution, when many of the hereditary traits affect the success
    of the individual independently of its groupmates. The individual may, live alone
    during part of its life cycle. Among its groupmates, it may take larger shares
    of food and space for itself and for its offspring.


    Group-level selection affects the traits that are interactive with groupmates,
    so that the success of an individual’s genes depends at least partially on the
    society to which the individual belongs. In the most advanced social organizations,
    characterized by a sterile worker caste and illustrated by siphonophores, which
    resemble jellyfish, as well as ants, bees, wasps, and termites, group selection
    almost entirely overrides individual selection.


    So, where does humanity fit in the spectrum of individual-to-group selection?
    We are located near the center. As a consequence, human nature is driven by conflict
    between individual selection, which promotes selfishness on the part of individuals
    and their immediate families, and group selection, which promotes altruism and
    cooperation in service to the larger society. This admixture in levels of selection,
    forged in an arena of instinct and reason, is part of what makes humanity.'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'The role of group selection in social evolution is consistent with the proven
    fundamentals of population genetics. Its occurrence throughout the animal kingdom
    is supported by massive evidence from the field and laboratory. It has nevertheless
    been challenged by an alternative explanation of social evolution called inclusive
    fitness theory. In essence, the theory says that social behavior evolves in accordance
    with the degrees of kinship among members of the group. The closer their kinship,
    the more likely the group members will share their resources and cooperate in
    labor. The price for each of the group members in survival and reproduction is
    compensated by the increase of genes identical to its own shared with others in
    the group by kinship. If you sacrifice your life for your extended family, it
    matters more than if they are only distantly related or not at all. More of your
    bravery genes will persist in the population if you make the sacrifice for close
    relatives.


    At first thought, this concept of kin selection, extended beyond nepotism to cooperation
    and altruism within an entire group, appears to have considerable merit. I said
    so when I first synthesized the discipline of sociobiology in the 1960s and early
    1970s. It is deeply flawed. In spite of the excited attention at first given to
    it, no one has ever succeeded in measuring “inclusive fitness,” as its core property
    is called. To succeed, not would it be necessary to determine pairwise kinship
    throughout the group, but also to assess reciprocal gains and losses in fitness
    through time. Beside the technical difficulty, the equations offered to conduct
    the overall analysis have proven mathematically incorrect. There is a basic reason
    for this mistake. The perusal of inclusive fitness theory, the individual group
    member, not the gene, was the unit of selection. Inclusive fitness means how well
    the individual does in its relation to every groupmate, discounted by the percentage
    of the shared appropriate genes, through its entire reproductive life. However
    outwardly attractive, there exists no evidence of such a process, or any need
    for it to explain the origin of advanced social behavior.


    I''ve come down strongly on this issue, knowing well that a proper scientist is
    supposed to express some degree of uncertainty and speak in terms of probability.
    But there is a need to cut through the confusion caused by the dwindling corps
    who support the inclusive fitness theory, and place less emphasis on the theoretically
    grounded and documented process of group selection.'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'Why does this disagreement matter? It is impossible to overestimate the importance
    of group selection to both science and the humanities, and further, to the foundation
    of moral and political reasoning. This is a subject we need to get clear and straight.


    As Darwin first observed in The Descent of Man (forgive me an appeal to authority),
    competition among humans has been a major contributor to traits universally considered
    noble, that is, manifesting generosity, bravery, self-sacrificing patriotism,
    justice, and wise leadership. To explain these qualities with individual selection
    alone, it is necessary to take a thoroughly cynical view of humanity, based on
    selfish genes and the convoluted methods of deception and manipulation they prescribe.
    Common sense tells us there is something ruling humanity that is a great deal
    better. We admire the band of brothers in battle, the fireman who risks all, the
    anonymous philanthropist, the emblatt teacher in Appalachia. Heroes are real and
    all around us. Their good deeds are the safety net of civilization.


    Because of group selection, and its obvious consequences in the evolution of human
    social behavior, there is reason to suppose that the better angels of our nature
    are not drilled into us under the threat of divine retribution, but are instead
    biologically inherited. We are by a fortuitous consequence of the fundamental
    principles of natural selection far more than trained savages.


    It is equally the case that the the love of nature, leading to the floras and
    faunas within the wildlands, comes easily to people everywhere, even those whose
    entire lives have been spent in cities. It would be a mistake to justify parks
    and reserves primarily as economic assets, or as outdoor health clinics. Wildlife
    conservation stands on a moral foundation independent and sufficient unto itself.


    The origin of morals or lack thereof is suggested by the fable of the scorpion
    and the frog, ancient in origin. A scorpion wishes to cross a stream, but cannot
    swim, and asks the frog for a ride. The frog demurs, saying the scorpion might
    sting and kill it. The scorpion argues that would not happen, because both of
    them would be killed. They start off, and at midstream the scorpion stings the
    frog. As they sink, the frog asks the scorpion how it could such a terrible thing.
    The scorpion replies, "Because it is my nature."'
