  md: '# 10


    # BREAKTHROUGH


    It is becoming increasingly clear that natural selection has programmed every
    bit of human biology—every toe, hair, and nipple, every molecular configuration
    in every cell, every neuron circuit in the brain, and within all that, every trait
    that makes us human.


    Natural selection as grand master of evolution means humanity was not planned
    by any super-intelligence, now or guided by any destiny beyond the consequences
    of our own actions. The human product has been tested and often revised in every
    one of the thousands of generations of its geological lifespan. Success for our
    evolving species meant survival during each reproductive cycle in turn. Failure
    would have resulted in decline on the road to extinction, thus ending the evolutionary
    game. It has happened in the vast majority of other species, many before our eyes.
    The last pigeon and Tasmanian marsupial died in cages, the last great auk was
    killed by egg poachers, and the last ivorybill was being chased by a crow across
    the canopy of a remote Cuban forest.


    The same fate could have fallen our ancestors any time in the past six million
    years. Like every other species surviving today, ours was just extraordinarily
    lucky. Over 98 percent of the species that ever lived have vanished, to be replaced
    by the multiplying daughter species of the survivors. The result has been an approximate
    balance, extinction versus'
