  md: '# ABOUT THE AUTHOR


    Edward O. Wilson was born in Birmingham, Alabama, in 1929 and was drawn to the
    natural environment from a young age. After studying evolutionary biology at the
    University of Alabama, he has spent his career focused on scientific research
    and teaching, including forty-one years on the faculty of Harvard University.
    His twenty-nine books and more than hundred mostly technical articles have won
    him over one hundred awards in science and letters, including two Pulitzer Prizes,
    for On Human Nature (1979) and and, with Bert Höldöder, The Ants (1991); the U.S.
    National Medal of Science; the Crafoord Prize, given by the Royal Swedish Academy
    of Prize for Biology; the Presidential Medal and Nonino Prize of Italy; and the
    Franklin Medal of the American Philosophical Society. For his contributions to
    conservation biology, he has received the Audubon Medal of the National Audubon
    Society and the Gold Medal of the Worldwide Fund for Nature. Much of his personal
    and professional life is chronicled in the memoir Naturalist, which won the Los
    Angeles Times Book Award in Science in 1995. More recently, Wilson has ventured
    into fiction, the result being Anthill, a New York Times best-selling novel published
    in 2010. Active in field research, writing, and conservation work, Wilson lives
    with his wife, Irene, in Lexington, Massachusetts.'
