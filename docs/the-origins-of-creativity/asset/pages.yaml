- img_proc: true
  md: 'The shortcomings of the creative arts and humanistic scholarship that are becoming
    more apparent in the age of STEM have resulted, even in the outer reaches of science
    fiction, in an extreme anthropocentrism. Nothing, it seems, counts except on the
    impact on people. One result is that we are left with little to compare and therefore
    to understand and judge ourselves.


    To summarize, the humanities suffer from the following weaknesses: they are rootless
    in their explanations of causation and they exist within a bubble of sensory experience.
    Because of these shortcomings, they are needlessly anthropocentric and therefore
    weak in their ability to recognize the ultimate causation of the human condition.


    Protagoras of Abdera, in the Fifth Century BCE, declared that “Man is the measure
    of all things.” That world view was challenged in his time, and it should be more
    so today. We need another perception in order to get the story straight. It should
    read,“All things must be measured in order to understand man.”'
