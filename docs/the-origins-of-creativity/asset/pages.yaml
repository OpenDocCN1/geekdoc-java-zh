    Innovation of this kind in the creative arts is important in a second way. The
    evolution of the arts parallels organic evolution in the manner they both work.
    The best artists and performers seek original ways to express themselves in image,
    sound, and story. Originality and style are everything, measured by the degree
    to which the innovations attract imitation. Thus the challenge of the Salon des
    Refusés to the Salon of Paris in 1863 is a classic example in the visual arts.
    Cubism against literalism, marked by Picasso''s Les Demoiselles d''Avignon in
    1907 is another. In popular culture color motion pictures in 1932 with Walt Disney''s
    Flowers and Trees, and Motown in the late 1960s from a blend of soul, blues, and
    pop. The process is potentially eternal. More and still more: breakthroughs will
    race the heart of the innovators, stiffen their spine, encourage their search
    for breakthroughs. By the late twentieth century, experiments in new techniques
    and styles in all the creative arts were multiplying exponentially. Absurdly wild
    abstract art was displayed against a background of mystifying atonal music. Originality
    for its own sake joined the masters of the creative arts.


    For the origin of cubism, Picasso gave metamorphosis as his central goal: “Any
