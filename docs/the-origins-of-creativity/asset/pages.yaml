    to Homo sapiens. The other species continued to evolve, diverging from the prehuman
    line. In time, each died or split into daughter species of their own. Eventually,
    all declined and disappeared.


    Through most of the six million years following the chimpanzee-human split, as
    many three species, probably more, classified together as the australopithecines,
    coexisted in the African homeland. They were basically vegetarian, perhaps consuming
    a small amount of meat when opportunity provided, as do modern chimpanzees (with
    roughly a three percent caloric intake). The species evidently varied in the kind
    of vegetation they evolved jaws and teeth. The specializations taken together
    represent what evolutionary biologists call an adaptive radiation.


    Out of the radiation, one lineage shifted to heavier consumption of meat, especially
    that cooked by lightning-struck grassland and savanna ground fires. In the early
    stages, the groups invented campsites, at first no more complex than a bird’s
    nest. To these they added controlled fire—no more difficult than carrying the
    ember of a burning tree limb from one place to another.


    Out of this elementary but eventually momentous shift came Homo erectus, the direct
    ancestor of Homo sapiens, no later than two million years before the present.
