  md: '# 5


    # AESTHETIC SURPRISE


    Serious art, whether expressed in score, script, or image, seizes you on first
    encounter. It then holds and distracts you long enough to lead your mind away
    and through the remainder of its content—perhaps to understand the whole intended
    meaning, perhaps to revisit a fragment for sheer pleasure. The overall feel of
    a creative work (call it the signature) may come at the beginning or at the end,
    and sometimes after the experience when it is stored in long-term memory and is
    the first thought that comes to the conscious mind upon recall.


    The signature introduces the aesthetic surprise, which merely beautiful or otherwise
    instinctively deeply compelling. In visual art, for example, it exists in both
    the parade of the tall sails and the apocalyptic tilt of the sinking Titanic;
    Gustav Klimt''s surreal setting in his portrait of Adele-Bauer that seems to melt
    the lady into the metal; Francis Bacon''s exaggerations in his brutal self-portraits,
    which shout the damning consequences of complete honesty; and the lithograph of
    the great racehorse Citation, 1948''s Triple Crown winner, lifted by C. W. Anderson
    in full triumphant stride, to be compared with the horrific screaming steed in
    Picasso''s Guernica.


    Creative artists, playing back and forth along the aesthetic spectrum from beauty
    and majesty to horror and death, use defining signature'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'features to catch and hold your attention. Traditional landscape art, a typical
    example is Alfred Thompson Bricher’s placement of startling white foam atop a
    breaking wave against a somber dun-and-olive shorescape. In abstract art, Hans
    Hoffmann’s *Magnum Opus* presents a glaring yellow rectangle against a large bright
    red splash, with a mysterious dark blob added to the side. The eye is forced to
    travel: yellow to red, then to black. To what purpose is left to your subconscious
    mind.


    The instinct to both present and respond to a simple identifying feature is not
    unique to humans. it is equivalent of the “sign stimulus,” or “releaser,” identified
    by behavioral scientists as universals in the living world. In an early textbook,
    male stickleback fish develop a red belly during the breeding season, which advertises
    their territory and warns rival males. They do not need a whole male with a red
    belly to initiate aggression; just a red spot on a moving object will do. Researchers
    use red spots on dummy fish with a wide variety of shapes, including eclipses
    and circles, to evoke attacks. The red spot is the sign stimulus.


    The same holds true for the olfactory senses. Male moths are drawn to very specific
    chemicals released into the air by waiting females of the same species. Hundreds
    of species of moths may be communicating on the same night, without confusion,
    because each uses the exact chemical signal (the sex pheromone) of its own kind.
    When the same substance is applied to formless dummies of the correct species
    emerge from the night, not only land on the dummy but try to mate with it. Even
    bacteria exist that aggregate and exchange genes with others, providing they emit
    the same kind of signal.


    Sign stimuli, or least signals and ensembles of signals that serve the same function,
    are similarly part of the human psyche. Their presence is confirmed by the existence
    of another phenomenon discovered by animal behaviorists: the supernormal stimulus.
    It is well known that the eggs of herring gulls fall out of the ground nest, or
    are removed and placed by a scientist, one of the parents rolls it back into the
    nest. What is less well known, even to most naturalists, is that when two eggs
    are placed side by side outside the nest, the parents attend to the larger one—even
    if it is abnormally large. The experiment is ramped up, the bigger ones continue
    to win, even if the preferred dummy is so large that the adult gulls are forced
    to climb on top of it.'
