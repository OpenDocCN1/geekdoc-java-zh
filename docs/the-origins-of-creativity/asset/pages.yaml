  md: 'Human beings are not quite dumb of course, at least most of the time, but we
    are ruled much more by instinct than most realize. An hereditary bias, for example,
    has been revealed in the way people judge facial beauty in young women. For a
    long time it used to be assumed that the most attractive face is the average in
    each dimension of a great many faces in a healthy population. However, when this
    notion was tested with judgments tallied from lifetime residents in North America,
    Europe, and Asia, it was found to be close but not quite right. The most beautiful
    face has a slightly smaller chin on average relative to the rest of the face,
    eyes farther apart, and higher cheek bones. Model agencies, Hollywood casting
    firms, and big-eye-anime artists have known this for a long time.


    Because innate preferences do not come out of the blue, it is natural that evolutionary
    biologists would ask why this exists. The search for ultimate cause is called
    “Darwinian.” What advantage in survival and reproduction, if we ask, what might
    result from such a facial configuration? One possibility is that the image is
    a sign of juvenescence: the possessor is more likely to be younger, hence virginal
    and with a relatively longer-lived reproductive potential.


    The same general principle holds in literature. Consider the aesthetic extremes
    of emotion by listening to Emily Dickinson.


    > It was not Death, for I stood up.

    And all the Dead, lie down—


    Close to the opposite end of the spectrum is the shout from Walt Whitman’s seaman:


    > O Captain! my Captain! our fearful trip is done,

    The ship has weather’d every rack, the prize is won . . .


    You’ve been aroused, you know what is coming, you will remember what Dickinson
    and Whitman felt when they put pen to paper.


    Often a great aesthetic force in one mode of expression can magnify the same subject.
    We find an example in Alexander Gilchrist’s description of William Blake’s illuminated
    manuscripts. When Gilchrist discovered and unveiled them in 1863, he set out to
