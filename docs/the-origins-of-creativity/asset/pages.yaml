  md: '# 6

    LIMITATIONS OF THE HUMANITIES


    Until a better picture can be drawn of prehistory, and by that means the evolutionary
    steps that led to present-day human nature can be clarified, the humanities will
    remain rootless. Human nature, the centerpiece, is not the genes that prescribe
    it. Nor is it just the traits of culture most widespread in present-day human
    populations. It is the hereditary propensity to learn certain forms of behavior
    and to avoid others—what psychologists call "prepared learning" versus "counter-prepared
    learning." Among many examples of prepared learning that have been thoroughly
    documented, infants pick up language obsessively, and as older children they are
    prone to play in ways that imitate adult behavior. We are counterprepared, on
    the other hand, to trust strangers or enter unknown dark forests, and we form
    a lifetime dread of snakes and spiders by as little as a single frightening encounter.


    During the biological evolution of our species, the origin of language evidently
    preceded music, and music visual art. Is that timeline correct, and, if so, what
    are the implications? How thereby are the emotions stirred by literature, music,
    and art related to one another? From studies on evolutionary change in, and other
    species, we know that intermediate stages, the “links” of evolution, often produce
    mosaics. That is to say, some traits are advanced, others have reached an'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'intermediate state, and still others have changed scarcely if all. When, for
    example, in 1968 I examined the first discovered primitive of Mesozoic age, preserved
    in amber ninety million years old, I found it to have been in the middle of major
    mosaic evolution. This “missing link” between ancestral wasps and modern ants
    had wasp mandibles, an ant waist, and antennae between the ancestral wasp and
    descendant ants. I gave it the scientific name Sphecomyrma (“wasp ant”).


    To what level did humans evolve these and other capabilities at the time of the
    breakout from Africa and spread around the world? And why did they evolve? The
    full meaning of the humanities will not come from STEM (science, technology, engineering,
    mathematics). It will come from a combination of many less vaunted disciplines,
    of which the most important are the Big Five: paleontology, anthropology, psychology,
    evolutionary biology, and neurobiology. These fields of research are the friendly
    ground of science, where the humanities will find full and ready alliances. They
    will encounter some of the same in astrophysics and planetology also, but chiefly
    mega-threats for the player of human emotion, because they have no way to explain
    its meaning.


    The main shortcoming of humanistic scholarship is its extreme anthropocentrism.
    Nothing, it matters in the creative arts and critical humanistic analyses except
    as it can be expressed as a perspective of present-day literate cultures. Everything
    tends to be weighed by its immediate impact on people. Meaning is drawn from that
    which is valued exclusively in human terms. The most important consequence is
    that we are left with little to compare with the rest of life. The deficit shrinks
    the ground on which we can understand and judge ourselves.


    History, conceived in the conventional sense, is a product of cultural evolution.
    Historians are scholars who tease apart the proximate causes of cultural evolution—in
    trade, migration, economics, ideology, war, leadership, and fashion. They have
    successfully taken us back to the dawn of the Neolithic, when agriculture was
    invented and food surpluses and villages added, these chiefdoms, paramount chiefdoms,
    nations, and empires. All this change together, we understand, drive the cultural
    evolution that created the modern world. But history truncated incomplete without
    prehistory, and prehistory falls short without biology. The Neolithic revolution
    began only long enough ago, about ten thousand years, to produce a few changes
    in small ensembles of genes among the'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'newly settled populations. That amount of time is way too little to explain
    the hereditary and environmental origin of human nature itself. As populations
    spread around the world, they carried intact the basic genome prescribing human
    intelligence and the fundamentals of human social behavior.


    Sixty thousand years to ten thousand years before the present—the approximate
    time span of global settlement by humanity—is the equivalent of, very roughly,
    five hundred generations. That is still not enough to account for the origin of
    those traits that hold us together as a single species, including our bizarre
    hairiness and bipedal bodies, our globular skull crammed with an oversized brain,
    our apish emotions. Then, of great consequence, there was the common instinct
    to generate languages composed of arbitrary sounds and meanings. Also, there was
    the shared capacity to practice creative arts, as well as explore and innovate
    control of the environment, and invent creation myths that reinforce tribal regions.


    I think it fortunate that five hundred generations proved too short a time for
    our human species to split into multiple species, each reproductively isolated
    from the other, not hybridizing but with each generation diverging further apart.
    Such multiplication had been common in our older, prehuman ancestors. The moral
    and political problems presented would have been insoluble. The extermination
    of all but one could worked, which is how our species (Homo sapiens) evidently
    dealt with our sister species, the Neanderthals (Homo neanderthalensis).


    Human beings are not only weak in grasping but nearly unconscious of what is going
    around them in present time. In our daily lives we imagine ourselves to be aware
    of everything in the immediate environment. In fact, we sense fewer than one thousand
    of one percent of the diversity of molecules and energy waves that constantly
    sweep around and through us. The part perceived is just enough to safeguard our
    personal survival and reproduction, and for the most part appropriate for the
    stresses endured by our Paleolithic ancestors. This is the way that evolution
    by natural selection works. We are the product of a force that is both powerful
    and maximally parsimonious.


    Biologists use the German word Umwelt (roughly, "the world around us") to denote
    that part of the environment we are able to perceive by our unaided senses. The
    Umwelt was all our prehuman ancestors needed for millions of years to deal with
    the African savanna environment, but it was'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'enough. We survived, while other hominin species related to us, but with different
    perceptions and bad luck, did not. The same is true of condors patrolling the
    Andes, with telescopic vision and a keen sense of smell; of hagfish above the
    abyssal benthos, forever lost in midnight darkness, but geniuses at detecting
    faint traces of rotting flesh; or agelenid spiders, crouched far back in their
    funnel-shaped nests, alert to the slightest tug on a silken thread that betrays
    the passage of an insect prey.


    What then is the human Umwelt, and how did it come to be, and why? These are among
    the central questions of science and the humanities. A quick answer to the first
    part is that our species, having evolved as bright children of the African savannah,
    is adequate in several sensory modalities, weak in most, and a complete blank
    in others.


    We are primarily audiovisual, one of the few animals on the planet, with birds
    and a smattering of insects and other invertebrates, that depend on sight and
    sound to find their way. In vision, however, the only particle to which we respond
    is the photon. Still more restrictive, our photoreceptors detect no more than
    razor-thin slices of the electromagnetic spectrum. Our vision begins at the low-frequency
    end with red (and not even earlier to infrared) and ends short of ultraviolet
    at the high-frequency end. If we had a better set of colors and shades of colors
    for us to behold and name. If we potentially have a vast spread of colors and
    could add the vision of hawks and butterflies, the impact on the visual arts would
    be revolutionary.


    And sound? It is essential to our communication, but by comparison with the auditory
    journeys of the animal world, we are close to deaf. Bats of many species swoop
    and spin through the air and pluck-flying insects with almost unimaginable precision.
    Even more impressively, the bats don’t rely on sounds from the insects: they make
    high-frequency sounds of their own and locate the prey by the echoes that bounce
    back to them. Some kinds of moths are equipped with ears tuned to the bat emission
    frequency, and they are programmed to drop to the ground the instant they hear
    the clicking of bat echolocation. Other bats detect ripples on the surface of
    the water and snare fish by raking their claws through the water. Vampire bats
    of South America smell their prey—including humans who forget to close the windows—make
    small slices through the skin, and lap up the blood trickling out. (Perhaps the
    time has come to write another, chiropan *Dracula* epic.) At the opposite end'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'of the sound-frequency spectrum, elephants rumble in complex conversation too
    low in frequency for our ears.


    What about smell? Humans by comparison with the rest of life are virtually anosmic.
    Every environment, natural or cultivated, is alive with pheromones, chemicals
    used to communicate with members of the same species, and allomones, used by organisms
    to detect other species as potential predators, prey, or symbiotic partners. Every
    ecosystem is an “odorscape” of unintended complexity and brilliance. (Allow me
    to say “unimagined” for the odor and taste environment, since humans have almost
    no vocabulary for chemical reception.) When all invertebrates and microorganisms
    are counted in, ecosystems contain thousands of species to hundreds of thousands
    of species. We live within a natural world held together by odors.


    Even a trained naturalist walking through forest and meadow has no idea of the
    thunderous round-the-clock chorus of olfactory signals, its varying mixing a riot
    of airborne scent, beyond your key and mine not theirs, the forest dwellers primed
    to receive and upon whose perception their lives depend. Below the surface, other
    pheromones seep through soil and leaf litter; the whole in time are picked up
    by gentle breezes of air that brush the ground surface. Like invisible smoke,
    they disperse and disappear.


    Scientists studying the cheensory world, I have been impressed by how closely
    the pheromone molecules fit their functions in the species using them. The size
    of the pheromone molecule, the rate at which it disperses, the time and place
    it is released, and the sensitivity of other members of the same species ordains
    how the signal carries. It also fixes the amount of privacy needed. Consider a
    female moth calling for a mate. Her sex attractant must be unique to her species.
    Small quantities must travel far—up to kilometers in some cases—and it must be
    read and trigger a response in the right kind of mate, not another kind, or worse,
    a spider or moth-hunting wasp.


    So do the phantom worlds in which we actually exist mean for the humanities? Surely
    we cannot picture the living world and keep it safe without the soundscapes and
    odorsscapes by which it is organized.


    As a naturalist, I am reminded by the humanlike condition of the pleuston, the
    collection of organisms adapted to live exclusively in a two-'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'dimensional ecosystem, the surface of water. Riding the surface tension like
    acrobats on a safety net, they are a strange assemblage of microbes, algae, fungi,
    and tiny plants and animals.


    Only a few relative giants live in this molecular-thin slice of Earth’s biosphere.
    Among the most conspicuous are the water striders, members of the “true bug” order
    Hemiptera, to which also belong shield bugs, assassin bugs, lehoppers, scale insects,
    and aphids. All are distinguished by the possession of sharp-tipped proboscises,
    which they use to pierce and withdraw fluids from plants and animals. As ferocious
    predators, water striders rule the pleuston, competing with fish below and dragonflies
    and birds above for insects and spiders that accidentally fall into the water.
    They have evolved in precise detail for life within the pleuston: canoe-shaped
    bodies, three pairs of long, spindly legs specialized in turn, the rear for balance,
    the middle for speed, and the front directed forward from the head and lined with
    teeth for seizure of the prey with mantis-like strikes. Their middle and right
    legs stretch far out, distributing their body weight enough that their feet dimple
    the water tension but never break it. Their entire bodies and all the appendages
    are densely coated with microscopic water-repellent hairs. Nothing, not the fall
    of rain (each drop the equivalent of being flushed with a firehose), not the splash
    of waves, and not even pushed beneath the surface, can wet their bodies.


    Little wonder that a common name for water striders is Jesus bugs. By one criterion
    these denizens of the pleuston are enormously successful. With ancestors dating
    back at least one hundred million years, to the Age of Dinosaurs, water striders
    are today represented by more than two thousand species distributed in different,
    overlapping ranges over most of Earth’s surface. One group of species, members
    of the genus Halobates, are the only insects of any kind known to live within
    or upon the sea.


    The global pleuston is exquisitely adapted for the perpetually flat world in which
    it exists. Its member species never leave except for short trips from one body
    of water to another. Upward and downward trips into other realms of existence
    are rare and imperfect. Pleuston dwellers are largely unresponsive to body and
    instinct to the rest of reality. The skin of water, along with what comes in and
    what goes out, is the universe they know.


    The water striders, princes of this realm, seem so strange to us, but only as
    we are to them as perceived by their sense striders organs out of their world'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'into theirs. Our bodies are specialized for the ecosystem in which our species
    evolved. Our minds are accordingly limited. Our hope for full self-understanding
    depends on knowledge not just of ourselves but of the specialization of the other
    living systems around us.


    Is there a place for creative arts in the invisible codes and rhythms of the millions
    of species that share the planet with us? Perhaps in music and the visual arts?
    And what possibilities might await in synesthesia, the blending of sensory modalities
    into one another, say chemical into auditory or visual? Consider this surprise
    one step further. We may in the near future be able, with brain-science technology,
    to read the minds of at least songbirds, apes and reptiles, new butterflies, ants,
    and water striders. Then it will be possible to simulate their *Umwelten* with
    virtual reality.


    For the moment, however, we are physically trapped inside the humanity bubble,
    and worse, remain unconscious of its limitations. The grotesquely lopsided content
    restrictions on us is illustrated vividly by comparing the number of words used
    in different languages to classify sensory response in different modalities. With
    our celebrated Ju''/hoansi, the Kalahari Desert Bantu, who are hunter-gatherers
    with a social organization and daily activity schedule thought to have characteristic
    of the distant ancestors of all present-day humanity. In the full known vocabulary
    of 117 words in combined Ju''/hoansi dialects specifying senses, 25 percent refer
    to vision and 37 percent to hearing, but only 8 percent refer to either smell
    or taste. This disparity should be of no surprise, since the rest of us the Ju''/hoansi
    are relatively weak in smell and taste.


    The rest of humanity is remarkably similar in its sensory vocabularies. In the
    languages of Teton Dakota Sioux, Zulu, Japanese, and English-speaking people,
    words applying to vision from 25 to 49 percent of the whole, while only 6 to 10
    percent apply to smell and taste combined.


    The isolation of our specialized, audiovisual species is even more severe when
    compared with other animals. We are close to “blind” when speaking of touch, humidity,
    and temperature. Some kinds of freshwater fishes use electric fields to communicate
    with one another and hunt prey. We witness the activity with technology, but otherwise
    are oblivious to it (unless we grab one and suffer a potentially fatal shock).
    Nor can we detect Earth’s magnetic field, used by some bird species to navigate
    during their yearly migrations.'
