  md: '# 2


    # THE BIRTH OF THE HUMANITIES


    The humanities were not born of the oral epics of Mycenaean Greece, early Sumerian
    script pressed into clay, or the graven gods of predynastic Egypt. These rudiments
    are all younger than ten millennia, only an eyeblink in the history of our species.
    Nor will we find the dawn of the humanities in the cave paintings of Chauvet and
    Sulawesi, or the bird-bone flutes of the Swabian Jura. These artifacts, oldest
    known of their kind, were fashioned a little more than three millennia ago.


    The birth of the humanities occurred further back in time, closer to one thousand
    millennia, and it took place in the site and circumstance that upon reflection
    seem the most logical: the nocturnal firelight of the earliest human encampments.


    Such is the reconstruction being pieced together by a diverse array of researchers
    in paleontology, anthropology, psychology, brain science, and evolutionary biology.
    The research is part of the search for the origin of the human species itself,
    a grail of both science and the humanities. It is a reminder that history is the
    story of cultural evolution, while prehistory is that of genetic evolution. Prehistory
    tells us not only what happened prior to cultural history, but also why the human
    species as a whole followed one particular trajectory and not another.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Let us peer back in deep time for a moment. In order to compare various trajectories
    that could have been followed, researchers have at their disposal a large number
    of living Old World primates. Among these subjects are the monkeys and apes, our
    closest surviving phylogenetic cousins. In turn include stages close to what most
    likely were the human precondition.


    I''ve had the pleasure focused on social evolution to observe two species in the
    wild: vervets and baboons. I''ve spent three days in the midst of a semiwild population
    of rhesus maca, tutored by the pioneering primatologist Stuart Altman. I''ve had
    lunch at the Yerkes Primate Research Center at Emory University with Kanzi, an
    intensely studied bonobo raised in captivity. Kanzi''s species, which used to
    be called pygmy chimpanzees, are considered the most human-like of the primates.


    Expert studies of these and similar species have revealed that most of their time
    is spent exploring their environment for food. A smaller proportion is devoted
    to social interactions, including bonding and submission, grooming, courtship,
    mating, handling of infants, food discovery and retrieval, leadership, and conformity.


    Studies by each of the Old World monkeys and apes have increasingly focused on
    what each member learns while it watches and interacts with other members. The
    center of interest is how the animal uses this social information. When it imitates
    a groupmate, the scientists ask, what exactly is it imitating—the exact movements
    of the groupmate, or the consequence of its movements? If, for example, the groupmate
    pulls back a clump of grass to retrieve grasshoppers for a snack, what will the
    observer learn from this action—that grass yields food, or alternatively, the
    act of turning the grass yields food?


    Inasmuch as the individuals knows each of its groupmates as individuals, and can
    understand and predict their behavior, and further understands what the consequences
    will likely be, it can use this knowledge to its own personal advantage. Most
    importantly for the group, the observing animal knows how, when, and where to
    compete or to cooperate. The informed interplay between competition and cooperation
    is the flywheel of a successful social organization.


    Social primates, from langurs and macaques at the low end to chimpanzees and bonobos
    at the high end, have brains large enough to perceive the mood and likely response
    of a groupmate to a variety of situations. A member of such a well-organized society
    knows its place and'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'responds accordingly and accurately from one exchange to the next. The most
    successful member of a stable society has a strong sense of empathy. It can see
    what others see, feel what they feel, and gauge its response with precision—when
    to advance and when to retire, whom to groom and whom to avoid, whom to challenge
    and whom to placate.


    Empathy, the intelligence to read the feelings of others and predict their actions,
    is not the same as sympathy, the emotional concern felt for another’s plight combined
    with a desire to provide help and relief. It is closely related to sympathy, however,
    and led to sympathy in the course of human evolution.


    It follows that the best way for a scientist to study social behavior is to enter
    their lives with deliberate empathy and sympathy, to know them individually in
    as much detail and as close as possible. Fransal, the foremost expert on chimpanzee
    social behavior, states his investigative credo as follows.


    My profession depends on being in tune with animals. It would be terribly boring
    watching them for hours without any identification, any intuition about what is
    going on, any ups and downs related to their ups and downs. Empathy is my bread
    and butter, and I have made many a discovery by closely following the lives of
    animals and trying to understand why they act the way they do. This requires that
    I get under their skin. I have no trouble doing so, love and respect animals,
    and believe that this makes me a better student of their behavior.


    Social animals at or close to our level are hardwired to be that way. Neurobiologists
    have to recognize the existence of three neural routes activated in the brains
    of human and other advanced primates during social interactions. The first is
    mentalizing, in which goals are formed and appropriate activities planned to meet
    them. The second is empathizing, putting oneself in the skin of another to access
    their motives and feelings and anticipate their future actions. Empathy is a kind
    of gaming, through which the individual communicates with the group and the group
    thereby organizes itself.


    Finally, there is mirroring, by which the individual senses the mood and emotions
    of another, and experiences them to some degree. Mirroring leads readily to imitation
    of successful strategies by others. It is also part of the'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'gateway to sympathy and, among human beings at least, what we have come to
    treasure as the quality of mercy.


    Empathy and mirroring have evidently evolved to a degree that corresponds to the
    average amount of time members of the group interact with one another. Measurements
    of time show that such a correlation exists. Free-ranging savanna baboons (Papio
    cyunculus) spend less than 10 percent of their time socializing and 60 percent
    foraging and feeding. Vervet monkeys (Cercopithecus aethiops) spend 40 percent
    of their time foraging and feeding, and less time than baboons in socializing.


    Human beings spend a great deal of their time socializing than these and other
    Old World primates. Even though their schedules vary enormously according to occupation,
    people have always tended to meet in groups and engage in social exchanges between
    intervals of solitude. In the developed world, social life has been expanded almost
    endlessly through public entertainment and social media.


    Was human gregariousness the Darwinian driving force that led to our high levels
    of social intelligence—in particular, empathy, mirroring, and problem solving?
    Yes, but gregariousness was only part of the evolutionary process that created
    the human condition. For the complete story, we need to turn to the unique origin
    of social behavior in the ancestral hominins to the present time, as it has been
    constructed by experts. The signal event was a massive increase in brain size,
    mostly entailing the frontal lobe. Starting about three million years ago, the
    cranial capacity of our prehuman ancestors grew from that close to chimpanzees
    at 400 cubic centimeters (cc) to 600 cc in the habelines, then by a million years
    to 900 cc in our direct ancestors Homo erectus, and finally by the modern level
    (around 1300 cc) in Homo sapiens.


    In the process of evolution by natural selection, just as in everyday life, small
    events can have large, even great consequences. The small event in prehuman evolution
    appears to have been shift from a primarily vegetarian diet—fruit, seeds, soft
    foliage—to one with substantially more meat. The shift was made easier by the
    habitat in which it occurred. The African savanna was a vast expanse of grassland
    sprinkled with riverine forests and tropical trees. The harvesting was made easier
    by the presence of animals easily tracked (for those who know how) across the
    open plains. It was further helped by the frequent occurrence of lightning-struck
    fires, which trapped and killed many of the fleeing animals.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'The fires also cooked some of the victims, furnishing high-energy food, rich
    in protein and fat and easily chewed.


    As the change occurred, it necessitated an alteration of the entire gastrointestinal
    system, from mouth to anus. It also pushed the australopith ancestors into becoming
    more social. Whereas the vegetarian apes and monkeys tend to search and find independently,
    it became necessary for our ancestors to cooperate more closely for forays. Then,
    when a large food item was found by scavenging or the down of prey, there had
    to be sharing in a way that avoided potentially lethal combat. The hunting and
    scavenging of large animals opposed to collecting vegetable materials required
    a communal rendezvous, or den, or both.


    Finally, to cap this adaptive shift (as evolutionary biologists call it), the
    advantage of carnivory was strengthened by the control of fire. From a nearby
    ground fire, it is easy to obtain limbs and branches and carry them to a campsite.
    I did it myself as a Boy Scout on the edge of a dying fire in the pine savanna
    of Alabama. I found that when camp fires carelessly tended start forests, the
    reverse is also true: fire can be harvested and brought to camp. There was really
    no need for prehumans to start fires using flammable material with flints or spinning
    wheel.


    It is widely believed by experts that the habiline ancestors of modern humanity
    followed this scenario of carnivory and thereby a radical evolution of brain size
    and social intelligence. The theory has not yet been proven conclusively, but
    is supported by the fossil evidence of campsites and controlled fire in Homo erectus,
    a descendant of Homo habilis and direct ancestor of our species.


    Let''s now go further back into deeper genetic history. About six million years
    ago, an anthropoid ape inhabiting the African savanna split into two species.
    One led to the chimpanzee line, which was destined later to split again into two
    modern species, the “common” chimpanzee and its more humanlike cousin the bonobo.
    The other line of the original species and then multiple species of Homo, proceeding
    through the evolutionary labyrinth of australopith species and yielded modern
    humanity, comprising the single, destined-to-be apocalyptic species Homo sapiens.


    Because of the chimpanzees'' close genetic relationship to humans—we share 98
    percent of our genes by common descent—scientists have studied these apes intensely
    for what they might reveal about the origin of the human mind and social intelligence.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Individual chimpanzees, the scientists have found, know other group members
    thoroughly. They behave according to their own rank and relationship among the
    groupmates. They have surprisingly high IQs. They can learn sequences of numbers,
    for example “64136 . . .” faster and retain them better than humans. Because free-ranging
    chimps spend half their time in trees, this ability may be an adaptation for quick
    recall and assessment of limbs and trunks, and the best sequence that can support
    the chimps'' weight. Their arithmetic must also have been useful in following
    worm paths along the ground in an environment crowded with large predators. Lions,
    Crocodiles, and, above all, deadly tree-climbing leopards—each masters of ambush
    with their own techniques—lay almost everywhere hidden and waiting.


    Yet, although highly intelligent in at least one aspect, chimps score far below
    humans in others. They live in the here and now. They cannot plan their actions
    for the next day, whereas humans can construct thousands of years into the future
    and millions of miles into space. When supplied with paint and brush, chimps can
    draw pictures, but not as well as humans of any age beyond. For example, chimps
    can spontaneously draw the outline of a face, but not details within it, a feat
    any young human performs effortlessly.


    Chimpanzees also fall short in the ability to cooperate or act altruistically.
    Brian Hare and Jingzhi Tan, neuroscientists at Duke University, have summarized
    the evidence for both chimps and bonobos. They observed that the apes easily cooperate
    with their groupmates in mutually beneficial behavior, they can do so for a few,
    relatively simple tasks.


    We suspect that it is not a tendency to act altruistically that makes humans unique.
    Instead, it seems more likely our species is unusually cooperative because of
    our flexible ability to avoid high-cost helping (i.e., harmful to reproductive
    success) while recognizing the benefit of mutualistic endeavors . . .


    To express this increasingly complex subject as succinctly as possible, the ancestors
    of our species developed the brain power to connect with other minds and conceive
    unlimited time, distance, and potential'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'outcomes. This infinite reach of imagination, put quite simply, is what makes
    us great.


    Psychologists and neurobiologists have taken us this far into the what and how
    of human achievement. We need to press on to complete if possible the ultimate
    explanation of our origin. Why did it happen? Why are humans in the first place?
    We know, or believe we know, how partially carnivorous diet brought the prehuman
    groups to campsites and an increase in empathy, imitative capability, and cooperation.
    Why did these changes lead to a tripling of brain size, the most rapid evolutionary
    growth of a complex organ of all time?


    The answer, at least few anthropologists have come to believe, is actually in
    full sight. It has already been provided by the hunter-gatherer societies among
    us around the world. The forming of campsite and control of fire brings the group
    together tightly in the long evening hours before sleep. They neither hunt nor
    gather, have any other reason to venture out into the surrounding darkness. They
    draw close and communicate where there is no other choice. This period in the
    daily cycle is the time to tell stories, raise status tighten alliances, and settle
    scores. The fire is the life-giver. It warms and feeds the people. It creates
    a sanctuary of light, around which nocturnal predators circle but dare not enter.
    Firelight is the Prometheus that shone upon the gods and brought humanity closer
    to them.


    For our present self-understanding, it is of consuming importance to estimate
    what the ancestral humans said and did in the firelight. A recent thorough record
    was made by the anthropologist Polly W. Wiesner of the talk around the campfire
    of the most famous of Earth’s hunter-gatherers, the Ju/''hoansi (!Kung Bushmen)
    of the Kalahari Desert. Wiesner found differences between "daytime talk" and "firelight
    talk" that were more striking than imagined previously. Daytime talk is focused
    on practical aspects of travel and the search for food and water. People working
    together talk about the food they seek. They also gossip back forth in a manner
    that helps to stabilize their social networks. The subject matter is highly personal.
    Given the stringent quality of Ju/''hoansi existence, their talk is imbued with
    life-and-death choices. The conversation is practical. It doesn''t stray far,
    or play on the imagination and fantasies that are possible in periods of leisure.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'In the evening mood relaxes. In the chiaroscuro firelight the talk turns to
    storytelling, which drifts easily into singing, dancing, and religious ceremonies.
    Storytelling, especially among the men, turns frequently to successful hunts and
    epic adventures, their dominant daytime activity. As described by Elizabeth Marshall
    Thomas in her 2006 classic The Old Way: A Story of the First People, the stories
    are (or once were) commonly mythlike accounts of actual hunts. They were recited
    over and over by men in special voices, becoming almost chants, to which everyone
    listened. There follows one story, in the actual words of the hunter, of how an
