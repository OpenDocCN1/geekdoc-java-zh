  pgno: 73
- img_proc: true
  md: 'birth, in the number of species evolving from one epoch into the next. The
    history of any particular lineage is a journey through a constantly changing labyrinth.
    One wrong turn, one misstep of evolution, even a single unfortunate delay in an
    evolutionary adaptation, could have been fatal. The average lifespan of a mammal
