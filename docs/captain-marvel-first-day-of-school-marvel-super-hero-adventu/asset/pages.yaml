- img_proc: true
  md: 'No time to walk as school as Peter Parker!


    Uh-oh! Typical Parker luck--always bad!


    But with a little web-swinging as Spider-Man, I might make it.


    My spider-sense is tingling like crazy! There must be danger nearby--big danger!


    Yikes! Must be that meteor about to hit the city...


    ...and my SCHOOL!


    Whew! Good thing it only hit the football field!


    That could''ve been a lot worse--


    NOOOO!


    Not the football field!


    --it''s Captain Marvel fighting a robot!


    That''s not a meteor--


    Waitasec...'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Are you too crazy? This is a school!


    This is Ultron...


    ...and he doesn''t care!


    --and tried to keep him clear!


    He just wants to enslave all of humanity!


    I caught him tampering with a satellite in orbit--


    Gotta stop him now--


    --or there won''t be a planet for this school to stand on!


    In that case, I''d better give you a hand!


    Save the applause for now, webs! This won''t be easy.


    ultron''s planetary-level threat.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'Wait! Can''t you use your energy blasts to stop Ultron? They''re awesome!


    ...and I''m a good sport!


    Was that a joke?!


    Too awesome! They''d destroy the field...


    You''re not the only super hero who can crack a jo--


    # THAKOOOM!


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_10_0.png)


    This is getting out of control! Ultron could destroy the whole city, unless Cap
    and I stop him here and now.


    # KRAKKSSSHHH!


    Woo-hoo!


    Wha...?


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_10_1.png)


    Flash! Come back!'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'No way, Harry! I''m not gonna miss taking a selfie with my favorite super hero--


    Selfies?! Really?


    Go to class! We don''t have class! They called a delayed opening because of the
    fighting.


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_11_0.png)


    It''s too dangerous for you kids to be here!


    Besides, you and Captain Marvel are super heroes! You''ll keep us safe!


    Yes, we will --by keeping you out!


    Whoooooaaa!


    There! That web wall should keep everyone out--


    --so we can keep this nice and private!


    Puny human! I have already defeated Captain Marvel! How can you hope to stop me?


    Blind optimism, I guess. And don''t call me ''puny''!'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Big mistake, Ultron! You didn''t defeat me! You just made me mad!


    Your strongest blows are useless against Adamantium* body!


    *A-PA-MAN-TI-UM

    The strongest metal in the Marvel Universe!


    Then I''ll just have to try harder!


    What--??


    Can you stop throwing me around for a minute?

    What do you think you''re doing around you!


    aaaaaaaaaaaa...


    You might be Earth''s Mightiest Hero...

    ...but I''m a friendly neighborhood Spider-Man...

    ...and this Fight with Ultron is destroying this neighborhood!'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'You ask the wrong question! Preserving humans is not important. What matters
    is spreading the power of ultron!


    What good is saving the planet if you don''t protect it too?


    Okay, but--


    You should have asked what I was doing with that satellite when Captain Marvel
    interrupted me.


    KRADABABABADADA BOOOOOOOOMMM!'
