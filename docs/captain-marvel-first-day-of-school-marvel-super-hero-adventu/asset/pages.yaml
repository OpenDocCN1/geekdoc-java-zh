  md: '# # CAPTAIN MARVEL: FIRST DAY OF SCHOOL!


    Fisch, Sholly: Captain Marvel: First day of school! / 2020

    33305247505013\sca 03/09/20


    starring:


    Spider-Man & Captain Marvel


    > A bite from a radioactive spider gave PETER PARKER the speed, strength, and
    agility of an arachnid! After learning that with great power there must also come
    great responsibility, he became the crimefighting super hero SPIDER-MAN.


    > CAROL DANVERS was a U.S. Air Force pilot until an alien machine gave her superhuman
    powers. Now, she flies high as she uses her strength, speed, and the ability to
    absorb and fire energy bolts to protect the world as Earth''s Mightiest Hero:
    CAPTAIN MARVEL.


