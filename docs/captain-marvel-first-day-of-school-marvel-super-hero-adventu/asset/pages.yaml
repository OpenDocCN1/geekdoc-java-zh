  md: '# # FIRST DAY OF SCHOOL

    PART II


    Nothing can stop Ultron now!


    Why is there never an electromagnetic pulse handy to short-circuit evil robots?


    Of course, it would probably trash my phone too, sooo...


    Talk about a dead zone.


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_17_0.png)


    What''re we gonna do, Cap?!


    If the Ultron twins get into the neighborhood...


    You''re finished, evil robot guys! Because now we''re working as a...


    They won''t! We''ll keep them focused on us!


    ...What?


    I was afraid you''d say that.


    But at least you said "we" instead of "I"!


    "Team." You were supposed to say "team."'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Let''s see if giant iltron can take a pun--


    I guess it can!


    This thing''s nnghe tougher than it looks!


    # SLAMMMM!


    This doesn''t make sense!


    What? The evil, talking robot or the bigger evil, talking robot?


    I will crush you both to dust!


    All of it! Why Ultron travel into orbit to build a robot out of satellites when
    he could build one on Earth?


    Maybe it''s because of all those antennas?!


    It looks like they''re from communication satellites--the kind that transmit Wi-Fi
    signals!


    SO?


    If Ultron''s infected those satellites he could upload himself to the internet...


    ...and control every electronic device on Earth!'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'We have to keep him too distracted to do that!


    Take out his antennas before the world''s overrun by evil phones!


    No problem! That''s one antenna down--


    THOOOM!


    --AND I know just what to do with it!


    KRANNNNGGG!


    Here comes number seven?! two!


    You are becoming an annoyance!


    Wha--?


    Aw, that''s because you don''t know me yet! I can be more annoying--'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Human Fool! You Fight with only one body.


    --when you can''t reach me!


    You forget that Ultron fights with many!


    I didn''t forget anything. But I did trick you into blasting your last dish antenna!


    I...I no longer feel the connection to the world''s communications... to the world''s
    technology! This is your fault!


    see? I told you I could be more annoying!


    ...and filled with solar energy!


    You may damaged my antennas, but the satellites'' batteries are intact...'
  merge: -1
