  md: '> Sigh... Back to school. Back to tests, homework...


    # MIDTOWN HIGH SCHOOL


    > And football, Harry! Don''t forget football!


    > Puny Parker? I wonder where Peter is...?


    > C''mon, MJ. He''s probably off snuggling with a test tube somewhere.


    > If I Know Pete...'
