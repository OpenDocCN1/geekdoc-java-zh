- img_proc: true
  md: 'He''s out of power! You did it!


    But it''s... too much energy! I can''t...contain it all!


    What a pity, then, that this body still has more than enough power.


    One final blast from my eye beams should fini--


    Unless a little webbing stops you from Firing!


    Wretched insect! For this indignity, I will--


    THWIPPP!


    ~Mmmmmm?!


    MMMMBRRRRRRR!


    Aagh! You''ll pay for--'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Don''t... count on it, I might not be... able to release this energy around...
    people--but that... doesn''t mean I...have to do it...alone!


    What are you doing?


    Did you know I used to be...an Air pilot? We were always...pushing ourselves...
    higher, further, faster...


    It reminds me of a...phrase pilots use when the weather''s clear: "CAVU"


    It stands for-- --Ceiling and Visibility Limited!


    Stop! You cannot--'
  merge: -1
  pgno: 23
- img_proc: true
  md: '![](img/7c61c3bc969bac7aa054bceb4965ce8e_24_0.png)


    CAP!


    How could anyone survive that?


    I just hope she''s okay...


    Nice Of to worry. But...


    I''m Earth''s Mightiest Hero, remember?


    You''re all right! And you''re not all glow-y anymore!


    And ultron''s gone! My joke about the electromagnetic pulse gave me an idea.


    When I released all solar energy, it fried Ultron''s circuits!


    It''ll take him a long time to pull himself back together.


    Another day saved, thanks to Earth''s Mightiest Hero!


    I''d better take this thing away so that it can be disposed of safely.


    See you around, Web-head! We make a pretty good...


    Sure, but it still took a friendly hero to remind me that even when you''re saving
    the world you can''t stop looking out for the little guy.


    ...?


    "Team." You were supposed to say "team."'
  merge: -1
