    # 开学第一天

    ## 第一部分 I：FISCH - DEL PENINO - TARTAGLIA - CARAMAN


    我正在偷卫星，并利用原料……为自己制造另一个机器人身体！


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_14_0.png)


    噢哟。未完续！


    # 蜘蛛网

    由 你的邻社区蜘蛛侠主演


    > 噢，蜘蛛侠。


    > 女惊队长！


    > 看看我拿了什么！


    > 一张（一张）复仇者会员卡？


    > 我知道你真的很想要一个。


    > 噢不，你总是在最后时刻把它抢走了，因为我违反了什么规则或者别的……我不会再被骗了。


    > 这是一个惊喜！这是复仇者需要通过的测试。


    > 你觉得这些是真正的规则吗？真正的规则！


    > 真正的复仇者会知道这些规则的！


    这种（奥特隆）的力量……


    噢噢噢，这坏了！KRADABADADA BOOMM！


    # 火箭


    我讨厌周一。我是格鲁。


    > 不不不——我是在这儿说台词的，而且我讨厌周一！我是格鲁。


    > 别耍弄我！我讨厌周一！我讨厌周一！！我是格鲁。


    > 你们住在外太空。这里没有日子。我讨厌星星洛。我是格鲁。


    脚本和分画：Ty Templeton   色彩：Keiren Smith


    # 帕克和 绿巨人


    > 彼得·帕克……你真是个书呆，你竟然都有一个科学家人偶！


    > 唉！那不是泳池旗——是一个科学家人偶，布鲁斯·班纳博士……伽马炸弹的发明者。


