    # 城高中


    > 还有足球，哈利！别忘了足球！


    > 弱小帕克？我真奇奇彼得在哪儿呢……


    > 得得吧，MJ。他可能在某个地方抱着试管亲热呢。


    > 如果我了解彼得的话……他可能几小时前就来学校了！


    你知道的，你那皮肤状况真该涂点乳液。


    没错！那个邮箱箱完全不是机会！我承认你的那招很酷。


    没有什么能挡得住犀牛（Rhino）！


    SKRRUUUNNNNCH！


    但只有当你的脚踩地上时它才起作用！


    哈？


    我定要你……！


    > 噢，住手！


    呼！


    你害得我上学迟到了！


    > 噢噢……没时间像彼得·帕克那样慢吞吞走路了！


    > 糟！典型的帕克运气——总是这么背！


    但如果能像蜘蛛侠一样荡会儿网，我或许能赶上。


    我的蜘蛛感正灵敏得要命！附近一定有危险——大危险！


    > 天哪！一定是是那颗即将撞击城市的陨石……还有我的学校！


    > 谢！还好它只撞中了足球场！那本该糟糕得多——不！！！不是足球场！


    > 等等，你疯了吗？这是学校！这是奥特隆（Ultron）……他根本不在乎！他只想奴役全人类！我抓到他在破坏设备了。


    > 没有什么能挡得住犀牛（Rhino）！


