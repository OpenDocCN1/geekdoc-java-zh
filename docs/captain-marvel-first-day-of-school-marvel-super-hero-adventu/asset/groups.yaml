    ## FIRST DAY OF SCHOOL

    PART II


    Nothing can stop Ultron now!


    Why is there never an electromagnetic pulse handy to short-circuit evil robots?


    Of course, it would probably trash my phone too, sooo...


    Talk about a dead zone.


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_17_0.png)


    What''re we gonna do, Cap?!


    If the Ultron twins get into the neighborhood...


    You''re finished, evil robot guys! Because now we''re working as a...


    They won''t! We''ll keep them focused on us!


    ...What?


    I was afraid you''d say that.


    But at least you said "we" instead of "I"!


    "Team." You were supposed to say "team."


    Let''s see if giant Ultron can take a pun--


    I guess it can!


    This thing''s freaking tougher than it looks!


    # SLAMMMM!


    This doesn''t make sense!


    What? The evil, talking robot or the bigger evil, talking robot?


    I will crush you both to dust!


    All of it! Why Ultron travel into orbit to build a robot out of satellites when
    he could build one on Earth?


    Maybe it''s because of all those antennas?!


    It looks like they''re from communication satellites--the kind that transmit Wi-Fi
    signals!


    SO?


    If Ultron''s infected those satellites he could upload himself to the internet...


    ...and control every electronic device on Earth!


    We have to keep him too distracted to do that!


    Take out his antennas before the world''s overrun by evil phones!


    No problem! That''s one antenna down--


    THOOOM!


    --AND I know just what to do with it!


    KRANNNNGGG!


    Here comes number seven?! two!


    You are becoming an annoyance!


    Wha--?


    Aw, that''s because you don''t know me yet! I can be more annoying--


    Human Fool! You fight with only one body.


    --when you can''t reach me!


    You forget that Ultron fights with many!


    I didn''t forget anything. But I did trick you into blasting your last dish antenna!


    I...I no longer feel the connection to the world''s communications... to the world''s
    technology! This is your fault!


    see? I told you I could be more annoying!


    ...and filled with solar energy!


    You may damaged my antennas, but the satellites'' batteries are intact...


    > Spider-Man! Get back! Let me... zoom- absorb the blast!


    > Get...out of here!


    > Not while there''s danger--or without you! Anyone ever tell you... that you
    have an overdeveloped sense of... responsibility?


    > Once or twice.


    > I see you weaken! This will be over soon.


    > Ultron...said... his giant body is powered... by solar batteries... Pouring
    so much...power into his...eye beams must be...


    > ...draining them!


    SHZZAAAAAAKKKT!


    He''s out of power! You did it!


    But it''s... too much energy! I can''t...contain it all!


    What a pity, then, that this body still has more than enough power.


    One final blast from my eye beams should finish--


    Unless a little webbing stops you from firing!


    Wretched insect! For this indignity, I will--


    THWIPPP!


    ~Mmmmmm?!


    MMMMBRRRRRRR!


    Aagh! You''ll pay for--


    Don''t... count on it, I might not be... able to release this energy around...
    people--but that... doesn''t mean I...have to do it...alone!


    What are you doing?


    Did you know I used to be...an Air pilot? We were always...pushing ourselves...
    higher, further, faster...


    It reminds me of a...phrase pilots use when the weather''s clear: "CAVU"


    It stands for-- --Ceiling and Visibility Limited!


    Stop! You cannot--


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_24_0.png)


    CAP!


    How could anyone survive that?


    I just hope she''s okay...


    Nice of of to worry. But...


    I''m Earth''s Mightiest Hero, remember?


    You''re all right! And you''re not all glow-y anymore!


    And Ultron''s gone! My joke about the electromagnetic pulse gave me an idea.


    When I released all solar energy, it fried Ultron''s circuits!


    It''ll take him a long time to pull himself back together.


    Another day saved, thanks to Earth''s Mightiest Hero!


    I''d better take this thing away so that it can be disposed of safely.


    See you around, Web-head! We make a pretty good...


    Sure, but it still took a friendly hero to remind me that even when you''re saving
    the world you can''t stop looking out for the little guy.


    ...?


    "Team." You were supposed to say "team."


    Man, Captain Marvel really is something else!


    Two villains and one mighty team-up in a single morning. Sure was more excitement
    than I expected on the first day of...


    Scho!! I''m late for school!


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_25_0.png)


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_25_1.png)


    Flash said there''s a delayed opening. Maybe I can still make it!


    Come on, come on, come on...


    Almost there...


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_25_2.png)


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_25_3.png)


    Late again, Mister Parker? On the first day of school? I hope you were doing something
    important!


    Go to the principal''s office for a late pass, and then we can discuss you joining
    class!

    '
  mdcn: '


    ## 开学第一天

    第二部分


    现在没有什么能阻挡奥特隆了！


    为什么手边永远没有现成的电磁脉冲来冲坏这些坏机器人呢？


    当然，那可能也会把我的手机也搞毁，所以……


    这简直是片信号死区。


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_17_0.png)


    我们该怎么办，队长？！


    如果奥特隆双胞胎闯进这个社区……


    你们完蛋了，坏机器人家伙！因为我们现在正在当一个……


    他们进不来的！我们会让他们注意力集中在我们身上！


    ……什么？


    我就怕你会这么说。


    但至少你说了“我们”而不是“我”！


    “团队”。你本该说“团队”的。


    让我们看看巨型奥特隆能不能接住一个梗——


    我猜它可以！


    这家伙比看起来要硬得多！


    # 砰砰！


    这不符合逻辑！


    什么？是指那个坏的会说话的机器人，还是那个更大的坏的会说话的机器人？


    我会把你们两个都化成灰尘！


    全部！奥特隆为什么要去轨道上利用卫星制造机器人，而他明明可以在地球上造一个？


    也许是因为所有那些天线？！


    它们看起来像是通信卫星——那种能传输 Wi-Fi 信号的卫星！


    那又？


    如果奥特隆感染了那些卫星，他就可以把自己上传到互联网……


    ……然后控制地球上的每一个电子设备！


    我们必须让他保持分心，没法那样做！


    在世界被坏手机占领之前，先解决掉他的天线！


    没问题！搞掉了一根天线——


    轰！


    ——而且我知道该怎么处理它！


    当当当当！


    七号来了？！二号来了？！


    你变得越来越招人烦了！


    什么——？


    噢，那是因为你还不了解我！我可以变得更招人烦——


    人类愚蠢！你只用一个身体战斗。


    ——何当你够不到我的时候！


    你忘记了奥特隆是用多个身体在战斗！


    我没有忘记任何事。但我确实骗你发射了你的最后一根卫星天线！


    我……我再感受不到与世界的连接……与世界的科技连接了！这是你的错！


    看到吧？我告诉过你我可以变得更招人烦！


    ……而且充满了太阳能！


    你们可能损坏了我的天线，但卫星的电池还是完好无损的


    > 蜘蛛侠！后退！让我……快速——吸收那波冲击！


    > 快……离开这儿！


    > 只要还有危险——或者只要没你在！！有人告诉过你……那你的责任感过头吗？


    > 有过一两次。


    > 我看到你变虚弱了！这一切很快就会结束。


    > 奥特隆……说……他巨大的躯体是由太阳电池……驱动的……向入这么多……能量到他的……眼光中一定是……


    > ……在耗尽它们！


    嘶啦啦啦！


    他没电了！你做到了！


    但是……能量太大了！我无法……控制住所有的能量！


    那真遗憾，这具躯体还有足够的能量。


    来自我眼射的最后一次爆发就能结束——


    除非一小蜘蛛网阻止了你的发射！


    可怜的昆虫！为了这种耻辱，我会——


    嗖！


    ~嗯？！


    唔唔唔唔！


    啊！你会付出代价的——


    别……指望了，我可能无法在……人们周围……释放这种能量——但那……并不意味着我……必须独自……这样做！


    你在做什么？


    你知道吗，我曾经是……一名飞行员吗？我们总是……推着自己……飞得更高、更远、更快……


    这让我想起……飞行员在天气晴朗时用的一个短语：“CAVU”


    它的意思是——云层和能见度限制！


    住！你不能——


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_24_0.png)


    队长！


    那怎么可能活得下来？


    我只希望她没事……


    真会担心。但是……


    我是地球最强英雄，记得吧？


    你没事了！你不再发光了！


    奥特隆消失了！我关于电磁脉冲的笑话给了我灵感。


    当我释放所有的太阳能时，它烧毁了奥特隆的电路！


    他需要很长时间才能重新恢复。


    又拯救了一个一天，多亏了地球最强英雄！


    我最好把这东西带走，这样就可以安全处置了。


    回见，网头！我们配合得挺不错的……


    没错，但还是需要一个友好的英雄提醒我，即使在拯救世界时，你也不能停止关注小人物。


    ……？


    “团队”。你本该说“团队”的。


    老天，惊奇队长真的很了不起！


    一个上午就有两个反派和一个强大的联手。这确实比我对比开学第一天的预想要刺激得多……


    学！！我上学迟了！


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_25_0.png)


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_25_1.png)


    闪电说开学延迟了。也许我还能赶上！


    快点，快点，快点……


    快到了了……


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_25_2.png)


    ![](img/7c61c3bc969bac7aa054bceb4965ce8e_25_3.png)


    又迟到了，帕克先生？在开学第一天？我希望你是在做什么重要的事情！


    去校长办公室请迟到条，然后我们再讨论你上课的事！


    '
