    # 3.1 Conditional Statements: if-else


    Conditional statements allow us to execute specific blocks of code based on certain
    conditions. The most basic form of a conditional statement is the if-else statement.


    The syntax of the if-else statement is as follows:


    ```java


    if (condition) {


    // code to execute if the condition is true


    } else {


    // code to execute if the condition is false


    }


    ```


    Example:


    ```java


    int age = 18;


    if (age >= 18) {


    System.out.println("You are eligible to vote.");


    } else {


    System.out.println("You are not eligible to vote yet.");


    }


    ```


    In the example above, if the condition `age >= 18` evaluates to true, the message
    "You are eligible to vote." will be displayed. Otherwise, if the condition is
    false, the message "You are not eligible to vote yet." will be displayed.


    # 3.2 Switch Statement


    The switch statement provides an alternative way to perform multiple conditional
    checks based on the value of an expression. It allows you to specify different
    actions to be taken for different possible values of the expression.


    The syntax of the switch statement is as follows:


    ```java


    switch (expression) {


    case value1:


    // code to execute if expression equals value1


    break;


    case value2:


    // code to execute if expression equals value2


    break;


    // more case statements...


    default:


    // code to execute if none of the cases match the expression


    }


    ```


