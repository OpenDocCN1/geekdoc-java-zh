    # Chapter 5: Arrays


    In Chapter 4, we explored the concept of methods and how they allow us to organize
    and reuse code. Now, in Chapter 5, we will dive into the world of arrays. Arrays
    are fundamental data structures in Java that allow us to store and manipulate
    collections of elements. They provide a powerful way to work with multiple values
    of the same type.


    # 5.1 Introduction to Arrays


    An array is a container object that holds a fixed number of values of the same
    type. Each value in the array is called an element, and each element is accessed
    by its index. Arrays provide a convenient way to store and access multiple related
    values in a single variable.


    # 5.2 Declaring and Initializing Arrays


    To use an array, we need to declare and initialize it. The declaration specifies
    the type of elements the array will hold, and the initialization assigns actual
    values to the array elements.


    The syntax for declaring an array is as follows:


    ```java


    type[] arrayName;


    ```


    Example:


    ```java


    int[] numbers;


    ```


    In the example above, we declare an array named `numbers` that will hold elements
    of type `int`. However, at this point, the array is uninitialized and doesn''t
    hold any values.


    To initialize an array, we can use one of the following methods:


    # 5.2.1 Inline Initialization


    We can initialize an array with values directly at the time of declaration using
    curly braces `{}`.


    ```java


    type[] arrayName = {value1, value2, value3, ...};


    ```


    Example:


    ```java


    int[] numbers = {1, 2, 3, 4, 5};


    ```


    In the example above, we declare and initialize an array named `numbers` with
    the values 1, 2, 3, 4, and 5.


    # 5.2.2 Initializing with the new Operator


    We can also initialize an array using the `new` operator. This method allows us
    to specify the size of the array.


    ```java


    type[] arrayName = new type[size];


    ```


    Example:


    ```java


    int[] numbers = new int[5];


    ```


    In the example above, we declare and initialize an array named `numbers` with
    a size of 5\. The array is initially filled with default values (`0` for `int`).


    # 5.3 Accessing Array Elements


    Array elements can be accessed using their index, which starts from 0 and goes
    up to `length - 1`, where `length` represents the number of elements in the array.


    The syntax to access an array element is as follows:


    ```java


    arrayName[index]


    ```


    Example:


    ```java


    int[] numbers = {10, 20, 30};


    int firstElement = numbers[0]; // Accessing the first element (10)


    int secondElement = numbers[1]; // Accessing the second element (20)


    ```


    In the example above, we access the first and second elements of the `numbers`
    array using the respective indices.


    # 5.4 Array Length


    The `length` property of an array returns the number of elements it can hold.
    It is a final variable, so it cannot be modified.


    The syntax to get the length of an array is as follows:


    ```java


    arrayName.length


    ```


    Example:


    ```java


    int[] numbers = {1, 2, 3, 4, 5};


    int arrayLength = numbers.length; // Length of the array (5)


    ```


    In the example above, we get the length of the `numbers` array and store it in
    the variable `arrayLength`.


    # 5.5 Modifying Array Elements


    Array elements can be modified by assigning new values to them using their indices
    and the assignment operator (`=`).


    Example:


    ```java


    int[] numbers = {1, 2, 3, 4, 5};


    numbers[2] = 10; // Modifying the third element to 10


    ```


    In the example above, we modify the third element of the `numbers` array by assigning
    it a new value of 10.


    # 5.6 Iterating Over Arrays


    To access and process all the elements of an array, we can use loops, such as
    the `for` loop.


    Example:


    ```java


    int[] numbers = {1, 2, 3, 4, 5};


    for (int i = 0; i < numbers.length; i++) {


    System.out.println(numbers[i]);


    }


    ```


    In the example above, we use a `for` loop to iterate over each element of the
    `numbers` array. The loop starts from index 0 and goes up to `numbers.length -
    1`, printing each element to the console.


    # 5.7 Multidimensional Arrays


    In Java, we can also have multidimensional arrays, which are arrays of arrays.
    They allow us to store elements in a matrix-like structure.


    Example:


    ```java


    int[][] matrix = {


    {1, 2, 3},


    {4, 5, 6},


    {7, 8, 9}


    };


    ```


    In the example above, we declare and initialize a 2-dimensional array named `matrix`.
    It contains three rows and three columns.


    To access elements in a multidimensional array, we use nested loops.


    Example:


    ```java


    for (int i = 0; i < matrix.length; i++) {


    for (int j = 0; j < matrix[i].length; j++) {


    System.out.print(matrix[i][j] + " ");


    }


    System.out.println();


    }


    ```


    In the example above, we use nested `for` loops to iterate over each element of
    the `matrix` array and print them row by row.


    5.8 Summary


    In this chapter, we explored the concept of arrays in Java. Arrays are powerful
    data structures that allow us to store and manipulate collections of elements.
    We learned how to declare and initialize arrays, access and modify array elements,
    retrieve the length of an array, and iterate over arrays using loops. We also
    briefly touched upon multidimensional arrays.


    Arrays provide a convenient way to work with multiple values of the same type
    and offer flexibility in organizing and processing data. They are widely used
    in various programming scenarios, such as storing a list of numbers, managing
    sets of objects, or representing matrices.


    In the next chapter, we will delve into the world of object-oriented programming
    (OOP) and explore classes and objects, which form the foundation of OOP. Get ready
    to learn about encapsulation, abstraction, and the principles of object-oriented
    design.


    # Chapter 6: Object-Oriented Programming (OOP)


    In the previous chapters, we covered the basics of Java programming, including
    variables, control flow, methods, and arrays. Now, in Chapter 6, we will delve
    into the world of Object-Oriented Programming (OOP). Object-Oriented Programming
    is a programming paradigm that focuses on modeling real-world objects and their
    interactions within a program.


    # 6.1 Introduction to Object-Oriented Programming


    Object-Oriented Programming (OOP) is a programming paradigm that organizes code
    into objects, which are instances of classes. It emphasizes the concepts of encapsulation,
    inheritance, polymorphism, and abstraction. OOP allows us to create modular, reusable,
    and maintainable code by representing real-world entities as objects with properties
    (attributes) and behaviors (methods).


    # 6.2 Classes and Objects


    In OOP, a class is a blueprint or template that defines the structure and behavior
    of objects. It describes the attributes and methods that objects of that class
    will possess. Objects, on the other hand, are instances of classes. They represent
    specific entities and can interact with each other.


    To create a class, we use the following syntax:


    ```java


    public class ClassName {


    // class members (fields, constructors, methods)


    }


    ```


    Example:


    ```java


    public class Car {


    // class members


    }


    ```


    In the example above, we define a class named `Car`. It serves as a blueprint
    for creating car objects.


    To create an object (instance) of a class, we use the `new` keyword:


    ```java


    ClassName objectName = new ClassName();


    ```


