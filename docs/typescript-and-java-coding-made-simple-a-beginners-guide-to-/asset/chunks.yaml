    3.  将`FileReader`对象包装在`BufferedReader`对象中以实现高效读取。\n4.  使用`BufferedReader`的`readLine()`方法逐行读取文件内容。\n\
    \n示例：\n\n```java\nimport java.io.BufferedReader;\nimport java.io.File;\nimport\
    \ java.io.FileReader;\nimport java.io.IOException;\n\npublic class FileReadingExample\
    \ {\n    public static void main(String[] args) {\n        File file = new File(\"\
    example.txt\"); // 将 \"example.txt\" 替换为实际文件路径\n        try (FileReader fileReader\
    \ = new FileReader(file);\n             BufferedReader bufferedReader = new BufferedReader(fileReader))\
    \ {\n            String line;\n            while ((line = bufferedReader.readLine())\
    \ != null) {\n                System.out.println(line);\n            }\n     \
    \   } catch (IOException e) {\n            System.out.println(\"读取文件时发生错误: \"\
    \ + e.getMessage());\n        }\n    }\n}\n```\n\n在上面的示例中，我们创建了一个表示文件\"example.txt\"\
    的`File`对象。我们使用`FileReader`对象读取文件，并将其包装在`BufferedReader`中以实现高效读取。然后，我们使用`while`循环，通过`readLine()`方法逐行读取文件，直到返回`null`，表示文件结束。每一行都被打印到控制台。\n\
    \n要向文件写入数据，我们遵循类似的步骤：\n\n1.  创建一个表示文件的`File`对象。\n2.  创建一个`FileWriter`对象，并将`File`对象作为参数传递。\n\
    3.  将`FileWriter`对象包装在`BufferedWriter`对象中以实现高效写入。\n4.  使用`BufferedWriter`的`write()`方法将数据写入文件。\n\
    \n示例：\n\n```java\nimport java.io.BufferedWriter;\nimport java.io.File;\nimport\
    \ java.io.FileWriter;\nimport java.io.IOException;\n\npublic class FileWritingExample\
    \ {\n    public static void main(String[] args) {\n        File file = new File(\"\
