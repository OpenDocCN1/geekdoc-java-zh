    \ 的会话 API 将其保存到数据库。\n\nORM 框架提供了一种便捷且面向对象的方式来与数据库交互，抽象了 JDBC 和 SQL 的底层细节。\n\n\
    # 10.4 事务管理\n\n事务管理是数据库交互的一个重要方面。事务是一个逻辑工作单元，由多个数据库操作组成，例如插入、更新和删除。事务通过将相关的数据库操作分组并强制执行\
    \ ACID（原子性、一致性、隔离性、持久性）属性来确保数据的完整性和一致性。\n\n在 Java 中，我们可以使用 JDBC 的 `Connection`\
    \ 接口或借助 ORM 框架（如 Hibernate）来管理事务，这些框架为事务管理提供了更高级别的抽象。\n\n使用 JDBC 的示例：\n\n```java\n\
    Connection connection = DriverManager.getConnection(url, username, password);\n\
    connection.setAutoCommit(false);\ntry {\n    // Perform database operations\n\
    \    // ...\n    // Commit the transaction\n    connection.commit();\n} catch\
    \ (SQLException e) {\n    // Rollback the transaction in case of an error\n  \
    \  connection.rollback();\n    e.printStackTrace();\n} finally {\n    // Close\
    \ the connection\n    connection.close();\n}\n```\n\n在此示例中，我们禁用了自动提交模式并手动管理事务。如果在数据库操作期间发生异常，我们将回滚事务以撤销所做的任何更改并确保数据一致性。\n\
    \n# 10.5 数据访问模式\n\n在使用数据库时，遵循良好的数据访问模式对于优化性能和保持代码可维护性至关重要。一些常见的数据访问模式包括：\n\n-\
    \ 数据访问对象（DAO）：DAO 模式将数据访问逻辑与应用程序的业务逻辑分离。它为对特定实体执行 CRUD（创建、读取、更新、删除）操作提供了一致的接口。\n\
    \n- 仓储（Repository）：仓储模式抽象了特定领域实体的数据存储和检索操作。它提供了一个更高级别的 API 来查询和操作数据，而无需暴露底层数据库细节。\n\
    \n- 查询构建器（Query Builder）：查询构建器模式提供了一种流畅且编程的方式来构建 SQL 查询。它允许根据运行时条件动态生成查询，并促进代码重用。\n\
    \n通过遵循这些模式，我们可以编写更清晰、更易于维护的数据库代码。\n\n在本章中，我们探讨了使用 Java 与数据库交互的基础知识。我们学习了提供数据库访问低级\
    \ API 的 JDBC，以及提供更高级别抽象的 ORM 框架（如 Hibernate）。我们还讨论了事务管理和常见的数据访问模式。\n\n在下一章中，我们将深入探讨使用\
    \ Java 进行 Web 开发，并探索如何使用流行框架和技术构建 Web 应用程序。\n\n# 第 11 章：使用 Java 进行 Web 开发\n\n\
    在当今的数字时代，Web 开发是构建交互式和动态应用程序的关键技能。Java 为 Web 开发提供了一个强大的生态系统，提供了各种简化该过程的框架和技术。在本章中，我们将探索使用\
    \ Java 进行 Web 开发的世界。\n\n# 11.1 Web 开发简介\n\nWeb 开发指的是创建在 Web 浏览器上运行并与用户交互的 Web\
    \ 应用程序。它涉及设计、构建和维护网站及基于 Web 的系统。Web 开发涵盖了 Web 应用程序的客户端（前端）和服务器端（后端）组件。\n\n客户端技术包括\
    \ HTML、CSS 和 JavaScript，它们决定了应用程序的用户界面和交互性。服务器端技术处理 Web 应用程序的处理、逻辑和数据管理。\n\n#\
    \ 11.2 Java Web 技术\n\nJava 提供了一系列用于 Web 开发的技术和框架。让我们探讨一些关键组件：\n\n## 11.2.1 Java\
    \ Servlets\n\nJava Servlets 提供了一种平台无关的方式来构建 Java Web 应用程序。Servlets 是扩展 `javax.servlet.HttpServlet`\
    \ 类并处理 HTTP 请求和响应的 Java 类。它们是 Java 服务器端 Web 开发的基础。\n\nServlets 接收请求，执行业务逻辑，并生成发送回客户端的动态内容。它们可以处理各种\
    \ HTTP 方法，如 GET、POST、PUT 和 DELETE，使其成为构建 RESTful API 的多功能选择。\n\nServlet 示例：\n\n\
    ```java\n@WebServlet(\"/hello\")\npublic class HelloServlet extends HttpServlet\
    \ {\n    protected void doGet(HttpServletRequest request, HttpServletResponse\
    \ response) throws ServletException, IOException {\n        response.setContentType(\"\
    text/html\");\n        PrintWriter out = response.getWriter();\n        out.println(\"\
    <html><body>\");\n        out.println(\"<h2>Hello, Servlet!</h2>\");\n       \
    \ out.println(\"</body></html>\");\n        out.close();\n    }\n}\n```\n\n在此示例中，我们创建了一个简单的\
    \ servlet，它响应一个显示 \"Hello, Servlet!\" 消息的 HTML 页面。\n\n## 11.2.2 JavaServer Pages\
    \ (JSP)\n\nJavaServer Pages (JSP) 是一种允许使用 HTML 和 Java 代码组合创建动态网页的技术。JSP 页面被编译成\
    \ servlets 并在服务器上执行，生成发送给客户端的动态内容。\n\nJSP 提供了一种便捷的方式来将表示层（HTML）与业务逻辑（Java 代码）分离。它支持在\
    \ HTML 模板中嵌入 Java 代码，使得生成动态内容变得容易。\n\nJSP 示例：\n\n```jsp\n<html>\n<body>\n<h2>Hello,\
    \ JSP!</h2>\n<p>Today is <%= new java.util.Date() %></p>\n</body>\n</html>\n```\n"
