    ;\n\nlet origin: Point = { x: 0, y: 0 };\nlet shape: Shape = \"circle\";\n```\n\
    \n### Generics\n\nGenerics in TypeScript allow us to create reusable components\
    \ that can work with multiple types. They provide a way to define placeholders\
