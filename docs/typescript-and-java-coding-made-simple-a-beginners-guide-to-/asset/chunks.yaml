    # 10.3 Object-Relational Mapping (ORM)


    Object-Relational Mapping (ORM) frameworks, such as Hibernate, JPA (Java Persistence
    API), and MyBatis, provide higher-level abstractions for database interaction
    in Java. ORM frameworks map Java objects to database tables, abstracting the complexities
    of SQL queries and database-specific operations.


    ORM frameworks offer features like automatic mapping, query generation, caching,
    and transaction management, simplifying the development of database-driven applications.


    Example using Hibernate:


    ```java


    @Entity


    @Table(name = "users")


    public class User {


    @Id


    @GeneratedValue(strategy = GenerationType.IDENTITY)


    private Long id;


    @Column(name = "name")


    private String name;


    // Getters and setters


    }


    // Usage


    Session session = HibernateUtil.getSessionFactory().openSession();


    Transaction transaction = session.beginTransaction();


    User user = new User();


    user.setName("John Doe");


    session.save(user);


    transaction.commit();


    session.close();


    ```


    In this example, we define a `User` entity class annotated with Hibernate annotations.
    We create a new instance of `User`, set its properties, and save it to the database
    using Hibernate''s session API.


    ORM frameworks provide a convenient and object-oriented way to interact with databases,
    abstracting the low-level details of JDBC and SQL.


    # 10.4 Transaction Management


    Transaction management is an essential aspect of database interaction. A transaction
    is a logical unit of work that consists of multiple database operations, such
    as inserts, updates, and deletes. Transactions ensure data integrity and consistency
    by grouping related database operations and enforcing the ACID (Atomicity, Consistency,
    Isolation, Durability) properties.


    In Java, we can manage transactions using JDBC''s `Connection` interface or with
    the help of ORM frameworks like Hibernate, which provide higher-level abstractions
    for transaction management.


    Example using JDBC:


    ```java


    Connection connection = DriverManager.getConnection(url, username, password);


    connection.setAutoCommit(false);


    try {


    // Perform database operations


    // ...


    // Commit the transaction


    connection.commit();


    } catch (SQLException e) {


    // Rollback the transaction in case of an error


    connection.rollback();


    e.printStackTrace();


    } finally {


    // Close the connection


    connection.close();


    }


    ```


    In this example, we disable the auto-commit mode and manually manage the transaction.
    If an exception occurs during the database operations, we rollback the transaction
    to revert any changes made and ensure data consistency.


    # 10.5 Data Access Patterns


    When working with databases, it''s essential to follow good data access patterns
    to optimize performance and maintain code maintainability. Some common data access
    patterns include:


    - Data Access Object (DAO): The DAO pattern separates the data access logic from
    the business logic of an application. It provides a consistent interface for performing
    CRUD (Create, Read, Update, Delete) operations on a specific entity.


    - Repository: The repository pattern abstracts the data storage and retrieval
    operations for a specific domain entity. It provides a higher-level API for querying
    and manipulating data without exposing the underlying database details.


    - Query Builder: The query builder pattern offers a fluent and programmatic way
    to construct SQL queries. It allows for dynamic query generation based on runtime
    conditions and facilitates code reusability.


    By following these patterns, we can write cleaner and more maintainable database
    code.


    In this chapter, we explored the fundamentals of interacting with databases using
    Java. We learned about JDBC, which provides a low-level API for database access,
    and ORM frameworks like Hibernate, which offer higher-level abstractions. We also
    discussed transaction management and common data access patterns.


    In the next chapter, we will delve into web development with Java and explore
    how to build web applications using popular frameworks and technologies.


    # Chapter 11: Web Development with Java


    In today''s digital age, web development is a crucial skill for building interactive
    and dynamic applications. Java provides a robust ecosystem for web development,
    offering various frameworks and technologies that simplify the process. In this
    chapter, we will explore the world of web development with Java.


    # 11.1 Introduction to Web Development


    Web development refers to the creation of web applications that run on web browsers
    and interact with users. It involves designing, building, and maintaining websites
    and web-based systems. Web development encompasses both the client-side (front-end)
    and server-side (back-end) components of web applications.


    Client-side technologies include HTML, CSS, and JavaScript, which determine the
    user interface and interactivity of the application. Server-side technologies
    handle the processing, logic, and data management of web applications.


    # 11.2 Java Web Technologies


    Java offers a range of technologies and frameworks for web development. Let''s
    explore some of the key components:


    # 11.2.1 Java Servlets


    Java Servlets provide a platform-independent way to build web applications in
    Java. Servlets are Java classes that extend the `javax.servlet.HttpServlet` class
    and handle HTTP requests and responses. They are the foundation of Java''s server-side
    web development.


    Servlets receive requests, perform business logic, and generate dynamic content
    that is sent back to the client. They can handle various HTTP methods like GET,
    POST, PUT, and DELETE, making them versatile for building RESTful APIs.


    Example Servlet:


    ```java


    @WebServlet("/hello")


    public class HelloServlet extends HttpServlet {


    protected void doGet(HttpServletRequest request, HttpServletResponse response)
    throws ServletException, IOException {


    response.setContentType("text/html");


    PrintWriter out = response.getWriter();


    out.println("<html><body>");


    out.println("<h2>Hello, Servlet!</h2>");


    out.println("</body></html>");


    out.close();


    }


    }


    ```


    In this example, we create a simple servlet that responds with an HTML page displaying
    a "Hello, Servlet!" message.


    # 11.2.2 JavaServer Pages (JSP)


    JavaServer Pages (JSP) is a technology that allows the creation of dynamic web
    pages using a combination of HTML and Java code. JSP pages are compiled into servlets
    and executed on the server, generating dynamic content that is sent to the client.


    JSP provides a convenient way to separate the presentation layer (HTML) from the
    business logic (Java code). It enables the embedding of Java code within HTML
    templates, making it easy to generate dynamic content.


    Example JSP:


    ```jsp


    <html>


    <body>


    <h2>Hello, JSP!</h2>


    <p>Today is <%= new java.util.Date() %></p>


    </body>


    </html>'
