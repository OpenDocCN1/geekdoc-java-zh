    # Chapter 7: Exception Handling and File I/O


    In the previous chapters, we covered the basics of Java programming, including
    variables, control flow, methods, arrays, Object-Oriented Programming (OOP), and
    more. Now, in Chapter 7, we will explore two important topics: Exception Handling
    and File Input/Output (I/O).


    # 7.1 Introduction to Exception Handling


    Exception handling is a mechanism in Java that allows us to handle runtime errors
    or exceptional conditions that may occur during the execution of a program. These
    exceptions can be caused by various factors, such as invalid input, divide-by-zero
    errors, file not found, and more.


    By handling exceptions, we can gracefully recover from errors, provide meaningful
    error messages to the user, and prevent the program from crashing. Java provides
    a built-in exception handling mechanism using the `try-catch-finally` blocks.


    # 7.2 The try-catch-finally Blocks


    The `try-catch-finally` blocks are used to handle exceptions in Java. The `try`
    block contains the code that may throw an exception. The `catch` block is used
    to catch and handle the exception, providing an alternative course of action.
    The `finally` block is optional and is used to execute code that should always
    run, regardless of whether an exception occurred or not.


    Syntax:


    ```java


    try {


    // Code that may throw an exception


    } catch (ExceptionType1 exception1) {


    // Exception handling for ExceptionType1


    } catch (ExceptionType2 exception2) {


    // Exception handling for ExceptionType2


    } finally {


    // Code that always runs


    }


    ```


    Example:


    ```java


    try {


    // Code that may throw an exception


    int result = divide(10, 0); // Example divide-by-zero error


    } catch (ArithmeticException ex) {


    // Exception handling for ArithmeticException


    System.out.println("An arithmetic exception occurred: " + ex.getMessage());


    } finally {


    // Code that always runs


    System.out.println("Inside the finally block.");


    }


    ```


    In the example above, the `try` block attempts to divide `10` by `0`, which will
    throw an `ArithmeticException`. The `catch` block catches the exception and handles
    it by printing an error message. The `finally` block is executed regardless of
    whether an exception occurred or not.


    # 7.3 Checked and Unchecked Exceptions


    In Java, exceptions are categorized into two types: checked exceptions and unchecked
    exceptions.


    Checked exceptions are exceptions that must be declared in the method signature
    using the `throws` keyword or handled using a `try-catch` block. Examples of checked
    exceptions include `IOException`, `SQLException`, and `ClassNotFoundException`.


    Unchecked exceptions, also known as runtime exceptions, do not need to be declared
    or caught explicitly. They are subclasses of the `RuntimeException` class. Examples
    of unchecked exceptions include `ArithmeticException`, `NullPointerException`,
    and `ArrayIndexOutOfBoundsException`.


    It is important to handle or declare checked exceptions to ensure proper error
    handling and maintain code robustness. Unchecked exceptions, on the other hand,
    can be handled optionally.


    # 7.4 File Input/Output (I/O)


    File Input/Output (I/O) is the process of reading from and writing to files in
    a computer system. Java provides several classes and methods for performing file
    I/O operations, allowing us to create, read, write, and manipulate files.


    The key classes involved in file I/O operations are `File`, `FileReader`, `FileWriter`,
    `BufferedReader`, `BufferedWriter`, `InputStream`, `OutputStream`, and more.


    To read data from a file, we typically follow these steps:


    1\. Create a `File` object representing the file.


    2\. Create a `FileReader


    object, passing the `File` object as a parameter.


    3\. Wrap the `FileReader` object in a `BufferedReader` object for efficient reading.


    4\. Use the `readLine()` method of the `BufferedReader` to read the contents of
    the file line by line.


    Example:


    ```java


    import java.io.BufferedReader;


    import java.io.File;


    import java.io.FileReader;


    import java.io.IOException;


    public class FileReadingExample {


    public static void main(String[] args) {


    File file = new File("example.txt"); // Replace "example.txt" with the actual
    file path


    try (FileReader fileReader = new FileReader(file);


