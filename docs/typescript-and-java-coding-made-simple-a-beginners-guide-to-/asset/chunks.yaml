    \ types. This enables a variable to hold values of different types at different\
    \ times. Union types are useful when we want to work with values that can have\
    \ different data types.\n\n```typescript\nlet pet: string | number;\npet = \"\
    dog\"; // Valid\npet = 42; // Valid\npet = true; // Invalid\n```\n\n### Intersection\
    \ Types\n\nIntersection types in TypeScript enable us to combine multiple types\
    \ into a single type. It is denoted using the ampersand (`&`) symbol between the\
    \ types. This allows an object or variable to have all the properties and methods\
    \ of the intersected types.\n\n```typescript\ninterface Order {\n  id: number;\n\
    \  amount: number;\n}\n\ninterface Customer {\n  name: string;\n  age: number;\n\
    }\n\ntype OrderWithCustomer = Order & Customer;\n\nlet order: OrderWithCustomer\
    \ = {\n  id: 1,\n  amount: 100,\n  name: \"John Doe\",\n  age: 30,\n};\n```\n\n\
    ### Type Aliases\n\nType aliases in TypeScript provide a way to create custom\
