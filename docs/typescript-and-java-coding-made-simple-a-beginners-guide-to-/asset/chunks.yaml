    \n# 9.9 线程死锁和避免死锁\n\n当两个或多个线程被无限期阻塞，等待彼此释放它们持有的资源时，就会发生死锁。死锁可能导致程序挂起或变得无响应。避免死锁需要仔细设计和同步线程，以防止循环依赖和资源冲突。\n\
