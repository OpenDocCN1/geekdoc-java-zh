    # Chapter 6: Advanced TypeScript Tools and Techniques


    Introduction:


    In this chapter, we will explore advanced tools and techniques that can enhance
    your TypeScript development experience. We will cover topics such as type inference,
    type guards, module resolution, decorators, and code generation.


    # Type Inference:


    TypeScript''s type inference system automatically infers the types of variables
    when they are declared and assigned a value. It analyzes the context and usage
    of variables to determine their types. Type inference eliminates the need for
    explicit type annotations in many cases, making code more concise and readable.


    ```typescript


    let name = "John"; // Type inference assigns type string


    let age = 25; // Type inference assigns type number


    let isStudent = true; // Type inference assigns type boolean


    ```


    # Type Guards:


    Type guards allow us to narrow down the type of a value within a conditional block.
    They provide a way to perform runtime checks on the type of a value. Type guards
    can be created using `typeof`, `instanceof`, or custom type predicates.


    ```typescript


    function processValue(value: string | number): void {


    if (typeof value === "string") {


    console.log(value.toUpperCase());


    } else if (typeof value === "number") {


    console.log(value.toFixed(2));


    }


    }


    ```


    # Module Resolution:


    Module resolution is the process by which TypeScript resolves and locates module
    dependencies. TypeScript supports multiple module resolution strategies, such
    as Node.js-style resolution and ES modules. It allows us to import and use code
    from external modules in a structured and organized manner.


    ```typescript


    import { greet } from "./greetings"; // Relative path import


    import { sum } from "math-lib"; // Package import


    greet("John"); // Invoking a function from a module


    const result = sum(5, 10); // Using a function from a package


    ```


    # Decorators:


    Decorators are a powerful feature in TypeScript that allow us to add metadata
    and modify the behavior of classes, methods, or properties at design time. They
    are denoted by the `@` symbol followed by a decorator function. Decorators provide
    a way to implement cross-cutting concerns, such as logging, authentication, and
    validation, in a modular and reusable manner.


    ```typescript


    function log(target: any, propertyKey: string, descriptor: PropertyDescriptor):
    void {


    const originalMethod = descriptor.value;


    descriptor.value = function (...args: any[]): any {


    console.log(`Calling method ${propertyKey} with arguments: ${args}`);


    const result = originalMethod.apply(this, args);


    console.log(`Method ${propertyKey} returned: ${result}`);


    return result;


    };


    }


    class Calculator {


    @log


    add(a: number, b: number): number {


    return a + b;


    }


    }


    const calculator = new Calculator();


    const sum = calculator.add(5, 10); // Logs: Calling method add with arguments:
    5, 10


    // Logs: Method add returned: 15


    ```


    # Code Generation:


    TypeScript supports code generation through tools like Babel and TypeScript Compiler
    (tsc). These tools allow us to transpile TypeScript code to JavaScript, enabling
    compatibility with different environments and browsers. Code generation plays
    a crucial role in the build and deployment processes of TypeScript projects.


    In this chapter, we explored advanced tools and techniques in TypeScript, including
    type inference, type guards, module resolution, decorators, and code generation.
    These tools and techniques contribute to writing more efficient, modular, and
    maintainable code in TypeScript projects.


    # Chapter 7: Object-Oriented Programming with TypeScript


    Introduction:


    Object-Oriented Programming (OOP) is a popular programming paradigm that allows
    developers to organize code into reusable and modular components called objects.
    TypeScript, with its support for classes, interfaces, and other OOP features,
    provides a strong foundation for building robust and scalable applications. In
    this chapter, we will explore the key concepts of OOP and how they are implemented
    in TypeScript.


    # Classes and Objects:


    At the core of OOP is the concept of classes and objects. A class is a blueprint
    or template that defines the structure and behavior of objects. Objects are instances
    of classes, representing specific entities or instances in a program. Classes
    encapsulate data (properties) and behavior (methods) related to a particular concept
    or entity.


    ```typescript


    class Circle {


    radius: number;


    constructor(radius: number) {


    this.radius = radius;


    }


    getArea(): number {


    return Math.PI * this.radius ** 2;


    }


    getCircumference(): number {


    return 2 * Math.PI * this.radius;


    }


    }


    const myCircle = new Circle(5);


    console.log(myCircle.getArea()); // Output: 78.53981633974483


    console.log(myCircle.getCircumference()); // Output: 31.41592653589793


    ```


    # Inheritance:


    Inheritance is a mechanism in OOP that allows classes to inherit properties and
    methods from other classes. TypeScript supports single inheritance, where a class
    can inherit from a single parent class. This promotes code reuse and facilitates
    the creation of hierarchical relationships between classes.


    ```typescript


    class Shape {


    color: string;


    constructor(color: string) {


    this.color = color;


    }


    getColor(): string {


    return this.color;


    }


    }


    class Rectangle extends Shape {


    width: number;


    height: number;


    constructor(color: string, width: number, height: number) {


    super(color);


    this.width = width;


    this.height = height;


    }


    getArea(): number {


    return this.width * this.height;


    }


    }


    const myRectangle = new Rectangle("blue", 4, 6);


    console.log(myRectangle.getColor()); // Output: "blue"


    console.log(myRectangle.getArea()); // Output: 24


    ```


    # Encapsulation:


    Encapsulation is the practice of bundling related properties and methods within
    a class and controlling their accessibility. In TypeScript, we can use access
    modifiers (`public`, `private`, and `protected`) to define the visibility of class
    members. This allows us to enforce encapsulation and restrict direct access to
    sensitive data or implementation details.


    ```typescript


    class BankAccount {


    private balance: number;


    constructor(initialBalance: number) {


    this.balance = initialBalance;


    }


    deposit(amount: number): void {


    this.balance += amount;


    }


    withdraw(amount: number): void {


    if (amount <= this.balance) {


    this.balance -= amount;


    }


    }


    getBalance(): number {


    return this.balance;


    }


    }


    const myAccount = new BankAccount(1000);


    myAccount.deposit(500);


    myAccount.withdraw(200);


    console.log(myAccount.getBalance()); // Output: 1300


    ```


    # Polymorphism:


    Polymorphism allows objects of different classes to be treated as instances of
    a common superclass. TypeScript supports polymorphism through method overriding
    and interfaces. Method overriding enables derived classes to provide their own
    implementation of inherited methods, while interfaces define a contract that classes
    must adhere to.


    ```typescript


    class Animal {


    makeSound(): void {


    console.log("Animal makes a sound");


    }


    }


    class Dog extends Animal {


    makeSound(): void {


    console.log("Dog barks");


    ```typescript


    }


    }


    class Cat extends Animal {


    makeSound(): void {


    console.log("Cat meows");


    }


    }


    function makeAnimalSound(animal: Animal): void {


    animal.makeSound();


    }


    const dog = new Dog();


    const cat = new Cat();


    makeAnimalSound(dog); // Output: "Dog barks"


    makeAnimalSound(cat); // Output: "Cat meows"


