  \n在这一节中，我们将对 user/micropost 关联添加一些改进。特别是，我们将安排用户的 microposts 按特定顺序检索，并且还将让 microposts\
  \ 依赖于用户，这样当用户被销毁时，它们也会自动被删除。\n\n##### 默认范围 (Default Scope)\n\n默认情况下，`user.microposts`\
  \ 方法对帖子的顺序不做保证，但（遵循博客和 Twitter 的惯例），我们希望 microposts 按创建时间的反序排列，这样最新的帖子就会排在第一个。part0022.xhtml_ch13en4)\
