  \ IDE（我确实建议也学习其他工具），它也能对文本编辑器和其他开发工具的通用功能提供极好的入门。\n\n7。例如，要找到名为 `foo` 的函数定义，你可以对“def\
  \ foo”进行全局搜索。\n\n\n**图 1.1:** 云端 IDE 的结构。\n\n以下是开始使用云开发环境的步骤：\n\n1. 在 Cloud9 注册一个免费账户。⁸\
