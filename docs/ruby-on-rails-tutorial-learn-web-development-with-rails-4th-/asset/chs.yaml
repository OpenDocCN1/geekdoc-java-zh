  \n购买任何 Rails Tutorial 可以在 railstutorial.org/solutions 免费获取练习答案。要查看他人的答案并记录自己的答案，请加入\
  \ learnenough.com/society 的 Learn Enough Society。\n\n1. 通过注释掉列表 14.5 中的验证，验证测试是否仍然通过。（这是从\
  \ Rails 5 开始的变更，在之前的 Rails 版本中验证是必须的。我们为了完整性保留了它们，但要注意在人的代码中可能会省略这些验证。）\n\n####\
  \ 14.1.4 被关注用户\n\n我们现在来到关联的核心：`following` 和 `followers`。在这里我们将第一次使用 `has_many :through`：一个用户*通过*关系拥有许多关注，如图\
  \ 14.7 所示。默认情况下，在 `has_many :through` 关联中，Rails 寻找与关联单数形式对应的外键。换句话说，如果有如下代码：\n\n\
  ```ruby\nhas_many :followeds, through: :active_relationships\n```\n\nRails 会看到 “followeds”\
  \ 并使用单数的 “followed”，使用 `relationships` 表中的 `followed_id` 构建集合。正如 14.1.1 节所述，`user.followeds`\
  \ 相当奇怪，因此我们将编写 `user.following`。当然 Rails 允许我们覆盖默认值，在这里使用 `source` 参数（如列表 14.8 所示），它显式地告诉\
  \ Rails `following` 数组的源是 `followed` id 集合。\n\n**列表 14.8：** 添加 User 模型 `following`\
  \ 关联。\n\n`app/models/user.rb`\n\n```ruby\nclass User < ApplicationRecord\n  has_many\
  \ :microposts, dependent: :destroy\n  has_many :active_relationships, class_name:\
  \ \"Relationship\",\n                           foreign_key: \"follower_id\",\n\
  \                           dependent: :destroy\n  has_many :following, through:\
  \ :active_relationships, source: :followed\nend\n```\n\n\n\n\n点击此处查看代码图片\n\n***\n\
  \n```ruby\nclass User < ApplicationRecord\n  has_many :microposts, dependent: :destroy\n\
  \  has_many :active_relationships, class_name: \"Relationship\", foreign_key: \"\
  follower_id\", dependent: :destroy\n  has_many :following, through: :active_relationships,\
  \ source: :followed\nend\n```\n\n***\n\n在列表 14.8 中定义的关联导致了 Active Record 与类数组行为的强大结合。例如，我们可以使用\
  \ `include?` 方法检查关注用户集合是否包含另一个用户（第 4.3.1 节），或者通过关联查找对象：\n\n***\n\n点击此处查看代码图片\n\n\
  ```ruby\nuser.following.include?(other_user)\nuser.following.find(other_user)\n\
  ```\n\n***\n\n尽管在许多情境下我们可以有效地将 `following` 视为数组，但 Rails 在底层处理这些方面非常智能。例如，如下代码：\n\
  \n点击此处查看代码图片\n\n```ruby\nfollowing.include?(other_user)\n```\n\n看起来似乎需要从数据库中提取所有已关注的用户来应用\
  \ `include?` 方法，但实际上为了效率，Rails 安排直接在数据库中进行比较。（对比第 13.2.1 节中的代码，在其中我们看到\n\n```ruby\n\
  user.microposts.count\n```\n\n是直接在数据库中执行计数的。）\n\n为了操作关注关系，我们将引入 `follow` 和 `unfollow`\
  \ 工具方法，这样我们就可以编写例如 `user.follow(other_user)` 的代码。我们还将添加一个关联的 `following?` 布尔方法，用于测试一个用户是否正在关注另一个用户。⁶\n\
  \n6. 一旦你对某个特定领域的建模有了丰富的经验，你通常可以预先猜到此类工具方法，即使无法猜到时，你通常也会发现自己在编写它们以使测试更整洁。尽管在这种情况下，即使你没有猜到它们也没关系。软件开发通常是一个迭代过程——你编写代码直到它开始变得糟糕，然后对其进行重构——但为了简洁起见，教程的演示经过了精简。\n\
  \n这正是我喜欢先写一些测试的情况。原因是我们距离编写一个用于关注用户的 Web 界面还很远，但如果没有为开发的代码提供某种*客户端*，很难继续进行。在这种情况下，为\
  \ User 模型编写一个短测试很容易，在测试中我们使用 `following?` 来确保用户没有关注另一个用户，使用 `follow` 关注另一个用户，使用\
  \ `following?` 验证操作成功，最后使用 `unfollow` 并验证其有效。结果显示在列表 14.9 中。\n\n**列表 14.9：** 某些“关注”工具方法的测试。**红色**\n\
  \n`test/models/user_test.rb`\n\n点击此处查看代码图片\n\n***\n\n```ruby\nrequire 'test_helper'\n\
  class UserTest < ActiveSupport::TestCase\n  test \"should follow and unfollow a\
  \ user\" do\n    michael = users(:michael)\n    archer = users(:archer)\n    assert_not\
  \ michael.following?(archer)\n    michael.follow(archer)\n    assert michael.following?(archer)\n\
  \    michael.unfollow(archer)\n    assert_not michael.following?(archer)\n  end\n\
  end\n```\n\n***\n\n通过参考表 14.1 中的方法，我们可以使用与 `following` 的关联编写 `follow`、`unfollow`\
  \ 和 `following?` 方法，如列表 14.10 所示。（注意，我们尽可能都省略了 `self` 变量。）\n\n**列表 14.10：** 用于关注的工具方法。**绿色**\n\
  \n`app/models/user.rb`\n\n点击此处查看代码图片\n\n***\n\n```ruby\nclass User < ApplicationRecord\n\
  \  def feed\n  end\n\n  # 关注一个用户。\n  def follow(other_user)\n    active_relationships.create(followed_id:\
  \ other_user.id)\n  end\n\n  # 取消关注一个用户。\n  def unfollow(other_user)\n    active_relationships.find_by(followed_id:\
  \ other_user.id).destroy\n  end\n\n  # 如果当前用户关注另一个，则返回 true。\n  def following?(other_user)\n\
  \    following.include?(other_user)\n  end\n\n  private\nend\n```\n\n有了列表 14.10\
  \ 中的代码，测试结果应该是**绿色**的：\n\n列表 14.1：`绿色`\n\n***\n\n```bash\n$ rails test\n```\n\n\
