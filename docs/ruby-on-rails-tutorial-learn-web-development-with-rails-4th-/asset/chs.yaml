  ![image](img/image02305.jpeg)\n\n**图 12.11：** 重置密码表单。\n\n#### 12.3.2 更新重置\n\n与账户激活的\
  \ `edit` 方法（简单将用户从“未激活”切换为“激活”）不同，重置密码的 `edit` 方法是一个表单，因此提交到一个 `update` 操作。为了定义这个\
  \ `update` 操作，我们需要考虑四情况：\n\n1. 重置过期\n2. 因密码无效导致更新失败\n3. 因密码为空导致更新失败\n4. 更新成功\n\n\
  情况 (1)、(2) 和 (4) 是直观的，但情况 (3) 并不直观，并在会有详细解释。情况 (1) 适用于 `edit` 和 `update` 操作，逻辑上属于一个\
  \ `before filter`：\n\n```ruby\nbefore_action :check_expiration, only: [:edit, :update]\n\
  ```\n\n`valid_user` 过滤器要求用户已激活：\n\n```ruby\ndef valid_user\n  unless ( @user &&\
  \ @user.activated? &&\n          @user.authenticated?( :reset, params[ :id]))\n\
  \    redirect_to root_url\n  end\nend\n```\n\n在 `check_expiration` 方法中，我们将过期检查给了实例方法\
  \ `password_expired?`：\n\n```ruby\ndef check_expiration\n  if @user.password_expired?\n\
  \    flash[:danger] = \"Password reset expired.\"\n    redirect_to new_reset_url\n\
  \  end\nend\n```\n\n未被情况 (2) 处理的唯一失败是密码为空，这目前被 User 模型（列表 10.13）允许，因此需要捕获并处理。这就是情况\
  \ (3)。在这种情况下的方法是使用 `errors.add` 直接向 `@user` 对象添加错误。我们只处理密码为空的情况，因为如果确认为空，确认验证（密码为空时跳过）将捕获问题并提供相关消息。\n\
  \n点击此处查看代码图片\n\n```ruby\n@user.errors.add(:password, \"can't be empty\")\n```\n\n\
  将情况 (1)-(4) 组合在一起的结果就是列表 12.16 所示的 `update` 操作。\n\n**列表 12.16：** 重置密码的 `update`\
  \ 操作。\n\napp/controllers/password_resets_controller.rb\n\n点击此处查看代码图片\n\n***\n\n\
  ```ruby\nclass PasswordResetsController < ApplicationController\n  before_action\
  \ :get_user, only: [:edit, :update]\n  before_action :valid_user, only: [:edit,\
  \ :update]\n  before_action :check_expiration, only: [:edit, :update] # Case (1)\n\
  \n  def new\n  end\n\n  def create\n    @user = User.find_by(email: params[:password_reset][:email].downcase)\n\
  \    if @user\n      @user.create_reset_digest\n      @user.send_password_reset_email\n\
  ```\n\n\n\n\n```ruby\nflash[:info] = \"Email sent with password reset instructions\"\
  \nredirect_to root_url\nelse\n  flash.now[:danger] = \"Email address not found\"\
  \n  render 'new'\nend\nend\n\ndef edit\nend\n\ndef update\n  if params[:user][:password].empty?\
  \    # Case (3)\n    @user.errors.add(:password, \"can't be empty\")\n    render\
  \ 'edit'\n  elsif @user.update_attributes(user_params) # Case (4)\n    log_in @user\n\
  \    flash[:success] = \"Password has been reset.\"\n    redirect_to @user\n  else\n\
  \    render 'edit'                      # Case (2)\n  end\nend\n\nprivate\n\ndef\
  \ user_params\n  params.require(:user).permit(:password, :password_confirmation)\n\
  end\n\n# Before filters\ndef get_user\n  @user = User.find_by(email: params[:email])\n\
  end\n\n# Confirms a valid user.\ndef valid_user\n  unless (@user && @user.activated?\
  \ &&\n         @user.authenticated?(:reset, params[:id]))\n    redirect_to root_url\n\
  \  end\nend\n\n# Checks expiration of reset token.\ndef check_expiration\n  if @user.password_reset_expired?\n\
  \    flash[:danger] = \"Password reset has expired.\"\n    redirect_to new_password_reset_url\n\
  \  end\nend\n```\n\n\n\n\n# 空置密码\n\n```patch password_reset_path(user.reset_token),\n\
  params: { email: user.email,\nuser: { password: \"\",\npassword_confirmation: \"\
  \" } }\nassert_select 'div#error_explanation'\n```\n\n# 有效密码与确认密码\n\n```patch password_reset_path(user.reset_token),\n\
  params: { email: user.email,\nuser: { password: \"foobaz\",\npassword_confirmation:\
  \ \"foobaz\" } }\nassert is_logged_in?\nassert_not flash.empty?\nassert_redirected_to\
  \ user\n```\n\n```ruby\nend\nend\n```\n\n***\n\nListing 12.18 中的大部分思路在之前的教程中已经出现过；唯一真正新颖的元素是对\
