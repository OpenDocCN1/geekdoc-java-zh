  \n#### 13.3.1 微推文访问控制\n\n我们从在 Microposts 控制器中进行访问控制开始开发微推文资源。特别是，由于我们通过用户访问微推文，因此\
  \ `create` 和 `destroy` 操作都必须要求用户登录。\n\n强制登录状态的测试与 Users 控制器的测试相似（列表 10.20 和列表 10.61）。我们只需向每个操作发送正确的请求，并确认微推文计数未变且结果被重定向到登录\
  \ URL，如列表 13.31 所示。\n\n**列表 13.31：** Microposts 控制器的授权测试。**RED**\n\n`test/controllers/microposts_controller_test.rb`\n\
