  我们在这一章中取得了巨大的进展：安装、开发环境搭建、版本控制和部署。在下一章中，我们将基于第 1 章的基础构建一个数据库支持的应用程序，这将让我们初次体验 Rails\
  \ 的魅力。\n\n如果你想在此阶段分享你的进度，可以随时发送这样的推文或 Facebook 状态：\n\n我正在通过 @railstutorial 学习 Ruby！\n\
