  \ 11.4 节，可以直接跳转到 Listing 12.24。\n\n要在生产环境中发送邮件，我们将使用 SendGrid，它可以作为 Heroku 插件提供给已验证账户。（这需要向你的\
  \ Heroku 账户添加信用卡信息，但验证账户时不会收费。）对于我们的用途，“入门级”方案（截至目前限制为每天 400 封邮件但免费）是最佳选择。我们可以按照以下方式将其添加到应用程序中：\n\
  \n点击此处查看代码图片\n\n\n\n\n\n`$ heroku addons:create sendgrid:starter`\n\n（这在旧版本的 Heroku\
  \ 命令行界面系统上可能会失败。在这种情况下，请升级到最新的 Heroku toolbelt，或者尝试旧的语法 `heroku addons:add sendgrid:starter`。）\n\
  \n为了配置我们的应用程序以使用 SendGrid，我们需要为生产环境填写 SMTP 设置。如列表 12.23 所示，你还需要定义一个带有生产环境网站地址的 `host`\
  \ 变量。\n\n**列表 12.23:** 配置 Rails 在生产环境中使用 SendGrid。\n\n`config/environments/production.rb`\n\
  \n点击此处查看代码图片\n\n* * *\n\n```ruby\nRails.application.configure do\n  .\n  .\n  .\n\
  \  config.action_mailer.raise_delivery_errors = true\n  config.action_mailer.delivery_method\
  \ = :smtp\n  host = '<your heroku app>.herokuapp.com'\n  config.action_mailer.default_url_options\
  \ = { host: host }\n  ActionMailer::Base.smtp_settings = {\n    address => 'smtp.sendgrid.net',\n\
  \    port => '587',\n    authentication => :plain,\n    user_name => ENV['SENDGRID_USERNAME'],\n\
  \    password => ENV['SENDGRID_PASSWORD'],\n    domain => 'heroku.com',\n    enable_starttls_auto\
