  ## 第 1 章. 从零到部署\n\n欢迎阅读 `Ruby on Rails`^™ `Tutorial: Learn Web Development with\
  \ Rails`。本书的目的是教你如何开发自定义 Web 应用程序，我们选择的工具是流行的 Ruby on Rails Web 框架。除了专注于 Web 开发的通用原则（而非专门针对\
  \ Rails），`Ruby on Rails`^™ `Tutorial` 还教授了更广泛的技术熟练度（`Box 1.1`）技能，这是 Learn Enough\
  \ to Be Dangerous 系列教程开发的主题。¹ 特别是，Learn Enough 入系列由一系列教程组成，适合作为 `Ruby on Rails`^™\
  \ `Tutorial` 的先决条件，从 `Learn Enough Command Line to Be Dangerous` 开始，²，该教程（与本教程不同）面向完全的初学者。\n\
  \n1. learnenough.com/story\n\n2. learnenough.com/command-line\n\n***\n\n### Box\
  \ 1.1: 技术熟练度\n\n`Ruby on Rails`^™ `Tutorial` 是 Learn Enough to Be Dangerous 教程系列的一部分，该系列开发了技术熟练度这一主题：软硬技能的结合，让你看起来像变魔法一样可以解决任何技术问题。Web\
  \ 开发以及通用的计算机编程都是技术熟练度的核心组成部分，但不仅于此——你还必须知道如何点击菜单项来学习特定应用程序的功能，如何通过 Google 搜索来澄清困惑的错误信息，或者在何时放弃并直接重启那个该死的程序。\n\
  \n由于 Web 应用程序有许多活动部分，它们为提高你的技术熟练度提供了充足的机会。在 Rails Web 开发的背景下，技术熟练度的某些特定示例包括确保你正在使用正确的\
  \ Ruby gem 版本、运行 `bundle install` 或 `bundle update`，以及在某些不起作用时重启本地 Web 服务器。（如果这些听起来像胡言乱语，请担心；我们将在完成本教程的过程中涵盖这里提到的所有内容。）\n\
  \n随着教程的进行，你很可能偶尔会被某些没有按预期工作的事情所困扰。尽管文中对某些特别棘手的步骤进行了明确强调，但无法预料所有可能出现的问题。我建议你将这些不可避免的障碍视为提高你技术熟练度的机会。或者，正如我们极客语言中所说的：*这不是\
  \ Bug，是特性！*\n\n***\n\n`Ruby on Rails`^™ `Tutorial` 旨在向你全面介绍 Web 应用程序开发，包括对 Ruby、Rails、HTML\
  \ & CSS、数据库、版本控制、测试和部署的基础知识——这些知识足以让你开启 Web 开发人员或技术创业者的职业生涯。如果你已经了解 Web 开发，这本书将快速教你掌握\
  \ Rails 框架的精要要素，包括 MVC 和 REST、生成器（generators）、迁移（migrations）、路由（routing）和嵌入式 Ruby（embedded\
  \ Ruby）。无论如何，当你完成 `Ruby on Rails`^™ `Tutorial` 时，你将从繁荣的编程教育生态系统中更多高级书籍、博客和屏幕录制中获益。³\
  \ 其中一种资源是 `Ruby on Rails Tutorial LiveLessons` 屏幕录制，可以在 informit.com/rubyrailsvid\
  \ 获取。\n\n3. `Ruby on Rails`^™ `Tutorial` 的最新版本可以在书籍网站 [`www.railstutorial.org/`](http://www.railstutorial.org/)\
  \ 上找到。如果你是在离线阅读此书，请确保在 [`www.railstutorial.org/book`](http://www.railstutorial.org/book)\
  \ 查看在线版 Rails Tutorial 书籍的最新更新。\n\n`Ruby on Rails`^™ `Tutorial` 采用整合的方法进行 Web 开发，通过构建三个复杂度不断增加的示例应用程序，从一个极简的\
  \ *hello* 应用（`Section 1.3`）、一个功能稍强的*toy*（玩具）应用（`Chapter 2`）以及一个真实的*sample*（示例）应用（`Chapter\
  \ 3` 到 `Chapter 14`）。正如暗示的，`Ruby on Rails`^™ `Tutorial` 中开发的应用程序并不适用于任何类型的网站。\n\n\
  `Ruby on Rails`^™ `Tutorial` 采用整合的方法进行 Web 开发。在第一章中，我们将通过安装所有必要的软件和设置开发环境来开始 Ruby\
  \ on Rails（`Section 1.2`）。随后我们将创建一个名为 `hello_app` 的第一个 Rails 应用。Rails Tutorial 强调良好的软件开发实践，因此在创建新的\
  \ Rails 项目后，我们将使用 `Git` 对其进行版本控制（`Section 1.4`）。而且不可置信的是，在本章中我们还将通过*部署*到环境环境发布第一个应用（`Section\
  \ 1.5`）。\n\n在 `Chapter 2` 中，我们将制作第二个项目，其目的是演示 Rails 应用的基本原理。为了快速上手，我们将使用脚手架（scaffolding，`Box\
  \ 1.2`）来生成代码并构建这个*toy app*（命名为 `toy_app`）；因为这些代码既丑陋又复杂，`Chapter 2` 将侧重于通过网络浏览器使用\
  \ `URIs`（通常称为 `URLs`）⁴. *URI* 代表统一资源标识符，而稍微那么通用的 *URL* 代表统一资源定位符。在实践中，URL 通常等同于“你在地址栏中看到的内容”。\n\
  \n\n\n\n教程的剩余部分将侧重于开发一个单一的大型应用程序（称为 `sample_app`），从零开始编写所有代码。我们将结合原型设计（mockups）、测试驱动开发（TDD）和集成测试来开发这个示例应用。我们将在第\
  \ 3 章中开始，首先创建静态页面，然后添加一些动态内容。我们还将在第 4 章中稍作跳转，学习一下作为 Rails 底层的 Ruby 语言。接着，在第 5 章中，我们将通过创建网站布局、用户数据模型以及完整的注册身份验证系统（包括账户激活和密码重置）来完成示例应用的基础。最后，在第\
  \ 13 章和第 14 章中，我们将添加微博客和社交功能，创建一个可以运行的示例网站。\n\n***\n\n## 框 1.2：脚手架：更快、更简单、更具诱惑\n\
  \n从一开始，Rails 就一直受益于一种明显的兴奋感，这源于 Rails 创造者 David Heinemeier Hansson 著名的 15 分钟博客视频。那个视频及其后续视频是体验\
  \ Rails 强大极佳方式，我建议观看它们。但请注意：它们通过一种名为“脚手架”（scaffolding）的功能完成了这惊人的十五分钟成就，这项功能高度依赖于通过\
  \ `rails generate scaffold` 命令魔法生成的代码。\n\n在编写 Ruby on Rails 教程时，依赖脚手架方法是非常有吸引力的——它更快、更简单、更具诱惑。但脚手架的复杂性和大量的代码对于初学者\
  \ Rails 开发者来说可能完全令他们不知措；你可能可以使用它，但可能无法理解它。遵循脚手架方法可能会让你变成一个精通脚本生成的生成器，但对 Rails 本身几乎没有（且脆弱的）实际知识。\n\
  \n在《*Ruby on Rails*^™ 教程》中，我们将采取（几乎）完全相反的方法：尽管第 2 章将使用脚手架开发一个小型玩具应用，但《Rails 教程》的核心是示例应用，我们将在第\
  \ 3 章中开始编写它。在开发示例应用的每个阶段，我们将编写小巧、易于消化的代码——简单到可以理解，又新颖到具有挑战性。这种累积效应将让你对 Rails 有更深层、更灵活的认知，为你编写几乎任何类型的\
  \ Web 应用程序提供良好的背景。\n\n***\n\n### 1.1 引言\n\nRuby on Rails（简称为“Rails”）是一种用 Ruby 编程语言编写的\
  \ Web 开发框架。自 2004 年发布以来，Ruby on Rails 迅速成为构建动态 Web 应用的最强大、最流行的工具之一。Airbnb、Basecamp、Disney、GitHub、Hulu、Kickstarter、Shopify、Twitter\
  \ 和 Yellow Pages 等各类公司都在使用 Rails。还有许多专门从事 Rails 的 Web 开发公司，如 ENTP、thoughtbot、Pivotal\
  \ Labs、Hashrocket 和 HappyFunCorp，以及无数的独立顾问、培训师和承包商。\n\n是什么让 Rails 如此伟大？首先，Ruby on\
  \ Rails 是 100% 开源的，在宽松的 MIT 许可证下提供，因此下载或使用无需任何费用。Rails 的成功很大程度上归功于它优雅紧凑的设计；通过利用底层\
  \ Ruby 语言的可变性，Rails 有效地为编写 Web 应用程序创建了一种领域语言。因此，许多常见的 Web 编程任务——如生成 HTML、创建数据模型和\
  \ URL 路由——使用 Rails 变得变得轻而易举，生成的应用程序代码也简洁易读。\n\nRails 还能快速适应 Web 技术和框架设计的新进展。例如，Rails\
  \ 是首批充分吸收并实现构建 Web 应用的 REST 架构风格的框架之一（我们将在整个教程中学习它）。当其他框架开发出成功的新技术时，Rails 创造者 David\
  \ Heinemeier Hansson 和 Rails 核心团队会毫不犹豫地吸收他们的想法。也许戏剧性的例子是 Rails 与竞争对手 Ruby Web 框架\
  \ Merb 的合并，使得 Rails 现在受益于 Merb 的模块化设计、稳定的 API 和改进的性能。\n\n最后，Rails 受益于一个异常热烈且支持性的社区。其成果包括数以千计的开源贡献者、有趣且信息丰富的会议、大量的\
  \ gems（解决分页和图像上传等特定问题的自包含解决方案）、丰富且信息丰富的博客，以及海量的讨论论坛和 IRC 频道。大量的 Rails 程序员也使得处理不可避免的应用程序错误变得更容易：“谷歌搜索错误信息”算法几乎总能产生相关的博客文章或讨论论坛帖子。\n\
  \n#### 1.1.1 前提条件\n\n本书没有正式的先决条件，而且《*Ruby on Rails*^™ 教程》包含了集成教程，不仅针对 Rails，还针对底层的\
  \ Ruby 语言、默认的 Rails 测试框架（`minitest`）、Unix 命令行、HTML、CSS、少量的 JavaScript 甚至少量的 SQL。不过，要吸收的材料非常多，我通常建议在开始本教程之前具有一些\
  \ HTML 和编程背景。如果你是软件开发的新手，我建议从 *Learn Enough to Be Dangerous* 上的教程开始：⁵\n\n5。截至本文写作，命令行、文本编辑器、Git\
  \ 和 HTML 教程已经完成，其他教程正在开发中。\n\n**1. 开发者基础**\n\n**(a)** *Learn Enough Command Line\
  \ to Be Dangerous*\n\n**(b)** *Learn Enough Text Editor to Be Dangerous*\n\n**(c)**\
  \ *Learn Enough Git to Be Dangerous*\n\n**2. Web 基础**\n\n**(a)** *Learn Enough HTML\
  \ to Be Dangerous*\n\n**(b)** *Learn Enough CSS & Layout to Be Dangerous*\n\n**(c)**\
  \ *Learn Enough JavaScript to Be Dangerous*\n\n**3. 入门 Ruby 开发**\n\n**(a)** *Learn\
  \ Enough Ruby to Be Dangerous*\n\n**(b)** *Learn Enough Sinatra to Be Dangerous*\n\
  \n**(c)** *Learn Enough Ruby on Rails to Be Dangerous*\n\n**4. 专业 Ruby Web 开发**\n\
  \n**(a)** *Ruby on Rails*^™ 教程\n\n学习 Rails 的一个常见问题是是否先学习 Ruby。答案取决于你的个人学习风格和已有的编程经验。如果你喜欢系统地从零开始学习，或者你以前从未编程，那么先学习\
  \ Ruby 可能适合你，在这种情况下我建议遵循上述完整的 Learn Enough 序列。另一方面，许多初 Rails 开发者对制作 Web 应用感到兴奋，不想在编写第一个\
  \ Web 页面之前等完一本 Ruby 书。在这种情况下，我建议尝试本教程，如果证明太难，再切换到 Learn Enough 序列。\n\n在教程结束时，无论你从哪里开始，都应该准备好面对那里更多中级到高级的\
  \ Rails 资源。以下是我特别推荐的：\n\n• Learn Enough Society：高级订阅服务，包括一本特别增强版的《*Ruby on Rails*^™\
  \ 教程》书籍，以及 15 多小时的流媒体录屏课程，里面充满了通过阅读书籍获得的技巧、窍门和现场演示。还包括其他 Learn Enough 教程的文本和视频。提供奖学金。\n\
  \n• Code School：良好的互动在线编程课程\n\n• The Turing School of Software & Design：位于科拉多州丹佛市的全日制\
  \ 27 周培训计划。\n\n\n\n\n-   **Bloc**: 一个拥有结构化课程、个性化导师指导并侧重于通过具体项目进行学习的在线训练训练营。使用优惠码\
  \ `BLOCLOVESHARTL` 可减免 500 美元的报名费。\n-   **Launch School**: 一个非常棒的在线 Rails 开发训练营（包含高级课程材料）。\n\
  -   **Firehose Project**: 一个由导师驱动的在线编程训练营，侧重于实战编程技能，如测试驱动开发、算法以及作为敏捷团队的一部分构建高级 Web\
  \ 应用。提供为期两周的免费入门课程。\n-   **Thinkful**: 一种在线课程，在 fact 完成基于项目的课程时，会为你配备一位专业工程师进行指导。\n\
  -   **Pragmatic Studio**: 由 Mike 和 Nicole Clark 提供的在线 Ruby 和 Rails 课程。Mike 曾与 *Programming\
  \ Ruby* 的作者 Dave Thomas 一起在 2006 年教过我上的第一门 Rails 课程。\n-   **RailsApps**: 包含各种详细且针对特定主题的\
  \ Rails 项目和教程。\n-   **Rails Guides**: 专题化且最新的 Rails 参考文档。\n\n\n`Ruby on Rails`^™\
  \ `Tutorial` 包含大量的练习。强烈建议你在按照教程进行的同时完成这些练习。购买书籍的用户可以在 `http://railstutorial.org/solutions`\
  \ 查看练习解答。\n\n为了保持主讨论内容与练习相互独立，解答通常不会包含在随后的代码示例中。（在极少数情况下，如果后续使用了某个练习解答，会在正文中明确给出解答。）这意味着随着推移，你的代码可能会因为练习引入的差异而与教程中代码有所不同。学习如何解决此类差异是提升技术水平的一种宝贵练习（Box\
  \ 1.1）。\n\n为了记录你的答案并查看解答，你可以加入 Learn Enough Society，这是 Learn Enough to Be Dangerous\
  \ 的一项订阅服务，包含 `Ruby on Rails`^™ `Tutorial` 的特殊增强版。\n\n许多练习都具有挑战性，但我们先从一些简单的题目开始热身：\n\
  \n**1.** 哪个网站托管了 Ruby on Rails 的 `Ruby gem`？*提示*：如果不确定，尽管 Google 一下。\n\n**2.** Rails\
  \ 的当前版本号是多少？\n\n**3.** 截至目前，Ruby on Rails 总共被下载了多少次？\n\n## 1.1.2 本书使用的规范\n\n书中使用的规范大部分是显而易懂的。在本节中，我们将介绍一些可能不那么直观的规范。\n\
  \n书中的许多示例使用了命令行命令。为了简单起见，所有命令行示例都使用 Unix 风格的命令行提示符（美元符号 `$`），如下：\n\n点击此处查看代码图片\n\
  \n```\n$ echo \"hello, world\"\n\nhello, world\n```\n\nRails 提供了许多可以在命令行运行的命令。例如，在\
  \ Section 1.3.2 中，我们将使用 `rails server` 命令运行本地开发 Web 服务器：\n\n```\n$ rails server\n\
  ```\n\n与命令行提示符一样，`Rails Tutorial` 使用 Unix 目录分隔符规范（即正斜杠 `/`）。例如，示例应用程序 `production.rb`\
  \ 配置文件所示：\n\n点击此处查看代码图片\n\n```\nconfig/environments/production.rb\n```\n\n该文件应相对于应用程序的根目录，在\
  \ Section 1.2.2 中，看起来如下：\n\n点击此处查看代码图片\n\n```\n/home/ubuntu/sample/config/environments/production.rb\n\
  ```\n\n\n\n\n\n云端 IDE 还包含了开发 Web 应用所需的三个核心组件：文本编辑器、文件系统导航器和命令行终端（图 1.1）。在其他功能中，云端\
