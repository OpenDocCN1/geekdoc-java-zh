  \ 例如，假设用户在 Firefox 中注销，从而通过 列表 9.11 中的 `user.forget` 将记忆密摘要（remember digest）设置为\
  \ `nil`。该应用程序在 Firefox 中仍然可以工作；因为 列表 9.12 中的 `log_out` 方法删除了用户的 id，因此两个高亮的条件判断均为\
  \ `false`：\n\n[13.] 感谢读者 Niels de Ron 指出这一点。\n\n点击此此处查看代码图片\n\n***\n\n# 返回对应于 remember\
