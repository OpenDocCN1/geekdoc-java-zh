  \ @user %>\n```\n\n\n\n\n\n<h1><%= @user.name %></h1>\n\n<span><%= link_to \"查看我的个人资料\"\
  , @user %></span>\n\n<span><b>微贴数：</b> <%= @user.microposts.count %}></span>\n\n\
  </section>\n<section class=\"stats\">\n  <%= render 'shared/stats' %>\n  <% if @users.any?\
  \ %>\n    <div class=\"user_avatars\">\n      <% @users.each do |user| %>\n    \
  \    <%= link_to gravatar_for(user, size: 30), user %>\n      <% end %>\n    </div>\n\
  \  <% end %>\n</section>\n</aside>\n<div class=\"col-md-8\">\n  <h3><%= @title %></h3>\n\
