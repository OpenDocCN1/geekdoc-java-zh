  **图 2.10：** 删除用户。\n\n## 2.2.2 MVC 实\n\n现在我们已经对 Users 资源完成了快速概述，让我们在第 1.3.3 节中引入的模型-视图-控制器（MVC）模式的背景下检查其某个特定部分。我们的策略是从\
  \ MVC 的角度来描述典型的浏览器访问——访问 /users 的用户索引页的结果（图 2.11）。\n\n以下是图 2.11 所示步骤的摘要：\n\n1. 浏览器对\
  \ /users URL 发出请求。\n\n\n\n\n2. Rails 将 `/users` 路由到 `Users` 控制器中的 `index` 动作。\n\n\
