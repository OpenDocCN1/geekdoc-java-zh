  2. 对于没有密码的用户，其错误信息是什么？\n\n### 6.3.3 最小密码标准\n\n通常情况下，对密码强制执行某些最小标准是一个良好的做法，这可以使密码更难被破解。在\
  \ Rails 中有许多方法可以强制密码强度，但为了简单起见，我们只强制最小长度以及密码不能为空的要求。选择长度 6 作为作为一个合理的最小值，可以得出如 列表\
  \ 6.41 所示的验证测试。\n\n**列表 6.41：** 测试最小密码长度。**红色**\n\n`test/models/user_test.rb`\n\n\
  点击此处查看代码图片\n\n```ruby\nrequire 'test_helper'\n\nclass UserTest < ActiveSupport::TestCase\n\
  \  def setup\n    @user = User.new(name: \"Example User\", email: \"user@example.com\"\
  ,\n                     password: \"foobar\", password_confirmation: \"foobar\"\
  )\n  end\n\n  test \"password should be present (nonblank)\" do\n    @user.password\
  \ = @user.password_confirmation = \" \" * 6\n    assert_not @user.valid?\n  end\n\
  \n  test \"password should have a minimum length\" do\n    @user.password = @user.password_confirmation\
  \ = \"a\" * 5\n    assert_not @user.valid?\n  end\nend\n```\n\n注意这里使用了了紧凑的多变量赋值：\n\
  \n点击此处查看代码图片\n\n`@user.password = @user.password_confirmation = \"a\" * 5`\n\n位于列表\
  \ 6.41.中。这种安排同时为密码及其确认密码分配一个特定的值（在本例中，是一个长度为 5 的字符串，如列表 6.14 所示，使用字符串乘法构造而成）。\n\n\
  通过参考对用户名称对应的 `maximum` 验证（列表 6.16），你可能能够猜出强制 `minimum` 长度约束的代码：\n\n点击此处查看代码图片\n\n\
  `validates :password, length: { minimum: 6 }`\n\n将此与 `presence` 验证（参见第 6.2.2 节以确保密码不为空）相结合，得到了如列表\
