  \n\n\n\n当然，在浏览器中查看一下页面并不是个坏主意，这可以确保我们的测试没有完全出错（图 3.5）。\n\n#### 3.3.4 重构\n\n现在我们已经进入了\
  \ `GREEN`（绿色）状态，可以放心地重构我们的代码了。在开发应用程序时，代码往往会开始产生“异味”，意味着它变得丑陋、臃肿或充斥重复。当然，计算机不在乎代码看起来什么样，但人类会在乎，因此频繁重构以保持代码库的整洁至关重要。虽然我们的示例应用目前太小，还不需要重构，但代码异味会渗透到每一个缝隙，我们将在第\
  \ 3.4.3 节中开始重构。\n\n![image](img/image01059.jpeg)\n\n**图 3.5：** 新的关于页面（`/static_pages/about`）。\n\
  \n## 3.4 稍微动态页面\n\n现在我们已经为一些静态页面创建了动作（actions）和视图（views），我们将通过添加一些随页面变化的内容来让它们变得*稍微*动态化：我们将让每个页面的标题变化以反映其内容。一个变化的标题是否代表了*真正*的动态内容尚存争议，但无论如何，它都为第\
  \ 7 章中无歧的动态内容奠定了必要的基础。\n\n我们的计划是编辑 Home、Help 和 About 页面，使页面标题在每个页面上发生变化。这将涉及在页面视图中使用\
  \ `<title>` 标签。大多数浏览器会在浏览器窗口顶部显示 `title` 标签的内容，这对于搜索引擎优化（SEO）也很重要。我们将使用完整的“红-绿-重构”循环：首先为我们的页面标题添加简单的测试（`RED`），然后为我们的三个页面中的每个页面添加标题（`GREEN`），最后使用一个*布局（*layout**文件来消除重复。\n\
  \n**表 3.2：** 示例应用的（大部分）静态的页面。\n\n![image](img/image01060.jpeg)\n\n（重构）。到本节结束时，我们的三个静态页面都将具有格式为“<page\
  \ name> | Ruby on Rails Tutorial Sample App”的标题，其中标题的第一部分将根据页面变化（表 3.2）。\n\n`rails\
  \ new` 命令（列表 3.1）默认会创建一个布局文件，但最初忽略它是有益意义的，我们可以通过更改它的名称来实现：\n\n点击此处查看代码图像\n\n```bash\n\
  $ mv app/views/layouts/application.html.erb layout_file # 临时更改\n```\n\n在实际应用中你通常不会这样做，但如果从从禁用它开始，会更容易理解布局文件的用途。\n\
  \n### 3.4.1 测试标题（红）\n\n为了添加页面标题，我们需要学习（或复习）典型网页的结构，其形式如列表 3.23 所示。（这在《学到足够的 HTML\
  \ 就能变得危险》书中中有更深入的介绍。）\n\n**列表 3.23：** 典型网页的 HTML 结构。\n\n点击此处查看代码图像\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title>Greeting</title>\n</head>\n<body>\n\
  \    <p>Hello, world!</p>\n</body>\n</html>\n```\n\n列表 3.23 中的结构包含一个顶部的*文档类型*（document\
  \ type，或 doctype）声明，告诉浏览器我们正在使用哪个版本的 HTML（在本例中为 HTML5）；10. HTML 随时间而变化；通过显式地声明 doctype，我们增加了浏览器在未来正确渲染我们页面的可能性。简单的\
  \ doctype `<!DOCTYPE html>` 是最新 HTML 标准 HTML5 的特征。\n\n我们将通过将列表 3.15 中的测试与 `assert_select`\
  \ 方法结合，为表 3.2 中的每个标题编写简单的测试，`assert_select` 允许我们测试特定 HTML 标签是否存在（有时被称为“选择器”，故得名如此）：1.\n\
  \n```ruby\nassert_select \"title\", \"Home | Ruby on Rails\"\n```\n\n特别是上面的代码检查\
  \ `<title>` 标签是否包含“Home | Ruby on Rails”。将此想法应用于所有页面，将得到列表 24。**列表 24：** 带有标题的测试\
  \ `test/controllers/static_pages_test.rb`\n\n```ruby\nrequire 'test_helper'\n\n\
  class StaticPagesTest < ActionDispatch::IntegrationTest\n  test \"should get home\"\
  \ do\n    get static_home_path\n    assert_response :success\n    assert_select\
  \ \"title\", \"Home | Ruby on Rails Sample App\"\n  end\n\n  test \"should get help\"\
  \ do\n    get static_help_path\n    assert_response :success\n    assert_select\
  \ \"title\", \"Help | Ruby on Rails Sample App\"\n  end\n\n  test \"should get about\"\
  \ do\n    get static_about_path\n    assert_response :success\n    assert_select\
  \ \"title\", \"About | Ruby on Rails Sample App\"\n  end\nend\n```\n\n有了列表 24 中的测试，你应该验证测试套件目前处于\
  \ `RED`（红色）状态：\n\n**列表 25：** `RED`\n\n```bash\n$ rails test\n3 tests, 6 assertions,\
  \ 3 failures, 0 errors, 0 skips\n```\n\n### 3.4.2 添加标题（绿）\n\n现在我们将为每个页面添加标题，使第 3.4.1\
  \ 节中的测试通过。稍微动态化的方法是添加一些随页面变化的内容：我们将让每个页面的标题变化以反映其内容。一个变化的标题是否代表了*真正*的动态内容尚存争议，但无论如何，它都为第\
  \ 7 章中无歧的动态内容奠定了必要的基础。我们的计划是编辑 Home、Help 和 About 页面，使页面标题在每个页面上发生变化。这将涉及在页面视图中使用\
  \ `<title>` 标签。大多数浏览器会在浏览器窗口顶部显示 `title` 标签的内容，这对于搜索引擎优化也很重要。我们将使用完整的“红-绿-重构”循环：首先为我们的页面标题添加简单的测试（`RED`），然后为我们的三个页面中的每个页面添加标题（`GREEN`），最后使用一个*布局（*layout**文件来消除重复。\n\
  \n首先，我们编辑 Home 视图。`app/views/static_pages/home.html.erb`：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <title>Home | Ruby on Rails Sample App</title>\n</head>\n\
  <body>\n    <h1>Sample App</h1>\n    <p>\n        This is the home page for the\n\
  \        <a href=\"http://www.railstutorial.org/\">Ruby on Rails Tutorial</a>s\n\
  \        sample application.\n    </p>\n</body>\n</html>\n```\n\n接下来，编辑 Help 视图。`app/views/static_pages/help.html.erb`：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Help | Ruby on Rails Sample\
  \ App</title>\n</head>\n<body>\n    <h1>Sample App</h1>\n    <p>\n        This is\
  \ the help page for the\n        <a href=\"http://www.railstutorial.org/\">Ruby\
  \ on Rails Tutorial</a>s\n        sample application.\n    </p>\n</body>\n</html>\n\
  ```\n\n最后，编辑 About 视图。`app/views/static_pages/about.html.erb`：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <title>About | Ruby on Rails Sample App</title>\n</head>\n\
  <body>\n    <h1>Sample App</h1>\n    <p>\n        This is the about page for the\n\
  \        <a href=\"http://www.railstutorial.org/\">Ruby on Rails Tutorial</a>s\n\
  \        sample application.\n    </p>\n</body>\n</html>\n```\n\n现在再次运行测试：\n\n```bash\n\
  $ rails test\n3 tests, 6 assertions, 0 failures, 0 errors, 0 skips\n```\n\n测试现在通过了（`GREEN`）。但是，你可能注意到，每个视图都重复了相同的\
  \ HTML 结构。为了消除这种重复，我们将使用布局文件。\n\n**列表 26：** 带有完整 HTML 结构的布局 `app/views/layouts/application.html.erb`：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title><%= yield(:title) %> | Ruby\
  \ on Rails Sample App</title>\n</head>\n<body>\n    <%= yield %>\n</body>\n</html>\n\
  ```\n\n现在我们可以重构静态视图。`app/views/static_pages/home.html.erb`：\n\n```html\n<h1>Sample\
  \ App</h1>\n<p>\n    This is the home page for the\n    <a href=\"http://www.railstutorial.org/\"\
  >Ruby on Rails Tutorial</a>s\n    sample application.\n</p>\n```\n\n`app/views/static_pages/help.html.erb`：\n\
  \n```html\n<h1>Sample App</h1>\n<p>\n    This is the help page for the\n    <a href=\"\
  http://www.railstutorial.org/\">Ruby on Rails Tutorial</a>s\n    sample application.\n\
  </p>\n```\n\n`app/views/static_pages/about.html.erb`：\n\n```html\n<h1>Sample App</h1>\n\
  <p>\n    This is the about page for the\n    <a href=\"http://www.railstutorial.org/\"\
  >Ruby on Rails Tutorial</a>s\n    sample application.\n</p>\n```\n\n最后，我们需要在控制器中设置\
  \ `title` 变量。`app/controllers/static_pages_controller.rb`：\n\n```ruby\nclass StaticPagesController\
  \ < ApplicationController\n  def home\n    render_layout title: \"Home\"\n  end\n\
  \n  def help\n    render_layout title: \"Help\"\n  end\n\n  def about\n    render_layout\
  \ title: \"About\"\n  end\n\n  private\n\n  def render_layout(title:)\n    @title\
  \ = title\n    render layout: \"application\"\n  end\nend\n```\n\n最后，我们需要更新布局文件以使用\
  \ `@title` 变量。`app/views/layouts/application.html.erb`：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title><%= @title %> | Ruby on Rails Sample App</title>\n</head>\n\
  <body>\n    <%= yield %>\n</body>\n</html>\n```\n\n再次运行测试：\n\n```bash\n$ rails test\n\
  3 tests, 6 assertions, 0 failures, 0 errors, 0 skips\n```\n\n我们成功通过重构消除了重复，并实现了标题的动态化。\n\
