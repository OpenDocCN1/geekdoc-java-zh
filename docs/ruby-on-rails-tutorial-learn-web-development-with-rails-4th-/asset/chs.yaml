  $ git push\n$ heroku create\n$ git push master\n```\n\n\n\n\n\n# 静态页面\n\n为了开始学习静态页面，我们将首先使用在第\
  \ 2 章中用于生成脚手架的 Rails `generate` 脚本来生成控制器。由于我们要创建一个处理静态页面的控制器，我们将将其命名为 Static Pages\
  \ 控制器，指定为大驼命名法（CamelCase）名称 `StaticPages`。我们还计划为首页（Home）、帮助页（Help）和关于页（About）创建动作（actions），指定为小写动作名称\
  \ `home`、`help` 和 `about`。`generate` 脚本接受可选的动作列表，因此我们将直接在命令行中包含首页和帮助页的动作，同时刻意遗漏关于页的动作，以便我们后续学习如何添加它（第\
  \ 3.3 节）。生成 Static Pages 控制器的最终命令出现在列表 3.6 中。\n\n**列表 3.6:** 生成 Static Pages 控制器。\n\
  \n点击此处查看代码图像\n\n* * *\n\n```\n$ rails generate controller StaticPages home help\n\
  \      create  app/controllers/static_pages_controller.rb\n      route  get 'static_pages/help'\n\
  \      route  get 'static_pages/home'\n      invoke  erb\n      create      app/views/static_pages\n\
  \      create      app/views/static_pages/home.html.erb\n      create      app/views/static_pages/help.html.erb\n\
  \      invoke  test_unit\n      create      test/controllers/static_pages_controller_test.rb\n\
  \      invoke  helper\n      create      app/helpers/static_pages_helper.rb\n  \
  \    invoke      test_unit\n      invoke  assets\n      invoke      coffee\n   \
  \   create      app/assets/javascripts/static_pages.coffee\n      invoke      scss\n\
  \      create      app/assets/stylesheets/static_pages.scss\n```\n\n* * *\n\n顺便提一下，值得注意的是\
  \ `rails g` 是 `rails generate` 的快捷方式，这只是 Rails 支持的快捷方式之一（表 3.1）。为了清晰起见，本教程始终使用完整命令，但在现实生活中，大多数\
  \ Rails 开发者会使用表 3.1 所示的一个或多个快捷方式。⁶\n\n6. 事实上，许多 Rails 开发者还会在如*Learn Enough Text\
  \ Editor to Be Dangerous*描述的那样为 `rails` 命令添加别名，通常将其缩短为 `r`。这允许我们使用紧凑的命令 `r s` 来运行例如\
  \ Rails 服务器。\n\n**表 3.1:** 一些 Rails 快捷方式。\n\n![image](img/image01054.jpeg)\n\n在继续之前，如果你在使用\
  \ Git，将 Static Pages 控制器的文件添加到远程仓库将是一个好主意：\n\n点击此处查看代码图像\n\n```\n$ git add -A\n\
  $ git commit -m \"Add a Static Pages controller\"\n$ git push -u origin static-pages\n\
  ```\n\n这里的最后一个命令安排将 `static-pages` 主题分支推送到 Bitbucket。随后的推送可以省略其他参数，只需写道：\n\n```\n\
  $ git push\n```\n\n上面的提交和推送序列代表了我在现实开发中通常遵循的模式，但为了简单起见，从现在起我通常会省略此类中间提交。\n\n在列表\
  \ 3.6 中，注意我们以大驼命名传递了控制器名称（之所以这样命名是因为因为它像双峰驼的驼峰），这导致创建一个以下划线法（snake case）编写的控制器文件，因此名为\
  \ `Pages` 的控制器会生成名为 `static_pages_controller.rb` 的文件。这仅仅是一种约定，实际上，在命令行中使用下划线法也是可以行的：该命令\n\
  \n点击此处查看代码图像\n\n```\n$ rails generate controller static_pages ...\n```\n\n也会生成一个名为\
  \ `static_pages_controller.rb` 的控制器。因为 Ruby 使用大驼命名作为类名（第 4.4 节），所以我倾向于使用大驼命名来引用控制器，但这取决于个人喜好。（由于\
  \ Ruby 文件名通常使用下划线法，Rails 生成器使用下划线方法将大驼命名转换为下划线法。）\n\n顺便说，如果你在生成代码时出错，知道如何撤销过程非常有用。参见框\
  \ 3.1 获取有关在 Rails 中撤销操作的技术。\n\n* * *\n\n**框 3.1: 撤销操作**\n\n即使你非常小心，也可能出错。幸运的是，Rails\
  \ 有一些撤销机制。\n\n一个常见的场景是想要撤销生成的文件——如列表 3.6 所示，这并不删除控制器那么简单。在 Rails 中，可以通过以下命令实现：\n\
  \n```\n$ rails destroy StaticPages home help\n```\n\n同样，如果你对模型改变了主意，可以使用以下命令撤销：\n\
  \n```\n$ rails destroy User\n```\n\n另一个与相关的技术涉及撤销迁移（migrations），我们在第 2 章中简单提到过。迁移使用以下命令更改数据库状态：\n\
  \n```\n$ rails db:migrate\n```\n\n撤销单个迁移步骤，使用：\n\n```\n$ rails db:rollback\n```\n\
  \n要回到起点，可以使用：\n\n```\n$ rails db:migrate VERSION=0\n```\n\n有了这些技术，我们完全能够应对不可避免的开发故障。\n\
