  \n### 6.4 结论\n\n从零开始，我们在本章中创建了一个具有名称、邮箱和密码属性的可用 User 模型，并结合了对这些值执行若干重要约束的验证。此外，我们还能够使用给定的密码对用户进行安全验证。对于十二行代码来说，这是一个显著的功能。\n\
