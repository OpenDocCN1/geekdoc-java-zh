  ```\n\n这里的关键行实际上是 CSS 注释，但它们被 `Sprockets` 用来包含正确的文件：\n\n点击此处查看代码图片\n\n```css\n=\
  \ require_tree .\n= require_self\n```\n\n`= require_tree .` 行确保 `app/assets/stylesheets`\
  \ 目录中的所有 CSS 文件（包括树子目录）都包含在应用程序 CSS 中。`= require_self` 行指定了 `application.css` 本身的\
  \ CSS 在加载序列中的包含位置。\n\nRails 自带了合理的默认清单文件，在《Rails 教程》中我们不需要进行任何更改，但如果你有需要，Rails Guides\
  \ 中关于资源流水线（asset pipeline）的条目提供了更多细节。\n\n### 预处理器引擎\n\n在你组装好资产之后，Rails 通过运行多个预处理器引擎并将它们为站点模板做好准备，同时使用清单文件将它们合并以交付给浏览器。我们通过文件名扩展名告诉\
  \ Rails 使用哪种处理器；最常见的三的情况是用于 Sass 的 `.scss`、用于 CoffeeScript 的 `.coffee` 以及用于嵌入 Ruby\
  \ (ERb) 的 `.erb`。我们首先在第 3.4.3 节介绍了 ERb，并在第 5.2.2 节介绍了 Sass。在本教程中不需要 CoffeeScript，但它是一种优雅的语言，会被转换为\
  \ JavaScript 在浏览器中执行。\n\n预处理器引擎可以链式，这样 `foobar.js.coffee` 会通过 CoffeeScript 处理器，而\
  \ `foobar.js.erb.coffee` 则会同时通过 CoffeeScript 和 ERb（代码从右向左运行，即先运行 CoffeeScript）。\n\
  \n### 生产环境中的效率\n\n资源流水线的优点之一是，它会自动生成的资产在生产应用程序中经过了高效优化。组织 CSS 和 JavaScript 的传统方法涉及将功能分成单独的文件并使用整齐的格式（带有大量的缩进）。对于程序员来说这很方便，但在生产环境中效率很低。特别是包含多个完整尺寸的文件会显著减慢页面加载速度，这是影响用户体验质量最重要的因素之一。通过资源流水线，我们不需要在速度和便利之间做选择：我们可以在开发中使用多个格式整齐的文件，然后使用资源流水线在生产环境中生成高效的文件。特别是资源流水线会将所有应用程序样式表合并为一个\
  \ CSS 文件（`application.css`），将所有应用程序 JavaScript 合并为一个 JavaScript 文件（`application.js`），然后对其进行压缩以移除导致文件体积膨大的必要的空格和缩进。结果是两兼得：开发中的便利性和生产环境的高效率。\n\
  \n### 5.2.2 语法上很棒的样式表\n\n*Sass*是一种编写样式表的语言，它在许多方面改进了 CSS。在本节中，我们将涵盖两个最重要的改进：*嵌套*（nesting）和*变量*（variables）。（第三种技术*mixins*（mixins，即混入）将在第\
  \ 7.1.1 节中介绍。）\n\n正如在第 5.1.2 节中简要提到的，Sass 支持一种名为 SCSS 的格式（以 `.scss` 文件扩展名指示），它是\
  \ CSS 本身的严格超集；也就是说，SCSS 仅向 CSS 添加了功能，而不是定义一套全新的语法。这意味着每个有效的 CSS 文件也是一个有效的 SCSS 文件，这对于已有样式规则的项目来说非常方便。在我们的案例中，我们从开始就使用\
  \ SCSS 以为了利用 Bootstrap。由于 Rails 资源流水线会自动处理 `.scss` 文件，因此 `.scss` 文件将会被处理。\n\n####\
  \ 嵌套\n\n样式表中的一种常见模式是拥有适用于嵌套元素的规则。例如，在列表 5.7 中，我们有：\n\n```css\n.center {\n  text-align:\
  \ center;\n}\n.center h1 {\n  margin-bottom: 10px;\n}\n```\n\n在这里 `h1` 出现了两次，一次是单独出现，一次是带有\
  \ `hover` 属性（它控制鼠标指针悬停在元素上时的外观）。为了嵌套第二个规则，我们需要引用父元素 `#logo`；在 SCSS 中，这通过使用波浪符号 `&`\
  \ 实现如下：\n\n```css\n#logo {\n  float: left;\n  margin-right: 10px;\n  font-size:\
  \ 1.7em;\n  color: #fff;\n  text-transform: uppercase;\n  letter-spacing: -1px;\n\
  \  padding-top: 9px;\n  font-weight: bold;\n  &:hover {\n    color: #fff;\n    text-decoration:\
  \ none;\n  }\n}\n```\n\nSass 在从 SCSS 转换为 CSS 时会将 `&:hover` 更改 `#logo:hover`。这两种嵌套技术适用于列表\
  \ 5.17 中的页脚 CSS，它可以转换为以下内容：\n\n```css\nfooter {\n  margin-top: 45px;\n  padding-top:\
  \ 5px;\n  border-top: 1px solid #eaeaea;\n  color: #777;\n  a {\n    color: #555;\n\
  \    &:hover {\n      color: #222;\n    }\n  }\n}\n```\n\n\n\n\n\n```css\nsmall\
