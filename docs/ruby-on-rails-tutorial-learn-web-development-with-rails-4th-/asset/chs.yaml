  \ Rails 的一部分；它实际上是 Internet Explorer 浏览器为了这种情况支持的条件注释。这也是好事，因为这意味着我们可以*仅*为低于 9 的\
  \ IE 浏览器包含 HTML5 shim，而让 Firefox、Chrome 和 Safari 等浏览器不受影响。\n\n下一节包含一个站点（纯文本）Logo\
  \ 的 `<header>`、几个 <div>（使用 `div` 标签）以及一个带有导航链接的元素列表：\n\n点击此处查看代码\n\n```html\n<header\
  \ class=\"navbar-fixed-top navbar-inverse\">\n  <div class=\"container\">\n    <%=\
  \ link_to \"sample app\", '#', id: \"logo\" %>\n    <nav>\n      <ul class=\"nav\
  \ navbar-nav-right\">\n        <li><%= link_to \"Home\", '#' %></li>\n        <li><%=\
  \ link_to \"Help\", '#' %></li>\n        <li><%= link_to \"Log in\", '#' %></li>\n\
  \      </ul>\n    </nav>\n  </div>\n</header>\n```\n\n\n\n\n这里 `header` 标签表示应该位于页面顶部的元素。我们为\
  \ `header` 标签分配了三个 `CSS classes`，称为 `navbar`、`navbar-fixed-top` 和 `navbar-inverse`，并用空格分隔：\n\
  \n[4.] 这些与 Ruby 类完全没有关系。\n\n[点击此处查看图片]\n\n```html\n<header class=\"navbar navbar-fixed-top\
  \ navbar-inverse\">\n```\n\n所有的 HTML 元素都可以同时分配 `classes` 和 `ids`；这些仅仅是标签，用于使用 CSS\
  \ 进行样式设计（第 5.1.2 节）。classes 和 ids 之间的主要区别是，classes 可以在页面上多次使用，而 ids 只能使用一次。在当前的情况下，所有的\
  \ navbar 类对 Bootstrap 框架都有特殊含义，我们将在第 5.1.2 节中安装并使用它们。\n\n在 `header` 标签内部，我们看到了一个\
  \ `div` 标签：\n\n```html\n<div class=\"container\">\n```\n\n`div` 标签是一个通用的分区域标签；除了将文档分成不同的部分外，它不起任何作用。在旧风格的\
  \ HTML 中，`div` 标签用于几乎所有的站点划分，但 HTML5 添加了 `header`、`nav` 和 `section` 元素，用于许多应用程序中常见的划分。在这种情况下，`div`\
  \ 也有一个 CSS 类（`container`）。与 `header` 标签的类一样，这个类对 Bootstrap 具有特殊含义。\n\n在 div 之后，我们遇到了一些嵌入的\
  \ Ruby 代码：\n\n[点击此处查看图片]\n\n```ruby\n<%= link_to \"sample app\", '#', id: \"logo\"\
  \ %>\n\n<nav>\n  <ul class=\"nav navbar-nav navbar-right\">\n    <li><%= link_to\
  \ \"Home\", '#' %></li>\n    <li><%= link_to \"Help\", '#'</li></li>\n    <li><%=\
  \ link_to \"Log in\", '#'</li></li>\n  </ul>\n</nav>\n```\n\n这使用了 Rails 辅助方法 `link_to`\
  \ 来创建链接（我们在第 3.2.2 节中曾直接使用锚点标签 `a` 创建了它们）；`link_to` 的第一个参数是链接文本，第二个参数是 URL。我们将在第\
  \ 5.3.3 节用命名路由来填充 URL，但目前我们使用 Web 设计中常用的占位 URL `'#'`（即 `'#'` 只是真实 URL 的一个“存根”或占位符）。第三个参数是一个选项哈希（options\
  \ hash），在此情况下为 sample app 链接添加了 CSS id `logo`。（另外三个链接没有选项哈希，这没关系，因为它是可选的。）Rails\
  \ 辅助方法通常会这样接收选项哈希，让我们能够在不离开 Rails 的情况下添加任意的 HTML 选项。\n\n`div` 内部的第二个元素是导航链接列表，使用无序列表标签\
  \ `ul` 配合列表项标签 `li` 制作：\n\n[点击此处查看图片]\n\n```html\n<nav>\n  <ul class=\"nav navbar-nav\
  \ navbar-right\">\n    <li><%= link_to \"Home\", '#' %></li>\n    <li><%= link_to\
  \ \"Help\", '#'</li>\n    <li><%= link_to \"Log in\", '#'</li></li>\n  </ul>\n</nav>\n\
  ```\n\n`<nav>` 标签虽然在形式上在这里不是必要的，但它是为了更清晰地传达导航链接的目的。同时，`ul` 标签上的 `nav`、`navbar-nav`\
  \ 和 `navbar-right` 类对 Bootstrap 有特殊含义，当我们在第 5.1.2 节中引入 Bootstrap CSS 时，它们将被自动样式。你可以通过在浏览器中检查导航来验证，一旦\
  \ Rails 处理了布局并评估了嵌入的 Ruby，列表看起来如下：\n\n[5.] 间距可能看起来略有不同，这没关系，因为（如第 3.4.1 节所述）HTML\
  \ 对空白不敏感。\n\n[点击此处查看图片]\n\n```html\n<nav>\n  <ul class=\"nav navbar-nav navbar-right\"\
