  \n**等等，我发现我完全在做无用功。我将直接提供最终翻译。**\n\n\n\n\n\n我们看到 `pluralize` 接受一个整数参数，然后返回该数字以及其第二个参数的正确复数形式。该方法的底层是一个强大的\
  \ `inflector`，它知道如何将大量单词变为复数，包括许多具有不规则复数形式单词：\n\n点击此处查看代码图像\n\n`>> helper.pluralize(2,\
  \ \"woman\"),`\n\n`=> \"2 women\"`\n\n`>> helper.pluralize(3, \"erratum\")`\n\n\
  `=> \"3 errata\"`\n\n由于使用了 `pluralize`，代码\n\n点击此处查看代码图像\n\n```\n<%= pluralize(@user.errors.count,\
  \ \"error\") %>\n```\n\n返回 `\"0 errors\"`、`\"1 error\"`、`\"2 errors\"` 等，取决于错误的数量，从而避免了诸如\
  \ `\"1 errors\"` 等不符合语法的短语（这是应用和网页上一个非常常见的错误）。\n\n注意，列表 7.21 包含了用于为错误消息设置式的 CSS\
  \ id `error_explanation`。（回想 第 5.1.2 节，CSS 使用井号 `#` 来设置 id。）此外，在无效提交后，Rails 会自动将带有错误的字段封装在\
  \ CSS 类为 `field_with_errors` 的 `div` 中。这些标签随后允许我们使用列表 7.22 所示的 SCSS 对错误消息进行样式处理，它利用了\
  \ Sass 的 `@extend` 函数来包含 Bootstrap 类 `has-error` 的功能。\n\n**列表 7.22：** 用于错误消息样式的\
  \ CSS。\n\n```scss\napp/assets/stylesheets/custom.scss\n\n/* forms */\n#error_explanation\
  \ {\n  color: red;\n  ul {\n    color: red;\n    margin: 0 0 30px 0;\n  }\n}\n\n\
  .field_with_errors {\n  @extend .has-error;\n  .form-control {\n    color: $state-danger-text;\n\
  \  }\n}\n```\n\n结合列表 7.20 和列表 7.21 中的代码以及列表 7.22 中的 SCSS，当提交无效注册信息时，现在会出现有用的错误消息，如图\
  \ 7.18](#part0016.xhtml_fig7_18）所示。因为这些消息是由模型验证生成的，如果你更改了主意（例如更改电子邮件格式或密码的最小长度），它们会自动更改。（*注意*：由于存在性验证和\
  \ `has_secure_password` 验证都会捕捉空 `nil` 密码的情况，注册表单在用户提交空密码时会产生重复的错误消息。我们可以直接操作错误消息来消除重复，但幸运的是，通过在第\
  \ 10.1.4 节中添加 `allow_nil: true`，这个问题将被自动修复。）\n\n##### 练习\n\n购买任何 Rails Tutorial\
