  \ 只有一个用户的用户索引页。\n\n#### 10.3.2 示例用户\n\n在本节中，我们将为那个孤独的示例用户找一些伙伴。当然，为了创建足够的用户来构建一个像样的用户索引，我们*可以*使用浏览器访问注册页面并逐一个创建新用户，但更好的解决方案是使用\
  \ Ruby 为我们创建用户。\n\n首先，我们将在 `Gemfile` 中添加 `Faker` gem，这将允许我们创建具有半真实姓名和电子邮箱地址的示例用户（列表\
  \ 10.42）。⁹（通常情况下，你可能想将 faker gem 限制在开发环境中，但在我们使用的示例应用程序中，我们在生产站点也会使用它[第 10.5 ]。）\n\
  \n9. 一如既往，你应该使用 gemfiles-4th-ed.railstutorial.org 列出的版本号，而不是这里列出的版本。\n\n**列表 10.42：**\
  \ 在 `Gemfile` 中添加 Faker gem。\n\n点击此处查看代码图片\n\n***\n\n```ruby\nsource 'https://rubygems.org'\n\
  gem 'rails', '5.0.0'\ngem 'bcrypt', '3.1.11'\ngem 'faker', '1.6.3'\n```\n\n***\n\
  \n然后按照通常方式安装：\n\n```bash\n$ bundle install\n```\n\n接下来，我们将添加一个 Ruby 程序来向数据库填充示例用户，Rails\
  \ 使用标准文件 `db/seeds.rb`。结果显示在列表 10.43 中。（列表 10.43 中的代码稍显高级，所以不用过于担心细节。）\n\n**列表 10.43：**\
  \ 用于向数据库填充示例用户的程序。\n`db/seeds.rb`\n\n点击此处查看代码图片\n\n***\n\n```ruby\nUser.create!(name:\
  \ \"Example User\", email: \"example@railstutorial.org\", password: \"foobar\",\
  \ password_confirmation: \"foobar\")\n\n99.times do |n|\n  name = Faker::Name.name\n\
  \  email = \"example-#{n+1}@railstutorial.org\"\n  password = \"password\"\n  User.create!(name:\
  \ name, email: email, password: password, password_confirmation: password)\nend\n\
  ```\n\n***\n\n列表 10.43 中的代码创建了一个姓名和电子邮箱与之前相同的示例用户，然后又创建了 99 个。`create!` 方法与 `create`\
  \ 方法相似，区别在于它会对无效用户抛出异常（节 6.1.4 ）而不是返回 `false`。这种行为通过避免静默错误使调试变得更加容易。\n\n使用列表 10.43\
  \ 中的代码，我们可以重置数据库，然后调用它。\n\n[content]\n\n```ruby\nUser.create!(name: \"Example User\"\
  , email: \"example@railstutorial.org\", password: \"foobar\", password_confirmation:\
  \ \"foobar\")\n\n99.times do |n|\n  name = Faker::Name.name\n  email = \"example-#{n+1}@railstutorial.org\"\
  \n  password = \"password\"\n  User.create!(name: name, email: email, password:\
  \ password, password_confirmation: password)\nend\n```\n\n\n\n\n\n```html\n<ul class=\"\
  users\">\n  <% @users.each do |user| %>\n    <li\n      <%= gravatar_for user, size:\
  \ 50 %>\n      <%= link_to user.name, user %>\n    </li>\n  <% end %>\n</ul>\n```\n\
  `<%= will_paginate %>`\n\n* * *\n\n`will_paginate` 方法有点魔力；在 `users` 视图中，它会自动寻找 `@users`\
  \ 对象，然后显示分页链接以访问其他页面。尽管，列表 10.45 中的视图目前尚无法工作，因为目前 `@users` 包含 `User.all` 的结果（列表\
  \ 10.36），而 `will_paginate` 要求我们显式地使用 `paginate` 方法对结果进行分页：\n\n点击此处查看代码图片\n\n```bash\n\
  $ rails console\n>> User.paginate(page: 1)\nUser Load (1.5ms) SELECT \"users\".*\
  \ FROM \"users\" LIMIT 30 OFFSET 0\n(1.7ms) SELECT COUNT(*) FROM \"users\"\n=> #<ActiveRecord::Relation\
  \ #<User id: 1,...\n```\n\n注意 `paginate` 接收一个带有 `:page` 键和等于请求页码值的哈希参数。`User.paginate`\
  \ 根据 `:page` 参数每次从数据库中提取一个用户（默认为 30 个）。例如，第 1 页是用户 1–30 位，第 2 页是用户 31–60 位，以此此类推。如果\
  \ `page` 为 `nil`，`paginate` 直接返回第一页。\n\n使用 `paginate` 方法，我们可以在 `index` 操作中用 `paginate`\
  \ 代替 `all` 对示例应用程序中的用户进行分页（[列表 10.46）。这里的 `page` 参数来自 `params[:page]`，它是由 `will_paginate`\
  \ 自动生成的。\n\n**列表 10.46：** 在 `index` 操作中对用户进行分页。\n\n`app/controllers/users_controller.rb`\n\
  \n点击此处查看代码图片\n\n```ruby\nclass UsersController < ApplicationController\n  before_action\
  \ :logged_in_user, only: [:index, :edit, :update]\n\n  def index\n    @users = User.paginate(page:\
  \ params[:page])\n  end\nend\n```\n\n* * *\n\n用户索引页现在应该可以正常工作了，如图 10.11 所示。（在某些系统上，此时你可能需要重新启动\
  \ Rails 服务器。）由于我们在用户列表的上下都包含了 `will_paginate`，因此分页链接会同时出现在两个地方。\n\n如果你现在点击“2”链接或“Next”（下一页）链接，你将获得结果的第二页，如图\
  \ 10.12 所示。\n\n### 练习题\n\n在购买任何 Rails Tutorial 后，都可以在 railstutorial.org/solutions\
