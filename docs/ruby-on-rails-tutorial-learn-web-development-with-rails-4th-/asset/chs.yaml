  \ `resources :users`（列表 7.3 的 RESTful URL。具体而言，它确保了发送到 `/users` 的 POST 请求将由 `create`\
  \ action 进行处理。我们对 `create` action 的策略是：使用表单提交通过 `User.new` 创建一个新的用户对象，尝试（并失败）保存该用户，然后渲染注册页面以备可能的重新提交。让我们从查看注册表单的代码开始：\n\
  \n点击此处此处查看代码图片\n\n```html\n<form action=\"/users\" class=\"new_user\" id=\"new_user\"\
  \ method=\"post\">\n```\n\n正如第 7.2.2 节中所提到的，此 HTML 会向 `/users` URL 发起一个 POST 请求。\n\
  \n实现可用注册表单的第一步是向列表 7.18 中添加代码。该列表包含了 `render` 方法的第二次使用，我们之前在部分视图（partials）的上下（第\
  \ 5.1.3 节）见过它；如你所见，`render` 在控制器 action 中同样有效。注意，我们借此机会引入了 `if`-`else` 分支结构，这允许我们根据\
  \ `@user.save` 的值分别处理失败和成功的情况（正如我们在第 6.1.3 节中看到的，该值取决于保存是否成功为 `true` 或 `false`）。\n\
  \n![image](img/image01322.jpeg)\n\n**图 7.14：** 注册失败页面的原型图。\n\n**列表 7.18：** 一个可以处理注册失败的\
  \ `create` action。\n\napp/controllers/users_controller.rb\n\n点击此处查看代码图片\n\n```ruby\n\
  class UsersController < ApplicationController\n  def show\n    @user = User.find(params[:id])\n\
  \  end\n\n  def new\n    @user = User.new\n  end\n\n  def create\n    @user = User.new(params[:user])\
  \     # 最终实现！\n    if @user.save\n      # 处理成功的保存。\n    else\n      render 'new'\n\
  \    end\n  end\nend\n```\n\n注意该注释：这并不是最终实现。但它足够让我们开始工作，我们将在第 7.3.2 节中完成实现。\n\n\
  理解列表 7.18 中代码如何工作的最佳方法是使用无效的注册数据提交表单。结果显示在图 7.15 中，而完整的调试信息显示在图 7.16 中。\n\n![image](img/image01324.jpeg)\n\
  \n**图 7.15：** 注册失败。\n\n![image](img/image01325.jpeg)\n\n**图 7.16：** 注册失败的调试信息。\n\
  \n为了更好地了解 Rails 如何处理提交，让我们仔细查看调试信息（图 7.16\n\n```json\n\"user\" => { \"name\" =>\
  \ \"Foo Bar\",\n           \"email\" => \"foo@invalid\",\n           \"password\"\
  \ => \"[FILTERED]\",\n           \"password_confirmation\" => \"[FILTERED]\"\n}\n\
  ```\n\n此哈希作为 `params` 的传递传递 Users 控制器，我们在第 7.1.2 节开始看到 `params` 哈希包含有关每个请求的信息。对于像\
  \ `/users/1` 这样的 URL，`params[:id]` 的值是对应用户的 `id` (1)。在提交注册表单的情况下，`params` 则包含一个嵌套哈希，这种构造我们首次在第\
  \ 4.3.3 节中见过，该节引入了具有策略性命名的 `params` 变量。上面的调试信息显示，提交表单会导致产生一个 `user` 哈希，其属性与提交的值对应，其中键来自列表\
  \ 7.15 中看到的 `input` 标签的 `name` 属性。例如，以下\n\n```html\n<input id=\"user_email\" name=\"\
  user[email]\" type=\"email\" />\n```\n\n名为 `user[email]` 的值恰好就是 `user` 哈希的 `email`\
  \ 属性。尽管哈希的键是字符串，但我们在 `params[:id]` 中使用了符号（*此处纠正：原文为 symbols，此处语境指符号/字符串键值关系，注：原文是\
  \ \"the keys come from the name attributes\" 意为键来自 HTML 属性名）。*纠正：原文是 \"the keys\
  \ come from the name attributes of the input tags\"*。例如，名为 `user[email]` 的值恰好就是\
  \ `user` 哈希的 `email` 属性。尽管哈希的键是字符串，但我们在 `params[:id]` 中使用了符号（*注：原文未出现 symbols 字，此处指代键值对逻辑*）。这意味着\
  \ Rails 是默认安全的。\n\n### 7.3.2 强参数 (Strong Parameters)\n\n我们在第 4.3.3 节中简要提到过**批量赋值**（mass\
  \ assignment）的概念，它涉及使用哈希来初始化一个 Ruby 变量，如下所示：\n\n```ruby\n@user = User.new(params[:user])\
  \     # 并不是最终实现！\n```\n\n列表 7.18 中包含的表明这并不是最终实现。原因是，初始化整个 `params` 哈希是**极其危险的**——它向\
  \ `User.new` 传递用户提交的所有数据。具体来说，假设除了当前的属性外，User 模型还包含一个用于识别网站管理员的 `admin` 属性（我们将在第\
  \ 10.4.1 节中实现这样一个属性）。将此类属性设置为 `true` 的方法是在 `params[:user]` 中传递 `admin='1'`，这种任务使用命令行\
  \ HTTP 客户端（如 `curl`）很容易完成。结果将是通过将整个 `params` 哈希传递给 `User.new`，允许任何用户通过在请求中包含 `admin='1'`\
  \ 来获得管理员权限。\n\n之前的 Rails 版本在模型层使用 `attr_accessible` 方法来解决这个问题，你可能在旧版 Rails 应用程序中看到该方法，但从\
  \ Rails 4.0 开始，推荐的技术是在控制器层使用所谓的“强参数”。这允许我们指定哪些参数是必须的，哪些是允许的。此外，如上所示传递原始 `params`\
  \ 哈希将导致异常，因此 Rails 应用程序默认情况下就能防止批量赋值漏洞。\n\n在当前实例中，我们要求 `params` 哈希具有 `:user` 属性，并允许\
  \ `name`、`email`、`password` 和 `password_confirmation` 属性（以及其他属性）。我们可以通过以下方式实现：\n\
  \n```ruby\nparams.require(:user).permit(:name, :email, :password, :password_confirmation)\n\
  ```\n\n\n\n\n\n此代码返回一个 `params` 哈希的副本，其中仅包含被允许的属性（如果缺少 `:user` 属性则会抛出错误）。\n\n为了方便使用这些参数，通常的做法是引入一个名为\
  \ `user_params` 的辅助方法（它返回适当的初始化哈希），并用它来代替 `params[:user]`：\n\n```ruby\n@user = User.new(user_params)\n\
  ```\n\n由于 `user_params` 仅会在 `Users` 控制器内部使用，且不需要通过 Web 暴露给外部用户，我们将使用 Ruby 的 `private`\
  \ 关键字将其设为私有，如 列表 7.19 所示。（我们将在 第 9.1 节 中详细讨论 `private`。）\n\n**列表 7.19：** 在 `create`\
  \ 动作中使用强参数。\n\n`app/controllers/users_controller.rb`\n\n点击此处查看代码图像\n\n```ruby\n\
  class UsersController < ApplicationController\n  def create\n    @user = User.new(user_params)\n\
  \    if @user.save\n      # 处理保存成功。\n    else\n      render 'new'\n    end\n  end\n\
  \n  private\n    def user_params\n      params.require(:user).permit(:name, :email,\
  \ :password, :password_confirmation)\n    end\nend\n```\n\n顺便提一下，`user_params` 方法多出的层缩进是为了在视觉上看出哪些方法定义在\
  \ `private` 之后。（经验表明这是一种明智的做法；在方法非常多的类中，很容易不小心定义私有方法，导致在无法对相应对象调用它时产生相当大的困惑。）\n\n\
  此时，注册表单已经可以工作了，至少在提交时不再产生错误这一点而言。另一方面，如图 7.17 所示，它对无效提交没有显示任何反馈（开发环境的调试区域除外），这可能会引起困惑。它实际上也没有真正创建一个新用户。我们将在\
  \ 第 7.3.3 节 修复第一个问题，并在 第 7.4 节 修复第二个。\n\n### 练习题\n\n购买任何 Rails Tutorial 后均可以在 railstutorial.org/solutions\
  \ 免费获取练习答案。查看他人的答案并记录自己的答案，请加入 learnenough.com/society 的 Learn Enough Society。\n\
  \n![image](img/image0132.jpeg)\n\n**图 7.17：** 使用无效信息提交的注册表单。\n\n1. 通过访问 URL `/users/new?admin=1`，确认\
  \ `admin` 属性出现在 `params` 调试信息中。\n\n### 7.3.3 注册错误消息\n\n在处理用户创建失败的最后一步，我们将添加有用的错误消息，以指示阻止注册成功的问题。方便的是，Rails\
  \ 会根据 User 模型的验证规则自动提供此类消息。例如，尝试尝试保存一个具有无效电子邮件地址且密码太短的用户：\n\n点击此处查看代码图像\n\n```bash\n\
  $ rails console\n>> user = User.new(name: \"Foo Bar\", email: \"foo@invalid\", password:\
  \ \"dude\", password_confirmation: \"dude\")\n>> user.save\n=> false\n>> user.errors.full_messages\n\
  => [\"Email is invalid\", \"Password is too short (minimum is 6 characters)\"]\n\
  ```\n\n这里的 `errors.full_messages` 对象（我们之前在 第 6.2.2 节 中简单提到过）包含一个错误消息数组。\n\n与上面的控制台话一样，列表\
  \ 7.18 中的失败保存会生成与 `@user` 对象相关的错误消息列表。为了在浏览器中显示这些消息，我们将在 `new` 页面渲染 `error-messages`\
  \ 局部，同时为每个条目添加 CSS 类 `form-control`（这对 Bootstrap 有特殊含义），如列表 7.20 所示。值得注意的是，这个 `error-messages`\
  \ 局部只是第一次尝试；最终版本出现在 第 13.3.2 节 中。\n\n**列表 7.20：** 在注册表单上显示错误消息的代码。\n\n`app/views/users/new.html.erb`\n\
  \n点击此处查看代码图像\n\n```erb\n<% provide(:title, 'Sign up') %>\n<h1>Sign up</h1>\n<div\
