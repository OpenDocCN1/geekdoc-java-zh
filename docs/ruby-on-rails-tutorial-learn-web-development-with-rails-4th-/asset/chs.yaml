  \ 的 Learn Enough。\n\n1. 删除 辅助方法 `logged_in?` 中的 `!`，并确认 Listing 8.23 中的测试为 `RED`。\n\
  2. 恢复 `!` 以恢复为 `GREEN`。\n\n#### 8.2.5 注册登录\n\n尽管我们的认证系统现在可以工作，但新注册的用户可能会感到困惑，因为他们默认没有登录。为了不强制用户在注册后立即登录，我们在注册时自动登录新用户。为了实现这种行为，我们只需要在\
  \ Users 的 create 操作中调用 `log_in`，如 Listing 8.25 所示。由于 Listing 8.13 中的包含，`log_in`\
  \ 方法在 Users 控制器中可用。\n\n**Listing 8.25:** 注册登录用户。\n\n```ruby\napp/controllers/users_controller.rb\n\
  \nclass UsersController < ApplicationController\n  def show\n    @user = User.find(params[:id])\n\
  \  end\n\n  def new\n    @user = User.new\n  end\n\n  def create\n    @user = User.new(user_params)\n\
  \    if @user.save\n      log_in @user\n      flash[:success] = \"Welcome to the\
  \ Sample App!\"\n      redirect_to @user\n    else\n      render 'new'\n    end\n\
  \  end\n\n  private\n\n  def user_params\n    params.require(:user).permit(:name,\
  \ :email, :password,\n      :password_confirmation)\n  end\nend\n```\n\n为了测试 Listing\
  \ 8.25 中的行为，我们可以向 Listing 7.33 中的测试添加一行来检查用户是否已登录。在这种背景下，定义一个 `is_logged_in?` 辅助方法来对应\
  \ Listing 8.18 中定义的 `logged_in?` 辅助方法是有用的，后者如果（测试）会话中存在 user id 则返回 `true`，否则返回\
  \ `false`（Listing 8.26）。（因为辅助方法在测试中不可用，我们无法像 Listing 8.18 那样使用 `current_user`，但\
  \ `session` 方法是可用的，所以我们使用它。）在这里使用 `is_logged_in?` 而不是 `logged_in?`，以便测试辅助方法和 Sessions\
  \ 辅助方法具有不同的名称，防止它们被混淆。\n\n\n\n\n\n# 13 例如，我曾经有一次测试套件，即使在不小心删除了 Sessions helper 中的主\
