  .center{\n  text-align: center;\n}\n```\n\n将 `center` 类与 `text-align: center` 属性关联。换句话说，`.center`\
  \ 中的点 `.` 表示该规则样式化一个类。（正如我们在 Listing 5.9 中看到的，井号 `#` 用于标识样式化 CSS id 的规则。）这意味着任何带有\
