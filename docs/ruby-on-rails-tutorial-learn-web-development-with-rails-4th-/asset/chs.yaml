  \ install` 命令可能需要几秒钟时间，但完成后，我们的应用程序就可以准备运行了。\n\n顺便说一下，当你运行 `bundle install` 时，可能会收到一条消息，说你需要先运行\
  \ `bundle update`。在这种情况下，你应该先运行 `bundle update`。（学习在事情没有完全按计划进行时不要恐慌，是技术老练的关键部分，你会惊讶地发现，这些“错误”消息往往包含了解决当前问题所需的确切指令。）\n\
  \n### 1.3.2 rails server\n\n得益于在节 1.3 中运行 `rails new` 以及在节 1.3.1 中运行 `bundle install`，我们已经有了一个可以运行的应用程序——但如何运行呢？幸运的是，Rails\
  \ 带有一个命令行程序（或称为*脚本*），它可以运行*本地*网络服务器来帮助我们开发应用程序。具体的命令取决于你使用的环境：在本地系统上，你只需要运行 `rails\
  \ server` (列表 1.6)，而在 Cloud9 上，你需要提供额外的*IP 绑定地址*和*端口号*，以告诉 Rails 服务器它可以使用哪个地址来让应用程序对外部世界可见\
  \ (列表 1.7)。`13 (Cloud9 使用特殊的*环境变量* `$IP` 和 `$PORT` 来动态分配 IP 地址和端口号。如果你想查看这些变量的值，请在命令行中输入\
  \ `echo $IP` 或 `echo $PORT`。)\n\n13。通常，网站运行在 80 端口，但这通常需要特殊权限，因此惯例是使用受限制较少的高位端口作为开发服务器。\n\
  \n如果你的系统抱怨缺少 JavaScript 运行时，请访问 GitHub 上的 `execjs` 页面查看可能的解决方案。我特别推荐安装 Node.js。\n\
  \n**列表 1.6：** 在本地机器上运行 Rails 服务器。\n\n点击此处查看代码图片\n\n***\n\n```bash\n$ cd ~/workspace/hello_app/\n\
  $ rails server\n=> Booting Puma\n=> Rails application starting on http://localhost:3000\n\
  => Run 'rails server -h' for more startup options\n=> Ctrl-C to shutdown server\n\
  ```\n\n***\n\n**列表 1.7：** 在云 IDE 上运行 Rails 服务器。\n\n点击此处查看代码图片\n\n***\n\n```bash\n\
  $ cd ~/workspace/hello_app/\n$ rails server -b $IP -p $PORT\n=> Booting Puma\n=>\
  \ Rails application starting on http://0.0.0.0:8080\n=> Run 'rails server -h' for\
  \ more startup options\n=> Ctrl-C to shutdown server\n```\n\n***\n\n无论你选择哪种方案，我都建议在第二个终端标签页中运行\
  \ `rails server` 命令，这样你仍然可以在第一个标签页中发布命令。在哪种情况下，`14` `图 1.6](#part0010.xhtml_list1_6)`\
  \ 和 `图 1.7](#part0010.xhtml_list1_7)`。`1.8` `图 1.9](#part0010.xhtml_list1_9)` `图\
  \ 1.10](#part0010.xhtml_list1_10)`。`1.11` `图 1.12](#part0010.xhtml_list1_12)`。`1.13`\
  \ `图 1.14](#part0010.xhtml_list1_14)`。\n\n\n\n\n顾名其义，控制器动作（controller actions）定义在控制器内部。我们将我们的动作命名为\
  \ `hello` 并将其放置在 `Application` 控制器中。事实上，此时 `Application` 控制器是我们拥有的唯一控制器，你可以通过运行查看当前控制器来验证这一点。（我们将在第\
  \ 2 章中开始创建自己的控制器。）列表 1.8 显示了 `hello` 的最终定义，它使用 `render` 函数返回 HTML 文本“hello, world!”。现在不用担心\
  \ Ruby 的语法；我们将在第 4 章中进行更深入的介绍。）\n\n点击此处查看代码图像\n\n```\n$ ls app/controllers/*_controller.rb\n\
  ```\n\n**列表 1.8：** 在 Application 控制器中添加一个 hello 动作。\n\n`app/controllers/application_controller.rb`\n\
  \n点击此处查看代码图像\n\n```\nclass ApplicationController < ActionController::Base\n  protect_from_forgery\
  \ with: :exception\n  def hello\n    render html: \"hello, world!\"\n  end\nend\n\
  ```\n\n定义好一个返回所需字符串的动作后，我们需要告诉 Rails 使用该动作而不是图 1.9 中的默认页面。为了做到这一点，我们将编辑 Rails 的\
  \ `router`（路由器），它位于图 1.10 中控制器的前端，并决定将来自浏览器的请求发送到哪里。（为了简单起见，我在图 1.10 中省略了路由器，但我们从第\
  \ 2.2.2 节开始将详细讨论它。）具体来说，我们想要更改默认页面，即 `root route`（根路由），它决定了在 `root URL` 上提供服务的页面。因为它是像\
  \ [`www.example.com/`](http://www.example.com/) 这样的地址的 URL（最后一个正斜杠后没有任何内容），所以根 URL\
  \ 通常被简称为 `/`（“斜”）。\n\n如列表 1.9 所示，Rails 路由文件（`config/routes.rb`）包含了一行注释，引导我们查看 Rails\
  \ 路由指南，该指南包含了如何定义根路由的说明。语法如下：\n\n点击此处查看代码图像\n\n```\nroot 'controller_name#action_name'\n\
  ```\n\n在本文中，控制器名称是 `application`，动作名称是 `hello`，这产生了列表 1.10 中所示的代码。\n\n**列表 1.9：**\
  \ 默认路由文件（已格式化以适应显示）。\n\n`config/routes.rb`\n\n点击此处查看代码图像\n\n```\nRails.application.routes.draw\
  \ do\n  # For details on the DSL available within this file,\n  # see http://rubyonrails.org/routing.html\n\
  end\n```\n\n**列表 1.10：** 设置根路由。\n\n`config/routes.rb`\n\n点击此处查看代码图像\n\n```\nRails.application.routes.draw\
  \ do\n  root 'application#hello'\nend\n```\n\n通过列表 1.8 和列表 1.10 中的代码，根路由按照要求返回“hello,\
  \ world!”（图 1.11）。Rails Tutorial 共享 URL 的基 URL 已从 `rails-tutorial-c9-mhartl.io`\
  \ 变为 `rails-tutorial-mhartl.users.io`，但在许多情况下截图是相同的，因此浏览器地址栏在某些图中会显示旧风格的 URL（例如图\
  \ 1.11）。这种是你你可以利用自己的技术水平来解决的微小差异（框 1）。\n\n### 练习\n\n购买任何 Rails Tutorial 后，可免费在 `railstutorial.org/solutions`\
