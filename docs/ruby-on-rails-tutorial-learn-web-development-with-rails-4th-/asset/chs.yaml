  \n还有两个紧密关联的细微之处需要处理。第一个细微之处是，尽管“注销”（Log out）链接只在登录后显示，但用户可能打开了指向该网站的多个浏览器窗口。如果用户在其中一个窗口中注销，从而将\
  \ `current_user` 设置为 `nil`，那么在第二个窗口中点击“注销”链接会导致错误，因为在 `log_out` 方法中执行了 `forget (current_user)`（列表\
  \ 9.12）。我们可以通过仅在用户已登录时才注销来避免这个问题。\n\n[12.] 感谢读者 Paulo Célio Júnior 指出这一点。\n\n第二个细微之处是，用户可能在多个浏览器（如\
