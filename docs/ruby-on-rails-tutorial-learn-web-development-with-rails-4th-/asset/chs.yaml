  \ `_test`。\n\n我们测试布局链接的计划涉及检查网站的 HTML 结构：\n\n1. 获取根路径（首页）。\n2. 验证渲染了正确的页面模板。\n3.\
  \ 检查指向首页、帮助页、关于页和联系页面的正确链接。\n\n列表 5.32 显示了我们如何使用 Rails 集成测试将这些步骤转换为代码，从 `assert_template`\
  \ 方法开始，以验证首页是否使用正确的视图渲染。\n\n16 一些开发者坚持认为单个测试不应该包含多个断言。我认为这种做法是不必要的复杂化，而且如果在每个测试之前需要执行共同任务，还会产生额外的开销。此外，一个编写良好的测试会讲述一个连贯的故事，将其拆分成各个部分会破坏叙事性。因此，我倾向于在测试中包含多个断言，依靠\
  \ Ruby（通过 minitest）来告诉我失败断言的具体行数。\n\n**列表 5.32：** 布局上链接的测试。绿色。\n\n`test/integration/site_layout_test.rb`\n\
