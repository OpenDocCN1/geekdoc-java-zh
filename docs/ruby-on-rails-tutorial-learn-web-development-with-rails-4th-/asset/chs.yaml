  \ assert_not duplicate_user.valid?\n  end\nend\n```\n\n在这里，我们对字符串使用了 `upcase` 方法（在节\
  \ 4.3.2 中曾简单提到过）。这个测试与最初的重复电子邮件测试逻辑相同，但使用的是大写的电子邮件地址。如果你觉得这个测试有点抽象，可以启动控制台：\n\n\
  点击此处查看代码图像\n\n```bash\n$ rails console --sandbox\n>> user = User.create(name: \"\
  Example User\", email: \"user@example.com\")\n>> user.email.upcase\n=> \"USER@EXAMPLE.COM\"\
  \n>> duplicate_user = user.dup\n>> duplicate_user.email = user.email.upcase\n>>\
  \ duplicate_user.valid?\n=> true\n```\n\n当然，`duplicate_user.valid?` 目前是 `true`，因为唯一性验证是大小敏感的，但我们希望它是\
