  3. 为首页的统计数据编写测试。*提示*：添加到列表 13.28 中的测试。为什么我们不需要测试资料页上的统计数据？\n\n#### 14.2.3 关注和粉丝页面\n\
  \n显示关注用户和粉丝的页面类似于用户资料页和用户索引页（第 10.3 节）的混合体，包含一个用户信息（包括粉丝统计数据）的侧边栏和一个用户列表。此外，我们会在侧边栏包含用户资料图像的网格。符合这些要求的原型图出现在图\
  \ 14.14（关注）和图 14.15（粉丝）。\n\n我们的第一步是让关注和粉丝链接工作起来。我们将遵循 Twitter 的做法，让这两个页面都需要登录。与之前的访问控制示例一样，我们将先编写测试，如列表\
  \ 14.24 所示。注意 `列表 14.24` 使用了表 14.2 中的具名路由。\n\n**列表 14.24：** 关注和粉丝页授权的测试。RED。\n\n\
  `test/controllers/users_controller_test.rb`\n\n点击此处查看代码图片\n\n* *\n\n```ruby\nrequire\
  \ 'test_helper'\nclass UsersControllerTest < ActionDispatch::IntegrationTest\n \
  \ def setup\n    @user = users(:michael)\n    @other_user = users(:archer)\n  end\n\
  \n  test \"should redirect when logged in\" do\n    get following_path(@user)\n\
  \    assert_redirected_to login_url\n  end\n\n  test \"should redirect when logged\
  \ in\" do\n    get followers_path(@user)\n    assert_redirected_to login_url\n \
  \ end\nend\n```\n\n* *\n\n实现中最棘手的部分是意识到我们需要在 `Users` 控制器中添加两个操作。根据列表 14.15 定义的路由，我们需要调用\
  \ `following` 和 `followers`。每个操作都需要设置标题、查找用户、获取分页的 `@user.following` 或 `@user.followers`\
  \ 然后渲染。结果出现在列表 14.25 中。\n\n![image](img/image133.jpeg)\n\n**图 14.14：** 关注页的原型图。\n\
  \n![image](img/image361.jpeg)\n\n**图 14.15：** 粉丝页的原型图。\n\n**列表 14.25：** `following`\
  \ 和 `followers` 操作。GREEN。\n\n`app/controllers/users_controller.rb`\n\n点击此处查看代码图片\n\
  \n* *\n\n```ruby\nclass UsersController < ApplicationController\n  before_action\
  \ :logged_in_user, only: [:index, :edit, :update, :destroy, :following, :followers]\n\
  \n  def following\n    @title = \"Following\"\n    @user = User.find(params[:id])\n\
  \    @users = @user.following.paginate(page: params[:page])\n    render 'show_follow'\n\
  \  end\n\n  def followers\n    @title = \"Followers\"\n    @user = User.find(params[:id])\n\
  \    @users = @user.followers.paginate(page: params[:page])\n    render 'show_follow'\n\
  \  end\n\n  private\n```\n\n正如我们在整个教程中所看到的，Rails 的惯例是隐式渲染对应方法的模板，例如在 `show` 方法结束时渲染\
  \ `show.html.erb`。相比之下，列表 14.25 中的两个操作都显式地调用了 `render`，在这种情况下是渲染一个名为 `show_follow`\
  \ 的视图，我们必须创建它。使用公共视图的原因是两种情况的 ERb 几乎相同，且列表 14.26 涵盖了它们。\n\n**列表 14.26：** 用于渲染关注和粉丝的\
  \ `show_follow` 视图。GREEN。\n\n`app/views/users/show_follow.html.erb`\n\n点击此处查看代码图片\n\
  \n* * *\n\n```erb\n<%= provide(:title, @title) %>\n<div class=\"row\">\n  <aside\
