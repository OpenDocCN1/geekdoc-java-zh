  \ 行，并确认生成的测试结果为**红色（RED）**。\n\n### 10.4 删除用户\n\n现在用户索引已经完成，只剩下一个标准的 REST 动作了：`destroy`。在本节中，我们将添加删除用户的链接（如图\
  \ 10.13 所示），并定义完成删除所需的 `destroy` 动作。但在之前，我们将先创建授权执行此操作的管理员类，即*管理员（admins）*。\n\n\
  #### 10.4.1 管理员用户\n\n我们将通过 User 模型中的一个布尔属性 `admin` 来识别具有特权的管理员用户，这将自动生成一个 `admin?`\
  \ 布尔方法，用于测试管理员状态。结果数据模型出现在图 10.14 中。\n\n如往常，我们通过迁移添加 `admin` 属性，并在命令行中指定类型为 `boolean`：\n\
  \n点击此处查看代码图片\n\n```bash\n$ rails generate migration add_admin_to_users admin:boolean\n\
  ```\n\n![image](img/image01255.jpeg)\n\n**图 10.13：** 带有删除链接的用户索引原型图。\n\n![image](img/image01934.jpeg)\n\
  \n**图 10.14：** 添加了 `admin` 布尔属性的 User 模型。\n\n迁移向 `users` 表添加了 `admin` 列，如列表 10.54\
  \ 所示。注意我们在 列表 10.54 中为 `add_column` 添加了参数 `default: false`，这意味着用户默认*不是*管理员。（如果没有\
  \ `default: false` 参数，`admin` 默认将将为 `nil`，这仍然是 `false`，所以这一步并非严格必要。不过，它更加显式，并且能向\
  \ Rails 和代码阅读者更清晰地传达我们的意图。）\n\n**列表 10.54：** 为用户添加布尔 `admin` 属性的迁移。\n\n```ruby\n\
  db/migrate/[timestamp]_add_admin_to_users.rb\n```\n\n点击此处查看代码图片\n\n***\n\n```ruby\n\
  class AddAdminToUsers < ActiveRecord::Migration[5.0]\n  def change\n    add_column\
  \ :users, :admin, :boolean, default: false\n  end\nend\n```\n\n***\n\n接下来，像往常一样执行迁移：\n\
  \n```bash\n$ rails migrate\n```\n\n正如预期的，Rails 识别出 `admin` 的布尔属性并自动添加了带问号的方法：\n\n\
  点击此处查看代码图片\n\n```bash\n$ rails console\n>> user = User.first\n>> user.admin?\n=>\
  \ false\n>> user.toggle!(:admin)\n=> true\n>> user.admin?\n=> true\n```\n\n在这里我们\
  \ `toggle!` 方法将属性从 `false` 切换为 `true`。\n\n作为最后一步，让我们更新种子数据，使第一个用户成为管理员（列表 10.55）。\n\
  \n**列表 10.55：** 具有管理员用户的种子代码。\n\n```ruby\ndb/seeds.rb\n```\n\n点击此处查看代码图片\n\n***\n\
  \n```ruby\nUser.create!(name: \"Example User\",\n             email: \"example@railstutorial.org\"\
  ,\n             password: \"foobar\",\n             password_confirmation: \"foobar\"\
  )\n\n99.times do |n|\n  name = Faker::Name.name\n  email = \"example-#{n}@railstutorial.org\"\
  \n  password = \"password\"\n  User.create!(name: name,\n              email: email,\n\
  \              password: password,\n              password_confirmation: password,\n\
  \              admin: true)\nend\n```\n\n***\n\n然后重置数据库：\n\n```bash\n$ rails db:migrate:reset\n\
  $ rails db:seed\n```\n\n## 重新回顾强参数\n\n你可能已经注意到列表 10.55](#part0019.xhtml_list10_55)\
  \ 通过在初始化哈中包含 `admin: true` 使用户成为管理员。这凸显了将对象暴露在野外的危险：如果我们直接从任意请求传递初始化哈，恶意用户可以发送如下\
  \ PATCH 请求：¹³\n\n13. curl 等命令行工具可以发出这种形式的 PATCH 请求。\n\n`patch /users/17?admin=1`\n\
  \n该请求会让用户 17 成为管理员，这可能是一个严重的安全漏洞。\n\n由于这种危险，只更新可以通过网页编辑的属性是至关重要的。正如第 7.3.2 节](#part0016.xhtml_07sec8）所述，这是通过在\
  \ `params` 哈希上调用 `require` 和 `permit` 使用*强参数*来实现的：\n\n点击此处查看代码图片\n\n```ruby\ndef\
  \ user_params\n  params.require(:user).permit(:name, :email, :password, :password_confirmation)\n\
  end\n```\n\n特别注意 `admin` 不在属性列表中。这就是防止任意用户获取应用程序权限的原因。由于其重要性，为任何不可编辑的属性编写测试是一个好主意，而为\
  \ `admin` 属性编写此类测试留给了练习题（第 10.4.1 节](#part0019.xhtml_ch10lev2sec13)）。\n\n\n\n\n\n\
  ## 列表 10.56: 测试 `admin` 属性是否被禁用。\n\n`test/controllers/users_controller_test.rb`\n\
  \n点击此处查看代码图片\n\n* * *\n\n```ruby\nrequire 'test_helper'\n\nclass UsersControllerTest\
  \ < ActionDispatch::IntegrationTest\n\n  def setup\n    @user       = users(:michael)\n\
  \    @other_user = users(:archer)\n  end\n\n  test \"在未登录时应重定向到更新操作\" do\n    patch\
  \ user_path(@user), params: { user: { name: @user.name, email: @user.email } }\n\
  \    assert_not flash.empty?\n    assert_redirected_to login_url\n  end\n\n  test\
  \ \"不应允许通过网页编辑 admin 属性\" do\n    log_in_as(@other_user)\n    assert_not @other_user.admin?\n\
  \    patch user_path(@other_user), params: {\n      user: { password: FILL_IN,\n\
  \      password_confirmation: FILL_IN,\n      admin: FILL_IN } }\n    assert_not\
  \ @other_user.FILL_IN.admin?\n  end\n\nend\n```\n\n* * *\n\n### 10.4.2 destroy 动作\n\
  \n完成 Users 资源所需的最后一步是添加删除链接和 `destroy` 动作。我们将首先在 users 索引页面上为每个用户添加删除链接，并限制只有管理员可以访问。生成的\
  \ `\"delete\"` 链接仅在当前用户为管理员时才会显示（见 列表 10.57）。\n\n**列表 10.57:** 用户删除链接（仅管理员可见）。\n\
  \n`app/views/users/_user.html.erb`\n\n点击此处查看代码图片\n\n* * *\n\n```erb\n<li>\n  <%=\
  \ gravatar_for user, size: 50 %>\n  <%= link_to user.name, user %>\n  <% if current_user.admin?\
  \ && !current_user?(user) %>\n    | <%= link_to \"delete\", user, method: :delete,\n\
  \      data: { confirm: \"You sure?\" } %>\n  <% end %>\n</li>\n```\n\n注意 `method:\
  \ :delete` 参数，它安排了链接发送必要的 DELETE 请求。我们还将每个链接封装在 `if` 语句中，以便只有管理员才能看到它们。我们管理员的结果显示在\
  \ 图 10.15 中。\n\n![image](img/image0104.jpeg) **图 10.15:** 带有删除链接的用户索引。\n\nWeb 浏览器无法原生发送\
  \ DELETE 请求，因此 Rails 使用 JavaScript 模拟了它们。这意味着如果用户禁用了 JavaScript，删除链接将无法工作。如果你必须支持不支持\
  \ JavaScript 的浏览器，可以使用表单和 POST 请求来伪造 DELETE 请求，这在没有 14 的情况下也可以运行。参见 Rails Cast 的“Destroy\
  \ Without JavaScript”。\n\n为了让删除链接生效，我们需要添加一个 `destroy` 动作（见 表 7），该动作会找到对应的用户并使用\
  \ Active Record 的 `destroy` 方法将其删除，最后重定向到用户索引页，如 列表 10.58 所示。由于用户必须登录才能删除，列表 10.58\
  \ 还向 `logged_in_user` 过滤器增加了 `:destroy`。\n\n**列表 10.58:** 添加可用的 `destroy` 动作。\n\n\
  `app/controllers/users_controller.rb`\n\n点击此处查看代码图片\n\n* * *\n\n```ruby\nclass UsersController\
  \ < ApplicationController\n  before_action :logged_in_user, only: [:index, :update,\
  \ :destroy]\n  before_action :correct_user, only: [:edit, :update]\n\n  def destroy\n\
  \    User.find(params[:id]).destroy\n    flash[:success] = \"User deleted\"\n  \
  \  redirect_to users_url\n  end\n\n  private\nend\n```\n\n注意 `destroy` 动作使用方法链将\
  \ `find` 和 `destroy` 合并为一行：\n\n点击此处查看代码图片\n\n```ruby\nUser.find(params[:id]).destroy\n\
  ```\n\n按照目前的构建，只有管理员可以通过网页删除用户，因为只有他们能看到删除链接，但仍然存在一个严重的安全漏洞：任何足够老练的攻击者都可以直接从命令行发出\
  \ DELETE 请求来删除任何用户。为了妥善地保护网站，我们还需要在 `destroy` 动作上进行访问控制，使得*只有*管理员才能删除用户。\n\n与 章节\
  \ 10.2.1 和 章节 10.2.2 所示，我们将使用 before 过滤器来执行访问控制，这次是限制对 `destroy` 动作的访问仅限管理员。生成的\
  \ `admin_user` before 过滤器出现在 列表 10.59 中。\n\n**列表 10.59:** 限制 `destroy` 动作为管理员的 before\
  \ 过滤器。\n\n`app/controllers/users_controller.rb`\n\n点击此处查看代码图片\n\n* * *\n\n```ruby\n\
  class UsersController < ApplicationController\n  before_action :logged_in_user,\
  \ only: [:index, :update, :destroy]\n  before_action :correct_user, only: [:edit,\
  \ :update]\n  before_action :admin_user, only: :destroy\n\n  private\n\n  # 确认管理员\n\
  \  def admin_user\n    redirect_to(root_url) unless current_user.admin?\n  end\n\
  end\n```\n\n### 练习\n\n练习题答案在购买任何 Rails Tutorial 后可以在 railstutorial.org 免费获取。要查看他人的答案并记录自己的答案，请加入\
  \ learnenough.com 的 Learn Enough Society。\n\n1. 作为管理员，通过网页界面删除几个示例用户。服务器日志中对应的条目是什么？\n\
