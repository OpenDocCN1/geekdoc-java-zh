  \ 13.4.1 节中的上传器是一个很好的起点，但它有很大的局限性。特别是，它对上传的文件没有强制任何限制条件，如果用户尝试上传大文件或无效的文件类型，就会导致问题。为了修复这一缺陷，我们将在服务器端和客户端（即浏览器）都对图片大小和格式添加验证。\n\
  \n第一个图片验证（限制仅可上传有效的图片类型）出现在 `CarrierWave` 上传器本身中。生成的代码（在生成的上传器中显示为注释掉的建议）验证图片文件名是否以有效的图片扩展名（PNG、GIF\
  \ 和 JPEG 的两种变体）结尾，如列表 13.64 所示。\n\n**列表 13.64:** 图片格式验证。\n`app/uploaders/picture_uploader.rb`\n\
  \n点击此处查看代码图片\n\n* * *\n\n```ruby\nclass PictureUploader < CarrierWave::Base\n  storage\
  \ :file\n\n  # 覆盖存储文件的目录\n  def store_dir\n    \"uploads/#{model.class.underscore}/#{model.id}\"\
  \n  end\n\n  # 添加允许上传的扩展名白名单\n  def extension_white_list\n    %w(jpg jpeg png)\n\
  \  end\nend\n\n\n第二个验证（控制图片大小）出现在 micropost 模型中。与之前的验证不同，文件大小验证没有对应的 Rails 验证器。因此，验证图片需要定义一个自定义验证，我们命名为\
  \ `picture_size`，如[列表 13.65]所示。\n\n**列表 13.65:** 为图片添加验证。\n`app/models/micropost.rb`\n\
  \n点击此处查看代码图片\n\n* * *\n\n```ruby\nclass Micropost < ApplicationRecord\n  belongs_to\
  \ :user\n  default_scope -> { order(created_at: :desc) }\n  mount_uploader :picture,\
  \ PictureUploader\n  validates :user_id, presence: true\n  validates :content, presence:\
  \ true, length: { maximum: 140 }\n  validate :picture_size\n\n  private\n\n  # 验证上传图片的大小\n\
  \  def picture_size\n    if picture.size > 5.megabytes\n      errors.add(:picture,\
  \ \"should be less than 5MB\")\n    end\n  end\nend\n```\n\n此自定义验证安排调用与符号（`:picture_size`）对应的方法。在\
  \ `picture_size` 内部，我们将自定义错误消息添加到 `errors` 集合中（在第 6.2.2 节中短暂出现过），在本例中限制为 5 兆（使用之前在框\
  \ 9.1 中看到的语法）。\n\n为了配合列表 13.64 和列表 13.65 中的验证，我们将在客户端对上传图片进行两个检查。我们首先通过在 `file_field`\
  \ 输入标签中使用 `accept` 参数来镜像格式验证：\n\n```erb\n<%= f.file_field :picture, accept: 'image/jpeg,image/gif,image/png'\
  \ %>\n```\n\n\n\n\n\n有效格式包含列表 13.64 中验证接受的 MIME 类型。\n\n接下来，我们将包含少量的 JavaScript（更具体地说，是\
  \ jQuery），当用户尝试上传过大的图片时发出警报（这可以防止意外的耗时上传并减轻服务器负载）：\n\n点击此处查看代码图片\n\n```javascript\n\
  $('#micropost_picture').bind('change', function() {\n  var size_in_megabytes = this.files[0].size/1024/1024;\n\
  \  if (size_in_megabytes > 5) {\n    alert('Maximum file size is 5MB. Please choose\
  \ a smaller file.');\n  }\n});\n```\n\n虽然 jQuery 不是本书的重点，但你可能推断出上述代码正在监控包含 CSS ID\
  \ `micropost_picture` 的页面元素（如哈希标记 `#` 所示），它是列表 13.60 中微推特表单的 ID。（弄清楚这一点的方法是按 Ctrl+\
  \ 点击并使用浏览器的 Web 检查器。）当具有该 CSS ID 的元素发生变化时，jQuery 函数就会触发，如果文件太大，就会调用 `alert` 方法。[17]](#part0022.xhtml_ch13en17)\n\
  \n17. 想要学习如何进行此类操作，你可以像我一样这样做：在 Google 上搜索“javascript maximum file size”等关键词，直到在\
  \ Stack Overflow 上找到相关内容。\n\n添加这些额外检查的结果出现在列表 13.66 中。[18]](#part0022.xhtml_ch13en18)\n\
  \n18. 更高级的 jQuery 用户可能会将大小检查放在单独的 JavaScript 函数中，但由于这不是一本 JavaScript 教程，列表 13.66\
  \ 中的代码对于我们的目的来说足够了。\n\n**列表 13.66：** 使用 jQuery 检查文件大小。\n\n`app/views/shared/_micropost_form.html.erb`\n\
  \n点击此处查看代码图片\n\n* * *\n\n```erb\n<%= form_for(@micropost, html: { multipart: true\
  \ }) do |f| %>\n  <%= render 'shared/error_messages', object: f.object %>\n  <div\
