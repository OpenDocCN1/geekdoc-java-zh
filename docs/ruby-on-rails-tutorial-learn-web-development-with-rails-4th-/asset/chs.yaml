  \n#### 14.2.5 一个带有 Ajax 的可用关注按钮\n\n尽管我们的用户关注实现目前已经是完整的，但在开始处理状态流（status feed）之前，我们还有一点润色需要添加。你可能已经注意到第\
  \ 14.2.4 节中 Relationships 控制器中的 `create` 和 `destroy` 操作只是简单地重定向*回*原始个人资料。换句话之，用户从另一个用户的个人页面开始，关注该用户，然后立即被重定向回原始页面。询问用户为什么需要离开该页面是合理的。\n\
  \n这正是 *Ajax* 解决的问题，它允许网页在不离开页面的情况下向服务器异步发送请求。⁸由于在网页表单中添加 Ajax 是一种做法，Rails 让 Ajax\
  \ 的实现变得简单。事实上，更新关注/取消关注的表单部分组件（partials）是轻而举的：只需将\n\n8. 因为它是 asynchronous JavaScript\
  \ and XML*（异步 JavaScript 和 XML）的缩写，Ajax 有时会被误写为“AJAX”，尽管原文全文拼写为“Ajax”。将 `form_for`\
  \ 改为 `form_for ..., remote: true`，Rails 就会自动使用 Ajax。更新后的部分组件出现在列表 14.34 和列表 14.35\
  \ 中。\n\n**列表 14.34：** 使用 Ajax 关注用户的表单。\n\n```app/views/users/_follow.html.erb```\n\
  \n点击点击此处查看代码图像\n\n* * *\n\n```erb\n<%= form_for(..., remote: true) do |f| %>\n \
  \ <%= f.submit \"Follow\" %>\n<% end %>\n```\n\n**列表 14.35：** 使用 Ajax 取消关注用户的表单。\n\
  \n```app/views/users/_unfollow.html.erb```\n\n点击点击此处查看代码图像\n\n* * *\n\n```erb\n\
  <%= form_for(..., method: :delete, remote: true) do |f| %>\n  <%= f.submit \"Unfollow\"\
  \ %>\n<% end %>\n```\n\n\n\n\n列表 14.36 中的操作支持**优雅降级**，这意味着它们在禁用了 JavaScript 的浏览器中也能正常工作（尽管需要进行少量的配置，如\
  \ 列表 14.37 所示）。\n\n**列表 14.37：** 表单提交优雅降级所需的配置。\n\n```ruby\nconfig/application.rb\n\
  ```\n\n点击此处查看代码图片\n\n* * *\n\n```ruby\nrequire File.expand_path('../boot', __FILE__\
  \ )\n\n.\n.\n.\n\nmodule SampleApp\n  class Application < Rails::Application\n \
  \   .\n    .\n    .\n    # 在远程表单中包含身份验证令牌\n    config.action_view.embed_authenticity_token_in_remote_forms\
  \ = true\n  end\nend\n```\n\n* * *\n\n另一方面，当启用 JavaScript 时，我们尚未做出恰当的响应。在 Ajax 请求的情况下，Rails\
  \ 会自动调用与操作同名的*嵌入 Ruby 的 JavaScript*（`.js.erb`）文件，例如 `create.js.erb` 或 `destroy.js.erb`。正如你可能猜到的，此类文件允许我们将\
  \ JavaScript 和嵌入 Ruby 混合使用以对当前页面执行操作。我们需要创建并编辑这些文件，以便在用户关注或取消关注时更新个人资料页。\n\n在 JS-ERb\
  \ 文件内部，Rails 自动提供了 jQuery JavaScript 助手，用于使用文档对象模型（DOM）操作页面。jQuery 库（我们在 第 13.4.2\
  \ 节 中简要介绍过）提供了许多操作 DOM 的方法，但在这里我们只需要两种。首先，我们需要了解美元符号语法，以便根据其唯一的 CSS id 访问 DOM 元素。例如，要操作\
  \ `follow_form` 元素，我们将使用语法：\n\n```javascript\n$(\"#follow_form\")\n```\n\n（回想 列表\
  \ 14.19，这是一个包裹了表单的 `div`，而不是表单本身。）这种语法受到 CSS 的启发，使用 `#` 符号表示 CSS id。正如你可能猜到的，jQuery\
  \ 像 CSS 一样使用点 `.` 来操作 CSS 类。\n\n我们需要的第二个方法是 `html`，它用参数的内容更新相关元素内部的 HTML。例如，要将整个关注表单替换为字符串\
  \ `\"foobar\"`，我们将写：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#follow_form\").html(\"\
  foobar\")\n```\n\n与纯 JavaScript 文件不同，JS-ERb 文件允许使用嵌入 Ruby，我们在 `create.js.erb` 文件中应用了它，使用\
  \ `unfollow` 局部视图更新关注表单（成功关注后应该显示的内容），并更新粉丝计数。结果显示在 列表 14.38 中。这使用了 `escape_javascript`\
  \ 方法，在 JavaScript 文件中插入 HTML 时需要该方法来转义结果。\n\n**列表 14.38：** 用于创建关系的 JavaScript 嵌入\
  \ Ruby。\n\n```javascript\napp/views/relationships/create.js.erb\n```\n\n点击此处查看代码图片\n\
  \n* * *\n\n```javascript\n$(\"#follow_form\").html(\"<%= escape_javascript(render('users/unfollow'))\
  \ %>\");\n$(\"#followers\").html('<%= @user.followers.count %>');\n```\n\n* * *\n\
  \n注意行末分号的存在，这是语法源自 ALGOL 的语言的特征。\n\n`destroy.js.erb` 文件与之类似 (列表 14.39）。\n\n**列表\
