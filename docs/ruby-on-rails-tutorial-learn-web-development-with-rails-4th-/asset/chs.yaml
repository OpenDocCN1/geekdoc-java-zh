  \n此时此时，我们的测试套件应该是**绿色**的：\n\n**列表 10.18：绿色**\n\n```bash\n$ rails test\n```\n\n尽管我们的测试套件现在通过了，但我们还没有完成置前过滤器，因为即使我们移除安全模型，该套件仍然是**绿色**的，你可以通过注释掉它来验证（列表\
  \ 10.19）。这是一件坏事——在我们希望测试套件捕获的所有回归中，一个巨大的安全漏洞可能是第 1 号，因此列表 10.19 中的代码应该是**红色**的。让我们写一些测试来安排这种情况。\n\
  \n**列表 10.19：** 注释掉置前过滤器以测试我们的安全模型。**绿色**\n\n`app/controllers/users_controller.rb`\n\
