  >> end\n```\n\n***\n\n## 4.2.5 返回标题辅助方法\n\n我们现在可以理解来自列表 4.2 的 `full_title` 辅助方法⁶，该方法在列表\
  \ 4.11 中带有注释的形式出现。\n\n6. 那么，我们仍然会有*一个*事情还不理解，那就是 Rails 如何将这一切整合在一起的：将 URL 映射到操作、使\
