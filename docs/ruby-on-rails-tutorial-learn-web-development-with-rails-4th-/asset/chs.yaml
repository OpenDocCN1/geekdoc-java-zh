  \ learnenough.com/society 的 Learn Enough Society。\n\n1. 在生产应用上创建几个用户。\n2. 为第一个用户创建几条生产级微博客。\n\
  3. 通过尝试创建一个内容超过 140 个字符的微博客，确认列表 2.13 中的验证在生产应用上有效。\n\n## 2.4 结论\n\n我们现在已经完成了对 Rails\
  \ 应用的高级概述。在本章中开发的玩具应用既有许多优点，也有许多缺点。\n\n### 优点\n\n- Rails 的高级概述\n- MVC 模式介绍\n- 初次体验\
  \ REST 架构\n- 开始数据建模\n- 生产环境中的基于数据库的实时 Web 应用\n\n### 缺点\n\n- 没有自定义布局或样式\n- 没有静态页面（如“首页”或“关于我们”）\n\
  - 没有用户密码\n- 没有用户头像\n- 没有登录功能\n- 没有安全性\n- 没有自动的用户/微博客关联\n- 没有“关注”或“被关注”的概念\n- 没有微博客流\n\
  - 没有有意义的测试\n- 没有真正的理解\n\n本教程的其余部分将致力于在优点的基础上消除缺点。\n\n#### 2.4.1 我们在本章中学了什么\n\n-\
  \ Scaffolding（脚手架）会自动创建代码来对数据建模并通过 Web 与其交互。\n- Scaffolding 有于快速上手，但不利于理解。\n- Rails\
  \ 使用模型-视图-控制器（MVC）模式来构建 Web 应用程序。\n- 根据 Rails 的解释，REST 架构包含了一组标准的 URL 和控制器动作，用于与数据模型交互。\n\
  - Rails 支持数据验证，可以对数据模型属性的值设置约束。\n- Rails 带有内置函数，用于定义不同数据模型之间的关联。\n- 我们可以使用 Rails\
  \ console 在命令行中与 Rails 应用交互。\n\n## 第 3 章 大多数静态页面\n\n在本章中，我们将开始开发一个专业级的示例应用，它将作为本教程其余部分的示例。虽然示例应用最终将拥有用户、微博客以及完整的登录身份验证框架，但我们将从一个看似有限的话题开始：创建静态页面。尽管看起来简单，但制作静态页面是一项极具指导意义的练习，充满了深意——这是我们初创应用的完美开始。\n\
  \n尽管 Rails 是为构建基于数据库的动态网站而设计的，它也非常擅长创建使用原始 HTML 文件可能创建的静态页面。事实上，即使使用 Rails 创建静态页面也有明显的优势：我们可以轻松地添加少量的动态内容。在本章中我们将学习如何。在此过程中，我们将尝试自动化测试，这将让我们对代码的正确性更有信心。此外，良好的测试套件将允许我们放心地重构代码，在不改变功能的情况下改变形式。\n\
  \n### 3.1 示例应用设置\n\n与第 2 章中一样，在开始之前，我们需要创建一个新的 Rails 项目，这次命名为 `sample_app`，如列表 3.1\
  \ 所示。¹\n\n1.)。（只要你已经将相应的仓库推送到 Bitbucket，你就可以随时恢复它们。）\n\n**列表 3.1：** 生成一个新的示例应用。\n\
