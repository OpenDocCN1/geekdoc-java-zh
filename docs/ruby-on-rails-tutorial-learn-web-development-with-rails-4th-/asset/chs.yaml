  \ 邮件列表 27，这将确保你收到关于 *Ruby on Rails*™ *Tutorial* 的优先更新（以及优惠代码）。\n\n#### 1.6.1 本章学到了什么\n\
  \n• Ruby on Rails 是一个用 Ruby 语言编写的 Web 开发框架。\n• 使用预配置的云环境安装 Rails、生成应用程序并编辑生成的文件是非常简单的。\n\
  • Rails 自带名为 `rails` 的命令行工具，可以生成新应用程序 (`rails new`) 并运行本地服务器 (`rails server`)。\n\
  • 我们添加了控制器 action 并修改了根路由，创建一个“你好世界”应用程序。\n• 通过 Git 对应用程序源码进行版本控制并将代码推送到 Bitbucket\
  \ 的私有仓库，在防止数据丢失的同时开启了协作。\n• 我们使用 Heroku 将应用程序部署到生产环境中。\n\n## 第 2 章 玩具应用\n\n在本章中，我们将开发一个玩具演示应用程序来展示\
  \ Rails 的威力。其目的是。\n\n### 2.1 规划应用程序\n\n在本节中，我们将概述玩具的计划。如第 1.3 节所示，我们首先使用 `rails\
  \ new` 特定版本号生成应用程序：\n\n点击此处查看代码图像\n\n```\n$ cd workspace\n$ rails 5.0.0 new toy_app\n\
  $ cd toy_app\n```\n\n\n\n\n```ruby\ngem 'web-console', '3.1.1'\ngem 'listen', '3.0.8'\n\
  gem 'spring', '1.7.2'\ngem 'spring-watcher-listen', '2.0.0'\nend\n\ngroup :production\
  \ do\n  gem 'pg', '0.18.4'\nend\n```\n\n# Windows 不包含 zoneinfo 文件，因此请打包 tzinfo-data\
  \ gem\n\n`gem 'tzinfo-data', platforms: [:mingw, :mswin, :x64_mingw, :jruby]`\n\n\
  请注意列表 2.1 与列表 1.14 相同。\n\n正如第 1.5.1 节所示，我们将使用 `--without production` 选项在抑制生产环境 gem\
  \ 安装的同时安装本地 gem：\n\n点击此处查看代码\n\n```bash\n$ bundle install --without production\n\
  ```\n\n正如第 1.3.1 节所示，你可能还需要运行 `bundle update`（框框 1.1）。\n\n最后，我们将使用 Git 对这个示例应用进行版本控制：\n\
  \n点击此处查看代码\n\n```bash\n$ git init\n$ git add -A\n$ git commit -m \"Initialize repository\"\
  \n```\n\n你还应该通过点击 Bitbucket 上的“Create”按钮创建一个新仓库（图 2.1），然后推送到远程仓库：\n\n点击此处查看代码\n\n\
  ```bash\n$ git remote add origin git@bitbucket.org:<username>/toy_app.git\n$ git\
  \ push -u origin --all\n```\n\n最后，尽早部署永远为时不早，我建议遵循第 1.3.4 节中相同的“hello, world!”步骤进行，如列表\
  \ 2.2 和列表 2.3 所示。\n\n**列表 2.2：** 在 Application 控制器添加一个 `hello` action。\n\napp/controllers/application_controller.rb\n\
  点击此处查看代码\n\n```ruby\nclass ApplicationController < ActionController::Base\n  protect_from_forgery\
  \ with: :exception\n  def hello\n    render html: \"hello, world!\"\n  end\nend\n\
  ```\n\n![image](img/image1674.jpeg)\n**图 2.1：** 在 Bitbucket 上创建示例应用。\n\n**列表 2.3：**\
  \ 设置根路由。\nconfig/routes.rb\n点击此处查看代码\n\n```ruby\nRails.application.routes.draw do\n\
  \  root 'application#hello'\nend\n```\n\n然后提交更改并推送到 Heroku：\n\n点击此处查看代码\n\n```bash\n\
  $ git commit -am \"Add hello\"\n$ heroku create\n$ git push heroku master\n```\n\
