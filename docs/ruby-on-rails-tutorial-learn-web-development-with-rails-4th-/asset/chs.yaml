  \n![image](img/image01807.jpeg)\n\n**图 11.8：** 生产环境中的成功账户激活。\n\n### 11.5 总结\n\n\
  随着账户激活功能的添加，我们示例应用程序的注册、登录和注销机制几乎完成。剩下的唯一重要功能是允许用户在忘记密码时重置密码。正如我们在 第 12 章 中看到的，密码重置与账户激活有许多相似之处，这意味着我们将能够机会充分利用在第\
  \ 11 章](#part0020.xhtml_ch11) 中中学的知识。不过开头是不同的：与账户激活不同，实现密码重置需要修改我们的一个视图并添加两个新表单（用于处理电子邮件和新密码的提交）。\n\
  \n1. 本章除了使用了 Listing 11.6 中的邮件生成器外，与其他章节相互独立，但它与 第 11 章 非常相似，因此如果你先看了该章节，将会容易得多。\n\
  \n#### 11.5.1 本章学到的知识\n\n• 与会一样，尽管账户激活不是 Active Record 对象，也可以建模为资源。\n• Rails 可以生成\
  \ Action Mailer action 和视图来发送邮件。\n• Action Mailer 同时支持纯文本和 HTML 邮件。\n• 与普通的 action\
  \ 和视图一样，在 mailer action 中定义的实例变量在 mailer 视图中是可用的。\n• 账户激活使用生成的令牌为激活用户创建一个唯一的 URL。\n\
  • 账户激活使用哈希后的激活摘要（digest）来安全地识别有效的激活请求。\n• 邮件测试和集成测试对于验证 User mailer 的行为都有用。\n• 我们可以使用\
  \ SendGrid 在生产环境中发送邮件。\n\n## 第 12 章 密码重置\n\n在 第 11 章 中完成账户激活（并验证了用户的电子邮件地址）后，我们现在可以很好地实现密码重置，从而处理用户忘记密码的常见情况。¹\
  \ 正如我们将看到的，许多步骤与账户激活相似，我们将有多次机会应用在 第 11 章 中中学到的。。不过开头有所不同：与账户激活不同，实现密码重置既需要修改我们的一个视图，需要两个新表单（用于处理电子邮件和新密码的提交）。\n\
  \n1. 本章除了使用了 Listing 11.6 中的邮件生成器外，与其他章节相互独立，但它与 第 11 章 高度并行，因此如果你先看了该章节，将会容易得多。\n\
  \n在编写任何代码之前，让我们先拟出重置密码的预期序列。我们首先在示例应用程序的登录表单中添加“忘记密码”链接（图 12.1）。“忘记密码”链接将指向带有表单的页面，该表单接收电子邮件地址并发送一封密码重置链接的邮件（图\
  \ 12.2）。重置链接将指向一个重置密码的表单，如 图 12.3 所示。\n\n如果你跟着 第 11 章，你已经有了用于密码重置的邮件，它是在 Section\
  \ 11.2 (Listing 11.6) 中生成的。在本节中，我们将通过为密码重置添加资源和数据模型来完成准备工作（第 12.1 节），以配合邮件使用。我们将在\
  \ 第 12.3 节 中实现实际密码重置。\n\n![image](img/image1980.jpeg)\n\n**图 12.1：** “忘记密码”链接的草图。\n\
  \n与账户激活类似，我们的计划创建一个密码重置资源，每个密码重置由重置令牌和相应的摘要组成。主要序列如下：\n\n1. 当用户请求重置密码时，通过提交的电子邮件地址查找用户。\n\
  2. 如果数据库中该电子邮件，生成重置令牌和相应的摘要。\n3. 将摘要保存到数据库，然后向用户发送一封包含重置令牌和用户电子邮件的邮件。\n4. 当用户点击链接时，通过电子邮件地址查找用户，并通过与摘要比对来验证令牌。\n\
  5. 如果验证通过，向用户展示更改密码的表单。\n\n![image](img/image01562.jpeg)\n\n**图 12.2：** “忘记密码”表单的草图。\n\
  \n### 12.1 密码重置资源\n\n与会话 (第 8.1 节) 和账户激活 (第 11 章)一样，我们将密码重置建模为资源，尽管它们不会与 Active\
  \ Record 模型关联。相反，我们将相关数据（包括重置令牌）直接包含在 User 模型中。\n\n![image](img/image0163.jpeg)\n\
  \n**图 12.3：** 重置密码表单的草图。\n\n\n\n\n[content]\n由于我们将密码重置视为一种资源，因此我们将通过标准的 REST URL\
  \ 与之交互。与仅需要 `edit` 动作的激活链接不同，在这种情况下，我们将渲染 `new` 和 `edit` 表单来用于操作密码重置，以及创建和更新这些重置，因此我们最终总共将使用四个\
  \ RESTful 路由。\n\n像往常一样，我们将为新功能创建一个主题分支：\n\n点击此处查看代码图片\n\n```\n$ git checkout -b\
  \ password-reset\n```\n\n#### 12.1.1 密码重置控制器\n\n我们的第一步是为 `PasswordResets` 资源生成一个控制器，在这种情况下，根据上述讨论，同时创建\
  \ `new` 和 `edit` 动作：\n\n点击此处查看代码图片\n\n```\n$ rails generate controller PasswordResets\
  \ new edit --no-test-framework\n```\n\n注意，我们包含了一个跳过生成测试的标记。这是因为我们不需要控制器测试，而是倾向于基于第\
  \ 11.3.3 节中的集成测试进行构建。\n\n由于我们需要创建新的密码重置（图 12.2）以及通过更改 User 模型中的密码来更新它们（图 12.3），因此我们需要为\
  \ `new`、`create`、`edit` 和 `update` 路由。我们可以通过列表 12.1 所示的 `resources` 行来安排它。\n\n**列表\
  \ 12.1：** 为密码重置添加资源。\n\n`config/routes.rb`\n\n点击此处查看代码图片\n\n```\nRails.application.routes.draw\
