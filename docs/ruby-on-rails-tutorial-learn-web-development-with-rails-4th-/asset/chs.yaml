  \ 的 Learn Enough Society。\n\n![image](img/image01330.jpeg)\n\n**图 7.18：** 错误消息的注册失败。\n\
  \n1. 通过将密码最小长度更改为 5，确认错误消息也会自动更新。\n2. 未提交的注册表单上的 URL（图 7.12）与提交的注册表单的 URL（图 7.18）相比如何？为什么它们不匹配？\n\
  \n#### 7.3.4 无效提交测试\n\n在具有自动化测试能力的强大 框架出现之前，开发者必须手动测试表单。例如，为了手动测试注册页面，我们需要在浏览器中访问该页面，然后交替提交无效和有效数据，并在每情况下验证应用程序的行为正确。此外，每当应用程序更改时，我们都必须重复此过程。这个过程既痛苦又容易出错。\n\
  \n幸运的是，通过 Rails 我们可以编写测试来自动化表单测试。在本节中，我们将编写这样一个测试来验证在无效表单提交时的正确行为；在第 7.4.4 节中，我们将编写相应的测试。\n\
  \n开始，我们首先为注册生成一个集成测试，命名为 `signup`（遵循资源的命名约定）：点击此处查看代码图像\n\n```bash\n$ rails generate\
  \ integration signup\n```\n\n这创建了 `test/integration/signup_test.rb`，我们将在第 7.4.4\
  \ 节中使用它。\n\n我们测试的主要目的是验证点击注册不会创建用户。（为错误消息编写测试被留作了一个练习。）\n\n```ruby\ntest \"signup\
