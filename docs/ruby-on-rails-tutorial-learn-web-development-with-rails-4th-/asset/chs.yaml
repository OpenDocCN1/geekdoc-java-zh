  \ 方法进行此更改，并通过运行测试套件验证其是否正常工作。\n\n### 11.2 账户激活邮件\n\n数据建模完成后，我们现在准备好添加发送账户激活邮件所需的代码了。方法是使用\
  \ Action Mailer 库添加一个 `User` mailer（邮件器），我们将在 Users 控制器的 `create` 中使用它来发送带有激活链接的邮件。Mailer\
  \ 的结构与控制器动作非常相似，邮件模板定义为视图。这些模板将包含带有激活令牌的链接以及与待激活账户关联的邮箱地址。\n\n#### 11.2.1 邮件器模板\n\
  \n与模型和控制器一样，我们可以使用 `rails generate` 生成邮件器，如 列表 11.6 所示。\n\n**列表 11.6:** 生成 User\
  \ mailer。\n\n点击此处查看代码图片\n\n* *\n\n```bash\n$ rails generate mailer UserMailer account_activation\
  \ password_reset\n```\n\n* *\n\n除了必要的 `account_activation` 方法外，列表 11.6 还生成我们在 第\
  \ 12 章 中需要的 `password_reset` 方法。列表 11.6 中的命令还为每个 mailer 生成了两个视图模板，一个用于纯文本邮件，一个用于\
  \ HTML。对于账户激活 mailer，它们显示为 列表 11.7 和 列表 11.8 中处理相应的密码重置模板。）\n\n**列表 11.7:** 生成的账户激活文本。\n\
  \n`app/views/user_mailer/account_activation.text.erb`\n\n点击此处查看代码图片\n\n* *\n\n```erb\n\
  UserMailer#account_activation\n<%= @greeting %>, find me in app/views/user_mailer/account_activation.text.erb\n\
  ```\n\n\n\n\n\n与普通视图一样，我们可以使用嵌入式 Ruby 来自定义模板视图——在这种情况下，通过名称问候用户并包含一个指向自定义激活链接的链接。我们的计划是通过电子邮件地址找到用户，然后验证激活令牌（token），因此链接需要同时包含电子邮件和令牌。由于我们正在使用\
  \ `Account Activations` 资源对激活进行建模，令牌本身可以作为列表 11.1 中定义的具名路由的参数出现：\n\n点击此处查看代码图片\n\
  \n```\nedit_account_activation_url(@user.activation_token, ...)\n```\n\n回想一下\n\n\
  `edit_user_url(user)`\n\n会生成如下格式的 URL：\n\n点击此处查看代码图片\n\n[`www.example.com/users/1/edit`](http://www.example.com/users/1/edit)\n\
  \n相应的账户激活链接的基 URL 将如下所示：\n\n点击此处查看代码图片\n\n[`www.example.com/account_activations/q5lt38hQDc_959PVoo6b7A/edit`](http://www.example.com/account_activations/q5lt38hQDc_959PVoo6b7A/edit)\n\
  \n这里的 `q5lt38hQDc_959PVoo6b7A` 是由 `new_token` 方法生成的 URL 安全基 64 字符串（列表 9.2），它的作用与\
  \ `/users/1/edit` 中的用户 ID 相同。特别地，在 `Activations` 控制器的 `edit` 中，令牌将作为 `params[:id]`\
  \ 可用于 `params` 哈希表中。\n\n为了同时也包含电子邮件，我们需要使用查询参数，查询参数在 URL 中显示为位于问号后面的键值对：⁵\n\n5.\
  \ URL 可以包含多个查询参数，由多个用连接符 `&` 分隔的键值对组成，例如 `/edit?name=Foo%20Bar&email=foo%40example.com`。\n\
  \n点击此处查看代码图片\n\n```\naccount_activations/q5lt38hQDc_959PVoo6b7A/edit?email=foo%40example.com\n\
  ```\n\n注意，电子邮件地址中的 @ 显示为 `%40`，即它被“转义”了，以确保 URL 的有效性。在 Rails 中设置查询参数的方法的方法是在具名路由中包含一个哈希：\n\
  \n点击此处查看代码图片\n\n```\nedit_account_activation_url(@user.activation_token, email:\
  \ @user.email)\n```\n\n当用这种方式使用具名路由定义查询参数时，Rails 会自动转义任何特殊字符。生成的电子邮件地址在控制器中也会自动取消转义，并可以通过\
  \ `params[:email]` 获取。\n\n使用列表 11.12 定义的 `@user` 实例变量，我们可以使用具名的 edit 路由和嵌入式 Ruby\
  \ 创建必要的链接，如列表 11.13 和列表 11.14 所示。注意，列表 11.14 中的 HTML 模板使用了 `link_to` 方法来构建有效的链接。\n\
