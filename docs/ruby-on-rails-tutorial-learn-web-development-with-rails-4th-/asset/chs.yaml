  \n##### Ruby 版本\n\n在部署到 Heroku 时，你可能会收到如下警告信息：\n\n```text\nWARNING: 你没有在 Gemfile\
  \ 中声明 Ruby 版本\n要设置 Ruby 版本请在 Gemfile 中添加此行：\nruby '2.1.5'\n```\n\n经验表明，在教程水平上，包含显式\
  \ Ruby 版本的成本大于其微不足道的收益，因此你现在可以忽略此警告。尽管如此，你应该记住，如果你将来在 Heroku 上运行任务关键型应用程序，建议在 `Gemfile`\
  \ 中指定精确的 Ruby 版本，以确保开发和生产环境之间的最大兼容性。\n\n15. 例如，曾有一个 Heroku 要求 Ruby 2.1.4，所以我花了几个小时尝试在本地机器上安装\
  \ Ruby 2.1.4，结果发现前一天发布了 Ruby 2.1.5。随后尝试安装 Ruby 2.1.5 也失败了。\n\n##### 练习题\n\n练习题可以通过购买任何\
  \ Rails Tutorial 在 railutorial.org/solutions 免费获取。查看他人的答案并记录自己的答案，请通过 learnenough.com/society\
  \ 加入 Learn Enough Society。\n\n1. 在浏览器中确认 SSL 锁和 `https` 是否出现。\n\n2. 使用你的主邮箱地址在生产站点创建一个用户。你的\
  \ Gravatar 显示正确吗？\n\n\n\n\n能够实现用户注册是我们应用程序的一个重大里程碑。尽管这个示例应用尚未实现任何实用的功能，但我们为未来的所有开发奠定了至关的基础。在第\
  \ 8 章和第 9 章中，我们将通过允许用户登录和注销应用程序（带有可选的“记住我”功能）来完成身份验证机制。在第 10 章中，我们将允许所有用户更新其账户信息，并允许网站管理员删除用户，从而完成表\
  \ 7.1 中 Users 资源的全套 REST 操作。\n\n### 7.6.1 本章我们学到了什么\n\n- Rails 通过 `debug` 方法显示有用的调试信息。\n\
  - Sass mixins 允许将一组 CSS 规则打包并在多处重用。\n- Rails 带有三个标准环境：`development`、`test` 和 `production`。\n\
  - 我们可以通过一组标准的 REST URL 作为*资源*与用户进行交互。\n- Gravatars 提供了一种显示图像来代表用户的方便方式。\n- `form_for`\
  \ 辅助方法用于生成与 Active Record 对象交互的表单。\n- 注册失败会渲染新用户页面并自动显示由 Active Record 确定的错误消息。\n\
  - Rails 提供 `flash` 作为显示临时消息的标准方式。\n- 注册成功会在数据库中创建用户并重定向到用户详情页，显示欢迎消息。\n- 我们可以使用集成测试来验证表单提交行为并捕获回归。\n\
  - 我们可以配置生产环境应用程序使用 SSL 进行安全通信，并使用 Puma 实现高性能。\n\n## 第 8 章 基础登录\n\n现在新用户可以为我们的网站注册（第\
  \ 7 章），是时候给他们登录和注销的能力了。在本章中，我们将实现一个基础但功能完全的登录系统：应用程序将保持登录状态，直到用户关闭浏览器。生成的身份验证系统将允许我们自定义网站，并根据当前用户的登录状态和身份实现授权模型。例如，我们将能够使用登录/注销链接和个人资料链接来更新网站页眉。\n\
  \n在第 10 章中，我们将实施一种安全模型，只有登录用户可以访问用户索引页，只有正确的用户可以访问编辑信息的页面，只有管理员可以从数据库中删除其他用户。最后，在第\
  \ 13 章中，我们将使用登录用户的身份创建与该用户关联的微推（microposts），并在第 14 章中，我们将允许当前用户关注应用程序的其他用户（从而接收他们的微推动态）。\n\
  \n本章的身份验证系统将为第 9 章中开发的更高级登录系统提供基础。不是在浏览器关闭时“忘记”用户，第 9 章将从*自动*记住用户开始，然后根据“记住我”复选框的值*选择性**记住用户。因此，第\
  \ 8 章和第 9 章共同开发了网络上最常见的三种登录系统。\n\n### 8.1 会话 (Sessions)\n\nHTTP 是一种*无状态协议*，将每个请求视为一个独立的事务，无法使用任何之前请求的信息。这意味着在超文本传输协议中没有办法在不同页面之间记住用户的身份；相反，需要用户登录的\
  \ Web 应用程序必须使用*session*（session），它是两台计算机之间的半永久连接（例如运行 浏览器的客户端计算机和运行 Rails 的服务器）。\n\
  \n在 Rails 中实现会话的最常用技术是使用*cookies*，它是放置在用户浏览器上的小段文本。由于 cookies 会在页面之间持续存在，它们可以存储信息（如用户\
  \ ID），应用程序可以使用这些信息从数据库中检索登录用户。在本节和第 8.2 节中，我们将使用 Rails 提供的 `session` 方法来创建在浏览器关闭时自动过期的临时会话。¹在第\
  \ 9 章中，我们将学习如何使用密切相关的 `cookies` 方法创建寿命更长的会话。\n\n1.某些浏览器提供了通过“从上次离开处继续”功能恢复此类会话的选项，但当然\
  \ Rails 对此行为没有控制。\n\n将会话建模为 RESTful 资源是非常方便的：访问登录页面将渲染*新*会话的表单，登录将*创建*会话，注销将*销毁*它。与使用数据库后端（通过\
  \ `User` 模型）持久化数据的 Users 资源不同，Sessions 资源将使用 cookies，登录的大部分工作来自于构建这种基于 cookie 的机制。\n\
  \n#### 8.1.1 Sessions 控制器\n\n登录和注销的元素对应特定的 action：登录表单由 `new` action 处理，登录通过发送 POST\
  \ 请求到 `create` action 处理（第 8.2 节），注销通过发送 DELETE 请求到 `destroy` action 处理（第 8.3 节）。回想表\
  \ 7.1 中 HTTP 词与 action 的关联。\n\n为了开始，我们将生成一个带有 `new` action 的 Sessions 控制器（列表 8.1）。\n\
  \n```\nrails generate Sessions new\n```\n\n包含 `new` 会生成*视图*，这就是为什么我们不包含没有视图的 `create`\
  \ 和 `destroy` action。遵循第 7.2 节中注册页的模型，我们的计划是创建一个用于新会话的登录表单，如图 8.1 所示。\n\n![image](img/image1342.jpeg)\n\
  \n图 8.1：登录表单原型。\n\n与使用 `resources` 方法获取全套 RESTful 路由的 Users 资源（列表 7.3）不同，Sessions\
  \ 资源将仅使用命名路由，用 `login` 路由处理 GET 和 POST 请求，用 `logout` 路由处理 DELETE 请求。结果出现在列表 8.2\
  \ 中（这也删除了 `rails generate` 生成的不需要路由）。\n\n**列表 8.2：** 为 sessions 添加资源以获取标准 action。\n\
  \n```ruby\nconfig/routes.rb\nRails.application.routes.draw do\n  root 'static_pages#home'\n\
  \  get '/help', to: 'static_pages#help'\n  get '/about', to: 'static_pages#about'\n\
  \  get '/contact', to: 'static_pages#contact'\n  get '/signup', to: 'users#new'\n\
