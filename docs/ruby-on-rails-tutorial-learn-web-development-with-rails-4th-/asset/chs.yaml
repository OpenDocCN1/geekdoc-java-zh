  **图 10.12：** 用户索引的第 2 页。\n\n#### 10.3.4 用户索引测试\n\n现在我们的用户索引页已经工作了，我们将为它编写一个轻量级测试，包括对第\
  \ 10.3.3 节分页的最小测试。思路是登录、访问索引路径、验证第一页用户是否存在，然后确认页面上存在分页功能。为了让最后两个步骤生效，我们需要测试数据库中有足够的用户来触发分页，即超过\
  \ 30 个。\n\n我们在列表 10.23 的 fixtures 中创建了第二个用户，但手动创建 30 左右的用户太多了。幸运的是，正如我们在用户 fixture\
  \ 的 `password_digest` 属性中所看到的，fixture 文件支持嵌入 Ruby，这意味着我们可以像列表 10.47 所示创建额外的 30 个用户（列表\
  \ 10.47 也创建了其他几个用户以供日后参考）。\n\n**列表 10.47：**向 fixture 中添加 30 个额外用户。\n`test/fixtures/users.yml`\n\
  \n```yaml\nmichael:\n  name: Michael\n  email: michael@example.com\n  password_digest:\
  \ <%= User.digest('password') %>\narcher:\n  name: Sterling Archer\n  email: duchess@example.gov\n\
  \  password_digest: <%= User.digest('password') %>\nlana:\n  name: Lana Kane\n \
  \ email: hands@example.gov\n  password_digest: <%= User.digest('password') %>\n\
  malory:\n  name: Malory Archer\n  email: boss@example.gov\n  password_digest: <%=\
  \ User.digest('password') %>\n<% 30.times do |n| %>\nuser_<%= n %>:\n  name: <%=\
  \ \"User #{n}\" %>\n  email: <%= \"user-#{n}@example.com\" %>\n  password_digest:\
  \ <%= User.digest('password') %>\n<% end %>\n```\n\n有了列表 10.47 中定义的 fixtures，我们已经准备好编写用户索引的测试了。首先，我们生成相关的测试：\n\
  \n点击此处查看代码图片\n\n```bash\n$ rails generate integration_test users_index\ninvoke test_unit\n\
  create test/integration/users_index_test.rb\n```\n\n测试本身涉及检查具有所需 `pagination` 类的\
  \ `div` 并验证第一页用户是否存在。结果出现在列表 10.48 中。\n\n**列表 10.48：** 用户索引测试，包含分页。绿色。\n`test/integration/users_index_test.rb`\n\
  \n点击此处查看代码图片\n\n```ruby\nrequire 'test_helper'\nclass UsersIndexTest < ActionDispatch::IntegrationTest\n\
  \  def setup\n    @user = users(:michael)\n  end\n\n  test \"index including pagination\"\
  \ do\n    log_in_as(@user) get users_path\n    assert_template 'users/index'\n \
  \   assert_select 'div.pagination'\n    User.paginate(page: 1).each do |user|\n\
  \      assert_select 'a[href=?]', user_path(user), text: user.name\n    end\n  end\n\
  end\n```\n\n**列表 10.49：** GREEN。\n\n```bash\n$ rails test\n```\n\n* * *\n\n### 练习\n\
