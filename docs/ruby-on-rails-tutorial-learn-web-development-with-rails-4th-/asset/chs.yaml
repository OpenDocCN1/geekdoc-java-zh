  \ 相同。）\n\n现在我们准备好开始构建应用。创建一个 Web 的典型第一步是创建数据模型，它是应用程序所需的结构表示。在我们案例中，示例应用将是一个 Twitter\
  \ 风格的微博客，只有用户和短内容（微）帖子。因此，我们将从应用的用户模型开始（第 2.1.1 节），然后添加微博客模型（第 2.1.2 节）。\n\n####\
  \ 2.1.1 用户示例模型\n\n由于 Web 上有不同的形式，用户数据模型有很多选择；为了简单起见，我们将采用一种极简主义的方法。我们示例应用的用户将有一个名为\
  \ `id` 的唯一标识符（类型为 `integer`）、一个公开可见的 `name`（类型为 `string`）以及一个 `email` 地址（同样为 `string`），后者将兼作唯一标识。用户数据模型的摘要出现在图\
  \ 2.2 中。\n\n正如从第 6.1.1 节开始看到的，图 2.2 中的 `users` 标签对应数据库中的一个表，而 `id`、`name` 和 `email`\
  \ 属性是表的列。\n\n#### 2.1.2 微博客示例模型\n\n微博客的核心模型比用户模型更简单：微博客只有一个 `id` 和一个用于内容的 `content`\
  \ 字段（类型为 `text`）。1 但还有一个额外的复杂之处：我们希望将每个微博客与特定的用户关联。我们将通过记录帖者的 `user_id` 来实现这一点。结果如图\
  \ 2.3 所示。\n\n![image](img/image1675.jpeg)\n**图 2.2：** 用户数据模型。\n\n1 由于微博客设计上很短，`string`\
  \ 类型实际上足够包含它们，但使用 `text` 更好地表达了我们的意图，并且在我们以后想要放宽限制时提供了更大的灵活性。\n\n![image](img/image1677.jpeg)\n\
  **图 2.3：** 微博客数据模型。\n\n我们将在第 2.3.3 节以及第 13 章中的用户数据模型，以及该模型的 Web 界面。这种组合构成了一个用户资源，允许我们通过\
  \ HTTP 协议通过 Web 将用户视为创建、读取、更新和删除的对象。正如引言中所承诺，我们的用户资源将由脚架生成程序创建，该程序是每个 Rails 项目的标准配置。我敦促你不要仔细查看生成的代码；在现阶段，它们只会增加困惑。\n\
  \nRails 通过传递 `scaffold` 命令生成。`scaffold` 命令的参数是单数名称（在此处为 `User`），随后是属性。\n\n```bash\n\
  $ rails generate scaffold User name:string email:string\n```\n\n\n\n\n# `create\
  \ app/assets/stylesheets/scaffolds.scss`\n\n通过包含 `name:string` 和 `email:string`，我们已经安排\
  \ User 模型拥有如图 2.2 所示的表单。（注意，不需要包含 `id` 参数；它由 Rails 自动创建并用作数据库中的*主键*。）\n\n要继续进行这个示例应用程序，我们首先需要使用\
  \ `rails db:migrate` 来*迁移*数据库，如列表 2.4 所示。\n\n**列表 2.4：** 迁移数据库。\n\n点击此处查看代码图片\n\n\
  ***\n\n```bash\n$ rails db:migrate\n\n==  CreateUsers: migrating ====================================================\n\
  \n-- create_table(:users)\n\n  -> 0.0017s\n\n==  CreateUsers: migrated (0.0018s)\
  \ ===========================================\n```\n\n***\n\n列表 2.4 的效果是用我们新的 `users`\
  \ 数据模型更新数据库。（我们将从第 6.1.1 节开始学习更多数据库迁移的知识。）\n\n顺便说，在 Rails 5 之前的每个版本中，`db:migrate`\
  \ 命令都使用 `rake` 代替 `rails`，因此为了遗留应用，了解如何使用 Rake（框 2.1）是非常重要的\n\n***\n\n**框 2.1：Rake**\n\
  \n在 Unix 传统中，*Make* 工具在从源代码构建可执行程序方面发挥着重要作用。*Rake* 是 *Ruby make*，一种用 Ruby 编写的类似\
  \ Make 的语言。\n\n在 Rails 5 之前，Ruby on Rails 广泛使用 Rake，因此为了遗留 Rails 应用，了解如何使用它非常重要。在\
  \ Rails 上文中，最常用的两个 Rake 命令可能是 `rake db:migrate`（用数据模型更新数据库）和 `rake test`（运行自动化测试套件）。在这些以及其他\
  \ `rake` 的用法中，确保命令使用的是与 Rails 应用的 `Gemfile` 对应的 Rake 版本非常重要，这通过使用 Bundler 命令 `bundler\
  \ exec` 实现。因此，迁移命令为\n\n```bash\n$ rails db:migrate\n$ bundle exec rake db:migrate\n\
  ```\n\n***\n\n在运行了列表 2.4 中的迁移后，我们可以在另一个标签页中运行本地 Web 服务器（图 1.7），如下：\n\n点击此处查看代码图片\n\
  \n```bash\n$ rails server -b $IP -p $PORT    # 如果在本地运行，使用 'rails server'。\n```\n\
  \n现在，示例应用程序应该如第 1.3.2 节所示在本地服务器上可用。（如果你正在使用云 IDE，请确保在新的*浏览器*标签页中打开生成的开发服务器，而不是在\
  \ IDE 内部。）\n\n## 2.2.1 用户导览\n\n如果我们访问根 URL /（如第 1.3.4 节所示，读作“斜杠”），我们将得到如图 1.11 所示的相同的“hello,\
