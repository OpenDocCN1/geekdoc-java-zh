  \ `git push heroku`。\n\n#### 1.5.4 Heroku 命令\n\nHeroku 有许多命令，而我们在本书中仅能浅浅触及皮毛。让我们花一分钟时间，通过如下方式重命名应用程序来展示其中一个命令：\n\
