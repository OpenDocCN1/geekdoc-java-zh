  \n**列表 4.14：** CSS 包含后生成的 HTML 源代码。\n\n点击此处查看代码图像\n\n```\n<link data-turbolinks-track=\"\
  true\" href=\"/assets/application.css\" media=\"all\" rel=\"stylesheet\" />\n```\n\
  \n### 4.4 Ruby 类\n\n我们之前说过，Ruby 中的一切都是对象，在这一节中，我们终于将定义一些自己的类。Ruby 与许多面向对象的语言一样，使用类来组织方法；这些类随后被实例化以创建对象。如果你是面向对象编程的新手，这听起来可能像胡乱语，所以让我们来看一些具体的例子。\n\
  \n#### 4.4.1 构造函数\n\n我们已经见过很多使用类来实例化对象的例子，但尚未显式地这样做。例如，我们使用双引号字符实例化了一个字符串，这是字符串的字面量构造函数：\n\
  \n点击此处查看代码图像\n\n```ruby\n>> s = \"foobar\"   # 使用双引号的字符串的字面量构造函数\n=> \"foobar\"\n\
  \n>> s.class\n=> String\n```\n\n我们在这里看到字符串对 `class` 方法有响应，并简单地返回它们所属的类。\n\n与其使用字面量构造函数，我们可以使用等的命名构造函数，这涉及到在类名上调用\
  \ `new` 方法：15\n\n15. 这些结果将根据你使用的 Ruby 版本而异。此示例假设你使用的是 Ruby 1.9.3 或更高版本。\n\n点击此处查看代码图像\n\
  \n```ruby\n>> s = String.new(\"foobar\")   # 字符串的命名构造函数\n=> \"foobar\"\n\n>> s.class\n\
  => String\n\n>> s == \"foobar\"\n=> true\n```\n\n这等同于字面量构造函数，但它更明确地表达了我们在做什么。\n\n\
  数组的工作与字符串相同：\n\n点击此处查看代码图像\n\n```ruby\n>> a = Array.new([1, 3, 2])\n=> [1, 3, 2]\n\
  ```\n\n相比之下，哈希（Hash）是不同的。数组构造函数 `Array.new` 接收数组的初始值，而 `Hash.new` 接收哈希的默认值，即哈希对于不存在的键所对应的值：\n\
  \n点击此处查看代码图像\n\n```ruby\n>> h = Hash.new\n=> {}\n\n>> h[:foo]               # 尝试访问不存在的键\
  \ :foo 的值。\n=> nil\n\n>> h = Hash.new(0)       # 让不存在的键返回 0 而不是 nil。\n=> {}\n\n\
  >> h[:foo]\n=> 0\n```\n\n当在类本身上调用方法时（如 `new` 例），它被称为类方法。在类上调用 `new` 的结果是该类的对象，也称为该类的实例。在实例上调用的方法（如\
  \ `length`）被称为实例方法。\n\n#### 练习题\n\n购买任何 Rails Tutorial 后均可以在 railstutorial.org/solutions\
