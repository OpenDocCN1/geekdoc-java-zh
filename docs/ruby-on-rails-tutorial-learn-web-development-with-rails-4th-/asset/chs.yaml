  \ 5.2 Sass and the Asset Pipeline\n\nOne of the most useful features of Rails is\
  \ the *asset pipeline*, which significantly simplifies the production and management\
  \ of static assets such as CSS, JavaScript, and images. This section first gives\
  \ a high-level overview of the asset pipeline and then shows how to use *Sass*,\
  \ a powerful tool for writing CSS.\n\n#### 5.2.1 The Asset Pipeline\n\nFrom the\
  \ perspective of a typical Rails developer, there are three main features to understand\
  \ about the asset pipeline: asset directories, manifest files, and preprocessor\
  \ engines. Let’s consider each in turn.\n\n##### Asset Directories\n\nThe Rails\
  \ asset pipeline uses three standard directories for static assets, each with its\
  \ own purpose:\n\n• `app/assets`: assets specific to the present application\n•\
  \ `lib/assets`: assets for libraries written by your dev team\n• `vendor/assets`:\
  \ assets from third-party vendors\n\nEach of these directories has a subdirectory\
  \ for each asset class: images, JavaScript, and cascading style sheets:\n\n```bash\n\
  $ ls app/assets/\nimages/  javascripts/  stylesheets/\n```\n\nAt this point, we’re\
  \ in a position to understand the motivation behind the location of the custom CSS\
  \ file in Section 5.1.2: `custom.scss` is specific to the sample application, so\
  \ it goes in `app/assets/stylesheets`.\n\n[/content] (Wait, I noticed the provided\
