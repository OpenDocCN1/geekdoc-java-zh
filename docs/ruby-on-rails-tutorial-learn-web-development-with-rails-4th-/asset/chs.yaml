  \ cookie，确认在注销后会话已正确移除。\n\n## 8.4 总结\n\n通过本章的内容，我们的示例应用程序已经拥有了一个功能完整的登录和验证系统。在下一章中，我们将通过添加比单个浏览器会话更长的用户记忆功能，将应用推向新层次。\n\
  \n在继续之前，请将你的更改合并回主分支：\n\n点击此处查看代码图像\n\n```\n$ rails test\n$ git add -A\n$ git commit\
  \ -m \"Implement basic login\"\n$ git checkout master\n$ git merge basic-login\n\
  ```\n\n然后将更改推送到远程仓库：\n\n```\n$ rails test\n$ git push\n```\n\n最后，像往一样部署到 Heroku：\n\
  \n```\n$ git push heroku\n```\n\n### 8.4.1 本章学到的知识\n\n* Rails 可以通过 `session` 方法使用临时\
  \ cookie 在一个页面到另一个页面之间维持状态。\n* 登录表单的设计用于创建一个新会话以登录用户。\n* `flash.now` 方法用于渲染页面上的闪电消息。\n\
  * 测试驱动开发在通过在测试重现 bug 来进行调试时非常有用。\n* 使用 `session` 方法，我们可以安全地将用户 ID 放在浏览器中以创建临时会话。\n\
  * 我们可以根据登录状态更改布局中的链接等功能。\n* 集成测试可以验证正确的路由、数据库更新以及布局的正确更改。\n\n## 第 9 章 高级登录\n\n在第\
  \ 8 章中开发的的基础登录系统已经功能完整，但大多数现代网站都包含在用户再次访问网站时（即使他们在此期间关闭了浏览器）“记住”用户的功能。在本章中，我们将使用持久化\
  \ cookie 来实现这种行为。我们将从在登录时自动记住用户开始（第 9.1 节），这是 Bitbucket 和 GitHub 等网站使用的常用模型。然后我们将添加使用“记住我”复选框来*可选地*记住用户的功能，这是\
  \ Twitter 和 Facebook 等网站使用的模型。\n\n由于第 8 章的登录系统本身是完整的，示例应用程序的核心即使没有它也能正常运行，如果需要，你可以直接跳到第\
  \ 10 章（并从那里到第 13 章）。另一方面，学习如何实现“记住我”功能本身就非常有启发性，并为账户激活（第 11 章）和重置密码（第 12 章）奠定了基础基础。此外，结果是计算机魔法的一个绝佳例子：你在网上见过无数个这样的“记住我”登录表单，现在是你学习如何制作一个了。\n\
  \n### 9.1 记住我\n\n在本节中，我们将添加在用户关闭并重新打开浏览器后记住其登录状态的能力。这种“记住我”的行为会自动发生，用户将自动保持登录，直到他们显式注销。正如我们将看到的，生成的机制将便于添加可选的“记住我”复选框（第\
  \ 9.2 节）。\n\n一如既往，我建议在继续操作之前切换到一个主题分支：\n\n点击此处查看代码图像\n\n```\n$ git checkout -b advanced-login\n\
  ```\n\n#### 9.1.1 记忆令牌与摘要\n\n在第 8.2 节中，我们使用 Rails 的 `session` 方法存储用户的 ID，但这些信息在用户关闭浏览器时就会消失。在本节中，我们将迈向持久化会话的第一步：使用\
  \ `cookies` 方法生成适用于创建持久化 cookie 的*记忆令牌*（remember token），以及一个用于验证这些令牌的安全的*记忆摘要*（remember\
  \ digest）。\n\n如第 8.2.1 节所述，使用 `session` 存储的信息自动是安全的，但 `cookies` 则不然。特别是持久化 cookie\
  \ 容易受到会话劫持，攻击者使用窃取的令牌作为特定用户登录。窃取 cookie 有四种主要方法：(1) 使用数据嗅探器检测通过安全网络传输的 cookie；(2)\
  \ 破解包含令牌的数据库；(3) 使用跨站脚本 (XSS)；(4) 物理访问已登录的计算机。我们在第 7.5 节中通过全站使用套接层安全（SSL）解决了第一种问题。我们在第\
  \ 6.3 节中通过存储令牌的摘要而非令牌解决了第二种问题。Rails 通过转义插入视图模板的内容防止第三种问题。最后，虽然没有绝对的方法阻止物理访问已登录计算机的攻击者，但我们通过在用户每次注销时更改令牌，以及对放在浏览器上的任何敏感信息进行*加密签名*，来尽量减少第四种问题。\n\
  \n考虑到这些设计和安全因素，我们创建持久化会话的计划如下：\n\n1. 创建一个随机字符串作为记忆令牌。\n2. 将令牌放在浏览器 cookie 中，并设置一个远远的过期日期。\n\
  3. 将令牌的哈希摘要保存到数据库。\n4. 将用户 ID 的加密版本放在浏览器 cookie 中。\n5. 当包含持久化用户 ID 的 cookie 时，根据给定的\
  \ ID 在数据库中查找用户，并验证记忆令牌 cookie 是否与关联的数据库哈希摘要匹配。\n\n注意最后一步与登录用户有多相似：我们通过电子邮件地址检索用户，然后（使用\
  \ `authenticate` 方法）验证提交的密码是否与密码摘要（列表 8.7）。结果是，我们的实现与 `has_secure_password` 并。\n\
  \n我们将首先为 User 模型添加必需的 `remember_digest` 属性，如图 9.1 所示。\n\n为了将图 9.1 中的数据模型添加到应用程序中，我们将生成一个迁移：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```\n$ rails generate migration add_remember_digest_to_users\
  \ remember_digest:string\n```\n\n（对比 6.3.1 节中的密码哈希迁移。）与之前的迁移一样，我们使用了以 `_to_users`\
  \ 结尾的迁移名称，以告诉 Rails 该迁移设计用于修改数据库中的 `users` 表。由于我们还包含了该属性（`remember_digest`）和类型（`string`），Rails\
  \ 会为我们生成一个默认迁移，如列表 9.1 所示。\n\n![image](img/image01358.jpeg)\n\n**图 9.1：** 添加了 `remember_digest`\
  \ 属性的 User 模型。\n\n**列表 9.1：** 为记忆令牌哈希生成的迁移文件。\n\n`db/migrate/[timestamp]_add_remember_digest_to_users.rb`\n\
  \n点击此处查看代码图像\n\n```\nclass AddRememberDigestToUsers ActiveRecord ActiveRecord::Migration[5.0]\n\
  \  def change\n    add_column :users, :remember_digest, :string\n  end\nend\n```\n\
  \n因为我们不期望通过记忆哈希来检索用户，所以不需要在 `remember_digest` 列上建立索引，我们可以直接使用上面生成的默认迁移：\n\n```\n\
  $ rails db:migrate\n```\n\n现在我们必须决定使用什么作为记忆令牌（remember token）。有很多基本等价的可能性——本质上，任何长随机字符串都可以。Ruby\
  \ 标准库中 `SecureRandom` 模块的 `urlsafe_base64` 方法非常符合要求：³ 它返回一个长度为 22 的随机字符串，由字符 A–Z、a–z、0–9、“-”和“_”\
  \ 组成（总共 64 种可能，因此称为“base64”）。典型的 base64 字符串如下所示：\n\n3. 这一选择基于关于“记住我”的 RailsCast。\n\
  \n点击此处查看代码图像\n\n```\n$ rails console\n>> SecureRandom.urlsafe_base64\n=> \"q5lt38hQDc_959PVoo6b7A\"\
  \n```\n\n就像两个用户拥有相同的密码完全没有问题一样,⁴ 记忆令牌也不需要是唯一的，但如果它们是唯一的，会更安全。⁵ 对于上述 base64 字符串来说，22\
  \ 个字符中的每一个字符都有 64 种可能，因此两个记忆令牌发生碰撞的概率是微乎其微的 1/64²² = 2^(−132) ≈ 10^(−40)。⁶ 额外的是，通过使用专门设计为\
  \ URL 安全设计的 base64 字符串（如名称 `urlsafe_base64` 所示），我们将能够使用同一个令牌生成器在第 12 章中创建账户激活和密码重置链接。\n\
  \n4. 在任何情况下，有了 bcrypt 的加盐哈希，我们无法判断两个用户的密码是否匹配。\n\n5. 使用唯一的记忆令牌，攻击者总是需要同时拥有用户 id\
  \ 和记忆令牌 cookie 才能劫持会话。\n\n6. 这并没有阻止一些开发者添加检查来验证没有发生碰撞，但这种努力源于没有领会到 10^(−40) 有有多小。例如，即使我们在整个宇宙的寿命周期内每秒生成十亿个令牌，预期的碰撞数量仍将在\
  \ 10^(−23) 数量级。\n\n记住用户涉及创建一个记忆令牌并将令牌的哈希保存到数据库中。我们已经为测试固具定义了一个用于使用的 `digest` 方法（列表\
  \ 8.21），并利用上述讨论的结果创建一个 `new_token` 方法来生成新令牌。和 `digest` 方法一样样，新令牌方法不需要用户对象，因此我们将它设为类方法。⁷\
  \ 结果就是列表 9.2 所示的 User 模型。\n\n7. 一般原则是，如果一个方法不需要对象的实例，它就应该是一个类方法。事实上，这个决定在第 11.2\
  \ 节中被证明是明智的。\n\n**列表 9.2：** 添加生成令牌的方法。\n\n`app/models/user.rb`\n\n点击此处查看代码图像\n\n\
  ```\nclass User < ApplicationRecord\n  before_save { self.email = email.downcase\
  \ }\n  validates :email, presence: true\n  validates :password, presence: true,\
  \ length: { minimum: 6 }\nend\n```\n\n\n\n\n\n```ruby\nVALID_EMAIL_REGEX = /\\A[\\\
  w+\\-.]+@[a-z\\d\\-.]+\\.[a-z]+\\z/i\n\nvalidates :email, presence: true, length:\
  \ { maximum: 255 },\n                 format: { with: VALID_EMAIL_REGEX },\n   \
  \              uniqueness: { case_sensitive: false }\n\nhas_secure_password\n\n\
  validates :password, presence: true, length: { minimum: 6 }\n\n# 返回给定字符串的哈希摘要值。\n\
  def User.digest(string)\n  cost = ActiveModel::SecurePassword.min_cost ? BCrypt::Engine::MIN_COST\
  \ :\n                               BCrypt::Engine.cost\n  BCrypt::Password.create(string,\
  \ cost: cost)\nend\n\n# 返回一个随机令牌。\ndef User.new_token\n  SecureRandom.urlsafe_base64\n\
  end\n\n# 在数据库中记住用户，以便用于持久会话。\ndef remember\n  self.remember_token = User.new_token\n\
  \  update_attribute(:remember_digest, User.digest(remember_token))\nend\nend\n```\n\
