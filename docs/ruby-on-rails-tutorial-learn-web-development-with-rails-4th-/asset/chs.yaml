  \n#### 13.5.1 我们在本章学到的内容\n\n- 微贴（Microposts）像 `Users` 一样，被建模为由 `Active Record` 模型支持的资源。\n\
  - Rails 支持多列索引。\n- 我们可以分别在 `User` 和 `Micropost` 模型中使用 `has_many` 和 `belongs_to`\
  \ 方法来建模一个拥有许多微贴的用户。\n- `has_many`/belongs_to` 的组合产生可以通过关联进行操作的方法。\n- 代码 `user.microposts.build(...)`\
  \ 返回一个与给定用户关联的新 `Micropost` 对象。\n- Rails 通过 `default_scope` 支持默认排序。\n- 作用域接受匿名函数作为参数。\n\
  - `dependent: :destroy` 选项会导致对象在关联对象删除的同时被删除。\n- 分页和对象计数都可以通过关联完成，从而实现高效代码。\n- 固件（Fixtures）支持关联的创建。\n\
  - 可以向 Rails 局部视图（partials）传递变量。\n- `where` 方法可用于 `Active Record` 查询。\n- 我们可以始终通过关联创建和销毁对象来强制安全操作。\n\
  - 我们可以使用 `CarrierWave` 上传并调整图像大小。\n\n## 第 14 章 关注用户\n\n在本章中，我们将通过添加社交层来完成 Rails\
  \ 教程应用程序，该层允许用户关注（以及取消关注）其他用户，从而使每个用户的主页都能显示其所关注用户的微贴状态动态。我们首先在 14.1 中学习如何建模用户之间的关系，并在\
  \ 14.2 中构建相应的 Web 界面（包括对 Ajax 的介绍）。最后在 14.3 中开发全功能的状态动态。\n\n最后一章包含了教程中一些最具挑战性的内容，包括为了制作状态动态使用的一些\
  \ Ruby/SQL 技巧。通过这些示例，你将看到 Rails 如何处理即使是复杂的数据模型，这对于你以后开发具有特定需求的自己的应用程序将大有裨益。为了帮助你完成从教程到独立开发的过渡，14.4\
  \ 提供了指向更高级资源的提示。\n\n由于本章的内容特别具有挑战性，在编写任何代码之前，我们先停顿一下浏览界面。与之前的章节一样，在这一早期阶段，我们将使用原型图来表示页面。1.\n\
  \n*注：提供的文本中图像说明和描述在源流中出现了错误的合并。）*\n\n完整的页面流程如下：一个用户（约翰·卡尔文）从他的个人页开始 (14.1)，并导航到用户页面\
  \ (14.2) 选择要关注的用户。卡尔文导航到第二个用户托马斯·霍布斯的个人页 (14.3，第 682 页)，点击“关注”按钮以关注该用户。这使得“关注”按钮变为“取消关注”，并使霍布斯的“粉丝者”计数加\
  \ 1 (14.4，第 683 页)。导航回主页，卡尔文现在看到“关注”计数增加，并在他的状态动态中发现了霍布斯的微贴 (14.5，第 684 页)。本章的其余部分致力于让这个页面流程真正运行起来。\n\
  \n\n\n\n\n此讨论建议如图 14.6 所示，对粉丝用户进行建模，使用一个 `following` 表和 `has_many` 关联。由于 `user.following`\
  \ 应该是一个用户集合，因此 `following` 表的每行都需要是一个用户，通过 `followed_id` 对其进行标识，并结合 `follower_id`\
  \ 来建立关联。² 此外，由于每行都是一个用户，我们需要包含用户的其他属性，包括名称、电子邮件、密码等。\n\n2. 为了简单起见，图 14.6 省略了 `following`\
  \ 表的 `id` 列。\n\n![image](img/image02353.jpeg)\n\n**图 14.4：** 具有取消关注按钮和递增粉丝数量的个人资料页。\n\
  \n图 14.6 中数据模型的问题在于它是极其冗余的：每行不仅包含被关注用户的 id，还包含了他们的所有其他信息——而这些信息*已经*存在于 `users` 表中了。更糟糕的是，为了对用户*关注者*建模，我们还需要一个独立的、同样冗余的\
  \ `followers` 表。最后，这个数据模型是一个可维护性的噩梦：每当用户更改（例如）名称时，我们不仅需要更新 `users` 表中的用户记录，还需要更新\
  \ `following` 和 `followers` 表中*包含该用户的每行*。\n\n这里的问题在于，我们缺少一个底层的抽象。找到合适模型的一种方法是考虑我们如何在\
  \ Web 应用程序中实现“*关注*”的行为。回想第 7.1.2 节，REST 架构涉及创建和销毁的*资源*。这引导我们思考两个问题：当一个用户关注另一个用户时，创建了什么？当一个用户*取消*关注另一个用户时，销毁了什么？通过反思，我们看到在这些情况下，应用程序应该创建或销毁两个用户之间的*关系*。一个用户随后拥有许多关系，并通过这些关系拥有许多\
  \ `following`（或 `followers`）。\n\n![image](img/image02354.jpeg)\n\n**图 14.5：** 具有状态馈送和递增关注数量的首页。\n\
  \n![image](img/image02355.jpeg)\n\n**图 14.6：** 用户关注的朴素实现。\n\n关于我们应用程序的数据模型，我们还需要处理一个额外细节：与\
  \ Facebook 式的对称友谊（这种关系始终是对称的，至少在数据模型层面如此）不同，Twitter 式的关注关系可能是*非对称的*——Calvin 可以关注\
  \ Hobbes，而 Hobbes 不必关注 Calvin。为了区分这两种情况，我们将采用*主动*（active）和*被动*（passive）关系的术语：如果\
  \ Calvin 正在关注 Hobbes 但反之则不然，那么 Calvin 与 Hobbes 拥有一种主动关系，而 Hobbes 与 Calvin 拥有一段被动关系。³\n\
  \n3. 感谢读者 Paul Fioravanti 建议这种术语。\n\n我们现在将关注于使用主动关系生成被关注用户列表，并在第 14.1.5 节中考虑被动情况。图\
  \ 14.6 提示了如何实现它：由于每个被关注的用户都通过 `followed_id` 唯一标识，我们可以将 `following` 转换为 `active_relationships`\
  \ 表，省略用户详情，并使用 `followed_id` 从 `users` 表中检索被关注的用户。数据模型图出现在图 14.7 中。\n\n由于我们将对主动关系和被动关系使用同一个数据库表，我们将使用通用术语\
  \ *relationship*（关系）作为表名，并对应相应的 Relationship 模型。结果是图 14.8 所示的 Relationship 数据模型。我们将从第\
  \ 14.1.4 节开始，学习如何使用 Relationship 模型来模拟主动关系模型和被动关系模型。\n\n![image](img/image01364.jpeg)\n\
  \n**图 14.7：** 通过主动关系的被关注用户模型。\n\n![image](img/image01366.jpeg)\n\n**图 14.8：** Relationship\
  \ 数据模型。\n\n为了开始实现，我们首先生成一个对应图 14.8 的迁移文件：\n\n点击此处查看代码图像\n\n```\n$ rails generate\
  \ model Relationship follower_id:integer followed_id:integer\n```\n\n由于我们将通过 `follower_id`\
  \ 和 `followed_id` 查找关系，我们应该对每个字段添加索引，如列表 14.1 所示。\n\n**代码列表 14.1：** 为 `relationships`\
  \ 表添加索引。\n\ndb/migrate/[timestamp]_create_relationships.rb\n\n```\nclass CreateRelationships\
  \ < ActiveRecord::Migration[5.0]\n  def change\n    create_table :relationships\
  \ do |t|\n      t.integer :follower_id\n      t.integer :followed_id\n\n      t.timestamps\n\
  \    end\n\n    add_index :relationships, :follower_id\n    add_index :relationships,\
  \ :followed_id\n    add_index :relationships, [:follower_id, :followed_id], unique:\
  \ true\n  end\nend\n```\n\n要创建 `relationships` 表，我们像往常迁移数据库：\n\n```\n$ rails db:migrate\n\
  ```\n\n\n\n\n这之所以有效，是因为按照惯例，Rails 会寻找与 `:microposts` 符号对应的 Micropost 模型。但在当前情况下，我们想要写的是：\n\
  \n从技术上讲，Rails 使用 `classify` 方法将 `has_many` 的参数转换为类名，该方法会将 `\"foo_bars\"` 转换为 `\"\
  FooBar\"`。\n\n```ruby\nhas_many :active_relationships\n```\n\n尽管底层的模型被称为 `Relationship`。因此，我们必须告诉\
  \ Rails 应该查找的模型类名。\n\n其次，在我们在 Micropost 模型中写下之前：\n\n```ruby\nclass Micropost < ApplicationRecord\n\
  \  belongs_to :user\nend\n```\n\n这之所以有效，是因为 `microposts` 表有一个 `user_id` 属性来标识用户。这种以这种方式用来连接两个数据库表的\
  \ ID 被称为外键。当 User 模型对象的外键为 `user_id` 时，Rails 会自动推断出关联关系：默认情况下，Rails 期望外键的格式为 `<class>_id`，其中\
  \ `<class>` 是类名的小写版本。在当前情况下，尽管我们仍然在处理用户，但关注另一个用户的用户现在是通过外键 `follower_id` 来标识的，因此我们必须告诉\
  \ Rails。\n\n从技术上讲，Rails 使用 `underscore` 方法将类名转换为 id。例如，`\"FooBar\".underscore` 是\
  \ `\"foo_bar\"`，因此 `FooBar` 对象的外键将是 `foo_bar_id`。\n\n上述讨论的结果如列表 14.2 和列表 14.3 所示的用户/关系关联。\n\
  \n**列表 14.2：** 实现关注关系的 `has_many` 关联。\n\n`app/models/user.rb`\n\n```ruby\nclass\
  \ User < ApplicationRecord\n  has_many :microposts, dependent: :destroy\n  has_many\
  \ :active_relationships, class_name: \"Relationship\",\n                       \
  \    foreign_key: \"follower_id\",\n                           dependent: :destroy\n\
  end\n```\n\n（由于删除一个用户也应该删除该用户的关系，因此我们在关联中添加了 `dependent: :destroy`。）\n\n**列表 14.3：**\
  \ 在 Relationship 模型中添加关注者 `belongs_to` 关联。\n\n`app/models/relationship.rb`\n\n```ruby\n\
  class Relationship < ApplicationRecord\n  belongs_to :follower, class_name: \"User\"\
  \n  belongs_to :followed, class_name: \"User\"\nend\n```\n\n`followed` 关联直到 14.1.4\
  \ 节实际上并不需要，但如果我们同时实现它们，这种并行的关注者/被关注结构会更清晰。\n\n列表 14.2 和 14.3 中的关系产生了与我们在表 13.1 中看到的类似的方法，如表\
  \ 14.1 所示。\n\n### 练习题\n\n购买任何 Rails Tutorial 可以在 railstutorial.org/solutions 免费获取练习答案。要查看他人的答案并记录自己的答案，请加入\
