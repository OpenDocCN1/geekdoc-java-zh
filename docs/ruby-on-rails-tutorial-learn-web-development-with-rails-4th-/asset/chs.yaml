  \ class=\"user_info\">\n      <h1>\n        <%= gravatar_for @user %>\n        <%=\
  \ @user.name %>\n      </h1>\n    </section>\n  </aside>\n  <div class=\"col-md-8\"\
  >\n    <% if @user.microposts.any? %>\n        <h3>Microposts (<%= @user.microposts.count\
