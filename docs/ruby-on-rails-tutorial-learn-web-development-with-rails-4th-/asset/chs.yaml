  \ 中的双叹号技巧，如 `!! (user && user.authenticate('foobar'))`。\n\n#### 8.1.4 使用 Flash 渲染\n\
  \n回想 Section 7.3.3 我们使用 User 模型消息显示注册错误。这些错误与特定的 Active Record 对象关联，但这种策略在这里不起，因为\
  \ session 不是 Active Record 模型。相反，将在 flash 中放入一条消息以便在登录失败时显示。第一次、略有错误的尝试出现在 Listing\
  \ 8.8 中。\n\n**Listing 8.8：** 处理登录失败的（不成功的）尝试。\n\n```ruby\napp/controllers/sessions_controller.rb\n\
  class SessionsController < ApplicationController\n  def new\n  end\n\n  def create\n\
  \    user = User.find_by(email: params[:session][:email].downcase)\n    if user\
  \ && user.authenticate(params[:session][:password])\n      # 登录用户并重定向到用户的显示页面。\n\
  \    else\n      flash[:danger] = 'Invalid email/password combination' # 不对！\n \
  \     render 'new'\n    end\n  end\n\n  def destroy\n  end\nend\n```\n\n\n\n\n由于站点布局中有闪消息显示（列表\
  \ 7.31），`flash[:danger]` 消息会自动显示；由于使用了 Bootstrap CSS，它会自动获得良好的样式（图 8.5）。\n\n![image](img/image0135.jpeg)\n\
  \n**图 8.5:** 登录失败的闪消息。\n\n遗憾的是，正如文中和列表 8.8 中的注释所示，这段代码并不完全正确。尽管页面看起来正常，但问题出在哪里？问题在于\
  \ flash 的内容会持续一个*request*（请求），但——与我们在列表 7.29 中使用的重定向不同——使用 `render` 重新渲染模板并不被视为请求。结果是\
  \ flash 消息持续的时间比我们预期的多了一个请求。例如，如果我们提交了无效的登录信息然后点击主页，flash 消息会再次显示（图 8.6）。修复这个瑕疵是第\
  \ 8.1.5 节的任务。\n\n#### 8.1.5 Flash 测试\n\n不正确的 flash 行为是我们应用程序中的一个小 bug。根据框 3.3 中的测试指南，这正是我们应该编写测试来捕获错误以防止其再次发生的情况。因此，在继续之前，我们将为登录表单提交编写一个简短的集成测试。除了记录\
  \ bug 和防止回归之外，这将为我们进一步对登录和注销进行集成测试奠定良好的基础。\n\n![image](img/image01352.jpeg)\n\n\
  **图 8.6:** flash 持化的示例。\n\n我们首先为应用程序的登录行为生成一个集成测试：\n\n点击此处查看代码\n\n```bash\n$ rails\
  \ generate integration_test users_login\n$ invoke test_unit\n$ create test/integration/users_login_test.rb\n\
  ```\n\n接下来，我们需要一个测试来捕捉图 8.5 和图 8.6 所示的序列。基本步骤如下：\n\n1. 访问登录路径。\n2. 验证新的 sessions\
  \ 表单是否正确渲染。\n3. 使用无效的 `params` 哈向 sessions 路径发送 POST 请求。\n4. 验证新的 sessions 表单被重新渲染并出现了\
  \ flash 消息。\n5. 访问另一个页面（例如主页）。\n6. 验证 flash 消息在新页面*没有*出现。\n\n实现上述步骤的测试出现在列表 8.9\
  \ 中。\n\n**列表 8.9:** 用于捕获非预期 flash 持化的测试。**红色**。\n\n```ruby\ntest/integration/users_login_test.rb\n\
  \n点击此处查看代码\n\nrequire 'test_helper'\n\nclass UsersLoginTest < ActionDispatch::IntegrationTest\n\
  \  test \"login with invalid information\" do\n    get login_path\n    assert_template\
  \ 'sessions/new'\n    post login_path, params: { session: { email: \"\", password:\
  \ \"\" } }\n    assert_template 'sessions/new'\n    assert_not flash.empty?\n  \
  \  get root_path\n    assert flash.empty?\n  end\nend\n```\n\n在列表 8.9 中添加测试后，登录测试应该是**红色**的：\n\
  \n**列表 8.10: 红色**。\n\n点击此处查看代码\n\n```bash\n$ rails test test/integration/users_login_test.rb\n\
  ```\n\n这展示了如何使用 `rails test` 并结合文件的完整路径来运行一个（且仅运行）测试文件。\n\n让列表 8.9 中的失败测试通过通过的方法，是将\
  \ `flash` 替换为特殊变体 `flash.now`，它专门设计用于在渲染的页面上显示 flash 消息。与 `flash` 的内容不同，`flash.now`\
  \ 的内容一旦出现额外的请求就会消失，这正是我们在列表 8.9 中测试过的行为。通过这种替换，修正后的应用程序代码如列表 8.11 所示。\n\n**列表 8.11:**\
