  \n### 12.5 总结\n\n随着密码重置功能的添加，我们的应用程序已经准备就绪。在下一章中，我们将探索如何向应用程序添加微贴（microposts）。\n\
  \n### 12.5.1 本章所得\n\n- 我们学习了如何配置 SendGrid 用于 SMTP。\n- 我们学习了如何使用环境变量处理敏感信息。\n- 我们学习了如何实现密码重置功能。\n\
  - 我们学习了如何将应用程序部署到 Heroku。\n\n### 12.6 过期证明\n\n我们在列表 12.17 中看到判断密码重置是否过期的比较是 `reset_sent_at\
  \ < 2.hours.ago`。这看起来可能被读为“重置于两小时前”，这与我们的目标相反。在本节中，我们将证明上述逻辑是正确的。\n\n我们首先定义两个时间间隔。令\
  \ `Δ[tr]` 为自密码重置以来的时间，`Δte` 为过期限制（例如两小时）。如果自重置以来的时间超过了限制，则密码重置过期：\n\n`Δ[tr] > Δte`\n\
  \n如果我们把现在的时间写作 `t[N]`，密码重置的发送时间写作 `t[r]`，过期时间写作 `te`（例如两小时前），那么有：\n\n`Δ[tr] = t[N]\
  \ - t[r]`\n\n以及\n\n`Δte = t[N] - te`\n\n将公式 (12.2) 和公式 (12.3) 代入公式 (12.1)，得到：\n\n\
  `Δ[tr] > Δte`\n\n`t[N] - t[r] > t[N] - te`\n\n`-t[r] > -te`\n\n在同边乘以 -1 后：\n\n`t[r]\
  \ < te`\n\n正如第 12.3 节 所示，如果我们将 `<` 读作“早于”而不是“小于”，那么这段代码就通顺了。\n\n\n\n\n\n在开发核心示例应用程序的过程中，我们现在遇到了四种资源——用户、会话、账户激活和密码重置——但只有第一个资源由带有数据库表的\
  \ Active Record 模型支持。现在是时候添加第二个此类资源了：用户 `microposts`（微推文），它是与特定用户关联的短消息。¹ \n\n我们首次在第\
  \ 2 章中看到处于雏形阶段的 `microposts`，在本章中，我们将通过以下方式将第 2.3 节中的草图扩展为一个具有完整功能的版本：构建 `Micropost`\
  \ 数据模型，使用 `has_many` 和 `belongs_to` 方法将其与 `User` 模型关联，然后创建操作和显示结果所需的表单和部分视图（包括第\
  \ 13.4 节中上传的图片）。在第 14 章中，我们将通过引入*关注*用户的概念来完成这个微型 Twitter 克隆，以便接收他们的 `microposts`*动态*（feed）。\n\
  \n1. 这个名字灵感源于对 Twitter 的常见描述——*微博客*；既然博客有帖子，微博客应该有 `microposts`。\n\n### 13.1 微推文模型\n\
  \n我们通过创建一个 `Micropost` 模型开始处理 `microposts` 资源，该模型捕捉了 `microposts`的核心特征。后续内容将基于第\
  \ 2.3 节的工作；与该节中的模型一样，我们新的 `Micropost` 模型将包含数据验证以及与 `User` 模型的关联。与该模型不同，当前的 `Micropost`\
  \ 模型将经过完全测试，并且当父用户被删除时，将具有默认的*排序*和自动*删除*机制。\n\n如果你正在使用 Git 进行版本控制，我建议在此时创建一个主题分支：\n\
  \n点击此处查看代码图像\n\n```\n$ git checkout -b user-microposts\n```\n\n#### 13.1.1 基础模型\n\
  \n`Micropost` 模型只需要两个属性：一个用于存储微推文内容的 `content` 属性，以及一个用于将微推文与特定用户关联的 `user_id`。其结果是得到了一个如图\
  \ 13.1 所示所示的 `Micropost` 模型。\n\n值得注意的是，图 13.1 中的模型对微推文内容使用了 `text` 数据类型（而不是 `string`），`text`\
  \ 存储任意数量的文本。尽管内容将被限制在少于 140 个字符（第 13.1.2 节），因此可以放入 255 字符的 `string` 类型中，但使用 `text`\
  \ 能更好地表达 `microposts` 的本质，因为它们更自然地被认为是文本块。事实上，在第 13.3.2 节中，我们将使用文本*区域*（area）而不是文本字段来提交\
  \ `microposts`。此外，使用 `text` 让我们在未来想要增加长度限制时（例如作为国际化的一部分）具有更大的活性。最后，使用 `text` 类型在生产环境中的性能没有差异，²，因此我们使用它没有任何成本。\n\
