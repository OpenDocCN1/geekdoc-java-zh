  \n## 框 9.2：10 类人\n\n有一个古老的笑话说，世界上有 10 类人：懂二进制的人和不懂二进制的人（当然，`10` 在二进制中表示 `2`）。本着这种精神，我们可以说世界上有\
  \ 10 类人：喜欢三元运算符的人、不喜欢三元运算符的人，以及那些还不知道它元存在的人。（如果你恰好属于第三类，很快你就不再是这一类了。）\n\n当你进行大量的编程工作时，你会很快发现最常见的控制流结构之一如下：\n\
  \n```ruby\nif boolean?\n  do_one_thing\nelse\n  do_something_else\nend\n```\n\n\
  Ruby 与许多其他语言（包括 C/C++、Perl、PHP 和 Java）一样，允许你使用`三元运算符`（因为包含三个部分，所以得名）替换为更紧凑的表达式：\n\
  \n`boolean? ? do_one_thing : do_something_else`\n\n你也可以使用三元运算符来替换赋值操作，使得\n\n```ruby\n\
  if boolean?\n  var = foo\nelse\n  var = bar\nend\n```\n\n变为\n\n`var = boolean? ?\
  \ foo : bar`\n\n最后，在函数的返回值中使用三元运算符通常非常方便：\n\n```ruby\ndef foo\n  do_stuff\n  boolean?\
  \ ? \"bar\" : \"baz\"\nend\n```\n\n由于 Ruby 会隐式地返回函数中最后一个表达式的值，这里 `foo` 方法根据 `boolean?`\
  \ 是为真为假来返回 \"bar\" 或 \"baz\"。\n\n### 练习题\n\n购买任何 Rails Tutorial 均可在 railstutorial.org/solutions\
