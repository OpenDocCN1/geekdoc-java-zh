  \n```\n$ git push heroku\n```\n\n部署的结果应该是生产服务器上一个运行良好的示例应用程序（图 5.12）。\n\n### 5.5.1\
  \ 本章学了什么\n\n* 使用 HTML5，我们可以定义包含 logo、页眉、页脚和主体内容的网站布局。\n* Rails 局部模板（partials）用于将标记语言放在单独的文件中以便方便操作。\n\
  * CSS 允许我们根据 CSS 类和 ID 对网站布局进行样式设置。\n* Bootstrap 框架可以让我们快速构建设计良好的网站。\n* Sass 和资源流水线（asset\
  \ pipeline）允许我们在消除 CSS 重复的同时，为生产环境高效地打包结果。\n* Rails 允许我们定义自定义路由规则，从而提供命名路由。\n* 集成测试能够有效地模拟浏览器从一个页面跳转到另一个页面。\n\
  \n## 第 6 章 用户建模\n\n在第 5 章中，我们以创建一个创建新用户的占位页面结束（第 5.4 节）。在接下来的六章中，我们将实现这个注册页面隐含的承诺。在本章中，我们将迈出关键的第一步：为我们网站的用户创建一个*数据模型*，以及存储这些数据的方法。在第\
  \ 7 章中，我们将赋予用户注册我们的网站并创建用户资料页的能力。一旦用户可以注册，我们还将让他们登录和注销（第 8 章和第 9 章），并在第 10 章（节 10.2.1\
  \ 节）中学习如何保护页面不受不当访问。最后，在第 11 章和第 12 章中，我们将添加账户激活（以此验证有效的邮箱地址）和密码重置。第 6 章到第 12 章的内容共同构建了一个完整的\
  \ Rails 登录和身份验证系统。如你可能所知，Rails 有多种预构建的验证解决方案；框 6.1 解释了为什么至少在最初，自己实现可能是更好的主意。\n\n\
  ### 框 6.1：编写你自己的验证系统\n\n几乎所有的 Web 应用程序都需要某种登录和身份验证系统。因此，大多数 Web 框架都有选择，Rails 也不例外。验证系统的示例包括\
  \ Clearance、Devise 和 CanCan（以及 OpenID 或 OAuth）。询问为什么不使用现成解决方案而不是自己编写是合理的。首先，实践经验表明，大多数网站的身份验证需要大量的定制，而修改第三方产品往往很困难；此外，系统可能是“黑盒”，内部原理不明；当你自己编写时，更有可能理解它。此外，Rails\
  \ 的新增使得编写自定义系统变得简单。\n\n### 6.1 用户模型\n\n虽然接下来三章的终极目标是创建一个注册页面（如图 6.1 所示），但现在接受信息也无于事：我们目前还没有地方存放它们。因此，注册用户的第一步是创建一个捕获并存储信息的数据结构。\n\
  \n在 Rails 中，模型的默认数据结构自然地被称为*模型*（来自节 1.3.3 节中的 MVC）。Rails 对持久化问题的默认解决方案是使用*数据库*进行长期存储，而与数据库交互的默认库被称为\
  \ `Active Record`。这个名字源于“活动记录模式”。\n\n`Active Record` 提供了一系列方法用于创建、保存和查找数据对象，而无需使用关系型数据库的结构化查询语言\
  \ (`SQL`)。`SQL` 的正式发音是“ess-cue-ell”。Rails 有一个名为 `migrations` 的功能，允许用纯 Ruby 编写数据定义，而无需学习数据定义语言（DDL）。其效果是\
  \ Rails 几乎完全将你与数据库细节隔离开。在本书书中通过在开发中使用 SQLite 并在部署时使用 PostgreSQL（通过 Heroku）（节 1.5\
  \ 节），我们进一步发展了这一主题，以至于我们几乎不需要考虑 Rails 如何存储数据，即使对于生产环境应用程序也是如此。\n\n\n\n\n\n#### 6.1.1\
  \ 数据库迁移\n\n你可能记得在第 4.4.5 节中我们已经通过自定义的 `User` 类遇到过具有 `name` 和 `email` 属性的用户对象。该类是一个很有用的例子，但它缺乏关键的*持久化*属性：当我们在\
  \ Rails 控制台中创建一个 `User` 对象时，一旦我们退出控制，它就消失了。我们在这一节的目标是创建一个不会那么容易消失的用户模型。\n\n与第 4.4.5\
  \ 节中的 `User` 类一样，我们将开始对具有两个属性的用户进行建模：一个 `name` 和一个 `email` 地址，我们将后者用作唯一的用户名[³（我们将在第\
  \ 6.3 节中添加密码属性）。在列表 4.17 中，我们使用 Ruby 的 `attr_accessor` 方法实现了这一点：\n\n3. 通过使用电子邮件地址作为用户名，我们为未来与用户通信开启了可能（第\
  \ 11 章和第 12 章）。\n\n点击此处查看代码图示 image\n\n```ruby\nclass User\n  attr_accessor :name,\
  \ :email\n  .\n  .\n  .\nend\n```\n\n相比之下，当使用 Rails 对用户进行建模时，我们不需要显式地标识属性。如上面简单提到的，为了存储数据，Rails\
  \ 默认使用关系型数据库，它由由数据*行*组成的*表*组成，其中每行都包含数据属性的*列*。例如，为了存储具有名称和电子邮件的用户，我们将创建一个带有 `name`\
  \ 和 `email` 列的 `users` 表（每行对应一个用户）。此类表的示例出现在图 6.2 中，对应于图 6.3 所示的数据模型。（图 6.3 只是一个草图；完整的数据模型出现在图\
  \ 6.4 中。）通过将列命名为 `name` 和 `email`，我们将让 Active Record 为我们推导出 对象的属性。\n\n你可能记得在列表 5.38\
  \ 中，我们使用命令创建了一个 Users 控制器（以及一个 `new` 动作）：\n\n点击此处查看代码图示 image\n\n```bash\n$ rails\
  \ generate controller Users new\n```\n\n![image](img/image01091.jpeg)\n\n**图 6.2：**\
  \ `users` 表中的示例数据图。\n\n![image](img/image01092.jpeg)\n\n**图 6.3：** 用户数据模型的草图。\n\n\
  创建模型的对应命令是 `generate model`，我们可以用它生成一个具有 `name` 和 `email` 属性的 User 模型，如列表 6.1 所示。\n\
  \n**列表 6.1：** 生成 User 模型。\n\n点击此处查看代码图示 image\n\n```bash\n$ rails generate model\
  \ User name:string email:string\n      invoke  active_record\n      create     db/migrate/20160523010738_create_users.rb\n\
  \      create     app/models/user.rb\n      invoke    test_unit\n      create  \
  \    test/models/user_test.rb\n      create      test/fixtures/users.yml\n```\n\n\
  （注意，与控制器名称的复数约定相反，模型名称是单数的：是一个 *Users* 控制器，但是一个 *User* 模型。）通过传递可选参数 `name:string`\
  \ 和 `email:string`，我们告诉 Rails 我们想要的两个属性，以及这些属性应该是什么类型（在这种情况下是 `string`）。将此与在列表 3.6\
  \ 中包含动作名称进行比较。\n\n列表 6.1 中 `generate` 命令的结果之一是一个名为*迁移*（migration）的新文件。迁移提供更改数据库的方法。在列表\
  \ 6.2 中，`change` 包含一个 `change` 方法，该方法决定了对数据库进行的更改。\n\n列表 6.2 中的迁移使用了 Rails 的 `create_table`（第\
  \ 4.3.2 节），带有一个块，在这种情况下被称为 `t`（代表 table）。在块内部，`create_table` 方法使用 `t` 对象创建 `name`\
  \ 和 `email` 列，类型均为 `string`。块中的最后一行 `t.timestamps` 是一个特殊命令，它创建两个名为 `created_at`\
  \ 和 `updated_at` 的*魔法列*，这些时间戳会自动记录给定用户被创建和更新的时间。（我们将从第 6.1.3 节开始看到魔法列的具体示例。）\n\n\
  迁移文件的名称由生成迁移时的*时间戳*开头。在迁移的早期，文件名是以递增整数为缀的，如果协作团队中有多个程序员具有相同的迁移，会导致冲突。使用时间戳方便地避免了此类问题。\n\
  \n**列表 6.2：** `users` 的迁移\n\n```ruby\nclass CreateUsers < ActiveRecord::Migration[5.0]\n\
  \  def change\n    create_table :users do |t|\n      t.string :name\n      t.string\
  \ :email\n      t.timestamps\n    end\n  end\nend\n```\n\n我们可以使用 `db:migrate` 命令运行迁移，这被称为“向上迁移”（migrating\
  \ up）：\n\n```bash\n$ rails db:migrate\n```\n\n![image](img/image01094.jpeg)\n\n\
  **图 6.4：** 由列表 6.2 产生的用户数据模型。\n\n\n\n\n(你可能记得我们在第 2.2 节中类似的上下文中运行过这条命令。)第一次运行 `db:migrate`\
  \ 时，它会创建一个名为 `db/development.sqlite3` 的文件，这是一个 SQLite⁵ 数据库。我们可以通过 DB Browser for\
  \ SQLite 打开 `development.sqlite3` 来查看数据库的结构。（如果你正在使用云 IDE，应该先将数据库文件下载到本地磁盘，如图 6.5\
  \ 所示。）结果出现在图 6.6 中；请将其与图 6.4 中的图表进行对比。你可能会注意到图 6.6 中有一列在迁移中没有体现：`id` 列。正如第 2.2 节中要提到的，该列是自动创建的，并被\
  \ Rails 用于唯一标识每一行。\n\n5. 官方读音为“ess-cue-ell-ite”，尽管（错误的）读音“sequel-ite”也很常见。\n\n###\
  \ 练习题\n\n购买任何 Rails Tutorial 后，均可以在 railstutorial.org/solutions 免费获取练习题的解答。如需查看他人的答案并记录你自己的答案，请加入\
  \ learnenough.com/society 上的 Learn Enough Society。\n\n1. Rails 在 `db/` 目录下使用一个名为\
  \ `schema.db` 的文件来跟踪数据库结构（称为 *schema*，因此文件名也如此）。请检查你本地的 `db/schema.rb` 副本，并将其内容与列表\
  \ 6.2 中的迁移代码进行对比。\n\n2. 大多数迁移（包括本教程中的所有迁移）都是*可逆的*，这意味着我们可以通过一个名为 `db:rollback` 的单一命令进行“向下迁移”并撤销它们：\n\
  \n```\n$ rails db:rollback\n```\n\n运行此命令后，检查 `db/schema.rb` 以确认回滚是否成功。（参阅框 3.1 获取另一种用于反转迁移的技巧。）在底层，此命令执行\
  \ `drop_table` 命令以从数据库中删除 `users` 表。之所以有效，是因为 `change` 方法知道 `drop_table` 是 `create_table`\
  \ 的逆操作，这意味着可以轻松推导出回滚迁移。对于不可逆的迁移（例如删除数据库列的迁移），有必要定义独立的 `up` 和 `down` 方法来代替单一的 `change`\
  \ 方法。请阅读 Rails Guides 以获取更多关于迁移的信息。\n\n3. 再次执行 `rails db:migrate` 重新运行迁移。确认 `db/schema.rb`\
  \ 的内容已恢复。\n\n![image](img/image01095.jpeg)\n\n**图 6.5：** 从云 IDE 下载文件。\n\n![image](img/image01096.jpeg)\n\
  \n**图 6.6：** 带有新 `users` 表的 DB Browser for SQLite。\n\n#### 6.1.2 模型文件\n\n我们已经看到列表\
  \ 6.1 中的 User 模型生成器如何产生一个迁移文件（列表 6.2），并且我们在图 6.6 中看到了运行此迁移的结果：它通过创建一个带有 `id`、`name`、`email`、`created_at`\
  \ 和 `updated_at` 列的 `users` 表更新了名为 `development.sqlite3` 的文件。列表 6.1 还创建了模型本身。本部分的其余部分用于理解它。\n\
  \n我们首先查看 User 模型的代码，它位于 `app/models/` 目录下的 `user.rb` 文件中。委婉地说，它是非常紧凑（（列表 6.3](#part0015.xhtml_list6_3)）。\n\
  \n**列表 6.3：** 全新的 User 模型。\n\n```\napp/models/user.rb\n```\n\n点击此处查看代码图像\n\n```\n\
  class User < ApplicationRecord\nend\n```\n\n回想第 4.4.2 节，语法 `class User < ApplicationRecord`\
  \ 意味着 `User` 类*继承*自 `ApplicationRecord` 类，而该类又继承自 `ActiveRecord::Base`（图 2.18），因此\
  \ User 模型自动拥有 `ActiveRecord::Base` 的所有功能。\n\n### 练习题\n\n购买任何 Rails Tutorial 后，均可以在\
  \ railstutorial.org/solutions 免费获取练习题的解答。如需查看他人的答案并记录你自己的答案，请加入 learnenough.com/society\
  \ 上的 Learn Enough Society。\n\n1. 在第 4.4.2 节中，语法 `class User < ApplicationRecord`\
  \ 意味着 `User` 类*继承*自 `ApplicationRecord` 类，而该类又继承自 `ActiveRecord::Base`（图 2.18），因此\
  \ User 模型自动拥有 `ActiveRecord::Base` 的所有功能。\n\n2. 在第 4.4.2 节中，语法 `class User < ApplicationRecord`\
  \ 意味着 `User` 类*继承*自 `ApplicationRecord` 类，而该类又继承自 `ActiveRecord::Base`，因此 User 模型自动拥有\
  \ `ActiveRecord::Base` 的所有功能。\n\n#### 6.1.3 创建对象\n\n正如第 4.5 节所示，我们不想对沙盒进行更改：\n\n\
  ```\n$ rails db:rollback\n```\n\n在底层，此命令执行 `drop_table` 命令从数据库中删除 users 表。之所以有效，是因为\
  \ `change` 方法知道 `drop_table` 是 `create_table` 的逆操作，这意味着可以轻松推导出回滚迁移。\n\n对于不可逆的迁移（例如删除数据库列的迁移），有必要定义独立的\
  \ `up` 和 `down` 方法来代替单一的 `change` 方法。请阅读 Rails Guides 以获取更多关于迁移的信息。\n\n3. 再次执行 `rails\
  \ db:migrate` 重新运行迁移。确认 `db/schema.rb` 的内容已恢复。\n\n\n\n\n```\n[\"updated_at\", 2016-05-23\
  \ 19:05:58 UTC]]\n(0.1ms) RELEASE SAVEPOINT active_record_1\n=> true\n```\n\n`save`\
  \ 方法在执行成功时返回 `true`，否则返回 `false`。（目前，所有的保存操作都应该成功，因为还没有任何验证逻辑；我们将在第 6.2 节看到某些操作会失败的情况。）作为参考，Rails\
  \ 控制台还会显示与 `user.save` 对应的 SQL 命令（即 `INSERT INTO \"users\"`…）。在本书书中，我们几乎不需要用到原始\
  \ SQL，⁶，我从现在起将省略对 SQL 命令的讨论，但通过阅读与 Active Record 命令对应的 SQL 语句，你可以学到很多东西。\n\n6. 唯一的例外是第\
  \ 14.3.3 节\n\n你可能已经注意到新用户对象的 `id` 属性以及魔法列 `created_at` 和 `updated_at` 属性具有 `nil`\
  \ 值。让我们看看我们的 `save` 是否改变了什么：\n\n点击此处查看代码图片\n\n```\n>> user\n=> #<User id: 1, name:\
  \ \"Michael Hartl\", email: \"mhartl@example.com\", created_at: \"2016-05-23 19:05:58\"\
  , updated_at: \"2016-05-23 19:05:58\">\n```\n\n我们看到 `id` 被赋予了值 `1`，而魔法列被赋予了当前的日期和时间。⁷目前，创建和更新的时间戳是相同的；我们将在第\
  \ 6.1.5 节看到它们的不同。\n\n7. 时间戳记录在协调世界时（UTC）中，对于大多数实际用途，它与格林威治标准时间相同。来自 NIST 时间和频率常见问题：**问：**\
  \ 为什么使用 UTC 作为协调世界时的缩写而不是 CUT？**答：** 1970 年，协调世界时是由国际电信联盟（ITU）内部的一个国际技术专家顾问小组设计的。ITU\
  \ 认为指定一个单一缩写供所有语言使用是最好的，以尽可能地减少混淆。由于无法对使用英语语序 CUT 或法语语序 TUC 达成共识，因此选择了缩写 UTC 作为折中方案。\n\
  \n与第 4.4.5 节中的 User 类一样，User 模型的实例允许使用点符号表示法访问其属性：\n\n点击此处查看代码图片\n\n```\n>> user.name\n\
  => \"Michael Hartl\"\n\n>> user.email\n=> \"mhartl@example.com\"\n\n>> user.updated_at\n\
  => Mon, 23 May 2016 19:05:58 UTC +00:00\n```\n\n正如我们将在第 7 章中看到的，像上面那样分两步创建并保存模型通常是很方便的，但\
  \ Active Record 也允许你通过 `User.create` 将它们合并为一步：\n\n点击此处查看代码图片\n\n```\n>> User.create\
  \ (name: \"A Nother\", email: \"another@example.org\")\n#<User id: 2, name: \"A\
  \ Nother\", email: \"another@example.org\", created_at: \"2016-05-23 19:18:46\"\
  , updated_at: \"2016-05-23 19:18:46\">\n\n>> foo = User.create(name: \"Foo\", email:\
  \ \"foo@bar.com\")\n#<User id: 3, name: \"Foo\", email: \"foo@bar.com\", created_at:\
  \ \"2016-05-23 19:19:06\", updated_at: \"2016-05-23 19:19:06\">\n```\n\n注意，`User.create`\
  \ 返回的不是 `true` 或 `false`，而是 User 对象本身，我们可以选择性地将其赋值给变量（例如上面第二个命令中的 `foo`）。\n\n`create`\
  \ 的反操作是 `destroy`：\n\n点击此处查看代码图片\n\n```\n>> foo.destroy\n(0.1ms) SAVEPOINT active_record_1\n\
  SQL (0.2ms) DELETE FROM \"users\" WHERE \"users\".\"id\" = ? [\"id\", 3]\n(0.1ms)\
  \ RELEASE SAVEPOINT active_record_1\n=> #<User id: 3, name: \"Foo\", email: \"foo@bar.com\"\
  , created_at: \"2016-05-23 19:19:06\", updated_at: \"2016-05-23 19:19:06\">\n```\n\
  \n与 `create` 类似，`destroy` 也返回该对象，尽管我不记得曾经用过 `destroy` 的返回值。此外，被销毁的对象仍然存在内存中：\n\n\
  点击此处查看代码图片\n\n```\n>> foo\n=> #<User id: 3, name: \"Foo\", email: \"foo@bar.com\"\
  , created_at: \"2016-05-23 19:19:06\", updated_at: \"2016-05-23 19:19:06\">\n```\n\
  \n那么，我们如何知道是否真的删除了一个对象？对于已保存且未销毁的对象，我们如何检索它们？为了回答这些问题，我们需要学习如何使用 Active Record 来查找对象。\n\
  \n### 练习题\n\n购买任何教程后，可在 railstutorial.org 免费获取练习题答案。查看他人的答案并记录自己的答案，请加入 Learn Enough。1.\
  \ 确认 `user.name` 是什么类型。\n2. `created_at` 和 `updated_at` 是什么类型的？\n\n#### 6.1.4 查找对象\n\
  \nActive Record 提供了几种查找对象的方法。让我们使用它们来查找未被销毁的第一个用户：点击此处查看代码图片\n\n```\n>> User.find(1)\n\
  => #<User id: 1, name: \"Michael Hartl\", email: \"mhartl@example.com\", created_at:\
  \ \"2016-05-23 19:05:58\", updated_at: \"2016-05-23 19:05:58\">\n```\n\n我们将 `id`\
  \ 传递给 `find`，看看带有 `3` 的用户是否存在于数据库中：点击此处查看代码图片\n\n```\n>> User.find(3)\nActiveRecord::NotFound:\
  \ Couldn't find User with ID=3\n```\n\n由于我们在第 6.1.3 节中删除了第三个用户，`find` 找不到它。相反，它会抛出一个异常——在这种情况下，由于不存在的\
  \ `id` 导致 `find` 抛出异常。⁸\n\n8. 异常处理是一个高级主题，我们在书中并不经常需要它们。但它们很重要，我建议在第 14.4.1 节中通过\
  \ Ruby 异常（通过 learnenough.com）来学习它们。\n\n除了通用的 `find` 之外，Active Record 还允许我们通过特定属性查找用户：点击此处查看代码图片\n\
  \n```\n>> User.find_by(email: \"mhartl@example.com\")\n=> #<User id: 1, name: \"\
  Michael Hartl\", email: \"mhartl@example.com\", created_at: \"2016-05-23 19:05:58\"\
  , updated_at: \"2016-05-23 19:05:58\">\n```\n\n由于我们将使用电子邮件地址作为用户名，当我们学习如何让用户登录网站时（第\
  \ 7 章），这种查找将非常有用。如果你担心在用户很多时 `find_by` 效率低下，那么你很有远见；我们将在第 6.2.5 节中介绍这个问题以及通过数据库索引的解决方案。\n\
  \n我们将用两种更通用的查找用户的方法结束。首先是 `first`：点击此处查看代码图片\n\n```\n>> User.first\n=> #<User id:\
  \ 1, name: \"Michael Hartl\", email: \"mhartl@example.com\", created_at: \"2016-05-23\
  \ 19:05:58\", updated_at: \"2016-05-23 19:05:58\">\n```\n\n自然，`first` 只返回数据库中的第一个用户。还有\
  \ `all`：点击此处查看代码图片\n\n```\n>> User.all\n=> #<ActiveRecord::Relation [#<User id:\
  \ 1, name: \"Michael Hartl\", email: \"mhartl@example.com\", created_at: \"2016-05-23\
  \ 19:05:58\", updated_at: \"2016-05-23 19:05:58\">, #<User id: 2, name: \"A Nother\"\
  , email: \"another@example.org\", created_at: \"2016-05-23 19:18:46\", updated_at:\
  \ \"2016-05-23 19:18:46\">\n```\n\n\n\n\n\n`email: \"another@example.org\", created_at:\
  \ \"2016-05-23 19:18:46\",`\n\n`updated_at: \"2016-05-23 19:18:46\">]>`\n\n正如控制台输出所示，`User.all`\
  \ 将数据库中的所有用户作为 `ActiveRecord::Relation` 类的对象返回，它在实际上上于数组（第 4.3.1 节）。\n\n### 练习题\n\
  \n购买任何 Rails Tutorial 后，可以在 railstutorial.org/aw-solutions 免费获取练习题。要查看他人的答案并记录自己的答案，请加入\
  \ learnenough.com/society 的 Learn Enough Society。\n\n1. 通过 `name` 查找用户。确认 `find_by_name`\
  \ 同样有效。（在遗留的 Rails 应用程序中，你经常遇到这种旧风格的 `find_by` 方法。）\n\n2. 对于大多数实际用途，`User.all` 的行为像一个数组，但请确认它实际上是\
  \ `User::ActiveRecord_Relation` 类。\n\n3. 确认你可以通过传递 `length` 方法来找到 `User.all` 的长度（第\
  \ 4.2.3 节）。Ruby 根据对象的行为而非其正式类类型来操作对象的能力被称为“鸭子类型”（duck typing），这基于格言：“如果它看起来像像鸭子，叫起来也像鸭子，那么它可能就是只鸭子。”\n\
  \n#### 6.1.5 更新用户对象\n\n一旦创建了对象，通常想要更新它们。有两种基本方法可以实现。首先，我们可以单独分配属性，就像我们在 第 4.4.5\
  \ 节 中做的那样：\n\n点击此处查看代码图片\n\n```\n>> user             # 提醒一下用户的属性\n=> #<User id:\
  \ 1, name: \"Michael Hartl\", email: \"mhartl@example.com\",\ncreated_at: \"2016-05-23\
  \ 19:05:58\", updated_at: \"2016-05-23 19:05:58\">\n>> user.email = \"mhartl@example.net\"\
  \n=> \"mhartl@example.net\"\n>> user.save\n=> true\n```\n\n注意，最后一步对于将更改写入数据库是必要的。我们可以通过使用\
  \ `reload` 来查看如果不 save 会发生什么，它会根据数据库信息重新加载对象：\n\n点击此处查看代码图片\n\n```\n>> user.email\n\
  => \"mhartl@example.net\"\n>> user.email = \"foo@bar.com\"\n=> \"foo@bar.com\"\n\
  >> user.reload.email\n=> \"mhartl@example.net\"\n```\n\n现在我们通过运行 `user.save` 更新了用户，魔法列（magic\
  \ columns）已经正如 第 6.1.3 节 中承诺的那样发生了变化：\n\n点击此处查看代码图片\n\n```\n>> user.created_at\n\
  => \"2016-05-23 19:05:58\"\n>> user.updated_at\n=> \"2016-05-23 19:08:23\"\n```\n\
  \n更新多个属性的第二种方法是使用 `update_attributes`：⁹\n\n[9.] `update_attributes` 方法是较短 `update`\
  \ 方法的别名，但我更喜欢较长的版本，因为它与单数方法 `update_attribute` 相似。\n\n点击此处查看代码图片\n\n```\n>> user.update_attributes(name:\
  \ \"The Dude\", email: \"dude@abides.org\")\n=> true\n>> user.name\n=> \"The Dude\"\
  \n>> user.email\n=> \"dude@abides.org\"\n```\n\n`update_attributes` 方法接受一个属性哈希（hash），并在成功时一步到位完成更新和保存（返回\
  \ `true` 表示保存已通过）。注意，如果任何验证失败，例如在保存记录时需要密码（如在 第 6.3 节 中实现），则对 `update_attributes`\
  \ 的调用将失败。如果我们只需要更新单个属性，使用单数的 `update_attribute` 则可以绕过此限制：\n\n点击此处查看代码图片\n\n```\n\
  >> user.update_attribute(:name, \"El Dingo\")\n=> true\n>> user.name\n=> \"El Dingo\"\
  \n```\n\n### 6.2 验证\n\n我们在 第 6.1.3 节 中创建的 `User` 模型具有 `name` 和 `email` 属性，但我们想要强制某些约束。例如，我们不应该允许\
  \ `name` 为空或 `email` 格式无效。\n\n验证（Validations）允许我们在数据保存到数据库之前确保符合某些标准。在本节中，我们将涵盖常见的验证：`presence`（存在性）、`length`（长度）、`format`（格式）和\
  \ `uniqueness`（唯一性）。\n\n#### 6.2.1 有效性测试\n\n正如框 3 所述，测试驱动开发并不是所有工作的正确工具，但模型验证正是适合\
  \ TDD 的功能类型。如果不编写测试并让其通过，很难确定验证是否完全按照我们预期的方式工作。\n\n为了开始，我们首先编写一个测试来确保初始对象是有效的。这在\
  \ 列表 6.1 中产生了一个初始测试，尽管在这种情况下它几乎是空的。\n\n```\ntest \"the truth\" do\n  assert true\n\
  end\n```\n\n为了编写有效对象的测试，我们将使用 `setup` 方法（在第 3 章 中简要讨论过）创建一个初始 模型对象 `@user`，它会在每个测试之前自动运行。因为\
  \ `@user` 是实例变量，它在所有测试中都是可用的，我们可以使用 `valid?` 方法测试其有效性。结果显示在 列表 6.5 中。\n\n```ruby\n\
  def setup\n  @user = User.new(name: \"Example User\", email: \"user@example.com\"\
  )\nend\n\ntest \"should be valid\" do\n  assert @user.valid?\nend\n```\n\n\n\n\n\
  \nListing 6.5 使用了普通的 `assert` 方法，在这种情况下，如果 `@user.valid?` 返回 `true` 则测试通过，如果返回 `false`\
  \ 则测试失败。\n\n由于我们的 `User` 模型目前没有任何验证规则，初始测试应该通过：\n\n**代码列表 6.6：`GREEN`**\n\n* * *\n\
  \n```\n$ rails test:models\n```\n\n* * *\n\n在这里，我们使用了 `rails test:models` 来仅运行模型测试（对比\
  \ 第 5.3.4 节 中的 `rails test:integration`）。\n\n### 练习\n\n购买任何 Rails Tutorial 均可在 railstutorial.org/solutions\
