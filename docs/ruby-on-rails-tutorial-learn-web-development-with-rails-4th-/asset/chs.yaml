  \ ImageMagick，例如在 Mac 上使用 `brew install imagemagick` 或在 Ubuntu 上使用 `sudo apt-get\
  \ install imagemagick`。\n\n**图 13.22：** 经过调整大小的图片。\n\n\n\n\n\n2. 如果你已经在列表 13.63\
  \ 中完成了图片上传测试，此时你的测试套件可能会给出一个令人困惑的错误信息。通过使用列表 13.68 所示的初始化文件配置 `CarrierWave` 在测试中跳过图片缩放，即可解决此问题。\n\
