  \ < ActionDispatch::IntegrationTest\n  test \"should get home\" do\n    get static_pages_home_url\n\
  \    assert_response :success\n  end\n\n  test \"should get help\" do\n    get static_pages_help_url\n\
  \    assert_response :success\n  end\n\n  test \"should get about\" do\n    get\
