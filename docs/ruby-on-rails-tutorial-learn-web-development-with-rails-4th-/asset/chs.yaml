  \ 标题所示，测试套件仍然是 **RED**，这是由于密码长度验证（列表 6.42）因列表 10.1 中的密码和确认为空而失败导致的。为了让测试通过，我们需要在密码为空时对验证做一个例外。我们可以通过向\
