  \ `is_logged_in?` 一样，我们将在[Listing 9.24] 中定义测试助手 `log_in_as` 来避免这个问题。\n\n**Listing\
  \ 8.26：** 测试内部用于判断登录状态的布尔方法。\n\n```ruby\ntest/test_helper.rb\n```\n\n[点击此处查看代码图片]\n\
