  \ (Listing 10.62)。顺便提一下，Figure 10.16](#part0019.xhtml_list10_16) 中示例用户的顺序可能会有所不同，在我的系统上与本地版本不匹配，因为我们没有在从数据库检索用户时指定默认排序，因此当前顺序取决于数据库。这对于用户来说意义不大，但对于微贴（microposts）来说如此，我们将在\
  \ 13.1.4 部分进一步解决这个问题。\n\n![image](img/image1131.jpeg)\n\n**图 10.16：** 生产环境中的示例用户。\n\
  \n#### 10.5.1 本章学到了什么\n\n• 用户可以使用表单进行更新，表单会向 `update` 操作发送 PATCH 请求。\n• 通过强参数确保更新的安全。\n\
  • 过滤器提供了在执行特定控制器操作之前运行方法的标准方式。\n• 我们使用过滤器实现了授权。\n• 授权测试既使用了低级命令直接向控制器操作提交特定的 HTTP\
  \ 请求，也使用了高级集成测试。\n• 友好跳转会在用户登录后将其重定向到他们想去的地方。\n• 用户索引页显示所有用户，每次一页。\n• Rails 使用标准文件\
  \ `db/seeds.rb` 通过 `rails:seed` 为数据库填充示例数据。\n• 执行 `render @users` 会自动对集合中的每个用户调用\
  \ `_user.html.erb` 部分。\n• 模型中名为 `admin` 的布尔属性会自动为用户对象创建一个 `admin?` 布尔方法。\n• 管理员可以通过点击删除链接向\
  \ Users 控制器的 `destroy` 操作发送 DELETE 请求，从而删除用户。\n• 我们可以在 fixtures 中嵌入 Ruby 来创建大量的测试用户。\n\
  \n\n\n\n\n目前，新注册的用户可以立即访问其账户（第 7 章）；在在本章中，我们将实现一个账户激活步骤，以验证用户控制着他们注册时使用的电子邮件地址。¹\
  \ 这将涉及与用户关联激活令牌（activation token）和摘要（digest），向用户发送一封包含该令牌链接的电子邮件，并在用户点击链接后激活用户。在第\
  \ 12 章中，我们将应用类似的思路，允许用户在忘记密码时进行重置。这两个功能中的每一个都将涉及创建一个新的资源（resource），让我们有机会看到更多关于控制器、路由和数据库迁移的示例。在此过程中，我们还将有机会学习如何在\
  \ Rails 的开发环境和生产环境中发送电子邮件。\n\n1. 本章与其他章节是独立的，除了在代码列表 11.6 中生成的邮件发送器（mailer）外，该邮件发送器用于第\
  \ 12 章）。读者可以快速跳转到第 12 章或第 13 章而不会产生太大的中断，尽管由于与本章有大量重叠，跳转到前者将更具挑战性。\n\n我们处理账户激活的策略与用户登录（第\
  \ 8.2 节\n\n2. 我们也可以改用用户的 id，因为它已经暴露在应用程序的 URL 中了，但使用电子邮件地址更具前瞻性，以防我们出于某种原因想要混淆用户\
  \ id（例如，为了防止竞争对手知道我们的应用程序有多少用户）。\n\n4. 当用户点击链接时，通过电子邮件地址找到用户，然后通过与激活摘要比对来验证令牌。\n\
  5. 如果用户通过了验证，将状态从“未激活”改为“已激活”。\n\n**表 11.1：** 登录、记住、账户激活和密码重置之间的类比。\n\n![image](img/image01289.jpeg)\n\
  \n由于与密码和记住令牌（remember tokens）相似相似，我们将能够为账户激活（以及密码重置）重用许多相同的思路，包括 `User.digest` 和\
  \ `User.new_token` 方法以及 `user.authenticated?` 方法的修改版本。表 11.1 说明了这种类比（包括第 12 章中的密码重置）。\n\
  \n在第 11.1 节中，我们将为账户激活创建一个资源和数据模型（第 11.1 节），并在第 11.2 节中我们将添加一个用于发送账户激活邮件的*邮件发送器*（mailer）（第\
  \ 11.2 节）。我们将在第 11.3 节中实现实际的账户激活，包括表 11.1 中 `authenticated?` 方法的通用版本。\n\n### 11.1\
  \ 账户激活资源\n\n与会（第 8.1 节）一样，我们将账户激活建模为一个资源，尽管它们不会与 Active Record 模型关联。相反，我们将相关数据（包括激活令牌和激活状态）包含在\
  \ User 模型本身中。\n\n由于我们将账户激活视为一种资源，因此我们将通过标准的 REST URL 与它们交互。激活链接将修改用户的激活状态，对于此类修改，标准的\
  \ REST 做法是向 `update` 动作发出 PATCH 请求（表 7.1）。然而，由于激活链接需要在电子邮件中发送，因此它将涉及普通的浏览器点击，这会发出\
  \ GET 请求而不是 PATCH。这一设计限制意味着我们不能使用 `update` 动作，但我们将采取次优的方案，即使用 `edit` 动作，因为它可以响应\
  \ GET 请求。\n\n像往常一样，我们将为新功能创建一个主题分支（topic branch）：\n\n点击此处查看代码图\n\n```\n$ git checkout\
  \ -b account-activation\n```\n\n#### 11.1.1 账户激活控制器\n\n与 Users 和 Sessions 一样，账户激活的动作（在本例中是唯一的动作）将位于\
  \ AccountActivations 控制器中，我们可以如下生成它：³](#part0020.xhtml_ch11en3) 3. 由于我们将使用 `edit`\
  \ 动作，可以在命令行中包含 `edit`，这将生成一个视图和一个测试，而我们并不需要。\n\n点击此处查看代码图\n\n```\n$ rails generate\
  \ controller AccountActivations\n```\n\n正如我们在第 11.2 节中将看到的，激活邮件将涉及如下形式的 URL：\n\n\
  点击此处查看代码图\n\n```\nedit_account_url(token, ...)\n```\n\n这意味着我们需要为 `edit` 动作创建一个命名路由。我们可以通过代码列表\
  \ 11.1 所示的 `resources` 行来安排，它提供了表 11.2 所示的 RESTful 路由。\n\n**表 11.2：**代码列表 11.1 中\
  \ Account Activations 提供的 RESTful 路由。\n\n![image](img/image1205.jpeg)\n\n**列表 11.1：**\
  \ 为 Activations 动作添加路由。\n\nconfig/routes.rb\n\n点击此处查看代码图\n\n````ruby\nRails.application.routes.draw\
  \ do\n  root 'static_pages#home'\n  get 'help', to: 'static_pages#help'\n  get 'about',\
  \ to: 'static_pages#about'\n  get 'contact', to: 'static_pages#contact'\n  get 'signup',\
  \ to: 'users#new'\n  get 'login', to: 'sessions#new'\n  post 'login', to: 'sessions#create'\n\
  \  delete 'logout', to: 'sessions#destroy'\n  resources :users\n  resources :account_activations,\
  \ only: [:edit]\nend\n```\n\n* *\n\n我们将在第 11.3.2 节中定义 `edit` 动作本身，在完成 Account Activations\
  \ 数据模型和邮件发送器之后。\n\n#### 11.1.2 账户激活数据模型\n\n正如引言中所述，我们需要一个用于激活邮件的唯一激活令牌。一种可能性是使用既存储在数据库中又包含在激活\
  \ URL 中的字符串，但如果我们的数据库被破解，这会引发安全担忧。例如，访问数据库的攻击者可以立即激活新创建的账户（从而以用户身份登录），然后更改密码以获取控制权。⁴\n\
  \n4. 正由于这个原因，我们不会使用 Rails 5 添加的（可能命名有误的）`has_secure_token` 功能，该功能会将相应的令牌以未哈希明文存储在数据库中。\n\
  \n\n\n\n\n为了防止此类情况，我们将遵循密码（第 6 章）的示例，通过将一个公开的虚拟属性与保存到数据库的安全哈希摘要配对来记住令牌。这样，我们可以使用\n\
  \n`user.activation_token`\n\n访问激活令牌，并使用如下代码对用户进行身份验证：\n\n点击此处查看代码图像\n\n```\nuser.authenticated?(:activation,\
  \ token)\n```\n\n（这需要修改在列表 9.6 中定义的 `authenticated?` 方法。）\n\n我们还会在 `User` 模型中添加一个名为\
  \ `activated` 的布尔属性，这将允许我们使用在第 10.4.1 节中看到的类似的自动生成的布尔方法来测试用户是否已激活：\n\n```\nif user.activated?\
  \ ...\n```\n\n最后，虽然我们不会在教程中使用它，但我们还会记录激活的时间和日期，以备将来参考。。完整的数据模型出现在图 11.1 中。\n\n从图\
  \ 11.1 中添加数据模型的迁移在命令行中添加了所有三个属性：\n\n点击此处查看代码图像\n\n```\n$ rails generate migration\
  \ add_activation_to_users \\\n> activation_digest:string activated:boolean activated_at:datetime\n\
  ```\n\n（如第 8.2.4 节所示，第二行上的 `>` 是 shell 自动插入的“续行”字符，不应逐字输入。）与 `admin` 属性（列表 10.54）一样，我们将为\
  \ `activated` 属性添加默认布尔值 `false`，如列表 11.2 所示。\n\n**列表 11.2：** 账户激活的迁移（带新增索引）。\n\n\
  `db/migrate/[timestamp]_add_activation_to_users.rb`\n\n点击此处查看代码图像\n\n```ruby\nclass\
  \ AddActivationToUsers < ActiveRecord::Migration[5.0]\n  def change\n    add_column\
  \ :users, :activation_digest, :string\n    add_column :users, :activated, :boolean,\
  \ default: false\n    add_column :users, :activated_at, :datetime\n  end\nend\n\
  ```\n\n然后我们按照通常方法应用迁移：\n\n```bash\n$ rails db:migrate\n```\n\n### 激活令牌回调\n\n由于每个新注册的用户都需要激活，因此在创建用户对象之前，我们应该为每个用户对象分配激活令牌和摘要。我们在第\
  \ 6.2.5 节中见过过类似的思路，在那里我们需要在将用户保存到数据库之前将电子邮件地址转换为小写。在那种情况下，我们使用了 `before_save` 回调结合\
  \ `downcase` 方法（列表 6.32）。`before_save` 回调在对象保存之前会被自动调用，这包含了对象的创建和更新，但在激活摘要的情况下，我们只希望在用户创建时触发回调。这需要一个\
  \ `before_create` 回调，我们将如下定义：\n\n![image](img/image01251.jpeg)\n\n**图 11.1：** 添加了账户激活属性的\
  \ User 模型。\n\n点击此处查看代码图像\n\n```\nbefore_create :create_activation_digest\n```\n\n\
  这段代码被称为*方法引用*（method reference），它安排 Rails 查找一个名为 `create_activation_digest` 的方法并在创建用户之前运行它。（在列表\
  \ 6.32 中，我们向 `before_save` 传递了一个显式的块，但方法引用技术通常更受青。）因为 `create_activation_digest`\
  \ 方法本身仅在 User 模型内部使用，所以没有必要将其暴露给外部用户；正如我们在第 7.3.2 节中看到的，Ruby 的实现方法是使用 `private`\
  \ 关键字：\n\n点击此处查看代码图像\n\n```ruby\nprivate\n\n  def create_activation_digest\n   \
  \ # 创建令牌和摘要。\n  end\n```\n\n在类中 `private` 之后定义的所有方法都会被自动隐藏，如此控制会话所示：\n\n点击此处查看代码图像\n\
  \n```bash\n$ rails console\n>> User.first.create_activation_digest\nNoMethodError:\
  \ private method 'create_activation_digest' called for #<User>\n```\n\n`before_create`\
  \ 回调的目的是分配令牌和相应的摘要，我们可以如下所示实现：\n\n点击此处查看代码图像\n\n```ruby\nself.activation_token =\
  \ User.new_token\nself.activation_digest = User.digest(activation_token)\n```\n\n\
  这段代码简单地重用了用于记住的令牌和摘要，我们可以通过与列表 9.3 对比看到：\n\n点击此处查看代码图像\n\n```ruby\n# 在持久化会话中记住用户\n\
  def remember\n  self.remember_token = User.new_token\n  update_attribute(:digest)\n\
  end\n```\n\n主要的区别在于后者使用了 `update_attribute`。原因是 `remember` 是针对已存在的用户的，而 `before_create`\
  \ 在创建用户*之前*发生，此时还没有属性可以更新。上述讨论产生了列表 11.3 所示的 User 模型。注意我们为模型添加了 `attr_accessor`。由于激活令牌的性质，`activation_digest`\
  \ 与数据库关联。\n\n**列表 11.3：** 为 User 模型添加激活代码。\n\n`app/models/user.rb`\n\n点击此处查看代码图像\n\
  \n```ruby\nclass User < ApplicationRecord\n  attr_accessor :remember_token, :activation_token\n\
  \  before_save :downcase_email\n  before_create :create_activation_digest\n  validates\
  \ :name, presence: true, length: { maximum: 50 }\n\n  private\n\n  # 将电子邮件转换为小写。\n\
  \  def downcase_email\n    self.email = email.downcase\n  end\n\n  # 创建并分配令牌和摘要。\n\
  \  def create_activation_digest\n    self.activation_token = User.new_token\n  \
  \  self.activation_digest = User.digest(activation_token)\n  end\nend\n```\n\n###\
  \ 种子和固定用户\n\n在继续之前，我们还应该更新我们的种子数据和固定，以便我们的示例和测试用户初始处于激活状态，如列表 11.4 和列表 11.5 所示。（`Time.zone.now`\
