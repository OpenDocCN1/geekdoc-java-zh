  \n### 3.3 开始测试\n\n在我们为示例应用程序创建并填充了首页和帮助页面（Section 3.2.2）之后，现在我们还要添加一个关于（About）页面。在进行此类更改时，良好的做法是编写一个自动化测试以验证该功能是否正确实现。在构建应用程序的过程中开发的测试套件，既充当了安全网，也充当了应用程序源代码的可执行文档。如果操作得当，编写测试虽然需要额外的代码，但它な能让我们开发得更快，因为我们花在追踪\
  \ bug 上的时间会更少。不过，只有在我们擅长编写测试后，这一点才成立，这也是为什么尽尽早开始练习的原因之一。\n\n尽管几乎所有的 Rails 开发者都认为测试是一个好主意，但在细节上存在着不同的意见。对于测试驱动开发（TDD）的使用，7\
  \ 存在尤为激烈的辩论，这是一种测试技术，程序员先编写失败的测试，然后编写应用程序代码使测试通过。Ruby on Rails^™ 教程采取了一种轻量级、直观的测试方法，在方便时采用\
  \ TDD，但对其并不固守教条主义（Box 3.3）。\n\n7. 例如，参见 Rails 创始人 David Heinemeier Hansson 写的“TDD\
  \ 已死，测试万岁”。\n\n***\n\n#### Box 3.3: 何时测试\n\n在决定何时以及如何测试时，理解为什么要测试是有帮助的。在我看来，编写自动化测试有三个主要优点：\n\
  \n1. 测试可以防止回归（regression），即原本正常的功能由于某些原因停止了工作。\n2. 测试让我们更有信心地对代码进行重构（即在不改变功能的情况下改变其形式）。\n\
  3. 测试充当应用程序代码的客户端，从而帮助其设计以及与系统其他部分的交互。\n\n尽管上述优点没有哪一项要求先编写测试，但在许多情况下，测试驱动开发（TDD）是你工具箱中一个非常有价值的工具。决定何时以及如何测试在某种程度上取决于你对编写测试的熟悉程度；许多开发者发现，随着他们越来越擅长编写测试，他们越倾向于先编写测试。这还取决于测试相对于应用程序代码的难度、所需功能的已知精确程度，以及该功能在未来崩溃的概率。\n\
  \n在这种背景下，拥有一套关于何时应该先测试（或进行测试）的指南是有帮助的。以下是基于我个人经验的一些建议：\n\n* 当某个测试与应用程序测试相比特别短或简单时，，倾向于先编写测试。\n\
  * 当预期行为还不完全清晰时，倾向于先编写应用程序代码；然后编写测试将结果固化。\n* 因为安全性是重中之重，请倾向于先编写测试。\n* 每当发现 bug 时，编写一个测试来重现它并防止回归，然后编写应用程序代码来修复它。\n\
  * 避免为未来可能更改的代码（如 HTML 结构）编写测试。\n* 在重构代码之前编写测试，重点关注容易出错且特别可能崩溃的代码。\n\n在实践中，上述指南意味着我们通常先编写控制器和模型测试，然后编写集成测试（测试跨模型、视图和控制器的功能的测试）。当我们编写不是特别脆弱或容易出错，或者可能会更改（如视图）的应用程序代码时，我们通常会跳过测试。\n\
  \n***\n\n我们主要的测试工具将是控制器测试（从本节开始）、模型测试（从第 6 章开始）以及集成测试（从第 7 章开始）。集成测试尤其强大，因为它们允许我们模拟用户使用网络浏览器与应用程序交互的操作。集成测试最终将成为我们的主要测试技术，但控制器测试为我们提供了一个更容易的起点。\n\
  \n#####3.3.1 我们的第一个测试\n\n现在是为我们的应用程序添加一个关于页面了。正如我们将看到的，这个测试既短又简单，所以我们将遵循 Box 3.3\
  \ 中的指南先编写测试。然后我们将使用这个失败的测试来驱动应用程序代码的编写。\n\n开始测试可能是具有挑战性的，需要大量的 Rails 和 Ruby 知识。幸运的是，Rails\
  \ 已经为我们完成了困难的部分，Listing 3.6 自动生成了一个测试文件让我们开始：\n\n```bash\n$ ls test/controllers/\n\
  static_pages_controller_test.rb\n```\n\n让我们来看看它（Listing 3.13）。\n\n**Listing 3.13:**\
  \ 控制器的默认测试。`GREEN`\n`test/controllers/static_pages_controller_test.rb`\n\n***\n\n\
  ```ruby\nrequire 'test_helper'\n\nclass StaticPagesControllerTest < ActionDispatch::IntegrationTest\n\
  \  test \"should get home\" do\n    get static_pages_home_url\n    assert_response\
  \ :success\n  end\n\n  test \"should get help\" do\n    get static_pages_help_url\n\
  \    assert_response :success\n  end\nend\n```\n\n***\n\n现在详细理解 Listing 3.13 中的语法，但我们可以看到有两个测试，对应于我们在\
  \ Listing 3.6 命令行中包含的每个控制器操作。\n\n\n\n\n\n按照要求，最初我们的测试套件是可以通过的（`GREEN`）。（除非你添加了第\
  \ 3.6.1 节中的`minit` reporters，否则你实际上不会看到绿色，但即使不涉及具体的颜色，这个术语也是常用的。）在某些系统中，测试可能需要很长时间才能启动，这是由于两个因素：(1)\
  \ 启动 `Spring server` 以预加载 Rails 环境的部分内容，这只发生在第一次；以及 (2) 与 Ruby 启动时间相关的开销。（当按照第 3.6.2\
  \ 节的建议使用 `Guard` 时，第二个因素会得到改善。）\n\n### 3.3.2 Red\n\n如框 3.3 所示，测试驱动开发涉及首先编写一个会失败的测试，编写使该测试通过所需的应用程序代码，然后在必要时重构代码。由于许多测试工具用红色表示失败的测试，用绿色表示通过的测试，这种序列有时被称为“红、绿、重构”循环。在本节中，我们将完成该循环的第一步，通过编写一个失败的测试来达到\
  \ `RED`。然后我们将在第 3.3.3 节中达到 `GREEN`，并在第 3.4.3 节中重构。⁸\n\n8. 默认情况下，`rails test` 在测试失败时显示红色，但在测试通过时不显示绿色。要安排真正的红-绿循环，请参见第\
  \ 3.6.1 节。\n\n我们的第一步是为 About 页面编写一个失败的测试。遵循列表 3.13 中的模型，你可能已经猜出正确的测试，它在列表 3.15 中显示。\n\
  \n**列表 3.15：** 关于 About 页面的测试。`RED`\n\n```\ntest/controllers/static_pages_controller_test.rb\n\
