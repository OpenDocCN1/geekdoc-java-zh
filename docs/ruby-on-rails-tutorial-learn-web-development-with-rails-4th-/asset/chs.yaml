  \n**代码列表 14.27：`GREEN`**\n\n* * *\n\n`$ rails test`\n\n* * *\n\n为了测试 `show_follow`\
  \ 的渲染，我们将编写几个简短的集成测试，以验证关注页面和关注者页面是否存在。这些测试的设计目的是进行健全检查（sanity check），而不是全面的。事实上，如第\
  \ 5.3.4 节所示，对 HTML 结构进行全面测试可能是脆弱的，因此适得其反。我们在关注/关注者页面的计划是检查数量是否显示正确，以及页面上是否带有正确 URL\
  \ 的链接。\n\n![image](img/image01472.jpeg)\n\n**图 14.18：** 显示另一个用户的关注者。\n\n开始之前，我们将照常生成一个集成测试：\n\
  \n点击此处查看代码图像\n\n`$ rails generate integration_test following`\n\n```\ninvoke  test_unit\n\
  create     test/integration/following_test.rb\n```\n\n接下来，我们需要组装一些测试数据，可以通过添加一些关系固定件（relationships\
  \ fixtures）来创建关注/关注者关系。回想第 13.2.3 节，我们可以使用如下代码：\n\n点击此处查看代码图像\n\n**橙橙色：**\n\n```\n\
  content: \"我刚吃了一个橘子!\"\ncreated_at: <%= 10.minutes.ago %>\nuser: michael\n```\n\n\
