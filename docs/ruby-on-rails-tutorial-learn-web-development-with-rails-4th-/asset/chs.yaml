  \n1. 通过直接检查浏览器的 cookie，验证“记住我”复选框是否产生了预期效果。\n2. 在控制台中，编写示例来展示三元运算符的两种可能行为（Box 9.2）。\n\
  \n## 9.3 记住测试\n\n尽管我们的“记住我”功能现在可以工作了，但编写一些测试来验证其行为是非常重要的。原因之一是像稍后讨论的那样捕获实现错误。但更重要的是，核心用户持久化代码实际上完全没有经过测试。修复这些问题需要一些技巧，但结果将是一个强大得多的测试套件。\n\
  \n### 9.3.1 测试“记住我”复选框\n\n当我最初在 Listing 9.23 中实现复选框处理时，并没有使用正确的\n\n点击此处查看代码图像\n\n\
  `params[:session][:remember_me] == '1' ? remember(user) : forget(user)`\n\n而是实际上使用了\n\
  \n点击此处查看代码图像\n\n`params[:session][:remember_me] ? remember(user) : forget(user)`\n\
  \n在此上下文中，`params[:session][:remember_me]` 要么 `'0'` 就是 `'1'`，这两者在布尔上下文中都为 `true`，因此结果表达式始终为真，应用程序的行为就像复选框始终被勾选了一样。这正是测试可以捕获的错误。\n\
  \n由于记住用户需要他们处于登录状态，因此我们的第一步是定义一个辅助方法，在测试内部登录用户。在 Listing 8.23 中，我们使用 `post` 方法和有效的\
  \ `session` 哈希来登录一个用户，但每次都这样做很麻烦。为了避免无谓的重复，我们将编写一个名为 `log_in_as` 的辅助方法来为我们登录。\n\n\
  我们登录用户的方法取决于测试的类型。在控制器测试中，我们可以直接操作 `session` 方法，将 `user.id` 赋值给 `:user_id` 键（如在\
  \ Listing 8.14 中首次所示）：\n\n点击此处查看代码图像\n\n```ruby\ndef log_in_as(user)\n  session[:user_id]\
  \ = user.id\nend\n```\n\n我们调用 `log_in_as` 方法是为了避免与 Listing 8.14 中定义的应用程序代码中的 `log_in`\
  \ 方法混淆。它位于 `test_helper` 文件的 `ActiveSupport::TestCase` 类中，与 Listing 8.26 中的 `is_logged_in?`\
  \ 辅助方法位于相同：\n\n点击此处查看代码图像\n\n```ruby\nclass ActiveSupport::TestCase\n  fixtures\
  \ :all\n  # 如果测试用户已登录，则返回 true。\n  def is_logged_in?\n    !session[:user_id].nil?\n\
  \  end\n\n  # 登录特定的用户。\n  def log_in_as(user)\n    session[:user_id] = user.id\n\
  \  end\nend\n```\n\n我们在本章中实际上不需要这个版本的方法，但我们将在第 10 章 中使用它。\n\n在集成测试中，我们无法直接操作 `session`，但我们可以\
  \ `post` 到 Listing 8.23 中的路径，这导致了这里的：\n\n点击此处查看代码图像\n\n```ruby\nclass ActionDispatch::IntegrationTest\n\
  \  # 登录特定的用户。\n  def log_in_as(user, password: 'password', remember_me: '1')\n \
  \   post login_path, params: { session: { email: user.email, password: password,\
  \ remember_me: remember_me } }\n  end\nend\n```\n\n由于它位于 `ActionDispatch::IntegrationTest`\
  \ 类中，这就是 Listing 8.23 中使用的 `log_in_as` 方法。将这两个方法结合在一起产生了 Listing 9.24 所示的 `log_in_as`\
  \ 辅助方法。\n\n**Listing 9.24：** 添加 `log_in_as` 辅助方法。\n`test_helper.rb`\n\n点击此处查看代码图像\n\
  \n```ruby\nENV['RAILS_ENV'] ||= 'test'\n\nclass ActiveSupport::TestCase\n  fixtures\
  \ :all\n  # 如果测试用户已登录，则返回 true。\n  def is_logged_in?\n    !session[:user_id].nil?\n\
  \  end\n\n  # 登录特定的用户。\n  def log_in_as(user)\n    session[:user_id] = user.id\n\
  \  end\nend\n\nclass ActionDispatch::IntegrationTest\n  # 登录特定的用户。\n  def log_in_as(user,\
  \ password: 'password', remember_me: '1')\n    post login_path, params: { session:\
  \ { email: user.email, password: password, remember_me: remember_me } }\n  end\n\
  end\n```\n\n注意，为了最大的灵活性，Listing 9.24 中的第二个 `log_in_as` 方法接受关键字参数（如 Listing 7.13\
  \ 所示），密码和“记住我”复选框的默认值分别设置为 `'password'` 和 `'1'`。\n\n为了验证“记住我”复选框的行为，我们将编写两个测试，分别对应勾选和未勾选的情况。使用\
  \ Listing 9.24 中定义的登录辅助方法，这很容易，两种情况分别如下：\n\n点击此处查看代码图像\n\n`log_in_as(@user, remember_me:\
  \ '1')`\n\n和\n\n点击此处查看代码图像\n\n`log_in_as(@user, remember_me: '0')`\n\n（因为 `'1'`\
  \ 是 `remember_me` 的默认值，在上面的第一个情况下我们可以省略相应的选项，但我包含了它是为了使并列结构更加明显。）\n\n\n\n\n登录后，我们可以通过在\
  \ `cookies` 中查找 `remember_token` 键来检查用户是否被记住。理想情况下，我们会检查 cookie 的值是否等于用户的记住令牌（remember\
  \ token），但按照目前的设计，测试程序没有办法访问它：控制器中的 `user` 变量具有一个 `remember_token` 属性，但（由于 `remember_token`\
  \ 是虚拟属性）测试中的 `@user` 变量并没有。修复这个小瑕疵被留为一个练习（第 9.3.1 节），但目前我们只需要测试相关的 cookie 是否为 `nil`\
  \ 即可。\n\n还有一个微妙之处，即由于某种原因，在测试内部 `cookies` 方法不支持使用符号（symbols）作为键，因此 `cookies[:remember_token]`\
  \ 始终为 `nil`。幸运的是，`cookies` *可以* 使用字符串键工作，因此 `cookies['remember_token']` 拥有我们需要的值。生成的测试结果出现在\
  \ 列表 9.25 中。（回想 列表 8.23，`users (:michael)` 引用了 列表 8.22 中的固件用户。）\n\n**列表 9.25：**\
  \ “记住我”复选框的测试。`GREEN` \n\n```\ntest/integration/users_login_test.rb\n```\n\n点击此处查看代码图像\n\
  \n* *\n\n```ruby\nrequire 'test_helper'\n\nclass UsersLoginTest < ActionDispatch::IntegrationTest\n\
  \  def setup\n    @user = users(:michael)\n  end\n\n  .\n  .\n  .\n\n  test \"login\
  \ with remembering\" do\n    log_in_as(@user, remember_me: '1')\n    assert_not_nil\
  \ cookies['remember_token']\n  end\n\n  test \"login without remembering\" do\n\
  \    log_in_as(@user, remember_me: '0')\n    assert_nil cookies['remember_token']\n\
  \  end\nend\n```\n\n* *\n\n假设你没有犯和我一样的实现错误，这些测试应该是 `GREEN` 的：\n\n**列表 9.26：`GREEN`**\n\
  \n* *\n\n```bash\n$ rails test\n```\n\n* *\n\n### 练习\n\n购买任何 Rails Tutorial 后，可在\
