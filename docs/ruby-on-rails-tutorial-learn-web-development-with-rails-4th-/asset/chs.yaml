  ```\n$ git add -A\n$ git commit -m \"Finish user signup\"\n$ git checkout master\n\
  $ git merge sign-up\n```\n\n#### 7.5.1 生产环境中的 SSL\n\n\n\n当提交本章开发的注册表单时，姓名、电子邮箱地址和密码将通过网络发送，因此容易被恶意用户拦截。这对于我们的应用程序来说，这是一个潜在的严重安全漏洞，修复它的方法是在相关信息离开本地浏览器之前，使用安全套接层（SSL）¹²对所有相关信息进行加密。虽然我们可以在仅注册页面使用\
  \ SSL，但实际上全站实施它更容易，这还有额外的好处可以保护用户登录（第 8 章中讨论的严重 `session hijacking`（会话劫持）漏洞的影响。\n\
  \n12. 从技术上，SSL 现在是 TLS（传输层安全），但我认识的每个人仍然称之为“SSL”。\n\n启用 SSL 就像在生产环境应用的配置文件 `production.rb`\
  \ 中取消单行的注释一样简单。如列表 7.36 所示，我们只需要设置 `config` 变量来强制在生产环境中使用 SSL。\n\n**列表 7.36：** 配置应用程序在生产环境中使用\
  \ SSL。\n\n```ruby\nconfig/environments/production.rb\n```\n\n点击此处查看代码图像\n\n* *\n\
  \n```ruby\nRails.application.configure do\n  .\n  .\n  .\n  # 强制所有通过 SSL 访问应用，使用\
  \ Strict-Transport-Security，\n  # 并使用安全 cookie。\n  config.force_ssl = true\n  .\n\
  \  .\n  .\nend\n```\n\n* *\n\n在这一阶段，我们需要在远程服务器上设置 SSL。设置一个生产站点以使用 SSL 涉及为您的域名购买并配置\
  \ `SSL certificate`（SSL 证书）。不过，这是一项大量的工作，幸运的是我们在这里不需要它：对于运行在 Heroku 域名上的应用程序（例如示例应用程序），我们可以利用\
  \ Heroku 的 SSL 证书。因此，当我们在第 7.5.2 节中部署应用程序时，SSL 将自动启用。（如果您想在自定义域名（如 [www.example.com](http://www.example.com））上运行\
  \ SSL，请参考 Heroku 关于 SSL 的文档。）\n\n#### 7.5.2 生产 Web 服务器\n\n添加 SSL 后，我们现在需要配置应用程序使用适用于生产应用的\
  \ Web 服务器。默认情况下，Heroku 使用一个名为 `WEBrick` 的纯 Ruby Web 服务器，它容易设置和运行，但不擅长处理大量流量。因此，`WEBrick`\
  \ 不适合生产环境使用，所以我们把 `WEBrick` 替换为 `Puma`，这是一种能够处理大量并发请求的 HTTP 服务器。\n\n要添加新的 Web 服务器，我们只需遵循\
  \ Heroku Puma 文档即可。第一步是在我们的 `Gemfile` 中包含 `puma` gem，但从 Rails 5 开始，Puma 是默认包含的（列表\
  \ 3.2）。这意味着我们可以直接跳到第二步，将文件 `config/puma.rb` 的默认内容替换为列表 7.37 所示的配置。列表 7.37 中的代码直接来自\
  \ Heroku 文档，¹³，不需要理解它（框 1.1）。\n\n13. 列表 7.37 稍微调整了格式，使代码适应标准的 80 列宽。\n\n**列表 7.37：**\
  \ 生产 Web 服务器的配置文件。\n\n```ruby\nconfig/puma.rb\n```\n\n点击此处查看代码图像\n\n* *\n\n```ruby\n\
  workers Integer(ENV['WEB_CONCURRENCY'] || 2)\nthreads_count = Integer(ENV['RAILS_MAX_THREADS']\
