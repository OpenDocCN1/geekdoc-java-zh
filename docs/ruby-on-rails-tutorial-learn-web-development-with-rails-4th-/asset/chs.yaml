  \ [Listing 6.26.] 中的代码实现了这一点。\n\n### 15. 从技术上讲，只有电子邮件地址的域名部分是不区分大小写的：`foo@bar.com`\
  \ 实际上与 `Foo@bar.com` 不同。但在实践中，依赖这一事实并不是一个好主意；正如 about.com 所出的，“由于电子邮件地址的大小敏感性可能会引起很多困惑、互操作性问题和广泛的头疼，要求输入电子邮件时使用正确的大小写是愚蠢的。几乎没有电子邮件服务或\
  \ ISP 会强制执行大小敏感的电子邮件地址，而是返回收件人电子邮件地址输入不正确的邮件（例如，全大写）。”感谢读者 Riley Moses 指出这一点。\n\n\
  **Listing 6.26: 测试不区分大小写的电子邮件唯一性。RED**\n\n`test/models/user_test.rb`\n\n点击此处查看代码图像\n\
