  \ a smaller file.');\n    }\n  });\n</script>\n\n* * *\n\n正如你通过尝试上传过大的文件所看到的，列表\
  \ 13.66 中的代码并没有清空文件输入字段，因此用户只需关闭警报框并继续尝试上传文件。如果这是一本关于 jQuery 的书，我们可能会通过清空字段来完善这个小瑕疵，但重要的是要理解像列表\
  \ 13.66 所示的前端代码无法阻止用户尝试上传过大的文件。即使我们的代码清空了文件输入字段，也无法防止用户使用 Web 检查器编辑 JavaScript 或使用\
  \ `curl` 等直接发送 POST 请求。因此，为了防止用户上传任意大小的文件，包含像列表 13.65 那样的服务器端验证是关重要的。\n\n##### 练习题\n\
