  ```\n\n点击此处查看代码图片\n\n这是一个将被编译为 `application.css` 的清单文件，它将包含下面列出的所有文件。目录 `lib/assets/stylesheets`、`vendor/assets/stylesheets`\
  \ 或插件的 `vendor/assets/stylesheets`（如果有）中的任何 CSS 和 SCSS 文件都可以使用相对路径在此引用。\n\n你可以自由地向此文件添加应用程序范围的样式，它们将出现在编译后的文件底部，因此你在此处添加的样式将优于目录内其他\
