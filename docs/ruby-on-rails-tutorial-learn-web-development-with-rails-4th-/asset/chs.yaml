  \n```\nrequire 'test_helper'\nclass MicropostTest < ActiveSupport::TestCase\n  .\n\
  \  .\n  .\n  test \"order should be most recent\" do\n    assert_equal microposts(:most_recent),\
  \ Micropost.first\n  end\nend\n```\n\nListing 13.14 依赖于某些固定数据（fixtures），如 Listing\
  \ 13.15 所示。\n\n**Listing 13.15:** micropost 固定数据。\n\n```yaml\ntest/fixtures/microposts.yml\n\
  ```\n点击此处查看代码图片\n\n```yaml\norange:\n  content: \"I just ate an orange\"\n  created_at:\
  \ 10.minutes.ago\ntoday:\n  content: \"Check out today site\"\n  created_at: 3.years.ago\n\
  video:\n  content: \"Sad cats are\"\n  created_at: 2.hours.ago\nmost_recent:\n \
  \ content: \"Writing a short test\"\n  created_at: Time.zone.now\n```\n\n注意，我们使用嵌入\
  \ Ruby 显式设置了 `created_at`。由于它是 Rails 自动更新的“魔法列”，通常手动设置是不可能的，但在固定数据中是可以的。\n\n由于这种行为，在\
  \ Listing 13.14 和 Listing 13.15 中的代码，测试套件应该是 **红色**：\n\n**Listing 13.16: 红色**\n\n\
  点击此处查看代码图片\n\n```bash\n$ rails test test/models/micropost_test.rb \\\n  --name test_order_should_be_most_recent\n\
  ```\n\n我们将使用名为 `default_scope` 的 Rails 方法让测试通过，该方法的其他用途是设置从数据库检索元素的默认顺序。为了强制特定的顺序，我们在\
  \ `default_scope` 中包含 `order` 参数，如下所示对 `created_at` 列排序：\n\n`order(:created_at)`\n\
  \n不幸的是，这将按*升序*排列结果，这意味着旧的 micropost 会排在前面。为了按反序提取它们，我们可以进一步深入一层并包含一个带有原始 SQL 的字符串：\n\
  \n`order('created_at DESC')`\n\n这里 `DESC` 是 SQL 中的“降序”，即从新到旧的顺序。5 在旧版本的 Rails 版本中，使用这种原始\
  \ SQL 是获得所需行为的唯一选择，但从 Rails 4.0 开始，我们也可以使用更自然的纯 Ruby 语法。SQL 不区分大小写，但习惯上会将 SQL 关键字（如\
  \ `DESC`）全大写。\n\n`order(created_at: :desc)`\n\n\n\n\n\n点击此处查看代码图片\n\n```ruby\nclass\
  \ Micropost < ApplicationRecord\n  belongs_to :user\n  default_scope -> { order(created_at:\
  \ :desc) }\n  validates :user_id, presence: true\n  validates :content, presence:\
  \ true, length: { maximum: 140 }\nend\n```\n\n列表 13.17 介绍了用于名为 `Proc`（过程）或 `lambda`\
  \ 对象的“刺状 lambda”（stabby lambda）语法，它是一个*匿名函数*（无需名称即可创建的函数）。刺状 lambda `->` 接收一个块（第\
  \ 4.3.2 节\n\n```bash\n>> -> { puts \"foo\" }\n=> #<Proc:0x007fab938d0108@(irb):1\
  \ (lambda)>\n>> -> { puts \"foo\" }.call\nfoo\n=> nil\n```\n\n（这是一个相当高级的 Ruby 主题，所以如果立刻无法理解，不要担心。）\n\
  \n有了列表 13.17 中的代码，测试结果应该是 `GREEN`（绿色）：\n\n列表 13.18：`GREEN`\n\n```bash\n$ rails test\n\
  ```\n\n## 依赖：删除 (Dependent: Destroy)\n\n除了正确的排序外，我们还想为微贴添加第二种改进。回想一下第 10.4 节，网站管理员有权*销毁*用户。理所当然，如果一个用户被销除了，那么该用户的微贴也应该被销毁。\n\
  \n我们可以通过在向 `has_many` 关联方法传递选项来实现这种行为，如列表 13.19\n\n```ruby\nclass User < ApplicationRecord\n\
  \  has_many :microposts, dependent: :destroy\n  # ... 省略 ...\nend\n```\n\n在这里，`dependent:\
  \ :destroy` 选项安排用户本身被销毁时，相关的微贴也会被销毁。这防止了当管理员选择从系统中移除用户时，没有用户的微贴孤留在数据库中。\n\n我们可以通过对\
  \ `User` 模型进行测试来验证列表 13.19 是否正常工作。我们需要做的只是保存用户（使其获得 `id`）并创建一个关联的微贴。然后检查销毁用户是否会让微贴数量减少\
  \ 1。结果显示在列表 13.20 中。（请对比列表 10.62 中“删除”链接的集成测试。）\n\n列表 13.20：`dependent: :destroy`\
  \ 的测试。`GREEN`\n\n`test/models/user_test.rb`\n\n点击此处查看代码图片\n\n```ruby\nrequire 'test_helper'\n\
