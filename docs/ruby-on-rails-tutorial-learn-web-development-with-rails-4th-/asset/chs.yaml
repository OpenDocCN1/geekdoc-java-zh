  \ 2 小时有效，即使在注销后仍然可以使用。如果用户在公共机器上重置了密码，任何人都可以按后退键更改密码（并登录网站）。为了修复这个问题，请添加 Listing\
  \ 12.22 所示的代码，在密码更新成功后清除重置散列（digest）。\n\n4. 在 Listing 12.18 中添加一行来测试上一个练习中清除重置散列的功能。*提示*：结合\
  \ `assert_nil`（首次在 Listing 9.25 中出现）与 `user.reload`（Listing 11.33）结合，直接测试 `reset_digest`\
  \ 属性。\n\n**Listing 12.20:** 使用 `update_columns` 的模板。\n\napp/models/user.rb\n\n点击此处查看代码图片\n\
  \n```ruby\nclass User < ApplicationRecord\n  attr_accessor :remember_token, :activation_token,\
  \ :reset_token\n  before_save :downcase_email\n  before_create :create_activation_digest\n\
  \n  # 激活账户。\n  def activate\n    update_columns(activated: true, activated_at: Time.zone.now)\n\
  \  end\n\n  # 发送激活邮件。\n  def send_activation_email\n    UserMailer.account_activation(self).deliver_now\n\
  \  end\n\n  # 设置密码重置。\n  def create_reset_digest\n    reset_token = self.new_token\n\
  \    update_columns(reset_digest: reset_digest)\n  end\n\n  # 发送密码邮件。\n  def send_password_email\n\
  \    UserMailer.password_reset(self).deliver_now\n  end\n\n  private\n\n  # 将邮箱转为小写。\n\
  \  def downcase_email\n    email.downcase\n  end\n\n  # 创建激活散列。\n  def create_activation_digest\n\
  \    activation_token = self.new_token\n    update_columns(activation_digest: activation_token)\n\
  \  end\n\n  # 生成新令牌。\n  def new_token\n    SecureRandom.urlsafe_base64\n  end\n\n\
