  \ Session 控制器的 `create` 动作。Rails 是如何知道这么做的？*提示*：参考 Table 8.1 和 Listing 8.5 的第一行。\n\
  \n#### 8.1.3 查找并验证用户\n\n与创建用户（注册）的情况一样，创建会话（登录）的第一步是处理*无效*输入。我们将首先回顾表单提交时会发生什么，然后安排在登录失败时显示有用的错误信息（如\
  \ Figure 8.2 所示）。然后我们将通过根据邮箱/密码组合的有效性评估每个登录提交，为成功登录奠基础（Section 8.2）。\n\n让我们先为 Sessions\
  \ 控制器定义一个极简的 `create` 动作，以及空的 `new` 和 `destroy` 动作（Listing 8.6）。Listing 8.6 中的 `create`\
  \ 动作除了渲染 `new` 视图外什么都不做，但已足够我们开始了。提交 `/sessions/new` 表单将产生 Figure 8.4 所示的结果。\n\n\
  **Listing 8.6：** Sessions `create` 动作的初步版本。\n\n```ruby\napp/controllers/sessions_controller.rb\n\
  \nclass SessionsController < ApplicationController\n  def new\n  end\n\n  def create\n\
  \    render 'new'\n  end\n\n  def destroy\n  end\nend\n```\n\n仔细检查 Figure 8.4 中的调试信息显示，如\
  \ Section 8.1.2 结尾提示的那样，提交产生了一个 `params` 哈希表，其中 `session` 键下包含邮箱和密码（省略 Rails 内部使用的一些无关细节），其形式如下：\n\
  \n```\nsession:\n  email: 'user@example.com'\n  password: 'foobar'\ncommit: Log\
  \ in\naction: create\ncontroller: sessions\n```\n\n与用户注册的情况（Figure 7.15）一样，这些参数形成了一个*嵌套*哈希表，就像我们在\
  \ Listing 4.13 中看到的那样。特别是，`params` 包含一个格式如下的嵌套哈希\n\n```\n{ session: { password:\
  \ \"foobar\", email: \"user@example.com\" } }\n```\n\n![image](img/image01348.jpeg)\n\
  \n**Figure 8.4：** 初始登录失败，`create` 正如 Listing 8.6 所示。\n\n这意味着\n\n`params[:session]`\
  \ 本身是一个哈希：\n\n```\n{ password: \"foobar\", email: \"user@example.com\" }\n```\n\n\
  结果是，\n\n`params[:session][:email]` 是提交的邮箱地址`params[:session][:password]` 是提交的密码。\n\
  \n换句话说，在 `create` 动作内部，`params` 哈希包含了通过邮箱和密码验证用户所需的所有信息。并非巧合，我们已经拥有了精确的方法：Active\
  \ Record 提供的 `User.find_by` 方法（Section 6.1.4）以及 `has_secure_password` 提供的 `authenticate`\
  \ 方法（Section 6.3.4）。回想起 `authenticate` 在验证无效时返回 `false`（Section 6.3.4），我们的用户登录策略可以总结如\
  \ Listing 8.7 所示。\n\n**Listing 8.7：** 查找并验证用户。\n\n```ruby\napp/controllers/sessions_controller.rb\n\
  class SessionsController < ApplicationController\n  def new\n  end\n\n  def create\n\
  \    user = User.find_by(email: params[:session].downcase)\n    if user && user.authenticate(params[:session][:password])\n\
  \      # 登录用户并重定向到用户的显示页面。\n    else\n      # 创建错误消息。\n      render 'new'\n    end\n\
  \  end\n\n  def destroy\n  end\n```\n\nListing 8.7 中的第一行从数据库中提取用户，使用提交的邮箱。（回想 Section\
  \ 6.2.5 邮箱地址以全小写保存，所以这里我们使用 `downcase` 方法）下一行可能有点困惑但在 Rails 中很常见：\n\n```ruby\nuser\
  \ && user.authenticate(params[:password])\n```\n\n这使用 `&&`（逻辑与）来判断用户是否有效。考虑到 Section\
  \ 4.2.3 任何非 `nil` 对象在布尔上下文中都是 `true`，`false` 本身也是 `false`，可能性出现在 Table 8.2 中。只有当数据库中存在给定邮箱且具有给定密码时，`if`\
  \ 语句为 `true`。\n\n![image](img/image620.jpeg)\n\n**Table 8.2：** `user && authenticate(...)`\
  \ 的可能结果。\n\n### 练习\n\n购买任何《Rails Tutorial》均可在 railstutorial.org/solutions 免费查看练习题解答。要查看他人的答案并记录自己的答案，请加入\
  \ learnenough.com/society 的 Learn Enough Society。\n\n1. 使用 Rails 控制台确认 Table 8.2\
