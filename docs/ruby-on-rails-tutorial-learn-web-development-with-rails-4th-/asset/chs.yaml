  \ %>\n  </div\n  <%= f.submit \"Post\", class: \"btn btn-primary\" %>\n  <span class=\"\
  picture\">\n    <%= f.file_field :picture, accept: 'image/jpeg,image/gif,image/png'\
  \ %>\n  </span>\n<% end %>\n```\n\n<script type=\"text/javascript\">\n  $('#micropost_picture').bind('change',\
  \ function() {\n    var size_in_megabytes = this.files[0].size/1024/1024;\n    if\
