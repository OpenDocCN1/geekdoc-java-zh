  \    @current_user ||= User.find_by(id: user_id)\n  elsif (user_id = cookies.signed[:user_id])\n\
  \    user = User.find_by(id: user_id)\n    if user && user.authenticated?(cookies[:remember_token])\n\
  \      log_in user\n      @current_user = user\n    end\n  end\nend\n```\n\n结果是，评估会在\
  \ `current_user` 方法的末尾结束，从而按要求返回 `nil`。\n\n相比之下，如果我们关闭 Chrome，会将 `session[:user_id]`\
  \ 设置为 `nil`（因为所有 `session` 变量在浏览器关闭时会自动过期），但 `user_id` cookie 仍然存在。这意味着当 Chrome\
  \ 重新启动时，相应的用户仍会从数据库中提取：\n\n点击此此处查看代码图片\n\n```ruby\n# 返回对应于 remember token cookie\
  \ 的用户。\ndef current_user\n  if (user_id = session[:user_id])\n    @current_user\
  \ ||= User.find_by(id: user_id)\n  elsif (user_id = cookies.signed[:user_id])\n\
  \    user = User.find_by(id: user_id)\n    if user && user.authenticated?(cookies[:remember_token])\n\
  \      log_in user\n      @current_user = user\n    end\n  end\nend\n```\n\n因此，内部的\
  \ `if` 条件将被评估：\n\n点击此此处查看代码图片\n\n```ruby\nuser && user.authenticated?(cookies[:remember_token])\n\
  ```\n\n特别是，由于 `user` 不是 `nil`，第二个表达式将被求值，从而引发错误。这是因为用户的记忆密摘要在 Firefox 中注销时被删除了（列表\
  \ 9.11），所以当我们在 Chrome 中访问应用程序时，最终调用了\n\n点击此此处查看代码图片\n\n```ruby\nBCrypt::Password.new(remember_digest).is_password?(remember_token)\n\
  ```\n\n带有一个 `nil` 的记忆密摘要，从而在 bcrypt 内部抛出异常。为了修复这个问题，我们希望 `authenticated?` 返回 `false`。\n\
