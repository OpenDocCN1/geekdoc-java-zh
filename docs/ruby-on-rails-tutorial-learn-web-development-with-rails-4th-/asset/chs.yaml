  \ 表单形式而不是 `_path` 形式？*提示*：答案与类似的账户激活相同（第 12.1.1 节）。\n\n#### 12.1.2 新密码重置\n为了创建新的密码重置，我们首先需要定义数据模型，这与用于账户激活的模型相似（图\
  \ 12.1）。遵循记忆令牌（第 9 章）和账户令牌（第 11 章）设定的模式，密码重置将一个用于重置邮件的虚拟令牌与一个用于检索用户的相应摘要值配对。如果我们存储未经哈希的令牌，访问数据库的攻击者就可以向用户的电子邮件地址发送重置请求，然后使用该令牌访问相应的密码链接，从而获得账户控制权。对密码重置使用摘要至关重要。作为额外的预防措施，我们还计划在重置链接在几小时后过期，这需要记录发送重置时的时间。生成的\
  \ `reset_digest` 和 `reset_sent_at` 属性出现在图 12.5 中。\n\n由于我们需要创建新的密码重置（图 12.2）以及通过更改\
  \ User 模型中的密码来更新它们（图 12.3），我们需要为 `new`、`create`、`edit` 和 `update` 路由。我们可以通过列表 12.1\
  \ 所示的 `resources` 行来安排它。\n\n图 12.5 中显示的添加属性的迁移如下：\n\n点击此处查看代码图片\n\n```\n$ rails\
  \ migration add_to_users reset_digest:string reset_sent_at:datetime\n```\n\n![image](img/image0421.jpeg)\n\
