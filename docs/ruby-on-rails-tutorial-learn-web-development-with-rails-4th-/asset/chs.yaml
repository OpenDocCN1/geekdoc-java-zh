  按照要求，测试最初失败了：\n\n**列表 3.16：** `RED`\n\n点击此处查看代码图像\n\n```\n$ rails test\n3 tests,\
  \ 2 assertions, 0 failures, 1 errors, 0 skips\n```\n\n### 3.3.3 Green\n\n现在我们有了一个失败的测试（`RED`），我们将使用失败测试的错误信息来引导我们通过通过的测试（`GREEN`），从而实现一个工作的\
