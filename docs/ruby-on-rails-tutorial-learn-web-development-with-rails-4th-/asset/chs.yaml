  \ 10 章的主要目标。\n\n在继续之前，将你的更改合并回 master 分支：\n\n点击此处查看代码图片\n\n```\n$ rails test\n$\
  \ git add -A\n$ git commit -m \"Implement advanced login\"\n$ git checkout master\n\
  $ git merge advanced-login\n```\n\n在部署到 Heroku 之前，值得注意的是，在推送之后但迁移完成之前，应用程序将短暂处于无效状态。对于流量重大的生产网站，在进行更改之前开启*维护模式（maintenance\
  \ mode）*是个好主意：\n\n点击此处查看代码图片\n\n```\n$ heroku maintenance:on\n$ git push heroku\n\
  $ heroku run rake db:migrate\n$ heroku maintenance:off\n```\n\n这安排在部署和迁移期间显示一个标准的错误页面。（我们不会再费心这一步了，但至少看一次是好的。）有关更多信息，请参阅\
  \ Heroku 文档。\n\n#### 9.4.1 本节学到的内容\n\n- 我们通过 `cookies` 在页面之间保持状态。\n- 我们为记忆令牌关联了哈希值。\n\
  - 使用 `cookies` 方法创建了持久化会。\n- 登录状态通过是否存在当前用户来确定。\n- 我们通过删除 session 退出登录。\n- 三元运算符是编写简单\
  \ if-then 语句的紧凑方式。\n\n## 第 10 章：更新、显示和删除用户\n\n在本章中，我们将通过添加 `edit`、`update` 和 `destroy`\
