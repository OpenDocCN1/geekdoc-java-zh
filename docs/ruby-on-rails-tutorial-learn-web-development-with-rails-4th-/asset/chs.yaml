  ## 变量\n\nSass 允许我们定义 `variables` 以消除重复并编写更具表现力的代码。例如，查看 Listing 5.8 和 Listing 5.17，我们看到对相同颜色的重复引用：\n\
  \n点击此处查看代码图片\n\n```css\nh2 {\n  .\n  .\n  .\n  color: #777;\n}\n\n.\n.\n.\n\nfooter\
  \ {\n  .\n  .\n  .\n  color: #777;\n}\n```\n\n在这种情况下，`#777` 是浅灰色，我们可以通过如下定义变量为它命名：\n\
  \n```scss\n$light-gray: #777;\n```\n\n这允许我们像这样重写我们的 SCSS：\n\n点击此处查看代码图片\n\n```css\n\
  $light-gray: #777;\n\n.\n.\n.\n\nh2 {\n  .\n  .\n  .\n  color: $light-gray;\n}\n\
  \n.\n.\n.\n\nfooter {\n  .\n  .\n  .\n  color: $light-gray;\n}\n```\n\n由于像 `$light-gray`\
  \ 这样的变量名比 `#777` 更具描述性，因此即使对于没有重复的值，定义变量通常很有用。事实上，Bootstrap 框架定义了大量的颜色变量，可以在 Bootstrap\
  \ 的 Less 变量页面上查看。该页面使用 Less 而不是 Sass 定义变量，但 `bootstrap-sass` gem 提供了 Sass 的等效项。猜测对应关系并不困难；Less\
  \ 使用“at”符号 `@`，而 Sass 使用美元符号 `$`。查看 Bootstrap 变量页面，我们看到有一个用于浅灰色的变量：\n\n```css\n\
  @gray-light: #777;\n```\n\n这意味着通过 `bootstrap-sass` gem，应该有一个对应的 SCSS 变量 `$gray-light`。我们可以用它来替换我们自定义的变量\
  \ `$light-gray`，结果如下：\n\n点击此处查看代码图片\n\n```css\nh2 {\n  .\n  .\n  .\n  color: $gray-light;\n\
  }\n\n.\n.\n.\n\nfooter {\n  .\n  .\n  .\n  color: $gray-light;\n}\n```\n\n将 Sass\
  \ 嵌套和变量定义功能应用于完整的 SCSS 文件，将得到 Listing 5.20 中的文件。这同时使用了 Sass 变量（从 Bootstrap Less\
  \ 变量页面推断）和内置命名颜色（例如，用 `white` 表示 `#fff`）。特别注意 `footer` 标签规则的巨大改进。\n\n**Listing 5.20：**\
  \ 转换为使用嵌套和变量的初始 SCSS 文件。\n\n`app/assets/stylesheets/custom.scss`\n\n点击此处查看代码图片\n\
  \n```scss\n@import \"bootstrap-sprockets\";\n@import \"bootstrap\";\n/* mixins,\
  \ variables, etc. */\n\n$gray-medium-light: #eaeaea;\n\n/* 通样式 */\nbody {\n  padding-top:\
  \ 60px;\n}\n\nsection {\n  overflow: auto;\n}\n\ntextarea {\n  resize: vertical;\n\
  }\n\n.center {\n  text-align: center;\n  h1 {\n    margin-bottom: 10px;\n  }\n}\n\
  \n/* 排版样式 */\nh1, h2, h3, h4, h5, h6 {\n  line-height: 1;\n}\n\nh1 {\n  font-size:\
  \ 3em;\n  letter-spacing: -2px;\n  margin-bottom: 30px;\n  text-align: center;\n\
  }\n\nh2 {\n  font-size: 1.2em;\n  letter-spacing: -1px;\n  margin-bottom: 30px;\n\
  \  text-align: center;\n  font-weight: normal;\n  color: $gray-light;\n}\n\np {\n\
  \  font-size: 1.1em;\n  line-height: 1.7em;\n}\n\n/* 页头 */\n#logo {\n  float: left;\n\
  \  margin-right: 10px;\n  font-size: 1.7em;\n  color: white;\n  text-transform:\
  \ uppercase;\n  letter-spacing: -1px;\n  padding-top: 9px;\n  font-weight: bold;\n\
  \  &:hover {\n    color: white;\n    text-decoration: none;\n  }\n}\n\n/* 页脚 */\n\
  footer {\n  margin-top: 45px;\n  padding-top: 5px;\n  border-top: 1px solid $gray-medium-light;\n\
  \  color: $gray-light;\n\n  a {\n    color: white;\n    text-decoration: none;\n\
  \  }\n\n  small {\n    float: left;\n  }\n\n  ul {\n    float: right;\n    list-style:\
  \ none;\n    li {\n      float: left;\n      margin-left: 15px;\n    }\n  }\n}\n\
