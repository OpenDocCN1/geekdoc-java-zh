  \n1. 在控制台中，确认当前新用户是有效的。\n2. 确认在 第 6.1.3 节 中创建的用户也是有效的。\n\n#### 6.2.2 验证存在性\n\n可能最基础的验证就是*存在性*（presence），它仅仅是验证给定的属性是否存在。例如，在本节中，我们将确保在用户保存到数据库之前，`name`\
  \ 和 `email` 字段都存在。在 第 7.3.3 节 中，我们将看到如何将这一要求向上传递到创建新用户的注册表单。\n\n我们将通过基于 代码列表 6.5\
  \ 中的测试，开始对 `name` 属性的存在性进行测试。如 代码列表 6.7 所示，我们所做的是将 `@user` 变量的 `name` 属性设置为空字符串（在本情况下，是一个包含空格的字符串），然后检查（使用\
  \ `assert_not` 方法）生成的 `User` 对象不是有效的。\n\n**代码列表 6.7：** 对 `name` 属性验证的测试。**RED**\n\
  \ntest/models/user_test.rb\n\n点击此处查看代码图片\n\n* * *\n\n```\nrequire 'test_helper'\n\
  \nclass UserTest < ActiveSupport::TestCase\n  def setup\n    @user = User.new(name:\
  \ \"Example User\", email: \"user@example.com\")\n  end\n\n  test \"should be valid\"\
  \ do\n    assert @user.valid?\n  end\n\n  test \"name should be present\" do\n \
  \   @user.name = \"      \"\n    assert_not @user.valid?\n  end\nend\n```\n\n* *\
  \ *\n\n此时，模型测试应该是 **RED**（红色）：\n\n**代码列表 6.8：RED**\n\n* * *\n\n```\n$ rails test:models\n\
  ```\n\n* * *\n\n正如我们之前在 第 2 章 练习中简要见过的，验证 name 属性存在性的方法是使用带有 `presence: true` 参数的\
  \ `validates` 方法，如 代码列表 6.9 所示。`presence: true` 参数是一个单元素*选项哈希*（options hash）；回想\
  \ 第 4.3.4 节，当将哈希作为方法的最后一个传递时，大括号是可选的。（如 第 5.1.1 节 所，使用选项哈希是 Rails 中反复出现的主题。）\n\n\
  **代码列表 6.9：** 验证 `name` 属性的存在性。`GREEN`**\n\napp/models/user.rb\n\n点击此处查看代码图片\n\n\
  * * *\n\n```\nclass User < ApplicationRecord\n  validates :name, presence: true\n\
  end\n```\n\n* * *\n\n代码列表 6.9 看起来像魔法，但 `validates` 只是一个方法。使用括号的 代码列表 6.9 的等效写法如下：\n\
  \n点击此处查看代码图片\n\n```\nclass User < ApplicationRecord\n  validates(:name, presence:\
  \ true)\nend\n```\n\n让我们进入控制台，查看向我们的 `User` 模型添加验证后的效果：\n\n第 10. 当控制台命令没有说明性时，我将省略其输出——例如\
  \ `User.new` 的结果。\n\n```\n$ rails console\n>> user = User.new(name: \"\", email:\
  \ \"example.com\")\n>> user.valid?\n=> false\n```\n\n在这里，我们使用 `valid?` 方法检查 `user`\
  \ 变量的有效性，当对象失败更多一项验证时，它返回 `false`，当所有验证都通过时，它返回 `true`。在这种情况下，我们只有一个验证，所以我们知道是哪一个失败了，但检查在失败时生成的\
  \ `errors` 对象仍然很有帮助：\n\n```\n>> user.errors.full_messages\n=> [\"Name can't be blank\"\
  ]\n```\n\n（正如 第 4.4 节 中提到的，Rails 使用 `valid?` 方法验证属性的存在性。）尝试保存用户到数据库失败：\n\n```\n\
  >> user.save\n=> false\n```\n\n由于这种结果，第 2 章 中的测试现在应该是 `GREEN`（绿色）：\n\n**代码列表 10：`GREEN`**\n\
  \n* * *\n\n```\n$ rails test:models\n```\n\n* * *\n\n正如我们在 代码列表 6.7 中所示，验证 email\
  \ 属性存在性的方法是。代码列表 11\n\n**代码列表 11：** 对 email 属性存在验证的测试。**RED**\n\ntest/models/user_test.rb\n\
  \n点击此处查看代码图片\n\n* * *\n\n```\nrequire 'test_helper'\n\nclass UserTest < ActiveSupport::TestCase\n\
  \  def setup\n    @user = User.new(name: \"Example User\", email: \"user@example.com\"\
  )\n  end\n\n  test \"should be valid\" do\n    assert @user.valid?\n  end\n\n  test\
  \ \"name should be present\" do\n    @user.name = \"      \"\n    assert_not @user.valid?\n\
  \  end\n\n  test \"email should be present\" do\n    @user.email = \"      \"\n\
  \    assert_not @user.valid?\n  end\nend\n```\n\n* * *\n\n**代码列表 12：** 验证 `email`\
  \ 属性的存在性。`GREEN`**\n\napp/models/user.rb\n\n点击此处查看代码图片\n\n* * *\n\n```\nclass User\
  \ < ApplicationRecord\n  validates :name, presence: true\n  validates :email, presence:\
  \ true\nend\n```\n\n* * *\n\n此时，存在性验证已经完成，测试套应该是 `GREEN`：\n\n**代码列表 13：`GREEN`**\n\
  \n* * *\n\n```\n$ rails test\n```\n\n* * *\n\n#### 6.2.3 长度验证\n\n我们已经约束了 `User`\
  \ 模型要求每个用户都有一个名称，但我们应该进一步：用户的名称将在示例网站上显示，所以我们应该对长度施加限制。有了 第 6.2.2 节 中所做的工作之后，这一步很容易。\n\
  \n选择最大长度没有科学依据；我们将空想出 `50` 作为合理的上限，这意味着验证长度为 `51` 个字符的名称过长。此外，尽管极少出现问题，但用户的电子邮件地址可能会超过字符串的最大长度，对于许多数据库来说是\
  \ 255。由于 第 6.2.4 节 中的格式验证不会强制这种限制，我们将在在本节中添加一个以保持完整。代码列表 14 显示了相应的测试。\n\n\n\n\n\n\
  ```ruby\ndef setup\n  @user = User.new(name: \"Example User\", email: \"user@example.com\"\
  )\nend\n\ntest \"name should not be too long\" do\n  @user.name = \"a\" * 51\n \
  \ assert_not @user.valid?\nend\n\ntest \"email should not be too long\" do\n  @user.email\
  \ = \"a\" * 244 + \"@example.com\"\n  assert_not @user.valid?\nend\nend\n```\n\n\
  ***\n\n为了方便起见，我们在列表 6.14 中使用了“字符串乘法”来创建一个长度为 51 个字符字符串。我们可以通过控制台查看它的工作原理：\n\n点击此处查看代码图像\n\
  \n```text\n>> \"a\" * 51\n=> \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\"\
  \n>> (\"a\" * 51).length\n=> 51\n```\n\nemail 长度验证构造了一个多出一个字符的有效电子邮件地址：\n\n点击此处查看代码图像\n\
  \n```text\n>> \"a\" * 244 + \"@example.com\"\n=> \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\n\
  \naaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\n\
  \naaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\n\
  \naaaaaaaaaaa@example.com\"\n>> (\"a\" * 244 + \"@example.com\").length\n=> 256\n\
  ```\n\n此时，列表 6.14 中的测试应该是**红色**的：\n\n列表 6.15：**红色**\n\n***\n\n```bash\n$ rails test\n\
  ```\n\n***\n\n为了让这些测试通过，我们需要使用验证参数来限制长度，即 `length`，并配合 `maximum` 参数来强制执行上限（列表 6.16）。\n\
  \n**列表 6.16：** 为 `name` 属性添加长度验证。`绿色`\n\napp/models/user.rb\n\n点击此处查看代码图像\n\n***\n\
  \n```ruby\nclass User < ApplicationRecord\n  validates :name, presence: true, length:\
  \ { maximum: 50 }\n  validates :email, presence: true, length: { maximum: 255 }\n\
  end\n```\n\n***\n\n现在测试结果应该是`绿色`的：\n\n**列表 6.17：**`绿色`\n\n***\n\n```bash\n$ rails\
  \ test\n```\n\n***\n\n随着测试套件的通过，我们可以转向更具挑战性的验证：email 格式。\n\n##### 练习\n\n购买任何教程后，可在\
  \ railsutorial.org 免费获取练习题答案。要查看他人的答案并记录自己的答案，请加入 learnenough.com/society 学习社区。\n\
  \n1. 创建一个名称和电子邮件都过长的新用户，并确认它是无效的。\n2. 长度验证产生了哪些错误信息？\n\n#### 6.2.4 格式验证\n\n我们对 `name`\
  \ 属性的验证仅执行了最基本的限制——任何少于 51 个字符的非空名称即可——但当然，`email` 属性必须满足作为有效地址的严格要求。到目前为止，我们只拒绝了空地址；在本节中，我们将要求电子邮件地址符合熟悉的\
  \ `user@example.com` 模式。\n\n测试和验证都不会是详尽的，只需足够接受大多数有效地址并拒绝大多数无效地址即可。我们将从几个包含有效和无效地址集合的测试开始。为了创建这些集合，了解用于创建字符串数组的有用技术\
  \ `%w[]` 是很有价值的，如此控制台所示：\n\n点击此处查看代码图像\n\n```text\n>> %w[foo baz]\n=> [\"foo\",\
  \ \"bar\", \"baz\"]\n>> addresses = %w[USER@foo.COM THE_US-ER@foo.bar.org first.last@foo.jp]\n\
  => [\"USER@foo.COM\", \"THE_US-ER@foo.bar.org\", \"first.last@foo.jp\"]\n>> addresses.each\
  \ do |address|\n?> puts address\nUSER@foo.COM\nTHE_US-ER@foo.org\nfirst.last@foo.jp\n\
  ```\n\n在这里，我们使用 `each` 方法（节 4.3.2）遍历了 `addresses` 数组的元素。掌握了这项技术，我们就可以编写一些 email\
  \ 格式验证了。\n\n由于 email 格式验证复杂且容易出错，我们将从通过有效地址的测试开始，以捕捉验证中的任何错误。也就是说，我们不仅要确保像 `user@example,com`\
  \ 这样的无效地址被拒绝，还要在实施验证后确保像 `user@example.com` 这样的有效地址被接受。（当然，现在它们会被接受，因为目前所有非空电子邮件地址都是有效的。）代表性有效地址的结果出现在列表\
  \ 6.18 中。\n\n**列表 6.18：** 有效 email 格式的测试。`绿色`\n\ntest/models/user_test.rb\n\n点击此处查看代码图像\n\
  \n***\n\n```ruby\nrequire 'test_helper'\nclass UserTest < ActiveSupport::TestCase\n\
  \  def setup\n    @user = User.new(name: \"Example User\", email: \"user@example.com\"\
  )\n  end\n\n  test \"email validation should accept valid addresses\" do\n    valid_addresses\
  \ = %w[user@example.com USER@foo.COM THE_US-ER@foo.bar.org first.last@foo.jp alice+bob.cn]\n\
  \    valid_addresses.each do |valid_address|\n      @user.email = valid_address\n\
  \      assert @user.valid?, \"#{valid_address.inspect} should be valid\"\n    end\n\
  \  end\nend\n```\n\n***\n\n注意我们在断言中包含了一个可选的第二个参数，自定义错误消息，这种情况下识别了导致测试失败的地址：\n\n\
  点击此处查看代码图像\n\n```text\nassert @user.valid?, \"#{valid_address.inspect} should be\
  \ valid\"\n```\n\n（这使用了节 4.3.3 中提到的 `inspect` 方法）对于像列表 6.18 那样的带有 `each` 循环的测试，包含导致失败的特定地址特别有用，否则失败只会指向行号，这对于所有\
  \ email 地址都是相同的，并且无法识别问题所在。\n\n接下来我们将为各种无效地址添加测试，例如 `user@example,com`（逗号代替点）和 `user_at_foo.org`（缺少@符号）。正如列表\
  \ 6.18 所示，列表 6.19](#part0015.xhtml_list6_19)包含了自定义错误消息来识别失败。\n\n**列表 6.19：** 格式验证的测试。`红色`\n\
  \ntest/models/user_test.rb\n\n点击此处查看代码图像\n\n***\n\n```ruby\nrequire 'test_helper'\n\
  class UserTest < ActiveSupport::TestCase\n  def setup\n    @user = User.new(name:\
  \ \"Example User\", email: \"user@example.com\")\n  end\n\n  test \"email validation\
  \ should reject invalid addresses\" do\n    invalid_addresses = %w[user@example,com\
  \ user_at_foo.org user.name@example. foo@bar_baz.com foo@bar+baz.cn]\n    invalid_addresses.each\
  \ do |invalid_address|\n      @user.email = invalid_address\n      assert_not @user.valid?,\
  \ \"#{invalid_address.inspect} should be invalid\"\n    end\n  end\nend\n```\n\n\
  ***\n\n此时，测试结果应该是**红色**的：\n\n列表 6.20：**红色**\n\n***\n\n```bash\n$ rails test\n```\n\
  \n***\n\n应用程序的 email 格式验证使用 `format` 验证，其工作方式如下：\n\n点击此处查看代码图像\n\n```ruby\nvalidates\
  \ :email, format: { with: /<regular expression>/ }\n```\n\n这使用给定的*正则表达式*来验证属性，正则表达式是用于字符串模式匹配的强大（通常很晦涩）语言。\n\
  \n\n\n\n\n实际上存在一个根据官方电子邮件标准匹配电子邮件地址的完整正则表达式，但它非常庞大、晦涩，而且很可能适得其反。在本教程中，我们将采用一种更务实的、在实践中被证明是健壮的正则表达式。它如下：\n\
  \n11. 例如，你知道根据标准，`\"Michael Hartl\"@example.com`（带有引号且中间有空格）是一个有效的电子邮件地址吗？令人难以置信，它确实是——但这太荒谬了。\n\
  \n[点击此处查看代码图片]\n\n```ruby\nVALID_EMAIL_REGEX = /\\A[\\w+\\-.]+@[a-z\\d\\-.]+\\.[a-z]+\\\
  z/i\n```\n\n为了帮助理解这些从何而来，表 6.1 将其拆解成了易懂的部分。\n\n12. 注意，在表 6.1 中，“letter”实际上指的是“小写字母”，但正则表达式末尾的\
  \ `i` 强制执行不区分大小写的匹配。\n\n**表 6.1:** 拆解有效的电子邮件正则表达式。\n\n![image](img/image01097.jpeg)\n\
  \n虽然你可以通过学习表 6.1 学到很多，但为了真正理解正则表达式，我认为使用像 Rubular 这样的交互式正则表达式匹配器是必不可少的（图 6.7）。Rubular\
