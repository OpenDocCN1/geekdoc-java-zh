  \ `create` 中添加几行代码，如列表 11.23 所示。注意列表 11.23 改变了注册后的重定向行为。之前，我们重定向到用户配置页（节 7.4），但现在由于要求账户激活，这不再合理了。现在我们将其重定向到根\
  \ URL。\n\n**列表 11.23:** 为用户注册添加账户激活。RED\n\n`app/controllers/users_controller.rb`\n\
  \n点击此处查看代码图片\n\n* * *\n\n```ruby\nclass UsersController < ApplicationController\n\
  \  def create\n    @user = User.new(user_params)\n    if @user.save\n      UserMailer.account_activation(@user).deliver_now\n\
  \      flash[:info] = \"请检查您的邮件以激活账户。\"\n      redirect_to root_url\n    else\n\
  \      render 'new'\n    end\n  end\nend\n```\n\n\n\n\n由于列表 11.23 重定向到根 URL 而不是个人资料页，并且不像之前那样自动登录用户，测试套件目前显示为**红色（失败）**，尽管应用程序正在按照设计运行。我们将通过临时注释掉失败的行来修复此，如列表\
  \ 11.24 所示。我们将在第 11.3.3 节](#part0020.xhtml_ch11lev2sec9)中取消这些行的注释，并为账户激活编写通过的测试。\n\
