  \n我们学习 Ruby 的主要工具是 *Rails 控制台*（Rails console），它在 Section 2.3.3 中首次介绍，是一个与 Rails\
  \ 交互的命令行程序。控制台本身构建在交互式 Ruby (`irb`) 之上，因此可以使用 Ruby 语言的所有功能。（正如我们在 Section 4.4.4\
  \ 中所看到的，控制台还可以访问 Rails 环境。）\n\n默认情况下，控制台在*开发环境*（development environment）中启动，这是 Rails\
  \ 定义的三个环境之一（另外两个是 *test* 和 *production*）。这种区别在本章中并不重要，但在未来很重要，我们将在环境部分学习更多内容。\n\n\
  如果你使用的是云 IDE，我有几个建议包含的 irb 配置参数。使用简单的 `nano` 文本编辑器，在主目录下打开名为 `.irbrc` 的文件：²\n\n\
  [2.] `nano` 编辑器对初学者来说更容易，但对于这种短编辑我几乎总是使用 Vim 编辑器。要学习必备 Vim，请参阅*Learn Enough Vim*。\n\
  \n```\n$ nano ~/.irbrc\n```\n\n然后用 Listing 4.8 中的内容填充它，以简化提示并抑制某些烦人的自动缩进行为。\n\n\
  **Listing 4.8：** 添加一些 irb 配置。\n\n`~/.irbrc`\n\n点击此处查看代码图像\n\n```ruby\nIRB.conf[:PROMPT_MODE]\
  \ = :SIMPLE\nIRB.conf[:AUTO_INDENT_MODE] = false\n```\n\n最后，通过 Ctrl-X 退出 `nano`\
  \ 并输入 `y` 保存 `~/.irbrc`。\n\n现在我们可以这样在命令行中启动控制台：\n\n点击此处查看代码图像\n\n```\n$ rails console\n\
  Loading development environment\n>>\n```\n\n\n\n\n控制台（console）是一个极佳的学习工具，你可以尽管探索。不用担心——你（可能）不会弄坏任何东西。在使用控制台时，如果卡住了，请输入\
  \ `Ctrl-C`，或者输入 `Ctrl-D` 完全退出控制台。与普通的终端 shell 一样，你也可以使用上方向箭头检索之前的命令，这可以节省大量时间。\n\
  \n在本章的剩余部分中，你可能会发现查阅 Ruby API 很有帮助。它包含了大量的信息（甚至可能*太密集*了）；例如，为了学习更多关于 Ruby 字符串的知识，可以查看\
  \ Ruby API 中 `String` 类的条目。\n\n#### 4.2.1 注释\n\nRuby 的*注释*以井号 `#` 开始（也称为“hash mark”或更具诗意地称为“octothorpe”），并一直延伸到行末尾。Ruby\
  \ 会忽略注释，但它们对人类阅读者来说很有用（通常也包括原作者本人！）。在代码中：\n\n点击此处查看代码图片\n\n```ruby\n# 按每页返回完整标题。\n\
  def full_title(page_title = '')\n  .\n  .\n  .\nend\n```\n\n第一行是注释，指示了后续函数定义的目的。\n\
  \n通常你不会控制台会话中包含注释，但为了教学目的，我会在后续内容包含一些注释，如下：\n\n点击此处查看代码图片\n\n```ruby\n$ rails console\n\
  >> 17 + 42   # 整数相加\n=> 59\n```\n\n如果你在这一节中通过输入或复制粘贴命令到你自己的控制台来跟练习，你当然可以根据喜好省略注释；无论如何，控制台都会忽略它们。\n\
  \n#### 4.2.2 字符串\n\n*字符串*（Strings）可能是 Web 应用中最重要的数据结构，因为网页最终是由从服务器发送到浏览器的字符字符串组成的。让我们从控制台开始探索字符串：\n\
  \n点击此处查看代码图片\n\n```ruby\n$ rails console\n>> \"\"         # 空字符串\n=> \"\"\n>> \"\
  foo\"      # 非空字符串\n=> \"foo\"\n```\n\n这些是*字符串字面量*（string literals，也称为 *literal\
  \ strings*），使用双引号字符 `\"` 创建。控制台会打印每行的求值结果，对于字符串字面量来说，结果就是字符串本身。\n\n我们还可以使用 `+` 运算符拼接字符串：\n\
  \n点击此处查看代码图片\n\n```ruby\n>> \"foo\" + \"bar\"   # 字符串拼接\n=> \"foobar\"\n```\n\n\
  在这里，评估 `\"foo\"` 加上 `\"bar\"` 的结果是字符串 `\"foobar\"`。3 关于“foo”和“bar”的起源——特别是“foobar”与“FUBAR”之间可能存在的*非*关系——请参阅\
  \ Jargon File 中关于“foo”的条目。\n\n构建字符串的另一种方法是通过使用特殊语法 `#{}` 进行*插值*（interpolation）：4\
  \  Perl 或 PHP 的程序员应该将此与类似 `\"foo $bar\"` 表达式中美元符号变量的自动插值进行比较。\n\n点击此处查看代码图片\n\n\
  ```ruby\n>> first_name = \"Michael\"   # 变量赋值\n=> \"Michael\"\n>> \"#{first_name}\
  \ Hartl\"    # 字符串插值\n=> \"Michael Hartl\"\n```\n\n在这里，我们将值 `\"Michael\"` *赋值*给变量\
  \ `first_name`，然后将其插值到字符串 `\"#{first_name} Hartl\"` 中。我们也可以给两个字符串分配变量名：\n\n点击此处查看代码图片\n\
  \n```ruby\n>> first_name = \"Michael\"\n=> \"Michael\"\n>> last_name = \"Hartl\"\
  \n=> \"Hartl\"\n>> first_name + \" \" + last_name   # 拼接，中间有一个空格\n=> \"Michael Hartl\"\
  \n>> \"#{first_name} #{last_name}\"   # 等效插值\n=> \"Michael Hartl\"\n```\n\n注意最后两个表达式是等价的，但我更倾向于插值版本；必须添加单个空格\
  \ `\" \"` 似乎有点笨拙。\n\n#### 打印\n\n要在屏幕上*打印*一个字符串，最常用的 Ruby 函数是 `puts`（读作“put ess”）：\n\
  \n点击此处查看代码图片\n\n```ruby\n$ rails console\n>> puts \"foo\"\nfoo\n```\n\n正如单引号和双引号本质上可以互换的常见情况一样，你经常发现源代码在两者之间切换，而没有任何明显的模式。对于这一点，真的无可办法，只能说一句：“欢迎来到\
  \ Ruby 世界！”\n\n#### 单引号字符串\n\n到目前为止的所有示例都使用了双引号，但 Ruby 也支持单引号字符串。对于许多用途，这两种类型的字符串实际上是相同的：\n\
  \n点击此处查看代码图片\n\n```ruby\n>> 'foo'         # 单引号的\n=> \"foo\"\n>> 'foo' + 'bar'\n\
  => \"foobar\"\n```\n\n但存在一个重要的区别；Ruby 不会在单引号字符串中进行插值：\n\n点击此处查看代码图片\n\n```ruby\n\
  >> '#{foo} bar'\n=> \"\\#{foo} bar\"\n```\n\n\n\n1. 将变量 `city` 和 `state` 赋值为你当前居住的城市和州份。（如果居住在美国境外，请替换为相应的数值。）\n\
  \n2. 使用字符串插值，打印（使用 `puts`）一个由城市和州份组成的字符串，它们之间用逗号和空格分隔，例如“Los Angeles, CA”。\n\n3.\
  \ 重复上一个练习，但将城市和州份用制表符（tab）分隔。\n\n4. 如果在上一个练习中将双引号替换为单引号，结果是什么？\n\n#### 4.2.3 对象与消息传递\n\
  \nRuby 中的一切，包括字符串甚至 `nil`，都是一个*对象*。我们将在第 4.4.2 节 中看到它的技术含义，但我认为没有人能通过阅读书上的定义就理解什么是对象；你必须通过大量的示例来建立对对象的直觉。\n\
  \n描述对象*做什么*要容易得多，即响应消息。例如，像字符串这样的对象可以响应 `length` 消息，该消息返回字符串中字符的数量：\n\n点击此处查看代码图像\n\
  \n```\n>> \"foobar\".length         # 向字符串传递 \"length\" 消息\n=> 6\n```\n\n通常，传递给对象的消息是*方法*，它们是定义在这些对象上的函数。⁵字符串还响应\
  \ `empty?` 方法：\n\n5. 抱歉在本章中在*函数*（function）和*方法*（method）之间随意切换；在 Ruby 中，它们是同一事物：所有方法都是函数，所有函数都是方法，因为一切都是对象。\n\
  \n点击此处查看代码图像\n\n```ruby\n>> \"foobar\".empty?\n=> false\n\n>> \"\".empty?\n=> true\n\
  ```\n\n注意 `empty?` 方法结尾的问号。这是 Ruby 的惯例，表示返回值为*布尔值*：`true` 或 `false`。布尔值对于*控制流*特别有用：\n\
  \n点击此处查看代码图像\n\n```ruby\n>> s = \"foobar\"\n>> if s.empty?\n>> \"The string is empty\"\
  \n>> else\n>> \"The string is nonempty\"\n>> end\n=> \"The string is nonempty\"\n\
  ```\n\n要包含多个子句，我们可以使用 `elsif`（`else` + `if`）：\n\n点击此处查看代码图像\n\n```ruby\n>> if s.nil?\n\
  >> \"The variable is nil\"\n>> elsif s.empty?\n>> \"The string is empty\"\n>> elsif\
  \ s.include?(\"foo\")\n>> \"The string includes 'foo'\"\n>> end\n=> \"The string\
  \ includes 'foo'\"\n```\n\n布尔值还可以使用 `&&`（与）、`||`（或）和 `!`（非）运算符组合：\n\n点击此处查看代码图像\n\
  \n```ruby\n>> x = \"foo\"\n=> \"foo\"\n\n>> y = \"\"\n=> \"\"\n\n>> puts \"Both\
  \ strings are empty\" if x.empty? && y.empty?\n=> nil\n\n>> puts \"One of the strings\
  \ is empty\" if x.empty? || y.empty?\n\"One of the strings is empty\"\n=> nil\n\n\
  >> puts \"x is not empty\" if !x.empty?\n\"x is not empty\"\n=> nil\n```\n\n由于 Ruby\
  \ 中的一切都是对象，因此 `nil` 也是一个对象，所以它也可以响应方法。一个例子是 `to_s` 方法，它可以将几乎任何对象转换为字符串：\n\n点击此处查看代码图像\n\
  \n```ruby\n>> nil.to_s\n=> \"\"\n```\n\n这看起来确实是一个空字符串，我们可以通过对传递给 `nil` 的消息进行*链式*来验证：\n\
  \n点击此处查看代码图像\n\n```ruby\n>> nil.empty?\nNoMethodError: undefined method `empty?'\
  \ for nil:NilClass\n\n>> nil.to_s.empty?      # 消息链\n=> true\n```\n\n我们在这里看到 `nil`\
  \ 对象本身并不响应 `empty?` 方法，但 `nil.to_s` 响应。\n\n有一个特殊的方法用于测试是否为 `nil`，你可能已经猜到：\n\n点击此处查看代码图像\n\
  \n```ruby\n>> \"foo\".nil?\n=> false\n\n>> \"\".nil?\n=> false\n\n>> nil.nil?\n\
  => true\n```\n\n注意 `empty?` 方法（此处原文为 `nil?`）结尾的问号。这是 Ruby 的惯例，表示返回值为*布尔值*：`true`\
  \ 或 `false`。布尔值对于*控制流*特别有用。\n\n（注：由于提供的文本存在大量重复和格式残留，此处已根据要求处理了核心内容。）\n\n\n\n\n\
  ```ruby\n>> return \"The string is nonempty.\"\n>> end\n```\n\n（细锐的读者此时可能会注意到，这里的第二个\
  \ `return` 实际上是不必要的——作为函数的最后一个表达式，无论是否使用 `return` 关键字，字符串 `\"The string is nonempty.\"\
  ` 都会被返回，但在两个地方都使用 `return` 具有一种美上的对称感。）\n\n同样重要的一点是理解，对于调用者来说，函数参数的名称是无关的。换句话说，上面的示例可以将\
  \ `str` 替换为任何其他有效的变量名，例如 `the_function_argument`，它的工作原理完全一样：\n\n点击此处查看代码图像\n\n```ruby\n\
  >> def string_message(the_function_argument = '')\n>>   if the_function_argument.empty?\n\
  >>     \"It's an empty string!\"\n>>   else\n>>     \"The string is nonempty.\"\n\
  >>   end\n>> end\n```\n\n=> `nil`\n\n```ruby\n>> puts string_message(\"\")\nIt's\
  \ an empty string!\n\n>> puts string_message(\"foobar\")\nThe string is nonempty.\n\
  ```\n\n### 练习\n\n购买任何 Rails Tutorial 后，均可以在 railstutorial.org/solutions 免费获取练习答案。要查看他人的答案并记录自己的答案，请加入\
  \ learnenough.com/society 的 Learn Enough Society。\n\n1. 通过将 `FILL_IN` 替换为列表 4.10\
