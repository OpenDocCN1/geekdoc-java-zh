  \ Rails，这对于获得与本教程一致的结果非常重要。\n\n### 1.3 第一个应用程序\n\n遵循计算机编程的悠久传统，我们第一个应用程序的目标是编写一个“hello,\
  \ world”程序。具体来说，我们将创建一个简单的应用程序，在网页上显示字符串“hello, world!”，这将在同时出现在我们的开发环境（第 1.3.4\
  \ 节）和线上网络（第 1.5 节）。\n\n几乎所有的 Rails 应用都以相同的方式开始：运行 `rails new` 命令。这个方便的命令会在你选择的目录下创建一个\
  \ Rails 骨架应用程序。对于**没有**使用第 1.2.1 节推荐的 Cloud9 IDE 的用户，应该为你的 Rails 项目创建一个工作空间目录（如果它尚存在）（列表\
  \ 1.2 使用 Unix 命令 `cd` 和 `mkdir`；如果你不熟悉这些命令，请参见框 1.3。）\n\n**列表 1.2:** 为 Rails 项目创建工作空间目录（在云端环境中是不必要的）。\n\
  \n点击此处查看代码图像\n\n```\n$ cd              # 切换到主目录。\n$ mkdir workspace  # 创建工作空间目录。\n\
  $ cd workspace/    # 进入工作空间目录。\n```\n\n### 框 1.3: Unix 命令行速成课程\n\n对于来自 Windows 或（程度较小但仍然显著）Macintosh\
  \ OS X 的读者来说，Unix 命令行可能会感到陌生。幸运的是，如果你使用的是推荐的云环境，你将自动获得运行标准 Bash 命令行界面的 Unix（Linux）命令行。\n\
  \n命令行的基本思想非常简单：通过发布短命令，用户可以执行大量操作，例如创建目录（`mkdir`）、移动和复制文件（`mv` 和 `cp`）以及通过切换目录（`cd`）导航文件系统。对于主要习惯图形用户界面（GUI）的用户来说，命令行可能看起来原始，但表象具有欺骗性：命令行是开发者工具箱中最强大的工具之一。事实上，你很少看到经验丰富的开发者桌面上没有几个运行\
  \ shell 的终端窗口。\n\n这个主题很深奥，但对于本教程，我们只需要几个常用的 Unix 命令行命令，如表 1.1 总结所示。关于 Unix 命令的彻底介绍，请参见学到足够危险。\n\
  \n在本地系统和云端，下一步都是使用列表 1.3 中的命令创建第一个应用程序。注意列表 1.3 显式地包含了 Rails 版本作为命令的一部分。如果列表 1.3\
  \ 中的命令返回类似 `Could not find 'railties'` 的错误，这意味着你没有正确版本的 Rails，你应该仔细检查是否完全按照所示执行了列表\
  \ 1.1 中的命令。\n\n**表 1.1:** 常用命令。\n\n\n**列表 1.3:** 运行 rails new（带版本号）。\n\n```\n$ cd\
  \ ~/\n$ rails 5.0.0 new hello_app\n```\n\n\n\n\n\n使用 `bundle show [gemname]` 可以查看绑定的\
  \ gem 的安装位置。\n\n```bash\nrun bundle exec spring binstub --all\n```\n\n* `bin/rake`:\
  \ 插入了 spring\n* `bin/rails`: 插入了 spring\n* * *\n\n如列表 1.3 结尾所示，运行 `rails new` 在文件创建完成后会自动运行\
  \ `bundle install` 命令。我们将从第 1.3.1 节 开始详细讨论这意味着的意义。\n\n\n**图 1.4:** 新创建的 Rails 应用的目录结构。\n\
  \n注意 `rails` 命令创建了多少个文件和目录。这种标准的目录和文件结构（图 1.4）是 Rails 的众多优势之一：它能让你立即从零开始构建完备（尽管是极简的）的应用程序。此外，由于该结构对所有\
  \ Rails 应用都是通用的，当你查看他人的代码时，可以立即找到方向。\n\n默认 Rails 文件的摘要可见表 1.2。我们将在本书的剩余部分学习这些文件和目录的大部分。特别是，从第\
  \ 5.2.1 节开始，我们将讨论 `app/assets` 目录，它是*资源流水线*（asset pipeline）的一部分，这能够方便地组织和部署如级联样式表和\
  \ JavaScript 文件等资源。\n\n**表 1.2:** 默认 Rails 目录结构的摘要。\n\n\n#### 1.3.1 Bundler\n\n\
  创建一个新的 Rails 应用后，下一步是使用 *Bundler* 安装并包含应用所需的 gems。如第 1.3 节中简述提到的，Bundler 会由 `rails`\
