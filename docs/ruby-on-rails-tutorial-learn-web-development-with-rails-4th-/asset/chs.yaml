  \n### 14.4 结论\n\n随着状态源的添加，我们已经完成了 *Ruby on Rails*^™ 教程的示例应用程序。该应用程序包含了 Rails 所有主要功能的示例，包括模型、视图、控制器、模板、部分模板、过滤器、验证、回调、`has_many`/belongs_to`\
  \ 以及 `has_many :through` 关联、安全、测试和部署。\n\n尽管有这个令人印象深刻的列表，但 Web 开发仍有许多东西需要学习。作为这一过程的第一步，本节包含了一些进一步学习的建议。\n\
  \n#### 14.4.1 进一步资源指南\n\n商店和网络上有丰富的 Rails 资源——事实上，供应如此丰富以至于让人眼 overwhelming。好消息是，既然你已经走了这里，你就准备好应对任何其他挑战了。以下是一些进一步学习的建议：\n\
  \n• Learn Enough Society：高级订阅服务，包括 *Ruby on Rails*^™ 教程书籍的特别增强版以及 15 多小时的流媒体视频课程，其中充满了你无法从书中获得的技巧、窍门和现场演示。还包括其他\
  \ Learn Enough 教程的文本和视频。提供奖学金折扣。\n\n• Launch School：近年来涌现了许多面的开发者训练营，我建议在你所在的地区寻找一个，但\
  \ Launch School 也提供在线课程，可以在任何地方学习。如果你希望在结构化课程背景下获得导师反馈，Launch School 是一个特别好的选择。\n\
  \n• Turing School of Software & Design：位于科罗拉多州丹佛的为期 27 周的全职 Ruby/Rails/JavaScript\
  \ 培训计划。大多数学生在开始时编程经验有限，但具备快速上手所需的决心和动力。Turing 保证学生毕业后能找到工作，否则退还学费。\n\n• Bloc：一个具有结构化课程、个性化导师指导并侧重通过具体项目学习的在线训练营。使用优惠码\
  \ BLOCLOVESHARTL 可获得报名费减免 500 美元。\n\n• Firehose Project：导师驱动的在线编码训练营，专注于实战编程技能，如测试驱动开发、算法以及作为敏捷团队的一部分构建高级\
  \ Web 应用程序。提供两周的免费介绍课程。\n\n• Thinkful：一种在线课程，让你与一名专业工程师配对，共同完成基于项目的课程。科目包括 Ruby\
  \ on Rails、前端开发、Web 设计和数据科学。\n\n• Pragmatic Studio：由 Mike 和 Nicole Clark 提供的在线 Ruby\
  \ 和 Rails 课程。\n\n• RailsApps：教学性示例 Rails 应用程序\n\n• Code School：多种交互式编程课程\n\n####\
  \ 14.4.2 我们在本章学到了什么\n\n• Rails `has_many :through` 允许对复杂的数据关系进行建模。\n\n• `has_many`\
  \ 方法接受几个可选参数，包括对象类名和外键。\n\n• 通过对类名和外键进行正确选择并使用 `has_many` 和 `has_many :through`，我们可以对主动（关注）和被动（被关注）关系进行建模。\n\
  \n• Rails `where` 是创建查询的灵活方式。\n\n• 通过整合书中学到的所有内容，我们成功地实现了一个状态源。\n\n### 索引\n\n*斜体*页码表示图表，*斜体*表示表格。\n\
