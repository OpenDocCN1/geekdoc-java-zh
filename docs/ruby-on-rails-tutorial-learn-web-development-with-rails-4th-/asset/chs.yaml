  \n在第 13.4.3 节中开发的图片上传器对于开发来说足够了，但（如列表 13.67 中的 `storage :file` 行所示），它使用本地文件系统来存储图片，这在生产环境中并不是一个良好的做法。相反，我们将使用云存储服务来将图片与应用程序分开存储。\n\
  \n21. 除其他外，Heroku 上的文件存储是临时的，因此每次部署时上传的图片都会被删除。\n\n22. 这一节具有挑战性，可以跳过而不影响连贯性。\n\n\
  为了配置我们的应用程序在生产环境中使用云存储，我们将使用 `fog` gem，如列表 13.69 所示。\n\n**列表 13.69：** 为生产环境配置图片上传器。\n\
  \n```ruby\napp/uploaders/picture_uploader.rb\n```\n\n点击此处查看代码图片\n\n```ruby\nclass\
  \ PictureUploader < CarrierWave::Uploader::Base\n  include CarrierWave::MiniMagick\n\
  \  process resize_to_limit: [400, 400]\n  if Rails.env.production?\n    storage\
  \ :fog\n  else\n    storage :file\n  end\n\n  # 覆盖上传文件存储的目录\n  # 对于旨在挂载的上传器，这是一个合理的默认值：\n\
  \  def store_dir\n    \"uploads/#{model.class.to_s.underscore}/#{mounted_as}/#{model.id}\"\
  \n  end\n\n  # 添加允许上传的扩展名白名单\n  def extension_white_list\n    %w(jpg gif png)\n\
  \  end\nend\n```\n\n列表 13.69 使用框 7.1 中的 `production?` 布尔值来根据环境切换存储方法：\n\n点击此处查看代码图片\n\
  \n```ruby\nif Rails.env.production?\n  storage :fog\nelse\n  storage :file\nend\n\
  ```\n\n云存储有许多选择，但我们将使用最流行且支持最好的服务之一：Amazon.com 的 Simple Storage Service (S3)。](#part0022.xhtml_ch13en23)\
  \ 以下是启动它的关键步骤：\n\n23. S3 是一项付费服务，但设置和测试 Rails 所需的存储每月费用不到一分钱。\n\n1. 注册 Amazon Web\
  \ Services 账户。\n2. 通过 AWS 身份管理 (IAM) 创建用户并记录访问密钥（access key）和密钥（secret key）。\n3.\
  \ 使用 AWS 控制台创建一个 S3 桶（可以使用你喜欢的名称），然后为上一步创建的用户授予读取和写入权限。\n\n你可能会发现设置 S3 是一项技术上具有挑战性的练习（框\
  \ 1.1）；有关上述步骤的更多细节，请参阅 S3 文档[](#part0022.xhtml_ch13en24)（如有必要，咨询 Google 或 Stack\
  \ Overflow）。\n\n24. aws.amazon.com/documentation/s3\n\n一旦你创建并配置了 S3 账户，就应该像列表 13.70\
  \ 所示创建并填充 `CarrierWave` 配置文件。\n\n*注意*：如果你的设置不起作用，可能是区域位置出了问题。某些用户可能需要在 fog 凭据中添加\
  \ `:region => ENV['S3_REGION']`，然后在命令行运行 `heroku config:set S3_REGION=<bucket region>`，其中存储桶区域应该是类似于\
  \ `'eu-central-1'` 的内容，取决于你的位置。要确定正确的区域，请参阅 Amazon 的区域和端点列表。\n\n**列表 13.70：** 配置\
  \ `CarrierWave` 使用 S3。\n\n```ruby\nconfig/initializers/carrier_wave.rb\n```\n\n\
  点击此处查看代码图片\n\n```ruby\nif Rails.env.production?\n  CarrierWave.configure do |config|\n\
  \    config.fog_credentials = {\n      # Amazon S3 的配置\n      provider: 'AWS',\n\
  \      aws_access_key_id: ENV['S3_ACCESS_KEY'],\n      aws_secret_access_key: ENV['S3_SECRET_KEY']\n\
  \    }\n    config.fog_directory = ENV['S3_BUCKET']\n  end\nend\n```\n\n与生产环境邮件配置（列表\
  \ 11.41）一样，列表 13.70 使用了 Heroku `ENV` 变量来避免硬编码敏感信息。在第 11.4 节和第 12.4 节中，这些变量是自动定义的，但在本情况下我们需要显式定义它们，可以通过以下\
  \ `heroku config:set` 实现：\n\n点击此处查看代码图片\n\n```bash\n$ heroku config:set S3_ACCESS_KEY=<access\
  \ key>\n$ heroku config:set S3_SECRET_KEY=<secret key>\n$ heroku config:set S3_BUCKET=<bucket\
  \ name>\n```\n\n完成上述配置后，我们就可以提交更改并部署。我建议如列表 13.71 所示更新 `.gitignore` 文件，以忽略上传目录。\n\
