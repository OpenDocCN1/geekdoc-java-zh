  \ 和 `GREEN` 之间切换。（你需要在每次切换之间保存文件。）\n\n### 8.3 注销\n\n正如[Section 8.1]所述，我们的身份验证模型是让用户保持登录状态，直到他们显式注销。在本节中，我们将添加这一必要的注销功能。由于“Log\
  \ out”链接已经定义（[Listing 8.19]），我们只需要编写一个有效的控制器动作来销毁会话。\n\n到目前为止，Sessions 控制器一直遵循 RESTful\
  \ 规范，使用 `new` 渲染登录页面并使用 `create` 完成登录。我们将继续这一主题，使用 `destroy` 动作来删除会话，即注销。与我们在[Listing\
  \ 8.15]和[Listing 8.25]中使用的登录功能不同，我们只在一个地方注销，因此我们将相关代码放在 `destroy` 动作中。正如我们在[Section\
  \ 9.3]中看到的，这种设计（经过少量重构）也将使身份验证机制更容易测试。注销涉及撤销[Listing 8.14]中 `log_in` 方法产生，这涉及到从会话中删除用户。为了做到，我们如下使用\
  \ `delete` 方法：某些浏览器提供“恢复上次位置”的功能，它可以恢复会话，因此在尝试注销之前，务必禁用任何功能。\n\n```ruby\nsession.delete(:user_id)\n\
  ```\n\n我们还将把当前用户设置为 `nil`，尽管在当前由于会立即重定向到根 URL，这并不重要。与 `log_in` 及相关方法一样，我们将生成的 `log_out`\
  \ 方法放在 Sessions helper 中，如[Listing 8.29]所示。将 `@current_user` 设置为 `nil` 只有在 `@current_user`\
  \ 在 `destroy` 动作之前被创建（它并没有）且我们没有发出立即重定向（我们确实发出了）的情况下才有意义。这是一种不太可能的事件组合，而且根据目前构建的应用程序，这是必要的，但因为涉及安全，为了完整性我包含了它。\n\
  \n**Listing 8.29：** `log_out` 方法。\n\n```ruby\napp/helpers/sessions_helper.rb\n```\n\
  \n[点击此处查看代码图片]\n\n* *\n\n```ruby\nmodule SessionsHelper\n  # 登录给定用户。\n  def log_in(user)\n\
  \    session[:user_id] = user.id\n  end\n\n  # 注销当前用户。\n  def log_out\n    session.delete(:user_id)\n\
  \    @current_user = nil\n  end\nend\n```\n\n* *\n\n我们可以将 `log_out` 方法用于 Sessions\
  \ 控制器的 `destroy` 动作中，如[Listing 8.30]所示。\n\n**Listing 8.30：** 销毁会话（用户注销）。\n\n```ruby\n\
  app/controllers/sessions_controller.rb\n```\n\n[点击此处查看代码图片]\n\n* *\n\n```ruby\n\
  class SessionsController < ApplicationController\n  def new\n  end\n\n  def create\n\
  \    user = User.find_by(email: params[:session][:email].downcase)\n    if user\
  \ && user.authenticate(params[:session][:password])\n      log_in user\n      redirect_to\
  \ user\n    else\n      flash.now[:danger] = 'Invalid email/password combination'\n\
  \      render 'new'\n    end\n  end\n\n  def destroy\n    log_out\n    redirect_to\
  \ root_url\n  end\nend\n```\n\n* *\n\n为了测试注销机制，我们可以为[Listing 8.23]中的用户测试添加一些步骤。登录后，我们使用\
  \ `delete` 向注销路径（Table 8.1）发送请求，验证用户已注销并重定向到根 URL。我们还检查登录链接是否重新出现注销链接是否消失。新步骤出现在[Listing\
  \ 8.31]中。\n\n**Listing 8.31：** 用户注销测试。`GREEN`\n\n```ruby\ntest/integration/users_login_test.rb\n\
  ```\n\n[点击此处查看代码图片]\n\n* *\n\n```ruby\nrequire 'test_helper'\nclass UsersLoginTest\
  \ < ActionDispatch::IntegrationTest\n  test \"login with valid information followed\
  \ by logout\" do\n    get login_path\n    post login_path, params: { session: {\
  \ email: @user.email, password: 'password' } }\n    assert is_logged_in?\n    assert_redirected_to\
  \ @user\n    follow_redirect!\n    assert_template 'users/show'\n    assert_select\
  \ \"a[href=?]\", login_path, count: 0\n    assert_select \"a[href=?]\", logout_path\n\
  \    delete logout_path\n    assert_not is_logged_in?\n    assert_redirected_to\
  \ root_url\n    follow_redirect!\n    assert_select \"a[href=?]\", login_path\n\
  \    assert_select \"a[href=?]\", logout_path, count: 0\n    assert_select \"a[href=?]\"\
  , user_path(@user), count: 0\n  end\nend\n```\n\n\n\n\n\n（既然我们现在可以在测试中使用 `is_logged_in?`\
  \ 了，我们在向 sessions 路径发布有效信息后，紧接着添加了一个奖励性的 `assert is_logged_in?`。）\n\n随着会话 `destroy`\
  \ 动作的定义和测试，初始的注册/登录/注销三部曲已完成，测试套件结果应该是 `GREEN`（绿色）：\n\n**列表 8.32：`GREEN`**\n\n***\n\
  \n```\n$ rails test\n```\n\n### 练习题\n\n购买任何 Rails Tutorial 后，均可以在 railstutorial.org/solutions\
