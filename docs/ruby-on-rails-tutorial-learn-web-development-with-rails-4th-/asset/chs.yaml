  \        format: { with: VALID_EMAIL_REGEX },\n                   uniqueness:  case_sensitive:\
  \ false\nend\n```\n\n注意，我们仅仅是在 Listing 6.27 中将 Listing 6.25 中的 `true` 替换为了 `case_sensitive:\
  \ false`（Rails 推断出 `uniqueness` 也应该是 `true`）。\n\n此时，我们的应用程序——尽管有一个重要的限制——已经执行了电子邮件唯一性检查，我们的测试套件应该通过：\n\
  \n**Listing 6.28: GREEN**\n\n```bash\n$ rails test\n```\n\n这里有一个小问题，即 Active Record\
  \ 的唯一性验证并不保证数据库级别的唯一性。以下是一个解释原因的场景：\n\n1. Alice 注册了示例应用，地址为 `alice@wonderland.com`。\n\
  2. Alice 不小心点击了*两次*“提交”，连续发送了两个请求。\n3. 发生了以下序列：请求 1 在内存中创建了一个通过验证的用户，请求 2 执行了同样的操作；请求\
  \ 1 的用户被保存，请求 2 的用户被保存。\n4. 这导致了两个具有相同电子邮件地址的用户记录，尽管有唯一性验证。\n\n如果上面的序列看起来不可不可信，请相信我，它确实会发生：任何具有大量流量的\
  \ Rails 网站都可能出现这种情况（我曾吃过惨痛教训）。幸运的是，解决方案非常简单：我们只需要在数据库层面和模型层面都强制执行唯一性。我们的方法是在 email\
  \ 列上创建一个数据库索引（Box 6.2），然后要求该索引是唯一的。\n\n### Box 6.2: 数据库索引\n\n在数据库中创建列时，考虑我们是否需要通过该列*查找*记录是非常重要的。例如，考虑\
  \ Listing 6.2 中迁移创建的 email 属性。当我们从第 7 章开始允许用户登录示例应用时，我们需要找到与提交的电子邮件地址对应的用户记录。遗憾的是，基于朴素的数据模型，通过电子邮件地址查找用户的唯一方法是遍历数据库中的*每个*用户行，并将其电子邮件属性与给定的电子邮件进行比较——这意味着我们可能必须检查*每一*行（因为用户可能是数据库中的最后一条）。这在数据库领域被称为*全表扫描*（full-table\
  \ scan），对于拥有数千个用户的真实网站来说，这是一个坏事（Bad Thing）。\n\n在 email 列上建立索引可以解决这个问题。为了理解数据库索引，可以类比书的索引。在书中，为了找到某个字符串（例如\
  \ `foobar`）的所有出现位置，你需要扫描每一页——这是全表扫描的纸质版本。另一方面，有了书索引，你只需要在索引中查找 `foobar` 即可。\n\n\n\
  \n\n\n此时，测试套件应该处于 `RED`（红色）状态，因为由于违反了 `fixtures` 中的唯一性约束（这些 fixtures 包含了测试数据库的样本数据）。用户固件已在\
  \ 列表 6.1 中自动生成，并且正如 列表 6.30 所示，邮箱地址不是唯一的。（它们同样不 `valid` 有效，但 fixture 数据不会通过验证。）\n\
  \n**列表 6.30：** 默认用户固件。`RED`\n\n```yaml\ntest/fixtures/users.yml\n```\n\n点击此处查看代码图片\n\
