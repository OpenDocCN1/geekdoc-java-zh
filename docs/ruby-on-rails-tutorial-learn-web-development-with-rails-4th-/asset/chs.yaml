  \n**列表 4.11：** 一个带注释的 `title_helper`。\n\n`app/helpers/application_helper.rb`\n\n\
  点击此处查看代码图像\n\n***\n\n```ruby\nmodule ApplicationHelper\n  # 根据每个页面返回完整标题。# 文档注释\n\
  \  def full_title(page_title = '')                   # 方法定义，可选参数\n    base_title\
  \ = \"Ruby on Rails Tutorial Sample App\"  # 变量赋值\n    if page_title.empty?    \
  \                       # 布尔测试\n      base_title                               \
