  \  post  '/login',    to: 'sessions#create'\n  delete '/logout',  to: 'sessions#destroy'\n\
  \  resources :users\n  resources :account_activations, only: [:edit]\n  resources\
  \ :password_resets, only:[:new, :create, :edit, :update]\nend\n```\n\n列表 12.1 中的代码安排了表\
  \ 12.1 所示的 RESTful 路由。特别是，表 12.1 中的第一个路由通过 `new_password_reset_path` 提供了指向“忘记密码”表单的链接，如列表\
  \ 12.2 和图 12.4 所示。\n\n**表 12.1：** 列表 12.1 中 `Password Resets` 资源提供的 RESTful 路由。\n\
  \n![image](img/image01641.jpeg)\n\n**列表 12.2：** 为密码重置添加链接。\n\n`app/views/sessions/new.html.erb`\n\
