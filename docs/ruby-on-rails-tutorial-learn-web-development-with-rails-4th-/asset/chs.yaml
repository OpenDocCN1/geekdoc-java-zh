  # FixtureSet.html\n\n**one:**\n```yaml\nname: MyString\nemail: MyString\n```\n\n\
  **two:**\n```yaml\nname: MyString\nemail: MyString\n```\n\n***\n\n由于我们直到 第 8 章 才需要用到\
  \ fixtures，目前我们只需将其删除，留下一个空的 fixtures 文件（列表 6.31）。\n\n**列表 6.31：** 一个空的 fixtures\
  \ 文件。`GREEN`\n\n```yaml\ntest/fixtures/users.yml\n```\n\n***\n\n# empty\n\n***\n\
  \n在处理了唯一性的警告问题后，我们还需要进行另一项更改，以确保邮箱的唯一性。某些数据库适配器使用区分大小写的索引，它们认为字符串“Foo@ExAMPle.CoM”和“foo@example.com”是不同的，但我们的应用程序将这些地址视为同一个地址。为了避免这种不兼容性，我们将统一使用全小写地址，在将其保存到数据库之前，将“Foo@ExAMPle.CoM”转换为“foo@example.com”。实现此点的方法是使用\
  \ `callback`（回调），它是在 Active Record 对象生命周期中的特定点被调用的方法。在当前情况下，该点是在对象保存之前，因此我们将使用 `before_save`\
  \ 回调在保存用户之前将 email 属性转换为小写。17 结果出现在 列表 6.32.。（这只是第一次实现；我们将在 第 11.1 节 中再次讨论这个主题，那里我们将使用推荐的方法引用约定来定义回调。）\n\
  \n17. 查看 Rails 关于 callbacks 的条目获取更多关于 Rails 支持哪些回调的信息。\n\n**列表 6.32：** 通过将 email\
  \ 属性转换为小写来确保邮箱唯一性。`GREEN`\n\n```ruby\napp/models/user.rb\n```\n\n点击此处查看代码图片\n\n\
  ```ruby\nclass User < ApplicationRecord\n  before_save { self.email = email.downcase\
  \ }\n  validates :name, presence: true, length: { maximum: 50 }\n  VALID_EMAIL_REGEX\
  \ = /\\A[\\w+\\-.]+@[a-z\\d\\-.]+\\.[a-z]+\\z/i\n  validates :email, presence: true,\
  \ length: { maximum: 255 },\n                   format: { with: VALID_EMAIL_REGEX\
  \ },\n                   uniqueness: { case_sensitive: false }\nend\n```\n\n***\n\
  \n列表 6.32 中的代码向 `before_save` 回调传递了一个代码块，并使用 `downcase` 字符串方法将用户的邮箱地址设置为其当前值的小写版本。（为邮箱转小写编写测试留留了一个练习\
  \ [第 6.2.5 节。）\n\n在 列表 6.32 中，我们可以将赋值写为：\n\n点击此处查看代码图片\n\n```ruby\nself.email =\
  \ self.email.downcase\n```\n\n（其中 `self` 指代当前用户），但在 User 模型内部，右侧的 `self` 关键字是可选的：\n\
  \n```ruby\nself.email = email.downcase\n```\n\n我们之前在 `palindrome` 方法的 `reverse`\
  \ 背景下简要遇到过这个想法（第 4.4.2 节），该节还提到在赋值中 `self` 不是可选的，所以：\n\n```ruby\nemail = email.downcase\n\
  ```\n\n将不起。（我们将在 第 9.1 节 中更深入地讨论这个主题。）此时，Alice 的场景将正常运行：数据库将根据第一个请求保存用户记录，并拒绝第二次保存，因为重复的邮箱违反了唯一性约束。（Rails\
  \ 日志中会出现一个错误，但这无大碍。）此外，在 `email` 属性上添加此索引实现了第二个目标，该目标在 第 6.1.4 节 中曾简要提及，正如 框 6.2\
  \ 所示。\n\n### 练习\n\n练习答案可以在 stutorial.org 免费获取。1. 运行测试套件，注释掉 `before_save` 行以获得 `RED`；然后取消注释以获得\
