  \ 我们在本章中学到的\n\n- 迁移（Migrations）允许我们修改应用程序的数据模型。\n- Active Record 提供了大量方法用于创建和操作数据模型。\n\
  - Active Record 验证允许我们对模型中的数据设置约束条件。\n\n\n\n\n\n本节的个人资料页将是应用程序中第一个真正的动态页面。虽然该视图以单页代码的形式存在，但每个个人资料页将使用从应用程序数据库检索到的信息进行自定义。为了给向我们的示例应用程序添加动态页面做准备，现在是为我们的站点布局添加一些调试信息的好机（列表\
  \ 7.1）。这将使用内置的 `debug` 方法和 `params` 变量显示每个页的一些有用信息（我们将在第 7.1.2 节 中详细介绍这些）。\n\n**列表\
  \ 7.1：** 在站点布局中添加一些调试信息。\n\n`app/views/layouts/application.html.erb`\n\n点击此处查看代码图片\n\
  \n```html\n<!DOCTYPE html>\n<html>\n  .\n  .\n  .\n  <body><body>\n    <%= render\
  \ 'layouts/header' %>\n    <div class=\"container\">\n      <%= yield %>\n     \
  \ <%= render 'layouts/footer' %>\n      <%= debug(params) if Rails.env.development?\
  \ %>\n    </div>\n  </body>\n</html>\n```\n\n由于我们不想向已部署的应用程序的用户显示调试信息，列表 7.1 使用\n\
  \n`if Rails.env.development?`\n\n来将调试信息限制在*开发环境*中，这是 Rails 默认定义的三个环境之一（框 7.1）。特别地，`Rails.env.development?`\
  \ 仅在开发环境中为 `true`，因此通过嵌入的 Ruby 代码，你也可以定义自己的自定义环境；详情请查看有关添加环境的 RailsCast。\n\n点击此处查看代码图片\n\
  \n```ruby\n<%= debug(params) if Rails.env.development? %>\n```\n\n该代码不会被插入到生产环境应用程序或测试中。（在测试中插入调试信息可能没有害，但可能也没有任何好处，因此最好将调试显示仅限制在开发环境。）\n\
  \n### 框 7.1：Rails 环境\n\nRails 配备了三个环境：test、development 和 production。Rails 控制台的默认环境是\
  \ development：\n\n点击此处查看代码图片\n\n```bash\n$ rails console\nLoading development environment\n\
  >> Rails.env\n=> \"development\"\n>> Rails.env.development?\n=> true\n>> Rails.env.test?\n\
  => false\n```\n\n如你所见，Rails 句了一个带有 `env` 属性和相关环境布尔方法的 `Rails` 对象，例如，`Rails.env.test?`\
  \ 在测试环境中返回 true，在其他情况下返回 false。\n\n如果你需要在不同的环境中运行控制台（例如，为了调试测试），你可以将环境作为参数传递给控制台脚本：\n\
  \n```bash\n$ rails console test\nLoading test environment\n>> Rails.env\n=> \"test\"\
  \n>> Rails.env.test?\n=> true\n```\n\n与控制台一样，development 是 Rails 服务器的默认环境，但你也可以在不同的环境中运行它：\n\
  \n点击此处查看代码图片\n\n```bash\n$ rails server --environment production\n```\n\n如果你查看在生产环境中运行的应用程序，如果没有生产数据库，它将无法工作，我们可以通过在生产环境中运行\
  \ `rails db:migrate` 来创建它：\n\n点击此处查看代码图片\n\n```bash\n$ rails db:migrate RAILS_ENV=production\n\
  ```\n\n（我发现用于非默认环境中运行控制台、服务器和迁移命令的惯用法命令使用了不同的语法，这让我困惑，这就是我费意展示这三个原因。不过，值得注意的是，在任何一个命令前加上\
  \ `RAILS_ENV=<env>` 同样有效，例如 `RAILS_ENV=production rails server`。）\n\n顺便说一下，如果你已将示例应用部署到\
  \ Heroku，你可以使用 `heroku run console` 查看它的环境：\n\n```bash\n$ heroku run console\n>>\
  \ Rails.env\n=> \"production\"\n>> Rails.env.production?\n=> true\n```\n\n自然，由于\
  \ Heroku 是一个用于生产站点的平台，它在生产环境中运行每个应用程序。\n\n为了让调试输出看起来更美观，我们将在第 5 章 创建的自定义样式表中添加一些规则，如\
  \ 列表 7.2 所示。\n\n**列表 7.2：** 添加用于漂亮调试框的代码，包括一个 Sass mixin。\n\n`app/assets/stylesheets/custom.css.scss`\n\
  \n点击此处查看代码图片\n\n```scss\n@import \"bootstrap-rockets\";\n@import \"bootstrap\";\n\
  /* mixins, variables, etc. */\n$gray-medium-light: #eaeaea;\n@mixin box_sizing {\n\
  \  -moz-box-sizing: border-box;\n  -webkit-box-sizing: border-box;\n  box-sizing:\
  \ border-box;\n}\n\n/* miscellaneous */\n.debug_dump {\n  clear: both;\n  float:\
  \ left;\n  width: 100%;\n  margin-top: 45px;\n  @include box_sizing;\n}\n```\n\n\
  这引入了 Sass *mixin* 功能，mixin 允许一组 CSS 规则被打包并重复使用：\n\n```scss\n.debug_dump {\n  @include\
  \ box_sizing;\n}\n```\n\n点击此处查看代码图片\n\n```scss\n.debug_dump {\n  -moz-box-sizing:\
