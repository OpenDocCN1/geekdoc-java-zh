  end\n>> string_shuffle(\"foobar\")\n=> \"oobfra\"\n```\n\n### 4.3.3 哈希（Hashes）与符号（Symbols）\n\
  \n哈希本质上是不局限于整数索引的数组。（事实上，某些语言，尤其是 Perl，有时因为这个原因将哈希称为*关联数组*。）相反，哈希索引（或称为*键*，keys）可以是几乎任何对象。例如，我们可以使用字符串作为键：\n\
  \n点击此处查看代码图像\n\n```ruby\n>> user = {}                          # {} 是一个空哈希。\n=>\
  \ {}\n\n>> user[\"first_name\"] = \"Michael\"     # 键 \"first_name\", 值 \"Michael\"\
  \n=> \"Michael\"\n\n>> user[\"last_name\"] = \"Hartl\"       # 键 \"last_name\",\
  \ 值 \"Hartl\"\n=> \"Hartl\"\n\n>> user[\"first_name\"]                 # 元素访问类似于数组。\n\
  => \"Michael\"\n\n>> user                              # 哈希的字面量表示\n=> {\"last_name\"\
  =>\"Hartl\", \"first_name\"=>\"Michael\"}\n```\n\n哈希用包含键值对的圆括号表示；一对没有键值对的圆括号——即\
  \ `{}`——是一个空哈希。需要注意的是，哈希的圆括号与块（block）的圆括号无关。（是的，这可能会让人困惑。）尽管哈希看起来像数组，但区别之一是，哈希通常不保证将其元素保持在特定顺序。如果顺序很重要，请使用数组。Ruby\
  \ 1.9 及更高版本实际上保证了哈希会保持元素的原有顺序，但依赖此这一点是不明智的。\n\n与其使用方括号逐个定义哈希项，不如很容易使用键和值由 `=>` 分隔的字面量表示，这被称为“哈希火箭”（hashrocket）：\n\
  \n点击此处查看代码图像\n\n```ruby\n>> user = {\"first_name\" => \"Michael\", \"last_name\"\
  \ => \"Hartl\"}\n```\n\n\n\n\n\n这种构造方式更紧地遵循了其他语言（如 JavaScript）中的 hash 记法，并在 Rails\
  \ 社区中变得越来越流行。由于两种 hash 语法都在在使用，因此能够识别这两种语法至关重要。遗憾的是，这可能会引起困惑，尤其是因为 `:name` 本身是有效的（作为一个独立的符号），但\
  \ `name:` 本身并没有意义。结底的结论是，`:name =>` 和 `name:` 仅在*字面量 hash 内部*是等效的，因此：\n\n`{ :name\
  \ => \"Michael Hartl\" }`\n\n和\n\n`{ name: \"Michael Hartl\" }`\n\n是等价的，但在其他情况下，你需要使用\
  \ `:name`（冒号在前）来表示一个符号。\n\nHash 值可以是任何内容，甚至是其他的 hash，如 列表 4.13 所示。\n\n**列表 4.13：**\
  \ 嵌套 hash。\n\n点击此处此处查看代码图片\n\n***\n\n```ruby\n>> params = {}      # 定义一个名为 'params'\
  \ 的 hash（'parameters' 的缩写）。\n=> {}\n\n>> params[:user] = { name: \"Michael Hartl\"\
  , email: \"mhartl@example.com\" }\n=> {:name=>\"Michael Hartl\", :email=>\"mhartl@example.com\"\
  }\n\n>> params\n=> {:user=>{:name=>\"Michael Hartl\", :email=>\"mhartl@example.com\"\
  }}\n\n>> params[:user][:email]\n=> \"mhartl@example.com\"\n```\n\n***\n\n这种 hash\
  \ 中的 hash，或者说*嵌套 hash*被 Rails 广泛使用，我们将从 第 7.3 节 开始看到。\n\n### 迭代\n\n与数组和范围一样，hash\
  \ 也响应于 `each` 方法。例如，考虑一个名为 `flash` 的 hash，它包含两个状态的键：`:success` 和 `:danger`：\n\n\
  点击此处查看代码图片\n\n```ruby\n>> flash = { success: \"It worked!\", danger: \"It failed.\"\
  \ }\n=> {:success=>\"It worked!\", :danger=>\"It failed.\"}\n\n>> flash.each do\
  \ |key, value|\n?>   puts \"Key #{key.inspect} has value #{value.inspect}\"\n>>\
  \ end\nKey :success has value \"It worked!\"\nKey :danger has value \"It failed.\"\
  \n```\n\n注意，虽然数组的 `each` 方法接收一个带有一个变量的块，但 hash 的 `each` 接收两个变量：一个*键*和一个*值*。因此，hash\
  \ 的 `each` 方法一次遍历遍历 hash 中的一个键值*对*。\n\n上一个示例使用了非常有用的 `inspect` 方法，该方法返回一个包含被调用对象字面量表示的字符串：\n\
  \n***\n\n点击此处查看代码图片\n\n```ruby\n>> puts (1..5).to_a              # 将数组作为字符串输出。\n\
  1\n2\n3\n4\n5\n\n>> puts (1..5).to_a.inspect      # 打印字面量数组。\n[1, 2, 3, 4, 5]\n\n\
  >> puts :name, :name.inspect\nname\n:name\n\n>> puts \"It worked!\", \"It worked!\"\
  .inspect\nIt worked!\n\"It worked!\"\n```\n\n***\n\n顺便说一下，使用 `inspect` 打印对象非常常见，因此有一个快捷方式，即\
  \ `p` 函数：12)。\n\n12. 实际上有一个细微的区别，即 `p` 返回正在打印的对象，而 `puts` 总是返回 `nil`。（感谢读者 Katarzyna\
  \ Siwek 指出。）\n\n点击此处查看代码图片\n\n```ruby\n>> p :name      # 输出与 'puts :name.inspect'\
  \ 相同\n:name\n```\n\n##### 练习\n\n购买任何 Rails Tutorial 后，可以在 railstutorial.org/solutions\
