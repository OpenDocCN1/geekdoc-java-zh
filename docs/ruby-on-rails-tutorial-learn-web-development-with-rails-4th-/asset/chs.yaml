  \ 免费获取。要查看他人的答案并记录自己的答案，请加入 learnenough.com 的 Learn Enough Society。\n\n1. 为什么保护\
  \ `edit` 和 `update` action 是重要的？\n2. 哪个 action 可以在浏览器中更容易地测试？\n\n#### 10.2.3 友好重定向\n\
  \n我们的网站授权已经编写完成，但有一个小瑕疵：当用户尝试访问受保护的页面时，他们目前会被重定向到他们的个人页面，无论他们原本想去哪里。也就是说，如果一个未登录的用户尝试访问编辑页面，登录后该用户将被重定向到\
  \ /users/1 而不是\n\n\n\n\n\n`/users/1/edit`。相反，将他们重定向到目标地页会友好得多。\n\n应用程序代码将变得相当复杂，但我们只需要通过反转列表\
  \ 10.17 中登录和访问编辑页的顺序，就可以为友好重定向编写一个极其简单的测试。如列表 10.29 所示，生成的测试会尝试访问编辑页，然后登录，最后检查用户是否被重定向到\
  \ `edit` 页面而不是默认的个人资料页面。（列表 10.29 同时也删除了渲染编辑模板的测试，因为那不再是预期的行为。）\n\n**列表 10.29：**\
  \ 友好重定向的测试。**红色**\n\n```ruby\ntest/integration/users_edit_test.rb\n\n点击此处查看代码图像\n\
  \n```ruby\nrequire 'test_helper'\n\nclass UsersEditTest < ActionDispatch::IntegrationTest\n\
  \  def setup\n    @user = users(:michael)\n  end\n\n  test \"successful edit with\
  \ friendly forwarding\" do\n    get edit_user_path(@user)\n    log_in_as(@user)\n\
  \    assert_redirected_to edit_user_path(@user)\n    name  = \"Foo Bar\"\n    email\
  \ = \"foo@bar.com\"\n    patch user_path(@user), params: { user: { name: name,\n\
  \                                            email: email,\n                   \
  \                         password:          \"\",\n                           \
  \                 password_confirmation: \"\" } }\n    assert_not flash.empty?\n\
  \    assert_redirected_to @user\n    @user.reload\n    assert_equal name,  @user.name\n\
  \    assert_equal email, @user.email\n  end\nend\n```\n\n现在我们已经有一个失败的测试了，准备好实现友好重定向了。⁵\
  \ 为了将用户重定向到他们的目标地址，我们需要在某处存储请求页面的位置，然后重定向到该位置而不是默认位置。我们通过一对方法 `store_location` 和\
  \ `redirect_back_or` 来实现这一点，它们都定义在 Sessions 辅助程序中（列表 10.30）。\n\n5. 本节的代码改编自 thoughtbot\
  \ 的 Clearance 库。\n\n**列表 10.30：** 实现友好重定向的代码。**红色**\n\n```ruby\napp/helpers/sessions_helper.rb\n\
  \n点击此处查看代码图像\n\n```ruby\nmodule SessionsHelper\n  # 重定向到存储的位置（或默认位置）。\n  def redirect_back_or(default)\n\
  \    redirect_to(session[:forwarding_url] || default)\n    session.delete(:forwarding_url)\n\
  \  end\n\n  # 存储尝试访问的 URL。\n  def store_location\n    session[:forwarding_url] =\
  \ request.original_url if request.get?\n  end\n```\n\n在这里，重定向 URL 的存储机制与我们在第 8.2.1\
  \ 节中登录用户使用的 `session` 功能相同。列表 10.30 也使用了 `request` 对象（通过 `request.original_url`）来获取请求页面的\
  \ URL。\n\n列表 10.30 中的 `store_location` 方法将请求的 URL 放在 `session` 变量的 `:forwarding_url`\
  \ 键下，但仅针对 `GET` 请求。这防止了当用户例如在未登录时提交表单时（这是一个边缘情况，但可能会发生，例如用户在提交表单前手动删除了 cookie）存储重定向\
  \ URL。在这样的情况下，生成的重定向将向一个预期 `POST`、`PATCH` 或 `DELETE` 的 URL 发出 `GET` 请求，从而导致错误。包含\
  \ `if request.get?` 防止了这种情况发生。⁶ 6. 感谢读者 Yoel Adler 指出这个微妙的问题，并发现了解决方案。\n\n为了使用 `store_location`，我们需要将其添加到\
  \ `logged_in_user` 过滤器中，如列表 10.31 所示。\n\n**列表 10.31：** 在登录用户过滤器中添加 `store_location`。**红色**\n\
  \n```ruby\napp/controllers/users_controller.rb\n\n点击此处查看代码图像\n\n```ruby\nclass UsersController\
  \ < ApplicationController\n  before_action :logged_in_user, only: [:edit, :update]\n\
  \  before_action :correct_user,  only: [:edit, :update]\n\n  def edit\n  end\n\n\
  \  private\n  def user_params\n    params.require(:user).permit(:name, :email, :password,\
  \ :password_confirmation)\n  end\n\n  # 置过滤器 - 确认用户已登录。\n  def logged_in_user\n\
  \    unless logged_in?\n      store_location\n      flash[:danger] = \"Please log\
  \ in.\"\n      redirect_to login_url\n    end\n  end\n\n  # 确认正确的用户。\n  def correct_user\n\
  \    @user = User.find(params[:id])\n    redirect_to(root_url) unless current_user?(@user)\n\
  \  end\nend\n```\n\n为了实现重定向本身，我们使用 `redirect_back_or` 方法在请求 URL 存在时重定向到它，否则重定向到某些默认\
  \ URL，将其添加到 Sessions 控制器的 `create` 操作中，以便在成功登录后重定向（列表 10.32）。`redirect_back_or`\
  \ 方法通过或运算符 `||` 使用如下：\n\n点击此处查看代码图像\n\n```ruby\nsession[:forwarding_url] || default\n\
  ```\n\n除非 `session[:forwarding_url]` 为 `nil`，否则它将求值为 `session[:forwarding_url]`，在这种情况下将求值为给定的默认\
  \ URL。注意 列表 10.30 仔细地删除了重定向 URL（通过 `session.delete(:forwarding_url)`）；否则后续的登录尝试将重定向到受保护页面，直到用户关闭浏览器。还要注意，尽管重定向看似优先，但删除操作发生了；重定向之后的任何代码都会执行。\n\
  \n**列表 10.32：** 带有友好重定向的 Sessions `create` 操作。**绿色**\n\n```ruby\napp/controllers/sessions_controller.rb\n\
  \n点击此处查看代码图像\n\n```rubyclass SessionsController < ApplicationController\n  def create\n\
  \    user = User.find_by(email: params[:session][:email].downcase)\n    if user\
  \ && user.authenticate(params[:session][:password])\n      log_in user\n      params[:session][:remember_me]\
  \ == '1' ? remember(user) : forget(user)\n      redirect_back_or user\n    else\n\
  \      flash.now[:danger] = 'Invalid email/password combination'\n      render 'new'\n\
  \    end\n  end\nend\n```\n\n\n\n\n1. 编写一个测试以确保友好跳转（friendly forwarding）仅在第一次跳转到指定的\
  \ URL。在随后的登录尝试中，跳转 URL 应恢复到默认值（即个人资料页）。*提示*：在代码列表 10.29 中，通过检查 `session[:forwarding_url]`\
  \ 的正确值来添加测试。\n\n2. 在 Sessions 控制器的 `new` action 中放置 `debugger`（第 7.1.3 节），然后退出并尝试访问\
  \ `/users/1/edit`。在调试器中确认 `session[:forwarding_url]` 的值是否正确。对于 `new` action，`request.get?`\
  \ 的值是多少？（当使用调试器时，终端可能会冻结或行为异常；利用你的技术素养 [框 1.1] 来解决任何问题。）\n\n### 10.3 显示所有用户\n\n\
