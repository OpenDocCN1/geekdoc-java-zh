  \n**列表 10.14：`GREEN`**\n\n### 10.2 授权\n\n在 Web 应用程序的上下文中，*身份验证*（authentication）允许我们识别网站的用户，而*授权*（authorization）让我们控制他们做什么。在第\
  \ 8 章](#part0017.xhtml_ch08)中构建身份验证机制的一个不错的好处是，我们现在也可以实现授权了。在本节中，我们将实现一种安全模型，要求用户登录并防止他们更新\
  \ way 自己的任何信息。\n\n\n\n\n\n在第 10.2.1 节中，我们将处理未登录用户尝试访问其通常可以访问的受保护页面的情况。由于这种情况在正常使用过程中很容易发生，此类用户将被重定向到登录页面，并带有一个友好的提示消息，如图\
  \ 10.6 所示。另一方面，尝试访问永远不会获得授权页面的用户（例如已登录的用户尝试访问另一个用户的编辑页面）将被重定向到根 URL（第 10.2.2 节）。\n\
  \n## 10.2.1 要求用户登录\n\n为了实现图 10.6 所示的跳转行为，我们将在 `Users` 控制器中使用*置前过滤器*（before filter）。之前过滤器使用\
  \ `before_action` 命令安排在执行指定操作之前调用特定的方法。⁴为了要求用户登录，我们定义了一个 `logged_in_user` 方法，并使用\
  \ `before_action :logged_in_user` 调用它，如列表 10.15 所示。\n\n4. 用于置前过滤器的命令曾被称为 `before_filter`，但\
  \ Rails 核心团队决定将其重命名，以强调过滤器发生在特定的控制器操作之前。\n\n![image](img/image02107.jpeg)\n\n**图\
  \ 10.6：** 访问受保护页面的结果原型\n\n**列表 10.15：** 添加 `logged_in_user` 置前过滤器。**红色**\n\n`app/controllers/users_controller.rb`\n\
  \n点击此处查看代码图像\n\n```ruby\nclass UsersController < ApplicationController\n  before_action\
  \ :logged_in_user, only: [:edit, :update]\n  .\n  .\n\n  private\n    def user_params\n\
  \      params.require(:user).permit(:name, :email, :password, :password_confirmation)\n\
  \    end\n\n    # Before filters\n    # 确认用户已登录。\n    def logged_in_user\n    unless\
  \ logged_in?\n      flash[:danger] = \"Please log in.\"\n      redirect_to login_url\n\
  \    end\n  end\nend\n```\n\n默认情况下，置前过滤器应用于控制器中的*每一个*操作，因此在这里我们通过传递相应的 `only:` 选项哈希将过滤器限制仅适用于\
  \ `:edit` 和 `:update` 操作。\n\n我们可以通过注销并尝试访问用户编辑页面 `/users/1/edit` 来在列表 10.15 中查看置前过滤器的结果，如图\
  \ 10.7 所示。\n\n正如列表 10.15 的标题说明所示的，我们的测试套件目前是**红色**的：\n\n**列表 10.16：红色**\n\n```bash\n\
  $ rails test\n```\n\n由于是 edit 和 update 操作现在需要用户登录，但在相应的测试内部没有用户登录。\n\n我们将在执行 edit\
  \ 或 update 操作之前登录用户来修复测试套件。使用在第 9.3 节中开发的 `log_in_as` 辅助方法（列表 9.24）可以很容易实现，如列表 10.17\
  \ 所示。\n\n**列表 10.17：** 登录测试用户。**绿色**\n\n`test/integration/users_edit_test.rb`\n\n\
  点击此处查看代码图像\n\n```ruby\nrequire 'test_helper'\nclass UsersEditTest < ActionDispatch::IntegrationTest\n\
