  \ 的：\n\n**列表 5.26:** `绿色`\n\n`$ rails test`\n\n### 5.3.2 Rails 路由\n\n为了为示例应用的静态页面添加具名路由，我们将编辑路由文件\
  \ `config/routes.rb`，Rails 使用该文件来定义 URL 映射。我们将首先回顾首页的路由（定义在第 3.4.4 节），这是一个特殊情况，然后为剩余的静态页面定义一组路由。\n\
  \n到为止，我们已经看到了定义根路由的三个示例，从代码开始：\n\n```ruby\nroot 'application#hello'\n```\n在 hello\
  \ 应用（列表 1.10）中，代码\n\n```ruby\nroot 'users#index'\n```\n在 toy 应用（列表 2.6）中，以及\n\n\
  ```ruby\nroot 'static_pages#home'\n```\n在示例应用（列表 3.41）中。在每种情况下，`root` 方法都安排将根路径\
  \ `/` 路由到我们选择的控制器和 action。像这样定义根路由有第二个重要影响，即创建了具名路由，允许我们通过名称而不是原始 URL 来引用路由。在这种情况下，这些路由是\
  \ `root_path` 和 `root_url`，唯一的区别是后者包含了完整的 URL：\n\n点击此处查看代码图片\n\n```\nroot_path ->\
  \ '/'\nroot_url  -> 'http://www.example.com/'\n```\n\n在*Rails 教程*中，我们将遵循使用 `_path`\
  \ 形式的通用惯例，除非进行重定向，在进行重定向时我们将使用 `_url` 形式。(这是因为 HTTP 标准在技术上要求重定向后有一个完整的 URL，尽管在大多数浏览器中两种方式都可以正常工作。)\n\
  \n因为例如在列表 5.21 中使用的默认路由相当冗长，我们还将借此机会为 Help、About 和 Contact 页面定义更短的具名路由。为了做到这一点，我们需要对列表\
  \ 5.23 中的 `get` 规则进行更改，将如下行\n\n```ruby\nget 'static_pages/help'\n```\n转换为\n\n点击此处查看代码图片\n\
  \n```ruby\nget '/help', to: 'static_pages#help'\n```\n\n这种新模式将对 URL `/help` 的 GET\
  \ 请求路由到 `StaticPages` 控制器中的 `help` action。与根路由的规则一样，这创建了两个具名路由 `help_path` 和 `help_url`：\n\
  \n点击此处查看代码图片\n\n```\nhelp_path -> '/help'\nhelp_url  -> 'http://www.example.com/help'\n\
  ```\n\n将此规则更改应用于列表 5.23 中剩余的静态页面路由，即得到了列表 5.27。\n\n**列表 5.27:** 路由。**红色**\n\n```ruby\n\
  config/routes.rb\n```\n\n点击此处查看代码图片\n\n```ruby\nRails.application.routes.draw do\n\
  \  root 'static_pages#home'\n  get  'static_pages/help'\n  get  'static_pages/about'\n\
