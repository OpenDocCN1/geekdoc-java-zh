  \ 5.2。\n\n### 13.3 操作微推文 (Microposts)\n\n在完成微推文的数据建模和显示模板后，我们现在将转向通过网页创建推文的接口。在本节中，我们还将看到*状态动态*（status\
  \ feed）的首次端倪——这一概念在第 14 章中得以实现。最后，就像用户一样，我们将通过网页删除微推文。\n\n有一个值得注意的惯例破除：微推文资源的界面将主要通过个人资料（Profile）和首页（Home）页面运行，因此我们不需要\
  \ Microposts 控制器中像 `new` 或 `edit` 等操作；我们需要 `create` 和 `destroy`。这导致了列表 13.30 中所示的微推文资源路由。列表\
  \ 13.30 中的代码转而对应表 13.2 所示的 RESTful 路由，该表是表 2.3 完整路由集的一个子集。当然，这种简单性是*更*高级的标志，而不是降低——自从我们在第\
  \ 2 章\n\n* * *\n\n```ruby\nRails.application.routes.draw do\n  root    'static_pages#home'\n\
  \  get      '/help',    to: 'static_pages#help'\n  get      '/about',   to: 'static_pages#about'\n\
  \  get      '/contact', to: 'static_pages#contact'\n  get      '/signup',  to: 'users#new'\n\
  \  get      '/login',   to: 'sessions#new'\n  post     '/login',   to: 'sessions#create'\n\
  \  delete   '/logout',  to: 'sessions#destroy'\n  resources :users\n  resources\
  \ :account_activations, only: [:edit]\n  resources :password_resets, only: [:new,\
  \ :create, :update]\n  resources :microposts, only: [:create, :destroy]\nend\n```\n\
