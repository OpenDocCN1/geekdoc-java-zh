  \ 3.4.3 布局与嵌入式 Ruby（重构）\n\n在本节中，我们已经通过控制器和操作 实现了许多页面，但它们是纯静态的，因此没有展示 Rails 的威力。此外，它们存在严重的重复：\n\
  - 页面标题几乎相同。\n- “Ruby on Rails Tutorial Sample App”是所有标题共同。\n- 整个 HTML 骨架在每个页面上重复。\n\
  \n这种重复代码违反了重要的“不要重复”（DRY）原则；在本节中，我们将通过消除重复来“DRY 化”代码。最后，我们将运行 Section 3.4 中的测试来验证标题是否正确。\n\
  \n看似矛盾的是，我们将通过添加一些内容来采取消除重复的第一步：我们将使目前相似的页面标题*完全匹配*。这将大大简化消除重复的工作。\n\n这种技术涉及在视图中使用*嵌入式\
  \ Ruby*。由于 Home、Help 和 About 页面的标题有一个变量，我们将使用一个名为 `provide` 的特殊 Rails 函数为每个页面设置不同的标题。通过将\
  \ `home.html.erb` 中的字面量“Home”替换为 Listing 3.31 中的代码，可以看到它是如何工作的。\n\n### 列表 3.31：带有嵌入\
  \ Ruby 标题的 Home 页面视图。**绿色 (GREEN)**\n\n```erb\napp/views/static_pages/home.html.erb\n\
  ```\n\n点击此处查看代码图片\n\n```html\n<% provide(:title, \"Home\") %>\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title><%= yield(:title) %> | Ruby on Rails Tutorial Sample\
  \ App</title>\n</head>\n<body>\n    <h1>Sample App</h1>\n    <p>\n      这是 <a href=\"\
  http://www.railstutorial.org/\">Ruby on Rails Tutorial</a>示例应用程序的首页。\n    </p>\n\
  </body>\n</html>\n```\n\n列表 3.31 是我们的嵌入 Ruby 示例，也称为 *ERb*。（现在你知道为什么 HTML 视图使用 `.html.erb`\
  \ 扩展名了）。ERb 是在网页中包含动态内容的主要模板系统。13 代码\n\n`<% provide(:title, \"Home\") %>`\n\n表示使用\
  \ `<% ... %>` 通知 Rails 应该调用 `provide` 函数并将字符串 `\"Home\"` 与标签 `:title` 关联。14 随后，在标题中，我们使用密切相关的符号\
  \ <%= ... %> 使用 Ruby 的 `yield` 函数将标题插入模板中：¹⁵\n\n14 丰富的 Rails 开发者可能在此时期望使用 `content_for`，但它与资源管道配合得并不好。`provide`\
  \ 函数是它的替代方案。\n\n15 如果你以前学过 Ruby，你可能会怀疑 Rails 正在向块*交付*（yield）内容，你的怀疑是正确的。但在使用 Rails\
  \ 开发应用程序时不需要这一点。\n\n\n\n\n（两种嵌入式 Ruby 类型的区别在于 `<% ... %>` 执行内部代码，而 `<%= ... %>`\
  \ 执行该代码并将结果插入到模板中。）生成的页面与之前完全相同，现在标题的变量部分是由 ERb 动态生成的。\n\n我们可以通过运行第 3.4.2 节 中的测试来验证所有这些操作都是有效的，并看到它们仍然是\
  \ `GREEN`：\n\n**列表 3.32：`GREEN`**\n\n点击此处查看代码图像\n\n* * *\n\n```\n$ rails test\n\
