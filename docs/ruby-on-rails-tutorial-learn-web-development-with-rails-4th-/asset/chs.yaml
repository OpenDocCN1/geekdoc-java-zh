  \ login_path) do |f| %>\n      <%= f.label :email %>\n      <%= f.email_field :email,\
  \ class: 'form-control' %>\n      <%= f.label :password %>\n      <%= f.password_field\
  \ :password, class: 'form-control' %>\n      <%= f.submit \"Log in\", class: 'btn-primary'\
  \ %>\n    <% end %>\n    <p>New user? <%= link_to \"Sign up now!\", signup_path\
