  \ 13.3 节中已经有了这种方法，这并不会阻止我们在类似第 10.2 节中显示它们。\n\n### 13.2.1 显示微贴\n\n我们的目标是在用户主页显示微贴，正如第\
  \ 10.5 节中看到的，这与第 10.3 节中展示的非常相似。\n\n![image](img/image231)\n**图 13.4**：主页的草图。\n\n\
  在第 10.4 节中添加了微贴的情况下，现在重置数据库是一个好主意：\n\n```bash\n$ rails db:reset\n$ rails db:seed\n\
  ```\n\n虽然我们现在还没有这个控制器（在第 10.1 节中所示），但稍后我们会需要，所以先生成它：\n\n```bash\n$ rails generate\
  \ Microposts\n```\n\n本节的主要目的是渲染每个用户的微贴。正如我们在第 10.2 节中看到的，通过 `show` 页面渲染所有微贴，代码如下：\n\
  \n```html\n<ul class=\"users\">\n  <%= render @users %>\n</ul>\n```\n\n这会自动渲染 `@users`\
  \ 变量中的每个用户，使用的是 `_user.erb` 局部模板。我们将定义一个类似的 `_micropost.erb` 局部模板，以便我们在微贴集合上使用相同的技术：\n\
  \n```html\n<ol class=\"microposts\">\n  <%= render @microposts %>\n</ol>\n```\n\n\
  注意我们使用了有序列表标签 `ol`（而不是无序列表 `ul`），因为微贴是按特定顺序排列的（倒序时间）。对应的局部模板出现在列表 13.22 中。\n\n\n\
  \n\n\n下一步是处理显示可能大量的微贴（microposts）的困难。我们将像在第 10.3.3 节中处理用户那样解决这个问题，即使用分页。与之前一样，我们将使用\
  \ `will_paginate` 方法：\n\n点击此处查看代码图片\n\n```ruby\n<%= will_paginate @microposts %>\n\
  ```\n\n如果你将此与用户索引页面上的对应代码列表 10.45 进行比较，你会发现我们之前只是：\n\n```ruby\n<%= will_paginate\
  \ %>\n```\n\n这之所以行得通，是因为在 `Users` 控制器的文中，`will_paginate` 假设存在一个名为 `@users` 的实例变量（正如我们在第\
  \ 10.3.3 节中所看到的，该变量应该是 `ActiveRecord::Relation` 类）。在当前情况下，由于我们仍然在 `Users` 控制器中但想要对*微贴*进行分页，我们将向\
  \ `will_paginate` 传递一个式的 `@microposts` 变量。当然，这意味着我们需要在用户的 `show` 动作中定义这样一个变量（列表\
  \ 13.23）。\n\n**列表 13.23：** 在用户的 `show` 动作中添加 `@microposts` 实例变量。\n\n`app/controllers/users_controller.rb`\n\
  \n点击此处查看代码图片\n\n* * *\n\n```ruby\nclass UsersController < ApplicationController\n\
  \n  .\n  .\n  .\n  def show\n    @user = User.find(params[:id])\n    @microposts\
  \ = @user.microposts.paginate(page: params[:page])\n  end\n\n  .\n  .\n  .\nend\n\
  ```\n\n* * *\n\n注意 `paginate` 非常聪明——它甚至可以*通过*微贴关联工作，进入微贴表并提取出所需的微贴页。\n\n我们的最后一个任务是显示每个用户的微贴数量，我们可以通过\
  \ `count` 方法实现：\n\n```ruby\nuser.microposts.count\n```\n\n与 `paginate` 一样，我们可以通过关联使用\
  \ `count` 方法。特别是，`count` 不会从数据库中提取所有微贴然后在生成的数组上调用 `length`，因为随着微贴数量的增加，这将变得低效。相反，它直接在数据库中执行计算，请求数据库计算给定\
  \ `user_id` 的微贴（所有数据库对此操作都经过高度优化）。（如果在少数情况下，查找计数仍然是你应用程序的瓶颈，你可以使用*计数缓存*counter cache\
  \ 来使其变得更快。）\n\n将上述所有元素结合在一起，我们现在可以将微贴添加到个人资料页面，如列表 13.24 所示。注意 `if @user.microposts.any?`\
  \ 的使用（这是我们之前在列表 7.21 中见过的结构），它确保了当用户没有微贴时不会显示空列表。\n\n**列表 13.24：** 在用户的 `show` 页面添加微贴。\n\
