  \ 进一步资源指南\n### 14.4.2 本章学了什么\n\n\n## 第一版序言\n我的前公司（CD Baby）是最早切换到 Ruby on Rails 的公司之一，后来甚至转向了\
  \ PHP。在 Google 上搜索我就能看到相关报道。Michael Hartl 写的这本书备受推崇，以至于我必须尝试一下，而 `Ruby on Rails\
  \ Tutorial` 正是我重新回到 Rails 世界时使用的教程。\n\n虽然我读过很多关于 Rails 的书，但这一本终于让我“懂”了它。所有的操作都做得非常符合“Rails\
  \ 之道”（the Rails way）——这种方式以前对我来说很不自然，但读完这本书后，感觉很自然了。这也是唯一一本全过程采用测试驱动开发的 Rails 书籍，这种方法被专家们高度推崇，但从未如此清晰地展示过。最后，通过在演示示例中包含\
  \ `Git`、`GitHub` 和 `Heroku`，作者真正让你感受到了完成真实项目是怎样的。教程中的代码示例并非孤立存在。这种线性的叙述格式非常棒。我个人认为，从头到尾完成每一章末尾的所有示例和挑战，不要东看西看，你将获得最大的益处。\n\
  \n阅读愉快！Derek Sivers，CD Baby 创始人\n\n## 第三版序言\nRails 现在已经十岁了，但其采用率没有任何放缓的迹象。随着这种持续增长，在许多人看来我们看到了某种悲剧：Rails\
  \ 现在是初学者最难上手的技术栈之一。开始时面临的选择复杂性非常高，市上有十年的博客文章和书籍，其中大多数在某种程度上已经过时或失效了。最讽刺的是，今天开始学习\
  \ Rails 涉及到大量的配置，可能不是针对 Rails 本身，而是针对推荐配合它使用的无数库。如果你忘记了，或者在 2005 年 Rails 出道时没有关注，它的主要目标是实现“惯约优于配置”（convention\
  \ over configuration）。在某种程度上，我们复制了曾经竭力击败的 Java Web 怪兽。唉。\n\n不过不要太沮丧，因为那样就偏离了重点。好消息是，一旦你过了那段令人人生畏的学习曲线，Rails\
  \ 仍然是构建 API 后端和内容驱动网站的最强大、最高效的栈之一。现在你可能考虑使用这本书来开启你的旅程——相信我，这是正确的选择。我认识 Michael Hartl\
  \ 已经快十年了，他是一个非常聪明的人。只需看看书中其他地方的他的资历你就会明白我的意思了。但不是看学历；他为我们这本畅销书 `Ruby on Rails Tutorial`\
  \ 最新版所采用的方法证明了他有多聪明。他没有继续执着于那种带有主观偏见的方法（就像我认识的另一位系列丛书作者，咳），而是走向了相反的方向！通过减少主观偏见，他以显著的方式降低了\
  \ Rails 新手的门槛。首先，他摒弃了任何形式的本地安装或配置。他还避开了复杂的配置选项（如 `Spork` 和 `RubyTest`），这些选项可能会让初学者困惑。所有的代码示例都运行在一个标准的云环境中，可以通过简单的\
  \ Web 浏览器访问。其次，他丢弃了大量上一版的内容并拥抱了 Rails 的“默认栈”，包括其内置的 `MiniTest` 测试框架。由此消除了许多外部依赖（`RSpec`、`Cucumber`、`Capybara`、`Factory\
  \ Girl`），使得 Rails 的学习曲线变得容易得多，代价是重写书中大量的章节。多年来，很大程度上归于他对这个系列书籍的努力，Michael 已经成为编写基于实践、实用知识的培训材料的大师。与过去一样，这一版仍然包含了\
  \ `Git` 和 `GitHub` 等关键工具的基础知识。测试处于核心位置，大多数人都会同意这是初学者的正确重点。Michael 那些经过良好打磨的示例始终使用小巧易于吸收的代码——简单到可以理解，又新颖到具有挑战性。当你读完这本书并玩转你自己的小型\
  \ Twitter 克隆程序时，你一定对 Rails 有了更深、更灵活的理解。最重要的是，你将拥有一个足够灵活的基础，让你能够编写几乎任何类型的 Web 应用。\n\
  \n祝好！\n\n—Obie Fernandez，系列编辑\n\n## 致谢\n`Ruby on Rails Tutorial` 很大程度上归于我之前的 Rails\
