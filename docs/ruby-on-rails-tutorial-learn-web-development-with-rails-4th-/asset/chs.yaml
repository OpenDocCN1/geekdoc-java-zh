  \n### 1.4 使用 Git 版本控制\n\n现在我们已经有一个可以工作的“hello”应用程序，我们将花一点时间处理一个在技术上可选但在资深开发者看来是必要的步骤：将我们的应用程序纳入`版本控制`。版本控制系统允许我们跟踪更改、更轻松地协作并回滚任何无意错误（例如删除文件）。使用版本控制系统是每位专业开发人员的必备技能。\n\
  \n![image\n\n**图 13：** 在浏览器中查看“hello, world!”\n\n#### 1.4.1 安装与设置\n\n第 1.2.1 节推荐的云\
  \ IDE 默认包含了 `Git`，因此在这种情况下不需要安装。否则，*Enough Git to Be Dangerous*包含了在您的系统上安装 `Git`\
  \ 的说明。\n\n##### 首次系统设置在使用 `Git` 之前，您应该执行一些一次性的设置步骤。这些是*系统*设置，意味着您每台电脑只需执行一次：\n\n\
  点击此处查看代码图像\n\n```\n$ git config --global user.name \"Your Name\"\n$ git config --global\
  \ user.email user.email@example.com\n```\n\n注意，您在 Git 配置中使用的名称和电子邮件地址将出现在您公开的任何仓库中。\n\
  \n##### 首次仓库设置\n\n现在我们来了一些每次创建新*仓库*（有时简称为 *repo*）时都是必要的步骤。第一步是导航到第一个应用的根目录并初始化一个新的仓库：\n\
  \n点击此处查看代码图像\n\n```\n$ git init\nInitialized empty Git repository in /home/ubuntu/workspace/hello_app/.git/\n\
  ```\n\n下一步是使用 `git add -A` 将所有项目文件添加到仓库中：\n\n```\n$ git add -A\n```\n\n\n\n\n此命令会将当前目录下的所有文件添加到索引，但匹配名为\
  \ `.gitignore` 的特殊文件中模式的文件除外。`rails new` 命令会自动创建一个适用于 Rails 项目的 `.gitignore` 文件，但你也可以添加额外的模式。\n\
  \n虽然在主教程中我们不需要编辑它，但在 3.6.2 节中有一个向 `.gitignore` 文件添加规则的示例，该节是 3.6 节中可选高级测试设置的一部分。\n\
  \n添加的文件最初被放置在*暂存区*（staging area），其中包含了项目中待提交的更改。我们可以使用 `status` 命令查看暂存区中有哪些文件：\n\
  \n```\n$ git status\n\nOn branch master\n\nInitial commit\n\nChanges to be committed:\n\
  \  (use \"git rm --cached <file>...\" to unstage)\n  new file:    .gitignore\n \
  \ new file:    Gemfile\n  new file:    Gemfile.lock\n  new file:    README.md\n\
  \  new file:    Rakefile\n  .\n  .\n  .\n```\n\n为了告诉 Git 我们想保留这些更改，我们使用 `commit`\
  \ 命令：\n\n```\n$ git commit -m \"Initialize repository\"\n\n[master (root-commit)\
  \ df0a62f] Initialize repository\n.\n.\n.\n```\n\n`-m` 标志允许我们为提交添加消息；如果省略了 `-m`，Git\
  \ 将打开系统的默认编辑器让我们在那里输入消息。（本书中的所有示例都将使用 `-m` 标志。）\n\n需要注意的是，Git 提交是*本地的*，仅记录在发生提交的机器上。我们将在\
  \ 1.4.4 节中查看如何将更改推送到远程仓库（使用 `git push`）（part010.xhtml_ch01lev2sec12）。\n\n顺便提一下，我们可以使用\
  \ `log` 命令查看提交消息列表：\n\n```\ncommit af72946fbebc15903b2770f92fae9081243dd1a1\n\n\
  Author: Michael Hartl <michael@michaelhartl.com>\nDate:    Thu May 12 19:25:07 2016\
  \ +0000\n\n    Initialize repository\n```\n\n根据仓库日志历史的长度，你可能需要输入 `q` 来退出。（正如*Learn\
  \ Enough Git to Be Dangerous*中所解释的，`git log` 使用了*Learn Enough Command Line to Be\
  \ Dangerous*中涵盖的 less 接口。）\n\n## 1.4.2 Git 能为你带来什么好处？\n\n如果你以前从未用过版本控制，此时你可能并不完全清楚它对你有什么好处，所以让我举一个例子吧。假设你做了一些意外的更改，例如（噢不！）删除了关键的\
  \ `app/controllers/` 目录。\n\n```\n$ ls app/controllers/\napplication_controller.rb\
  \ concerns/\n\n$ rm -rf app/controllers/\n\n$ ls app/controllers/\nls: app/controllers/:\
  \ No such file or directory\n```\n\n在这里我们使用 Unix 的 `ls` 命令列出 `app/controllers/`\
  \ 目录的内容，并使用 `rm` 命令删除它。正如*Learn Enough Command Line to Be Dangerous*提到的，`-rf` 标志意味着“递归强制”，它会递归删除所有文件、目录、子目录等，而无需对每次删除进行显式确认。\n\
  \n让我们检查状态查看发生了什么：\n\n```\n$ git status\n\nOn branch master\n\nChanged but not updated:\n\
  \  (use \"git add/rm <file>...\" to update what will be committed)\n  (use \"git\
  \ checkout -- <file>...\" to discard changes in working directory)\n      deleted:\
  \     app/controllers/application_controller.rb\n\nno changes added to commit (use\
  \ \"git add\" and/or \"git commit -a\")\n```\n\n我们在这里看到一个文件被删除了，但更改仅位于“工作树”上；它们还没有提交。这意味着我们仍然可以使用带有\
  \ `-f` 标志的 `checkout` 命令通过强制覆盖当前更改来撤销更改：\n\n```\n$ git checkout -f\n\n$ git status\n\
  \n# On branch master\nnothing to commit (working directory clean)\n\n$ ls app/controllers/\n\
  application_controller.rb concerns/\n```\n\n丢失的文件和目录回来了。松了一口气！\n\n#### 1.4.3 Bitbucket\n\
  \n现在我们已经把项目置于版本控制，是时候将代码推送到 Bitbucket 了。*Learn Enough Git to Be Dangerous* 使用 GitHub，但请参见\
  \ Box 1.4（part010.xhtml_box1_4）来了解为什么本教程使用 Bitbucket。在 Bitbucket 上存放一份代码副本有两个目的：它是你代码的完整备份，并且让未来的协作变得简单得多。\n\
  \n* *\n\n到目前为止，最流行的两个托管托管站点是 GitHub 和 Bitbucket。这两个服务有相似之处：它们都允许 Git 托管，并提供了方便的搜索方法。区别（从本教程的角度来看）是\
  \ GitHub 提供无限免费仓库，但对超过一定数量的收费。使用哪种服务取决于你的具体需求。\n\n事实是，本教程创建的示例应用程序在网络上公开是安全的，但通常依赖这一点是危险的。因此，为了尽可能安全，我们将采取谨慎态度，默认使用私有仓库。由于\
  \ GitHub 对私有仓库收费，而 Bitbucket 提供无限免费数量，对于我们目前的用途来说，Bitbucket 比 GitHub 更合适。\n\n（顺便提一下，最近出现了第三家主要的\
  \ Git 托管公司，名为 GitLab。GitLab 最初主要设计为你托管的开源 Git 工具，现在提供了托管版本，实际上允许无限公共和私有仓库。这使得 GitLab\
  \ 成为 GitHub 或 Bitbucket 的绝佳替代方案。）\n\n* *\n\n开始使用 Bitbucket 非常简单，尽管可能需要一点技术技巧（Box\
  \ 1.1）（part010.xhtml_box1_1）才能让一切运行良好：\n\n1. 如果你还没有 Bitbucket 账户，请注册一个。\n2. 将你的公钥复制到剪贴板。如列表\
  \ 1.11 所示，云 IDE 用户可以使用 `cat` 命令查看他们的公钥，然后选择并复制。如果你使用的是自己的系统并在运行列表 1.11 中的命令时没有输出，请按照如何在\
  \ Bitbucket 账户上安装公钥的说明操作。\n3. 点击右上角的头像并选择“Manage account”然后“SSH keys”，将你的公钥添加到 Bitbucket。\n\
  \n```\n# Listing 1.11: 使用 cat 打印公钥\n$ cat ˜/.ssh/id_rsa.pub\n```\n\n\n\n\n\n当你添加了公钥后，点击“Create（创建）”创建一个新仓库，如图\
  \ 1.15 所示。在填写项目信息时，请注意勾选“This is a private repository（这是一个私有仓库）”旁边的框。点击“Create repository（创建仓库）”后，按照“Command\
  \ line > I have an existing project（命令行 > 我现有项目）”下的说明操作，它应该类似于列表 1.12。（如果看起来不像列表\
  \ 1.12，那可能是因为公钥没有添加正确，在这种情况下，我建议重新尝试该步骤。）在推送仓库时，如果看到问题“Are you sure you want to\
  \ continue connecting (yes/no)?（你确定要继续连接吗（是/否）？）”，请回答 yes。\n\n![image](img/image01666.jpeg)\n\
  \n**图 1.14:** 添加 SSH 公钥。\n\n![image](img/image02205.jpeg)\n\n**图 1.15:** 在 Bitbucket\
  \ 创建第一个应用仓库。\n\n**列表 1.12:** 添加 Bitbucket 并推送仓库。\n\n点击此处查看代码\n\n* * *\n\n```\n$\
  \ git remote add origin git@bitbucket.org:<username>/hello_app.git\n$ git push -u\
  \ origin --all\n```\n\n* * *\n\n列表 1.12 中的命令首先告诉 Git 你想将 Bitbucket 添加为仓库的 `origin`（源），然后将你的仓库推送到远程源。（不用担心\
  \ `-u` 标志的作用；如果你好奇，可以在网上上搜索“git set upstream”。）当然，你应该将 `<username>` 替换为你的实际用户名。例如，我运行的命令是\n\
  \n点击此处查看代码\n\n```\n$ git remote add origin git@bitbucket.org:railstutorial/hello_app.git\n\
  ```\n\n结果是 Bitbucket 上一个 hello_app 仓库的页面，包含文件浏览、完整的提交历史以及许多其他功能（图 1.16）。119 19。由于我在\
  \ Cloud9 上设置公钥的方式，我创建了名为 `railstutorial` 的仓库，然后将我的主账号 `mhartl` 添加为协作者。结果，我可以在任何一个账户下进行提交。\n\
  \n#### 1.4.4 分支、编辑、提交、合并\n\n如果你遵循了节 1.4.3 中的步骤，你可能会注意到 Bitbucket 自动渲染了仓库的 README\
  \ 文件，如图 1.16 所示。该文件名为 `README.md`，是由列表 1.3 中的命令自动生成的。正如扩展名 `.md` 所示，它是用 `Markdown`\
  \ 编写的，120，这是一种人类可读的标记语言，旨在易于转换为 HTML——这正是 Bitbucket 所所的。\n\n120。关于 Markdown 的更多信息，请参阅\
  \ *Learn Enough Text Editor to Be Dangerous* 和 *Learn Enough Git to Be Dangerous*。\n\
  \n![image](img/image01669.jpeg)\n\n**图 1.16:** Bitbucket 仓库页面。\n\n![image](img/image02225.jpeg)\n\
  \n**图 1.17:** Bitbucket 对默认 Rails README 的渲染。\n\n这种 README 的自动渲染非常方便，但当然，如果我们能针对当前项目定制文件内容会更好。在本节中，我们将通过添加一些\
  \ Rails Tutorial 特有的内容来定制 README。在此过程中，我们将看到我推荐在 Git 中使用的“分支、编辑、提交、合并”工作流的第一个示例。121\
  \ 121。为了方便地可视化 Git 仓库，可以查看 Atlassian 的 SourceTree 应用。\n\n### 分支\n\nGit 非常擅长创建 `branches`（分支），分支实际上是仓库的副本，我们可以在其中进行（可能是实验性的）更改而不修改父文件。在大多数情况下，父仓库是\
  \ `master` 分支，我们可以使用带有 `-b` 标志的 `checkout` 创建新的主题分支：\n\n点击此处查看代码\n\n```\n$ git checkout\
  \ -b modify-README\nSwitched to a new branch 'modify-README'\n$ git branch\n  master\n\
  * modify-README\n```\n\n在这里，第二个命令 `git branch` 只是列出所有本地分支，星号 `*` 标识我们当前处于哪个分支。注意，`git\
  \ checkout -b modify-README` 既创建了新分支又切换到了它，正如前面的星号所示。\n\n\n\n\n\n点击此处查看代码图片\n\n\
  ```bash\ngit branch -d modify-README\n```\n\n已删除分支 `modify-README`（原为 `9dc4f64`）。\n\
  \n这一步是可选的，事实上，保持主题分支完好是非常常见的做法。这样你可以在主题分支和 master 分支之间来回，并在每次到达一个自然停止点时合并更改。\n\n\
  如上所述，你也可以放弃对主题分支的更改，在这种情况下可以使用 `git branch -D`：\n\n点击此处查看代码图片\n\n# 仅用于图示；除非你搞砸了分支，否则不要这样操作\n\
  \n```bash\n$ git checkout -b topic-branch\n$ <真的把分支搞砸了>\n$ git add -A\n$ git commit\
  \ -a -m \"Make major mistake\"\n$ git checkout master\n$ git branch -D topic-branch\n\
  ```\n\n与 `-d` 标志不同，`-D` 标志即使在我们没有合并更改也会删除分支。\n\n### 推送 (Push)\n\n现在我们已经更新了 README，可以将更改推送到\
  \ Bitbucket 查看结果。由于我们已经进行过一次推送 (Section 1.4.3)，在大多数系统中，我们可以省略 `origin master`，直接运行\
  \ `git push`：\n\n```bash\ngit push\n```\n\n与默认 README 一样，Bitbucket 会很好地我们将更新后的 README\
  \ 中的 Markdown 转换为 HTML (图 1.18)）。\n\n![image](img/image01672.jpeg)\n\n**图 1.18：**\
  \ Bitbucket 上改进后的 README 文件。\n\n## 1.5 部署 (Deploying)\n\n尽管这只是第一章，我们已经准备将（几乎空的）Rails\
  \ 应用部署到生产环境。这一步是可选的，但早期且频繁的部署允许我们在开发周期的早期发现任何部署问题。另一种替代方案——仅在开发环境中投入大量精力并封存后才进行部署——通常会在发布时导致糟糕的集成头疼问题。²³\n\
  \n23。虽然对于 *Rails Tutorial* 中的示例应用来说这并不重要，但如果你担心不小心过早公开应用，有几种选择；请参阅 Section 1.5.4。\n\
  \n部署 Rails 应用曾是一件痛苦事，但 Rails 部署生态系统在过去几年迅速成熟，现在有很多很棒的选择。这些包括运行 Phusion Passenger（一个用于\
  \ Apache 和 Nginx²⁴ Web 服务器的模块）的共享主机或虚拟专用服务器、Engine Yard 和 Rails Machine 等全服务部署公司，以及\
  \ Engine Yard Cloud 和 Heroku 等云部署服务。\n\n24。读 X。\n\n我最喜欢的 Rails 部署选项是 Heroku，这是一个专门为部署\
  \ Rails 和其他 Web 应用构建的托管平台。Heroku 让部署 Rails 应用变得极其简单——只要你的源代码受 Git 版本控制即可。（如果你还没有这样做的话，这是另一个遵循\
  \ Section 1.4 中 Git 设置步骤的原因。）此外，对于许多目的（包括本教程），Heroku 的免费层级完全足够。\n\n本节的其余部分将致力于将第一个应用部署到\
  \ Heroku。某些想法相当高级，所以不要担心理解所有的细节；重要的是，在过程结束时，我们将已经应用部署到实时网络。\n\n#### 1.5.1 Heroku\
  \ 设置\n\nHeroku 使用 `PostgreSQL` 数据库（读音为“post-gres-cue-ell”，通常简称为“Postgres”），这意味着我们需要在生产环境中添加\
  \ `pg` gem，以允许 Rails 与 Postgres 通信：²⁵\n\n25。通常来说，开发环境和生产环境尽可能匹配是一个好主意，包括使用相同的数据库，但为了本教程，我们将在本地使用\
  \ `SQLite`，而在生产环境中使用 `PostgreSQL`。更多信息请见第 3.1 节。\n\n点击此处查看代码图片\n\n```ruby\ngroup\
  \ :production do\n  gem 'pg', '0.18.4'\nend\n```\n\n还要务必整合 Listing 1.5 中的更改，防止 `sqlite3`\
  \ gem 被包含在生产环境中，因为 Heroku 不支持 SQLite：\n\n点击此处查看代码图片\n\n```ruby\ngroup :development,\
  \ :test do\n  gem 'sqlite3', '1.3.11'\n  gem 'byebug', '9.0.0', platform: :mri\n\
  end\n```\n\n生成的 `Gemfile` 看起来如 Listing 1.14 所示。\n\n**Listing 1.14：** 带有 `Gemfile`\
  \ 的 `Gemfile`。\n\n点击此处查看代码图片\n\n```ruby\nsource 'https://rubygems.org'\n\ngem 'rails',\
  \ '5.0'\ngem 'puma', '3.4'\ngem 'sass-rails', '5.0'\ngem 'uglifier', '3.0'\ngem\
  \ 'coffee-rails', '4.1'\ngem 'jquery-rails', '4.1'\ngem 'builder', '2.4'\n\ngroup\
  \ :development, :test do\n  gem 'sqlite3', '1.11'\n  gem 'byebug', '9.0.0', platform:\
  \ :mri\n  gem 'web-console', '3.1'\nend\n\ngroup :production do\n  gem 'pg', '0.18.4'\n\
  end\n\ngem 'listen', '3.0'\ngem 'spring', '1.7.2'\ngem 'spring-watcher', '2.0'\n\
  gem 'tzinfo-data', platforms: [:mingw, :mswin, :x64, :jruby]\n```\n\n\n\n\n没有步骤二了！我们已经完成了。要查看你新部署的应用程序，请访问你运行\
  \ `heroku create` 时看到的地址（即 列表 1.15）。（如果你是在本地机器而非云 IDE 上工作，也可以使用 `heroku open`。）结果显示在图\
  \ 1.19 中。该页面与图 1.11 完全相同，但现在它运行在实时网络上的生产环境环境中。\n\n![image](img/image01673.jpeg)\n\
