  \n\nRachel Paul\n\n\n\n\n\n\n\n### 对 Michael Hartl 关于 Ruby on Rails 的书籍和视频的赞誉\n\n\
  “我的前公司（CD Baby）是首批大声转向 Ruby on Rails 的公司之一，随后又更大声地转回了 PHP。（搜索我了解那段趣剧。）Michael Hartl\
  \ 的这本书受推极高，以至于我必须尝试，而 `Ruby on Rails^™ 教程` 正是我再次切换回 Rails 的工具。”\n\n——选自 Derek Sivers\
  \ 前言 (sivers.org)\n曾任：CD Baby 创始人\n现任：Thoughts Ltd 创始人\n\n“Michael Hartl 的 Rails\
