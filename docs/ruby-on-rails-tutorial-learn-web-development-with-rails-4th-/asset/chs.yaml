  \ maximum: 50 }\n  VALID_EMAIL_REGEX = /\\A[\\w+\\-.]+@[a-z\\d\\-.]+\\.[a-z]+\\\
  z/i\n  validates :email, presence: true, length: { maximum: 255 },\n           \
  \        format: { with: VALID_EMAIL_REGEX },\n                   uniqueness: {\
  \ case_sensitive: false }\nend\n```\n\n***\n\n### 6.3 添加安全密码\n\n现在我们已经定义了名称和邮箱字段的验证，准备好添加最后一个基础\
  \ User 属性：安全密码。方法是要求每个用户都有一个密码（带有密码确认），然后在数据库中存储密码的哈希版本。（这里存在一些混淆。在当前语境下，hash 指的不是\
  \ 第 4.3.3 节 中的 Ruby 数据结构，而是对输入数据应用不可逆哈希函数的结果。）我们还将添加一种根据给定的密码验证用户的方法，我们将在 第 8 章\
  \ 中使用该方法来允许用户登录网站。\n\n\n\n\n用户身份验证的方法是获取提交的密码，对其进行哈希处理，并将结果与数据库中存储的哈希值进行比较。如果两者匹配，则说明提交的密码正确，用户通过身份验证。通过比较哈希值而非原始密码，我们能够在不存储密码本身的情况下验证用户身份。这意味着即使我们的数据库被攻破，用户的密码仍然是安全的。\n\
  \n### 6.3.1 哈希处理过的密码\n\n大多数安全密码机制将使用一个名为 `has_secure_password` 的单一 Rails 方法来实现，我们将如下所示将其包含在\
  \ `User` 模型中：\n\n点击此处查看图片\n\n```ruby\nclass User < ApplicationRecord\n  .\n  .\n\
  \  .\n  has_secure_password\nend\n```\n\n当如上所示将其包含在模型中时，这一个方法增加了以下功能：\n\n* 将安全哈希处理过的\
  \ `password_digest` 属性保存到数据库的能力\n* 一对虚拟属性（`password` 和 `password_confirmation`），包括在对象创建时进行存在性校验，以及要求它们相互匹配的验证。在此语境下，*虚拟*意味着这些属性存在于模型对象上，但不对应于数据库中的列\n\
  * 一个 `authenticate` 方法，当密码正确时返回该用户（否则返回 `false`）\n\n`has_secure_password` 发挥魔力的唯一要求是，相应的模型必须有一个名为\
  \ `password_digest` 的属性。（*digest* 一词源于加密哈希函数的术语。在此语境下，*hashed password* 和 *password\
  \ digest* 是同义词。）在 User 模型的情况下，这导致了图 6.8 所示的数据模型。\n\n哈希处理过的密码摘要经常被错误地称为*加密密码*。例如，`has_secure_password`\
  \ 的源代码犯了这个错误，本教程的前两个版本也是如此。这种术语是错误的，因为根据设计，加密是*可逆的*——加密的能力意味着意味着*解密*的能力。相比之下，计算密码哈希摘要的意义在于使其是*不可逆的*，以便从摘要中推导出原始密码在计算上是不可行的。。（感谢读者\
  \ Andy Philips 指出这个问题并鼓励我修复这一错误的术语。）\n\n为了实现图 6.8 中的数据模型，我们首先为 `password_digest`\
  \ 列生成一个适当的迁移（migration）。我们可以选择任何想要的迁移名称，但以 `to_users` 结尾名称会很方便，因为在这种情况下 Rails 会自动构建一个向\
  \ `users` 表添加列的迁移。迁移名称为 `add_password_digest_to_users` 的结果如下所示：\n\n点击此处查看图片\n\n\
  ```bash\n$ rails generate migration add_password_digest_to_users password_digest:string\n\
  ```\n\n在这里，我们还提供了参数 `password_digest:string`，即我们想要创建的属性名称和类型。（对比一下列表 6.1 中最初生成 `users`\
  \ 表的操作，它包含了 `name:string` 和 `email:string` 参数。）通过包含 `password_digest:string`，我们为\
  \ Rails 提供了足够的信息来为我们构建整个迁移，如列表 6.35 所示。\n\n![image](img/image01100.jpeg)\n\n**图\
  \ 6.8:** 带有 `password_digest` 属性的 User 数据模型。\n\n**列表 6.35:** 添加 `password_digest`\
  \ 列的迁移。\n\n`db/migrate/[timestamp]_add_password_digest_to_users.rb`\n\n点击此处查看图片\n\
  \n```ruby\nclass AddPasswordDigestToUsers < ActiveRecord::Migration[5.0]\n  def\
  \ change\n    add_column :users, :password_digest, :string\n  end\nend\n```\n\n\
  列表 6.35 使用 `add_column` 方法向 `users` 表添加一个 `password_digest` 列。要应用它，我们只需要迁移数据库：\n\
  \n```bash\n$ rails db:migrate\n```\n\n为了制作密码摘要，`has_secure_password` 使用了一种名为 `bcrypt`\
  \ 的先进哈希函数。通过使用 `bcrypt` 对密码进行哈希处理，我们确保即使攻击者设法获得了数据库副本，也无法登录网站。要在示例应用程序中使用 `bcrypt`，我们需要将\
  \ `bcrypt` gem 添加到我们的 `Gemfile` 中（列表 6.36）。如既往，你应该使用 rails.org 上列出的版本号，而不是这里列出的版本。\n\
  \n**列表 6.36:** 在 `Gemfile` 中添加 `bcrypt`。\n\n点击此处查看图片\n\n```ruby\nsource 'https://rubygems.org'\n\
  gem 'rails', '5.0.0'\ngem 'bcrypt', '3.1.1'\n```\n\n然后照常运行 `bundle install`：\n\n\
  ```bash\n$ bundle install\n```\n\n### 6.3.2 用户拥有密码\n\n现在我们已经为 User 模型提供了 `password_digest`\
  \ 属性并安装了 `bcrypt`，准备好在 User 模型中添加 `has_secure_password`，如列表 6.37 所示。\n\n**列表 6.37:**\
  \ 在 User 模型中添加 `has_secure_password`。\n\n`app/models/user.rb`\n\n点击此处查看图片\n\n```ruby\n\
