  \ 1.1 中禁用它。）\n\n![image](img/image0355.jpeg)\n\n**图 8.8：** 一个带有新链接和下拉菜单的登录用户。\n\n\
  #### 8.2.4 测试布局更改\n\n在手动验证应用程序在登录后运行正常之后，在继续之前，我们将编写一个集成测试来捕获该行为并捕获回归。我们将在列表 8.9\
  \ 的测试基础之上，编写一系列步骤来验证以下内容：\n\n1. 访问登录路径。\n2. 向 sessions 路径提交有效信息。\n3. 验证登录链接消失。\n\
  4. 验证注销链接出现。\n5. 验证个人资料链接出现。\n\n为了看到这些更改，我们的测试需要以预先注册的用户的身份登录，这意味着该用户必须存在于数据库中。Rails\
  \ 的默认方法是使用固件（fixtures），这是一种组织数据加载到测试数据库的方法。我们在第 6.2.5 节中发现，我们需要删除默认固件以便我们的电子邮件测试通过（列表\
  \ 6.31）。现在我们准备好开始用我们自己的自定义固件填充那个空文件了。\n\n在当前，我们只需要一个用户，其信息应该包含有效的姓名和电子邮件地址。由于我们需要登录用户，还必须包含一个有效的密码，以便与\
  \ Sessions 控制器 `create` 动作提交的密码进行比较。参考图 6.8 中的数据模型，我们看到这意味着为用户固件创建一个 `password_digest`\
  \ 属性，我们将通过定义 `digest` 方法来实现。\n\n正如第 6.3.1 节中所的，密码摘要是使用 bcrypt（通过 `has_secure_password`）创建的，因此我们需要使用相同的方法创建固件密码。通过查看安全密码源码，我们发现该方法是：\n\
  \n```ruby\nBCrypt::Password.create(string, cost: cost)\n```\n\n其中 `string` 是要哈希的字符串，`cost`\
  \ 是决定计算成本的参数。使用高成本使得通过哈希值反推原始密码在计算上变得不可，这在生产环境中是一个重要的安全措施，但在测试中我们希望 `digest` 方法尽可能快。安全密码源码中也有相应的代码：\n\
  \n```ruby\ncost = ActiveModel::SecurePassword.min_cost ? BCrypt::Engine::MIN_COST\
  \ : BCrypt::Engine.cost\n```\n\n这段相当晦涩的代码不需要详细理解，它安排了上述描述的行为：在测试中使用最小成本参数，在生产环境中使用正常（高）成本参数。（将在第\
  \ 9.2 节中学习更多关于这种奇怪的 `?:` 符号的用法。）\n\n我们可以在几个地方放置生成的 `digest` 方法，但将在第 9.1.1 节中 User\
  \ 模型重用它，这建议将其放在 `user.rb` 中。由于我们在计算摘要时可能无法访问用户对象（如固件文件所示），我们将 `digest` 方法附加到 User\
  \ 类本身，这（正如我们在第 4.4.1 节中简要过的）使其成为类方法。结果出现在列表 8.21 中。\n\n\n\n\n\n```ruby\nclass User\
  \ < ApplicationRecord\n  before_save { self.email = email.downcase }\n  validates\
  \ :name, presence: true, length: { maximum: 50 }\n  VALID_EMAIL_REGEX = /\\A[\\\
  w+\\-.]+@[a-z\\d\\-.]+\\.[a-z]+\\z/i\n  validates :email, presence: true, length:\
  \ { maximum: 255 },\n    format: { with: VALID_EMAIL_REGEX },\n    uniqueness: {\
  \ case_sensitive: false }\n  has_secure_password\n  validates :password, presence:\
  \ true, length: { minimum: 6 }\n\n  # Returns the hash digest of the given string.\n\
  \  def self.digest(string)\n    cost = ActiveModel::SecurePassword.min_cost ? BCrypt::Engine::MIN_COST\
  \ :\n             BCrypt::Engine.cost\n    BCrypt::Password.create(string, cost:\
  \ cost)\n  end\nend\n```\n\n通过 Listing 8.21 中的 `digest` 方法，我们现在准备好为有效用户创建一个用户固件（fixture）了，如\
  \ Listing 8.22 所示。(11)\n\n[11.] 值得注意的是，固件文件的缩进必须采用空格的形式而不是制表符（tabs），因此在拷贝像 Listing\
  \ 8.22 所示的代码时要小心。\n\n**Listing 8.22:** 测试用户登录的固件。\n\n```yaml\ntest/fixtures/users.yml\n\
  \nmichael:\n  name: Michael Example\n  email: michael@example.com\n  password_digest:\
  \ <%= User.digest('password') %>\n```\n\n特别注意，固件支持嵌入式 Ruby，这允许我们使用 \n\n```ruby\n\
  <%= User.digest('password') %>\n```\n\n为测试用户创建有效的密码哈希值。\n\n虽然我们已经定义了 `has_secure_password`\
  \ 需要的 `password_digest` 属性，但有时引用明文（虚拟）密码也会方便。。遗憾的是，这在固件中无法实现，而且在 Listing 8.22 中添加\
  \ `password` 属性会导致 Rails 报错数据库中不存在该列（事实确实如此）。我们将通过采用约定——即所有固件用户具有相同的密码（'password'）来解决这个问题。\n\
  \n创建了带有有效用户的固件后，我们可以如下所示在测试内部检索它：\n\n`user = users(:michael)`\n\n这里 `users` 对应于固件文件名\
  \ `users.yml`，而符号 `:michael` 引用 Listing 8.22 中显示的键对应的用户。\n\n有了上面的固件用户，我们现在可以通过将本节开头列出的序列转换为代码，为布局链接编写一个测试，如\
  \ Listing 8.23 所示。\n\n**Listing 8.23:** 使用有效信息用户登录的测试。`GREEN`\n\n```ruby\ntest/integration/users_login_test.rb\n\
  \nrequire 'test_helper'\n\nclass UsersLoginTest < ActionDispatch::IntegrationTest\n\
  \  def setup\n    @user = users(:michael)\n  end\n\n  test \"login with valid information\"\
  \ do\n    get login_path\n    post login_path, params: { session: { email: @user.email,\n\
  \      password: 'password' } }\n    assert_redirected_to @user\n    follow_redirect!\n\
  \    assert_template 'users/show'\n    assert_select \"a[href=?]\", login_path,\
  \ count: 0\n    assert_select \"a[href=?]\", logout_path\n    assert_select \"a[href=?]\"\
  , user_path(@user)\n  end\nend\n```\n\n在这里，我们使用了 `assert_redirected_to @user` 来检查正确的重定向，并使用\
  \ `follow_redirect!` 实际访问目标页面。Listing 8.23 还通过验证页面上不存在零路径链接来验证登录链接是否已消失：\n\n`assert_select\
  \ \"a[href=?]\", login_path, count: 0`\n\n通过包含额外的 `count: 0` 选项，我们告诉 `assert_select`\
  \ 我们期望匹配模式的链接数量为零。（对比 Listing 5.32 中的 `count: 2`，它检查的是恰好有两个链接。）因为应用程序代码已经在运行，所以这个测试应该是\
  \ `GREEN` 的：\n\n**Listing 8.24:** `GREEN`\n\n```bash\n$ rails test test/integration/users_login_test.rb\
  \ --name test_login_with_information\n```\n\n这显示了如何通过传递包含测试名称的 `--name test_login_with_information`\
  \ 选项，在测试文件中运行特定的测试。（测试的名称只是“test”一词加上测试描述中使用下划线连接的单词。）注意，第二行的 `>` 是 shell 自动插入的“换行”字符，不应输入。\n\
