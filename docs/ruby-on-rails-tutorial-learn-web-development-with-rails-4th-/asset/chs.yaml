  \ 使用具名路由\n\n有了在列表 5.27 中定义的路由，我们现在可以在站点布局中使用这些具名路由。这仅仅只需填充 `link_to` 函数的第二个参数。例如，我们将\n\
  \n```erb\n<%= link_to \"About\", '#' %>\n```\n转换为点击此处查看代码图片\n\n```erb\n<%= link_to\
  \ \"About\", about_path %>\n```\n\n以此类推。\n\n我们将从页眉部分 `_header.html.erb`（列表 5.30）开始，它包含了指向首页和帮助页面的链接。在此顺手时，我们将遵循常见的\
  \ Web 惯例，也将 logo 链接到首页。\n\n\n\n\n\n```html\n<header class=\"navbar navbar-fixed-top\
  \ navbar-inverse\">\n  <div class=\"container\">\n    <%= link_to \"sample app\"\
  , root_path, id: \"logo\" %>\n    <nav>\n      <ul class=\"nav navbar-nav navbar-right\"\
  >\n        <li><%= link_to \"Home\", root_path %></li>\n        <li><%= link_to\
  \ \"Help\", help_path %></li>\n        <li><%= link_to \"Log in\", '#' %></li>\n\
  \      </ul>\n    </nav>\n  </div>\n</header>\n```\n\n在第 8 章之前，我们还没有为“登录”链接提供命名路由，因此我们暂时将其留为\
  \ `'#'`。\n\n另一个包含链接的地方是页脚部分组件 `_footer.html.erb`，它包含了指向“关于”和“联系”页面的链接（列表 5.31）。\n\
