  \    end\n  end\n  .\n  .\nend\n```\n\n---\n\n#### 9.1.2 带有记住功能的登录\n\n在创建了工作的 `user.remember`\
  \ 方法后，我们现在可以在在浏览器上存储用户的（加密））ID 和记住令牌来创建一个持久会话。实现此点的方法是使用 `cookies` 方法，与 `session`\
  \ 一样，我们可以将其视为一个哈希。Cookie 由部分信息组成：`value` 和可选的 `expires` 日期。例如，我们可以通过创建一个值等于记住令牌并在\
  \ 20 年后过期的 Cookie 来创建一个持久会话：\n\n点击此处查看代码图像\n\n```ruby\ncookies[:remember_token]\
  \ = { value: remember_token, expires: 20.years.from_now.utc }\n```\n\n（这使用了 Rails\
  \ 的一个方便辅助方法之一，正如在框 9.1 中讨论过的。）这种设置 20 年后过期的 Cookie 模式非常常见，以至于 Rails 有一个专门的 `permanent`\
  \ 方法来实现它，这样我们只需要编写：\n\n点击此处查看代码图像\n\n```ruby\ncookies.permanent[:remember_token]\
  \ = remember_token\n```\n\n---\n\n### 框 9.1：Cookie 在 20 年后过期\n\n你可能在第 4.4 节 中发现过，Ruby\
  \ 允许向任何类添加方法，正如我们在该节中为 `String` 添加了 `palindrome?` 方法（发现 \"deified\" 是回文），我们也看到 Rails\
  \ 为 `Object` 添加了 `blank?` 方法（使得 `\"\".blank?` 为真）。`cookies.permanent` 方法会自动设置 20\
  \ 年后过期，这为 Rails 的时间方法提供了另一个例子，这些方法应用于 `Fixnum`（基类）：\n\n```bash\n$ rails console\n\
  >> 1.year.from_now\n=> Wed, 21 Jun 2017 19:36:29 UTC0000\n>> 10.weeks.ago\n=> Tue,\
  \ 12 Apr 2016 19:36:44 UTC0000\n```\n\nRails 还添加了其他方法：\n>> 1.kilobyte\n=> 1024\n\
  >> 5.megabytes\n=> 5242880\n```\n\n这些方法对于上传验证非常有用，使得可以轻松限制图像上传为 5.megabytes。\n\n\
  虽然应该谨慎使用，但向内置类添加方法的灵活性为原生 Ruby 提供了巨大的扩展。事实上，Rails 的优雅很大程度上源于 Ruby 语言的灵活。\n\n---\n\
  \n为了将用户 ID 存储在 Cookie 中，我们可以遵循列表 8.14 中使用的 `session` 方法模式，使用类似：\n\n```ruby\ncookies[:user_id]\
  \ = user.id\n```\n\n由于它是以明文放置 ID，这种方法暴露了应用程序 Cookie 的形式，并让攻击者更容易破解账户。为了避免这种情况，我们将使用*签名*signed）Cookie，它会在将\
  \ Cookie 放入浏览器之前对其安全加密⁸：\n\n⁸ 签名和加密通常是不同的操作，但从 Rails 4 开始，`signed` 方法默认执行这两者。\n\n\
  点击此处查看代码图像\n\n```ruby\ncookies.signed[:user_id] = user.id\n```\n\n因为我们希望用户 ID 与持久的记住令牌配对，我们也应该将其变为持久的，我们可以通过链式调用\
  \ `signed` 和 `permanent` 方法来实现：\n\n点击此处查看代码图像\n\n```ruby\ncookies.permanent.signed[:user_id]\
  \ = user.id\n```\n\n设置 Cookie 后，在随后的页面访问中，我们可以通过代码获取用户：\n\n点击此处查看代码图像\n\n```ruby\n\
  User.find_by(id: cookies.signed[:user_id])\n```\n\n\n\n\n其中 `cookies.signed[:user_id]`\
  \ 会自动解密用户 id cookie。我们随后可以使用 `bcrypt` 来验证 `cookies[:remember_token]` 是否与 Listing\
  \ 9.3 中生成的 `remember_digest` 匹配。（如果你在想为什么我们不直接使用经过签名的 user id 而不使用 remember token，这会让一个拥有加密\
  \ id 的攻击者永久地以该用户身份登录。在目前的设计中，同时拥有这两个 cookie 的攻击者只能登录该用户直到用户注销为止。）\n\n拼图的最后一块碎片是验证给定的\
  \ remember token 是否与用户的 remember digest 匹配，在这种语境下，有几种等效的方法可以使用 `bcrypt` 来验证匹配。如果你查看安全密码的源代码，你会发现类似这样的比较：⁹\n\
  \n9. 正如 第 6.3.1 节 所述，“未加密密码”是一个误称，因为安全密码是*哈希（hashed）*而不是加密。\n\n点击此处查看代码图像\n\n```\n\
  BCrypt::Password.new(password_digest) == unencrypted_password\n```\n\n在我们的案例中，类似的代码看起来如下：\n\
  \n点击此处查看代码图像\n\n```\nBCrypt::Password.new(remember_digest) == remember_token\n```\n\
  \n如果你仔细想想，这段代码其实非常奇怪：它似乎在直接将一个 bcrypt 密码摘要与一个 token 进行比较，这意味着为了使用 `==` 进行比较而需要*解密*该摘要。但使用\
  \ `bcrypt` 的核心点在于让哈希变为不可逆转的，所以这是不可能的。事实上，深入研究 `bcrypt` gem 的源代码可以证实比较操作符 `==` 正在被*重定义*，在底层，上面的比较等同于以下代码：\n\
  \n点击此处查看代码图像\n\n```\nBCrypt::Password.new(remember_digest).is_password?(remember_token)\n\
  ```\n\n这里没有使用 `==`，而是使用布尔方法 `is_password?` 来执行比较。因为它的含义稍微清晰，我们将在应用代码中更倾向使用第二种比较形式。\n\
  \n上面的讨论建议将 digest–token 的比较放入 `User` 模型的 `authenticated?` 方法中，该方法的作用与 `has_secure_password`\
  \ 用于验证用户的 `authenticate` 方法相似（Listing 8.15）。实现代码出现在 Listing 9.6 中。（尽管 Listing 9.6\
  \ 中的 `authenticated?` 方法专门绑定到 remember digest，但事实证明它在其他语境下也有用，我们将在 第 11 章 中对其进行泛化。）\n\
  \n**Listing 9.6:** 在 `User` 模型中添加 `authenticated?` 方法。\n\napp/models/user.rb\n\n\
  点击此处查看代码图像\n\n```ruby\nclass User < ApplicationRecord\n  attr_accessor :remember_token\n\
  \  before_save { self.email = email.downcase }\n  validates :name, presence: true,\
  \ length: { maximum: 50 }\n  VALID_EMAIL_REGEX = /\\A[\\w+\\-.]+@[a-z\\d\\-.]+\\\
  .[a-z]+\\z/i\n  validates :email, presence: true, length: { maximum: 255 },\n  \
  \                  format: { with: VALID_EMAIL_REGEX },\n                    uniqueness:\
  \ { case_sensitive: false }\n  has_secure_password\n  validates :password, presence:\
  \ true, length: { minimum: 6 }\n\n  # 返回给定字符串的哈希摘要。\n  def User.digest(string)\n\
  \    cost = ActiveModel::SecurePassword.min_cost ? BCrypt::Engine::MIN_COST :\n\
  \                               BCrypt::Engine.cost\n    BCrypt::Password.create(string,\
  \ cost: cost)\n  end\n\n  # 返回一个随机 token。\n  def self.new_token\n    SecureRandom.url_safe64\n\
  \  end\n\n  # 在数据库中记住用户以便用于持久会话。\n  def remember\n    self.remember_token = User.new_token\n\
  \    update_attribute(:remember_digest, User.digest(remember_token))\n  end\n\n\
  \  # 如果给定 token 匹配摘要则返回 true。\n  def authenticated?(remember_token)\n    BCrypt::Password.new(remember_digest).is_password?(remember_token)\n\
  \  end\nend\n```\n\n注意，Listing 9.6 中定义的 `authenticated?` 方法中的 `remember_token` 参数与我们在\
  \ Listing 9.3 中通过 `attr_accessor :remember_token` 定义的访问器不同；相反，它是方法的一个局部变量。（因为参数引用的是\
  \ remember token，所以它不是访问器。）此外，Listing 9.6 中定义的 `authenticated?` 方法中的 `remember_token`\
  \ 并不是我们在经过签名的 第 6 章 中通过 `attr_accessor :remember_token` 定义的访问器相同；相反，它是方法的一个局部变量。（因为参数引用的是\
  \ remember token，所以它不是访问器。）此外，注意在 第 6 章 中经过签名的 user id，Listing 9.6 中的 `remember_digest`\
  \ 是通过 Record 自动创建的。\n\n现在我们可以记住登录的用户了，我们将通过 `Sessions` helper 实现，如 Listing 9.7 所示。\n\
  \n**Listing 9.7:** 登录并记住用户。\n\napp/controllers/sessions_controller\n\n点击此处查看代码图像\n\
  \n```ruby\nclass SessionsController < ApplicationController\n  def new\n  end\n\n\
  \  def create\n    user = User.find_by(email: params[:email].downcase)\n    if user\
  \ && user.authenticate(params[:password])\n      log_in user\n      remember user\n\
  \      redirect_to user\n    else\n      flash.now[:danger] = 'Invalid password\
  \ combination'\n      render 'new'\n    end\n  end\n\n  def destroy\n    log_out\n\
  \    redirect_to root_url\n  end\nend\n```\n\n正如 `log_in` 一样，Listing 9.7 将真正的工作委托给了\
  \ `Sessions` helper，我们在那里定义了 `remember` 方法，它调用 `user.remember`，从而生成 remember token\
  \ 并将其摘要保存到数据库。然后使用 `cookies` 为用户 id 和 remember token 创建持久性 cookie。结果出现在 Listing\
  \ 9.8 中。\n\n**Listing 9.8:** 记住用户。\n\napp/helpers/sessions_helper.rb\n\n点击此处查看代码图像\n\
  \n```ruby\nmodule SessionsHelper\n  # 登录用户。\n  def log_in(user)\n    session[:user_id]\
  \ = user.id\n  end\n\n  # 在持久会话中记住用户。\n  def remember(user)\n    user.remember\n\
  \    cookies.permanent.signed[:user_id] = user.id\n    cookies.permanent[:remember_token]\
  \ = user.remember_token\n  end\n\n  # 返回当前登录的用户（如果有）。\n  def current_user\n    @current_user\
  \ ||= User.find_by(id: session[:user_id])\n  end\n\n  # 如果用户已登录返回 true，否则返回 false。\n\
  \  def logged_in?\n    !current_user.nil?\n  end\n\n  # 注销当前登录的用户。\n  def log_out\n\
  \    session.delete(:user_id)\n    @current_user = nil\n  end\nend\n```\n\n有了 Listing\
  \ 9.8 中的代码，用户登录后会在意义上被记住，因为他们的浏览器获得了一个有效的 remember token，但对我们来说还没有帮助，因为 Listing\
  \ 8.16 中定义的 `current_user` 方法只知道临时的 session：\n\n点击此处查看代码图像\n\n```\n@current_user\
  \ ||= User.find_by(id: session[:user_id])\n```\n\n\n\n\n在持久会话（persistent sessions）的情况下，如果\
  \ `session[:user_id]` 存在，我们希望从临时会话检索用户；否则，我们应该查找 `cookies[:user_id]` 来检索（并登录）对应持久会话的用户。我们可以通过以下方式实现：\n\
  \n点击此处查看代码图片\n\n```\nif session[:user_id]\n  @current_user ||= User.find_by(id:\
  \ session[:user_id])\nelsif cookies.signed[:user_id]\n  user = User.find_by(id:\
  \ cookies.signed[:user_id])\n  if user && user.authenticated?(cookies[:remember_token])\n\
  \    log_in user\n    @current_user = user\n  end\nend\n```\n\n（这遵循我们在 Listing 8.7\
  \ 中看到的 `user && user.authenticated` 模式。上面的代码可以工作，但请注意重复使用了两次 `session` 和 `cookies`。我们可以通过以下方式消除这种重复：\n\
  \n点击此处查看代码图片\n\n```\nif (user_id = session[:user_id])\n  @current_user ||= User.find_by(id:\
  \ user_id)\nelsif (user_id = cookies.signed[:user_id])\n  user = User.find_by(id:\
  \ user_id)\n  if user && user.authenticated?(cookies[:remember_token])\n    log_in\
  \ user\n    @current_user = user\n  end\nend\n```\n\n这种方法使用了常见但可能引起混淆的构造：\n\n点击此处查看代码图片\n\
  \n```ruby\nif (user_id = session[:user_id])\n```\n\n尽管外观如此，这*不是*一个比较（比较会使用双等号 `==`），而是一个*赋值*。如果你用语言读出它，你不会说“如果\
  \ user id 等于 user id 的 session……”，而是说类似“如果 user id 的 session 存在（同时将 user id 设置为\
  \ user id 的 session）……”。我通常习惯于将此类赋值放在括号中，这是一种视觉提醒，表明它不是比较。\n\n如上所述定义 `current_user`\
  \ 辅助方法会导致如 Listing 9.9 所示的实现。\n\n**Listing 9.9:** 为持久会话更新 `current_user`。**RED**\n\
  \n`app/helpers/sessions_helper.rb`\n\n点击此处查看代码图片\n\n```ruby\nmodule SessionsHelper\n\
  \  # 登录给定用户。\n  def log_in(user)\n    session[:user_id] = user.id\n  end\n\n  #\
  \ 在持久会话中记住用户。\n  def remember(user)\n    user.remember\n    cookies.permanent.signed[:user_id]\
  \ = user.id\n    cookies.permanent[:remember_token] = user.remember_token\n  end\n\
  \n  # 返回对应 remember token cookie 的用户。\n  def current_user\n    if (user_id = session[:user_id])\n\
  \      @current_user ||= User.find_by(id: user_id)\n    elsif (user_id = cookies.signed[:user_id])\n\
  \      user = User.find_by(id: user_id)\n      if user && user.authenticated?(cookies[:remember_token])\n\
  \        log_in user\n        @current_user = user\n      end\n    end\n  end\n\n\
  \  # 如果用户已登录，返回 true，否则返回 false。\n  def logged_in?\n    !current_user.nil?\n  end\n\
  \n  # 注销当前用户。\n  def log_out\n    session.delete(:user_id)\n    @current_user =\
  \ nil\n  end\nend\n```\n\n通过 Listing 9.9 中的代码，新登录的用户会被正确记住，你可以通过登录、关闭浏览器并在重启示例应用程序时检查你是否仍然登录来验证这一点。如果你愿意，甚至可以检查浏览器直接查看结果（图\
  \ 9.2），以检查你系统上的 cookies。\n\n我们目前的应用程序只有一个问题：如果不清除他们的 cookies（或者等上几年），用户没有办法注销。这正是我们的测试套件应该捕捉到的问题，而且它确实应该被捕捉到：\n\
