  $ cd sample_app/\n```\n\n* * *\n\n（与第 2.1 节一样，注意云 IDE 用户可以在与前两章应用相同的 workspace 中创建此项目。没有必要创建新的\
  \ workspace。）\n\n*注意*：为了方便起见，完成后的应用可以在 bitbucket.part0012.xhtml_ch3en2 找到参考实现。\n\
