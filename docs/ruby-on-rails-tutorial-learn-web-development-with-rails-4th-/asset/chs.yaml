  \n**框 3.2：GET 等。**\n\n超文本传输协议 (HTTP) 定义了基本操作 `GET`、`POST`、`PATCH` 和 `DELETE`。这些指的是*客户端*计算机（通常运行\
  \ Chrome、Firefox 或 Safari 等 Web 浏览器）与*服务器*（通常运行 Apache 或 Nginx 等 Web 服务器）之间的操作。（重要的是，在本地计算机上开发\
  \ Rails 时，客户端和服务器是同一台物理机器，但通常它们是不同的。）对 HTTP 动词的强调是 Web 框架（包括 Rails）受*REST 架构*影响的典型特征，我们在第\
  \ 2 章 中简要见过它，并将在第 7 章 中开始学习更多。`GET` 是最常见的 HTTP 操作，用于*读取*网络上的数据；它仅仅意味着“获取页面”，每当你访问像\
  \ [`http://www.google.com/`](http://www.google.com/) 或 [`http://www.wikipedia.org/`](http://www.wikipedia.org/)\
  \ 这样的网站，你的浏览器都会提交一个 `GET` 请求。`POST` 是次常见的操作；它是你的浏览器在提交表单时发送的请求。在 Rails 应用中，`POST`\
  \ 请求通常用于*创建*内容（尽管 HTTP 也允许 `POST` 执行更新）。例如，当你提交注册表单时发送的 `POST` 请求会在远程站点创建一个新用户。另外两个动词\
  \ `PATCH` 和 `DELETE` 设计用于在远程服务器上*更新*和*销毁*内容。这些请求比 `GET` 和 `POST` 少见，因为浏览器无法以原生方式发送它们，但某些\
  \ Web 框架（包括 Ruby on Rails）有巧妙的方法让它*看起来*像是浏览器正在发出此类请求。因此，Rails 支持所有四种请求类型：`GET`、`POST`、`PATCH`\
  \ 和 `DELETE`。\n\n***\n\n![image](img/image01056.jpeg)\n\n**图 3.2：** 原始首页视图 (`/static_pages/home`)。\n\
  \n为了理解这个页面来自哪里，让我们先在文本编辑器中查看 `Static Pages` 控制器，它看起来可能像列表 3.8。你可能注意到，与第 2 章 中的演示\
  \ `Users` 和 `Microposts` 控制器不同，`Static Pages` 控制器没有使用标准的 REST action。对于静态页面集合来说这是正常的：REST\
  \ 架构并不是解决每个问题的最佳方案。\n\n**列表 3.8：** 由列表 3.6 创建的 `Static Pages` 控制器。\n\n```\napp/controllers/static_pages_controller.rb\n\
  ```\n\n点击此处查看代码\n\n***\n\n```ruby\nclass StaticPagesController < ApplicationController\n\
  \  def home\n  end\n\n  def help\n  end\nend\n```\n\n***\n\n我们从列表 3.8 中的 `class`\
  \ 关键字看到 `static_pages_controller.rb` 定义了一个*类*，在此例中被称为 `StaticPagesController`。类仅仅是组织*函数*（也称为*方法*）的一种方便方式，例如\
  \ `home` 和 `help` action，这些 action 是使用 `def` 关键字定义的。正如第 2.3.4 节 中的那样，角括号 `<` 表示\
  \ `StaticPagesController`*继承*自 Rails 类 `ApplicationController`；正如我们将看到的，这意味着我们的页面配备了大量的\
