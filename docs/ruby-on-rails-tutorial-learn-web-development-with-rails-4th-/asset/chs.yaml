  \ 基础图片上传\n\n为了处理上传的图片并将其与 Micropost 模型关联，我们将使用 `CarrierWave` 图片上传器。要开始，我们需要在 `Gemfile`\
  \ 中引入 `carrierwave` gem（列表 13.58）。(14 还包含了图片缩放所需的 `mini_magick` 和 `fog` gem（第 13.4.3\
  \ 节）以及生产环境中的图片上传所需的 gem（第 13.4.4 节）。\n\n14. 一如既往，你应该使用 gemfiles-4th-ed.railstutorial.org\
  \ 列出的版本号，而不是这里列出的版本。\n\n![image](img/image02340.jpeg)\n\n**图 13.18：** 微贴图片上传的原型（带有已上传的图片）。\n\
  \n**列表 13.58：** 在 `Gemfile` 中添加 CarrierWave。\n\n点击此处查看代码图片\n\n* * *\n\n```ruby\n\
  source 'https://rubygems.org'\ngem 'rails', '5.0.0'\ngem 'bcrypt', '3.1.11'\ngem\
  \ 'faker', '1.6.3'\ngem 'carrierwave', '0.11.2'\ngem 'mini_magick', '4.5.1'\ngem\
  \ 'fog', '1.38.0'\ngem 'will_paginate', '3.0.7'\ngem 'bootstrap-will_paginate',\
  \ '0.0.10'\n```\n\n* * *\n\n然后我们像往常一样安装：\n\n`$ bundle install`\n\nCarrierWave 提供了一个\
  \ Rails 生成器用于创建图片上传器，我们将用它来为名为 `picture` 的图片创建一个上传器：(15 最初我将属性命名为 `image`，但那个名字太让人困惑了。点击此处查看代码图片\n\
  \n`$ rails generate uploader Picture`\n\n使用 CarrierWave 上传的图片应该与模型关联。生成的微贴照片出现在图\
  \ 13.18 中。\n\n![image](img/image0234.jpeg)\n\n**图 13.18：** 微贴图片上传的原型。\n\n要为微贴模型添加\
  \ `picture` 属性，我们需要生成一个迁移并：\n\n`$ rails generate migration add_picture_to_microposts\
  \ picture:string`\n\n`$ rails db:migrate`\n\n将 `picture` 属性与微贴模型关联的方法是使用 `mount_uploader`\
  \ 方法，如列表 13.59 所示。\n\n```ruby\nclass Micropost < ApplicationRecord\n  belongs_to\
  \ :user\n  validates :user_id, presence: true\n  validates :content, presence: true,\
  \ length: { maximum: 140 }\n  mount_uploader :picture\nend\n```\n\n\n\n\n\n一旦图片上传完成，我们就可以在\
