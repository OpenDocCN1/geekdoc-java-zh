  - Rails 布局（layouts）允许应用程序中的页面使用通用模板，从而消除重复代码。\n\n## 3.6 高级测试设置\n\n此可选章节描述了 Ruby\
  \ on Rails 教程视频系列中使用的测试设置。它包含两个主要元素：一个增强的通过/失败报告器（3.6.1 节），以及一个检测文件更改并自动运行相应测试的自动化测试运行器（3.6.2\
  \ 节）。本节中的代码较为高级，仅为了方便演示而展示；你现在不需要理解它们。\n\n本节中的更改应在 master 分支上进行：\n\n```bash\n$ git\
  \ checkout master\n```\n\n### 3.6.1 Minitest 器\n\n为了让默认的 Rails 测试在适当的时间显示 `RED`（红色）和\
  \ `GREEN`（绿色），我建议将列表 3.44 中的代码添加到你的测试辅助文件中，18，从而利用在列表 3.2 中包含的 `minitest-reporters`\
  \ gem 包。\n\n18. 列表 3.44 中的代码混合了单引号和双引号字符串。这是因为 `rails new` 生成的是单引号字符串，而 minitest\
  \ reporters 的文档使用的是双引号字符串。这两种字符串类型的混合在 Ruby 中很常见；更多信息请参见 4.2.2 节。\n\n![image](img/image01065.jpeg)\n\
  \n**图 3.8：** 在云端 IDE 中从 `RED` 变为 `GREEN`。\n\n**列表 3.44：** 配置测试显示 `RED` 和 `GREEN`。\n\
  \n`test/test_helper.rb`\n\n点击此处查看代码图片\n\n* * *\n\n```\nENV['RAILS_ENV'] ||= 'test'\n\
  \nrequire File.expand_path('../../config/environment', __FILE__)\n\nrequire 'rails/test_help'\n\
  \nrequire \"minitest/reporters\"\n\nMinitest::Reporters.use! \n\nclass ActiveSupport::TestCase\n\
  \  # 按字母顺序为所有测试设置 test/fixtures/*.yml 中的所有固定件。\n  fixtures :all\n\n  # 在此处添加更多供所有测试使用的辅助方法...\n\
  end\n```\n\n* * *\n\n云端 IDE 中从 `RED` 到 `GREEN` 的转换结果如图 3.8 所示。19 该截图是使用 Rails 4.2\
  \ 拍摄的，正如框 2.1 中所提到的，它使用 `rake test` 代替 `rails test`。解决此类细微差异是练习技术老练的好方法。\n\n####\
  \ 3.6.2 使用 Guard 进行自动化测试\n\n使用 `rails test` 命令的一个烦恼之处是必须切换到命令行并手动运行测试。为了避免这种不便，我们可以使用\
  \ `Guard` 来自动化测试的运行。`Guard` 监控文件系统中的更改，例如，当我们更改 `static_pages_test.rb` 文件时，只会运行那些测试。更好的是，我们可以配置\
  \ `Guard`，使得当例如 `home.html.erb` 文件被修改时，会自动运行 `static_pages_test.rb`。\n\n列表 3.2 中的\
  \ `Gemfile` 已经在我们的应用程序中包含了 `guard` gem，所以要开始我们只需要初始化它：\n\n点击此处查看代码图片\n\n```bash\n\
  $ bundle exec guard init\n```\n正在将 Guardfile 写入 /home/ubuntu/sample_app/Guardfile\n\
  0:51:32 INFO minitest guard 已添加到 Guardfile，请随时编辑它\n\n然后我们编辑生成的 `Guardfile`，以便在更新集成测试和视图时，`Guard`\
  \ 能够运行正确的测试列表 3.45。（鉴于其长度和高级性，我建议直接复制粘贴列表 3.45 的内容。）\n\n注意：在编写本文时，`Guard` 和 `Spring`\
  \ 之间存在一个交互漏洞，会导致每次都运行所有测试。我正在关注此问题，并在解决后更新本节。\n\n**列表 3.45：** 一个自定义的 `Guardfile`。\n\
  \n点击此处查看代码图片\n\n* * *\n\n```ruby\n# 定义 Guard 的匹配规则。\nguard :minitest, spring: \"\
  bin/rails test\", all_on_start: false do\n  watch(%r{test/(.*)/(.*)_test\\.rb})\n\
  \  watch('test/test_helper.rb') { 'test' }\n  watch('config/routes.rb') { integration_tests\
  \ }\n  watch(%r{app/models/(.*?)\\.rb}) do |matches|\n    \"test/models/#{matches[1]}_test.rb\"\
  \n  end\n  watch(%r{app/controllers/(.*?)_controller\\.rb}) do |matches|\n    resource_tests(matches[1])\n\
  \  end\n  watch(%r{app/views/([^/]*)/.*\\.html\\.erb$}) do |matches|\n    [\"test/controllers/#{matches[1]}_controller_test.rb\"\
  ] + integration_tests(matches[1])\n  end\n  watch(%r{app/helpers/(.*?)_helper\\\
  .rb}) do |matches|\n    integration_tests(matches[1])\n  end\n  watch('app/views/layouts/application.html.erb')\
  \ do\n    'test/integration/site_layout_test.rb'\n  end\n  watch('app/helpers/sessions_helper.rb')\
  \ do\n    integration_tests << 'test/helpers/sessions_helper_test.rb'\n  end\n \
  \ watch('app/controllers/sessions_controller.rb') do\n    ['test/controllers/sessions_controller_test.rb',\
  \ 'test/integration/users_login_test.rb']\n  end\n  watch('app/controllers/account_activations_controller.rb')\
  \ do\n    'test/integration/users_signup_test.rb'\n  end\n  watch(%r{app/views/users/*})\
  \ do\n    resource_tests('users') + ['test/integration/microposts_interface_test.rb']\n\
  \  end\nend\n\n# 返回对应给定资源的集成测试。\ndef integration_tests(resource = :all)\n  if resource\
  \ == :all\n    Dir(\"test/integration/*\")\n  else\n    Dir(\"test/integration/#{resource}_*.rb\"\
  )\n  end\nend\n\n# 返回对应给定资源的控制器测试。\ndef controller_test(resource)\n  \"test/controllers/#{resource}_controller.rb\"\
  \nend\n\n# 返回给定资源的所有测试。\ndef resource_tests(resource)\n  integration_tests(resource)\
  \ << controller_test(resource)\nend\n```\n\n\n\n\n# 或者对于操作系统，你可能想添加一个全局忽略：\n\n```bash\n\
  git config --global core.excludesfile '˜/.gitignore_global'\n```\n\n# 忽略 bundler\
  \ 配置。\n```text\n/.bundle\n```\n\n# 忽略默认的 SQLite 数据库。\n```text\n/db/*.sqlite3\n/db/*.sqlite3-journal\n\
  ```\n\n# 忽略所有日志文件和临时文件。\n```text\n/log/***\n/tmp/***\n!/log/.keep\n!/tmp/.keep\n\
  ```\n\n# 忽略 Byebug 命令历史文件。\n```text\n.byebug_history\n```\n\n# 忽略 Spring 文件。\n```text\n\
  /spring/*.pid\n```\n\n***\n\n![image](img/image01067.jpeg)\n\n**图 3.10:** 在文件导航器中显示隐藏文件。\n\
  \n在写本文时，Spring Server 仍然有一点怪怪，有时 Spring 进程会累积并减慢你测试的运行速度。如果你的测试似乎变得异常缓慢，那么检查系统进程并在必要时杀死它们是一个好主意（参见\
  \ Box 3.4）。\n\n![image](img/image01068.jpeg)\n\n**图 3.11:** 通常隐藏的 `.gitignore` 文件变为可见。\n\
  \n***\n\n**Box 3.4：Unix 进程**\n\n在 Linux 和 OS X 等类 Unix 操作系统上，用户任务和系统任务分别发生在一个定义良好的容器内，该容器被称为*进程*（process）。要查看系统上的所有进程，你可以使用\
  \ `ps` 命令配合 `aux` 参数：\n\n```bash\n$ ps aux\n```\n\n要按类型过滤进程，你可以通过 Unix 管道 `|` 将\
  \ `ps` 的结果传递给 `grep` 模式匹配器：\n\n```bash\n$ ps aux | grep spring\nubuntu 12241 0.3\
  \ 0.5 589960 178416 ? Ssl Sep20 1:46\nspring app | sample_app | started 7 hours\
  \ ago\n```\n\n显示的结果提供了关于该进程的一些细节，但最重要的信息是第一个数字，它就是*进程 ID*（process id），即 `pid`。要消除一个不需要的进程，使用\
  \ `kill` 命令向 `pid` 发送 Unix 终止信号（恰好是 15）：\n\n```bash\n$ kill -15 12241\n```\n\n这是我推荐的杀死单个进程的技术，例如杀死失控的\
  \ Rails 服务器（通过 `ps aux | grep server` 找到 `pid`），但有时杀死所有匹配特定进程名的进程也是方便的，例如当你想要杀死所有阻塞你系统的\
  \ `spring` 进程时。在这种特定情况下，你应该先尝试使用 `spring` 命令本身停止进程：\n\n```bash\n$ spring stop\n\
  ```\n\n不过，有时这并不起，你可以使用 `pkill` 命令如下所示杀死所有名为 `spring` 的进程：\n\n```bash\n$ pkill -15\
  \ -f spring\n```\n\n每当某些运行不符合预期或进程看起来被冻结时，运行 `ps aux` 查看发生了什么是一个好主意，然后运行 `kill -15\
  \ <pid>` 或 `pkill -15 -f <name>` 来清理现场。\n\n一旦配置好 Guard，你就应该打开一个新的终端，并（与 第 1.3.2\
  \ 节 中的 Rails 服务器一样）如下在命令行中运行它：\n\n```bash\n$ bundle exec guard\n```\n\nListing 3.45\
  \ 中的规则针对本教程进行了优化，当控制器发生变化时会自动运行（例如）集成测试。要运行*所有*测试，请在 `guard>` 提示符处按回车。（这有时可能会产生错误，指示无法连接到\
  \ Spring 服务器。要解决此问题，再次按回车即可。）\n\n要退出 Guard，按 Ctrl-D。要向 Guard 添加额外的内容匹配器，请参考 Listing\
  \ 3.45 中的示例、Guard 的 README 以及 Guard wiki。\n\n在继续之前，你应该添加更改并进行提交：\n\n点击此处查看代码图片\n\
  \n```bash\n$ git add -A\n$ git commit -m \"Complete advanced setup\"\n```\n\n##\
  \ 第 4 章 Rails 风格的 Ruby\n\n本章基于 第 3 章 中的示例，探讨了 Ruby 语言中对 Rails 重要的某些元素。Ruby 是一门大语言，但幸运的是，作为\
  \ Rails 开发者高效工作所需的子集相对较小。它与通常 Ruby 介绍中涵盖的内容也有所不同。本章旨在为你打下 Rails 风格 Ruby 的坚实基础，无论你之前是否具有该语言的经验。它涵盖了大量内容，第一次读时没有完全理解也没关系。我将在未来的章节中频繁地回顾它。\n\
  \n### 4.1 动机\n\n正如我们在上一章中看到的，在几乎不了解底层 Ruby 语言的情况下，也可以开发 Rails 应用的骨架并开始测试它。我们通过依赖教程提供的测试代码并处理每个错误消息，直到测试套件通过来实现的。尽管如此，这种情况不能持续下去，我们将在本章开头增加一个内容，让我们直面\
  \ Ruby 的局限性。\n\n正如第 3.2 节](#part0012.xhtml_ch03) 所示，我们将使用一个分支来保持更改：\n\n```bash\n\
  $ git checkout -b ruby\n```\n\n我们将在第 4.5 节](#part0012.xhtml_ch04lev5) 将更改合并到 `master`。\n\
  \n#### 4.1.1 内置 Helper\n\n当我们上次看到应用时，为了消除视图中的重复，我们在 Listing 3.4 中更新了布局（参见 Listing\
  \ 3.35）。\n\n**Listing 4.1:** 布局。\n`app/views/layouts/application.erb`\n\n***\n\n\
  <!DOCTYPE html>\n<html>\n<head>\n  <title><%= yield(:title) %> | Ruby on Rails Sample\
  \ App</title>\n  <%= csrf_tags %>\n  <%= stylesheet_link_tag 'application', media:\
  \ 'all' %>\n  <%= javascript_include_tag 'application' %>\n</head>\n<body>\n  <%=\
  \ yield %>\n</body>\n</html>\n***\n\n让我们关注 Listing 4.1 中的一行：\n\n```erb\n<%= stylesheet_link_tag\
  \ 'application', media: 'all' %>\n```\n\n此行使用了内置的 Rails 函数 `stylesheet_link_tag`（你可以在\
  \ Rails API 中阅读更多信息），为所有媒体（包括屏幕和打印机）引入 `application.css`。对于经验丰富的 Rails 开发者来说，这一行看起来很简单，但至少包含四个困惑的\
  \ Ruby 概念：内置方法、缺少括号的方法调用、符号和哈希。我们将在本章中涵盖所有这些概念。\n\n\n\n\n\n但如果我们没有提供标题呢？一个良好的习惯是设置一个我们在每个页面都使用的*基础标题*（base\
  \ title），并在想要更具体时为每个页面配上可选的页面标题。通过目前的布局，我们*几乎*实现了这一目标，但存在一个小小的插曲：如你所见，如果你在某个视图中删除了\
  \ `provide` 调用，在缺少页面特定标题的情况下，完整的标题将显示如下：\n\n点击此处查看代码图像\n\n`| Ruby on Rails Tutorial\
  \ Sample App`\n\n换句话说，这里有一个合适的基础标题，但开头处多了一个竖线字符 `|`。\n\n为了解决页面标题缺失的问题，我们将定义一个名为\
  \ `full_title` 的自定义辅助函数。如果没有定义页面标题，`full_title` 辅助函数将返回基础标题“Ruby on Rails Tutorial\
  \ Sample App”；如果定义了页面标题，它会在页面标题前添加一个竖线（见 Listing 4.2）。¹\n\n[1.] 如果一个辅助函数专门针对某个控制器，你应该将其放在对应的辅助函数文件中；例如，Static\
  \ Pages 控制器的辅助函数通常放在 `app/helpers/static_pages_helper.rb` 中。在我们的案例中，我们期望 `full_title`\
  \ 辅助函数被用于网站的所有页面，而 Rails 为这种情况情况提供了一个特殊的辅助函数文件：`app/helpers/application_helper.rb`。\n\
  \n**Listing 4.2：** 定义 `full_title` 辅助函数。\n\n`app/helpers/application_helper.rb`\n\
  \n点击此处查看代码图像\n\n```ruby\nmodule ApplicationHelper\n  # 根据每个页面返回完整标题。\n  def full_title(page_title\
  \ = '')\n    base_title = \"Ruby on Rails Tutorial Sample App\"\n    if page_title.empty?\n\
  \      base_title\n    else\n      page_title + \" | \" + base_title\n    end\n\
  \  end\nend\n```\n\n现在我们已经有了辅助函数，可以通过替换以下内容来简化我们的布局：\n\n点击此处查看代码图像\n\n`<title><%=\
  \ yield(:title) *%> | Ruby on Rails Tutorial Sample App</title>`\n\n为：\n\n点击此处查看代码图像\n\
  \n`<title><%= full_title(yield(:title)) *%></title>`\n\n如 Listing 4.3 所示。\n\n**Listing\
  \ 4.3：** 使用 `full_title` 辅助函数的站点布局**绿色**\n\n`app/views/layouts/application.html.erb`\n\
  \n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title><%= full_title(yield(:title))\
  \ %></title>\n    <%= csrf_meta_tags %>\n    <%= stylesheet_link_tag 'application',\
  \ media: 'all', 'data-turbolinks-track': 'reload' %>\n    <%= javascript_include_tag\
  \ 'application', 'data-turbolinks-track': 'reload' %>\n  </head>\n  <body>\n   \
