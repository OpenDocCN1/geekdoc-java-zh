  `validates :password, length: { minimum: 6 }`\n\n将此与 `presence` 验证（参见第 6.2.2 节以确保密码不为空）相结合，得到了如列表\
  \ 6.42.所示的 User 模型（事实证明 `has_secure_password` 方法包含一个存在性验证，但遗憾的是它只适用于密码为*空*的记录，这允许用户创建如\
  \ `' '` [六个空格]这样的无效密码）。\n\n**列表 6.42：** 安全密码的完整实现。**绿色**\n\n`app/models/user.rb`\n\
  \n点击此处查看代码图片\n\n```ruby\nclass User < ApplicationRecord\n  before_save { self.email\
  \ = email.downcase }\n  validates :name, presence: true, length: { maximum: 50 }\n\
  \  VALID_EMAIL_REGEX = /\\A[\\w+\\-.]+@[a-z\\d\\-.]+\\.[a-z]+\\z/i\n  validates\
  \ :email, presence: true, length: { maximum: 255 },\n                   format:\
  \ { with: VALID_EMAIL_REGEX },\n                   uniqueness: { case_sensitive:\
  \ false }\n  has_secure_password\n  validates :password, presence: true, length:\
  \ { minimum: 6 }\nend\n```\n\n此时，测试应当是**绿色**的：\n\n**列表 6.43：绿色**\n\n```bash\n$ rails\
  \ test:models\n```\n\n### 练习\n\n购买任何 Rails Tutorial 均可在 railstutorial.org/solutions\
