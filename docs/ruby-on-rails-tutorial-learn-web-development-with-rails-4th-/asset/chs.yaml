  \ 使用了什么 SQL？它与 `user.followers.to_a.count` 有何不同？*提示*：假设该用户有一百万关注者。\n\n### 14.2 用于关注用户的用户的\
  \ Web 界面\n\n第 14.1 节 对我们的数据建模技能提出了相当严格的要求，如果花费一些时间来吸收也是正常的。事实上，理解关联的最好方法之一就是在 Web\
  \ 界面中使用它们。\n\n在本章的引言中，我们预览了用户关注的页面流程。在本节中，我们将实现这些原型图中所示的基础界面以及关注/取消关注功能。我们还将创建单独的页面来显示用户关注列表和关注者数组。在第\
  \ 14.3 节 中，我们将通过添加用户状态动态流来完成我们的示例应用。\n\n#### 14.2.1 示例关注数据\n\n与之前的章节一样，我们发现使用 `rails\
  \ db:seed` 为数据库填充示例关系是非常方便的。这将允许我们先设计网页的外观和感受，将后端功能推迟到本节的后部分。\n\n填充关注关系的代码出现在列表\
  \ 14.14 中。在这里，我们任意地安排让第一个用户关注用户 3 到 51，然后让用户 4 到 41 反关该用户。生成的关系将足够开发应用界面。\n\n**列表\
  \ 14.14:** 为示例数据添加关注/关注者关系。\n\n```ruby\ndb/seeds.rb\n```\n\n点击此处查看代码图片\n\n```ruby\n\
  # Users\nUser.create!(name: \"Example User\",\n             email: \"example@railstutorial.org\"\
