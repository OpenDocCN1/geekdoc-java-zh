  \ `RED` 变为 `GREEN`。\n\n### 9.2 “记住我”复选框\n\n有了 Section 9.1.3 中的代码，我们的应用程序拥有了一个完整的专业级验证系统。作为最后一步，我们将学习如何使用“记住我”复选框让保持登录变为可选。带有此类复选框的登录表单原型出现在\
  \ Figure 9.3 中。\n\n编写实现代码，我们首先从 Listing 8.4 的登录表单中添加复选框。与标签、文本字段、密码字段和提交按钮一样，复选框可以使用\
  \ Rails 辅助方法创建。但是为了确保样式正确，我们必须将复选框*嵌套*在标签内部，如下：\n\n点击此处查看代码图片\n\n```erb\n<%= f.label\
  \ :remember_me, class: \"checkbox inline\" do %>\n  <%= f.check_box :remember_me\
  \ %>\n  <span>Remember me on this computer</span>\n<% end %>\n```\n\n![image](img/image01360.jpeg)\n\
  \n**Figure 9.3:** “记住我”复选框的原型。\n\n将此代码放入登录表单中，得到 Listing 9.21 所示的代码。\n\n**Listing\
  \ 9.21:** 在登录表单中添加“记住我”复选框。\n\n`app/views/sessions/new.html.erb`\n\n点击此处查看代码图片\n\
  \n* * *\n\n```erb\n<%= provide(:title, \"Log in\") %>\n<h1>Log in</h1>\n<div class=\"\
  row\">\n  <div class=\"col-md-6 col-md-offset-3\">\n    <%= form_for(:session, url:\
  \ login_path) do |f| %>\n      <%= f.label :email %>\n      <%= f.email_field :email,\
  \ class: 'form-control' %>\n        <%= f.label :password %>\n      <%= f.password_field\
  \ :password, class: 'form-control' %>\n        <%= f.label :remember_me, class:\
  \ \"checkbox inline\" do %>\n          <%= f.check_box :remember_me %>\n       \
  \   <span>Remember me on this computer</span>\n        <% end %>\n      <%= f.submit\
  \ \"Log in\", class: \"btn btn-primary\" %>\n    <% end %>\n    <p>New user? <%=\
  \ link_to \"Sign up now!\", signup_path %></p>\n  </div>\n</div>\n```\n\n* * *\n\
  \n在 Listing 9.21 中，我们包含了 CSS 类 `checkbox` 和 `inline`，Bootstrap 使用这些类将复选框和文本（“Remember\
