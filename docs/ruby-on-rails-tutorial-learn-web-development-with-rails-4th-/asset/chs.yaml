  \n#### 8.1.2 登录表单\n\n定义了相关的控制器和路由后，现在我们将填写新会话的视图，即登录表单。对比图 8.1 和图 7.1，我们看到登录表单的外观与注册表单相似，只是只有两个字段（邮箱和密码）而不是四个个。\n\
  \n如图 8.2 所示，当登录信息无效时，我们希望重新渲染登录页面并显示错误消息。在节 7.3.3 中，我们使用了 `error-messages` 模板来显示错误消息，但我们在该节看到这些消息是由\
  \ Active Record 自动提供的。这对于会话创建将无效，因为会话不是 Active Record 对象，因此我们将错误作为 flash 消息渲染。\n\
  \n![image](img/image01345.jpeg)\n\n**图 8.2：** 登录失败的原型。\n\n回想列表 7.15，注册表单使用了 `form_for`\
  \ 助手，并将用户实例 `@user` 作为参数：\n\n```ruby\n<%= form_for(@user) do |f|\n```\n\n会话表单与注册表单的主要区别在于我们没有\
  \ Session 模型，因此没有对应的 `@user` 变量副本。这意味着在构建会话表单时，我们必须给 `form_for` 提供更多信息；特别是，`form_for(@user)`\
  \ 允许 Rails 推断表单的 `action` 应该是 POST 到 URL `/users`，而在会话的情况下，我们需要指定资源的*名称*以及相应的 URL：`/`。\n\
  \n第二个选项是使用 `form_tag` 替 `form_for`，这可能更符合 Rails 惯用法，但它与注册表单的共同点较少，在现阶段我想强调并行的结构。\n\
  \n```ruby\nform_for(:session, url: login_path)\n```\n\n有了正确的 `form_for`，很容易以注册表单（列表\
  \ 7.15）为模型，创建一个与图 8.1 中的原型匹配的登录表单，如列表 8.4 所示。\n\n**列表 8.4：** 登录表单代码。\n\n```erb\n\
