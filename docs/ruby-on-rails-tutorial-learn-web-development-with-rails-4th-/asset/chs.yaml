  \ returns nil when remember digest is wrong\" do\n  @user.update_attribute(:remember_digest,\
  \ User.digest(User.new_token))\n  assert_nil current_user\nend\nend\n```\n\n注意我们添加了第二个测试，它检查如果用户的记忆哈希值（remember\
  \ digest）与记忆令牌（remember token）不匹配，当前用户是否为 `nil`，从而测试了嵌套 `if` 语句中的 `authenticated?`\
  \ 表达式：\n\n点击此处查看代码图片\n\n```ruby\nif user && user.authenticated?(cookies[:remember_token])\n\
  ```\n\n顺带一提，在列表 9.31 中我们可以写\n\n点击此处查看代码图片\n\n```ruby\nassert_equal current_user,\
  \ @user\n```\n\n而是使用这种写法，效果是一样的，但（正如第 5.3.4 节中简要提到的），`assert_equal` 参数的常规顺序是 `expected`、`actual`：\n\
  \n点击此处查看代码图片\n\n```ruby\nassert_equal <expected>, <actual>\n```\n\n在列表 9.31 的情况下，这会得到\n\
  \n点击此处查看代码图片\n\n```ruby\nassert_equal @user, current_user\n```\n\n按照列表 9.31 中的代码，测试按要求显示为**红色（RED）**：\n\
  \n**列表 9.32：RED**\n\n点击此处查看代码图片\n\n***\n\n```\n$ rails test test/helpers/sessions_helper_test.rb\n\
  ```\n\n***\n\n我们可以通过移除 `raise` 并恢复原始的 `current_user` 方法来让列表 9.31 中的测试通过，如列表 9.33\
  \ 所示。\n\n**列表 9.33：**移除抛出的异常。**绿色（GREEN）**\n\napp/helpers/sessions_helper.rb\n\n\
  点击此处查看代码图片\n\n***\n\n```ruby\nmodule SessionsHelper\n  # 返回与记忆令牌 cookie 对应的用户。\n\
  \  def current_user\n    if (user_id = session[:user_id])\n      @current_user ||=\
  \ User.find_by(id: user_id)\n    elsif (user_id = cookies.signed[:user_id])\n  \
  \    user = User.find_by(id: user_id)\n      if user && user.authenticated?(cookies[:remember_token])\n\
  \        log_in user\n        @current_user = user\n      end\n    end\n  end\n\
  end\n```\n\n***\n\n此时，测试套件应该是**绿色（GREEN）**的：\n\n**列表 9.34：GREEN**\n\n***\n\n```\n\
  $ rails test\n```\n\n***\n\n既然 `current_user` 的“记忆”分支已经过测试，我们就可以放心地捕捉回归问题，而无需手动检查。\n\
