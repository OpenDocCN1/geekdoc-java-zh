  \ `params[:id]` 中的重置令牌通过了身份验证（使用在列表 11.26 中定义的通用 `authenticated?` 方法）。因为 `edit`\
  \ 和 `update` 操作都需要一个有效的 `@user`，我们将查找并验证它的代码放在两个 `before filters`（之前过滤器）中，如列表 12.15\
  \ 所示。\n\n**列表 12.15：** 重置密码的 `edit` 操作。\n\napp/controllers/password_resets_controller.rb\n\
  \n点击此处查看代码图片\n\n***\n\n```ruby\nclass PasswordResetsController < ApplicationController\n\
  \  before_action :get_user, only: [:edit, :update]\n  before_action :valid_user,\
  \ only: [:edit, :update]\n\n  def edit\n  end\n\n  private\n    def get_user\n \
  \     @user = User.find_by(email: params[:email])\n    end\n\n    # 确认有效用户。\n  \
  \  def valid_user\n      unless ( @user && @user.activated? &&\n              @user.authenticated?(\
  \ :reset, params[ :id]))\n        redirect_to root_url\n      end\n    end\nend\n\
  ```\n\n***\n\n在列表 12.15 中，比较以下用法：\n\n```ruby\nauthenticated?(:reset, params[:id])\n\
