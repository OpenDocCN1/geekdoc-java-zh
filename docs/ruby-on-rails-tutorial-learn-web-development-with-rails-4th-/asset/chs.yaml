  \ 修改内置类\n\n虽然继承是一个强大的概念，但在回文的情况下，更自然的方法可能是将 `palindrome?` 方法添加到 `String` 类本身中，这样（除其他因素外）我们就可以字符串字面量上调用\
  \ `palindrome?`，而我们目前无法做到：\n\n点击此处查看代码图片\n\n```ruby\n>> \"level\".palindrome?\n\
  NoMethodError: undefined method `palindrome?' for \"level\":String\n```\n\n令人惊讶的是，Ruby\
  \ 允许你正这样做；Ruby 类可以被*打开*并修改，从而允许像我们这样的普通凡人向它们添加方法：\n\n点击此处查看代码图片\n\n```ruby\n>> class\
  \ String\n>>   # 如果字符串是其自身的反转，则返回 true。\n>>   def palindrome?\n>>     self == self.reverse\n\
  >>   end\n>> end\n=> nil\n\n>> \"deified\".palindrome?\n=> true\n```\n\n（我不知道哪一个更酷：是\
  \ Ruby 允许你向内置类添加方法，还是 `\"deified\"` 本身是一个回文。）\n\n修改内置类是一项强大的技术，但力量伴随着巨大的责任，在没有*真正*充分理由的情况下向内置类添加方法被认为是不合体面的。Rails\
  \ 确实有一些很好的理由；例如，在 Web 应用程序中，我们经常希望防止变量为*空白*（blank）——例如，用户的用户名不能只是空格或其他空白字符——因此 Rails\
  \ 为 Ruby 添加了 `blank?` 方法。由于 Rails 控制台会自动包含 Rails 扩展，我们可以在这里看到一个示例（这在原始的 `irb` 中不起作用）：\n\
  \n点击此处查看代码图片\n\n```ruby\n>> \"\".blank?\n=> true\n\n>> \"      \".empty?\n=> false\n\
  \n>> \"      \".blank?\n=> true\n\n>> nil.blank?\n=> true\n```\n\n我们看到全空格字符串并不是*空*（empty），但它是*空白*（blank）。注意\
  \ `nil` 也是空白的；由于 `nil` 不是字符串，这提示 Rails 实际上将 `blank?` 添加到了 `String` 的基类（正如我们在本节开头看到的，该基类本身就是\
  \ `Object`）。我们将在第 9.1 节中看到其他 Rails 类 Ruby 类的示例。\n\n##### 练习\n\n购买任何 Rails Tutorial\
