  \ 的 `div`，其包含文本“The form contains 4 errors.”。\n\n### 10.1.4  成功的编辑（使用 TDD）\n\n现在是时候让编辑表单工作了。编辑个人资料图片已经是可用的，因为我们已经将图像上传外包给了\
  \ Gravatar 网站；我们可以通过点击图 10.2 中的“change”链接来编辑 Gravatars，如图 10.4 所示。让我们让剩下的用户编辑功能也运行起来。\n\
  \n![image](img/image01919.jpeg)\n\n**图 10.4：** Gravatar 图像裁剪界面，有一个某个男士的照片。\n\n随着你对测试越来越熟悉，你可能会发现，编写应用程序代码之前编写集成测试比在之后编写更有用。在这种情况下，此类测试有时被称为*验收测试*，因为它们决定了特定功能何时可以被接受为完成。为了查看它是如何工作的，我们将使用测试驱动开发（TDD）来完成用户编辑功能。\n\
  \n我们将编写一个类似于列表 10.9 所示的测试来测试更新用户的正确行为，只是这次我们将提交有效信息。然后我们将检查非空闪存消息（flash message）以及成功重定向到个人资料页面，同时验证用户信息在数据库中已正确更改。结果出现在列表\
  \ 10.11 中。注意，列表 10.11 中的密码和确认是空的，这对于不想在每次更新姓名或电子邮件地址时更新密码的用户来说非常方便。注意使用 `@user.reload`（首次在节\
  \ 6.1.5 中出现）来从数据库重新加载用户的值并确认它们已成功更新。（这是你最初可能很容易忘记的细节，这就是为什么验收测试[以及一般的 TDD]需要一定的经验才能有效的原因。）\n\
  \n**列表 10.11：** 成功的编辑测试。**RED**\n\n```ruby\ntest/integration/users_edit_test.rb\n\
  \n点击此处查看代码图像\n```\n\n* * *\n\n```ruby\nrequire 'test_helper'\n\nclass UsersEditTest\
