  \ Web 应用程序（Twitter）。”\n\n——Mattan Griffel，One Month 创始人\n\n“虽然我职业上是一名 Python/Django\
  \ 开发者，但我无法强调这本书对我有多有多大的帮助。作为一个完全脱离工业的本科生，这本书教会了我如何使用版本控制、如何编写测试，最重要的是，坚持的成果是非常令人满足的。它让我重新爱上了技术。这是我向想要开始学习/构建的朋友推荐的书。感谢你，Michael！”\n\
  \n——Prakhar Srivastav，软件工程师，科威特 cite.com\n\n“无论你认为未来将开发什么，或者当前流行的框架是什么；如果你想学习如何构建东西，没有比这本教程更好的起点了。对于所有那些希望看到自己的想法实现的‘非技术性’人士，如果你正在考虑请外包、付费课程或为了寻找技术合伙人而进行‘创始人相亲’：请停下。退后一步。暂时忘记你的想法，沉浸在这本教程中，学习构建一个东西需要什么。你和你的软件项目将从中受益。”——Vincent\
