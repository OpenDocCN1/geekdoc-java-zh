  ### 练习 (Exercises)\n\n练习答案可以在 [rubutorial.org](https://rubutorial.org/) 免费获取。\n\n\
  1. 如果现在尝试注册新用户，你应该能看到如图 11.4 所示的重定向，并且应该生成一封如列表 11.25 所示的电子邮件。请注意，在开发环境中你*不会*收到真实的邮件，但它会显示在你的服务器日志中。（你可能需要向上滚动才能看到它。）\n\
  2. 尝试使用无效的注册注册，观察控制台显示了什么。\n\n\n\n```\n>> user.send(:activation_digest)\n```\n```\n\
  => \"$2a$10$4e6TFzEJAVNyjLv8Q5u22ensMt28qEkx0roaZvtRcp6UZKRM6N9Ae\"\n```\n```\n\
  >> user.send(\"activation_digest\")\n```\n```\n=> \"$2a$10$4e6TFzEJAVNyjLv8Q5u22ensMt28qEkx0roaZvtRcp6UZKRM6N9Ae\"\
  \n```\n```\n>> attribute = :activation\n```\n```\n>> user.send(\"#{attribute}_digest\"\
  )\n```\n```\n=> \"$2a$10$4e6TFzEJAVNyjLv8Q5u22ensMt28qEkx0roaZvtRcp6UZKRM6N9Ae\"\
  \n```\n\n注意最后一个示例中，我们定义了一个等于符号 `:activation` 的 `attribute` 变量，并使用字符串插值来构建 `send`\
  \ 的正确参数。这对于字符串 `'activation'` 同样有效，但使用符号更符合习惯，而且无论哪种情况\n\n\"#{attribute}_digest\"\
  \n\n在字符串被插值后都会变成\n\n\"activation_digest\"\n\n（我们在第 7.4.2 节 中见过符号是如何插值为字符串的。）\n\n\
  基于对 `send` 的这些讨论，我们可以如下重写当前的 `authenticated?` 方法：\n\n点击此处查看代码图片\n\n```ruby\ndef\
  \ authenticated?(remember_token)\n  digest = self.send(\"remember_digest\")\n  return\
  \ false if digest.nil?\n  BCrypt::Password.new(digest).is_password?(remember_token)\n\
  end\n```\n\n有了这个模板，我们可以通过添加一个名为 digest 的函数参数来泛化该方法，然后像上面一样使用字符串插值：\n\n点击此处查看代码图片\n\
  \n```ruby\ndef authenticated?(attribute, token)\n  digest = self.send(\"#{attribute}_digest\"\
  )\n  return false if digest.nil?\n  BCrypt::Password.new(digest).is_password?(token)\n\
  end\n```\n\n（这里我们将第二个参数 `token` 重命名，以强调它现在是通用的。）由于我们处于用户模型内部，也可以省略 `self`，从而得到最符合语言习惯的版本：\n\
  \n点击此处查看代码图片\n\n```ruby\ndef authenticated?(attribute, token)\n  digest = send(\"\
  #{attribute}_digest\")\n  return false if digest.nil?\n  BCrypt::Password.new(digest).is_password?(token)\n\
  end\n```\n\n我们现在可以通过像这样调用它来重现 `authenticated?` 之前的行为：\n\n点击此处查看代码图片\n\n```ruby\n\
  user.authenticated?(:remember, remember_token)\n```\n\n将此讨论应用于 User 模型，可以得到列表 11.26\
  \ 所示的泛化 `authenticated?` 方法。\n\n**列表 11.26：** 一个泛化的 `authenticated?` 方法。**RED**\n\
  \napp/models/user.rb\n\n点击此处查看代码图片\n\n* * *\n\n```ruby\nclass User < ApplicationRecord\n\
  \  .\n  .\n  .\n  # 如果给定的 token 匹配 digest，则返回 true\n  def authenticated?(attribute,\
  \ token)\n    digest = send(\"#{attribute}_digest\")\n    return false if digest.nil?\n\
  \    BCrypt::Password.new(digest).is_password?(token)\n  end\n\n  .\n  .\n  .\n\
  end\n```\n\n* * *\n\n列表 11.26 的标题指示了一个 **RED** 测试套件：\n\n**列表 11.27:RED**\n\n* *\
  \ *\n\n```bash\n$ rails test\n```\n\n* * *\n\n失败的原因是 `current_user` 方法（列表 9.9）和对\
  \ `nil` digest 的测试（列表 9.17）都使用了旧版本的 `authenticated?`，该版本期望一个参数而不是两个。为了修复这个问题，我们只需更新这两个用例以使用泛化方法，如列表\
  \ 11.28 和列表 11.29 所示。\n\n**列表 11.28：** 在 `current_user` 中使用泛化的 `authenticated?`\
  \ 方法。**RED**\n\napp/helpers/sessions_helper.rb\n\n点击此处查看代码图片\n\n* * *\n\n```ruby\n\
  module SessionsHelper\n  .\n  .\n  .\n  # 返回当前登录的用户（如果有的话）\n  def current_user\n\
  \    if (user_id = session[:user_id])\n      @current_user ||= User.find_by(id:\
  \ user_id)\n    elsif (user_id = cookies.signed[:user_id])\n      user = User.find_by(id:\
  \ user_id)\n      if user && user.authenticated?(:remember, cookies[:remember_token])\n\
  \        @current_user = user\n      end\n    end\n  end\n```\n\n\n\n```ruby\nif\
  \ user && !user.activated? && user.authenticated?(:activation, params[:id])\n  user.update_attribute(:activated,\
  \ true)\n  user.update_attribute(:activated_at, Time.zone.now)\n  log_in user\n\
  \  flash[:success] = \"Account activated!\"\n  redirect_to user\nelse\n  flash[:danger]\
  \ = \"Invalid activation link\"\n  redirect_to root_url\nend\nend\n```\n\n通过列表 11.31\
  \ 中的代码，你现在应该能够粘贴列表 11.25 中的 URL 来激活相关用户。例如，在我的系统上，我访问了 URL\n\n点击此处查看代码图片\n\n**http://rails-tutorial-mhartl.c9users.io/account_activations/FFb_F94mgQtmlSvRFGsITw/edit?email=michael%40michaelhartl.com**\n\
  \n并得到了图 11.5 所示的结果。\n\n当然，目前用户激活实际上并没有*执行*任何操作，因为我们还没有改变用户登录的方式。为了让账户激活具有实际意义，我们需要允许用户仅在已激活的情况下登录。如列表\
  \ 11.32 所示，此的方法是：如果 `user.activated?` 为真，则像往常一样登录；否则，我们将带有 `warning` 消息重定向到根 URL（图\
  \ 11.6）。\n\n![image](img/image0194.jpeg)\n\n**图 11.5：**激活成功后的资料页。\n\n![image](img/image01356.jpeg)\n\
  \n**图 11.6:** 尚未激活用户的警告消息。\n\n**列表 11.32：**防止未激活的用户登录。\n\n`app/controllers/sessions_controller.rb`\n\
  \n点击此处查看代码图片\n\n```ruby\nclass SessionsController < ApplicationController\n  def\
  \ new\n  end\n\n  def create\n    user = User.find_by(email: params[:session][:email].downcase)\n\
  \    if user && user.authenticate(params[:session][:password])\n      if user.activated?\n\
  \        log_in user\n        params[:session][:remember_me] == '1' ? remember(user)\
  \ : forget(user)\n        redirect_back_or user\n      else\n        message = \"\
  Account not activated. \"\n        message += \"Check your email for the activation\
  \ link.\"\n        flash[:warning] = message\n        redirect_to root_url\n   \
  \   end\n    else\n      flash.now[:danger] = 'Invalid email/password combination'\n\
  \      render 'new'\n    end\n  end\n\n  def destroy\n    log_out if logged_in?\n\
  \    redirect_to root_url\n  end\nend\n```\n\n到此，除了一个精细改进外，用户激活的基本功能已经完成。（该精细改进是防止显示未激活的用户，这被留作一项练习[第\
  \ 11.3.3 节]）。在第 11.3.3 节中，我们将通过添加一些测试和进行一些重构来完成该过程。\n\n### 练习\n\n购买任何 Rails Tutorial\
