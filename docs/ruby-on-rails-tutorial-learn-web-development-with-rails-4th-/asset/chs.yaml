  \n#### 12.1.3 密码重置 create Action\n\n在提交 图 12.6 中的表单后，我们需要通过电子邮件地址查找用户，并用密码重置令牌和发送时间戳更新其属性。然后，我们将带有提示信息的\
  \ flash 消息重定向到根 URL。与登录 (Listing 8.11) 一样，在提交无效的情况下，我们使用 `flash.now` 消息重新渲染 `new`\
  \ 页面。结果显示在 Listing 12.5 中。\n\n**Listing 12.5:** 用于密码重置的 `create` action。\n\napp/controllers/password_resets_controller.rb\n\
  \n点击此处查看代码\n\n* * *\n\n```ruby\nclass PasswordResetsController < ApplicationController\n\
  \  def new\n  end\n\n  def create\n    @user = User.find_by(email: params[:password_reset][:email].downcase)\n\
  \    if @user\n      @user.create_reset_digest\n      @user.send_password_reset_email\n\
  \      flash[:info] = \"Email sent with password reset instructions\"\n      redirect_to\
  \ root_url\n    else\n      flash.now[:danger] = \"Email address not found\"\n \
  \     render 'new'\n    end\n  end\n\n  def edit\n  end\nend\n```\n\n* * *\n\nUser\
  \ 模型中的代码与 `before_create` 回调中使用的 `create_activation_digest` 方法 (Listing 11.3) 平，如\
  \ Listing 12.6 所示。\n\n**Listing 12.6:** 在 User 模型中添加密码重置方法。\n\napp/models/user.rb\n\
  \n点击此处查看代码\n\n* * *\n\n```ruby\nclass User < ApplicationRecord\n  attr_accessor\
  \ :remember_token, :activation_token, :reset_token\n  before_save :downcase_email\n\
  \  before_create :create_activation_digest\n\n  # 激活账户。\n  def activate\n    update_attribute(:activated,\
  \ true)\n    update_attribute(:activated_at, Time.zone.now)\n  end\n\n  # 发送激活邮件。\n\
  \  def send_activation_email\n    UserMailer.account_activation(self).deliver_now\n\
  \  end\n\n  # 设置密码重置属性。\n  def create_reset_digest\n    self.reset_token = User.new_token\n\
  \    update_attribute(:reset_digest, User.digest(reset_token))\n    update_attribute(:reset_sent_at,\
  \ Time.zone.now)\n  end\n\n  # 发送密码重置邮件。\n  def send_password_reset_email\n    UserMailer.password_reset(self).deliver_now\n\
  \  end\n\n  private\n\n  # 将电子邮件转换为小写。\n  def downcase_email\n    self.email = email.downcase\n\
  \  end\n\n  # 创建激活令牌和摘要。\n  def create_activation_digest\n    self.activation_token\
  \ = User.new_token\n    self.activation_digest = User.digest(activation_token)\n\
  \  end\nend\n```\n\n* * *\n\n如 图 12.7 所示，在此时应用程序对于无效电子邮件的行为已经可以工作。为了在提交有效电子邮件时让应用程序运行，我们需要定义一个密码重置\
