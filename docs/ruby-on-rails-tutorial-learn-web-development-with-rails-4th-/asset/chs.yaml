  \n#### 测试与重构\n\n在本节中，我们将为账户激活添加一个集成测试。由于我们已经有了使用有效信息注册的测试，我们将添加在第 7.4.4 节中开发的步骤。这里有几个步骤，但它们大多非常直观；看看你是否能跟随列表\
  \ 11.3 进行操作。列表 11.3 中的高亮部分表示特别重要或容易遗掉的行，但也有其他行，请务必添加它们。\n\n**列表 11.3：**在用户测试中添加账户激活。`test/integration/users_signup_test.rb`\n\
  \n点击此处查看代码图片\n\n```ruby\nrequire 'test_helper'\n\nclass UsersSignupTest < ActionDispatch::IntegrationTest\n\
  \  def setup\n    ActionMailer::Base.deliveries.clear\n  end\n\n  test \"invalid\
  \ signup information\" do\n    get signup_path\n    assert_no_difference 'User.count\
  \ do\n      post users_path, params: { user: { name: \"\", email: \"invalid\" }\
  \ }\n    end\n    assert_template 'new'\n    assert_select 'div#error_explanation'\n\
  \  end\n\n  test \"valid signup information with account activation\" do\n    get\
  \ signup_path\n    assert_difference 'User.count', 1 do\n      post users_path,\
  \ params: { user: { name: \"Example User\", email: \"user@example.com\", password:\
  \ \"password\", password_confirmation: \"password\" } }\n    end\n    assert_equal\
  \ 1, ActionMailer::Base.deliveries.size\n    user = assigns(:user)\n    assert_not\
  \ user.activated?\n\n    # 在激活前尝试登录\n    log_in user\n    assert_not logged_in?\n\
  \n    # 无效的激活令牌\n    get edit_activation_path(\"invalid token\", email: user.email)\n\
  \    assert_not logged_in?\n\n    # 有效令牌，错误的邮箱\n    get edit_activation_path(user.activation_token,\
  \ email: 'wrong')\n    assert_not logged_in?\n\n    # 有效激活\n    get edit_activation_path(user.activation_token,\
  \ email: user.email)\n    assert user.reload.activated?\n    follow_redirect!\n\
  \    assert_template 'users/show'\n    assert logged_in?\n  end\nend\n```\n\n列表\
  \ 11.3 中有很多代码，但唯一的新代码位于该行\n\n点击此处查看代码图片\n\n`assert_equal 1, ActionMailer::Base.deliveries.size`\n\
  \n这段代码验证了送递了 1 条消息。由于 `deliveries` 数组是全局的，我们必须在 `setup` 方法中重置它，以防止其他测试发送邮件时导致代码崩溃（在第\
  \ 12 章中将是如此）。列表 11.3 还首次使用了 `assigns` 方法，正如在第 9 章的一项练习（第 9.3.1 节）所示，`assigns`允许我们访问相应操作中的实例变量。例如，Users\
  \ 控制器的 `create` 操作定义了一个 `@user` 变量（列表 11.23），因此我们可以在测试中使用 `assigns(:user)` 访问它。\n\
  \n\n\n\n通过 Listing 11.33 中的测试，我们准备好进行一些重构了，将部分用户操作逻辑从控制器移动到模型中。具体来说，我们将创建一个 `activate`\
  \ 方法来更新用户的激活属性，并创建一个 `send_activation_email` 方法来发送激活邮件。这些额外的方法出现在 Listing 11.35\
  \ 中，重构后的应用程序代码出现在 Listing 11.36 和 Listing 11.37 中。\n\n**Listing 11.35：** 为 User\
  \ 模型添加用户激活方法。\n\n`app/models/user.rb`\n\n点击此处查看代码图像\n\n```ruby\nclass User < ApplicationRecord\n\
  \  .\n  .\n  .\n\n  # 激活账户。\n  def activate\n    update_attribute(:activated, true)\n\
  \    update_attribute(:activated_at, Time.zone.now)\n  end\n\n  # 发送激活邮件。\n  def\
  \ send_activation_email\n    UserMailer.account_activation(self).deliver_now\n \
  \ end\n\n  private\n    .\n    .\n    .\nend\n```\n\n**Listing 11.36：** 通过用户模型对象发送邮件。\n\
  \n`app/controllers/users_controller.rb`\n\n点击此处查看代码图像\n\n```ruby\nclass UsersController\
  \ < ApplicationController\n  .\n  .\n  .\n\n  def create\n    @user = User.new(user_params)\n\
  \    if @user.save\n      @user.send_activation_email\n      flash[:info] = \"Please\
  \ check your email to activate your account.\"\n      redirect_to root_url\n   \
  \ else\n      render 'new'\n    end\n  end\n\n  .\n  .\n  .\nend\n```\n\n**Listing\
  \ 11.37：** 通过用户模型对象激活账户激活。\n\n`app/controllers/account_activations_controller.rb`\n\
  \n点击此处查看代码图像\n\n```ruby\nclass AccountActivationsController < ApplicationController\n\
  \  def edit\n    user = User.find_by(email: params[:email])\n    if user && !user.activated?\
  \ && user.authenticated?(:activation, params[:id])\n      user.activate\n      log_in\
  \ user\n      flash[:success] = \"Account activated!\"\n      redirect_to user\n\
  \    else\n      flash[:danger] = \"Invalid activation link\"\n      redirect_to\
  \ root_url\n    end\n  end\nend\n```\n\n注意，Listing 11.35 消除了对 `user.` 的使用，这在 User\
  \ 模型内部会报错，因为没有这样一个变量：\n\n点击此处查看代码图像\n\n```diff\n-user.update_attribute(:activated,\
  \ true)\n-user.update_attribute(:activated_at, Time.zone.now)\n+update_attribute(:activated,\
  \ true)\n+update_attribute(:activated_at, Time.zone.now)\n```\n\n（我们可以从 `user` 切换到\
  \ `self`，但请记得 Section 6.2.5，在模型内部 `self` 是可选的。）它还在调用邮件发送器时将 `@user` 更改为 `self`：\n\
  \n点击此处查看代码图像\n\n```diff\n-UserMailer.account_activation(@user).deliver_now\n+UserMailer.account_activation(self).deliver_now\n\
  ```\n\n这些正是在简单重构过程中容易忽略的细节，但良好的测试套件可以捕获它们。说起这个，测试套件仍然应该是 `GREEN`：\n\nListing 11.38:\
  \ GREEN\n\n```bash\nrails test\n```\n\n##### 练习题\n\n购买任何教程后均可以在 railstutorial.org\
  \ 免费获取解决方案。要查看他人的答案并记录自己的答案，请加入 learnenough.com/society 的 Learn Society。\n\n1. 在\
  \ Listing 11.35 中，`activate` 方法对 `update_attribute` 调用了两次，每次调用都需要独立的数据库事务。通过填充 Listing\
  \ 11.39 中的模板，将两个 `update_attribute` 调用替换为单个 `update_columns` 调用，这将只需访问一次数据库。更改后，验证测试套件仍然是\
  \ `GREEN`。\n\n2. 现在所有用户都显示在 `/users` 用户页面上，并通过 URL `/users/:id` 可见，但仅在用户激活后才显示是有意义的。通过填充\
  \ Listing 11.40 中的模板来实现这种行为。这使用了 Active Record 的 `where` 方法，我们将在 Section 13.3.3\
  \ 中详细学习。注意，Listing 11.40 使用 `and` 代替 `&&`。两者几乎相同，但后者的优先级更高，在这种情况下它与 `root_url` 绑定得太紧了。我们可以通过给\
  \ `root_url` 加上括号来解决这个问题，但更符合习惯的方法是使用 `and`。\n\n3. 为了测试上一个练习中的代码，请为 `/users` 和 `/users/:id`\
  \ 编写集成测试。\n\n**Listing 11.39：** 使用 `update_columns` 的模板。\n\n`app/models/user.rb`\n\
  \n点击此处查看代码图像\n\n```ruby\nclass User < ApplicationRecord\n  attr_accessor :remember_token,\
  \ :activation_token\n  before_save :downcase_email\n  before_create :create_activation_digest\n\
  \  .\n  .\n  .\n\n  # 激活账户。\n  def activate\n    update_columns(activated: FILL_IN,\
  \ activated_at: FILL_IN)\n  end\n\n  # 发送激活邮件。\n  def send_activation_email\n  \
  \  UserMailer.account_activation(self).deliver_now\n  end\n\n  private\n    # 将邮箱转换为全小写。\n\
  \    def downcase_email\n      self.email = email.downcase\n    end\n\n    # 创建并分配激活令牌和散列。\n\
  \    def create_activation_digest\n      self.activation_token = User.new_token\n\
  \      self.activation_digest = User.digest(activation_token)\n    end\nend\n```\n\
  \n**Listing 11.40：** 仅显示激活用户的代码模板。\n\n`app/controllers/users_controller.rb`\n\n\
  点击此处查看代码图像\n\n```ruby\nclass UsersController < ApplicationController\n  .\n  .\n\
  \  .\n\n  def index\n    @users = User.where(activated: FILL_IN).paginate(page:\
  \ params[:page])\n  end\n\n  def show\n    @user = User.find(params[:id])\n    redirect_to\
  \ root_url and return unless FILL_IN\n  end\n\n  .\n  .\n  .\nend\n```\n\n### 11.4\
  \ 生产环境中的邮件\n\n现在我们已经在开发环境中实现了账户激活，在本节中，我们将配置应用程序，使其能够在生产环境中实际发送邮件。我们首先设置一个免费的邮件发送服务，然后配置并部署我们的应用程序。\n\
  \n要在生产环境中发送邮件，我们将使用 SendGrid，对于经过验证的账户，它可以作为 Heroku 的附加组件可用。（这需要向您的 Heroku 账户添加信用卡信息，但验证账户时不收费。）对于我们的目的来说，“starter”级（截至本文编写时限制每天\
  \ 400 封邮件，但免费）是最合适的。我们可以按照以下方式将其添加到应用程序中：\n\n```bash\n$ heroku addons:create sendgrid:starter\n\
  ```\n\n（这在具有旧版本 Heroku 命令行界系统上可能会失败。在这种情况下，请升级到最新的 Heroku toolbelt 或尝试旧的语法 `heroku\
  \ addons:add sendgrid:starter`。）\n\n为了配置应用程序使用 SendGrid，我们需要为生产环境填写 SMTP 设置。如 Listing\
  \ 11.41 所示，您还必须定义一个带有生产网站地址的 `host` 变量。\n\n\n\n\n\n`config/environments/production.rb`\n\
  \n点击此处查看代码图片\n\n***\n\n```ruby\nRails.application.configure do\n  .\n  .\n  .\n\
  \  config.action_mailer.raise_delivery_errors = true\n  config.action_mailer.delivery_method\
  \ = :smtp\n  host = '<your heroku app>.herokuapp.com'\n  config.action_mailer.default_url_options\
  \ = { host: host }\n  ActionMailer::Base.smtp_settings = {\n    address        \
  \     => 'smtp.sendgrid.net',\n    port                 => '587',\n    authentication\
  \       => :plain,\n    user_name            => ENV['SENDGRID_USERNAME'],\n    password\
  \             => ENV['SENDGRID_PASSWORD'],\n    domain              => 'heroku.com',\n\
  \    enable_starttls_auto => true\n  }\n  .\n  .\n  .\nend\n```\n\n***\n\nListing\
  \ 11.41 中的邮件配置包含了 SendGrid 账户的 `user_name` 和 `password`，但请注意它们是通过 `ENV` 环境变量访问的，而不是硬编码的。这是生产应用程序的最佳实践，因为出于安全考虑，绝不应在源代码中暴露原始密码等敏感信息。在当前案例中，这些变量是通过\
  \ SendGrid 载入自动配置的，但我们将在 第 13.4.4 节 中看到一个示例，那里我们将必须自己定义它们。如果你感兴趣，可以如下所示查看 Listing\
  \ 11.41 中使用的环境变量：\n\n点击此处查看代码图片\n\n```\n$ heroku config:get SENDGRID_USERNAME\n\
  $ heroku config:get SENDGRID_PASSWORD\n```\n\n此时，你应该将主题分支合并到 master 分支：\n\n点击此处查看代码图片\n\
