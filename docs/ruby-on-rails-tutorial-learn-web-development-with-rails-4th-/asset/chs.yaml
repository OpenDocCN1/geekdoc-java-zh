  \ test/integration/users_login_test.rb\n```\n\n### 练习\n\n练习答案免费提供 railutorial.org。要查看他答案并记录自己的答案，请加入\
  \ Society。\n\n1. 在浏览器中验证节 8.1 中的序列是否正确，即点击页面时 flash 消息是否消失。\n\n### 8.2 登录\n\n现在我们的登录表单可以处理无效提交，下一步是通过实际登录用户来处理有效提交。在本节中，我们将使用关闭浏览器后过期的临时会进行登录。在节\
  \ 9.1 中，我们将添加即使关闭浏览器后仍持续的会。\n\n实现会 涉及跨控制器和视图定义大量函数。你可能记得在节 4.2.5 中，Ruby 提供了*模块*机制来封装此类函数。方便的是，在生成\
  \ Sessions 控制器时自动生成了 Sessions 助手（节 8.1.1）。此外，此类助手会自动包含在视图中；通过将模块包含在所有控制器的基类（Application\
  \ 控制器）中，我们安排在控制器中使用它们（列表 8.13）。\n\n#### 8.2.1 log_in 方法\n\n借助 Rails 定义的 `session`\
  \ 方法登录用户非常简单。（该方法与节 8.1.1 中生成的 Sessions 控制器是完全不同的。）我们可以像对待 `session` 为哈哈希一样对其进行赋值：\n\
  \n```ruby\nsession[:user_id] = user.id\n```\n\n\n\n这会在用户的浏览器上放置一个临时 cookie，其中包含用户\
  \ id 的加密版本，这允许我们能够在随后的页面中通过 `session[:user_id]` 获取该 id。与 `cookies` 方法创建的持久性 cookie（第\
  \ 9.1 节）不同，通过 `session` 方法创建的临时 cookie 在浏览器关闭时会立即过期。\n\n由于我们要在几个不同的地方使用相同的登录技术，我们将在\
  \ `Sessions` 辅助函数中定义一个名为 `log_in` 的方法，如 列表 8.14 所示。\n\n**列表 8.14：** `log_in` 函数。\n\
  \n```ruby\napp/helpers/sessions_helper.rb\n```\n\n点击此处查看代码图片\n\n```ruby\nmodule\
  \ SessionsHelper\n  # 登录指定的用户。\n  def log_in(user)\n    session[:user_id] = user.id\n\
  \  end\nend\n```\n\n由于使用 `session` 方法创建的临时 cookie 会自动加密，因此列表 8.14 中的代码是安全的，攻击者无法利用\
  \ session 信息登录该用户。不过，这仅适用于通过 `session` 方法启动的临时话，对于使用 `cookies` 方法创建的持久会话则并非如此。永久\
  \ cookie 容易受到*会话劫持*攻击，因此在第 9 章中，我们必须对放置在用户浏览器上的信息更加小心。\n\n在列表 8.14 中定义了 `log_in`\
  \ 方法后，我们现在准备好登录用户并重定向到用户的资料页来完成会话 `create` 动作。结果出现在列表 8.15 中。⁴\n\n4. 由于在列表 8.13\
  \ 中包含了该模块，因此 `Sessions` 控制器可以使用 `log_in` 方法。\n\n**列表 8.15：** 登录用户。\n\n```ruby\n\
  app/controllers/sessions_controller.rb\n```\n\n点击此处查看代码图片\n\n```ruby\nclass SessionsController\
  \ < ApplicationController\n  def new\n  end\n\n  def create\n    user = User.find_by(email:\
  \ params[:session][:email].downcase)\n    if user && user.authenticate(params[:session][:password])\n\
  \      log_in user\n      redirect_to user\n    else\n      flash.now[:danger] =\
  \ '无效的邮箱/密码组合'\n      render 'new'\n    end\n  end\n\n  def destroy\n  end\nend\n\
  ```\n\n注意这个紧凑的重定向\n\n`redirect_to user`\n\n我们之前在第 7.4.1 节中见过它。Rails 会自动将其转换为用户资料页的路由：\n\
  \n`user_url(user)`\n\n有了列表 8.15 中定义的 `create` 动作，列表 8.4 中定义的登录表单现在应该可以工作了。不过它对应用程序的显示没有任何影响，除非直接检查浏览器\
  \ session，否则无法判断你是否已经登录。作为启用更多可见更改的第一步，在第 8.2.2 节中，我们将使用 session 中的 id 从数据库中检索当前用户。在第\
  \ 8.2.3 节中，我们将更改应用程序布局中的链接，包括指向当前用户资料页的 URL。\n\n### 练习\n\n购买任何 Rails Tutorial 后，都可以在\
  \ railstutorial.org/solutions 免费获取练习答案。要查看他人的答案并记录自己的答案，请加入 learnenough.com/society\
  \ 的 Learn Enough Society。\n\n1. 使用有效用户登录并检查浏览器的 cookie。session 内容的值是多少？*提示*：如果你不知道如何查看浏览器的\
  \ cookie，请搜索 Google（框 1.1）。\n\n2. 上一个练习中 `Expires` 属性的值是多少？\n\n### 8.2.2 当前用户\n\n\
  在将用户 id 安全地存放在临时会话后，我们现在可以在后续页面中检索它，我们将通过定义一个 `current_user` 方法，在数据库中查找与 session\
  \ id 对应的用户。`current_user` 的目的是允许如下构造：\n\n`<%= current_user.name %>`\n\n和\n\n`redirect_to\
  \ current_user`\n\n要找到当前用户，一种方法是使用 `find` 方法，如用户资料页所示（列表 7.5）。\n\n\n\n\n另一种常见的 Ruby\
  \ 模式是：如果变量为 `nil` 则给其赋值，否则保持原样。回想在第 4.2.3 节中看到的或运算符 `||`，我们可以这样写：\n\n```ruby\n>>\
  \ @foo\n=> nil\n\n>> @foo = @foo || \"bar\"\n=> \"bar\"\n\n>> @foo = @foo || \"\
  baz\"\n=> \"bar\"\n```\n\n由于 `nil` 在布尔上下文中为假，因此对 `@foo` 的第一次赋值是 `nil || \"bar\"\
  `，其评估结果为 `\"bar\"`。同样，第二次赋值是 `@foo || \"baz\"`，即 `\"bar\" || \"baz\"`，其评估结果也为 `\"\
  bar\"`。这是因为在布尔上下文中，除了 `nil` 或 `false` 之外的任何内容都是真，而且一系列 `||` 表达式在求值第一个真表达式后就会终止。（这种从左到右评估\
  \ `||` 表达式并在遇到第一个真值时停止的做法被称为*短路求值*。同样的原理适用于 `&&` 语句，只不过在这种情况下求值会在遇到第一个*假*值时停止。）\n\
  \n比较各种操作符的控制台会，我们看到 `@foo = @foo || \"bar\"` 遵循 `x = x O y` 模式，其中 `||` 替替了 `O`：\n\
  \n```text\nx = x + 1      -> x += 1\nx = x * 3      -> x *= 3\nx = x - 8      ->\
  \ x -= 8\nx = x / 2      -> x /= 2\n@foo = @foo || \"bar\" -> @foo ||= \"bar\"\n\
  ```\n\n因此我们看到 `@foo = @foo || \"bar\"` 和 `@foo ||= \"bar\"` 是等价的。在当前用户的上下文中，这暗示了如下构造：\n\
  \n```ruby\n@current_user ||= User.find_by(id: session[:user_id])\n```\n\n搞定！\n\n\
  （从技术上讲，Ruby 会评估表达式 `@foo || @foo = \"bar\"`，这在 `@foo` 为 `nil` 或 `false` 时避免了不必要的赋值。但这个表达式不能很好地解释\
  \ `||=` 语法的含义，因此上面的讨论使用了近乎等价的 `@foo = @foo || \"bar\"`。）\n\n***\n\n应用上述讨论的结果，就得到了列表\
  \ 8.16 所示的简洁的 `current_user` 方法。\n\n**列表 8.16：** 在 session 中查找当前用户。\n\n`app/helpers/sessions_helper.rb`\n\
  \n```ruby\nmodule SessionsHelper\n  # 登录给用户。\n  def log_in(user)\n    session[:user_id]\
  \ = user.id\n  end\n\n  # 返回当前登录的用户（如果有）。\n  def current_user\n    @current_user\
  \ ||= User.find_by(id: session[:user_id])\n  end\nend\n```\n\n***\n\n有了列表 8.16 中可以运行的\
  \ `current_user` 方法，我们现在可以根据用户的登录状态对我们的应用程序进行更改了。\n\n### 练习题\n\n购买任何《Rails Tutorial》后，均可以在\
  \ railstutorial.org/solutions 免费获取练习题的答案。要查看他人的答案并记录自己的答案，请加入 learnenough.com/society\
  \ 的 Learn Enough Society。\n\n1. 在控制台中确认当相应的用户不存在时，`User.find_by(id: ...)` 返回 `nil`。\n\
  2. 在 Rails 控制台中，创建一个带有 `:user_id` 键的 `session` 哈希表。通过遵循列表 8.17 中的步骤，确认 `||=` 运算符按预期工作。\n\
  \n**列表 8.17：** 在控制台中模拟 `session`。\n\n```ruby\n>> session = {}\n>> session[:user_id]\
  \ = nil\n>> @current_user ||= User.find_by(id: session[:user_id])\n# <这里发生了什么?>\n\
  >> session[:user_id] = User.first\n>> @current_user ||= User.find_by(id: session[:user_id])\n\
  # <这里发生了什么?>\n>> @current_user ||= User.find_by(id: session[:user_id])\n# <这里发生了什么?>\n\
  ```\n\n***\n\n### 8.2.3 更改布局链接\n\n登录的首要应用是根据登录状态更改布局链接。特别是，如图 8.7 原型所示，我们将为注销、设置、列出用户以及当前用户页面添加链接。注意图\
  \ 8.7 中的注销和资料链接出现在“账户”菜单中；我们将在列表 8.19 中看到如何使用 Bootstrap 制作这样的菜单。\n\n在此时，在现实生活中，我会考虑编写一个集成测试来捕获上述行为。如框\
  \ 3.3 所示，随着你对 Rails 测试工具越来越熟悉，你可能会发现自己更倾向于先写测试。但在这种情况下，测试涉及几个新概念，因此目前将其推迟到单独的章节（第\
  \ 8.2.4 节）。\n\n更改站点布局中链接的方法是在 Ruby 内部使用 `if-else` 语句，如果用户已登录则显示一组链接，否则显示另一组链接：\n\
  \n```ruby\n<% if logged_in? %>\n  # 为已登录用户的链接\n<% else %>\n  # 为未登录用户的链接\n<% end\
  \ %>\n```\n\n这种代码需要存在一个 `logged_in?` 布尔方法，我们现在来定义它。如果 session 中存在当前用户，则用户已登录，即如果\
  \ `current_user` 不为 `nil`。检查这一点需要使用“非”运算符（第 4.2.3 节），该操作符使用感叹号 `!` 编写，通常读作“bang”。`logged_in?`\
  \ 方法出现在列表 8.18 中。\n\n**列表 8.18：** `logged_in?` 辅助方法。\n\n`app/helpers/sessions_helper.rb`\n\
  \n```ruby\nmodule SessionsHelper\n  # 登录给用户。\n  def log_in(user)\n    session[:user_id]\
  \ = user.id\n  end\n\n  # 返回当前登录的用户（如果有）。\n  def current_user\n    @current_user\
  \ ||= User.find_by(id: session[:user_id])\n  end\n\n  # 如果用户已登录返回 true，否则返回 false。\n\
  \  def logged_in?\n    !current_user.nil?\n  end\nend\n```\n\n***\n\n在列表 8.18 中添加内容后，我们现在准备好在用户登录时更改布局链接。有四个新链接，其中两个是占留的（将在第\
  \ 10 章 完成）：\n\n```ruby\n<%= link_to \"Users\", '#' %>\n<%= link_to \"Settings\"\
  , '#' %>\n```\n\n同时，注销链接使用了列表 8.2 中定义的注销路径：\n\n```ruby\n<%= link_to \"Log out\"\
  , logout_path, method: :delete %>\n```\n\n注意注销链接传递了一个哈希参数，指示它应该使用 HTTP DELETE 请求提交。我们还将添加如下个人资料链接：\n\
  \n```ruby\n<%= link_to \"Profile\", current_user %>\n```\n\n这里我们可以写：\n\n```ruby\n\
  <%= link_to \"Profile\", user_path(current_user) %>\n```\n\n但如既往，Rails 允许我们直接链接到用户，因为它在该上下文中自动将\
  \ `current_user` 转换为 `user_path(current_user)`。\n\n\n\n\n\n`<%= link_to \"Log in\"\
  , login_path %>`\n\n将所有内容整合在一起，得到了如列表 8.19 所示的更新后的头部部分。\n\n**列表 8.19：** 为登录用户更改布局链接。\n\
  \n`app/views/layouts/_header.html.erb`\n\n点击此处查看代码图像\n\n***\n\n```html\n<header\
  \ class=\"navbar navbar-fixed-top navbar-inverse\">\n  <div class=\"container\"\
  >\n    <%= link_to \"sample app\", root_path, id: \"logo\" %>\n    <nav>\n     \
  \ <ul class=\"nav navbar-nav navbar-right\">\n        <li><%= link_to \"Home\",\
  \ root_path %></li>\n        <li><%= link_to \"Help\", help_path %></li>\n     \
  \   <% if logged_in? %>\n          <li><%= link_to \"Users\", \"#\" %></li>\n  \
  \        <li class=\"dropdown\">\n            <a href=\"#\" class=\"dropdown-toggle\"\
  \ data-toggle=\"dropdown\">\n              Account <b class=\"caret\"></b>\n   \
  \         </a>\n            <ul class=\"dropdown-menu\">\n              <li><%=\
  \ link_to \"Profile\", current_user %></li>\n              <li><%= link_to \"Settings\"\
  , \"#\" %></li>\n              <li class=\"divider\"></li>\n              <li>\n\
  \                <%= link_to \"Log out\", logout_path, method: \"delete\" %>\n \
  \             </li>\n            </ul>\n          </li>\n        <% else %>\n  \
  \        <li><%= link_to \"Log in\", login_path %></li>\n        <% end %>\n   \
  \   </ul>\n    </nav>\n  </div>\n</header>\n```\n\n***\n\n作为将新链接包含在布局中的一部分，列表 8.19\
