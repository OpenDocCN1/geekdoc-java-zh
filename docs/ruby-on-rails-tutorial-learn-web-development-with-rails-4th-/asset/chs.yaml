  \ 统计数据与关注表单\n\n现在我们的示例用户既有关注列表也有关注者，我们需要更新个人页和主页来反映这一点。我们将首先创建一个部分，在个人页和主页上显示关注统计。接下来我们将添加关注/取消关注表单，然后为显示关注和关注者创建专用页面。\n\
  \n正如第 14.1 节 中提到的，我们将采用 Twitter 的惯例，使用“following”作为关注用户的标签，这种用法体现在图 14.1](#part0023.xhtml_fig1)\
  \ 中，并在图 14.10](#part0023.xhtml_fig10) 中详细展示。\n\n图 14.10](#part0023.xhtml_fig10)\
  \ 中的统计数据由当前用户关注的用户数量和关注者数量组成，每个都应该是指向其相应显示页面的链接。在第 5 章 中，我们使用占位符 `'#'` 编写了这些链接，但这一次，虽然我们将实际页面推迟到第\
  \ 14.2.3 节，但我们现在创建路由，如列表 14.15 所示。此代码在 `resources` 块内部使用了 `:member` 方法，我们之前还没有见过，但看看你能否猜出它的作用。\n\
  \n\n\n\n\n你可能认为关注（following）和粉丝（followers）的 URL 看起来是 `/users/1/following` 和 `/users/1/followers`，这正是\
  \ Listing 14.15 中代码安排的写法。由于这两个页面都会显示数据，正确的 HTTP 动词是 GET 请求，因此我们使用 `get` 方法来安排 URL\
  \ 做出相应的响应。同时，`member` 方法安排路由响应包含用户 id 的 URL。另一种可能性 `collection` 则在没有 id 的情况下工作，因此：\n\
  \n点击此处查看代码图片\n\n```ruby\nresources :users do\n  collection do\n    get :tigers\n\
  \  end\nend\n```\n\n将响应于 URL `/users/tigers`（推测是为了显示我们应用程序中的所有老虎）。7\n\n7. 关于此类路由选项的更多细节，请参阅\
