  \ `redirect_to user_url(@user)` 的效果与 `redirect_to @user` 相同。\n\n#### 7.4.2 Flash（闪存消息）\n\
  有了 代码列表 7.28 中的代码，我们的注册表单实际上已经可以工作了，但在浏览器中提交有效注册之前，我们将添加一些 Web 应用程序中常见的润色：一条显示在后续页面上的消息（在本例中是欢迎新用户加入应用程序），该消息在访问第二个页面或刷新页面时将会消失。\n\
  \nRails 显示临时消息的方法是使用一个名为 `flash` 的特殊方法，我们可以像处理哈希（hash）一样处理它。Rails 采用使用 `:success`\
  \ 键作为表示成功结果的消息（代码列表 7.29）。\n\n**代码列表 7.29：** 为用户注册添加 flash 消息。\n\n`app/controllers/users_controller.rb`\n\
  \n点击此处查看代码图片\n\n```ruby\nclass UsersController < ApplicationController\n  def create\n\
  \    @user = User.new(user_params)\n    if @user.save\n      flash[:success] = \"\
  Welcome to the Sample App!\"\n      redirect_to @user\n    else\n      render 'new'\n\
  \    end\n  end\n\n  private\n    def user_params\n      params.require(:user).permit(:name,\
  \ :email, :password, :password_confirmation)\n  end\nend\n```\n\n通过给 `flash` 赋值消息，我们现在可以在重定向后的第一个页面上显示该消息。我们的方法是遍历\
  \ `flash` 并所有相关消息插入到网站布局（layout）中。你可能记得 章节 4.3.3 中的控制台示例，在其中我们看到如何使用策略命名良好的 `flash`\
  \ 变量来遍历哈希（代码列表 7.30）。\n\n**代码列表 7.30：** 在控制台中遍历 `flash` 哈希。\n\n点击此处查看代码图片\n\n```bash\n\
  $ rails console\n>> flash = { success: \"It worked!\", danger: \"It failed.\" }\n\
  => {:success=>\"It worked!\", danger: \"It failed.\"}\n>> flash.each do |key, value|\n\
  ?> puts \"#{key}\"\n?> puts \"#{value}\"\n>> end\nsuccess\nIt worked!\ndanger\n\
  It failed.\n```\n\n通过遵循这种模式，我们可以使用如下代码在全范围内显示 flash 的内容：\n\n点击此处查看代码图片\n\n```erb\n\
  <% flash.each do |message_type, message| %>\n  <div class=\"alert alert-<%= message_type\
  \ %>\"><%= message %></</div>\n<% end %>\n```\n\n（这段代码是 HTML 和 ERb 的一种特别丑陋且难以阅读的组合；使其更美观将留作练习\
  \ [章节 7.4.4]。）在这里，嵌入式 Ruby 代码 `alert-<%= message_type %>` 创建了一个与消息类型对应的 CSS 类，因此对于\
  \ :success 消息，类名为 `alert-success`（键 `:success` 是一个符号，但嵌入式 Ruby 在将其插入模板之前会自动将其转换为字符串\
  \ `\"success\"`）。通过为每个键使用不同的类，我们能够对不同的消息应用不同的样式。例如，在 章节 8.1.4 中，我们将使用 `flash[:danger]`\
  \ 来表示登录尝试失败。（事实上，我们已经使用过一次 `alert-danger`，用于为 代码列表 7.21 中的错误 div 设置样式。）Bootstrap\
  \ CSS 支持为四种紧急程度增加的消息类型提供样式（`success`、`info`、`warning` 和 `danger`），我们将在开发应用程序的过程中有机会使用所有它们（在\
  \ 章节 1.2 中使用 `info`，在 章节 1.3 中使用 `warning`，并在 章节 8.1.4 中首次使用 `danger`）。实际上，我们将使用密切相关的\
  \ `flash.now`，但我们会推迟到需要时再使用。因为消息也被插入到了模板中，所以 `flash[:success] = \"Welcome to the\
  \ Sample App!\"` 的完整 HTML 结果如下：\n\n点击此处查看代码图片\n\n```html\n<div class=\"alert-success\"\
