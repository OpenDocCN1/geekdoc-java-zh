  \n**图 13.16：** 带有删除动态的原型。\n\n#### 13.3.4 删除 Microposts\n\n为 Microposts 添加的最后一个功能是删除帖子。与\
  \ 10.4 节 中限制管理员用户的情况不同，我们将通过关联查找 micropost，这样如果用户尝试删除其他用户的 micropost，它会自动失败。我们将结果\
  \ `find` 放在 `correct_user` 之前的过滤器中，该过滤器检查当前用户是否确实拥有该 id 的 micropost。结果出现在 列表 13.51。\n\
  \n如 列表 13.22 所示，我们首先使用用户动态来实现这一点。\n\n**列表 13.51：** 为局部部分添加删除链接。\n\n`app/views/microposts/_micropost.html.erb`\n\
  \n点击此处查看代码图片\n\n```erb\n<li id=\"<%= micropost.id %>\">\n  <%= link_to gravatar_for(micropost.user,\
  \ size: 50), micropost.user %>\n  <span class=\"user\"><%= link_to micropost.user.name,\
  \ micropost.user %</span></span>\n  <span class=\"content\"><%= micropost.content\
  \ %</span></span>\n  <span class=\"timestamp\">\n    Posted <%= time_ago_in_words(micropost.created_at)\
  \ %> ago.\n    <% if current_user == micropost.user %>\n      <%= link_to \"delete\"\
  , micropost, method: :delete, data: { confirm: \"You sure?\" } %>\n    <% end %>\n\
  \  </span>\n</li>\n```\n\n\n\n\n\n```ruby\nredirect_to request.referrer || root_url\n\
  \nend\n\nprivate\n\n  def micropost_params\n    params.require(:micropost).permit(:content)\n\
  \  end\n\n  def correct_user\n    @micropost = current_user.microposts.find_by(id:\
  \ params[:id])\n    redirect_to root_url if @micropost.nil?\n  end\nend\n```\n\n\
  注意 Listing 13.52 中的 `destroy` 方法会重定向到 URL：\n\n`request.referrer || root_url`\n\n\
  这使用了 `request.referrer` 方法，11.该方法与友好重定向中使用的 `request.original_url` 变量相关（Section\
  \ 10.2.3），它就是上一个 URL（在本例中是主页）。12.。这样做非常方便，因为微贴同时出现在主页和用户个人页上，所以通过使用 `request.referrer`，我们安排在两种情况下都重定向回发布删除请求的页面。如果引用\
  \ URL 为 `nil`（如某些测试用例所示），Listing 13.52 将使用 `||` 运算符将 `root_url` 设置为默认值。（对比 Listing\
  \ 9.24 中定义的默认选项。）\n\n11. 这对应于 HTTP 规范中定义的 HTTP_REFERER。请注意，“referer”并不是拼写错误——这个词在规范中实际上被拼错了。Rails\
