  \n#### 7.1.2 用户资源\n\n为了制作用户个人资料页，我们需要数据库中有一个用户，这引入了一个鸡生蛋蛋的问题：在注册页面可用之前，网站如何拥有用户呢？幸运的是，这个问题已经解决了：在第\
  \ 6.3.4 节 中，我们使用 Rails 控制台手动创建了一个 `User` 记录，因此数据库中应该有一个用户：\n\n点击此处查看代码图片\n\n```bash\n\
  $ rails console\n>> User.count\n```\n\n\n\n\n# => 1\n\n## `User.first`\n\n```ruby\n\
  #<User id: 1, name: \"Michael Hartl\", email: \"mhartl@example.com\", created_at:\
  \ \"2016-05-23 20:36:46\", updated_at: \"2016-05-23 20:36:46\", password_digest:\
  \ \"$2a$10$xxucoRlMp06RLJSfWpZ8hO8Dt9AZXlGRi3usP3njQg3\">\n```\n\n（如果你现在数据库中还没有用户，请现在访问第\
  \ 6.3.4 节 并在继续之前完成它。）我们从上面的控制台输出中看到该用户的 id 为 `1`，我们现在的目标是创建一个显示此用户信息的页面。我们将遵循 Rails\
  \ 应用中推崇的 REST 架构约定（Box 2.2），这意味着将数据表示为可以创建、显示、更新或销毁的*资源*——这四个动作对应于 HTTP 标准定义的四个基本操作：`POST`、`GET`、`PATCH`\
  \ 和 `DELETE`（Box 3.2）。\n\n在遵循 REST 原则时，通常使用资源名称和唯一标识符来引用资源。在用户的语境下（我们现在将其视为 Users\
  \ *资源*）——这意味着我们应该通过向 URL `/users/1` 发送 `GET` 请求来查看 id 为 `1` 的用户。在这里，`show` 动作在请求类型中是*隐式*的——当\
  \ Rails 的 REST 功能被激活时，`GET` 请求会自动由 `show` 动作处理。\n\n我们在第 2.2.1 节 中看到 id 为 `1` 的用户的页面\
  \ URL 为 `/users/1`。不幸的是，现在访问该 URL 只会返回错误，如服务器日志所示（Figure 7.4）。\n\n我们可以通过向路由文件（`config/routes.rb`）添加一行代码让\
  \ `/users/1` 的路由生效：\n\n```ruby\nresources :users\n```\n\n![image](img/image01107.jpeg)\n\
  \n**图 7.4：** `/users/1` 的服务器日志错误。\n\n结果出现在 Listing 7.3 中。\n\n**列表 7.3：** 在路由文件中添加一个\
  \ Users 资源。\n\n```ruby\nconfig/routes.rb\n\nRails.application.routes.draw do\n \
  \ root 'static_pages#home'\n  get '/help', to: 'static_pages#help'\n  get '/about',\
  \ to: 'static_pages#about'\n  get '/contact', to: 'static_pages#contact'\n  get\
  \ '/signup', to: 'users#new'\n  resources :users\nend\n```\n点击此处查看代码图片\n\n尽管我们的即时动机是创建一个显示用户的页面，但单行\
  \ `resources :users` 并不仅仅添加了一个可用的 `/users/1` URL；它为我们的示例应用赋予了 RESTful Users 资源所需的*所有*动作，6，以及大量用于生成用户\
  \ URL 的命名路由（第 5.3.3 节）。最终的 URL、动作和命名路由之间的对应关系如表 7.1 所示。（对比表 2.2）。在接下来的三个章节中，随着我们填补使\
  \ Users 成为完全 RESTful 资源所需的所有动作，我们将涵盖表 7.1 中的所有其他条目。\n\n6. 这意味着*路由*是可以工作的，但相应的页面此时并不一定可以工作。例如，`/users/1/edit`\
  \ 被正确地路由到 Users 控制器的 `edit` 动作，但由于 `edit` 动作尚不存在，实际访问该 URL 将返回错误。\n\n有了 Listing\
  \ 7.3 中的代码，路由可以工作，但那里还没有页面（Figure 7.5）。为了修复这个问题，我们将从一个极简版本的个人资料页面开始，我们将在第 7.1.4\
  \ 节 中对其完善。\n\n![image](img/image01304.jpeg)\n\n**表 7.1：** Listing 7.3 中 Users 资源提供的\
  \ RESTful 路由。\n\n![image](img/image1306.jpeg)\n\n**图 7.5：** 具有路由但没有页面的 URL `/users/1`。\n\
  \n我们将使用 Rails 显示用户的标准位置，即 `app/views/users/show`。与我们在第 5.3 节中创建的 `new.html` 不同，由于\
  \ `show.html` 文件尚不存在，我们需要在第 7.1.4 节中创建它，并像 Listing 7.4 中那样通过向 `/users/1` 发送 `GET`\
  \ 请求来查看用户。在这里，`show` 动作在请求类型中是隐式的——当 Rails 的 REST 功能被激活时，`GET` 请求会自动由 `show` 动作处理。\n\
  \n为了让 `show` 视图工作，我们需要在 `app/views/users/show.html` 中定义一个 `@user` 变量。我们在 Listing\
  \ 7.5 中使用 `params` 来获取用户，正如我们在第 6.3.4 节中看到的 `find` 方法一样。\n\n**列表 7.5：** 带有 `show`\
  \ 动作的控制器。\n\n```ruby\napp/controllers/users_controller.rb\nclass UsersController\
  \ < ApplicationController\n  def show\n    @user = User.find(params[:id])\n  end\n\
  \n  def new\n  end\nend\n```\n点击此处查看代码图片\n\n`params[:id]` 的值是 '1'。这就是我们在 Listing\
  \ 7.5 中通过 `User.find(params[:id])` 找到 id 为 1 的用户的原因。\n\n\n\n\n\n```ruby\nclass UsersController\
  \ < ApplicationController\n  def show\n    @user = User.find(params[:id])\n    debugger\n\
