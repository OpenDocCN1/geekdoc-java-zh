    \ Singleton.clone(Singleton:18)\n    at com.dev.dp.creational.singleton.SingletonC.main(SingletonC.java:29)\n\
    ```\n\n- 序列化/反序列化：当我们序列化一个对象并再次反序列化它时，会生成不同的哈希值，如下例所示。因此，在对象序列化/反序列化的情况下，我们的单例原则会被破坏。\n\
    \n```java\npublic class Singleton implements Serializable {\n    private static\
    \ Singleton instance = new Singleton();\n\n    private Singleton() {\n       \
    \ System.out.println(\"Creating...\");\n    }\n\n    public static Singleton getInstance()\
    \ {\n        return instance;\n    }\n\n    public static void main(String[] args)\
    \ throws Exception {\n        Singleton s1 = Singleton.getInstance();\n      \
    \  Singleton s2 = Singleton.getInstance();\n\n        System.out.printf(\"%s%s\\\
    n\", s1);\n        System.out.printf(\"%s%s\\n\", s2);\n\n        ObjectOutputStream\
    \ oos = new ObjectOutputStream(new FileOutputStream(\"/tmp/s2.ser\"));\n     \
    \   oos.writeObject(s2);\n        ObjectInputStream ois = new ObjectInputStream(new\
    \ FileInputStream(\"/tmp/s2.ser\"));\n        Singleton s3 = (Singleton) ois.readObject();\n\
    \        System.out.printf(\"%s%s\\n\", s3);\n    }\n\n    private static void\
    \ print(String name, Object obj) {\n        System.out.println(String.format(\"\
    Object: %s, Hashcode: %d\", name, obj.hashCode()));\n    }\n}\n```\n\n## 输出:\n\
    \nCreating...\nObject : s1, Hashcode: 31168322\nObject : s2, Hashcode: 31168322\n\
    Object : s3, Hashcode: 6585861\n\n## 如何修复：在单例类中实现所示所示 `readResolve()` 方法。\n\n\
    ```java\nprivate Object readResolve() {\n    System.out.println(\"applying read\
    \ resolve...\");\n    return instance;\n}\n```\n\n## 修复后的输出：\n\nCreating...\n\
    Object : s1, Hashcode: 31168322\nObject : s2, Hashcode: 31168322\napplying read\
    \ resolve...\nObject : s3, Hashcode: 31168322\n\n- 多线程：只有在执行了饿汉实例化的情况下，单例在多线程环境下才能正常工作，因为这种实例创建只会在类加载时发生。但对于懒加载实例化，我们必须考虑多个线程。如果我们因为成本原因想延迟实例化，则会使用懒加载。\n\
    \n以下代码通过比较两个线程执行时的哈希值，演示了单例的行为。运行以下代码时请小心，因为它在 Java 8 及更高版本上有效。\n\n```java\npublic\
    \ class SingletonT {\n    private static SingletonT instance=null;//懒加载初始化\n\n\
    \    private SingletonT(){\n        System.out.println(\"Creating...\");\n   \
    \ }\n\n    public static SingletonT getInstance(){\n        if (instance == null)\
    \ {\n            instance = new SingletonT();\n        }\n        return instance;\n\
    \    }\n\n    public static void useSingleton() {\n        Singleton singleton\
    \ = SingletonT.getInstance();\n        print(singleton);\n    }\n\n    public\
    \ static void main(String[] args) throws Exception {\n        ExecutorService\
    \ service = Executors.newFixedThreadPool(2);\n        service.submit(::useSingleton);\n\
    \        service.submit(::useSingleton);\n        service.shutdown();\n    }\n\
    \n    public static void print(String name, Object obj) {\n        System.out.println(String.format(\"\
    Object : %s, Hashcode: %d\", name, obj.hashCode()));\n    }\n}\n```\n\nCreating...\n\
    Object : singleton, Hashcode: 14229844\nObject : singleton, Hashcode: 14229844\n\
    \n当你多次运行程序时，你会发现在多线程环境下，单例原则有时有效，但有时会违反。因此，我们需要像下面所示对 `getInstance()` 方法进行同步。\n\
    \n```java\npublic static synchronized SingletonT getInstance(){\n    if (instance\
    \ == null) {\n        instance = new SingletonT();\n    }\n    return instance;\n\
    }\n```\n\n在 `getInstance()` 方法中应用 `synchronized` 关键字后，程序将正常执行而没有任何问题，但 Java 并没有同步整个方法，我们可以只同步创建实例时受影响的代码块，以避免额外的开销，如下：\n\
    \n```java\npublic static SingletonT getInstance(){\n    if (instance == null)\
    \ {\n        synchronized (SingletonT.class) {\n            instance = new SingletonT();\n\
    \        }\n    }\n    return instance;\n}\n```\n\n从上述代码中，出于性能考虑缩小了同步范围。请注意，如果一个线程在第\
    \ 28 行看到 `instance` 为空，然后它获取了第 29 行对象的锁。与此同时，另一个线程已经有了锁，它将创建实例。为了确保没有其他线程已经获取锁，我们会在获取锁后再次进行一次检查，如下所示。这种方法被称为双检查锁定（Double\
    \ Checked Locking）。\n\n```java\npublic static SingletonT getInstance() {\n   \
    \ if (instance == null) { // 检查 1\n        synchronized (SingletonT.class) {\n\
    \            if (instance == null) { // 检查 2\n                instance = new SingletonT();\n\
    \            }\n        }\n    }\n    return instance;\n}\n```\n\n有时双检查锁定也会破坏单例原则。Java\
    \ 运行时发布部分化的变量。为了解决这种情况，在声明实例时使用 `volatile` 关键字。`volatile` 变量的值只有在写入操作完成后才会发布。简而言之，所有线程都会看到变量的值。\n\
    \n```java\nprivate static volatile Singleton instance=null;//懒加载初始化\n```\n\nHolder\
    \ 类（ Pugh 方法）：** Pugh 使用内部静态辅助类了一种创建单例类的不同方法。\n\n```java\npackage com.dev.op.singleton;\n\
    \npublic class Singleton {\n    private Singleton() {\n        System.out.println(\"\
    Creating...\");\n    }\n    static class Holder {\n        static final Singleton\
    \ INSTANCE = new Singleton();\n    }\n\n    public static Singleton getInstance()\
    \ {\n        return Holder.INSTANCE;\n    }\n\n    public static void main(String[]\
    \ args) throws Exception {\n        Singleton s1 = Singleton.getInstance();\n\
    \        Singleton s2 = Singleton.getInstance();\n        Singleton s3 = Singleton.getInstance();\n\
    \n        print(\"s1, s2, s3\");\n        print(\"s1, s2, s3\");\n        print(\"\
    s3, s2, s3\");\n    }\n\n    private static void print(String name, Singleton\
    \ obj) {\n        System.out.println(String.format(\"Object: %s, %s, %s, %s\"\
    , obj, name, name, obj.hashCode()));\n    }\n}\n```\n\nCreating...\nObject : s1,\
    \ Hashcode: 31168322\nObject : s2, Hashcode: 31168322\nObject : s3, Hashcode:\
    \ 31168322\n\nEnum 单例：Joshua Bloch 建议使用 Enum 来实现单例设计模式，因为 Java 确保任何枚举值在 Java Java\
    \ 程序中只实例化一次。由于 Java 枚举值是全局可见的，单例也是可见的。缺点是枚举类型不够灵活；例如，它不允许懒加载初始化。\n\n```java\n\
    package com.dev.dp.creational.singleton;\n\npublic enum EnumSingleton {\n    INSTANCE;\n\
    \n    public static void doSomething() {\n        // do something\n    }\n}\n\
    ```\n\nEnum 单例在上述描述的任何情况下都不会违反单例原则。\n\n"
