    +   * javax.faces.lifecycle.Lifecycle#execute ()'
  - '[PAGE 94]


    # ITERATOR PATTERN


    Iterator pattern in one of the behavioral pattern and it''s used to provide a
    standard way to traverse through a group of Objects. Iterator pattern is widely
    used in java collection framework where Iterator interface provides methods for
    traversing through a collection.


    The logic for iteration is embedded in the collection itself and it helps client
    program to iterate over them easily.


    Iterator pattern is not only about traversing through a collection; we can provide
    different kind of iterators based on our requirements. Iterator pattern hides
    the actual implementation of traversal through the collection and client programs
    just use iterator methods. An Iterator object contains public methods to allow
    a client object to navigate through the list of objects within the container.


    # Iterator


    +   * Defines an interface for accessing and traversing elements.


    # ConcreteIterator


    +   * Implements the Iterator interface.


    +   * Keeps track of the current position in the traversal of the aggregate.


    # Aggregate


    +   * Defines an interface for creating an Iterator object.


    # ConcreteAggregate


    +   * Implements the Iterator creation interface to return an instance of the
    proper ConcreteIterator.'
  - '[PAGE 95]


    # When to use the Iterator Design Pattern:


    Use the Iterator pattern:


    +   * To access an aggregate object’s contents without exposing its internal representation.

    * To support multiple traversals of aggregate objects.

    * To provide a uniform interface for traversing different aggregate structures
    (that is, to support polymorphic iteration).

    * Iterator pattern is useful when you want to provide a standard way to iterate
    over a collection and hide the implementation from client program.


    # Iterator Pattern in JDK:


    +   * java.util.Iterator

    * java.util.Enumeration'
  - '[PAGE 96]


    # INTERPRETER PATTERN


    Interpreter pattern is one of the behavioral design patterns and is used to define
    a grammatical representation for a language and provides an interpreter to deal
    with this grammar. The best example of this pattern is java compiler that interprets
    the source code into byte code that is understandable by JVM. Google Translator
    is also an example of interpreter pattern where the input can be in any language
    and we can get the output interpreted in another language.


    To implement interpreter pattern, we need to create Interpreter context engine
    that will do the interpretation work and then we need to create different Expression
    implementations that will consume the functionalities provided by the interpreter
    context. Finally we need to create the client that will take the input from user
    and decide which Expression to use and then generate output for the user.'
  - '[PAGE 97]


    # When to use the Interpreter Design Pattern


    Use the Interpreter pattern when there is a language to interpret, and you can
    represent statements in the language as abstract syntax trees. The Interpreter
    pattern works best when


    +   * The grammar is simple. For complex grammars, the class hierarchy for the
    grammar becomes large and unmanageable. Tools such as parser generators are a
    better alternative in such cases. They can interpret parse expressions without
    building abstract syntax trees, which can save space and possibly time.


    +   * Efficiency is not a critical concern. The most efficient interpreters are
    usually not implemented by interpreting parse trees directly but by first translating
    them into another form. For example, regular expressions are often transformed
    into state machines. But even then, the translator can be implemented by the Interpreter
    pattern, so the pattern is still applicable.'
  - '[PAGE 98]


    # Interpreter Design Pattern in JDK:


    +   * java.util.Pattern

    * java.text.Normalizer

    * java.text.Format'
  - '[PAGE 99]


    # # MEMENTO PATTERN


    Memento pattern is one of the behavioral design patterns. Memento design pattern
    is used when we want to save the state of an object so that we can restore later
    on. Memento pattern is used to implement this in such a way that the saved data
    of the object is not accessible outside of the object; this protects the integrity
    of saved state data.


    Memento pattern is implemented with two objects – Originator and Caretaker. Originator
    is the object whose state needs to be saved and restored and it uses an inner
    class to save the state of Object. The inner class is called Memento and its private,
    so that it can''t be accessed from other objects.


    Caretaker is the helper class that is responsible for storing and restoring the
    Originator''s state through Memento object. Since Memento is private to Originator,
    Caretaker can''t access it and it''s stored as an Object within the caretaker.


    One of the best real life examples is the text editors where we can save its data
    atime and use undo to restore it to previous saved state. We will implement the
    same feature and provide a utility where we can write and save contents to a File
    anytime and we can restore it to last saved state. For simplicity, I will not
    use any IO operations to write data into file.'
  - '[PAGE 100]


    # When to use the Memento Pattern:


    Use the Memento Pattern in the following cases:


    +   * A snapshot of (some portion of) an object’s state must be saved so that
    it can be restored to that state later, and


    +   * A direct interface to obtaining the state would expose implementation details
    and break the object’s encapsulation.'
  - '[PAGE 101]


