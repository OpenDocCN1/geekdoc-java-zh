    - 子系统之间可能相互依赖。在这种情况下，Facade 可以充当协调者，解耦子系统之间的依赖关系。\n- 我们可以结合工厂设计模式与 Facade 使用，为客户端系统提供更好的接口。\n\
    \n## 在 Java 中的用法：\n\n在 `javax.faces.context` 中，`ExternalContext` 内部使用了 `ServletContext`、`HttpSession`、`HttpServletRequest`、`HttpServletResponse`\
    \ 等。它允许 Faces API 无需感知所包含的应用环境的性质。\n\n## 桥接模式 (BRIDGE PATTERN)\n\n当接口和实现中都存在接口层次结构时，使用构建器设计模式将接口与实现解耦，并向客户端程序隐藏实现细节。\n\
    \n根据 GoF 设计模式，桥接模式的定义是：将抽象与其实现解耦，以便两者能够独立地变化。\n\n在桥接模式中，我们将抽象和实现分离离开来，并为抽象和实现者分别开发单独的继承结构。抽象是一个接口或抽象类，抽象包含一个指向实现者的引用。具体实现者的子类同样是接口或抽象类。抽象被称为细化抽象（refined\
    \ abstractions），实现者的子类被称为具体实现者（concrete implementers）。由于我们可以更改抽象中对实现者的引用，因此我们能够在运行时更改抽象的实现者。对实现者的更改不会影响客户端代码。\n\
    \n桥接模式的意图是将抽象与其实现解耦，以便两者独立地变化。它将抽象和实现放在两个不同的类层次结构中，以便两者都可以独立地扩展。\n\n## 桥接模式设计之前\n\
    \n![](img/776807b1115a8bf86c1ed9d6357c6fe1_48_0.png)\n\n## 桥接模式设计之后\n\n![](img/776807b1115a8bf86c1ed9d6357c6fe1_49_0.png)\n\
    \n适配器设计模式有助于让两个不兼容的类共同工作。但桥接设计模式通过创建两个不同的层次结构来解耦抽象和实现。\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    /**\n * 桥接模式中的抽象\n */\npublic abstract class Vehicle {\n    protected VehicleType\
    \ type1;\n    protected VehicleType type2;\n\n    public Vehicle(VehicleType type1,\
    \ VehicleType type2) {\n    this.type1 = type1;\n        this.type2 = type2;\n\
    \    }\n\n    abstract public void purchase();\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    /**\n * 桥接模式的实现者\n */\npublic interface VehicleType {\n    abstract public void\
    \ book();\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n/**\n * 桥接模式中的细化抽象\
    \ 1\n */\npublic class Car extends Vehicle {\n    public Car(VehicleType type1,\
    \ VehicleType type2) {\n        super(type1, type2);\n    }\n    @Override\n \
    \   public void purchase() {\n        System.out.print(\"Car\");\n        type1.book();\n\
    \        type2.book();\n    }\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    /**\n * 桥接模式中的细化抽象 2\n */\npublic class Bike extends Vehicle {\n    public Bike(VehicleType\
    \ type1, VehicleType type2) {\n        super(type1, type2);\n    }\n    @Override\n\
    \    public void purchase() {\n        System.out.print(\"Bike\");\n        type1.book();\n\
    \        type2.book();\n    }\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    /**\n * 桥接模式的具体实现 1\n */\npublic class NewVehicle implements VehicleType {\n \
    \   @Override\n    public void book() {\n        System.out.print(\" New Vehicle\"\
    );\n    }\n}\n```\n\n```java\npackage com.dp.structural.bridge;\n/**\n * 桥接模式的具体实现\
    \ 2\n */\npublic class OldVehicle implements VehicleType {\n\n    @Override\n\
    \    public void body() {\n        System.out.println(\" Old Vehicle\");\n   \
    \ }\n}\n```\n\n```java\npackage com.dp.structural.bridge;\npublic class BridgePatternTest\
    \ {\n    public static void main(String[] args) {\n        Vehicle vehicle1 =\
    \ new Car(new NewVehicle(),new OldVehicle());\n        vehicle1.purchase();\n\n\
    \        Bike vehicle2 = new Bike(new NewVehicle(),new OldVehicle());\n      \
    \  vehicle2.purchase();\n    }\n}\n```\n\n## 输出:\n\nCar New Vehicle Old Vehicle\n\
    Bike New Vehicle Old Vehicle\n\n## 桥接模式总结：\n\n- 创建两个不同的层次结构：一个用于抽象，另一个用于实现。\n\
    - 通过移除抽象与实现之间的依赖关系，避免了永久绑定。\n- 我们创建了一个协调抽象和实现之间的桥梁。\n- 抽象和实现可以分别扩展。\n- 当需要在运行时切换实现时应使用此模式。\n\
    - 如果抽象的实现发生修改，客户端不应受到影响。\n- 当你有多个实现时，效果最佳。\n\n## 在 Java 中的用法：\n\n- AWT\n- JDBC\n\
    \n## 装饰器模式 (DECORATOR PATTERN)\n\n装饰器模式的意图是动态地给对象附加额外的职责。这为扩展功能提供了比子类化更灵活的替代。\n\
    \n装饰器类与它封装的对象具有相同的接口。它包含一个指向实际对象的引用。装饰器接收来自客户端的所有请求，并将这些调用转发给底层对象。\n\n组件接口（Component\
    \ Interface）—— 定义将实现的方法的接口或抽象类。在本例中，Icecream（冰淇淋）将作为组件接口。\n\n```java\npackage\
    \ com.dev.dp.structural.decorator;\npublic interface Icecream {\n    public String\
    \ makeIcecream();\n}\n```\n\n组件实现（Component Implementation）—— 组件接口的基本实现。我们可以有一个\
    \ Simpleicecream 这种组件实现。\n\n```java\npackage com.dev.dp.structural.decorator;\n\
    public class Simpleicecream implements Icecream {\n    @Override\n    public String\
    \ makeIcecream() {\n        return \"Base-Icecream\";\n    }\n}\n```\n\n装饰器（Decorator）——\
    \ 装饰器类实现了组件接口，并且与组件接口具有“拥有”（HAS-A）关系。组件变量应该允许子装饰器类访问，因此我们将此变量设为 protected。\n\n\
    ```java\npackage com.dev.dp.structural.decorator;\npublic abstract class IcecreamDecorator\
    \ implements Icecream {\nprotected Icecream specialIcecream;\n  public IcecreamDecorator(Icecream\
    \ specialIcecream) {\n    this.specialIcecream = specialIcecream;\n  }\n  @Override\n\
    \  public String makeIcecream() {\n    return specialIcecream.makeIcecream();\n\
    \  }\n}\n```\n\n## 具体装饰器（Concrete Decorators）—— 扩展基础装饰器功能并相应地修改组件行为。我们可以有 NuttyIcecreamDecorator\
    \ 和 HoneyIcecreamDecorator 等具体装饰器类。\n\n```java\npackage com.dev.dp.structural.decorator;\n\
    public class NuttyDecorator extends IcecreamDecorator {\n  public NuttyDecorator(Icecream\
    \ specialIcecream) {\n    super(specialIcecream);\n  }\n  public String makeIcecream()\
    \ {\n    return specialIcecream.makeIcecream() + addNuts();\n  }\n  private String\
    \ addNuts() {\n    return \"+ Crunchy Nuts\";\n  }\n}\n```\n\n```java\npackage\
    \ com.dev.dp.structural.decorator;\npublic class HoneyDecorator extends IcecreamDecorator\
    \ {\n  public HoneyDecorator(Icecream specialIcecream) {\n    super(specialIcecream);\n\
    \  }\n  public String makeIcecream() {\n    return specialIcecream.makeIcecream()\
    \ + addHoney();\n  }\n  private String addHoney() {\n    return \"+ Sweet Honey\"\
    ;\n  }\n}\n```\n\n"
