- md: "\n## Cloning: If we try to make instance by cloning it, the generated hash\
    \ code of cloned copy doesn't match with the actual object so it also violates\
    \ the Singleton principle.\n\n```java\npublic class Singleton Cloneable {\n  \
    \  private static Singleton instance=new Singleton();\n    private Singleton()\
    \ {\n        System.out.println(\"Creating...\");\n    }\n\n    public static\
    \ Singleton getInstance() {\n        return instance;\n    }\n\n    @Override\n\
    \    protected Object clone() throws CloneNotSupportedException {\n        if\
    \ (instance != null) throw new CloneNotSupportedException();\n        return super.clone();\n\
    \    }\n\n    public static void main(String[] args) throws Exception {\n    \
    \    Singleton s1 = Singleton.getInstance();\n        Singleton s2 = Singleton.getInstance();\n\
    \        print(\"s1\",s1);\n        print(\"s2\",s2);\n\n        Singleton s3\
    \ = (Singleton)s1.clone();\n        print(\"s3\",s3);\n    }\n\n    private static\
    \ void print(String name, Object obj) {\n        System.out.println(String.format(\"\
    Object : %s, Hashcode: %d\",name,obj.hashCode()));\n    }\n}\n```\n\nOutput:\n\
    \nCreating...\nObject : s1, Hashcode: 31168322\nObject : s2, Hashcode: 31168322\n\
    Object : s3, Hashcode: 17225372\n\nHow to fix: Throw CloneNotSupportedException\
    \ from the clone () method if someone tries to make another instance of it. Uncomment\
    \ the commented line from clone () to method.\n\nOutput post fix:\n\n```\nCreating...\n\
    Object : s1, Hashcode: 31168322\nObject : s2, Hashcode: 31168322\nException in\
    \ thread \"main\" java.lang.CloneNotSupportedException: Singleton.clone(Singleton:18)\n\
    \    at com.dev.dp.creational.singleton.SingletonC.main(SingletonC.java:29)\n\
    ```\n\n- Serialization/Deserialization: When we serialize an object and deserialize\
    \ it again there are different hash code values generated as shown in the example\
    \ below. So our Singleton principle breaks in case of object serialization/deserialization.\n\
    \n```java\npublic class Singleton implements Serializable {\n    private static\
    \ Singleton instance = new Singleton();\n\n    private Singleton() {\n       \
    \ System.out.println(\"Creating...\");\n    }\n\n    public static Singleton getInstance()\
    \ {\n        return instance;\n    }\n\n    public static void main(String[] args)\
    \ throws Exception {\n        Singleton s1 = Singleton.getInstance();\n      \
    \  Singleton s2 = Singleton.getInstance();\n\n        System.out.printf(\"%s%s\\\
    n\", s1);\n        System.out.printf(\"%s%s\\n\", s2);\n\n        ObjectOutputStream\
    \ oos = new ObjectOutputStream(new FileOutputStream(\"/tmp/s2.ser\"));\n     \
    \   oos.writeObject(s2);\n        ObjectInputStream ois = new ObjectInputStream(new\
    \ FileInputStream(\"/tmp/s2.ser\"));\n        Singleton s3 = (Singleton) ois.readObject();\n\
    \        System.out.printf(\"%s%s\\n\", s3);\n    }\n\n    private static void\
    \ print(String name, Object obj) {\n        System.out.println(String.format(\"\
    Object: %s, Hashcode: %d\", name, obj.hashCode()));\n    }\n}\n```\n\n## Output:\n\
    \nCreating...\nObject : s1, Hashcode: 31168322\nObject : s2, Hashcode: 31168322\n\
    Object : s3, Hashcode: 6585861\n\n## How to Fix: Implement readResolve() method\
    \ in the Singleton class as shown below.\n\n```java\nprivate Object readResolve()\
    \ {\n    System.out.println(\"applying read resolve...\");\n    return instance;\n\
    }\n```\n\n## Output post fix:\n\nCreating...\nObject : s1, Hashcode: 31168322\n\
    Object : s2, Hashcode: 31168322\napplying read resolve...\nObject : s3, Hashcode:\
    \ 31168322\n\n- Multithreaded: Singleton will work properly in multithreaded environment\
    \ only if eager instantiation has been done because this instance creation will\
    \ happen at the time of class loading only. But for Lazy instantiation we will\
    \ have to take care of multiple threads. If we want to delay the instantiation\
    \ because of cost, we use to go with lazy.\n\nFollowing code demonstrates the\
    \ behavior of Singleton when two threads are executed by comparing their hash\
    \ code values. Be careful while running the following code as it will work only\
    \ in Java 8 and later versions.\n\n```java\npublic class SingletonT {\n    private\
    \ static SingletonT instance=null;//lazy initialization\n\n    private SingletonT(){\n\
    \        System.out.println(\"Creating...\");\n    }\n\n    public static SingletonT\
    \ getInstance(){\n        if (instance == null) {\n            instance = new\
    \ SingletonT();\n        }\n        return instance;\n    }\n\n    public static\
    \ void useSingleton() {\n        Singleton singleton = SingletonT.getInstance();\n\
    \        print(singleton);\n    }\n\n    public static void main(String[] args)\
    \ throws Exception {\n        ExecutorService service = Executors.newFixedThreadPool(2);\n\
    \        service.submit(::useSingleton);\n        service.submit(::useSingleton);\n\
    \        service.shutdown();\n    }\n\n    public static void print(String name,\
    \ Object obj) {\n        System.out.println(String.format(\"Object : %s, Hashcode:\
    \ %d\", name, obj.hashCode()));\n    }\n}\n```\n\nCreating...\nObject : singleton,\
    \ Hashcode: 14229844\nObject : singleton, Hashcode: 14229844\n\nWhen you run the\
    \ program many times you will notice that in multithreaded environment sometimes\
    \ Singleton principle works but sometimes it violates. Therefore we need to synchronize\
    \ the getInstance() method as shown below.\n\n```java\npublic static synchronized\
    \ SingletonT getInstance(){\n    if (instance == null) {\n        instance = new\
    \ SingletonT();\n    }\n    return instance;\n}\n```\n\nAfter applying synchronize\
    \ keyword in the getInstance() method the program will execute properly without\
    \ any issue but Java instead of synchronizing whole method we can synchronize\
    \ only the block of code which is affected while creating instance to escape the\
    \ extra overhead as below.\n\n```java\npublic static SingletonT getInstance(){\n\
    \    if (instance == null) {\n        synchronized (SingletonT.class) {\n    \
    \        instance = new SingletonT();\n        }\n    }\n    return instance;\n\
    }\n```\n\nFrom the above code we have narrowed down the scope of synchronization\
    \ for performance reasons. Notice that if a thread at line # 28 sees instance\
    \ is null and then it gets the lock of object at line # 29. At the same time another\
    \ thread already has the lock it will create the instance. To make sure no other\
    \ thread has already acquired the lock we will apply one more check after acquiring\
    \ the lock as shown below. This method is called Double Checked Locking.\n\n```java\n\
    public static SingletonT getInstance() {\n    if (instance == null) { // check\
    \ 1\n        synchronized (SingletonT.class) {\n            if (instance == null)\
    \ { // check 2\n                instance = new SingletonT();\n            }\n\
    \        }\n    }\n    return instance;\n}\n```\n\nSometimes double checked locking\
    \ also breaks the Principle of Singleton.\n\nJava runtime publishes half initialized\
    \ variable. Suppose 2 threads thread1&thread2 are entering into the code it goes\
    \ through the line # 28 to line # 31 and created the instance. At the same time\
    \ thread 2 enters and it knows there is something in variable named as 'instance'\
    \ (which is at if half initialized state) and it returns the same from line #\
    \ 35. Therefore Singleton principle breaks.\n\nTo address this situation use volatile\
    \ keyword at the time of instance declaration. Value of volatile variable will\
    \ be published only when the change completes. Change to write operation happens\
    \ before read operation in volatile variable. In short all threads will see the\
    \ same value of variable.\n\n```java\nprivate static volatile Singleton instance=null;\
    \ //lazy initialization\n```\n\n**Holder Class (Bill Pugh Method):** Bill Pugh\
    \ came up with a different approach to create the Singleton class using an inner\
    \ static helper class.\n\n```java\npackage com.dev.op.creational.singleton;\n\n\
    public class Singleton {\n    private Singleton() {\n        System.out.println(\"\
    Creating...\");\n    }\n    static class Holder {\n        static final Singleton\
    \ INSTANCE = new Singleton();\n    }\n\n    public static Singleton getInstance()\
    \ {\n        return Holder.INSTANCE;\n    }\n\n    public static void main(String[]\
    \ args) throws Exception {\n        Singleton s1 = Singleton.getInstance();\n\
    \        Singleton s2 = Singleton.getInstance();\n        Singleton s3 = Singleton.getInstance();\n\
    \n        print(\"s1, s2, s3\");\n        print(\"s1, s2, s3\");\n        print(\"\
    s3, s2, s3\");\n    }\n\n    private static void print(String name, Singleton\
    \ obj) {\n        System.out.println(String.format(\"Object: %s, %s, %s, %s\"\
    , obj, name, name, obj.hashCode()));\n    }\n}\n```\n\nCreating...\nObject : s1,\
    \ Hashcode: 31168322\nObject : s2, Hashcode: 31168322\nObject : s3, Hashcode:\
    \ 31168322\n\n**Enum Singleton:** Joshua Bloch suggests the use of Enum to implement\
    \ Singleton design pattern as Java ensures that any enum value is instantiated\
    \ only once in a Java program. Since Java Enum values are globally accessible,\
    \ so is the singleton. The drawback is that the enum type is somewhat inflexible;\
    \ for example, it does not allow lazy initialization.\n\n```java\npackage com.dev.dp.creational.singleton;\n\
    \npublic enum EnumSingleton {\n    INSTANCE;\n\n    public static void doSomething()\
    \ {\n        // do something\n    }\n}\n```\n\nEnum Singleton doesn’t violate\
    \ principle of Singleton in any case described above.\n"
  mdcn: "\n\n## 克隆：如果我们尝试通过克隆来创建实例，生成的克隆副本哈希值与实际对象不匹配，因此它违反了单例原则。\n\n```java\npublic\
    \ class Singleton Cloneable {\n    private static Singleton instance=new Singleton();\n\
