    \ its behavior when it's internal state changes\n\nThe state of an object can\
    \ be defined as its exact condition at any given point of time, depending on the\
    \ values of its properties or attributes. The set of methods implemented by a\
    \ class constitutes the behavior of its instances. Whenever there is a change\
    \ in the values of its attributes, we say that the state of an object has changed.\n\
    \nWhen a Context object is first created, it initializes itself with its Initial\
    \ State object. This State object becomes the current State object for the context.\
    \ By replacing the current State object with a new State object, the context transitions\
    \ to a new state. When an application object makes a call to a Context method\
    \ (behavior), it forwards the method to its State object.\n\n**Context**: Defines\
    \ the interface of interest to clients.\n\n+   - Maintains an instance of a ConcreteState\
    \ subclass that defines the current state.\n\n**State**: Defines an interface\
    \ for encapsulating the behavior associated with a particular state of the Context.\n\
    \n**ConcreteState subclasses**: Each subclass implements a behavior associated\
    \ with a state of the Context.\n\nIn the state pattern, we have a Context class,\
    \ and this class has a State reference to a Concrete State instance. The State\
    \ interface declares particular methods that represent the behaviors of a particular\
    \ state. Concrete States implement these behaviors. By changing a Context's Concrete\
    \ State, we change its behavior. In essence, in the state pattern, a class (Context)\
    \ is supposed to behave like different classes depending on its state. The state\
    \ pattern avoids the use of switch and if statements to change behavior.\n\n```\n\
    public interface MobileState {\n    public void getState();\n}\n```"
