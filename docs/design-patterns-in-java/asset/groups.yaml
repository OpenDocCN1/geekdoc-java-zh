- md: "\n# Design Patterns in JAVA\n\nDevendra Singh\n\n# JAVA DESIGN PATTERNS\n\n\
    By\nDevendra Singh\n\n@Copyright 2016 Dev S\n\n## PREFACE\n\nThis technical e-book\
    \ provides information about design patterns in java in the simplest way to understand.\
    \ It consists of detailed descriptions of each Java design patterns with the simplest\
    \ real worlds. All examples given in this e-book have been compiled & run by me\
    \ in my development environment. I tried best to have the simplest example available\
    \ in this book.\n\nThis book is intended for java developers as a beginner or\
    \ experienced. Any java developer can get benefits if he/she go through the full\
    \ content & provided examples. I have written this book keeping in mind that every\
    \ level of developer can get benefits from this.\n\nMotivation for writing this\
    \ e-book comes from the time I was learning java design patterns. It was not very\
    \ easy to understand each and every pattern in one or two readings. I went through\
    \ the various books & materials on the same and tried to extract relevant facts\
    \ about the different patterns to make them understand easily & quickly. I included\
    \ all those relevant & crucial points in this book.\n\nBefore getting started\
    \ I would like to introduce myself. I am a java developer having more than 10\
    \ years' experience in Java/J2EE technologies. Currently I am working with a multinational\
    \ software company. One of my hobbies is to write technical contents. I spared\
    \ some time to write this book & feeling very happy to share my experience and\
    \ knowledge with other developers. In case you have any suggestion, correction\
    \ or queries going through this e-book please don't hesitate to connect me erdsingh24@gmail.com\n\
    \n## Table of Contents\n\n- ABOUT DESIGN PATTERNS\n- SINGLETON PATTERN\n- FACTORY\
    \ PATTERN\n- ABSTRACT FACTORY PATTERN\n- BUILDER PATTERN\n- PROTOTYPE PATTERN\n\
    - ADAPTER PATTERN\n- COMPOSITE PATTERN\n- PROXY PATTERN\n- FAÇADE PATTERN\n- DECORATOR\
    \ PATTERN\n- FLYWEIGHT PATTERN\n- TEMPLATE METHOD PATTERN\n- MEDIATOR PATTERN\n\
    - CHAIN OF RESPONSIBILITY\n- OBSERVER PATTERN\n- STRATEGY PATTERN\n- VISITOR PATTERN\n\
    - STATE PATTERN\n- ITERATOR PATTERN\n- INTERPRETER PATTERN\n- MEMENTO PATTERN\n\
    \n## ABOUT DESIGN PATTERNS\n\nIf a problem occurs over and over again, a solution\
    \ to that problem has been used effectively. That solution is described as a pattern.\
    \ The design patterns are language-independent strategies for solving common object-oriented\
    \ design patterns. When you make a design, you should know the name of some common\
    \ solutions. Learning design patterns is good for people to communicate each other\
    \ effectively. In fact, you may have been familiar with some design patterns;\
    \ you may not use well-known names to describe them. SUN suggests GOF (Gang of\
    \ Four—four pioneers who wrote a book named “Design Patterns”- Elements of Reusable\
    \ Object-Oriented Software), so we use that book as our guide to describe solutions.\
    \ Please make you to be familiar with these terms and learn how other people solve\
    \ the coding problems.\n\nIf you want to be a professional Java developer, you\
    \ should know at least some popular solutions to coding problems. Such solutions\
    \ have been proved efficient and effective by the experienced developers. Learning\
    \ design patterns speeds up your experience accumulation in OAA/OOD. Once you\
    \ grasped, you would be benefited from them for all your life and jump up yourself\
    \ to be a master of designing and developing. Furthermore, you will be able to\
    \ use these terms to communicate with your fellows or assessors more effectively.\n\
    \nMany programmers with many years’ experience don't know design patterns, but\
    \ as an Object-Oriented programmer, you have to know them, especially for new\
    \ Java programmers. You may not use a popular name to describe it or may not choose\
    \ an effective way to better intellectually control over what you built. Learning\
    \ how the experienced developers to solve the coding problems and trying to use\
    \ them in your project are a best way to earn your experience and certification.\n\
    \nRemember that learning the design patterns will really change how you use your\
    \ code; not only will you be smarter but you will sound a lot smarter, too. The\
    \ 23 design patterns of GOF are well known, and more are to be discovered on the\
    \ way.\n\nThere are three well-known types of design patterns.\n\nCreational Design\
    \ Patterns: Creational design patterns provide solution to instantiate object\
    \ in the best possible way for specific situations. Following design patterns\
    \ come under this category.\n\n- Singleton Pattern\n- Factory Pattern\n- Abstract\
    \ Factory Pattern\n- Builder Pattern\n- Prototype Pattern\n\nStructural Design\
    \ Patterns: Structural patterns provide different ways to create a class structure\
    \ for example using inheritance and composition to create a large object from\
    \ small objects. Following design patterns come under this category.\n\n- Adapter\
    \ Pattern\n- Composite Pattern\n- Proxy Pattern\n- Flyweight Pattern\n- Facade\
    \ Pattern\n- Bridge Pattern\n- Decorator Pattern\n\nBehavioral Design Patterns:\
    \ Behavioral patterns provide solution for the better interaction between objects\
    \ and how to lose coupling and flexibility to extend easily. Following design\
    \ patterns come under this category.\n\n- Template Method Pattern\n- Mediator\
    \ Pattern\n- Chain of Responsibility Pattern\n- Observer Pattern\n- Strategy Pattern\n\
    - Command Pattern\n- State Pattern\n- Visitor Pattern\n- Iterator Pattern\n- Interpreter\
    \ Pattern\n- Memento Pattern\n\n## SINGLETON PATTERN\n\nSometimes it’s important\
    \ for some classes to have exactly one instance. There are many objects we only\
    \ need one instance of them and if we, instantiate more than one, we’ll run into\
    \ all sorts of problems like incorrect program behavior, overuse of resources,\
    \ or inconsistent results.\n\nThere are only two points in the definition of a\
    \ singleton design pattern:\n\n- There should be only one instance allowed for\
    \ a class and\n- We should allow global point of access to that single instance.\n\
    \nFrom the definition, it seems to be a very simple design pattern but when it\
    \ comes to implementation, it comes with a lot of implementation concerns. The\
    \ implementation of Java Singleton pattern has always been a controversial topic\
    \ among developers. We will learn about Singleton design pattern principles, different\
    \ ways to implement Singleton design pattern and some of the best practices for\
    \ its usage.\n\nLazy initialization will be beneficial when we want to delay the\
    \ initialization until it is not needed. because if we use eager initialization\
    \ and if initialization fails there is no chance to get the instance further while\
    \ in lazy initialization we get it in second chance. In Lazy initialization we\
    \ not get instance until we call getInstance() method while in eager initialization\
    \ creates instance at the time of class loading.\n\nThere are some examples where\
    \ Singleton pattern violation situation can be found.\n\nWe will compare the hash\
    \ code values of the objects to verify the similar objects. If hash code values\
    \ of two objects are equal, those objects must be equal.\n\n- Reflection: Using\
    \ reflection we can set the private constructor to become accessible at runtime\
    \ as shown in the example below.\n\n```java\nimport java.lang.reflect.Constructor;\n\
    public class SingletonR {\n    private static SingletonR instance=new SingletonR();\n\
    \    private SingletonR() {\n        System.out.println(\"Creating...\");\n  \
    \  }\n    public static SingletonR getInstance() {\n        return instance;\n\
    \    }\n    public static void main(String[] args) throws Exception {\n      \
    \  SingletonR s1 = SingletonR.getInstance();\n        SingletonR s2 = SingletonR.getInstance();\n\
    \        print(\"s1\", s1);\n        print(\"s2\", s2);\n        Class cls = Class.forName(\"\
    com.dev.dp.creational.singleton.SingletonR\");\n        Constructor<SingletonR>\
    \ ctor = cls.getDeclaredConstructor();\n        ctor.setAccessible(true);\n  \
    \      SingletonR s3 = ctor.newInstance();\n        print(\"s3\", s3);\n    }\n\
    \    static void print(String name, Object obj) {\n        System.out.println(String.format(\"\
    Object: %s, Hashcode: %d\",name,obj.hashCode()));\n    }\n}\n```\n\n# Output:\n\
    Creating...\nObject: s1, Hashcode: [hash]\nObject: s2, Hashcode: [hash]\nCreating...\n\
    Object: s3, Hashcode: [hash]\n\nHow to fix: Runtime Exception if someone tries\
    \ to make instance in case instance already exists. This code will go into the\
    \ private constructor of the Singleton class.\n\n```java\nprivate SingletonR()\
    \ {\n    System.out.println(\"Creating...\");\n    if(instance != null) {\n  \
    \      throw new RuntimeException(\"can't create instance. Please use getInstance());\n\
    \    }\n}\n```\n\n# Output post fix:\nCreating...\nObject: s1, Hashcode: [hash]\n\
    Object: s2, Hashcode: [hash]\n"
  mdcn: "\n\n# JAVA 设计模式\n\nDevendra Singh\n\n# JAVA 设计模式\n\n作者：\nDevendra Singh\n\
    \n@Copyright 2016 Dev S\n\n## 前言\n\n本技术电子书以最易于理解的方式提供了关于 Java 设计模式的信息。它包含了对每个\
    \ Java 设计模式的详细描述，并结合了最简单的真实世界案例。书中提供的所有示例均已在我的开发环境中经过编译和运行。我已尽力在书中提供最简单的示例。\n\n\
    本书面向 Java 开发者，无论初学者还是资深人士均适用。只要他/她通读全文并并提供的示例，任何 Java 开发者都能从中受益。我在编写本书时，考虑到了每个级别的开发者都能从中获益。\n\
    \n编写本电子书的动力源于我学习 Java 设计模式的时期。想要在一或两次阅读中理解每一种模式并不是易事。我查阅了该主题的各种书籍和材料，并尝试提取关于不同模式的相关事实，以便快速轻松地理解它们。我将所有这些相关且关键的点都包含了书中。\n\
    \n在开始之前，我想介绍一下我自己。我是一个 Java 开发者，在 Java/J2EE 技术领域拥有超过 10 年的经验。目前，我在一家跨国软件公司工作。我的爱好之一是编写技术内容。我花了一些时间写了这本书，并非常高兴能与其他开发者分享我的经验和知识。如果你在阅读本电子书期间有任何建议、更正或疑问，请随时与我联系\
    \ erdsingh24@gmail.com\n\n## 目录\n\n- 关于设计模式\n- 单例模式\n- 工厂模式\n- 抽象工厂模式\n- 建造器模式\n\
    - 原型模式\n- 适配器模式\n- 组合模式\n- 代理模式\n- Facade 模式\n- 装饰器模式\n- 权重模式\n- 模板方法模式\n- 中调器模式\n\
    - 责任链\n- 观察者模式\n- 策略模式\n- 访问者模式\n- 状态模式\n- 迭代器模式\n- 解释器模式\n- 备忘录\n\n## 关于设计模式\n\
    \n如果一个问题反复出现，那么该问题的解决方案就已经被有效地使用了。这种解决方案被描述为“模式”。设计模式是解决常见面向对象设计模式的与语言无关的策略。当你进行设计时，你应该知道一些常用解决方案的名称。学习设计模式有助于人们之间进行有效的交流。事实上，你可能已经熟悉某些设计模式，只是可能没有使用广为人知的名称来描述它们。Sun\
    \ 建议参考 GOF（四人帮——编写了《设计模式：可重用面向对象软件的基础》的四位先驱），因此我们以这本书作为指南来描述解决方案。请确保熟悉这些术语，并学习他人如何解决编码问题。\n\
    \n如果你想成为一名专业的 Java 开发者，你应该至少知道一些解决问题的流行解决方案。这些解决方案已被经验丰富的开发者证明是高效且有效的。学习设计模式可以加速你在\
    \ OAA/OOD 方面的经验积累。一旦你掌握了它们，你将终身受益，并实现飞跃，成为设计和开发的大师。此外，你将能够使用这些术语与同事或评估者进行更有效的交流。\n\
    \n许多拥有多年经验的程序员并不了解设计模式，但作为一个面向对象的程序员，你必须了解它们，特别是对于新的 Java 开发者来说。你可能没有使用流行的名称来描述它，或者可能没有选择更有效的方法来从逻辑上更好地控制你构建的内容。学习经验丰富的开发者如何解决编码问题并尝试将它们应用到你的项目中，是获得经验和认证的最好方法。\n\
    \n记住，学习设计模式将真正改变你使用代码的方式；你不仅会变得更聪明，听起来也会更聪明得多。GOF 的 23 种设计模式是广为人知的，在旅途中还会发现更多。\n\
    \n设计模式有三种著名的类型：\n\n创建型设计模式：创建型设计模式为特定情况下以最佳方式实例化对象提供了解决方案。以下设计模式属于这一类：\n\n- 单例模式\n\
    - 工厂模式\n- 抽象工厂模式\n- 建造器模式\n- 原型模式\n\n结构型设计模式：结构模式提供了创建类结构的不同方法，例如使用继承和组合从小对象创建大对象。以下设计模式属于这一类：\n\
    \n- 适配器模式\n- 组合模式\n- 代理模式\n- 权重模式\n- Facade 模式\n- 桥接模式\n- 装饰器模式\n\n行为型设计模式：行为型模式为对象之间更好的交互提供了解决方案，并提供了如何实现解耦和易于扩展的方法。以下设计模式属于这一类：\n\
    \n- 模板方法模式\n- 中调器模式\n- 责任链模式\n- 观察者模式\n- 策略模式\n- 命令模式\n- 状态模式\n- 访问者模式\n- 迭代器模式\n\
    - 解释器模式\n- 备忘录模式\n\n## 单例模式\n\n有时，对于某些类来说，只有一个实例是非常重要的。许多对象我们只需要一个实例，如果我们实例化了多个，就会遇到各种问题，如程序行为不正确、资源过度使用或结果不一致。\n\
    \n单例设计模式的定义中只有两点：\n\n- 一个类只允许存在一个实例，并且\n- 我们应该允许对该实例提供全局访问点。\n\n从定义上看，这似乎是一个非常简单的设计模式，但在涉及实现时，它带有许多实现方面的考虑。Java\
    \ 单例模式的实现一直是开发者之间备受争议的话题。我们将学习单例模式的原则、实现单例模式的不同方法以及其使用的一些最佳实践。\n\n当我们希望延迟初始化到需要它时，懒性初始化将是有益的。因为如果我们使用饿性初始化且一旦初始化失败，将没有机会进一步获取实例；而在懒初始化中，我们有第二次机会。在懒初始化中，在我们调用\
    \ `getInstance()` 方法之前不会获取实例，而饿性初始化是在类加载时创建实例。\n\n在某些情况下可以发现单例模式被违反的情况。\n\n我们将比较对象的哈希值来验证相似的对象。如果两个对象的哈希值相等，那么这些对象必须是相等的。\n\
    \n- 反射：通过反射我们可以在运行时将私有构造函数设置为可访问，如下例所示。\n\n```java\nimport java.lang.reflect.Constructor;\n\
    public class SingletonR {\n    private static SingletonR instance=new SingletonR();\n\
    \    private SingletonR() {\n        System.out.println(\"Creating...\");\n  \
    \  }\n    public static SingletonR getInstance() {\n        return instance;\n\
    \    }\n    public static void main(String[] args) throws Exception {\n      \
    \  SingletonR s1 = SingletonR.getInstance();\n        SingletonR s2 = SingletonR.getInstance();\n\
    \        print(\"s1\", s1);\n        print(\"s2\", s2);\n        Class cls = Class.forName(\"\
    com.dev.dp.creational.singleton.SingletonR\");\n        Constructor<SingletonR>\
    \ ctor = cls.getDeclaredConstructor();\n        ctor.setAccessible(true);\n  \
    \      SingletonR s3 = ctor.newInstance();\n        print(\"s3\", s3);\n    }\n\
    \    static void print(String name, Object obj) {\n        System.out.println(String.format(\"\
    Object: %s, Hashcode: %d\",name,obj.hashCode()));\n    }\n}\n```\n\n# 输出：\nCreating...\n\
    Object: s1, Hashcode: [hash]\nObject: s2, Hashcode: [hash]\nCreating...\nObject:\
    \ s3, Hashcode: [hash]\n\n如何修复：如果实例已存在，有人尝试实例化，则抛出运行时异常。这段代码将进入单例类的私有构造函数。\n\n\
    ```java\nprivate SingletonR() {\n    System.out.println(\"Creating...\");\n  \
    \  if(instance != null) {\n        throw new RuntimeException(\"can't create instance.\
    \ Please use getInstance());\n    }\n}\n```\n\n# 修复后的输出：\nCreating...\nObject:\
    \ s1, Hashcode: [hash]\nObject: s2, Hashcode: [hash]\n\n"
