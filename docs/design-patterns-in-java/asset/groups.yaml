    \n# ITERATOR PATTERN\n\nIterator pattern in one of the behavioral pattern and\
    \ it's used to provide a standard way to traverse through a group of Objects.\
    \ Iterator pattern is widely used in java collection framework where Iterator\
    \ interface provides methods for traversing through a collection.\n\nThe logic\
    \ for iteration is embedded in the collection itself and it helps client program\
    \ to iterate over them easily.\n\nIterator pattern is not only about traversing\
    \ through a collection; we can provide different kind of iterators based on our\
    \ requirements. Iterator pattern hides the actual implementation of traversal\
    \ through the collection and client programs just use iterator methods. An Iterator\
    \ object contains public methods to allow a client object to navigate through\
    \ the list of objects within the container.\n\n# Iterator\n\n- Defines an interface\
    \ for accessing and traversing elements.\n\n# ConcreteIterator\n\n- Implements\
    \ the Iterator interface.\n- Keeps track of the current position in the traversal\
    \ of the aggregate.\n\n# Aggregate\n\n- Defines an interface for creating an Iterator\
    \ object.\n\n# ConcreteAggregate\n\n- Implements the Iterator creation interface\
    \ to return an instance of the proper ConcreteIterator.\n\n# When to use the Iterator\
    \ Design Pattern:\n\nUse the Iterator pattern:\n\n- To access an aggregate object’s\
    \ contents without exposing its internal representation.\n- To support multiple\
    \ traversals of aggregate objects.\n- To provide a uniform interface for traversing\
    \ different aggregate structures (that is, to support polymorphic iteration).\n\
    - Iterator pattern is useful when you want to provide a standard way to iterate\
    \ over a collection and hide the implementation from client program.\n\n# Iterator\
    \ Pattern in JDK:\n\n- java.util.Iterator\n- java.util.Enumeration\n\n# INTERPRETER\
    \ PATTERN\n\nInterpreter pattern is one of the behavioral design patterns and\
    \ is used to define a grammatical representation for a language and provides an\
    \ interpreter to deal with this grammar. The best example of this pattern is java\
    \ compiler that interprets the source code into byte code that is understandable\
    \ by JVM. Google Translator is also an example of interpreter pattern where the\
    \ input can be in any language and we can get the output interpreted in another\
    \ language.\n\nTo implement interpreter pattern, we need to create Interpreter\
    \ context engine that will do the interpretation work and then we need to create\
    \ different Expression implementations that will consume the functionalities provided\
    \ by the interpreter context. Finally we need to create the client that will take\
    \ the input from user and decide which Expression to use and then generate output\
    \ for the user.\n\n# When to use the Interpreter Design Pattern\n\nUse the Interpreter\
    \ pattern when there is a language to interpret, and you can represent statements\
    \ in the language as abstract syntax trees. The Interpreter pattern works best\
    \ when:\n\n- The grammar is simple. For complex grammars, the class hierarchy\
    \ for the grammar becomes large and unmanageable. Tools such as parser generators\
    \ are a better alternative in such cases. They can interpret parse expressions\
    \ without building abstract syntax trees, which can save space and possibly time.\n\
    \n- Efficiency is not a critical concern. The most efficient interpreters are\
