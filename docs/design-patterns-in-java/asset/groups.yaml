    \ on client code.\n\n- Facade pattern can be applied at any point of development,\
    \ usually when the number of interfaces grows and system gets complex.\n- Subsystem\
    \ interfaces are not aware of Facade and they shouldn’t have any reference of\
    \ the Facade interface.\n- Facade pattern should be applied for similar kind of\
