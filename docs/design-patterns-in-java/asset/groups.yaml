- md: "\n# MEDIATOR PATTERN\n\nMediator promotes loose coupling by keeping objects\
    \ from referring to each other explicitly, and it lets you vary their interaction\
    \ independently.\n\nMediator design pattern is used to provide a centralized communication\
    \ medium between different objects in a system.\n\nRather than interacting directly\
    \ with each other, objects ask the Mediator to interact on their behalf which\
    \ ensures reusability and loose coupling. It encapsulates the interaction between\
    \ the objects and makes them independent from each other. This allows them to\
    \ vary their interaction with other objects in a totally different way by implementing\
    \ a different mediator. The Mediator helps to reduce the complexity of the classes.\
    \ Each object no longer has to know in detail how to interact with the other objects.\
    \ The coupling between objects goes from brittle to loose and agile.\n\nMediator\
    \ design pattern is very helpful in an enterprise application where multiple objects\
    \ are interacting with each other. If the objects interact with each other, the\
    \ system components are tightly-coupled with each other that make maintainability\
    \ cost higher and not flexible to extend easily. Mediator pattern focuses on a\
    \ mediator between objects for communication and help in implementing loose-coupling\
    \ between objects.\n\nAir traffic controller is a great example of mediator pattern\
    \ where the airport control room works as a mediator for communication between\
    \ different flights. Mediator works as a router between objects and it can have\
    \ its own logic to provide way of communication.\n\nThe major participants of\
    \ the Mediator pattern are:\n\n- *Mediator*: Defines an interface for communicating\
    \ with Colleague objects.\n- *ConcreteMediator*: Implements cooperative behavior\
    \ by coordinating Colleague objects. It also knows and maintains its colleagues.\n\
    - *Colleague Classes*: Each Colleague class knows its Mediator objects. Each colleague\
    \ communicates with its mediator whenever it would have otherwise communicated\
    \ with another colleague.\n\n```java\n/**\n * Colleague A to talk, and Colleague\
    \ B wants to fight with mediator.\n * when they do some action(i.e., something()),\n\
    \ * they invoke mediator to do that.\n */\npublic interface Mediator {\n    public\
    \ void talk();\n    public void fight();\n    public void registerA(ColleagueA\
    \ a);\n    public void registerB(ColleagueB b);\n}\n```\n\n```java\npublic class\
    \ ConcreteMediator implements IMediator {\n\n    ColleagueA talk;\n    ColleagueB\
    \ fight;\n\n    @Override\n    public void talk() {\n        System.out.println(\"\
    Mediator is talking\");\n        // let the talk colleague do some stuff\n   \
    \ }\n\n    @Override\n    public void fight() {\n        System.out.println(\"\
    Mediator is fighting\");\n        // let the fight colleague do some stuff\n \
    \   }\n\n    @Override\n    public void registerA(ColleagueA a) {\n        this.talk=a;\n\
    \    }\n\n    @Override\n    public void registerB(ColleagueB b) {\n        this.fight=b;\n\
    \    }\n}\n```\n\n```java\npackage com.dev.dp.behavioral.mediator;\n\npublic abstract\
    \ class Colleague {\n    IMediator mediator;\n    public abstract void doSomething();\n\
    }\n```\n\n```java\npackage com.dev.dp.behavioral.mediator;\n\npublic class ColleagueA\
    \ extends Colleague {\n\n    public ColleagueA(IMediator mediator) {\n       \
    \ this.mediator=mediator;\n        this.mediator.registerA(this);\n    }\n\n \
    \   @Override\n    public void doSomething() {\n        this.mediator.talk();\n\
    \    }\n}\n```\n\n```java\npackage com.dev.behavioral.mediator;\npublic class\
    \ ColleagueB extends Colleague {\n    public ColleagueB(IMediator mediator) {\n\
    \        this.mediator=mediator;\n        this.mediator.registerB(this);\n   \
    \ }\n\n    @Override\n    public void doSomething() {\n        this.mediator.fight();\n\
    \    }\n}\n```\n\n```java\npackage com.dev.behavioral.mediatorPatternTest {\n\
    public class MediatorTest {\n    public static void main(String[] args) {\n  \
    \      IMediator mediator = new ConcreteMediator();\n\n        ColleagueA talkColleague\
    \ = new ColleagueA(mediator);\n        talkColleague.doSomething();\n\n      \
    \  ColleagueB fightColleague = new ColleagueB(mediator);\n        fightColleague.doSomething();\n\
    \    }\n}\n```\n\n# When to use the Mediator Pattern:\n\n- A set of objects communicate\
    \ in well-defined but complex ways. The resulting interdependencies are unstructured\
    \ and difficult to understand.\n- Reusing an object is difficult because it refers\
    \ to and communicates with many other objects.\n- A behavior that's distributed\
    \ between several classes should be customizable without lot of sub-classing.\n\
    \n# Mediator Pattern in JDK:\n\n- java.util.Timer class scheduleXXX () methods.\n\
    - java Concurrency Executor execute () method.\n- java.lang.reflect.Method invoke\
    \ () method.\n\n# CHAIN OF RESPONSIBILITY\n\nChain of responsibility pattern is\
    \ used to achieve loose coupling in software design where a request from client\
    \ is passed to a chain of objects to process them. Then the object in the chain\
    \ will decide themselves who is processing the request and whether the request\
    \ is required to be sent to the next object in the chain or not.\n\nWhen there\
    \ is more than one objects that can handle or fulfill a client request, the pattern\
    \ recommends giving each of these objects a chance to process the request in some\
    \ sequential order. Applying the pattern in such a case, each of these these potential\
    \ handlers can be arranged in the form of a chain, with each object having a reference\
    \ to the next object in the chain. The first object in the chain receives the\
    \ request and decides either to handle the request or to pass it to the next object\
    \ in the chain. The request flows through all objects in the chain one after the\
    \ other until the request is handled by one of the handlers in the chain or reaches\
    \ the end of the chain without getting processed.\n\nLet's see the example of\
    \ chain of responsibility pattern in JDK and then we will proceed to implement\
    \ a real example of this pattern. We know that we can have multiple blocks in\
    \ a try-catch block code. Every catch block is kind of a processor to process\
    \ that particular exception. So when any exception occurs in the try block send\
    \ its to the first catch block to process. If the catch block is not able to process\
    \ it, it forwards the request to next object in chain i.e. next catch block. Even\
    \ if the last block is not able to process it, the exception is thrown outside\
    \ of the chain to the calling program.\n\nOther examples are ATM money dispenser,\
    \ Servlet Filter and finally java's own Exception Handling mechanism. We know\
    \ exception handling better than anybody else and we are daily living with it.\
    \ This qualifies as the best example for chain of responsibility.\n\nIn ATM Dispense\
    \ machine, the user enters the amount to be dispensed and the machine dispense\
    \ amount in terms of defined currency bills such as $50, $20, $10 etc. If the\
    \ user enters an amount that is not multiples of 10, it throws error.\n\n```java\n\
    //This class is the request object.\npublic class Number {\n    private int number;\n\
    \n    public int getNumber() {\n        return number;\n    }\n\n    public Number(int\
    \ num){\n        number=num;\n    }\n}\n```\n\n```java\n//This is the interface\
    \ that acts as a chain link.\npublic interface Chain {\n    public void setNext(Chain\
    \ nextChain);\n    public void process(Number request);\n}\n```\n\n```java\npackage\
    \ com.dev.dp.behavioral.chainOfResponsibility;\npublic class PositiveNumberProcessor\
    \ implements Chain {\n    private Chain nextChain;\n\n    @Override\n    public\
    \ void setNext(Chain c) {\n        nextChain = c;\n    }\n\n    @Override\n  \
    \  public void process(Number request) {\n        if (request.getNumber() > 0)\
    \ {\n            System.out.println(\"PositiveNumberProcessor : \" + request.getNumber());\n\
    \        } else {\n            nextChain.process(request);\n        }\n    }\n\
    }\n```\n\n```java\npackage com.dev.dp.behavioral.chainOfResponsibility;\npublic\
    \ class NegativeNumberProcessor implements Chain {\n    private Chain nextChain;\n\
    \n    @Override\n    public void setNext(Chain c) {\n        nextChain = c;\n\
