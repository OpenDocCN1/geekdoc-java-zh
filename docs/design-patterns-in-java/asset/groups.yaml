    # COMMAND PATTERN\n\nThe command pattern is a behavioral design pattern. In the\
    \ command pattern, a Command interface declares a method for executing () a particular\
    \ action. Concrete Command classes implement the execute () method of the Command\
    \ interface, and this execute () invokes the appropriate action method of a Receiver\
    \ class that the Concrete Command class contains. The Receiver performs a particular\
    \ action. A Client class is responsible for creating a Concrete Command and setting\
    \ the Receiver of the Concrete Command. An Invoker class contains a reference\
    \ to a Command and has a method to execute the Command.\n\nIn the command pattern,\
    \ the invoker is decoupled from the action performed by the receiver. The invoker\
    \ has no knowledge of the receiver. The invoker invokes a command, and the command\
    \ executes the appropriate action of the receiver. Thus, the invoker can invoke\
    \ commands without knowing the details of the action to be performed. In addition,\
    \ this decoupling means that changes to the receiver's action don't directly affect\
    \ the invocation of the action.\n\nThe command pattern can be used to perform\
    \ 'undo' functionality. In this case, the Command interface should include an\
    \ executed () method.\n\nIn other words, it's used to implement loose coupling\
    \ in a request-response model. In command pattern, the request is sent to the\
    \ invoker and invoker passes it to the encapsulated command object. Command object\
    \ passes the request to the appropriate method of Receiver to perform the specific\
    \ action. The client program creates the receiver object and then attaches it\
    \ to the Command. Then it creates the invoker object and attaches the command\
    \ object to perform an action. Now when client executes the action, it's processed\
    \ based on the command and receiver object.\n\nTo understand command design pattern\
    \ we should understand the associated key terms like client, command implementation,\
    \ invoker, and receiver.\n\n- * Command is an interface with execute method. It\
    \ is the core of contract.\n\n- * A client creates an instance of a command implementation\
    \ and associates it with a receiver.\n\n- * An invoker instructs the command to\
    \ perform an action.\n\n- * A Command implementation's instance creates a binding\
    \ between the receiver and the action.\n\n- * Receiver is the object that knows\
    \ the actual steps to perform the action. Any class may serve as a Receiver .\n\
    \n```java\n/**\n * Command interface with an execute() method.\n */\npublic interface\
    \ Command {\n\n    public void execute();\n\n}\n```\n\n```java\n/**\n * Lunch\
    \ is a receiver.\n */\npublic class Lunch {\n\n    public void makeLunch() {\n\
    \        System.out.println(\"Lunch is being made\");\n    }\n}\n```\n\n```java\n\
    /**\nLunchCommand implements Command. It contains a reference to Lunch, a receiver.\n\
    \ * Its execute() method invokes the appropriate action on the receiver.\n */\n\
    public class LunchCommand implements Command {\n\n    Lunch lunch;\n\n    public\
    \ LunchCommand(Lunch lunch) {\n        this.lunch = lunch;\n    }\n\n    @Override\n\
    \    public void execute() {\n        lunch.makeLunch();\n    }\n}\n```\n\n```java\n\
    /**\nDinner is also a receiver.\n */\npublic class Dinner {\n\n    public void\
    \ makeDinner() {\n        System.out.println(\"Dinner is being made.\");\n   \
    \ }\n}\n```\n\n```java\n/**\nThe DinnerCommand is similar to LunchCommand.\n *\
    \ It contains a reference to Dinner, a receiver.\n * Its execute() method invokes\
    \ the makeDinner() action of the Dinner.\n */\npublic class DinnerCommand implements\
    \ Command {\n\n    Dinner dinner;\n\n    public DinnerCommand(Dinner dinner) {\n\
    \        this.dinner = dinner;\n    }\n\n    @Override\n    public void execute()\
    \ {\n        dinner.makeDinner();\n    }\n}\n```\n\n```java\n/**\n* MealInvoker\
    \ is the class, the invoker to invoke.\n * It contains a reference to the Command\
    \ to invoke.\n * Its invoke() method calls the execute() method of the Command.\n\
    \ */\npublic class MealInvoker {\n\n    Command command;\n\n    public MealInvoker(Command\
    \ command) {\n        this.command = command;\n    }\n\n    public void setCommand(Command\
    \ command) {\n        this.command = command;\n    }\n\n    public void invoke()\
    \ {\n        command.execute();\n    }\n}\n```\n\n```java\npackage com.dev.dp.behavioral.command;\n\
    public class CommandPatternDemo {\n    public static void main(String[] args)\
    \ {\n        Lunch lunch = new Lunch(); // receiver\n        Command lunchCommand\
    \ = new LunchCommand(lunch); // client command\n\n        Dinner dinner = new\
    \ Dinner(); // receiver\n        Command dinnerCommand = new DinnerCommand(dinner);\
    \ // client command\n\n        MealInvoker mealInvoker = new MealInvoker(lunchCommand);\
