    # BRIDGE PATTERN


    When we have interface hierarchies in both interfaces as well as implementations,
    then builder design pattern is used to decouple the interfaces from implementation
    and hiding the implementation details from the client programs.


    According to GoF bridge design pattern is: Decouple an abstraction from its implementation
    so that the two vary independently.


    In the pattern bridge, we separate an abstraction and its implementation and develop
    separate inheritance structures for both the abstraction and the implementer.
    The abstraction is an interface or abstract class, The abstraction contains a
    reference to the implementer. Children of the concrete implementer is likewise
    an interface or abstract class. The abstraction are referred to as refined abstractions,
    and children of the implementer are concrete implementers. Since we are can change
    the reference to the implementer in the abstraction, we are able to change the
    abstraction''s implementer at run-time. Changes to the implementer do not affect
    client code.


    The Bridge Pattern''s intent is to decouple an abstraction from its implementation
    so that the two vary independently. It puts the abstraction and implementation
    into two different class hierarchies so that both can be extend independently.


    # BEFORE BRIDGE DESIGN PATTERN


    ![](img/776807b1115a8bf86c1ed9d6357c6fe1_48_0.png)


    # AFTER BRIDGE DESIGN PATTERN'
