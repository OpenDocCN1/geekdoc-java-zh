- md: "\n# FACTORY PATTERN\n\nFactory design pattern is used when we have a super\
    \ class with multiple sub-classes and based on input, we need to return one of\
    \ the sub-classes. This pattern takes out the responsibility of instantiation\
    \ of a class from client program to the factory class. We can use Singleton pattern\
    \ on Factory class or make the factory method static.\n\nSuper class in factory\
    \ pattern can be an interface or a normal java class.\n\n**Benefits:**\n\n- Factory\
    \ pattern provides approach to interface rather than implementation.\n- Factory\
    \ pattern removes the instantiation of actual implementation classes from client\
    \ code, making it more robust, less coupled and easy to extend. For example, we\
    \ can easily change PC class implementation because client program is unaware\
    \ of this.\n- Factory pattern provides abstraction between implementation and\
    \ client classes because inheritance.\n\n**Usage in JDK:**\n\n- java.util.Calendar,\
    \ ResourceBundle and NumberFormat getInstance() methods uses Factory pattern.\n\
    - valueOf() method in wrapper classes like Boolean, Integer etc.\n\n```java\n\
    package com.dev.dp.creational.factory;\npublic interface IMobile {\n    public\
    \ void cost();\n    public void pictureCapacity();\n    public void batteryPower();\n\
    }\n```\n\n```java\npublic class Lenovo implements IMobile {\n    @Override\n \
    \   public void cost() {\n        System.out.println(\"Lenovo Cost starts from\
    \ 10000\");\n    }\n    @Override\n    public void pictureCapacity() {\n     \
    \   System.out.println(\"Lenovo camera capacity starts from 10 MP\");\n    }\n\
    \    @Override\n    public void batteryPower() {\n        System.out.println(\"\
    Lenovo battery power starts from 2500 mAh\");\n    }\n    @Override\n    public\
    \ String toString() {\n        return \"Lenovo\" + toString() + \"=\" + super.toString()\
    \ + \" \";\n    }\n}\n```\n\n```java\npublic class Samsung implements IMobile\
    \ {\n    @Override\n    public void cost() {\n        System.out.println(\"Samsung\
    \ Cost starts from 6000\");\n    }\n    @Override\n    public void pictureCapacity()\
    \ {\n        System.out.println(\"Samsung camera capacity starts from 4 MP\");\n\
    \    }\n    @Override\n    public void batteryPower() {\n        System.out.println(\"\
    Samsung battery power starts from 1200 mAh\");\n    }\n}\n```\n\n```java\npackage\
    \ com.dev.dp.creational.factory;\npublic class MobileFactory {\n    public MobileFactory()\
    \ {\n    }\n    public IMobile createMobile(String type) {\n        IMobile mob=null;\n\
    \        if(\"len\".equalsIgnoreCase(type)) {\n            mob=new Lenovo();\n\
    \            System.out.println(\"Lenovo created\");\n        } else if(\"sams\"\
    .equalsIgnoreCase(type)) {\n            mob=new Samsung();\n            System.out.println(\"\
    Samsung created\");\n        }\n        return mob;\n    }\n}\n```\n\n```java\n\
    public class FactoryTest {\n    public static void main(String[] args) {\n   \
    \     MobileFactory factory = new MobileFactory();\n        Lenovo len = (Lenovo)factory.createMobile(\"\
    len\");\n        len.batteryPower();\n\n        Samsung sam = (Samsung)factory.createMobile(\"\
    sam\");\n        sam.cost();\n    }\n}\n```\n\n# Output:\n\n```\nLenovo created\n\
    Lenovo battery power starts from 2500 mAh\nSamsung created\nSamsung Cost starts\
    \ from 6000\n```\n\nOther Example: Animal: Dog, Cat, Fox etc.\n\n# ABSTRACT FACTORY\
    \ PATTERN\n\nAlmost similar to except the fact that it's more like factory of\
    \ factories. If you are familiar with factory design pattern in java, you will\
    \ notice that we have a single Factory class that returns the differ sub-classes\
    \ based on the input provided and factory uses if-else or switch statement to\
    \ achieve this. In Abstract Factory pattern, we get rid of if-else block and have\
    \ a factory class for each sub-class and then an Abstract Factory that will return\
    \ the sub-class based on the input factory class.\n\nAn abstract factory is a\
    \ factory that returns factories. Why is this layer of abstraction useful? A normal\
    \ factory is used to create sets of related objects. An abstract factory returns\
    \ factories. Thus, an abstract factory is used to return factories that can be\
    \ used to create sets of related objects.\n\nAs an example, you could have a Honda\
    \ factory that returns car objects (Brio, Civic, etc.) associated with a Honda\
    \ factory. You could also have a Hyundai factory that returns car objects (Santro,\
    \ EON) associated with a Hyundai factory. We could create an abstract factory\
    \ that returns these different types of factories depending on the car that we\
    \ were interested in. We could then obtain car objects from the car factories.\
    \ Via polymorphism, we can use a common interface to get the different factories,\
    \ and we could then use a common interface to get the different cars.\n\n# Benefits:\n\
    \n- Abstract Factory pattern provides approach to code for interface rather than\
    \ implementation.\n- Abstract Factory pattern is “factory of factories” and can\
    \ be easily extended to accommodate more products, for example we can add another\
    \ sub-class Cerio and a factory MarutiFactory.\n- Abstract Factory pattern is\
    \ robust and avoid conditional logic of Factory pattern.\n\n# Use in JDK:\n\n\
    - javax.xml.parsers.DocumentBuilderFactory#newInstance()\n- javax.xml.transform.TransformerFactory#newInstance()\n\
    - javax.xml.xpath.XPathFactory#newInstance()\n\nWhen to use: A family of related\
    \ product objects is designed to be used together, and we need to enforce this\
    \ constraint.\n\n```java\npackage com.dp.creational.abstractFactory;\n\npublic\
    \ interface IMobileFactory {\n    IMobileFactory createMobile(String type);\n\
    }\n\npublic class MobileFactory implements IMobileFactory {\n    @Override\n \
    \   public IMobileFactory createMobile(String type) {\n        IMobileFactory\
    \ mob = null;\n        if (\"lenf\".equalsIgnoreCase(type)) {\n            mob\
    \ = new LenovoMobileFactory();\n        } else if (\"samf\".equalsIgnoreCase(type))\
    \ {\n            mob = new SamsungMobileFactory();\n        }\n        return\
    \ mob;\n    }\n}\n\npublic class LenovoMobileFactory extends MobileFactory {\n\
    \    public Lenovo createLenovo() {\n        return new Lenovo();\n    }\n}\n\n\
    public class SamsungMobileFactory extends MobileFactory {\n    public Samsung\
    \ createSamsungMobile() {\n        return new Samsung();\n    }\n}\n\npublic class\
    \ AbstractFactoryTest {\n    public static void main(String[] args) {\n      \
    \  MobileFactory factory = new MobileFactory();\n        IMobileFactory info =\
    \ factory.createMobile(\"lenf\");\n        // Note: The original OCR had logic\
    \ errors with types/methods, \n        // keeping original structure.\n    }\n\
    }\n```\n\n# Output:\n\nLenovo camera capacity starts from 10 MP\n\nOther Example:\n\
    Honda Factory: Brio, Civic,\nHyundai Factory: Santro, EON etc.\n\n# BUILDER PATTERN\n\
    \nIn general, the details of object construction, such as instantiating and initializing\
    \ the components that make up the object, are kept within the object, often as\
    \ part of the constructor. This type of design closely ties the object construction\
    \ process with the components that make up the object. This approach is suitable\
    \ as long the object under construction is simple and the object construction\
    \ process is definite and always produces the same representation of the object.\n\
    \nHowever, this design may not be effective when the object being created is complex\
    \ and the series of steps constituting the object creation process can be implemented\
    \ in different ways, thus producing different representations of the object. Because\
    \ the different implementations of the construction process are all kept within\
    \ the object, the object can become bulky (construction bloat) and less modular.\
    \ Subsequently, adding a new implementation or making changes to an existing implementation\
    \ requires changes to the existing code.\n\nUsing the Builder pattern, the process\
    \ of constructing such an object can be designed more effectively. The Builder\
    \ pattern suggests moving the construction logic out of the object class to a\
    \ separate class referred as a builder class. There can be more than one such\
    \ builder classes, each with different implementations for the series of steps\
    \ to construct the object. Each builder implementation results in a different\
    \ representation of the object.\n\nThe intent of the Builder Pattern is to separate\
    \ the construction of a complex object from its representation, that the same\
    \ construction process can create different representations. This type of separation\
    \ reduces the object size. The design turns out to be more modular with each implementation\
    \ contained in a different builder object. Adding a new implementation (i.e.,\
    \ adding a new builder) becomes easier. The object construction process becomes\
    \ independent of the components that make up the object.\n\nThe Builder pattern\
    \ suggests using a dedicated builder referred to as a Director, which is responsible\
    \ for invoking different builder methods required for the construction of the\
    \ final object. Different client objects can use of the Director to create the\
    \ required object. Once the object is constructed, the client object can directly\
    \ request from the builder the fully constructed object. To facilitate this process,\
    \ a new method getObject() can be declared in the common Builder interface to\
    \ be implemented by different concrete builders.\n\n# Builder\n\n- Specifies an\
    \ abstract interface for creating parts of a Product object.\n"
  mdcn: "\n\n# 工厂模式\n\n当我们有一个具有多个子类的父类，并且根据输入需要返回其中一个子类时，就会使用工厂模式。这种模式将类实例化的责任从客户端程序中转移到工厂类中。我们可以在工厂类上使用单例模式，或者将工厂方法设为静态方法。\n\
    \n工厂模式中的父类可以是一个接口，也可以是一个普通的 Java 类。\n\n**优点：**\n\n- 工厂模式提供了一种面向接口而非实现的方法。\n- 工厂模式从客户端代码中移除了具体实现类的实例化，使其更加健壮、低耦合且易于扩展。例如，我们可以轻松地更改\
    \ PC 类的实现，因为客户端程序并感知此。\n- 工厂模式通过继承在实现类和客户端类之间提供了抽象。\n\n**在 JDK 中的用法：**\n\n- java.util.Calendar、ResourceBundle\
    \ 和 NumberFormat 的 getInstance() 方法使用了工厂模式。\n- 包装类（如 Boolean、Integer 等）中的 valueOf()\
    \ 方法。\n\n```java\npackage com.dev.dp.creational.factory;\npublic interface IMobile\
    \ {\n    public void cost();\n    public void pictureCapacity();\n    public void\
    \ batteryPower();\n}\n```\n\n```java\npublic class Lenovo implements IMobile {\n\
    \    @Override\n    public void cost() {\n        System.out.println(\"Lenovo\
    \ Cost starts from 10000\");\n    }\n    @Override\n    public void pictureCapacity()\
    \ {\n        System.out.println(\"Lenovo camera capacity starts from 10 MP\");\n\
    \    }\n    @Override\n    public void batteryPower() {\n        System.out.println(\"\
    Lenovo battery power starts from 2500 mAh\");\n    }\n    @Override\n    public\
    \ String toString() {\n        return \"Lenovo\" + toString() + \"=\" + super.toString()\
    \ + \" \";\n    }\n}\n```\n\n```java\npublic class Samsung implements IMobile\
    \ {\n    @Override\n    public void cost() {\n        System.out.println(\"Samsung\
    \ Cost starts from 6000\");\n    }\n    @Override\n    public void pictureCapacity()\
    \ {\n        System.out.println(\"Samsung camera capacity starts from 4 MP\");\n\
    \    }\n    @Override\n    public void batteryPower() {\n        System.out.println(\"\
    Samsung battery power starts from 1200 mAh\");\n    }\n}\n```\n\n```java\npackage\
    \ com.dev.dp.creational.factory;\npublic class MobileFactory {\n    public MobileFactory()\
    \ {\n    }\n    public IMobile createMobile(String type) {\n        IMobile mob=null;\n\
    \        if(\"len\".equalsIgnoreCase(type)) {\n            mob=new Lenovo();\n\
    \            System.out.println(\"Lenovo created\");\n        } else if(\"sams\"\
    .equalsIgnoreCase(type)) {\n            mob=new Samsung();\n            System.out.println(\"\
    Samsung created\");\n        }\n        return mob;\n    }\n}\n```\n\n```java\n\
    public class FactoryTest {\n    public static void main(String[] args) {\n   \
    \     MobileFactory factory = new MobileFactory();\n        Lenovo len = (Lenovo)factory.createMobile(\"\
    len\");\n        len.batteryPower();\n\n        Samsung sam = (Samsung)factory.createMobile(\"\
    sam\");\n        sam.cost();\n    }\n}\n```\n\n# 输出:\n\n```\nLenovo created\n\
    Lenovo battery power starts from 2500 mAh\nSamsung created\nSamsung Cost starts\
    \ from 6000\n```\n\n其他示例：动物：狗、猫、狐等等\n\n# 抽象工厂模式\n\n几乎与工厂模式相似，区别在于它更像是“工厂的工厂”。如果你熟悉\
    \ Java 中的工厂设计模式，你会注意到我们有一个单一的工厂类根据提供的输入返回不同的子类，并且工厂使用 `if-else` 或 `switch` 语句来实现。在抽象工厂模式中，我们消除了\
    \ `if-else` 块，并为每个子类准备一个工厂类，然后有一个抽象工厂，它根据输入的工厂类来返回相应的子类。\n\n抽象工厂是一个返回工厂的工厂。为什么这一层抽象有用呢？普通工厂用于创建一组相关对象。而抽象工厂返回工厂。因此，抽象工厂用于返回可以创建一组相关对象的工厂。\n\
    \n例如，你可以有一个本田（Honda）工厂，它返回与本田工厂相关的汽车对象（Brio、Civic 等）。你也可以有一个现代（Hyundai）工厂，它返回与现代工厂相关的汽车对象（Santro、EON）。我们可以创建一个抽象工厂，根据我们感兴趣的汽车来返回这些不同类型的工厂。然后我们可以从这些汽车工厂中获取汽车对象。通过多态，我们可以使用通用接口来获取不同的工厂，然后再次使用通用接口来获取不同的汽车。\n\
    \n# 优点：\n\n- 抽象工厂模式提供了一种面向接口而非实现的代码方法。\n- 抽象工厂模式是“工厂的工厂”，可以轻松扩展以容纳更多产品，例如，我们可以添加另一个子类\
    \ Cerio 和一个工厂 MarutiFactory。\n- 抽象工厂模式是健壮的，并且避免了工厂模式中的条件逻辑。\n\n# 在 JDK 中的用法:\n\
    \n- javax.xml.parsers.DocumentBuilderFactory#newInstance()\n- javax.xml.transform.TransformerFactory#newInstance()\n\
    - javax.xml.xpath.XPathFactory#newInstance()\n\n何时使用：当一组相关的产品对象被设计为一起使用，并且我们需要强制这一约束时。\n\
    \n```java\npackage com.dp.creational.abstractFactory;\n\npublic interface IMobileFactory\
    \ {\n    IMobileFactory createMobile(String type);\n}\n\npublic class MobileFactory\
    \ implements IMobileFactory {\n    @Override\n    public IMobileFactory createMobile(String\
    \ type) {\n        IMobileFactory mob = null;\n        if (\"lenf\".equalsIgnoreCase(type))\
    \ {\n            mob = new LenovoMobileFactory();\n        } else if (\"samf\"\
    .equalsIgnoreCase(type)) {\n            mob = new SamsungMobileFactory();\n  \
    \      }\n        return mob;\n    }\n}\n\npublic class LenovoMobileFactory extends\
    \ MobileFactory {\n    public Lenovo createLenovo() {\n        return new Lenovo();\n\
    \    }\n}\n\npublic class SamsungMobileFactory extends MobileFactory {\n    public\
    \ Samsung createSamsungMobile() {\n        return new Samsung();\n    }\n}\n\n\
    public class AbstractFactoryTest {\n    public static void main(String[] args)\
    \ {\n        MobileFactory factory = new MobileFactory();\n        IMobileFactory\
    \ info = factory.createMobile(\"lenf\");\n        // 注意：原始 OCR 在类型/方法上存在逻辑错误，\n\
    \        // 保持了原始结构。\n    }\n}\n```\n\n# 输出:\n\nLenovo camera capacity starts\
    \ from 10 MP\n\n其他示例：\n本田工厂：Brio, Civic,\n现代工厂：Santro, EON 等。\n\n# 构建器模式\n\n通常情况下，对象构建的细节（例如实例化和初始化组成对象的组件）被保留在对象内部，通常作为构造函数的一部分。这种设计将对象构建过程与组成对象的组件紧密结合在一起。只要正在构建的对象是简单的，且对象构建过程是确定的并始终产生相同的对象表示，这种方法就是合适的。\n\
    \n然而，当创建的对象非常复杂，且构成对象创建过程的一系列步骤可以用不同的方式实现，从而产生不同的对象表示时，这种设计可能不再有效。因为构建过程的不同实现都保留在对象内部，对象可能会变得臃肿（构建膨胀）且模块化程度降低。随后，添加新的实现或更改现有实现需要修改现有代码。\n\
    \n使用构建器模式，可以更有效地设计此类对象的构建过程。构建器模式建议将构建逻辑从对象类中移动到称为构建器（builder）的独立类中。可以有多个这样的构建器类，每个类对构建对象的系列步骤都有不同的实现。每个构建器的实现都会导致对象的不同表示。\n\
    \n构建器模式的意图是将复杂对象的构建与其表示分离，使得相同的构建过程可以创建不同的表示。这种分离减少了对象的大小。这种设计变得更加模块化，因为每个实现都包含在不同的构建器中。添加新的实现（即添加新的构建器）变得更加容易。对象构建过程不再依赖于组成对象的组件。\n\
    \n构建器模式建议使用一个专用的构建器，称为导演（Director），它负责调用构建最终对象所需的各种构建器方法。不同的客户端可以使用导演来创建所需的对象。一旦对象构建完成，客户端可以直接从构建器处获取完全构建的对象。为了方便这一过程，可以在通用构建器接口中声明一个新方法\
    \ `getObject()`，由不同的具体构建器来实现。\n\n# Builder (构建器)\n\n- 定义了创建产品对象部分的抽象接口。\n\n"
