    \ of each of the algorithms in a separate class. Each algorithm encapsulated in\
    \ a separate class is referred to as a strategy. An object that uses a Strategy\
    \ object is often referred to as a context object.\n\nIn other words, Strategy\
    \ pattern is used when we have multiple algorithms for a specific task and client\
