    \n# Chain of Responsibility Pattern Examples in JDK:\n\n- java.util.logging.Logger#log()\n\
    \n- javax.servlet.Filter#doFilter()\n\n# OBSERVER PATTERN\n\nIn observer design\
    \ pattern multiple observer objects registers with a subject for change notification.\
    \ When the state of subject changes, it notifies the observers. Objects that listen\
