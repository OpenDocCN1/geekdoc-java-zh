    - IndianMealBuilder.java\n- JapaneseMealBuilder.java\n- Meal.java\n- MealBuilder.java\n\
    - MealDirector.java\n\n## Another form of the Builder Pattern:\n\nSometimes there\
    \ is an object with a long list of properties.\n\nThe question is, what sort of\
    \ constructor should we write for such class? Writing a constructor with long\
    \ list of parameters is not a good choice, this could frustrate the client especially\
    \ if the important fields are only a few. This could increase the scope of error;\
    \ the client may provide a value accidentally to a wrong field. Long sequences\
    \ of identically typed parameters can cause subtle bugs. If the client reverses\
    \ two such parameters, the compiler won't complain, but the program will misbehave\
    \ at runtime.\n\nInstead of making the desired object directly, the client calls\
    \ a constructor with all of the required parameters and gets a builder object.\
    \ The client calls setter-methods on the builder object to set each optional parameter\
    \ of interest. Finally, the client calls a parameterless method to generate the\
    \ object.\n\n- First of all you need to create a static nested class and copy\
    \ all the arguments to the outer class is the Builder class. We should follow\
    \ the naming convention and if the class name is Cake then builder class should\
    \ be named as CakeBuilder.\n\n- The Builder class should have a public constructor\
    \ with all the required attributes as parameters.\n\n- Builder should have methods\
    \ to set the optional parameters and it should return the same Builder object\
    \ after setting the optional attribute.\n\n- The final step is to provide a build()\
    \ method in the builder class that will return the Object needed by client program.\
    \ For this we need to have a private constructor in the Class with Builder as\
    \ argument.\n\n```java\nclass Cake {\n    private double sugar; //cup\n    private\
    \ double butter; //cup\n    private double milk; //cup\n    private int cherry;\
    \ //cup\n\n    public static class CakeBuilder {\n        private double sugar;\n\
    \        private double butter;\n        private double milk;\n        private\
    \ int cherry;\n\n        public CakeBuilder sugar(double sugar) {\n          \
    \  this.sugar = sugar;\n            return this;\n        }\n        public CakeBuilder\
    \ butter(double butter) {\n            this.butter = butter;\n            return\
    \ this;\n        }\n        public CakeBuilder milk(double milk) {\n         \
    \   this.milk = milk;\n            return this;\n        }\n        public CakeBuilder\
    \ cherry(int cherry) {\n            this.cherry = cherry;\n            return\
    \ this;\n        }\n\n        public Cake build() {\n            return new Cake(this.sugar,\
    \ this.butter, this.milk, this.cherry);\n        }\n    }\n\n    private Cake(double\
    \ sugar, double butter, double milk, int cherry) {\n        this.sugar = sugar;\n\
    \        this.butter = butter;\n        this.milk = milk;\n        this.cherry\
    \ = cherry;\n    }\n}\n```\n\n```java\n// private constructor to enforce object\
    \ creation through builder\nprivate Cake(CakeBuilder builder) {\n    this.sugar\
    \ = builder.sugar;\n    this.butter = builder.butter;\n    this.milk = builder.milk;\n\
    \    this.cherry = builder.cherry;\n}\n```\n\n```java\n@Override\npublic String\
    \ toString() {\n    return \"Cake[\" + sugar + \", butter=\" + butter + \", milk=\"\
    \ + milk + \"]\";\n}\n```\n\n```java\npublic class BuilderPattern {\n    public\
    \ static void main(String[] args) {\n        // Creating object using Builder\
    \ pattern\n        Cake cake = new CakeBuilder().sugar(0.5).butter(0.5).milk(0.5).build();\n\
    \        \n        // Cake is ready to eat!\n        System.out.println(cake);\n\
    \    }\n}\n```\n\nOutput: Cake[sugar=1.0, butter=0.5, milk=0.5, cherry=0]\n\n\
    In static setting property, we can use setter method as another option.\nAs you\
    \ can clearly see, now client only needs to provide the mandatory fields and the\
    \ fields which are important to him. To form the object now, we need to invoke\
    \ the CakeBuilder constructor which takes the mandatory fields and then we need\
    \ to call the required methods and it finally the build method to get the form\
    \ object.\n\n## When to use the Builder Pattern:\n\n- The algorithm for creating\
    \ a complex object object should be independent of the parts that make up the\
    \ object and how they’re assembled.\n\n- The construction process must allow different\
    \ representations for the object that’s constructed.\n\n## Builder Pattern in\
    \ JDK:\n\n- java.lang.StringBuilder#append() (unsynchronized)\n- java.lang.StringBuilder#append()\
    \ (synchronized)\n- java.nio.ByteBuffer#put() (also on CharBuffer, ShortBuffer,\
    \ IntBuffer, LongBuffer, FloatBuffer and DoubleBuffer)\n- javax.swing.GroupLayout.Group#addComponent()\n\
    - All implementations of java.lang.Appendable.\n\n## PROTOTYPE PATTERN\n\nPrototype\
    \ pattern is one of the Creational Design patterns, so it provides a mechanism\
    \ of object creation. Prototype pattern is used when the Object creation is a\
    \ costly affair and requires a lot of time and resources and you have a similar\
    \ object already existing. This so pattern provides a mechanism to copy the original\
    \ object to a new object and then modify it according to our needs. This pattern\
    \ uses java cloning to the object.\n\nIt would be easy to understand this pattern\
    \ with an example, suppose we have an Object that loads data from database. Now\
    \ we need to modify this data in our program multiple times, so it's not a good\
    \ idea to create the Object using new keyword and load all the data from database.\
    \ So the better approach is to clone the existing object into a new object and\
    \ then do the data manipulation.\n\nPrototype design pattern mandates the Object\
    \ which you are copying should provide the copying feature. It should not be done\
    \ by any other class. However whether to use shallow or deep copy of the Object\
    \ properties depends on the requirements and it's a design decision.\n\nOne example\
    \ of how this is useful is if an original object is created with a resource such\
    \ as a data stream that may not be available at the time that a clone of the object\
    \ is needed. Another example is if the original object creation involves a significant\
    \ time commitment, such as reading data from a database or over a network.\n\n\
    Normally in Java, if you'd like to use cloning (i.e., the prototype pattern),\
    \ you can utilize the clone() method and the Cloneable interface. By default,\
    \ clone() performs a shallow copy. Serializable can be used to simplify deep copying.\n\
    \nHowever, we can implement our own prototype pattern. To do so, we'll create\
    \ a Prototype interface that features a doClone() method.\n\nBelow example describes\
    \ how to design an advanced bike after cloning the basic bike object.\n\n```java\n\
    public class Bike implements Cloneable {\n    private int gears;\n    private\
    \ String bitype;\n    private String model;\n\n    public Bike() {\n        betype=\"\
    Standard\";\n        model=\"leopard\";\n        gears=4;\n    }\n\n    public\
    \ Bike clone() {\n        return new Bike();\n    }\n\n    public void makeAdvanced()\
    \ {\n        betype=\"Advanced\";\n        model=\"Jaguar\";\n        gears=6;\n\
    \    }\n\n    public String getModel() {\n        return model;\n    }\n\n   \
    \ @Override\n    public String toString() {\n        return \"Bike[gears=\" +\
    \ gears + \", bitype=\" + bitype + \", model=\" + model + \"]\";\n    }\n}\n```\n\
    \n```java\npublic class PrototypeTest {\n    public Bike makeJaguar(Bike basicBike)\
    \ {\n        basicBike.makeAdvanced();\n        return basicBike;\n    }\n\n \
    \   public static void main(String[] args) {\n        Bike bike = new Bike();\n\
    \        PrototypeTest pt = new PrototypeTest();\n        Bike advancedBike =\
    \ pt.makeJaguar(bike);\n        System.out.println(\"Prototype Design Pattern:\
    \ \"+advancedBike.getModel());\n        System.out.println(\"Prototype Design\
    \ Pattern: \"+advancedBike.toString());\n    }\n}\n```\n\n# Output:\n\nPrototype\
    \ Design Pattern: Jaguar\nPrototype Design Pattern: Bike [gears=6, bitype=Advanced,\
    \ model=Jaguar]\n"
  mdcn: "\n\n## ConcreteBuilder\n\n- 通过实现 Builder 接口来构造和组装产品的各个部分。\n- 定义并跟踪它所创建的表示。\n\
    - 提供一个获取产品的接口。\n\n## Director\n\n- 使用 Builder 接口构造对象。\n\n## Product\n\n- 代表正在构建的复杂对象。ConcreteBuilder\
    \ 构建产品的内部表示，并定义了其组装过程。\n- 包含定义组成部分的类，包括将部分组装成最终结果的接口。\n\n示例：\ncom.dev.dp.creational.builder2\n\
    - BuilderTest.java\n- IndianMealBuilder.java\n- JapaneseMealBuilder.java\n- Meal.java\n\
    - MealBuilder.java\n- MealDirector.java\n\n## 构建器模式的另一种形式：\n\n有时一个对象具有很很长的属性列表。\n\
    \n问题是，对于此类类我们应该编写什么样的构造函数？编写一个带有长参数列表的构造函数并不是一个好的选择，这会让客户端感到困扰，特别是当重要的字段只有几个时。这可能会增加错误的范围；客户端可能会无意中为错误的字段提供值。类型相同的参数长序列会导致微妙的\
    \ bug。如果客户端反转了两个这样的参数，编译器不会报错，但程序在运行时会发生异常。\n\n客户端不是直接创建所需的对象，而是调用带有所有必需参数的构造函数并获取一个构建器对象。客户端在构建器对象上调用\
    \ setter 方法来设置感兴趣的每个可选参数。最后，客户端调用一个无参数的方法来生成对象。\n\n- 首先，你需要创建一个静态内部类，并将所有参数拷贝到外层类的\
    \ Builder 类中。我们应该遵循命名规范，如果类名是 Cake，那么构建器类应该被命名为 CakeBuilder。\n\n- Builder 类应该有一个公有构造函数，并将所有必需属性作为参数传入。\n\
    \n- Builder 应该有方法来设置可选参数，并且在设置可选属性后应该返回同一个 Builder 对象。\n\n- 最后一步是在构建器类中提供一个 `build()`\
    \ 方法，该方法将返回客户端程序所需的对象。为了实现这一点，我们需要在类中有一个以 Builder 为参数的私有构造函数。\n\n```java\nclass\
    \ Cake {\n    private double sugar; //cup\n    private double butter; //cup\n\
    \    private double milk; //cup\n    private int cherry; //cup\n\n    public static\
    \ class CakeBuilder {\n        private double sugar;\n        private double butter;\n\
    \        private double milk;\n        private int cherry;\n\n        public CakeBuilder\
    \ sugar(double sugar) {\n            this.sugar = sugar;\n            return this;\n\
    \        }\n        public CakeBuilder butter(double butter) {\n            this.butter\
    \ = butter;\n            return this;\n        }\n        public CakeBuilder milk(double\
    \ milk) {\n            this.milk = milk;\n            return this;\n        }\n\
    \        public CakeBuilder cherry(int cherry) {\n            this.cherry = cherry;\n\
    \            return this;\n        }\n\n        public Cake build() {\n      \
    \      return new Cake(this.sugar, this.butter, this.milk, this.cherry);\n   \
    \     }\n    }\n\n    private Cake(double sugar, double butter, double milk, int\
    \ cherry) {\n        this.sugar = sugar;\n        this.butter = butter;\n    \
    \    this.milk = milk;\n        this.cherry = cherry;\n    }\n}\n```\n\n```java\n\
    // 私有构造函数强制通过 builder 创建对象\nprivate Cake(CakeBuilder builder) {\n    this.sugar\
    \ = builder.sugar;\n    this.butter = builder.butter;\n    this.milk = builder.milk;\n\
    \    this.cherry = builder.cherry;\n}\n```\n\n```java\n@Override\npublic String\
    \ toString() {\n    return \"Cake[\" + sugar + \", butter=\" + butter + \", milk=\"\
    \ + milk + \"]\";\n}\n```\n\n```java\npublic class BuilderPattern {\n    public\
    \ static void main(String[] args) {\n        // 使用构建器模式创建对象\n        Cake cake\
    \ = new CakeBuilder().sugar(0.5).butter(0.5).milk(0.5).build();\n        \n  \
    \      // Cake 准备好了！\n        System.out.println(cake);\n    }\n}\n```\n\n输出：Cake[sugar=1.0,\
    \ butter=0.5, milk=0.5, cherry=0]\n\n在静态设置属性时，我们可以使用 setter 方法作为另一种选择。\n如你清楚看到的，现在客户端只需要提供强制性字段以及对他重要的字段。要形成该对象，我们需要调用带有强制性字段的\
    \ CakeBuilder 构造函数，然后调用所需的方法，最后调用 build 方法来获取对象对象。\n\n## 何时使用构建器模式：\n\n- 创建复杂对象的算法应该独立于组成对象的各个部分以及它们的组装方式。\n\
    \n- 构建过程必须允许为所构建的对象提供不同的表示。\n\n## JDK 中的构建器模式：\n\n- java.lang.StringBuilder#append()\
    \ (非同步)\n- java.lang.StringBuilder#append() (同步)\n- java.nio.ByteBuffer#put()\
    \ (也用于 CharBuffer, ShortBuffer, IntBuffer, LongBuffer, FloatBuffer 和 DoubleBuffer)\n\
    - javax.swing.GroupLayout.Group#addComponent()\n- java.lang.Appendable 的所有实现。\n\
    \n## 原型模式\n\n原型模式是创建型模式之一，因此它提供了一种对象创建机制。当对象的创建是一项昂贵事务，需要大量的时间资源，且你已经存在一个相似的对象时，可以使用原型模式。这种模式提供了一种将原始对象拷贝到新对象的机制，然后根据我们的需要对其修改。该模式使用\
    \ java 的克隆机制到对象。\n\n通过示例可以很容易理解这种模式，假设我们有一个从数据库加载数据的对象。现在我们需要在程序中多次修改这些数据，因此使用\
    \ `new` 关键字创建对象并从数据库加载所有数据并不是一个好主意。更好的方法是将现有对象克隆到新对象中，然后进行数据操作。\n\n原型设计模式强制要求正在拷贝的对象应该提供拷贝功能。它不应该由任何其他类完成。然而，对对象属性使用浅拷贝还是深拷贝取决于需求，这是一项设计决策。\n\
    \n这种模式实用的一个例子是：如果原始对象创建时使用的资源（如数据流）在需要克隆该对象的时间点可能是不可用的。另一个例子是原始对象的创建涉及大量的时间投入，例如从数据库或网络读取数据。\n\
    \n通常在 Java 中，如果你想使用克隆（即原型模式），可以利用 `clone()` 方法和 `Cloneable` 接口。默认情况下，`clone()`\
    \ 执行浅拷贝。可以使用 `Serializable` 来简化深拷贝。\n\n然而，我们可以实现自己的原型模式。为了做到，我们将创建一个包含 `doClone()`\
    \ 方法的 `Prototype` 接口。\n\n下面的示例描述了在克隆基础自行车对象后如何设计一辆高级自行车。\n\n```java\npublic class\
    \ Bike implements Cloneable {\n    private int gears;\n    private String bitype;\n\
    \    private String model;\n\n    public Bike() {\n        betype=\"Standard\"\
    ;\n        model=\"leopard\";\n        gears=4;\n    }\n\n    public Bike clone()\
    \ {\n        return new Bike();\n    }\n\n    public void makeAdvanced() {\n \
    \       betype=\"Advanced\";\n        model=\"Jaguar\";\n        gears=6;\n  \
    \  }\n\n    public String getModel() {\n        return model;\n    }\n\n    @Override\n\
    \    public String toString() {\n        return \"Bike[gears=\" + gears + \",\
    \ bitype=\" + bitype + \", model=\" + model + \"]\";\n    }\n}\n```\n\n```java\n\
    public class PrototypeTest {\n    public Bike makeJaguar(Bike basicBike) {\n \
    \       basicBike.makeAdvanced();\n        return basicBike;\n    }\n\n    public\
    \ static void main(String[] args) {\n        Bike bike = new Bike();\n       \
    \ PrototypeTest pt = new PrototypeTest();\n        Bike advancedBike = pt.makeJaguar(bike);\n\
