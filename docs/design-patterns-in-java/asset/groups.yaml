    \ interfaces that does the similar kind of jobs.\n- Subsystem may be dependent\
    \ with one another. In such case, facade can act as a coordinator and decouple\
    \ the dependencies between the subsystems.\n- We can use factory design pattern\
    \ with Facade to provide better interface to client systems.\n\n## Usage in Java:\n\
    \nIn javax.faces.context, ExternalContext internally uses ServletContext, HttpSession,\
    \ HttpServletRequest, HttpServletResponse, etc. It allows the Faces API to be\
    \ unaware of the nature of its containing application environment.\n\n## BRIDGE\
    \ PATTERN\n\nWhen we have interface hierarchies in both interfaces as well as\
    \ implementations, then builder design pattern is used to decouple the interfaces\
    \ from implementation and hiding the implementation details from the client programs.\n\
    \nAccording to GoF bridge design pattern is: Decouple an abstraction from its\
    \ implementation so that the two vary independently.\n\nIn the pattern bridge,\
    \ we separate an abstraction and its implementation and develop separate inheritance\
    \ structures for both the abstraction and the implementer. The abstraction is\
    \ an interface or abstract class, The abstraction contains a reference to the\
    \ implementer. Children of the concrete implementer is likewise an interface or\
    \ abstract class. The abstraction are referred to as refined abstractions, and\
    \ children of the implementer are concrete implementers. Since we are can change\
    \ the reference to the implementer in the abstraction, we are able to change the\
    \ abstraction's implementer at run-time. Changes to the implementer do not affect\
    \ client code.\n\nThe Bridge Pattern's intent is to decouple an abstraction from\
    \ its implementation so that the two vary independently. It puts the abstraction\
    \ and implementation into two different class hierarchies so that both can be\
    \ extend independently.\n\n## BEFORE BRIDGE DESIGN PATTERN\n\n![](img/776807b1115a8bf86c1ed9d6357c6fe1_48_0.png)\n\
    \n## AFTER BRIDGE DESIGN PATTERN\n\n![](img/776807b1115a8bf86c1ed9d6357c6fe1_49_0.png)\n\
    \nThe adapter design pattern helps in making two incompatible classes to work\
    \ together. But, bridge design pattern decouples the abstraction and implementation\
    \ by creating two different hierarchies.\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    /**\n * abstraction in bridge pattern\n */\npublic abstract class Vehicle {\n\
    \    protected VehicleType type1;\n    protected VehicleType type2;\n\n    public\
    \ Vehicle(VehicleType type1, VehicleType type2) {\n    this.type1 = type1;\n \
    \       this.type2 = type2;\n    }\n\n    abstract public void purchase();\n}\n\
    ```\n\n```java\npackage com.dev.dp.structural.bridge;\n/**\n * Implementor for\
    \ bridge pattern\n */\npublic interface VehicleType {\n    abstract public void\
    \ book();\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n/**\n * Refine\
    \ abstraction 1 in bridge pattern\n */\npublic class Car extends Vehicle {\n \
    \   public Car(VehicleType type1, VehicleType type2) {\n        super(type1, type2);\n\
    \    }\n    @Override\n    public void purchase() {\n        System.out.print(\"\
    Car\");\n        type1.book();\n        type2.book();\n    }\n}\n```\n\n```java\n\
    package com.dev.dp.structural.bridge;\n/**\n * Refine abstraction 2 in bridge\
    \ pattern\n */\npublic class Bike extends Vehicle {\n    public Bike(VehicleType\
    \ type1, VehicleType type2) {\n        super(type1, type2);\n    }\n    @Override\n\
    \    public void purchase() {\n        System.out.print(\"Bike\");\n        type1.book();\n\
    \        type2.book();\n    }\n}\n```\n\n```java\npackage com.dev.dp.structural.bridge;\n\
    /**\n * Concrete implementation 1 for bridge pattern\n */\npublic class NewVehicle\
    \ implements VehicleType {\n    @Override\n    public void book() {\n        System.out.print(\"\
    \ New Vehicle\");\n    }\n}\n```\n\n```java\npackage com.dp.structural.bridge;\n\
    /**\n * Concrete implementation 2 for bridge pattern\n */\npublic class OldVehicle\
    \ implements VehicleType {\n\n    @Override\n    public void body() {\n      \
    \  System.out.println(\" Old Vehicle\");\n    }\n}\n```\n\n```java\npackage com.dp.structural.bridge;\n\
    public class BridgePatternTest {\n    public static void main(String[] args) {\n\
    \        Vehicle vehicle1 = new Car(new NewVehicle(),new OldVehicle());\n    \
    \    vehicle1.purchase();\n\n        Bike vehicle2 = new Bike(new NewVehicle(),new\
    \ OldVehicle());\n        vehicle2.purchase();\n    }\n}\n```\n\n## Output:\n\n\
    Car New Vehicle Old Vehicle\nBike New Vehicle Old Vehicle\n\n## Summary of Bridge\
    \ Design Pattern:\n\n- Creates two different hierarchies. One for abstraction\
    \ and another for implementation.\n- Avoids permanent binding by removing the\
    \ dependency between abstraction and implementation.\n- We create a bridge that\
    \ coordinates between abstraction and implementation.\n- Abstraction and implementation\
    \ can be extended separately.\n- Should be used when we have needed to switch\
    \ implementation at runtime.\n- Client should not be impacted if there is modification\
    \ in implementation of abstraction.\n- Best used when you have multiple implementations.\n\
    \n## Usage in Java:\n\n- AWT\n- JDBC\n\n## DECORATOR PATTERN\n\nThe intent of\
    \ Decorator pattern is to attach additional responsibilities to an object dynamically.\
    \ This provides a flexible alternative to subclassing for extending functionality.\n\
    \nThe Decorator class has the same interface as the object it wraps. It contains\
    \ a reference to the actual object. Decorator receives all requests from a client\
    \ and in turn forwards these calls to the underlying object.\n\nComponent Interface\
    \ – The interface or abstract class defining the methods that will be implemented.\
    \ In our case Icecream will be the component interface.\n\n```java\npackage com.dev.dp.structural.decorator;\n\
    public interface Icecream {\n    public String makeIcecream();\n}\n```\n\nComponent\
    \ Implementation – The basic implementation of the component interface. We can\
    \ have Simpleicecream as component implementation.\n\n```java\npackage com.dev.dp.structural.decorator;\n\
    public class Simpleicecream implements Icecream {\n    @Override\n    public String\
    \ makeIcecream() {\n        return \"Base-Icecream\";\n    }\n}\n```\n\nDecorator\
    \ – Decorator class implements the component interface and it has HAS-A relationship\
    \ with the component interface. The component variable should be accessible to\
    \ the child decorator classes, so we will make this variable protected.\n\n```java\n\
    package com.dev.dp.structural.decorator;\npublic abstract class IcecreamDecorator\
    \ implements Icecream {\nprotected Icecream specialIcecream;\n  public IcecreamDecorator(Icecream\
    \ specialIcecream) {\n    this.specialIcecream = specialIcecream;\n  }\n  @Override\n\
    \  public String makeIcecream() {\n    return specialIcecream.makeIcecream();\n\
    \  }\n}\n```\n\n## Concrete Decorators – Extending the base decorator functionality\
    \ and modifying the component behavior accordingly. We can have concrete decorator\
    \ classes as NuttyIcecreamDecorator & HoneyIcecreamDecorator.\n\n```java\npackage\
    \ com.dev.dp.structural.decorator;\npublic class NuttyDecorator extends IcecreamDecorator\
    \ {\n  public NuttyDecorator(Icecream specialIcecream) {\n    super(specialIcecream);\n\
    \  }\n  public String makeIcecream() {\n    return specialIcecream.makeIcecream()\
    \ + addNuts();\n  }\n  private String addNuts() {\n    return \"+ Crunchy Nuts\"\
    ;\n  }\n}\n```\n\n```java\npackage com.dev.dp.structural.decorator;\npublic class\
    \ HoneyDecorator extends IcecreamDecorator {\n  public HoneyDecorator(Icecream\
    \ specialIcecream) {\n    super(specialIcecream);\n  }\n  public String makeIcecream()\
    \ {\n    return specialIcecream.makeIcecream() + addHoney();\n  }\n  private String\
    \ addHoney() {\n    return \"+ Sweet Honey\";\n  }\n}\n```\n"
