- md: "\n# VISITOR PATTERN\n\nVisitor pattern is used when we have to perform an operation\
    \ on a group of similar kind of Objects. With the help of visitor pattern, we\
    \ can move the operational logic from the objects to another class. For example,\
    \ think of a Shopping cart where we can add different type of items (Elements),\
    \ when we click on checkout button, it calculates the total amount to be paid.\
    \ Now we can have the calculation logic in item classes or we can move out this\
    \ logic to another class using visitor pattern. So using visitor pattern we can\
    \ move out logics to another class.\n\nThe Visitor pattern allows the operation\
    \ to be defined without changing the class of any of the objects in the collection.\
    \ To accomplish this, the Visitor pattern suggests defining the operation in a\
    \ separate class called as a visitor class. This separates the operation from\
    \ the object collection that it operates on. For every operation to be defined,\
    \ a new visitor class is created. Since the operation is to be performed across\
    \ a set of objects, the visitor needs a way of accessing the public members of\
    \ these objects.\n\nFollowing components are involved in visitor pattern.\n\n\
    - **Visitor:** Declares a Visit for each class of ConcreteElement in the object\
    \ structure. The operation's name and signature identifies the class that sends\
    \ the Visit request to the visitor. That lets the visitor determine the concrete\
    \ class of the element being visited. Then the visitor can access the element\
    \ directly through its particular interface.\n\n- **ConcreteVisitor:** Implements\
    \ each operation declared by Visitor. Each operation implements a fragment of\
    \ the algorithm defined for the corresponding class of object in the structure.\
    \ ConcreteVisitor provides the context for the algorithm and stores in its local\
    \ state. This state often accumulates results during the traversal of the structure.\n\
    \n- **Element:** Defines an Accept operation that takes a visitor as an argument.\n\
    \n- **ConcreteElement:** Implements an Accept operation that takes a visitor as\
    \ an argument.\n\n- **ObjectStructure:**\n    - Can enumerate its elements.\n\
    \    - May provide a high-level interface to allow the visitor to visit its elements.\n\
    \    - May either be a composite or a collection such as a list or a set.\n\n\
    To implement visitor pattern, first of all we will create different type of items\
    \ (Elements) to be used in shopping cart.\n\n```java\npublic interface ShoppingCartElement\
    \ {\n    // Notice that accept method takes Visitor argument,\n    // we can have\
    \ other methods also specific for items for simplicity\n    // e.g. addItem()\
    \ and removeItem() focusing on visitor pattern only.\n    public int accept(ShoppingCartVisitor\
    \ visitor);\n}\n```\n\nLet’s create some concrete classes for different types\
    \ of item.\n\n```java\npackage com.dev.dp.behavioral.visitor;\npublic class Book\
    \ implements ShoppingCartElement {\n    private int price;\n    private String\
    \ isbnNumber;\n\n    public Book(int cost, String isbn) {\n        this.price=cost;\n\
    \        this.isbnNumber=isbn;\n    }\n\n    public int getPrice() {\n       \
    \ return price;\n    }\n\n    public String getIsbnNumber() {\n        return\
    \ isbnNumber;\n    }\n\n    @Override\n    //Notice the implementation of accept()\
    \ method in concrete classes,\n    // its calling visit() method of Visitor and\
    \ passing itself as argument.\n    public int accept(ShoppingCartVisitor visitor)\
    \ {\n        // TODO Auto-generated method stub\n        return visitor.visit(this);\n\
    \    }\n}\n```\n\n```java\npackage com.dp.behavioral.visitor;\n\npublic class\
    \ Fruit implements ShoppingCartElement {\n    private int pricePerKg;\n    private\
    \ int weight;\n    private String name;\n\n    public Fruit(int priceKg, int wt,\
    \ String name) {\n        this.pricePerKg=priceKg;\n        this.weight=wt;\n\
    \        this.name = name;\n    }\n\n    public int getPricePerKg() {\n      \
    \  return pricePerKg;\n    }\n\n    public int getWeight() {\n        return weight;\n\
    \    }\n\n    public String getName() {\n        return this.name;\n    }\n\n\
    \    @Override\n    public int accept(ShoppingCartVisitor visitor) {\n       \
    \ // TODO Auto-generated method stub\n        return visitor.visit(this);\n  \
    \  }\n}\n```\n\nWe have visit() method for different type of items in Visitor\
    \ interface that will be implemented by concrete visitor class.\n\n```java\npublic\
    \ interface ShoppingCartVisitor {\n    // No visit() method for different type\
    \ of items in Visitor interface\n    // that will be implemented by concrete visitor\
    \ class.\n    int visit(Book book);\n    int visit(Fruit fruit);\n}\n```\n\nNow\
    \ we will implement visitor interface and every item will have its own logic to\
    \ calculate the cost.\n\n```java\npublic class ShoppingCartVisitorImpl implements\
    \ ShoppingCartVisitor {\n    @Override\n    public int visit(Book book) {\n  \
    \      //apply 5% discount if book price is greater than 50\n        int cost;\n\
    \        if(book.getPrice() > 50) {\n            cost = book.getPrice() - 5;\n\
    \        } else {\n            cost = book.getPrice();\n        }\n        System.out.println(\"\
    Book ISBN:\"+book.getIsbnNumber() + \" - cost=\" + cost + \"\");\n        return\
    \ cost;\n    }\n\n    @Override\n    public int visit(Fruit fruit) {\n       \
    \ int cost = fruit.getPricePerKg() * fruit.getWeight();\n        System.out.println(fruit.getName()\
    \ + \" - cost=\" + cost + \"\");\n        return cost;\n    }\n}\n```\n\nLet’s\
    \ see how we can use it in client applications.\n\n```java\npublic class VisitorTest\
    \ {\n    public static void main(String[] args) {\n        ShoppingCartElement[]\
    \ items = new ShoppingCartElement[]{\n            new Book(20, \"1234\"),\n  \
    \          new Book(10, \"5678\"),\n            new Fruit(10, 1, \"Banana\"),\
    \ new Fruit(5, 5, \"Apple\")\n        };\n        ShoppingCartVisitor visitor\
    \ = new ShoppingCartVisitorImpl();\n        int total = 0;\n        for (ShoppingCartElement\
    \ item : items) {\n            total += item.accept(visitor);\n        }\n   \
    \     System.out.println(\"Total Cost \" + total);\n    }\n\n    private static\
    \ int calculatePrice(ShoppingCartElement[] items) {\n        ShoppingCartVisitor\
    \ visitor = new ShoppingCartVisitorImpl();\n        int sum = 0;\n        for\
    \ (ShoppingCartElement item : items) {\n            sum += item.accept(visitor);\n\
    \        }\n        return sum;\n    }\n}\n```\n\nOutput:\nBook ISBN:1234 - cost=20\n\
    Book ISBN:5678 - cost=10\nBanana - cost=10\nApple - cost=25\nTotal Cost 65\n\n\
