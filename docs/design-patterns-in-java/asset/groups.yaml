    \ in Java 8 and later versions."
  - "[PAGE 12]\n\n```\npublic class SingletonT {\n    private static SingletonT instance=null;//lazy\
    \ initialization\n\n    private SingletonT(){\n        System.out.println(\"Creating...\"\
    );\n    }\n\n    public static SingletonT getInstance(){\n        if (instance\
    \ == null) {\n            instance = new SingletonT();\n        }\n        return\
    \ instance;\n    }\n\n    public static void useSingleton() {\n        Singleton\
    \ singleton = SingletonT.getInstance();\n        print(singleton);\n    }\n\n\
    \    public static void main(String[] args) throws Exception {\n        ExecutorService\
    \ service = Executors.newFixedThreadPool(2);\n        service.submit(::useSingleton);\n\
    \        service.submit(::useSingleton);\n        service.shutdown();\n    }\n\
    \n    public static void print(String name, Object obj) {\n        System.out.println(String.format(\"\
    Object : %s, Hashcode: %d\", name, obj.hashCode()));\n    }\n}\n```\n\nCreating...\n\
    Object : singleton, Hashcode: 14229844\nObject : singleton, Hashcode: 14229844\n\
    \nWhen you run the program many times you will notice that in multithreaded environment\
    \ sometimes Singleton principle works but sometimes it violates. Therefore we\
    \ need to synchronize the getInstance() method as shown below.\n\n```\npublic\
    \ static synchronized SingletonT getInstance(){\n    if (instance == null) {\n\
    \        instance = new SingletonT();\n    }\n    return instance;\n}\n```\n\n\
    After applying synchronize keyword in the getInstance() method the program will\
    \ execute properly without any issue but Java instead of synchronizing whole method\
    \ we can synchronize only the block of code which is affected while creating instance\
    \ to escape the extra overhead as below.\n\n```\npublic static SingletonT getInstance(){\n\
    \    if (instance == null) {\n        synchronized (SingletonT.class) {\n    \
    \        instance = new SingletonT();\n        }\n    }\n    return instance;\n\
    }\n```"
  - "[PAGE 13]\n\nFrom the above code we have narrowed down the scope of synchronization\
    \ for performance reasons. Notice that if a thread at line # 28 sees instance\
    \ is null and then it gets the lock of object at line # 29. At the same time another\
    \ thread already has the lock it will create the instance. To make sure no other\
    \ thread has already acquired the lock we will apply one more check after acquiring\
    \ the lock as shown below. This method is called Double Checked Locking.\n\n```\n\
    public static SingletonT getInstance() {\n    if (instance == null) { // check\
    \ 1\n        synchronized (SingletonT.class) {\n            if (instance == null)\
    \ { // check 2\n                instance = new SingletonT();\n            }\n\
    \        }\n    }\n    return instance;\n\n```\n\nSometimes double checked locking\
    \ also breaks the Principle of Singleton.\n\nJava runtime publishes half initialized\
    \ variable. Suppose 2 threads thread1&thread2 are entering into the code it goes\
    \ through the line # 28 to line # 31 and created the instance. At the same time\
    \ thread 2 enters and it knows there is something in variable named as 'instance'\
    \ (which is at if half initialized state) and it returns the same from line #\
    \ 35. Therefore Singleton principle breaks.\n\nTo address this situation use volatile\
    \ keyword at the time of instance declaration. Value of volatile variable will\
    \ be published only when the change completes. Change to write operation happens\
    \ before read operation in volatile variable. In short all threads will see the\
    \ same value of variable.\n\n```\nprivate static volatile Singleton instance=null;\
    \ //lazy initialization\n```\n\n**Holder Class (Bill Pugh Method):** Bill Pugh\
    \ came up with a different approach to create the Singleton class using an inner\
    \ static helper class."
