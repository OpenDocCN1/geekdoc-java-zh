    # BUILDER PATTERN


    In general, the details of object construction, such as instantiating and initializing
    the components that make up the object, are kept within the object, often as part
    of the constructor. This type of design closely ties the object construction process
    with the components that make up the object. This approach is suitable as long
    the object under construction is simple and the object construction process is
    definite and always produces the same representation of the object.


    However, this design may not be effective when the object being created is complex
    and the series of steps constituting the object creation process can be implemented
    in different ways, thus producing different representations of the object. Because
    the different implementations of the construction process are all kept within
    the object, the object can become bulky (construction bloat) and less modular.
    Subsequently, adding a new implementation or making changes to an existing implementation
    requires changes to the existing code.


    Using the Builder pattern, the process of constructing such an object can be designed
    more effectively. The Builder pattern suggests moving the construction logic out
    of the object class to a separate class referred to as a builder class. There
    can be more than one such builder classes, each with different implementations
    for the series of steps to construct the object. Each builder implementation results
    in a different representation of the object.


    The intent of the Builder Pattern is to separate the construction of a complex
    object from its representation, that the same construction process can create
    different representations. This type of separation reduces the object size. The
    design turns out to be more modular with each implementation contained in a different
    builder object. Adding a new implementation (i.e., adding a new builder) becomes
    easier. The object construction process becomes independent of the components
    that make up the object. This provides more control over.


    The Builder pattern suggests using a dedicated builder referred to as a Director,
    which is responsible for invoking different builder methods required for the construction
    of the final object. Different client objects can use of the Director to create
    the required object. Once the object is constructed, the client object can directly
    request from the builder the fully constructed object. To facilitate this process,
    a new method getObject() can be declared in the common Builder interface to be
    implemented by different concrete builders.


    # Builder


    +   * Specifies an abstract interface for creating parts of a Product object.'
