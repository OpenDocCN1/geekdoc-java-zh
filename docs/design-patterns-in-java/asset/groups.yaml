    ## When to use the Decorator Design Pattern:\n\nUse the Decorator pattern in the\
    \ following cases:\n\n- * To add responsibilities to individual objects dynamically\
    \ and transparently, that is, without affecting other objects.\n- For responsibilities\
    \ that can be withdrawn.\n- When extension by sub-classing is impractical. Sometimes\
    \ a large number of independent extensions are possible and would produce an explosion\
    \ of subclasses for sub-classing. Or a class definition may be hidden or otherwise\
    \ unavailable.\n- It’s easy to maintain and extend when the number of choices\
    \ are more.\n\n## Usage in Java:\n\n- * Decorator pattern is used a lot in Java\
    \ IO classes, such as FileReader, BufferedReader etc.\n- The disadvantage of decorator\
    \ pattern is that it uses a lot of similar kind of objects (decorators).\n\n##\
    \ FLYWEIGHT PATTERN\n\nIn the flyweight pattern, instead of creating large numbers\
    \ of similar objects, objects are reused. This can be used to reduce memory requirements\
    \ and instantiation time and related costs.\n\nFlyweight design pattern is used\
    \ when we need to create a lot of Objects of a class. Since every object consumes\
    \ memory space that can be crucial for low memory devices, such as mobile devices\
    \ or embedded systems, flyweight design pattern can be applied to reduce the load\
    \ on memory by sharing objects.\n\nBefore we apply flyweight design pattern, we\
    \ need to consider following factors:\n\n- * The number of Objects to be created\
    \ by application can be huge.\n- The object creation is heavy on memory and it\
    \ can be time consuming too.\n\nSometimes too many objects can slow down things.\
    \ Too many objects might consume a large piece of memory and slow down the application\
    \ or even cause out of memory problems. As a good programmer, one should keep\
    \ of instantiated objects and control the object creation in an application. This\
    \ is especially true, when we have a lot of similar objects and two objects from\
    \ the pool don't have many differences between them.\n\nSometimes the objects\
    \ in an application might have great similarities and be of a similar kind (a\
    \ similar kind here means that most of their properties have similar values and\
    \ only a few of them vary in value). In case they are heavy objects to create,\
    \ they should be controlled by the application developer. Otherwise, they might\
    \ consume much of the memory and eventually slow down the whole application.\n\
    \nThe Flyweight Pattern is designed to control such kind of object creation and\
    \ provides you with a basic caching mechanism. It allows you to create one object\
    \ per type (the type differs by a property of that object), and if you ask for\
    \ an object with the same property (already created), it will return you the same\
    \ object instead of creating a new one.\n\n## Flyweight Pattern Example in JDK:\n\
    \nAll the wrapper classes valueOf method uses cached objects showing use of Flyweight\
    \ design pattern. The best example is Java String class String Pool implementation.\n\
    \n## TEMPLATE METHOD PATTERN\n\nThe Template Pattern defines the skeleton of an\
    \ algorithm in an operation, deferring some steps to subclasses. Template Method\
    \ lets subclasses to redefine certain steps of an algorithm without changing the\
    \ algorithm’s structure.\n\nThe Template Method pattern can be used in situations\
    \ when there is an algorithm, some steps of which could be implemented in different\
    \ ways. In such scenarios, the Template Method pattern suggests keeping the outline\
    \ of the algorithm in a separate method referred to as a template method inside\
    \ a class, which may be referred to as a template class, leaving out the specific\
    \ implementations of the variant portions (steps that can be implemented in multiple\
    \ ways) of the algorithm to different subclasses of this class.\n\nThe Template\
    \ class does not necessarily have to leave the implementation to subclasses in\
    \ its entirety. Instead, as part of providing the outline of the algorithm, the\
    \ Template class can also provide some amount of implementation that can be considered\
    \ as invariant across different implementations. It even provide default implementation\
    \ for the variant parts, if appropriate. Only specific details will be implemented\
    \ inside different subclasses. This type of implementation eliminates the need\
    \ for duplicate code, which means a minimum amount of code to be written.\n\n\
    - * Template method should consist of certain steps whose order is fixed and for\
    \ some of the methods; implementation differs from base class to subclass. Template\
    \ method should be final.\n- * Most of the times, subclasses calls methods from\
    \ super class but in template pattern, superclass template method calls methods\
    \ from subclasses, this is known as Hollywood Principle – “don’t call us, we’ll\
    \ call you.”\n- * Methods in base class with default implementation are referred\
    \ as Hooks and they are intended to be overridden by subclasses, if you want some\
    \ of the methods to not be overridden, you can make them final, for example in\
    \ our case we can make doPack() method final because if we don’t want subclasses\
    \ to override it.\n\n```java\npublic abstract class PurchaseOrderTemplate {\n\
    \    public abstract void doSelect();\n    public abstract void doPayment();\n\
    \    public final void doPack() {\n        System.out.println(\"Gift wrap done.\"\
    );\n    }\n    public abstract void doDelivery();\n    public final void processOrder()\
    \ {\n        doSelect();\n        doPayment();\n        doPack();\n        doDelivery();\n\
    \    }\n}\n```\n\n```java\npackage com.dev.dp.behavioral.templateMethod;\npublic\
    \ class StorePurchaseOrder extends PurchaseOrderTemplate {\n    @Override\n  \
    \  public void doSelect() {\n        System.out.println(\"Customer chooses the\
    \ item from shelf.\");\n    }\n    @Override\n    public void doPayment() {\n\
    \        System.out.println(\"Pays at counter through cash/POS\");\n    }\n  \
    \  @Override\n    public void doDelivery() {\n        System.out.println(\"Item\
    \ deliverd to delivery counter.\");\n    }\n}\n```\n\n```java\npackage com.dev.dp.behavioral.templateMethod;\n\
    public class OnlinePurchaseOrder extends PurchaseOrderTemplate {\n    @Override\n\
    \    public void doSelect() {\n        System.out.println(\"Item added to online\
    \ shopping cart,\");\n        System.out.println(\"Get gift wrap preference.\"\
    );\n        System.out.println(\"Get delivery address.\");\n    }\n    @Override\n\
    \    public void doPayment() {\n        System.out.println(\"Online Payment through\
    \ Netbanking/Cards.\");\n    }\n    @Override\n    public void doDelivery() {\n\
    \        System.out.println(\"Ship the item through to delivery address.\");\n\
    \    }\n}\n```\n\n```java\npackage com.dev.dp.behavioral.templateMethod;\npublic\
    \ class TemplateMethodPatternTest {\n    public static void main(String[] args)\
    \ {\n        PurchaseOrder online= new OnlinePurchaseOrder();\n        online.processOrder();\n\
    \        PurchaseOrder offline= new StorePurchaseOrder();\n        offline.processOrder();\n\
    \    }\n}\n```\n\nOutput:\n\n![](img/776807b1115a8bf86c1ed9d6357c6fe1_60_0.png)\n\
    \n## When to use the Template Design Pattern:\n\n- * To implement the invariant\
    \ parts of an algorithm once and leave it up to subclasses to implement the behavior\
    \ that can vary.\n- * When common behavior among subclasses should be factored\
    \ and localized in a common class to avoid code duplication. You first identify\
    \ the differences in the existing code and then separate the differences into\
    \ new operations. Finally, you replace the differing code with a template method\
    \ that calls one of these new operations.\n\n## Usage in JDK:\n\n- * All non-abstract\
    \ methods of java.io.InputStream, java.io.OutputStream, java.io.Reader and java.io.Writer.\
    \ e.g. - java.io.InputStream#skip (), java.io.InputStream#read ()\n- * All non-abstract\
    \ methods of java.util.AbstractList, java.util.AbstractSet and java.util.AbstractMap.\
    \ e.g. - java.util.AbstractList#indexOf (), java.util.Collections#sort ().\n"
  mdcn: "\n\n```java\npackage com.dev.dp.structural.decorator;\npublic class DecoratorPatternTest\
    \ {\n    public static void main(String[] args) {\n        Icecream icecream =\
    \ new HoneyDecorator(new NuttyDecorator(new SimpleIcecream()));\n        System.out.println(icecream.makeIcecream());\n\
    \    }\n}\n```\n\n# 输出:\n\n基础冰淇淋 + 脆坚果 + 甜蜂蜜\n\n## 何时使用装饰器模式：\n\n在以下情况下使用装饰器模式：\n\
    \n- * 动态且透明地为单个对象添加职责，即不影响其他对象。\n- * 适用于可以撤销的职责。\n- * 当通过子类进行扩展不实际可行时。有时可能存在大量的独立扩展，这会导致子类爆炸。或者类的定义可能被隐藏或在情况下不可用。\n\
    - * 当选择较多时，易于维护和扩展。\n\n## 在 Java 中的用法：\n\n- * 装饰器模式广泛用于 Java IO 类，例如 FileReader、BufferedReader\
    \ 等。\n- * 装饰器模式的缺点是它使用了许多相似类型的对象（装饰器）。\n\n## 享量模式 (FLYWEIGHT PATTERN)\n\n在享量模式中，我们不再创建大量相似的对象，而是复用对象。这可以用于减少内存需求、实例化时间以及相关成本。\n\
    \n当我们我们需要创建一个类的创建大量对象时，就会使用享量模式。由于每个对象都会消耗内存空间，这对于低内存设备（如移动设备或嵌入式系统）至关重要，因此可以使用享量模式通过共享对象来减轻内存负载。\n\
    \n在应用享量模式之前，我们需要考虑以下因素：\n\n- * 应用需要创建的对象数量可能是巨大的。\n- * 创建非常消耗内存，而且可能耗时。\n\n有时过多的对象会减慢速度。过对象可能会消耗大量内存并降低应用速度，甚至导致内存溢出问题。作为一个优秀的程序员，应该记录实例化的对象并控制应用程序中的对象创建。当我们有许多相似的对象，且池中的两个对象之间差异不大时，这一点尤为真实。\n\
    \n有时应用程序中的对象可能具有很高的相似性并属于相似类型（这里的相似类型意味着它们的大部分属性具有相似的值，只有少数属性的值不同）。如果这些是重量密集型对象，应该由应用程序开发者进行控制。否则，它们可能会消耗大量内存并最终减慢整个应用的运行。\n\
    \n享量模式旨在控制此类对象的创建，并为你提供一种基本的缓存机制。它允许你为每个类型创建一个对象（类型通过该对象的属性进行区分），如果你请求具有相同属性（已创建）的对象，它将返回同一个对象，而不是创建一个新的。\n\
    \n## JDK 中的享量模式示例：\n\n所有包装类类的 `valueOf` 方法都使用了缓存对象，这展示了享量设计模式的使用。最好的例子是 Java String\
    \ 类的字符串池实现。\n\n## 模板方法模式 (TEMPLATE METHOD PATTERN)\n\n模板模式在操作中定义了算法的骨架，并将某些步骤留给子类。模板方法允许子类在不改变算法结构的情况下重新定义算法的某些步骤。\n\
    \n当存在某种算法，且其中某些步骤可以通过不同的方式实现时，可以使用模板方法模式。在这种情况下，模板方法模式建议将算法的概述保留在类的一个独立方法中（称为模板方法），该类可以称为模板类，而将算法中变体部分（可以用多种方式实现的步骤）的具体实现留给该类的不同子类。\n\
    \n模板类并不一定需要将所有实现完全留给子类。相反，作为提供算法大纲的一部分，模板类也可以提供一些可以认为在不同实现之间保持不变的实现。如果合适，它甚至为变体部分提供默认实现。只有特定的细节将在不同的子类中实现。这种实现消除了重复代码的需求，这意味着需要编写的代码最少。\n\
    \n- * 模板方法应该由某些顺序固定的步骤组成，对于某些方法，其实现从基类到子类有所不同。模板方法应该是 `final` 的。\n- * 大多数情况下，子类调用父类的方法，但在模板模式中，父类的模板方法调用子类的方法，这被称为“好莱坞原则”——“不要叫我们，我们来叫你”。\n\
    - * 基类中具有默认实现的方法称为钩子方法 (Hooks)，它们旨在让子类重写。如果你希望某些方法不被重写，可以将它们设为 `final`，例如在我们的案例中，我们可以将\
    \ `doPack()` 方法设为 `final`，因为我们不希望子类重写它。\n\n```java\npublic abstract class PurchaseOrderTemplate\
    \ {\n    public abstract void doSelect();\n    public abstract void doPayment();\n\
    \    public final void doPack() {\n        System.out.println(\"Gift wrap done.\"\
    );\n    }\n    public abstract void doDelivery();\n    public final void processOrder()\
    \ {\n        doSelect();\n        doPayment();\n        doPack();\n        doDelivery();\n\
    \    }\n}\n```\n\n```java\npackage com.dev.dp.behavioral.templateMethod;\npublic\
    \ class StorePurchaseOrder extends PurchaseOrderTemplate {\n    @Override\n  \
    \  public void doSelect() {\n        System.out.println(\"Customer chooses the\
    \ item from shelf.\");\n    }\n    @Override\n    public void doPayment() {\n\
    \        System.out.println(\"Pays at counter through cash/POS\");\n    }\n  \
    \  @Override\n    public void doDelivery() {\n        System.out.println(\"Item\
    \ deliverd to delivery counter.\");\n    }\n}\n```\n\n```java\npackage com.dev.dp.behavioral.templateMethod;\n\
    public class OnlinePurchaseOrder extends PurchaseOrderTemplate {\n    @Override\n\
    \    public void doSelect() {\n        System.out.println(\"Item added to online\
    \ shopping cart,\");\n        System.out.println(\"Get gift wrap preference.\"\
    );\n        System.out.println(\"Get delivery address.\");\n    }\n    @Override\n\
    \    public void doPayment() {\n        System.out.println(\"Online Payment through\
    \ Netbanking/Cards.\");\n    }\n    @Override\n    public void doDelivery() {\n\
    \        System.out.println(\"Ship the item through to delivery address.\");\n\
    \    }\n}\n```\n\n```java\npackage com.dev.dp.behavioral.templateMethod;\npublic\
    \ class TemplateMethodPatternTest {\n    public static void main(String[] args)\
    \ {\n        PurchaseOrder online= new OnlinePurchaseOrder();\n        online.processOrder();\n\
    \        PurchaseOrder offline= new StorePurchaseOrder();\n        offline.processOrder();\n\
    \    }\n}\n```\n\n输出:\n\n![](img/776807b1115a8bf86c1ed9d6357c6fe1_60_0.png)\n\n\
    ## 何时使用模板设计模式：\n\n- * 为了一次实现算法的不变部分，并让子类来实现可变化的行为。\n- * 当子类之间的公共行为应该被提取并定位在公共类中以避免代码重复时。你首先识别现有代码中的差异，然后将差异分离到新操作中。最后，你用调用这些新操作之一的模板方法来替换不同的代码。\n\
    \n## JDK 中的用法：\n\n- * java.io.InputStream、java.io.OutputStream、java.io.Reader\
    \ 和 java.io.Writer 的所有非抽象方法。例如 - `java.io.InputStream#skip()`，`java.io.InputStream#read()`\n\
    - * java.util.AbstractList、java.util.AbstractSet 和 java.util.AbstractMap 的所有非抽象方法。例如\
    \ - `java.util.AbstractList#indexOf()`，`java.util.Collections#sort()`。\n\n"
