    \ subsystem easier to use.\n\nThe Facade does not encapsulate the subsystem classes\
    \ or interfaces; it provides a simplified interface to their functionality. A\
    \ client can access these classes directly. It still exposes the full functionality\
    \ of the system for the clients who may need it. It just provides a layer to the\
    \ complex interfaces of the sub-system which makes it easier to use.\n\nFacade\
    \ design pattern is one among the other design patterns that promote loose coupling.\
    \ It emphasizes one more important aspect of design which is abstraction. By hiding\
    \ the complexity behind exposing a simple interface it achieves abstraction.\n\
    \nFacade can wrap multiple classes, but a facade is used to an interface to simplify\
