    \ @Override\n    public void execute() {\n        dinner.makeDinner();\n    }\n\
    }\n```\n\n```java\n/**\n* MealInvoker 是用于调用的类，调用者。\n * 它包含一个对要调用的命令的引用。\n * 它的\
    \ invoke() 方法调用 Command 的 execute() 方法。\n */\npublic class MealInvoker {\n\n \
    \   Command command;\n\n    public MealInvoker(Command command) {\n        this.command\
    \ = command;\n    }\n\n    public void setCommand(Command command) {\n       \
    \ this.command = command;\n    }\n\n    public void invoke() {\n        command.execute();\n\
    \    }\n}\n```\n\n```java\npackage com.dev.dp.behavioral.command;\npublic class\
    \ CommandPatternDemo {\n    public static void main(String[] args) {\n       \
    \ Lunch lunch = new Lunch(); // 接收者\n        Command lunchCommand = new LunchCommand(lunch);\
