    \       return super.clone();\n    }\n\n    public static void main(String[] args)\
    \ throws Exception {\n        Singleton s1 = Singleton.getInstance();\n      \
    \  Singleton s2 = Singleton.getInstance();\n        print(\"s1\",s1);\n      \
    \  print(\"s2\",s2);\n\n        Singleton s3 = (Singleton)s1.clone();\n      \
    \  print(\"s3\",s3);\n    }\n\n    private static void print(String name, Object\
    \ obj) {\n        System.out.println(String.format(\"Object : %s, Hashcode: %d\"\
    ,name,obj.hashCode()));\n    }\n}\n```\n\nOutput:\n\nCreating...\nObject : s1,\
