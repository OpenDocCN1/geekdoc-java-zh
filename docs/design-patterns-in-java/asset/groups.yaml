    ## When to use Visitor Pattern:\n\nUse the Visitor pattern when:\n\n- An object\
    \ structure contains many classes with differing interfaces, and you want to perform\
    \ operations that depend on their concrete classes. The object structure is shared\
    \ by many applications, and you want to avoid “polluting” their classes with operations.\n\
    - The classes defining the object structure rarely change, but you often want\
    \ to define new operations. Changing the object structure requires redefining\
    \ all visitors, which is potentially costly. If the object structure classes change\
    \ often, then it’s probably better to define the operations in those classes.\n\
    \n## Visitor Pattern in JDK:\n\n- `javax.lang.model.element.Element` and `javax.lang.model.element.ElementVisitor`\n\
    - `javax.lang.model.type.TypeMirror` and `javax.lang.model.type.TypeVisitor`\n\
    \n# STATE PATTERN\n\nState design pattern is used when an Object change its behavior\
    \ when its internal state changes\n\nThe state of an object can be defined as\
    \ its exact condition at any given point of time, depending on the values of its\
    \ properties. The set of methods implemented by a class constitutes the behavior\
    \ of its instances. Whenever there is a change in the values of its attributes,\
    \ we say that the state of an object has changed.\n\nWhen a Context object is\
    \ first created, it initializes itself with its Initial State object. This State\
    \ object becomes the current State object for the context. By replacing the current\
    \ State object with a new State object, the context transitions to a new state.\
    \ When an application object makes a call to a Context method, it forwards the\
    \ method to its State object.\n\n**Context**: Defines the interface of interest\
    \ to clients.\n\n    - Maintains an instance of a ConcreteState subclass that\
    \ defines the current state.\n\n**State**: Defines an interface for encapsulating\
    \ the behavior associated with a particular state of the Context.\n\n**ConcreteState\
    \ subclasses**: Each subclass implements a behavior associated with a state of\
    \ the Context.\n\n```java\npublic interface MobileState {\n    public void getState();\n\
    }\n```\n"
