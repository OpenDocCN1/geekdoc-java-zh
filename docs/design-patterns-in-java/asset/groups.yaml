    \ especially when objects should have different access rights.\n\nIn the Proxy\
    \ Pattern, a client does not directly talk to the original object, it delegates\
    \ to the proxy which calls the methods of the original object. The important point\
    \ is that the client does not know about the proxy, the proxy acts as an original\
    \ object for the client. But there are many variations to this approach which\
    \ we will see soon.\n\nThere are three main variations to the Proxy Pattern:\n\
    \n+   * A remote proxy provides a local representative for an object in a different\
    \ address space.\n\n+   * A virtual proxy creates expensive objects on demand.\n\
    \n+   * A protection proxy controls access to the original object. Protection\
