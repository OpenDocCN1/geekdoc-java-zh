    # When to use the State Design Pattern:


    Use the State pattern in either of the following cases:


    +   * An object''s behavior depends on its state, and it must change its behavior
    at run-time depending on that state.


    +   * Operations have large, multipart conditional statements that depend on the
    object''s state. This state is usually represented by one or more enumerated constants.
    Often, several operations will contain this same conditional structure. The State
    pattern puts each branch of the conditional in a separate class. This lets you
    treat the object''s state as an object in its own right that can vary independently
    from other objects.'
  - '[PAGE 93]


