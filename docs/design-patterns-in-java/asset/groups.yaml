    # COMPOSITE PATTERN


    There are times when you feel a need of a tree data structure in your code. There
    are many variations to the tree data structure, but sometimes there is a need
    of a tree in which both branches as well as leaves of the tree should be treated
    as uniformly.


    The Composite Pattern allows you to compose objects into a tree structure to represent
    the part-whole hierarchy which means you can create a tree of objects that are
    made of different parts, but that can be treated as one big thing. **Composite
    lets clients to treat individual objects and compositions of objects uniformly,
    that''s the intent of the Composite Pattern.**


    In the composite pattern, a tree structure exists where identical operations can
    be performed on leaves and nodes. A node in a tree is a class that can have children.
    A node class is a ''composite'' class. A leaf in a tree is a ''primitive'' class
    that does not have children. The children of a composite can be leaves or other
    composites.


    The leaf and the composite class share a common ''component'' interface that defines
    the common operations that can be performed on leaves and composites. When an
    operation on a composite is performed, this operation is performed on all children
    of the composite, whether they are leaves or composites. Thus, the composite pattern
    can be used to perform common operations on the objects that compose a tree.


    In other words, Composite Pattern consists of following objects.


    **Base Component** – Base component is the interface for all objects in the composition,
    client program uses base component to work with the objects in the composition.
    It can be an interface or an abstract class with some methods common to all the
    objects.


    **Leaf** – Defines the behavior for the elements in the composition. It is the
    building block for the composition and implements base component. It doesn''t
    have references to other Components.


    **Composite** – It consists of leaf elements and implements the operations in
    base component.'
