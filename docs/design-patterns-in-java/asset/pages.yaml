  md: "# FACTORY PATTERN\n\nFactory design pattern is used when we have a super class\
    \ with multiple sub-classes and based on input, we need to return one of the sub-classes.\
    \ This pattern takes out the responsibility of instantiation of a class from client\
    \ program to the factory class. We can use Singleton pattern on Factory class\
    \ or make the factory method static.\n\nSuper class in factory pattern can be\
    \ an interface or a normal java class.\n\n**Benefits:**\n\n+   * Factory pattern\
    \ provides approach to interface rather than implementation.\n* Factory pattern\
    \ removes the instantiation of actual implementation classes from client code,\
    \ making it more robust, less coupled and easy to extend. For example, we can\
    \ easily change PC class implementation because client program is unaware of this.\n\
    * Factory pattern provides abstraction between implementation and client classes\
    \ because inheritance.\n\n**Usage in JDK:**\n\n+   * java.util.Calendar, ResourceBundle\
    \ and NumberFormat getInstance() methods uses Factory pattern.\n* valueOf() method\
    \ in wrapper classes like Boolean, Integer etc.\n\n```\npackage com.dev.dp.creational.factory;\n\
    public interface IMobile {\n    public void cost();\n    public void pictureCapacity();\n\
    \    public void batteryPower();\n}\n```"
