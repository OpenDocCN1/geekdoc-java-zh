  md: '# SINGLETON PATTERN


    Sometimes it’s important for some classes to have exactly one instance. There
    are many objects we only need one instance of them and if we, instantiate more
    than one, we’ll run into all sorts of problems like incorrect program behavior,
    overuse of resources, or inconsistent results.


    There are only two points in the definition of a singleton design pattern:


    +   * There should be only one instance allowed for a class and


    +   * We should allow global point of access to that single instance.


    From the definition, it seems to be a very simple design pattern but when it comes
    to implementation, it comes with a lot of implementation concerns. The implementation
    of Java Singleton pattern has always been a controversial topic among developers.
    We will learn about Singleton design pattern principles, different ways to implement
    Singleton design pattern and some of the best practices for its usage.


    Lazy initialization will be beneficial when we want to delay the initialization
    until it is not needed. because if we use eager initialization and if initialization
    fails there is no chance to get the instance further while in lazy initialization
    we get it in second chance. In Lazy initialization we not get instance until we
    call getInstance () method while in eager initialization creates instance at the
    time of class loading.


    There are some examples where Singleton pattern violation situation can be found.


    We will compare the hash code values of the objects to verify the similar objects.
    If hash code values of two objects are equal, those objects must be equal.


    +   * Reflection: Using reflection we can set the private constructor to become
    accessible at runtime as shown in the example below.'
