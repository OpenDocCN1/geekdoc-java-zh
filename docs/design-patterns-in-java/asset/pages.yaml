  md: "# PROXY PATTERN\n\nThe Proxy Pattern provides a surrogate or placeholder for\
    \ another object to control access to it.\n\nThe Proxy Pattern is used to create\
    \ a representative object that controls access to another object, which may be\
    \ remote, expensive to create or in need of being secured.\n\nOne reason for controlling\
    \ access to an object is to defer the full cost of its creation and initialization\
    \ until we actually need to use it. Another reason could be to act as a local\
    \ representative for an object that lives in a different JVM. The Proxy can be\
    \ very useful in controlling the access to the original object, especially when\
    \ objects should have different access rights.\n\nIn the Proxy Pattern, a client\
    \ does not directly talk to the original object, it delegates to the proxy which\
    \ calls the methods of the original object. The important point is that the client\
    \ does not know about the proxy, the proxy acts as an original object for the\
    \ client. But there are many variations to this approach which we will see soon.\n\
    \nThere are three main variations to the Proxy Pattern:\n\n+   * A remote proxy\
    \ provides a local representative for an object in a different address space.\n\
    \n+   * A virtual proxy creates expensive objects on demand.\n\n+   * A protection\
    \ proxy controls access to the original object. Protection proxies are useful\
    \ when objects should have different access rights.\n\n```\npublic interface IFolder\
    \ {\n    public void performOperations();\n}\n```\n\n```\npublic class Folder\
    \ implements IFolder {\n    @Override\n    public void performOperations() {\n\
    \        // access folder and perform various operations like copy or cut files\n\
    \        System.out.println(\"Performing operation on folder\");\n    }\n}\n```"
