  md: '# OBSERVER PATTERN


    In observer design pattern multiple observer objects registers with a subject
    for change notification. When the state of subject changes, it notifies the observers.
    Objects that listen or watch for change are called observers and the object that
    is being watched for is called subject.


    Pattern involved is also called as publish-subscribe pattern.


    +   * Subject provides interface for observers to register and unregister themselves
    with the subject.

    * Subject knows who its subscribers.

    * Multiple observers can subscribe for notifications.

    * Subject publishes the notifications.

    * Subject just sends the notification saying the state has changed. It does not
    pass any state information.


    * Once the notification is received from subject, observers call the subject and
    get data that is changed.

    The above two points are not strictly followed in observer design pattern implementation.
    Along with the notification, state is also passed in some implementation so that
    the observer need not query back to the status. It is better not to do this way.


    There are four participants in the Observer pattern:


    +   * Subject, which is used to register observers. Objects use this interface
    to register as observers and also remove themselves from being observers.

    * Observer defines an updating interface for objects that should be notified of
    changes in a subject. All observers need to implement the Observer interface.
    This interface has a method update (), which gets called when the Subject''s state
    changes.

    * ConcreteSubject, stores the state of interest to ConcreteObserver objects. A
    concrete subject always implements the Subject interface. The notifyObservers()
    method is used to update all the current observers whenever the state changes.

    * ConcreteObserver maintains a reference to a ConcreteSubject object and implements
    the Observer interface. Each observer registers with a concrete subject to receive
    updates.


    Java provides inbuilt platform for implementing Observer pattern through java.util.Observer
    class and java.util.Observer interface. However it''s not widely used because
    the implementation is really simple and most of the times we don''t want to end
    extending a class for implementing Observer pattern as java doesn''t provide multiple
    inheritances in classes.'
