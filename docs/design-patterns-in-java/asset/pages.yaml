  md: "# FAÇADE PATTERN\n\nThe Facade pattern is a structural design pattern. In the\
    \ facade pattern, a facade classes is used to provide a single interface to set\
    \ of classes. The facade simplifies a client's interaction with a complex system\
    \ by localizing the interactions into a single interface. As a result, the client\
    \ can interact with a single object rather than being required to interact directly\
    \ in complex ways with the objects that make up the subsystem.\n\nAccording to\
    \ GoF design pattern: Provide a unified interface to a set of interfaces in a\
    \ subsystem. Facade Pattern defines a higher-level interface that makes the subsystem\
    \ easier to use.\n\nThe Facade does not encapsulate the subsystem classes or interfaces;\
    \ it provides a simplified interface to their functionality. A client can access\
    \ these classes directly. It still exposes the full functionality of the system\
    \ for the clients who may need it. It just provides a layer to the complex interfaces\
    \ of the sub-system which makes it easier to use.\n\nFacade design pattern is\
    \ one among the other design patterns that promote loose coupling. It emphasizes\
    \ one more important aspect of design which is abstraction. By hiding the complexity\
    \ behind exposing a simple interface it achieves abstraction.\n\nFacade can wrap\
    \ multiple classes, but a facade is used to an interface to simplify the of the\
    \ complex interface, whereas, an adapter is used to convert the interface to an\
    \ client expects.\n\nMediator design pattern may look very similar to facade design\
    \ pattern in terms of abstraction, Mediator abstracts the functionality of the\
    \ subsystems in which it is similar to the facade pattern. In the implementation\
    \ of mediator pattern, subsystem or peers are aware of the mediator and interact\
    \ with it. In the case of facade pattern, subsystems are not aware of the existence\
    \ of facade. Only facade talks to the subsystems.\n\n```\npackage com.dev.dp.structural.facade;\n\
    public class Class {\n// Class's doSomethingComplicated(method) takes an integer\
    \ and returns its cube.\npublic int doSomethingComplicated(int x) {\n    return\
    \ x * x * x;\n}\n\n```"
