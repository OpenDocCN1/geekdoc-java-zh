  md: "# DECORATOR PATTERN\n\nThe intent of the Decorator Design Pattern is to attach\
    \ additional responsibilities to an object dynamically. Decorators provide a flexible\
    \ alternative to sub-classing for extending functionality.\n\nThe Decorator Pattern\
    \ is used to extend the functionality of an object dynamically without having\
    \ to change the original class source or inheritance. This is accomplished by\
    \ creating an object wrapper referred to as a Decorator around the actual object.\n\
    \nThe Decorator object is designed to have the same interface as the underlying\
    \ object. This allows a client object to interact with the Decorator object in\
    \ exactly the same manner as it would with the underlying actual object. The Decorator\
    \ object contains a reference to the actual object. The Decorator object receives\
    \ all requests (calls) from a client. In turn, it forwards these calls to the\
    \ underlying object. The Decorator object adds some functionality before or after\
    \ forwarding requests to the underlying object. This ensures that the additional\
    \ functionality can be added to a given object externally at runtime without modifying\
    \ its structure.\n\nWe use inheritance or composition to extend the behavior of\
    \ an object but this is done at compile time and it's applicable to all the instances\
    \ of the class. We can't add any functionality of removing any existing behavior\
    \ at runtime – this is when Decorator pattern comes into picture.\n\nComponent\
    \ Interface – The interface or abstract class defining the methods that will be\
    \ implemented. In our case Icecream will be the component interface.\n\n```\n\
    package com.dev.dp.structural.decorator;\npublic interface Icecream {\n    public\
    \ String makeIcecream();\n}\n```\n\nComponent Implementation – The basic implementation\
    \ of the component interface. We can have Simpleicecream as our component implementation.\n\
    \n```\npackage com.dev.dp.structural.decorator;\npublic class Simpleicecream implements\
    \ Icecream {\n    @Override\n    public String makeIcecream() {\n        return\
    \ \"Base-Icecream\";\n    }\n}\n```\n\nDecorator – Decorator class implements\
    \ the component interface and it has a HAS-A relationship with the component interface.\
    \ The component variable should be accessible to the child decorator classes,\
    \ so we will make this variable protected."
