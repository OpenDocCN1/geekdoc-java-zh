  md: "# ADAPTER PATTERN\n\nSometimes, there could be a scenario when two objects\
    \ don't fit together, as they\nin-order to get the work done. This situation could\
    \ arise when we are trying to integrate a\nlegacy code with a new code, or when\
    \ changing a 3rd party API in the code. This is due to\nincompatible interfaces\
    \ of the two objects which don't fit together.\n\nIn other words, **Adapter design\
    \ pattern** is one of the structural design patterns and it's\nused so that two\
    \ unrelated interfaces can work together. The object that joins these\nunrelated\
    \ interfaces is called an **Adapter**. As a real life example, we can think of\
    \ a mobile\ncharger as an adapter because mobile battery needs 3 volts to charge\
    \ the normal socket\nproduces 120V (US) or 240V (India). So the mobile charger\
    \ works as an adapter\nbetween mobile charging socket and the wall socket.\n\n\
    In the adapter pattern, a wrapper class (i.e., the adapter) is used translate\
    \ requests from it\nto another class (i.e., the adaptee). In effect, an adapter\
    \ provides particular interactions\nwith an adaptee that are not offered by the\
    \ adaptee.\n\nThe adapter pattern takes two forms. In the first form, a “class\
    \ adapter” utilizes\ninitance. The class adapter extends the adaptee class and\
    \ adds the desired methods to\nan an interface (i.e., the “target” interface).In\
    \ thensecond form; an “object adapter” utilizes composition. The object adapter\
    \ contains an\nadapter and implements the target interface to interact with the\
    \ adaptee.\n\npublic class Apple {\n\n```\npublic void getAppleColor(String color){\n\
    \    System.out.println(\"Apple color is :\"+color);\n}\n```\n\npublic class Orange\
    \ {\n\n```\npublic void getOrangeColor(String color){\n    System.out.println(\"\
    Orange color is :\"+color);\n}\n```\n\npublic class AppleAdapter extends Apple\
    \ {\n\n```\n//The purpose of the sample problem is to adapt an orange as an apple.\n\
    private Orange orange;\npublic AppleAdapter(Orange orange) {\n    this.orange\
    \ = orange;\n}\n```\n\n```\npublic void getColor(String color){\n    orange.getOrangeColor(color);\n\
    }\n```\n\n}"
