    # When to use the Command Design Pattern:\n\nUse the Command pattern when you\
    \ want to:\n\n+   * Parameterize objects by an action to perform.\n* Support undo.\
    \ The Command's Execute operation can store state for reversing its effects in\
    \ the command itself. The Command interface must have an added Un-execute operation\
    \ that reverses the effects of a previous call to Execute. Executed commands are\
    \ stored in a history list. Unlimited-level undo and redo is achieved by traversing\
    \ this list backwards and forwards calling Un-execute and Execute, respectively.\n\
    * Structure a system from high-level operations built on primitive operations.\
    \ Such a structure is common in information systems that support transactions.\
    \ The Command pattern offers a way to model transactions. Commands have a common\
    \ interface, letting you invoke all transactions the same way. The pattern also\
    \ makes it easy to extend the"
