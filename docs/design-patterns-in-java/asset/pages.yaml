  md: '# When to use the Iterator Design Pattern:


    Use the Iterator pattern:


    +   * To access an aggregate object’s contents without exposing its internal representation.

    * To support multiple traversals of aggregate objects.

    * To provide a uniform interface for traversing different aggregate structures
    (that is, to support polymorphic iteration).

    * Iterator pattern is useful when you want to provide a standard way to iterate
    over a collection and hide the implementation from client program.


