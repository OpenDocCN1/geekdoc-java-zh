  md: "# MEDIATOR PATTERN\n\nMediator promotes loose coupling by keeping objects from\
    \ referring to each other explicitly, and it lets you vary their interaction independently.\n\
    \nMediator design pattern is used to provide a centralized communication medium\
    \ between different objects in a system.\n\nRather than interacting directly with\
    \ each other, objects ask the Mediator to interact on their behalf which ensures\
    \ reusability and loose coupling. It encapsulates the interaction between the\
    \ objects and makes them independent from each other. This allows them to vary\
    \ their interaction with other objects in a totally different way by implementing\
    \ a different mediator. The Mediator helps to reduce the complexity of the classes.\
    \ Each object no longer has to know in detail how to interact with the other objects.\
    \ The coupling between objects goes from brittle and to loose and agile.\n\nMediator\
    \ design pattern is very helpful in an enterprise application where multiple objects\
    \ are interacting with each other. If the objects interact with each other, the\
    \ system components are tightly-coupled with each other that make maintainability\
    \ cost higher and not flexible to extend easily. Mediator pattern focuses on a\
    \ mediator between objects for communication and help in implementing loose-coupling\
    \ between objects.\n\nAir traffic controller is a great example of mediator pattern\
    \ where the airport control room works as a mediator for communication between\
    \ different flights. Mediator works as a router between objects and it can have\
    \ its own logic to provide way of communication.\n\nThe major participants of\
    \ the Mediator pattern are:\n\n+   * Mediator: Defines an interface for communicating\
    \ with Colleague objects.\n\n+   * ConcreteMediator: Implements cooperative behavior\
    \ by coordinating Colleague objects. It also knows and maintains its colleagues.\n\
    \n+   * Colleague Classes: Each Colleague class knows its Mediator objects. Each\
    \ colleague communicates with its mediator whenever it would have otherwise communicated\
    \ with another colleague.\n\n```\n/**\n * Colleague A to talk, and Colleague B\
    \ wants to fight with mediator.\n * when they do some action(i.e., something()),\n\
    \ * they invoke mediator to do that.\n */\npublic interface Mediator {\n    public\
    \ void talk();\n    public void fight();\n    public void registerA(ColleagueA\
    \ a);\n    public void registerB(ColleagueB b);\n}\n```"
