  md: '# FLYWEIGHT PATTERN


    In the flyweight pattern, instead of creating large numbers of similar objects,
    objects are reused. This can be used to reduce memory requirements and instantiation
    time and related costs.


    Flyweight design pattern is used when we need to create a lot of Objects of a
    class. Since every object consumes memory space that can be crucial for low memory
    devices, such as mobile devices or embedded systems, flyweight design pattern
    can be applied to reduce the load on memory by sharing objects.


    Before we apply flyweight design pattern, we need to consider following factors:


    +   * The number of Objects to be created by application can be huge.

    * The object creation is heavy on memory and it can be time consuming too.


    Sometimes too many objects can slow down things. Too many objects might consume
    a large piece of memory and slow down the application or even cause out of memory
    problems. As a good programmer, one should keep of instantiated objects and control
    the object creation in an application. This is especially true, when we have a
    lot of similar objects and two objects from the pool don''t have many differences
    between them.


    Sometimes the objects in an application might have great similarities and be of
    a similar kind (a similar kind here means that most of their properties have similar
    values and only a few of them vary in value). In case they are heavy objects to
    create, they should be controlled by the application developer. Otherwise, they
    might consume much of the memory and eventually slow down the whole application.


    The Flyweight Pattern is designed to control such kind of object creation and
    provides you with a basic caching mechanism. It allows you to create one object
    per type (the type differs by a property of that object), and if you ask for an
    object with the same property (already created), it will return you the same object
    instead of creating a new one.


    # Flyweight Pattern Example in JDK:


    All the wrapper classes valueOf method uses cached objects showing use of Flyweight
    design pattern. The best example is Java String class String Pool implementation.'
