  md: '# TEMPLATE METHOD PATTERN


    The Template Pattern defines the skeleton of an algorithm in an operation, deferring
    some steps to subclasses. Template Method lets subclasses to redefine certain
    steps of an algorithm without changing the algorithm’s structure.


    The Template Method pattern can be used in situations when there is an algorithm,
    some steps of which could be implemented in different ways. In such scenarios,
    the Template Method pattern suggests keeping the outline of the algorithm in a
    separate method referred to as a template method inside a class, which may be
    referred to as a template class, leaving out the specific implementations of the
    variant portions (steps that can be implemented in multiple ways) of the algorithm
    to different subclasses of this class.


    The Template class does not necessarily have to leave the implementation to subclasses
    in its entirety. Instead, as part of providing the outline of the algorithm, the
    Template class can also provide some amount of implementation that can be considered
    as invariant across different implementations. It even provide default implementation
    for the variant parts, if appropriate. Only specific details will be implemented
    inside different subclasses. This type of implementation eliminates the need for
    duplicate code, which means a minimum amount of code to be written.


    +   * Template method should consist of certain steps whose order is fixed and
    for some of the methods; implementation differs from base class to subclass. Template
    method should be final.


    +   * Most of the times, subclasses calls methods from super class but in template
    pattern, superclass template method calls methods from subclasses, this is known
    as Hollywood Principle – “don’t call us, we’ll call you.”


    +   * Methods in base class with default implementation are referred as Hooks
    and they are intended to be overridden by subclasses, if you want some of the
    methods to not be overridden, you can make them final, for example in our case
    we can make doPack() method final because if we don’t want subclasses to override
    it.'
