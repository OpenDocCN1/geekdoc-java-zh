  md: "# CHAIN OF RESPONSIBILITY\n\nChain of responsibility pattern is used to achieve\
    \ lose coupling in software design where a request from client is passed to a\
    \ chain of objects to process them. Then the object in the chain will decide themselves\
    \ who is processing the request and whether the request is required to be sent\
    \ to the next object in the chain or not.\n\nWhen there is more than one objects\
    \ that can handle or fulfill a client request, the pattern recommends giving each\
    \ of these objects a chance to process the request in some sequential order. Applying\
    \ the pattern in such a case, each of these potential handlers can be arranged\
    \ in the form of a chain, with each object having a reference to the next object\
    \ in the chain. The first object in the chain receives the request and decides\
    \ either to handle the request or to pass it to the next object in the chain.\
    \ The request flows through all objects in the chain one after the other until\
    \ the request is handled by one of the handlers in the chain or reaches the end\
    \ of the chain without getting processed.\n\nLet's see the example of chain of\
    \ responsibility pattern in JDK and then we will proceed to implement a real example\
    \ of this pattern. We know that we can have multiple blocks in a try-catch block\
    \ code. Every catch block is kind of a processor to process that particular exception.\
    \ So when any exception occurs in the try block send its to the first catch block\
    \ to process. If the catch block is not able to process it, it forwards the request\
    \ to next object in chain i.e. next catch block. Even if the last block is not\
    \ able to process it, the exception is thrown outside of the chain to the calling\
    \ program.\n\nOther examples are ATM money dispenser, Servlet Filter and finally\
    \ java's own Exception Handling mechanism. We know exception handling better than\
    \ anybody else and we are daily living with it. This qualifies as the best example\
    \ for chain of responsibility.\n\nIn ATM Dispense machine, the user enters the\
    \ amount to be dispensed and the machine dispense amount in terms of defined currency\
    \ bills such as $50, $20, $10 etc. If the user enters an amount that is not multiples\
    \ of 10, it throws error.\n\n```\n//This class is the request object.\npublic\
    \ class Number {\n    private int number;\n\n    public int getNumber() {\n  \
    \      return number;\n    }\n\n    public Number(int num){\n        number=num;\n\
    \    }\n}\n```"
