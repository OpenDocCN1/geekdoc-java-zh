    The following is a short introduction to SQL, and the purpose is to show the syntax
    for the most important statements. Now SQL is not just SQL, and the different
    database vendors have their variants of the language, and although the following
    examples are tested against a MySQL database server, they practically all could
    be used by any database server. Thus, it will be a number of extensions to SQL,
    which is not dealt with, and the following should not be perceived as a complete
    manual for SQL.


