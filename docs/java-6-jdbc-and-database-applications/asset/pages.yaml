  md: "# 8 FILES IN DATABASES\n\nIt is also possible to save files in databases, for\
    \ example PDF documents, XML documents or images. It has limited use, but with\
    \ web applications sometimes sees examples where images are stored in databases,\
    \ and if these are small files, there may also be situations where it is ok. In\
    \ this section I will show how to do that.\n\nA column that must contain a file\
    \ be of the type TEXT (for documents) or BLOB (binary files like images). The\
    \ following script (`CreateFileDb.sql`) creates a database with two tables, one\
    \ to table documents, while the other is for images:\n\n```\nuse sys;\ndrop database\
    \ if exists filedb;\ncreate database filedb;\nuse filedb;\n```\n\n```\ncreate\
    \ table documents (\n  filename varchar(100),      # the documents name\n  description\
    \ varchar(100),   # a short description\n  content longtext,           # the documents\
    \ content\n  primary key(filename)\n);\n```\n\n```\ncreate table pictures (\n\
    \  filename varchar(100),      # the filename\n  description varchar(100),   #\
    \ a short description\n  content longblob,          # picture data\n  primary\
    \ key(filename)\n);\n```\n\nThe following program is called `UploadDocs` and opens\
    \ the following window:\n\n| Name | Text |\n|---|---|\n| countries | Country codes\
    \ |\n| Titler.pdf | |\n\nDownload free eBooks at bookoon.com"
