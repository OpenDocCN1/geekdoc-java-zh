    # 4.3 STORED PROCEDURES


    A stored procedure is a script that contains SQL statements that is executed when
    the procedure is performed. When one speaks of a stored procedure, it means that
    the procedure is translated and stored in the database, which means it is highly
    effective to execute a stored procedure. In MySQL Workbench you can create a stored
    procedure by right-clicking `Stored Procedures` for the database under `Schemas`,
    and you get it as a skeleton for a procedure:


    ```

    CREATE PROCEDURE ''new_procedure'' (


    BEGIN


    END

    ```


    As an example, I have written a very simple procedure which `OUT parameter` returns
    the number of people in the table `history` where the year falls within a range:


    ```

    CREATE PROCEDURE ''persons'' (IN a int, IN b int, OUT c int)

    BEGIN

    SELECT count(id) FROM history WHERE (a <= birth AND birth <= b) OR

    (a <= death AND death <= b) INTO c;

    END

    ```'
