  md: '# THE SELECT COMMAND


    Then there is the SELECT command, which absolutely is the command where there
    is to say. The simplest command you can think of is a command of the form:


    ```

    SELECT * FROM publisher;

    ```


    which extracts all rows from the table publisher. A * means all columns and hence
    the result consists of rows that should contain values from columns. You can replace
    * with the names of the columns whose values you want to show:


    ```

    SELECT title, pages FROM book;

    ```


    A SELECT can have a WHERE part, where you specify the rows to extract:


    ```

    SELECT title, pages FROM book WHERE edition = 4;

    ```


    The WHERE part can be by using boolean operators to define more complex conditions:


    ```

    SELECT title, pages FROM book

    WHERE (edition = 1 OR edition = 3) AND pages > 650 AND pages < 700;

    ```


    | title | pages |

    | Java, How to Program | 1546 |

    | Introduction to Java Programming | 952 |

    | Teach Yourself Visual Basic 5 | 798 |

    | Data Kommunikation | 872 |


    | title | pages |

    | Cryptography and Network Security | 681 |

    | Programming Languages, Design and Implementation | 654 |

    | Understanding Java | 680 |

    | The Object of Java | 670 |

    | Mastering C# Database Programming | 665 |


    It is also possible to specify substrings. As an example the following command
    extracts all rows where title starts with the word Java


    ```

    SELECT title, pages FROM book WHERE title LIKE ''Java%'';

    ```'
