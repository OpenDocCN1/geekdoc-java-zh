    in the publisher table, but only rows with same value in the columns for pubnr
    are included in the result. The result has 87 rows with two columns. You should
    note that the two columns title and name are unique determined in the combination
    of the two tables but both tables have a column named pubnr, and therefore it
    is necessary to qualify the name with the table name in the WHERE part.


    If you do not specify concrete columns in a join such as


    ```

    SELECT * FROM book, publisher WHERE book.pubnr = publisher.pubnr;

