  md: '# #10 FINAL EXAMPLES


    I will finish this book about JDBC and databases with two examples of database
    applications. The two examples are similar and classic examples of database applications
    and in addition to the size in which the first is a small program, while the other
    is slightly larger, so the difference is that the first use an existing database,
    while the latter shows the development of a database program right from the start,
    which also includes the design and implementation of the database.


    # ## 10.1 WORLD


    In the exercises and problems in this book you have expanded the database *padata*
    with three tables


    +   - world

    - country

    - currency


    The task is now to write a program that can maintain these tables, and thus a
    program where you can search the tables, as well as edit and delete data. The
    program must have a graphical user interface.


    # ## THE REQUIREMENTS


    Before I will address the development, the requirements must be defined and therefore
    which the program must be able to perform.


    +   - 1. The program should open a window (the main view) with two tables, one
    table provides an overview of all countries, while the second shows an overview
    of all currencies.

    - 2. It should be possible to create a new country.

    - 3. It should be possible to edit the information about a country.

    - 4. It must be possible to delete a country.

    - 5. It must be possible to create a new currency.

    - 6. It should be possible to edit information about a currency and here especially
    the exchange rate.

    - 7. It must be possible to delete a currency, if there is no country that uses
    this currency.

    - 8. It should be possible to update exchange rates with data from a CSV file.'
