    | Symbolisk Maskinsprag. Univac 100... | Computer teknologi |


    In addition to INNER JOIN, there are the following JOIN operations:


    +   - LEFT JOIN, which returns all rows from the left table, even if there is
    no match in the right table.

    - RIGHT JOIN, which returns all rows of the right table, even if there is no match
    in the left table.

    - FULL JOIN, which returns all rows even if there is no match in one of the two
    tables.

    - CARTESIAN JOIN, which returns the cartesian product of the two tables.


    You should be aware that a FULL JOIN is not supported by MySQL. As an example
    I will show a LEFT JOIN:


    ```

    SELECT title, name FROM book LEFT JOIN category ON book.catnr = category.catnr
    WHERE isbn LIKE ''87-%'';

    ```


    Note that in praxis it is the SAME as above, but this time the result shows seven
    rows. This is because the book has a row, which is NULL in the column catnr and
    therefore does not match a row in the category table, but it is included in the
    result as opposed to an INNER JOIN where there must be a match in both tables.'
