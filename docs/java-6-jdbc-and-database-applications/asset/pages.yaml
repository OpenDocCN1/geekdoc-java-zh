    # JOIN


    It is also possible to perform a SELECT command that extracts rows from multiple
    tables, and we often talk about a JOIN command, that extracts the title from the
    book table and the name from the publisher table, but such that only are extracted
    a raw row where the value in column pubnr is similar in the tables:


    ```

    SELECT title, name FROM book, publisher book.pubnr = publisher.pubnr;

