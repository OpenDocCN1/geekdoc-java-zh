  md: 'As an example, you can write the following view:


    ```

    CREATE VIEW Prentice_hall AS SELECT isbn, title, edition, year, pages

    FROM book WHERE pubnr = 2;

    ```


    which defines a view called Prentice_hall for all books where pubnr 2 extracts
    the

    isbn, title, edition, year and pages. This is the view of columns in the table
    of all books

    published by Prentice Hall. When you click Apply. MySQL Workbench creates the

    following view:


    ```

    CREATE

    ALGORITHM = UNDEFINED

    DEFINER = ''pa@%''

    SQL SECURITY DEFINER

    VIEW ''books''.''Prentice_hall'' AS

    SELECT

    ''books''.''book''.''isbn'' AS ''isbn'',

    ''books''.''book''.''title'' AS ''title'',

    ''books''.''book''.''edition'' AS ''edition'',

    ''books''.''book''.''year'' AS ''year'',

    ''books''.''book''.''pages'' AS ''pages''

    FROM

    ''books''.''book''

    WHERE

    (''books''.''book''.''pubnr'' = 2)

    ```


    This view may then be used in the same way as the other tables, and for example
    you

    can write:


    ```

    SELECT * FROM Prentice_hall;

    ```


    Indeed, you can also to some extent perform SQL INSERT, UPDATE and DELETE

    statements in a view. Consider as an example the following view, which extracts
    first and

    last names of all authors where the last starts with a K:


    ```

    CREATE VIEW knames AS SELECT DISTINCT firstname, lastname

    FROM author WHERE lastname LIKE ''K%''

    ```


    If you then performs the statement


    ```

    SELECT * FROM knames;

    ```'
