    An INNER JOIN between two tables returns rows in which there are matches in both
    tables. An INNER JOIN (and all other JOIN operations) can also be combined with
    a WHERE clause as such


    ```

    SELECT title, name FROM book INNER JOIN category ON book.catnr = category.catnr
    WHERE isbn LIKE ''87-%'';

    ```


    that returns the title and name for the books where isbn starts with 87- (all
