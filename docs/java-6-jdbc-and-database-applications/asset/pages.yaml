    you get an error where you are told that the parent table can not be updated.
    Of course it is not strange, there is not enough information (there is not an
    author number) to create a row in the author table. Consider the following view:


    ```

    CREATE VIEW lnames AS SELECT autnr, firname, lastname

    FROM author WHERE lastname LIKE ''L%'';

