  md: "# JAVA 6: JDBC AND DATABASE APPLICATIONS TRANSACTIONS\n\n```\nDatabaseMetaData\
    \ metaData = conn.getMetaData();\nif (metaData.supportsBatchUpdates()) {\n   \
    \ for (Person pers : list) {\n        stmt1.setString(1, pers.getName());\n  \
    \      stmt1.addBatch();\n    }\n    for (Person pers : list) {\n        prepareStatement(stmt2,\
    \ pers);\n        stmt2.addBatch();\n    }\n    stmt1.executeBatch();\n    stmt2.executeBatch();\n\
    \nSystem.out.println(\"This database does not support batch updates\");\n} catch\
    \ (SQLException ex) {\n    System.out.println(ex);\n}\n```\n\ncreateKings() is\
    \ a method that, in principle, is identical to createPersons() (it creates some\
    \ other Person objects). Inside the try block the method creates two PreparedStatement\
    \ objects respectively a DELETE and an INSERT. Since it is not a requirement that\
    \ JDBC supports batch updates, it is first tested whether that is the case, and\
    \ if so a loop of all the objects in the list, add statements to delete the corresponding\
    \ rows, if they exist, but instead of performing executeUpdate() is performed\
    \ addBatch(), which adds that database operations to a list of operations in the\
    \ object stmt1. Subsequently, the same happens for all objects in the list, but\
    \ this time as stmt2. So far, the database operations are not performed, but it\
    \ happens eventually with the method executeBatch()."
