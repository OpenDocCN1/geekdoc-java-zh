    this time defines a column to all columns in the author table. Perform now the
    statement:


    ```

    INSERT INTO lnames VALUES (1000, ''Knud'', ''Larsen'');

    ```


    and you will see that both the view and the original table is updated. This means
    an update of the view also updates the parent table, but there are the following
    conditions:


    +   - THE SELECT statement may not use DISTINCT

    - THE SELECT statement may not contain functions

    - THE SELECT statement may not contain operators

    - THE SELECT statement may not use ORDER BY

    - THE SELECT statement can use only one table

    - THE SELECT statement’s WHERE part may not use a SELECT statement (see below)

    - THE SELECT statement may not use GROUP BY or HAVING

    - THE SELECT statement must include all columns from the parent table that is
    defined NOT NULL'
