  md: "# 2 JDBC\n\nJDBC is a family of classes that implements an interfaces defined\
    \ in the JDBC API, and which makes it possible, that a Java program can communicate\
    \ with a database server. In relation to the Java program the API has the necessary\
    \ types as interfaces and classes defined in the package java.sql; while the specific\
    \ types are implemented by a JDBC driver. So there has to be a JDBC driver for\
    \ each of the databases the program must apply and often it is the database supplier\
    \ that develops the JDBC driver. You can think of a JDBC driver as a layer between\
    \ the database and the Java program that ensures that the program can use the\
    \ database in the same way, whether it is one or the other database system.\n\n\
    # 2.1 HELLOJDBC\n\nBefore I go further and look at the details concerning JDBC,\
