  md: '# JAVA 6: JDBC AND DATABASE APPLICATIONS FINAL EXAMPLES


    A database is a collection of related tables, and a table contains data organized
    into columns and rows. As an example is part of a database table for books, where
    there are seven columns:


    | # | isbn | title | edition | year | pages | pubnr | catnr |

    |---|---|---|---|---|---|---|---||

    | 1 | 0-0754225-2 | Functional Application | | 1973 | 397 | 3 | 2 |

    | 2 | 0-0722897-0 | C++ from the Ground Up | | 2003 | 602 | 3 | 1 |

    | 3 | 0-1296050-5 | Homotopy Theory, An Introduction to Algebraic Topology | 1
    | 1975 | 368 | 10 | 2 |

    | 4 | 0-0139859-5 | Object-Oriented Programming in Java | 1 | 2001 | 641 | 2 |
    1 |

    | 5 | 0-0238418-1 | Perl. How to Program | 1 | 2001 | 1057 | 2 | 1 |

    | 6 | 0-0323777-2 | Java for Students | 3 | 2002 | 634 | 2 | 1 |

    | 7 | 0-0330370-0 | Object-Oriented Problem Solving Java, Java, Java | 2 | 2003
    | 862 | 2 | 1 |

    | 8 | 0-0341517-7 | Java, How to Program | 4 | 2000 | 1546 | 2 | 1 |

    | 9 | 0-044929-6 | Objects First With Java | 1 | 2003 | 286 | 2 | |


    Each column has a name, and name must be unique within each table. Each column
    has a data type that determines what data the column can contain. A row contains
    data about a particular book, the row''s value in a column is called a field and
    must match the column''s data type. A row is also called a record. The value of
    a particular field can be null, which simply means that the field has no value,
    and it is important to note that it is not the same as 0 or blank.


    A column can be assigned constraint''s one can think of as conditions, the values
    in that column must meet. If they do not, the database management system is rejecting
    the database operation. The most important constraints are:


    +   - NOT NULL, indicates that a column cannot contain null values, and the row
    must have a value in that column.

    - DEFAULT, where you can specify a default value that is used, if there is not
    a value for the column.

    - UNIQUE, which means the column''s values must be unique.

    - PRIMARY KEY, indicating that all rows in this column should have a unique value
    that identifies the record.

    - FOREIGN KEY, which defines a reference to a primary key in another table (possibly
    the same table). The column''s value must be the value of a primary key in the
    other table or null.

    - CHECK, where it is possible to define that the column''s values must satisfy
    a condition.

    - INDEX, defines an index (table of content) for the column''s values.


