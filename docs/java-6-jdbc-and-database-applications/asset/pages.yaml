    # VIEW''S


    A view is basically nothing more than a SQL statement that is stored in the database,
    as it can be seen as a form of virtual table, as you in principle use it in the
    same way, as you use other tables. A view can be created on basis of one or more
    tables, but what you can do with a view is determined by how it is created. The
    purpose of a view is


    to structure the content of a database corresponding to the users'' use of the
    database


    limiting access to the data that users can work with


    allowing data from multiple tables to appear as a single table


    In MySQL Workbench you can create a view by right-click on Views (the tab SCHEMA)
    and choose Create View. You then gets the following skeleton:


    ```

    CREATE VIEW ''new_view'' AS

    ```


    ![](img/6ad878d79c28ad17393542a46f05544d_177_0.png)'
