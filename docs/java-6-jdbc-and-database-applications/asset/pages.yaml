  md: "# TRANSACTIONS\n\nWhen performing an SQL statement using either a Statement\
    \ or PreparedStatement object, the database is immediately updated. Sometimes\
    \ it is not appropriate, since you often have multiple SQL statements that must\
    \ be executed as a whole, where all statements are executed correctly or everyone\
    \ ignored. In database contexts talks about a transaction that simply means multiple\
    \ SQL statements can be perceived as a whole. The following test method inserts\
    \ three rows in the table, where the three statements are performed as a transaction:\n\
    \n```\nprivate static void test09() {\n    Connection conn = null;\n    try {\n\
    \        conn = DriverManager.getConnection(\n            \"jdbc:mysql://localhost:3306/pagina?useSSL=false\"\
    , \"pa\", \"Volmer_1234\");\n        conn.setAutoCommit(false);\n        ArrayList<Integer>\
    \ list = new ArrayList<>();\n        PreparedStatement stmt = conn.prepareStatement(\n\
    \            \"INSERT INTO history (name, title) VALUES (?, ?)\");\n        insert(stmt,\
    \ \"Egil Skalleggrimson\", null, list);\n        insert(stmt, \"Knud Lärvard\"\
    , \"Duke\", list);\n        insert(stmt, null, \"Rebel\", list);\n        conn.commit();\n\
    \    } catch (SQLException ex) {\n        if (conn != null) try { conn.rollback();\
    \ } catch (Exception ex2) { }\n        System.out.println(ex);\n    }\n    } finally\
    \ {\n        try { if (conn != null) conn.close(); } catch (SQLException ex) {}\n\
    \    }\n```\n\nFirst as is in the usual way created a connection to the database,\
    \ and the next statement says that there should be no auto commit. This means\
    \ subsequent SQL statements are not immediately performed on the database (they\
    \ are marked as statements that can be rolled back), and the effect will not appear\
    \ before performing a commit(). The statement\n\n```\nconn.setAutoCommit(false);\n\
    ```"
