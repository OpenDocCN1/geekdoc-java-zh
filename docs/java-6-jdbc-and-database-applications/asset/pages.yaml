  md: "# JAVA 6: JDBC AND DATABASE APPLICATIONS\n\nThe try block starts to create\
    \ a Statement object, and the next statement performs a SQL DELETE. It is executed\
    \ with the method executeUpdate(), which, in addition to DELETE is used to perform\
    \ INSERT and UPDATE statements. In this case, the statement deletes rows in which\
    \ the name's value is Ragnar Lodberg. If this is the first time the method is\
    \ run, there may not be a row, and method returns 0. If the method has been completed,\
    \ there are a row with value in the column name, and the method will return 1\
    \ and then print 1 on the screen corresponding to the above result.\n\nThe next\
    \ statement performs a SQL INSERT and inserts a row into the table. You should\
    \ note that the statement only add a value in the column name, which is okay because\
    \ the other columns allow null values. When this statement is executed, the method\
    \ also prints 1 on the screen, because there are inserted one row in the table.\n\
    \nThe next statement performs a SQL SELECT, and this time it is with executeQuery(),\
    \ which is used to execute a SELECT. The query extracts the rows where the column\
    \ name has the value Ragnar Lodberg. There is only one row, and row is printed\
    \ in the next statement. The result is shown in the third line above. Note that\
    \ the method loops over the objects in the ResultSet using a while loop. It is\
    \ obviously needed for a loop I know that there is only one row, but it is necessary\
    \ to perform res.next() to step to the first row.\n\nFinally is performed a SQL\
    \ UPDATE and again with the method executeUpdate(), and as the last is performed\
    \ a new query, showing that the row has been updated.\n\n# PREPAREDSTATEMENTS\n\
    \nIn the above examples, all database operations are executed with a Statement\
    \ object, which is an object that represents a static statement, and thus an SQL\
