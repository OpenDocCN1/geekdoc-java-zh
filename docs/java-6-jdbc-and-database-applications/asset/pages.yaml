  md: '# JAVA 6: JDBC AND DATABASE APPLICATIONS


    It is a script that creates a table with information about historical persons.
    A table consists of rows and columns, and each row contains data (information)
    about a particular person. A column has a type and a name. The name makes it possible
    to refer to the column in SQL statements, while the type determines what kind
    of values the column can hold. Taking the above script, indicating the first column,
    the column must contain an auto-generated integer with 1 and increases by 1 each
    time adding a row to the table. In addition is defined that the column must be
    the primary key, which means that the column''s values must be unique and can
    thus serve to identify each row. The next two columns are of type varchar, indicating
    that the column can contain a string, which in this case must be of maximum, 50
    and 30 characters. The next two columns may again contain integers, and the column
    with the name country must contain a string of 2 characters. The last column can
    contain any text (maximum, 65535 characters). The column name is defined not null,
    which means that every row must have a value in column. The other columns (except
    the first) does not need to have a value, but may be null.


    The book''s directory also contains a script InsertHistory.sql where below shows
    few lines


    ```

    use patada;

    insert into history (name, death, title, country) values

    (''Gorm den Gamle'', 958, ''King'', ''DK'');

    insert into history (name, birth, death, title, country) values

    (''Harald Blåtand'', 958, 997, ''DK'');

    ```


    If you opens the script in MySQL Workbench and executes it, the script adds 52
    rows to the table history, where the rows contain about Danish kings. The following
    assumes this table is created, and the script InsertHistory.sql performs.


    # ABOUT SURROGATE KEYS


    When you have to (design) a database table, you must choose one or more columns
    that can be used as the primary key (above id). This means that each row must
    have a unique value in column or columns. It is not possible, you can define a
    column, which then is assigned a unique value, and it is of the column id of the
    table history, when the value is automatically incremented by 1 each time you
    add a row to a table. This column can be used as the primary key, and it is called
    a surrogate key corresponding to, that it is a replacement for another key column.
    Actually it is, if possible, avoid surrogate keys as they expand the table with
    data that does not anything, and in this case one might avoid the key as the Keys
    have unique names and this name can be used as the primary key. When I have nonetheless
    chosen a surrogate key, it is because it is a string - a column of the type varchar
    - not always a good candidate for a primary key, first, it may be difficult to
    enter (you can misspell) and partly it is less effective than an int.'
