  md: '# JAVA 6: JDBC AND DATABASE APPLICATIONS FINAL EXAMPLES


    The following script creates a database with one table, that has only one column:


    ```

    use sys;

    create database numbers;

    use numbers;

    create table primes (prime int primary key);

    ```


    To this database I have added a stored procedure that adds the value of a parameter
    n to the table, if n is a prime and not already in the table. The result of the
    procedure is stored in the parameter r.


    ```

    CREATE DEFINER=''pa''@''%'' PROCEDURE ''isprime''(IN n int, OUT r boolean)

    BEGIN

    DECLARE c int;

    SELECT COUNT(*) FROM primes WHERE prime = n INTO c;

    IF c > 0 THEN SET r = false;

    ELSEIF n = 2 OR n = 3 OR n = 5 OR n = 7 THEN SET r = true;

    ELSEIF n < 11 OR mod(n, 2) = 0 THEN SET r = false;

    ELSE

    BEGIN

    DECLARE t int DEFAULT 3;

    DECLARE m double DEFAULT sqrt(n) + 1;

    SET r = true;

    WHILE t <= m AND r = true

    IF mod(n, t) = 0 THEN SET r = false;

    ELSE SET t = t + 2;

    END IF;

    END WHILE;

    END;

    END IF;

    IF r = true THEN INSERT INTO primes VALUES (n);

    END IF;

    END

    ```


    and below an example of an application of the procedure:


    ```

    use numbers;

    set @res = false;

    call isprime(31, @res);

    select @res;

    ```


    The above procedure does not have great practical interest, and the goal is alone
    to show that in a stored procedure you can use program logic the same way as in
    for example Java.


    As a final comment should be added that there is much more to say about stored
    procedures, and you may also have stored functions, but the above should suffice
    to illustrate what a stored procedure is.'
