    ```

    use books;

    set @num = 0;

    call counter(200, 500, @num);

    select @num;

    ```


    It is also possible to define a parameter as INOUT. The following procedure determines
    the average of number of pages in books where the page number is less than or
    equal to the value of the parameter t:


    ```

    CREATE DEFINER=''pa@@%'' PROCEDURE ''average''(INOUT t INT)

    BEGIN

    DECLARE s int;

    DECLARE n int;

    SELECT SUM(pages), COUNT(*) FROM book WHERE pages <= t INTO s, n;

    SET t = s / n;

    END

    ```


    and the procedure can be used as follows:


    ```

    use books;

    set @num = 500;

    call average(@num);

    select @num;

    ```


