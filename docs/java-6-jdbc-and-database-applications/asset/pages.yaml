    INNER SELECT STATEMENTS\It is possible to use an inner SELECT statement in a WHERE
    clause where an inner SELECT returns data that is used in the condition. An inner
    SELECT can be used both in a SELECT, INSERT, UPDATE and DELETE – typically associated
    with operators. A typical example is, using SELECT IN:


    ```

    SELECT isbn, title FROM book WHERE pubnr IN

    (SELECT pubnr FROM publisher WHERE

    name = ''Prentice Hall'' OR name = ''Addison Wesley'');

    ```


    The result is isbn and title of all books published by either Prentice Hall or
    Addison Wesley. Of otherwise, but SELECT IN is easy to understand. Of course one
    can achieve the same result.


