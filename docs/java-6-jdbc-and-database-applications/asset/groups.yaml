    \ 'pa@%'\nSQL SECURITY DEFINER\nVIEW 'books'.'Prentice_hall' AS\nSELECT\n'books'.'book'.'isbn'\
    \ AS 'isbn',\n'books'.'book'.'title' AS 'title',\n'books'.'book'.'edition' AS\
    \ 'edition',\n'books'.'book'.'year' AS 'year',\n'books'.'book'.'pages' AS 'pages'\n\
    FROM\n'books'.'book'\nWHERE\n('books'.'book'.'pubnr' = 2)\n```\n\nThis view may\
    \ then be used in the same way as the other tables, and for example you can write:\n\
    \n```\nSELECT * FROM Prentice_hall;\n```\n\nIndeed, you can also to some extent\
    \ perform SQL INSERT, UPDATE and DELETE statements in a view. Consider as an example\
    \ the following view, which extracts first and last names of all authors where\
    \ the last starts with a K:\n\n```\nCREATE VIEW knames AS SELECT DISTINCT firstname,\
    \ lastname\nFROM author WHERE lastname LIKE 'K%'\n```\n\nIf you then performs\
    \ the statement\n\n```\nSELECT * FROM knames;\n```\n\nyou will see that the view\
    \ contains 8 rows. If you then performs the following statements:\n\n```\nINSERT\
    \ INTO author VALUES (187, 'Poul', 'Klausen');\nselect * from knames;\n```\n\n\
    you will see that the view names now has 9 rows. This means that after the table\
    \ author is updated is the view updated.\n\nNext, if you try:\n\n```\nINSERT INTO\
    \ knames VALUES ('Jens', 'Kristensen');\n```\n\nyou get an error where you are\
    \ told that the parent table can not be updated. Of course it is not strange,\
    \ there is not enough information (there is not an author number) to create a\
