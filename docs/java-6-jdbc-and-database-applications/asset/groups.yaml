    JAVA 6: JDBC AND DATABASE APPLICATIONS


    INTRODUCTION


    # # 1 INTRODUCTION


    Many applications need to use and maintain persistent data. In the preceding books,
    I have solved such tasks by using object serialization or plain text files, which
    indeed in some cases can be an excellent solution, but if there are large amounts
    of data with frequent updates, or where multiple users must have access to the
    data, it is not a viable option. In these cases—and in practice, almost always—data
    are stored in databases.


    A database is a collection of files that contains related data of one or another
    business, but it''s a lot more because it is a software package that consists
    of programs that manages and maintains the database system''s databases. This
    software package is called a *database management system*, and by database system
    we meant the management system as well as the databases that the system maintains.


    In this book I will address key concepts to databases, as the other of the books
    by a programmer, and especially what a programmer needs to know. The subject requires
    a specific database management system, and I will use *MySQL*. In fact, the system
    is not important, but MySQL is available in an open source version that can be
    downloaded and installed for free. MySQL is a powerful database system that supports
    all the services that one would expect from a good database management system,
    and besides MySQL is a widely used system in practice. In order to use MySQL from
    a Java program, you must at install three products:


    +   1. the database management system itself, that is, the *MySQL server*

    2. a program called *MySQL Workbench*, that the user can use to manage the system

    3. a class library called *JDBC*, which makes it possible to write Java applications
    that uses databases


    The book''s appendix A shows how these products can be installed on the machine.


    The following is based on two assumptions:


    +   1. that you have a running *MySQL* server installed with the above products
    (appendix A for how to install the products)

    2. that you have an introductory knowledge of *SQL* and know the most common statements
    (see appendix B for an introduction).


