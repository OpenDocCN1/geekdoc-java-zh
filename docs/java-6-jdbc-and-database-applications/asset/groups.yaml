    # SET OPERATIONS


    If two SELECT commands are union compatible, they are results in the same number
    of columns, the columns of the same type, and the columns in the same order, one
    can perform the UNION:


    ```

    SELECT isbn, title, edition FROM book WHERE isbn LIKE ''87-%''

    UNION

    SELECT isbn, title, edition FROM book WHERE edition = 3 OR edition = 4;

    ```


    The first command returns 7 rows and the second 11 rows. Because UNION removes
    duplicate rows, and there are two rows that are identical, the command will result
    in 16 rows. If you use instead


    ```

    SELECT isbn, title, edition FROM book WHERE isbn LIKE ''87-%''

    UNION ALL

    SELECT isbn, title, edition FROM book WHERE edition = 3 OR edition = 4;

    ```


    duplicate rows retained, and the command will result in 18 rows.'
