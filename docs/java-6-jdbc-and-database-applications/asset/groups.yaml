- md: "\n## JAVA 6: JDBC AND DATABASE APPLICATIONS\n\n## VIEW'S\n\nA view is basically\
    \ nothing more than a SQL statement that is stored in the database, as it can\
    \ be seen as a form of virtual table, as you in principle use it in the same way,\
    \ as you use other tables. A view can be created on basis of one or more tables,\
    \ but what you can do with a view is determined by how it is created. The purpose\
    \ of a view is\n\n- to structure the content of a database corresponding to the\
    \ users' use of the database\n- limiting access to the data that users can work\
    \ with\n- allowing data from multiple tables to appear as a single table\n\nIn\
    \ MySQL Workbench you can create a view by right-click on Views (the tab SCHEMA)\
    \ and choose Create View. You then gets the following skeleton:\n\n```\nCREATE\
    \ VIEW 'new_view' AS\n```\n\n![](img/6ad878d79c28ad17393542a46f05544d_177_0.png)\n\
    \nAs an example, you can write the following view:\n\n```\nCREATE VIEW Prentice_hall\
    \ AS SELECT isbn, title, edition, year, pages\nFROM book WHERE pubnr = 2;\n```\n\
    \nwhich defines a view called Prentice_hall for all books where pubnr 2 extracts\
    \ the isbn, title, edition, year and pages. This is the view of columns in the\
    \ table of all books published by Prentice Hall. When you click Apply. MySQL Workbench\
