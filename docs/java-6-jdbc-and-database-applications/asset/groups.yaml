    # SQL DATA TYPES


    As in the above script that creates the database books, then each column has a
    data type. Here are the following options:


    +   * Int, that can contain an integer between -2147483648 and 2147483647.

    * Smallint, that can contain an integer between -32768 and 32767.

    * Tinyint, that can contain an integer between 0 and 255.

    * Bit, that is 0 or 1 (in MySQL) you can also write Bool, that means the same.

    * Bigint, that can contain an integer between the two integers -9223372036854775808
    and 9223372036854775807.

    * Numeric (or Decimal) to decimal numbers -10^38 and +1 and 10^38 -1

    * Money to currency values and can contain a value between -9223372036854775808
    and 9223372036854775807'
