    ## SET OPERATIONS


    If two SELECT commands are union, they results in the same number of columns,
    and the columns in the same order one can perform:


    ```

    SELECT isbn, title FROM book WHERE isbn LIKE ''87-%''

    UNION

    SELECT isbn, title FROM book WHERE edition = 3;

    ```


    The first command returns 7 rows and the second 11 rows. Because UNION removes
    duplicate rows, and there are two rows that are identical, if you use instead


    ```

    SELECT isbn, title FROM book WHERE isbn LIKE ''87-%''

    UNION ALL

    SELECT isbn, title FROM book WHERE edition = 3;

    ```


    duplicate rows, and the command will result in 18 rows. Instead of UNION you can
    write INTERSECT and the result is intersection. This clause is not supported by
    MySQL. It is possible to write EXCEPT that means difference, but this clause is
    not supported by MySQL.


    ## SQL FUNCTIONS


    As part of SQL commands Above I have already used SUM() and COUNT(). The following
    is a listing of the most important functions, and there are many, but they can
    be divided into groups:


    - 1. general functions

    - 2. numeric functions

    - 3. strings functions

    - 4. date and time functions

    - 5. (sometimes large) number of functions, depending on the database.


