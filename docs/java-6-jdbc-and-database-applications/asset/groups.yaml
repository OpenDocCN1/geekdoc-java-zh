    ## JAVA 6: JDBC 与数据库应用

    ## 最终示例


    菜单项 *wines*（葡萄酒）具有 9 个功能，对于这 9 个功能中的每一个，都应该发生以下情况：


    - 1. *Repository* 类必须扩展 4 个新方法：一个返回与数据库表内容对应的对象列表的方法、一个在数据库中创建新行的方法、一个更新现有行的方法以及一个删除现有行的方法。

    - 2. 有一个类是 *JTable* 组件的数据模型。

    - 3. 有一个类是带有 *JTable* 组件的对话框。

    - 4. 有一个类是用于编辑对象的对话框的控制器。

    - 5. 有一个类是最后一个对话框。


    菜单有 9 个功能意味着程序可能会扩展 36 个新类，例如 *Repository* 类必须扩展 36 个新方法。这听起来很多，但反之也如此。请注意，程序中还提到了用于维护
    9 个数据库表的代码，你应该注意这些类通常是简单的，示例适用于 *Repository* 类中的方法。


    你还应该注意到，这种实现是程序维护数据库表的一种模式，其中你有一个带有 *JTable* 和显示数据库内容的过滤对话框，你可以在表格中添加或编辑行。我喜欢用这种方式工作，因为当表格变化时逻辑很清晰，但也有其他方法，这里特别重要的是指出，人们可以直接编辑
    *JTable* 的内容。


    # 葡萄酒表


    wine 表的维护遵循相同的模式。也就是说，*MainView* 有一个按钮用于创建新葡萄酒，如果双击表格中的某行，就可以编辑该葡萄酒。在这两种情况下都使用了对话框，原则上意味着与上述相同：


    - *Repository* 类必须扩展 3 个新功能（返回所有葡萄酒的功能已经实现）

    - 为该对话框编写一个控制器

    - 必须编写对话框本身


    区别在于，这次是一个非常复杂的对话框，具有许多其他功能。如果你在主窗口中双击某款葡萄酒，结果如下所示。


    ![](img/6ad878d79c28ad17393542a46f05544d_126_0.png)


    ## JAVA 6: JDBC 与数据库应用

    ## 最终示例


    对话框左侧有用于输入信息的字段，可以输入信息；右侧是用于从维度表中选择值的组合框。除了用于葡萄的 *JTable* 组件外，一切都应该是一目易懂的。底部显示了数据库中所有葡萄的表格以及关联过滤器。顶部是用于此葡萄酒的葡萄。如果你现在在下方的
    JTable 中通过勾选选择框选择一个或多个葡萄并点击 Add（添加）按钮，葡萄就会添加到上方的 JTable 中，因此葡萄就成了葡萄酒的一部分。在上方 JTable
    中，你同样可以勾选一个或多个复选框，如果点击 Remove（移除），葡萄将从葡萄酒中移除。顶部的 JTable 还有一列用于记录该葡萄在该葡萄酒中的占比（如果该葡萄酒由多种葡萄组成）。该列通过在（percent）（百分比）中输入值来编辑。


    窗口顶部有 6 个按钮。它们用于创建某种类型的对象，因此功能与从菜单中选择的功能相同。这些快捷键的含义是，当你准备创建一个新葡萄酒（或编辑现有的葡萄酒），并发现葡萄酒来自一个尚未创建的地区，你可以立即创建该地区。这
    6 个功能使用了之前为维护维度表创建的相同对话框。


