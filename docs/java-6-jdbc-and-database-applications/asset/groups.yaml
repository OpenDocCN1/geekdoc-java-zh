    # JAVA 6: JDBC AND DATABASE APPLICATIONS FINAL EXAMPLES


    The command is easy enough to understand. After SET follows comma-separated list
    of column names and values, where the values are the new values. There is the
    WHERE clause, which is followed by a condition that determines which rows to be
    modified. A WHERE clause can be extremely complex, which will also appear from
    the following about SELECT, but in this case it defines exactly one row. A WHERE
    may define multiple rows, where appropriate, all the rows that satisfy the condition
    are updated. You must specifically note that it is not a requirement that an UPDATE
    command has a WHERE part, and if not, all the table''s rows are updated. Also
    note that you cannot change the value of the primary key.


    As another example the following command shows how to set value in a column to:


    ```

    UPDATE book SET edition = NULL WHERE isbn = ''87-7900-910-77'';

    ```


    The command assumes of course the column allows NULL values.


    Then there is the DELETE command that is used to delete rows. Suppose you have
    performed the following command:


    ```

    INSERT INTO category VALUES (10, ''Test category'');

    ```


    that inserts a row in a table category. If you want to delete the row again, you
    can do it in the following way:


    ```

    DELETE FROM category catnr = 10;

    ```


    So it is simple to delete rows in a table, but there are a few things you should
    be aware of. First, the WHERE part can specify multiple rows, and if all rows
    that satisfy the condition after the WHERE clause are deleted. Moreover, it is
    allowed to completely omit the WHERE clause, and if so, the command deletes all
    rows in the table. One should be careful with DELETE, since it''s easier to delete
    more than the thought is.


    In this case, the table book has a foreign key to the table category, and if there
    is a book that refers to the category with the key 10, the row is not deleted.
    It is at least the default, but there are other options. In the table book could
    have defined foreign key as:


    ```

    FOREIGN KEY (catnr) REFERENCES category (catnr) ON DELETE SET NULL

    ```


