    # JAVA 6: JDBC AND DATABASE APPLICATIONS


    JDBC


    You must add an import statement to the necessary types:


    ```

    import java.sql.*;

    ```


    Then you must define a connection to the database:


    ```

    conn = DriverManager.getConnection(

    "jdbc:mysql://localhost:3306/padata?useSSL=false","pa","Volmer_1234");

    ```


    Writing connection in fact is the only difficulty of writing database applications,
    as it should be written correctly and it depends on the specific database product.
    The method getConnection() has three parameters. The first is a connection string,
    while the last two are the username and the password to the database. In this
    case, they are direct encoded strings, and it may of course not be the solution
    to an application which is used in an operation condition, but about this later.
    Connection string consists of the database server that there is a MySQL server
    on the local machine:


    ```

    jdbc:mysql://localhost

    ```


    This is followed by the port number (which incidentally is not necessary, since
    3306 is the default port number for MySQL), and finally the name of the database,
    which is padata. In this case, there is also provided information that the database
    does not require an SSL connection. If you need to use a database on another machine,
    you must type something else than localhost (possible an IP) and you may also
    need to use a different port number. Be aware that the connection string looks
    different if it is another database than MySQL.


    After the connection is defined the program creates a Statement, which is an object
    that represents a SQL statement, and the statement is executed by the method executeQuery(),
    wherein the parameter is a SQL SELECT command. The result of this method is a
    ResultSet, which is a collection with each object of the rows, the SQL extracted
    from the database. After the statement is successfully executed, the application
    performs a loop that iterates over the rows, and for each row prints a line with
    the values of the row''s fields and the values in each column. You should note,
    how to refer to values using methods in the class ResultSet and the column names
    from the database.


    The most database operations can raise a SQLException, so the statements are placed
    in a try block. The associated finally blocks closes the Statement and the Connection,
    and it is important to release the resources allocated.


