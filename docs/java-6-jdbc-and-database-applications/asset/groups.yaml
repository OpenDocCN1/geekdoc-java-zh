    %-%20s%5d%5d\\n\", name, birth, death);\n}\n```\n\n![](img/6ad878d79c28ad17393542a46f05544d_23_0.png)\n\
    \nJAVA 6: JDBC DATABASE APPLICATIONS RESULTSET\n\n```java\ncatch (Exception ex)\n\
    {\n    System.out.println(ex);\n}\n```\n\nA resultset has a number of methods\
    \ to retrieve the values for the current row, and in the foregoing examples, I\
    \ each time has retrieved the values with the column name. Actually, it is also\
    \ allowed to enter an index, starting with 1 for the first column. You should\
    \ note that the index does not refer to the physical table, but the columns specified\
    \ in the SELECT statement. In this case, there are three columns, and the indexes\
    \ are therefore 1, and 3.\n\n# 4.1 UPDATE A RESULTSET\n\nThe following method\
    \ shows that one can update a resultset:\n\n```java\nprivate static void test04()\n\
    {\n    try (Connection conn = DriverManager.getConnection(\n        \"jdbc:mysql://localhost:3306/padata?useSSL=false\"\
    , \"pa\", \"Volmer_1234\")) {\n        Statement stmt = conn.createStatement(ResultSet.TYPE_CONCUR_INSENSITIVE,\
    \ ResultSet.UPDATABLE);\n        ResultSet res = stmt.executeQuery(\"SELECT *\
    \ FROM history\");\n        insert(res);\n        res.last();\n        printRow(res);\n\
    \        update(res, \"King\", \"Probably lived between the years 400 and 5000\"\
    );\n        printRow(res);\n        update(res, \"Legends king\", res.getString(\"\
    description\") + \n        \" and his story is described in Rolf Krake's Saga\"\
    );\n        printRow(res);\n        while (true) {\n            res = stmt.executeQuery(\"\
    SELECT id FROM history WHERE name LIKE 'Rolf%%'\");\n            if (res.next())\
    \ {\n                int id;\n                System.out.println(id = res.getInt(\"\
    id\"));\n                print(\"SELECT * FROM history WHERE id = \" + id);\n\
    \                delete(res);\n            } else break;\n        }\n    }\ncatch\
    \ (SQLException ex)\n{\n    System.out.println(ex);\n}\n```\n\nFirst, you notice\
    \ that the creation of a Statement object allows you to update a ResultSet. Next,\
    \ all rows are extracted from the table history, and then the method insert()\
    \ is called with the ResultSet as a parameter:\n\n```java\nprivate static void\
    \ insert(ResultSet res)\n{\n    res.moveToInsertRow();\n    res.updateString(\"\
    name\", \"Rolf Krake\");\n    res.updateString(\"country\", \"DK\");\n    res.insertRow();\n\
    catch (SQLException ex)\n{\n    System.out.println(ex);\n}\n```\n\nThis method\
    \ adds a new row to the ResultSet object and assigns values to two of the columns.\
    \ The last method writes the changes physically back to the database. If you do\
    \ not want that, you can omit this, and the row is just inserted in the ResultSet\
    \ object in memory.\n\nAfter the new row is inserted, the test method sets the\
    \ cursor to the last and prints the row by a method printRow(). The next statement\
    \ calls a method update(), which updates the row that the cursor points to:\n\n\
    ```java\nprivate static void update(ResultSet res, String title, String description)\n\
    {\n    res.updateString(\"title\", title);\n    res.updateString(\"description\"\
    , description);\n    res.updateRow();\ncatch (SQLException ex)\n{\n    System.out.println(ex);\n\
    }\n```\n\n# JAVA 6: JDBC AND DATABASE APPLICATIONS RESULTSET\n\nThere is updated\
    \ two columns, and again it's the last statement, which writes the changes back\
    \ to the database. The test method prints then the row again, so you can see that\
    \ the changes are made, after which the row is updated once again.\n\nNext, the\
    \ method performs an infinite while loop where it starts to execute a query on\
    \ persons where the name starts with Rolf. There should only be 1. If there is\
    \ such a row (res.next() is true) the row is removed with the method delete().\
    \ If the row is not found a break is performed, and the loop stops. The goals\
    \ is to show that the updates are physically in the database, so that in the next\
    \ iteration, no rows are found. The method delete() is quite simple and deletes\
    \ the row that the cursor points to:\n\n```java\nprivate static void delete(ResultSet\
    \ res) {\ntry {\nres.deleteRow();\n} catch (SQLException ex) {\nSystem.out.println(ex);\n\
    }\n```\n\n![](img/6ad878d79c28ad17393542a46f05544d_26_0.png)\n\nYou should note\
    \ that the method's while loop in case there are found a row calls the method\
    \ print() with a SQL expression as a parameter. The objective is to show that\
    \ the new row is available on request associated with another connection, and\
    \ thus the row is physically stored in the database. If you performs the test\
    \ method, the result could be:\n\n| Rolf Krake | null | 0 0 DK |\n|---|---|---|\n\
    | Rolf Krake | King | 0 0 DK |\n| Probably lived between the years 400 and 500\
    \ | | |\n| Rolf Krake | Legends king | 0 0 DK |\n| Probably lived between the\
    \ years 400 and 500 and his story is described in Rolf Krake's Saga | | |\n| 70\
    \ | Rolf Krake | Legends king | 0 0 DK |\n| Probably lived between the years 400\
    \ and 500 and his story is described in Rolf Krake's Saga | | |\n\nThe test method\
    \ also uses a method printRow(), which prints a row on the screen (the row the\
