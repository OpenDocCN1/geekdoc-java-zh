    \ AS SELECT autnr, firname, lastname\nFROM author WHERE lastname LIKE 'L%';\n\
    ```\n\nthis time defines a column to all columns in the author table. Perform\
    \ now the statement:\n\n```\nINSERT INTO lnames VALUES (1000, 'Knud', 'Larsen');\n\
    ```\n\nand you will see that both the view and the original table is updated.\
    \ This means an update of the view also updates the parent table, but there are\
    \ the following conditions:\n\n- THE SELECT statement may not use DISTINCT\n-\
    \ THE SELECT statement may not contain functions\n- THE SELECT statement may not\
    \ contain operators\n- THE SELECT statement may not use ORDER BY\n- THE SELECT\
    \ statement can use only one table\n- THE SELECT statement’s WHERE part may not\
    \ use a SELECT statement (see below)\n- THE SELECT statement may not use GROUP\
    \ BY or HAVING\n- THE SELECT statement must include all columns from the parent\
    \ table that is defined NOT NULL\n\n## JAVA 6: JDBC AND DATABASE APPLICATIONS\
    \ FINAL EXAMPLES\n\n### INNER SELECT STATEMENTS\n\nIt is possible to use an inner\
    \ SELECT statement in a WHERE clause where an inner SELECT returns data that is\
    \ used. The inner SELECT is also called a subquery. The subquery is always enclosed\
    \ in parentheses within the main query. The subquery can be used in the SELECT,\
    \ FROM, WHERE, and HAVING clauses.\n\nThe following example shows how to use a\
    \ subquery in the WHERE clause:\n\n```sql\nSELECT * FROM book\nWHERE pubnr = (SELECT\
    \ pubnr FROM publisher WHERE name = 'Prentice Hall');\n```\n\nThis query returns\
    \ all books that are published by Prentice Hall. The subquery `SELECT pubnr FROM\
    \ publisher WHERE name = 'Prentice Hall'` returns a single value, which is then\
    \ used in the main query. If the subquery returns more than one value, the query\
    \ will return an error. In that case, you should use the IN or ANY operator:\n\
    \n```sql\nSELECT * FROM book\nWHERE pubnr IN (SELECT pubnr FROM publisher WHERE\
    \ name LIKE 'Prentice%');\n```\n\nThis query returns all books that are published\
    \ by any publisher that starts with Prentice. A subquery can also be used in the\
    \ FROM clause. This is often called a derived table:\n\n```sql\nSELECT b.title,\
    \ p.name\nFROM book b, (SELECT pubnr, name FROM publisher WHERE name LIKE 'Prentice%')\
    \ p\nWHERE b.pubnr = p.pubnr;\n```\n\nIn this example, the subquery creates a\
    \ temporary table that is then joined with the book table. A subquery can also\
    \ be used in the SELECT clause:\n\n```sql\nSELECT title, (SELECT count(*) FROM\
    \ order o WHERE o.isbn = book.isbn) AS orders\nFROM book;\n```\n\nThis query returns\
    \ the title of each book and the number of orders for each book. The subquery\
    \ is executed for each row of the book table, which can be inefficient if the\
    \ table has many rows. A better approach would be to use a JOIN:\n\n```sql\nSELECT\
    \ b.title, count(o.isbn) AS orders\nFROM book b\nLEFT JOIN order o ON b.isbn =\
    \ o.isbn\nGROUP BY b.title;\n```\n\nFinally, a subquery can be used in the HAVING\
    \ clause:\n\n```sql\nSELECT category, count(*)\nFROM book\nGROUP BY category\n\
    HAVING count(*) > (SELECT AVG(count(*)) FROM book GROUP BY category);\n```\n\n\
    This query returns categories that have more than the average number of books\
    \ across all categories.\n\n### STORED PROCEDURES\n\nA stored procedure is a set\
    \ of SQL statements that are stored in the database and can be called by name.\
    \ Stored procedures are used to improve performance, reusability, and security.\n\
    \nA stored procedure can take parameters, which are of three types: IN, OUT, and\
    \ INOUT. The following example shows a stored procedure that takes an IN parameter:\n\
    \n```\nCREATE PROCEDURE GetBooksByPub(IN p_pubnr INT)\nBEGIN\n    SELECT * FROM\
    \ book WHERE pubnr = p_pubnr;\nEND\n```\n\nTo call this procedure, use the CALL\
    \ command:\n\n```sql\nCALL GetBooksByPub(2);\n```\n\nThe following example shows\
    \ a stored procedure that returns an OUT parameter:\n\n```\nCREATE PROCEDURE GetBookCount(IN\
    \ p_pubnr INT, OUT p_count INT)\nBEGIN\n    SELECT count(*) INTO p_count FROM\
    \ book WHERE pubnr = p_pubnr;\nEND\n```\n\nTo call this procedure, use a session\
    \ variable:\n\n```sql\nCALL GetBookCount(2, @count);\nSELECT @count;\n```\n\n\
    The following example shows a stored procedure that uses an INOUT parameter:\n\
    \n```sql\nCREATE PROCEDURE IncrementCount(INOUT p_count INT)\nBEGIN\n    SET p_count\
    \ = p_count + 1;\nEND\n```\n\nTo call this procedure, use a session variable:\n\
    \n```sql\nSET @count = 10;\nCALL IncrementCount(@count);\nSELECT @count;\n```\n\
    \nStored procedures can also contain control structures, such as loops and conditional\
    \ statements.\n\n```\nCREATE PROCEDURE ProcessNumbers(IN p_limit INT)\nBEGIN\n\
    \    DECLARE v_counter INT;\n    SET v_counter = 1;\n    WHILE v_counter <= p_limit\
    \ DO\n        SELECT v_counter;\n        SET v_counter = v_counter + 1;\n    END\
    \ WHILE;\nEND\n```\n\nStored procedures are also useful for implementing complex\
    \ logic. For example, a procedure could handle a bank transfer between two accounts:\n\
    \n```\nCREATE PROCEDURE TransferFunds(IN p_from_account INT, IN p_to_account INT,\
    \ IN p_amount DECIMAL)\nBEGIN\n    DECLARE exit_code INT;\n    DECLARE EXIT HANDLER\
    \ FOR SQLEXCEPTION\n    BEGIN\n        ROLLBACK;\n    END;\n\n    START TRANSACTION;\n\
    \    UPDATE account SET balance = balance - p_amount WHERE id = p_from_account;\n\
    \    UPDATE account SET balance = balance + p_amount WHERE id = p_to_account;\n\
    \    COMMIT;\nEND\n```\n\nStored procedures are a powerful feature of database\
    \ management systems and can be used to build robust and efficient applications.\n\
    \n![](img/6ad878d79c28ad17393542a46f05544d_180_0.png)\n"
