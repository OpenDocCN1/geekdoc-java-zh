    JAVA 6: JDBC AND DATABASE APPLICATIONS


    FINAL EXAMPLES


    By associating a controller for a dialog you achieves two things:


    - 1. everything regarding algorithms and business logic is moved into a separate
    class

    - 2. the code of dialog box becomes simpler and easier to understand


    Now one should not at any price attach a controller class for a dialog/window.
    A controller class must contain something interesting for it to make sense.


    ## IMPORT CSV FILE


    The last feature that is missing is updating the exchange rates from a CSV file.
    This includes being able to open the file, parse it and use the result of the
    parsing to update the database table currency. With regards to the file, it is
    an activity that belongs in an event handler in the MainView. When the file is
    selected, it is sent to the controller class for MainView, which then parses the
    file and validate the individual lines. On the basis of the legal lines it creates
    `Currency` objects, which are sent to a method in the class `Repository`, which
    then updates the database.


    ## 10.2 MYWINES


    The following project is to create a classic database application. This means
    that you must create a database and write a program that can maintain this database.
    The program is an ordinary PC application, which should maintain information about
    a private wine cellar, which is not entirely realistic. Should such a program
    be written in practice, you would probably write a web application. It should
    be ignored, and the purpose of the project is to test most of the substance that
    is treated in this book.


    Compared with the programs I have shown in this and in the previous books, it
    is a relatively large program, and it is also a program that can be used in practice
    if one has a wine cellar and feel a need to register his wine consumption. The
    program consists of many classes (about 80), and there are more than 25 windows
    (dialogs). Now its is all not violent as its sounds. Most of the dialog boxes
    are simple, and the goes the same for the corresponding classes. All dialog boxes
    are implemented in the same manner with a view class that implements everything
    the user interface, and one or two model classes. There will always be a model
    class, which models the object the dialog box maintains, and in the case where
    the dialog box has to display a collection of objects (rows in a database table),
    a Table In addition to model classes most dialog boxes also have a controller
    class that validates the user input and possible calls methods in the application''s
    repository to update the database. You should therefore note that many dialog
    boxes are implemented in the same way that makes it easier to understand the program
    and thus maintain the code.


    When you have to write a program which, that as in this example, will consist
    of many dialog boxes (the program has many features) which are similar and almost
    works the same way, you can then try to reduce the code and the number of dialog
    boxes by parameter control dialog boxes and apply to multiple functions depending
    on the parameters that are transferred to the constructors. If you do that, you
    get less code and fewer classes and thus, in principle, a program that is easier
    to maintain, but however more complex classes, which can be difficult to understand,
    because you have dialog boxes that perform several functions. Conversely, a dialog
    box for every function makes the number of classes becomes very large, which in
    turn mean that you have to change in many places for maintains the program. It
    is a choice, and in the current solution I have tried to some extent to parameter
    control dialogs without letting it beyond clarity.


    You are encouraged to spend the time reading the following description of how
    the program is designed and also to study the final result and including primary
    the program’s code and to test the program.


    ## THE TASK


    Many private wine loves a substantially wine storage – perhaps several hundred
    bottles or more. It requires control, to ensure that the wine is not too old,
    but for the sake of historical data with information about prices, ratings, etc.
    These historical data are vital when buying the same wine again, but also to learn
    from experience and in general as documentation of purchase and consumption. There
    is thus not only a need to keep track of the current stock, but at least as much
    to store information about wines that are drunk and removed from the wine cellar.


    The wines are acquired from different Danish suppliers – including grocery stores,
    but there may also be store entries either in the form of direct import (that
    is from holidays or trips to wine countries) or gifts. The wines are purchased
    at greatly varying prices, and especially in connection with gifts, the price
    can be 0 (or lack of). It is common in the business, the granting of.


    The task is to write a program called MyWines that should manage the wine cellar.
    The program should basically have the following features:


    - 1. Register/create new wines (purchase)

    - 2. Updates (consumption from the store and classifications)

    - 3. Search functions


    Because the work of records information about wines can be comprehensive (there
    may be many details), you should aim for a solution where you have to enter as
    little as possible, and where it is easy to get the data available, which is already
    in the system. For both the supplier and the wine itself one can not expect that
    all the information is present, and the same goes for how long the wine can be
    saved, discount and classification when a new wine must be added to the store,
    and in general you should be aware that sometimes you only have the knowledge
    that you can get from the label on the bottle.


    In general, every time there is used a bottle from the store, you have to register,
    which wine it is, how many bottles are taking and when. On the whole, you should
    priority that the program is easy to use and it is important that the program
    is robust and react sensibly by improper operation.

    '
  mdcn: '


    JAVA 6：JDBC 与数据库应用程序


    最终示例


    通过为对话框关联控制器，你可以实现两个目标：


    - 1. 所有关于算法和业务逻辑的内容都移动到了一个单独的类中

    - 2. 对话框的代码变得更简单且易于理解


    现在，无论任何情况下都不应为对话框/窗口附加控制器类。控制器类必须包含某些有趣的内容才有意义。


    ## 导入 CSV 文件


    最后一个缺失的功能是从 CSV 文件更新汇率。这包括能够打开文件、解析文件，并使用解析结果更新数据库中的 `currency` 表。对于文件而言，这是一个属于
    `MainView` 中事件处理程序的活动。当选择了文件时，它会被发送到 `MainView` 的控制器类，然后由该类解析文件并验证每一行。根据合法行，它会创建
    `Currency` 对象，并将这些对象发送到 `Repository` 类中的一个方法，然后更新数据库。


    ## 10.2 MYWINES


    接下来的项目是创建一个经典的数据库应用程序。这意味着你必须创建一个数据库并编写一个可以维护该数据库的程序。该程序是一个普通的 PC 程序，用于维护私人酒窖的信息，这并不完全符合现实。如果在实践中要编写这样的程序，你可能会写一个
    Web 应用程序。这应该被忽略，项目的目的是测试本书书中涉及的大部分核心内容。


    与我在本书和前一书中展示的程序相比，这是一个相对较大的程序，而且如果你有一个酒窖并觉得需要记录自己的饮酒情况，这是一个可以在实践中使用的程序。程序由许多类（约
    80 个）以及超过 25 个窗口（对话框）组成。现在这听起来并不复杂。大多数对话框都是简单的，相应的类也是如此。所有的对话框都以相同的方式实现：一个实现所有用户界面的视图类，以及一两个模型类。总会有一个模型类来模拟对话框维护的对象；而在对话框必须显示对象集合（数据库表中的行）的情况下，会使用表格。除了模型类外，大多数对话框还有一个控制器类，它用于验证用户输入，并可能调用应用程序存储库中的方法来更新数据库。因此，你应该注意，许多对话框是以相同的方式实现的，这有助于理解程序并从而便于维护代码。


    当你必须编写一个像本示例这样、由许多相似且工作方式几乎相同的对话框组成（程序具有许多功能）的程序时，你可以尝试通过参数控制对话框来减少代码和对话框的数量，并根据传递到构造函数的参数将其应用于多个功能。如果你这样做，你获得的代码更少，类更少，因此在原则上程序更容易维护，但类会变得更复杂且可能难以理解，因为你拥有执行多个功能的对话框。相反，为每个功能创建一个对话框会导致类的数量变得非常大，这意味着你在维护程序时需要在很多地方进行更改。这是一种选择，在当前的解决方案中，我尝试在某种程度上实现了参数控制对话，但没有使其模糊。


    鼓励你花时间阅读以下关于程序设计的描述，并研究最终结果（主要是程序的代码）并测试程序。


    ## 任务


    许多葡萄酒爱好者拥有大量的葡萄酒储量——也许有几百瓶甚至更多。这需要控制以确保葡萄酒不会过老，同时也为了获得有关价格、评分等信息的历史数据。这些历史数据在再次购买同一款葡萄酒时至关重要，也可以从中获得经验，并通常作为购买和消费的记录。因此，不仅需要跟踪当前库存，至少还需要存储关于已饮用并从酒窖中移除的葡萄酒的信息。


    葡萄酒是从不同的丹麦供应商处购买的——包括超市，但也可能以直接进口（即来自假期或葡萄酒产地旅行）或礼品的形式出现在商店中。葡萄酒的价格差异很大，特别是在礼品的情况下，价格可能是
    0（或缺失）。在业务中，赠送是很常见的现象。


    任务是编写一个名为 `MyWines` 的程序，用于管理酒窖。该程序基本上应具备以下功能：


    - 1. 注册/创建新葡萄酒（购买）

