  mdcn: "\n\n## JAVA 6: JDBC 与数据库应用程序\n\n为了演示如何从 Java 程序使用数据库，你必须拥有一个数据库。打开 MySQL\
    \ Workbench（如下所示）。执行输入的命令。你可以通过点击工具栏上的第三个图标（闪电）来操作。结果是创建了一个名为 `padata` 的数据库。如果你愿意，可以选择不同的名称，但选择与我相同的名称（我所使用的名称）会更容易跟随书中的示例和练习。到为止，这是一个空数据库，但通过这本书，我将创建几个带有数据的表。\n\
    \n本书的文件夹包含一个名为 `CreateHistorie.sql` 的 SQL 脚本。在 MySQL Workbench 中打开此脚本。其内容如下：\n\
    \n![](img/6ad878d79c28ad17393542a46f05544d_8_0.png)\n\npadata:\ndrop table if\
    \ exists history;\n\n```sql\ncreate table history\n(\n  id int not null auto_increment\
    \ primary key, \n  name varchar(50) not null, # 姓名\n  title varchar(30),\n  birth\
    \ int, # 出生、执位开始时间或等效\n  death int, # 死亡、执位结束时间或等效\n  country char(2), # 人所在的国家\n\
    \  description text # 描述\n);\n```\n\n## JAVA 6: JDBC 与数据库应用程序\n\n这是一个创建一个包含历史人物信息的表的脚本。表由行和列组成，每行包含关于某个特定人物的数据（信息）。每一列都有类型和名称。名称使得可以在\
    \ SQL 语句中引用该列，而类型决定了该列可以存储什么类型的值。参考上面的脚本，指定第一列，该列必须包含一个自动生成的整数，从 1 开始，并在每次向表中添加行时增加\
    \ 1。此外，还定义了该列必须是主键，这意味着该列的值必须是唯一的，因此可以用来标识每行。接下来的两列类型为 `varchar`，表示该列可以包含字符串，在这种情况下，最大长度分别为\
    \ 50 和 30 个字符。接下来的列可能再次包含整数，名为 `country` 的列必须包含一个 2 个字符的字符串。最后一列可以包含任何文本（最多 65535\
    \ 个字符）。列名被定义为 `not null`（非空），这意味着每一行在该列中必须有一个值。其他列（第一列外）不需要有值，但可以为 `null`。\n\n\
    书的目录还包含一个 `InsertHistory.sql` 脚本，下面显示了几行：\n\n```sql\nuse padata;\ninsert into\
    \ history (name, death, title, country) values\n('Gorm den Gamle', 958, 'King',\
    \ 'DK');\ninsert into history (name, birth, death, title, country) values\n('Harald\
    \ Blåtand', 958, 997, 'DK');\n```\n\n如果你在 MySQL Workbench 中打开并执行该脚本，脚本将向 `history`\
    \ 表添加 52 行数据，这些行包含了关于丹麦国王的信息。以下假设此表已创建，并执行了 `InsertHistory.sql` 脚本。\n\n## 关于代理键\n\
    \n当你需要（设计）数据库表时，你必须选择一个或多个列作为主键（如上面的 `id`）。这意味着对于 Java 程序而言，API 在 `java.sql` 包中定义了必要的类型作为接口和类，而具体的类型由\
    \ JDBC 驱动程序实现。因此，程序必须连接的每个数据库都必须有一个 JDBC 驱动程序，通常由数据库供应商开发 JDBC 驱动程序。你可以将 JDBC\
    \ 驱动程序认为是数据库和 Java 程序之间的一层，确保程序无论使用哪种数据库系统，都能以相同的方式使用数据库。该列可以作为主键，它被称为“代理键”（surrogate\
    \ key），因为它是另一个键列的替代品。实际上，如果可能，应避免使用代理键，因为它们会向表中添加无意义的数据；在这种情况下，可以避免使用键，因为键具有唯一的名称，且该名称可以作为主键。尽管我选择了代理键，那是因为它是字符串——`varchar`\
    \ 类型的列——这并不总是主键的理想候选者，首先，它可能难以输入（你可能会拼错），其次，它的效率低于 `int` 类型。\n\n## 2 JDBC\n\n\
    JDBC 是一系列类，它们实现了 JDBC API 中定义的接口，并使得 Java 程序能够与数据库服务器进行通信。对于 Java 程序而言，API 在 `java.sql`\
    \ 包中定义了必要的类型（作为接口和类），而具体的类型则由 JDBC 驱动程序实现。因此，程序必须连接的每个数据库都必须有一个 JDBC 驱动程序，通常由数据库供应商开发\
    \ JDBC 驱动程序。你可以将 JDBC 驱动程序认为是数据库和 Java 程序之间的一层，确保程序无论使用哪种数据库系统，都能以相同的方式使用数据库。\n\
    \n## 2.1 HELLOJDBC\n\n在我进一步查看有关 JDBC 的细节之前，我将通过一个示例来展示从 Java 程序使用数据库是非常简单的。以下程序从\
    \ `history` 表读取数据并打印到屏幕上：\n\n```java\npackage hellojdbc;\n\nimport java.sql.*;\n\
    \npublic class HelloJDBC\n{\n    public static void main(String[] args)\n    {\n\
    \        Connection conn = null;\n        Statement stmt = null;\n        try\
    \ {\n            conn = DriverManager.getConnection(\"jdbc:mysql://localhost:3306/database?useSSL=false\"\
    ,\"padata\");\n            stmt = conn.createStatement();\n            ResultSet\
    \ res = stmt.executeQuery(\"SELECT * FROM history\");\n            while(res.next())\
    \ {\n                String name = res.getString(\"name\");\n                String\
    \ title = res.getString(\"title\");\n                int birth = res.getInt(\"\
    birth\");\n                int death = res.getInt(\"death\");\n              \
    \  String country = res.getString(\"country\");\n                System.out.printf(\"\
    %s-%s-%d-%d-%s\\n\", name, title, birth, death, country);\n            }\n   \
    \     } catch (SQLException e) {\n            e.printStackTrace();\n        }\
    \ finally {\n            if (stmt != null) stmt.close();\n            if (conn\
    \ != null) conn.close();\n        }\n    }\n}\n```\n\n"
