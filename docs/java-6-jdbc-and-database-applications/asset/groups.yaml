  - '[PAGE 21]


    # 4 RESULTSET


    The most complex SQL statement is SELECT, and it is a very complex statement with
    many options. From a Java program you can perform a SQL SELECT with executeQuery(),
    although the SELECT statement can be complex, the result seen from the Java program
    is always the same: A ResultSet object. You can think of the object as a collection
    of objects with an internal cursor points to an object (row), or the cursor is
    null if it is not pointing to anything. The class ResultSet defines many methods
    that can basically be divided into three:


    +   1. methods to move the cursor

    2. get methods that return the value for a column at the current row

    3. update methods that update the column value for the current row and you even
    have the opportunity to write the changes to the database


    To create a Statement object, I have so far used the following syntax:


    ```

    Statement stmt = connection.createStatement();

    ```


    that creates a Statement object, but createState() has an override of the form:


    ```

    createStatement(int resultSetType, int resultSetConcurrency);

    ```


    Here you can find for the first parameter three values:


    +   1. ResultSet.TYPE_FORWARD_ONLY, that means, that the cursor can move forward
    and is the default value

    2. ResultSet.TYPE_SCROLL_INSENSITIVE, that means, that the cursor can move both
    back and forth, and that the ResultSet is not updated with changes that other
    users had to make the database after this ResultSet is created

    3. ResultSet.TYPE_SCROLL_SENSITIVE, which means the same as above, but with the
    difference that the ResultSet is updated with changes that other users had to
    make the database after this ResultSet is created


    As default a ResultSet is readonly, but for the last of above two parameters there
    are two


    +   1. ResultSet.CONCUR_READ_ONLY, that creates a readonly ResultSet and is the
    default

    2. ResultSet.CONCUR_UPDATABLE, which creates a ResultSet, that is updateable'
