    \ here, but it has a statement that commented out:\n\n```java\n// System.out.println(res.rowInserted)\
    \ + \" \" + res.rowUpdated() + \" \" + + res.rowDeleted();\n```\n\nWhen it is\
    \ commented, it is simply because it does not work. The method should test whether\
    \ a ResultSet has a row that is inserted, updated, or deleted, and whether the\
    \ changes are not yet written back to the database. Note specifically when a row\
    \ is deleted, there is nothing else, that the row is marked as deleted in the\
    \ resultSet, but it is not removed. These methods are described in the JDBC standard,\
    \ but it is not the same as the supplier of the JDBC driver implements these methods\
    \ and does not apply to the JDBC driver for MySQL. The lesson is whether the characteristics\
    \ of the JDBC standard is implemented, depends on the specific driver, and thus\
    \ of the database product.\n\n# 4.2 MUNICIPALITIES AND ZIPCODES\n\nFollowing the\
    \ above, I will show one more realistic example of a database application. The\
    \ database is still padata, but I will expands it with four new tables. The first\
    \ should be a table of Danish regions:\n\n| regnr | name |\n|---|---|\n| 1081\
    \ | Region Nordylland |\n| 1082 | Region Midtjylland |\n| 1083 | Region Syddanmark\
    \ |\n| 1084 | Region Hovedstaden |\n| 1085 | Region Sjaelland |\n\nand is thus\
    \ a simple table with two columns and five rows. The next table is a table of\
    \ Danish municipalities, where each municipality is recorded as\n\n-1. the municipality\
    \ number (a unique number of 3 digits)\n2. the municipality name\n3. the region,\
    \ that the municipality belongs to\n4. the municipality's area in square kilometers\n\
    5. the municipality's inhabitants\n6. year of the municipality's inhabitants\n\
    \nThe region is the region number, so there is a 1:n relation between municipalities\
    \ and regions, such that each municipality is linked to a specific region.\n\n\
    The third table is a table of Danish zip codes and is a simple table with two\
    \ columns that contain respectively the code and the city name.\n\nA municipality\
    \ uses several zip codes, and a specific zip code actually be used by several\
    \ municipalities, and there is an m:n relation between municipalities and zip\
    \ codes. Such a relationship is implemented with a table where a row connects\
    \ a zip code and a municipality.\n\nAccordingly, you can expand the database with\
    \ four new tables using the following script:\n\n```sql\nuse padata;\ndrop table\
    \ if exists post;\ndrop table if exists municipality;\ndrop table if exists region;\n\
    drop table if exists zipcode;\n```\n"
