    When you join several tables that occur name matches where two columns have the
    same name. As shown above, one can solve this problem by qualifying the name with
    the table name. It can lead to a somewhat clumsy syntax, and additionally, it
    may mean that there are two columns in the result, with the same name. To solve
    these problems, you can use the concept of an alias, where you give a table or
    a custom name. The following command determines the title, publisher name and
    category for all Danish books:


    ```

    SELECT title AS Text, P.name AS ''Publisher name'', C.Name AS ''category name''

    FROM book B, publisher AS P, category AS C

    WHERE B.pubnr = P.pubnr AND B.catnr AND isbn LIKE ''87-%''

    ```


    There is extracted from three tables: book, publisher and category, but these
