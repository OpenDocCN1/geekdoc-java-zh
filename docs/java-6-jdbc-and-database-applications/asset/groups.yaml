    # 前言


    本书是软件开发系列丛书中的第六本。编程语言是 Java，它的语法和语义显然大不同，但这些书也很大程度上关注开发过程以及如何开发良好健壮的应用程序。本书的主题是数据库应用程序，以及如何用
    Java 编写使用数据库程序。在实践中，需要许多数据事务的程序始终使用数据库，而数据库应用程序的开发是作为专业软件开发人员的重要课题和必要知识。从原则上说，它是简单的，编写良好的代码只需要接受你应该像书中示例那样编写代码，但数据库编程需要
    SQL 知识，最困难的部分是正确地编写 SQL 语句。因此，本书包含一个附录，对 SQL 快速介绍并描述了最基本的语法。除了 SQL 之外，尝试书中的示例并解决书中的练习的前提条件是读者拥有一个运行中的数据库，本书将使用
    MySQL。书中有一个附录，展示了如何安装 MySQL。


    正如标题所示，这一系列书籍涉及软件开发，目标是教读者如何在 Java 中开发应用程序。可以通过阅读相关主题和学习完整的示例程序来学习，但最重要的是亲自动实践并从零开始编写自己的程序。因此，书中的重要部分是练习和问题，读者必须编写与书中处理的内容相对应的程序。该系列的所有书籍都围绕相同的骨架构建，由文本和自然放置在文中位置的示例组成。练习和问题之间的区别在于，练习很大程度上是对正文中介绍内容的重复，并且对需要做什么描述得相对准确。而问题的描述则较为松散，通常规模大一点，且很少有明确的答案。这些需要从头到尾阅读大量的代码示例，而练习和问题起到了核心作用，重要的是读者应该详细学习这些代码并解决练习和问题，或者仅仅学习推荐的解决方案。

    '
