    WHERE clause, which is followed by a condition that determines which rows to be
    modified. A WHERE clause can be extremely complex, which will also appear from
    the following about SELECT, but in this case it defines exactly one row. A WHERE
    may define multiple rows, where appropriate, all the rows that satisfy the condition
    are updated. You must specifically note that it is not a requirement that an UPDATE
    command has a WHERE part, and if not, all the table''s rows are updated. Also
    note that you cannot change the value of the primary key.


