    wrote. How could you have a ''nation'' if its intended citizens were sprinkled
    across the subcontinent and lived interpersed with non-Muslims? There had to be
    other ways to look after the well-being of Muslims than trying to create ''a homeland''
    where logic seemed to show no homeland could be realistically manufactured. Madani
    envisaged an independent India that was, in Professor Metcalf''s words, ''favour
    no particular religion but engage in various ways to support all''. Madani''s
    vision perhaps perhaps the most significant strategy for Muslims who remained
    in India after 1947; which of the Muslim elite of India had however migrated to
    Pakistan. ''It was easier for them thereafter;'' wrote Attia Hasan in his wonderful
    novel, Sunlight on a Broken Column, ''to visit the wide world that the home which
    had once been.''⁵


    Deoband, a 160 kilometres north-east of Delhi, has provided ideas and learned
    scholars of Islam for over a hundred years. The students of its seminar have had
    to ways of adjusting to the modern world and the Indian state. Here, too, as Metcalf
    points out, different views count. Maulana Ghulam Muhammad Vastani, briefly (in
    2010-11) vice chancellor of Darul Uloom, the Deoband seminar, is an educator and
    Islamic scholar. But internal disputes, alleging his excessive progressiveness
    and softness towards the government of his native Gujarat, forced his resignation
    in 2011.¹ It is (p.xxii) also said as a Gujarati from a lower-status background,
    he faced prejudices from old, influential, Udu-speaking Muslim families of north
    India.


    These contests of ideas and personalities over the last 150 years have translated
    into actions, policies, and institutions. Such dynamics produced the state of
    Pakistan itself. Yet it is from the chapters written by Masud and Metcalf that
    emerges; they often depend on circumstances of the moment. The example of Maulana
    Vastani also illustrates the differences of geography, language, and social standing
    among Muslims of South Asia. Differing ideas about the practice of Islam in modern
    times were simply one aspect of the variations that were found around South Asian
    Muslims. Social class and languages are others. In India, Metcalf draws attention
    to these ''sociological gaps which the long emphasis on Muslim cultural symbols
    had obscured'' and argues that the social stresses of daily life exert more influence
    on ''Muslim behaviour in India than any suspected militancy''.


    From Pakistan, however, as more than 60 years of sovereign statehood might lead
    one to speculate, the evidence provided by Riaz Hassan and Matthew J. Nelson suggests
    different trends. States take to tell stories to their citizens—indeed, to include
    state-approved stories of nationhood. Pakistan is no different, though perhaps
    it has a much difficult story to tell convincingly. The overwhelming reason for
    the existence of Pakistan has been to provide a place of safety and spiritual
    comfort for Muslims. But often for Pakistanis the question arises: what sort of
    Muslims?'
