  md: '# The Ismaili Conciliation and Arbitration Boards in India


    sphere and seeking only to maintain the state''s neutrality equidistance from
    any one religious outlook. In the context of this framework, the CAB system might
    be said to demonstrate a way in which religious norms may be involved (even incorporated?)
    into the legal system in a manner that is non-threatening because they continue
    to be reviewable under the aegis of ''neutral'' laws of the state. This may also
    allow the legal system to provide scope for religious (legal) freedom within limits,
    and to this extent, represent in a way in which the multiculturalists hope that
    the ''deepest human commitments and (p.157) sentiments of people''-²⁵ will indeed
    figure in the law. Of course, such a situation might be severely opposed by ardent
    secularists, in India as elsewhere, who, for good reasons, may see such a system
    like this politically undesirable or legally untenable. However, that does not
    seem to be—ongoing debate notwithstanding—the position in India thus far, both
    de facto and de jure.


    At the same time, the CAB system might offer Muslim a model for how their legal
    norms have a place within the Indian legal system, with norms calibrated to the
    context of the communities, but without excessively upsetting the ''secular''
    framework. As noted above, arbitration in the CABs proceeds on the basis of general
    and non-religious oriented norms. Other forms of dispute resolution such as mediation
    and conciliation, the CABs also employ, occur even less formally. But through
    all of these processes, the CABs in India will be motivated by the same impulse
    and inspired by the same community sensitivities and community norms. In this
    sense, the CAB structure might carve out a space for Muslim legal norms and especially
    Muslim persons (the plural here being critical) to have a place in the Indian
    legal system without the need for state or national legislation to further codify
    the personal or other laws of India''s Muslims. This has the advantage of not
    antagonizing those who might oppose separate legal jurisdictions provided for
    Muslims in statute whether this opposition stems from the outlook of liberal secularism
    or inter-community fairness or gender equality or any other basis. Moreover, to
    recall Sen''s observation cited above, the incorporation of Muslim legal norms
    through the more informal forms of conciliation and arbitration represented by
    the CAB system would also better promote and preserve the diversity of outlooks
    and interpretations of India''s Muslims.


    It must be acknowledged, however, that a CAB-like framework is no panacea. In
    fact, some might say that the analyses and arguments given simply over the issues.
    It is true that if we take the view that there must be a definitive answer to
    the question of a (p.158) uniform civil law or no, the triumph of ''universal''
