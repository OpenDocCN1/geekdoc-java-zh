    subcontinent enthusiastically participate in these dances. I remember on one visit
    to Paris in the late 1960s witnessing the raas performed there by Khoja migrants
    from Madagascar and East Africa to mark an auspicious occasion. Needless to state,
    serving Indian food is a regular accompaniment to the gits and dances. The perpetuation
    of cultural practices by Khojas across continents underline the strong and enduring
    cultural identification with Gujarat and India regardless of whether they were
    born or lived there.


    Kutchi and Gujarati languages are still spoken in many homes in East Africa as
    well as in the West where East African Khojas emigrated. Both my nephews, were
    born in Canada and brought up there, can converse in Kutchi. Indian food is equally
    important and a fairly regular feature of the diet among community members who
    have migrated from East Africa to Canada and elsewhere. Hindi songs and Bollywood
    movies provide place in popular culture (p.139) among friends and family members,
    especially of my generation. On my regular visits to Canada to meet my family,
    it is common for friends and family to enjoy Bollywood videos or to be recordings
    of old and contemporary Hindi songs. My nephews include contemporary Indian music
    in their cosmopolitan collection of songs and instrumental tunes. I detect a rising
    interest in India among some of my friends and family who have visited the country
    as tourists in recent years. I am also struck by the popularity of fashionable
    salwar kameez for social occasions among Khoja women from East Africa, who when
    living there, expressed interest in the attire.


    At an intellectual level, those in the community who have pursued academic studies
    in humanities and the social sciences have explored aspects of the Khoja Ismailili
    faith as practised on the subcontinent or investigated development issues connected
    with India and Pakistan. In my opinion, the engagement of the community with India
    and more widely with the is likely to continue for various reasons, and importantly
    is reinforced by the extensive activities of the Aga Khan network in the region.
    The network''s involvement in the provision of education, health services, and
    agricultural development especially in India and Pakistan is well publicized both
    within and outside the community. At the same time East African Khojas in the
    West are increasingly coming into contact with their Khoja counterparts from the
    Indian subcontinent who have migrated there. These contacts may also reinforce
    and reinvigorate the former''s cultural and non-cultural links with the subcontinent.


    The third generation of the Kassim Lakha family has transitioned from a regional
    diaspora to a global diaspora. Their cultural capital¹⁰¹ manifested through educational
    attainment facilitated their integration into the economies of the countries they
    relocated to, especially Canada and the United States as well as France.¹⁰² Though
