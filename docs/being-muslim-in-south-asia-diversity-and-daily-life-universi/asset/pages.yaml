    (p.94) Women’s Property in the Wake of the 2004 Tsunami

    In the aftermath of the 2004 tsunami, I worked as part of a multidisciplinary
    research team to explore the uncertainty dimensions of post-disaster recovery
    in Sri Lanka.¹²¹³ In collaboration with another anthropologist, Patricia Lawrence,
    I endeavoured to determine what impact the tsunami was likely to have on the long-term
    future of the matrilocal marriage system that had, then, provided Tamil and Moorish
    women in the Batticaloa and Ampara districts with substantial real property in
    the form of dowry houses. In beachfront communities, the tsunami destroyed countless
    family dwellings owned either singly or jointly by women, and subsequent bureaucratic
    regulations forbade reconstruction within a shifting patchwork of shoreline ‘buffer
    zones’. NHousing programmes of governmental as well as international non-governmental
    organizations (NGOs) seemed to bind the fact that, in this region of the island,
    most of the demolished houses had been owned by women who had acquired them as
    dowry at marriage. Initially, they transferred relief and reconstruction resources—including
    legal title to new replacement houses—to men, assuming that they were the ‘heads
    of household’. Local women’s groups became concerned could deprive wives and daughters
    of their traditional economic and social capital long after the tsunami.'
