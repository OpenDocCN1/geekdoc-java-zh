    In this chapter, I argue that the idea of being a Muslim being a Bangladeshi derives
    from the Islamic concept of ummah. Ummah in general refers to the global community
    of Muslims. The world is divided into at least 192 countries, citizens of these
    countries are officially known after the name of their states—for example, British,
    American, Bangladeshi, Indian. In this context, the concept of ummah seems politically
    relevant. However, I further argue that transnational networks of Islamists are
    instrumental in fostering the political relevance of ummah. I propose a typology
    of these networks. I argue that my findings not only underpin the political relevance
    of the Islamic concept of ummah in Bangladesh, but also the contested relationship
    between Bangladeshi nationality and the ummah, vividly illustrated by the burning
    of national flags over perceived humiliation to Islam.


    # Significance


    There is a dearth of literature about political Islam in Bangladesh. According
    to one estimate, ''Among the twenty-eight anthologies published in the West in
    recent years on the experience of Islamic revivalism and Islamization in the Islamic
    world, only two have included chapters on Bangladesh.''1 Amid this limited pool
    of research, studies of Islamic and political Islam primarily focuses on: (a)
    the operational pattern of Islamist terrorists,2 (b) secular-religious(p.227)
    conflict,3 (c) women and political Islam.4 Among these studies,(p.228) Riaz examines
    transnational trajectories of Islamists.5 However, his approach lacks understanding
    of the diverse nature of political Islam and the influence of the transnational
    paradigm of ummah in expanding transnational networks of Islamists in Bangladesh.
    Thus, my hypothesis needs to be seen as an effort to develop a new approach to
    understanding political Islam in Bangladesh.


