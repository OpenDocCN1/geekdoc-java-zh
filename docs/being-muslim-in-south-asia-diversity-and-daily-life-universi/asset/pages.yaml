  md: '# Transnational Networks, Political Islam, and the Concept of Ummah in Bangladesh


    point arising from these findings is that political Islam is not monolithic.

    Islamists range across a political and ideological spectrum.


    Why these transnational networks attractive to Bangladeshis? Two reasons help
    explain the increasing allegiance to Islamic identity over Bangladeshi identity.
    First, the sense of belongingness in the global community of believers that Bangladesh
    experience promotes them to participate in networks. In this context the ummah
    acts as a nation. The ummah complies with the concept of a nation as it defines
    a group of people (Muslims) who believe they share a common history, customs,
    and values, which can be collectively deemed to share a practised Muslim culture
    (Wahhabi, Salafi, or others) where identities are tied through sentiment. The
    overarching significance of being Muslim serves as the precondition motivating
    this Bangladeshis to join transnational networks of political Islam. To them,
    ‘Muslim-ness’ is above all identities. Second, the political ambition of the Middle
    East in modern times has evoked the political reality of across the ‘Muslim world’
    through a global expansion of Islamic consciousness. This global wave has also
    engulfed Bangladesh and promoted an Islamic culture that contributed to the expansion
    of transnational political Islam.


    Historically, Middle eastern undertook projects of promoting Islam after the defeats
    in the 1973 six-day war against Israel during which the United States and other
    Western countries supported Israel. In response to the Western states on Israel,
    Arab countries imposed an oil embargo. The embargo was lifted after six months
    in March 1974, but a shock went through Western economies. According to US government
    statistics, world oil prices had tripled from the 1973 average to US $12 a barrel.53
    Khanna argues that (p.245) it was ‘during this time that became the Arab’s geopolitical
    level, making the gulf monarchies of the world’s nouveau riche’.54


    Realizing their power, Arab countries can exercise their influence, financing
    monetary programmes in various Muslim countries.55 Bangladesh received generic
    support from these rich Muslims, as a result of their secular security and politics
    became Islamic.56 This increased religiosity worked through transnational networks
    of political Islam—Islamic networks, Islamic NGOs, and the Internet—to extend
    itself among Bangladesh. This process exposed the embedded tensions and contested
    relationships between ummah and nationality in Bangladesh where people negotiated
    between Islamic identity and state identity.


    Such a contested relationship had several implications. First, transnational political
    Islam threatened state security. Diverse transnational networks fostering Ummah-Muslim
    contact undermined the dominant state-centric concept of managing security for
    Bangladeshi citizens. For many years, the states were the units of action, defenders
    and guarantors of security.57 However, the'
