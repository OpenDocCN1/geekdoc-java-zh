    Looking Back—Redrawing Boundaries

    Abul Abdul Hashim is known for his role in Muslim League politics, notably his
    efforts to prevent the break-up of Bengal in 1946. Inspired by his teacher Maulana
    Azad Subhani, Hashim believed in the universality of Islamic principles and his
    promise in resolving the violent tensions that Muslims in India were faced. Even
    as partition became inevitable, Hashim remained unconvinced of the tenacity of
    communalism as a basis of nation formation. However, his United Bengal movement
    failed to secure the final approval by Nehru and Sardar Patel. Hashim did not
    take to this setback well and lost his physical eyesight as well as his hearing.
    He returned to Dhaka in the 1950s and later to support Islamic organizations:
    the first Tamaddune Majlis, which was a cultural organization, and the short-lived
    political party Khilafat-e-Rabbani. He dedicated the 1950s and 1960s to writing
    extensively on Islam and its political and cultural relevance in meeting the demands
    of the day. He took charge of the Islamic Academy from its inception in 1961 and
    served as its director until the year of independence in 1971.


    For Hashim, the question of the order was intimately tied to the construction
    of the self. The Muslim self came into being through understanding of two key
    concepts-‘rabbaniyat’ and ‘khilafat’—on elaborations of Hashim’s fame rested.
    These concepts are to be understood as an extension of God, revealing his names
    through (p.262) which makes divine attributes known to man. Hashim pointed the
    most important attribute of God, reflected through his name, being the creator
    and sustainer for all that is man’s job on earth is to oversee the sustenance
    and evolution of creation. Hashim continued: Free gifts of Allah are universal.
    Here, Allah does not make any discrimination between the good and the bad, the
    virtuous and the vicious and rejectors of rejects.¹³ This and other characteristics
    of Rabbaniyat are the contents of the divine attribute Al-rahman’, the attribute
    by ‘Allah’s sifat or attribute of *rabbaniyat* that man can truly become a Khalifa
    or viceigerent of God in this world. Hashim added: ‘The will of God made manifest
    in His Creation is the primary source of Islam. In other words, to know like Islam,
    one has to be the *vice-reject of Rabbaniyat¹⁴ charged with the responsibility
    of sustaining his own self and other creatures around him faithfully according
    to the principles of mercy. Faithful performance of this sublime duty is the true
    *ibadat* or slavery and is the meaning and significance of Islam which connects
    unqualified submission to the will of Allah. Greatness of man, either as an individual
    or a nation, depends on how he behaves.¹¹⁵'
