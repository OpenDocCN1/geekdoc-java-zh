    ddat and maintenance), care and guardianship, legitimacy, succession and apostasy.


    15.2 Subject as provided in Article 15.4, the personal law applicable to Ismailis
    shall be such personal law as has evolved within the Shia Imani Ismaili School
    of Thought of Islam.


    15.3 Mawlana Hazar Imam [namely, the Aga Khan] has the sole right to interpret
    the personal law evolved within the Shia Imani Ismaili Thought of Islam.


    One thing we can note is the distinction between the allegiance of Ismailis to
    their place of domicile and to their religious authority. This is stipulated in
    Article 15.4: ‘To the extent that the territory of domicile or residence of any
    Isma does not recognize or allow the application of the personal law of Ismailis
    he shall be governed in that territory by such personal law as is applicable to
    him under the law of that territory.’


    This neatly contextualizes the reality of contemporary Ismaili law as being non-state
    (perhaps one might say ‘transnational’ law). On the one hand, this is a framework
    that does not impinge upon Ismaili’s obligations to the laws of her or his land
    of abode. On the other hand, there is a framework for a community operating internationally
    and resident in many different states. The 1986 Constitution also provides for
    ‘Rules & Regulations’ for each of the community’s major centers.


    **(p.148)** Of particular importance for the present discussion, is that the 1986
    Constitution occasioned the establishment of a new community institution, namely
    the CABs, which function as community-based dispute resolution organizations for
    the Ismailis. Even though the CABs per se came into existence with the promulgation
