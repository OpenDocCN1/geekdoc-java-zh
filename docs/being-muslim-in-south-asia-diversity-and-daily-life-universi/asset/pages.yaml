    # Comparison with the Bombay Pentangular


    The entry of politics into the playing field was not unusual in other parts of
    India. Perhaps the famous instance was the controversy over the pentangular cricket
    tournament in Bombay. The Bombay Pentangular originated with matches between the
    Europeans and Paris beginning in the 1890s. Later, Hindus from 1907 and Muslims
    from 1912 joined to make it a four-cornered contest. Later, in 1937, yet another
    team, the ‘Others’, comprising Christians and Anglo-Indians, was included, making
    the tournament a pentangular. What is less known is similar tournaments based
    on religion and race were also held in Karachi, Lahore, and Delhi. But the Bombay
    Quadrangular was by far the most popular tournament in (p.343) pre-independent
    India, where the best cricketers displayed their skills.


    It was from the 1930s that the common organization of the Quadrangular began to
    stir controversy. In 1930-3, which coincided with momentous events in India’s
    freedom struggle, including the Congress-led civil disobedience movement, the
    tournament was not held. In 1934, its resumption coincided with the inauguration
    of the national cricket tournament, the Ranji Trophy. Though this enthusiasm was
    sky-high for the Quadrangular, which had been sorely missed by cricket fans, there
    was some opposition too. One of the principal critics was Maitra, whose advocated
    goal the eradication of ‘distinctions between caste, creed and colour from the
    field of sport’. He admitted in 1933 that ‘if the tickets at the various Gymkhanas
    is any indication of its popularity among the votaries of the game, communism
    was with all ten wickets in hand’.36


    With the beginning of World War II in 1939, the Pentangular faced its biggest
    threat. When British declared on Germany it also included India in the war effort
    without consulting any Indian leaders. The Congress responded by resigning from
    the provincial governments. The next year, the Muslim League announced its support
    for a separate homeland for Muslims while Congress leaders began courting arrest
    to oppose the war and call for India’s independence. Highly surprisingly, the
    staging of the Pentangular was thrown into doubt. Those who opposed the tournament
    were usually from the Congress, and Ramachandra Guha pointed out, that the Hindu
    Gymkhana felt the real pressure to withdraw. In these difficult circumstances,
    the Hindu Gymkhana sought the opinion of the one whose opinion carried the most
    weight—Mahatma Gandhi. As is the answer to the'
