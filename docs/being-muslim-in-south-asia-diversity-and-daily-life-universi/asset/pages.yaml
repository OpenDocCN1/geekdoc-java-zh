    Asad: ''ideas'' are a ''product'' of (contested) ''power''. Instead, I turn to
    the more historically sensible of those with an interest in the formation of ideas
    on the ground—scholars like Quentin Skinner, focusing on the underlying flexibility
    of ideational conventions, and more specifically, Mark Bevir, reinforcing that
    ''flexibility'' focus in his work on situated ideational intentions.¹10


    According to Asad, ''productive'' forms of ideological contestation unfold within
    ''traditions''. (This emphasis on ''contestation'' allows him (p.167) to stress
    the ''productive'' capacity of traditions.) Like Skinner, however, Asad is keen
    to stress the ways in which competing sets of ideas—the stuff of ideational production—are
    never entirely free-floating. They are, following Wittgenstein and Saussure (following
    Geertz himself), closely bound up with the ''grammar'' of specific semantic or
    ''cultural'' traditions. Both Asad and Skinner could to follow Geertz in stressing
    that the contestation of ideas must be read within the parameters of a particular
    ''culture'',¹¹ ''convention'',¹² or ''tradition''.¹³


    (Asad is keen to stress the ''productive'' capacity of ideational competition
    within each tradition. But when it comes to the reach of that capacity, it often
    goes to contain it with reference to the oddly stable parameters of ''tradition''
    if itself. ''New'' ideas, in other words, may emerge. But, for Asad, this process
    is always led by elites—that is, following Skinner''s mentor, J.G.A. Pocock, by
