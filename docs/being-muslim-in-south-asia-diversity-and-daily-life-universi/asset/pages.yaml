    # Muslim Aspirations in Bangladesh


    Looking Back and Redrawing Boundaries


    Samia Huq


    DOI:10.1093/acprof/oso/9780198092063.003.0012


    # Abstract and Keywords


    Till 2013, political discourses in Bangladesh offered Muslims very little space
    other than one of two polar opposites: the secular liberals or the anti-1971 and
    thus anti-nationalist Muslims. As Islam presented itself through new adaptations
    to modern life, the polarization between the two camps widened as citizens who
    desired Islam as one of the key anchors of their identity were left devoid of
    possibilities, often turning to the Islamist or versions of the Islamist rhetoric.
    With a particular kind of textual Islam increasingly claiming the grounds, one
    often bemoaned the absence of an in-between space where Bangladesh could claim
    tolerance, pluralism and spirituality in the creation of a democratic society.
    This was also reflected in the aspirations of men and women who found themselves,
    by default, engaging with a religious rhetoric that presented itself in opposition
    to secularism. This article points to some speculations and debates of such እንደሚ
    by women who congregate to read and discuss the Koran in Dhaka.


    Keywords: Bangladesh, Islamic, secular, identity conflict, nation state, pluralism,
    Allama Abu Hash, democracy


