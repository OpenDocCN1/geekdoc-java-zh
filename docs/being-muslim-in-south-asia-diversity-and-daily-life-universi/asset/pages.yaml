  md: 'as religion and religion as nation. By according salience to the nation, my
    analysis does not disregard supranational and global forces; on the contrary,
    I have shown how the Indian media adapted global discourses on terrorism to craft
    a narrative externally vis-à-vis the West and the region (South Asia) and internally
    vis-à-vis Muslims, who since 9/11, are often regarded as supporters, advocates,
    and practitioners of terrorism. It is because of this assumption that ever the
    explosions and killings of Muslims in Hyderabad''s mosque and Malegaon were attributed
    to ‘Muslim terrorists’ by the mainstream media. When Tehelka journal, K.K. Shahina
    questioned such assumption, she herself was branded as a ‘terrorist’ by the police.
    Karnataka’s media notably Kannada newspapers—ran stories describing her as ‘suspicious’
    and specifically mentioning her ‘Muslim’ identity (not her identity as a journalist).
    Then the media’s print and virtual regimes may be better understood as performance
    and spectacle rather than political in a conventional sense. This is equals—nay,
    more–true of television despite the premise of it showing reality ‘live’. Recalling
    the house where the suspected SIMI terrorist, Yahya, as well as the mosque in
    Yahya’s neighbourhood most by a Kannada television channel, read this observation
    in ‘Above All, No Journalists’:


    No one knows very well—and this is the most rudimentary knowledge concerning television
    is in reality—that there is never anything. All of that is produced —in a fraction
    of second, in studios where one can instantaneously frame, erase, reconstruct,
    manipulate… The presumption remains, and with it, the common prejudice, the structural
    clarity of television, by contrast with printed newspapers and radio, allows you
    to see the thing itself ... with the Evangelical dimensions¹³³


    (p.328) Based on the case of the NDTV talk show, and an analysis of diverse forms
    of media’s reporting and on depiction of SIMI and IM—the most-discussed terrorist
    outfits on 9/11 India—I have argued that mainstream media discourses on terrorism
    are intimately tied to the myth and narrative of the Indian state and its constitutive
    ‘other’, namely Muslims. From the dense description I have presented, it follows
    that the discourses and practices of the media and terrorism are not autonomous—as
    the liberal understanding has it that the media is part of the civil society—they
    are instead shaped by virtue and reproduce the imaginations and myth of the nation
    state and its ‘other’. I am aware of the diversity of media along the lines of
    language, regions, and so on. However, in media discourses on terrorism, this
    diversity becomes peripheral, if not inconsequential, what is at stake a specific
    type of terrorist threat to the nation which the media stages, vis-à-vis India
    dream of being an emerging global power in simultaneous competition and cooperation
    with the West, as well as the threat from within. My discovery of print and television
    media ‘coverage of Muslim terrorists in diverse places as Uttar Pradesh, Gujarat,
    Karnataka, and Delhi'
