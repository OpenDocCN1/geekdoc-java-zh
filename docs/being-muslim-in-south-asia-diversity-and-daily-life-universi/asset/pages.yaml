    ***


    This chapter has shown the ways a supposedly orthodox institution of Islamic learning
    has been trying to maintain its religious authority in a rapidly changing world.
    Deoband is essentially a sectarian organization that caters to the needs of its
    followers who follow the Deoband school of thought. Yet the media has projected
    Deoband as representative of the entire Indian Muslim population, and continues
    to inform the larger public perception. What is important to note that despite
    being an orthodox institution of Islamic learning, Deoband continues to command
    a following not only among Muslims but also a section of non-Muslims. Many progressive
    fatwas on various issues have earned Deoband respect among non-Muslims in India.
    There are, however, contradictions in their approach on some social issues. While
    Deoband has supported 32 percent reservation for women in elected bodies, it has
    asked Muslim (p.200) women to wear burqa or a veil when entering politics and
    urged them to refrain from working, if possible. At the same time, it has issued
    a fatwa against Deoband''s national song. Such a conservative approach by Deoband
    might inhibit its influence beyond a minority section of society.


    It is, however, apparent that Deoband has mostly adopted a progressive approach
    when dealing with non-Muslims, but is reluctant to apply a similar approach towards
    Muslim women. This has resulted in growing disillusionment among educated sections
    of Muslim women towards Deoband. They view the organization as being mired in
    a medieval mindset when dealing with modern issues. It is, as an alternative to
    Western-influenced modernity. As argued by Metcalf, Deoband became a bastion of
    ‘cultural reproduction’ that helped the Muslim community preserve its identity
    while simultaneously participating in the project of nation building as India.
    While Deoband still commands great respect among Sunni Muslim communities in India
    and South Asia, it has also failed to adapt to the changing times.


