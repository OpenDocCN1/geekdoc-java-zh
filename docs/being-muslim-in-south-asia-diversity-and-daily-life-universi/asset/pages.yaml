    ‘Casting’ and Reducing Diversity


    Any account of Muslim societies in south India, whether historical or anthropological,
    usually starts with the assumption that Muslims in south India are part of a set
    of clearly defined, discrete communities, which are mutually distinguished by
    features such as class, occupation, adherence to certain schools, and language.
    Most importantly, these communities are believed to have arisen from what is considered
    historical processes (which are supposed to have supplied with names and origin
    myths). The defining features of these communities are a direct result of the
    processes which led to their formation. Muslim communities are thus in a sense
    that the fossilized remains of past processes of identity formation. (p.67) Diversity,
    according to this model, is the product of the petrification of history.


    Probably the most often discussed, applied, and reassembled of south Indian Muslim
    communities that is assumed to divide up those Muslims claiming Tamil as their
    language. While different authors present slightly different systems of dividing
    Tamil-speaking Muslims into different communities—the first sign that the model
    is not quite convincing as it is presented—there seems to be a general consensus
    to distinguish at least three ‘communities’, the Maraikkāylar, the Rāvattars (or
    Rowers), and the Lebbais (or Lebai). Generally, the Maraikkāylar are assumed to
    have descended from the union of Arabic merchants with local women, to belong
    to the Shafi’i school, to be businessmen and merchants, mostly settled on the
    coast, and generally imagined to command a proper status in Tamil Muslim society.
    The Rāvattars are considered to have arisen from the result of the various ‘Muslim’
