    # Matrilocal Marriage and Women’s Property among the Moors of Sri Lanka*


    Dennis B. Mcgilvay


    DOI:10.1093/acprof:oso/9780198092063.003.0005


    # Abstract and Keywords


    The Muslims, or ‘Moors’, of Sri Lanka are a Tamil-speaking minority representing
    9 per cent of the population, near one third of whom in the agriculturalmost region,
    where they share a distinctive matrilineal family system with their Hindu neighbours.
    Despite the destructive 2004 tsunami and the decades-long war with the Tamil Tigers,
    the basic pattern of Moorish women’s dowry and property rights has been traced
    over four decades of ethnographic research in the eastern town of Akkaraipattu
    in Ampara District. The larger project from which this is drawn reveals that similar
    matrilocal dowry patterns are shared by Moors throughout Sri Lanka and also among
    Muslim communities in coastal Tamil Nadu and Kerala.


    *Keywords:* matriliny, matrilocality, Sri Lanka, Tamil, marriage customs, Moors


    On 26 December 2004, the Indian Ocean tsunami struck the eastern coastline of
    Sri Lanka with catastrophic force, erasing shoreline villages and neighbourhoods
    that had been historic Tamil-speaking Hindu, Christian, and Muslim settlements
    for centuries. This is a region where the decades-long insurgency by **(p.88)**
    the Liberation Tigers of Tamil Eelam (LTTE), with the brutal clashes of the Sri
    Lankan military and Indian Peace Keeping Force, had already inflicted trauma and
    suffering on all ethnic communities. In the wake of the 2009 defeat of the LTTE,
    and with the final phases of post-tsunami reconstruction now opened, an finally'
