    # Negotiation 1: Formal and Informal Law


    Arbitration and reconciliation are often vaunted for their capacity to provide,
    among others, more participatory dispute resolution processes. They may also be
    seen to represent the working of ‘informal’ law—that is to say, for our purposes,
    the resolution of legal issues through norms which are not articulated in formal
    legal sources like legislation, codes, or case law, and through methods which
    are not governed by the formal provisions of civil or criminal procedure.


    For the Ismaili community, the CAB system represents a way to provide the procedural
    flexibility and normative variety of ‘informal law’ within formal national legal
    systems. The capacity of CABs in India to issue divorces, including terms of settlement,
    allows it to bring into the determination of these matters community norms and
    values. Such norms are not expressed as legal rules, much less found in legal
    source materials, and yet are influential in the settling of divisors. As Noordin
    Nasir mentioned, the CABs do not seek to apply ‘religious law’; a position consistent
    with Article 15.4 of the Ismaili Constitution noted above. Nonetheless, there
    are aspects of personal law—such as, the provision of *mahr* (dower)—that the
    CABs will include in their determinations.¹ Additionally, the CABs may be to apply
    localized understanding of determining amounts of settlement and the structures
    for settlement, whereas these are set by conciliation and mediation, or arbitration.
    This flexibility enables the CABs to include community-based, informal norms as
    part of **(p.153)** its decision-making framework. Carrie Menkel-Meadow explained
    this capacity of alternative dispute resolution bodies, like CABs, enabling them
    to go beyond what the ‘limited remedial imagination’¹⁹ of the adversarial system
    does. In the case of the CAB system, what is important to note is that it is able
    to do this by ‘seasoning’ the justice²⁰ of the Indian legal system with informal
    norms.


    # Negotiation 2: Tradition and Modernity


    Both the Ismaili Constitution and the CAB explicitly invoke a basis in tradition.
    These various strands of tradition Quranic verses on reconciliation and settlement
    (the verses opening this chapter as example), which are the forants for the concepts
    of *sulh* and *takhim* in theology and law, the idea of the historical traditions
    of the community (see Mr Nanji’s witness statement above, paragraph 3.1), which
    has promoted reconciliation and amicable, negotiated settlement, and the traditions
    of the Imams as the capstone of the community structures and the authority that
    these structures enjoy. The CAB system might thus seen as being consistent with
    a Quranic ethics that has been interpreted and shaped through Ismaili history
    and grounded in long and deep traditions of the community.'
