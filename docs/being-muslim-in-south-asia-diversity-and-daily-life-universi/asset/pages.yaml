    # Islam and Modernity in South Asia


    Muhammad Khalid Masud


    DOI:10.1093/acprof:oso/9780198092063.003.0001


    # Abstract and Keywords


    The prevailing narrative of Islam and modernity overlooks the phenomenon of non-Western
    modernity. It refuses to recognize continuing trends of reconciliations, self-criticism,
    and accommodation in Muslim thought, especially in South Asia. This chapter sets
    out to remedy some of these misunderstandings. From 1857 when the Raj introduced
    its ''modernity project'' in India, the narrative of modernity changed. Hindu
    and Muslim civilizations were presented as indulging in causality, and treacherous
    political ideas. Muslims were divided into puritan and modern. The modernity project
    aimed at civilizing. The ''Western impact'' defined modernity as Westernism. It
    generated among Indian Muslims a cultural resistance to modernity. Religious groups
    began organizing themselves into political parties that stood for conservatism
    that was justified as denunciation of colonialism and imperialism. Eventually
    this conflict led to fundamentalist and extremist religious trends in the twentieth
    century.


    Keywords: modernity, religious reform, fundamentalism, self-criticism, Islam,
    Jamaluddin Afghan, Syed Ahmed Khan


    Most Muslims conceive modernity, and modernization not only as Western and well
    also as hostile and threatening because modernity came to the Muslim world in
    the wake of colonialism. Muslims in South Asia experienced the liberating as as
    well as the cruel, humiliating, and violent processes of modernity. Western colonial
    ideologies developed a narrative of modernity based on Western superiority that
    disparaced local religions and cultures. Muslim resistance to Western modernity
    were therefore diverse,'
