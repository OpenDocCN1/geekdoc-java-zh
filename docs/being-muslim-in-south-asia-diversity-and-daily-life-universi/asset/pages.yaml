  md: '# The Making of a Diasporic Muslim Family in East Africa


    substantial loss of assets (in common many Khojas) was eased by their early engagement
    with modernity. A notable feature of this engagement for the Khoja community was
    that it was negotiated without deep anxiety about their identity. Modernization
    and Westernization did not diminish their institutions, communal bonds or a sense
    of pride in their identity. Jamatkhanas and national Ismail councils sprouted
    wherever they relocated. While individual dissenters experienced disaffection
    from time to time, the large body of the community remained committed to its faith
    and identity. The leading role of the Imam (Aga Khan IV) in guiding the community¹⁰³
    and interpreting the faith according to the demands of the time is one explanatory
    factor for the community’s adaptation to changing circumstances. Quote Aga Khan
    III: ''Ismailism has survived because it has always been fluid. Rigidity is contrary
    to our way of life and out. There have been no cut-and-dried rules, even the set
    of regulations known as Holy Laws are directions as to method and procedure not
    detailed orders about to be obtained.¹⁰⁴


    Other South Asian communities in East Africa also had to negotiate their engagement
    with modernity and transition to countries beyond East Africa in their ways. What
    distinguishes the experience of the Kassim Lakha family and Khoja Ismailis is
    the flexible outlook articulated by Aga Khan III, and continued under the present
    Aga Khan IV since 1957, with the dense community networks or social capital that
    they have reproduced¹⁰⁵ and that shape their lives in different diasporic contexts.


