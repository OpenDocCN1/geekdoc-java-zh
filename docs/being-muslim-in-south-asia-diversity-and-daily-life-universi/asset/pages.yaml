    # (p.xvi) Introduction


    Diversity and Daily Life


    More than a quarter of the world''s people are Muslims. About one-third (more
    than 500 million people) live in Pakistan, India, Bangladesh, and Sri Lanka, the
    countries of South Asia. Pakistan, India, and Bangladesh are the second-, third-,
    and fourth-largest Muslim countries in the world, surpassed only by Indonesia.


    The religion of Islam often captured the attention of the English-speaking world
    after the devastation of 11 September 2001, but it was with a relentless focus
    on terror and conflict. Such preoccupation, elicing interest in the daily lives
    of South Asia''s Muslims, was mistaken and misleading. In 2011, the Institute
    of South Asian Studies (ISAS) at the National University of Singapore determined
    to explore how Muslims in South Asia lived in the twenty-first century—in the
    words of South Asian English, they ‘pulled on’, thought about themselves, related
    to their governments, earned livings, connected to the world, and spent their
    leisure time. (p.xvii) The aim was to emphasize the many strands of thought and
    practice that go into the daily experiences of hundreds of millions of people.


    Members of the IAS recognized that Islam in South Asia had many faces, and a workshop
    in September 2011 brought together scholars who could cast light on some of these
    variations. The workshop assembled scholars from seven countries and underlined
    the diversity of experience that being ‘Muslim’ involved. We later called on additional
    contributors to create a book that would hint at the diversity that exists among
    the Muslims of South Asia and to highlight concerns and conditions of daily life
    in different places and among different groups.'
