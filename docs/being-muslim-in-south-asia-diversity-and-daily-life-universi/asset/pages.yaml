    # A Million Salutes


    India’s Mohamedan Sporting Club¹


    Ronojoy Sen


    DOI:10.1093/acprof/oso/9780198092063.003.0015


    # Abstract and Keywords


    The victory of the Calcutta football club, Mohun Bagan, over an all-white British
    regimental team in the final of the 1911 IFA Shield, the premier tournament in
    India, is just recorded as history. However, yet another remarkable feat – the
    Mohamedan Sporting Club winning the Calcutta League five times on the trot between
    1934 and 1938 besides other major tournaments - is forgotten. This chapter explores
    the history of Mohamedan Sporting from the time it was formed in 1891. It examines
    the sporting exploits of the club against the backdrop of communal politics of
    India in the 1930s and 1940s. The main thrust of the chapter is on the history
    of the club till the partition of the Indian subcontinent in 1947, after which
    the club never matched its early performances on the football field.


    Keywords: sport, football, communalism, Muslim League, Calcutta, Mohun Bagan,
    Mohamedan Sporting Club, Bombay Presidency


    On 29 July 1911, the Mohun Bagan won, with 15 barefoot players, became the first
    Indian team to win the premier football tournament of the time, the Indian Association
    (IFA) Shield, in Calcutta. Mohun Bagan’s pride and was hailed as a significant
    nationalist moment. A Calcutta newspaper, the Bengalee, proclaimed that the Bengali
    were “no longer the timid and weak-needed representative of the race whom [Thomas]
    Macaulay so folly had labelled’.² The (p.331) Englishman newspaper mentioned that
    Mohun Bagan had

    succeeded in the quest and the Swadeshhiwas had failed to do so'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# A Million Salutes


    to explode the myth that the Britons are unbeatable in any sphere of life''.3
    It said that Mohun Bagan had been able to ''knit together'' people in a way the
    political parties had not been able to.


    There is some truth in this when we see the reactions of Calcutta Muslims to the
    1911 victory. When the procession after the final was making its way to north
    Calcutta, several Muslims accompanied by a band joined the festivities. The Mussman,
    a weekly, wrote that Mohun Bagan had ''demonstrated that Indians are second to
    none in all manly games''. But significantly it added that although the Mohun
    team was composed of Hindu, the jubilation over the Shield victory pointed out:
    The members of the Muslim Sporting Club were almost mad and rolling on the joyous
    excitement on the victory of their Hindu brethren..4 If the 1911 Shield victory
    is still remembered and memorialized as a unifying event, another remarkable achievement—Mohammedan
    Sporting becoming the first Indian team to win the Calcutta First Division Football
    League in 1934 and subsequently winning it four more times on the trot between
    1935 and 1938—is largely forgotten. The rise and success of Mohammed Sporting
    played out against the contentious communal politics of the time. This chapter
    looks at the story of Mohammed Sporting both on the field and the passions it
    generated off the football pitch. It places Mohammed Sporting in the context of
    Muslim identity and communal politics in Bengal of the 1930s and 1940s. A brief
    comparison is drawn with the Pentangular; a tournament organized along communal
    lines in Bombay, to illustrate how sport, religion, and politics intersected outside
    Bengal. In conclusion, I raise a few questions about the placing of Mohammedan
    Sporting in post-1947 India.


    # The Beginnings


    Though Mohammed Sporting came into existence in 1891, more than a decade before
    the political organization, Muslim League, was (p.332) founded, it had its three
    early reincarnations in Jubilee, Crescent, and Hamidia. In 1891, Mohammedan Sporting
    had as its patrons of prominent Muslims of Bengal, included. It was no accident
    that Bengal was the site for the club since the turn of the century the province
    not only had the largest concentration of Muslims in India but one which was ''among
    the first to be organized politically to voice their rights as Muslims''.5 The
    first annual meeting of the club in 1894 was presided by Justice Syed Amir Ali
    (1849–1928). He was a member of the Muslim elite, also known as the ashrafs, from
    illustrious lineage who had been trained in law in England and had an English
    wife. He was appointed a judge in 1890. Along with Nawab Abdul Latif in 1877,
    founded the Central National Mohammedan Association which was very much an organization
    restricted to the upper-class Muslim groups. In his sense'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# A Million Salutes


    association with football, which was much more a subaltern sport in India compared
    to cricket, was somewhat out of character.


    # The Glory Years


    In its initial years, Mohammedan Sporting did not have its own ground and used
    the ground of the Calcutta Boys'' School, a well-known private school, every alternate
    day for practice. Later, the club was allowed use of the ground full time while
    the school was provided with another playground. One of the early successes of
    the club was winning the Cooch Trophy, founded by the Maharaja of Cooch Bihar
    solely for Indian football teams, in 1909. In 1927, it created ripples by getting
    promoted into the second division of the Calcutta Football League. (The First
    Division Football League in Calcutta was born in 1894 and was out of bounds for
    Indian teams until 1914.) From the 1930s Mohammedan Sporting was one to reckon.
    By 1933 the team was good enough to win promotion to the first division, noting
    consecutive wins in the final stretch. Amazingly, in its first appearance in the
    League in 1934, Mohammedan Sporting became the first Indian team to win the League.
    The pro-Muslim (p.333) League newspaper, *Star of India*, quashed that the ''Babes''
    of their year achieved the impossible by winning the League in their very first
    year. *The States*, a newspaper with a high British readership, reported that
    Mohammedan Sporting''s victory in the last league matched unfanced Kaligata with
    ''unprecedented scenes of enthusiasm''.⁷ In 1936, the club achieved the rare double
    of winning the League and the IFA Shield, becoming only the second Indian team
    after Mohan Bagan to win the Shield. Only three teams—Royal Irish, Gordon Highlanders,
    and Calcutta Football Club—had achieved this distinction. Twenty years after Mohan
    Bagan had lifted the Shield, Mohammedan Sporting repeated the feat by beating
    the Calcutta Football Club, but only after playing draws in the first two encounters.(There
    were no tiebreakers in those days.) Mohammedan''s achievement was reported as
    far away as Australia where the *Sydney Morning Herald* carried new headline:
    ''Honour for Islam''.⁸


    The euphoria over Mohammedan Sporting''s victory spread like wildfire. Every match
    played by the club drew a huge crowd. The nationalist English daily, Amrita Bazar
    Patrika, reported that the ''popularity of the team increased with every match''
    and the gates would be closed long before the match began.⁹ One stand in the ground
    was reserved for club members while two stands were open to the public who were
    eight chairs for the enclosure with chairs and four annals in the wooden galleries.
    The crowds that thronged to see Mohammedan Sporting comprised of young men as
    well as older people occasionally cry mauls and maulanas. There was one Mohammad
    who would out ''Allah-Akbar'', galvanizing Mohammedan supporters.¹⁰ In 1935, for
    instance, 60,000 people turned up to watch Mohammedan Sporting defeating Mohan
    Bagan at the Calcutta Football Club ground. The fireworks were lit, balloons sent
    up,'
  merge: -1
  pgno: 313
- img_proc: true
