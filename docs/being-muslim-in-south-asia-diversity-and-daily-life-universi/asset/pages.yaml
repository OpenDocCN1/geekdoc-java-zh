    up by Junior Statesman, a Calcutta newspaper, and Khela Ashar, a Bengali sports
    magazine. But the remarkable, almost unreal, story of Salim is little known today.


    It was not just Salim who winning recognition. For a first Indian footballers,
    Mohammed Sporting players featured in advertisements for the Indian Tea Market
    Expansion Board. One was Noor Mohamed, the ‘sturdy centre half of the back’, and
    the other, Jum Khan, as ‘one of India’s best full backs’. The ads were quite remarkable
    considering that no Indian sporterson, not cricketers, had then featured in advertisements.
    C.K. Nayudu, one of the stars of Indian cricket and captain of the first official
    Indian team that toured England in 1932, featured in an advertisement for the
    first time for Bathgate’s Tonic only in 1941.


    The impact of Mohammed Sporting’s astounding success, like Mohan Bagan’s 1911
