    time.⁸ The east coast matrilocal dowry-house marriage pattern, on the other hand,
    was never intrinsically dependent upon matrilineal clan hierarchy, nor did it
    have any necessary connection with the post-mortem inheritance of property, which
    is governed here by Sri Lankan civil law for the Tamils and Sri Islamic law for
    the Moors.⁹ Followed by Tamil and Moorish families at all levels of society, the
    matrilineocal marriage system was fully functioning when eastern Sri Lanka entered
    the decades of the LTTE insurgency in the mid-1980s and was later tested by the
    tsunami of 2004.


    The Sri Lankan Matrilocal Moorish Marriage Pattern

    The Moorish household system is based on the underlying cultural assumption that
    daughters require houses in order to be married, and sons will join the natal
    houses of their wives, at least initially. Postponing their own marriages if necessary,
    brothers are expected to contribute substantially to the construction of dowry
    houses for their sisters. Once married, having multiple wives under this system—although
    permitted by Islamic law—is not a practical possibility.¹⁰ The first issue in
    any arranged marriage negotiation will be the provision of a house, which might
    be the bride’s dwelling or a newly constructed house. If the bride’s family has
    sufficient wealth and vacant property, it is common to see a cluster of adjacent
    homes arise in the same neighbourhood, occupied by a group of married sisters.
    Wealthy families may also include agricultural lands or other property holdings
    in the dowry offer, plus cash, jewellery, and household goods. Well-to-do parents
    have been known to construct identical side-by-side houses for daughters who are
    close in age, to avoid rivalry (see Figure 5.2). When I spotted a shiny new Toyota
    Prius sedan deeding along the rutted lanes of Akkarapattattu in 2012, I had to
    assume it was the automotive commitment to a lavish dowry house wedding.


    The circumstances of individual families will vary, but the general expectation
    is that the Moorish bride and groom will live with the


    > (p.93) wife’s family for an initial period of time, and at least until the birth
    of the first child. When the bride’s next sister is ready to be wed, the parents
    will donate, construct, or rent if necessary a second dowry house into which they
    and remaining unmarried children will then shift, leaving the first daughter and
    son-in-law and their children to carry on as an ‘uxorilocal’ family


