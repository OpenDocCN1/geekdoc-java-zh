    (p.98) Increase in the Value of Mahr


    In the 1970s it was customary to regard the mahr, a payment from the groom to
    his bride that is regarded in Islamic law, as a purely nominal sum, usually 101
    Sri Lankan rupees (SLR) or SLR 1,000. Even small payments of mahr were routinely
    deferred during the signing of the Muslim marriage contract, to be paid only if
    a divorce were later to ensue. There are marriages in Akkaraiattu today in which
    the mahr is still such a nominal and symbolic amount, but these tend to be either
    poorer families or those who are inspired by Muslim reformist (tawhid) preaching
    that advocates a return to simpler and more austere Islamic marriage practices.
    It is agreed that the nature and amount of the mahr is a decision entirely in
    the hands of the Muslim groom, but there has been a striking tendency for the
    value of the mahr to increase dramatically in middle-class Muslim family weddings.
    In place of a cash payment, it is now common for wealthier grooms to present their
    brides with an item of gold jewellery, sometimes a bracelet or more often. The
    Muslim registrar of marriages records the mahr on the official government marriage
    form by indicating the nature of the gift and its current market value. The inflation
    in mahr is seen strikingly in the gold jewellery presented by Moorish grooms who
    are professionally employed abroad. At a nikäh (marriage registration) I in 2011,
    the groom who would have a well-paid position in the Gulf, offset as mahr a stunning
    gold necklace from Dubai work worth SLR 250,000, equal to US$ 2,300 at the time.
    Later, at the bride’s house, the mahr necklace was ceremonially tied on behalf
    of the groom by his married elder sister. In the 1970s, a Moorish wedding chain
    would have been called a tāli, the same term used by the Tamils, but now it is
    referred to as a generic necklace (cavati) to avoid any Hindu religious connotations.
    Also, in the past it had been commonplace for the groom to purchase the bride’s
    necklace with dowry cash advanced by her family, whereas nowadays—when the jewellery
    is bestowed as mahr—there is the expectation that the groom will use his money.
    Practically always, however, a gold necklace or chain of some kind will be tied
    around the neck of the Moorish bride at her kalyanam wedding celebration, just
    as it is at a Tamil Hindu or Christian wedding. (p.99)'
