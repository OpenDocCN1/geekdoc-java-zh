    The Commun Rift

    Mohammed Sporting’s remarkable run happened at a time when Indian politics was
    polarized between the Indian National Congress and the Muslim League, and tensions
    were rife in Bengal. The Muslim League had been a marginal presence in Bengal
    until 1933 when it was revived in the wave of Hindu opposition to the Communal
    Award. Bengal also had one of the worst records of Hindu–Muslim conflict. Between
    1905 and 1947, Bengal saw several riots with Calcutta being one of the most violent-prone
    areas in the province. The situation was such that events like playing music before
    mosques or a vehicle running over a child or certain kinds of plays could trigger
    sudden violence.²⁸ Often, a Mohammed Sporting defeat on the football pitch ignited
    in violence.²⁹ The growing tensions between Hindus and Muslims, especially in'
