    in India.


    (p.202) As Table 10.1 testifies, the sample finally bears a healthy diversity
    across the indices of age, education, profession, religiosity, caste/biradari,
    and also gender. The city itself offers a great diversity, reflecting the laid-back
    charm of the old city as the impulsiveness and hastiness of the new professions
    and entrepreneurships that the Muslims have started to register their presence
    in it. The pattern is quite evident in the development of the city. While the
    walled city, part of the central district, reflects the old grandeur with the
    remnants of Mehrauli village too making a similar claim—new areas in the south
    district, especially Bangla House, emerged, owing to the influx of Muslim professional
    and business classes from 1970s onwards (see Table 10.2). Over the years, the
    locality has undergone an exponential expansion, claiming new areas such as Shahin
    Bagh, Fazal Enclave, Noor Nagar, Gaffer Manzil, Jaffury Farms, and Okhla within
    its fold. North-east Delhi, with its hugely populous enclaves like Seampur, Jabrabad,
    Welcome Colony, and Seampur is yet another site where large Muslim populations,
    belonging particularly to the unorthodox but skilled class can be found. The central,
    north-east, and south districts comprise the bulk of Delhi’s Muslim population.
    Further, the city over the years has acquired a new character with suburbs such
    as Gurgaon, Noida, Faridabad, and Ghaziabad emerging as industrial hubs. A substantial
    section of the workforce in these industries, as observational data shows, Muslims
    emigrating from the North Indian states of Uttar Pradesh and Bihar.


    The being seat of political authority, Delhi is also the repository of political
    consciousness of variegated ideological hues among Muslims. This is underscored
    by the fact that most Muslim organizations with an All-India profile have their
    central offices located in Delhi. Thus the Jamaat-e-Islami (JI) in India Nagar,
    All India Milli Council, All India Muslim Personal Law Board, and All India Muslim
    Majlis-e-Mushwarat in the Batla House, the Jamiat Ulama-i-Hind (JUH) at U, and
    the All India Organization of Inams of Mosques at K.G. Marg name to a few, such
    as Milli Gazette, Muslim India (before it became irregular), Al-Yaum Weekly, Sahafat
    Daily, Radiance, Kanti (Hindi and Urdu organs of JI), Jamiat (newsletter of JUH),
    Saifi Samachar (organ of the Saifi community), (p. 203)'
