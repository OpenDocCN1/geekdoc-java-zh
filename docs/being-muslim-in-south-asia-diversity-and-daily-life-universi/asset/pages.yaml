    a house, a dowry, and everything else.’


    # Forbidden Cousin Love


    Moorish kin for mother’s sisters’ children and father’s brothers’ children classify
    these parallel cousins as siblings, as is elder or younger brothers and sisters.
    Unlike cross cousins, who are potential marriage partners, parallel cousins are
    governed by the same taboo that prohibits marriage with immediate ‘born-with’
    (kūta piranta). While there has been weakening in the rule against marriage with
    one’s own matrilineal clan (which is also defined as a kind of sibling), the idea
    of romantic love between parallel cousins remains virtually unimaginable. Because
    of this fact, it has been possible for a few love affairs between Moorish parallel
    cousins to bloom secretly under the noses of their families, then later to receive
    approval of most officials because parallel cousin marriage is permitted in Islam
    and is widely practised in the Middle East. This is an Islamic escape that would
    not be available to Tamil lovers in the situation.


