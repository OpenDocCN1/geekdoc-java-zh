    Ultimately, an analysis of contemporary Muslim society in Tamil Nadu needs to
    include local, state, and pan-Indian perspectives to make sense of the internal
    contradictions that lead to ever-inflections in social life and discourse among
    Muslim societies. But at the same time, the various contradictions between patterns
    of discourse, social realities, and what is assumed to be the standard narrative
    of ‘Indian Muslim society’ also points to the problematic nature of the latter.
    There is simply no Indian Muslim society’, which is organized along the same lines,
    holding the same values, or faces the same problems. While few would subscribe
    to a homogenized view of Indian Muslims, the tendency to perceive Indian Muslim
    societies, which exhibit comparable structures and can then be addressed in a
    uniform manner, is ultimately only a variation of the notion of Indians as a homogenous
    block.


    (p.85) ***


    I have attempted to draw attention to the highly diverse and dynamic character
    of Tamil Muslim societies. My aim has to demonstrate how the commonly presented
    model of Tamil and other Muslim societies in south India reduces this diversity
    to a set of reified communities with static histories. Moreover, the ultimate
    structural origin of this model lies in the peculiar vision of Indian society
    constructed by British colonial administrators and Mughal elites in the nineteenth
    century, a vision that was informed by the racist assumptions of British census
    ethnography and the supremacist claims of Mughal elites claiming foreign or at
    least north Indian ancestry. The result has been a model that makes Tamil Muslim
    societies doubly irrelevant to the study of Muslim societies in India as a. On
    the one hand, rather than showing an image of ‘diversity’, it produces ‘difference’,
    a difference that produces ‘communities’ as basically inoperable and irrelevant
    to each other. At the same time, as each ‘community’ is constructed on the basis
    of the same logic, whatever ‘parallel’ may be perceived actually turns to be totally
    identical with the original—and consequently, irrelevant again, as appears to
    be nothing new that can be learned from studying the divergent case.'
