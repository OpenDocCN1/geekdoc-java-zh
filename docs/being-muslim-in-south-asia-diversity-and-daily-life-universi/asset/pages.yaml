    Mohammedans of (p.334) Calcutta made merry till the night.''¹¹ A souvenir provided
    by the club in 1935 wrote of the thousands in the mofussil areas ‘followed each
    game with the greatest interest, so much that many used to walk miles to the railway
    station to meet coming trains with Calcutta newspapers to get the results as soon
    as possible.’¹² There were reports of crowds gathering in towns around wireless
    loudspeakers broadcast of the club matches. Several Muslim sporting clubs sprang
    up in the district and headquarters in the wake of Mohammedan Sporting’s success.
    Inspired by the success of Calcutta Muslims in Dacca formed their own Dacca Mohammedan
    Sporting in 1936. Muslims took up sport, partly spurred by the proliferation of
    physical culture association with Hindus in both urban and rural Bengal. At the
    time of Muslims were largely a monolithic group, divided as they by class and
    location. But the success of Mohammedan Sporting was part of the gradual progress
    of building the ‘factionalism, intrigue and conflicting interests of various Muslim
    groups¹³ and contributing to Muslim community.


    # The Reasons for Success


    The astounding success of the club was built on several factors. First, by the
    1930s the club had achieved some degree of financial solvency. In 1924, the club''s
    balance sheet was still heavily in the red. While the club had Rs 9 in its kitty,
    its debts reached Rs 3,600. Though the club had 208 members, few actually paid
    membership fees, which amounted to Rs 25-30 per month.¹⁴ Things turned around
    S.A. Rashid, along with I.G.H Arif, took charge of the club. They appealed to
    Muslims to donate generously to the club. The turnaround of the club coincided
    with the formation in 1932 of a group called the New Muslim Majlis, which included
    members (p.335) as Khaja Nooruddin and M.A.H Ispani, who also aimed to secure
    freedom as ‘capture and re-organise the Muslim sporting club as the premier team
    of India.’¹⁵ Nooruddin (1900-1968) was an alderman in the Calcutta Municipal Corporation
    and later elected to the Bengal Legislative Assembly. He was the secretary of
    Mohammedan Sporting during the crucial years between 1936 and 1945. The rise of
    Mohammedan Sporting Club also coincided with the ascendancy of the Muslim League
    in Bengal and mobilization around Muslim identity. Several prominent Muslim leaders
    such as Khaja Nazimuddin, a cousin of Nooruddin, who later became the second governor
    general of Pakistan and subsequently prime minister, became life members. Nazimuddin
    was also elected as the president of the club. The governor of Bengal, John Anderson,
    became a patron of the club. Muslim merchants of the city, too tinched to build
    a base support around the club pavilion.


    It was not just financial stability and a growing support base that fuelled the
    success of the club. There were other footballing reasons. Mohammedan Sporting
    broke with the practice of its main Calcutta rivals, Mohun Bagan and East Bengal,
    by recruiting players from outside Bengal. In this it had a significant'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# A Million Salutes


    advantage over its rivals in that it could recruit Muslim players from all over
    the subcontinent. Indeed, the club recruited players from as far afield as Quetta
    and Peshawar in modern Pakistan. In 1936, for instance, the Mohammedan Sporting
    line-up that took on East Bengal for a charity game had as many nine people from
    outside Bengal: Jumbo Khan (Quetta), Rashid (Peshawar), Osman and Aquil (Delhi),
    Rajjuddin, Saboo, Masoom, and Rahim (Bangalore), and Noor Mohammad (Fyzabad).16


    In a significant breakthrough, the club decided to play football with boots on
    grounds. This was enormously important for Mohammedan Sporting''s football success
    since it was the practice of the large Calcutta clubs to play barefoot. The Indian
    team played barefoot in international tournaments till as late as 1952. In 1933,
    for the first time, six Mohammedan players donned boots on a wet and thrashed
    the Nebagan side by an incredible 16-0 margin. The man in charge of the team,
    S.A. Aziz, even designed a light boot, created by local cobblers, suited for the
    (p.336) conditions in the Calcutta Maidan. However the club did not let the advantage
    of playing barefoot on dry grounds. Even veterans like Sam, who had been playing
    in the Calcutta Maidan for nearly two decades, adjusted remarkably to boots, running
    with the ‘easy grace of a stag’, showing ‘admirable precision in his shots’, and
    proving to be ‘quite a wonder in his new equipment’.17


    To Mohammed Sporting must also gain the credit for throwing up the first international
    player from India—the club’s star forward, Salim. His remarkable story reads a
    fact. Born in the predominantly Muslim locality of Metaibruz in Calcutta, Salim
    began his career with small club Chittarangan moving to the bigger Bowbazar Club.
    He had a brief stint with Mohammed Sporting before being recruited by the Sporting
    Union Club. Within a couple of years he moved to Aryan Club, which was coached
    by the legendary footballer Choney Majdar. He returned to Mohammed Sporting in
    1934 to help them win their first League title. Salim was the spearhead of the
    Mohammedan attack, with immaculate control and passing skills.


    After Mohammed Sporting won the 1936 League title, Salim was picked for the All
    India Olympic team in Calcutta, which was playing exhibition matches in India.
    The official charge of the Chinese team, Chi Chao Yung, was very impressed by
    the forward line of the Indian team that, besides Salim, could boast of players
    like Rahim, Bhattacharya, and Abbas. When it was the time for the second match
    against the Chinese team Salim had missing goes that Salim, along with a friend,
    had embarked on a trip to Europe. He eventually surfaced in Glasgow, where he
    chose Scotland as his eventual destination is. Salim’s companion, Hasheem, convinced
    the manager of the famous Celtic Club to try out Salim. The trial took'
