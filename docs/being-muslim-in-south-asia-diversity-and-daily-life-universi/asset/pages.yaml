    By keeping my study within the madrasa system, I intend to explore various forms
    of interactions and cultural exchanges between Deoband and non-Muslims in India.
    Are these interactions new or precipitated by certain structural requirements?
    It must be noted that during the colonial period, the Deobandi leadership under
    the banner of JUH opposed the nationnation theory of the Muslim League and instead
    aligned with the Indian National Congress to fight the British.¹⁸ In independent
    India, the JUH has mostly played a moderate role by participating in ongoing political
    regimes. Before discussing Deoband''s approach towards non-Muslims, it is pertinent
    to understand the structure of education in Deoband, as it sheds light on the
    ideological orientation of the seminary.


    Structure of Education

    The syllabus taught in Deoband was heavily influenced by dars-i nizami, which
    was developed in the famous school of Farangi Mahal in eighteenth-century Lucknow.
    Yet, there were differences in the purpose of education of these two schools.
    While the ulama of Farangi Mahal trained students to get jobs, Deoband aimed at
    creating a body of religious leaders that serve the spiritual and legal needs
    of the Muslim community.¹⁹ Thus, the major emphasis of the Farangi Mahal syllabus
    was maqulat (rational sciences), in contrast to the Deobandi school, which emphasized
    manuqulat (revealed sciences).²⁰


    Currently, there are 3,500 students studying in Deoband. There are no facilities
    for girls'' education. There are a few Deobandi madrasas imparting education to
    Muslim girls. Every year, 1,000 students are admitted based on their performance
    in an all-India entrance examination. The number of aspirants to Deoband in the
    late 1990s was 3,000, which has gone up to 7,500 in 2010. Students can take this
    examination after completing five years of primary education in a secular school,
    or in Deoband, and in any other madrasa. These numbers also reflect the continued
    importance of the seminary among Indian Muslims.


    After gaining admission, students have to undergo eight years of education, during
    which they are taught maqulat (the revealed studies of Hadith or tradition and
    Quran), logic and philosophy, sharia (Islamic law), tafseer (the interpretation
    of holy scriptures), and Arabic. After completing eight years of education, students
    get a sanad-e-fagarat (graduate degree) or the certificate of Fazil, which is
    equivalent to a bachelor''s degree. Many students discontinue their education
    after becoming Fazil. There are some students who choose to go takmilat or post-graduate
    courses in areas of fiqh, tafseer, or adab (literature) and other specialized
    courses.'
