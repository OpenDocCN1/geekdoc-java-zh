    experience of colonialism, and, indeed, Islamic teachings, to offer a pithy conclusion:
    ''Islam isn''t the problem and it isn''t the solution, it''s simply a religion.''
    ^7 Even after the recent pro-democracy movements in the Middle East, a conclusion
    like this seems remarkable given the persistence of stereotypes about Islam. There
    have, of course, influential Muslim (p.21) political figures in India as elsewhere
    insisted that there was an Islamic justification or even requirement for any number
    of governing patterns. And other Muslims who disagreed. Such innovation and disagreement
    underlines, in Kristof’s father, that Islam is ''simply a religion'' like any
    other.


    However justified, a range of visions can come for Muslims in the context of India’s
    independence movement. There were, one might suggest, two models of democratic
    participation that competed ever once. One model of what might be ideal liberal
    democracy, roughly characterized by such features as elected membership in institutions,
    separation of powers institutionally or through federal arrangements, and crucially,
    the existence of free citizens who stand in direct relation with the state, with
    no ascriptive categories or institutions mediating their participation in governing
    institutions. This was the vision of the main architect of India’s constitution,
    B.R. Ambedkar; of the great prime minister, Jawaharlal Nehru; and, perhaps surprisingly,
    the ''founding father'' of the Muslim state of Pakistan, M.A. Jinnah.


    The second model is rooted in what is sometimes called the ''colonial sociology''
    of India. This vision of India was predicated on the understanding that the nation
    was comprised of discrete and enduring ''communities'' defined by caste, religion,
    and ethnicity. This understanding was central to the discourse of nationalistic
    negotiations in the decades leading up to India’s independence in 1947 as debates
    focused on ''the Hindu community'', ''the Muslim community'', and, at times, the
    ''untouchable community''. The contours of British governance had held Hindu and
    Muslims in particular as two, parallel, and fundamentally opposed groups, each
    driven by their religion, whose interests could virtually never intersect. These
    identities were reflected in negotiations about provincial boundaries, participation
    in governing structures, and opportunities in educational institutions. As the
    British began to introduce limited representative government into India during
    the early twentieth century, they devised formalized quotas into representative
    institutions.


