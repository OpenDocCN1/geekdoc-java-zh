    # Islam and Democracy in India


    From Savile Row to Jyotiba Phule


    Barbara D. Metcalf


    DOI:10.1093/acprof:oso/9780198092063.003.0002


    # Abstract and Keywords


    Whatever the inequities and corruption, India rightly stands out as the world’s
    largest democracy. India also claims the world’s largest minority, it 160 or 175
    million Muslims constituting 14 cent of the whole and forming the third largest
    Muslim population in the entire world. Although pre-partition India gave birth
    to one of the most influential Islamic thinkers of the 20th century, India’s Muslim
    leadership throughout has championed democracy and democratic participation—from
    the ideal liberal theory espoused by Jinnah and the communitarian democracy of
    *ulama* and others articulated at mid-twentieth century, to the Nehruvian secularism
    and class-based Muslim Dalit/ disadvantaged activism in the present. This chapter
    traces the various idioms of democratic participation on the part of three twentieth
    century leaders (Jannah, the Islamic scholar Madani, and the Islamist Maududi)
    to the proliferation of party loyalties and causes of Muslims in the present.


    *Keywords*: Jinnah, secularism, assimilation, democracy, Muslim political thought


    The eight countries of South Asia in recent decades have given us every form of
    rule, from monarchy to military authoritarianism, to rule by Islamists. Among
    them, India is the proud claimant to the title of the world’s largest democracy—and
    the world’s largest minority, some 160 or 175 million Muslims, roughly 14 cent
    of a total population 1.3 billion.¹ The number of Muslim Indians dwarfs **(p.19)**
    virtually all Muslim major countries across Indonesia and India’s neighbours to
    the north-west and north-east.'
