    We are familiar with the notion that specific institutions are devoted to the
    production of specific religious ideas. Indeed, following Talal Saad, we are familiar
    with the notion that particular expressions of Islam are ‘produced’ by particular
    expressions of power. It is, in, quite common to read that types of schools in
    Pakistan (public schools, private schools, madrasas, and so on) engage the teams
    of Islam in ways that produce alternative (and competing) sets of ideas.


    Within the existing literature the most common argument has three parts. The most
    common argument—in every sense an ‘institutionalist’—suggests that (a) madrasas,
    catering to the rural poor, produce ‘sectarian’ students who are particularly
    intolerant of difference, (b) public-sector schools, catering to the lower middle
    classes, produce a slightly higher level of tolerance, and, (c) Pakistan’s elite
    English-medium academies produce the most tolerant (p.163) students of all. This
    argument, combining Talal Saad’s attention to specific forms of ‘power’ (vis-à-vis
    the formation of ideas) with a more explicit form of ‘class’ analysis, can be
