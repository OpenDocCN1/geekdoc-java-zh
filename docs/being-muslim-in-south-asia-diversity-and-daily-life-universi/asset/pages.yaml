    was regarded as a landmark event. The popular songn—‘Mohammed Sporting tumko lakh
    lakh salani ham ab deska badshah bane, or sab hai hai (p.338) ghulam (Mohammed
    Sporting, a million salutes to you/we have become kings of the country, all the
    rest are slaves)—captured perfectly what the victory meant to Muslims. The successful
    run by Mohammed Sporting inspired Muslim poets like the great Nazrul Islam to
    compose poetry in honour the team: These feat that have been so incredibly'
