    a sacred text to deal with such possibilities (p.xx) and with mechanical apparatus
    unknown when the holy work was composed? Khalid Masud encapsulates this question
    in the context of ideas between Sayyad Ahmad Khan and Jamaluddin Afghani in the
    nineteenth century. Afghani has been little known in the West, by discussion of
    his travels, ideas, and influence wider currency when Pankaj Mishra devoted a
    quarter of his best-selling *From the Ruins of Empire* to Afghani''s life.4


    One might ask, "Why focus on past contests of ideas among Muslim intellectuals
    in a book claiming to focus on daily life? The answer of course is that ‘ordinary
    people’ have ideas, though they may not necessarily know their origins, and the
    ideas debated by the powerful often come to the lowly. Muhammad Khalid, for example,
    concludes that in the end of the nineteenth century, ‘Jamaluddin Afghani''s political
    ideology of a universal caliphate dominated Muslim imaginations’ and generally
    prevailed over Sayyad Ahmad Khan''s calls for adaptation and change. ‘Neglecting
    religious reforms and education, Muslim thought in South Asia,’ Masud concludes
    somberly, ‘came to its present impassance."


    How did between established beliefs and new conditions unfold in the twentieth
    century? Barbara D. Metcalf provides thumbnail sketches of four Muslims and political
    actors: Muhammad Ali Jannah (1876-1948), Maulana Nuhani Ahmad Madani (1879-1957),
    Abul ''Ala Maududi (1903-1979), and Maulana Gulam Muhammad Vastani (born around
    1958). Jannah, the Anglicized lawyer, became the father of a Pakistani elite who
    did not live long enough to define. He seemed to envisage a state which would
    behave rather like the United Kingdom where the majority of people were Protestant
    Christians and the head—the king—was recognized as the head of the Church of England.
    Though holidays and rhythms were Protestant, the state treated individuals as
    equal citizens. “You may belong to any religion or caste or creed, that has nothing
    to do with the business of the State,” Met quotes quotes Jannah. But Jannah died
    thirteen months after independence, and other ideas, stemming from Afghani''s
    nineteenth-century visions, contended to become the underpinnings of Pakistan.
    The (p.xxi) ideas of Maulana Maududi, the third of Metcalf''s thinkers, stood
    at an opposite pole to those of Jannah. Maududi reached out through the medium
    of print to large numbers of Muslims with a message about the need for an Islamic
    state—not a state where Muslims were simply a majority but one in which the tenets
    of Islam were woven minutely into the daily practice of government and social
    life.


    The two others on whom Metcalf illustrates the diversity that this book emphasizes.
    Each developed alternative views of how Muslims in South Asia should relate to
    governments, the challenges of world capitalism, and the pervasiveness of modern
    states. Maulana Madani, a contemporary of Jannah, remained in India in 1947. ‘Nations
    are born on homelands, no religion,’'
