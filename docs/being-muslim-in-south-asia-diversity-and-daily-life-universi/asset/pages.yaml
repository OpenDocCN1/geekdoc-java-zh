  pgno: 205
- img_proc: true
  md: '# ‘Being Muslim’ in Contemporary India


    communities and religious groups of this country.’ Mian Fayyazuddin, the owner
    of Haji Hotel in Jaipur Masjid questioned the patriotic credentials of those who
    were casting suspicions upon the fidelity of Muslim citizens. And Mushtaque Siddiqui
    linked the question of patriotism to the targeting of Indian Muslims on People
    with RSS [Rashtriya Swayamsevak Sangh] mindset often refer to Muslims as Pakistanis.
    They blame us for spreading terrorism, but tell me how the terrorists are able
    to cross over such a huge contingent of our army is deployed on the borders?’
    Mohammad Israel wondered: ‘Tell me, Gandhi is the hero of this country and who
    killed Gandhi? (p.209) Was he a Muslim? Who were the people killed Indira Gandhi
    and Rajiv Gandhi? They were not Muslims. Why then are the Muslims called traitors’


    Stigmatization of Muslims and their cultural practices remains to the construction
    of a wounded Muslim self. But there the prevalence of variances and stereotypes
    translate into a reality of discrimination? To evolve a measure of discrimination
    with any degree of certainty remains a complex task. Experiences of discrimination
    are context-specific as much as individual-specific. To a generic question such
    as: are Muslims discriminated in public employment, educational institutions,
    in the allotment of housing facilities, and so on, the answer was generally in
    the affirmative. However, when asked if they had experienced it personally, most
    respondents circumvented. Siddiqui wanted to run a school by the Municipal Corporation
    of Delhi and later to the Delhi College (rechristened Zakir Hussain College, Delhi
    University). He never sought employment, choosing to work in his family business.
    Siddiqui, who felt discriminated against, however, was convinced of the preponderance
    of such practices against Muslims


    There is no doubt about. One of my friends completed his BA and applied for a
    job in a private firm. He asked how he had dared apply despite being a Muslim.
    In the government sector, the situation is much worse.... Things are difficult
    for officers who are Muslims. I know of many who have suffered.... In every sphere,
    the Muslims are discriminated against and this is one of the main reasons why
    they lag behind.


