    The Moorish matrilocal marriage system in eastern Sri Lanka has proven highly
    resilient in the face of the tsunami and the vicissitudes of the Eelam wars. Virtually
    all Moorish brides begin their wedded lives living with their parents, where their
    in-marrying husbands join them. With mothers’ domestic supervision and their married
    sisters close by, matrilocal Muslim brides enjoy a valuable household network
    for childcare and some degree of protection from domestic violence. A similar
    matrilocal tendency has been noted among Moorish Muslims in Wellassa,¹ among Moors
    in Colombo and Galle² as in southern coastal Muslim settlements in Tamil Nadu
    such as Kayapattnam.³ Expulsion by the LTTE in 1990 disrupted residence and dowry
    patterns among the Muslims of Jaffna and Mannar.³⁴ Because the Tamil Hindu concept
    of dowry (citapam) has been judged to be unjust, Muslim parents often assign lavish
    to their daughters as an outright privilege to receive post-mortem inheritance
    from their parents. The payment of Islamic bride price (mahr) from the groom to
    the bride, formerly a trifling sum, has now become a major gift in wealthier families—perhaps
    a gold necklace worth SLR 200,000 or more.


    **(p.114)** Combining their exclusively owned dowry property with the extensive
    mahr they receive from their husbands, middle- and upper-class Muslim wives in
    Sri Lanka potentially control more personal wealth than their Tamil Hindu sisters,
    who must share their dowry jointly with their husbands. It is also noted that
    both Tamil and Moorish wives routinely manage their family’s income, expenditure,
    and savings (the latter often by monthly contributions to a neighbourhood ‘chit’
    scheme). However, poverty inevitably places women at a grave disadvantage in any
    type of dowry system. In Sri Lanka, without a house from her parents, a daughter
    is virtually unmarriageable unless she can find a match. Impoverished Muslim wives
    have resorted to working housemaids in the Gulf in order to build dowry houses
    for themselves or their daughters.


