  md: '# The Ismaili Conciliation and Arbitration Boards in India


    He who mediate between people for a good purpose shall be the gainer by it. But
    he who shall mediate with an evil mediation shall reap the fruit of it. And Allah
    keeps watch over everything.


    —Quran (4:85)


    This chapter seeks to describe the Shia Imam Imamaili Conciliation and Arbitration
    Boards (CABs) in India and to analyse them as a (p.142) variety of community justice.
    The first part of the chapter discusses the history, evolution, and structure
    of the CABs, both in conceptual as well as practical terms. It also explains the
    international nature of the CABs—linked as are to various national boards and
    an international board.


    The second part of the chapter analyzes the CABs as institutions that negotiate
    a variety of relationships and forces. The chapter discusses how the CABs may
    be seen as negotiating (a) law—both formal and informal; (b) tradition—the relationship
    of tradition and modernity; (c) community—the community interest as well as the
    relationship between the community and the state, and the community and other
    communities; and (d) the interaction of plurality and authority. Finally, the
    chapter considers the CAB system as a response to the challenge of developing
    legal norms for a transnational community that may also be seen as a step towards
    community justice.


    # Background to the Nizari Ismaili Conciliation and CAB System


    The Shia Ismailis (hereafter the ''Ismailis'') are a diverse community within
    the tradition of Islam whose members belong to different ethnographic and linguistic
    traditions, including those of Arabia, Iran, central Asia, Western China, and
    South Asia. They live across Asia, the Middle East, and in recent decades have
    established significant communities in Europe and North America, as well as emerging
    communities in other parts of the world such as south-east Asia. The Ismaili community
    numbers in the millions with populations in 25 countries, and may thus be seen
