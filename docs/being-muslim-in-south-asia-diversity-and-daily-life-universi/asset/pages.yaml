    Muhammad Jinnah

    Jinnah (1876-1948), the Westernized lawyer of the Muslim League, was in many typical
    of the nationalist leaders of the mid-twentieth century in being part of the legal
    profession, fluent in English, and of upper-class status. To be sure, he stood
    out for his meticulously tailored ''bespoke'''' Row wardrobe—and an aversion to
    extra-legal demonstrations, the use of homespun khadi as a political symbol, and
    generally, the tactics taken up under the leadership of Gandhi. He was a proponent
    of what was sketched out as the model of ideal liberal democracy.⁴ Jinnah''s party,
    the Muslim League, took as a central devolution of power to the regional level,
    thus allowing (p.23) provinces with a largely Muslim population to conduct their
    political life, in internal affairs, without a focus on religion or other group
    identities—where, in short, they could ideally leave the colonial model of communitarian
    identities, and citizens could group and regroup as individuals with whatever
    seemed significant.⁵ Thus, to underline what was the Muslim League goal: they
    wanted to create political contexts where Muslims would be to defined politically
    as Muslims. To achieve this, they favoured a decentralized federal arrangement.
    By the end of the colonial period, they focused on five of the existing provinces,
    which would have largely Muslim populations.⁶ Jinnah, one might argue, was using
    the communitarian model in order to transcend it. He invoked the distinctive characteristics
    of an imagined minority ''Muslim community'' in order to secure political arrangements
    where they would not be one.


    In 1940 the Muslim League, instead of advocating decentralized federalism, declared
    a separate state as their goal.⁷ But as late as 1946, their leadership accepted
    the plan for a loose federal system proposed by the so-called Cabinet Mission,
    sent from Britain to the Labour government at the end of World War II. Nehru and
    other Congress leaders found his kind of federal structure unacceptable given
    their commitment to central state planning in the interest of economic growth.
    Partition seemed the only route to allowing that kind of government to develop.


    Jinnah''s ''bargaining chip'' turned into Pakistan (whose eastern in 1971 broke
    away to become Bangladesh). In a speech addressing Pakistan''s Constituent Assembly
    in 1947 he set out his vision for the new nation, a vision that could have served
    at the time as equally as the vision of Ambedkar or a Nehru:


    (p.24) Now, if we wanted to make this state of Pakistan happy and prosperous,
    we should wholly and solely concentrate on the well-being of the people.... If
