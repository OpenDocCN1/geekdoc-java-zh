  md: '# Transnational Networks, Political Islam, and the Concept of Ummah in Bangladesh


    revivalist movements. Indeed, Jackson argues that this memory of Muslim history,
    featured through the writings of Muslim political thinkers, is a memory determined
    by authority.63 For influential political thinkers, the memory of Muslim political
    authority in the golden age is all a conceptual inspiration. Such a political
    could seems idealistic in the twenty-first century. Hizb ut-Tahir''s political
    agenda however appear as a distant embedded in a distant past. However, according
    to news in 2012 Hizb ut-Tahir was expanding, and the government of Bangladesh
    chose to ban it.64 This only emphasizes that modern politics faces challenges
    from older forms of politics and political allegiance in Bangladesh. The expansion
    of old form of politics, however, is a modern phenomenon and owes much of its
    potency to the transnational possibilities of the twenty-first century.


    Finally, the power of the Internet has had profound implications for Bangladesh
    by enabling the expansion of transnational social and political movements of Islamists.
    The expanding support among urban-educated youths for informal Islamist parties
    indicates that the Internet plays an important role in the propagation of ideas
    about the unity of the Muslim ummah. Facebook groups such ''Struggle for Islam
    in Bangladesh'' emerged, which had more than 3,000 supporters in September 2012.
    Postings on Islam to group many other Muslims questioned the role of the Internet
    in shaping Muslim consciousness in Bangladesh. A large number (p.248) of youths
    were not happy with state of politics. Corruption and nepotism remained among
    the most corrupt nations in the world, according to Transparency International''s
    global corruption index.65 Such frustration of youths in politics was acknowledged
    by the Communications Minister in the AL government: ''Most of the younger generation
    writes on [their] Facebook profile that they hate politics.''566 As a vacuum emerged.
    The Islamists'' notion of ''honesty and morality'' of the Muslim ummah and their
    call for political action to expose corruption has attractions for certain groups
    of youths in Bangladesh. The role of the Internet in this context was critical.


    These various networks of political Islam were instrumental in making the ummah
    politically relevant in Bangladesh. The perceived hostility of Islam young Bangladeshi
    Muslims whose awareness of the ummah has been reinforced by the networks and technologies
    described in this chapter. However, in the twenty-first century; flags and nationally
    significant monuments are symbols of a Bangladeshi identity that coexists with
    that of being Muslim. A narrow interpretation of the ummah discriminates against
    fellow Muslim citizens of Bangladesh. Finding a peaceful resolution to this tension
    between being Bangladeshi and being Muslim challenges millions of people who speak
    Bengali and follow Islam.'
