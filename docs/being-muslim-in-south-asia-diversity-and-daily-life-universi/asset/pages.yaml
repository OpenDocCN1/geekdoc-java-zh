    India can be attributed to the location of the seminary. However, this has dropped
    from 85 per cent in the 1990s to 75 per cent in 2010, which demonstrates the growing
    popularity of Deobandi students beyond northern India.


    Deoband has attracted students from different parts of the world. It has students
    from Afghanistan, Bangladesh, China, Malaysia, Nepal, Pakistan, South Africa,
    and other countries.25 Nik Abdul Aziz Nik, spiritual leader of Pan-Malaysian Islamic
    Party, also studied in Deoband. This also reflects the transnational linkage of
    Deoband and its global influence. However, the flow of foreign students has almost
    stopped since the 1990s when the Indian government tightened visa rules.26 Despite
    this, the Deobandi school of thought is widely respected in the Islamic world.


    # Building Bridges with Non-Muslims


    Darul Uloom, with the help of the JUH, has been attempting to build bridges between
    Hindus and Muslims. It has condemned communal violence and tried to mitigate the
    tensions between Hindus (p.191) and Muslims through various confidence-building
    measures between the two communities. One can also note that so far there has
    no communal violence in the town of Deoband where the seminary is located. The
    progressive orientation of Deoband can be measured by its attempt over the years
    to create harmonious relationships with non-Muslims.


    In February 2004, Deoband requested Muslims to respect the sentiments of Hindus
    by avoiding sacrificing cows on the eve of Eid ul-Zuha. Hindus consider the cow
    sacred. Mufti Habib, head of the Darul''s fatwa bench, stated, "Though cow-slaughter
    is legitimate in Shariat, it is advised that sheep, goat and camel be sacrificed
    in states where there is a ban on cowslaughter. The law of the land should not
    be violated and peace should be maintained in the states and the country."27 This
    was not a fatwa but an appeal to the Muslim community to show its goodwill and
    respect towards the sentiments of the Hindu community.


    Deoband has also opposed the idea of India as dar ul-habab (abode of war).28 In
    March 2009, it issued a fatwa declaring dar ul aman (abode of peace) where jihad
    is meaningless. While supporting the fatwa, Maulana Khaliq Madrasi, deputy vice
    chancellor of Deoband, commented that "the condition of Muslims in India is better
    than in many Muslim countries including our neighbour Pakistan."29 Such pronouncements
