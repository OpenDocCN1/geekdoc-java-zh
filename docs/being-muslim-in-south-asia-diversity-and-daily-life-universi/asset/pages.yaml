  md: '# Kafka in India


    and in different media such as Gujarati, Kannada, and English substantives my\point.


    Since assumption of a prior myth is central to the media reporting on terrorism,
    it is unsurprising that inaccuracy, inconsistency, even contradiction appear in
    their reports. To reiterate, the media fits ‘facts’ of terrorism into a prior,
    violently hegemonic myth of nation. To this end, I have presented diverse and
    conflicting accounts of SIMI and IM by media as well as security experts who base
    their accounts on the former. I have also paid attention to Muslims’ cultural
    markers–beard, Urdu, mosque, areas of dwelling–which inform and shape the definition
    of what a terrorist is. My larger point has been that terrorism is a phenomenon
    of law and more culture, which is understood in relation to the dominant myth
    of nation and its ‘other’. I have also discussed what remains most invisibly in
    mainstream media—the repression of evidence, secret torture chambers, illegal
    means deployed ‘terrorists’, and the accounts of family members of the arrested
    and tortured Muslim youths. It was for this reason that I quoted at length the
    narrative of Aziz Parvaz, whose two brothers were jailed as ‘terrorists’, and
    who feared arrested by the police.


    (p.329) This dialectic of media is visibility and invisibility, the excitement
    and sensationalism that are common to both media and terrorists, and staging and
    recasting myth in a globalized world are some of the most important aspects of
    terrorism and media studies. This chapter is an attempt to unpack the comprehensive
    anthropology of Muslims in post-independent India.


    Notes:


    (1) To my knowledge, there is no accord, official figure legislation for Muslims
    arrested and imprisoned as ‘terrorists’. Though anti-terrorism and Disruptive
    Activities (Prevention) Act, 1985 (TADA) existed, much like the United States,
    United Kingdom, and Australia, India too passed a series of new laws after 9/11:
    Prevention of Terrorism Act, 2002 (POTA) (issued (Prevention) Amendment Act, See
    All India Media Council. 2012. Document on Terrorism and Justice. National Convention
    on Terrorism and Justice held on 27 April 2008, Delhi. http://www.aimcnd.org/document.htm
    visited 9 May 2012; see also Manoj Mate and Andan Naseemullah. 2010, ‘State Security
    and Elite Capture: The Implementation of Antiterrorist Legislation in India’,
    Journal of Human Rights, 9(3): 262–278. According to the Amnesty International
    report, from the date of its enactment until September 2006, over 3,500 (including
    some members) in 18 states were held under POTA. The state of Gujarat had the
    largest number of detainees, 287, of whom all, except one, were Muslim (All India
    Media Council 2012). I don’t know of figures since September 2006.'
