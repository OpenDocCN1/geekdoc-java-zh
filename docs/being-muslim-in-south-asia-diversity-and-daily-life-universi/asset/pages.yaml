  md: '# Being Muslim in Contemporary India


    For most others, riots were exceptions that did not alter the fundamental character
    of the state and the society. Anjala Jamal, a 21-year-old-student of social work,
    S.A. Hassan, Professor of Persian at Jawaharlal Nehru University and Aas Mohammad,
    a matriculate entrepreneur; saw violence against Muslims as context-specific and
    essentially an outcome of majoritarianism among groups in a dominant position.
    For them it was a question of who was in power than the issue of discrimination
    directed specifically at Muslims. Muslims were too prone to such hegemonic impulses
    when injuring a position. For Aas Mohammad''s opinion for instance:


    On a daily basis, I have dealings with people who are mostly Hindus, and there
    has never been any such problem. Riots take place because whoever is in the majority
    in the area, they try to assert it. If the majority is of Hindus, they would like
    to dominate. Conversely, wherever Muslims are in good numbers, they would bully
    others. In any case, such activities are the concern of those people who are sitting
    idle and have nothing to contribute.


    S.A. Hassan sought to dissociate religion from violence, arguing that riots were
    instruments of political polarization. They were oddities and had no bearing on
    Indian democracy. In democracy, Anjala Jamal affirmed her faith in democracy and
    secularism of the Indian state. She felt, particularly in the context of Islamophobia
    across the world, despite Gujarat in fact, Muslims were more secure in this than
    anywhere else in the world. Mauvi Mohammad Qasim, principal of Madrasa Taleemul
    Quran R.K. Puram, cautioned against resisting the entire state apparatus as against
    Muslim interests during riots. He asserted, even though many in the police force
    could be seeing a common mindset, there were equally a number of examples, even
    in Gujarat, when Muslims had (p.207) saved by policemen. It is the impartiality
    of the rulers that were most pertinent, he asserted.


    # Stigmatization, Discrimination, and Deprivation


    If Goffman is followed, stigmatization perverts ''normal identity'' in the sense
    that it conflicts and exists outside a given figure, cultural norm. The discriminated
    emerges itself from pervasive stigma attributed to groups and communities. The
    stereotyping of Muslims—the ‘other’ of the ‘normal’ nation—remains a constitutive
    element of Muslims. The responses, nevertheless when it came to developing strategies
    to cope with such stigmatization and discrimination. The reaction of the ‘stigmatised’
    while in interaction with the ‘normal’, Goffman points out, vacillates between
    ‘cowering and bravado’, making him their either shameless or effaced.1 There is
    however a third category of response too the stigmatized aggressive displays.
    Goffman explains this as follows:'
