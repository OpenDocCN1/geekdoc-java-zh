  md: 'Even then, its Muslim population rivals Pakistan''s and is larger than Bangladesh''s.
    India''s Muslims constitute a larger population than all the African/Middle Eastern
    countries caught up in ''Arab spring'' and its unfolding since 2011. This is,
    moreover, a highly diverse population as the essays in this volume testify, speaking
    different languages, participating in multiple regional cultures, practising—or
    not practising—diverse religious styles, engaging widely divergent economic and
    educational levels—and in this they are like their fellow citizens.


    Muslim Indians in public life, from the beginning of mass politics in the 1920s
    until today, have advocated a democratic process in politics. Today''s Muslim
    citizens are active participants in electoral politics. Indians in general vote
    at a very high percentage compared, for example, to the United States. India,
    again contrast to the United States, it is the poor, which includes most of India''s
    Muslims, not the better off, who most actively exercise their franchise. Muslims
    vote; they lead parties; in some areas they can swing elections. There nor any
    single Muslim ''vote bank'', although parties are regularly accused of ''pandering''
    to such a bank. All this opens opportunities for securing the interests of Muslim
    citizens.


    Tipping the scales on the other side, however, Muslim political efforts have faced
    an uphill struggle, precisely because of yet another dimension of modern democratic
    states: the use of a population constituted a problematic minority to serve as
    a foil for what is called ''majoritarian'' nationalism. Muslim Indians were (p.20)
    consigned this role in the nationalist movement when a historical narrative positioned
    Turk and Afghan as foreigners responsible for Indian politics and civilization.
    This argument served both colonial justifying their presence and nationalist narratives
    looking an explanation for their subservience. Anti-Muslim attitudes were further
    fuelled by India''s partition at the time of independence in 1947 when the out
