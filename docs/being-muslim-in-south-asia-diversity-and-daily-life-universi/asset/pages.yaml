    Despite the adherence to its fundamental ideology, which is still informed by
    orthodox values and conservatism, Darul Uloom Deoband has shown a willingness
    to engage with social issues. Such a transformation raises many questions. Can
    an orthodox institution simultaneously play moderate and progressive roles? Does
    Deoband have a progressive vision for the Muslim community? To what extent does
    Deoband represent Indian Muslims? Is Deoband diverging from its religious sphere
    by engaging with social issues?


    Darul Uloom Deoband works in close with Jamiat Ulama-i-Hind (JUH), a socio-religious
    organization working for the betterment of Indian Muslims. Most of its functions
    and programmes on social and political issues are organized by JUH. This is to
    ensure that the primary objective of Darul Uloom Deoband of imparting religious
    education and serving the religious needs of the Muslim community does not get
    affected.


    This chapter argues although the primary purpose of Deoband is to serve the Muslim
    community in the religious sphere, it has an interest in engaging with social
    issues time and again. However, the justification for intervention in the social
    sphere comes from the religious point of view.


    (p.183) Darul Uloom Deoband has also been regarded as a representative (real or
    imaginary) of Indian Muslims. Such a perception of Deoband has far-reaching consequences
    as it not ignores internal divisions within the Muslim community, but it presents
    Muslims as one homogeneous community with a single command structure. Every move
    of Deoband has been presented and interpreted by the media as various progressive
