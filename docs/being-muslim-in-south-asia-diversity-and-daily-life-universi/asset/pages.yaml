  md: '# The Ismaili Conciliation and Arbitration Boards in India


    At the same time, the CAB system is a thoroughly contemporary expression of these
    traditional values and value. While its precursors—administrative councils and
    tribunals—may be seen to have a fairly modern form, the CABs’ operating principles
    closely align themselves with the tradition used by entities like the International
    Chamber of Commerce and the London Court of International Arbitration, which are
    among the leading bodies for arbitration procedure in the world today.


    Of course, the existence of a tradition is very difficult to prove. The CAB makes
    a claim to be located within a broader Muslim society as well as (p.154) Ismaili
    tradition reaching beach cities. While the extent to which it can be seen as a
    tradition and the extent to which CAB participates in matters that may be disputed,
    it is not insignificant that CAB seeks to ground itself in a tradition, albeit
    using a form that would be familiar to the contemporary lawyer and practitioner
    of alternative dispute resolution.21


    # Negotiation 3: Community Center; Community and State; Ismaili Community and
    Other Communities


    The CAB system is able to negotiate between members of the community inter in
    two respects. On one hand, CAB is able to resolve national or local disputes within
    the community in context of local values and local conditions. That is to say,
    that the CABs in India are able to make terms of settlement (in the case of a
    matrimonial dispute, for example) suited to the conditions of life in India and
    drawing upon local knowledge. However, because of the existence of the ICAB and
    the possibility of appeal, the CAB system also creates a sort of ‘international
    jurisprudence’ that establishes norms across the community worldwide. As the ICAB,
    one would seek settlement and thus includes the perspectives coming from go to
    ICAB—some of these may be by way of appeal, and others due to the international
    nature of the parties. Less than 10 percent of cases from India have international
    level, however, not all cases that are resolved through arbitration. Always, reconciliation
    is the preferred modality. Nonetheless, just like a lower court, or the national
    CAB will be aware of the appeal to the ICAB as a looming prospect and will want
    to ensure (p.155) that its determinations do not seem (to) incongruent withincongruent
    with international norms, though specific details and amounts may depend on local
    conditions. Considering these two facets, it is possible to argue that the CAB
    system negotiates within the community by being permissive of local variety and
    adjustment while at the same time subjecting these in, in a general and broadly
    principled manner, to an international, community-wide framework.'
