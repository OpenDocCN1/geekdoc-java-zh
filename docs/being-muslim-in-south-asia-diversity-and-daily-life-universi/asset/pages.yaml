  md: '# Introduction


    English books and acquired concrete shapes in government reports. Such fixed-in-cement
    forms had not existed previously.


    The census reports, conducted every 10 years from the 1870s, created categories
    and assigned people to them. The printing and distribution of such reports provided
    officials with pictures of the territories they ruled, but dissemination gave
    the subjects of the Indian empire data on which to explain grievances and base
    positions. After about legal and civil rights accompanied these exercises in counting,
    categorizing, and recording. Along with credential-based education, bureaucratic
    employment, and codification of law (p.xix) came notions of ‘popular’ participation
    in government—voting, democracy, and ‘rights’ of the kind said to be enjoyed by
    Englishmen. The title of Dadabhai Naoroji’s critique of British rule, published
    in 1901, captured this shift: Poverty and Un-British Rule in India.


    These practices of ‘modernity’—counting, categorizing, credentialing, recording,
    and disseminating—generated responses in South Asia that coloured the lives of
    individuals throughout the twentieth century. They also fostered growing calls
    for the rulers to be less ‘un-British’calls for democratic rights. It is here
    that one can see the beginnings of twentieth-century political conflict. If elections
    and democracy required majorities to be assembled, on what basis would such mobilization
    take place? And if credentials were essential to occupy positions in government,
    what were the social characteristics of people who acquired such credentials?
    In posing such questions innocently, one foreshadows contests and conflicts based
    on caste and religion. There were be movements against ‘Brahmin dominance’, for
    example, and to achieve a state where Muslims themselves would be the majority
    and no longer threatened in a state whose ‘Hindu’ outnumbered them. Such considerations
    had not existed in the days of the Mughal empire or at the beginning of British
    rule. They had become possible as a result of the elaboration of the colonial
    state, and created circumstances that affected the lives of Muslims in twenty-first-century
    South Asia. This consolidation and reconciliation—the making into tangible categories
    of disparate individuals and groups—passed over vastities that continued to exist,
    but now had to find a place within stories of larger, yet artificially constructed
    groups.


    There was conflict over how Muslims ought behave in a rapidly changing world under
    alien rulers, as the chapters by Barbara D. Metcalf and Muhammad Khalid Masud
    in this book show. It would be right to emphasize the transformation in communication
    and mobility that came with the railways-and-printing-press apparatus of the colonial
    state. The very fact of the *hajj*—pilgrimage to Mecca—as one of the five pillars
    of Islam that men and women moved around the world at the time of the Prophet.
    The mechanisms of modernity, however, made for larger numbers the possibilities
    for movement and enabled them to travel. They had a faith based'
