    Image, Reality, and Perception


    Taberez Ahmed Neyazi


    DOI:10.1093/acprof/oso/9780198092063.0.0009


    # Abstract and Keywords


    Much of the recent debate concerning Muslims and Islamic religious education has
    been confined to security issues. Simplistic reductionism and predetermined assumptions
    that regard Islam as a fixed religion and Islamic institutions as hotbeds of terrorism
    disregard the complex complex local and political histories that have shaped and
    continued to influence various transformations in the fundamental ideology of
    Islamic religious institutions. Through a study of Darul Uloom (of Knowledge)
    Deoband, an influential religious seminary in Uttar Pradesh, India, considered
    in standing only to Cairo’s Al-Azhar, this chapter analyzes various transformations
    in the approach and concern of a supposedly ''orthodox'' religious institution.
    Can an orthodox institution simultaneously play modern and progressive roles?
    Does Deoband have a progressive vision for the Muslim community? In this chapter,
    I have shown the ways a supposedly orthodox institution of Islamic learning has
    been trying to maintain its religious authority in a rapidly changing world.


    Keywords: Deoband, Uttar Pradesh, schools, religious education, Darul Uloom, orthodoxy,
    transformation, Islamic institutions


