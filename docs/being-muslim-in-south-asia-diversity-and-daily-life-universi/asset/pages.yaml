    beliefs and practices make their way in contemporary South Asia is a task that
    we have evaded but one which warrants exploration.


    The different prescriptions offered for Islam in South Asia in the first half
    of the twentieth century, two versions had profound effects. The first was the
    text-based, no-room-for-interpretation, no-place-for-metaphor version of Afghan.
    The other was the political kingdom sought by Muhammad Ali Jinnah which led to
    Pakistan, a sovereign state created South Asia on a road from which there was
    no going back. Beds were made that were to be lain in.


    For the large Muslim population remaining in India, debate over ways to lead a
    good life and how to advance the cause of Muslims and Islam continued into the
    twenty-first century. In Pakistan, there were pressures from the beginning, Nelson
    argues, for the state to support a variety of Islam largely in the spirit of the
    Afghan tradition. The rule of General Zia strengthened this tendency, with funds
    emanating from a sympathetic and oil-rich Saudi Arabia. Debate about ‘what it
    is to be Muslim’: ‘difference’ was to be denied. Nelson’s research concludes that
    rejection of different ways of being Muslim increased with the income of the person
    interviewed. Middle classes appeared to be less on variation than the poor.


    (p.xxv) Nelson’s research into madrasa education in Pakistan presents an opportunity
    for revealing comparisons and contrasts with Taberez Ahmed Neyazi’s study of the
    educational activities of the Darul Uloom organization in Deoband in India. With
    Nelson’s research, Neyazi finds that ‘students from middle-class backgrounds are
    now coming to study in the seminary’, indication of ‘the continued relevance of
    religious education even among the affluent section of Indian Muslim community’.
    But Darul Uloom in Deoband, Neyazi writes, ‘repeatedly shown its progressive stance
    on various social issues’, and it maintains a lively web in four languages: Arabic,
    English, Hindi, and Urdu’. Comparing the Darul Uloom experience of the last 40
    years with developments in Pakistan, Dr Neyazi argues that ‘the radicalization
    of madrasas in Pakistan has little to do with any inner logic of the madrasa system’.
    From this, many religious institutions, even those with long-standing reputations
    for particular views and behaviours, respond to the incentives provided by the
    states in which they are located. In India’s Kerala, the state with two dozen
    members of the state assembly, carries the pictures of five Muslim legislators
    and Mahatma Gandhi on his home place. Gandhi’s picture carries the caption, ‘Father
    of the Nation’.⁹ The incentives and directives in Pakistan led in different directions
    from those.'
