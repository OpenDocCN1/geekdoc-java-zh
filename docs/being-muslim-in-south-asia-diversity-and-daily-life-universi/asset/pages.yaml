    The use of ''religious traditions'' as instruments of the justice system is highly
    controversial and much debated. Some believe that religiously inspired norms are
    unfair and therefore a poor basis for justice. Particular concern is often the
    position of women in sukar. Susan Okan, for example, maintains that many cultural
    minorities are patriarchal so women may be better off without traditional norms
    being part of the calculus of justice.28 On this logic, the CABs would not be
    instruments of justice because they may employ normative frameworks which are
    inimmical to women or other groups.


    **p.(160)** An alternative view suggests that justice must be located within the
    broader context of multicultural communities. On this communitarian perspective,
    denying the possibility of using community norms limits the pursuit of justice.29
    The Supreme Court of the United Kingdom, in the passage cited above, did not seem
    troubled by having strong community-linked elements a part in arbitration (and
    presumably this would apply to conciliation as well), including provisions that
    would require arbitrators to be drawn from a particular religious community. Indeed,
    as we can see, the Supreme Court uses the International Chamber of Commerce to
    endorse arbitration as having the virtue of providing sensitivity to the culture
    of the parties facing a dispute. On this, a key component of the calculus of justice
    would be its cultural contextualization.


    Between the two positions, there is an intermediate option. Ayelet Shachar calls
    for ''transformative accommodation'' that encourages the state on the one hand
    and cultural groups on the other to be responsive to the needs of its citizens
    and constituents.30 The CAB system, seeks to provide cultural content situated
    in the state, without direct recourse to ''religious law'', may be seen to sit
    in this zone of transformative accommodation. In this respect, the CAB structure
    may be viewed as providing a type of community justice sensitive to the demands
    of context (community) on the one hand, and independent and widely shared principles
    of legal property (justice) on the other. Indeed it may be the most challenging
    negotiation that the CAB structure faces, but if it is successful, also its greatest
    promise.


