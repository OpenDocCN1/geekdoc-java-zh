    Muslim Marriage and Women’s Property after the Eelum Wars

    The social wounds of disaster, displacement, and ethnic violence can never be
    healed for those who lost members and loved ones, sometimes compelling widows
    and orphaned to make extremely painful choices.15 However, since the end of the
    LTTE insurgency in 2009, the eastern region of the island has returned to relative
    peace and prosperity for the first time in nearly three decades, stimulated by
    dramatic infrastructural improvements in roads and municipal water supply. With
    a renewed interest in kinship and social structure, and to compare my field work
    notes from the 1970s with contemporary life I started conducting research on (p.96)
    marriage trends in the town of Akkaripattu, 2016.16 The findings that follow are
    preliminary results of a broader study still in progress, selected to highlight
    the specific circumstances of Muslim women. My knowledge of the current situation
    derives, first of all, from a long-term ethnographic engagement with the town
    and its region going back to 1969. This has given me a network of personal acquaintances
    who have grown older along me and whose family histories are a part of my knowledge
    patterns of the younger generation, however, I administered 40 questionnaire surveys
    in couples married after the 2004 tsunami. I also acquired a collection of professionally
    produced wedding videos commissioned by families to commemorate the happy event.
