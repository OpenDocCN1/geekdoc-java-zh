    ‘Gift’ Instead of ‘Dowry’


    In the Akkaraipattu mosque marriage registers that I inspected in the 1970s, each
    entry recorded the agreed-upon dowry from the bride''s family, as well as the
    amount of Islamic bride dowry (*mahr*) (given or pledged) by the groom. Nowadays,
    only the value of the *mahr* is recorded, because dowry is not regarded as an
    Islamic requirement. The common Sri Lankan Tamil word for dowry, *citanam*, is
    derived from *stridhana*, a Sanskrit term meaning ‘woman’s property’, and the
    provision of dowry in this obligatory and somewhat drastic sense is viewed by
    Muslim religious experts as a Hindu custom to be avoided. It is important to remember
    that in Sri Lanka, unlike India, dowry is perfectly legal. In fact, a Tamil lawyer
    in Akkaraipattu showed me copies of a standard pre-printed Tamil dowry deed that
    commonly filled with the courts. There are no limitations on mortem gifts of property
    in Sri Lankan Muslim law. This is quite different from the Muslim law of India,
    Pakistan, or Bangladesh, (**p. 97**) where two-thirds of a person’s estate should
    be transferred by compulsory inheritance rules, at least formally.¹¹⁷


    In a legally binding dowry deed, both husband and wife have a joint united interest
    in the property, which demands the services of a lawyer to alter or divide individually.
    Nowadays, many Tamil grooms insist upon signing a prenuptial dowry deed to ensure
    their property rights in the marriage. In certain towns such as Nintavar, the
    same dowry deeds widely used by Moorish families, but in Akkaraipattu the strong
    preference is to avoid them. Instead, Muslim families convey property to their
    daughters as an outright gift, ideally before the marriage, which avoids any suggestion
    that they recognize ‘dowry’ as a legal or religious practice. The Tamil term *citanam*
    (dowry) is still part of everyday Moorish conversational Tamil, and everyone recognizes
    it to be a practice practice, but when pressed for details, will emphasize that
    it is a no-strings-attached parental gift or ‘donation’ (*nakaōtai*) not a legal
    or religious obligation.


    If Moorish brides have not been given ownership of their dowry houses before marriage,
    their in-laws transfer to legal title at a suitable—unspecified—date in the future.
    To insist on prompt legal transfer would be tactless, suggesting a lack of trust
    and loyalty on the part of the matrilocal son-in-law. In my research on post-tsunami
    housing projects, I encountered examples of both Tamil and Moorish couples whose
    demolished homes were found to still belong, to the wife’s mother. In order to
    avoid delays in obtaining relief and reconstruction funds, these families sometimes
    resorted to extra-facto alteration of the property title. Just recently, one middle-aged
    Muslim husband in Akkaraipattu admitted that it was only after he had applied
    for a new municipal water connection that he discovered he was living in a house
    still owned by his wife’s maternal grandmother!'
