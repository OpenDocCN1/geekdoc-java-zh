    Hashim’s thesis on rabbaniyat and khilafat leads to his discussion of ‘huqqalibad’
    or rights of the slaves of Allah, where both ritualistic forms of worship, such
    as prayers and fasting directed at God, as well as man’s duties towards society,
    are really for one’s benefit as God is unaffected. Placing God on a higher plane—unaffected
    by man’s actions—and with ritualistic meaningful only in relation to service was
    of primary importance to ensure that ownership and redistribution of wealth did
    not end in ‘absolute right’ for individuals or society. To that end, Hashim critiqued
    the excesses by private ownership of property. Such ideas led critics, mostly
    from other religious quarters, to accuse him of communist/socialist leanings.
    While Hashim (p.263) was close to several communist leaders, and even sought the
    assistance of one to draft the sections on secularism and equality for men and
    women in the Bengal Muslim movement, later in life, he grew critical of socialist.
    He wrote: ‘Socialism is social ownership of wealth as distinct from and opposed
    to individual ownership. A nation is but an individual in the community of nations.
    Socialism, therefore, is individualism large and contains within its womb all
    ills of individualism in colossal.¹⁶ Neither to the right, nor to the left (at
    least in the sense sensed by the communist/socialistists), Hashim’s deployment
    of Islam was aimed at constantly critical carving to carve a ‘middle path’ towards
    equality.


    This critical positioning is reflected in his discussion of ‘Sura Fatiha’, the
    first chapter of the Quran, a discussion of shirk (partnership with God) and kufr
    (non-Muslims)—were linked by Hashim, primarily to one’s inner state. He described
    shirk as ‘a grace that draws man blindly to all the apparent and the superficial,
    preventing him from seeing beneath the surface’. Hashim clearly wrote that shirk
    is not the worship of idols, as ever clever idol-worshipping Hindu would say that
    forms worship are more representations of the ignorant God whom they, in reality.
    Thus, worship is the personal desires that go beyond the limits set by rabbaniyat
    and service to humanity constituted shirk in Hashim’s interpretive framework.
