    Either Tamil Muslim societies appear irreducibly different from, or irreducibly
    identical to, the master narrative of South Asian Islam.


    Yet even after the ‘community template’ has passed into Tamil Muslim societies
    through the intervention of individuals and the state, these societies have actually
    perpetuated diversity, though now filtered through the lens offered by the model
    of differential, ranked communities. As discourses about history and identity
    are appropriated and deployed by various actors across and beyond Tamil communities,
    the whole range of factors that interrelate to produce various local inflections
    of these discourses becomes apparent. Micro-studies about how historical conditions,
    social class, the utilization of media, and the state have given to different
    configurations of community in Tamil Muslim societies are much needed. Once diversity
    in these contexts is not perceived as effect of static historical and social formations
    confirming similarly static visions of Muslim societies elsewhere in India, but
    rather as the result of ongoing (p.86) processes, for which various reasons have
    appropriated discourses about social difference, it will be possible to turn to
    the larger question of why Muslims in the Tamil south seem to have so much better
    in terms of social indicators than their co-religions in north India. Shifting
    the gaze, once, from the relative deprivation to the relative success of Muslim
    minorities in India, may provide new ways of ameliorating the disadvantages faced
    by Indian Muslims in other parts of India. It is therefore about time that scholars
    and laymen alike more seriously with the Muslim societies of Tamil Nadu and south
    in general.


