    2. The ICT was a ‘drama’ led by communists and secularists and aimed against Islam
    and JI.

    3. Saudi Arabia would intervene to save JI because JI is a movement for Allah’s
    cause.


    Any reader of the letter would conclude that the JI was the legitimate representative
    of Islam in Bangladesh and the AL was a party that denounced Islam. However, most
    of the AL concluded that the party did not take a stand against Islam and was
    very much of not hurting the religious sentiments of Muslims in Bangladesh.


    JI’s student, the Islamic Chhatrashibir, maintains a Twitter and Facebook account
    entitled Basherkella (Bamboo Castle). Basherkella is named after Titu Mir, leader
    of Bengali resistance to British, killed by the British in 1831. The Basher Kella
    was his fortress of bamboo, which the British found surprisingly difficult to
    overcome. The Facebook page Basherkella generated countrywide protest against
    the government’s indiscriminate shooting of supporters of the JI and Chhatrashibir
    who the street to protect the verdict of capital punishment delivered by the ICT
    one of their leaders Delwar Sayeedee in February 2013. With over 95,000 followers,
    this group uploaded photos, videos, and news of resistance across the country
    clock. Its Twitter account was used to reach the United Nations, international
    organizations, and Muslim leaders of the world.


    Hiz ut-Tahir has been able, through use of the Internet, to extend the reach of
    the ummah to propagate Pan-Islamist thought. The Internet has allowed it to bring
    home to Bangladesh news, images, and videos of its counterparts working in other
    countries, and, at the same time, keep its overseas counterparts informed of developments
    in Bangladesh. Such findings emphasize the power (p.244) of the Internet as a
    transnational space and its capacity to reinforce ideas of the ummah.


