    Belgium. I would argue it is their business interests and professional careers
    that have defined their residence rather than marriage or family origins.


    If diasporic means having a ''collective memory'' of an ''original homeland''
    or considering ''their ancestral homeland as their true, ideal home'' and ''as
    the place to they or their descendants would (or should) eventually return'',94
    then the Kassim Lakha family or (p.137) many of the Khojas from East Africa elude
    that definition. Similarly, Twamley''s Gujarati immigrants in the United Kingdom
    whose parents were from East Africa claimed the identification of their parents
    in India was much weaker compared to East Africa. Revealing, one informant stated
    that when holidaying in India the family was uninterested ''in visiting Gujarat''
    as they had no family links or memories of the region, but all tourists made a
    trip to Taj Mahal.95 As in the case of other Indian diasporic communities like
    the Indo-Fijians,96 there is no recollection and perpetuation of the history from
    India among the East African Khojas or of their family histories in Gujarat. However,
    a longing to return to ''ancestral homeland'' or to one''s roots may sever whatever
    constitutes a diaspora, and ''boundary-maintenance'' in order to preserve ''a
    distinctive identity'' in relation to ''a host society'' may be more applicable
    to certain communities.98 In both the Khojas and other Indian communities in East
    Africa practised endogamy and restricted social interaction with the host community,99
    the Africans. While endogamy may not be practised as strictly by the descendants
    of those who subsequently migrated to the West, it is still the preference among
    many first-generation Khoja migrants in the West. Nevertheless, my observations
    of the younger people in the community in Canada, where many East African Khojas
    migrated from 1970s onwards, reveal that cross-cultural marriages are not uncommon
    regardless of (p.138) the people'' views or opinions. These involve marriages
    with partners from other Indian or Asian communities as well as those from European
    backgrounds.


    Though to return to ancestral Gujarat was not an important feature of the Khoja
    diaspora in East Africa, it did not exclude cultural engagement with Gujarat and
    the Indian subcontinent generally. This engagement occurred through both religious
    and other cultural practices. As mentioned above, the singing of gins in the Gujarati
    language (or other South Asian languages) as jamkathas is a key feature of religious
    practice. Similarly sits (songs in appreciation of the Imam) which are recited
    in Gujarati, Hindi, Sindhi, and Punjabi, combined with traditional Gujarati dances,
    are a regular feature of religious and social occasions in East Africa and in
    the West, though its been fostered through the migratory experience.100 From observation
    over many years in Melbourne, Australia, the performance of dandiya raas (Gujarati
    or Indian dances) is common on auspicious occasions after prayers when members
    of the Khoja community from East Africa and the'
