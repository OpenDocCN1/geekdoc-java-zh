  md: '# Darul Uloom Deoband''s Approach to Social Issues


    Deoband''s views on social issues as well as the Muslim issue. The chapter is
    divided into three parts. First, the chapter outlines the background of the study,
    situating it within the larger debates over madrasa education. Second, the chapter
    highlights the viewpoints of Deoband on various social issues it has confronted
    in recent times. Finally, the chapter analyses recent challenges faced by Deoband
    and how it has responded to them.


    # Background


    Darul Uloom Deoband was established on 30 May 1866. Muhammad Qasim Nanautavi and
    Rashid Ahmad Gangohi³ Since its establishment Deoband has been playing an important
    role in serving the religious and spiritual needs of the Muslim community. The
    system of education created prayer leaders, writers, preachers, and teachers who,
    in turn, could disseminate their knowledge. In its approach to education, Deoband
    not only achieved academic excellence but also built the moral character of the
    students. The religious orientation of Deoband (p.184) is in accordance with Ahl-Sunnah-wol-Jamaat
    (People of the Sunni and Jamaat), which signifies an approach towards life based
    on the practices and teachings of Prophet Muhammad. It also sought guidance and
    interpretations in the matter of religion in accordance with the Quran and Sunnah⁴
    Deoband is an orthodox tradition that strongly believes in theological puritanism.
    It is against shrine-based Sufi Islam and opposes Western ideas and values.


    Darul Uloom Deoband remains the most influential madrasa in South Asia. There
    are an estimated 2,000 madrasas in India to be following Deobandi ideology. Muhammad
    Zaman argues that of all the sectarian orientations in South Asia, that associated
    with Deoband has been intellectually the most vibrant and politically the most
    significant⁵ Deobandi ideology is not only influential in the Indian subcontinent,
    but its graduates are present in south-east Asia, the United Kingdom, and Africa⁶
    According to one estimate, out of Britain''s 1,400 mosques, about 600 are run
    by Deoband-affiliated clerics. In the same time, 17 of the United Kingdom''s 26
    Islamic seminars follow Deoband teachings, which produce about 80 cent of all
    domestically trained Muslim clerics⁷ Such claims might not be exaggerated, as
    Peter Mandaville in his study of Islamic education in Britain has noted that madrasas
    in the United Kingdom ''until very recently followed the traditions and practices
    of Deoband⁸


    (p.185) After 11 September 2001, Deoband came under scrutiny because of its role
    influencing the Taliban. Such perceptions existed because of the training of important
    Taliban leaders like Mullah Omar and Jaluddin Haqqani in the supposedly Deoband-style
    madrasa of Darul Uloom Haqqania located at Akora Khattak in Pakistan''s Khyber
    Pakhtunkhwa (formerly North-West Province NWFP)⁹ This has also affected the image
