    Musashar Hasan


    DOI:10.1093/acprof:oso/9780198092063.003.0011


    # ## Abstract and Keywords


    Against the backdrop of the emergence of nation states, the Islamic concept of
    Ummah, or Muslims'' global brotherhood, may seem to be an imaginary concept since
    Muslims live in various nation states under state-given identities. However, in
    the milieu of increasing transnational activities of Islamists, the Islamic concept
    of Ummah receives renewed attention. By using an array of transnational activities
    and networks such as migration, the Internet, NGOs and scholarly networks, Islamists
    are capable of disrupting national politics. For that purpose, Islamists manipulate
    the meaning of Ummah and pose renewed threats to the state-given identities of
    Muslims and the state itself. The essay takes [sic] the case [sic] relevance of
    Ummah in Bangladesh, a south Asian Muslim-majority country, as a case to understand
    political relevance of Ummah. Where various Islamist parties interpret Ummah politically
    and propagate its narrow interpretation through transnational networks.


    *Keywords: ummah, Bangladesh, transnational, global brotherhood, political parties,
    political Islamist, identity conflict, nation state*


