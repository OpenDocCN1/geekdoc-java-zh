    these communities, but this research has had hardly any impact on the one Muslim
    societies in South Asia as a whole. At best, it has received taken notes, record
    of exceptional cases which cannot be integrated into a general picture based on
    events elsewhere in South Asia. At worst, it has been ignored. Many still believe
