    In the domain of marital choice, two-thirds of the young Moorish couples surveyed
    in 2021 had marriages arranged by their families, either with cross cousins or
    with unrelated parents. However, love marriage is on the rise, and it is increasingly
    approached by Moorish parents who choose to celebrate it like an arranged match,
    including the bestowal of a dowry house. A challenge to the multilocal marriage
    system comes from locally based tawhid clerics who preach an ‘authentic’ type
    of Islamic marriage in which the (p.115) husband provides everything, including
    a house, for his wife. While daughters dream of such a revolutionary shift, a
    few tawhid-minded briderooms may aspire to achieve it, the multilocal dowry system
    continues to provide strong emotional, social, and economic advantages for the
    majority of Muslim women in Sri Lanka.


