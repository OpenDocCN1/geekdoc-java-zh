    # The Hudood Laws in Pakistan


    The Islamization policy introduced a series of laws known as the hudood ordinances,
    governing offences against property, consumption of intoxants, zina (fornina and
    adultery) and qazf (bearing false witness). In Islamic jurisprudence, hudood refers
    to punishments prescribed by the Quran or Sunni. The policy was presented as necessary
    to fulfil one of the fundamental obligations of the Islamic state to create a
    just and equal society. Behind these platitudes, however, the real reason was
    to bolster the regime’s legitimacy among the Pakistani masses, and they were widely
    regarded as a cynical attempt to exploit the common people’s devotion to Islam.'
