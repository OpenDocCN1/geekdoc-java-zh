    Islamists to spread their message. In addition to party websites, social networking
    sites like Facebook and Twitter, increasingly used to proclaim the importance
    of Islam in Bangladesh. They are used to connect Bangladeshi Islamists with foreign
    Islamists to emphasize the importance and strength of pan-Islam.


    The home page of Hizb ut-Tahrir Bangladesh in 2009 announced its Islamic aim by
    stating, ‘O Muslims! Hizb ut-Tahrir calls upon you to reject the current govt
    system and fulfill the shari’ah obligation of establishing the Khalifah.’ On its
    homepage, the site hosted a large image of a party procession in the streets of
    Dhaka. The writing on a banner held by activists was hard to overlook. It said
