    It seems possible for an individual to fail to live up to what we effectively
    demand of him, and yet be relatively untouched by this failure; insulated by his
    alienation, protected by identity beliefs of his own, he feels that he is a full-fledged
    human being, and that we are the ones who are not quite human. He bears a stigma
    but does not seem to be impressed or repentant about doing so.2


    Mehboob Ali Zia, an 87-year-old resident of the walled city, was a freedom fighter
    and later an active member of the Delhi Congress Committee. His narrative of the
    partition was an attempt at excising the guilt of ascribed by others and many
    Muslims. The aggression was vivid as he attempted to recreate history:


    This is all propaganda. That is that even Jinnah sahib was not solely responsible.
    Maulana Azad had put forth a plan which envisaged India as a loose federation....
    Maulana Azad has referred to this in his book in Urdu, Taseem-e-Hindustan (p.208)
    book has been published in Pakistan, therefore the details are twisted. It remained
    a futile exercise because Nehru, in his speech, asserted that everything would
    be decided on headcount. Jinnah sahib was very stubborn person, and Nehru’s speech
    instigated him to declare that he would settle for nothing short of a separate
    Pakistan. Maulana Azad’s scheme became implemented, and I had confronted Jinnah
    sahib many times. The League people attacked Maulana Azad’s meeting. In retaliation
    we also went and disturbed one of the meetings of Jinnah sahib. They went ahead
    and founded Pakistan.... I am not worried about Pakistan. My concern is India
    and we are comfortable here.


    Feroze Khan, a dhabha owner who doubles up as a faith healer, relied upon his
    Deo identity and the community’s nationalist credentials to credit the stigma.
    ‘If Jinnah had up such theory, it was a mistake,’ he conceded. This did not deter
    the Muslim leaders of the Meos, ‘Maulana Madani, Maulana Azad, and our late leader
    Chaudhary Yasin’, from confronting the two-nation theory, Khan overnered. On a
    similar plane, Mohammad Israel, a genius at the Madrasa Abdul Mannan, Shahi Majid,
    Vasant Bihar retorted: Those who wanted Pakistan, had a vested interest, they
    shifted. Why should the Muslims who stayed back and have always remained loyal
    to their country be blamed?


    The stigma of partition translated into Muslim loyalty and patriotism. Islamic
    identity, the Hindutu argues, is transnational and extraterritorial. Maulana Asrar
    Haque, a prominent ulema, and founder of the All India Talimul Muslim Foundation
    contested the can: ‘Muslims are not tenants in this country. They are the owners.
    They share this status with other'
