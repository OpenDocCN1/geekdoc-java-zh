    of the family''s identity is the status it has gained over several generations
    through its service and investment in the institutions of the Khoja Ismaili community.
    Another is the joint family businesses, which were for the bedrock of the family''s
    social and economic status, and significant source of shared memories and experiences.
    (p.136) Thus, during a casual conversation with my cousin Azim in California,
    he suddenly inquired whether I recalled the remoteness and complete isolation
    of our cotton ginneries he had also visited in his childhood. I was surprised
    it had such an enduring impact on his recollection of the past, as it had on mine.
    Similarly, on my regular visits to Vancouver to see my mother and other members
    of the extended family who now reside in Canada, it is not uncommon to reminisce
    fondly about the holidays we spent at our Oceanic Hotel in Mombasa on the coast
    of Kenya. A shared history has proven a powerful source in uniting relatives across
    different continents.


    While memory, kinship bonds, and shared history of life in East Africa exerts
    a strong influence in binding various members of the Kassim Lakha family, the
    same could not be made where ties to Gujarat or India are concerned. When refer
    to to ‘bakar home’ are made in casual conversation with other people, these normally
    refer to East Africa. It is a relationship with Gujarati and India that is both
    but it is more distant and complex. Very few Khojas from East Africa I knew had
    property or family members in India. Those who did, or still do, may occasionally
    visit them ‘home’ is now wherever they currently reside, be it Canada, United
    Kingdom, East Africa, or elsewhere. This does not completely exclude ties with
    India. Two of my cousins from the Kassim Lakha family have married women from
    India. My cousin Shamsh married a Parisi woman from Mumbai who had converted to
    Ismaili and Zul was married to a Khoja Ismaili lady also from Mumbai. Neither
    of the two cousins settled in India nor have their children are spread across
    Canada, the United States, and Europe. And Shamsh lived with his family for many
    years in Pakistan, now lives in'
