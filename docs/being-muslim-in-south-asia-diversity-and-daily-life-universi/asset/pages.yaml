  md: '# Being Muslim in South Asia: Diversity and Daily Life


    Print publication date: 2014

    Print ISBN-13: 9780198092063

    Published to Oxford Scholarship Online: June 2014

    DOI: 10.1093/acprof/oso/9780198092063.001.0001


    # (p.369) About the Editors and Contributors


    Irfan Ahmad is Associate Professor of Political Anthropology, Institute for Religion
    and Critical Enquiry, Faculty of Theology and Philosophy, Australian Catholic
    University, Melbourne.


    Khaled Ahmed is Director of the South Asia Free Media Association (SAFMA). He
    previously held the posts of consulting editor of the Daily Times, Lahore, and
    of The Friday Times weekly, Lahore.


    Tanveer Fazal is Associate Professor at the Centre for the Study of Social Systems,
    School of Social Sciences, Jawaharlal University, New Delhi.


    Mubasher Hasan is a doctoral candidate at the School of Government and International
    Relations, Griffith Business School, Brisbane, Australia.


    Riaz Hasan is Visiting Professor at the Institute of Asian Studies, National University
    of Singapore, and Emeritus Professor of Sociology, Flinders University, Adelaide,
    Australia.


    Samia Huq is Assistant Professor at the Department of Economics and Social Science
    at BRAC University, Dhaka.


    (p.370) Arif A. Jamal is Assistant Professor of Law at the National University
    of Singapore.


    Robin Jeffrey is Visiting Professor at the Institute of Asian Studies, National
    University of Singapore.


    Salim Lakhm is Honorary Senior Fellow in the School of Social and Political Sciences
    at the University of Melbourne.


    Muhammad Khalid Masud was former Chairman of the Council of Islamic Ideology,
    Islamabad, and Academic Director of ISIM, Leiden, the Netherlands.


    Dennis B. McGilray is Professor at the Department of Anthropology at the University
    of Colorado at Boulder.'
