    very soon joining the Changsha''s discussion groups, Nafisa grew disenchanted
    with her ability to pose cosmic questions. She felt so strongly that the Changsha
    did not offer her the platform she needed to cultivate personal piety, simultaneously
    taking piety to the outer world. Neither the Islamic world, nor the secular one
    offered the stage she needed to feel and act as a Bangladeshi Muslim. Thus, she
    began her platform which brought together young, educated men and women from Dhaka,
    to learn about Islam and that learning to bring about change in their communities.


