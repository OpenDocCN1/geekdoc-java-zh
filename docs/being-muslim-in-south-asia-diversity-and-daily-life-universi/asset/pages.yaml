  md: '# The Ismaili Conciliation and Arbitration Boards in India


    In addition to inter negotiations, the CAB system negotiates a relationship between
    the Ismaili community and the Indian state. Simply put, the CAB system gives the
    community an institutionalized form of dispute resolution and a ‘judicial body’
    which can interact with the state, and particularly with the courts.^22 The recognition
    provided by Indian law enables the community to have its institutional work recognized
    within the formal legal system, least in terms of divorce decrees. Of course,
    this is not unique for the Ismailis as it applies to other Muslim communities
    as well, and this leads to the third aspect of community negotiation that the
    CAB system may provide.


    The CAB structure enables the community to locate its legal heritage in institutions
    of its own creation. This gives the Ismailis an Islamic forum, operating in an
    ‘Ismaili way’ under the authority of the Ismaili Imam, through to seek dispute
    resolution. Without such a structure, the Ismailis who want to avail themselves
    of community-based dispute resolution would be in likelihood to rely upon other
    general Muslim or Jafari Shafi organizations, which Ismailis lacking Ismaili-specific
    institutional structures have done in the past.


    The type of negotiation discussed here also fits into a larger dynamic in India
    about the place of ‘communal law’, and Muslim law particularly, within the national
    legal system. Part of this is the debate about the very existence in India of
    personal law (**p.156**) laws, which have a long-established but uncontroversial
    history.^23 At this level, the existence of the CABAs qua institutions of a particular
    community’s world would run counter to the long-running efforts to find a uniform,
    secular, personal law for all of India. On the other hand, the processes of codification
    of Muslim personal law (Shariat) Application Act of 1937 had the effect, as Sen
    noted, of ‘homogenizing Islamic law by wiping out the personal laws of ‘minorities9minorities
    within Indian Islam.’^24 The CAB structure revives this plurality by providing
    an Ismaili view of Muslim personal law. Thus, the CABs play into the unsettled
    political and legal debate in India between, to put it crudely, the legal recourse
    of religious plurality and multiculturalism on the one hand versus uniformity
    and equality—especially gender equality—on the other.


    In this milieu, what perspectives might the CAB approach offer both for Muslims
    in India as well as for the Indian legal system more broadly?


    Secularism in India is of course contested both in principle and form. That said,
    the widely quoted Indian form of ‘secularism’, so-called ‘Nehruvian secularism’,
    has been associated with an approach that is distinct from the French or Turkish
    models of laïcité that seeks to cleanse religion from the public sphere and assertively
    advance a secular state. Instead of this, the Nehruvian model is usually characterized
    as being permissive of religious expression in the public'
