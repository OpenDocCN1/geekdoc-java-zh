    small-scale trade and various activities, living mostly in the southern inland
    of Tamil Nadu, and the Lebbais, are, in many respects considered similar to the
    Rāvattars, though they are more strongly identified with the northern inland and
    some authors accept that there are Shafi’i Lebbais.


