    # Contemporary Moorish Marital Choice


    East coast Moors have the same Dravidian-type kinship system that is found through
    Sri Lanka, as well as in south (**p. 102**). India. Like the Tamils and Sinhalese,
    they classify their parallel cousins (father’s brothers’ children and mother’s
    sisters’ children) as siblings, and regard their cross cousins (father’s sisters’
    children and mother’s brothers’ children) as permissible—sometimes preferred—marriage
    partners. However, marriage between a man and his elder sister’s daughter (eZD),
    common in Tamil Nadu, is not found in Sri Lanka, and especially not in the east
    where it would violate matrilineinear exogamy rules. In 1971 17 per cent of Muslim
    marriages in Akaraiipattu occurred between first cousins (MBD and FZD), with an


