    Second, the contested relationship between nationality and ummah challenges modern
    politics and leads to demands for the establishment of a ‘traditional Islamic
    system’. For example, the Hiz ut-ahrir rejects democracy and demands establishment
    of a caliphate. In Muslim history, after Prophet Muhammad’s death, Muslim territory
    expanded under the first four caliphs, considered ‘right rightly’ because they
    knew Muhammad personally and were companions (sahaba) of the Prophet. Thus, they
    knew the Sunnah as directly as possible. The period of the rightly caliphs ended
    in 661 CE with the assassination of Ali.µ9Therefore, various Muslim dynasties,
    the Umayads (661-7750), the Abbasids (750-1256), and the Ottomans (1299-1924),
    expanded Muslim rule into Africa, Europe, and Asia. During this period the caliphate
    system was installed. Sadiq argues that ‘the inception of the Caliphate system
    through the Umayads in the seventh century inaugurated a new civilization and
    for a dynamic, forward looking culture which was destined to create a composite,
    corporate human identity, viz., the Islamic identity.¶0 Langman argues that this
    was a golden age for Islam. Abolition of the Ottoman caliphate in 1924 by Kemal
    Atatürk (p.247) formally marked the end of this classical model. Sadiq argues
    that after the fall of the Ottomans, the classic form of Islam, which provided
