    of the accused before a competent court, or evidence of four pious adult Muslim
    witnesses. Non-Muslim males may be witnesses only when the accused is a non-Muslim.
    Such evidentiary rules clearly discriminate against women and non-Muslims.


    Under the laws that existed before the introduction of the hudd laws, in the case
    of adulterous sex between a married woman and man; it carried a punishment of
    five (p.48) years'' imprisonment, or a fine, or both. The crime of adultery was
    bailable. Complaints be made only by the husband of a woman or, in his absence,
    by someone who had care of such a woman on her behalf. Women could not be punished
    and, if the complainant chose to drop the charges, criminal proceedings against
    the accused were stopped.


    After the hudd laws were implemented, the situation changed fundamentally. These
    laws converted zina from an offence against an individual to one against the state.
    Anyone can make a complaint against anybody else, and the police are authorized
    to initiate a criminal case. The accused individuals are detained guilty until
    proven innocent, and both the woman and her male partner are liable to punishment.


    In a society like Pakistan, with its deeply embedded patriarchal beliefs and attitudes,
    the hudd laws in general and the law pertaining to zina particular have been widely
    and recklessly abused. In particular, they have become an instrument of oppression
    against women. As long as the husband could register the case and only the male
    accused could be punished for adultery, husbands were reluctant to prosecute in
    order to save or protect their family honour. The hudd laws have become a tool
