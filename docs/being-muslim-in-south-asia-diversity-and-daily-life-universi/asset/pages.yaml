    # CAB System and its Negotiations


    One of the salient issues facing Muslims in their different contexts is how to
    relate their traditions to the exigencies (p.152) and demands of modernity. For
    Ismaili communities in India and elsewhere, the CAB system forms one aspect of
    their encounter with modernity and one means by which the community’s traditions
    engage with modern contexts. Specifically, the CAB system may be seen to negotiate
    a series of key relationships or tensions that confront the community as it seeks
    to relate its heritage to the conditions of modernity. The remainder of this chapter
    elaborates upon these negotiations and considers whether, as a result, the CAB
    system may be regarded as a form of community justice.'
