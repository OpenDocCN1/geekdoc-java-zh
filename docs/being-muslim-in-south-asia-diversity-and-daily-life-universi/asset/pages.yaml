    Hassan''s research on religious consciousness in Pakistan points to the importance
    of heavy state investment during the 10-year rule of General Zia ul-Haq. This
    was the ''Islamisation programme'', which claimed to manifest a universal Islamic
    vision, but in reality was based on a narrow interpretation of Islamic theology
    and law. The number of students studying in madrasas quadrupled to over 550,000
    in about 20 years. State encouragement greatly expanded the cadre of teachers
    exposing a single, narrow version of the faith, a (p.xxx) version in keeping with
    the doctrines of Afghan contests with Sayyid Ahmad Khan Professor Masood introduces
    in Chapter 1. Using the results of surveys conducted at the beginning of the twenty-first
    century, Professor Hassan outlines the strength of what he terms ''Salafist''
    beliefs among large sections of the population of Pakistan. ''Salafism'', as he
    argues, involves an attitude towards Islamic texts that is literalist, anti-rational,
    and anti-interpretive.


    In his study of Pakistan, Dr Nelson elects on these elements about state investment
    in education. He argues that the use of Islam to counter divisive characteristics
    among the people of a ''Muslim state in South Asia'' predicted General Zia ul-Haq
    by a generation. As early as the 1940s, proponents of Pakistan aimed to paper
    over differences of language, geography, and local contest with the great cost
    of a single faith, now about to rise proudly after a century of decline and humiliation.
    This new state was, in the eyes of its proponents, to Pakistan. The research of
    Nelson and his associates reveals how behaviour and religious practice spread
    through society. Although fewer 2 per of Pakistani live in a madrasa as full-time
    students, probably 70 per cent of children study part-time in madrasas. Well-funded
    madrasas exposing common doctrines have given wide currency to those doctrines
    across Pakistan. Dr Nelson''s research suggests that a government-school education
    does not necessarily lead to a more accepting attitude towards diversity in Islam
    in Pakistan.


    One facet of this book tells a story of varied Asian versions of Islam colliding
    with the colonial state in the nineteenth century. In this sense, the book is
    deficient; it lacks chapters dealing with the vivid threads of Islam—the Sufi
    and the Shia (whom we examine experience of Ismailis by Arif A. Jamal and Salim
