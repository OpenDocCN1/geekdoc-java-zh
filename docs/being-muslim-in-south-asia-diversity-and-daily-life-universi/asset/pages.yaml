    # The Challenges of Diversity


    ‘Casting’ Muslim Communities in South India”


    Torsten Tschschacher


    DOI:10.1093/acjpr:oso/9780198092063.003.0004


    # Abstract and Keywords


    The southernmost regions of India present an almost paradoxical situation as far
    as Muslims are considered insignificant. While the impact of Islam and Muslims
    on the region is often considered insignificant Muslim societies in South India
    exhibit historical, economic, religious, and linguistic diversity far beyond encountered
    in regions more centrally with Islam in South Asia such as the Punjab and the
    Gangetic Plains or Bengal. From the colonial period administrators, historians,
    and anthropologists have tried to come to terms with this complexity by reducing
    Indian Muslims to a set of bounded and demarcated ‘communities’ supposedly sharing
    common language, origins, economic pursuits, and religious particularities. This
    chapter challenges and contextualizes established images of Muslim societies in
    south India. It endeavours to understand Muslim diversity in the region as a dynamic
    and complex interplay of diverse processes.


    Keywords: south India, definitions of community, diversity among Muslims, community
    formation


