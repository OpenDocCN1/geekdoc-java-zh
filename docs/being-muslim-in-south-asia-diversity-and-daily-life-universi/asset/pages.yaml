  md: '# The Ismaili Conciliation and Arbitration Boards in India


    ![](img/f11134d17187174692cf1f86238ebe46_142_0.png)


    # The Ismaili Conciliation and Arbitration Boards in India


    A Model of Community Justice?


    Arif A. Jamal


    DOI:10.1093/acprof/oso/9780198092063.003.007


    # Abstract and Keywords


    This chapter describes and analyzes the Ismaili Conciliation and Arbitration Boards
    (CABs) in India as a variety of community justice. The chapter describes the history,
    evolution, and structure of the CABs, both in conceptual as well as practical
    terms, and explains the international nature of the CABs and their structure of
    various national boards and an International Board. It analyzes the CABs as institutions
    that negotiate a variety of relationships. These include the relationships of
    state law and catic law; of tradition and modernity; of the community within itself
    as well the relationship between the community and the state, and the community
    and other communities; and, finally, the interaction of plurality and authority.
    The chapter argues that the CABs represent a response—which might be characterized
    as a solution—to the challenge of developing a form of community justice for a
    transnational community grounded in the faiths of Islam.


    Keywords: Ismaili, conciliation, arbitration, diaspora, community justice, transnational
    community


