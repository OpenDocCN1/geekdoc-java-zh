    # # Imagining Religion


    Portraits of Islamic Consciousness in Pakistan


    Riaz Hassan


    DOI: 10.1093/acprof:oso/9780198092063.003.003


    # ## Abstract and Keywords


    Religious consciousness is a symbolic universe that gives expressions to deeply
    held religious beliefs. A product of interpretative communities of the past and
    present, this universe provides the convictions and ideals that as primary texts
    for indexing social reality. Using empirical data on how Pakistani Muslims imagine
    Islam this chapter will provide portraits of religious consciousness. The empirical
    evidence demonstrates a conflict of conscience among Pakistani Muslims. It shows
    a dominant mindset characterized by self-sufficiency of Islamic texts and an attitude
    towards them is literalist, anti-rational and anti-interpretive with a pervasive
    sense of common humanity, and a genuine concern for the welfare of the underprivileged.
    The chapter explores the development of this mindset and it compensates for the
    feelings of alienation, powerlessness, economic and technological underdeveloped
    and concludes with observations on its implications for the current dilemmas facing
    Pakistan and other Muslim countries.


    *Keywords:* religious belief, Pakistan, co-existence, literal interpretation,
    alienation, conflicts of conscience


    Islam was a pivotal factor in mobilizing the support of South Asian Muslims for
    the creation of Pakistan in 1947. But its role in shaping the social, cultural,
    and political destiny of the country has been mired in conflict, contradictions,
    and paradoxes. Muslim leaders spearheaded the struggle for Pakistan and'
