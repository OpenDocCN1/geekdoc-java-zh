  md: '# Being Muslim’ in Contemporary India


    ![](img/f11134d17187174692cf1f86238ebe46_195_0.png)


    # ‘Being Muslim’ in Contemporary India


    Nation, Identity, and Rights


    Tanveer Fazal


    DOI:10.1093/acprof:oso/9780198092063.003.010


    # Abstract and Keywords


    This chapter endeavours to capture contemporary identity consciousness of the
    Muslim citizens of India, incorporating its various dimensions—cultural, instrumental,
    spiritual, and political—on the basis of narratives recorded in the city of Delhi.
    Muslim narratives recorded here refuse to reread a singular trajectory; and do
    so underscore the imperative to talk in terms of a plurality of Muslim subjectivities.
    The Muslems of contemporary India unequivocally renounce the idea of a Muslim
    nation in their endeavour to confront the stigma of Partition. On a similar note,
    the inventiveness of Muslim religio-political consciousness in dissociating from
    the theological bipolarity of dar-ul-Islam and dar-ul-har while adopting the idea
    of dar-ul-aman (a place of peace where Muslims are not constrained in religious
    practice) is noteworthy. However, the phantasmagoria of unity, uniformity and
    cultural homogeneity imagined the narratives is punctured in varying degrees by
    caste, gender or regional constraints.


    Keywords: identity, Muslims in India, Delhi, ummah, ideological, plural identities,
    cultural heterogeneity


    This chapter endeavours to capture contemporary identity consciousness of the
    Muslim citizens of India, incorporating its various dimensions—cultural, instrumental,
    spiritual, and political—on the basis of narratives recorded in the city of Delhi.
    Before we attempt to construct abstract models based on these articulations, it
    is important to recognize that sample truly'
