    # (p.xi) Acknowledgements


    This book originated from a regular Friday-morning meeting in the Institute of
    South Asian Studies (ISAS) at the National University of Singapore. The chairman
    of ISAS, Gopinath Pillai, a distinguished Singaporean businessman and diplomat,
    observed that ''we should know more about Muslim life in South Asia''. One thing
    led to another, as things often do at ISAS, and an international workshop took
    place, queries went to scholars around the world, and two years later, this book
    is the result.


    We thank Mr Pillai for the initial impetus and support, and we are particularly
    grateful to the Director of ISAS, Professor Tan Tai Yong, an outstanding historian
    of Punjab and Modern South Asia, for his willingness to back the project.


    The staff of ISAS provided the customary logistic support that makes working such
    a privilege. Among our colleagues, whom of many were wise and sympathetic advisers,
    we have especially to thank Prat Singh for her help in the preparation and grooming
    of the manuscript.


    One of the advantages of working at the National University of Singapore is ready
    access to an excellent cartography unit, and we thank the remarkable Mrs Lee Li
    Kheng for providing new maps for the book.


    (p.xii) Finally, we thank the contributors for their patience and diligence. We
    hope they find the book as a whole is greater than the sum of its parts and that
    it goes some way fostering a keener understanding of what it is to be Muslim in
    South Asia.


    Robin Jeffrey and Ronojoy Sen

    Melbourne and Singapore'
