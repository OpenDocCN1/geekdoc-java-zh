  md: '# Introduction


    In focusing on the diversity of Muslim experiences, we face a challenge: some
    Muslims who hold that diversity is wrong, where it exists it should be eliminated,
    and that to emphasize diversity represents a malicious intent to divide believers.
    Such perspectives are not new. European Christianity provides a saga of attempts
    to impose its version of a single truth on others. For the scholars researched
    in this book, diversity is undeniable, and it is a diversity that exists under
    the broad mantle of the Quran.


    Diversity should not be surprising. Islam reached South Asia at different times,
    through different means, propagated by different champions, and attracted different
    adherents. In discussions of Islam in South Asia, it is sometimes forgotten that
    the faith reached India within a few years of Prophet Muhammad''s death. This
    was through traders of Arabia who had regularly sailing to Kerala from the first
    century of the Common Era (CE). Jews and Christians were among the early traders,
    so it was predictable that members of the new and dominant faith of Arabia—Islam—would
    arrive and settle in Malabar.¹ They found that what is known as the Mappila community
    of Kerala 200 years before armies from Afghanistan brought Islam to the plains
    of Punjab and northern India. Islam came to Sindh in today''s Pakistan in 711
    CE, the same time it arrived in Spain.


    It is important to remember that before industrialism was a place of empires and
    conquests. Notions of ‘nations’ are modern. (p.500) from the time of Mahmud Ghazi
    (971-1030), whose kingdom covered much of the north of the subcontinent and who
    was a near-contemporary of England’s William the Conqueror (1028-1087), India
    experienced a succession of kingdoms and would be empires, ruled by Muslims, so
    by Hindus. The most successful of these enterprises in extending rule over agrarian
    societies was the Mughal empire, initial base was carved out by Bab (1483-1530),
    a contemporary of Henry VIII (1491-1547), at the beginning of the sixteenth century.²
    This book is not the place to examine the role of religion in pre-modern empires,
    though the ferocious and legendary policies of religion in Tudor England are worth
    recalling when we see perspective on Mughal times. Unlike Henry VIII, Mughal rulers
    made no attempt to dictate the religion of their subjects.³


    The creeping dominance of the English East India Company, and the establishment
    of a British empire in India, brought a state apparatus whose legacies haunt South
    Asia today. The colonial state counted, measured, categorized, and disseminated
    relentlessly. In doing so, it often stuffed its subjects into bureaucratic boxes
    of the colonial state’s making, boxes that did not necessarily accord with the
    reality experienced by its subjects. Faced with new rules rewards and punishments,
    people adapted and used the rules to further their own interests. Categories like
    ‘Hinduism’ were written about'
