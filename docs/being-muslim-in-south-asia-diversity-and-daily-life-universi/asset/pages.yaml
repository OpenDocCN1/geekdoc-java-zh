    A theory of transnationalism is based on the idea that control by individual states
    over cross-border activities of people is lessening. According to Mandaville,
    ‘transnational’ refers to ‘a wider range of social formations and transactions
    which are structured across the border and spaces of nations which do not necessarily
    enter a (p.231) primary role for sovereign governments¹16 Al-Rasheed argues that
    ‘transnational’ is often used interchangeably with ‘globalization’. She asserts
    that while globalization is a process from below¹17 the concept of transnationalism
    embodies activities and process from below. In this, an ordinary person, through
    various transnational flows, challenges the capacity of states to behave in ways
    consistent with traditional, state-centric, realist'' views. Thus, it is fair
    to argue that transnationalism focuses on non-state actors and entities operating
    the borders of states. Rudolph describes the transnational process: it is a self-conscious
    construction of networks of knowledge and action by decent, local actors that
    cross the boundaries of space as though they were not there, and of heterogeneous
    networks, differentiated from each other in terms of specialization: there is
    not a single network, but many, fulfilling a different function.¹18


    The point I want to make is that transnational processes combine various networks
    that initiate people-to-people contact. For example, networks between diasporas
    and migrants, various cross-border social movements, and the emergence of online
    forums can undermine the control of a state over its territory. Thus, transnational
    activities shape local politics.


