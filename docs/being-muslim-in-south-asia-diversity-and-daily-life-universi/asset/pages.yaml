    became political leaders of the new country failed to promote an inclusive Pakistani
    nationalism that would have accommodated the divisive forces of ethnic and cultural
    diversity of the new country. Instead, they positively discouraged evolution of
    such nationalism and fostered a nationalism based on the assumption that all Pakistani
    Muslims were a ready nation rather than a potential nation and exerted different
    ethnic groups to subordinate all aspects of their ethnic and cultural identities
    to the nationalism (p.43) rooted in Islam. It was assumed that Pakistani nationalism
    and ethnic and regional identities were mutually incompatible. Paradoxically,
    they could not agree on the status of Islam in the country’s constitution.


    The political consequences of this policy have been horrendous. The country has
    endured a bloody war of secession over Bangladesh. While religious piety, manifested
    in personal devotion and religious practice, has vastly increased among Pakistani
    masses, institutional and political roles of Islam have become a focus of heated
    divisive debate in the country. The evidence also suggests that religious institutions
    and leaders suffer from a trust deficit in the public mind and religious parties
    have rarely reached more than 5 cent of votes in the national elections. Perhaps
    the greatest irony is that despite increasing devotional piety of Pakistan and
    increasing public roles of religious institutions such as sharia courts and sharia
    laws, Islam has not proven to be the glue for nation unity. On the contrary, it
    has become a source of religious and sectarian conflicts and insurgencies that
    are fracturing the social, cultural and political fabric of society, making Pakistan
    one of the most violent and dangerous countries in the world.


    This chapter seeks to undertake an analysis of these trends by focusing on the
    nature of religious consciousness. The analysis will be based on empirical data
    on how Pakistani Muslims imagine Islam. Religious consciousness in this chapter
    refers to a symbolic universe that gives expression to deeply religious beliefs.
    In modern discourses it frequently described descriptively and analytically to
    explain the nature of Muslim religion and the character of Islamic collective
    movements. A product of interpretative commentaries of the past and present religious
    consciousness provides the convictions and ideals that as primary texts for indexing
    reality.


