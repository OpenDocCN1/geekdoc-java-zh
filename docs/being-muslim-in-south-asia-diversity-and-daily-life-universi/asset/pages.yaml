    impressed by English culture and educational institutions. He launched a journal
    of moral reform (Tahdib-al-Akhlaq) in 1870 in which he developed a modern style
    of writing in plain and simple Urdu rather than the ornate style of the time.
    Consequently, his discourses on issues in Muslim society became accessible to
    an ordinary person. He founded the Muhammad Anglo-Oriental College of Hindus in
    1875, his first Muslim university, intended to educate a new class of modern Indian
    Muslim gentlemen. His services in this respect are often compared with Raja Mohan
    Roy who is regarded founder of modernity among the Hindus.


    Syed responded to almost all challenges of modernity and sought reforms in education,
    religious thought theology and jurisprudence, historiography, political thought,
    language, and literature. He believed that religious thought in general faced
    epistemological crises. It was especially true about Muslim thinking because Islam
    was not an epistemological framework that defined knowledge and controlled intellectual
    process. He called for new theology to respond to the challenges of science, stressed
    natural and plain language for better communication, and insisted on loyalty to
    the British rather than the Ottomans.


