  md: '# Being Muslim'' in Contemporary India


    (p.205) Akbar-e-Nao, Wahdat-e-Nau, Maah-e-Noor, and so on fill up an otherwise
    skewed public sphere. Non-governmental organizations (NGOs) instituted by Muslims
    and driven towards addressing their development concerns relating to education,
    health, legal literacy, and security make their presence in the realm of city''s
    civil society.


    Muslim subjectivities captured during the course of these interviews are however
    not localized. They transgress the boundaries of time and geography drawing in
    collective memory and reflecting on contemporary events. Most interviews, barring
    a few later ones, were conducted within a couple of years after the inter-communal
    violence of 2002 in Gujarat and more than a decade after the demolition of the
    Babri mosque. The impact of the bombing of the Twin Towers at New York on 11 September
    2001, and the subsequent ''Islamophobia'' departures in Muslim identities. The
    indelible imprint of these events can be clearly felt in several narratives.


    Attiq Siddiqui, the editor of an Urdu daily, felt that over the years, the secular
    state had failed to live up to the expectations it had initially generated among
    Muslims. His belief in secular politics was shattered when the shylangas of the
    Ram temple was promoted:


    +   For 40 years, I was an active member of the Congress; people in the area still
    know me as a Congressman. When Rajiv Gandhi allowed the shylangas of the Ram temple
    at Ayodhya, I was sitting at the Congress office in Dariban Kalan. It is a Hindu-dominated
    area, and I was sitting with other Congress leaders of the area. Incidentally,
    I was the only Muslim there making a fuss over Babri Masjid. They should take
    it to some other place and leave the plot for the Ram temple.


    A spate of communal violence involving Hindus and Muslims led many in the community
    to express scepticism over the constitutional guarantee of equal rights to all
    citizens irrespective of their religious persuasion. The equality was rarely translated
    into a substantive one, they felt. Mushtaq Siddiqui, a resident of old Delhi,
    saw the violence against Muslims as a glaring example of persistent inequities
    that Muslims suffered:


    > (p.206) What equal rights are you talking of? Agreed that the 1947 riots was
    an outburst in which both the communities participated, and also suffered. After
    1947, there have been so many cases of communal violence against us: Jabalpur,
    Ahmedabad, even Delhi. Once this Babri Masjid issue has come up, there have been
    numerous incidents of violence against the Muslims. Yet you say that Muslims are
    considered equal in this country?'
