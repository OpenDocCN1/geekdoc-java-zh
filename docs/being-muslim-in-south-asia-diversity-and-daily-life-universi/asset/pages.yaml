  md: '# Introduction


    Tanweer Fazal elaborates on this theme of diverse influences, interpretations,
    and practices. Surveys of Muslim opinion in India suggest, he argues, that Indian
    Muslims suffer from ‘persistent stigmatization’ to that they respond with ‘aggressiveness’,
    even brazenness, rather than meekness’. He also notes the class and status divisions
    among Muslims in India, which ‘challenges the myth of egalitarianism and lays
    stress on caste as the constitutive unit of Muslim structure’. He makes the point
    that ‘formulations of Muslim-ness, ...though drawn from a common repertoire of
    symbols, are ascribed multiple meanings’. His research suggests that ideas about
    what it is to be Muslim in the twenty-first century are one to contest and debate.


    (p.xxvi) The experience of Muslims in what was once eastern Bengal—then East Pakistan
    and today Bangladesh—the choices forced upon people in a ‘modern’ world of bureaucratic
    governments and nation states. Samia Hu and Mubashar Hasan analyse the attempts
