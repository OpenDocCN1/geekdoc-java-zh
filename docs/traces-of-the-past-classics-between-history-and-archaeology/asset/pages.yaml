    have noted above, policed by the two dominant modes of giving meaning to the past,
    namely, reading (about) it and seeing it. Questions about why I discuss Herodotus
    and Thucydides or why I treat comedy and not tragedy can only be answered in negative
    terms. I cannot claim full coverage of the topic at hand, nor do I insist that
    the texts I discuss in the following chapters are exemplary. The question of my
    choice of texts—a question rightly raised by an anonymous reader—speaks both to
    the limits of coverage as an literary study and to the capaciousness of a topic
    that extends beyond a single author, genre, or period. On the positive side, the
    canonical status of the discussed here is partly a consequence of their own perseverance
    through time; in this respect, they exemplify the importance of preservation as
    a category of analysis. I include both literary (poetic) and historical (prose)
    texts, moreover, in order to argue that as history mediates between the fictional
    and the empirical, it exerts a kind of centripetal force on the project as a whole.
    More specifically, history writing focuses our attention most pointedly on the
    relationship between what happened in the past (what Aristotle called τὸ γενοόμενα)
    and what is visible in the present.


    Within the field of classics, these issues have long been the focus of what Laurence
    has called the “uneasy dialogue” between ancient historians and classical archaeologists
