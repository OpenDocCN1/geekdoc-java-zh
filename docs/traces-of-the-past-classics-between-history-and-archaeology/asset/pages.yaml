    Exemplified by the scepter, the anvil, and the stone, material objects in the
    Theogony may seem, at first glance, to be nothing more than unrelated data. As
    I have tried to show, however, their shared roles in referring both to the reality
    of the past and to the passing of human time are part of the poem’s engagement
    with its epistemological dilemma, that is, with the problem of telling the truth
    about events that happened in a distant and mythological past. They both raise
    the question of what can be known about that past and reveal the contingencies
    that resist that knowledge. More generally, they exemplify the work of protoarchaeological
    narratives in presenting visible remains as evidence for a past that has vanished
    from view.'
