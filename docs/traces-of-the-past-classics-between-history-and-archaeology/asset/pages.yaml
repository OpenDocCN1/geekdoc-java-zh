    The epilogue of the present book looks at this conflict within current archaeological
    theory, where it is specified in the proposition that the materiality of objects—also
    referred to in terms of their tangibility and visibility—is sacrificed to the
    language used to describe them. Beginning with the premise in Brill’s New Paody
    Online that archaeological artifacts constitute "tangible evidence for the past"
    (haptiches Zeugnis der Vergangen), the chapter traces this conflict in the relationship
    between the discipline’s persistent empiricism and its employment of language-based
    metaphors, principally the metaphor of "reading the past" in postprocessual archaeology.48
    In this disciplinary context, the metaphor of reading the past names the evidentiary
    limits of tangibility while it also invites an exploration of the archaeologist’s
    task of writing about artifacts. The question raised is what archaeologists gain
    or lose by making legible (readable) what is visible and tangible. My answer is
    based on two premises. First, the metaphor of reading the past works in defense
    of the persistent empiricism of the discipline, founded on the priority of visual
    and tangible objects positioned in an original place and time. Second, the relationship
    between empirical observation, linguistic expression, and the meaning of the past
    in archaeological theory is not formulated in disciplinary isolation. Rather,
    the ontological and epistemological contingencies that define relationship are
    present in the protoarcheological narratives discussed in the previous chapters
    and, as a result, justify the anachronism in hindsight. More succinctly, the epilogue
    explores how archaeology’s metaphor of reading the past constitutes a response
    to the past’s fading with time.


