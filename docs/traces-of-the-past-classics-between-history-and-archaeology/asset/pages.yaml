    A certain dialogism is implicit in such epigrams, which no longer exist solely
    for the sake of the monument, but reach out to the viewer/reader, sharing the
    absolute monumental present. Thus they seem to speak to the reader, and to answer
    his inquisitive gaze. Nevertheless, this dialogism is less of a real or imagined
    conversation as a consequence of the distinctive structure of an epigram that
    no longer has a definitive place, except somewhere between the object and the
    viewer, as mediator between the two. These epigrams participate in a dialogue
    not so much because they answer any real demand for knowledge, but cut off from
    the absolute presence of the monument, they must position themselves vis-à-vis
    someone else, a second person.27


