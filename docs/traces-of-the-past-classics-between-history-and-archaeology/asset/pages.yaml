    rial or visual sources (archaeologists).¹⁹ I realize that this characterization
    is reductive in the sense that scholars of the ancient past often make effective
    use of textual and material sources; I will have more to say about this below.
    As heuristic devices, these sources are accorded different—often hierarchical—explanatory
    values. The aim here is to explore the ways in which visual perception is key
    to conceptualizing the past as shared object of study. In disciplinary terms,
    this book brings together three areas of investigation whose relationship to one
    another may not seem obvious at first; time as a feature of narrative structure
    in literary theory, the concept of “the past itself” in the philosophy of history,
    and the ontological status of material objects in archaeological theory. The point
    of doing so is to better understand the epistemological premises—the various means
    of discovering the truth about the past—on which these disciplines are founded.
    The book also engages with three topics that have generated ongoing debates and
    discussions within humanities research: the dominance of vision in making truth
    claims, the role of language in distinguishing fiction from fact, and the criteria
    for establishing a past reality. Together, these topics form the arguments that
    follow and draw attention to what is at stake in making them.


    This book’s multidisciplinary approach is necessarily selective and requires some
    explanation of the choice of texts discussed in the following chapters. I begin
    from the premise that the book’s framing question traverses the traditional categories
    of author, genre, and period that often circumscribe a book about ancient literary
    texts. At the same time, focusing on the relationship between visual perception
    and the meaning of the past reveals some unrecognized links between these categories,
    such as how the role of Odysseus in the *Odyssey* prefigures that of the eyewitness
    in history writing and how the comic critique of tragedy in *Frogs* relies on
    a distinction between seeing a play and reading a script. The choice of beginning
    with Homer and Hesiod acknowledges their profound influence on later writers.
    But it also introduces another criterion by which to judge the significance of
    influence, namely, the foundational relationship between visual perception and
    temporal meaning in the ancient texts. From *Zeus’* stone in Hesiod’s *Theogony*,
    to the Achaean wall in the *Iliad*, to Croesus’ offerings in Herodotus’s *Histories*,
    to everyday objects in *Frogs*, this relationship not only transcends the generic
    categories that lie at the heart of literary studies; it also requires crossing
