    retrospective point of view, Hesiod’s story predicts the footing of Delphi as
    a supernatural landscape where visible objects function as metonyms for prior
    significant events and where those have potential (necessarily deferred) meaning
    in the future. At the same time, Pausanias’ uncertainty about the stone’s history
    (ἔστι δὲ καὶ δῶξ) illustrates the hermeneutic gap between visible objects in the
