    the interplay of two related phenomena: an implied desire for the real thing—for
    the stone’s extracursive, or material, reality—and the possibility that it may
    longer exist in the future.⁷ Pausanias responds to this possibility when, in his
    *Perieges*, he reports seeing a stone (λίθος οὗ μέγας) in Delphi that, he says,
    be the one that was visited by Cronos (ἔστι δὲ καὶ δόξα ἐς αὐτον δοθήθεί Κρόνῳ
