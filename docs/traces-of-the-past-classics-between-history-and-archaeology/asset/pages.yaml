    # Blinded by Time


    # The Past *“As If” in the Odyssey


    Epistemologically, the Greeks always privileged seeing (over hearing) as the mode
    of knowledge. To see, to see for oneself, and to know were one and the same things.
    Ontologically, their presence in the world was not a question for them: it was
    self-evident. To be present, to be there, and to know all go together for the
    Greeks.


    —François Hartog, “The Invention of History: The Pre-History of a Concept from
    Homer to Herodotus”¹


    The previous chapters have focused on the temporal significance of visible objects
    and monumental features in the poetic landscape of the Greek past. At several
    points along the way, the discussion has also included encounters with human eyewitnesses:
    Hesiod’s vision of the Muses on Helicon, Pausanias’ sighting of the stone in Delphi,
    and Strabo’s assessment of the existence of the Achaean people in Troy. In this
    chapter, I discuss the formative role of Odysseus as an eyewitness to his own
    past and as a figure who occupies an intermediary position between the two principal
    claimants to knowing the past and telling the truth about it in Greek narrative:
    the inspired singer, on one hand, and the human eyewitness, on the other.³ The
    focus is here on the ways in which visibility, as the source of the *Odyssey’s*
    protoarchaeological effect, is the mediating term between these two positions.


