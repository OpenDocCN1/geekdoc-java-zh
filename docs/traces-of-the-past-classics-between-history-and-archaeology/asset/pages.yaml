    tic poetry and extending to fifth-century drama and history writing, these experiences
    include the empirical observation of tangible objects like rocks, walls, and tombs.
    They also include events whose details are presented as the effects of a character''s
    or narrator''s visual experiences and perceptions. In this introduction, I introduce
    the term *protoarchaeological* to refer to narratives in which the past is constituted
    of or in response to what is visible (or not) in the past.archaeological narratives
    do two things. First, they activate a competition between the possibility (promise)
    of seeing the past and the act of reading (about) it. Second, they activate a
    competition between the desire to preserve the past in visible or material form,
    on the one hand, and the past''s susceptibility to destruction and decay, on the
    other. I have more to say about both claims in the following chapters. As used
    throughout this book, the term *protoarchaeological* refers to the visual representation
    of objects and events in a variety of ancient narratives but is meant to keep
    its disciplinary connotation.


    To illustrate the current state of these competitions in disciplinary terms, I
    begin with a brief overview of recent scholarship in the field of museum studies.
    At first glance, the relevance of museum studies to a book about ancient Greek
    narrative may seem tenuous. But debates among scholars in museum studies provide
    a succinct introduction to the theoretical works that frame this book. More specifically,
    debates over the display and preservation of objects in museums help us conceptualize
    the relationship between visual perception and temporal mapping that defines the
    protoarchaeological narratives discussed in the following chapters. Introducing
    the idea of the museum as a text, moreover, these debates also point to the utility
    of reading as a metaphor for mediating this relationship. I will suggest in the
    epilogue, this mediating function is explicit in the concept of “reading the past”
    in archaeological theory.


