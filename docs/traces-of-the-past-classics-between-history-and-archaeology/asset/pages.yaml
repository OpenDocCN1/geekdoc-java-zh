  md: 'Formulaic diction is oral writing, to so speak.”^18 Thus, by means of a familiar
    hesitancy writing (“to speak”), Saussy works through the plot of the *Odyssey*
    in order to show its veritable effects, recognized by the fact that orality, whether
    at the level of form or content, has little to do with producing immediacy or
    spontaneity. As a consequence, the idea that writing compromises immediacy by
    giving time to pause is something of a nostalgic fiction. Rather, in Saussy’s
    revisionist view, the *Odyssey* is a work which has visible signs, or σματα (e.g.,
    Odysseus’ scar, the bed he built), is a kind of writing.


    Such signs make a truly fantastic writing—singular, permanent, and self-evident.
    Nothing could be more unlike that potential for functional repetition that assures
    the ongoing inscription of an oral epic.^19


    In this view, reading the epic offers a way of understanding visible phenomena
