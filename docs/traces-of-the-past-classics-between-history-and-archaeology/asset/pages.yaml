    short, reading (about) visible phenomena competes with seeing them. One aim of
    this book is to identify and understand the emergence and effects of this competition.


    I begin with this brief discussion of recent work in museum studies in order to
    focus attention on the mediating role of reading for interpreting and giving meaning
    to the past, and more specifically, on the process by visible phenomena are marshaled
    as evidence for what happened in the past. Based on a comparison with reading
    texts, the metaphor of reading objects is, in literalized in the following chapters
    in close readings of visible phenomena in Greek narrative guided by their function
    in measuring and evaluating the passing of time. In general terms, the metaphor
    of reading objects in the world—including the metaphor of “reading the past” in
    recent archaeological discourse (a topic to which I will return in the epilogue)—is
    an analogue to the practice of reading (about) objects in texts. It exemplifies
    the ontological and epistemological contingencies at work in the dialogue interplay
    between legibility and visibility—reading and constituting, interpreting, and
    verifying the past.


    As a way of talking about this relationship in the context of this book, the term
    protoaeological describes narratives in which visual descriptions of objects and
    events put the possibility of seeing the past in competition with the practice
    of reading about it. The term meant to be capacious, just as the anachronism is
    intentional. Protoaeological narratives are those in which the act of reading
    texts is linked with conceptualizing the past as a receding visual field.¹16 Such
    narratives navigate the gap between empirical observation and linguistic representation
    in accounting for the past.¹17 More vividly, they respond to the task that Herodotus
    sets himself at the beginning of the Histories, namely to ensure that “the past
    deeds [...] of men do not fade with time” (Histories 1.1). Taking the unique visual
    metaphor of “fading with time” as a point of departure, the following chapters
    look at the ways in which narratives in a variety of ancient Greek genres both
    invoke Herodotus'' task and reveal the limits to his achievement.¹18


