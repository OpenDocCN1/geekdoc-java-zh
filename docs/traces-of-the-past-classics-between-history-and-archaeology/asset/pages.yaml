  md: '# 4 · TRACES OF THE PAST


    For our purposes, Tamen''s account draws attention to the situated nature of visible
    objects as the enabling precondition for their interpretation by a viewer. In
    this respect, the concept of immuration can be productively expanded to include
    the disposition and reception of visible phenomena in texts. This analogy is based
    on the proposition, mentioned above, that the visual experiences of narrators
    and characters test the limits of measuring and evaluating the passing of time.
    As a consequence of this process, readers of texts become virtual viewers of objects
    and events; more generally, reading becomes a mediated form of seeing. By way
    of an inversion, this proposition is explicitly tested in the claim that museums
    are texts to be read. Rhannon Mason explains the justifications for this claim
    as follows:


    The advantage of understanding museums in texts and narratives is that it moves
    away from privileging or compartmentalizing a particular aspect of the museum;
    for example, its building, collections, individual staff, or organizational status.
    All these components remain crucial, but a textual approach argues that must be
    viewed in concert to understand the possible meanings of the museum. Another useful
    aspect of the idea of textuality is that it raises the question of unintentional
    meanings, omissions, or contradictions within displays.


    This textual approach argues against the isolation and unique (or simply representative)
    status of a given museum object and on behalf of a contextdriven approach as equivalent
    to the activity of reading texts. This approach gives substance to Tamen''s reference
