  md: 'As a witness to his own past, Odysseus'' comparison to an ἀἰδ takes the form
    of an ironic simile in the service of an epistemological predicament. Expressed
    in the question of who can tell the truth about the past, the effect of the irony
    is to acknowledge what might be called a loss of memory. “loss of memory,” I am
    referring not to an act of forgetting but to the specific “fading away” (to paraphrase
    Herodotus of the Daughters of Memory and their divinely singers as the sources
    and arbiters of the past). It is true, of course, that this apparatus never fades
    away completely. But by contrastifying the true claims of the blinded singer and
    the sighted poorer, the “as if” similes in the Odyssey bring these two subjects
    together in order to keep them apart. In doing so, they imply that the time of
    the divinely inspired (blind) singer is passing by, or, in other terms, that the
    epic singer is on his way to becoming theated other of the writers of history.
    In Protoarchaeological terms, this transition is already at the work in the competing
    claims of visual or empirical observation, on the one hand, and poetic inspiration,
    on the other.


    In this respect, Odysseus'' praise of Demodocus for telling the story of the Trojan
    War “as if he were present” can be productively read against Ranke’s famous appeal
    to “showing” (zeigen) the past “as it actually was” (wie eigentlich gewesen).


