  md: '# Introduction


    # Seeing the Past


    What are we doing when we walk into an archaeological museum or onto an archaeological
    site? For what or at what are we looking? What do the objects and features we
    encounter in these unique spaces mean? More specifically, how do they convey to
    us something about the beliefs and activities of formerly living humans? The answers
    to these questions may seem all too obvious; they also depend on what “we” I am
    talking about. Professional archaeologists or art historians, for example, have
    very specific ways of looking and talking about their objects of study. The particulars
    of these disciplinary approaches are based on the assumption that ancient artifacts
    and architectural features are part of an array of data that come, over time,
    to constitute “the ancient past.” This process is achieved through a combination
    of enforcement and improvisation, that is, through certain discipline-specific
    ways of seeing, on the one, and through more open-ended or relational ways of
    seeing, on the other. In both cases, the ways in which visible phenomena in the
    present define and give meaning to the past depend on language—that is, on the
    captions, descriptions, explanations, and stories they produce. Narrative, in
    other words, turns these phenomena into remains and ruins.


    The aim of this book is to trace this transformation in a selection of ancient
    Greek texts and, in the process, to attempt bridge the divide that separates archaeologists,
    historians, and philologists. In very general terms, this divide is the study
    of words and the study of things. I begin with the fact that the past—as a temporal
    category whose effects extend into the present—is often formed in the visual experiences
    of characters and narrators in Greek narrative. Beginning with epic and didactic'
