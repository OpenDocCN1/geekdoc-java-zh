  md: '# Epilogue · 201


    Olsen’s terms, what is ignored are the ways in which protoarchaeological narratives
    prefigure the temporal, epistemological, and ontological variables define archaeology
    as a discipline.


    As suggested in the introduction to this book, the question becomes whether objects
    and texts are different or similar by nature whether one necessarily comes before
    or after the other. Rather, the question has to do with the distinctions between
    objects and things, including the disciplinary investment in those distinctions,
    have been formulated. One way to approach this question is to consider the history
    of visual and material phenomena in nature, that is the tradition of what I have
    been calling protoarchaeological narratives in the ancient Greek texts. To say
    that these narratives constitute a tradition may be an exaggeration. But insofar
    as they explore the relationship between visuals (or materiality), temporality,
    and narrativity, they form an interconnected, if historically and generically
    diverse, group of texts.


    In works at from one as Hesiod’s Theogony, Homer’s epics, Herodotus’ Histories,
    and Aristophanes’ Frogs, we find an interest in how perceptions of the phenomenal
    world in the present inform characters’ and narrators’ ability to know and evaluate
    what happened in the past. What Olsen critically refers to as “literary analogies”
    demoralize objects could be understood more productively as a group of narrative
    forms, in which the past is confronted as a receding visual field. In this respect—to
    return to the conundrum identified by Freydman—“the past itself” is produced not
    in the unbridgeable gap between empirical observation and linguistic representation
    in their dialogic interplay. As discussed throughout the present study, this interplay
    is the defining feature of protoarchaeological narratives, and as I hope to show
    in this epilogue, it collects the ways in which archaeologists talk about their
    discipline. To return to the formulation discussed in the introduction, the human
    past—both as a conceptual category and as an object of disciplinary study—is formed
    in the negotiation between words and things, or between linguistic representation
    metaphor of empirical observation. Epitomized by the archaeologists “reading the
    past,” this negotiation—somewhat paradoxically—is a symptom of our desire to see
    the past in the present. Protoarchaeological narratives in the ancient Greek tradition
    alert us to the sources and consequences of this desire and to the limits of its
    fulfillment.


