    The point of Apollo''s response seems obvious: Why should fight against a fellow
    god on behalf of mortals, no matter what aid the gods gave them, will they die
    away?33 But given the mutual self-definition of humans and gods in the epic, the
    response also lacks force. Humans die, but while they live, they motivate the
    intentions and actions of the gods, with whom they may share genealogies. In the
    context, moreover, the fact that humans “waste away and become lifeless [literally,
    without a heart]” (ἀκτήρ, 466) is literal, if contrastively, correlated with the
    notion that Troy is “unbroken” (ἄρκτος, 447).34 I am not suggesting that these
    two terms are etymologically related, of course. Nor does their proximity in the
    poem emphasize a phonetic and therefore semantic equivalence.35 But insofar the
    wall by the gods guarantees that the city will endure, it is implicitly contrasted
    with the ephemerality of the humans for whom it was built. In transferring the
    adjective “unbroken” from the wall to the city, the poet has effectively equated
    their potential vulnerability.36


    We know Troy is destined to fall or “break,” a fact alluded to when Apollo sees
    the city out of combat that the Greeks will destroy the wall all at once (51:15-17).


