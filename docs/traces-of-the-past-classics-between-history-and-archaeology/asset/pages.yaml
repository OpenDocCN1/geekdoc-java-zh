    reading both creates and “shatters” this notion, because it exposes the invisibility
    (or partial visibility) of the past. In terms of the concerns of this work, the
    catalogue foregrounds the conceptual interplay between reading (about) and seeing
    the past in protoarchaeological narratives.


    A similar situation, if somewhat more complicated, describes the tei- chopia,
    where Priam asks Helen to identify, in catalogue form, some of the major Greeks
    on the Trojan plain (Iliad 3.146–244).31 That Priam needs to be told who Agamemnon,
    Odysseus, and the others are all after these years has been a long-standing conundrum
    for commentators who argue that anachronism compromises the poem’s fluidity or
