  md: 'We agree with Elmer the proem to the Catalogue of Ships presents different
    "orders of knowledge," it is also the case that a single domi-

    nant order, namely, sight. The Muses see everything (ἱστέ τε πάντα); the

    narrator sees noting (οὐδὲ τε ἶμεν). Calling the Muses is thus a vehicle

    for calling attention to the narrator’s bard or absence, in visual

    terms, from the (past) events he narrates. That humans “only hear a report"

    (χλέος οἴον ἀκούουμένου) contributes to this hierarchy of perception,

    which visual proof (as a human capacity) is devalued in order to pro-

    mote the truth claims of inspired speaking (the prerogative of the bard).

    As suggested above, Demodocus’ blindness in the Odyssey—to which I will

    return—is another expression of this promotion.


    But while we attribute this devaluation to religious scpe (and

    its by-product deconstruction) on the part of the poet, this default to

    biographical criticism at the expense of accounting for the hyper-

    bolic terms of the passage, that is, seeing everything versus seeing nothing.

    Like the incentive Hesiod puts in the mouths of his Muses, the hyperbolic

    utterance—and should include here too the appeal to ten tongues and

    ten mouths—cautions against us against taking this hierarchy at value. Rather,

    the passage presents a chaotic structure: the poet/bard names (tell, recounts)

    events in the past but does not see; the Muses see but do not

