    becomes a matter of switching from the present to the past. In other words, the
    switch not only a matter of emphasis or perspective but constitutes a radical
    relocation of the observer in time. The question of why Helen (as opposed some
    other character) occupies this position in the Iliad may have to do with her ostensible
    role causing the war. But however we answer this question, the act of reading
    her tapestry (in the form of captions) as she stands on the wall names this perceptual
    shift, in which reading creates and mediates the past, as a visible construct.
    As a result, it is useful to revise Elmer''s terminology; Helen is not so much
    a maker of epigrams (an *epigramatopoeios*) as a reader of the past in visible.


    The *teichoscopia* exemplifies the oscillation between seeing the past and reading
    the past, or between the reality of the past as seen by an eyewitness (the scene
    from the Trojan war) and its mimesis as seen and read by a virtual viewer (the
    scene on the tapestry). More generally, both the Catalogue of Ships and the *teichoscopia*
    refute the idea that epic discourse is to make the past come alive or the past
    is, as Anna Bonifazi has put it, “re-enacted in the *hic nunc* of the epic performance.48
    Elmer’s argument is pertinent to the protoarcheological effect of the epic poems
    in several ways. First, if there is inscription or epigrammatic in the Catalogue
    of Ships and the *teichoscopia*, the act of “reading the tableau” is a way of
    referring to the epic past as a visual absence. The experience of affirming words
    to images or objects, the inscription is simultaneously a supplement to the image
    or object (in this case, the catalogue and the tapestry) and an explicit acknowledgment
    that what is narrated cannot be seen. In other words, “reading” in Elmer’s sense
    is a means of referring to the invisibility of the epic past in the present. This
    kind of “reading” also points to the theoretical pitfalls of the scholarly faith
    in an idealized oral tradition, mediated in the power to turn readers into spectators
    of the epic. In contrast, Elmer’s account problematizes the visual vividness of
    epic language and its derivation.


