- img_proc: true
  md: '# What is node.js


    Node.js is an open-source, cross-platform runtime environment used for development
    of server-side web applications. Node.js applications are written in JavaScript
    and can be run on a wide variety of operating systems.


    Node.js is based on an event-driven architecture and a non-blocking Input/Output
    API that is designed to optimize an application''s throughput and scalability
    for real-time web applications.


    Over a long period of time, the framework available for web development were all
    based on a stateless model. A stateless model is where the data generated in one
    session (such as information about user settings and events that occurred) is
    not maintained for usage in the next session with that user.


    A lot of work had to be done to maintain the session information between requests
    for a user. But with Node.js there is finally a way for web applications to have
    a real-time, two-way connections, where both the client and server can initiate
    communication, allowing them to exchange data freely.'
  merge: -1
  pgno: 5
- img_proc: true
  md: '# Why use Node.js


    We will have a look into the real worth of Node.js in the coming chapters, but
    what is it makes this framework so famous. Over the years, most of the applications
    were based on a stateless request-response framework. In these sort of applications,
    it is up to the developer to ensure the right code was put in place to ensure
    the state of web session was maintained while the user was working with the system.


    But with Node.js web applications, you can now work in real-time and have a 2-way
    communication. The state is maintained, and the either the client or server can
    start the communication.'
  merge: -1
