  md: "# How to use Jasmine to test Node.js applications\n\nIn order to use Jasmine\
    \ to test Node.js applications, a series of steps needs to be followed.\n\nIn\
    \ our example below, we are going to define a module which add 2 numbers which\
    \ need to be tested. We will then define a separate code file with the test code\
    \ and then use jasmine to test the Add function accordingly.\n\n**Step 1)** Define\
    \ the code which needs to be tested. We are going to define a function which will\
    \ add 2 numbers and return the result. This code is to be written in a file called\
    \ \"Add.js.\"\n\n```\nvar exports=module.exports={};\nexports.AddNumber=function(a,b)\n\
    {\n  return a+b;\n}\n```\n\n# Code Explanation:\n\n+   1. The \"exports\" keyword\
    \ is used to ensure that the functionality defined in this file can actually be\
    \ accessed by other files.\n2. We are then defining a function called 'AddNumber.'\
    \ This function is defined to take 2 parameters, a and b. The function is added\
    \ to the module \"exports\" to make the function as a public function that can\
    \ be accessed by other application modules.\n3. We are finally making our return\
    \ function added value of the parameters.\n\n**Step 2)** Next we need to define\
    \ our jasmine test code which will be used to test our \"Add\" function in the\
    \ Add.js file. The below code needs to put in a file called **add-spec.js.**\n\
    \n**Note:** - The word 'spec' needs to be added to the test file so that it can\
    \ be detected by jasmine.\n\n```\nvar app=require(\"../Add.js\\ndescribe(\"Addition\"\
    ,function(){\n  it(\"The function should add 2 numbers\",function() {\n    var\
    \ value=app.AddNumber(5,6);\n    expect(value).toBe(11);\n  });\n});\n```\n\n\
    # Code Explanation:"
