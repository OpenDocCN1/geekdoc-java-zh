  md: '# Installing node through a package manager


    The other way to install Node.js on any client machine is to use a "package manager".


    On windows, the node package manager is known as Chocolatey. It was designed to
    be a decentralized framework for quickly installing applications and tools that
    you need.


    To Install Node.js via Chocolatey, the following steps need to be performed.


    **Step 1)** Installing Chocolatey – The Chocolatey website (https://chocolatey.org/)
    has very clear instructions on how this framework needs to be installed.


    +   - The first steps is to run the below command in the command prompt windows.
    This command is taken from the Chocolatey web site and is the standard command
    for installing Node.js via Chocolatey.


    +   - The below command is a PowerShell command which calls the remote PowerShell
    script on the Chocolatey website. This command needs to be run in a PowerShell
    command window.


    +   - This PowerShell script does all the necessary work of downloading the required
    components and installing them accordingly.


    ```

    @powershell -NoProfile -ExecutionPolicy Bypass -Command "iex ((new-object wet.webclient).DownloadString(''https://chocolatey.org/install.ps1''))"
    && SET PATH=%PATH%%;ALLUSERPROFILE%\chocolatey\bin

    ```'
  merge: -1
