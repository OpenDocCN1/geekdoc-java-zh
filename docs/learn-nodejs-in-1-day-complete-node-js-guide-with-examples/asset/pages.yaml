  md: '# Creating NPM modules


    Node.js has the ability to create custom modules and allows you to include those
    custom modules in your Node.js application.


    Let''s look at a simple example of how we can create our own module and include
    that module in our main application file. Our module will just do a simple task
    of adding 2 numbers.


    Let''s follow the below steps to see how we can create modules and include them
    in our application.


    **Step 1)** Create a file called "Addition.js" and include the below code. This
    file will contain the logic for your module.


    Below is the code which would go into this file:


    ```

    var exports=module.exports={};

    exports.AddNumber=function(a,b)

    {

    return a+b;

    };

    ```


    +   1. The "exports" keyword is used to ensure that the functionality defined
    in this file can actually be accessed by other files.

    2. We are then defining a function called ''AddNumber''. This function is defined
    to take 2 parameters, and a and b. The function is added to the module "exports"
    to make the function as a public function that can be accessed by other application
    modules.

    3. We are finally making our custom module return the added value of the parameters.


    Now that we have created our custom module which has the functionality of adding
    2 numbers. It''s now time to create an application, which will call this module.


    In the next step, we will actually see how to create the application which will
    call our custom module.


    **Step 2)** Create a file called "app.js," which is your main application file
    and add the below code


    ```

    var Addition=require(''./Addition.js'');

    console.log(Addition.AddNumber(1,2));

    ```'
