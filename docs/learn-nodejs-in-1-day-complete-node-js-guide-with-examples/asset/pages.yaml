  md: '# Features of Node.js


    Let''s look at some of the key features of Node.js


    +   1 Asynchronous event driven IO helps concurrent request handling – This is
    probably the biggest selling points of Node.js. This feature basically means that
    if a request is received by Node for some Input/Output operation, it will execute
    the operation in the background and continue with processing other requests.


    This is quite different from other programming languages. A simple example of
    this is given in the code below


    ```

    var fs = require(''fs'');


    fs.readFile("Sample.txt", function(error,data)

    {

    console.log("Reading Data completed");

    });

    ```


    +   - The above code snippet looks at reading a file called Sample.txt. In other
    programming languages, the next line of processing would only happen once the
    entire file is read.

    - But in the case of Node.js the important fraction of code to notice is the declaration
    of the function (''function(error,data)''). This is known as a callback function.

    - So what happens here is the file reading operation will start in the background.
    And other processing can happen simultaneously while the file is being read. Once
    the file operation is completed, this anonymous function will be called and the
    text "Reading Data completed" will be written to the console log.


    +   2. Node uses the V8 JavaScript Runtime engine, the one which is used by Google
    Chrome. Node has a wrapper over the JavaScript engine which makes the runtime
    engine much faster and hence processing of requests within Node also become faster.

    3. Handling of concurrent requests – Another key functionality of Node is the
    ability to handle concurrent connections with a very minimal overhead on a single
    process.

    4. The Node.js library using JavaScript – This is another important aspect of
    development in Node.js. A major part of the development community are all well
    versed in javascript, and hence, development in Node.js becomes easier for a developer
    who knows javascript.'
  merge: -1
  pgno: 7
