  md: '1. We need to first include our Add.js file so that we can test the ''AddNumber''
    function in this file.


    2. We are now creating our test module. The first part of the test module is to
    describe a method which basically gives a name for our test. In this case, the
    name of our test is "Addition".


    3. The next bit is to give a description for our test using the ''it'' method.


    4. We now invoke our Addnumber method and send in 2 parameters 5 and 6. This will
    be passed to our Addnumber method in the App.js file. The return value is then
    stored in a variable called.


    5. The final step is to do the comparison or our actual test. Since we expect
    the value returned by the Addnumber function to be 11, we define this using the
    method expect(value).toBe(the expected value).


    # Output


    +   1. In order to run the test, one needs to run the command jasmine.


    +   2. The below screenshot shows that after the jasmine command is run , it will
    detect that there is a test called add-spec.js and execute that test accordingly.
    If there are any errors in the test, it will be shown accordingly.


    ![](img/cbcb6538723209554d9dc578069d9e55_97_0.png)


    # Summary


    +   - In order to test a Node.js application, the jasmine framework needs to be
    installed first. This is done by using the Node package manager.


    +   - The test code needs to be written in a separate file, and the word ''spec''
    should be appended to the file name. Only if this is done will jasmine be able
    to detect that a file needs to be run.


    +   - To run the test, you need to execute the jasmine command. This will find
    all files which have the ''spec'' word attached to it and run the file accordingly.'
