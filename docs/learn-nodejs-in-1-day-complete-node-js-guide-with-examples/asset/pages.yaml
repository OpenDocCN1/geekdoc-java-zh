    \ through the browser on this port no, then server application will send a 'Hello'\
    \ World' response to the client.\n\n```\nvar http=require('http')\nvar server=http.createServer((function(request,\
    \ response)\n{\n  response.writeHead(200,\n  \"Content-Type\" : \"text/plain\"\
