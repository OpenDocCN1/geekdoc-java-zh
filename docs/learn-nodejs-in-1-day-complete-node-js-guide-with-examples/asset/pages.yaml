  md: '# Chapter 8: Testing with Jasmine


    Testing is a key element to any application. For Node.js, the framework available
    for testing is called Jasmine. In early 2000, there was a framework for testing
    javascript applications called JsUnit. Later this framework got upgraded and is
    now known as jasmine.


    Jasmine helps in automated unit testing, something which has become quite a key
    practice when developing and deploying modern day web applications.


    In this tutorial, you will learn how to get your environment setup with jasmine
    and how you can start testing your first Node.js application with jasmine.'
  merge: -1
