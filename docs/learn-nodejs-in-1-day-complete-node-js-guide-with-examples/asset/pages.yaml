  md: "# # What are promises\n\nBefore we start with promises, let's first revisit\
    \ what are \"callback\" functions in Node.js. We have seen these callback functions\
    \ a lot in the previous chapters, so let's quickly go through one of them.\n\n\
    The example below shows a code snippet, which is used to connect to a MongoDB\
    \ database and perform an update operation on one of the records in the database.\n\
    \n```\nvar MongoClient = require('mongodb').MongoClient;\nvar url = 'mongodb://localhost/EmployeeDB';\n\
    \nMongoClient.connect(url, function(err, db) {\n  db.collection('Employee').updateOne(\n\
    \    { \"EmployeeName\": \"NewEmployee\" },\n    {\n      $set: { \"EmployeeName\"\
    : \"Mohan\" }\n    }\n  );\n});\n```\n\n+   1. In the above code, the part of\
    \ thefunction(err,db) is known as the declaration of an anonymous or callback\
    \ function. When the MongoClient creates a connection to the MongoDB database,\
    \ it will return to the callback once the connection operation completed. In a\
    \ sense, the connection operations happens in the background, and when it is done,\
    \ it calls our callback function. Remember that this is one of the key points\
    \ of Node.js to allow many operations to happen concurrently and thus not block\
    \ any user from performing an operation.\n2. The second code block is what gets\
    \ executed when the callback function is actually called. The callback function\
    \ just updates one record in our MongoDB database.\n\nSo what is a promise? Well,\
    \ a promise is just an enhancement to callback functions in Node.js. During the\
    \ development lifecycle, there may be an instance where you would need to"
  merge: -1
  pgno: 66
- img_proc: true
  md: 'nest multiple callbacks functions together. This can get kind of messy and
    difficult to maintain at a certain point in time. In short, a promise is an enhancement
    to callbacks that looks towards alleviating these problems.


    The basic syntax of a promise is shown below:


    ```

    var promise = doSomethingAsync()

    promise.then(onFulfilled, Rejected)

    ```


    +   * "doSomethingAsync" is any callback or asynchronous function which does some
    sort of processing.

    * This time, when defining the callback, there is a value which is returned called
    a "promise."

    * When a promise is returned, it can have 2 outputs. This is defined by the ''then''
    clause''. Either the operation can be a success which is denoted by the ''onFulfilled''
    parameter. Or it can have an error which is denoted by the ''onRejected'' parameter.


    **Note:** So the key aspect of a promise is the return value. There is no concept
    of a return value when working with normal callbacks in Node.js. Because of the
    return value, we have more control of how the callback function can be defined.


    In the next topic, we will see an example of promises and how they benefit from
    callbacks.'
