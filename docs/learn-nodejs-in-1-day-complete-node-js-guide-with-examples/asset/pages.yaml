    3. **Jade** - Jade is a high-performance template engine and implemented with
    JavaScript for node and browsers.

    4. **MongoDB** - The MongoDB Node.js driver is the officially supported node.js
    driver for MongoDB.

    5. **Restify** - restify is a lightweight framework, similar to express for building
    REST APIs

    6. **Bluebird** - Bluebird is a fully featured promise library with focus on innovative
    features and performance'
