  mdcn: "\n\n# 第 3 章：模块 (Modules)\n\nNode.js 中的模块是代码在单个单元中的逻辑封装。将代码进行此类分离，使其在未来的用途中更易管理和维护始终是一种良好的编程实践。这正是\
    \ Node.js 模块大显用场的地方。\n\n每个模块都是具有独立封装功能的独立实体，因此它可以作为一个独立的工作单元来被管理。\n\n在本教程中，我们将学习如何利用\
    \ Node.js 中的模块。\n\n## 什么是 Node.js 模块？\n\n如前所述，Node.js 模块是将代码封装在独立逻辑单元中的一种方法。市场上有很多现成的模块可以在\
    \ Node.js 中使用。\n\n以下是 Node.js 应用中常用的一些流行模块：\n\n- 1. **Express 框架** – Express 是一个极简且灵活的\
    \ Node.js Web 框架，为 Web 和移动应用提供了一套强大的功能。\n- 2. **Socket.io** - Socket.IO 实现了实时基于事件的双向通信。该模块非常适合创建聊天类应用程序。\n\
    - 3. **Jade** - Jade 是一个高性能的模板引擎，使用 JavaScript 为 node 和浏览器实现。\n- 4. **MongoDB**\
    \ - MongoDB Node.js 驱动是 MongoDB 官方支持的 Node.js 驱动。\n- 5. **Restify** - restify\
    \ 是一个轻级框架，类似于 express，用于构建 REST API。\n- 6. **Bluebird** - Bluebird 是一个功能完备的 promise\
    \ 库，专注于创新功能和性能。\n\n## 在 Node.js 中使用模块\n\n为了在 Node.js 应用中使用模块，首先需要使用 Node 包管理器（npm）进行安装。\n\
    \n下所示命令行显示了如何安装 \"express\" 模块。\n\n```bash\nnpm install express\n```\n\n![](img/cbcb6538723209554d9dc578069d9e55_22_0.png)\n\
    \n- 上述命令将下载包含“express 模块”的必要文件并处理安装工作。\n- 一旦模块安装完成，要在 Node.js 应用中使用该模块，你需要使用 `require`\
    \ 关键字。该关键字是 Node.js 用于将模块功能整合到应用程序中的方式。\n\n让我们来看一个如何使用 `require` 关键字的示例。下面的 \"\
    Guru99\" 代码示例展示了如何使用 require 函数：\n\n```javascript\nvar express=require('express');\n\
    var app=express();\napp.set('view engine', 'jade');\napp.get('/', function(req,res)\n\
    {\n});\nvar server=app.listen(3000, function ()\n{\n});\n```\n\n- 1. 在第一句语句中，我们就使用了\
    \ `require` 关键字来引入 express 模块。\"express\" 模块针对 Node.js 开发优化的 JavaScript 库。这是最常用的\
    \ Node.js 模块之一。\n- 2. 引入模块后，为了使用模块内部的功能，需要创建一个对象。这里创建了一个 express 模块的对象。\n- 3.\
    \ 一旦使用 `require` 命令引入了模块并创建了“对象”，就可以调用 express 模块所需的方法。在这里我们使用 `set` 命令来设置视图引擎，它被用于设置\
    \ Node.js 中使用的模板引擎。**注意：**（仅供读者理解，模板引擎是一种通过从数据文件中提取数据向应用程序中注入值的方法。这个概念在 Angular\
    \ JS 中非常有名，其中大括号 `{{ key }}` 用于替换网页中的值。大括号中的单词 'key' 基本上表示变量，该变量在页面显示时将被一个值替换。）\n\
    - 4. 在这里我们使用 `listen` 方法让应用程序监听特定的端口号。\n\n## 创建 NPM 模块\n\nNode.js 具有创建自定义模块的能力并允许你将这些自定义模块包含在\
    \ Node.js 应用中。\n\n让我们来看一个简单的示例，如何创建自己的模块并将其包含在主应用程序文件中。我们的模块将执行两个数字相加的简单任务。\n\n\
    遵循以下步骤查看如何创建模块并将其包含在应用程序中。\n\n**步骤 1)** 创建名为 \"Addition.js\" 的文件并包含以下代码。该文件将包含你的模块逻辑。\n\
    \n以下是放入该文件的代码：\n\n```javascript\nvar exports=module.exports={};\nexports.AddNumber=function(a,b)\n\
    {\nreturn a+b;\n};\n```\n\n- 1. `exports` 关键字用于确保此文件中定义的功能可以被其他文件实际访问。\n- 2. 然后我们定义了一个名为\
    \ 'AddNumber' 的函数。该函数定义为接收 2 个参数，即 a 和 b。该函数被添加到模块 \"exports\" 中，成为一个可以被其他应用程序模块访问的公共函数。\n\
    - 3. 我们最后让自定义模块返回参数的相加值。\n\n现在我们已经创建了具有两个数字相加功能的自定义模块。现在是时候创建一个将调用此模块的应用程序了。\n\
    \n在下一步中，我们将实际看到如何创建一个调用我们自定义模块的应用程序。\n\n**步骤 2)** 创建名为 \"app.js\" 的文件，这是你的主应用程序文件，并添加以下代码：\n\
    \n```javascript\nvar Addition=require('./Addition.js');\nconsole.log(Addition.AddNumber(1,2));\n\
    ```\n\n1. 我们正在使用 `require` 关键字引入 Addition.js 文件中的功能。\n2. 由于 Addition.js 文件中的函数现在是可访问的，我们现在可以调用\
    \ AddNumber 函数。在函数中，我们传递了 2 个数字作为参数。然后在控制台中显示该值。\n\n```bash\nD:\\Program Files\
    \ (x86)\\JetBrains\\WebStorm 11.0.1\\bin\\runner.exe \"D:\\Program Files\\nodejs\\\
    node.exe\" app.js\nProcess finished with exit code 0\n```\n\n![](img/cbcb6538723209554d9dc578069d9e55_25_0.png)\n\
    \n## 输出：\n\n- 当你运行 app.js 文件时，你将在控制台日志中获得值 3。\n- 结果是因为调用了 Addition.js 文件中的 AddNumber\
    \ 函数。\n\n## 扩展模块\n\n在创建模块时，可以扩展另一个模块。让我们来看一个如何扩展模块的示例。\n\n**步骤 1)** 创建基础模块。创建一个名为\
    \ \"Tutorial.js\" 的文件并包含以下代码：\n\n```javascript\nvar exports=module.exports={};\n\
    exports.tutorial=function()\n{\nconsole.log(\"Guru99 Tutorial\")\n};\n```\n\n\
    - 1. `exports` 关键字用于确保此文件中定义的功能可以被其他文件实际访问。\n- 2. 然后我们定义了一个名为 'tutorial' 的函数。该函数将输出\
    \ \"Guru99 Tutorial\"。\n\n**步骤 2)** 接下来我们将创建一个扩展模块。创建一个名为 \"NodeTutorial.js\"\
    \ 的文件并包含以下代码：\n\n```javascript\nvar Tutor=require('./Tutorial.js');\nexports.NodeTutorial=function()\n\
    {\nconsole.log(\"Node Tutorial\")\n}\nexports.pTutor=function()\n{\nTutor.tutorial();\n\
    }\n```\n\n- 1. 我们在新模块文件中使用了 `require` 函数。由于我们要扩展现有的 \"Tutorial.js\"，我们需要先引入它。\n\
    - 2. 然后我们创建了一个名为 \"NodeTutorial\" 的函数。该函数将做两件事：\n    - 向控制台发送字符串 \"Node Tutorial\"\
    。\n    - 将基础模块 \"Tutorial.js\" 中的字符串 \"Guru99 Tutorial\"发送到我们的扩展模块 \"NodeTutorial.js\"\
    。\n\n**步骤 3)** 创建你的主 app.js 文件，这是你的主应用程序文件并包含以下代码：\n\n```javascript\nvar localTutor=require('./NodeTutorial.js');\n\
    localTutor.NodeTutorial();\nlocalTutor.pTutor();\n```\n\n1. 我们的主应用程序现在调用 \"NodeTutorial\"\
    \ 模块。\n2. 我们调用该函数，文本 \"Node Tutorial\" 将显示在控制台日志中。\n3. 由于我们扩展了 Tutorial.js 模块并暴露了一个名为\
    \ pTutor 的函数，它还调用了 Tutorial.js 模块中的 tutorial 函数。\n\n**输出：**\n\n由于我们使用 Node 执行了上述\
    \ app.js 代码，我们将在控制台日志文件中获得以下输出：\n\n- Node Tutorial\n- Guru99 Tutorial\n\n"
