    \ to define 2 callback functions, both of which insert a\nrecord into the MongoDB\
    \ database.\n\n(Note: Chaining is a concept used to link execution of methods\
    \ to one another. Suppose if\\our application had 2 methods called 'methodA' and\
    \ 'methodB'. And the logic was such that\n'methodB' should be called after 'methodA,'\
    \ and then you would chain the execution in such a way\nthat 'methodB' gets called\
    \ directly after 'method.')\n\nThe key to note in this example is that the code\
    \ becomes cleaner, readable and\nmaintainable by using nested promises.\n\n```\n\
    var Promise = require('promise');\nvar MongoClient = require('mongodb').MongoClient;\n\
    var url = 'mongodb://localhost/EmployeeDB';\nMongoClient.connect(url)\n\n.then(function(db)\
    \ {\n  db.collection('Employee').insertOne({\n    EmployeeId: 4,\n    EmployeeName:\
    \ \"NewEmployee\"\n  })\n  .then(function(db1) {\n    db1.collection('Employee').insertOne({\n\
    \      EmployeeId: 5,\n      EmployeeName: \"NewEmployee1\"\n    })\n  })\n});\n\
    ```\n\n# Code Explanation:-\n\n+   1. We are now defining 2 \"then\" clauses which\
    \ get executed one after the other. In the first\nthen clause, we are passing\
    \ the 'db' parameter which contains our database connection.\nWe are then using\
    \ the collection property of the 'db' connection to insert records into the\n\
    'Employee' collection. The insertOne method is used to insert the actual document\
