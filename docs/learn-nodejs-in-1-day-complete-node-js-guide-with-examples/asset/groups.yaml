    \nMongoClient.connect(url, function(err, db) {\n  if (err) {\n    console.log(err);\n\
    \  }\n  console.log(\"Connected\");\n  // Perform operations here\n  db.close();\n\
    });\n```\n\nIn the following sections, we will learn how to perform CRUD operations\
    \ in MongoDB using Node.js.\n\n## Inserting data into MongoDB\n\nTo insert data\
    \ into a collection, we use the `insertOne` method. Here is an example of how\
    \ to insert a document into the Employee collection:\n\n```javascript\nvar doc\
