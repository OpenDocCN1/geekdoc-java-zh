    \n**Step 2)** Next we will create our extended module. Create a file called \"\
    NodeTutorial.js\" and place the below code:\n\n```javascript\nvar Tutor=require('./Tutorial.js');\n\
    exports.NodeTutorial=function()\n{\nconsole.log(\"Node Tutorial\")\n}\nexports.pTutor=function()\n\
    {\nTutor.tutorial();\n}\n```\n\n- 1. We are using the \"require\" function in\
    \ the new module file. Since we are going to extend the existing module \"Tutorial.js\"\
    , we need to first include it.\n- 2. We then create a function called \"NodeTutorial\"\
    . This function will do 2 things:\n    - It will send a string \"Node Tutorial\"\
    \ to the console.\n    - It will send the string \"Guru99 Tutorial\" from the\
    \ base module \"Tutorial.js\" to our extended module \"NodeTutorial.js\".\n\n\
    **Step 3)** Create your main app.js file which is your main application file and\
