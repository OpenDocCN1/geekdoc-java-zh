    \ Note: If you get an error like \"C:\\ProgramData\\chocolatey\\lib\\tools\\chocolateyInstall.ps1\"\
    \ then manually create the folder in the path.\n\n## Running your first Hello\
    \ world application in Node.js\n\nOnce you have downloaded and installed Node.js\
    \ on your computer, let's try to display \"Hello World\" in a web browser.\n\n\
    Create a Node.js file named firstprogram.js\n\n```javascript\nvar http = require('http');\n\
    \nhttp.createServer(function (req, res) {\n  res.writeHead(200, {'Content-Type':\
    \ 'text/html'});\n  res.end('Hello World!');\n}).listen(8080);\n```\n\n## Code\
    \ Explanation:\n\n- 1. The basic functionality of the \"require\" function is\
    \ that it reads a JavaScript file, executes the file, and then proceeds to return\
    \ an object. Using this object, one can then use the various functionalities available\
    \ in the module called by the require function. So in our case, since we want\
    \ to use the functionality of http, we are using the require(http) command.\n\
    - 2. In this 2nd line of code, we are creating a server application which is based\
    \ on a simple function. This function is called whenever a request is made to\
    \ our server application.\n- 3. When a request is received, we are asking our\
    \ function to return a \"Hello World\" response to the client. The writeHead function\
    \ is used to send header data to the client and the end function will close the\
    \ connection to the client.\n- 4. We are then using the .listen function to make\
    \ our server application listen to client requests on port 8080. You can specify\
