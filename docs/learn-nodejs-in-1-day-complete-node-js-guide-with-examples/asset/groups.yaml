    # Chapter 1: Introduction


    The modern web application has really come a long way over the years with the
    introduction of many popular frameworks such as bootstrap, Angular JS, etc. All
    of these frameworks are based on the popular JavaScript framework.


    But when it came to developing server-based applications there was just kind of
    a void, and this is where Node.js came into the picture.


    Node.js is also based on the JavaScript framework, but it is used for developing
    server-based applications. While going through the entire tutorial, we will look
    into Node.js in detail and how we can use it to develop server-based applications.


    # What is node.js


    Node.js is an open-source, cross-platform runtime environment used for development
    of server-side web applications. Node.js applications are written in JavaScript
    and can be run on a wide variety of operating systems.


    Node.js is based on an event-driven architecture and a non-blocking Input/Output
    API that is designed to optimize an application''s throughput and scalability
    for real-time web applications.


    Over a long period of time, the framework available for web development were all
    based on a stateless model. A stateless model is where the data generated in one
    session (such as information about user settings and events that occurred) is
    not maintained for usage in the next session with that user.


    A lot of work had to be done to maintain the session information between requests
    for a user. But with Node.js there is finally a way for web applications to have
    a real-time, two-way connections, where both the client and server can initiate
    communication, allowing them to exchange data freely.


    # Why use Node.js


    We will have a look into the real worth of Node.js in the coming chapters, but
    what is it makes this framework so famous. Over the years, most of the applications
    were based on a stateless request-response framework. In these sort of applications,
    it is up to the developer to ensure the right code was put in place to ensure
    the state of web session was maintained while the user was working with the system.


    But with Node.js web applications, you can now work in real-time and have a 2-way
    communication. The state is maintained, and the either client or server can start
    the communication.


    # Features of Node.js


    Let''s look at some of the key features of Node.js


    - 1. Asynchronous event driven IO helps concurrent request handling – This is
    probably the biggest selling points of Node.js. This feature basically means that
    if a request is received by Node for some Input/Output operation, it will execute
    the operation in the background and continue with processing other requests.


    This is quite different from other programming languages. A simple example of
    this is given in the code below


    ```

    var fs = require(''fs'');


    fs.readFile("Sample.txt", function(error,data)

    {

    console.log("Reading Data completed");

    });

    ```


    - The above code snippet looks at reading a file called Sample.txt. In other programming
    languages, the next line of processing would only happen once the entire file
    is read.

    - But in the case of Node.js the important fraction of code to notice is the declaration
    of the function (''function(error,data)''). This is known as.


    - 2. Node.js uses the V8 engine, which is used by Google Chrome. Node.js is very
    fast because of the V8 engine.

    - 3. Handling concurrent requests - Another important aspect of Node.js is the
    ability to handle concurrent requests with minimal overhead.

    - 4. Node.js uses the JavaScript library - This is another key feature of Node.js.

    - 5. Node.js has an active and vibrant community - Because of the community, there
    are always updates available.


    # Who uses Node.js


    Node.js is used by a variety of large companies. Below is a list of a few:


    - Paypal - A lot of sites within Paypal have also started the transition onto
    Node.js.

    - LinkedIn - LinkedIn is using Node.js to power their Mobile products.

    - Mozilla has implemented Node.js to support browser APIs which has a billion
    installs.

    - Ebay hosts their API service in Node.js


    # When to use and not use Node.js


    Node.js is best for usage in streaming or event-based real-time applications like:


    1. Chat applications

    2. Game servers - Fast and high-performance servers that need to process thousands
    of requests at a time, then this is an ideal framework.

    3. Good for collaborative environment - This is good for environments which manage
    documents. In document management environment you will have multiple people who
    post their documents and do constant changes by checking out and checking in documents.
    So Node.js is good for these environments because the event loop in Node.js can
    be triggered whenever documents are changed.

    4. Advertisement servers - Again here you could have thousands of requests to
    pull advertisements from the central server and Node.js can be an ideal framework
    to handle this.

    5. Streaming servers - Another ideal scenario to use Node is for multimedia streaming
    servers wherein clients have requests to pull different multimedia contents from
    this server.


    Node.js is good when you need high levels of concurrency but less amount of dedicated
    CPU time. Best of all, since Node.js is built on javascript, it''s best suited
    when you build client-side applications which are based on the same javascript
    framework.


    # When not to use Node.js


    Node.js can be used for many applications with various purposes, the only scenario
    where it should not be used if there are long processing times which are required
    by the application.


    Node.js is structured to be single threaded. If any application is required to
    carry out some long running calculations in the background. So if the server is
    doing some calculation, it won''t be able to process any other requests.

