    # ## Summary


    +   Using callback functions in Node.js does have its disadvantages. Sometimes
    during the process of development, the nested use of callback functions can make
    the code messier and difficult to maintain.

    - Most of the issues with nested callback functions can be mitigated with the
    use of promises and generators in node.js

    - A Promise is a value returned by an asynchronous function to indicate the completion
    of the processing carried out by the asynchronous function.

    - Promises can be nested within each other to make code look better and easier
    to maintain when many asynchronous function need to be called at the same time.

    - Generators can be used to alleviate the problems with nested callbacks and assist
    in removing what is known as callback hell. Generators are used to halt the processing
    of a function. This is accomplished by usage of the ''yield'' method in the asynchronous
    function.

    - Streams are used in Node.js to read and write data from Input-Output devices.
    Node.js makes use of the ''fs'' library to create readable and writable streams
    to files. These streams can be used to read and write data from files.'
- md: "\nPipes can be used to connect multiple streams together. One of the most common\
    \ example is to pipe the read and write stream together for the transfer of data\
    \ from one file to the other.\n\n- Node.js is often also tagged as an event driven\
    \ framework, and it's very easy to define events in Node.js. Functions can be\
    \ defined which respond to these events.\n\n- Events also expose methods for responding\
    \ to key events. For example, we have seen the once() event handler which can\
    \ be used to make sure that a callback function is only executed once when an\
    \ event is triggered.\n\n## Chapter 8: Testing with Jasmine\n\nTesting is a key\
    \ element to any application. For Node.js, the framework available for testing\
    \ is called Jasmine. In early 2000, there was a framework for testing javascript\
    \ applications called JsUnit. Later this framework got upgraded and is now known\
    \ as jasmine.\n\nJasmine helps in automated unit testing, something which has\
    \ become quite a key practice when developing and deploying modern day web applications.\n\
    \nIn this tutorial, you will learn how to get your environment setup with jasmine\
    \ and how you can start testing your first Node.js application with jasmine.\n\
    \n## Overview of Jasmine for testing Node.js applications\n\nJasmine is a Behavior\
    \ Driven Development(BDD) testing framework for JavaScript. It does not rely on\
    \ browsers, DOM, or any JavaScript framework. Thus, it's suited for websites,\
    \ Node.js projects, or anywhere JavaScript can run. To start using Jasmine, you\
    \ need to first download and install the necessary Jasmine modules.\n\nNext you\
    \ would need to initialize your environment and inspect the jasmine configuration\
    \ file. The below steps show how to setup Jasmine in your environment\n\n**Step\
    \ 1)** Installing the NPM Modules\n\nTo use the jasmine framework from within\
    \ a Node application, the jasmine module needs to be installed first. To install\
    \ the jasmine-node module, run the below command.\n\n```\nnpm install jasmine-node\n\
    ```\n\n**Step 2)** Initializing the project – By doing this, jasmine creates a\
    \ spec directory and configuration json for you. The spec directory is used to\
    \ store all your tests files. By doing this, jasmine will know where all your\
    \ tests are, and then can execute them accordingly. The JSON file is used to store\
    \ specific configuration information about jasmine.\n\nTo initialize the jasmine\
    \ environment, run the below command\n\n```\njasmine init\n```\n\n**Step 3)**\
    \ Inspect your configuration file. The configuration file will be stored in the\
    \ spec/support folder as jasmine.json. This file enumerates the source files and\
    \ spec files you would like the Jasmine runner to include.\n\nThe below screenshot\
    \ shows a typical example of the package.json file for jasmine.\n\n```json\n{\n\
    \"spec_dir\": \"spec\",\n\"spec_files\": [\n  \"**/*[sS]pec.js\"\n],\n\"helpers\"\
    : [\n  \"helpers/**/*.js\"\n],\n\"stopSpecOnExpectationFailure\": false,\n\"random\"\
    : false\n}\n```\n\n![](img/cbcb6538723209554d9dc578069d9e55_95_0.png)\n\n- Note\
    \ that the spec directory is specified here. As noted earlier, when jasmine runs\
    \ it searches for all tests in this directory.\n\n- The next thing to note is\
    \ the spec_files parameter – This denotes that whatever test files are created\
    \ they should be appended with the 'spec' keyword.\n\n## How to use Jasmine to\
    \ test Node.js applications\n\nIn order to use Jasmine to test Node.js applications,\
    \ a series of steps needs to be followed.\n\nIn our example below, we are going\
    \ to define a module which add 2 numbers which need to be tested. We will then\
    \ define a separate code file with the test code and then use jasmine to test\
    \ the Add function accordingly.\n\n**Step 1)** Define the code which needs to\
    \ be tested. We are going to define a function which will add 2 numbers and return\
    \ the result. This code is to be written in a file called \"Add.js.\"\n\n```javascript\n\
    var exports=module.exports={\nexports.AddNumber=function(a,b)\n{\n  return a+b;\n\
    }\n```\n\n### Code Explanation:\n\n1. The \"exports\" keyword is used to ensure\
