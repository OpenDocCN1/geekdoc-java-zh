    \ function(err) {\n      res.send(str);\n      db.close();\n    });\n  });\n});\n\
    var server = app.listen(8080, function() {});\n```\n\n## 总结\n\nNode.js 的 each\
    \ 常与 NoSQL 数据库结合使用，构建许多现代 Web 应用程序。常用的数据库包括 MySQL 和 MongoDB。\n\n- 用于操作 MongoDB\
    \ 数据库的常用模块之一是名为 'MongoDB' 的模块。该模块通过 Node 包管理器安装。\n- 通过 MongoDB 模块，可以查询集合中的记录并执行标准的更新、删除和插入操作。\n\
    - 最后，现代实践之一是使用 express 框架配合 MongoDB 来交付现代应用程序。Express 框架可以利用 MongoDB 驱动返回的数据，并相应地在网页上向用户显示数据。\n\
    \n## 第 7 章：Promise（承诺）、Generator（生成器）、Event（事件）和 Filestream（文件流）\n\n在之前的教程中，你已经见过用于异步事件的回调函数（callback\
    \ functions）。但有时当回调函数开始嵌套时，它们可能会变成噩梦，程序也会变得冗长且复杂。\n\n在这种情况下，Node.js 提供了额外的功能来解决在使用回调函数时遇到的问题。这些功能被分为\
    \ Promises、generates 和 events。在本次教程期间，我们将更详尽地学习和了解这些概念。\n\n## 什么是 promises（承诺）\n\
    \n在我们开始学习 promises 之前，让我们先回顾一下 Node.js 中的“callback”（回调）函数是指什么。在之前的章节中，我们已经见过很多这类回调函数了，所以让我们快速回顾一下其中一个。\n\
    \n下面的示例显示了一个代码段，它用于连接到 MongoDB 数据库并对数据库中的其中一条记录执行更新操作。\n\n```\nvar MongoClient\
    \ = require('mongodb').MongoClient;\nvar url = 'mongodb://localhost/EmployeeDB';\n\
    \nMongoClient.connect(url, function(err, db) {\n  db.collection('Employee').updateOne(\n\
    \    { \"EmployeeName\": \"NewEmployee\" },\n    {\n      $set: { \"EmployeeName\"\
    : \"Mohan\" }\n    }\n  );\n});\n```\n\n- 1. 在上面的代码中，function(err,db) 部分被称为匿名函数或回调函数的声明。当\
    \ MongoClient 创建到与 MongoDB 数据库的连接时，一旦连接操作完成，它将返回回调。在某种意义上，连接操作是在后台执行的，当它完成后，它会调用我们的回调函数。记住，这是\
    \ Node.js 的关键点之一，它允许许多操作并发发生，从而不会阻塞用户执行操作。\n- 2. 第二个代码块是在回调函数实际被调用时执行的内容。回调函数只是更新了我们\
    \ MongoDB 数据库中的一条记录。\n\n那么什么是 promise 呢？嗯，promise 只是 Node.js 中回调函数的增强。\n\n在开发过程中，我们可能需要嵌套回调函数。这会导致代码变得混乱且难以维护。短而言之，promise\
    \ 是一种对回调函数的增强，倾向于。\n\npromise 的基本语法所示：\n\n```\nvar promise = doSomethingAsync()\n\
    promise.then(onFulfilled, Rejected)\n```\n\n- doSomethingAsync 是执行某些处理的回调函数。\n\
    - 这一次，在定义回调时，返回了一个名为 \"promise\" 的值。\n- 当返回一个 promise 时，它可以有两个输出。这是由 'then' 子句定义的。操作成功由\
    \ onFulfilled 表示；它有错误由 Rejected 表示。\n\n**注意：** 所以 promise 的关键方面是返回值。在处理普通回调时，并没有返回值的概念。正因为有了返回值，我们对回调的定义有了更多的控制。\n\
    \n在下一个主题中，我们将看到 promises 的示例以及它们如何从回调中获益。\n\n## Callbacks 到 promises\n\n现在来看如何在\
    \ Node.js 应用程序内部使用 \"promises\" 的示例。为了在 Node.js 应用程序中使用 promises，必须首先下载并安装 'promise'\
    \ 模块。\n\n我们将按照下面的所示修改代码，使用 promises 更新 'Employee' 集合中的一个员工。\n\n### 第 1 步) 安装 NPM\
    \ 模块\n\n在 Node JS 应用程序内部使用 Promises 需要 promise 模块。要安装 promise 模块，请运行下命令\n\nnpm\
    \ install promise\n\n### 第 2 步) 修改代码以包含 promises\n\n```\nvar Promise = require('promise');\n\
    var MongoClient = require('mongodb').MongoClient;\nvar url = 'mongodb://localhost/EmployeeDB';\n\
    \nMongoClient.connect(url)\n  .then(function(err, db) {\n    db.collection('Employee').updateOne({\n\
    \      \"EmployeeName\": \"Martin\"\n    }, {\n      $set: {\n        \"EmployeeName\"\
    : \"Mohan\"\n      }})\n  });\n```\n\n"
