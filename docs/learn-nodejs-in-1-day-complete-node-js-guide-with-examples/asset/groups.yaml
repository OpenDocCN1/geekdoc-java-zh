    \ machine that it requires. \n\nInstead, you can use the install command of npm\
    \ and install your published npm module.\n\nThe following steps need to be followed\
    \ to publish your npm module:\n\n**Step 1)** Create your repository on GitHub\
    \ (an online code repository management tool). It can be used for hosting your\
    \ code repositories.\n\n**Step 2)** You need to tell your local npm installation\
    \ on who you are. Which means that we need to tell npm who is the author of this\
    \ module, what is the email id and any company URL, which is available which needs\
    \ to be associated with this id. All of these details will be added to your npm\
    \ module when it is published.\n\nThe below commands set the name, email and URL\
    \ of the author of the npm module.\n\n`npm set init.author.name \"Guru99.\"`\n\
    \n`npm set init.author.email \"guru99@gmail.com\"`\n\n`npm set init.author.url\
    \ http://Guru99.com`\n\n**Step 3)** The next step is to login into npm using the\
    \ credentials provided in the last step. To login, you need to use the below command:\n\
    \n```\nnpm login\n```\n\n**Step 4)** Initialize your package – The next step is\
    \ to initialize the package to create the package.json file. This can be done\
