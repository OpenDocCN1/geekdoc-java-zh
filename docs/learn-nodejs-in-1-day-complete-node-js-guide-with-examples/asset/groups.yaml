    # # What is the package.json file


    The package.json file is used to hold the metadata about a particular project.
    This information provides the Node package manager the necessary information to
    understand how the project should be handled along with its dependencies.


    The package.json files contains information such as the project description, the
    version of the project in a particular distribution, license information, and
    configuration data.


    The package.json file is normally located at the root directory of a Node.js project.


    Let''s take an example of how the structure of a module looks like when it is
    installed via npm.


