    ## Creating a custom promise\n\nA custom promise can be created by using node\
    \ module called 'q'. The 'q' library needs to be downloaded and installed using\
    \ the package manager. After using the 'q' library, the method \"denodeify\" can\
    \ be called.\n\nIn the example below, we will create a simple function called\
    \ \"Add\" which will add 2 numbers. We will convert this function to return a\
    \ promise.\n\nOnce that is done, we will use the promise returned by the Add function\
    \ to display a message in the console.\n\n### Step 1) Installing the NPM Modules\n\
    \nTo use 'q' from within a Node application, the 'q' module is required. To install\
    \ the 'q' module, run the below command\n\n```bash\nnpm install q\n```\n\n###\
    \ Step 2) Define the following code which will be used to create the custom promise.\n\
    \n```javascript\nvar Q= require('q');\nfunction Add() {\n    var a, b, c;\n  \
    \  a=5;b=6;\n    c=a+b;\n}\nvar Display_promise= Q.denodeify(Add);\nvar promise=Add;\n\
    promise.then(\n{\n{console.log(\"Addition function complete\");}}\n);```\n\n##\
    \ Code Explanation:-\n\n1. The first bit is to include the 'q' library by using\
    \ the require keyword. By using this library, we will be able to define any function\
    \ to return a callback.\n2. We are creating a function Add which will add 2 numbers\
    \ defined in variables a and b. The sum of these values will be stored in variable\
    \ c.\n3. We are now using the q library to dennotify (the method used to convert\
    \ any function into a function that would return a promise) our Add function or\
    \ otherwise convert our Add function to a function which returns a promise.\n\
    4. We now call our \"Add\" function and are able to get a return promise value\
    \ because of the prior step we performed of dennotify the Add function.\n5. The\
    \ 'then' keyword is used specify that if the function is executed successfully\
    \ then display the string \"Addition function completed\" in the console.log.\n\
    \nWhen the above code is run, the output \"Addition function completed\" will\
    \ be displayed in the console.log as shown below.\n\n![](img/cbcb6538723209554d9dc578069d9e55_76_0.png)\n"
  mdcn: "\n\n注意：-\n\n如果你现在检查你的 MongoDB 数据库内容，你会发现如果存在 `EmployeeName` 为 \"Martin\"\
    \ 的记录，它将被更新为 \"Mohan\"。\n\n若要检查数据是否已正确插入数据库，你需要在 MongoDB 中执行以下命令：\n\n1. 使用 `use\
    \ EmployeeDB`\n2. `db.Employee.find({EmployeeName : \"Mohan\"})`\n\n第一条语句确保你已连接到\
    \ EmployeeDb 数据库。第二条语句搜索员工名为 \"Mohan\" 的记录。\n\n## 处理承诺 (Promises)\n\n在定义 promise\
    \ 时，需要注意的是 \"then\" 方法本身会返回一个 promise。\n因此，从某种意义上说，promise 可以相互嵌套或进行链式调用。\n\n\
    在下面的示例中，我们使用链式调用来定义 2 个回调函数，这两个回调函数都会向 MongoDB 数据库插入一条记录。\n\n（注：链式调用是一个用于将方法的执行相互链接起来的概念。假设我们的应用程序有两个名为\
    \ 'methodA' 和 'methodB' 的方法。逻辑是 'methodB' 应该在 'methodA' 之后调用，那么你就可以以这种方式链式执行，使得\
    \ 'methodB' 在 'methodA' 之后直接调用。）\n\n此示例中需要注意的是，通过使用嵌套 promise，代码变得更加简洁、易读且可维护。\n\
    \n```javascript\nvar Promise = require('promise');\nvar MongoClient = require('mongodb').MongoClient;\n\
    var url = 'mongodb://localhost/EmployeeDB';\nMongoClient.connect(url)\n\n.then(function(db)\
    \ {\n  db.collection('Employee').insertOne({\n    EmployeeId: 4,\n    EmployeeName:\
    \ \"NewEmployee\"\n  })\n  .then(function(db1) {\n    db1.collection('Employee').insertOne({\n\
    \      EmployeeId: 5,\n      EmployeeName: \"NewEmployee1\"\n    })\n  })\n});\n\
    ```\n\n## 代码解释：-\n\n1. 我们现在定义了 2 个顺序执行的 \"then\" 子句。在第一个 then 子句中，我们传递了包含数据库连接的\
    \ 'db' 参数。然后，我们使用 'db' 连接的 `collection` 属性向 'Employee' 集合插入记录。使用 `insertOne` 方法将实际的文档插入到\
    \ Employee 集合中。\n2. 接着，我们使用第二个 then 子句也向数据库插入了另一条记录。\n\n如果你现在检查你的 MongoDB 数据库内容，你会发现第\
    \ 2 条记录已插入到 MongoDB 数据库。\n\n## 使用 BlueBird 库生成 promises\n\nBluebird 是一个功能丰富的 JavaScript\
    \ Promise 库。Bluebird 最强大的特性是它允许你对其他 Node 模块进行“Promise 化”（promisify），以便以异步方式使用它们。Promisify\
    \ 是一个应用于回调函数的概念。该概念用于确保每个调用的回调函数都返回某种值。\n\n因此，如果 Node JS 模块包含一个不返回值的回调函数，如果我们对该模块进行\
    \ Promise 化，该特定模块中的所有函数都将自动被修改以确保它们返回值。\n\n你可以使用 Bluebird 让 MongoDB 模块异步运行。这为编写\
    \ Node.js 应用增添了额外的便利。\n\n我们将查看一个如何使用 bluebird 模块的示例。\n\n我们的示例将首先连接到 \"EmployeeDB\"\
    \ 数据库中的 \"Employee collection\"。如果建立了 \"then\" 连接，它将获取集合中的所有记录并相应地在控制台中显示它们。\n\
    \n### 步骤 1) 安装 NPM 模块\n\n要在 Node 应用程序中使用 Bluebird，需要 Bluebird 模块。要安装 Bluebird\
    \ 模块，请运行以下命令\n\n```bash\nnpm install bluebird\n```\n\n### 步骤 2) 下一步是在你的代码中引入 bluebird\
    \ 模块并对整个 MongoDB 数据库进行 Promise 化。通过 promisify，我们的意思是 bluebird 将确保 MongoDB 库中定义的每一个方法都返回一个\
    \ promise。\n\n```javascript\nvar Promise = require('bluebird');\nvar mongo = Promise.promisify(require('mongodb')).MongoClient;\n\
    var url = 'mongodb://localhost/EmployeeDB';\n```\n\n## 代码解释：-\n\n1. `require`\
    \ 命令用于引入 Bluebird 库。\n2. 使用 Bluebird 的 `promisify()` 方法创建 MongoDB 模块的异步版本。这确保了\
    \ MongoDB 模块的每个方法都在后台运行，并确保 MongoDB 库中的每个方法返回 promise。\n\n**步骤 3)** 最后一步是连接到数据库，获取集合中的所有记录并在控制台中显示它们![](img/cbcb6538723209554d9dc578069d9e55_76_0.png)\n\
    \n## 代码解释：-\n\n1. 你会注意到我们使用的是 `connectAsync` 方法而不是普通的连接方法。Bluebird 实际上为 MongoDB\
    \ 库添加了 Async 关键字来区分这些调用，并确保了没有 Async 的方法也能返回值。\n2. 与 `connectAsync` 方法类似，我们现在使用\
    \ `findAsync` 方法返回 mongo 'Employee' 集合中的所有记录。\n3. 最后，如果 `findAsync` 返回一个成功的 promise，我们定义了一个代码遍历集合中的每条记录并在控制台中显示它们。\n\
