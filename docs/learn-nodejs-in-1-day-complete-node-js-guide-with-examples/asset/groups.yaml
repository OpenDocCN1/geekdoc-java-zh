- md: "\nNote:-\n\nIf you now check the contents of your MongoDB database, you will\
    \ find that if a record with EmployeeName of \"Martin\" exists, it will be updated\
    \ to \"Mohan.\"\n\nTo check that the data has been properly inserted in the database,\
    \ you need to execute the following commands in MongoDB\n\n1. Use EmployeeDB own2.\
    \ db.Employee.find({EmployeeName : \"Mohan\"})\n\nThe first statement ensures\
    \ that you are connected to the EmployeeDb database. The second statement searches\
    \ for the record which has the employee name of \"Mohan\".\n\n## Dealing with\
    \ promises\n\nWhen defining promises, it needs to be noted that the \"then\" method\
    \ itself returns a promise.\nSo in a sense, promises can be nested or chained\
    \ to each other.\n\nIn the example below we use chaining to define 2 callback\
    \ functions, both of which insert a\nrecord into the MongoDB database.\n\n(Note:\
    \ Chaining is a concept used to link execution of methods to one another. Suppose\
    \ if our application had 2 methods called 'methodA' and 'methodB'. And the logic\
    \ was such that\n'methodB' should be called after 'methodA,' and then you would\
    \ chain the execution in such a way\nthat 'methodB' gets called directly after\
    \ 'method.')\n\nThe key to note in this example is that the code becomes cleaner,\
    \ readable and\nmaintainable by using nested promises.\n\n```javascript\nvar Promise\
    \ = require('promise');\nvar MongoClient = require('mongodb').MongoClient;\nvar\
    \ url = 'mongodb://localhost/EmployeeDB';\nMongoClient.connect(url)\n\n.then(function(db)\
    \ {\n  db.collection('Employee').insertOne({\n    EmployeeId: 4,\n    EmployeeName:\
    \ \"NewEmployee\"\n  })\n  .then(function(db1) {\n    db1.collection('Employee').insertOne({\n\
    \      EmployeeId: 5,\n      EmployeeName: \"NewEmployee1\"\n    })\n  })\n});\n\
    ```\n\n## Code Explanation:-\n\n1. We are now defining 2 \"then\" clauses which\
    \ get executed one after the other. In the first\nthen clause, we are passing\
    \ the 'db' parameter which contains our database connection.\nWe are then using\
    \ the collection property of the 'db' connection to insert records into the\n\
    'Employee' collection. The insertOne method is used to insert the actual document\
