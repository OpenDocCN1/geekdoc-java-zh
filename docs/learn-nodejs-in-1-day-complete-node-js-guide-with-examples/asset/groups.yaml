    var server = app.listen(8080, function() {});\n```\n\n## Summary\n\nNode.js each\
    \ used in conjunction with NoSQL databases to build a lot of modern web applications.\
    \ Some of the common databases used are MySQL and MongoDB.\n\n- One of the common\
    \ modules used for working with MongoDB databases is a module called 'MongoDB.'\
    \ This module is installed via the Node package manager.\n- With the MongoDB module,\
    \ it's possible to query for records in a collection and perform the normal update,\
    \ delete and insert operations.\n- Finally, one of the modern practices is to\
    \ use the express framework along with MongoDB to deliver modern day applications.\
    \ The Express framework can make use of the data returned by the MongoDB driver\
    \ and display the data to the user in the web page accordingly.\n\n## Chapter\
    \ 7: Promise, Generator, Event and Filestream\n\nIn previous tutorials, you would\
    \ have seen callback functions which are used for Asynchronous events. But sometimes\
    \ callback functions can become a nightmare when they start becoming nested, and\
    \ the program starts to become long and complex.\n\nIn such cases, Node.js provides\
    \ additional features to rectify problems which are encountered when using callbacks.\
    \ These are classified into Promises, generates and events. During the course\
    \ of this tutorial, we will learn and see these concepts in further detail.\n\n\
    ## What are promises\n\nBefore we start with promises, let's first revisit what\
    \ are \"callback\" functions in Node.js. We have seen these callback functions\
    \ a lot in the previous chapters, so let's quickly go through one of them.\n\n\
    The example below shows a code snippet, which is used to connect to a MongoDB\
    \ database and perform an update operation on one of the records in the database.\n\
    \n```\nvar MongoClient = require('mongodb').MongoClient;\nvar url = 'mongodb://localhost/EmployeeDB';\n\
    \nMongoClient.connect(url, function(err, db) {\n  db.collection('Employee').updateOne(\n\
    \    { \"EmployeeName\": \"NewEmployee\" },\n    {\n      $set: { \"EmployeeName\"\
    : \"Mohan\" }\n    }\n  );\n});\n```\n\n- 1. In the above code, the part of thefunction(err,db)\
    \ is known as the declaration of an anonymous or callback function. When the MongoClient\
    \ creates a connection to the MongoDB database, it will return to the callback\
    \ once the connection operation completed. In a sense, the connection operations\
    \ happens in the background, and when it is done, it calls our callback function.\
    \ Remember that this is one of the key points of Node.js to allow many operations\
    \ to happen concurrently and thus not block any user from performing an operation.\n\
    - 2. The second code block is what gets executed when the callback function is\
    \ actually called. The callback function just updates one record in our MongoDB\
    \ database.\n\nSo what is a promise? Well, a promise is just an enhancement to\
    \ callback functions in Node.js. So what is a promise? Well, a promise is just\
    \ an enhancement to callback functions in Node.js.\n\nDuring the development,\
    \ we may need to\n\nnest callback functions together. This can get kind of messy\
    \ and difficult to maintain at certain point. In short, a promise is an enhancement\
    \ to callbacks that looks towards.\n\nThe basic syntax of a promise is shown below:\n\
    \n```\nvar promise = doSomethingAsync()\npromise.then(onFulfilled, Rejected)\n\
    ```\n\n- \"doSomethingAsync\" is any callback function which does some processing.\n\
    - This time, when defining the callback, there is a value which is returned called\
    \ \"promise.\"\n- When a promise is returned, it can have 2 outputs. This is defined\
    \ by the 'then' clause. Either the operation can be success is is denoted by onFulfilled.\
    \ it can have error which is denoted by Rejected.\n\n**Note:** So the key aspect\
    \ of a promise is the return value. There is no concept of a return value when\
    \ working with normal callbacks. Because of the return value, we have more control\
    \ of how the callback can be defined.\n\nIn the next topic, we will see an example\
    \ of promises and how they benefit from callbacks.\n\n## Callbacks to promises\n\
    \nNow let's look at an example of how we can use \"promises\" from within a Node.js\
    \ application. In order to use promises in a Node.js application, the 'promise'\
    \ module must first be downloaded and installed.\n\nWe will then modify our code\
    \ as shown below, which updates an Employee in the 'Employee' collection by using\
    \ promises.\n\n### Step 1) Installing the NPM Modules\n\nTo use Promises from\
