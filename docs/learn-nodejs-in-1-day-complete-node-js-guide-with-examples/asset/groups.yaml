  - '[PAGE 72]


    # Generating promises with the BlueBird library


    Bluebird is a fully-featured Promise library for JavaScript. The strongest feature
    of Bluebird is that it allows you to "promisify" other Node modules in order to
    use them asynchronously. Promisify is a concept applied to callback functions.
    This concept is used to ensure that every callback function which is called returns
    some sort of value.


    So if a Node JS module contains a callback function which does not return a value,
    if we Promisify the node module, all the function''s in that specific node module
    would automatically be modified to ensure that it returns a value.


    You can use Bluebird to make the MongoDB module run asynchronously. This adds
    another level of ease when writing Node.js applications.


    We will look at an example of how to use the bluebird module.


    Our example will first establish a connection to the "Employee collection" in
    the "EmployeeDB" database. If "then" connection is established, then it will get
    all of the records in the collection and display them in the console accordingly.


    Step 1) Installing the NPM Modules


    To use Bluebird from within a Node application, the Bluebird module is required.
    To install the Bluebird module, run the below command


    ```

    npm install bluebird

    ```


    Step 2) The next step is to include the bluebird module in your code and promisify
    the entire MongoDB database. By promisify, we mean that bluebird will ensure that
    each and every method defined in the MongoDB library returns a promise.


    ```

    var Promise = require(''bluebird'');

    var mongoClient = Promise.promisifyAll(require(''mongodb'')).MongoClient;

    var url = ''mongodb://localhost/EmployeeDB'';

    ```'
