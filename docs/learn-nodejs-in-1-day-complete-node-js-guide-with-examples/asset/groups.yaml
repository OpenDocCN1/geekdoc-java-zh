    # Chapter 4: Create Server and Get Data


    The Node.js framework is mostly used to create server based applications. The
    framework can easily be used to create web servers which can serve content to
    users.


    There are a variety of modules such as the "http" and "request" module, which
    helps in processing server related requests in the web server space. We will have
    a look at how we can create a basic web server application using Node js.'
  - "[PAGE 36]\n\n# Node as web server using HTTP\n\nLet's look at an example of how\
    \ to create and run our first Node js application.\n\nOur application is going\
    \ to create a simple server module which will listen on port no 7000. a request\
    \ is made through the browser on this port no, then server application will send\
    \ a 'Hello' World' response to the client.\n\n```\nvar http=require('http')\n\
    var server=http.createServer((function(request, response)\n{\n  response.writeHead(200,\n\
    \  \"Content-Type\" : \"text/plain\"\n  response.end(\"Hello World\\n\");\n}));\n\
    server.listen(7000);\n```\n\n# Code Explanation:\n\n+   1. The basic functionality\
    \ of the require function is that it reads a javascript file, executes the file,\
    \ and then proceeds to return the exports object. So in our case, since we want\
    \ to use the functionality of the http module, we use the require function to\
    \ get the required functions from the http module so that it can be used in our\
    \ application.\n2. In this line of code, we are creating a server application\
    \ which is based on a simple function. This function is called whenever a request\
    \ is made to our server application.\n3. When a request is received, we are saying\
