    \ way that it acts as a minimal and flexible Node.js web application framework,\
    \ providing a robust set of features for building single and multipage, and hybrid\
    \ web application.\n\n# What is Express.js\n\nExpress.js is a Node js web application\
    \ server framework, which is specifically designed for building single-page, multi-page,\
    \ and hybrid web applications.\n\nIt has become the standard server framework\
    \ for node.js. Express is the backend part of something known as the MEAN stack.\n\
    \nThe MEAN is a free and open-source JavaScript software stack for building dynamic\
    \ web sites and web applications which has the following components;\n\n1) MongoDB\
    \ - The standard NoSQL database\n2) Express.js - The default web applications\
    \ framework\n3) Angular.js - The JavaScript MVC framework used for web applications\n\
    4) Node.js - Framework used for scalable server-side and networking applications.\n\
    \nThe Express framework makes it very easy to develop an application which can\
    \ be used to handle multiple types of requests like the GET, PUT, and POST and\
    \ DELETE requests.\n\n# Installing and using Express\n\nExpress gets installed\
    \ via the Node Package manager. This can be done by executing the following line\
    \ in the command line\n\n```bash\nnpm install express\n```\n\nThe above command\
    \ requests the Node package manager to download the required express modules and\
    \ install them accordingly.\n\nLet's use our newly installed Express framework\
    \ and create a simple \"Hello World\" application.\n\nOur application is going\
    \ to create a simple server module which will listen on port 3000. In our example,\
    \ if a request is made through the browser on this port no, server application\
    \ will send a 'Hello World' response to the client.\n\n```javascript\nvar express=require('express');\n\
    var app=express();\napp.get('/', function(req, res)\n{\n    res.send('Hello World!');\n\
    }\n);\nvar server=app.listen(3000, function() {});\n```\n\n# Code Explanation:\n\
    \n1. In our first line of code, we are using the require function to include the\
    \ \"express module\".\n2. Before we can start using the express module, we need\
    \ to make an object of the express module.\n3. Here we are creating a callback\
    \ function. This function will be called whenever anybody browses to the root\
    \ of our web application which is http://localhost:3000 . The callback function\
    \ will be used to send the string \"Hello World\" back to the page.\n4. In the\
    \ callback function, we are sending the string \"Hello World\" back to the client.\
    \ The 'res' parameter is used to send content back to the web page. This 'res'\
    \ parameter is something that is provided by the 'request' module to enable one\
    \ to send content back to the web page.\n5. We are then using the listen to function\
    \ to make our server application listen to client requests on port 3000. You can\
    \ specify any available port over here.\n\nThe command is executed successfully,\
    \ the following Output will be shown when you\n\n**Output:**\n\n![](img/cbcb6538723209554d9dc578069d9e55_37_0.png)\n\
    \nFrom the output,\n\n- You can clearly see that if we browse to the URL of localhost\
    \ on port 7000, you will see the string 'Hello World' displayed in the page.\n\
    - Because in our code we have mentioned specifically for the server to listen\
    \ on port no 7000, we are able to view the output when browsing to this url.\n\
    \n# What are Routes\n\nRouting refers to determining the way in which application\
    \ responds to a client. For example,\n\n```javascript\napp.METHOD(PATH, HANDLER)\n\
    ```\n\nWherein,\n\n1) app is an instance of express\n2) METHOD is an HTTP method\
    \ (GET, PUT, DELETE)\n3) PATH is a path\n4) HANDLER is the function executed when\
    \ the route is matched.\n\nLet's look at an example of how we implement routes\
    \ in express. Our example will create 3 routes as:\n\n1. /Node route which will\
    \ display \"Tutorial on Node\" if this route is accessed\n2. /Angular route which\
    \ will display \"Tutorial on Angular\" if this route is accessed\n3. A default\
    \ route / which will display \"Welcome to Guru99.\"\n\nOur basic code remains\
    \ the same as the previous examples. The below snippet is to show how routing\
    \ is implemented.\n\n```javascript\napp.route('/Node').get(function(req, res)\n\
    {\n    res.send(\"Tutorial on Node\");\n});\napp.route('/Angular').get(function(req,\
    \ res)\n{\n    res.send(\"Tutorial on Angular\");\n});\napp.get('/', function(req,res)\n\
    {\n    res.send('Welcome to Guru99.');\n}\n```\n\n# Code Explanation:\n\n1. Here\
    \ we are defining a route if the URL http://localhost:3000/Node is selected in\
    \ the browser. To the route, we are attaching a callback function which will be\
    \ called when we browse to the Node URL.\n\nThe function has 2 parameters.\n\n\
    - The main parameter we will be using is the 'res' parameter which can be used\
    \ to send information back to the client.\n- The 'req' parameter has information\
    \ about the request being made, and hence the 'req' parameter can be used to find\
    \ the additional parameters being sent.\n\n2. We are using the send function to\
    \ send the string \"Tutorial on Node\" back to the client if the Node route is\
    \ chosen.\n\n3. Here we are defining a route if the URL http://localhost:3000/Angular\
    \ is selected in the browser. To the route, we are attaching a callback function\
    \ which will be called when we browse to the Angular URL.\n\n4. We are using the\
    \ send function to send the string \"Tutorial on Angular\" back to the client\
    \ if the Angular route is chosen.\n"
  mdcn: "\n\n![](img/cbcb6538723209554d9dc578069d9e55_37_0.png)\n\n从输出中，\n\n- 你可以清楚地看到，如果我们浏览到\
