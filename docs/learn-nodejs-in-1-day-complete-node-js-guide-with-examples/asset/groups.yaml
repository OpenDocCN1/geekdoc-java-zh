    When working with JavaScript web based applications, one will normally hear here
    of the term MEAN stack.


    +   - The term MEAN stack refers to a collection of JavaScript based technologies
    used to develop web applications.

    - MEAN is an acronym for MongoDB, ExpressJS, AngularJS and Node.js.


    Hence, it''s always good to understand how Node.js and MongoDB work together to
    deliver applications which interact with backend databases.


