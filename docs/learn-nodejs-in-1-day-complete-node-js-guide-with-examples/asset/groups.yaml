    \ There are many frameworks available in the market for making templates. In our\
    \ case, we will take the example of the jade framework for templating.\n\nJade\
    \ gets installed via the Node Package manager. This can be done by executing the\
    \ following line in the command line\n\n```bash\nnpm install jade\n```\n\nThe\
    \ above command requests the Node package manager to download the required jade\
    \ modules and install them accordingly.\n\nLet's use our newly installed jade\
    \ framework and create some basic templates.\n\n**Step 1)** The first step is\
    \ to create a jade template. Create a file called index.jade and insert the below\
    \ code\n\n```html\nhtml\nhead\n  title!=title\nbody\n  h1=message\n```\n\n1. Here\
    \ we are specifying that the title of the page will be changed to whatever value\
    \ is passed when this template gets invoked.\n2. We are also specifying that the\
    \ text in the header tag will get replaced to whatever gets passed in the jade\
    \ template.\n\n```javascript\nvar express=require('express');\nvar app=express();\n\
    \napp.set('view engine', 'jade');\n\napp.get('/',function(req,res) {\n  res.render('index',\
    \ {\n    title: 'Guru99', message: 'Welcome'\n  });\n});\nvar server=app.listen(3000,function()\
    \ {});\n```\n\n# Code Explanation:\n\n- 1. The first thing to specify in the application\
    \ is \"view engine\" that will be used to render the templates. Since we are going\
    \ to use jade to render our templates, we specify this accordingly.\n- 2. The\
    \ render function is used to render a web page. In our example, we are rendering\
    \ the template (index.jade) which was created earlier.\n- 3. We are passing the\
    \ values of \"Guru99\" and \"Welcome\" to the parameters \"title\" and \"message\"\
    \ respectively. These values will be replaced by the 'title', and 'message' parameters\
    \ declared in the index.jade template.\n\nIf the command is executed successfully,\
