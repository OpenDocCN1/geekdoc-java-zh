    +   - If a GET request is made for the first URL, then the response should ideally
    be a list of books.

    - If the GET request is made for the second URL, then the response should ideally
    be a list of Students.

    - So based on the URL which is accessed, a different functionality on the web
    server will be invoked and accordingly the response will be sent to the client.
    This is the concept of routing.


    Each route can have one or more handler functions, which are executed when the
    route is matched.


    The general syntax for a route is shown below


    ```

    app.METHOD(PATH, HANDLER)

    ```


    Wherein,


    +   1) app is an instance of the express module

    2) METHOD is an HTTP request method (GET, POST, PUT or DELETE)

    3) PATH is a path on the server.

    4) HANDLER is the function executed when the route is matched.


    Let''s look at an example of how we can implement routes in express. Our example
    will create 3 routes as'
  - '[PAGE 45]


    +   1. /Node route which will display the string "Tutorial on Node" if this route
    is accessed


    +   2. /Angular route which will display the string "Tutorial on Angular" if this
    route is accessed


    +   3. A default route / which will display the string "Welcome to Guru99 Tutorials."


    Our basic code remains the same as the previous examples. The below snippet is
    to show how routing is implemented.


    ```

    app.route(''/Node'').get(function(req.res)

    {

    res.send("Tutorial on Node");

    });app.route(''/Angular'').get(function(req.res)

    {

    res.send("Tutorial on Angular");

    });app.get(''/'', function(req,res)

    {

    res.send(''Welcome to Guru99 Tutorials'');

    }

    ```


    # Code Explanation:


    +   1. Here we are defining a route if the URL http://localhost:3000/Node is selected
    in the browser. To the route, we are attaching a callback function which will
    be called when we browse to the Node URL.


    The function has 2 parameters.


    +   - The main parameter we will be using is the ''res'' parameter which can be
    used to send information back to the client.

    - The ''req'' parameter has information about the request being made, and hence
    the ''req'' parameter can be used to find the additional parameters being sent.


    +   2. We are using the send function to send the string "Tutorial on Node" back
    to the client if the Node route is chosen.


    +   3. Here we are defining a route if the URL http://localhost:3000/Angular is
    selected in the browser. To the route, we are attaching a callback function which
    will be called when we browse to the Angular URL.


    +   4. We are using the send function to send the string "Tutorial on Angular"
    back to the client if the Angular route is chosen.'
