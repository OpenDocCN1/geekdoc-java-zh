  md: 'It became apparent that a different way of programming computers was


    needed. The existing way of working was too close to the machine’s way of


    operating; the programmer was being forced to think at too low a level. This led


    to the development of the first programming languages expressed in a form


    that was more convenient to human programmers.


    This was an improvement but it was not ideal. Every computer had its own


    language and programming any computer was still a complex and time-


    consuming task. A language was needed that would be easier to use and that


    could be used on any computer. A “high level” language was needed.


    This idea had been seen before. At the end of the Second World War Konrad


    Zuse had developed a high level language that he called Plankalkul. This was


    never implemented, but it remains as the first high level programming


    language ever described.


    The first language to be implemented and used was FORTRAN, first released


    in 1957. FORTRAN was designed mainly for mathematical applications and


    was highly *portable*; FORTRAN programs would run unaltered on many differ-


    ent types of computers. Languages based closely on the original version of


    FORTRAN are still popular for many mathematical applications today.


    Many more languages followed. Some were designed to be truly general-


    purpose and others were designed for particular types of application. Notable


    languages include:


    Lisp


    Lisp was designed specifically for List Processing applications. It is


    still used today in some areas of artificial intelligence.


    Algol


    Algol offered programmers the ability to express algorithms in a


    neat and concise way. In many ways it is the earliest ancestor of Java.


    COBOL


    COBOL was designed for applications in business. It offered sophis-


    ticated features for processing large files of data to produce the sorts


    of reports that managers needed. Decisions made in the develop-


    ment of COBOL programs in the early years of computing led to


    most of the panic surrounding the “Y2K Crisis” at the start of this


    century.


    BASIC


    As programming languages developed there was a need to train new


    programmers. BASIC was a language designed for beginners; it


    included all the features of most other languages and was a fine


    learning tool. Most of the early home microcomputers in the 1980s


    provided a version of BASIC as their programming language.


    Simula


    Simula was a special-purpose language, designed to carry out simu-


    lations in applications such as queuing theory. In a way it is also an


    ancestor of Java as it introduced the concept of an object.


    **Java**


    We come now to Java. Java is the latest in a proud family of languages. Its


    origins can probably be traced back to a language called BCPL. BCPL was


    developed at Cambridge University in the late 1960s as an alternative to


    FORTRAN. BCPL was developed by Martin Richards while he was visiting the


    Massachusetts Institute of Technology (MIT); it became widely used by those


    working on the new Unix operating system there.


    *Programming*


    15'
