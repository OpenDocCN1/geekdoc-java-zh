    private double value;


    That’s all there is to it.


    **Methods**


    In contrast the methods are the *public* face of the class. Methods will be used
    to


    allow access to the values of the private attributes; this will include changing


    them as well as retrieving them and displaying them. Before worrying about


    the intricacies of this, let’s get together the statements for a simple method.


    The first method in this example does little more than display the values of


    the attributes in some neat format. We have seen the Java for displaying a value:


    System.out.println ("hello, world!");


    which would display the text between the quotes as shown:


    *hello, world!*


    This can also be used to display the value of an attribute. The trick is to leave


    the quotes out. So this:


    System.out.println (name);


    would print whatever string was currently stored in that attribute. The state-


    ments to print out the values of the attributes of a duck are then just:


    System.out.println (name);


    System.out.println (age);


    System.out.println (value);


    This is admittedly not very neat, but it will do for now. It would also be a good


    plan to provide a user with some information on what the values represent.


    This is another simple statement (with quotes needed this time), and completes


    the statements needed for this method:


    System.out.println ("The details of the duck are:");


    System.out.println (name);


    System.out.println (age);


    System.out.println (value);


    Now the method needs a name. *display* would seem a reasonable choice. A


    method also has to be declared. In the last chapter we saw that this involves


    specifying the name of the method and the type of the value that it returns. This


    simple method will return nothing at all (so it is a void method), which in Java


    is represented as void. The method can now be declared:


    void display


    Remembering that it is public:


    public void display


    *A first look*


