    299


    **Other ways of testing**


    So far all the testing described has concentrated on providing input values and


    examining the output values. If the output values are as expected then the pro-


    gram is assumed to work for that particular test case. In this process the


    program itself has been treated as a “black box”, which is precisely what this


    type of testing is called. The program is a black box in that its inner workings


    are never examined; if it produces the correct output then it is assumed to work.


    Black Box testing is usually effective but thorough testing requires that the


    program itself be examined. To see why this can be necessary consider this


    example:


    int first, second;


    System.out.print ("Enter the first number : ");


    first = Console.readInt ();


    System.out.print ("Enter the second number : ");


    second = Console.readInt ();


    int total = first + first;


    System.out.println ("The total is " + total);


    You can probably immediately see the error in this program. If you can’t, look


    closely at the calculation just before the final output line. The error is easy
    to see


    but only because the program code is available. This program would pass some


    test cases in any black box testing; cases where the two numbers input were the


    same would appear to work. It is even possible that a poorly written black box


    test plan would lead someone to assume that the program did indeed work as


    expected.


    Testing by examining the program is called “White Box” testing. The pro-


    gram is now a white box and its statements are available to be examined. There


    are two possible approaches to white box testing. Both involve examining a


    printout of the program rather than running it on a computer.


    The first approach is to “dry run” the program. This involves taking a test


    case and going through the program by hand, keeping track of the values of all


    the variables and of what is output. In a way this is the same as black box test-


    ing because the final output is available but the advantage is that all the inter-


    mediate values are available too. This process can also be a very useful tactic


    when debugging a program rather than testing it.


    The other approach is similar but involves two people. The idea is that some-


    one, probably the programmer, “walks through” the program with someone


    else. The walkthrough involves explaining each line of the program in turn and


    explaining the possible routes through, much like a dry run. The process of


    working through the program can often highlight errors or reveal cases that


    have not been considered. The programmer is rarely the best person to test a


    program and should certainly not be allowed to test the program alone. The


    presence of another person makes the testing more likely to be thorough.


    **Black box or white box?**


    Both these approaches to testing have their advantages. White box testing can


    often find errors in programs that black box testing cannot and can sometimes


    show up holes in the black box test plan. A black box test can only ever show


    the presence of an error in the program, it can never show for certain exactly'
