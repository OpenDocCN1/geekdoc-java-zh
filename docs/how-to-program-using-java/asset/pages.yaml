  md: "*Collections*\n\n239\n\nemerges that the variable args in the header of the\
    \ main function:\n\npublic static void main (Strings args\\[\\])\n\nis in fact\
    \ an array of strings.\n\nNow we also know that the first command line argument\
    \ is stored in\n\n*args\\[0\\]*, which shows us that the index value starts at\
    \ 0. This means that the\n\nlast element in an array might not be quite where\
    \ it is expected to be!\n\nAn unwary programmer wanting to assign a value to the\
    \ fourth element of\n\nthe* numbers* array might write:\n\nnumbers\\[4\\] = 1878;\
    \ // Error!\n\nThis illustrates an important property to remember when dealing\
    \ with arrays.\n\nIn Java (as in most programming languages), arrays are indexed\
    \ from 0\n\nupwards. So the first element of the array is referred to using index\
    \ 0. Similarly,\n\nthe eleventh element has index 10. More generally, an array\
    \ with *n* elements has\n\nthe first element at index 0 and the last element at\
    \ index *n**1*.\n\nThe value used in the array declaration is the size of the\
    \ array, not the index\n\nof the last element. This is a frequent cause of confusion,\
    \ and new programmers\n\noften find themselves trying to access the fifth element\
    \ of a 4-element array, \n\nfor example. And even experienced programmers aren’t\
    \ immune from this \n\n(if they’re truthful!).\n\nIt follows that the number of\
    \ elements in the array is a number that is \n\nboth useful and interesting. Java\
    \ lets us extract this value, as we will see in a\n\nmoment.\n\nFrequently, if\
    \ this “out-by-one” error exists in your code, your program will\n\ncrash when\
    \ you try to run it and will provide an error message complaining\n\nabout something\
    \ called an ArrayIndexOutOfBoundsException. This error\n\ntells you that the Java\
    \ interpreter has tried to access an index larger than the size\n\nof the array.\
    \ The compiler will not stop you from trying to go past the end of\n\nthe array\
    \ (it isn’t possible to spot that this is going to happen when the program\n\n\
    is compiled), so this is something the programmer needs to take care of, as\n\n\
    many a good program has been flawed by this kind of error. The effects of this\n\
    \nerror range from simply crashing at inopportune moments to computing the\n\n\
    wrong result and continuing blindly on.\n\nAssuming you follow the advice given\
    \ in the chapter on testing, these errors\n\nshould be ironed out fairly easy,\
    \ but it is worth pointing out anyway.\n\nNow for a larger, more useful example.\
    \ Here’s a simple program that makes\n\nuse of an array.\n\n/\\* ArrayDemo.java\
    \ – demonstrating a simple array\n\nAuthor\n\n: GPH\n\nDate\n\n: 6th February\
    \ 2003\n\nTested on : Linux (Red Hat 8.0), JDK 1.4.1\n\n\\*/\n\nimport htpuj.\\\
    *;\n\npublic class ArrayDemo\n\n{\n\nprivate String names\\[\\];\n\npublic ArrayDemo\
    \ (int numElements)\n\n{\n\nnames = new String\\[numElements\\];\n\n}"
