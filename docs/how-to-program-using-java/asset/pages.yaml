  md: 'The book starts with a bit of background and a quick history


    lesson. Before you start to learn to program it’s important that


    you understand what a computer program really is. You’ll learn


    that programs are all around us in all sorts of surprising places.


    Programming has developed over many years. Over this time


    there have been many different approaches and many differ-


    ent languages. Java is the programming language you’ll use.


    In order that you appreciate why it is as it is we’ll also have a


    brief history of programming and of Java itself.


    You are going to learn to write programs. You are also going


    to have to learn how to make your computer execute your


    programs to make them actually do something. You are going


    to have to know how to find the results that your programs


    produce.


    What precisely you have to do will depend a lot on the com-


    puter system that you’re going to use; you might be using


    Microsoft Windows, Unix or even something else. I don’t really


    mind.


    This chapter gives you the general idea of how to create and


    execute a program and will tell you what you need to find out


    and where to find it. It explains what goes on behind the


    scenes when you prepare to run one of your programs.


    There are some important things that you will need to get hold


    of before starting to learn to program. This chapter explains


    what these are and points you in the right direction to find them.


    There is also a very quick introduction to a Java program-


    ming environment that many new programmers have found


    meets their needs – *BlueJ*.


    As well as physical things (like a computer!) this chapter


    also goes through some of the problems that some people


    have when they learn to program and explains what you need


    to do to avoid them.


    Java is an example of something called an *object-oriented* (and


    not object-*orientated* – let’s get that right from the start!)


    programming language. In fact everything in Java (even the


    program itself, in a way) is an object. This chapter explains


    what this means by explaining precisely what an object is and


    how you might identify one.


    Objects have special properties called *attributes* and* methods*.


    This chapter also explains what these are and how you can


    choose the correct set for the types of object in your programs.


    Before anyone can write a program someone must decide


    precisely what the program should do. This involves *analysis*


    of the problem that the program is going to address and *design*


    of the solution.


    This is really only a book about programming but you will


    also need to be able to do some basic analysis and design. You


    will need, for example, to analyse a problem you have been


    given to solve and then design a solution. This chapter


    explains what you need to know to do just that.


    *Chapter 5*


    *A word on*


    *analysis and*


    *design*


    *Chapter 4*


    *Objects. The*


    *building block*


    *Chapter 3*


    *Before you start*


    *Chapter 2*


    *The mechanics*


    *Chapter 1*


    *Programming*


    *What this book is*


