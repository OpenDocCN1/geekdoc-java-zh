  md: "84\n\n*How to program using Java*\n\nProgramming is a structured task that\
    \ requires a structured approach. A pro-\n\ngrammer must build on a thorough understanding\
    \ of a problem to produce \n\na program; a program must never be developed before\
    \ the problem that it is\n\nintended to solve has been fully analysed. A programmer\
    \ must follow this\n\nprocess strictly.\n\nYou may well find that as you become\
    \ more and more confident in Java \n\nyou will include fewer and fewer comments\
    \ in your programs. You may be\n\ntempted at first to comment almost every line,\
    \ and this is fine. As you learn\n\nmore you will come to realise that this is\
    \ not really necessary as there are some\n\nlines that every programmer will understand.\
    \ Don’t be afraid to let your style\n\nevolve and adapt.\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_101_0.png)\n\
    \n**7.1**\n\nFind another Java book and look at some of the example programs.\
    \ See if\n\nyou can pinpoint the differences between the style in that book and\
    \ in this.\n\n**7.2**\n\nFind out if you are required for some reason to use a\
    \ particular style as\n\nyou learn to write Java. If you are, find out what the\
    \ differences are between the\n\nstyle that you will use and the style used in\
    \ this book.\n\n**7.3**\n\nInvestigate any facilities that your Java system might\
    \ have for automatically\n\nformatting your Java programs. Do you need to customise\
    \ any of these features?\n\n**7.4**\n\nIf you can, get hold of Java programs written\
    \ by two or more different\n\nexperienced programmers. What common features can\
    \ you see in these two\n\nstyles? Do you prefer one to the other? Even though\
    \ you are still a novice\n\nprogrammer, how much of the programs can you follow?\
    \ Does the style help?\n\nHow about the comments?\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_101_1.png)"
