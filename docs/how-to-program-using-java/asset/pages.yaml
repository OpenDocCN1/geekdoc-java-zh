  md: "**header block (or history block)*** Comments* found at the top of a *source\
    \ code* file,\n\ncontaining information about who wrote the *class* or* program*\
    \ and when, plus \n\nany important changes made to the *code*, and usually a short\
    \ description of its\n\npurpose.\n\n**high level programming*** Programming* in\
    \ a language such as Java, using a high\n\nlevel language that is easy for humans\
    \ to understand.\n\n**identifier** The name used to uniquely identify a *variable*\
    \ within a *program*.\n\n**increment** To increase the value of an *integer variable*\
    \ by one.\n\n**indentation** Use of *whitespace* to make *source code* easier\
    \ for a *programmer* to read.\n\n**indeterminate loop** A control *loop* which\
    \ executes until a given *condition* is satisfied.\n\nThe eventual number of iterations\
    \ through the *loop* cannot necessarily be deter-\n\nmined at the time of the\
    \ first iteration.\n\n**index** A variable’s position within a *string, array*\
    \ or* vector*.\n\n**infinite loop** A* loop* whose exit *condition* can never\
    \ be satisfied, and therefore \n\nexecutes forever. This is almost always *programmer*\
    \ error.\n\n**initialiser list** A list of values used to initialise an *array*.\n\
    \n**instantiation** The process of creating an *object* or* variable* of a certain\
    \ *type*.\n\n**integer** A number with no decimal part.\n\n**interactive (or integrated)\
    \ development environment (IDE)** A piece of software\n\nwhich combines an *editor*\
    \ and* compiler* (and usually a *debugger*) to aid in the rapid\n\ndevelopment\
    \ of *programs*.\n\n**interface** The specification of a *class’s methods*, indicating\
    \ how a *programmer* can use\n\nthat* class* in a *program*.\n\n**interpreter**\
    \ Reads* bytecode* and instructs the computer to perform some tasks.\n\n**iterate**\
    \ To repeat a process until some condition is met. To process every element of\n\
    \nan* array* in turn, for example.\n\n**jar file (or jar archive)** A sort of\
    \ file containing a *package* or a group of packages,\n\nbundled together for\
    \ convenience.\n\n**.java file** Text file containing the *source code* for Java\
    \ *classes* or* programs*.\n\n**Java Development Kit (JDK)** A software bundle\
    \ containing a Java *compiler*,* inter-*\n\n*preter*,* debugger*, and other assorted\
    \ tools, plus a whole host of predefined *classes*,\n\nand usually copious amounts\
    \ of *API* and tutorial documentation. Sometimes\n\nreferred to as the *SDK (Software\
    \ Developers’ Kit)*.\n\n**Java Virtual Machine (JVM)** An* interpreter* for the\
    \ Java programming language.\n\n**library** A group of *classes* provided by other\
    \ *programmers*, offering useful function-\n\nality. The Java term for this is\
    \ a *package*.\n\n**list** A structure, an *array list*, for example, used for\
    \ holding a collection of related\n\nobjects.\n\n**listing** See* hard copy*.\n\
    \n**literal value** A simple value used in an *assignment*. For example, any *string*\
    \ value,\n\nor 1, or 3.142, or the character “c”.\n\n**local variable** A* variable*\
    \ created within a *method*, which only exists for the lifetime\n\nof that *method*.\n\
    \n**loop** A block of *statements* executed repeatedly. The number of executions\
    \ is con-\n\ntrolled by a *control statement*.\n\n**low level programming** Programming\
    \ at the machine level, perhaps using \n\nswitches and levers.\n\n**method** A\
    \ block of code which corresponds to a particular task in the real-world\n\nproblem\
    \ we are trying to represent. An example would be a code to alter the\n\nname\
    \ of a “person” *object*.\n\n**method call** A* statement* which causes a *method*\
    \ to be executed.\n\n**methodology** A particular way of carrying out a task.\
    \ In programming terms, this\n\ncould be a way of analysing a problem, or a way\
    \ of testing a *class*.\n\n**modulus** The remainder operator, represented as\
    \ %.\n\n**mutator** A* method* which is used to alter the value of an *attribute*\
    \ of an *object*.\n\n*Glossary*\n\n351"
