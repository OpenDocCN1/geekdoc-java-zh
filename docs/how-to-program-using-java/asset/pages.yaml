  md: "binary language of computers¹^ and computers find it equally difficult to\n\
    \nunderstand natural human language. A computer programming language is\n\nsomething\
    \ of a halfway house between the two; it’s something that both\n\nhumans and computers\
    \ can understand. In many ways the language is not\n\nquite exactly halfway; it’s\
    \ usually rather closer to the human’s side than to the\n\ncomputer’s. This means\
    \ that some special software is needed to translate the\n\nprogram into a form\
    \ that the computer can execute. This translation is a process\n\ncalled* compilation*.\
    \ This is the process that is explained in this chapter.\n\nBut first a word about\
    \ the computer environment that you’re going to use.\n\n**The “Local Guide”**\n\
    \nComputer systems are all different. This is a book about programming and Java\n\
    \nand I don’t want all the details of many different computer systems to get in\
    \ the\n\nway. I certainly don’t want this book to be useful only to people using\
    \ a\n\nparticular type of computer system.\n\nIf you read the introduction, you’ll\
    \ remember that I’m going to have to\n\nassume that you have a document that I’m\
    \ going to call the *Local Guide*. This\n\nguide might be a manual that came with\
    \ the system or it might be something\n\nspecially written for you as part of\
    \ a course. I’m going to assume that it will\n\nexplain to you how to create and\
    \ run programs on the computer system that\n\nyou’re using. I don’t mind what\
    \ that system is just as long as it’s capable of\n\nrunning standard Java. What\
    \ exactly it is doesn’t matter at all in the rest of \n\nthis book.\n\nWhat I’m\
    \ going to describe now is the process that happens whenever any\n\nprogram is\
    \ created and run on any computer. This process is essentially the\n\nsame on\
    \ every platform.\n\n**Creating and naming a program**\n\nA program exists in\
    \ a file on a computer system. Each file on the system has a\n\nunique name,²^\
    \ consisting of a memorable name for the file and sometimes an\n\nextension:\n\
    \n*memorable.ext*\n\nThe* file extension* normally indicates what type the file\
    \ is. You may well be famil-\n\niar with .*doc* files that contain Microsoft Word\
    \ documents, for example, or .*jpg*\n\nfiles that contain images. The extension\
    \ for a Java source file must be .*java*\n\n(hence these are often simply referred\
    \ to as .*java files*), and using any other\n\nextension for a Java program is\
    \ likely to produce a compiler error.\n\nThese are possible names for Java programs:\n\
    \n*Program.java*\n\n*Ducks.java*\n\n*Elvis.java*\n\nThe extension should never\
    \ be left off. Doing so will probably cause errors.\n\nIdeally the name of the\
    \ file should give some indication of the purpose of the\n\n22\n\n*How to program\
    \ using Java*\n\n1\n\nAlthough this is precisely what the users of early computers\
    \ had to do. A switch that was\n\non was a 1, and one that was off was a 0, for\
    \ example.\n\n2\n\nWell, unique in its own directory or folder."
