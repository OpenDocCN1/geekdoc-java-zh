  md: '*More methods*


    235


    be explicitly included. The slightly more complicated situation is a reference


    parameter. A reference parameter is always a reference to an object; this refer-


    ence is passed into the method, which can make use of the object’s initial attrib-


    utes. The same object in the computer’s memory is used in the method as in the


    main program and so any changes made to the object in the method also affect


    the corresponding object in the main program.


    Value parameters allow values to be passed into a method. Reference param-


    eters extend this somewhat in that they can allow values to be passed out of a


    method, or into and out of a method. However, it must be remembered that this


    will only work with objects, not primitive data types such as int or char.


    Any valid Java may be used in a method, including conditional statements


    and loops. You should now be able to use all the Java that you have learned so


    far and you should be able to write complex methods and classes.


    As you write more complicated classes your programs will also become more


    complex and longer. You may well find that a program of several hundred lines


    is quite difficult to edit and manage; it can be awkward to keep track of the


    ever-increasing number of variables in your code. Thankfully, Java, as with


    most languages, provides various mechanisms for grouping similar variables


    together into collections, allowing you to refer to any one of a group of variables


    via a common name. This is what we will look at in the next chapter.'
