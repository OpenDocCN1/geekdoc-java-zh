  md: "*Making things happen. Again and again*\n\n205\n\nand at the end of each execution\
    \ 1 is added to *i* (the change statement). The\n\npractical result of this is\
    \ that in this case the loop will execute 10 times as \n\n*i* moves from 0 to\
    \ 9 inclusive. It is usual to start loops that count in this way\n\nwith an initial\
    \ value of 0.¹\n\nThe statements controlled by the loop are enclosed in the usual\
    \ curly \n\nbrackets:\n\n*for (**initialisation statement**;* *continuation condition**;*\
    \ *change statement**) {*\n\n*// statements*\n\n*}*\n\nAs usual the statements\
    \ are indented to emphasise the fact that they are inside\n\nthe loop. Any Java\
    \ statements may appear inside the loop, including condi-\n\ntional statements\
    \ and other loops.\n\nThe variable declared in the initialisation is called the\
    \ loop’s *control variable*.\n\nIt can be of any data type but it is most usually\
    \ an integer. It does not necessar-\n\nily have to be declared inside the first\
    \ line of the loop, but it most usually is.\n\nThe control variable is often used\
    \ inside the loop. For example, to print the\n\nfirst 10 integers (starting at\
    \ 0, of course) the loop would be:\n\nfor (int i = 0; i < 10; i ++ ) {\n\nSystem.out.println\
    \ (i);\n\n}\n\nA slightly more useful loop prints out the 12 times table:\n\n\
    for (int i = 1; i < 13; i ++ ) {\n\nSystem.out.print (i);\n\nSystem.out.print\
    \ (\" x 12 = \");\n\nSystem.out.println (i \\* 12);\n\n}\n\nThis loop generates\
    \ a lot of output for a small amount of code. This is the power\n\nof loops. This\
    \ program might also remind you of Buddy’s “Times Table” \n\nprogram from Chapter\
    \ 9; we’ll look at how that program can be rewritten with\n\na loop later on.\n\
    \nWhile the control variable can be used in any statement inside the loop there\n\
    \nare two important rules:\n\n1\\. The control variable should never be altered\
    \ inside the loop. It should be\n\naltered only when an execution of the statements\
    \ inside the loop has ended.\n\n2\\. If the control variable is declared in the\
    \ header of the loop it cannot be used\n\nonce the loop has terminated.\n\nIf\
    \ it is necessary to use the value of the control variable after the loop has\
    \ \n\nfinished it can be declared before the loop:\n\nint i;\n\nfor (i = 0; i\
    \ < 10; i + + ) {\n\nSystem.out.println (i);\n\n}\n\n// i can be used here\n\n\
    1\n\nRemember that computers start to count at 0, not 1!"
