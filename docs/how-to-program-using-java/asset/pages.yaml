    *How to program using Java*


    An important thing to notice in passing is the different syntax for calling the


    methods of the parameter as opposed to the current object. Only the first


    requires a prefix.


    This method is all well and good, and would work, but there is a potentially


    neater way of writing it. There is no need to store the two values in variables;


    the methods that generate them could just be used as parameters to the method:


    public void summon (Duck d)


    {


    d.moveTo (getX (), getY() );


    }


    This is certainly neater, not to mention shorter.


    **Example 3 – The rusty trolley**


    *Mr Martinmere is concerned about a dangerous-looking supermarket trolley that
    has*


    *appeared in the pond where Elvis and his friends live. He is especially worried
    that one*


    *of the (valuable) birds may swim into the trolley and so sustain an injury that
    would*


    *reduce their value*.


    *He would like a program that will track each of his ducks and will tell him how
    *


    *far away they are from the trolley. The program should also warn him if a duck
    hits the*


    *trolley*.


    *In order to test the program Elvis has once again been fitted with a tracking
    device.*


    *The pond is marked out in units of one metre, and the trolley is in the water
    at coordi-*


    *nates 5, 3*.


    *The program should prompt Mr Martinmere to enter the direction in which the track-*


    *ing device indicates that Elvis has moved. It should then display his distance
    from *


    *the trolley and should print a warning if he is closer than two metres from it.
    It would*


    *provide another warning if he actually swims into it*.


    *What class would be needed for this program? What does the program look like?*


    A* Duck* class similar to that in Chapter 13 will be needed for this program.


    There will need to be two private attributes, one for the x position and one for


    the y position. It will also be handy to store the name of the duck, so the


    program can be used to track several ducks without confusion. The following


    methods will also be needed:


    public void moveNorth ()


    public void moveSouth ()


    public void moveEast ()


    public void moveWest ()


    public void setX (int newX)


    public void setY (int newY)


    public int getX ()


    public int getY ()


    public double distanceFrom (int xPos, int yPos)


    public boolean atPosition (int xPos, int yPos)


    The implementation of these methods is straightforward. The *distanceFrom*


    method is the same as in the previous example, and *atPosition* is as in the


    first example in this chapter.'
