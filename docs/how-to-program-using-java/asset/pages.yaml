  md: 'Some of these can be eliminated at once. “program”, “administration”, and


    “fact”, for example, are clearly nothing to do with object types. Proper nouns


    can also usually be eliminated; they refer to a particular instance of an object


    type that is very probably already covered elsewhere. Finally, some nouns will


    actually be attributes of other objects; here “name”, “age”, and “approximate


    value” clearly fall into this category. The list is now much shorter:


    ●the nature reserve


    ●Mr Martinmere


    ●Mr Martinmere’s family


    ●birds


    ●ducks


    ●coots


    ●geese


    ●dog


    ●nature reserve buying a bird


    Information about the tasks to be carried out by the program will enable the


    list to be trimmed further. “Mr Martinmere’s family” is only mentioned in pass-


    ing, so that can be removed. Much the same goes for the ranger himself and the


    reserve itself. Finally “birds” is a general term that covers the ducks, coots,
    and


    geese; it can also be removed.¹^ This gives a final shortlist:


    ●ducks


    ●coots


    ●geese


    ●dog


    ●nature reserve buying a bird


    The description also provides the information that the ranger would never


    sell his dog or the geese. Given the nature of the program it might be reason-


    able to leave them out, but then again the ranger might change his mind in the


    future. Part of the analysis process would be to go back to the ranger and ask


    for more details and a more detailed description of the problem. This would


    allow a sensible and informed decision to be taken.


    For the moment the assumption will be that neither is required; this seems


    reasonable on the basis of the limited information currently available. The list


    becomes:


    ●ducks


    ●coots


    ●nature reserve buying a bird


    The final step is to choose the names for the object types. Singular names are


    customary, so ducks becomes “duck” and so on. The current name for the object


    type representing the reserves that buy animals is rather unwieldy; this could


    be changed to simply “reserve”. The final list of object types in this problem


