  md: '**1.1**


    If you have access to the World-Wide Web look up some information


    about some of the main figures in the development of C, C, Java, and object-


    oriented programming. Dennis Ritchie, Brian Kernighan, Bjarne Stroustrup,


    and James Gosling all have homepages that can be found quickly and easily.


    There’s a list of web search engines at the back of the book.


    **1.2**


    An important part of your development as a computer programmer is


    that you know something about other figures whose work has been funda-


    mental to the development of programming. Use the web to find out more


    about Charles Babbage, Lady Ada Lovelace, Alan Turing, and Grace Hopper.


    **1.3**


    In this chapter a recipe for chocolate cake was shown as an example of an


    everyday thing that has some of the same characteristics as a computer pro-


    gram. List at least two other everyday things that have the same characteristics.


    **1.4**


    Look around you know. What things around you have computer


    programs inside them? Who do you imagine wrote them, and how?


    **1.5**


    If you have access to a computer running Microsoft Windows press


    *Control-Alt-Delete* and click on *Task Manager*. Under the “Applications”


    tab you’ll find a list of the programs running on the computer. See if you can


    discover what some of them do.


    **1.6**


    Alternatively, if you have a Unix system, type *top* at the shell prompt and


    look at the output. This shows you all the processes (programs) running on the


    computer. See if you can find out what some of them actually do.


    18


    *How to program using Java*


    ![](img/05fa4bae6319441a0b86c0179baaedc2_35_0.png)


    Once again the C, C, and Java are the same, which is to be expected as C


    is a development of C (in fact all valid C programs are also valid C pro-


    grams) and Java is based closely on C. But the examples in the other two


    languages look very similar, as would examples in many more languages.


    Remember this. You are not just learning Java. You are learning to program


    and you are learning principles that you will be able to apply in many other


    languages.'
