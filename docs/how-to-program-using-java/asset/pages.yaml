    The only line of this code that requires any explanation is the body of the


    *inputMessage* method. Rather than taking a string value as an argument,


    here we prompt the user to enter the message for Bruce’s sign via another dia-


    logue box. This is the simplest way to obtain user input via a GUI, and is


    extremely useful. The showInputDialog method returns the text entered as a


    String object, and the message attribute is set to this value.


