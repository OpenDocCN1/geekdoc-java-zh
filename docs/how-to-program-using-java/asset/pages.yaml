    predictable format:


    *public**return type**method name** ()*


    Selectors must be defined in the public part of the class, or they would be of


    very little use! They do not have parameters so there is also an empty set of


    brackets. The return type, which is the type of the attribute that is being


    returned, is added to the start of the line. A common convention, and one that


    is used in all the programs here, is that the name of the selector method is made


    up of the word *get* followed by the identifier of the attribute that is returned.


    For example, in a simple *Duck* class, the *getName* method would return the


    name of the duck, a string:


    public String getName ()


    The implementation of a selector is usually only one line. The value required
    is


    just returned. So in this example:


    public String getName ()


    {


    return name;


    }


    A similar example could be used to provide the value of a duck:


    public double getValue ()


    {


    return value;


    }


    In both these examples, the selector is returning a value that is presumably


    stored explicitly in an attribute. But selectors do not necessarily have to return


    a value that is actually stored in the private part of the class. It can sometimes


    be useful and very powerful to implement selectors that do not do this; selec-


    tors can return a value that is derived from one or more of the other values in


    the class. You might remember that we suspected that some of the *getValue*


    methods that we have met before were doing just this when the value was


    based on a complex formula.


    Suppose that a user of a *Duck* class often wanted to use the values of the duck


    after some tax (calculated as some known percentage of the actual value) had


    been added. One approach to this would be to add a new private attribute to


    store the price plus tax and to allow access to it via a suitable pair of a selector


    and mutator. There is a drawback with this; the value and the value after tax
    are


    the same information stored in different ways and so the mutator that changed


    one would have to change the other. If the value were reduced then the value


    after tax would have to be reduced too. This is a needlessly complex solution


    and one that would be best avoided.


    Far better would be to simply create a new selector to return the value after


    tax. This can be added to the header file:


    public double getValuePlusTax ()


    and, assuming that the rate of tax is stored in the *final* variable* TAX\_RATE*,
    it


    can be implemented:


    public double getValuePlusTax ()


