  md: "*Collections*\n\n243\n\nThe problem is that in most programming languages,\
    \ including Java, arrays\n\nhave a fixed size; once they are initialised, they\
    \ have the same number of ele-\n\nments throughout. To add more elements it is\
    \ necessary to create a new, larger\n\narray and to copy the elements between\
    \ the two. If elements are removed, the\n\narray will still occupy the same amount\
    \ of memory space, which can be waste-\n\nful, especially in large and complex\
    \ programs. Of course, a smaller array can be\n\ncreated and the elements copied\
    \ but this can be time consuming. Something a\n\nlittle more sophisticated is\
    \ needed if the size of a collection is going to change.\n\nIn general terms,\
    \ most programming languages provide some such collection,\n\nknown as a *list*.\n\
    \nA Java ArrayList is just such a structure. It allows the programmer to\n\ndynamically\
    \ allocate more storage should the number of elements grow, and\n\nreduce the\
    \ allocation should fewer elements be needed for some reason. There\n\nare also\
    \ plenty of handy functions available for searching and so on.\n\nIt shouldn’t\
    \ come as a surprise that an array list is defined as a class, and the\n\nuseful\
    \ functions are methods. One effect of this is that this section is also an\n\n\
    introduction to using the Java built-in classes, and a reminder of the importance\n\
    \nof delving in the API for the required documentation.\n\nThe API documentation\
    \ can be found a few clicks away from *http://*\n\n*java.sun.com/.* The documentation\
    \ first provides a list of the standard Java\n\npackages. ArrayList is found in\
    \ the java.util package, so a bit of scrolling\n\nis needed. Clicking through\
    \ to the java.util page gives (among other things)\n\na list of all the classes\
    \ in the package, and clicking ArrayList provides all we\n\ncould possibly want\
    \ to know about array lists. Much of this is intended more\n\nfor programmers\
    \ planning to implement a Java system; the important bit for\n\nour purposes is\
    \ the list of methods a little way down.\n\nYou can read all this at your leisure.\
    \ You could also have a look round \n\nfor other classes that might be useful;\
    \ Vector, for example, is another class for\n\nstoring collections.\n\nWe have\
    \ seen that ArrayList is part of the java.util package, so if \n\na program is\
    \ planning to use an array list it is necessary to add the import\n\nstatement:\n\
    \nimport java.util.ArrayList;\n\nto the start of any program. Now let’s use one.\n\
    \n*Creating an array list*\n\nThe documentation also reveals that the constructor\
    \ for this class is overloaded.\n\nWe’ll make do with just two of these constructors;\
    \ an array list can be created\n\nwith an initial default capacity of 10, or it\
    \ can be created with some other \n\ncapacity.\n\nThe format for using the first\
    \ version is as you should have come to expect\n\nby now:\n\n*ArrayList <identifier>\
    \ = new ArrayList();*\n\nand the second is only slightly different:\n\n*ArrayList\
    \ <identifier> = new ArrayList(<capacity>);*\n\nAs with any other object, an array\
    \ list is referred to by an identifier. This \n\ndeclaration calls the appropriate\
    \ constructor which takes care of allocating"
