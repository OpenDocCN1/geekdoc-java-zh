  md: 'The exercises in the previous chapter introduced you informally to the task
    of


    identifying objects in a real-world problem. You should now have some


    experiencing of suggesting the objects that might be used in a program to solve


    some problem; you should also be able to make some suggestions for possible


    attributes and methods of the objects you identify.


    This chapter takes this a little further to suggest a framework that will allow


    you to carry out this important task in a structured way. Before this book moves


    on to describe features of Java, it is important that you realise the crucial
    impor-


    tance of good program design. You must understand that, before any program


    is written, the problem area should be carefully investigated and analysed and


    the solution carefully designed. It can be a costly mistake to start writing a


    program before you have properly understood the problem.


    After reading this chapter you should have a basic idea of how to identify


    possible objects and object types in a problem area. You should be able to take


    a description of a problem and use it to create a list of object types, together


    with their attributes and methods. You should be able to present this in a way


    that would be useful to a programmer setting out to implement your solution.


    *A word on analysis and design*


    53


    ![](img/05fa4bae6319441a0b86c0179baaedc2_70_0.png)![](img/05fa4bae6319441a0b86c0179baaedc2_70_1.png)


    A computer program is written to solve a particular problem or to carry out a


    particular task. Before this program can be written there are two important tasks


    that must be carried out. First, the problem must be carefully analysed, and then


    the solution must be designed. Sometimes more than one solution will be


    designed to allow the programmers a choice. The activity of analysing a prob-


    lem and designing a solution is normally called “Systems Analysis”, and those


    who specialise in this task are called “Systems Analysts” or just “Analysts”.
    It is


    common in today’s IT industry for the programmer and analyst to be the same


    person (an “Analyst Programmer”) but this is not always the case.'
