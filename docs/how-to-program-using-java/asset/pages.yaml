  md: "*Making things happen. Again and again*\n\n209\n\n**do … while**** loops**\n\
    \ndo… while loops are a specialised form of while loop. In fact any\n\ndo … while\
    \ loop can always be written as a while loop.²^ The only advantage\n\nof this\
    \ type of loop is that the resulting code can be neater. The relationship\n\n\
    between these two types of indeterminate loop is not unlike that between the\n\
    \nif statement and the switch statement – it is possible to get by with only one,\n\
    \nbut using both makes for neater programs.\n\nThe statements inside a do … while\
    \ loop are always executed at least once.\n\nThe loop is once again controlled\
    \ by a condition but this time the condition is\n\ntested only after the statements\
    \ inside the loop have been executed; if the con-\n\ndition is true then the loop\
    \ is executed once again. The format of the loop makes\n\nthe location of the\
    \ test clear:\n\n*do {*\n\n*// statements*\n\n*} while (<condition>);*\n\nAs is\
    \ now very familiar, the statements inside the loop are enclosed with braces\n\
    \nand are indented. Also as usual, the statements may include any valid Java\n\
    \nstatements, including other loops.\n\ndo … while loops may also be used to validate\
    \ values entered by a user.\n\nTheir use for this is reasonable since the user\
    \ is always going to have to enter\n\nthe value at least once and therefore the\
    \ statements in the loop will always be\n\nexecuted at least once.\n\nA do … while\
    \ loop can be used to validate user input:\n\ndo {\n\nSystem.out.print (\"Enter\
    \ a number between 1 and 10: \");\n\naNumber = Console.readInt ();\n\nif (aNumber\
    \ < 1 || aNumber > 10) {\n\nSystem.out.println(\"Error: Number out of range\"\
    );\n\n}\n\n} while (aNumber < 1 || aNumber > 10);\n\nThis is obviously very similar\
    \ to the example using a while loop and there is \n\nlittle to choose between\
    \ the two. Both include some duplication of code; the\n\nwhile loop example has\
    \ two System.out.print statements and this version\n\nhas the condition tested\
    \ twice. The two are equivalent; the choice of which to use\n\nin a particular\
    \ application would come down to the usual matter of style and\n\ntaste.³\n\n\
    This observation applies to most cases where an indeterminate loop is used.\n\n\
    If it is obvious that the loop will always be executed at least once then a\n\n\
    do … while loop is the correct choice, but many programs could equally be\n\n\
    written with either form of loop.\n\n**A final warning about == and =**\n\nFinally,\
    \ a word about a very common error. Very often an indeterminate loop\n\nexecutes\
    \ as long as some variable has a particular value. This is most commonly\n\n2\n\
    \nAnd indeed, vice versa.\n\n3\n\nIt’s interesting that I tend to prefer the do\
    \ … while version but everyone I work \n\nwith seems to use the while version.\
    \ It really is just down to style and preference – \n\nprogramming style can be\
    \ a very personal thing."
