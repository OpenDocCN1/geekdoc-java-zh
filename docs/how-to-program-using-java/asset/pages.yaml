  md: "This is a fine source of information because it’s constantly updated with \n\
    \nall the latest changes and additions to the language. The documentation for\
    \ \n\nthe Java *Application Programming Interface* (API) is a couple of clicks\
    \ away from\n\nthe main page, and provides you with all the information you need\
    \ to use all the\n\nfeatures of Java. Much of this documentation is, of course,\
    \ way beyond the\n\nscope of the Java you’re going to see and use for some time\
    \ yet, but all you need\n\nis there and using this fine resource is a useful habit\
    \ to get into from the start.\n\nYou obviously also need a computer to run all\
    \ this fine Java that you are\n\ngoing to create. You need something that will\
    \ run your programs (and let you\n\ncreate them, of course) and will show you\
    \ the output that they produce. You\n\nneed a JVM. For writing and executing the\
    \ Java that you will meet in this book\n\njust about any sort of computer will\
    \ do; you don’t need anything especially\n\npowerful. A printer so that you can\
    \ print out your programs and draw all over\n\nthem would help, but it’s not vital.\n\
    \nYour computer needs to have a Java compiler installed; you learned what one\n\
    \nof these was in the previous chapter. You need to know how to get the compiler\n\
    \nto compile your program to produce the bytecode that the JVM needs, and you\n\
    \nneed to know how to get the JVM to run this compiled version. There are a great\n\
    \nmany Java systems and compilers available all of which are very different to\
    \ use.\n\nAs I said in the last chapter I’m going to have to assume that you have\
    \ a *Local*\n\n*Guide* that explains how to use your compiler and the rest of\
    \ your system.\n\nYou will also need a text editor to create the files that will\
    \ contain your\n\nprograms. You might be using an integrated system, so this might\
    \ be part of the\n\nwhole system that also includes your compiler or it might\
    \ be a totally separate\n\nthing. You will need to know how to use your editor\
    \ to create your programs\n\nand how to get them from the editor to the compiler\
    \ and into the JVM. Once\n\nmore, there are lots of editors that you might have\
    \ available so I’ll have to\n\nassume that your *Local Guide* explains all the\
    \ details of that.\n\nIf you are missing a compiler or an editor there are plenty\
    \ of places where\n\nyou can get them without spending any money. You can check\
    \ the Further\n\nReading section at the back of this book for a list of web sites\
    \ where you can\n\ndownload some pretty good free compilers and editors and for\
    \ a way to get\n\nhold of them if you don’t have access to the Internet.\n\nIf\
    \ you don’t have a Java programming environment at the moment, one that\n\nyou\
    \ might want to take a look at is called BlueJ. This is available as a free down-\n\
    \nload from *http://www.bluej.org/*. BlueJ is a Java environment designed\n\n\
    specifically for people who are learning to program. The download comes with\n\
    \nall the things you need to write and compile programs together with a fine set\n\
    \nof examples. It’s available for most types of computers, and all you need to\n\
    \nknow about it is included in the download.\n\nAs well as all the technical stuff\
    \ you will also need access to an expert or\n\nideally to more than one! This\
    \ is someone who can already program and who is\n\nready and willing to help you.\
    \ If things get tough this is the person you should\n\nbe seeking out. There will\
    \ be times when you just can’t work out why your\n\nprogram is producing the wrong\
    \ answers and you need someone who can help\n\nyou work out what’s wrong. You\
    \ might not need help very often but most new\n\nprogrammers will need some help\
    \ and advice at some point while they learn.\n\nGet yourself an expert or two\
    \ and make sure you know how to get hold of them.\n\nIf you can’t find one in\
    \ person, there are many excellent question-and-answer\n\nsites on the web (including\
    \ one on the main Java site), and these are a fine, if\n\nslightly less interactive,\
    \ alternative.\n\n*Before you start*\n\n33"
