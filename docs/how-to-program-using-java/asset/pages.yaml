  md: "240\n\n*How to program using Java*\n\npublic void populate ()\n\n{\n\n// Using\
    \ a for loop, assign a value to each element in turn\n\nfor (int i = 0; i<names.length;\
    \ i++) {\n\nSystem.out.print (\"Enter name \" + (i+1) + \": \");\n\nnames\\[i\\\
    ] = new String (Console.readString () );\n\n}\n\n}\n\npublic void printContents\
    \ ()\n\n{\n\nSystem.out.println (\"\");\n\n// Using another for loop, print out\
    \ the values in turn\n\nfor (int j = 0; j<names.length; j++) {\n\nSystem.out.println\
    \ (\"names\\[\" + j + \"\\] = \\\\\"\" + names\\[j\\]\n\n\\+ \"\\\\\".\");\n\n\
    }\n\n}\n\npublic static void main (String args\\[\\])\n\n{\n\nif(args.length !=\
    \ 1) {\n\nSystem.out.println (\"Usage: java ArrayDemo <num of names>\");\n\nSystem.exit\
    \ (0);\n\n}\n\nint numNames = Integer.parseInt (args\\[0\\]);\n\nArrayDemo demo\
    \ = new ArrayDemo (numNames);\n\ndemo.populate ();\n\ndemo.printContents ();\n\
    \n}\n\n}\n\nThis small class and driver program demonstrates almost everything\
    \ you\n\nneed to know about arrays. The first thing the program does is check\
    \ that a sin-\n\ngle command line argument has been passed at runtime:\n\nif(args.length\
    \ != 1) {\n\nSystem.out.println (\"Usage: java ArrayDemo <num of names>\");\n\n\
    System.exit (0);\n\n}\n\nThis demonstrates how to find the length of an array:\n\
    \n*<arrayname>.length*\n\nThis is very useful, and it is well worth remembering.\
    \ It is also worth remember-\n\ning that there are no brackets after length, which\
    \ is perhaps a little confusing.\n\nNow back to the program. If the required argument\
    \ is not present, an error\n\nstring is printed and execution halts. If the argument\
    \ is present, this is convert-\n\ned into an int value, and used in the creation\
    \ of the program object:\n\nint numNames = Integer.parseInt (args\\[0\\]);\n\n\
    ArrayDemo demo = new ArrayDemo (numNames);\n\nIt is worthwhile noting here that\
    \ the array is initialised within the constructor.\n\nThis sort of action is commonplace\
    \ – the constructor is frequently used to \n\ninitialise variables at the time\
    \ the object is created, and can remove the need for\n\ncalling the constructor\
    \ together with several mutator methods."
