  md: '*Classes and objects*


    153


    You’ve now seen quite a lot of Java. You’ve seen how to create a class and how


    to create instances of the class (objects), and how to use these objects in very


    simple programs. This has all been a bit informal, though, so the time has come


    to have a proper look and to get some practice in writing your own programs.


    This chapter and the last one start you on the way to doing that.


    You might want to go and take a quick look again at Chapter 6 when we had


    a first look at how to declare and use a class in Java, and at the chapters that


    have described how to do input and output. We’re now going to build on those


    ideas to create complete object-oriented programs.


    This chapter takes the basic Java statements that you have learned up to this


    point and shows you how the programming ideas that you have used and prac-


    tised so far can be extended to produce Java programs that make use of classes


    and objects. After reading this chapter you will understand how to create and


    use objects in a Java program. You should be able to read a Java class’s imple-


    mentation file, understand it, and make use of the class that the file contains
    in


    your own programs.


    ![](img/05fa4bae6319441a0b86c0179baaedc2_170_0.png)


    There are two stages to developing an object-oriented program. The first is to


    define the class and the second is to develop the program that uses it. This chap-


    ter is interested in the second of these stages; we’ll concentrate on reading
    the


    definition of a class (found in the* .java* file) and writing a program that uses


    it. We looked at the other stage in the previous chapter, of course.


    The ability to split programming into these to fairly distinct pages is, of


    course, an advantage of object-oriented programming; a programmer can make


    use of class that some other programmer has written, and these two program-


    mers can be working at the same time. Obviously the programmer using the


    class must first understand exactly what the class does and how it works.


    ![](img/05fa4bae6319441a0b86c0179baaedc2_170_1.png)'
