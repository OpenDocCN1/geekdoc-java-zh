    \ \n\ntime the loop is reached, including the first.\n\nwhile loops are often\
    \ used to make sure that the values entered by users are\n\nas expected. If the\
    \ user enters an invalid value a while loop can be used to pro-\n\nvide an error\
    \ message and repeat the prompt until an acceptable value is pro-\n\nvided:\n\n\
    int aNumber;\n\nSystem.out.print (\"Enter a number between 1 and 10: \");\n\n\
    aNumber = Console.readInt ();\n\nwhile (aNumber < 1 || aNumber > 10) {\n\nSystem.out.println\
    \ (\"Error: Number out of range\");\n\nSystem.out.print (\"Enter a number between\
    \ 1 and 10: \");\n\naNumber = Console.readInt ();\n\n}\n\nThe condition\n\naNumber\
    \ < 1 || aNumber > 10\n\ndefines the state when the number entered is out of the\
    \ required range and\n\ntherefore invalid. The loop is executed only if the first\
    \ attempt to enter the \n\nnumber is invalid and it will repeat until a valid\
    \ number is entered:\n\n*Enter a number between 1 and 10: ****15***\n\n*Error:\
    \ Number out of range*\n\n*Enter a number between 1 and 10: ****20***\n\n*Error:\
    \ Number out of range*\n\n*Enter a number between 1 and 10: ****7***\n\nThis produces\
    \ a much neater dialogue between the user and the program. If the\n\nuser makes\
    \ a mistake they have the chance to correct the error immediately\n\nrather than\
    \ having to run the whole program again.\n\nCare must be taken that the value\
    \ of the condition changes at some point in\n\nthe loop. For example, this loop\
    \ will never terminate:\n\nint aNumber = 10;\n\nwhile (aNumber >= 10) {\n\nSystem.out.print(\"\
    The number is \" + aNumber);\n\naNumber ++ ;\n\n}\n\nHere the value of *aNumber*\
    \ will keep increasing and the value of the Boolean\n\nexpression controlling\
    \ the loop (that *aNumber* must be greater than or equal \n\nto 10) will always\
    \ be true. The loop is an *infinite loop*. In some very unusual \n\nsituations\
    \ an infinite loop is what is required, but such situations are very rare.\n\n\
    If you find yourself with a program that never seems to end, it’s always a good\n\
    \nidea to check for infinite loops.\n\nSometimes the statements inside a while\
    \ loop will not be executed at all. If\n\nthe condition is initially false, then\
    \ control skips past the loop and the state-\n\nments are never executed. There\
    \ are times, however, when it is clear beforehand\n\nthat the statements inside\
    \ the loop will always need to be executed at least once.\n\nIn this case there\
    \ is an alternative form of indeterminate loop that can handle\n\nthis situation\
    \ more elegantly."
