  md: "*A first class*\n\n139\n\nof information are required to specify a method in\
    \ a *.java* file. These are the\n\nname of the method, the type of the value that\
    \ it determines (if any), and \n\nthe types of any values that it processes (the\
    \ parameters).\n\nThe format for declaring a method is not unlike the declaration\
    \ of an attribute:\n\n*visibility* *type determined* *name of method** (**types\
    \ of values processed**)*\n\nAgain, *visibility* corresponds to the method’s *scope*\
    \ (public or private),\n\nand it is usually (but not always) the case that a method\
    \ has public scope.\n\nThis definition itself provides a complete definition of\
    \ the method. For exam-\n\nple we will soon meet a program that tracks ducks on\
    \ the pond. It stores their\n\nposition and often calculates how far they have\
    \ strayed from a particular point.\n\nA method to determine a duck’s distance\
    \ from a point might be declared:\n\npublic double distanceFrom (int dx, int dy)\n\
    \nThis should, of course, be extended with a suitable comment if something is\
    \ not\n\nabsolutely clear.\n\nThe types and identifiers of values processed by\
    \ the method are specified in\n\na comma-separated list; if there are no values\
    \ this list is just left blank (but\n\nthe brackets remain). The values inside\
    \ the brackets are called the *parameters*\n\nof the method, or sometimes the\
    \ *arguments*. A method may also automatically\n\nmake use of any of the attributes\
    \ in the private part of the class (and also any\n\nof the other methods); the\
    \ parameters are used to provide additional values.\n\nThe type of value that\
    \ the method determines is called the *return type* of the\n\nmethod.\n\nAll this\
    \ means that the method definition can be dissected. It tells us that the\n\n\
    method determines a floating-point value, is called *distanceFrom* and takes\n\
    \ntwo integer values as parameters. Even though there is no comment, with some\n\
    \nknowledge of the likely application we can deduce that this method calculates\n\
    \nthe distance that a duck is from a particular point on the pond, with the distance\n\
    \nbeing determined as a floating-point value.\n\nSome methods do not return a\
    \ value. This explains the need for a data type,\n\nvoid, that indicates this.\
    \ A method that does not return a value is defined as if\n\nit was returning a\
    \ void value. So:\n\npublic void changeName (String newName)\n\ndefines a method\
    \ that changes a duck’s name, a process that does not involve\n\nreturning an\
    \ interesting or useful value. This is a *void method*.\n\nA definition of a method\
    \ contains a lot of information. This information\n\nis vital for the programmer\
    \ who will be writing programs that will make use\n\nof the class and its methods.\
    \ A programmer must be able to read a class defini-\n\ntion file and understand\
    \ precisely what it conveys about the interface of\n\nthe class.\n\n**Public and\
    \ private data**\n\nAs we have said, a .*java* file defining a class is, by convention\
    \ at least, split into\n\ntwo parts. These two parts specify the attributes and\
    \ methods that a class pos-\n\nsesses. We have also mentioned a special property\
    \ known as scope. We shall\n\nnow discuss *public* and* private* scope (there\
    \ is a third, protected, which we \n\nwill look at briefly in the very last chapter)."
