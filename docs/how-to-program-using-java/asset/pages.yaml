  md: "*Programming (don’t panic!)*\n\n85\n\nGood and consistent programming style\
    \ is as important as a sensible \n\nstructured approach. The guidelines for good\
    \ style can be summarised in five\n\ngolden rules:\n\n*1.*\n\n*Work on one part\
    \ of a program at a time. Get it right and then go to the next one.*\n\n*Never\
    \ work on many parts of a program at once!*\n\n*2.*\n\n*If you have added twenty\
    \ lines to your program, compile it and check that your *\n\n*syntax is correct.\
    \ Fix any errors before you carry on*.\n\n*3.*\n\n*Whatever style you use, make\
    \ sure that it is clear and neat. Remember that some-*\n\n*one may have to change\
    \ your program without your advice*.\n\n*4.*\n\n*As you program, adopt and apply\
    \ a consistent style. As you learn more, develop*\n\n*this style to something\
    \ that you feel confident and happy with*.\n\n*5.*\n\n*Always pay attention to\
    \ layout and indentation as you program, and never treat*\n\n*either as an afterthought*.\n\
    \nRemember these rules as you learn to program. If you break them you will be\n\
    \nmaking more and more trouble for yourself.\n\nNow, finally, the time is right\
    \ for you to take a serious look at some Java and\n\nto write your first program.\n\
    \n![](img/05fa4bae6319441a0b86c0179baaedc2_102_0.png)"
