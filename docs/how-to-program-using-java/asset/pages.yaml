  md: "110\n\n*How to program using Java*\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_127_0.png)\n\
    \n**8.8**\n\nSuggest the most likely data types to be used for a variable to store:\n\
    \nYour name\n\nYour age\n\nYour birthday\n\nYour height\n\nYour initials\n\n**8.9**\n\
    \nIdentify, explain, and correct the errors in the following Java program.\n\n\
    Public class Days\n\n{\n\nPublic static void main(Sting args{})\n\n{\n\nconstant\
    \ int daysInYear = 365;\n\ndouble numYears == 64;\n\nint totalDay = daysInYear\\\
    *double;\n\nSystem.out{\"There are \" + total +\n\n\" days in \" daysInYear +\
    \ \" years.\")\n\n}\n\n}\n\n**8.10**\n\nEggs are always sold packed in half dozens\
    \ (packs of six). Write a Java\n\nprogram that declares a variable to store the\
    \ number of eggs available for pack-\n\ning and then calculates the number of\
    \ boxes that are needed. You can assume\n\nthat each box must contain exactly\
    \ six eggs. Your program should also calculate\n\nhow many eggs are left over.\
    \ What would you have to change in your program\n\nif new regulations meant that\
    \ eggs had to be sold in boxes of ten?\n\n**8.11**\n\nAll of the examples in this\
    \ chapter were written with objects. They could\n\nhave been written without and,\
