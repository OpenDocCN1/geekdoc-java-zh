  md: "250\n\n*How to program using Java*\n\nIn this case it takes another three passes\
    \ to fully sort this list, making \n\n5 passes for a list of 5 values. In fact,\
    \ an unsorted list of *n* values will be \n\nguaranteed to be in the right order\
    \ after *n* passes. This is obvious once you\n\nappreciate the pattern of the\
    \ highest elements bubbling to the end.\n\nBubblesort is not as efficient as some\
    \ alternative algorithms (others would\n\ntake fewer passes to sort the list above,\
    \ for example, or would need fewer com-\n\nparisons), but it is easy to visualise,\
    \ and in practice it is fine for sorting small\n\nlists of values.\n\nNow, armed\
    \ with this quick and dirty introduction, let’s implement this \n\nalgorithm in\
    \ Java, and sort an array of integers. The implementation involves\n\ntwo nested\
    \ for loops – one counting the number of passes through the algo-\n\nrithm (which\
    \ is determinate because we know how many elements there are),\n\nthe other counting\
    \ the comparisons during each pass.\n\nObviously, before we can even think about\
    \ sorting an array, we need to \n\ncreate it:\n\nint numbers\\[\\] = { 8, 9, 6,\
    \ 4, 3 }; // unsorted array\n\nNow, assuming again that we plan to sort these\
    \ values into ascending order, the\n\nbasic logic of the Bubblesort algorithm\
    \ is:\n\n*for every pass through the list:*\n\n*for every pair of elements (x,y):*\n\
    \n*if x is larger than y, swap them over*\n\nSo a first attempt at coding our\
    \ for loops would be:\n\nfor (int passes = 0; passes < numbers.length; passes\
    \ ++) {\n\nfor (int index = 0; index < numbers.length; index ++) {\n\n/\\* If\
    \ in the wrong order, swap elements round \\*/\n\nif (numbers\\[index\\] > numbers\\\
    [index+1\\]) {\n\nnumbers\\[index+1\\] = numbers\\[index\\];\n\nnumbers\\[index\\\
    ]\n\n\\= numbers\\[index+1\\];\n\n}\n\n}\n\n}\n\nThis does not work! This code\
    \ would compile, but you wouldn’t get far in using\n\nit, as there are at least\
    \ two problems with it. First, the mechanism for swapping\n\nthe elements is flawed.\
    \ Let’s take the first pass as an example:\n\n*index *\n\n*0 1 2 3 4*\n\n*elements\
    \ 8 9 6 4 3*\n\nWhen the loop comes to swapping the 9 and 6 over, here’s what\
    \ happens:\n\nnumbers\\[2\\] = numbers\\[1\\];\n\nSo at this point, the values\
    \ in the array are:\n\n*index *\n\n*0 1 2 3 4*\n\n*elements*\n\n*8 9 9 4 3*\n\n\
    You might have spotted the problem already – in the assignment statement\n\nabove,\
    \ the value 6 has been lost forever and we have two 9s. So when the \n\nsecond\
    \ statement in the swapping section gets executed, we are trying to copy\n\nthe\
    \ same value back to where it came from; the actual effect of this step is that\n\
    \nthe array is unchanged since the two are the same."
