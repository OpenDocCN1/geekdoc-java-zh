  md: "212\n\n*How to program using Java*\n\ntt.printLine (5, num);\n\ntt.printLine\
    \ (6, num);\n\nThis is indeed an obvious case where a loop can be used. The first\
    \ parameter of\n\nthe* printLine* method is clearly varying from 1 to 6, and this\
    \ can easily be\n\nreplaced with the control variable of a suitable loop. The\
    \ loop is determinate\n\nsince we know that it will always execute exactly 6 times,\
    \ so this is a case where\n\na for loop is appropriate.\n\nThe 6 statements printing\
    \ the tables are simply replaced with:\n\nfor (int i = 1; i <= 6; i ++ ) {\n\n\
    tt.printLine (i, num);\n\n}\n\nThis solution is shorter and neater and, as we\
    \ will see in a moment, is much \n\neasier to extend.\n\n**Example 2 – Elvis’s\
    \ harder tables**\n\n*Elvis is impressed with Buddy’s program but wants a program\
    \ that will do more. *\n\n*He wants a program that will print 13 terms of each\
    \ table (starting at “0 times” and*\n\n*finishing with “12 times”. He also wants\
    \ to print out complete versions of the first *\n\n*13 tables so that he can get\
    \ some revision in*.\n\n*He decides to use Buddy’s program as the basis for his\
    \ own. What does he need to*\n\n*change?*\n\nTwo loops are actually needed in\
    \ this program. One will count the number of\n\ntables and one will count through\
    \ the terms of the tables. Since both loops are\n\nalways required to execute\
    \ exactly 13 times this is a clear case where a for loop\n\nshould be used for\
    \ both.\n\nThere are also two changes needed to Buddy’s program. The first will\
    \ make\n\nthe program count up to “12 times” rather than the current 6, and the\
    \ second\n\nwill make the program repeat for a number of tables. When more than\
    \ one\n\nchange is to be made to a program it is always a good idea to make changes\
    \ \n\nto a program one at a time. This means that any error that occurs will always\n\
    \nhave been caused by the most recent change; it should therefore be easier to\n\
    \nspot, isolate, and correct.\n\nThe first stage is therefore to alter Buddy’s\
    \ program so that 12 terms are\n\nprinted for each table. With the changes just\
    \ made, this is trivial as the only\n\nchange needed is in the loop which becomes:\n\
    \nfor (int i = 0; i <= 12; i ++ ) {\n\ntt.printLine (i, num);\n\n}\n\nThis could\
    \ equally well be written like this:\n\nfor (int i = 0; i < 13; i ++ ) {\n\ntt.printLine\
    \ (i, num);\n\n}\n\nwhich is the style that many Java programmers (particularly\
    \ those brought up\n\non C or C  ) might prefer; it’s just the usual matter of\
    \ style and preference."
