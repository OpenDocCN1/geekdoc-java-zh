  md: 'iv


    **Using this book**


    **Deciding what to read**


    This book is meant to be read by someone who is learning to program. It is not


    meant to be a reference. The first chapter explains what’s in each of the follow-


    ing chapters in some detail, but briefly:


    Chapter 0 – What this book is


    **p. 1**


    … tells you in much more detail what this book is, and why it is like that.


    Chapter 1 – Programming


    **p. 11**


    … explains what programming is, and why you might want to be able to do it.


    Chapter 2 – The mechanics


    **p. 20**


    … describes the details of getting a computer to run your program.


    Chapter 3 – Before you start


    **p. 29**


    … explains what you are going to need and also considers why many people


    find learning to program difficult.


    Chapter 4 – Objects. The building block


    **p. 39**


    … has a close look at what precisely the basic component of an object-oriented


    computer program – an “object” – is.


    Chapter 5 – A word on analysis and design


    **p. 52 **


    … puts programming into context by looking briefly at the processes of


    analysing a problem and designing a solution.


    Chapter 6 – A first look


    **p. 63**


    … provides a first look at Java by developing a simple Java object.


    Chapter 7 – Programming (don’t panic!)


    **p. 74**


    … shows why programming requires a structured, controlled approach, and


    why good programming style is so important.


    Chapter 8 – The basics


    **p. 86**


    … introduces the first Java in the book – values, variables, assignments, and


    simple output.


    Chapter 9 – Input


    **p. 112**


    … describes how to accept input values from the user.


    Chapter 10 – A word on testing


    **p. 124**


    … breaks off briefly to show why it is so important that all programs are tested


    thoroughly and methodically, and to present some ways of testing simple


    programs.


    Chapter 11 – A first class


    **p. 135**


    … shows how to create a class of objects in Java.


    Chapter 12 – Classes and objects


    **p. 152**


    … and shows how to use those classes in programs.


    Chapter 13 – Get your hands off my data!


    **p. 167**


    … describes two basic functions that are carried out on objects – setting their


    interesting values and finding out what these values are.'
