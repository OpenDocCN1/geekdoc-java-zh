  md: "area is then:\n\n●duck\n\n●coot\n\n●reserve\n\n**Identifying attributes**\n\
    \nFinding the objects has provided a useful head start in finding some of the\n\
    \nattributes. A check through the discarded candidates for objects reveals\n\n\
    “name”, “age”, and “approximate value”, all of which are attributes of the\n\n\
    *Duck* and* Coot* object types. It’s likely that they are also attributes of the\
    \ other\n\ntwo discarded animal object types (geese and dog) as well, but this\
    \ would only\n\nbe relevant if these were to be implemented.\n\nThere is less\
    \ to go on in the description for the attributes of the object type that\n\nwill\
    \ represent the other nature reserves who buy the birds. In practice an interview\n\
    \nwould again be used to determine these, but a reasonable guess for them would\n\
    \nbe to include attributes such as “name”, “address”, and “telephone number”.\n\
    \nFinally, there is a requirement to record the identity of the reserve to which\
    \ a\n\nbird was sold. This can be introduced in two ways; either an attribute\
    \ “buyer”\n\ncan be added to the *Duck* and* Coot* object types, or an attribute\
    \ to represent the\n\nbirds bought by each of the other reserves could be added\
    \ to the *Reserve*\n\nobject. There is no good reason at this stage to believe\
    \ that either of these \n\npossibilities is better than the other; the choice\
    \ could be left to the final pro-\n\ngrammer or might be determined when some\
    \ more details of the requirements\n\nof the final program are known.\n\nThe types\
    \ of most of the attributes are straightforward to establish. The only one\n\n\
    that might present a choice is the telephone number of the reserves. It might\
    \ seem\n\nat first sight as if this should be an integer, but a string is probably\
    \ to be preferred.\n\nTelephone numbers are traditionally written with spaces\
    \ to make them more\n\nmemorable and often begin with a 0; handling these values\
    \ sensibly would be\n\nvery difficult to achieve if the number were stored as\
    \ an integer. It is also unlikely\n\nthat the final program would need to perform\
    \ arithmetic on a telephone number\n\n(an operation on integers), but it is possible\
    \ that the program might need to extract\n\ncertain digits from the number (an\
    \ operation on strings). A string is best.\n\nFinally the names of some of the\
    \ attributes could do with some simplifica-\n\ntion; in particular “approximate\
    \ value” should be simply “value”. This gives\n\nthe final set:\n\n*A word on\
    \ analysis and design*\n\n57\n\n**Object Type**\n\n**Attribute**\n\n**Type**\n\
