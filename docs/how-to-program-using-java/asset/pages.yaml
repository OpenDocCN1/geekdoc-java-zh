  md: 'Without further ado, we arrive at some computer programs and


    some Java. This chapter gives you a first look at some programs


    in Java, and shows you how the example from the previous


    chapter might look in a program.


    This points you in the right direction for the rest of the book.


    Programming is a tricky business. The title of this chapter gives


    the best advice of all for new programmers – Don’t Panic!


    Programming is a structured activity that requires and even


    demands a structured, methodical approach.


    Many new programmers do indeed panic when faced with a


    new problem. They make mistakes that an experienced pro-


    grammer would never make. They make mistakes and work


    themselves into a hopeless state from which they can never


    recover. This is why many books on programming don’t really


    help people as they learn.


    This chapter describes the process of writing a program and


    some of the common pitfalls and mistakes that new program-


    mers make. Hopefully after reading it you won’t make them! Or


    at least you’ll realise when you do make them so you’ll only


    make them once.


    This is over a third of the way through the book and this is the


    first chapter that includes a detailed explanation of any Java!


    Don’t be tempted to skip straight to it though; the chapters


    before are there for a purpose and contain essential background


    that you will need to have read and understood.


    This chapter introduces the ideas of a *variable*, the most basic


    component of a program, and of course of the program itself. It


    shows how variables are used to store and manipulate values


    held in a program and explains how to display the values held


    in the variables. After reading this chapter you should be able to


    write your first Java program.


    To write properly useful Java programs you need to be able to


    get values from a user. You need a user to *input* these values,


    usually from the computer’s keyboard.


    There are a couple of ways to do this and this chapter explains


    the Java you need to do it. After reading it you’ll be able to write


    some useful Java programs.


    For a program to be truly useful we need to have confidence in


    the results that it produces. We need to believe that they’re


    accurate and correct. This means that we have to *test* all our pro-


    grams very thoroughly. Testing is another structured process


    that requires a plan.


    This chapter explains how to build up a series of *test cases* into


    a* test plan*. This plan will allow you to test your programs so that


    you can be confident that they work. If you are confident in the


    results produced by your program your users should be too.


    After reading this chapter you should also understand why it


    is never possible to be completely sure that any program works in


    every possible case!


    *Chapter 10*


    *A word on*


    *testing*


    *Chapter 9*


    *Input*


    *Chapter 8*


    *The basics*


    *Chapter 7*


    *Programming*


    *(don’t panic!)*


    *Chapter 6*


    *A first look*


    6


    *How to program using Java*'
