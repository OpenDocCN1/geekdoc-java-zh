  md: "*The basics*\n\n91\n\nString; this is not a misprint! The reason for this important\
    \ distinction will\n\nbecome clear later on when we look at strings in more detail.\n\
    \nA variable can only ever hold values of its own declared type. It is an error\
    \ \n\nto assign, say, an integer value to a string variable. The reason for this\
    \ should\n\nbe quite obvious; the compiler has allocated the variable the right\
    \ amount of\n\nmemory to store an integer and it’s very unlikely that a string\
    \ will fit in the\n\nsame space.\n\n**Identifiers**\n\nThe identifier chosen for\
    \ a variable is pretty much irrelevant to the computer.\n\nThe computer can’t\
    \ understand the language used for the name and certainly\n\ncan’t learn anything\
    \ about the variable’s purpose from it. However, the identi-\n\nfier is certainly\
    \ very important for the programmer and for anyone else reading\n\nthe program.\
    \ It is essential that the name chosen should neatly describe the \n\npurpose\
    \ of the variable. At the same time, the name should not be so long and\n\ndescriptive\
    \ that the program becomes unwieldy and hard to read. A program-\n\nmer must strike\
    \ a delicate balance between descriptiveness and brevity.\n\nAs an example, suppose\
    \ a simple program was used to monitor the birds at\n\na pond and that as part\
    \ of this the program stored the number of ducks that\n\ncould be seen. Here are\
    \ some possible identifiers for that variable and some\n\ncomments on them:\n\n\
    *geese*\n\nThis is not a good name. In fact it’s a very\n\nbad name because it’s\
    \ positively misleading!\n\n*x*\n\nAt least this name isn’t misleading, but it\n\
    \nstill doesn’t tell the reader much about\n\nwhat the variable stores. This is\
    \ poor.\n\n*thenumberofducksonthepond* This name tells the reader what the value\
    \ is\n\nbut it’s very hard to read. It’s better than\n\nthe last two suggestions,\
    \ but a program\n\nusing this would be an example of very bad\n\nstyle. It would\
    \ also require a lot of typing!\n\n*ducks*\n\nThis is better still but it still\
    \ doesn’t really\n\ntell the reader what the value is.\n\n*numDucks*\n\nThis is\
    \ the name we would use and is the\n\nbest of these suggestions. It’s short enough\n\
    \nto keep the program short and neat and it\n\ntells a reader what the value is.\
    \ *numOfDucks*\n\nwould be a reasonable alternative.\n\nChoosing identifiers requires\
    \ care and thought. The ones that you choose\n\nmust provide some information\
    \ for people reading your programs. Also, you\n\nmight come back to a program\
    \ after many months and have to understand it\n\nquickly. Bearing this in mind,\
    \ identifiers must also not be so long or unwieldy\n\nas to make the program unreadable.\
    \ There is a balance to strike.\n\nMost programmers have a convention that they\
    \ use for their identifiers, \n\nor sometimes they will be asked to use one by\
    \ their employer as part of \n\nsome prescribed standards. Like programming style,\
    \ the choice of identifiers is"
