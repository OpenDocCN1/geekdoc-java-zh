    The return values are presumably of interest to the programmer using the


    class and so they should be stored in a suitably declared variable of the appro-


    priate type. This gives a slightly longer form of a call to a method:


    *variable* *object name**.**method name** (**parameters**);*


    Another example – to use the *getAge* method to retrieve Elvis’s age and


    store it in a suitable program variable the statement is:


    int age;


    age = elvis.getAge ();


    This method has no parameters, and so the brackets are present but, as usual


    with methods like this, they contain nothing. This assignment could also have


    been combined with the declaration of the variable to provide an initial value


    for that variable:


    int age = elvis.getAge ();


    It’s worth pausing to mention that calling a method like this that returns a value


    with nowhere to store the value:


    elvis.getAge ();


    is very probably an error. It is almost always a very bad idea to ignore a value


    that a method is returning.


    If a method requires parameters the values are included in the brackets. If


    there is more than one value all the values must be provided in the correct order


    (the types of the parameters must match the types specified in the method def-


    inition). The *distanceFrom* method returns the distance that a duck is from a


    particular point. To find out how far Elvis is from the point (5, 3) and store
    that


    distance in a program variable called *away* the statement would be:


    double away = elvis.distanceFrom (5, 3);


    This is obviously different to:


    double away = elvis.distanceFrom (3, 5);


    which refers to the point (3, 5). The correct number of parameters must be


    provided in the order specified in the method definition.


    This call to the method would result in a compilation error:


    double away = elvis.distanceFrom (4); // Error!


    The error here is simply that the number of parameters does not match with the


    number specified in the method definition. Obviously the compiler cannot spot


    if the values have been provided in the wrong order; all it can check is the


    number of values provided and their types.


