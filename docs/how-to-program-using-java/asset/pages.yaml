  md: "*Programming (don’t panic!)*\n\n83\n\nand her poor layout will make it very\
    \ difficult for these programmers to dis-\n\ncover how her program works. Bruce\
    \ is quite correct to refuse to mark the pro-\n\ngram; the poor style will make\
    \ it very difficult for him to see how it works or to\n\nspot any errors.\n\n\
    Cilla should realise that it is just as easy to create the program with proper\n\
    \nindentation as it is to not bother. It is probably even easier, as the indentation\n\
    \ncan often help highlight errors before the program is even compiled. Leaving\n\
    \nthe indentation to the last minute is a very poor strategy.\n\nDo not make the\
    \ same mistake. Make sure that your programs are correctly\n\nand consistently\
    \ indented as you write them. As you learn more Java, adapt\n\nyour style and\
    \ develop one that you can confidently apply consistently.\n\nWhatever you do,\
    \ do not ignore style and do not treat it as an incidental extra\n\nthat can be\
    \ added once the program works.\n\n**Example 2 – Buddy’s poor style**\n\n*Buddy\
    \ is enjoying learning Java but he finds typing difficult. So that he can *\n\n\
    *learn more Java quickly he decides that he won’t bother with any comments in\
    \ *\n\n*his programs. He too is dismayed when Bruce refuses to mark his comment-less\
    \ *\n\n*programs. Is Bruce right?*\n\nBruce is quite correct again. Like indentation,\
    \ comments should never be treat-\n\ned as an afterthought. They should be included\
    \ in programs as the \n\nprogram is written to highlight the various stages that\
    \ the program is passing\n\nthrough. Comments are crucial when another programmer\
    \ comes to correct or\n\nmaintain any program. It is always easier to add comments\
    \ as the program is\n\nwritten; if they are added at the end, after a long period\
    \ of development, the\n\noriginal programmer will often find that they themselves\
    \ have forgotten how\n\nthe program works!\n\nYou can probably understand to some\
    \ extent what the class definition in this\n\nchapter does. You might not understand\
    \ all of the statements, but you can still\n\nread the comments. Well-written\
    \ comments should tell you all you need to\n\nknow in order to use and even modify\
    \ the program.\n\nAgain, do not make the same mistake as Buddy. Get into the habit\
    \ of adding\n\ncomments to your programs as you write them. But beware of adding\
    \ too many.\n\n**Example 3 – Elvis’s comments**\n\n*Elvis is alarmed at Buddy’s\
    \ comment predicament and decides to add comments*\n\n*throughout his program.\
    \ He adds comments to each line; many of the comments are*\n\n*quite long and\
    \ eventually there are more comments than functional lines of program.*\n\n*Elvis\
    \ is as dismayed as the others when Bruce says that his program is no better.\
    \ What*\n\n*is going on?*\n\nYou will not be surprised to learn that Bruce is\
    \ quite right. A programmer who\n\nincludes too many comments in a program is\
    \ almost as bad as a programmer\n\nwho includes none at all. A program with too\
    \ many comments quickly becomes\n\ncluttered and very difficult to read. The key\
    \ to good style is that the program is\n\nneat and easy to read and understand.\
    \ Too many comments, and comments on\n\nlines whose function is obvious, can get\
    \ in the way."
