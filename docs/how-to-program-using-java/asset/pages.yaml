  md: "80\n\n*How to program using Java*\n\nit does, but that’s not the point. Just\
    \ concentrate for now on the way that it’s laid\n\nout. All you really need to\
    \ remember at the moment is that the lines that start //\n\nand the sections marked\
    \ off with /\\* and \\*/ are just intended for the human\n\nreader; they are *comments*\
    \ and are completely ignored by the compiler.\n\nComments are used to explain\
    \ how a program works; you should find that by\n\nreading them you are able to\
    \ see what this Java defines even if you don’t under-\n\nstand all the tricky\
    \ little details of the Java itself.\n\n/\\*\n\nDuck.java\n\nA simple Duck class\
    \ for the \"First Look\" chapter.\n\nAMJ\n\n22nd January 2003\n\n\\*/\n\npublic\
    \ class Duck\n\n{\n\n// Attributes\n\nprivate String name;\n\nprivate int age;\n\
    \nprivate double value;\n\n// Constructor\n\npublic Duck ()\n\n{\n\n}\n\n// Methods\n\
    \npublic void display ()\n\n{\n\nSystem.out.println (\"The details of the duck\
    \ are:\");\n\nSystem.out.println (name);\n\nSystem.out.println (age);\n\nSystem.out.println\
    \ (value);\n\n}\n\npublic void setAge (int newAge)\n\n{\n\nage = newAge;\n\n}\n\
    \npublic void setValue (double newValue)\n\n{\n\nvalue = newValue;\n\n}\n\n}\n\
    \nHopefully you will agree that this class definition is set out quite neatly.\
    \ \n\nThere are blank lines separating the parts of the definition that have different\n\
    \nfunctions and generally separating the various lines of the definition. The\n\
    \nindentation is also important; the first ‘{’ and the last ‘}’ (called *braces*)\
    \ mark the\n\nstart and end definition so all the statements inside the definition\
    \ are indented\n\nby the same number of spaces (I usually prefer to use 2) to\
    \ emphasise this.\n\nSo in this definition all the statements that make up the\
    \ definition are\n\nenclosed by a pair of braces to denote its start and end points.\
    \ Statements inside\n\nthis (for example, those inside the methods) are indented\
    \ by the same amount"
