  md: "**Identifying methods**\n\nThe task of identifying the methods of the object\
    \ types involves returning to \n\nthe description of the problem area. This time\
    \ the focus is on the purpose of the\n\nfinal program; it is vital that the object\
    \ types have sufficient and correct\n\nmethods to support this. In particular\
    \ the analyst should be looking for \n\nany* transactions* that will change the\
    \ values of any attributes of any instance \n\nof an object type. Transactions\
    \ often show up as events in the problem \n\ndescription.\n\nIn this example there\
    \ is only one obvious candidate; the ranger sells a bird.\n\nThis transaction\
    \ would change the value of the “sold to” attribute of the object\n\ninstance\
    \ representing the appropriate bird; it is therefore a method of both\n\nobject\
    \ types representing birds, *Duck* and* Coot*.\n\nThe description also contains\
    \ the information that the ranger “needs to know\n\nthe name, age, and approximate\
    \ value” of each of his birds. This suggests two\n\nthings; that methods will\
    \ be needed to display this information to him in some\n\nneat format and that\
    \ methods will be needed to change this information. It\n\nseems reasonable to\
    \ assume that the name of a duck never changes, so methods\n\nwill be needed only\
    \ for age and value.\n\nThe* Reserve* object type has no obvious methods. The\
    \ only possibilities\n\nseem to be methods to change the values of the attributes,\
    \ but there is no evi-\n\ndence that this would be a common requirement. This\
    \ is another example of\n\nsomething that would have to be confirmed with a further\
    \ interview.\n\nOf course Mr Martinmere will also want to use the information\
    \ about his\n\nbirds for many other purposes. He might want to display lists of\
    \ all his birds or\n\nfind all the birds of a certain value. These are not, however,\
    \ methods of the\n\nobject type; they operate on collections of objects and not\
    \ on individual objects.\n\nThese are functions that would be carried out by programs\
