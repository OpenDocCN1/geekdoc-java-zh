  md: "*The basics*\n\n87\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_104_0.png)\n\
    \nThis chapter is the first one that looks in detail at some Java. You should\
    \ now\n\nunderstand what a program is and you should have some idea of how to\n\
    \nanalyse a problem area and design a solution that will solve a particular prob-\n\
    \nlem. You should also know how to create, compile, and execute the programs\n\
    \nyou write. Now it’s time to actually write some!\n\nA Java program is basically\
    \ nothing more than a set of *statements* that instruct\n\na computer to perform\
    \ some task. At the simplest level a program takes some\n\nvalues and processes\
    \ them to produce some other values. In this chapter you\n\nwill meet a full Java\
    \ program in detail for the first time and will see how it\n\nstores and processes\
    \ these values. The next chapter will go on to explain \n\nhow to display the\
    \ values and how to ask a user to enter the values. Together\n\nthese two chapters\
    \ cover the most basic tasks that can be carried out by a Java\n\nprogram.\n\n\
    After reading this chapter you should understand the basic structure of a\n\n\
    Java program. You should understand how values can be stored in *variables* and\n\
    \nhow they can be manipulated. You should then be able to write some simple\n\n\
    Java programs.\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_104_1.png)\n\nLet’s\
    \ start by looking at a very simple Java program. You have seen some \n\nsimple\
    \ Java definitions and programs in the previous chapters and looked \n\nat what\
    \ some of the statements might achieve, but the focus there was just on\n\nthe\
    \ layout and style and an overall view. Now it’s time to start understanding\n\
    \nwhat the Java statements actually do. Still, this program won’t do anything\n\
    \nespecially useful just yet; the thing to concentrate on this time is just its\
    \ \n\ngeneral structure. Here it is:\n\n/\\* First.java – a very simple Java program.\n\
    \nDemonstrates the basic structure of a Java program."
