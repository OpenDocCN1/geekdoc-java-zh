    that can be used with them. You have seen (and hopefully written) many pro-


    grams where integers and floating-point values have been added together,


    subtracted, multiplied, or divided. Boolean values also have a set of operators;


    their meaning is similar to the operators for the numeric types, but the mean-


    ing is now set in terms of logical operations. These operators allow Boolean


    variables and values to be combined in various ways based on the principles


