  md: "246\n\n*How to program using Java*\n\n*Other methods*\n\nThe documentation\
    \ also describes a few other methods that can come in useful:\n\n●contains – returns\
    \ true if an element is found in the list.\n\n●isEmpty – returns true if the list\
    \ is empty.\n\n●lastIndexOf – returns the last index of a value (compare this\
    \ with indexOf\n\nused above).\n\nThere are a few more – check the documentation\
    \ for details.\n\n*Using elements*\n\nUsing an element of a list is a little more\
    \ complicated than using an element of\n\nan array; in a way this is the trade-off\
    \ for all the neat functions. Elements \n\nof a list cannot be referenced in the\
    \ same way as those of an array, as they do\n\nnot use the same notation in Java.\
    \ The syntax that is required can look a little\n\nodd at first.\n\nThe element\
    \ at a given position is found as follows:\n\nString aString = (String)names.get\
    \ (2);\n\nwhich will cause the String* aString* to refer to the object stored\
    \ in the third \n\nelement of the list. This notation may seem a little strange\
    \ at first, but it is \n\nactually an example of casting (which you met earlier\
    \ – casting from a double\n\nto an int, for example).\n\nThe notation tells the\
    \ compiler that we wish to treat the object accessed in this\n\nway as a String.\
    \ Internally, an ArrayList treats all its elements as if they\n\nbelonged to a\
    \ single class, called Object. This means that objects of different\n\ntypes (*Duck*\
    \ and String, for example) can be stored in the same ArrayList.\n\nThis is very\
    \ neat and can be very powerful but it also means that we have to\n\nexplicitly\
    \ tell the compiler how we want to treat each object we access within\n\nthe list.\
    \ So if the element were a *Duck* object and was in a list called *ducks*, we\n\
    \nwould use the statement:\n\nDuck aDuck = (Duck)ducks.get (2);\n\nWe need to\
    \ be careful here, as if we attempt to cast to the wrong object type,\n\nwe can\
    \ end up with all sorts of weird happenings, ranging from malfunction-\n\ning\
    \ code to compiler errors. With this in mind, it is usually safer to restrict\
    \ a\n\nArrayList to storing a single object type, thereby avoiding such errors.\
    \ In any\n\ncase storing several object types in an ArrayList brings other problems.\
    \ For\n\nexample, it is not easy to search for a particular object – usually you\
    \ are required\n\nto use methods of a class to determine whether this is the object\
    \ you are look-\n\ning for. The lists also become harder to sort, and any objects\
    \ in the list, which\n\ndo not override the default toString method, can cause\
    \ problems with any\n\noutput required.\n\nAs a final word on ArrayLists, we have\
    \ seen that base types – int, char,\n\nand so on – cannot be added directly to\
    \ a list, as they are not objects. The\n\ndesigners of Java saw that this sort\
    \ of situation may well arise and cause prob-\n\nlems, so they have provided a\
    \ solution, known as a wrapper class. This is a way\n\nof encapsulating a primitive\
    \ value in an object, so it can then be manipulated in\n\nthe same way as any\
    \ other object.\n\nThe wrapper class for int is Integer, that for char is Character,\
    \ that for\n\ndouble is Double, and that for boolean is Boolean (we are unlikely\
    \ to use"
