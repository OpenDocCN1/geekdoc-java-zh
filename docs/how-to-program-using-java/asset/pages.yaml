    *At the moment, the output of the program is wrong, and it has to be said somewhat*


    *baffling. For example*:


    *How Many Pies? ****100***


    *How Many Ducks? ****10***


    *Each duck should get 100 pies.*


    *There will be 10 pies left over.*


    *This is clearly wrong, but what is wrong with the program?*


    Problems such as this are often very difficult for the programmer to find. Black


    box testing is clearly not helping very much so some sort of white box testing


    is the only way forward. It is quite likely that by showing his program to anoth-


    er programmer Elvis could quickly have the program solved.


    The error in the program is in fact quite subtle, but very obvious once you


    notice it. If you can see it immediately, go and get yourself a prize!


    It is precisely the sort of error that another programmer seeing this program


    for the first time could well spot immediately, but which the original program-


    mer could spend many fruitless hours trying to find.


    The problem is that Buddy has mixed up the order of values in his calcula-


    tion. If you think about it for a minute, this:


    piesPerDuck = ducks / pies;


    leftOver = ducks % pies;


    is clearly nonsense. The values are the wrong way round. This is correct:


    piesPerDuck = pies / ducks;


    leftOver = pies % ducks;


    This is a simple mistake, but mistakes like this can be very difficult to spot,


    especially if they’re in a program that you have written. Subtle errors such as


    this are often best found by other programmers.


