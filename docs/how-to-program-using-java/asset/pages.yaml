    \ there’s no way to do it in a program.\n\nThere is one case where this is particularly\
    \ important. It is often very\n\ntempting to want to assign the values of all\
    \ the attributes of one instance of a\n\nclass to another. This does not work\
    \ as might be expected! For example, this\n\ncode is totally legal, but may well\
    \ not behave as the programmer intended.¹\n\nDuck elvis = new Duck();\n\nDuck\
    \ buddy = new Duck();\n\nelvis.moveTo(10,10); // change position\n\nbuddy = elvis;\n\
    \nThis would indeed change the second duck’s position to (10, 10) but some-\n\n\
    thing more subtle has actually happened. The two objects are now effectively\n\
    \nthe same; by this, we mean that the names *elvis* and* buddy* now both refer\n\
    \nto the same location in the computer’s memory. This really is rather subtle,\
    \ and\n\nis something that you don’t really need to worry about for now. The problem\n\
    \nnow is that a later statement such as:\n\nelvis.moveTo(10,11);\n\nwould affect\
    \ both *buddy* and* elvis,* since the attributes of both are stored in\n\nthe\
    \ same place. It is important to remember that attributes must be copied using\n\
    \nonly the methods defined in the class.\n\n**Using a class**\n\nA class effectively\
    \ extends the range of data types that you have at your dis-\n\nposal as you write\
    \ your programs. An examination of the *.java* file gives you\n\nall the information\
    \ you need in order to use the class. After compiling the class,\n\nobjects are\
    \ declared in a similar way to variables.\n\nMethods are called on an object by\
    \ joining the name of the method and the\n\nidentifier of the instance with a\
    \ full stop. If a method requires parameters, the\n\ncorrect number must be provided\
    \ in the expected order and must match \n\nthe expected types.\n\nThis really\
    \ is not as complicated as it might seem! Now it’s time for some\n\nexamples of\
    \ how this all works.\n\n1\n\nA particular irritation is that in C using an assignment\
    \ like this has a rather different\n\neffect, copying the values of the attributes."
