  md: "114\n\n*How to program using Java*\n\nthe user will decide how to influence\
    \ the program’s execution by passing val-\n\nues to the program at the command\
    \ line. Unsurprisingly, these values are\n\nknown as *command line arguments*\
    \ (CLAs) and as an example, let’s look at the\n\nDOS* dir* command:\n\n*C:\\\\\
    zep*\\>*dir*\n\n*Volume in Drive C is DRIVE1*\n\n*Volume Serial Number is ABCD-9876*\n\
    \n*Directory of C:\\\\ *\n\n*12/06/2003*\n\n*12:55*\n\n<*DIR*\\>\n\n.\n\n*12/06/2003*\n\
    \n*12:55*\n\n<*DIR*\\>\n\n..\n\n*11/06/2003*\n\n*10:43*\n\n*6,150 wanton\\_song.txt*\n\
    \n*05/06/2003*\n\n*22:42*\n\n*5,341 white\\_summer.txt*\n\n*21/05/2003*\n\n*19:56*\n\
    \n*17,542 whole\\_lotta\\_love.txt*\n\n*16/06/2003*\n\n*09:21*\n\n*9,974 wiawsnb.txt*\n\
    \nThe* dir* command is used to list files. When invoked with no arguments, the\n\
    \noutput is a list of filenames found in the current directory. It is obvious\
    \ why \n\nthis might be useful, but the *dir* command can be all the more powerful\
    \ \n\nby making use of the command line arguments it understands. One is the \n\
    \n*/O* argument (or *flag*) which tells the *dir* program to sort its output by\
    \ some\n\nrule other than the default (alphabetical order). */OD* is used to sort\
    \ by file time,\n\n*/OE* sorts by extension, */OS* by file size, */ON* by name\
    \ (which is the default). \n\nSo this provides a list of files ordered by their\
    \ date:\n\n*C:\\\\zep*\\>* dir /OD*\n\n*Volume in Drive C is DRIVE1*\n\n*Volume\
    \ Serial Number is ABCD-9876*\n\n*Directory of C:\\\\ *\n\n*21/05/2003*\n\n*19:56*\n\
    \n*17,542 whole\\_lotta\\_love.txt*\n\n*05/06/2003*\n\n*22:42*\n\n*5,341 white\\\
    _summer.txt*\n\n*11/06/2003*\n\n*10:43*\n\n*6,150 wanton\\_song.txt*\n\n*12/06/2003*\n\
    \n*12:55*\n\n<*DIR*\\>\n\n.\n\n*12/06/2003*\n\n*12:55*\n\n<*DIR*\\>\n\n..\n\n\
    *16/06/2003*\n\n*09:21*\n\n*9,974 wiawsnb.txt*\n\nThere are also flags available\
    \ to list hidden files, list the contents of other\n\ndirectories, and other useful\
    \ actions. From this simple example, it should be\n\nobvious why command line\
    \ arguments are such useful tools to be able to incor-\n\nporate into your programs.\
    \ If you’ve used a Unix system you’ll certainly have\n\nseen how widely used command\
    \ line arguments are there.\n\nNow, there are some programs which accept data\
    \ interactively, after they\n\nhave started execution. Often this is because the\
    \ values the program receives\n\ncannot be known for some reason when the program\
    \ is invoked. Since we\n\nlooked at an example to demonstrate command line arguments,\
    \ let’s look at\n\nanother for interactivity. This is the humble Unix *login*\
    \ program.\n\n*tetley login:*\n\nAnyone familiar with the Unix text console will\
    \ instantly recognise this\n\nprompt, as they have to enter their username and\
    \ password when they see it in\n\norder to gain access to the system. The *login*\
    \ program is automatically\n\ninvoked after the system is rebooted or when another\
    \ user has logged out. The\n\nsystem cannot possibly know which user will log\
    \ in next, so there is no point in\n\ntrying to pass the user’s name as a CLA.\
    \ Therefore it makes sense for the *login*\n\nprogram to receive the username\
    \ when the user comes to log in."
