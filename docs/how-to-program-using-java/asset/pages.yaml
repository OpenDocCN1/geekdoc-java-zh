  md: 'By now you should have had plenty of practice at writing simple Java programs


    and classes. Some of these programs will have made use of classes developed


    by other programmers and you should have become accustomed to the way


    that Java defines and implements a class. The definition describes the public


    interface to the class and also includes the implementations of the methods


    themselves. In the last two chapters you got plenty of practice in developing


    your own classes, and you should now be able to develop your own classes for


    other programmers to use.


    As you define a class you are specifying a number of things. One of these is


    the attributes that objects of your class have, and another is the ways in which


    programs can interact with and manipulate these attributes. It is important that


    you retain control over the values of the attributes to guard against, for exam-


    ple, incorrect programs setting them to invalid values. This chapter introduces


    a mechanism to do just that; *data hiding* makes sure that you are always well
    in


    control of the values of your attributes.


    After reading this chapter you should understand how to implement simple


    methods for Java classes to support data hiding. You should also understand


    the concepts underlying data hiding and you should understand why this is


    very important and how the separation of Java classes into public and private


    parts allows programmers to implement this powerful mechanism.


    168


    *How to program using Java*


    ![](img/05fa4bae6319441a0b86c0179baaedc2_185_0.png)


    In the last chapter we saw some very basic types of method. Some of these types


    are useful in all classes. Obviously every class needs a constructor, but there
    are


    also two other types of method that are generally almost as important. Methods


    are needed that allow a program to access the value of an attribute; these are


    commonly called *accessors* (or* selectors*). Similar methods, usually called
    *muta-*


    *tors*, are needed to allow a program to alter the value of an attribute.


    ![](img/05fa4bae6319441a0b86c0179baaedc2_185_1.png)'
