  md: 'Computers are all around us and so, therefore, are computer programs. Any


    computer that is carrying out any useful task has somewhere inside it a pro-


    gram. In fact it probably has many programs. All these programs were written


    by human programmers using a programming language.


    As computers have become more sophisticated so have the languages that


    are used to program them. Early computers were programmed with switches


    and levers and then by low-level languages. This was so time-consuming and


    error-prone that higher-level languages were developed. Over the years some


    of these languages have died out while others have been refined and developed


    further.


    Java is one of the latest languages in this evolution.


