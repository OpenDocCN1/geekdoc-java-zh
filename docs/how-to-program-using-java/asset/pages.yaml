  md: "350\n\n*How to program using Java*\n\n**command line argument** A value provided\
    \ as input to a program when it is run,\n\nvia the command line.\n\n**comment**\
    \ A piece of *code* which is ignored by a *compiler*, but useful for providing\n\
    \ninformation to *programmers*.\n\n**compilation** The process of translating\
    \ *source code* into an *executable* form.\n\n**compiler** A* program* which performs\
    \ *compilation*.\n\n**concatenate** To tag one value onto the end of another.\
    \ For example, concatenating\n\nthe* strings* “Z” and “Cars” produces another\
    \ *string*, “Z Cars”.\n\n**condition** An assertion which is either true or false.\
    \ Used in *conditional statements* to\n\ncontrol the *flow* of a *program*.\n\n\
    **conditional statement** A* statement* which evaluates a *condition* or set of\
    \ *conditions*,\n\nand based on the result of this evaluation, passes control\
    \ to various different\n\nparts of a *program*.\n\n**constant** An entity whose\
    \ value will never change during the life of a *program*. Has\n\na* type*, and\
    \ is referred to via an *identifier*.\n\n**constructor** A special *method* which\
    \ is used to *instantiate* an* object* of a given *class*.\n\nMust be declared\
    \ *public*.\n\n**control statement** A* statement* which controls the *execution\
    \ path* of a *program*.\n\n**control variable** A* variable* used in a *control\
    \ statement* which may affect the *execution*\n\n*path*.\n\n**curly brackets (or\
    \ curly braces)** The symbols { and } which signify the start and end\n\nof a\
    \ block of statements in Java. Not to be confused with parentheses – ( and ).\n\
    \n**data hiding** The process of writing a *class* in such a way that the *programmer*\
    \ need\n\nhave no knowledge of the *attributes* used in its implementation.\n\n\
    **data type** The sort of value which can be stored in a given *attribute* or*\
    \ variable*.\n\nExamples are *integers*,* strings*,* arrays*, and *floating-point\
    \ numbers*.\n\n**debugger*** Program* used to aid *debugging*.\n\n**debugging**\
    \ The process of systematically discovering and eliminating *bugs* in\n\na* program.\
    \ Programs* to help in this process are known as *debuggers*.\n\n**declaration**\
    \ A* statement* which introduces a *method, constant,* or* variable* into a \n\
    \n*program* or* class*.\n\n**decrement** To reduce the value of an *integer variable*\
    \ by one.\n\n**derived class** A class which inherits *attributes* and/or* methods*\
    \ from a *base class*.\n\n**determinate loop** A control *loop* which executes\
    \ a predefined number of times. \n\nThe eventual number of iterations is known\
    \ at the time of the first iteration.\n\n**directory** The Unix and MSDOS equivalent\
    \ of a *folder* on an MS Windows system.\n\n**driver** A* program* written especially\
    \ to test a *class*.\n\n**dry run** Simulating the execution of a *program* with\
    \ pencil and paper.\n\n**editor** A* program* used to create and alter *source\
    \ code*.\n\n**element** A value in an *array* or* vector*, accessible via its\
    \ unique *index*.\n\n**exception** An unexpected run-time error in a Java program.\n\
    \n**executable** A version of a *program* which can be run by a computer.\n\n\
    **execution path** The order of *statements* executed during the lifetime of a\
    \ *program*.\n\nEach different execution path will cause the *program* to produce\
    \ different results.\n\n**expression** A combination of *literal values*,* operators*,\
    \ and *variables*.\n\n**extension (or file extension)** The part at the end of\
    \ a filename (usually following\n\nthe last dot) which is used by some *programs*\
    \ and* operating systems* in an attempt\n\nto determine the file format.\n\n**flag**\
    \ A special *command line argument*, usually denoted by a */* in DOS or – in Unix.\n\
    \n**floating-point number** A number which includes a decimal part.\n\n**flow\
    \ (of control)** The sequence of *statements* executed in a *program’s* lifetime.\n\
    \nAffected by *control statements* and* conditional statements*.\n\n**folder**\
    \ A set of files grouped together into one logical unit.\n\n**function** A procedure\
    \ for achieving some result, usually corresponding to a *method*.\n\n**hard copy***\
    \ Source code* printed onto paper. Useful for testing purposes and *code*\n\n\
    *walkthroughs*."
