    **Example 3 – Cilla’s cricket poser**


    *Cilla and her friends all like cricket. Because he likes to keep all the ducks
    happy *


    *Mr Martinmere allows them to play cricket every Thursday afternoon. The number
    of*


    *ducks prepared to play changes frequently, depending on the weather, sore wings,
    and*


    *so on. Cilla has written a computer program to work out how many teams can be
    made*


    *up from the eligible ducks. Her variable declarations look like this:*


    final int TEAMSIZE = 11;


    int numDucks = 36;


    *Cilla works out how many teams there can be like this:*


    int numTeams = numDucks / TEAMSIZE;


    *When she runs the program it tells her that there are three full teams available
    this week.*


    *She is surprised to find some ducks left team-less. What’s going on?*


    Cilla has mixed up her data types, or at least she has not thought carefully


    enough about what the results of her division will be. Because all the variables


    in her assignment are integers, integer division has taken place and the remain-


    der from the division has been overlooked. She needs an expression to work out


    how many spare players there are; this would look like this:


    int spareDucks = numDucks % TEAMSIZE;'
