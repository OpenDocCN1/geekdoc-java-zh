    *How to program using Java*


    doing this already with one of the *printNeatly* methods earlier on:


    public void printNeatly ()


    {


    System.out.println (toString () );


    }


    System.out.println is a method that prints to the console, and toString


    is a method that returns a String object containing information about this par-


    ticular duck. This is neater than the equivalent:


    public void printNeatly ()


    {


    String tmp = toString ();


    System.out.println (tmp);


    }


    As another example, suppose that we wanted to use the now familiar


    *distanceFrom* method to display how far a Duck was from some hazardous


    object. We could write:


    Duck elvis = new Duck ();


    double distance;


    distance = elvis.distanceFrom(5, 3);


    System.out.println ("Elvis is " + distance + " away!");


    This is fine, but it is neater to do away with the temporary variable distance


    altogether and to write:


    Duck elvis = new Duck ();


    System.out.println ("Elvis is " + elvis.distanceFrom (5, 3)


    \+ " away!");


    While this form of method call can make your code neater, it is not without


    potential pitfalls. It is vital that you carefully check that the return type
    of the


    method to be called as a parameter is the same as the type that the calling


    method requires as a parameter. So a method that takes an int as a parameter


    can only call a method that returns an int, and so on.


    **Static methods**


    And finally, another detail of methods. Once again there is nothing new here


    because we’ve been using static methods since the very first Java program; the


    main method is an example:


    public static void main (String args\[\])


    The main method is special in that it is called without an object being created.


    It is in fact called automatically when the JVM is asked to execute a program.


    It is possible to define other static methods. These are simply methods


    defined within a class that do not need an object of that class in order to be


    called. Some Java programmers will, with some justification, frown on the use


    of static methods, and we wouldn’t recommend that you start using them very


    much, but it would be good to recognise one if you see one!


    The declaration of a static method is in the same format as the definition of


    other methods except that the word static is added:


    *public static **return type* *method name* *(**parameter types**)*'
