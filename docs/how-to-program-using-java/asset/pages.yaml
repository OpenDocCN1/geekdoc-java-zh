    \ / (innings – notOuts)\n\n**18.2**\n\nAs we discussed earlier, in the *getBattingAverage*,\n\
    \n*getBowling-*\n\n*Average*, and *getRunRate* methods, if a value is undefined,\
    \ the method will\n\nreturn 1\\. Currently the *DuckDatabase* program does not\
    \ handle this error,\n\nand will quite happily tell you that a duck has a batting\
