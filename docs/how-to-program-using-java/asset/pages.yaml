  md: "*Collections*\n\n247\n\nthis last one however). These classes are created by\
    \ taking the corresponding\n\nprimitive value as a parameter, and can then be\
    \ manipulated via methods. It\n\nworks like this:\n\nArrayList numbers = new ArrayList\
    \ ();\n\nInteger myInteger = new Integer (2);\n\nnumbers.add (myInteger);\n\n\
    Compare this with the following, which is not allowed:\n\nArrayList numbers =\
    \ new ArrayList ();\n\nint myInteger = 2;\n\nnumbers.add (myInteger); // Not Allowed!\n\
    \nTo extract the int value from this Integer object, the intValue method is \n\
    \nprovided:\n\nint iVal = myInteger.intValue (); // iVal becomes 2\n\nSo an int\
    \ value can be encapsulated (or wrapped) in an object, and that int\n\nvalue can\
    \ later be extracted from that object. Now you should be able to use\n\narray\
    \ lists to store lists of numbers (but you might well decide that arrays are \n\
    \nless bother!). The same approach works with the corresponding methods for\n\n\
    the Character and Double classes:\n\nDouble myDouble = new Double (3.14159265);\n\
    \ndouble dVal = myDouble.doubleValue (); // dVal == 3.14159265\n\nCharacter myCharacter\
    \ = new Character ('x');\n\nchar cVal = myCharacter.charValue (); // cVal == 'x'\n\
    \n**Collections as parameters**\n\nIt is quite common for collections to be passed\
    \ to methods as parameters. \n\nArray lists are objects and are therefore passed\
    \ by reference, as explained in the\n\nprevious chapter. Arrays, which are not\
    \ really objects or base classes are a little\n\nmore complicated; this quick\
    \ section explains why.\n\nThis is probably best illustrated with an example,\
    \ so here is a description \n\nfor a simple method. The method (which is admittedly\
    \ not very useful, but it’s\n\nconcepts we’re after here) just trebles the integer\
    \ value passed to it; but the\n\nvalue is not returned. It looks like this:\n\n\
    public void treble (int val)\n\n{\n\nval \\*= 3;\n\n}\n\nSuppose for some reason\
    \ a program is needed to treble all the elements of an\n\ninteger array, an attempt\
    \ to do this might be:\n\nint numbers\\[\\] = { 1, 2, 3, 4, 5 };\n\nfor(int i\
    \ = 0; i < numbers.length; i ++)\n\n{\n\ntreble (numbers\\[i\\]);\n\n}\n\nNow,\
    \ this code will compile and run, but it won’t achieve very much; it \n\nwould\
    \ turn out that the array remains unchanged. To understand why this is,"
