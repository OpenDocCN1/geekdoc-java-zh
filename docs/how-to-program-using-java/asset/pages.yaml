  md: "*Collections*\n\n251\n\nThe way to work around this is to use a temporary (or\
    \ buffer) variable to\n\nstore the value that would otherwise be lost:\n\nint\
    \ tmp; // Buffer variable\n\nif (numbers\\[index\\] > numbers\\[index+1\\]) {\n\
    \ntmp = numbers\\[index\\]; // store the 1st variable\n\nnumbers\\[index\\] =\
    \ numbers\\[index+1\\]; // move the 2nd variable\n\nnumbers\\[index+1\\] = tmp;\
    \ // Copy the 1st variable back\n\n}\n\nThis only solves one of the two problems\
    \ with the first attempt to program\n\nthe algorithm. The other problem is also\
    \ subtle, but one we have hinted at \n\nearlier in the chapter. Let’s take a close\
    \ look at the inner loop – the one that \n\ncompares successive pairs of elements.\
    \ As matters stand it is executed 5 times,\n\nonce for each element of the array.\
    \ The problem comes at the end of the array\n\nwhen the comparison would be:\n\
    \nif(numbers\\[4\\] > numbers\\[5\\])\n\nAgain, you might be able to see the problem\
    \ now. Arrays are indexed from 0,\n\nand so our 5-element array is indexed from\
    \ 0 to 4. Hence in the statement\n\nabove, we are attempting to step past the\
    \ end of the array. This causes an\n\nArrayOutOfBoundsException run-time error,\
    \ which stops your program in\n\nits tracks before it has a chance to do anything\
    \ useful.\n\nFor an array of 5 elements, there are only 4 pairs of elements to\
    \ compare on\n\neach pass (0 and 1, 1 and 2, 2 and 3, 3 and 4), so the second\
    \ of the for loops\n\nshould only execute n1 times for an array of n elements.\n\
    \nA much better version of the algorithm, with these problems ironed out,\n\n\
    looks something like this:\n\nint numbers\\[\\] = { 8, 9, 6, 4, 3 };\n\nint tmp;\n\
    \nfor (int passes = 0; passes < numbers.length; passes ++) {\n\nfor (int index\
    \ = 0; index < numbers.length-1; index ++) {\n\nif (numbers\\[index\\] > numbers\\\
    [index+1\\]) {\n\ntmp = numbers\\[index\\];\n\nnumbers\\[index\\] = numbers\\\
    [index+1\\];\n\nnumbers\\[index+1\\] = tmp;\n\n}\n\n}\n\n}\n\nNotice that in this\
    \ version the declaration of the *tmp* variable has been moved\n\noutside of the\
    \ for loops. This does not affect the running of the program, but\n\nit is more\
    \ efficient, as this variable is now declared only once, and used only\n\nwhen\
    \ a swap is needed. If it were declared inside the if statement, there would\n\
    \nbe a variable called *tmp* created every time a swap was needed, and destroyed\n\
    \nwhen the next closing brace is reached. In a program this small, this would\
    \ not\n\nmake a significant difference, but thinking about efficiency issues like\
    \ this is a\n\ngood habit to get into, as when you begin to write more complex\
    \ programs, this\n\nsort of efficiency gain can make programs run significantly\
    \ faster.\n\nNow, the only thing left to do is to put this code into a reusable\
    \ form, so let’s\n\nwrite a method to sort an array.\n\npublic void sortArray\
    \ (int array\\[\\])\n\n{\n\nint tmp; // temporary buffer used in swap"
