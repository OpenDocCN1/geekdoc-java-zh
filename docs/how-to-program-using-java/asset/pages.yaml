  md: '*The basics*


    103


    And that’s all there is to it. All that remains is to include the headers for
    the


    main method to give a complete program.


    /\* Sign.java


    Bruce writes the traditional first program, but this


    time with objects.


    Author


    : AMJ


    Date


    : 13th December 2002


    \*/ Tested on : Linux (Red Hat 7.3) with JDK 1.40


    public class Sign


    {


    // Single Attribute – What to Display


    private String message;


    // Methods


    public Sign ()


    {


    message = "";


    }


    public void setMessage (String newMessage)


    {


    message = newMessage;


    }


    public void display ()


    {


    System.out.println (message);


    }


    public static void main (String\[\] args)


    {


    // Create an object for the sign


    Sign brucesSign = new Sign ();


    // Set the Message...


    brucesSign.setMessage ("hello, world!");


    // ... and display it.


    brucesSign.display ();


    }


    }


    Some programmers would complain that this program is overly complicated


    and that there is no need to use objects in this simple case. Others would say


    that all Java programs should use objects, and so all Java programs should be


    written like this. They might well fight over it.


    One advantage of this approach is that the class can be used in other appli-


    cations. As we look at more Java we’ll expand Bruce’s class until he has


    absolutely the best sign on the pond.'
