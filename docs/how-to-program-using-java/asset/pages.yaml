  md: 'viii


    **To the Student**


    Hi.


    Welcome to the book. We hope you like it.


    If you’re a student just starting out on your first programming course, this


    book is for you. This book contains what we think you’ll need to know as you


    go through your course. We very much hope you’ll enjoy reading it and come


    to enjoy programming.


    Because we want to get something absolutely clear before we go any further;


    programming *is* enjoyable. It’s a creative pastime, and has been called by some


    a craft. Writing a program is the process of creating something from nothing –


    the process of creating something that solves a real problem and hopefully


    makes the world a better place. A complete and correct program can be a source


    of great satisfaction to a programmer. Even the appearance of the lines of a pro-


    gram laid out on a sheet of paper can be a thing of beauty, almost like a poem.


    But enough of these fine words. We would be lying to you if we didn’t admit


    that many people do not especially enjoy learning to program. Many people do


    find it difficult, but just as many take to it quickly and easily; we suppose
    that


    you’ll be finding out which one you are in the next few weeks. Whichever turns


    out to be you, just keep in mind that anyone can get there eventually; there’s


    nothing special about people who can write computer programs.


    This book is not like many of the other books on programming that you can


    see on shelves in the bookshops or libraries. For a start there’s no chapter on
    the


    history of computers, gloriously illustrated with highly amusing photos and


    hairstyles from the 1950s. No. We’ll be assuming that if you want to look at that


    sort of stuff you know where to find it, and you’ll go and seek it out. No. This


    is a book about *programming*.


    You notice that we say *programming* and not *Java*? That’s important. What we


    are about here is learning to program, and the programming language that we


    have chosen to use is something called Java. The skills and techniques that


    you’ll find in this book, and which you’ll learn, can be applied to many, if not


    most, other programming languages. A mechanic does not learn to repair just


    one kind of car, and a chef does not learn to cook just one kind of pie. So a


    programmer does not learn to program in only one language.


    Just reading this book won’t turn you overnight into a programmer. Reading


    this book will help turn you into a programmer, but you’re going to have to do


    other things. You’re going to have to write your own programs. You’re going to


    have to practise. There are plenty of our programs in this book, and the first


    stage for you is to look at these and understand them. Then you’re going to


    have to take the leap of starting to write your own programs. This transition
    –


    from understanding a program that someone else has written, to writing your


    own programs – is difficult, and let no one tell you otherwise. When you’ve


    managed it you’ll have achieved something that should make you very proud.


    The chapters that you’re going to read are quite short. This is quite deliber-


    ate. With any luck you’ll be able to find time to read them between classes or
    on


    the bus home, or something. As you read, doodle on the book, or make notes.


    Read* actively* and think about what you’re reading. Learning is about thinking


    and reflecting, not just about reading.'
