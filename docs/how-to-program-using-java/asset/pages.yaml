  md: "346\n\n*How to program using Java*\n\n**C****, C#, and Python**\n\nIt’s quite\
    \ likely that you will soon want to move on to programming in \n\nanother language.\
    \ The principles that you have learned with Java should see\n\nyou well placed\
    \ to go on to program in other languages – the obvious candi-\n\ndates are two\
    \ other object-oriented programming languages, C and C#.\n\nThis section also\
    \ points you in the right direction to find out more about \n\nprogramming languages\
    \ in general. In particular, Python is an interesting new\n\nlanguage that is\
    \ well worth a look.\n\n*C*\n\nWe’ve mentioned C a few times in this book, and\
    \ we’ve also considered\n\nsome of the differences between Java and C. The main\
    \ difference is that \n\nJava is seen by many to be more “pure” while C is more\
    \ like a non-object-\n\noriented language (C) with object-oriented features added.\n\
    \nWith experience in Java, you should be able to recognise what simple C\n\nprograms\
    \ are doing. Much of the syntax is very similar; the designers of Java\n\nhad\
    \ obviously seen C, and it made sense to keep some of the syntax identi-\n\ncal.\
    \ Here’s the traditional first program in Java:\n\n// hello.cc\n\n//\n\n// The\
    \ traditional first C++ Program.\n\n//\n\n// AMJ 15/9/2003\n\n#include <iostream>\n\
    \nusing namespace std;\n\nint main ()\n\n{\n\ncout << \"hello, world\" << endl;\n\
    \nreturn 0;\n\n}\n\nYou can see that a C program does not have to use a class.\
    \ But then some of\n\nthe keywords used in Java are the same as those in C, and\
    \ you can proba-\n\nbly take an educated guess at what’s going on here.\n\nThe\
    \ traditional second program written in C starts to show where the \n\ntwo languages\
    \ are different, but there should still be plenty here that you can\n\nrecognise\
    \ or at least guess at the purpose of.\n\n// hello.cc\n\n//\n\n// The traditional\
    \ first C++ Program.\n\n//\n\n// AMJ 15/9/2003\n\n#include <iostream>\n\n#include\
    \ <string>\n\nusing namespace std;\n\nint main ()\n\n{\n\nstring name;\n\ncout\
    \ << \"Enter your name: \";"
