  md: "topic (indeed, very thick books on the matter adorn Java programmers’ book-\n\
    \nshelves everywhere!), so this small dip into GUIs must be treated as very basic,\n\
    \nand merely a springboard to further study if you so wish.\n\nIn larger, more\
    \ complex GUI-based programs, literally millions of lines of\n\ncode can be devoted\
    \ to the workings of the user interface, and very little to the\n\nactual core\
    \ tasks that the program is performing. The program needs to keep\n\ntrack of\
    \ keyboard and mouse interactions, monitor settings, and much much\n\nmore, and\
    \ just about all the Java you would need to do this is way beyond the\n\nscope\
    \ of this book. Thankfully, the designers of Java have provided a way to\n\nignore\
    \ most of these overheads and simply display a message in a box on the\n\nscreen.\
    \ This is hardly ground-breaking, but it can add an impressive touch to an\n\n\
    otherwise ordinary program.\n\nThe JOptionPane class (in package javax.swing)\
    \ has many static meth-\n\nods, which allow the programmer to create simple pop-up\
    \ dialogue, which\n\nshould appear on any system running Java with a windowing\
    \ system (of which\n\nMicrosoft Windows, Mac OS and X11 are the most likely).\
    \ So without further\n\nado, let us take one of our earlier examples, which is\
    \ crying out for a graphical\n\nmakeover: Bruce’s *Sign* class.\n\nThe current\
    \ version of this class displays Bruce’s messages on the console.\n\nThis is fine,\
    \ but something more graphical would surely look more impressive.\n\nAs we make\
    \ these changes, most of the existing version of *Sign.java* remains\n\nintact;\
    \ we still have a message variable, a constructor, a *setMessage* method,\n\n\
    and a display method. However, the change comes in the display method where:\n\
    \nSystem.out.println (message);\n\nbecomes:\n\nJOptionPane.showMessageDialog (null,\
    \ \n\nmessage,\n\n\"Bruce’s Sign\", \n\nJOptionPane.INFORMATION\\_MESSAGE);\n\n\
    This looks complicated at first glance, but it is actually quite straightforward.\n\
    \nThe first argument would normally be a reference to the parent window (that\n\
    \nis, the window over which you want your dialog to appear). As we do not\n\n\
    know enough Java to create such a window, we leave this as null, which the\n\n\
    compiler treats as meaning the desktop. Hence the box appears in the centre of\n\
    \nthe screen.\n\nThe second and third arguments are the message and title bar\
    \ strings, respec-\n\ntively. The message string is the text you wish to display\
    \ in the dialog box, and\n\nthe title bar string is the text you wish to display\
    \ in the bar at the top of the box.\n\nThe last argument requires a little explanation.\
    \ The JOptionPane class\n\nprovides four default icons for the dialog box: ERROR\\\
    _MESSAGE, INFORMATION\\_\n\nMESSAGE, WARNING\\_MESSAGE, and QUESTION\\_MESSAGE.\n\
    \nPassing these as the fourth argument will change the icon that appears in \n\
    \nthe dialog box. There is also fifth option, PLAIN\\_MESSAGE, which corresponds\
