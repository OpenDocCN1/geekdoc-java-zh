  md: 'There are, then, three basic types of method that will be found in most classes:


    ●*constructor* – the method that actually creates an instance of a class when
    it is


    declared;


    ●*selector* – a method that allows access to a private value from within the class


    by returning its value (sometimes called an *accessor*);


    ●*mutator* – a method that allows access to a private value of the class so that


    that value can be changed.


    These three types of method will be found in almost every class that is ever


    written; every class must have a constructor and it is hard to imagine a useful


    class that did not allow any form of access to its private data. Each of the classes


    in the previous two chapters had these methods, and if you worked through the


    implementations of the classes in the exercises and examples you will have seen


    and written some of each. There is nothing new here.


    There are, of course, other methods in any class. These tend to be more


    specialised than selectors and mutators and can only rarely be used in different


    classes. What is important here is that selectors and mutators allow for data


    hiding, a mechanism that keeps the developer of a class in control of the


    accuracy and integrity of the values in the class’s attributes.


    **Data hiding**


    The key idea in the chapter is data hiding. This is also one of the key concepts


    in object-oriented programming, and is another reason why object-oriented


    programming is so popular.


    The idea is quite simple. A programmer using a class needs to have no knowl-


    edge of how that class is actually implemented, of how the private attributes
    are


    actually stored. In Java terms this means that a programmer needs to only know


    the public interface to the class and has no need to know anything at all about


    the private parts. We have seen that it is possible to write a program that uses
    a


    class by examining only its methods; there is no need to worry about what


    attributes are stored.


    So a programmer developing a class can specify exactly how that class can be


    used. If the class is written and tested well it should not be possible to use
    it in


    a way that would produce incorrect results. Testing is also made easier because


    the interface is probably quite small; it is much easier to thoroughly test a
    small


    well-defined interface than it is to test a large unstructured program.


    There is another potential benefit. If a programmer using a class needs to


    know nothing of the way in which the class itself is stored then this storage
    can


    be changed if needed. It can be changed and programs using the class will still


    work and will be totally unaware of the change as long as the methods making


    up the public interface continue to behave as before.


    Data hiding is achieved in Java with selectors and mutators. These control


    access to the private part of the class and mean that the attributes in these


    private parts can be changed without the change causing any problems to


    programs using the class. Let’s look at each in turn.


    **Selectors**


    Since it is part of a class, a selector can access the private parts of the class.
    A


    selector’s job is to provide the value of a given attribute to the program that


