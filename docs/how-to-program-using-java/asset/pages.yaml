  md: '**What is in this book**


    After this introduction every chapter¹^ in this book has five sections. The sections


    work like this:


    *In brief*


    This section introduces you briefly to the topic of the chapter. It tells


    you what the chapter is all about and tells you what you should


    understand after reading it. Think of it as an enticing appetiser. Our


    friends who have done some programming before might want to


    read this to help them to decide whether they need to read more.


    *The idea*


    This is the main part of the chapter. It explains the new idea that is


    being introduced in some detail and illustrates it with sample


    programs. This is the section you should pay the most attention to.


    It is the hearty main course.


    *Examples*


    Most chapters also have some examples. These use the new ideas


    from the chapter and apply them to a new problem. I’ll show you the


    correct solutions and working programs and explain why they are


    correct and why they work. This is the dessert and is something to


    look forward to.


    *Exercises*


    There are always exercises or tasks for you to try yourself. They are


    not optional! You should work through these on your own, and


    don’t start looking at the answers until you have. You should linger


    a while over this. Think of it as the cheese board.


    *Summary*


    Finally you’ll find a brief summary of the chapter. This explains what


    you should have learned and what you should now be able to do or


    what you should understand. This is what you should be able to do


    before going on to the next chapter. The coffee and after-dinner mints.


    You should try to read each chapter in one sitting; they’re not very long.


    Hopefully you’ll be able to read one on the bus on the way home or something.


    Then try the exercises later on. Don’t be tempted to read the book while sitting


    at a computer. Read the chapter. Then think about it. And then go to a computer


    and try the exercises.


    This book uses an approach to object-oriented programming called “objects


    first”. We’ll start by looking at what “objects” are and how we might recognise


    them in the real world. Then we’ll move on to see how we can implement


    programs using objects in Java. Some Java books don’t deal with objects first;


    many years of experience have convinced me (and others) that they’re wrong.


    **The chapters**


    The chapters are short and so there are quite a few of them. Here’s what’s in


    them. Read this now and you’ll see where we’re going.


    You are here! I want you to understand why this book is like this.


    You need to know what’s going to happen in the rest of the book.


    Most importantly you need to realise that learning to program and


    learning Java are not the same thing.


    *Chapter 0*


    *What this*


    *book is*


    4


    *How to program using Java*


    1


    Alright, I admit it. I mean “almost every”. Sometimes in this book I will stray
    slightly from


    the exact truth and tell you what you need to know at the moment rather than what’s


    strictly true. I’ll talk in footnotes when that happens.'
