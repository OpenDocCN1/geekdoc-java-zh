  md: "248\n\n*How to program using Java*\n\nremember that primitive types are always\
    \ passed by value, while object types\n\nare passed by reference. In this example,\
    \ every time the *treble* method is\n\ncalled, a single primitive value is passed\
    \ as a parameter. So it is the value of this\n\nprimitive that is copied and the\
    \ method trebles this copy. There is no change to\n\nthe original.\n\nAn alternative\
    \ approach would be to rewrite the method so that it took the\n\nwhole array as\
    \ a parameter. This method might be written:\n\npublic void trebleArray (int array\\\
    [\\])\n\n{\n\nfor(int i = 0; i < array.length; i ++) {\n\narray\\[i\\] \\*= 3;\n\
    \n}\n\n}\n\nThe code to call the method would also require a quick rewrite:\n\n\
    int numbers\\[\\] = { 1,2,3,4,5 };\n\ntrebleArray (numbers);\n\nThis would work\
    \ as required, and the array would contain the expected values\n\n{ 3, 6, 9, 12,\
    \ 15 }.\n\nThis works because, for the purposes of method calls, an array is passed\
    \ as if it\n\nwere an object – by reference. This means that in the example above,\
    \ the array\n\nwhich is manipulated by the *trebleArray* method is actually the\
    \ array\n\npassed to the method initially. As no copy is made (and so the same\
    \ memory\n\nlocations are used), the calculations performed by the method actually\
    \ affect the\n\narray directly.\n\nAn array in Java is a strange beast. It isn’t\
    \ a primitive data type as such – you\n\ncan’t declare something as an array type\
    \ (as you can just declare an ArrayList),\n\nit must be declared as an array of\
    \ values of the same type. However, it isn’t quite\n\nan object in that you don’t\
    \ initialise an array in the same way as a *Duck*, for\n\nexample, and there are\
    \ no array methods (the *array.length* notation is more\n\nlike an attribute of\
    \ an array and has no brackets).\n\nThis is a subtle but important concept, which\
    \ can be used to write elegant\n\nprograms, but can also cause elusive logic errors\
    \ within your code if you’re not\n\ncareful.\n\nNow we can move on to look at\
    \ a very common operation on collections –\n\nsorting.\n\n*Sorting*\n\nWhile collections\
    \ of objects are often useful, it is a frequent requirement of a\n\nprogram to\
    \ sort the elements of a collection into some meaningful order. Once\n\nthe values\
    \ are stored in some suitable collection, it is fairly easy to sort them\n\ninto\
    \ whichever order you choose. Some of Java’s built-in classes provide a\n\nmethod\
    \ to sort the values automatically, but ArrayList doesn’t and so they, \n\nlike\
    \ arrays, have to be sorted “by hand”.³\n\n3\n\nThis is not strictly true – the\
    \ Collections class (in package java.util) provides \n\na static method called\
    \ sort, which will sort an ArrayList, and other types of collection.\n\nRead about\
    \ it in the API documentation or elsewhere on the web, and try it out for \n\n\
    yourself!"
