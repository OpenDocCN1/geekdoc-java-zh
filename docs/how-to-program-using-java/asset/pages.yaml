  md: "244\n\n*How to program using Java*\n\nthe correct amount of memory. So:\n\n\
    ArrayList myArrayList = new ArrayList (4);\n\ncreates an empty ArrayList called*\
    \ myArrayList*, which can initially hold\n\nfour elements. While this:\n\nArrayList\
    \ myArrayList = new ArrayList ();\n\nmight intuitively appear to create an array\
    \ list with no capacity, but actually\n\n(according to the API documentation)\
    \ creates one that can initially hold \n\n10 elements.\n\n*Adding elements*\n\n\
    Array lists (which we will now simply call *lists*) can store elements of any\
    \ type,\n\nprovided that they are objects. This means that it is complicated (but\
    \ possible)\n\nto use lists for the base types, so we’ll use the simplest object\
    \ type we have –\n\nString – in these examples. We’ll use a simple list of names,\
    \ declared:\n\nArrayList names = new ArrayList ();\n\nElements are added to a\
    \ list using the add method, and once again this is \n\noverloaded. The default\
    \ is for the newly added element to appear on the end of\n\nthe list. For example,\n\
    \nnames.add (\"Elvis\");\n\nwill add a String object with the value \"Elvis\"\
    \ to the end of *names*. It is also\n\npossible to specify where in the list you\
    \ wish the new element to be inserted.\n\nFor example:\n\nnames.add (0, \"Buddy\"\
    );\n\nwill add the String object, \"Buddy\", to index 0 of *names*, right at the\
    \ start.\n\nIf there is no space in the list for a new element it will grow automatically.\
    \ If\n\nan element is added at a particular place all the other elements will\
    \ automati-\n\ncally shuffle along to make room, and the list will grow if needed.\
    \ It really is\n\nrather neat.\n\nYou can actually add objects of any type to\
    \ an ArrayList – they are treated\n\ninternally as being different instances of\
    \ the same class, even though to the \n\nprogram they may be wildly different.\
    \ Unfortunately, this means that int,\n\nchar, double, and so on, cannot be added\
    \ directly to an ArrayList, as they\n\nare not objects. We will discuss how they\
    \ can be indirectly added later on.\n\nBut first we should take a look at what\
    \ is in our list.\n\n*Displaying the array list*\n\nThere is no handy method to\
    \ print out a list, so we have to resort to the strate-\n\ngy used for arrays\
    \ and use a loop. The size method will provide the number\n\nof elements in the\
    \ list, so the loop is determinate. We also need a method for\n\nextracting a\
    \ particular element; the API documentation reveals that this is\n\ncalled get.\n\
    \nThe loop to display the list is then very similar to the ones we used to print\n\
    \nout an array:\n\nSystem.out.println (\"The list now contains: \");\n\nfor (int\
    \ i = 0; i < names.size (); i ++) {\n\nSystem.out.println (i + \": \" + names.get\
    \ (i) );\n\n}"
