  md: "This is the end of the book but it is not the end of Java.\n\nFar from it,\
    \ in fact.\n\nJava has a great many more features that you haven’t yet seen or\
    \ had any\n\nneed to use. Java is continuing to develop and more and more features\
    \ will\n\ncertainly be added in the future. As Java becomes more popular, and\
    \ as\n\ncomputer programs become more and more complex, more and more powerful\n\
    \nfeatures are added to the language. Although you haven’t seen any of these yet\n\
    \nyou should hopefully now be able to pick them up as and when you need to \n\n\
    use them.\n\nThis chapter describes five of the more advanced features that would\
    \ make a\n\ngood next step in your learning. There’s nothing especially complicated\
    \ here\n\nbut all this chapter aims to give you is a quick overview. By now you\
    \ should be\n\nable to understand a new programming concept and then go and try\
    \ it out for\n\nyourself.\n\nAfter reading this chapter you should know about\
    \ some of the more\n\nadvanced features of Java that have not been covered in\
    \ this book. You should\n\nunderstand what they offer and you should know how\
    \ to find out more about\n\nthem if you need to.\n\n310\n\n*How to program using\
    \ Java*\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_327_0.png)\n\nThis chapter\
    \ describes five more advanced features of Java:\n\n●Exception handling;\n\n●Input\
    \ and output using files;\n\n●Overloading;\n\n●Inheritance;\n\n●A very basic introduction\
    \ to Graphical User Interfaces (GUIs).\n\nEach of these is described in turn;\
    \ they are arranged in no particular order.\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_327_1.png)"
