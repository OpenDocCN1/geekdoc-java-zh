  md: "100\n\n*How to program using Java*\n\nwill produce the following output on\
    \ the screen:\n\nThere's 4 wheels on my waggon.\n\nIf you need to do any sums\
    \ in the middle of an output statement, you should\n\nput the sums inside parentheses\
    \ just to make it clearer what you’re trying to do.\n\nIn fact, this is usually\
    \ only a problem if the sum is an addition. Consider the \n\nfollowing variable\
    \ assignments:\n\nint numDucks = 4;\n\nint numCoots = 2;\n\nAnd the following\
    \ two, subtly different, output statements:\n\nSystem.out.println (\"There are\
    \ \" + numDucks + numCoots\n\n\\+ \" birds here.\");\n\nSystem.out.println (\"\
    There are \" + (numDucks + numCoots)\n\n\\+ \" birds here.\");\n\nHere we have\
    \ a potential problem. In the first output statement, the values of\n\n*numDucks*\
    \ and* numCoots* are appended to the output string one after the other,\n\nwhile\
    \ in the second statement, the values are added together, and the result of\n\n\
    this addition is appended to the output string. So the first statement outputs\
    \ \n\na nonsense figure (42), while the second statement gives the correct figure\
    \ (6).\n\nFinally, you may sometimes wish to output information to the screen,\
    \ but\n\nwithout the newline character at the end. Thankfully those clever Java\
    \ people\n\nthought of that too, and provided another method with System.out,\
    \ called\n\nprint. So, as a last example for this chapter:\n\nSystem.out.print\
    \ (\"This is a line.\");\n\nSystem.out.println (\"This is another line.\");\n\n\
    will produce the output :\n\nThis is a line.This is another line.\n\n**Object\
    \ objection!**\n\nThe programs in this chapter are all very well and good. You\
    \ will find that you\n\ncan type them in using your Java system, and you will\
    \ be able to run them. But\n\nthere is something missing. Java is an object-oriented\
    \ programming language;\n\nwhere have the objects gone?\n\nIt is true that the\
    \ programs that you have seen in this chapter (so far!) \n\nhave had no objects\
    \ in them. In these examples Java has effectively been used\n\nwithout objects,\
    \ as a procedural language. This is fine and allowed, and is\n\nsometimes what\
    \ is needed. The real power of using Java comes when objects\n\nare used, however.\n\
    \nLet’s look at the traditional first program once again, but this time with some\n\
    \nadded objects. An application is needed here – we need something in the “real\n\
    \nworld” to model as an object – so we’ll decide that Bruce has recently installed\n\
    \na new illuminated sign outside his hut. He plans to use it to display interesting\n\
    \nmessages to all the other birds. Obviously his first step is to find out whether\n\
    \nhis new sign works properly, and displaying “hello, world!” on it would seem\n\
    \nto be a good start.\n\nThe first step here is to model Bruce’s sign as an object.\
    \ More accurately, we\n\nneed a model of a class that can represent all illuminated\
    \ signs, and Bruce’s sign\n\nwill be an instance of the class. We need to identify\
    \ the type’s attributes and\n\nmethods."
