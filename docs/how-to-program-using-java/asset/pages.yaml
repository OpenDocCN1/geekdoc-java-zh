  md: "different computer systems. On a Microsoft Windows system, for example, it\
    \ is\n\nnormally enough to double-click the mouse on the executable’s icon or\
    \ the\n\ndevelopment environment may run the program automatically.\n\nIn all\
    \ cases, though, running a program requires the use of the *Java Virtual*\n\n\
    *Machine*. This is another program that runs the compiled version (the bytecode)\n\
    \nof the program on the computer. One of the key advantages of Java is its porta-\n\
    \nbility; the compiled version of a program will run with any JVM, running on\n\
    \nany sort of computer system.\n\nOn the Unix system used for this book the command\
    \ to execute the program\n\nis simply *java*, so to execute the code contained\
    \ in the file *MyProg.class*, the\n\ncommand is:\n\n*tetley% java MyProg*\n\n\
    It’s time to consult the *Local Guide* to check how to do it on your system.\n\
    \n**Other useful things**\n\nWhen working on a program it is often very useful\
    \ to be able to print your\n\nsource code out. This gives you something that you\
    \ can scribble all over as you\n\ntry and work out why your program isn’t working\
    \ as you hope and expect.⁶\n\nYou’ll have to consult the *Local Guide* to find\
    \ out how to print your programs\n\nand to find out where the printers are.\n\n\
    There may be other tools available to you to help you as you learn to\n\nprogram.\
    \ There may be a special program called a *debugger*; this is a tool that\n\n\
    lets you step through a program a line at a time to help you find and correct\n\
    \nproblems. There may be a program that helps you format your source code\n\n\
    neatly. Find out what’s available and make sure you can use it.\n\n**A closer\
    \ look**\n\nThe description of compilation in this chapter is a little simplistic\
    \ and it will\n\nhelp if you have a slightly better knowledge of what’s actually\
    \ going on when\n\nyou compile a program. A full discussion of how compilers work\
    \ is way beyond\n\nthe scope of this book and is actually way more than most programmers\
    \ need\n\nto know, but a little more detail will help you when you start looking\
    \ for errors\n\nin your programs.\n\nYou have seen that there is an intermediate\
    \ stage between the source code\n\nand the executable version of the program.\
    \ This stage is called *bytecode*; it is the\n\nfirst thing created by the compiler\
    \ from your source code. You will be able to\n\nsee the files produced by this\
    \ first stage of the process; the extension they have\n\nis always .*class*.\n\
    \nThe bytecode is then *executed* (by another program called the JVM) which can\n\
    \naccess other program code from various libraries on the system, known as *pack-*\n\
    \n*ages*. These packages contain the code needed for the basic Java functions\
    \ \n\n(so that the program knows how to display characters on the screen, for\n\
    \nexample). All the code, both from your program and from any packages used,\n\
    \nis loaded together when the executable is run.\n\n*The mechanics*\n\n25\n\n\
    6\n\nOr indeed something that you can show to people to impress them."
