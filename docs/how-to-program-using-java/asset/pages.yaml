    \ your own set of\n\npreferences.\n\nThere is no such thing as a good or bad style,\
    \ as long as the style follows some\n\nbasic rules. It is essential that any style\
    \ is consistent. If a programmer chooses\n\nto use a particular way of laying\
    \ out a particular part of a program the pro-\n\ngrammer should use precisely\
    \ the same layout every time they write a similar\n\npiece of program. As a first\
    \ example, here is a very simple Java statement:\n\nnumber = 1;\n\nThat line is\
    \ laid out as I would do so were I writing a program. There is a space\n\nbefore\
    \ and after the equals sign, and no space before the semi-colon. Other \n\nprogrammers,\
    \ including many of those that I have worked with, might write it\n\nlike this:\n\
    \nnumber=1;\n\nwith no spaces, or even:\n\nnumber = 1 ;\n\nwith a space before\
    \ the final semi-colon. None of these styles is better than the\n\nothers; the\
    \ programming statement is perfectly clear in each case and it will\n\nobviously\
    \ do the same thing in each case. What is crucial is that a programmer\n\nchoosing\
    \ any of these three styles should use the same layout in every similar\n\nstatement.\
    \ It should be obvious that a program that contained a section like this:\n\n\
    number = 1;\n\nanotherNumber = 2;\n\naThirdNumber = 3 ;\n\nis an example of very\
    \ poor and inconsistent style. It’s a bit like writing a section\n\nof a book\
    \ in normal text, ANOTHER IN BLOCK CAPITALS, *and some more *\n\n*in italics*\
    \ for no good reason. This does not look good, and does not give the\n\nimpression\
    \ that the programmer (or author) has paid attention and taken pride\n\nin their\
    \ work.\n\nFor the moment it probably does make sense for you to follow the style\
    \ of the\n\nprograms in this book. The only exception to this would be if you\
    \ were required\n\nto follow another for some reason; perhaps the course you are\
    \ following expects\n\nyou to use a particular style. Whatever you do, make sure\
    \ that the style you \n\nfollow is consistent.\n\n1\n\nNow, you might well be\
    \ thinking that two people wrote the programs in this book, so \n\nwhat did they\
    \ do about style? We negotiated, and arrived at a style that we were both \n\n\
    reasonably happy with. We then both wrote the programs to conform to it. Sometimes\
    \ \n\nprogrammers have to program to conform to another style, as we will see."
