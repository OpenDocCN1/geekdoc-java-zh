  md: "●After the ingredients have been listed the recipe consists of a sequence of\n\
    \nsteps that the user must follow in the correct order to achieve the desired\n\
    \nresult – it would be foolish to put the cake tins in the oven before making\
    \ the\n\nmixture.\n\n●Some steps require the user to make comparisons and take\
    \ decisions based\n\non what they find – in this case the user must repeat the\
    \ action “beat” until\n\nthe mixture is white.\n\n●Some steps require the user\
    \ to make choices – here the cake is covered in\n\nchocolate only if desired.\n\
    \nIt would also be possible (but admittedly unlikely) for a cook to follow all\
    \ the\n\nsteps of this recipe without any knowledge of what the final result was\
    \ going\n\nto be. That is exactly how a computer interacts with a program; it\
    \ follows the\n\ninstructions that it is given without any knowledge or understanding\
    \ of the\n\nresult that the programmer is trying to achieve.\n\nA computer program\
    \ is simply a “recipe”, called an *algorithm*, presented to a\n\ncomputer in order\
    \ to allow it to carry out some task. The recipe is written by a\n\nprogrammer\
    \ and is expressed in a programming language. The programming\n\nlanguage has\
    \ a vocabulary from which the programmer constructs the instruc-\n\ntions that\
    \ the computer can understand and execute. These instructions form \n\na computer\
    \ program.\n\n**Programming languages**\n\nEarly “computers” were designed to\
    \ fulfil a single purpose. The devices\n\ngenerally considered the earliest computers,\
    \ the Difference Engine and Analytical\n\nEngine designed and partially built\
    \ by Charles Babbage, were designed to carry\n\nout the calculation of mathematical\
    \ tables. This extremely tedious and repetitive\n\ntask was an obvious candidate\
    \ for automation, especially as the many errors \n\nin the human-generated tables\
    \ could prove very costly.\n\nBabbage never completed his machines. He was misunderstood\
    \ and ridiculed\n\nduring his lifetime and died unknown. One of the few to recognise\
    \ the potential\n\nand importance of his work was Lady Ada Lovelace, now generally\
    \ recognised\n\nas the first computer programmer. Lady Lovelace developed a mathematical\n\
    \nnotation for representing different ways to “program” Babbage’s Analytical\n\
    \nEngine. Sadly, as the machine was never built, it was never programmed. Today\n\
    \nthere is a replica of Babbage’s Difference Engine in the Science Museum in\n\
    \nLondon; it is the first exhibit in the gallery tracing the history of computing.\
    \ Any\n\nself-respecting programmer should take a moment when in London to examine\n\
    \nthe Difference Engine, especially now that admission is free.\n\nThe first electronic\
    \ computers were programmed in what we would now\n\nconsider very “low-level”\
    \ ways. The programming involved changing physi-\n\ncal components in the computers;\
    \ levers were set, wires were moved, and\n\nswitches were changed. This was a\
    \ slow and error-prone job. This was also the\n\ntime when the first computer\
    \ program “bugs” were encountered; these were\n\nmoths that crawled into the computers,\
    \ promptly died, and stopped them\n\nworking²^ properly.\n\n14\n\n*How to program\
    \ using Java*\n\n2\n\nThe moth normally stopped working properly too. There is\
    \ actually a school of thought\n\nthat this story about the moths is an “Urban\
    \ Legend”. Why not spend a bit of time looking\n\nin to this on the web?"
