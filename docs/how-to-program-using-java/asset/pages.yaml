  md: "118\n\n*How to program using Java*\n\nuser input is complicated, and far beyond\
    \ your capabilities at the moment, \n\nso we have chosen to hide it in classes\
    \ of our own for the time being.²^ So if you\n\nwere to move to a different computer\
    \ and try to run these programs, you may\n\nwell find that they won’t run. Before\
    \ carrying on, make sure that you have the\n\n*Console* class correctly set up,\
    \ as described in Chapter 3.1\n\nThe first example program in this section demonstrates\
    \ how to make \n\na running program read an integer value.\n\n/\\* ReadDemo.java\
    \ – Demonstrating a simple form of interactive\n\ndata entry.\n\nAuthor\n\n: GPH\n\
    \nDate\n\n: 8th June 2003\n\nTested on\n\n: Linux (Red Hat 8.0), JDK 1.4.1\n\n\
    \\*/\n\nimport htpuj.\\*;\n\npublic class ReadTest\n\n{\n\npublic static void\
    \ main (String\\[\\] args)\n\n{\n\nSystem.out.print (\"Enter an int : \");\n\n\
    System.out.println (\"You entered \\\\\"\" + Console.readInt ()\n\n\\+ \"\\\\\"\
    \");\n\n}\n\n}\n\nIt should be clear from this example that the *Console* class\
    \ is the “black box”\n\nwe have provided to allow you to read data interactively.\
    \ This class is part of\n\nour very own package, called *htpuj*, which must be\
    \ imported at the start of\n\nany program using it. The *readInt* method of this\
    \ class, as you would expect,\n\nattempts to read an integer value after the user\
    \ has typed one (and throws a\n\nsuitable error if the value it encounters is\
    \ not of the correct format, that is, \n\nall digits). *readChar*,* readDouble*,\
    \ and *readString* methods are also pro-\n\nvided, and these work exactly as you\
    \ would expect.\n\nContinuing with the theme started earlier in the chapter, Bruce’s\
    \ sign can be\n\nextended so that the message can be provided interactively. Again,\
    \ only minor\n\nchanges are needed. First, we need to import extra functionality\
    \ (the *Console*\n\nclass) from an external source:\n\nimport htpuj.\\*;\n\nNext,\
    \ we need to add some sort of prompt for the user’s benefit:\n\nSystem.out.print\
    \ (\"Enter message: \");\n\nFinally, we need to call the *setMessage* method,\
    \ passing the message we\n\nreceive from the user as the parameter:\n\nbrucesSign.setMessage\
    \ (Console.readString () );\n\n2\n\nDon’t worry, we will reveal all before the\
    \ book is out, when you’ve learnt enough Java \n\nto understand how our classes\
    \ work! If you really want to know, it’s all in the back of \n\nthe book."
