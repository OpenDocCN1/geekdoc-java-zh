  md: "**Designing the methods**\n\nEach method must now be designed. This involves\
    \ specifying the effect of \n\neach method in detail. It is normal to use a structured\
    \ format for writing this\n\ninvolving the specification of:\n\n●the purpose of\
    \ the method\n\n●the inputs of the method\n\n●the values that are changed by the\
    \ method\n\n●any side effects (such as output on a screen or changes to a file\
    \ of data) that\n\nthe method may produce\n\nThe format of this information should\
    \ be fixed and, in practice, might well be\n\nrecorded on some suitable form.\n\
    \nFor example, the specification for the *display* method of the *Duck* object\n\
    \ntype would be:\n\n*Name:*\n\n*display*\n\n*Object type:*\n\n*Duck*\n\n*Purpose:*\n\
    \n*Displays the details of a duck on the screen*\n\n*Inputs:*\n\n*a Duck object*\n\
    \n*Values Changed:*\n\n*None*\n\n*Side Effects:*\n\n*Display on the screen*\n\n\
    This specification would be extended in the final design process to include a\n\
    \nprecise description of the layout for the display; this might well make use\
    \ of \n\na diagram. In practice it is likely that the analyst would use some sort\
    \ of form\n\nto record the specification for the programmer.\n\nThe* sell* method\
    \ has an input; the programmer must provide a reference to\n\nthe reserve to which\
    \ the duck has been sold. This method also carries out a\n\nrather more complicated\
    \ task than simply displaying the values on the screen,\n\nso a more lengthy description\
    \ of its effect would be provided:\n\n*Name*\n\n*sell*\n\n*Object type:*\n\n*Duck*\n\
    \n*Purpose:*\n\n*Records that a duck has been sold*\n\n*Inputs:*\n\n*a Duck object\
    \ and a Reserve object*\n\n*Values Changed:*\n\n*\"sold to\" attribute of the\
    \ duck*\n\n*Side Effects:*\n\n*None*\n\n*Description:*\n\n*The value of the \"\
    sold to\" attribute of*\n\n*the duck should be changed to store the*\n\n*Reserve\
    \ object provided. If this value*\n\n*already indicates that the duck has been*\n\
    \n*sold an error message should be displayed*\n\n*and no changes should be made*\n\
    \nObviously this detailed description can become very complex. Worse than that\n\
    \nit can be very hard to write it with precision; if the programmer misinterprets\n\
    \nwhat the analyst has written the final program will not work as expected.\n\n\
    For this reason it is useful to be able to write the description out in a slightly\n\
    \nmore formal and unambiguous way. The normal way to do this is to write in a\n\
    \nform of *pseudocode*. This is a form of language that is much more terse and\n\
    \nprecise and is, in fact, quite close to a computer programming language. There\n\
    \nare no hard and fast rules for writing pseudocode (although some software\n\n\
    companies may have a preferred or recommended style), except that anything\n\n\
    *A word on analysis and design*\n\n59"
