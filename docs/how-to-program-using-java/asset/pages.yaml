    We need a list of options; one for each of the tasks we’ve discussed, plus the


    ubiquitous “*press Q to quit*”. We also need to incorporate some kind of format-


    ted output, to make the menu system easier on the eye. In fact, it is easy enough


    to use asterisks as we did for the previous menu. The architecture of this menu


    system will be almost identical to the one for *modifyDuck* with the only


    changes being in the output, and the choice of method for each option. We still


    have a variable to store the user’s choice of option, and a switch statement to


    control the program according to this option.


    We could simply implement this menu system in the main method of the


    program. However, this causes problems if we ever wish to use this functional-


    ity as part of another, larger program (say, if a well-known sports broadcaster


    decided to show coverage of the Waterfowl Cricket Cup, and wanted to use


    such a database alongside the rest of their fancy graphics). Therefore we will


    implement this “main” menu in a separate method (named *run*), and simply


    call this method from within main.


