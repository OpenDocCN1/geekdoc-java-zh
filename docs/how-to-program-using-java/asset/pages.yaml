    \ you to write more\n\nuseful programs than you have been able in previous chapters,\
    \ it is still fairly\n\nrestrictive – the user must know the data values that\
    \ need to be passed *before*\n\nrunning the program. A program would be more flexible\
    \ if the user were given\n\nthe option to pass data to the program while it executes\
    \ – in other words, inter-\n\nactively. Thankfully, help is at hand, as Java has\
    \ mechanisms available to allow\n\nsuch a thing.\n\nFirst, a word of warning.\
    \ The example programs we give here are not \n\nstrictly speaking “correct” Java\
    \ since the code required to accept interactive"
