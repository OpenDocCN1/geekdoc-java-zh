  md: "**software engineer** Skilled craftsperson who engages in *software engineering*.\
    \ Not\n\nnecessarily interchangeable with the term *programmer*.\n\n**software\
    \ engineering** The process of creating working software, including pro-\n\ngramming,\
    \ testing, evaluation and documentation.\n\n**sorting algorithm** An* algorithm*\
    \ used to sort a collection of values into some order,\n\ndetermined by some rules\
    \ (for example, sorting a list of names into alphabetical\n\norder).\n\n**source\
    \ code** A sequence of characters which are meaningful to both a *programmer*\n\
    \nand a *compiler*.\n\n**statement** A line of code which performs some task within\
    \ a *class*.\n\n**static** A* method* or* attribute* of a class which does not\
    \ require an *object* of that *class* in\n\norder to be used.\n\n**string** A*\
    \ data type* representing a sequence of characters.\n\n**style** The way in which\
    \ a *programmer* lays out the *source code* of a *program*. Relies on\n\n*indentation*,\
    \ and it is important that this is consistent.\n\n**test case (or test condition)**\
    \ A set of input values and their corresponding output\n\nvalues, used as part\
    \ of a *test plan* to evaluate the correctness of a program.\n\n**tester** A person,\
    \ usually a *programmer* or a close associate, who applies a *test plan* to\n\n\
    a* program*.\n\n**test harness** A program used to test the implementation of\
    \ a *class*.\n\n**test plan** A set of *test cases* which, if all satisfied, provides\
    \ sufficient evidence that \n\na* program* will work as intended.\n\n**transaction**\
    \ Something that happens in a problem that changes some value; \n\nusually corresponding\
    \ to a *method*.\n\n**truth table** A visual representation used to show all the\
    \ possible outcomes of \n\na* Boolean expression*.\n\n**type** See* data type*.\n\
    \n**typical value** A* test case* representing a (usually random) value which\
    \ may be \n\nprovided to a *program* by a *user* during the course of normal execution.\n\
    \n**user** Person who utilises a *program* written by a skilled *programmer*,\
    \ and invariably\n\ndiscovers unexpected ways to break it. Very good at uncovering\
    \ *bugs*.\n\n**variable** A value which may change during the lifetime of a *program*.\n\
    \n**variable declaration** A* statement* where a variable is created. Includes\
    \ the variable’s\n\ntype and *identifier*, and optionally an initial value.\n\n\
    **vector** Similar to an *array*, but can grow and shrink during the lifetime\
    \ of a *program*.\n\nSee also *array list*.\n\n**void method** A* method* which\
    \ does not *return* a value to its *calling method*.\n\n**white box testing**\
