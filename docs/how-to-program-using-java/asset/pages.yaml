  md: "*C++, C# and Python*\n\n347\n\ncin >> name;\n\ncout << \"hello,\" << name <<\
    \ endl;\n\nreturn 0;\n\n}\n\nC was a development of the C language, and both these\
    \ languages are to\n\nsome extent ancestors of Java. You can read more about C\
    \ at the home page\n\nof its inventor, Bjarne Stroustrup:\n\n*http://www.research.att.com/~bs/*\n\
    \nThe home pages of Brian Kernigham and Dennis Ritchie provide a good bit\n\n\
    of history of the development of C. The contribution of these two (K and R, as\n\
    \nthey are generally known) is hard to overstate. Both K and R work at Bell Labs\n\
    \nin New Jersey and their pages are:\n\n*http://www.cs.bell-labs.com/who/dmr/*\n\
    \n*http://www.cs.bell-labs.com/who/bwk/*\n\n*C#*\n\nYou might also have heard\
    \ of C# (pronounced C-sharp). C# is closely related to\n\nC and Java, and is worthy\
    \ of quick mention here. C# is a proprietary prod-\n\nuct of Microsoft; it is\
    \ the programming language associated with Microsoft’s\n\n.NET initiative. Like\
    \ Microsoft’s other visual programming languages, C# \n\nis written using a complete\
    \ IDE (you have probably seen or used tools such as\n\nAccess or Visual BASIC).\n\
    \nC# is quite a controversial topic. Some have argued that it is simply\n\nMicrosoft’s\
    \ attempt to compete with Java; Microsoft obviously has a propri-\n\netary operating\
    \ system and could be expected to be worried by a language that\n\nwould run on\
    \ many different systems. Some have gone further and suggested\n\nthat C# is little\
    \ more than a copy of Java made specific for the Microsoft plat-\n\nform. Others,\
    \ on the other hand, state that the emergence of C# and Java at\n\nroughly the\
    \ same time is little more than coincidence. There are plenty of\n\npeople who\
    \ will argue for each of these.\n\nYou can make your own mind up. Microsoft’s\
    \ own site contains all you could\n\nneed to know about C#, as well as handy pointers\
    \ on where to buy it:\n\n*http://msdn.microsoft.com/vcsharp/*\n\nA search on any\
    \ web search engine will lead you to many of the arguments!\n\n*Python*\n\nA final\
    \ language worth a mention in its own right is Python. Python is, like Java,\n\
    \na platform-independent language and implementations of Python are free. You\n\
    \ncan find out all about it and download a copy at the Python web site:\n\n*http://www.python.org/*\n\
    \nIn particular the Beginners’ Guide at:\n\n*http://www.python.org/doc/Newbies.html*\n\
    \nwill help you on your way to learning some Python. There is also an excellent\
    \ free\n\nbook by Jeff Elkner and others describing all the Python you might need\
    \ available:\n\n*http://www.ibiblio.org/obp/thinkCSpy/*"
