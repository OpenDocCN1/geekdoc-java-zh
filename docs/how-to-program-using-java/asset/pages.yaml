  md: "You already know that Java is an *object-oriented* programming language. Many\n\
    \nother currently popular programming languages including C, Python, and\n\nC#\
    \ also use this object-oriented approach. This means, not surprisingly, that\n\
    \nprogramming in Java (and these other languages) is based around the use of\n\
    \n*objects*; objects are the basic building block of any object-oriented computer\n\
    \nprogram. Java takes the idea further than some other object-oriented languages\n\
    \nto the extent that almost everything in a Java program is an object; even the\
    \ Java\n\nprogram itself looks rather like an object (even if it isn’t actually\
    \ one).\n\nOne of the key advantages claimed for object-oriented programming is\
    \ that\n\nthe programs developed to implement an object required for use in one\n\
    \nproblem can be used again in another problem; the programs to implement the\n\
    \nobject are *portable*. This potential for *code re-use* is one of the reasons\
    \ why object-\n\noriented programming is currently so popular; code re-use has\
    \ the potential to\n\nsave a lot of time and therefore money.\n\nThis chapter\
    \ introduces you to the idea of an object. After reading this chapter\n\nyou should\
    \ understand that objects are the basic component of any object-\n\noriented computer\
    \ program and you should also understand what exactly\n\nobject-oriented means.\
    \ You should understand how an object is characterised by\n\nits* attributes*\
    \ and its *methods*, and you should be able to suggest likely attributes\n\nand\
    \ methods for objects that might be found in some everyday applications.\n\nThere\
    \ is very little in this chapter that is specific to Java. The principles of\n\
    \nobjects, attributes, and methods are the same in any object-oriented language,\n\
    \nand even in some database systems that use a similar, object-oriented approach.\n\
    \nIn fact, if you’ve done any work with databases you’ll probably see some clear\n\
    \noverlaps between what you’ve learned there and this chapter.\n\n40\n\n*How to\
    \ program using Java*\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_57_0.png)![](img/05fa4bae6319441a0b86c0179baaedc2_57_1.png)\n\
    \nBefore starting to write object-oriented computer programs you obviously \n\n\
    need to know what exactly an *object* is in this context. Informally an object\
    \ is"
  merge: -1
