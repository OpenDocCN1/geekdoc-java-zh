  md: "*Input*\n\n115\n\n*tetley login: gph*\n\n*Password:* <*password*\\>\n\n*Last\
    \ login : Wed May 28 20:04:53 on tty4*\n\n*tetley%*\n\nAssuming the username and\
    \ password are entered correctly, the user now\n\nhas access to the system (hence\
    \ the prompt is displayed). If, however, the cre-\n\ndentials are incorrect in\
    \ any way, the console would look something like this:\n\n*tetley login: gph*\n\
    \n*Password:* <*password*\\>\n\n*Login incorrect*\n\n*login:*\n\nSo, it is easy\
    \ to make an interactive program fault-tolerant without the need \n\nto terminate\
    \ it at the first sign of a problem. In the above case, the program \n\nsimply\
    \ prompts for a username and password again after displaying an error\n\nmessage.\
    \ If such a program were, for any reason, non-interactive, it would be\n\nmuch\
    \ harder to incorporate the same level of fault-tolerance, and in fact it\n\n\
    would probably be easier (though more untidy) to display an error message\n\n\
    and terminate the program immediately.\n\nThere is no reason why a program cannot\
    \ benefit from both command line\n\narguments and user interaction. For example,\
    \ there are text processors which\n\ntake the name of the file to be processed\
    \ as a command line argument, and if\n\nthe text contains a mistake, the user\
    \ is prompted to enter the correct text.\n\n**Using command line arguments in\
    \ Java programs**\n\nAs with many things in programming, command line arguments\
    \ are easy to\n\nuse, but rather tricky to use correctly. In the *dir* example\
    \ above, each argument\n\nneeds to be identified, its function invoked, and the\
    \ result combined with the\n\nrest of the output to give the user what they expect.\
    \ Java is no different in this\n\nrespect; it is down to the programmer to perform\
    \ checks on the arguments and\n\nhave the program perform accordingly; there is\
    \ no magic involved.\n\nBelieve it or not, you have been specifying command line\
    \ arguments since \n\nthe very first program you wrote. They are hidden away in\
    \ the declaration of\n\nthe* main* method:\n\npublic static void main (String\
    \ args\\[\\])\n\nYou should be familiar with this line by now since every executable\
    \ Java pro-\n\ngram contains this line, in exactly this form. Up to now, the String\
    \ args\\[\\]\n\npart has been a mystery to you, but this actually specifies the\
    \ list of command\n\nline arguments provided to the program at the command line.\
    \ The square\n\nbrackets tell the compiler to expect a list (known as an *array*,\
    \ which we will look\n\nat in more depth in Chapter 17), and this list contains\
    \ objects of type String.\n\nA simple example would be helpful at this point:\n\
    \n/\\* CLAtest.java – a nonsense example demonstrating CLAs.\n\nAuthor\n\n: GPH\n\
    \nDate\n\n: 28th May 2003\n\nTested on: Linux (Red Hat 8.0), JDK 1.4.1\n\n\\*/"
