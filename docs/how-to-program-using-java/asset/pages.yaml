    \ is something that calculates \n\na new value. For example:\n\ngrade = 70 + 2;\n\
    \n// grade is 72\n\nname = \"ada \" + \"lovelace\"; // name is \"ada lovelace\"\
    \n\nThese expressions can also contain variables:\n\nint birds;\n\nint geese;\n\
