    The first step in testing this program is to develop a plan; not surprisingly


    this is called a *test plan*. This plan will simply list some input values (called
    *test*


    *data*) that will be provided to the program together with the results that would


    be expected if the program were working as expected. These expected results


    are calculated, in advance, by hand. They are obviously checked very thor-


    oughly as mistakes can be disastrous.


    Each set of input values and expected results forms one *test case* for the


    program. If the program produces the correct results for each test case (and


    assuming that there are sufficient test cases to cover all possibilities) then
    it will


    be safe to assume that the program is correct and so works as intended.


    Some sample test data for Cilla’s program is:


    **Input**


    **Expected Outputs**


    ducks


    teams


    ducks left over


    10


    0


    10


    65


    5


    10


    100


    9


    1


    So, for example, the third test case here states that if there were a hundred
    ducks


    the correct results from the program would be nine teams with one duck left


    over as to act as a substitute. The other two test cases simply test other possible


    input values.


    Testing the program is then just a case of running it for each set of data and


    recording the actual results. These results are compared to the expected results


    for the same test case and if they all match the program has passed all the tests


    and is assumed to work.'
