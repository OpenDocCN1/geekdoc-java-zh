  md: "238\n\n*How to program using Java*\n\n**Arrays**\n\nAn array is essentially\
    \ a block of memory locations of the same type, referred\n\nto by a common name.\
    \ Each location is referred to as an *element*. As an analogy,\n\nwe think of\
    \ the word, “duck”, rather than the letters “d”, “u”, “c”, and “k”. We\n\nhave\
    \ a word (an array) consisting of a number of letters (elements). Taken as a\n\
    \nwhole the word does something useful, and sometimes we treat the whole\n\nword\
    \ as a single unit. There are times, though, when we are interested in what\n\n\
    the individual letters actually are and we are usually very interested in the\n\
    \norder in which the letters appear.\n\nThe individual locations within an array\
    \ are known as array elements \n\n(corresponding to the letters in our example),\
    \ and each element can be referred\n\nto by its position within the array. So\
    \ rather than using, say, 30 String vari-\n\nables to store the names of students\
    \ in a class, we can use an array variable \n\ncontaining 30 Strings. Also, rather\
    \ than having to refer to the 23rd String\n\nvariable, we can access the 23rd\
    \ element of the array.\n\nThe first stage in using an array is obviously to declare\
    \ one and to get hold of\n\nsome suitable memory. Generally, an array is declared\
    \ as follows:\n\n*<**variable type**\\> <**identifier**\\>**\\[\\];*\n\nAnd initialised\
    \ as follows:\n\n*<**identifier**\\>=** new** <**variable type**\\>** \\[**<**number\
    \ of elements**\\>**\\];*\n\nIt is probably best to introduce an example here.\
    \ Suppose that we want \n\nto create an array of four integers. This is a process\
    \ of two stages and is \n\nachieved by:\n\nint numbers\\[\\];\n\nnumbers = new\
    \ int\\[4\\];\n\nThe first line¹^ tells the compiler to allocate a block of memory\
    \ large enough \n\nto store four integer values. This block can then be referred\
    \ to by the name \n\n*numbers*. The square brackets after the identifier tell\
    \ the compiler that this\n\nidentifier refers to an array. The new keyword on\
    \ the second line allocates mem-\n\nory to objects (you have seen it before when\
    \ creating objects of your own), and\n\nthe 4 in the square brackets gives the\
    \ number of elements in the array. The vari-\n\nable types must match between\
    \ these lines, or else the compiler will complain.\n\nAs usual it is possible\
    \ to combine these two steps. These two lines could of\n\ncourse be written as\
    \ a single statement:\n\nint numbers\\[\\] = new int\\[4\\];\n\nNow we have an\
    \ array, we need to access the individual elements. Values are\n\nassigned to\
    \ the elements in an array using the element’s position in the array\n\n(this\
    \ position is also known as the *index*). For example:\n\nnumbers\\[1\\] = 5;\
    \ // assigns the value 5 to the element with index 1\n\nTo refer to an element\
    \ of an array, we use the square brackets seen earlier, with\n\nthe relevant array\
    \ index between them. We have in fact seen this syntax before\n\nwhen we have\
    \ been interested in extracting a command-line argument. It now\n\n1\n\nSome programmers\
    \ would argue that it would be better style to write int\\[\\] numbers;\n\nThis\
    \ is perfectly legitimate Java."
