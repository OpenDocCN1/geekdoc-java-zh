  md: "76\n\n*How to program using Java*\n\nuntil it worked again. This random approach\
    \ would probably work, but is far\n\nfrom the cheapest or most efficient way of\
    \ repairing a car.\n\nThese two examples highlight tasks where a structured and\
    \ methodical\n\napproach is essential. You will not be surprised to learn that\
    \ programming \n\nis another such task. There is a set of steps that must be followed,\
    \ in order, \n\nwhen any program is written. Failure to follow these steps is\
    \ a sure recipe for\n\ndisaster. Much the same applies to following the steps\
    \ in the wrong order \n\nor jumping randomly between them.\n\nThese two examples\
    \ of building a house and repairing a car are based on two\n\napproaches that\
    \ new programmers sometimes adopt. Some will create a pro-\n\ngram of many hundreds\
    \ of lines before starting to see whether it works or even\n\nwhether it compiles.\
    \ Faced with errors, some will then start randomly changing\n\nrandom parts of\
    \ this program until it works. Either way, these are things that\n\nan experienced\
    \ programmer would never do, and the best idea really is to make\n\nsure that\
    \ you never do them!\n\n**Writing a program**\n\nA user who requires a new program\
    \ will expect a programmer to go through a\n\nprocess that is very similar to\
    \ that you would expect from a car mechanic. The\n\nfirst step is to carry out\
    \ an analysis to acquire a thorough understanding of the\n\nproblem. This is followed\
    \ with a design of the most appropriate solution, which\n\nis then quickly and\
    \ efficiently implemented as object types and programs. It\n\nwould be a huge\
    \ mistake to start writing the program before the problem had\n\nbeen fully investigated\
    \ and understood. It would be equally foolish to start\n\nwriting the program\
    \ before it had been properly designed.\n\nThe process of writing the program\
    \ itself follows a similar pattern. The first\n\nstage is to implement the object\
    \ types that will be required. These are tested\n\nfully in isolation so that\
    \ the programmer is sure that they work correctly. Only\n\nwhen they have been\
    \ thoroughly tested should they ever be used in a program.\n\nOnce again it is\
    \ extremely foolish to start writing a program that uses some\n\nobject types\
    \ before the object types have themselves been written and tested.\n\nSuch a mistake\
    \ would only lead to a great deal of extra and unnecessary work\n\nas more and\
    \ more errors had to be located and corrected. And worse, if a \n\nprogram is\
    \ written before the object types have been fully tested it is very diffi-\n\n\
    cult to know for certain if the errors are in the program or in the object types\
    \ \n\nthemselves.\n\nEven the production of the program code itself follows the\
    \ same pattern. \n\nThe code should always be developed in a steady incremental\
    \ manner.\n\nFunctionality should be added to the program very gradually, and\
    \ any new\n\nfunction should be tested and shown to work before any further development\n\
    \nis attempted. Build the house one storey at a time, and make sure that the \n\
    \nbottom one won’t fall down before you start upstairs.\n\nSometime in the future\
    \ you will be writing a program and you will not be\n\nable to get it to work.\
    \ You will have the chance here to make a huge mistake.\n\nYou will have the chance\
    \ to ignore this problem and then starting to work on\n\nsome other part of the\
    \ problem. If you do this you are only making worse trou-\n\nble for yourself!\
    \ Never start working on a different part of the program when\n\nyou find that\
    \ you can’t go any further in one area. Find some help and sort out\n\nthe first\
    \ problem."
