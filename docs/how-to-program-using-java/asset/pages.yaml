  md: "*The basics*\n\n95\n\nWhen more than one of these is used in a single expression\
    \ the operators have\n\na* precedence* that determines the order in which they\
    \ are executed. This is the\n\nsame as you might be used to in arithmetic or algebra.\
    \ The order of precedence\n\nfor these four operators is: / and \\*, then  and\
    \ . In other words, division and\n\nmultiplication are carried out before addition\
    \ or subtraction.\n\nThe idea of an order of precedence often catches new programmers\
    \ out and\n\ndoes indeed take a fair bit of getting used to. Look at the following\
    \ statement:\n\nint number = 2 + 8 / 2;\n\nYou might think that *number* is assigned\
    \ the value 5. You might expect that \n\n2 is added to 8 to give 10 which is divided\
    \ by 2 to give the answer. Not so! The\n\nvalue* number* is actually assigned\
    \ is 6. Division happens first (it has a higher\n\nprecedence), so 8 is divided\
    \ by 2 to give 4 and that result is added to the first 2\n\nto give 6.\n\nSince\
    \ this can be confusing, brackets can be added to the expression to make\n\nthings\
    \ clearer. Again, this is the same as in algebra – the part of the expression\n\
    \nin brackets is worked out first and then the precedence of the operators takes\n\
    \nover. In other words, brackets have a higher precedence than the arithmetic\n\
    \noperators. The statement above could be written:\n\nint number = 2 + (8 / 2);\
    \ // number is assigned 6\n\nto emphasise that the 8 is to be divided by 2 first.\
    \ If this is not what is wanted,\n\nit could be written:\n\nint number = (2 +\
    \ 8) / 2; // number is assigned 5\n\nwhich changes the expression to make the\
    \ addition happen first. In this case\n\nthis also changes the result of the expression.\n\
    \nIt is good practice to always include brackets in expressions even when \n\n\
    the precedence of the operators would achieve the desired result. It makes \n\n\
    the programmer’s intention clearer and removes the possibility that other \n\n\
    programmers will suspect a mistake!\n\n**Some shorthand**\n\nA common operation\
    \ that happens in almost all programs is to add one to \n\nor* increment* the\
    \ value of a variable holding a numeric value. For an integer \n\nvariable the\
    \ assignment statement for this is:\n\nnumber = number + 1;\n\nThis is so common\
    \ that Java provides a shorthand form for this. A variable \n\ncan be incremented\
    \ using the  operator.³^ An integer variable can be incre-\n\nmented using this\
    \ operator:\n\nnumber ++;\n\nThis has exactly the same effect as the longer form:\n\
    \nnumber = number + 1;\n\nThe only advantage of using this shorthand is in the\
    \ amount of typing the \n\nprogrammer has to do. The operation is so common that\
    \ it does save a lot of\n\ntyping.\n\n3\n\nThis operator explains why C is so-called.\
    \ It is after all C with some extra things added."
