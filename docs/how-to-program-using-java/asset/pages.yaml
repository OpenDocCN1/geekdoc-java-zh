  md: "*The basics*\n\n97\n\nBut suppose that *cost* had the value 12.75. The integer\
    \ variable *number*\n\ncan’t store the decimal part, and in this case it would\
    \ be lost. This issue crops\n\nup most often in division. The thing to remember\
    \ is:\n\n*an int divided by an int is an int and nothing but an int*\n\nThis means\
    \ that any decimal part of the result is lost. For example:\n\nint number;\n\n\
    number = 5 / 2; // number is 2\n\nnumber = 1 / 2; // number is 0\n\nIt might seem\
    \ that this should not be allowed to happen and that any case\n\nwhere it does\
    \ it an error. The fact is that sometimes this result can actually be\n\nwhat\
    \ it required; it is actually a potentially useful result, the number of times\n\
    \nthe right-hand side of the division “goes into” the left-hand side. You might\n\
    \nremember “remainders” in division; all that’s happening here is that the\n\n\
    remainder is being lost. Since this is likely to be correct some compilers will\
    \ not\n\nprovide a warning of a possible error.\n\nStatements could be written\
    \ to calculate the result of a division including the\n\nremainder:\n\nint number;\n\
    \nint remainder;\n\nnumber = 5 / 2;\n\n// 2 goes into 5 twice\n\nremainder = 5\
    \ - (number \\* 2); // remainder is 1\n\nAn easier way to get the remainder of\
    \ a division calculation would be to use\n\nthe modulus operator (%). This works\
    \ as follows:\n\n*a % b gives the remainder for a / b.*\n\nSo in the above example\
    \ :\n\nremainder = 5 % 2;\n\nBe careful when combining integer and floating-point\
    \ values in your programs.\n\nIf your programs are processing a lot of integer\
    \ and floating-point values \n\nand are giving you incorrect results, always check\
    \ for problems with integer\n\ndivision.\n\nIf you are dividing two integer values\
    \ and you want the result to be a \n\nfloating-point value you can force the result\
    \ to be a float by using a cast to \n\nconvert one of the integer values to a\
    \ floating-point value, like this:\n\nint aNumber = 12;\n\nint anotherNumber =\
    \ 5;\n\ndouble result;\n\nresult = (double) aNumber / anotherNumber;\n\nThis would\
    \ assign float the expected floating-point result, in this case 2.4. If you\n\n\
    find yourself having to do a lot of this it’s probably time to consider whether\n\
    \nthe integer values shouldn’t really be floating-point values.\n\nAn alternative,\
    \ less elegant way to convert an integer value to a floating-\n\npoint value is\
    \ to multiply the integer by 1.0:\n\nresult = (aNumber \\* 1.0) / anotherNumber;\n\
    \nThis technique can be useful at times, but a cast is probably usually to be\
    \ \n\npreferred."
