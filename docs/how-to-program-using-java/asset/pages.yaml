  md: "On the Unix system used to write the programs in this book the compiler is\n\
    \nsimply run from a command prompt and is called *javac*, so to compile a\n\n\
    program stored in the file *MyProg.java* a programmer would type:⁴\n\n*tetley%\
    \ javac MyProg.java*\n\nIf all is well this compilation would usually⁵^ produce\
    \ another file called\n\n*MyProg.class*. This is a version of the program that\
    \ can actually be executed;\n\nit is effectively the executable version of the\
    \ program. It contains a compiled\n\nform of the .*java* file, known as *bytecode*,\
    \ which can be run using a Java\n\ninterpreter on any platform. Often the terms\
    \ .*class file* and bytecode are used\n\ninterchangeably.\n\nOnce again you’ll\
    \ need to consult your *Local Guide* to find out how to compile\n\nprograms on\
    \ the system you’ll be using.\n\n**Compilation errors**\n\nSometimes a program\
    \ fails to compile because of some error that the programmer\n\nhas made. The\
    \ error means that the compiler cannot process the source code to\n\nproduce an\
    \ executable file. Faced with this situation the compiler will do its\n\nbest\
    \ to tell the programmer what the error probably is (or at least where in the\n\
    \nprogram the error seems to be) and the programmer must then find and correct\n\
    \nthe mistake.\n\nThe way in which you will find and correct errors in your programs\
    \ depends\n\nagain on the system you are using. My Unix system simply tells me\
    \ what \n\nthe error is and which line in my program the error is on and leaves\
    \ me to use\n\nthe text editor to correct the error. More sophisticated systems\
    \ will present the\n\nprogrammer with the part of the source code producing the\
    \ error with the\n\noffending section highlighted in some way. Again you should\
    \ check your *Local*\n\n*Guide*.\n\nNew programmers often have terrible problems\
    \ finding errors in programs.\n\nThe secret in finding them is to remember two\
    \ things. First you should always\n\nbe systematic; correct one error and then\
    \ try to compile the program again. \n\nA small mistake in the program, even one\
    \ single character in the wrong place,\n\ncan cause a whole host of different,\
    \ seemingly unconnected, errors. It is always\n\na good plan to make the error\
    \ that you correct first the one that the compiler\n\nreported first; a small\
    \ error at the top of a program can have many knock-on\n\neffects later on. Second,\
    \ remember that compilers are not especially clever and\n\nget confused easily;\
    \ what they are reporting is often the first part of the pro-\n\ngram that they\
    \ have failed to understand. If the line where the error is reported\n\nlooks\
    \ fine, always look at the lines immediately *above* the point in the program\n\
    \nwhere the compiler says the error is.\n\n**Running the program**\n\nAfter the\
    \ program has been compiled into an executable form it is ready to be\n\nrun.\
    \ As usual the precise way in which programs are run is different on\n\n24\n\n\
    *How to program using Java*\n\n4\n\nThe *tetley%* in this is the prompt on my\
    \ computer, and isn’t part of what I type to compile\n\na program. My computer\
    \ is named after the famous Joshua.\n\n5\n\nAssuming that *MyProg.java* contained\
    \ a public class called *MyProg*, that is. Don’t worry\n\nabout this for now,\
    \ as all will become clear later on."
