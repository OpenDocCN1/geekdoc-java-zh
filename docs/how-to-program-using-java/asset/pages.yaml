    *How to program using Java*


    A simple conditional statement is needed to check whether or not the duck is


    at the particular point. The implementation is:


    public boolean atPosition (int xPos, int yPos)


    {


    if (x == xPos && y == yPos) {


    return true;


    }


    else {


    return false;


    }


    }


    This structure in a method is very common. It states that if a certain condition


    is true the method returns true and otherwise it returns false. It is worth


    remembering that such a method can also be implemented by simply returning


    the condition; this example could equally well be written as:


    public boolean atPosition (int xPos, int yPos)


    {


    return x == xPos && y == yPos;


    }


    This second form is obviously much shorter but some might find it too terse


    and the longer form clearer. The choice between the two is a question of style


    and preference.


    To illustrate this point about style one last time, this function could also be


    written:¹


    public boolean atPosition (int xPos, int yPos)


    {


    if (x == xPos && y == yPos) {


    return true;


    }


    return false;


    }


    This version works because the second return will never be reached if the


    expression is true.


    While all these three versions are equivalent, it would be good practice to


    choose the one that you prefer and make sure that you always use the same one;


    good style is consistent.


