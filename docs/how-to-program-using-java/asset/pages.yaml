  md: 'As well as attributes, object types also have *methods*. A method is a procedure


    that processes the values of the attributes of an instance of the object type
    to


    produce some effect. A method may or may not change the values of the


    object’s attributes. Some methods will generate and return a value; others,


    called void methods, will not.


    A key principle of object-oriented programming is *code re-use*. When an object


    type has been written for one problem area it can be re-used in another, ideally


    with no changes. This has the potential to save a great deal of time and money.


    You should now understand what an object is. It’s time to move on to look in


    a little more detail at how the objects in a problem area can be identified.


    *Objects. The building block*


    51


