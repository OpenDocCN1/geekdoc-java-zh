  md: "There are no real examples in this chapter (I did say that some chapters wouldn’t\n\
    \nhave any!), but here’s an illustration of something that you should remember\n\
    \nwhile you learn to program:\n\n*Many programming languages are basically the\
    \ same.*\n\nThis is simple to illustrate.⁴^ A first example is something called\
    \ a *loop*, and in\n\nparticular a “for” loop. Look at these for loops written\
    \ in a few programming\n\nlanguages:\n\nPascal\n\nfor i := 1 to 10 do\n\nBASIC\n\
    \nfor i = 1 to 10\n\nC\n\nfor (i = 0; i < 10; i ++)\n\nC++\n\nfor (i = 0; i <\
    \ 10; i ++)\n\nJava\n\nfor (i = 0; i < 10; i ++)\n\nTake it from me that each\
    \ of these five has pretty much exactly the same effect\n\nin a program. They\
    \ are examples of the same type of command in five lan-\n\nguages designed for\
    \ quite different purposes. Even if you don’t yet understand\n\nwhat a *for* loop\
    \ achieves, you should be able to see the similarities (yes, the C,\n\nC, and\
    \ the Java are all exactly the same).\n\nComputer programming languages evolve.\
    \ When someone designs a new\n\nlanguage, they include all the basic features\
    \ that are found in other languages,\n\nand it makes sense to use a way of expressing\
    \ them that is similar to these \n\nother languages; for one thing it makes the\
    \ new language easier to learn and\n\ntherefore more likely to be adopted.\n\n\
    Here’s another example. This is a conditional statement (a statement that lets\n\
    \na program make a choice), in this case testing whether some value (called *x*)\n\
    \nis less than 10:\n\nPascal\n\nif x < 10 then\n\nPython\n\nif x < 10:\n\nC\n\n\
    if (x < 10)\n\nC++\n\nif (x < 10)\n\nJava\n\nif (x < 10)\n\n*Programming*\n\n\
    17\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_34_0.png)\n\n4\n\nIt is also a\
    \ fine example of some of the things that I’ll tell you that are not *strictly*\
    \ true. It is\n\ntrue that the vast majority of the languages that you are likely\
    \ to meet for the time being\n\nare all the same. These are called *procedural*\
    \ languages. You might in the future meet\n\n*functional* languages such as ML\
    \ or Lisp which do work in a rather different way."
