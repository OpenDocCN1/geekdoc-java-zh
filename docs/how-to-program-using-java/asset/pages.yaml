  md: "96\n\n*How to program using Java*\n\nNot surprisingly there is similar shorthand\
    \ for taking one from (called \n\n*decrementing*) a variable’s value:\n\nnumber\
    \ --; // same as number = number - 1\n\nSometimes a variable must be incremented\
    \ by more than one, and so \n\nanother shorthand is available than allows the\
    \ programmer to add a value\n\nother than one to a variable:\n\nnumber += 2; //\
    \ adds two to number\n\nEquivalents exist to subtract a value, multiply by a value,\
    \ or divide by a value:\n\nnumber -= 3; // takes 3 off number\n\nnumber \\*= 3;\
    \ // multiplies number by 3\n\nnumber /= 3; // divides number by 3\n\nRemember\
    \ that the only purpose of these shorthand forms is to save typing.\n\nYou can\
    \ always write out the statement in full if you prefer, and many new \n\nprogrammers\
    \ prefer to do so.\n\n**Casting and division**\n\n3 divided by 2 is sometimes\
    \ 1. Really.\n\nJava provides several data types for storing numeric values. The\
    \ two described\n\nso far are int (integers, whole numbers) and double (double-precision\
    \ floating-\n\npoint numbers). These two types of value are clearly both numbers\
    \ and thus are\n\nthe same sort of thing; it’s often useful to be able to assign\
    \ values of one type to\n\nthe other. For example, you may think of using the\
    \ following:\n\nint number;\n\ndouble cost;\n\ncost = 12.0; // .0 indicates a\
    \ floating-point value\n\nnumber = cost;\n\nto assign the value of *cost* to the\
    \ value of *number*.⁴^ This piece of program \n\ngenerates a compiler error, though.\
    \ The error will probably differ depending on\n\nwhich platform you try to compile\
    \ the code on, but will be along the lines \n\nof “possible loss of precision”.\
    \ This is because the fourth line above would\n\ncause the decimal part of the\
    \ double-precision number to be lost during the\n\nassignment to an integer value.\
    \ Thankfully, help is at hand.\n\nThere is a way around the loss of precision\
    \ problem, known as *casting* from\n\none type to another. In other words, it\
    \ is possible to force the compiler to \n\nconvert a variable of one type into\
    \ a different type. As an example, we can cast\n\nfrom double to int to achieve\
    \ the effect we wanted above:\n\nnumber = (int) cost;\n\nSo the type we want to\
    \ convert to is placed in brackets before the variable we\n\nwish to store its\
    \ value. In this example, *number* now has the value 12, and in\n\neffect there\
    \ is no loss of a decimal part.\n\n4\n\nNote that the .0 on the value of cost\
    \ isn’t really necessary. It’s included it here to clearly\n\nshow that this is\
    \ a floating-point value. Pedantically, it’s a double-precision floating-point\n\
    \nvalue."
