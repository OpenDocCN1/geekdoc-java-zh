  md: '*The basics*


    111


    Constants are a special kind of variable that don’t vary. You should be able to


    identify situations where it is sensible to use a constant in a program.


    You should be able to write simple expressions using the basic arithmetic


    operators and you should understand the precedence of these operators.


    You should also be able to produce simple output (probably on the screen)


    using System.out.println.


    This chapter also included the traditional first program (displaying “hello,


    world”) written in two rather different ways. One used objects, and one did not.


    Take a look at both programs and make sure you understand how they achieve


    what they do. They both in fact do exactly the same thing, so think about which


    is better. Think especially about which would be better if the program had to
    be


    extended.


    The one thing that you can’t do now is ask the users of your program to enter


    values for your program to process. Once we know how to do that we can start


    writing some really useful programs so let’s move on to the next chapter!


