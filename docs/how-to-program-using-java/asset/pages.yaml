  md: "We’ll also content ourselves with just three methods. There will be methods\n\
    \nto display the duck’s details in some neat format, and to change the duck’s\
    \ age\n\nand value. Again, the details of these are defined in the last chapter.\n\
    \nIf we were to be implementing one of Mr Martinmere’s programs we would\n\nobviously\
    \ need to be able to process an instance of this object type. One instance\n\n\
    would presumably represent one “real world” duck. Of course, the point of\n\n\
    object-oriented programming is that the implementation of this object type could\n\
    \nbe used unchanged in any program that Mr Martinmere might want now or \n\nin\
    \ the future. For that matter the object type could be of use to anyone who \n\
    \nwanted to write a Java program that processed basic details of ducks. We must\n\
    \ntherefore implement¹^ the object type before we start on any of the programs.\
    \ First\n\nwe will need some basic Java; about the most basic are *declarations*\
    \ and* statements*.\n\n**Declarations and statements**\n\nWe know that the first\
    \ step in writing a Java program is to define the object\n\ntypes that will be\
    \ used. An object type is called a *class* in Java (and in most other\n\nobject-oriented\
    \ programming languages as it happens), so that’s the name used\n\nin this chapter.\
    \ A class is defined, not surprisingly, using Java declarations and\n\nstatements.\n\
    \nA declaration simply “declares” that something exists in the problem area. \n\
    \nIt probably specifies what this thing is called, what sort of thing it is, and\
    \ also\n\nprovides some other information determined by what is being described.\
    \ So, in\n\nJava, this declares that an integer (abbreviated to int) exists:\n\
    \nint age;\n\nA string and floating-point value look similar but use less obvious\
    \ (or more \n\nsubtle) names:\n\nString name;\n\ndouble value;\n\nString refers\
    \ to the required string, and has to start with a capital letter.²\n\ndouble refers\
    \ to a floating-point number, with “double” referring to the preci-\n\nsion that\
    \ will be stored. This is basically the amount of computer memory that\n\nwill\
    \ be used to store the value; you can think of it as the amount of memory\n\n\
    available to store the decimal places for a floating-point number. Your *Local*\n\
    \n*Guide* might tell you how much is used on your system.\n\nThese declarations\
    \ do not really do anything, or at least they do nothing that\n\na user of the\
    \ program might see. Behind the scenes some memory is allocated\n\nto store the\
    \ value, and various things will be done to associate a name with \n\nthe memory,\
    \ but nothing happens as far as someone using the program is \n\nconcerned.\n\n\
    A statement is a line of Java that achieves something useful. It might set a\n\
    \nvalue or display something on the screen for example. This would set a value\n\
    \nby assigning the value 10 to the attribute *age*:\n\nage = 10;\n\n*A first look*\n\
    \n65\n\n1\n\nAnd, as we will see, also test.\n\n2\n\nAnd that is the first thing\
    \ that I’m going to gloss over! If you must know, it’s because\n\nString is a\
    \ class itself in Java, but the other two types aren’t."
