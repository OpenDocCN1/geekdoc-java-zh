  md: "Above all you need a willingness to learn and you need determination. You\n\
    \nneed to be sure that you want to do this, and you need to be determined to see\n\
    \nit through.\n\nIf you’ve got all these things then read on!\n\n**The Console\
    \ class**\n\nSome things in Java are complicated. Unfortunately one of these is\
    \ getting a\n\nuser to enter values, something that is obviously rather fundamental\
    \ to most\n\nprograms. The program statements needed to do this can throw up all\
    \ sorts of\n\nerrors that need to be dealt with, and this can get in the way of\
    \ new program-\n\nmers as they learn. The code to do input in Java is, to be frank,\
    \ horrible.\n\nTo lend a helping hand, we’ve¹^ developed a class that reads a\
    \ variety of val-\n\nues from the keyboard. You can find the listing of the *Console*\
    \ class in the back\n\nof the book or on the web site. The web site is obviously\
    \ a better bet as it will\n\nsave you typing and hopefully prevent errors.\n\n\
    Before you can use any of the programs after about Chapter 8 you’ll need to\n\n\
    get hold of this class and compile it. The programs will assume one of two\n\n\
    things. One option is that you have created a *directory* (or* folder*) called\
    \ *htpuj*\n\nbelow the directory containing your program, and that this directory\
    \ contains\n\nthe compiled version of the *Console* class produced in a way similar\
    \ to:\n\n*tetley% javac Console.java*\n\nThe second (slightly more complicated)\
    \ option is that a *jar archive* containing\n\nthe* htpuj* package is listed in\
    \ your *classpath*. A jar archive containing the\n\n*htpuj* package is available\
    \ from the website accompanying this book; its \n\ninclusion into your classpath\
    \ should be explained in your *Local Guide*.\n\nYou don’t need to worry too much\
    \ about this now, just be prepared for when\n\nwe start using it later on!\n\n\
    **Getting help**\n\nIf learning to program is difficult then learning to learn\
    \ to program is equally\n\ntricky! The most important thing is that you need to\
    \ know when you should get\n\nhelp from one of your experts; get help too soon\
    \ and you’ll end up not learning\n\nanything, but leave it too late and you run\
    \ the risk of not finishing your\n\nprogram in time. Knowing when you should get\
    \ the help you need is a tricky\n\nbusiness.\n\nAt some point in the not too distant\
    \ future you’ll be sitting in front of a com-\n\nputer trying to write a program\
    \ and you’ll find that you’re “stuck”. It happens\n\nto all of us.²^ You might\
    \ have some sort of bizarre error message that you just\n\ncan’t work out, your\
    \ program might be insisting on producing the wrong\n\nresults, or you might not\
    \ have the slightest idea how to complete the next part\n\nof whatever task you’ve\
    \ been set. Whatever the problem is, you need to do\n\nsomething about it.\n\n\
    34\n\n*How to program using Java*\n\n1\n\nThe “we” is definitely a “Graham”.\n\
    \n2\n\nIt happens to me. When it happens I wander down the room to my friend Nick’s\
    \ office and\n\nget him to look at my program. It’s amazing how quickly he can\
    \ spot what I was doing\n\nwrong."
