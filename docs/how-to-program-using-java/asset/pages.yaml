  md: "Conditional statements allow programs to react and behave differently in\n\n\
    response to values provided by users. The key idea behind a conditional state-\n\
    \nment is a condition, an assertion that can either be true or false. A condition\
    \ is\n\nalways true or false, although which it is can change as a program is\
    \ run.\n\nThe values true and false are Boolean and can be stored in variables\
    \ with\n\nthe type boolean*.* Boolean values and conditions can be combined using\
    \ the\n\nbasic Boolean operators, “and”, “or”, and “not”. Any number of conditions\
    \ can\n\nbe combined using these operators.\n\nConditions often include comparison\
    \ operators. The simplest operator is\n\n“equals”, represented in Java as  for\
    \ basic data types. Strings use the\n\nequals method for the same comparison.\
    \ There is a range of other operators\n\nfor comparing with values that are less\
    \ than or greater than some known value.\n\nWhen an unexpected value is detected\
    \ in its input a program can be made to\n\nexit immediately using the System.exit\
    \ command. If a program does end in\n\nthis way it is always good practice to\
    \ display an informative message to tell the\n\nuser what has happened. A numeric\
    \ value can also be passed to the computer\n\nvia the System.exit command.\n\n\
    Of course it would be better if the program told the user of the error and gave\n\
    \nthem the chance to provide another value. A user is likely to get very frustrated\n\
    \nat having to continually re-run a program. To allow this sort of control, \n\
    \nstatements must be executed over and over again; this leads neatly on to the\n\
    \ntopic of program loops.\n\n*Making things happen. Sometimes*\n\n201\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_218_0.png)"
