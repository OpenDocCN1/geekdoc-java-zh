  md: "*Input*\n\n113\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_130_0.png)\n\nUp\
    \ to now, we have looked at some simple programs that take values which\n\nhave\
    \ been set in the source code, manipulated these values and printed the\n\nresults\
    \ of these manipulations. You have to agree that while what we have\n\nlearned\
    \ so far is important, it is rather limited. In order to write any particularly\n\
    \nuseful programs, the programmer would need to know all the values the pro-\n\
    \ngram needs in advance. This is hardly ever the case, and it is far better from\
    \ the\n\nuser’s point of view if the program can receive values at the time it\
    \ is run, rather\n\nthan the time it is compiled.\n\nNever fear! This chapter\
    \ will teach you the basics of how the user can provide\n\ndata to your programs\
    \ to make them more flexible. This data can be provided\n\nin two ways – either\
    \ passively, at the time the program is first executed \n\n(via what are known\
    \ as *command line arguments* or* CLA*s for short) or interac-\n\ntively while\
    \ the program is already running. You will learn some important \n\ndifferences\
    \ between these two methods, and how to choose between them for \n\na given task.\n\
    \nBy the end of this chapter, you should be able to differentiate between the\
    \ two\n\nsorts of input (command line argument and interactive), understand how\
    \ both\n\nforms of input can be used in your programs, and determine which form\
    \ to use\n\nfor which purpose.\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_130_1.png)\n\
    \nVirtually every program you will ever run from a command line, via a terminal\n\
    \non a Unix system, or via a DOS or Command Prompt on a Windows system,\n\ncan\
    \ be made to perform its task slightly differently depending on how it is\n\n\
    invoked. Nowadays the command line is often hidden from us behind a “point-\n\n\
    and-click” interface, so here’s a reminder of what it’s all about.\n\nUsers give\
    \ instructions to computers as commands, words that have special\n\nmeanings.\
    \ These commands are interpreted by the operating system, which\n\ncauses the\
    \ computer to do something useful by executing a program. Usually,"
