  md: "90\n\n*How to program using Java*\n\nreading  used in this way as “becomes\
    \ equal to” or “is assigned” rather than\n\njust “equals”.¹\n\nThese statements\
    \ illustrate the two fundamental new ideas in this chapter.\n\nVariable declarations\
    \ and assignment statements are two of the most funda-\n\nmental ideas in programming.\
    \ Programmers need to declare the variables \n\nthat their programs will use and\
    \ they need to be able to assign them values. The\n\nfollowing sections cover\
    \ these ideas in more detail.\n\n**Variables and types**\n\nA variable is a value\
    \ used in a program. It is created in a *declaration* at the top of\n\nthe program\
    \ where it may also, if required, be given an initial value. The value\n\nthen\
    \ changes as the program progresses, as the statements in the program\n\nmanipulate\
    \ the value. A variable’s final value is sometimes one of the outputs\n\nof the\
    \ program. A variable has an *identifier* and a *type* of value that it can store.\n\
    \nThe variable’s declaration tells the compiler what these two things are. For\n\
    \nexample:\n\nint aNumber;\n\ndeclares a variable with the identifier *aNumber*\
    \ that can store integer values \n\n(in Java, int). It is good practice to provide\
    \ an initial value for a variable at the\n\nsame time as it is declared.²^ This\
    \ assignment is simply added to the declaration.\n\nSo, for example, to assign\
    \ *aNumber* an initial value of 0 the declaration is\n\nextended to:\n\nint aNumber\
    \ = 0;\n\nDeclaring the type of a variable allows the compiler to allocate an\
    \ appropri-\n\nate amount of the computer’s memory to store the variable’s values,\
    \ and allows\n\nthe compiler to check that sensible operations are being carried\
    \ out on values in\n\nthe program. Java has many data types, but for the moment\
    \ just a few of these\n\nwill be quite enough:\n\nint\n\nan integer value or whole\
    \ number – 0, 1, 2, 1 and so on.\n\ndouble\n\na (double-precision) floating-point\
    \ (decimal) number – 1.415, 1.25.\n\nchar\n\na single character – ‘a’, ‘Z’, ‘$’.\n\
    \nString\n\na sequence of characters – “hello”, “Walrus”, “Gumboot”, “%$%!%%”.\n\
    \nboolean\n\na Boolean value – either true or false.\n\nThere is an important\
    \ distinction between the ways in which characters and\n\nstrings are represented.\
    \ Characters are enclosed by single quotation marks but\n\nstrings are enclosed\
    \ with double quotation marks. This means that:\n\n'a'\n\nis the single character\
    \ *a*, with the type char, whereas:\n\n\"a\"\n\nis a string containing just one\
    \ character with the type String. This distinction\n\nis subtle, but will become\
    \ important. Take special note of the capital S on\n\n1\n\nWe will in fact see\
    \ a different Java symbol that is read as “equals” later on.\n\n2\n\nThis is sometimes\
    \ not necessary but it is a good habit to get into. If in doubt you should\n\n\
    always assign the variable an initial value."
