  md: "*More methods*\n\n223\n\napplications where, for example, a model of a car\
    \ is made before the car itself. \n\nA method’s prototype shows a potential user\
    \ how to call the method, and usu-\n\nally gives a good indication as to its behaviour.\
    \ Armed with the information\n\ngleaned from the prototype a programmer can write\
    \ a program that will make\n\nuse of the method without having any knowledge at\
    \ all of how the method\n\nachieves its result. Also, a compiler can compile the\
    \ part of the program that\n\nuses the method with no knowledge of how the method\
    \ works; the code that\n\nimplements the method itself can be linked in later.\n\
    \nMany methods determine and return exactly one value of the type given as\n\n\
    the first part of the prototype as the return type; if a method does not return\
    \ a\n\nuseful value at all it is defined to return void and is called a void method.\n\
    \nMethods sometimes require values to process in order to produce their result;\n\
    \nthese are the method’s parameters, the types and identifiers of which are listed\n\
    \nin brackets after the name of the method. These brackets are always included\
    \ to\n\nmake it clear that we are talking about a method, but left empty if there\
    \ are no\n\nparameters.\n\nFor example:\n\npublic double distanceFrom (int x,\
    \ int y)\n\ndefines a public method called *distanceFrom* that returns a single\
    \ floating-\n\npoint value and requires two integer parameters. Let’s look in\
    \ a little more\n\ndetail at precisely how these parameters are passed into the\
    \ method.\n\n**Call-by-value and call-by-reference**\n\nMany of the methods we\
    \ have seen so far have processed one or more param-\n\neters. Specifically they\
    \ have processed the values of one or more parameters.\n\nThe* distanceFrom* method,\
    \ for example, could be called like this:\n\nDuck elvis = new Duck ();\n\ndouble\
    \ distance;\n\ndistance = elvis.distanceFrom (5, 3);\n\nwhere the parameters are\
    \ the two literal values 5 and 3. It could also be called\n\nlike this:\n\nDuck\
    \ elvis = new Duck ();\n\nint x = 5;\n\nint y = 3;\n\ndouble distance;\n\ndistance\
    \ = elvis.distanceFrom (x, y);\n\nThis would have much the same effect. The point\
    \ here is that it is the values of\n\nthe variables *x* and* y* that are used\
    \ by the method. Using *x* and* y* in this way is\n\nexactly the same as passing\
    \ the literal values 5 and 3.\n\nWe would probably be very surprised if calling\
    \ this method changed either\n\nvalue, and we would certainly expect the values\
    \ of x and y to be unchanged\n\nimmediately after the call to the method. But\
    \ sometimes an effect like this is\n\nwhat is required and when this is required\
    \ a subtly different kind of parameter\n\nis needed.\n\nThis section sounds daunting,\
    \ and to be fair it can be quite a tricky con-\n\ncept to understand at first,\
    \ but it can help you in writing elegant programs.\n\nThere are two ways to pass\
    \ values to methods; these are call-by-value and"
