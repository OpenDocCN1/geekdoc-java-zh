    \n}\n\nfor loops are used when the number of times that a loop will be executed\n\
    \ncan be determined for certain before the loop is executed for the first time.\
    \ If this\n\nnumber cannot be determined then the alternative, an *indeterminate\
    \ loop*, must\n\nbe used instead.\n\n**while**** loops**\n\nA while loop is indeterminate;\
