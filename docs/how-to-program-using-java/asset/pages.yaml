  md: "The easiest way to separate the data for different ducks would be to have \n\
    \na blank line between the last value of the first duck and the first value of\
    \ the \n\nsecond duck, and a marker after the last duck (say “EOF” for end of\
    \ file). This\n\nway the code for reading the data can be written inside a loop,\
    \ and the loop\n\ncondition can be:\n\n*if the next line contains nothing but\
    \ the String *\"*EOF*\"*,*\n\n*finish*,\n\n*else continue*\n\nThe logic for the\
    \ *writeToFile* method is as follows:\n\n*OPEN FILE FOR WRITING*\n\n*FOR EACH\
