  md: "82\n\n*How to program using Java*\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_99_0.png)\n\
    \nThe fifth and final golden rule is:\n\n*Always pay attention to layout and indentation\
    \ as you develop your program, and*\n\n*never treat either as an afterthought.*\n\
    \n**Don’t panic!**\n\nYou will realise by now that programming is a complicated\
    \ business. As well as\n\nproducing a program that correctly carries out some\
    \ useful task, a programmer\n\nmust always produce a program that is neatly and\
    \ consistently laid out. \n\nA program is only ever of any use if it can later\
    \ be changed and adapted by\n\nother programmers.\n\nEffective programming is\
    \ all about applying a set of rules to a problem. When\n\nyou become confident\
    \ and proficient you will probably find that programming\n\nis an extremely rewarding\
    \ task. A fully working program is a fine creation \n\nand something to be proud\
    \ of. Programming itself is an extremely creative and\n\nenjoyable process. With\
    \ neat layout and good style a program is very nearly \n\na thing of beauty.\n\
    \nAs you learn to program, remember that it is a structured process. It is a\n\
    \nprocess that can only be carried out by someone who is calm and collected. \n\
    \nAs you learn, above all “Don’t Panic!”.\n\n**Example 1 – Cilla’s poor style**\n\
    \n*As a new Java programmer Cilla is very concerned that her programs work. Bruce\
    \ has*\n\n*set her a lot of exercises and Cilla has to work hard to complete them\
    \ before the deadline.*\n\n*She decides to ignore the indentation of her program\
    \ and intends to correct it all when*\n\n*the program works. Unfortunately it\
    \ takes a long time to make the program work and*\n\n*Cilla doesn’t have time\
    \ to correct the indentation. She is somewhat dismayed when*\n\n*Bruce refuses\
    \ to mark her program.*\n\n*Why does Bruce behave like this? Is this reasonable?*\n\
    \nThis is very reasonable. Indentation is a crucial part of programming style\
    \ and\n\nit is important that new programmers quickly get into the habit of producing\n\
    \ncorrectly indented and well laid out programs. Cilla must remember that her\n\
    \nprograms may well be used and corrected by other programmers in the future"
