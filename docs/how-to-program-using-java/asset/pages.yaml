  md: "Learning to program is a complicated business.\n\nBefore you start reading\
    \ the chapters in this book that describe the features of\n\nJava, and certainly\
    \ before you start to do any actual programming, you’re going\n\nto need to get\
    \ hold of various things that will come in useful.\n\nAfter reading this chapter,\
    \ you should be sure that you have these things. You\n\nshould have spent a little\
    \ bit of time experimenting with them, and you should\n\nhave started to learn\
    \ the skills that you’ll come to need as you learn to program\n\nusing Java.\n\
    \n30\n\n*How to program using Java*\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_47_0.png)![](img/05fa4bae6319441a0b86c0179baaedc2_47_1.png)\n\
    \nBefore you start any Java I want to explain to you what learning to program\
    \ is\n\nall about. You need to know what it is that you’ve taken on and you need\
    \ to\n\nunderstand something about the skills that you’re going to have to call\
    \ on as\n\nyou learn to program.\n\nI’m going to start with a quote that could\
    \ well sum up what you’ve taken on.\n\n*You have chosen a dangerous and challenging\
    \ path, Adventurer.*\n\nA long time ago I used to play a computer game. It was\
    \ an adventure, and \n\nit just used plain text. These were the days when computer\
    \ games involved\n\nnothing more sophisticated than typing instructions to the\
    \ character you were\n\nsupposed to be playing. There were no graphics in those\
    \ days, and certainly no\n\nLara Croft. The computer didn’t even have a mouse\
    \ and we got very excited if\n\na program used some sort of colour beyond different\
    \ shades of grey. This game\n\ninvolved all the usual things that you’d find in\
    \ games like this. You’d move\n\naround mazes of corridors, battle hideous demons,\
    \ give small pots of gold to\n\npassing dwarves, and fall down the occasional\
    \ bottomless pit. You get the idea.\n\nMuch the same happens in many games today\
    \ only with better graphics."
