  md: "To keep things simple, we’ll just use simple words for the rest of this chapter;\n\
    \nthe details of how Java refers to these things can come later.\n\nLet’s look\
    \ again at the attributes of a person and add in the type of value \n\nfor each.\
    \ A good name for this object type would be, unsurprisingly, *Person*.\n\nThe\
    \ precise list of attributes for a *Person* object type would probably depend\n\
    \non the purpose of the program that was going to use it, but some common ones\n\
    \nwould be:\n\n*Objects. The building block*\n\n43\n\n**Person**\n\n**Attribute**\n\
    \n**Type**\n\nName\n\nString\n\nGender\n\nCharacter (either 'M' or 'F')\n\nAge\n\
    \nInteger\n\nDate of Birth\n\nString\n\nHeight\n\nFloating-point (in metres)\n\
    \nWeight\n\nFloating-point (in kilograms)\n\nAddress\n\nString\n\nThis is far\
    \ from a complete list; you can probably think of some more attributes\n\nto add.\
    \ Whatever attributes are added each can have only one value of one\n\nfixed type.\
    \ Sometimes, as in *Gender* here, the value can be only one of a few\n\nfrom the\
    \ type. In most cases it can be any value.\n\nLook again at the type of the “Date\
    \ of Birth” attribute in the *Person* object.\n\nAt the moment this proposes that\
    \ the date is stored as a string of characters. \n\nIt is indeed possible to use\
    \ a string like this to store a date, and there are \n\nmany possible formats\
    \ that might be used. The format that would be preferred\n\nwould depend on factors\
    \ such as how and where the date was to be displayed\n\nor the conventions of\
    \ the country where the program would be used. Examples\n\nmight be:\n\n*2nd January\
    \ 2004*\n\n*2-1-04*\n\n*2/1/2004*\n\n*1/2/2004*\n\nwhich could all correspond\
    \ to the same actual date.\n\nThe scheme of storing a date as a string would work\
    \ if the only operation\n\never required on a date were to print it out and if\
    \ all the people who would see\n\nthis would have the same understanding of the\
    \ format. Complications would\n\nquickly arise if the date were to be processed\
    \ in some way or needed to be \n\nprinted out in a different format. Even simple\
    \ tasks such as finding the next\n\ndate or a person’s twenty-first birthday would\
    \ be extremely difficult if the date\n\nwere available only as a string.\n\nFor\
    \ anything but the simplest problems the string representation for dates\n\nwould\
    \ be far too inflexible. Something much more powerful is needed. The\n\nsolution\
    \ to this problem is quite simple; the “Date of Birth” attribute of *Person*\n\
    \nis in fact another object, one that can represent dates. An object’s attributes\
    \ may\n\nthemselves be objects.\n\nLet’s consider what the attributes of a *Date*\
    \ object type should be. The\n\nsimplest scheme is to have three integers as attributes;\
