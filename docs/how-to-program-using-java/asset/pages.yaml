  md: "There are other possibilities. Many computer systems handle dates by storing\n\
    \nthe number of seconds since some known fixed point in time; this is a simple\n\
    \nscheme involving only a single integer and is cheap for a computer to store.\n\
    \nThis simple internal representation is converted to a more human-friendly\n\n\
    format whenever it is displayed. The advantage of either of these schemes is\n\
    \nthat the date is stored in a simple neutral form and can then be displayed in\n\
    \nwhatever format the user chooses. The simple storage makes it easy to develop\n\
    \nprograms that manipulate dates.\n\n**Methods**\n\nDisplaying the date is an\
    \ operation (or procedure) that uses an object. This\n\noperation is obviously\
    \ closely linked to the object and in a way it is also an\n\nattribute of the\
    \ object. It is however obviously a special kind of attribute since\n\nit is a\
    \ procedure (a set of steps or instructions) rather than just a single value.\n\
    \n“Attributes” like this are called *methods*. A method can be thought of as a\n\
    \nprocedure that uses the values of the attributes of an object to produce some\n\
    \nuseful result or effect. Possible methods for a *Date* object type might be:\n\
    \n●find the next date;\n\n●find the next date and change the values of the object’s\
    \ attributes to the \n\nvalues of the next date;\n\n●find the day of the week\
    \ of the date;\n\n●determine if the date is valid;\n\n●display the date in the\
    \ format DD/MM/YYYY;\n\n●display the date in a format similar to “2nd January\
    \ 2004”.\n\nSome of these methods are also like attributes in that they generate\
    \ a particular\n\nvalue. Finding the next date presumably generates the value\
    \ of another date\n\nand determining whether or not the date is valid generates\
    \ a Boolean (true or\n\nfalse) value. This value is called the *return value*\
    \ of the method. This return value\n\nalso has a type; this is usually called\
    \ the *return type* of the method.\n\nSome methods, such as displaying the date,\
    \ do not return a value at all.\n\nUsually they just display something on the\
    \ screen or make some change to the\n\nvalues of one or more of the attributes.\
    \ These methods are called *void methods*,\n\nand void is the keyword used in\
    \ Java (and C for that matter) to denote them.\n\nA more complete specification\
    \ for the methods of a *Date* object could be as\n\nfollows. This version also\
    \ adds in some names for the methods; the meanings\n\nof these should be reasonably\
    \ obvious and they are much less cumbersome that\n\nthe descriptions. Some of\
    \ the methods in this list return a value while others are\n\nvoid methods.\n\n\
