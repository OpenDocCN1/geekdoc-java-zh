  md: "224\n\n*How to program using Java*\n\ncall-by-reference. The names refer to\
    \ the different ways the parameters are\n\ntreated within the calling method.\n\
    \nWe’ll look at call-by-value first, as this is what we have been dealing with\
    \ so\n\nfar, and is indeed what has just been described. As another example, let’s\
    \ define\n\na potentially useful method that might be found in some class used\
    \ in a simple\n\ncalculator program:\n\npublic int square (int num)\n\nThis method\
    \ would take its argument, square its value, and return the result. \n\nSo we\
    \ could create a value to square, and print the square:\n\nint number = 8;\n\n\
    System.out.println (\"The square of \" + number + \" is \"\n\n\\+ square(number)\
    \ );\n\nNow, you might think that the value stored in the variable number is now\
    \ 64\n\nsince that is the value that will be displayed. However, this is not the\
    \ case:\n\nint number = 8;\n\nSystem.out.println (\"The square of \" + number\
    \ + \" is \"\n\n\\+ square(number) );\n\nSystem.out.println (\"The value of number\
    \ is now \" + number);\n\nThe output from this code would be:\n\n*The square of\
    \ 8 is 64.*\n\n*The value of number is now 8.*\n\nThis might seem surprising,\
    \ but it can be easily explained (and if you thought\n\nthe value would still\
    \ be 8 all along, then well done!).\n\nIt works like this. Whenever a variable\
    \ of a primitive type (integers, doubles,\n\nand so on) is passed as a parameter\
    \ of a method, the value of this variable is\n\ncopied, and the method works with\
    \ this copy. So in the example above, the\n\n*square* method works with a temporary\
    \ copy of the value stored in *number*.\n\nInside the method, of course, this\
    \ value might have any identifier:\n\npublic int square (int num)\n\n{\n\nnum\
    \ \\*= 2;\n\nreturn num;\n\n}\n\nor just:\n\npublic int square (int num)\n\n{\n\
    \nreturn num \\*= 2;\n\n}\n\nWhen the method terminates, the value of *number*\
    \ in the calling method \n\nis unchanged. The value used in the method (here we\
    \ called it *num*) is lost \n\nforever. The two values have in fact always been\
    \ separate and have occupied\n\ndifferent parts of the computer’s memory.\n\n\
    Things are different when more complex values are passed to methods.\n\nWhen objects\
    \ are passed as parameters to methods, the mechanism is subtly\n\ndifferent, and\
    \ it is important that you understand how it works and its effects\n\non your\
    \ programs so that you don’t have problems later on."
