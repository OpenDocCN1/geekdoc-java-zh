    \ and never their types. If there are no parameters the brackets\n\nmust still\
    \ be present but there is nothing between them.\n\nAn example should make this\
    \ clear. Yet another simple *Duck* class designed\n\nfor some duck tracking application\
    \ similar to the one defined in the last chap-\n\nter might include this set of\
