    \nbetween a pair of curly brackets usually called *braces*, and are indented slightly\n\
    \nto show someone reading the program that they are inside the method. We now\n\
    \nhave a complete method:\n\npublic void display ()\n\n{\n\nSystem.out.println\
    \ (\"The details of the duck are:\");\n\nSystem.out.println (name);\n\nSystem.out.println\
    \ (age);\n\nSystem.out.println (value);\n\n}\n\nThe remaining two methods are\
    \ slightly more complicated. The extra com-\n\nplication is that they change the\
    \ value of an attribute. They therefore need to\n\nknow what the new value is.\
    \ For this example we’ll assume that the value they\n\nare provided with is valid,\
    \ so we’ll ignore the problem of an age being negative,\n\nfor example.\n\nValues\
    \ provided to methods are called *parameters* and are listed in the brack-\n\n\
    ets in the method’s declaration. This list includes the name of the parameter\
    \ and\n\nalso its type; the parameter can then be used inside the method, just\
    \ like the\n\nattributes.\n\nThe second method is intended to alter the value\
    \ of the duck’s attribute \n\nstoring its age. A reasonable name for it would\
    \ be *setAge*. It is going to need\n\nto know what the new age is, and therefore\
    \ it needs one parameter, an integer\n\nrepresenting the new age. It doesn’t return\
    \ a value, so the return type will once\n\nagain be void. Apart from this its\
    \ declaration is much the same as the simple\n\ndisplay method:\n\npublic void\
    \ setAge (int newAge)\n\nThe only statement needed in the method is one to set\
    \ the value of the attribute\n\n*age* to the value of the parameter (*newAge*).\
    \ We’ve seen a statement to set a\n\nvalue at the start of the chapter, so:\n\n\
    age = newAge;\n\nwill set the value of the attribute *age* to the value found\
    \ in the parameter\n\n*newAge*. Behind the scenes the value in the memory location\
    \ storing *newAge*\n\nwill be found and will be used to replace the value in the\
    \ memory location \n\nstoring* age*.\n\nAnd the complete method now becomes:\n\
    \npublic void setAge (int newAge)\n\n{\n\nage = newAge;\n\n}\n\n68\n\n*How to\
