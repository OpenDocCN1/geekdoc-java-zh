    \ like the condition of an if statement.\n\nA while loop is started with a line\
    \ of the form:\n\n*(while (<condition>)*\n\nand the program statement or statements\
    \ affected by the loop appear immedi-\n\nately below enclosed with the familiar\
    \ braces:\n\n*(while (<condition>) {*\n\n*// statements*\n\n*}*\n\nThe statements\
    \ are of course indented to make it clear that they are inside the\n\nloop. As\
