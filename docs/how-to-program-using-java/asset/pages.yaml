    *How to program using Java*


    easily and unambiguously give the programmers a list of the tests that the


    program fails.


    In this plan, tests one to three are randomly chosen typical values while tests


    four to six test the lower boundary on the number of ducks (we have assumed


    that there might reasonably be no ducks at all and that there is no upper limit).


    Notice how a lot of the testing is concentrated around the boundary values. In


    practice we would tend to expect three tests at each boundary value, so this is


    obviously where most testing will be concentrated. This is expected since it seems


    reasonable to assume that this is precisely where errors may have been made.


    **Writing and using the test plan**


    The test plan can be written directly from the specification of the program and


    so can and should be written before the program itself is written. It is normally


    easy to identify boundary and typical values from the specification and the


    expected outputs should be calculated by hand and carefully verified. The plan


    should be allowed to be dynamic to some extent; it should be changed if the


    program’s specification is changed. The plan should certainly be complete


    before starting to write the program. While some testing will take place during


    the program’s development as the programmer checks the code the final test


    should always be carried out according to the plan. The final test of a program


    should never be carried out randomly and the final test plan should never be


    written after the program is complete.


    In many commercial software development businesses there will be people


    whose specific job it is to test programs. These will rarely be the same people
    who


    write the programs. This is a good thing; it is sometimes very difficult to be
    objec-


    tive when you test your own programs. After all, you wrote it and you know how


    good it is. You know it works so what is the point in thoroughly testing it?


    It’s likely, though, that while you learn to program you will be testing your


    own programs. When you do this try to be as thorough and as ruthless as pos-


    sible. It’s worth remembering that if you don’t find an error someone else will.


    Make sure that your test plan is complete and that it covers all the possible


    cases. It’s also a good idea to ask a friend to test your program while you return


    the favour and test theirs. You can enjoy yourself finding tiny errors in your


    friend’s program while they derive similar satisfaction from testing yours.


    The final version of a program should pass all the tests in the plan.


    Sometimes, of course, the plan will show up errors that must be corrected and


    the program will have to be changed as a result. Obviously the program must


    then be tested again. In this case it is vital that the whole test plan is run
    again


    after any change; a change to correct one error may well have caused an error


    somewhere else in the program and another test case may now produce incor-


    rect results. The final version of a program should always pass every single test


    case in the plan.


    **Testing and debugging**


    As you write your programs you will be running them from time to time to


    check that they compile and work as expected. More often that not you will


    look at the outputs, spot mistakes, and then make changes to the program. You


    will find bugs and you will fix them. This is *debugging*, not testing.'
