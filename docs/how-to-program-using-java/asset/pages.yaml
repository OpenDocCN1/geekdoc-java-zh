  md: "*A first class*\n\n137\n\n●A* method* describes a behaviour of an object that\
    \ is of interest. A duck might\n\nmove to a particular point, might increase its\
    \ value or might change its name.\n\nPrograms interact with objects through methods.\n\
    \nSo the definition of a class is going to need to define the object type that\
    \ the\n\nclass models. This involves specifying the attributes (and their types)\
    \ and \n\nthe methods (and how these operate). We’ll start with attributes, but\
    \ first the\n\nsyntax of the file.\n\n**A class definition**\n\nThe definition\
    \ of a class is obviously fundamental to the development of any\n\nprogram that\
    \ uses the class. It is vital that the definition is laid out neatly so that\n\
    \na programmer using the class can see immediately how the class works and is\
    \ in\n\nno doubt about the details. The chapter on analysis showed how it was\
    \ possible\n\nto read a program specification, and deduce from it the object types\
    \ (or classes)\n\nthat such a program would use. Analysing each class in turn,\
    \ it is then possible\n\nto settle on a list of attributes and methods that each\
    \ object should define.\n\nThe first thing to do before trying to use a class\
    \ is obviously to read through\n\nthe definition. The file should start with a\
    \ suitable header block of comments\n\nthat will give you the general idea of\
    \ what the class is for (and will provide you\n\nwith the name of the original\
    \ author in case you have any complaints!). Then,\n\nassuming that it follows\
    \ the usual format, you should find definitions of the\n\nattributes and methods.\n\
    \nYou should take note of the exact name of the class, the types of any attrib-\n\
    \nutes, and all the details of the methods. Later on you’ll be able to read the\n\
    \nstatements inside the methods to see what they do, but you shouldn’t have to\n\
    \ndo this as everything should be clear from comments. If anything isn’t totally\n\
    \nclear it’s probably a good idea to seek suitable clarification before attempting\
    \ to\n\nuse the class.\n\nThe basic format of a well-written definition looks\
    \ like this:\n\n//* Header Comments*\n\n*public class **class name*\n\n*{*\n\n\
    *// Attributes defined*\n\n*// Methods defined*\n\n*}*\n\nFrom the top, the first\
    \ important element is a *header block* of comments that\n\nprovides someone reading\
    \ the file with all the information they need about the\n\nclass. This information\
    \ should include at least the name of the class, some\n\ndescription of its purpose,\
    \ the name of the author, the date the file was written,\n\nand perhaps details\
    \ of the particular Java platform that was used.\n\nWe have already seen this\
    \ in all the complete Java definitions and programs\n\nso far. An example might\
    \ be:\n\n/\\* Duck.java – A simple Duck class.\n\nAuthor\n\n: AMJ\n\nDate\n\n\
    : 31st December 2002\n\nTested on: Red Hat 7.3, JDK 1.4.0\n\n\\*/"
