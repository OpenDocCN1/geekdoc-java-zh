  md: "*Case study*\n\n265\n\nwe need to know the duck’s total number of runs, a number\
    \ that we do not \n\ncurrently have.\n\nThese three numbers are actually derived\
    \ from other attributes, and it is these\n\nvalues that we must store. To recap\
    \ how these values are calculated:\n\n●Batting average is the total number of\
    \ runs scored divided by the number of\n\ninnings.²\n\n●Bowling average is the\
    \ total number of runs conceded while bowling \n\ndivided by the number of wickets\
    \ taken.³\n\n●Run rate is the number of runs conceded divided by the number of\
    \ overs\n\nbowled.\n\nSo we need to store the values that are needed to calculate\
    \ the averages; these\n\nare all integers. There is no need to store the averages\
    \ themselves, of course.\n\nThey can simply be calculated as and when they are\
    \ needed. Finally, we need\n\nto store the duck’s name (a string). Buddy also\
    \ stores the name of the duck’s\n\nteam. While there is no immediate need for\
    \ this information, we may as well\n\nadd it in since it could come in useful\
    \ in the future. We will assume that ducks\n\ndo not change teams.\n\nWith the\
    \ attributes identified we need to move on to the methods. This is not\n\ntoo\
    \ complicated. Obviously each attribute will need a selector and a mutator⁴\n\n\
    but appropriate methods will need to be added so that the required program\n\n\
    can be implemented. Also, it is probably a good idea to add methods that will\n\
    \nbecome useful in future programs, even if they are not needed in the particular\n\
    \nprogram that is required first.\n\nWhen identifying the methods it is important\
    \ to separate them from the func-\n\ntions that will be needed in the programs.\
    \ A method is attached to a single\n\ninstance of a class while functions in programs\
    \ may well process collections of\n\ninstances. For example, we might well expect\
    \ that at some point Buddy is going\n\nto want to sort the ducks into some order.\
    \ A sorting function will obviously be\n\nneeded to do this but this is part of\
    \ the program and not part of the class; it will\n\nprocess a collection of ducks.\
    \ The only methods needed for this sorting process\n\nwill be ones to return the\
    \ required averages of an individual duck since this is\n\nused as the basis for\
    \ the sort.\n\nSince the averages are clearly of great interest it also makes\
    \ sense to imple-\n\nment a method to output them all in some neat format. So\
    \ that this can be used\n\nin any program this should not actually do the output\
    \ itself; rather it should\n\nreturn a suitable string that can be processed in\
    \ any way required.\n\n**Defining the Duck class**\n\nWith the attributes and\
    \ methods identified, starting to implement the *Duck*\n\nclass is straightforward.\
    \ The attributes will all be declared as private:\n\n// Personal Information\n\
    \nprivate String name;\n\nprivate String team;\n\n2\n\nCricket buffs will realise\
    \ that we are ignoring the complexities of “not out” innings; \n\naverages are\
    \ usually calculated using only completed innings (that is innings when the\n\n\
    player was out).\n\n3\n\nAgain, we are going to assume that all overs are completed.\n\
    \n4\n\nIt is possible that the programs won’t need all of these, but there are\
    \ sufficiently few \n\nattributes that they might as well all have a selector\
    \ and a mutator."
