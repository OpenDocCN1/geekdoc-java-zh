  md: '*A word on testing*


    131


    Do not confuse these two activities. Debugging is an important part of the


    programming process; a programmer finds errors in the program and fixes them.


    But this happens before testing. Testing is a structured activity used to verify
    that


    a program is correct. It takes place only when the program is believed to be


    correct and when all the known bugs have been found and corrected. Of course,


    testing may well uncover more bugs but it still remains a separate activity.


    **User testing**


    The first true test of any computer program comes not as it is being written but


    when it is used “in anger” by one of the intended users. This kind of testing


    takes place in a very different environment to that in which the testing strategy


    described here is used. Users are very unpredictable things⁵^ indeed!


    Most commercial software will be thoroughly tested by the software com-


    pany that wrote it. But before it is made widely available the company will


    always send it to a few selected users for *beta testing*. This testing simulates
    the


    environment in which the programs will eventually be used and can often show


    up errors that could not be found with any test plan.


    You can adopt this idea, again by cooperating with a friend. A fine way to test


    one of your programs is to ask a friend⁶^ to use it for a while. Don’t give them


    the test plan and don’t ask them to test it systematically but just ask them to


    play around with your program and see what they can find. The idea is to see


    how your program works when a real user uses it. Challenge your friend to


    find a mistake in your program; you might even offer them a prize if they find


    one! You will be amazed at what they will do with your program as they


    attempt to break it.


    **Testing is important**


    Testing a program thoroughly can be a tedious and repetitive job but it is also
    a


    vitally important one. A program that produces incorrect results is a very


    dangerous thing; many people have great faith in the figures generated by a


    computer and errors in these figures can be costly and dangerous. Whenever


    we get in a car or fly in an airliner we are placing a great deal of faith in
    the


    programmers who wrote the programs and perhaps even more faith in the


    testers who tested the programs.


    Whole books have been written about testing and this chapter has been only


    a very quick taster of the whole process. You should now be able to write a test


    plan for each program you write and you should be able to carry it out. Above


    all you should understand why thorough testing is so important!


    You should also realise that it is never possible to be completely certain that


    any program works as expected in all cases. There will always be some set of


    input values, some test case, or some other set of circumstances that might


    cause the program to fail. What is important is that the testing is as thorough
    as


    possible so that the users can have as much confidence as possible in the


    5


    It has been said that the most used expletive in the software development industry
    is


    “Users!”. It is probably true.


    6


    A good friend. Or at least a friend you trust. Friendships can be broken over
    errors in


    programs!'
