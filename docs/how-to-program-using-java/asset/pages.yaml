  md: "Happily, the method to set the duck’s value is pretty much just the same. The\n\
    \nonly difference is that the parameter is now a floating-point number and that\n\
    \nthe name of the attribute and parameter have changed.\n\npublic void setValue\
    \ (double newValue)\n\n{\n\nvalue = newValue;\n\n}\n\nWe now have all the methods\
    \ to go with the attributes. All that remains is to\n\ncombine them into a definition\
    \ of the class.\n\n**Defining the class**\n\nThe Java files that contain definitions\
    \ and programs have a fixed structure and\n\nformat. For this example we’re only\
    \ defining a class, but the structure would be\n\nmuch the same if we were writing\
    \ a program. Once again this format is fixed;\n\nthe programmer has some flexibility\
    \ with the precise details of layout, but there\n\nare strict rules that have\
    \ to be followed.\n\nA Java file can be rather long. It can also be difficult\
    \ to interpret, especially if\n\nit has to be read by a programmer who did not\
    \ originally write it. It is therefore\n\nusual (and a good idea) to start each\
    \ file with some *comments* to describe the\n\nfiles’ purpose. A comment is part\
    \ of a program that is intended only for a human\n\nreading the program; comments\
    \ are always completely ignored by the compiler.\n\nThere are two ways of writing\
    \ comments in Java. The first is to enclose the\n\ncomment between two symbols:\n\
    \n/\\*\n\nThis is a class that can be used...\n\n\\*/\n\nThe compiler will happily\
    \ ignore anything it finds in the program after the first\n\n/\\* and before the\
    \ corresponding \\*/. This style of comment is usually used for\n\nlong comments\
    \ that extend over several lines. The alternative is to use the //\n\nsymbol to\
    \ mark that anything to the right on the line is a comment. This would\n\nlook\
    \ like this:\n\nSystem.out.println (\"hello!\"); // Print a greeting\n\nThe choice\
    \ is really just down to the style of the programmer,³^ but the style in\n\nthis\
    \ book is to use the first choice for long comments that span over several lines\n\
    \nand the second for shorter comments that might relate to a single line.\n\n\
    One place where there should definitely be a long comment is at the start of\n\
    \nthe file. This comment should explain what the class or program in the file\
    \ does,\n\nand should also provide useful information such as the name of the\
    \ author. In\n\ntime it might also record any changes made to the program.\n\n\
    Before adding a comment we need a file to add it to! Java has rules about the\n\
    \nnames of files, so we don’t have very much choice about the name. The class\
    \ \n\nis called *Duck*, and if a file contains the source code for a public class,\
    \ then the\n\nfilename must be the name of the public class followed by a .*java*\
    \ extension.\n\nIn the course of this book, we will only encounter public classes,\
    \ but it is worth\n\nmentioning that in more advanced projects, you may well find\
    \ .*java* files\n\n*A first look*\n\n69\n\n3\n\nWe’ll talk more about programming\
    \ style later on."
