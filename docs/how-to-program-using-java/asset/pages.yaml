  md: "*Programming (don’t panic!)*\n\n79\n\nThe third golden rule is:\n\n*Whatever\
    \ style you use, make sure that it is clear and neat. Remember that *\n\n*someone\
    \ may later have to change your program without your advice.*\n\nAs well as being\
    \ consistent, a programming style needs to be easy to read. \n\nIn Java, remembering\
    \ that the semi-colon is what marks the end of the line, the\n\nexample statement\
    \ above could be written:\n\nnumber\n\n\\=\n\n1\n\n;\n\nor even:\n\nnumber\n\n\
    \\=\n\n1\n\n;\n\nHopefully it is obvious why these two are not good examples of\
    \ style! Once\n\nagain you are free to follow the style of the examples in the\
    \ book, or you are\n\nwelcome to develop and adopt the style to something that\
    \ you prefer.\n\nSometimes software companies will require their programmers to\
    \ write pro-\n\ngrams using a particular style, often called a “house style”²^\
    \ and enshrined in a\n\nhefty document labelled “Coding Standards”. The reasons\
    \ for this are sound; \n\nit ensures that all programs written in the company\
    \ are consistent in style and\n\nso increases the chances that programs will be\
    \ quickly understood by other \n\nprogrammers. Many programmers do not like working\
    \ to such restrictive\n\nguidelines; programming is an essentially creative process\
    \ and such strict con-\n\ntrols reduce the chances for creativity. It is possible\
    \ that you are required to\n\nwrite your programs to conform to some house style;\
    \ if you do then you will\n\nhave to adapt the programs in this book to fit the\
    \ style.\n\nThe fourth golden rule is:\n\n*As you program, adopt and apply a consistent\
    \ style. As you learn more, develop*\n\n*this style to something that you feel\
    \ confident and happy with.*\n\n**Indentation and layout**\n\nA particularly important\
    \ aspect of a program’s style is the way that it is laid out.\n\nIn the same way\
    \ as a page of a book or magazine can be laid out well or poor-\n\nly, so can\
    \ a program. A program’s layout can add a great deal of meaning to a\n\nhuman\
    \ reader. The layout is quite irrelevant to the compiler, which will simply\n\n\
    ignore it, but it can be extremely useful to a human trying to read and \n\nunderstand\
    \ the program.\n\nLayout can emphasise which parts of the program serve a connected\
    \ \n\npurpose; for example, blank lines might be left in a program to show the\
    \ \n\nconnection between certain lines or something about the program’s structure.\
    \ \n\nA crucial aspect of layout is *indentation*, where spaces are left at the\
    \ start of lines.\n\nThe indentation of a program can show a reader a great deal\
    \ about the \n\nprogram’s structure.\n\nAs an example, here is the definition\
    \ of the simple *Duck* class from the previ-\n\nous chapter. At the moment you\
    \ probably won’t remember every detail of what\n\n2\n\nEffectively, you see, we\
    \ adopted a house style for the programs in this book."
