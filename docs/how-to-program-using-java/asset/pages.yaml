  md: 'Good Evening. Glad you could make it. Pull up a chair. Just let me put some


    more logs on the fire. Move the papers off the stool. Help yourself to a drink


    from the cabinet; there’s some orange juice at the back, and maybe something


    stronger somewhere. I’m afraid I’ve run out of toast and pretzels. Would you


    like a chocolate digestive?


    Ah, you’ve got a copy of the new book, “How to Program Using Java”. A


    wise choice if I may say so. While you have your drink and digestive just let
    me


    explain what all this is about. There are some things that you’re going to need


    to know before we start.


    This is Chapter 0 and that is your first lesson. Most books have Chapter 1 as


    the first but this one has Chapter 0. I’m afraid that computers are like that.


    You’re going to have to get out of the habit of starting to count from 1.


    Computers have a nasty habit of starting to count from 0 and if we’re going to


    write programs to make a computer do useful things for us we’re going to have


    to get into that habit too.


    Before we go any further allow me to explain what this book *is* and more


    importantly what this book is *not*.


    **What this book is not**


    This is not a book about Java. There are plenty of books about Java available


    and it would have been very foolish of Graham and me to spend our precious


    leisure time trying to add to their number. This is not a Java reference book,


    although there is a handy Java reference in the back. It is not a book to read
    if


    you are already confident about programming and can program well in some


    other language. Oh no. This book is for people who can’t program. It is for peo-


    ple who don’t have much idea of what the whole thing is about. It is perhaps


    even a book for people who are starting a course in programming and are just


    a little bit worried about it.


    **What this book is**


    This is a book about learning to program. There are not many books about


    learning to program even if some books about programming languages claim


    to be about learning to program. These claims are normally wrong. This is a


    book about learning to program, and the language we will use to write pro-


    grams as we learn is Java. This means of course that you will also learn some


    Java, but don’t confuse the two things. If you can write programs in Java you


    can quickly learn to write programs in lots of other similar languages.


    Computer programs are written in computer programming languages. Deep


    down most programming languages are basically the same. They use the same


    concepts and ideas and much the same constructions. Sometimes the way of


    achieving something is exactly the same in several languages. If you can learn


    to program in one language you can normally pick up another language with-


    out too much bother. I originally learned to program in a language called


    BASIC. Then I learned another called Pascal and then something else called C.


    Eventually I arrived at a development of C called C, and finally I came to


    Java, the language in this book. It’s learning the first language that’s the difficult


    bit; it’s much, much easier after that!


    After they’ve managed the first language a lot of people find that they enjoy


    learning new ones. Graham and I have a colleague who claims to make a point


    2


    *How to program using Java*'
