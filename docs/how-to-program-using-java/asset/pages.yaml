- img_proc: true
  md: "something of interest in a real-world problem. When a computer program is\n\
    \nwritten to solve this problem an object becomes something that is processed\
    \ or\n\nmanipulated by the program. The object has values of interest that are\n\
    \nprocessed to produce the required results, so it would probably be more\n\n\
    accurate to say that the program manipulates or processes these values rather\n\
    \nthan the object itself. Objects are sometimes called “entities”, especially\
    \ in the\n\narea of database design.¹\n\nObjects have values that describe them,\
    \ called *attributes*. An attribute is simply\n\nsome property that characterises\
    \ an object; people have attributes such as name,\n\nheight, shoe size, and so\
    \ on. In object-oriented programming some objects can\n\nalso have procedures\
    \ (some might call them *functions*) that use the values asso-\n\nciated with\
    \ the object to calculate some other value or to achieve some effect;\n\nthese\
    \ are called *methods*. A method is some set of steps that can be carried out\
    \ to\n\ndo something useful or interesting with an object; obviously a method\
    \ often\n\nmakes use of the values of an object’s attributes. An object is therefore\
    \ defined\n\nby the values of its attributes and the behaviour of its methods.\n\
    \nMore formally an *object type* corresponds to a homogeneous²^ group of objects\n\
    \nin the real world. Examples might be ducks, pop singers, or people called James.\n\
    \nEach object type has a particular set of *instances*, for example, Elvis,³^\
    \ Britney\n\nSpears, and James Gosling. An object type has attributes and methods\
    \ and each\n\ninstance of the object type has particular values (of the attributes)\
    \ and therefore\n\ndifferent behaviours (of the methods) for each of these. Normally,\
    \ when taken\n\ntogether, the values for an object instance uniquely describe\
    \ that instance.\n\nAn object type is sometimes called a *class*. This is the\
    \ name that we will meet\n\nlater on in Java, and is the name used in most object-oriented\
    \ programming\n\nlanguages. This chapter is not about a specific language, so\
    \ we’ll stick with the\n\nmore general “object type”, but remember that these\
    \ are basically the same\n\nthing.\n\nLet’s look at these ideas in more detail.\n\
    \n**Attributes**\n\nObjects are all around us. You’re holding one in your hand\
    \ now.⁴^ The object you\n\nare holding is a book. Imagine that you were trying\
    \ to describe this book to\n\nsomeone else so that they could go and find it in\
    \ a library full of similar books.\n\nYou’d probably tell them the title, maybe\
    \ the name of the author, and perhaps\n\nyou’d also describe the cover. You would\
    \ tell them some things that were \n\nspecial about this book; ideally you would\
    \ tell them the things that uniquely\n\nidentify it among all other books. You\
    \ would not tell them that the book \n\nis printed on paper because all books\
    \ are like that; you would concentrate on \n\nthe things that make this book easily\
    \ identifiable among all other books. In\n\nobject-oriented terms you would be\
    \ telling them about the values of this book’s\n\nattributes.\n\nAn object’s attributes\
    \ are the features that identify or characterise it. A book\n\nhas a title, an\
    \ author, an ISBN number, and many more attributes (look at the\n\n*Objects. The\
    \ building block*\n\n41\n\n1\n\nYou may have done some entity-relationship modelling.\
    \ Objects and entities as used in this\n\nsense are much the same thing.\n\n2\n\
    \nIt means “all the same sort of thing”.\n\n3\n\nThe duck, not the singer.\n\n\
    4\n\nOr else you’re reading this in a very strange way."
