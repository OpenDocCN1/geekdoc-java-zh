    Objects lie at the heart of object-oriented programming. Java is an object-


    oriented programming language. Java programs define and process objects that


    represent physical objects or events in some real world problem. The first stage


    in developing an object-oriented Java program is to identify the object types
    in


    the problem and to write programs to implement these. These object types are


    then used in the programs that are written to solve the problem.


    An* object type* is used to represent a group of connected *objects* in a real
    world


    problem. Individual instances of this object type (*objects*) are characterised,


    usually uniquely, by the values of their *attributes*. Attributes are values of
    inter-


    est; they have a *type* and can hold only one value. Attributes may themselves
    be


    objects.'
