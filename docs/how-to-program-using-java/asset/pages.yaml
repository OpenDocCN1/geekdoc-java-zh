    *How to program using Java*


    correct in all cases. Identify any cases where the program does not work cor-


    rectly. You’ll find it easier to use the version that takes input from the user.


    **10.2**


    The case of dividing a number by 0 has been identified as a potential


    error in a program. Write a small program to find out what your Java system


    does when faced with a division by 0. At what stage does your Java system spot


    this error? You don’t know how to stop this happening yet (that’s in Chapter 14)


    but at least you’ll recognise it when it happens!


    **10.3**


    In the first example in this chapter the assumption was made that if the


    first judge’s marks were handled correctly all the others were also handled


    correctly. Is this a sensible assumption to have made?


    **10.4**


    A program takes the marks achieved by a student on three tests and


    displays the average. Each test is marked on a scale of 0 to one hundred inclu-


    sive. Write a test plan for this program.


    **10.5**


    The program from Exercise 10.4 is extended to display the class of the


    student rather than the average. Three classes are defined; A (for average marks


    70 to 100), B (average 40 to 69.9), and C (39.9 and less). Write a test plan for
    this


    version of the program.


    ![](img/05fa4bae6319441a0b86c0179baaedc2_151_0.png)


    Testing is important. As well as having to learn to program you are now going


    to have to learn to test your programs. It will be best if you get into the habit
    of


    developing and using thorough test plans. Never be tempted to treat testing as


    a random activity. It can be tedious, but it is very important.


    A test plan provides a list of test cases that can be applied to a program. Each


    test case consists of a set of input values and the corresponding set of output


    values. A program has passed the test if and only if it passes all the test cases.


    Only then should a programmer have any confidence in the program. Only


    then should a programmer be prepared to pass the program on to its intended


    users.


    The test plan should be written before the program. Ideally it should not be


    written by the programmer or by anyone who has any knowledge of the details


    of how the program works. The test plan should certainly not be written as an


    afterthought when the program is believed to work!


    Writing a program is only part of the activity of programming. Testing the


    program and correcting the errors revealed is another, equally important, part.'
