  md: "108\n\n*How to program using Java*\n\nThis uses the *modulus* operator, which,\
    \ as we learned earlier, gives the remain-\n\nder when the first operand is divided\
    \ by the second. This would tell Cilla \n\nhow many eligible ducks will be at\
    \ a loose end on Thursday afternoon. This\n\nexpression is equivalent to the rather\
    \ more cumbersome:\n\nint spareDucks = numDucks - (TEAMSIZE \\* numTeams);\n\n\
    Having said all this, it makes sense to move these calculations into separate\n\
    \nmethods (*getNumTeams* and* getRemainder*, say), so that if the calculations\n\
    \nneed to change drastically, they can be done once in the method body rather\n\
    \nthan (potentially) several times in the main method.\n\nHere is the complete\
    \ program:\n\n/\\* CricketScheduler.java – Cilla's cricket scheduling software\n\
    \nAuthor\n\n: GPH\n\nDate\n\n: 9th June 2003\n\nTested on : Linux (Red Hat 8.0),\
    \ JDK 1.4.1\n\n\\*/\n\npublic class CricketScheduler\n\n{\n\npublic CricketScheduler\
    \ () {}\n\npublic int getNumTeams (int num, int size)\n\n{\n\nreturn num / size;\n\
    \n}\n\npublic int getRemainder (int num, int size)\n\n{\n\nreturn num % size;\n\
    \n}\n\npublic void printInfo (int num, int size)\n\n{\n\nSystem.out.println (\"\
    There are \" + num + \" ducks available.\");\n\nSystem.out.println (\"This means\
    \ \" + getNumTeams(num, size)\n\n\\+ \" teams of \" + size + \".\");\n\nSystem.out.println\
    \ (\"This leaves \" + getRemainder(num, size)\n\n\\+ \" substitutes.\");\n\n}\n\
    \npublic static void main (String\\[\\] args)\n\n{\n\nCricketScheduler cs = new\
    \ CricketScheduler ();\n\nint numDucks = 36;\n\nfinal int TEAMSIZE = 11;\n\ncs.printInfo\
    \ (numDucks, TEAMSIZE);\n\n}\n\n}"
