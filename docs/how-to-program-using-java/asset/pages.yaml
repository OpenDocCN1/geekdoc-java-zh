  md: "xiv\n\n**About the authors**\n\n**Tony Jenkins** is a Senior Teaching Fellow\
    \ in the School of Computing at the\n\nUniversity of Leeds. His hobby is teaching\
    \ introductory programming. He is\n\nlucky that his hobby is also his job. He\
    \ has given many presentations and\n\nwritten many papers about the ways in which\
    \ programming is taught.\n\nTony gained his BSc from the University of Leeds in\
    \ Data Processing (back\n\nwhen computers were *real* computers) in 1988. Five\
    \ years spent writing pro-\n\ngrams in what many call the “real world” convinced\
    \ him that fun was more\n\nimportant than money, and he returned to the University\
    \ of Leeds in 1993. He\n\nhas been teaching since then, and teaching introductory\
    \ programming since\n\n1995\\. In 2002 the University of Kent at Canterbury saw\
    \ fit to award Tony an MSc\n\nfor research into the experience and motivation\
    \ of students learning to program.\n\nWhen not at work, Tony can generally be\
    \ found with Dave and Wallace in the\n\nGrove or the Eldon, probably after two\
    \ hours on the terraces at Headingley,\n\nobserving the antics of the Tykes or\
    \ the Rhinos. He has been known to drink beer.\n\nTony approves of cats, but is\
    \ allergic to them. He thinks that ducks are alright,\n\nbut he has never been\
    \ closely acquainted with one.\n\nAnyone wanting to contact Tony about this book\
    \ (or just to have a chat) \n\ncan send email to *tony@tony-jenkins.co.uk*. There\
    \ are rumours of some\n\nsort of web page at *http://www.comp.leeds.ac.uk/tony*/,\
    \ but\n\n*http://www.leeds-camra.com*/ is probably a better bet.\n\n**Graham Hardman**\
    \ works as a computer support officer in the School of\n\nComputing at the University\
    \ of Leeds, and has done so since graduating from\n\nthere with a BSc in Computer\
    \ Science in 2001. During his time as an under-\n\ngraduate, he acquired the *nom\
    \ de plume* Mr Gumboot, for reasons lost in the\n\nmists of time, and probably\
    \ best left there.\n\nIn the course of his job, Graham writes programs in many\
    \ languages, includ-\n\ning C, Java, Perl and Python. He can usually be found\
    \ helping to maintain the\n\nlarge number of Linux workstations and servers in\
    \ the School, but has been\n\nknown to touch Windows machines on occasion.\n\n\
    Outside the hallowed corridors of Yorkshire academia, Graham maintains an\n\n\
    avid interest in an organisation known as Everton, apparently a popular gen-\n\
    \ntlemens’ sporting establishment in his home town. He can sometimes be found\n\
    \nin the Spellow House on Dane Street enjoying 5.68cl of draught Irish stout with\n\
    \nvarious gentlefolk in royal blue attire. He also chases inflated spherical objects\n\
