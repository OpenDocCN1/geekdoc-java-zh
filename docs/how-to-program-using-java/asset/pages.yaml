    \ filename);\n\nioe.printStackTrace ();\n\n}\n\n}\n\n**Inheritance**\n\nIt is\
    \ not uncommon for an application to contain many classes that are very \n\nsimilar.\
    \ Applications will deal with different types of people, bank accounts,\n\nbooks,\
    \ or animals. There are many occasions when a method written for one\n\nclass\
    \ can be used in another and where different classes have the same attrib-\n\n\
    utes. In this case there can often be a great deal of code that has to be dupli-\n\
    \ncated in the different classes. We have seen this several times when code for\n\
    \ndifferent types of animal has had to be duplicated in different classes.\n\n\
    Sometimes the classes form a hierarchy. For example, if an application needs\n\
    \nclasses representing different kinds of people – students, teachers, bus conduc-\n\
    \ntors – many of the different classes will have the same attributes. It would\
    \ be\n\nvery wasteful to have to implement the same methods in each class.\n\n\
    Java provides a mechanism to allow for this, called inheritance. Inheritance\n\
    \nallows the programmer to define one basic class and to allow other classes to\n\
    \ninherit all the attributes and methods of this class. The inheriting classes\
    \ have\n\nall the attributes and methods of this class and can also have their\
    \ own. The\n\nmost common example is probably a class for *People* that would\
    \ hold names,\n\nbirthdays, and so on, and would be inherited by classes representing\
    \ particular\n\ntypes of people such as students and bus conductors.\n\nThe class\
    \ that contains the common attributes and methods is called the *base*\n\n*class*\
    \ and the classes inheriting from it are called *derived classes*. The base class\
    \ is\n\ndefined first in the usual way:\n\npublic class Person {\n\nprivate String\
    \ name;\n\nprivate int age;\n\nprivate String address;\n\npublic Person ()\n\n\
    {\n\n}\n\npublic void setName (String newName)\n\n{\n\nname = newName;\n\nreturn;\n\
    \n}\n\npublic void setAge (int newAge)\n\n{\n\nage = newAge;\n\nreturn;\n\n}\n\
    \npublic void setAddress (string newAddress)\n\n{\n\naddress = newAddress;\n\n\
    return;\n\n}\n\n*Onward!*\n\n319"
