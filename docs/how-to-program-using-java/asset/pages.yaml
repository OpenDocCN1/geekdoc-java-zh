  md: "Objects are implemented in Java as something called *classes*. An\n\nobject\
    \ in a Java program is in fact an instance of a Java class.\n\nThis chapter introduces\
    \ a very simple class to show the\n\nbasic ideas of how this works. After reading\
    \ this chapter you\n\nshould be able to write programs that make use of other\n\
    \nsimple classes, and you should have a basic idea of how to\n\nwrite such classes\
    \ yourself.\n\nThis chapter looks in more detail at how classes and objects\n\n\
    are defined in Java. There are quite a few fiddly little details\n\nthat you need\
    \ to understand!\n\nAt the end of this chapter you should be able to write \n\n\
    simple Java classes and programs that make use of them. You\n\nshould be able\
    \ to identify the classes in a problem area and\n\ndesign and write a program\
    \ using them to solve the problem.\n\nJava classes have a public face and a private\
    \ face. The public\n\npart, called the *interface*, is available to all programs\
    \ that use the\n\nclass. The private part, on the other hand, is available only\
    \ to\n\nthe class itself. Classes are not unlike people. \n\nThis is a very powerful\
    \ mechanism that allows for *data*\n\n*hiding*. It is one of the key ideas that\
    \ make Java programs\n\nportable between different computer systems and one of\
    \ the\n\nproperties of Java that makes it one of today’s most popular\n\nprogramming\
    \ languages.\n\nA well-written Java program written on one computer\n\nshould\
    \ be able to run unaltered on another computer system.\n\nIt should be obvious\
    \ why this is a good thing.\n\nAfter reading this chapter you should understand\
    \ the\n\ndifference between the public and private parts of a Java class.\n\n\
    You should be able to design classes with suitable public and\n\nprivate parts\
    \ and you should understand why this means that\n\nJava programs can be portable\
    \ and reusable.\n\nThis chapter moves on to deal with the rest of the basics \n\
    \nof Java. It describes the two *conditional control statements*.\n\nSometimes\
    \ there are parts of a program that we want to exe-\n\ncute only if some condition\
    \ is true; a word processor program\n\nshould print a document only if the print\
    \ button is pressed, \n\nfor example.\n\nThis chapter explains what a *condition*\
    \ is and how it can\n\neither be *true* or* false*. It explains how to combine\
    \ single condi-\n\ntions into more complex expressions using Boolean logic.\n\n\
    Finally it explains how you can use such expressions to control\n\nhow your programs\
    \ behave in certain situations. \n\nAfter reading this chapter you should be able\
    \ to write more\n\ncomplex Java programs that can carry out different tasks\n\n\
    depending on the user’s input and on other values. Your\n\nprograms will be able\
