  md: 'written should be clear and unambiguous. The description of the processing


    carried out by the *sell* method could be written in pseudocode as:


    *IF the value of "sold to" is blank THEN*


    *Set the value of "sold to" to the Reserve object*


    *OTHERWISE*


    *Display an error message – the duck is already sold*


    *END IF*


    Armed with the pseudocode, the programmer will be in no doubt about the


    analyst’s intentions. It is good practice to write out all but the very simplest


    methods in this way before writing them in actual program code.


    **Designing the program**


    With the object types designed, the program or programs that will use them can


    also be designed. As with the design of the methods, once the purpose of the


    program has been specified it is usual to describe it more formally using


    pseudocode.


    One program that is clearly needed is one that will allow Mr Martinmere to


    record the sale of a duck. This would presumably ask him to enter the name of


    the duck and the name of the reserve buying and would then make the required


    changes in his records. The pseudocode for this might be:


    *Display "Enter the name of the duck:"*


    *Read Input and store as theDuck*


    *Display "Enter the name of the reserve:"*


    *Read Input and store as theReserve*


    *Use sell method of duck object to record sale*


    This simply and unambiguously specifies the method and tells the programmer


    precisely which other method to use.


    As another example, suppose that Mr Martinmere decides that he wants a


    program that will display the details of all his coots. This program will have
    to


    process and display the details of each coot in turn, using the *display* method.


    This could be expressed in pseudocode:


    *Get the details of the first coot*


    *WHILE there are coots left*


    *Display the details of the coot using the display method*


    *Get the details of the next coot*


    *END WHILE*


    Design of anything more than simple programs will have to wait until you


    have learned more of the details of programming. For the moment you should


    just appreciate the importance of design and the great importance of expressing


    the design in an unambiguous way.


    **Analysis and design**


    This example has shown how a description of a problem can form the basis of


    an analysis of a problem area. This analysis leads to a design of a solution.
    The


    approach suggested here is a simple methodology that you should follow


    whenever you come to develop a new program.


    60


    *How to program using Java*'
