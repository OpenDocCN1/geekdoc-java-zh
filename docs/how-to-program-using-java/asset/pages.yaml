  md: '*A word on testing*


    125


    You have now written your first complete Java program. Most of the rest of this


    book will be about Java, but in many ways writing a program is only half of the


    story. If a program is going to be truly useful the programmer and, more impor-


    tantly, the program’s intended final users must have confidence in the results


    that it produces. They must be sure that the results they see from the program


    are correct. Business users are potentially going to base costly business


    decisions on the results produced by the programs they use, pilots are going to


    trust navigational systems in their aircraft, and so on. This brings us to a brief


    pause from looking at Java. This chapter looks briefly at how and why


    computer programs are tested.


    After reading this chapter you should understand something about the ways


    in which all your programs should be tested. You should be able to write a *test*


    *plan* for a program and you should also be able to carry out the plan. Using
    the


    ideas from this chapter you should be able to demonstrate that all the Java


    programs you write in the future are “correct” and you should understand why


    it is never possible to be completely sure that a program is completely correct!


    ![](img/05fa4bae6319441a0b86c0179baaedc2_142_0.png)![](img/05fa4bae6319441a0b86c0179baaedc2_142_1.png)


    Writing a computer program is a complicated business but it is far from the


    only activity involved in producing reliable software for reliable computer


    systems. We have already seen the importance of thorough analysis and design


    before a program is written. The process of producing reliable computer


    systems is usually called *Software Engineering*. The term software engineering


    includes a wide range of activities – designing software, testing software, writ-


    ing documentation, and more – of which programming is only quite a small


    part. Some programmers call themselves *Software Engineers* to reflect the range


    of tasks involved; in many organisations a programmer would be expected to


    carry out a range of such tasks. Programming and software engineering are not


    the same thing.'
