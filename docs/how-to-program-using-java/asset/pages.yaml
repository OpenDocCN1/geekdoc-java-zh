    **Mutators**


    Mutators change values of attributes and are very similar to selectors. The main


    difference is that they each have the new value for the private attribute


    provided as a parameter. This parameter is listed together with its type (and
    is


    given an identifier) in the brackets after the method’s name. The heading line
    is


    then complete:


    public void setName (String newName)


    It is useful to use a similar convention for naming mutators to that used for


    selectors. Here we will use *set* followed by the name of the attribute that is


    affected, so *setName* changes the value of the *name* attribute.


    The declaration of the parameter in the brackets looks rather like the


    declaration of a variable and this is in fact just what it is. The parameter is
    avail-


    able inside the method in just the same way as a variable. Again, a convention


    for naming the parameter is a good thing; here we use the word *new* followed


    again by the name of the attribute.


    The body of the mutator method takes the value of the parameter and assigns


    it to the private attribute. Finally, the method has no particular need to return
    a


    value, so it is declared as void. The full method is now:


    public void setName (String newName)


    {


    name = newName;


    }


    This is a very simple example, and one that sets the new value without bother-


    ing to check it; the assumption is that the string provided is a valid name for
    a


    duck. But suppose that a similar method had been written to set a duck’s age:


    public void setAge (int newAge)


    {


    age = newAge;


    }


    This is fine, and it would work. The problem would come when a program tried


    to use it with an invalid value; this method would quite cheerfully set the age


    of a duck to 400 (which is unlikely) or –1 (which is clearly invalid). A slightly


    more sophisticated mechanism is needed.


    The solution is to check the value before it is used, and to set it only if it
    is


    found to be valid. That needs some Java that we’ve not seen yet, so we’ll see


    how to do that in the next chapter.


