  md: 'do tell us that this has happened in a call to *Console.readInt* from line
    8 of


    the file *ReadInteger.java*. This error is obviously best avoided.


    The trick in doing this is to catch the exception. The statements that might


    throw an exception are enclosed in braces with the try statement:


    try {


    i = Console.readInt ();


    System.out.println ("You entered " + i);


    }


    This has no effect on the way in which the program runs. The difference is now


    that the program can catch the exception:


    try {


    i = Console.readInt ();


    System.out.println ("You entered " + i);


    }


    catch (NumberFormatException exception) {


    System.out.println ("Not an Integer!");


    }


    This code simply prints out an error message if the exception is thrown. The


    effect is now:


    *tetley% javac ReadInteger.java*


    *tetley% java ReadInteger*


    *Enter a number: ****twelve***


    *Not an Integer!*


    You can place any legal Java code inside the catch block, so in the case


    above, we print a useful warning message. Often, the catch block is used to fix


    or work around an error where possible, or to tidy up before exiting abnormal-


    ly, by closing open files, logging the error and the like. A common and useful


    method to include in the catch block is the built-in printStackTrace method


    (which can be called on any exception object). This prints a lot of debugging


    information (as we saw above with the NumberFormatException), and can


    be useful for tracing obscure errors in your code, especially when shown to a


    seasoned Java buff:


    catch (NumberFormatException exception) {


    exception.printStackTrace (); // display debugging information


    }


    A final word about exceptions. Some programs you see might have methods


    that look like the following:


    public void read () throws Exception


    This has effectively stated that the method is allowed to throw exceptions, and


    that the code which calls the method should handle them. Without the final part


    the compiler will check the method implementation and will warn about


    possible exceptions that are not trapped. In programs designed to be robust


    (hopefully all of them!) it is essential to trap all exceptions and to deal with


    them sensibly.


