  md: "These sections do not aim to provide a complete description of these ideas.\n\
    \nThey should give you a flavour of what each topic is about; this should be just\n\
    \nabout enough so that you can try them out yourself in your own programs.\n\n\
    **Exception handling**\n\nSometimes, when a program is running, something happens\
    \ that is unexpect-\n\ned. In Java, this is called an *exception*. If Java detects\
    \ such an event, it “throws”\n\nan exception to indicate that something has gone\
    \ wrong. We have ignored the\n\npossibility of exceptions in all the programs\
    \ in this book (even if they have\n\ncropped up at times); obviously this is not\
    \ a good idea in programs that are\n\nrequired to be robust.\n\nThe main difference\
    \ between exceptions and other ways of signalling errors\n\nis that when an exception\
    \ is thrown, the program is guaranteed to halt unless\n\nthe programmer takes\
    \ measures to handle the exception. A mechanism is \n\nprovided to “catch” any\
    \ exception that Java “throws” allowing the program to\n\nperform some suitable\
    \ action. Let’s look at an example.\n\nSo far we have assumed that a program’s\
    \ user has always entered an integer\n\nwhen one was expected. This is actually\
    \ flawed thinking, since users are \n\nunlikely to behave in such a helpful and\
    \ predictable way. Here is a simple\n\nprogram fragment that reads an integer:\n\
    \nint i;\n\nSystem.out.print (\"Enter a number: \");\n\ni = Console.readInt ();\n\
    \nSystem.out.println (\"You entered \" + i);\n\nThis fragment works just as expected\
    \ when the user enters an integer as \n\nexpected:\n\n*tetley% javac ReadInteger.java*\n\
    \n*tetley% java ReadInteger*\n\n*Enter a number: ****12***\n\n*You entered 12*\n\
    \nThings start to go wrong when the user enters a string instead:\n\ntetley% java\
    \ ReadInteger\n\nEnter a number : seven\n\nException in thread \"main\"\n\njava.lang.NumberFormatException:\
    \ For input\n\nstring: \"seven\"\n\nat\n\njava.lang.NumberFormatException.forInputString(NumberFormatException.\n\
    \njava:48)\n\nat java.lang.Integer.parseInt(Integer.java:468)\n\nat java.lang.Integer.parseInt(Integer.java:518)\n\
    \nat htpuj.Console.readInt(Console.java:28)\n\nat ReadInteger.main(ReadInteger.java:8)\n\
    \nThe output on your Java system might look a little different, of course, but\
    \ it\n\nshould look something like this. Crucially, it should contain the name\
    \ of the\n\nexception that has been thrown.\n\nJava is telling us here that an\
    \ exception has been thrown. The name of the\n\nexception is on the first line\
    \ of the error – *NumberFormatException*. The rest\n\nof the message is telling\
    \ us where in Java’s internals this has happened; to a\n\nbeginner, this is not\
    \ especially useful information, except that the last two lines\n\n*Onward!*\n\
