    *How to program using Java*


    what is wrong. It is only when the program is examined in a white box test that


    the cause of the error can be found.


    For thorough testing both approaches should be used. It is probably sensible


    to use black box testing first, not least because most of the time the process
    can


    be automated. But when a program passes all the black box tests it should still


    be thoroughly examined in a proper white box test.


    **Testing classes**


    Much of the discussion of testing so far has focused on testing complete pro-


    grams. This has assumed that the classes used by the programs are known to


    work correctly. Obviously for this to be the case the classes themselves must


    also have been tested. They should certainly be thoroughly tested before they


    are ever used in a program, and we have been testing many of the classes in this


    book as we have gone along. It can be very frustrating and time consuming to


    find and correct an error in a program only to discover that the cause or the


    error is hidden away in a class used by the program.


    Of course, classes cannot be tested in the same way as programs. Classes


    cannot be run; there is no input to provide and no output to trace. The key to


    testing a class is to use a small program that tests each method of the class
    in


    turn. This allows for black box testing; the methods themselves should also be


    examined in a white box test. We have met such *driver programs* before, when


    we have written simple methods to allow us to test a class.


    When a class is being developed, a program to test it may already be provid-


    ed or may be developed by another programmer. There may be a *test harness*, a


    program that can take the implementation of the class and test it. The class will


    be acceptable only when it passes all the tests run by the test harness success-


    fully. Alternatively, the programmer who developed the class may have to write


    a simple driver program that will allow the class’s methods to be tested.


    In many of the classes we have written we have also written a small driver


    program in the main function. This is a fine habit to get into so that you can


    make sure that your classes work. Another possibility is to use a standard name


    for a method, *test* say, that runs a small test program for each class.


    The first and simplest approach to writing a driver is simply to write a pro-


    gram that calls each of the methods and displays the results. These are examined


    to see if they are as expected in a way that is very similar to black box testing.
    A


    simple program like this for one of our very familiar *Duck* classes might include:


