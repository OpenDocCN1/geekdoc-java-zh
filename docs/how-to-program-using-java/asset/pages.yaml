  md: "*The basics*\n\n101\n\nThere is one obvious attribute, the message that is\
    \ displayed on the sign. This\n\nis a sequence of characters, or a String in Java.\
    \ There are no other attributes\n\nthat we need to worry about at the moment.\n\
    \nThere are two obvious methods. First, Bruce will need some sort of way to set\n\
    \nthe message that is to be displayed. This would presumably involve typing \n\
    \nit in. There will also need to be some way to activate the sign; there must\
    \ be\n\nsome way for Bruce to confirm that the message is correct and that the\
    \ sign\n\nshould start displaying. These two methods might be called *setMessage*\
    \ and\n\n*display* respectively.\n\nThere will be one other method, since the\
    \ class will need a constructor. This\n\nwill provide some sort of initial value\
    \ for the message; you could think of it as\n\nBruce turning the sign on.\n\n\
    The class might be called *Sign* and the definition would be created in a \n\n\
    file called *Sign.java*. The first stage would be to add the single attribute:\n\
    \npublic class Sign\n\n{\n\n// Single Attribute – What to Display\n\nprivate String\
    \ message;\n\nNow the methods are added. The first, the constructor, has the same\
    \ name as\n\nthe class and just sets an initial value for the attribute – an empty\
    \ string will do.\n\npublic Sign ()\n\n{\n\nmessage = \"\";\n\n}\n\nThe other\
    \ two methods are slightly more complicated, so let’s take them one\n\nat a time.\
    \ The first sets the message that is to be displayed. It will need a single\n\n\
    parameter representing the message (a String). There is no need for it to\n\n\
    return a value, so it can be a void method. All it does is take the value from\
    \ the\n\nparameter and copy it into the attribute, so:\n\npublic void setMessage\
    \ (String newMessage)\n\n{\n\nmessage = newMessage;\n\n}\n\nThe other method displays\
    \ the message. It needs no parameter and does \n\nnot need to return a value.\
    \ For the moment we’ll assume that displaying the\n\nmessage in the usual default\
    \ place will be enough, so:\n\npublic void display ()\n\n{\n\nSystem.out.println\
    \ (message);\n\n}\n\nAnd that’s enough to define the class. Some comments should\
    \ be added, of\n\ncourse, to give the final definition.\n\n/\\* Sign.java\n\n\
    Bruce writes the traditional first program, but this\n\ntime with objects."
