    \ methods; the implementations\n\nthemselves will need to be added later. For\
    \ the moment the class looks like this:\n\npublic class Duck\n\n{\n\n// Attributes\n\
    \nprivate String name;\n\nprivate int age, x, y;\n\nprivate double value;\n\n\
