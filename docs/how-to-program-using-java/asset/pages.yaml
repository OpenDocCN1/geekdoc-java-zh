    \ You may want to replace \n\nthe 1.0 with something more informative (“*undefined*”,\
    \ say), or even the entire\n\nline of output (“*Duck A has not batted*”, for example).\n\
    \n**18.3**\n\nWrite a program that reads the attributes of a complete team of\
