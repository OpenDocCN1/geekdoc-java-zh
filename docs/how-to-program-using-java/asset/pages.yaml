  md: "88\n\n*How to program using Java*\n\nAuthor\n\n: GPH\n\nDate\n\n: 14th December\
    \ 2002\n\nPlatform : Linux (Red Hat 7.3), JDK 1.4.1\n\n\\*/\n\npublic class First\n\
    \n{\n\npublic static void main (String args\\[\\])\n\n{\n\nint aNumber;\n\naNumber\
    \ = 0;\n\n}\n\n}\n\nThis is the *source code* of a program.\n\nThe first six lines\
    \ in this program, enclosed between /\\* and \\*/ are *comments*\n\n(you saw some\
    \ in the program in the previous chapter). The compiler ignores\n\nthese lines;\
    \ their only use is for a human reading the program. In this case they\n\nprovide\
    \ the name of the file containing the program, give a brief description of\n\n\
    the purpose of the program, and tell us who the author was and when and on\n\n\
    what system the program was written.\n\nThis is the *header block* of the program,\
    \ a collection of comments that provides\n\nbasic but important information about\
    \ the program. A header block should as\n\na minimum tell the reader who wrote\
    \ the program, what the program does,\n\nwhy it was written, where it was written,\
    \ and when it was written. As a pro-\n\ngram is developed, changed, and maintained\
    \ the header block should record\n\nthe same information about all the changes.\
    \ This will then provide all the \n\ninformation a human would need in order to\
    \ understand how and why the \n\nprogram was originally written and how and why\
    \ it has been changed since.\n\nMore generally, comments are used for many purposes;\
    \ common uses are to\n\nexplain parts of programs (especially complicated parts)\
    \ and to record modifi-\n\ncations to parts of a program. Their purpose is only\
    \ ever for a human reading\n\nthe program.\n\nThe next line:\n\npublic class First\n\
    \nmarks the start of the definition of a class called *First*. Here *First* is\n\
    \nthe name of the program (or the name of the single public class defined in the\n\
    \nprogram); the braces immediately after this line mark out the definition of\
    \ the\n\nattributes and methods that this class has.\n\nIn fact this class has\
    \ only one method and no attributes. The method is called\n\nmain, and the start\
    \ of its definition is the line:\n\npublic static void main (String args\\[\\\
    ])\n\nThis marks the start of the program. Once the program has been compiled,\
    \ this \n\nis the part of the program that the computer will execute first, the\
    \ main\n\nmethod. There’s a lot going on in this line, and more detailed explanations\
    \ will\n\nhave to wait until you’ve learned a lot more Java, but briefly:\n\n\
    ●public declares that this method is available to anything that might want to\n\
    \ncall it;\n\n●static declares that this method can be called without requiring\
    \ an instance\n\nof the class it is defined in (so, for example, you can call\
    \ a static method"
