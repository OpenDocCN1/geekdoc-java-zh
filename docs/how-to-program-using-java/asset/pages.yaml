  md: "94\n\n*How to program using Java*\n\nThis is, of course, an assignment statement\
    \ (actually in the BASIC language, but\n\nit’s very similar to the Java equivalent).\
    \ Its effect is to add one to the value of\n\nthe variable *X* (sadly, most versions\
    \ of BASIC only allowed single character\n\nvariable identifiers).\n\nThe important\
    \ thing to remember, especially when the same variable appears\n\non both sides\
    \ of the assignment statement, is that the value of the expression on\n\nthe right\
    \ is calculated first and the result is then assigned to the value of the\n\n\
    variable named on the left. This means that a statement such as:\n\naNumber =\
    \ aNumber + 1;\n\nhas the effect of adding one to (called *incrementing*) the\
    \ value of *aNumber*. The\n\nright-hand side is calculated first, and the result\
    \ is then assigned to *aNumber*.\n\n**Initialising a variable**\n\nNow we know\
    \ what a variable is, and how to declare one, we need to know\n\nhow to go about\
    \ assigning an initial value to it. This is called *initialisation* and\n\nis\
    \ very important in programming. When a variable is declared within a class\n\n\
    definition, it will be assigned a null value (that is, for example, *null* for\
    \ a\n\nString or char, 0 for an int, 0.0 for a double, false for a boolean). When\
    \ \n\na variable is declared within a method, it has no initial value, and any\
    \ attempt\n\nto use that variable before its value is set will result in a compiler\
    \ error along\n\nthe lines of “this variable may not have been initialised”.\n\
    \nTo recap, the declaration of an integer variable looks something like this:\n\
    \nint number;\n\nand to assign it a value, we use the following:\n\nnumber = 0;\n\
    \nThis operation is so common that the two statements can be combined. This\n\n\
    gives the extended form of a declaration that also includes an implicit assign-\n\
    \nment statement:\n\nint number = 0;\n\nThis single statement has the identical\
    \ effect to the two lines above.\n\nNever assume that your variables have a value\
    \ just after they have been\n\ndeclared. Get into the habit of initialising them.\
    \ Wherever possible, declare and\n\ninitialise a variable in a single statement,\
    \ which reduces the likelihood that \n\nyou will later attempt to use an uninitialised\
    \ variable. Finally, never try to use\n\na variable before it has been initialised,\
    \ unless you are assigning an initial value\n\nto it, of course!\n\n**Operators\
    \ and their precedence**\n\nSome of the examples of expressions above used the\
    \ addition operation “+”.\n\nExpressions in assignment statements can also contain\
    \ all the other usual \n\narithmetic operations (plus, minus, times, divide) that\
    \ you might expect. The\n\nsymbols might not be quite what you are used to in\
    \ arithmetic. They are:\n\n/\n\nDivision\n\n\\*\n\nMultiplication\n\n+\n\nAddition\
    \ of numbers or Concatenation of strings\n\n\\-\n\nSubtraction"
