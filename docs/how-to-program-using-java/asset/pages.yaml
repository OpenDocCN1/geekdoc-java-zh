  md: "This is not a book about systems analysis and so this chapter gives you only\n\
    \na very brief insight into the area. At this stage you need to know enough about\n\
    \nanalysis and design to allow you to make sensible choices as you write your\n\
    \nown programs. The activities of analysis, design, and programming are clearly\n\
    \nclosely linked. You may well find out that you enjoy the analysis or design\n\
    \naspects of developing programs more than the actual programming; that’s part\n\
    \nof what learning to program is all about!\n\nBefore you start on this chapter\
    \ it is important that you understand that the\n\nactivities described in this\
    \ chapter are normally best carried out a long way\n\naway from a computer. Analysis\
    \ involves studying a problem and talking to the\n\npeople who are affected by\
    \ it and who understand it (remembering that these\n\ntwo may not be the same!).\
    \ Design is a pencil and paper exercise, with a\n\ncomputer used, if at all, to\
    \ do little more than help with drawing diagrams or\n\npreparing documents. When\
    \ you write programs you should never sit down in\n\nfront of a computer without\
    \ a design at your side. You should have a clear idea\n\nof what your program\
    \ is going to do and how it is going to do that; this idea is\n\nthe main output\
    \ of thorough analysis and design.\n\nThere are several stages to analysis and\
    \ design. These are often described in\n\nthe form of a structured *methodology*,\
    \ a formal way to carry out the various\n\ntasks. There are many formal methodologies\
    \ that can be used for analysis, and\n\nyou might well meet one if you study systems\
    \ analysis further. For simplicity\n\nthis chapter does not describe a particular\
    \ methodology; instead, you will find\n\na less formal approach in the form of\
    \ a suggested set of steps to take. This\n\nsuggestion should be particularly\
    \ suitable for new programmers.\n\n54\n\n*How to program using Java*\n\n***Identify\
    \ Objects***\n\nThe first step is to identify the object types in the problem\
    \ area. \n\nIn the spirit of code re-use it might even be the case that some of\
    \ \n\nthese object types have been met before in previous programs, and \n\nso\
    \ working implementations for them may well already be available.\n\n***Identify\
    \ Attributes***\n\nThe attributes that describe each object type are identified\
    \ and added \n\nto the definition. The type of each attribute is also identified;\
    \ this \n\nmight lead to the identification of more object types that are found\
    \ \n\nto be attributes.\n\n***Identify Methods***\n\nThe methods are added.\n\n\
    ***Design Methods***\n\nEach method is effectively a small program so each one\
    \ is designed \n\nseparately.\n\n***Design Program***\n\nFinally the complete\
    \ program that will make use of the object types \n\nidentified can be designed.\
    \ Only when this step is complete is the \n\nprogram (or any of the methods, for\
    \ that matter) actually written.\n\nThese steps will be illustrated by means of\
    \ an example. Ready?\n\n**Identifying object types**\n\nThis is the most fundamental\
    \ step. The object types will be the basic building\n\nblocks of the final program\
    \ and it is crucial to identify the correct ones. A sim-\n\nple way to identify\
    \ candidates for objects is to take a description of the problem\n\narea and to\
    \ extract all the nouns (or noun phrases); these are the words that\n\nrefer to\
    \ “things” that exist in the problem. Such a description would normally\n\nbe\
    \ a result of an interview with someone close to the problem."
