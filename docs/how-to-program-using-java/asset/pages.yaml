  md: "140\n\n*How to program using Java*\n\n1\n\nIf we allowed the ducks to go upwards\
    \ we would soon be embroiled in the three-\n\ndimensional version of Pythagoras’\
    \ theorem. That alone is reason enough to simplify the\n\nproblem.\n\nThe distinction\
    \ between these two is straightforward. Anything defined to be\n\npublic is available\
    \ to any program that might make use of the class, while any-\n\nthing defined\
    \ as private is available only to the class itself.\n\nThis is a very powerful\
    \ mechanism. It means that, as long as the public part\n\nof the class (the *interface*)\
    \ remains constant, the private part can be changed if\n\nneeded. This means that\
    \ a programmer using the class needs only know about\n\nthe class’s public face;\
    \ the private face remains hidden and can be changed.\n\nAt the same time, the\
    \ programmer working on the class can change the details\n\nof the private part,\
    \ perhaps to implement something more efficiently, without\n\nrisking any unpleasant\
    \ effects on programs that use the class.\n\nAn analogy would be the controls\
    \ of a car. The normal controls – the steering\n\nwheel, pedals, handbrake, and\
    \ so on – remain constant and form the public\n\ninterface to the car’s engine.\
    \ Any changes that, say, a mechanic might make to\n\nthe engine itself are totally\
    \ independent of this interface; anything that changes\n\nin the engine is private\
    \ and is something that the driver doesn’t need to know\n\nanything about. The\
    \ public interface of the car always works in the same way,\n\nand this should\
    \ not be altered by any changes made to the engine.\n\nThe convention used in\
    \ this chapter (and throughout this book) will be that\n\nattributes are always\
    \ defined with private scope, and methods usually with\n\npublic scope. This is\
    \ not required, but it is easily the most common approach. It\n\nalso allows for\
    \ a powerful and secure mechanism called *data hiding*, as we will\n\nsee later\
    \ in Chapter 13.\n\nFinally, let’s define some attributes and methods!\n\n**Attribute\
    \ and method definitions**\n\nWe have taken a theoretical look at attributes and\
    \ methods, and discussed why\n\nthey are usually split between having private\
    \ and public scope respectively.\n\nNow it would make sense to define some attributes\
    \ and methods and see them\n\nin practice.\n\nWe shall return to an earlier example,\
    \ which we first saw in Chapter 6 – a\n\nclass to represent a duck. Recall that,\
    \ for Mr Martinmere’s purposes, a duck has\n\na name, age, and value. These would\
    \ be stored as attributes – name as a\n\nString, age as an int, and value as a\
    \ double. Since all the attributes we\n\nexpect to encounter in this book are\
    \ private, their declarations would be:\n\nprivate String name;\n\nprivate int\
    \ age;\n\nprivate double value;\n\nLet us extend the duck class somewhat; since\
    \ each duck is permitted to \n\nwaddle freely about the reserve, we can provide\
    \ attributes to store the duck’s\n\nlocation, should Mr Martinmere ever need to\
    \ track them. Assuming all the\n\nducks are on the ground,¹^ we can achieve this\
    \ with two attributes, storing the\n\nduck’s* x* and* y* position as int values\
    \ (double would also be acceptable, but\n\nit’s unlikely we’ll even need to get\
    \ down to that degree of accuracy):\n\nprivate int x, y;"
