    *How to program using Java*


    Up to now, we have looked at some basic objects, given them a moderate


    amount of functionality, and learned how to use these objects in simple pro-


    grams. This book was never intended to be *that* basic, so in the next two chap-


    ters we shall revisit much of the earlier material, going into greater depth about


    classes, objects, methods, and attributes.


    There is little new in the way of Java in these chapters; we are concentrating


    more on writing classes that could conceivably be reused by other program-


    mers in the future, and the methodology of writing such programs, rather than


    any bells and whistles that would overcomplicate matters at this stage.


    In this chapter, you will be building a class yourself. By the end of it, you


    should understand how to create a .*java* file to define your class, and you


    should understand a little more about methods and attributes and how to


    incorporate some into your class.


    ![](img/05fa4bae6319441a0b86c0179baaedc2_153_0.png)![](img/05fa4bae6319441a0b86c0179baaedc2_153_1.png)


    A .*java* file defines a class. A .*java* file can, of course, also contain a
    program.


    As we have seen, a Java program is essentially a Java class with a special


    method called main*.* So in effect, any Java class can be made into a program,


    for good or bad, by defining a main method within that class.


    Before we look at a definition of a class, let’s quickly revise some definitions.


    ●An* object* is something of interest in a problem area. It is something that
    is going


    to be used in or somehow affected by a program. An example might be a duck.


    ●An* object type* is a specification of the characteristics shared by a collection
    of


    objects. An example might be “ducks”. In Java (and in most other object-


    oriented languages) an object type is called a *class*.


    ●An* attribute* is a characteristic of an object type that is of interest. This
    is a


    single value of a particular type. The ducks will have names (strings), ages


    (integers), values (money), and more.'
