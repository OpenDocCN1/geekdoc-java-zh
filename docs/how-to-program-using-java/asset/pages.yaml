  md: "*Collections*\n\n249\n\nCollections are sorted by using what are known as sorting\
    \ algorithms. There\n\nare many different algorithms, some simple, some complex,\
    \ some efficient, \n\nand some slow. Entire books have been written on the subject,\
    \ so we won’t be\n\nblazing any trails in this section. Suffice to say that the\
    \ examples you will \n\nbe using and the programs you will write later are simple,\
    \ and do not contain\n\nhuge amounts of data, so simple algorithms will be more\
    \ than satisfactory.\n\nIn most books on learning to program, in whatever language,\
    \ the first sorting\n\nalgorithm to be introduced is one called *Bubblesort*,\
    \ and this is the algorithm we\n\nwill be using. It is not the most efficient\
    \ algorithm, but the code is easy to write\n\nand understand. In any case, describing\
    \ Bubblesort in a book about program-\n\nming is such a fine tradition that it\
    \ should obviously be included here.\n\nFirst, we’ll explain how the algorithm\
    \ works, and then we’ll illustrate this\n\nwith an attempt to use it to sort an\
    \ array. Bubblesort will work the same way\n\nwith any sort of data proved that,\
    \ obviously, the values can be compared in\n\nsome way. For the moment, we’ll\
    \ use integers to keep things simple.\n\nThe basic idea of Bubblesort is that\
    \ we step through a list of values (usually\n\nnumbers or strings), and compare\
    \ each pair of adjacent elements with one\n\nanother, according to some comparison\
    \ rule. If the elements in the pair are in\n\nthe wrong order, they are swapped\
    \ over, and we move on to compare the next\n\ntwo items. So the higher values\
    \ are shifted towards the end of the list, and the\n\nlower values towards the\
    \ bottom.\n\nIt may be best to visualise this process with a list of numbers.\
    \ Let’s suppose\n\nthat we want to sort this list of integers into ascending order.\
    \ The comparison\n\nrequired is simply “less then”, so if the number of the left\
    \ is less than the \n\nnumber on the right they are in the correct order. The\
    \ list initially is:\n\n*8 9 6 4 3*\n\nIn the first step, the first two items\
    \ (8 and 9) are compared, and found to be\n\nin the correct order. So the list\
    \ remains unchanged. Next the 9 and 6 are com-\n\npared, found to be in the wrong\
    \ order, so they are swapped, making the list look \n\nlike this:\n\n*8 6 9 4\
    \ 3*\n\nNext the third pair of items – 9 and 4 – are compared, found to be in\
    \ the\n\nwrong order, and swapped:\n\n*8 6 4 9 3*\n\nand finally, the 9 and 3\
    \ will be swapped after the final comparison:\n\n*8 6 4 3 9*\n\nSo we say that\
    \ the highest value has “bubbled” its way to the end of the list,\n\nhence the\
    \ name of the algorithm. In fact, the highest value is guaranteed to find\n\n\
    its way to the end of the list after the first set of comparisons. Try it and\
    \ see!\n\nOf course the list is not sorted yet. The algorithm must be applied\
    \ again; in\n\nfact, the algorithm must be applied until the list is correctly\
    \ sorted.\n\nContinuing, the second set of comparisons would proceed as follows:\n\
    \n*6 8 4 3 9 (8 and 6 compared and swapped)*\n\n*6 4 8 3 9 (8 and 4 compared and\
    \ swapped)*\n\n*6 4 3 8 9 (8 and 3 compared and swapped)*\n\n*6 4 3 8 9 (8 and\
    \ 9 compared, no swap required)*\n\nSo now the second highest number, 8, has bubbled\
    \ to the end of the list."
