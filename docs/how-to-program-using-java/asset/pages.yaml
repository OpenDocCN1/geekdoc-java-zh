    }


    These methods have been given different names but there is no particularly


    good reason to do this. If all the methods were called simply *mean*:


    public double mean (int x, int y)


    {


    return (double) (x + y) / 2;


    }


    public double mean (int x, int y, int z)


    {


    return (double) (x + y + z) / 3;


    }


    public double mean (int n\[\])


    {


    return (double) (n\[0\] + n\[1\] + n\[2\]) / 3;


    }


    it would still be obvious which one was being called from the types and


    number of parameters. This call:


    mean (a, b);


    is clearly calling the first version since two parameters are provided, while
    this:


    mean (a, b, c);


    must be a call to the second version as there are three parameters.


    In this example the method name *mean* has been overloaded; there are three


    methods with this name. This is fine as long as the method that is being called
    can


    be uniquely determined by examining the type and number of its parameters.


    This technique can make programs much more readable and can save the


    programmer from having to use what amount to artificial names for methods.


    The following program illustrates this idea with some more examples. Each


    time the method *mean* is called the parameters uniquely determine which is to


    be used.


