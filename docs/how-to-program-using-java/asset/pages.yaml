    *How to program using Java*


    ![](img/05fa4bae6319441a0b86c0179baaedc2_79_0.png)


    Before any program can be written the problem that it is to solve must be


    thoroughly analysed, as must the area in which the problem exists. This analy-


    sis, which is often carried out by a Systems Analyst, forms for the basis of the


    design of a solution. The programmer works with this design to produce the


    final working program.


    The first stage in the analysis is the identification of the object types that
    will


    be used in the program. Their attributes and methods are also found and the


    methods are designed. This design normally makes use of pseudocode to


    ensure that it is unambiguous. The ambiguity that can result from the use of


    normal natural written language is best avoided. The use of pseudocode is also


    usual and useful when designing programs.


    Thorough analysis and design is essential before programming can start.


    Now that you’ve appreciated that you’re getting closer to doing some actual


    programming! As a first stage we’ll look at how one of the object types we’ve


    identified in this chapter can be implemented as a Java class.


