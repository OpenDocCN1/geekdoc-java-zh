    public boolean removeDuck (String name)


    {


    Duck tmpDuck;


    for (int i = 0; i<ducks.size (); i++) {


    tmpDuck = (Duck)ducks.get (i);


    if (tmpDuck.getName().equalsIgnoreCase (name) ) {


    ducks.remove(i);


    return true;


    }


    }


    return false;


    }


