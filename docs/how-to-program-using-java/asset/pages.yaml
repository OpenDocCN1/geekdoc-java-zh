    \ of Bruce’s sign\n\nmakes it much more flexible since we can now change the message\
    \ without\n\nneeding to edit the source code and recompile. The new version is:\n\
    \n/\\* CLASign.java\n\nBruce’s sign, which receives its message from the\n\nCLA\
    \ list.\n\nAuthor\n\n: GPH\n\nDate\n\n: 4th July 2003\n\n\\*/\n\npublic class\
    \ CLASign\n\n{\n\n// Single Attribute – What to Display\n\nprivate String message;\n\
    \n// Methods\n\npublic CLASign ()\n\n{\n\nmessage = \"\";\n\n}\n\npublic void\
    \ setMessage (String newMessage)\n\n{\n\nmessage = newMessage;\n\n}\n\npublic\
    \ void display ()\n\n{\n\nSystem.out.println (message);\n\n}\n\npublic static\
