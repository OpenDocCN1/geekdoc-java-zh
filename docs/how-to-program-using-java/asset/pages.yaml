  md: "don’t pass and they need to practise some more. Some people find learning to\n\
    \ndrive harder than others.\n\nLearning to program is very like learning to drive\
    \ a car. You are learning \n\na skill. You will need help from people who already\
    \ have the skill; hopefully, one\n\nof those people will be me, and another will\
    \ be Graham! Above all you \n\nwill need to practise. There’s no way we can teach\
    \ you to program if you just read\n\nthis book, but we can teach you if you read\
    \ the book, then try out the exercises,\n\nand then go and practise some more.\
    \ With any luck you also have some more\n\npeople who are going to help you. Whatever\
    \ you do, don’t be afraid to use them!\n\nBut there’s more. Some people pass their\
    \ driving test the first time. Others\n\nhave to take it many times, but most\
    \ people pass eventually. There are very few\n\npeople indeed who could never\
    \ pass a driving test if they really put their minds\n\nto it and practised. Programming\
    \ is just like that. Some people take to it straight\n\naway, and they’re the\
    \ lucky ones. Most people take a bit longer, but anyone can\n\nget there in the\
    \ end. I’ve never met anyone that couldn’t learn to program. Not\n\nif they tried\
    \ and if especially not if they refused to give up.\n\nIf I had taken the same\
    \ attitude to learning to drive as I took to my adventure\n\ngame all those years\
    \ ago I would never have passed the driving test. The game\n\nwas difficult so\
    \ I lost interest and gave up. Then again, looking back I probably\n\nbelieve\
    \ that I could have completed it if I’d really wanted to and if I’d carried\n\n\
    on. Learning to program is like that too; if you give up when you find some-\n\
    \nthing difficult you’ll never succeed and learn. But if you persevere and if\
    \ you’re\n\ndetermined to succeed you will do. I’ve seen many people struggling\
    \ as they\n\nlearned to program but the only people I’ve seen fail to learn to\
    \ program are\n\nthose that gave up. Don’t be like them!\n\nNow, don’t take this\
    \ the wrong way. The last thing I want you to do now is\n\nthrow this book down\
    \ and set off to do something different. You can learn to\n\nprogram, and you\
    \ will learn to program. You just need to remember that things\n\nwill probably\
    \ get a little difficult at times and when this happens you’ll have to\n\nsort\
    \ things out. Giving up should not be an option! Nor should running away\n\nand\
    \ hiding.\n\nNow let’s check through what it is that you’re going to need to make\
    \ sure that\n\nyou succeed. These will be, if you like, the controls that you’ll\
    \ use so you’ll need\n\nto be familiar and comfortable with them.\n\n**What you\
    \ need**\n\nBefore you start looking at some programs and some Java we need to\
    \ check that\n\nyou’re prepared. There are some things you’re going to need so\
    \ let’s quickly run\n\nthrough them.\n\nYou will need a book or two. You have\
    \ one in your hand now but you also\n\nneed something that describes how your\
    \ local computer system works. I’ve\n\ncalled this your *Local Guide*, and we’ve\
    \ already looked at some of the things it\n\nneeds to contain. If you’re learning\
    \ to program as part of a course you’ll prob-\n\nably also have something else\
    \ that contains the exercises you’re going to com-\n\nplete as part of the course.\
    \ You’ll also need a reference to remind you of the\n\nsyntax of Java as you program;\
    \ you can find just such a handy reference in the\n\nback of this book. This doesn’t\
    \ cover all of Java by any means, but it covers all\n\nthe Java that you’ll find\
    \ in this book so it should do for now.\n\nIf you have access to the World-Wide\
    \ Web you can also find plenty of Java\n\ndocumentation on Sun’s Java site: *http://java.sun.com/.*\n\
    \n32\n\n*How to program using Java*"
