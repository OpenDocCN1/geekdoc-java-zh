  md: "Java is big. As you learn more about it you will come to realise just how true\n\
    \nthis is. Java is a truly general-purpose programming language; you could use\
    \ \n\na program written in Java for just about anything from flying an airliner\
    \ to\n\nkeeping track of numbers on a mobile phone. This is good, because you\
    \ are\n\ngoing to learn a powerful language with many useful applications. But\
    \ it is also\n\nbad because it’s difficult to know where to start. There really\
    \ is a lot going on\n\nin even the simplest Java program.\n\nThis chapter is your\
    \ start with Java. This chapter provides you with a quick\n\ntour of the basic\
    \ Java that we’re going to learn about in this book. This is not \n\nall the Java\
    \ in the book, and certainly not all the Java that there is, but it’s a \n\nreasonable\
    \ start. At this point I’m going to gloss over some of the details; the\n\nidea\
    \ here is to give you a general feeling for what’s going to come later.\n\nIn\
    \ the last chapter we identified object types in a problem area. We identified\n\
    \ntheir attributes and the types of those attributes. We also found some of their\n\
    \nmethods and used some pseudocode to design how these might work. Now is\n\n\
    the time to see how some of these things look in Java.\n\n64\n\n*How to program\
    \ using Java*\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_81_0.png)![](img/05fa4bae6319441a0b86c0179baaedc2_81_1.png)\n\
    \nTo start, let’s recap the object type that we will model in Java in this chapter.\
    \ The\n\ntype is to be used to store the details of ducks on Mr Martinmere’s reserve.\
    \ You\n\nmight want to go and check over the full details of this object type’s\
    \ attributes\n\nand methods at the end of the last chapter.\n\nTo keep things\
    \ nice and simple we’ll just worry about three attributes – name,\n\nage, and\
    \ value. The types of the first two are easy to identify, and a string and\n\n\
    integer respectively will be fine. The type to be used to store the value is slight-\n\
    \nly more complicated; this is actually an amount of money (and as such follows\n\
    \nsome special rules such as only having two places of decimals) but there is\
    \ no\n\nhandy type for that in Java. So we’ll make do with using a simple floating-point\n\
    \nvalue for that."
