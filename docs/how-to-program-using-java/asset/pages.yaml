  md: "*Collections*\n\n245\n\nAnd running this would reveal that the names list currently\
    \ contains:\n\n0 Buddy\n\n1 Elvis\n\n*Deleting elements*\n\nA list can change\
    \ size during the running of a program. We’ve discussed how\n\nto make it larger,\
    \ so it would make sense to talk about how to remove elements.\n\nThere are two\
    \ possibilities here:\n\n●We want to remove a particular element, no matter where\
    \ it happens to be in\n\nthe list.\n\n●We want to remove the element at a particular\
    \ location, no matter what \n\nelement is stored there.\n\nThere is a method,\
    \ imaginatively named remove, which can be used in the \n\nsecond of these two\
    \ ways. This:\n\nnames.remove (0);\n\nwill remove the String object that is stored\
    \ in the “0-th” (that is the first) \n\nelement of names if it exists.\n\nRemoving\
    \ a particular element no matter where it is in the list is a little more\n\n\
    complicated,²^ and is a two-stage process. The first stage is to find the index\n\
    \nrequired using the indexOf method:\n\nint position = names.indexOf (\"Elvis\"\
    );\n\nand then this value is used to remove the element:\n\nnames.remove (position);\n\
    \nOf course these two steps can be combined:\n\nnames.remove (names.indexOf (\"\
    Elvis\") );\n\nIn either case it is only the first element with this value that\
    \ is removed.\n\nFinally, if we want to be drastic, there is a method to remove\
    \ all the elements\n\nin a list. This:\n\nnames.clear ();\n\nwill erase every\
    \ element currently belonging to *names*.\n\n*Changing elements*\n\nIf we want\
    \ to simply change an existing element, we can use the set method:\n\nnames.set(0,\
    \ \"Cilla\");\n\nwill change the first element of the ArrayList to match the String\n\
    \n\"Cilla\". This means that we only require one operation to change an element,\n\
    \nrather than the two that would otherwise be needed (remove an element, insert\n\
    \nits replacement at the corresponding location).\n\n2\n\nIf you check the documentation\
    \ for the Vector class you will see that it has an \n\noverloaded version of remove\
    \ that does this in just one step."
