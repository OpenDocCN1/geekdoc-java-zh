  md: "**Input and output using files**\n\nTaking the case study program as an example,\
    \ it is obvious that only the most\n\nbasic programs operate without receiving\
    \ input from files, and without writing\n\nat least some data to files. However,\
    \ up to now we have not learned how to\n\nachieve this in Java. Thankfully help\
    \ is at hand, as Java provides all manner of\n\nclasses allowing you to read,\
    \ write and otherwise manipulate files. These class-\n\nes live in the package\
    \ java.io, and we will briefly discuss only two such class-\n\nes (FileReader\
    \ and FileWriter), and two wrapper classes which handle\n\nbuffering the reading\
    \ and writing for efficiency.\n\nThe overhead of using the FileReader and FileWriter\
    \ classes directly to\n\ntransfer data can be massive, especially if there is\
    \ a lot of data to access in many\n\nsmall chunks. Think back to the cooking analogy\
    \ near the start of the book –\n\nwhen weighing out 200 g of sugar, it is easier\
    \ and more efficient to open the\n\npacket and transfer the contents onto the\
    \ scales a handful, rather than a granule,\n\nor even a spoonful, at a time.\n\
    \nSimilarly with file reading and writing, it is far more efficient to read and\n\
    \nwrite in a few large chunks (say a line at a time), rather than a large number\
    \ of\n\nsmall chunks (say word by word, or character by character). Java provides\
    \ two\n\nclasses, BufferedReader and BufferedWriter, which take care of reading\n\
    \nand writing data in large chunks, sometimes even without the programmer\n\n\
    knowing. Another handy side effect of using the buffer classes is that the inter-\n\
    \nface is much easier for beginners to learn; the FileReader and FileWriter\n\n\
    classes tend to operate on a character at a time, or with arrays of characters,\
    \ but\n\nthe buffer classes hide this complexity, allowing the programmer to work\n\
    \nentirely with more familiar and less cumbersome Strings. Full details of all\n\
    \nthese classes can, of course, be found in the API documentation.\n\nOne final\
    \ point to mention, which is important to consider whenever you are\n\nperforming\
    \ file input or output in Java, is that just about all the methods can\n\npotentially\
    \ throw exceptions (usually IOException), so a method which calls\n\nfile input\
    \ or output code should contain a try block with a matching catch\n\nblock to\
    \ handle the exception.\n\n*Reading data from a file*\n\nFileReader has several\
    \ constructors, the one we will use takes one argument,\n\na String, containing\
    \ the path to the file that we want to read from:\n\nFileReader file = new FileReader\
    \ (\"c:\\\\path\\\\to\\\\file\");\n\nIn order to make the reading more efficient,\
    \ we pass a FileReader object as\n\nan argument to the BufferedReader constructor:\n\
    \nFileReader file = new FileReader (\"c:\\\\path\\\\to\\\\file\");\n\nBufferedReader\
    \ reader = new BufferedReader (file);\n\nThe two statements can be combined, by\
    \ creating the FileReader object on\n\nthe fly (which is fine in this case, as\
    \ we don’t need to access the object directly\n\nagain):\n\nBufferedReader reader\
    \ = new BufferedReader \n\n(new FileReader (\"c:\\\\path\\\\to\\\\file\") );\n\
    \nUsing a BufferedReader to read data is easy. Internally, the class keeps\n\n\
    track of the current position in the file, and the single method we will discuss,\n\
    \n*Onward!*\n\n313"
