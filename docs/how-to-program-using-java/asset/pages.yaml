  md: "and this would display a welcoming message on the screen:\n\nSystem.out.println\
    \ (\"hello, world!\");\n\nThe punctuation in all these lines so far is important.\
    \ They all end with semi-\n\ncolons, which effectively mark the end of the line.\
    \ Lines can spread over more\n\nthan one line of a program, so the semi-colon\
    \ is important. This, for example, is\n\nstrange but allowed:\n\nSystem.out.println\n\
    \n(\"hello, world!\");\n\nbecause the semi-colon clearly marks the end of the\
    \ statement. This, on the\n\nother hand, is an error:\n\nSystem.out.println (\"\
    hello, world!\")\n\nbecause there is no semi-colon. The Java system would assume\
    \ that the next\n\nline in the program was also part of this line, and all sorts\
    \ of terrible things\n\nwould happen.\n\nIn a way, that’s all there is to it!\
    \ A class definition in Java is simply a collec-\n\ntion of declarations and statements.\
    \ The declarations declare the attributes of\n\nthe class and statements are used\
    \ to implement the behaviours of the methods.\n\nA program is much the same thing,\
    \ of course.\n\nIt is a feature of programming that the syntax of the languages\
    \ used has \n\nto be precise. When writing other languages you are probably used\
    \ to being\n\nallowed some flexibility; you can usually make mistakes and get\
    \ away with it. \n\nI can potato make a mistake in a sentence and you will still\
    \ understand what\n\nI’m saying. I can mispell a word and you can still understand\
    \ this sentence.\n\nProgramming languages don’t allow the programmer as much room\
    \ for\n\nmanoeuvre. So this is fine:\n\nSystem.out.println (\"hello, world!\"\
    );\n\nbut this is an error which would mean that the program would fail to compile:\n\
