  md: "again to reflect this. To make sure that everything really is clear the braces\
    \ \n\nsurrounding each method are aligned; the opening and closing brace in the\n\
    \n*setValue* method are aligned, for example.\n\nNow for an example of poor layout.\
    \ Believe it or not this definition is just\n\nabout identical to the previous\
    \ example; the only difference is in the name of \n\nthe class. The compiler would\
    \ treat it exactly the same and it would behave\n\nidentically if it were used\
    \ in a program.\n\npublic class MangledDuck{private String name;private int age;\n\
    \nprivate double value;public MangledDuck(){}public void display()\n\n{System.out.println(\"\
    The details of the duck are:\");\n\nSystem.out.println(name);System.out.println(age);\n\
    \nSystem.out.println(value);}public void setAge(int newAge)\n\n{age = newAge;}public\
    \ void setValue(double newValue)\n\n{value = newValue;}}\n\nIt is obvious that\
    \ this definition is much harder to understand. There are no con-\n\nvenient blank\
    \ lines to break it up into small chunks and there is no indentation\n\nto help\
    \ with an understanding of the structure. There aren’t even any comments\n\nto\
    \ provide some clues.\n\nAnother point about layout is that all lines in a program\
    \ should be kept \n\nreasonably short. The purpose of this is to make sure that\
    \ the program will fit\n\nneatly onto a printed page. It is customary to make\
    \ sure that no line in a pro-\n\ngram extends longer than 80 characters; the number\
    \ 80 dates from the time\n\nwhen this was the maximum number of characters that\
    \ could be displayed on\n\none line of a terminal screen or printed across a page\
    \ by a line printer. These\n\ndays this practice remains a good one; most experienced\
    \ programmers will\n\nalways make sure that their lines are kept short, and many\
    \ would stop at\n\naround 75 characters to be on the safe side. All the programs\
    \ in this book\n\n(including both these in this section) have been formatted to\
    \ make sure that all\n\nlines fit neatly on the page (sometimes this means that\
    \ the lines are rather short-\n\ner than 75–80 characters).\n\nWhen you write\
    \ your programs always remember that you are not just \n\nwriting them for yourself.\
    \ You are also writing them for other programmers,\n\nand these are programmers\
    \ who may one day have to change your program\n\nwhen you are not around to advise.\
    \ The indentation and layout that you are\n\ngoing to use are of enormous help\
    \ to others reading your program. Often when\n\nstudents ask me to find an error\
    \ in their programs they seem to be amazed\n\nwhen the first thing I do is send\
    \ them away to go through and correct their\n\nindentation; often this alone finds\
    \ the error but even if not it always helps.\n\nAlways write your programs with\
    \ good layout and indentation. Never be\n\ntempted to write your programs with\
    \ no indentation intending to indent it all\n\nproperly once the program works.\
    \ This is simply something that will make\n\nmore work for you and will make the\
    \ job of anyone that helps you a great \n\ndeal more difficult. In many ways it\
    \ is as important that a program is neatly and\n\nconsistently laid out as it\
    \ is that the program works correctly.\n\nYou may well find that the Java system\
    \ that you will be using will lay out\n\nyour code neatly for you as you program;\
    \ consult your *Local Guide* to see if you\n\nhave this facility. If it will do,\
    \ you should check the style that it will follow and\n\nyou should decide if you\
    \ are happy with the style. If you are not, spend some\n\ntime finding out how\
    \ to customise the style to your own preferences.\n\n*Programming (don’t panic!)*\n\
    \n81"
