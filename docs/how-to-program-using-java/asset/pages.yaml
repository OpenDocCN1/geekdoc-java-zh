  md: 'Humans and computers do not speak the same language. Humans communicate


    in spoken language, a very complex system of nouns, verbs, adjectives, and so
    on.


    Computers on the other hand are much simpler. Their “language” has only two


    symbols, 0 and 1. Obviously some translation must take place if humans and


    computers are going to be able to communicate effectively. Something will have


    to happen if a computer is going to understand what a programmer is asking it


    to do.


    A computer program is a description of a way to solve a problem or carry out


    a task; we might call it a procedure for solving a problem. It is written in a
    form


    that humans can use and understand. This chapter introduces you to the


    processes that take place when a computer program expressed in this form is


    translated from this representation into a form that computers can use and


    understand. Both these forms are actually the same program in the same way


    that this book translated into Japanese would still be this book; all that has


    changed is the way it is represented.


    After reading this chapter you should understand what a *compiler* is and


    what the process of *compilation* involves. You should understand how your


    programs will be linked with the Java *system libraries* to produce versions that


    can be executed by your computer. You should know what the *Java Virtual*


    *Machine* is and you should understand that role it plays in executing your


    programs. You should also understand how to compile and run your programs


    in whatever programming environment you are going to use.


    *The mechanics*


    21


    ![](img/05fa4bae6319441a0b86c0179baaedc2_38_0.png)![](img/05fa4bae6319441a0b86c0179baaedc2_38_1.png)


    The previous chapter explained that a computer programming language is


    essentially no more than a way for a human programmer to communicate with


    a computer. Humans find it very hard to express themselves using the 1 and 0'
