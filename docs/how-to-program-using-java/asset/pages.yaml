  md: '*Using this book*


    v


    Chapter 14 – Making things happen. Sometimes


    **p. 178**


    … returns to the basics of Java and describes how to make a program behave in


    different ways in different situations.


    Chapter 15 – Making things happen. Again and again


    **p. 202**


    … extends the previous chapter to show how to make a program repeat an


    operation over and over again.


    Chapter 16 – More methods


    **p. 221**


    … shows how to use the techniques from the preceding two chapters in imple-


    mentations of object types.


    Chapter 17 – Collections


    **p. 236**


    … concludes the description of features of Java by showing how programs can


    be written to handle large collections of data rather than just single values.


    Chapter 18 – A case study


    **p. 261**


    … ties the chapters together by describing and illustrating the process of devel-


    oping a program from specification to final implementation.


    Chapter 19 – More on testing


    **p. 294**


    … reminds us that all programs should be tested and that more complicated


    programs require more thorough testing still.


    Chapter 20 – Onward!


    **p. 309**


    … rounds off the book with brief descriptions of a few of the more advanced


    Java features.


    If you’re approaching programming as a complete novice you should aim to


    work through these chapters in this order. Don’t be tempted to skip straight to


    the chapters with Java in! It’s extremely important that you understand what


    you’re trying to achieve and the best ways of achieving that before you go any-


    where near any programs. This might seem odd, but please bear with us!


    If you’ve already programmed in some other language (particularly some-


    thing like Pascal or C, or definitely if you’ve met C) and just want a flavour


    of Java you’re probably safe to skip on to Chapter 6 or 7. It would still be a
    good


    plan to skim through the earlier chapters, though.


    At the end of the book you’ll find a quick Java Reference, a Glossary and an


    Index. This is where to look when you realise that you need that little bit of


    information but can’t remember where it was.


    **Understanding what you read**


    There are some conventions that you need to keep in mind as you read.


    In the text, anything in this font is a Java statement or name. Anything in


    this font is not.


    All programs and classes also appear in this font. Like this:


    /\*


    Duck.java


    A simple Duck class.


    AMJ


    22nd January 2003


    \*/


    public class Duck


    {


    private String name;'
