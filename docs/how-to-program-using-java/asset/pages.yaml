  md: "98\n\n*How to program using Java*\n\n**Constants**\n\nVariables by their very\
    \ definition vary. Sometimes a program needs something\n\nthat behaves in the\
    \ same way as a variable but that doesn’t vary; this is unsur-\n\nprisingly called\
    \ a *constant*. Constants are declared in exactly the same way as\n\nvariables\
    \ except that the word final is added to the start of the line, and that\n\nthe\
    \ assignment of the value may only be performed once at most. So, to declare\n\
    \na final variable of type int:\n\nfinal int MAXTURNS = 10;\n\nIt is important\
    \ to note here that we can declare final objects, but that these \n\nmay still\
    \ be changed. This sounds paradoxical, but is quite simple to illustrate. \n\n\
    If a class provides methods to alter its attributes (the so-called *set* methods,\
    \ or\n\n*mutators*), then, even though an object is declared final, it can still\
    \ be altered\n\nby calling one of these methods. However, declaring an object\
    \ to be final does\n\nmean that it can only be initialised once, so an object\
    \ variable can only refer to\n\na single object for the duration of the program.\n\
    \nThe same guidelines apply for choosing identifiers for constants. Many pro-\n\
    \ngrammers also choose to give them an identifier that clearly shows that they\
    \ are\n\nnot allowed to change. The convention that is often used (and that is\
    \ used in the\n\nprograms in this book) is simply to write the name in CAPITALS.\
    \ Capitalising\n\nthe initial letter is also a possibility, but this can lead\
    \ to clashes with existing\n\nbuilt-in Java classes if done without careful thought.\n\
    \nConstants have two main uses. Sometimes they are used just for readability.\n\
    \nSuppose a program made a lot of use of the mathematical constant *PI*. A pro-\n\
    \ngrammer could write:\n\nfinal double PI = 3.1415;\n\nat the start of the program\
    \ and then later use the constant in expressions \n\nsuch as:\n\narea = PI \\\
    * radius \\* radius;\n\ncircumference = 2 \\* PI \\* radius;\n\nThis makes the\
    \ program much more readable. It also saves typing if the con-\n\nstant value\
    \ is used in many places in the program and ensures that the value\n\nused is\
    \ always precisely the same. It should be obvious that the statements\n\nabove\
    \ are far preferable to:\n\narea = 3.1415 \\* radius \\* radius;\n\ncircumference\
    \ = 2 \\* 3.1415 \\* radius;\n\nand that this a fine way to avoid errors or inaccuracies\
    \ that might be caused by:\n\narea = 3.14 \\* radius \\* radius;\n\ncircumference\
    \ = 2 \\* 3.1415 \\* radius;\n\nAnother use of constants is when a particular\
    \ value is used in many places in\n\na program and might need to be changed later.\
    \ The value will never be changed\n\nwhile the program is running but it might\
    \ change later for some other reason.\n\nExamples might be the number of games\
    \ in a football season, the number of\n\nsome item packed into a box, or the number\
    \ of attempts allowed in a game. It’s\n\nfar easier to declare that value as a\
    \ constant; if it changes you only have to\n\nchange it in one place."
