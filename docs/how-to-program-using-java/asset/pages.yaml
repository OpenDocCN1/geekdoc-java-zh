  md: "*More on testing*\n\n297\n\nWhen a user is presented with a prompt to enter\
    \ a value into a program there\n\nis very little that limits what they can provide.\
    \ Many failures in programs are\n\ncaused by users managing to provide completely\
    \ unforeseen input values \n\nand so managing to take completely unexpected routes\
    \ through the program. \n\nIt is absolutely vital that every possible route through\
    \ a program is thoroughly\n\ntested, even if it seems very unlikely that it will\
    \ ever be used.\n\nFirst, each possibility in a conditional statement must be\
    \ tested. For example,\n\nin a program including this conditional statement:\n\
    \nint aNumber;\n\nif (aNumber > 1 && aNumber < 10) {\n\n// statements\n\n}\n\n\
    else if (aNumber >= 10 && aNumber < 20) {\n\n// statements\n\n}\n\nelse {\n\n\
    // statements\n\n}\n\nthe test plan must include values of *aNumber* that will\
    \ cause each of the three\n\npossible sets of statements to be executed. These\
    \ will probably already be\n\nboundary values in the test plan, but more values\
    \ must be included if not.\n\nWhen testing a loop the crucial thing to consider\
    \ is the initial value of the \n\ncondition controlling the loop. Here:\n\nint\
    \ aNumber;\n\nwhile (aNumber < 10) {\n\n// statements\n\n}\n\nit is important\
    \ to test the program with values that will make the condition true\n\nand so\
    \ cause the loop to execute and also values that will make the condition\n\nfalse\
    \ and so mean that the loop is never executed.\n\nIt should be possible to represent\
    \ each route through a program by a set of\n\ninput values. If it is not possible\
    \ to specify a set of values that will cause a\n\ncertain route to be followed\
    \ this rather begs the question of why the route is\n\nthere! This list of values\
    \ can be quite long, even for quite a small section of a\n\nprogram:\n\nint grade;\n\
    \nchar answer;\n\ndo {\n\nSystem.out.print (\"Enter the grade : \");\n\ngrade\
    \ = Console.readInt ();\n\nif (grade > 69) {\n\nSystem.out.println (grade + \"\
    \ is an A\");\n\n}\n\nelse if (grade > 59) {\n\nSystem.out.println (grade + \"\
    \ is a B\");\n\n}"
