  md: "first page inside the front cover). If you give someone the values for these\n\
    \nattributes for a particular book they can always find the precise book you mean;\n\
    \nthe values of these attributes uniquely determine and describe the object.\n\
    \nYou are an object too. You have attributes that describe yourself; you have\
    \ a\n\nname, an address, a birthday, and many more. You are an instance of the\
    \ object\n\ntype “Person”. So are all other people, but they have different values\
    \ for their\n\nattributes. It is highly unlikely that there is another person\
    \ who has the same\n\nset of values for all your attributes, or at least that\
    \ we couldn’t think of a set of\n\nattributes that would distinguish you from\
    \ all other people.\n\nTo summarise:\n\n42\n\n*How to program using Java*\n\n\
    **Attributes of a book**\n\n**Attributes of a person**\n\nTitle\n\nName\n\nAuthor\n\
    \nDate of birth\n\nISBN number\n\nAddress\n\nYou can probably think of several\
    \ more possible attributes to add to each list. It\n\nis important that each attribute\
    \ has one and only one value for each object\n\ninstance. People do not have two\
    \ names⁵^ and books don’t have two titles. No\n\nattribute of an object instance\
    \ should be allowed to have more than one value.\n\nAs well as a name each of\
    \ these attributes has a particular *type*. There is a\n\nparticular type of value\
    \ that each attribute can take; a book’s title is a string of\n\ncharacters, an\
    \ address is a longer string of characters, a date of birth is a date,\n\nand\
    \ so on. Each attribute has exactly one value and, in most programming\n\nlanguages,\
    \ that value always has the same type for each object of the type.\n\nProgramming\
    \ languages support a range of possible types of this sort; the\n\nnames used\
    \ are slightly different in different languages but the basic types are\n\nthe\
    \ same. Common ones are:\n\nInteger\n\nWhole numbers, positive or negative – in\
    \ C and\n\nJava int.\n\nFloating-point numbers\n\nNumbers with decimal parts,\
    \ again positive or negative – in\n\nC and Java double.\n\nCharacter\n\nSingle\
    \ characters, generally anything found on a standard \n\nkeyboard – in C and Java\
    \ char.\n\nString\n\nSequences of characters, normally spelling words or \n\n\
    similarly meaningful sequences – in C string, and in Java\n\nString.\n\nBoolean\n\
    \nTrue or false values, named after their use in Boolean logic – in\n\nC bool,\
    \ and in Java boolean.\n\nWhenever an attribute is identified it should also be\
    \ possible to determine the\n\nattribute’s type.\n\nYou can also see here that\
    \ different programming languages will (somewhat\n\nannoyingly, it must be said)\
    \ use slightly different names for the same types. \n\n5\n\nName here means, of\
    \ course, forenames and surname (or family name) together."
