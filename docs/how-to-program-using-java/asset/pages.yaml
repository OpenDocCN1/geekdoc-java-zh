    messages here since we don’t know any details of how the programs using the


    method might be written; it is quite possible that the programs will trap the


    error before calling the method. The simplest solution, and the one that most


    programmers would adopt when faced with problems like this, is to return a


    value that is clearly an error. The program using the method can examine the


    value returned if it needs to detect the error. Here an average of 1 is clearly
    an


    error, so we will return that.⁵^ The complete method now becomes:


    public double getBowlingAverage ()


    {


    if (wickets == 0) {


    return -1.0;


    }


    else {


    return ( (double) runsConceded) / wickets;


    }


    }


