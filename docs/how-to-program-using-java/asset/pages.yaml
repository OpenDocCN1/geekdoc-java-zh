    \ the contents\n\nof that String to the file:\n\nwriter.write (\"testing 1 2 3\"\
    );\n\nOne limitation of this method compared with the more familiar\n\nSystem.out.print\
    \ methods is that you should pass a String and only a\n\nString as an argument.\
    \ There is another version of this method which takes\n\nan int, but this does\
    \ something completely different, and can cause all manner\n\nof confusion. Thankfully,\
    \ there is a way to force the compiler and JVM to treat\n\nsomething of a different\
    \ type as if they were a String; since we can append\n\nany of these values to\
    \ a String, we simply append them to an empty String:\n\nwriter.write (\"\" +\
    \ 4); // writes the String '4' to the file\n\nIt is probably also worth remembering\
    \ that the write method will write exact-\n\nly what you tell it to, so if you\
    \ want to write a line of text, you’ll need to make\n\nsure you also write the\
    \ ‘\\\\n’ (*newline*) character at the end of the line!¹\n\nThe second method\
    \ we need to know about is the close method, for the same\n\nreasons outlined\
    \ earlier for the reader class. The syntax is exactly the same:\n\nwriter.close\
    \ (); // close the output stream\n\nHowever, this is not the whole story. As we\
    \ are buffering the data to output, we\n\nneed to ensure that it has all been\
    \ written to the file before we close the output\n\nstream. There is a third method,\
    \ flush, which forces a transfer of the buffer’s\n\ncontents to the file (known\
    \ as flushing the buffer). This is frequently found in\n\nfile writing code:\n\
    \nwriter.flush (); // write every last byte\n\nwriter.close (); // close file\n\
    \nSo, let’s look at some example code for file writing. Then we’ll revisit the\
    \ case\n\nstudy to incorporate what we’ve learned into a real program.\n\nimport\
    \ java.io.\\*;\n\n...\n\ntry {\n\nBufferedWriter writer = new BufferedWriter \n\
    \n(new FileWriter (\"testfile2.txt\") );\n\nwriter.write (\"Oh let the sun beat\
    \ down upon my face\\\\n”);\n\n// any other output we wish\n\nwriter.flush ();\
    \ // flush the buffer\n\n*Onward!*\n\n315\n\n1\n\nIn fact, if we instantiated\
    \ a PrintWriter object (from package java.io), taking \n\nthis BufferedWriter\
    \ object as an argument, we would have access to the same print\n\nand println\
    \ methods as the System.out class. This means that we could use\n\nprintWriter.println\
    \ (line);, rather than writer.write (line  \"\\\\n\");\n\nTry it for yourself."
