  md: "92\n\n*How to program using Java*\n\na personal thing and you will probably\
    \ develop your own style for doing this\n\nas you gain more experience.\n\nOur\
    \ style is to use a single word if possible or otherwise to combine two or\n\n\
    three words and to capitalise the first letters of any words after the first (hence\n\
    \n*numDucks* in the example). To save typing and to keep the program short and\n\
    \nreadable we abbreviate where the abbreviation is obvious; so number can\n\n\
    become “num”, value becomes “val” and so on. That’s the convention we will\n\n\
    use in the programs in the rest of this book. You’re free to copy it, to follow\
    \ your\n\nown convention, or to follow some other system that you might be required\
    \ \n\nto use. Whatever you do, think about the identifiers you choose and use\
    \ a \n\nconsistent system for choosing them.\n\n**Declaring variables**\n\nNow\
    \ it’s time for a more detailed look at variable declarations. The basic form\n\
    \nof a declaration is:\n\n*type* *identifier**;*\n\nThe declaration specifies\
    \ the type of the variable (the type of value that it can\n\nstore) and states\
    \ its identifier (its name). The line finishes with a semi-colon. If\n\nthe variable\
    \ is to be given an initial value the declaration can be extended:\n\n*type* *identifier*\
    \ *initial value**;*\n\nHere are some examples with comments to explain them:\n\
    \nint grade; \n\n// an integer to hold a grade, no initial value\n\nint grade\
    \ = 0; // an integer to hold a grade with initial value 0\n\nchar answer;\n\n\
    // an answer to something – one character\n\nString name;\n\n// a string to hold\
    \ a name\n\nString name = \"Gumboot\"; // as above, with an initial value\n\n\
    boolean finished; // to hold \"true\" if finished\n\nboolean finished = false;\
    \ // as above, but with an initial value\n\nIf more than one variable of a particular\
    \ type is to be declared in a program,\n\nthey can both be named on the same line:\n\
    \nint aNumber, anotherNumber;\n\nThis version is used especially when the two\
    \ variables have closely connected\n\npurposes. It is identical in meaning to\
    \ two separate declarations:\n\nint aNumber;\n\nint anotherNumber;\n\nThe choice\
    \ between the two is largely a matter of the programmer’s style and\n\npreference.\n\
    \n**Values and variables**\n\nVariables aren’t much use if a programmer can’t\
    \ give them values. Variables \n\nare assigned values in an *assignment statement*.\
    \ The general form of such a\n\nstatement is:\n\n*identifier* *value*;\n\nThe\
    \ left-hand side of the  sign is the name of the variable that we want to\n\n\
    assign a value to and the right-hand side is the value. The effect is that the\
    \ value\n\nof the variable whose identifier is on the left becomes equal to the\
    \ value that is"
