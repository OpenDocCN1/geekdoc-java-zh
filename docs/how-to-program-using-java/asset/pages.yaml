    before adding these, there is one more method to include.\n\n**The constructor**\n\
    \nThere is one last method to add. We have seen that to declare an object the\
    \ pro-\n\ngrammer specifies the type of the object to be declared, provides an\
    \ identifier,\n\nand calls the constructor:\n\n*class name* *identifier* * new*\
    \ *constructor**();*\n\nThe constructor is the special method that takes care\
    \ of creating an instance\n\nof the class, an object. The name of the class and\
    \ the constructor are, obviously,\n\nthe same. If the constructor has been defined\
    \ to take parameters these are also\n\nprovided in the brackets. The name of the\
    \ constructor should be written in\n\nexactly the same way as the name of the\
    \ class given at the top of the file; this\n\nincludes the case of the letters.\
    \ Any mistake will mean that the method is not\n\nrecognised as the constructor.\n\
    \nHappily most of what the constructor needs to do is taken care of auto-\n\n\
    matically. All the allocation of memory happens behind the scenes and the \n\n\
    programmer does not need to worry about it. The constructor may also assign\n\n\
    default values for some of the attributes; comments should be added to the\n\n\
