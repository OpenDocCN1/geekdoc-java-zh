  md: "242\n\n*How to program using Java*\n\nEach element of the array is an object,\
    \ so we can use any available methods\n\nof the class on an element. So to find\
    \ out the details of the duck in the first \n\nelement:\n\nSystem.out.println\
    \ (theDucks\\[0\\].toString () );\n\nor the last:\n\nSystem.out.println (theDucks\\\
    [2\\].toString () );\n\nor even:\n\nSystem.out.println (theDucks\\[theDucks.length\
    \ – 1\\].toString () );\n\nwhich would work no matter how many elements there\
    \ were in the array. \n\nIn these cases, and any others involving objects, it\
    \ is possible to omit the call to\n\nthe* toString* method, as the default version\
    \ of this is called automatically\n\ninside a call to System.out.print or println.\n\
    \nFinally, a loop that would print out the details of all the ducks would \n\n\
    probably be useful:\n\nfor (int i = 0; i < theDucks.length; i ++) {\n\nSystem.out.println\
    \ (theDucks\\[i\\]);\n\n}\n\nAs we will see, processing an array using a loop\
    \ in this way is a very common\n\nprogramming task indeed.\n\n*Array checklist*\n\
    \nAs a last word on arrays (for now at least), some things to remember when\n\n\
    using arrays:\n\n1\\. All elements in an array must be of the same type. The type\
    \ can be an object\n\ntype.\n\n2\\. The array must be declared with the square\
    \ bracket notation.\n\n3\\. The array must be initialised with its length in square\
    \ brackets.\n\n4\\. Array elements are indexed from 0 to “*array.length**1*”.\n\
    \n5\\. Individual elements are accessed with the notation “*array\\[index\\]*”.\n\
    \nArrays are a fine first collection to take a look at. Most, if not all, things\
    \ that\n\nwe might want to do with collections can be done with arrays, but we\
    \ would\n\nsoon find that some were rather complicated. Operations on collections\
    \ are very\n\ncommon and so most programming languages provide more complex types\
    \ to\n\nstore them; the time has come to look at one provided by Java.\n\n**Variable\
    \ length collections**\n\nThe description of arrays has hopefully given you some\
    \ idea of the sort of \n\noperations that are often carried out on collections.\
    \ A complete collection can \n\nbe displayed, searched, or sorted, for example,\
    \ and this sort of operation is \n\nreasonably easy to program using an array.\
    \ Things get more complicated with\n\nan array when the collection has to be manipulated\
    \ – when new elements have\n\nto be added or deleted. This is possible with an\
    \ array, but it can be rather com-\n\nplicated and error-prone. At the same time\
    \ these operations are quite common,\n\nso some sort of structure that automatically\
    \ supports them is often provided."
