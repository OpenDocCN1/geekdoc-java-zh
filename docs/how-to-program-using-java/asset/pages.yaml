  md: "*Making things happen. Again and again*\n\n203\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_220_0.png)\n\
    \nConditional statements control the order in which the other statements in \n\
    \na program are executed. However, even with this level of control the fact\n\n\
    remains that the overall flow of the program is still from the top to the bottom;\n\
    \nthere are usually several routes to the end of the program, but the flow is\n\
    \nalways in the same prevailing direction. Once a statement has been executed\
    \ it\n\ncan never be executed again. It is not possible to go backwards.\n\nThere\
    \ is a second type of statement that can control the order of execution of\n\n\
    a Java program. Program *loops* allow statements to be executed a certain num-\n\
    \nber of times, or while some Boolean condition is true, or until some Boolean\n\
    \ncondition has become false. This chapter explains the different kinds of loops\n\
    \nthat are available and describes how to use loops in your classes and programs.\n\
    \nAfter reading this chapter you should be able to write methods and programs\n\
    \nthat include loops. You should understand the different kinds of loops available\
    \ in\n\nJava and you should be able to decide which to use to solve a particular\
    \ problem.\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_220_1.png)\n\nLet’s illustrate\
    \ this new idea with an example. The previous chapter explained\n\nhow to validate\
    \ the values that users supply to your programs. This is effective\n\nas far as\
    \ it goes, but the dialogue that has resulted is hardly very friendly. The\n\n\
    end result is that the users are simply told that they have made an error and\
    \ the\n\nprogram then finishes; if the user wants to try again with another value\
    \ (or set\n\nof values) the program has to be executed again and all the values\
    \ have to be\n\nentered again. This would be especially annoying for a user who\
    \ had entered\n\nseveral values correctly only to make a small error with a later\
    \ value.\n\nIn these situations it would be far preferable to have a more complex\
    \ \n\ndialogue where the user is still informed of the error but is then invited\
    \ to \n\nre-enter an acceptable value. This dialogue might resemble:\n\n*Enter\
    \ a number between 1 and 10: ****20***\n\n*Error: Number out of range. Try again:\
    \ ****5***\n\n*Thank you. The number you entered was 5.*"
