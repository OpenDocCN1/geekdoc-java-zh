    *How to program using Java*


    Author : AMJ


    Date : 13th December 2002


    \*/


    public class Sign


    {


    // Single Attribute – What to Display


    private String message;


    // Methods


    public Sign ()


    {


    message = "";


    }


    public void setMessage (String newMessage)


    {


    message = newMessage;


    }


    public void display ()


    {


    System.out.println (message);


    }


    }


    This is just a definition. You could type it in and Java would happily produce


    a .class file, but it wouldn’t actually do anything. A main method is needed.


    We’ll add a main method into the class; this is quite a common way of provid-


    ing a basic program to check that all the parts of the class work as expected.


    Such programs are sometimes referred to as *driver* programs.


    The main method will have to do three things:


    1\. Create Bruce’s sign (as an instance of the *Sign* class).


    2\. Set the sign’s message to “hello, world”.


    3\. Display the message.


    These steps conveniently correspond to the three methods. The first is the con-


    structor, then *setMessage*, and finally *display*. There’s more about using


    (properly called “calling”) methods later on in the book, but here’s a quick call


    to the constructor for this class:


    Sign brucesSign = new Sign ();


    We know that this constructor sets the sign’s message to an empty string. The


    next step is to use setMessage to set it to something more useful. The syntax


    for calling a method on an object is:


    *object name*.*method name* (*parameters*);


    This method has one parameter, so this will do the job:


    brucesSign.setMessage ("hello, world");


    The call to the method to display the message is similar:


    brucesSign.display ();'
