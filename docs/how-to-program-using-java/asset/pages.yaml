    \ now be able to write quite complex\n\nJava programs making use of many of the\
    \ features available in the current ver-\n\nsions of Java. You should be able\
    \ to analyse a problem and then go on to design\n\nand develop the classes and\
    \ programs that will form the basis of a solution.\n\nOf course, no solution is\
    \ of the slightest use unless it works correctly. Many,\n\nmany pages ago, Chapter\
    \ 10 explained the importance of testing and showed\n\nyou how to write a *test\
    \ plan* for each of your programs. Hopefully you’ve been\n\ndoing this as you’ve\
    \ written all your programs since then! There is truly no\n\npoint whatsoever\
    \ in spending time on developing a program unless you also\n\ntake the time to\
    \ test it thoroughly. An untested program is a worthless program\n\nand is potentially\
    \ a very dangerous program.\n\nSince Chapter 10, the programs you have been working\
    \ on have become\n\nlonger and more and more complicated. This chapter briefly\
    \ explains some\n\nideas on how to test larger programs. The processes for testing\
    \ larger programs\n\nare much the same as in Chapter 10, so you might want to\
    \ go back and quickly\n\nread through it again. Larger programs bring with them\
    \ the need for a very\n\nstructured approach to testing; unstructured and haphazard\
    \ testing can be\n\nworse than none at all.\n\nEven with all this brave talk of\
    \ testing it is important to remember that it is\n\nnever possible to prove that\
    \ a program works correctly in every case. Testing\n\ncan only build up confidence\
    \ in a program; it can never provide complete con-\n\nfidence. It is rarely, if\
    \ ever, possible to test a program with all the input values\n\nthat it will have\
    \ to process. Nevertheless, the ideas in this chapter should \n\nmean that you\
    \ are able to have a reasonably high level of confidence in your\n\nprograms.\n\
    \nAfter reading this chapter you should be able to systematically test large \n\
    \nprograms and classes. You should be able to write a driver program for a class,\n\
    \nand you should be able to use it to test a class. You should understand the\
    \ \n\ndifference between *black box* and* white box* testing, and you should understand\n\
    \nhow to decide which to use for a particular test. You should also be able to\
