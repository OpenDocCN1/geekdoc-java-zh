  md: 'In the modern world computer programs are all around us. They are sometimes


    hidden away in the most unexpected and unlikely places. All of these com-


    puter programs have at some time been written by a human programmer using


    the processes and skills that you are about to learn. This programmer has gone


    through the stages that you are going to learn about in this book and has


    probably used a programming language not unlike Java. At some point in the


    past this programmer learned to write programs. Before you start learning to


    write programs it is essential that you know what a program is.


    After reading this chapter you should understand what a computer program


    is, and you should understand what programming is all about. You should be


    able to identify the various programs that run on the computers you use and


    you should be able to make a reasonable guess at how they were written. You


    should understand something about Java and why it is a popular programming


    language. You should know about some of the people who have contributed to


    the development of programming and to other currently popular programming


    languages and to Java in particular.


    12


    *How to program using Java*


    ![](img/05fa4bae6319441a0b86c0179baaedc2_29_0.png)


    Computer* programs* are everywhere. I am using a computer program to write


    these words. These words will be processed by many more computer programs


    before you read them; an electronic mail program will be used to send them to


    an editor, a backup and compression program will be used to keep a safe copy,


    and the typesetter will use yet more programs. It is entirely likely that a com-


    puter program was involved when you bought this book; there would have


    been one in the till when you paid, you may have used a computer-based cata-


    logue to find the book you wanted, and you may have paid with a credit card


    that was authorised by a computer. All these things rely on computer programs,


    and all these programs have been developed by human computer *programmers*.


    ![](img/05fa4bae6319441a0b86c0179baaedc2_29_1.png)'
