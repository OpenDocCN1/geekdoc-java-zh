  md: "*Collections*\n\n237\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_254_0.png)\n\
    \nBy now you should understand what a variable is, how you can use it, and\n\n\
    what it is used for. Variables are very good at what they do, but they can only\n\
    \nstore a single value. What if you need to process and store two integers? More\n\
    \noften than not you’ll use two integer variables. How about 10 variables, or\
    \ 100?\n\nBefore long your program will become unwieldy, repetitive, and extremely\n\
    \nlarge. This is a bad thing and so a neater mechanism is required. It is possible\n\
    \nto define variables that can store collections of values.\n\nJava has support\
    \ for many different ways of storing collections of similar\n\ndata, and this\
    \ chapter introduces two of them – arrays and array lists. Array\n\nlists are\
    \ more powerful and flexible than arrays, but initially at least, you can\n\n\
    treat them as virtually the same thing.\n\nBy the time you complete this chapter,\
    \ you should be able to write programs\n\nthat manipulate collections of data\
    \ rather than many individual variables. You\n\nshould also be capable of identifying\
    \ where to use arrays, and where to use\n\narray lists, and should understand\
    \ the fundamental differences between \n\nthe two.\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_254_1.png)\n\
    \nJava supports many kinds of collection. We’ll look at just two in this chapter.\n\
    \nThe first is the *array*. This is in a sense the simplest collection, and also\
    \ the least\n\nsophisticated. It’s a good place to start because you’ll find something\
    \ that looks\n\nand works very much like a Java array in almost all programming\
    \ languages.\n\nAfter arrays, we’ll look at another type of collection, the *list*.\
    \ Finally, we will\n\nlook at a particular type of list provided by Java – the\
    \ ArrayList. This is rather\n\nmore sophisticated, mostly in terms of the facilities\
    \ that Java provides to \n\nhandle it. It is, however, specific to Java although\
    \ you will find similar things \n\nin other languages (*vectors* in C being an\
    \ obvious example). But first, \n\narrays."
