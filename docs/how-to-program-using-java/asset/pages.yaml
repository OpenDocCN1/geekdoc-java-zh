  md: "*Programming (don’t panic!)*\n\n77\n\nThe first golden rule is:\n\n*Work on\
    \ one part of a program at a time. Get it right and then go on to the next*\n\n\
    *one. Never work on many parts of a program at once!*\n\nAs you learn to program\
    \ you will probably get the chance to see some experi-\n\nenced programmers at\
    \ work. One thing that you will notice is that they have to\n\ndeal with many\
    \ fewer errors from the compiler than you seem to. This is only\n\nnatural; you\
    \ are bound to make more mistakes as you learn. At the same time,\n\nthough, the\
    \ experienced programmers are doing some things that will make\n\nsure that they\
    \ have as few errors as possible to find and correct.\n\nAn experienced programmer\
    \ will compile the program many times before it\n\nis complete. Sometimes this\
    \ will just be to check that the syntax of the program\n\nso far is correct, and\
    \ other times this will be to quickly test some new function.\n\nAn experienced\
    \ programmer will never, ever, type in a complete program and\n\nthen start to\
    \ force it to compile. If you choose to adopt an approach like that you\n\nhave\
    \ made a very big mistake; you have chosen the best way to make sure that\n\n\
    you waste time and get practice in correcting as many errors as possible. It is\
    \ in\n\nthe nature of programming that a simple error at the top of a program\
    \ file\n\n(something as insignificant as a single semi-colon) can cause errors\
    \ throughout\n\nthe program; remember the precision that we saw in the small amount\
    \ of \n\nJava in the last chapter. If the program is several hundred lines long\
    \ this will be\n\nseveral hundred errors, but if the program is only ten lines\
    \ long there will be far\n\nfewer. It is always best to find such errors in very\
    \ small programs, before their\n\neffects become so big as to obscure the original\
    \ cause. For one thing there are\n\nmany fewer places for the error to hide!\n\
    \nYou will come to need to compile your program just to check the syntax less\n\
    \nand less as you gain more experience. As you are just starting out you should\n\
    \nremember to compile your program, if only just to test the syntax, every time\n\
    \nyou add around twenty lines to it.\n\nThe second golden rule is:\n\n*If you\
    \ have added twenty lines to your program, finish the part you are *\n\n*working\
    \ on, compile it and check that your syntax is correct. Fix any errors before*\n\
    \n*you carry on.*\n\n**Style**\n\nA particular aspect of programming is a programmer’s\
    \ style. Every program-\n\nmer has a personal style in writing programs, something\
    \ that is probably\n\nunique to each individual. It’s much the same thing as handwriting;\
    \ you can\n\nprobably recognise your own handwriting even if you wrote something\
    \ many\n\nyears ago. A programmer can probably recognise a program that they wrote\n\
    \nmany years ago.\n\nAny programmer would hope to be able to take a program that\
    \ they had\n\nwritten many years previously and make changes to it. Many programs\
    \ remain\n\nin use for a very long time and changes often have to be made many\
    \ years \n\nafter the program was first written. Of course sometimes the original\
    \ program-\n\nmer will not be available to make the changes. In this case a different\
    \ programmer\n\nmust be able to take the program, quickly understand it and then\
    \ make \n\nthe required changes. This is much more complicated to achieve if the\
    \ program \n\nis written in a poor style. Poor style can make even the most useful\
    \ program"
