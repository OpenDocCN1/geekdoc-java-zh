    \ appears between  and  in these examples is a description\n\nof what is required\
    \ in the program. Examples presented like this are not \n\nvalid Java!\n\nFinally,\
    \ sometimes there are things that need to be laid out in a way that looks\n\n\
    like a program, but isn’t a program. This appears in the same font as a program,\n\
    \nbut in *italics*, like this:\n\n*IF the value of *\"*sold to*\"* is blank THEN*\n\
    \n*Set the value of *\"*sold to*\"* to the Reserve object*\n\n*OTHERWISE*\n\n\
    *Display an error message – the Duck is already sold*\n\n*END IF*\n\nThis is not\
    \ valid Java.\n\nThere are many definitions in the book. Words that are defined\
    \ in the\n\nGlossary at the end appear *like this* in the text.\n\n**A note on\
    \ programming style**\n\nYou will learn that programming style is an important\
    \ element of writing a\n\nprogram. Style refers to the way in which a programmer\
    \ lays out a program,\n\nwhat names are chosen for various things in the program,\
    \ and what else might\n\nbe added. Programming style is a very individual thing,\
    \ and develops in any\n\nprogrammer over many years; it’s very much like handwriting.\n\
    \nThe programs and examples in this book were written by two people. We\n\neach\
    \ have rather different programming styles, so we’ve negotiated and agreed\n\n\
    to adopt a “house style”. You cannot imagine the bloodshed. We think that the\n\
    \nstyle we have finally agreed to adopt is a reasonable compromise and that it\n\
    \nshould be reasonably clear.\n\nDevelop your own style as you learn to program.\
    \ Copy ours for the moment\n\nif you want to, but if you find things that you\
    \ don’t like don’t follow them. \n\nJust be consistent."
