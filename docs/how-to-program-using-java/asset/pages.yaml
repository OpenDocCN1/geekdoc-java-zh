  md: 'There is nothing particularly wrong with this model.⁷^ It stores the new data


    well enough and the methods could be extended to record which book had


    been returned.


    An alternative approach involves the definition of a *Borrowing* object type.


    This is an object that does not correspond with a physical object in the real


    world but with an event. This is quite common. This object type would have


    two attributes, the book borrowed and the date the book is due for return. The


    *Borrower* object type would simply have as attributes four of these objects.


    A final alternative building on this second idea is worth a mention. It would


    be possible (and this is probably the neatest solution of the three) to define
    an


    object type called *Set of Borrowings*. As the name suggests this would be


