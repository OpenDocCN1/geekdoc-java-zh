  md: '*Programming (don’t panic!)*


    75


    ![](img/05fa4bae6319441a0b86c0179baaedc2_92_0.png)


    The time has come when you are almost ready to start using Java to write some


    programs. Before you do, though, you need to understand something about the


    process of programming. Programming is a highly structured process; some


    might even call it a discipline. Good programming requires that the program-


    mer adopt a sensible, structured, and measured approach. Above all it requires


    that the programmer doesn’t panic!


    After reading this chapter you should understand why a structured approach


    is essential when writing programs. You should appreciate the importance of


    always applying good consistent style and layout when you come to write your


    own programs. You will have met the five golden rules of good programming


    practice and style. Finally, after a long wait, you will also have seen your first


    complete Java program that actually does something.


    ![](img/05fa4bae6319441a0b86c0179baaedc2_92_1.png)


    Suppose that you were about to build a new house in the middle of a large


    empty field. This is one strategy that you might use. You could make a list of
    all


    the things that you would need; you would include bricks, cement, wood,


    paint, windows, and so on. Then you would buy them and arrange them in a


    huge random pile in the middle of the field. Over the next few days you would


    poke around at the pile and sort them out and arrange them into a house.


    This strategy might just work but many things might go wrong. You might


    put the bricks on top of the windows and break them, or you might lose the


    paint under a large pile of wood. The risks of disaster are so great that in prac-


    tice you wouldn’t seriously consider using an approach like this.


    Suppose that your car was broken and you took it to the garage for repairs.


    You would expect the mechanic to listen to your description of the fault and


    then spend some time diagnosing what exactly was wrong. When the fault had


    been identified you would expect a quick and easy repair. You would certainly


    not expect the mechanic to spend time randomly replacing parts of your car'
