  md: '*To the Teacher*


    xi


    *more ambitious courses.*^(*2*)^()*My hope is that after reading this book, and
    after following*


    *your course, a student would be able to write some reasonably complex Java programs*


    *and make sensible use of one of the many other Java books that are available*.


    *Now let me explain why this book is like this. I have taught programming for
    many*


    *years in what is probably one of the most respected university computing departments*


    *in the UK. Every year I have some successes, and every year there are failures.
    I see stu-*


    *dents struggle with this topic; they are struggling with something that lies
    at the very*


    *heart of our discipline. I often see students suffer as they attempt to come
    to terms with*


    *programming; often I have seen them drop out of their degree simply to avoid
    more*


    *programming. I have certainly seen them carefully choosing course options in
    future*


    *years to avoid anything that resembles programming.*^(*3*)^()*Your students might
    be differ-*


    *ent, but somehow I doubt it (and if you think they are I respectfully recommend
    a*


    *second, closer, look). This sad state of affairs just cannot be right*.


    *One aspect of this problem (or at least one issue that contributes to the problem)
    is*


    *the nature of the programming textbooks available. These are often weighty tomes*


    *indeed, and many run to well over 1000 pages. You know the ones I mean. Most
    con-*


    *tain far more than could ever be learned effectively in a single course that
    is, after all,*


    *only one part of what a student is expected to study during the year. These books
    (there*


    *are a few honourable exceptions, of course) simply do not meet the needs of our
    students*.


    *There was one last thing that I had to do before starting on the Java book. I
    had to*


    *learn some Java. Oddly enough, I did not seek out a Java programming course.
    I did not*


    *sit in a room with 200 or more other people trying to learn Java. No. I found
    someone*


    *who knew some Java (so a welcome to Graham!), I got him to tell me the basics,
    and then*


    *I had some fun writing some programs. Isn’t it odd that we still expect students
    to learn*


    *to program from attending our lectures?*


    Now, this book works like this. It not our intention, or our place, to try and


    replace your lectures. The place of this book is to support your lectures by pro-


    viding something that your students will actually read, hopefully before your


    lecture. Our job is to explain to them what’s coming up, why it’s important, and


    why it’s useful. Each chapter should occupy about a week in a 20-week course;


    for a student this week should probably include a couple of lectures, some


    supervised practical time, and opportunities for plenty of practice. There are


    some exercises at the end of each chapter; please add in some of your own to fit


    your own local system or needs.


    You might think that sometimes our explanations are a little simplistic.


    Sometimes we admit that we are, in Civil Servant terms, “economical with the


    truth”. This approach is essential with a language as complex as the language


    that Java has now become. There are so many little details that can tend to get


    in the way of the real business of the day, which is to learn to program.


    Sometimes we’ve added a more complete explanation as a footnote; you might


    well want to go into more detail, particularly with your more experienced or


    advanced students. It’s up to you.


    As for the technical details, all the programs in this book have been written


    and tested using, at the earliest, version 1.4.0 of the JDK running on a Linux
    plat-


    form. We believe that all the programs work (except where stated otherwise),


    2


    But those teaching more ambitious courses would do well to ponder whether it is
    better for


    a student to understand a little Java or to be totally baffled by a lot of Java.


    3


    At Leeds there is a second year course on *Linear Programming*. They avoid that
    too. Just in


    case.'
