  md: "116\n\n*How to program using Java*\n\npublic class CLAtest\n\n{\n\npublic void\
    \ printTwoCLAs (String cla\\[\\])\n\n{\n\nSystem.out.println (\"First argument\
    \ is : \" + cla\\[0\\]);\n\nSystem.out.println (\"Second argument is : \" + cla\\\
    [1\\]);\n\n}\n\npublic static void main (String args\\[\\])\n\n{\n\nCLAtest ct\
    \ = new CLAtest ();\n\nct.printTwoCLAs (args);\n\n}\n\n}\n\nHere we simply take\
    \ the first two elements of the command line argument list\n\nand print them out\
    \ with an appropriate message. For the purposes of this and\n\nsubsequent chapters,\
    \ the notation for obtaining the separate elements of a list is:\n\n*name\\[element*\\\
    -1\\]\n\nSo above, the list is called *cla*, and the first element is accessed\
    \ by using the\n\nvalue 0 (1–1). Remember what we said in the first chapter about\
    \ computers\n\ncounting from 0? Java programs always count this sort of list from\
    \ 0.\n\nThis program is extremely limited, and it is easy to see why. It is left\
    \ entirely\n\nup to the user to ensure that the correct number of command line\
    \ arguments is\n\nsupplied. You can try experimenting with the program yourself\
    \ to see what\n\nhappens when they don’t; any fewer than two and the interpreter\
    \ complains,\n\nand the program stops running before it can do anything useful.\
    \ Any more than\n\ntwo and the arguments from three upwards are discarded without\
    \ warning.¹\n\nThe list of command line arguments can have any name the programmer\n\
    \nchooses. This program used *cla* as the name, but it is more usual to use \n\
    \n*args* (short for arguments) which is what we will do for the rest of the book.\n\
    \nYou might also find C or C programmers who insist on using *argv* as\n\nthe\
    \ name for the list since this is what C and C use for the same thing. It’s\n\n\
    another style thing.\n\nLet’s try another, slightly more useful, example which\
    \ uses exactly the same\n\nprinciples as the nonsense example above. In the last\
    \ chapter we encountered\n\nBruce’s *Sign* class, which allowed Bruce to set a\
    \ message for the sign to display.\n\nThe version we have seen was extremely inflexible,\
    \ in that the message has \n\nto be hard-wired into the source code before compilation.\
    \ This is not ideal, \n\nespecially if a novice user has to run such a program.\
    \ So it makes sense to incor-\n\nporate the command line argument input idea into\
    \ this program.\n\nThe only change necessary is to read the message from the command\
    \ line\n\narguments list rather than a predetermined value. Assuming the message\
    \ is\n\npassed as the first (and probably only) argument and that the list of\
    \ arguments\n\nis given the customary name *args*, the relevant code would be:\n\
    \nbrucesSign.setMessage (args\\[0\\]);\n\n1\n\nThese arguments are still there,\
    \ in the array, of course. It’s just that we’re not doing any-\n\nthing with them.\
    \ Later on we’ll see how to check the number of arguments supplied, and\n\nhow\
    \ to display error messages if this number is not as expected."
