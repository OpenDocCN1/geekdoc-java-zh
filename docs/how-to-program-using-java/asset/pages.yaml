    there to be removed. If it is not, false is returned. Otherwise the indexOf and


    remove methods do the job, as explained earlier in the chapter, and true is


    returned.


    public boolean removeJob (String jobDone)


    {


    if (jobs.contains (jobDone) ) {


    jobs.remove (jobs.indexOf (jobDone) );


    return true;


    }


    else {


    return false;


    }


    }


    Now to keep Elvis up to date with the number of jobs in his list. The method


    to display the number of jobs is nothing more than a call to the size method of


    ArrayList since the size is simply the number of jobs in the list:


    public int countJobs ()


