  md: "296\n\n*How to program using Java*\n\nTesting a program thoroughly is just\
    \ as important as writing the program in the\n\nfirst place. In many ways it is\
    \ in fact rather more important as an untested pro-\n\ngram may contain many costly\
    \ errors. Since the last chapter on testing your\n\nprograms have made use of\
    \ more and more features of Java and have become\n\nmore and more complicated.\
    \ It is crucial that you always test these complex\n\nprograms very thoroughly.\n\
    \nThis chapter is not intended to provide a complete description of the correct\n\
    \nway to test programs. Whole books have been written on testing and a com-\n\n\
    plete description is way beyond the scope of any book on programming.\n\nInstead,\
    \ this chapter gives you some ideas of ways in which you can test your\n\nprograms\
    \ and tries to convince you of the importance of testing.\n\nYou are already familiar\
    \ with the idea of a *test plan* made up of a number of\n\n*test cases*. This\
    \ idea translates directly to longer programs; the only thing that\n\nneeds to\
    \ be ensured is that the test cases in the plan cover every possible way\n\nin\
    \ which a program can execute, or every possible route through a program.\n\n\
    Your programs now include conditional statements and loops and so there are\n\n\
    now many different ways in which they can execute; there must be enough test\n\
    \ncases to test each of these possible execution routes thoroughly.\n\nThe test\
    \ plans that you have written so far have relied on specifying a set of\n\ninput\
    \ values and the expected output values. The programs have been tested\n\nwith\
    \ each case and if the actual output matches the expected output in each\n\ncase\
    \ the program has passed the tests. The approach is fine for simple and \n\nshort\
    \ programs but it is rarely sufficient for more complex programs. A more \n\n\
    thorough approach to testing is needed.\n\nYour programs now also make use of\
    \ classes and these also have to be \n\ntested. A class is a building-block that\
    \ is potentially useful in many programs.\n\nEach class that a program makes use\
    \ of must be properly tested before it \n\nis used; there is very little point\
    \ in writing and testing a program that relies \n\non a class that doesn’t work\
    \ properly. This chapter ends by explaining how to\n\ntest a class before it is\
    \ ever used in a program.\n\n**Routes through a program**\n\nBy now your programs\
    \ will probably be quite complex and there will be many\n\npossible routes through.\
    \ Conditional statements and loops control the possible\n\nroutes and each provides\
    \ several possible ways for a program to execute. A test\n\nplan must make sure\
    \ that every possible route through a program is properly\n\ntested. This means\
    \ first of all that every possibility from each conditional state-\n\nment must\
    \ be tested, as must every possible outcome of each loop.\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_313_0.png)"
