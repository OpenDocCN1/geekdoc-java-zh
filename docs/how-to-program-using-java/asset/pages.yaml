  md: 'This definition describes all the attributes and lists all the methods available.


    There is nothing else that this object type can store, represent, or do.


    From the point of view of a programmer writing a program that would use


    this object type, this definition specifies the names and types of the values
    stored


    in any instance of the object type, and describes all the methods available. A
    lot


    of information is provided about the methods; the specification provides their


    names, what they return, and the type of that return value. This is all the


    information needed in order to develop programs that use *Date* objects.


    **Object-oriented programming**


    You will probably have guessed by now that object-oriented programming is


    programming using objects. This is a very popular and powerful way to write


    programs; after all, the reason that Bjarne Stroustrup proposed the develop-


    ment of C from C was to introduce object-oriented features into a language


    that was already successful and popular. Java is one of the latest languages in


    this development, and probably the most popular at the moment; it is a much


    more pure object-oriented language than C. These developments have also


    been carried on with another language, C#. To see why this approach is so


    popular, let’s look at how object-oriented programs are developed.


    The first step in writing an object-oriented program is to identify the types
    of


    the objects that will be used. This can often be done from a description of the


    problem area and by discussing the problem with those familiar with it. We’ll


    look at this important process in more detail in the next chapter. These object


    types are specified in terms of their attributes and methods and then programs


    are written to implement them. Finally the programs that use the instances of


    these object types (these instances are called, unsurprisingly, *objects* for
    short)


    are themselves written.


    This is the power of object-oriented programming. If programs have been


    written to implement a particular object type, the program code can be re-used


    in many other programs that also make use of the object type. Programmers can


    quickly build up libraries (or, in Java parlance, *packages*) of working object
    types


    that they can use over and over again in many different programs. The savings


    in terms of time and money can be enormous.


    46


    *How to program using Java*


    ![](img/05fa4bae6319441a0b86c0179baaedc2_63_0.png)


    **Example 1 – Mr Martinmere’s nature reserve**


    *Mr Martinmere is in charge of a small nature reserve that is home to ducks and
    coots.*


    *He wants to develop some computer programs to help with the running of the reserve.*


    *What object types will he need?*'
