    \ for more verbose output\n\n}\n\nNow, examining the file (testfile2.txt in this\
    \ case) in your editor of choice,\n\nit should hopefully contain the line that\
    \ we wrote in our program.\n\n*Extending the DuckDatabase class to incorporate\
