  md: 'of learning a new language every year. There are many programming


    languages. Some have been designed for a particular purpose and are very


    good in that special area. Others, like Java, have been designed so that they
    can


    be used for almost anything. As you learn more and more programming, and


    more and more languages, you’ll come to be able to pick the right language for


    the job. But you have to start somewhere, and you’re starting with Java.


    This is a book about learning to program. It is not a book about a particular


    programming language. This means that this book is rather unusual. There is


    not surprisingly a lot in this book about learning to program but not very much


    just about Java. When you’ve read this book and when you’ve done all the


    exercises you’ll be able to get a different book about Java and learn about all
    the


    extra fiddly little details that we’ve missed off as and when you need them. Java


    certainly has a lot of these, and the last chapter will point you in the right
    direc-


    tion. Our job in this book is to put you in a position where you can use one of


    the other books if you want to learn more Java or another language.


    You are learning to program. You are not learning Java. Promise me that


    you’ll remember that.


    **Who this book is for**


    This book is mainly for students following a first programming course in Java


    as part of a further or higher education course. This will probably be in the
    first


    year of the course. It is especially for those students who have never done any


    programming before. It doesn’t matter what your main course is, whether it’s


    computing or something totally different. If you’ve not done any programming


    before this is the book for you.


    It really doesn’t matter at all if you’ve done no programming before. In fact,


    about half of the students I meet every year before their programming course


    starts have never done any. If you’ve done a bit before you might want to let


    your attention wander in a few places. I’ll trust you to spot when these are.


    Of course other readers are welcome to join us. If you just want to know


    something about programming or object-oriented programming in particular


    you’re in the right place. The more the merrier, that’s what I say.


    **Why this book is like this**


    I’ve been teaching people to program for a very long time. Every year I teach


    many students and every year almost all of them succeed. When they find


    things difficult they often go away to read their book. Sadly their book has


    almost always been written for people who can already program or for people


    who find the whole thing very easy or by people who are very good at pro-


    gramming and don’t understand what it’s like to learn to program. Most of my


    students do not find the whole thing very easy, and I hope I understand why.


    This book is for them.


    Often my students tell me that they don’t understand something or that


    they’re stuck with some programming topic. They tell me that they’ve been


    away and read their book but that it didn’t seem to help. This doesn’t surprise


    me because I’ve seen their books. This is the book I wish they’d had.


    Without further ado let me explain what is in this book.


    *What this book is*


    3'
