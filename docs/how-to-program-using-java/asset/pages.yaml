  md: 'I still remember how this game started. After it had loaded (something that


    in those days took the better part of half an hour) the screen cleared and this


    message appeared:


    *You have chosen a dangerous and challenging path, Adventurer*.


    *You are at a crossroads. Paths lead North, South, East, and*


    *West. There is a sword and a scroll here*.


    *What next?*


    You can guess what happened next. I would dutifully pick up the sword and


    scroll. I would read the scroll and ponder the pretty useless clues that were
    on


    it. Then I quickly rushed off in a random direction. I very soon met the fire-


    breathing dragon that didn’t seem to like me very much, said the wrong thing


    to it (hitting it with the sword never seemed to help), and was promptly eaten


    alive or burned to a crisp or both. Then it was back to the start and I started
    the


    whole process again.


    I never finished this game. I never did work out which dwarf desperately


    wanted the bucket with the hole in that I found behind the old oak tree. The


    stone tablet bearing mysterious runes remained a totally useless rock with some


    odd scribbles on it as far as I was concerned. My friend finished it though. He


    spent hours on the computer going east, west, down tunnels, bargaining with


    trees that talked, and many equally strange things. Eventually he found what-


    ever it was he was supposed to be looking for and won the game. He succeeded


    and I did not.


    You are reading a book about learning to program. This shows that you too


    have chosen a challenging path. I have to admit that it’s not very likely that


    you’ll meet a fire-breathing dragon, a talkative tree, or a dwarf with a bucket


    fixation (all good metaphors break down eventually) but you’re certainly in for


    an interesting and challenging time.


    Let no one convince you that this will be easy. Learning to program isn’t easy,


    and anyone who tells you that it is easy is just plain wrong. At the same time,


    learning to program is not impossible. It can’t be, or there wouldn’t be any


    programmers! There’s nothing special about people who can program. As you


    read the rest of this book just remember this. I can program reasonably well and


    I’m not especially clever. If I can do it so can you!


    Let’s think about why this is.


    **Programming is like driving**


    Imagine this. Suppose this was a book about learning to drive a car, and that


    you’d never driven a car before. I would write chapters about using the brakes,


    steering, changing gear, and so on. Imagine that you’d read the book from cover


    to cover. You might even have memorised parts of it. You might even have


    passed a test on the contents. Now imagine that I put you inside a car in


    London and told you to drive to Liverpool. I (and you!) would be very sur-


    prised if you or the car arrived in one piece. I hope we agree that no one would


    seriously consider learning to drive a car like this.


    People learn to drive a car by practising. They spend a lot of time sitting next


    to an experienced driver who tells them what to do and helps them out occa-


    sionally when things seem to be going wrong. They drive around and practise


    the skills they need to develop and perfect. When they’ve developed these skills


    sufficiently they take their driving test and hopefully they pass. Sometimes they


    *Before you start*


