    *How to program using Java*


    ![](img/05fa4bae6319441a0b86c0179baaedc2_137_0.png)


    **Example 1 – Buddy’s times table assistant**


    *Buddy has never really had a head for numbers, and has a hard time remembering
    his*


    *times tables. Unfortunately, the other ducks are far too busy waddling about
    the reserve,*


    *quacking and playing cricket to help him most of the time, so he decides to write
    a*


    *program to help him. What is the best way to perform this task?*


    As anyone over the age of seven knows, times tables involve only whole


    numbers, so this task can be undertaken using only int values. Since this pro-


    gram only needs to receive one value from the user, and the user should know


    this value when they run the program, it makes sense to pass the value as a


    command line argument. Notice the extra code to convert the String value to an


    integer.


    The example program below would give the first six terms in a times table, it


    is hardly rocket science to extend it for more terms!


    /\* TimesTable1.java – Buddy’s program to help with times tables


    Author


    : GPH


    Date


    : 9th June 2003


    Tested on : Linux (Red Hat 8.0), JDK 1.4.1


    \*/


    public class TimesTable1


    {


    public void printLine (int x, int y)


    {


    System.out.println (x + " times " + y + " is " + (x\*y) );


    }


    public static void main (String\[\] args)


    {


    TimesTable1 tt = new TimesTable1 ();


    int num = Integer.parseInt (args\[0\]);


    tt.printLine (1, num);


