    **Glossary**


    **accessor** A* method* which can inspect the value of an *attribute* but not
    alter it. Also


    called a *selector*.


    **algorithm** A group of operations which perform a certain task (such as *sorting*).


    May be written in a particular programming language, or *pseudocode*.


    **Application Programming Interface (API)** The list of *public methods* and*
    attributes*


    describing, for the benefit of a *programmer*, how a particular *package* or language


    can be used. Usually provided in the form of vast amounts of documentation.


    **argument** See* parameter*.


    **array** A structure for storing a fixed number of values of the same *type*.


    **array list** A structure, similar to an *array* that can hold a variable number
    of values


    of some *type*. See also *vector*.


    **assignment operator** , the operator used in an assignment statement. Not the


    same as , which is the *comparison operator*.


    **assignment statement** A statement where a value is assigned to a *variable*.


    **attribute** A value corresponding to a feature of an *object type*, which is
    of interest in


    the real-world problem we are trying to represent. An example would be the


    “name” attribute of a “person” object.


    **backslash** The “\\” character, found between the left-hand shift key and the
    Z key


    on the UK keyboard.


    **base class** A class from which *derived classes* inherit* attributes* and*
    methods*.


    **beta testing** The testing of a *program* at an advanced stage of development,
    in order


    to find *bugs* which would only become apparent through “real” usage.


    **black box testing** A form of testing where the actual *implementation* of the
    *program*


    is unknown.


    **body** A collective name for the statements inside a method.


    **Boolean expression** An* expression* which can be evaluated to one of true or
    false.


    **Boolean operator** An* operator* used to make or compare *Boolean expressions*.


    **Boolean value** A value which can be evaluated to either true or false.


    **boundary case (or boundary condition)** In testing, a type of *test case* which
    tests the


    range of values containing a change from acceptable to unacceptable.


    **braces** See* curly brackets*.


    **Bubblesort** A simple sorting *algorithm* commonly used for teaching purposes.


    **bug** Unintended or undocumented behaviour in a *program*. Usually a bad thing,


    and almost always discovered by a *user*.


    **bytecode** Generated by a *compiler* from *source code*, and executed by an
    *interpreter*.


    Java bytecode is found in files with the .class* extension*.


    **call** Both a noun and a verb. See *method call*.


    **calling method** A* method* which* calls* another* method*.


    **calling program** A* program* which* calls* a* method*.


    **cast** A way of converting a value from one *type* (usually a *numeric type*)
    to another.


    **CLAs** See* command line argument*.


    **class** See also *object type*.


    **.class file** See also *bytecode*.


    **classpath** A list of locations the Java compiler and/or interpreter will search
    for


    packages imported into classes or programs.


    **code** See also *source code*.


    **code reuse** The ability to use *code* developed to solve one problem as part
    of a solu-


    tion to another.


    **code walkthrough** The process of going through a *program*’s* source code*
    a line or


    block at a time, in order to explain its operation to another person.'
