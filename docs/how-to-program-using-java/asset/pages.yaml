    36


    *How to program using Java*


    4


    I lie. It wasn’t my computer. It was my friend Mark’s computer, and we typed them
    in


    together. Programming really is a social thing, you see?


    ![](img/05fa4bae6319441a0b86c0179baaedc2_53_0.png)


    Since you haven’t done any programming yet there still aren’t any examples as


    such in this chapter. While we’re here though let me just tell you how I learned


    to program.


    A long time ago, when home computers were a very new thing, you could


    buy magazines that contained nothing more than listings of programs. You


    could type these into your computer (they were almost always games and were


    usually written in a dialect of a language called BASIC) and sometimes they


    even worked. I learned to program by typing these programs into my computer.⁴


    Of course, at first I understood practically nothing of what I was typing. For


    example, I remember looking very hard at this line:


    *50 LET X = X + 1*


    and wondering how this could possibly be right. I mean, *X* can’t possibly equal


    *X +** 1*, can it? In time I came to understand parts of the programs I was typing


    and even that one line became less of a mystery. If you can already see what it


    does you’re doing better than I did! Eventually I could write my own programs,


    at first mostly by adapting those I had seen before.


    Later I took a more formal programming course. There were some things in


    it that I found difficult and some others that came much more easily. I got by


    well enough, by going to the lectures and practising in the labs. There were still


    some things that remained pretty mysterious and that I never properly under-


    stood, though.


    I* really* learned to program when I finally got a job as a programmer. I worked


    eight or more hours a day doing nothing but programming. I worked with


    programs (this time written in a language called C) that controlled massive test


    machines in a truck engine factory; if I made a mistake the machines could have


    exploded and done someone a nasty injury. Sometimes I did it while lying in'
