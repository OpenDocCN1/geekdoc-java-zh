  md: "A more direct ancestor can be found in the B language also developed at MIT\n\
    \nin the late 1960s and early 1970s. B was designed as a programming language\n\
    \nfor developing systems on Unix, which was yet another project being\n\ndeveloped\
    \ at MIT.³^ B was developed, extended, and refined and eventually\n\nevolved into\
    \ a new language, imaginatively named C. C was first fully\n\ndescribed in “The\
    \ C Programming Language” by Brian Kernighan and Dennis\n\nRitchie in 1978. C\
    \ became one of the most popular programming languages, if\n\nnot the most popular,\
    \ in the 1980s and 1990s. It is still widely used today.\n\nIn the early 1980s\
    \ an extension to C was proposed by Bjarne Stroustrup; this\n\nwas C which is\
    \ essentially a development of C with extensions to support\n\nsomething called\
    \ *object-oriented programming*. Stroustrup was influenced by\n\nSimula and wanted\
    \ to extend C to include object-oriented facilities. C offers\n\nsignificant advantages\
    \ over C for many applications, although even Stroustrup\n\nhimself has remarked\
    \ that C is still to be preferred in some areas. The key is\n\nchoice; C can be\
    \ used as an object-oriented language or it can be used in a\n\nmore traditional,\
    \ C-like, way. This flexibility means that C became one of\n\nthe most popular\
    \ programming languages in a whole range of applications.\n\nJava can in a way\
    \ be seen as a further development of C, although it was\n\ndeveloped from a “clean\
    \ slate”. The history of C and its development means\n\nthat it is effectively\
    \ a hybrid language; in some ways it is an object-oriented\n\nlanguage while in\
    \ others it is more traditional. Java is a much more pure \n\nobject-oriented\
    \ language.\n\nJava was developed by a group led by James Gosling at Sun Microsystems.\
    \ It\n\nstarted out as part of something called the “Green Project”, a research\
    \ and\n\ndevelopment project started by Sun to try to look ahead to future trends\
    \ in\n\ncomputing. The project developed various electronic gadgets aimed at the\n\
    \nconsumer market. These gadgets needed to be programmed and so a new\n\nlanguage,\
    \ originally called Oak, was developed. Oak is the language that\n\neventually\
    \ became Java; rumour has is it that the name was changed when the\n\nGreen Project\
    \ discovered that there was already a programming language\n\ncalled Oak. The\
    \ name “Java” has a lot to do with coffee, a very popular drink\n\namong computer\
    \ programmers; the Java logo of a steaming coffee cup can be\n\nsee on Sun’s Java\
    \ web pages to this day (and versions of it are liberally spread\n\naround this\
    \ book!).\n\nJava is now one of the most popular programming languages around.\
    \ \n\nIts heritage and design means that programs written in Java can run unaltered\n\
    \non all sorts of computers and devices (I have a mobile phone that can run \n\
    \nsmall Java programs!). This design is based around something called the *Java*\n\
    \n*Virtual Machine* (or JVM), which we will meet later on. The JVM is, incidentally,\n\
    \nwritten in C.\n\nThe history of programming languages is quite fascinating in\
    \ its own right.\n\nThere are pointers to help you find out more in the Further\
    \ Reading section \n\nat the back of the book. You might want to check out some\
    \ more details of \n\nthe history of Java, and perhaps even see what James Gosling\
    \ himself has to \n\nsay about it. If you understand how a language has developed\
    \ you can often\n\nunderstand why it works the way it does.\n\n16\n\n*How to program\
    \ using Java*\n\n3\n\nYou may well have met or heard of the most popular modern\
    \ incarnation of Unix, the free\n\noperating system Linux."
