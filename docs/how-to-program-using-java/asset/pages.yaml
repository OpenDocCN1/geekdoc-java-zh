    ducks = ducks + 1; // ducks is now 51\n\nYou might remember that programming statement\
    \ that Tony could never\n\nunderstand all those years ago! The one we mentioned\
    \ long ago in Chapter 3:\n\n*50 LET X = X + 1*"
