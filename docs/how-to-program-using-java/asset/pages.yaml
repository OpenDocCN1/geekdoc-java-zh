  md: 'Sometimes the whole compilation process will fail at this final stage. This


    might be because the necessary packages have not been imported or because


    the code contained in a package has not been used correctly. What has gone


    wrong should hopefully be obvious from the error messages generated.


    **From source code to executable**


    As you write and test your programs it will help if you remember to think about


    what it is that you are creating. You are creating a “recipe” for solving a prob-


    lem and you are using a language that is meaningful to humans.⁷^ Before this


    can be run on a computer it must be translated into a form that the computer


    can execute. The *source code* of the program must be translated into an *executable*


    version of the program.


    This translation is a process called *compilation*. Compilation is actually a
    two-


    stage process. First the source code is translated into bytecode and then this


    bytecode is executed by the JVM which can make use of various system libraries.


    The result of this process is the final version of the program, something that
    is


    very different in the way it looks to the source code that you have written!


