    The problem is that this doesn’t mean that the program actually works! There


    is only sufficient information here for a programmer to assume that it does. In


    the example above there are only three sets of test data; if the program passes


    all three test cases all that is actually known is that it works correctly with
    these


    three pairs of input values. It is certainly not possible to be sure that it works


    with every possible set of input data; with most types of input data²^ there could


    always be some extra test case that has not been tried for which the program


    produces an incorrect result.


    This is the problem with testing any program. A program will be expected to


    work with very many input values; a program very similar to the program


    above could potentially process an infinite number of possible values. For this


    reason it is rarely possible to test any program with every possible set of test


    data. Instead, representative values are used to build up test cases in a test
    plan;


    if the program passes all the test cases it is reasonable to assume that it works


    correctly in all other possible cases. This is the case with all programs; a pro-


    gram in an airliner cannot be tested on every route the airliner might fly and
    in


    all weather conditions. For any program a subset of the possible input values


    must be used in the test plan. Picking those values requires thought; this


    process cannot be allowed to be random.


    Programs should also be able to cope with input values that are not as expected;


    a user may enter a negative number when a positive number is expected,³^ for


    example. This means that programs should also be tested with unexpected values.


    In this example an input that indicated that there was a negative number of ducks


    is obviously nonsense, but it is important that the program deals with such inputs


    sensibly. There are also some specific cases to look out for. There is a potential
    error


    in this program if a negative were entered for the number of ducks. This would


    give the situation were negative ducks were assigned to teams! Another common


    error occurs when a value is being used as a divisor in a calculation; such a
    value


    cannot be allowed to be 0, since division by 0 is an error. The program must always


    cope with errors of this kind and must behave sensibly.


    Taking this potential error case into account a more complete test plan can be


    drawn up. In this case 0 is allowed to the number of ducks (there would be no


    teams, and no ducks left over, presumably), but it is the lowest possible value
    that


    is allowed. Amore complete test plan for the example would look something like:


