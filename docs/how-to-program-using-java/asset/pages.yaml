    return busRoute;\n\n}\n\n}\n\nSo here an object with the type *BusConductor* has\
    \ the attribute *busRoute*\n\n(together with a selector and a mutator) together\
    \ with all the attributes and\n\nmethods of the *Person* class. Similar classes\
    \ could be implemented for any \n\nparticular type of person.\n\nInheritance can\
    \ save a great deal of coding. There can be many levels of\n\ninheritance in an\
    \ application with derived classes acting as base classes for\n\nothers.\n\n**Overloaded\
    \ methods**\n\nMethods in Java are identified by the combination of the name of\
    \ the method,\n\nthe type of the returned value, and the types of any parameters.\
    \ It is this\n\ncombination of information together that identifies the method;\
    \ there is no need\n\nfor every method in a class to have a different name. A\
    \ number of methods can\n\nhave the same name if there is something else that\
    \ can be used to distinguish\n\nthem; the method can be overloaded.\n\nSuppose\
