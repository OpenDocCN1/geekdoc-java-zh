  md: "*The basics*\n\n93\n\non the right. For example:\n\n// Declarations\n\nint\
    \ grade;\n\nchar answer;\n\nString name;\n\n// Assignments\n\ngrade = 70;\n\n\
    answer = 'a';\n\nname = \"alan turing\";\n\nThese three statements assign the\
    \ three values on the right to the variables\n\nnamed on the left. In each case\
    \ the variable has to have the same *type* as the\n\nvalue assigned to it; it\
    \ doesn’t make sense to assign a string value to an integer\n\nvariable. As examples\
    \ of what cannot be done, assuming the types in the \n\ndeclarations above, these\
    \ assignments are not allowed:\n\ngrade = \"a\\*\";\n\n// cannot assign string\
    \ to int\n\nname = 100;\n\n// cannot assign int to string\n\nanswer = \"hello\"\
    ; // cannot assign string to char\n\nUnlike the algebraic use of  it is not possible\
    \ to write assignment statements\n\nwith the variable’s identifier on the right.\
    \ This is not allowed and will cause a\n\ncompilation error:\n\n'a' = grade;\n\
    \n// Not allowed!\n\nTo make sure that you remember this, remember to get into\
    \ the habit of \n\nreading the  sign in an assignment statement as “is assigned”\
    \ or “becomes\n\nequal to”.\n\nIn all the correct assignment statements so far\
