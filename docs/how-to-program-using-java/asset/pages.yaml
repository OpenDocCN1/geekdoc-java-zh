    \ \n\n*static methods*, methods that can be called without an object.\n\nAfter\
    \ reading this chapter you should be able to implement most if not all \n\nof\
    \ the methods needed for your classes. You should be able to write methods\n\n\
    that make use of conditional statements and loops, and also other methods! Of\n\
    \ncourse you should also be able to use these methods from your Java programs.\n\
    \n![](img/05fa4bae6319441a0b86c0179baaedc2_239_1.png)\n\nThere is not much new\
    \ Java in this chapter, but some of it can seem a little \n\ncomplicated. Before\
    \ we start, let’s recap for one last time some of the details of\n\nmethods that\
    \ we have covered so far. A method in Java is defined by a line \n\nof the form:\n\
    \n*public* *return type* *method name* *(**parameter types**)*\n\nOur convention\
    \ is that methods are public (althoug that is only a convention).\n\nThe description\
    \ itself starts with the type of value that is returned by the\n\nmethod. This\
    \ is followed by the name of the method, which is in turn followed\n\nby the types\
    \ and identifiers of any parameters, in brackets and separated by\n\ncommas. This\
    \ corresponds to the first line of a method declaration.\n\nSuch a description\
    \ is sometimes called a *prototype*. The description has \n\nin fact much the\
    \ same function as a prototype in more familiar engineering"
