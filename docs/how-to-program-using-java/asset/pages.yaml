    *How to program using Java*


    and an equally excellent free tutorial by Alan Gauld here:


    *http://www.freenetpages.co.uk/hp/alan.gauld/*


    Python differs from Java and C in that it is a *scripting language*. This means


    that Python programs are not compiled, but are interpreted as they are executed.


    Python programs can also be written interactively.


    Python is quite a new language, but it is gaining in use. A particular attrac-


    tion is that, since it is interpreted, it is especially suitable for developing
    quick


    prototypes of programs before they are rewritten in another language. Many


    recent applications have used Python, including the Google search engine and


    several feature films.


    The history of Python is described on the home page of the author, Guido van


    Rossum:


    *http://www.python.org/~guido/*


    *Other languages*


    Computer programming languages are rather fascinating things. They have


    developed a complex family tree, even though they’ve only been around for a


    relatively short time. If you want to find out more about them, a good start is


    Éric Lévénez’s excellent programming language page:


    *http://www.levenez.com/lang/*


    Equally fascinating is the splendid “Bottles of Beer” page at:


    *http://99-bottles-of-beer.ls-la.net/*


    where you can find programs to generate the lyrics to a well-known song in (as


    at December 2003) 598 different programming languages. That’s 170 new


    languages in the last year!


