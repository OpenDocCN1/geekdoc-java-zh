    **2\. Basic structure**


    Any file containing a Java program or class definition starts with a comment


    describing its purpose and providing other useful information. The basic


    structure after this follows a set pattern.


    // Any included libraries or files


    public class someClass {


    // Attributes


    // Methods


    // main method (if included)


    }


    **3\. Defining attributes or variables**


    An attribute variable has an identifier (name) and a type. It is our convention


    that attributes are always declared to be private, so that they may only be


    accessed by methods of the class.


    public int aNumber;


    public String aName;


    public boolean finished;


    The variable can also be given an initial value.


    public int aNumber = 0;


    public String aName = "Elvis";


    public boolean finished = false;


    **4\. Defining constants**


    Constant values are declared in a similar way to variables. Constant values


    cannot be changed.


    final int MAXTURNS = 10;


    final String BOOK = "How to Program Using Java";


    final double PI = 3.1415;


    **5\. Types**


    The following data types have been used in this book:


    int


    an integer – positive or negative (or 0)


    double


    a floating-point number


    char


    a single character


    String


    a sequence of characters


    boolean


    a Boolean value – true or false


    ArrayList a collection of other values


    **6\. Converting between types**


    The names of these types can be used to convert values between types. This


    process is known as casting.


