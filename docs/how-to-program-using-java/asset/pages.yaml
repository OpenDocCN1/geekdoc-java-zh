  md: 'x


    **To the Teacher**


    Hello. Welcome to a book about learning to program.


    Before we go any further, you need to be absolutely clear about what it is that


    you are holding in your hand. This is possibly a book with the name of a pro-


    gramming language in the title that is unlike any book about with the name of


    a programming language in the title that you have encountered before. And


    you have probably encountered many. Too many.


    A big claim, that. But this is not a book about Java. This is not a book that


    seeks to explain all the minute details of the Java language.¹^ This book contains


    no UML and none of whatever the flavour of the month is at the moment in sys-


    tems development. This is not a book that an experienced programmer, work-


    ing in industry, would use as a reference while working on some commercial


    project. There are lots of books like that, and lots of books written for experi-


    enced programmers, and this is not one of them.


    This book came about like this. We’ll let Tony explain.


    *I’ve been to a few conferences on teaching computing, and I’ve given a few presentations*


    *and so on describing some of my ideas on what’s wrong and right with the way
    we teach*


    *programming. I think I’ve come to the conclusion that there’s rather more that’s
    wrong*


    *than right. A publisher’s rep came up to me at one of these happy events and
    started to*


    *pester me to write my own Java book. I declined, since there were already far
    too many*


    *Java books about and I saw no need to add to this needlessly large pile of paper.
    More to*


    *the point, I didn’t know Java, even if it was flavour of the month at the time*.


    *The problem that then emerged was that this was a persistent publisher’s rep.
    I kept*


    *finding that she kept popping up in my office. I will admit to having been bought
    a beer,*


    *but despite advice from other authors, I always seemed to miss the free lunch.*


    *Eventually, during ITiCSE 2001 at Canterbury, I cracked and agreed to write some-*


    *thing. But only on my terms. I was not going to write another totally unnecessary
    book*


    *about Java. I was, in fact, going to write a book about programming and C**.
    I knew*


    *C**, you see. It was sort of last month’s flavour that was still quite good*.


    *The C** book has been and gone. You might have seen it; it’s the one with all
    the*


    *sheep. Now we come to the Java version. First, let’s be very clear that this
    is not just the*


    *C** book rewritten in Java. Some of the chapters are similar, yes. The style
    is not com-*


    *pletely different, even if the sheep have mysteriously become ducks. But the
    whole basic*


    *approach and structure have been revisited. The main change is that Java demands
    a*


    *much earlier and deeper discussion of objects (which is present and correct),
    and that*


    *objects need to be used more and throughout. The rest of the material has all
    been revis-*


    *ited too, and changed where needed. Underneath, though, the approach is the same
    – the*


    *underlying belief is that students need to learn to program, they do not need
    to learn*


    *Java or C** or some other language. And they need to understand that*.


    *That is why this is a book about learning to program. Specifically this is a
    book that*


    *is intended to support a student following an introductory programming course
    in fur-*


    *ther or higher education. There is sufficient Java in this book to be included
    in such a*


    *course; there are also some pointers in the final chapter that would be of interest
    in the*


    1


    You can probably tell that from the size!'
