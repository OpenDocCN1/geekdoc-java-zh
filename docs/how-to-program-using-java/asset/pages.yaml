  md: "204\n\n*How to program using Java*\n\nThis is a much more friendly example\
    \ of interaction than those that we have\n\nbeen able to achieve up to now.\n\n\
    To implement a dialogue such as this, one or more statements in a program\n\n\
    must be executed a number of times. Since it is not possible to predict how\n\n\
    many times the user will make a mistake, or even if they will make one at all,\n\
    \nthe statements concerned cannot be repeated in the program; rather the same\n\
    \nstatements must be executed until the user provides an acceptable value.\n\n\
    This is only one example of where a program *loop* might be used. There are\n\n\
    many others situations where this is required, but there are in general only three\n\
    \ntypes of loop:\n\n●Part of a program is executed a given number of times. *Do\
    \ this six times*.\n\n●Part of a program is executed until some condition becomes\
    \ true. *Do this until*\n\n*the user has entered an acceptable value*.\n\n●Part\
    \ of a program is executed while some condition is true. *Do this while the*\n\
    \n*user continues to enter incorrect values*.\n\nIn each of these examples “part\
    \ of a program” means one or more statements\n\nenclosed between the usual pair\
    \ of braces.\n\nThe last two possibilities in this list may seem at first sight\
    \ to be the same\n\nthing, but they are not. There is a subtle difference. A loop\
    \ that is executed until\n\nsome condition becomes true will always be executed\
    \ at least once, while a\n\nstatement that is executed as long as some condition\
    \ is true may never be\n\nexecuted at all if the condition is initially false.\n\
    \nSome examples of loops are:\n\n●Execute this statement seven times.\n\n●Execute\
    \ this statement, and carry on executing it until the user enters a \n\nnegative\
    \ value at the prompt.\n\n●Execute this statement while the user continues to\
    \ provide valid input values.\n\nThese three types of loop are implemented in\
    \ Java as for loops, do … while\n\nloops and while loops, respectively. The names\
    \ simply refer to the Java \n\nkeywords that are used to express such a loop.\n\
    \n**for**** loops**\n\nA for loop causes statements to be executed a certain number\
    \ of times. \n\nThis number might be a known literal value such as 10 or it might\
    \ be held in a\n\nvariable. The first case is used when it is known that the loop\
    \ will always be\n\nexecuted the same number of times, while the second allows\
    \ the number to \n\nbe determined as the program is running.\n\nThe loop is controlled\
    \ by a statement of the form:\n\n*for (**initialisation statement**;* *continuation\
    \ condition**;* *change statement**)*\n\nThe initialisation statement is executed\
    \ the first time the loop is executed and\n\nthe loop continues to execute as\
    \ long as the continuation condition is true. Each\n\ntime the end of the loop\
    \ is reached the change statement is also executed.\n\nThis might all seem a little\
    \ complicated, so an example illustrates:\n\nfor (int i = 0; i < 10; i ++ )\n\n\
    The initialisation statement is often a declaration. In this example, when the\n\
    \nloop is first executed, an integer variable *i* will be created and initialised\
    \ to 0.\n\nThe loop will execute as long as *i* is less than 10 (the continuation\
    \ condition)"
