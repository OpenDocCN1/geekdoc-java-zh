  md: "**numeric type** A primitive *variable type* representing a mathematical quantity.\n\
    \nExamples are *integers* and* floating-point numbers*.\n\n**object** An entity\
    \ representing a particular instance of a *class*, which can be manipu-\n\nlated\
    \ by a *program*.\n\n**object-oriented programming** A style of programming which\
    \ relies on descrip-\n\ntions of *objects* to represent a problem area.\n\n**object\
    \ type** Refers to a group of objects which possess the same characteristics\n\
    \nwithin a problem area.\n\n**operating system (OS)** The* program* (or collection\
    \ of *programs*) which provides \n\nthe interface between *user* and computer.\
    \ Common examples are Linux, MS\n\nWindows, and Mac OS.\n\n**operator** A symbol\
    \ used to build *expressions* along with *identifiers* and* literals*. For\n\n\
    example, /, \\*, , and  are mathematical operators, while !, &&, and || are\n\n\
    *Boolean operators*.\n\n**operator precedence** The order in which *operators*\
    \ are treated within a calculation\n\nor comparison.\n\n**ordinal type** A* data\
    \ type*, the possible values of which can be listed.\n\n**package** The Java term\
    \ for a *library*.\n\n**parameter** A value provided to a *method* by its *calling\
    \ method*. Found within *paren-*\n\n*theses* in a *method call*.\n\n**parentheses**\
    \ The symbols ( and ).\n\n**portable** Property of a *program* which can be copied\
    \ across different computers and\n\n*operating systems*, and *compiled* and run\
    \ with little or no alteration required.\n\n**precedence** See* operator precedence*.\n\
    \n**primitive type** One of the basic built in types such as int, char, double,\
    \ boolean,\n\nas opposed to *object types*.\n\n**private** A kind of *attribute*\
    \ or* method* which cannot be accessed directly by any code\n\noutside of the\
    \ *class* in which it is defined.\n\n**procedural language** A* programming language*,\
    \ like Java, that specifies a procedure\n\nthat will solve a problem; some other\
    \ languages can be described as functional.\n\n**program** A set of *statements*\
    \ which, together, perform some task.\n\n**programmer** A skilled craftsperson\
    \ who develops *programs*. The term is not neces-\n\nsarily interchangeable with\
    \ *software engineer*.\n\n**programming language** A specialised language used\
    \ by a *programmer* to express an\n\n*algorithm* to a computer.\n\n**prompt**\
    \ A message displayed by a *program* indicating that *user* input is required.\n\
    \n**prototype** A name sometimes used for the heading of a *method* declaration.\n\
    \n**pseudocode** A representation of an *algorithm* which is not written in any\
    \ parti-\n\ncular computer language. It usually consists of more human-oriented\
    \ language\n\nrather than computer-oriented, and is written in such a way as to\
    \ be clear and\n\nunambiguous.\n\n**public** A kind of *attribute* or* method*\
    \ which can be accessed directly by code outside\n\nof the *class* in which it\
    \ is defined.\n\n**recursion** See* recursion*.\n\n**reference** Property of a\
    \ parameter, for example, where the parameter represents not\n\na particular value\
    \ (such as “1878”), but a particular object (for example, the duck\n\n“Elvis”).\n\
    \n**return** The last stage in the execution of a *method*, where the *flow of\
    \ control* reverts to\n\nthe* calling method*. Sometimes involves a *return value*\
    \ being provided to the *calling*\n\n*method*.\n\n**return type** The* data type*\
    \ of the value returned by a *method*.\n\n**return value** The value passed from\
    \ a returning *method* to its *calling method*.\n\n**scope** Of a *method* or*\
    \ attribute*, whether the *method* or* attribute* is* public* or* private*.\n\n\
    **selector** See* accessor*.\n\n**Software Development Kit (SDK)** See* JDK*.\n\
    \n352\n\n*How to program using Java*"
