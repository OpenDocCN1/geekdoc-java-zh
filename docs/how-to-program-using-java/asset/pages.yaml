  md: "program. We will see later on that the name must also match with part of the\n\
    \ncontents of the program.\n\nAny Java program file is created with a simple *text\
    \ editor* or sometimes in a\n\nmore sophisticated *integrated development environment*.\
    \ Common text editors are\n\n*vi* on Unix systems and *PFE* or* Notepad* on Microsoft\
    \ Windows systems. Many\n\nJava systems, especially those designed for use on\
    \ Microsoft Windows, also \n\nprovide an *integrated development environment*,\
    \ normally referred to as an IDE.\n\nThe program prepared in this way, whether\
    \ with a text editor or with an IDE,\n\nis called the *source code* of the program.\
    \ It is just a file containing plain text; \n\nthe computer has no idea at this\
    \ stage of how to carry out the instructions in \n\nthe program. It is in fact\
    \ only the name of the file that gives a clue that the file\n\ncontains a Java\
    \ program.\n\nIt is worth spending some time becoming reasonably proficient in\
    \ using your\n\ntext editor or IDE. It’s normally possible to do most editing\
    \ tasks if you learn \n\njust a few commands in an editor but many editors also\
    \ have many much more\n\npowerful facilities and tools hidden away. You will spend\
    \ a lot of time editing files\n\nas you work on your Java programs so it’s more\
    \ than worthwhile getting used to\n\nusing the editor. Hopefully the *Local Guide*\
    \ gives you plenty of information.\n\n**Compilation**\n\nWhen the programmer has\
    \ created all the source code and is happy with \n\nthe program it is time for\
    \ the program to be translated into a form that the \n\ncomputer can actually\
    \ run. This is a process called *compilation*. Compilation\n\ninvolves the use\
    \ of another program called a *compiler*.³^ The final result, a ver-\n\nsion of\
    \ the program that can be run by the computer, is called an *executable* file.\n\
    \nThe executable file is written completely in a form that can only be understood\n\
    \nby the computer; it is totally impenetrable to most humans.\n\nThis gives a\
    \ process that can be represented like this:\n\n*The mechanics*\n\n23\n\n![](img/05fa4bae6319441a0b86c0179baaedc2_40_0.png)\n\
    \nThe actual process that a programmer goes through to compile a program is\n\n\
    different on different computer systems. There are Java systems available for\
    \ a\n\ngreat many computer systems and the compilation process used by every one\n\
    \nis different. Sometimes compilation involves typing a command at a prompt\n\n\
    and other times it is simply a case of clicking a button.\n\n3\n\nHere’s a poser\
    \ for you. Compilers are computer programs. They are written in computer\n\nprogramming\
    \ languages. So, who wrote the first compiler and what did they use? To make\n\
    \nit worse I’ll tell you that most C compilers are written in C."
