  md: "*The basics*\n\n99\n\n**Output**\n\nUp to now, we’ve learned how to write exciting\
    \ programs, which might even\n\ndo some useful things. However, I’m sure you’ll\
    \ agree that these things are nei-\n\nther exciting nor useful unless we can see\
    \ what’s going on. As it stands, you\n\nknow how to create a variable, assign\
    \ it a value, and manipulate this value.\n\nHowever, so far you’ve had to assume\
    \ that the manipulated value is, in fact,\n\nwhatever I say it is. Therefore,\
    \ this would seem to be a good time to show you\n\nhow to output messages to the\
    \ screen.\n\nIn most books about programming or about a programming language \n\
    \nthe first program the reader sees is always the same. This first program always\n\
    \ndoes nothing more than display the message *hello, world* or something very\n\
    \nsimilar on the user’s screen.\n\nThis is such a fine and longstanding tradition\
    \ that it would be a shame to not\n\nto include this memorable program somewhere\
    \ in this book, even if it isn’t the\n\nfirst complete program. So here is my\
    \ version of that very program in Java:\n\n/\\* Hello.java – the traditional first\
    \ program\n\ndemonstrating output.\n\nAuthor\n\n: GPH\n\nDate\n\n: 14th December\
    \ 2002\n\nPlatform : Linux (Red Hat 7.3) with JDK 1.4.1\n\n\\*/\n\npublic class\
    \ Hello\n\n{\n\npublic static void main (String args\\[\\])\n\n{\n\nSystem.out.println\
    \ (\"hello, world!\")\n\n}\n\n}\n\nAgain, this program defines a single method,\
    \ and no attributes. You will\n\nrecognise all the lines in it except one – line\
    \ 13 – and you might even remember\n\nthat from Chapter 6. This line actually\
    \ uses a method already defined for \n\nyou, in order to output a string to the\
    \ screen. This method is called println\n\nand is defined as part of an object\
    \ called System.out which we won’t \n\nworry about too much, except to say that\
    \ it almost always corresponds to \n\nthe terminal from which the program was\
    \ run. This method takes a single\n\nString parameter, which will be output to\
    \ the screen, followed by a newline\n\ncharacter.\n\nNow, you may be wondering\
    \ how on earth we can have single characters,\n\nintegers or floating-point numbers\
    \ output, if the method we’re using will only\n\naccept a String as a parameter.\
    \ Thankfully, the people who developed Java are\n\nclever, and thought of this.\
    \ They designed Java so that char, int and double\n\nvalues can be added to the\
    \ end of String variables automatically. This is also\n\nknown as appending a\
    \ value to a string.\n\nSo, for example:\n\nint numWheels = 4;\n\nSystem.out.println\
    \ (\"There's \" + numWheels + \" wheels \"\n\n\\+ \"on my waggon.\");"
