  md: "Staying in front of the computer typing random symbols or copying random\n\n\
    sections of programs from your books for hours on end is unlikely to work. It\n\
    \njust might (after all an infinite number of monkeys typing on an infinite number\n\
    \nof typewriters would eventually produce this book!³) but it’s not very likely.\n\
    \nYou need to do something more positive. I often find that the best plan is to\n\
    \nwalk away from the computer and do something totally different for a while.\n\
    \nYou would be surprised how often the solution can suddenly pop into your\n\n\
    head when you least expect it as you stand in the queue for a coffee! But if it\n\
    \ndoesn’t pop you need to do something else.\n\nThere are many things you could\
    \ try. You could try re-reading the relevant\n\nchapters of this book. If you’ve\
    \ already done that, or if a re-reading doesn’t\n\nseem to help, the collection\
    \ of examples at the end of the chapters might help.\n\nYou could look at some\
    \ programs that do something similar to what you want\n\nto achieve and try to\
    \ adapt them.\n\nIf you don’t get anywhere after this go and talk to one of your\
    \ experts. They\n\nshould be able to tell you what’s wrong and they’ll probably\
    \ be more than\n\nhappy to do so. At the same time you should resist the temptation\
    \ to let your\n\nexpert tell you the answer or write your program for you. If\
    \ you let them do\n\nthat you’ll learn nothing.\n\nThe golden rule for getting\
    \ help when you’re learning to program is:\n\n*Try and work it out yourself first\
    \ but don’t be shy about going to an expert.*\n\nAlways remember that the experts\
    \ all learned to program for the first time once.\n\nThe advantage they have over\
    \ you is just that they learned a while ago and \n\nthat they’ve had a lot of\
    \ practice since then. They’ve seen all the errors before,\n\nand they can remember\
    \ what it’s like for you. Never ever believe that they’re\n\nmore intelligent\
    \ than you; they’ve just got a skill that you haven’t (yet!).\n\nRemember that\
    \ the only *real* reason that they can do this and you can’t is that\n\nthey’re\
    \ (probably) rather older than you.\n\n**Don’t panic!**\n\nI’m sorry if some of\
    \ this sounds very negative and off-putting. Please don’t take\n\nit the wrong\
    \ way.\n\nI want you to understand that learning to program is difficult and that\
    \ every-\n\none who does it gets stuck at some point. There is no shame at all\
    \ in getting\n\nstuck; it happens to all of us and it happens to all of us all\
    \ the time.\n\nOf course you might be one of those people who finds programming\
    \ \n\nvery easy and wonders what all the fuss is about. You might be a “natural”\
    \ \n\nprogrammer. If you are then I’m sorry for having worried you unnecessarily\
    \ in\n\nthis chapter. But I hope you’ll do me a favour. Go and find someone who’s\
    \ \n\nfinding this really difficult and give them a helping hand. Don’t finish\
    \ their pro-\n\ngram for them and don’t tell them the answer; if you did that\
    \ they wouldn’t\n\nlearn anything. Point them in the right direction, explain\
    \ an error message \n\nto them, or give them a clue how to finish their program.\
    \ Remember that \n\nprogramming is a social thing. Programmers work as a team\
    \ and help each\n\n*Before you start*\n\n35\n\n3\n\nActually, this is not true.\
    \ A university recently did research and discovered that the\n\nmonkeys would\
    \ just tend to type the letter S with the occasional W. They do some\n\nwonderful\
    \ stuff in universities."
