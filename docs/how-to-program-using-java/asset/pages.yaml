    **19.2**


    Write a program that prompts the user to enter five words and then sorts


    them into alphabetical order. Use an array list and a Bubblesort. Dry run the


    sorting function in your program with the words “sausage”, “egg”, “bacon”,


    “tomato”, and “mushroom”.


    **19.3**


    Implement the *Duck* class from this chapter. Use a driver program to test


    your implementation.


    **19.4**


    Write a driver program for the *Cricketing Duck* class from last chapter.


    Use it to test the methods in the class. Pay particular attention to the methods


    that were not used in any of the programs!


    ![](img/05fa4bae6319441a0b86c0179baaedc2_325_0.png)


    As programs become more and more complex so does the process of testing.


    Testing should never be ignored. It should be seen as part of the process of pro-


    gramming; a good programmer will always test the program as it is being


    developed. A program is not complete when it has been written; it is complete


    only when it has been thoroughly tested.


    When you start to learn to program there can be a temptation to be so


    relieved that a program works that you cannot bear to test it. Testing can uncov-


    er mistakes that you have made and can mean that you are in for a lot more


    work. Try not to succumb to this temptation. Always test your programs as


    thoroughly as you can, and never be afraid to help other people test theirs.


    Testing should always be a structured process and should always be carried


    out according to a plan. The plan should be written before the program; don’t


    be tempted to write the test plan to fit the parts of the program that work and


    to hide the rest!


    Testing a program is as important as developing it in the first place. Without


    thorough testing any program is worthless.'
