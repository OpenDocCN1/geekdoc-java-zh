  md: '154


    *How to program using Java*


    A Java *.java* file describes amongst other things the *class interface*. This
    aspect


    of the file is the important one in this chapter; you will need to be able to
    examine


    the* .java* file defining a class and so work out how to make use of the class
    in


    your programs. You will normally be able to see all the details of the implementa-


    tion of the class too, but this is not important if all you need to do is use
    the class.


    It is also possible to use a class if only the *.class* file of the class is available.


    This can happen when for some reason the programmer who has written the


    class does not want a programmer using the class to have access to the details


    of the class’s implementation. In this case, of course, the class interface will
    have


    to be specified in some accompanying documentation. We will assume here that


    the* .java* file is available, so we start by seeing how to understand its contents


    and so extract the class interface.


    We saw a simple class defined in Chapter 6, and we defined a slightly more


    complicated class in the last chapter. Both of these examples defined a simple


    class to store details of ducks, and included suitable attributes and methods.
    In


    general, the basic format of a *.java* file defining a class is:


    *public class **classname** // the name of the class*


    *{*


    *// definition of attributes*


    *// definition of methods*


    *}*


    We saw in the last chapter that it is customary, but not compulsory, to define


    all the attributes of the class before defining the methods that make use of them.


    Both can be defined to be either *public* or* private*. The distinction is that
    anything


    defined as public is available to any program that makes use of the class, while


    anything defined as private is available only within the class itself. It follows


    that for the purposes of writing a program that uses a class we will be most


    interested in the things that are defined as public.


    A common practice is to define all attributes as private and all methods as


    public. This allows the programmer to control access to the values of the attrib-


    utes and so allows for a powerful mechanism called *data hiding*. We will keep
    to


    this convention in all the programs in this chapter, and indeed in all the pro-


    grams in this book, and you are recommended to do the same. The advantages


    of data hiding are explored in more detail in Chapter 13.


    So, the public part of the class normally specifies the methods that can be


    used on instances of the class (objects). It may also specify attributes but this
    is


    unlikely and is usually bad programming practice and so best avoided. The


    specification of a method tells a programmer using the class the name of the


    method, the type of value it returns (if any), the types of any values that it


    requires as parameters (if any), and finally provides one or more Java state-


    ments that carry out the method’s task.


    The file itself should be sufficient to explain completely and unambiguously


    what can be done with the class. Anything that is not totally clear in the *.java*


    file should always be explained by suitable comments.


    **Preparing to use a class**


    A program that uses a class is a said to *call* the methods of the class. It might
    be


    called the *calling program* of the methods. The program must be in the same'
