  md: 'While I type these words, my computer is running many other programs. The


    *operating system* itself (Microsoft Windows as it happens) is a program. I am


    using yet another program to choose which track to play on a CD; this program


    is using another program buried deep inside my CD drive to translate the data


    stored on the CD into sound. The CD itself was probably recorded on a machine


    that used many computer programs. Many of the instruments played to make


    the recording also contained computer programs.


    Computer programs can be found in devices ranging from mobile telephones


    through dishwashers to sports cars and fighter aircraft. All of these programs


    have one thing in common; a human programmer wrote them and went


    through much the same processes to write each one.


    Computers are pretty useless things without programs. On its own a com-


    puter is little more than a collection of wires, plastic, and tiny bits of silicon.
    On


    its own a computer would make a handy doorstop, and little more. It is only


    when a program is added to this collection of components that a computer


    becomes a useful tool. The development of computer programs is a fundamen-


    tal part of the development of computing.


    **A program**


    Here is a simple program. It is not the sort of program that can be used on a


    computer, but it *is* a program. It is, in fact, a recipe for chocolate cake.¹


    *Ingredients*


    *4 oz soft margarine*


    *4 oz caster sugar*


    *2 size 3 eggs*


    *3 oz self-raising flour*


    *1 oz cocoa powder*


    *Method*


    *Pre-heat the oven to gas mark 4, 325**F, 160**C.*


    *Beat the margarine and sugar together until the mixture is*


    *almost white.*


    *Beat the eggs one at a time into the mixture*.


    *Sift the flour together with the cocoa powder and carefully fold*


    *it into the mixture.*


    *Divide the mixture into two 6 inch round tins.*


    *Bake on middle shelf for 20 minutes.*


    *If desired, cover with melted chocolate.*


    *(Source: *Home Recipes with Be-Ro Self Raising Flour, *37th Edition, Rank *


    *Hovis MacDougall, 1982)*


    Although this may appear to have little to do with computer programming, this


    recipe shares many features with computer programs:


    ●It follows a format dictated by convention – all recipes look like this, with
    the


    ingredients listed first and then the method described step-by-step.


    ●It is written in a specialised form of language.


    ●This language has a vocabulary that someone reading it must understand –


    beat, sift, and fold are all terms that the person making the cake would need


    to understand.


    *Programming*


    13


    1


    You can try it, if you like. It’s really rather good.'
