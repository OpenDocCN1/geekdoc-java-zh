  - 宗教会。Sodalitas（“宗教会”）是一个与特定神灵相关的精英协会。该制度可以追溯到古代，其遗迹之一是萨特里石（lapis Satricanus），这是一块五六世纪的铭文，纪念了
    sodales（“同伴”）向战神献祭（见 Cosi 2002,15f;29f）。岳父与女婿之间表现出的谊被认为特别亲密，但其他的姻缘也能巩固友谊；当昆图斯将阿提库斯标记为
    Sponia 时，西塞罗与阿提库的支持得到了加强。相比之下，血缘（cognatio）与友谊之间会做出区分（例如 Cic. Fin. 5.65; Quint.
    4.7），而且在希腊思维中也是如此，亲属通常不视为朋友（197, 53ff）。尽管如此，即使在我们的文献中这种结合并不常见，但显而易见的是，在罗马共和国，cognatio
    和谊是兼容的范畴：例如 Cic. Ver. 2.2.64（维雷斯声称他与卢斯·梅图斯既是血缘也是朋友，后者为 cons. 68）；Ver. 2.4.72;
    Phil. 5.6; Rhet. Her. 4.69（友谊源于亲属关系）。无论何种，这里的指导原则是 necessito（亲密关系），这是一个包含了血缘联系和血缘亲关系的范畴（例如
    Cic. Ver. 1.19; Cl. 199; Sept. 6; Val. Max. 6.2.3; Sen. 3.18.1; Pl. Ep. 10.87.3;
    Gell. NA 13.3.4;见 Cosi 2002,15f;29f）。
