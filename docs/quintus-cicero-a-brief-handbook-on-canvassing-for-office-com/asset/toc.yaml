  - 42 按名字。在41 节中，昆图斯将这种技能指定为命名（nomenclature），其在罗马背景下的重要性在28节进行了讨论，显而易见，一个普通的罗马人被名字称呼非常高兴。为了完成成就，候选人经常聘用助手（nomenator）（见28节名字；III.5）通过提高对的熟悉而获得的赞誉：这样做标志着赢得民意的欢迎。
- - '##'
  - §94–43 评注
- - '##'
  - §43持续的努力。昆图斯在这里使用的词是 assiduit（勤勉），它是《简明手册》中典型的、强调刻工作的的一部分（参见 assiduos）。对他人施加持续且多样的行为是赢得受欢迎的（例如西塞罗，《离职》36），而缺乏精力（97）。
- - '##'
  - 44–44 评注
- - '##'
  - §44 慷慨。昆图斯选择了 benignitas，在罗马关于慷慨的讨论中，它与 liberalitas 是同义词（例如西塞罗，《论穆纳》77；《离职》20,
    §50）。benign ac liberal（慷慨且大方）。哲学观点认为慷慨不同于追求利益（例如西塞罗，《书信》32.2.1; 4.7; 拉比纽斯，《后信》43）。以及简单的礼物。昆图斯在这里没有详述，因为他主要关注个人的影响。贵族慷慨的各种形式，包括赠资金和提供财政援助（西塞罗，《离职》52;
    56）；提供宴会（《离职》55）；肉类礼物（《离职》55）；游戏。通过公元182 年的 lex Ochria 对候选人的宴会规模进行了限制（马克罗比乌斯》17.2–3；参见
    MRR 2.139）；作为比较，参见 Coloniae Genetiae（一份公元44年草拟的凯撒市政宪章）第132节中对候选人支出（包括宴会）的规定（RS
    416f = Cil 2.5439）。
