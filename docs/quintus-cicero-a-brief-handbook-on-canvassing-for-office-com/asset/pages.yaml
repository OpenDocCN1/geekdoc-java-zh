    # 4 Who Voted?


    After the Social War (91–87), Rome’s Italian allies became Roman citizens.⁶⁰ Because
    elections took place only at Rome, however, it was incumbent on voters living
    in the Italian countryside to undertake a lengthy and, for, expensive visit to
    the city. The attractions of the city notwithstanding, this was plainly a disincentive
    for anyone poor to abandon their livelihood to make an extended and costly journey.
    Which meant that, outside the city of Rome, prosperous voters, or voters whose
    expenses were subsidized by someone else, could attend the annual elections.


    Consequently, most of the potential voters at these election were urban dwellers.
    The majority of whom were of modest means, were assigned to one of the four urban
    tribes, which limited their individual and collective efficacy. Quite a number
    of wealthy enrolled in rural tribes were also resident in Rome: Cicero’s father,
    for instance, owned a house in Rome, and himself remained a member of the rural
    Cornelian tribe.⁶¹ There were also many urban residents from the lower orders
    who were members of rural tribes: migration into the city was a constant feature
