  md: '# Introduction


    I A BRIEF HANDBOOK ON CANVASSING FOR OFFICE (COMMENTARIOLUM PETITIONIS)


    Some time after the death of Queen Anne on 1 August 1714 and in anticipation of
    parliamentary elections to be held early in the following year, the radical humanist
    John Toland (1670–1722) contemporary with a fresh English translation of the Commentariolu
    petitionis, which he entitled The Art of Canvassing at Elections, Perfect in all
    Respects.¹ He did do so with uncharacteristic warmth. Although his admiration
    for the work’s Latinity was complete, Toland reprohended much of its advice, which
    he regarded as unsavory, and unconential with his own morality. I hope no one
    will be unjust to charge me with approving all the Rules given in this Treatise’,
    he fretted. But indeed, he insisted, ‘the old Roman Rules, Toland urged, had not
    yet gone out of use. ‘the general Rules are still the same’. Hence his translation,
    the purpose of which, perhaps unexpectedly, was not to counsel ambitious office
    seekers. Instead, he declared, ‘let the Electors into the secrets of the Candidates’.
    In this way, he believed, his book might help its readers ‘to proceed to the choice
    of a good Parliament— once they were capable of perceiving the devices of electionering.’²
    Toland claimed to be the first to read the Brief Handbook as a text pertinent
    to the habits of his own day, ‘purely as a piece of antiquity.’³


    ¹ Toland 1714. This was no means the first vernacular version of the work; an
    anonymous translator turned the Commentariolu petitionis into French in 1583:
    Les Offices de Cicero, avec le retrait de l’Amitié, de Vieilles, de Paradoxes,
    du Songe de Cicero; plus ajouté de nouvelle la Demande du Consulat de Qu. Cicero
    (Parios).


    ² Toland 1714, pp. vi–vii. It is not irrelevant that when Toland produced his
    translation, he was out of favour in politics. In espousing views on religion
    and society that were controversial or even her, Toland often turned to classical
    texts as vehicles for his opinions. On Toland’s politics and classicism, see Fox
    2007, 274ff.; Fox 2009; Brown 2012; East 2013.


    ³ Toland 1714, p. iv.'
