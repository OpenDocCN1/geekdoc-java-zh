  md: '# Elections 7


    (the position was naturally restricted to plebeians). By Cicero''s day, a tribune
    could initiate legislation, summon the senate, senatorial decrees, or forbid passage
    of a law deemed detrimental to the interests of the plebs. Some tribunes in the
    late republic exorbitantly exploited their position in order to make themselves
    controversial but often formidable figures. The tenure of their concentration
    focused on defending the rights of ordinary citizens without provoking the leading
    magistrates or the senatorial establishment.^23 The adleship and the tribunate
    offered abundant possibilities for expanding one''s reputation: men with their
    eyes on the consulship did not fail to compete for one or even offices.


    The praetorship and the consulship represented the highest regular magistacies
    in Rome. These offices conferred *imperium*, the power which permitted a man to
    command troops and administer justice in the city and abroad, *auspicium*, the
    authority to control and interpret the will of the gods on behalf of the Roman
