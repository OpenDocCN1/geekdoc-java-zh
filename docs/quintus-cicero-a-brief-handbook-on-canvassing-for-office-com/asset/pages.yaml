    # 5 Literary Borrowings


    The Brief Handbook exhibits striking literary parallels with Cicero''s Pro Mureana.366
    and In toga candida,367 both speeches were delivered later than the dramatic date
    of the Brief Handbook (the Mur was delivered in 63; Tog. cand. was delivered just
    before the elections of 64; see VII.5). If the Brief Handbook has filched phrases
    from either speech, then it be a later work and consequently cannot be what it
    claims to be.368


    The similarities between the Brief Handbook and Mur., a speech for the defence
    in a trial for illegal electionering (§55 bribery), derive mostly from their common
    trope, viz. canvassing of for. The exception to this is a matter, not of substance,
    but of technique. At §9, the Brief Handbook employs the device of imaginary dialogue:


    > His nobility does not surpass Antonius; does it? ‘No. But he has greater courage
    [Non. sed virtute]’


    This same technique is found at Mur. 73:


    The senate does not deem it a case to go out to meet a candidate, does it? ‘No.
    Only if it is for pay [Non. sed mercede]’. Prove it. To be attended by a multitude?
    ‘No. Only if they were hired [Non. sed conductus]’


    Even though Eussner dismissed this similarity as accidental, Nisbet regarded it
    as important on the grounds that the use of “mean to “no” is rare in literary
    Latin.369 Rare, perhaps even in subsists of republican literature there are several
    instances of this phenomenon that predicate the Brief Handbook.370 This similarity,
    like other similarities between the Brief Handbook and Mur., appears inconsequential.371


