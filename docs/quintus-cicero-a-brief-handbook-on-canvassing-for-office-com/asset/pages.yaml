    # 6 Raison d''être


    The basic reason for questioning the authenticity of the Brief Handbook resides
    in its unusual nature and uncertain purpose. It is obvious that Cicero did not
    require the advice contained in the Brief Handbook, nor was Quintus a recognized
    authority in electionering. and in any case it was enough for the two men, both
    of whom were in Rome at the time of Cicero''s canvass, communicate face to face.
    Nor is it easy to imagine a pressing need for a manual of instructions on the
    part of Cicero''s supporters or surrogates. This strange, even perplexing quality
    of the Brief Handbook was the point of Eussner''s argument against Quintus'' authorship,
    and it is this aspect of the text that sustains any doubts about its genuineness
    as an artefact of Cicero''s campaign for the consulship.¹374 Here the suggestion
    that it is some kind of fiction.


    The routine response to this concern about the Brief Handbook has been to view
    the work as a specimen of electoral propaganda, caused for circulation during
    Cicero''s campaign as a means of advertising Cicero''s attractions as a candidate
    and driving hostile attention to the deficiencies of his rivals.¹375 After all,
    when competing for office candidates as well as their supporters ordinarily promulgated
    letters and texts of other kinds (see III.8). Nevertheless, the Brief Handbook
    remains an extraordinary contribution to this brand of electionering bum, and
    it is sometimes suggested that although Quintus wrote the Brief Handbook, it was
    never in any sense allowed to be published.¹376 But perhaps it was hoping, that
    with its distinctiveness, it would make an extraordinary impression on readers.
    That the Brief Handbook designed whether or not it was actually circulated in
    64, is an approach to the work that is developed in detail in §IV of this introduction.


