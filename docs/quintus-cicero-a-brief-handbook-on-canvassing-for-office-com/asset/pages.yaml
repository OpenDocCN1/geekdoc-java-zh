    # Commentary to §1


    **mutual affection.** Quintus did not cite patriotism or political ideology as
    motives either for this essay or for his support of Cicero’s campaign, nor would
    his contemporaries have expected him to do so. He instead advertises his devotion.
    Affection (*amor*) was a dimension of *pietas*, the loyalty felt toward one another
    by members of the same family (see Saller 1994, 105ff.). And one’s family, for
    a political figure, remained a vital source of influence (¶16 by blood or by marriage).
    Brothers, it was assumed, would support one another in public as well as private
    life: ‘who is more bound by the bonds of friendship than brother with brother’
    (*Sall. I.* 10.5; see Bannon 1997, 99ff., on Quintus and Cicero). In his public
    letter to Quintus, Cicero declares himself motivated to write by his profound
    affection (*proper singulare amorem*), account of which he is for Quintus’ *glory*
    (Cic. Q. Fr. 1.1.45).


