    A Brief Handbook on Canvassing for Office.

    A Brief Handbook on Canvassing for Office. There is no indication that the Brief
    Handbook ever carried a formal title (Nardo 1970, 3 n. 1), though matters must
    remain unclear inasmuch as no ancient author refers to the work explicitly (Palmer
    1971, 387), and is wrong to detect a reference to the Brief Handbook at Cic. De
    or 1.5, nor does Pan. Lat. 3.16–17 reflect any acquaintance with the Brief Handbook,
    pace Nixon and Rogers (1994, 419). In manuscripts the work is routinely designated
    as the Handbook on Canvassing for the Consulship (commentarium consulatus petitionis),
    which aptly describes its contents. The conventional title adopted by modern editors
    derives from the work''s final sentence: ''I desire this brief handbook on canvassing
    to be deemed perfect in every respect''. With these words the author meant to
    indicate the title by which his work should known by Facciolati 1732, ii; Buecher
