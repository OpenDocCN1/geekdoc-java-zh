    although when he was staying at his house in Formiae, Cicero’s morning audiences
    went on to the fourth hour (Att. 2.14.2). Visitors waited in the vestibule or
    atrium (benches were sometimes provided: Gell. NA 16.5.8; Dio 58:5) given an opportunity
    to master the house, usually seated in a distinct area (tablinum) and assisted
    by a nomenclator, who helped him identify his guests (Plin. NH 29.12; see fig.
    2). Guests might solicit favours and in case exhibited for their host, who (ideally)
    reciprocated his guests'' courtesy.


