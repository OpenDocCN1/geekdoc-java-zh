    Now, vituperation was not entirely foreign to didactic epistles, (e.g., Inwood
    2007), and the employment of negative examples for the purpose of delivering lessons
    about positive behaviour was traditional in Roman society (e.g., Hor. Sat. 1.4.105–6).
    Still, Quintus’s deployment of invective here has more to do with electoral propaganda
    than the moral instruction of candidates.


    Canvassing entailed aggression. Consequently, invective was at once a natural
    and routine feature of any political campaign (Cic. Fam. 8.2.2; Planc. 85; Off
    1.38; Liv. 4.25.12; 22.34.2; See Steel 2001), a reality recognized by Quintus
    at §52, where he urges Cicero to smear his rivals’ reputations. Vituperation was
    a regular feature of Roman oratory and was so common to political and forensic
    discourse alike (indeed, it was deemed essential to forensic oratory: Cic. Font.
    37; Mur; I; C. 6–8). Romans tended to attack their opponents by way of a broad
    array of aspersions, on the view that any moral lapse in an individual implied
    every moral lapse (Cic. Inv. rhet. 233; Rhet. Her. 2.5), and that is also the
    pattern one found in the Brief Handbook. These invective tropes were largely conventional
    and staples of a rhetorical education (e.g. Cic. Inv. rhet. 1.34–6; 22.28–31;
    Rhet. Her. 3.10–15). At §54, suggests suggests ineffective against a good candidate
    (§54 escape animosity, gossip).


    Romans resorted to calumni in order to credit and shame their opponents and set
    themselves as foils to their opponents’ voices. In this way, invective as moralizing
    could be regarded as a service to the larger community, in addition, if invective
    was done with style, it could be highly effective and reflect well on the intelligence
    and education of the reprover (Cic. de or. 2.236). How seriously invective was
    taken by audiences, or even by its recipients, is unclear to us and in any case
