  md: '# Acknowledgements


    My work on this commentary, begun some years ago, was interrupted by a personal
    crisis and would not have been taken up again were it not for the kindness and
    patience of the editors of this series, especially Miriam Griffin, John Marincola,
    and Susan Treggari. Others have also been encouraging, not least Jerzy Linderski
    and Robert Morris-Marx. I am grateful to audiences at universities in Australasia,
    Europe, and America, who listened to my ideas and responded with valuable comments.
    This commentary also benefited my participation in workshops organized by Cristina
    Rosillo López in conjunction with her project, Opinión pública y comunicación
    política en la República Romana, sponsored by the Spanish government. I enjoyed
    financial support from the Joint Research Committee and the Joint Leave Committee
    of the Faculty of Humanities and Social Sciences at Victoria University of Wellington.
    I also received a very generous Marsden Grant from the New Zealand Royal Society.
    I want to express my gratitude to the Institute for Advanced Study in the Humanities
    at the University of Edinburgh and the Institute for Classical Studies at the
    University of London for providing me with congenial settings in which to work.
    I could never adequately whom John Hall, Chris Pelling, Robin Seager, or Susan
    Treggari, each of whom read a draft of the entire commentary. They saved me from
    numerous errors and offered me suggestions so superb that I eagerly seized upon
    them all. They should not be held responsible for whatever wrongheadedness or
    blundering remains. I am also grateful to the staff of Oxford University Press,
    especially Charlotte Loveridge and Georgina Leighton. Rosemary Roberts has done
    so to improve this book I hardly know how to begin to thank her. My greatest debt
    is to Diana Burton. She has never complained when her attentions were distracted
    again and again from her work on Greek religion, and I have learned a lot from
    our conversations. And she continues to make life fun. This book is dedicated
    to her.'
