    # III CANVASSING


    # 1 Introduction


    Elections were the traditional environment for an annual collision between the
    paired principles of republican government: the people''s majesty (*maestas populi
    Romani*) and the senate''s authority (*senatus auctoritas*).⁷⁷ Though potentially
    volatile, this political physics directed itself towards social consensus, during
    the final weeks of every campaign, when candidates occupied themselves with morning
    assemblies and parades through the forum, meeting and courting all classes of
    the electorate.⁸ The people remained uncertain until the votes were counted: again
    and again ours comment on the unpredictability of elections and regard the shock
    experienced by favoured candidates when they were unexpectedly surpassed. Rejections
    of individual candidates by the people (*repulse*) constituted indispensable proof
    of the people''s sovereignty and the voters'' independence.⁹⁹ This is why candidates
    had to beg for office: the language of canvassing—*petitio* (''a request''), *rogare*
