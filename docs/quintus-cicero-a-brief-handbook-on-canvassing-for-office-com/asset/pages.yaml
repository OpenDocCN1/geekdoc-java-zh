  md: '# Elections


    diplomatic service, forensic labours in the courts, tendering legal advice, tenure
    of one of the minor magistracies—all exhibited their fitness for election to high
    office. In selecting their magistrates, the Roman people did not seek political
    representatives, as is the case in a modern liberal democracy, but rather leaders:
    whose personal superiority made them reliable repositories for enormous responsibilities
    and powers.¹³ In Rome, a magistracy was a *honor*, an honour awarded in recognition
    of a man''s merit (*merit*) and reputation (*dignitas*).⁴ It was through election
    to office that a man qualified for enrolment in the senate, and all magistracies
    lay in the gift of the Roman people.¹⁵ Hence the centrality of elections, and
    the canvassing that preceded them.¹⁶


    # 2 Magistracies


    In Cicero''s time, one ordinarily entered the ranks of the senate after serving
    as one of twenty quaestors.¹⁷ This office was also open to plebeian and patrician
    alike, and the minimum age for standing was apparently 30.¹⁸


    1967, 11ff.; Flower 1996, 91ff.; Rosenstein 2006; Hölkeskamp 2010, 76ff.; Tatum
    2015 (with further bibliography).


