    +   ⁵ See the detailed account by Mue 2006.

    ⁶ Livy, in instance, rarely details himself in discussing political campaigns
    (but see Liv. 22.3.1–35.4; 27.7.1–9; 35.1.10; 37.5.9–58.2; 39.3.1–15; 39.4.1–41.4).
    Other historians are comparably selective. Plutarch, too. Still, every scrap of
    evidence matters. Although Marius election to a consulship of 107 was untypical,
    Sallust’s account of it (Sall. lug. 64.3–65.5; 73.1–7) remains intact. See, further,
    for sources added in III.


    +   ⁷ See, for instance, Taylor 1949, 62ff; Gruen 1974, 138ff; Tatum 1999, 22ff;
