    synonymous with *liberalitas* in Roman discussions of generosity (e.g. Cic. Mur.
    77; Off. 1.20, §50 benignum ac liberalem (‘generous and munificent’); see Helougarc’h
    1963, 217ff.). The philosophical view insisted that generosity is different to
