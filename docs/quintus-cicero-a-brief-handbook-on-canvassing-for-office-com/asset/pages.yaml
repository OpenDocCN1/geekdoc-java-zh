    # 2 Transmission


    The Brief Handbook, although it takes the shape of a letter from Quintus to Cicero,
    has not come down to us with Cicero''s Epistulae de Quintum fratern (Q. Fr.) but
    is instead transmitted in conjunction with Cicero''s correspondence alongside
    Familiares (Fam.).³346 In this it is perhaps nothing surprising; our letter to
    Cicero by Quintus³347 as well as Quintus'' letters to Tiro³348 are preserved in
    Fam. and not in Q. Fr. Still, the Brief Handbook is not actually a part of Fam.
    and it is from the best manuscript that supplies us with a text of Fam.³349 This
    omission has been deemed by some to be a significant sign that the Brief Handbook
    is a spurious work. Furthermore, our earliest manuscripts containing the Brief
    Handbook include alongside certainly pseudepigraphical text from Cicero to Octavian
    (Epistula ad Octavian—Ep. ad Oct.), and this propinquity has suspected of guilt
    by association.³350 But the Ep. Oct. is preserved in several early manuscripts
    where it is included not with the Brief Handbook but works like Q. Fr. and Epistulae
    ad Atticum (Att.).³351 Put differently, association with the Ep. Oct. in our manuscript
    traditions is not an obvious indicator of anything regarding an ancient or very
    early perspective on the authorship of the Brief Handbook. These works, in every
    case, were ultimately bundled together because they were epistles in some way
    linked to Cicero. As for the Brief Handbook''s omission from Florence, Laur. 49.9
    is not easy to divide its significance. Laur. 49.9 is the surviving complete manuscript
    of Fam. When the Brief Handbook appears in early manuscripts, it is always in
    company with Fam. 9–16 in a manuscript tradition that is, in noticeable respects,
    independent from Laur. 49.9.³352 If the design of Laur. 49.9 centred supplying
    a full and superior version of Fam., there was no real reason why it should include
    the Brief Handbook. In any case, the transmission of the Brief Handbook is clearly
    not decisive for the question of Quintus'' authorship.


