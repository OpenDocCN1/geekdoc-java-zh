    one of three possibilities will explain them: (i) the author of the Brief Handbook
    cribbed Cicero''s speech; (ii) Cicero borrowed from the Brief Handbook; (iii)
    each work depends on a common source. The question of priority between the two
    works cannot be decided by comparing their merits. Literary theft is by no means
    invariably the operation of a weaker writer. In this regard, it is perhaps worth
    recalling that two of the most memorable phrases of American presidential oratory—‘We
    have nothing to fear but itself’ (Franklin D. Roosevelt) and ‘Ask not what your
    country can do for you but what you can do for your country’ (John F. Kennedy)—were
    each of derived from humble, even pedestrian contexts.³² Which means it is far
    from necessary to insist that the Brief Handbook has borrowed from Cicero''s speech.
    Though that must remain a possibility.


    There is no real, however, to think about the relationship between the Brief Handbook
