    document flagged by a footnote alerting readers that any approach to the work
    must remain provisionary owing to questions regarding its authenticity. A few
    scholars remain explicitly agnostic, and fewer still reject Quintus'' authorship
    outright.


    The primary basis for querying Quintus'' authorship resides in what has been deemed
    the work''s unclear purpose. Simply put, why should Quintus write a letter to
    his brother proffering advice on a subject in which Marcus was so much more experienced?
    And why would he write it in so highly a style? And, if the letter was intended
    for a wider public, why include so many restrains of an ostensibly cynical nature
    which could potentially damage the reputations of both brothers? Prompted by these
    questions, scholars turned their attention to other aspects of the work, especially
    to similarities in expression or idea found in texts by Cicero who appeared later
    than the dramatic date of the Brief Handbook. Anachronisms and errors, too, which
    would point to the work''s later composition, were looked for.


    No indisputable proof has found that the Brief Handbook is anything other than
    what it appears to be, a point that is universally considered. Controversies over
    authenticity are difficult to settle, and even the sheer expended in attempting
    to do so may prove counterproductive. It is all too easy—to fish a phrase from
    Pope''s D—to explain a thing till all men doubt it. And it is formally impossible
    to prove categorically that any work goes unmentioned in antiquity is in fact
    what it claims to be.³344


    In order to aid readers making up their own minds, a guide to the particulars
    of the central arguments for and rejecting Quintus'' authorship is provided below
