  md: '# Introduction


    ‘Tullius’ is the *nomen*, or hereditary name of Cicero’s clan (gens); ‘M. f.’
    abbreviates ‘son of Marcus’, which indicates the *praenomen* of Cicero’s father
    (the remainder of whose name then can be inferred from his son’s name); similarly,
    ‘M. n.’ abbreviates ‘grandson of Marcus’; ‘Cornelia’ indicates to Rome’s thirty-five
    tribes Cicero belonged; ‘Cicero’ is Cicero’s cognomen name which was originally
    an unofficial nickname given to an individual that some families (Cicero is an
    example) elected to preserve (see Pl. Cit. 1.3–5 for the origins of Cicero’s *cognomen)).
    *Quintus* complete name was Q Tullius M. f. n. Cor. Cicero. The habits of Roman
    nomenclature, never ever static, changed in important ways during the imperial
    period (see Salway 1994, 124ff.).


    Reference to another Roman by a single name can indicate familiarity, familiarity,
    or contempt (see Adams 1978, 145f.; 161; Dickey 2002, 36ff.). An example of this
    is *Cic Phil.* 13.22, where Cicero castigates Mark Antony for omitting addresse’
    offices—Antony had written to Hirtius and Caesar—in a public letter in which he
    clearly intended to convey contempt. *Quintus’ salute to Cicero at the commencement
    of the *Brief Handbook* obviously indicates informality and familiarity. At 98,
    Antonius, Catiline, Sabidus, and Panthera are all of them referred to by a single
    name, only: in his correspondence, Cicero refers only to ‘*Sulla* is a different
    name. The reference to L. Cornelia Sulla (on whom *99 Sulla*). Quintus conforms
    to Ciceronian practice by referring to Sulla this single name only: although,
    in his essays, he sometimes prefers ‘*Lucius Sulla* (Off. 143, 109; 3.87; *Brut.*
    179, 227). Sulla’s singular stature in the decades after his dictatorship renders
    him a special case.


    Outside contexts that require the *nomen*, the regular Ciceronian practice (which
    can be assumed to be typical of republican practices) is to refer to living members
    of the nobility by *praenomen* and cognomen, the individual’s distinguished *nomen*
    being too obvious to require mention (see Syme 1979, 361ff.). There is no clearly
    consistent practice for families outside the nobility (see Shackleton Bailey 1995,
    2ff.). Quintius adheres to the same practices as Cicero: see, e.g., the names
    expressed at ¶95 and 7.


