    are expressed in the commentary, where alternative translations are furnished.
    Since the publication of Watt’s edition, Nardo 1972, Shackleton Bailey 1988, and
    Shackleton Bailey 2002 (with English translation) have appeared. Each is a useful
    edition. The best and most concise discussion of the manuscript tradition of the
    Brief Handbook remains Watt 1958b, Watt 1958a, 79ff is also important. Nardo 1972,
    7ff is helpful in furnishing details missing Watt 1958a and 1958b; he also includes
    a very bibliography of prior work on the text of the Brief Handbook.


    For readers who will make Watt’s Latin text, I have supplied, in Appendix B an
    explanation of the abbreviations and references employed by him in his critical
    apparatus. I have introduced one important change. In his apparatus, Watt routinely
    made cross-references to other passages in the Brief Handbook by citing the page
    numbers in his edition. Because those page numbers will mean nothing in this edition,
    I have replaced them with specific chapter references. For example, instead of
    Watt’s *cf. p. 19.11*, which indicates line 11 on page 193 of his edition, the
    reader will now find *cf. 3.11*, which indicates line 3 of the Brief Handbook,
    line 11 on the pertinent Latin text.


