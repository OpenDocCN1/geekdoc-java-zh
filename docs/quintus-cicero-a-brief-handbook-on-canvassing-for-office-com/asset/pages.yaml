    # 4 Cynicism


    The *Brief Handbook* has been criticized for its cynicism by scholars who do not
    doubt its authenticity.³555 Concern has been registered over its deployment of
    invective, and its concentration on winning the favour of Pompeius has been viewed
    with distaste, not least because the *Brief Handbook* is not shy about emphasizing
    the sheer instrumentality of Pompeius mass popularity. Invective, however, was
    a staple of Roman political discourse (see§VII.5). And Pompeius''s support was,
    in fact, important to Cicero''s campaign. As for Cicero''s on-again off-again
    approach to popular principles, which was hardly remarkable on the part of members
    of Rome''s political class.³356


    More serious, is the charge that the *Brief Handbook* endorses a dishonest dealing
    with the Roman public, especially in its discussions of ingratiation (§42) and
    generosity (§44–8): In these sections of the work, its author makes it clear that
    the behaviour can only compromise Cicero''s moral standards, and this advice


