    The exertions of family, friends, and followers were certainly indispensable in
    projecting a candidate’s preferred image, exhibiting the scale of his influence,
    aiding him in expressions of generosity, by such expressions legal or otherwise.211
    It is in this context that the services of sodalitates, electionering societies,
    become important: these were organizations equipped with connections and other
    resources capable of facilitating a candidate’s outreach to the voters without
    removing him from the conspicuous pageantry through which he was obliged to cultivate
    the public—and, if he was willing to stoop to dishonesty for winning the people,
    or to turn a blind eye when others did on his behalf, sodalitates offered him
    a degree of cover and deniability.212


    # 11 Tactics: Addressing Political Issues


    It is clear from the preceding discussion, that contrary to the habits of modern
    political campaigns, canvassing in Rome rarely involved political speeches. Stump
    speeches were rare.213 To some degree, this was because they were difficult to
    stage: the right to address the people was the prerogative of magistrates; consequently,
    if he desired to speak, a candidate was obliged to seek an official’s invitation
    to do so. Or he must find a suitable occasion, like a senatorial debate, in which
    praise his merits or denounce the inadequacies of his rivals, something Cicero
    managed when he delivered In kinda.214 But although it was possible to work around
    the convention against stump speeches, few did so—doubtless not for respect of
    the convention itself, which existed, at least in part, to focus Roman canvassing
    on what was deemed by all to be the crucial concern: the extent of a candidate’s
    gratia.215


    It is generally maintained that, apart from a handful of exceptional episodes,
    elections were political in nature. Owing to the absence in Rome of political
    parties, or even strongly divergent political ideologies, personal qualities and
    individual influence remained the central factors in competition for office.216
    And this was a desirable state of


