    of the ostensibly provisional character of commentarii, see $IV.3. Requests for
    correction are also a characteristic of didactic writing (e.g. Cic. Inv. rhet.
    2.9; see Peter 1901, 257f.). Consequently, there is no reason to see in Quintus’
    request for Cicero’s revision any sign that the Brief Handbook (which is the view
    of Bruhn 1908, 262f; Clift 1945, 102f; Richardson 1971, 439).


    brief handbook on canvassing. Here Quintus describes his letter to Cicero as a
    commentarium petitionis. In this way, Quintus emphasizes the work’s practical
    and traditional qualities: on the cultural significance of the Brief Handbook’s
    association with the genre of commentarii, see, further, $IV.3. On the modern
    employment of this expression as the work’s title, see A Brief Handbook on Canvassing
    for Office.


