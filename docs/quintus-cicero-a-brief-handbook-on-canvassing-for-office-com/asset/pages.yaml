    enjoyed the right to attend senate meetings and vote (the sententiae dicendi,
    also expressed by the phrase quibus in senate sententiam diceret: 45L; Gell. NA
    3:8 (=RS 193ff); lex Tarentina (=RS 30ff); Cic. Luc. 14; see StR 3.858.,


    > 20 Roman magistracies: Lintott 1999a, 94ff; Feig Vienna 2014, 64ff. Minor magistracies:
    Wiseman 1971ff; Lintott 1999a, 137ff. Size and character of the senate: Lintott
    1999a, 65ff; Stella 2004. MRR 2.74ff, 2013b. Revision of the senate''s membership
