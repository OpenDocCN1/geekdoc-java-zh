    # 3 Clientela, Factions, Rome et Gratia


    Until recently, elections in republican Rome were deemed to have been dominated
    and determined by the elite and especially by the nobility, apart from terrible
    exceptions when violence or corruption disturbed normal practices. Powerful figures,
    it was thought, managed the votes of the lower orders by way of the institution
    of clientela, the bond between patron and client. Thus Syme could explain Cicero’s
    election to the consership by adjoining his domesticated conservatism and his
    obvious attraction to anxious members of the aristocracy: “The oligarchic knew
    their man. They admitted Cicero to shut out Catilina.”¹¹⁸ The idea that clientela
    was central to the outcome of elections, however, has been demolished by a succession
    of important studies. This is not to say that grandees did not endeavour to exercise
    their influence on behalf of candidates they favoured, but rather that, voters
    were subjected to a broad array of appeals during a contest, of which the tie
    between a client and his patron was only one, it was impossible to be sure which
    appeal would matter most when polling began. Furthermore, since the introduction
    of the secret ballot in elections, introduced by the lex gabinia of 139,¹¹⁹ voters
    were relieved of any intimidating scrutiny on the part of the elite.¹¹²⁰ Means
    that, during the late patrons never controlled their clients, and Romans of the
    lower classes possessed, at elections, a significant degree of independence.¹¹²¹


    Neither the Roman people, nor their political leaders, organized themselves into
    resembling modern political parties.¹¹²² There were many reasons for this: the
    political principles held by members of the governing class, though genuine and
    heartfelt, varied little, and there existed no creditable interest in altering,
    much less upsetting, the foundations of republican society. Political controversies,
    when they arose, usually dealt with issues of a very specific and narrowly defined
    kind, and were animated by much personal rivalries and personal affiliations as
    they were by instincts about the wrong or right course of action. The alliances
    they spawned to be ad hoc and short-term, though naturally some politicians were
