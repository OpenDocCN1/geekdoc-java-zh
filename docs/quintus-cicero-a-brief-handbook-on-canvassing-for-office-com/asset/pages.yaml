    have at your disposal for palluating your condition as a new man, it seems the
    right moment to discuss the sheer gravity of your campaign for office. You are
    seeking the consulship. There is no one does not judge you worthy of that office,
    but there are many who are resentful of you. This is because, although you are
    a man whose station was that of a Roman knight, you are now seeking the state’s
    highest station—so much the highest that this office confers greater dignity on
    a man who is brave, eloquent, and blameless than it does on all others. Do not
    think those who have held this office to recognize how great your prestige will
    be once you have attained the same office. I very much suspect that your ancestors
    are envious of you, except for those who are closely attached to you in friendship.
    I suppose that even the new men who have reached the praetorship, except for those
    who are obligated to you by a previous favour, hope that they will not be surpassed
