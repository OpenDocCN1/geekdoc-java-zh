    become part of any proceedings against him.⁴³⁵ Little could be confidently inferred
    about this poem. It was, says Cicero, to use Quintus during his campaign for the
    aedileship in 66 BC, so doubtless was a caustic epigram likely to give offence.
    But to whom, and why? Perhaps to the average Roman voter, since aediles were widely
    agreed that the lex Aurelia attacked in these verses was the law of 70 dividing
    juries into groups of senators, knights, and tribuni aerarii, and it is easy to
    see how a complaint against measure could be deployed effectively in any actual
    trial.⁴⁶ However controversial at the time, however was the lex Aurelia of 75,
    which removed the prohibition on ex-tribunes holding higher offices—and Quintus
    held strong views against the tribune.⁴³⁷ In the political climate of 58 BC, when
    the tribune Clodius held sway on account of his exploitation of populist sentiments
