    that the work is a public letter, a kind of document that had become familiar
    in Roman politics by the second century and pervasive in the late republic.²63


    As early as fifth-century Greece, epigraphy had become a richly phenomenon. In
    addition to their personal and practical uses, letters had elements in the construction
    of history (letters embedded in Herodotus and Thucydides) and of drama (the letter
    is a favoured device of Euripides).²64 By the fourth century, and increasingly
    throughout the Hellenistic period, letters could stand alone as independent works,
    the contents of which included political persuasion (e.g the letters of Plato
    and Isocrates), philosophical instruction (e.g the letters of Epicurus) and, eventually,
    any academic topic, such as mathematics (the letters of Archimedes) or literary
    criticism (the letters of Dionysius of Halicarnassus). And letters could be composed
    in verse as well as prose. Many letters were fictitious, whether imaginary or
    addressed to a historical correspondent under counterfeit circumstances or composed
    by a literary impersonator. Such letters were not always written for the purpose
    of fraud, but instead deployed their overall effect on readers.²65


