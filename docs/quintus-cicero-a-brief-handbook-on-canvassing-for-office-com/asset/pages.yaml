  md: '# Introduction


    After relinquishing office, an ex-quaestor entered the senate.19 His subsequent
    career in that body required no further public election; in principle, senators,
    unless deprived of their civil rights on account of criminal actions, be ejected
    only for immorality or personal financial lapse. After Sulla''s reforms, the size
    of the senate, though enlarged from its earlier numbers, probably did not exceed
    600 and could regularly remained well under 500. A sizeable portion of these men
    will have advanced no further than the quaestorship.20


    Ambitious senators naturally sought higher offices. The lex villa Annal of 180,
    the terms of which were largely preserved in Sulla''s annals of 81, established
    a fixed, compulsory cursus honorum (''sequence of magistacies'') consisting of
    quaestorship, praetorship, and consuls. Although no one was obliged to go the
    quaestorship, anyone seeking the consulate had first to serve as praetor. The
    minimum ages for seeking these magistracies were set at 39 and 42, and between
    magistacies of two years was compulsory.21


    Other opportunities for public service, and therefore advancement, existed outside
    the cursus honorum by way of the aedil and tribune of the plebs. In the late republic
    there were four aediles in each year: two plebeian and two curule a (the latter
    position was open to patricians). Aediles looked after the material fabric of
    the city, supervised the markets (especially the grain), and administered the
    public games of the Roman people. Especially the sponsorship of games, entailed
    considerable personal expense. Still, the resulting celebrity and gratitude were
    significant in the competition for the higher offices.22 Ten tribunes of the plebs
    were elected each year


