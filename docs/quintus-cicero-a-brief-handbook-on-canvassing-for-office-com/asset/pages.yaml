    form and in a logical order matters which, in practice, appear unrelated and indeterminate''¹
    We have an approach that reflects a habit of mind reaching back to the Greek sophists,
    and in a far more developed version, was characteristic of the writings of Plato,
    Aristotle, and nearly all subsequent philosophers.¹¹¹ This is what we may feel
    clearly describe as technical writing.


