    # 4 Didactic Epistle


    The Brief Handbook is not simply a public letter that denotes itself a handbook:
    it is a didactic epistle, an identification made clear by the contents of the
    letter and especially by the style and organization of 16–53, the portion of the
    work in which Cicero is offered detailed lessons in the matter of canvassing.
    Putting letters to work as a medium for instruction, resulted in something like
    an essay or treatise in epistolary form, originates in classical Greece in the
    writings of Isocrates. His practice was soon taken up by others and became widespread
    in the Greek world. A central figure in this development was Epicurus, many of
    whose letters were nothing short on his philosophical system.293 But Epicurus
    was by no means resorting to didactic epistles.


    Purists disapproved of the practice, especially when such letters departed too
    far from the personal and formal expectations of epistemology: ''sometimes we
    write to cities and kings: admitted this kind of letter ought to be in way slightly
    more elaborate, as one should adapt to the person being written to, but not so
    as to become a treatise rather than a letter, as is the case with Aristotle''s
    letters to Alexander and Plato''s letter to Dion friends,'' complained pseudo-Demetrius.294
    Letters of this ilk, he averred, were not ''letters in the true sense, but prefixed
    with ''dear so-and-so,'' which is the case for many of Plato''s.295 Notwithstanding
    these reactive structures, however, didactic epistemology flourished in the Hellenistic
    period, and as was the case with Greek public letters generally, soon made a strong
    impression on Roman literary sensibilities.


