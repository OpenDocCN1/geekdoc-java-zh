    The introduction also examines, in IV, the literary dimensions of the Brief Handbook.
    This is a facet of the work, which we have seen, that is crucial to its proper
    interpretation as a historical source. The question of the work''s authorship,
    although nowadays perhaps less central to the study of the Brief Handbook than
    in the past, is considered both in V and at relevant points in the commentary.


    In keeping with the orientation of this series, references to modern scholarship
    have emphasized works in English whenever doing so possible or responsible. As
    a consequence, my citation of work in other languages is uneven. And although
    this commentary, like every commentary, offers to its readers adequate guidance
    towards previous and pertinent scholarship, its bibliography is far from exhaustive,
    even in the treatment of work in English. But it''s a good start. And that is
    what this commentary aims to be. In the many parallel universe of David Lodge''s
    academic novels, the professional passion of the irreplaceable Professor Morris
    Zapp is to complete a series of commentaries on Jane Austen that will shut down
    all further criticism, thereby leaving all other scholars for time with ''simply
    nothing further to say.'' It will be obvious that that is not a goal of this commentary.


    # II ELECTIONS


    # 1 Introduction


    Roman government consisted in the official exertions of the senate, the people,
    and their magistrates. The collective authority of the senate lent it precedence
    in public affairs, and its membership constituted Rome''s aristocracy. Senators
    deemed all to be optimi, the best men of the city, a status they asserted largely
    on the basis of their personal dedication to the civic health of the republic
    and especially on the basis of their achievements as magistrates; the routine
    description, by many scholars, of the Roman aristocracy an ''aristocracy of office''
    (Amitsadel). The occupations of young aspirants to the senatorial order—military
