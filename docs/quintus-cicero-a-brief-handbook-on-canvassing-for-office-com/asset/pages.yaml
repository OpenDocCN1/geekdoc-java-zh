    Which is not to say Cicero failed to benefit from contemporary anxieties and the
    solutions put forward to resolve them. During his campaign, it is clear, Cicero
    took advantage of the conspicuous hostility felt against men who had profited
    from the Sall productions by underscoring Catiline''s alleged atrocities during
    very time (see9 citizen slaughter). More effectively, he, or his supporters, successfully
    stimulated public concern over illegal electionearing that a senatorial decree
    demanded the postponement of elections and the promulgation of legislation against
    corrupt practices. This decree was vetoed, for reasons that may not have been
    indisputable, but the occasion allowed Cicero both to defame his rivals and speak
    out in favour of honest elections.226 Now this was unquestionably a political
    issue, a matter of state, but it was hardly a controversial one—no one in Rome
    championed corruption—did it draw attention to any ideological rift on the part
    of the senatorial order. Instead, it was controversial of a familiar kind and
    it permitted Cicero to set himself apart from his competitors in the highly conventional
    turns of Roman morality. As such, for voters inclined to see in Cicero a sound
    and serious candidate, a welcome confirmation of their existing attitude. Cicero''s
    case, then, although his campaign was not free from any engagement with politics,
    political issues were not central to his canvassing.


