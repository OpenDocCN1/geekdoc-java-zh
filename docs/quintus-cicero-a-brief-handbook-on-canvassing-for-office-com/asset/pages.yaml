  md: '# Introduction


    This is an attitude towards the work that persists.⁴ For most readers, however,
    it is not a repository for insight into contemporary politics but instead a guide
    to ancient Roman electoral practices, and to the attitudes and expectations animating
    them, they turn to the Brief Handbook. This was true early on. In Book Three of
    his pathbreaking Roma triumphs (1459), the first scholarly attempt to reconstruct
    accurately and in the details of Roman elections, including canvassing for office,
    Blando Flavio relieved extensively on information supplied by the Brief Handbook.⁵


    On its surface, the Brief Handbook is a letter from Quintullius Cicero to his
    elder brother, advising him on the best of canvassing for the consulship. In doing
    so, the Brief Handbook supplies us with what is by our fullest account of campaigning
    for office in republican Rome. Although elections and canvassing were central
    to Roman civic life (see below, §§II–III), our resources for recovering the Romans’
    experience of each are less ample than we desire. It is especially true of canvassing
    for office. We are fortunate in possessing Cicero’s speeches In Defence of Murena
    and In Defence of Plancius, delivered at trials for illegal electionearing, as
    well as several letters by which he examines in practical terms the likely success
    or failure of various candidates for office. And, although they are in date, the
    thousands of campaign notices that survive from Pompeii are illuminating in ways.
    These glimpses of canvasing are especially precious because ancient historians
    and biographers, notwithstanding their habit of reporting the results of elections,
    do not often describe in detail what preceded them, and when they do it is usually
    on account of events that were out of the ordinary.⁶ is why the Brief Handbook,
    which describes quotidian aspects of canvassing in detail and at length, is so
    a valuable resource. Furthermore, because the Brief Handbook closely scrutinizes
    relationships between different sections of Roman society, modern historians turn
    to the work and again


