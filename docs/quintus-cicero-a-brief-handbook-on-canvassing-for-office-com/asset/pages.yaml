  md: '# A Brief Handbook on Canvassing for Office


    information on a broad range of topics such as group identities, Roman friendship,
    and civic rituals. 8


    Looking beyond the surface, however, is a good and routine scholarly habit. Students
    of the Brief Handbook have naturally and rightly queried its purpose and origin.
    It is not obvious why Quintus give advice to his more distinguished and experienced
    brother. For whom, then, was he writing? Not is the medium of advice that an immediately
    straightforward specimen of Roman correspondence. Why is the Brief Handbook put
    together in the way it is? Arguments have been advanced that the Brief Handbook,
    on the surface anyway, is too implausible to be what it claims to be and therefore
    isn''t. Attention is drawn to the work''s status as a kind of didactic epistle
    extended, perhaps, not for Cicero, for a broader audience. Perhaps, it is suggested,
    the Brief Handbook played as a propaganda in Cicero''s campaign. Or perhaps the
    letter was not composed by Quintus at all and is instead an imperial forgery of
    some kind, a conclusion that, if true, must affect the uses to which the Brief
    Handbook can be put by modern historians. Each of these matters is taken out in
    the following sections of this introduction and they recount the notes in the
    commentary. In some ways, if from a distinctly different perspective, these questions
    take us back to aspects of John Roland''s early engagement with the Brief Handbook.
    What kind of readership was envisioned by his author? What is the nature of the
    advice proffered by the work? And what was the reaction the work intended to provoke?
    No historical concerning the Brief Handbook can responsibly evade these issues.


    The purpose of this volume is to offer readers in aid their appreciation of the
    Brief Handbook as a literary text, an ideological document, a likely specimen
    of electoral propaganda, and a resource for recovering various aspects of late
    republican political and cultural history. With that in mind, this introduction
    supplies the reader, in sII, with a concise account of the nature and practices
    of elections in the late republic; in sIII, with a survey of the expectations
    and habits of canvassing for office. I also rehearse, inVII, particular aspects
    of Cicero''s career that exhibit his skills as an office seeker and provide the
    necessary context for understanding his campaign for the consul십 in 64, a context
    that is simply taken for granted in the Brief Handbook. Notes in the commentary
    frequently refer to what the reader can find, in a fuller, and it is hoped, more
    comprehensible narrative account, the relevant aspects of events or speeches that
    the Brief Handbook cites only in passing and too


