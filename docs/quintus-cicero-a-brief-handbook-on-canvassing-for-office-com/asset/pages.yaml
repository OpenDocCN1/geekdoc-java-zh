  md: '# Commentary to §12 215


    mastery of these practices was an asset belonging to Coelius, noble rivals (see
    §11 matchless technique and assiduousness).


    **required by your present situation.** By ‘present situation’ (*tempus*) Quintus
    plainly refers to Cicero’s canvas. Quintus, naturally enough, often resorts to
    *tempus* in order to underline the urgency of canvassing (see §44, 19, 21, 24,
    38). At the same time, the traditional methods of canvassing were not entirely
    suited to aristocratic tastes (see §III.4), and Quintus also deploys *tempus*
    in order to emphasize the very circumstances of canvassing and the peculiar moral
    conditions canvassing entails (see especially §25, 45–6; §16). Cicero uses *tempus*
    in this sense, and by making it clear that canvassing presents a candidate with
    extraordinary demands, *Att.* 1.1.4. He makes a similar distinction, when political
    and philosophical inclinations pull in different directions (Off. 2.57–8, a philosophical
    exception to Off. 2.55; Off. 2.60). A concern over this issue animates Cicero’s
    *De republica* and *De legibus* (Atkins 2013, 62ff., 188ff.). As a practical matter,
    the Romans relieved, unsurprisingly, that the exigencies of any situation might
    dictate their behaviour (e.g. *Cic. Cul.* 139, on Cicero’s reaction to his *tempus*;
    see *Cic. Fam.* 1.19.18; 1.9.2; *Inv. rhet.* 2.15–78; *Quint.* 3.5.18 (5.103–5).
    But Quintus’ usage here is also influenced by contemporary philosophical interests.
    Cicero, in his philosophical writing, was preoccupied by the relevance of circumstances
    to right action (Woolf 2007; McConnell 2014, 39ff.). At *Off.* 1.31–2, he employs
    the word *tempus* in translating the Greek *peristasis* as a technical term for
    a situation that was, in moral terms, how special or even difficult (White 1978,
    111ff.; cf. Fortenburgh 1993; Langlands 2011; Brown 2014). That sense of *tempus*
    obtains at §§25 and 45–6, where it forms parts of Quintus’s design, whenever he
    must address the compromises to aristocratic decorum by canvassing, to fore-ground
    Cicero’s aristocratic probity and to get at least some moral cover to these traditional
    and necessary features of canvassing (Tatum 2007, 129ff.). See also §§16 the definition
    of the word ‘friend’; see §§25 you can honour when canvassing; §§45 to your situation.


    **you can and should.** The practices in the *Brief Handbook* represent *normative*
    practices (see §§1 anything new; §IV.4).


    **notable for their vices.** This expression (*vitis nobis*) relies on the literal
    sense of *nobilis*, or for his effect: that is, *nobilis* means ‘known’ (see §§44)
    Antonius and Catiline are more notorious for their immortality than distinguished
    by the excellence of their birth.'
