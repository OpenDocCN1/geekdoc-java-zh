    # Three Issues in the Debates about Access


    At this point, we may turn to the archival discourse developed in the meetings
    of the IHRC. By and large, in western European citizen-ship implied entitlement
    to access to historical state papers, subject to certain conditions, which varied
    from being quite liberal as in France since the French Revolution or in England
    from the 1860s, to being very restrictive as in Prussia and the German states
    before 1871 and even thereafter. In 1873, Alex Charles Ewald of the PRO in London
    wrote that ‘there is no difficulty in obtaining access to the State Papers than
    there is in consulting the books in the reading room of the British Museum.'',¹⁵
    He mentions that the Foreign Office records were open till 1760, of the Colonial
    Office until 1760, of the Treasury till 1820, and so forth. In India the colonial
    state did not allow such access—this was evident to the academic historians in
    India but the expression of the consequent dissatisfaction was somewhat muted
    until the late 1930s. Narendra Nath of the University of Calcutta sub-mitted a
    paper to the IHRC in 1937, complaining of the discrepancy between the archival
    practice in Europe and India. He pointed out that in London the India Office had
    opened seventeenth-century records; while ‘permission to examine eighteenth century
    records was not so freely given’, on application to the authorities that were
    obtainable. Similar practice prevails in the National and Colonial Archives of
    Paris and the Archives Ultramarine of Lisbon. The Public Record Office [in London]
    is more liberal in this respect.¹⁶ The difference between the system in Europe
    and India reflected the differ-ence the status of citizens of European countries
    and that of the British Indian subjects in India. A political awareness of this
    was in the subtext of the statements of Sen and other Indian historians. A dissatisfaction
    similar to Sen’s was expressed by many others in the IHRC meetings every year
    they met. As we have seen earlier, the main issues may be disaggregated into three:
    (i) Who to be allowed access? (ii) What were the records to be opened to them?
    and (iii) How would the process of research in the record room be regulated?'
