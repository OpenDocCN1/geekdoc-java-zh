    # Historiography and Archiving


    Finally, we must turn to the task of considering the state of British Indian historiography
    and the government''s archiving policy, or rather the lack of an archiving policy.
    did colonial historians address the issue of documenting their narratives before
    an archive came into existence? While it is obvious that it was a serious disadvantage
    for the historians to have no systematic access to organized and classified documents,
    one can observe in the historical works of the early nineteenth century various
    factors that aided the construction of narratives. These factors were (i) the
    authors'' personal knowledge of the times, places, and events they described,
    since the authors were generally veteran servants of the East India Company; (ii)
    the author''s access to protagonists in the narrative, the actual actors on the
    stage of history; their memories of the past, and their private papers and correspondence;
    and (iii) the availability of pre1857 East India Company and government records
    in the deposits and well-organized archives in England—in fact, for a long time
    these records were available more easily in England than they were in India. That
    is the impression one gathers from the early colonial historians'' life and work.


