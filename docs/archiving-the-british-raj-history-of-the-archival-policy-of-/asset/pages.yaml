  md: '# Archiving the British Raj


    if it was beyond question. This critique created a stir even in the placid discourse
    of archives. Consider, for instance, the influential writings of Thomas Richards,
    Anne Stoller, or Nicholas Dirks, which influenced the study of archives in relation
    to state-building and imperialism. The most important consequence that followed
    was an innovation in the use of archives. The practice of ‘reading documents against
    the grain’ allowed the use of archival material in unprecedented modes. Thus,
    there developed, on the one hand, an attitude of questioning the naive faith in
    archival data, and at the same time, a robust practice of using archival data
    and reading them ‘against the grain’. However, these developments had little relevance
    to the history of nineteenth-century archival policy in the following pages. What
    seems to constantly relevant is the impact of political power on archival policy.
    *Archival Science*, a major journal of archives, devoted two numbers in 2002 to
    the subject ‘Archives, Records and Power’.^⁶


    Every historian using British records in the archives is bound to feel the involvement
    of political power in the production of historical knowledge. The feature of our
    archival records particularly evident in the historical writings on the freedom
    struggle and the conflict between imperialism and all anti-imperialistic forces.
    What is more, sometimes the possession of political power led to deliberate suppression;
    an instance was the British Indian government’s intervention to prevent Captain
    J.D. Cunningham in 1849 from using official government records in his history
    of the Sikh wars. Thereafter, it became a settled official policy not to allow
    officials of the government, but access to the records for any purpose other than
    official government work.


    The work of J.D. Cunningham on the history of the Sikhs and Anglo-Sikh relations,
    published in 1849, is of outstanding importance.^7.First, like Grant Duff’s on
    the Maratha kingdom published in 1826, this work was based on government records,
    which are cited in detail in the footnotes. Second, the Government of India took
    exception to the citation of official records (not yet made public, for example,
    through Parliamentary Papers) by the author and he was on that ground officially
    reprimanded and penalized. Cunningham believed he was penalized chiefly because
    of some critical remarks he made about the British policy towards the Sikh kingdom
    and because of a perception that he was guilty of leaning'
