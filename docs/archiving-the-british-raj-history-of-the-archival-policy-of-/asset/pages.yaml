    # Advancing Research through Publications


    It will be recalled that in the previous chapters we noticed three kinds of publication
    enterprises by the IRD: first, publication of selected records; second, attempts
    to compile calendars of records on the English model, the exemplars being the
    PRO and the India Office in London; and third, the compilation and publication
    of indexes and handbooks as guides to records.


    Among the ones mentioned above, the publication of selections of records was generally
    favoured by J. Talboys Wheeler, George Forrest, and C.R. Wilson—as well as by
    the Government of India—who keen to highlight the records left by the most prominent
    empire builders. As regards calendaring, the long history of abortive efforts
    came to end an end in the early 1940s with a final decision to abandon the project.
    The work of indexing was the most successful plan to aid research from the 1920s.


