    # The Imperial Record Department


    Objectives and Achievements, 1891–1926


    The Imperial Record Department (IRD), formed in March 1891, owed its origins to
    circumstances that were different from those which prevailed 30 years ago when
    the Record Committee had suggested the formation of a central ‘monument room’,
    but the idea was exactly the same. As we have seen in the previous two chapters,
    for 30 years the Government of India dither over the question of a central record
    room. Now that it was at last decided to form the Record Department, there developed
    an interesting discourse on the objectives—in part this was a rerun of the old
    bureaucratic views that we noted earlier, and in part the discourse brought to
    light new approaches to old issues. What were the objectives and issues before
    the new Record Department in the first 25 years of its life, till it shifted to
    its present location in New Delhi in 1926?


    Basically, we can seek two kinds of answers to the question regarding the objectives
    of archiving in the Record Department. First, the stronger voice from within the
    bureaucracy spoke of the archive as an instrument of governance. Second, there
    was another approach—often voiced by the ‘Home authorities’, politically conscious
    people in positions such as those of the secretaries of state or some governors
    who came to India for a few years as nominees of the political


