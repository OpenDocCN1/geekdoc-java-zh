  md: '# Absence of a Definite Archives Policy 9


    The British officials that the threat posed in 1857 to British dominion in India
    was due to the fact that the British forces in India, that is, soldiers of British
    origin, were small in number compared to the numerical strength of the Indian
    sepoys in the army. The proportion of white men serving in the British Indian
    Army to the Indian sepoys was about 1:6 in early 1857, and in many cantons only
    a few officers were men of British origin, while the troops under them were almost
    entirely ‘native’. Whereas one of seven soldiers in the British Indian Army was
    white in 1857, the statistics indicate a huge change in the next few years. In
    the years 1858–60 the ratio radically changed in favour of white soldiers and
    officers: their ratio to the soldiers of Indian origin became about 1:2. Certain
    units, such as the artillery, were deliberately designed for reasons of British
    security from Britain in the ratio of one white person out of three employed in
    the army in India was expensive. The overall result of all this was that the charges
    paid by India in England on military account £0.34 million in 1856–7, it became
    1.62 million in 1860–1, and kept rising. To sum it, the British reaction to the
    uprising of 1857 was to burden India with an enormous military expenditure.


    The second impact of the 1857 uprising was the increasing levels of public debt,
    and consequent annual burden of service charges or interest. Indians had to pay
    for the suppression of their rebellion. In the five years between 1857 and 1861–2,
    the total debt of the British Indian government (mainly debt incurred in England)
    swelled from £59 million to about £108 million. By 1872 it had reached 122 million.
    This was largely due to military expenditure as well as auxiliary items in the
    budget such as military public, that is, expenditure on barracks for the European
    soldiers. The third impact of the crisis of 1857 was on the so-called home charges,
    that is to say the expenses incurred in England by the British Indian government.
    Initially this increased during 1857–8 to military costs. The soldiers and officers
    brought from Britain to serve in India were paid for by the Indian taxpayer and
    the War Office in London exacted every penny spent on that account.


    The consequence of this financial crisis was the Indian government’s drive to
    reduce expenditure, and an eminent economist of those times, James Wilson, the
    founder of the journal The Economist of London, as well as officials of the Treasury
    in England were'
