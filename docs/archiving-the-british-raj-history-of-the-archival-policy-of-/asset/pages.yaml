    # Freedom of Access to the Archives


    Basically, the central theme in the phase from 1926 to 1947 is perhaps the transformation
    of the subjects of British India into citizens of an independent India, the issue
    at the core of that discourse, and reflected in the archival discourse, in the
    course of the development in the IRD in the last two decades before Independence,
    is that of public access to the records of the Indian government. If one looks
    back, one can see that in the first phase we have studied, 1858 to 1872, the main
    issue was whether a central ''monument room,'' or record office, was necessary;
    in the second phase, 1872 to 1891, the discussion was all about how to do without
    such a record office and'
