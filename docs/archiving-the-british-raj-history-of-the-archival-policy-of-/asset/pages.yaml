  md: '# Introduction


    Usually, the archives are sites where historians conduct research into our past.
    They are not the objects of research. This work addresses that task. This is a
    subject somewhat out of the ordinary for the general reader or professional historians
    who tend to take the archives for granted. By way of introducing this book, I
    would like to share with the readers some thoughts that crossed my mind as I launched
    into this project.


    Before the archives came into existence, there was a time when there was no source
    of knowledge of the past. Jacques Le Goff takes us back to that past when he looks
    at a time when neither the church in Europe nor the state in the Western countries
    was active in creating an archival base in the form of written knowledge.¹ The
    transition from oral to written knowledge at that time meant erasure of popular
    oral memory by the powerful establishments of the church and the state, Le Goff
    argues. Another intellectual intervention was that of Foucault, which highlighted
    the involvement of power in the creation of historical knowledge.² That intervention
    set in motion another train of thought: How to address the problem of bias in
    historical sources or the archives? In recent times, there have been illustrious
    exemplars of the art ‘reading records against the grain’.³ In India, too, there
    have been attempts from the Italian historian Carlo Ginzberg.⁴ Parallel to that,
    there have been historiographic innovations in reinterpreting archival records
    as a project to archive and classify all knowledge in a universalist framework.⁵


    I have referred to some important intellectual interventions questioning the historian''s
    normal habit of accepting data in the archives


    Archiving the British Raj: History of the Archival Policy of the Government of
    India, with Selected Documents, 1858–1947. Sabyasachi Bhattacharya, Oxford University
    Press (2019). Sabyasachi Bhattacharya. DOI: 10.1093/oso/9780199489923.00001'
