    (i) acquisition of records from government departments who sent to it records
    no longer considered useful, (ii) restoration and preservation of documents, and
    (iii) supply of specific documents to government departments as and when required
    by a government department. As we have seen earlier, the Record Department was
    also charged, in somewhat confusing welter of instructions from the secretary
    of state and the Government of India from time to time, with additional responsibilities:
    (i) publication of selected records from the state papers in the possession of
    the Indian Record Department, (ii) preparation of press lists, that is, annotated
    lists of records in a classified form, and (iii) preparation of calendars of documents,
    that is, abstracts of documents enlisted chronologically for each segment of correspondence
    and records of the Indian government, in the format established by the PRO in
    England.


    If we may at this point anticipate the story that will follow, broadly speaking
    the problems encountered by the IRD in implementing the instructions in respect
    of press lists and calendars were as follows (while publishing selected records
    was quite unproblematic): (i) The press lists of documents roughly from the eighteenth
    century were difficult to prepare because many documents were missing and had
    to be procured from the India Office in London; in fact, from 1891 to 1897 the
    work had not even begun and then it picked up up pace under Forrest, Hill, and
    Wilson; (ii) The calendars could not be prepared until the press lists were completed;
    further, the manpower needed to prepare calendars on the English model as prescribed
    by the master of rolls, which were not available in India and, therefore, the
    Indian government throughout the 1890s preferred that the India Office should
    prepare calendars; (iii) The India Office was instructed by the secretary of state
    for India to undertake calendaring but the pace of work was exceedingly slow;
    (iv) Around 1904 the perception of this slow rate of progress at the India Office
    and the urgent desire of the Indian government under Viceroy Curzon to expedite
    publication led the decision that the preparation of both press lists and calendars
    of records should be done by the IRD in India. However, while the work of preparing
    press lists was pushed forward quite well in the next two decades, no calendar
    was published except for calendars of Persian documents; (v) The preparation and
    publication of selections of records was one part of the agenda where success
    was most publicly visible and applauded.'
