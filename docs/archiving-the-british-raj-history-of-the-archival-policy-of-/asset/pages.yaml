    The Rankean approach appealed to the conservative cast of mind.

    While England the long history of liberal democratic transforma-

    tion in France the ideology of the revolution left its mark on his-

    toriography—in Germany there was no such history. German society

    was characterized by absolute monarchy in Prussia, a military

    and bureaucratic aristocracy that held an unassailable position, and

    dependence of the universities on the support of the government, and

    in the wars of liberation against Napoleon 1813–15 a strong sense of

    ethnic identity allied with traditional political authority. There was

    some affinity between that polity and the message in von Ranke,

    which was sometimes dubiously called ‘positivism’—an affinity in

    terms of resistance, on the ground of the violation of objectivity, to

    ideologies, theories, and ‘historical laws’ of the Hegelian kind. By

    the middle decades of the twentieth century, the Rankean point of

    view was outmoded by the development of new historiography in the

    hands of, others, Fernand Braudel and the French ‘Annales’

    school of history, and it was from the beginning unacceptable to

    th belonging to the Hegelian and Marxist approach to history.


    To the extent the Rankean methodology was elevated as

    a philophy—in that it rejected recourse to theory and interpretation

    beyond the particularities immediately under study—what was

    a sound empiricism in method became indeed, as it is commonly

    recognized today, a kind of mindless empiricism. That did and would'
