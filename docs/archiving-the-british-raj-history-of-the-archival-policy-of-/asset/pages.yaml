    party in power in Britain, as well as academic persons or journal-nists outside
    the bureaucratic circle in India. In this approach, the emphasis was on ideological
    issues, Britain’s imperial image, and the interpretation of the past of the Indian
    Empire.


    With regard to the use of records as instruments of governance, the most obvious
    point made was that in the area of external relations the colonial state had to
    refer to records of precedents and past practices vis-à-vis other Asian countries,
    the ‘native states’, that is, the princely states, or European powers such as
    Russia or France whose interests impinged upon British Indian interests. Old records
    of value to the government since it often felt need to build policies and practices
    on the basis of past precedents. It is interesting to see from the correspondence
    that while administrators at lower levels were impatient with the mass of historical
    records in their departments,¹ policymakers, for example, secretaries in the viceroy’s
    council, were keen to have access to old records. The latter wrote in their dispatch
    to the secretary of state in 1889 that the old records must be kept in a condition
    which they can resist the ravages of time, and to make their contents available
    for reference in the discussion of current affairs.’² The records most frequently
    consulted by bureaucrats were of the Foreign Department because relations with
    hundreds of native princely states and chieftains—from Afghanistan to Manipur,
    and Kashmir to Travancore—were regulated by numerous agreements and protocols
    that went back to eighteenth-century records of the East India Company. Further,
    the frontiers of British India were determined according to agree-ments with the
    neighbouring states. (Even the post-Independence period saw the Indian government
    delving into these archived data to defend its position vis-à-vis the McMahon
    Line or India’s relations with the states on or beyond the Himalayan foothills.)


    Second, past records were also useful as an important source for precedents and
    conventions in internal administration. How to deal with tribal groups in the
    North-Western Frontier Province? Among the local notables and landlords who were
    reliable allies for the British in the past, for example, during the uprising
    of 1857? Which ethnic groups were appropriate to be recruited as sepoys for the
    British Indian Army? Who were dangerous nationalist agitators or groups in the
