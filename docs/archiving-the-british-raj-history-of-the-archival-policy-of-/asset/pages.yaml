    IRD’s Services to the Government Departments


    In the early pages of this book we have seen that old records were perceived useful
    so far as they aided governance. From 1891, the IRD was an important instrument
    of governance. Supplying records of the past on demand from various departments
    of the government was the main function of the IRD from 1891. These demands were
    called ‘requisitions’. Surendra Nath Sen, as director of the IRD, writes in 1944:


    Hardly less important than the duties connected with the preservation of records
    are those which the department has to discharge in facilitating their use in the
    day-to-day business of the central government. These duties, heavy as they are,
    steadily on the increase.... Mention must also be made in this connection of the
    extensive research undertaken by the department on behalf of the official agencies
    searching for fresh facts to illuminate current administrative problems.⁴⁵


    In thus emphasizing the part of the IRD ‘in facilitating the work of administration’,
    Sen was repeating the point made by his predecessor, A.F.M Abdul Ali, in the handbook
    to the records of the archives he compiled in 1925, that the IRD was a department
    of the government whose function was to aid other government departments. Requisitions
    from government departments, which the IRD compiled about 6,000 in 1900, 11,000
    in 1907, 20,000 in 1931, 24,000 in 1940, and 25,000 in 1942. This rise in the
    number of official requisitions was possibly due to the expansion in the functions
    of the government; the twofold increase in requisitions from 1931 onwards suggests
    that the exigencies of addressing administrative problems arising from the political
    agitations may have played a role.


