  md: '# 10 Archiving the British Raj


    brought to India and two finance commissions were appointed to check expenditure
    on the military and the civil departments. As a part of that drive to reduce expenditure
    wherever possible


    in the early part of the year 1860, Mr. H.D. Sandeman, then Officiating Civil
    Auditor, suggested to the Civil Finance Commission the propriety of destroying
    useless records in the several Government Offices in Calcutta, and disposing of
    them as waste paper, and proposed the adoption of some effective means to prevent
    the re-accumulation of worthless documents. The Civil Finance Commission, after
    consulting the heads of the various Offices at the Presidency, laid the matter
    before the Financial Department of the Government of India, and recommended that
    a Committee of experienced and cautious men should be appointed to treat the question
    in detail. The Commission remarked that the benefit of the proposed destruction
    of useless records would not be fully obtained without the substitution of one
    grand central archive office for the existing record-rooms attached to each Office,
    for the purpose of transferring to it, for safe preservation, all old records
    that might be of value—the Offices concerned keeping such records as would be
    required for current use.


    Initially, the Finance Commission was assigned the task of pruning record collections
    and, probably due to the magnitude and complexity of the task, the commission
    admitted its inability. Thereafter, in April 1861 the Government of India appointed
    the Records Committee ‘for the purpose of superintending the scheme for the destruction
    of all useless records in the Public Offices, after carefully selecting such as
    might be statistically or historically valuable for preservation’.⁴ This Records
    Committee became the body that framed the archival policy and made recommendations
    to the government in that regard.


