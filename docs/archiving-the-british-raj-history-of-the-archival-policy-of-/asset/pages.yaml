    contents of the papers described in it. He [the master of the rolls, UK] considers
    that the entries should be so minute as to enable the reader to discover not only
    the general contents of the originals, but also what they do contain. If the information
    be not sufficiently precise, if facts and names be omitted or concealed under
    a vague and general description, the reader will be misled, he will assume that
    the abstracts are silent as to information be found in the documents, such information
    does not exist; or, he will have to examine every original in detail, and thus
    one great purpose will have been lost for which these Calendars have been compiled.33


    The Indian government soon found that it did not have trained and experienced
