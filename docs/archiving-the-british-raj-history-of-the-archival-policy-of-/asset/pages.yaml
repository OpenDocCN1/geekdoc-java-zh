    its opposite, but a balance between the two. Jagger points out that, in fact,
    Ranke himself was not averse to making generalizations; when he talked of the
    spirit of Germanic and other ethnic cultures, or when he philosophized in his
    lecture to King Maximilian of Bavaria that ''every epoch is to God'', he enters
    the area of philosophical speculation, in a manner inconsistent with his much-vaunted
    empiricism. Perhaps historians who claim to be Ranke are more responsible for
