    Rudyard Kipling once called the ''departmental view of the matter'' with reference
    to records. In some other matters records were consulted by the administrators.
    The most appropriate instance of that necessity was the periodical assessment
    of land revenue in areas outside the Permanent Settlement; there were several
    methods such as crop-cutting, ''eye-estimate'', and so on to gauge the increase
    in production to increase revenue demand, but the rule of thumb was to get information
    of the assessment at the previous settlement operation, 20 to 30 years ago, and
    to jack it up by a certain percentage. Thus, to the district collector access
    to old revenue settlement records was essential.³ Apart from that, there was a
    statutory obligation to maintain records and statistics of revenue, commerce,
    population, education, and so on. Since the Crown took over administration from
    the East India Company in 1858, the British Parliament required the Government
    of India to periodically submit Report on Moral and Material Progress, which included
    these data collected from records.


    Apart from the above-mentioned reasons, which were pragmatic and related to the
    functioning of the colonial state, there were also ideological elements in the
    discourse of archives. Respect for precedents was an important feature of the
    political culture of the British. Their habit of finding contemplation on precedents
    and conventions required reference to previous records of action on various administrative
    matters. Apart from the urge to defend government decisions, the fetish for precedents
    could probably be traced to British judicial tradition and the guidance sought
    from ''court-made laws'' in the form of earlier court judgments. By analogy, in
    administration they developed the practice of referring to precedents—that almost
    amounted to an ideology.


    Second, there was another ideological element in their desire to secure their
    place in history, and to defend themselves against adverse judgement of posterity.
    This historical consensus was enhanced by colonial historiography—James Mill''s
    History of British India, followed by works of Mountuart Elphinstone, W.W. Hunter,
    Alfred Lyall, and others. Archiving of records mattered to policy-level thinking;
    hence, British statesmen very often urged the Indian government to apply themselves
