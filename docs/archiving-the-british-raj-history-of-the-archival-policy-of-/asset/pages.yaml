    only man heading the department with the confidence to bring up this matter officially
    in the last note he wrote on 21 May 1904 before demitting office:


    I should also like to add a word to my designation. It seems to me that the title
    Officer in charge of the Records of the Government of India is very lengthy and
    cumbersome. I should prefer something shorter. Mr. Forrest used to call himself
    ‘Director of Imperial Records’ or something of the sort. I am not much in favour
    of the title as it seems rather meaningless. How can I say direct records? What
    does directing records mean? ‘Imperial Archivist’ is quite short but the term
    sounds strange and foreign. Perhaps the best title would be ‘Keeper of the Imperial
    Archive’. This sounds dignified and English. But perhaps it suffices that I have
    called the attention of Government to the point, and they will think of some short
