    designation was approved by the government in 1944: director of Archives; this
    was when the eminent historian Dr Surendranath Sen was holding this office, and
    on 30 August 1947 the department itself was renamed the NAI.


    # Agenda of the Record Department, 1891–1926


    To return to the period we address in this chapter, 1891–1926, what were the major
    tasks of the IRD? From 1891, the records indicate that it was expected to perform
    some routine functions:'
