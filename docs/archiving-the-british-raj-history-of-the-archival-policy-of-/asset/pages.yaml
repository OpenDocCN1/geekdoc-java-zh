  md: 'Finally, we must look at the impact of Leopold von Ranke (1795–1886) in shaping
    Indian historians'' approach and methodology in the early decades of the twentieth
    century. Sir Jadunath Sarkar wrote in the essay ''Development of History in Modern
    India'':


    The main sources for writing history are contemporary records; most of them remain
    unpublished; to discover, explain them and their comparative study is the only
    method for putting history on a firm basis—that truth is now accepted in the entire
    civilized world. Although ... von Ranke had declared this as an unquestionable
    principle, in Europe this change in approach was relatively new and even Lord
    Acton remained skeptical about unpublished documents.. In Europe from the beginning
    of the twentieth century historians have accepted this new methodology as way
    forward.91


    Sarkar sensed the beginnings of this Rankean enterprise in all parts of India:
    ''We must not fall behind in collecting the sources. Writers in all parts of India,
    in Hindustan and Deccan, and all races [jati]—Bengali, Punjabi, Rajasthani, Gujarati,
    Tamil, Maratha—are in the endeavour to build the history of India by brick.''92
    Sarkar was right about the general acceptance of the principle, associated with
    von Ranke in contemporary historical records. In a recent survey of historiography,
    The Oxford History of Historical Writing, several authors indicate that there
    was a similar trend in most countries in Europe in the early twentieth century.
    Georg G. Iggers is identified as the founder of the modern tradition of scientific
    history.93 Stefan Berger mentions: ''Ranke’s influence on European historiography
    cannot be overestimated.''94


    About the time the IRD was established in India, Europe witnessed a wave of enthusiasm
    for histories based on authentic records, a thought trend associated with the
    rise of the Rankean notions of objectivity and scientific history. Georg G. Iggers
    points to the fact that in England was no less a historian than Lord Acton recognized
    the rise of the German school of history, and in 1886 the very first issue of
    the English Historical Review was dedicated to new German historiography. In 1885,
    the newly founded American Historical Association elected von Ranke, the ‘father
    of scientific history’, the first honorary member of the association.95 An interesting'
