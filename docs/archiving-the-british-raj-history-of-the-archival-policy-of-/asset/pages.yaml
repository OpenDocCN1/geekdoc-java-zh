    in the India Office and a committee was formed that recommended the destruction
    of 317 tons of records, which were sold as waste at a price of £3,000. Some of
    these papers were duplicate copies according to Danvers. In 1867 and again in
    1877 many records were disposed of, usually after casual scrutiny within the India
