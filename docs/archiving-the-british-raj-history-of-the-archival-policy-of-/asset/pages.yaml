    archives keeping about which there is no difference of opinion. Hence follows
    the corollary that indiscriminate admission into record rooms must not be demanded.
    So far, the student of history is one with the record keeper. But there is a wide-spread
    feeling among responsible research scholars in this country that may go far....
    The record keeper may not treat the curiosity of the historian with undue suspicion;
    he may indeed find a useful ally and collaborator in trying specimen of humanity....
    [T]the record keeper may well enlist the services of research students, to whom
    the privilege of examining the archives is granted, for indexing, transcribing
    and cataloguing the records in which they are interested. Such operation will
