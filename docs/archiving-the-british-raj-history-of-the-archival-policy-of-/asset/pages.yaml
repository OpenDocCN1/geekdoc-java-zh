    earlier, of edited by the writings of C.F. Andrews or L.S.S. O''Malley, Charles
    Andrews wrote an entire monograph on the ''renaissance'' in India; indeed he was
    the first among British historians to use that concept in the Indian context.
    This attention to socio-cultural history was a new trend that distinguished these
    authors from the old school of colonialist historians. The latter (with a few
    exceptions such as Alfred Lyall) usually gave all attention to the political history
    of imperial conquests and the history of administration to maintain imperial rule;
    an extreme example of that was the Cambridge History of India edited by Dowdell—in
    its several hundred pages there is not a mention of Rammohan Roy and the awakening
    of India in the nineteenth century; the occlusion of social and cultural history
    in their narrative was a limitation that warped their judgement of the origins
    and the growing strength of the nationalist movement. The perspective in the works
    of Charles Andrews, Percival Spear, or Edward Thompson was more accommodative
    to the political aspirations that found expression in the nationalist movement.
    The publication of those works was a landmark indicating the reorientation in
    thinking British which eventually made the transfer of power in 1947 acceptable
    to the erstwhile imperial power.


    As we conclude, we may recall that in evaluating contemporary historiography appropos
    of our study of the archival process, we have traversed the great distance historiography
    had travelled practised from James Mill to Thompson and Garratt. This period,
    spanning the beginning of the nineteenth century to the last years of British
    rule in India, saw the evolution from a Eurocentric and disparaging approach to
    India towards a more liberal and less ethnocentric approach. The two World Wars,
    the gradual decline of Britain from the position of being the premier power, Britain’s
    experience of fighting a losing battle against the ascendancy of nationalist politics
    in African and Asian colonies, the beginnings of decolonization, the peer group
    pressure on archivists expressed in the opinion in favour of opposing the archives
    in the IHRC meetings, public access to the records from 1939, increasing contestation
    of colonial historiographic position on many issues—all these factors account
    for the transformation. There remained, of course, rearguard actions by defenders
    of the old empire as ‘revisionist’ attempts of subtle kinds, by the mainstream
    of British mind had by the last'
