    # Utilization of Records in Writing History


    As regards works of history based on government records in the 1870s and 1880s,
    some authors tried in a cursory way to include records in the biographies of empire
    builders. Some of them part of the series Rulers of India. In the absence of accessible
    records in a central archive—the records being in a dispersed state in the different
    departments of the Indian government—very little archival input was available;
    the biographers depended mainly on memoirs and private papers. There were only
    a few works sounds based on government records in this period. Two of them engaged
    in an elaborate debate: Sir James Fitzjames Stephen (1829–1894), formerly the
    law member of the viceroy''s council, and Henry Beveridge (1837–1929), member
    of the ICS and the Positivists'' Society of England, a radical group in England
    that were influenced by the French thinker Auguste Comte (1798–1857). The debate
    illustrates an important aspect of archival research.


