    # Was the British Model Feasible in India?


    There were two big questions facing the Indian government in the phase we are
    considering in this chapter, from 1872 to 1891. First, was the British model feasible
    in India? If the publication of records and calendars and index to records was
    the priority, as Viceroy Northbrook and his council had decided, as we have seen
    earlier, how that to be implemented, given the British model outlined above? Second,
    was a policy of publishing records suffic or was it necessary to revert to the
    idea of a central record office without a keeper of records, corresponding to
    the head of the PRO in England? The greater part of the years from 1872 to 1891
    was spent in dithering about how to reproduce the British model of calendaring
    and publishing documents, and at the end the government opted for the latter alternative.


    One of the models for the Indian government was the Calendar of Treasury Papers
    (London, 1868) prepared by Joseph Redington, under instructions from the master
    of the rolls. These instructions were indeed formidable; for example the following:


    > The Master of the Rolls considers that, without superseding the necessity of
