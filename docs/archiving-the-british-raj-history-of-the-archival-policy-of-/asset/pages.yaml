    An important report on India Office records was compiled by Frederick C. Danvers
    in 1889, which chronicles a process in London similar to what happened in India
    between 1859 and his times. In 1859, an attempt was made to dispose of old and
    supposedly useless documents; about 20,000 volumes were discarded. In February
