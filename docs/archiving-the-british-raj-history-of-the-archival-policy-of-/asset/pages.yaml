    # The British Model of Record-Keeping


    This is an appropriate place to briefly notice the long tradition of record-keeping
    in England, which is relevant because it influenced the attitude of the ‘home
    authorities’ and the secretaries of state regarding records. In a book published
    in 1873, A.C. Ewald, a former ‘senior clerk in Her Majesty’s Public Records Office’,
    recorded the history of record-keeping since the appointment of the first keeper
    of the rolls of the King’s Chancery at the Wardrobe in the Tower of London in
    1295. The first public interventions in the matter were in 1703 when the House
    of Lords appointed a committee to consider the methods of record-keeping in offices
    and in 1800 when the House of Commons appointed a Select Committee, which led
    to a Report of 1800 on all depositories of government records.


    There are many reasons why the history of the public record system of England
    after 1800 is relevant to the present study of the Indian archives. First, the
    very language of the British Indian bureaucracy’s discourse contains many words
    that are peculiar to the history of public records in British bureaucracy; for
    example ‘monument room’ (place for the preservation of records, derived from ‘monumentum’,
    or defence of privileges on the basis of records thereof), or ‘master of the rolls’
    (the person responsible for royal appointment for keeping records in their custody,
    originally in'
