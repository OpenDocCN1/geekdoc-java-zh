    # The Crucial Question of Access to Government Records


    That brings us to an issue that acquired prominence when a central archive, that
    is, the IRD, was set up: the crucial question of access to government records.
    We have seen earlier that from the early nineteenth century, the East India Company
    allowed many scholars, mostly retired Indian officials, access to their old records
    in their offices in London. This policy continued in the regime established after
    the end of the Company’s rule and, in fact, was strengthened with the reorganization
    of the India Office record-keeping establishment in 1884. The consequence was
    that many Indian government records were accessible to the public in London but
    closed to all non-officials and scholars in India. As we have pointed out in the
    previous two chapters, the bureaucracy in India was apprehensive that the disclosure
    of some records may bring discredit to past policies and actions of the government;
    as years passed and an ‘English-educated’ middle class began to look critically
    at those policies and actions, in the bureaucratic mind there developed the fear
    regarding the political use of archival data. Apart from these apprehensions,
    was there any other factor? A hypothesis that seems plausible is that deep-seated
    cause of hostility to the idea of opening records, as well as indifference to
    the prospect of historical research in India, was a cast of mind that denied agency
    or autonomy to Indians in historical inquiry and archival research, though they
    and their country’s history might be objects of research conducted by their rulers.
