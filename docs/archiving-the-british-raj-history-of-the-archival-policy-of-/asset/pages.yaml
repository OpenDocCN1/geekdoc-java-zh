  md: '# Archiving the British Raj


    Even a casual reader of this book will perceive that in this account the core
    issue that emerges is the freedom of access to the records of the Government of
    India in the archives. While there was, on the one hand, a section of British
    political authorities and even of the bureaucracy favoured not only accurate archiving
    of historical events, but also some limited access to records for selected non-official
    researchers, the overwhelming opinion, on the other hand, in official circles
    was against such access.


    Among the British serving in India, there were very few proponents of the idea
    that the Imperial Record Office should be open to historical research. There was
    strong and consistent bureaucratic opposition to access by non-officials for research
    purposes. As we shall see in the following pages, Lord Curzon was virtually the
    only viceroy who spoke of the historical importance of the records of the Indian
    government and the desirability of facilitating research. He demanded information
    on ''the facilities offered to the public for research in the records''.10 He
    learned from C.R. Wilson at the head of the Record Department that there were
    virtually no facilities. Curzon apprehended that ''the jealous attitude of government
    in this matter was a serious bar to research''. Due to Curzon''s initiative, the
    governor general in council''s letter to the secretary of state contained an admission
    that the absence of research facilities was ''a state of affairs [which] cannot
    be regarded as a reproach to our government''.11 thereafter Curzon''s sudden resignation
    and departure from India put to an end to the initiative he had taken. The Indian
    government reverted to that archival research facility in Indian records was unnecessary
    (because there was no one in India competent to conduct historical research) as
    well as dangerous (because Indian researchers would abuse their access to records
    to mount political propaganda against the government).


    In contrast to this position of the civil servants in India, the secretaries of
    state in England consistently showed an awareness of the historical value of the
    Indian records and the need to create facilities for non-official historical researchers.
    How do we account for that attitude, and the difference between? It is my surmise
    that this was the outcome of a complex set of factors. To begin, with the bulk
    of the members of the Indian Civil Service (ICS) had scarcely any education before
    the grammar'
