    question Iggers raises is why German historiography took such a turn and von Ranke
    became a leader in historiography in the Western world. The reasons he points
    to are: the strength of the old tradition of historicism in the researches of
    Berthold Niebuhr (1776–1831) in sources of Roman history and the ideas of Wilhelm
    von Humboldt (1767–1835); the growth of the Göttingen School of history and the
    foundation of the University of Berlin (1809) where Ranke began to teach in 1825;
    by Ranke''s own training in historical philology and later research in the history
    of the Germanic and Latin races; and, above all, the development of a new German
    national spirit since the termination of Napoleon’s hegemony in central Europe.


    In his writings, Ranke put a lot of emphasis on his sources. For example, in his
    History of the Popes he devoted the first 15 pages to his search for sources in
    Germany and Italy. A man of his eminence was denied by the Vatican ‘the freedom
    of access which I would have wished’ Ranke hints that this was because he was
    not a Roman Catholic, but ‘a Protestant, a North German’. Ranke says that ‘maintaining
    the objective point of view’ and to eschew such warmth of expression arising from
    partiality or hostility was his. Despite statements of this kind, Ranke was probably
    not entirely free of certain emotional attachments, for example, as a son of a
    Lutheran priest, attachment to the Protestant faith, or as a spokesman of newly
    awakened national identity consciousness. For example, in his evaluation of Frederick
    I and Maximilian II of Austria, he eloquently generalizes about ‘the spirit of
    the German nation,’ and ‘the genius of the nation by a pure and spontaneous effort,
    had reawakened a deeper and purer form of religion.’ You may excuse these lapses
    from dictum, they lend some ‘warmth of expression’ to the otherwise spiritless
    and bland narratives that do not compromise neutrality.


    Leopold von Ranke’s famous dictum, telling story as it really happened’, was not
    a mere slogan or an agenda statement backed by empirical research. The Rankean
    school of history swept all for it in the Western scholarly world at—basically,
    the critical and objective examination of records. One can understand why historians
    such as Jagunath Sarkar found much merit in the Rankean methodology. One cannot
    deny the fact that in the late nineteenth and early'
