    What was there in Thompson and Garratt''s approach which was new, and how was
    it different from the general run of history written by contemporary British historians?
    The difference between them and was often criticized by Thompson and Garratt in
    their work and that is where the differences show up. Thompson and Garratt were
    critical of British historians who, they felt, allowed themselves to be guided
    by the ''official'' line on how history was to be written in a manner that aided
    the government''s efforts to keep Indian nationalists from influencing the public
    mind through criticism of the British record of ruling India. Thompson and Garratt
    wrote in their preface (1934) that it was necessary ''to write objectively'' of
    that record but was influenced by the spirit of partisanship: ''He is not for
    us is against us.'' All issues were approached from the stand point of administration
    and this exercised ''a constant censorship, which made British-Indian history
    the worst patch in current scholarship.''¹⁴ Such statements were not likely to
    make Thompson and Garratt''s work very popular among British scholars. Thompson
    and Garratt were viciously attacked. For instance, the review of their book in
    the bulletin of the School of Oriental and African Studies, London said: ''It
    generally conveys the impression that the joint authors formed their opinions
    first and supported them by selective study afterwards. The book is in a bulky
    pamphlet rather than a historical study.''¹⁵ In their appraisal of the older colonial
    approach Thompson and Garratt pointed out that the British narratives only about
    what the British soldiers and civil servants did in India. Thompson and Garratt
    wrote in 1934: ''The writer of Indian history must recognise the narrow limits
    of the world which he has described. The little group of alien officials and leading
    Indians, who have moved across the stage, draw too much attention while the vast
    majority of Indians received no attention in the British Indian historians'' writings.''¹²⁶
    One consequence of Thompson and Garratt''s awareness of this shortcoming of British
    writings on modern India was an effort to emphasize in their narrative social
    and cultural aspects of modern Indian history. This was also the characteristic,
    as we noted'
