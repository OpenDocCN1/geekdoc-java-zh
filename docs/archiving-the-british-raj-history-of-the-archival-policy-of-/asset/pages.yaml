    towards the Sikhs. He wrote in his ‘Preface’ to the second edition (published
    after his death):


    He saw no reason for continually recurring to the duty or destiny of the English
    in India, because he was addressing himself to his own countrymen, who know the
    merits and motives of his supremacy in the East, and who can themselves commonly
    decide whether the particular acts of a viceroy are in accordance with the general
    policy of his government.... The wisdom of England is not to be measured by the
    views and acts of any one of his sons, but is rather to be deduced from the characters
    of many. In India it is to be gathered in part from the high, but not always अंग्रेजों,
    qualities which distinguished Clive, Hastings, and Wellesley, who acquired and
    secured the Empire; from part the generous, but not always discerning, sympathies
    of Burke, Cunningham, and Bentinck, who gave to England the rule of moderation
    and humanity; and also in part the ignorant meaning of the people at large, who
    justly deprecating ambition in the abstract vastly strive to achieve the progress
    of conquest before its necessary limits have been attained, and the aspiring energies
    of the conquerors themselves have exhausted.


    The independence of mind shown in these remarks was not welcomed by the Indian
    government. Official reprimand from the governor general and his council and sent
    back to regimental duty was, according to Cunningham’s brother, a shock from which
    he never recovered. Two years after the publication of the book and the reprimand,
    Cunningham died very suddenly at a young age in 1851. His editor G.T. Garrat of
    Lahore College wrote: “The chapter contains many statements of an injurious nature.
    Indeed, as the result of certain strictures upon the policy of the Government
    of India ... the author was dismissed from his employment in the Political Department
    by the Honourable East India Company and sent back to regimental duty.


    The Cunningham episode was a rare case where the Government of India virtually
    censored a work of history by one of its own officers. As far as archiving is
    concerned the case was hugely important because it became a precedent, set by
    the governor general himself, that put a bar on use of official records by government
    officers; as for outsiders or non-officials, they could not even read records
    in the Imperial Record Room.'
