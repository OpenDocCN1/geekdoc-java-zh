    # Developments Leading to the Creation of a Central Archive


    1872–91


    If one distances oneself from the details of the story in the previous chapter,
    one can see the fundamental issues for the Government of India on the question
    of archiving records. The colonial state was evolving a policy of record-keeping
    that tended to oscillate between certain polar opposites postulated implicitly
    in policy-level thinking. Individual policymakers were also adopting these different
    positions. The polarities between alternative models implicit in policy-level
    thinking were as follows: (i) There were two opposite models in the 1860s—of archival
    organization on a decentralized departmental basis as opposed to the concept of
    a centralized record office, or muniment. (ii) There were two different ideas
    about how to go about the business of documenting British rule in India: one idea
    was to collect, preserve, and calendar the documents in a permanent accessible
    collection; the other was to publish selections from the available documents,
    and in this view a low priority was accorded to the task of creating an archival
    collection for future research. (iii) There was another issue: a choice between
    policy of limiting access to documents to those authorized by virtue of bureaucratic
