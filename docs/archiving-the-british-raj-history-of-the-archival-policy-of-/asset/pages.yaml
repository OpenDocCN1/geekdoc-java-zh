  md: '# About the Author


    Sabyasachi Bhattacharya is former Tagore National Fellow, Ministry of Culture,
    Government of India. He was earlier vice-castellan of Visva-Bharati University,
    Santiniketan, India, and professor at the Centre for Historical Studies, Jawaharlal
    Nehru University, New Delhi, India. He is the author of The Defining Moments in
    Bengal: 1920–1947 (Oxford University Press, 2014) and Talking Back: The Idea of
    Civilization in the Indian Nationalist Discourse (Oxford University Press, 2011).
    For the former, he was awarded the H.K. Barpujari Award at Indian History Congress
    in December 2017.'
