    # Transition in Historiography


    Needless to say, all historical periods may be looked upon as times of transition
    but the last decades of colonial India were marked by two important developments
    in historiography which, arguably, signaled a major transition. One was the rise
    of a nationalist school of Indian historians, and the other was a slow change
    in the approach to India’s history in the writings of contemporary British historians,
    marking a departure from the traditional colonialist outlook of James Mill, Alfred
    Lyall, or Vincent Smith. It will be our aim to briefly outline these two paths
    of development rather than to'
