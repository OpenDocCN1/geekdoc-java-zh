  md: '# 1


    # Absence of a Definite Archives Policy


    1858–71


    It is a paradox that an endeavour to demolish records was the beginning of the
    organized system to preserve documents in India after 1858. After the termination
    of the East India Company administration, there was an attempt to put in order
    the records of the Government of India. The original motivation seems to have
    been the destruction of old records to save space and expenditure on record preservation
    in the offices of the Indian government in Calcutta. The Finance Commission and
    the civil auditor [CAG], (he was like the later-day comptroller and auditor general)
    and the military audit was done by a different auditor) recommended to save unnecessary
    expenditure files may be sorted out to identify not likely to be useful and thereby
    be sold as ‘waste paper’. Since the issue of expenditure and financial stringency
    comes repeatedly in the discussions on this matter, it will be useful to briefly
    note the nature and extent of financial stringency that formed the background
    to the first steps taken by the Government of India in respect of records after
    the termination of the East India Company’s rule.


    The uprising of 1857 brought home to the British that—as Warren Hastings had said
    long ago—they had to maintain their control over India ‘by the sword’.¹ More specifically,
    the perception of


