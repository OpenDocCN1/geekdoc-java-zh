  md: '# Foreword


    The process for establishing archives in India started during the colonial period
    with the process of dismantling ''useless'' records. Preserving records of important
    activities for future use considered a potent administrative tool by the British.
    The story of the institutionalization of the archiving system in India has been
    noted by noted historian Sabyasachi Bhattacharya in this book. The book lucidly
    describes the reasons, directives, problems, and policies stipulated for the formation
    and final setting up of the muniment room (central records room) during the colonial
    period. It also documents the process of the collection, documentation, and publication
    of the records by the British officials and their utilization for documenting
    the history of India, even before the setting up of an archival institution in
    India.


    This work provides a comprehensive documentation of records used by different
    historians and officials for their works and the wide-ranging periodical record
    of letters, official orders, and government proceedings were selected and published
    by the governments of the three Presidency towns in India. It also chronicles
    the policy, step-by-step growth, and development of the record-keeping system
    in Britain, and its application in India. The policies formulated and followed
    by the British Indian government for the management, disposal, and utilization
    of government records have thus been systematically narrated in this volume.


    Bhattacharya chronologically divides this seminal work into four chapters and
    presents the history of the setting up of the Imperial Record Department (IRD)—the
    precursor of the National'
  merge: -1
