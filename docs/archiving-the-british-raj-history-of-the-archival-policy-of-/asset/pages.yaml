    traced to the acceptance of this principle in the early days of the French Revolution.
    In India—that kind of dramatic background was conspicuously missing. The crystallization
    of that principle—recognizing ‘the public’ in India—took a long time when gradually
    the Indian nationalist movement, from the Non-Cooperation Movement onwards, transformed
    the political discourse, with the systemic changes through devolution of power
    and transfer of power in British Indian legislation in 1919, 1935, and 1947 and
    the emergence of the Indian Republic altered the constitution of the polity. The
    consequent change in the lines of power reflected in the archival discourse of
    the last two decades of the colonial state. In studying the history of what happened
    in the IRD, we have to bear in mind these changes in the scheme of things; however,
    in these pages it will be neither necessary nor possible to narrate the changes
    that form the subject matter of standard political history. Those developments
    in the relationship between the colonial state and the people whom it ruled are
    in a way reflected in a nutshell in the developments of the IRD and policymaking
    in the domain of archiving. In this context, one can appreciate the significance
    of the resolution passed by the IHRC at their 23rd session in 1946, recommending
    that the IRD be renamed ‘National Archives of India’.¹¹¹


