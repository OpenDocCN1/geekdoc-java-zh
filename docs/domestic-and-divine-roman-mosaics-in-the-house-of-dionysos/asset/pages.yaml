    # ARCHITECTURE: THE PLAN


    Paphos may be taken as an example of a modest eastern provincial city under Imperial
    rule, and the House of Dionysos can serve as a model of elite residence that incorporates
    the cultural habits of Rome in a Greek setting. Aspects of the plan, as well as
    the mosaic decoration of this Paphian house tou, reflect the political reflection
    of the position as "ostensibly pro-Roman."37 The domus was built on the ashlar
    foundations of an earlier Hellenistic house.38 The house was redesigned and rebuilt
    with features characteristic of Roman houses of the period, namely a peristyle
    (courtyard), a triclinium (dining room) (B), and a fish pond (E); see floor plan,
    fig. 1.


    A general view of the house reveals a quadangular plan of roughly 56 meters by
    30 meters (2000 sq. m.) with over forty rooms (figs. 3, 4). As is typical of a
    peristyle house, the rooms appear to radiate from the peristyle courtyard (fig.
    1, area (C), but the layout reveals an arrangement of three discrete blocks placed
    along the north-south axis. Each area can be generally defined by its literary,
    hospitable, or familial function; each has its own courtyard, namely eastern,
    central, or western. The western section contains the main entrance, the triclinium
    (B) with its subsidiary service quarters tucked into the northwest quarter and
    centered on a small courtyard with a basin (F). The central block is identified
    by the large peristyle (D), the nucleus of the whole house. This area received
    the most lavish decoration, as evidenced by the need of mosaic floors to the north
    and south of the peristyle; it clearly served the reception needs of the owner.
    Since the triclinium expands toward the west port of the peristyle (C), it is
