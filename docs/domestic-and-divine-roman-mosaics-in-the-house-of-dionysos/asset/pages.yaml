    illustrates the interplay of sources within one workshop. Aside from the universal
    guilloche (braid) and sawtooth, the most frequently used border motif in the Paphian
    house is the swastika-meander, which appears on eight floors in a variety of combinations.¹¹¹
    In cases the meander functions as a surface composition (color pl. 1, square 12,
