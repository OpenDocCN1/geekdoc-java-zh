    # ICONOGRAPHY OF THE HUNT


    The search for parallels of the formal arrangement of the amphitheater mosaic
    at Paphos required the castings of a wide regional net. It appears that the iconographic
    details point to many of the same examples. Common language shared by this group
    of amphitheater hunts is marked by the types of activities depicted, by the details
    of costume, equipment, and props, and by the portrayal of the beasts. The ways
    in which the Paphian dancers differ point to observations on the relation of visual
    representations to the life of society and on the possible significance of such
    scenes. Unique features of the Paphian hunts suggest that actual performances
    were the inspiration for the patron''s selection and for the originality and realism
    with which the mosaics were conceived.


    I have the terms "hunt" and "amphitheater" interchangeably, but it is now necessary
    to distinguish the hunts practiced in nature or sport for the procurement of exotic
    beasts for the arena from those hunts performed by professional venators in the
    amphitheater.\57 Although they represent diverse events, the Zliten, Kos, Paphos,
    Aventine, and Orbe mosaics all reflect the reality of the spectacle.


    The Paphian hunts represent an interesting variation on the venatio spectacle.
    A careful inspection illuminates how the Cypriot hunts differ. The six venators
    and eighteen beasts represent hunting incidents, each punctuated by natural and
    architectural features. Each of the three long panels begins with a landscape
    element, a truncated tree on high rocky ledge.


