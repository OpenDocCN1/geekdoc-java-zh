    The House of Dionysos at Paphos and its floor mosaics of the first and second
    centuries, the middle Roman period, offer an intriguing case for the study of
    the domus cultural. My task is not to catalogue the Cypriot pavements but to reconstruct
    the concerns and intentions of its inhabitants through the decoration. Although
    I address questions of chronology, archaeology, technique, and iconography, the
    goal of each chapter is contextual interpretation. This is possible at Paphos
    because the pavements are preserved in an archaeologically excavated site with
    a complete floor plan. The site offers an unusually rich view of the process by
    which provinces assimilated Roman habits and institutions.


    Can localities be read in their selection, interpretation, and combination of
    mosaic themes? Certain design strategies are distinctly Roman and should be read
    as cultural expressions to the patrons'' desires. Some mosaics stand alone as
    symbols of status; multip reinforce their impression. The knowledge of recognition
    of specific designs is assisted by our reading of ancient literary sources.³ Of
    course, not every pattern or figure was purposefully selected; workshop practices
    and artistic traditions play a dominant role in mosaic production. In our consideration
    of the sources and meanings of the mosaic themes in the Euphian house, a balance
    of approaches proves most rewarding.


    # THE SITE AND ITS HISTORY


