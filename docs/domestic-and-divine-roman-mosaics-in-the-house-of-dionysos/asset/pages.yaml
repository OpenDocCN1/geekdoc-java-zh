  md: '# Chapter 4


    # The Reception Suite

    Xenia and Ganymede Mosaics


    ![](img/22898a1030288fa55d3b498d879beb37_135_0.png)


    THE ASSIGNMENT of room functions by mosaic themes is difficult to establish and
    rarely supported by archaeological or epigraphic evidence. Yet in the case of
    rooms 9 and 10, their locations in the architectural plan and their mosaic decorations
    suggest a relationship to dining (fig. 3). If we embed these mosaic themes in
    a functional context, an interpretation of their meaning expands into a cultural
    discourse about Roman notions of prestige and status. An examination of their
    physical settings within the house and iconographic analyses of the “cushion”-patterned
    xenia (still-life motifs) and the Ganymede panel disclose obvious site-specific
    compositions. It is also possible to move beyond the ascription of reception activities
    to these rooms and consider the nuances of the dialogue between host and guest.


    Rooms 9 and 10 are adjacent and set against the north wall of the house not far
    from the rear entrance (G1), between the kitchen area to the west (F2–F4) and
    the private quarters (cubicula Ki–Ka), with which they share a latrine (H) (fig.
    1). Their proximity to the peristyle through the narrow room 8, off the north
    portico (fig. 70), echoes the grouping of multiple reception rooms, some more
    public and others more private, around courtyards throughout the Roman provinces
    but especially in North Africa.¹ In their access to the utilitarian sectors and
    to the


