  md: '# GEOMETRIC ORAMENT


    The selection and treatment of ornament in the borders and central fields in the
    House of Dionysos offer strong internal evidence for dating, for stylistic transmissions,
    and for the mechanics of meander production. Unlike that of figural mosaics, the
    execution of geometric and vegetal motifs were far less subject to external influence.
    Although iconographic misinterpretations and stylistic affects seem to be the
    common pitfalls of the copying of figur compositions, the execution of patterns
    reveals the idiosyncratic nature of a workshop.


    A survey of the lozenge-star-square pattern (room 8) uncovers a broad spectrum
    of provincial developments, for the popularity of this design provides an index
    of regional types within a datable series. The inclusion of a multiple-design
    mosaic in room 14, unusual in the east, suggests the interdependence of workshops
    as far apart as Gaul, Tripoli, Byzana, and A close examination of certain border
    motifs underlines the sources of and influences on the Paphan mosaics. Although
    the use of multiple frames around central panels (either figur or geometric) is
    typical of eastern mosaics, the variations of the swastika-meander found in eight
    borders in the House of Dionysos confirm the use of western models. Border patterns
    such as the twisted ribbon in rooms 3 (peacock) and offer 8 convincing evidence
    of an intimate connection with the Antioch workshop(s).


    # THE LOZENGE-STAR-AND-SQUARE PATTERN


    Of all the geometric patterns appearing in the House of Dionysos, the lozenge-star-and-square
    was the most frequently represented throughout the Mediterranean during the Imperial
    era. Its form was established in the first century and followed by a series of
    permutations that can be chronologically linked to regional developments.


    A long narrow room (room 8, 10.25 m × 3.40 m.) directly north of the north portico
    has as its central design a pattern of tangent stars forming squares and smaller
    poised squares (figs. 24 and 25).¹ There are four rows of seventeen large-squares
    lie along the sides of the border. The lozenges contained colored fillers of alternately
    dark-grey and pink, and the poised squares contain crosslets and indented squares
    of the same colors. The large squares are diversely filled with both geometric
    and vegetal motifs. A close examination of the Paphan interpretation places it
    securely within the radius of the Antioch mosaics during the Severan period. The
