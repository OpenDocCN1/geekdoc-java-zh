  md: 'Roman taste for creating miniature paradeisos within their homes.99 The collection
    of wild birds and beasts is the privilege of the aristocratic classes, but the
    appearance of these themes in wall paintings and mosaics throughout the provinces
    attests to a widespread emulation of such luxurious apartments. In imagined aviaries,
    gardens, and adornments of *xenia*, the peacock typically struts in profile with
    closed tail.100 It can be generally observed that whenever the peacock is in a
    collection of birds, Dionysiac symbols, or still-live motives, it is always shown
    in profile; the outspread tail is reserved for a reception function. In the vineyard
    mosaic at Paphos, the display qualities of the bird are fully exploited; because
    of the location, it serves as a sign of greeting. The visitor cannot help but
    visually connect the trillennium peacock in the room one and three, to reinforce
    the sense of *felicias temporum*.101


    The Paphenian section is presented in a *peudo-emble*; set as it is a picture
    in the midst of a bold geometric design, which produces the effect of a wind cut
    into the pavement. In this way the peacock is effectively set apart in a highly
    significant space, and in respect it is comparable to the placement of single
    peacocks, either painted or in mosaic: in niches, aged spaces, or simulations
    of them in the North African examples discussed above. From the obvious physical
    location adjacent to the Seasons mosaic and the “XAIPE” “KAICY” inscriptions suggests
    that the peacock thematically and spatially extends the salutatory function of
    room 2 at the main entrance to the house. Aside from the obvious aesthetic appeal
    of the motif, the peacock, whether or not it is explicitly associated with Dionysos,
    is a to for luxury, prosperity, and good fortune.102


    > 99. Zanker has written extensively on this phenomenon (1979, passim).

    100. Among the many examples, the peacocks in the Seasons surrounding the octagonal
    pool in the courtyard of the early-3rd-century House of the Aviary at Carthage
    (Lavin 1963, 213–14, fig. 31–33). See also the two peacocks that flank an emperor
    at the edge of an early-3rd-century mosaic of aviary and manands from a house
    at Sousse (Sousse 1960, 57:25–46,2–201, pl.). For peacocks among still-life subjects,
    a mosaic from El Aia (Barda, iv. 1979) and from La Chebbi (Barda, iv. 88). An
    exception to this rule may be seen in one of the few frontal peacock with spread
    tail as a xenia motif in room 101 of the House of the Trifolio in Thuburbo Majus
    of the 4th century; Ben Abed-Ben Khader 1987, p. 20–21, and 59, medallion 33.

    101. The association of *felicitas* with the peacock of spread tail occurs on
    coins and medallions; see Toynbee 1944, 1650,1957, p. 29.

    102. Geyer rejects any religious interpretation of the peacock, i.e., as a symbol
    of immortality, and proposes that it be read as a generalized symbol of beauty,
    fortune, and the good life (1978, 98–102, esp. 102).


