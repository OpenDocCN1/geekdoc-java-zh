    The tradition of depicting pairs of beasts in contests concurrently with narrative
    frizes of the same themes, and the two approaches undoubtedly enriched each. The
    depiction of felines at Paphos follows the patterns of felines in contemporary
    mosaics throughout the Mediterranean. This uniformity is attributed not only to
