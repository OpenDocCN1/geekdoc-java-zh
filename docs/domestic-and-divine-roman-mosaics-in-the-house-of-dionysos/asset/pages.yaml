  md: 'undoubtedly reflects the diversity of these settings. Similarly, as the pergolas
    shading the masonry triclinia, in both the outdoor gardens and the peristyle gardens,
    were covered with varied plantings, so were the vine mosaics diversely arranged.⁵9


    The Paphos floor combines two types of vine compositions and represents a conflation
    of eastern and western traditions. The all-treatment of the floor as a vine carpet
    links the Paphian creation with the North African series, which almost exclusively
    uses the pergola-type composition ultimately derived from ceiling decoration.
    The use of real trees as the dividers, however, is inspired by “katoptic” view
    of a garden that originated on floors and was explored primarily in the east.
    The Paphian vine arbor with its realistic vine trunks vividly illustrates a fashion
    for representing vine schemes by a series of upright trees that divide the composition
    into discrete units without imposing a central focus.


    # ICONOGRAPHY


    The treatment of the Paphian vine scene as an all-over carpet offers provocative
    evidence of the possible ties of the Paphian workshops to the North African workers.
    Yet we can determine that the mosaicists at Paphos clearly do not base their composition
    on North African models, for two major reasons. One is the choice of the upright
    vine plantings, already discussed. The second is the inclusion of rustic activities
    performed by adult figures within the context of the Dionysian victory. The imaginary
    world of the winged Erotes is meant to evoke Dionysian associations and, as such,
    offers a colorful complement to the Dionysian Triumph at the entrance. The addition
    of rustic figures attests to the conflation of a mythological vintage rustic realism
    and distinguishes the Paphian vine carpet as an original product.


    In North Africa, the distinction between fantasy and genre was maintained even
    when the vogue for realistic subjects intensified during the Severan period. Generally,
    vine carpets are inhabited by Erotes and linked to Dionysiac themes (fig. 150),
    while rural scenes are filled with peasants engaged in the occupations of country
    life (fig. 159).⁶⁰ This differentiation is complicated by the involvement of Erotes
    in rustic customs. The compositional development of vine carpets and rural scenes
    remained until the fourth century, when overlapping


