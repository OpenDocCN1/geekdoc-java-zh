  md: '# Acknowledgments


    The questions teased out by the bold and unusual mosaics in the House of Dionysos
    at Paphos in Cyprus sparked my interest over a decade ago and prompted the initial
    research that led to this book. The anomalies presented by these compositions,
    especially for the work of the middle Roman date established by the archaeological
    finds, offered a rare opportunity to examine a host of issues presently presenting
    social historians. Close analysis of these pavements yielded strategies for “reading”
    Roman interiors. Analogous mosaics, reliefs, and paintings elsewhere indicate
    a dynamic history of cultural and economic exchanges among Mediterranean communities,
    from which we can trace the impact of Romanization on domestic life.


    Among the many individuals and institutions to which I am indebted for assistance
    during the writing of this book, Ernst Kitzinger must be named first for his continued
    advice and suggestions. For the initial invitation to study and publish these
    mosaics, I am deeply grateful to the late Kyriakos Nicolaou, excavator of the
    site at Paphos. His generous and open attitude was greatly appreciated by my colleagues.
