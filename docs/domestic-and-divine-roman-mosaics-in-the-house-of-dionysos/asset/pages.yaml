    The Paphean design is an assemblage of pseudo-emblemata and has the same additive
    quality that is found in the early floors composed of individually assembled mosaics.
    Among the African scenes, the closest parallel would be the Seasons floor from
    Zliten, where a grid arrangement of nine panels features the Seasons and is flanked
    by four panels with xenia (of animals, fish, fowl) and two Nilotic scenes (fig.
    61).³⁹ Because all the Zliten panels were found in a terracotta can they can qualify
    as true emblemata, mosaics were found in a workshop for export to a site.⁴⁰ Although
    opinions vary for the date of the Zliten mosaics—from the first through the three
    centuries—the use of emblemata, at least for the Seasons pavement may indicate
    an Early date; if the pavement is Severan or later, then it is purposefully archaic.⁴¹


    This impression is reinforced by the similarity of the Zliten xenia to earlier
