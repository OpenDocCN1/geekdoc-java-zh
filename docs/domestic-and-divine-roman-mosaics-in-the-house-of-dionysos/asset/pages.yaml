    # Conclusions


    ![](img/22898a1030288fa55d3b498d879beb37_331_0.png)


    MY AIM in this book has been to present the pictorial imagery of the Paphian pavements,
    to analyze their technique, iconography, and style, and to place them in their
    physical contexts in order to comprehend their meanings and functions. In reviewing
    the various strands of interpretation that emerge, we gain a new appreciation
    for the verifiable cornucopia of literary and artistic references that learnt
    at the ancient visitor. The beholder’s signs, dense in imagery and laden with
    physical and mental responses to such houses, has been the subject of recent study.


    The preceding analyses of the Paphian pavements leads to at least two paths of
    interpretation. The mosaics tell us about the process of Romanization in the eastern
    provinces. The second path is to question whether the decorations resulted from
    a comprehensive plan, encompassing if not all (at least of the figuring ones)
    of the mosaics. That is the more difficult approach, as has remained an elusive
    task in Roman studies and is more provocative and speculative as an argument.
