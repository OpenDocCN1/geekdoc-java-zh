    development is dominated by the North African series, represented by sixteen extant
    pavements, the Paphian vine panel offers important evidence for the derivation
    and evolution of these flores. The upright arrangement of the vine shoots distinguishes
    the Paphian composition from the entire North African series. The vines in Paphos
    grow out of stalks firmly rooted along the groundline, rather than springing from
    kraters or acanthus clusters set in corners as they do in all the North African
