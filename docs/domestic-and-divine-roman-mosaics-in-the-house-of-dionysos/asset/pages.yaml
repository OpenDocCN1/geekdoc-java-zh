  md: '# # Chapter 1


    # # Introduction


    RECENT SCHOLARSHIP, as well as this book, draws on the premise that the art and
    architecture of Roman houses express the social realities of their inhabitants.¹1
    It assumes that these houses—their floor plan, the shapes of their rooms, and
    their decorations—reflect not only the private lives of citizens and their familial
    interactions but their public affairs as well. Because of the penetration of *res
    privata* and *res publica* within the Roman household, the house itself is an
    excellent object of study for social historians of a society. To the extent that
    the public life of the *dominus*—the head of the household was within home, the
    *domus* can serve as a sociopolitical document. The constructions of domestic
    life declared the status of the owner-patron, his class aspirations, and his achievements.


    There is much, however, that we do not know about Roman houses. The epigraphic
    evidence for individual houses is scant, and most houses cannot be matched with
    specific pattern or family. Nor is it often possible to trace the names of a series
    of owners for family. Questions remain about the way


    ¹. For some recent studies, Clarke 1993b on the houses of Roman Italy; Wallace-Hadrill
    1988 on social structures in the Roman house; Wallace-Hadrill 1994 and Thibert
    1987 for reflections on Roman houses in North Africa; Allison 1992 on the relationship
    between wall decoration and room type in Pompeian houses; Neudecker 1988 for sculptural
    decor in Roman villas; and Gazda 1991 for an anthology on Roman private arts.


