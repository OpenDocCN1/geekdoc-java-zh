  md: '# Chapter 2


    # Technique and Style


    # Mythological Mosaics and Geometric Ornament


    ![](img/22898a1030288fa55d3b498d879beb37_37_0.png)


    A BRIEF INTRODUCTION to the technical aspects of mosaic production may help lay
    the groundwork for our later investigation of this art form as a social document.
    As examples, I especially examine two of the mythological scenes—Narcissus in
    room 1 and Hippolytos and Phaedra in room 7—and selected geometric patterns that
    best elucidate workshop methods, the use of models, and the nature of regional
    exchanges as expressed through the diffusion of taste and composition. In each
    case—the figure and ornamental—issues of transmission, models, and copying are
    precisely defined and shed some light on a subject for which too little textual
    or archaeological evidence has been.


    The mosaics of the House of Dionysos appear to be produced by a curious mixture
    of hands trained in the Greek east with tastes formed by western contacts. What
    is surprising and, in fact, enlightening about the evidence at Paphos is the fact
    that many of the mythological mosaics point to an Antiochene influence, even to
    an on-site presence of Antioch craftsmen, certain of the geometric mosaics demonstrate
    an unknowable knowledge of patterns and motifs found only in the west. The geometric
    mosaics that confirm close contacts with Antioch


