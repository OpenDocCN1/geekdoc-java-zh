    The Romans held Cyprus as a minor senatorial province under the empire and, judging
    from the minimal attention of ancient historians, was considered a provincial
    backwater. Some historians postulate that its minor position was a result of its
    intimate association with Ptolemaic Egypt; Ptolemaic Cyprus was ceded to Rome
    as an outcome of the Battle of Actium.¹14 This connection may account for the
    facts that Cyprus possessed no colonies and no Cypriot held a significant position
    in the Roman government during the Imperial period. Although Roman citizenship
    was uncommon and seemingly unobtainable even for the magistrates, these Cypriot
    notables supported institutions of the polis and affirmed their *Romanitas*.15
    The archaeological evidence records far more eloquently verify the Romanization,
    prosperity, and cultural activities of Cyprus. The spectacular mosaics, largely
    from Paphos, support the notion that there was a rise in prosperity in the late-second
    century which coincided with the reign


    14. Mitford 1980b, 286; and Mitford 1980a, 1296.

    15. On the incidence of Roman citizenship in Cyprus, see Mitford 1980b, 284; and
    1980a, 1362–65.


