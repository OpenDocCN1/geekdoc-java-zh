    ordered range of tones, and the regular rhythms of the undulating ribbon are also
    lost. There is a certain looseness, almost a splashdash character to the execution
    of the motif; it may seems logical to assign this twisted ribbon to another, less
    “trained,” craftsman who must have seen the white highlights in room 8 and attempted,
