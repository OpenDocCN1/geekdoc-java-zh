  md: 'Africa from the second through the fourth centuries (fig. 74).¹⁶ so-called
    cushions are poised squares with concave sides that are adjacent to ellipses and
    circles, and determine concave octagons.¹⁷ Although these "cushion" designs are
    formed by the juxtaposition of interlaced geometric units, each with its frame,
    and are distinct from those formed by interlacing circles at Paphos, they are
    the closest chronological and formal comparisons for the Paphian mosaic. The guilloche
    and wave pattern were more tightly interwoven within the Paphian design, the smaller
    circles or "cushions," would be more pronounced; the effect would be one of adjacent
    "cushions" and large circles.


    In this Paphian design is not unlike certain cushion designs found in Byzantene;
    large circles and ellipses are adjacent to the cushions and the concave octagon
    is eliminated.¹⁸ Eight such mosaics were found in El Jem, where bands of guilloche
    and wave pattern are also used to outline the "cushions," but they are not interlaced
    nor are they in the same design as Paphos. Two of the examples from El Jem decorate
    triclinia which have T-shaped mosaic designs and appropriately include xenia,
    or still-motifs, as fillers. Both of these mosaics, from one House of "Tertulla
    and the other from the House of the Months, are of Severan date, and they so closely
    resemble a third "cushion" design from La Cheba (40 km. of El Jem; fig. 75) that
    they must be based on the same model and/ have been done by the same workshop.¹⁹
    Realistic evictions of fish, fowl, and vegetables garnish this "cushion" designs
    and complete the reception function of the rooms they decorate. Another (Antoine)
    but nearly identical version of the El Jem and La Cheba "cushion" mosaics were
