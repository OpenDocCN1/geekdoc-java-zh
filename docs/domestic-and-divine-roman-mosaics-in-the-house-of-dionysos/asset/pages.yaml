    # Public Spectacles in the Private Sphere


    ![](img/22898a1030288fa55d3b498d879beb37_287_0.png)


    HUNTING MOSAICS offer a broad and profound view of both the stylistic evolution
    and the cultural developments that accompanied the Romanization of the east. Scholars
    have analyzed the implications of their compositional varieties and have generally
    located their iconographic sources in the contemporary practices of Roman society.
    An examination of the hunting scenes that decorate three porticoes of the Paphian
    peristyleyle provides compelling new evidence for the theoretical schemes of development
    outlined by these studies. A consideration of the location of the Papian hunting
    mosaics within the plan and overall decoration of the house, along with an inspection
    of the analogies for their composition and iconography, yields insights into the
    complex dialogue between form and function, aesthetic taste and communal practice.


    Like vine pavement in the triclinium, the hunting mosaics are unusual for the
    eastern mosaic repertoire, especially for the proposed late-second-century or
    early-third-century date for the House of Dionysus. Although the subject of the
    hunt, drawn from the rustic genre and from staged events in the amphitheater,
    was known in the east, it is the composition of the Paphian hunting that is so
    surprising for its early date. In fact, it is unlike any other composition in
    the house


