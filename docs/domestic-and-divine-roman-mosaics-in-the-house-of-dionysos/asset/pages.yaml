    The swastika-meander in room 8 serves as the outer frame for the lozenge-star-and-square
    composition (fig. 24).¹¹³ The swastikas are poised so that the design is set oblique.
    The line of the design itself is formed by a series of poised squares set to point.
    This treatment of the meander may have its roots in the early technique of opus
    signinum in which pieces of white marble were set to point in a bed of terracotta-colored
    element.¹¹¹⁴ The diagonal swastika-meander in opus signinum was frequently used
    in Pompeii for borders, vertices, and thresholds.¹¹¹⁵

    It appears that the dark-on-white meander derived from Africa which were then
    transmitted from Sicily and North Africa. The effect of the signinum is imitated
    in opus tessellatum (mosaic technique employing using tessera or cut pieces of
    stone) in second-century examples from Tunisia, Sicily, and Spain.¹¹¹⁶ For instance,
    one border is especially close to the castoreale San Blasio on the north coast
    of Sicily.¹¹¹⁷ The central panel of the tablinum consists of an opus sectile (decoration
    of cut pieces of marble) pattern of hexagons in a border of black tessera, and
    is bordered on three sides by swastika-meander in opus tessellatum diagonally
    to the axis of the room. This mixture of techniques reflects an aesthetic preference
    for arranging the floor design into hierarchical units of threshold, border, and
    central panel. Although the Paphos floor is entirely executed in opus tessellatum,
    functionally the lacelike effect of the dark-on-white meander border sets off
