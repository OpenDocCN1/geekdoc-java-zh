  md: 'The presumption that room relates to dining impacts, in turn, on the interpretation
    of the adjacent room 10 with the Ganymede myth. The obvious allusions to banquets
    and pleasures elicited by the myth of Ganymede were certainly not lost on the
    ancients. At Paphos we are afforded a rare view of this interplay between myth
    and social realities. If I had discussed either the interlace “cushion” pattern
    or the Ganymede mosaic solely in terms of its decorations (in Chapter 2), their
    roles in constructing a design for the social life of the household would be less
    obvious, along the intent of the patron and designer.


    # XENIA IN AN INTERLACE “CUSHION” PATTERN


    The character of the design and of some of the filling motifs in room 9 decidedly
    to welcome western models and reinforces the indications of western influence
    in the Paphian geometric patterns, especially in the multiple-design composition
    in room 14. An unusual interpretation of an interlace “cushion” pattern covers
    the floor of room 9, one of the largest (8.45 m. × 5.85 m.) in the house (figs.
    71 and 72). The design is boldly conceived in the palette of white, black, gray,
    and pink, with secondary colors (olive, reddish-brown, and yellow) for the fillers.
    The geometric field is framed by a black-and-white swastika-meander in a key pattern.
    The basic units of the design are outlined by bands of interlaced guilloche (pleated
    ribbons) and by bands of waves; the interlace alternately creates small and large
    tangent circles and concave octagons. The design appears to be cropped derbitarily
    at the edge so that the octagons and smaller circles lose about half of their
    interlace frames;that is, there are no internal outlets for the individual compartments,
    the white background of each unit bleeds into the margins. Each smaller circle,
    colored half in pink and half in reddish-brownircles are set at the edge of octagons—contains
    white poised squares with concave sides. Every other octagon has a scalloped border—the
    twenty-eight circles and forty octagons are filled with a panoply of geometric
    motifs that range from the simplest elements—such as a single square, an octagon,
    a lozenge, a solid color, concentric circles, dotted squares, a dotted swastika
    and Solomon knots—to more complicated patterns, including a swastika-meander,
    overlapping octagons, solids-perspective that surrounds a lozenge and a square,
    a circular labyrinth, a variety of stars made of either loenges, squares, or triangles,
    a square with a checkerboard, rosettes of different patterns, and networks of
    loops and circles. Ten of these units contain tableaware objects. A floral bud
    (gray) is set diagonally in each corner. The closest comparisons in the east for
