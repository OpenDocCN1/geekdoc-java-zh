  md: 'This text can guide our reading of the Paphian mosaics on several levels. First,
    wine drinking is a benefactor of a divine teacher—Dionysos is presented as such
    at the left side of the panel. Second, to drink in a civilized manner one to mix
    wine with water. Just as the Altar to the Nymphs reminded the Attic inhabitants
    to drink mixed wine, so too the three aqueous methods effectively recall water
    to the minds of the ancient guest.¹¹³ The moral implications of the tale, demonstrated
    by the symbiotic prayer to Zeus, are also applicable to the Paphian mosaic, which
    presents the deleterious effects of wanton drinking as a lesson.¹¹⁴ Athenaeus
    follows the Hellenistic text to a discourse of his own drunkenness (methē) and
    the mystic rites of Dionysos (2.40).¹¹⁵


    In the same text, Athenaeus goes to list (2.41–44) the various kinds of water
    (fresh, salty, sweet, well) available to the consumer. In this taster''s guise
    to water Athenaeus takes on a tour of sources throughout the ancient world. Not
    might a similar sequence of ideas be presented in the west portico at Paphos,
    where various rivers—Ladon and Pyramos; Ammon and the sea—Poseidon are depicted
    alongside the drunken figures and the gift of wine? While they cannot be actually
    said to illustrate the text of Athenaeus, the mosaics might have elicited responses
    similar to those for the symposium feasts.


    The invit role played by spaces adjoining reception rooms is demonstrated by the
    mosaic decorating a corridor that leads to the triclinium of the House of Bacchus
    at Complutum (Spain).¹¹⁶ There, six servants raise differently shaped cups as
    if to offer libations to the pouring guests. The expressive and realistic qualities
    of this mosaic are somewhat more expected for the late date of the Spanish house—late
    fourth or early fifth century. The prelude nature of the west portico ensemble
    for the banquet, although more deeply coded, is nevertheless functional.


    From this vantage, the mosaics could have functioned as visual cues for table
    talk. For instance, in Plutarch''s Tale Talk (3.8–9.657) the guests are directed
    to mix three parts of water to two parts wine. The mosaics reflect the encyclopedic
    interests found in symposium literature that, in turn, record the conversational
    style of ancient banquets. As such, the west portico mosaics form a brilliant
    and original preface to the grand reception hall, wherein Dionysos is depicted
    as triumphant over the Indians (the non-Greek, dark-skinnedened figures in the
    mosaic), and the numerous activities of viticulture are celebrated in a luxurious-carpet
    mosaic.


