    If we return to the three mosaic Triumph that offer the closest parallels in style
    and composition (not necessarily in iconography) that is, the Antioch, Acholla,
    and Gerasa panels, a firm impression of Roman workshop methods emerges. The mosaicist
    of Dionysos, with his counterparts in Syria, Trans-Jordan, and Africa Proconsularis,
    drew on models in vogue throughout the Empire, by he used them in a semi-ingenious,
    semi-ingenious way; they were not as skillful as the workshop of the mosaic in
    the great metropolis of Antioch, but quite superior to rustic provincial provinces.
    It seems likely that the models used for these mosaics were composed of isolated
    figures. In other words, the mosaic designer (pictor) could conceit a triumph
    scene from a variety of mosaics that were no longer tied to their traditional
    context; once selected, these could not be modified at the discretion of the mosaicist.
    Such a process remains distinct from the one that produced the Triumphs on the
    Walters Art Gallery sarcophagus and the Setif mosaic, which undoubtedly derive
    from cartoons of an original painting; in these cases the artists attempted to
    reproduce their compositions and adhere faithfully to the source. The Triumph
    of Dionysos reflects a process, known in sculpture, whereby the artist combines
    figurative types, rather than following a single model. The development of certain
    themes as reliefs anticipates their appearance on mosaics by at least twenty years
    and provides evidence for the dependence of the iconography mosaics on the products
    of the sculptors'' studios, primarily those of Rome.


    The Triumph of Dionysos suggests that both sides of the model question may be
    considered accurate.84 The parallels noted above between the figures on Dionysiac
