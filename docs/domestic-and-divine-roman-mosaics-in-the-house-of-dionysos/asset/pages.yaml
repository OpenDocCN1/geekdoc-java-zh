    Roman homes reflect a shared vocabulary for domestic decoration.


    As for the popularity of the theme, it seems that by the late Antonine age celebration
    of a Roman Triumph began to merge with civic religious processes. This phenomenon
    took hold especially in the Greek state, where the Hellenic elite associated the
    emperor with divinity.86 For example, coins for Caracalla issued in Amorium, unusual
    Phrygia, bear imperial triumph presented in the guise of the return of Dionysos
    from India.87 Many third-century emperors chose elephants to draw their chariots
    in imitation of Dionysos. Elagabulus was reported to have dressed in the garb
    of Dionysos for his triumphs. The concurrent rise in the popularity of the Triumph
    of Dionysos for domestic mosaics makes perfect sense, as the patrons, often provincial
    notables, were eager to demonstrate a range of imagery drawn from the civic life
    they themselves sponsored.


    # THE DIOSCURI PANELS


    The Dioscuri are represented in two panels at each entrance of the Triumph of
    Dionysos process at the entrance of the triclinium.88 The twin deities are shown
    in full military attire standing beside their horses. Although their bodies are
    frontal, they turn their heads in three-quarter view toward the Dionysiac procession;
    their horses are posed in profile with one leg bent (figs. 141 and 142). Each
    youth, crowned with a wreath, holds a long lance in one hand and a bridle in the
    other. The golden (yellow) star that appears after each laureate head makes the
    identification with Castor and Pollux unmistakable.


