  md: 'that fill the squares of the lozenge-star-and-square pattern in the triclinium
    of the House of the Drinking Contest.9 These few common details serve only to
    underline the close ties of the Paphian workshop with Antioch, and they do not
    negate the western tone of the entire composition.


    The overall effect of the Paphian composition is that of a dense field with a
    kaleidoscope of filling devices. In this respect it is quite similar to the multiple-design
    floors found in the Rhone Valley. Although all these floors are organized by a
    grid of squares, they share the same compulsion as demonstrated in the Paphian
    mosaic: to fill the fillers without regard to symmetry or repetition. The characteristic
    affair of medallion and square motifs found in multiple-design mosaics also occurs
    in the Paphian interface. A surprising number of the Paphian mosaics are replete,
    albeit in a rarer and more simplified form, those in Gallic mosaics. A floor from
    Lyons, dated to the first quarter of the third century, offers a large sampling
    of devices in its ninety squares.10


    All of the Paphian mosaics, the labyrinth is the most suggestive of ties to western
    worlds.11 Labyrinth designs appear in several multiple-design compositions in
    France, Switzerland, and Italy but to be nonexistent in eastern mosaics.12 Curiously,
    many of these western parallels dated to the first half of the third century and
    cannot be considered to the Paphian mosaics.13 The earliest floor in the Gallic
    court, the black-and-white mosaic from Ouzouër (fig. 36), has a labyrinth at its
    center, and is dated to the mid-second century because of its Italian character.14
    The Ouuzër mosaic has been introduced as an important parallel for the multiple-design
    floor in room 14 at Paphos; it indicates, along with other elements in the Paphian
    geometric retorte, a dependence on Italian models. Any of the interface mosaic
    in room 9 must be related to the character of the multiple-design mosaic at Paphos.
    However, the Paphian workshop has received most of multiple-design compositions
    with attendant floors (i.e., the labyrinth) shortly after the Ouuzër floor was
    created. can be seen as a local adaptation of a western (Italian?)—it is interpreted
    with chromatic exuberance and provincial simplification. The inventiveness of
    the Paphian workshop is demonstrated by the application of multiple-design effects
    within an interface “cushion” pattern and by the combination of motifs from Antioch,
