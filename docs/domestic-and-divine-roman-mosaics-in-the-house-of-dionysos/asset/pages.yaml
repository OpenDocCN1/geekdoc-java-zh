  md: 'The grid arrangement of nine pseudo-emblemata at Paphos must be seen as an
    aesthetic choice—no longer a technical limitation—undoubtedly an imitation of
    a composition with emblemata.


    An analogue stated to Campanian still-life designs is found in a Roman villa at
    Anaploga near ancient Corinth.49 Three panels with an array of xenia motifs in
    brilliant polychrome are arranged vertically at the center of a large room, providing
    a reception room. Each panel is surrounded by an isometric meander, which creates
    an illusionistic effect similar to that of the cuboid border at Paphos. This mosaic,
    dated on archaeological grounds of the late century of our era, demonstrates that
    the imitation of emblemata and/or panel paintings entered into the mosaic repertoire
    in the Greek era early early. This view is supported by another pavement from
    a nearby Roman villa at at Corinth, where five panels with still-life scenes surround
    the central pool of the atrium.50 The panel depicting a goat lying under a tree
    can be compared to the Paphian Spring tableau showing a goat nibbling on a tree.
    The mosaics from this area of the villa have a Hadrianic/Antonian date and reinforce
    the suggestion that the reproduction of genre scenes in pseudo-emblemata was practised
    in the Greek east in the early Period. The Paphian Seasons can be considered,
    along with Corinthian mosaics and the Tripolitan paintings, as derivative of the
    emblemata tradition and the related Campanian paintings.


    Why these trends reached Paphos and were not represented at other sites, for example
    at Antioch, remains unanswered.51 The Seasons, with other floors at Paphos, can
    be compared to mosaics in Tripolia and to Italic models, like these Campanian
    paintings. It is not clear that the Trojan mosaics precede the Paphian mosaics.
    If however, the Zeliten mosaics would be roughly contemporary or a bit later than
    the Paphian mosaics. This situation leaves open the question of transmission.52
    Corinth, Paphos, and Tripolia independently from a major center, such as Alexandria.
    Unfortunately, we know too little about this period of Alexandrian mosaic art
    to make any definitive comments. Compelling evidence of itinerant Greek-Egyptian
    artists is found in two Thracian inscriptions that describe an Alexandrian mosaicist
    who traveled widely and was responsible for the mosaics in the Tychae in Perinth.53
