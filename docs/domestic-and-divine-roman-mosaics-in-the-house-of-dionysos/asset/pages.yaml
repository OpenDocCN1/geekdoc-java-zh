    of eight in the Paphian panels is interesting when we consider that there was
    a decline in the number of felines appearing in the arena; in the second and third
    centuries.⁸² Tigers are especially rare in the arena repertoire, even in Rome,
    and it is interesting to note that they appear most frequently in mosaics as well.⁸³
    They are found most often in the context of animal combat and as single motifs
    (fig. 10) rather than in narrative frizes, except in Paphos. The leopards and
    lions, have many parallels in the amphitheater frizes discussed above. The lions
    of both south and north porticos (with their hairy manes and tawny pelts closely
    resemble the lion in the east frieze at Ziten and at Orbe).⁸⁴ A lively naturalism
