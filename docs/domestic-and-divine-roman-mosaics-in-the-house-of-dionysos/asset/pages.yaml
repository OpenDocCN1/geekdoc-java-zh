    arrival. The greatest number of Seasons pavements have been found in the private
    homes of Roman Africa, most of these are decorated rooms for receptions and entertainments.3
    The choice of the Seasons and peacock themes along the entrance axis of Paphos
    is unusual and remains bold and perhaps adaptation.


    Taken as a group, the Seasons, Narcissus, and peacock mosaics express a delight
    in the beauty and abundance of the natural world with the attendant implications
    of the “good life” by the inhabitants. Their juxtaposition serves to intensify
    this meaning, and for this reason the Narcissus mosaic in room 1 may also be broadly
    interpreted. A further discussion of the Narcissus parcel precedes this chapter,
    some aspects of its physical context are relevant here.4 The fact that the scene
    is set by a reflecting pool might have accounted for its presence near the entrance
    area. Water elements—basins, shallow pools, fountains, and channels—were the sine
    qua. In the House of Dionysos there is a fish pool and a basin at the center of
    the peristyle, in addition to a number of mosaics featuring awesome myths along
    the west portion. Did the ancient behold respond only to the nature of Narcissus?
    If the Images provide a guide, then the answer lies in the phrase Philostatus
    to describe a painting of the scene: “the pool paints Narcissus, and the painting
    represents the pool and the whole story of Narcissus.” The illusion of a pool
    becomes a reality for this third-century critic, whose description eloquently
    evokes the potential for myth to bear multiple meanings. The representation of
    a pool serves as a topos of reception and a sign of luxury. This association was
    concrete for the ancient visitor is attested by the combination of two mosaic
    panels at the entrance to a grand house of Menander at Antioch, where one contains
    a female bust inscribed as “TRYPHE,” and the other two reclining river gods are
    labeled as “LADON” and “PSALIS” (fig. 44).5


