  md: 'much the same approach is seen in the iconographic panels: both are compositions
    derived from models, with contributions from ad hoc inventions. What the ornament
    empirically confirms the selection of western compositions, such as the multiple-design
    and the interface "cushion" (to be taken up in Chapter 4), which might have been
    filtered through North Africa, as witnessed by the numerous parallels in Byzantana
    and Tripoli. The restrained interpretations of the swastika-meander and the lozenge-star-and-square
    pattern point out a relationship with, or at least a resemblance to, second-century
    Italian examples. The existence of the Koukia lozen-star-and-square mosaic proves
    that models were employed in Cyprus in the course of the second century. Undoubtedly,
    the Koukia mosaic was executed by the same workshop as the one that made the Paphian
    Mosaics. On the other hand, the idiosyncrasies of the ribbon border and the fact
    that Paphos and Antioch yielded the greatest number of variations for the latchkey
    swastika-meander pull the Paphian productions into the radius of Antioch. This
    association is further emphasized by the series of lozenge-star-and-square mosaics
    found at Antioch which have guided the stylistic and chronological attribution
    of the Paphian example. Although the cases of lozenge-star-and-square put forth
    seem too few, they do suggest a route of transmission from Italy through North
    Africa to eastern sites in Greece, Cyprus, and Antioch.


    Both the ornamental repertoire at Paphos and the mythological scenes provide a
    clearer picture of the inventive spirit of the Paphian craftsmen. That they were
    undeniably steeped in the Hellenism of the Antiochene milieu is demonstrated by
    both the Narcissus and the Phaedra and Hippolytus scenes, but were also abreast
    of stylistic developments in the west. Whether their knowledge derived from a
    visually astute patron who was deeply involved in the decoration of his domus,
    or from a well-traveled head designer (pictor) cannot be determined. Given the
    evidence from the other mosaics in the house, I suspect that unusual abilities
    of both patron and designer were needed to produce the innovations found at Paphos.


