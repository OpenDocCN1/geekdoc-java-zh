    The question of quality arises when we assess the work of the Paphian craftsmen.
    At a modest level of production, the members of a workshop might have reproduced
    a model with little comprehension of its significance or symbolism. They might
    have misidentified figure types, producing muddled or diluted compositions. The
    effective selection of figures depended on the competence of the craftsman and
    his understanding of the subject. How the designers arrived at their models and
    figure types is a question that vexes scholars. There are two positions on this
    matter: one group believes that model books filled with stock from workshop to
    workshop, and another speculates that the artists, trained in an apprentice tradition,
    developed drawings/cartoons for their own use.¹12 Whether the Paphian mosaics
    do or not possess, they demonstrate that the transmission of models does not tell
    the whole story. Local workshops reworked inherited schemes and introduced their
    own interpretations with varying degrees of success. Once free from their sources,
    they may recall and acquire new identities. The hoc combination of figures has
    resulted in a fresh composition that enriched the existing repertoire of models.
    The mythological scenes at Paphos, especially those found in the west portico,
    and the vine-carpet and hunting mosaics are successful and very local creations.
    On the other hand, the Triumph of Dionysos panel is filled with curious errors
    and is presented in a dry and uninspired manner.


