  md: 'an artist by Daphne Antioch accompanies the image of Dionysos on a panther.81
    An equally grand mosaic was found in the adjacent room, wherein multiple panels
    with scenes from a New Comedy surround a central medallion featuring Dionysos''s
    discovery of the sleeping Ariadne.82 The survival of the inscription makes the
    connection to the mosaics of Antioch inescapable, but again inventive and individual;
    the role of local artists should not be easily ruled out.


    As in quality the Cretan mosaics appear to be, they are somewhat overshadowed
    by the discovery of a spectacular Dionysiac Marine Triumph at Dion, in Macedonia,
    dated around A.D. 200.83 The skillful modeling and use of chiaroscuro create a
    painterly effect in this mosaic, which springs from a Hellenistic tradition.84
    These finds confirm the concept of a koine of Mediterranean art fostered by like-minded
    citizens who were invested in Dionysos.


    Our final comparison suggests that the borrowings of images and designs were subject
    to reinterpretations and to the intentions of the patrons. A mosaic from the Sertiana
    Domus in El Jem (fig. 201) portrays an arena setting and shows a bound criminal
    condemned bestias.85 The realism of this late-second-century composition reveals
    actual events in the amphitheater at El Jem. The mosaic is thought to be an original
    composition commissioned by the patron, perhaps honors of the games commemorated
    in the mosaic. A similar bound figure, with four beasts from the amphitheater
    leaping onto him, appears in an early-third-century house in Kephallonia, Greece
    (fig. 202).86 The Greek mosaics depict a vestibule and is accompanied by an poetic
    epigram identifying the figure as phthonos, or one. True to certain events, the
    realities of the amphitheater have been allegorized, and the scene functions,
    to protect the owners of the house against slander.87


    The Kephallonia mosaic reflects not a western model but a thoroughly Roman tradition
    and social context. Trade and patronage actively supported social and cultural
    exchange between provinces, certainly before the end of the second century. The
    mosaics of the House of Dionysos at Paphos illuminate these concerns and bear
    witness to the dynamic process of Romanization, even in the minor provinces of
    the Greek east, by the late century.


