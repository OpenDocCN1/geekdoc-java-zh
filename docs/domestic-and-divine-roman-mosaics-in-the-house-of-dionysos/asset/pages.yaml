  md: 'an area of 2,000 square meters, and the elegance of its decoration, including
    fifteen mosaic floors and walls covered with painted stucco, attest to the high
    standard of life under Roman rule and the degree to which elements of Cypriot
    society were Romanized (fig. 1). This view is supported by the Polish excavation
    of the grand House of Theseus, located 100 meters south (see map, fig. 2) of the
    House of Dionysos, and by topographical and archaeological surveys that reveal
    the remains of other residences adorned with mosaics. Two of these have been under
    excavation by the Cypriot Department of Antiquities; they are located immediately
    west of the House of Theseus and are called the House of Orpheus and the House
    of the Seasons. Together, these discoveries identify a residential quarter in
    the southwestern sector of the city near the western sea wall, with the ancient
    harbor to the east and the acropolis to the north.


    The remains of religious and civic buildings from the first and second centuries
    testify to the prosperity and the generosity of the local elites who paid for
    these structures. Undoubtedly, they were the inhabitants of the richly affined
    houses adorned with mosaics. On the eastern slope of the hill the acropolis rises,
    no more than 250 meters northeast of the House of Dionysos, an Odeon, an Askleion,
    and an Agora have been excavated and dated to the first half of the second century
    (fig. 2).¹⁰ Other public edific included an amphitheater identified by an oval
    depression near the harbor, a gymnasium located by an inscription found near the
    Odeon, and a rock-cut theater still visible near the northeast.¹¹ The temples
    were built in the sacred precinct of the Paphan Aphrodite in the old city (Palaipaphos).¹²
    More lavish Roman monuments are to be found at Salamis at the northeastern end
    of the island, along with the ruins at Kourion and Kition, they provide an overview
    of the Cypriot polis in Roman times.


    Given these impressive physical realities, the relative silence of the literary
    and epigraphic sources on the route of Cyprus in Roman history is curious.³


