    public areas of the house, these Papian rooms are ideally suited to serve as second
    reception areas.

    The location of these rooms offers a key to the interpretation of their mosaic
    decoration. Although the interlace "cushion" pattern in room 9 could well have
    been treated with the other geometric ornaments in the previous chapter, the xenia
    that serve as filling motifs are unusual and distinct in their reference to ancient
    customs of hospitality. Motifs that include a variety of foods and drinks are
    seen to represent the actual offerings to guests—also called xenia. The rarity
    of xenia and of the "cushion" pattern in eastern mosaics attests to an intentional
    effort at decoration at Paphos, one that presupposes a program of use. The "cushion"
    pattern was most popular in North Africa, where it typically adorned dining rooms.
    In this instance, the selection of a geometric design and of its subsidiary motifs
    can hint at meaning and function.


