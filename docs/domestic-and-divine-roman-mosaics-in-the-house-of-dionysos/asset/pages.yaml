    The significance of the Kouklia example for the dating and appreciation of the
    Paphos innovations is great. Fortunately, the date of the Kouklia floor is suggested
    not only by its style but also by archaeological evidence. A Tiberian coin was
    found below the mosaic providing a *terminus post quem*, and the contents of a
    drain in the courtyard contained later than the Severan period. Stylistically,
    the Kouklia floor shares the austere quality common to the Italian mosaics of
    the late first century and of the first half of the second century. One close
    parallel is offered by a mosaic from Imola to the last quarter of the first century
    (fig. 27).63 Bold geometric fillers including the swastika-meander (instead of
    the Solomon''s knots in Kouklia) alternate with vegetal motifs (an ivy leaf or
    fruit), but the white ground and the white lozenges remain the dominant features
    of design.


    The outer border on the floor at Kouklia makes another connection with our house:
    it contains lozenges inscribed within rectangles (outlined, in turn, by a narrow
    row of diamonds). The same border, but with boldly colored lozenges, surrounds
    the multiple-design composition in room 14 at Paphos (fig. 31). This linear composition
