  md: 'Cypriot Sigillata, local versions of the popular Antiochene ware, supplanted
    eastern imports during the first and second centuries.³¹ The Cypriot imitations
    offered serious competition to other Sigillata wares, as evidenced by their considerable
    presence in Palestinian, Egyptian (Alexandria), and Aegean (Rhodes) sites and
    as far as Sabratha and Pompeii. The major wares represented at the Paphian site
    are the Cypriot and Italian Sigillata.


    The imitation of Antiochene pottery in Cypriot provides an interesting parallel
    to the production of the Paphian floors and their relationship to the Antiochene
    mosaics, which will be discussed in Chapter 2. Equally compelling the unusually
    high percentage of imported Italian wares, including many types scarcely elsewhere
    in the east, which were found in the sealed deposits below the mosaics.³² These
    strongly suggest direct trade links with Campania and share the stylistic and
    iconographic parallels—traded later in this book—between western artistic developments,
    especially Italian and North African, and Paphian mosaics. The appearance of this
    Italian Sigillata ware in Paphos and the discovery of Cypriot Sigillata in Alexandria
    and the Aegean may indicate a role, hitherto unrecognized, for Paphos in the late
    age among Rome, Alexandria, and the east.³³ Such a role certainly offer an explanation
    for the cultural exchanges reflected in the mosaics and architecture.


    The only reliable evidence providing a prima ante quem for the mosaics—is that,
    for the final destruction of the house—comes from a deposit of many wine amphora
    found in the far north corner of the estate.³⁴ The pottery, of what seems to be
    Cypriot versions of Paphian Red Ware cooking dishes, have been assigned to the
