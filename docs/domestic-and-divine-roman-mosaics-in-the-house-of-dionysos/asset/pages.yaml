  md: 'property was transmitted and just how the social elite reproduced itself. Most
    of our evidence is drawn from the houses of the middle and upper classes, so our
    conclusions are anchored to the privileged in Roman society. Excavations, especially
    of grand villas, go after the glamorous remains—reception rooms, baths, halls—ignoring
    the utilitarian quarters of slaves and servants. As we admire the sumptuous spaces
    filled with luxurious decorations, including mosaics, statuary, textiles, and
    furnishings, we should not lose sight of the fact that these spaces and accoutrements
    were designed and selected to celebrate the social and political power of the
    owner.


    Unlike the nineteenth-century bourgeois who withdrew from public life into his
    private drawing room, Romans commanded their domestic interiors as spaces integrating
    commercial, social, and familial practices. Although some of the imagery of these
    interiors might be characterized as fanciful and even private, there is an overwhelming
    impression of intentional display, of themes and presentations that self-consciously
    represent the owners and promote their ruling culture.


    For all the types of ornament, mosaics provide the most abundant evidence and
    are therefore a rich resource for contextual inquiries. The nineteenth-century
    architect Gottfried Semper held theories about interior decoration, especially
    the allied (even ancestral) medium of textiles, which are helpful when we examine
    the function of mosaics. In the باسم of emerging archaeological evidence, Semper
    argues that ancient buildings were sheathed in polychromy walls, colored stucco,
    hanging carpets—to an extent that the decorative devices, and not the architectural
    plan, defined space. At first, interior spaces were formed by the use of textiles:
    to Semper building with ornament. In other words, space was constructed by the
    language of decoration, by it fabrics that served as makeshift walls or paintings
    which illusion might dismantle walls with imitation masonry, or floor mosaics
    that could physically guide the visitor through the floor plan with a multiplicity
    of indicators. The architectural plan, the structure of the house, and its decoration
    are of one body. With Semper’s model in mind, one can set the mosaics within the
    framework of the house; therein they become eloquent witnesses to the elusive
    dialogue between inhabitants and guests, between owners and clients, and to


