  md: 'decoration. Because the epigraphic evidence is silent about the patron of the
    House of Dionysos, we are forced to draw on information about his contemporaries
    in similar communities throughout the Empire and consider their social and political
    concerns as related. Recent studies of Romanization—historical, epigraphic, archaeological,
    and so on—support this approach, as their results have more precisely defined
    the people elite from all parts of the Empire expressed their Romanitas through
    a shared vocabulary of art, architecture, and social habits. The self-consciousness
    with which the upper class adopted the features of Roman culture can be seen in
    their domestic decoration.


    The Papian house—its plan and pavements—reflects a trend among provincial notes
    in the Greek east to express their Romanitas in the selection of design elements
    for their homes.²² A related process has been charted in the houses of Pompeii,
    where Italian aristocratic villa culture served as a model for the material and
    social values of the upper and middle classes. In other words, elements crop up
    repeatedly, ingeniously minaturized and/or replicated in fresco or mosaic, in
    the houses of businessmen and merchants of all backgrounds and means.²³ The associative
    effect of these features and images can be demonstrated by their origins in the
    grand Italian estates and their earlier prototypes in palaces of Hellenistic nobles.
    In terms of actual features, the inclusion of mosaic basins within aicula, small
    piscina, urban-sized gardens with pergolas and statuary within townhouses of all
    sizes can be taken as inspired and driven from their more monumental counterparts
    on villas. Mural painting and floor mosaics adorned an even more expansive for
    the demonstration of these affiliations.²⁴


