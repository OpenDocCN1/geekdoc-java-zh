    a painting in his ancestral residence.103 Both descriptions of silvae are provocative
    for what they reveal about the relationships of art, nature, and cultural activities.


    The material evidence is also meager, but quite clearly documents the physical
    form of the silvae. A series of bronze medals, all contornate, were struck on
    the reverse with an image of the venatio wherein stages, antelope, and leaps about
