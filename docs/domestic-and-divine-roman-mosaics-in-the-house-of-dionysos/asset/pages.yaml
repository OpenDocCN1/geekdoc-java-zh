  md: '1974.24 At the first mosaics, all from a single period, were dated on stylistic
    criteria to the late third century A.D., but J. Hayes''s subsequent analysis of
    the pottery finds and the analysis of the mosaics below indicate a date about
    one century earlier.25


    Unfortunately, the stratigraphy of the House of Dionysos is disrupted because
    the house stands at a much higher level than the other buildings in the area,
    very close to the surface and to the flooded topsoil. As a result, the relationship
    of the Roman house to an earlier structure on the site and the time of its destruction
    cannot be precisely determined. Clearly, the house was destroyed as a result of
    seismic activity occurring after the mosaics were completed. The extent of the
    destruction and the use of the site as a source of building stones by later inhabitants
    preclude even an exact determination of the boundaries of the house. It is not
    certain, for example, whether the wall that collapsed on a man during an earthquake
    (as evidenced by the discovery of a skeleton at the southeast corner of street
    bordering the wall of the house) belongs to the mosaics or to an earlier structure.26
    A pocket of twelve coins, the latest dated A.D. 126, was found with the skeleton
    and provides clear evidence of an earthquake late Hadrianic time.27 These date
    coincide with evidence of the pottery found in the latest destruction levels outside
    the House of Dionysos; all of this belongs to the first and early second centuries.28
    All the rooms adjacent to the western wall (fig. 1) are one meter lower than the
    level of the mosaic floors, and do not seem to belong to the House of Dionysos.29
    It seems highly unlikely that the house with the mosaics was leveled by the Hadrianic
    earthquake. Rather, it must have been built over the debris of the earlier structure.
    This view is supported by the style of the mosaics, which indicates a date before
    the middle of the second century.


    The pottery analyzed by J. Hayes provide the most reliable information for the
    date of the building.30 Wares found in the sealed levels provide a reliable terminus
    post quem of the early second century for the House of Dionysos. These deposits
    reveal a concentration of Italian Sigillata which is surprising for an eastern
    site. Typically, Eastern Sigillata, produced in Antioch, appear frequently in
    the east, where it was the predominant export ware.


