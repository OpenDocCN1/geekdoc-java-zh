    It is useful to recall that Nonnos, throughout the eighty-eight books of his Mysaca
    displays detailed knowledge of the local myths and cults places particular emphasis
    on the legendary origins of water sources. The fact that Nonnos identifies Daphne
    as a “daughter of Ladon” and describes Pyramos and Ladon as rivers, with Arethus
    and Alpheus, provides textual evidence for a developed regional tradition. There
    is also ample evidence in the coinage of Asia Minor, and (especially in Antioch),
    for the coinage of local legends surrounding springs and rivers. The mosaic panels
    in the west portico at Paphos reveal the same local interest in their presentation
