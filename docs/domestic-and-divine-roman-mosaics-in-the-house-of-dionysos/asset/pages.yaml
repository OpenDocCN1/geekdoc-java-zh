    # APOLLO AND DAPHNE


    The composition of the Apollo and Daphne mosaic, the fourth and northern panel,
    reveals the influence of eastern sources more directly than do the Pyramos and
    Thisbe panel (figs. 105 and 106). Although the figures are not labeled, they follow
    conventional forms and are fully recognized. There are ample parallels for the
    two protagonists, but the inclusion of a male deity is rare.


    In the panel (2.33 m × 1.11 m) Apollo dashes in the right toward Daphne, who stands
    behind a reclining river god on the left side; a small hillock with a leafy bush
    turned them. Apollo, identified by his laurel crown, and the quiver just visible
    over his right, is nude except for a green and brown mantle over his shoulders
    and with laced sandals. He steps forward with his cloak flying behind him and
    points at Daphne with his right hand. The maiden is nude except for a green garment
    swaying in an arch over her head, as to indicate a sudden halt in her flight.
    Daphne, fixed in a contrapposto stance as her legs stiffen into the trunk of a
    laurel tree with leaves shooting out from the right side, turns to stare at her
    pursuer. The bearded river god in front of her rests on his arm a downturn from
    which water flows; he holds a cornucopia in his left hand and a reed in his hand.
    He turns his head, crowned with river reeds, away from the scene toward the left.


