  md: 'of the Severans (A.D. 193–235).^{16} As home of the cult of the Paphian Aphrodite
    and her internationally known temple, Paphos held the position of island capital
    from the Ptolemaic through the Roman periods.^{17} The bestowal of such titles
    as Augusta and metropolis showed the favor of the Roman rulers.^{18} In response,
    Paphos was quick to adopt an Augustan calendar and assimilate Roman customs.^{19}
    In general ways, Paphos shared a cultural and architectural affinity with its
    sister cities attest to the effectiveness of its curial class in managing a Roman
    quality up to a Hellenic city.


    Social amities (baths, theatres, temples) and testament to urban life (public
    inscriptions and statuary), paralleled those in other cities of the Roman east
    (e.g., Kos, Corinth) and indicated the homogeneity of the Roman civic experience.^{20}
    These cities were governed externally as as internally by a *koiton* or city council,
    and in each case the urban plan of the Hellenistic period set the outlines for
    the Roman city by literally flourishing the foundations for the Roman buildings.^{21}
    Trade and communication with the coast of Asia Minor were and led naturally to
    cultural exchanges. There were also sizable communities of Romans, mostly negotiators
    (traders), as in Cyprus which have reinforced the ties to Rome.^{22} The comprehensions
    that can be made among the house designs and mosaics of the burials in these cities
    demonstrate that a koinite of private art and culture existed at the highest levels
    of society throughout the Empire and signs of Romanization may be traced in the
    private realm as well as the public.^{23}


