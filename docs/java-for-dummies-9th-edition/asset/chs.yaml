  \nLISTING 4-7 赋值运算符\n\n```java\nvoid main() {\n  int numberOfBunnies = 27;\n  int\
  \ numberExtra = 53;\n  numberOfBunnies += 1;\n  println(numberOfBunnies);\n  numberOfBunnies\
  \ += 5;\n  println(numberOfBunnies);\n  numberOfBunnies += numberExtra;\n  println(numberOfBunnies);\n\
  \  numberOfBunnies *= 2;\n  println(numberOfBunnies);\n  println(numberOfBunnies\
  \ -= 7);\n  println(numberOfBunnies = 100);\n}\n```\n\nListing 4-7 展示了 Java 赋值运算符的多功能性。通过赋值运算符，你可以对变量进行任何数字的加、减、乘、除。注意\
  \ `+= 5` 如何给 `numberOfBunnies` 加 5，以及 `*= 2` 如何将 `numberOfBunnies` 乘以 2。你甚至可以使用另一个表达式的值（在\
  \ Listing 4-7 中的 `numberExtra`）作为要被应用的数字。\n\nListing 4-7 中的最后两行演示了 Java 赋值运算符的一个特殊之处。你可以将赋值运算符作为更大\
  \ Java 语句的一部分。在 Listing 4-7](#c04.xhtml_c04-fea-0010)的倒数第二行中，运算符从 `numberOfBunnies`\
  \ 中减去 7，将 `numberOfBunnies` 的值从 `172` 减少到 `165`。然后整个赋值操作被塞入 `println` 调用中，因此 `165`\
  \ 显示在屏幕上。\n\n看吧，Listing 4-7 的最后一行显示了你如何使用 Java 普通的等号完成同样的事情。我在本章开头所说的赋值语句，实际上是我在本节中描述的赋值运算符之一。因此，每当你向某个内容赋值时，你都可以让该赋值成为更大语句的一部分。\n\
  \n![技术细节](img/technicalstuff.png) 赋值运算符的每次使用都承担语句和表达式的双重职责。在所有情况下，表达式的值等于你赋值的任何值。例如，在执行代码\
  \ `println(numberOfBunnies -= 7)` 之前，`numberOfBunnies` 的值为 `172`。作为一条语句，`numberOfBunnies\
  \ -= 7` 告诉计算机从 `numberOfBunnies` 中减去 7（因此 `numberOfBunnies` 的值从 `172` 变为 `165`）。作为一个表达式，`numberOfBunnies\
  \ -= 7` 的值为 `165`。因此，代码 `println(numberOfBunnies -= 7)` 实际上意味着 `println(165)`。数字\
  \ `165` 显示在计算机屏幕上。\n\n关于对此类内容的更丰富解释，请参见本章早之前的侧边栏“语句和表达式”。\n\n### 操作成功了\n\n![试一试](img/tryitout.png)\
