  \ **定义你自己的异常类**\n\n*1945 年 9 月 9 日：* 一只飞蛾飞入了哈佛 Mark II 计算机的一个继电器中，卡住了机器。这成了第一个有记录的真实计算机漏洞（bug）。\n\
  \n*1957 年 4 月 19 日：* 匹兹堡西敦公司数据处理中心的经理 Herbert Bright 在邮件中收到了一叠未标记的计算机打孔卡（这就像今天在邮件里收到一个未标记的\
  \ U 盘一样）。Bright 先生猜测这叠卡片来自 FORTRAN 开发团队——这是第一种计算机编程语言。他已经等了这个软件好几年了。（当时没有网络下载。）\n\
  \n仅凭这个准确的猜测，Bright 猜测这叠卡片来自 FORTRAN 开发团队——这是第一种计算机编程语言。他已经等了这个软件好几年了。（当时没有网络下载。）\n\
  \n\n\n\n\n```java\nString numBoxesIn = keyboard.next();\nint numBoxes = Integer.parseInt(numBoxesIn);\n\
  out.print(\"The value is \");\nout.println(currency.format(numBoxes * boxPrice));\n\
  }\n}\n```\n\n![图像显示了三个代码片段及其各自的输出和错误信息。第一个代码片段打印：'How many boxes do we have? 3'\
  \ 和 'The value is 59.75'。第二个片段尝试打印：'How many boxes do we have? 3.5'，但由于输入字符串 '3.5'\
  \ 导致了 NumberFormatException。第三个片段尝试打印：'How many boxes do we have? three'，但由于输入字符串\
  \ 'three' 抛出了 NumberFormatException。](img/9781394289240-fg1401.png)\n\n图 14-1: Listing\
  \ 14-1 中代码的单独运行。\n\n修复程序错误的关键是检查程序崩溃时出现的消息。库存程序的显示显示 `java.lang.NumberFormatException`。这意味着一个名为\
  \ `NumberFormatException` 的类位于 `java.lang` API 包中。通过某种方式，对 `Integer.parseInt` 的调用让这个\
  \ `NumberFormatException` 类浮出了水。\n\n好了，情况是这样的。Java 编程语言有一种名为“异常处理”的机制。通过`exception\
  \ handling`，程序可以检测到即将发生错误，并通过创建一个全新的对象来作为响应。在官方术语中，程序被称为抛出（`throwing`）了一个异常。这个新对象（`Exception`\
  \ 类的实例）像热豆一样从一段代码传递到另一段代码，直到某些代码决定捕获（`catch`）异常。当捕获异常时，程序执行某些恢复代码，忽略异常，并继续执行下一个正常语句，仿佛什么都没有发生过一样。该过程在图\
  \ 14-2 中所示。\n\n![流程图，说明了 Java 中方法调用的序列以及异常如何通过嵌套方法调用传播。图始于一个在 try-catch 块内调用另一个方法的方法。链中的每个后续方法都抛出一个异常，展示了\
  \ Java 中异常处理的流程。链中的最后一个方法抛出了一个新异常。](img/9781394289240-fg1402.png)\n\n图 14-2: 抛出、传递和捕获异常。\n\
  \n整个过程是在几个 Java 关键字的辅助下完成的。这些关键字如下：\n\n*   `throw`：创建一个新的异常对象。\n*   `throws`：指示方法可能会将异常传递给调用方法的任何代码。\n\
  *   `try`：封装可能创建新异常对象的代码。在通常情况下，`try` 句中的代码包含对方法的调用，这些方法可能会创建一个或多个异常。\n*   `catch`：处理异常，忽略它，然后继续执行。\n\
  \n所以真相大白了。通过类似图 14-2 所示的系列事件链，`Integer.parseInt` 方法可能会抛出 `NumberFormatException`。当你用\
  \ `3.5` 或 `three` 调用 `Integer.parseInt` 时，Java 会生成一个 `NumberFormatException` 并将其沿方法调用链传递。传递一直持续到某些\
  \ Java 代码捕获该异常。但在 Listing 14-1 中，没有代码来捕获 `NumberFormatException`。所以，当你输入 `3.5` 或\
  \ `three` 时，程序就会崩溃，并且你会收到类似图 14-1 那样的尴尬消息。\n\n![提示](img/tip.png) `parseInt` 方法的\
  \ Java 应用程序接口（API）文档说：“抛出：`NumberFormatException` —— 如果字符串不包含可解析的整数。”偶尔阅读一下文档确实是有回报的。\n\
  \n### 让事情变得正确\n\nListing 14-1 中的代码可能会抛出异常。你最好捕获该异常以防止程序崩溃。Listing 14-2 展示了异常的捕获。\n\
  \nLISTING 14-2 一种更安全的计数方法\n\n```java\nvoid main() {\n    final double boxPrice =\
  \ 3.25;\n    var currency = NumberFormat.getCurrencyInstance();\n    String numBoxesIn\
  \ = readln(\"How many boxes do we have? \");\n    try {\n        int numBoxes =\
  \ Integer.parseInt(numBoxesIn);\n        print(\"The value is \");\n        println(currency.format(numBoxes\
  \ * boxPrice));\n    } catch (NumberFormatException e) {\n        print(e.getMessage());\n\
  \        println(\" … Cannot interpret the input.\");\n    }\n}\n```\n\n图 14-3:\
  \ Listing 14-1 中代码的运行。\n\n修复程序错误的关键是检查程序崩溃时出现的消息。库存程序的显示显示 `java.lang.NumberFormatException`。这意味着一个名为\
  \ `NumberFormatException` 的类位于 `java.lang` API 包中。通过某种方式，对 `Integer.parseInt` 的调用让这个\
  \ `NumberFormatException` 类浮出了水。\n\n好了，情况是这样的。Java 编程语言有一种名为异常处理的机制。通过`exception\
  \ handling`，程序可以检测到即将发生错误，并通过创建一个全新的对象来作为响应。在官方术语中，程序被称为抛出（`throwing`）了一个异常。这个新对象（`Exception`\
  \ 类的实例）像热豆一样从一段代码传递到另一段代码，直到某些代码决定捕获（`catch`）异常。当捕获异常时，程序执行某些恢复代码，忽略异常，并继续执行下一个正常语句，仿佛什么都没有发生过一样。该过程在图\
  \ 14-2 中所示。\n\n整个过程是在几个 Java 关键字的辅助下完成的。这些关键字如下：\n\n*   `throw`：创建一个新的异常对象。\n* \
  \  `throws`：指示方法可能会将异常传递给调用方法的任何代码。\n*   `try`：封装可能创建新异常对象的代码。在通常情况下，`try` 句中的代码包含对方法的调用，这些方法可能会创建一个或多个异常。\n\
  *   `catch`：处理异常，忽略它，然后继续执行。\n\n所以真相大白了。通过类似图 14-2 所示的系列事件链，`Integer.parseInt` 方法可能会抛出\
  \ `NumberFormatException`。当你用 `3.5` 或 `three` 调用 `Integer.parseInt` 时，Java 会生成一个\
  \ `NumberFormatException` 并将其沿方法调用链传递。传递一直持续到某些 Java 代码捕获该异常。但在 Listing 14-1 中，没有代码来捕获\
  \ `NumberFormatException`。所以，当你输入 `3.5` 或 `three` 时，程序就会崩溃，并且你会收到类似图 14-1 那样的尴尬消息。\n\
  \n![提示](img/tip.png) `parseInt` 方法的 Java 应用程序接口（API）文档说：“抛出：`NumberFormatException`\
  \ —— 如果字符串不包含可解析的整数。”偶尔阅读一下文档确实是有回报的。\n\n### 让事情变得正确\n\nListing 14-1 中的代码可能会抛出异常。你最好捕获该异常以防止程序崩溃。Listing\
  \ 14-2 展示了异常的捕获。\n\n\n\n\n有了这个新的 `catch` 子句，`inventory` 程序的运行情况可能如图 14-4 所示。当你调用\
  \ `printStackTrace` 时，你会看到在异常抛出时正在运行的方法列表，以及每个方法中的行号。在图 14-4 中，显示包含了 `Integer.parseInt`\
  \ 和 `main` 方法。\n\n![包含 Java 代码段和手写注释“Too many hours do we have? cheers Love x alice\
  \ day”的文本](img/9781394289240-fg1404.png)\n\n图 14-4： Java 的堆栈跟踪。\n\n注意图 14-4 中的运行情况与图\
  \ 14-1 中两次运行情况之间的相似之处。\n\n*   **在图 14-4 中：** Java 抛出一个 `NumberFormatException`。代码捕获了异常并调用了一个打印堆栈跟踪的方法。然后程序继续运行（例如打印\
  \ `Have a nice day`）。\n*   **在图 14-1 中：** Java 抛出一个 `NumberFormatException`。代码列表\
  \ 14-1 中的代码没有捕获该异常，因此 Java 对任何未捕获的异常都采取如既常的做法：打印堆栈跟踪，然后突然结束程序的运行。换句话说，你的程序崩溃了。不再有其他内容以任何方式被计算、打印或处理。\n\
  \n![技术细节](img/technicalstuff.png) 在图 14-4 中，注意 `Have a nice day` 出现在异常的堆栈跟踪之前。这很奇怪。难道\
