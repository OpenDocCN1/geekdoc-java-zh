  \ 方法知道的只是实现了 `Displayable` 接口的对象。这就是 `displayMe` 方法的参数列表所说明的。当你把一个实现了 `Displayable`\
  \ 接口的对象传递给 `displayMe` 方法时，`displayMe` 方法就知道了它可以做什么。`displayMe` 方法可以调用参数的 `display`\
  \ 方法，因为该参数对象保证有一个 `display` 方法。\n\n列表 15-5 中的 `summarizeMe` 方法也是如此的。你如何知道你可以在 `summarizeMe`\
  \ 方法体内部调用 `summarizable.summarize()` 呢？你可以进行此调用，是因为 `summarizable` 必须有一个 `summarize()`\
  \ 方法。Java 接口的规则保证了这一点。\n\n这就是 Java 接口背后的真正力量。\n\n![尝试一下](img/tryitout.png) 在节中，`ColumnOfNumbers`\
