  \n![Tryitout](img/tryitout.png) 再次，我想让你们动起来了：\n\n#### 我们的最佳球员\n\n使用第 11 章 中的 `Player`\
  \ 类来创建一个 `Player` 对象的 `ArrayList`。编写一个程序，显示平均分在 .100 或以上的球员的名称。\n\n#### 我们的最大数字\n\
  \n创建一个包含 `Integer` 值的 `ArrayList`。然后遍历列表中的值，以在列表中所有值中找到最大值。例如，如果列表包含数字 85, 19, 0,\
  \ 103 和 13，则显示数字 103。\n\n#### 按顺序插入\n\n创建一个按字母顺序排列的、包含 `String` 值的 `ArrayList`。当用户在键盘上输入一个额外的单词时，程序将新单词插入到\
  \ `ArrayList` 正确（按字母顺序排列）的位置。\n\n例如，假设列表初始包含单词 `\"cat\"`、`\"dog\"`、`\"horse\"` 和\
  \ `\"zebra\"`（按该顺序）。在用户在键盘上输入单词 `fish` 并按下回车键后，列表包含了单词 `\"cat\"`、`\"dog\"`、`\"fish\"\
  `、`\"horse\"` 和 `\"zebra\"`（按该顺序）。\n\n编写此程序，你可能会发现 `String` 类的 `compareToIgnoreCase`\
  \ 方法和 `ArrayList` 类的 `size` 方法非常有用。你可以通过以下链接了解这些方法：[`https://docs.oracle.com/en/java/javase/23/docs/api/java.base/java/lang/String.html#compareToIgnoreCase(java.lang.String)`](https://docs.oracle.com/en/java/javase/23/docs/api/java.base/java/lang/String.html#compareToIgnoreCase(java.lang.String))\
  \ 和 [`https://docs.oracle.com/en/java/javase/23/docs/api/java.base/java/util/ArrayList.html#size()`](https://docs.oracle.com/en/java/javase/23/docs/api/java.base/java/util/ArrayList.html#size())。\n\
  \n#### 真正的字典\n\n修改 Listing 12-3 中的代码，使 map 包含十个单词及其定义。当用户输入这十个单词之一时，程序显示该单词的定义。\n\
  \n## 函数式编程\n\n1953 年到 1957 年，John Backus 等人开发了 FORTRAN 编程语言，该语言包含了今天成千上万编程语言的基础框架。该框架由于其“做这个再做那个”的本质而被称为\
  \ `命令式编程`。\n\n在 FORTRAN 兴起几年后，John McCarthy 创建了另一种语言，命名为 `Lisp`。与 FORTRAN 不同，Lisp\
  \ 的底层框架是 `函数式编程`。在纯函数式程序中，你避免编写“做这个再做那个”。相反，你编写的是类似“需要什么”的内容。\n\n### 一个常见的问题\n\n\
  Listing 12-5 中的场景并不罕见。你有一组项目（可能是一组销售记录）。你遍历集合中的项目，找到符合特定标准的项目（例如，书籍的销售）。你从每个符合标准的项目获取获取一个特定值（例如销售价格）。然后，你对获取的值进行某些有用的操作（例如将这些值相加）。\n\
  \n\n\n\n\n-   **遍历已发现的行星列表。** 对于每颗 M 类行星，找到在该行星上发现智能生命的概率。然后，计算所有此类概率的平均值。\n\n这种场景非常常见，因此值得寻找更好的方法来处理。其中一种方法是使用\
  \ Java 中的一些函数式编程特性。\n\n### Lambda 表达式\n\n在《Java 教程》（Java For Dummies）的第 3 章中，作者写道：\n\
  \n> *在 Java 中，方法是一份待办事项列表。每个方法都有一个名称，你可以在程序中使用方法名称来告诉计算机执行列表中的事项。*\n\n他是个聪明家伙，因为在这句话中，他谨慎地使用了\
  \ `method`（方法）这个词。是的，方法是一个待办事项列表，但并不是所有的待办列表都是方法，也不是所有的待办列表都有名字。\n\n`lambda 表达式`是一个没有名字的待办列表。这是一个例子：\n\
  \n`sale -> sale.item().equals(\"Book\")`\n\n当你将这个表达式放在合适的位置时，该表达式就承担了列表 12-5 中 `itemIsBook`\
  \ 方法的工作。图 12-9 进一步说明了这一点。\n\nLambda 表达式是创建待办事项列表的简洁方式。该列表可能只包含一个待办事项（如图 12-9 所示），也可以包含任意数量的项目：\n\
  \n```\nsale -> {\n  var compareTo = \"Book\";\n  return sale.item().equals(compareTo);\n\
  }\n```\n\n![一个流程图和代码片段。流程图从一个标记为'sale'的框开始，指向另一个写有'sale.item().equals('Book')'的框。代码片段定义了一个名为'itemIsBook'的布尔方法，它接受一个'Sale'对象作为参数并返回'sale.item().equals('Book')的结果。](img/9781394289240-fg1209.png)\n\
  \n图 12-9： 售出的物品恰好是书吗？\n\n当你在 lambda 表达式中放入多个待办事项时，该表达式必须包含完整的方法体，带有大括号、分号和 `return`\
  \ 关键字。只有箭头 (`->`) 之前的内容是简写的。\n\n图 12-9 中的 lambda 表达式只有一个参数：`sale` 参数。Lambda 表达式可以有多个参数吗？当然可以。这是一个例子：\n\
  \n`(price1, price2) -> price1 + price2`\n\n当你有多个参数时，必须用括号将参数括起来并用逗号将它们隔开。\n\n图 12-10\
  \ 描述了新 lambda 表达式的含义。\n\n![一张说明简单函数的图。步骤 1：获取两个值，称为 price1 和 price2。步骤 2：返回 price1\
  \ 和 price2 的和。](img/9781394289240-fg1210.png)\n\n图 12-10： 相两个价格。\n\n图 12-10 中的 lambda\
  \ 表达式的作用（大致上）与以下方法相同：\n\n```\ndouble sum(double price1, double price2) {\n  return\
  \ price1 + price2;\n}\n```\n\n### 流的解释\n\n前面的章节“再次再一遍”引入了迭代器。迭代器的 `next` 方法逐个输出集合的值。这很有帮助，但\
  \ Java 通过“流”（stream）的概念将这一概念更进了一层。`stream` 就像迭代器，不同之处在于，使用流时，你不需要调用 `next` 方法。流会自动输出集合的值。要从流中获取值，不需要调用流的\
  \ `next` 方法。相反，你创建一个流水线（pipeline），从流中拉取值。这种流水线解决方案使用了函数式编程的概念。\n\n流水线由多个方法组成。每个方法接收数据，以某种方式转换数据，并将结果传递给队列中的下一个方法。图\
  \ 12-11 明了本章销售问题的流水线。\n\n![一个显示过滤和求和书籍价格过程的流程图。过程从项目及其价格的列表开始：('Book', 10.95), ('Book',\
  \ 30.00), ('Toy', 5.67), ('Book', 20.00)。第一步过滤掉非书籍项目，留下：('Book', 10.95), ('Book',\
  \ 30.00), ('Book', 20.00)。第二步提取价格：('Book', 10.95), ('Book', 30.00), ('Book', 20.00)。最后一步对这些价格求和得到\
  \ 60.95。](img/9781394289240-fg1211.png)\n\n图 12-11： 函数式流水线。\n\n在图 12-11 中，想象有一堆原材料……，在图\
  \ 12-11 中的表达式。\n\n### 从集合获取流\n\n当你在 Java 中进行函数式编程时，你从集合开始并调用该集合的 `stream` 方法。这会为你提供一个流，将项目传递给代码的其他部分。例如，在列表\
  \ 12-6 中，`sales` 指向一个 `ArrayList`，而 `sales.stream()` 指向流。（参见图 12-12 中：\n\n```\n\
  import com.example.Sale;\n\nvoid main() {\n  ArrayList<Sale> sales = new ArrayList<>();\n\
  \  var currency = NumberFormat.getCurrencyInstance();\n  fillTheList(sales);\n \
  \ double total = sales.stream()\n    .filter(sale -> sale.item().equals(\"Book\"\
  ))\n    .map(Sale::price)\n    .reduce(0.0, (price1, price2) -> price1 + price2);\n\
  \  println(currency.format(total));\n}\n\nvoid fillTheList(ArrayList<Sale> sales)\
  \ {\n  sales.add(new Sale(\"Book\", 10.95));\n  sales.add(new Sale(\"Book\", 30.00));\n\
  \  sales.add(new Sale(\"Toy\", 9.67));\n  sales.add(new Sale(\"Book\", 20.00));\n\
  }\n```\n\nlambda 表达式 `sale -> sale.item().equals(\"Book\")` 对于某个特定的销售项目，只要该销售恰好是书，它就会返回\
  \ `true`。\n\n\n\n\n\n图 12-13 展示了列表 12-6 中 `filter` 方法的工作原理。\n\n![一个显示按价格过滤项目的过程的流程图。流程图开始于一个表示项目及其价格元组列表：('Book',\
  \ 10.95), ('Book', 30.00), ('Toy', 9.67), ('Book', 20.00)。第一个决策点过滤掉非书籍项目，移除了 ('Toy',\
  \ 9.67)。第二个决策点显示了过滤后的结果列表：('Book', 10.95), ('Book', 30.00), ('Book', 20.00)。](img/9781394289240-fg1213.png)\n\
  \nFIGURE 12-13: 我们不关心玩具。\n\n### 从流中的每个项目中获取值\n\n`map` 方法获取流中的每个项目，对该项目进行某些操作，然后将“某些操作”传递给流水线中的下一个流。例如，对于每笔销售额，列表\
  \ 12-6 中的 `map` 方法获取销售价格，并将该价格向后传递。\n\n图 12-14 展示了列表 12-6 中 `map` 方法的工作原理。\n\n###\
  \ 汇总流中的项目\n\n`reduce` 方法合并流中的项目。列表 12-6 中的 `reduce` 调用累加了来自输入流的所有值——即来自 `map` 方法的流。该输入流包含了原始\
  \ `sales` 列表中所有书籍的价格。（参见图 12-15。）\n\n![一个包含两个部分的流程图。顶部部分包含一个标记为 '3' 的框，文本列出了书籍价格：（“Book”,\
  \ 10.95）,（“Book”, 30.00）,（“Book”, 20.00）。底部包含一个标记为 '4' 的框，文本仅列出价格：10.95, 30.00,\
  \ 20.00。](img/9781394289240-fg1214.png)\n\nFIGURE 12-14: 获取每笔书籍销售的价格。\n\n![一个机械或结构性系统的示意图，带有标记的组件和尺寸。该图包括两个由窄通道连接的矩形部分。上部分的尺寸标记为\
  \ 10.95, 30.00 和 20.00。下部分的尺寸标记为 60.95。还有两个数字为 4 和 5 的圆形标签，表示特定的点或组件。](img/9781394289240-fg1215.png)\n\
  \nFIGURE 12-15: 获取所有书籍销售的总价格。\n\nJava 的 `reduce` 方法不仅仅是把数字压缩在一起。该方法接受两个参数：\n\n*\
  \   第一个参数是初始值。\n    在图 12-15 中，初始值为 `0.0`。\n*   第二个参数是一个函数（通常是 lambda 表达式），该函数接受它自己的两个参数并返回另一个值。例如，在图\
  \ 12-15 中，该 lambda 表达式接受两个参数 `price1` 和 `price2`，并返回和：\n\n```\n(price1, price2)\
  \ -> price1 + price2\n```\n\nlambda 表达式合并了来自输入流的值。初始值作为所有合并操作的起点。因此，在图 12-15 中，`reduce`\
  \ 方法执行了三次加法。（参见图 12-16。）\n\n![图像显示黑色背景上有三个带有黑色加号的白圆，从左上到右下对角线排列。这种排列很有趣，因为它可能代表某种模式或特定的设计选择，可能用于图表、用户界面或符号表示等各种语境。](img/9781394289240-fg1216.png)\n\
  \nFIGURE 12-16: reduce 方法每次相两个值。\n\n作为对比，想象调用该方法：\n\n```\nreduce(10.0, (value1,\
  \ value2) -> value1 * value2)\n```\n\n### 为什么要费劲？\n\n你确实需要。在过去的几年里，芯片设计的大趋势是*多核*处理器。有了多个核心，处理器可以同时执行多个语句，将程序速度提高\
  \ 2 倍、4 倍甚至更多。但你如何划分工作呢？\n\n你可以修改列表 12-5 中的命令式代码。例如，通过一些高级特性，你可以将不同的循环迭代交给不同的核心。但结果代码是杂乱的。为了让代码正常工作，你必须精细管理循环迭代，仔细检查以确保最终的\
  \ `runningTotal` 值是正确的。\n\n相比之下，使用函数式代码要简单得多。为了利用多核处理器，你只需要更改一行代码：\n\n```java\n\
  double runningTotal = sales.parallelStream()\n    .filter(sale -> sale.item.equals(\"\
  Book\"))\n    .mapToDouble(sale -> sale.price)\n    .reduce(0.0, (price1, price2)\
  \ -> price1 + price2);\n```\n\n\n\n\n\n![Technical Stuff](img/technicalstuff.png)\
  \ 当你阅读上一段落时，不要忽略 `best possible scenario.`（最佳情况）这个短语。并行并不是魔法。而且，并行并不总是你的朋友。考虑这种情况：你只有\
  \ 20 个销售金额需要统计。将问题划分为 4 组（每组 5 个销售额）所花费的时间远超过使用全部四个核心所节省的时间。此外，某些问题并不适合并行处理。想象一下商品的价格取决于售出的相似商品数量。在这种情况下，你无法将问题分配给四个独立运行的内核。如果你尝试这样做，每个内核都必须知道其他内核在做什么。这样你就会丧失拥有四个执行线程的优势。\n\
  \n### 方法引用\n\n仔细查看 Listing 12-6 中的最后一个 lambda 表达式：\n\n```\n(price1, price2) -> price1\
  \ + price2)\n```\n\n这个表达式执行的工作与 `sum` 方法大致相同。（事实上，你可以在前面的章节“Lambda expressions””中找到\
  \ `sum` 方法的声明。）如果你在编写一个 3 行 `sum` 方法和编写一个 1 行 lambda 表达式之间做出选择，你可能会选择 lambda 表达式。但如果你有第三种替代方案呢？与其编写自己的\
  \ `sum` 方法，不如引用一个现有的 `sum` 方法。使用现有方法是最快且安全的方法。\n\n幸运的是，Java 的 `Double` 类包含一个静态 `sum`\
  \ 方法。你不需要创建自己的 `sum` 方法。如果你运行以下代码：\n\n```\ndouble i = 5.0, j = 7.0;\nprintln(Double.sum(i,\
  \ j));\n```\n\n计算机会显示 `12.0`。因此，与其在 Listing 12-6 中编写 `price1 + price2` lambda 表达式，不如使用两个冒号来创建一个\
  \ `method reference`（方法引用）——一个引用现有方法的表达式。\n\n```\nsales.stream()\n.filter(sale ->\
  \ sale.item().equals(\"Book\"))\n.map(sale -> sale.price())\n.reduce(0.0, Double\
  \ :: sum);\n```\n\n表达式 `Double :: sum` 引用 Java `Double` 类中的 `sum` 方法。当你使用这个 `Double\
  \ :: sum` 方法引用时，你执行的操作与 Listing 12-6 中最后一个 lambda 表达式执行的操作相同。大家都很满意。\n\n关于静态方法的信息，请参阅\
  \ Chapter 11。\n\n### lambda 中的某些“害群之马”\n\n在本章中，我把最糟糕的留到了最后。我拒绝给以下代码分配列表编号。相反，我将其称为“Ugly\
  \ Code”。\n\nUGLY CODE: 带有副作用的 Lambda 表达式\n\n```\n// 这段代码运行运行正常，但它的风格非常糟糕。\nimport\
  \ com.example.sales.Sale;\ndouble runningTotal = 0.0;\nvoid main() {\n    ArrayList<Sale>\
  \ sales = new ArrayList<>();\n    var currency = NumberFormat.getCurrencyInstance();\n\
  \    fillTheList(sales);\n    var kindOfItem = \"Book\";\n    sales.stream()\n \
  \   .filter(sale -> sale.item().equals(kindOfItem))\n    .map(sale -> sale.price())\n\
  \    .forEach(price -> addToRunningTotal(price));\n    println(currency.format(runningTotal));\n\
  }\nvoid addToRunningTotal(double price) {\n    runningTotal += price;\n}\nvoid fillTheList(ArrayList<Sale>\
  \ sales) {\n    sales.add(new Sale(\"Book\", 10.95));\n    sales.add(new Sale(\"\
  Book\", 30.00));\n    sales.add(new Sale(\"Toy\", 9.67));\n    sales.add(new Sale(\"\
  Book\", 20.00));\n}\n```\n\n这段糟糕代码中的 `forEach` 方法顾如其名所为。它为遇到的每一个销售额执行其 lambda 表达式。这段糟糕代码使用\
  \ `forEach` 来统计所有书籍销售的价格。\n\n这段代码的输出与 Listings 12-5 和 12-6 中的代码相同。但编写代码不仅仅是为了获得正确的输出。Figure\
  \ 12-18 比较了该糟糕代码流中的三个 lambda 表达式。\n\n函数式编程爱好者喜欢 Figure 12-18 中的中间表达式 —— `sale ->\
  \ sale.price()` 表达式。该表达式从其参数（`sale`）中获取信息并返回一个值。\n\n\n\n\nJava 旅馆（Java Motel）拥有十间舒适的房间，位于主公路旁的一个安静区域。除了一个一个小型的独立办公室外，这家旅馆由一排长长的一层房间组成。每间房间都可以从宽敞的前停车场轻松到达。\n\
  \n奇怪的是，这家旅馆的房间编号从 0 到 9。我可以说这种编号方式纯属偶然——可能与建筑者最初的设计方案有关。但事实是，从 0 开始可以让本章中的示例编写起来更简单。计算机编程结构是从\
  \ 0 开始计数的。仅此此而已。\n\n无论如何，你正试图着记录每个房间的客人数。为了存储所有数字，你使用了一个数组（`array`）。\n\n`array`\
  \ 是一行值，就像单层旅馆的一排房间一样。为了直观理解数组，请看图 13-1 中的 Java 旅馆。\n\n![“一个带有 0 到 9 索引数组的可视化表示。数组元素为\
  \ 0, 1, 4, 2, 0, 1, 4, 3, 2。索引 6 元素被高亮，表示它持有值 4。标签指向值 4 和索引 6。”](img/9781394289240-fg1301.png)\n\
  \nFIGURE 13-1: Java 旅馆的抽象快照。\n\n在本章的术语中，整排房间被称为 `array`。数组中的每个房间被称为数组的 `component`（也称为\
  \ `element`）。每个组件都与两个数字关联：\n\n*   房间号（0 到 9 的数字），被称为数组的 `index`\n*   客人数，它是存储在组件中的\
  \ `value`\n\n若要声明一个包含十个 `int` 值的数组，你可以写一个很短的语句：\n\n```java\nint[] guests = new int[10];\n\
  ```\n\n如果声明在方法内部，可以使用 `var`：\n\n```java\nvar guests = new int[10];\n```\n\n在某些情况下，分两步创建数组比较方便：\n\
  \n```java\nclass MyClass {\n    int[] guests; // 这里不允许使用 var。\n    void myMethod()\
  \ {\n        guests = new int[10]; // 这必须在方法体内\n        // …\n    }\n    // …\n\
  }\n```\n\n在这些代码段中，注意数字 10 使用。这个数字告诉计算机让 `guests` 数组拥有十个组件。每个组件都有自己的名字。起始组件名为 `guests[0]`，下一个是\
  \ `guests[1]`，依此类推。最后一个组件名为 `guests[9]`。\n\n![Remember](img/remember.png) 这样的声明\n\
  \n```java\nint[] guests;\n```\n\n并没有为存储 `int` 值预留空间。它只保留了变量名 `guests` 用于指向 `int`\
  \ 值数组；\n\n![Tip](img/tip.png) 在数组声明中，你可以将方括号放在变量名的之前。也就是说，你可以写 `int[] guests` 或\
  \ `int guests[]`。无论使用哪种形式，Java 都会创建相同的 `guests` 变量。\n\n### 如何预订客人\n\nJava 旅馆生意兴隆。（大多数人更喜欢\
  \ Java 旅馆而不是它的竞争对手——C-Side 度假村和 Motor Lodge。）作为 Java 旅馆的老板、经理和系统管理员，你有一个包含每个房间客人数的文件。一个名为\
  \ `GuestList.txt` 的示例文件如图 13-2。\n\n![“矩形框中显示的数字序列：1, 4, 2, 0, 2, 1, 4, 3, 8, 2。”](img/9781394289240-fg1302.png)\n\
