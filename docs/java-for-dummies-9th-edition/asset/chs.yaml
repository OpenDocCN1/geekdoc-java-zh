  \ 类型表示，而小数可以使用 `double` 或 `float` 类型。对于大多数情况，`double` 是更好的选择，因为它具有更高的精度。\n\n```\n\
  int count = 10;\ndouble price = 19.99;\n```\n\n### 算术运算符\n\n当你对数值变量进行算术运算时，可以使用算术运算符。\n\
  \n-   `+`：加法\n-   `-`：减法\n-   `*`：乘法\n-   `/`：除法\n-   `%`：取模\n\n```\nint a = 10;\n\
  int b = 3;\nint sum = a + b; // 13\nint difference = a - b; // 7\nint product =\
  \ a * b; // 30\nint quotient = a / b; // 3\nint remainder = a % b; // 1\n```\n\n\
  注意：整数除法会丢弃小数部分。因此 `10 / 3` 的结果是 `3` 而不是 `3.333...`。\n\n\n\n\n\n例如，当你在程序的 `main`\
  \ 方法内部初始化变量时，不需要指定新变量的类型。你可以像这样开始列表 4-2：\n\n```java\nvoid main() {\n    var amountInAccount\
  \ = 0.0;\n}\n```\n\n如果你愿意，也可以以这种方式开始列表 4-3：\n\n```java\nvoid main() {\n    var weightOfAPerson\
  \ = 150;\n    var elevatorWeightLimit = 1400;\n    var numberOfPeople = elevatorWeightLimit\
  \ / weightOfAPerson;\n}\n```\n\n在这两种情况下，`var` 关键字都取代了类型的名称。这个小技巧之所以奏效，是因为 Java 是非常智能的。当你写下：\n\
  \n```java\nvar amountInAccount = 0.0;\n```\n\nJava 查看数字 `0.0` 并意识到 `amountInAccount`\
  \ 是一个 `double` 类型的值。它是一个小数点右侧带有数字的数字。同样，Java 看到\n\n```java\nvar weightOfAPerson\
  \ = 150;\n```\n\n并自行判断出 `weightOfAPerson` 必须是一个 `int` 类型的值。\n\n如果你没有初始化新变量，这种 `var`\
  \ 机制就不起作用。例如，以下几行代码\n\n```java\n// 错误代码：\nvar numberOfCats;\nnumberOfCats = 3;\n\
  ```\n\n对于 Java 来说，这些代码是不可接受的。Java 无法等到赋值语句 `numberOfCats = 3` 执行才决定 `numberOfCats`\
  \ 是什么类型的变量。Java 想要立即知道结果。\n\n![警告](img/warning.png) 在其他某些情况下，即使进行了初始化，使用 `var` 也是非法的。详情请参阅第\
  \ 7 章。\n\n就像生活中的其他事情一样，初始化变量既有优点也有缺点：\n\n*   当你将六行列表 4-3 的代码合并为一个声明时，代码变得更加简洁。有时，简洁的代码更容易阅读。有时并非如此。作为一名程序员，这取决于你的判断。\n\
  *   通过初始化变量，你可能会自动避免某些编程错误。示例，请参阅第 7 章。\n*   在某些情况下，你别无选择。代码的本质迫使你必须初始化或不初始化。关于不适合变量初始化的示例，请参阅第\
  \ 6 章 中的删除证据的程序。\n\n## 在 JShell 中进行实验\n\n列表 4-1 附有一个巨大的警告。该列表缺少 `void main()` 头，因此列表中的代码是不完整的。尽管如此，列表\
  \ 4-1 中的文字并非完全没有意义。你应该能够对这两行代码进行实验。\n\n事实上，你确实可以！Java 自带了一个名为 `JShell` 的工具。通过微小的修改，你就可以使用\
  \ `JShell` 来运行列表 4-1 中的基础代码。事实上，`JShell` 允许你交互式地对各种代码片段进行实验。当你使用 `JShell` 时，你很少输入整个程序。相反，你输入一个\
  \ Java 语句，然后 `JShell` 对你的语句做出响应，接着你输入第二个语句，然后 `JShell` 对你的第二个语句做出响应，然后你输入第三个语句，以此此类推。单个语句足以获得\
  \ `JShell` 的响应。\n\n冷知识：这种对程序员输入的每个语句都立即响应的工具被称为*读取-评估-打印循环”（Read Evaluate Print\
  \ Loop，REPL）。许多编程语言都有 REPL。`JShell` 是 Java 的“官方”REPL。\n\n![在网上](img/ontheweb.png)\
  \ 启动 `JShell` 的指令在不同电脑之间有所。关于帮助你在电脑上运行 `JShell` 的一些技巧，请访问本书的网站（[``http://JavaForDummies.allmycode.com`](http://javafordummies.allmycode.com/)]）。\n\
