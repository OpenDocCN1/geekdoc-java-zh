  \ 方法。（参见列表 7-11）。\n\n## 长远规划\n\n![尝试一试](img/tryitout.png) 将第 5 章中的第一个代码列表（本书的第一个猜数字游戏示例）按照列表\
  \ 7-11 的风格进行重写。（如果可以，请在运行 Java 20 或更早版本的环境中测试你的代码。）\n\n## 变量实验\n\n在大学期间的一个夏天，我正坐在前廊上，无所事事地和一个刚结识的人聊天。我想她的名字叫\
  \ Janine。“你从哪里来？”我问道。“火星，”她回答道。她停顿了一下，看我会不会追问一个问题。\n\n事实证明，Janine 来自来自宾夕法尼亚州的火星市（Mars,\
  \ Pennsylvania），那是匹兹堡以北约 20 英里的小镇。好了，我想表达什么呢？重点在于，名称的含义取决于语境。如果你位于匹兹堡正北并问：“我从这里怎么去火星？”，你可能会得到一个合理且淡然的回答。但如果你站在曼哈顿的街角问同样的问题，你可能会引起某些怀疑。（好吧，考虑到曼哈顿的情况，人们可能直接无视你。）\n\
  \n当然，住在宾夕法尼亚州火星市的人非常清楚他们小镇的名字很奇怪。在火星高中度过的青少年时光的美好记忆并不会阻止人们知道那颗红色行星。在八月一个晴朗的夜晚，你仍然可以与当地居民之一进行以下对话：\n\
  \n*   *你*：我怎么去火星？\n*   *当地居民*：伙计，你就在火星。你想去火星的哪个部分？\n*   *你*：不，我不是不是宾夕法尼亚州的火星。我说的是火星行星。\n\
  *   *当地居民*：噢，行星！那么，坐 8:19 发往卡纳维拉尔道的火车吧。不，等一下——那是当地火车。那会让你经过西弗吉尼亚州……\n\n名称的含义取决于你在哪里使用它。尽管大多数英语使用者认为火星是一个拥有二氧化碳大气的地方，但宾夕法尼亚州的一些人在考虑可以在火星市做多少购物。而那些宾夕法尼亚州的人对\
  \ *Mars* 这个名字确实有两个含义。在 Java 中，这些名称可能像这样：`Mars` 和 `planets.Mars`。\n\n### 将变量归其位\n\
  \n你的第一个实验如列表 7-12 和 7-13 所示。列表中的代码突出了两类变量之间的区别：\n\n*   **字段 (Field)：** 一个*没有*在方法内部声明的变量。\n\
  *   **方法局部变量 (Method-local variable)：** 一个*在*方法内部声明的变量。\n\n列表 7-12 火星的两种含义\n\n```java\n\
  import java.io.IO;\n\nclass EnglishSpeakingWorld {\n    String mars = \" red planet\"\
  ; // field\n    void visitPennsylvania() {\n        IO.println(\"visitPA is running:\"\
  );\n        String mars = \" Janine's home town\"; // method-local variable\n  \
  \      IO.println(mars); // Janine's home town\n        IO.println(this.mars); //\
  \ red planet\n    }\n}\n```\n\n列表 7-13 调用列表 7-12 的代码\n\n```java\nvoid main() {\n\
  \    println(\"main is running:\");\n    var e = new EnglishSpeakingWorld();\n \
  \   //out.println(mars); cannot resolve symbol\n    println(e.mars);\n    e.visitPennsylvania();\n\
  }\n```\n\n图 7-11 显示了列表 7-12 和 7-13 中代码的运行情况。图 7-12 显示了代码结构图。注意，在这个示例中，我选择将 `main`\
  \ 方法放在类*外面*。\n\n\n\n\n\n如果你在宾夕法尼亚州并需要引用那个拥有两个卫星的天体，该怎么办？更准确地说，`visitPennsylvania`\
  \ 方法内部的代码是如何引用值值为 `\"red planet\"` 的字段的？答案是，使用 `this.mars`。`this` 词指向包含所有这些代码的对象（而不是代码内部的任何方法）。该对象是\
  \ `EnglishSpeakingWorld` 类的实例，它拥有一个很大的 `mars` 字段，而该字段的值为 `\"red planet\"`。这就是你如何强制代码看到其所在方法之外的内容——你使用了\
  \ Java 关键字 `this`。\n\n![交叉引用](img/crossreference.png) 有关 `this` 关键字的更多信息，请参阅第 10\
  \ 章。\n\n### 告诉变量去往哪里\n\n几年前，当我住在威斯康星州的密尔沃基时，我经常使用当地银行的自动取款机。这种机器刚刚开始标准化。当地的取款机系统被命名为\
  \ `TYME`，意为“Take Your Money Everywhere”（随处取钱）。\n\n我记得开车去加利福尼亚州。在某一次，我饿了并停下吃饭，但我没现金了。于是我问一个加油站的工作员：“你知道这附近有\
  \ TYME 机器吗？”\n\n所以你看，一个在一个地方好用的名字在另一个地方可能非常糟糕，或者完全不起作用。在代码列表 7-14 和 7-15 中，我说明了这一点（而不仅仅是一个关于取款机的轶事）。\n\
  \n代码列表 7-14 原子之城故事\n\n```java\nimport java.io.IO;\n\nclass EnglishSpeakingWorld2\
  \ {\n  String mars;\n\n  void visitIdaho() {\n    IO.println(\"visitID is running:\"\
  );\n    mars = \" red planet\";\n    String atomicCity = \" Population: 25\";\n\
  \    IO.println(mars);\n    IO.println(atomicCity);\n  }\n  void visitNewJersey()\
  \ {\n    IO.println(\"visitNJ is running:\");\n    IO.println(mars);\n    // IO.println(atomicCity);\
  \ cannot resolve symbol\n  }\n}\n```\n\n代码列表 7-15 调用代码列表 7-14 中的代码\n\n```java\n\
  void main() {\n  var e = new EnglishSpeakingWorld2();\n  e.visitIdaho();\n  e.visitNewJersey();\n\
  }\n```\n\n图 7-13 显示了代码列表 7-14 和 7-15 中代码的运行情况。图 7-14 显示了代码结构的图。`EnglishSpeakingWorld2`\
  \ 代码有两个变量：`mars` 变量没有在方法内部声明，是一个字段；另一个变量 `atomicCity` 是方法局部变量，声明在 `visitIdaho` 方法内部。\n\
  \n![“程序的控制台输出显示了两行文本。第一行写着‘visitID is running: red planet Population: 25.’第二行写着‘visitMN\
  \ is running! red planet.’此输出表明两个标识为‘visitID’和‘visitMN’的独立进程正在交互或引用同一个‘red planet’。‘visitID’进程包含了关于‘red\
  \ planet’人口的额外信息，人数为 25。”](img/9781394289240-fg0713.png)\n\n图 7-13: 代码列表 7-14 和\
  \ 7-15 中代码的运行情况。\n\n![“一个 EnglishSpeakingWorld2 的 UML 类图，包含三个方法：mars(field)、visitIdaho\
  \ 和 visitNewJersey。mars(field) 方法包含一个名为 red planet 的局部变量。在 visitIdaho 方法内部，有一个嵌套方法\
  \ atomicCity(method=local variable)，带有一个标记为 Population: 25 的局部变量。visitNewJersey\
  \ 方法目前为空。”](img/9781394289240-fg0714.png)\n\n图 7-14: 代码列表 7-14 和 7-15 中代码的结构。\n\n\
  在代码列表 7-14 中，注意 `mars` 是一个字段而 `atomicCity` 是方法局部变量。在 `visitIdaho` 中，`atomicCity`\
  \ 是可访问的。在 `visitNewJersey` 中，`mars` 仍然可以访问，但 `atomicCity` 不。这就是为什么使用 `this` 来访问当前方法之外的字段。\n\
  \n\n\n\n\n![交叉引用](img/crossreference.png) 有需查看 Java 八种基本数据类型，请参阅第 4 章。\n\n## 值传递与引用传递\n\
  \n### 值传递（基本数据类型）\n\n用通俗易懂的话来说，这意味着：方法对其参数值所做的任何更改，都不会影响调用代码中变量的值。在代码列表 7-16 中，`birth`\
  \ 方法可以随心地对 `cityPop` 应用 `++` 运算符——对 `cityPop` 参数应用 `++` 的操作对主方法中 `smackoverARpop`\
  \ 变量的值完全没有影响。\n\n从技术上讲，发生的是值的复制。（请参见图 7-15。）当 `main` 方法调用 `birth` 方法时，存储在 `smackoverARpop`\
  \ 中的值被复制到另一个内存位置——一个专门为 `cityPop` 参数值预留的位置。在 `birth` 方法执行期间，`cityPop` 参数加了 `1`。但存储原始值\
  \ `2232` 的地方（即 `smackoverARpop` 变量的内存位置）仍不受影响。\n\n![一张包含两个部分、分别标记为“main”和“birth”的图。在“main”部分，有一个标记为“smackoverAllPop”的框，数字为\
  \ 2232。一个箭头将此框连接到“birth”部分的另一个标记为“cityPop”的框，初始显示为 2232，但被划掉并更新为 2231。该图说明了这两个变量之间的关系，突出了“main”部分中“smackoverAllPop”的值（2232）是如何更新“birth”部分中的“cityPop”值的，将其从\
  \ 2232 变为 2231 的。](img/9781394289240-fg0715.png)\n\n图 7-15： 底层的值传递。\n\n![记住](img/remember.png)\
  \ 当你对八种基本数据类型进行参数传递时，计算机使用值传递。调用代码中变量存储的值保持不变。即使调用代码的变量与被调用方法的参数恰好同名，这种情况也会发生。\n\
  \n### 返回结果\n\n你必须修复代码列表 7-16 中代码提出的问题。毕竟，一只年幼的獴猫不能在没有任何追踪的情况下度过一生。为了记录这只宝宝的出生，你必须给\
  \ `smackoverARpop` 变量的值加 `1`。你可以通过许多方法实现这一点，而代码列表 7-17 中展示的方法并不是简单的。尽管如此，代码列表 7-17\
  \ 所示的方法也说明了一个点：从方法调用返回值可以是参数传递的一种可以接受替代方案。查看代码列表 7-17 来理解我的意思。\n\n代码列表 7-17 此程序可以运行\n\
  \n```\nvoid main() {\n  int smackoverARpop = 2232;\n  smackoverARpop = birth(smackoverARpop);\n\
  \  println(smackoverARpop);\n}\n\nint birth(int cityPop) {\n  return cityPop + 1;\n\
  }\n```\n\n运行代码列表 7-17 中的代码后，你在电脑屏幕上看到的数字是正确的：`2233`。\n\n代码列表 7-17 中的代码并没有新功能（除非你把“正常运行”视为一种新功能）。代码列表\
  \ 7-17 中最重要的思想是 `return` 语句，它也出现在第 7 章中。尽管如此，代码列表 7-17 与代码列表 7-16 中的方法形成了很好的对比，后者必须被舍弃。\n\
  \n### 引用传递（引用类型）\n\n在之前的一两个节中，我极力强调某一点——当参数是八种基本数据类型之一时，参数是通过值传递的。如果你读到这里，可能错过了对参数是八种基本数据类型之一的强调。之所以需要强调，是因为传递对象（引用类型）的方式并不完全相同。\n\
  \n当你将对象传递给方法时，对象是通过引用传递的。这对你意味着，被调用方法中的语句可以更改存储对象变量中的任何值。这些更改确实会影响看到的值。\n\n代码列表\
  \ 7-18 什么是城市？\n\n```\nclass City {\n  int population;\n}\n```\n\n代码列表 7-19 向方法传递对象\n\
  \n```\nvoid main() {\n  var smackoverAR = new City();\n  smackoverAR.population\
  \ = 2232;\n  birth(smackoverAR);\n  println(smackoverAR.population);\n}\n\nvoid\
  \ birth(City aCity) {\n  aCity.population++;\n}\n```\n\n\n\n\n\n如果你运行列表 7-20 中的代码，你会得到数字\
  \ 2233。这很好。该代码的工作原理是告诉 `doBirth` 方法创建另一个 `City` 实例。在新的实例中，`population` 的值为 `2233`。（参见图\
  \ 7-17。）\n\n![“UML 对象图描述了两个对象：smackoverAR 和 myCity。这两个对象都有一个 population 属性，其中 smackoverAR\
  \ 显示的人口为 2232，myCity 显示的人口为 2233。smackoverAR 对象是 main 方法的一部分，而 myCity 对象是 doBirth\
  \ 方法的一部分。两个对象都是 aCity 类的实例，说明了人口值如何在不同方法中被赋值和维护。”](img/9781394289240-fg0717.png)\n\
  \n图 7-17: `doBirth` 方法创建了一个 `City` 实例。\n\n在执行 `doBirth` 方法后，该 `City` 实例返回到 `main`\
  \ 方法。然后，在 `main` 方法中，该实例（`doBirth` 返回的那个）被赋值给变量 `smackoverAR`。（参见图 7-18。）现在，`smackoverAR`\
  \ 指向一个全新的 `City` 实例 —— 一个人口值为 2,233 的实例。\n\n![“一个包含三个节点的图表，标记为‘smackoverAR’‘aCity’和‘myCity’。每个节点都显示一个人口值：‘smackoverAR’和‘aCity’都显示人口为\
  \ 2232，而‘myCity’显示人口为 2233。节点之间由线连接，表示关系，并组织在两个类别下：‘main’和‘doBirth’。这种视觉表示展示了人口值如何与层级结构中的不同节点关联。”](img/9781394289240-fg0718.png)\n\
  \n图 7-18: 新的 `City` 实例被赋值给变量 `smackoverAR`。\n\n在列表 7-20 中，注意调用和返回 `doBirth` 方法时的类型类型：\n\
  \n*   变量 `smackoverAR` 的类型为 `City`。变量 `smackoverAR` 被传递给参数 `aCity`，该参数的类型也是 `City`。\n\
  *   变量 `myCity` 的类型为 `City`。变量 `myCity` 在 `doBirth` 方法的 `return` 语句中返回。这是一致的，因为\
  \ `doBirth` 方法的头部开头是 `static City doBirth(blah, blah, blah)`…… —— 一个返回 `City` 类型对象的承诺。\n\
  *   `doBirth` 方法返回一个 `City` 类型的对象。回到 `main` 方法中，调用 `doBirth` 返回的对象被赋值给变量 `smackoverAR`，并且（你猜到了吧）变量\
  \ `smackoverAR` 的类型是 `City`。\n\n除了非常协调之外，所有这些类型一致都是绝对必要的。如果你编写的程序中类型之间互不一致，编译器就会吐出一条毫不留情的\
  \ `incompatible types`（类型不兼容）信息。\n\n### 结语\n\nDora Kermongoos 和她新生的女儿在她们位于阿肯色州斯马克\
