  \ 变量是 `PartTimeEmployee` 类的实例。因此，调用的方法是列表 10-4 中的那个。\n*   在第三次调用 `ptoEmployee.findPaymentAmount`\
  \ 中，`ptoEmployee` 变量是 `PartTimeWithOver` 类的实例。因此，调用的方法是列表 10-6 中的那个。\n\n这段代码太棒了。使用子类让代码变得简洁且优雅。有了在软件上节省的所有金钱，你完全负担得起给每个人支付双倍的加班费。（至于你是这样做还是把钱留给自己，则是另一回事了。）\n\
  \n![Tryitout](img/tryitout.png) 这里是一些你可以尝试的内容。\n\n### 多付更多钱\n\n在之前的章节中，你为 `PlaceToLive`\
