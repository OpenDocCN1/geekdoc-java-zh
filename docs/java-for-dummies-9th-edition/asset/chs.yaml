  \ Fido 散步 3 次。每天带 Rover 散步 2 次。不要让 Felix 去室外。每天给 Bubbles 喂食。Fido 重 51.7 磅，发出“Woof”。Rover\
  \ 重 15.2 磅，发出“Woof”。Felix 重 10.0 磅，发出“Meow”。Bubbles 重 0.1 磅。](img/978134289240-fg1503.png)\n\
  \n图 15-3: 请不要摸庞贝虫。\n\n\n\n\n创建一个名为 `Shape` 的抽象类。`Shape` 类包含一个 `size` 字段（类型为 `int`）和一个抽象方法\
  \ `show`。使用另外两个类扩展这个抽象类 `Shape`：一个 `Square` 类和一个 `Triangle` 类。在 `Square` 和 `Triangle`\
  \ 类的 `show` 方法体中，编写用于创建该形状的文本化渲染的代码。例如，一个大小为 5 的 `Square` 看起来如下：\n\n```\n--------\n\
  | |\n| |\n| |\n--------\n```\n\n一个大小为 2 的 `Triangle` 看起来如下：\n\n```\n/\\\n/ \\\n\
  ----\n```\n\n---\n\n## 放松！你没有看错眼！\n\n如果你已经读过本章之前关于接口和抽象方法的章节，你的头可能会晕晕眼转向。接口和抽象类都拥有抽象方法。但抽象方法在这两种引用类型中扮演的角色略有不同。你如何在脑海中理清这些绪呢？\n\
  \n要做的第一件事是记住：如果不进行大量的代码编写实践，没有人能学会面向对象编程概念。如果你读了本章并感到困惑，这可能是一件好事。这意味着你已经理解了足够的内容才知道这些东西有多复杂。你写的代码越多，对类、接口以及所有这些其他想法就会变得越熟悉。\n\
  \n要做的第二件事是理清声明抽象方法的差异。表 15-1 说明了其中的情况。\n\n| | 在普通（非抽象）类中 | 在接口中 | 在抽象类中 |\n| ---\
  \ | --- | --- | --- |\n| 是否允许抽象方法？ | 否 | 是 | 是 |\n| 方法声明可以包含 `abstract` 关键字吗？ |\
  \ 否 | 是 | 是 |\n| 方法声明可以包含 `default` 关键字（意味着“非抽象”）吗？ | 否 | 是 | 否 |\n| 在既没有 `abstract`\
  \ 没有 `default` 关键字的情况下，方法是： | 非抽象 | 抽象 | 非抽象 |\n\n**表 15-1 使用（或不使用）抽象方法**\n\n接口和抽象类都拥有抽象方法。所以你可能会想，应该如何在声明接口和声明抽象类之间做出选择。事实上，你可能会问三位专业程序员接口和抽象类之间有什么区别。如果你真的这么做了，你可能会得到五个不同的答案。（是的，五个答案；不是三个。）\n\
  \n接口和抽象类是相似的野兽。但基本思想是关于事物之间的关系。\n\n*   **扩展子类代表一种“是一个”（is a）的关系。**\n    想想本章之前章节“抽象类”中的关系。宠物狗是一种动物。狗是宠物。猫是宠物。鱼是宠物。\n\
  \n*   **实现接口代表一种“可以做”（can do）的关系。**\n    想想本章之前章节“Java 接口”中的关系。列表 15-3 中的类声明说 `implements\
  \ Displayable, Summarizable`。通过这些词，代码承诺每个 `ColumnOfNumbers` 对象都可以显示和总结。在同一个列表中，你通过声明一个\
  \ `display` 方法和一个 `summarize` 方法兑现了这一承诺。\n\n如果你想看到接口和抽象类之间更具体的差异证据，请考虑这一点：一个类可以实现许多接口，但一个类只能扩展另一个类，即使那个类是抽象类。所以，在你声明了\n\
  \n`public class Dog extends HousePet`\n\n之后你就不能再让 `Dog` 扩展 `Friend` 类。但你可以让 `Dog`\
  \ 实现一个 `Befriendable` 接口。然后你可以让同一个 `Dog` 类实现一个 `Trainable` 接口。（顺带一下，我尝试过让我的 `Cat`\
  \ 类实现 `Trainable` 接口，但出于某种原因，它从未成功过。）\n\n而且，如果你想在接口和抽象类之间看到一个*更*具体的区别，我有一个可以给你：接口不能包含任何非静态、非最终的字段。例如，如果\
  \ 列表 15-7 中的 `HousePet` 类是一个接口，它就不能有一个 `name` 字段。这根本是不允许的。\n\n就这样。接口和抽象类是不同的。但如果你是这个游戏的新手，你不应该担心这种差异。尽可能多地读代码，当你看到抽象方法时不要害怕。仅此。\n\
  \n---\n\n# 第 16 章\n\n# 黏糊的 GUI 是一条虫\n\n**本章内容**\n\n*   **显示窗口**\n*   **使用按钮和文本框**\n\
  *   **响应鼠标点击**\n\n有一个关于马戏团杂技人跳过老子的经典笑话。不幸的是，如果我把这个笑话放进书里，我会因为侵犯版权被起诉。\n\n总之，这个笑话是关于从小处开始并逐渐向更大的事物进的。这正是你在阅读《傻瓜\
  \ Java》第 9 版时所做的。\n\n书中的大部分程序都是基于文本的。书中的大多数程序没有窗口，没有对话框——那种东西。在基于文本的程序中，你在窗口中输入字符，程序在窗口中输出。\n\
  \n如今，很少有公共程序是基于文本的。几乎所有程序都使用 **GUI**——图形化用户界面。所以，如果你已经读了这本书的每一个字，你可能在心里想：“我什么时候才能学会\
  \ GUI？”\n\n嗯，就是现在！本章将向你介绍 GUI 编程。\n\n## 开始 GUI 应用程序\n\nJava 带有三套用于创建 GUI 的类：\n\n\
  *   **抽象窗口工具包 (AWT)：** 原始的类集，追溯到 JDK 1.0。这些类属于 `java.awt` 包。该包中的组件有 `Button`、`Frame`、`TextField`\
  \ 等。AWT 只实现了 90 年代中期所有常见操作系统上可用的组件类型。所以，使用 AWT，你可以为你的应用程序添加按钮，但你无法轻松添加表格或树。\n\n\
  *   **Java Swing：** 为了解决使用 AWT 带来的困难而创建的类集。Swing 在 1997 年随 Java 1.1 引入。这些类属于 `javax.swing`\
  \ 包。该包中的组件有 `JButton`、`JTextField`、`JFrame` 等。Swing 程序在每个操作系统上看起来都一样。但 Swing 组件并不漂亮。与\
  \ Mac 按钮或 Windows 按钮相比，`JButton` 看起来原始而粗糙。\n\n*   **JavaFX：** Oracle 标准 Java 中最新的\
  \ GUI 类。这些类属于 `javafx` 包。JavaFX 支持超过 60 种组件。（当然，你想要 `Button` 组件。但你是否也想要 `Accordion`\
  \ 组件？JavaFX 有。）此外，JavaFX 支持多点操作，并利用每个处理器的专用图形能力。\n\n本章介绍 JavaFX。\n\n### 设置你的电脑\n\
  \n第 2 章 告诉你可以使用任何适用于你的 IDE 创建 Java 程序。在大多数章节中，你可以使用 Eclipse、VSCode、BlueJ，甚至是带有 Windows\
  \ MS-DOS 提示符的 Notepad。在本章中，我将引导你使用 IntelliJ IDEA 创建 JavaFX 应用。\n\n\n\n\n![Tip](img/tip.png)\
