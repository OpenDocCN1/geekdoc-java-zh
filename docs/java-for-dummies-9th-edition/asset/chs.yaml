  \ File(\"anything_at_all\"))`，除非你承认其中存在某些风险。问题在于，在 `Scanner` 构造函数体内部深处的代码可能会抛出异常。这种异常是\
  \ `FileNotFoundException` 类的实例。当你尝试编译 Listing 14-7 中的代码代码时，你会看到一条不受欢迎的消息：\n\n```\n\
  unreported exception java.io.FileNotFoundException;\nmust be caught or declared\
  \ to be thrown\n```\n\nJava 编程语言有两种异常。它们被称为*检查异常*（checked exceptions）和*未检查异常*（unchecked\
  \ exceptions）：\n\n*   可能抛出的检查异常必须在代码中进行确认。\n*   可能抛出的未检查异常不需要在代码中确认。\n\n`FileNotFoundException`\
  \ 是 Java 的检查异常类型之一。当你调用一个可能抛出 `FileNotFoundException` 的构造函数或方法时，你需要在代码中确认该异常。\n\n\
  现在，当我说异常*在代码中被确认*时，我到底是什么意思？\n\n```java\n/*\n* 程序员想要感谢 FileNotFoundException，\n\
  * 没有它，这段代码就无法编写。\n*/\n```\n\n不，这并不是“在代码中确认”的意思。在代码中确认异常意味着两种情况之一：\n\n*   可能抛出异常的语句（包括任何构造函数或方法调用）位于\
  \ `try` 子句内部。该 `try` 子句有一个 `catch` 子句，其参数列表中带有匹配的异常类型。\n*   可能抛出异常的语句（包括任何构造函数或方法调用）位于一个头部带有\
  \ `throws` 子句的方法中。该 `throws` 子句包含一个匹配的异常类型。\n\n如果你对这两个列表的措辞感到困惑，不要担心。接两个列表说明了这些列表中提到的观点。\n\
  \n### 尽快捕获\n\n在 Listing 14-8 中，`new Scanner` 调用位于一个 `try` 子句内部。该 `try` 子句有一个异常类型为\
  \ `FileNotFoundException` 的 `catch` 子句。\n\nLISTING 14-8 使用 try-catch 语句确认\n\n```java\n\
  void main() {\n  println(\"Starting payroll … \");\n  cutCheck();\n  println(\"\
  Payroll completed.\");\n}\n\nvoid cutCheck() {\n  try {\n    var diskScanner = new\
  \ Scanner(new File(\"EmployeePayment.txt\"));\n    String name = diskScanner.nextLine();\n\
  \    double amountPaid = diskScanner.nextDouble();\n    print(\"Pay to the order\
  \ of \" + name);\n    println(String.format(\" ***$%,.2f\", amountPaid));\n    diskScanner.close();\n\
  \  } catch (FileNotFoundException e) {\n    println(e.getMessage());\n  }\n}\n```\n\
  \nFigure 14-12 展示了 Listing 14-8 中代码的两次运行。对于第一次运行，`EmployeePayment.txt` 文件包含 `Barry\
  \ Burd` 和 `5000.00` 行。对于第二次运行，用户的硬盘上没有 `EmployeePayment.txt` 文件。\n\n![“工资系统的两组文本输出。第一个输出显示了成功的工资处理过程，向\
  \ Barry Burd 支付了 $5,000.00 并表示工资已完成。第二个输出显示了一条错误消息，表示找不到文件 'EmployeePayment.txt'，随后是消息尽管发生错误但工资处理已完成。”](img/9781394289240-fg1412.png)\n\
  \nFIGURE 14-12: 有和没有 `EmployeePayment.txt` 文件的情况。\n\n当我查看 Listing 14-8 时，我的内心充满了自豪。我确认了\
  \ `FileNotFoundException`，防止了代码打印 `Pay to the order of`，并避免了糟糕的程序崩溃。事实上，我在异常发生的一的一刻就处理了它。我在\
  \ `cutCheck` 方法中扑灭了那把火，防止它蔓延并烧毁 `main` 方法。\n\n等一下！我做得对吗？这里有一个软件设计中的重要原则：**不要太急于捕获异常**。回看\
  \ Figure 14-12，第二次运行以 `Payroll completed` 字词结束。这是真的吗？Barry 真的能收到他应得的 $5000.00 吗？不。Figure\
  \ 14-12 中的第二次运行抛出了 `FileNotFoundException`。Listing 14-8 中的 `cutCheck` 方法捕获了异常，并没有告诉\
  \ `main` 方法发生了任何问题。\n\n### 稍后捕获\n\n在 Listing 14-9 中，`new Scanner` 调用位于一个 `try` 子句内部。该\
  \ `try` 子句有一个异常类型为 `FileNotFoundException` 的 `catch` 子句。\n\nLISTING 14-9 使用 try-catch\
  \ 语句确认\n\n```java\nvoid main() {\n  println(\"Starting payroll … \");\n  try {\n\
  \    cutCheck();\n  } catch (FileNotFoundException e) {\n    println(e.getMessage());\n\
  \  }\n  println(\"Payroll completed.\");\n}\n\nvoid cutCheck() throws FileNotFoundException\
  \ {\n  var diskScanner = new Scanner(new File(\"EmployeePayment.txt\"));\n  String\
  \ name = diskScanner.nextLine();\n  double amountPaid = diskScanner.nextDouble();\n\
  \  print(\"Pay to the order of \" + name);\n  println(String.format(\" ***$%,.2f\"\
  , amountPaid));\n  diskScanner.close();\n}\n```\n\nFigure 14-13 展示了 Listing 14-9\
  \ 中代码的两次运行。对于第一次运行，`EmployeePayment.txt` 文件包含 `Barry Burd` 和 `5000.00` 行。对于第二次运行，用户的硬盘上没有\
  \ `EmployeePayment.txt` 文件。\n\n![“控制台输出显示了两次工资尝试。第一次尝试成功向 Barry Burd 支付了 $5,000.00\
  \ 并表示工资已完成。第二次尝试由于文件缺失导致错误，显示‘没有此类文件或目录’的消息。”](img/9781394289240-fg1413.png)\n\n\
  为了更好地理解 `throws` 子句，想象一场排球比赛，其中排球就是异常。当对方的球员发球时，该球员正在抛出异常。球越过网直接向你冲来。如果你用力把球击回过网，你就是在捕获异常。但如果你把球传给另一个球员，你就是在使用\
  \ `throws` 子句。\n\n\n\n\n\n![Remember](img/remember.png) 方法中的语句可能会抛出一个未被 `catch`\
  \ 子句匹配的异常。这包括抛出异常的语句甚至不在 `try` 块内部的情况。当发生这种情况时，程序的执行将跳出包含该违规语句的方法。执行将跳回到最初调用该方法的代码处。\n\
  \n![Tip](img/tip.png) 方法可以在其 `throws` 子句中列出多个异常类型。只需用逗号分隔异常类型的名称即可，如下例所示：\n\n`throws\
  \ FileNotFoundException, NumberFormatException, ArithmeticException`\n\n### 是受检的还是未受检的？\n\
  \n偷看一眼 列表 14-3，你会注意到你新声明的 `OutOfRangeException` 类继承了 Java 的 `RuntimeException` 类。为什么你想继承\
  \ `RuntimeException` 呢？这里是原因：\n\n- **`RuntimeException` 的任何子类都是未受检的。**\n\n  事实上，`RuntimeException`\
  \ 的任何后代（子子类、子子子类等）都是未受检的。未受检异常表示可能出现在程序中任何地方的错误。如果你的代码因为未受检异常而崩溃，你应该考虑重写代码。\n\n\
  \  常见的未受检异常包括 `NumberFormatException`（来自 列表 14-2、14-4 以及其他）、`ArithmeticException`、`IndexOutOfBoundsException`、臭名\
  \ `NullPointerException` 以及许多其他。当你编写 Java 代码时，你的大部分代码容易受到这些异常，但将代码封装在 `try` 子句中（或通过\
  \ `throws` 子句推卸责任）完全是可选的。\n\n- **任何不是 `RuntimeException` 后代的异常都是受检的。**\n\n  受检异常代表了外部世界可能给你的程序带来的挑战。无论你是否愿意，某些文件就是不在它们应该的位置，所以你最好在程序中承认这一点并编写代码尽尽应对。Java\
  \ 的受检异常包括 `FileNotFoundException`（参见 列表 14-8 和 14-9）、`PrinterException`、`SQLException`\
  \ 以及其他许多有趣的异常。\n\n#### 读者致谢\n\n![Tryitout](img/tryitout.png) 下面的代码无法编译，因为代码抛出了一个未声明的\
