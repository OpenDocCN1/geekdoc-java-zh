  \n### 向方法传递值\n\n看看 `getInterest` 方法的头部（当你阅读接下来的几个符号列表时，你可以结合图 7-6 中的图表直观地理解一些观点）：\n\
  \n*   方法头部中的第一个单词（`double`）告诉 Java，当调用 `getInterest` 方法时，`getInterest` 方法会将一个 `double`\
  \ 值返回给调用它的地方。`getInterest` 方法体中的语句确认了这一点。该语句为 `return balance * percentageRate /\
  \ 100.00`，且表达式 `balance * percentageRate / 100.00` 的类型为 `double`。（这是因为表达式中的所有内容——`balance`、`percentageRate`\
  \ 和 `100.00`——都是 `double` 类型。）\n\n当调用 `getInterest` 方法时，`return` 语句计算 `balance *\
  \ percentageRate / 100.00` 并将计算结果返回给调用该方法的代码。\n\n*   `getInterest` 单词是方法的名称。当你编写列表\
  \ 7-6 中的代码时，这就是你调用该方法时使用的名称。\n\n*   括号包含了调用方法时传递给方法的所有内容。当你调用方法时，可以动态将信息传递给该方法。这些信息就是方法的参数列表。`getInterest`\
  \ 方法的头部说明 `getInterest` 方法接收一个信息，且该信息类型必须是 `double` 类型：\n\n```java\ndouble getInterest(double\
  \ percentageRate)\n```\n\n果然，如果你查看 `getInterest` 的第一次调用（在列表 7-6 中），它使用了字面量 `5.00`。\n\
  \n### 从 getInterest 方法返回值\n\n当调用 `getInterest` 方法时，方法执行其体中的语句：`return` 语句。`return`\
  \ 语句计算 `balance * percentageRate / 100.00` 的值。如果 `balance` 恰好为 24.02，且 `percentageRate`\
  \ 为 5.00，则表达式的值为 1.21——大约 $1.20。（因为计算机完全处理 0 和 1，Java 获取的这个数字有极微小的偏差。Java 获取的是 1.2009999999999998。）\n\
  \n在计算出 1.2009999999999998 值后，Java 执行 `return`，将值传给 `main` 中调用 `getInterest` 的地方。在此时此时，整个方法调用——`myAccount.getInterest(5.00)`——变成了\
  \ 1.2009999999999998 这个值。调用本身位于 `println` 之中：\n\n```java\nout.println(myAccount.getInterest(5.00));\n\
  ```\n\n所以 `println` 最终的含义是：\n\n```java\nout.println(1.2009999999999998);\n```\n\n\
  值返回方法调用的整个过程在图 7-8 中所示。\n\n![“图片是一个 UML 序图，展示了编程背景下 main 方法和 Account 类之间的交互。Account\
