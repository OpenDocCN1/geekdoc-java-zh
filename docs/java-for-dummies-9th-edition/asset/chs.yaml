  \n图 11-5: 打印名称。\n\n\n\n\n图 11-6 描述了球员击球率的格式。在 `\"%.3f\"` 中，`.3f` 部分要求数字小数点后保留三位数字。对于小于\
  \ 1 的数字，Java 会在小数点左侧放置一个数字 `0`。这通常是件好事。（我的高中老师告诉我要这样做，这样小数点就不容易被遗漏了。）\n\n但显示击球率的惯例是不包含这个前导\
