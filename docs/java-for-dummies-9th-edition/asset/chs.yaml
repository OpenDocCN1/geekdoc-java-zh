  \ {\n    try (var diskScanner = new Scanner(new File(\"EmployeePayment.txt\"));\n\
  \         var diskScanner2 = new Scanner(new File(\"LegalInfo.txt\"))) {\n     \
  \   String name = diskScanner.nextLine();\n        double amountPaid = diskScanner.nextDouble();\n\
  \        String disclaimer = diskScanner2.nextLine();\n        print(\"Pay to the\
  \ order of \" + name);\n        println(String.format(\" ***$%,.2f\", amountPaid));\n\
  \        println(disclaimer);\n    } catch (FileNotFoundException e) {\n       \
  \ println(\"Abnormal return from the cutCheck method … \");\n        throw e;\n\
  \    }\n}\n```\n\n在 Listing 14-11 中，`diskScanner1` 和 `diskScanner2` 的声明位于 `try`\
  \ 单词后的括号中。括号内的声明告诉 Java 在执行完 `try` 子句中的语句后，自动关闭 `diskScanner1` 和 `diskScanner2`。无论你是否抛出异常，Java\
  \ 都会关闭这些连接。\n\n查看 `cutCheck` 方法体中的所有语句。这些语句中没有一个包含 `close` 单词。你不需要任何显式的 `close`\
  \ 调用。try-with-resources 语句为你完成了所有的关闭工作。\n\n你可以访问各种资源（文件、数据库、服务器连接等），并可以放心，Java 会在需要时自动断开连接。生活是如此美好！\n\
  \n在我们与 Listing 14-11 告别之前，让我们花点时间看看 `cutCheck` 方法的 `catch` 子句。就像 Listing 14-9 中一样，我们希望代码的\
  \ `main` 方法对缺失的 `LegalInfo.txt` 文件进行处理。我们可以添加许多笨拙的 `if` 语句让 `main` 听从我们的意愿，但让 `main`\
  \ 响应原始的 `FileNotFoundException` 更好。在 `cutCheck` 方法的 `catch` 子句中，变量 `e` 代表那个令人讨厌的\
  \ `FileNotFoundException`。因此，`throw e` 语句起作用了。该语句的意思：“将这个卑鄙的 `FileNotFoundException`\
  \ 传递给调用我的任何方法。”而“调用我的方法”就是 `main`。\n\n![Tip](img/tip.png) 在 try-with-resources 语句中，`catch`\
  \ 子句是可选的。\n\n\n\n\n\n```java\npublic interface Displayable {\n    void display();\n\
  }\n```\n\n等一下！Listing 15-1 中的 `display` 方法声明有头部但没有方法体。在 `display()` 之后没有出现大括号——只有一个孤零零的分号。这到底是怎么回事？\n\
  \n为了回答这个问题，我将让 Listing 15-1 中的代码自己说明自己。如果列表中的代码会说话，它会这样说：\n\n*   “作为一个接口，我的 `display`\
  \ 方法有头部但没有方法体。任何声称实现了我（即 `Displayable` 接口）的类必须提供（直接或间接地提供）`display` 方法的方法体。也就是说，一个声称实现了\
  \ `Displayable` 的类必须以某种方式提供如下所示的自己的代码：\n\n```java\npublic void display() {\n   \
  \ // 此处编写一些语句\n}\n```\n\n*   “要实现我（Listing 15-1 中的接口），新代码的 `display` 方法不能有任何参数且不返回任何（也称为\
  \ `void`）。”\n\n`Displayable` 接口就像一份法律合同。`Displayable` 接口并没有告诉你实现类已经拥有了什么。相反，`Displayable`\
  \ 接口告诉你是实现类必须在自己的代码中声明什么。\n\n除了显示数字列和表格外，我可能还想对这两类数据进行汇总。如何汇总一列数字？我不知道。也许你可以显示所有数字的总和。那么如何汇总表格呢？也许你可以显示表格的列标题。你如何汇总数据并不关我。我关心的是你有某种方法来汇总数据。\n\
  \n因此，我创建了一段包含第二个 Java 合同的代码。第二个合同说：“任何签署此合同的人都同意拥有一个 `summarize` 方法。”在 Listing 15-2\
  \ 中，我声明了一个 `Summarizable` 接口。\n\nLISTING 15-2 另一个接口\n\n```java\npackage com.example.data;\n\
  \npublic interface Summarizable {\n    String summarize();\n}\n```\n\n任何声称实现了 `Summarizable`\
  \ 接口的类必须不择手段地提供一个 `summarize` 方法的实现——一个没有参数并返回 `String` 值的方法。\n\n![Remember](img/remember.png)\
  \ 在接口的声明中，特定方法可能没有自己的方法体。没有方法体的方法被称为*抽象方法*。\n\n![Technical Stuff](img/technicalstuff.png)\
  \ 接口的抽象方法无论你是否使用 `public` 关键字都是自动公开的。例如，在 Listing 15-2 中，这一行\n\n```java\nString\
  \ summarize();\n```\n\n与以下含义相同：\n\n```java\npublic String summarize();\n```\n\n\
  如果你喜欢输入 `public` 这个词，尽管去写。如果不喜欢，就省略那个词。\n\n### 实现接口\n\nListing 15-3 为名为 `ColumnOfNumbers`\
  \ 的类实现了 `Displayable` 和 `Summarizable` 接口。为了 `display` 一列数字，列表打印了所有数字。为了 `summarize`\
  \ 一列数字，列表打印了所有数字的总和。\n\nLISTING 15-3 实现两个接口\n\n```java\npackage com.example.data;\n\
  \npublic class ColumnOfNumbers implements Displayable, Summarizable {\n    private\
  \ double numbers[];\n\n    public ColumnOfNumbers(double[] numbers) {\n        this.numbers\
  \ = numbers;\n    }\n\n    @Override\n    public void display() {\n        for (double\
  \ d : numbers) {\n            System.out.println(d);\n        }\n    }\n\n    @Override\n\
  \    public String summarize() {\n        double total = 0.0;\n        for (double\
  \ d : numbers) {\n            total += d;\n        }\n        return Double.toString(total);\n\
  \    }\n}\n```\n\n![Remember](img/remember.png) 当你实现一个接口时，你提供了接口抽象方法的方法体。\n\nJava\
  \ 编译器对 `implements`关键字的使用非常认真。如果你从 Listing 15-3 中移除两个方法声明之一但不移除 `implements` 子句，你会在\
  \ IDE 编辑器中看到一些可怕的错误信息。Java 期望你遵守 `implements` 关键字所隐含的合同。如果你不遵守合同，Java 将拒绝编译你的代码。就这么！\n\
  \n![Tip](img/tip.png) 你可以利用 Java 的错误信息为自己服务。先开始编写一些包含 `implements Displayable, Summarizable`\
  \ 子句的代码。由于 `implements` 子句，编辑器会显示错误标记并列出你本应该拥有但没有的方法名称。\n\n关于 Listing 15-3 的最后一点：`display`\
  \ 方法打印所有数字、`summarize` 方法打印总和是我的选择。Java 的唯一要求是 `ColumnOfNumbers` 必须以 `implements\
  \ Displayable, Summarizable` 开头（注：此处原文此处括号笔误）。如果你想让 `display` 方法打印“Hello!”而 `summarize`\
  \ 方法打印表头，那是你的决定。\n\nListing 15-4 实现接口\n\n```java\npackage com.example.data;\n\n\
  public class Table implements Displayable, Summarizable {\n    private Scanner diskFile;\n\
  \    private ArrayList<String> lines = new ArrayList<>();\n\n    public Table(String\
  \ fileName) {\n        try {\n            diskFile = new Scanner(new File(fileName));\n\
  \        } catch (FileNotFoundException e) {\n            e.printStackTrace();\n\
  \        }\n        while (diskFile.hasNextLine()) {\n            lines.add(diskFile.nextLine());\n\
  \        }\n    }\n\n    @Override\n    public void display() {\n        for (String\
  \ line : lines) {\n            System.out.println(line);\n        }\n    }\n\n \
  \   @Override\n    public String summarize() {\n        return lines.get(0);\n \
  \   }\n}\n```\n\n在 Listings 15-3 和 15-4 中，注意 `@Override` 注解的多次用法。在第 10 章中，你使用 `@Override`\
  \ 来标记父类中已经声明的方法。但你也可以使用 `@Override` 来标记接口实现。这就是我在 Listings 15-3 中的做法。\n\n### 组合部分\n\
  \nListing 15-5 中的代码使用了 Listings 15-1 到 15-4 中的所有内容。\n\nLISTING 15-5 充分利用你的接口\n\n\
  ```java\nimport com.example.data.*;\n\npublic class UseColumnAndTable {\n    public\
