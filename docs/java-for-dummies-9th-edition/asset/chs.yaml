  ? \");\n    guests[roomNum] = keyboard.nextInt();\n    var listOut = new PrintStream(\"\
  GuestList.txt\");\n    for (roomNum = 0; roomNum < 10; roomNum++) {\n        listOut.print(guests[roomNum]);\n\
  \        listOut.print(\" \");\n    }\n    listOut.close();\n}\n```\n\n图 13-4 显示了列表\
  \ 13-3 中代码的三次运行。该旅馆开始时有两个空房间：3 号房和 8 号房。（记住房号是从 0 号开始的）。第一次运行代码时，你将 5 个人放入 3 号房。第二次运行代码时，你让一个\
  \ 10 人的团体进入 8 号房。（好大的一个团体啊！）第三次运行代码时，你没有更多空房间了。当程序发现这一点时，它会显示消息 `Sorry, no v cancy`，省略了至少一个字母，这符合所有旅馆霓虹灯牌的传统。\n\
