  \n*   **你需要一个** `throws IOException` 子句。当你的程序连接到 `EmployeeInfo.txt` 时，可能会发生很多问题。其一，你的硬盘可能没有名为\
  \ `EmployeeInfo.txt` 的文件。此外，文件 `EmployeeInfo.txt` 可能在错误的目录下。为了防范这种灾难，Java 编程语言采取了某些预防措施。该语言坚持，当涉及到磁盘文件时，你要承认调用\
  \ `new Scanner` 可能带来的危险。\n\n你可以通过几种可能的方式承认这些危险，但最简单的方法是使用 `throws` 子句。在列表 9-3 中，`main`\
  \ 方法的头部以 `throws IOException` 结尾。通过添加这两个词，你安抚了 Java 编译器。这就像是在说：“我知道调用 `new Scanner`\
  \ 可能会导致问题。你不需要提醒我。”而且，确实，在你的 `main` 方法中添加 `throws IOException` 可以让 Java 不再抱怨。（如果没有这个\
  \ `throws` 子句，你会得到一个 `unhandled exception` 错误消息。）\n\n![交叉引用](img/crossreference.png)\
  \ 有关 Java 异常的完整事说，请阅读第 14 章。在此期间，在任何调用 `new Scanner(new File( … ))` 的方法头部中添加 `throws\
  \ IOException`。\n\n### 你的文件在哪里？\n\n如果 Java 找不到 `EmployeeInfo.txt` 文件，整个项目就无法正常运行。相反，你会得到一个\
  \ `FileNotFoundException`。\n\n通常，当你得到 `FileNotFoundException` 时，你的程序需要的某些文件对它不可。这是一个很容易犯的错误。这可能会让人感到沮丧，因为对你来说，像\
  \ `EmployeeInfo.txt` 这样的文件看起来对你的程序是可用的。但记住：计算机是愚蠢的。如果你犯了一个微小的错误，计算机无法为你读懂弦外之意。如果文件名拼错误，计算机在尝试运行你的代码时就会卡住。\n\
  \n有时你很清楚你的硬盘上存在一个 `EmployeeInfo.txt`（或 `whatever.xyz`）文件。但当你运行程序时，你仍然得到一个难看的 `FileNotFoundException`。当这种情况发生时，该文件可能在你硬盘的错误的目录中。（当然，这取决于你的观点。也许文件在正确的目录下，但你的\
  \ Java 程序在错误的目录下查找该文件。）要诊断这个问题，请向列表 9-3 添加以下代码：\n\n```java\nvar employeeInfo = new\
  \ File(\"EmployeeInfo.txt\");\nSystem.out.println(\"Looking for \" + employeeInfo.getCanonicalPath());\n\
  ```\n\n当你运行代码时，Java 会告诉你 `EmployeeInfo.txt` 文件在你的硬盘上应该在哪里。\n\n### 你可以决定把文件放在哪里\n\
  \n使用像 `new File(\"EmployeeInfo.txt\")` 这样的代码，你的 IDE 会决定去哪里寻找名为 `EmployeeInfo.txt`\
  \ 的文件。但你可以通过在 Java 代码中命名文件的确切位置来覆盖此行为。Windows 上的 `new File(\"C:\\\\Users\\\\bburd\\\
  \\Documents\\\\EmployeeInfo.txt\")` 或 Mac 上的 `File(\"/Users/bburd/Documents/EmployeeInfo.txt\"\
  )` 看起来非常丑陋，但它是有效的。\n\n在前面的段落中，你注意到 `\"C: \\\\Users\\\\bburd\\\\Documents …\"` 中的双反斜杠\
  \ 了吗？如果你是 Windows 用户，你会倾向于用单反斜杠写 `C:\\Users\\bburd\\Documents …`。但在 Java 中，单反斜杠有它自己的特殊含义。（例如，`print(\"\
  \\n\\nBoo!\")` 意味着，“跳过两行！””）\n\n### 逐行读取\n\n列表 9-2 和 9-3 说明了读取数据的一些有用技巧。特别地，每个扫描器都有一个\
  \ `nextLine` 方法。当你创建一个扫描器时，`nextLine` 会读取直到行尾。\n\n为了理解所有这些，你需要痛苦地意识到换行符。把换行符想象成一个额外的字符，卡在行与行之间。那么，在\
  \ Java 中调用 `nextLine` 意味着读取到行尾。\n\n在上一段中，注意我对 `nextLine` 的仔细选择：`nextLine` 读取到行尾。不幸的是，读取到行尾并不总是如你想的。所以，在\
  \ Java 中，你需要观察换行符。\n\n图 9-5 包含了图 3 中前几行的注释版本。注意为了读取 `5000.00` 之后的 `Haritter Ritter`：\n\
  \n*   你调用 `nextDouble` 得到 `5000.00`，然后\n*   你调用 `nextLine`，认为你会得到 `Haritter Ritter`。但实际上，你得到的是\
  \ `5000.00` 之后的换行符。\n\n![图像是一个使用磁盘扫描器处理 Java 程序的流程图。它描绘了读取并赋值给员工属性（如姓名、职位和薪水金额）的步骤序列。流程图包含了代码段，从\
