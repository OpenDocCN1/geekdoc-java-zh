  再次查看列表 14-4。注意，一个 `try` 子句可以伴随多个 `catch` 子句。当在 `try` 子句内部抛出异常时，Java 开始检查伴随的 `catch`\
  \ 子句列表。它从紧接在 `try` 子句之后的 `catch` 子句开始，并沿着程序文本向下执行。\n\n对于每个 `catch` 子句，Java 都会问自己：“刚刚抛出的异常是该子句参数列表中类的一个实例吗？”\n\
  \n- 如果不是，Java 将跳过此 `catch` 子句，并移动到行中的下一个 `catch` 子句。\n- 如果是，Java 将执行此 `catch` 子句，然后跳过与该\
  \ `try` 子句相关的所有其他 `catch` 子句。Java 将继续执行整个 `try-catch` 语句之后的任何语句。\n\n有关具体示例，请参阅列表\
