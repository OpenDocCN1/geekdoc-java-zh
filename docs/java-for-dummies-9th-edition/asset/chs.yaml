  \ information` 消息。\n\n## 在许多替代方案中进行选择\n\n我是第一个承认自己讨厌做做决策的人。如果事情出了差错，我宁愿让问题变成别人的错。编写之前的章节（关于使用\
  \ Java 的 `if` 语句做决策）耗尽了我的精力。这就是为什么当我开始这一节关于在许多替代方案中进行选择的章节时，我的大脑感到一片混乱。能把这些心里话说出来真是松了一口气！\n\
  \n### Java 华丽的 switch 语句\n\n现在是时候探索具有多个分支决策的情况了。例如，流行的营火歌“<Al’s All Wet”。如需查看歌词，请参考旁边的“<Al’s\
  \ All Wet”侧边栏）。你急于编写打印这首歌歌词的代码。幸运的是，你不需要一遍又输入所有的单词。相反，你可以利用歌词中的重复性。\n\n为了显示歌词的部分内容，你创建了一个名为\
  \ `verse` 的变量。`verse` 的值为 `1`、`2` 或 `3`，取决于你试图打印“Al's All Wet”的哪一节。你可以拥有一大堆笨拙的 `if`\
  \ 语句来检查每个可能的 `verse` 数字：\n\n```\nif (verse == 1) {\n    println(\"That's because\
  \ he has no brain.\");\n}\nif (verse == 2) {\n    println(\"That's because he is\
  \ a pain.\");\n}\nif (verse == 3) {\n    println(\"'Cause this is the last refrain.\"\
  );\n}\n```\n\n但那种方法似乎很浪费。为什么不创建一个语句，只检查一次 `verse` 的值，然后根据找到的值采取操作呢？幸运的是，恰好有这样一个语句——它被称为\
  \ `switch` 语句。列表 5-6 有一个 `switch` 语句的示例。\n\n列表 5-6 switch 语句\n\n```\nvoid main()\
  \ {\n    int verse = Integer.parseInt(readln(\"Which verse? \"));\n    switch (verse)\
  \ {\n        case 1 -> println(\"That's because he has no brain.\");\n        case\
  \ 2 -> println(\"That's because he is a pain.\");\n        case 3 -> println(\"\
  'Cause this is the last refrain.\");\n        default -> println(\"No such verse.\
  \ Please try again.\");\n    }\n    println(\"Oh, oh, oh, oh\");\n}\n```\n\n![Warning](img/warning.png)\
  \ 在 Oracle 于 2020 年发布 Java 14 之前，我在这一节中描述的大多数功能尚可用。如果你发现了使用旧版本 Java 的理由，请查看标题为“你祖父的\
  \ `switch` 语句”的后续章节。\n\n图 5-11 显示了列表 5-5 中代码的多次运行。核心思想是，要登录必须通过两个测试。（换句话说，两个条件必须为真。）第一个测试检查用户名是否有效；第二个测试密码是否正确。如果你通过了第一个测试（用户名测试），就会直接进入另一个\
  \ `if` 语句，执行第二个测试（密码测试）。如果你没有通过第一个测试，就永远无法到达第二个测试。图 5-10 显示了整体方案。\n\n### 表达你自己\n\
  \n如果你再次查看列表 5-6，你会疑惑为什么有人如此乐于输入 `println` 这个词。这个词在 `switch` 语句中出现了四次，唯一的区别是讽刺诗节的选择。这种重复的\
  \ `println` 使用似乎很浪费。为什么不对于程序可以显示的所有回答只调用一次 `println` 呢？\n\nJava 的 `switch` 表达式解决了这个问题。事实上，列表\
  \ 5-7 的运行结果与列表 5-6 的运行结果完全相同。\n\n\n\n\n\n```java\ndefault -> \"No such verse. Please\
  \ try again.\";\n};\n\nprintln(line);\nprintln(\"Oh, oh, oh, oh\");\n}\n```\n\n\
  在任何计算机语言中，`expression`（表达式）一词都指一组代表一个值的代码。在插列表 5-7 中，整个 `switch` 表达式代表一串字符。例如，当\
  \ `verse` 的值为 `2` 时，这段代码\n\n```java\nline = switch (verse) {\n    case 1 -> \"That's\
  \ because he has no brain.\";\n    case 2 -> \"That's because he is a pain.\";\n\
  \    case 3 -> \"'Cause this is the last refrain.\";\n    default -> \"No such verse.\
  \ Please try again.\";\n};\n```\n\n代表字符串 `\"That's because he is a pain.\"`。因此，在那种情况下，插列表\
  \ 5-7 的作用与此代码相同：\n\n```java\nline = \"That's because he is a pain.\";\nout.println(line);\n\
  ```\n\n在这段简短的代码片段中，注意第一行是以分号结尾的。这就是为什么在插列表 5-7 中，大的 `switch` 表达式的末尾也有一个分号的原因。\n\n\
  你可以从 Java 的 `switch` 表达式中榨出更多妙用。例如，你不需要将表达式的值赋值给变量。你可以跳过变量直接打印 `switch` 表达式的值：\n\
  \n```java\nprintln(switch (verse) {\n    case 1 -> \"That's because he has no brain.\"\
  ;\n    case 2 -> \"That's because he is a pain.\";\n    case 3 -> \"'Cause this\
  \ is the last refrain.\";\n    default -> \"No such verse. Please try again.\";\n\
  });\n```\n\n但请记住，`switch` 表达式不能独立存在。下面的代码没有意义：\n\n```java\n// 坏代码！\nint verse =\
  \ Integer.parseInt(readln(\"Which verse? \"));\nString line;\n\"That's because he\
