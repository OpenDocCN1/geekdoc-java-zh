  \n`main` 单词在 Java 中扮演着特殊角色。特别是，你永远不会编写显式调用 `main` 方法执行的代码。`main` 单词是程序开始运行时自动被调用的方法名。\n\
  \n回看图 3-1。当“Two Plus Two”程序运行时，计算机会自动找到程序的 `main` 方法并执行方法体内的任何指令。`main` 方法体中只有一条指令。该指令告诉计算机在屏幕上打印\
  \ `2 + 2` 的值。因此，在图 3-1 中，`4` 出现在计算机屏幕上。\n\n![Remember](img/remember.png) 方法中的指令在方法被调用之前不会执行。但是，如果你给一个方法命名为\
  \ `main`，那么该方法就会自动被调用。\n\n![Technical Stuff](img/technicalstuff.png) 几乎每种计算机编程语言都有类似于\
  \ Java 方法的东西。如果你用过其他语言，你可能记得如 `functions`（函数）、`procedures`（过程）、`subprograms`（子程序）、`subroutines`（子例程）以及老旧的\
  \ `PERFORM` 语句。无论在你最喜欢的编程语言中如何称呼它，方法都是一组被收集并赋予新名称的指令。\n\n### 你最终如何告诉计算机去做某事\n\n\
  列表 3-1 的核心是向计算机发出直接指令的单行代码。该行在图 3-3 中被突出显示，告诉计算机显示 `2 + 2` 的值。这一行是一个语句（statement）。在\
  \ Java 中，`statement` 是告诉计算机执行某事的直接指令（例如，显示此文本、将特定数字放入该内存位置、让窗口出现或其他任何）。\n\n![图像是一个完全的黑色正方形，没有任何可识别的特征、文本或物体。它呈现出极简且抽象的视觉效果，可以根据上下文有不同的解释。](img/9781394289240-fg0303.png)\n\
