  \ JShell 的说明。启动 JShell 后，输入图 4-7 中的几行代码。尝试输入一些略有不同的行，看看会发生什么。\n\n## 原子：Java 的基本类型\n\
  \n我在前面的章节中描述的 `int` 和 `double` 词是 Java 中`primitive types`（也称为 `simple` 类型）的示例。Java\
  \ 语言恰好有八种基本类型。作为 Java 初学者，你几乎可以忽略这些类型中的除四个。（从编程语言来说，Java 的设计非常紧凑。）表 4-1 显示了基本类型的完整列表。\n\
  \n| **类型名称** | **字面量的样子** | **取值范围** |\n| --- | --- | --- |\n| *整数类型* | | |\n| `byte`\
  \ | `(byte)42` | –128 to 127 |\n| `short` | `(short)42` | –32768 to 32767 |\n| `int`\
  \ | `42` | –2147483648 to 2147483647 |\n| `long` | `42L` | –9223372036854775808\
  \ to 9223372036854775807 |\n| *小数类型* | | |\n| `float` | `42.0F` | –3.4 × 10³⁸ to\
  \ 3.4 × 10³⁸ |\n| `double` | `42.0` | –1.8 × 10³⁰⁸ to 1.8 × 10³⁰⁸ |\n| *字符类型* |\
  \ | |\n| `char` | `'A'` | 数千个字符、字形和符号 |\n| *逻辑逻辑类型* | | |\n| `boolean` | `true`\
  \ | true, false |\n\n表 4-1 Java 的基本类型\n\n你不应该忽略的类型是 `int`、`double`、`char` 和 `boolean`。本章之前的章节涵盖了\
  \ `int` 和 `double` 类型。因此接下来的两个章节将涵盖 `char` 和 `boolean` 类型。\n\n### char 类型\n\n到底什么是\
  \ Jhlzhy Jpwoly？\n\n在罗马（英语）字母表中，字母 `J` 在字母 `C` 之后七个字母，而 `h` 在 `a` 之后七个字母。如果你对 `Jhlzhy\
  \ Jpwoly` 中的所有字母使用这种“七位移动法”，你就能拼出 `Caesar Cipher`（凯撒密码）。这是罗马将尤利乌加密其秘密信息的方法。\n\n\
  用于存储字符的 Java 类型称为 `char`。代码列表 4-4 中的程序使用 Java 的 `char` 类型来查找字母表中 `J` 前七位的字母。代码只解释一个字母，如果该字母在字母表中位于\
  \ `H` 之前，它将无法工作。但我们现在不用担心那个。\n\n代码列表 4-4 *J* 前七个字母\n\n```java\nvoid main() {\n \
  \   char oneLetter = 'J' - 7;\n    println(oneLetter);\n}\n```\n\n图 4-9 显示了程序的输出。\n\
  \n![IDE 显示程序输出的截图。输出包括文件路径、单个字符 'C' 以及一个表示进程结束的消息。](img/9781394289240-fg0408.png)\n\
  \n图 4-9: 代码列表 4-4 在 IntelliJ 运行窗口中的程序运行。在代码列表 4-4 中，注意 `J` 被单引号包围。在 Java 中，每个 `char`\
  \ 字面量都以单引号开头和结束。](images/remember.png) 在 Java 程序中，单引号包围 `char` 字面量中的字母。在“值的类型”章节中提到，位序列\
  \ 010100 代表字母 J、数字 74 或 1 × 10¹，取决于你如何解释它。表 4-2 显示了其他位序列代表什么。\n\n| **位序列** | **当我们解释为\
  \ `char` 时的含义** | **当我们解释为 `int` 时的含义** |\n| --- | --- | --- |\n| 1000001 | `'A'`\
  \ | 65 |\n| 1000010 | `'B'` | 66 |\n| 1000011 | `'C'` | 67 |\n| 1000100 | `'D'`\
  \ | 68 |\n| 1000101 | `'E'` | 69 |\n| 1000110 | `'F'` | 70 |\n| 1000111 | `'G'`\
  \ | 71 |\n| 1001000 | `'H'` | 72 |\n| 1001001 | `'I'` | 73 |\n| 1001010 | `'J'`\
  \ | 74 |\n| … | … | … |\n| 1100001 | `'a'` | 97 |\n\n表 4-2 Java 如何表示字符\n\n在许多方面，Java\
  \ 将 `char` 视为数值类型。事实上，字面量 `'J'` 代表数字 74。该字面量在计算机屏幕上看起来像字母，只是 Java 让你觉得正在处理字母表中的符号。因此，在代码列表\
  \ 4-4 中，你从 `'J'` 减 7，得到数值 67。当你调用 `println` 时，该数字在屏幕上显示为字母 `C`。\n\n![警告](img/warning.png)\
  \ 如果你想写以下语句：\n\n```java\nchar myLittleChars = 'barry'; // 不要这样做\n```\n\n请克制。你不能在\
  \ `char` 变量中存储多个字母，不能在一单引号之间放入多个字母。如果你试图存储单词或句子（而不只是单个字母），你需要使用称为 `String` 的东西。参见本章后面的“分子与化合物：引用类型”章节。\n\
  \n![警告](img/warning.png) Java 对字符的处理有一些微妙的转折。例如，在代码列表 4-4 中，你将 `oneLetter` 声明为 `char`\
  \ 类型。因此，语句 `println(oneLetter)` 显示字母 `C`。但如果你的程序包含语句 `println('J' - 7)`，Java 认为你在要求它从\
  \ 74 减 7，所以你看到的输出是数字 `67`。![技术](img/technicalstuff.png) 如果你习惯用其他语言编写程序，可能知道 ASCII\
  \ 编码。许多语言使用 ASCII；Java 使用 Unicode。在旧的 ASCII 表示中，每个字符仅 8 位，但在 Unicode 中，每个字符占用 8、16\
  \ 或 32 位。ASCII 存储罗马字母表，而 Unicode 有存储世界上许多语言字符的空间。Java 的 `char` 类型是 16 位的 Unicode。因此，在表\
  \ 4-2 中，序列 1001010 实际上代表 000000001001010。\n\n### boolean 类型\n\n`boolean` 类型的变量存储两个值之一：`true`\
  \ 或 `false`。代码列表 4-5 展示了 `boolean` 变量的使用。图 4-10 显示了代码列表 4-5 中程序的输出。\n\n![一张基于文本的图像，有一个判断题，询问十个\
  \ Brickenchicker 十胞胎是否都能进入电梯。提供的答案是'false'。](img/9781394289240-fg0410.png)\n\n图\
  \ 4-10: Brickenchicker 十胞胎再次出击。\n\n代码列表 4-5 使用 boolean 类型\n\n\n\n\n\n```java\nvoid\
  \ main() {\n    println(\"True or False?\");\n    println(\"You can fit all ten\
  \ of the\");\n    println(\"Brickenchicker decuplets\");\n    println(\"on the elevator:\"\
  );\n    println(\"\"); // or println();\n    int weightOfAPerson = 150;\n    int\
  \ elevatorWeightLimit = 1400;\n    int numberOfPeople = elevatorWeightLimit / weightOfAPerson;\n\
  \    boolean allTenOkay = numberOfPeople >= 10;\n    println(allTenOkay);\n}\n```\n\
  \n在 Listing 4-5 中，`allTenOkay`变量的类型是 `boolean`。为了给变量 `allTenOkay` 赋值值，程序会检查 `numberOfPeople`\
  \ 是否大于或等于 `ten`。（符号 `>=` 表示大于或等于。）\n\n在此时，对术语保持严谨是很有意义的。Java 程序中任何具有值的部分都是一个*表达式*（expression）。如果你写下\n\
  \n`weightOfAPerson = 150;`\n\n那么 `150` 就是一个表达式（其值为数值 `150` 的表达式）。如果你写下\n\n`numberOfEggs\
  \ = 2 + 2;`\n\n那么 `2 + 2` 就是一个表达式（因为 2 + 2 的值为 `4`）。如果你写下\n\n`int numberOfPeople\
  \ = elevatorWeightLimit / weightOfAPerson;`\n\n那么 `elevatorWeightLimit / weightOfAPerson`\
  \ 就是一个表达式。（表达式 `elevatorWeightLimit / weightOfAPerson` 的值取决于执行包含该表达式的代码时变量 `elevatorWeightLimit`\
  \ 和 `weightOfAPerson` 所拥有的值。）\n\n![Remember](img/remember.png) Java 程序中任何具有值的部分都是一个*表达式*。\n\
  \n在 Listing 4-5 中，代码 `numberOfPeople >= 10` 是一个表达式。该表达式的值取决于 `numberOfPeople` 变量中存储的值。但正如你从\
  \ Brickenchicker 家族的宴午餐上看到的草莓蛋糕那样，`numberOfPeople` 的值并不大于或等于十。因此，`numberOfPeople\
  \ >= 10` 的值为 `false`。所以，在 Listing 4-5 为 `allTenOkay` 赋值的语句中，`allTenOkay` 变量被赋值为\
  \ `false` 值。\n\n在 Listing 4-5 中，调用 `println(\"\")` 在程序的输出中添加了一个空行。这是因为 `\"\"` 代表空字符串——不包含任何字符的字符串。关于字符串的更多信息，请参见本章的“Java\
  \ 的 String 类型”部分。\n\n![Technical Stuff](img/technicalstuff.png) 通过 Java 23 的预览功能，你可以通过调用\
  \ `System.out.println()` 来显示空行，但不能仅通过调用 `println()` 来。当你读到这本书时，简单的 `println()` 调用可能已经可用了。事实上，Java\
  \ 的大师们计划在 Java 24 中添加那个简单的 `println()`。我没有时间机器，所以无法在向 Wiley 发送这一章节之前尝试该功能。\n\n##\
  \ 通过应用运算符创建新值\n\n什么比你的老朋友加号更让你感到宽慰呢？这是你在小学数学课中学的第一个主题。几乎每个人都知道如何将 2 加 2。事实上，在英语用法中，将\
  \ 2 加 2 是对简单易事的比喻。每当你看到加号时，你大脑中有一个细胞就会说：“谢天谢地——它可能要复杂得多。”\n\nJava 有加号。你可以将其用于多种用途。你可以用加号将两个数字相加，如下：\n\
  \n```java\nint apples, oranges, fruit;\napples = 5;\noranges = 16;\nfruit = apples\
  \ + oranges;\n```\n\n你也可以用加号将 `String` 值拼接在一起：\n\n```java\nString startOfChapter\
  \ =\n    \"It's three in the morning. I'm dreaming about the\" +\n    \"history\
  \ course that I failed in high school.\";\nprintln(startOfChapter);\n```\n\n非常有用，因为在\
  \ Java 中，你不能让普通的带引号 `String` 字面量跨行显示。换句话说，下面的代码将无法工作：\n\n```java\nString thisIsBadCode\
  \ =\n    \"It's three in the morning. I'm dreaming about the\n    history course\
  \ that I failed in high school.\";\nprintln(thisIsBadCode);\n```\n\n如果你想让一个字符串跨多行，你需要另一个技巧。详情请参见第\
  \ 5 章。\n\n![Technical Stuff](img/technicalstuff.png) 说你正在拼接 `String` 值的正确说法是，你正在*连接*（concatenating）`String`\
  \ 值。\n\n你甚至可以使用加号将数字放在 `String` 值旁边：\n\n```java\nint apples, oranges, fruit;\napples\
  \ = 5;\noranges = 16;\nfruit = apples + oranges;\nprintln(\"You have\" + fruit +\
  \ \"pieces of fruit.\");\n```\n\n当然，旧的减号也是可用的（但不适用于 `String` 值）：\n\n`apples = fruit\
  \ - oranges;`\n\n使用星号 (`*`) 进行乘法，使用斜杠 (`/`）进行除法：\n\n```java\ndouble rate, pay;\n\
  int hours;\nrate = 6.25;\nhours = 35;\npay = rate * hours;\nprintln(pay);\n```\n\
  \n关于除法的示例，请参考 Listing 4-3。\n\n![Warning](img/warning.png) 当你用一个 `int` 值除以另一个 `int`\
  \ 值时，你会得到一个 `int` 值。计算机不会四舍五入。相反，计算机会切掉任何余数。如果你在程序中放入 `println(11 / 4)`，计算机打印 `2`，而不是\
  \ `2.75`。要解决这个问题，让这两个数字变为 `double` 值。如果你在程序中放入 `println(11.0 / 4)`，计算机打印 `2.75`。\n\
  \n另一个有用的运算符叫做*余数*（remainder）运算符。余数运算符的符号是百分号 (`%`)。当你向程序中放入 `println(11 % 4)` 时，计算机打印\
  \ `3`。这是因为 4 除以 11 有几次，余数为 3。余数运算符被证明非常有用。Listing 4-6 包含一个示例。\n\n### Listing 4-6:\
  \ 找零\n\n```java\nvoid main() {\n    int total = 248;\n    int quarters = total /\
  \ 25;\n    int whatsLeft = total % 25;\n    int dimes = whatsLeft / 10;\n    whatsLeft\
  \ = whatsLeft % 10;\n    int nickels = whatsLeft / 5;\n    whatsLeft = whatsLeft\
  \ % 5;\n    int cents = whatsLeft;\n    println(\"From \" + total + \" cents you\
  \ get\");\n    println(quarters + \" quarters\");\n    println(dimes + \" dimes\"\
  );\n    println(nickels + \" nickels\");\n    println(cents + \" cents\");\n}\n\
  ```\n\nFigure 4-11 显示了 Listing 4-6 代码的运行情况。你从总数 248 开始。然后 `quarters = total / 25`\
  \ 将 248 除以 25，得到 9。这意味着你可以从 248 分中凑出 9 个硬币。接下来，`whatsLeft = total % 25` 再次将 248\
  \ 除以 25，并将余数 3 放入 `whatsLeft` 中。现在你准备好了下一步，即从剩余中尽可能多地提取角。（等等，文中说是 23，但逻辑上是 3）。\n\
  \n实际上，是凑成总数的*最少硬币数量*。例如，在 20 世纪 70 年代，英国有 25p、20p、10p 和 5p 的硬币。为了凑齐 40p，像 Listing\
  \ 4-6 那样的程序会建议 25p + 10p + 5p。但你可以通过拿出 20p + 20p 来使用更少的硬币。\n\n#### 平滑运算符\n\n![Tryitout](img/tryitout.png)\
  \ 通过在 JShell 中输入每个表达式，找到以下表达式的值：\n\n*   `5 / 4`\n*   `5 / 4.0`\n*   `5.0 / 4`\n\
  *   `5.0 / 4.0`\n*   `\"5\" + \"4\"`\n*   `5 + 4`\n*   `\" \" + 5 + 4`\n\n\n\n\n\
  \n### 一次初始化，频繁赋值\n\n列表 4-6 有三行代码将值存入变量 `whatsLeft`：\n\n`int whatsLeft = total %\
  \ 25;`\n\n`whatsLeft = whatsLeft % 10;`\n\n`whatsLeft = whatsLeft % 5;`\n\n这三行代码中只有一行是声明。另外两行是赋值语句。这很好，因为你不能多次声明同一个变量（除非创建一个名为*块*（block）的东西）。如果你不小心写了如下代码：\n\
  \n`int whatsLeft = total % 25;`\n\n`int whatsLeft = whatsLeft % 10;`\n\n在列表 4-6\
  \ 中，当你尝试编译代码时，你会看到一条错误信息（例如 `Duplicate variable whatsLeft` 或 `Variable 'whatsLeft'\
  \ is already defined`）。\n\n![交叉引用](img/crossreference.png) 想要了解什么是块，请参阅第 5 章。然后，关于重新声明变量的坦诚讨论，请参阅第\
  \ 7 章。\n\n### 递增和递减运算符\n\nJava 有一些巧妙的小运算符，让生活变得更轻松（对于计算机处理器、你的大脑以及你的手指来说）。总共有四种这样的运算符——两个递增运算符和两个递减运算符。递增运算符加\
  \ 1，递减运算符减 1。递增运算符使用双加号（`++`），递减运算符使用双减号（`––`）。要了解它们如何工作，你需要示例。第一个示例在图 4-12 中。\n\
  \n图 4-13 显示了图 4-12 中程序的运行情况。在这个极度无聊的运行过程中，兔的数量（count）打印了三次。\n\n双加号有两个名称，取决于你把它放在哪里。当你将\
  \ `++` 放在变量之前时，`++` 被称为*前递增*运算符。（*前*代表*在……之前*。）\n\n![“图像包含一段带有详细注释的 Java 代码段。代码初始化了一个名为\
  \ numberOfBunnies 的整数变量为 27，并演示了前递增和后递增操作如何影响它的值。程序打印了三次变量的值，强调了由于递增操作，变量变为 28 然后变为\
  \ 29。”](img/9781394289240-fg0412.png)\n\n图 4-12: 使用前递增。\n\n![框内一列的三个数字：28, 29, 29。](img/9781394289240-fg0413.png)\n\
  \n图 4-13: 图 4-12 中代码的运行情况。单词 *before*（之前）有两个含义：\n\n*   你将 `++` 放在变量之前。\n*   计算机在语句的任何其他部分使用变量之前，先将变量的值加\
  \ 1。\n\n为了理解这一点，请看图 4-12 中的粗体行。计算机给 `numberOfBunnies` 加 1（将 `numberOfBunnies` 的值提高到\
  \ 29），然后打印 `29`。\n\n![记住](img/remember.png) 使用 `println(++numberOfBunnies)`，计算机在打印\
  \ `numberOfBunnies` 的新值之前先给 `numberOfBunnies` 加 1。\n\n前递增的备选方案是*后递增*。（*后*代表*在……之后*。）单词\
  \ *after*（之后）有两个含义：\n\n*   你将 `++` 放在变量之后。\n*   计算机在语句的任何其他部分使用变量之后，再将变量的值加 1。\n\
  \n要更清楚地了解后递增如何工作，请看图 4-14 中的粗体行。计算机在屏幕上打印 `numberOfBunnies` 的旧值（即 `28`），然后计算机给 `numberOfBunnies`\
  \ 加 1，将 `numberOfBunnies` 的值提高到 29。\n\n![图像显示了一个带有注释和输出的 Java 代码段。代码将整数变量 numberOfBunnies\
  \ 初始化为 27，并演示了后递增运算符 (++) 的影响。第一个打印语句输出 28，第二个打印语句在将 numberOfBunnies 增加到 29 的同时输出\
  \ 28，最后一个打印语句输出 29。这阐明了后递增运算符是如何工作的。](img/9781394289240-fg0414.png)\n\n图 4-14: 使用后递增。\n\
  \n![记住](img/remember.png) 使用 `println(numberOfBunnies++)`，计算机在打印 `numberOfBunnies`\
  \ 的旧值之后给 `numberOfBunnies` 加 1。\n\n图 4-13 是图 4-12 中代码的运行。单词 *before*（之前）有两个含义：\n\
  \n*   你将 `++` 放在变量之前。\n*   计算机在语句的任何其他部分使用变量之前，先将变量的值加 1。\n\n为了理解这一点，请看图 4-12 中的粗体行。计算机给\
