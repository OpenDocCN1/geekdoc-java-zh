  \ `;` 或在错误位置添加多余的分号。\n\n\n\n\n人们聚集在篝火旁，听一个关于老程序员的传说，说是因为她的懒惰让她陷入了麻烦。为了保持这位程序员的匿名性，我称她为\
  \ `Jane Pro`。Jane 花费了几个月的时间创造了计算领域的圣杯：一个能够独立思考的程序。如果完成，这个程序就可以独立运行，无需人类干预即可学习新概念。日复一日，夜夜复朝，Jane\
  \ Pro 努力为这个程序注入创造性、独立思考的火花。\n\n一天，当 Jane Pro 几乎完成项目时，她收到了来自她医疗保险公司的一封令困扰的邮件。不，邮件不是关于严重疾病的，而是关于一次常规的办公室就诊。保险公司的理赔表上有一个填写\
  \ Jane 出生日期的地方，仿佛她的出生日期自她上次提交理赔以来发生了变化一样。她心不在焉地写下 `2016` 作为出生年份，因此保险公司拒绝支付账单。\n\n\
  Jane 拨打了保险公司的电话。在 20 分钟内，她接通了人工电话。“对不起，”人工人员说，“要解决这个问题，您必须拨打另一个号码。”嗯，你可以猜接着发生了什么。“对不起。另一个接线员给了您错误的号码。”接着又是，“对不起。您必须拨回原始电话号码。”\n\
  \n五个月后，Jane 的耳朵隐痛，但在电话里拨打了 800 小时后，她终于得到了一个口头承诺，保险公司最终会重新处理该理赔。尽管她非常很高兴，但她急于回到她的编程项目。她还能记得那些代码原本是做什么的吗？\n\
  \n不，她记不住了。Jane 盯着自己的工作看看，就像第二天早上一个毫无意义的梦一样，代码对她来说完全没有意义。她写了百万行代码，但没有一行代码配有提供信息的解释性注释。她没有留下任何线索来帮助自己理解当时在想什么，因此她在沮丧中放弃了整个项目。\n\
  \n### 为你的代码添加注释\n\n`Listing 3-5` 包含了本章示例程序的增强版本。除了所有的关键字、标识符和标点符号外，`Listing 3-5`\
  \ 还有供人类阅读的文本。\n\n`LISTING 3-5` 三种注释\n\n```java\n/*\n* Listing 3-5 in \"Java For\
  \ Dummies, 9th Edition\"\n*\n* Copyright 2024 Wiley Publishing, Inc.\n* All rights\
  \ reserved.\n*/\n/**\n* This code adds 2 and 2.\n*\n* @author Barry Burd\n* @version\
  \ 1.0 6/24/24\n* @see java.io.IO\n*/\n\n/**\n* The main method is where execution\
  \ of the code begins.\n* This main method uses Java 23 preview features. These\n\
  * features might not be available in future Java releases.\n*/\nvoid main() {\n\
  \    println(2 + 2); // Replace 2 with Math.sqrt(2)\n}\n```\n\n`comment`（注释）是程序内部的一段特殊文本，其目的是帮助人们理解程序。注释是良好程序文档的一部分。\n\
  \nJava 编程语言三种注释：\n\n*   **传统注释：** `Listing 3-5` 的前六行构成了一个传统注释。注释以 `/*` 开始，以 `*/`\
  \ 结束。起始符号 `/*` 和结束符号 `*/` 之间的所有内容仅供人类阅读。编译器不会翻译关于 `\"Java For Dummies, 9th Edition\"\
  ` 或 `Wiley Publishing, Inc.` 的任何信息。\n\n    要了解编译器，请参见 `Chapter 2`。\n\n    `Listing\
  \ 3-5` 中的第二、三、四、五行有额外的星号（`*`）。我称它们为“额外的”，是因为在创建注释时并不需要这些星号。它们只是为了让注释看起来更漂亮。我在 `Listing\
  \ 3-5` 中包含它们，因为出于某种我不完全理解的原因，大多数 Java 程序员都会添加这些额外的星号。\n\n*   **行尾注释：** `Listing\
  \ 3-5` 中的文本 `//Replace 2 with Math.sqrt(2)` 是一个行尾注释。行尾注释以两个斜杠开始，一直到代码行的末尾。再次，编译器不会翻译行尾注释中的文本。\n\
  \n*   **Javadoc 注释：** Javadoc 注释以斜杠和两个星号（`/**`）开始。`Listing 3-5` 有两个 Javadoc 注释：一个以\
  \ `/** This code adds 2 and 2.` 开始，另一个以 `/** The main method is where execution\
  \ of the code begins.` 开始。\n\n\n\n\n\n多年来，我一直告诉学生要在代码中编写注释，但多年来，我一直在创建没有任何注释的示例代码（如列表\
  \ 3-1 中的代码）。为什么呢？\n\n三个简单的字：*了解你的受众*。当你编写复杂的、现实世界的代码时，你的受众是其他程序员、信息技术经理以及需要帮助解读你所做工作的人。当我为这本书编写简单的代码示例时，我的受众是你们——即初学者\
  \ Java 程序员。与其阅读我的注释，你最好的策略是盯着我的 Java 语句——即那些 Java 编译器能够解析的语句。这就是为什么我在书中的列表中只写了这么少的注释。\n\
  \n此外，我有点懒。\n\n### 使用注释来测试你的代码\n\n你可能会听到程序员谈论如何*注释掉*（commenting out）代码的某些部分。当你编写程序且某处运行得不正常时，尝试移除一些代码通常会有帮助。至少，你可以发现移除那段可疑代码后会发生什么。当然，你可能不喜欢代码删除后的结果，所以你不想完全删除代码。相反，你将普通的\
  \ Java 语句转换为注释。例如，你将该语句\n\n```\nprintln(2 + 2);\n```\n\n转换为注释\n\n```\n//println(2\
  \ + 2);\n```\n\n这种更改可以让你在尝试排查程序错误时，让 Java 编译器“看不见这些代码。\n\n当你尝试注释掉代码时，传统的注释可能会很棘手。大问题是你不能将一个传统注释嵌套在另一个注释内部。假设你想注释掉以下语句：\n\
  \n```java\nprintln(2 + 2);\nprintln(2 + 3);\n/*\n* 刻意显示在四行中\n*/\nprintln(2 + 4);\n\
  println(2 + 5);\n```\n\n如果你尝试将这段代码转换为一个传统的注释，你会得到下面的一团糟：\n\n```java\n/*\nprintln(2\
  \ + 2);\nprintln(2 + 3);\n/*\n* 刻意显示在四行中\n*/\nprintln(2 + 4);\nprintln(2 + 5);\n\
  */\n```\n\n第一个 `*/`（在 `Intentionally displays` 之后）过早地结束了传统注释。然后 `2 + 4` 和 `2 + 5`\
  \ 语句没有被注释掉，而最后一个 `*/` 则会让编译器报错。\n\n![Tip](img/tip.png) 大多数 IDE 都可以自动为你注释掉代码区域。从\
  \ IDE 的菜单栏中，选择 Code 或 Source，并查找与注释相关的菜单项。\n\n# 第 2 部分：编写你自己的 Java 程序\n\n在本部分中…………\n\
  \n*   创建新值并修改现有值。\n*   为你的应用程序逻辑添加决策机制。\n*   将重复作为解决问题的工具。\n\n# 第 4 章：充分利用变量及其值\n\
  \n在本章中\n\n![Bullet](img/check.png) **给事物赋值**\n\n![Bullet](img/check.png) **让事物存储特定类型的值**\n\
  \n![Bullet](img/check.png) **应用运算符获取新值**\n\n以下是 Van Doren 先生和 Barasch 先生之间的一段从未发生过的对话：\n\
  \n*   *Charles:* 海水虫吃掉了了自己的大脑，使自己从一种动物变成了植物。\n*   *Jack:* 你的你的最终答案吗，Charles？\n*\
  \   *Charles:* 是的。\n*   *Jack:* Charles，你今天账户里有多少钱？\n*   *Charles:* 我的支票账户里有 50\
  \ 美元 22 分。\n*   *Jack:* 那么，你最好给国税局打个电话，因为你关于海水虫的回答是正确的。你赢了一百万美元存入你的支票账户。Charles，你觉得怎么样？\n\
  *   *Charles:* 这全归功于诚实、勤奋和努力，Jack。\n\n这段对话的某些方面可以用 Java 的几行代码表示。\n\n### 改变变量\n\n\
  无论你是如何获得这百万美元的，你都可以使用变量来统计你的财富。列表 4-1 显示了代码。\n\n列表 4-1 使用变量\n\n```java\namountInAccount\
  \ = 50.22;\namountInAccount = amountInAccount + 1000000.00;\n```\n\n![Warning](img/warning.png)\
  \ 列表 4-1 中的代码并不是一个完整的 Java 程序。如果你尝试像运行第 3 章中的示例那样运行这段代码，将得到错误消息。关于完整的、可运行的程序，请参见列表\
  \ 4-2。\n\n列表 4-1 中的代码使用了 `amountInAccount` 变量。*变量*是一个位符。你可以将像 50.22 这样的数字放入变量中。在变量中放入一个数字后，你可以更改它。\n\
  \n\n\n\n\n`50.22` 和 `1000000.00` 有什么特别“字面化”的？嗯，想一下列表 4-1 中的变量 `amountInAccount`。变量\
  \ `amountInAccount` 在某些时候代表 50.22，但在其他时候它代表 10000050.22。你可以用 `number` 这个词来描述 `amountInAccount`。但实际上，`amountInAccount`\
  \ 代表什么取决于当时的表达方式。另一方面，50.22 在字面上就地代表数值 50![math](img/eq04001.png)。\n\n![贴士](img/tip.png)\
  \ 你可以在数字字面量中添加下划线。与其其在列表 4-1 中使用普通的旧的 `1000000.00`，不如写成 `amountInAccount = amountInAccount\
  \ + 1_000_000.00`。遗憾的是，你无法轻松做到你最想做的事。你不能写 `1,000,000.00`（就像你在美国那样写），也不能写 `1.000.000,00`（就像你在德国那样写）。如果你想在程序的输出中显示像如\
  \ `1,000,000.00` 这样的数字，你必须使用一些复杂的格式化技巧。有关关于格式化的更多信息，请查看第 7 章和第 12 章。\n\n### 赋值语句\n\
  \n像列表 4-1 中的语句被称为赋值语句。在`赋值语句`中，你为某个东西赋值。在很多情况下，这个东西是一个变量。\n\n我建议养成从右向左阅读赋值语句的习惯。图\
