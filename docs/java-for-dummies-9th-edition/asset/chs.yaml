  \ = 44;\n  myThing.display();\n  myThing2.display();\n}\n\npublic class MyThing\
  \ {\n  int value;\n  public void display() {\n}\n\npublic class MySubThing extends\
  \ MyThing {\n  @Override\n  public void display() {\n    System.out.println(\"In\
  \ MyThing, value is \" + value);\n  }\n}\n\npublic class MyOtherThing extends MyThing\
  \ {\n  @Override\n  public void display() {\n    System.out.println(\"In MyOtherThing,\
  \ value is \" + value);\n  }\n}\n```\n\n当你运行这段代码时会看到什么输出？\n\n\n\n```java\ncase PartTimeEmployee\
  \ pte -> pte.findPaymentAmount(50);\ncase PartTimeWithOver pto -> pto.findPaymentAmount(55);\n\
  ```\n\nJava 绝对鄙恶这种代码，并通过显示一条严厉的消息来警告你。Java：“标签被前面的 case 标签所支配”。为什么 Java 会这么说呢？我很高兴你这么问。\n\
  \n想一下 Listing 10-8 中的 `ptoEmployee` 对象。它是 `PartTimeWithOver` 类的实例。但 `PartTimeWithOver`\
  \ 类是 `PartTimeEmployee` 类的子类。因此，`ptoEmployee` 也是 `PartTimeEmployee` 类的实例。事实上，`ptoEmployee`\
  \ 是所有三个类的实例——`PartTimeWithOver`、`PartTimeEmployee` 和 `Employee`。Java 的 `switch`\
  \ 表达式从顶部的 case 向下查找匹配。（参见图 10-8）。因此，在“反转的再反转”中，`ptoEmployee` 对象匹配了 `PartTimeEmployee`\
  \ case，永远不会到达 `PartTimeWithOver` case。事实上，没有任何东西能到达 `PartTimeWithOver` case。`PartTimeWithOver`\
  \ case 是没用的，所以 Java 拒绝接受这段代码。\n\n这是另一个你可以用来破坏 Listing 10-8 中 case 表达式的办法。尝试删除最后一个\
  \ `Employee e` case。Java 的 `switch` 表达式无论你向它提供什么种 `Employee` 实例，都必须交付一个值。但列表主方法末尾附近的\
  \ `employee` 对象不匹配前三个 case 子句中的任何一个。因此，如果没有 `Employee e` case，Java 会大大不快的骚扰。\n\n\
  这种类型的 `switch` 表达式中的 cases 必须覆盖所有可能性。即使你删除了 Listing 10-8 中 `main` 方法的最后两个语句，Java\
  \ 也坚持要求有一个能够捕获 `new Employee()` 对象的 `case` 子句。\n\n![一张流程图展示了编程背景下的 switch 语句，专门处理不同类型的员工。switch\
  \ 语句检查员工对象的类型。第一个 case 检查员工是否为 FullTimeEmployee 不匹配。第二个 case 检查员工是否为 PartTimeEmployee\
  \ 并匹配了，执行了 findPaymentAmount(50) 方法。第三个 case 检查 PartTimeWithOver，被标记为不可到达。该图强调了第二个\
  \ case 捕获了类型为 PartTimeWithOver 的对象。](img/9781394289240-fg1008.png)\n\n图 10-8 并没有好事发生。\n\
  \n![提示](img/tip.png) 与其列出每一种可能性，你你可以偷懒并用 `default` 子句结束一个 `switch` 表达式。只要不要在 Listing\
  \ 10-8 中同时放入 `Employee` case 和 `default` 子句即可。Java 也会对此反抗。\n\n## 对天气做点什么\n\n这是我从一个读者那里收到的反馈：\n\
