  \ 展示了来自列表 11-4 代码的运行情况。该运行取决于图 11-1 中 `Hankies.txt` 文件的可用性。\n\n\n\n在这段糟糕的代码中，`main`\
  \ 方法创建了三个人，尝试询问他们是否参加会议，然后尝试启动会议。我运行这段代码得到的错误信息是“无法从静态上下文中引用非静态方法（Non-static method\
  \ cannot be referenced from a static context.）”。当我开始编写 Java 程序时，我反复梦见这个错误信息。我看到这个信息的频率是如此之，困惑的程度是如此彻底，以至于这个错误信息的记忆已经刻在了我的脑子里。\n\
  \n在这个 `Attendee` 类中，`main` 方法是静态的，但 `youAreHere` 和 `startMeeting` 方法不是静态的。（参见图 11-13）。因此，只有一个\
  \ `main` 方法，但 `areYouHere` 方法有三个版本，`startMeeting` 方法也有三个版本。当唯一的 `main` 方法尝试调用 `areYouHere()`\
  \ 时，Java 不知道该调用哪个实例的 `areYouHere` 方法。静态 `main` 方法尝试调用 `startMeeting()` 时也发生了同样的情况。在两种情况下，Java\
  \ 都说：“无法从静态上下文中引用非静态方法。”\n\n![“图像显示了‘Attendee 类’的类图，包含三个实例：person1、person2 和 person3。每个实例有两个方法：areYouHere()\
  \ 和 startMeeting()。在实例下方，有一个静态的 main 方法，它调用了 areYouHere() 和 startMeeting()，并附有注释询问指的是哪一个人。”](img/9781394289240-fg1113.png)\n\
  \nFIGURE 11-13: 这可不行。\n\n为了弄清楚谁参加了会议，你不是对着虚空对着某个特定的人提问“你在这里吗？”。相反，你应该按照名单上的人员，逐一询问他们“你在这里吗？”。因此，每次\
  \ `areYouHere` 调用都应该指向特定的参会者。\n\n相比之下，启动正式程序是一项单人的工作。你的代码应该只有一个 `startMeeting` 方法的副本，所以\
  \ `startMeeting` 应该是静态的。\n\n这里是经过适当修复后的代码：\n\n```\npublic class Attendee {\n   \
  \ public static void main(String args[]) {\n        var person1 = new Attendee();\n\
  \        var person2 = new Attendee();\n        var person3 = new Attendee();\n\
  \        person1.areYouHere();\n        person2.areYouHere();\n        person3.areYouHere();\n\
  \        startMeeting();\n    }\n    public void areYouHere() {\n        System.out.println(\"\
  I'm here.\");\n    }\n    public static void startMeeting() {\n        System.out.println(\"\
  Welcome, everyone.\");\n    }\n}\n```\n\n![技术细节](img/technicalstuff.png) `startMeeting`\
  \ 方法是 `Attendee` 类的静态成员。因此，你不仅调用 `startMeeting()`，还可以选择调用 `Attendee.startMeeting()`。当你想要从\
  \ `Attendee` 类外部的代码调用 `Attendee` 类的 `startMeeting` 方法时，这个 `Attendee` 前缀是必要的。（奇怪的是，像\
  \ `person1.startMeeting()` 这样的调用也有效，尽管我一直不理解那样调用静态方法有什么意义。）\n\n![试一试](img/tryitout.png)\
