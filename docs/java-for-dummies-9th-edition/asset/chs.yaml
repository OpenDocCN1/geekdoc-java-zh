  \n你向 `args` 参数发送单词的方式取决于你的 IDE，但通用思想取决于两个因素：\n\n*   **有许多运行程序的方法。**\n    每种方法都被称为一个运行配置。在不知的情况下，你可能一直在使用一个默认的、通用的运行配置来测试此书的示例程序。那个默认配置一直服务得很好。\n\
  \    但现在是时候改变了。一个运行配置包含了对几个不同问题的回答：哪个文件包含 `main` 方法？你将运行哪个版本的 Java？你驱动器上的哪些文件夹将被使用？`System.out`\
  \ 文本将出现在哪里？等等。\n\n*   **这些答案中的一个是程序参数。**\n    大多数 IDE 都有某种运行配置。当你选择它时，你会看到一个对话框。当你运行程序时，IDE\
