  \ IDE 是 `IntelliJ IDEA`，有时也简称为 `IntelliJ`，有时被称为 `IDEA`。制作 IntelliJ IDEA 的公司曾名为 `IntelliJ`。但在\
  \ 2003 年，该公司更名为 `JetBrains`。\n\n![Crossreference](img/crossreference.png) 如果你的电脑上没有\
  \ IntelliJ IDEA，可以在附录 A 中找到安装说明。你可以通过访问 [`http://www.dummies.com/go/javafd9e`](http://www.dummies.com/go/javafd9e)\
  \ 找到该附录。\n\n## 安装 JavaFX 插件\n\n为了确保 IntelliJ 可以创建 JavaFX 应用，你需要 IntelliJ 的 JavaFX\
