  \n### 税收减免\n在第 7 章中，你创建了一个 `Organization` 类。你的 `Organization` 类每个实例都有名称、年度收入金额和一个\
  \ `boolean` 值，指示该组织是营利组织还是非营利组织。\n\n创建一个新的 `Organization2` 类。这个新类的实例只有名称和年度收入金额。创建两个子类：将它们称为\
  \ `ProfitMakingOrganization` 类和 `NonProfitOrganization` 类。营利组织支付其收入的 10% 作为税，而非营利组织仅支付收入的\
  \ 2% 作为税。\n\n编写一个 `main` 方法，在创建 `ProfitMakingOrganization` 实例和 `NonProfitOrganization`\
  \ 实例的同时，也显示每个实例的信息，包括组织支付的税额。\n\n## 仅修改部分员工的支付金额\n你敢信吗！人力资源部的某个脑筋简单的人为你其中一名兼职员工提供了加班双倍工资。现在消息传开了，其他一些兼职人员也想在他们加班工作时获得双倍工资。如果这种情况持续下去，你最终会破产，因此你需要向所有兼职员工发送一份备忘录，解释为什么赚更多钱对他们没有好处。\n\
  \n与此同时，你有两种兼职员工——获得加班双倍工资的人和没有获得的人——所以你需要修改你的薪资结算软件。你有哪些选择？\n\n*   嗯，你可以直接深入 `PartTimeEmployee`\
  \ 类代码，进行一些更改，并寄希望于运气。（这可不是个好主意！）\n*   你可以遵循上一节的建议，为现有的 `PartTimeEmployee` 类创建一个子类。“但是等等，”你说，“现有的\
  \ `PartTimeEmployee` 类已经有一个 `findPaymentAmount` 方法了。我需要为每个获得加班双倍工资的员工寻找某种巧妙的方法来绕过这个现有的\
  \ `findPaymentAmount` 方法吗？”\n\n    到此时，你可以感谢自己幸运了，因为你正在使用 Java 进行面向对象编程。通过面向对象编程，你可以创建一个覆盖其父类功能的子类。列表\
  \ 10-6 正好就有这样一个子类。\n\n列表 10-6 另一个子类\n\n```java\npublic class PartTimeWithOver extends\
  \ PartTimeEmployee {\n    @Override\n    public double findPaymentAmount(int hours)\
  \ {\n        if (hours <= 40) {\n            return getHourlyRate() * hours;\n \
  \       } else {\n            return getHourlyRate() * 40 + getHourlyRate() * 2\
  \ * (hours - 40);\n        }\n    }\n}\n```\n\n图 10-4 显示了列表 10-6 中的代码与本章其他代码片段之间的关系。特别是，`PartTimeWithOver`\
  \ 是子类的子类。在面向对象编程中，这种链完全并不罕见。事实上，作为子类来说，这个链相当短。\n\n![“一张阐明了不同类型员工之间继承关系的类图。图显示了一个标记为‘Employee’的顶层类，它有两个子类：‘FullTimeEmployee’和‘PartTimeEmployee’。此外，“PartTimeEmployee’还有一个标记为‘PartTimeWithOver’的进一步子类。该图描绘了这些员工类型在面向对象编程背景下的层级结构。”](img/9781394289240-fg1004.png)\n\
