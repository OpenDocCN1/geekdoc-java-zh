  \ `someObject.doSomething(someExtraInformation)` 的内容。\n\n\n\n\n这一章节令我印象深刻（这也是我至今仍记忆清晰的原因）的是威尔逊先生在做决定时那种执着的决心。这家伙人并没有在处理日常事务，在社区里闲逛，一边让决定的思绪在脑海中进来出出。他静静地坐在院子里，在心理资产负债表上仔细且有逻辑地做着标记。到底有多少人是这样做决定的呢？\n\
  \n那时，我还很年轻。我从未面对过做出影响我和家人的重大决定的责任。但我好奇这样的决策过程会是什么样的。像个木桩一样坐上几个小时会有帮助吗？我会通过对选项进行仔细权衡和计数来做决定吗？还是会盲目摸索、冒险并凭冲动行动？只有时间能给出答案。\n\
  \n## 做出决定（Java if 语句）\n\n当你编写计算机程序时，你不断地遇到道路的叉路口。用户正确输入密码了吗？如果是，让用户继续；如果不是，就把那个混蛋踢出去。因此，Java\
  \ 编程语言需要一种让程序分支到两个方向之一的方法。幸运的是，这种语言有一种方法：它被称为 `if` 语句。\n\n### 猜数字\n\n列表 5-1 展示了\
  \ `if` 语句的使用。列表 5-1 中程序的两次运行结果在 图 5-1 中。\n\n![“图像显示了猜数字游戏的两个实例。在第一个实例中，玩家选择了数字 10\
  \ 但输了，因为随机数是 7。在第二个实例中，玩家选择了数字 2 并赢了。获胜信息被星号包围。”](img/9781394289240-fg0501.png)\n\
  \n图 5-1: 猜游戏的两次运行。\n\n列表 5-1 一个猜数字游戏\n\n```\nvoid main() {\n    String input = readln(\"\
  Pick a number from 1 to 10: \");\n    int inputNumber = Integer.parseInt(input);\n\
  \    int randomNumber = new Random().nextInt(10) + 1;\n    if (inputNumber == randomNumber)\
  \ {\n        println(\"**********\");\n        println(\"*You win.\");\n       \
  \ println(\"**********\");\n    } else {\n        println(\"You lose.\");\n    \
  \    print(\"The random number was \");\n        println(randomNumber + \".\");\n\
  \    }\n    println(\"Thank you for playing.\");\n}\n```\n\n列表 5-1 中的程序与用户玩猜数字游戏。程序从用户处获取一个数字（一个猜测），然后生成一个\
  \ 1 到 10 之间的随机数。如果用户输入的数字与随机数相同，用户就了。否则，用户输了，程序会告诉用户随机数是多少。\n\n### 她控制了键盘按键\n\n\
  在 列表 5-1 中，这一行\n\n`String input = readln(\"Pick a number from 1 to 10: \");`\n\n\
  执行了三件事：\n\n1. 它在用户的屏幕上显示 `Pick a number from 1 to 10:` 单词。\n2. 它等待用户输入一些字符并按回车键。\n\
  3. 在用户按回车后，它让变量 `input` 指向用户输入的字符。\n\n那么，图 5-1 中的第一行发生了什么？在那行上，Java 让 `input` 指向\
  \ `\"10\"`。\n\n等一下！在最后句话的末尾，为什么字符 `10` 周围有引号？引号表示，正如其名称暗示的那样，变量 `input` 指的是一个字符字符串。Java\
  \ 的 `readln` 方法始终将用户的输入解释为字符字符串。这就是为什么 列表 5-1 以 `String input` 开头。\n\n列表 5-1 中的第三条语句生成了一个\
  \ 1 到 10 之间的随机数。（如果你不信我，可以看 第 4 章 中关于 Java `Random` 类的章节。）总之，`Random` 类的 `nextInt`\
  \ 方法始终给你一个 `int` 值。在代码的后面，我们必须比较两个东西：用户输入的内容（这是一个 `String` 实例）以及 `Random` 给我们的数字（这是一个\
  \ `int` 值）。\n\n在某些语言中，你可以询问 `input` 是否等于 `randomNumber`。但 Java 对这类事情很挑剔。在 Java 中，你不能拿\
  \ `String` 苹果和 `int` 橙子比较。你必须比较字符串与字符串，或者 `int` 值与 `int` 值。因此，在 列表 5-1 中，`if (inputNumber\
  \ == randomNumber)` 行比较的是两个 `int` 值。`Random` 类的 `nextInt` 方法始终给你一个 `int` 值。在代码的后面，我们必须比较两个东西：用户输入的内容（这是一个\
  \ `String` 实例）以及 `Random` 给我们的数字（这是一个 `int` 值）。\n\n### if 语句\n\n列表 5-1 的核心是一个 Java\
  \ `if` 语句。这个 `if` 语句代表了道路的叉路口。（参见 图 5-2）。计算机遵循两个分支：打印 `You win` 的分支或打印 `You lose`\
  \ 的分支。计算机通过测试条件的真假来决定走哪条分支。在 列表 5-1 中，被测试的条件是 `inputNumber == randomNumber`。当条件为真时，计算机执行条件和\
  \ `else` 之间的内容。当条件为假时，计算机执行 `else` 之后的内容。无论如何，计算机都会继续执行最后一个 `println` 调用，显示 `Thank\
  \ you for playing`。\n\n![记住](img/remember.png) `if` 语句中的条件必须包含在括号内。然而，像 `if (inputNumber\
  \ == randomNumber)` 这样的行并不是一个完整的语句（就像“如果我有锤子”不是一个完整的句子一样）。因此，这一行 `if (inputNumber\
  \ == randomNumber)` 不应该以分号结尾。\n\n\n\n\n\n![技术细节](img/technicalstuff.png) 有时，当我编写关于正在测试的条件的内容时，我会不小心地使用\
  \ `expression`（表达式）而不是 `condition`（条件）。这没关系，因为每个条件都是一个表达式。表达式是一个具有值的东西，而确实，每个条件都有一个值。条件的值要么是\
  \ `true` 要是 `false`。（有关表达式以及 `true` 和 `false` 等值的信息，请参见第 4 章）。\n\n### 等于，等于相等\n\n\
  在列表 5-1 中，在 `if` 语句的条件中，注意双等号的使用。比较两个数字以判断它们是否相同，与将某个值设置为另一个值不是一回事。这就是为什么比较相等性的符号与赋值或初始化中使用的符号不同。在\
  \ `if` 语句的条件中，你不能将双等号替换为单等号。如果你这样做了，你的程序将无法运行。（当你尝试编译代码时，几乎总是会收到错误消息。）\n\n另一方面，如果你从不在条件中使用单等号这种错误，那你就不正常了。几年前，当我教一门\
  \ Java 入门课程时，我承诺如果任何一次实验课期间没有人犯下单等号错误，我就吞下我的激光笔。这并不是空头承诺。我知道我永远不需要履行它。事实证明，即使我忽略了实验课期间任何人前十次犯下的单等号错误，我依然不会用掉激光笔。在编程生涯中，每个人都会误用几次单等号。\n\
  \n![提示](img/tip.png) 诀窍不在于避免犯下单等号错误；诀窍在于每当你犯错时都能发现它。\n\n### 准备好大括号\n\n列表 5-1 中的\
  \ `if` 语句有两个部分：上半部分和下半部分。我为 `if` 语句的这两个部分取了名字。我把它们称为 `if part`（上半部分）和 `else part`（下半部分）。\n\
  \n列表 5-1 中的 `if part`似乎包含多个语句。我通过将 `if part` 的三个语句封装在一对大括号中来实现这一点。当我这样做时，形成了一个 `block`（块）。一个\
  \ `block` 是由一对大括号紧凑在一起的一组语句。\n\n通过这个块，三次 `println` 调用被安全地安插在 `if part` 内部。有了大括号，星号行和\
  \ `You win` 单词只有在用户猜对数字时才会显示。\n\n这种关于块和大括号的机制同样适用于 `else part`。在列表 5-1 中，每当 `inputNumber`\
  \ 不等于 `randomNumber` 时，计算机就会执行三次 `print/println` 调用。为了让计算机相信所有三个都在 `else` 子句内部，我将这些调用放入一个块中。也就是说，我将这三个调用封装在一对大括号中。\n\
  \n![技术细节](img/technicalstuff.png) 严格来说，列表 5-1 在 `if` 和 `else` 语句之间只有一个语句，在 `else`\
  \ 语句之后也只有一个语句。诀窍在于，当你把一组语句放在大括号内时，你就得到了一个块；而一个块在各方面的行为都像一个单一语句。事实上，Java 官方文档将块列为许多类型语句中的一种。因此，在列表\
  \ 5-1 中，打印 `You win` 和星号的块是一个单一语句，其内部包含了三个较小的语句。\n\n### 你的缩进意图\n\n注意看在列表 5-1 中，`if`\
  \ 语句内部的 `print` 和 `println` 调用是缩进的。（这包括 `You win` 和 `You lose` 语句。跟在 `else` 单词后面的\
  \ `print` 和 `println` 调用仍然是 `if` 语句的一部分。）严格来说，你不必对 `if` 语句内部的语句进行缩进。对于编译器来说，你可以把整个程序写在一行里，或者将所有语句放置在一种巧妙的、形状扭曲的\
  \ Z 字形折线中。问题在于，如果你不以某种逻辑方式缩进语句，你和其他任何人都无法理解你的代码。在列表 5-1 中，`print` 和 `println` 语句的缩进有助于你的眼睛（以及大脑）快速看出这些语句是隶于整个\
  \ `if/else` 流程的。\n\n在小型程序中，未缩进或缩进不当的代码尚可接受。但在复杂的程序中，不遵循整洁逻辑模式的缩进是一个巨大的、丑陋噩梦。\n\n\
  ![记住](img/remember.png) 许多 Java IDE 都有自动缩进代码的工具。在你喜欢的 IDE 中，寻找如 Source ⇒   Format\
  \ 或 Code ⇒   Reformat Code 等菜单。\n\n![警告](img/warning.png) 写 `if` 语句时，你可能会放弃所有关于大括号的规则，仅仅依赖缩进。这种策略在其他编程语言（如\
  \ Python 和 Haskell）中有效，但在 Java 中并不行。如果你在 `else` 单词后缩进了三个语句，却忘记将这些语句封装在大括号中，计算机会认为\
  \ `else` 部分仅包含三个语句中的第一个。更糟糕的是，缩进会误导你认为 `else` 部分包含了所有三个语句。这让你更难弄清楚为什么代码没有按照你预期的那样运行。注意那些大括号！\n\
  \n### 赫尔辛基的“没有 else”\n\n好吧，这一节的标题是编出来的。大不了不了！其核心思想是你可以创建一个不带 `else` 部分的 `if` 语句。例如，之前显示的列表\
  \ 5-1 中的代码。也许你更想在用户输掉的时候炫耀一下。列表 5-2 中修改后的代码展示了如何这样做（并参见图 5-3）。\n\n![图像显示了两次游戏实例。在第一次中，玩家猜了数字\
  \ 3，但随机数是 5。在第二次中，玩家猜了 9 并贏了，因为随机数也是 9。两次都包含了消息：‘从 10 中选一个数字：’、‘猜得好’、‘随机数是’和‘感谢参与。’第二次在猜对数字后还有‘赢了。’](img/9781394289240-fg05)\n\
  \n图 5-3：列表 5-2 中的两次运行。\n\n```\nvoid main() {\n  String input = readln(\"从 10 中选一个数字：\
  \ \");\n  int inputNumber = Integer.parseInt(input);\n  int randomNumber = new Random().nextInt(10)\
  \ + 1;\n  if (inputNumber == randomNumber) {\n    println(\"*You win.*\");\n  }\n\
  \  println(\"That was a very good guess \\uD83D\\uDE00\");\n  print(\"The random\
  \ number was \");\n  println(randomNumber + \".\");\n  println(\"Thank you for playing.\"\
  );\n}\n```\n\n列表 5-2 中的 `if` 语句没有 `else` 部分。当 `inputNumber` 与 `randomNumber` 相同时，计算机打印\
  \ `You win`。当 `inputNumber` 不等于 `randomNumber` 时，计算机就不打印 `You win`。\n\n注意列表 5-3\
  \ 中间部分看起来晦涩的代码 `\\uD83D\\uDE00`。那是 Java 对笑脸表情的 Unicode 表示。你可以在图 5-3 中看到结果。截至 2024\
  \ 年 3 月，Java 的 Unicode 实现包含了可以用 16 位表示的 65,536 个字符，以及额外的 84,277 个被称为*代理*（surrogates）的字符。你甚至可以在\
  \ Java 代码的变量名中使用 Unicode 字符。（参见图 5-4）。\n\n\n\n\n\n![“一段用希伯来语编写的 Java 代码片段。代码声明了三个整数变量，为其中两个赋值了值，计算了前两个变量的和并赋值给第三个变量。然后它打印了一个希伯来语字符串，随后是第三个变量的值。”](img/9781394289240-fg0504.png)\n\
  \n图 5-4: 从右向左的文本遇到从左向右的文本。\n\n![提示](img/tip.png) 你可以通过访问[`https://unicode.org/emoji/charts/full-emoji-list.html`](https://unicode.org/emoji/charts/full-emoji-list.html)\
  \ 查看表情符号官方列表。\n\n## ERRARE NECESSE EST UT RECTE FACIAS\n\n![尝试一下](img/tryitout.png)\
  \ 这个实验包含三个部分：\n\n* 找出在运行列表 5-1 中的代码并输入三点半的十进制表示（`3.5` 或 `3,5`，或其他取决于你国家的标准）时会发生什么。\n\
  \n* 找出在运行列表 5-1 中的代码并输入一个空格后跟数字 `7`时会发生什么。\n\n* 如下修改列表 5-1 中的一行代码：\n\n  ```\n  int\
  \ inputNumber = Integer.parseInt(input.trim());\n  ```\n\n  运行修改后的代码并输入一个空格后跟数字\
  \ `7`。\n\n### 你是如何写小数的？\n\n运行以下程序：\n\n```java\nvoid main() {\n  String input = readln(\"\
  What's the value of pi? \");\n  double pi = Double.parseDouble(input);\n  println(\"\
  Thanks!\");\n}\n```\n\n它是显示了 `Thanks!` 还是给了你一个错误消息？如果你收到错误消息，你国家表示小数的方式可能与我在书中表示小数的方式不同。与其输入\
  \ `3.14`，请尝试输入 `3,14` 或你通常使用的某种变体。\n\n### 直言\n\n在第 4 章中，列表 4-5](#c04.xhtml_c04-fea-0007)告诉你你是否能将十个人挤进电梯。列表代码的运行看起来像这样：\n\
  \n```\nTrue or False?\nYou can fit all ten of the\nBrickenchicker decuplets\non\
  \ the elevator:\nfalse\n```\n\n利用你对 Java `if` 语句的知识，让程序的输出更自然。根据程序变量 `elevatorWeightLimit`\
  \ 的值，输出应该是：\n\n```\nYou can fit all ten of the\nBrickenchicker decuplets\non the\
  \ elevator.\n```\n\n或者\n\n```\nYou can't fit all ten of the\nBrickenchicker decuplets\n\
  on the elevator.\n```\n\n## 使用比较运算符和逻辑运算符形成条件\n\nJava 编程语言有许多小符号和标记来满足你的各种条件需求。本节将为你介绍它们的所有信息。\n\
  \n### 比较数字；比较字符\n\n表 5-1 向你展示了用于比较一个值与另一个值的运算符。\n\n| 运算符符号 | 含义 | 示例 |\n| --- |\
  \ --- | --- |\n| `==` | 等于 | `numberOfCows == 5` |\n| `!=` | 不等于 | `buttonClicked\
  \ != panicButton` |\n| `<` | 小于 | `numberOfCows < 5` |\n| `>` | 大于 | `myInitial\
  \ > 'B'` |\n| `<=` 小于等于 | `numberOfCows <= 5` |\n| `>=` | 大于等于 | `myInitial >= 'B'`\
  \ |\n\n表 5-1 比较运算符\n\n你可以使用 Java 的所有比较运算符来比较数字和字符。当你比较数字时，情况完全按照你预想的那样进行。但当你比较字符时，情况就有点奇怪。比较彼此的大写字母没有问题。因为字母\
  \ *B* 在字母表上排在 *H* 之前，所以条件 `'B' < 'H'` 是真的。比较彼此的小写字母也可以的。奇怪的是，当你比较大写字母和小写字母时，大写字母总是更小。所以，即使\
  \ `'Z' < 'A'` 是 `false`，但 `'Z' < 'a'` 是 `true`。\n\n![技术细节](img/technicalstuff.png)\
  \ 在底层，字母 *A* 到 *Z* 使用数字代码 65 到 90 存储。字母 *a* 到 *z* 使用代码 97 到 122 存储。这就是为什么每个大写字母都比每个小写字母小。\n\
  \n![警告](img/warning.png) 两个数字是否相等（使用 `==`）或不相等（使用 `!=`）时要小心。在你进行一些计算并获得两个 `double`\
  \ 值或两个 `float` 值之后，你国家表示小数的方式可能与我在书中表示小数的方式不同。与其输入 `3.14`，请尝试输入 `3,14` 或你通常使用的某种变体。\n\
  \n### 比较对象\n\n当你开始处理对象时，不要使用双等于。双等于会询问：“这个字符串存储在同一个地方吗？”通常这不是你想要的。相反，你通常想问：“这个字符串包含相同的字符吗？”为了提第二个问题，Java\
  \ 的 `String` 类型有一个名为 `equals` 的方法。关于 `equals` 的示例，请参见列表 5-3](#c05.xhtml_c05-fea-0004)。\n\
  \n图 5-5: 使用 `==` 和使用 Java `equals` 方法的结果。\n\n列表 5-3 检查密码\n\n```java\nvoid main()\
  \ {\n  String password = readln(\"What's the password? \");\n  println(\"You typed\
  \ >>\" + password + \"<<\");\n  println(\"\");\n\n  if (password == \"swordfish\"\
  ) {\n    println(\"\"\"\n    你输入的单词存储在与真实密码\n    相同的同一个地方。你一定是个黑客。\"\"\");\n  }\
  \ else {\n    println(\"\"\"\n    你输入的单词并没有存储在与真实密码\n    相同的同一个地方，但并不是大问题。\"\"\"\
  );\n  }\n\n  println(\"\");\n\n  if (password.equals(\"swordfish\")) {\n    println(\"\
  \"\"\n    你输入的单词与真实密码具有相同的字符。\n    你可以使用我们的宝系统。\"\"\");\n  } else {\n    println(\"\
  \"\"\n    你输入的单词与真实密码具有相同的字符。\n    你不能使用我们的宝系统。\"\"\");\n  }\n}\n```\n\n\n\n\n两种技术中更合适的是使用\
  \ Java 的 `equals` 方法。`equals` 方法看起来很奇怪，因为当你调用它时，你会在一个字符串后面加一个点，并将另一个字符串放在括号里。但你必须这样做。\n\
  \n等等！`Integer.parseInt` 又是什么？我在 Listing 5-1 中使用它时对此大做了一番。为什么在 Listing 5-3 中你不需要\
  \ `Integer.parseInt` 呢？为了回答这个问题，请看 Listing 5-3 中的变量类型。由于 `readln` 产生一个 `String`\
  \ 实例，`password` 变量的类型与 `\"swordfish\"` 字面量类型是相同的。这一点通过 Listing 5-3 开头的 `String password`\
  \ 单词得到了强化。在 Listing 5-3 中，没有理由将任何内容转换为数值。（事实上，调用 `Integer.parseInt` 将 `password`\
  \ 转换为数字是一个非常糟糕的主主意。）\n\n在调用 Java 的 `equals` 方法时，哪个字符串后面加点、哪个字符串放在括号里并不重要。例如，在 Listing\
  \ 5-3 中，你可以这样写：\n\n```java\nif (\"swordfish\".equals(password))\n```\n\n该方法的工作效果同样良好。\n\
  \n调用 Java 的 `equals` 方法看起来不平衡，但事实并非如此。点和括号之间这种表面上的不平衡背后是有原因的。其核心思想是你有两个对象：`password`\
  \ 对象和 `\"swordfish\"` 对象。这两个对象的类型都是 `String`。（不过，`password` 是一个类型为 `String` 的变量，而\
  \ `\"swordfish\"` 是一个 `String` 字面量。）当你写 `password.equals(\"swordfish\")` 时，你正在调用属于\
  \ `password` 对象的 `equals` 方法。当你调用该方法时，你正将 `\"swordfish\"` 作为方法的参数传递给它（这里是个双关）。你可以在第\
  \ 7 章中阅读更多关于属于对象的方法的内容。\n\n![Tip](img/tip.png) 除了 `equals` 方法，Java 还有一个 `equalsIgnoreCase`\
  \ 方法。尽管 `\"SWORDFISH\".equals(\"swordfish\")` 为 `false`，但它的近亲 `\"SWORDFISH\".equalsIgnoreCase(\"\
  swordfish\")` 为 `true`。\n\n![Warning](img/warning.png) Listing 5-3 中的代码在 `if` 语句方面表现良好，但在真实世界的用户验证方面表现糟糕。首先，永远不要明文显示密码（不使用星号掩盖密码）。第二，不要在不加密的情况下处理密码。第三，不要在代码中放置密码。第四……嗯，我可以一直说下去。Listing\
  \ 5-3 中的代码并不是为了说明良好的用户名/密码实践。\n\n### 当单行还不够时\n\n*文本块*（text block）是一组两边都被三个双引号（`\"\
  \"\"`）包围的文本。\n\n```java\nprintln(\"\"\"\"\"\"\n你输入的单词与真实密码\n存储在同一个位置。你一定是个黑客.\"\"\
  \"\");\n```\n\n文本块以三个双引号开头，且该块第一行的剩余部分必须留空。如果你错误地在最初三个双引号后放置非空文本，Java 将会感到胃翻倒覆：\n\
  \n```java\n// 不要这样做：\nprintln(\"\"\"你输入的单词存储在\n与真实密码\n相同的位置。你一定是个黑客.\"\"\");\n```\n\
  \n这个关于在最初三个双引号后只允许留空格的规则有助于解决缩进问题。看以下代码：\n\n```java\nprintln(\"\"\"\nI. 控制程序流\n\
  A. 引言\nB. 决策\n1\\. 猜数字\n2\\. 等于，相等\nC. 构建条件\"\"\");\n```\n\n由于 `I. Controlling Program\
  \ Flow` 行具有巨大的 21 字符缩进，代码的输出如下：\n\n```text\nI. 控制程序流\nA. 引言\nB. 决策\n1\\. 猜数字\n2\\\
  . 等于，相等\nC. 构建条件\n```\n\n文本块之所以有用，是因为块内部的文本可以跨越多个行。如果没有文本块，你可能会忍不住在每个末端都放一个引号，但那行不通。以下代码使用了传统的\
  \ Java 字符串表示法，这是禁止的：\n\n```java\n// 这段代码是错误的：\nprintln(`\"\n你输入的单词存储在\n与真实密码\n相同的位置。你一定是个黑客.\"\
  \"\");\n```\n\n这本书第七版于 2017 年上市，当时 Java 还没有文本块。在那个版本中，Listing 5-3 包含了大量的……\n\n*(注：由于提供的文本存在大量重复和合并部分，此处已根据要求进行了清理和核心翻译。)*\n\
  \n\n\n\n![Tip](img/tip.png) 如果你想看起来像个有经验的 Java 程序员，就不要模仿代码列表 5-4 中的代码。首先，代码列表 5-4\
  \ 中的缩进和换行是不寻常的。我这样写 `if`语句是为了让你更容易看到语句各个部分之间的关系，但专业的 Java 程序员会对这种格式大之反感。除了奇怪的缩进，@代码列表\
  \ 5-4 使用了过时的 `JOptionPane` 类来在计算机屏幕上显示窗口。现代 Java 程序已经避开了 `JOptionPane` 和其他 `javax.swing`\
  \ 类，转而使用一种名为 JavaFX 的平台。我使用 `JOptionPane` 是因为它适合像代码列表 5-4 中这样的小型单窗口程序。但对于复杂的桌面设计，`JavaFX`\
  \ 要好得多。关于 JavaFX 的详细信息，请参阅第 16 章。\n\n### 傻瓜万岁！\n\n*For Dummies* 系列书籍的法语译名为 *Pour\
  \ les Nuls.*。所以英语中的“dummy”在法语里是“nuls”。^(*)但在 Java 中，`null` 一词意思是“无”。当你看到\n\n```\n\
  if (username != null)\n```\n\n在代码列表 5-4 中时，你可以想象你看到的是\n\n```\nif (username isn't\
  \ nothing)\n```\n\n或者\n\n```\nif (username has any value at all)\n```\n\n要了解用户名为什么可以没有值，请查看图\
  \ 5-6 的最后一行。当你点击第一个对话框中的 `Cancel` 时，计算机会将 `null` 传递给你的程序。因此，在代码列表 5-4 中，变量 `username`\
  \ 变成了 `null`。比较表达式 `username != null` 的作用是确保你没有点击程序第一个对话框中的 `Cancel`。比较表达式 `password\
  \ != null` 对程序的第二个对话框执行同样的检查。当你看到代码列表 5-4 中的 `if` 语句时，你可以想象你看到的是图 5-7 中的条件。\n\n\
