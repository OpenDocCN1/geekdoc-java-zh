  \ 提供的'JavaFX'插件被选中并已安装，用蓝色勾选和'Disable'按钮指示。右面板提供了有关所选'JavaFX'插件的详细信息，包括其版本（捆 242.21829.142）、功能和集成能力。窗口底部提供'Cancel'、'Apply'或'OK'选项。”](img/9781394289240-fg1601.png)\n\
  \nFIGURE 16-1: IntelliJ 设置对话框的 Plugins 插件选项。\n\n## 安装 Scene Builder\n\n想象你正站在卢浮宫，看着《蒙娜丽莎》。你并不会想：“达芬奇画了一个脸，然后他在脸上画了一个微笑，接着画了一个身体，然后画了背景。”绘画并不是从一个动作进展到另一个动作。相反，这幅画就在那里。\n\
  \n同样，你不需要在 GUI 程序的窗口中逐一个地添加文本字段和按钮。相反，你只需要描述窗口的元素。你可以说：“当窗口完全渲染完成后，它应该是这个样子。”然后你可以让\
  \ Java 决定采取哪些步骤来显示窗口元素。\n\n那么，如何描述应用程序窗口的元素呢？你可以像程序员通常做的那样——在代码编辑器中输入大量文本。但有一种更好的方法。你描述视觉元素最自然的方法就是“画”出它们。\n\
  \n如果有一种方法让你画出一个应用程序窗口，并让计算机将你的画转换为 Java 可以解释的代码会怎样？\n\n是的！有办法这样做。使用一个名为 Scene Builder\
  \ 的应用程序，你可以用鼠标绘制窗口组件。Scene Builder 会自动将你的视觉描述转换为代码。\n\n安装 Scene Builder 就像安装大多数软件一样。以下是操作方法：\n\
  \n1. **访问** [`http://gluon.com/products/scene-builder`](http://gluon.com/products/scene-builder)。**\n\
  2. **点击 Download 按钮。**\n3. **点击对应你操作系统的按钮（Windows、Mac 或 Linux）。**\n4. **运行安装程序。**\
  \ 在我的 Windows 电脑上，路径是 `C:\\Users\\burd\\AppData\\Local\\SceneBuilder`。在 Mac 上，将\
  \ Scene Builder 图标拖到 `/Applications`。大功告！你安装好了 Scene Builder。\n\n### 创建基础 JavaFX\
  \ 项目\n\n在安装了 JavaFX 插件和 Scene Builder 后，你就可以通过点击和按键创建 GUI 应用程序。以下是步骤：\n\n1. **遵循前面的章节“设置你的电脑”中的说明。**\n\
  2. **从 IntelliJ 的菜单栏中，选择 `File` ⇒   `New` ⇒   `Project`。**\n3. **在对话框列表中选择 JavaFX。（参考图\
  \ 16-2）。**\n4. **在新项目对话框的主体中，为你的项目输入名称。**\n5. **点击对话框底部的 Next。**\n6. **点击对话框底部的\
  \ Create。**\n\n无论如何，IntelliJ 都会向你显示一个包含全新 JavaFX 项目的窗口。（参见图 16-3）。\n\n\n\n\n\n![“集成开发环境\
  \ (IDE)中‘新项目’窗口的截图。该窗口允许创建一个名为‘MyJavaFXProject’的新 JavaFX 项目。它包含了项目位置（设置为‘~/IdeaProjects’）、语言选择（Java,\
  \ Kotlin, Groovy）、构建系统（Maven, Gradle）、组 ID（‘com.example’）、制品 ID（'MyJavaFXProject’）和\
  \ JDK 版本（jbr-17 JetBrains Runtime 17.0.12）字段。左侧边栏列出了各种项目类型和生成器，例如 Java, Kotlin,\
  \ Groovy, Jakarta EE, Spring Boot, JavaFX, Quarkus, Micronaut, Ktor, Compose for\
  \ Desktop, HTML, React, Express, Angular CLI, Vue.js 和 Vite。”](img/9781394289240-fg1602.png)\n\
  \nFIGURE 16-2: 新项目对话框。\n\n![“集成开发环境 (IDE)窗口显示了一个名为‘MyJavaFXProject’的 Java 项目。左侧的项目结构包含了目录和文件，如\
  \ HelloApplication.java、HelloController.java 和 hello-view.fxml。主编辑器面板显示了 HelloApplication.java\
  \ 的内容，其中包含一个扩展 Application 的 JavaFX 类。代码定义了一个 start 方法，它通过从名为‘hello-view.fxml’的\
  \ FXML 文件加载场景来设置主阶段，并有一个调用 launch() 来启动程序的 main 方法。”](img/9781394289240-fg1603.png)\n\
  \nFIGURE 16-3: 一个新的 JavaFX 项目。\n\n### 运行你的空骨架 JavaFX 项目\n\n在上一节中，你使用 IntelliJ IDEA\
  \ 创建了一个 JavaFX 项目。以下是该 JavaFX 项目中三个文件的简要概述：\n\n*   `HelloApplication.java`: 此文件包含两个启动程序的方法。其中一个是无处不在的\
  \ `main` 方法。另一个是名为 `start` 的方法。\n\n    `start` 方法设置了你的 JavaFX 程序的初始脚手架。特别：\n\n \
  \   *   此方法调用了 `Scene` 构造函数。`scene` 是用户屏幕上任何时刻出现的所有项目的列表。例如，场景可能包含一个带有文本字段和按钮的列。\n\
  \n    *   JavaFX 在用户屏幕上放置了一个名为 `stage` 的新窗口。`start` 方法将场景与此新窗口连接起来。然后，语句 `stage.show()`\
  \ 就会让这个窗口出现。\n\n*   `HelloController.java`: 此文件定义了 JavaFX 应用程序运行时可能发生的动作。例如，代码：\n\
  \n    ```java\n    private Label welcomeText;\n\n    void onHelloButtonClick() {\n\
  \        welcomeText.setText(\"Welcome to JavaFX Application!\");\n    }\n    ```\n\
  \n    表示“当用户点击 *Hello* 按钮时，在 `welcomeText` 标签上显示 *Welcome to JavaFX Application!*”。\n\
  \n*   `hello-view.fxml`: 此文件描述了你的 JavaFX 应用程序窗口中按钮、标签和其他项目的布局。该文件还将将图形组件与上述 `HelloController.java`\
  \ 文件中的动作连接起来。欲需更多信息，请参阅本章附近的侧边栏“代码大汤：XML 与 Java 的混合”。\n\n要运行所有这些代码，在 `HelloApplication.java`\
  \ 文件的编辑器面板任意位置点击右键。然后选择 Run 'HelloApplication.main()'。稍等片刻，你将看到图 16-4 中的内容。这是一个内部有一个按钮的窗口。当你点击按钮时，会出现一条欢迎消息。\n\
  \n![“两个并排展示的 JavaFX 应用程序截图。左侧截图显示了一个标题为‘Hello!’的窗口，中心位置有一个标记为‘Hello!’的按钮。右侧截图显示了点击按钮后的同一个窗口，在按钮上方显示了文本‘Welcome\
  \ to JavaFX Application!’。该图像演示了点击按钮后用户界面的变化。”](img/9781394289240-fg1604.png)\n\n\
  FIGURE 16-4: 运行示例 JavaFX 应用程序。\n\n## 为你的 JavaFX 项目添加内容\n\nGUI 程序涉及视觉元素，而描述视觉元素的最佳方法就是画出它们。你可以用铅笔画，也可以用鼠标画。\n\
  \n使用 Scene Builder 和鼠标，你可以画出应用的布局并描述应用的的组件。Scene Builder 会自动将你的图画转换为 XML 代码。\n\n\
  ![交叉引用](img/crossreference.png) 你可能对听到安装 Scene Builder 的说明在本章的“安装 Scene Builder”部分中中并不感到意外。我只是觉得指出这一点。\n\
  \n### 我的 Scene Builder 应用程序在哪里？\n\nIntelliJ IDEA 并不擅长在你的电脑上寻找 Scene Builder。因此，在尝试运行\
  \ Scene Builder 之前，请按照以下步骤操作：\n\n1.  **进入 IntelliJ 的主菜单。在 Windows 上，选择 `File`；在\
  \ Mac 上，选择 `IntelliJ Idea`。在生成的子菜单中，选择 `Settings` ⇒ `Languages & Frameworks` ⇒ `JavaFX`。**\n\
  \n    这样做可以得到图 16-5 所示的内容。\n\n2.  **点击文本框右侧的文件夹图标，导航到电脑上的 SceneBuilder。**\n\n  \
  \  在 Mac 上，文本框显示 `/Applications`。（参参见图 16-5）。在 Windows 上，文本框显示 `C:\\Users\\`user_name`\\\
  AppData\\Local\\SceneBuilder\\SceneBuilder.exe。（参阅本章的“安装 Scene Builder”。）\n\n3.\
  \  **点击 OK 关闭设置对话框。**\n\n![“集成开发环境 (IDE)中的 Settings 窗口显示 SceneBuilder 的路径设置为 '/Applications'。左侧边栏列出了各种分类，在\
  \ Languages & Frameworks 下选择了 JavaFX。”](img/9781394289240-fg1605.png)\n\nFIGURE\
  \ 16-5: 通往场景\n\n### 构建场景\n\n在告诉 IntelliJ 如何找到 Scene Builder 后，你就可以准备为应用添加功能了。操作如下：\n\
  \n1.  **找到 IntelliJ 的 Project 工具窗口。**\n\n    Project 工具窗口包含文件夹和文件的树。（如果你没有看到 IntelliJ\
  \ 的工具窗口，请按下 Project 按钮。详情参见 [dummies.com/go/fd9e](http://www.dummies.com/go/fd9e)。）\n\
  \n2.  **展开 Project 工具窗口树的分支，直到找到 hello-view.fxml 文件。**\n\n    `hello-view.fxml`\
  \ 文件位于 `src/main/resources/project_name` 分支。\n\n3.  **右键点击 hello-view.fxml 文件。在弹出的上下文菜单中，选择\
  \ Open in SceneBuilder。**\n\n    如果顺利，Scene Builder 窗口将出现在你的屏幕上。（如果不顺利，请返回“我的 Scene\
  \ Builder 应用程序在哪里”部分。）\n\n    Scene Builder 窗口包含几个区域。（参见图 16-6。）\n\n4.  **在 Scene\
  \ Builder 窗口的左侧寻找 TextField 组件。你可以在 Library 面板的 Controls 部分找到它。（参见图 16-7）。)**\n\n\
  ![“JavaFX Scene Builder 工具的图形用户界面 (GUI)。界面分为三个部分：左侧的 Library、中间的 Design Area 和右侧的\
  \ Inspector。Library 列出了 TableView、TextArea、TextField 和 ToggleButton 等 UI 组件。Design\
  \ Area 显示了一个包含文本为 Hello 的 Label 和标记为 Hello 的按钮的 VBox。Inspector 部分目前为空，表示未选择项目。正在编辑的文件是‘hello-view.fxml’。”](img/9781394289240-fg1606.png)\n\
  \nFIGURE 16-7: Scene Builder 启动运行\n\n\n\n\n\n![JavaFX Scene Builder 界面截图。窗口分为三个部分：左侧的\
  \ Library（库）面板在 Controls、Containers 和 Menu 等不同类别下列出了 TextField、TextArea 和 Button\
  \ 等 UI 组件。其中 TextField 组件被高亮显示。中间部分显示 Design（设计）区域，有一个 UI 布局的预览，其中包含一个 TextField\
  \ 和一个标记为 'Hello!' 的 Button。右侧的 Inspector（检查器）面板显示了所选 TextField 的属性，其中 'fx:id' 属性设置为\
  \ 'myTextField'](img/9781394289240-fg1607.png)\n\n图 16-7: 你的 GUI 应用有一个文本字段。\n\n\
  5. **使用鼠标点击选择 `TextField` 组件，然后将其拖到 Content 面板。特别是，将其拖到 *Hello!* 按钮上方的空白隙处。**\n\n\
  当你松开鼠标时，*Hello!* 按钮上方的内容 面板中会出现一个文本字段。参考图 16-7。\n\n6. **在 Content 面板中的文本字段上点击。**\n\
  \n当你这样做时，Scene Builder 的 Inspector 面板会亮起一组属于 `TextField` 的功能 set。\n\n7. **在 Inspector\
  \ 面板的 Code（代码）部分，寻找标记为 `fx:id` 的框。（参考图 16-7。)**\n\n8. **在那个 `fx:id` 框中，输入名称 `myTextField`。**\n\
  \n特别说明：当你在 `fx:id` 框中输入内容时，你只是在随便起一个变量名。与其输入 `textField`，你也可以输入 `montrose` 或 `hungadungaAndMcCormick`。但\
  \ `myTextField` 这个名字比其他两个选择更有信息量。\n\n9. **回到 Content 面板，双击 *Hello!* 按钮。**\n\n当你这样做时，按钮表面的单词\
  \ *Hello!* 将变成被高亮状态。你输入的任何内容都将替换该单词 *Hello!*。\n\n10. **在按钮表面，输入 `Capitalize`。（查看图\
  \ 16-8。）**\n\n11. **在 Content 面板按钮仍被选中的情况下，查看 Inspector 面板的 Code 部分。**\n\n注意 Code\
  \ 部分的 `OnAction` 值。（参考图 16-8。）默认值为 `onHelloButtonClick`，你没有理由更改它。这告诉 JavaFX 在用户点击该按钮时调用名为\
  \ `onHelloButtonClick` 的方法。\n\n12. **从 Scene Builder 的主菜单中，选择 File（文件） ⇒   Save（保存）。**\n\
  \n我经常忘记这一步。不要像我一样。不要忘记这一步！\n\n![图像显示了一个图形用户界面 (GUI) 设计工具。界面分为三个主要部分。左侧部分包含 UI 组件列表，如\
  \ TextField、ToggleButton、TreeTableColumn 和 TreeTableView，它们按 Gluon、Menu、Miscellaneous、Shapes、Charts\
  \ 和 3D 等类别组织。中间部分显示了一个预览区域，其中放置了一个 TextField 和一个标记为 'Capitalize' 的 Button。按钮被高亮显示，表示它被选中。右侧部分显示所选按钮的属性和代码配置。它包含了设置按钮\
  \ ID、操作和拖放事件的字段。'On Action' 字段设置为 'onHelloButtonClick'](img/9781394289240-fg1608.png)\n\
  \n图 16-8: 调整按钮。\n\n### 调整某些代码\n\n在上一节中，你完成了对 Scene Builder 的操作。现在回到 IntelliJ 窗口，并一眼\
  \ IntelliJ 编辑器中的 `hello-view.fxml` 代码。我已将代码直接复制在这里，并对 Scene Builder 生成的所有文本使用了粗体字体。\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<?import javafx.geometry.Insets?>\n\
  <?import javafx.scene.control.Button?>\n<?import javafx.scene.control.Label?>\n\
  <?import javafx.scene.control.TextField?>\n<?import javafx.scene.layout.VBox?>\n\
  <VBox alignment=\"CENTER\" spacing=\"20.0\" xmlns:fx=\"http://javafx.com/fxml/1\"\
  \ xmlns=\"http://javafx.com/javafx/22\" fx:controller=\"com.example.myjavafxproject.HelloController\"\
  >\n  <padding>\n    <Insets bottom=\"20.0\" left=\"20.0\" right=\"20.0\" top=\"\
  20.0\"/>\n  </padding>\n  <TextField fx:id=\"myTextField\" />\n  <Label fx:id=\"\
  welcomeText\"/>\n  <Button onAction=\"#onHelloButtonClick\" text=\"Capitalize\"\
  />\n</VBox>\n```\n\n![提示](img/tip.png) 如果编辑器中的代码还没有 `TextField` 和一个带有 `Capitalize`\
  \ 单词的 `Button`，你可能需要更新编辑器的内容。要这样做，请离开 `hello-view.fxml` 文件然后返回该文件。\n\n你仍然需要在 `HelloController.java`\
  \ 中添加一些代码。\n\n1. **在 Content 面板中，双击 `TextField` 分支。**\n\n具体来说，查看 IntelliJ 项目树中的\
  \ `HelloController` 分支。当你双击它时，`HelloController.java` 会出现在项目 面板。\n\n2. **按照列表 16-1\
  \ 所示修改 `HelloController.java` 文件。**\n\nIntelliJ 已经为你创建了大部分代码。你只需要考虑我用粗体字体标记的文本 16-1。\n\
  \n*   你需要 `import javafx.scene.control.TextField`，因为你向应用中添加了 `TextField`。\n*   `myTextField`\
  \ 声明（以及上方的 `@FXML` 注解）告诉 Java 去查找 fx:id 为 `myTextField` 的东西。\n*   `myTextField.getText()`\
  \ 代码告诉 Java 获取用户在 `myTextField` 中输入的任何内容，并在 `welcomeText` 标签中显示其大写版本。\n\n### 运行你的新项目\n\
  \n1. **在项目窗口中，右键点击 `HelloApplication` 分支并选择运行 'HelloApplication.main()'。**\n\n \
  \   看！你的屏幕上出现了一个新的应用程序窗口。\n\n2. **在文本字段中输入内容。**\n\n    （尝试让它看起来好看一点。）\n\n3. **点击应用的\
  \ Capitalize 按钮。**\n\n    哇！文本字段内容的大写版本出现在你的应用窗口中。（查看图 16-9。）\n\n#### 复制文本到文本字段\n\
  \n创建一个包含按钮和两个文本字段的窗口。当用户点击按钮时，Java 将文本从第一个文本字段复制到第二个文本字段。\n\n#### 在文本字段之间复制\n\n\n\
  \n\n创建一个包含两个按钮和两个文本框的窗口。当用户点击第一个按钮时，Java 将第一个文本框中的文字复制到第二个文本框中。当用户点击第二个按钮时，Java\
  \ 将第二个文本框中的文字复制到第一个文本框中。\n\n### 创建小型计算器\n\n创建一个包含两个文本框、一个按钮和一个标签的窗口。用户在其中一个文本框中输入一个数字，在另一个文本框中输入另一个数字。当用户点击按钮时，Java\
  \ 在标签上显示这两个数字之和。\n\n记住，Java 区分像 `\"86\"` 这样的 `String` 值和像 `86` 这样的 `int` 值。Java\
  \ 从文本框中读取 `String` 值。但是，为了得到和，你需要加上两个 `int` 值。然后将一个 `String` 值放置在程序的标签上。\n\n# 第\
  \ 5 部分\n\n# 十倍系列专题\n\n在本部分中……\n\n*   探索网络上关于 Java 的最佳资源。\n*   阅读“亲爱的 Barry”建议栏。\n\
