  \ 978-1-394-28925-7 (ebk); 978-1-394-28926-4 (ebk)\n\n# 引言\n\nJava 到底为什么这么火？为了帮助回答这个问题，我提供几个事实：\n\
  \n* 全球有 900 万开发者在使用 Java 开发应用程序，Java 运行在约 70 亿台设备上。\n\n* 财富 500 企业中的 90% 使用 Java。\n\
  \n* 根据 TIOBE 编程社区指数，Java 是全球第三受欢迎的编程语言。\n\n* 2021 年，Glassdoor, Inc. 根据收入潜力、工作满意度和可用职位数量对工作进行了排名。在选的“2021\
  \ 年美国 50 份最佳工作”中，Java 开发人员的职业位列第一。\n\n听起来很不错，对吧？\n\n请继续下读。\n\n## 关于本书\n\n本书并不是那种枯燥的技术指南。它是为普通人编写的——即那些几乎或没有任何编程经验的人。在书中，我将\
  \ Java 分为易于管理的各个。每个部分（多或少）都是一个独立的章节。我用通俗易懂的语言解释概念。\n\n最后，也是最重要的，毫无疑问是本书所有特征中最显著的一个——我加入了一些笑话。我写了一些不错的笑话，还有很多烂笑话。（我应该说是有“非常非常多”烂笑话）。我在文中隐藏了一些彩蛋。\n\
  \n## 愚的假设\n\n在书中，我对你（读者）做出了几个假设。如果其中一个假设是不正确的，你可能没关系。如果所有这些假设都是错误的，请也务必购买这本书：\n\n\
  * 我假设你可以使用电脑。这里有一个好消息：你可以在几乎任何电脑上运行书中的大部分代码。唯一无法运行这些代码的电脑是那些超过十年的老古董（正负几年）。\n\n\
  * 我假设你能操作电脑常见的菜单和对话框。你不需要成为 Windows、Linux 或 Macintosh 高级用户，但你应该能够启动程序、找到文件、将文件放入目录之类的操作。在大多数情况下，当你遵循书中的指令时，你是在键盘上输入代码，而不是点击鼠标。\n\
  \n* 我假设你能进行逻辑思考。Java 编程的全部就是——逻辑思考。如果你能进行逻辑思考，你就稳了。如果你不相信自己能进行逻辑思考，请继续读下去。你可能会感到惊喜。\n\
  \n* 我对你的计算机编程经验（或缺乏相关经验）很少做假设。在编写本书时，我尝试完成一项不可能的任务：让这本书对经验丰富的程序员来说很有趣，同时让几乎或没有任何编程经验的人也能读懂。因此，我不假设你具有特定的编程背景。如果你从未创建过循环或索引过数组，没关系。\n\
  \n反之，如果你做过这些事情（可能在 Visual Basic、Python 或 C++ 中），你将在 Java 中发现一些有趣的转折。Java 的开发者提取了对象编程中的精良理念，对其进行了简化、重新加工，并重新组织成一种简洁、强大的解决问题方式。你将在\
  \ Java 中发现许多新的、发人深深的特性。当你发现这些特性时，其中许多对你来说将非常自然。无论如何，你都会对使用 Java 感到良好。\n\n## 本书使用的图标\n\
  \n\n\n\n\n如果你能看到我如何写这本书，你会看到我正坐在电脑前，自言自语。我在脑海里读出每一个句子。对于大多数句子，我会在心里默念好几次。当我产生一个额外的想法或不属于正文流的旁旁评论时，我会微微歪一下头。这样一来，任何正在听我说话的人（通常是没人）就知道我进入了暂时的离题状态。\n\
  \n当然，在印刷物中，你看不见我转动头部。我需要其他方式来把旁路想法单独放在角落里。我用图标来实现这一点。当你看到 `Tip`（提示）图标或 `Remember`（记忆）图标时，你就知道我正在进行快速的小绕路。\n\
  \n以下是我书中使用的图标列表：\n\n![Tip](img/tip.png) `Tip`（提示）是一条额外信息——其他书籍可能会忘记告诉你的有用小知识。\n\n\
  ![Warning](img/warning.png) 每个人都会犯错。上天知道我这生也犯过几次错。总之，当我认为某些地方特别容易犯错时，我会用 `Warning`（警告）图标标记出来。\n\
  \n![Remember](img/remember.png) 有时我想聘请一支写字飞机小组。白色的烟云说：“巴里，如果你想比较两个数字，请使用双等号。请不要忘记这样做。”因为我付不起写字的费用，所以我只能选择更谦虚的方案：创建一个带有\
  \ `Remember`（记忆）图标标记的段落。\n\n![Crossreference](img/crossreference.png) `Crossreference`（交叉引用）：“如果你不记得某某的意思，请参见某某，”或“欲了解更多信息，请阅读某某”。\n\
  \n![Tryitout](img/tryitout.png) `Tryitout`（尝试）编写计算机代码是一项活动，学习活动最好的方法就是实践。这就是为什么我为你创建了供你尝试的内容，以巩你的知识。其中许多是建立信心的，另一些更具挑战性。当你第一次开始将概念付诸实践时，你会发现在开始阅读材料时从未想过的各种问题、困境和障碍。但这是好事。坚持下去！不要感到沮丧。或者，如果你真的感到沮丧了，访问本书网站（`https://javafordummies.allmycode.com`）获取提示和解决方案。\n\
  \n![On the web](img/ontheweb.png) `On the web`（网络）图标引起你对可以在网上找到的有用材料。去看看吧！\n\n![Technical\
  \ Stuff](img/technicalstuff.png) 偶尔，我会遇到一些 `Technical Stuff`（技术细节）。这些细节可能帮助你理解幕后人员（即开发\
  \ Java 的人）在想什么。你不必阅读，但可能会发现它有用。如果你计划阅读其他关于 Java 的（更极客的）书籍，可能发现这些细节很有帮助。\n\n## 书之外\n\
  \n除了你现在阅读的内容，这本书还附带了一份免费的、随处可访问的 Cheat Sheet，其中包含了你可以复制并粘贴到自己的 Java 程序中的代码。要获取此表，只需访问\
  \ `www.dummies.com/` 并在搜索框中输入 `Java For Dummies Cheat Sheet`。\n\n为了增加你的阅读乐趣，我还安排出版商提供了两个附录和一个奖励章节的下载：详情如下：\n\
  \n*   **附录 A：设置你的电脑**，为你介绍了如何为你即将到来的 Java 冒险准备电脑。\n*   **附录 B：谁害怕 Java 文档？**，一份关于\
  \ Java API 文档的干货指南。\n*   **奖励章节 1：边揉肚子边拍头**，一份给对使用 Java 代码进行多任务处理感兴趣的人的指南。\n\n这三部分都\
  \ `www.dummies.com/go/javafd9e` 找到。\n\n## 从何开始\n\n如果你已经读到了这里，你就准备好开始学习 Java 应用开发了。把我（作者）当成你的向导、房主、私人助理吧。我会尽一切保持趣味性，最重要的是帮助你理解。\n\
  \n![On the web](img/ontheweb.png) 如果你喜欢看到的内容，请给我写封信。我的邮箱地址是专门为关于这本书的评论和问题创建的，即 `JavaForDummies@allmycode.com`。（以防你好奇，我会回复自己的邮件。我不使用机器人或付费助理。）并且不要忘记——要获取最新更新，请访问本书网站。该网站地址为\
  \ `https://javafordummies.allmycode.com`。\n\n# 第一部分\n\n## Java 入门\n\n在本部分中……\n\n\
  *   安装开发 Java 程序所需的软件。\n*   了解 Java 是如何融入当今技术领域的。\n*   运行你的第一个完整的 Java 程序。\n\n#\
  \ 第一章\n\n## 关于 Java 的一切\n\n在本章中\n\n![Bullet](img/check.png) 什么是 Java\n![Bullet](img/check.png)\
  \ Java 来自哪里\n![Bullet](img/check.png) 为什么 Java 如此酷\n\n### 你可以用 Java 做什么\n\n如果所有的复杂性都是免费的该好了，但遗憾的是并不是。有人必须苦苦思考并准确决定要让计算机做什么。在思考之后，有人必须为计算机编写一套其遵循的指令。\n\
  \n考虑到现状，你不能用英语或任何其他人们使用的语言来编写这些指令。科幻小说充满了这类人们向机器人提出简单请求却得到灾难性、意外结果的故事。英语或其他此类语言不适合与计算机通信，原因如下：\n\
  \n*   **英语句子可能会被误解。** “禁止停车。违规者将由车主承担费用拖走。”所以，停车位的业主会付钱拖我的车？这听起来并不糟糕！\n\n\n\n\n\n\
  *   **用英语编写一个复杂的指令是很困难的。** “将法兰 A 连接到凸起 B，确保仅将法兰 A 的最外边缘连接到凸起 B 的较大端，同时将法兰 A 的中间和内边缘与垫圈\
  \ C 连接。”\n*   **英语句子有很多多余的负担。** “句子中包含了不需要的单词。”\n*   **英语可能很难解释。** “John Wiley &\
  \ Sons, Inc. 在提交 *Java For Dummies* 第 9 版（简称‘本作品’）后，应向作者（‘Barry Burd’）或作者的受让人支付净收益，扣去预付和已发生的费用以及延期费用，无论是直接还是间接符合第\
  \ 4942(j)(3) 或 4965(k)(5) 条定义的，适用于 2024 日历年。”\n\n要告诉计算机做什么，你必须使用一种特殊的语言来编写简洁、无歧义的指令。这种特殊语言被称为`计算机编程语言`。用这种语言编写的一组指令被称为`程序`。当将其看作一个整体时，这些指令被称为`软件`或`代码`。以下是用\
  \ Java 编写的代码看起来的样子：\n\n```\nvoid main() {\n  var checkAmount = 1257.63;\n  println(\"\
  Pay to the order of Dr. Barry Burd $\" + checkAmount);\n}\n```\n\n你可能会认为，ChatGPT\
  \ 和其他生成式 AI 工具缩小了非正式英语与精心编写的代码之间的差距。在某种程度上确实如此。但计算机代码在短期内不会消失。生成式 AI 可能会产生幻觉。在某些关键应用中，幻觉是不可接受的。此外，GPT\
  \ 工具并不是凭空产生的。就在此时（只要你在阅读我的书时），全世界有成千上万的人正在编写代码，让 GPT 工具更快、更强大。编程并不是一门消亡的艺术，它是一项不断发展的事业。\n\
  \n## 为什么你应该使用 Java\n\n是时候庆祝了！你刚刚拿起了一本 *Java For Dummies* 第 9 版，并且正在阅读第 1 章。按照这个速度，你很快就会成为一名\
  \ Java 专家，所以请举办一个大派对，为你最终的成功欢呼吧。\n\n为了准备派对，我会烤一个蛋糕。我很懒，所以我将使用现成的即烘焙蛋糕粉。让我看看：向粉中加入水，然后加入黄油和鸡蛋——嘿，等等！我刚刚看了成分表。MSG\
  \ 是什么？二丙二醇呢？那是用于防冻的，不是吗？\n\n我会改变计划，从头开始制作蛋糕。当然，这稍微难一点，但这样我就能得到我完全想要的。\n\n计算机程序的工作方式也是一样：你可以使用别人的程序，也可以编写自己的。如果你使用别人的程序，你只能使用你得到的任何。当你编写自己的程序时，你可以专门为你的需求定制程序。\n\
  \n编写计算机代码是一项巨大的全球产业。公司在做、自由职业人士在做、爱好者在做——各行都在做。典型的大公司有团队、部门和分支为公司编写程序。但你可以为自己或为他人编写程序，为了生计或为了兴趣。在最近的估计中，全球程序员每天编写的代码数超过了木星上甲烷分子的数量。拿起几乎任何可以用计算机完成的任务——只要有合适的时间，你就可以编写自己的程序来实现。（当然，“合适的时间”可能很长，但并不是重点。许多有趣且实用的程序可以在几小时甚至几分钟内完成。）\n\
  \n## 视角转换：Java 处于什么位置\n\n这里是简短的历史：\n\n*   **1954–1957：FORTRAN 的诞生。**\n    FORTRAN\
  \ 是第一种现代计算机编程语言。对于科学编程，FORTRAN 是一匹真正的赛马。一年又一年，FORTRAN 一直是全球程序员中的领先语言。\n*   **1959：Remington\
  \ Rand 的 Grace Hopper 开发了 COBOL 编程语言。**\n    COBOL 中的字母 `B` 代表 `Business`（商业），而商业正是\
  \ COBOL 的核心。该语言的主要特征是处理一条接一条记录、一个接一个客户，或一个接一个员工。\n    在最初开发后的几年内，COBOL 成为最广泛使用的业务数据处理语言。\n\
  \    （趣闻：我曾愚蠢地尝试写一个 COBOL 程序来创作音乐。别说这真是选错工具了！那就像是用指甲锉刷牙。）\n*   **1960：John McCarthy\
  \ 写了一篇关于他的新编程语言 LISP 的论文。**\n    LISP 为一种被称为`函数式编程`的的编程风格奠定了基础。几十年来，函数式编程一直在后台等待，而其他编程技术占据中心位置。\n\
  *   **1967：挪威计算中心的科学家开发了 Simula 67 语言。**\n    随着 Simula 67，面向对象的编程诞生了。\n*   **1972：AT&T\
  \ 贝尔实验室的 Dennis Ritchie 开发了 C 编程语言。**\n    你在本书示例中看到的“外观和感觉”源于 C 编程语言。用 C 编写的代码使用大括号、`if`\
  \ 语句、`for` 语句和其他元素。\n    在力量能力方面，你可以使用 C 来解决与使用 FORTRAN 或 Java 或任何其他现代编程语言解决相同的问题。语言与语言之间的区别不在力量，而在于易用性。这正是\
  \ Java 的长处。\n*   **1986：同样在 AT&T 贝尔实验室的 Bjarne Stroustrup 开发了 C++。**\n    与其祖先 C\
  \ 语言不同，C++ 支持面向对象的编程。这是一个巨大的进步。（参见本章下一节。）\n*   **1995 年 5 月 23 日：Sun Microsystems\
  \ 发布了 Java 语言的第一个版本。**\n    Java 改进了 C++ 的概念。Java 不仅支持面向对象编程。    此外，Java 是一种极好的通用编程语言。用\
  \ Java 编写的程序可以在所有主流平台上运行，包括 Windows、Macintosh 和 Linux。通过 Java，你可以编写窗口应用程序、构建和探索数据库、控制手持设备等。在短短五年内，Java\
  \ 拥有了 250 万开发者。（我知道——我有一件纪念 T 恤可以证明。）\n到 2001 年，Java 成为著名的 TIOBE 编程指数第一语言。\n*  \
  \ **2007-2017：Java 成长。**\n    一段时间内，Java 的更新非常缓慢。由于对新功能的实现存在争议，Java 6 和 Java 7 版本之间相隔了整整五年。\n\
  \    期间，Oracle 公司收购了 Sun Microsystems——仅花 74 亿美元，真是太划算了！随后在 2014 年，Oracle 发布了 Java\
  \ 8——第一个具有函数式编程能力的 Java 版本。\n    在 2001 年到 2017 年的大部分时间里，Java 一直保持着 TIOBE 指数的领先地位。\n\
  *   **2017 年 8 月：Oracle 宣布了每六个月发布一个新 Java 版本的计划。**\n    2017 年 9 月发布 Java 9，之后是\
  \ 2018 年 3 月推出的 Java 10。接下来是 2018 年 9 月的 Java 11。\n    2023 年 9 月，Java 21 是一个*l*ong-*t*erm\
  \ *s*upport（长期支持）版本。这意味着 Oracle 承诺让 Java 21 稳定运行至少 2028 年 9 月。这些 LTS 版本每两年发布一次，所以下一个坚实、强大的\
  \ Java 版本是 2025 年 9 月的 Java 25。\n    新的发布周期为 Java 的演进注入了活力。\n\n\n\n\n\nJava 技术驱动着微软、Uber、LinkedIn、PayPal、Netflix、Airbnb、Google、eBay、Spotify、TripAdvisor、Intel、Pinterest\
  \ 和 Groupon 等公司的应用程序。求职网站 [`Monster.com`](https://www.monster.com/) 提到：\n\n> “Java\
  \ 是目前最流行的编程语言之一，因此它成为科技公司寻找的首要技能也并不令人意外。根据 Oracle 的数据，有 30 亿部手机正在运行 Java，此外还有 12500\
  \ 万台电视设备以及美国 89% 的桌面电脑在运行它。Java 无处不在，而且对优秀开发者的需求非常大。”\n\n嗯，我印象深刻。\n\n## 编写计算机程序的三种方式\n\
  \n现在是凌晨 4 点。我正梦见高中时挂掉的那门历史课。老师正在对我大吼：“你你有两天时间准备期末考试，但你不会记得去复习。你会忘记并感到愧疚、愧疚、愧疚。”\n\
  \n突然，电话响了。我从深睡中猛地醒来。（诚然，我不喜欢梦到历史课，但我更不喜欢被叫醒。）起初，我把电话掉在了地板上。费劲捡起来后，我发出一声不耐烦：“你好。哪位？”一个声音回答道：“我是路透社的记者。我正在写一篇关于\
  \ Java 的文章，我需要你用七个字或更少的话介绍这种编程语言。你能解释一下吗？”\n\n我的大脑一片空白。我无法思考。于是我脱出了脑子里冒出的第一个念头，然后继续睡去。\n\
  \n第二天早上，我几乎不记得和那位记者的谈话了。事实上，我不记得我是怎么回答那个问题的。我是回了几句脏话然后就去睡觉了吗？\n\n我穿上睡袍，冲到电脑前。当我访问路透社网站时，我看到了这个巨大的标题：\n\
  \n> **伯德称 Java “在许多不同方面都是一门伟大的语言”**\n\n### 一个可以用来给人留深刻印象的单词\n\n今天的词汇单词是 `paradigm`（范式）。\n\
  \n首先：`paradigm` 这个词怎么读？字母 `g` 是不发音的。你读作“PAA-ra-dime”。\n\n接下来，`paradigm` 到底是什么意思？我在几本字典里查了\
  \ `paradigm`，没有一个定义能让我印象多么深刻。在我看来，一个 `paradigm` 就是看待某事的方式。例如，人们曾认为太阳是绕着地球运行的。但在\
  \ 1543 年，哥白尼提出了地球绕着太阳运行。哥白尼革命是一次范式转移。\n\n多年来，出现了几种计算机编程范式。接下来的章节将描述其中三种：命令式编程、面向对象的编程和函数式编程。\n\
  \n### 命令式编程 (Imperative programming)\n\n很久以前，几乎每种编程语言本质上都是命令式的。在命令式语言中，你的程序主要由“做这个，再做那个”的命令组成。假设你经营着一家小公司，并且有[表\
  \ 1-1]中列出的三名员工。\n\n| **姓名** | **每周时长** | **薪水** |\n| --- | --- | --- |\n| Alice\
  \ | 40 | 450.00 |\n| Bob | 20 | 200.00 |\n| Carol | 35 | 300.00 |\n\n[表 1-1] 员工表\n\
  \n你希望每位员工每周都多工作一小时。作为交换，你将为每个员工多支付 50 美元。以下是你用命令式风格实现的方法：\n\n* `对于我的每位员工:`\n* `获取员工的每周时长，`\n\
  * `在该数字上加 1，`\n* `将该结果设置为员工每周时长的新值。`\n* `获取员工的当前薪水，`\n* `在该金额上加 50，`\n* `将该金额设置为员工薪水的新值。`\n\
  \n![Remember](img/remember.png) 你看到的并不是真正的计算机程序。它是对真实程序运行方式的一种非正式英语描述。由于它不是真正的代码，我们称之为伪代码（pseudocode）。\n\
  \n在命令式编程中，你的代码只是一长串命令列表。你可以将一些命令提取出来单独运行，并给这段命令块起一个名字。但无论如何，代码的基本构建单元都是单个命令。\n\n\
  典型的命令要么获取一个存储的值，要么设置一个存储的值。例如，一个命令获取员工的当前薪水，而另一个命令设置员工的新薪水。在命令式编程中，每个值与其他值之间是松散连接的。例如，当你的代码更改员工的每周时长时，它恰好改变了员工的薪水。除此之外，每周时长和薪水之间可能没有任何关系。每个值都是独立的实体。\n\
  \n### 面向对象编程 (Object-oriented programming)\n\n我常说命令式编程是“动词优先”，而面向对象编程（OOP）是“名词优先”。在命令式编程中，你从获取（get）和设置（set）等动词开始。在面向对象编程中，你从对象开始。\n\
  \n在 OOP 中，对象是一个同时包含数据和操作这些数据的方法的单元。数据通常称为属性或字段，方法称为函数。例如，一个 `Employee` 对象可能有 `name`、`hoursPerWeek`\
  \ 和 `pay` 等属性。它可能还有 `increaseHours()` 和 `givePay()` 等方法。\n\nOOP 的核心思想是将程序建模为一组相互作用对象的集合，而不是一系列命令。这使得代码更容易组织和维护，特别是在大型项目中。\n\
  \n\n\n\n\n`Create an object named` `Bob` `from the` `Employee` `class.` `Bob works\
  \ 20 hours per week with pay $200.`。\n\n`Create an object named` `Carol` `from the`\
  \ `Employee` `class`. `Carol works 35 hours per week with pay $300.`。\n\n你可能觉得将\
  \ Alice、Bob 和 Carol 称为“对象”有些不习惯，但请记住，这些人本身并不是对象。你所谓的“对象”是关于这些人的信息。由于你从 `Employee`\
  \ 类创建了每个对象，因此你将这些每个对象称为 `Employee` 类的*实例*（instance）。\n\n![Remember](img/remember.png)\
  \ 因为 Java 是一是一种面向对象的编程语言，你的首要目标是描述类和对象。类是某种事物背后的思想。对象是类的具体实例。首先，你定义一个类。然后，从类的定义中构造单个对象。\n\
  \n在编写了创建三个对象的代码后，你现在有了一个更完整的表格。（参见表 1-3）。\n\n| **Name** | **Hours per week** | **Pay**\
  \ | **Add one hour** | **Add $50 pay** |\n| --- | --- | --- | --- | --- |\n| Alice\
  \ | 40 | 450.00 | 40 + 1 is 41 | 450 + 50 is 500 |\n| Bob | 20 | 200.00 | 20 + 1\
  \ is 21 | 200 + 50 is 250 |\n| Carol | 35 | 300.00 | 35 + 1 is 36 | 300 + 50 is\
  \ 350 |\n\nTABLE 1-3 带有三个对象的 `Employee` 类\n\n将表 1-3 中的表头行看作 `Employee` 类。那么其他每一行都是一个对象——`Employee`\
  \ 类的实例。\n\n现在你已经创建了三个 `Employee` 实例，你可以编写代码来增加每位员工的小时和薪水。这里是伪代码版本：\n\n```\nFor each\
  \ employee,\nrun that employee's add1Hour code,\nrun that employee's add50Dollars\
  \ code.\n```\n\n一旦你创建了类及其对象，更改员工工时和薪水的实际工作就变得简单且简洁。朋友们，这就是面向对象编程的精髓所在。\n\n等一下！我听到你在对自己说什么？你说这段对面向对象编程的描述很模糊。你还没有真正理解它。好吧，我承认。我无法在第一章就教你关于\
  \ OOP 的所有知识。在接下来的章节中会有更多细节。只需记住，Java 首先、而且而且是一种面向对象的编程语言。在 Java 中，一切都是面向对象框架的一部分。在我看来，Java\
  \ 对面向对象范式的实现是最好的。\n\n![Tip](img/tip.png) 拥有像“#面向对象编程”这样的名称，你可能会期望“对象”一词在这本书的每一页上出现多次。但事实并非如此。你用\
  \ `Employee` 类创建的每个对象都是 `Employee` 类的“*实例*”，也称为“`Employee` 类实例”或直接称为“`Employee`实例”。如果你使用“`Employee`\
  \ 对象”而不是“`Employee` 实例”，人们也会知道你的意思。有时，当你真的是指“一个 `Employee` 实例”时，你可以说“一个 `Employee`”。但最好的办法是记住，你使用\
  \ `Employee` 类构造的每个对象都称为 `Employee` 实例。\n\n## 函数式编程\n\n*函数式编程*有几个部分。但在本章中，你可以将函数式编程看作一条流水线，数据从一个站点传输到另一个站点。每个站点从旧数据包制作出一组新数据，并将新数据包发送出去。某个站点（通常被称为\
  \ `forEach` 或 `map`）接收一组物品和代码，并将代码应用到每个物品上。\n\n你可以使用 `forEach` 来增加所有员工的工时间和薪水。这里有一些伪代码向你展示它是如何工作的：\n\
  \n```\nStart with the list of employees,\nthen apply forEach with the code add1Hour\
  \ to the list,\nthen apply forEach with the code add50Dollars to the list.\n```\n\
  \n顺便说一下，随着本章的进展，我听到了 Alice 的反馈。表 1-3 显示她每周必须工作超过 40 小时，Alice 对此感到不悦。你为什么不改变计划呢？考虑为每位员工的每周工作增加小时，但只对还没有工作\
  \ 40 小时的员工这样做。\n\n\n\n\n\n要安装 Java 开发工具包（JDK），请访问[`www.oracle.com/java/technologies/downloads`](https://www.oracle.com/java/technologies/downloads)\
  \ 并按照该网站的说明操作。获取最新的 Java 版本。为了运行本书中的示例，我使用了 `Java 23`。如果你是在 2028 年阅读这本书并且可以获取 `Java\
  \ 30`，那就尽管去吧！\n\n等一下！“让所有 Java 程序都能运行”是什么意思？我将在本章稍后的“内幕消息”章节中回答这个问题。\n\n## 2. 安装集成开发环境。\n\
  \n`集成开发环境 (IDE)` 是一个帮助你编写和测试新软件的程序。它就像是编写计算机代码的增强版 Microsoft Word。对于书中的示例，你可以使用任何支持\
  \ Java 的 IDE。\n\n以下是专业开发人员中最流行的 IDE 列表：\n\n*   `IntelliJ IDEA` ([`www.jetbrains.com/idea`](https://www.jetbrains.com/idea/))\n\
  *   `Eclipse` ([`www.eclipse.org/downloads`](https://www.eclipse.org/downloads/))\n\
  *   `Visual Studio Code, 也称为 VS Code` ([`https://code.visualstudio.com`](https://code.visualstudio.com/))\n\
  *   `NetBeans` ([`https://netbeans.apache.org`](https://netbeans.apache.org/))\n\
  \n某些 IDE 是专门为学生、教育者和其他特定社区设计的。这些包括 BlueJ、DrJava、Greenfoot、JCreator、jGrasp 等等。\n\n\
  ![技术细节](img/technicalstuff.png) 如果你喜欢原始操作，可以不使用 IDE 编写并运行 Java 程序：只需在纯文本编辑器（如 Windows\
  \ 记事本）中输入你的 Java 程序，并在操作系统的命令行（Windows MS-DOS、macOS Terminal 等）中运行程序。这样开发软件并不有趣，但它会让你觉得自己很牛。\n\
  \n![在网上](img/ontheweb.png) 本书的网站提供了安装和使用最常用 IDE 的详细说明。\n\n## 3. 测试你安装的软件。\n\n你在这一步中所做的取决于你在第\
  \ 2 步中选择了哪种 IDE。无论如何，这里有一些通用说明：\n\n1.  启动你的 IDE（Eclipse, IntelliJ IDEA, NetBeans\
  \ 或其他）。\n2.  在 IDE 中，创建一个新的 Java 项目。\n3.  在 Java 项目中，创建一个名为 `Main` 的新 Java 类。（在大多数\
  \ IDE 中，选择 文件 ⇒ 新建 ⇒ Java 类即可。）\n4.  通过输入以下几行代码来编辑新的 `Main.java` 文件：\n\n```java\n\
  public class Main {\n    public static void main(String[] args) {\n        System.out.print(12345);\n\
  \    }\n}\n```\n\n对于大多数 IDE，你将代码添加到一个大的（大部分是空白的）编辑器面板中。尝试按照你在这里看到的代码完全模一样地输入代码。如果你看到大写字母，就输入大写字母。对所有小写字母也同样操作。\n\
  \n![在网上](img/ontheweb.png) 什么？你说你不想从书里输入一大堆代码？好吧，没问题！访问本书的网站（[`http://JavaForDummies.allmycode.com`](http://javafordummies.allmycode.com/））下载所有代码示例，并将它们复制到你选择的\
  \ IDE 中。\n\n5.  运行 `Main.java` 并确保运行输出显示 12345。\n\n![提示](img/tip.png) 你可能会发现与我在前面的步骤中描述的情况略有不同。例如，某些\
  \ IDE 带有让你安装 JDK 的选项。在这些情况下，你可以跳过第 1 步直接进入第 2 步。尽管如此，我通过前面的步骤描述的情况是有用且可靠的。当你按照我的指令操作时，你可能会得到两个\
  \ Java 版本或两个 IDE，但没关系。你永远不知道什么时候需要一个备用的。\n\n就是这些！但记住：并不是所有人（无论是不是计算机极客）都能完美无缺地遵循这些骨架指令。所以，如果你想了解更多细节，请访问[`http://JavaForDummies.allmycode.com`](http://javafordummies.allmycode.com)。\n\
  \n## 内幕消息\n\n我的一位朋友是刀模具制造者。她使用工具来制造工具（以及模具）。我曾问过：“是谁制造了你用来制造工具的工具？”在忽略了她那个自以为聪明的回答后，我猜测是模具工具制造者为模具制造者制造工具，以便模具制造者能够制造工具。\n\
  \n计算机程序员在做着类似的事情：程序员使用现有的程序作为工具来创建新程序。现有程序和新程序可能执行完全不同的任务。例如，一个 Java 程序（你创建的程序）可能会跟踪业务的客户。为了创建那个客户跟踪程序，你使用了属于\
  \ Java 开发工具包（JDK）的几个程序。通过 `JDK` 的程序，你可以创建许多其他有用程序——客户跟踪程序、天气预测程序。\n\n\n\n\n\n```\n\
  putfield Hotel/roomNum I\ngoto 32\naload_0\ngetfield Hotel/guests I\naload_0\ngetfield\
  \ Hotel/roomNum I\niaload\nifne 26\ngetstatic java/lang/System/out Ljava/io/PrintStream;\n\
  new java/lang/StringBuilder\ndup\nldc \"Room \"\ninvokespecial java/lang/StringBuilder/<init>(Ljava/lang/String;)V\n\
  aload_0\ngetfield Hotel/roomNum I\ninvokevirtual java/lang/StringBuilder/append(I)Ljava/lang/StringBuilder;\n\
  ldc \" is available.\"\ninvokevirtual java/lang/StringBuilder/append(Ljava/lang/String;)Ljava/lang/StringBuilder;\n\
  invokevirtual java/lang/StringBuilder/toString()Ljava/lang/String;\ninvokevirtual\
  \ java/io/PrintStream/println(Ljava/lang/String;)V\niconst_0\ninvokestatic java/lang/System/exit(I)V\n\
  goto 32\naload_0\ndup\ngetfield Hotel/roomNum I\niconst_1\niadd\nputfield Hotel/roomNum\
  \ I\naload_0\ngetfield Hotel/roomNum I\nbipush 100\nif_icmplt 5\ngetstatic java/lang/System/out\
  \ Ljava/io/PrintStream;\nldc \"No vacancy\"\ninvokevirtual java/io/PrintStream/println(Ljava/lang/String;)V\n\
  return\n```\n\n[Listing 2-2 中的指令并不是 Java 源代码指令。它们是`Java bytecode`字节码指令。当你编写 Java\
  \ 程序时，你编写的是源代码指令（如 Listing 2-1 中的指令）。在你完成源代码编写后，你的 IDE 会在你的源代码上运行一个程序（一个翻译工具）。这个程序就是`compiler`编译器。编译器将你的源代码指令翻译成\
  \ Java 字节码指令。换句话说，编译器将你能够编写和理解的代码（如 Listing 2-1 中的代码）翻译成计算机有机会执行的代码（如 Listing 2-2\
  \ 中的代码）。\n\n![Technical Stuff](img/technicalstuff.png) 你可能将源代码放在一个名为 `Hotel.java`\
  \ 的文件中。如果是这样，编译器可能会将 Java 字节码放在另一个名为 `Hotel.class` 的文件中。通常情况下，你不需要去查看 `Hotel.class`\
  \ 文件中的字节码。事实上，编译器并没有将 `Hotel.class` 文件编码为普通文本，因此你无法用普通的编辑器查看字节码。如果你尝试用记事本、TextEdit、KWrite\
  \ 甚至 Microsoft Word 打开 `Hotel.class`，你看到的只有点点、波浪线和其他乱码。为了创建 Listing 2-2，我不得不对我的\
  \ `Hotel.class` 文件再次使用另一个工具。该工具可以显示 Java 字节码文件的类文本版本。我使用了 Ando Saabas 的 Java 字节码编辑器（[`https://set.ee/jbe`](https://set.ee/jbe/)）。\n\
  \n![Remember](img/remember.png) 没有人（除了某些偏远地区实验室里少数疯狂的程序员）会编写 Java 字节码。你运行软件（编译器）来创建\
  \ Java 字节码。查看 Listing 2-2 的唯一理由是为了理解你的计算机有多勤奋。\n\n### 什么是 Java 虚拟机？\n\n> *Java 虚拟机（JVM）是一个解释并执行字节码指令的程序。*\n\
  \n> —Barry Burd，《Java For Dummies, 9th Edition》\n\n在前面的“什么是编译器？”部分中，我对计算机遵循像 Listing\
  \ 2-2 那样的指令大做了一番文章。就周折而言，这是一个非常棒的周折。但如果你没有仔细读每一个纠结的字，就可能会被误导。准确的措辞是“……计算机遵循*类似于*Listing\
  \ 2-2 中的晦涩指令”。Listing 2-2 中的指令与计算机可以执行的指令非常相似，但通常情况下，计算机并不执行 Java 字节码指令。相反，每种计算机处理器都有自己的一套可执行指令，而且每个计算机操作系统使用处理器指令的方式也略有不同。\n\
  \n这里有一个假设的情况：现在是 1992 年（Java 发布的几年之前），你正在计算机上运行 Linux 操作系统。\n\n\n\n\n\n是什么让 Java\
  \ 字节码如此通用？Java 字节码程序所享有的这种极佳通用性来自于 Java 虚拟机。Java 虚拟机是你计算机上 `must` 拥有的工具之一。（参考本章的“准备学习\
  \ Java”章节。）\n\n想象一下你是 Windows 在联合国安理会的代表。（参见图 2-1）。Macintosh 代表坐在你的右侧，Linux 代表坐在你的左侧。（很自然然，你和这几个人都不相来。你们之间总是客客气气，但从不真诚。你还能指什么呢？这是政治！）来自\
  \ Java 的杰出代表正在讲台上发言。Java 代表正在用字节码进行演讲，你和你的同事大使们（Mac 和 Linux）都听不懂一个字的 Java 字节码。\n\
  \n![“一张显示 Java 源代码在不同操作系统上编译和执行过程的插图。。 Java 源代码被编译器编译成字节码。然后，字节码由 Java 虚拟机（JVM）解释，生成在\
  \ Mac、Windows 和 Linux 系统上运行的代码。”](img/9781394289240-fg0201.png)\n\n图 2-1： 一场想象中的联合国安理会会议。\n\
  \n但你们每人都有一个翻译。当 Java 代表说话时，你的翻译会将字节码翻译成 Windows 语言。另一个翻译会将字节码翻译成 Macintosh 语。第三个翻译则将字节码翻译成\
  \ Linux 语。\n\n将你的翻译想象成一个虚拟大使。这个翻译并不真正代表你的国家，但它执行了真实大使执行的一项重要任务。翻译代表你倾听字节码。如果你的母语言是\
  \ Java 字节码，翻译会做你会做。翻译假装成 Windows 大使，听完枯燥的字节码演讲，吸收每一个单词，并以某种方式处理每一个单词。\n\n你有一个翻译——一个虚拟大使。同样，Windows\
  \ 计算机运行着它自己的字节码解释软件。该软件就是 Java 虚拟机。\n\nJava 虚拟机是一个代理、一个跑腿、一个中间人。`JVM` 充当 Java 的无处运行字节码与你计算机系统之间的解释器。当它运行时，`JVM`\
  \ 会引导你的计算机执行字节码指令。`JVM` 逐位检查你的字节码，并执行字节码中描述的指令。`JVM` 为你的 Windows 系统、你的 Mac 或你的 Linux\
  \ 机器，或者你正在使用的任何计算机解释字节码。这是一个好事。这使得 Java 程序比任何其他语言的程序更具可移植性。\n\n## 开发软件\n\n> *这一切以前发生过，而且也将会再次发生。*\n\
  \n> ——彼得潘 *(J. M. Barrie) 及其* 星际迷航 *(2003–2009, NBC Universal)*\n\n当你创建一个 Java 程序时，你一遍又一遍地重复相同的步骤。图\
  \ 2-2 展示了这一循环。\n\n![“一张说明软件开发周期的流程图。该过程从“你编写代码”开始，接着是“你编译代码”，然后是“你运行代码”，最后是“你修改代码”，并回到“你编译代码”。](img/9781394289240-fg0202.png)\n\
  \n图 2-2： 开发 Java 程序。\n\n首先，你写一个程序。写完初稿后，你反复编译、运行和修改该程序。有了一点经验，编译和运行步骤就变得容易执行。在很多情况下，点击一下鼠标即可开始编译或运行。\n\
  \n然而，编写初稿和修改代码并不是一键完成的任务。开发代码需要时间和精力的。\n\n![记住](img/remember.png) 当你的代码初稿不起作用时，永远不要气馁。同样，当你的代码第\
  \ 25 版不起作用时，也永远不要气馁。重写代码是你能做的最重要的事情之一（确保世界和平之外）。\n\n当人们谈论编写程序时，他们使用图 2-2 更详细地描述了图\
  \ 2-2 中的循环。\n\n![“一张说明 Java 编程周期的流程图。它从“你编写 Java 源代码”开始，接着是“根据你的命令，计算机编译源代码（创建字节码）”，然后是“根据你的命令，计算机的\
  \ JVM 运行字节码”，最后是“你修改 Java 源代码”，然后回到起点。”](img/9781394289240-fg0203.png)\n\n图 2-3：\
  \ 谁用什么代码做什么？\n\n![提示](img/tip.png) 对大多数人来说，图 2-3 包含了太多信息。如果图 2-2 让你感到困惑，请忽略图 2-3。\n\
  \n\n\n\n\nSun Microsystems 的人员在创建 Java 时，将其视为由不同的部分组成。正如英语有语法和常用名称一样，Java 编程语言也有它的规范（它的语法）和它的应用程序接口（它的常用名称）。随这些部分还有两份重要的文档：\n\
  \n*   **Java 语言规范（The Java Language Specification）：** 这份文档包含了如下的规则：“始终在 *for* 单词后面跟一个左括号”以及“使用星号来两个数字相乘”。\n\
  \n*   **API 规范（The API Specification）：** Java 的*应用程序接口（API）***包含了成千上万个在语言语法定义后被添加到\
  \ Java 中的名称。这些名称从普通到稀有不一。例如，其中一个名称——`JFrame`——代表你电脑屏幕上的一个窗口。一个更酷炫的名字——`pow`——可以帮助你计算\
  \ 5 的 10 次方，或者计算任何数字的任意次方。其他名称则帮助你监听用户的按钮点击、查询数据库并执行各种实用的操作。\n\n你可以通过翻阅 `https://docs.oracle.com/javase/spec`\
  \ 来下载语言规范，但不建议你这样做。有了语言规范，你可以解决关于 Java 程序行为边缘情况的细微争论。但对于日常学习 Java 来说，这份规范太详细了。\n\
  \n第二份文档——API 规范——是你大多数 Java 编程需求的首选文档。API 包含了成千上万个名称，并随着每一个新 Java 语言版本的发布而不断增长。这看起来可能很可怕，但有一个好消息——你不需要记忆\
  \ API 中的任何内容。任何内容，一个都不用。你可以在文档中查找你需要使用的内容，并忽略你不需要的内容。你经常使用的，你会记住；你不经常使用的，你会忘记（就像其他任何程序员一样）。\n\
  \n![在网上](img/ontheweb.png) Java 23 的 API 文档位于在线：`https://docs.oracle.com/en/java/javase/23/docs/api/index.html`。对于后来的\
  \ Java 版本，请将 URL 中的 `23` 更改为相应的版本号。\n\n![记住](img/remember.png) 没有人知道 Java API 的所有知识。如果你是一个经常编写打开新窗口程序的\
  \ Java 程序员，你就知道如何使用 API 中的 `JFrame` 类。如果你很少编写打开窗口的程序，那么当你第一次需要创建窗口时，你可以在 API 文档中查找\
  \ `JFrame` 类。我猜，如果你阻止一个典型的 Java 程序员在 API 文档中查找任何内容，该程序员将只能使用 Java API 中少于 2% 的名称。\n\
  \n![在网上](img/ontheweb.png) 你可能喜欢*自用教程 (For Dummies)* 的风格，但遗憾的是，Java 的官方 API 文档并不是那种风格写的。API\
  \ 文档既简洁又精确。为了帮助理解 API 文档的语言和风格，请访问本书的网站：`www.dummies.com/go/javafd9e`。（该内容的链接也可以在我的\
  \ `https://JavaForDummies.allmycode.com/` 站点找到。）\n\n在某种意义上，Java API 没有任何东西是特殊的。每当你写一个\
  \ Java 程序时——即使是最小、简单的 Java 程序——你都会创建一个与官方 Java API 中定义的任何类同等级的类。API 仅仅是一组由恰好参与了官方\
  \ Java 社区进程（JCP）的普通程序员所创建的类和其他名称。与你创建的名称不同，API 中的名称随每个 Java 版本一起发布。（我假设你，这位读者，并不是\
  \ Java 社区进程的参与者。但是，有了像《Java For Dummies》第 9 版这样的好书，谁知道呢。）\n\n![在网上](img/ontheweb.png)\
  \ 如果你对 JCP 的活动感兴趣，请访问 `www.jcp.org`。\n\nJCP 的成员并没有对官方 Java API 中的 Java 程序保密。如果你愿意，可以通过访问\
  \ `https://github.com/openjdk/jdk/tree/master/src/java.base/share/classes/java`\
  \ 来查看所有的程序。\n\n### Java 程序中的单词\n\n一个硬核 Java 程序员会说，Java 编程语言有四种单词：关键字、受限关键字、字面量和标识符。这是事实。但没有任何其他解释的赤裸事实是没用的。所以，我通过按三类单词来思考，稍微对事实进行了修饰：即：关键字、像你我这样的普通程序员创建的标识符，以及来自\
  \ API 的标识符。\n\n这三种单词之间的差异与英语中单词之间的差异相似。在“Sam is a person”这句话中，`person` 词就像一个 Java\
  \ 关键字。无论谁使用 `person` 这个词，这个词的意思总是大体相同。（当然，你可以考虑英语用法中奇特的特例，但请不要。）\n\n`Sam` 词就像一个\
  \ Java 标识符，因为 `Sam` 是一个特定人的名字。像 `Sam`、`Dinswald` 和 `McGilloo` 这样的单词在英语中并没有预设的含义。现在考虑“Julius\
  \ Caesar is a person”这句话。Julius Caesar 这个名字就会是一个 API 标识符。\n\n以下是我脑海中如何将 Java 程序中的单词分为几类类的：\n\
  \n*   **关键字（Keywords）：** *关键字*是 Java 语言中具有特殊含义的单词，这种含义不会从一个程序改变到另一个程序。Java 关键字示例有\
  \ `if`、`else` 和 `do`。\n\n    JCP 委员会成员对什么是 Java 程序拥有最终决定权，他们选择了所有的 Java 关键字。如果你考虑之前提到的\
  \ Java 的两个部分，Java 关键字完全属于语言规范。\n\n*   **标识符（Identifiers）：** *标识符*是某个事物的名称。标识符含义可以从一个程序改变到另一个程序，但某些标识符的含义变化得更频繁：\n\
  \n    *   **由你我创建的标识符：** 作为一个 Java 程序员（是的，即使是新手 Java 程序员），你为程序中描述的类和其他项目创建新名称。当然，你可以将某个东西命名为\
  \ `Prime`，而你隔壁的同事也可以将另一个东西命名为 `Prime`。这没关系，因为 Java 对 `Prime` 没有预设含义。在你的程序中，你可以让\
  \ `Prime` 代表联邦储备的优惠利率；而你走廊的朋友可以让 `Prime` 代表“面包、圆面包、果酱和排骨”。\n\n    *   **来自 API 的标识符：**\
  \ JCP 成员为许多事物创建了名称，并将成千上万这样的名称投入了 Java API。API 随每个 Java 版本发布，因此这些名称对任何编写 Java 程序的人都可用。此类名称的示例有\
  \ `String`、`Integer`、`JWindow`、`JButton`、`JTextField` 和 `File`。\n\n\n\n\n严格来说，Java\
  \ API 中标识符的含义并不是一成不变的。虽然你可以为 `JButton` 或 `JWindow` 赋予自己的含义，但这并不是一个好主意。如果你真的这样做了，你会让其他程序员感到不知所措，因为他们已经习惯了这些熟悉的标识符名称的标准\
  \ API 含义。更糟糕的是，当你的代码为像 `JButton` 这样的标识符分配新含义时，你就失去了 API 代码中为该标识符创建的所有计算能力。Sun Microsystems、Oracle\
  \ 和 Java 社区过程组（Java Community Process）的程序员们已经完成了所有处理按钮的 Java 代码编写。如果你为 `JButton`\
  \ 赋予自己的含义，你就是在背弃在创建该 API 时所取得的所有进展。\n\n![在网上](img/ontheweb.png) 要查看 Java 关键字列表，请访问\
  \ [`www.dummies.com`](https://www.dummies.com/) 并在搜索框中输入 `Java For Dummies cheat\
  \ sheet`。\n\n## 第一次查看 Java 代码\n\n当你第一次看别人的 Java 程序时，你可能会感到有些不适。意识到自己并不理解代码中的某些内容（或许多内容）会让你感到紧张。我写过数百（也许是数千）Java\
  \ 程序，但在开始阅读别人的代码时，我仍然会感到不安全。\n\n事实是，了解一个 Java 程序是一个引导的过程。首先，你对这个程序感到惊叹。然后，你运行程序看看它是做什么的。接着，你盯着程序看一会儿，或者阅读别人对程序及其部分的解释。然后你又多目呆一会儿，再次运行程序。最后，你与这个程序达成和解。（不要相信那些说他们从未经历过这些步骤的大佬。即使是经验丰富的程序员在面对新项目时也会缓慢而仔细。）\n\
  \n在 Listing 3-1 中，你看到了一大量的 Java 代码。（像所有初级程序员一样，你被要求谦虚地注视这些代码。）我在代码中隐藏了一些重要的思想，我将在下一节中详细解释它们。这些思想包括方法的使用和\
  \ Java 语句的使用。\n\nLISTING 3-1 二加二\n\n```\nvoid main() {\n    println(2 + 2);\n}\n\
  ```\n\n![警告](img/warning.png) Java 编程语言是区分大小写的。如果你将单词中的一个小写字母改为大写字母，就可以改变单词的含义。改变大小写可能会使整个单词从有意义变为意义。在\
  \ Listing 3-1 的第一行中，你不能将 `void` 替换为 `Void` 或将 `println` 替换为 `printLn`。这样做，整个程序将停止工作。\n\
