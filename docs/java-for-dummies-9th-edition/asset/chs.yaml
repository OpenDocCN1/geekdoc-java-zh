  \ 代表 King（王）。编写代码创建几张牌并在屏幕上显示它们。\n\n## 核心在于访问\n\n书中的许多示例频繁使用 `public` 和 `private`\
  \ 这两个词，好像它们完全没什么大不了。这没关系，因为这些词的英文含义在程度上描述了它们在 Java 程序中的含义。但精确一些会更好。因此，本节将重点关注 `public`\
  \ 和 `private` 这两个词。这两个词是 Java 的访问修饰符之一。`protected` 是另一个 Java 访问修饰符。而且，在（可以使用 `public`、`private`\
  \ 或 `protected` 的地方不使用任何词也是一种访问修饰符。\n\n首先，*访问* 意味着什么？假设你有两个字段、两个方法、一个带有独立方法的类，或者任何类型的两个东西。第一个东西的名字对第二个东西有意义吗？这里有两段代码：\n\
  \n```java\nclass First {\n    int number = 0;\n}\n\nclass Second {\n    void main()\
  \ {\n        var first = new First();\n        first.number = 99;\n    }\n}\n```\n\
  \n这段代码可以吗？`Second` 类的 main 方法可以引用 `First` 类及其 `number` 字段吗？如果可以，`Second` 类就访问了这些东西。\n\
  \n访问修饰符有助于确定可以使用何种访问。为了描述 Java 的访问修饰符，我从大局开始——模块。\n\n### Java 模块的访问\n\n有一首老诗的内容大概是这样的：\n\
  \n```text\n当我去上高中时，\n我运行了一段包含七个模块的代码，\n每个模块有七个包，\n每个包有七个类，\n```\n\n`每个包有七个类，` `每个模块有七个包，`\
  \ `我运行了一段包含七个模块的代码，` `当我去上高中时，` 等等，我只是在重复。让我们给出最终输出。\n\n（实际上，我将根据规则输出完整的格式化文本。）\n\
  \n***\n\n\n\n\n![技术细节](img/technicalstuff.png) 事情往往没有表面看起来那么简单。我在这一节中描述的规则适用于书中的几乎每一个类。但\
  \ Java 有一些名为`密封类`（sealed classes）和`内部类`（inner classes）的奇特特性，这些类遵循的是一套不同的规则。幸运的是，典型的初级程序员很少接触密封类或内部类。因此，目前你可以完全根据我在这一节中描述的规则过得相当愉快。\n\
  \n关于类的访问规则就说到此为止！是时候探索其他途径了。\n\n### 关于方法局部变量的几点介绍\n\n考虑这段 Java 代码：\n\n```java\n\
  public class MyClass {\n  int myField; // 这是一个字段（MyClass 的成员）。\n  // myVariable++;\
  \ // 非法。没有访问权限。\n  void myMethod() { // 这是一个方法（MyClass 的另一个成员）。\n    int myVariable;\
  \ // 这是一个方法局部变量（不是成员）。\n  }\n}\n```\n\n代码右侧的注释说明了整个故事。这个类有三种成员：字段、方法和方法局部变量。关于方法局部变量没什么好说的。方法局部变量无法从方法外的任何代码访问。仅此而已。如果你想了解更多细节，请参考第\
  \ 7 章。\n\n### 成员的访问（字段和方法）\n\n想象一下，你是一个类中的成员。具体来说，你是一个名为`identificationNumber`的字段。从代码的某处，你听到：“嘿，`identificationNumber`！你现在的值是多少？”你的第一个反应应该是：“谁想知道？”取决于是谁请求\
  \ `identificationNumber`，你可能愿意也可能不愿意回答。\n\n#### 同一类中的成员\n\n同一个类中的两个成员可以自由自在地互相访问。例如，以下代码是正确的：\n\
  \n```java\nclass MyClass {\n  private int x = 7;\n  private int y = addOne();\n\
  \  private int addOne() {\n    return x + 1;\n  }\n  void main() {\n    System.out.println(y);\n\
  \  }\n}\n```\n\n这个愚蠢程序的输出是 `8`。在这个程序中，每个名称对程序的其余代码都是可见的。`addOne` 方法使用了 `x` 的值，`y`\
  \ 的初始化调用了 `addOne`，而 `main` 使用了 `y` 的值。几乎所有内容都被声明为 `private`。但因为一切都在同一个类中，所以 `private`\
  \ 这个词并不重要。\n\n#### 不同类之间的成员\n\n访问另一个类的成员的能力取决于该成员的访问修饰符。以下是完整说明：\n\n##### 私有访问 (PRIVATE\
  \ ACCESS)\n\n如果一个成员是私有的，只有该成员类内部的代码才能直接引用该成员的名字。这里是一些示例代码：\n\n```java\nclass SomeClass\
  \ {\n  private int myField = 10;\n}\n\n///////////////////////////////\n\nclass\
  \ SomeOtherClass {\n  void main() {\n    var someObject = new SomeClass();\n   \
  \ System.out.println(someObject.myField); // 这行不通。\n  }\n}\n```\n\n关于私有访问的描述，请参见图\
  \ 11-7。\n\n![“一张显示名为 'M' 的类的图表，它继承自另一个名为 'L' 的类，并包含一个私有字段。”](img/9781394289240-fg1107.png)\n\
  \nFIGURE 11-7: 私有字段或方法可以使用的代码范围（阴影部分）。\n\n##### 公有访问 (PUBLIC ACCESS)\n\n如果一个成员是公有的，任何代码都可以直接引用该成员的名字。这里是一些示例代码：\n\
  \n```java\nclass SomeClass {\n  public int myField = 10;\n}\n\n///////////////////////////////\n\
  \nclass SomeOtherClass {\n  void main() {\n    var someObject = new SomeClass();\n\
  \    System.out.println(someObject.myField); // 这行行得通。\n  }\n}\n```\n\n（记住两个类必须在同一个模块中。否则，一切都不可控。）关于公共访问的描述，请参见图\
  \ 11-8。\n\n![“图像显示了面向对象编程中类继承的图。3x3 网格中排列着九个方框。第一行包含 'class A'、'class L' 和 'class\
  \ X'。中间行包含 'class B extends A'、带有注释 'public field' 的 'class M extends L' 以及 'class\
  \ Y extends X'。最后一行包含 'class C extends B'、'class N extends M' 和 'class Z extends\
  \ Y'。此图说明了不同类之间的层级关系。”](img/9781394289240-fg1108.png)\n\nFIGURE 11-8: 公有字段或方法可以使用的代码范围（阴影部分）。\n\
  \n![警告](img/warning.png) 公有字段很容易使用，甚至更容易被误用。设计代码的最佳方法是让每个字段的访问尽可能受限。如果一个字段绝对不需要是公有的，尝试将其设为私有。\n\
  \n##### 默认访问 (DEFAULT ACCESS)\n\n没有任何 `public`、`private` 或 `protected` 修饰符的成员具有默认访问权限，也称为包级访问。具有默认访问的成员仅在其所属的包内可访问。图\
  \ 11-9 说明了这一点。\n\n![“图像显示了三个框，每个框包含一个 Java 类。第一个框包含 'class B extends A'，第二个框带有注释\
  \ 'default access' 的 'class M extends L'，第三个框包含 'class Y extends X'。”](img/9781394289240-fg1109.png)\n\
  \nFIGURE 11-9: 字段或方法可以使用的代码范围（阴影部分）。\n\n![警告](img/warning.png) 子包并没有比其他包更多的访问权限。考虑两个包：`com.dbrain.drawings`\
  \ 和 `com.dbrain.drawings.rectangles`。后者是前者的子包。这些包可以访问对方的默认成员吗？\n\n##### 保护访问 (PROTECTED\
  \ ACCESS)\n\n刚接触 Java 时，我以为 `protected` 这个词意味着“受保护”之类的。“哇，那个字段被保护了。它很难被获取。”事实证明，这种想法是错误的。在\
  \ Java 中，受保护的成员比默认访问的成员更少隐藏、更安全，并且可以在更多类中使用。换句话说，保护访问比默认访问更宽松。但事实就是如此。\n\n可以这样理解保护访问：从一个具有默认访问权限的字段开始（即声明中没有\
  \ `public`、`private` 或 `protected` 单词的字段）。该字段仅在自己的包内可访问。现在在字段声明前加上 `protected`。突然之间，包外的某些类就可以访问它。你可以从声明该类的子类中引用该字段。你也可以从子子类、子子子类等中引用该字段。任何后代类都可以。图\
  \ 11-10 说明了这一点。\n\n![“图像显示了面向对象编程中类继承的图。图中了四个类：'class B extends A'、'class M extends\
  \ L'、'class Y extends X' 以及 'class N extends M'。类 'M' 有一个保护字段。”](img/9781394289240-fg1110.png)\n\
  \nFIGURE 11-10: 保护字段或方法可以使用的代码范围（阴影部分）。\n\n不要费脑筋去理解保护访问。如果你以后需要，可以再读一遍。\n\n![试一试](img/tryitout.png)\
