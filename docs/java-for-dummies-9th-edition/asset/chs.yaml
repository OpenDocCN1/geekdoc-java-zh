  \ 中扮演着特殊角色。特别是，你永远不会编写显式调用 `main` 方法执行的代码。\n\n\n\n\n很久以前，或者也许并不算久以前，你的学校老师曾告诉过你大纲有多么有用。有了大纲，你可以组织思想和想法，帮助人们“看到森林而非树木”，并且通常能证明你是一个“整洁人士俱乐部”的成员。嗯，一个\
  \ Java 程序就像一个大纲。代码列表 3-1 中的程序以一个标题行开头，上面写着：“这里有一个名为 `main*.*` 的方法”。在标题行之后，一个子标题宣布：“这里有一个对\
  \ `println` 方法的调用”。\n\n现在，如果 Java 程序像一个大纲，为什么程序本身*看起来不像*一个大纲呢？什么取代了罗马数字、大写字母和其他项目？答案是**双重层面的**：\n\
  \n*   在 Java 程序中，大括号包围了有意义的代码单元。\n*   你，作为程序员，可以（也应该）对代码行进行缩进，以便其他程序员能够一眼看出你代码的大纲结构。\n\
  \n在大纲中，所有内容都隶属于罗马数字 `I.` 下的项目。在 Java 程序中，所有内容都隶属于顶行。在代码列表 3-1 中，顶行是包含 `main` 单词的那一行。为了表示代码中的其他所有内容都隶属于这条\
  \ `main` 行，你需要使用大括号。代码中的其他所有内容都在这些大括号内部。\n\n在第 7 章中，当你开始使用类时，会将程序的 `main` 方法放在自己的类中。看代码列表\
  \ 3-4。在该列表中，一对大括号表示 `main` 方法隶属于名为 `TwoPlusTwo` 的类。另一对大括号表示对 `println` 的调用反隶属于 `main`\
  \ 方法的标题行。\n\n代码列表 3-4 Java 类的大括号\n\n```\nimport static io.IO.println; // 暂时忽略此行\
  \ //（或跳到第 11 章）。\nclass TwoPlusTwo {\nvoid main() {\nprintln(2 + 2);\n}\n}\n```\n\
  \n在大纲中，某些项目处于食物链的底端。在代码列表 3-4 中，对应的行是以 `println` 开头的那行。因此，这条 `println` 行位于所有其他大括号内部，并且缩进比其他任何行都深。\n\
  \n![记住](img/remember.png) 永远不要忘记这样一个事实：Java 程序首先本质上就是一个大纲。\n\n如果你在错误的位置放置大括号，或者在应该有大括号的地方省略大括号，你的程序可能无法运行。如果你的程序运行了，它可能会运行错误。\n\
  \n如果你不以提供信息的方式对代码行进行缩进，你的程序仍然可以正常运行，但你和任何其他程序员都无法理解写代码时在想什么。\n\n如果你是一个视觉化思考者，你可以在脑中勾勒出\
