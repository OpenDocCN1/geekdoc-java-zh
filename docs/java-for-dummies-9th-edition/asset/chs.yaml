  \ Dummies》第 9 版的一段引用：\n\n> “要使用抽象类，你必须创建一个扩展该抽象类的普通（非抽象）类。”\n\n因此，为了使用列表 15-7 中的\
  \ `HousePet` 类，你必须创建一个扩展 `HousePet` 类的类。列表 15-8 中的代码扩展了抽象的 `HousePet` 类，并为名为 `howToCareFor`\
  \ 的方法提供了主体。\n\n列表 15-8 狗的生活\n\n```java\npackage com.example.species;\nimport static\
  \ java.lang.System.out;\npublic class Dog extends HousePet {\n    private int walksPerDay;\n\
  \    public Dog(String name, double weight, int walksPerDay) {\n        super(name,\
  \ weight, \"Woof\");\n        this.walksPerDay = walksPerDay;\n    }\n\n    @Override\n\
  \    public void howToCareFor() {\n        out.print(\"Walk \" + getName());\n \
  \       out.println(\" \" + walksPerDay + \" times each day.\");\n    }\n}\n```\n\
  \n除了拥有 `name`、`weight` 和 `sound` 之外，每只狗每天都会被散步固定次数。现在，因为有了 `howToCareFor` 方法的主体，你知道了照顾狗意味着什么：意味着每天带狗散步固定次数。`HousePet`\
  \ 类中的 `howToCareFor` 方法是抽象的，这是一好事。你并不一定想去给其他种宠物散步。\n\n以家猫为例。“照顾”猫可能意味着不要经常打扰它。而且猫还有其他特征——那些是不适用于狗的特征。例如，有些猫会去室外，而有些则不会。你可以让室内猫的\
  \ `walksPerDay` 变为 0，但那感觉像是在作弊。相反，每只猫都可以有一个 `boolean` 值来代表该猫的室内/室外状态。列表 15-9 包含了这些代码。\n\
  \n列表 15-9 如何做一只猫\n\n```java\npackage com.example.species;\npublic class Cat extends\
  \ HousePet {\n    private boolean isOutdoor;\n    public Cat(String name, double\
  \ weight, boolean isOutdoor) {\n        super(name, weight, \"Meow\");\n       \
  \ this.isOutdoor = isOutdoor;\n    }\n\n    @Override\n    public void howToCareFor()\
  \ {\n        System.out.println(isOutdoor ? \"Let \" : \"Do not let \" + getName()\
  \ + \" outdoors.\");\n    }\n}\n```\n\n`Dog` 和 `Cat` 类都是 `HousePet` 的子类。而且因为列表 15-7\
  \ 中的抽象方法声明，`Dog` 和 `Cat` 类都必须实现 `howToCareFor` 方法。这两个类的 `howToCareFor` 方法非常不同。一个指向\
  \ `walksPerDay` 字段，另一个指向 `isOutdoor` 字段。由于 `HousePet` 类的 `howToCareFor` 方法是抽象的，并没有默认行为。`Dog`\
  \ 和 `Cat` 类要么实现自己的 `howToCareFor` 方法，要么就声称扩展了 `HousePet`。\n\n![技术细节](img/technicalstuff.png)\
  \ 这段文字描述了一个细节，如果你有倾向可以忽略它：`Dog` 和 `Cat` 类必须实现 `howToCareFor` 方法，因为 `Dog` 和 `Cat`\
  \ 类不是抽象的。如果 `Dog` 和 `Cat` 类是抽象的（也就是说它们是扩展 `HousePet` 的抽象类），那么 `Dog` 和 `Cat` 类就不需要实现\
  \ `howToCareFor` 方法。`Dog` 和 `Cat` 类可以把实现留给子类。但为了使用这些技巧，你需要编写一些特殊的程序。在本章中，我简化了故事：a)\
  \ 扩展抽象类的类必须提供抽象方法的实现；b) 实现接口的类必须提供方法的实现。这并不完全准确，但目前足够了。如果你住在很小的公寓，可能没有空间养狗或猫。在这种情况下，列表\
  \ 15-10 更适合你。\n\n列表 15-10 你可能会变成一条鱼\n\n```java\npackage com.example.species;\npublic\
  \ class Fish extends HousePet {\n    public Fish(String name, double weight) {\n\
  \        super(name, weight, null);\n    }\n\n    @Override\n    public void howToCareFor()\
  \ {\n        System.out.println(\"Feed \" + getName() + \" daily.\");\n    }\n}\n\
  ```\n\n我可以继续创建 `HousePet` 的子类。多年前，我们的女儿养过老鼠。照顾老鼠意味着要把猫远离它们。在 Java 中，子类的数量像兔子一样繁殖。\n\
  \n### 使用所有的类\n\n在测试代码之前，你的工作还没有完成。大多数程序需要小时、几天甚至月。但对于本章的 `HousePet` 示例，我只做了一次测试。测试在列表\
  \ 15-11 中。\n\n列表 15-11 动物园\n\n```java\nimport com.example.species.*;\nvoid main()\
