  \ 对象。每个 `Player` 对象都有自己的 `name` 和 `average`。每个 `Player` 对象都是 `Player` 类的实例。\n\n\
  （注：输入文本中存在大量重复，已根据要求进行清理）\n\n显示了 `print` 调用在 Listing 11-2 中如何格式化我的球员名称。在 `\"%-40s\"\
  ` 中，`40s` 表示使用 40 个字符来显示第二个参数。负号表示左对齐，因此名称位于 30 个字符填充的左侧。\n\n![图像说明了在格式化字符串中左对齐名称的\
