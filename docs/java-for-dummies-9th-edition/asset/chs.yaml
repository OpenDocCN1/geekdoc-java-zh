  \n如果你读了前面的章节（关于加 1 的运算符），你可能在想是否可以操作这些运算符来加 2、加 5 或加 1000000。你可以写 `numberOfBunnies++++`\
  \ 仍然自称 Java 程序员吗？嗯，你不能。如果你尝试这样做，编译代码时会出现一条错误信息。\n\n\n\n\n你可以做什么？幸运的是，Java 有许多你可以使用的赋值运算符。通过`assignment\
  \ operator`，你可以对任何你想要的内容进行加、减、乘、除操作。你还可以进行其他酷炫的操作。列表 4-7 包含了大量的赋值运算符（那些带有等号的）。图\
  \ 4-16 显示了运行列表 4-7 的输出。\n\n![该图像显示了 248 分如何转换为硬币的详细说明。它指出从 248 分中，你可以得到 9 个四分硬币、2\
