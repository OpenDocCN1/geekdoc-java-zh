  \n### JShell 与我的对话\n\n当你运行 `JShell` 时，对话如下：\n\n```jshell\nvar amountInAccount =\
  \ 0.0;\n0.0\njshell> var weightOfAPerson = 150;\n150\njshell> var elevatorWeightLimit\
  \ = 1400;\n1400\njshell> var numberOfPeople = elevatorWeightLimit / weightOfAPerson;\n\
  9\n```\n\n关于 `JShell` 有几点注意：\n\n*   **你不需要输入整个程序。**在图 4-7 中，我输入：\n    ```jshell\n\
  \    var amountInAccount = 0.0;\n    ```\n    `JShell` 响应为 0.0。\n*   **分号在很大程度上是可选的。**在图\
  \ 4-7 中，我输入：\n    ```jshell\n    var weightOfAPerson = 150;\n    ```\n    `JShell`\
  \ 响应为 150。\n*   **JShell 在你输入每一行后立即响应。**在图 4-7 中，我输入：\n    ```jshell\n    var elevatorWeightLimit\
  \ = 1400;\n    ```\n    `JShell` 告诉我 1400。\n*   **你可以混合不同程序的语句。**在图 4-7 中，我输入：\n\
  \    ```jshell\n    var numberOfPeople = elevatorWeightLimit / weightOfAPerson;\n\
  \    ```\n    `JShell` 告诉我 9。\n*   **你甚至可以在不使用变量的情况下从 JShell 获取答案。**在图 4-7 中，我询问：\n\
  \    ```jshell\n    42 + 7\n    ```\n    `JShell` 慷慨地回答 49。\n\n![提示](img/tip.png)\
  \ 在运行 `JShell` 时，你不需要重新输入已经输入过的命令。你甚至不需要复制粘贴命令。如果你按一次上箭头键，`JShell` 会显示你最近一次输入的命令。如果你按两次上箭头键，`JShell`\
  \ 会显示倒数第二条命令。以此此类推。当 `JShell` 显示命令时，你可以按左、右箭头键移动到命令中间的任何字符。你可以修改命令中的字符。最后，当你按下回车键时，`JShell`\
  \ 会执行修改后的命令。\n\n要结束 `JShell` 的运行，输入 `/exit`（以斜杠开头）。但 `/exit` 只是你可以给 `JShell` 的许多命令中的一种。要询问\
  \ `JShell` 你可以使用哪些其他类型的命令，请输入 `/help`。\n\n\n\n\n\n![Tip](img/tip.png) 运行 JShell\
