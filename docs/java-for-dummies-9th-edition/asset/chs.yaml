  \ day` 输出通过不同的路径到达你的计算机屏幕。因此它们并不总是按照预期的顺序出现。\n\n代码列表 14-2 中的 `print` 和 `println`\
  \ 调用指向了你的老朋友 `System.out`。但 `printStackTrace` 并没有直接写入 `System.out`。`printStackTrace`\
  \ 方法写入一个名为 `System.err` 的地方，默认情况下它显示在与 `System.out`相同的位置。当你将 `System.out.println`\
  \ 调用与 `printStackTrace` 调用混合时，Java 显示信息的顺序是不可预测的。有办法可以调整代码，使 `System.out` 和 `System.err`\
