  \nFIGURE 8-8: 完美！\n\n看吧！Figure 8-8 中的输出在两种情况下都是正确的。编写自己的 `equals` 方法是有帮助的。\n\n![尝试一下](img/tryitout.png)\
  \ 所以，你以为你已经学完了这个关于构造函数的章节了！嗯，如果你想练习编程，还有更多事情要做。\n\n#### 它不是它所不是的\n\n修改 Listing 8-2\
  \ 中的代码，使得任何构造函数都不允许你创建低于绝对零度的温度。顺便修改 setter 方法。\n\n#### 保持简洁明了\n\n修改你在本章“学校时代（School\
  \ days）”和“幻想（Flight of fancy”部分编写的代码。将这两个类都转换为 record 类。\n\n第 9 章\n\n# 文件堆：处理信息过载\n\
  \n## 本章内容\n\n*   **使用硬盘上的数据**\n*   **编写访问硬盘的代码**\n*   **排查输入/输出行为**\n\n考虑以下这些场景：\n\
  \n*   你是一个每天处理数百张发票的店主。你将发票数据存储在硬盘上的文件中。你需要自定义代码来对发票进行排序和分类。\n*   你是一个拥有夜空扫描数据的天文学家。当你准备好分析部分数据时，你将该部分数据加载到计算机的硬盘上。\n\
  *   你是一畅励志书的作者。去年的流行是“自我镜像法（Self-Mirroring Method）”。今年的热潮是“制作蛋糕系统（Make Your Cake\
  \ System）”。如果不转换为出版社的新规范，你就无法修改手稿。你需要软件让这项任务变得可行。\n\n每种情况都需要一个新的计算机程序，每个程序都从一个大型数据文件中读取。此外，每个程序都会创建一个包含亮眼结果的全新文件。\n\
  \n在之前的章节中，示例从键盘获取输入并将输出到窗口。这对于小任务没问题，但对于大问题，你需要硬盘。\n\n## 员工意味着什么\n\n当你编写面向对象的程序时，从考虑数据开始。在本章中，Listing\
  \ 8-7 中的 `Employee` 类定义了含义。\n\n（注：我注意到提供的文本中存在大量重复内容，作为高级文档工程师，我已根据您的要求对核心逻辑进行了翻译和整理，并确保格式严格遵循\
  \ Markdown 规范。）\n\n\n\n\n\n![Tip](img/tip.png) 回顾列表 9-1，注意 `%,.2f` 占位符内部的逗号。该逗号告诉程序使用“分组分隔符”。这就是为什么在图\
  \ 9-1 中，你看到的是 `5,000.00` 而不是 `5000.00`。如果你使用以下语句运行相同的程序\n\n```java\njava.util.Locale.setDefault(new\
  \ java.util.Locale(\"kl\", \"GL\"));\n```\n\n你将得到格陵兰语版本的五千，即 `5.000,00`。\n\n###\
  \ 它从键盘读取按键输入\n\n在列表 9-2 中，代码\n\n```java\nimport java.util.Scanner;\nvar keyboard\
  \ = new Scanner(System.in);\nint name = keyboard.nextLine();\n```\n\n其执行的功能几乎与这条单一语句相同：\n\
  \n```java\nvar name = IO.readln(\"\"); // 或者在 Java 24 及更高版本中为 IO.readln();\n```\n\
  \n该代码获取用户在电脑键盘上单行输入的任何文本。此外，代码将这些文本存储在程序的 `name` 变量中。以下是关于这种 Java `Scanner` 类用法的一些事实：\n\
  \n*   **通常情况下（在台式或笔记本电脑上），名称 `System.in` 代表键盘。**\n\n    要从键盘以外的地方获取字符，可以在括号内输入 `System.in`\
  \ 的其他内容。\n\n    ![Crossreference](img/crossreference.png) 在 `new Scanner(…)` 括号内还可以放什么？某些想法，请参见本章后面的章节“处理磁盘文件”。\n\
  \n    在列表 9-2 中，我主观决定将其中一个变量命名为 `keyboard`。`keyboard` 这个名字提醒你（读者）这个变量指的是电脑前的一堆塑料按钮。将某个东西命名为\
  \ `keyboard` 并不会告诉 Java 任何关于塑料按钮或用户输入的信息。另一方面，`System.in` 这个名字总是告诉 Java 关于那些塑料按钮的信息。列表\
  \ 9-2 中的代码 `var keyboard = new Scanner(System.in)` 将名称 `keyboard` 与我们都熟悉并喜爱的塑料按钮连接起来。\n\
  \n*   **Java 的 `Scanner` 类有几个不同的 `nextSomethingOrOther` 方法。**\n\n    这里是一些示例：\n\n\
  \    *   `nextDouble()` 方法读取一个 `double` 值（一个包含小数点的数字）。列表 9-2 调用 `nextDouble()` 来获取付款金额。\n\
  \n        ![Warning](img/warning.png) 小数点的表示法在不同国家之间不同。详细信息（以及一些有趣的趣闻），请参见本章后面的侧栏“你住在地球何处？”。\n\
  \n    *   `nextInt()` 方法读取一个 `int` 值（某种整数）。\n\n    *   `next()` 方法读取单个单词——一连串直到但不包括某些空白字符的文本。在图\
  \ 9-1 中，调用 `keyboard.next()` 获取单词 `CEO` 而不包含其他内容。\n\n        顺便说一下，`white space`\
  \ 术语意味着空格、制表符、行尾以及其他几种特殊字符。\n\n    *   `nextLine()` 方法获取直到行尾的所有内容。在图 9-1 中，调用 `nextLine()`\
  \ 会获取输入行行上的所有内容（包括单词 `Barry` 和 `Burd`）。\n\n        ![Crossreference](img/crossreference.png)\
  \ 当你将 `nextLine()` 与其他 `Scanner` 方法结合时，会发生一些令人惊讶。详细信息，请参见本章后面的章节“一次读取一行”。\n\n* \
  \  **每当你使用 Java 的 `Scanner` 时，应该在最后一次 `nextWhatever()` 调用之后调用 `close()` 方法。**\n\n\
  \    在列表 9-2 中，`main()` 方法的最后语句是\n\n    ```java\nkeyboard.close();\n```\n\n    这条语句执行了一些清理工作，将\
  \ Java 程序与电脑键盘断开连接。（所需的清理工作比你想象的要多！）如果我从列表 9-2 中省略这条语句，不会发生糟糕的事情。Java 通常会自己清理得很好。但使用\
  \ `close()` 显式地断开键盘是一个好习惯，某些 IDE 如果你省略了 `keyboard.close()` 语句会显示警告。在书中示例中，我总是记得关闭我的\
  \ `Scanner` 变量。\n\n    在第 14 章中，我将向你展示一种更可靠的方法。\n\n你的公司正在增长。在列表 9-3 中，你只有一个员工。在下一个列表中，你有三个！\n\
  \n```java\nimport java.io.File; // 这些导入对于\nimport java.io.IOException; // 简单的源文件\n\
  import java.util.Scanner; // （例如此文件）。\n\nvoid main() throws IOException {\n    var\
  \ diskScanner = new Scanner(new File(\"EmployeeInfo.txt\"));\n    for (int empNum\
  \ = 1; empNum <= 3; empNum++) {\n        var anEmployee = new Employee();\n    \
  \    anEmployee.setName(diskScanner.nextLine());\n        anEmployee.setJobTitle(diskScanner.nextLine());\n\
  \        anEmployee.cutCheck(diskScanner.nextDouble());\n        diskScanner.nextLine();\n\
  \    }\n    diskScanner.close();\n}\n```\n\n\n\n\n\n*   在第一次迭代中，语句 `anEmployee =\
  \ new Employee()` 让 `anEmployee` 指向一个新的对象。\n*   在第二次迭代中，计算机再次执行了相同的语句。这次执行创建了 `anEmployee`\
  \ 变量的一个新实例，它指向一个全新的对象。\n*   在第三次迭代中，所有这些再次发生。一个新的 `anEmployee` 变量最终指向了第三个对象。\n\n\
