  \ 方法中，在进行此第二次调用之前，变量 `yourInterestRate` 被赋值为值 `7.00`。调用本身 `yourAccount.getInterest(yourInterestRate)`\
  \ 指的是 `yourAccount` 对象以及存储在 `yourAccount` 对象字段中的值。（再次参见图 7-5）。所以，当调用发生时，表达式 `balance\
  \ * percentageRate / 100.00` 代表 `55.63 * 7.00 / 100.00`。\n\n![“图片显示了一段包含两个个人 Barry\
