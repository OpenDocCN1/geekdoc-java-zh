  \ 中，如果我不小心将\n\n`@Override`\n\n`public double findPaymentAmount(double hours) {`\n\
  \n改为 `double hours` 而不是 `int hours`，编译器会提醒我我的新 `findPaymentAmount` 方法并没有真正覆盖列表 10-4\
  \ 中的任何内容。\n\nJava 还有其他类型的注解。要列表列表请访问 [`https://docs.oracle.com/javase/tutorial/java/annotations/predefined.html`](https://docs.oracle.com/javase/tutorial/java/annotations/predefined.html)。\n\
  \n![技术细节](img/technicalstuff.png) Java 的 `@Override` 注解是可选的。如果你从列表 10-6](#c10.xhtml_c10-fea-0006)\
  \ 中移除 `@Override` 单词，你的代码仍然可以运行。但 `@Override` 注解为你的代码提供了额外的安全性。通过 `@Override`，编译器会检查你是否在做你想的事（即覆盖父类的一个方法）。并且向乔治·奥威尔致歉，某些类型的注解比其他类型更不可可选。只有当你愿意用大量的未注解代码来替换注解时，你才能从代码中省略某些注解。\n\
