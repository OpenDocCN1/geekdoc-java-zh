  ```\n\n### 写入文件\n\n列表 13-3 中的代码使用了本书其他章节和小节中的技巧。代码中唯一的新功能是使用 `PrintStream` 写入磁盘文件。想一书书中任何调用\
  \ `System.out.print` 或 `out.println` 或其变体的示例。当你调用这些方法之一时，内部*到底*发生了什么？\n\n名为 `System.out`\
  \ 的东西是一个对象。该对象定义在 Java API 中。事实上，`System.out` 是一个名为 `java.io.PrintStream` 的类的实例（对它的好朋友们来说就叫\
  \ `PrintStream`）。现在，每个从 `PrintStream` 类创建的对象都拥有名为 `print` 和 `println` 的方法。就像列表 7-4\
  \ 中的每个 `Account` 实例（在第 7 章中）都有 `display` 方法一样，名为 `out` 的 `PrintStream` 实例也有 `print`\
  \ 和 `println` 方法。当你调用 `System.out.println` 时，你是在调用一个属于 `PrintStream` 实例的方法。\n\n\
  好了，那又怎样？嗯，`System.out` 代表你电脑屏幕上的某个文本区域。如果你创建了自己的 `PrintStream` 对象并让该对象指向一个磁盘文件，那么该\
  \ `PrintStream` 对象就指向该文件。当你调用该对象的 `print` 方法时，你就会将文本写入你硬盘上的一个文件。\n\n在列表 13-3 中，当你说：\n\
