  \n# 捉迷藏\n\n放下这本书，戴上你的帽子。你一直是一个如此忠诚的读者，所以我打算带你出去吃午饭！\n\n我只有一个问题。我手头有点紧。你介意我们在去吃午饭的路上先停在自动取款机（ATM）那里取几块钱吗？另外，我们必须用你的账户。我的账户余额有点低。\n\
  \n幸运的是，自动取款机很容易使用。直接走过去并输入你的密码。输入密码后，机器会询问你想使用以下几个变量名中的哪一个作为当前余额。你有 `balance324`、`myBal`、`currentBalance`、`b$`、`BALANCE`、`asj999`\
  \ 或 `conStanTinople` 可以选择。选择好变量名，你就可以为变量的值选择一个内存位置。你可以选择 `022FFF` 到 `0555AA` 之间的任何数字。（这些数字是十六进制格式。）配置好自动取款机的软件后，你就可以轻松拿到现金了。你带螺丝刀了对吧？\n\
  \n## 良好的编程\n\n在良好的计算机编程实践方面，有一个词脱颖而出：简单性。当你编写复杂的代码时，你最不想面对的就是处理别人命名错误的变量、错综复杂的问题解决方案，或者是聪明但临忙凑合的补救措施。你想要一个整洁的接口，让你解决自己的问题，而不是解决别人的问题。\n\
  \n在我之前描述的自动取款机场景中，大问题在于机器的设计迫使你担心他人的问题。当你应该考虑为午饭取点钱时，你却在考虑变量和存储位置。当然，必须有人来解决自动取款机的工程问题，但银行客户不是那个人。\n\
  \n![记忆](img/remember.png) 这一部分关于安全（safety），而不是 Security（security）。安全代码防止你犯意外的编程错误。安全代码（完全是另一个故事）防止恶意黑客造成故意破坏。\n\
  \n所以，与计算机程序每个方面相关的一切都必须是简单的，对吧？不，不是的。有时候，为了从长远来看让事情简单，你必须在前面做大量的准备工作。建造自动取款机的人努力确保机器是防用户误操作的。机器的界面带有屏幕消息和按钮，使机器变成了一个复杂但精心设计的设备。\n\
  \n要点在于，让事情看起来简单需要一些规划。在面向对象编程中，让事情看起来简单的一种方法是防止类外部的代码直接使用类内部定义的字段。看看 Listing 7-1\
  \ 中的代码。你所在的一家公司为 `Account` 类的代码花费了 1000 万美元（每行 200 万美元！）。现在你的任务是编写 `main` 方法。你想写：\n\
  \n```java\nmyAccount.name = \"Barry Burd\";\n```\n\n但这样做会让你太深地陷入 `Account` 类的内部。毕竟，使用自动取款机的人被允许编写机器的变量。他们不能使用机器的键盘输入以下语句：\n\
  \n```java\nbalanceOnAccount29872865457 = balanceOnAccount29872865457 + 1000000.00;\n\
  ```\n\n相反，他们通过按钮以有序的方式完成工作。这就是程序员实现安全和简单的方法。\n\n为了保持良好有序，你需要通过禁止此类语句修改 Listing 7-1\
  \ 中的 `Account` 类：\n\n```java\nmyAccount.name = \"Barry Burd\";\n```\n\n以及\n\n```java\n\
  print(yourAccount.balance);\n```\n\n当然，这带来了一个问题。你是那个编写 `main` 方法代码的人。如果你不能写 `myAccount.name`\
  \ 或 `yourAccount.balance`，你该如何完成任何任务呢？答案在于被称为访问器方法（accessor methods）的东西。Listings\
  \ 7-8 和 7-9。\n\n\n\n\n注意 Listing 7-8 中的所有 setter 和 getter 方法都被声明为 `public`。这确保了任何人在任何地方都可以调用这两个方法。这里的想法是：从\
  \ `Account` 代码外部直接操作实际字段是不可能的，但你可以轻松地通过经过获准的 setter 和 getter 方法来使用这些字段。\n\n再次想一下自动取款机（ATM）。使用\
  \ ATM 的人无法输入命令来直接更改其账户 `balance` 字段中的值，但存入百万美元支票的程序却很容易遵循。制造自动取款机的人知道，如果存支票程序太复杂，会有大量客户彻底搞砸。所以这就是其中的道理——让人们不应该做的事情变得不可能，并确保人们应该做的任务变得简单。\n\
  \n![Tip](img/tip.png) 设置 setter 和 getter 方法没有什么是神圣不可侵的。如果没有人会调用某个特定的 setter 或 getter\
  \ 方法，你就不必编写它。在某些情况下，你拥有不希望其他其他代码访问的字段。因此，对于这些字段，你就不创建 setters 和 getters。\n\n![Tip](img/tip.png)\
  \ 当你创建一个设置 `balance` 字段值的方法时，你不必将方法命名为 `setBalance`。你可以将其命名为 `tunaFish` 或任何你喜欢的名称。问题在于，`setFieldname`\
  \ 命名约定（set 全小写，且 Fieldname 部分的首字母大写）是 Java 编程世界中一种风格约定。如果你不遵循这一约定，会让其他 Java 程序员感到困惑。\n\
  \n![Remember](img/remember.png) 当你调用 setter 方法时，你传递的是与被设置类型相同的值。这就是为什么在 Listing\
  \ 7-9 中，你用 `yourAccount.setBalance(55.63)` 传入的参数类型为 `double`。相比之下，当你调用 getter 方法时，你通常不需要向方法传递任何值。这就是为什么在\
  \ Listing 7-9 中，你带入一个空参数列表调用了 `yourAccount.getBalance()`。偶尔，你可能想在单条语句中同时获取并设置一个值。为了给你的账户余额增加\
  \ 1 美元，你可以写道 `yourAccount.setBalance(yourAccount.getBalance() + 1.00)`。\n\n### 使用访问方法强制规则\n\
  \n回到 Listing 7-8 并快速查看 `setName` 方法。想象将方法的赋值语句放在 `if` 语句中：\n\n```\npublic void setName(String\
  \ n) {\n    if (!n.equals(\"\")) {\n        name = n;\n    }\n}\n```\n\n现在，如果负责\
  \ Listing 7-9 的程序员编写 `myAccount.setName(\"\")`，则对 `setName` 的调用将产生任何影响。此外，由于 `name`\
  \ 字段是私有的，以下语句在 Listing 7-9 中是非合法的：\n\n```\nmyAccount.name = \"\";\n```\n\n当然，像 `myAccount.setName(\"\
  Joe Schmoe\")` 这样的调用仍然有效，因为 `\"Joe Schmoe\"` 不等于空字符串 `\"\"`。\n\n这很酷。通过私有字段和访问方法，你可以防止有人将空字符串分配给账户的\
  \ `name` 字段。通过更复杂的 `if` 语句，你可以执行任何想要的规则。\n\n#### PRIVATE EYE\n\n![Tryitout](img/tryitout.png)\
  \ 在之前的章节中，你创建了自己的 `Organization` 和 `FoodProduct` 类。在这些类中，将默认访问字段替换为私有字段。为这些字段创建\
  \ getter 和 setter 方法。在 setter 方法中，添加代码以确保 `String` 值不为空且数值不是负数。\n\n## 简化 Java\n\n\
  每个方法都属于一个类。只需思考本书书中示例中的方法调用即可。Java 的 `format` 方法存在于 `String` 类中。\n\n```\nSystem.out.println(\"\
  \ plus \" + String.format(\"$%.2f\", yourInterest) + \" interest\");\n```\n\n`parseInt`\
  \ 方法是 Java `Integer` 类的一部分。\n\n```\nint inputNumber = Integer.parseInt(input);\n\
  ```\n\nListing 7-5 中的 `display` 和 `getInterest` 方法舒适地存在于 `Account` 类中。\n\n```java\n\
