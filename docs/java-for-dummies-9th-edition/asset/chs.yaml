  Listing 13-6 使用了一个名为`条件运算符`的有趣工具。这个条件运算符接受三个表达式，并返回其中一个表达式的值。它就像一个微型的 `if` 语句。当你使用条件运算符时，它看起来像这样：\n\
  \n`conditionToBeTested` ? `expression1` : `expression2`\n\n计算机会评估 `conditionToBeTested`\
  \ 条件。如果条件为真，计算机返回 `expression1` 的值。但，如果条件为假，计算机则返回 `expression2` 的值。\n\n因此，在代码中\n\
  \n```\nsmoking ? \"yes\" : \"no\"\n```\n\n计算机检查 `smoking` 的值是否为 `true`。如果是，整个三部分表达式就代表第一个字符串\
  \ `\"yes\"`。如果不是，整个表达式就代表第二个字符串 `\"no\"`。\n\n在 Listing 13-6 中，对 `println` 的调用会导致显示\
  \ `\"yes\"` 或 `\"no\"`。显示哪个字符串取决于 `smoking` 的值是 `true` 还是 `false`。\n\n![Tryitout](img/tryitout.png)\
