  \ `ApartmentWithFees` 中的人每季度（每三个月）还要支付固定金额。创建一个 `main` 方法，显示 `House` 实例、`Apartment`\
  \ 实例和 `ApartmentWithFees` 实例的每月生活成本。\n\n### 虚方法\n\n创建一个包含四个 Java 源文件的项目。每个文件定义一个特定的\
  \ Java 类：\n\n```java\nvoid main() {\n  MyThing myThing, myThing2;\n  myThing = new\
