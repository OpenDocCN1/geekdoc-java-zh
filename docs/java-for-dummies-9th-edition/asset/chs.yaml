  \ / denominators[j]);\n  }\n  diskScanner.close();\n}\n```\n\n修复未声明的 `FileNotFoundException`\
  \ 使代码通过编译。然后注意，根据 `numbers.txt` 文件中的值，在程序运行期间可能会抛出其他异常。添加一个或多个 `try-catch` 语句来显示关于这些异常的消息，而不会让程序崩溃。\n\
  \n#### 如果损坏了，修复它\n\n添加 `try-catch` 语句或 `throws` 子句（或两者混合）来修复以下损坏的代码：\n\n```java\n\
  // 错误的代码：\nvoid main() {\n  var fileIn = new File(\"input\");\n  var fileInStrm\
  \ = new FileInputStream(fileIn);\n  var dataInStrm = new DataInputStream(fileInStrm);\n\
  \  var fileOut = new File(\"output\");\n  var fileOutStrm = new FileOutputStream(fileOut);\n\
  \  var dataOutStrm = new DataOutputStream(fileOutStrm);\n  int numFilesCopied =\
  \ 0;\n  try {\n    while (true) {\n      dataOutStrm.writeByte(dataInStrm.readByte());\n\
  \    }\n  } catch (EOFException e) {\n    numFilesCopied = 1;\n  }\n}\n```\n\n当你让代码编译后，创建一个名为\
  \ `input` 的文件并运行代码，看看它是否创建了名为 `output` 的文件。\n\n## 尝试，再尝试！\n\n从前，，我还是一个住在费城和父母住在一起的年轻人，刚开始开车。我正开车去朋友家，脑子里想着些乱七八糟的事情，这时另一辆车突然从空处出现，撞了我车的副驾驶门。这种事情被称为\
  \ `RunARedLightException`。\n\n不管怎样，两辆车仍然是可以行驶的，我们正被困在一个繁忙的十字路口中间。为了避免造成交通拥堵，我们都靠在了最近的路缘上。我慌乱地寻找我的驾照并打开门下车。\n\
  \n就在那时，第二次事故发生了。当我正下车时，一辆城市公交车经过。公交车撞了我，并将我撞在我的车上翻了好几次。这种事情被称为 `DealWithLawyersException`。\n\
