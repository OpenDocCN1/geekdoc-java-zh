  \n[图 9-5：]：调用 `nextDouble` 和 `nextLine`。\n\n所以，在读取数字 `5000.00` 之后，你需要*两次* `nextLine`\
  \ 调用来抓取名字 `Har Ritter`。我通常犯的错误是忘记了这两个调用中的一个。\n\n![警告](img/warning.png) 再次查看图 9-3\
  \ 中的文件。为了让本节的代码正确工作，在最后一个 `10000.00` 之后你必须有一个换行符。如果没有，最后对 `nextLine` 的调用会让你的程序崩溃。错误信息显示为\
  \ `NoSuchElementException: No line found`。\n\n\n\n\n\n![技术细节](img/technicalstuff.png)\
  \ 我总是对每种编程语言扫描方法中发现的各种怪癖感到惊讶。例如，图 9-3 中从文件中读取的第一个 `nextLine` 会吞掉文件的 `Barry Burd[换行符]`。但该\
  \ `nextLine` 调用将 `Barry Burd`（不带换行符）传递给运行中的代码。因此，`nextLine` 寻找换行符，然后 `nextLine`\
  \ 丢失了换行符。是的，这是一个微妙的点。而且不，这个微妙的点几乎没有给任何人带来过问题。\n\n![技术细节](img/technicalstuff.png)\
  \ 如果关于 `nextDouble` 和 `nextLine` 的这些事情让你感到困惑，请不要将其归咎于 Java。在任何计算机编程语言中，混合输入调用都是精细的工作。而真正糟糕的是，每种编程语言处理问题的方式略有不同。你在\
  \ Java 中学到的关于 `nextLine` 的知识有助于你理解在学习 C++ 或 Visual Basic 时遇到的问题，但它并不能告诉你所有的细节。每种语言的细节都是该语言所有的。（是的，这是一个巨大的痛苦。但因为所有的计算机程序员最终都会变得富有又名，这种痛苦最终会有回报的。）\n\
  \n## 做好收尾工作\n\n对于普通计算机用户来说，键盘的感觉完全不像存储在计算机硬盘上的文件。但磁盘文件和键盘输入有许多共同点。事实上，计算机操作系统的基本原则规定，对于程序员来说，两种输入之间的任何差异越模糊越好。作为一名\
  \ Java 程序员，你应该以几乎相同的方式对待磁盘文件和键盘输入。这就是为什么 列表 9-3 包含一个 `diskScanner.close()` 调用。\n\
  \n当你运行一个 Java 程序时，通常会执行 `main` 方法的语句，从方法体中的第一条语句开始，到方法体中的最后一条语句结束。在此过程中你会走绕路，跳过\
  \ `else` 部分并进入方法体，但基本上你是在 `main` 方法的结束处完成语句执行的。这就是为什么在 列表 9-3 中，对 `close` 的调用位于\
  \ `main` 方法体的末尾。当你运行 列表 9-3 中的代码时，你最后做的一件事就是与磁盘文件分离。幸运的是，这种分离发生在你执行了所有 `nextLine`\
  \ 和 `nextDouble` 调用之后。\n\n### 记录存档\n\n![尝试一下](img/tryitout.png) 在在本章之前，你创建了你自己的\
  \ `PlaceToLive` 类的实例并显示了关于这些实例的信息。修改你代码的文本版本，使其从磁盘文件获取每个实例的特征（地址、卧室数量和面积）。\n\n#\
  \ 第 10 章\n\n# 节省时间和金钱：重用现有代码\n\n## 本章内容\n\n- ![项目](img/check.png) **为旧代码注入新生命**\n\
  - ![项目](img/check.png) **调整你的代码**\n\n- ![项目](img/check.png) **在不花费巨资的情况下更改**\n\n\
  **reuse** /ree-YOOSS/ *名词* 第 *n* 次使用某物的行为，其中 *n* 大于 1。例如：“严禁重用 *Java For Dummies*\
  \ 第 9 版中的材料。”\n\n重用是好事，但在许多情况下，重用是稀缺的。例如，在美国，农业部估计该国 30% 到 40% 的食物被浪费了。而且根据一个来源，世界上只有\
  \ 9% 的塑料被回收了。\n\n信息也会被浪费。当我为第八版修订这一章时，我决定不重用第七版的章节介绍引言。（那个引言中虚构的故事一点一点也不好笑。）在绝望中，我查看了我的其他书籍，试图找到一个可以重用到本章的引言。但一无所获！我空手而归。\n\
  \n我甚至无法重用段落来解释常见概念。我在另一本书中对 Java 类的描述在本书中效果并不好。我甚至经历过因为 第 3 章 中的一个微小更新而不得不删除几个章节中的某些部分。\n\
  \n毫无疑问！重用是一种珍贵的商品，而且供应非常短缺。如果每种软件都能完全按照你想让它做的去做那不是很好吗？在一个理想的世界里，你可以购买一个程序，让它立即运行，无缝地接入新环境，并在你的需求变化时轻松更新它。遗憾的是，这种软件并不存在。（这种东西根本不存在。）事实是，无论你想做什么，你都能找到可以完成部分内容的软件，但不能完成全部。\n\
  \n这是面向对象编程成功的原因之一。多年来，公司一直在购买预写的代码，结果发现这些代码并没有按照它们想要的方式去工作。那么，公司是如何处理的呢？他们开始乱改代码。他们的程序员深入挖掘程序文件，更改变量名，移动子程序，重做公式，并通常让代码变得更糟。现实情况是，如果一个程序本身没有按照你想让它做的去做。\n\
  \n有了面向对象编程，情况发生了巨大的变化。面向对象编程的核心是是可以修改的。通过正确的编写，你可以利用已有的功能，添加你自己的功能。\n\n## 定义子类（全职或兼职意味着什么）\n\
  \n去年，你的公司花了 1000 万美元买了一个软件。（糟糕了！你可以在 *Java For Dummies* 第 9 版的第 9 章中找到该软件。）\n\n\
  该软件是以 `Employee.class` 文件的形式提供的。Burd Consulting（创建该软件的公司）不让你知道内部细节。因此，你没有 列表 9-3\
  \ 中的 `Employee.java` 文件。\n\n列表 10-1 什么是 Employee？\n\n```java\npublic class Employee\
  \ {\n    private String name;\n    private String jobTitle;\n\n    public void setName(String\
  \ name) {\n        this.name = name;\n    }\n\n    public String getName() {\n \
  \       return name;\n    }\n\n    public void setJobTitle(String jobTitle) {\n\
  \        this.jobTitle = jobTitle;\n    }\n\n    public String getJobTitle() {\n\
  \        return jobTitle;\n    }\n\n    public void cutCheck(double amountPaid)\
  \ {\n        System.out.print(\"Pay to the order of \" + name);\n        System.out.print(\"\
  \ (\");\n        System.out.print(jobTitle);\n        System.out.print(\") ***$\"\
  );\n        System.out.println(String.format(\"%,.2f\", amountPaid));\n    }\n}\n\
  ```\n\n你可以运行 `Employee.class` 文件中的字节码。你还可以阅读名为 *Employee.html* 的网页文档。\n\n![记住](img/remember.png)\
  \ 第 2 章 描述了以 `.java` 结尾和以 `.class` 结尾的文件之间的区别。编写使用 `Employee` 类的代码不需要硬盘上存在 `Employee.java`\
  \ 文件。你只需要 `Employee.class` 文件。\n\n\n\n\n从去年这个时候以来，你的公司已经成长了。与过去不同，你的公司现在有两种员工：全职员工和兼职员工。每位全职员工都有固定的周薪。（如果员工在晚上和周末工作，作为对这种巨大付出的回报，员工将得到诚挚的握手。）相比之下，每位兼职员工按小时工资。。公司从每位全职员工的工资单中扣除一部分费用，用于支付公司的福利方案。然而，兼职员工不享受福利。\n\
  \n问题在于你公司去年购买的软件是否能跟上公司的增长。你投资了一个非常有用的程序来处理员工和他们的工资，但该程序无法区分你的全职和兼职员工。你有几个选择：\n\n\
  *   **给隔壁邻居打电话，他那个 12 岁的孩子比你公司的任何人都更懂计算机编程。** 让这个傲慢的小不点把员工软件拆解、重写，并带上你公司要求的所有更改和新增功能交还给你。\n\
  \n    转念一，你不能这样做。无论那个孩子有多聪明，员工软件的复杂性都可能让那个孩子感到困惑。当你拿回软件时，它将充满了错误和不一致之处。此外，你甚至没有\
  \ `Employee.java` 文件可以给那个孩子。你拥有的只有 `Employee.class` 文件，它是字节码。而字节码无法用文本编辑器读取或修改。（参见第\
  \ 2 章）。此外，你的孩子刚打了了邻居的孩子。你不想让邻居获得看到你哀求那个天才孩子帮助的快感。\n\n*   **废弃那套价值 1000 万美元的员工软件。**\
  \ 说服公司里的某人从头重写该软件。\n\n    换句话说，和你的时间和金钱告别吧。\n\n*   **为员工软件编写一个新的前端。** 也就是说，编写一段代码对全职员工进行初步处理，然后将初步结果交给你那价值\
  \ 1000 万美元的软件。对兼职员工也这样做。\n\n    这个想法可能可行，也可能导致灾难。你确定现有的员工软件中有方便的钩子吗？（也就是说，员工软件是否包含允许你的前端软件轻松将初步数据发送到昂贵的员工软件的入口点？）*记住：*这个计划将现有软件视为一个巨大的单体块，这可能会变得笨拙。在你的前端代码和现有的员工程序之间分配工作是困难的。而且，如果你在现有的黑盒代码上层层叠加，你可能会得到一个非常低效的系统。\n\
  \n*   **给向你出售软件的 Burd Brain Consulting 公司打电话。** 告诉 Burd 博士，你希望他软件的下一个版本能够区分全职和兼职员工。\n\
  \n    “没问题，”Burd 博士说，“在下一个财季度开始前准备好。”那天晚上，Burd 博士给他的隔壁邻居打了一个秘密电话……。\n\n*   **创建两个名为\
  \ `FullTimeEmployee` 和 `PartTimeEmployee` 的新 Java 类。** 让每个新类扩展昂贵的 `Employee`类的现有功能，但让每个新类为特定类型的员工定义它们自己的专门功能。\n\
  \n    干得好！图 10-1 显示了你想创建的结构。\n\n![“一张使用磁盘扫描器处理员工数据的 Java 程序的流程图。步骤序列包括读取并为员工属性赋值，例如姓名、职位和工资金额。具体示例包括'empNum\
  \ = 1;' 以及将员工姓名设置为'Barry Burd'（CEO）和'Harriet Ritter'（队长）。”](img/9781394289240-fg1001.png)\n\
  \n图 10-1： `Employee` 类的族树。\n\n### 创建子类\n\n列表 10-1 定义了一个 `Employee` 类。你可能无法访问 `Employee.java`\
  \ 文件，但如果你有编译后的 `Employee.class` 文件和一些关于代码的文档，你可以扩展 `Employee` 的定义来创建新的、更专业的类。因此，在列表\
  \ 10-2 中，我定义了一个新类：`FullTimeEmployee` 类。\n\n列表 10-2 什么是 FullTimeEmployee？\n\n```\n\
  public class FullTimeEmployee extends Employee {\n  private double weeklySalary;\n\
  \  private double benefitDeduction;\n\n  public void setWeeklySalary(double weeklySalary)\
  \ {\n    this.weeklySalary = weeklySalary;\n  }\n\n  public double getWeeklySalary()\
  \ {\n    return weeklySalary;\n  }\n\n  public void setBenefitDeduction(double benefitDeduction)\
  \ {\n    this.benefitDeduction = benefitDeduction;\n  }\n\n  public double getBenefitDeduction()\
  \ {\n    return benefitDeduction;\n  }\n\n  public double findPaymentAmount() {\n\
  \    return weeklySalary - benefitDeduction;\n  }\n}\n```\n\n\n\n\n![技术细节](img/technicalstuff.png)\
  \ 为什么列表 10-3 的标题将该代码称为“虚假的”？（代码会觉得被侮辱吗？）嗯，列表 10-3 与列表 10-1 和 10-2 中的继承情况之间的主要区别在于：子类不能直接引用父类的私有字段。要对父类的私有字段进行任何操作，子类必须调用父类的\
  \ getter 和 setter 方法。在之前的列表 10-2 中，调用 `setName(\"Rufus\")` 是合法的，但代码 `name=\"Rufus\"\
  ` 就不合法。如果你相信你在列表 10-3 中读到的所有内容，你会认为 `FullTimeEmployee` 类中的代码可以执行 `name=\"Rufus\"\
  `。事实上，它不能。（哎呀，这真是一个微妙的点啊！）\n\n### 创建子类会养成习惯\n\n当你习惯了扩展类之后，你可能会“沉迷于扩展”。如果你创建了一个 `FullTimeEmployee`\
  \ 类，你可能也可以创建一个 `PartTimeEmployee` 类，如列表 10-4 所示。\n\n列表 10-4 什么是 PartTimeEmployee？\n\
  \n```java\npublic class PartTimeEmployee extends Employee {\n  private double hourlyRate;\n\
  \  public void setHourlyRate(double hourlyRate) {\n    this.hourlyRate = hourlyRate;\n\
  \  }\n  public double getHourlyRate() {\n    return hourlyRate;\n  }\n  public double\
  \ findPaymentAmount(int hours) {\n    return hourlyRate * hours;\n  }\n}\n```\n\n\
  与 `FullTimeEmployee` 类不同，`PartTimeEmployee` 没有薪水或扣除。相反，`PartTimeEmployee` 有一个 `hourlyRate`\
  \ 字段。（添加一个 `hoursWorked` 字段也是一种可能。我选择不这样做，认为兼职员工的工作小时数每周可能会发生变化。）\n\n### 使用子类\n\n\
  上一节讲述了一个关于创建子类的故事。这是一个好故事，但它是不完整的。创建子类没问题，但除非编写代码来使用它们，否则你无法从这些子类中获得任何益处。\n\n列表\
