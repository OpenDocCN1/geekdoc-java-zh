  \ 0 或 1 被称为 `bit`（位）。\n\n事实证明，代表字母 `J` 的序列 `0101010` 也可以代表数字 7。同样的序列也可以代表 `1.0396086360366×10^-4`。事实上，如果这些位被解释为屏幕像素，同一个序列可以表示图\
