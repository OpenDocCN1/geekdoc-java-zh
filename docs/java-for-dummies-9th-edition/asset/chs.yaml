  在列表 13-1 中，有两个 `for` 循环：第一个循环读取人数，第二个循环写入人数。\n\n### 制表符和其他特殊字符\n\n在列表 13-1 中，某些对\
  \ `print` 和 `println` 的调用使用了 `\\t` 转义序列。它被称为转义序列是因为 `\\t` 代表了屏幕上的制表符。Java 有一些转义序列，如表\
  \ 13-1 所示。\n\n| Sequence | 含义 |\n| --- | --- |\n| `\\b` | 退格 |\n| `\\t` | 水平制表 |\n\
  | `\\n` | 换行 |\n| `\\f` | 换页 |\n| `\\r` | 回车 |\n| `\\\"` | 双引号 |\n| `\\'` | 单引号\
  \ |\n| `\\\\` | 反斜杠 |\n\nTABLE 13-1: 转义序列\n\n图 13-3 我在 Mac Terminal 上运行而看起来良好。但在\
