  \n### 为自己简化生活\n\n除了你在列表 13-1 中看到的之外，在 Java 中还有另一种填充数组的方法：使用数组初始化。当你使用数组初始化时，你甚至不需要告诉计算机有多少个组件。计算机会为你计算。\n\
  \n这里是另一个技巧：你还可以使用 Java 的增强型 `for` 循环（来自第 12 章）来遍历数组。列表 13-2 包含了数组初始化和增强型 `for` 循环。\n\
  \nLISTING 13-2 简洁高效的代码\n\n```java\nvoid main() {\n    int[] guests = {1, 4, 2, 0,\
  \ 2, 1, 4, 3, 0, 2};\n    println(\"Room\\tGuests\");\n    int roomNum = 0;\n  \
  \  for (int numGuests : guests) {\n        print(roomNum++);\n        print(\"\\\
  t\");\n        println(numGuests);\n    }\n}\n```\n\n列表 13-2 产生的输出与列表 13-1 相同，并且列表\
  \ 13-2 要易读得多。有几个原因：\n\n*   把数据放在程序中，正如我在列表 13-2 中做的那样，通常不是一个好主意。\n\n\n\n\n时光流逝。酒店客人来来往往去。在本章稍后的写入文件章节中，你将找到如何修改\
  \ `GuestList.txt` 文件。这没问题，因为人们经常要写入文件。但在列表 13-2 中修改数字则是另一回事。没有人希望每当客人入住或离开时都要编辑程序。\n\
  \n- **数组初始化并不灵活。**\n之所以称为初始化是有原因的。你可以使用此功能初始化数组（如列表 13-2 所示），但你无法在后续代码中使用它为现有变量赋值。例如，在列表\
  \ 13-2 中初始化是非常棒的。但以下代码应该被挨打：\n\n  ```\n  // 错误的代码\n  int[] guests;\n  guests = {1,\
  \ 4, 2, 0, 2, 1, 4, 3, 0, 2};\n  ```\n\n- **增强型`for`循环（如列表 13-2 所示）无法跟踪数组索引。**\n\
  \  在列表 13-1 中，两个循环都有一个名为`roomNum`的计数器。这使得在输出中打印每个房间号变得简单。参见图 13-3。\n\n但增强型`for`循环没有自己的计数器。为了打印列表\
  \ 13-2 中的`roomNum`值，你必须创建自己的`roomNum`变量并在每次循环时更新它。这只是少量的额外工作。但在复杂的程序中，这种额外工作更容易出错（我知道，我犯过这些错误）。\n\
  \n- **列表 13-1 中的代码是传统的 Java `main`方法。相比之下，列表 13-2 中的代码是简单的文件。**\n  这使得列表 13-1 比`public\
  \ class ShowGuests { public static blah, blah …`业务更冗长。\n\n  所以，为什么你必须涉足这些？原因之一是大多数\
  \ main 方法都是这样写的。事实上，在 Java21 之前，所有的 main 方法都是这样写的。那是 30 年的冗长 Java 代码。如果不突出其中一些 main\
  \ 方法，我写不出这本 Java 书。\n\n### 反向打印\n![试一看](img/tryitout.png) 修改列表 13-1 中的代码，使其按房间号倒序显示房间（从\
  \ 9 号房间到 0 号房间）。\n\n### 画标记\n首先，用户在键盘上输入五个数字。然后程序显示五行字符，每行的星号数量与用户输入的某个数字相同。程序的运行结果如下：\n\
  \n```\n5\n3\n9\n0\n10\n*****\n***\n**********\n```\n\n### 寻找最大值\n在列表 13-1 末尾添加代码，使程序找到人数最多的房间。程序的新输出可能如下：\n\
  \n```\n4 guests in Room 1\n4 guests in Room 6\n```\n要实现这一点，创建一个名为`largestSoFar`的变量。逐个检查数组元素，每当发现新纪录时就更新`largestSoFar`的值。\n\
  \n### 寻找总和\n在列表 13-1 末尾添加代码，使程序报告汽车旅馆的总人数。要实现这一点，创建一个名为`runningTotal`的变量。逐个检查数组的值，将每个值累加到大的`runningTotal`上。\n\
  \n## 数组 VS ArrayList：终对决\n本章的数组与第 12 章中的`ArrayList`集合相似。因此，如果你需要一个存储多个值的结构，你会选择哪一个？数组还是`ArrayList`？这完全取决于你想做什么。\n\
  \n- **选择`ArrayList`的原因：**\n  - `ArrayList`可以增长和收缩。\n    在创建`ArrayList`实例后，你可以向其添加任意数量的值。唯一的限制是你的\
  \ Java 应用程序的内存大小。这是一个非常高的限制。\n    相比之下，每个数组都有固定的大小。当你声明并创建一个数组时，你告诉 Java 数组有多少个元素。你无法在程序代码后期改变主意。在执行下行代码后：\n\
  \    ```\n    int[] guests = new int[10];\n    ```\n    在列表 13-1 中，你不能向`guests`数组放入超过十个值。Java\
  \ 根本不允许。\n  - `ArrayList`拥有一系列丰富的有用方法。\n    例如，在第 12 章中，在列表 13-2 中，你可以通过语句`vocabulary.add(2)`。\n\
  \n- **选择数组的原因：**\n  - 数组效率更高。\n    本章的数组与第 12 章中的`ArrayList`集合相似。（不幸的是）对`ArrayList`的某些操作往往比数组要慢。\n\
  \  - 数组可以存储基本类型。\n    第 12 章说`ArrayList`不能存储基本类型值。相反，你必须在`ArrayList`中放入`Integer`实例，例如：\n\
  \    ```\n    ArrayList<Integer> list = new ArrayList<>();\n    ```\n    但数组存储`int`值没有问题：\n\
  \    ```\n    int[] guests = new int[10];\n    ```\n  - `ArrayList`的表示法是`import\
  \ java.util.ArrayList`。\n\n![技术细节](img/technicalstuff.png) 什么让`ArrayList`比数组更灵活？在底层，Java\
  \ 将`ArrayList`的值存储在固定大小的数组中。当你执行超出数组大小的添加时，Java 会创建一个更大的数组并将旧数组的值复制进去。这很不错，不是吗？\n\
  \n\n\n\n```java\nif (roomNum == 10) {\n    println(\"Sorry, no v cancy\");\n} else\
