  \ System.out.println(j);\n        System.out.println(k);\n    }\n}\n```\n\n## 静态化（寻找团队平均值）\n\
  \n考虑到列表 11-1 和 11-2 中的代码，你决定想找到球队的整体击球率。与其仔细研究比赛日志并进行细致分析，你倾向于寻找图 11-2 中数字的平均值。那是球员平均值的平均值。使用这种策略，图\
  \ 11-2 中的球队平均值约为 .106。毫无疑问：Hankies 队需要一些强化训练。\n\n当球员们在球场上练习时，你有一个哲学问题要回答。存储你的整个团队平均总计的变量应该放在哪里？你是否应该在列表\
  \ 11-1 中的 `Player` 类中添加更多字段？在考虑了这种可能性后，你还有一些顾虑。`Player` 类的实例仅代表团队中的某一个球员。单个球员有什么理由存储整个团队的整体数据呢？当然，你可以让代码运行起来，但这并不是解决该问题的优雅方案。\n\
  \n幸运的是，Java 有了它的 `static` 关键字。任何被声明为 `static` 的内容都属于整个类，而不属于该类的任何特定实例。当你创建 `static`\
  \ 字段 `totalOfAverages` 时，你只创建了该字段的一个副本。这个副本与整个类保持。无论你创建多少个类的实例——一个、九个还是一个都没有——你都只有一个\
  \ `totalOfAverages` 字段。而且，顺便如此，你又创建了另一个 `static` 字段（`playerCount`）和一个 `static` 方法（`findTeamAverage`）。要明白我的意思，请看图\
  \ 11-11。\n\n![“图像是一个完全黑色的正方形，没有任何可见的内容、文本或可区分的特征。它代表一个空白或空区域，可以用于各种用途，如占位符、背景或传达空或缺失的感觉。”](img/9781394289240-fg1111.png)\n\
  \n图 11-11： 一些静态是非静态字段及方法。\n\n列表 11-1 中的 `Player` 类执行了它原本应该做的事情。而且，在考虑了这种可能性后，你还有一些顾虑。`Player`\
  \ 类的实例仅代表团队中的某一个球员。单个球员有什么理由存储整个团队的整体数据呢？当然，你可以让代码运行起来，但这并不是解决该问题的优雅方案。\n\n幸运的是，Java\
  \ 有了它的 `static` 关键字。任何被声明为 `static` 的内容都属于整个类，而不属于该类的任何特定实例。当你创建 `static` 字段 `totalOfAverages`\
  \ 时，你只创建了该字段的一个副本。这个副本与整个类保持。无论你创建多少个类的实例——一个、九个还是一个都没有——你都 `totalOfAverages` 字段。而且，顺便如此，你又创建了另一个\
  \ `static` 字段（`playerCount`）和一个 `static` 方法（`findTeamAverage`）。要明白我的意思，请看图 11-11。\n\
  \n列表 11-1 中的 `Player` 类执行了它原本应该做的事情。而且，在考虑了这种可能性后，你还有一些顾虑。`Player` 类的实例仅代表团队中的某一个球员。单个球员有什么理由存储整个团队的整体数据呢？当然，你可以让代码运行起来，但这并不是解决该问题的优雅方案。\n\
  \n### 这么多静态！\n\n在列表 11-3 中，我将 `playerCount` 声明为 `static`。这是正确的，因为像 `playerCount`（团队人数）这样的东西不应该属于单个球员，让每个\
  \ `Player` 实例跟踪自己的计数是愚蠢的（“我知道团队有多少成员。我只是一个团队成员！”如果你有九个独立的 `playerCount` 字段，要么每个字段都存储数字\
  \ 1（这是没用的），要么你会有九份不同的计数副本，这既浪费资源又容易出错。通过使 `playerCount` 静态，你将 `playerCount` 保留在一个地方，即它所属的地方。\n\
  \n同样的理由适用于 `totalOfAverages`。最终，`totalOfAverages` 字段将存储球员击球率的和。对于所有九名成员，这个总和为 .956。\n\
  \n只有当调用 `findTeamAverage` 方法时，计算机才会实际计算 Hankies 球队的整体击球率。你希望这个 `findTeamAverage`\
  \ 方法是 `static` 的。如果没有 `static` 关键字，会有九个 `findTeamAverage` 方法——每个 `Player` 类实例一个。这没有太大意义。每个实例都会独立计算\
  \ `totalOfAverages` 除以 `playerCount`，并且这九次计算都会产生相同的答案。\n\n通常情况下，所有实例共有的任务（且对每个实例都产生相同结果的任务）都应该编码为\
  \ `static` 方法。\n\n\n\n\n要计算团队成员击球率的平均值，你需要将所有团队成员平均值的总和除以团队人数。在列表 11-3 中，这是 `totalOfAverages\
  \ / playerCount`。列表 11-3 中的 `playerCount` 和 `totalOfAverages` 字段是静态的。无论你有一个、九个还是一千个团队成员，`playerCount`\
  \ 字段只有一份，`totalOfAverages` 字段只有一份。\n\n你如何维护 `playerCount` 和 `totalOfAverages` 值的计数呢？一种方法是在每次调用\
  \ `Player` 构造函数时更新这些字段。如果 `Player` 不是一个记录类（record class），你将编写如下构造函数：\n\n```\n//\
  \ 一个包含四个语句的构造函数\npublic Player(String name, double average) {\n    this.name = name;\n\
  \    this.average = average;\n    playerCount++;\n    totalOfAverages += average;\n\
  }\n```\n\n你可以在列表 11-3 中这样做。但由于列表 11-3 是一个记录类，有更好的方法。记住：当你不在记录类中编写构造函数时，Java 会静默地添加它自己的全参数隐式构造函数。换句话说，列表\
  \ 11-3 中的代码会自动获得如下类型的构造函数：\n\n```\npublic Player(String name, double average) {\n\
  \    this.name = name;\n    this.average = average;\n}\n```\n\n在这个隐式构造函数中，你想要添加一个\
  \ `playerCount++` 语句和一个 `totalOfAverages += average` 语句。\n\n瞧瞧！设计 Java 的魔法师们考虑到了你的需求！他们说你可以在记录类中放置一个*紧凑构造函数*（compact\
  \ constructor）。在列表 11-3 中，紧凑构造函数看起来如下：\n\n```\npublic Player {\n    playerCount++;\n\
  \    totalOfAverages += average;\n}\n```\n\n记录类的紧凑构造函数在类名后没有括号。当 Java 看到这一点时，它会将紧凑构造函数中的语句*添加*到它自己的隐式构造函数的语句中。这就像是你编写了该部分的\
  \ 4 语句构造函数一样。这非常方便。\n\n### 显示团队整体平均值\n\n之前显示的列表 11-3 包含了定义 `Player` 类的代码，而列表 11-4\
  \ 包含了使用该 `Player` 类的代码。\n\n列表 11-4 使用来自列表 11-3 的代码\n\n```java\nimport com.example.sport.Player;\n\
