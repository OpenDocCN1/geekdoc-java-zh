  \ 的 `name`、`jobTitle` 和 `hourlyRate`。\n\n### Java 注解\n在列表 10-6](#c10.xhtml_c10-fea-0006)\
  \ 中的 `@Override` 单词是注解的一个例子。Java 注解告诉计算机关于你的代码的一些信息。特别是，列表 10-6](#c10.xhtml_c10-fea-0006)\
  \ 中的 `@Override` 注解告诉 Java 编译器注意某些错误。\n\n![图像显示了员工管理系统的类层次结构图。顶层类是 'Employee（列表\
