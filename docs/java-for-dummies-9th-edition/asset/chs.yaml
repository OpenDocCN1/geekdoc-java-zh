  本章内容\n\n![项目符号](img/check.png) **一次处理一组对象**\n\n![项目符号](img/check.png) **创建一个字典**\n\
  \n![项目符号](img/check.png) **使用 Java 酷的函数式编程特性**\n\n![项目符号](img/check.png) **为多核处理器开发代码**\n\
  \n英文单词 *venery* 的意思是“狩猎野性动物的行为”。在古代，猎人会创造词汇来指代动物群。例如，一群鸟被称为 `flock`，一群狼被称为 `pack`。这类集合名词被称为\
  \ *venery*。其他例子还包括狮群 `pride`、一群鹅 `gaggle`、一群鱼 `school`、一群蜂 `swarm`、一群牛 `herd`、一群乌鸦\
  \ `murder`、一群眼镜蛇 `quiver`、一群鹰 `convocation` 以及一群猫 `litter`。（我永远不知道为什么有人想去猎一群“房子”！）\n\
  \n总之，Java 有许多自己的 venery 术语。但 Java 的术语与英语词汇有很大不同。相反，区别在于集合的组织方式。这就像委员会（committee）和人群（mob）之间的区别。人群可能可怕，但委员会通常很无聊。\n\
  \n本章的第一部分关于 Java 的 venery 术语，即其他人所知的*集合类 (collection classes)*。一旦有了集合类，就可以充分利用 Java\
  \ 的函数式编程特性。这些函数式编程特性主导了本书的后半部分。\n\n## 使用 ArrayList\n\n常用的集合类之一是 `ArrayList`。列表 12-1\
  \ 向你展示了它是如何工作的。\n\n```\nimport module.base;\npublic class ShowAll {\n    public\
  \ static void main(String[] args) throws IOException {\n        ArrayList<String>\
  \ vocabulary = new ArrayList<>();\n        var diskScanner = new Scanner(new File(\"\
  AllWords.txt\"));\n        while (diskScanner.hasNext()) {\n            vocabulary.add(diskScanner.nextLine());\n\
  \        }\n        diskScanner.close();\n        vocabulary.remove(0);\n      \
  \  vocabulary.add(2, \"paradox\");\n        for (String word : vocabulary) {\n \
  \           System.out.println(word);\n        }\n    }\n}\n```\n\n`列表 12-1` 中的代码读取\
  \ `AllWords.txt` 文件并将文件值加载到名为 `vocabulary` 的 `ArrayList` 中。图 12-1 向你展示了一个示例 `AllWords.txt`\
  \ 文件。（如果有人关心的话，这个文件中的单词是我询问 ChatGPT 获取的。）对于那个特定的 `AllWords.txt` 文件，`列表 12-1` 的输出如图\
  \ 12-2 所示。\n\n\n\n\n\n![A list of words in a rectangular box. The words are: Luminous,\
  \ harbor, zephyr, enigma, serendipity, quicksilver, echo, velvet, mirage, driftwood.](img/9781394289240-fg1201.png)\n\
  \nFIGURE 12-1: 文件中的几个单词。\n\n根据图 12-1，`AllWords.txt` 文件开头的单词是 `luminous`。因此，你可能会想说：“在读完\
  \ `AllWords.txt` 的内容后立即，`vocabulary` 列表中的第一个值就是单词 `luminous`。”如果你是这样说的，你大部分是正确的。\n\
  \n![A list of words in a vertical column: harbor, zephyr, paradox, enigma, serendipity,\
  \ quicksilver, echo, velvet, mirage, driftwood.](img/9781394289240-fg1202.png)\n\
  \nFIGURE 12-2: Listing 12-1 中代码的输出。\n\n为什么我说“大部分正确”呢？因为“*first*”（第一个）暗示了“1 号”，但\
  \ `luminous` 并不是 `vocabulary` 列表中的“1 号”值。计算机语言从 0 开始编号，而不是 1。正因为如此，这些语句是正确的：\n\n\
  - `luminous` 在 `vocabulary` 列表中的索引为 0。\n- 下一个单词 `harbor` 在 `vocabulary` 列表中的索引为\
  \ 1。\n- 下一个单词 `zephyr` 在 `vocabulary` 列表中的索引为 2。\n- 以此类推。\n\n参见图 12-3。\n\n![A diagram\
  \ of an array with indices from 0 to 9. Each index points to a word: 0 - luminous,\
  \ 1 - harbor, 2 - zephyr, 3 - enigma, 4 - serendipity, 5 - quicksilver, 6 - echo,\
  \ 7 - velvet, 8 - mirage, 9 - driftwood.](img/9781394289240-fg1203.png)\n\nFIGURE\
  \ 12-3: 刚读取完 `AllWords.txt` 文件。\n\n你可以猜到 Java 在 Listing 12-1 中执行 `vocabulary.remove(0)`\
  \ 时发生了什么。索引为 0 的元素（单词 `luminous`）从列表中移除。结果是单词 `harbor` 移动到了索引 0 的位置。事实上，所有剩余值都会左移以填补空隙。从列表中移除\
  \ `luminous` 后，你得到了如图 12-4 所示的 `vocabulary` 列表。\n\n![A diagram of an array with\
  \ indices from 0 to 8. Each index points to a word: 0 - harbor, 1 - zephyr, 2 -\
  \ enigma, 3 - serendipity, 4 - quicksilver, 5 - echo, 6 - velvet, 7 - mirage, 8\
  \ - driftwood.](img/9781394289240-fg1204.png)\n\nFIGURE 12-4: 移除索引为 0 的条目后。\n\n\
  Listing 12-1 中的下一个语句 `vocabulary.add(2, \"paradox\")` 将单词 `paradox` 插入列表，并赋予该单词索引\
  \ 2。再次，列表中的某些值获得了新的索引。特别是从 `enigma` 开始的单词向后移动以容纳插入的内容。（参见图 12-5。）\n\n![A diagram\
  \ of an array with indices from 0 to 9. Each index points to a word: 0 - harbor,\
  \ 1 - zephyr, 2 - Paradox, 3 - enigma, 4 - serendipity, 5 - quicksilver, 6 - echo,\
  \ 7 - velvet, 8 - dirge, 9 - driftwood.](img/9781394289240-fg1205.png)\n\nFIGURE\
  \ 12-5: 在索引 2 处插入条目后。\n\n注意 `ArrayList` 实例有两个不同的 `add` 方法。\n\n- Listing 12-1 中的第一个\
  \ `add` 方法只有一个参数：\n  ```\n  vocabulary.add(diskScanner.nextLine());\n  ```\n  该语句获取在输入文件某一行中找到的任何单词，并将该单词添加到列表的*末尾*。\n\
  - Listing 12-1 中的第二个 `add` 方法有两个参数：\n  ```\n  vocabulary.add(2, \"paradox\")\n \
  \ ```\n  该语句将单词 `paradox` 插入列表，并赋予该单词索引 2。再次，列表中的某些值获得了新的索引。特别是从 `enigma` 开始的单词向后移动以容纳插入的内容。（参见图\
  \ 12-5。）\n\n### 使用泛型\n\n\n\n\n再次查看之前显示的 Listing 12-1，注意那个奇异的 `ArrayList` 声明：\n\n\
  ```java\nArrayList<String> vocabulary = new ArrayList<>();\n```\n\n每个集合类都是“泛型化的”（`generified`）。这个听起来很难听的词意味着每个集合声明都应该包含一些尖括号内容，例如\
  \ `<String>`。夹在 `<` 和 `>` 之间的内容告诉 Java 新集合可能包含什么类型的值。例如，在 Listing 12-1 中，`ArrayList<String>\
  \ vocabulary` 这几个单词告诉 Java `vocabulary` 是一组字符串。也就是说，`vocabulary` 列表包含 `String` 对象（不是\
  \ `Room` 对象，不是 `Account` 对象，不是 `Employee` 对象——除了 `String` 对象之外的任何东西都没有）。所以，从那时起，对\
  \ `vocabulary` 集合中项的引用都被完全视为 `String`。如果你写：\n\n```java\nvocabulary.add(new Account());\n\
  ```\n\n编译器会“喷出”你的代码并将其抛弃，因为 `Account`（在第 7 章中创建）与 `String` 不同。（即使编译器可以访问 `Account`\
  \ 类的代码——即第 7 章中的代码——也会发生这种喷出现象）。但语句\n\n```java\nvocabulary.add(\"George Gow\");\n\
  ```\n\n是完全没问题的。因为 `\"George Gow\"` 的类型是 `String`，编译器开心地微笑。\n\n### 你有多种选择\n\n出于历史原因，定义新集合有几种不同的方法。例如，如果你喜欢打字，可以重复泛型名称，如下所示：\n\
  \n```java\nArrayList<String> vocabulary = new ArrayList<String>();\n```\n\n在合适的情况下，你可以使用单词\
  \ `var`：\n\n```java\nvar vocabulary = new ArrayList<String>();\n```\n\n你甚至可能会看到没有泛型的旧代码，像这样：\n\
  \n```java\nArrayList vocabulary = new ArrayList();\n```\n\n但我不要用这种方式编写新的声明。没有泛型，Java\
  \ 无法确定你正在向集合中放入什么类型的值。因此，你代码的其他部分可能需要特殊的处理。例如，你可能需要额外的代码来确保你不会无意中向 `vocabulary`\
  \ 列表添加 `Employee` 实例或 `Account` 实例。\n\n### 总结\n\n在第 4 章中，我指出 Java 有两种类型：基本类型和引用类型。（如果你没有读过那些章节，或者你不记得，不要感到内疚。你会没事的。）像\
  \ `int`、`double`、`char` 和 `boolean` 是基本类型，而像 `String`、`Employee`、`ArrayList` 和 `Account`\
  \ 是引用类型。\n\n基本类型和引用类型之间的区别自 Java 1995 年诞生以来一直是争议的源。即使现在，Oracle 的魔法师们也在制定计划来规避拥有两种类型带来的更棘手的后果。这些后果之一是集合（如\
  \ `ArrayList`）不能包含基本类型的值。例如，写：\n\n```java\nArrayList<String> vocabulary = new ArrayList<>();\n\
  ```\n\n但写：\n\n```java\nArrayList<int> numbers = new ArrayList<>(); // ！错误！\n```\n\
  \n因为 `int` 是基本类型。所以，如果你想在 `ArrayList` 中存储像 `3`、`55` 和 `21` 这样的值，你会怎么做？与其在 `ArrayList`\
  \ 中存储 `int` 值，不如存储 Java 的 `Integer` 值：\n\n```java\nArrayList<Integer> list = new\
  \ ArrayList<>();\n```\n\n在之前的章节中，你结合 `parseInt` 方法看到了 `Integer` 类：\n\n```java\n\
  int numberOfCows = Integer.parseInt(\"536\");\n```\n\n`Integer` 类有许多方法，如 `parseInt`，用于处理\
  \ `int` 值。该类还有如 `MAX_VALUE` 和 `MIN_VALUE` 等字段，它们代表 `int` 变量可能拥有的最大和最小值。\n\n`Integer`\
  \ 类是包装类（`wrapper class`）的一个示例。Java 的八种基本类型都有一个对应的包装类。你可以使用 Java 中 `Double`、`Character`、`Boolean`、`Long`、`Float`、`Short`\
  \ 和 `Byte` 包装类中的方法和字段。例如，`Double` 类有名为 `parseDouble`、`compareTo`、`toHexString` 的方法以及名为\
  \ `MAX_VALUE` 和 `MAX_EXPONENT` 的字段。\n\n注意这个模式。Java 的八种基本类型（如 `int`、`double` 和 `char`）名称都以小写字母开头。相比之下，所有包装类（`Integer`、`Double`、`Character`\
  \ 等）名称都以大写字母开头。\n\n![Tip](img/tip.png) Java 程序员喜欢用大写字母开头类名。你可以声明 `public class account`\
  \ 或 `public class employee`。但这样做，其他程序员会认为你是个呆瓜。\n\n`Integer` 类用有用的方法和值包装了基本类型 `int`。此外，你可以创建一个包装单个\
  \ `int` 值的 `Integer` 实例：\n\n```java\nInteger myInteger = Integer.valueOf(42);\n\
  ```\n\n\n\n\n# 一次又一遍\n\n迭代器一个接一个地输出集合中的值。要从集合中获取一个值，你需要调用迭代器的 `next` 方法。要检查集合中是否还有更多值，你需要调用迭代器的\
  \ `hasNext` 方法。例如，你可以用以下代码替换 Listing 12-1 末尾的循环：\n\n```java\nIterator<String> iterator\
  \ = vocabulary.iterator();\nwhile (iterator.hasNext()) {\n    System.out.println(iterator.next());\n\
  }\n```\n\n第一行代码从 `vocabulary` 集合创建一个迭代器。第二行和第三行调用迭代器的 `hasNext` 和 `next` 方法来获取存储在\
  \ `vocabulary` 集合中的所有对象——每个循环迭代获取一个。这些行代码显示了 `vocabulary` 集合的每一个值。当你进行此代码替换时，你将获得与之前相同的输出。（你可以在图\
  \ 12-2 中看到输出。）\n\n![记住](img/remember.png) 要运行这段代码，你可能需要一个 `import java.util.Iterator`\
  \ 。\n\n哪种更好？增强 `for` 循环还是迭代器？Java 程序员更倾向于增强 `for` 循环，因为 `for` 循环的负担更小——不需要从一行代码携带\
  \ `iterator` 对象到下一行。但正如你在本章后面部分看到的，最强大的编程增强特性也可以被升级、精简、调整并以其他方式重构。改进代码的方法无完没了。\n\
  \n# 排序与搜索\n\n每一本入门计算机编程书籍都包含介绍两个重要问题的章节：\n\n* **排序：** 将列表中的值按升序到降序或降序到升序的顺序重新排列。\n\
  * **搜索：** 在列表的许多值中找到一个特定的值。报告该值在列表中的位置。\n\nJava 有方法可以轻松解决这两个问题。你可以在 Listing 12-2\
  \ 中看到它们。\n\nLISTING 12-2 “Enigma”一词在世界的哪个位置？\n\n```java\nvoid main() throws IOException\
  \ {\n    ArrayList<String> vocabulary = new ArrayList<>();\n    var diskScanner\
  \ = new Scanner(new File(\"AllWords.txt\"));\n    while (diskScanner.hasNext())\
  \ {\n        vocabulary.add(diskScanner.nextLine());\n    }\n    diskScanner.close();\n\
  \    Collections.sort(vocabulary);\n    for (String word : vocabulary) {\n     \
  \   println(word);\n    }\n    println(\"\");\n    print(\"Enigma's index: \");\n\
  \    println(vocabulary.indexOf(\"enigma\"));\n}\n```\n\n图 12-6 显示了 Listing 12-2\
  \ 中代码的运行情况。\n\n![带有对应数值的单词列表。单词和数值是：luminous 1521841, harbor 14117675, zephyr 1134961,\
  \ enigma 1579665, serendipity 830226, quicksilver 804862, echo 19416462, velvet\
  \ 5591498, mirage 2493561, driftwood 536980.](img/9781394289240-fg1206.png)\n\n\
  图 12-6： 排序与搜索。\n\n在 Listing 12-2 中，调用 `Collections.sort(vocabulary)` 重新排列了 `vocabulary`\
  \ 列表中的值。该调用使用了默认排列，即字母顺序。\n\n在 Listing 12-2 的后面，调用 `vocabulary.indexOf(\"enigma\"\
  )` 返回单词 `\"enigma\"` 在排序置的 `vocabulary` 列表中第一次出现的位置索引。在图 12-6 中，`driftwood` 的索引为\
  \ 0，`echo` 的索引为 1，`enigma` 的索引为 2。果真，调用 `indexOf(\"enigma\")` 返回了你在图 12-6 末尾看到的\
  \ `2`。\n\n![提示](img/tip.png) Java 的排序方法是多能的。你可以按照任何需要的顺序排列值。例如，调用 `Collections.reverse(vocabulary)`\
  \ 将按字母排序的列表按字母倒序顺序排列。而调用\n\n`Collections.sort(vocabulary, Comparator.comparingInt(w\
  \ -> w.charAt(w.length() - 1)));`\n\n根据每个单词的最后一个字母来排列值。\n\n![技术细节](img/technicalstuff.png)第\
  \ 11 章描述了 Java 的 `static` 关键字，并揭示了当你遇到静态字段或方法时会做的一些事情。在 Listing 12-1 中，你编写 `Collections.sort`，因为\
  \ `sort` 是 `Collections` 类中的一个 `static` 方法。我的大学生在我用 `static` 这个词时会愣住。所以，如果你不懂这段话，不用担心。你可以在编写更多\
  \ Java 程序时学习 `static`。\n\n# 另一种集合类\n\n我尝试找出 Java 23 有多少集合类，但过了一会儿就放弃了。多到无法计数。总之，我决定展示一个结构与\
  \ `ArrayList` 类显著不同的类。它是 Java 的 `HashMap` 类。\n\n`HashMap` 实例存储查找表。例如，Rael Tatman\
  \ 博士统计了互联网页面上 333,333 个单词的次数，并将结果发布在 [`www.kaggle.com/datasets/rtatman/english-word`](http://www.kaggle.com/datasets/rtatman/english-word)。`HashMap`\
  \ 以键值对的形式存储。每个对包含一个键和一个关联的值。键用于在映射查找值。\n\n`HashMap` 类提供了几种方法来操作数据。最常用的是 `put`（向映射中添加新的键值对）和\
  \ `get`（根据给定的键检索值）。其他有用的方法包括 `remove`（删除键值对）和 `size`（返回映射中键值对的数量）。\n\n例如：\n\n```java\n\
  HashMap<String, Integer> map = new HashMap<>();\nmap.put(\"apple\", 1);\nmap.put(\"\
  banana\", 2);\nmap.put(\"cherry\", 3);\nInteger count = map.get(\"apple\");\nmap.remove(\"\
  banana\");\nint size = map.size();\n```\n\n这个示例展示了如何使用 `HashMap` 存储和检索数据。注意 `HashMap`\
  \ 中的键必须是唯一的。映射中键的顺序是不保证的，并且随着时间的推移而改变。\n\n\n\n\n\nListing 12-3 中的最后一条语句查找单词 `dummies`\
  \ 出现的频率。事实上，Tatman 博士的研究中单词 `dummies` 一词出现了 3,392,894 次，但我没有将该信息存入我的 `WordFrequencies.txt`\
  \ 文件中。因此，Listing 12-3 没有向程序的哈希表中添加 `\"dummies\"`。结果是，调用 `map.get(\"dummies\")` 没有返回任何内容。而且在\
  \ Java 中，单词 `null` 意味着“什么都没有”。\n\n### 如此多的集合类！\n\n我在本章许多示例中使用的 `ArrayList` 类只是 Java\
  \ 集合冰山的一山一角。Java 库包含了许多集合类，每个类都有自己的优势。表 12-1 包含了一个简要列表。\n\n| 类名 | 特性 |\n| : ---\
  \ | --- |\n| `ArrayList` | 一可调整大小的列表。 |\n| `LinkedList` | 值的值的列表，每个值都有一个指向列表中下一个值的字段。\
  \ |\n| `Stack` | 一种从底部到顶部生长的结构。该结构针对访问顶部的值进行了优化。你可以轻松地将一个值推入栈顶或从栈顶弹出值。 |\n| `Queue`\
  \ | 一种在一端生长的结构。该结构针对向一端（尾部）添加值和从另一端（头部）移除值进行了优化。 |\n| `PriorityQueue` | 一种类似于队列的结构，允许某些（高优先级）值向头部移动。\
  \ |\n| `HashSet` | 一个不包含重复值且没有特定顺序的集合。 |\n| `HashMap` | 键/值对集合。 |\n\n表 12-1： 某些集合类\n\
