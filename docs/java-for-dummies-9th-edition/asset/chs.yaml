  \n方法调用是一个带有值的表达式。\n\n\n\n\n\n![记住](img/remember.png) 如果一个方法返回任何内容，那么对方法的调用就是一个带有值的表达式。该值可以被打印、赋值给变量、与其他内容相加或进行任何其他操作。你对任何其他类型的值能做的事情，你都可以对方法调用这样做。\n\
