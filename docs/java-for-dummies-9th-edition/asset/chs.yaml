  \ Brickenchicker 先生（那个没能进第 4 章;\n```\n\n我知道它是有效的 —— 我是从从第 7 章中学到的。总之，`new` 关键字告诉\
  \ Java 创建一个对象（一个类的实例），Java 通过执行某些操作来实现。首先，Java 在内存中找到一个空间来存储新对象的信息。如果对象有字段，这些字段最终会有值。\n\
  \n![交叉引用](img/crossreference.png) 要了解字段，请参见第 7 章。\n\n当你要求 Java 创建新对象时，你可能指定放入对象的内容。\n\
  \n### 什么是温度？\n\n“早上好，欢迎收看对象新闻。当地温度是舒适的 73 度。”\n\n温度由两部分组成：数字和一个温度等级。数字就是一个 `double`\
  \ 值，例如 32.0 或 70.52。但什么是温度等级？它是字符串吗，如 `\"Fahrenheit\"` 或 `\"Celsius\"`？并不是，因为有些字符串并不是温度等级。没有\
  \ `\"Quelploof\"` 温度等级，显示“73 度 Quelploof”的程序是糟糕的。\n\n### 什么是温度等级？（枚举类型）\n\nJava\
  \ 提供了许多方法将元素组合在一起。在第 12 章中，你将元素组合成一个数组。在第 12 章中，你将元素组合成一个集合。在本章中，你将元素组合成一个 `enum`\
  \ 类型。（当然，如果你不会读 `enum` 这个词，你就无法组合任何东西。）\n\n创建一个复杂的 `enum` 类型并不容易，但要创建一个简单的 `enum`\
  \ 类型，只需要在对括号内写一系列单词即可。\n\n\n\n\n（作者注：在 Listing 8-1 中，我列出了四种不同的温度标度。在之前的 *Java For\
  \ Dummies* 版本中，我曾尝试列出九种温度标度来炫耀，其中某些名称还带有华丽的 Unicode 字符。但在本本版本的研究过程中，我偶然发现了[`www.curiousnotions.com/temperature-converter`](https://www.curiousnotions.com/temperature-converter/)\
  \ 网站，上面有 73 种不同温度标度的公式。我真是深感自愧。）\n\n当你定义一个 `enum` 类型时，会发生两件大事：\n\n*   **你创建了值。**\n\
  \    就像 `13` 和 `151` 是 `int` 值一样，`CELSIUS` 和 `FAHRENHEIT` 是 `TempScale` 值。\n\n*\
  \   **你可以创建变量来引用这些值。**\n    在 Listing 8-2 中，我声明了字段 `number` 和 `scale`。就像\n\n   \
  \ ```java\n    double number;\n    ```\n\n    声明变量 `number` 的类型为 `double`，\n\n \
  \   ```java\n    TempScale scale;\n    ```\n\n    声明变量 `scale` 的类型为 `TempScale`。\n\
  \n    “类型为 `TempScale`”意味着你可以拥有 `CELSIUS`、`FAHRENHEIT`、`KELVIN` 或 `RANKINE` 值。因此，在\
  \ Listing 8-2 中，我可以给 `scale` 变量赋值为 `FAHRENHEIT`（更准确地说，是 `TempScale.FAHRENHEIT`）。\n\
  \n![Technical Stuff](img/technicalstuff.png) `enum` 类型是一个伪装的 Java 类。这就是为什么 Listing\
  \ 8-1 包含了一个完全专门用于某件事的文件——即 `enum` 类型的声明（即 `TempScale` 类型）。就像类的声明一样，`enum` 类型声明应该属于一个独立的文件。Listing\
  \ 8-1 中的代码属于一个名为 `TempScale.java` 的文件。\n\n### 那么，什么是温度？\n\n每个温度由两个部分组成：一个数字和一个温度标度。Listing\
  \ 8-2 中的代码使这一事实显而易见。\n\nLISTING 8-2 温度类\n\n```java\npublic class Temperature {\n\
  \    private double number;\n    private TempScale scale;\n\n    public Temperature()\
  \ {\n        number = 0.0;\n        scale = TempScale.FAHRENHEIT;\n    }\n\n   \
  \ public Temperature(double number) {\n        this.number = number;\n        scale\
  \ = TempScale.FAHRENHEIT;\n    }\n\n    public Temperature(TempScale scale) {\n\
  \        number = 0.0;\n        this.scale = scale;\n    }\n\n    public Temperature(double\
  \ number, TempScale scale) {\n        this.number = number;\n        this.scale\
  \ = scale;\n    }\n\n    public void setNumber(double number) {\n        this.number\
  \ = number;\n    }\n\n    public double getNumber() {\n        return number;\n\
  \    }\n\n    public void setScale(TempScale scale) {\n        this.scale = scale;\n\
  \    }\n\n    public TempScale getScale() {\n        return scale;\n    }\n\n  \
  \  public String toString() {\n        return String.format(\"%5.2f\\u00B0 \", number)\
  \ + scale;\n    }\n}\n```\n\nListing 8-2 中的代码包含了常用的 setter 和 getter 方法（针对 `number`\
  \ 和 `scale` 字段的访问器方法）。\n\n![Crossreference](img/crossreference.png) 关于 setter 和\
  \ getter 方法（也称为访问器方法）的良好读，请参阅第 7 章。\n\n除了 setter 和 getter 之外，Listing 8-2 还有四个看起来像方法的东西。这些像方法一样的东西都叫\
  \ `Temperature`，这恰好与类名相同。这些像方法一样的 `Temperature` 都没有任何类型的 `return` 类型——甚至不是 `void`（这是一种偷懒的\
  \ `return` 类型）。\n\n这些像方法一样的东西每一个被称为构造函数。*构造函数*就像方法，不同之处构造函数有一个特殊的用途：创建新对象。\n\n![Remember](img/remember.png)\
  \ 每当计算机创建一个新对象时，计算机就会执行构造函数内部的语句。\n\n### 你可以对温度的操作\n\nListing 8-3 将我在上一节中描述的一些想法具体化了。在\
  \ Listing 8-3 中，你调用了早早在 Listing 8-2 中声明的构造函数。\n\n\n\n\n每个类都有一个 `toString` 方法，无论你是否为它编写了代码。如果你从代码列表\
  \ 8-2 中删除了 `toString` 声明，Java 就会在后台添加一个 `toString` 方法。我将这个添加的方法视为一个隐式的 `toString`\
  \ 方法。但是，由于在第 10 章中会变得清楚的原因，这个添加的方法被称为*继承的* `toString` 方法。\n\n对于大多数类来说，继承的 `toString`\
  \ 方法对用户并不友好。为了让你你明白我的意思，我从代码列表 8-2 中删除了我的 `toString` 声明。然后我运行了代码列表 8-3 中的代码。输出如下：\n\
  \n`Temperature@5b480cf9`\n`Temperature@6f496d9f`\n`Temperature@723279cf`\n`Temperature@10f87f48`\n\
  \n我的 `Temperature` 类继承的 `toString` 方法完全没有任何用。因此，在代码列表 8-2 中，我创建了自己的 `toString` 方法，并使用了格式字符串\
  \ `\"%5.2f\\u00B0 \"`。在这个字符串中，`\\u00B0` 是温度度符号（°）的 Unicode 表示法。\n\n![交叉引用](img/crossreference.png)\
  \ 关于 Unicode 的一些明见解，请参阅第 5 章。\n\n### 构建温度；慢动作回放\n\n当计算机执行代码列表 8-3 中的新的 `Temperature`\
  \ 语句之一时，Java 必须决定使用代码列表 8-2 中的哪一个构造函数。Java 通过查看参数列表来决定——即 `new Temperature` 单词后面括号里的内容。例如，当计算机执行\n\
  \n```\ntemp = new Temperature(32.0);\n```\n\n来自代码列表 8-3 时，Java 自言道：“括号里的数字 32.0\
  \ 是一个 `double` 值。代码列表 8-2 中的 `Temperature` 构造函数之一有一个类型为 `double` 的参数。该构造函数的头部像这样：\n\
  \n```\npublic Temperature(double number)\n```\n\n“所以我猜我将执行那个特定构造函数内部的语句。”Java 继续执行以下语句：\n\
  \n```\nthis.number = number;\nscale = TempScale.FAHRENHEIT;\n```\n\n结果，你得到了一个全新的对象，其\
  \ `number` 字段的值为 `32.0`，其 `scale` 字段的值为 `TempScale.FAHRENHEIT`。\n\n在这两行代码中，你有两个语句为字段\
  \ `number` 和 `scale` 设置了值。看看这些语句中的第二个，它稍微容易理解一点。第二个语句将新对象的 `scale` 字段设置为 `TempScale.FAHRENHEIT`。你看，构造函数的参数列表是\
  \ `(double number)`，而该列表并不包含 `scale` 值。因此，任何编写这段代码的人都必须对 `scale` 字段使用什么值做出决定。程序员可以选择\
  \ `FAHRENHEIT` 或 `CELSIUS`，但也可以选择 `KELVIN` 或 `RANKINE`。（这位程序员恰好住在美国的新泽西州，那里的人通常使用旧的华氏温度标度。）\n\
  \n回到两个语句中的第一个，这第一个语句为新对象的 `number` 字段分配了一个值。该语句使用了一个巧妙的技巧，你可以在许多构造函数（以及其他为对象字段赋值的方法方法）中看到这个技巧。要理解这个技巧，请看代码列表\
  \ 8-4。该列表展示了我编写编写相同构造函数代码的两种方式。\n\n代码列表 8-4 实现相同事情的两种方式\n\n```\n//使用这个构造函数 …\npublic\
  \ Temperature(double whatever) {\n  number = whatever;\n  scale = TempScale.FAHRENHEIT;\n\
  }\n\n// …或使用这个构造函数 …\npublic Temperature(double number) {\n  this.number = number;\n\
  \  scale = TempScale.FAHRENHEIT;\n}\n// …但不要在代码中同时放入这两个构造函数。\n```\n\n代码列表 8-4 包含两个构造函数。在第一个构造函数中，我使用了两个不同的名称：`number`\
  \ 和 `whatever`。在第二个构造函数中，我不需要两个名字。与其为构造函数的参数想一个新名字，不如通过编写 `this.number` 重用已有的名称。\n\
  \n以下是代码列表 8-2 中发生的情况：\n\n- 在 `this.number` 语句中，`this` 指向在代码列表 8-2 中声明的 `number`\
  \ 字段。\n- 在 `scale = TempScale.FAHRENHEIT` 语句中，`scale` 指向在代码列表 8-2 中声明的字段。\n\n等等，让我们重新检查提供文本的最后部分：在代码列表\
  \ 8-2 中的 `this.number` 语句中，`this` 指向在代码列表 8-2 中声明的 `number` 字段。\n- 在 `scale = TempScale.FAHRENHEIT`\
  \ 语句中，`scale` 指向在代码列表 8-2 中声明的字段。\n\n（注：提供的原始文本末尾有一些混乱/重复的句子。我对其进行了清理，以保持核心含义的清晰。）\n\
  \n### 默认构造函数\n\n`Temperature` 类声明在代码列表 8-2 中包含四个构造函数，每个都有自己的参数列表。如果你不包含所有构造函数会发生什么？答案并不像你想象的那么简单。为了找出，请尝试这个三个实验：\n\
  \n1. **删除代码列表 8-2 中的所有构造函数。** 然后尝试运行代码列表 8-3 中的代码。\n\n   为了让代码列表 8-3 运行，你必须删除三个构造函数。唯一可以调用的是无参数的\
  \ `new Temperature()`。你不声明任何构造函数时，Java 会为你创建一个。这个隐式构造函数没有参数。它被称为*默认构造函数*。\n\n回看第\
  \ 7 章中的 `Account` 类。在该章中，你没有声明任何构造函数。然而，你能够在每个方法中调用 `new Account()`。这就是 Java 的默认构造函数在起作用！\n\
  \n2. **从代码列表 8-2 中删除三个构造函数。** 你唯一没有删除的是无参数构造函数。\n\n   当你这样做时，你得到与步骤 1 相同的结果。你不需要让\
  \ Java 为你创建一个式的默认构造函数。你可以在代码中显式声明无参数构造函数。这是你的选择。\n\n3. **从代码列表 8-2 中删除三个构造函数。**\
  \ 你唯一没有删除的是两个参数的构造函数 `Temperature(double number, TempScale scale)`。\n\n   我称之为类的*全参数构造函数*。它是参数包含该类每一个字段的构造函数。\n\
  \n   当你消除了 `Temperature` 类全参数构造函数以外的所有构造函数时，你可以调用 `new Temperature(2.73, TempScale.KELVIN)`，但你不能调用\
  \ `new Temperature()`。为什么？Java 完美的默认构造函数去哪了？\n\n\n\n构造函数的规则如下：当你声明一个类且没有显式声明任何构造函数时（如步骤\
  \ 1 所示），Java 会为你创建一个无参数的默认构造函数。但是，当你在代码中声明了任何构造函数时，Java 就不会创建默认构造函数。因此，如果你想让你的类既有一个无参数构造函数又有其他构造函数，你必须在代码中声明所有它们（包括无参数构造函数）。这挺奇怪的，对吧！\n\
  \n如果你觉得这个默认构造函数的逻辑让你很困惑，可以避免考虑它。与其担心这一节的实验，不如确保显式地声明你计划调用的所有构造函数即可。如果你计划调用无参数构造函数，请在类声明中为它编写代码。如果你计划调用任何参数化构造函数（无论是否是全参数构造函数），请在类声明中为这些构造函数编写代码。\n\
  \n最后，如果你不像我一样喜欢编写构造函数定义，就让你的 IDE 来完成工作吧。从 IDE 的主菜单中，尝试选择 Code ⇒   Generate ⇒   Constructor\
  \ or Source ⇒   Generate Constructor。\n\n![Remember](img/remember.png) 术语可能会让人困惑。Java\
  \ 有 `default`（默认）构造函数和 `inherited`（继承）方法。当你不在代码中显式定义它们时，这两者都会像魔法一样出现。幸运的是，你编写程序时不需要记住其中一个被称为\
  \ `default` 而另一个被称为 `inherited`。你只需要在阅读这些词时理解它们正在发生什么即可。\n\n![Tryitout](img/tryitout.png)\
  \ 总有更多内容供你尝试。\n\n### 校园时光 (SCHOOL DAYS)\n\n创建一个 `Student` 类，包含一个姓名、 ID 号、平均绩点（GPA）和一个主要学习领域。学生的姓名是\
  \ `String` 类型。学生的 ID 号是一个 `int` 值。GPA 是一个 0.0 到 4.0 之间的 `double` 值。`Major` 是一个 `enum`\
  \ 类型，值包括 `COMPUTER_SCIENCE`、`MATHEMATICS`、`LITERATURE`、`PHYSICS` 和 `HISTORY`。\n\n\
  每个学生都有姓名和 ID 号，但新学生可能还没有 GPA 或专业。创建带有 GPA 和 `Major` 参数的构造函数，以及不带这些参数的构造函数。\n\n像往一样，创建一个\
  \ main 方法来使用你新的 `Student` 类。\n\n### 幻想之旅 (FLIGHT OF FANCY)\n\n创建一个 `AirplaneFlight`\
  \ 类，包含航班号、出发机场、出发时间、到达机场和到达时间。航班号是一个 `int` 值。出发和到达机场字段属于 `Airport` `enum` 类型，其值对应某些官方的\
  \ IATA 机场代码。（例如，伦敦希斯罗机场的代码是 LHR；洛杉矶国际机场的代码是 LAX；请查看 [`www.iata.org/publications/Pages/code-search.aspx`](http://www.iata.org/publications/Pages/code-search.aspx)\
  \ 获取可搜索的航空公司代码数据库。）\n\n对于到达和出发时间，使用 Java 的 `LocalTime` 类。（更多关于 `LocalTime` 的信息，请查看\
  \ [`https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/time/LocalTime.html`](https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/time/LocalTime.html)\
  \ 中的 `LocalTime` 文档页。）创建一个设置为下午 2:15（也称为 14:15）的 `LocalTime` 对象，执行：\n\n```\nLocalTime\
  \ twoFifteen = LocalTime.of(14, 15);\n```\n\n创建一个设置为当前时间（根据电脑系统时）的 `LocalTime` 对象，执行：\n\
  \n```\nLocalTime currentTime = LocalTime.now();\n```\n\n每个航班都有、出发机场和到达机场。但某些航班可能没有出发和到达时间。创建带有出发和到达时间参数的构造函数，以及不带这些参数的构造函数。\n\
  \n创建一个 main 方法来使用你新的 `AirplaneFlight` 类。\n\n## 创建类的简单方法\n\nListing 8-2 用大约 40 行代码描述了\
  \ `Temperature` 类。对于定义一个只有两个属性（一个数字和一个温度刻度）的东西来说，这代码量太多了。Listing 8-2 中的大部分代码都是常规的、样板化的。当我的目光落在\
  \ `this.number = number` 语句上时，我的大脑忽略了它。我内心有一个邪恶的声音在说：“别用 `this.number = number`\
  \ 来烦我了。告诉我一些我不知道的新东西。”我不期望在这种类的类声明中发现任何有趣的东西。所以，如果另一个程序员在类定义内部抛出一个“连环球”，我可能不会注意到。这不太好。\n\
  \n也许有更好的创建类的方法。不，并没有。我写这一节仅仅是为了抱怨冗长的类声明。\n\n噢！我撒谎了。*确实*有更好的创建类的方法。看看 Listing 8-5。\n\
  \n### LISTING 8-5 你的第一个类\n\n```java\nrecord Temperature(double number, TempScale\
  \ scale)\n```\n\n`record` 在 Listing 8-5 中已经是非常精简的形式了。然而，Listing 8-5 中的代码完全定义了一个\
  \ `Temperature` 类。这个 `Temperature` 类与 Listing 8-2 共享许多特征，甚至拥有一些 8-2 缺少的特征。`record`\
  \ 在 Listing 8-5 中让这个 `Temperature` 类变成了一种特殊的类。令所有人惊讶的是，它被称为 *record 类*。`record`\
  \ 类的某些特征让程序员变得轻松。Listing 8-5 中的代码创建了 record 类的实例。Figure 8-3 展示了 [Listing 8-5] 的输出。\n\
  \n### LISTING 8-6 record 的实例\n\n```java\nvoid main() {\n    var temp = new Temperature(70.0,\
  \ TempScale.FAHHEIT);\n    println(String.format(\"%5.2f\", temp.number) + temp.scale);\n\
  \    temp = new Temperature(2.73, TempScale.KELVIN);\n    println(temp);\n}\n```\n\
  \n![Digital readout “70.0°F” with temperature range (min: -7.3, max: 20)](img/9781394289240-fg08.png)\
  \ FIGURE 8-3 运行 Listing 8-6 的代码。\n\nListing 8-6 多多或少与 8-3 做了相同的事情。但 record 类按照自己的节奏行事。所以\
  \ Listing 8-6 并不像原始的 8-3 那样。\n\n一方面，record 类不会隐式地创建一个无参数构造函数。相反，record 类会隐式地创建一个全参数化构造函数。这就是为什么在\
  \ Listing 8-6 中，你看到了这两行代码：\n\n```java\nvar temp = new Temperature(70.0, TempScale.FAHHEIT);\n\
  temp = new Temperature(2.73, TempScale.KELVIN);\n```\n\n但你没有看到下面这些行：\n\n**不要将任何这些行添加到\
  \ Listing 8-6。** (c08.xhtml_rc08-fea-0006)\n\n```java\nvar temp = new Temperature();\n\
  temp.number = 21.0;\ntemp.scale = TempScale.CELSIUS;\ntemp.setNumber(70.0);\ntemp.setScale(TempScale.FAH);\n\
  ```\n\n这一节的 `Temperature` 类不允许你调用 `new Temperature()`，也不允许你设置现有对象的 `number` 或 `scale`\
  \ 字段的值。一旦你通过 `new Temperature(70.0, TempScale.FAHHEIT)` 创建了一个对象，你就无法将该对象的 `number`\
  \ 值从 70.0 改为 71.5。你同样无法更改对象的 `scale` 值。\n\n\n\n\n\n`immutability` 一词意味着“不可改变”，而记录类（record\
  \ classes）的实例都是不可变的。与流行观点相反，不可变性是一件好事。至少，一个对象的不可变性是一件好事。如果一个对象的字段值永远不会改变，那么从对象创建到程序运行结束，你都知道这些值是什么。其他程序员无法添加更改这些值的代码并破坏你的逻辑。\n\
  \n但请记住——这种不可变性并不适用于引用记录类实例的变量。查看 Listing 8-6 中的 `temp` 变量。在代码的运行期间，`temp` 变量引用了两个不同的对象。一个是舒适的室温，另一个是我们寒冷的宇宙微波背景温度。在\
  \ Listing 8-6 中，没有任何东西可以阻止你更改 `temp` 所引的对象。但一旦你创建了一个对象，该对象的字段就不能被更改。\n\n如果你想打印 `Temperature`\
  \ 实例的 `number` 字段怎么办？表达式 `temp.number` 和 `temp.getNumber()` 将无法工作。但你可以遵循 Listing\
  \ 8-6 中第一个 `println` 调用中的模式。你可以引用 `temp.number()` 和 `temp.scale()`。你输入字段名后跟一对空括号。这就是你获取记录类字段值的方法。\n\
  \n![Warning](img/warning.png) 这与非记录类的惯例不同，所以你必须小心。（而且我也必须小心。我犯过很多次这种错误。）\n\nFigure\
  \ 8-3 中的最后一行显示了当你不显式地格式化记录类实例时会得到的结果。Java 会静地构建出一个外观体观的 `toString` 方法。你不在代码中看到那个\
  \ `toString` 方法。但当你在 Listing 8-6 中调用 `println(temp)` 时，Java 会显示 `temp` 对象的 `number`\
  \ 和 `scale` 值。（参考 Figure 8-3。）这太好了！\n\nListing 8-5 向你展示了如何用一行代码定义类。尽管这令人印象深刻，但你可能想创建一个包含一些自定义方法声明的记录类。Listing\
  \ 8-7 为 `Temperature` 记录类添加了 `toString` 方法。\n\nLISTING 8-7 另一个记录类\n\n```java\npublic\
  \ record Temperature (double number, TempScale scale) {\n    public String toString()\
  \ {\n        return String.format(\"%5.2f\\u00B0 \", number) + scale;\n    }\n}\n\
  ```\n\n通过使用 Listing 8-7 中的 `toString` 方法，调用 `println(temp)` 将显示一个格式化良好的华氏度室温。Figure\
  \ 8-4 展示了当你针对 Listing 8-7 中的 `Temperature` 类运行 Listing 8-6 中的 `main` 方法时得到的结果。\n\
  \n![显示温度的内容：“70.00° FAHRENHEIT”和“2.73° KELVIN”。](img/9781394289240-fg0804.png)\n\
  \nFIGURE 8-4: 两个格式良好的温度。\n\n### 构造函数不必是枯燥的\n\n这里是本章开头附近的一句引用：“……如果你感兴趣想做比填充字段更多的事情呢？也许，当计算机创建一个新对象时，你有一系列任务要让计算机执行。”好吧，又怎样？\n\
  \n对于之前节中的 `Temperature` 类，程序员可以创建比绝对零更低的温度。而且在物理学中，这是绝对不允许的。Listing 8-8 有一个构造函数，让这种科幻场景变得不现实。\n\
  \nLISTING 8-8 外面很冷！\n\n```java\npublic record Temperature(double number, TempScale\
  \ scale) {\n    public Temperature(double number, TempScale scale) {\n        this.number\
  \ = Math.max(number,\n            switch (scale) {\n                case CELSIUS\
  \ -> -273.15;\n                case FAHRENHEIT -> -459.6;\n                case\
  \ KELVIN, RANKINE -> 0.0;\n            });\n        this.scale = scale;\n    }\n\
  \    public String toString() {\n        return String.format(\"%5.2f\\u00B0 \"\
  , number) + scale;\n    }\n}\n```\n\n当你使用 Listing 8-8 并运行以下 `main` 方法时，你会得到 Figure\
  \ 8-5 所示的结果。\n\n```java\nvoid main() {\n    println(new Temperature(-1000.0, TempScale.FAHRENHEIT));\n\
  \    println(new Temperature(-1000.0, TempScale.CELSIUS));\n    println(new Temperature(-1000.0,\
  \ TempScale.KELVIN));\n    println(new Temperature(2.73, TempScale.KELVIN));\n}\n\
  ```\n\n![显示华氏度、摄氏度和开文度之间转换的文本](img/9781394289240-fg0805.png)\n\nFIGURE 8-5: 你变暖了！\n\
  \n在 Listing 8-8 中，`max` 方法（`Math` 类的成员）返回两个数字中较大的一个。例如，当 `number` 为 -1000.0 且 `scale`\
  \ 为 `FAHRENHEIT` 时，Listing 8-8 中的 `switch` 表达式返回 -459.6。因此 `this.number` 变成了 `Math.max(-1000.0,\
  \ -459.6)`，即 `-459.6`。新对象的温度是可能的最低温度，没有更低了。（写写这个让我想穿衣服！）\n\n### 所有对象的相等性\n\n本章的“温度像什么样？”告诉你每个类都有\
  \ `toString` 方法。如果你不写 `toString` 方法，Java 会为你创建一个 `toString` 方法。它被称为继承的 `toString`\
  \ 方法。\n\nJava 的 `equals` 方法也是如此。每个类都有 `equals` 方法。第 5 章 中的示例展示了 Java 继承的 `equals`\
  \ 方法是如何处理 `String` 值的。事实上，为了判断 `myName` 和 `yourName` 是否包含相同字符，你不应该写：\n\n```java\n\
  if (myName == yourName) // 不\n```\n\n相反，你应该写：\n\n```java\nif (myName.equals(yourName))\
  \ // 是\n```\n\n`String` 类的 `equals` 方法非常有用，但 `String` 类的 `equals` 方法并不典型。继承的 `equals`\
  \ 方法对于任意 Java 类效果良好。查看 Listing 8-9 中的 `main` 方法。当我配合 Listing 8-3 中的代码运行此 `main`\
  \ 方法时，Figure 8-6 向你展示了输出。\n\nLISTING 8-9 比较温度\n\n```java\nvoid main() {\n    var\
  \ freezing1 = new Temperature(0.0, TempScale.CELSIUS);\n    var freezing2 = new\
  \ Temperature(0.0, TempScale.CELSIUS);\n    println(freezing1 + \" equals \" + freezing2\
  \ + \" ?\");\n    println(freezing1.equals(freezing2));\n    println(\"\");\n  \
  \  var freezing3 = new Temperature(32.0, TempScale.FAHRENHEIT);\n    println(freezing1\
  \ + \" equals \" + freezing3 + \" ?\");\n    println(freezing1.equals(freezing3));\n\
  }\n```\n\n![将摄氏度与其及华氏度比较的文本，结果标记为 false](img/9781394289240-fg0806.png)\n\nFIGURE\
  \ 8-6: 你在开玩笑吧！\n\n在 Listing 8-9 中，`freezing1` 和 `freezing2` 变量引用两个不同的对象。所以，对于 Listing\
  \ 8-3 类，Java 继承的 `equals` 方法说它们是不相等的。这令人失望，但你还能从 Listing 8-3 中的 `Temperature` 类中期待什么呢？它不是一个记录类。\n\
  \n记录类的行为比其他类型的类更好。当你定义 `Temperature` 为记录类时，继承的 `toString` 方法会给出类似 `Temperature[number=2.73,\
  \ scale=KELVIN]` 的内容。（参见 Figure 8-3））这太好了！记录类继承的 `toString` 方法返回对象及其字段的合理表示。\n\n\
  \n\n\n所以，也许 Listing 8-7 中的 record 类有一个很棒的继承 `equals` 方法。你觉得呢？Figure 8-7 显示了当你运行\
  \ Listing 8-9 中的 main 方法并配合 Listing 8-7 中的 record 类时会得到的结果。\n\n![比较 0 摄氏度与其自身（true）以及\
  \ 32 华氏度（false）的文本。](img/9781394289240-fg0807.png)\n\nFIGURE 8-7: 稍微好了一点。\n\n如果你将\
  \ `Temperature` 定义为 record 类，Java 的 `equals` 方法表现得“还可以”。对于两个 0°-摄氏度对象，`equals` 方法返回\
  \ `true`。这比非 record 类的结果要好。但这不是最好的。继承的 `equals` 方法不知道如何在不同温度单位之间转换。\n\n为了解决这个问题，你需要编写自己的\
  \ `equals` 方法。Listing 8-10 向你展示了如何做。\n\nLISTING 8-10 比较温度\n\n```\npublic record\
  \ Temperature (double number, TempScale scale) {\n    public boolean equals(Temperature\
  \ other) {\n        var number1 = this.toCelsius();\n        var number2 = other.toCelsius();\n\
  \        return number1 == number2;\n    }\n    public double toCelsius() {\n  \
  \      return switch (scale) {\n            case CELSIUS -> number;\n          \
  \  case FAHRENHEIT -> (number - 32) * 5.0 / 9.0;\n            case KELVIN -> number\
  \ - 273.15;\n            case RANKINE -> (number - 491.67) * 5.0 / 9.0;\n      \
  \  };\n    }\n    public String toString() {\n        return String.format(\"%5.2f\\\
  u00B0 \", number) + scale;\n    }\n}\n```\n\n将 Listing 8-9 中的 main 方法与 Listing 8-10\
  \ 中的 `Temperature` 类相结合，你得到了 Figure 8-8 所示的输出。\n\n![比较 0 摄氏度与 0 华氏度并说明两种比较均为 true\
  \ 的文本。](img/9781394289240-fg0808.png)\n\nFIGURE 8-8: 完美！\n\n看吧！Figure 8-8 中的输出在两种情况下都是正确的。编写自己的\
  \ `equals` 方法是有帮助的。\n\n![尝试一下](img/tryitout.png) 所以，你以为你已经学完了这个关于构造函数的章节了！嗯，如果你想练习编程，还有更多事情要做。\n\
