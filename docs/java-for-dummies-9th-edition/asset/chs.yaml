  \ 类的子类，新 `NumberTooLargeException` 子句中的代码永远不会被执行。事实如此。\n\n### 同时捕获两个或多个异常\n\n你可以在单个\
  \ `catch` 子句中捕获多种异常。例如，在一个特定的库存程序中，你可能希望用相同的文本伴随 `NumberFormatException` 和你自己的 `OutOfRangeException`。在这种情况下，你可以这样重写列表\
  \ 14-6 的部分内容：\n\n```java\n} catch (NumberFormatException | OutOfRangeException e)\
  \ {\n    println(e.getMessage());\n    println(\"输入一个 0 到 \" + maxBoxes + \" 之间的数字.\"\
  );\n} catch (Exception e) {\n    println(e.getMessage());\n}\n```\n\n管道符号 `|` 告诉\
  \ Java 捕获 `NumberFormatException` 或 `OutOfRangeException`。如果你抛出了其中一种异常，程序将输出 `输入一个\
  \ 0 到 1000 之间的数字.`。如果你抛出一个既不是 `NumberFormatException` 也不是 `OutOfRangeException`\
  \ 的异常，程序将跳转到最后一个 `catch` 子句，你将得到 `输入一个 …` 输出。\n\n![技术细节](img/technicalstuff.png)\
  \ 想象用户运行列表 14-6 并输入了单词 `three` 而不是数字 `3`。你会认为这是一个错误，对吧？好吧，Java 称之为 `NumberFormatException`。它是\
  \ `Exception`，不是 `Error`。Java 确实有某些被称为错误，但它们与本章的异常不同。基本的区别在于，异常是程序可以处理的。而错误是程序应该停止运行的东西。例如，当程序没有空间存储值时会发生\
  \ `OutOfMemoryError`。如果发生这种情况，尝试捕获并恢复是没有的。程序会终止，你必须“从头来”。\n\n![试试看](img/tryout.png)\
