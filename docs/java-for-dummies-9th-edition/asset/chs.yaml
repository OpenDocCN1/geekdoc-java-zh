  \ because he is a pain.\"`。因此，在这种情况下，插列表 5-7 的作用与此代码相同：\n\n```java\nline = \"That's\
  \ because he is a pain.\";\nout.println(line);\n```\n\n在这段简短的代码片段中，注意第一行是以分号结尾的。这就是为什么在插列表\
  \ 5-7 中，大的 `switch` 表达式的末尾也有一个分号的原因。\n\n你可以从 Java 的 `switch` 表达式中榨出更多妙用。例如，你不需要将表达式的值赋值给变量。你可以跳过变量直接打印\
  \ `switch` 表达式的值：\n\n```java\nprintln(switch (verse) {\n    case 1 -> \"That's because\
  \ he has no brain.\";\n    case 2 -> \"That's because he is a pain.\";\n    case\
  \ 3 -> \"'Cause this is the last refrain.\";\n    default -> \"No such verse. Please\
  \ try again.\";\n});\n```\n\n但请记住，`switch` 表达式不能独立存在。下面的代码没有意义：\n\n```java\n// 坏代码！\n\
  int verse = Integer.parseInt(readln(\"Which verse? \"));\nString line;\n\"That's\
  \ because he is a pain.\"; // 这不是完整的语句。\nprintln(line);\n```\n\n带有独立 `switch` 表达式的代码也是行不起的。\n\
  \n```java\n// 坏代码！\nint verse = Integer.parseInt(readln(\"Which verse? \"));\nString\
  \ line;\nswitch (verse) { // 这个\n    case 1 -> \"That's because he has no brain.\"\
  ; // 是\n    case 2 -> \"That's because he is a pain.\"; // 不是\n    case 3 -> \"\
  'Cause this is the last refrain.\"; // 一个\n    default -> \"No such verse. Please\
  \ try again.\"; // 完整的\n}; // // 语句。\nprintln(line);\n```\n\n### 你祖祖辈的 switch 语句\n\
  \n在 Java 14 之前的版本中，插列表 5-6 和 5-7 中的 `switch` 结构将无法工作。这是因为 Java 的 `switch` 语句最初源于\
  \ C/C++ 语言族的 `switch` 语句，而 C/C++ 的 `switch` 语句非常笨拙。插列表 5-8 中的代码的作用与插列表 5-6 和 5-7\
  \ 中的代码相同，但插列表 5-8 使用使用的是 Java 的旧式 `switch` 语句。\n\n插列表 5-8 追寻逝时光\n\n```java\nvoid\
  \ main() {\n    int verse = Integer.parseInt(readln(\"Which verse? \"));\n    switch\
  \ (verse) {\n        case 1:\n            println(\"That's because he has no brain.\"\
  );\n            break;\n        case 2:\n            println(\"That's because he\
  \ is a pain.\");\n            break;\n        case 3:\n            println(\"'Cause\
  \ this is the last refrain.\");\n            break;\n        default:\n        \
  \    println(\"No such verse. Please try again.\");\n            break;\n    }\n\
  \    println(\"Oh, oh, oh, oh\");\n}\n```\n\n插列表 5-8 中代码的运行结果与插列表 5-6 和 5-7 的运行结果完全相同。（参见图\
  \ 5-11）。主要的区别在于，插列表 5-8 使用了旧形式的 `switch` 语句。在旧形式中：\n\n*   你使用冒号（`:`）而不是箭头（`->`）。\n\
  *   你需要使用 `break` 语句来跳过任何剩余的 `case`。\n\n（注：由于提供的原文后半部分存在大量重复和乱码，翻译部分已根据核心逻辑进行了去重和整合，确保输出通顺。）\n\
  \n\n\n\nFIGURE 5-13: 运行 Listing 5-9 中的代码四次。\n\n### 按月恢复\n\n编写一个程序，输入月份名称并输出该月份的天数。在程序的第一个版本中，假设二月始终有\
  \ 28 天。使用 Java 的 `switch` 语句——我在 Listing 5-6 中使用的那种。\n\n### 径早下结论\n\n修改你在之前节节“按月恢复”中的代码。让用户输入月份名称，并针对问题\
  \ `Is it a leap year?` 输入 `yes` 或 `no`。\n\n### 日期又又如何？\n\n修改你在之前节节“径早下结论”中的代码。不要模仿\
  \ Listing 5-6，而是使用你在 Listing 5-7 中看到的 `switch` 表达式。然后使用 Java 的旧式 `switch` 语句，就像你在\
  \ Listing 5-8 中看到那样。\n\n### YIELD 应用\n\n尝试这段代码并看看它是做什么的：\n\n```java\nvoid main()\
  \ {\n  String month = readln(\"Which month? \");\n  println(switch (month) {\n \
  \   case \"January\", \"March\", \"May\", \"July\",\n    \"August\", \"October\"\
  , \"December\" -> 31;\n    case \"April\", \"June\", \"September\", \"November\"\
  \ -> 30;\n    case \"February\" -> {\n      boolean isLeapYear =\n      Boolean.parseBoolean(readln(\"\
  Leap year (true/false)? \"));\n      if (isLeapYear) {\n        yield 29;\n    \
  \  } else {\n        yield 28;\n      }\n    }\n    default -> 0;\n  } + \" days\"\
  );\n}\n```\n\n第 6 章\n\n# 使用循环控制程序流\n\n## 本章\n\n![Bullet](img/check.png) **使用基础循环**\n\
  \n![Bullet](img/check.png) **在循环中计数**\n\n![Bullet](img/check.png) **不断重复（直到用户提供明确的答案）**\n\
  \n1966 年，为你提供海森士洗发水的公司创造了历史。在瓶背上，洗发水的使用说明写着：“起泡沫–冲洗–重复”。以前从未有一套完整的说明（针对任何事情，更不用说洗头）被如此简洁地概括。说明编写行业的人称赞这是一项重大的成就。这样的说明与当时的其他说明形成鲜明对比。（例如，一罐杀虫剂上的第一句话是：“转动此罐，使其避开你的脸。”拜托！）\n\
  \n除了简洁之外，海森士说明如此酷酷的之处在于，公司领导通过三个简单的词，成功捕捉到了所有指令传达的核心概念：重复。最后一个词 *REPEAT*（重复）将一个原本平淡的指令单调变成了一个复杂的行动配方。\n\
  \n基本思想是，当你遵循指令时，你不仅仅是一个接一个地执行指令。相反，你在道路上轮换。你做出决定（“如果头发干，则使用护发素”）并进入循环（“起泡沫–冲洗，再次起泡沫–冲洗。”）。在计算机编程中，你一直在使用决策和循环。本章将探索\
  \ Java 中的循环。\n\n## 不断重复指令（Java while 语句）\n\n这里有一个猜数字游戏。计算机生成一个 1 到 10 之间的随机数。电脑要求你猜这个数字。如果你猜错了，游戏将继续。一旦你猜对了，游戏就结束。Listing\
  \ 6-1 显示了玩游戏的程序，Figure 6-1 显示了一次游戏。\n\n![“图像显示了一个基于文本的猜数字游戏。游戏欢迎玩家并让他们从 1 到 10 之间选一个数字。玩家进行了几次猜测：2、5、8，最后是\
  \ 3，这是正确数字。游戏显示玩家在 4 次猜测后获胜。”](img/9781394289240-fg0601.png)\n\nFIGURE 6-1: 直到累为止。\n\
  \nLISTING 6-1 重复的猜数字游戏\n\n```java\nvoid main() {\n  int numGuesses = 0;\n  int randomNumber\
  \ = new Random().nextInt(10) + 1;\n  println(\"\"\"\n  ************\n  Welcome to\
  \ the Guessing Game\n  ************\"); // 第 6 章\n  while (inputNumber != randomNumber)\
  \ {\n    println(\"Try again\");\n    inputNumber = Integer.parseInt(readln(\"Pick\
  \ a number from 10: \"));\n    numGuesses++;\n  }\n  println(\"You win after \"\
  \ + numGuesses + \" guesses.\");\n}\n```\n\n\n\n\n![Remember](img/remember.png)\
  \ 使用如列表 6-1 所示的代码，计算机永远不会在循环中间跳出。当计算机发现 `inputNumber` 不等于 `randomNumber` 时，它会继续运行并执行循环大括号内的所有五条语句。只有在完全执行完循环中的所有五条语句后，计算机才会再次测试（检查\
  \ `inputNumber` 是否仍然不等于 `randomNumber`）。\n\n![Tryitout](img/tryitout.png) 我有两个东西想让你尝试一下：\n\
  \n### 更大、更好\n\n修改列表 6-1 中的程序，使得生成的随机数是 1 到 100 之间的数字。为了让游戏玩家玩得舒服点，当玩家猜测错误时，让程序显示提示。诸如\
  \ `Try a higher number`（尝试大数字）或 `Try a lower number`（尝试小数字）这样的提示是有用的。\n\n### 不要负数\n\
  \n编写一个程序，让用户连续输入 `int` 类型的值。当用户输入一个非正数时（例如数字 0 或–17），程序停止循环。在所有循环结束后，程序显示用户输入过的最大数字。例如，如果用户输入以下数字：\n\
  \n`7`\n\n`25`\n\n`3`\n\n`9`\n\n`0`\n\n程序显示数字 25。\n\n## 依靠我\n\n“在黑板上写 100 遍*我不在课堂上说话*。”\n\
  \n你老师的真实其实是：\n\n- `将计数器设置为 0。`\n- `只要计数器小于 100，`\n- `在黑板上写下‘我不在课堂上说话’，`\n- `计数器加\
  \ 1。`\n\n幸运的是，你当时并不知道循环和计数器。如果你当时向老师指出所有这些，你面临的麻烦会比现在所遇的大得多。\n\n无论如何，生活中充满了计数循环的例子。计算机编程反映了生活——或者反过来亦然？当你告诉计算机要做什么时，你通常是在告诉它打印三行字、处理十个账户、拨打百万个电话，或其他任何事情。因为计数循环在编程中非常常见，创建编程语言的人们专门为这种循环开发了语句。在\
  \ Java 中，重复执行某些次数操作的语句被称为 `for` 语句。列表 6-2 和 6-3 插说明了 `for` 语句的使用。列表 6-2 有一个极其简单的例子，而列表\
  \ 6-3 有一个更新奇的例子。随你挑选。\n\n### 列表 6-2 世界上最无聊的 for 循环\n\n```java\nvoid main() {\n \
  \   for (int count = 1; count <= 10; count++) {\n        print(\"The value of count\
  \ is \");\n        print(count);\n        println(\".\");\n    }\n    println(\"\
  Done!\");\n}\n```\n\n图 6-3 展示了你运行列表 6-2 中程序后的结果。（你得到的完全是你应得的。）列表 6-2 中的 `for` 语句首先将\
  \ `count` 变量设置为 1。然后该语句进行测试，确保 `count` 小于或等于 10（它确实如此）。接着，`for` 语句向前推进并执行大括号之间的打印语句。（在游戏的早期阶段，计算机打印出\
  \ `The value of count is 1`）。最后，`for` 语句执行了其括号内的最后的一件事——将 `count` 的值加 1。\n\n![“一张基于文本的图像，显示了一系列语句，表示名为\
  \ 'count' 的变量的值从 1 递增到 10，随后是单词‘Done!’。”](img/9781394289240-fg0603.png)\n\n图 6-3:\
  \ 数数到十。\n\n现在 `count` 等于 2，`for` 语句再次检查以确保 `count` 小于或等于 10。（是的，2 比 10 小。）因为测试通过了，`for`\
  \ 语句回到大括号内的语句中，并在屏幕上打印 `The value of count is 2`。最后，`for` 语句执行了其括号内的最后的一件事——将 `count`\
  \ 的值加 1，将 `count` 的值增加到 3。\n\n以此此类推。整个过程重复，直到在十次迭代后，`count` 的值终于达到了 11。当这种情况发生时，`count`\
  \ 小于或等于 10 的检查失败，循环结束。计算机跳转到 `for` 语句之后的语句。在列表 6-2 中，它打印 `Done!` 作为输出。图 6-3 展示了整个过程。\n\
  \n### for 语句的解剖\n\n在单词 `for` 之后，你总是会在括号里放入三个东西。这三个者各有它们的作用：\n\n- **初始化**：循环启动时执行一次。\n\
  - **表达式**：每次迭代前执行。\n- **更新**：每次迭代结束执行。\n\n![警告](img/warning.png) 如果你在 `for` 循环的初始化中声明变量，则无法在循环外使用它。例如，在列表\
  \ 6-2 中，如果在循环结束后尝试 `println(count)` 会报错。\n\n![提示](img/tip.png)任何可以用 `for` 循环完成的任务都可以用\
  \ `while` 循环完成。选择 `for` 循环是一种风格和便利性，而非必要性。\n\n### “湿了”的首演\n\n列表 6-2 非常不错，但该列表中的程序毫无趣味。对于一个更引人注目的例子，请参列表\
  \ 6-3。在列表 6-3 中，我履行了在第 5 章中的承诺：程序打印了热门单曲“湿了”的所有歌词。（你可以在第 5 章找到歌词。）\n\n### 列表 6-3\
  \ 无删减版“湿了”歌曲\n\n*（注：此处代码块内容根据指令要求不翻译，保持原样）*\n\n```java\nvoid main() {\n    String\
  \ intro = \"\"\"\n    Al's all wet. Oh, why is Al all wet? Oh,\n    Al's all wet\
  \ 'cause he's standing in the rain.\"\"\";\n    for (int verse = 1; verse <= 3;\
  \ verse++) {\n        println(intro);\n        println(\"Why is Al out in the rain?\"\
  );\n        println(switch (verse) {\n            case 1 -> \"That's because he\
  \ has no brain.\";\n            case 2 -> \"That's because he is a pain.\";\n  \
  \          case 3 -> \"'Cause this is the last refrain.\";\n            default\
  \ -> \"\";\n        });\n        switch (verse) {\n            case 3:\n       \
  \         println(\"Last refrain, last refrain,\");\n            case 2:\n     \
  \           println(\"He's a pain, he's a pain,\");\n            case 1:\n     \
  \           println(\"Has no brain, has no brain,\");\n        }\n        println(\"\
  \"\"\n        In the rain, in the rain.\n        Oh, oh, oh, oh\"\"\");\n      \
  \  println(\"\");\n    }\n    println(intro);\n}\n```\n\n\n\n\n列表 6-3 非常棒，因为它结合了第\
  \ 5 章和第 6 章中的许多思想。列表 6-3 在一个 `for` 循环内部嵌套了两个切换语句。其中一个是一个 `switch` 表达式；另一个是带有贯穿（fall-through）的\
  \ `switch` 语句。随着 `for` 循环计数变量（`verse`）的值从 `1` 变为 `2` 再到 `3`，Java 会执行这两个 `switch`\
  \ 中的所有部分。当程序接近运行末尾且执行退出 `for` 循环时，程序的最后一条语句会打印歌曲的最后一段节。\n\n![技术细节](img/technicalstuff.png)\
  \ 当我大胆地声称 `for` 语句是为了计数的时，我只是稍微夸大了事实。Java 的 `for` 语句是**多用途的**：你可以在与计数完全无关的情况下使用\
  \ `for` 语句。例如，一个没有更新部分的语句，如 `for (i = 0; i < 10; )`，它会一直运行。当循环内部的动作给变量 `i` 分配了一个大数时，循环结束。你甚至可以创建一个括号内为空的\
  \ `for` 语句。循环 `for ( ; ; )` 会永远运行，如果这个循环控制着一台重要的机器，这将很好。通常，当你写一个 `for` 语句时，你是在计算重复某内容的次数。但实际上，你可以用\
  \ `for` 语句执行任何类型的重复。\n\n![试一试](img/tryitout.png) 想要练习一下吗？尝试这些实验和挑战：\n\n### 为了爱（FOR）\n\
  \n`for` 语句的初始化可能有几个部分。`for` 语句的更新也可能包含几个部分。要了解如何做到，请在 Java 的 JShell 中输入以下行，或将这些行添加到一个小型\
  \ Java 程序中：\n\n```java\nfor (int i = 0, j = 10; i < j; i++, j--) {System.out.println(i\
  \ + \" \" + j);)}\n```\n\n在这段代码中，我建议调用 `System.out.println` 而不是简单的 `println`。以我所在的\
  \ 2024 年，JShell 还不接受更短的 `println` 调用。无论如何，`System.out.println` 总是有效的。\n\n### 收集值\n\
  \n以下代码的输出是什么？\n\n```java\nint total = 0;\nfor (int i = 0; i < 10; i++) {\n    total\
  \ += i;\n}\nSystem.out.println(total);\n```\n\n在这段代码中，变量 `total` 被称为“累加器”（accumulator），因为它在循环内部累积（相加）了一系列值。\n\
  \n### 阶乘\n\n在数学中，感叹号（`!`）表示**阶乘**（factorial）——当你将直到包含某个数字的所有正 `int` 值相乘时得到的数字。例如，3!\
  \ 是 1 × 2 × 3，等于 6。而 5! 是 1 × 2 × 3 × 4 × 5，等于 120。\n\n编写一个程序，让用户输入一个正 `int` 值（称为\
  \ `n`），然后 Java 将 `n!` 的值作为输出显示。\n\n### 看到星星\n\n在不运行以下代码的情况下，尝试预测代码的输出：\n\n```java\n\
  for (int row = 0; row < 5; row++) {\n    for (int column = 0; column < 5; column++)\
  \ {\n        print(\"*\");\n    }\n    println();\n}\n```\n\n做出预测后，运行代码以检查你的预测是否正确。\n\
  \n### 看到越来越多的星星\n\n这个实验中的代码是上一个实验代码的微调。首先，尝试预测代码将输出什么。然后运行代码以检查你的预测是否正确：\n\n```java\n\
  for (int row = 0; row < 5; row++) {\n    for (int column = 0; column <= row; column++)\
  \ {\n        print(\"*\");\n    }\n    println();\n}\n```\n\n### 三个三角形\n\n编写一个程序，使用循环连续显示以下模式的三个副本：\n\
  \n```\n*****\n****\n***\n**\n*\n```\n\n## 你总能得到你想要的\n\n> *愚者冲向天使胆畏之的地方。*\n>\n> ——亚历山大·波普\n\
  \n今天，我想变得年轻而愚蠢（或者至少是愚蠢）。回顾图 6-2，注意 Java 的 `while` 循环是如何工作的。当执行进入 `while` 循环时，计算机会检查循环条件是否为真。如果条件不成立，循环内部的语句永远不会执行——即使一次也没有。事实上，你可以轻松构造出一个语句永远不会执行的\
  \ `while` 循环（尽管我想不出你为什么想这样做）：\n\n```java\nint twoPlusTwo = 2 + 2;\nwhile (twoPlusTwo\
  \ == 5) {\n    println(\"\"\"\n}\n```\n\n尽管有这个 `while` 示例，`while` 循环证明是 Java 中最多用途的。\n\
  \n\n\n\n图 6-6 显示了列表 6-4 中循环的控制流。使用 `do` 循环，`twoPlusTwo` 程序（显示在本节开头）中的情况永远不会发生。因为\
  \ `do` 循环在不测试条件的情况下执行其第一个动作，所以每个 `do` 循环都保证至少执行一次迭代。\n\n![“一个带有删除证据决策过程的流程图。第一个决策点询问‘删除证据吗？’，箭头指向‘否’和‘是”。如果为“否”，过程结束。如果为“是”，下一个决策点询问‘回复是\
  \ y 还是 n？’。如果为“否”，过程结束。如果为“是”，最后一步是‘删除文件或不删除（取决于回复）”。](img/9781394289240-fg0606.png)\n\
  \n图 6-6: 让我们开始循环，`do` 循环。\n\n### 谁移动了我的文件？\n\n列表 6-4 中的 `cookedBooks.txt` 文件在你计算机硬盘上的位置取决于几个因素。如果你在错误的目录中创建了\
  \ `cookedBooks.txt` 文件，列表 6-4 中的代码将无法删除你的文件。（更准确地说，如果 `cookedBooks.txt` 位于硬盘上错误的目录中，列表\
  \ 6-4 中的代码将找不到用于删除文件准备的 `cookedBooks.txt` 文件。）\n\n在大多数情况下，你通过在 IDE 中创建一个项目来开始测试列表\
  \ 6-4。新项目存在于硬盘上的一个文件夹中。该文件夹被称为项目的根目录。有了列表 6-4 中的代码，`cookedBooks.txt` 文件可能直接属于你的项目根目录。\n\
  \n例如，我有一个名为 `06-04` 的项目。该项目存在我硬盘上一个名为 `06-04` 的文件夹中——即项目的根目录。在 `06-04` 根目录内部，我有一个名为\
  \ `cookedBooks.txt` 的文件。此外，在 `06-04` 文件夹内部，我还有一个 `src` 子文件夹。`src` 子文件夹包含我的 `DeleteEvidence.java`\
  \ 文件。\n\n![提示](img/tip.png) 如果将 `cookedBooks.txt` 放在项目根目录下不起，请将其放在包含列表 6-4 代码的文件夹中。并且，如果其他方法都失败了，请在\
  \ `new File` 语句之后向列表 6-4 添加以下代码：\n\n```\ntry {\nprintln(\"Looking for \" + evidence.getCanonicalPath());\n\
  } catch (java.io.IOException e) {\ne.printStackTrace();\n}\n```\n\n当你运行代码时，Java\
  \ 会告诉你 `cookedBooks.txt` 文件应该在你硬盘的哪里。\n\n![交叉引用](img/crossreference.png) 有关文件及其文件夹的更多信息，请参见第\
  \ 9 章。\n\n### 读取单个字符\n\n`readln` 方法获取整行键盘输入并将其传递给你的 Java 程序。对于 Java 而言，此输入是一个 `String`\
  \ 实例。这对于某些程序是可以的，但在列表 6-4 中，你并不感兴趣读取整行文本。你期望用户按下一个字母——`y` 或 `n`。因此，在列表 6-4 中，我没有创建一个\
  \ `String` 变量来存储用户的响应。相反，我创建了一个 `char` 变量——一个一次只存储一个符号的变量。\n\n列表 6-4 中的 `reply`\
  \ 变量类型为 `char`。因此我必须找到一种方法将巨大的 `readln` 字符串塞入 `reply` 变量微小的 `char` 中。我通过调用 `String`\
  \ 类的 `charAt` 方法来实现这一点。当你对字符串应用 `charAt` 时，你会得到单个 `char` 值。参见表 6-1。\n\n| `myString`\
  \ 的值 | 包含 `charAt` 的表达式 | 表达式的值 |\n| --- | --- | --- |\n| `\"yes\"` | `myString.charAt(0)`\
  \ | `'y'` |\n| `\"no\"` | `myString.charAt(0)` | `'n'` |\n| `\"Yes\"` | `myString.charAt(0)`\
  \ | `'Y'` |\n\n\n\n\n\n当然，你无法删除一个并不存在的东西。即使是阿尔尔·卡波（Al Capone）也不会费精力去删除不存在的证据。为了避免某些不必要的方法调用，你有几种选择。最简单的是调用\
  \ `File` 类的 `exists` 方法。\n\n```java\nimport java.io.File;\n\nvoid main() {\n  var\
  \ evidence = new File(\"cookedBooks.txt\");\n  if (evidence.exists()) {\n    //\
  \ 其余代码放在这里。\n  }\n}\n```\n\n当你调用 `evidence.exists()` 时，该方法会在 Java 预期 `cookedBooks.txt`\
  \ 的文件夹中查找。如果 Java 在该文件夹内找到了 `cookedBooks.txt`，则 `evidence.exists()` 的值为 `true`。否则，`evidence.exists()`\
  \ 为 `false`。\n\n## while 侧的块\n\n由大括号包围的一系列语句形成一个块（参见第 5 章）。如果你在块内部声明了一个变量，通常无法在块外部使用该变量。例如，在列表\
  \ 6-4 中，如果你进行以下更改，就会看到一些错误信息：\n\n```java\ndo {\n  char reply = readln(\"Delete evidence?\
  \ (y/n) \").charAt(0);\n} while (reply != 'y' && reply != 'n');\nif (reply == 'y')\n\
  \  // …… 等。\n```\n\n由于在循环的大括号内部声明了 `char reply`，因此在大括号之外的任何地方使用 `reply` 名称都是没有意义的。当你尝试编译这段代码时，你会得到三条错误信息——两条针对\
  \ `while (reply != \"y\" && reply != \"n\")` 中的 `reply` 单词，第三条针对 `if` 语句中的 `reply`。\n\
  \n因此，在列表 6-4 中，你束手无策了。程序对 `reply` 变量的第一次实际使用是在块的大括号内部。但为了让该变量在括号外部可用，你必须在块开始之前声明\
  \ `reply`。在这种情况下，最好的办法是声明 `reply` 变量但不对其初始化。非常有趣！\n\n![交叉引用](img/crossreference.png)\
  \ 要了解更多关于变量初始化知识，请参见第 4 章。\n\n所有版本的 Java 都具有本章描述的三种循环（`while` 循环、`for` 循环和 `do …\
  \ while` 循环）。但较新的 Java 版本（特别是 Java 5 及更高版本）还有另外一种循环，被称为增强 for 循环。要查看 Java 的增强 `for`\
  \ 循环，请参见第 12 章和第 13 章。\n\n### 错过的机会\n\n![尝试](img/tryitout.png) 从列表 6-1 中复制代码，但进行以下更改：\n\
  \n```java\nString input = readln(\"Pick a number from 1 to 10: \");\nint inputNumber\
  \ = Integer.parseInt(input);\nnumGuesses++;\n\ndo {\n  println(\"\");\n  println(\"\
  Try again…\");\n  input = readln(\"Pick a number from 1 to 10: \");\n  inputNumber\
  \ = Integer.parseInt(input);\n  numGuesses++;\n} while (inputNumber != randomNumber);\n\
  \nprint(\"You win after \");\nprintln(numGuesses + \" guesses.\");\n```\n\n列表 6-1\
  \ 中的代码有一个 `while` 循环，但这段修改后的代码有一个 `do` 循环。这段修改后的代码运行正常吗？为什么？为什么不？\n\n### 让我们离开这里\n\
  \n在第 5 章中，你使用 `break` 语句跳出 `switch`。但 `break` 语句也可以在循环内部发挥。要发现它是如何工作的，请运行包含以下代码的程序：\n\
  \n```java\nwhile (true) {\n  int i = Integer.parseInt(readln(\"Enter an int value:\
  \ \"));\n  if (i == 0) {\n    break;\n  }\n  println(i);\n}\nprintln(\"Done!\");\n\
  ```\n\n循环的条件始终为 `true`。它就像用 `while (1 + 1 == 2)` 启动循环一样。如果没有 `break` 语句，循环将永远运行下去。幸运的是，当你执行\
  \ `break` 语句时，Java 会跳转到循环紧后的代码。\n\n### 继续编写\n\n除了 `break` 语句外，Java 还有一个 `continue`\
  \ 语句。当你执行 `continue` 语句时，Java 会跳到循环的结束并开始该循环的下一次迭代。要看到它的作用，请运行包含以下代码的程序：\n\n```java\n\
  while (true) {\n  int i = Integer.parseInt(readln(\"Enter an int value: \"));\n\
  \  if (i > 10) {\n    continue;\n  }\n  if (i == 0) {\n    break;\n  }\n  println(i);\n\
  }\nprintln(\"Done!\");\n```\n\n# 第三部分：使用对象\n\n### 第 7 章：定义类（账户意味着什么）\n\n一个银行账户与另一个账户有什么区别？如果你向银行家问这个问题，你会听到一段长长的推销。对你来说的是，我对这些并不。相反，我想知道我的账户和你的有什么区别。毕竟，我的账户名叫\
  \ *Barry Burd*，经营 *Burd Consulting*，而你的账户名叫 *Jane Q. Reader*，经营 *Budding Java Expert*。我的账户里有\
  \ $24.02。你的呢？\n\n归结底，账户与账户之间的区别可以总结为变量的值。也许有一个名为 `balance` 的变量。对我来说，`balance` 的值为\
  \ `24.02`。对你来说，`balance` 的值为 `55.63`。问题是，在编写处理账户的计算机程序时，如何将我的 `balance` 变量与你的 `balance`\
  \ 变量分开？\n\n答案是创建两个独立的对象。让一个 `balance` 变量位于一个对象内部，让另一个 `balance` 变量位于另一个内部。顺便给每个对象放入一个\
  \ `name` 变量和一个 `address` 变量。这样，每个对象代表一个账户。更准确地说，每个对象都是 `Account` 类的实例。（参见图 7-1）。\n\
  \n![代表“账户类”实例的两个图，包含名称、地址和余额](img/9781394289240-fg0701.png)\n\n图 7-1：两个对象。\n\n![记住](img/remember.png)\
  \ *对象*和*实例*这两个词的意思相同。`Account` 类就像是你用它来构建对象的蓝图。使用 `Account` 类构建的每个对象都是 `Account`\
  \ 类的*实例*。\n\n\n\n\n\n图 7-1 有两个名称、两个地址和两个余额。因此我想问，在 Java 程序中，你如何区分我的余额和你的余额呢？嗯，你那里有两个对象放在那里，所以你可能有两个变量来引用这两个对象。创建一个名为\
  \ `myAccount` 的变量和另一个名为 `yourAccount` 的变量。`myAccount` 变量引用我的对象（我这个 `Account` 类的实例），并包含了它内部所有的内容。要引用我的余额，写下：\n\
  \n`myAccount.balance`\n\n要引用我的名字，写下：\n\n`myAccount.name`\n\n然后 `yourAccount.balance`\
  \ 指的是你对象中 `balance` 变量的值，而 `yourAccount.name` 指的是你对象中 `name` 变量的值。要告诉 Java 我在账户里有多少钱，你可以写下：\n\
  \n`myAccount.balance = 24.02;`\n\n由于缺乏更专业的术语，这种引用对象值的方式被称为*点符号表示法*。要在屏幕上显示你的名字，你可以写下：\n\
  \n`println(yourAccount.name);`\n\n这些思想在 代码列表 7-1 和 7-2 中汇合。这里是 代码列表 7-1：\n\n####\
  \ 代码列表 7-1：账户的含义\n\n```\nclass Account {\n  String name;\n  String address;\n  double\
  \ balance;\n}\n```\n\n代码列表 7-1 中的 `Account` 类定义了什么是一个 `Account`。具体来说，代码列表 7-1 告诉你，`Account`\
  \ 类的每个实例都有三个变量：`name`、`address` 和 `balance`。这与 图 7-1 中的信息一致。Java 程序员对这种变量（属于类实例的变量）有一个特殊的名称。这些变量中的每一个\
  \ —— `name`、`address` 和 `balance` —— 都被称为*字段*。\n\n![记住](img/remember.png) 在类内部声明但不在任何特定方法内部声明的变量是*字段*。在\
  \ 代码列表 7-1 中，变量 `name`、`address` 和 `balance` 就是字段。\n\n如果你一直在苦苦读之前章节的内容，那么 代码列表 7-1\
  \ 中 `Account` 类的代码可能会让你感到惊讶。你真的只用四行代码就能定义一个完整的 Java 类吗（算上大括号的话）？你完全可以。*类*是对现有事物的分组。在\
  \ 代码列表 7-1 的 `Account` 类中，那些现有的事物是两个 `String` 值和一个 `double` 值。\n\n![警告](img/warning.png)\
  \ 你的 IDE 不会提议运行 代码列表 7-1 中的代码。那是因为 代码列表 7-1 没有 `main` 方法。每个 Java 程序的运行必须从 `main`\
  \ 方法开始，因此 代码列表 7-1 中的代码没有起点。要使用该代码列表中的 `Account` 类，你的项目必须包含两个 Java 文件：一个包含 代码列表\
  \ 7-1 中代码的文件，另一个包含 `main` 方法的文件。在本章中，代码列表 7-2 有一个非常实用的 `main` 方法，所以 代码列表 7-1 中的\
  \ `Account` 类就不会被浪费。\n\n### 声明变量和创建对象\n\n当我走在街上时，一个年轻的小伙走过来。他告诉我打印 2 + 2 的值，于是我打印了数字\
  \ 4。如果你非要知道，我是用粉笔在人行道上打印的。但我在哪里打印数字 4 并不重要。重要的是某人发布了指令，我执行了指令。\n\n那天晚些时候，一位老太太坐在公园长椅的我旁边。她说：“账户有一个名字、一个地址和一个余额。”我说：“没问题，但你想让我对它做什么呢？”作为回答，她只是盯着我，所以我没有对她的那个*账户*陈述做任何事情。我只是坐在那儿，她也坐在那儿，我们两个都什么都没做。\n\
  \n代码列表 7-1 和 7-2 展示了这些思想是如何工作的。\n\n#### 代码列表 7-2：处理对象\n\n```\nvoid main(String[]\
  \ args) {\n  Account myAccount = new Account();\n  myAccount.name = \"Barry\";\n\
  \  myAccount.address = \"222 Cypace\";\n  myAccount.balance = 24.02;\n\n  Account\
  \ yourAccount = new Account();\n  yourAccount.name = \"Jane\";\n  yourAccount.address\
  \ = \"111 Consumer Street\";\n  yourAccount.balance = 55.63;\n\n  println(myAccount.name\
  \ + \" (\" + myAccount.address + \") has $\" + myAccount.balance);\n  println(yourAccount.name\
  \ + \" (\" + yourAccount.address + \") has $\" + yourAccount.balance);\n}\n```\n\
  \n\n\n\n\n有些人读 `Account myAccount` 时，认为它的意思是“`myAccount` 是一个 `Account`”或“变量 `myAccount`\
  \ 指向 `Account` 类的实例”。这并不是 `Account myAccount` 的真实含义。相反，`Account myAccount` 的意思是：“当我让变量\
  \ `myAccount` 指向某个东西时，那个东西将是 `Account` 类的实例。”那么，区别在哪里呢？\n\n区别在于，仅仅声明 `Account myAccount`\
  \ 并不会让 `myAccount` 变量引用一个对象。它只是预留了变量名 `myAccount`，以便该名称最终指向 `Account` 类的实例。只有当 Java\
  \ 执行 `new Account()` 时，实际对象的创建才会发生。\n\n#### 一个程序；多个类\n\n第 3 至 6 章中的每个程序都包含一个类。这对于书籍的入门章节来说很棒。但在现实生活中，一个典型的程序由成百甚至数千个类组成。跨越\
  \ 示例 7-1 和 7-2 的程序包含两个类。当然，拥有两个类并不像拥有数千个类，但这是向该方向迈的一步。\n\n在实践中，大多数程序员会将每个类放在单独的文件中。当你创建一个程序时（例如示例\
  \ 7-1 和 7-2 中的程序），你会在计算机的硬盘上创建两个文件。因此，当你从网上下载本章节的示例时，你会得到两个独立的文件——`Account.java`\
  \ 和 `UseAccount.java`。\n\n![在网上](img/ontheweb.png) 有关如何在 Eclipse、NetBeans、IntelliJ\
  \ IDEA 和 VS Code 中运行由多个 `.java` 文件组成的程序的信息，请访问本书的网站（[`javafordummies.allmycode.com`](http://javafordummies.allmycode.com/)））。\n\
  \n#### 未选择的路\n\n如果你愿意，可以在类声明中初始化字段。例如，你可以这样写：\n\n```java\nclass Account {\n    String\
  \ name = \"\";\n    String address = \"(Unknown)\";\n    double balance = 0.00;\n\
  }\n```\n\n然后，在你创建了 `Account` 类实例后，你可以覆盖部分或全部初始值：\n\n```java\nyourAccount.name =\
  \ \"Jane Q. Public\";\nyourAccount.balance = 55.63;\n```\n\n但有些事情是你绝对不能做的。第 6 章告诉你，当你初始化变量时，可以用\
  \ `var` 替换变量的类型名称。换句话说，你可以这样写：\n\n```java\nvoid main() {\n    var evidence = new\
  \ File(\"cookedBooks.txt\"); // 可以！\n    var reply = 'n'; // 可以！\n    //……以此此类推。\n\
  }\n```\n\n是的，关于 `var` 的这条规则适用于你在方法体声明的变量。但它*不适用于*类的字段。\n\n我用几行代码来说说明这个概念：\n\n```java\n\
  class Account {\n    String name; // 这是可以的。\n    String address = \"(Unknown)\"\
  ; // 这也是可以的。\n    var balance = 0.00; // 不可以。它应该是 'double'。 // 请原谅！\n}\n```\n\n\
  老实说，输入 `var balance` 这一行让我很紧张，即使我正警告你这一行是错误的。当你创建一个类的字段时，可以初始化字段也可以不初始化。这取决于你。但你不能在字段声明中使用\
  \ `var`。\n\n![尝试](img/tryitout.png) 轮到你创建一些 Java 类了。\n\n#### 组织工作\n\n一个 `Organization`（组织）有一个名称（例如\
  \ *XYZ Company*）、一个年收入（例如 $100,000.00）以及一个指示该组织是否为营利组织的 `boolean` 布尔值。制造和销售产品的公司通常是营利组织；而为自然灾害受害者提供援助的团体通常不是营利组织。\n\
  \n声明你自己的 `Organization` 类。声明一个 `main` 方法，用于创建组织并显示这些组织的信息。\n\n#### 美味食物\n\n食品商店中出售的产品有几个特征：食物类型（桃子片）、重量（500\
  \ 克）、成本（$1.83）、份数（4 份）以及每份的热量（70 卡里）。\n\n声明一个 `FoodProduct` 类。声明一个 `main` 方法，用于创建\
  \ `FoodProduct` 实例并显示这些实例的信息。\n\n#### 动消费\n\n尝试运行以下代码（并确保你理解为什么它无法运行）。\n\n```java\n\
  class Purchase {\n    String itemName;\n    int quantity;\n}\n\nvoid main() {\n\
  \    Purchase purchase;\n    purchase.itemName = \"book\";\n    purchase = new Purchase();\n\
  \    println(purchase.itemName);\n}\n```\n\n\n\n\n\n在表 7-2 中，每个账户对象包含四个内容：一个名称、一个地址、余额以及在屏幕上显示自身的方式。列表\
  \ 7-3 和 7-4 展示了实现表 7-2 中思路的程序。\n\n### 列表 7-3](#c07.xhtml_rc07-fea-0003) 账户显示自身\n\
  \n```java\nimport java.io.IO;\nclass Account {\n  String name;\n  String address;\n\
  \  double balance;\n  void display() {\n    IO.print(name + \" (\" + address + \"\
  ) \" + \"has $\" + balance);\n  }\n}\n```\n\n### 列表 7-4](#c07.xhtml_rc07-fea-0004)\
  \ 使用改进后的 Account 类\n\n```java\nvoid main() {\n  var myAccount = new Account();\n\
  \  var yourAccount = new Account();\n  myAccount.name = \"Barry Burd\";\n  myAccount.address\
  \ = \"222 Cyberspace Lane\";\n  myAccount.balance = 24.02;\n  yourAccount.name =\
  \ \"Jane Q. Public\";\n  yourAccount.address = \"111 Consumer Street\";\n  yourAccount.balance\
  \ = 55.63;\n  myAccount.display();\n  println(\"\");\n  yourAccount.display();\n\
  \  println(\"\");\n}\n```\n\n运行列表 7-3 和 7-4 中的代码，与运行列表 7-1 和 7-2 的运行看起来完全一样。（请参考图\
  \ 7-3。）\n\n在列表 7-3 中，`Account`类包含四个内容：三个字段（`name`、`address`和`balance`）和一个`display`方法。合起来，类的字段和方法被称为该类的*成员*（members）。`Account`\
  \ 类的成员与表 7-2 中的四列相对应。\n\n注意你是如何引用 `Account`类成员的：\n\n*   要引用 `myAccount` 对象的 `name`，你写\
  \ `myAccount.name`\n*   要让 `myAccount` 对象在屏幕上显示自身，你写 `myAccount.display()`\n\n就像\
  \ `name` 引用一样，这个 `display` 引用也使用了点符号法。唯一的区别是，调用方法使用括号，而引用字段则不。\n*   在 `Account`\
  \ 类的声明内部，你可以在不使用点符号法的情况下引用成员。例如，在列表 7-3 中，语句 `IO.print(name + \" (\" + address +\
