  \n## 查找新闻、评论和示例代码\n\n有关专家的文章，请访问 [`www.infoq.com`](https://www.infoq.com) 上的 InfoQ\
  \ 和 [`www.theserverside.com`](https://www.theserverside.com/) 上的 TheServerSide。你可以在这两个网站找到好的读物。\n\
  \n## 对任何事情都有技术问题吗？\n\n如果你遇到瓶颈并需要帮助，请在 Stack Overflow ([`stackoverflow.com``](https://stackoverflow.com))\
  \ 上搜索答案并发布问题。\n\n你也可以在 Coderanch 上提问：“一个对编程新手的友好场所” ([`coderanch.com``](https://coderanch.com/))。对于\
  \ Java 的特定问题，请访问 [`https://coderanch.com/c/java`](https://coderanch.com/c/java)。\n\
  \n## 参与 Java 的未来\n\n*Java 社区进程* (JCP) “……是为 Java 技术制定标准技术规范的机制。任何人都可以注册……并参与 Java\
  \ 规范请求 (JSR) 的评审和提供反馈。”有关 JCP 身份的更多信息，请访问 [`www.jcp.org/en/participation/membership_ind`](https://www.jcp.org/en/participation/membership_ind)\
  \ 。\n\n# 第 18 章\n\n# 给新软件开发者的十条建议\n\n在本章中\n\n![Bullet](img/check.png) **学习什么**\n\
  ![Bullet](img/check.png) **如何学习更多**\n![Bullet](img/check.png) **找工作时该做什么**\n![Bullet](img/check.png)\
  \ **其他免费建议**\n\n我喜欢听听我书读者的反馈。“做得好！”一位读者说道。另一个读者问道：“我可以在旧版本的 Java 上运行你书中的示例吗？”还有一位读者发布了这样：“做得好！”一位读者说道……（注：原文此处存在大量重复，已按要求处理并重复翻译）。\n\
  \n除了这十条建议外，我还有一条建议：\n\n> 批判性地思考你收到的建议。当你犹豫时，相信你的直觉。\n\n## 学习 Java 需要多长时间？\n\n答案取决于你——取决于你的目标、现有知识、逻辑能力、空闲时间以及对该主题的兴趣。\n\
  \n你对编程越感兴趣，学得越快。你的目标越野心，花费的时间越长。\n\n![Remember](img/remember.png) 没有所谓的“精通 Java”。无论你知道多少，总有新东西要学。我写过几本\
  \ Java 书，就我而言，我只是触了毛皮。\n\n## 我应该读你的哪本书？\n\n\n\n\n\n答案取决于你的目标。如果你计划以编写代码来谋生，那么答案取决于你所在之地的就业机会。TIOBE\
  \ 编程社区指数（[[`www.tiobe.com/tiobe-index`](https://www.tiobe.com/tiobe-index/)]）为热门编程语言提供每月排名。但\
  \ TIOBE 指数可能并不特别适用于你的情况。在 2021 年 6 月，Haskell 语言在全球使用的语言中仅排名第 47 位。但也许你所在的城市是一个 Haskell\
  \ 编程的热点。\n\n你想为大型企业编写应用程序吗？那么 `Java` 是一门必不可少的语言。你想做数据科学吗？如果是的话，你应该学习 `Python`。你想创建网页吗？学习\
  \ `HTML`、`CSS` 和 `JavaScript`。\n\n## 除了计算机编程，我应该学习学习哪些技能？\n\n很遗憾让你失望了，但你正在问的是一个可能带有偏见的人。我是一名大学教授。我相信，任何学习，无论看起来多么不切实际，绝不是徒劳的。\n\
  \n如果你坚持要一个更肯定的答案，那就去学习一下数据库。数据库工作不一定是编码，但它是非常重要的东西。此外，尽可能多读读 `software engineering`\
  \ —— 即用于有效设计和维护计算机代码的技术研究。不要害怕数学（因为学习数学可以锻炼你的逻辑思维肌肉）。而且，只要机会允许，要磨炼你的沟通技巧。你沟通得越好，你的工作对他人的价值就越大。\n\
  \n## 作为软件开发者，我应该如何继续我的学习？\n\n练习，练习，再练习。从我的书（或其他任何地方）找到示例，并思考修改代码的方法。在这里添加一个选项，或在那里添加一个按钮。\n\
  \n找出当你尝试改进代码时会发生什么。如果有效，就想另一种方法来更改。如果没有效果，请搜索文档以寻找你问题的解决方案。如果文档没有帮助（通常情况下，文档并没有帮助），请在网络上搜索你问题的答案。在在线论坛上发布问题。如果你没有找到答案，先放一放这个问题，让它在你的脑中孵化。\n\
  \n![Remember](img/remember.png) 你不能仅仅通过阅读来学习编程——你必须在编写代码和寻找解决方案时“磨破指节”。只有在尝试、失败并再次尝试之后，你才能体会到开发计算机软件所涉及的工作。\n\
  \n## 作为开发者，我还可以如何继续我的学习？\n\n你怎么知道我有第二个建议的？我建议在当地寻找志同道合的人并定期与他们聚聚。如今，你可以在全球几乎每个角落找到技术用户小组。在你所在的地区找一个\
  \ `Java` 用户小组，并经常参加小组的会议。如果你是一个新手，你可能无法理解大部分讨论内容，但你会接触到当 `Java` 开发者关注的问题。\n\n寻找更多技术小组并参加他们的会议。寻找关于其他编程语言、其他技术以及并非完全关于技术的题目的会议。面对面交流，找出哪些主题将出现在明年的书中。\n\
  \n为了补充这些面对面的会议，可以在网络上搜索屏幕会议。你几乎可以在一年任何时候找到免费的在线技术会议。\n\n## 我如何找到软件开发的工作？\n\n做你找工作时会做的一切，但不要忘记我对上一个问题的回答。用户小组是建立人的好地方。\n\
  \n参加会议并做一个良好的听者。不要想着推销自己。保持耐心并享受过程。我在参加几年小组会议后，才获得了一个很好的咨询机会。期间，我学习了许多关于软件的知识（以及许多关于与人相处的知识）。\n\
  \n## 我仍然不知道我的人生该怎么办\n\n这并不是一个问题。但无论如何都可以。\n\n每个人都必须维持生计。如果你能让自己有饭吃，那么下一步就是发现你喜欢做什么。我花了一辈子的时间教大学学生、写书和开发计算机代码——而且我热爱做这一切。（好吧，我热爱其中大部分。我厌恶批改卷子，也不喜欢校对自己的作品。）\n\
  \n幸运的是，可以通过教学、写作和开发来赚钱。我可以在大公司做 9-to-5 的工作、管理软件团队或创建下一个大初创公司来赚更多钱，但我并不喜欢做那些事情。因为我做我喜欢的事，无论我是否在工作，我的生活都变得丰富了。\n\
  \n我的建议是，找到你喜欢做的事和能帮助你维持生计的事之间的最佳平衡。如果必须，可以做出妥协，但对那些让你快乐的事要对自己保持诚实。（当然，这些事情不应该让其他人感到不快。）\n\
  \n最后，要具体地描述你的喜喜好。例如，说“我想变得富有”一点都不具体。说“我想创建一个伟大的游戏”更具体，但你可以做得更好。说“我喜欢设计游戏软件，但我需要一个能为我做营销的伙伴”非常具体，并形成了一个非常整齐的目标。\n\
  \n## 如果我还有其他问题，该如何联系你？\n\n这很简单。发送邮件到 `javafordummies@allmycode.com`。访问我那简陋但很有信息的网站。\n\
