  \ 的值为 `\"0.101\"`，\n*   `\"0.101\".substring(1)` 的值为 `\".101\"`，\n*   `\"0.101\"\
  .substring(2)` 的值为 `\"101\"`，\n\n……以此此类推。\n\n![“该图展示了一个 Java 程序的序图。它从名字 'Harry Burd'\
