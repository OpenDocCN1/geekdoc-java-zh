  \ {\n        super(scale);\n    }\n    public TemperatureForPercy(double number,\
  \ TempScale scale) {\n        super(number, scale);\n    }\n    @Override\n    public\
  \ String toString() {\n        return String.format(\"%2.0f \\u00B0\", getNumber())\
  \ +\n            switch (getScale()) {\n                case CELSIUS -> \"C\";\n\
  \                case FAHRENHEIT -> \"F\";\n                case KELVIN -> \"K\"\
  ;\n                case RANKINE -> \"R\";\n            };\n    }\n    public double\
  \ toCelsius() {\n        switch (getScale()) {\n            case CELSIUS -> getNumber();\n\
  \            case FAHRENHEIT -> (getNumber() - 32) * 5 / 9;\n            case KELVIN\
  \ -> getNumber() - 273.15;\n            case RANKINE -> (getNumber() - 491.67) *\
  \ 5 / 9;\n        }\n    }\n}\n```\n\n\n\n- 类似地，Listing 10-9 中的 `super(number)`\
  \ 和 `super(scale)` 语句调用了 Listing 8-2 中的构造函数。\n\n计算机通过查看 `super` 关键字后面的参数列表来决定调用\
  \ `Temperature` 类的哪一个构造函数。例如，当计算机执行\n\n```\nsuper(number, scale);\n```\n\n来自 Listing\
  \ 10-9 时，计算机心想：“括号中的 `number` 和 `scale` 字段类型分别为 `double` 和 `TempScale`。而在 Listing\
  \ 8-2 的 `Temperature` 构造函数中，只有一个具有两个类型为 `double` 和 `TempScale` 的参数。该构造函数的头部看起来如下：\n\
  \n```\npublic Temperature(double number, TempScale scale)\n```\n\n“所以我我想该执行那个特定构造函数内部的语句。”\n\
  \n### 使用这些内容\n\n在 Listing 10-9 中，我定义了成为 `TemperatureForPercy` 类的含义。现在是时候让这个 `TemperatureForPercy`\
  \ 类派上用场了。Listing 10-10 包含了使用 `TemperatureForPercy` 的代码。\n\nListing 10-10 使用 Percy\
  \ 的类\n\n```java\nvoid main() {\n  println(new TemperatureForPercy(2.73, TempScale.KELVIN));\n\
  \  println(new TemperatureForPercy(TempScale.CELSIUS));\n  println(new TemperatureForPercy(32.0));\n\
  \  var temperature = new TemperatureForPercy();\n  temperature.setNumber(70);\n\
  \  println(temperature);\n}\n```\n\nListing 10-10 创建了 `TemperatureForPercy` 类的实例，因此列表中的\
  \ `println` 调用访问的是 `TemperatureForPercy` 类中的 `toString` 方法，而不是父类 `Temperature` 类。\n\
  \nFigure 10-9 显示了 Listing 10-10 中代码的运行情况。\n\n![一个四行两列的表格。左列包含数字 3, 6, 32 和 70。右列包含字母\
  \ K, C, Z 和 Z。”](img/9781394289240-fg1009.png)\n\nFIGURE 10-9: 终于！Percy 很高开心。\n\n\
  阅读 Listing 10-9 中第一次 `super()` 调用后的注释。尝试移除该 `super` 调用，你会发现你仍然得到了 Figure 10-9 所示的输出。这说明了什么？它告诉你，在某些情况下，Java\
  \ 会为你构造函数添加一个无参数的 `super()` 调用。\n\n那么那些“某些情况”是什么？下一节将揭示答案。\n\n### 构造函数的疯狂\n\n上一节的核心信息是子类不继承构造函数。当你将其与其他一些关于构造函数的规则结合时，会得到一些意外的结果。以下是关于构造函数的实：\n\
  \n1. 子类不从父类继承任何构造函数。\n2. 当你定义一个类且没有显式编写任何构造函数的代码时，Java 会为你生成一个无参数的默认构造函数。\n   这条规则是双向的。如果你显式地编写了构造函数的代码，Java\
  \ 就不会为你生成默认构造函数。\n3. 当类包含一个构造函数，且该构造函数没有包含如下语句时：\n   ```\n   super(some parameters\
  \ or no parameters);\n   ```\n   那么 Java 会为你生成一个无参数的 `super()` 调用。换句话说，Java 会替你调用父类的无参数构造函数。\n\
  \n为了看到这些规则的运作，请考虑 Listing 10-11 到 10-13 中的代码。\n\nListing 10-11 在厨房中寻求帮助\n\n```java\n\
  public class KitchenItem {\n  public String purpose;\n  public KitchenItem() {\n\
  \    System.out.println(\"\"\"\n    你调用了无参数的\n    KitchenItem 构造函数.\"\"\");\n  }\n\
  }\n```\n\nListing 10-12 不要用手拿\n\n```java\nenum Material {METAL, PLASTIC, WOOD}\n\
  public class Utensil extends KitchenItem {\n  public Material material;\n  public\
  \ Utensil(String purpose, Material material) {\n    this.purpose = purpose;\n  \
  \  this.material = material;\n  }\n}\n```\n\nListing 10-13 你可能需要\n\n```java\npublic\
  \ class Fork extends KitchenItem {\n  // ... 其他代码\n}\n```\n\n如果你编写了上述代码，Listing\
  \ 10-13 会报错：`Utensil` 没有默认构造函数。你可以通过在 `Utensil` 类中显式添加无参数构造函数来解决这个问题。\n\n\n\n\n\
  # 第 11 章\n\n# 将变量和方法放在它们所属的地方\n\n## 本章内容\n\n- ![Bullet](img/check.png) 让某些内容属于整个类\n\
  - ![Bullet](img/check.png) 将变量放在方法内部和外部\n- ![Bullet](img/check.png) 提高你的击球率\n\n\
  我们社区的小学有一项年度传统：每年春季，五年级的学生都会去费城进行为期一天的实地考察。当我儿子上五年级时，我一起去了学校，负责监督 20 个孩子中的 4 个。当我和那\
  \ 4 个孩子游览历史遗迹时，我不小心弄丢了规划好的行程单。我不知道下一步该去哪里了。那么，我该怎么办？我采取了任何称职费城当地人都会做的事——无视行程单，带着孩子们去了最近的一家廉价餐厅。我请他们吃了一顿费城的特色菜——肥肉满满、油油腻的费城芝士牛肉三明治（Philadelphia\
  \ cheesesteak）。\n\n这个故事和 Java 有什么关系呢？这很简单。这一章关于**访问权限**（access）——一个类的代码如何获取另一个类代码的访问。我的费城轶事也是关于访问权限的。旅行结束后不久，我儿子五年级的老师听说了我在游览期间的那些胡闹。后来，当我女儿上五年级时，老师说我不欢迎参加当年的费城之旅了。老师撤销了我的访问那些费城芝士牛肉三明治的权限。\n\
  \n## 创建包\n\n今天，我们当地的棒球球队对阵于邻镇的球队。我们的球队是手巾队（Hankies），另一个镇的是袜子队（Socks）。作为球队的官方记录员，我创建了代码来跟踪球员的姓名和击球率。（参见\
  \ Listing 11-1）。）\n\nListing 11-1 球员记录类\n\n```java\npackage com.example.baseball;\n\
  \npublic record Player(String name, double average) {\n\n}\n```\n\n哇！这真是一段极短的代码！（如果你对\
  \ Listing 11-1 中发生的情况有疑问，请参考第 8 章中关于记录类（record classes）的章节。）总之，每个 `Player` 实例都有一个\
  \ `name` 字段和一个 `average` 字段。创建 `Player` 实例的方法只有一个：调用 `new Player(a_name, an_average)`。一旦你创建了球员，就无法更改该球员的姓名或平均率。要获取特定球员的姓名和平均率，你只需调用记录类的\
  \ `name()` 和 `average()` 方法。就此而已。\n\n作为对比，《傻瓜学 Java》（*Java For Dummies*）之前的版本中的\
  \ `Player` 类看起来这样：\n\n```java\npublic class Player {\n    String name;\n    double\
  \ average;\n    public Player(String name, double average) {\n        this.name\
  \ = name;\n        this.average = average;\n    }\n}\n```\n\n这段旧代码的功能大部分与 Listing\
  \ 11-1 中的代码相同。\n\n### 包的机制\n\nListing 11-1 中的 `Player` 类属于我命名为 `com.example.baseball`\
  \ 的包。Listing 11-1 中的第一行决定了这一点。那第一行被称为*包声明*（package declaration）。该行写道：“此文件是名为 `com.example.baseball`\
  \ 的包内的可能多个文件之一。”\n\n在 Java 中，每个类都属于一个包。想象有一个名为 `Hello.java` 的文件，其中只包含以下文本：\n\n```java\n\
  void main() {\n    println(\"Hello\");\n}\n```\n\n由于文件名，这个 `main` 方法属于一个名为 `Hello`\
  \ 的隐式类。而这个 `Hello` 类属于一个隐式包。Java 开发者称之为*未命名包*（unnamed package）。\n\n之前章节中的代码示例都没有以包声明开头，因此这些示例都属于一个未命名包。但专业的\
  \ Java 程序员会避免使用未命名包。因此，在 Listing 11-1 中，我决定重回轨道，正规起。\n\nJava API 定义了数千个类，每个类都属于数百个包之一。当你编写\
  \ `import java.util.Scanner` 时，你指的是一个名为 `Scanner` 的类，它属于 `java.util` 包。\n\n在 Java\
  \ 世界中，程序员习惯给包起长的、包含点的名称。例如，我注册了域名 [`allmycode.com`](http://allmycode.com)，所以我可能会将一个包命名为\
  \ `com.allmycode.dummiesframe`。事实上，我可以给包命名任何我想要的名称——比如 `com.example.baseball`、`fish.and.chips`\
  \ 或简单的 `hamburger`。无论什么情况下，像 `com.allmycode.dummiesframe` 这样具有信息的包名都比 `midnight.in.akron`\
  \ 或 `do.not.run.this` 这样幼稚的名字要好。\n\n![Bullet](img/check.png) 让某些内容属于整个类\n\n\n\n\n\
  \n```java\nfor (int num = 1; num <= 9; num++) {\n    var player = new Player(hankiesData.nextLine(),\n\
  \    hankiesData.nextDouble());\n    hankiesData.nextLine();\n    IO.print(String.format(\"\
  %-40s\", player.name()));\n    IO.println(String.format(\"%.3f\", player.average()).substring(1));\n\
  }\nhankiesData.close();\n}\n```\n\n在一个典型的 Java 应用程序中，应用程序的类属于几个不同的包。而这些包中的代码依赖于其他组织包中的代码。像本书书中这样只有一或两个包的例子确实非常罕见。\n\
  \n对于我的棒球示例，我将 `Player` 类放在一个命名为 `com.example.baseball` 的包中，并将 `ShowPlayers` 类放在\
  \ Java 中无处不在的无名包中。由于 `ShowPlayers` 类与我的 `Player` 类不在同一个包中，因此我在 Listing 11-2 的开头使用了一个\
  \ import 声明。如果没有在 Listing 11-2 的顶部编写 import 声明，我必须写成：\n\n```java\nvar player = new\
  \ com.example.baseball.Player(hankiesData.nextLine(),\nhankiesData.nextDouble());\n\
  ```\n\n在列表的 `for` 循环内部。\n\n在 Listing 11-2 中，注意 `import java.io.*;` 以星号结尾。星号意味着“导入\
  \ `java.io` 包中的每一个类”。Listing 11-2 简写了其中的三个类：`IOException`、`File` 和 `IO`。但是，在 import\
  \ 声明中使用星号，列表可以简写 `BufferedReader`、`FileInputStream` 或 `java.io` 包中的任何其他类。\n\n![技术](img/technicalstuff.png)\
  \ 一个 Java 包可以有一个或多个子包。例如，`javax.swing.text` 包用于在图形窗口中显示任何类型的文本，而 `javax.swing.text.html`\
  \ 子包专门用于显示 HTML 文本。但不要被“子包”这个名称欺骗了。包与其子包之间的关系是非常脆弱的。如果你声明 `import javax.swing.text.*`，你可以简写\
  \ `javax.swing.text` 包中类的名称——诸如 `Caret`、`Highlighter`、`Position` 和 `Style` 等类。但你不能简写\
  \ `javax.swing.text.html` 包中类的名称。对于这一点，你需要声明 `import javax.swing.text.html.*`。\n\
