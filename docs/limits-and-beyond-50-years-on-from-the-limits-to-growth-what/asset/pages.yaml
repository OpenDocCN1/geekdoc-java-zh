    World3 model had a validity; after all, no model is perfect and this

    no conclusion drawn on its output indisputable. But a lot of criticism really

    wasn''t very clever. As detailed elsewhere in this collection, critics claimed

    t“business as usual” showed a collapse from resource depletion by

