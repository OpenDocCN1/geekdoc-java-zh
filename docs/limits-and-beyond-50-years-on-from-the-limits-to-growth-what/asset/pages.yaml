  md: 'Club of Rome and Ilya Prigogine (member of the Club in the 1970s, and Nobel
    Laureate in Chemistry) would have agreed with that literary expression, so well
    aligned with their own investigations on the self-organizing nature of the universe.
    Criticality might lead to emergence, and the process cannot be planned beforehand,
    and natural imagination and creativity play the leading role in birth to unexpected
    patterns unfolding within new harmonies within the larger web of Life.


    This is where the expansion of the space of possibilities comes in. The Limits
    to Growth was an optimistic bet on collective intelligence to learn from the exploration
    of possible futures. Nowadays, the situation is even more critical than it was.
    We have to renew the bet on the humanity and capacities of everybody to create
    the conditions for a collective emergence from emergency.


    This is the general context in which we (co-editors) started imagining this book
    on occasion of the 50th anniversary of The Limits to Growth . In 2011, Ugo Bardi
    had already written a book to revisit the original report. Building upon that
    experience, we decided to explore further by asking 21 authors (including ourselves)
    to submit original contributions synthesizing their insights, perspectives, and
    feelings. We did not give them precise instructions on what topics we would like
    to see covered by whom, but the magic of emergence saw to that there is little
    overlap between the different contributions, which also reflects the diversity
    of backgrounds, disciplines, geographies, and cultures of the authors involved.
    We limited our task to organize the flow of contributions, combining the timeline
    (what the book mean in its time? and later? and now? and for the future?) with
    the type of approach (from science, politics, economics, culture, and more). As
    you might expect, that diversity is also reflected in the wide variety of approaches,
    voices and styles of the different pieces, which we decided to respect. Life tells
    us that radical diversity is a must.


    In the first section, “Echoes of a great book”, Ugo Bardi sets the scene with
    a detailed and in-depth examination of the original report, how we received at
    the time, and how it could still be useful and relevant for our reflections today.
    Bringing in two of the original authors from the 1972 book, Dennis Meadows and
    Jorgen Randers, we have the privilege to better understand what that book actually
    said and answer the most common questions that people have asked about over the
    years. Unfortunately, we'
  merge: -1
