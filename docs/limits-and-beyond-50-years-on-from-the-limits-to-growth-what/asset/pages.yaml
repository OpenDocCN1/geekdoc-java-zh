  md: 'In 1967, Mel Conway, an independent thinker with a PhD in mathematics, coined
    his eponymous law, which says:


    > Any organization that designs a system (defined broadly) will produce a design
    whose structure is a copy of the organization’s communication structure.


    — Melvin E. Conway


    This means that social structure will map to the design structure of the object
    that a particular social structure created. It’s no surprise that the social structure
    that designs, and eventually runs, a nuclear power plant looks and acts like a
    hierarchy. It’s a baked-in feature. It’s also a barrier to designing decentralized
    power systems. The social structure couldn’t design it, and in fact, might not
    even see the advantage in the robustness of distributed network might provide.


    Pondering Conway’s Law in 2014, I coined a term called the Intermediate Corollary,
    that knowledge created is an intermediary between social structure and design
    structure. Hence:


    # Social Structure <=> Knowledge Structure <=> Design Structure


    The various relational ways of connecting will directly influence how knowledge
    is created inside an organization. And the fidelity of the information shared
    in the organization will be keyed to a function of the personal development of
    all the individuals in the system – their developed empathy.


    Empathy is more than just giving someone a hug. It’s the way humans connect with
    each other, on all different levels of our brain function. It is both intrinsic
    to how we function at small scales, being a developed capacity as we move up to
    higher forms. Empathy can be represented in a pyramid – the diagram below is based
    on Frans de Waal’s work, with some important changes.'
