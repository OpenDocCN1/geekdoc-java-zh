    In a sense, Peccei aimed at endowing humankind with a consciousness.


    Peccei''s early ideas can be found in a speech he gave to the financial consortium
    ADELA in Buenos Aires in 1965. It is surprising how that speech looks to us in
    contrast with the way the ideas of the Club of Rome are perceived nowadays. Peccei
    was as far as anyone could be from “catastrophism,” he saw no collapse on the
    horizon, he never mentioned – probably couldn''t even conceive – such a thing
    as “limits to growth.” He mentioned overpopulation, of course, he couldn''t even
    imagine that humankind was facing unsolvable problems with the depletion of natural
    resources, not with pollution and overpopulation. At that time, the concept of
    “anthropogenic global warming” existed only as a hypothesis in some specialized
    scientific publications. Nobody could know that in a few decades would become
    an existential threat for the whole of humankind. On the contrary, Peccei''s ideas
    were aligned with the prevalent ones of the time: technological progress was pushing
    economic growth onward and bringing prosperity to humankind for the foreseeable
    future.


    Yet, it was also clear to Peccei that something was wrong with this bright picture.
    Don''t forget that the world was still reeling from the disaster of World War
    II, and that it was facing an even more tragic possibility: that of a nuclear
    holocaust. At that time, the world was divided into three different sectors: the
    first, second, and third world. The first was that of the “developed” nations,
    the second that of the communist countries, the third of the poor nations, that
    at time still called “underdeveloped.” Whereas the first and the second world
    were menacing each other with nuclear obliteration, the third world was not catching
    up with the increasing prosperity of the others. Starting to call the third-world
    nations “developing” instead of “underdeveloped,” as it became fashionable at
    that time, was a slight of hand that didn''t change anything.


    So, Peccei saw the challenge ahead to make sure that everybody would profit from
    the bounty that growth and progress were bringing. He clearly saw that inequality
    and divisions among people would bring only disasters, if not the dreaded of an
    all-out nuclear war. It was necessary to improve collaboration among states if
    the worst were to be avoided.'
