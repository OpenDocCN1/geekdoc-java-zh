- img_proc: true
  md: 'impose “modern” views on whoever would not agree, people well as nature. This
    was the starting point of “Modernity”, the way of thinking and acting that has
    shaped the world we live in. Science at the time was more diverse than we remember,
    but its relationship with power meant that some ideas would be heard and others
    forgotten. For example, Napoleon promoted Laplace and ignored Lamarck, whose outstanding
    insights on how nature works were not useful to legitimize a hierarchical notion
    of society. Since the beginning of the 19th century as a consequence of the self-reinforcing
    loop between science, technology, and power, mechanism acquired a disproportionate
    influence on the way we think. We know that the paradigm is not useful to understand
    living systems, and yet it is still the overarching framework of our institutions,
    in governance as well as in education, research, innovation or the economy. Separation
    as a central tenet, dualism of mind and matter, objectivity, individualism, rationalism,
    reductionism, linearity, and determinism are the tools we continue to use to make
    sense of our perceptions. All together they contributed decisively to build a
    dominant culture obsessed with order, equilibrium, hierarchy, and control. In
    economic and political terms it led to the consecration of quantification, productivity,
    and performance and to the justification of colonization of people and nature
    in the name of progress.


    This is the culture from which the socio-ecological disasters originated in the
    first place. It still uses the same lenses of early Modernity and hence has the
    same blind spots. It believes in simple chains of causes and effects, which is
    why unintended consequences are always deemed “collateral”. It fundamentally ignores
    that in most systems, even simple ones, all components react to changes in their
    environment. And the flow of actions and reactions, like questions and responses,
    creates an endless of evolution. Both climate warming and Covid-19 are responses
    to previous human actions, which were reckless enough not to care about consequences.
    At critical points the evolution of a system can produce a dramatic reconfiguration
    into completely different patterns. This is the well-observed phenomenon of emergence
    and creativity. But the culture we live in still believes in linear change, driven
    by a clear purpose. It believes in the capacity to decide on a complex matter
    from an external and objective position and then impose that decision on all beings
    involved in the matter of analysis. And it fundamentally ignores that all living
    beings are sentient and not parts of a mechanical device.'
