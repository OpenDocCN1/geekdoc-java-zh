    # LtG 5: Overshoot can be avoided through forward-looking global policy


    In response to the challenge formed by its first four messages, LtG intoned an
    optimistic answer: “The challenge of overshoot from decision is real, but easily
    solvable if human society.” LtG said that forward-looking policy can prevent humanity
    from overshooting planetary limits. Of the 12 scenarios in LtG, 11 explored various
    solutions to the challenge of overshoot. The final scenario – global equilibrium
    – showed how overshoot and collapse could be avoided, at least in principle. Translated
    into practical policies, this meant legislation to limit population size and to
    limit capita consumption. Or in more detail: to keep forest removals below cut;
    greenhouse gas emissions below the amount that can be absorbed by forests and
    oceans; desired family size low by improved education, health, and contraception;
    and social tensions under control through less inequality. Doable in a computer
    model, difficult in the real world of politics.


    In essence, LtG said that if society can avoid overshoot, there will be no need
    for “managed decline” nor any threat of “collapse”. The challenge of limits is
    solvable – at least in principle. But it will be hard in practice,'
