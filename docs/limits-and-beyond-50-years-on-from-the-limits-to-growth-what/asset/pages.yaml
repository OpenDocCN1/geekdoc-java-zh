    # Introduction


    The book entitled The Limits to Growth (LtG) is known to many. It has

    been printed in 3–4 million copies in at least 36 languages. It has been

    discussed aggressively for decades. But there is still a lack of clarity aboutnwhat
    this research report actually said in its 150 illustrated pages when it

    was first published in the US in March 1972.


    Many believe that LtG used a big mathematical model of the world

    system to forecast the end of the world before the year 2000. Others believe

    LtG was a neo-Malthusian projection of population collapse in the 21st

    century that would be caused by global shortages of natural resources,

    including oil and agricultural land. Yet people think that LtG proved

    that economic growth cannot continue forever on a finite planet.


    Apparently, few remember that LtG was a scenario analysis of 12

    possible futures of the period 1972 to 2100. And the main scientific

    conclusion of the study was that “delays in global decision making would

    cause the human economy to overshoot planetary limits before the growth

    in the human ecological footprint slowed”. Once in unsustainable territory,

    human society would be forced to reduce its rate of resource use and its rate

    of emissions.'
