    # The nature of power


    Long ago, Karl Deutsch: “Power is the ability not to have learn anything.” To
    what extent is the power of existing states impeding the learning we need? Very
    much so, as the abundant evidences indicates. But what about the institutionalized
    ways of learning that we already have? We are not living in static societies,
    after all. Crises make us learn something, in the sense of changing the course
    of our lives. In particular, crises make capital valuations change dramatically,
    and sometimes very rapidly. The main script for the scenario of “green growth”
    is that investments in fossil fuels and other unsustainable practices lose their
    value in stock, while the valuation of renewables grows fast. This is already
    happening to some extent. And the market can develop assessment mechanisms with
    the intention to give signals in the right direction, such as the ESG tool evaluating
    companies and countries according to the Environmental, Social, and Governance
    consequences of their actions. However, there is a chance that these tools only
    produce cosmetic changes or even act as a “dangerous placebo”.10And change is
    too slow compared to the timelines of inequalities, climate warming, and other
    challenges.


    At the same time, speed is not the essential issue. As Gandhi said, “It is irrelevant
    if we go in the wrong direction.” In 1979, Aurelio Peccei formulated our challenge
    as a riddle: “What we all need at this point in human evolution is to learn what
    to learn what we should learn –'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'and learn it.” This means there are different levels of learning. The act of
    learning new patterns of behaviour does not guarantee per se that we start creating
    more Life than we destroy. It could be the contrary. If we take the example of
    Covid-19, what did we learn? For one, that being human has become more difficult
