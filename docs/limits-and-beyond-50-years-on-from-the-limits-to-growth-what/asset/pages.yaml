  md: 'Working at UNESCO, and later in my capacity of the first deputy chairman of
    the Committee of Soviet Scientists from 1989 to 1991, I had a chance to meet Dr
    Gvishiani. I talked to him about global problems, visited IIASA, and participated
    in joint research projects. I remember him saying that the application of the
    system model is more important for the study of the logic of reasoning and of
    solving problems than for the examination of the logic of processes taking place.


    The present Russian school of systems analysis and modeling of global processes
    continues its tradition in developing not just one model, but a modeling system
    in the form of an open and replenished library of blocks or elements from which
    it is possible to model individual processes reflected in their global composition.
    For this, powerful processing is needed that allows researchers to quickly and
    efficiently construct a model corresponding to the tasks, ideas, and settings
    of the given case.


    Half a century after the famous Limits to Growth report to the Club of Rome, the
    scientists of the Lomonosov Moscow State University (MSU) decided to examine the
