    # Factor Four


    Fully acknowledging the growth desires of the global South, two Northern think
    tanks, the Wuppertal Institute and the Rocky Mountain Institute (RMI) of Snowmass,
    Colorado, joined in exploring the possibility of massively increasing wealth while
    simultaneously reducing the consumption of the planet’s resources. In 1994, the
    Club of Rome arranged a conference in Bonn, Germany, in the presence of Ricardo
    Diez Hochhalter, President of the Club of Rome. Amory Lovins and Hunter Lovins
    leaders of the RMI, and Ernst von Weizacker, head of the Wuppertal Institute,
    presented a draft of a new book proposing that *a doubling of wealth could come
    together with a reduction in half of the resource consumption ,* an extremely
    surprising proposal at the time.


    After a strange academic discussion during the conference and some written correspondence
    afterwards, the improved manuscript was accepted as a Report to the Club of Rome
    and published — with some rather technical delays — under the title *Factor Four*


    Clearly, that *factor four*, if achieved, also contradicted the World3 model because
    the model assumed that the growth of wealth was firmly coupled with resource shrinking.
