  md: 'Following the publication of LtG , scientific knowledge has been extraordinarily
    enriched, in general, and with the innovative perspective of Earth system science.
    Several scientists from various disciplines understood the need to analyze the
    physical, chemical, and geological dimensions of our earth, taking into account
    how much these have structured the biosphere, which, with its living organisms
    – from remarkable bacteria and archaea to plants and animals – has, in turn, influenced
    by many of the geological, chemical, and physical characteristics of the planet
    itself. This is the perspective of Earth system science in its entirety and interconnection,
    where the atmosphere, oceans, hydrosphere, geosphere, and biosphere continuously
    interact and influence one another. A special report by the US National Research
    Council and NASA in 1986, coordinated by meteorologist Francis Bretheron, defines
    the objective of the Earth system system as follows: “to obtain scientific understanding
    of the entire Earth system on a global scale by describing how its parts and their
    interactions have evolved, and how they may continue to evolve on all timescales.”^10


    Thus, we have a vision of nature as made up of complex chains of cause and effect,
    feedback, and continuous interconnections that had extraordinary pioneers such
    as James Hutton (1726–1797), Alexander von Humboldt (1769–1859) and Vladimir Vernadsky
    (1863–1945). Today, this vision has been considerably refined, becoming an essential
    basis for implementing sustainability and in which key figures from the Club of
    Rome have played an important role.


    The mid-20th century was marked by an international cooperative scientific effort
    – the International Geophysical Year (IGY, 1957–1958). Commissioned by the International
    Council for Scientific Unions (ICSU), which became the International Science Council
    (ISC),^11in 2018, the IGY saw scientists from 67 countries collaborate on research
    towards the greater integration of disciplines such as glaciology, oceanography,
    and meteorology. This research has contributed to a better understanding of our
    planet works, linking interpretive and qualitative analyses based on observations
    collected in the field, supporting them with advanced instrumentation, continuous
    and quantitative monitoring of numerous variables, and the use of numerical models.
    These advances have led to the better structuring of modern climatology and research
    fields dedicated to various aspects of planetary geophysical dynamics, as plate
    tectonics.'
