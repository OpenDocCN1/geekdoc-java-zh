  md: '# # Chapter 5

    # 50 years after The Limits to Growth


    Dr Ernst von Weizsäcker


    *Honorary President, the Club of Rome*


    # ## Aurelio Peccei had the right instinct


    In the late 1960s, I heard about the Italian industrialist Aurelio Peccei. Rumours
    went around that he was promoting thoughts about “the predicament of mankind”.
    That sounded a little alarming. And it it was.

    Aurelio Peccei was deeply concerned about the sudden wave of protests worldwide,
    and he felt the protests were somehow justified because the future for the young
    generation could indeed be quite grim. In the year 1968, wild and partly revolutionary
    movements occurred in about two dozen countries around the world. Often it was
    students – at Berkeley, Paris, Warsaw, Prague, Belgrade, Stockholm, Mexico City,
    Rome, and Berlin, to name a few. But in many countries, the students were supported,
    in some cases overshadowed, by other movements, such as, in the USA, the civil
    rights movement, the Black Panthers, and the protest against the Vietnam War;
    in Poland, Czechoslovakia, and Yugoslavia the anti-Soviet movements, and worldwide
    various anti-capitalist movements. Also, air and water pollution became a public
    concern in the centres of heavy industry.


    Several thinkers and movers around the world joined with Peccei in such concerns.
    A common feeling emerged among the Rome group that physical and economic limits
    could lie behind the widespread unrest. Another common view was seemingly shared,
    namely that national research'
  merge: -1
