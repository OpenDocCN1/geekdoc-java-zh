  md: '1990. Yet by the turn of the century, these claims had been effective as to
    convince everyone that LtG had been relegated to, as Lomborg and Rubin put it
    in 2009, “the dustbin of history.”^1


    Perhaps that is why no one bothered to check whether some of the LtG scenarios
    still aligned with recent empirical data. If they had, they would have found what
    I did: some scenarios actually align un closely to current data. The article on
    my research, published in Yale’s Journal of Industrial Ecology ^2contains the
    formulas and data sources, graphs, and numerical outputs per variable. Here, I
    will summarize my research findings and elaborate on their meaning. You will see
    that this message is, in a similar vein as the original LtG works, a bit more
    nuanced than mainstream media had put it.


    I compared four scenarios from this latest version of World3_4_with empirical
    data: the best-known “business as usual” (BAU), “business as usual 2” (BAU2),
    “comprehensive technology” (CT), and “stabilized world” (SW). (Also called scenarios
    1, 2, 6, and 9, respectively, in the 2004 book). The assumptions underlying each
    scenario span a range in technological, social, or resource conditions. Additionally,
    the cause of decline, which varies from a temporary dip to societal collapse,
    differs for each scenario (see Figure 1).'
  merge: -1
  pgno: 249
- img_proc: true
  md: '![](img/5f537e86837b31506b822569eab27980_250_0.png)


    ![](img/5f537e86837b31506b822569eab27980_250_1.png)


    ![](img/5f537e86837b31506b822569eab27980_250_2.png)


    ![](img/5f537e86837b31506b822569eab27980_250_3.png)


    Figure 1. BAU, BAU2, CT, and SW scenarios of the 2004 LtG book. Graphs recreated
    by Hillary Moore.


    I chose BAU, BAU2, CT, and SW because they form a comprehensive set of “stories.”
    The BAU scenario was based solely on historic averages with no assumptions. It’s
    the story in which we hang on “we can keep growing forever!” attitude that is
    tacitly ubiquitous in society. BAU2 is also business as usual, but with double
    the natural resources. This scenario was added by the LtG authors to address criticism
    that natural resources turned out to be more abundant than estimates in the 1970s
    indicated. More abundant resources do not avoid a collapse in the World3 scenarios;
    its cause merely changes from a resource scarcity crisis to a pollution one. With
    the constraint relaxed, incentives to innovate and change social priorities are
    reduced, so business as usual goes on for longer. This creates so much pollution
    that agricultural output and human health plummet after some breakpoint. BAU2
    essentially tells the story of ecosystem breakdown from accumulated pollution,
    including greenhouse gasses (i.e., climate change).'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'CT represents the technologist’s belief in humanity’s ability to innovate out
    of environmental constraints. It assumes unprecedented technological innovation
    in a world that otherwise does not change its priorities much. The new technologies
    do in fact help avoid the outright collapse. However, CT still results in some
    declines because the technology costs become so high that not enough resources
    are left for agricultural production, health, and education.


    In SW, humanity consciously lets go of expansive growth as its ultimate pursuit.
    We shift societal priorities away from material consumption and industrial growth
    towards health and education services, as well as pollution abatement and resource
    efficiency technologies. This avoids collapse and leaves humanity with the highest
    levels of wellbeing. The four scenarios are summarized in the table below.


    | Scenario | Description | Cause |

    | --- | --- | --- |

    | BAU | No assumptions added to historic averages | Collapse due to natural resource
    depletion |

    | BAU2 | BAU + double the natural resources | Collapse due to pollution (climate
    change approximate) |

    | CT | BAU2 + exceptionally high technological development and adoption rates
    | Rising costs for technology eventually cause declines, but no collapse |

    | SW | CT + changes in societal values and priorities | Population stabilizes
    in the 21st century, as does human welfare on a high level


    Table 1. Description and cause of halt in growth andor decline per scenario.


    I collected data for real-world indicators of the World3 variables: population,
    fertility, mortality, pollution, industrial output, food, services, non-renewable
    resources, human welfare, and ecological footprint. This data came from academia,
    government agencies, non-government organizations, United Nations entities, and
    the World Bank. I plotted the empirical data together with the variable in each
    of the four scenarios made with the latest version of World3. These plots gave
    good impressions of the fit (a normalized root-mean-square error, and a combination
    of the value difference and difference in rate of change) to validate what I observed
    in the graphs.'
  merge: -1
