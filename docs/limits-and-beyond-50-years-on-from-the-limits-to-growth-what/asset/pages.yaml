  md: 'In the “New lenses for a different future” section, thinkers from continents
    and cultures across the globe bring in their unique experiences and perspectives
    to the imagine elements of the shift(s) required. Sirka Heinonen emphasizes the
    value of learning, de-learning and re-learning and futures thinking if we are
    to navigate the crises and shocks of a volatile, uncertain, complex and ambiguous
    (VUCA) world. Nature is our ultimate teacher, she concludes. Yury Salamov relates
    the intellectual reception of The Limits to Growth in the Soviet Union, where
    it was taken more seriously than in most Western contexts, with ongoing research
    on global social transformations and civilational prospects.


    Sandrine Dixson-Declève (co-president of the Club of Rome) builds upon the tragedy
    of the Covid-19 pandemic to claim that transformational economics is not only
    urgent but also possible. The convergence of multiple tipping points creates a
    complex emergency, but it is also the threshold to address the challenges of humanity
    through a systemic lens. The elaboration of a Systems Change Compass for the implementation
    of the European Green Deal in the EU context, in which the Club of Rome has been
    involved, is an example of such endeavour.


    Reflecting on what has changed since The Limits to Growth , Maphela Ramphele (co-president
    of the Club of Rome) invites us to explore some fundamentals. What does it take
    to shift mindsets out of tensions between change and resistance? What will role
    the cultural shift, that is becoming evident in younger generations, play? And
    not least, what should we expect from diverging visions of Most of the World and
    the dominant Global North? The responses to these questions will deeply influence
    our future. The Club of Rome can have a catalytic role at the crossroads of these
    issues by better understanding how living systems change.


    Petra Kuenkel presents a feminist perspective, in the hope that a much stronger
    participation of women in how and what decisions are taken lead to a shift from
    patriarchal blind spots to a collective stewardship for better futures. On his
    side, Chandra Nair proposes to lead the 21st century of Asia, building on the
    evidence that the most populated continent is quickly recovering its prominence
    in a multipolar world. From Asian perspectives, achieving “Global Equity for a
    Healthy Planet”, the motto adopted by the Club of Rome for this 50th anniversary
    of The Limits to Growth , requires a strong role for the state facilitating a
    combination of shared prosperity and moderate consumption, quite a divergent approach'
