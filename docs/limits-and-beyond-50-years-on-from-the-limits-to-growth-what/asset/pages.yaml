  md: 'The report alarmingly extracted global problems from the everyday usual context
    and made clear that they must become the main concern of peoples, their representatives,
    and governments jointly pave the way to human survival. But it did not happen.
    Today, half a century after the report, we find ourselves much closer to the precipice
    than ever before, but people are too often inclined to drive away unpleasant thoughts
    about the impending catastrophe, childish illusions that it is still far away
    and everything will somehow work out. Many politicians prefer immediate gains,
    ignoring inevitable common losses and following Napoleon in his approach “after
    me – the deluge”. However, today the result might not the flood, but a lifeless
    desert. Public consciousness obviously lags reality, recognizing the new only
    after time has passed and demonstrating the human gap phenomenon, described in
    the report to the Club of Rome in 1971—as the inability of people to keep pace
    with understanding the growing complexity of the world.


    Coming back to the origins of the report, it could be mentioned as a little-known
    fact that its grew up, to some extent, from the friendship between and the joint
    research by the American and Russian professors and scientists Jay Forrester and
    Nikita Moseeyev. They presented their first outlines at the UNESCO International
    scientific conference in Venice in 1971.


    Professor Moseeyev, who later, together with his American research partner Professor
    Carl Sagan, developed the concept of the “nuclear winter”, proving that there
    would be no victory and no survival in a nuclear war, emphasized the main problem.
    Another great Russian scientist Vladimir Vernadsky also had an influence. He had
    introduced the notion of the future noospheric civilization, described by him
    as the planetary “sphere of reason” and the way out for the common survival. Vernadsky’s
    scientific heritage affected the increasing understanding of the key role of the
    educational intellectual process for the future destiny and the existence of humanity.
    It is becoming ever-more evident that the contradiction between global interdependent
    problems of the planetary scale and the existing fragmentary and desultory way
    of acquiring knowledge is a principal challenge to the present and future quality
    of human potential.


    Another important outcome of the report arose from it being based on system analysis,
    affirming the system approach as a new and valid scientific'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'direction, which helped in the understanding of the entity of processes by
    bringing into a system initially scattered and redundant information. The report
    opened eyes to complex systems in their integrity, which should not be treated
    as a simple sum of its components, showing that the analysis must necessarily
    be supplemented by a deep system synthesis based on an interdisciplinary approach
    and interdisciplinary research with the application of completely new scientific
    instruments and technologies.


    Within the Soviet Union at that time, the reaction to The Limits to Growth was
    quite limited and basically didn''t reject the report because its conclusions
    were attributed mainly to the shortcomings of the capitalist system, while the
    socialist one enjoyed the advantages of the planned economy and respective crisis
    prevention abilities. But in professional circles of science and policy makers
    the report was met with all the attention it deserved. The national mental soil
    was already prepared and fermented by the advanced philosophical studies of Moiseey,
    Frolov, Zagladlin, Kapitsa, and other globally thinking Soviet scientists, among
    whom a special place was occupied by the figure of Dzhermen Gvishiani. For several
    reasons he could be considered as one of the fathers of the Club of Rome. Gvishiani
    was the son of a Georgian KGB general and an Armenian mother. He was married to
    the daughter of Soviet Premier Alexei Kosyggin. Kosgin wielded great power, had
    a computer brain, and together with Aurelio Peccei, made a breakthrough in the
    East–West relations by signing a “contract of the century” with Fiat for a joint
    project of a huge automobile plant construction in the USSR.


    In October 1972, the USSR established, together with the USA, the International
    Institute for Applied Systems Analysis (IIASA) in Vienna, which was a significant
    result of scientific diplomacy and a remarkable project that aimed to build bridges
    across the Cold War divide and to search for system solutions to multiplying global
    problems. In 1976, Gvishiani at his head, the All-Union Scientific Research Institute
    for Systems Analysis was founded in Moscow with the Academy of Sciences and the
    State Committee for Science and Technologies of the USSR. It was considered by
    many as a Soviet branch of IIASA. It is hard to deny the influence of The Limits
    to Growth , especially taking into account that the global problems analyzed in
    it became the object of studies of the newly born scientific structure.'
  merge: -1
