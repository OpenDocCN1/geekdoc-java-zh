    but, clearly, he had identified a line of thought that was starting to penetrate
    the discussion: if the Roman Empire, glorious as it had been, had disappeared,
    what was in store for the modern civilization?


    Not much later, in 1798, Thomas Malthus published his book An Essay on the Principle
    of Population where he noted, perhaps for the first time in history, that there
    were physical limits to the expansion of the human population. Interestingly,
    and contrary to the common perception, Malthus was never “catastrophic.” That
    is, he never predicted collapses of any kind. He only noted that famines and wars
    would necessarily limit human growth to a certain level: And he didn’t even say
    that it would have a static level: as it growing, fast as the population. Nevertheless,
    he was demonized and sneered at for having made wrong predictions to the point
    that, today, being defined as “Malthusian” is understood as an insult. That was
    to be a common destiny for many later catastrophists.


    In time, others examined the problem of the limitation of natural resources. William
    Stanley Jeavons published The Coal Question in 1865. He was pessimistic (and correctly)
    about the capability of England to keep extracting and burning coal for more than
    a century or so, but he never predicted an economic collapse. On the same line
    of thought, although one century later, the geologist Marion King Hubert was the
    first to examine the long-term cycle of oil extraction, predicting that it would
