    # The basic ideas of The Limits to Growth


    When the “scientific method” was developed, mainly with the work of Galileo Galilei
    (1564-1642), the idea was that scientists should use laboratory or field experiments
    to determine the “laws” governing a certain phenomenon. It is typical of science
    that “laws” are truly universal. Think of the universal gravitation law. The story
    goes that Newton thought of it by observing an apple falling from a tree and then
    applying the law to the Moon orbiting around Earth. For it is obvious, at the
    time, it was a remarkable leap of imagination to think that two objects so different
    as an apple and the Moon would behave according to the same “law,” an innovative
    concept at the time. And just apples and orbiting bodies; once you know the universal
    gravitation law, you can use it to determine the trajectory of a cannonball, and
    do your best to make it land on the heads of your enemies. You can also use it
    to determine the trajectory of a space probe to land on another planet. And you
    can do much more. Not for Newton’s gravitational law is said to be “universal.”


    The idea of “universal laws” was a huge success and it led to impressive scientific
    deplications. But it was not possible to use simple laws to describe complicated
    or “complex” systems. Even for three bodies orbiting each other there are no simple
    equations that can exactly describe their movement. In practice, most real-world
    systems are impossible to describe using equations. For instance, there are no
    equations describing the trajectory of a cat chasing a mouse, just as there are
    no'
