  md: '“growth in GDP (gross domestic product)” and argued against LtG ''s message
    on this mistaken basis.


    Furthermore, many critics of LtG thought that “technology” would be capable of
    solving any resource crisis by bringing forth substitutes for scarce resource
    – in time and without a temporary decline in human wellbeing. In the widest perspective,
    they have been proven right so far; the world has not yet run out of the most
    critical resources – fossil fuels, crops, water, and fertilizer. But there are
    growing threats, primarily to biodiversity, for example in coral reefs and old-growth
    forests. Currently, 50 years after the publication of the 12 LtG scenarios, it
    appears the “resource crisis” is less likely than the “pollution crisis”. Currently,
    the global bottleneck appears to be on the emissions side. During the last 50
    years, annual human-made emissions of greenhouse gases have grown to a level far
    above the sustainable level (which can be absorbed by the oceans and land during
    that year). As a consequence, there is global warming and observable climate change.
    The planetary pollution limits appear tighter than the planetary resource limits.


    # LtG 3: It is possible, and even likely, the human ecological footprint will
    overshoot the sustainable limits (the carrying capacity) of planet Earth


    LtG said the human footprint is likely to overshoot the physical limits of the
    planet because there are significant delays in global decision making. When limits
    start approaching, society will initially spend time discussing their reality
    – and continue expanding while debating. Ultimately, debate will give way to decisions
    to slow down, but meanwhile, LtG, growth will continue and bring the human footprint
