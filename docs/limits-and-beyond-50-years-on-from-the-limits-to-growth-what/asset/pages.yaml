    to tend the soil, when to plant seeds. This is the improvisational ability that
    comes with the rigor and patience of long, slow learning. The approach is one
    of careful comparisons between colors, patterns, and papers combined with their
    place in society, history, and the evolution of printing technologies over the
    centuries. Most of the people who enter a room with those wallpapers on the wall
    will not know of the information relevant to its careful production. But, may
    sense it.


    The wallpaper studio that my husband and son in every day is one such place. It
    is piled in every direction with rolls of history, color, dust, and patterns.
    Each roll tells a story of a wall on whom someone has found a scrap of historical
    paper, stuck there by past generations, and sent it to my husband to have it redo.
    He knows, in ways I cannot begin to know, where and when that paper originates.
    He knows the colors that it was when it was fresh, sometimes as long as the 1700s.
    He knows what bones the glue was made from, and what methods of printing were
    used. He knows how the block print was carved, what tree the wood came from, and
