    # LtG 1: The human ecological footprint grew rapidly from 1900 to 1972


    LtG noted that the environmental impact of human society did increase from 1900
    to 1972 because of growth in population size, growth in resource use, and growth
    in the environmental impact per person. In other words, the ecological footprint
    of humanity became bigger because of growth in the number of humans, and because
    of growth in the amount of resources consumed and pollution generated per person
    per year.


    This growth has continued since 1972, despite the hope of many idealists that
    societal advance would stabilize the global population and/or reduce the footprint
    per person. The footprint has continued to grow, and since the mid-1990s, the
    world had the statistical apparatus to quantitatively follow the physical growth.
    The good news is that the footprint per person has levelled off and even declined
    in some countries. But the total footprint is still being pushed up by increases
    in population and physical (material) consumption.


    # LtG 2: The human ecological footprint cannot continue to grow – at the rate
    seen from 1900 to 1972 – for more than a hundred years from 1972


    LtG said that the human ecological footprint cannot continue to grow indefinitely
    because planet Earth is physically limited and, in fact, small relative to human
    activity. Humanity – in the long run – use more physical resources and generate
    more emissions every year than nature can sustain and absorb sustainably.


    The human footprint has continued to grow since 1972. It is worth repeating that
    LtG did use the words “growth” or “physical growth” instead of the modern, more
    precise words “growth in ecological footprint” or “growth in environmental impact”.
    The latter wording did not enter the literature until decades after the publication
    of LtG. The choice of words led to decades of unnecessary public debate because
    most readers interpreted the word “growth” as identical to “economic growth” or'
