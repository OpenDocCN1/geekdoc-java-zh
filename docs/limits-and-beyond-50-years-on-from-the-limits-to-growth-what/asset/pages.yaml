    # Introduction


    In 1972, the Club of Rome globally published The Limits to Growth report,

    which accurately posited that a planetary emergency would arise if “growth

    trends in world population, industrialization, pollution, food production,

    and resource depletion continue unchanged.” Sadly, the Club of Rome’s

    report and warnings went largely unheeded. The flawed, exploitative,

    profit-oriented practices that allowed for many of these trends continued

    unabated, even if the predicted consequences permeated the world.


    If the prediction seemed dire 50 years ago, it is now worse than the

    future scenarios, discussed in the report, are becoming a reality. “Emerging

    from Emergency” is a term we often refer to at the Club of Rome. We

    ourselves needing larger quantities of the earth’s resources as they grow

    more limited (pun intended) at an exponential rate. Surely, we now see that

    t unrepentant pursuit of self-interest and business-as-usual, profit-centric

    capitalism is a recipe for human extinction. Our world urgently needs anframework
    in which financial and economic structures are more inclusive

    s sustainable, and where balancing the needs of both humanity and nature

    takes precedence over the limitless growth pursued in the name of profit

    and progress. The question is: how do we ensure that capitalist agents

    engage with this awareness differently?'
