  md: '# # Re-imagining the purpose of the economy: Bhutan and Gross National Happiness


    Bhutan’s development approach of GNH is unique in several ways. First, it articulates
    happiness and wellbeing (rather than economic growth) as the purpose of the economy.
    It is important to note that the term “happiness” here does not refer to the transient
    “feel-good” emotion or state often associated with the word in Western cultures.
    Rather, GNH is viewed as deeply relational – emphasizing responsibility, harmony
    with nature, and concern for the wellbeing of others. In the words of Bhutan’s
    first Prime Minister Jigme Thinley:


    > “True abiding happiness cannot exist while others suffer, and comes only from
    serving others, living in harmony with nature, and realising our innate wisdom
    and the true and brilliant nature of our own minds.


    Consequently, principles of interconnectedness, sufficiency, service, and self-cultivation,
    are regarded as part of the integration of “material and spiritual development”
    that is intrinsic to GNH. This relates to the second unique aspect of GNH – that
    places an emphasis on cultivating both the outer factors (an enabling environment)
    and inner conditions (values and mindsets) to support a society oriented towards
    wellbeing. A third, and related, aspect of GNH is its reference to cultivating
    a form of leadership that could be described as “leadership of the self”. The
    importance of leading from the inside out is captured in an address by His Majesty
    the 5th King of Bhutan who urges citizens to live their lives guided by values
    of kindness, integrity, and justice. As he notes, in order to bring positive change
    in the world – reduce inequalities, reverse environmental degradation, and improve
    healthcare – we need to actively seek “leadership of the self”, rather than lead
    the masses. In Bhutan, this cultivation of self-leadership has historically been
    supported by a living tradition of Buddhist ethics, philosophy, meditation, and
    related spiritual practices. These are seen as vital for cultivating awareness
    and insight into the interconnectedness of all life, and for nourishing compassionate
    behaviours rooted in appreciation, empathy, and generosity.'
