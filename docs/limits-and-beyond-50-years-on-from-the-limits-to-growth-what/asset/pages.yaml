    Back in the US and becoming professor at MIT, in Boston, Forrester didn''t limit
    himself to conventional engineering systems, soon moving his interest to social
    and economic systems. Those systems were beyond the capability of an engineer
    to test in a laboratory, but that didn''t deter Forrester. He could always work
    on simulated systems where he could change the input parameters at will and see
    the effects without having to shoot down enemy airplanes.


    This was another remarkable advance for the time. The concept of simulating a
