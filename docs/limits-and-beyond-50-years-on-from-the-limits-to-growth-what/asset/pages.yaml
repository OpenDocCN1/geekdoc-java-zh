  md: '# Measuring what matters: Moving from vision to action


    Gross National Happiness aims to measure national progress in a more holistic
    way – as the sum total not only of economic output, but also of environmental
    impacts, the spiritual and cultural growth of citizens, their mental and physical
    health, and the strength of corporate and political systems. The GNH survey tool
    collects national data across GNH “domains” that collectively create the enabling
    conditions for happiness and wellbeing. While many national surveys routinely
    collect data on health, living standards, education, the environment, Bhutan''s
    survey goes further to include more intangible, but no less important domains,
    including time use, psychological wellbeing, community vitality, good governance,
    and cultural diversity and resilience. To align government decision-making with
    these priorities, the GNH Commission employs a policy-screening tool to assess
    the impact of proposed projects and policies on wellbeing. The Commission also
    applies the nine domains to set targets in the country’s Five-Year Plans.


    To date, Bhutan has conducted three rounds of GNH surveys, and introduced a range
    of policies to promote sustainable and equitable development, while preserving
    its unique cultural heritage. The country has seen impressive gains in key indicators,
    including a reduction in poverty and infant mortality rates, rising life expectancy,
    and substantial increases in primary school enrolment. Between 2005 and 2018,
    Bhutan''s Human Development Index increased by 20.5%, positioning the country
    in the Middle Human Development Category. All of this has been accomplished while
    making a peaceful transition to a democratic constitutional monarchy, and earning
    the distinction of becoming the world''s first carbon negative country. In many
    ways, GNH is a bold and vitally important work-in-progress, and its leaders remain
    aware of both the opportunities and challenges that lead ahead. In the words of
