    the founder and director of the magazine, Edward Goldsmith, along with Robert
    Allen and a team of colleagues.


    Since its inception in 1968, the Club of Rome has decisively focused on a very
    clear message for the future of humanity, which has developed into a good definition
    of sustainability: it is not possible for humanity to pursue unlimited material
    and quantitative growth in a world with clear biophysical limits.


    Only One Earth⁵–the aptly titled book by the economist Barbara Ward (Lady Jackson)
