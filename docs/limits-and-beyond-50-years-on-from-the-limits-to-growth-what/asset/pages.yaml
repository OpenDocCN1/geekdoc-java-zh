    before the conclusions from 50 years ago.


    The Limits to Growth model, while complex for its time, is primarily a model of
    constrained linear equations. Coupled with feedback loops, such models initially
    lead to exponential solutions, which flattened by depletion and the effect of
    pollution, leading to collapse. Published in 1972, it was a work of its time.
    It was likely that the simulations were completed on a computer smaller than the
