- img_proc: true
  md: 'our intentions and produce “collateral” harm; through large feedback circles
    they can be lethal for ourselves.


    The Covid-19 pandemic gave a new impulse to these reflections. It revealed the
    fragility of human systems, induced into global collapse by the tiniest piece
    of primal life. Although we try to find more comfortable explanations, it is clear
    that our accelerated destruction of ecosystems, while making sense in the short-term
    and extractive mindset, created the conditions for a worldwide tragedy. And even
    after the development of vaccines the pandemic also reveals how little we know
    about life and its complexity and unexpected feedback loops, so much that we should
    write the word with a capital L. What it invokes is not only much larger than
    humanity, but it also continues to be a mystery within our usual frameworks. For
    instance, we have to admit that at some level viruses are intelligent and able
    to learn, while we tell ourselves that intelligence is an exclusive attribute
    of the human species. The humiliating experience of Covid-19 might give us the
    humanity required to learn more and understand Life a bit better.


    Of course, none of this is new. The distance Guterres 2017 and Guterres 2020 resonates
    with Aurelio Peccei defined in the 1970s as the “Human Gap”, i.e., the difference
    between our capacity to act and our ability to understand the consequences of
    our actions. A contemporary of Peccei, Gregory Bateson, went a little before by
    saying that “the major problems in the world are the result of the difference
    between how nature works and what we people think.” “Bridging the Human Gap” was
    the subtitle and purpose of the Club of Rome No Limits to Learning (1979), a valuable
    attempt at responding to the challenges identified in The Limits to Growth . The
    book explored what characteristics learning processes should have if we were willing
    to face the existential challenges of humanity. Unfortunately, it did not have
    the success it deserved. More, Gro Harlem Brundtland and her co-authors put it
    bluntly in the report Imperative to Act : “The humanity has to vastly outstripped
    the ability to understand.” 3But is it so? Aren''t we instead dealing with persistent
    unwillingness to learn what we already know?


    This question raises many more. If we invoke a process by which human civilizations
    will change significantly and ensure equitable wellbeing for all within a healthy
    biosphere, what kind of process would be that? Will it happen through the intelligent
    design of “solutions” by an'
