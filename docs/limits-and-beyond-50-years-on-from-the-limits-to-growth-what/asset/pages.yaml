  md: 'It has exposed the vulnerabilities of health, social, economic, financial,
    and political systems across the world and propelled us to a critical juncture
    that provides the opportunity and necessity to reshape our future, placing a value
    on what truly matters. Healing the legacy of brokenness imposed by dominant ways
    of thinking and relating to others and to nature is essential for all of us. Healing
    this brokenness is the opportunity awaiting humanity to become open to return
    to the essence of what it means to be human.


    This book is a feast. It provides the reader with a rich variety of views on the
    critical issues facing us. It provides encouragement to all changemakers that
    change is not only possible, but underway. Look around you – change is hiding
    in plain sight. Let us reclaim our humanity and celebrate Mother Nature in her
    full splendour.'
