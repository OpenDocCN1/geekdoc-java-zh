    # Are we on a good course?


    On 11 November 2016, two days after the election of Donald Trump as President
    of the USA, Dennis Meadows addressed the Annual Conference of the Club of Rome
    in Berlin with a speech titled Why Didn''t We Learn: Will We? The provocative
    question was indeed well chosen, and not only because of the political circumstance.
    The feeling that the messages conveyed by the Club of Rome since its creation
    have not been heard, or not enough to change the course of human affairs, was
    quite widespread among the attendants. It is still is today.


    At the beginning of this book Ugo Bardi rightly points out that human behaviour
    was not included in the modelling exercise underlying The Limits to Growth . And
    hence, by construction, the simulated scenarios could not display the effects
    of human learning. Was it not a self-fulfilling prophecy? If we discard learning
    in the first place, no learning happens. Of course, the purpose of the authors
    of The Limits to Growth , and of the Club of Rome, was to provide conceptual tools
    for humanity to ask better questions and explore pathways towards a balanced configuration
    of wellbeing within a healthy biosphere. But what kind of learning was necessary
    and how would it happen? For all its outstanding merits, The Limits to Growth
    did not address that question. The way the controversial debate about the book
    was shaped did not offer much help either. But Bardi also points out, the quality'
  merge: -1
