    Aurelio Peccei and the Club of Rome took good note of the ambiguous reception
    of The Limits to Growth . On one side it caught a lot of attention, sold millions
    of copies, and built a strong reputation for the Club (positive or negative, but
    strong in any case). On the other, the medium-term outcome was disappointing;
    public debates did not shift their conventional framing about “growth,” “development,”
    and “innovation”. And public and private policies continued along the exploitative
