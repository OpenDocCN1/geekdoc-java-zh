    us..I typically, and very much intentionally, avoiding delving into all details
    of why the CT is unrealistic, because it would obscure the question we really
    ask: do we want to be following the CT scenario in the first place? Why would
    we use our innovative powers to invent robot pollinators to replace the bees,
    if we also have the choice to invent agricultural practices that do not have the
    side effect of insecticides? Why use drones to plant new trees when we could restructure
    our economic priorities so that existing rainforest is'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'not cut and burned down? Now that humanity has attained truly global reach,
    now that we have an unprecedented power to shape our own destiny, limits to growth
    force upon the question: who we want to be and what world do we want to live in?


    We can choose different priorities for reasons other than looming collapse. Moreover,
    the possibility that collapse will not happen does not mean that humanity should
    choose a more sustainable path. The close alignment to empirical data and the
    fact that the scenarios have not diverged yet, together form a call to action.
    Hidden behind a seemingly ambiguous outcome of two best-fit scenarios that marginally
    align closer than the other two, hails the message that it is not too late for
    humankind to change course and alter the trajectory of future data points. Global
    society does not have to settle for CT as a best-case scenario. We have another
    choice. Although SW tracks least closely, my research indicates that a deliberate
    trajectory change is still possible. But this window of opportunity is closing
    fast.


    This choice in fact, was the true message of LG: humanity can indeed reach a global
    dynamic equilibrium, but it will require a fundamental change in our values and
    priorities. I believe my research supports this message, although it also suggests
    that this choice today is one of the “now or never” kind. But even that is still
