    in the future. Most probably were the only sensible responses our present systems
    were able to produce. We also learned that a tragedy of such a scale and ruins
    sectors of activity, but it creates a huge amount of private “wealth” in others,
    like pharma and the digital industry. And for now, we have not learned so much
    about the craziness of destroying ecosystems as a structural feature of “development”.
    Are we asking reconnecting humans to themselves and nature help in avoiding future
    Covid-like scenarios? After the pandemic the world in which we live is different
    but is it more attuned to Life? Or and more disconnected from it because of the
    framing of our responses to the crisis?


    If we do not change the framing through which we formulate the questions and their
    responses there is little chance that the general orientation of our relationships
    (among humans, with Life, with time) could change. If we stay within the separatist
    framing of Modernity, characterized by extreme individualism, the industrialization
    of competition, and an exploitative mindset towards the private accumulation of
    ethereal capital, shifting from fossil fuels to renewables will not make a world
    of difference. The conscious understanding of something new but still within the
    same rules of Modernity is not enough. The kind of learning we need is more than
    that. It is a change in our patterns of behaviour and in how we think that is
    required to deal with the consequences of what we know (consciously or not, individually
    or collectively). Can it be produced by existing institutions through their usual
    way of operating? With great difficulty, since the way these institutions are
    designed already encodes the questions they are able to ask and hence the learning
    they are to produce.


    Let us take a look at the social process of research and innovation (R&I) on which
    we place so much expectation to bring positive responses to our pains. Technology
    being the standard response of Modernity to any issue, it'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'would be fantastic if it could go beyond the limitations of its own framing.
    But currently, the institutions involved in R&I efforts (research institutes,
    universities, corporations) shape their own agendas and actions, deemed to be
    “disruptive”, in ways preserving at least two basic premises: knowledge is essentially
    divided into separate disciplines and it is only helpful if it is part of a process
    leading to “solutions” on which financial returns on investments can be expected.
    Our institutions of R&I and the process leading to technological development are
    not based on what science knows about Life. They might use and produce leading-edge
    science but the ways they are organized and operate the outdated framework of
    Modernity we described above. Hence, as they do in ways opposed to how Life works,
    would be useful to address our big challenges. At the same time, public and private
    sectors expect R&I to deliver economic profits and keep alive the centrality of
    capital, as is perfectly understood. As a consequence, the overall result of the
    current deployment of inventions is simply to reinforce the political and economic
    framework under which technologies are being created.


    This is particularly clear in the case of digitalization. While its inventions
    are of course wonderful in many ways, framed as it is in the culture of Modernity
    it is actually contributing to the destruction of social fabric and creating more
    inequality, dehumanization, and a greater distance between the ethereal creation
    of financial wealth and Life at large. Moreover, the subtext in “artificial intelligence”
    (AI) is that people are problematic, they should behave more like robots and our
    technical creations can be “better” than ourselves. AI is telling us we can, and
    get rid of humans. In the self-defeating process of human civilizations, ecological
    catastrophes could combine with radical robotization to achieve the destruction
    of ecosystems and humanity at the same time!


    Living in 2022 we might complement the definition of power by Karl Deutsch: power
    is the ability to choose what has to be learned in order to avoid learning anything
    the existence of power. Power structures shaping and being shaped by human societies
    are for now effectively self-reinforcing. Modernity reframes the crises it creates
    in a way leading to further levels of abstraction and disconnection from Life,
    and then to a formulation of “problems” for which it can convoke its own capacities
    to design “solutions” avoiding deeper learning. There is lot'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'pressure from decision-makers trapped in the dominant way of thinking to find
    “solutions” instead of raising uncomfortable questions. The problems should be
    formulated in a tractable way and have solutions that are easy to understand and
    explain to people, who are usually deemed stupid or at least uneducated and problematic.
    This is nonsense. Life is complex, emergent, intractable, and imitative; it cannot
    be expressed with words without referring to itself. We know much more about how
    Life works in the way we organize society. By using certain lenses of interpretation
    we create blind spots and to see only what reinforces our preset conceptions.
    So much of what we are seeing today is the revenge of ignored tragedies imposed
    on peoples and nature. There is probably no way to get completely rid of blind
    spots, but being aware that they exist makes a huge difference.


    # The human revolution


    As argued, the quality of relationships among humans, with Life, and with time
    should have the central role in human cultures if we want to have a chance of
    reconciling human development and wellbeing with the health of the biosphere.
    To use an expression from Nadia Sandi, “let us Allow to be again”. In this conception
    human wellbeing is to be equitable, and not only to avoid the breakdown of societies
    and the outburst of large-scale wars (of whatever kind). Equity is also mandatory
    if we want to live within a healthy biosphere. As the title of the Club of Rome
    Annual Conference in 2021 put forward, we use “global equity for a healthy planet”.
    Though, for the moment this is not where we are going. In 1984, in the book Before
    it is Too Late , Aurelio Peccei and the Buddhist philosopher and Daisaku Ikeda
    stated that “humankind is on the wrong course” and a Human Revolution is needed
    in order “to live at peace with nature”. Decades later, we have not yet made that
    peace. Learning new patterns is now more urgent than it was to change the course
    of human societies.


    And if Modernity is only able to learn whatever reinforces its own foundations,
    we face a daunting challenge. How do we create conditions for the kind of learning
    we need? Institutional ways of addressing planetary emergencies are not delivering
    the expected results. At the same time, a myriad self-organizing communities,
    usually catalysed by outstanding'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'individuals, are exploring other ways of dealing with the destructive patterns
    of conventional “development”. These attempts share some commonalities: they trust
    the fundamental humanity of everybody and allow people to liberate from helplessness
    and learn by themselves. They mobilize capacities and knowledge – individual and
    collective, traditional and modern, artistic and scientific, verbal and embodied.
    Also, they face challenges in contextual settings, usually local communities where
    belonging can be revitalized. They do not aspire to “save the world”, rather to
    “serve the world”; humility, respect of ancient wisdom, and often invisibility
    are part of their tools. Ultimately, they aim at rehumanizing humanity.


    Effectively addressing the self-destructive trends manifest in climate change,
    rise of inequality, loss of biodiversity, and exhaustion of resources will not
    be possible if we continue using the same lines of separation and disconnection.
    At the same time, we need to take a leap into a higher order of magnitude in terms
    of speed and effects of the appropriate kind of learning and change. It is our
    conviction that this can only be done by being emergence, as a mostly spontaneous
    process, which could be accelerated through catalysis, pollination, and fructification
    – not “scaling up”. It cannot be planned and definitely not far above the ground.
    A centralized, top-down approach does not activate the latent capacities and enthusiasm
    of everybody; the catalysis has to allow people to formulate better questions
    in their own contexts and learn by themselves to provide a rich variety of decentralized
    responses that are best suited to local ecological and social contexts. This is
    what we see already happening in many seed processes around the world. In Dennis
    Meadows’ speech in November 2016, which we mentioned at the beginning, he outlined
    that the Club of Rome had the criticality of cultural change for the course of
    humanity to shift. The usual response by many is that we do not know how to create
    cultural change anyway, it would take too much time. But again, the obsession
    with speed could be misleading.


    Indeed, what if cultural change is already here, all around us, in the energy
    and commitment of so many people, the dispossessed everywhere, women clamouring
    to be heard, youth aspiring to a livable future? Maybe the Human Revolution is
    already happening, not in public media nor social networks but in human minds
    and souls, in plain sight and yet invisible, playing a “silent melody”, by Karima
    Kadaoui puts in it. Reconnecting with'
  merge: -1
  pgno: 290
- img_proc: true
  md: our fundamentally relational nature should not be so difficult. After all, everybody
    is able to do it. And from there we can repair artificially broken interdependencies,
    welcome the re-emergence of relationships, and regenerate whole ecosystems. This
    is how we can give a renewed meaning to what we already know and how we might
    learn new ways of becoming human in the 21st century. As Hölderlin said, “where
    the danger is, also grows the saving power”. So, if the reconciliation with Life
    is a silent melody, how do we make it audible to everybody? Our invitation to
    humanity is a call to slow down and listen carefully, to each other and to Life,
    for the sake of ourselves and generations to come.
