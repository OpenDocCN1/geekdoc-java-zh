  md: 'equations describing one person falling in love with another. In both cases,
    there is no equivalent of Newton’s “universal” law, although it is not possible
    to model human love using equations (J. C. Sprott did exactly that for the case
    of Giulietta and Romeo,$^{18}$but it was just for fun).


    Complex systems are a different kind of science. There are several definitions
    for these systems, but in general, we can say that they are all those systems
    dominated by “feedback effects.” “Feedback” is an intuitive term that we use when
    something reacts proportionally to something. To stay with the example of falling
    in love, the target of your romantic attention may react symmetrically, falling
    in love with you. In this case, we have an “enhancing” or “positive” feedback.
    But the person you desire may react to your advances in the opposite way: the
    more you try to woo her, the more he or she moves away — eventually your efforts
    become stalking and you better realize before your love interest calls the police.
    This is an effect we can see as a “negative” or “damping” feedback. Then, your
    attitude may also be affected by the reaction of your love, with their reactions
    enhancing or damping your attitude. In short, the system will oscillate or stabilize,
    but always in difficult to predict and surely not described by simple equations.


    In the 20th century, science started noting complex systems. That led to the development
    of a completely new set of methods of investigation. One of these methods, perhaps
    the most common one nowadays, is called “system dynamics,” a field created mainly
    by Jay Forrester. Models developed system dynamics describe how feedback affects
    the flows from one to another in the system. Stocks are defined as amounts of
    something that the model takes into account. A stock could be the number of individuals
    in a biological population, the balance of a bank account, or the number of fishing
    vessels in a fishery. Flows, instead, define how a stock varies with time. In
    a biological system it may be the growth (or decrease) of a population, in a bank
    account there is an inflow (deposits) and an outflow (expenses).


    These elements are the essential features of complex systems, also called “complex
    adaptive systems” (CAS) to emphasize the fact that their internal feedback system
    tends to react to external perturbations in such a way to maintain the system
    status. It is a fundamental characteristic called “homeostasis.”'
