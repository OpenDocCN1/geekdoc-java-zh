- img_proc: true
  md: 'The contraction of human activity could – and can – only happen in two ways.
    Either through “managed decline” organized by global society. Or, through “collapse”
    induced by nature or the market. The only thing that could not happen, said LtG
    , for world society to remain forever in unsustainable territory, using more of
    nature every year than nature produces during each year.


    Irrespective of LtG really said, “growth will come to an end” was the imprecise
    summary that stuck with the book. Unfortunately, the audience believed – and believe
    – that LtG spoke about “economic” growth, and hence that it argued for the halt
    of growth – in economic value added. In fact, the book spoke about “physical growth”
    – growth in the number of people, tons of resources used per year, and tons of
    emissions from human activity. LtG spoke about growth in what we now call “the
    human ecological footprint”. This is important because this allowed the possibility
    of continued growth (in economic value) as long as growth is not associated with
    growing physical impacts (e.g., in resource use or pollution output). Whether
    “economic growth without growing physical impact” is feasible for a century or
    more remains an open question. It is clearly possible in principle, but nations
    with a growing GDP and stable footprint are rare.


    LtG did seek to resolve the question of decoupling physical impact from economic
    growth, and the authors are split in their views on whether decoupling is possible.
    But they did agree that global society ought to reduce its ecological footprint
    per unit of consumption, and much more important, start doing so in time to avoid
    global overshoot. They also agreed that the task would be greatly simplified if
    humanity moved away from its fascination with growth, both in population and economic
    value. So that takes us back to the original question: What did LtG actually say?
    And is this message of any relevance today – 50 years later?


    # The original messages of LtG


    Let us first rephrase – in modern language – the formal conclusions of LtG as
    they appeared on page 23 of the first edition. This rephrasing deliberately uses
    language that did not exist in 1972 – concepts and words which have evolved since,
    partly as a consequence of the lasting global debate around the validity of the
    LtG messages. The conclusions are'
