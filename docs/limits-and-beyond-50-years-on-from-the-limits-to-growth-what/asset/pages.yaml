  md: 'that does not lead (normally) to the kind of partisan division that''s typical
    of politics.


    Science uses a procedure derived from an ancient method that in Medieval times
    was called disputatio, and that has its roots in the art of rhetoric of classical
    times. The idea is to debate issues by having champions of the different theses
    squaring off against each other, trying to convince an informed audience using
    the best arguments they can muster. The Medieval disputatio could be very sophisticated
    although, as you may imagine, theological disputations normally failed to harmonize
    truly incompatible positions, say, convincing Jews to become Christians. It was
    tried more than once, but you will not be surprised by the results. Sometimes
    these debates lead to good compromises, and they kept the confrontation to the
    verbal level (at least for a while).


    In modern science, the rules changed in several ways, but the idea remains the
    same: experts try to convince their opponents using the best arguments they can
    muster. It is supposed to be a discussion, not a fight. Good manners are to be
    maintained and the fundamental feature is being able to speak a mutually understandable
    language. And not just that, the discussants agree on some basic tenets of the
    frame of the discussion. During the Middle Ages, theologians debated in Latin
    and agreed that the discussion was to be based on the Christian scriptures. Today,
    scientists debate in English and agree that the discussion is to be based on the
    scientific method.


    In the early days of science, one-to-one debates were used (such as the famous
    debate in 1860 about Darwin''s ideas involving Thomas Huxley and Archbishop Wilberforce).
    But nowadays, that is rare. The debate takes place at scientific conferences and
    seminars where several scientists participate, gaining or losing “prestige points”
    depending on how good they are at presenting their views. Occasionally, a presenter,
    especially a young scientist, may be “grilled” by the audience in a re-enactment
    of the coming-of-age ceremonies of Native Americans. But, most important of all,
    informal discussions take place all over the conference. These meetings are not
    supposed to be vacations, they are functional to the face-to-face exchange of
    ideas. Scientists are human beings, and they need to look each other in the face
    to understand each other. A lot of scientific innovations are generated in cafeterias
    over a few glasses of beer. No one, it seems, was'
