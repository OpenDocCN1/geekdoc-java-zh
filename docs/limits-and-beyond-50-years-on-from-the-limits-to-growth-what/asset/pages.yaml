  md: 'The (relatively self-evident and optimistic) message of LtG was not generally
    well received and instead led to acrimonious public debate over the ensuing decades.
    A few enthusiasts viewed the book as the litany for a new ecological era, but
    mostly, people saw LtG as a threat to the cherished ways of the present.


    The fundamental scientific message of LtG can be summarized as follows:


    +   Global society is likely to overshoot planetary boundaries before 2100 – and
    then be forced to decline or collapse – because of significant reaction delays
    in the global economy. These are the unavoidable lags in the localization and/or
    perception of global limits, the significant institutional delays involved in
    (democratic) decision making, and the biophysical lags between implementation
    of remedial action and the improvement of the ecosystem.


    LtG did not succeed in conveying this message for many reasons:


    +   - Many believe that continued economic growth is the only feasible solution
    to the three legitimate human needs of, a) a liveable income, b) full employment,
    and c) old age security for all.

    - Many believe that technological advances will solve all resource and pollution
    problems (ahead of time).

    - Many do not understand that economic growth (growth in value added, which equals
    growth in GDP) can occur without growth in the ecological footprint.

    - Many view any interference with the engine of economic growth as an attempt
    by the rich to keep the rest down.


    # Has the message of LtG stood the test of time?


    So, what has happened since the publication of LtG in 1972? How has the world
    evolved over the five decades since then?


