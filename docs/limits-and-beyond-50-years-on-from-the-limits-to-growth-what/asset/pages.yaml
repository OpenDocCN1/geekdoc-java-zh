  md: 'cannot have the voice of Donella Meadows, who played a prominent role in the
    crafting and impact of The Limits to Growth , and in the subsequent development
    of the whole domain of systems thinking. She left this in 2002, without writing
    a last piece titled “Dancing with Systems”, a brilliant ev claiming for the mobilization
    of all our capacities, the rational as well as the embodied, to reconnect with
    the harmonies of living systems. This book is also a tribute to her invaluable
    work.


    Svioslav Zabelin then follows with an insightful piece revisiting the collapse
    of the Soviet Union with the hypothesis that it had actually reached its own limits
    to growth. In the light of recent events, this line of thinking would certainly
    deserve further research. Ernst von Weißäcker, for several years co-president
    of the Club of Rome, gives his impressions of the outstanding personality of Aurelio
    Peccei, the reception of the bestselling report in the political context of the
    1970s and 1980s, and the attempt to promote the decoding of wellbeing from the
    consumption of material resources. He also evokes Come On!, another collective
    report to the Club of Rome, published on its 50th anniversary in 2018. Gianfranco
    Bologna summarizes the evolution of scientific thinking inspired by The Limits
    to Growth, and particularly the work on climate change, biodiversity loss, and
    other ecosystem issues, ultimately leading to the current concept of Planetary
    Boundaries, crafted in 2009.


    In response to our generic invitation, several authors decided to focus their
    reflections on economic thinking and how limited its dominant schools are to grasp
    properly the challenges of humanity. To start the section titled “Still the economy,
    but what kind?”, Wouter van Dieren revisits his own involvement in the launch
    and initial impact of The Limits to Growth to sharply criticize the obsession
    of orthodox economics with growth at all costs. Following the line, Hunter Lovins
    goes further into a detailed, radical and well-documented deconstruction of the
    shortcomings of neoliberal economics. Ndidi Nvoli-Eodzien even dares to explore
    the value of “solidarity capitalism”, an oxymoron she proposes to go beyond the
    limits to growth, by blending social responsibility with elements of African cultures
    and decentralized digitalization. Next, building upon her experience with the
    philosophy and practice of Gross National Happiness in Bhutan, Julia Kim advocates
    for the emergence of wellbeing economies as an alternative paradigm to reconcile
    human welfare with the care of the ecosystems on which our lives depend.'
