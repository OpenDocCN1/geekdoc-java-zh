    Most probably this dramatic shift in perspective was nurtured by the Covid-19
    pandemic and the lack of progress in tackling “collateral” challenges of climate
    and inequality. In any case, it illustrates that we do not have a direct, objective
    access to reality, we give meaning to our perceptions through the lenses of frameworks
    of interpretation, almost never explicit, most of the time not even conscious,
    always dependent on context. Three years is not enough for the state of the planet
    to shift dramatically; the change is in the interpretation, and in this case,
    it certainly has a political intention. It also reflects that after Covid-19,
    bolder statements can be openly made which would have been considered politically
    incorrect in the context of multilateral institutions not so long ago.


    # The human gap


    The two interpretations by Guterres in 2017 and 2020 give voice to different ways
    of thinking about the world and our role in it. The first reflects a belief in
    status quo: there are some big issues, but we can address them by taking care
    of unintended damage. And, as he explained in another part of his discourse, technological
    innovation would play a key role in that. The second discourse is a wake-up call
    in which optimism is dampened and our relationship to nature acquires critical
    importance. There is an explicit statement that human actions can provoke the
    destruction of the very conditions sustaining our lives, which is exactly the
    main message of The to Growth. The consequences of our actions do not only go
    beyond'
