  md: '50 years since The Limits to Growth was published, and how can it factor into
    discussions on future softs to rising environmental catastrophe?


    An answer may lie in that oft-used term, the “Asian Century”.


    While this phrase is traditionally used to describe the rise of Asia as the global
    economic, consumption, and cultural powerhouse along Western lines of development,
    it should be repurposed to frame the political objectives and complexities of
    both the challenges and the solutions of climate change as well as sustainable
    development.


    Why and how? Because the real contest exists in the developing countries of Africa,
    Latin America, and Asia (foremost) where 87% of the world’s population resides
    there. There is an urgent need for these countries to find a balance between the
    basic needs for their massive (and often poor) populations, and the reality of
    resource constraints on a finite planet. Thus, although Europe, the US, and China
    are the heavy hitters, the developmental path taken by the global majority will
    determine our fate. This is a path that should also be weaned off the idea of
    financial and technical aid from the developed countries – unlikely to be forthcoming
    – mainly because it is often underscored by the desire to ape the unsustainable
    economic model of the Western world.


    Despite unbridled economic growth over the last 50 years, the drudgery of daily
    life for billions in the developing world is yet to be eased through sanitation,
    potable water, affordable housing, and secure food supplies. How can they be empowered
    and become economically productive while avoiding the adoption of developed-world
    habits that will result in environmental catastrophe? The harsh reality is that
    the Asian population is predicted to reach 6 billion by 2050, and it is physically
    impossible for them to achieve the same consumptive lifestyle as a middleclass
    Westerner. Therefore, clear political objectives about development need to be
    determined, which will involve enacting new ideas that the world has not been
