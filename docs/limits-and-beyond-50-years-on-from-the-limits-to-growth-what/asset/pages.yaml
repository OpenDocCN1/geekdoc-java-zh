  md: 'Human groups have employed many different forms of governance during the several
    hundred thousand years our species has lived on this planet — monarchy, democracy,
    oligarchy, theocracy, aristocracy, and numerous others.


    Any of these different governance systems can potentially guide humanity to a
    more sustainable future if it reflects a concern for equity, environment, resilience,
    and welfare, and if it considers impacts that are distant in time and space to
    be as important as those that are proximate. No governance system will produce
    an attractive future if it reflects the opposites.


    Sustainable governance requires institutions and a culture that have the ability
    to choose and sustain short-term sacrifices in order to secure long-term gains.
    So far, none of the present national governance systems have shown much proclivity
    for inducing their citizens to make short-term sacrifices for the long-term welfare
    of others.


    Decline of our species is inevitable without an expansion of people’s boundaries
    of concern — the span of time and space within which they compare the perceived
    costs and benefits of the alternatives they are considering.


    Many problems have an inherent inertia that causes them to unfold over decades,
    centuries, or longer. Policies enacted in one place often have consequences far
    away. Measures that make those problems less serious in the short term and locally
    typically will make them more serious in the long term and far away.


    Embedded in political, economic, and cultural systems are many mechanisms that
    favor the short term over the long term — frequent elections, daily stock market
    reports, investor preferences for short payback periods, and the brief attention
    spans of the media.


    So long as such mechanisms prevail and policies are evaluated only by their immediate
    and local consequences, there will be no possibility of avoiding the negative
    consequences of limits to growth.


