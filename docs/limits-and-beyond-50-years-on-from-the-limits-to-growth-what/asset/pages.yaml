  md: 'pioneered in the 1960s and that was at the basis of the LtG study. Forrester
    developed his modeling theory, “system dynamics,” with the idea of describing
    the behavior of a system and, within limits, extrapolating into the future. it
    was an extremely innovative approach, but it had a weak point: it was based on
    a standardized view of the way people behave.


    The world models at the basis of Forrester''s and LtG studies are implicitly based
    on the same assumption made in most economics models: that people simply act in
    ways that maximize their immediate advantage (apart from the population sector).
    That is, people tend to maximize growth and the exploitation of natural resources.
    At the macroscale of world models, the assumption works, but not that it is modifiable
    by the feedback effects that govern the model. It means that the only way to study
    the effect of changing people''s behavior was to assume an external “forcing”
    (a technical term for parameters that are not contained in the algorithms of the
    model.


    It is understandable that Forrester and his coworkers did not want to embark on
    the difficult (perhaps impossible) task of embedding people''s behavior in the
    tangle of feedback that make the core of the model. Yet, this approach prevented
    the model from describing the effects of people learning from experience and what
    factors could lead them to modify their behavior. This feature made world models
    extremely sophisticated in describing the system, but told people little, or nothing,
    about how it would have been possible to control the system.


    “Control” is a term with a negative ring to it. It seems to imply dictatorship
    or totalitarian regimes. These are, indeed, about societal control, but they are
    primitive and expensive methods that usually fail in the long run. If we replace
    control with “governance,” intended as shared responsibility and shared decisions,
    the negative ring disappears. And we need governance, otherwise the system may
    evolve in ways that could be extremely negative for the citizens, such as the
    rise of oppressive dictatorships, extreme inequality, segregation of minorities,
    and worse (and we are seeing some of these negative trends appearing right now).
    But how do we attain governance, especially at the global level?


