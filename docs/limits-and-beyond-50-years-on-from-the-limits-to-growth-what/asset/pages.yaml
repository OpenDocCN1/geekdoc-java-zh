- img_proc: true
  md: 'The graphs for every variable can be found in my journal article,-but most
    of them show an image similar to the one below (Figure 2): an overall close alignment
    of empirical data with each of the four scenarios, least closely with SW and most
    closely with BAU2 and CT.


    ![](img/5f537e86837b31506b822569eab27980_252_0.png)


    Figure 2. Empirical data for birth rate (births per 1,000 people) and the variable
    for each scenario.


    The overall close alignment of empirical data with each of the four scenarios
    is a testament to the accuracy of World3. On top of the criticism that I mentioned
    earlier, the modeling technique itself (i.e., system dynamics modeling) was also
    heavily criticized, with some accusing it of being unscientific. But as someone
    with a degree in econometrics and years of work experience in finance and strategic
    consultancy, I could not tell you another model that has forecast this accurately
    several decades into the future.


    I should note that for several variables the scenarios only diverge significantly
    after 2020 (as in the above graph, Figure 2). This is especially so for BAU2 and
    CT, which is why it was not possible to differentiate between them. An update
    of this comparison in another few years might identify one specific closest fit
    to empirical data. Without major changes in societal priorities, this is unlikely
    to be the scenario showing a sustainable path; SW, in which a decline in human
    wellbeing within this century is minimized (Figure 3), aligned with the data least.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '![](img/5f537e86837b31506b822569eab27980_253_0.png)


    Figure 3. Empirical data (UN Human Development Index) plotted against human welfare
    variables for all four scenarios.


    My research findings indicate that based on the World3 model, global societal
    collapse cannot be ruled out; one of the best fit scenario, BAU2, shows a collapse
    pattern. The best fit scenario however, CT, shows only a moderate decline. Both
    scenarios show a slowdown in industrial and agricultural output. My research results
    at point thus indicate that we can expect a halt in economic growth within the
    next two decades, whether or not we consider that a good thing. However, my research
    results also leave open when the subsequent declines in industrial and agricultural
    output will lead to sharp declines in population and welfare levels.


    Personally – I’d like nothing more than to be wrong about this – I humanity’s
    current path is more likely to be following BAU2 than CT. It is simply in line
    with others’ observations, such as from the Intergovernmental Panel on Climate
    Change, the planetary boundaries studied by Steffen et al., the ecological footprint
    by the Global Footprint Network, and much other research. This is also in line
    with what to me has always been one of most important lessons from the LtG study:
    the plural of “limits” in limits to grow. Yes, humanity can innovate itself out
    of one limit to whatever extent it has with the resource constraint. But in a
    system like our global society, creating a solution to one limit inevitably causes
    interactions with other parts of the system, sooner or later giving rise to a
    new limit which then becomes the new binding constraint to growth. This new constraint
    today is pollution, from greenhouse gasses but also toxic chemicals in our air,
    water, food, buildings, furniture, and consumer products. Innovating out of the
    pollution constraint, if even possible, will almost certainly expose us to a new
    one. We can either choose'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'to abandon perpetual expansion growth as a goal or have the impossibility of
    holding on to it imposed on us. It seems as if humanity so far has chosen the
    latter path, marching towards having limits forced upon us.


    But perhaps you''re more optimistic, looking at this research thinking that we
    can humanity is following the CT scenario. Maybe you think we can hold on to growth
    as a pursuit while basically fine with only a temporary dip in welfare levels
    around 2050. I could point out that the assumptions underlying the CT scenario
    are highly optimistic given historic figures. For example, CT assumes technological
    progress rates of 4% a year which, among other things, should lead to reductions
    in pollution emissions of 10% from their 2000 values by 2020 (that did not happen)
    and 48% by 2040. Compared to our performance record of reducing global CO2 emissions,
    the CT assumption seems unrealistic. However, a technologist might argue that
    technological developments are accelerating, and a solar-technology boom or nuclear-fusion
    breakthrough are around the corner to completely change our trajectory. We keep
    going back and forth for a long time with our arguments, none of which would change
    the fact that ultimately the future is unknown.


    Much more important, however, is whether we are following the CT is not the right
    discussion to have. It is the only thing that can motivate humanity an impending
    collapse? I would argue not, in fact, I would argue the opposite. One just needs
    to look at the climate debate and realize that if impending doom was enough motivation
    for society to make the necessary changes, we would have made them by now. The
    overwhelming threats of climate change and other sustainability challenges seem
    to not see people into action as they scare into the arms of economists, technology
    gurus, and spiritual leaders who promise that force, be the invisible hand, human
