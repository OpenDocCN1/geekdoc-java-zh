    only man in his material system because valid social elements simply could not
    be devised and introduced in this first effort.


    In spite of all these obvious problems, certain concepts held true. We’re in trouble
    if we don’t change. Material concerns matter and often frame the outcomes. We
    live on a finite planet. But without considering a more complex view of the social
