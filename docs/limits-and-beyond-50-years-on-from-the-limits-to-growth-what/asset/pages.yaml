  md: '# The Cycles of Civilizations


    Some five thousand years ago, the first human civilizations appeared over an arc
    of land that spanned the whole of Eurasia, from the fertile crescent of the Near
    East to the Yangtze valley, in China. Over the years, new civilizations were born
    and spread all over the world, building cities and roads, increasing their population,
    and conquering their neighbors. They all had one thing in common. First they flared
    up, then declined and leaving only ruins, and sometimes inscriptions on rocks
    where one or other great ruler stated that their glory would never end. But few
    empires lasted more than a thousand years, and most disappeared after just a few
    centuries. Our modern civilization, the one we sometimes call "The West" or "Globalization,"
    had its origins in Europe about a half millennium ago, in the great expansion
    that we call "The Renaissance." Now, it is old enough that it is facing its demise.


    But why do civilizations follow this cycle of growth and collapse? It is a question
    that never made those who asked it popular, especially if they concluded that
    collapse was coming soon. Nevertheless, the ups and downs of ancient civilizations
    were noticed, and, in some cases, we can still follow ancient discussions on this
    subject. Perhaps the first mention of a collapse comes from the Sumerian priestess
    Enheanna, the first author of texts whose we know. In one of her hymns to the
    Goddess Inanna, written some 4,500 years ago, she described an epic battle between
    the goddess and a mountain, a story in which we can recognize the collapse of
    the fertile land caused by erosion. ²,³


    Much later, the Roman Empire became one of the largest empires ever seen in history,
    but it had to face decline, too. The first hints that something was not going
    well for Rome appeared during the 1st century AD, when Lucius Annanaeus Seneca
    noted in one of his letters that "the way to ruin is rapid." ⁴During the same
    period, the early Christians interpreted the trend in religious terms related
    to the coming *parousia*, the manifestation of God, that would not end just the
    Roman Empire, but also the human experience in the material world. Later, this
    view was called "Millenarianism," typical of religious sects.


    But the Romans, just like most historical civilizations, went through collapse
    nearly completely unaware of the reasons for what was happening'
