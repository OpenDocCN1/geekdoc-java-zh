    nature as Guters talks about. Interestingly, Donella Meadows, co-author of The
    Limits to Growth and a brilliant systems thinker, titled her last article “Dancing
    with Systems”._4How we engage in dancing with Life instead of waging war?


    # An inadequate lens


    We posit that the learning ladder towards desirable futures will be insurmountable
    if we do not dare to question how we think about the world, our role in it, and
    the relationships among humans, Life at large and with time. The Scientific Revolution
    of 17th and 18th centuries opened the space for the technical developments leading
    to the first Industrial Revolution and an unprecedented capacity to shape our
    environment and'
