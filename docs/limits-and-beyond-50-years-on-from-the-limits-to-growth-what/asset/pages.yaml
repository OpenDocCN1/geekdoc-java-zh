  md: '# Chapter 7


    # How the Club of Rome influenced the world’s agenda


    Wouter van Dieren


    Director of Inis Vitrin


    This is the story of the creation of the Club of Rome myth in the years 1971 and
    on. It has never been told before in this format.


    As a science journalist for Dutch television, I travelled to the USA in the fall
    of 1970, meeting the key players in the unfolding new green community: the World
    Resources Institute, World Watch, Environmental Defense Fund, Sierra Club, Environmental
    Protection Agency, and many others.


    In Boston, I ran into a group of brilliant young scientists, Dennis and Donella
    Meadows, Bill Behrens, and Jorgen Randers, in a meeting about their research into
    the limiting factors of the earth system. I had never seen a computer and had
    no knowledge of the methodology, systems *dynamics*, or of the computer languages
    Dynamo and Fortran.


    However, I instantly saw the scope of the study, the meaning, the drama, the power.
    I grasped the idea of feedback loops and systems thinking. Several days later,
    I concluded to the scientists that they had “dynamite” in their hands, which they
    could not believe. Their plan was to complete the study the next year and to publish
    it as a report to the Club of Rome, which no one had heard of, including myself.


    They handed me a draft, which I took back to the Netherlands. There, we produced
    a hundred copies, with the imprints marked *confidential* and not for distribution.


    A long journey among major institutions began, starting off with the R&D directors
    of Unilever, Akzo, and Philips. At the Philips Physics Lab,'
