  md: 'population, so that the model allowed industrial output per person to increase
    despite some growth. But according to World3, when natural resources begin to
    dwindle, industrial output is negatively affected. Pollution, as empirical evidence
    from the 1960s has shown, is increasingly in parallel with industrial production.
    Also, population growth increases pollution. Pollution, on the other hand, damages
    food production. Moreover, as natural resources dwindle, food production will
    suffer. Small that the model shows the food per person parameter as the first
    production factor getting weaker, shortly after the year 2000. Again, that’s plausible.


    Natural resources were assumed in the model never to be replenished, meaning they
    would shrink and shrink. In terms of geology, that assumption is correct. In terms
    of practical availability of natural resources it has proven wrong a few years
    later. The oil crisis of 1973 quadrupled oil prices, and the oil cartel made it
    lucrative and necessary to explore and drill oil reserves unknown in 1972. In
    later decades,“fracking” came up, raising the known oil reserves further. Similar
    developments occurred with metals. Indium, for example, is a rare and silvery
    metal useful for many technological applications. It used to be produced only
    as a by-product from zinc mining, but with its elevated price, mining companies
    turned to indium mining in its own right.


    The “shrink” message was actually the chief cause of widespread alarm in the early
    years of LtG . The authors, and the Club of Rome in general, responded saying
    that the model allowed for quite different initial conditions and mathematical
