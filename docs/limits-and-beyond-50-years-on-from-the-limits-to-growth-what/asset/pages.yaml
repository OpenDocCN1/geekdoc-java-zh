  md: '# # Introduction


    Ugo Bardi and Carlos Alvarez Pereira


    The editors


    This book originates in another one, published 50 years ago, which intended to
    open the space of possibilities for humanity to decide on its course. Many did
    not, and still do not, perceive *The Limits to Growth*, the 1972 report to the
    Club of Rome, as doing exactly that. What was mostly taken from the book was its
    strong warning of how dire the future of humanity would be if we did not change
    what we understand as “development”. And to many this was not good news. It was
    rejected as a first step. And many ignored the book entirely as well as the endeavour
    behind.


    The Club of Rome had been founded in April 1968, as a space for debate among personalities
    from different backgrounds – business, science, politics, civil society equally
    committed to examine the future of humanity as a whole as a systemic, long-term,
    global lens. At the time no other organization was daring to ask some essential
    questions. One of them is now even more critical than in 1968: Can we achieve
    equitable wellbeing for all within a healthy planet?


    Within the logic tying human development to the unlimited growth in consumption
    of material resources, one must ask how much is feasible within a finite planet,
    a question that traditional schools of economic thinking have been reluctant to
    consider. *The Limits to Growth* addressed it by using early computer modelling
    to produce a simulation tool and build a variety of future scenarios. Unfortunately,
    the simulation showed that in most of the scenarios, human civilizations would
    face collapse during the first half of the 21st century.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'This finding shocked the world.


    The Limits to Growth disrupted the conviction that conventional “development”
    and its expansion to the whole globe, as a programme of modernization and industrialization
    under Western hegemony, was necessary and legitimate for the sake of the progress
    of humanity.


    The disruption was not appreciated by the established powers of the time. The
    possibility of scenarios in which human development would be redefined to fit
    within the boundaries of a finite planet was simply ignored. And when the concept
    of “sustainable development” was coined in 1987, it only questioned the nature
    of “development” inasmuch its negative effects could be considered as “collateral”
    issues to be addressed by more development of the same kind.


    Humanity’s situation has changed since 1972, and we are in trouble more than anyone
    related to The Limits to Growth would have liked to see. The financial crisis
    started in 2008, the Covid-19 pandemic since 2020 and the many ongoing conflicts
    including the war in Ukraine in 2022 are brutal signals that everyone sees. They
    emerge from a larger background of unfolding existential threats. To name a few:
    the growth of inequity and fractures within nations; climate warming; the destruction
    of ecosystems and species; and the use of finance and technology to segregate
    people instead of nurturing healthy societies.


    At the same time, women are emancipating themselves everywhere. In many places,
    people are overcoming the helplessness derived from colonial and neocolonial rules
    and minds. Young generations are more aware of the failures of economic and political
    systems that are reducing possibilities in the future. And achievements of science
    and technology are breaking barriers, but also accelerating the possibility of
    dystopian futures with deeper divisions between winners and losers. In all in,
    it seems that humanity is thriving and committing suicide at the same time. We
    might be living in the brightest moment of humanity and closest to the abyss of
    our self-induced extinction.


    How can we deal with that fundamental contradiction? What we already know about
    Life works might help. Living systems evolve all the time and occasionally enter
    critical zones from which they could emerge with completely new patterns. But
    “could” is not “will”. At critical points, the future is truly unknown. Jorge
    Luis Borges claimed that “time forks perpetually towards innumerable futures”.
    Erich Jantsch (co-founder of the'
