    # LtG 6: It is important to act as soon as possible


    Finally, LtG also said that it was important to start early to achieve a smooth
    transition to a sustainable world – without passing through overshoot and contraction.
    This point was illustrated by scenario 12 in LtG , which showed that the same
    global policies that would solve the problem (in the model world) when implemented
    in 1975, would not suffice if implemented 25 years later, in 2000.


    Today we know that no real action to forestall overshoot was put in place (in
    the real world) in 1975. Nor any genuine effort under way in 2000. The last 20
    years have seen a steady rise in the number of statistical measures that indicate
    that humanity has overshot planetary boundaries and that number is still increasing.
    The ground is being prepared for collapse or contraction, or ideally, planned
    contraction. Climate change is emerging as the central challenge.


