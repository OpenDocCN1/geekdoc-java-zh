    What was not in itself a disadvantage. An aggregated model is affected by lower
    uncertainties and it may be more reliable than models that attempt to follow the
    behavior of many elements whose values are not certain.


    For the models underlying World Dynamics and The Limits to Growth , the world
    was divided into a limited number of subsystems: agriculture, industry, population,
    etc., and the relations among the elements of the subsystems were described by
