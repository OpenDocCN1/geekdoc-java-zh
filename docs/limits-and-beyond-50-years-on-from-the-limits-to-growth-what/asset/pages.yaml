  md: '# Foreword

    Mamphela Ramhele and Sandrine Dixson-Declève


    # Co-Presidents of The Club of Rome


    The universe is conspiring to bring humanity to its inescapable destiny – being
    inextricably interconnected and interdependent within the web of life. Humanity''s
    attempts at escaping into a make-believe world of me, myself, and I have hit a
    dead end.


    Limits and Beyond is a celebration of hard lessons learnt from 50 years of humanity''s
    resistance to the central message of The Limits to Growth report. It is our responsibility
    to the Club of Rome to remind global decision makers that we have collectively
    wasted 50 years of valuable time. As a consequence the book is also a reminder
    that humanity needs to move beyond the limits we set for ourselves learn what
    we need to learn, and learn it, as we were invited to do in after another report
    to the Club of Rome, No Limits to Learning , published in 1979.


    This book is a rich compilation of deep reflections by members of the Club of
    Rome, as well as other partners who share a vision of the world characterized
    by wellbeing for all within an equitable global order for a healthy planet. It
    includes an updated perspective by two of the co-authors of The Limits to Growth
    and other prominent thinkers about what the book actually said, how it was received,
    what happened next and its relevance today.


    One of the central lessons of past decades is captured by a particular school
    of economic thought, neoliberalism, obsessed with unending growth at all costs.
    As several of the co-authors suggest, it is more than time to overcome this and
    adopt'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'transformational economic models that embrace a systemic perspective to address
    humanity’s challenges.


    Moreover, we need a rich diversity of perspectives if we want to liberate ourselves
    from the constraints we have created. As exposed in several chapters of this book,
    new lenses are required to imagine different and more desirable futures. Voices
    from Most of the World and from alternative perspectives are included here to
    show that we reconnect with our humanity, provided we inquire on our blind spots.
    This book is coming out shortly after the publication of the IPCC Sixth Assessment
    Report. For the first time, the IPCC goes beyond reliance on so- “natural scientists”
    as the sources of data and analysis, and included “social scientists”, indigenous
    knowledge experts and community leaders, as well as voices of young people.


    This led to the acknowledgement that colonialism was a root cause of the climate
    crises. The report went further to recognize the impact of colonial history as
    an ongoing impediment to appropriate responses by humanity to adapt and transform
    their destructive lifestyles. In addition, vulnerable communities whose ecosystems
    were captured for the benefit of colonial conquerors and their post-colonial successors
    do not have the resources nor the capacity to respond appropriately to planetary
    emergencies.


    In its last chapters, Limits and Beyond reminds us that we No Limits to Learning
    . There is a growing evidence of the huge innate capacity in all humans to learn
    and come to grips with how living systems change. Work done in the most challenging
    environments has demonstrated the innate capacity of people to adapt. Its most
    important enabler is the encouragement for each to travel inwards to liberate
    themselves from a sense of worthlessness and fear of failure. Self-liberating
    education and learning environments tap into the innate capacity of even the poorest
    – young and old – unleash enormous energy and creativity.


    Contrary to some widely held views, human beings are wired to be connected. We
    are happiest when we are surrounded by loved ones who affirm and support us. And
    the 50th anniversary of the publication of The Limits to Growth coincides with
    a growing awareness by humanity at various levels that we are part of nature and
    that nature has infinitely more intelligence than we do. The Covid-19 pandemic
    has proven most effective in demonstrating our inextricable interconnectedness
    and interdependence.'
