  md: 'So, what can be done? We are stuck in a situation that reminds us very much
    the description of the mismanagement of the commons by Garrett Hardin had described
    in his 1968 article “The Tragedy of the Commons.” But whereas Hardin was discussing
    small-scale pastures in England, the modern tragedy involves the planetary commons.
    In the end, large problems stem from single causes: a conflict between individual
    greed and societal good. No need for sophisticated mathematical models to understand
    that as long everybody wants to optimize their individual (or group) gains, that
    will lead to the destruction of the commons.


    The effect of Hardin’s ideas on the current way of thinking in economics has often
    been to promote privatization. If every shepherd owns patch of pasture, could
    be reasoned, then they will have no interest in overexploiting it. But, in practice,
    there is no evidence that privatization had any effect in reducing the wave of
    privatizations that swept the Western world during the past decades. But, one
    problem is that even people are personally exposed to the results of their mistakes,
    they may still overexploit the resources they control, either because their time
    horizon is shorter than the insufficient knowledge or understanding of the system
    to control it effectively. The latter phenomenon has been argued, for instance,
    in a series of studies by Erling Moxnes⁷⁰


    But the fundamental problem with privatization is that it cannot always be applied.
    Privatizing may be just too expensive and, of course, you can’t fence the ocean
    or allocate parcels of atmosphere to each state in the world. For nothing, at
    present, the sea and the atmosphere are the mostexploited global commons. You
    may argue that without physical fencing it is still possible to allocate separate
    portions of these commons to different actors. This is the principle of fishing
