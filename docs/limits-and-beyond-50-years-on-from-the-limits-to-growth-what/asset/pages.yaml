  md: '# Acknowledgments


    A book is always a collective adventure and this one even more so. It is made
    up of contributions by many authors who have been so kind as to respond in no
    time to the demanding petition from the co-editors. Our gratitude goes to all
    of them, and particularly to the Co-Presidents of the Club of Rome, Mamphela Ramphele
    and Sandrine Dixson-Declève, who promoted a whole programme for the celebrations
    of the 50th anniversary of the publication of *The Limits to Growth*, of which
    this book is a manifestation among many others.


    A big thank you goes to Rob Worth, our publisher at Exact Press, who has shown
    a relentless capacity to streamline necessarily complex process that could have
    derailed many times, and to make our lives much easier. With him we were fortunate
    enough to experience how publishing became an inviting journey. No small feat!


    Needless to say, we are very grateful to people around us who in one way or another
    have lived the concept of this book as if giving birth to it was also part of
    their duty. This includes the staff in the Secretariat of the Club of Rome, and
    in particular Philippa Baumgartner and Till Kellerhoff.


    Last but not least, a special note is required to recognize the role played by
    our interlocutors in so many conversations related to the topics of this book.
    We cannot mention all of them, and hence this citation is necessarily unfair,
    but here are some of their names: Aline Frankfort, Cintia Jaime, Karima Kadaoui,
    Kristina Lanz, Lydia Maher, Nadia Sandi, Roseann Stempinski, Samantha Suppiah,
    Sarah Dubrel, and Sijin Chen. All of them and many others are actually doing what
    we talk about in this book: opening the space of possibilities for desirable futures.


    — The co-editors, Ugo and Carlos'
