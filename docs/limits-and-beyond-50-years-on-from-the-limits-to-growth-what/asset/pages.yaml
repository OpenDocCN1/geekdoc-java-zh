    Finally, the fateful year of 1968 saw the publication of a paper that rocked the
    foundations of economics as they had been understood to then. It was “The Tragedy
    of the Commons” by the biologist Garrett Hardin.¹¹.It soon became a classic.


    Hardin exposed his ideas in the story of a “commons,” that is, free for all shepherds
    to bring their sheep to feed. Imagine that the land can support at most, 100 sheep.
    More sheep than that would eat much grass and leave bare land that would be rapidly
    eroded. So, 10 shepherds can have 10 sheep each, as long as things stay that way,
    nothing happens. But place yourself in a shepherd’s woolen socks: for more sheep
    mean more wealth. So, if you could have 11 sheep instead of 10, you would be richer.
    But you also know that one more sheep in your herd would damage the pasture. Scratch
    your head a little and then you reason the money you make with the extra sheep
    is yours to keep, while the damage it does to the pasture affects all the shepherds
    in the same. After all, 101 sheep is not very different from 100; the damage is
    small. Accordingly, you go ahead and add one more sheep to your herd.


    The problem is that every shepherd reasons in the same way and each adds one more
    sheep to herd. Now we have 110 sheep grazing pasture that can''t feed more than
    100. And the effects start being seen: the green pasture is becoming less green,
    with dark patches appearing where sheep overgrazed the grass.


    And it is not over. If one more sheep gives you an advantage, why not add two?
    That at least will compensate for the damage done to the land by the extra sheep
    that the other shepherds are keeping. And you do that, just like everybody else
    does. So population of sheep increases and the final result, according to Hardin,
    is the destruction of the pasture by'
