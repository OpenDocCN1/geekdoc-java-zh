  md: 'System dynamics models quantify these factors to describe the behavior of CAS.
    There are many examples in the field of socioeconomic systems, but one of the
    first models to be proposed in this field is known as the Lotka–Volterra model,
    also called the “predator-prey” or the “foxes and rabbits” model._14In the model,
    the stock of the predators and the stock of the prey interact with each other
    causing the two populations (predators and prey) to oscillate forever. The Lotka–Volterra
    model is not just theoretical and in a slightly modified version it can describe
    how the fishing industry may destroy itself with overfishing._19The idea of destroying
    the resources that one live is surely stupid, but it is also very common. It is
    an effect that Bardi and Perissi dubbed “The law of stupidity” proposed earlier
    by Carlo M. Cipolla._20


    Of course, describing the whole world’s economic system, as Forrester aimed to
