    lost its uniqueness as the prophet for the predicament of humankind.


    # Over-simplistic model for a great message


    The powerful message of *LtG* was, in effect, based on a very simplistic model.
    The advantage was that the model was suitable for computers producing striking
    results in a very short time. Systems theory was tremendously fashionable at the
    time, engendering high credibility. The concrete model was proposed by Dennis
    Meadows, who called it the World3 model; public reference often called it the
    MIT model. It simply said:


    +   - Take five parameters: human population, food per person, industrial output
    per person, exploitable natural resources, and pollution;

    - Empirically establish the absolute numbers of the five parameters at time zero;

    - Use empirical facts to establish the mutual relations between each of the five
    parameters; and

    - Let the computer calculate the future.


    Bang! It worked.

    Funny effects occur, most of them plausible, however. Industrial output per person
    and food per person will shrink when population increases; fortunately, in the
    past, industrial output grew somewhat faster than'
