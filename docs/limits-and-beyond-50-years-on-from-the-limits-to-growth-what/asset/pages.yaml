  md: '# # Chapter 12

    nThe historic The Limits to Growth report – 1972 and the present world


    Yury Sayamov

    Head of UNESCO Chair on Global Problems, Moscow State University


    When The Limits to Growth report appeared in 1972, I was young and among those
    striving for a better future. During that time with the International Union of
    Students (IUS) – the world umbrella organization of national unions of students
    from over 100 countries – I was at its headquarters in Prague and was responsible
    for information activities. I edited, among other things, the World News magazine
    published in seven languages. It is no wonder that I learned about the report
    practically as soon as it became known. First, it was analyzed in an article published
    by the West German magazine Der Spiegel , which I regularly received on subscription
    and had a habit to read attentively. After soon, one of my colleagues brought
    The Limits to Growth book and brought it to the IUS Secretariat for common reading
    and knowledge. The impact made it remarkable. The most important result of the
    report was that it made people think in a new way, discovering the fragility and
    the limitedness of the world we live in.


    Of course, not everyone arrived at such a vision, and those who did, not immediately.
    Many did not, and some of them most will never be able or willing to see the world
    in its immense complexity, full of interdependencies and growing existential risks.
    As the first president and co-founder of the Club of Rome, Dr. Aurelio Peccei,
    witnessed later, his words sometimes found no more response than the sermons of
    the Pope, the exhortations of the UN Secretary-General, or the warnings of concerned
    scientists and thinkers.'
