    # Conclusion


    Fifty years after The Limits to Growth was first published, the most significant
    challenge facing the world will be how to balance the necessities of development
    and providing basic needs for poorer countries without succumbing to the excesses
    of rich countries, while at the same time preserving cultural plurality by avoiding
    a blinkered chase of a homogenous globalized Western approach.


    Encouraging, discussions have started about the need to curb global consumption,
    even if participants balk at pursuing the logical policy conclusions. More leaders
    must grapple with the true scale of the crisis, beginning the difficult task of
    searching for solutions.


    The challenge is to redesign our economic system and reward its captains for confronting
    this existential threat. It requires puncturing the myths at the core of our economic
    system and confronting hard facts. This will probably see contemporary capitalism
    being reshaped: a ground-up transformation of how the private sector serves society,
    with mandates for businesses to value sustainability, conserve resources, and
    prioritize social stability more than shareholder value or short-term profits.
    If they fail, licences to operate must be revoked.


    This might sound revolutionary, but the alternative is gambling with accelerating
    large-scale socioeconomic and environmental destruction. Governments must take
    responsibility for social welfare and basic needs and cannot assume optimal outcomes
    from free markets and the pursuit of growth agendas based on trickle-down economics.
    This requires reversing the economic trends of the last 50 years and the subduing
    of winner-take-all approaches, which have resulted in the state falling captive
    to strong vested interests.


    Governments must prepare for a sustainable future, or they can expect people who
    lack access to what they see as “basic rights to life” to rebel.'
