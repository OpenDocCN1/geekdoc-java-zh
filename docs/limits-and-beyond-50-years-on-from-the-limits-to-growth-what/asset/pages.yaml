  md: 'In words, the dominant way of thinking dispossesses living beings (human or
    not) from their characteristic of being alive. They are treated as inanimate objects,
    or at best controllable subjects, not as autonomous and interdependent beings
    in co-evolution with their environment. This also gives some humans not only the
    position but also the legitimacy to pursue and expand multiple forms of colonization
    and extractive exploitation of people and nature. And it is a violation of the
    rule of interdependency, the key feature of all ecosystems, including the biosphere
    at large. At whatever scale, ecosystems not change by following a directional
    imposition from outside, they learn new patterns of behaviour, which will, most
    of the time, not be those we expected. We might act as if not knowing, but then
    we should remember the warning by José Ortega y Gasset: “every ignored prepares
    its revenge”. Simply put: by using mechanistic thinking, a way of mapping largely
    blind to what we know about Life, we inevitably create tragedies that we tend
    to ignore until it is too late.


    To illustrate what we mean, let us take the example of climate change, which is
    now a priority in most public agendas. The identification of the use of fossil
