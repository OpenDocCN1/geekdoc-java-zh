  md: 'It may be a surprising result, but it makes sense. It has to do with our heritage
    as human beings. Commons still exist in our world and if you encountered some
    ancient collective management systems for common resources, you would surely notice
    how well it was regulated. And the beauty of the concept is that these governance
    systems were not designed from above, they evolved by discarding what didn’t work.
    In this sense, a well-managed governance system is akin to the concept of “holobiont”,
    initiated by Adolf Meyer-Abich in the 1930s—but revised and disseminated in our
    time by another remarkable mind of the 20th century, Lynn Margulis (1938–2011).
    She was, among other things, the originator with James Lovelock of the concept
    of “Gaia” intended for the homeostasis of the planetary ecosystem. Holobionts
    are widespread biological entities, not created by “the survival of the fittest”
    in a Darwinian sense, but by the “survival of the good enough”, intended as the
    one which best manages the available resources by collaboration rather than competition.
    Forests, fungi, corals, and even human beings are examples of holobionts. We can
    also see human social systems as holobionts when they are regulated by interactions
    based on empathy among members. These “social holobionts” can often avoid overexploitation
    by maintaining a relatively egalitarian structure that prevents excessive competition
    among members.


    So, we are back to what we started from. Can we manage the global commons according
    to the suggestions from Donella Meadows, Elinor Ostrom, and Lynn Margulis? Maybe
    the solution lies in recognizing that these three great women of the 20th century
    were probably endowed with a better understanding of the concept of empathy with
    their male counterparts of their time. The name of the game is always the same:
    empathy. If we can inject empathy into the governance of the world, then we can
    solve the enormous problems we face. Otherwise, they will solve themselves, without
    caring too much about human suffering.


