  md: '# What heritage means


    Capital has become the totem par excellence of human societies on which we place
    all our expectations. At this stage of the 21st century, characterized by an extreme
    degree of financialization, it is the ideal recipient of past achievements and
    the central element of our relationship with time: we all expect to accumulate
    and receive future returns to ensure our welfare, protect our lives from hardship,
    and not least give meaning to what we do, for ourselves and our offspring. The
    concept was originally grounded in living processes: land and animals can constantly
    produce resources useful to humans and feeds the idea that future returns can
    be expected. But this requires a lot of human work and the sun, water, wind, and
    soil materials to contribute (no coincidence: these are the Four Elements of ancient
    traditions). Nowadays legal practices enforce attributes of capital unrelated
    to living processes, according to a very specific conception of its role, which
    has been and could be otherwise. A characteristic of present Modernity, capital
    is given more and more abstract forms, for instance, the ownership of algorithms
    of artificial intelligence. And in its dominant encoding it imposes enclosure
    (the opposite of the commons) and a high level of control over means to produce
    monetary flows in the future, whether they are productive efforts of people, the
    exploitation of natural resources, the royalties of intellectual property, or
    the future time of debtors. Capital is probably the most powerful social construct
    we have invented; it governs not biophysical realities but also our minds and
    time. And it does so in an increasingly detached manner; expressed in the one-dimensional
    language of money, it is more and more decontextualized from any geographical,
    human, or cultural circumstances, and it becomes infinitely mobile by the stroke
    of a computer key.


    Consequently, the evolution of capital in the previous decades has contributed
    to expanding the domain of the "rentier economy". The portion of monetary flows
    coming from rents on whatever form of capital has been growing significantly faster
    than the outcomes of human work. This has not only made the deepening of social
    inequalities a structural, non-collateral feature of our economies, it has consolidated
    a culture in which the individual accumulation of capital, rather than the quality
    of'
  merge: -1
  pgno: 284
- img_proc: true
  md: 'relationships, is seen as the main mechanism for future welfare. All this becomes
    truly problematic when it makes us ignore the tragedies we are creating due to
    a dangerous combination: capital is increasingly detached from social and biophysical
    realities, and at the same time it aspires to control them all to get returns.
    In spreadsheets almost all figures look rational, and we feel entitled to assign
    future returns to whatever form of capital we have created and legally encoded.
    But this is a violation of what we already know about Life works: the second law
    of thermodynamics says that decline, not growth, is the norm. If growth happens
    it is due to a delicate combination of ingredients and circumstances, not the
    least the intake of energy from outside the system. So, capital cannot create
    returns per se; if it consumes more energy (in whatever form) it receives, it
    will necessarily decline.


    In this respect, the example of land mentioned above is quite illustrative. For
    land to produce returns, we have to ensure that the soil stays healthy, the appropriate
    combination of sun, water, wind, and human work come together, and the risks of
    poisoning, drought, storms, frosts, frost waves, and others are kept at bay. A
    lot of care is required for Life to do what we would like. Industrial agriculture
    does not completely ignore, but its focus is on the return on capital, not on
    the relationships between the components of the ecosystem to ensure it remains
    healthy. This is problematic, not because the concept of capital is useless per
    se, but it would be better understood as a synonym of “heritage”. This emphasizes
    the fragility of past achievements; they require care and depend on the health
    of all contributors (human, non-human, and inanimate) and on the quality of their
    relationships. And quite obviously, heritage plural means different things in
    different cultures, and capital should be as well. All of this is far away from
    the disconnected, monetized, infinitely mobile, and ultimately blind vision of
    capital we deal with most of the time.


    Severing the ties of capital from the contextual and grounded richness which it
    originated is a dangerous trick. It implies that the perception of reality through
    the current lens of capital is doubly misleading: it identifies value where it
    should and does not identify the value where it is. In 2022 the accounting books
    of corporations and investment funds, both public and private, still show a huge
    amount of monetary value related to fossil fuels. So, the main practice responsible
    for the existential threat of climate warming, severe enough to make our civilizations
