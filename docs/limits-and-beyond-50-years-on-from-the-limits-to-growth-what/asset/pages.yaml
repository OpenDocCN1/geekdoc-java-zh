    The problem of the scarce effectiveness of this kind of action is compounded by
    the so-called “Jevons paradox,” or one of its similar versions (e.g. the Khazzoom-Brookes
    postulate_). These concepts state that higher efficiency of an economic process
    does not lead to a lower consumption of resources. It is not a paradox, but a
    principle well entrenched in the systemic view of the world. The resources freed
