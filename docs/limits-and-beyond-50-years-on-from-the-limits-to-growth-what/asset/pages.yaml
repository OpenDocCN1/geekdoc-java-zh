    # Growth thinking and exceeding the limits create self-induced existential risks


    The original message of The Limits to Growth addressed two clear concepts – growth
    and limits. What did we not understand? Growth cannot continue ad infinitum because
    there are limits to the planet Earth can endure. Repurposing the original message
    means appealing to the paradox that the concept of growth is a Janus face. In
    other words, immaterial and inner growth in fact can continue, even though the
    physical growth consuming fossil energy and natural resources should be restricted.
    Cognitive, mental, and spiritual growth knows how to differentiate limits to physical
    growth from neo-growth – a new kind of growth that is based on renewables, does
    not abuse natural resources, and nurtures biodiversity. There are no limits in
    our efforts to achieve this.


    The climate change and artificial intelligence risks differ in nature but conspicuously
    share one characteristic. If the risk of one of these is realized and turns into
    an existential catastrophe, the other one longer needs to be solved. We are prisoners
    of the past and present. But we must become pioneers of the future! Breaking out
    of this prison and tackling both these risks requires nothing less than transformation
    thorough change in our relation to nature and to technology. The first is the
    renewable energy transition.—The industry has locked us to a path from which we
    should immediately detach ourselves. The answer is de-learning from generating
    emissions, continued fossil fuels use, and the abuse of natural resources. Besides
    this de-learning, we need learning to understand how to live in partnership with
    nature while not exceeding its limits.


    Doomsday rhetoric leads to a cul-de-sac. We have honestly identify and facing
    emerging threats, even existential risks. At the same time, however, there should
    be thoughtful pathways, strategies, and solutions for how to avoid, alleviate,
    or overcome such risks. Every invention or breakthrough in society will have both
    advantages and disadvantages, opportunities, and threats. We are at a watershed
    – we can'
