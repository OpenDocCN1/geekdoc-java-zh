    managed by their users, in time, rules are established for how these are to be
    cared for and used in a way that is both economically and ecologically sustainable.


    How is this miracle obtained? Ostrom proposed a series of eight rules for the
    good management of the commons, but these rules are all connected in a simple
    way: human-to-human communication. It is a concept that you may also describe
