    So, the future of civilization was to collapse. What did that mean? Is collapse
    a prediction, a prophecy, or what? Can collapse be avoided? And, if so, how?


    From the beginning of the story, there was much confusion on these points. One
    was with people who took the base case scenario as a prediction (or even as prophecy).
    But that was not, and could not, the purpose of the study: no model can predict
    the future over a span of more than a century. The LtG report was intended to
    provide a range of scenarios describing the outcomes of different assumptions
    and policy choices. What if natural resources are more abundant than we think?
    What if there is a technological breakthrough in energy production? What if humans
    were able to stop population growth?


    Over three different books on the same subject that used the same methods, it
    is impossible to describe all the details, but the main results can be summarized
    as:


    +   1. Collapse is a robust feature of all scenarios that involve reasonable assumptions
    for the parameters and also that the exploitation of natural resources would continue
    with economic growth as objective.

    2. Technology can remove collapse from the results only with extremely optimistic
    assumptions, such as assuming, at the same time, infinite energy and zero pollution.
    This is an approach that the LtG authors called “infinite-in-finite” (IFI-IFO).

    3. Pollution is an important factor in causing collapse, but its effects usually
    arrive after resource depletion has already set the world economy toward a declining
    trajectory.'
