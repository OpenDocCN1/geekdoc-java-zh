    > The Limits to Growth has made headlines the world over. Its shock waves have
    caused our most cherished assumptions to come crashing down. It is a book that
    we can ignore only at our peril. If this book does not blow everybody''s mind
    who can read without moving his lips, then the earth is kaput.


    But it is true that the LtG book generated a heated debate. In several respects,
    it was a normal reaction. Science itself is a complex adaptive system and it tends
    to react to external perturbations by maintaining its homeostasis. When faced
    with a new, revolutionary idea, the first reaction may be enthusiastic, but if
    previously cherished assumptions are challenged, then a rejection may follow.
    It is not a bug of science; it is a feature. It is a pattern that filters out
    the bogus ideas that periodically emerge out of scientific research. Already by
    the time of Darwin, in the 19th century, Thomas Huxley (who liked to be defined
    as "Darwin''s bulldog") said, "It is the customary fate of new truths to begin
    as heresies and to end as superstitions."


    The problem is, what is a genuine innovation (truth) and what is a fad (heresy)
    that will soon disappear? Errors are always possible, and the job of the scientific
    debate is to discover and correct them. The problem is not just that of bona fide
    mistakes. Falsified data and other scams are a plague in some fields of science.
    Reading a book such as Science Fictions by Stuart Ritchie (2020) gives you some
    idea of how bad the situation is, especially in medicine, where large financial
    losses or gains are at stake.


    Scientists are human beings and not a gospel of truth. Data are always incomplete,
    affected by uncertainties, and need to be selected. Try to develop Newton''s law
    of universal gravitation without ignoring all the data by feathers, paper sheets,
