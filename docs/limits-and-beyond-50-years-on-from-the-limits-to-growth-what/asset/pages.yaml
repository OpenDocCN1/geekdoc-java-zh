  md: '# Chapter 1


    # Limits To Growth: The story of an idea


    Ugo Bardi


    Faculty Member, University of Florence


    # Summary


    In 1972, the Club of Rome sponsored the publication of a study titled The Limits
    to Growth (LtG) . It was not the first to examine the long-term trends of modern
    civilization, but among the first to do that quantitatively by means of models.
    A robust feature of the model results was that the global economic system was
    going to collapse at some moment during the first decades of the 21st century.
    The study was initially praised, then it went through a barrage of demonization
    that consigned it to the dustbin of wrong scientific ideas. Only with the new
    century a reappraisal started and, in 2011, I published a book titled The Limits
    to Growth Revisited^1, one of the first studies aimed at a comprehensive review
    of the validity of the 1972 book. Today, in 2022, the Club of Rome is publishing
    a new book that aims to tell the story of the first 50 years of the study. The
    present section of this new book is based on my 2011 book, but it is a completely
    new revisitation of the subject and tells the story of how the idea of civilization
    growth and collapse fared in history and how it was interpreted by the LtG.


    > There will come the Day of the Lord, like a thief in the night.

    — Paul’s first letter to the Thessalonians, (5,2)'
