    In our perspective, the fundamental issue of this approach is that “the map is
    not the territory”, as Alfred Korzybski put. Conventional frameworks we use to
    make sense of what happens, to identify “problems”, and design “solutions” are
    inadequate for the complexity of Life. A good example is the metaphor of war that
    we abundantly use when confronted with undesirable realities. Sometimes gives
    comfort when it designates enemies (cancer, drugs, terror, the virus...) and mobilizes
    our energies as only wars. But it is completely inappropriate to deal with the
    evolution of ecosystems of which we are part, as is the case with all the “enemies”
    mentioned above. War is the ultimate expression of separation and exclusion, and
