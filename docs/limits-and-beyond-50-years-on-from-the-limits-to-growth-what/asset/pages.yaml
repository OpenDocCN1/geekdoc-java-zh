    The task itself is rife with the thinking that produced destruction in the first
    place.

    I chose to use the word “integrity” instead of “value” because “value” is a word
    that latently beckons measurement again. Language traps its users in familiar
    grammars. Habituated ways of describing life’s days shape the perception of life
    and vice versa. David Olsen was speaking recently about the time when people used
    to say, “I am going to the market buying bread,” or “I am going outside AND picking
    peaches.” But with the literacy that came with the industrial model of the education
    system, the grammatical structure changed. It became, “I am going to the market
    buy bread,” or “I am going outside TO pick peaches.” In that shift came an expression
    of the embodied relevance of strategic linear productivity. This is, of course,
