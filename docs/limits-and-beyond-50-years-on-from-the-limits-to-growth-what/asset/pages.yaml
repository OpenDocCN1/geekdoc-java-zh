  md: 'When modeling the short-term dynamics of interaction between production and
    consumption, it is essential to include an explicit price. For example, my first
    book, The Dynamics of Commodity Production Cycles , was based on a model that
    incorporated precise assumptions about the causes and consequences of changes
    in price.


    However, long-term dynamics can be understood without including price. In this
    century, depletion will be the dominant influence on consumption. You cannot consume
    something that you don''t have, irrespective of its price. Depletion is a thermodynamic
    process. Raising the price of a depleted resource does not magically reduce its
    entropy or create more of it in the ground.


    Price changes can often stimulate the production and use of alternatives to materials
    that are becoming scarce. However, World3 groups all nonrenewable resources together
    in a single stock. Thus, it implicitly assumes that there are infinite possibilities
    for substitution.


    We therefore treated the energy fuels, coal, oil, and gas, as fungible with nonrenewable
    resources, such as copper or phosphate. Obviously, they are not. Since infinite
    substitution among nonrenewable resources will not be possible in practice, the
    projections of our model are too optimistic.


    Prices are important for understanding short-term issues, but they can be profoundly
    misleading in the analysis of longer-term problems. For example, the economic
    value of agricultural production may be increasing even while human hunger is
    growing. This paradox will occur when there is a shift from growing low-priced
    nutritional products for consumption locally to providing high-priced luxury goods
    for export – replacing cassava with roses, for example. For that reason, World3
    expresses food production in terms of calories, not dollars.


