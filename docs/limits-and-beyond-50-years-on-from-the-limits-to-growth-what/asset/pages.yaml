- img_proc: true
  md: 'worth a lot of money. Also, according to the official version, Africa is heavily
    in debt to the “developed” world. After centuries of colonization and enslavement
    this is a tragic irony, to say the least. So many arguments can be found to explain
    why the situation should be the reverse.. This is the elephant in every room where
