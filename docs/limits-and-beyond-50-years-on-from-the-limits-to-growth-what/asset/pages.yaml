  md: '# # About the Club of Rome


    The Club of Rome is a platform of diverse thought leaders who identify holistic
    solutions to complex global issues and promote policy initiatives and action to
    enable humanity to emerge from multiple planetary emergencies.


    The organisation has prioritised five key areas of impact: Emerging New Civilisations;
    Planetary Emergency; Reframing Economics; Rethinking Finance; and Youth Leadership
    and Intergenerational Dialogues.


    The Club of Rome was created to address the multiple crises facing humanity and
    the planet. Drawing on the unique, collective know-how of our 100 members – notable
    scientists, economists, business leaders and former politicians we seek to define
    comprehensive solutions to the complex, interconnected challenges of our world.


    Decades of exponential consumption and population growth have come to imperil
    the earth’s climate and life-supporting systems, while reinforcing social and
    economic inequalities and impoverishing billions globally.


    As a network of thought leaders from a rich diversity of expertise, our members
    are committed to facilitating the difficult conversations and the bold actions
    required to confront the planetary emergency facing humanity and our common home.
    Our goal is to advocate for paradigm and shifts which will enable society to emerge
    from our current crises, by promoting a new way of being human, within a more
    resilient biosphere.


    Drawing on thorough scientific analysis, the Club of Rome makes holistic proposals
    to address these immense, interconnected problems. It does so through research,
    concrete policy proposals and the convening of high-level meetings, debates, conferences,
    lectures and other events.'
