    flicker in our consciousness as a generation of young people in South

    Africa engaged in a titanic struggle for life to be a free people. Our whole

    focus was on the struggle for justice to restore our human dignity as

    indigenous people with rights and responsibilities. We were battling the

    arrogance of colonial conquest that had imprinted itself on our mindsets

    making us acquiesce to being identified as non-whites and non-Europeans

    on our own African continent. Our energies were totally committed to

    mindset change and re-embracing the ethics and values of Ubuntu that was

