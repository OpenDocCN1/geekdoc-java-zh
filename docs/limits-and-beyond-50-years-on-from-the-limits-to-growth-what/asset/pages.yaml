  md: 'able to face and solve our existential challenges? Well, besides the many arguments
    put forward by this book’s contributors to refute optimistic thesis, António Guterres
    himself answered the question three years after the above declaration. On 2 December
    2020 he spoke at Columbia University in New York and said:


    To put it simply, the state of the planet is broken. Humanity is waging war on
    nature. This is suicidal... Making peace with nature is the defining task of the
