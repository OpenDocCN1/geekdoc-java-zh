    as the Club of Rome to remind global decision-makers that we have collectively
    wasted 50 years of valuable time. Over the course of 2022 and beyond, we will
    continue to translate our thought leadership on economic transformation into action
    by working directly with governments and citizens on the minimum economic and
    systems turnarounds needed to ensure humanity survives within planetary boundaries.


    The Covid-19 pandemic has exposed the vulnerabilities of health, social, economic,
    financial, and political systems across the world and propelled us to a critical
    juncture that provides the opportunity and necessity to reshape our future and
