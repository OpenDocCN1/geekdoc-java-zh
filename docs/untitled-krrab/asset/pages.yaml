- pgno: 395
  md: 'threats. Give up the notebooks or he’d come here and ...


    And there it was. What had been bothering him.


    Notebooks. Plural. Not just the one that documented the planned attack on Montréal’s
    water. Lavigne wanted, demanded, needed both.


    But why?


    And why had Charles Langlois hidden both? Why not just the one to with poisoning
    the drinking water?


    Armand sat upright and shifted his stare from the fire to Henri, who’d been Clara’s
    model for the grey wolf, and whose immense ears now moved fully forward.


    They stared at each other for a moment before Armand got up and went to his study,
    where he sat in front of his laptop.


    He’d given the notebooks to the prosecutors, but not before making copies.


    He brought them up on his screen. Then, knowing it would be a long night, he made
    a pot of coffee, toasted some brioche, and returned to his study.


    Smelly old Red and tiny Gracie joined Henri, and the three were now curled at
    his feet.


    Charles Langlois had two notebooks. The second chronicled what he’d found in his
    investigation at the LaSalle treatment plant. That was the one he and Beauvoir
    had focused on. The one prosecutors were poring over. The one of the charges were
    based on.


    But...


    Suppose. Suppose it was the other way around? Langlois’s evidence about Montréal’s
    drinking water was in the first notebook. Terrible, terrifying. But just the beginning.
    Discovery had set the young biologist into an even deeper, dark cave.


    And he’d found something else. Something worse. Someone worse. And had chronicled
    it in the other notebook. That was why David Lavigne was demanding both books.
    It was actually the other that he most needed to destroy. The one about the lakes.


    Gamache opened that file and started reading the scanned pages. It was just random
    words, numbers. Partial sentences. But it was enough'
