- pgno: 12
  md: 'was the loft above, and Myrna Landers never left.


    She had found her quiet place in the bright sunshine. And Dr. Landers became Myrna.


    Then one day the head of homicide for the Sreté du Québec and his wife bought
    the rambling old home across the village green. He’d wandered into his shop, sat
    down, and Chief Inspector Gamache became Armand.


    The only difference, and he knew it was huge, while that she was out of those
    caves, he was still in them.


    Who had been on the other end of the phone that morning? And what had person said,
    what they wanted, that pushed this steady man so far off he found himself shouting
    in his peaceful garden on a Sunday morning?


    For his part, Armand knew he''d let rage overpower his reason. It didn''t happen
    often; he''d worked hard to disarm triggers, ones that could, in his job, have
    catastrophic consequences. He''d seen it enough often with colleagues.


    Unresolved rage and a loaded gun were a very bad combination.

    He got angry more often than most knew. You could not look at the body of a murdered
    child and not be enraged. But anger clouded judgment. It became another problem,
    not a solution.


    Though Armand Gamache was honest enough with himself to know that he had his own
    caverns, his own sinkholes. One in particular. And he''d fallen into it that morning.
    Pushed over the edge by a reasonable why, many miles away, with a simple request.


    To meet.

    To steady himself now, he took a bite of the soft, still-warm pastry, oozing dark
    chocolate. As a further balm, he looked across the patio to the Rivière Bella,
    his fresh mountain water rushing by, catching the sun and gleaming golden. It
    was calming. Meditative.


    His heart slowed and his shoulders dropped.


    Was it a mistake to answer that call?

    Why hadn''t he turned off the phone after the first ring? Why hadn''t he moved
    the phone into the study and shut the doors between it and them?

    He knew why. Because he always had intended to answer. Because he had to know.'
