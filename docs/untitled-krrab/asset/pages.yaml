- pgno: 16
  md: 'Jean-Guy’s voice on the phone brought him back to the matter at hand.


    The annoying false alarms.


    “Désolé,” said Armand. “I was distracted.” Which was true. He was now staring
    at Rosa. The duck had planted her beak in his pain au chocolat.


    “I must warn you, I think the mice have gotten into your stash of chocolate chips
    you hide from Reine-Marie.


    “Oh, good. Then you won’t miss them.”


    “Terrible man,” Armand mumbled, and heard Jean-Guy laugh as he hung up. Turning
    to Reine-Marie, he said, “Want to go to Montréal? Spend the night. Maybe see if
    Vivienne and Marcel can join us for dinner.”


    The LaPierres were the Gamaches’ best friends in Montréal. Had been since the
    day Daniel broke his leg, and Dr. LaPierre had had run across avenue Querbes to
    help the screaming child and the distraught parents.


    That had been twenty-five years earlier.


    “I’ll call, if they can meet us at Lémac,” said Reine-Marie.


    The restaurant was around the corner from their home. She could already taste
    the truffle oil salmon tartare, while Armand and Marcel would have their usual
    moules frites.


    Vivienne, a marine biologist, preferred the creamy mushroom risotto, with slabs
    of aged Parmesan. She and Reine-Marie would have Pinot Noir while the men would
    order beers.


    The decision was easy, the calls made, the dinner arranged.


    Before leaving, they stopped at Monsieur Bélveau’s General Store. For cookies.


    As they walked to their car, they passed a man heading toward the bistro. A stranger.
    Slender, elderly. In a suit that didn’t quite fit, and a tie too wide for the
    fashion of the day.


    A few paces on, Armand glanced back and saw the man had also paused, to look at
    him. Their eyes met, briefly, before they turned away.


    The man seemed vaguely familiar. He must, Armand thought, staying at the B&B.
    Reaching for the handle of the car door, he looked back again, but the man had
    already entered the bistro.


    The slightly odd thing, thought Armand as they drove out of the village, was that
    he had a warm feeling about the man. If he knew him, it was a pleasant memory.'
