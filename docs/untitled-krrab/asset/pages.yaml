- pgno: 7
  md: 'His hair was wavy and now mostly grey. It curled around his ears and at his
    collar. He needs a trim, Reine-Marie thought.


    He was tall, over six feet, sturdily built, and far more likely to be mistaken,
    by anyone who met him casually, for a professor of arcane history than for a man
    who hunted killers.


    And still the ringing continued. And the creases on his face deepened into crevices.


    He could have, she knew, declined the call. But he didn’t. He could have shut
    off the phone. But he didn’t. Instead, he allowed it to ring. And as he stared
    into the distance.


    Finally, it stopped.


    “Wrong number?” she asked.


    He looked at her. “Non. Wrong person.”


    Who must have, thought,, by mistake. Easily done. He’d done it himself.


    Yes. It was only that. A mistake. This call was not intended for him. Reine-Marie
    raised her eyebrows but left it at that.


    And then she smiled at her. And as he did, the furrows deepened. And she was certainly
    caused by pain and sorrow, stress and grief, by far the deepest impressions made
    by this smile. Like lines on a map, these charted the longitude and latitude,
    the journey of a man who had found happiness.


    Though there was the deep scar at his temple, which could cut across the other
    lines.


    Silence once again descended on the garden. After a few moments, they raised their
    sections of the weekend park and went back to reading.


    Three Pines was not on any map and was only ever found by people who lost their
    way. They’d crest the hill and stop, looking in wonderment across the top of the
    forest, to the Green Mountains of Vermont beyond the borders of Québec. Then,
    dropping their eyes, they would see something more unexpected.


    There, in the middle of nowhere, fieldstone and clapboard homes and rose-brick
    shops circled a village green. People would be walking their dogs, or working
    in their gardens, or sitting on the bench on the green. Chatting. In at least
    one case, to herself.'
