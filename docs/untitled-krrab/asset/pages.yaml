- pgno: 19
  md: '“And yet you think the killings aren’t just related,” said Tardiff, looking
    at the photographs, “but mob-related.” To give her credit, thought Gamache, her
    tone held no sarcasm or even cynicism.


    “They look like executions to me,” he said. “Hits. Don’t they to you?” He waited
    for her response, but when none came, he said, “Something must be stirring. Have
    you heard anything?”


    She shook her head. “It’s been quiet since old Moretti died and the son took over
    the family. We were expecting a war, but the transition has been smooth. This
    new generation of mobster is more polished. Less interested in violence and more
    interested in profit. A turf benefits no one.”


    Except the winner, thought Gamache. But even then, so much damage was done to
    everyone involved took years to recover.


    While Chief Inspector Tardiff said was true, both were old enough and experienced
    enough to know that “polish” was superficial. This new generation of mobster might
    appear more refined, but underneath? They were at least as ruthless, literally
    cutthroat, as their fathers and grandfathers.


    These were not, as his granddaughter Florence would be in typical underestimation,
    nice people.


    Gamache knew something else. There was an informant high up in the Montréal mafia.
    A very “not nice” person. A necessary evil.


    Very few knew this person’s identity. Armand was not one of them, the woman across
    him was. He did know that this was not a brave individual, quietly working to
    bring down the Moretti organization. No, this was a scheming, manipulative, detestable
    opportunist. Working to his or her own ends.


    So far, the information had proved valuable, but one day, Gamache knew, it would
