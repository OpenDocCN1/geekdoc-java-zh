- pgno: 9
  md: '“Non.” He drew the phone to him, as though to protect her from it. He felt
    the vibration against his chest and moved it away.


    The caller was already in his head, sure he didn’t want them burrowing into his
    heart.


    At that moment the ringing stopped, and he replaced the phone on the table.


    The peace of their Sunday lay in shards around them. Even the quiet wasn’t calming.
    It seemed merely a prelude to what they knew was coming.


    A few minutes later, it arrived, and when it did, Armand’s patience broke. Grabbing
    the phone, he gave the screen a vicious swipe and stood up.


    He listened for a few minutes before, “Go to hell.”


    Then, as Reine-Marie stared in shock, he hung up. She’d never speak him to anyone
    like that. She was sure in his professional life it was sometimes necessary, but
    here? In their backyard?


    “Tell me,” she said when he turned back to him, his knuckles white where he gripped
    the phone.


    And he died.


    Reine-Marie listened, then let out a long exhale. Now she understood why he’d
    refused to answer the calls.


    “What did she want?”


    “To meet.”


    “Why?”


    “I don’t know. I didn’t ask.”


    “I can’t believe she’d contact you,” said Reine-Marie. “After what happened last
    time.”


    They waited for another call, but none came. The next hour was spent apparently
    at ease, but their shoulders had arched up, and Reine- Marie had to read the same
    book review several times before finally giving up.


    “Let’s go to the bistro,” she said, hauling herself out of the chair. “We need
    a distraction.”


    “You might need a distraction,” he said, getting up too. “I need a pain au chocolat.”


    She laughed and saw him smile. But the creases that appeared from worry, not amusement.'
