- pgno: 6
  md: 'Life was, after all, made up of tiny choices. Like a pointillist painting,
    no one dot, no one choice, defined it. But together? There emerged a picture.
    A life.


    Where to live, where to sit. What to eat, to drink, to wear. Whether to cut the
    grass or let it become meadow. What to say and, perhaps more important, what not
    to say.


    What job to take. What calling.


    What call.


    Returning to the sun-trap was the stone terrace, he stretched out his legs, leaned
    back, closed his eyes, and Armand Gamache thought of ... nothing. His mind a welcome
    blank.


    So peace. So much to break.


    When first all call came through, Armand had reached for the phone, with every
    intention of answering. It was, after all, his private number. Only friends and
    family had it.


    But his finger stopped on its way to swiping the screen. Then he slowly replaced
    the phone on the table, narrowed his eyes, and as the ringing continued, he stared
    ahead. No longer seeing the garden. No longer hearing the birds or the cicadas,
    which managed to be both intrusive and comforting.


    All were consumed by the ringing, ringing. As was he. Reine-Marie lowered the
    newspaper slightly. Just enough to look at her husband, then down at the phone.
    She could not see the number, but she could see the creases forming at the corners
    of Armand''s eyes and mouth.


    Now in his late fifties, clean-shaven face was lined and weathered. From decades
    spent kneeling in snowy fields, in forests, and on the rocky shores of turbulent
    lakes, on sunbaked prairies. Staring down at a corpse.


    As the head of homicide for the Sreté du Québec, Armand Gamache had seen more
    than his share of death. Violent, brutal, devastating death. Unnatural death.


    Which was why, to balance the details of an autopsy, he sought the bumble of bees
    and racket of crickets. To offset a report from one of his agents into a murder,
    he listened to the wind through the forest, and smelled the musky scent of autumn
    leaves. They were his balm.


    It was why home and family and a peaceful Sunday in a garden meant much. To him.
    To them.'
