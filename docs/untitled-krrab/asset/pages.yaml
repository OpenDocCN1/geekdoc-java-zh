- pgno: 18
  md: 'The day started predictably enough.


    After coffee and croissants in the kitchen together, Reine-Marie went off to the
    archives to do some research, while Armand headed into his office at Sûreté headquarters.
    It was Monday morning, and there was the weekly meeting with his boss and other
    department heads to go over the cases still active, those he concluded, and those
    about to go to trial.


    He''d already met informally with his counterpart, Evelyn Tardiff, in Organized
    Crime. He wanted her thoughts on two murders his team was investigating, what
    he believed were mob-related executions. One in the Saguenay region, and another
    on the windswept Îles de la Madeleine.


    Organized crime in Québec went back generations, to Prohibition, when the mob
    ran booze across the border. And still did. But now it ran billions of dollars
    in drugs and arms. It had, in the intervening years, grown into a monster with
    connections to the East Coast mafia, the Big Five families. So deep were the mafia’s
    roots in construction, trucking, garbage collection, even the cheese industry,
    all of “legitimate” businesses, that the Sûreté had formed a special unit to investigate
    it.


    What troubled Gamache about the cases in both regions outside Montréal was, that
    the victims had no apparent connection to the drug trade, or prostitution, or,
    or, or. The woman in the Saguenay had worked for Canada Post. The man on the Magdalen
    Islands was a teacher on the cusp of retirement. Both appeared to be perfectly
    ordinary, peaceful lives.


    Until they were truss up and shot in the back of the head. Within a day of each
    other.


    “What do you think, Evelyn?”


    She removed her glasses and glanced for her mug of coffee. “They must have seen
    something that got them killed.”


    “Both of them? One day apart?”


    Tardiff studied her counterpart in homicide. “Are you suggesting the two are related?
    They’re thousands of kilometers apart, have no connection to each other and no
    record of criminal activity.”


    “True. And yet…”'
