  md: '# CHAPTER 31


    For reasons Armand Gamache could never understand, when it rained, the entrance
    to Sûreté headquarters in Montréal smelled like wet dog.


    They had a canine unit, but it was not kneled in the lobby. Gamache''s shoes left
    wet marks on the floor, joining all the others who''d arrived for work that damp
    August morning.


    He''d stopped at the café on the corner and picked up a fresh croissant and double-shot
    cappuccino, the scent of which near mixed with wet fur. As he waited for the elevator,
    he realized it reminded him of Henri and Fred in the bistro on rainy days.


    While others wrinkled their nose in distaste, he inhaled deeply. Once at his floor,
    the first thing Armand did was go to the bathroom to scrub his hands and face
    clean after that restaurant. As the water poured out of the tap, he took a handful
    and smelled it; then he dipped his tongue in. Though he knew that botulinum had
    no odor or taste, he still needed to do it.


    Just in case.


    Nothing. Yet.


    Standing at the door into the open bullpen where his officers were working, he
    again had the near overwhelming urge to shout, "Leave! Now. Take your families
    and get off the island. Run! But instead of warning these men and women it was
    his duty to protect, he stood there watching, and felt a wave of nausea so strong
    he had to steady himself. For a terrible moment, he wondered if it was from the
    tap water he''d tasted. If ...


    But no. This was a self-inflicted toxin. A guilty conscience. He shoved it away.
    It did no good and only messed with his mind. He needed clarity, needed all his
    focus. Ironically, the only way to save his agents was to keep them there. In
    the dark.'
