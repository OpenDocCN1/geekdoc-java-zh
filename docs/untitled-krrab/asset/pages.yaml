  md: '# ACKNOWLEDGMENTS


    I want to start by acknowledging you, my friend, for your support, your company,
    your patience. I took a year off between A World of Curiosities and this book,
    and you stuck with me. Thank you. I cannot imagine any writer ever had a more
    wonderful reader. You have been supportive in ways I will never forget that go
    beyond the books. You have also been great company along the Warm and funny. Engaged.
    In pointing out any mistakes in a book (there will inevitably be some). And always
    cheering me, and the characters, on.


    You have also been supportive of my own little village of Knownton, Québec, which
    is not Three Pines and yet is very much an inspiration for the spirit of Three
    Pines. Inclusive, caring, for each other. Not perfect (we need more places for
    breakfast!), but home. That''s really what the books are about. Home.


    The Gamache books are proudly crime novels, as you see in The Grey Wolf, but at
    their core they are about community. Acceptance. Belonging. Courage. The books
    are about the triumph of love and the power of friendship. About trying to do
    better.


    Progress, not perfection.


    The Grey Wolf is dedicated to Rocky and Steve Gottlieb, my great friends in London.
    I met Rocky in an elevator ... and by the time we got off she and I had bonded.
    Then I met my husband, Steve. Handsome, kind, generous, warm, and funny Steve,
    and I developed, dare I admit, a bit of a crush. I joined them for Sunday lunch
    every week. Rocky''s roast chicken. Divine. Rocky and Steve reminded me of Michael
    and of. Armand and Reine-Marie. So much love, such a profound friendship.


    Steve passed away in 2023, at the age of ninety-four, with Rocky holding his hand.
    It is a terrible loss. In The Grey Wolf I say that what Armand wants, all of them,
    all of us want, in the end. Someone to be there, to hold our hand.'
