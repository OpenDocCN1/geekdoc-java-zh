- pgno: 11
  md: 'She was one of Armand’s favorite poets, if not favorite people. Though he had
    to admit, she was close there too.


    “So who was on the phone?”

    “It was no one.”


    Myrna Landers, the owner of the bookshop, sat beside her best friend, the painter
    Clara Morrow. Olivier and Gabri, the owners of the bistro, had joined them.


    “Jesus, you must really hate it when no one calls,” said Ruth. “Four times in
    a row. The way you shouted.” She looked knowingly at the others.

    “At no one.”


    Now they all, as though choreographed, tilted their heads and looked at him.


    Really? Myrna thought. Armand was shouting.


    Like everyone else, she’d see him on the news being hammered by reporters, fielding
    accusations of incompetence, corruption. One blogger in a particular, young woman,
    reality had it in for.


    But Chief Inspector Gamache kept his head, his answers measured and thoughtful.


    She could not imagine Armand shouting.

    What would provoke that? Who would provoke that?


    Myrna Landers knew the Gaches wells. They’d often wander into her bookstore to
    browse, pulling new and used books from the shelves and glancing through them
    until something caught their interest. But sometimes Armand would come by on his
    own. On snowy winter days they’d sit by the stove, sip strong tea, and share confidences.


    He’d tell her what it was to crawl into sick minds, moving deeper into dark caverns
    until he had the answers needed. Until he had a killer.


    And she’d tell him what it had been like to be Dr. Landers, a senior psychologist
    specializing in criminal behavior. Until one day she wandered deep into a cave,
    and got lost. She needed to find her way back to the sunshine. To a world where
    goodness existed.


    She’d quit her job, packed up her small car, and left the city, without a particular
    destination in mind. Just, away.


    Stopping in the unexpected village for a break, she went into the bistro, had
    a café and a croissant, discovered the shop was for rent, as'
