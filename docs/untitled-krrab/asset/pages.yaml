  md: '# CHAPTER 2


    “What was that about?” asked Ruth, joining them on the back patio of the bistro,
    in the shade of the tall maples.


    “What do you mean?” asked Myrna.


    “The phone calls.” The old poet jabbed a crooked finger at the Gamaches. “The
    racket went on all morning. I almost called the cops.”


    “You do know Armand is the police,” said Clara, brushing a hand through her wild
    hair and looking surprised when a licorice allsort fell out.


    No one else was surprised.


    She ate it.


    “Don’t tell me you believe that bullshit?” said Ruth. “Like Clouseau could possibly
    be a senior officer with the Sûreté. Next you’ll be saying the library is a bookstore,
    and these two are married.” She pointed to Olivier and Gabri. “Like’s even possible.”


    “Hag,” muttered Gabri, putting a pain au chocolat in front of Armand and dragging
    a chair to join them.


    “Fag,” muttered Ruth, sliding the plate over and sticking a bony finger into the
    middle of the pastry, as though it were a country and her finger a flag.


    Armand sighed, then smiled when Olivier placed a second pastry in front of him.
    “Merci, patron.”


    Then Ruth was staring at him, expecting an answer.

    Ruth Zardo. The poet. The laureate. Who from her ramshackle home in this little
    village managed to see things others did not.


