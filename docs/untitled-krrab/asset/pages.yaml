  md: '# CHAPTER 1


    The phone rang. Again.

    It was the fourth time in eight minutes.

    All from the same number. All ignored by the head of homicide for the\ Sûreté
    du Québec. In the hopes it would go away.

    But like most things ignored, it just got worse.

    The first peal had interrupted the peace of the Gamaches'' back garden this Sunday
    morning in mid-August, in the Québec village of Three Pines. It broke into Armand''s
    thoughts as he sat on the fieldstone terrasse, absently brushing croissant flakes
    from his shirt and sipping café au lait.


    While Reine-Marie read the paper, his section lay folded and warming and gathering
    crumbs on his lap. He tilted his head back slightly to the sun, taking a deep
    breath of the late-summer air. He then contemplated the bobbling black-eyed Susans
    and the morning glories and sweet pea and purple Jackmanii Superba clematis climbing
    the fence that separated them from the mad poet next door.


    It was a lovely, though ineffective, barrier. Barbed wire would have to be added.

    Actually, the duck was the menace. Thank God Rose seemed to have forgotten that
    she could fly. Or, more likely, she simply chose not to.


    * * *


    Paper read, or ignored, and mugs in hand, they strolled down the dew-glistening
    lawn, past the huge maple with the swing for the grandchildren, pausing now and
    to examine the perennial beds, until they reached the point where their property
    ended and the rest of the world began.


    This was the Gamaches'' Sunday ritual. In lives so unpredictable, they found sanctuary
    in certainty. Even if just for a moment.'
