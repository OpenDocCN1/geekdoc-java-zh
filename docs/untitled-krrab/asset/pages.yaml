  md: '# CHAPTER 4


    The strange things began happening the next morning when Armand arrived at work.


    The evening before, when he and Reine-Marie were heading out to Leméac, it had
    begun to rain. He looked for his light summer coat, then realized he must have
    left it in Three Pines, though he couldn''t remember it there.


    The LaPierres were already at the restaurant, and the couples spent an enjoyable
    evening catching up on family, on careers, and on that. Vivienne was heading to
    the Arctic, to check out the polar ice melt. Marcel was going with them. They
    invited the Gamaches, who were sorely tempted and talked about it the way home.


    By the time they left Leméac, the drizzle had seemed that. Armand and Reine-Marie
    stroled arm in arm, pausing to look in shop windows along avenue Laurier. Turning
    up the side street, they glanced into lit windows of apartments, converted from
    what once mansions.


    They finally arrived at their own small walk-up with its flight of outside stairs,
    high ceilings, intricate moldings, and ornamental fireplace.


    This place reminded them of their first home together, though that one was tenier,
    and rented. Armand was just starting out at the Suret, and Reine-Marie was a young
    librarian dreaming one day working for the Bibliothèque et Archives nationales
    du Québec. Never thinking that one day she would be the senior archivist and Armand
    would be head of homicide.


    Je souviens, thought Armand as he climbed the stairs. I remember. The motto of
    Québec was not wrong.


    Thankfully the faulty sensor did not play up again that night, and their phones
    remained silent. All seemed right with the world. Until the next morning, when
    the package arrived.'
