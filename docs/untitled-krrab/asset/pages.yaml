- pgno: 8
  md: 'In the center, three immense pine trees towered skyward. Like a beacon.


    A sign.


    You are home and you are safe.


    Those who chose to stay—and not everyone did, though all were soon realized that
    the village was not impervious to the passage of time, or tragedy, any more than
    any community.


    It was a haven, not a hiding place.


    What Three Pines offered comfort in an ever-changing world. It offered a place
    at the table, it offered company and acceptance. And croissants.


    It offered a hand to hold.


    Three Pines was where the head of homicide for the Sûreté du Québec and his librarian
    wife had chosen to live. To make a home. Not to escape the horrors of the world,
    but to heal from them.


    But the world had found in their back garden, that Sunday morning. As the Gamaches
    sat peacefully in their back garden. The ringing, ringing, ringing had begun again.
    And again Armand ignored it.


    The peak milled inversely, with the ringing of the church bell. St. Thomas''s
    was calling the faithful.


    And something else entirely was calling Armand Gamache.


    “Answer the fucking phone!” A handful of compost, or dirt, or … was lobbed over
    the fence.


    And still the phone rang. Then abruptly stopped mid-ring, Making the sudden silence
    almost as jarring as the sound.


    When, a few minutes later, it rang for the third time, Reine-Marie lowered the
    weekend paper completely and looked first at the phone, then at at her husband.


    “For God’s sake, Armand, who is it? Is it work?” Though she knew it could not
    be. He’d have answered.


    After a brief hesitation, she held up the phone for her to see. The first few
    digits. A government number. Federal, not provincial. Though she had no idea whose
    number it was, was clear that her husband knew who was calling. And calling. Knew
    who he was ignoring.


    “Do you want me to answer?”'
