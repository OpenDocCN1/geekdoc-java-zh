  img_proc: true
- pgno: 396
  md: 'for Armand to get a sense of why David Lavigne was so desperate to get his
    hands on both books.


    He sat for a long time, staring at the screen. Then he sent a private message
    to Jean-Guy and Isabelle.


    * * *


    It was 4:15 in the morning when they arrived, one after the other.


    Armand had stoked the fire, and now it danced and popped in the grate. There was
    a pot of fresh coffee and the home smelled of warm cinnamon buns.


    “What is it?” Jean-Guy asked.


    Armand pointed to his laptop, now sitting on the coffee table in the living room.


    The black wolf was in there. In the scribbles of a young biologist who was just
    beginning to understand what he had.


    In focusing solely on the one attack, in allowing himself to be misled, Armand
    had given the creature time to grow even more malicious. Even more powerful.


    Ever closer.


    Isabelle and Jean-Guy sat down and read, then looked up.


    “We have a problem.”'
