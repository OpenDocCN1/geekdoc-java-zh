- pgno: 15
  md: '“I’ll turn off the alarm,” said the young man. “But you really should

    have it fixed.”


    “Are you kidding me?” the familiar voice said. “Again?”

    We all have a hobby, mon vieux,” said Armand.

    He was talking to Jean-Guy Beauvoir, his second-in-command and son-

    in-law.

    Annie and Jean-Guy lived close to the Gamaches’ pied-à-terre in the

    Outremont quartier of Montréal. Though the young couple and their two

    children lived in the less shaky Mile End neighborhood.

    “I’ll walk over with Honoré, but I should warn you, Armand, whoever

    broke in might’ve stolen all your cookies.”

    “What cookies?”

    A few minutes later Jean-Guy called from their apartment.

    “All clear. No break-in. But can you please get it?”

    He was standing at the open doorway to the Gamaches’ small apartment,

    tone they’d bought when they’d sold the family home and moved to

    Three Pines. It was a pied-à-terre, for when they had to stay in the city

    for work, or just a nice weekend in Montréal.


    Over the years Chief Inspector Gamache had, inadvertently, become the

    public face of Québec’s provincial police. The Sûreté. Whose motto was

    Service, Intégrité, Justice.


    A motto and reality were two different things. Gamache knew that

    the vast majority of the agents and inspectors, the chief inspectors and

    detetachment commanders, did believe in service, integrity, and justice. But

    there remained pockets of corruption. And not just in the Sûreté.


    With that thought came the memory of the phone call that morning.

    From a government number. From a person he knew to be corrupt,

    though he could not prove it. Someone whose power and influence had only

    grown over the years and was now almost limitless.

    “Armand?”'
