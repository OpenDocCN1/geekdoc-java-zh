    sake, get out of this city, before ...


    But he said nothing. He’d stayed silent and drove deeper into the city, pursued
    by the words of Dr. King: In the end, we will remember not the words of our enemies,
    but the silence of our friends.


    Though, of course, they would not remember his silence. They would be dead. Because
    he’d said nothing.


    Please God, let this work.


    “I want you to find who’s behind it. What the endgame is.”

    “Profit, what else?”

    “Perhaps.”


    She looked down at her notes, then up at him. Her focus was no longer on Gamache,
    but on the assignment. And with that switch came a realization.


    “Wait a minute. These events, loosening the federal environmental limits and the
    sale of companies, are controlled by the same man. Marcus Lauzon. The Deputy Prime
    Minister.”

    “Oui.”


    He watched her take a deep breath. Her exhale flutter the paper napkin stuck to
    the tabletop.


    “You think the Deputy Prime Minister, maybe even the PM, are up to something.”


    “If they are, we need to know, and we need to know quickly. But remember, if I’m
    right, this is dangerous. At least one person who found out has been killed.


    “Can’t be more dangerous than eating here.”


    “Consider this boot camp. And that’s”——he pointed to the croissant—a live grenade.”


    He smiled at her.


    She looked at him in amazement and realized she’d never seen Gamache smile. When
