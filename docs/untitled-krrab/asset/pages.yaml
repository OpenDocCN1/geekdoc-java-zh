  md: '# CHAPTER 3


    At the first ring, Reine-Marie’s hand jerked and the blue-and-white plate she
    was holding fell, shattering on the fieldstone terrace.


    Then her own phone began ringing too. She looked at Armand, and Armand looked
    at her.


    Was it possible, he thought, his mind racing. Had the caller, infuriated by his
    response, decided to change tactics and go after Reine-Marie?


    He expected all their phones to start ringing. A cacophony, a scream. An attack.


    He had to stop this. He had to answer.


    As he swiped accept, he stood up and walked to the grassy verge of the river.
    Reine-Marie’s phone stopped ringing. She too had answered.


    “What do you want?” he demanded.


    “Chief Inspector Gamache?”


    “Oui.”


    “This is the alarm company. A sensor has gone off at your home in Montréal. Would
    you like me to send a car?”


    Armand felt a wave of relief, and a slight hysteria bubble up. “Un instant, s’il
    vous plaît.” He turned to Reine-Marie. “The alarm?”


    “Oui.” She was too relieved. “It’s the front door?” she said into her phone. “It’s
    faulty. This has happened before.”


    “Have the motion sensors been activated?” Armand asked, returning to his call.


    “Non. Nothing. No one actually entered your home. It appears to be another false
    alarm. I’m guessing you’re not there.”


    “No. Don’t bother sending a car. I’ll have someone drop by and check.” “If you’re
    sure, Chief Inspector.”


    “I am, merci.”'
