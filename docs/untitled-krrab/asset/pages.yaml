    with murder and high treason. denied everything, though the evidence was overwhelming.


    An investigation was ongoing into other prominent political figures. The RCMP
    was in crisis and chaos, with the undeniable involvement of their now dead second-in-command
    in a terrorist plot to murder tens of thousands and overthrow the government.


    And the Sreté had not emerged unscathed.


    While Superintendent Toussaint was quickly cleared, as was the head of the Organized
    Crime division, charges were laid against Chief Inspector Goudreau, the head of
    the Sreté''s Highways division.


    It had long perplexed Gamache how an officer so ill-suited to command could be
    given such a hefty portfolio. It had become clear in recent weeks that the man
    was more than just incompetent. He was criminal.


    At least we know that Paolo Parisi brought the botulinum across the border. With
    Goudreau''s help.


    It would be helpful to know what he allowed in, wrote Armand. Or who else.


    Do you want me to do my own investigation? Quietly?


    Gamache considered, then shook his head. Early days yet. Good officers are conducting
