- pgno: 394
  md: 'But he’d understood perfectly and had simply chosen not to tell her that Clara
    Morrow had created two sculptures at his request.


    Armand had given them to Jean-Guy and asked him to place one on Yves''s favorite
    rock in Blanc-Sablon, and the other on the peninsula at Saint-Gilbert-Entre-les-Loups,
    where the Cree Chief had told the first Abbot about the two wolves.


    Jean-Guy took photos, which Armand kept framed on his desk. Of the grey wolf,
    staring out over the water. Ever watchful.


    And he’d understood something else. That his question about Parisi was far more
    important than he let on.


    That night, after lying awake for hours trying to settle the cicadas, Armand had
    finally given up and got up.


    He made a pot of tea and lit the fire. Henri trudged downstairs and slowly crawled
    onto the sofa, placing his head on Armand''s lap. Little of Armand''s eyelids
    grew heavy. He put down the mug of tea, and his head fell back as he drifted off
    to sleep.


    He woke up with a start, to find Henri bolt upright, staring at him. He’d had
    another nightmare. Again, about the damned notebooks.


    Lavigne threatening him with the slaughter of his family and more if he didn’t
    give up. It was obvious why he needed them. Charles Langlois had documented, in
    a way that was complete and utterly damning, the whole plot. Not by foreign terrorists
    at all, but domestic. By the Deputy Prime Minister.


    If their became a pot of Lauzon in power was to succeed, David Lavigne needed
    to destroy those notebooks.


    Once again, in his dream, he told Lavigne where to find them. Once again, he woke
    up screaming.


    Armand dropped his face into his hands and rubbed. If this was the easiest of
    the nightmares, he was in big trouble.


    He sat in the dark and peaceful living room in Three Pines and stared into the
    embers of the fire. And forced himself back to the treatment plant.


    The gun was pressing hard to his head. He knew he was going to die. But it wasn’t
