    In the book I have set scenes in a place called The Mission. Many Montrealers
    will recognize that place as being inspired by The Old Brewery Mission, a remarkable
    place dedicated to helping the homeless and those in distress. It is close to
    my heart for many reasons. Though I wanted to say that “my” Mission and the real
    thing are different. For one thing, one is fictional, the other real.


    If you’d like to donate to it, you can go to missionoldbrewery.ca. I know they’d
    appreciate the help.


    In The Grey Wolf there is a eulogy near the end. I did not write it. It comes
    from late the remarkable writer Richardgames to our mutual friend Shelah Rogers,
    when her dog died. He knew the love they shared and wrote the most beauty elegy.
    Shelah then adapted his words and used them in a eulogy for her mother. And gave
    me permission to use them in the book.


    Thank you Shelag, and thanks to the huge heart and talent of the late Richard
    Wagamease.


    Once again, Ruth’s poetry is mostly that of Margaret Atwood. When Lise and Isabelle
