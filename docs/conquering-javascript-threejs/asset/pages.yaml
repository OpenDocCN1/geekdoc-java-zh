    # HARDENING AND SECURITY


    For the past few months, I''ve been working on secure code practices and attempting
    to educate the community in simple ways. Whenever it comes to the amount of insecure
    code we see on a daily basis, we all agree that “prevention is better than cure.”
    The best method to ensure the security of our code and applications is to program
    them correctly from the start. Writing secure code is not difficult or difficult;
    all that is required for the programmer to understand where to insert security
    checks. It''s only a few more lines of code, but it''s enough to protect your
    application from a vast variety of threats.


    As a result, this instalment of “How to Write Secure Code?” focuses on the cross-site
    scripting programming. In modern browsers, Content Security Policy can considerably
    lower the danger and impact of cross-site scripting attacks. Cross-site scripting
    is a flaw in which an attacker can inject unauthorized JavaScript, Script, HTML,
    or other active content onto a web page viewed by other users. A malicious script
    injected in this page can hijack the user’s session, perform illicit activities
    on their behalf, steal confidential information, or just deface the page. Cross-site
    scripting is among the most destructive and widespread attacks against Internet
    applications today. Malicious visitors can use XSS to manipulate the text and
    code on your website, which is something only you should be allowed to.


    The code below is an example of an XSS attack; the input is not sanitized and
    is fed directly into the parameter.


    ```

    String firstNameParameter=(String) request;

    getParameter("firstName");

    ```


    The user’s input is instantly saved in the local variable firstNameParameter,
    and the value is transmitted to the browser in an HTTP response without any output
    encoding. In this chapter, I’ll go through a few different types of assaults and
    methods that you may encounter on a regular basis, as well as methods for preventing
    them.


    # XSS Reflection


    It is tragic for each victim when a malicious payload is sent to a victim, they
    click on the malicious URL, giving the hacker access to their cookies and other
    data. Here’s an example of a payload that, if performed by the victim, gives the
    attacker access to their personal information.'
