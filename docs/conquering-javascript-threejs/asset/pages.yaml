- img_proc: true
  md: 'Anti-aliasing is used to smooth out the outlines of a 3D object and provide
    a cleaner finish in the final rendering – it’s incredibly efficient, but it increases
    the processor’s workload!


    We use the anti-alias attribute of our 3D rendering motor to enable or disable
    anti-aliasing:


    ```

    //Enabled

    renderer = new THREE.WebGLRenderer({ antialias : true

    });

    ```


    ```

    --Disabled

    renderer = new THREE.WebGLRenderer({ antialias : false

    });

    ```


    Deactivating anti-aliasing is a quick and easy approach to improve the performance
    of our Three.js project.


    # LIMITING THE RESOLUTION OF 3D RENDERING


    Another simple technique to improve the performance of our Three.js application
    is to reduce the resolution (number of calculated pixels) during 3D rendering.
    This procedure is very effective, although there is a significant loss in graphic
    quality. I recommend that you employ this strategy only as a last resort. We’ll
    use our 3D rendering engine’s-PixelRatio method to lower the resolution.


    ```

    //Base value

    renderer.setPixelRatio( window.devicePixelRatio );

    ```


    It is possible to reduce the amount of calculated pixels by changing the pixel
    ratio, consequently changing the final resolution. As a result, we’ll increase
    the resolution of our 3D rendering by a factor of 2.5:


    ```

    //Lower résolution

    renderer.setPixelRatio( window.devicePixelRatio * 2.5

    );

    ```


    As you have seen, the increase in fps (from 24 to 60) is tremendous, but the graphic
    quality has suffered significantly.'
