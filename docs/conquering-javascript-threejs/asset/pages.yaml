  md: '# 58 Conquerng JavaScript. Three.js


    # BUILDING APPS WITH Three.js


    Three.js is described as "an easy to use, lightweight, cross-browser, general
    purpose 3D toolkit" in the project description on GitHub.


    Three.js makes drawing 3D objects and models to the screen simple for us developers.
    We''d have to connect directly with WebGL without it, which, although not difficult,
    can make even the simplest game project take a long time. A "game engine" is traditionally
    made up of several components. Unity and Unreal, for example, not only provide
    a mechanism to render things to the screen but also provide a slew of other capabilities
    like networking and physics.


    Three.js, on the other hand, has a more constrained approach and excludes features
    like physics and networking. However, because of its simplicity, it''s easier
    to learn and more efficient for what it does best: drawing-objects to the screen.


    It also includes a wealth of examples that may be used to learn how to draw a
    variety of objects to the screen. Finally, it allows us to load our models into
    a scene and in native manner.


    If you don''t want users to download an app from an app store or install anything
    in order to play your game, Three.js could be a good solution. If your game is
    browser-based, you have the lowest entrance barrier, which can only be a good
    thing.


    # DESIGNING GAME WITH Three.js


    In this section, we will explore Three.js by creating a game that incorporates
    shaders, models, animation, and game logic. The idea is very much straightforward.
    We''re piloting a spacecraft that blasting across sky as a planet, and our mission
    is to collect energy crystals. We must also keep track of our ship''s health by
    collecting shield boosters and avoiding too much damage from the rocks in the
    scenario.


    The spacecraft returns to the mother spacecraft in the sky at the end of our journey,
    and if the player selects NEXT LEVEL, they are given additional chance, this time
    with a longer path for the spacecraft to fly through.


    As the user progresses through the game, the spacecraft speed rises, forcing them
    to work harder to avoid rocks and acquire energy crystals. To make such a game,
    we must first answer the following questions:


    +   - How can we propel a spacecraft ship ahead indefinitely across a body of
    water?'
