  md: '# HOW DO YOU INCORPORATE Three.js


    There are a variety of ways to include Three.js into projects; some are straightforward,
    while others are more involved; nonetheless, they all require us to include one
    of the following files in our project:


    +   - Three.js,

    - three.min.js, and

    - three.module.js.


    These are all available on the Three.js GitHub website.


    ![](img/d84863281d16c607bfdc3c15da31568d_23_0.png)


    Preview of GitHub website for Three.js.


    Approach 1: (download the entire Three.js project): The simplest method is to
    simply download the entire Three.js project to your computer and use the files
    from there. The newest version of Three.js can be found on its GitHub page. When
    you''ve finished downloading it, open it and search within the builder folder
    for the three scripts.


    Approach 2: (using NPM or YARN, install the Three.js package): On NPM, Three.js
    is also accessible as a package. This implies that if your computer Node.js and
    NPM installed, you can open a command line and type:


    ```

    npm i three

    ```


    Then, by referring to the three packages, you may import Three.js from the three.module.js
    file into your JavaScript file: (“Introduction to Three.js – GeeksforGeeks”)


    ```

    import * as THREE "three";

    ```'
