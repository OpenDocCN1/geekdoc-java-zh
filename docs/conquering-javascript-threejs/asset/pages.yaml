    Let''s make some helper properties to aid in the scene creation.


    +   - Declare a camera variable of type perspective camera: it produces a three-dimensional
    image in which objects in the distant appear smaller than objects up close. A
    frustum is defined by the Perspective Camera.

    - Initialize a geometry variable with a getter function to get the canvas element.

    - Create a material variable that will be used to load the texture image.

    - As seen below, initialize the code and declare the renderer and scene.


    # What Is the Definition of Geometry?


    A geometry is a rounded shape like a box that we''re creating. A geometry can
    be created from vertices or a preexisting geometry can be used.

    The most basic choice is BoxGeometry. All we have to set the box''s width, height,
    and depth. Other preconfigured geometries are also available. A plane, a sphere,
    a cylinder, or even an icosahedron can be defined.


    # MATERIAL MANAGEMENT


    An object''s appearance is described by its material. Texture, color, and opacity
    can all be defined here. We''re merely going to set a texture in this example.
    There are still a variety of materials to choose from. The way they react to light
    is the fundamental distinction between them. The MeshBasicMaterial is the most
    basic. This material is completely unaffected by light, and each side will be
    the same hue. However, it might not be the greatest solution. The MeshLambertMaterial
    is the most basic material that worries about'
