    ```

    import { Canvas, useFrame } from "react-three-fiber";nimport * as THREE from "three";nimport
    five from "./assets/five.png";

    ```


    We''re importing useRef, useState, and useMemo in the code above. The useRef hook
    will be used to access the mesh, and useState hook will be used to check for the
    active status of the ludo dice. The number on the dice will be returned using
    the useMemo hook. The canvas is used to draw visuals on the browser, and useFrame
    allows components to hook into the render-loop, allowing one component to render
    over another. The three packages were imported, followed by a static image of
    a ludo dice.


    The logic for our Box component will be written next. Let''s begin by creating
    a functional component and adding state to it, as seen below.


    ```

    const Box = (props) => {

    const mesh = useRef();

    const [active, setActive] = useState(false);

    useFrame(() => {

    mesh.current.rotation.x = mesh.current.rotation.y += 0.01;

    });});

    const texture = useMemo(() => new THREE.

    TextureLoader().load(five), []);

    return (

    <Box />

    );

    ```


    We construct a Box component using props in the code above and then use the useRef
    to create a ref mesh. We have done this so that we can always return the same
    mesh.


    A mesh is a visual element in a scene; it''s a 3D object that makes up a triangular
    polygon; it''s usually built using a Geometry, which is used to define the model''s
    shape, and Material, which is used to define the model''s appearance; you can
    learn more about a Mesh here; and you can learn more about the useRef hook here.


    After initializing a mesh, we need to utilize the useState hook to create a state
    for our application, we set the hovered and active states to false.'
