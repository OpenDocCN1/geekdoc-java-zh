    # Creating a Feeling of Motion


    Consider yourself in command of the chopper in real life, and you’re chasing an
    object on the ground. The thing moves at a gradually increasing speed. In order
    to stay up, you must gradually increase the speed of the chopper that you are
    in.


    If the chopper or the thing on the ground had no speed constraints, this would
    go on for as long as you wanted to keep up with the object on the ground.


    It’s enticing to apply the same standard when creating a game that follows an
    item, as we’re doing in this scenario, that is, to update the speed of the camera
    following behind the item as it speeds up in the world space. This, poses an immediate
    concern. Essentially, everyone who plays this game will do it on their phones
    or PCs. These are machines with limited resources. If we try to generate an infinite
    number of objects as the camera moves and then move the camera, we will eventually
    exhaust all available resources, causing the browser tab to become unresponsive
    or crash.


    A plane (a flat 2D object) representing the ocean must also be created. When we
    do this, we must include the ocean’s dimensions. We can’t, however, make a plane
    that is infinitely large, nor can we make a massive plane and hope that the user
    never gets enough into our level to travel off the plane. That’s bad design, and
    it seems counterintuitive that people won’t play our game enough to encounter
    issues.


    # WITH BOUNDED CONSTRAINTS, INFINITE MOVEMENT


    We keep the camera immobile and move the surroundings around it rather than moving
    it indefinitely in one direction. This has a number of advantages. One advantage
    is that we always know where our spacecraft'
