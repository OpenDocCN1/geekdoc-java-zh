    # WORK IN SI UNITS


    +   - Everywhere in JavaScript, SI units are used. You will discover that things
    go more easily if you use SI units as well. If you must use a different type of
    unit, such as inches (shudder), make sure you have a compelling rationale for
    doing so.


    SI Units


    +   - The measurement of distance is in m (1 Three.js unit equals 1 m).

    - Seconds are used to measure time.

    - Candela (cd), Lumen (lm), and Lux (lx) are the SI units used to measure light
    (as long as you turn renderer.physicallyCorrect-Lights, at least).

    - Use a scaling factor or switch to a logarithmic depth buffer if you''re making
    something on a truly epic scale (space simulations, for example).


    Accurate Colors


    Use these renderer parameters for (almost) accurate colors:


    ```

    renderer.gammaFactor = 2.2;

    renderer.outputEncoding = THREE.SRGBEncoding;

    ```


    Do the following for colors:


    ```

    const color = new Color(0x800080);

    color.convertSRGBToLinear();

    ```


    Alternatively, in the more usual example of a material''s color:


    ```

    const material = new MeshBasicMaterial({ color: 0x800080 });

    material.color.convertSRGBToLinear();

    ```'
