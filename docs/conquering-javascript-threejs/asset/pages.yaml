  md: "# Application Development III ■ 119\n\n# USING SPOTIFY'S TOP RECENT STREAMED\
    \ TRACKS\nTO DETECT AND ENCOURAGE A FAN'S AFFINITY\n\nOne of the key difficulties\
    \ I have been asked about over the years is attempting-\nto comprehend a fan's\
    \ allegiance to an artist and then ranking that\nfan among others. Many artists\
    \ aim to make fan loyalty more gamified\nin order to increase streaming, awareness,\
    \ and revenue. While there have\nbeen (and continue to be) many businesses that\
    \ seek to address this void, I\ndecided to construct something utilizing publicly\
    \ available Spotify\ndata for Hurts and their aptly called new album, Faith. All\
    \ that is asked of\nt user is that they utilize their Spotify account to log in.\
    \ Then, based on\nt recently streamed tracks, we discover their love for a certain\
    \ artist and encourage them to stream more to influence the score.\n\n# Get a\
    \ User's Favorite Songs\n\nSpotify's Web API has an endpoint for retrieving a\
    \ user's favorite artists\\and tracks. As stated by Spotify, affinity is determined\
    \ by user behavior,\nwhich includes play history but excludes activities taken\
    \ in incognito\nmode. For three different timeframes, the endpoint can supply\
    \ up to 50\nmusic and artists:\n\n+   - Long-term—Data over several years, including\
    \ all new information\nas it becomes available.\n- Medium-term—Approximately 6\
    \ months.\n- Short-term—Lasts about 4 weeks.\n\nAccording to Spotify, each user's\
