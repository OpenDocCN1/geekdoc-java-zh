  md: '# Selecting a Web Browser


    JavaScript is an interpreted language that is the basis of our Three.js applications.
    As a consequence, the browser''s JavaScript engine will unswingly implement the
    code, since there are various web browsers available in the market, and the swiftness
    of our code runs is indistinguishable to the web browser that it executes.


    The browser which has shown the excellent performance with WebGL and Three.js
    is Google Chrome.


    # The Amount of Polygons in the Scene Is Being Reduced


    The very basic and initial way of optimization process depends on the number of
    polygons used in the scene. The processor is tasked for showing the scene''s objects
    throughout each execution of the 3D rendering. During execution, the number of
    polygons to process is directly proportional to the workload. With this piece
    of code, we can modestly demonstrate the amount of polygons:


    ```

    console.log("Number of Triangles:", renderer.info.render.triangles);

    ```


    Lesser the complexity of the scene, the performance of the application will improve
    our application''s performance. We have two options for this:


    +   - 3D items are being removed from the scene.

    - Reducing the amount of polygons in 3D objects simplifies them.


    In the first example, we just need to triage the scene and delete some 3D objects.


    The work in the second situation is more detailed. We''ll simplify our models
    by removing as many faces as feasible using our 3D modeling program. For example,
    all the faces that are hidden and not visible to the camera can be removed.


    Certain programs, such as Blender, even have features for automatically simplifying
    3D structures.


    # Anti-Aliasing Is Disabled


    Deactivating anti-aliasing in the rendering engine is a simple technique to improve
    our application''s performance in return for some visible pixels.'
