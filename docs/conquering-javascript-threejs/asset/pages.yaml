  md: '# 178 ■ Conquering JavaScript: Three.js


    Let''s start by making an angular component that includes an HTML file for rendering
    the 3D object, a TypeScript file (.ts) for importing Three.js functionality, and
    a CSS or SCSS style file. To make a Cube Component, type the command below.


    ```

    ng generate component cube

    ```


    Add a canvas to our empty scene by opening the HTML file. In the HTML template,
    we may make the canvas of any size we want.

    With this tiny step completed, we can focus to the TypeScript file, where the
    real work for creating our 3D scene awaits.


    # Three.js SCENE PROGRAMING


    To use Three.js with Angular, you must first import the Three.js library into
    the cube.component.ts component, which will render the 3D object. Get the canvas
    reference added to the HTML file using:


    ```

    @ViewChild(''canvas'') private canvasRef: ElementRef;

    ```


    Cube properties include:


    +   - rotationSpeedX: x-axis cube rotation

    - rotationSpeedY: the cube''s speed on the y-axis

    - cube texture size: if you wish to add a texture to your cube, this is the size
    you should choose


    Stage characteristics:


    +   - cameraZ: camera location on the z-axis

    - fieldofview: camera near field of view

    - ClippingPlanar

    - ClippingPlane


    Near and far clipping planes are imaginary planes situated along the camera''s
    sight line at two different distances from the camera. In the view of a camera,
    only items between the two clipping planes are drawn.'
