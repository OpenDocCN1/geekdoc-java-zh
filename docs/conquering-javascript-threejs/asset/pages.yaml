    # FLASHBACK ABOUT Three.js


    Let''s go back to the 1990s, when watching videos on the Internet was a pipe dream.
    Chronos Group, a nonprofit organization, was working on OpenGL (open graphics
    library) to provide visuals on the web. Mozilla released web graphics library
    in 2006 that enabled users to access their computer''s GPU and run motion graphics
    over the web. Previously, most things were done in C and C+, and you needed to
    deal with OpenGL or DirectX, but WebGL now allows users to perform the same thing
    in JavaScript, a more current and robust programming language. You only needed
    an html canvas element. Now is the time for interactive video experiences on the
    Internet. This is when Mr. Dube or Ricardo Caballero entered the room. Three.js
    is a new JavaScript library that improves WebGL''s capabilities and allows for
    interactive video. It provides a cutting-edge API that allows developers like
    us to quickly create 3D experiences and deploy them them.


    # WHY DO WE EMPLOY Three.js?


    There are many reasons to use it; few are mentioned below:


    +   * Because Three.js is open source, we can readily inspect the source code
    and discover how it works (functions).

    * When we utilize WebGL for graphics, it doesn''t work with the majority of browsers;
    however, Three.js does.

    * The code does not require any third-party plugins to run.

    * Only one programming language, JavaScript, and, of course, HTML, are required.'
