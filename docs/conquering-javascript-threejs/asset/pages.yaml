    display the animation, 3D graphics in a web browser. This tool is basically very
    famous among the game developers; hence, it has a lot of potential for a career
    opportunity for software developers that are much more interested in creating
    a different kind of games. There are more than 100 companies that utilize Three.js
    in their tech slacks.


    # USING Three.js WITH OTHER FRAMEWORKS AND LIBRARIES


    We learned in our previous chapters to use Three.js in a simple web page with
    only three files: index.html, src/main.js, and styles/main.css. We have used this
    simple configuration to demonstrate the applications in develop chapters.


    However, outside of these secure and reassuring places, it''s becoming increasingly
    rare to see pages constructed in this manner. The web development environment
    has flourished in recent years, with what appears to be hundreds of libraries
    and frameworks for developing web apps, such as React, Angular, and Vue.js, and
    new ones emerging all the time.


    Each of these is very opinionated, with diverse philosophies and paradigms, as
    well as JavaScript extensions like JSX. That''s not even taking into account completely
    new languages like TypeScript, which are built on top of JavaScript.


    Our goal, as stated previously in the book, is to demonstrate how to create a
    real-world, professional-quality Three.js application. In a world where frameworks
    rule, it appears that showcasing our work on a simple web page contradicts this
    notion. Frankly, this isn''t the case because Three.js scenes are always presented
    within a single HTML <canvas>element.


    You may make the canvas directly in HTML if you want:


    ```

    <canvas id="scene"></canvas>

    ```


    You can also make the canvas with your favorite framework, such as React, Vue.js,
    Svelte, or even your own custom framework, and pass it over to Three.js. The majority
    of web frameworks by constructing your app from separate, modular components.
    A contact form, a drop-menu, or an image gallery are examples of React components.
    In the same approach, we''ll arrange our Three.js applications so that we end
    up with a single top-level component called a World that constructs'
