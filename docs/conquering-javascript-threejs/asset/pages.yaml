    # CORE CONCEPT


    Three.js is a free JavaScript library that lets you create and render three-dimensional
    scenarios in your browser. Three.js has a big collection of functions and a rich
    API for that. Three.js is a 3D toolkit that aims to make displaying 3D material
    on a webpage as possible. Three.js'' source code is available on a GitHub repository.
    JavaScript can be used to create GPU-accelerated 3D animations. Three.js is frequently
    confused with WebGL since it frequently, but not always, uses WebGL as a low-level
    graphics system that can only draw 3D points, lines, and triangles. To achieve
    anything worthwhile with WebGL, you''ll almost always need a lot of code, which
    is where Three.js comes in. Scenes, lights, shadows, materials, textures, and
    3d math are all handled by it, which you''d have to code yourself if you use WebGL
    directly.


    Let''s start by trying to give you an understanding of how a Three.js project
    is structured. A Three.js project necessitates the creation of a number of objects
    and their connections.


    +   A Renderer exists. This is arguably Three.js'' most important object. When
    you give a Renderer, a Scene, and a Camera, it renders (draws) the piece of the
    3D scene that is inside the camera''s frustum as a canvas.


    +   A scenraph is a tree-like structure made up of different items such as Scene
    object, numerous Mesh objects, Light objects, Group, Object3D, and Camera objects.
    A Scene object is the scenraph''s root and contains attributes such as the backdrop
    color and fog. These objects represent where things appear and how they are positioned
    in a hierarchical parent/child tree-like structure. In relation to their parents,
    children are positioned and oriented. The wheels on a car, for example, could
    be considered children of the automobile, meaning that moving and orienting the
    car''s object automatically moves the wheels. More information is available in
    the scenraph article.'
