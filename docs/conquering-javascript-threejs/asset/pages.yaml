  md: '# 26 Conquering JavaScript: Three.js


    Whatever method you use, be consistent and import all files from the same library
    version. Mixing files from multiple sources may result in duplicate code or possibly
    cause the application to break unexpectedly. All Three.js installation methods
    rely on ES modules,8 which allow you to just include the components of the library
    that are required in the final project.


    # Install Using npm


    Creates a terminal window in project folder and type: to install the three npm
    modules:


    ```

    three npm install

    ```


    It will download and install the package. Then import it into your code as:


    Option 1: Import the core library of Three.js.


    ```

    import * from ''three'' as THREE;

    THREE.Scene(); const scene = new THREE.Scene();

    ```


    Option 2: Import only the components you require.


    ```

    Scene from ''three'' is imported;

    Scene(); const scene = new Scene();

    ```


    You''ll nearly always utilize a bundling mechanism to merge all of the packages
    your project requires into a single JavaScript file when installing via npm. While
    Three.js can be used with any current JavaScript bundler, webpack is the most
    popular option.

    The three modules do not provide access to all features (also called a “bare import”).
    Controls, loaders, and postprocessing effects, among popular sections of the library,
    must be imported from the examples/jsm subdirectory.


    # CDN Installation or Static Hosting


    Without a build system, you can use the Three.js library by uploading files to
    your own web server or using an existing CDN. Because the library relies on ES
    modules, every script that it must include the type="module” attribute, as seen
    below. It''s also necessary to create an Import Map that resolves the three bare
    module specifiers.'
