  md: '# ANGULAR SCENE USING Three.js


    Three.js is a JavaScript library for creating and displaying animated 3D graphics
    in a web browser, and it''s compatible with HTML5, WebGL, and SVG.


    We''ll walk through a simple example in this session. We''ll render a 3D Cube
    and learn the principles of Three.js before integrating it with Angular.


    Set up the project.

    Node must be installed on your computer in order to follow along with this tutorial:
    Node.js.


    Install Node.js and follow the wizard''s instructions (as per 32/64 bit use).

    To begin, open your preferred terminal and create a new angular project. (If you''re
    adding Three.js to an existing project, you may skip this step).


    +   - You must first install Angular CLI before you can start an Angular project.


    ```

    @angular/cli npm install -g

    ```


    You''re ready to start building an Angular web app with the CLI. Let''s begin
    by entering the following command into the terminal.


    ```

    ng new angular-three

    ```


    We change our current directory into the project directory and install Three.js
    as a dependency by executing the following command in the terminal after the CLI
    has finished setting up the project.


    ```

    cd angular-three

    pm install — save three

    ```


    Three.js type definitions can be installed with the command below.


    ```

    npm install — save @types/three

    ```


    Three.js is now installed and ready to use in our Angular project. To see if it
    works, we''ll create a simple scene with a camera and a cube mesh.'
