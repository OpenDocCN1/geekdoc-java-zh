    # Web Server


    Any JavaScript mentioned an HTML file will run when opened directly in a web browser.
    This is how simple Three.js examples work. Due to security restrictions, you cannot
    load graphics or 3D models without first setting up a web server. You need to
    establish a local development server if you wish to run a Three.js scene with
    assets like models or textures. All of the examples in this book use a custom-built
    inline code editor within the page once you start constructing your own apps.
    Many simple web servers for development are available. These are simple to put
    up; however, they can only accommodate a small number of simultaneous visitors.
    They are, nevertheless, ideal for testing your work locally before publishing
    it. When you''re ready to launch your website, you will switch to a high-performance
    production server like Apache or Nginx (pronounced engine-x, apparently).


    These can accommodate hundreds or millions of simultaneous visitors to your site,
    but are difficult to set up. Frankly, there are numerous web hosting businesses
    that can handle this for you. When you''re ready to set up a development server,
