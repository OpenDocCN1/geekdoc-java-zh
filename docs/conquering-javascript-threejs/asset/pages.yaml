  md: '# Conquering JavaScript: Three.js


    grasp how to use vertex and fragment shaders to render your 3D geometries.


    Fortunately, there are several JavaScript libraries that wrap the WebGL internals
    and give a JavaScript API that you may use without having to comprehend WebGL''s
    most complicated capabilities. Three.js is one of the most developed and feature-rich
    of these libraries.


    Three.js was founded in 2010 and offers a huge variety of simple APIs that expose
    all of Three.js'' functionality, allowing you to quickly create complex 3D scenarios
    and animations in your browser.


    Three.js'' APIs allow you to do pretty much anything you want with it.


    # CRASH COURSE WITH Three.js


    Have you ever considered how these visuals and graphs are shown in a web browser?
    What technology is at the heart of it? Of course, employing HTML and CSS all not
    be sufficient. This task was previously completed with WebGL. WebGL (Web Graphics
    Library) is a JavaScript API that allows you to render three-dimensional objects,
    two-dimensional objects, and graphs in your browser. Users can engage with interactive
    information on webpages using the WebGL API without having to download or install
    any plugins. WebGL allows developers to access hardware at a low level using the
    OpenGL ES code.


    Mozilla Organization invented WebGL. With all of these advantages, WebGL also
    has certain disadvantages, which has led to the introduction of a free JavaScript
    toolkit called Three.js. WebGL is a very simple technology that renders basic
    objects such as points, squares, and lines. You''ll need a lot of code to do anything
    serious with WebGL, which is where Three.js comes in.


    # WHAT IS Three.js?


    Three.js is a free JavaScript toolkit for displaying images, 3D, and 2D objects
    in web browsers. Behind the scenes, it leverages WebGL API. Three enables you
    to render graphics and 3D objects on a canvas in the web browser using your GPU.
    You can also interact with other HTML components because we are utilizing JavaScript.
    In April 2010, Ricardo Cabello, computer graphics programmer from Barcelona launched
    Three.js.


    Three.js can be downloaded and the documentation can be found at https://threejs.org.
    Because it includes numerous examples and support materials, the download is fairly
    huge. Three.js'' primary functionalities'
  merge: -1
