    WRITING OPTIMIZED AND EFFICIENT CODE


    When we test our creations on older or lower-end devices while writing various
    examples and tutorials, we frequently run into many performance issues.


    BEFORE YOU BEGIN MEASURING RESULTS


    First and foremost, we must be able to assess the performance of our application.
