  md: '# Conquering JavaScript: Three.js


    of concept to deliberate 3D usage focused directly at producing a fantastic web
    experience.


    A 3D model is made up of the following elements:


    +   - Scene

    - Camera

    - Mesh

    - Lighting


    Before we directly jump onto the coding section, we must first talk about overview
    of 3D web design in brief. As the title recommends, 3D web application is a website
    that is rendered in three dimensions. When constructing a 3D world, your browser,
    like any other online application, needs to know what to display and how. In this
    approach, building a scene is similar to telling the browser that you''re preparing
    your presentation. The camera establishes the user''s viewpoint and informs the
    browser of our position in relation to the scene''s center. Finally, the renderer
    instructs the browser to display the elements we''ve constructed and placed in
    our scene. The “canvas” element in HTML is used to accomplish this. It was fashioned
    to shape and show dynamic, animatable illustrations that the customer can lure.
    Individuals were not just pleased with all of that and used WebGL that helped
    in controlling the canvas in three dimensions. WebGL is a cross-platform standard
    for a low-level 3D graphics API based on OpenGL ES which is available to ECMAScript
    via the HTML5 Canvas element.


    But don''t worry if you grasp that. All we need to know is that we can make 3D
    webpages with WebGL. We should also typically considered a highly complex API
    to work in and requires enormous amounts of code to achieve very simple things.
    That what takes us to Three.js. Three.js is a JavaScript framework that acts as
    a translator between the programmer and WebGL, making it easier to write 3D code.
    It mostly accomplishes this by abstracting WebGL into a more comprehensible set
    of functions and classes. That is, as you write code in Three.js, Three.js is
    writing dozens of lines of WebGL for you behind the scenes.'
