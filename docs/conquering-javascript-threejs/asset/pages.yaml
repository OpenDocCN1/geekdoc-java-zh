  md: '# # Conquering JavaScript


    Have you ever considered how these visuals and games are shown in a web browser?
    What technology is at the heart of it? Of course, employing HTML and CSS alone
    will not be sufficient. Three.js is a free JavaScript toolkit for displaying images,
    3D, and 2D objects in web browsers that enables you to render graphics and 3D
    objects on a canvas in the web browser using your GPU (Graphics Processing Unit).


    Conquering JavaScript: Three.js helps the reader master the Three.js framework
    for faster and robust development. The book is a detailed guide that will help
    developers and coders do more with Three.js. It covers the basics in brief, and
    then moves on to more advanced and detailed exercises to help readers quickly
    gain the required knowledge.


    Key Features:


    +   - examines JavaScript specific content, with emphasis on graphics libraries

    - Discusses using Three.js for animated graphic creation

    - Provides code optimization tips and solutions


    This book is a valuable reference for Three.js developers as well as those involved
    in game development, mobile apps, progressive applications, and now even desktop
    apps.'
