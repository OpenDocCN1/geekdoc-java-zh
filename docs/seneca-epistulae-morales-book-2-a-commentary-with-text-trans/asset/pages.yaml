    # §6 The-wise man needs to prepare himself for the worst ahead of time


    In ipsa securitate animus ad dificilia se praeparet: Seneca recommends a technique
    that is known as *praemeditatio (futurorum)* malorum: the wise will foresee all
    possible evils and prepare himself for misfortune. For instance, he will imagine
    being exiled and learn how to deal in the case that it befalls him. The same applies
    to poverty; cf. Ep. 24.17, which provides a list of possible future evils. However,
    the poverty experiment goes beyond the mental technique *praemeditatio*, as it
    requires the wise man not just to imagine poverty but to physically experience
    and endure it. The praemeditatio mortis, the process of facing one''s mortality
    and becoming ready to die, is the most important technique for Seneca and is repeated
    throughout the *EM*; cf. e.g. Ep. 4.5; 12.9; 26.7–10; 30.4 and 12; 36.8; 49.9–10;
    61.4; 69.6; 70.2 and 18; 91.7; 107.4. It is important that the praemeditatio is
    exercised well ahead of time. On the praemeditatio, see the notes on Ep. 13; Hadot
    1969, 60–1, who also discusses its Stoic forners: Manning 1976; Newman 1989; Armisen-Marchetti
    2008; and Ker 2009a, 162–5.'
