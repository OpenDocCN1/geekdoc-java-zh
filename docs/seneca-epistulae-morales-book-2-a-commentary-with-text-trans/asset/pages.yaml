  md: '# Epistle 13 53


    Thus, they are able to eradicate the wrong judgements that have led to the emotions
    in the first place by training themselves to rely on reasonable judgement alike.


    Training the mind to be in control of one''s feelings is not an easy task. The
    Stoics recommend daily reflection to work on one''s emotions, the so-called meditatio.
    It takes the form of an internal dialogue, which repeats particular phrases to
    help interiorize them. Rhetorical embellishment plays an important role in these
    meditations because it makes the phrases more memorable and thus more effective
    (Newman 1989, 1478–80). One subset of the meditatio praemeditatio futurorum malorum,
    which Cicero claims the Cyrenaics invented and rarely Chrysippus had (C. Tuc.
    3.28–31 and 52); thinking about possible future events and pondering the right
    attitude towards them not only makes them less surprising and thus frightening,
    but already prepares one to deal with things to come. Their dialogical structure,
    exuberant rhetoric, and repetitiveness, Seneca''s letters are themselves meditations,
    teaching Lucilius through the letter''s example, how to tackle his emotions. Yet,
    the advice Ep. 13 is not always compatible with the Stoic practice: when Seneca
    tells Lucilius to be miserable ahead of time ($4), he decides Epicurean argument
    against it. The Epicureans argued that there is no point in making oneself miserable
    of something that might not even happen (Letter to Menocius 125 = D.I.P. 10.1025).
    Towards the end of the letter, however, Seneca falls back on the Stoic doctrine
    when he writes that Lucilius should react with indifference to whatever happens:
    tu dic ''quid porro si ueniet?'' ($14). He makes a point of ending the letter
    with both the Stoic ideal that both he and Lucilius aspire to.


    **Further reading:** Wacht 1998; Armisen-Marchetti 2008; Cermatori 2013; Diutsche
    2014; Kaufman 2014; Setaioli 2014a.


