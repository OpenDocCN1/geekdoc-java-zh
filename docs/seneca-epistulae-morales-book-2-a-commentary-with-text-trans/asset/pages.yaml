    possibly Books 1–3 (Russell 1974, 78; Lana 1991, 280–1; Fedeli 2004, 203–4) or
    Books 1–7 (Griffin 1976, 349). Three characteristics of the collection make it
    very likely that Seneca edited his letters. The first, intricate design of the
    EM is the probable of a thoughtful editing process; Seneca makes references to
    a wider audience (Ep. 8.1; 21) and thus reveals the standard he set for his own
    work; third, the collection does not contain any replies, a feature that it shares
    with collections that have been edited by the main-writer. For instance, Pliny’s
    Epistulae do not contain any replies after the book, which might be a posthumous
    compilation; on the other hand, Ferro’s Letters, which have probably been compiled
    by a later editor, contain an unusual number of replies (Gibson 2018, 226–7).


    The title of the work is mentioned for the first time by Aulus Gellius in NA 12.2.3:
    in libro enim uicesimo seco epistularorum moralius, as Lucilium consoprit. Seneca
    himself chose it (Seatiola 2014, 196). The title is deceptively simple—on the
    one hand merely describing the common denominator of the letters in the collection;
    on the other hand sweeping the announcement that the work deals with an entire
    branch of Stoic philosophy: when Seneca explains the Stoic curriculum and its
    traditional division into physics, ethics, and logic in Ep. 88.24, he uses the
    adjective moralis to describe ethics: est aliqua par philosophiae naturalis, est
    aliqua moralis, est aliqua rationalis ( The title of Seneca’s Naturales quaestiones,
    a phrase that is ‘unremarkable enough’ (Williams 2014b, 181) and is also mentioned
    in Ep. 88.24, displays a similar degree of modesty that might play the same game
    with our expectations.


    # 3. THE ADRESSEE: LUCILIUS


    All letters are addressed to Lucilius, who is also the dedicatee of the Naturales
    quaestiones and De providentia. Very little is known about Lucilius (the only
    source that is not PIR L 388), not even his full name—Seneca only mentions his
    nomen and cognomen: Lucilius iunior (QNat. 4 pr. 9). The following biographical
    data can be reconstructed from Seneca’s writings: Lucilius born in Campania (Ep.
    49.1; 53.1; 70.1), and was a Roman knight (Ep. 44.2), and was appointed procurator
    in Sicily, a position of Equestrian rank that involved overseeing the financial
    affairs in the imperial provinces (Richardson 1976, 62; Lintott 1993, 122).3


    3 For a more detailed discussion of Lucilius’ procuratio, see the notes on Ep.
    14.8 and 17, as well as the introduction to Ep. 19; other sources include QNat.
    4 pr. 1; Ep. 31.9; 45.2; 79.1.'
