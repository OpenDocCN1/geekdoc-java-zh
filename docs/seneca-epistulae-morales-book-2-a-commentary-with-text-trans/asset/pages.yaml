    # Epistle 18


    My dear Lucilius,


    It is the month of December: that is when the city is at its sweatiest. Public
    luxury has been given licence; everything is resounding with immense preparations—as
    if there were some difference between the Saturnalia and days for regular activities.
    But there is absolutely no difference—so much so, that someone said December used
    to last for a month, but now it lasts for a year.


    If you were here with me, I would dearly to talk to you about what must be done
    in your opinion: whether we should change nothing about our everyday habits or
    we should hold merrier dinners than usual and take off our togas, so as not to
    seem different from common practice. We used to change our clothing only during
    crises and times of national mourning, now we do it for pleasure and during festivals.


    If I know you well, you would act as a mediator and want not to be similar or
    different from the cap-wearing crowd in every respect. During these days in particular,
    you must be in charge of your mind so that it abstains from pleasures on its own,
    just when everyone else has sunk into it. It attains the most certain proof of
    its strength if it is not attracted to or seduced by flattery and luxury.


    The latter is much braver, that is to be dead sober among a drunken and vomiting
    crowd, but the former is more restrained: not to withdraw, not to stand out, not
    to mix with everyone but to do the same, yet not in the same way; you can celebrate
    a festival without luxury.


    If I like the testing of the mind. Let me advise you too according to the precept
