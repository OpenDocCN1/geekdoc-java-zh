    # Epistle 16


    My dear Lucilius,


    **§1** I know that it is clear to you, Lucilius, that no one can lead a happy
    life, not even a tolerable life, without striving for wisdom; perfect wisdom makes
    a life happy but blossoming wisdom makes it only tolerable. But you must strengthen
    and internalize more deeply what you realized through daily meditation: it is
    more work to stick to your resolutions than to make honourable resolutions. You
    have to persevere and add strength through constant studies until good becomes
    a good state of mind.


    **§2** Hence, when you talk to me that you need many words or such a long affirmation:
    I understand that you have made a lot of progress. I know where the things you
    are writing from; they are not made up or deceptive. But I shall tell you how
    I feel: I have hope for you by now but no confidence yet. I want you to do the
    same: there is no reason why you should believe yourself so readily. Examine yourself
    and analyse yourself in various ways and observe yourself; see to this particular:
    whether you have made progress in philosophy or in life itself.


    **§3** Philosophy is not a craft with popular appeal nor is it made for ostentatious
    display; it does not lie in words but in actions. It is not meant as a way to
    spend the day in some sort of enjoyment or to make leisure less nauseating: it
    moulds and trains the mind, puts your life into order, directs your actions, shows
    you what must be and must not be done, sits at the stern and holds course through
    uncertain waves. Without it, no one can live without fear, no one can live care-free;
    countless things happen all the time that advice you can only get from philosophy.


