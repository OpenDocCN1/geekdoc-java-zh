  md: '# The book structure


    because he applies the originally poetic technique to his letters, but also because
    he describes his future renown as the means of securing Lucilius’ memory, not
    his own memory.


    However, the collection is unlike the neat book structure it may suggest, and
    there is no single structural principle that can be applied straightforwardly
    to understand the EM (see also Schafer 2011, 35). For every structural pattern
    we detect, we find an inconsistency that contradicts it. This inconsistency is
    a typical feature of Seneca writing: it manifests itself in the general tendency
    of the EM towards longer and more complex letters, which are punctured by shorter
    and seemingly less complex letters; in the ups and downs of Seneca’s relationship
