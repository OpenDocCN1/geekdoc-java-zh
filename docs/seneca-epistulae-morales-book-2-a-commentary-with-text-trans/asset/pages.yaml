  md: '# Epistle 17


    Seneca claims that poverty provides ideal conditions for a would-philosopher because
    it provides leisure and it is free from misconceptions about external goods. It
    illustrates with four examples, showing not contending poverty is suitable for
    philosophical engagement: poverty does not necessitate any involvement in military
    actions (the example of the trumpet); it teaches how to distinguish between important
    and unimportant things (the example of the fire); it rejects pomp (the example
    of the noisy harbours), and luxury (the example of overseas expedition). Several
    elements of the examples, such as the noisy army trumpet and the exploitation
    of the sea and exotic countries, are reminiscent of the Ages of Man (c.e. Hes.
    Erg. 109–200; Ov. Met.189–112). The letter makes peaceful and self-contented poverty
    stand for the Golden Age, and ambitious and unstable wealth for the Iron Age.
    The underlying comparison between poverty and the Golden Age adds another layer
    to the complex relationship between Ep. 17 and 18 as it connects Saturnus, who
    reigned during the Golden Age, with the Saturnalia that are discussed in Ep. 18.
    An important parallel for Ep. 17 is Ep. 90, in which Seneca describes the similarities
    between a philosophical life and the simple lifestyle of the Golden Age in detail.
    Seneca makes clear that the Golden Age did not see any wise men; the behaviour
    of those living in the Golden Age may resemble virtue, but was unformed by any
    knowledge of virtue and therefore there was no virtue in the Golden Age—compare
    Ep. 90.46: omnis qui utirtuis habet similia quaendam uita uitas non contingent
    animo nisi insito et edoct ad sum assidua exercitatione perfecto.


    ista dilatione: Seneca dismisses Lucius wish to bring his financial matters into
    order as act of procrastination (see $1) and implies that philosophy might provide
    immediate help (see also). That Seneca takes procrastination and his deesseis
    varying motivation into consideration is one of the aspects that make the EM seem
    authentic and convincing; procrastination is a problem that the letters to deal
    with repeatedly: c. ef. Erg. 72.2: ipsi nobis silent damus: ‘cum hoc perego, toto
    animo incumbam’ et sianc rem molestam posse, studio deabo’. The issue is addressed
    in Breu. 9.1: maxima porro itae iactura dilato et 16.4: omnis serpea rei long
    dilatio est. Procrastination plays an important role in another ego-document,
    Marcus Aurelius Meditations; the emperor repeatedly admonishes himself not to
    delay becoming a good person and putting his words into action: c. eg. Med. 2.4;
    3.4; 8.22.


    ne tibi paupertas timenda sit: Seneca and Lucius have very different ways of dealing
    with fear of poverty: while Lucius tries to amass enough wealth to enable him
    not to worry about poverty, Seneca to re-evaluate poverty.'
