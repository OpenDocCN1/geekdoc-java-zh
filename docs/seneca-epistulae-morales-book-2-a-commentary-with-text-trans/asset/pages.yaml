    # §5 Seneca asks Lucilius to imagine devices of torture and feel the horror evoked
    by them


    Seneca argues that violence inflicted by the powerful is particularly intimating
    because it has a significant effect on the senses: imagination plays a great role
    in creating fear. The sight of torture instruments is frightening because they
    display one’s future suffering (Edwards 1999, 258). Seneca asks Lucilius to envision
    them and provides a detailed and rather drastic description of the pain inflicted
    by those in power and of their use of instruments. Most 1992, esp. 401–2 observes
    that Seneca’s gruesome depiction serves the contemporary thirst for spectacle
    and theatricality. The graphic description has a cathartic effect: by visualizing
    the instruments of torture, the mind confronts its fears and defines them in order
    to overcome them (Edwards 1999, 264): “Seneca’s verbal detail in naming the parts
    of pain is parallel to his interest elsewhere on the need to know for what it
    is, in order to be able to view it with contempt”. Seneca’s detailed account of
    torture, however, is at odds with the beginning of the letter, in which he has
    Lucilius to place as little importance on his body as possible (also Edwards 1999,
    255; Courtil 2014). While exhorting Lucilius to overcome his fear, himself evokes
    fear. This strategy and contradiction are also found in Ep. 7 which Seneca warns
    Lucilius not to go to the arena but paints a detailed picture of his own vice;
    see also Ep. 16.8, which describes luxury in detail arguing luxury is demolished.
    On the recurrent motif in Seneca, see Courtil 2015, esp. 26–36; and 2014.


