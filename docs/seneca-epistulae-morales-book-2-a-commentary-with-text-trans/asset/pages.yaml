    # Epistle 14


    My dear Lucilius,


    **§1** I admit that affection for our body is innate in us; I admit that we protect
    it. I am not saying no indulgence be shown to it; I am saying that we should not
    be subservient to it; those who serve their body, who are overly afraid for it,
    refer everything to it, will serve many masters.


    **§2** We need to behave in this way: as if we ought to live for the sake of our
    body but as we could not live without it. Excessive love for it troubles us with
    fear, burdens us with anguish, subjects to insults; those who attach much value
    to their body hold the honourable in low regard. It should be treated with great
    diligence in such a way that it can be thrown into the flames when rationality,
    dignity, when loyalty demands it.


    **§3** Nevertheless, we should, as much as we can, avoid discomfort, not just
    dangers, and retreat into safety, constantly thinking about how we can dispel
    our fears. There are, if I am not mistaken, three kinds of fears: we are afraid
    of poverty, we are afraid of illness, we are afraid of the things that are inflicted
    by those who are more powerful.


    **§4** Of all these, nothing disturbs us more than someone else’s; for it is accompanied
    by great noise and commotion. The natural evils that I mentioned, poverty and
    illness, crop up silently and do not inflict fear on either eyes or ears; the
    other evil is a huge process: it carries weapons and fire and a large number of
    animals let loose on the bystanders.


    **§5** Imagine now the prison and the cross and the rack and the hook and the
    stake driven right through someone, emerging from their mouth, and the limbs torn
    by chariots pulling in different directions and that tunic anointed and woven
    with flammable substances and whatever else savagery is devised beyond these things.'
