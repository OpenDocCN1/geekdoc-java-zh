    up a thread from Ep. 14, which highlighted the importance of discipline and care
    for the body (Hachmann 1995, 135). Seneca''s detailed description of certain sports
    and his description of the milieu is at odds his condemnation of them, a contradiction
    he can also find in Ep. 14 (see Edwards 2007, 15–16). It is as if an accurate
    picture can convince Lucilius to distance himself from the physical activities
    condemned by Seneca. As in Ep. 14, there is a reference to (and subtle mockery
    by) Nero. Seneca''s critique of excessive voice training in 7 may indirectly aim
    at the emperor who was famous for his ambitions as a singer and citharod and who
