  md: '# General Introduction


    Whatever the exact relationship between Seneca''s translation and the original—an
    issue that is complicated by the fragmentary state of Epicurus''s work—Seneca
    takes great liberty in modifying Epicureanism to meet his own needs (Wildberger
    2014b; Bronowski forthcoming). In Ep. 18, Epicurus is presented as an exemplar
    that both Seneca and Lucilius embrace unequivocally because he practised poverty
    for a few days, a poverty trial that the Stoics recommended well as well. However,
    Seneca does not mention that Epicurus did the poverty trial to experience true
    through satisfying only his most basic needs; for the Stoics, it was a way of
    preparing themselves for poverty and of realizing how easily they could get used
    to deprivation. While the exercises look the same on the surface, the reasoning
    behind them is different. By emphasizing Stoicism and Epicureanism have in common,
    Seneca has to choose his material carefully and omit elements of the other school
    that do not fit the bill.


    Seneca''s adoption of Epicurus has puzzled scholars and has lent to intense debates
    about his purpose (Mutschmann 1951; Schottländer 1955; Setaioli 1988; Wildberger
    2014b; Schies 2015; Graver 2016b). In the first books of the EM, philosophy transcends
    all doctrinal: it searches for a universal truth, which to all eagerly strive
    to become good, and engages with issues that are central to everyone''s lives,
    such as death, the simple life, and the would-be philosopher''s role in society.
    Seneca''s interest in benefiting himself and his addressee cuts across philosophical
    differences. Thus, he rejects the Ciceronian approach to philosophy, which neatly
    distinguishes between the philosophical doctrines, and evaluates them (most evidently
    in the De finibus and Tusculanae disputationes); in the EM, such distinctions
    are abolished in favour of a kind of philosophy that has a strong general appeal.


    Seneca''s openness to Epicureanism is also to a large extent conditioned by certain
    characteristics of the epistolary genre, significant parallels to what we can
    find in Marcus Aurelius'' Meditations. Like Seneca, Marcus Aurelius is receptive
    to Epicurean philosophy: he repeatedly writes that the world could be the product
    of providence or the chance encounter of atoms, oscillating between the Stoic
    and the Epicurean worldview (e.g. Med. 4:3; 6:10; 7:32; for parallels and discussion,
    see the introduction to Ep. 16). In letters and notes, the privacy and self-reflection
    that are characteristic of both genres invite openness and philosophical pragmatism:
    both Seneca and Marcus Aurelius openly admit to their attraction to Epicureanism.
    Both genres are focused on moral improvement and edification, for which technicalities
    and differences between philosophical schools seem to be irrelevant. Yet, both
    Seneca and Marcus Aurelius believe that, ultimately, Stoicism is the only way
    to reach their goal, which is to become virtuous.'
