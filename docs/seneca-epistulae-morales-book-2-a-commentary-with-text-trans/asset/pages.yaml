    # $6 The memory of those who enjoy a good fortune perishes quickly


    Quosquam in medium fortuna protublit: for the same thought, Tac. Ann. 13.18–19
    and note on Ep. 19.4: ad alid lumen. The passage strongly alludes to Ep. 19 (particularly
    19.3 in which Seneca says of Lucilius: in medium te profitulit ingenii uior) and
    the role of fortune in Lucilius’ life; cf. e.g. Ep. 19.5: utinam…nec te in medium
    fortuna misset! (on the meaning of forunati and fortune, see the note above #5:
    foruntati ambo). The link to Ep. 19 turns the observation into an hominem argument,
    a heavily veiled criticism of Lucilius. Unlike Seneca, who belongs to the group
    of few talents whose memory will survive, Lucilius for the time being belongs
    to those enjoying short-lived glory. Seneca formulates the strongest and most
    appealing argument for Lucilius’ withdrawal from his office so far (for other
    arguments for his otium, see Ep. 19).


    membra ac partes: for the metaphor, cf. e.g. Cic. Fam. 5.13.3: circumspice omnia
    membra publica; Vall. 2.901: sepultis ut praediximus, bellius coalescentibus rei
    publica membris; Suet. Ang. 48. Compared to organs and limbs, governs are associated
    with the body, whereas the talents of authors and philosophers are linked to the
    head ($5: caput); the imagery reveals implicit hierarchy.


    alienae potentiae: picks up the contrast between alius and alius $2; see the note
    on Ep. 14.4: ex alia potentia. In his writings, Seneca is wholly independent from
    everyone but himself.


    gratia: takes up #5: habebo abud posteros grati but has a negative meaning as
    it denotes short-lived prestige.


    domus frequenta est: presumably by their clients; see the note on Ep. 19.4: Clientes.
    Compare Tac. Ann. 13.18 on Nero’s power: ne coetu salutantium frequentarentare.


    dum ips steterunt post ips: Seneca’s lettres puts life and death literally next
    to each other, as if the powerful were alive in one moment and in the next, creating
    a comical effect. The phrase dum ips steterunt describes that the powerful are
    alive and in power, the phrase post ips refers to their death; cf. e.g. Ep. 54.4:
    hoc erit post me quode ante teit. For a similar thought, see Ep. 19.4.


