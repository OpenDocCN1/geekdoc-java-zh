    # §13 Seneca admits that Cato the Younger should have stayed away from politics


    Seneca''s response to Lucilius'' confronts us with an unusually negative portrayal
    of Cato the Younger. His argument greatly differs from his views expressed elsewhere
    (Griffin 1968). The first half of this paragraph (quid tuis...qui uicerit) summarizes
    the most common arguments about Cato involvement in the civil war, the second
    half (ultimas...duceret) criticizes Cato in a way that is very unfamiliar in Seneca''s
    writing. However, the negative portrays makes Cato seem more human and makes Seneca''s
    argument even more powerful: if even Cato was compromised by politics how can
    anyone resist its negative influence?


