    # #10 The Epicurean garden


    Seneca leads Lucilius (and us) into Epicurus’ garden to demonstrate what Epicurean
    philosophy is really like. The mock-Epicureans Seneca describes in §9 a place
    of abundance and luxuriousness, the kepos we encounter in Ep. 21 is a place of
    frugality and abstinence (an of the Epicurean school that has already been created
    in Ep. 18): an old man greets his visitors and offers water and porridge. The
    scene (garden, old man) evokes allusions to Ep. 12, the end of the first book,
    and is an appropriate time to seal the second book of letters.


    Cum etiam hortolus et inscript uideris: the hortuli of Epicurus’ garden; the plural
    is commonly used in descriptions of the kepos (cf. e.g. Cic. De or. 3.63; Leg.
    1.39). While Seneca emphasized that hortuli are alieni in Ep. 4.10, Epicurus’
    garden is not that unfamiliar anyone in Ep. 21. The EM front Lucilius constantly
    fights with Epicureanism, making him familiar with the school.


