    # Epistle 14


    Seneca declares that humans have an innate affection for their bodies and that
    they are on protecting them. Observations on the right attitude towards one''s
    body follow (§1–2): the innate concern for one''s body does not justify treating
    it with excessive care, a hypothesis that will be discussed in great detail in
    Ep. 15. Because of our being for self-preservation, we fear most the violence
    exerted by those who are powerful (§s3). Seneca names two other fears, those of
    becoming ill or poor, yet who are vastly less significant for Ep. 14 than the
    fear of the powerful. What makes the violence of the powerful more frightening
    than all other terrifying-scenarios is its visibility (§4–6): Seneca argues the
    various forms and the sheer number of torture instruments evoke horror. They play
    tricks with our imagination, vividly demonstrating what could happen and how we
    might suffer.


    The advice Seneca gives for dealing with fear is simple: it is best to stay away
    from dangers and to avoid all comforts (§3 and 7). An elaborate comparison illustrates
    his point: the wise man will avoid danger as the cautious seamen clear from navigating
    routes and from a rough sea; in contrast, the cautious seamen seeks perils and
    disregards expert opinions (§7–8). In concrete terms, the wise will stay away
    from those who are in power or the whole populace—and from those who can harm
    him for whatever reason—whether individuals, a political group or the whole populace§9–10).'
