    the *EM*, we get a glimpse of Lucilius'' life before he engaged with philosophy
    and, possibly, before he letters with Seneca. Retrospectively, *Ep. 13* explains
    why Seneca and Seneca have a correspondence: Lucilius''* autodidactic philosophical
    efforts are replaced with more professional help from an experienced teacher.
    The letter also challenges the impression of a continuous and almost timeless
    exchange between Seneca and Lucilius, which begins medias in res in Ep.1:1: ita
    fac, mi Lucilius. The opening of the first letter suggests that it is not the
    actual beginning of the exchange but that it is merely part of an ongoing conversation.
    It seems as if Seneca and Lucilius have always exchanged letters and always changed
    by the fragmentary statement of the *EM*, which, indeed, have no real end. But
    *Ep. 13* suddenly brings the time before the *EM* into focus, giving the strong
    message that a life with philosophy is the only life worth living (a thought that
    recurss prominently in *Ep. 21*, at the end of Book 2).


    The Stoic approach to emotions was radically different from all other philosophical
    schools, and has been met with amazement and bewilderment ever since. Once labelled
    as intolerant or incapable of emotions, the Stoics were (wrongly) critized for
    suppressing feelings. That is far from the truth: the Stoics do not forbid having
    emotions and they were acutely aware that certain, instinctive reactions cannot
    be suppressed, such as grieving after an unexpected loss (e.g. *Ep. 63*). They
    believed that all emotions are the result of wrong beliefs, that is, of attaching
    value to indifferents. For instance, being afraid of losing money is a consequence
    of attaching value to wealth, which should be regarded with indifference. If feelings
    are judgements humans must be able to control them by forming the right beliefs
    and judgements (cf. SVF 3.394 = Stob. Ecl. 2.7.10b W = Ar. Did. Epitome 10b).
    For a Stoic, humans are the only beings that are in possession of reason.'
