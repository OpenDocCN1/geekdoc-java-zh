    1986a and b, the overall importance of suicide in Rome). Having carefully pondered
    whether it is possible to live according to nature (e.g. Cin. 3.60-1), the wise
    man will decide for himself whether it is right to end his life or whether it
    is better to stay alive. In order to reach a decision, he will weigh the preferred
