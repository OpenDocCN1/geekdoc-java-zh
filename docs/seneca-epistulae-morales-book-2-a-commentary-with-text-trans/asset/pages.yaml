    repare), and is contrasted with the simple and unpolished rhetoric of a philosopher;
    also see Ep. 31.1 describing Lucilius: sequere illum animum qui opt quae calcatis
    bonis ibis. The distinction goes back to Socrates and Plato, who hints at it in
    Gorgias, esp. 463a–465el (the passage defines rhetoric as a mere knack and populist
    tool) and 500a7–504e4 (the passage describes how rhetoric can be put to good use
    in the hands of a good orator), and it explains in Phaedrus, esp. 2591–274b5.


    artificium: a craft that is not for its own sake but for material gain and commercial
    interests of intellectuals; cf. Ben. 2.3.2. The letters oxidize and condemn the
    commercial interests; see Ep. 15.7; 88.1; 90.35; 108.36: qui philosophy uelum
    aquilo [sil. oratorum]...ostentation absturilet. uelum uidenael dicicerunt.


    ostentation: philosophy does not do anything for the sake of glory, nor does it
    boast; cf. e.g. Acad. pr. 2.72; Amic.; 86; Nep. Att. 17.3; rhetoric, on the other
    hand, is prone to boasting; cf. Ep. 40.8: cum illum [sil. oratorum]...ostentation
    absturilet. Seneca targets those who hide their living by teaching philosophy
    and for whom philosophy is a mere lip service; cf. Ep. 20.2: qui iuuenem et otiorum
    aures disputation uaria aut uobili detinent; the criticism can be traced back
    to Plato who satirizes the Sophists'' monetary interests and exorbitant feats
    (cf. eg. Grg. 519c–d; Hipp, maje 28b–3; Soph. 222d–224d), and is taken by Xenophon
    (cf. eg. Mem. 1.63), and Aristotle (cf. eg. Soph. El. 165a2).


    uerbis... a common topic in Seneca; cf. Ep. 6.6: Plato et Aristoteles... plus
    etiam quam quam Socrates testis; 20.2: facere docet filosofia, non dicere; 24.5;
    25.6; Ben. 2.34.2; Beat. 17.1. Passages such as this one provoked readers and
    scholars to accuse Seneca of hypocrisy on the basis that he did not seem to match
    his deeds to his own words (his notorious wealth seemed to be inconsistent with
    his repudiation of luxury in his writings). Jones 2014 has made a convincing claim
