    Ep. 18 continues and substantiates a topic that Seneca brings up in Ep. 16.8–9
    and discusses extensively in Ep. 17: poverty and the fear of poverty. Ep. 17 holds
    poverty in high regard, depicting it as a prerequisite for a life dedicated to
    philosophy and dismissing wealth atheist. If a life seems to be too radical, the
    would-wise man may be *pauper aut similis* (Ep. 17.5). As Ep. 17 teaches Lucilius
    to change his attitude toward poverty and adopt a frugal lifestyle one cannot:
    how does one change one’s attitude toward poverty? Ep. 18 provides an answer:
    by living in poverty, one’s attitude toward poverty becomes one of fearlessness.
    Seneca suggests imitating poverty ($: pauertatemitati), explaining that *pauperi
    similis* means, and to live in poverty for a limited period. The would-wise man
    will continually expand this period until he lives in constant poverty, following
    Epicurus whose frugal lifestyle is described in Ep. 21. Seneca himself tries out
    poverty for a few days, following in Epicurus'' steps and living the simple life
    he describes in this letter; compare Ep. 87.1–2 and 123.1–2 (see Inwoord 2007a
    on letters).


    The poverty test follows the same principle as the praemeditatio malorum: the
    would-wise man trains himself for the worst case ahead of time; that he prepares
    himself for poverty while he is living in prosperity, to lose his fear of poverty.
