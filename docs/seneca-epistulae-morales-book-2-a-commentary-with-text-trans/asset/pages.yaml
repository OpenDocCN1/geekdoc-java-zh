    Quod fieri in senatu: Seneca refers to the senatorial practice of endorsing and
    rejecting certain parts of the same proposal; for c.g. Cic. Fam. 1.2.1. He argues
    that the senatorial practice ought be applied to philosophy, that is, to engage
    with all philosophical schools and to choose the elements that one endorses. For
    the analogy, cf. Ot. 3.1: hoc Stoics saepe facere ostendam, non qua mihi lex diixer
