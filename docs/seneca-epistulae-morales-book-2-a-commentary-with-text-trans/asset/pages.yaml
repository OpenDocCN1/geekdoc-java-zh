  md: '# 7. SENENECA AND THE LETTER GENRE


    What distinguishes Seneca''s *EM* from other letter collections is the question
    of whether or not they are actually letters. On the one hand, they are clearly
    letters: the title indicates; so Seneca himself repeatedly calls the letters *epistulae*
    (cf. eg. *Ep.* 3.1; 10.1); the address as well as the salutation are definitive
    markers of the epistolary genre. On the other hand, the *EM* has a generic proximity
    to dialogues (see Roller 2015) and begin resembling theoretical treatises in the
    later part of the collection, so much so that Seneca has to prevent development
    actively (cf. eg. *Ep.* 89.17); Aulus Gellius gives us examples the *EM* under
    the category of miscellaneous literature. Further to that, scholars have often
    questioned the ‘epistolarness’ of Seneca’s letters in attempts to reveal their
    ‘true nature’, pointing out their essayistic design (Role 1949; Huff 1964; Coleman
    1974), hortatory, and pedagogical intentions (Habinek 1992; 2004). These attempts
    have been ultimately rejected by Wilson, who made a plea to regard ‘the epistle
    is not so much a genre as a cluster of genres’ (Wilson 2001, 186; also Wilson
    1987) and emphasized the vocality of Seneca’s letters.


    Letters received little theoretical attention in antiquity (and, until recently,
    little attention from scholarship).⁷ Demetrius *De elocution* 223–35 (first century
    BCE), C. Julius Victor’s *Rhetorica* 27 (fourth century CE), and *De formula epistolari*
    (fifth century CE), that is attributed to Libanius and Proclus (see Trapp 2003,
    323), come closest to formulating an epistolary theory. We can also find reflection
    on the nature of letter-writing in letters themselves, for instance in Cicero’s
    and Seneca’s letters. These theoretical texts differ in emphasis and content,
    but are similar in one respect, namely that they are style manuals: they do not
    so much on what a letter is, but focus on how it ought to be written. Letters
    are characterized by their brevity and simplicity—Demetrius goes so far as say
