    the usefulness of philosophy. They all go back to the same argument, namely that
    philosophy has no influence on one''s actions if there is a higher power such
    as fate, god, or chance. The interlocutor concludes that it is pointless to engage
    in philosophy or to attempt self-transformation. The line of argument is known
    as the idle argument (Hine 1981, 366–79 on the *QNat*; Bobzien 1998, 180–233 of
