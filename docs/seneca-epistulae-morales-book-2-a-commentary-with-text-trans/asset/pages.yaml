    # Epistle 13


    The opening letter of Book 2 addresses the nature and impact of fear. Seneca is
    full of praise for Lucilius, whose persistence and resistance against the difficulties
    inflicted upon him by the malevolent fortuna are honoured by way of an extended
    comparison between his efforts and a boxer’s bloody fight in the arena (§1–3).
    In order to deal with adversity, Lucilius must develop the right mental attitude:
    to be independent from opinions and be in charge of his emotions. Seneca promises
    him help (§3: auxilia), and a long discussion of how to confront his fears (§4–13).
    As to contrast his method with the topic of the letter, Seneca presents a sober
    classification of fears into three distinct categories (§5: excessive, premature,
    and unnecessary fears) and advises him in an unusually systematic manner: he briefly
    notifies those that are exaggerated by an anxious mind (§5–6) before he explains
    in greater detail that it is unnecessary to live in anticipation of one’s fears
    (§7–11) and that the letter does not offer the Stoic therapy for fears (§4 and
    14) but that opted for a ‘milder language’ (§4: lingua… sumissore). Instead of
    reminding Lucilius that the Stoics regarded almost everything as indifferent and
    believed that no one should be affected by indifferents, Seneca prefers a less
    stringent approach and tells Lucilius to stop worrying. The argumentation noticeably
    towards the end of the letter (§14–15) as Seneca introduces Lucilius to the Stoic
    remedy of complete detachment from, and to, events that are perceived as negative.
    Like all letters in Books 1–3, Ep. 13 ends with a quotation. Here, there is a
    saying of Epicurus, who is quoted in every letter of Book 2. There is no apparent
    connection between the saying (§16: inter cetera mala hoc quoque habet stabilitute:
    semper incipit uiere) and the main body of the letter.


    In some respects, Ep. 13 is a continuation of Book 1: it continues Lucilius with
    issues that are important and particularly relevant for everyday life; an exhortatory
    and non-technical manner; it presents Lucilius with a memorable saying of Epicurus
    (the first Epicurus quote appeared in Book 1 and Seneca’s decision to include
    Epicurus is still controversial in Book 2). His affiliation to Stoicism is explicitly
    mentioned for the first time in Ep. 13 (albeit in a rebuttal of Stoic language:
    non loquetur Stoica lingua in §4). However, this does not mean that Seneca suddenly
    purely Stoic thought; rather, both the first and the second book present a mixture
