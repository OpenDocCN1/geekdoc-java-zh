  md: '# The Epistulae morales: date, publication, title xiii


    Seneca himself drew attention to his own shortcomings, which is part of an elaborate
    strategy to scrutinize himself and to share his self-scrutiny with his audience
    qua his exemplum.


    The oeuvre that Seneca produced is extraordinary for its sheer volume and for
    its breadth, covering a wide range of genres, such as tragedy, satire, philosophical
    treatise, and letters. His work is among the oldest oeuvres preserved from antiquity,
    even though not all of his work survived: for Seneca mentions in Ep. 106.2 that
    he was planning to write a comprehensive study of ethics, the libri moralis philosophiae
    (see also Ep. 106.2; 108.1; 109.17), and parts of the EM are lost (Gelius forced
    a new-book in 22 in NA 22.3); other parts of Seneca''s works have only survived
    in fragments, such as De matrimonio and De immature morte; for a complete list,
    see Ferrero 2014.


    # 2. THE EPISTULAE MORALES: DATE, PUBLICATION, TITLE


    We do not know for certain when Seneca wrote the EM but we have a terminus ante
    quem, who forced suicide in 65 CE, and a terminus post quem, whose withdrawal
    from public life in 62 CE, to which he referred in Ep. 38.1: In hoc reconditi
    et fores clusi, ut prodesse pluribus possum. The collection mentions any historical
    events that can be securely dated, except Ep. 91.1, which mentions a fire that
    devastated Lyon in 64 CE: Liberalis noster nunc tristis est nuntiato incendio
    quio Lugdunensis colonia exusta est. We can therefore assume that Ep. 1–91 were
    written between 62 and 64 CE, Ep. 92–124 between 64 and 65 CE. Seneca also wrote
    the Naturales quaestiones between 62 and 64 CE (perhaps De prudentia as well,
    but the date is disputed—for an overview see Smith 2014b) works alongside each
    other (for a similar approach, Griffin 2007, which detects parallels between De
    beneficiis and the EM). Seneca himself hints at the delays involved in epistolary
    exchanges, for instance in Ep. 38.1, in which he responds to Lucilius'' exhortation
    to write letters more frequently. In Ep. 50.1, in which Seneca explains that he
    received one of Lucilius'' letters much later, raises questions about the dialogicity
    of the letters and to what extent they pay attention to Lucilius'' situation.
    Taking the references to the changing seasons at face value (Ep. 23.1; 67.1; 86.16),
    scholars have debated whether Seneca wrote the letters within a year, or two years
    (for a detailed summary of the debate, see the introduction to Ep. 18).


    Sen clearly wrote the letters with publication in (cf. Ep. 8.1–2 and 21.5) but
    when and how the work was published in the dark. The books may have been published
    separately or, a likelier scenario, in groups, quite'
