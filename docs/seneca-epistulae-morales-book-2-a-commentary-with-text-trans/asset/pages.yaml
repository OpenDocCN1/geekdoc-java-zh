    uerbis his: an emation by Watt (see Watt Watt 1994, 185). It replaces †† which
    was declared a locus deperationis by Reynolds. Its most common meaning ‘there’
    does not make sense in this context, but *ibi* can also mean ‘this way’ (TLL s.vi.
    *ibi*, 7.1146–71–2 even citing an example in Seneca; cf. *Ben.* 3.38.3). Yet,
    it is unclear what ‘this way’ might refer to, and the combination with *sic* is
    redundant. Redundant conjectures were rightly futile: Haut’s triui creates an
    otherwise unknown construction of *pudet* with genitive and infinitive; Madvig’s
    *si* and hui Seneca Lucili far-fetched. Watt’s explanation and parallels, on the
    other hand, are simple and convincing: I think *sic*, as *ibi*, is corrupt, and
    that its initial *s* belongs to the preceding word; I would read *ubis* (ie: uebis)
    his; cf. TLL 7.2.1671.81ff.) (Watt 1994, 185). Verbis his must refer to the preceding
    argumentation of the letter and is well-placed in this context.


    tecum loci: reminiscent of §4: Non loquor Stoica lingua, sed had missummore.


    tam lenbis…remediis: the remedies are the advice Seneca has given in the letter.
    they are the opposite of the harsh Stoic language Seneca dismisses in §4. The
    gentle remedies are moving away from the Stoic belief that everything is different
    but the *honestum*. Seneca goes to give more decidedly Stoic advice in the last
    paragraphs of the letter. Cf. *Pol.* 7:1: haec taem etiamunc libiorum te remediis
    diis adiuuat; Ep. 95:14: potentius uii simplicibus obstare remedia simplicia.


    folicare: ‘heal’, see OLD s v. facilo. Health and sickness are common metaphors
    to describe the wise and non-wise; philosophy is the only medicine that can cure
    the malady, see the note on §1: praceptis salutariibus.


    Alius dicat ‘fortasse non ueniet’: an implicit criticism: those not familiar with
    Stoic philosophy can merely hope and speculate that something will not happen.

    duc dic ‘qui porro, si uienet: having dismissed the Stoic advice as how Lucilius
    to take a Stoic attitude towards fear: to stay calm and Seneca now advises to
    treat any situation awaiting him with indifference. Stoics do not need to wait
