    Paragraphs 5 and 6, which list many torture instruments and describe to what effect
    they are, stand out from the letter for their gruesome detail. Seneca does not
    simply showcase a predilection for the gore, which was la mode in Neronian times
    (e.g. Fuhrmann 1968; Wessels 2014; Winter 2014; Spentz 2018), but he vividly describes
    the terror and brutality of torture. Yet, the description has a paradoxical effect:
    Seneca’s description of the different forms of punishment evokes fear, the very
    he tries to ride Lucilius of. The strategy is reminiscent of Ep. 7 in which Seneca
    advises Lucilius to stay away from the arena but paints a colourful picture of
    his visit to the games, detailing the bloodshed and the obscene reactions of the
    audience. In both Ep. 7 and 14, Seneca’s account of torture confronts Lucilius
    with possible dangers: Seneca performs an intense praemeditatio futurorum malorum
    putting imagination into words (another parallel to Ep. 13, the introduction to
    the letter). Through his writing, Seneca mentally prepares Lucilius for any possible
    scenario, and ultimately frees him from his fear by familiarizing him with the
    worst case. Hence, the depiction of the various punishments in Ep. 14 does not
    only have a deterring effect but is also a therapeutic measure of mental confrontation
    (see Edwards 1999).


    We can read Seneca’s description of the brutal potentior as a (thinly) veiled
    criticism of Nero and a comment on the political situation under him (with Griffin
    2008; Habinek 2014; Wilson 2015; for a similar reading of De otio and De quiteuitae,
    see Williams 2003, 9–10). By way of curing Lucilius from his fear, Seneca cautiously
    warns and advises him on how to deal with the dangerous emperor. It is remarkable
    that Nero’s name is nowhere mentioned in the EM, a silence that is damning (Henderson
    2004), but a few passages can be read as cryptic references to him: most famously,
    Ep. 7.5 is read as a reflection on Nero’s cruelty (agite immoralis grati quo eum
    docet esse crudlem qui potest discere; see Scarpat 1975); Ep. 15.7 probably comments
