  md: '# Epistle 19


    Lucilius was appointed procurator in Sicily by 6 (Williams 2014a, 140). The procuratio
    was an administrative office in the province and ‘not a very important post (Griffin
    1976, 350 n. 2). In the EM, Seneca humbles himself to Lucilius’ post several times,
    first in Ep. 14:8 cum peter Sicilius, triaecest fretum, then mockingly in Ep.
    14:18: fit ex domino procurator (see the note); 31:9: quae tamen omnia transiti
    procuratiunulae praet; and 43:3: tu nunc in praincia, licet intamse te, magnus
    os. WeQat. 4a pr. to a great contends Seneca’ effort of Lucilius’ procuratorship
    in the EM: while the Natural Questions portray Lucilius as being free from ambition,
    and as a procurator otiosa, the EM tries to cure him from ambition and depict
    the procuratorship as busy and full of social commitments (already noted by Griffin
    1976, 350 n. 3). Williams 2012, 105 explains the contradiction between the different
    (different) agendas of the letters and the Natural Questions, as well as Seneca’s
    effort in the QNat. to make Lucilius reflect and reconsider his ambition; on the
    parallels and differences between the two texts, see also Williams 2014a, 143–5.


    In principle, the Stoics advocated political participation in society, a view
    that found favour with the Roman ideal to excel in the affairs of the public.
    Seneca’s claim that it is necessary to live a life in seclusion, away from the
    public sphere and social exile, causes hastening in his concerns; c.g. Ep. 8:1:
    ubi praecepta westra imperant in actu mori; 68:2: nec ad onrem publicum metus
    semper nec sine uno; Ot. 14:4: Stoic uestri deunc: usque ad ultimo vitae finem
    in actu er? Seneca’s recommendation is close to that of the Epicureans, who asked
    their followers to withdraw from society, evokes a surprised reaction in Ep. 68:10:
    ‘otium inqs Seneca, commendas mihi? ad Epicureans uoes delabris? In De otio, Seneca
    gives reasons why the wise man may withdraw into otium: (1) if the state is too
    corrupt; (2) if the wise man does not have the power to change anything; (3) if
    the wise man is ill (Ot. 3.3). In Ep. 8,1, Seneca argues that his writing justifies
    his withdrawal: in hoc meconditi et fores clusi, ut de proberus possem. How realistic
    is the scenario that Seneca pants? Lucilius is actually going to give up his procurato?
    Is it possible for him to give up his career and income, and to make himself fully
    to philosophy? These concerns are expressed in Lucilius’ question quando…exibo?
    ($8). His questions, however, will not be answered in Ep. 19, as Seneca is not
    primarily concerned with the realization or the practicalities of his demand that
