  md: '# Epistle 18


    Being confronted with the decadence of the festival, Seneca wonders how and anyone
    aspiring to achieve wisdom should behave during the Saturnalia (§2–4). In an imaginary
    dialogue with Lucilius, he discusses three options for himself and would-be wise
    man. It is possible: to stick to one''s habits and not participate in any of the
    actions during the festival (§2: nihil et quotidiana consuetudine movendum; §3:
    uoptatatis solus abstine; §4: siccum ac sobrium esse); to immerse himself completely
    in the people''s customs and take part in the festival (\$2: hiliar cerandum et
    exendam togam; §4: non excerce ne insigne); or to follow a middle path as (allegedly)
    suggested by Lucilius, that to participate in the festival but not to overindulge
    (\$3: per omnia miles...per omnia dissim). In the main part of the letter (\$5–13),
    Seneca recommends an exercise to test the mind''s firmness: he asks Lucilius to
    live in poverty for a few days. The letter closes with a quotation from Epicurus
    that links anger with insanity: inmodica ira insaniam (\$14). Apart from Epicurus
    himself, who is portrayed as a glowing example of the poverty experiment in §9,
    there is no apparent connection between the letter and the quotation.


    The festivities around the Saturnalia were known for their excess, in particular
    uninhibited drinking and gambling, and their reversal of social roles: slaves
    were allowed to criticize their masters (cf. Petron. Sat. 58,2), and Roman citizens
    sported the pelleus, a felt usually worn by manumitted slaves, swapping their
    heavy todays for the lighter synthesis. In the Apocolocintosis, Seneca makes the
    recently deceased emperor Claudius and only speaks his mind (references to the
    Saturnalia can be found in eg. Apocol. 8.2; 12.2). The world seems to be turned
    on its head the weather is unusual: Rome''s citizens are sweating despite the
    cold temperatures. For Ep. 18 eleverly celebrates the festival''s inversion of
    rules. For the first time in the EM, the student becomes the teacher and vice
    versa: under giving of advice, Seneca asks Lucilius to tell him how to behave
    in December (\$2–4). The hierarchy between teacher and student is turned upside
    down as they swap their roles. Seneca later mentions that Lucilius undertakes
    a poverty trial, he essentially proposes a miniature version of the Saturnalia,
    albeit a stern version: food and drink are limited during the trial, clothes must
    be basic. Limiting himself so radically the days of the poverty experiment, Lucilius
    is meant to take on a completely different lifestyle and uphold his usual habits,
    just as the Saturnalia upheld normal life in Rome. In true Saturnalian fashion,
    the letter yet defies expectations when it portrays Epicurus, pointedly called
    ilege uoloptatis (\$9), as a role model of fraugility and praises for his mastery
    of the poverty experiment.


    There are some anecdotes and extralateral references in the EM. They are never
    mere embellishment but introduce and lead to the topic discussed in'
