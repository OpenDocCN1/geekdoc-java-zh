    # Epistle 21


    My dear Lucilius,


    $1 You believe that the trouble is the thing you wrote about? The greatest trouble
    is yourself: you are a nuisance to yourself. You don''t know what you want. You
    are better at approving what is honourable than following with it—you see where
    happiness lies but you do not dare to reach out to it. Let me tell you what is
    that it holds back (since so little-standing of it yourself); you believe that
    the things you want to leave behind are actually great. And just as you imagined
    the carefree state that you were about to enter, you were held back by the gleam
    of the life which you were about to retreat as if you were to hurl yourself into
    poverty and obscurity.


    $2 You are wrong, Lucilius: one ascends from this life to life. The difference
    between lustre and light—the latter has its own origin, whereas the former needs
    another source to shine—is the same between this life and that life: this life
    is struck by an external gleam and anyone who wants to obstruct it will immediately
    throw a thick shadow over it; life shines with its own light. Your studies will
    make you famous and celebrated.


    $3 I shall tell you about the example of Epicurus. When he wrote to Idomeneus,
    who was a civil servant in a powerful royal court, and summoned him back from
    an illusory life to reliable and unchanging glory, he said: ''If you are drawn
    to glory, my letters will make you more famous than all that you will praise and
    all that you are praised for''


    $4 Well, did he lie? Who would know Idomeneus if Epicurus had not engraved him
    in his letters? All those Parthian grandees and governors and the king himself,
    who awarded Idomeneus'' title, have been long forgotten. Cicero''s letters do
    not allow Atticus'' to perish. His son-in-law Agrippa and his grand-son-in-law
    Tiberius and his great-grand Drusus Caesar would have been no use to him; he would
    be forgotten among such great names if Cicero had not been his friend.'
