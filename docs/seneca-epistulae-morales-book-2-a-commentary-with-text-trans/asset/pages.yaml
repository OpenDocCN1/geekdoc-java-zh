  md: '# The book structure xvii


    Ultimately, the question cannot be resolved, since the references in the text
    can be read either way. Does it make a difference the EM are authentic or fictional?
    I want to present three arguments that it does not. Firstly, the letters are mainly
    concerned with Seneca''s efforts to teach and exhort; his lessons are admired
    at a historical Lucilius, a fictitious Lucilius, or a wider audience does not
    change their value or impact. The point is that the admonitions and insights presented
    in the EM are applicable to everyone, regardless of their authenticity. Seneca
    observes in *Ep.* 6 that the kind of teaching the *proficiens* receives—whether
    it is directly or mediated through writing—is secondary to the idea of moral progress.
    Secondly, the intimacy and friendships that are characteristic of the epistolary
    genre (see $7 below, ''Seneca and the letter genre'') are not subject to change,
    regardless of whether they are found in a genuine or a crafted correspondence.
    Every reader of the EM becomes friends with Seneca and automatically benefits
    from the intimacy of the letters to support his teaching. Thirdly, Seneca''s teaching
    much relies on his own strong presence in the letters. He is the, admittedly imperfect,
    example of self-examination and constant striving towards wisdom, providing orientation
    irrespective of the authenticity of the letters. However, we must not confound
    the Seneca we find in the EM with the historical Seneca; his epistolary portrayal
    is not free from a certain degree of self-modelling and modification, as Wildberger
    2014b has shown.


    # 5. THE BOOK STRUCTURE


    The EM comprise 124 letters, which are organized in two books; a perhaps substantial
    part of the collection has been lost (Reynolds 1965, 17). The book division was
    already known in antiquity (cf. Gell NA12.2.3). While there are clear demarcations
    between the early books, information on the divisions between later books is lost,
    in particular in Books 11–13 and 17–18. The books contain between three and twelve
    letters of varying length, yet the number of letters is not proportional to the
    length of the books; thus, Book 4 is among the shortest books but contains, like
    Book 1, the largest number of letters (twelve).⁴ Two is in the middle range.


    While it is evident that Lucilius'' progress (and, implicitly, Seneca''s) is the
    narrative that spans the whole corpus, its finer structure is a matter of debate,
    in particular whether or not the book structure is relevant. Cancik 1967 argued


    > ⁴ The shortest book is Book 16, which contains five letters (*Ep.* 96–100);
    the longest books are 19, containing eight letters (*Ep.* 110–117), and 20, containing
    seven letters (*Ep.* 118–24).'
