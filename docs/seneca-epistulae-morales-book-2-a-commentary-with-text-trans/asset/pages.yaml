    Certainly, Seneca''s own experience of pain and illness has informed Ep. 15 and
    shaped his interest in exercise and well-being. Seneca seems to have suffered
    from bouts of ill health as a child and as an old man: in Helu. 19.1–2, he recounts
    his maternal aunt took him, a sickly child, to Egypt for a long period of convalescence;
    in Ep. 78.1–2, he tells Lucilius how he was considering suicide as a man because
    of his health; Ep. 54 describes in detail that he suffers from asthma attacks,
    which recur in Ep. 65.1; in Ep. 67.1–2, he has to stay in bed when he feels cold
    and in Ep. 104.1–2, he can feel a fever coming up him. Repeatedly, the letters
    describe Seneca as an old man, who has to endure the physical decline that comes
    with old age; c.g. in Ep. 12 and 26 (on the link between old age and the letter
    genre, the main attraction introduced$). However, he sticks to a rigid regime
    which he sees running and taking cold baths (Ep. 83.4–5) and which, in agreement
    with Ep. 15, does not take much of his time (Ep. 83.3). Seneca never emphasizes
    that spiritual health and healing are independent from physical well-being, as
    in Ep. 67.2 where he is bedridden and then has the time to read and write. Illness
    provides not only an opportunity to reflect but an opportunity to prepare oneself
    for death (Ep. 54.4–5) and, thus, to make one''s mind stronger and, ultimately,
    healthy.


