    # §6 Seneca avoids further discussion and exhorts Lucilius to engage in philosophy
    nevertheless


    Ultimately, Seneca avoids answering the interlocutor’s accusations and postpones
    a detailed discussion to an unspecified point of time—a promise he is never going
    to fulfill. There are passages in determinism and free will come upon (cf. e.g.
    Ep. 107.9–12), but the issues are never discussed in detail.


    Sed non est...transeundum: cf. Ep. 13.6 (sed postea uideimus). The expression
    non...nunc suggests that Seneca will discuss the issue of determinism and moral
    responsibility elsewhere; also Qnat. 2.38.3: cum ita re agetur, dicam quandquam
    mandato fato aliquid sit in hominis arbitrio. However, there is no discussion
    in his works (Wildberger 2006, 320–1; Setaioli 214ab, 2077). The repeated announcement
    of a more thorough treatment of fate and free will led Mazzoli 1977 to the assumption
