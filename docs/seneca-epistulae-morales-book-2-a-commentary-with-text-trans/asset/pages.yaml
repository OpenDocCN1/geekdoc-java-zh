    he brings forward: first of all, Seneca is not a sage and therefore does not live
    up to the ideal described in his works ($18); secondly, the Stoics distinguish
    between preferred and dispreferred indifferents, with wealth clearly belonging
    to the former ($21–22); he does not regard wealth as a good and is not dependent
    on it ($24). It is of importance that Seneca does not only discuss the accusations
