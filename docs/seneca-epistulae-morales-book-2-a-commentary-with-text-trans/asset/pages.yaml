    # Epistle 15


    Of all the letters collected in Book 2, Ep. 15 gives the most specific advice:
    it details different exercises for both body and mind and tells Lucilius which
    to avoid and which to. However, reading the letter as a sports manual would be
    superficial; rather, the letter discusses the mind''s supremacy over the body
    and advocates exercising moderation in all aspects of life, including physical
    training.


    The letter opens with the conventional epistolary greeting si uales bene est,
    ego ualeo. Regarding it as a matter of the past, Seneca is quick to give it a
    philosophical spin as he rephrase it with si philosophis bene est ($1). The discussion
    of epistolary conventions seamlessly leads to the main topic of the letter, namely
    what constitutes a healthy life. Seneca dismisses different kinds of physical
    exercise as unsuitable for learned men: bodybuilding and exercise that aims at
    increasing the muscles and the body ($2), as well as exercise that aims at weight
    loss and the rigid diet that goes with it ($3). Instead, one ought to engage with
    lighter exercise, such as running, weight-lifting, and jumping, none of which
    take up much time or require a professional coach ($4). Seneca also recommends
    exercise of the mind but does not specify what they ($5) and goes on to about
    exercise that is good for both body and mind, such as walking, an outing on a
    litter, and voice training ($6–8). As all the other letters before, Ep. 15 ends
    with a quotation from Epicurus. The maxima ultima u ingrata est, trepada; tota
    in futurum tertur ($9) may not bear any obvious resemblance to the rest of the
    letter (besides the verbal repetition of stulta in $2), yet Seneca''s interpretation
    of the maxim lays open its connection to the letter: excessive exercise, dieting,
    and voice training all lack moderation. When Seneca tells Lucilius to restrain
    his ambition and be content with what he has ($10–11), the letter ends on an Epicurean
    note, emphasizing the strict limiting of desires.


    More than the other letters in Book 2, Ep. 15 seems to zigzag from point to the
    next, giving the impression that a structure or an argument is, best, least, and
    at worst, non-existent. In particular $7–8, which Seneca speaks about voice training,
    seeming peculiar: what does the voice to do with physical exercise? The fact that
    the letter is fraught with difficulties—which is not surprising given that the
    letter''s vocabulary is in places highly technical—further reinforces this impression.
    Yet, there is a red thread that runs through the letter: as mentioned above, one
    of the letter''s main concerns is lack of moderation, which is exemplified by
    exercise, diet, and voice training. There is also a link between fitness and vocal
    exercises: the Romans believed that the training of the voice benefited one''s
    general well-being and health.'
