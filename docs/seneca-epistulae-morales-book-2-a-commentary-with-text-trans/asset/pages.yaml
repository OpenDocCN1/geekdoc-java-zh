    # #8 The voice is an instrument that should not be exercised for its own sake


    The paragraph concludes Seneca''s observations on the right exercise, particular
    of the voice. He emphasizes two aspects: moderation and purpose. First, it is
    important to adjust the volume of one''s voice (modo uhehentius...modo lentius)
    and avoid abrupt changes in volume and pitch (descendent, not decid). Second,
    the vocal exercise is not to be a purpose in itself but is supposed to be training
