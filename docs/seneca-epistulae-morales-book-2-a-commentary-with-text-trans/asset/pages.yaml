    is right (see Wildberger 2006, 339). The will is preceded by assent: the mind
    must give its assent and keep it alive in order for develop. Hence, assent is
    both punctual and processual: it includes both the initial decision and the holding
    on that decision (see Wildberger 2006, 339 and footnotes). However, only the sage
    reaches this stage of unchanging and consistent wanting, because he has perfect
    knowledge. Most people, on the other hand, do not persist in achieving what they
    want cannot keep up the assent once given; c.g. §V 3548 (= Ar. Did. apod Stub.
    Ed. 211.205.).


    It is difficult to down Seneca''s concept of will, and the topic is fiercely debated
    in scholarship. General scholarship (e.g. Renbogen 1936; Pohlens 1965; Hadot 1969;
    Zöller 2003) predominantly argued that the idea of human will originated from
    Seneca, as he regarded it as an independent, irrational element that is able to
    provoke spontaneous actions. 2000 has severe doubt on this view, supported by
    Fuher 2010. Wildberger 2006, however, argues that Seneca''s understanding of will
    is closely modelled on Chryppus, stressing his close affiliation with the Old
    Stoa, and that it is not different from the Stoic view on will.


