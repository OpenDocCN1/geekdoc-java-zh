    SENECA LUCILIO SALUTEM: the address, found in all of the extant EM, provides information
    about the relationship between writer and addressee, and clearly identifies the
    text as a letter. The possessive pronoun *suo* is only used in private correspondence,
    indicating an amicable or even loving relationship. Cicero reserves *suae* exclusively
    for close family members and Tiro; cf. e.g. Cic. Fam. 14.1: Tullius Terentiae
    sua Tulliae Ciceroni suo s. d.,, whereas Pliny addresses all his recipients in
    Books 1-9 with *suus*; cf. e.g. Plin. Ep. 21.2: Cicero Romano suo. Yet, in Seneca''s
    case, the reflexive is not merely an epistolary concern, but an expression of
    the ideal friendship in his letters. Seneca stresses real friendship, in sharp
    contrast to Epicureanism, pursues no ulterior and is based on mutual trust, so
    much that friends regard each other as one entity. This, a conversation with a
    true friend resembles a conversation with oneself; cf. e.g. Ep. 6.3: quid est
    esse ulla ubera eramo amico retrahid? quid quam habere illum non solum; similarly
    in Cic. Lael.:22 dulquam habere quiam omnis audeas loco ut tecum? Friends teach
    and encourage each other with their own example; cf. e.g. Ep. 6.4-6: 35.2, and
    thus, friendship is an important tool for philosophical endeavour and self-improvement
    (Edwards 1997, 30).


    When Seneca addresses Lucilio as ''his Lucilius'', he demonstrates the ideal for
    their friendship and exchange store: a complete amalgamation which they regard
    the other as themselves (on readings of Lucilius as Seneca alter ego, see the
    main introduction $3). Seneca writes to Lucilius in that vein, but they have not
    reached this ideal state of friendship yet: *cipem ipate tecum communicam tam
    samitat mutationem; tun amicitiae nostra certiorem fiducianiam habere coopsisim*;
    see also Ep. 35.1-2 and the comments in Ep. 21.1 on the setbacks of their friendship.


    Of particular relevance to Seneca''s conception of friendship are Ep. 3, 6, 9,
    35, and 109; Knoche 1954; Cancik 1967; Evenepoel 2006 (with a useful overiew of
    the scholarship on amicitia) 2007.


    The use of the reflexive is also indicative of the inward turn that is found in
    Stoicism and, in particular, in Seneca''s philosophical writing. More intensely
    than any Stoic before him, Seneca is concerned with self-scrutiny, self-improvement,
    and self-transformation and has greatly influenced philosophers'''
