  md: '# General Introduction


    Seneca''s creation (Davies 2010 ad loc.). The references to Lucilius'' letters
    or Seneca''s remarks that he will send him books (Ep. 45.2) can be explained as
    part of a clever strategy to create the illusion of an epistolary exchange. However,
    other elements of the EM are more difficult to explain with this reading, for
    instance the fact that Lucilius is in Sicily. Was it an arbitrary or deliberate
    to place his addressee there? Yet, the most convincing argument against reading
    the letters as a diary is how did Seneca get away dedicating other books to himself?
    As Graver 1996, observed: "Romans did not dedicate books to nonexistent friends."


    Therefore, this commentary does not assume that Lucilius was a younger representation
    of Seneca, nor did it cast doubt upon Lucilius actually existed; any attempt at
    proving either is circular, since almost all pertinent information is found in
    Seneca''s works. This is not to say, however, that the letter exchange is necessarily
    genuine (see §4 below) or that Seneca presents an accurate picture of Lucilius;
    the letters should not be mistaken for a historical account, nor should the biographical
    information necessarily be taken at value.


    # 4. GENUINE OR FICTIONAL CORRESPONDENCE?


    It has long debated whether the EM is authentic, is, letters that were actually
    addressed and sent to Lucilius, or a fiction that merely portrays to a genuine
    exchange. Advocates of a genuine correspondence (e.g. Delatte 1935; Cugisi 1989;
    Mazzoli 1989; Lana 1991; Setaioli 2014c) argue that the letters appear to be real
    because of their chronological order, following the seasons (compare Ep. 23.1;
    86.16), and because of the details of Seneca''s and Lucilius'' daily lives that
    are scattered throughout the collection (cf. e.g. Ep. 9.1; 18).


    On the other hand, the fact that Seneca addresses a wider readership in his letters
    (cf. Ep. 8.1; 21.5) is an important argument to regard the collection as fictional
    (extensively discussed by Cancik 1996; Mauch 1970; Griffin 1976; Abel 1981; Graver
    1996). Other elements of the EM raise serious doubts about their authenticity:
    Lucilius'' questions are always ''too perfect'', Seneca''s advice is so general
    that it can be applied to anyone (cf. Ep. 19), and the book units allow us to
    draw conclusions about the design of the collection (on the book structure, see
    §5 below). Extra-literary references, such as Seneca''s invitation for Lucilius
    to join him (cf. e.g. Ep. 6.5), Setaioli 2014c, 194 has pointed out, that this
    argument is circular: the letters are fictional because Seneca presents them as
    fictional, ''clearly amounts to begging the question''. markers marking the collection
    look ''real''.'
