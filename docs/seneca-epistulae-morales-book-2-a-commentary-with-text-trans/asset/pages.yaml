  md: '# General Introduction


    # 1. SENECA''S LIFE AND CAREER


    The Epistulae morales (hereafter EM) contain frustratingly little information
    on Seneca''s biography and the circumstances in which he composed his letters.
    He does not even disclose where he is writing from (on the conspicuous absence
    of Rome in the letters, see Edwards 2018). However it is possible to put together
    a coherent narrative of Seneca''s life from other sources and from the rare glimpses
    into his past offered by his writings.¹


    Lucius Annaeus Seneca was born in Córdoba between 4 BCE and 1 CE, into an ambitious
    family that would produce famous writers and successful politicians. Seneca''s
    father made a lasting contribution to the history of rhetoric; his two brothers
    maintained high public posts—respectively, consul of Achaia and imperial procurator
    RE 1.2 (1900, 2236–9); his nephew Lucan became a poet, first winning Nero''s favour
    and losing it. Martial sings the family''s praises in 1.67–8, linking them closely
    to their done home: *duos Senecas unicumque Lucanum / facenda loquitur Corduba*.
    In Seneca''s life seem to have been equally important to him: his mother Helvia,
    who came from an influential Baetian family, role that women acquired in the early
    Principate, and his wife, Paulina, was present at his suicide, a fact that illustrates
    the new, more liberated, role of the feminine in Stoic philosophy, see Dressler
    2016.


    Very little is known about Seneca''s childhood and early life, except that he
    suffered from bad health from an early age (see the introduction to *Ep. 15*)
    and that he seems to have developed a taste for philosophy as a young man. He
    even adopted vegetarianism, influenced by his study of Pythagoreanism and his
    teachers Soetus and Sextius (*Ep. 108.17–22*). Despite his career later,² Seneca''s
    accent was steep and quickly made him a name for himself as an eloquent speaker.
    His ill health might have even saved his life, suggested by an anecdote in Cass.
    59:19: when Seneca attracted the wrath of Caligula, who wanted him dead, the emperor
    was only appearing after


    > ¹ Griffin 1976 is the most detailed study of Seneca''s life. see also Sørensen
    1984; Maurach 1991; Veyne 2003; Wilson 2014.


    > ² Sen. Controu. 2 pr. 4, not written before 37 CE, mentions Seneca and his older
    brother were still getting ready for public office.'
