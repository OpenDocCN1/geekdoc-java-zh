    # 8. STOICISM AND EPICUREANISM IN THE EPISTULAE MORALES


    Seneca presents himself as a Stoic in his letters (in his other works) but his
    affiliation to Stoicism dawns on the readers of the EM only when they are well
    into the collection. The EM begin with philosophical marketplaces: Seneca tells
    Lucilius not to waste his time (Ep. 1), to restrain himself (Ep. 2), and to distinguish
    friends from acquaintances (Ep. 3). The first time when Seneca professes to be
    a Stoic in Ep. 5.4, he refers to the principle that one ought to live in accordance
    with nature, including himself among the Stoics with the possessive pronoun nostrum
    (nempe positum nostrum secundum natuire). In Ep. 8.1, Lucilius reminds Seneca
    of the Stoic imperative to carry out public duties (illa praecepta quae inarrant
    am morit?); and in Ep. 9.3, distinguishes between ''them'', the Cynics, and ''you'',
    the Stoics (hoc non est illos: noster sapiens quicidem inmodum non sedit, illero
    letter). In the collection, Seneca leaves no doubt about his Stoic affiliation
    as he turns to more complex philosophical questions.


    The EM are not a handbook: they do not give a systematic account of, or an introduction
    to, Stoicism, and Seneca’s over-shifting use of Stoic terminology might confuse
    a philosophical novice. Instead, they rely upon Lucilius’ (and our) background
    knowledge to fill in the gaps, which the letters leave behind. The letters will
    not be helpful with Stoicism and who needs guidance in their daily struggle to
    reach the goals by philosophy. their ideal reader is someone who is proficient
    by philosophy. As indicated by their title, the EM focuses predominantly on ethics,
    and contain only few discussions of logic and physics, not presenting Stoic philosophy
    in its entirety.


    Under the influence of Panaetius and Posidius, who shifted the focus from the
    sage to the ordinary proficiens struggling to become (Inwood/Donini 1999, 727),
    Seneca translates Stoicism into a ‘hands-on’ philosophy, that does not dwell on
    subtleties (c.g. Ep. 45.5–13; 85; 113) but offers practical advice, and thus makes
    it attractive for his Roman audience. In the century, the preference of practical
    matters over theoretical discussion gives way to a more detailed treatment of
    Stoic philosophy, as the EM become longer and discuss more specific issues. Seneca
    is particularly interested in emotions and in offering an effective therapy for
    dealing with them (for example, compare Ep. 13 on his confrontation of fear).'
