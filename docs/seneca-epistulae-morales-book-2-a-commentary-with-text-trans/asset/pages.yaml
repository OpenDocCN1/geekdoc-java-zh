  md: '# The addressee: Lucilius


    Lucilius plays a paradoxical role in the EM: on the one hand, the letter could
    not exist without him, since he is Seneca''s only correspondent; on the other
    hand, he is a colorless and to extent exchangeable character. We all learn about
    him in the first twelve letters that he is interested in philosophy. Rather than
    challenging Seneca, Lucilius often seems to feed him lines and to take the place
    of a generic interlocutor, by Gunderson 2015, 60 observes: ''For the most part,
    it can very hard to state categorically that any of the second person addresses
    are necessarily made to Lucilius where the vocative form of his name is not present.''
    This impression can only be to some degree ascribed to the fact that the collection
    contains only one side of the correspondence.


    In Book 2, however, his character and background begin to take on a more distinctive
    shape. Ep. 13 mentions for the first time Lucilius'' past, the time before he
    received Seneca''s letters on ethics. We learn in Ep. 14 that he feels political
    repercussions, presumably because of some public office he holds, the nature of
    which is only disclosed in Ep. 19. Ep. 14 merely hints at it, we see the note
    on Ep. 14:18: *fit ex domino procurator*. Lucilius is a rich man and interested
    in protecting and increasing his gain, mostly out of concern for his family but
    also for his own gain (Ep. 17 and 19). Seneca tries to convince him to adopt a
    frugal lifestyle in Ep. 17 and 18, and even goes so far as to suggest Lucilius
    gives up his post in Sicily (Ep. 19, 20, and 21). We also learn about Lucilius''
    literary ambitions for the first time (Ep. 21). In Ep. 18, he is portrayed as
    someone who chooses between two middle ground over extremes, Seneca calls him
    to choose between radically different options on Ep. 18:3: *arbitri partibus functus*.
    This information does not give us a complete picture of Lucilius'' character,
    but he emerges as a more rounded figure from Book 2, and there is room for further
    development in the letters that follow.


    The biographical parallels between Seneca and Lucilius are uncanny: both are old
    men, although Lucilius is younger than Seneca (see the note on Ep. 15:1; *antiquis*,
    see Ep. 19:1; 33:7; 96:3); they write (Ep. 8:10; 24:21; 46:1; Qnat. 3:1; 3:26:5);
    their names are very diminutive (form of Lucilius). These similarities have led
    scholars to assume that Lucilius is Seneca''s alter ego and the EM are essentially
    a monologue or a diary (Grimal 1992, 219; Schoberg 1999). Naturally, this assumption
    is based on the belief that letters are fictional (for the fictionality debate,
    see #4 below, ''Genuine or fictional correspondence'').


    Such a reading is attractive: by addressing himself in his letters, Seneca would
    simultaneously demonstrate self-scrutiny, and exercise scrutiny. Through his self-address,
    he would show his readers how to execute the Stoic inward turn. Seneca''s ambiguous
    assertion *meum opus es* in Ep. 34.2 seems to corroborate such an interpretation,
    emphasizing that Lucilius is'
