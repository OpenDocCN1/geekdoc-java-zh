    Seneca holds strong views on what constitutes appropriate style. Ep. 19 sharply
    criticizes Maecenas'' affected and unintelligible writing, which is, as he explains
    later in Ep. 114, reveals his character and speaks volumes about the state of
    his mind. Lucilius'' writing style on the other hand is effusively praised as
    simple and lofty, disclosing both his talent and his progress (see the introduction
    to Ep. 19). When Lucilius mentions that he the philosopher Seravio gave a speech
    in a great rush, speaking quickly and vehemently, Seneca chastises his presentation
    as disorderly (Ep. 40.2). Ideally, philosophical discourse is plain and measured,
    neither nor overwhelming (Ep. 40.3–4), and never intent on mere effect (Ep. 20.2;
    38.1; 40.4–5; 75.1–2).


    Seneca''s own style produced conflicting reactions, ranging from admiration to
    contempt. Caligula famously criticized the incoherence of Seneca''s writing as
    hermana sine calce (Suet. 53.2), as did Quintilian, disapproved of Seneca''s pretentious
    writing (Inst. 10.2.130): si rerum pondera minutissimis sentiis non profit, consensu
