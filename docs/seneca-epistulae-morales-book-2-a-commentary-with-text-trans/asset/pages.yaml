    aut pauper sis opset aut pauper similis: the passage is absolutely crucial to
    Seneca''s argumentation. Seneca adapts his own unrealistic dream to his elite
    audience and turns it into a more realistic scenario: resembling the poor is as
    good as actually poor. He does not specify what it means to be pauperi similis
    but the context suggests that it is a voluntary poverty (pauertas voluntaria)
    and that it describes a frugal lifestyle (fugilitas below); we might infer from
    Ep. 18 that the expression also includes the imitation or exercise of poverty.
    The interesting parallel is Ep. 90.16: ill sapiens futurunt ante quae is transformed
    and expanded: strictly speaking, those living in the Golden Age were not poor
