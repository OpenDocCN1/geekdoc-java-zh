    (*familiare et iocos*); and serious letters (*severum et graeu*). It, transpires
    that his letter defies all three categories. Seneca repeatedly stresses that letters
    should be brief, playfully chastising himself for writing long letters (e.g. *Ep.
    13:5; 16:2; 30.18*), and should ideally resemble a conversation: this should be
    exchanged frequently (*Ep. 38.1 and 40.1*) and should be simple, natural, and
    authentic (*Ep. 75*). According to Seneca, the intimacy and simple language of
    the letter genre conveys advice and exhortation (Ep. 38.1).


    Why did Seneca choose the letter genre to write about philosophy? The privacy
    or intimacy of the letter genre is the platform for Seneca’s interest in the self
    and self-scrutiny (Foucault 1986, 46–7; Edwards 1997); not only does he show his
    ‘true’ self in the letters, but also testify to Seneca’s examination in his daily
    life, so much that the letters represent a conversation with him, to which Lucilius
    listened (*Ep. 27:1*: *sic itaque ami tamquam loqui; in secretum me admitno et
    adhibito mecum ego*, see also *Ep. 55:8–1*); see Gilral 1978; Edwards 2009a. Then,
    how Lucilius helps his readers by opening their exchange the opportunity to start
    their own process of self-search and self-improvement. Yet-scrutiny and progress
    take time and are incremental. The letter collection encapsulates both aspects:
    Seneca’s and Lucilius’s development is steady, not linear, and takes lots of time
    and effort. Seneca recommends exercises that need to be repeated, ideally daily,
    an effort that is imitated by the serial nature of letter-writing (Edwards 2019,
