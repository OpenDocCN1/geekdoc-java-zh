    # §8 The sage avoids danger as a cautious seamen avoids a storm at sea


    The comparison between the wise man and the helmsman works on different levels:
    firstly, the calm sea is a common metaphor to describe the ideal state of mind
    (γαλακράνητα / tranquillitatis). The wise man will not put his peace of mind at
    risk if he can avoid his ship (= the state) through the sea (= crises and dangers);
    e.g. sen. Controu. 2; Bre. 18.1. That said, the comparison outlines how one may
    be a good politician and administrator: moderate and cautious, the good politician
    will plan ahead and avoid dangerous situations. Thirdly, the paragraph draws conclusions
    about Lucilius to see his sea journey to Sicily, where he served as a procurator.
    In Ep. 19, Seneca intensifies his appeal that the procurator Lucilius be careful
    to avoid any dangers as he asks him to withdraw into otium.


    Cum...fretum the sudden change of person and tense suggests that the remark refers
    to Lucilius’ journey to Sicily (see Gowers 2011, 186) where he was appointed procurator.
    The biographical detail may seem out of place because it is embedded in the comparison,
    but it makes Seneca’s advice significant for Lucilius. This is the first time
    that the EM hint at Lucilius'' office, yet it is not explicitly stated; see $8;
    Ep. 19.5; 45.2; QNat. 4a pr. 1.


    There are significant parallels between Seneca’s adresse Lucilius and the satirist
    Lucilius, as suggested by Gowers 2011: both traveled to Sicily (compare the satirist’s
    iter siculum), and some aspects of the passage indeed be read as references to
    the epic genre, for instance the mention of a sea journey and the vocabulary which
