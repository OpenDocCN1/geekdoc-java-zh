    his philosophy (moratur... me res familiaris). The rhetorical question si [pauertas]
    aptenda est ($3), which presents poverty as desirable, further illustrates Seneca’s
    paradoxical understanding of wealth and poverty. In the course of the letter,
    Seneca emphasizes the advantages of poverty and the disadvantages of wealth: poverty
    is representative of the Golden Age, wealth of the Iron Age; poverty grants peace,
    safety, and freedom, whereas wealth is insatiable and tiresome. The comparison
    culminates in the paradoxical argument that philosophy will grant immediate wealth
    ($10), and the implication that only the wise are rich (which is indeed one of
    the Stoic paradoxes, see Cic. Paradoxa Stoorum 5).


