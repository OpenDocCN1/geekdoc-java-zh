    legal status, an inner reward that contributes to the self-sufficiency of the
    wise man (Pierini 2014, 174) and thus that a slave may have a freer mind than
    his master. True freedom, however, is obtained only by the sapiens, who are not
    subject to any external influence (Bobzier 1998, 339; Edwards 2009, 153–4). On
    slavery and freedom in Stoicism, see Bobzier 1998, esp. 330–57; for Seneca’s treatment
    of slavery, see In 2005 and Edwards 2009; Roller 2001, 213–86, 272–86, which analyses
