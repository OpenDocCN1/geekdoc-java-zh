    Database Management Systems


    A database management system, or simply DBMS, is an important programming tool
    that consists of a set of programs that define, manage and process databases and
    all applications associated to them. Through this, you are able to build a structure
    and operate on the valuable data that the database holds in a very efficient way.
    There are two main types of users that work on DBMS – the conventional user who
    retrieves or modifies data and the administrator who is responsible for maintaining
    the structure of the database.


    The following are the key features of a DBMS:


    *   Allows the creation of new databases and their data structures


    *   Allows data query and modification using an appropriate programming language


    *   Allows the storage of vast amounts of data over a long period of time


    *   Enables database recovery in times of failure, error or intentional misuse


    *   Controls data access from many users at once


    It was during the late 1960s when the first commercial DBMS appeared. It evolved
    from file systems that basically provided data storage for over a certain period
    of time. Though such systems were capable of storing tremendous amount of data,
    computer professionals still have to face problems of data loss and an inefficient
    information retrieval system. There were also issues on control access where errors
    occur when two users modify the same file at the same time. Some examples of these
    applications are airline reservation systems, banking systems and corporate record
    keeping systems, among others.


    With the advancement of technology in the market today, you can find numerous
    programs that will be suitable for your DBMS requirements. There are applications
    that run on a small scale level like your personal computer or tablet. Some are
    built to run on a large and powerful equipment, like those being used by multinational
    companies. Nevertheless, the on-going trend is for DBMS to be executed on multiple
    platforms or machines (whether large or small) that are interconnected to one
    another, forming an immense scalable network. IT experts have also found ways
    on how store data using Internet technology in powerful data centers or more popularly
    known as clouds. This cloud can be public entity (managed by a large company like
    Microsoft or Google) or a private one (maintained and stored via the intranet
    within an organization).


    ![](Images/image00176.jpeg)


    In this chapter you have learnt the essential features of a database and how it
    transforms to become a relational database.  Also, you had an overview of the
    history and characteristics of database management systems. In the next chapter
    you will learn the fundamental structure of the SQL language and its components.


