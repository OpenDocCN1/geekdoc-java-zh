    学习 `SQL` 语法就像理解英语语言结构一样。它的命令语言由有限的语句组成，执行三项主要的数据功能：定义、操纵和控制。`SQL` 编程语言包含仅用于特定用途的保留字。因此，你不能将这些单词用变量、表和列的名称，或者以其预定用途之外的任何方式使用它们。以下是
    `SQL:2011` 中一些常见的保留字。


    | ABS | ALL | ALLOCATE | ALTER | AND | ANY |

    | ARE | ARRAY | AS | AT | AVG | BEGIN |

    | BETWEEN | BINARY | BOOLEAN | BOTH | BY | CALL |

    | CASCADED | CASE | CEILING | CHAR | CHARACTER | CHECK |

