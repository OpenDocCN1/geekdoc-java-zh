    ### 一次修改一条记录


    在之前的讨论中，你添加了一条客户信息记录，但没有提供 `JobPosition` 字段的数据。如果你后来了解到联系人是公司的副总裁，那么你可以修改这条现有记录。


    1. 点击 `![](img/image00217.jpeg)` 选项返回 SQL 编辑器。输入以下代码行：


