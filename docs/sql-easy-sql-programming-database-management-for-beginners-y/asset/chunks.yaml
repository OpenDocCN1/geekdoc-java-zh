    In this chapter you have learnt how to encode programming lines using the most
    commonly used DML command statements in inserting, updating and deleting records
    from database tables in SQL. In the next chapter you will learn the different
    DQL commands that will allow you to retrieve valuable information contained in
    database tables.


    # Chapter Seven: Data Query Language Statements


    In this chapter you will learn how to use the available Data Query Language statements
    in retrieving data from database tables. Through `SQLiteStudio`, you will be able
    to use `SELECT`, `WHERE`, `ORDER BY` and `GROUP BY` statements in requesting and
    displaying significant database information.


    Once you have created and populated your tables with data values, there will come
    a time that you will need to perform database queries to retrieve relevant information.
    A query is a valid inquiry into the database to extract and display data in a
    readable or understandable format, depending on the user’s request. The main challenge
    in SQL is to correctly instruct the computer what to search for by manipulating
    the database through row selection. Once you have selected the values you need
    then you can further perform various operations such as data addition, deletion,
    modification and more.


    ## SELECT Statement


    Retrieving data values is the most performed manipulation task by database users.
    In doing such operation you need to use the DML command statement called `SELECT`.
    You have the option to retrieve just one row, a number of rows or all the rows
    of the database table.


    Using the `SELECT` statement in retrieving all the records of a particular table
    is the basic form of this DML command statement. Even if the `SELECT` command
    is considered to be the most powerful statement, it requires other clauses to
    function correctly in performing a query. The syntax in its simplest form is:


    ```sql

    SELECT * FROM TABLE_NAME;

    ```


    In the programming line above, the asterisk sign `*` signifies everything. This
    means that the wildcard character is a shortcut for the listing of all the column
    names of a particular table.


    To select all the data rows from the `Customer_TBL` table:


    1. Click the ![](Images/image00263.jpeg) option and then type the following lines
    of code:


    ```sql

    SELECT * FROM Customer_TBL;

    ```


    2. Click the `EXECUTE QUERY` button ![](Images/image00218.jpeg). The result of
    this `SELECT` command is displayed inside the `GRID VIEW` tab.


    ![](Images/image00264.jpeg)


    The result basically shows the entire data of the `Customer_TBL` table since the
    code instructs the database to select all the rows and columns of the said table.


    ## WHERE Statement


    When you want to be more specific in selecting rows of data from your database
    tables then you need to add a bit of complexity to your programming lines. At
    this point, you need the function of the `WHERE` clause, which means that the
    `SELECT` operation will be performed once the stated condition inside such clause
    is true. The syntax of the `SELECT` statement with the `WHERE` clause is as follows:


    ```sql

    SELECT COLUMN_LIST

    FROM TABLE_NAME

    WHERE CONDITION;

    ```


    To select only the rows of data where the job position of the customer is Vice-President:


    1. Click the ![](Images/image00263.jpeg) option and then type the following lines
    of code:


    ```sql

    SELECT *

    FROM Customer_TBL

    WHERE JobPosition = ‘Vice-President’;

    ```


    2. Click the `EXECUTE QUERY` button ![](Images/image00265.jpeg). The result of
    this `SELECT` command is displayed inside the `GRID VIEW` tab.


    ![](Images/image00266.jpeg)


    The result shows the records of the two customers named Kevin Lord and Mike Armhs
    who are both Vice-Presidents of their respective companies.


    What if you only want to select certain columns of the table, maybe just the full
    name and company of the customer? You will now modify your lines of code into
    the following:


    1. In the `QUERY` tab, change the wildcard character `*` (asterisk sign) into
    `CustomerName` and `CompanyName` by typing the following:


    ```sql

    SELECT CustomerName, CompanyName

    FROM Customer_TBL

    WHERE JobPosition = ‘Vice-President’;

    ```


    2. Click the `EXECUTE QUERY` button ![](Images/image00267.jpeg). The result of
    this `SELECT` command is displayed inside the `GRID VIEW` tab.


    ![](Images/image00268.jpeg)


    By specifying the columns you want to select, you are customizing what data you
    retrieve.


    ## ORDER BY and GROUP BY Statements


    When you want the data you retrieve to be displayed and sorted in some way, then
    you need to include `ORDER BY` or `GROUP BY` at the end of your statement. The
    primary function of `ORDER BY` statement is basically to arrange data using a
    specific order, whether ascending or descending. On the other hand, the `GROUP
    BY` statement is used to put identical data together.


    The standard syntax for `ORDER BY` clause is:


    ```sql

    SELECT COLUMN_LIST

    FROM TABLE_NAME

    ORDER BY COLUMN_LIST [ASC | DESC];

    ```


    By default, `ORDER BY` sorts individual rows in ascending order. If you want to
    arrange your records in descending order then you have to indicate the `DESC`
    operator at the end of the `ORDER BY` clause.


    To retrieve all customer records from the `Customer_TBL` table and display them
    in ascending order by US state:


    1. Click the ![](Images/image00259.jpeg) option and then type the following lines
    of code:


    ```sql

    SELECT *

    FROM Customer_TBL

    ORDER BY USState;

    ```


    2. Click the `EXECUTE QUERY` button ![](Images/image00203.jpeg). The result of
    this `SELECT` command is displayed inside the `GRID VIEW` tab.


    ![](Images/image00269.jpeg)


    Since you did not specify how the records will be sorted, the data rows were arranged
    alphabetically (in an ascending order) using the `USState` column. If you want
    to sort your records in descending order:


    1. Inside the `QUERY` tab, add `DESC` after `USState` in the `ORDER BY` clause.


    ```sql

    SELECT *

    FROM Customer_TBL

    ORDER BY USState DESC;

    ```


    2. Click the `EXECUTE QUERY` button ![](Images/image00270.jpeg). The result of
    this `SELECT` command is displayed inside the `GRID VIEW` tab.


    ![](Images/image00271.jpeg)


    If you want to determine something about a group of records or need to combine
    columns with duplicate values in a logical way, then it is time to use the `GROUP
    BY` clause. Other terms similar to grouping are aggregating, summarizing and rolling
    up. To illustrate this, if you want to know how many customers are there for every
    job position in the `Customer_TBL` table then we need to count the number of records
    and display the total number of customers per job position.


    1. Click the ![](Images/image00263.jpeg) option and then type the following lines
    of code:


    ```sql

    SELECT JobPosition, COUNT(*) AS number_of_record

    FROM Customer_TBL

    GROUP BY JobPosition;

    ```


    2. Click the `EXECUTE QUERY` button ![](Images/image00218.jpeg). The result of
    this `SELECT` command is displayed inside the `GRID VIEW` tab.

