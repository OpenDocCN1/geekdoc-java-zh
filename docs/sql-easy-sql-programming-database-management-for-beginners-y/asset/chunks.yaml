    ![](Images/image00197.jpeg)


    In this chapter you have learnt how to encode programming lines using the common
    DDL command statements in creating, altering and dropping database tables in SQL.
    In the next chapter you will learn the different DML commands that will allow
    you to manipulate information contained in database tables.


    # Chapter Six: Data Manipulation Language Statements


    In this chapter you will learn how to manipulate database tables and make them
    useful through data insertion, deletion and update. To accomplish this, you will
    be programming in SQLiteStudio using three Data Manipulation Language statements
    – `INSERT`, `DELETE` and `DROP`.


    Normally, such tables are empty after they have been created. The data that you
    can store in your database objects can be in various formats – non-digital, semi-digital
    and fully digital. Non-digital format means that the data needs to be extracted
    from a non-electronic source, like customer information from business cards. In
    this case, you are required to store the data manually into your database. As
    for the semi-digital, the data could already be in some sort of digital form but
    not the same format as your database tables. For example, you could have records
    of your customers’ business cards stored in a Microsoft Excel file that you may
    need to translate into an appropriate format fit for your database. Lastly, fully
    digital means that all of your customer information is already in electronic format
    that also matches the layout of your database.


    The current data format will further determine how you will be able to manipulate
    your database. This is where the DML commands become useful in entering new data,
    updating existing data and deleting data from tables.


    ## INSERT Statement


    The process of entering new data could be done either manually through individual
    commands or automatically using batch process programs. There are also factors
    that will determine what and how much data you can insert in your database tables
    – field length, column data type, table size and more. In populating tables with
    data, you will use the `INSERT` statement.


    ### One Row at a Time


    When you want to enter all the data into a single row of your database table,
    you can create a form-based data entry application. In this feature, a screen
    is designed that contains fields where you can input the information being asked
    - for every column in the table. Use the following syntax in adding data one row
    at a time:


    ```

    INSERT INTO TABLE_NAME [(column_1, column_2, … , column_n)]

    VALUES (value_1, value_2, …, value_n) ;

    ```


    Anything inside the square brackets are considered optional, meaning you don’t
    need to list the column names. By the way, “n” is the maximum number of table
    columns. The default order of the column list is the same order as your column
    tables. Thus, if you list the items inside the `VALUES` section in the same order
    as your table columns, then the values will be entered in the correct columns.
    You only need to indicate the column names if you need to specify the values in
    a different order.


    Now, let us insert records to our `Customer_TBL` table using the customer information
    provided in the Chapter 2.


    1. Type the following programming lines in the SQL editor:


    ```

    INSERT INTO Customer_TBL (CustomerID, CustomerName, JobPosition, CompanyName,
    USState, ContactNo)

    VALUES (1, ‘Kathy Ale’, ‘President’, ‘Tile Industrial’, ‘TX’, 3461234567)

    ```


    ![](Images/image00198.jpeg)


    2. Click the `EXECUTE QUERY` button ![](Images/image00196.jpeg) and you will get
    the following screen (there should be no errors in the Status Area):


    ![](Images/image00199.jpeg)


    3. To check if the record of data was inserted in the table, double-click `Customer_TBL`
    at the left pane. Click the `DATA` tab at the right pane, which is in between
    `STRUCTURE` and `CONSTRAINTS` tabs. Your table should be similar to what is shown
    in the screen below:


    ![](Images/image00200.jpeg)


    4. Click the ![](Images/image00201.jpeg) option at the bottom left corner of the
    screen. To add another record without specifying the column names, delete the
    programming codes inside the `QUERY` tab and type the following lines:


    ```

    INSERT INTO Customer_TBL

    VALUES (2, ‘Kevin Lord’, ‘VP’, ‘Best Tooling’, ‘NY’, 5181234567)

    ```


    ![](Images/image00202.jpeg)


    5. Click the `EXECUTE QUERY` button ![](Images/image00203.jpeg) and provided that
    the order of the values corresponds exactly to the order of the `Customer_TBL`
    table’s columns, then there should be no errors in the Status Area.


    ![](Images/image00204.jpeg)


    6. Click the `CUSTOMER_TBL (SAMPLE_DB)` option ![](Images/image00205.jpeg) at
    the bottom left corner of the screen. Under the `GRID VIEW` tab, click the `REFRESH
    TABLE DATA` button ![](Images/image00206.jpeg) or press `F5` on your keyboard.
    You should see the new record added to the table.


    ![](Images/image00207.jpeg)


    ### Multiple Rows at a Time


    Multiple inserts are beneficial if you need to enter a number of records into
    your table. This process is also more efficient than inserting one record at time.
    All you need to do is repeat the `VALUES` clause and make sure you separate them
    with a comma.


    1. Going back to the SQL Editor, enter the following lines (without specifying
    the column names) for details:


    ```

    INSERT INTO Customer_TBL

    VALUES (3, ‘Kim Ash’, ‘Director’, ‘Car World’, ‘CA’, 5101234567),

    (4, ‘Abby Karr’, ‘Manager’, ‘West Mart’, ‘NV’, 7751234567)

    ```


    2. Click the `EXECUTE QUERY` button ![](Images/image00193.jpeg).


    ![](Images/image00208.jpeg)


    3. Go to the ![](Images/image00209.jpeg)option. Make sure to click `REFRESH TABLE
    DATA` ![](Images/image00210.jpeg)or press `F5` on your keyboard. You should now
    see two more records inserted to the database.


    ![](Images/image00211.jpeg)


    ### Only Selected Columns at a Time


    In Chapter 5, the `JobPosition` field of `Customer_TBL` table was defined to allow
    null values. If in case you have a new customer but you do not know his position
    yet, then you can leave the `JobPosition` field blank while providing the necessary
    information for the rest of the fields.


    To add a new record without providing data for the `JobPosition` field:


    1. Enter the following SQL lines (make sure you indicate the column names):


    ```

    INSERT INTO Customer_TBL (CustomerID, CustomerName, CompanyName, USState, ContactNo)

    VALUES (5, ‘Mike Armhs’, ‘1 Driving School’, ‘NJ’, 2011234567)

    ```


    ![](Images/image00212.jpeg)


    2. Click the `EXECUTE QUERY` button ![](Images/image00213.jpeg) on top of the
    `QUERY` tab.


    3. Go to theImages/image00214.jpeg) option then click the `REFRESH TABLE DATA`
    button ![](Images/image00215.jpeg)or press `F5` on your keyboard. Notice that
    since you did not provide any information for the `JobPosition` field, it contains
    a NULL value.


    ![](Images/image00216.jpeg)


    ## UPDATE Statement


    Since change is inevitable, SQL provides a way for you to update existing data
    stored in your database. Depending on your needs, you can modify a single record
    or multiple records at one time using the `UPDATE` command. However, only one
    table is generally updated at a time in a given database. The standard syntax
    for this DML statement is:


    ```

    UPDATE TABLE_NAME

    SET column_1 = EXPRESSION_1,

    column_2 = EXPRESSION_2,

    ...

    column_n = EXPRESSION_N

    [WHERE predicates];

    ```

