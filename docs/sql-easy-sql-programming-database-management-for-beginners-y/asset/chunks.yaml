    In the example above, the COUNT function was introduced to arrange the data in
    groups. The following is a summary of the common aggregate functions used together
    with the GROUP BY statement (x denotes the column name where you want to perform
    the function):


    *   AVG(x) – computes the average of all the column values (null values removed)


    *   COUNT(x) – counts the number of non-null values in the column


    *   COUNT(*) – counts the number of records


    *   MAX(x) – computes the maximum value in the column (null values removed)


    *   MIN(x) - computes the minimum value in the column (null values removed)


    *   SUM(x) – computes the sum or total of the values in the column (null values
    ignored)


    Going back to the GROUP BY example, the data in the JobPosition column is retrieved
    and for each instance of the value, a record is counted using the COUNT function.
    The number_of record  is a new column created that displays the total number of
    records per job position. The Director, Manager and President positions have 1
    record each while the Vice-President has 2\. This is because there are two customers
    who are vice-presidents – Kevin Lord and Mike Armhs. If you can also notice, the
    records displayed are sorted in an ascending order by default.


    Altering your SQL statements to display the job position in a descending order
    will require you to add the ORDER BY statement after the GROUP BY clause (ORDER
    BY will always come after the GROUP BY statement). Change your lines of code into
    the following and then click the EXECUTE QUERY button ![](Images/image00270.jpeg)
    on top of the QUERY tab:


    SELECT JobPosition, COUNT(*) AS number_of_record


    FROM Customer_TBL


    GROUP BY JobPosition


                  ORDER BY JobPosition DESC;


    ![](Images/image00273.jpeg)


    In this chapter you have learnt how to encode programming lines using the most
    commonly used DQL command statements in selecting, ordering and grouping records
    from database tables in SQL. In the next chapter you will learn the different
    transactional control commands that will allow you to manage several relational
    database transactions.


    # Chapter Eight: Transactional Control Commands


    In this chapter you will learn how to use three of the available transactional
    control commands in a relational database management system (RDBMS) using SQLiteStudio
    – COMMIT, ROLLBACK and SAVEPOINT. Controlling transactions requires you to be
    able to manage certain database changes that are usually brought about by the
    insert, update and delete commands.


    Executing a database transaction seems to have been successfully completed when
    you notice that the table’s data or structure has been changed. What is actually
    happening during a transaction execution is that information is stored in a temporary
    space in the database (or what you can call a rollback area). When you want to
    finalize these transactions and store the information permanently, then you either
    save or discard the changes made to the database tables by issuing the appropriate
    transactional control command. Only then that the rollback area is emptied.


    COMMIT Command


    Using the COMMIT command saves all the transactions into your database. Normally,
    in SQLiteStudio, whenever you execute a CREATE, INSERT or DELETE transaction by
    writing programming lines in the SQL Editor, the changes are automatically saved.
    You have first encountered the COMMIT command through the COMMIT CHANGES STRUCTURE
    button in Chapter 6, where you created a copy of the Customer_TBL table. Now,
    to demonstrate this command again in SQLiteStudio, you will manipulate the table
    structure by adding a new record to the Customer_TBL table in GRID VIEW mode.


    1.  Click the ![](Images/image00263.jpeg) option. To ensure that there are no
    transactions currently running in the database, type the following programming
    line in the QUERY tab then click the EXECUTE QUERY button ![](Images/image00218.jpeg):


    END TRANSACTION;


    ![](Images/image00274.jpeg)


    2.  Double-click Customer_TBL under the TABLES list in the DATABASE NAVIGATOR
    pane. Click the DATA tab at the right and make sure that the GRID View is displayed.
    You will see all the records of the Customer_TBL table.


    ![](Images/image00275.jpeg)


    3.  Click the first column of the last row of the table, which is CustomerID 5.


    ![](Images/image00276.jpeg)


    4.  Click the drop-down arrow beside the INSERT ROW (INS) button and select PLACE
    NEW ROWS BELOW SELECTED ROW option.


    ![](Images/image00277.jpeg)


    5.  This time click the INSERT ROW (INS) button and you will see a new empty row
    added to the table.


    ![](Images/image00278.jpeg)


    6.  Add the following data values in the new record:


    CustomerID:                            6


    CustomerName:              JOHN DEPP


    JobPosition:                            President


    CompanyName:              Rockers Mine Company


    USState:                            TX


    ContactNo:                            3467654321


    ![](Images/image00279.jpeg)


    7.  Click the COMMIT button ![](Images/image00280.jpeg)to permanently save the
    new data values added to the table.


    ROLLBACK Command


    If the COMMIT command saves all the changes to the database, the ROLLBACK command
    is the reverse where all the unsaved changes will be discarded. However, you can
    only undo transactions since the last COMMIT or ROLLBACK statement executed. The
    standard syntax for this transactional control command is:


    ROLLBACK [WORK];


    Also, before you can perform a ROLLBACK command, make sure that transactions have
    started. This means that you need to execute the following programming statement
    at the very beginning:


    BEGIN TRANSACTION;


    To demonstrate how a ROLLBACK statement works, you will modify the DROP TABLE
    command in SQLiteStudio:


    1.  Click the ![](Images/image00263.jpeg) option. In the QUERY tab, type the following
    programming statement and click the EXECUTE QUERY button ![](Images/image00281.jpeg):


    BEGIN TRANSACTION;


    ![](Images/image00282.jpeg)


    2.  Click the ![](Images/image00283.jpeg) option and clear the QUERY tab. Type
    the following and then click the EXECUTE QUERY button ![](Images/image00218.jpeg).
    You will notice that the Customer_TBL table is now removed from the Tables list.


                  DROP TABLE Customer_TBL;


    ![](Images/image00284.jpeg)


    3.  Click the ![](Images/image00285.jpeg) option again and clear the QUERY tab.
    Type the following and then click the EXECUTE QUERY button ![](Images/image00218.jpeg):


                  ROLLBACK;


    ![](Images/image00286.jpeg)


    4.  To check if the ROLLBACK command reversed the deletion of the Customer_TBL
    table, right-click anywhere inside the DATABASE NAVIGATOR pane. Choose REFRESH
    ALL DATABASE SCHEMAS option.


    ![](Images/image00287.jpeg)


    5.  Click the TABLE list at the left pane. You should now see that the Customer_TBL
    table is back under the TABLE list.


    ![](Images/image00288.jpeg)


    SAVEPOINT Command


    When you want to reverse the transaction just back to a certain point and not
    the entire transaction, then you have to execute the SAVEPOINT command before
    performing a ROLLBACK action. This is how you manage several transactions into
    smaller groups of SQL commands. The standard syntax for this transactional control
    command is:


    SAVEPOINT SAVEPOINT_NAME;


    When using the SAVEPOINT and the ROLLBACK commands together, the syntax is:


    ROLLBACK TO SAVEPOINT_NAME;


    A savepoint name can be the same as the database object’s name to which you will
    be performing the SQL transactions. However, you should remember to make them
    unique, different from the group of transactions that you want to break down into
    several points or segments.


    To demonstrate how a SAVEPOINT with a ROLLBACK command works, you will delete
    certain records from the Customer_TBL table and reverse this transaction.


    1. Click the ![](Images/image00250.jpeg) option. In the QUERY tab, type the following
    programming statement and click the EXECUTE QUERY button ![](Images/image00196.jpeg):


    BEGIN TRANSACTION;


    ![](Images/image00289.jpeg)'
