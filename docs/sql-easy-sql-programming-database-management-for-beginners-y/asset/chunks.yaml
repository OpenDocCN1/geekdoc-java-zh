    等大公司管理），也可以是私有实体（通过内网维护）。


    # 第三章：SQL 结构


    在本章中，你将学习 SQL 语言的基础特性及其编程方面。此外，你将获得关于在哪里以及如何下载 `SQLite` 的逐步说明，它是本书讨论中将使用的 SQL
    版本。


    ## SQL 基础特性


    SQL 是一种灵活的计算机语言，你可以用它与关系型数据库进行通信。该软件具有一些独特的特性，与其他编程应用程序区别开来。首先，SQL 是一种非过程化语言。大多数计算机程序（例如
    C、C++ 和 Java）通过遵循一组被称为过程的命令来解决问题。在这种情况下，一个特定的操作接在另一个操作执行，直到完成所需的任务。操作流可以是线性序列，也可以是循环序列，取决于程序员的指定。SQL
    并非如此。在使用此应用程序时，你只需要指定你想要的输出，而不是你想要如何生成输出。从 `CUSTOMER TABLE` 中，如果你想创建一个位于德克萨斯州的联系人单独列表，你需要检索
    `STATE` 列包含 `TX` 值的行。


    '
- fmt: '

    Learning the `SQL` syntax is like understanding the English language structure.
    Its command language, comprised of a limited number of statements, performs three
    primary data functions - definition, manipulation and control. The `SQL` programming
    language also includes reserved words that are only to be used for specific purposes.
    Thus, you cannot use these words as names for variables, tables and columns; or
    in any other way apart from their intended use. Below are some of the most common
    reserved words in `SQL:2011`.


    | ABS | ALL | ALLOCATE | ALTER | AND | ANY |

    | ARE | ARRAY | AS | AT | AVG | BEGIN |

    | BETWEEN | BINARY | BOOLEAN | BOTH | BY | CALL |

    | CASCADED | CASE | CEILING | CHAR | CHARACTER | CHECK |

    | CLOSE | COLLATE | COLLECT | COLUMN | COMMIT | CONDITION |

    | CONNECT | CONSTRAINT | CONVERT | COUNT | CREATE | CURSOR |

    | CYCLE | DATE | DAY | DEALLOCATE | DEC | DECIMAL |

    | DECLARE | DEFAULT | DELETE | DESCRIBE | DISCONNECT | DISTINCT |

    | DOUBLE | DROP | DYNAMIC | EACH | ELEMENT | ELSE |

    | END | ESCAPE | EVERY | EXCEPT | EXECUTE | EXISTS |

    | EXTERNAL | EXTRACT | FALSE | FETCH | FILTER | FLOAT |

    | FLOOR | FOR | FOREVER | FREE | FROM | FULL |

    | FUNCTION | FUSION | GET | GLOBAL | GRANT | GROUP |

    | GROUPING | HAVING | HOLD | HOUR | HOURS | IDENTITY |

    | IN | INNER | INOUT | INSERT | INT | INTEGER |

    | INTERSECT | INTERVAL | INTO | IS | JOIN | KEEP |

    | LANGUAGE | LARGE | LEAD | LEFT | LIKE | LOCAL |

    | LOWER | MATCH | MAX | MEMBER | MERGE | METHOD |

    | MINUTE | MOD | MODULE | MONTH | MULTISET | NATIONAL |

    | NATURAL | NEW | NIL | NO | NONE | NORMALIZE |

    | NOT | NULL | NUMERIC | OF | OFFSET | OLD |

    | ON | ONLY | OPEN | OR | ORDER | OUT |

    | OVER | OVERLAY | PARAMETER | PARTITION | POSITION | POWER |

    | PRECISION | PREPARE | PRIMARY | PROCEDURE | RANGE | RANK |

    | REAL | RECURSIVE | REF | REFERENCES | REFERENCING | RELEASE |

    | RESULT | RETURN | REVOKE | RIGHT | ROLLBACK | ROLLUP |

    | ROW | ROWS | SCOPE | SCROLL | SEARCH | SECOND |

    | SELECT | SET | SIMILAR | SOME | SPECIFIC | SQL |

    | START | STATIC | SUM | SYMMETRIC | SYSTEM | TABLE |

    | THEN | TIME | TIMESTAMP | TO | TRANSLATE | TREAT |

    | TRIGGER | TRUNCATE | TRIM | TRUE | UNION | UNIQUE |

    | UNKNOWN | UPDATE | UPPER | USER | USING | VALUE |

    | VALUES | VARCHAR | VARYING | VERSION | WHEN | WHENEVER |

    | WHERE | WINDOW | WITH | WITHIN | WITHOUT | YEAR |


    If you think that an `SQL` database is just a collection of tables, then you are
    wrong. There are additional structures that need to be specified to maintain the
    integrity of your data, such as schemas, domains and constraints.


    *   **Schema**: This is also called the conceptual view or the complete logical
    view that defines the entire database structure and provides overall table organization.
    Such schema is considered a metadata – stored in tables and part of the database
    (just like tables that consist of regular data).

    *   **Domain**: This specifies the set of all finite data values you can store
    in a particular table column or attribute. For example, in our previous `CUSTOMER
    TABLE` the `STATE` column can only contain the values “TX”, “NY”, “CA” and “NV”
    if you only provide products and services in the states of Texas, New York, California
    and Nevada respectively. So these four state abbreviations are the domain of the
    `STATE` attribute.

    *   **Constraint**: Often ignored but one of the important database components,
    this sets down the rules that identify what data values a specific table attribute
    can contain. Incorporating tight constraints assures that database users only
    enter valid data into a particular column. Together with defined table characteristics,
    column constraints determine its domain. Using the same `STATE` column as an example
    with the given constraint of only the four values, if a database user enters “NJ`
    for New Jersey, then the entry will not be accepted. The system will not proceed
    until a valid value is entered for the `STATE` attribute, unless the database
    structure needs to be updated due to sudden business changes.


    ## SQL Command Types


    Before you start programming in `SQL`, you need to understand its basic command
    categories in performing various functions – database creation, object manipulation,
    data population and update, data deletion, query submission, access control and
    database administration, among others. The following are the main categories:


    ### Data Definition Language (DDL)


    Data Definition Language (or simply `DDL`) enables you to create, change or restructure,
    and even destroy the basic elements that are contained in a relational database.
    `DDL` focuses only on the structure, not the data contained within the elements.
    These basic elements or data objects include tables, schemas, views and more.
    Having no independent physical existence, a view is regarded as a virtual table
    in which its definition only exists in the metadata. However, the view’s data
    comes from the table (or tables) where you will derive the view. Stated below
    are some of the most common DDL commands:


    *   **CREATE**: This command statement is responsible for building the database
    structure. Its syntax is:


    ```sql

    CREATE TABLE

    CREATE VIEW

    ```


    *   **ALTER**: This command statement is in charge of changing the database structure
    after it has been created. Its syntax is:


    ```sql

    ALTER TABLE

    ALTER VIEW

    ```


    *   **DROP**: This command is the reverse of the `CREATE` statement, which destroys
    the database structure. Its syntax is:


    ```sql

    DROP TABLE

    DROP VIEW

    ```


    ### Data Manipulation Language (DML)


    Data Manipulation Language (or simply `DML`) consists of SQL commands that handle
    data maintenance. This means that you are able to enter, change, remove or retrieve
    data. The following are `DML` statements commonly used:


    *   **INSERT**: This command statement is used to insert new data values into
    a certain table. To add values into a table with two columns, use the following
    syntax:


    ```sql

    INSERT INTO TABLE_NAME

    VALUES (''value1'', ''value2'');

    ```


    `TABLE_NAME` is the name of the table where you will be adding the new values.
    The number of items inside the `VALUES` parenthesis represents the number of columns,
    which are arranged in the same order as said columns. If the values are of character
    or date/time data types, they need to be enclosed by single quotation marks. This
    is not required for numeric or null values (the null value should be written as
    `NULL`).


    *   **UPDATE**: This command statement is used to modify or alter pre-existing
    data values in a table, not add or remove records. The update is done one table
    at a time or multiple rows/columns of one table within a database. To change a
    single column, use the following syntax:


    ```sql

    UPDATE TABLE_NAME

    SET COLUMN_NAME = ''value''

    [WHERE CONDITION];

    ```


    As long as the given `WHERE` clause is satisfied, then the value of the `COLUMN_NAME`
    will be updated. This could be within one or multiple records of the given `TABLE_NAME`.


    *   **DELETE**: This command statement deletes certain records or even the entire
    table, not data values from specific columns. To remove a single row or multiple
    records from a table, use the following syntax:


    ```sql

    DELETE FROM TABLE_NAME

    [WHERE CONDITION];

    ```


    The `WHERE` clause is an important part of this command if you want to delete
    selected rows from the `TABLE_NAME`.


    ### Data Query Language (DQL)


    Data Query Language (or simply `DQL`) consists of commands that perform data selection,
    which is the main focus of relational database users in the world of `SQL`. The
    statement used is `SELECT` that can be accompanied by other clauses or options
    so that your extracted results will be in an organized and readable format. You
    can submit a query to the database using a separate application interface or just
    a single command-line. The following is a syntax for a simple `SELECT` statement:


    ```sql

    SELECT [* | ALL | DISTINCT COLUMN1, COLUMN2]

    FROM TABLE1 [, TABLE2];

    ```

