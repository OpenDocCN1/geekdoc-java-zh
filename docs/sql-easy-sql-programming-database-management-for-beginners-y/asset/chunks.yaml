    ![](img/image00208.jpeg)


    3. 转到 ![](img/image00209.jpeg) 选项，并确保点击 `REFRESH TABLE DATA` ![](img/image00210.jpeg)
    或在键盘上按 `F5`。你现在可以看到数据库中插入了两个记录。


    ![](img/image00211.jpeg)


    ### 仅插入某些列


    在第 5 章中，`Customer_TBL` 表的 `JobPosition` 字段被允许空值。如果你有一个新客户但还没有他的职位，你可以留空 `JobPosition`
    字段，同时为其余字段提供信息。


    要在不提供 `JobPosition` 字段的情况下添加新记录：


    1. 输入以下 SQL 行（确保你指示了列名）：


    ```

