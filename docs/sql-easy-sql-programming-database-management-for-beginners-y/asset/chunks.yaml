    \ `SQLiteStudio`，你将能够使用 `SELECT`、`WHERE`、`ORDER BY` 和 `GROUP BY` 语句来请求和显示重要的数据库信息。\n\
    \n一旦你创建了表并填充了数据值，就会会有你需要执行数据库查询来检索相关信息。查询是对数据库的有效提问，根据用户的请求，以可读或易理解的格式提取并显示数据。SQL\
