- fmt: "\nWhen you require multiple database tables to create the view you need, ensure\
    \ that the tables involved will have to be joined by columns that are common to\
    \ them. For example, you may have another table that contains information on the\
    \ customers’ orders such as the date when they ordered, what product they ordered,\
    \ the quantity and more. This new table will be called the `ORDER TABLE` and it\
    \ is related to the first `CUSTOMER TABLE` because every order is associated to\
    \ a particular customer.\n\nNow, you will create a view from two tables that will\
    \ show database users to which company and state each order was shipped to or\
    \ delivered. The basic syntax for creating a view using multiple tables is:\n\n\
    ```sql\nCREATE VIEW VIEW_NAME AS\nSELECT COLUMN_LIST\nFROM TABLE_LIST\nWHERE CONDITION;\n\
    ```\n\n### To create the `ORDER TABLE`:\n\n1. Using the data values in Chapter\
    \ 2 for the `ORDER` table, create another table using the SQL Editor. Click the\
    \ `![](Images/image00250.jpeg)` option and delete everything inside the `QUERY`\
    \ tab. Type the following lines of code for the new `ORDER` table:\n\n```sql\n\
    CREATE TABLE Order_TBL\n(OrderID INTEGER NOT NULL PRIMARY KEY,\n             \
    \                  OrderDate DATE NOT NULL,\n                               CustomerID\
    \ INTEGER NOT NULL,\nProductID INTEGER NOT NULL,\n                           \
    \    OrderQty BIGINTEGER NOT NULL);\n```\n\n2. Click the `EXECUTE QUERY` button\
    \ `![](Images/image00290.jpeg)` on top of the `QUERY` tab. You will now have the\
    \ `Order_TBL` table under the `TABLES` list in the left pane.\n\n`![](Images/image00314.jpeg)`\n\
    \n3. Double-click the `Order_TBL` in the left pane then click on `DATA` tab at\
    \ the left. You will populate this table with data values in `GRID VIEW` mode.\n\
    \n`![](Images/image00315.jpeg)`\n\n4. Click the `INSERT ROW` button `![](Images/image00316.jpeg)`\
    \ and then select the first option – `INSERT MULTIPLE ROWS`.\n\n`![](Images/image00317.jpeg)`\n\
    \n5. Enter “4” in the `NUMBER OF ROWS TO INSERT` input box (since there are 4\
    \ records in the `ORDER TABLE` from Chapter 2) then click OK.\n\n`![](Images/image00318.jpeg)`\n\
    \n6. The `Order_TBL` table will now have 4 rows and 5 columns. Instead of using\
    \ SQL statements to populate this table, you will enter the values directly into\
    \ the table (check the data values in Chapter 2).\n\n`+![](Images/image00319.jpeg)`\n\
    \n7. Click the `COMMIT` button `![](Images/image00320.jpeg)` to save all the data\
    \ values of the `Order_TBL` table.\n\n### To create the view that will tell you\
    \ to which company and state every order was shipped to or delivered:\n\n1. Click\
    \ the `![](Images/image00304.jpeg)` option, empty `QUERY` tab and then type the\
    \ following lines of code:\n\n```sql\nCREATE VIEW OrderDelivery_VW AS\nSELECT\
    \ Order_TBL.OrderID, Customer_TBL.CompanyName AS CompanyDeliveredTo, Customer_TBL.USState\
    \ AS StateDestination, Order_TBL.OrderQty\nFROM Customer_TBL, Order_TBL\nWHERE\
    \ Order_TBL.CustomerID = Customer_TBL.CustomerID;\n```\n\n2. Click the `EXECUTE\
    \ QUERY` button `![](Images/image00203.jpeg)` on top of the `QUERY` tab. You will\
    \ now have a new view named `OrderDelivery_VW`.\n\n`![](Images/image00321.jpeg)`\n\
    \n3. To check the content of this view, double-click `OrderDelivery_VW` in the\
    \ left pane then click the `DATA` tab at the right.\n\n`![](Images/image00322.jpeg)`\n\
    \nIn this view, two columns were selected and renamed from the `Customer_TBL`\
    \ table - `CompanyName` changed to `CompanyDeliveredTo` and `USState` changed\
    \ to `StateDestination`. The other two were from `Order_TBL` table- `OrderID`\
    \ and `OrderQty` (the original column names were retained). The rows retrieved\
    \ from both tables are those records where the `CustomerID` of the `Customer_TBL`\
    \ table matches the `CustomerID` of the `Order_TBL` table.\n\n### Dropping Views\n\
    \nThe `DROP VIEW` command is the statement used to destroy an existing view from\
    \ the database. The basic syntax is:\n\n```sql\nDROP VIEW VIEW_NAME;\n```\n\n\
    To drop or delete the entire `Customer_VW` view:\n\n1. Click the `![](Images/image00255.jpeg)`\
    \ option, empty `QUERY` tab and then type the following lines of code:\n\n```sql\n\
    DROP VIEW Customer_VW;\n```\n\n2. Click the `EXECUTE QUERY` button `![](Images/image00218.jpeg)`\
    \ on top of the `QUERY` tab. You will notice that the `Customer_VW` view is already\
    \ deleted from the `Views` list.\n\n`![](Images/image00323.jpeg)`\n\nIn this chapter\
    \ you have learnt the definition and importance of database views in SQL. You\
    \ have also performed common operations in manipulating views, such as creating\
    \ and dropping them. In the next chapter you will learn more in-depth concepts\
    \ in designing databases in SQL – primary and foreign keys, indexes and normalized\
    \ databases.\n\n# Chapter Ten: Enhancing Database Designs\n\nIn this chapter you\
    \ will gain more in-depth knowledge on designing databases with the use of primary\
    \ and foreign keys, indexes and normalization.\n\n### Assigning Primary and Foreign\
    \ Keys\n\nIt is one of the best practices to assign a primary key when you define\
    \ a table. In a relational database, the primary key is a special field or combination\
    \ of fields that make each record unique. Since the presence of the primary key\
    \ does not permit the duplication of values on the column to which it was assigned,\
    \ then data integrity is guaranteed. Also, fields that are designated as primary\
    \ keys cannot contain null values. Defining a primary key, whether it is explicit\
    \ or implied, occurs during table creation. Normally, the tables with primary\
    \ keys are regarded as parent tables, meaning these tables provide information\
    \ to another table or what is termed as child table.\n\nIn the previous chapters,\
    \ you have been dealing with CUSTOMER table and ORDER Table. What if you have\
    \ another table called PRODUCT that contains the following fields: Product ID,\
    \ Product Name and Price per Unit?\n\n`![](Images/image0324.jpeg)`\n\nFrom the\
    \ figure above, `CUSTOMER_TBL` and `PRODUCT_TBL` are the parent tables of the\
    \ child table `ORDER_TBL` (this describes a parent-child relationship). As you\
    \ can see, the fields named `CustomerID` and `ProductID` are the primary keys\
    \ of the parent tables. These two fields are also present in the child table.\
    \ They now become foreign keys of the `ORDER_TBL` table. In other words, a foreign\
    \ key is a column or field present in the child table that references to the primary\
    \ key of its parent table.\n\nUnlike the primary key, a foreign key does not need\
    \ to be unique all the time. In addition, the name of the foreign key could be\
    \ different from the name of the primary key that it references to. Furthermore,\
    \ the `ProductID` of the parent table (`PRODUCT_TBL`) can never have duplicate\
    \ entries, but not the corresponding `ProductID` in the child table (`ORDER_TBL`).\
    \ However, you should not define and create a foreign key value if there is no\
    \ matching primary key value.\n\n### Understanding Indexes\n\nWhen a database\
    \ starts to slow down, specifically its SQL queries, you can create and implement\
    \ indexes to improve its performance. Such indexes are important objects that\
    \ serve as pointers associated to the data of a particular table. The primary\
    \ function of an index is to determine the exact physical location of the data\
    \ when a query is executed to improve its retrieval process. It works like a book’s\
    \ alphabetically arranged index that helps you find the information you need in\
    \ a much easier way using its page numbers.\n"
