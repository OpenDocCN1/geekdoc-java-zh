  trans: "\n\n`WHENEVER CONDITION ACTION;`\n\n`CONDITION` – 值可以是 `SQLERROR`（如果 `SQLSTATE`\
    \ 类代码不是 00、01 或 02，则返回 TRUE）或 `NOT FOUND`（如果 `SQLSTATE` 为 02000，则返回 TRUE）\n\n\
    `ACTION` – 值可以是 `CONTINUE`（程序继续正常执行）或 `GOTO` 地址（跳转到指定的程序地址执行）\n\n在本章中，你已经学习了游标的主要作用、触发器的工作原理以及在\
    \ SQL 编程中处理错误的重要性。学习这些高级主题使你向最大化你的 SQL 实现潜力又迈进了一步。\n\n# 第十二章：练习题\n\n## 练习 #1\n\
    \n在 SQLiteStudio 中创建一个名为 `OrderInvoice_TBL` 的发票表，包含以下字段：\n\n- `InvoiceID` – 主键，整数数据类型\n\
    - `CustomerID` – 整数数据类型\n- `OrderID` – 整数数据类型\n- `TaxAmt` – 小数数据类型，精度为 9，标度为 2\n\
    - `TotalSaleAmt` – 小数数据类型，精度为 9，标度为 2\n- `ShippingFee` – 小数数据类型，精度为 9，标度为 2\n\n\
    ## 练习 #2\n\n创建 `OrderInvoice` 表后，使用 `INSERT` 语句使用以下数据值填充字段：\n\n| 发票 ID | 客户 ID\
    \ | 订单 ID | 税额金额 | 总销售额 | 运费 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | 2016001 | 1 | 1005 | $523.80 | $198023.05 | $1981.78 |\n| 2016002 | 3 | 1006\
    \ | $302.83 | $198302.03 | $2005.10 |\n| 2016003 | 3 | 1007 | $217.02 | $20021.70\
    \ | $1983.12 |\n| 2016004 | 2 | 1008 | $909.00 | $200009.09 | $19827.22 |\n\n\
    ## 练习 #3\n\n从 `OrderInvoice` 表创建一个名为 `OrderLargeSales_VW` 的视图，其中总销售额大于 $150,000.00\
    \ 且税额小于 $600。该视图仅包含以下字段：客户 ID、订单 ID、税额和总销售额。\n\n## 练习 #4\n\n使用 DML 命令 `DROP` 删除\
    \ `OrderInvoice_TBL` 表和 `OrderInv_VW` 视图。\n\n# 练习答案\n\n## 练习 #1 答案\n\n1. 启动 SQLiteStudio。点击\
    \ `TOOLS` 菜单并选择 `OPEN SQL EDITOR` 。\n2. 点击右侧的 `QUERY` 标签并输入以下程序行：\n\n```sql\n\
    CREATE TABLE OrderInvoice_TBL (\n    InvoiceID INTEGER PRIMARY KEY,\n    CustomerID\
    \ INTEGER , \n    OrderID INTEGER,  \n    TaxAmt DECIMAL(9, 2),\n    TotalSaleAmt\
    \ DECIMAL(9, 2),\n    ShippingFee DECIMAL(9, 2)\n);\n```\n（注：原文 SQL 块中存在不规则的空格，已清理为标准格式）\n\
    \n## 练习 #2 答案\n\n1. 启动 SQLiteStudio。点击 `TOOLS` 菜单并选择 `OPEN SQL EDITOR` 。\n2. 点击右侧的\
    \ `QUERY` 标签并输入以下程序行：\n\n```sql\nINSERT INTO OrderInvoice VALUES\n(2016001, 1,\
    \ 1005, 523.80, 198023.05, 1981.78),\n(2016002, 3, 1006, 302.83, 198302.03, 2005.10),\n\
    (2016003, 3, 1007, 217.02, 20021.70, 1983.12),\n(2016004, 2, 1008, 909.00, 200009.09,\
    \ 1982.22);\n```\n\n## 练习 #3 答案 \n\n1. 启动 SQLiteStudio。点击 `TOOLS` 菜单并选择 `OPEN\
    \ SQL EDITOR` 。\n2. 点击右侧的 `QUERY` 标签并输入以下程序行：\n\n```sql\nCREATE VIEW OrderLargeSales_VW\
    \ AS\nSELECT CustomerID, OrderID, TaxAmt, TotalSaleAmt\nFROM OrderInvoice\nWHERE\
    \ TotalSaleAmt > 150000.00 AND TaxAmt < 600;\n```\n\n## 练习 #4 答案 \n\n1. 启动 SQLiteStudio。点击\
    \ `TOOLS` 菜单并选择 `OPEN SQL EDITOR` 。\n2. 点击右侧的 `QUERY` 标签并输入以下程序行删除表：\n\n```sql\n\
    DROP TABLE OrderInvoice_TBL;\n```\n3. 要删除视图，输入以下程序行：\n\n```sql\nDROP VIEW OrderInv_VW;\n\
    ```\n\n# 如果你需要，这里有一个快速回顾：\n\n1. 你现在已经了解了 SQL 语言的历史和用途。\n2. 你学习了如何描述关系型数据库和数据库管理系统。\n\
    3. 你学习了如何使用不同的 SQL 命令类型并安装 SQLiteStudio。\n4. 你学习了如何定义和使用各种数据类型。\n5. 你学习了如何使用 `CREATE`、`ALTER`\
    \ 和 `DROP` 语句。\n6. 你学习了如何使用 `INSERT`、`UPDATE` 和 `DELETE` 语句。\n7. 你学习了如何使用 `SELECT`、`WHERE`、`ORDER\
    \ BY` 和 `GROUP BY` 语句。\n8. 你学习了如何使用 `COMMIT`、`ROLLBACK` 和 `SAVEPOINT` 命令。\n9.\
    \ 你还学习了如何定义、创建和删除视图。\n10. 你学习了如何分配主键和外键、创建索引以及数据库规范化。\n11. 你学习了如何使用游标、触发器和错误。\n\
    \n# 结语\n\n我希望你通过这本书真正享受了通过 SQLiteStudio 学习 SQL 编程和数据库管理的过程。我确保通过这本书让你以合理的价格理解\
    \ SQL 是什么，并获得巨大的收益。我相信，凭借书中的指南所获得的知识，你现在可以在 SQLiteStudio 中规划、设计并创建你自己的数据库了。\n\n\
    你也可以考虑学习其他编程语言，你的 SQL 编程知识将为你学习其他语言时提供巨大的优势。你可以在[此处查看我的其他热门编程书籍](http://www.amazon.com/Felix-Alvaro/e/B015JCBZN4/ref=dp_byline_cont_ebooks_1)。\n\
