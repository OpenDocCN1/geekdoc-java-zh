    ### DELETE Statement


    The `DELETE` statement is a DML command that will remove records from a table
    but will still keep its existence in the database. This happens when you don’t
    need a particular information in your database, either because they are obsolete
    or have no use anymore. Thus, you can free up some storage space. You can execute
    the `DELETE` command to remove just one record, multiple records or even all the
    records of the table at one time. Just a reminder, this command does not delete
    values from a specific column, but removes an entire row or a full record. That
    is why you have to be very careful when executing this command. There is a possibility
    that the effect of the `DELETE` command is permanent and you may not be able to
    recover the erased data. The standard syntax for this DML statement is:


    ```sql

    DELETE FROM TABLE_NAME

    [WHERE CONDITION];

    ```


    Even if the `WHERE` clause is an optional part, you are required to include it
    when you want to delete selected rows of data from a certain table. Without the
    `WHERE` clause, you will delete all records.


    To demonstrate the function of the `DELETE` statement, first create a copy of
    `Customer_TBL`:


    1. Go to the `NAVIGATOR` then right-click `Customer_TBL`. Choose `A SIMILAR TABLE`.
    `![](Images/image0034.jpeg)`

    2. You will be asked for a name. Type `Customer_2` inside the `NAME` input. `![](Images/image0035.jpeg)`

    3. Click on `STRUCTURE`. `![](Images/image0036.jpeg)`


    At this point `Customer_2` is empty, so you have to copy the records from `Customer_TBL`.
    To do this:


    1. Click the `![](Images/image00220.jpeg)` option then click the `REFRESH TABLE
    DATA` button `![](Images/image00221.jpeg)` or press `F5` on your keyboard to update
    the data.

    2. Click on the `CustomerID` heading. `![](Images/image0024.jpeg)`

    3. Click on the `DATA` tab. `![](Images/image0025.jpeg)`

    4. Double-click `CustomerID` then `COPY`. `![](Images/image0026.jpeg)`

    5. Click on `Customer_2`. `![](Images/image0027.jpeg)` (Wait, the text says image
    link) `![](Images/image0027.jpeg)` `![](Images/image0027.jpeg)`

    6. Click the `VIEW` tab and make sure you are on the `GRID` view. `![](Images/image0028.jpeg)`

    7. Click the drop arrow beside `INSERT` `![](Images/image0029.jpeg)`. Select `MULTIPLE
    ROWS` option. `![](Images/image0030.jpeg)`

    8. Inside the `NUMBER OF ROWS TO INSERT` box type `5`. `![](Images/image0031.jpeg)`

    9. Your table will now have 5 rows that contain `NULL` values. `![](Images/image0032.jpeg)`

    10. Right-click on the first cell then choose `PASTE`. `![](Images/image0033.jpeg)`

    11. All the data from `Customer_TBL` will be inserted into `Customer_2`. `![](Images/image0034.jpeg)`

    12. Click on `STRUCTURE CHANGES` `![](Images/image0035.jpeg)` to save the data.


    #### Single Record


