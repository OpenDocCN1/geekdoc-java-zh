    data types or simply UDTs. By the name itself, these are the data values that
    the user defines or specifies based on the existing data types. Thus, customization
    is allowed to maximize storage space and meet other user requirements. Furthermore,
    database application development becomes more flexible for programmers. This means
    that you can use UDTs when you need to enter the same type of data in a column
    that will be defined in several tables. To define UDTs, you can use the CREATE
    TYPE statement.


    For example, if you want to define and differentiate USDollar and UKPound as two
    currencies for your database then create the following UDTS:


    CREATE TYPE USDollar AS DECIMAL (9, 2) ;


    CREATE TYPE UKPound AS DECIMAL (9, 2) ;


    Even if both data types were created using the predefined DECIMAL type, each has
    its own function and characteristic in the database. Going back to the sample
    customer and order information from the previous chapters, you can now create
    the following invoice tables that include the two UDTs:


    CREATE TABLE AmericaInvoice (


                                InvoiceID              INTEGER                           
    PRIMARY KEY,


                                CustomerID              INTEGER,


                                OrderID              INTEGER,             


                                TotalSaleAmt              USDollar,


                                ShippingFee              USDollar


                                ) ;


    CREATE TABLE UnitedKingdomInvoice (


                                InvoiceID              INTEGER                           
    PRIMARY KEY,


                                CustomerID              INTEGER,


                                OrderID              INTEGER,             


                                TotalSaleAmt              USDollar,


                                ShippingFee              USDollar


                                ) ;


    In this chapter you have learnt the characteristics of the various data types
    available in the SQL language. You were also able to understand the need to create
    user-defined data types to make your database less complicated and more portable.
    In the next chapter you will learn how to use the different Data Definition Language
    statements in creating database objects using SQLiteStudio.


    # Chapter Five: Data Definition Language Statements


    In this chapter you will gain a deeper understanding of the three Data Definition
    Language statements – CREATE, ALTER and DROP. Using SQLiteStudio, you will also
    learn how to encode the corresponding SQL statements that handle the database
    structure.


    Again, a database object is any defined logical unit that stores or references
    data. When you have a collection of database objects, you create a schema that
    is associated with one particular database owner. The focus of this chapter is
    the basic form of data storage, which is the relational database table. A simple
    table further consists of rows, which corresponds to the records of data, and
    columns, which are also known as fields that contain an assigned particular type
    of data. A database table will always have at least one column and a row that
    is composed of one or more fields.


    CREATE Statement


    The numerous forms of the SQL CREATE statement are responsible for constructing
    vital database structures and objects – tables, views, schemas, domains and so
    on. The act of creating tables could be easy, but you need to take into consideration
    numerous factors. Planning table structures before actual implementation could
    save you time and effort since you do not need to reconfigure after the tables
    have been created.


    Here are some of the factors to take into consideration through when creating
    tables:


    *   Type of data the table will contain


    *   Table and column names


    *   Primary key (the column that makes each row of data unique to avoid duplicate
    records in a table)


    *   Column length


    *   Columns containing null values


    Syntax:


    CREATE TABLE TABLE_NAME


    (field1 DATA_TYPE [not null],


    field2 DATA_TYPE [not null],


    field3 DATA_TYPE [not null],


    field4 DATA_TYPE [not null],


    field5 DATA_TYPE [not null]);


    The column names (field1, field2, field3, field4 and field5) and the field data
    types are written inside the parenthesis, separated by commas. Anything indicated
    inside the brackets are considered optional and the syntax statement finally ends
    with a semicolon.


    Using the CUSTOMER TABLE from Chapter 2, you will create a new database table
    using SQLiteStudio.


    *   Create a New Database


    1.  Open SQLiteStudio by double-clicking the application icon on your desktop.


    ![](Images/image00185.jpeg)


    2.  Click the DATABASE menu then select ADD A DATABASE.


    3.  Type Sample_DB inside the FILE input box (which is the name of the new database)
    then click OK.


    ![](Images/image00186.jpeg)


    4.  You will now have the Sample_DB object inside the Database Navigator pane.


    ![](Images/image00187.jpeg)


    *   Create a New Table


    1.  Click the TOOLS menu then select OPEN SQL EDITOR. You will have the SQL editor
    area at the right pane. If you double-click Sample_DB, you will see TABLES and
    VIEWS  under the database object. Right now, there are no tables nor views present
    so you will create one using the SQL Editor pane.


    ![](Images/image00188.jpeg)


    2.  Under the QUERY Tab, type the following lines of code


    CREATE TABLE Customer_TBL


    (CustomerID INTEGER NOT NULL PRIMARY KEY,


      CustomerName VARCHAR NOT NULL,


      JobPosition VARCHAR,


      CompanyName VARCHAR NOT NULL,


      USState VARCHAR NOT NULL,


      ContactNo BIGINTEGER NOT NULL);


    ![](Images/image00189.jpeg)


    3.  Click the EXECUTE QUERY button ![](Images/image00190.jpeg) on top of the QUERY
    Tab or press F9 on the keyboard. You will now have the Customer_TBL table with
    6 columns.


    ![](Images/image00191.jpeg)


    ALTER Statement


    The SQL ALTER statement is used to modify database objects, specifically tables.
    Altering table elements can include adding and dropping columns, changing column
    definitions, adding and dropping constraints, modifying table storage values and
    more.


    Syntax:


    ALTER TABLE TABLE_NAME [modify] [column COLUMN_NAME]


    [DATA TYPE | null not null]


                  [restrict | cascade]


    [drop] [constraint CONSTRAINT_NAME]


    [add] [column] COLUMN DEFINITION;


    *   Alter a Table by Adding a New Column


    1.  A new column that contains the company address of the customer will be added
    to the Customer_TBL table. Type the following lines of code under the QUERY tab:


    ALTER TABLE Customer_TBL ADD


    CompanyAdd VARCHAR;


    ![](Images/image00192.jpeg)


    2.  After clicking the EXECUTE QUERY button ![](Images/image00193.jpeg), the CompanyAdd
    column is added after the ContactNo column. This field contains values of string
    data type.


    ![](Images/image00194.jpeg)


    DROP Statement


    You use the SQL DROP statement if you want to delete database objects. Thus, the
    DROP TABLE statement is used to delete tables that you do not need anymore. Once
    this line is executed, all the data and metadata contained in the table are also
    removed. DROP TABLE is considered to be the easiest command to execute. However,
    an error will occur if the table to be deleted is being referenced by another
    table in the database. That is why you need to be cautious when performing the
    DROP statement to avoid deleting objects by mistake (most especially if there
    are multiple users who access the database).


    Syntax:


    DROP TABLE TABLE_NAME [restrict | cascade]


    The RESTRICT option is used if an error is to be returned when a table referenced
    by another database object is dropped. On the other hand, the CASCADE option allows
    the table and all other referencing objects to be deleted. There are some SQL
    application programs that do not permit the CASCADE option to guarantee that there
    will be no invalid database objects.


    *   Drop an Existing Table'
