  trans: "\n\n使用 `*` 意味着给定表格的所有列都包含在输出中并显示。`ALL` 选项提取并显示列的所有值，即使是重复。相反，使用关键字 `DISTINCT`\
    \ 可以防止重复行被包含并显示在输出中。跟在 `FROM` 关键字之后的是您想要获取数据的一个或多个表列表。语法中指定的列和表之间均用逗号分隔。\n\n##\
    \ 数据控制语言 (DCL)\n\n数据控制语言（简单称为 `DCL`）由允许您管理数据库内部数据访问的命令组成。此外，通过控制用户权限可以保护数据库免受无意或故意的误用。DCL\
    \ 关注事务，事务会捕获所有执行数据库操作的 SQL 语句并将其保存到日志文件中。以下是常用的 DCL 命令语句：\n\n*   `GRANT` – 该语句为您提供某些权限，例如授予您访问数据库的权限。其语法为：\n\
    \n```\nGRANT PRIVILEGE1, PRIVILEGE2, … TO USER_NAME\n```\n\n*   `REVOKE` – 该语句用于撤销您的权限，例如移除您访问数据库的权限。其语法为：\n\
    \n```\nREVOKE PRIVILEGE1, PRIVILEGE2, … TO USER_NAME\n```\n\n## 事务控制命令\n\n事务控制命令允许用户在维护数据库完整性方面操作各种事务。在\
    \ SQL 中，事务在应用程序执行时开始。第一个事务在 SQL 应用程序启动时开始，最后一个事务在应用程序结束结束。以下是常用的事务控制命令：\n\n* \
    \  `COMMIT` – 该语句通过使您对数据库的更改持久化或简单地保存事务来完成事务。其语法为：\n\n```\nCOMMIT [WORK];\n```\n\
    \n在上一条命令行中，关键字 `WORK` 是可选的。\n\n*   `ROLLBACK` – 该语句的主要功能是将数据库恢复到之前的状态，或撤销事务日志中发生的所有操作。其语法为：\n\
    \n```\nROLLBACK [WORK];\n```\n\n在上一条命令行中，关键字 `WORK` 是可选的。\n\n*   `SAVEPOINT` –\
    \ 该语句与 `ROLLBACK` 命令配合使用，它在事务组内部创建部分或点，您可以在这些点执行 `ROLLBACK` 命令。其语法为：\n\n```\n\
    SAVEPOINT SAVEPOINT_NAME;\n```\n\n## SQLite 安装说明与数据库特性\n\n在您开始让自己忙于各种数据库解决方案和\
    \ SQL 命令行之前，您需要首先确定创建数据库的目的。这将进一步决定其他数据库设计因素，如大小、复杂性、运行应用程序的机器类型、存储介质等。当您开始考虑数据库需求时，您需要知道设计中应该考虑到何种程度的细节。细节过多会导致设计非常复杂，进一步浪费时间、精力，甚至是您计算机的存储空间。细节太少会导致数据库性能低劣、损坏且毫无价值。一旦您完成了设计阶段，就可以决定下载哪种数据库软件来开始您的\
    \ SQL 体验。\n\n为了本电子书的讨论，`SQLite`（一个简单的软件库）将作为入门数据库引擎，用于设计、构建和部署应用程序。`SQLite` 是一款免费且独立的数据库软件，下载快速且易管理，由\
    \ Richard Hipp 及其程序员团队开发。它的设计使其易于配置和实现，完全不需要任何客户端-服务器设置。因此，`SQLite` 被认为是世界上应用最广泛的数据库软件之一。\n\
    \n以下是 `SQLite` 的一些主要特性：\n\n*   事务具有原子性、一致性、隔离性和持久性\n*   编译简单易用\n*   支持系统崩溃和断电\n\
    *   具有完整的 SQL 实现，并带有独立的命令行界面客户端\n*   代码占用极小\n*   可适应并调整到更大的项目\n*   自包含，无外部依赖\n\
    *   可移植性，并支持 Windows、Android、iOS、Mac、Solaris 等其他平台\n\n在用 `SQLite` 时，您需要下载 `SQLiteStudio`\
    \ 作为您的数据库管理器和编辑器。凭借其直观的界面，该软件非常轻量但快速且强大。您甚至不需要安装它，只需下载、解压并运行应用程序即可。在 Windows 10\
    \ 计算机上下载 `SQLiteStudio` 时，请遵循以下简单步骤：\n\n1.  访问 `http://sqlitestudio.pl/?act=about`。您应该看到以下页面：\n\
    \n    ![](img/image00177.jpeg)\n\n2.  检查您计算机操作系统的版本，然后点击相应的链接开始下载软件。\n\n    ![](img/image00178.jpeg)\n\
    \n3.  下载软件后，进入保存应用程序的文件夹（通常是 Windows 中的“下载”文件夹）。点击顶部的“提取”（Extract）选项卡，然后选择“提取所有”（Extract\
    \ all）选项。\n\n    ![](img/image00179.jpeg)\n\n4.  将弹出“提取压缩（Zip）文件夹”对话框。将目标文件夹更改为\
    \ `C:\\SQL`，然后点击“提取”按钮。这将是保存所有 `SQLite` 文件的文件夹。\n\n    ![](img/image00180.jpeg)\n\
    \n5.  一旦所有文件都提取完毕，您将拥有 `SQLiteStudio` 子文件夹。\n\n    ![](img/image00181.jpeg)\n\n\
    6.  在子文件夹中找到名为 `SQLiteStudio` 的程序。若要在桌面上创建快捷方式（以便快速启动程序），请右键点击文件名，选择“发送到”选项，然后选择“桌面（创建快捷方式）”。\n\
    \n    ![](img/image00182.jpeg)\n\n7.  当您双击桌面上的 `SQLiteStudio` 图标时，\n\n    ![](img/image00183.jpeg)\n\
    \n8.  您应该看到以下界面：\n\n    ![](img/image00184.jpeg)\n\n数据库导航（左窗格）显示数据库的所有逻辑单元，如表和视图。右侧的灰色区域是\
    \ SQL 工作区，您将在其中编写查询语句。在随后的章节中，您将对该程序的图形用户界面有更好的了解。\n\n"
- fmt: "\nSince database is a collection of information, it can store names, numbers,\
    \ images, calculations, financial amounts, characters and so on. This stored information\
    \ is what you call data, which you can change or manipulate anytime you want.\
    \ When you start providing rules on how you write and store data, then you are\
    \ dealing with data types. Data types take into consideration the length allocated\
    \ by the database for every column in the table and what values it could contain\
    \ - whether it is alphanumeric, just numbers, graphics, date or time. By defining\
    \ what data is stored in each database field, you are preventing the occurrence\
    \ of data entry errors. This form of validation that controls incorrect data to\
    \ be entered into the database is also called field definition.\n\nEach database\
    \ field will have a specific value if it contains a data item. There are times,\
    \ however, that a certain field does not have any data item at all. In this case,\
    \ the field’s value is considered `null` - meaning the value is not known. This\
    \ `null` value is different from the numeric zero value or the blank character\
    \ value, since zeroes and blanks are definite values. The following are scenarios\
    \ when you may have a `null` value:\n\n- You don’t know what the value is yet\
    \ even if it possibly exists.\n- The value does not exist yet.\n- The value is\
    \ out of range.\n- The field is not applicable for a particular row.\n\n### Types\
    \ of Data\n\nThe following are the general data types predefined in the `SQL`\
    \ language (that are further categorized into subtypes):\n\n- **Numeric** – The\
    \ value defined by the numeric data type is some kind of a number, which could\
    \ either be expressed with an exact or just an approximate value.\n    - **Exact\
    \ Numeric**\n        - `INTEGER` – This consists only of whole numbers that are\
    \ both positive and negative. It does not contain a decimal nor a fractional part.\
    \ The value ranges from -2,147,483,648 to 2,147,483,647, with an allocated 4 bytes\
    \ of storage size.\n        - `SMALLINT` – This is used in replacement of integers\
    \ to save storage space, but with a precision that cannot be larger than that\
    \ of an integer. Precision in computer programming is the maximum total of significant\
    \ digits a number can have. The value ranges from -32,768 to +32,767, with an\
    \ allocated 2 bytes of storage size.\n        - `BIGINT` – This is the reverse\
    \ of the `SMALLINT`, where its minimum precision is the same as the `INTEGER`\
    \ data type or greater. The value ranges from -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807,\
    \ with an allocated 8 bytes of storage size.\n        - `NUMERIC(p, s)` – In addition\
    \ to the integer part, this data type also contains a fractional component that\
    \ indicates the precision and scale of the value. Scale is the number of digits\
    \ or places reserved in a fractional part of data, located at the right side of\
    \ the decimal point. In `NUMERIC(p, s)`, `p` specifies the precision while `s`\
    \ is for the scale. For example, `NUMERIC(6, 3)` means that the number’s absolute\
    \ value will only be up to 999.999 (6 total significant digits with 3 digits following\
    \ the decimal point).\n        - `DECIMAL(p, s)` – Like the `NUMERIC` data type,\
    \ this has a fractional component where you can specify both the value precision\
    \ and scale. However, this data type allows greater precision. For example, `DECIMAL(6,\
    \ 3)` can contain values up to 999.999 but the database will still accept values\
    \ larger than 999.999. Let us say you entered the number 123.4564, this will be\
    \ rounded off to 123.456. The allocated storage size for this data type is based\
    \ on the given precision.\n    - **Approximate Numeric**\n        - `REAL(s)`\
    \ – This consists of a single-precision, floating-point number where the decimal\
    \ point can “float” to different places in the said number. This means that this\
    \ data type’s decimal value has a limitless precision and a scale of variable\
    \ lengths. For example, the values for `π` (pi) can include 3.14159, 3.14 and\
    \ 3.1 (each value has its own precision). For single-precision, floating point\
    \ numbers, their precision is between 1 and 21 inclusive. It also allocates 4\
    \ bytes of storage size for its values.\n        - `DOUBLE PRECISION(p, s)` –\
    \ This consists of a double-precision, floating-point number and the capacity\
    \ is twice of the `REAL` data type. This data type comes in handy when you require\
    \ more precise numbers, like in most scientific field of disciplines. For double-precision,\
    \ floating point numbers, their precision is between 22 and 53 inclusive. It also\
    \ allocates 8 bytes of storage size for its values.\n        - `FLOAT(p, s)` –\
    \ This is the data type that allows you to specify the precision and lets the\
    \ computer decide whether you will go for a single- or a double-precision. It\
    \ actually pertains to both `REAL` and `DOUBLE PRECISION`, depending on the precision\
    \ you have specified. Because of this characteristic, it is easier to move the\
    \ database from one computer platform to another.\n- **String** – The string data\
    \ type stores alphanumeric information and is also considered as one of the most\
    \ commonly used data types.\n    - `CHARACTER(n)` or `CHAR(n)` – This data type\
    \ is also known as fixed-length. The maximum length for this type is 255. If the\
    \ string is less than `n`, SQL fills the remaining spaces with blanks. The maximum\
    \ length for this is 255.\n    - `CHARACTER VARYING(n)` or `VARCHAR(n)` – This\
    \ is used when the data entries are of different lengths, or not constant, but\
    \ you don’t want SQL to fill the remaining spaces. The maximum length is 3276.\n\
    \    - `CHARACTER LARGE OBJECT` (`CLOB`) – Introduced in `SQL:1999`, this variable-length\
    \ data type is used to contain unicode character-based information that is too\
    \ big to be stored as a `CHARACTER`, such as large documents. The maximum size\
    \ is 4GB.\n- **Date and Time** – This data type manages any information concerning\
    \ dates and times.\n    - `DATE` – This data type provides storage for the year,\
    \ month and day values, in that particular order. The year value is expressed\
    \ using four digits, which can be represented by any value ranging from 0001 to\
    \ 9999. As for the month and day values, they are both expressed using two digits.\
    \ The format for the date data type is `yyyy-mm-dd`.\n    - `TIME` – This data\
    \ type stores and displays time values with an hour-minute-second format (`HH:MM:SS`).\n\
    \    - `DATETIME` – When the value contains both date and time information then\
    \ you use the `DATETIME` data type, which is displayed using the `YYYY-MM-DD HH:MM:SS`\
    \ format. The valid range of values for this type is from `1000-01-01 00:00:00`\
    \ to `9999-12-31 23:59:59`.\n    - `TIMESTAMP` – This is similar to the `DATETIME`\
    \ data type but the range of values is `1970-01-01 00:00:01` UTC to `2038-01-19\
    \ 03:14:07` UTC.\n- **Boolean** – This data type consists of values that are used\
    \ for data comparison: `TRUE`, `FALSE`, or `NULL`. For data to be returned, all\
    \ the conditions of the specified criteria for a given query should be met – meaning\
    \ the Boolean value is `TRUE`. If data is not returned, then the value is either\
    \ `FALSE` or `NULL`.\n\n### User-Defined Data Type\n"
  raw: 'Since database is a collection of information, it can store names, numbers,
    images, calculations, financial amounts, characters and so on. This stored information
    is what you call data,  which you can change or manipulate anytime you want. When
    you start providing rules on how you write and store data, then you are dealing
    with data types. Data types take into consideration the length allocated by the
    database for every column in the table and what values it could contain - whether
    it is alphanumeric, just numbers, graphics, date or time. By defining what data
    is stored in each database field, you are preventing the occurrence of data entry
    errors. This form of validation that controls incorrect data to be entered into
    the database is also called field definition.


    Each database field will have a specific value if it contains a data item. There
    are times, however, that a certain field does not have any data item at all. In
    this case, the field’s value is considered null  - meaning the value is not known.
    This null value is different from the numeric zero value or the blank character
    value, since zeroes and blanks are definite values. The following are scenarios
    when you may have a null value:


    *   You don’t know what the value is yet even if it possibly exists. 


    *   The value does not exist yet.


    *   The value is out of range.


    *   The field is not applicable for a particular row.


    Types of Data


    The following are the general data types predefined in the SQL language (that
    are further categorized into subtypes):


    *   Numeric – The value defined by the numeric data type is some kind of a number,
    which could either be expressed with an exact or just an approximate value.


    *   *   Exact Numeric


    *   *   *   INTEGER – This consists only of whole numbers that are both positive
    and negative. It does not contain a decimal nor a fractional part. The value ranges
    from -2,147,483,648 to 2,147,483,647, with an allocated 4 bytes of storage size.


    *   *   *   SMALLINT –  This is  used in replacement of integers  to save storage
    space,  but with a precision that cannot be larger than that of an integer. Precision
    in computer programming is the maximum total of significant digits a number can
    have. The value ranges from -32,768 to +32,767, with an allocated 2 bytes of storage
    size.


    *   *   *   BIGINT – This is the reverse of the SMALLINT, where its minimum precision
    is the same as the INTEGER data type or greater. The value ranges from -9,223,372,036,854,775,808
    to 9,223,372,036,854,775,807, with an allocated 8 bytes of storage size.


    *   *   *   NUMERIC  (p, s) – In addition to the integer part, this data type
    also contains a fractional component that indicates the precision and scale of
    the value. Scale is the number of digits or places reserved in a fractional part
    of the data, located at the right side of the decimal point. In NUMERIC (p, s),
    ‘p’ specifies the precision while ‘s’ is for the scale. For example, NUMERIC (6,
    3) means that the number’s absolute value will only be up to 999.999 (6 total
    significant digits with 3 digits following the decimal point).


    *   *   *   DECIMAL (p, s) – Like the NUMERIC data type, this has a fractional
    component where you can specify both the value precision and scale. However, this
    data type allows greater precision. For example, DECIMAL (6, 3) can contain values
    up to 999.999 but the database will still accept values larger than 999.999\.
    Let us say you entered the number 123.4564, this will be rounded off to 123.456\.
    The allocated storage size for this data type is based on the given precision.


    *   *   Approximate Numeric


    *   *   *   REAL (s) – This consists of a single-precision, floating-point number
    where the decimal point can “float” to different places in the said number. This
    means that this data type’s decimal value has a limitless precision and a scale
    of variable lengths. For example, the values for π (pi) can include 3.14159, 3.14
    and 3.1 (each value has its own precision). For single-precision, floating point
    numbers, their precision is between 1 and 21 inclusive. It also allocates 4 bytes
    of storage size for its values.


    *   *   *   DOUBLE PRECISION (p, s) – This consists of a double-precision, floating-point
    number and the capacity is twice of the REAL data type. This data type comes in
    handy when you require more precise numbers, like in most scientific field of
    disciplines. For double-precision, floating point numbers, their precision is
    between 22 and 53 inclusive. It also allocates 8 bytes of storage size for its
    values.


    *   *   *   FLOAT (p, s) – This is the data type that allows you to specify the
    precision and lets the computer decide whether you will go for a single- or a
    double-precision. It actually pertains to both REAL and DOUBLE PRECISION, depending
    on the precision you have specified. Because of this characteristic, it is easier
    to move the database from one computer platform to another.


    *   String – The string data type stores alphanumeric information and is also
    considered as one of the most commonly used data types.


    *   *   CHARACTER (n) or CHAR (n) – This data type is also known as a fixed-length
    string or a constant character. This means that all the strings stored in that
    particular column have the same length, which is represented by ‘n’  (the number
    of characters or the maximum allocated length for the defined field). For example,
    if you set the column’s data type to CHAR (23) then the maximum length of any
    data entered in the field is 23 characters. If the string’s length is less than
    23, then SQL fills the remaining spaces with blanks. This is the drawback of using
    fixed-length strings because storage space is wasted. On the other hand, if there
    is no value provided for ‘n’, then SQL assumes a length of one character. The
    maximum length for the CHARACTER data type is 254.


    *   *   CHARACTER VARYING (n) or VARCHAR (n) – This is used when the data entries
    are of different lengths, or not constant, but you don’t want SQL to fill the
    remaining spaces with blanks. Thus, the exact number of characters you enter will
    be stored in the database - further saving storage space. This data type has no
    default value and its maximum length is 32,672 characters.


    *   *   CHARACTER LARGE OBJECT (CLOB) – Introduced in SQL:1999, this variable-length
    data type is used to contain unicode character-based information that is too big
    to be stored as a CHARACTER type, such as large documents. The maximum value of
    a CLOB is up to 2,147,483,647 characters long.


    *   Date and Time – This data type manages any information concerning dates and
    times.


    *   *   DATE – This data type provides storage for the year, month and day values
    of a date, in that particular order. The year value is expressed using four digits,
    which can be represented by any value ranging from 0001 up to 9999\. As for the
    month and day values, they are both expressed using two digits. The format for
    the date data type is yyyy-mm-dd.


    *   *   TIME – This data type stores and displays time values with an hour-minute-second
    format (“HH:MM:SS”).


    *   *   DATETIME – When the value contains both date and time information then
    you use the DATETIME data type, which is displayed using the “YYYY-MM-DD HH:MM:SS”
    format. The valid range of values for this type is from “1000-01-01 00:00:00”
    to “9999-12-31 23:59:59”.


    *   *   TIMESTAMP – This is similar to the DATETIME data type but the range of
    values is from “1970-01-01 00:00:01” UTC to “2038-01-19 03:14:07” UTC.


    *   Boolean – This data type consists of values that are used for data comparison:
    TRUE, FALSE, or NULL.  For data to be returned, all the  conditions  of the specified
    criteria for a given query should be met – meaning the Boolean value is TRUE.
    If data is not returned, then the value is either FALSE or NULL.


    User-Defined Data Type'
