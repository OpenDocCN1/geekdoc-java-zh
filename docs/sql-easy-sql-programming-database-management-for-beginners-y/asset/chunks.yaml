    VALUES (5, ‘Mike Armhs’, ‘1 Driving School’, ‘NJ’, 2011234567)

    ```


    ![](img/image00212.jpeg)


    2. 点击 `QUERY` 标签页顶部的 `EXECUTE QUERY` 按钮 ![](img/image00213.jpeg)。


    3. 转到 Images/image00214.jpeg)选项，然后点击 `REFRESH TABLE DATA` ![](img/image00215.jpeg)。注意，由于你没有为
    `JobPosition` 字段提供任何信息，它包含一个 NULL 值。


    ![](img/image00216.jpeg)


    ## UPDATE 语句


    由于变化不可避免的，SQL 提供了一种让你更新存储在数据库中的现有数据的方法。根据你的需求，可以使用 `UPDATE` 命令一次修改单条或多条记录。然而，通常数据库中一次只更新一个表。该
    DML 语句的标准语法为：


    ```

    UPDATE TABLE_NAME

    SET column_1 = EXPRESSION_1,

    column_2 = EXPRESSION_2,

    ...

    column_n = EXPRESSION_N

    [WHERE predicates];

    ```


