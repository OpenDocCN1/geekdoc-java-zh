  trans: "\n上图显示，那些部分依赖于主键 `EmployeeID` 的属性已从 `EMPLOYEE_TBL` 中移除，并存储在一个名为 `EMPLOYEE_SALARY_TBL`\
    \ 的新表中。保留在原表中的属性完全依赖于主键——这意味着对于每一条姓、名、地址和合同编号的记录，都有一个对应的特定员工 ID。与 `EMPLOYEE_SALARY_TBL`\
    \ 不同，特定的员工 ID 并不引用唯一的员工职位或薪资率。可能多个具有相同职位（`EmpPosition`）、工资率（`Payrate`）和奖金（`Bonus`）的员工。\n\
    \n![](img/image00332.gif)\n\n对于 `CUSTOMER_TBL` 表，客户订单信息并不直接依赖原表中的通用客户信息。这就是为什么四个属性（`OrderID`、`OrderDate`、`ProductID`\
    \ 和 `OrderQty`）被移动名为 `ORDER_TBL` 的独立表中。\n\n### 第三范式 (3NF)\n\n在第三范式（`3NF`）中，你必须从表中分离完全不依赖主键的信息。回到\
    \ `CUSTOMER_TBL`，职位（`JobPosition`）及其描述（`JobDescription`）完全独立于主键 `CustomerID`。这是因为，通常情况下，无论客户是谁，任何职位都具有相同的职责和责任。因此，我们将\
    \ `JobPosition` 和 `JobDescription` 属性分离到另一个名为 `POSITION_TBL` 的表中。\n\n![](img/image00333.jpeg)\n\
    \n在本章中，你学习了可以应用以提高数据库性能的设计实践。通过在表分配分配主键和外键，避免了重复的数据值。通过实现表索引提高了搜索查询效率。由于归一化过程，数据一致性和安全性得到了提高。因此，整体数据库结构得到了增强。在下一章中，你将学习\
    \ SQL 设计中的一些高级主题，包括游标、触发器和错误。\n\n# 第十一章：数据库高级主题\n\n在本章中，你将介绍一些超出基础数据库事务的 SQL 高级主题。即使该部分只包含游标、触发器和错误的概述，这些知识也可能帮助你扩展\
    \ SQL 实现的功能。\n\n## 游标 (Cursors)\n\n通常，SQL 命令使用基于集合的操作来处理数据库对象。这意味着事务是在一组或一个数据块上执行的。而游标则是每次处理表中的某行数据。它使用复合语句创建，并在退出时销毁。声明游标的标准语法如下（可能根据每个实现而有所不同）：\n\
    \n```\nDECLARE CURSOR CURSOR_NAME\nIS {SELECT_STATEMENT}\n```\n\n只有在游标被声明或定义后，你才能对游标执行操作。\n\
    \n### 打开游标\n\n一旦声明，你就可以执行 `OPEN` 操作来访问该游标，然后执行指定的 `SELECT` 语句。`SELECT` 查询的结果将保存在内存的某个区域中。打开游标的标准语法为：\n\
    \n```\nOPEN CURSOR_NAME;\n```\n\n### 从游标中获取数据\n\n如果你想从游标中检索查询结果或数据，则执行 `FETCH`\
    \ 语句。获取数据的标准语法为：\n\n```\nFETCH NEXT FROM CURSOR_NAME [INTO FETCH_LIST]\n```\n\n\
    在 SQL 编程中，方括号内的可选语句允许你将检索到的数据赋值给特定的变量。\n\n### 关闭游标\n\n当你打开特定的游标时，有一个相应的 `CLOSE`\
    \ 语句要执行。一旦游标关闭，所有使用的名称和资源都将被释放。因此，游标不再供程序使用。关闭游标的标准语法为：\n\n```\nCLOSE CURSOR_NAME\n\
    ```\n\n## 触发器 (Triggers)\n\n在某些情况下，你希望在执行某些特定操作后发生某些 SQL 操作或事务。这种场景描述了一个触发另一个\
    \ SQL 语句发生的 SQL 语句。本质上，触发器是编译在数据库中的 SQL 过程，它根据之前发生的其他事务执行某些事务。此类触发器可以在 DML 语句（`INSERT`、`DELETE`\
    \ 和 `UPDATE`）执行之前或之后执行。此外，触发器可以验证数据完整性、维护数据一致性、回滚事务、记录操作、修改和读取不同数据库中的值。\n\n###\
    \ 创建触发器\n\n创建触发器的标准语法为：\n\n```\nCREATE TRIGGER TRIGGER_NAME\n TRIGGER_ACTION_TIMETRIGGER_EVENT\n\
    ON TABLE_NAME\n[REFERENCING OLD_OR_NEW_VALUE_ALIAS_LIST]\nTRIGGERED_ACTION\n```\n\
    \n- `TRIGGER_NAME` - 此对象的唯一标识名称\n- `TRIGGER_ACTION_TIMETRIGGER_EVENT` - 触发动作发生的指定时间（无论是在触发事件之前还是之后）。\n\
    - `TABLE_NAME` – 指定 DML 语句的表\n- `TRIGGERED_ACTION` – 指定一旦触发事件后要执行的动作\n\n一旦创建了触发器，就无法再修改。你只能重新创建或替换它。触发器的工作方式取决于你指定的条件——是在\
    \ DML 语句触发时执行一次，还是对受 DML 语句影响的每行执行多次。\n\n### 删除触发器\n\n删除触发器的基本语法与删除表或视图相同：\n\n\
    ```\nDROP TRIGGER;\n```\n\n## 错误 (Errors)\n\n无错误的设计或实现是任何编程语言的最终目标之一。你可以通过不遵守命名规范、错误地编写代码（如缺少单引号或括号）或者输入的数据与定义类型不匹配来产生错误。\n\
    \n为了简化处理，SQL 设计了一种返回错误信息的方法，以便程序员能够了解发生的情况并采取相应措施。此类错误处理机制包括状态 `SQLSTATE` 和 `WHENEVER`\
    \ 子句。\n\n### SQLSTATE\n\n状态参数或主机变量 `SQLSTATE` 是一种包含多种异常情况的错误处理工具。它是由五个字符组成的字符串，前两个字符表示类代码，后三个字符是子类代码。类代码识别\
    \ SQL 语句完成后的状态——无论是否成功（如果不成功，则返回主要的错误类型之一）。子类代码还指示了有关 SQL 执行执行的补充信息。\n\n`SQLSTATE`\
    \ 每次操作都会更新。如果值为 `00000`（五个零），则意味着执行成功，你可以继续后续操作。如果它包含除 `00000` 以外的五个字符，则你需要检查代码行以修复提交的错误。\n\
    \n### WHENEVER 子句\n\n`WHENEVER` 子句错误处理机制关注执行中的异常。通过这种方式，错误被承认，并为程序员提供了修正的机会。这比发生错误时无法做任何事情要好。如果你无法修复或撤销已提交的错误，可以优雅地终止应用程序。\n\
    \n`WHENEVER` 子句写在可执行的 SQL 代码之前，具体位于 SQL 声明部分。\n"
