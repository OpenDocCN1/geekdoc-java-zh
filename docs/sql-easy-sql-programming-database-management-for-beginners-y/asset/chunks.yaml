    \n使用 `SELECT` 语句检索特定表的所有记录是该 DML 命令语句的基本形式。即使 `SELECT` 命令被认为是最强大的语句，它也需要其他子句才能在执行查询时正常运行。其最简单形式的语法为：\n\
    \n```sql\nSELECT * FROM TABLE_NAME;\n```\n\n在上面的编程行中，星号符号 `*` 代表所有。这意味着通配符字符是列出特定表所有列名的简写。\n\
    \n要从 `Customer_TBL` 表中选择所有数据行：\n\n1. 点击 ![](img/image00263.jpeg) 选项，然后输入以下代码：\n\
    \n```sql\nSELECT * FROM Customer_TBL;\n```\n\n2. 点击 `EXECUTE QUERY` 按钮 ![](img/image00218.jpeg)。此\
    \ `SELECT` 命令的结果显示在 `GRID VIEW` 标签页中。\n\n![](img/image00264.jpeg)\n\n结果基本上显示了\
    \ `Customer_TBL` 表的所有数据，因为代码指示数据库选择该表的所有行和列。\n\n## WHERE 语句\n\n当你想要更具体地从数据库表中选择数据行时，你就需要为你的编程行增加一些复杂度。此时，你需要\
    \ `WHERE` 子句的功能，这意味着只有当子句内指定的条件为真时，才会执行 `SELECT` 操作。带有 `WHERE` 子句的 `SELECT` 语句语法如下：\n\
    \n```sql\nSELECT COLUMN_LIST\nFROM TABLE_NAME\nWHERE CONDITION;\n```\n\n仅选择客户职位为副总裁（Vice-President）的数据行：\n\
    \n1. 点击 ![](img/image00263.jpeg) 选项，然后输入以下代码：\n\n```sql\nSELECT *\nFROM Customer_TBL\n\
    WHERE JobPosition = ‘Vice-President’;\n```\n\n2. 点击 `EXECUTE QUERY` 按钮 ![](img/image00265.jpeg)。此\
    \ `SELECT` 命令的结果显示在 `GRID VIEW` 标签页中。\n\n![](img/image00266.jpeg)\n\n结果显示了名为 Kevin\
    \ Lord 和 Mike Armhs 的两位客户的记录，他们都是各自公司的副总裁。\n\n如果你只想选择表的某些列，可能只是客户的全名和公司名称呢？你现在将你的代码行修改如下：\n\
    \n1. 在 `QUERY` 标签页中，通过输入以下内容将通配符 `*`（星号）改为 `CustomerName` 和 `CompanyName`：\n\n\
    ```sql\nSELECT CustomerName, CompanyName\nFROM Customer_TBL\nWHERE JobPosition\
    \ = ‘Vice-President’;\n```\n\n2. 点击 `EXECUTE QUERY` 按钮 ![](img/image00267.jpeg)。此\
    \ `SELECT` 命令的结果显示在 `GRID VIEW` 标签页中。\n\n![](img/image00268.jpeg)\n\n通过指定指定的列，你正在自定义要检索的数据。\n\
    \n## ORDER BY 和 GROUP BY 语句\n\n当你希望检索的数据能够以某种方式显示并排序时，你需要在语句末尾包含 `ORDER BY` 或\
    \ `GROUP BY`。`ORDER BY` 语句的主要功能是用特定顺序排列数据，无论是升序还是降序。另一方面，`GROUP BY` 语句用于将相同的数据放在一起。\n\
    \n`ORDER BY` 的的标准语法为：\n\n```sql\nSELECT COLUMN_LIST\nFROM TABLE_NAME\nORDER BY\
    \ COLUMN_LIST [ASC | DESC];\n```\n\n默认情况下，`ORDER BY` 按升序排列行。如果你希望按降序排列记录，则需要在\
    \ `ORDER BY` 子句末尾指示 `DESC`。\n\n从 `Customer_TBL` 表中检索所有客户记录并按州升序显示：\n\n1. 点击 ![](img/image00259.jpeg)\
    \ 选项，然后输入以下代码：\n\n```sql\nSELECT *\nFROM Customer_TBL\nORDER BY USState;\n```\n\
    \n2. 点击 `EXECUTE QUERY` 按钮 ![](img/image00203.jpeg)。此 `SELECT` 命令的结果显示在 `GRID\
    \ VIEW` 标签页中。\n\n![](img/image00269.jpeg)\n\n由于你没有指定排序方式，数据行是使用 `USState` 列升序排列的。如果你希望按降序排序记录：\n\
    \n1. 在 `QUERY` 标签页中，在 `USState` 之后添加 `DESC`。\n\n```sql\nSELECT *\nFROM Customer_TBL\n\
    ORDER BY USState DESC;\n```\n\n2. 点击 `EXECUTE QUERY` 按钮 ![](img/image00270.jpeg)。此\
    \ `SELECT` 命令的结果显示在 `GRID VIEW` 标签页中。\n\n![](img/image00271.jpeg)\n\n如果你想对一组记录确定某些信息，或者需要以逻辑方式合并具有重复值的列，那么就是使用\
    \ `GROUP BY` 子句的时候了。与分组类似的术语还有聚合、总结和汇总。为了说明，如果你想知道 `Customer_TBL` 表中每个职位有多少客户，那么我们需要统计记录数并显示每个职位的客户总数。\n\
    \n```sql\nSELECT JobPosition, COUNT(*) AS number_of_record\nFROM Customer_TBL\n\
    GROUP BY JobPosition;\n```\n\n"
- fmt: "\n![](Images/image00272.jpeg)\n\nIn the example above, the `COUNT` function\
    \ was introduced to arrange the data in groups. The following is a summary of\
    \ the common aggregate functions used together with the `GROUP BY` statement (`x`\
    \ denotes the column name where you want to perform the function):\n\n*   `AVG(x)`\
    \ – computes the average of all the column values (null values removed)\n*   `COUNT(x)`\
    \ – counts the number of non-null values in the column\n*   `COUNT(*)` – counts\
    \ the number of records\n*   `MAX(x)` – computes the maximum value in the column\
    \ (null values removed)\n*   `MIN(x)` - computes the minimum value in the column\
    \ (null values removed)\n*   `SUM(x)` – computes the sum or total of the values\
    \ in the column (null values ignored)\n\nGoing back to the `GROUP BY` example,\
    \ the data in the `JobPosition` column is retrieved and for each instance of the\
    \ value, a record is counted using the `COUNT` function. The `number_of_record`\
    \ is a new column created that displays the total number of records per job position.\
    \ The Director, Manager and President positions have 1 record each while the Vice-President\
    \ has 2. This is because there are two customers who are vice-presidents – Kevin\
    \ Lord and Mike Armhs. If you can also notice, the records displayed are sorted\
    \ in an ascending order by default.\n\nAltering your SQL statements to display\
    \ the job position in a descending order will require you to add the `ORDER BY`\
    \ statement after the `GROUP BY` clause (`ORDER BY` will always come after the\
    \ `GROUP BY` statement). Change your lines of code into the following and then\
    \ click the `EXECUTE QUERY` button ![](Images/image00270.jpeg) on top of the QUERY\
    \ tab:\n\n```sql\nSELECT JobPosition, COUNT(*) AS number_of_record\nFROM Customer_TBL\n\
    GROUP BY JobPosition\nORDER BY JobPosition DESC;\n```\n\n![](Images/image00273.jpeg)\n\
    \nIn this chapter you have learnt how to encode programming lines using the most\
    \ commonly used DQL command statements in selecting, ordering and grouping records\
    \ from database tables in SQL. In the next chapter you will learn the different\
    \ transactional control commands that will allow you to manage several relational\
    \ database transactions.\n\n# Chapter Eight: Transactional Control Commands\n\n\
    In this chapter you will learn how to use three of the available transactional\
    \ control commands in a relational database management system (RDBMS) using SQLiteStudio\
    \ – `COMMIT`, `ROLLBACK` and `SAVEPOINT`. Controlling transactions requires you\
    \ to be able to manage certain database changes that are usually brought about\
    \ by the `insert`, `update` and `delete` commands.\n\nExecuting a database transaction\
    \ seems to have been successfully completed when you notice that the table’s data\
    \ or structure has been changed. What is actually happening during a transaction\
    \ execution is that information is stored in a temporary space in the database\
    \ (or what you can call a rollback area). When you want to finalize these transactions\
    \ and store the information permanently, then you either save or discard the changes\
    \ made to the database tables by issuing the appropriate transactional control\
    \ command. Only then that the rollback area is emptied.\n\n## COMMIT Command\n\
    \nUsing the `COMMIT` command saves all the transactions into your database. Normally,\
    \ in SQLiteStudio, whenever you execute a `CREATE`, `INSERT` or `DELETE` transaction\
    \ by writing programming lines in the SQL Editor, the changes are automatically\
    \ saved. You have first encountered the `COMMIT` command through the `COMMIT CHANGES\
    \ STRUCTURE` button in Chapter 6, where you created a copy of the `Customer_TBL`\
    \ table. Now, to demonstrate this command again in SQLiteStudio, you will manipulate\
    \ the table structure by adding a new record to the `Customer_TBL` table in `GRID\
    \ VIEW` mode.\n\n1. Click the ![](Images/image00263.jpeg) option. To ensure that\
    \ there are no transactions currently running in the database, type the following\
    \ programming line in the QUERY tab then click the `EXECUTE QUERY` button ![](Images/image00218.jpeg):\n\
    \n```sql\nEND TRANSACTION;\n```\n\n![](Images/image00274.jpeg)\n\n2. Double-click\
    \ `Customer_TBL` under the `TABLES` list in the `DATABASE NAVIGATOR` pane. Click\
    \ the `DATA` tab at the right and make sure that the `GRID View` is displayed.\
    \ You will see all the records of the `Customer_TBL` table.\n\n![](Images/image00275.jpeg)\n\
    \n3. Click the first column of the last row of the table, which is `CustomerID`\
    \ 5.\n\n![](Images/image00276.jpeg)\n\n4. Click the drop-down arrow beside the\
    \ `INSERT ROW (INS)` button and select `PLACE NEW ROWS BELOW SELECTED ROW` option.\n\
    \n![](Images/image00277.jpeg)\n\n5. This time click the `INSERT ROW (INS)` button\
    \ and you will see a new empty row added to the table.\n\n![](Images/image00278.jpeg)\n\
    \n6. Add the following data values in the new record:\n   *   `CustomerID`: 6\n\
    \   *   `CustomerName`: JOHN DEPP\n   *   `JobPosition`: President\n   *   `CompanyName`:\
    \ Rockers Mine Company\n   *   `USState`: Rockers Mine\n\n7. Click the `COMMIT`\
    \ button ![](Images/image00279.jpeg) to save the new data.\n\n## ROLLBACK Command\n\
    \nIf the `COMMIT` command saves all the transactions into your database, the `ROLLBACK`\
    \ command is the reverse where all the unsaved changes will be discarded. However,\
    \ you can only undo transactions since the last `COMMIT` or `ROLLBACK` statement.\
    \ Also, before you can perform a `ROLLBACK` command, make sure that transactions\
    \ have started. This means you need to execute the following statement at the\
    \ beginning:\n\n```sql\nBEGIN TRANSACTION;\n```\n\nTo demonstrate how a `ROLLBACK`\
    \ statement works, you will execute the `DROP TABLE` command in SQLiteStudio:\n\
    \n1. Click the ![](Images/image00281.jpeg) option. In the QUERY tab, type the\
    \ following programming statement and click the `EXECUTE QUERY` button ![](Images/image00218.jpeg):\n\
    \n```sql\nBEGIN TRANSACTION;\n```\n\n![](Images/image00282.jpeg)\n\n2. Click the\
    \ ![](Images/image00283.jpeg) option and clear the QUERY tab. Type the following\
    \ and then click the `EXECUTE QUERY` button ![](Images/image00218.jpeg). You will\
    \ notice that the `Customer_TBL` table is now removed from the list:\n\n```sql\n\
    DROP TABLE Customer_TBL;\n```\n\n![](Images/image00284.jpeg)\n\n3. Click the ![](Images/image00285.jpeg)\
    \ option again and clear the QUERY tab. Type the following and then click the\
    \ `EXECUTE QUERY` button ![](Images/image00218.jpeg):\n\n```sql\nROLLBACK;\n```\n\
    \n![](Images/image00286.jpeg)\n\n4. To check if the `ROLLBACK` command reversed\
    \ the deletion of the `Customer_TBL` table, right-click anywhere inside the `DATABASE\
    \ NAVIGATOR` pane. Choose `REFRESH ALL DATABASE SCHEMAS` option.\n\n5. Click the\
    \ `TABLE` list at the left pane. You should now see that the `Customer_TBL` table\
    \ is back.\n\n![](Images/image00287.jpeg)\n\n## SAVEPOINT Command\n\nWhen you\
    \ want to reverse the transaction just back to a certain point and not the entire\
    \ transaction, then you have to execute the `SAVEPOINT` command before performing\
    \ a `ROLLBACK` action. This is how you manage several transactions into smaller\
    \ groups of SQL commands. The standard syntax for this transactional control command\
    \ is:\n\n```sql\nSAVEPOINT SAVEPOINT_NAME;\n```\n\nWhen using the `SAVEPOINT`\
    \ and the `ROLLBACK` commands together, the syntax is:\n\n```sql\nROLLBACK TO\
    \ SAVEPOINT_NAME;\n```\n\nA savepoint name can be the same as the database object’s\
    \ name to which you will be performing the SQL transactions. However, you should\
    \ remember to make them unique, different from the group of transactions that\
    \ you want to break down into several points or segments.\n\nTo demonstrate how\
    \ a `SAVEPOINT` with a `ROLLBACK` command works, you will delete certain records\
    \ from the `Customer_TBL` table and reverse this transaction.\n\n1. Click the\
    \ ![](Images/image00250.jpeg) option. In the QUERY tab, type the following programming\
    \ statement and click the `EXECUTE QUERY` button ![](Images/image00196.jpeg):\n\
    \n```sql\nBEGIN TRANSACTION;\n```\n\n![](Images/image00289.jpeg)\n"
