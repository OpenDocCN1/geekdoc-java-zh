    \ UDTs。要定义 UDTs，你可以使用 `CREATE TYPE` 语句。\n\n例如，如果你想为你的数据库定义 `USDollar`（美元）和 `UKPound`（英镑）这两种货币并进行区分，请创建以下\
    \ UDTs：\n\n```sql\nCREATE TYPE USDollar AS DECIMAL (9, 2) ;\nCREATE TYPE UKPound\
    \ AS DECIMAL (9, 2) ;\n```\n\n即使这两个数据类型都是使用预定义的 `DECIMAL` 类型创建的，它们在数据库中各有独立的功能和特性。回到之前章节中的客户和订单信息示例，你现在可以创建以下包含这两个\
    \ UDT 的发票表：\n\n```sql\nCREATE TABLE AmericaInvoice (\n    InvoiceID INTEGER PRIMARY\
    \ KEY,\n    CustomerID INTEGER,\n    OrderID INTEGER,\n    TotalSaleAmt USDollar,\n\
    \    ShippingFee USDollar\n);\n\nCREATE TABLE UnitedKingdomInvoice (\n    InvoiceID\
    \ INTEGER PRIMARY KEY,\n    CustomerID INTEGER,\n    OrderID INTEGER,\n    TotalSaleAmt\
    \ USDollar,\n    ShippingFee USDollar\n);\n```\n\n在本章中，你学习了 SQL 语言中提供的各种数据类型的特性。你还理解了创建用户定义数据类型的必要性，这使你的数据库不再复杂且更于移植。在下一章节中，你将学习如何使用不同的数据定义语言（DDL）语句来创建数据库对象。\n\
    \n# 第五章：数据定义语言\n\n在本章中，你将深入理解三个数据定义语句——`CREATE`、`ALTER` 和 `DROP`。通过 SQLiteStudio，你还将学习如何编写处理数据库结构的相应\
    \ SQL 语句。再次，数据库对象是任何存储或引用数据的逻辑单元。当你拥有一个数据库对象集合时，你会创建一个与数据库关联的模式（schema）。本章的重点是数据存储的基本形式，即关系数据库表。一个简单的表由行（对应数据记录）和列（也称为字段，包含特定类型的数据）组成。数据库表始终至少包含一列和一个由一个或多个字段组成的行。\n\
    \n## CREATE 语句\n\n多种形式的 SQL `CREATE` 语句负责构建关的数据库结构——表、视图、域等。创建表的动作可能很简单，但你需要考虑许多因素。在实际实施之前规划表结构可以节省你的精力和精力，因为在表创建后你不需要重新配置。\n\
    \n以下是创建表时需要考虑的一些因素：\n* 表将包含的数据类型\n* 表名和列名\n* 主键（使每行数据唯一的列，以避免表中出现重复记录）\n* 列的长度\n\
    * 包含空值的列\n\n语法：\n```sql\nCREATE TABLE TABLE_NAME (\n    field1 DATA_TYPE [not\
    \ null],\n    field2 DATA_TYPE [not null],\n    field3 DATA_TYPE [not null],\n\
    \    field4 DATA_TYPE [not null],\n    field5 DATA_TYPE [not null]\n);\n```\n\
    列名（`field1`、`field2`、`field3`、`field4` 和 `field5`）和字段数据类型写在括号内，用逗号分隔。括号内指示的内容都是可选的，语法最后以分号结束。使用第\
    \ 2 章中的 `CUSTOMER TABLE`，你将使用 SQLiteStudio 创建一个新的数据库表。\n\n### 创建新数据库\n1. 双击桌面上的应用程序图标打开\
    \ SQLiteStudio。\n2. 点击 `DATABASE` 菜单，然后选择 `ADD DATABASE`。\n3. 在输入框内输入 `Sample_DB`（新数据库的名称），然后点击\
    \ OK。\n4. 现在你将在数据库导航器（Database Navigator）面板中看到 `Sample_DB` 对象了。\n\n### 创建新表\n\
    1. 点击 `TOOLS` 菜单，然后选择 `OPEN SQL EDITOR`。你将在右侧面板看到 SQL 编辑器区域。如果你双击 `Sample_DB`，你将在数据库对象下看到\
    \ `TABLES`（表）和 `VIEWS`（视图）。目前还没有表或视图，因此你将使用 SQL 编辑器面板创建一个。\n2. 在 `QUERY`（查询）标签页下，输入以下代码：\n\
    ```sql\nCREATE TABLE Customer_TBL (\n    CustomerID INTEGER NOT NULL PRIMARY KEY,\n\
    \    CustomerName VARCHAR NOT NULL,\n    JobPosition VARCHAR,\n    CompanyName\
    \ VARCHAR NOT NULL,\n    USState VARCHAR NOT NULL,\n    ContactNo BIGINTEGER NOT\
    \ NULL\n);\n```\n3. 点击 `QUERY` 标签页上方的 `EXECUTE QUERY` 按钮或按键盘上的 `F9`。你现在将拥有一个具有\
    \ 6 列的 `Customer_TBL` 表。\n\n## ALTER 语句\n\nSQL `ALTER` 语句用于修改数据库对象，特别是表。修改表元素包括添加和删除列、更改列定义、添加和删除约束、修改表存储值等。\n\
    \n语法：\n```sql\nALTER TABLE TABLE_NAME [modify] [column COLUMN_NAME] [DATA TYPE\
    \ | null not null] [restrict | cascade] [drop] [constraint CONSTRAINT_NAME] [add]\
    \ [column] COLUMN DEFINITION;\n```\n\n### 通过添加新列修改表\n1. 为 `Customer_TBL` 表添加一个包含客户地址的新列。在\
    \ `QUERY` 标签页下输入以下代码：\n```sql\nALTER TABLE Customer_TBL ADD CompanyAdd VARCHAR;\n\
    ```\n2. 点击 `EXECUTE QUERY` 按钮后，`CompanyAdd` 列添加到 `ContactNo` 列之后。该字段包含字符串数据类型的值。\n\
    \n## DROP 语句\n\n如果你想要删除数据库对象，则使用 SQL `DROP` 语句。因此，`DROP TABLE` 语句用于删除不再需要的表。一旦执行此行，表中包含的所有数据和元数据也将被移除。`DROP\
    \ TABLE` 被认为是最容易执行的命令。但是如果要删除的表被数据库中的其他表引用，将会发生错误。这就是为什么在执行 `DROP` 语句时需要小心，以免误删对象（特别是当多个用户访问数据库时）。\n\
    \n语法：\n```sql\nDROP TABLE TABLE_NAME [restrict | cascade];\n```\n当删除其他数据库对象引用的表时，`RESTRICT`\
    \ 选项返回错误。相反，`CASCADE` 选项允许删除表及其所有引用对象。某些 SQL 应用程序不允许 `CASCADE` 选项以确保不会产生无效的数据库对象。\n\
    \n* 删除现有表\n\n"
