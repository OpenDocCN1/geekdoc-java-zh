    | RESULT | RETURN | REVOKE | RIGHT | ROLLBACK | ROLLUP |

    | ROW | ROWS | SCOPE | SCROLL | SEARCH | SECOND |

    | SELECT | SET | SIMILAR | SOME | SPECIFIC | SQL |

    | START | STATIC | SUM | SYMMETRIC | SYSTEM | TABLE |

    | THEN | TIME | TIMESTAMP | TO | TRANSLATE | TREAT |

