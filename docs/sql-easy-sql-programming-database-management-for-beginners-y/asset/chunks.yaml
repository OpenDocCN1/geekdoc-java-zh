    在本章中，你已经学习了如何使用通用的 DDL 命令语句在 SQL 中创建、修改和删除数据库表并对编程行进行编码。在下一章中，你将学习不同的 DML 命令，这些命令将允许你对数据库表中包含的信息进行操作。


    # 第六章：数据操作语言语句


    在本章，你将学习如何通过数据插入、删除和更新来操作数据库表并使其变得有用。为了实现这一点，你将在 SQLiteStudio 中使用三种数据操作语言语句——`INSERT`、`DELETE`
    和 `DROP` 进行编程。


    通常情况下，这些表在创建后是空的。你可以存储在数据库对象中的数据可以是多种格式的——非数字化、半数字化和全数字化。非数字化格式意味着数据需要从非电子源中提取，例如从名片获取客户信息。在这种情况下，你需要手动将数据存储到你的数据库中。至于半数字化，数据可能已经以某种数字形式存在，但格式与你的数据库表不相同。例如，你可能将客户名片的记录存储在
    Microsoft Excel 文件中，你可能需要将其转换为适用于你数据库的适当格式。最后，全数字化意味着你所有的客户信息已经是电子格式，并且与你数据库的布局相匹配。


    当前的数据格式将进一步决定你将如何操作你的数据库。这就是 DML 命令在输入新数据、更新现有数据和从表中删除数据时变得有用的地方。


    ## INSERT 语句


    输入新数据的过程既可以通过单个命令手动完成，也可以通过批处理程序自动完成。还有一些因素将决定你可以在数据库表中插入什么数据以及插入多少数据——字段长度、列数据类型、表大小等。在向表中填充数据时，你将使用
    `INSERT` 语句。


    ### 一次插入一行


    当你想要将所有数据输入到数据库表中的单行时，可以创建一个基于表单的数据输入应用程序。在此功能中，设计了一个屏幕，其中包含字段，你可以在这些字段中输入请求的信息——对应表中的每一列。在一次添加一行数据时，使用以下语法：


    ```

    INSERT INTO TABLE_NAME [(column_1, column_2, … , column_n)]

    VALUES (value_1, value_2, …, value_n) ;

    ```


    方括号内的任何内容都被视为可选的，这意味着你不需要列出列名。顺便说，“n”是表列的最大数量。列列表的默认顺序与你的列表顺序相同。因此，如果你在 `VALUES`
    部分中列出的项目顺序与你的表列相同，那么值将输入到正确的列中。只有当你需要以不同的顺序指定值时，才需要指示列名。


    现在，让我们使用第 2 章提供的客户信息向我们的 `Customer_TBL` 表插入记录。


    1. 在 SQL 编辑器中输入以下编程行：


    ```

    INSERT INTO Customer_TBL (CustomerID, CustomerName, JobPosition, CompanyName,
    USState, ContactNo)

    VALUES (1, ‘Kathy Ale’, ‘President’, ‘Tile Industrial’, ‘TX’, 3461234567)

    ```


    ![](img/image00198.jpeg)


    2. 点击 `EXECUTE QUERY` 按钮 ![](img/image00196.jpeg)，你将得到以下屏幕（状态区域不有错误）：


    ![](img/image00199.jpeg)


    3. 要检查数据记录是否已插入表中，双击左侧格中的 `Customer_TBL`。点击右侧格的 `DATA` 标签，它位于 `STRUCTURE` 和 `CONSTRAINTS`
    标签之间。你的表应该类似于下面屏幕所示：


    ![](img/image00200.jpeg)


    4. 点击屏幕左下角的 ![](img/image00201.jpeg) 选项。要在不指定列名的情况下添加另一个记录，请删除 `QUERY` 标签页内的编程代码并输入以下行：


    ```

    INSERT INTO Customer_TBL

    VALUES (2, ‘Kevin Lord’, ‘VP’, ‘Best Tooling’, ‘NY’, 5181234567)

    ```


    ![](img/image00202.jpeg)


    5. 点击 `EXECUTE QUERY` 按钮 ![](img/image00203.jpeg)，只要值的顺序完全对应于 `Customer_TBL` 表列的顺序，状态区域就不应该有错误。


    ![](img/image00204.jpeg)


    6. 点击屏幕左下角的 `CUSTOMER_TBL (SAMPLE_DB)` 选项 ![](img/image00205.jpeg)。在 `GRID VIEW`
    标签页下，点击 `REFRESH TABLE DATA` 按钮 ![](img/image00206.jpeg) 或在键盘上按 `F5`。你应该能看到新记录已添加到表中。


    ![](img/image00207.jpeg)


    ### 一次插入多行


    如果你需要向表中输入若干记录，多行插入是有益的。这种过程比一次插入一条记录更高效。你只需要重复 `VALUES` 子句，并确保用逗号分隔它们。


    1. 回到 SQL 编辑器，输入以下行（不指定列名）：


    ```

