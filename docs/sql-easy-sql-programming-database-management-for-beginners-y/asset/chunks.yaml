    SQL Fundamental Features


    SQL is a flexible computer language that you can deploy in different ways to communicate
    with relational databases. This software has some distinct features that differentiates
    it from other programming applications. First and foremost, SQL is a nonprocedural
    language. Most computer programs (e.g., C, C++ and Java) solve problems by following
    a sequence of commands that is called a procedure. In this case, one specific
    operation is performed after another until the required task has been accomplished.
    The flow of operation can either be a linear sequence or a looping one, depending
    on what the programmer had specified. This is not the same for SQL. In using this
    application, you will just have to specify the output that you want, not how you
    want to generate the output. From the CUSTOMER TABLE, if you want to create a
    separate list of contacts whose company are located in Texas then you have to
    retrieve the rows where the STATE column contains “TX” as its value. In writing
    the SQL command, you don’t have to indicate how the information should be retrieved.
    It is the primary role of the database management system to examine the database
    and decide how to generate the results you wanted.'
