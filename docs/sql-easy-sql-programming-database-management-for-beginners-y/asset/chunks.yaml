    自从 `SQL` 最初向公众发布以来，它已经有了许多版本。1979 年，Relational Software, Incorporated（后更名为 Oracle
    数据库）发布了 `ORACLE`，这是第一个 `SQL` 产品。现在，随着对管理数据的计算机需求的增长，`SQL` 已经成为信息技术领域的行业标准。这一正式标准由国际标准组织（简称
    `ISO`）制定并维护。1986 年，基于 `IBM’s implementation`，`SQL` 被认可为数据库通信的标准语言。次年，`ISO` 接受
    `ANSI SQL` 作为国际标准。`ANSI` 代表美国国家标准协会，这是一个批准美国各行业某些特定标准的组织。此后出现了该标准的多次修订，例如 1992
    年的（`SQL-92`）和 1999 年的（`SQL-99`）。目前的最新版本现在被称为 `SQL-2011`，它于 2011 年 12 月正式发布。


    ## SQL 的用途


    企业世界现在正从仅仅生产产品和提供服务，转向投资处理海量数据的数字技术，将其转化为有意义的信息片段，从而为公司创造更有利润的收入。这是 `SQL` 的主要目标——访问并操纵将进一步带来业务洞察的数据。这种灵活的计算机语言一直是处理数据库中最广泛使用的通信工具（特别是本本书第
    3 章将进一步讨论的关系型数据库）。


    试着想象你去一个外国国家度假。你可能需要学习那个国家的语言，以便在探索新地方时找到路。当你尝试向某人问路时，如果对方是当地人且只说该国家的语言，你肯定会很难理解他的话。在这种情况下，异国他将是你的数据库，你需要在其中寻找信息，而
    `SQL` 就是你用来从数据库中获取所需内容的语言。


    你不时会遇到 `query`（查询）这个词，它也是 `SQL` 缩写的一部分。`query` 基本上是使用 `SQL statement` 编写的、向数据库提出的问题。当数据库中的任何数据符合给定
    `query` 的条件要求时，`SQL` 就会检索所需的信息。因此，在现实应用中（例如在线商店），当你通过输入搜索标准对特定项目执行 `query` 时，`SQL
    programming` 通常会在后台运行，以管理数据库连接。你实际上是在通过 `SQL` 的帮助告诉数据库你想看什么信息，以及你希望它如何呈现给你。


    ## 使用 SQL 的人员


    `SQL` 不仅适用于 IT 专业人员或具备卓越编程技能的极客。随着当今企业世界的不断发展，非 IT 人员（如商人和经理）也可以从学习 `SQL` 的语义中获益。这是因为这种计算机语言使他们能够利用驱动每家公司的数据来理解其业务的来脉。此外，对于那些想要从当前职位晋升的人来说，它在分析、管理、战略或研究领域开辟了多个职业机会。在
    IT 领域，`SQL` 知识可以引导人们通向更具挑战性的角色，例如数据库设计师、管理员或科学家、系统工程师、项目经理和软件开发人员等。


    在本章中，你学习了 `SQL` 的概览——它的历史、创建的初目的，以及那些将从学习这种强大的数据库软件中获益的人。在下一章中，你将学习数据库的基础知识，这是
    `SQL` 最初设计的初衷。


    # 第二章：数据库基础


    在开始学习 `SQL` 作为一种计算机语言的技术细节之前，本章将首先讨论什么是数据库及其基本特征。你还将了解到为什么商业世界现在被驱动着收集和操纵数据，以带来更有利润的收入。


    ## 数据库基础


    定义或描述什么是数据库有很多方法。简单来说，它可以被定义为一组可以长期存在的项目集合。可以把一个名片盒想象成一个数据库，它包含了你认识的人的带有不同信息的名片（例如：人的姓名、职位名称、公司名称、联系电话）。另一个例子是打印的电话年鉴（更广为人知的“黄页”），它包含了居住在特定区域的注册居民的姓名、电话和地址。


    一些人从更专业的角度定义数据库，而不仅仅是数据的集合。它被描述为一种组织的工具，当需要出现时，能够以有效且高效的方式检索数据或信息。它也可以被更严格地定义为一个自描述的对象的集合，这些对象是相互集成的。当你创建这些物理对象或概念对象的表示形式时，它们将被称为
    `records`（记录）。回到之前名片盒的例子，如果你想跟踪你的业务联系人，你就必须给每张名片分配一个特定的 `record`。每个 `record` 包含多个信息或数据，如个人姓名、职位名称、公司名称和地址、电话等，你现在将这些称为
    `record’s attributes`（记录属性）。


    数据库不仅包含你需要的数据，还包含你所谓的元数据（metadata）。这是定义或描述给定数据库内数据结构的信息（这就是为什么早期将其定义为自描述实体的原因），并存储在一个名为
    `data dictionary`（数据字典）的区域中。因此，如果你知道信息是如何安排和存储的，数据检索将更快。此外，数据项之间存在关系，因为它们是相互集成的。查看底图以获得什么是数据库的示例说明。


    ![](img/image00174.gif)


    无论数据库是少数记录的简单集合，还是由数百万记录组成的庞大系统，它都可以被分为三类：个人、小组/部门和企业级。每种类别的特征是数据库的大小、运行数据库的机器规模以及管理它的组织规模。


    *   个人数据库——由单个人在独立计算机上进行构思和设计。其数据库结构相当简单，规模较小。例如，你的个人电子通讯录。

    *   小组/部门数据库——由特定组织内单个小组或部门的人员设计和创建。与个人类相比，其数据库结构更大、更复杂，而且被多个用户同时访问。

    *   企业级数据库——在三类中，这种类型构思和创建是为了处理非常大型组织的整个信息流。因此，数据库设计涉及更为复杂的结构。


    ## 关系型数据库基础


    进一步讨论到技术方面，关系型数据库是由名为 `tables`（表）的逻辑单元组成的实体。这种关系型数据库模型由 E. F. Codd 博士于 1970 年提出。表与表之间的关系定义了它们的关系。在这种情况下，数据被简化为更小但更有逻辑且易于管理的单元，从而优化了数据库性能。下图显示了关系型数据库各个组件是如何相互连接的插图。


