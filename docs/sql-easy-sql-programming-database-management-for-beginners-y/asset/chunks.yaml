    ### 数据库管理系统


    数据库管理系统，或简称 DBMS，是一种重要的工具。它主要包含两类用户：检索用户和负责维护的管理员。以下是 DBMS 的关键特性：


    - 允许创建新数据库

    - 允许使用适当语言进行修改

    - 允许存储海量数据

    - 能够在故障时进行数据库恢复

    - 控制用户访问


