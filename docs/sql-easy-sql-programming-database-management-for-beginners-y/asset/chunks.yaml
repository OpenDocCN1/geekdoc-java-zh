  raw: 'Using the asterisk (*) means that all columns of the given table are included
    in the output and will be displayed. The ALL option extracts and displays all
    values, even duplicates, for a column. On the other hand, using the keyword DISTINCT
    prevents duplicate rows from being included and displayed in the output. What
    follows the FROM keyword is a list of one or more tables where you want to get
    the data. The columns and tables specified in the syntax are all separated by
    commas.


    *   Data Control Language (DCL)


    Data Control Language (or simply DCL) consists of commands that allow you to manage
    data access within the database. Furthermore, the database is protected from accidental
    or intentional misuse by controlling user privileges. DCL concentrates on transactions,
    which capture all SQL statements that perform database operations and save them
    in a log file. The following are the common DCL command statements:


    *   GRANT – This statement provides you with certain privileges, like giving you
    the permission to access the database. Its syntax is:


    GRANT PRIVILEGE1, PRIVILEGE2, … TO USER_NAME


    *   REVOKE – This statement revokes your privileges, like removing your permission
    to access the database. Its syntax is:


    REVOKE PRIVILEGE1, PRIVILEGE2, … TO USER_NAME


    *   Transactional Control Commands


    Transactional control commands allow users to manipulate various transactions
    in maintaining database integrity. In SQL, transactions begin when applications
    are executed. The very first transaction is started at the onset of the SQL application,
    while the last transaction is ended when the application is terminated. The following
    are the common transactional control commands:


    *   COMMIT – This statement completes a transaction by making the changes you
    made to the database permanent, or simply saving the transactions. Its syntax
    is:


    COMMIT [WORK];


    In the previous command line, the keyword WORK is optional.


    *   ROLLBACK – This statement’s primary function is to restore the database system
    to its previous state or undo all the actions that took place in the transaction
    log. Its syntax is:


    ROLLBACK [WORK];


    In the previous command line, the keyword WORK is optional.


    *   SAVEPOINT – This statement works with the ROLLBACK command, wherein it creates
    sections or points within groups of transactions in which you will be performing
    the ROLLBACK command. Its syntax is:


    SAVEPOINT SAVEPOINT_NAME;


    SQLite Installation Instructions and Database Features


    Before you start overwhelming yourself with various database solutions and SQL
    command lines, you need to determine first your purpose why you are creating a
    database. This will further determine other database design considerations such
    as size, complexity, type of machine where the application will run, storage medium
    and more. When you start thinking of your database requirements, you need to know
    up to what level of detail should be considered in your design. Too much detail
    will result to a very complex design that further wastes time and effort, and
    even your computer’s storage space. Too little will lead to a poor performing,
    corrupt and worthless database. Once you are done with the design phase, then
    you can decide which database software you can download to start your SQL experience.


    For the sake of this e-Book’s discussion, SQLite, a simple software library, will
    be used as a starter database engine to design, build and deploy applications.
    A free and stand-alone database software that is quick to download and easy to
    administer, SQLite  was developed by Richard Hipp and his team of programmers.
    It is was designed so that it can be easily configured and implemented, which
    does not require any client-server setup at all. Thus, SQLite is considered as
    one of the most widely used database software applications in the world.


    Stated below are some of the major features of SQLite:


    *   Transactions are atomic, consistent, isolated and durable


    *   Compilation is simple and easy


    *   System crashes and power failures are supported


    *   Full SQL implementation with a stand-alone command-line interface client


    *   Code footprint is significantly small


    *   Adaptable and adjustable to larger projects


    *   Self-contained with no external dependencies


    *   Portable and supports other platforms like Windows, Android, iOS, Mac, Solaris
    and more


    In using SQLite, you need to download SQLiteStudio as your database manager and
    editor. With its intuitive interface, this software is very light yet fast and
    powerful. You don’t even need to install it, just download, unpack and run the
    application. Follow these simple steps in downloading SQLiteStudio on a Windows
    10 computer:


    1.  Go to [http://sqlitestudio.pl/?act=about](http://sqlitestudio.pl/?act=about).
    You should get the following page:


    ![](Images/image00177.jpeg)


    2.  Check the version of your computer’s operating system then click the appropriate
    link to start downloading the software.


    ![](Images/image00178.jpeg)


    3.  After downloading the software, go to the folder where the application was
    saved (usually the Downloads Folder in Windows). Click on the Extract tab on top
    then choose the Extract all option.


    ![](Images/image00179.jpeg)


    4.  You will get the Extract Compressed (Zipped) Folders  dialog box. Change the
    destination folder to C:\SQL then click the Extract  button. This will be the
    folder where all your SQLite files will be saved.


    ![](Images/image00180.jpeg)


    5.  Once all the files have been extracted, you will have the SQLiteStudio subfolder.


    ![](Images/image00181.jpeg)


    6.  Find the application program  named  SQLiteStudio  inside the subfolder. To
    create a shortcut on your desktop (so you can quickly launch the application),
    right-click the filename, select Send to option then choose Desktop (create shortcut).


    ![](Images/image00182.jpeg)


    7.  When you double-click the SQLiteStudio icon on your desktop,


    ![](Images/image00183.jpeg)


    8.  you should get the following screen:


    ![](Images/image00184.jpeg)


    The Database Navigator (left pane) shows all the logical units of the database
    such as tables and views. The gray pane at the right is the SQL Work Area where
    you will write your query statements. You will have a better understanding of
    this program’s graphical user interface in the succeeding chapters.


    In this chapter you have learnt the fundamental features of the SQL database language,
    which includes program flow, syntax characteristic, reserved words list, schema,
    domain, constraint and more. The main categories of SQL commands were also introduced,
    that govern the various functions of the programming language. You were also given
    a guide on how to download and install SQLite and SQLiteStudio for your application
    software.  In the next chapter you will learn the definition of data and its various
    types supported by the different SQL implementations.


    # Chapter Four: Data Types


    In this chapter you will learn what data is, its characteristics and the various
    types that the SQL programming language supports. There are different general
    types of data that are further categorized into several subtypes. However, it
    is advisable that you use defined data types to ensure the portability and comprehensibility
    of your database.


    Definition of Data'
