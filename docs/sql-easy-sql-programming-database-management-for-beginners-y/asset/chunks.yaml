    索引与其创建的表之间的存储空间是分开的。这种分配的物理空间可能会大幅增加，甚至比它所引用的表还要大。这就是为什么在设计数据库时需要考虑存储需求。就像表和视图一样，索引也可以创建或删除。如果设计得当，它们实际上会加速
    `SELECT` 查询，但可能会减慢 `DELETE`、`UPDATE` 和 `INSERT` 语句。对于巨大的数据库，数据检索无疑会消耗大量时间。然而，此类索引事务对表的数据没有影响。


    ## 创建索引


    索引在创建时与特定的列关联。随后，它持有包含该特定索引列的表的数据值的位置。每当表中添加新数据时，这些数据也会添加到索引中。假设您执行一个在 `WHERE`
    子句中指定了特定条件以检查索引列的 `SELECT` 语句。首先发生的情况是先搜索索引，只有在找到数据值时才会返回确切的位置。


    例如，您想从 `ORDER` 表中选择 `Customer ID` 等于 `1` 的所有记录。此时您将执行以下查询：


    ```

    SELECT *

    FROM Order_TBL

    WHERE CustomerID = 1;

    ```


    如果 `ORDER_TBL` 表在 `CustomerID` 列上建立了索引，那么记录将根据该列按升序排列。因此，`CustomerID` 索引使得搜索过程更容易进行，并最终确定所有具有匹配
    `Customer ID` 的数据的位置。一旦确定了位置，将从 `ORDER_TBL` 表中检索相应的数据行。如果没有索引，将执行全表扫描，如果表包含数百条甚至数千条记录，这将是不高效的。


    ![](img/image00325.gif)


    创建索引的基本语法是：


    ```

    CREATE INDEX INDEX_NAME ON TABLE_NAME [(COLUMN_NAME)];

    ```


    此语句可以通过添加规格来变化，例如要索引的列名、排序（升序或降序）等。现在，在 SQLiteStudio 中为 `ORDER_TBL` 表创建 `ColumnID`
    索引：


    1. 点击 ![](img/image00304.jpeg)选项并确保 `QUERY` 标签页为空。然后输入以下内容：


    ```

    CREATE INDEX CustomerID_IDX ON Order_TBL (CustomerID);

    ```


    ![](img/image00326.jpeg)


    2. 点击 `QUERY` 标签页顶部的 `EXECUTE QUERY`  ![](img/image00196.jpeg)。现在您会在 `ORDER_TBL`
    表的 `INDEXES` 列表中看到 `CustomerID_IDX`。


    ![](img/image00327.jpeg)


    ## 删除索引


    就像删除表或视图一样，您将使用以下基本语法：


    ```

    DROP INDEX INDEX_NAME;

    ```


    记住，在索引被删除后可以重新创建，但请确保在执行此类事务时格外小心。此外，当您删除表时，也会同时删除所有相关的索引。有时，您可能只需要删除索引而保留表。这种实现发生在您只想修复索引问题以优化数据库性能并减少碎片时。


    要删除之前创建的索引：


    1. 点击 ![](img/image00283.jpeg)选项并确保 `QUERY` 标签页为空。然后输入以下内容：


    ```

    DROP INDEX CustomerID_IDX;

    ```


    ![](img/image00328.jpeg)


    2. 点击 `QUERY` 标签页顶部的 `EXECUTE QUERY`按钮 ![](img/image00290.jpeg)。现在您会注意到 `CustomerID_IDX`
    索引已从 `Indexes` 列表中删除。


    ![](img/image00329.jpeg)


    ## 数据库规范化


    为什么需要对数据库进行规范化？因为在设计数据库时，您需要确保信息组织良好、易于管理、始终准确且没有不必要的重复。基本上，规范化是通过将一个大表减少为两个小表来设计和重新设计数据库的过程，其中相同类型的数据被在一起。例如，如果您仅通过合并
    `CUSTOMER_TBL` 表和 `ORDER_TBL` 表的客户信息来创建一个表，那么您将得到一个未规范化的表：


    | ORDER ID | ORDER DATE | CUSTOMER ID | NAME | POSITION | COMPANY | STATE | CONTACT
    NO | PRODUCT ID | ORDER QTY |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | 2016-05-23 | 1 | Kathy Ale | President | Tile Industrial | TX | 3461234567
    | 4 | 300 |

    | 2 | 2016-09-09 | 1 | Kathy Ale | President | Tile Industrial | TX | 3461234567
    | 5 | 100 |

    | 3 | 2016-02-17 | 3 | Kim Ash | Director | Car World | CA | 5101234567 | 2 |
    150 |

    | 4 | 2016-05-12 | 2 | Kevin Lord | VP | Best Tooling | NY | 5181234567 | 2 |
    500 |


    如您所见，客户信息部分存在数据冗余。这就是为什么当您只想通过修复索引问题来优化数据库性能并减少碎片时，需要这种实现。尽可能减少数据冗余，以节省存储空间并避免信息混乱。如果您对每个表都有客户信息且其中一个表不匹配，您将如何验证哪一个是正确的？如果您需要更新客户地址，则必须更新所有表中的数据。


    衡量数据库规范化深度或程度的方法称为范式。常见的范式三种，每个范式都依赖于前一个。


    ### 第一范式 (1NF)


    给定一组基础数据，第一范式 (1NF) 旨在将其划分为逻辑单元或表并分配主键。任何二维表中的单元格应仅包含单个值。特定表的每行引用特定的信息记录且始终是唯一的。对于列，它被赋予唯一的名称并由相同类型的数据值组成，这属于表中包含信息的单一属性。此外，列或行的排列没有特定的顺序。


    通过添加员工信息修改第 2 章给定的数据库，您将拥有以下基础数据：


    ![](img/image00330.jpeg)


    根据上面的图片，整个公司数据库被分为两个较小的表——`EMPLOYEE_TBL` 和 `CUSTOMER_TBL`。这些表的主键分别为 `EmployeeID`
    和 `CustomerID`。这样，与具有许多列和行的单表相比，更容易读取这些信息。


    ### 第二范式 (2NF)


    在完成第一范式后，下一步是推导出第二范式 (2NF)。此过程关注于描述属性之间关系的函数依赖。当一个属性决定另一个属性的值时，它们之间就存在函数依赖。在这种情况下，您将把员工和客户表中部分依赖于其主键的数据值存储到单独的表中。


    ![](img/image00331.gif)

