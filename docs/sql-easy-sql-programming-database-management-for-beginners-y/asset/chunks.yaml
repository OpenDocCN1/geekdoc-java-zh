  trans: "\n\n由于数据库是信息的集合，它可以存储名称、数字、图像、计算结果、财务金额、字符等。这些存储的信息就是你所说的数据，你可以根据需要随时对其进行更改或操作。当你开始提供关于如何编写和存储数据的规则时，你就是在处理数据类型了。数据类型考虑了数据库为表中每一列分配的长度，以及它可能包含的值——无论是字母数字组合、纯数字、图形、日期或时间。通过定义在每个数据库字段中存储什么的数据，你可以防止数据录入错误的发生。这种控制错误数据输入数据库的校验形式形式也称为字段定义。\n\
    \n如果每个数据库字段包含数据项，则它将有一个特定的值。然而，在某些情况下，某个字段可能不包含任何数据项。在这种情况下，字段的值被视为 `null` ——\
    \ 意味着值未知。此 `null` 值不同于数字零值或空白字符值，因为零和空白是确定的值。以下是你可能拥有 `null` 值的几种场景：\n\n- 即使该值可能存在，你还不知道它的值是什么。\n\
    - 该值尚不存在。\n- 该值超出范围。\n- 该字段不适用于特定行。\n\n### 数据类型\n\n以下是 `SQL` 语言中预定义的通用数据类型（进一步划分为子类型）：\n\
    \n- **数值型 (Numeric)** – 由数值数据类型定义的值是某种数字，可以用精确值表示，也可以用近似值表示。\n    - **精确数值型 (Exact\
    \ Numeric)**\n        - `INTEGER` – 这仅由正整数和负整数组成。它不包含小数或分数部分。值的范围从 -2,147,483,648\
    \ 到 2,147,483,647，分配的存储大小为 4 字节。\n        - `SMALLINT` – 这用于替换整数以节省存储空间，但其精度不能大于整数。计算机编程中的精度是一个数字可以拥有的最大有效数字总和。值的范围从\
    \ -32,768 到 +32,767，分配的存储大小为 2 字节。\n        - `BIGINT` – 这是 `SMALLINT` 的相反，其最小精度与\
    \ `INTEGER` 数据类型相同或更高。值的范围从 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807，分配的存储大小为\
    \ 8 字节。\n        - `NUMERIC(p, s)` – 除了整数部分外，该数据类型还包含一个分数部分，指示值的精度（precision）和标度（scale）。标度是数据分数部分中保留的位数或位置，位于小数点右侧。在\
    \ `NUMERIC(p, s)` 中，`p` 指定精度，而 `s` 用于标度。例如，`NUMERIC(6, 3)` 意味着数字的绝对值最多为 999.999（总共\
    \ 6 位有效数字，小数点后有 3 位）。\n        - `DECIMAL(p, s)` – 与 `NUMERIC` 数据类型类似，它也有一个分数部分，你可以同时指定值的精度和标度。然而，这种数据类型允许更高的精度。例如，`DECIMAL(6,\
    \ 3)` 可以包含高达 999.999 的值，但数据库仍然接受大于 999.999 的值。假设你输入了数字 123.4564，它将被四舍五入为 123.456。该数据类型的分配存储大小基于给定的精度。\n\
    \    - **近似数值型 (Approximate Numeric)**\n        - `REAL(s)` – 它由一个单精度浮点数组成，小数点可以在该数字中“浮动”到不同的位置。这意味着该数据类型的数值具有无限精度和可变长度的标度。例如，`π`（圆周）的值可以包括\
    \ 3.14159、3.14 和 3.1（每个值都有自己的精度）。对于单精度浮点数，它们的精度在 1 到 21 之间（包含）。它还为其值分配了 4 字节的存储大小。\n\
    \        - `DOUBLE PRECISION(p, s)` – 它由双精度浮点数组成，容量是 `REAL` 数据类型的两倍。当你需要更精确的数字时（例如在大多数科学领域），这种数据类型非常有用。对于双精度浮点数，它们的精度在\
    \ 22 到 53 之间（包含）。它还为其值分配了 8 字节的存储大小。\n        - `FLOAT(p, s)` – 这是一种允许你指定精度的数据类型，并让计算机决定你是选择单精度还是双精度。它实际上涉及\
    \ `REAL` 和 `DOUBLE PRECISION`，取决于你所指定的精度。由于这种特性，更容易将数据库从一个计算机平台移动到另一个平台。\n- **字符串型\
    \ (String)** – 字符串数据类型存储字母数字信息，也被认为是最常用的数据类型之一。\n    - `CHARACTER(n)` 或 `CHAR(n)`\
    \ – 这种数据类型也称为固定长度。该类型的最大长度为 `n`。如果字符串小于 `n`，SQL 将用空格填充剩余空间。最大长度为 255。\n    - `CHARACTER\
    \ VARYING(n)` 或 `VARCHAR(n)` – 当数据长度不同或不固定，且你不希望 SQL 填充剩余空间时使用。最大长度为 3276。\n \
    \   - `CHARACTER LARGE OBJECT` (`CLOB`) – 1999 年引入的这种变长数据类型用于包含无法作为 `CHARACTER`\
    \ 存储的大型字符信息，如大型文档。最大为 4GB。\n- **日期和时间 (Date and Time)** – 此数据类型管理任何有关日期和时间的信息。\n\
    \    - `DATE` – 此数据类型提供年、月、日的存储，按特定顺序排列。年份使用四位数表示，可以是从 0001 到 9999 的任何值。对于月份和日期，都使用两位表示。日期数据类型的格式为\
    \ `yyyy-mm-dd`。\n    - `TIME` – 此数据类型存储并显示小时-分-秒格式的时间 (`HH:MM:SS`)。\n    - `DATETIME`\
    \ – 当值包含日期和时间信息时，使用 `DATETIME` 数据类型，使用 `YYYY-MM-DD HH:MM:SS` 格式显示。该类型的有效值范围从 `1000-01-01\
    \ 00:00:00` 到 `9999-12-31 23:59:59`。\n    - `TIMESTAMP` – 它与 `DATETIME` 数据类型相似，但值的范围是\
    \ UTC 时间 `1970-01-01 00:00:01` 到 `2038-01-19 03:14:07`。\n- **布尔型 (Boolean)** –\
    \ 此数据类型由用于数据比较的值组成：`TRUE`、`FALSE` 或 `NULL`。为了返回数据，必须满足给定查询的所有指定准则条件 意味着布尔值为 `TRUE`。如果不返回数据，则该值为\
    \ `FALSE` 或 `NULL`。\n\n### 自定义数据类型 (User-Defined Data Type)\n\n"
- fmt: "\nAfter learning the general pre-defined data types, you will now move to\
    \ user-defined data types or simply UDTs. By the name itself, these are the data\
    \ values that the user defines or specifies based on the existing data types.\
    \ Thus, customization is allowed to maximize storage space and meet other user\
    \ requirements. Furthermore, database application development becomes more flexible\
    \ for programmers. This means that you can use UDTs when you need to enter the\
    \ same type of data in a column that will be defined in several tables. To define\
    \ UDTs, you can use the `CREATE TYPE` statement.\n\nFor example, if you want to\
    \ define and differentiate `USDollar` and `UKPound` as two currencies for your\
    \ database then create the following UDTS:\n\n```sql\nCREATE TYPE USDollar AS\
    \ DECIMAL (9, 2) ;\nCREATE TYPE UKPound AS DECIMAL (9, 2) ;\n```\n\nEven if both\
    \ data types were created using the predefined `DECIMAL` type, each has its own\
    \ function and characteristic in the database. Going back to the sample customer\
    \ and order information from the previous chapters, you can now create the following\
    \ invoice tables that include the two UDTs:\n\n```sql\nCREATE TABLE AmericaInvoice\
    \ (\n    InvoiceID INTEGER PRIMARY KEY,\n    CustomerID INTEGER,\n    OrderID\
    \ INTEGER,\n    TotalSaleAmt USDollar,\n    ShippingFee USDollar\n);\n\nCREATE\
    \ TABLE UnitedKingdomInvoice (\n    InvoiceID INTEGER PRIMARY KEY,\n    CustomerID\
    \ INTEGER,\n    OrderID INTEGER,\n    TotalSaleAmt USDollar,\n    ShippingFee\
    \ USDollar\n);\n```\n\nIn this chapter you have learnt the characteristics of\
    \ the various data types available in the SQL language. You were also able to\
    \ understand the need to create user-defined data types to make your database\
    \ less complicated and more portable. In the next chapter you will learn how use\
    \ the different Data Definition Language statements in creating database objects.\n\
    \n# Chapter Five: Data Definition Language\n\nIn this chapter you will gain a\
    \ deeper understanding of the three Data Definition statements – `CREATE`, `ALTER`\
    \ and `DROP`. Using SQLiteStudio, you will also learn how encode the corresponding\
    \ SQL statements that handle the database structure. Again, a database object\
    \ is any logical unit that stores or references data. When you have a collection\
    \ of database objects, you create a schema that is associated with one database.\
    \ The focus of this chapter is the basic form of data storage, which is the relational\
    \ database table. A simple table further consists of rows, which corresponds to\
    \ the records of data, and columns, which are also known as fields that contain\
    \ particular type of data. A database table will always have at least one column\
    \ and a row that is composed of one more fields.\n\n## CREATE Statement\n\nThe\
    \ numerous forms of the SQL `CREATE` statement are responsible for constructing\
    \ vital database structures – tables, views, domains and so on. The act of creating\
    \ tables could be easy, but you need to take into numerous factors. Planning table\
    \ structures before actual implementation could save you time and effort since\
    \ you do not need to reconfigure after the tables have been created.\n\nHere are\
    \ some of the factors to take into when creating tables:\n* Type of data the table\
    \ will contain\n* Table and column names\n* Primary key (the column that makes\
    \ each row of data unique to avoid duplicate records in a table)\n* Column length\n\
    * Columns containing null values\n\nSyntax:\n```sql\nCREATE TABLE TABLE_NAME (\n\
    \    field1 DATA_TYPE [not null],\n    field2 DATA_TYPE [not null],\n    field3\
    \ DATA_TYPE [not null],\n    field4 DATA_TYPE [not null],\n    field5 DATA_TYPE\
    \ [not null]\n);\n```\nThe column names (`field1`, `field2`, `field3`, `field4`\
    \ and `field5`) and the field data types are written inside the parenthesis, separated\
    \ by commas. Anything indicated inside the brackets are optional and the syntax\
    \ finally ends with a semicolon. Using `CUSTOMER TABLE` from Chapter 2, you will\
    \ create a new database table using SQLiteStudio.\n\n### Create a New Database\n\
    1. Open SQLiteStudio by double-clicking the application icon on your desktop.\n\
    2. Click the `DATABASE` menu then select `ADD DATABASE`.\n3. Type `Sample_DB`\
    \ inside the input box (which is the name of the new database) then click OK.\n\
    4. You will now have the `Sample_DB` object inside the Database Navigator pane.\n\
    \n### Create a New Table\n1. Click the `TOOLS` menu then select `OPEN SQL EDITOR`.\
    \ You will have the SQL editor area at the right pane. If you double-click `Sample_DB`,\
    \ you will see `TABLES` and `VIEWS` under the database object. Right now, there\
    \ are no tables nor views present so you will create one using the SQL Editor\
    \ pane.\n2. Under the `QUERY` Tab, type the following lines of code:\n```sql\n\
    CREATE TABLE Customer_TBL (\n    CustomerID INTEGER NOT NULL PRIMARY KEY,\n  \
    \  CustomerName VARCHAR NOT NULL,\n    JobPosition VARCHAR,\n    CompanyName VARCHAR\
    \ NOT NULL,\n    USState VARCHAR NOT NULL,\n    ContactNo BIGINTEGER NOT NULL\n\
    );\n```\n3. Click the `EXECUTE QUERY` button on top of the `QUERY` Tab or press\
    \ `F9` on the keyboard. You will now have the `Customer_TBL` table with 6 columns.\n\
    \n## Statement\n\nThe SQL `ALTER` statement is used to modify database objects,\
    \ specifically tables. Altering table elements can include adding and dropping\
    \ columns, changing column definitions, adding and dropping constraints, modifying\
    \ table storage values and more.\n\nSyntax:\n```sql\nALTER TABLE TABLE_NAME [modify]\
    \ [column COLUMN_NAME] [DATA TYPE | null not null] [restrict | cascade] [drop]\
    \ [constraint CONSTRAINT_NAME] [add] [column] COLUMN DEFINITION;\n```\n\n### Alter\
    \ a Table by Adding a New Column\n1. A new column that contains the company address\
    \ of the customer will be added to the `Customer_TBL` table. Type the following\
    \ lines of code under the `QUERY` tab:\n```sql\nALTER TABLE Customer_TBL ADD CompanyAdd\
    \ VARCHAR;\n```\n2. After clicking the `EXECUTE QUERY` button, the `CompanyAdd`\
    \ column is added after the `ContactNo` column. This field contains values of\
    \ string data type.\n\n## DROP Statement\n\nYou use the SQL `DROP` statement if\
    \ you want to delete database objects. Thus, the `DROP TABLE` statement is used\
    \ to delete tables that you do not need anymore. Once this line is executed, all\
    \ the data and metadata contained in the table are also removed. `DROP TABLE`\
    \ is considered to be the easiest command to execute. However, an error will occur\
    \ if the table to be deleted is being referenced by another table in the database.\
    \ That is why you need to be cautious when performing the `DROP` statement to\
    \ avoid deleting objects by mistake (most especially if there are multiple users\
    \ who access the database).\n\nSyntax:\n```sql\nDROP TABLE TABLE_NAME [restrict\
    \ | cascade];\n```\nThe `RESTRICT` option is used if an error is to be returned\
    \ when a table referenced by another database object is dropped. On the other\
    \ hand, the `CASCADE` option allows the table and all other referencing objects\
    \ to be deleted. There are some SQL application programs that do not permit the\
    \ `CASCADE` option to guarantee that there will be no invalid database objects.\n\
    \n* Drop an Existing Table\n"
