- fmt: "\nThe figure above shows that those attributes that are partly dependent on\
    \ the `EmployeeID` primary key have been removed from `EMPLOYEE_TBL` and stored\
    \ in a new table called `EMPLOYEE_SALARY_TBL`. The attributes that were retained\
    \ in the original table are fully dependent on the primary key – meaning that\
    \ for every record of last name, first name, address and contract number there\
    \ is a corresponding particular employee ID. Unlike the `EMPLOYEE_SALARY_TBL`,\
    \ a particular employee ID does not reference a unique employee position nor salary\
    \ rate. There could be more than one employee with the same position (`EmpPosition`),\
    \ pay rate (`Payrate`) and bonus (`Bonus`).\n\n![](Images/image00332.gif)\n\n\
    For the `CUSTOMER_TBL` table, customer’s order information does not directly depend\
    \ on the general customer information found in the original table. That is why\
    \ four attributes (`OrderID`, `OrderDate`, `ProductID` and `OrderQty`) were moved\
    \ to a separate table called `ORDER_TBL`.\n\n### Third Normal Form (3NF)\n\nWith\
    \ the third normal form (`3NF), you will have to separate pieces of information\
    \ from the table that are completely not dependent on the primary key. Going back\
    \ to the `CUSTOMER_TBL`, the job position (`JobPosition`) and its description\
    \ (`JobDescription`) are totally independent of the `CustomerID` primary key.\
    \ This is because, in general, any job position will have the same duties and\
    \ responsibilities regardless of who the customer is. Thus, we will separate the\
    \ `JobPosition` and `JobDescription` attributes into another table called `POSITION_TBL`.\n\
    \n![](Images/image00333.jpeg)\n\nIn this chapter you have learnt that there are\
    \ design practices that you can apply to boost the performance of your databases.\
    \ Duplicate data values are avoided by assigning primary and foreign keys in tables.\
    \ Search queries are heightened through the implementation of table indexes. Data\
    \ consistency and security are improved because of the normalization process.\
    \ Thus, overall database organization is enhanced. In the next chapter you will\
    \ learn some advance topics in SQL design that includes cursors, triggers and\
    \ errors.\n\n# Chapter Eleven: Database Advance Topics\n\nIn this chapter you\
    \ will be introduced to some advance topics in SQL that goes beyond basic database\
    \ transactions. Even if this section only includes an overview of cursors, triggers\
    \ and errors, such knowledge could possibly help you extend the features of your\
    \ SQL implementations.\n\n## Cursors\n\nGenerally, SQL commands manipulate database\
    \ objects using set-based operations. This means that transactions are performed\
    \ on a group or block of data. A cursor, on the other hand, processes data from\
    \ a table one row at a time. It is created using a compound a statement and destroyed\
    \ upon exit. The standard syntax for declaring a cursor is (which may differ for\
    \ every implementation):\n\n```\nDECLARE CURSOR CURSOR_NAME\nIS {SELECT_STATEMENT}\n\
    ```\n\nYou can perform operations on a cursor only after it has been declared\
    \ or defined.\n\n### Open a Cursor\n\nOnce declared, you perform an `OPEN` operation\
    \ to access the cursor and then execute the specified `SELECT` statement. The\
    \ results of the `SELECT` query will be saved in a certain area in the memory.\
    \ The standard syntax for opening a cursor is:\n\n```\nOPEN CURSOR_NAME;\n```\n\
    \n### Fetch Data from a Cursor\n\nThe `FETCH` statement is performed if you want\
    \ to retrieve the query results or the data from the cursor. The standard syntax\
    \ for fetching data is:\n\n```\nFETCH NEXT FROM CURSOR_NAME [INTO FETCH_LIST]\n\
    ```\n\nIn SQL programming, the optional statement inside the square brackets will\
    \ let you assign the data retrieved into a certain variable.\n\n### Close a Cursor\n\
    \nThere is a corresponding `CLOSE` statement to be executed when you open a particular\
    \ cursor. Once the cursor is closed, all the names and resources used will be\
    \ deallocated. Thus, the cursor is no longer available for the program to use.\
    \ The standard syntax for closing a cursor is:\n\n```\nCLOSE CURSOR_NAME\n```\n\
    \n## Triggers\n\nThere are instances when you want certain SQL operations or transactions\
    \ to occur after performing some specific actions. This scenario describes an\
    \ SQL statement that triggers another SQL statement to take place. Essentially,\
    \ a trigger is an SQL procedure that is compiled in the database that execute\
    \ certain transactions based on other transactions that have previously occurred.\
    \ Such triggers can be performed before or after the execution of DML statements\
    \ (`INSERT`, `DELETE` and `UPDATE`). In addition, triggers can validate data integrity,\
    \ maintain data consistency, undo transactions, log operations, modify and read\
    \ data values in different databases.\n\n### Create a Trigger\n\nThe standard\
    \ syntax for creating a trigger is:\n\n```\nCREATE TRIGGER TRIGGER_NAME\n TRIGGER_ACTION_TIMETRIGGER_EVENT\n\
    ON TABLE_NAME\n[REFERENCING OLD_OR_NEW_VALUE_ALIAS_LIST]\nTRIGGERED_ACTION\n```\n\
    \n- `TRIGGER_NAME` - the unique identifying name for this object\n- `TRIGGER_ACTION_TIMETRIGGER_EVENT`\
    \ - the specified time that the set of triggered actions will occur (whether before\
    \ or after the triggering event).\n- `TABLE_NAME` – the table for which the DML\
    \ statements have been specified\n- `TRIGGERED_ACTION` – specifies the actions\
    \ to be performed once an event is triggered\n\nOnce a trigger has been created,\
    \ it cannot be altered anymore. You can just either re-create or replace it. How\
    \ a trigger works depends what conditions you specify – whether it will fire at\
    \ once when a DML statement is performed or it will fire multiple times for every\
    \ table row affected by the DML statement. You can also include a threshold value\
    \ or a Boolean condition, that when such condition is met will trigger a course\
    \ of action.\n\n### Drop a Trigger\n\nThe basic syntax for dropping a trigger\
    \ is the same as dropping a table or a view:\n\n```\nDROP TRIGGER TRIGGER_NAME;\n\
    ```\n\n## Errors\n\nAn error-free design or implementation is one of the ultimate\
    \ goals in any programming language. You can commit errors by simply not following\
    \ naming conventions, improperly writing the programming codes (syntax or typo\
    \ errors like a missing apostrophe or parenthesis) or even when the data entered\
    \ does not match the data type defined.\n\nTo make things easier, SQL has devised\
    \ a way to return error information so that programmers will be aware of what\
    \ is going on and be able to undertake the appropriate actions. Some of these\
    \ error-handling mechanisms are the status `SQLSTATE` and the `WHENEVER` clause.\n\
    \n### SQLSTATE\n\nThe status parameter or host variable `SQLSTATE` is an error-handling\
    \ tool that includes a wide selection of anomalous condition. It is a string that\
    \ consists of five characters (uppercase letters from A to Z and numerals from\
    \ 0 to 9), where the first two characters refer to the class code while the next\
    \ three is the subclass code. The class code identifies the status after an SQL\
    \ statement has been completed – whether it is successful or not (if not successful,\
    \ then one of the major types of error conditions are returned). Supplementary\
    \ information about the execution of the SQL statement is also indicated in the\
    \ subclass code.\n\nThe `SQLSTATE` is updated after every operation. If the value\
    \ is `00000` (five zeroes), it means that the execution was successful and you\
    \ can proceed to the next operation. If it contains a five-character string other\
    \ than `00000`, then you have to check your programming lines to rectify the error\
    \ committed.\n\n### WHENEVER Clause\n\nThe `WHENEVER` clause error-handling mechanism\
    \ focuses on execution exceptions. With this, an error is acknowledged and gives\
    \ the programmer the option to correct it. This is better than not being able\
    \ to do something if an error occurs. If you cannot rectify or reverse the error\
    \ that was committed, then you can just gracefully terminate the application program.\n\
    \nThe `WHENEVER` clause is written before the executable SQL code, specifically\
    \ in the SQL declaration section. The basic syntax is:\n"
