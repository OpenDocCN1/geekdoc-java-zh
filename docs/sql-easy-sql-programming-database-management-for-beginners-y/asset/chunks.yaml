  trans: "\n\n![](img/image00272.jpeg)\n\n在上面的示例中，引入了 `COUNT` 函数来对数据进行分组。以下是与 `GROUP\
    \ BY` 语句一起使用的常用聚合函数摘要（`x` 表示你想要执行函数的列名）：\n\n*   `AVG(x)` – 计算所有列值的平均值（排除空值）\n\
    *   `COUNT(x)` – 统计列中非空值的数量\n*   `COUNT(*)` – 统计记录总数\n*   `MAX(x)` – 计算列中的最大值（排除空值）\n\
    *   `MIN(x)` - 计算列中的最小值（排除空值）\n*   `SUM(x)` – 计算列中值的总和或总额（忽略空值）\n\n回到 `GROUP BY`\
    \ 示例，程序检索了 `JobPosition` 列中的数据，并对每个值实例使用 `COUNT` 函数进行记录计数。`number_of_record` 是创建的一个新列，显示每个工作职位的记录总数。总监（Director）、经理（Manager）和总裁（President）职位各有\
    \ 1 条记录，而副总裁（Vice-President）有 2 条。这是因为有两个客户是副总裁——Kevin Lord 和 Mike Armhs。你可能还会注意到，显示的记录默认按升序排列。\n\
    \n若要修改你的 SQL 语句以降序顺序显示工作职位，你需要在 `GROUP BY` 子句之后添加 `ORDER BY` 语句（`ORDER BY` 始终跟在\
    \ `GROUP BY` 语句之后）。将你的代码行更改为以下内容，然后点击 QUERY 标签上方的 `EXECUTE QUERY`  ![](img/image00270.jpeg)：\n\
    \n```sql\nSELECT JobPosition, COUNT(*) AS number_of_record\nFROM Customer_TBL\n\
    GROUP BY JobPosition\nORDER BY JobPosition DESC;\n```\n\n![](img/image00273.jpeg)\n\
    \n在本章中，你学习了如何使用 SQL 中最常用的 DQL 命令语句来从数据库表中选择、排序和分组记录，并编码编程行。在下一章中，你将学习不同的事务控制命令，这些命令允许你管理多个关系数据库事务。\n\
    \n# 第八章：事务控制命令\n\n在本章中，你将学习如何使用 SQLiteStudio 在关系型数据库管理系统 (RDBMS) 中三个三种可用事务控制命令——`COMMIT`、`ROLLBACK`\
    \ 和 `SAVEPOINT`。控制事务需要你能够管理通常由 `insert`、`update` 和 `delete` 命令引起的某些数据库更改。\n\n\
    当你注意到表的数据或结构已经发生变化时，执行数据库事务似乎已成功完成。在事务执行期间实际发生的情况是信息存储在数据库的临时空间中（或者你可以称之为回滚区域）。当你想要完成这些事务并永久存储信息时，你通过发布适当的事务控制命令来保存或丢弃对数据库表所做的更改。只有这样，回滚区域会被清空。\n\
    \n## COMMIT 命令\n\n使用 `COMMIT` 命令可以将所有事务保存到你的数据库中。通常，在 SQLiteStudio 中，每当你通过 SQL\
    \ 编辑器编写编程行来执行 `CREATE`、`INSERT` 或 `DELETE` 事务时，更改会被自动保存。你之前在第 6 章通过 `COMMIT CHANGES\
