- fmt: "\nUsing the `*` means that all columns of the given table are included in\
    \ the output and will be displayed. The `ALL` option extracts and displays all\
    \ values, even duplicates, for a column. On the other hand, using the keyword\
    \ `DISTINCT` prevents duplicate rows from being included and displayed in the\
    \ output. What follows the `FROM` keyword is a list of one or more tables where\
    \ you want to get the data. The columns and tables specified in the syntax are\
    \ all separated by commas.\n\n## Data Control Language (DCL)\n\nData Control Language\
    \ (or simply `DCL`) consists of commands that allow you to manage data access\
    \ within the database. Furthermore, the database is protected from accidental\
    \ or intentional misuse by controlling user privileges. DCL concentrates on transactions,\
    \ which capture all SQL statements that perform database operations and save them\
    \ in a log file. The following are the common DCL command statements:\n\n*   `GRANT`\
    \ – This statement provides you with certain privileges, like giving you the permission\
    \ to access the database. Its syntax is:\n\n```\nGRANT PRIVILEGE1, PRIVILEGE2,\
    \ … TO USER_NAME\n```\n\n*   `REVOKE` – This statement revokes your privileges,\
    \ like removing your permission to access the database. Its syntax is:\n\n```\n\
    REVOKE PRIVILEGE1, PRIVILEGE2, … TO USER_NAME\n```\n\n## Transactional Control\
    \ Commands\n\nTransactional control commands allow users to manipulate various\
    \ transactions in maintaining database integrity. In SQL, transactions begin when\
    \ applications are executed. The very first transaction is started at the onset\
    \ of the SQL application, while the last transaction is ended when the application\
    \ is terminated. The following are the common transactional control commands:\n\
    \n*   `COMMIT` – This statement completes a transaction by making the changes\
    \ you made to the database permanent, or simply saving the transactions. Its syntax\
    \ is:\n\n```\nCOMMIT [WORK];\n```\n\nIn the previous command line, the keyword\
    \ `WORK` is optional.\n\n*   `ROLLBACK` – This statement’s primary function is\
    \ to restore the database system to its previous state or undo all the actions\
    \ that took place in the transaction log. Its syntax is:\n\n```\nROLLBACK [WORK];\n\
    ```\n\nIn the previous command line, the keyword `WORK` is optional.\n\n*   `SAVEPOINT`\
    \ – This statement works with the `ROLLBACK` command, wherein it creates sections\
    \ or points within groups of transactions in which you will be performing the\
    \ `ROLLBACK` command. Its syntax is:\n\n```\nSAVEPOINT SAVEPOINT_NAME;\n```\n\n\
    ## SQLite Installation Instructions and Database Features\n\nBefore you start\
    \ overwhelming yourself with various database solutions and SQL command lines,\
    \ you need to determine first your purpose why you are creating a database. This\
    \ will further determine other database design considerations such as size, complexity,\
    \ type of machine where the application will run, storage medium and more. When\
    \ you start thinking of your database requirements, you need to know up to what\
    \ level of detail should be considered in your design. Too much detail will result\
    \ to a very complex design that further wastes time and effort, and even your\
    \ computer’s storage space. Too little will lead to a poor performing, corrupt\
    \ and worthless database. Once you are done with the design phase, then you can\
    \ decide which database software you can download to start your SQL experience.\n\
    \nFor the sake of this e-Book’s discussion, `SQLite`, a simple software library,\
    \ will be used as a starter database engine to design, build and deploy applications.\
    \ A free and stand-alone database software that is quick to download and easy\
    \ to administer, `SQLite` was developed by Richard Hipp and his team of programmers.\
    \ It was designed so that it can be easily configured and implemented, which does\
    \ not require any client-server setup at all. Thus, `SQLite` is considered as\
    \ one of the most widely used database software applications in the world.\n\n\
    Stated below are some of the major features of `SQLite`:\n\n*   Transactions are\
    \ atomic, consistent, isolated and durable\n*   Compilation is simple and easy\n\
    *   System crashes and power failures are supported\n*   Full SQL implementation\
    \ with a stand-alone command-line interface client\n*   Code footprint is significantly\
    \ small\n*   Adaptable and adjustable to larger projects\n*   Self-contained with\
    \ no external dependencies\n*   Portable and supports other platforms like Windows,\
    \ Android, iOS, Mac, Solaris and more\n\nIn using `SQLite`, you need to download\
    \ `SQLiteStudio` as your database manager and editor. With its intuitive interface,\
    \ this software is very light yet fast and powerful. You don’t even need to install\
    \ it, just download, unpack and run the application. Follow these simple steps\
    \ in downloading `SQLiteStudio` on a Windows 10 computer:\n\n1.  Go to `http://sqlitestudio.pl/?act=about`.\
    \ You should get the following page:\n\n    ![](Images/image00177.jpeg)\n\n2.\
    \  Check the version of your computer’s operating system then click the appropriate\
    \ link to start downloading the software.\n\n    ![](Images/image00178.jpeg)\n\
    \n3.  After downloading the software, go to the folder where the application was\
    \ saved (usually the Downloads Folder in Windows). Click on the Extract tab on\
    \ top then choose the Extract all option.\n\n    ![](Images/image00179.jpeg)\n\
    \n4.  You will get the Extract Compressed (Zipped) Folders dialog box. Change\
    \ the destination folder to `C:\\SQL` then click the Extract button. This will\
    \ be the folder where all your `SQLite` files will be saved.\n\n    ![](Images/image00180.jpeg)\n\
    \n5.  Once all the files have been extracted, you will have the `SQLiteStudio`\
    \ subfolder.\n\n    ![](Images/image00181.jpeg)\n\n6.  Find the application program\
    \ named `SQLiteStudio` inside the subfolder. To create a shortcut on your desktop\
    \ (so you can quickly launch the application), right-click the filename, select\
    \ Send to option then choose Desktop (create shortcut).\n\n    ![](Images/image00182.jpeg)\n\
    \n7.  When you double-click the `SQLiteStudio` icon on your desktop,\n\n    ![](Images/image00183.jpeg)\n\
    \n8.  you should get the following screen:\n\n    ![](Images/image00184.jpeg)\n\
    \nThe Database Navigator (left pane) shows all the logical units of the database\
    \ such as tables and views. The gray pane at the right is the SQL Work Area where\
