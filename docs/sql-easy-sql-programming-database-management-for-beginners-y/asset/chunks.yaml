    UPDATE Statement


    Since change is inevitable, SQL provides a way for you to update existing data
    stored in your database. Depending on your needs, you can modify a single record
    or multiple records at one time using the UPDATE command. However, only one table
    is generally updated at a time in a given database. The standard syntax for this
    DML statement is:


    UPDATE TABLE_NAME


    SET column_1 = EXPRESSION_1,


    column_2 = EXPRESSION_2,


                                        …


    column_n = EXPRESSION_N


    [WHERE predicates];'
