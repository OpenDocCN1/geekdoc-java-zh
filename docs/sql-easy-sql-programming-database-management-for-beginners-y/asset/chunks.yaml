    | UNKNOWN | UPDATE | UPPER | USER | USING | VALUE |

    | VALUES | VARCHAR | VARYING | VERSION | WHEN | WHENEVER |

    | WHERE | WINDOW | WITH | WITHIN | WITHOUT | YEAR |


    如果你认为 `SQL` 数据库只是表的集合，那么你就错了。还需要指定额外的结构来维护数据的完整性，例如模式（schemas）、域（domains）和约束（constraints）。


    *   **Schema (模式)**：这也被称为概念视图或完整的逻辑视图，定义了整个数据库结构并提供了整体的表组织。此类模式被视为元数据——存储在表中并是数据库的一部分（就像由普通数据组成的表一样）。

    *   **Domain (域)**：它指定可以在特定表列或属性中存储的所有有限数据值的集合。例如，在我们之前的 `CUSTOMER TABLE` 中，如果仅提供德克萨斯州、纽约州、加州和内华州的产品和服务，那么
    `STATE` 列只能包含值“TX”、“NY”、“CA”和“NV”。因此这四个州的缩写就是 `STATE` 属性的域。

    *   **Constraint (约束)**：通常被忽略但是重要的数据库组件之一，它规定了识别特定表属性可以包含哪些数据值的规则。结合严格的约束可以确保数据库用户仅向特定列输入有效数据。与定义的表特征共同，决定了它的域。使用相同的
    `STATE` 列作为示例，在仅允许四个值的约束下，如果数据库用户输入新泽西州的“NJ”，则该条目将不被接受。除非由于业务业务变化需要更新数据库结构，否则系统将不会继续为
    `STATE` 属性输入有效值。


    ## SQL 命令类型


    在开始使用 `SQL` 编程之前，你需要了解它执行各种功能时的基本命令分类——数据库创建、对象操纵、数据填充和更新、数据删除、查询提交、访问控制和数据库管理等。以下是主要类别：


    ### 数据定义语言 (DDL)


    数据定义语言（或简称为 `DDL`）使你能够创建、更改或重构，甚至破坏关系型数据库包含的基础元素。`DDL` 仅关注结构，而不关注元素包含的数据。这些基本元素或数据对象包括表、模式、视图等。视图由于没有独立的物理存在，被视为虚拟表，其定义仅存在于元数据中。然而，视图的数据来自派生视图的表（或多个表）。下面是一些最常用的
    DDL 命令：


    *   **CREATE**：此命令语句负责构建数据库结构。其语法为：


    ```sql

    CREATE TABLE

    CREATE VIEW

    ```


    *   **ALTER**：此命令语句负责在创建后更改数据库结构。其语法为：


    ```sql

    ALTER TABLE

    ALTER VIEW

    ```


    *   **DROP**：此命令是 `CREATE` 语句的反向，用于销毁数据库结构。其语法为：


    ```sql

    DROP TABLE

    DROP VIEW

    ```


    ### 数据操纵语言 (DML)


    数据操纵语言（或简称为 `DML`）由处理数据维护的 SQL 命令组成。这意味着你可以输入、更改、删除或检索数据。以下是常用的 `DML` 语句：


    *   **INSERT**：此命令语句用于向特定表插入新的数据值。向具有两列的表添加值，使用以下语法：


    ```sql

    INSERT INTO TABLE_NAME

    VALUES (''value1'', ''value2'');

    ```


    `TABLE_NAME` 是你将添加新值的表的名称。`VALUES` 括号内的项数代表列数，其排列顺序与这些列的相同。如果值是字符或日期/时间数据类型，则需要用单引号括起来。对于数值或空值，则不需要这样做（空值应写为
    `NULL`）。


    *   **UPDATE**：此命令语句用于修改或更改表中预存在的数据值，而不是添加或删除记录。更新是一次针对一个表进行的，或者是针对数据库中一个表的多个行/列。要更改单个列，使用以下语法：


    ```sql

    UPDATE TABLE_NAME

    SET COLUMN_NAME = ''value''

    [WHERE CONDITION];

    ```


    只要满足给定的 `WHERE` 子句，`COLUMN_NAME` 的值将得到更新。这可能发生在给定 `TABLE_NAME` 的一条或多条记录中。


    *   **DELETE**：此命令语句删除某些记录甚至整个表，而不是特定列的数据值。要从表中删除单行或多条记录，使用以下语法：


    ```sql

    DELETE FROM TABLE_NAME

    [WHERE CONDITION];

    ```


    如果你想从 `TABLE_NAME` 删除选行，`WHERE` 子句是该命令的重要部分。


    ### 数据查询语言 (DQL)


    数据查询语言（或简称为 `DQL`）由执行数据选择的命令组成，这是 `SQL` 世界中关系数据库用户的主要关注。使用的语句是 `SELECT`，它可以带有其他子句或选项，以便你的提取结果以组织良好且易读的格式呈现。你可以使用单独应用程序界面或命令行向数据库提交查询。以下是简单的
    `SELECT` 语句的语法：


    ```sql

    SELECT [* | ALL | DISTINCT COLUMN1, COLUMN2]

    FROM TABLE1 [, TABLE2];

    ```


