    them. For example, you may have another table that contains information on the
    customers’ orders such as the date when they ordered, what product they ordered,
    the quantity and more. This new table will be called the ORDER TABLE and it is
    related to the first CUSTOMER TABLE because every order is associated to a particular
    customer.


    Now, you will create a view from two tables that will show database users to which
    company and state each order was shipped to or delivered. The basic syntax for
    creating a view using multiple tables is:


    CREATE VIEW VIEW_NAME AS


    SELECT COLUMN_LIST


    FROM TABLE_LIST


    WHERE CONDITION;


    To create the ORDER TABLE:


    1.  Using the data values in Chapter 2 for the ORDER table, create another table
    using the SQL Editor. Click the ![](Images/image00250.jpeg) option and delete
    everything inside the QUERY tab. Type the following lines of code for the new
    ORDER table:


    CREATE TABLE Order_TBL


    (OrderID INTEGER NOT NULL PRIMARY KEY,


                                  OrderDate DATE NOT NULL,


                                  CustomerID INTEGER NOT NULL,


    ProductID INTEGER NOT NULL,


                                  OrderQty BIGINTEGER NOT NULL);


    2.  Click the EXECUTE QUERY button ![](Images/image00290.jpeg) on top of the QUERY
    tab. You will now have the Order_TBL table under the TABLES list in the left pane.


    ![](Images/image00314.jpeg)


    3.  Double-click the Order_TBL in the left pane then click on DATA tab at the
    left. You will populate this table with data values in GRID VIEW mode.


    ![](Images/image00315.jpeg)


    4.  Click the INSERT ROW button ![](Images/image00316.jpeg) and then select the
    first option – INSERT MULTIPLE ROWS.


    ![](Images/image00317.jpeg)


    5.  Enter “4” in the NUMBER OF ROWS TO INSERT input box (since there are 4 records
    in the ORDER TABLE from Chapter 2) then click OK.


    ![](Images/image00318.jpeg)


    6.  The Order_TBL table will now have 4 rows and 5 columns. Instead of using SQL
    statements to populate this table, you will enter the values directly into the
    table (check the data values in Chapter 2).


    +![](Images/image00319.jpeg)


    7.  Click the COMMIT button ![](Images/image00320.jpeg) to save all the data values
    of the Order_TBL table.


    To create the view that will tell you to which company and state every order was
    shipped to or delivered:


    1.  Click the ![](Images/image00304.jpeg) option, empty QUERY tab and then type
    the following lines of code:


    CREATE VIEW OrderDelivery_VW AS


    SELECT Order_TBL.OrderID, Customer_TBL.CompanyName AS CompanyDeliveredTo, Customer_TBL.USState
    AS StateDestination, Order_TBL.OrderQty


    FROM Customer_TBL, Order_TBL


    WHERE Order_TBL.CustomerID = Customer_TBL.CustomerID;


    2.  Click the EXECUTE QUERY button ![](Images/image00203.jpeg) on top of the QUERY
    tab. You will now have a new view named OrderDelivery_VW.


    ![](Images/image00321.jpeg)


    3.  To check the content of this view, double-click OrderDelivery_VW in the left
    pane then click the DATA tab at the right.


    ![](Images/image00322.jpeg)


    In this view, two columns were selected and renamed from the Customer_TBL table
    - CompanyName changed to CompanyDeliveredTo and USState changed to StateDestination.
    The other two were from Order_TBL table- OrderID and OrderQty (the original column
    names were retained). The rows retrieved from both tables are those records where
    the CustomerID of the Customer_TBL table matches the CustomerID of the Order_TBL
    table.


    Dropping Views


    The DROP VIEW command is the statement used to destroy an existing view from the
    database. The basic syntax is:


    DROP VIEW VIEW_NAME;


    To drop or delete the entire Customer_VW view:


    1.  Click the ![](Images/image00255.jpeg) option, empty QUERY tab and then type
    the following lines of code:


    DROP VIEW Customer_VW;


    2.  Click the EXECUTE QUERY button ![](Images/image00218.jpeg) on top of the QUERY
    tab. You will notice that the Customer_VW view is already deleted from the Views
    list.


    ![](Images/image00323.jpeg)


    In this chapter you have learnt the definition and importance of database views
    in SQL. You have also performed common operations in manipulating views, such
    as creating and dropping them. In the next chapter you will learn more in-depth
    concepts in designing databases in SQL – primary and foreign keys, indexes and
    normalized databases.


    # Chapter Ten: Enhancing Database Designs


    In this chapter you will gain more in-depth knowledge on enhancing database designs
    with the use of primary and foreign keys, indexes and normalization techniques.
    Having a better understanding of designing databases will provide the software
    application you are using an edge by performing queries more effectively and maintaining
    data integrity at all times.


    Assigning Primary and Foreign Keys


    It is one of the best practices to assign a primary key when you define a database
    table. In a relational database, the primary key is a special field or combination
    of fields that make each record in the table unique. Since the presence of the
    primary key does not permit the duplication of values on the column to which it
    was assigned, then data integrity is guaranteed. Also, fields that are designated
    as primary keys cannot contain null values. Defining a primary key, whether it
    is explicit or implied, occurs during table creation. Normally, the tables with
    primary keys are regarded as parent tables, meaning these tables provide information
    to another table or what is termed as the child table. Consequently, child tables
    are dependent on the parent table.


    In the previous chapters, you have been dealing with the CUSTOMER table and the
    ORDER Table. What if you have another table called the PRODUCT Table that contains
    the following fields or columns: Product ID, Product Name and Price per Unit?
    You will have the following relationship from these three tables:


    ![](Images/image00324.jpeg)


    From the figure above, the CUSTOMER_TBL and the PRODUCT_TBL are the parent tables
    of the child table ORDER_TBL (this describes a parent-child relationship in database
    design). As you can see, the fields named CustomerID and ProductID are the primary
    keys of the parent tables. These two fields are also present in the child table.
    They now become foreign keys of the ORDER_TBL table. In other words, a foreign
    key is a column or field present in the child table that references to the primary
    key of its parent table.


    Unlike the primary key, a foreign key does not need to be unique all the time.
    In addition, the name of the foreign key could be different from the name of the
    primary key that it references to. Furthermore, the ProductID of the parent table
    (PRODUCT_TBL) can never have duplicate entries, but not the corresponding ProductID
    in the child table (ORDER_TBL). However, you should not define and create a foreign
    key value if there is no matching primary key value.


    Understanding Indexes


    When a database starts to slow down, specifically its SQL queries, you can create
    and implement indexes to improve its performance. Such indexes are important objects
    that serve as pointers associated to the data of a particular table. The primary
    function of an index is to determine the exact physical location of the data when
    a query is executed to improve its retrieval process. It works like a book’s alphabetically
    arranged index that helps you find the information you need in a much easier way
    using its page numbers. Thus, time is saved, since you do not need to scan one
    row at a time (most especially in extremely large databases) and just go directly
    to the required record.'
