  Name: foo2, dtype: float64\n```\n\n## 将分类数据转换为数值数据\n\n机器学习中的一项常见任务是将包含字符数据的特征转换为包含数值数据的特征。\n\
  \nListing 3.6 显示了 `sometext.tsv` 的内容，其中包含已标记的数据（垃圾邮件或正常邮件），这些数据用在 Listing 3.7 中显示的代码示例。\n\
  \n***列表 3.6: sometext.tsv***\n\n```\n type    text\nham     I'm telling the truth\n\
  spam    What a deal such a deal!\nspam    Free vacation for your family\nham   \
  \  Thank you for your help\nspam    Spring break next week!\nham     I received\
  \ the documents\nspam    One million dollars for you\nham     My wife got covid19\n\
  spam    You might have won the prize\nham     Everyone is in good health\n```\n\n\
  Listing 3.7 显示了 `cat2numeric.py` 的内容，该展示了如何将文本字段转换为相应的数值字段。\n\n***列表 3.7: cat2numeric.py***\n\
  \n```\n import pandas as pd\nimport numpy as np\n\ndf = pd.read_csv('sometext.tsv',\
  \ delimiter='\\t')\n\nprint(\"=> First rows (before):\")\nprint(df.head())\n\n#\
  \ map ham/spam to 0/1:\ndf['type'] = df['type'].map({'ham':0, 'spam':1})\n\nprint(\"\
  => First rows (after):\")\nprint(df.head())\n```\n\nListing 3.7 使用 `sometext.tsv`\
  \ 文件的内容初始化数据帧 `df`，然后通过调用 `head(5)` 显示前五行。Listing 3.7 中的代码片段调用 `map()` 方法将 `type`\
  \ 列中的 `ham` 替换为 0，将 `spam` 替换为 1，所示：\n\n```\ndf['type'] = df['type'].map({'ham':0,\
  \ 'spam':1})\n```\n\nListing 3.7 再次调用 `head()` 方法来显示重命名列内容的数据集的前五行。运行 Listing 3.7\
  \ 中的代码，你将看到以下输出：\n\n```\n => First rows (before):\n   type                     \
  \      text\n0   ham          I'm telling the truth\n1  spam      What a deal such\
