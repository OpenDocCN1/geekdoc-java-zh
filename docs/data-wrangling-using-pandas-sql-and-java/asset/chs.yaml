  \ = substr(time_part,1,3) \"0\" substr(time_part,4)\n       #print \"*** 新 time_part:\"\
  ,time_part\n     } else {\n       print \"无法找到小时\"\n       VALID_DATE=\"false\"\n\
  \     }\n   }\n\n   if(VALID_DATE == \"true\") {\n     # 步骤 5：提取分钟：#05:44\n    \
  \ #print \"时间部分:\",time_part\n     if(time_part ~ /^[0-9]{2}:[0-9]{2}/) {\n    \
  \   minutes = substr(time_part,4,2)\n       #print \"正常分钟: \",minutes\n     } else\
  \ if(time_part ~ /^[0-9]{2}:[0-9]/) {\n       minutes = \"0\" substr(time_part,4,1)\n\
  \       #print \"1 短分钟: \",minutes\n       time_part = substr(time_part,1,3) \"\
