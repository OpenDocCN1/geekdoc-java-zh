  \ 和 `Pandas` 等不同工具执行转换过程。恭喜你！无论你是初学者还是经验丰富的数据科学家，可能都学了一些在其他项目中大有益的新技巧。\n\n# 附录 A：使用\
  \ awk\n\n本附录向你介绍了 `awk` 命令，它在处理数据和重构方面非常多能。事实上，这个工具是如此强大，以至于有整本书都是关于它写的。`awk` 本质上是一种单条命令的编程语言，它接受标准输入，产生标准输出，并像其他\
  \ Unix 命令一样使用正则表达式和元字符。这使你能够将其插入其他表达式中，并几乎完成任何事情，代价是增加了命令的复杂性。一眼看出 `awk` 的许多特性是非常值得的。\n\
  \n本附录的第一部分提供了 `awk` 命令的简要介绍。你将学习关于 `awk` 的一些内置变量以及如何使用 `awk` 操作字符串变量。注意，其中一些与字符串相关的示例也可以使用\
  \ `bash` 命令处理。附录的第二部分将向你展示 `awk` 中的条件逻辑、循环和 `for` 循环，以操作行和列。该部分还展示了如何删除数据集中的行并合并行，以及如何将文件内容作为单行打印。你会看到如何连接数据集中的行组。\n\
  \n第三部分包含了涉及 `awk` 中元字符和字符集的代码示例。你还将看到如何在使用 `awk` 命令中使用条件逻辑来判断是否打印某行文本。第四部分说明了如何将包含多个\
  \ \".\" 字符的文本字符串作为分隔符进行分割，随后是 `awk` 示例用于在包含数值数据的文件中执行数值计算（如加法、减法、乘法和除法）。该部分展示了 `awk`\
  \ 中可用的各种数值函数，以及如何在固定列中打印文本。\n\n第五部分解释了如何对齐数据集中的列以及如何合并列。你将看到如何从数据选择子列并处理多行记录。该部分包含了一些单行\
  \ `awk` 命令，这些对于操作数据集的内容非常有用。附录的最后部分有一组涉及嵌套引号和结构化数据集的用例。\n\n## awk 命令\n\n`awk` (Aho,\
  \ Weinberger, and Kernighan) 命令具有类 C 语法，你可以使用这个工具对数字和文本字符串执行复杂操作。顺便提一下，还有 `gawk`\
  \ 命令（即 GNU `awk`）以及 `nawk` 命令（即“新” `awk`，书中未讨论这两个命令）。`nawk` 的优势之一是它允许你从外部设置内部变量的值。\n\
  \n#### 控制 awk 的内置变量\n\n`awk` 命令提供了你可以从默认值更改的变量，用以控制 `awk` 执行操作的方式。此类变量（及其默认值）的 `FS`\
  \ (\" \")、`RS` (\"\\n\")、`OFS` (\" \")、`ORS` (\"\\n\")、`SUBSEP` 和 `IGNORECASE`。变量\
  \ `FS` 和 `RS` 指定字段分隔符和记录分隔符，而变量 `OFS` 和 `ORS` 分别指定输出字段分隔符和输出记录分隔符。\n\n你可以将字段分隔符视为我们之前在其他命令中使用的分隔符/IFS。记录分隔符的行为类似于\
  \ `sed` 处理单行的方式；例如，`sed` 可以匹配或删除一个范围的行，而不是匹配或删除符合正则表达式的内容（而默认 `awk` 记录分隔符是换行符，因此默认情况下\
  \ `awk` 和 `sed` 具有相似的操控和引用文本文件中行的能力）。\n\n作为一个简单的示例，你可以通过更改 `ORS`（从默认的一个换行符改为两个换行符）在文件的每行之后打印一个空行，如下所示：\n\
  \n```\ncat columns.txt | awk 'BEGIN { ORS =\"n\\n\" } ; { print $0 }'\n```其他内置变量包括\
  \ `FILENAME`（`awk` 正在读取的文件名）、`FNR`（当前文件中的记录数）、`NF`（当前输入记录的字段数）以及 `NR`（自程序执行以来 `awk`\
  \ 处理的输入记录数）。\n\n查阅在线文档获取有关 `awk` 命令这些（以及其他）参数的更多信息。\n\nawk 命令是如何工作的？\n\n`awk` 命令逐条记录读取输入文件（默认情况下，一个记录是一行）。如果记录匹配模式，则执行动作（否则不执行任何动作）。如果没有给出搜索模式，则\
  \ `awk` 会对输入的每条记录执行给定的动作。如果没有给出动作，默认行为是打印所有匹配给定模式的记录。最后，不带任何动作的空括号 `{}` 什么都不做（即程序不会执行默认的打印操作）。注意，动作中的每条语句应用分号隔开。\n\
  \n为了让上述段落更易理解，这里有一些涉及文本字符串和 `awk` 命令的简单示例（结果显示在每个代码段之后）。`-F` 切换将字段分隔符设置为其随后的内容，在本例中是空格。切换通常会为需要在\
  \ `BEGIN{}` 块内部使用命令的动作提供快捷方式：\n\n\n\n\n\n```\n x=\"a b c d e\"\necho $x |awk -F\"\
  \ \" '{print $1}'\na\necho $x |awk -F\" \" 'a{print NF}'\n5\necho $x |awk -F\" \"\
  \ '{print $0}'\na b c d e\necho $x |awk -F\" \" '{print $3, $1}'\nc a\n```\n\n让我们将\
  \ `FS`（记录分隔符）更改为空字符串以计算字符串的长度，这次使用 `BEGIN{}` 语法：\n\n```\n echo \"abc\" | awk 'BEGIN\
  \ { FS = \"\" } ; { print NF }'\n3\n```\n\n以下示例展示了将 `test.txt` 指定为 `awk` 命令输入文件的几种等效方法：\n\
  \n```\n awk < test.txt '{ print $1 }'\nawk '{ print $1 }' < test.txt\nawk '{ print\
  \ $1 }' test.txt\n```\n\n这里显示了另一种方法（正如我们之前讨论的，这可能是无效的，所以只有当 `cat` 能以某种方式增加价值时才这样做）：\n\
  \n```\n cat test.txt | awk '{ print $1 }'\n```\n\n这个用四种方式完成相同任务的简单示例应该说明了为什么对任何复杂的\
  \ `awk` 调用进行注释几乎总是一个好主意。下一个查看你代码的人可能不知道或不记得你正在使用的语法。\n\n## 使用 printf() 语句对齐文本\n\n\
  由于 `awk` 是单个命令内部的编程语言，它也有自己的通过 `printf()` 语句产生格式化输出的方法。\n\n列表 A.1 显示了 `columns2.txt`\
  \ 的内容，列表 A.2 显示了 脚本 `AlignColumns1.sh` 的内容，该脚本向你展示了如何对齐文本列。\n\n**列表 A.1：columns2.txt**\n\
  \n```\n one two\nthree four\none two three four\nfive six\none two three\nfour five\n\
  ```\n\n**列表 A.2：AlignColumns1.sh**\n\n```\n awk '\n{\n   # 在 10 字符列上左对齐 $1\n   #\
  \ 在 10 字符列上右对齐 $2\n   # 在 10 字符列上右对齐 $3\n   # 在 10 字符列上右对齐 $4\n   printf(\"%-10s*%10s*%10s*%10s*\\\
  n\", $1, $2, $3, $4)\n}\n' columns2.txt\n```\n\n列表 A.2 包含一个 `printf()` 语句，显示文件 `columns2.txt`\
  \ 中每行的前四个字段，每个字段的宽度为 10 个字符。\n\n运行列表 A.2 中的代码输出如下：\n\n```\n one        *       \
  \ two*          *         *\nthree      *       four*          *         *\none\
  \        *        two*     three*     four*\nfive       *        six*          *\
  \         *\none        *        two*     three*         *\nfour       *       \
  \ five*         *         *\n```\n\n请记住 `printf` 是相当强大的，因此它有自己的语法，这超出了本附录的范围。在网上搜索可以找到手册页以及关于“如何使用\
  \ `printf()` 执行 X”的讨论。\n\n## 条件逻辑与控制语句\n\n与其他编程语言一样，`awk` 提供对条件逻辑（`if/else`）和控制语句（`for/while`\
  \ 循环）的支持。`awk` 是不创建、安装并将自定义 shell 脚本添加到路径的情况下，将条件逻辑放入管道命令流的唯一方法。以下代码块展示了如何使用 `if/else`\
  \ 逻辑：\n\n```\n echo \"\" | awk '\nBEGIN { x = 10 }\n{\n  if (x % 2 == 0) {\n   \
  \   print \"x is even\"\n  }\n  else {\n      print \"x is odd\"\n  }\n}\n'\n```\n\
  \n前面的代码块将变量 `x` 初始化为值 10，如果 `x` 能被 2 整除，则打印“x is even”，否则打印“x is odd”。\n\n### while\
  \ 语句\n\n以下代码块说明了如何在 `awk` 中使用 `while` 循环：\n\n```\n echo \"\" | awk '\n{\n  x = 0\n\
  \  while(x < 4) {\n    print \"x:\",x\n    x = x + 1\n  }\n}\n'\n```\n\n前面的代码块生成了以下输出：\n\
  \n```\n x:0\nx:1\nx:2\nx:3\n```\n\n以下代码块说明了如何在 `awk` 中使用 `do while` 循环：\n\n```\n\
  \ echo \"\" | awk '\n{\n  x = 0\n\n  do {\n    print \"x:\",x\n    x = x + 1\n \
  \ } while(x < 4)\n}\n'\n```\n\n前面的代码块生成了以下输出：\n\n```\n x:0\nx:1\nx:2\nx:3\n```\n\
  \n### awk 中的 for 循环\n\n列表 A.3 显示了 `Loop.sh` 的内容，它说明了如何在循环中打印数字列表。注意 `i++` 是 `awk`（以及大多数\
  \ C 派生语言）中编写“I=I+1”的另一种方式。\n\n**列表 A.3：Loop.sh**\n\n```\nfor (i=0; i<5; i++) {\n\
  \  print i\n}\n```\n\n\n\n\n解释：这里的 `%s` 是 `printf()` 的记录分隔符语法，其其后的结束引号意味着记录分隔符为空字段\"\
  \"”。我们 `awk` 的默认记录分隔符是 `\\n`（换行符），因此 `printf()` 语句删除了所有的换行符。空行将完全消失，因为它们只包含换行符，所以结果是任何实际文本将合并在一起，中间没有任何间隔符。\n\
  \n如果我们在 `%s` 和结束引号之间添加一个空格，那么每个字符块之间将有一个空格，并且每个换行都会额外多出一个空格。注意下面的注释是如何提高代码片段理解性的：\n\
  \n```\n# 通过移除换行符将所有文本合并为单行\nawk '{printf(\"%s\", $0)}' test4.txt\n```\n\n## 在文件中合并行组\n\
  \nListing A.8 显示了 `digits.txt` 的内容，Listing A.9 显示了 `digits.sh` 的内容，它“合并”了文件 `digits.txt`\
  \ 中连续的三行文本。\n\n**列表 A.8: digits.txt**\n\n```\n 1\n2\n3\n4\n5\n6\n7\n8\n9\n```\n\n\
  **列表 A.9: digits.sh**\n\n```\n awk -F\" \" '{\n  printf(\"%d\",$0)\n  if(NR % 3\
  \ == 0) { printf(\"\\n\") }\n}' digits.txt\n```\n\nListing A.9 将连续的三行文本打印在同一行上，之后打印一个换行符。这实现了“合并”每三行连续文本的效果。运行\
  \ `digits.sh` 的输出在此：\n\n```\n 123\n456\n789\n```\n\n## 在文件中合并交替行\n\nListing A.10\
  \ 显示了 `columns2.txt` 的内容，Listing A.11 显示了 `JoinLines.sh` 的内容，它“合并”了文件 `columns2.txt`\
  \ 中连续的两行文本。\n\n**列表 A.10: columns2.txt**\n\n```\n one two\nthree four\none two three\
  \ four\nfive six\none two three\nfour five\n```\n\n**列表 A.11: JoinLines.sh**\n\n\
  ```\n awk '\n{\n   printf(\"%s\",$0)\n   if( $1 !~ /one/) { print \" \" }\n}\n'\
  \ columns2.txt\n```\n\n运行 Listing A.11 的输出在此：\n\n```\n one two three four\none two\
  \ three four five six\none two two four five\n```\n\n注意，Listing A.11 中的代码取决于交替文本行的第一个字段中是否存在字符串“one”。我们是基于匹配简单模式进行合并的，而不是将其与记录组合绑定。\n\
  \n要合并每对行而不是基于模式匹配合并，请使用 Listing A.12 中的修改代码。\n\n**列表 A.12: JoinLines2.sh**\n\n```\n\
  \ awk '\nBEGIN { count = 0 }\n{\n   printf(\"%s\",$0)\n   if( ++count % 2 == 0)\
  \ { print \" \" }\n} columns2.txt\n```\n\n另一种“合并”连续行的方法显示在 Listing A.13 中，其中输入文件和输出文件指的是你可以填充数据的文件。这是另一个\
  \ `awk` 命令的示例，如果在没有注释的程序中遇到它，它可能会是一个谜题。它执行的操作与 Listing A.12 完全相同，但由于语法更紧凑，它的目的并不那么直观。\n\
  \n**列表 A.13: JoinLines2.sh**\n\n```\n inputfile=\"linepairs.csv\"\noutputfile=\"\
  linepairsjoined.csv\"\nawk ' NR%2 {printf \"%s,\", $0; next;}1' < $inputfile > $outputfile\n\
  ```\n\n## 使用元字符和字符集进行匹配\n\n如果我们可以匹配简单模式，也可以匹配正则表达式。Listing A.14 显示了 `Patterns1.sh`\
  \ 的内容，它使用元字符来匹配文件 `columns2.txt` 中文本行的开头和结尾。\n\n**列表 A.14: Patterns1.sh**\n\n```\n\
  \ awk '\n   /^f/    { print $1 }\n   /two $/ { print $1 }\n' columns2.txt\n```\n\
  \n运行 Listing A.14 的输出在此：\n\n```\n one\nfour\n```\n\nListing A.15 显示了 `RemoveColumns.txt`\
  \ 的内容，其行包含不同数量的列。\n\n**列表 A.15: columns3.txt**\n\n```\n 123 one two\n456 three four\n\
  one two three four\nfive 123 six\none two three five\n```\n\nListing A.16 显示了 `MatchAlpha.sh`\
  \ 的内容，它匹配以字母开文本以及第二列包含数字字符串的行。\n\n**列表 A.16: MatchAlpha.sh**\n\n```\n awk '\n{\n\
  \   if($0 ~ /^[a-z]/) print $0\n   if($0 ~ /[0-9]/) print $0\n}' columns3.txt\n\
  ```\n\nListing A.16 的输出在此：\n\n```\n 123 one two\none two three four\n```\n\n## 使用条件逻辑打印行\n\
  \nListing A.17 显示了 `products.txt` 的内容，它包含三列信息。\n\n**列表 A.17: products.txt**\n\n\
  ```\n MobilePhone 400  new\nTablet      300  used\nMobilePhone 100  used\n```\n\n\
  以下代码片段打印 `products.txt` 中第二列大于 300 的行：\n\n```\n awk '$2 > 300' products.txt\n```\n\
  \n上述代码片段的输出是：\n\n```\n MobilePhone 400  new\n```\n\n以下代码片段打印 `products.txt` 中 product\
  \ 等于 new 的行：\n\n```\n awk '($3 == \"new\")' products.txt\n```\n\n上述代码片段的输出是：\n\n\
  ```\n MobilePhone 400  new\nTablet      300  new\n```\n\n以下代码片段打印 `products.txt`\
  \ 中第二列等于 300 的行的第一列和第三列：\n\n```\n awk ' $2 == 300 { print $1, $3 }' products.txt\n\
  ```\n\n上述代码片段的输出是：\n\n\n\n以下代码片段打印 `products.txt` 中以字符串 `Tablet` 开头的文本行的第一列和第三列：\n\
