  列表 1.8 显示了执行 列表 1.7 中代码生成的输出。\n\n***列表 1.8: datetime2.out***\n\n```\n Time in seconds\
  \ since the epoch: 1375144195.66\nCurrent date and time:  2013-07-29 17:29:55.664164\n\
  Or like this:  13-07-29-17-29\nCurrent year:  2013\nMonth of year:  July\nWeek number\
  \ of the year:  30\nWeekday of the week:  1\nDay of year:  210\nDay of the month\
  \ :  29\nDay of week:  Monday\n```\n\nPython 还允许你对日期相关值进行算术计算，如下代码块所示：\n\n```\n\
  \ >>> from datetime import timedelta\n>>> a = timedelta(days=2, hours=6)\n>>> b\
  \ = timedelta(hours=4.5)\n>>> c = a + b\n>>> c.days\n2\n```\n\n#### 异常处理\n\n与 JavaScript\
  \ 不同，你可以使用 `try/except` 块来处理异常。这里有一个示例：\n\n```\n try:\n    x = 4\n    y = 'abc'\n\
  except TypeError:\n    print('cannot add int and str')\n```\n\n前面的代码块更紧凑，但你不知道发生了哪种错误类型。Python\
  \ 允许你定义自定义异常，但这个主题超出了本书的范围。\n\n如所示，前面的代码块指定了更细粒度的异常，随后是一个“通用的” except 块，用于处理执行期间发生的所有其他异常。\n\
  \n列表 1.10 显示了 Python 脚本 `Exception1.py` 的内容，它演示了如何处理不同类型的异常，包含了由于文件缺失导致的异常。\n\n\
  ***列表 1.10: Exception1.py***\n\n```\n import sys\n\ntry:\n    f = open('myfile.txt')\n\
  \    s = f.readline()\n    i = int(s.strip())\nexcept IOError as err:\n    print(\"\
  I/O error: {0}\".format(err))\nexcept ValueError:\n    print(\"Could not convert\
  \ data to an integer.\")\nexcept:\n    print(\"Unexpected error:\", sys.exc_info()[0])\n\
  \    raise\n```\n\n\n\n\n\nPython 允许你通过 `input()` 函数（Python 2.x 使用 `raw_input()`）从命令行读取用户输入。通常，你会将用户输入赋值给变量，该变量将包含用户从键盘输入的所有字符。当用户按下\
  \ `<return>` 键时输入结束（该键包含在输入字符中）。Listing 1.11 显示了 `UserInput1.py` 的内容，它提示用户输入名称，然后使用插值显示响应。\n\
  \n***列表 1.11: UserInput1.py***\n\n```\n userInput = input(\"Enter your name: \"\
  )\nprint (\"Hello %s, my name is Python\" % userInput)\n```\n\nListing 1.11 的输出在此处（假设用户输入了单词\
  \ Dave）：\n\n```\n Hello Dave, my name is Python\n```\n\nListing 1.11 中的 `print()`\
  \ 语句通过 `%s` 使用字符串插值，它会替换 `%` 符号后的变量值。当你想要指定运行时确定的内容时，此功能显然非常有用。用户输入可能会导致异常（取决于你的代码执行的操作），因此包含异常处理代码是非常重要的。\n\
  \nListing 1.12 显示了 `UserInput2.py` 的内容，它提示用户输入字符串并在 `try/except` 块中尝试将字符串转换为数字。\n\
  \n***列表 1.12: UserInput2.py***\n\n```\n userInput = input(\"Enter something: \"\
  )\n\ntry:\n  x = 0 + eval(userInput)\n  print('you entered the number:',userInput)\n\
  except:\n  print(userInput,'is a string')\n```\n\nListing 1.12 在将用户输入转换为数字的结果加上数字\
  \ `0`。如果转换成功，将显示一条包含用户输入的消息。如果转换失败，`except` 代码块将包含一个显示消息的 `print()` 语句。\n\n此代码示例使用了\
  \ `eval()` 函数，应该避免使用该函数，以防你的代码执行任意的（可能具有破坏性的）命令。\n\nListing 1.13 显示了 `UserInput3.py`\
  \ 的内容，它提示用户输入两个数字并在一对 `try/except` 块中尝试计算它们的和。\n\n***列表 1.13: UserInput3.py***\n\
  \n```\n sum = 0\n\nmsg = 'Enter a number:'\nval1 = input(msg)\n\ntry:\n  sum = sum\
  \ + eval(val1)\nexcept:\n  print(val1,'is a string')\n\nmsg = 'Enter a number:'\n\
  val2 = input(msg)\n\ntry:\n  sum = sum + eval(val2)\nexcept:\n  print(val2,'is a\
  \ string')\n\nprint('The sum of',val1,'and',val2,'is',sum)\n```\n\nListing 1.13\
  \ 包含两个 `try` 块，每个块后面都跟着一个 `except` 语句。第一个 `try` 块尝试将用户提供的第一个数字加到变量 `sum`，第二个 `try`\
  \ 块尝试将第二个用户提供的数字加到之前输入的数字。\n\n如果任一输入字符串不是有效数字，就会发生错误消息；如果两个都是有效数字，将显示一条包含输入数字及其和的消息。请务必阅读本章节前面提到的关于\
  \ `eval()` 函数的警告。\n\n### 命令行参数\n\nPython 提供了 `getopt` 模块来解析命令行选项和参数，而 `sys` 模块通过\
  \ `sys.argv` 访问任何命令行参数。这有两个作用：\n\n* `sys.argv` 是命令行参数的列表。\n* `len(sys.argv)` 是命令行参数的数量。\n\
  \n在这里，`sys.argv[0]` 是程序名，因此如果 Python 程序名为 `test.py`，它就匹配 `sys.argv[0]` 的值。\n\n现在你可以在命令行上为\
  \ Python 程序提供输入值，而不是通过提示用户输入来提供输入值。例如，考虑此处所示脚本 `test.py`：\n\n```\n #/usr/bin/python\n\
  import sys\nprint('Number of arguments:',len(sys.argv),'arguments')\nprint('Argument\
  \ List:', str(sys.argv))\n```\n\n如下所示运行上述脚本：\n\n```\n python test.py arg1 arg2 arg3\n\
  ```\n\n这将产生以下结果：\n\n```\n Number of arguments: 4 arguments.\nArgument List: ['test.py',\
  \ 'arg1', 'arg2', 'arg3']\n```\n\n从命令行指定输入值提供了有用的功能。例如，假设你有一个自定义的 Python 类，包含 `add`\
  \ 和 `subtract` 方法来相加和相减一对数字。\n\n你可以使用命令行参数指定对数字数字执行哪种方法，如下：\n\n```\n python MyClass\
  \ add 3 5\npython MyClass subtract 3 5\n```\n\n此功能非常有用，因为你可以编程地执行 Python 类中的不同方法，这意味着你也可以为你的代码编写单元测试。\n\
  \nListing 1.14 显示了 `Hello.py` 的内容，向你展示了如何使用 `sys.argv`。\n\n***列表 1.14: Hello.py***\n\
  \n```\n import sys\n\ndef main():\n  if len(sys.argv) >= 2:\n    name = sys.argv[1]\n\
  \  else:\n    name = 'World'\n  print('Hello', name)\n\n# 调用 main() 的标准模板\nif __name__\
  \ == '__main__':\n  main()\n```\n\nListing 1.14 使用条件逻辑确定是否执行 `main()`。\n\n### 总结\n\
  \n本章展示了如何通过 `input()` 函数（Python2.x 使用 `raw_input()`）从命令行读取用户输入。通常，你会将用户输入赋值给变量，该变量将包含用户从键盘输入的所有字符。当用户按下\
