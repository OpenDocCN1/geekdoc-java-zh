  \   50.000000   40.000000   60.000000\n75%      525.000000  1020.000000  1530.000000\n\
  mark      1000.000000  2000.000000  3000.000000\n```\n\n## Pandas 布尔运算\n\nPandas\
  \ 支持对数据框进行布尔操作，例如逻辑或、逻辑与以及对数据框的逻辑取反。Listing 3.3 显示了 `pandas_boolean_df.py` 的内容，说明了如何定义一个行和列均为布尔值的数据框。\n\
  \n***代码列表 3.3: pandas_boolean_df.py***\n\n```\n import pandas as pd\n\ndf1 = pd.DataFrame({'a':\
  \ [1, 0, 1], 'b': [0, 1, 1] }, dtype=bool)\ndf2 = pd.DataFrame({'a': [0, 1, 1],\
  \ 'b': [1, 1, 0] }, dtype=bool)\n\nprint(\"df1 & df2:\")\nprint(df1 & df2)\n\nprint(\"\
  df1 | df2:\")\nprint(df1 | df2)\n\nprint(\"df1 ^ df2:\")\nprint(df1 ^ df2)\n```\n\
  \nListing 3.3 初始化了数据框 `df1` 和 `df2`，然后计算 `df1 & df2`、`df1 | df2` 和 `df1 ^ df2`，分别代表\
  \ `df1` 和 `df2` 的逻辑与、逻辑或和逻辑取反。运行 Listing 3.3 中代码的输出如下：\n\n```\n df1 & df2:\n   \
  \    a      b\n0  False  False\n1  False   True\n2   True  False\ndf1 | df2:\n \
  \     a     b\n0  True  True\n1  True  True\n2  True  True\ndf1 ^ df2:\n       a\
  \      b\n0   True   True\n1   True  False\n2  False   True\n```\n\n## 转置 Pandas\
  \ 数据框\n\n`T` 属性（以及 `transpose` 函数）允许你生成 Pandas 数据框的转置，类似于 NumPy 的 `ndarray`。\n\n\
  例如，以下代码片段定义了 Pandas 数据框 `df1`，然后显示了 `df1` 的转置：\n\n```\n df1 = pd.DataFrame({'a':\
  \ [1, 0, 1], 'b': [0, 1, 1] }, dtype=int)\n\nprint(\"df1.T:\")\nprint(df1.T)\n```\n\
  \n输出如下：\n\n```\n df1.T:\n   0  1  2\na  1  0  1\nb  0  1  1\n```\n\n\n\n\n以下代码片段定义了\
  \ Pandas 数据帧 `df1` 和 `df2`，然后显示了它们的和：\n\n```\n df1 = pd.DataFrame({'a' : [1, 0,\
  \ 1], 'b' : [0, 1, 1] }, dtype=int)\ndf2 = pd.DataFrame({'a' : [3, 3, 3], 'b' :\
  \ [5, 5, 5] }, dtype=int)\n\nprint(\"df1 + df2:\")\nprint(df1 + df2)\n```\n\n输出如下：\n\
  \n```\n df1 + df2:\n   a  b\n0  4  5\n1  3  6\n2  4  6\n```\n\n## PANDAS 数据帧与随机数\n\
