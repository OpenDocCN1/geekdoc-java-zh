  \ \" +\n                   \" height INTEGER, \" +\n                   \" PRIMARY\
  \ KEY ( id ))\";\n\n          // Step 4: execute both SQL statements:\n        \
  \ stmt.executeUpdate(sql1);\n         stmt.executeUpdate(sql2);\n         System.out.println(\"\
  Created table FRIENDS in database\");\n      } catch (SQLException e) {\n      \
  \   e.printStackTrace();\n      }\n   }\n}\n```\n\n列表 5.2 以几个 import 语句开始，指定了位于\
  \ JDBC JAR 文件中的 Java 类，该文件也包含在 `CLASSPATH` 环境变量中（否则代码将无法成功编译）。\n\n下部分代码初始化了字符串变量\
