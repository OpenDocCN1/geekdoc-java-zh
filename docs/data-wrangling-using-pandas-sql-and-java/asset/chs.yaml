  ```\n import pandas as pd\n\ncan_weather = pd.DataFrame({\n    \"city\": [\"Vancouver\"\
  ,\"Montreal\"],\n    \"temperature\": [72,65],\n    \"humidity\": [40,25]\n})\n\n\
