  011 234 4560987\n011-234 456 0987\n011-155580\n033 234 4560987\n039-234 456 0987\n\
  034 212 555-1212\n034-212-555-1212\n044(123)5551212\n044(456)555-1212\n044(789)555\
  \ 1212\n049-(123)5551212\n049-(456)555-1212\n049-(789)555 1212\n052(278)9551212\n\
  ```\n\n## 转换数字日期\n\n本节将向你展示如何将日期格式转换为常用的 MM-DD-YYYY 格式。在深入研究代码之前，以下列表包含了日期的月份、日期和年份的示例格式：\n\
  \n```\n • yy:   两位年份                 (ex: 22)\n • yyyy: 四位年份                (ex:\
  \ 2022)\n • m:    一位月份                 (ex: 4)\n • mm:   两位月份                (ex:\
  \ 04)\n • mmm:  三字母月份               (ex: Apr)\n • mmmm: 月份全称                (ex:\
  \ April)\n • d:    一位日期                 (ex: 2)\n • dd:   两位日期                 (ex:\
  \ 02)\n • ddd:  三字母星期               (ex: Sat)\n • dddd: 星期全称                (ex:\
  \ Saturday)\n```\n\nListing 6.16 显示了 `dates.txt` 的内容，其中包含了各种格式的虚构日期，**粗体**字符串格式无效。\n\
  \n***LISTING 6.16: dates.txt***\n\n```\n 03/15/2021\n3/15/2021\n3/15/21\n03/5/2021\n\
  3/5/2021\n3/5/21\n3/5/212\n3/5/21Z\n```\n\n\n\n\n\nListing 6.17 显示了 `dates.sh` 的内容，它展示了如何从\
  \ Listing 6.16 中的日期移除非数字字符，使其具有相同的格式。\n\n***Listing 6.17: dates.sh***\n\n```\n cat\
  \ dates.txt | awk -F\"/\"\n{\n   DATE_FORMAT=\"valid\"\n   # step 1: extract the\
  \ month\n   if($0 ~ /^[0-9]{2}/) {\n     month = substr($0,1,2)\n     #print \"\
  normal month: \",month\n   } else if($0 ~ /^[0-9]\\//) {\n     month = \"0\" substr($0,1,1)\n\
  \     #print \"short month: \",month\n   } else {\n     DATE_FORMAT=\"invalid\"\n\
  \   }\n   if(DATE_FORMAT=\"valid\") {\n     # step 2: extract the day\n     if($0\
  \ ~ /^[0-9][0-9]\\/[0-9][0-9]/) {\n       day = substr($0,4,2)\n       #print \"\
  normal day: \",day\n     } else if ($0 ~ /^[0-9][0-9]\\/[0-9]\\//) {\n       day\
  \ = \"0\" substr($0,4,1)\n       #print \"short day: \",day\n     } else {\n   \
  \    DATE_FORMAT=\"invalid\"\n     }\n   }\n\n   if(DATE_FORMAT=\"valid\") {\n \
  \    # step 3: extract the year\n     if($0 ~ /^[0-9][0-9]\\/[0-9][0-9]\\/[0-9][0-9][0-9][0-9]$/)\
  \ {\n       year = substr($0,7,4)\n       #print \"normal year: \",year\n     }\
  \ else if ($0 ~ /^[0-9][0-9]\\/[0-9]\\/[0-9][0-9]\\/$/) {\n       year = \"20\"\
  \ substr($0,7,2)\n       #print \"short year: \",year\n     }\n   } else {\n   \
  \  DATE_FORMAT=\"invalid\"\n   }\n\n   if(DATE_FORMAT=\"valid\") {\n     printf(\"\
  => $0: %s MM/DD/YYYY: %s-%s-%s\\n\",$0,month,day,year)\n   } else {\n     print\
  \ \"invalid format: \",$0\n   }\n}\n'\n```\n\nListing 6.17 包含的代码如果你不熟悉正则表达式可能会可能会望而生畏。让我们尝试揭开代码的神秘面，从代表任何单个数字的正则表达式\
  \ `[0-9]` 开始。`^[0-9]\\/` 中开头的脱字符符号 `^` 表示数字必须出现在最左侧（即第一个）位置。此外，正则表达式 `^[0-9]\\/`\
  \ 表示单数字后必须紧跟一个 `/`。需要反斜杠 `\\` 来“转义”元字符 `/`。这意味着它将被视为一个普通字符而不是元字符。例如，字符串 `3/` 匹配该正则表达式，但字符串\
  \ `03/`、`B3/` 和 `AB/` 都不匹配。\n\n现在让我们查看正则表达式 `^[0-9][0-9]\\/`，它代表任何以两个数字开头并接 `/`\
  \ 字符的字符串。因此，字符串 `03/` 匹配该正则表达式，但字符串 `3/`、`B3/` 和 `AB/` 都不匹配。\n\n接下来，正则表达式 `^[0-9][0-9]\\\
  /[0-9][0-9]` 代表任何以两个数字开头、后面是 `/` 字符、又是两个数字的字符串。因此，字符串 `03/15` 匹配该正则表达式，但字符串 `3/5`、`03/5`\
  \ 和 `3/15` 都不匹配。\n\n最后，正则表达式 `^[0-9][0-9]\\/[0-9][0-9]\\/[0-9][0-9][0-9][0-9]$`\
  \ 匹配符合以下条件的字符串：\n\n*   以两个数字开头\n*   后面跟着一个 `/`\n*   后面是两个数字\n*   后面又是另一个 `/`\n*\
  \   最后是四个数字\n*   且没有额外的字符\n\nListing 6.17 包含了匹配包含“短”月份、日期和年份的正则表达式。运行 Listing 6.17\
  \ 中的代码，你将看到以下输出：\n\n```\n => $0: 03/15/2021 MM/DD/YYYY: 03-15-2021\n=> $0: 3/15/2021\
  \ MM/DD/YYYY: 03-15-2021\n=> $0: 3/15/21 MM/DD/YYYY: 03-15-2021\n=> $0: 03/5/2021\
  \ MM/DD/YYYY: 03-05-2021\n=> $0: 3/5/2021 MM/DD/YYYY: 03-05-2021\n=> $0: 3/5/21\
  \ MM/DD/YYYY: 03-05-2021\n=> $0: 03/5/21 MM/DD/YYYY: 03-05-2021\n=> $0: 3/5/21 MM/DD/YYYY:\
  \ 03-05-2021\n```\n\n为什么前面的几行（加粗显示的部分）尽管在年份的正则表达式中出现了 `$` 却被显示为有效？遗憾的是，后两个正则表达式出现在提取日期的正则表达式之后，Listing\
  \ 6.18 显示了 `dates2.sh` 的内容，它检测无效日期，使用了数字的简写符号，并删除了多余的 print 语句。\n\n***Listing 6.18:\
  \ dates2.sh***\n\n```\n cat dates.txt | awk -F\"/\"\n{\n   DATE_FORMAT=\"valid\"\
  \n\n   # step 1: check for invalid\n   if($0 ~ /[A-Za-z]/) {\n     print \"invalid\
  \ characters: \",$0\n     DATE_FORMAT=\"invalid\"\n   } else if($0 ~ /^[0-9]{3}$)\
  \ {\n     print \"invalid format: \",$0\n     DATE_FORMAT=\"invalid\"\n   }\n\n\
  \   if(DATE_FORMAT=\"valid\") {\n     # step 2: extract the month\n     if($0 ~\
  \ /^[0-9][0-9]/) {\n       month = substr($0,1,2)\n     } else if($0 ~ /^[0-9]\\\
  /) {\n       month = \"0\" substr($0,1,1)\n     } else {\n       DATE_FORMAT=\"\
  invalid\"\n     }\n   }\n\n   if(DATE_FORMAT=\"valid\") {\n     # step 3: extract\
  \ the day\n     if($0 ~ /^[0-9]{2}\\/[0-9]{2}/) {\n       day = substr($0,4,2)\n\
  \     } else if ($0 ~ /^[0-9]{2}\\/[0-9]\\/) {\n       day = \"0\" substr($0,4,1)\n\
  \     } else {\n       DATE_FORMAT=\"invalid\"\n     }\n   }\n\n   if(DATE_FORMAT=\"\
  valid\") {\n     # step 4: extract the year\n     if($0 ~ /^[0-9]{2}\\/[0-9]{2}\\\
  /[0-9]{4}$/) {\n       year = substr($0,7,4)\n     } else if ($0 ~ /^[0-9]{2}\\\
  /[0-9]{2}\\/[0-9]{2}$/) {\n       year = \"20\" substr($0,7,2)\n     }\n   }\n\n\
  \   if(DATE_FORMAT=\"valid\") {\n     printf(\"$0: %10s => %s-%s-%s\\n\",$0,month,day,year)\n\
  \   } else {\n     print \"Date invalid:\",$0\n   }\n}\n'\n```\n\nListing 6.18 与\
  \ Listing 6.17 的内容非常相似，但有些不同。第一个不同是 Listing 6.18 检查包含字母的数字并将其报告为格式无效。第二个不同是识别末尾有三个数字的条件代码块。第三个不同是指定多个连续数字的简写方法：`[0-9]{2}`匹配任何一对连续数字，`[0-9]{3}`匹配任何三个连续数字的情况，依此类推。运行\
  \ Listing 6.18 中的代码，你将看到以下输出：\n\n```\n $0: 03/15/2021 => 03-15-2021\n$0:  3/15/2021\
  \ => 03-15-2021\n$0:    3/15/21 => 03-15-2021\n$0:  03/5/2021 => 03-15-2021\n$0:\
  \   3/5/2021 => 03-15-2021\n$0:     3/5/21 => 03-15-2021\ninvalid format:  3/5/212\n\
  $0:    3/5/212 => 03-15-2021\ninvalid characters:  3/5/21Z\n$0:    3/5/21Z => 03-15-2021\n\
  ```\n\n### 转换字母日期格式\n\n本节向你展示如何将日期格式转换为 DD-MON-YYYY 的常用格式。Listing 6.19 显示了 `dates2.txt`\
  \ 的内容，其中包含各种格式的日期，加粗字符串的格式无效。\n\n***Listing 6.19: dates2.txt***\n\n```\n 03/15/2021\n\
  04-SEP-2022\n04-sep-  2022\n04-sep-  22\n05-OCT   2022\n05-oct 2022\n05-oct 22\n\
  06 JAN 2022\n06 jan 2022\n06 jnn 22\n```\n\n\n\n\n\n```bash\n cat dates2.txt  |\
  \ tr -s ' ' |sed -e 's/- /-/g' -e 's/ /-/g' |awk -F\"-\" '\nBEGIN {\n   months[\"\
  JAN\"] = \"JAN\"\n   months[\"FEB\"] = \"FEB\"\n   months[\"MAR\"] = \"MAR\"\n \
  \  months[\"APR\"] = \"APR\"\n   months[\"MAY\"] = \"MAY\"\n   months[\"JUN\"] =\
  \ \"JUN\"\n   months[\"JUL\"] = \"JUL\"\n   months[\"AUG\"] = \"AUG\"\n   months[\"\
  SEP\"] = \"SEP\"\n   months[\"OCT\"] = \"OCT\"\n   months[\"NOV\"] = \"NOV\"\n \
  \  months[\"DEC\"] = \"DEC\"\n}\n{\n   #Valid date formats (Oracle):\n   #DD-MON-YY:\
  \   04-SEP-2022\n   #DD-MON-YYYY: 05-OCT-22\n\n   $0 = toupper($0)\n   DATE_FORMAT=\"\
  valid\"\n\n   # step 1: extract the day:\n   if($0 ~ /^[0-9]\\-/) {\n     day =\
  \ \"0\" substr($0,1,1)\n   } else if($0 ~ /^[0-9][0-9]\\-/) {\n     day = substr($0,1,2)\n\
  \   } else {\n     DATE_FORMAT=\"invalid\"\n   }\n\n   if(DATE_FORMAT=\"valid\"\
  ) {\n     # step 2: extract the month:\n     if($0 ~ /^[0-9]{2}\\-[A-Z]{3}/) {\n\
  \       month = substr($0,4,3)\n     } else {\n       DATE_FORMAT=\"invalid\"\n\
  \     }\n   }\n\n   if(DATE_FORMAT=\"valid\") {\n     # step 3: extract the year:\n\
  \     if($0 ~ /^[0-9]{2}\\-[A-Z]{3}\\-[0-9]{2}/) {\n       year = \"20\" substr($0,8,2)\n\
  \     } else if($0 ~ /^[0-9]{2}\\-[A-Z]{3}\\-[0-9]{4}/) {\n       year = substr($0,8,4)\n\
  \     } else {\n       DATE_FORMAT=\"invalid\"\n     }\n   }\n\n   if(DATE_FORMAT=\"\
  valid\") {\n   if(months[month] == month) {\n      printf(\"%12s => %s-%s-%s\\n\"\
  ,$0,month,day,year)\n   } else {\n      printf(\"Invalid month:  %s-%s-%s\\n\",month,day,year)\n\
  \   } else {\n      print \"Date format invalid:\",$0\n   }\n}\n'\n```\n\n`Listing\
  \ 6.20` 以一组由管道符分隔的命令序列开始，将文件 `dates2.txt` 的内容重定向到 `tr` 命令，该命令会删除多个连续出现的空格。\n\n接下来，将\
  \ `tr` 命令的输出重定向到 `sed` 命令，该命令会删除连字符（`-`）随后的任何空格，然后将任何空格替换为连字符（`-`）。\n\n`sed` 命令的输出被重定向到一个\
  \ `awk` 脚本，该脚本初始化了一个包含全年月份三个字母缩写的数组。该数组在代码后面被引用，用于检测任何无效的月份格式。\n\n`awk` 脚本的主部分与\
  \ `Listing 6.27` 中的内容相似，用于检测各种日期格式，并为每行输入初始化 `day`、`month`（三字母值）和 `year`。运行 `Listing\
  \ 6.20` 中的代码，你将看到以下输出：\n\n```\n 04-SEP-2022 => SEP-04-2020\n 04-SEP-2022 => SEP-04-2020\n\
  \   04-SEP-22 => SEP-04-2022\n 05-OCT-2022 => OCT-05-2020\n 05-OCT-2022 => OCT-05-2020\n\
  \   05-OCT-22 => OCT-05-2022\n 06-JAN-2022 => JAN-06-2020\n 06-JAN-2022 => JAN-06-2020\n\
  Invalid month:  JNN-06-2022\n```\n\n### 处理日期和时间格式\n\n现在你已经看到了 `MM:DD:YYYY` 格式的日期示例，本节将处理\
  \ `YYYY:MM:DD:HH:MM:SS` 格式的日期。尽管本节中基于 `awk` 的代码示例比书中所有其他代码示例都要长，但它是基于你之前在日期相关代码示例中已经过的技术。如果你现在不需要深入研究此代码示例的细节，可以随时跳过本节。\n\
  \n所有字段（年份外）的单数字值都被视为有效，处理所有可能的组合变得非常繁琐。然而，本节中的代码示例向你展示了一种捷径，该方法涉及动态修改输入行，以便输入字符串从左到右处理时被逐步填充。\n\
  \n为了确保这一点，字符串 `3/15/22 5:44` 是有效日期，当代码检查日期字段的有效性时，前面的字符串会如下被修改：\n\n```\n 3/15/22\
  \ 5:44\n03/15/22 5:44\n03/15/2022 5:44\n03/15/2022 05:44\n03/15/2022 05:04\n03/15/2022\
  \ 05:44\n```\n\n正如你所看到的，日期列表中最后一行是完全填充的日期。这种方法显著减少了判断日期格式时需要检查的模式数量。\n\n`Listing\
  \ 6.21` 显示了包含日期的 `dates-times.txt` 内容，`Listing 6.22` 向你展示了 `date-times-padded.sh`\
  \ 的，这是一个基于 `awk` 的 shell 脚本，用于处理 `Listing 6.21` 中的日期。\n\n***LISTING 6.21: dates-times.txt***\n\
  \n```\n 2/30/2020 15:05:44\n2/30/2020 15:05:44\n3/15/22 15:5:44\n4/29/23 15:5:4\n\
  5/16/24 5:05:44\n6/17/25 5:5:44\n7/18/26 5:5:4\n8/19/24 115:05:44\n```\n\n注意 `Listing\
  \ 6.21` 中的第一行和最后一行是无效的：第一行包含月份值 30，这对于任何年份都是无效的，而最后一行包含无效的小时值。\n\n\n\n\n\n```\n\
  \ cat date-times.txt | awk -F\"/\" '\nfunction check_leap_year(year) {\n  #########################################\n\
  \  # 如果满足以下条件，则为闰年：\n  # 1) 它是 4 的倍数且\n  # 2) 世纪必须是 400 的倍数\n  # => 2000 年是闰年，但\
