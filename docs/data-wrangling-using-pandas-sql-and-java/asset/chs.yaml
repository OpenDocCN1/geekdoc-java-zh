  ## 使用 AWK 分割文件名\n\nListing A.18 显示了 `SplitFilename2.sh` 的内容，它了如何分割包含 `.` 字符的文件名以增加文件名某个部分的数值。注意，此代码仅适用于预期语法的文件名。\n\
  \n**列表 A.18: SplitFilename2.sh**\n\n```\n echo \"05.20.144q.az.1.zip\" | awk -F\"\
  .\"\n{\n  f5=$5 + 1\n  printf(\"%s.%s.%s.%s.%s\",$1,$2,$3,$4,$f5)\n}\n```\n\nListing\
  \ A.18 的输出在此：\n\n```\n 05.20.144q.az.2.zip\n```\n\n## 处理后缀算运算符\n\nListing A.19 显示了\
  \ `mixednumbers.txt` 的内容，它包含了后缀运算符，这些运算符指向负（或正）符号出现在列值末尾而不是数字开头的数字。\n\n**列表 A.19:\
  \ mixednumbers.txt**\n\n```\n 324.000-|10|983.000-\n453.000-|30|298.000-\n783.000-|20|347.000-\n\
  ```\n\nListing A.20 显示了 `AddSubtract1.sh` 的内容，它演示了如何相加 Listing A.19 中的数字行。\n\n**列表\
  \ A.20: AddSubtract1.sh**\n\n```\nmyFile=\"mixednumbers.txt\"\n\nawk -F\"|\" '\n\
  BEGIN { line = 0; total = 0 }\n{\n   split($1, arr, \"-\")\n   f1 = arr[1]\n   if($1\
  \ ~ /-/) { f1 = -f1 }\n   line += f1\n\n   split($2, arr, \"-\")\n   f2 = arr[1]\n\
  \   if($2 ~ /-/) { f2 = -f2 }\n   line += f2\n\n   split($3, arr, \"-\")\n   f3\
  \ = arr[1]\n   if($3 ~ /-/) { f3 = -f3 }\n   line += f3\n\n   printf(\"f1: %d f2:\
  \ %d f3: %d line: %d\\n\",f1,f2,f3, line)\n   total += line\n   line = 0\n}\nEND\
  \ { print \"Total: \",total }\n' $myfile\n```\n\nListing A.20 的输出在此。在阅读后面的解释之前，尝试弄清楚代码在执行什么：\n\
  \n```\n f1: -324 f2: 10 f3: -983 line: -1297\nf1: -453 f2: 30 f3: -298 line: -721\n\
  f1: -783 f2: 20 f3: -347 line: -1110\nTotal:  -3128\n```\n\n\n\n代码假设我们知道文件的格式。`split()`\
  \ 函数将每个字段记录转换为长度为 2 的向量：第一个位置是数字，第二个位置为空值或连字符，然后将第一个位置的数字捕获到变量中。`if` 语句检查原始字段是否包含连字符（`-`）。如果存在，则将数值变量变为负数，然后计算该行中值之和。\n\
  \n## AWK 中的数值函数\n\n`int(x)` 函数返回数字的整数部分。如果该数字不是整数，它将处于两个整数之间。在两个可能的整数中，函数将返回靠近 0\
  \ 的那。这与舍入函数不同，舍入函数会选择更接近的整数。\n\n例如，`int(3)` 是 `3`，`int(3.9)` 是 `3`，`int(-3.9)` 是\
  \ `-3`，`int(-3)` 也是 `-3`。`awk` 命令中 `int(x)` 函数的一个示例如下：\n\n```awk\n awk 'BEGIN {\n\
  \   print int(3.534);\n   print int(4);\n   print int(-5.223);\n   print int(-5);\n\
  }'\n```\n\n输出如下：\n\n```\n 3\n4\n-5\n-5\n```\n\n`exp(x)` 函数给出 `x` 的指数，或者如果 `x` 超出范围则报告错误。`x`\
  \ 可能的取值范围取决于你机器的浮点表示。\n\n```awk\n awk 'BEGIN{\n   print exp(123434346);\n   print\
  \ exp(0);\n   print exp(-12);\n}'\n```\n\n输出如下：\n\n```\n inf\n1\n6.14421e-06\n```\n\
  \n`log(x)` 函数在 `x` 为正数时给出 `x` 的自然对数；否则报告错误（输出中的 `inf` 表示无穷大，`nan` 表示“非数字”）。\n\n\
  ```awk\n awk 'BEGIN{\n  print log(12);\n  print log(0);\n  print log(1);\n  print\
  \ log(-1);\n}'\n```\n\n输出如下：\n\n```\n 2.48491\n-inf\n0\nnan\n```\n\n`sin(x)` 函数给出\
  \ `x` 的正弦，`cos(x)` 给出 `x` 的余弦，其中 `x` 为弧度：\n\n```awk\n awk 'BEGIN {\n   print cos(90);\n\
  \   print cos(45);\n}'\n```\n\n输出如下：\n\n```\n -0.448074\n0.525322\n```\n\n`rand()`\
  \ 函数给你一个随机数。`rand()` 的值在 `0` 和 `1` 之间均匀分布：该值永远不会是 `0` 也永远不会是 `1`。\n\n通常，你想要随机整数。这里有一个自定义函数，可以获取小于\
  \ `n` 的随机非负整数：\n\n```awk\n function randint(n) {\n     return int(n * rand())\n\
  }\n```\n\n乘积生成一个大于 `0` 且 `n` 的随机实数。然后我们将其转换为 `0` 到 `n - 1` 之间的整数（使用 `int`）。\n\n\
  这是一个使用类似函数产生 `1` 到 `n` 之间随机整数的示例：\n\n```awk\n awk '\n# 模拟掷骰子的函数。\nfunction roll(n)\
  \ { return 1 + int(rand() * n) }\n# 掷 3 个六面骰子并打印总点数。\n{\n      printf(\"%d points\\\
  n\", roll(6)+roll(6)+roll(6))\n}'\n```\n\n注意 `rand()` 每次调用 `awk` 时都会从同一个点（或“种子”）开始生成数字。因此，程序每次启动时都会产生相同的结果。如果你希望程序在每次使用时执行不同的操作，你必须将种子更改为每次运行都不同的值。\n\
  \n使用 `srand(x)` 函数将生成随机数的起始点（或种子）设置为值 `x`。每个种子值都会导致一个特定的“随机”数序列。因此，如果你第二次将种子设置为相同的值，你将再次获得相同的“随机”数序列。如果你省略了参数\
  \ `x`（如 `srand()`），则使用当前的日期和时间作为种子。这就是获取真正不可预测的随机数的方法。`srand()` 的返回值是上一个种子。这使得跟踪种子以便一致地重现随机数序列变得容易。\n\
  \n`time()` 函数（并非所有 `awk` 版本都包含）返回自 1970 年 1 月 1 日以来的当前秒数`ctime()` 函数（并非所有 `awk`\
  \ 版本都包含）返回当前日期。`sqrt(x)` 函数给出 `x` 的平方根。如果 `x` 为负数，它会报告错误。\n\n## 单行 AWK 命令\n\n代码假设我们知道文件的格式。`split()`\
