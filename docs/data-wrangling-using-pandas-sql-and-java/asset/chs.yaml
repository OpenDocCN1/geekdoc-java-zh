  \ 1: 闰年\n  if((year % 4) == 0) {\n    if((year % 100) == 0) {\n      if((year %\
  \ 400) == 0) {\n        return 1 # 闰年\n      } else {\n        return 0 # 平年\n \
  \     }\n    } else {\n      return 1 # 闰年\n    }\n  } else {\n    return 0 # 平年\n\
  \  }\n}\n\nBEGIN {\n  count = 1\n  for(i=0;i<12;i++) {\n    months[i] = 31\n  }\n\
