  \ = shirts['ssize'].replace(regex='xlarge', value=4)\nshirts['ssize'] = shirts['ssize'].replace(regex='large',\
  \  value=3)\nshirts['ssize'] = shirts['ssize'].replace(regex='medium', value=2)\n\
  shirts['ssize'] = shirts['ssize'].replace(regex='small',  value=1)\n\nprint(\"shirts\
  \ after:\")\nprint(shirts)\n```\n\nListing 3.9 以一个包含六条语句的代码块开始，使用与字符串的直接比较来进行数值替换。例如，以下代码片段将字符串\
  \ `xxlarge` 的所有出现处替换为值 4：\n\n```\n shirts.loc[shirts['ssize']=='xxlarge','size']\
  \ = 4\n```\n\n第二个代码块由六条语句组成，使用 `replace()` 方法执行相同的更新，其示例所示：\n\n```\n shirts['ssize'].replace('xxlarge',\
  \ 4, inplace=True)\n```\n\n第三个代码块由单个语句组成，使用 `apply()` 方法执行相同的更新，所示：\n\n```\n shirts['ssize']\
  \ = shirts['ssize'].apply({'xxlarge':4, 'xlarge':4, 'large':3, 'medium':2, 'small':1,\
  \ 'xsmall':1}.get)\n```\n\n第四个代码块由四条语句组成，使用正则表达式执行相同的更新，其示例所示：\n\n```\n shirts['ssize']\
  \ = shirts['ssize'].replace(regex='xlarge', value=4)\n```\n\n\n\n\n\n由于之前的代码段同时匹配\
  \ xxlarge 和 xlarge，因此我们只需要四条语句而不是六条语句。如果您不熟悉正则表达式，可以阅读有关此主题的在线教程。运行代码列表 3.9 中的代码，您将看到以下输出：\n\
  \n```\n shirts before\n     type     size\n0   shirt  xxlarge\n1   shirt  xxlarge\n\
