- "# Pandas, SQL 和 Java 数据清洗使用指南\n\n\n\n![](img/9781683929048.jpg)\n\n\n\nO. Campesato.\
  \ *Data Wrangling Using Pandas, SQL, and Java*.\n\n\n出版者承认并尊重公司、制造商和开发者为区分其产品而使用的所有标记。本书中提到的所有品牌名称和产品名称均为其各自公司的商标或服务标记。对服务标记或商标等的任何遗漏（任何形式）或误用均不视为侵犯他人财产的尝试。\n\
  \n美国国会图书馆控制号：2022945211\n222324321 印刷于无酸纸\n\n出版者承认并尊重公司、制造商和开发者为区分其产品而使用的所有标记。本书中提到的所有品牌名称和产品名称均为其各自公司的商标或服务标记。对服务标记或商标等的任何遗漏（任何形式）或误用均不视为侵犯他人财产的尝试。\n\
  \n# 前言\n\n## 本书的价值主张是什么？\n\n本书介绍了 `Pandas` 的多种功能、如何在 `MySQL` 中创建数据库和表，以及处理许多数据任务。某些主题简要介绍有两个原因：首先，重要的是让你接触这些概念。在某些情况下，这些主题可能会激发你的兴趣，从而激励你自主学习；在其他情况下，你可能对简要介绍感到满意。其次，对书中涵盖的所有主题进行详尽处理将显著增加其体积，很少有人有时间阅读大部头。\n\
  \n\n\n\n大多数代码示例都非常短（通常小于一页，有时甚至不到半页），如果需要，你可以轻松快速地将代码复制/粘贴到新的 Jupyter notebook 中。对于引用\
  \ CSV 文件的 Python 代码示例，你需要在相应的 Jupyter notebook 中添加额外的代码段来访问该 CSV 文件。此外，这些代码示例的运行速度很快，因此你不需要使用\
  \ Google Colaboratory 提供的免费 GPU。\n\n如果你确实决定使用 Google Colaboratory，可以轻松地将 Python\
  \ 代码复制/粘贴到 notebook 中，并使用上传功能上传现有的 Jupyter notebook。记住以下一点：如果 Python 代码引用了 CSV 文件，请确保在\
  \ Google Colaboratory 相应的 Jupyter notebook 中包含适当的代码段（如第 1 章中所解释的那样）来访问该 CSV 文件。\n\
  \n### 我需要学习此书中的理论部分吗？\n\n再次强调，答案取决于你计划参与数据分析的程度。例如，如果你计划学习机器学习，那么你可能会学习如何创建和训练模型，这是一项在数据清洗任务之后执行的工作。总的来说，如果你计划成为一名机器学习工程师，你可能需要学习本书书中遇到的所有内容。\n\
  \n### 如何充分利用这本书\n\n有些程序员擅长从文字中学习，而有些人则擅长从示例代码（以及大量的代码）中学习，这意味着没有一种适用于所有风格。\n\n此外，有些程序员想先运行代码，看看它是做什么的，然后回到代码深入细节（而另一些人则采用相反的方法）。\n\
  \n因此，书中有多种类型的代码示例：有的很短，有的很长，还有一些代码示例是从之前的代码示例“构建”而来的。\n\n### 读这本书我需要具备什么知识？\n\n\
  目前对 `Python 3.x` 的了解是有帮助的技能。对其他编程语言（如 `Java`）的知识也很有帮助，因为可以接触编程概念和结构。你掌握的技术性知识越少，理解书中涵盖的各种主题就越需要勤奋。\n\
  \n如果你想确定自己是否能掌握书中的内容，可以浏览一些代码示例，了解哪些内容对你是熟悉的，哪些是新颖的。\n\n### 本书包含生产级代码示例吗？\n\n书中代码示例的主要目的是向你展示基于\
  \ `Python` 的库，用于解决各种数据相关任务，同时获得对统计概念的初步理解。清晰度比编写更紧凑但更难理解（且可能更容易产生错误）的代码具有更高的优先级。如果你决定在生产网站中使用书中的任何代码，你应该对该代码进行与你代码库其他部分同样严格的分析。\n\
  \n### 读这本书的非技术先决条件是什么？\n\n虽然这个问题的答案很难量化，但对学习数据清洗和处理的强烈渴望，以及阅读和理解代码示例的动力和自律，是非常重要的。\n\
  \n### 我如何设置命令行？\n\n如果你是 Mac 用户，有三种方法可以实现。第一种方法是使用 `Finder` 导航到 `Applications > Utilities`，然后双击\
  \ `Utilities` 应用程序。接下来，如果你已经有一个可用的命令行，可以通过输入以下命令启动一个新的命令行：\n\n```\nopen /Applications/Utilities/Terminal.app\n\
  ```\n\nMac 用户的第二种方法是在已经可见的命令行中通过通过点击该命令行中的 `command+n`，在 MacBook 上打开一个新的命令行，你的 Mac\
  \ 就会启动另一个命令行。\n\n如果你是 PC 用户，可以安装 `Cygwin`（开源：`[`cygwin.com/`](https://cygwin.com/)`），它可以模拟\
  \ `bash` 命令，或者使用其他工具包如 `MKS`（一种商业产品）。请阅读描述下载和安装过程的在线文档。注意，如果自定义别名定义在主启动文件（如 `.bash_login`）之外的文件中，则不会自动设置。\n\
  \n### 伴随文件\n\n书中所有的代码示例和图形可以通过向 info@merclearning.com 发邮件给出版社来获取。\n\n### 完成这本书后的“下一步”是什么？\n\
  \n这个问题的答案差异很大，主要因为答案很大程度上取决于你的目标。如果你主要对 `NLP` 感，你可以学习更高级的概念，例如 `attention`（注意力）、`transformers`\
  \ 和与 `BERT` 相关模型。\n\n如果你主要对机器学习感兴趣，机器学习有一些子领域，如深度学习和强化学习（以及深度强化学习），可能会吸引你。幸运的是，有许多资源可用，你可以对这些资源进行互联网搜索。另一点是：你所学习的机器学习方面取决于你是谁。机器学习工程师、数据科学家、经理、学生或软件开发人员的需求都是不同的。\n\
  \n# 第 1 章\n\n## Python 简介\n\n本章包含了对 `Python` 的介绍，提供了关于用于安装 `Python` 模块的实用工具的信息、基础\
  \ `Python` 结构，以及如何在 `Python` 中处理某些数据类型的方法。\n\n本章的第一部分涵盖如何安装 `Python`、一些 `Python`\
  \ 环境变量以及如何使用 `Python` 解释器。你将看到 `Python` 代码示例以及如何将 `Python` 代码保存到可以从命令行启动的文本文件中。本章的第二部分介绍了如何处理简单数据类型，如数字、分数和字符串。本章的最后部分讨论了异常以及如何在\
  \ `Python` 脚本中使用它们。\n\n注意 书中的 Python 脚本适用于 3。\n\n### Python 工具\n\n`Anaconda` 发行版适用于\
  \ Windows、Linux 和 Mac：\n\n[`continuum.io/downloads`](http://continuum.io/downloads)\n\
  \n`Anaconda` 非常适用于 `NumPy`（在第 3 章中讨论）和 `SciPy`（书中未讨论）。如果你是 Windows 用户，`Anaconda`\
  \ 似乎是一个更好的替代方案。\n\n#### easy_install 和 pip\n\n在安装 Python 模块时，`easy_install` 和 `pip`\
  \ 都非常好。每当你需要安装 `Python` 模块（书中有很多）时，使用 `easy_install` 或 `pip`，语法如下：\n\n```\neasy_install\
  \ <module-name>\npip install <module-name>\n```\n\n注意 基于 Python 的模块较于安装，而用 `C` 编写的模块通常更快，但在安装方面更困难。\n\
  \n#### virtualenv\n\n`virtualenv` 工具允许你创建隔离的 Python 环境，其主页如下：\n\n[`www.virtualenv.org/en/latest/virtualenv.html`](http://www.virtualenv.org/en/latest/virtualenv.html)\n\
  \n`virtualenv` 解决了为不同的应用程序保留正确的依赖和版本（间接权限）的问题。如果你是 Python 初学者，现在可能不需要 `virtualenv`，但请记住这个工具。\n\
  \n#### IPython\n\n另一个实用工具是 `IPython`（获得过 Jolt 奖），其主页如下：\n\n[`ipython.org/install.html`](http://ipython.org/install.html)\n\
  \n在命令行中输入 `ipython` 来调用 `IPython`：\n\n```\nipython\n```\n\n上述命令显示如下输出：\n\n\n\n\n\
  \n```python\n Python 3.8.6 (default, Oct  8 2020, 14:06:32)\n输入 'copyright', 'credits'\
  \ 或 'license' 获取更多信息\nIPython 7.18.1 -- 一个增强交互式 Python。输入 '?' 获取帮助。\n\nIn [1]:\n\
  ```\n\n在提示符处输入问号（`?`），你将看到一些有用信息，其中部分如下：\n\n```python\n IPython -- 一个增强交互式 Python\n\
  =========================================\n\nIPython 提供了标准 Python 解释器的完全兼容替代方案，具有方便的\
  \ shell 功能、特殊命令、命令历史机制和输出结果缓存。\n在你的系统命令行中，输入 `ipython -h` 可查看可用命令行选项。本文档仅描述交互式功能。\n\
  \n获取帮助\n------------\n\n在 IPython 中，你有多种方式可以访问帮助：\n\n  ?         -> IPython 功能的介绍和概述（此屏幕）。\n\
  \  object?   -> 关于 'object' 的详细信息。\n  object??  -> 关于 'object' 更详细、冗长的信息。\n  %quickref\
  \ -> 所有 IPython 特有语法和魔法命令的快速参考。\n  help      -> 访问 Python 自身的帮助系统。\n\n如果你在终端 IPython\
  \ 中，可以按 'q' 退出此屏幕。\n```\n\n最后，在命令提示符处输入 `quit` 即可退出 `ipython` shell。\n\n下一节将向你展示如何检查机器是否安装了\
  \ Python 以及你可以在哪里下载 Python。\n\n## Python 安装\n\n在下载任何内容之前，请在命令行 shell 中输入以下命令检查机器上是否已安装\
  \ Python（如果你有 Macbook 或 Linux 机器，很可能已经安装）：\n\n```bash\n python -V\n```\n\n书中所使用的\
  \ Macbook 的输出如下：\n\n```python\n Python 3.8.6\n```\n\n**注意** 在你的机器上安装 Python `3.8.6`（或尽可能接近此版本），以便你拥有与测试书中\
  \ Python 脚本时相同的 Python 版本。\n\n如果你需要在机器上安装 Python，请访问 Python 主页并选择“Downloads（下载）”链接，或直接访问此网站：\n\
  \n*[`www.python.org/download/`](http://www.python.org/download/)*\n\n此外，Windows\
  \ 适用于 PythonWin，其主页如下：\n\n*[`www.cgl.ucsf.edu/Outreach/pc204/pythonwin.html`](http://www.cgl.ucsf.edu/Outreach/pc204/pythonwin.html)*\n\
  \n使用任何可以创建、编辑和保存 Python 脚本的文本编辑器，并将其保存为纯文本文件（不要使用 Microsoft Word）。\n\n在机器上安装并配置\
  \ Python 后，你就可以开始处理书中的 Python 脚本了。\n\n## 设置环境变量 PATH（仅限 Windows）\n\n`PATH` 环境变量指定了一个目录列表，当你从命令行指定可执行程序时，系统会搜索这些目录。设置环境以便\
  \ Python 可执行文件在每个命令行 shell 中始终可用的良好指南是遵循此处的说明：\n\n*[`www.blog.pythonlibrary.org/2011/11/24/python-101-setting-up-python-on-windows/`](http://www.blog.pythonlibrary.org/2011/11/24/python-101-setting-up-python-on-windows/)*\n\
  \n## 在你的机器上启动 Python\n\n有三种不同的启动 Python 的方法：\n\n*   使用 Python 交互式解释器。\n*   从命令行启动\
  \ Python 脚本。\n*   使用 IDE。\n\n下一节将向你展示如何从命令行启动 Python 解释器。在本章后面的部分，你将学习如何从命令行启动 Python\
  \ 脚本以及关于 Python IDE 的知识。\n\n*本书重点是从命令行启动 Python 脚本或在 Python 解释器中输入代码。*\n\n### Python\
  \ 交互式解释器\n\n通过打开命令行 shell 并输入以下命令启动 Python 交互式解释器：\n\n```bash\n python\n```\n\n\
  你将看到以下提示符（或类似的内容）：\n\n```python\n Python 3.8.6 (default, Oct  8 2020, 14:06:32)\n\
  [Clang 12.0.0 (clang-1200.0.32.2)] on darwin\n输入 \"help\", \"copyright\", \"credits\"\
  \ 或 \"license\" 获取更多信息。\n>>>\n```\n\n现在在提示符处输入表达式 `2 + 7`：\n\n```python\n >>> 2\
  \ + 7\n```\n\nPython 显示以下结果：\n\n```python\n 9\n>>>\n```\n\n按 `ctrl-d` 退出 Python\
  \ shell。\n\n你可以通过在任何 Python 脚本前加上 `python` 单词从命令行启动它。例如，如果你有一个包含 Python 命令的 Python\
  \ 脚本 `myscript.py`，如下如下启动脚本：\n\n```bash\n python myscript.py\n```\n\n作为一个简单的示例，假设\
  \ Python 脚本 `myscript.py` 包含以下 Python 代码：\n\n```python\n print('Hello World from\
  \ Python')\nprint('2 + 7 = ', 2+7)\n```\n\n当你启动上述 Python 脚本时，将看到以下输出：\n\n```python\n\
  \ Hello World from Python\n2 + 7 =  9\n```\n\n## Python 标识符\n\nPython 标识符是变量、函数、类、模块或其他\
  \ Python 对象的名称，有效的标识符遵循以下规则：\n\n*   以字母 A-Z 或 a-z 开始\n*   可以是下划线\n*   可以包含数字 0-9\n\
  *   不能以数字开头\n*   不能是 Python 关键字\n\nPython 是区分大小写的，因此 `Abc` 和 `abc` 是不同的标识符。\n\n\
  ## 行、缩进和多行\n\n与其他语言（如 Java）不同，Python 使用缩进而不是大括号。缩进必须保持一致，如下：\n\n```python\n if True:\n\
  \    print(\"ABC\")\nelse:\n    print(\"DEF\")\n```\n\nPython 中的多行语句可以使用反斜线（`\\\
  `）终止，如下：\n\n```python\n total = x1 + \\\n        x2 + \\\n        x3\n```\n\n你可以通过使用分号（`;`）分隔每个语句在一行指定多个语句，如下：\n\
  \n```python\n a=10; b=5; print(a); print(a+b)\n```\n\n上述代码的输出为：\n\n```\n10\n15\n\
  ```\n\n**注意** Python 不建议使用分号和延续符。\n\n## 引号和注释\n\nPython 允许使用单引号（`'`）、双引号（`\"`）、三引号（`'''`\
  \ 或 `\"\"\"`）字符串字面量，只要它们在开头和结尾匹配。你可以使用三引号处理跨行的字符串。以下示例是合法的 Python 字符串：\n\n```python\n\
  \ word = 'word'\nline = \"This is a sentence.\"\npara = \"\"\"This is a paragraph.\
  \ This paragraph contains\nmore than one sentence.\"\"\"\n```\n\n以字母 `r`（代表“raw”，原始）开头的字符串字面量将所有内容视为字符并“转义”元字符的意思，如下：\n\
  \n```python\n a1 = r'\\n'\na2 = r'\\r'\na3 = r'\\t'\nprint('a1:',a1,'a2:',a2,'a3:',a3)\n\
  ```\n\n上述代码块的输出如下：\n\n```\n a1: \\n a2: \\r a3: \\t\n```\n\n你可以在双引号中嵌入单引号（反之亦然），以显示单引号或双引号。实现相同结果另一种方法是在单引号或双引号前加上反斜线（`\\\
  `）字符。以下代码块说明了这些技术：\n\n```python\n b1 = \"'\"\nb2 = '\"'\nb3 = '\\''\nb4 = \"\\\"\
  \"\nprint('b1:',b1,'b2:',b2)\nprint('b3:',b3,'b4:',b4)\n```\n\n上述代码块的输出如下：\n\n```\n\
  \ b1: ' b2: \"\nb3: ' b4: \"\n```\n\n\n\n\n不在字符串字面量中的哈希符号（`#`）是注释注释的字符。此外，`#` 之后到物理行尾的所有字符都是注释的一部分（并被\
  \ Python 解释器忽略）。考虑以下代码块：\n\n```\n #!/usr/bin/python\n# First comment\nprint(\"Hello,\
  \ Python!\")  # second comment\n```\n\n这将产生以下结果：\n\n```\n Hello, Python!\n```\n\n\
  注释可以位于语句或表达式后的同一行：\n\n```\n name = \"Tom Jones\" # This is also comment（这也是注释）\n\
  ```\n\n你可以像下面一样注释多行：\n\n```\n # This is comment one\n# This is comment two\n# This\
  \ is comment three\n```\n\nPython 中的空行是指仅包含空白字符、注释或二者兼备的行。\n\n## 将你的代码保存到模块中\n\n\
  早些时候你已经了如何从命令行启动 Python 解释器并输入 Python 命令。然而，你在 Python 解释器中输入的所有内容仅对当前会话有效：如果你退出解释器并重新启动，你之前的定义将不再有效。幸运的是，Python\
  \ 允许你将代码存储在文本文件中，这将在下一节中讨论。\n\nPython 中的 `module`（模块）是一个包含 Python 语句的文本文件。在上一节中，你看到了\
  \ Python 解释器如何允许你测试定义在当前会话有效的代码片段。如果你想保留代码片段和其他定义，请将它们放在文本文件中，以便你可以在 Python 解释器之外执行这些代码。\n\
  \nPython 中的最外层语句在模块被首次导入时会从上到下执行，这将设置好它的变量和函数。\n\nPython 模块可以直接从命令行运行，如下所示：\n\n\
  ```\n python first.py\n```\n\n作为示例，将以下两个语句放在名为 `first.py` 的文本文件中：\n\n```\n x = 3\n\
  print(x)\n```\n\n输入以下命令：\n\n```\n Python first.py\n```\n\n前一个命令的输出是 3，这与在 Python\
  \ 解释器中执行前面的代码是一相同的。\n\n当直接运行 Python 模块时，特殊变量 `__name__` 被设置为 `__main__`。你经常会在 Python\
  \ 模块中看到以下类型的代码：\n\n```\n if __name__ == '__main__':\n    # do something here（在这里做一些事情）\n\
  \    print('Running directly')\n```\n\n前面的代码片段允许 Python 确定模块是从命令行启动的还是被导入到另一个 Python\
  \ 模块中的。\n\n## 一些标准模块\n\nPython 标准库提供了许多可以简化你的 Python 脚本的模块。标准库模块列表可以在网上找到：\n\n*[`www.python.org/doc/`](http://www.python.org/doc/)\n\
  \n一些重要的 Python 模块包括 `cgi`、`math`、`os`、`pickle`、`random`、`re`、`socket`、`sys`、`time`\
  \ 和 `urllib`。\n\n书中的代码示例使用了 `math`、os、random、re、socket、sys、time 和 `urllib` 模块。你需要这些模块才能在代码中使用它们。例如，下面的代码块展示了如何导入四个标准\
  \ Python 模块：\n\n```\n import datetime\nimport re\nimport sys\nimport time\n```\n\
  \n书中的代码示例导入了上述一个或多个模块，以及其他 Python 模块。\n\n## help() 和 dir() 函数\n\n在网上搜索 Python 相关主题通常会返回许多带有有用信息的链接。或者，你可以检查官方\
  \ Python 文档网站：*[docs.python.org](http://docs.python.org)*。\n\n此外，Python 提供了 `help()`\
  \ 和 `dir()` 函数，可以从 Python 解释器访问。`help()` 函数显示文档字符串（docstrings），而 `dir()` 函数显示定义的符号。例如，如果你输入\
  \ `help(sys)`，将看到 `sys` 模块的文档，而 `dir(sys)` 则显示定义符号的列表。\n\n在 Python 解释器中输入以下命令来显示\
  \ Python 中与字符串的方法：\n\n```\n >>> dir(str)\n```\n\n前面的命令生成了以下输出：\n\n```\n ['__add__',\
  \ '__class__', '__contains__', '__delattr__', '__doc__',\n'__eq__', '__format__',\
  \ '__ge__', '__getattribute__', '__getitem__',\n'__getnewargs__', '__getslice__',\
  \ '__gt__', '__hash__', '__init__',\n'__le__', '__len__', '__lt__', '__mod__', '__mul__',\
  \ '__ne__', '__new__',\n'__reduce__', '__reduce_ex__', '__repr__', '__rmod__', '__rmul__',\
  \ '__\nsetattr__', '__sizeof__', '__str__', '__subclasshook__', '_formatter_\nfield_name_split',\
  \ '_formatter_parser', 'capitalize', 'center', 'count',\n'decode', 'encode', 'endswith',\
  \ 'expandtabs', 'find', 'format', 'index',\n'isalnum', 'isalpha', 'isdigit', 'islower',\
  \ 'isspace', 'istitle',\n'isupper', 'join', 'ljust', 'lower', 'lstrip', 'partition',\
  \ 'replace',\n'rfind', 'rindex', 'rjust', 'rpartition', 'rsplit', 'rstrip', 'split',\n\
  'splitlines', 'startswith', 'strip', 'swapcase', 'title', 'translate',\n'upper',\
  \ 'zfill']\n```\n\n前面的列表为你提供了内置函数的汇总“转储”（包括一些在本文中讨论的函数）。虽然 `dir()` 没有列出内置函数和变量，但你可以从自动导入名为\
  \ `__builtin__` 的 `__builtins__` 模块获取这些信息：\n\n```\n >>> dir(__builtins__)\n```\n\
  \n下面的命令显示如何获取关于函数的更多信息：\n\n```\n help(str.lower)\n```\n\n输出如下：\n\n```\n Help on\
  \ method_descriptor:\n\nlower(...) -> string\n\n    Return a copy of the string\
  \ converted to lowercase.\n(END)\n```\n\n当你需要关于特定函数的更多信息时，检查在线文档并尝试 `help()` 和 `dir()`。\n\
  \n## 编译时间和运行时代码检查\n\nPython 执行某些编译检查，但大多数检查被推迟到代码执行。因此，如果你的 Python 代码引用了不存在的函数，代码将成功编译。事实上，只有当代码执行路径引用不存在的函数时，代码才会报错。\n\
  \n作为一个简单的示例，考虑以下引用不存在函数 `DoesNotExist` 的 Python 函数 `myFunc`：\n\n```\n def myFunc(x):\n\
  \    if x == 3:\n        print(DoesNotExist(x))\n    else:\n        print('x: ',x)\n\
  ```\n\n前面的代码只有在传入值 3 时才会失败。\n\n现在你已经理解了一些基本概念（例如如何使用 Python 解释器）以及如何启动自定义 Python\
  \ 模块，下一节将讨论原始数据类型。\n\n## 简单数据类型\n\nPython 支持原始数据类型，如数字（整数、浮点数和指数数）、字符串和日期。Python\
  \ 还支持更复杂的数据类型，如列表（或数组）、元组和字典。接几节将讨论一些 Python 原始数据类型，并带有如何在这些数据类型上执行各种操作的代码片段。\n\n\
  ## 数字数字\n\nPython 提供了算术运算来处理数字，这种方式与其他编程语言相似。以下示例涉及整数的算术运算：\n\n```\n >>> 2+2\n4\n\
  \ >>> 4/3\n1\n >>> 3*8\n24\n```\n\n下面的示例将数字赋值给两个变量并计算它们的积：\n\n```\n >>> x = 4\n\
  >>> y = 7\n >>> x * y\n28\n```\n\n\n\n\n以下示例演示了涉及整数的算术运算：\n\n```\n >>> 2+2\n4\n\
  >>> 4/3\n1\n>>> 3*8\n24\n```\n\n注意，两个整数之间的除法 (`/`) 实际上是截断法，只保留整数结果。下面的示例将一个浮点数转换为指数计数法：\n\
  \n```\n >>> fnum = 0.00012345689000007\n>>> \"%.14e\"%fnum\n'1.23456890000070e-04'\n\
  ```\n\n你可以使用 `int()` 函数和 `float()` 函数将字符串转换为数字：\n\n```\n word1 = \"123\"\nword2\
  \ = \"456.78\"\nvar1 = int(word1)\nvar2 = float(word2)\nprint(\"var1: \",var1,\"\
  \ var2: \",var2)\n```\n\n上一个代码块的输出结果如下：\n\n```\n var1:  123  var2:  456.78\n```\n\
  \n或者，你可以使用 `eval()` 函数：\n\n```\n word1 = \"123\"\nword2 = \"456.78\"\nvar1 = eval(word1)\n\
  var2 = eval(word2)\nprint(\"var1: \",var1,\" var2: \",var2)\n```\n\n如果你尝试转换一个不是有效整数或浮点数的字符串，Python\
  \ 会抛出异常，因此建议将代码放置在 `try/except` 块中（本章稍后会进行讨论）。\n\n## 使用其他进制\n\nPython 中的数字是 10 进制（默认），但你可以轻松地将数字转换为其他进制。例如，下面的代码块初始化变量\
  \ `x` 的值为 1234，然后分别以 2 进制、8 进制和 16 进制显示该数字：\n\n```\n >>> x = 1234\n>>> bin(x) '0b10011010010'\n\
  >>> oct(x) '0o2322'\n>>> hex(x) '0x4d2'\n```\n\n如果你想抑制 `0b`、`0o` 或 `0x` 前缀，请使用 `format()`\
  \ 函数，如下所示：\n\n```\n >>> format(x, 'b') '10011010010'\n>>> format(x, 'o') '2322'\n\
  >>> format(x, 'x') '4d2'\n```\n\n负整数将用负号显示：\n\n```\n >>> x = -1234\n>>> format(x,\
  \ 'b') '-10011010010'\n>>> format(x, 'x') '-4d2'\n```\n\n## chr() 函数\n\nPython 的\
  \ `chr()` 函数接收一个正整数作为参数，并将其转换为对应的字母值（如果存在）。字母 A 到 Z 的十表示为 65 到 91（对应十六进制的 41 到 5b），小写字母\
  \ a 到 z 的十表示为 97 到 122（十六进制的 61 到 7b）。这是一个使用 `chr()` 函数打印大写字母 A 的示例：\n\n```\n >>>\
  \ x=chr(65)\n>>> x\n'A'\n```\n\n下面的代码块打印了一范围内整数的 ASCII 值：\n\n```\n result = \"\"\
  \nfor x in range(65,90):\n  print(x, chr(x))\n  result = result+chr(x)+' '\nprint(\"\
  result: \",result)\n```\n\n你可以用以下行表示一个字符范围：\n\n```\n for x in range(65,90):\n```\n\
  \n然而，下面的等效代码段更加直观：\n\n```\n for x in range(ord('A'), ord('Z')):\n```\n\n如果你想显示小写字母的结果，请将之前的范围从\
  \ (65,91) 更改为以下语句之一：\n\n```\n for x in range(65,90):\nfor x in range(ord('a'), ord('z')):\n\
  ```\n\n## Python 中的 round() 函数\n\nPython 的 `round()` 函数允许你将小数值舍入到最近的精度：\n\n```\n\
  \ >>> round(1.23, 1)\n1.2\n>>> round(-3.42,1)\n-3.4\n```\n\n## Python 中的数字格式化\n\n\
  Python 允许你在打印小数时指定使用的精度位数，如下所示：\n\n```\n >>> x = 1.23456\n>>> format(x, '0.2f')\n\
  '1.23'\n>>> format(x, '0.3f')\n'1.235'\n>>> 'value is {:0.3f}'.format(x) 'value\
  \ is 1.235'\n>>> from decimal import Decimal\n>>> a = Decimal('4.2')\n>>> b = Decimal('2.1')\n\
  >>> a + b\nDecimal('6.3')\n>>> print(a + b)\n6.3\n>>> (a + b) == Decimal('6.3')\n\
  True\n>>> x = 1234.56789\n>>> # 两位精度\n>>> format(x, '0.2f')\n'1234.57'\n>>> # 在\
  \ 10 个字符内右对齐，一位精度\n>>> format(x, '>10.1f')\n' 1234.6'\n>>> # 左对齐\n>>> format(x,\
  \ '<10.1f') '1234.6 '\n>>> # 中对对齐\n>>> format(x, '¹⁰.1f') ' 1234.6 '\n>>> # 包含分位符\n\
  >>> format(x, ',')\n'1,234.56789'\n>>> format(x, '0,.1f')\n'1,234.6'\n```\n\n##\
  \ 处理分数\n\nPython 支持 `Fraction()` 函数（定义在 `fractions` 模块中），它接受两个整数分别代表分数的分子和分母（分母不能为零）。这里展示了在\
  \ Python 中定义和操作分数的几个示例：\n\n```\n >>> fractions import Fraction\n>>> a = Fraction(5,\
  \ 4)\n>>> b = Fraction(7, 16)\n>>> print(a + b)\n27/16\n>>> print(a * b) 35/64\n\
  ```\n\n\n\n\n然而，正如你可能预期的那样，当你尝试“减去”两个字符串时，会导致一个错误：\n\n```\n >>> 'a' - 'b'\nTraceback\
  \ (most recent call last):\n  File \"<stdin>\", line 1, in <module>\nTypeError:\
  \ unsupported operand type(s) for -: 'str' and 'str'\n```\n\nPython 中的 `try/except`\
  \ 结构（在本章稍后的部分将讨论）能够让你更优雅地处理上述类型的异常。\n\n## 比较字符串\n\n你可以使用 `lower()` 和 `upper()` 方法分别将字符串转换为小写和大大写，如下所示：\n\
  \n```\n >>> 'Python'.lower()\n'python'\n>>> 'Python'.upper()\n'PYTHON'\n>>>\n```\n\
  \n`lower()` 和 `upper()` 方法对于对两个 ASCII 字符串进行不区分大小写的比较非常用用。列表 1.2 显示了 `Compare.py`\
  \ 的内容，它使用 `lower()` 函数来比较两个 ASCII 字符串。\n\n### 列表 1.2: Compare.py\n\n```\n x = 'Abc'\n\
  y = 'abc'\n\nif(x == y):\n  print('x and y: identical')\nelif (x.lower() == y.lower()):\n\
  \  print('x and y: case insensitive match')\nelse:\n  print('x and y: different')\n\
  ```\n\n由于 `x` 包含混合大小写字母而 `y` 包含小写字母，列表 1.2](#ch01.xhtml_list1-2) 显示了如下输出：\n\n```\n\
  \ x and y: different\n```\n\n## 在 Python 中格式化字符串\n\nPython 提供了 `string.ljust()`、`string.rjust()`\
  \ 和 `string.center()` 函数来对文本字符串进行定位，使其分别左对齐、右对齐和居中。正如你在上一节中看到的，Python 还提供了 `format()`\
  \ 方法用于高级插值功能。现在在 Python 解释器中输入以下命令：\n\n```\n import string\n\nstr1 = 'this is a\
  \ string'\nprint(string.ljust(str1, 10))\nprint(string.rjust(str1, 40))\nprint(string.center(str1,40))\n\
  ```\n\n输出所示：\n\n```\n this is a string\n            this is a string\n         \
  \   this is a string\n```\n\n## 未初始化的变量和值 None\n\nPython 区分未初始化的变量和 `None` 值。前者是一个未被赋值的变量，而\
  \ `None` 值是一个表示“无值”的值。集合和方法经常返回 `None` 值，你可以在条件逻辑中测试 `None` 值。\n\n本章的下一部分将向你展示如何使用\
  \ Python 内置函数对文本字符串进行“切片和切分”。\n\n## 字符串的切片与拼接\n\nPython 允许你使用数组符号提取字符串的子字符串（称为“切片”）。切片语法为\
  \ `start:stop:step`，其中 `start`、`stop` 和 `step` 值是指定起始值、结束值和增量值的整数。Python 切片的一个有趣之处在于你可以使用值\
  \ `-1`，它会从字符串的右侧而不是左侧操作。以下是字符串切片的示例：\n\n```\n text1 = \"this is a string\"\nprint('First\
  \ 7 characters:',text1[0:7])\nprint('Characters 2-4:',text1[2:4])\nprint('Right-most\
  \ character:',text1[-1])\nprint('Right-most 2 characters:',text1[-3:-1])\n```\n\n\
  上一个代码块的输出如下：\n\n```\n First 7 characters: this is\nCharacters 2-4: is\nRight-most\
  \ character: g\nRight-most 2 characters: in\n```\n\n在本章稍后部分，你将看到如何向另一个字符串中间插入一个字符串。\n\
  \n## 测试数字和字母\n\nPython 允许你检查字符串中的每个字符，然后测试该字符是数字还是字母。本节将对正则表达式进行简单介绍。\n\n列表 1.3\
  \ 显示了 `CharTypes.py` 的内容，说明了如何判断字符串是否包含数字或字符。虽然我们还没有讨论 Python 中的 `if` 语句，但列表 1.3](#ch01.xhtml_list1-3)\
  \ 中的示例非常直观。\n\n### 列表 1.3: CharTypes.py\n\n```\n str1 = \"4\"\nstr2 = \"4234\"\n\
  str3 = \"b\"\nstr4 = \"abc\"\nstr5 = \"a1b2c3\"\n\nif(str1.isdigit()):\n  print(\"\
  this is a digit:\",str1)\n\nif(str2.isdigit()):\n  print(\"this is a digit:\",str2)\n\
  \nif(str3.isalpha()):\n  print(\"this is alphabetic:\",str3)\n\nif(str4.isalpha()):\n\
  \  print(\"this is alphabetic:\",str4)\n\nif(not str5.isalpha()):\n  print(\"this\
  \ is not pure alphabetic:\",str5)\n\nprint(\"capitalized first letter:\",str5.title())\n\
  ```\n\n列表 1.3](#ch01.xhtml_list1-3) 初始化了一些变量，紧接着是两个条件测试，使用 `isdigit()` 函数检查 `str1`\
  \ 和 `str2` 是否为数字。列表 1.3](#ch01.xhtml_list1-3) 的后续部分检查 `str3`、`str4` 和 `str5` 是否为字母。（此处省略了原文中重复的描述性，已按要求清理）。\n\
  \n列表 1.3](#ch01.xhtml_list1-3) 的输出如下：\n```\n this is a digit: 4\nthis is a digit:\
  \ 4234\nthis is alphabetic: b\nthis is alphabetic: abc\nthis is not pure alphabetic:\
  \ a1b2c3\ncapitalized first letter: A1b2c3\n```\n\n## 在字符串中搜索和替换\n\nPython 提供了搜索和替换字符串的方法。列表\
  \ 1.4](#ch01.xhtml_list1-4) 显示了 `FindPos.py` 的内容，展示了如何使用 `find()` 函数搜索一个字符串。\n\n\
  ### 列表 1.4: FindPos.py\n\n```\n item1 = 'abc'\nitem2 = 'Abc'\ntext = 'This is a\
  \ string'\n\npos1 = text.find(item1)\npos2 = text.find(item2)\n\nprint('pos1:',\
  \ pos1)\nprint('pos2:', pos2)\n```\n\n`find()` 函数返回第一次匹配发生的索引；否则`find()` 返回 `-1`。列表\
  \ 1.4](#ch01.xhtml_list1-4) 的输出为：\n\n```\npos1: 12\npos2: -1\n```\n\n除了 `find()`\
  \ 方法，当你想要测试元素是否存在时，可以使用 `in` 运算符，如下所示：\n\n```\n >>> lst = [1,2]\n>>> 1 in lst\n\
  True\n```\n\n列表 1.5](#ch01.xhtml_list1-5) 显示了 `Replace.py` 的内容，展示了如何用另一个字符串替换一个字符串。\n\
  \n### 列表 1.5: Replace.py\n\n```\n text = 'This is a string'\ntext = text.replace('is\
  \ a', 'was a')\nprint(text)\n```\n\n列表 1.5](#ch01.xhtml_list1-5) 初始化了变量 `text` 并打印其内容。输出为：\n\
  \n```\nThis was a string\n```\n\n## 移除开头结尾字符\n\nPython 提供了 `strip()`、`lstrip()`\
  \ 和 `rstrip()` 函数来移除文本字符串中的字符。列表 1.6](#ch01.xhtml_list1-6) 显示了 `Remove1.py` 的内容，展示了如何搜索字符串。\n\
  \n### 列表 1.6: Remove1.py\n\n```\n text = '   leading and trailing white space  \
  \ '\nprint('text1:','x',text,'y')\n\ntext = text.lstrip()\nprint('text2:','x',text,'y')\n\
  \ntext = text.rstrip()\nprint('text3:','x',text,'y')\n```\n\n\n\n\n\n如果你想移除文本字符串内部多余的空格，可以使用如上一节介绍的那样使用\
  \ `replace()` 函数。下面的示例演示了如何实现这一点，该示例还包含了用于正则表达式的 `re` 模块：\n\n```\n import re\ntext\
  \ = 'a    b'\na = text.replace(' ', '')\nb = re.sub('\\s+', ' ', text)\n\nprint(a)\n\
  print(b)\n```\n\n结果如下：\n\n```\n ab\na b\n```\n\n### 打印不带换行符的文本\n\n如果你需要抑制多个 `print`\
  \ 语句输出的对象之间的空格和换行符，可以使用字符串拼接或 `write()` 函数。\n\n第一种技术是在打印结果之前，使用 `str()` 函数将每个对象的字符串表示进行拼接。例如，在\
  \ Python 中执行以下语句：\n\n```\n x = str(9)+str(0xff)+str(-3.1)\nprint('x: ',x)\n```\n\
  \n输出所示：\n\n```\n x:  9255-3.1\n```\n\n前的一行包含了数字 `9` 和 `255`（它是十六进制数字 `0xff` 的十进制值）以及\
  \ `-3.1` 的拼接。\n\n顺带一提，你对模块和自定义类使用 `str()` 函数。这里有一个涉及 Python 内置模块 `sys` 的示例：\n\n\
  ```\n >>> import sys\n>>> print(str(sys))\n<module 'sys' (built-in)>\n```\n\n下面的代码段演示了如何使用\
  \ `write()` 函数显示字符串：\n\n```\n import sys\nwrite = sys.stdout.write\nwrite('123')\n\
  write('123456789')\n```\n\n输出如下：\n\n```\n 1233\n1234567899\n```\n\n### 文本对齐\n\n\
  Python 提供了 `ljust()`、`rjust()` 和 `center()` 方法来对齐文本。`ljust()` 和 `rjust()` 函数分别对文本字符串进行左对齐和右对齐，而\
  \ `center()` 函数将将字符串居中。在代码块中显示了一个示例：\n\n```\n text = 'Hello World'\ntext.ljust(20)\n\
  'Hello World '\n>>> text.rjust(20)\n' Hello World'\n>>> text.center(20)\n' Hello\
  \ World '\n```\n\n你可以使用 Python 的 `format()` 函数来对齐文本。使用 `<`, `>`, 或 `^` 字符配合所需的宽度，分别对文本进行右对齐、左对齐和居中。下面的示例演示了你如何指定文本对齐方式：\n\
  \n```\n >>> format(text, '>20')\n'         Hello World'\n>>>\n>>> format(text, '<20')\n\
  'Hello World         '\n>>>\n>>> format(text, '²⁰')\n'    Hello World     '\n>>>\n\
  ```\n\n### 处理日期\n\nPython 提供了一系列丰富的与日期相关的函数，这些函数在线上有文档：\n\n*[`docs.python.org/2/library/datetime.html`](http://docs.python.org/2/library/datetime.html)*\n\
  \n列表 1.7 显示了 Python 脚本 `Datetime2.py` 的内容，该脚本显示了各种日期相关值，例如当前日期和时间；星期、月份和年份；以及自纪元（epoch）以来的秒数时间。\n\
  \n***列表 1.7: Datetime2.py***\n\n```\n import time\nimport datetime\n\nprint(\"Time\
  \ in seconds since the epoch: %s\" %time.time())\nprint(\"Current date and time:\
  \ \" , datetime.datetime.now())\nprint(\"Or like this: \" ,datetime.datetime.now().strftime(\"\
  %y-%m-%d-%H-%M\"))\n\nprint(\"Current year: \", datetime.date.today().strftime(\"\
  %Y\"))\nprint(\"Month of year: \", datetime.date.today().strftime(\"%B\"))\nprint(\"\
  Week number of the year: \", datetime.date.today().strftime(\"%W\"))\nprint(\"Weekday\
  \ of the week: \", datetime.date.today().strftime(\"%w\"))\nprint(\"Day of year:\
  \ \", datetime.date.today().strftime(\"%j\"))\nprint(\"Day of the month : \", datetime.date.today().strftime(\"\
  %d\"))\nprint(\"Day of week: \", datetime.date.today().strftime(\"%A\"))\n```\n\n\
  列表 1.8 显示了执行 列表 1.7 中代码生成的输出。\n\n***列表 1.8: datetime2.out***\n\n```\n Time in seconds\
  \ since the epoch: 1375144195.66\nCurrent date and time:  2013-07-29 17:29:55.664164\n\
  Or like this:  13-07-29-17-29\nCurrent year:  2013\nMonth of year:  July\nWeek number\
  \ of the year:  30\nWeekday of the week:  1\nDay of year:  210\nDay of the month\
  \ :  29\nDay of week:  Monday\n```\n\nPython 还允许你对日期相关值进行算术计算，如下代码块所示：\n\n```\n\
  \ >>> from datetime import timedelta\n>>> a = timedelta(days=2, hours=6)\n>>> b\
  \ = timedelta(hours=4.5)\n>>> c = a + b\n>>> c.days\n2\n```\n\n#### 字符串转换\n\n列表\
  \ 1.7 显示了 Python 脚本 `Datetime2.py` 的内容，它显示了各种日期相关值，例如当前日期和时间；星期、月份和年份；以及自纪元以来的秒数时间。\n\
  \n***列表 1.7: Datetime2.py***\n\n```\n import time\nimport datetime\n\nprint(\"Time\
