  \n## 生成国家代码\n\n在为国家生成唯一 ID 的各种方法中，一种简单的方法是根据每个国家的国际电话前缀来识别它，这些前缀是唯一的。在项目中，`country_codes.csv`\
  \ 是通过在线查找包含此类链接手动创建的。例如，列表 7.9 显示了 `country_codes.csv` 的内容，包含了该项目的国家名称及其对应的国际代码。\n\
  \n列表 7.9：country_codes.csv\n\n```\n 001,usa\n033,france\n034,spain\n039,italy\n\
  044,uk\n049,germany\n052,mexico\n081,japan\n```\n\n## 准备国家城市列表\n\n列表 7.10 显示了 `countries_cities.csv`\
  \ 的内容，包含国家名称和属于这些国家的城市列表。\n\n列表 7.10：countries_cities.csv\n\n```\n italy,firenze,milano,roma,venezia\n\
  france,antibe,nice,paris,st_jeannet\ngermany,berlin,frankfurt\nspain,barcelona,madrid\n\
  uk,liverpool,london,manchester\nmexico,mexico_city,tijuana\n```\n\n## 从国家代码生成城市代码：AWK\n\
  \n列表 7.11 显示了 `construct_city_codes.sh` 的内容，说明了如何为属于给定国家的每个城市生成唯一代码。\n\n列表 7.11：construct_city_codes.sh\n\
  \n```\n FILE1=\"country_codes.csv\"\nFILE2=\"countries_cities.csv\"\nrm -f city_codes.csv\n\
  \nawk -F\",\" '\nBEGIN {\n   FS=\",\"; OUT_FILE=\"city_codes.csv\";\n   prev_name\
  \ = \"\"; city_name = \"\";\n   start_code=100; curr_code = 100;\n   city_code =\
  \ \"\"; incr_code = 100\n\n   printf(\"=> BEGIN-PROCESSING: %s\\n\",ARGV[1])\n \
  \  while(getline line < ARGV[1]){\n     #format: country-code,country-name\n   \
  \  split(line,data)\n     code = data[1]\n     country = data[2]\n     #printf(\"\
  code: %s country: %s\\n\",code,country)\n     country_code[country] = code\n   \
  \  code_country[code] = country\n   }\n   close(ARGV[1])\n}\n##########################################\n\
  # 读取 countries_cities.csv 中的每行\n### 将每行拆分为城市列表\n### 生成城市代码包含：\n# country_code, curr_code,\
  \ city_name\n# countries_cities.csv 中的示例行：\n# italy,firenze,milano,roma,venezia\n\
  ##########################################\n{\n   #sample: italy,firenze,milano,roma,venezia\n\
  \   split($0,data)\n   code    = data[1]\n   country = data[2]\n\n   #printf(\"\
  \ code = %s country = %s\\n\", code, country)\n   #printf(\"=> CHECK CODE FOR: %s\
  \ x\\n\", country_code[code])\n\n   if(country_code[country] == \"\") {\n      printf(\"\
  => MAIN-CITIES in %s:\\n\",$0)\n      curr_code = start_code\n      for(i=2; i<=NF;\
  \ i++) {\n         city_code = country_code[$1] \"_\" curr_code \"_\" i\n      \
  \   printf(\"=> constructed city_code:%s\\n\",city_code)\n         print city_code\
  \ >> OUT_FILE\n         curr_code += incr_code\n      }\n\n      if(prev_name ==\
  \ \"\") {\n        city_name = $1\n      } else {\n        if(prev_name != $1) {\n\
  \          # 处理不同的国家：\n          prev_name = city_name\n          city_name = $1\n\
  \          curr_code = start_code\n        }\n      }\n\n      if(city_code == 0)\
  \ city_code = start_code\n   } else {\n      #printf(\"=> SKIPPING INVALID LINE:\
  \ %s\\n\",$0)\n   }\n} $FILE1 $FILE2\n```\n\n列表 7.11 使用 CSV 文件 `country_codes.csv`\
  \ 和 `countries_cities.csv` 的名称初始化 `FILE1` 和 `FILE2`，随后是一个初始化多个字符串和数值变量的 `awk` 脚本。接下来，列表\
  \ 7.11 包含一个 `awk` 脚本，其 `BEGIN` 块包含一个循环，读取 `country_codes.csv` 文件的内容（国家名称和相关的三位代码）。这些值对用于填充\
  \ `country_code` 和 `code_country` 字典。`country_code` 的键是国家名称，值三位代码，而 `code_country`\
  \ 的键值反相反。下一块代码是 `awk` 脚本的主执行块，它涉及条件逻辑和一个大的块。设置条件逻辑的原因是 `awk` 无论是否在 `BEGIN` 块中处理过，都会处理结尾指定的两个输入文件。由于\
  \ `awk` 的性质，列表 7.11 两次处理 `FILE1`：一次在 `BEGIN` 块中，另是在主执行块中（这是 `awk` 的特性还是功能？）。因此，主块中的代码必须跳过\
  \ `FILE1` 中的行，并仅处理 `FILE2` 中的行。跳过 `FILE1` 的方法非常简单：`FILE1` 中的行格式为 `country_code,country`（例如\
  \ `001,usa`），并且代码 `001` 在 `country_code` 字典中不存在。因此，只有 CSV 文件 `FILE2` 中的行满足此条件：\n\
  \n```\ncountry_code[country] == \"\"\n```\n\n此 `if` 语句内部的代码包含一个循环，为 `FILE2` 中每行列出的每个城市构建\
  \ `city_code`。核心思想是，每个城市的 `city_code` 是通过拼接其国家代码、基于 `curr_code` 值生成的数字以及城市本身构建的。例如，接下来的行指定了意大利（其国家代码为\
  \ `039`）以及四个城市：\n\n```\nfirenze,milano,roma,venezia\n```\n\n因此，前一行中意大利每个城市的 `city_code`\
  \ 如下：\n\n```\n039_100_firenze\n039_200_milano\n039_300_roma\n039_400_venezia\n```\n\
  \n运行 列表 7.11 中的代码，你将看到以下输出：\n\n```\n => BEGIN-PROCESSING: country_codes.csv\n=>\
  \ MAIN-CITIES in italy,firenze,milano,roma,venezia:\n=> constructed city_code:039_100_firenze\n\
  => constructed city_code:039_200_milano\n=> constructed city_code:039_300_roma\n\
  => constructed city_code:039_400_venezia\n=> MAIN-CITIES in france,antibe,nice,paris,st_jeannet:\n\
  => constructed city_code:033_100_antibe\n=> constructed city_code:033_200_nice\n\
  => constructed city_code:033_300_paris\n=> constructed city_code:033_400_st_jeannet\n\
  => MAIN-CITIES in germany,berlin,frankfurt:\n=> constructed city_code:049_100_berlin\n\
  => constructed city_code:049_200_frankfurt\n=> MAIN-CITIES in spain,barcelona,madrid:\n\
  => constructed city_code:034_100_barcelona\n=> constructed city_code:034_200_madrid\n\
  => MAIN-CITIES in uk,liverpool,london,manchester:\n=> constructed city_code:044_100_liverpool\n\
  => constructed city_code:044_200_london\n=> constructed city_code:044_300_manchester\n\
  => MAIN-CITIES in mexico,mexico_city,tijuana:\n=> constructed city_code:052_100_mexico_city\n\
  => constructed city_code:052_200_tijuana\n```\n\n列表 7.12 显示了由 列表 7.11 代码生成的 `city_codes.csv`\
  \ 内容。\n\n列表 7.12：city_codes.csv\n\n```\n 039_100_firenze\n039_200_milano\n039_300_roma\n\
  039_400_venezia\n033_100_antibe\n033_200_nice\n033_300_paris\n033_400_st_jeannet\n\
  049_100_berlin\n049_200_frankfurt\n034_100_barcelona\n034_200_madrid\n044_100_liverpool\n\
  044_200_london\n044_300_manchester\n052_100_mexico_city\n052_200_tijuana\n```\n\n\
  \n\n\n\n# 从国家代码生成城市代码：PYTHON\n\nListing 7.13 显示了 `construct_city_codes2.py` 的内容，它展示了如何为给定国家下的每个城市生成唯一代码。\n\
