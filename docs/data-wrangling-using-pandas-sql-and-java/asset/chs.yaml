  \ <friend> 元素的 XML 文档，但我们并没有对 XML 元素的内容进行约束。\n\n\n\n\n然而，`XML Schemas` 对 XML 文档中元素的允许结构提供了严格控制，例如不仅指定它们的类型，还指定它们出现的频率以及在\
  \ XML 元素中的顺序。\n\n例如，我们可以通过以下代码段定义一个 `firstname` 元素，其类型为字符串：\n\n```xml\n <xs:element\
  \ name=\"firstname\" type=\"xs:string\"/>\n```\n\n我们可以定义一个 `friend` 元素，它包含两个字符串类型的元素\
  \ `fname` 和 `lname`，以及一个名为 `height` 的数值元素，如下所示：\n\n```xml\n <?xml version=\"1.0\"\
  ?>\n<xs:element name=\"friend\">\n  <xs:complexType>\n    <xs:sequence>\n      <xs:element\
  \ name=\"fname\"  type=\"xs:string\"/>\n      <xs:element name=\"lname\"  type=\"\
  xs:string\"/>\n      <xs:element name=\"height\" type=\"xs:decimal\"/>\n    </xs:sequence>\n\
  \  </xs:complexType>\n</xs:element>\n```\n\n我们可以修改前面的代码块来指定一个可选的中间名，它最多可以出现三次：\n\
  \n```xml\n <?xml version=\"1.0\"?>\n<xs:element name=\"friend\">\n  <xs:complexType>\n\
  \    <xs:sequence>\n     <xs:element name=\"fname\"  type=\"xs:string\"/>\n    \
  \ <xs:element name=\"mname\" type=\"xs:string\" minOccurs=\"0\" maxOccurs=\"3\"\
  />\n     <xs:element name=\"lname\"  type=\"xs:string\"/>\n     <xs:element name=\"\
  height\" type=\"xs:decimal\"/>\n    </xs:sequence>\n  </xs:complexType>\n</xs:element>\n\
  ```\n\n如果你想指定一个出现任意次数的可选中间名元素，请使用以下代码段：\n\n```xml\n <xs:element name=\"mname\" \
  \ type=\"xs:string\" minOccurs=\"0\" maxOccurs=\"3\"/>\n```\n\n`XML Schemas` 有许多功能，包括\
  \ XML 元素引用其他 XML 元素的能力，你甚至可以将 XML 元素指定为抽象的（面向对象编程中的含义）。请在线搜索更多关于 `XML Schemas` 的信息。\n\
  \n### 总结\n\n本章首先向你展示了如何编写 Java 代码来管理关系型数据库和关系型表的内容。你看到了如何为你的笔记本进行必要的设置步骤，以便 Java\
  \ 代码能够正确执行。\n\n接下来，你学习了如何编写 Java 代码来管理 `MySQL` 数据库中基于 JSON 的数据。你看到了如何为 JSON 数据创建表，如何向表中插入数据，以及如何使用\
  \ Java 代码检索这些数据。\n\n你还学习了用于处理 XML 文档的 Java 技术，例如基于 SAX 的解析器和基于 DOM 的解析器。最后，你看到了如何编写\
  \ Java 代码来管理 `MySQL` 数据库中基于 XML 的数据。\n\n# 第 6 章\n\n## 数据清洗任务\n\n本章讨论了涉及包含各种类型数据的数据集的清洗任务，例如日期、电话号码和货币，这些都有不同的格式。此外，本章中的许多代码示例引用了书中之前章节中讨论的技术。本章自然地过渡到\
  \ 第 7 章，该章节讨论了各种代码示例中的数据清洗。\n\n本章的第一部分简要描述了数据清洗，随后是针对 `MySQL` 数据库表中数据的清洗任务示例。具体来说，你将看到如何将\
  \ `NULL` 值替换为 `0`，如何用平均值替换 `NULL` 值，如何用单个值替换多个值，如何处理不匹配的属性值，以及如何将字符串转换为日期值。\n\n\
  本章的第二部分向你展示如何使用 `sed` 命令行工具将 CSV 文件中的多个分隔符替换为单个分隔符。你还将看到如何使用 `awk` 命令行工具重构 CSV 文件，创建一个行具有相同字段数量的文件。\n\
  \n本章的第三部分向你展示如何使用 `awk` 命令行工具处理列数变化的 CSV 文件。`awk` 命令是一门独立的编程语言，在处理文本文件方面具有令人印象深刻的能力。如果你熟悉\
  \ `awk` 命令，请阅读包含大量 `awk` 工具代码示例的附录。\n\n本章的第四部分包含了基于 `awk` 的 shell 脚本，向你展示如何将电话号码列表转换为相同格式，以及将日期格式列表转换为相同格式。\n\
  \n本章假设你已经阅读了之前章节中的数据清洗示例。此外，第 7 章也包含一个涉及数据清洗任务的额外代码示例的章节。\n\n### 什么是数据清洗？\n\n数据清洗（Data\
  \ cleaning），也称为数据净化，是确保数据集的内容完整、正确且通常没有重复的任务。因此，数据清洗的重点是单个文件，而不是合并或转换来自两个或多个文件的数据。数据清洗通常在任何数据转换之前进行。在某些情况下，数据清洗也必须在数据转换之后进行\n\
  \n例如，假设一个 CSV 文件包含员工相关数据，一个 `MySQL` 表也包含员工相关数据，且都已清理了不一致之处并删除了重复。然而，在将表数据导出到与第一个\
  \ CSV 文件合并的 CSV 文件后，可能会出现必须删除的重复项。\n\n顺便说，有多种技术可以确定替换空字段的值，其选择从显而易见的因素到微妙因素不等。有时你可以指定平均值或中位数作为缺失值，但在其他情况下，你需要更复杂的技术。例如，假设一个包含\
  \ 1000 行的数据集由两类患者组成：健康患者（多数）以及癌症患者。显然，你希望患病的数量尽可能少，这意味着数据集是不平衡的。\n\n不幸的是，机器学习算法在不平衡数据集上可能会产生不准确的结果。此外，基于平均值或中位数生成合成数据可能是风险的。一种更好的技术是\
  \ `SMOTE`，它生成在原始集中出现的数据。\n\n作为另一个例子，日期、货币和数字的格式在不同国家之间不同。日期格式示例包括 `YYYY/MM/DD`、`MM/DD/YYYY`\
  \ 和 `DD/MM/YYYY`（以及其他可能的日期格式）。提到的是，`YYYY/MM/DD` 是日期的 ISO 标准。\n\n数字格式在美国使用逗号 `,`\
  \ 作为千位符，使用点 `.` 作为小数点（例如 `$1,234.56`），而欧洲使用相反的顺序（例如 `1.234,56`）。取决于涉及的数据集，数据清洗还可以涉及处理各种日期、货币和数字，以确保所有值具有相同的格式。\n\
  \n此外，如果两个 CSV 文件包含不同的日期格式，并且你需要创建一个基于日期列的单个 CSV 文件，那么将存在转换过程，可以是以下之一：\n\n* 将第一种日期格式转换为第二种日期格式\n\
  * 将第二种日期格式转换为第一种日期格式\n* 将两种格式转换为第三种格式\n\n在财务数据的情况下，你可能还会遇到不同的货币，这涉及到货币对之间的汇率。由于货币汇率会波动，你需要决定用于数据的数据汇率，这可以是以下之一：\n\
  \n* CSV 文件生成日期期间的汇率\n* 当前货币汇率\n* 其他某种机制\n\n#### 个人称谓的数据清洗\n\n\n\n\n\n有时候，“暴力破解”方案也是最简单的方案，特别是在涉及字符串时。例如，一个人的头衔可能有无数种拼写方式，涉及许多讨厌的细微差异，因此，知道如何以一种简单、直观且易于扩展额外用例的方法来执行此任务是有好的。例如，在查看下面的解决方案之前，考虑你将如何将以下列表中的每个字符串替换为前缀“Mr,”、“Ms,”或“Mrs”：\n\
  \n```\n Titles = ['mr.','MR','MR.','mister','Mister','Ms','Ms.', 'Mr', 'Mr.','mr',\n\
  'MS','MS.','ms','ms.','Mis','miss','miss.','Mrs','Mrs.','mrs','mrs.',\n'Madam','madam','ma\"\
  am']\n```\n\n虽然可以使用 `if/else` 代码块的条件逻辑来解决此任务，但这种方法涉及冗长的代码块。一个更简单易的解决方案是使用 `in` 关键字，所示：\n\
  \n```\n mr_dict={}\nms_dict={}\nmrs_dict={}\n\ntitles = ['mr.','MR','MR.','mister','Mister','Ms','Ms.',\
  \ 'Mr', 'Mr.',\n'mr','MS','MS.','ms','ms.','Mis','miss','miss.','Mrs','Mrs.','mrs','mrs.',\n\
  'Madam','madam','ma\"am']\n\nfor title in ['Mr','Mr.','mr','mr.','MR','MR.','mister','Mister']:\n\
  \  mr_dict[title] = \"Mr\"\n\nfor title in ['Ms','Ms.','MS','MS.','ms','ms.','Mis','miss','miss.']:\n\
  \  ms_dict[title] = \"Ms\"\n\nfor title in ['Mrs','Mrs.','mrs','mrs.','Madam','madam','ma\"\
  am']:\n  mrs_dict[title] = \"Mrs\"\n\nprint(\"Mr dictionary: \",mr_dict)\nprint()\n\
  print(\"Ms dictionary: \",ms_dict)\nprint()\nprint(\"Mrs dictionary:\",mrs_dict)\n\
  ```\n\n运行上述代码块，你将看到以下输出：\n\n```\n Mr dictionary:  {'Mr': 'Mr', 'Mr.': 'Mr', 'mr':\
  \ 'Mr', 'mr.': 'Mr', 'MR': 'Mr', 'MR.': 'Mr', 'mister': 'Mr', 'Mister': 'Mr'}\n\n\
  Ms dictionary:  {'Ms': 'Ms', 'Ms.': 'Ms', 'MS': 'Ms', 'MS.': 'Ms', 'ms': 'Ms', 'ms.':\
  \ 'Ms', 'Mis': 'Ms', 'miss': 'Ms', 'miss.': 'Ms'}\n\nMrs dictionary: {'Mrs': 'Mrs',\
  \ 'Mrs.': 'Mrs', 'mrs': 'Mrs', 'mrs.': 'Mrs', 'Madam': 'Mrs', 'madam': 'Mrs', 'ma\"\
  am': 'Mrs'}\n```\n\n这里提供的解决方案非常易于维护、调试和扩展，因为唯一的变化是在适当的位置添加新字符串。此外，给出的解决方案不需要任何额外的循环或正则表达式。如果你需要一个新类别，例如“Sir,”，定义\
  \ Python 字典 `sir_dict`，然后添加新的代码段，所示：\n\n```\n if title in ['Sir','sir','Sire','sire','Yessir','yessir']:\n\
  sir_dict[title] = \"Sir\"\n```\n\n## SQL 中的数据清洗\n\n本节包含几个在 SQL 中执行数据清洗任务的子节。注意，并非必须在\
  \ SQL 中执行这些任务：另一种选择是将数据库表的内容读取到 Pandas DataFrame 中，然后使用 Pandas 方法实现相同的结果。\n\n然而，本节说明了如何执行以下影响数据库表属性的数据清洗任务：\n\
  \n* 将 `NULL` 替换为 `0`\n* 将 `NULL` 替换为平均值\n* 将多个值合并为单个值\n* 处理数据类型不匹配\n* 将字符串日期转换为日期格式\n\
  \n### 将 NULL 替换为 0\n\n此任务非常直观，你可以使用以下 SQL 语句之一执行：\n\n```\n SELECT ISNULL(column_name,\
  \ 0) FROM table_name\nOR\nSELECT COALESCE(column_name, 0) FROM table_name\n```\n\
  \n### 将 NULL 值替换为平均值\n\n此任务涉及两个步骤：首先找到数据库表中某列的非 `NULL` 值的平均值，然后用第一步中找到的值更新该列中的 `NULL`\
  \ 值。列举 6.1 显示了 SQL 文件 `replace_null_values.sql` 的内容，该文件执行了这一对步骤。\n\n***LISTING 6.1:\
  \ replace_null_values.sql***\n\n```\n USE mytools;\nDROP TABLE IF EXISTS temperatures;\n\
  CREATE TABLE temperatures (temper INT, city CHAR(20));\n\nINSERT INTO temperatures\
  \ VALUES(78,'sf');\nINSERT INTO temperatures VALUES(NULL,'sf');\nINSERT INTO temperatures\
  \ VALUES(42,NULL);\nINSERT INTO temperatures VALUES(NULL,'ny');\nSELECT * FROM temperatures;\n\
  \nSELECT @avg1 := AVG(temper) FROM temperatures;\nupdate temperatures\nset temper\
  \ = @avg1\n\nwhere ISNULL(temper);\nSELECT * FROM temperatures;\n\n-- 用频率最高的城市值初始化\
  \ city1:\nSELECT @city1 := (SELECT city FROM temperatures GROUP BY city ORDER BY\
  \ COUNT(*) DESC LIMIT 1);\n\n-- 使用 city1 更新 NULL city 值:\nupdate temperatures\n\
  set city = @city1\n\nwhere ISNULL(city);\nSELECT * FROM temperatures;\n```\n\n列举\
  \ 6.1 创建了 `temperatures` 表并填充了若干行，然后用 `temper` 属性的平均值初始化变量 `@avg1`。运行 列举 6.1 你将看到以下输出：\n\
  \n```\n +--------+------+\n| temper | city   |\n+--------+------+\n|     78 | sf\
  \     |\n|    NULL | sf     |\n|     42 | NULL   |\n|    NULL | ny     |\n +--------+------+\n\
  ```\n\n### 将多个值合并为单个值\n\n合并多个值的示例是将纽约州的多个字符串（例如 `new_york`、`NewYork`、`NY` 和 `New_York`）替换为\
  \ `NY`。列举 6.2 显示了 SQL 文件 `reduce_values.sql` 的内容。\n\n***LISTING 6.2: reduce_values.sql***\n\
  \n```\n use mytools;\nDROP TABLE IF EXISTS mytable;\nCREATE TABLE mytable (str_date\
  \ CHAR(15), state CHAR(20), reply CHAR(10));\n\nINSERT INTO mytable VALUES('20210915','New\
  \ York','Yes');\nINSERT INTO mytable VALUES('20211016','New York','no');\nINSERT\
  \ INTO mytable VALUES('20220117','Illinois','yes');\nINSERT INTO mytable VALUES('20220218','New\
  \ York','No');\nSELECT * FROM mytable;\n\n-- 将 yes, Yes, y, Ys 替换为 Y:\nupdate mytable\n\
  set reply = 'Y'\nwhere upper(substr(reply,1,1)) = 'Y';\nSELECT * FROM mytable;\n\
  \n-- 将所有其他值替换为 N\nupdate mytable\nset reply = 'N' where substr(reply,1,1) != 'Y';\n\
  SELECT * FROM mytable;\n```\n\n\n\n\n\n```\n +----------+----------+-------+\n|\
  \ str_date | state    | reply |\n+----------+----------+-------+\n| 20210915 | New\
  \ York | Yes   |\n| 20211016 | New York | no    |\n| 20220117 | Illinois | yes \
  \  |\n| 20220218 | New York | No    |\n+----------+----------+-------+\n4 rows in\
  \ set (0.000 sec)\n\nQuery OK, 2 rows affected (0.001 sec)\nRows matched: 2  Changed:\
  \ 2  Warnings: 0\n\n+----------+----------+-------+\n| str_date | state    | reply\
  \ |\n+----------+----------+-------+\n| 20210915 | New York | Y     |\n| 20211016\
  \ | New York | no    |\n| 20220117 | Illinois | Y     |\n| 20220218 | New York |\
  \ No    |\n+----------+----------+-------+\n4 rows in set (0.000 sec)\n\nQuery OK,\
  \ 2 rows affected (0.001 sec)\nRows matched: 2  Changed: 2  Warnings: 0\n\n+----------+----------+-------+\n\
  | str_date | state    | reply |\n+----------+----------+-------+\n| 20210915 | New\
  \ York | Y     |\n| 20211016 | New York | N     |\n| 20220117 | Illinois | Y   \
  \  |\n| 20220218 | New York | N     |\n+----------+----------+-------+\n4 rows in\
  \ set (0.001 sec)\n```\n\n### 处理不匹配的属性值\n\n此任务涉及两个步骤：首先找到数据库表内某一列的非 `NULL` 值的平均值，然后用你在第一步中找到的数值更新该列中的\
  \ `NULL` 值。[列表项 6.3] 显示了 SQL 文件 `type_mismatch.sql` 的内容，该文件执行了这一对步骤。\n\n#### 列表项\
  \ 6.3: type_mismatch.sql\n\n```\n USE mytools;\nDROP TABLE IF EXISTS emp_details;\n\
  CREATE TABLE emp_details (emp_id CHAR(15), city CHAR(20), state CHAR(20));\n\nINSERT\
  \ INTO emp_details VALUES('1000','Chicago','Illinois');\nINSERT INTO emp_details\
  \ VALUES('2000','Seattle','Washington');\nINSERT INTO emp_details VALUES('3000','Santa\
  \ Cruz','California');\nINSERT INTO emp_details VALUES('4000','Boston','Massachusetts');\n\
  SELECT * FROM emp_details;\n\nselect emp.emp_id, emp.title, det.city, det.state\n\
  from employees emp join emp_details det\nWHERE emp.emp_id = det.emp_id;\n\n-- 早期版本的\
  \ MySQL 需要：\n--WHERE emp.emp_id = cast(det.emp_id as INT);\n```\n\n[列表项 6.3] 创建并填充了\
  \ `emp_details` 表，随后是一个涉及 `emp` 和 `emp_details` 表的 SQL `JOIN` 语句。尽管在 `emp` 和 `emp_details`\
  \ 表中，`emp_id` 表分别被定义为 `INT` 类型和 `CHAR` 类型，但代码按预期工作。然而，在 MySQL 的早期版本中，你需要使用内置的 `CAST()`\
  \ 函数将 `CHAR` 值转换为 `INT` 值（反反之），如被注释的代码片段所示：\n\n```\n --WHERE emp.emp_id = cast(det.emp_id\
  \ as INT);\n```\n\n运行 [列表项 6.3] 中的代码，你将看到以下输出：\n\n```\n +--------+------------+---------------+\n\
