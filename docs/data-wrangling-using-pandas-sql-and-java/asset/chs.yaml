  \ 5:5:4\n=> VALID DAY/TIME FORMAT:  7/18/26 5:5:4\n```\n```\n\n\n\n\nListing 6.22\
  \ 显示了 `add_country_codes.sh` 的内容，展示了如何增加一组国家的三位国际前缀。请注意，在本节之后你将不需要这段代码示例。将其包含在此处是为了向你展示如何使用\
  \ `awk` 工具轻松地操作 CSV 文件中的数值值。如果有需要，你可以轻松地调整此代码以处理其他 CSV 文件。\n\n**Listing 6.22: add_country_codes.sh**\n\
  \n```bash\nFILE=\"country_codes.csv\"\n\necho \"=> display code and country:\"\n\
  awk -F\",\" '\nBEGIN { code = 10000; incr = 10000 }\n{\n   printf(\"%s,%s,%d\\n\"\
  , $1, $2, code)\n   code += incr\n}\n' < $FILE\necho \"-----------------\"\necho\n\
  \necho \"=> increment country code:\"\nawk -F\",\" '\nBEGIN { code = 1000; incr\
  \ = 1000 }\n{\n   printf(\"%d,%s\\n\", $1 + code, $2)\n   code += incr\n}\n' < $FILE\n\
  ```\n\nListing 6.22 初始化变量 `FILE`，其名称为包含若干国家代码和缩缩的 CSV 文件名。接下来，一个 `awk` 脚本包含一个 `BEGIN`\
  \ 部分，其中包含一个循环，为每个国家代码加 10000。例如，以下两个代码段显示了输入行“之前”和“之后”的内容：\n\n```\n001,usa,10000\n\
  1001,usa\n```\n\n运行 Listing 6.22 中的代码，你将看到以下输出：\n\n```\n => display code and country:\n\
  001,usa,10000\n033,france,20000\n034,spain,30000\n039,italy,40000\n044,uk,50000\n\
  049,germany,60000\n052,mexico,70000\n081,japan,80000\n-----------------\n\n=> increment\
