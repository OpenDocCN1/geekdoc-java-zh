  \ outliers: 0\noutliers: []\n```\n\n### 计算 Z-Score 以寻找离群值\n\n一组数字的 z-score 是通过标准化这些数字计算的，这涉及到从每个数字中减去它们的平均值，然后除以标准差。尽管你可以手动执行这些步骤，但\
  \ SciPy 库简化了涉及的步骤。如果有需要，可以通过以下命令安装此包：\n\n```\npip3 install scipy\n```\n\nListing\
  \ 2.5 显示了 `outliers_zscores.py` 的内容，说明了如何在一个数字数组中寻找离群值。正如你所看到的，这个代码示例依赖于 NumPy、Pandas\
  \ 和 SciPy 的便利方法。\n\n列表 2.5: outliers_zscores.py\n\n```python\n import numpy as np\n\
  import pandas as pd\nfrom scipy import stats\n\narr1 = np.array([2,5,7,9,9,40])\n\
  print(\"values:\",arr1)\n\ndf = pd.DataFrame(arr1)\n\nzscores = np.abs(stats.zscore(df))\n\
  print(\"z scores:\")\nprint(zscores)\nprint()\n\nupper = 2.0\nlower = 0.5\nprint(\"\
  => upper outliers:\")\nprint(zscores[np.where(zscores > upper)])\nprint()\nprint(\"\
  => lower outliers:\")\nprint(zscores[np.where(zscores < lower)])\nprint()\n```\n\
  \n\n\n\n\n```\nzscores = np.abs(stats.zscore(df))\n```\n\n下一段代码初始化了变量 `upper` 和\
  \ `lower`。小于 `lower` 值或大于 `upper` 值的 z-score 被视为离群值，并会显示这些值。运行列表 2.3 中的代码，你将看到以下输出：\n\
