  ```python\ndf[df['one'] > 1]\n```\n\n根据多个条件过滤：\n\n```python\ndf[(df['one'] > 1)\
  \ & (df['two'] < 30)]\n```\n\n使用 `query` 方法过滤：\n\n```python\ndf.query('one > 1 and\
