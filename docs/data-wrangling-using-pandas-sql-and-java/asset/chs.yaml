  \ Cruz | California    |\n|   4000 | Senior Dev Manager | Boston     | Massachusetts\
  \ |\n+--------+--------------------+------------+---------------+\n4 rows in set\
  \ (0.002 sec)\n```\n\n### 将字符串转换为日期值\n\n[列表项 6.4] 显示了 `str_to_date.sql` 的内容，它说明了如何根据另一个包含日期字符串的字符串属性来填充日期属性值。\n\
  \n#### 列表项 6.4: str_to_date.sql\n\n```\n use mytools;\nDROP TABLE IF EXISTS mytable;\n\
  CREATE TABLE mytable (str_date CHAR(15), state CHAR(20));\n\nINSERT INTO mytable\
  \ VALUES('20210915','New York');\nINSERT INTO mytable VALUES('20211016','New York');\n\
  INSERT INTO mytable VALUES('20220117','yes');\nINSERT INTO mytable VALUES('20220218','No');\n\
  \nSELECT * FROM mytable;\n\n-- 1) 日期：\nALTER TABLE mytable\nADD COLUMN real_date\
  \ DATE;\n\n-- 2) 从 str_date 填充 real_date：\nUPDATE mytable t1\nINNER JOIN mytable\
  \ t2\nON t1.str_date = t2.str_date\nSET t1.real_date = DATE(t2.str_date);\n\n--\
  \ 3) 删除：\nALTER TABLE mytable\nDROP str_date;\n```\n\n[列表项 6.4] 创建并填充了 `mytable`\
  \ 表，并显示了表的内容。剩余语句解释如下：第一个语句添加了 `real_date` 列；第二个语句通过 `DATE()` 函数填充它；第三个语句是可选的：如果你想这样做，可以删除\
  \ `str_date`。运行 [列表项 6.4] 中的代码，你将看到以下输出：\n\n```\n +----------+----------+-------+\n\
  | str_date | state    | reply |\n+----------+----------+-------+\n| 20210915 | New\
  \ York | Yes   |\n| 20211016 | New York | no    |\n| 20220117 | Illinois | yes \
  \  |\n| 20220218 | New York | No    |\n+----------+----------+-------+\n4 rows in\
  \ set (0.000 sec)\n\nQuery OK, 2 rows affected (0.001 sec)\nRows matched: 2  Changed:\
  \ 2  Warnings: 0\n\n+----------+----------+-------+\n| str_date | state    | reply\
  \ |\n+----------+----------+-------+\n| 20210915 | New York | Y     |\n| 20211016\
  \ | New York | no    |\n| 20220117 | Illinois | Y     |\n| 20220218 | New York |\
  \ No    |\n+----------+----------+-------+\n4 rows in set (0.000 sec)\n\nQuery OK,\
  \ 2 rows affected (0.001 sec)\nRows matched: 2  Changed: 2  Warnings: 0\n\n+----------+----------+-------+\n\
  | str_date | state    | reply |\n+----------+----------+-------+\n| 20210915 | New\
  \ York | Y     |\n| 20211016 | New York | N     |\n| 20220117 | Illinois | Y   \
  \  |\n| 20220218 | New York | N     |\n+----------+----------+-------+\n4 rows in\
  \ set (0.001 sec)\n```\n\n\n\n\n\n本节未提供本节代码示例之外的关于 `sed` 的详细信息。然而，在阅读完代码（它是一行单行命令）后，你可能会理解如何将该代码片段调整为你自己的需求（即：如何指定不同的分隔符）。\n\
  \n列表 6.5 显示了 `delimiter1.txt` 的内容，列表 6.6 显示了 `delimiter1.sh` 的内容，它将所有分隔符替换为逗号（“，”）。\n\
  \n**列表 6.5: delimiter1.txt**\n\n```\n 1000|Jane:Edwards^Sales\n2000|Tom:Smith^Development\n\
  3000|Dave:Del Ray^Marketing\n```\n\n**列表 6.6: delimiter1.sh**\n\n```\n cat delimiter1.txt\
  \ | sed -e 's/:/,/' -e 's/|/,/' -e 's/\\^/,/'\n```\n\n列表 6.6 以 `cat` 命令实用工具开头，该工具将文件\
  \ `delimiter1.txt` 的内容发送到“标准输出”（默认在屏幕上）。然而，在这个示例中，由于管道符号（`|`），由于此命令的输出变成了 `sed`\
  \ 命令的输入。\n\n`sed` 命令由三个部分组成，全部通过 `-e` 选项连接。你可以将 `-e` 理解为指示 `sed` 命令“还有更多处理需要完成”。在这个示例中，出现了三次\
  \ `-e`，这意味着 `sed` 将执行三个操作。\n\n第一个代码片段是 `'s/:/,/'`，它的含义是“将每个分号替换为逗号”。该操作的结果被传递给下一个代码片段\
  \ `'s/|/,/'`。这个代码片段的意思是“将每个管道符替换为逗号”。该操作的结果被传递给下一个代码片段，即 `'s/\\^*/,/'`。这个代码片段的意思是“将每个脱字符符号（“^”）替换为逗号”。该操作的结果被发送到标准输出，标准输出可以被重定向到另一个文本文件。运行列表\
  \ 6.6 中的代码，你将看到以下输出：\n\n```\n 1000,Jane,Edwards,Sales\n2000,Tom,Smith,Development\n\
  3000,Dave,Del Ray,Marketing\n```\n\n有三点需要注意。首先，第三个片段包含一个反斜杠，因为脱字符符号（“^”）是一个元字符，所以我们需要对该字符进行“转义”。其他元字符（如“$”和“.”）也是如此。\n\
  \n其次，你可以针对文本文件中遇到的每一个新的作为字段分隔符的分隔符，轻松地扩展 `sed` 命令：只需为每个新分隔符遵循你在列表 6.6 中看到的模式即可。\n\
  \n第三，通过运行以下命令，将 `delimiter1.sh` 的输出重定向到文本文件 `delimiter2.txt`：\n\n```\n ./delimiter1.sh\
  \ > delimiter2.txt\n```\n\n如果在上一个代码片段中发生错误，请确保通过调用以下命令使 `delimiter1.sh` 具有执行权限：\n\
  \n```\n chmod 755 delimiter1.sh\n```\n\n到此，涉及 `sed` 命令行实用工具的示例结束，它是一个处理文本文件的非常强大的工具。\n\
  \n### 处理变动列数\n\n本节向你展示如何使用 `awk` 命令行实用工具用 NaN 值“填充”CSV 文件中的行，以便使所有记录具有相同的列数。\n\n\
  列表 6.7 显示了 `variable_columns.csv` 的内容，列表 6.8 显示了 `variable_columns.sh` 的内容，它使用 `awk`\
  \ 实用来填充 CSV 文件中的列数。\n\n**列表 6.7: variable_columns.csv**\n\n```\n 10,20,30\n10,20,30,40\n\
  10,20,30,40,50,60\n```\n\n**列表 6.8: variable_columns.sh**\n\n```\n filename=\"variable_columns.csv\"\
  \n\ncat $filename | awk -F\",\" '\nBEGIN { colCount = 6 }\n{\n  printf(\"%s\", $0)\n\
  \  for(i=NF; i<colCount; i++) {\n     printf(\",NaN\")\n  }\n  print \"\"\n}\n'\n\
  ```\n\n列表 6.8 初始化变量 `filename` 为该代码示例的 CSV 文件名。下一个片段是一个 `awk` 脚本，它在 `BEGIN` 块中初始化\
  \ `colCount` 为 6：该值是 CSV 文件中任何行的最大列数。\n\n下一块代码显示当前行的内容，随后是一个循环，打印一个逗号分隔的 NaN 值列表，以确保输出行包含\
  \ 6 列。例如，如果一行有四列，那么 `NaN` 将打印两次。循环后的 `print()` 语句确保输入文件的下一行从新行开始，而不是在当前输出行。运行列表\
  \ 6.8 中的代码，你将看到以下输出：\n\n```\n 10,20,30,NaN,NaN,NaN\n10,20,30,40,NaN,NaN\n10,20,30,40,50,60\n\
  ```\n\n列表 6.8 的一个局限性是必须在 `BEGIN` 块中指定最大列数。列表 6.9 通过扫描整个文件来确定列限制。\n\n**列表 6.9: variable_columns.sh**\n\
  \n```\n filename=\"variable_columns.csv\"\n\ncat $filename | awk -F\",\" '\nBEGIN\
  \ { colCount = 0 }\n\n  \n\n\n      Count = =\n\n\n  \n\n\n  \n(\n line < ARGV[1])\
  \ {\n    colCount = split(line,data)\n    if(maxCount < <(()) {\n\nmax\nCount =\
  \ =(data)\n    }\n  }\n}\n{\n  # 打印当前行:\n  printf(\"%s\", $0)\n\n  # 如果需要填充 NaN:\n\
  \  for(i=NF; i<maxCount;; i {\n\nprintfprintfNaNNaN\n\n  \n\n   \"\"\n\n\n\n\n\n\
  \n\n\n\n\n  ....ch0....list6669) ` `filename``` CSV CSV CSV CSV。下一个片段是一个 `awk` 脚本，它包含一个\
  \ `while` 循环来处理行。列表 6.9 与列表 6.8 相同，在需要时用 NaN 填充行。运行列表 6.9 中的代码，你将看到以下输出：\n\n```\n\
  \ 10,20,30,NaN,NaN,NaN\n10,20,30,40,NaN,NaN\n10,20,30,40,50,60\n```\n\n### 截断 CSV\
  \ 文件中的\n\n上一节向你展示了如何使用 `awk` 命令行实用工具用 NaN 字符串填充 CSV 文件中的，而本节向你展示如何截断 CSV 文件中的行，只显示列数最少的列。\n\
  \n列表 6.10 显示了 `variable_columns3.sh` 的内容，它使用 `awk` 实用显示 CSV 文件中的列子集。\n\n**列表 6.10:\
  \ variable_columns3.sh**\n\n```\n filename=\"variable_columns.csv\"\n\ncat $filename\
  \ | awk -F\",\" '\nBEGIN {\n  colCount = 0; minColCount = 9999\n\n  ###############################################\n\
  \  # minColCount = 最短行的字段数\n  ###############################################\n\
  \  while(getline line < ARGV[1]) {\n    colCount = split(line,data)\n    if(minColCount\
  \ > length(data)) {\n       minColCount = length(data)\n    }\n  }\n}\n{\n  # 对每行输入执行:\n\
  \  for(j=1; j<=minColCount; j++) {\n     printf(\"%s,$j)\n  }\n  print \"\"\n}\n\
  ' $filename\n```\n\n列表 6.10 与列表 6.9 非常相似。在初始化变量 `filename` 为该代码示例的 CSV 文件名后，`awk`\
  \ 脚本从 CSV 文件中找到列数最少的列的列数。变量 `minColCount` 在 `BEGIN` 块中初始化为 9999，当该循环完成后，它的值将是输入行的最小列数。\n\
  \n\n\n\n\nListing 6.9 的后续部分是一个循环，用于打印输入文件中每行的前 `minColCount` 列。运行 Listing 6.10 中的代码，你将看到以下输出：\n\
  \n```\n 10,20,\n10,20,\n10,20,\n10,20,\n10,20,\n```\n\n## 使用 AWK 工具生成具有固定列数的行\n\n\
  本节中的代码示例包含一个 `awk` 脚本，该脚本处理一个以空格分隔的输入字符串 CSV 文件，并生成所有行都具有相同列数的输出（最后一行可能除外）。Listing\
  \ 6.11 显示了 `FixedFieldCount1.sh` 的内容，该内容说明了如何使用 `awk` 工具将一个字符串拆分为包含三个字符串的行。\n\n\
  ***LISTING 6.11: FixedFieldCount1.sh***\n\n```\n echo \"=> pairs of letters:\"\n\
  echo \"aa bb cc dd ee ff gg hh\"\necho\n\necho \"=> split on multiple lines:\"\n\
  echo \"aa bb cc dd ee ff gg hh\"| awk '\nBEGIN { colCount = 3 }\n{\n  for(i=1; i<=NF;\
  \ i++) {\n     printf(\"%s \", $i)\n     if(i % colCount == 0) { print \"\" }\n\
  \  }\n  print \"\"\n}\n'\n```\n\nListing 6.11 显示了一个字符串的内容，然后将该字符串作为 `awk` 命令的输入。Listing\
  \ 6.11 的主体部分是一个从 1 迭代到 `NF` 的循环，其中 `NF` 是输入行中的字段数，在本例中，它等于 8。每个字段的值由 `$i` 表示：`$1`\
  \ 是第一个字段，`$2` 是第二个字段，依此类推。注意 `$0` 是整个输入行的内容（在下一个代码示例中使用）。\n\n接下来，如果 `i` 的值（即字段的位置，而不是字段的内容）是\
  \ 3 的倍数，则代码将打印换行符。运行 Listing 6.11 中的代码，你将看到以下输出：\n\n```\n => pairs of letters:\n\
  aa bb cc dd ee ff gg hh\n\n=> split on multiple lines:\naa bb cc\ndd ee ff\ngg hh\n\
  ```\n\nListing 6.12 显示了 `employees.txt` 的内容，Listing 6.13 显示了 `FixedFieldCount2.sh`\
  \ 的内容，说明了如何确保所有行具有相同的列数。\n\n***LISTING 6.12: employees.txt***\n\n```\n jane:jones:SF:\n\
  john:smith:LA:\ndave:smith:NY:\nsara:white:CHI:\n```\n\n***LISTING 6.13: FixedFieldCount2.sh***\n\
  \n```\n cat employees.txt | awk -F\":\" '{printf(\"%s\", $0)} | awk -F':' '\nBEGIN\
  \ { colCount = 3 }\n{\n  for(i=1; i<=NF; i++) {\n     printf(\"%s\", $i)\n     if(i\
  \ % colCount == 0) { print \"\" }\n  }\n  print \"\"\n}\n'\n```\n\n注意 Listing 6.13\
  \ 中的代码与 Listing 6.11 中的代码几乎相同。图中显示的代码从 `employees.txt` 的内容中删除了 `\\n` 字符。如果你需要，请运行以下代码片段：\n\
  \n```\n cat employees.txt | awk -F\":\" '{printf(\"%s\", $0)}\n```\n\n之前的代码输出如下：\n\
  \n```\n jane:jones:SF:\njohn:smith:LA:\ndave:smith:NY:\nsara:white:CHI:\n```\n\n\
  我们现在将 Listing 6.9 中的任务简化到与 Listing 6.7 相同，这就是为什么我们有相同的 `awk` 代码块的原因。\n\n## 转换电话号码\n\
