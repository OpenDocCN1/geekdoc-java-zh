  10  shirt   xsmall\n11  shirt   xsmall\n\nshirts after:\n     type  size\n0   shirt\
  \     4\n1   shirt     4\n2   shirt     4\n3   shirt     4\n4   shirt     4\n5 \
  \  shirt     3\n6   shirt     2\n7   shirt     1\n8   shirt     1\n9   shirt   \
  \  1\n10  shirt     1\n11  shirt     1\n```\n\n### 在 PANDAS 中合并与拆分列\n\n列表 3.10 显示了\
  \ `employees.csv` 的内容，列表 3.11 显示了 `emp_merge_split.py` 的内容，它展示了如何合并和拆分 CSV 文件的列。\n\
  \n***列表 3.10: employees.csv***\n\n```\n name,year,month\nJane-Smith,2015,Aug\nDave-Smith,2020,Jan\n\
  Jane-Jones,2018,Dec\nJane-Stone,2017,Feb\nDave-Stone,2014,Apr\nMark-Aster,,Oct\n\
  Jane-Jones,NaN,Jun\n```\n\n***列表 3.11: emp_merge_split.py***\n\n```\n import pandas\
  \ as pd\n\nemps = pd.read_csv(\"employees.csv\")\nprint(\"emps:\")\nprint(emps)\n\
  print()\n\nemps['year']  = emps['year'].astype(str)\nemps['month'] = emps['month'].astype(str)\n\
  # separate column for first name and for last name:\nemps['fname'],emps['lname']\
  \ = emps['name'].str.split(\"-\",1).str\n\n# concatenate year and month with a \"\
  #\" symbol:\nemps['hdate1'] = emps['year'].astype(str)+\"#\"+emps['month'].astype(str)\n\
  \n# concatenate year and month with a \"-\" symbol:\nemps['hdate2'] = emps[['year','month']].agg('-'.join,\
  \ axis=1)\n\nprint(emps)\nprint()\n```\n\n列表 3.11 使用 CSV 文件 `employees.csv` 的内容初始化帧\
  \ `df`，然后显示数据帧的内容。接的一对代码段调用 `astype()` 方法将 `year` 和 `month` 列的内容转换为字符串。\n\n列表 3.11\
  \ 中的下一段代码使用 `split()` 方法，将 `name` 列拆分为 `fname` 和 `lname` 列，这两个列分别包含每位员工名字的姓和名：\n\
  \n```\n emps['fname'],emps['lname'] = emps['name'].str.split(\"-\",1).str\n```\n\
  \n接下来的代码段将 `year` 和 `month` 字符串的内容用“#”字符连接，创建一个名为 `hdate1` 的新列，所示：\n\n```\n emps['hdate1']\
  \ = emps['year'].astype(str)+\"#\"+emps['month'].astype(str)\n```\n\n最后一段代码段将 `year`\
  \ 和 `month` 字符串的内容用\"-\"连接，创建一个名为 `hdate2` 的新列，所示：\n\n```\n emps['hdate2'] = emps[['year','month']].agg('-'.join,\
  \ axis=1)\n```\n\n运行列表 3.11 中的代码，您将看到以下输出：\n\n```\n emps:\n         name    year\
