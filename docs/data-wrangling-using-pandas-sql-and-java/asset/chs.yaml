  \   3.0\nlower cutoff: -26.262252939417976\nupper cutoff: 50.26225293941798\nIdentified\
  \ outliers: 0\noutliers: []\n```\n\n### 使用 PANDAS 寻找离群值\n\n虽然我们在第三章中讨论了 Pandas，但本节的代码仅涉及非常简单的\
  \ Pandas 数据框、`mean()` 方法和 `std()` 方法。\n\nListing 2.3 显示了 `pandas_outliers1.py` 的内容，说明了如何使用\
  \ Pandas 在数字数组中寻找离群值。\n\n列表 2.3: pandas_outliers1.py\n\n```python\n import pandas\
  \ as pd\n\ndf = pd.DataFrame([2,5,7,9,9,40])\ndf.columns = [\"data\"]\n\ndata_mean\
