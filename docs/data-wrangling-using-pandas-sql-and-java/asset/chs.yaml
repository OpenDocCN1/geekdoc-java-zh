  \n如果发生匹配，则 `count` 的值加 1。`END` 块报告了第 2、5、7 列中找到字符串 past 的次数。注意，诸如 paste 和 pasted\
  \ 等字符串也会匹配字符串 past。Listing A.25 的输出如下：\n\n```\n List of files: data1.csv data2.csv\n\
