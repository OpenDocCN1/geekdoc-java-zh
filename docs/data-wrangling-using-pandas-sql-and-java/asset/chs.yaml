  ```\n\n运行 `Listing 5.8` 中的代码，你将看到以下输出：\n\n```\n {\"fname\": \"Jane\", \"lname\"\
  : \"Jones\"}\n{\"fname\": \"Dave\", \"lname\": \"Smith\"}\n{\"fname\": \"Jack\"\
  , \"lname\": \"Stone\"}\n```\n\n## 与 XML、MYSQL 和 JAVA 交互\n\n在数据库中处理 XML 有多种方法，此处列出了其中一些方法（本章仅探讨了第一种方案）：\n\
  \n*   将 XML 读取为字符串并通过 SAX 或 DOM 进行解析。\n*   使用 `CLOB` 数据类型处理 XML 文档。\n*   使用 `JAXB`（Java\
  \ 和 XML 绑定）。\n*   使用 `ORM`（对象关系映射）。\n*   使用原生 XML 数据库。\n\n本章的后续部分包含 Java 代码示例，这些示例从存储为文件的\
  \ XML 文档内容创建字符串，然后将这些字符串插入 MySQL 表的字符列中。另一个 Java 代码示例检索每个基于 XML 的字符串，然后解析这些字符串以创建\
  \ XML 文档。\n\n通常情况下，涉及 MySQL、XML 文档和 Java 的典型操作如下：\n\n*   将 XML 文档插入 MySQL 表\n* \
  \  在 MySQL 表中读取 XML 文档\n*   从 MySQL 表中删除 XML 文档\n*   在 MySQL 表中更新 XML 文档\n\n然而，Java\
  \ 前述的 CRUD 操作需要对文档对象模型（`DOM`）有更深入的理解，这是一个基于树的结构，包含了 XML 文档中的所有数据（和元数据）。类比，每你在浏览器会话中导航到一个\
  \ HTML 页面时，该 HTML 页的内容在内存中也被表示为 `DOM` 结构。如果你真的想深入研究 `DOM` 结构的细节，可以在线上搜索更多信息。\n\n\
  ### 什么是 XML？\n\n简单来说，基于 XML 的数据由角括号内的文本组成，这些文本指定了标签名称。这是一个简单的示例：\n\n```\n <fname>Dave</fname>\n\
  ```\n\n以下代码段展示了如何指定一个包含多个标签的 XML 标签（缩进是可选的，便于阅读）：\n\n```\n <person>\n  <fname>Dave</fname>\n\
  \  <fname>Smith</fname>\n</person>\n```\n\n尽管你可以指定任意深度的嵌套 XML 标签，但本章中的 XML 文档仅嵌套了一层。事实上，`Listing\
  \ 5.9` 显示了 XML 文档 `friends.xml` 的内容。\n\n**列表 5.9：friends.xml**\n\n```\n <?xml version=\"\
  1.0\"?>\n<friends>\n  <friend>\n    <fname>Jane</fname>\n    <lname>Jones</lname>\n\
  \    <height>170</height>\n  </friend>\n  <friend>\n    <fname>Dave</fname>\n  \
  \  <lname>Smith</lname>\n    <height>160</height>\n  </friend>\n  <friend>\n   \
  \ <fname>Jack</fname>\n    <lname>Stone</lname>\n    <height>180</height>\n  </friend>\n\
  </friends>\n```\n\n需要记住的一点是，XML 将一切都视为文本，这意味着 XML 是一种文本标记语言，而 JSON（后文讨论）是一种数据格式。尽管\
  \ XML 的内容涉及标签，但 XML 的一个优势是存在 XML Schema 用于验证文档，这将在下一节简要介绍。\n\n### 什么是 XML Schema？\n\
  \nXML Schema 是一个指定 XML 结构的基于 XML 的文档。例如，让我们创建一个 XML Schema，约束“friend”文档具有以下结构：\n\
  \n*   一个名字 (`fname` 标签)\n*   零或多个中间名 (`mname` 标签)\n*   一个姓 (`lname` 标签)\n*   一个高度\
  \ (`height` 标签)\n\n如你所见，以下 XML 片段符合上述结构（一个名字、零中间名、一个姓、一个高度）：\n\n```\n <friend>\n\
  \  <fname>Jane</fname>\n  <lname>Jones</lname>\n  <height>170</height>\n</friend>\n\
  ```\n\n以下 XML 片段符合之前的结构（一个名字、两个中间名、一个姓、一个高度）：\n\n```\n <friend>\n  <fname>Billy</fname>\n\
  \  <mname>Bob</mname>\n  <mname>James</mname>\n  <lname>Callaway</lname>\n  <height>170</height>\n\
  </friend>\n```\n\n然而，以下 XML 片段不符合之前的结构，因为存在**粗体显示**的标签：\n\n```\n <friend>\n  <title>Mr</title>\n\
  \  <fname>Billy</fname>\n  <lname>Callaway</lname>\n  <height>170</height>\n</friend>\n\
  ```\n\n### XML Schema 在什么情况下有用？\n\n在需要在应用程序之间传输字符字符串的情况下，XML Schema 非常有价值。例如，一个跟踪租赁设备的应用程序可能包含非常复杂的依赖关系，在\
  \ Web 应用程序中使用 JavaScript 执行这些操作会非常繁琐。然而，一种解决方案是通过拼接 Web 上的所有字段来构造字符串，然后将该字符串传递给将其转换为\
  \ XML 文档的应用程序。\n\n下一步是验证动态构造的 XML 文档是否符合 XML Schema，之后可以将 XML 文档发送到另一个应用程序进行额外的处理步骤。如有必要，可以创建一个多次执行上述序列的执行流水线。如果在验证步骤期间发生错误，则可以分析该步骤中的\
  \ XML 文档以找到错误原因，然后解决错误。\n\n\n\n\n\nXML 文档可能非常巨大，其相关的 XML Schema（架构）可能具有非常复杂的结构。例如，XBRL\
  \ 定义了一个用于业务报告文档的 XML 架构。此外，XML 是一个广广泛的话题，有整本书专门讲解 XML。如果你想熟悉 XML 丰富的功能，可以进行在线搜索。\n\
  \n现在你已经对 XML 有了初步了解，让我们来看看如何创建一个 MySQL 表来存储 XML 数据，这将在下一节中进行解释。\n\n## 在 Java 中创建用于\
  \ XML 数据的 MySQL 表\n\n本节包含一个 Java 代码示例，用于创建一个包含基于 XML 数据的 MySQL 表。MySQL 表中也可以指定 XML\
  \ 数据类型；但本节中的数据库表使用了你在之前章节的 SQL 语句中过的属性。\n\nListing 5.10 显示了 `CreateTableForXMLData.java`\
  \ 的内容，该程序创建一个填充来自 XML 文档数据的 MySQL 表。\n\n### 列表 5.10: CreateTableForXMLData.java\n\
