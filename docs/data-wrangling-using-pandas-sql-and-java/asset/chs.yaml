  df.sort_values(by='one', ascending=False)\n```\n\n查看前几行：\n\n```python\ndf.head(2)\n\
  ```\n\n查看最后几行：\n\n```python\ndf.tail(2)\n```\n\n查看数据框概览：\n\n```python\ndf.info()\n\
