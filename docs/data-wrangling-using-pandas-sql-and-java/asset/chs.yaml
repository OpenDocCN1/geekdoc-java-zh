  \    curr_code = start_code\n    column_count = len(line)\n    for i in range(2,column_count):\n\
  \      city_code1 = str(code) + \"_\" +\n                   str(curr_code) + \"\
  _\" + str(line[i])\n\n      city_code2 = str(code) + \",\" +\n                 \
  \  str(curr_code) + \",\" + str(line[i])\n      print(\"=> constructed city_code1:\"\
  ,city_code1)\n\n      # 根据城市代码生成 SQL 语句：\n      sql_stmt = 'INSERT INTO city_codes\
  \ VALUES ('\n      sql_stmt += str(code)+','+str(curr_code)+',\"'+line[i]+'\");\\\
  n'\n\n      # 将 SQL 语句写入 SQL 文件：\n      sql_writer3.write(sql_stmt)\n\n      # 将城市代码写入\
  \ CSV 文件：\n      txt_writer1.write(city_code1+\"\\n\")\n      #curr_code += incr_code\n\
