  line\n```\n\n### 对齐数据集中的列\n\n如果你已经阅读了前面的两个示例，那么本节中的代码示例很容易理解：你将看到内容正确的数据列，但它们被放置在不同的行中（因此未对齐）。Listing\
  \ A.29 显示了带有未对齐值的 `mixed-data.csv`。此外，Listing A.28 中的第一行和最后一行是空行，它们将被本节的 shell 脚本移除。\n\
  \n### 代码列表 A.29: mixed-data.csv\n\n```\n Sara, Jones, 1000, CA, Sally, Smith, 2000,\
  \ IL,\nDave, Jones, 3000, FL, John, Jones,\n4000, CA,\nDave, Jones, 5000, NY, Mike,\n\
  Jones, 6000, NY, Tony, Jones, 7000\n```\n\nListing A.30 显示了 `mixed-data.sh` 的内容，说明了如何对齐\
  \ Listing A.29 中的数据集。\n\n### 代码列表 A.30: mixed-data.sh\n\n```\n #-------------------------\n\
  # 1) 删除空行\n# 2) 删除换行符\n# 3) 每 8 个字段后打印一个 LF\n# 4) 删除每行末尾的逗号\n#-------------------------\n\
  inputfile=\"mixed-data.csv\"\n\ngrep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"\
  %s\",$0)} | awk '\nBEGIN { columnCount = 4 }\n{\n   for(i=1; i<=NF; i++) {\n   \
  \  printf(\"%s \", $i)\n     if( i % columnCount == 0) { ++currRow }\n     if(currRow\
  \ > 0 && currRow % rowCount == 0) {currRow = 0; print \"\"}\n   }\n}' > temp-columns\n\
  \n# 4) 删除输出末尾的逗号:\ncat temp-columns | sed 's/, $//' | sed 's/ $//' > $output\n```\n\
  \nListing A.30 首先使用 `grep` 命令（关于 `grep` 有在线教程）删除空行，然后使用 `awk` 命令将数据集的行转换为单行文本。第二个\
  \ `awk` 命令在 `BEGIN` 块中将 `columnCount` 变量初始化为 `4`，随后是一个遍历输入字段的循环。在同一行输出四个字段后，会打印一个换行符，其效果是将输入数据集对齐为由四列组成的数据集。Listing\
  \ A.30 的输出如下：\n\n```\n Sara, Jones, 1000, CA\nSally, Smith, 2000, IL\nDave, Jones,\
  \ 3000, FL\nJohn, Jones, 4000, CA\nDave, Jones, 5000, NY\nMike, Jones, 6000, NY\n\
  Tony, Jones, 7000\n```\n\n### 对齐数据集中的列和多行\n\n前面的部分展示了如何重新对齐数据集使每行包含相同数量的列并代表单条记录。本节的代码示例说明了如何对齐内容正确的列，并在新数据集的每行放置两条记录。Listing\
  \ A.31 显示了带有未对齐值的 `mixed-data2.csv`，随后 Listing A.32 显示了格式正确的 `aligned-data2.csv`\
  \ 内容。\n\n### 代码列表 A.31: mixed-data2.csv\n\n```\n Sara, Jones, 1000, CA, Sally, Smith,\
  \ 2000, IL,\nDave, Jones, 3000, FL, John, Jones,\n4000, CA,\nDave, Jones, 5000,\
  \ NY, Mike,\nJones, 6000, NY, Tony, Jones, 7000, WA\n```\n\n### 代码列表 A.32: aligned-data2.csv\n\
  \n```\n Sara, Jones, 1000, CA, Sally, Smith, 2000, IL\nDave, Jones, 3000, FL, John,\
  \ Jones, 4000, CA\nDave, Jones, 5000, NY, Mike, Jones, 6000, NY\nTony, Jones, 7000,\
  \ WA\n```\n\nListing A.33 显示了 `mixed-data2.sh` 的内容，说明了如何对齐 Listing A.31 中的数据集。\n\
  \n### 代码列表 A.33: mixed-data2.sh\n\n```\n #-----------------------------------------\n\
  # 1) 删除空行\n# 2) 删除换行符\n# 3) 每 8 个字段后打印一个 LF\n# 4) 删除每行末尾的逗号\n#-----------------------------------------\n\
  inputfile=\"mixed-data2.txt\"\noutputfile=\"aligned-data2.txt\"\n\ngrep -v \"^$\"\
  \ $inputfile |awk -F\",\" '{printf(\"%s\",$0)}' | awk '\nBEGIN { columnCount = 4;\
  \ rowCount = 2; currRow = 0 }\n{\n   for(i=1; i<=NF; i++) {\n     printf(\"%s \"\
  , $i)\n     if( i % columnCount == 0) { ++currRow }\n     if(currRow > 0 && currRow\
  \ % rowCount == 0) {currRow = 0; print \"\"}\n   }\n}' > temp-columns\n\n# 4) 删除输出末尾的逗号:\n\
  cat temp-columns | sed 's/, $//' | sed 's/ $//' > $output\n```\n\n\n\n\nListing\
  \ A.33 与 Listing A.30 非常相似。其核心思想是在处理完一对“正常”记录后打印一个换行符，这是通过 Listing A.33 中**加粗显示**的代码实现的。\n\
  \n现在，你可以通过将 `rowCount` 变量的初始值更改为任何正整数，非常轻松地扩展 Listing A.33 的泛性，且代码在不进行任何进一步修改的情况下即可运行。例如，如果你将\
  \ `rowCount` 初始化为值 5，那么新数据集中的每一行（最后一行输出行可能可能除外）都将包含 5 条“正常”数据记录。\n\n### 从文本文件中删除列\n\
  \nListing A.34 显示了 `VariableColumns.txt` 的内容，其中文本行包含不同数量的列。\n\nLISTING A.34: VariableColumns.txt\n\
  ```\n this is line one\nthis is line number one\nthis is the third and final line\n\
  ```\n\nListing A.35 显示了 `RemoveColumn.sh` 的内容，该脚本从文本文件中删除第一列。\n\nLISTING A.35: RemoveColumn.sh\n\
  ```\n awk '{ for (i=2; i<=NF; i++) printf \"%s \", $i; printf \"\\n\"; }' VariableColumns.txt\n\
  ```\n\n循环位于 2 和 `NF` 之间，遍历除第一个字段外的所有此外，`printf` 显式地添加了换行。上述代码段的输出如下：\n\n```\n is\
  \ line one\nis line number one\nis the third and final line\n```\n\n### 数据集中对齐行的子集\n\
  \nListing A.35 展示了如何对数据集的行进行对齐，本部分的代码示例说明了如何提取现有列的子集和行的子集。Listing A.36 显示了目标数据集\
  \ `sub-rows-cols.txt` 的内容，该文件包含 `aligned-data.txt` 中每个偶数行的两列。\n\nLISTING A.36: sub-rows-cols.txt\n\
  ```\n Sara, 1000\nDave, 3000\nDave, 5000\nTony, 7000\n```\n\nListing A.37 显示了 `sub-rows-cols.sh`\
  \ 的内容，说明了如何生成 Listing A.36 中的数据集。大部分代码与 Listing A.33 相同，新代码已**加粗显示**。\n\nLISTING\
  \ A.37: sub-rows-cols.sh\n```\n #-----------------------------------------\n# 1)\
  \ 删除空行\n# 2) 删除换行符\n# 3) 在每四个字段后打印一个 LF\n# 4) 删除每行的末尾逗号\n#-----------------------------------------\n\
  \ninputfile=\"mixed-data.txt\"\n\ngrep -v \"^$\" $inputfile |awk -F\",\" '{printf(\"\
  %s\",$0)}' | awk '\nBEGIN { columnCount = 4 }\n{\n   for(i=1; i<=NF; i++) {\n  \
  \   printf(\"%s \", $i)\n     if( i % columnCount  == 0) { print \"\" }\n   }\n\
  }' > temp-columns\n\n# 4) 删除输出末尾的逗号：\ncat temp-columns | sed 's/, $//' | sed 's/$//'\
  \ > temp-columns2\n\ncat temp-columns2 | awk '\nBEGIN { rowCount = 2; currRow =\
  \ 0 }\n{\n   if(currRow % rowCount == 0) { print $1, $3 }\n   ++currRow\n}' > temp-columns3\n\
  \ncat temp-columns3 | sed 's/,$//' | sed 's/ $//' > $outputfile\n```\n\nListing\
  \ A.37 包含一个新的代码块，将步骤 #4 的输出重定向到临时文件 `temp-columns2`，其内容由 Listing A.37 最后部分的另一个 `awk`\
  \ 命令处理。请注意，该 `awk` 命令包含一个 `BEGIN` 块，将变量 `rowCount` 和 `currRow` 分别初始化为 2 和 0。\n\n\
  主块在当前行号为偶数时打印当前行的第 1 列和第 3 列，然后增加 `currRow` 的值。该 `awk` 命令的输出重定向到另一个临时文件，作为最后一个代码片段的输入，该片段使用\
  \ `cat` 命令和两次 `sed` 命令来删除末尾的“，”和末尾的空格，如下：\n\n```\n cat temp-columns3 | sed 's/,$//'\
  \ | sed 's/ $//' > $outputfile\n```\n\n还有其他方法可以实现 Listing A.37 中的功能，主要目的是展示组合各种\
  \ bash 命令的技术。\n\n### 数据集中词频统计\n\nListing A.38 显示了 `WordCounts1.sh` 的内容，说明了如何统计文件中单词的频率。\n\
  \nLISTING A.38: WordCounts1.sh\n```\n awk '\n# 打印单词频率\n{\n    for (i = 1; i <= NF;\
  \ i++)\n        freq[$i]++\n}\nEND {\n    for (word in freq)\n        printf \"\
  %s\\t%d\", word, freq[word]\n}\n' columns2.txt\n```\n\nListing A.38 包含一段处理 `columns2.txt`\
  \ 行代码。每遇到一个单词（一行），代码就会增加该单词在哈表 `freq` 中的出现次数。`END` 块包含一个 `for` 循环，显示 `columns2.txt`\
  \ 中每个单词的次数。\n\nListing A.38 的输出如下：\n\n```\n two        3\none        3\nthree  \
  \    3\nsix        1\nfive       2\n```\n\nListing A.39 显示了 `WordCounts2.sh` 的内容，执行不区分大小写的单词统计。\n\
  \nLISTING A.39: WordCounts2.sh\n```\n awk '\n{\n    # 将全部转为小写\n    $0 = tolower($0)\n\
  \n    # 删除标点符号\n   gsub(/[^alnum:][:space:]]/, \"\", $0)\n\n    for(i=1; i<=NF;\
  \ i++) {\n       freq[$i]++\n    }\n}\nEND {\n    for(word in freq) {\n       printf\
  \ \"%s\\t%d\", word, freq[word]\n    }\n}\n' columns4.txt\n```\n\nListing A.39 的代码与\
  \ Listing A.38 几乎相同，增加了以下将每行输入转换为小字母的代码段：\n\n```\n $0 = tolower($0)\n```\n\nListing\
  \ A.40 显示了 `columns.txt` 的内容。\n\nLISTING A.40: columns.txt\n```\n 123 ONE TWO\n\
  456 three four\nONE TWO FOUR\nfive 123 six\none two three\nfour five\n```\n\n运行\
  \ Listing A.39 使用 `columns.txt` 的输出如下：\n\n```\n 456\t1\ntwo\t3\none\t3\nthree\t\
  3\nsix\t1\nfive\t2\n```\n\n### 在数据集中仅显示“纯”单词\n\n为了简单起见，让我们使用文本字符串，这样我们可以在得到解决方案的过程中查看中间结果。Listing\
  \ A.41 显示了 `onlywords.sh` 的内容，它包含了三个 `awk` 命令，分别显示文本字符串中的单词、整数和字母字符串。\n\nLISTING\
  \ A.41: onlywords.sh\n```\n x=\"ghi abc Ghi 123 #def5 123z\"\n\necho \"Only words:\"\
  \necho $x |tr -s ' '\\n' | awk -F\" \"\n{\n  if($0 ~ /^[a-zA-Z]+$/) { print $0 }\n\
  }\n' | sort | uniq\n\necho \"Only integers:\"\necho $x |tr -s ' '\\n' | awk -F\"\
  \ \"\n{\n  if($0 ~ /^[0-9]+$/) { print $0 }\n}\n' | sort | uniq\n\necho \"Only alphanumeric\
  \ words:\"\necho $x |tr -s ' '\\n' | awk -F\" \"\n{\n  if($0 ~ /^[0-9a-zA-Z]+$/)\
  \ { print $0 }\n}\n' | sort | uniq\n```\n\nListing A.41 初始化变量 `x`：\n\n```\n x=\"\
  ghi abc Ghi 123 #def5 123z\"\n```\n\n下一步是将 `x` 拆分为单词：\n\n```\n echo $x |tr -s '\
  \ ' '\\n'\n```\n\n输出如下：\n\n```\n ghi\nabc\nGhi\n123\n#def5\n123z\n```\n\n第三步是调用\
  \ `awk` 并检查匹配正则表达式 `^[a-zA-Z]+` 的单词，该正则匹配任何由一个或多个大写/小写字母组成的字符串（不包含其他任何字符）：\n\n```\n\
  \ if($0 ~ /^[a-zA-Z]+$/) { print $0 }\n```\n\n输出如下：\n\n```\n ghi\nabc\nGhi\n```\n\
  \n最后，如果你也想对输出进行排序并只打印唯一的单词，可以将 `awk` 命令的输出重定向到 `sort` 命令和 `uniq` 命令。\n\n第二个 `awk`\
  \ 命令使用正则表达式 `^[0-9]+` 来检查整数，第三个 `awk` 命令使用正则表达式 `^[0-9a-zA-Z]+` 来检查字母数字单词。\n\n\n\
  \n\n\n```\n Only words:\nGhi\nabc\nghi\n\nOnly integers:\n123\n\nOnly alphanumeric\
  \ words:\n123\n123z\nGhi\nabc\nghi\n```\n\n你可以将变量 `x` 替换为数据集，以便从该数据集中检索纯字母字符串。\n\
  \n## 在 AWK 中处理多行记录\n\nListing A.42 显示了 `employee.txt` 的内容，Listing A.43 显示了 `Employees.sh`\
  \ 内容，展示了如何合并文件中的文本行。\n\n### 列表 A.42: employees.txt\n\n```\n Name:  Jane Edwards\n\
  EmpId: 12345\nAddress: 123 Main Street Chicago Illinois\n\nName:  John Smith\nEmpId:\
  \ 23456\nAddress: 432 Lombard Avenue SF California\n```\n\n### 列表 A.43: employees.sh\n\
  \n```\n inputfile=\"employees.txt\"\noutputfile=\"employees2.txt\"\n\nawk '\n{\n\
  \  if($0 ~ /^Name:/) {\n    x = substr($0,8) \",\"\n    next\n  }\n\n  if( $0 ~\
  \ /^Empid:/) {\n   #skip the Empid data row\n   #x = x substr($0,7) \",\"\n    next\n\
  \  }\n\n  if($0 ~ /^Address:/) {\n    x = x substr($0,9)\n    print x\n  }\n}\n\
  ' < $inputfile > $outputfile\n```\n\n运行 Listing A.43 中的代码后的输出如下：\n\n```\n Jane Edwards,\
  \ 123 Main Street Chicago Illinois\nJohn Smith, 432 Lombard Avenue SF California\n\
  ```\n\n现在，你已经看到了大量的 awk 代码片段和包含 `awk` 命令的 shell 脚本，这些内容展示了可以在文件和数据集上执行的各种任务，你已经准备好学习一些用例了。下一节（第一个用例）将向你如何将多个字段分隔符替换为单个分隔符，第二个用例将向你如何处理日期字符串。\n\
  \n### 一个简单的用例\n\n本节中的代码示例向你展示了如何使用 `awk` 命令分割数据集行中的逗号分隔字段，其中字段可以包含任意深度的嵌套引号。\n\n\
  Listing A.44 显示了文件 `quotes3.csv` 的内容，该文件包含一个“，”分隔符和多个带引号字段。\n\n### 列表 A.44: quotes3.csv\n\
  \n```\n field5,field4,field3,\"field2,foo,bar\",field1,field6,field7,\"fieldZ\"\n\
  fname1,\"fname2,other,stuff\",fname3,\"fname4,foo,bar\",fname5\n\"lname1,a,b\",\"\
  lname2,c,d\",\"lname3,e,f\",\"lname4,foo,bar\",lname5\n```\n\nListing A.45 显示了文件\
  \ `delim1.sh` 的内容，它展示了如何将 `delim1.csv` 中的分隔符替换为“，”字符。\n\n### 列表 A.45 delim1.sh\n\
  \n```\n # #inputfile=\"quotes1.csv\"\n#inputfile=\"quotes2.csv\"\ninputfile=\"quotes3.csv\"\
  \ngrep -v \"^$\" $inputfile |  awk '\n{\n   print \"LINE #\" NR \": \" $0\n   printf\
  \ (\"-------------------------\\n\")\n   for (i = 0; ++i <= NF;)\n     printf \"\
  field #%d : %s\\n\", i, $i\n   printf (\"\\n\")\n}' FPAT='([^,]+)|(\"[^\"]+\")'\
  \ < $inputfile\n```\n\n运行 Listing A.44 中的 shell 脚本后的输出如下：\n\n```\n LINE #1: field5,field4,field3,\"\
  field2,foo,bar\",field1,field6,field7,\n\"fieldZ\"\n-------------------------\n\
  field #1 : field5\nfield #2 : field4\nfield #3 : field3\nfield #4 : \"field2,foo,bar\"\
  \nfield #5 : field1\nfield #6 : field6\nfield #7 : field7\nfield #8 : \"fieldZ\"\
  \n\nLINE #2: fname1,\"fname2,other,stuff\",fname3,\"fname4,foo,bar\",fname5\n-------------------------\n\
  field #1 : fname1\nfield #2 : \"fname2,other,stuff\"\nfield #3 : fname3\nfield #4\
  \ : \"fname4,foo,bar\"\nfield #5 : fname5\n\nLINE #3: \"lname1,a,b\",\"lname2,c,d\"\
  ,\"lname3,e,f\",\"lname4,foo,bar\",lname5\n-------------------------\nfield #1 :\
  \ \"lname1,a,b\"\nfield #2 : \"lname2,c,d\"\nfield #3 : \"lname3,e,f\"\nfield #4\
  \ : \"lname4,foo,bar\"\nfield #5 : lname5\n\nLINE #4: \"Outer1 \"Inner \"Inner \"\
  Inner C\" B\" A\" Outer1\",\"XYZ1,c,d\",\"XYZ2lname3,e,f\"\n-------------------------\n\
  field #1 : \"Outer1 \"Inner \"Inner \"Inner C\" B\" A\" Outer1\"\nfield #2 : \"\
  XYZ1,c,d\"\nfield #3 : \"XYZ2lname3,e,f\"\n\nLINE #5:\n-------------------------\n\
  ```\n\n你可以看到，本节中的任务可以通过 `awk` 命令轻松解决。\n\n### 另一个用例\n\n本节中的代码示例向你展示了如何使用 `awk` 命令重新格式化数据集中的日期字段并更改新集中字段的顺序。例如，给定原始数据集中的输入：\n\
  \n```\n Jane,Smith,20140805234658\n```\n\n输出集中重新格式化的行格式如下：\n\n```\n 2014-08-05 23:46:58,Jane,Smith\n\
  ```\n\nListing A.46 显示了文件 `dates.csv` 的内容，它包含一个“，”分隔符三个字段。\n\n### 列表 A.46 dates.csv\n\
  \n```\n Jane,Smith,20140805234658\nJack,Jones,20170805234652\nDave,Stone,20160805234655\n\
  John,Smith,20130805234646\nJean,Davis,20140805234649\nThad,Smith,20150805234637\n\
  Jack,Pruit,20160805234638\n```\n\nListing A.47 显示了 `stringdate2.sh` 的内容，它将日期转换为新格式并将其移动到第一个字段。\n\
  \n### 列表 A.47: stringdate2.sh\n\n```\n inputfile=\"dates2.csv\"\noutputfile=\"formatteddates2.csv\"\
  \n\nrm -f $outputfile; touch $outputfile\n\nfor line in 'cat $inputfile'\ndo\n \
  \ fname='echo $line | cut -d\",\" -f1'\n  lname='echo $line | cut -d\",\" -f2'\n\
  \  date1='echo $line | cut -d\",\" -f3'\n\n  # convert to new date\n  newdate='echo\
  \ $date1 | awk '{ print substr($0,1,4)\"-\"substr($0,5,2)\"-\"substr($0,7,2)\" \"\
  substr($0,9,2)\":\"substr($0,11,2)\":\"substr($0,13,2)}''\n\n  # append newly formatted\
  \ row to output\n  echo \"${newdate},${fname},${lname}\" >> $outputfile\ndone\n\
  ```\n\n新数据集的内容为：\n\n```\n 2014-08-05 23:46:58,Jane,Smith\n2017-08-05 23:46:52,Jack,Jones\n\
  2016-08-05 23:46:55,Dave,Stone\n2013-08-05 23:46:46,John,Smith\n2014-08-05 23:46:49,Jean,Davis\n\
  2015-08-05 23:46:37,Thad,Smith\n2016-08-05 23:46:38,Jack,Pruit\n```\n\n### 总结\n\n\
  本附录介绍了 `awk` 命令，它本质上是将整个编程语言封装进单个 Unix 命令中。\n\n我们探索了 `awk` 中的一些内置变量以及条件逻辑、`while`\
  \ 循环和 `for` 循环，以便操作数据集中的行和列。然后你看到了如何删除数据集中的行并合并行，以及如何将文件内容作为单行文本。\n\n接下来，你学习了如何在\
  \ `awk` 命令中使用元字符和字符集。你学习了如何在包含数字数据的文件中执行数值计算（如加、减、乘、除），以及 `awk` 中可用的一些数值函数。\n\n\
  此外，你还看到了如何对齐数据集中的列、删除列、从数据集中选择子集并处理数据集中的多行记录。最后，你看到了涉及结构化数据集中嵌套引号和日期格式的简单用例。\n\n\
