  \n本节是可选的，因为代码涉及 `sklearn.covariance` 中的 `EllipticEnvelope` 类，而我们在书中并未介绍该类。然而，阅读这些代码并将其与之前的寻找离群值代码示例进行对比仍然是有值的。\n\
