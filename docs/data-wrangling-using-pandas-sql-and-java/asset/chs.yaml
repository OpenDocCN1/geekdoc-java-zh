  n\", i, subtotals[i])\n  total += subtotals[i]\n}\n```\n\n在前面的代码执行完成后，输出被重定向到 CSV\
  \ 文件 `mark5.csv`。\n\n启动列表 6.27 生成一组中间文件和一个名为 `mark5.csv` 的最终文件。如果你想查看列表 6.27 生成的\
  \ `mark1.csv` 等中间文件的前五行，执行包含以下内容的 shell 脚本：\n\n```\n for f in 'ls mark*csv'\ndo\n\
  \  echo \"file: $f\"\n  head -5 $f\ndone\n```\n\n\n\n本章的第三部分介绍了一个项目，该项目涉及创建一个 CSV\
  \ 文件，其中包含乐队活动安排及其未来的音乐会演出计划。该项目模拟了一个包含多种格式文件的场景，例如 XML 文档、文本数据、CSV 文件以及 MySQL 数据库表中的数据。目标是转换这些文件并合并它们以创建一个单一的\
  \ CSV 文件。\n\n### 什么是数据清洗（DATA WRANGL）？\n\n`Data wrangling` 对不同的人有不同的含义。一些在线文章认为数据清洗涉及一系列步骤，而另一些文章则认为数据清洗涉及将数据集从一种格式转换为另一种格式。以下网页将数据清洗描述为一个六步骤的过程：\n\
  \n`https://en.wikipedia.org/wiki/Data_wrangling`\n\n除了上述链接中列出的步骤外，数据清洗还涉及以下任务（在第\
  \ 7 章的代码示例中执行）：\n\n*   将数据集从一种格式转换为另一种格式（`convert`）\n*   从现有数据集的列子集中创建新数据集（`extract`）\n\
  \n正如你看到的，前面的步骤区分了“将数据转换为不同格式”与“从多个数据提取数据以创建新数据集”。如果只执行第一步（即没有提取步骤），那么转换过程可以被视为数据清洗任务。\n\
  \n在上一章中，你学习了数据清洗，并学习了一系列基于 Python 的代码示例和 Unix Shell 脚本来执行数据清洗任务。相比之下，数据清洗涉及多个步骤，可以包括转换一个或多个文件。下面的小节提供了数据清洗与数据转换之间更详细的区分。\n\
  \n### 数据转换：这意味着什么？\n\n通常，数据清洗涉及单一数据源（不一定是 CSV 格式），对数据源的内容进行某种类型的修改（例如填充缺失值和更改日期格式），而不创建第二个数据源。\n\
  \n例如，假设数据源是一个名为 `employees` 的 MySQL 表，包含员工相关信息。在完成对 `employees` 表的数据清洗任务后，结果仍然命名为\
  \ `employees` 表。在数据库术语中，数据清洗类似于执行涉及单表 `SELECT` 的 SQL 语句。\n\n然而，如果两个 CSV 文件包含不同的日期格式，你需要根据日期列创建一个单一的\
  \ CSV 文件，那么将会存在某种转换过程，可以是以下之一：\n\n*   将第一种日期格式转换为第二天日期格式\n*   将第二种日期格式转换为第一种日期格式\n\
  *   将两种日期格式都转换为第三种日期格式\n\n在财务数据的情况下，你可能还会遇到不同的货币，这涉及一对货币之间的汇率。由于货币汇率会波动，你需要决定为数据使用何种汇率，该汇率可以是：\n\
  \n*   CSV 文件生成期间的汇率\n*   当前的货币汇率\n*   其他某种机制\n\n此外，你可能还需要将 CSV 文件转换为 XML 文档，其中后者可能需要符合\
  \ XML Schema，并且可能还需要符合 XBRL，这是业务报告目的的要求：\n\n`https://en.wikipedia.org/wiki/XBRL`\n\
  \n正如前面提到的，数据转换可以涉及两个或多个数据源，以创建另一个属性符合所需格式的另一个数据源。以下是仅使用两个数据源 A 和 B 进行数据转换的四种场景，其中来自\
  \ A 和 B 的数据合并以创建数据源 C，其中 A、B 和 C 可以具有不同的文件格式：\n\n*   A 中的所有属性和 B 中的所有属性\n*   A 中的所有属性和\
  \ B 中的所有属性\n*   A 中的属性子集和 B 中的所有属性\n*   A 中的属性子集和 B 中的属性子集\n\n在数据库术语中，数据转换类似于执行一个带有\
  \ `JOIN` 子句的涉及两个或多个数据库表 `SELECT` 的 SQL 语句。此类 SQL 语句通常涉及每个数据库表的列子集，这对应于选择数据源中特征的子集。\n\
  \n还存在涉及两个或多个数据源拼接的场景。如果所有数据源具有相同的属性，那么它们的拼接是简单易举的，但你可能需要检查重复值。例如，如果你想将多个 CSV 文件加载到不允许重复的数据库表中，那么一种解决方案是在命令行中合并\
  \ CSV 文件，然后排除重复行。\n\n上述的合并任务可以轻松完成。假设你有以下一组 CSV 文件（所有文件具有相同的属性）`emp1.csv`、`emp2.csv`\
  \ ... `emp100.csv`。通过创建一个名为 `concat.sh` 的 Shell 脚本来合并这些文件并排除重复行：\n\n```bash\nfor\
  \ f in `ls emp*csv`\ndo\n  cat $f\ndone\n```\n\n现在确保该 Shell 脚本是可执行的：\n\n```bash\n\
  chmod +x concat.sh\n```\n\n启动 Shell 脚本 `concat.sh`，将其输出重定向到 `sort` 命令，然后重定向到 `uniq`\
  \ 命令，最后将输出重定向到 CSV 文件 `all_emps.csv`：\n\n```bash\n./concat.sh | sort | uniq > all_emps.csv\n\
  ```\n\n此时，你可能可以将 CSV 文件 `all_emps.csv` 加载到 MySQL 表中，前提是该表不是另一个表的“子”表（且子表行上有有 `CONSTRAINT`\
  \ 约束）。例如，`customers` 表通常与 `purchase_orders` 表存在一对多的关系，这意味着如果 `customers` 表中没有关联的客户，则无法在在表中插入行。\n\
  \n如果有疑问，尝试将 CSV 文件加载到适当的表中。如果遇到任何错误，请进行必要的修正直到加载过程成功。\n\n这结束了关于数据清洗的第一部分的讨论，接几节包含数据清洗示例，之后将看到数据清洗示例。\n\
  \n### 包含多行记录的 CSV 文件\n\n本节向你如何处理跨行的 CSV 文件。\n\n列表 7.1 显示了 `multi_line.csv` 的内容，将被重新格式化，以便每个记录占据一行：一种方案使用\
  \ Pandas，另一种方案使用 `CSV` 库。\n\n***列表 7.1: multi_line.csv***\n\n```csv\nid,fname,lname\n\
  1,donna,rhymes?\n2,dave,\"jones$\"\n3,john,van jones.#\n4,stevie,\"ray\nvaughn#\"\
  \n```\n\n### Pandas 方案 (1)\n\n列表 7.2 显示了 `pandas_multi_line.py` 的内容，它重新格式化 `multi_line.csv`\
  \ 的内容，使每个记录占据一行。\n\n***列表 7.2: pandas_multi_line.py***\n\n```python\nimport pandas\
  \ as pd\n\nfilename = 'multi_line.csv'\ndata = pd.read_csv(filename)\nprint(\"data:\"\
  )\nprint(data)\n```\n\n运行 列表 7.2 中的代码，你将看到以下输出：\n\n```\ndata:\n   id   fname   \
  \      lname\n0   1   donna       rhymes?\n1   2    dave        jones$\n2   3  \
  \  john   van jones.#\n3   4  stevie  ray\nvaughn#\n4   5   ralph      emerson#\n\
  ```\n\n\n\n\n如你所示，之前的输出包含多个元字符。如果有需要，你可以创建一个单行的 `sed` 命令，将这些元字符替换为你选择的任意一个元字符。请查看第\
  \ 6 章中涉及 `sed` 命令的类似任务。\n\n请注意，列表 7.2 的输出并不是一个真正的 CSV 文件。然而，我们可以生成一个 CSV 文件，如下一节所示。\n\
  \n### Pandas 解决方案 (2)\n\n列表 7.3 显示了 `pandas_multi_line2.py` 的内容，该文件对 `multi_line.csv`\
  \ 的内容进行了重新格式，使得每条记录占据一行，并将数据保存为 CSV 文件。\n\n***列表 7.3: pandas_multi_line2.py***\n\
  \n```\n import sys\n\nimport pandas as pd\n\nfilename = 'multi_line.csv'\ndata =\
  \ pd.read_csv(filename)\n\n# 从数据中移除 \"\\n\" 字符：\ncolumns=[\"id\",\"fname\",\"lname\"\
  ]\ndata2 = data[columns].replace('\\\\n',' ', regex=True)\n\n# 保存到 CSV 文件：\ndata2.to_csv(\"\
  multi_line2.csv\",index=False)\n```\n\n列表 7.3 从一个导入语句开始，然后初始化变量 `filename`，赋值为此代码示例的\
  \ CSV 文件名。接下来的片段填充了 Pandas 数据帧 `data`，然后用不包含换行符的 `data` 内容初始化了 Pandas 数据帧 `data2`。最后一段代码将\
  \ `data2` 保存到 CSV 文件 `multi_line2.csv`。运行列表 7.3 中的代码，你将看到一个新文件 `multi_line2.csv`，其内容显示在此处：\n\
  \n```\n id,fname,lname\n1,donna,rhymes?\n2,dave,jones$\n3,john,van jones.#\n4,stevie,ray\
  \ vaughn#\n5,ralph,emerson#\n```\n\n如你所示，之前的输出包含多个元字符，你可以使用 `sed-based delimiters1.sh`\
  \ 脚本中的相同技术将它们替换为相同的列分隔符。\n\n### CSV 解决方案\n\n如果你还没有安装，请使用此命令安装 CSV Python ：\n\n```\n\
  \ pip3 install csv\n```\n\n列表 7.4 显示了 `csv_multi_line.py` 的内容，该文件对 `multi_line.csv`\
  \ 的内容进行了重新格式，使得每条记录占据一行。\n\n***列表 7.4: csv_multi_line.py***\n\n```\n import csv\n\
  \nfilename = 'multi_line.csv'\n\nwith open(filename, newline='', encoding='utf-8')\
  \ as f:\n  data = csv.reader(f, delimiter=',', quotechar='\"',\n               \
  \     quoting=csv.QUOTE_MINIMAL)\n\n  for line in data:\n    print(\"line:\",line)\n\
  ```\n\n列表 7.4 从一个导入语句开始，然后初始化变量 `filename`，赋值为此代码示例的 CSV 文件名。接下来的片段打开 CSV 文件并用其内容初始化\
  \ Pandas 数据帧 `data`（注：此处原文为 Pandas data frame，实际为 reader）。最后代码块包含一个循环，遍历数据帧的每一行并打印其内容。运行列表\
  \ 7.4 中的代码，你将看到以下输出：\n\n```\n line: ['id', 'fname', 'lname']\nline: ['1', 'donna',\
  \ 'rhymes?']\nline: ['2', 'dave', 'jones$']\nline: ['3', 'john', 'van jones.#']\n\
  line: ['4', 'stevie', 'ray\\nvaughn#']\nline: ['5', 'ralph', 'emerson#']\n```\n\n\
  ### CSV 文件、多行记录以及 AWK 命令\n\n本节向你展示如何处理包含跨行记录的 CSV 文件，这些记录由空行分隔。\n\n列表 7.5 显示了 `multi_line.csv`\
  \ 的内容，该内容将被重新格式化，使得每条记录占据一行：一种解决方案涉及 Pandas，另一种解决方案涉及 CSV 库。\n\n***列表 7.5: multi_line_records.csv***\n\
  \n```\n nancy jones\nmarketing dept\nsan francisco\n\ndave smith\nsales dept\nchicago\n\
  \nsteve anderson\nmarketing dept\nseattle\n```\n\n列表 7.6 显示了 `multi_line_records.sh`\
  \ 的内容，该文件对 `multi_line.csv` 的内容进行了重新格式，使得每条记录占据一行。\n\n***列表 7.6: multi_line_records.sh***\n\
  \n```\n # 记录由空行分隔。\ninput_file=\"multi_line_records.csv\"\n\nawk '\nBEGIN { RS =\
  \ \"\" ; FS = \"\\n\" }\n{\n  printf(\"%s,%s,%s\\n\", $1, $2, $3)\n}\n' < $input_file\n\
  ```\n\n列表 7.6 首先初始化变量 `input_file`，赋值为此代码示例的 CSV 文件名。列表 7.6 的后续部分包含一个 `awk` 脚本，它将每个输入以逗号分隔的形式打印，可以重定向到\
  \ CSV 文件。运行列表 7.6 中的代码，你将看到：\n\n```\n nancy jones,marketing dept,san francisco\n\
  dave smith,sales dept,chicago\nsteve anderson,marketing dept,seattle\n```\n\n###\
  \ 跨行的引号字段（可选）\n\n本节被标记为“可选”，主要是因为涉及的是一种你日常工作中可能不会遇到的 CSV 文件。具体而言，该 CSV 文件包含多行，且包含一个跨行的引号字段。到目前，你可能已经意识到\
  \ `awk` 工具对于数据清洗以及将 CSV 文件（或通用文本文件）转换为通过 Pandas 处理的格式非常有用。考虑 `awk` 在第 6 章最后一个示例中计算小计的便利性：这仅通过一行代码就实现了。对于某些人来说，`awk`\
  \ 是一个强大的命令行工具，可以对几乎任何类型的文本文件或 CSV 文件进行预处理。\n\n列表 7.7 的部分相当复杂且不直观，这通常发生在你需要字符级分析，并且需要维护和检查有关先前字符以及当前字符的“状态”信息依赖时，这两者都出现在此代码示例中。\n\
  \n列表 7.7 显示了 `multi_line3.csv` 的内容，列表 7.8 显示了 `split_quotes.sh` 的内容，该文件对 `multi_line3.csv`\
  \ 进行重新格式，使得每条记录恰好包含三个字段。\n\n***列表 7.7: multi_line3.csv***\n\n```\n id,fname,lname\n\
  1,\ndonna,\nrhymes?\n2,dave,\"jones$\"\n3,john,van jones.#\n4,stevie,\"ray\nvaughn#\"\
  \n5,ralph,emerson#\n```\n\n***列表 7.8: split_quotes.sh***\n\n\n\n\n\n```bash\n #\
  \ Records are separated by blank lines\n# PART 1: create a single string\ninterfile1=\"\
  temp_single_line1.csv\"\ninterfile2=\"temp_single_line2.csv\"\ninterfile3=\"temp_single_line3.csv\"\
  \ncsv_file=\"multi_line3.csv\"\n\ncat $csv_file | awk -F\",\" '\nBEGIN { count =\
  \ 1; colCount = 3 }\n{\n  printf(\"%s\", $0)\n  if( $0 !~ /,$/ ) {\n     printf(\"\
  ,\")\n  } else {\n    if( $0 !~ /^[0-9]/ ) {\n      if( count % colCount == 0) {\n\
  \        printf(\",\")\n      }\n      count += 1\n    }\n  }\n}' > $interfile1\n\
  \n# id,fname,lname,1,donna,rhymes?,2,dave,\"jones$\",3,john,van jones.#,4,stevie,\"\
  ray,vaughn#\",5,ralph,emerson#,\n# PART 2: replace patterns like \"abc,def\" with\
  \ \"abcZdef\"\ncat $interfile1 | awk -F\",\" '\n{\n  for(i=1; i<=NF; i++) {\n  \
  \  if( $i ~ /^\"/ && $(i+1) ~ /\"$/ ) {\n       printf(\"%sZ\",$i)\n    } else {\n\
  \       printf(\"%s,\",$i)\n    }\n  }\n}\n' > $interfile2\n# PART 3: ensure that\
  \ each line contains three fields\ncat $interfile2 | awk -F',' '\nBEGIN { start_quote\
  \ = 0; end_quote = 0; quote = 0; colCount = 3 }\n{\n  for(i=1; i<=NF; i++) {\n \
  \    if($i ~ /^\"/ && $i ~ /\"$/ ) {\n       printf(\"%s\",$i)\n     }\n     else\
  \ if($i !~ /^\"/ && $i !~ /\"$/ ) {\n       printf(\"%s,\", $i)\n     }\n     else\
  \ {\n        if($i ~ /^\"/ ) {\n          printf(\"%s,\",$i)\n          quote =\
  \ 1\n          start_quote = 1\n        } else {\n          if($i ~ /\"$/ ) {\n\
  \            printf(\"%s\",$i)\n            quote = 1\n            end_quote = 1\n\
  \          }\n        }\n     }\n\n     if( quote == 0) {\n       if(i % colCount\
  \ == 0) {\n         print \"\"\n       }\n     } else {\n       if(start_quote ==\
  \ 1 && end_quote == 1) {\n         quote = 0\n         start_quote = 0\n       \
  \  end_quote = 0\n       }\n     }\n  }\n}\n' > $interfile3\n\ncat $interfile3 |\
  \ sed -e 's/Z/,/' -e '/^,,/d' -e 's/,$//'\n```\n\n`Listing 7.8` 初始化了三个变量，格式为 `temp_single_linex.csv`\
  \ 的 CSV 文件名，其中 `x` 被替换为 `1`、`2` 和 `3`，同时初始化变量 `csv_file` 为 CSV 文件 `multi_line3.csv`。\n\
  \n接下来，`Listing 7.8` 包含（“PART 1”）一个带有 `BEGIN` 的 `awk` 脚本，它打印每行输入，然后执行以下条件逻辑。如果输入行*不是*以“，”结尾，则打印一个“，”。否则，如果输入行*不是*以数字开头且\
  \ `count` 的值是 3 的倍数，则打印一个“，”，如下所示：\n\n```bash\n if( $0 !~ /^[0-9]/ ) {\n  if( count\
  \ % colCount == 0) {\n    printf(\",\")\n  }\n  count += 1\n}\n```\n\n你可以看到，前面的代码块让人想起了第\
  \ `6` 章中 shell 脚本 `delimiter1.sh` 的逻辑。\n\n`Listing 7.8` 的下部分（“PART 2”）是另一个 `awk`\
  \ 脚本，其目的是将嵌套的“，”替换为字母 `Z`。字母 `Z` 的选择是任意的，你可以将其替换为 CSV 文件中未出现的其他字符或字符串。\n\n前面的逻辑通过在字段分别包含起始引号和结束引号时将变量\
  \ `start_quote` 和 `end_quote` 设置为值 `1` 来检测嵌套的“，”。执行上述判断的代码涉及检查当前字段与*下一个*字段的内容，如下所示：\n\
  \n```bash\n if( $i ~ /^\"/ && $(i+1) ~ /\"$/ ) {\n```\n\n你可以看到，前面的代码段检查字段 `i` 是否*起始*于引号（\"\
  ）以及字段 `(i+1)` 是否*结束*于引号（\"），在这种情况下将打印字母 `Z`。\n\n`Listing 7.8` 的下部分（“PART 3”）是一个\
  \ `awk` 脚本，其目的是打印包含三个字段的输出行。不包含引号的字段或包含平衡引号的字段将直接打印。其他字段将检查起始引号和结束引号。每当循环变量 `i`\
  \ 是 3 的倍数时，就会打印换行符，并重置*旨在*让你离开舒适圈的变量 `start_quote` 和 `end_quote`。\n\n### 项目概述\n\n\
