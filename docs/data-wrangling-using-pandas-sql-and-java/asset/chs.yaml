  \n注意，代码*并没有*显示 XML 文档的内容：它的目的仅仅是说明如何创建内存结构。运行 Listing 5.11 中的代码，你将看到以下输出：\n\n```\n\
  \ Reading XML file friends.xml\n```\n\n## 在 Java 中作为字符串读取 XML 文档\n\nListing 5.12\
