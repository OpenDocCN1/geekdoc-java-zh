  \n### 处理缺失数据\n\n数据集中缺失值有多种原因，此处列出了一些：\n\n* 值不可用\n* 收集不当\n* 数据录入不准确\n\n尽管你可能想总是用具体值替换缺失值，但在某些情况下，你无法确定某个值。一个简单的例子是，一份包含针对\
  \ 30 岁以下人群问题的问卷，对于 30 岁以上的受访者将有一个缺失值，在这种情况下，为缺失值指定一个值是不正确的。考虑到这些细节，填充缺失值有多种方法，此处列出了：\n\
  \n* 删除包含缺失值的行\n* 使用均值填充缺失值\n* 使用中位数填充缺失值\n* 使用众数填充缺失值\n* 删除包含缺失值的行\n\n#### 数值插值：何时零是有效值？\n\
  \n通常情况下，可以使用现有值的均值而不是零值，反之亦然。作为第一个例子，假设某个属性包含一组人的身高。在这种情况下，均值可能是一个合理的插值方案，而 0 则存在以下问题：\n\
  \n1. 它是无效值（没有人的身高是 0）。\n2. 它会偏斜统计量，如均值和方差。\n\n当允许最小值为正数时，你可能想用均值代替 0，但在处理不平衡数据集时要加小心。\n\
  \n\n\n\n\n# SMOTE (合成少数类过采样技术)\n\n`Random resampling`通过对数据空间进行重采样来平衡类别分布。`random\
  \ undersampling`技术从数据集中移除属于多数类的样本，涉及以下内容：\n\n* 随机从多数类中删除样本\n* 可以有放回或不放回地进行\n* 缓解数据集中的不平衡问题\n\
  * 可能会增加分类器的方差\n* 可能会丢弃有用或重要的样本\n\n然而，随机欠采样对于极不平衡的数据集效果并不好，例如两个类别的划分比例为 99% 和 1%。此外，欠采样可能会导致丢失对模型有用的信息。\n\
  \n`Random oversampling`从少数类中生成新样本：这种技术通过复制少数类的示例来实现。\n\n另一个可以考虑的选项是 `scikit-learn-contrib`\
  \ 项目中的 `imbalanced-learn` Python 包。该项目为表现出类不平衡的数据集提供了各种重采样技术。更多细节可以在网上查找到：\n\n[https://github.com/scikit-learn-contrib/imbalanced-learn]\n\
  \n另一个著名的技术被称为 `SMOTE`，它涉及数据增强（即合成新的数据样本）。`SMOTE` 最初通过 `kNN` 算法开发（也有其他可选方案），它是处理不平衡类别的有效技术。下一节将详细讨论\
  \ `SMOTE`。\n\n## 什么是 SMOTE？\n\n`SMOTE`（合成少数类过采样技术）是一种为数据集合成新样本的技术。该技术基于线性插值：\n\n\
  * 步骤 1：在特征空间中选择接近的样本。\n* 步骤 2：在特征空间的样本之间画一条直线。\n* 步骤 3：在该直线的某一点上绘制新样本。\n\n`SMOTE`\
  \ 算法更详细的解释如下：\n\n* 从少数类中随机选择样本“a”。\n* 为该示例找到 `k` 个最近邻。\n* 从这些最近邻中随机选择一个邻居“b”。\n\
  * 创建一条连接“a”和“b”的直线 `L`。\n* 在直线 `L` 上随机选择一个或多个点“c”。\n\n如有需要，你可以对其他的 (`k–1`) 个最近邻重复此过程，以使合成值更均匀地分布在各个最近邻之间。\n\
  \n### SMOTE 扩展\n\n最初的 `SMOTE` 算法基于 `kNN` 分类算法，该算法已通过各种方式进行了扩展，例如将 `kNN` 替换为 `SVM`。`SMOTE`\
  \ 扩展列表如下：\n\n* 选择性合成样本生成\n* `Borderline-SMOTE` (`kNN`)\n* `Borderline-SMOTE` (`SVM`)\n\
  * 自适应合成采样 (ADASYN)\n\n可以在网上搜索这些算法的更多细节，并访问以下 URL：\n\n[https://en.wikipedia.org/wiki/Oversampling_and_undersampling_in_data_analysis]\n\
  \n## 偏差与方差的权衡\n\n本节从机器学习的角度介绍，但偏置和方差的概念在机器学习之外也高度相关，因此阅读本节以及上一节可能仍然是有值的。\n\n机器学习中的\
  \ `Bias`（偏置）可能是由于学习算法中的错误假设导致的误差。高偏置可能会导致算法漏掉特征与目标输出之间的相关关系（欠拟合）。预测偏差可能由于“噪声”数据、不完整的特征集或有偏的训练样本而产生。\n\
  \n由于偏差引起的误差是模型的预期（或平均）预测值与你想预测的正确值之间的差异。重复多次模型构建过程，每次收集新数据并进行分析以生成新模型。生成的模型具有一系列预测值，因为底层数据集具有程度的随机性。偏置衡量了这些模型的预测值偏离正确值的程度。\n\
  \n机器学习中的 `Variance`（方差）是与平均值的平方偏差的期望值。高方差会导致算法对训练数据中的随机噪声建模而非预期的输出（过拟合）。此外，向模型添加参数会增加其复杂性，增加方差并降低偏置。\n\
  \n**要记住：处理偏差和方差涉及处理欠拟合和过拟合。**\n\n由于方差引起的误差是模型对给定数据点预测的可变性。和一样，重复整个模型构建过程，方差是给定点的预测在不同模型实例之间变化的程度。\n\
  \n如果你处理过数据集并进行过数据分析，你已经知道寻找平衡样本可能是困难或极不现实的。此外，对数据集中的数据进行分析至关重要，但无法保证产生一个 100%“干净”的数据集。\n\
  \n`biased statistic`（有偏统计量）是指与所估计总体实体存在系统性差异的统计量。在更通俗的术语中，如果数据样本“偏爱”或“倾向于”总体的某个方面，那么该样本就有偏差。例如，如果你更喜欢喜剧片而不是任何其他类型的电影，那么显然你更有可能选择喜剧片而不是剧情或科幻片。因此，你的电影选择样本中电影类型的频率图将更密集地聚集在喜剧周围。\n\
  \n然而，如果你对电影有广泛的偏好，那么相应的频率图将更加多样化，因此取值范围更大。\n\n### 数据中的偏差类型\n\n除了上一节讨论的偏差-方差权衡外，还有几种类型的偏差：\n\
  \n* 可用性偏差 (availability bias)\n* 确认偏差 (confirmation bias)\n* 虚假因果 (false causality)\n\
  * 沉没成本谬误 (sunk cost fallacy)\n* 生存者偏差 (survivorship bias)\n\n`availability bias`\
  \ 类似于根据例外制定“规则”。例如，吸烟和癌症之间存在已知联系，但存在例外。如果你发现某人每天抽三包烟并持续四十年后依然健康，你能断定吸烟不会导致癌症吗？\n\
  \n`confirmation bias` 指人们倾向于关注证实其信念的数据，同时忽略与信念相矛盾的数据。\n\n\n\n\n`虚假因果`（False causality）是指当你错误地断言某一事件的发生导致另一个事件的发生时。最著名的例子之一涉及夏季纽约冰淇淋消费量与暴力犯罪之间的关系。由于夏天更多人吃冰淇淋，所以这“导致”了更多暴力犯罪，这是一种虚假因果关系。其他因素（如温度升高）可能与犯罪的增加有关。然而，区分相关性和因果关系至关重要：后者的联系比前者强得多，而且建立因果关系而非相关性也困难得多。\n\
  \n`沉没成本`（Sunk cost）指的是已经支出且无法收回的东西（通常是金钱）。一个常见的例子是赌场赌博：人们陷入了投入更多钱来收回已经损失的大额资金的模式中。虽然存在人们追回金钱的情况，但在许多（或大多数？）情况下，人们仅仅因为继续投入资金而遭受了更大的损失。（因此，我们有句谚语，“是时候止损抽身了。”）\n\
  \n`幸存者偏差`（Survivorship bias）是指分析特定的“正面”数据子集，而忽略“负面”数据。这种偏差出现在各种情况下，例如受到那些讲述自己白手起家成功故事的人（“正面”数据）的影响，而忽略了在类似追求中没有成功的人（这通常占很大比例，即“负面”数据）的命运。因此，虽然个人确实有可能克服许多困难并取得成功，但这种成功率真的是千分之一（甚至更低）吗？\n\
  \n## 分析分类器（可选）\n\n本节被标记为“可选”，因为其内容涉及机器学习分类器，而这并不是本书的重点。然而，浏览一下这些材料仍然值得的，或者可能可以在你对机器学习分类器有了基本了解后回到本节。\n\
  \n目前有几种著名的技术可以用于分析机器学习分类器的质量。其中两种技术是 `LIME` 和 `ANOVA`，它们都将在接下来的小节中进行讨论。\n\n### 什么是\
  \ LIME？\n\n`LIME` 是局部可解释模型无关解释（Local Interpretable Model-Agnostic Explanations）的缩写。`LIME`\
  \ 是一种模型无关的技术，可以用于机器学习模型。该技术的直观原理很简单：对数据样本进行微小的随机更改，然后观察预测变化的方式（或是否变化）。其直观原理涉及（稍微）改变输出，然后观察输出发生了什么。\n\
  \n类比一下，考虑对满载易腐食品的车进行细菌检测的食品检测员。显然，测试卡车中的每件食品（或每节车厢）是不可能的，因此检测员进行“抽检”，即测试随机选择的物品。类似地，`LIME`\
  \ 在随机位置对输入数据进行微小更改，然后分析相关输出值的变化。\n\n然而，当你使用 `LIME` 处理给定模型的输入数据时，有两点需要注意：\n\n1. 输入值的实际更改是针对特定模型的。\n\
  2. 该技术适用于可解释的输入。\n\n可解释输入的示例包括机器学习分类器（如树和随机森林）以及如 `BoW` 等自然语言处理（NLP）技术。不可解释的输入涉及“稠密”数据，例如词嵌入（一个浮点数向量）。\n\
  \n你也可以用另一个涉及可解释数据的模型来替换你的模型，但你需要评估该近似相对于原始模型的准确性有多高。\n\n### 什么是 ANOVA？\n\n`ANOVA`\
  \ 是方差分析（analysis of variance）的缩写，它尝试分析从总体中提取的样本平均值之间的差异。`ANOVA` 允许你测试多个平均值是否相等。更重要的是，`ANOVA`\
  \ 可以帮助减少第一类错误（假阳性）和第二类错误（假阴性）。例如，假设 A 人被诊断为患有癌症，而 B 人被诊断为健康，且这两个诊断都是错误的。那么 A 人的结果是假阳性，而\
  \ B 人的结果是假阴性。通常情况下，假阳性测试结果*远比*假阴性测试结果要好。\n\n`ANOVA` 涉及实验设计和假设检验，这可以在各种情况下产生有意义的结果。例如，假设一个数据集包含一个可以划分为若干合理同质组的特征。接下来，分析每组的方差并进行比较，目标是确定给定特征值的不同方差来源。有关关于\
  \ `ANOVA` 的更多信息，请访问以下链接：\n\n*https://en.wikipedia.org/wiki/Analysis_of_variance*\n\
  \n### 总结\n\n本章从对数据集的解释、数据清洗的描述以及关于各种类型数据的详细介绍开始。然后你学习了缩放数值数据的技术，如归一化和标准化。你了解了如何将类别数据转换为数值，以及如何处理日期和货币。\n\
  \n接着，你学习了如何处理离群值、异常值和缺失数据，以及处理这些场景的各种技术。你还学习了不平衡数据，以及评估使用 `SMOTE` 处理数据集中不平衡类别的方法。此外，你学习了偏差-方差权衡以及各种类型的统计偏差。最后，你学习了使用两种技术——`LIME`\
  \ 和 `ANOVA` 的分类器。\n\n# 第 3 章\n\n## Pandas 简介\n\n本章介绍了 `Pandas` 库，并包含了若干说明有用 `Pandas`\
  \ 特性的代码示例。每个节的标题都清楚地指示了其内容，因此你可以轻松扫描本章，找到对你来说是新内容的章节。这种方法将帮助你在阅读本章内容时高效利用时间。\n\n\
  本章的第一部分包含 `Pandas` 的简要介绍，随后是说明如何定义 `Pandas` DataFrame 以及显示其属性的代码示例。请注意，本章专门介绍 DataFrame。有一个代码块说明了如何定义\
  \ `Pandas Series`，如果你想了解更多关于这种 `Pandas Series` 的信息，可以在网上进行搜索。\n\n本章的第二部分讨论了你可以创建的各种类型\
  \ DataFrame，例如数值型和布尔型 DataFrame。此外，你还将看到使用 `NumPy` 函数和随机数创建 DataFrame 的示例。你也将看到在\
  \ Python 字典和 JSON 数据之间进行转换的示例，以及如何从 JSON 数据创建 `Pandas` DataFrame。\n\n### 什么是 Pandas？\n\
  \n`Pandas` 是一个与其他 Python 库（如 `NumPy` 和 `Matplotlib`）兼容的 Python 库。打开命令行并调用以下适用于 Python\
  \ 3.x 的命令来安装 `Pandas`：\n\n```\npip3 install pandas\n```\n\n\n\n\n简单来说，Pandas 数据框（data\
  \ frame）是一个二维数据结构，用行和列来考虑这种数据结构会非常方便。数据框可以被标记（包括行和列），且列可以包含不同的数据类型。数据集源可以是数据文件、数据库表或\
  \ Web 服务。Pandas 数据框的特征包括：\n\n*   数据框方法\n*   数据框统计信息\n*   分组、透视和重塑\n*   处理缺失数据\n\
  *   合并数据框\n\n## 数据框与数据清洗任务\n\n你需要执行的特定任务取决于数据集的结构和内容。通常，你将执行一个包含以下步骤的工作流（不一定总是按此顺序），所有步骤都可以通过\
  \ Pandas 数据框完成：\n\n*   将数据读入数据框\n*   显示数据框顶部数据\n*   显示列的数据类型\n*   显示非缺失值\n*   将\
  \ NA 替换为某个值\n*   遍历列\n*   每列的统计信息\n*   查找缺失值\n*   缺失值总数\n*   缺失值百分比\n*   排序表格值\n\
  *   打印摘要信息\n*   查找缺失值大于 50% 的列\n*   重命名列\n\n## PandasAS 数据框示例\n\nListing 3.1 显示了\
  \ `pandas_df.py` 的内容，说明了如何定义几个 Pandas 数据框并显示它们的内容。\n\n***代码列表 3.1: pandas_df.py***\n\
  \n```\n import pandas as pd\nimport numpy as np\nmyvector1 = np.array([1,2,3,4,5])\n\
  print(\"myvector1:\")\nprint(myvector1)\nprint()\n\nmydf1 = pd.DataFrame(myvector1)\n\
  print(\"mydf1:\")\nprint(mydf1)\nprint()\n\nmyvector2 = np.array([i for i in range(1,6)])\n\
  print(\"myvector2:\")\nprint(myvector2)\nprint()\n\nmydf2 = pd.DataFrame(myvector2)\n\
  print(\"mydf2:\")\nprint(mydf2)\nprint()\n\nmyarray = np.array([[10,30,20], [50,40,60],[1000,2000,3000]])\n\
  print(\"myarray:\")\nprint(myarray)\nprint()\n\nmydf3 = pd.DataFrame(myarray)\n\
  print(\"mydf3:\")\nprint(mydf3)\nprint()\n```\n\nListing 3.1 从 Pandas 和 NumPy 的标准导入语句开始，接着定义了两个一维\
  \ NumPy 数组和一个二维 NumPy 数组。NumPy 的语法对你来说应该熟悉（网上有很多基础教程）。每个 NumPy 变量后面都跟着对应的 Pandas\
  \ 数据框 `mydf1`、`mydf2` 和 `mydf3`。运行 Listing 3.1 中的代码。你将看到以下输出，并可以将 NumPy 数组与 Pandas\
  \ 数据框进行对比：\n\n```\n myvector1:\n[1 2 3 4 5]\n\nmydf1:\n   0\n0  1\n1  2\n2  3\n\
  3  4\n4  5\n\nmyvector2:\n[1 2 3 4 5]\nmydf2:\n   0\n0  1\n1  2\n2  3\n3  4\n4 \
  \ 5\n\nmyarray:\n[[  10   30   20]\n [  50   40   60]\n [1000 2000 3000]]\n\nmydf3:\n\
  \      0     1     2\n0    10    30    20\n1    50    40    60\n2  1000  2000  3000\n\
  ```\n\n相比之下，以下代码块说明了如何定义一个 Pandas Series：\n\n```\n names = pd.Series(['SF', 'San\
  \ Jose', 'Sacramento'])\nsizes = pd.Series([852469, 1015785, 485199])\ndf = pd.DataFrame({\
  \ 'Cities': names, 'Size': sizes })\nprint(df)\n```\n\n使用上述代码（以及所需的导入语句）创建一个 Python\
  \ 文件。当你运行该代码时，你将看到以下输出：\n\n```\n City name    sizes\n0          SF   852469\n1 \
  \   San Jose  1015785\n2  Sacramento   485199\n```\n\n## 描述 Pandas 数据框\n\nListing\
  \ 3.2 显示了 `pandas_df_describe.py` 的内容，说明了如何定义一个包含 3×3 整数 NumPy 数组的 Pandas 数据框，其中数据框的行和列都已标记。还显示了数据框的其他方面。\n\
  \n***代码列表 3.2: pandas_df_describe.py***\n\n```\n import numpy as np\nimport pandas\
  \ as pd\n\nmyarray = np.array([[10,30,20], [50,40,60],[1000,2000,3000]])\n\nrownames\
  \ = ['apples', 'oranges', 'beer']\ncolnames = ['January', 'February', 'March']\n\
  mydf = pd.DataFrame(myarray, index=rownames, columns=colnames)\nprint(\"contents\
  \ of df:\")\nprint(mydf)\n\nprint(\"contents of January:\")\nprint(mydf['January'])\n\
  \nprint(\"Number of Rows:\")\nprint(mydf.shape[0])\n\nprint(\"Number of Columns:\"\
  )\nprint(mydf.shape[1])\n\nprint(\"Number of Rows and Columns:\")\nprint(mydf.shape)\n\
  \nprint(\"Column Names:\")\nprint(mydf.columns)\n\nprint(\"Column types:\")\nprint(mydf.dtypes)\n\
  \nprint(\"Description:\")\nprint(mydf.describe())\n```\n\nListing 3.2 以两个标准导入语句开始，随后是\
