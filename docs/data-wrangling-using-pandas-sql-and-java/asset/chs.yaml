  \n列出数据框的列名：\n\n```\n df.columns\n```\n\n从数据框中删除缺失数据：\n\n```\n df.dropna(axis=0,\
  \ how='any')\n```\n\n删除一个不必要的列：\n\n```\n my_dataset = my_dataset.drop([\"url\"],axis=1)\n\
  ```\n\n删除只有一个单一值的列，或者缺失值超过其 50% 的列：\n\n```\n dataset = dataset.dropna(thresh=half_count,axis=1)\n\
  ```\n\n替换数据框中的缺失数据：\n\n```\n df.replace(to_replace=None, value=None)\n```\n\n检查数据框中的\
  \ NAN（空值）：\n\n```\n pd.isnull(object)\n```\n\n删除数据框中的一个特征：\n\n```\n df.drop('feature_variable_name',\
  \ axis=1)\n```\n\n将数据框中的对象类型转换为浮点数：\n\n```\n pd.to_numeric(df[\"feature_name\"],\
  \ errors='coerce')\n```\n\n将数据框中的数据转换为 NumPy 数组：\n\n```\n df.as_matrix()\n```\n\n\
  显示数据框的前 n 行：\n\n```\n df.head(n)\n```\n\n通过特征名获取数据框中的数据：\n\n```\n df.loc[feature_name]\n\
  ```\n\n对数据框应用函数，例如将数据框中“height”列的所有值乘以 3：\n\n```\n df[\"height\"].apply(lambda height:\
  \ 3 * height)\n```\n\n或者\n\n```\n def multiply(x):\n\n    return x * 3\n\ndf[\"\
  height\"].apply(multiply)\n```\n\n将数据框的第四列重命名为 height：\n\n```\n df.rename(columns\
  \ = {df.columns[3]:'height'}, inplace=True)\n```\n\n获取数据框中第一列的唯一条：\n\n```\n df[\"\
  first\"].unique()\n```\n\n从现有数据框创建一个包含 first 和 last 列的数据框：\n\n```\n new_df = df[[\"\
  first\", \"last\"]]\n```\n\n对数据框中的数据排序：\n\n```\n df.sort_values(ascending = False)\n\
  ```\n\n过滤名为 size 的数据列，仅显示等于 7 的值：\n\n```\n df[df[\"size\"] == 7]\n```\n\n选择数据框中\
  \ height 列的第一行：\n\n```\n df.loc([0], ['height'])\n```\n\n### **处理基于 JSON 的数据**\n\
  \n一个 JSON 对象由用冒号分隔的“名/值对”表示的数据，以及用逗号分隔的数据对象组成。对象在大括号 {} 内部指定，而对象数组用方括号 [] 表示。请注意，字符值类型的数据元素位于一对双引号\
  \ \"\" 之中（但数值型数据不需要引号）。\n\n这里是一个 JSON 对象的简单示例：\n\n```\n { \"fname\":\"Jane\", \"\
  lname\":\"Smith\", \"age\":33, \"city\":\"SF\" }\n```\n\n这是一个 JSON 对象数组的简单示例（注意外层包裹的方括号）：\n\
  \n```\n [\n{ \"fname\":\"Jane\", \"lname\":\"Smith\", \"age\":33, \"city\":\"SF\"\
  \ },\n{ \"fname\":\"John\", \"lname\":\"Jones\", \"age\":34, \"city\":\"LA\" },\n\
  { \"fname\":\"Dave\", \"lname\":\"Stone\", \"age\":35, \"city\":\"NY\" },\n]\n```\n\
  \n#### **Python 字典与 JSON**\n\n`json` 库允许你在 Python 中处理基于 JSON 的数据。\n\n列表 3.41 显示了\
  \ `dict2json.py` 的内容，说明了如何将 Python 字典转换为 JSON 字符串。\n\n***列表 3.41: dict2json.py***\n\
  \n```\n import json\n\ndict1 = {}\ndict1[\"fname\"] = \"Jane\"\ndict1[\"lname\"\
  ] = \"Smith\"\ndict1[\"age\"]   = 33\ndict1[\"city\"]  = \"SF\"\n\nprint(\"Python\
  \ dictionary to JSON data:\")\nprint(\"dict1:\",dict1)\njson1 = json.dumps(dict1,\
  \ ensure_ascii=False)\nprint(\"json1:\",json1)\nprint(\"\")\n\n# convert JSON string\
  \ to Python dictionary:\njson2 = '{\"fname\":\"Dave\", \"lname\":\"Stone\", \"age\"\
  :35, \"city\":\"NY\"}'\ndict2 = json.loads(json2)\nprint(\"JSON data to Python dictionary:\"\
  )\nprint(\"json2:\",json2)\nprint(\"dict2:\",dict2)\n```\n\n列表 3.41 调用了 `json.dumps()`\
  \ 函数来执行从 Python 字典到 JSON 字符串的转换。运行 列表 3.41 中的代码，你将看到以下输出：\n\n```\n Python dictionary\
  \ to JSON data:\ndict1: {'fname': 'Jane', 'lname': 'Smith', 'age': 33, 'city': 'SF'}\n\
  json1: {\"fname\": \"Jane\", \"lname\": \"Smith\", \"age\": 33, \"city\": \"SF\"\
  }\n```\n\n#### **Python 字典和 JSON**\n\n`json` 库允许你在 Python 中处理基于 JSON 的数据。\n\n列表\
  \ 3.41 显示了 `dict2json.py` 的内容，说明了如何将 Python 字典转换为 JSON 字符串。\n\n***列表 3.41: dict2json.py***\n\
  \n```\n import json\n\ndict1 = {}\ndict1[\"fname\"] = \"Jane\"\ndict1[\"lname\"\
  ] = \"Smith\"\ndict1[\"age\"]   = 33\ndict1[\"city\"]  = \"SF\"\n\nprint(\"Python\
  \ dictionary to JSON data:\")\nprint(\"dict1:\",dict1)\njson1 = json.dumps(dict1,\
  \ ensure_ascii=False)\nprint(\"json1:\",json1)\nprint(\"\")\n\n# convert JSON string\
  \ to Python dictionary:\njson2 = '{\"fname\":\"Dave\", \"lname\":\"Stone\", \"age\"\
  :35, \"city\":\"NY\"}'\ndict2 = json.loads(json2)\nprint(\"JSON data to Python dictionary:\"\
  )\nprint(\"json2:\",json2)\nprint(\"dict2:\",dict2)\n```\n\n列表 3.41 调用了 `json.dumps()`\
  \ 函数来执行从 Python 字典到 JSON 字符串的转换。运行 列表 3.41 中的代码，你将看到以下输出：\n\n```\n Python dictionary\
  \ to JSON data:\ndict1: {'fname': 'Jane', 'lname': 'Smith', 'age': 33, 'city': 'SF'}\n\
  json1: {\"fname\": \"Jane\", \"lname\": \"Smith\", \"age\": 33, \"city\": \"SF\"\
  }\n```\n\n### **总结**\n\n本章介绍了如何使用 Pandas 创建带标签的数据框并显示数据框的元数据。然后，你学习了如何从各种数据源创建数据框，例如随机数和硬编码的数据值。\n\
  \n你还学习了读取 Excel 表格并对这些数据进行数值计算，例如数值列的最小值、平均值最大值。随后，你看到了如何从存储在 CSV 文件中的数据创建数据框。此外，你还学习了如何根据数据框中的数据生成散点图。\n\
  \n最后，你对 JSON 进行了简单介绍，并并将 Python 字典转换为 JSON 数据（反之亦然）的示例。\n\n# 第 4 章\n\n## RDBMS 与\
  \ SQL\n\n本章将向你介绍 RDBMS、各种 SQL 概念以及对 MySQL 的快速介绍。MySQL 是一个健的 RDBMS，可以从 Oracle 网站免费下载。此外，你在本章中关于\
  \ MySQL 学到的几乎所有内容都适用于其他 RDBMS，例如 PostgreSQL 和 Oracle。\n\n本章描述了一个假设的网站，该网站允许用户注册以购买各种工具（如锤子和扳手）。虽然本节没有代码，但你将了解到所需的表、它们之间的关系以及这些表的结构。\n\
  \n### **什么是 RDBMS？**\n\n\n\n\n\n关系数据库管理系统（RDBMS）将数据存储在表中，表中包含带有标记的属性（非正式地有时称为 `列`），这些属性具有特定的数据类型。RDBMS\
  \ 的示例包括 `MySQL`、`Oracle` 和 `IBM DB2`。虽然关系数据库通常为数据存储提供良好的解决方案，但在某些情况下，速度和扩展性可能会成为问题。NoSQL\
  \ 数据库（如 `MongoDB`）在扩展性方面可能更为合适。\n\n## RDBMS 中的表之间存在什么关系？\n\n虽然 RDBMS 可以只包含一个表，但它通常包含多个表，这些表之间可以存在各种类型的关联。例如，当你在食品商店购买各种物品时，你的收据由一个订单组成，该订单包含一个或多个“行项目”（line\
  \ items），每个行项目都指明了你购买的特定商品的详情。这被称为订单（存储在 `purchase_orders` 表中）与你购买的每个商品的行项目（存储在\
  \ `line_items` 表中）之间的 `一对多` 关系。\n\n另一个例子涉及学生和课程：每个学生都选了一或多门课程，这是从学生到课程的一对多关系。此外，每门课程包含一个或多个学生，因此存在从课程到学生的一对多关系。因此，学生表和课程表之间是多对多的关系。\n\
  \n第三个例子是 `employees` 表，每行都包含一个员工的信息。如果每行都包含该员工经理的 `id`，那么 `employees` 表就是一个 `自引用`\
  \ 表，因为查找员工的经理涉及到使用该员工记录中存储的经理 `id` 在 `employees` 表中进行搜索。然而，如果 `employees` 表中的行不包含员工经理的信息，那么该表就不是自引用的。\n\
  \n除了表定义，数据库还经常包含索引、主键和外键，这些有助于在表中搜索数据，并将特定表中的某行与另一个表中逻辑上相关的行（或多行）“连接”起来。例如，如果我们在\
  \ `purchase_orders` 表中有一个某个特定订单的 `id` 值，我们可以在 `line_items` 表中找到所有包含相同订单 `id` 的行项目（即被购买的物品）。\n\
  \n## RDBMS 的特性\n\nRDBMS 提供了一种方便的数据存储方式，通常与某种类型的应用程序相关。例如，稍后你将看到一个四表 RDBMS 的细节，它用于跟踪通过\
  \ Web 应用程序购买的工具。从高层次的角度来看，RDBMS 具有以下特性：\n\n* 数据库包含一个或多个表\n* 数据存储在表中\n* 数据记录具有相同的结构\n\
  * 适用于垂直扩展\n* 支持 ACID（下文将解释）\n\n另一个有用的概念是 `逻辑模式`（logical schema），它由 RDBMS 中的表及其关系（以及索引、视图、触发器等）的集合组成。该模式用于生成物理模式，它包含了创建指定表及其关系所需的所有\
  \ `SQL` 语句。\n\n## 什么是 ACID？\n\nACID 是原子性（Atomicity）、一致性（Consistency）、隔离性（Isolation）和持久性（Durability）的缩写，指的是\
  \ RDBMS 事务的属性。\n\n* `Atomicity`（原子性）意味着每个事务要么成功、要么失败，因此如果事务失败，系统将回滚到之前的状态。\n* `Consistency`（一致性）意味着成功的事务始终会导致有效的数据库状态。\n\
  * `Isolation`（隔离性）意味着并发或串行执行事务将产生一致的结果。\n* `Durability`（持久性）意味着已提交的事务将保持在相同状态。\n\
  \nRDBMS 支持 ACID，而 NoSQL 数据库通常不支持 ACID。\n\n## 我们在什么时候需要 RDBMS？\n\n简短的回答是，当我们需要存储一个或多个已发生事件记录时，RDBMS\
  \ 非常有用，这可能涉及简单的物品购买，也涉及复杂的跨表财务事务。\n\nRDBMS 允许你定义一组包含数据行的表，其中每行包含一个或多个属性（非正式地称为 `字段`）。数据行是发生在特定时间点的事件的记录，它可能涉及多个表，也可以涉及某种类型的“事务”。\n\
  \n例如，考虑一个包含名为 `events` 的单表的数据库，其中单行包含你通过某些过程（如 Web 页面注册表）创建的单个事件的信息。尽管这在概念上很简单，但请注意以下属性对于\
  \ `events` 表中的每行都是相关的：`event_id`、`event_time`、`event_title`、`event_duration` 和 `event_location`，可能的其他属性。\n\
  \n现在考虑两个银行账户之间的资金转账场景：你需要从储蓄账户转账 $100 元到支票账户。该过程涉及两个步骤：\n\n1. 扣除（减去）储蓄账户 $100 元\n\
  2. 存入（增加）储蓄账户 $100 元\n\n然而，如果在步骤 1 之后、步骤 2 完成 之前发生系统故障，你就丢失了 $100 元。显然，步骤 1 和步骤\
  \ 2 必须被视为一个 `原子事务`，这意味着只有当两个步骤都成功完成后，事务才成功。如果事务失败，事务将“回滚”，以便系统恢复到两个账户之间转账之前的状态。\n\
  \n正如你在本章早期学到的，RDBMS 支持 ACID，这确保了之前的事务（即账户之间的资金转账）被视为一个原子事务。\n\n虽然原子事务是金融系统的基础，但它们对于其他系统可能没有那么关键。例如，上一个例子涉及在创建新事件时在\
  \ `events` 表中插入一个新行。如果此过程失败，解决方案可能包括在系统重新在线时再次注册事件。\n\n## 规范化的重要性\n\n本节介绍了规范化的概念；在线文章提供了有关规范范式的更详细信息。将此主题分为两个章节中的两个部分将有助于理解规范化。\n\
  \n作为一个起点，考虑一个存储在时间段内（如一天、一周或其他时间段）房间温度记录的 RDBMS。我们只需要一个 `device_temperature` 表，其中每行都包含特定时间房间的温度。在\
  \ IoT（物联网）的情况下，温度是在常规的时间间隔内（如每分钟或每小时）记录的。\n\n如果你只需要跟踪一个房间，`device_temperature` 表可能足够了。但是，如果你需要跟踪房间内的多个设备，那么创建一个名为\
  \ `device_details` 的第二个表会很方便，该表包含每个设备的属性，如 `device_id`、`device_name`、`device_year`、`device_price`\
  \ 和 `device_warranty`。\n\n\n\n\n然而，我们需要将来自 `device_temperature` 表的某行信息连接到其在 `device_details`\
  \ 表中的关联行。双表连接非常简单：`device_details` 表中的每行都包含一个 `device_id`，它能唯一标识该行。此外，在 `device_temperature`\
  \ 表中，任何引用该设备的行都会出现相同的 `device_id`。\n\n上述的双表结构是数据库`normalization`（范式/规范化）的一个极简示例，它减少了数据库表中的数据冗余，但有时会以执行某些类型\
  \ `SQL` 语句（例如包含 `JOIN` 关键字的语句）时性能变慢为代价。\n\n如果你是数据库`normalization` 概念的新手，可能会认为规范化增加了复杂性并降低了性能，而没有提供实际收益。虽然这种考虑是合理的，但这种权是值得的。\n\
  \n为了说服你接受规范化的价值，假设 `purchase_orders` 表中的每条记录都包含完成购买客户的所有细节。结果是我们可以消除 `customers`\
  \ 表。然而，如果我们以后需要更新特定客户的地址，就需要更新 `purchase_orders` 表中所有包含该客户的行。相比之下，如果我们维护一个 `customers`\
  \ 表，那么更新客户地址只需更改 `customers` 表中的单行即可。\n\n规范化使我们能够避免数据重复，从而在必须更新信息（如客户地址）时，有一个单一的“事实之源”。从另一个角度来看，数据重复意味着相同的数据出现在两个（或可能更多）位置，如果更新没有应用到所有这些位置，数据库数据将处于不一致状态。取决于应用程序的性质，数据不一致的后果可能从微小到灾难性不等。\n\
  \n始终记住这一点：每当你需要更新位于两个不同位置的相同数据时，你就会增加数据不一致的风险，这会对数据性产生不利影响。\n\n作为另一个例子，假设一个网站在线销售小部件：至少，关联数据库需要以下四张表：\n\
  \n* `customer_details`\n* `purchase_orders`\n* `po_line_items`\n* `item_desc`\n\n\
  上述场景将在下一节中进行更详细探讨，该节将指定上述每个表的属性。\n\n### 一个四表 RDBMS\n\n作为一个介绍性示例，假设 `[www.mytools.com]`\
  \ 销售家用或建筑工具（细节并不重要）。为了简单起见，让我们假定上述 URL 有一个实际的网页，且该网页包含以下部分：\n\n* 新用户注册\n* 现有用户登录\n\
  * 用于选择购买物品（及数量）的输入字段\n\n例如，注册用户 John Smith 想要购买一把锤子、两把螺丝刀和三把扳手。网页需要为用户提供按类型（例如锤子、螺丝刀和扳手）搜索产品的能力，然后显示匹配的产品列表。列表中的每个产品还应包含一个\
  \ `SKU`，这是一种行业标准的产品标记机制（就像识别书籍的 `ISBNs` 一样）。\n\n上述功能对于开发允许用户购买产品的网页是必要的。然而，本节的目的是描述\
  \ `RDBMS` 中的一组表（以及它们之间的关系），因此我们假设我们的 URL 已经提供了必要的 Web 功能。\n\n让我们描述一个“用例”，该用例包含了将代表现有客户\
  \ John Smith（其客户 ID 为 1000）执行的步骤序列，他想要购买 1 把锤子、2 把螺丝刀和 3 把扳手：\n\n> 步骤 1：客户 John\
  \ Smith（`cust_id` 为 1000）发起一次新购买。\n> 步骤 2：创建一个新的购买订单，`po_id` 值为 12500。\n> 步骤 3：John\
  \ Smith 选择了 1 把锤子、2 把螺丝刀和 3 把扳手。\n> 步骤 4：屏幕上显示关联价格 20.00、16.00 和 30.00。\n> 步骤 5：显示小计金额，为\
  \ 66.00。\n> 步骤 6：显示税费 6.60（税率为 10%）。\n> 步骤 7：显示总费用 72.60。\n\n步骤 8 将允许 John Smith\
  \ 移除某个物品、增加/减少每个所选物品的数量、删除物品或取消购买订单。步骤 9 将允许 John Smith 进行支付。再次，为了简单起见，我们假设步骤 8\
  \ 和步骤 9 是可用的。\n\n注意，步骤 8 涉及用购买订单详情更新我们的几张表。步骤 9 为创建订单的日期创建一个时间戳，以及购买订单的状态（“已支付”与“待处理”）。购买订单的状态用于生成报告，以显示逾期付款的客户（可能还会向他们发送友好的提醒）。有时公司有一种基于奖励的系统，按时付款的客户可以收集积分，这些积分可用于其他购买（换句话说，这是一种折扣机制）。\n\
  \n### 详细表描述\n\n如果你能视觉化上一节中描述的用例，你可能看到我们需要一张表来存储特定客户的信息，另一张表来存储购买订单（以某种方式与关联的客户链接），一张包含所购物品详情和数量的表（通常称为“行项目”），以及一张包含每个工具信息的表（包含名称和价格）。因此，我们网站的\
  \ RDBMS 需要以下表：\n\n```\ncustomers\npurchase_orders\nline_items\nitem_desc\n```\n\n\
  接下来的章节将描述上述表的内容及其之间的关系。\n\n#### customers 表\n\n虽然指定 `customers` 表属性有多种方法，你需要足够的信息来唯一标识表中的每个客户。类比，除了\
  \ `cust_id` 外，向某人寄信封需要以下信息：\n\n```\ncust_id\nfirst_name\nlast_name\nhome_address\n\
  city\nstate\nzip_code\n```\n\n我们将使用上述列表中的属性创建 `customers` 表。注意，`cust_id` 属性被称为键，因为它能唯一标识每个客户。虽然我们不会讨论键在\
  \ `RDBMS` 中的作用，但显然我们需要一种唯一标识客户的机制。\n\n每我们需要引用特定客户的详情时，我们将使用 `cust_id` 的关联值从 `customers`\
  \ 表的对应行中检索详情。\n\n上述段落描述了 `RDBMS` 中关联表 `T1` 和 `T2` 的本质：`T1` 中的键作为属性值存储在 `T2` 中。如果我们需要访问表\
  \ `T3` 中的关联信息，我们将 `T2` 中的键作为属性值存储在 `T3` 中。\n\n注意，生产系统中的 `customers` 表会包含其他属性，如下：\n\
  \n```\ntitle（先生、女士、小姐等）\nshipping_address\ncell_phone\n```\n\n为了简单起见，我们将使用初始属性集来定义\
  \ `customers` 表。之后，你可以将新属性添加到三个表模式中，使其更像现实系统。\n\n为了使此表更具体，假设以下信息属于客户 John Smith，他被分配了\
  \ `cust_id` 1000：\n\n```\ncust_id: 1000\nfirst_name: John\nlast_name: Smith\nhome_address:\
  \ 1000 Appian Way\ncity: Sunnyvale\nstate: California\nzip_code: 95959\n```\n\n\n\
  \n\n每当 John Smith 进行新购买时，我们都会使用 `cust_id` 值 1000 在 `purchase_order` 表中为该客户创建新的一行。\n\
  \n### purchase_orders 表\n\n当客户访问网站时，我们需要创建一个购买订单，并将其作为新行插入到 `purchase_orders` 表中。虽然你可能倾向于将所有客户的详细信息都放在新行中，但我们将通过关联的\
  \ `cust_id` 来识别客户，并改用该值。\n\n请注意，每当有新用户在网站注册时，我们都会在 `customers` 表中创建一个新行，而对于回头客，则是通过现有的\
  \ `cust_id` 来识别的，该 ID 必须通过客户在主 Web 页面输入框中输入的信息搜索 `customers` 表来确定。\n\n我们看到 `customers`\
  \ 表包含一个键属性；同样地，`purchase_orders` 表需要一个我们称之为 `po_id` 的属性（你可以自由使用不同的字符串）来识别特定客户的购买订单。\n\
  \n请记住以下细节：具有特定 `po_id` 的行还需要一个 `cust_id` 属性，用于识别正在当前购买的客户（在 `customers` 表中）。\n\n\
  虽然定义一组合适的属性有多种方法，但让我们使用以下属性集用于 `purchase_orders` 表：\n\n```\npo_id\ncust_id\npurchase_date\n\
  ```\n\n例如，假设客户 John Smith（其 `cust_id` 为 1000）在 2021 年 12 月 15 日购买了一些工具。关系型数据库管理系统（RDBMS）支持几十种不同的日期格式：简单起见，我们将使用\
  \ `MM-DD-YYYY` 格式（你可以根据特定需求进行更改）。\n\n那么 John Smith 在 `purchase_orders` 中的新行看起来如下所示：\n\
  \n```\npo_id: 12500\ncust_id: 1000\npurchase_date: 12-01-2021\n```\n\n### line_items\
  \ 表\n\n作为一个例子，假设客户 John Smith 在他最近的购买订单中请求了 1 把锤子、2 把螺丝刀和 3 把扳手。这些购买物品中的每一个项目都需要\
  \ `line_items` 表中对应一行，且该行：\n\n* 由 `line_id` 值识别\n* 指定每个所购物品的数量\n* 包含 `purchase_orders`\
  \ 表中关联的 `po_id` 值\n* 包含 `item_desc` 表中关联的 `item_id` 值\n\n为了简单起见，我们将值 5001、5002 和\
  \ 5003 分配给 `line_items` 表中三个新行的 `line_id` 属性，这三行分别代表当前购买订单中的锤子、螺丝刀和扳手物品。一个 `line_item`\
  \ 行可能如下：\n\n```\npo_id: 12500\nline_id: 5001\nitem_id: 100 <= 我们很快会讨论这个\nitem_count:\
  \ 1\nitem_price: 20.00\nitem_tax:  2.00\nitem_subtotal: 22.00\n```\n\n注意，在前面的 `line_item`\
  \ 中没有 `cust_id`：这是因为采用了自上而下的数据检索方法。具体来说，我们从一个特定的 `cust_id` 开始，用它来在 `purchase_orders`\
  \ 表中查找属于该 `cust_id` 的购买订单列表，并且对于 `purchase_orders` 表中的每一个购买订单，我们在 `line_items` 表中搜索关联的行项目项目。此外，我们可以对\
  \ `cust_id` 值列表中的每个客户重复上述操作步骤。\n\n回到之前的 `line_item` 细节：我们需要通过 `item_desc` 表中关联的标识符来引用每个购买的物品。再次，我们将任意地为锤子、螺丝刀和扳手物品分别分配\
  \ 100、200 和 300 的 `item_id` 值。在你的应用程序中，实际值无疑会有所不同，因此数字 100、200 和 300 并没有特殊的意义。\n\
  \n`line_items` 表中的这三行（它们属于同一个购买订单）看起来如下所示（我们稍后会查看相应的 SQL 语句）：\n\n```\npo_id: 12500\n\
  line_id: 5001\nitem_id: 100\nitem_count: 1\nitem_price: 20.00\nitem_tax:  2.00\n\
  item_subtotal: 22.00\n\npo_id: 12500\nline_id: 5002\nitem_id: 200\nitem_count: 2\n\
  item_price: 8.00\nitem_tax:   1.60\nitem_subtotal: 17.60\n\npo_id: 12500\nline_id:\
  \ 5003\nitem_id: 300\nitem_count: 3\nitem_price: 10.00\nitem_tax:    3.00\nitem_subtotal:\
  \ 33.00\n```\n\n### item_desc 表\n\n回想一下，`customers` 表包含每个客户的信息，每当客户在网站创建账户时都会创建一个新行。类似的，`item_desc`\
  \ 表包含了每个物品（产品）的信息。`item_desc` 表的更新比 `customers` 表频繁，在以下情况：\n\n* 新工具上架\n* 现有工具不再售卖\n\
  \n因此，`item_desc` 表包含了客户可以购买的所有工具。至少，它是“真理来源”：\n\n```\nSELECT *\nFROM item_desc;\n\
  ```\n+---------+-------------+-------+\n| item_id | item_desc   | price |\n| 100\
  \ | hammer      | 20.00 |\n| 200 | screwdriver | 8.00 |\n| 300 | wrench      | 10.00\
  \ |\n\n还有一个重要的细节需要讨论：如果某个物品不再售卖，我们可以简单地删除它的行吗？答案是“否”，因为我们需要它来生成报告。因此，添加一个名为 `AVAILABLE`（或类似的）属性包含\
  \ 1 或 0，以指示产品是否可用。结果，涉及该表的某些 SQL 查询也将考虑这一点。\n\n### 什么是 SQL\n\n结构化查询语言（SQL）用于管理表中的数据。事实上，SQL\
  \ 是用于处理结构化数据库的标准语言。在高级术语中，用于检索数据的 SQL 语句通常涉及以下内容：\n\n* 你想要的数据 (`SELECT`)\n* 数据所在的表\
  \ (`FROM`)\n* 数据的任何条件 (`WHERE`)\n\n例如，假设有一个 `friends` 表包含 `lname` 和 `fname` 属性（分别是姓和名），用于表示一组朋友，且该表中的每一行都包含关于一个朋友的信息。在第\
  \ 2 章中，我们讨论了如何创建数据库表以及如何向表中填充数据，但现在我们只需假设这些任务已经完成。那么，检索 `friends` 表中人员姓和名的 SQL 语句如下：\n\
  \n```sql\nSELECT lname, fname\nFROM friends;\n```\n\n假设 `friends` 表还包含一个 `height`\
  \ 属性，即 `friends` 表中每个人的数字（厘米）。我们可以扩展之前的 SQL 语句，指定我们需要身高小于 180 的人员（行）：\n\n```sql\n\
  SELECT lname, fname\nFROM friends\nWHERE height < 180;\n```\n\nSQL 提供了大量的关键字，允许你指定从多个表中检索数据的复杂查询。上述两个\
  \ SQL 语句都称为 DML 语句，它是 SQL 语句的四个类别之一：\n\n* DCL（数据控制语言）\n* DDL（数据定义语言）\n* DQL（数据查询语言）\n\
  * DML（数据操作语言）\n\n接下来的章节将为上述列表中的每项提供更多信息。\n\n\n\n\n\n# DCL, DDL, DQL, DML, 和 TCL\n\
  \n数据控制语言（DCL）指的是任何包含 `GRANT` 或 `REVOKE` 关键字的 SQL 语句。这两个关键字都会影响对特定用户授予或撤销的权限。\n\n\
  数据定义语言（DDL）包括任何指定内容的 SQL 语句：`CREATE`、`ALTER`、`DROP`、`RENAME`、`TRUNCATE` 或 `COMMENT`。这些\
  \ SQL 关键字通常与数据库表以及（在许多情况下）数据库视图（后文讨论）配合使用。\n\n数据查询语言（DQL）指的是任何包含 `SELECT` 关键字的 SQL\
  \ 语句。\n\n数据操作语言（DML）指的是对数据库中的一个或多个表执行查询的 SQL 语句。这些 SQL 语句包含 `INSERT`、`UPDATE`、`DELETE`、`MERGE`、`CALL`、`EXPLAIN\
  \ PLAN` 或 `LOCK TABLE` 中的任何关键字。在大多数情况下，这些关键字会修改一个或多个表中现有数据的值。\n\n事务控制语言（TCL）包括 `COMMIT`、`ROLLBACK`、`SAVEPOINT`\
  \ 或 `SET TRANSACTION` 关键字，这些都是本书书中未讨论的高级概念。\n\n# SQL 权限\n\nSQL 中提供两种权限，本节将对两者进行简要描述。这些权限指的是数据库对象（如数据库表和索引），将在后续章节中进行更详细讨论。\n\
  \n系统权限涉及特定类型的对象，并规定了在对象上执行一个或多个操作的权利。此类操作包括管理员允许用户执行任务，例如 `ALTER ANY INDEX`、`ALTER\
  \ ANY CACHE GROUP`、`CREATE/ALTER/DELETE TABLE` 或 `CREATE/ALTER/DELETE VIEW`。\n\n\
  对象权限允许用户对对象或其他用户的对象（如表、视图和索引）执行操作。额外的对象权限包括 `EXECUTE`、`INSERT`、`UPDATE`、`DELETE`、`SELECT`、`FLUSH`、`LOAD`、`INDEX`\
  \ 和 `REFERENCES`。\n\n# SQL 语句的属性\n\nSQL 语句和函数区分大小写，但引号文本区分大小写。以下是一些示例：\n\n```sql\n\
  \ select VERSION();\n+-----------+\n| VERSION() |\n+-----------+\n| 8.0.21    |\n\
  +-----------+\n1 row in set (0.000 sec)\n\nMySQL [mytools]> SeLeCt Version();\n\
  +-----------+\n| Version() |\n+-----------+\n| 8.0.21    |\n+-----------+\n1 row\
  \ in set (0.000 sec)\n```\n\n请记住关于 SQL 语句的以下有用细节：\n\n- SQL 语句不区分大小写。\n- SQL 语句可以跨单行或多行。\n\
  - 关键字不能缩写或跨行拆分。\n- 子句通常放在单独的行。\n- 缩进是为了增强可读性。\n\n# CREATE 关键字\n\n通常情况下，你有时会使用 `CREATE`\
  \ 关键字创建数据库，但更多时候是使用它来创建表、视图和索引。然而，以下列表包含了你可以通过 `CREATE` 语句创建的所有对象：\n\n```\n DATABASE\n\
  EVENT\nFUNCTION\nINDEX\nPROCEDURE\nTABLE\nTRIGGER\nUSER\nVIEW\n```\n\n本文仅讨论了特定数据库的示例，而在线文章则深入探讨了上述列表中其他主题。\n\
  \n# 什么是 MySQL？\n\nMySQL 是一个开源数据库，具有移植性，并提供了许多商业数据库中可用的功能。Oracle 是 MySQL 数据库的守护者，你可以在以下网站下载它：\n\
  \n[`www.mysql.com/downloads/`](https://www.mysql.com/downloads/)\n\nMySQL 还提供了一个用于执行数据库相关操作的\
  \ GUI 接口。MySQL 8 提供了以下新功能：\n\n- 事务型数据字典\n- 对 `BLOB`、`TEXT`、`GEOMETRY` 和 `JSON` 数据类型的改进支持\n\
  \n正如你在第 7 章](#ch07.xhtml) 中看到的，MySQL 支持可插件存储引擎，例如 `InnoDB`。\n\n# 关于 MariaDB？\n\n\
  MariaDB 是 MySQL 的一个分支，它具有许多 MySQL 的特性。MariaDB 是 MySQL 的一个分支，它具有许多 MySQL 的特性。MariaDB\
  \ MariaDB MariaDB MariaDB MariaDB MariaDB MariaDB MariaDB MariaDB MariaDB MariaDB\
  \ MariaDB MariaDB MariaDB MariaDB MariaDB MariaDB\n\n# 安装 MySQL\n\nMariaDB 是 MySQL\
  \ 的一个分支，它具有许多 MySQL 的特性。在长度在创建表时声明的固定长度。  MySQL  。\n\n你可以通过以下命令安装 MySQL：\n\n```bash\n\
  $ mysql\n\n\n\n -p\n```\n\n# MySQL 中的数据类型\n\n本节包含了 MySQL 支持的类型列表，随后是关于某些类型的详细说明：\n\
  \n- `BIT` 类型用于存储位值。\n- `BOOLEAN` 类型存储真/假。\n- `CHAR` 类型用于固定长度字符串。\n- `DATE` 类型用于存储日期。\n\
  - `DATETIME` 类型用于存储日期和时间。\n- `DECIMAL` 类型用于精确数值。\n- `ENUM` 类型是存储字符串的紧凑方式。\n- `INT`\
  \ 类型用于整数。\n- `JSON` 类型用于存储 JSON 文档。\n- `TEXT` 类型用于存储文本。\n- `TIME` 类型用于存储时间。\n- `TIMESTAMP`\
  \ 类型用于更广泛的时间范围。\n- `TO_SECONDS` 类型用于时间时间秒。\n- `VARCHAR` 类型用于变长度字符串。\n- `XML` 类型提供对\
  \ XML 文档的支持。\n\n# CHAR 和 VARCHAR\n\n`CHAR` 类型在创建表时具有固定列长度，范围从 1 到 255。`CHAR` 值会在右侧填充空格，并在检索\
  \ `CHAR` 值时删除末尾空格。\n\n相比之下，`VARCHAR` 类型表示变长度的 `CHAR` 值，长度在 1 到 2000 之间，并占用 `NULL`\
  \ 空间。\n\n相比之下，`VARCHAR2` 类型表示变长度的 `CHAR` 值，长度在 1 到 4000 之间，但不能占用 `NULL` 空间。因此，`VARCHAR2`\
  \ 的性能优于 `VARCHAR`。\n\n# 字符串数据类型\n\n之前的项目列表包含各种字符串类型，后者已被提取并放在下面的单独列表中以便你使用：\n\n\
  ```\n BLOB\nCHAR\nENUM\nSET\nTEXT\nVARCHAR\n```\n\n`ENUM` 数据类型是字符串对象，指定了一组预定义值，可以在创建表时使用：\n\
  \n```sql\n CREATE TABLE PIZZA(name ENUM('Small', 'Medium','Large'));\nQuery OK,\
  \ 0 rows affected (0.021 sec)\n\nDESC pizza;\n+-------+--------------------------------+------+-----+---------+-------+\n\
  | Field | Type                           | Null | Key | Default | Extra |\n+-------+--------------------------------+------+-----+---------+-------+\n\
  | name  | enum('Small','Medium','Large') | YES  |     | NULL    |       |\n+-------+--------------------------------+------+-----+---------+-------+\n\
  1 row in set (0.004 sec)\n```\n\n\n\n\n\n# BLOB 和 TEXT 数据类型\n\n二进制大对象（`BLOB`）可以存储任意数量的数据。共有四种\
  \ BLOB 类型，它们唯一的区别在于最大长度：\n\n```\nTINYBLOB\nBLOB\nMEDIUMBLOB\nLONGBLOB\n```\n\nTEXT\
  \ 数据类型是一种不区分大小写的 BLOB，共有四种 TEXT 类型，它们的区别在于最大长度（所有这些类型都是非标准数据类型）：\n\n```\nTINYTEXT\n\
  TEXT\nMEDIUMTEXT\nLONGTEXT\n```\n\n请记住 BLOB 类型与 TEXT 类型之间的以下区别：`BLOB` 类型涉及区分大小大小写排序和比较，而这些操作对于\
  \ `TEXT` 类型来说是不区分大小写的。\n\n# MYSQL 数据库操作\n\n你可以对 MySQL 数据库执行若干操作，如下所示：\n\n* 创建数据库\n\
  * 导出数据库\n* 丢数据库\n* 重命名数据库\n\n你将在接下来的小节中看到如何执行上述每个列表项的示例。\n\n## 创建数据库\n\n登录 MySQL\
  \ 并调用以下命令创建 `mytools` 数据库：\n\n```\nMySQL [mysql]> create database mytools;\nQuery\
  \ OK, 1 row affected (0.004 sec)\n```\n\n使用以下命令选择 `mytools` 数据库：\n\n```\nMySQL [(none)]>\
  \ use mytools;\nReading table information for completion of table and column names\n\
  You can turn off this feature to get a quicker startup with -A\nDatabase changed\n\
  ```\n\n## 显示数据库列表\n\n通过调用以下 SQL 语句显示现有数据库：\n\n```\nmysql> SHOW DATABASES;\n```\n\
  \n上述命令显示了以下输出（输出将根据你的机器而有所不同）：\n\n```\n+--------------------+\n| Database      \
  \     |\n+--------------------+\n| beans              |\n| information_schema |\n\
  | minimal            |\n| mysql              |\n| mytools            |\n| performance_schema\
  \ |\n| sys                |\n+--------------------+\n9 rows in set (0.002 sec)\n\
  ```\n\n## 显示数据库用户列表\n\n通过调用以下 SQL 语句显示现有用户：\n\n```\nmysql> select user from mysql.user;\n\
  ```\n\n上述命令显示了以下输出：\n\n```\n+------------------+\n| user             |\n+------------------+\n\
  | mysql.infoschema |\n| mysql.session    |\n| mysql.sys        |\n| root       \
  \      |\n+------------------+\n4 rows in set (0.001 sec)\n```\n\n## 丢弃数据库\n\n登录\
  \ MySQL 并调用以下命令创建、选择然后丢弃 `pizza` 数据库：\n\n```\nMySQL [(none)]> create database pizza;\n\
  Query OK, 1 row affected (0.004 sec)\n\nMySQL [(none)]> use pizza;\nDatabase changed\n\
  MySQL [pizza]> drop database pizza;\nQuery OK, 0 rows affected (0.007 sec)\n```\n\
  \n虽然在不包含任何数据的数据库上执行此任务似乎毫无意义，但它是简单的，而且如果将来有需要执行此任务的时候，你已经已经该如何操作了。\n\n# 导出数据库\n\n\
  虽然你现在有一个空的数据库，但了解导出数据库的步骤仍然很好，这可以作为备份，并提供了一种在另一台机器上创建现有数据库副本的简单方法。\n\n为了说明，让我们首先在\
  \ MySQL 中创建一个名为 `minimal` 的数据库，如下所示：\n\n```\nMySQL [mytools]> create database minimal;\n\
  Query OK, 1 row affected (0.006 sec)\n```\n\n接下来，调用 `mysqldump` 命令导出 `minimal` 数据库，如下所示：\n\
  \n```\nmysqldump -u username -p\"password\" -R minimal > minimal.sql\n```\n\n注意上述命令中的以下细节。首先，在\
  \ `-p` 标志和密码之间没有插入空格，以便跳过命令行输入密码的提示。其次，确保省略引号。第三，`-R` 标志指示 `mysqldump` 除了数据库数据外，还复制存储的过程和函数。\n\
  \n此时，你可以在 `minimal` 数据库中创建表，并定期导出其内容。列表 4.1 显示了 `minimal.sql` 的内容，它是 `minimal` 数据库的完整描述。\n\
  \n***列表 4.1：minimal.sql***\n\n```\n-- MariaDB dump 10.18  Distrib 10.5.8-MariaDB,\
  \ for osx10.15 (x86_64)\n--\n-- Host: localhost    Database: minimal\n-- ------------------------------------------------------\n\
  -- Server version      8.0.21\n\n/*!40101 SET @OLD_CHARACTER_SET_CLIENT=@@CHARACTER_SET_CLIENT\
  \ */;\n/*!40101 SET @OLD_CHARACTER_SET_RESULTS=@@CHARACTER_SET_RESULTS */;\n/*!40101\
  \ SET @OLD_COLLATION_CONNECTION=@@COLLATION_CONNECTION */;\n/*!40101 SET NAMES utf8mb4\
  \ */;\n/*!40103 SET @OLD_TIME_ZONE=@@TIME_ZONE */;\n/*!40103 SET TIME_ZONE='+00:00'\
  \ */;\n/*!40014 SET @OLD_UNIQUE_CHECKS=@@UNIQUE_CHECKS, UNIQUE_CHECKS=0 */;\n/*!40014\
  \ SET @OLD_FOREIGN_KEY_CHECKS=@@FOREIGN_KEY_CHECKS, FOREIGN_KEY_CHECKS=0 */;\n/*!40101\
  \ SET @OLD_SQL_MODE=@@SQL_MODE, SQL_MODE='NO_AUTO_VALUE_ON' */;\n/*!40101 SET @OLD_CHARACTER_SET_CLIENT=@@CHARACTER_SET_CLIENT\
  \ */;\n/*!40101 SET @OLD_CHARACTER_SET_RESULTS=@@CHARACTER_SET_RESULTS */;\n/*!40101\
  \ SET @OLD_COLLATION_CONNECTION=@@COLLATION_CONNECTION \\|_{\n/*!40101 SET NAMES\
  \ utf8mb4 */;\n/*!40103 SET @OLD_TIME_ZONE=@@TIME_ZONE */;\n/*!40103 SET TIME_ZONE='+00:00'\
  \ */;\n/*!40014 SET @OLD_UNIQUE_CHECKS=@@UNIQUE_CHECKS, UNIQUE_CHECKS=0 */;\n/*!40014\
  \ SET @OLD_FOREIGN_KEY_CHECKS=@@FOREIGN_KEY_CHECKS, FOREIGN_KEY_CHECKS=0 */;\n/*!40101\
  \ SET @OLD_SQL_MODE=@@SQL_MODE, SQL_MODE='NO_AUTO_VALUE_ON' */;\n\n-- Dump completed\
  \ on 'minimal'\n```\n\n# 重命名数据库\n\n虽然你现在有一个空的数据库，但了解如何重命名数据库仍然很好（旧版本的 MySQL 提供了\
  \ `RENAME DATABASE` 命令来重命名数据库；然而，新版本的 MySQL 删除了此功能以避免安全风险）。幸运的是，你可以通过涉及多个 MySQL\
  \ 工具的三个步骤来重命名 `OLDDB`（你需要替换为要重命的数据库）为 `NEWDB`（替换为实际数据库名称）：\n\n* 创建 `OLDDB` 的导出副本。\n\
  * 创建名为 `NEWDB` 的新数据库。\n* 将数据从 `OLDDB` 导入到 `NEWDB`。\n\n调用以下命令执行步骤 1：\n\n```\nmysqldump\
  \ -u username -p\"password\" -R OLD_DB > OLD_DB.sql\n```\n\n调用以下命令执行步骤 2：\n\n```\n\
  mysqladmin -u username -p\"password\" create NEWDB\n```\n\n调用以下命令执行步骤 3：\n\n```\n\
  mysql -u username -p\"password\" NEWDB < OLD_DB.sql\n```\n\n登录 MySQL 并选择新数据库以验证一切运行正常：\n\
  \n```\nMySQL [mysql]> use NEWDB;\nDatabase changed\n```\n\n## INFORMATION_SCHEMA\
  \ 表\n\n`INFORMATION_SCHEMA` 表允许你检索有关给定列的信息。\n\n```\n TABLE_SCHEMA\nTABLE_NAME\n\
  COLUMN_NAME\nORDINAL_POSITION\nCOLUMN_DEFAULT\nIS_NULLABLE\nDATA_TYPE\nCHARACTER_MAXIMUM_LENGTH\n\
  NUMERIC_PRECISION\nNUMERIC_SCALE\nDATETIME_PRECISION\n```\n\n例如，让我们查看配套文件中提供的 `weather`\
  \ 表结构（详情请见前言）：\n\n```\nMySQL [mytools]> desc weather;\n+----------+----------+------+-----+---------+-------+\n\
  | Field    | Type     | Null | Key | Default | Extra |\n+----------+----------+------+-----+---------+-------+\n\
  | day      | date     | YES  |     | NULL    |       |\n| temper   | int      |\
  \ YES  |     | NULL    |       |\n| wind     | int      | YES  |     | NULL    |\
  \       |\n| forecast | char(20) | YES  |     | NULL    |       |\n| city     |\
  \ char(20) | YES  |     | NULL    |       |\n| state    | char(20) | YES  |    \
  \ | NULL    |       |\n+----------+----------+------+-----+---------+-------+\n\
  6 rows in set (0.001 sec)\n```\n\n我们可以通过以下 查询 查询获取有关 `weather` 表列的更多信息：\n\n\n\n\n\
  \n```\n SELECT COLUMN_NAME, DATA_TYPE, IS_NULLABLE, COLUMN_DEFAULT\nFROM INFORMATION_SCHEMA.COLUMNS\n\
  WHERE TABLE_NAME = 'weather'\nAND table_schema = 'mytools';\n```\n\n上述 查询 查询生成以下输出：\n\
  \n```\n +-------------+-----------+-------------+----------------+\n| COLUMN_NAME\
  \ | DATA_TYPE | IS_NULLABLE | COLUMN_DEFAULT |\n+-------------+-----------+-------------+----------------+\n\
  | city        | char      | YES         | NULL           |\n| day         | date\
  \      | YES         | NULL           |\n| forecast    | char      | YES       \
  \  | NULL           |\n| state       | char      | YES         | NULL          \
  \ |\n| temper      | int       | YES         | NULL           |\n| wind        |\
  \ int       | YES         | NULL           |\n+-------------+-----------+-------------+----------------+\n\
  6 rows in set (0.001 sec)\n```\n\n### PROCESSLIST 表\n\n`PROCESSLIST` 表包含有关 SQL 语句状态的信息。当你想要查看表上表级或行级锁的状态时，这些信息非常有用。以下\
  \ SQL 语句展示了该表内容的一个示例：\n\n```\n MySQL [mytools]> show processlist;\n+----+-----------------+-----------+---------+---------+--------+------------------------+------------------+\n\
  | Id | User            | Host      | db      | Command | Time   | State        \
  \          | Info             |\n+----+-----------------+-----------+---------+---------+--------+------------------------+------------------+\n\
  |  5 | event_scheduler | localhost | NULL    | Daemon  | 138765 | Waiting on empty\
  \ queue | NULL             |\n|  9 | root            | localhost | mytools | Query\
  \   |      0 | starting               | show processlist |\n+----+-----------------+-----------+---------+---------+--------+------------------------+------------------+\n\
  2 rows in set (0.000 sec)\n```\n\n### SQL 格式化工具\n\n正如你预期的，SQL 语句有多种格式样式，你可以浏览它们以确定哪种样式最吸引你。以下链接是一个在线\
  \ SQL 格式化工具：\n\nhttps://codebeautify.org/sqlformatter\n\n以下链接包含 18 个 SQL 格式化工具，其中一些是付费的，另一些是免费的：\n\
  \nhttps://www.sqlshack.com/sql-formatter-tools/\n\n以下链接包含 SQL 格式化规范列表（即：它不是关于格式化工具的）：\n\
  \nhttps://opendatascience.com/best-practices-sql-formatting\n\n在一个已经建立了 SQL 格式化规则的环境中工作，将该样式与上述链接中\
  \ SQL 格式化工具的样式进行对比可能会意思。\n\n如果你是一个独立学习的 SQL 初学者，在通过此本书学习更多 SQL 语句的过程中，探索这些链接也是值得的。随着你对编写\
  \ SQL 语句知识的增加，你会在博客文章遇到各种样式，这意味着你也会注意到这些博客采用了哪些规范来格式化 SQL 语句。\n\n### 总结\n\n本章从介绍\
  \ RDBMS（关系型数据库管理系统）的概念以及使用 RDBMS 的理由开始。特别地，你看到了包含单张表、两个表和四张表的 RDBMS 示例（大得多的 RDBMS\
  \ 多之不完）。\n\n然后，你对数据库范式化的概念有了简要介绍，以及这样做如何帮助你在 RDBMS 中维护数据完整性（“单一真理来源”）。\n\n接下来，你学习了一个包含四表的数据库的结构，该数据库通过\
  \ Web 页面跟踪客户对工具的购买情况。你还看到了哪些表具有一对多的关系，以便你可以找到属于特定购买订单的所有行项目。\n\n此外，你还对 SQL 进行了简要介绍并了一些基本的\
  \ SQL 查询示例。你还学习了可以分类为 DCL、DDL、DQL 或 DML 的各种类型的 SQL 语句。\n\n# 第 5 章\n\n## JAVA、JSON\
  \ 和 XML\n\n本章适用于任何需要使用 Java 访问存储在 MySQL 表中的数据的人。虽然本章对所有其他用户来说可能是可选的，但如果你预计未来某个时刻会涉及到\
  \ Java 和 MySQL 工作，即使你只是好奇用于管理 MySQL 数据库中数据的 Java 代码，浏览其内容也是值得关注的。\n\n请记住，本章并不包含对\
  \ Java、XML 或 JSON 的技术介绍。然而，Java 代码示例执行了基本功能，例如通过 Java 创建数据库表，随后是来自 MySQL 数据库的插入、选择和删除数据的代码示例。因此，关于上述技术的简短教程可能就足够让你理解\
  \ Java 代码示例了。\n\n简而言之，本章将帮助你学习如何使用 Java 在 MySQL 数据库中执行 CRUD（创建、替换、更新和删除）操作。第一节向你展示了如何使用\
  \ Java 创建关系型数据库以及关系表。你将学习在哪里下载 `JDBC`（Java 数据库连接）所需的 `JAR`（Java 存档）文件。此外，你将看到如何编译\
  \ Java 类并启动编译后的 Java 代码。本节还包含向此类表插入数据的示例，以及如何使用 Java 获取这些数据。\n\n第一节包含了通过 Java 代码创建\
  \ MySQL 数据库的 Java 代码示例。你还将学习如何创建 MySQL 表并填充该表。\n\n第二节包含了允许你处理基于 JSON 数据的 Java 代码示例。你将学习如何为\
  \ JSON 数据创建表，如何将 JSON 数据插入到该表中，然后如何检索这些数据，所有操作都由 Java 代码完成。\n\n第三节包含了允许你处理基于 XML\
  \ 数据的 Java 代码示例。你将学习如何为 XML 数据创建表，如何将 XML 数据插入到该表中，然后如何获取这些数据，所有操作都由 Java 代码完成。\n\
  \n### 使用 Java 操作 MySQL\n\n用于 MySQL（以及其他数据库）的 Java 代码需要一个包含连接数据库和执行 SQL 语句相关类的 `JAR`\
  \ 文件。设置步骤包括为你的电脑下载 Java、下载 `JDBC` 驱动文件以及更新 `CLASSPATH` 环境变量。\n\n#### 执行设置步骤\n\n\
  用于 Java 与数据库通信的 `JAR` 文件被称为 `JDBC` 驱动程序，适用于 MySQL 的 `JAR` 文件可以在此处下载：\n\nhttps://dev.mysql.com/downloads/connector/j/\n\
  \n步骤 1：下载、解压缩适用于你平台的驱动文件，并将 `JAR` 文件 `mysql-connector-java-8.0.24.jar` 放置在方便的位置。注意，该\
  \ `JAR` 文件位于解压缩驱动文件的一个子目录下。\n\n步骤 2：更新 `CLASSPATH` 环境变量，如下所示：\n\n```bash\nexport\
  \ CLASSPATH=$CLASSPATH:.:mysql-connector-java-8.0.24.jar:\n```\n\n\n\n\n如果 JAR 文件和编译后的\
  \ Java 类位于同一个目录，则前面的代码段可以正常工作。\n\n建议：如果你熟悉基础 shell 脚本，可以将前面的 export 代码段放置在一个 shell\
  \ 脚本中，每需要设置 `CLASSPATH` 环境变量时通过 source（“dot”）命令来加载该脚本。\n\n## 在 Java 中创建 MySQL 数据库\n\
  \n本节包含用于创建 mytools 数据库的 Java 代码示例。如果你已经导入了 mytools 数据库，请修改列表 5.1 中 `URL` 变量的值以指定不同的数据库。访问\
  \ MySQL 数据库的 Java 代码示例中需要更新的变量限于 `URL`、`USER` 和 `PASS`。\n\n列表 5.1 显示了 Java 文件 `CreateDataBase.java`\
  \ 的内容，该文件演示了如何在 Java 中创建 MySQL 数据库。\n\n***列表 5.1：CreateDataBase.java***\n\n```\n\
  \ import java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.SQLException;\n\
  import java.sql.Statement;\n\npublic class CreateDataBase\n{\n   // specify the\
  \ URL and username/password to access MySQL\n   // the URL specifies the mytools\
  \ database that already exists:\n   static final String URL  = \"jdbc:mysql://localhost/mytools\"\
  ;\n   static final String USER = \"root\";\n   static final String PASS = \"yourpassword\"\
  ;\n\n   public static void main(String[] args)\n   {\n      // Open a connection\n\
  \      try(Connection conn =\n         DriverManager.getConnection(URL, USER, PASS);\n\
  \n         Statement stmt = conn.createStatement();\n      ) {\n         String\
  \ sql = \"CREATE DATABASE mytools\";\n         stmt.executeUpdate(sql);\n      \
  \   System.out.println(\"Database created\");\n      } catch (SQLException e) {\n\
  \         e.printStackTrace();\n      }\n   }\n}\n```\n\n列表 5.1 以几个 import 语句开始，指定了位于\
  \ JDBC JAR 文件中的 Java 类，该文件也包含在 `CLASSPATH` 环境变量中（否则代码将无法成功编译）。\n\n下部分代码初始化了字符串变量\
  \ `URL`、`USER` 和 `PASS`。将 mytools 替换为你自己的数据库（现有数据库或新数据库），并为 `PASS` 指定正确的值。\n\n列表\
  \ 5.1 的后续部分是 `main()` 方法，它包含一个 try/catch 块，在其中建立了数据库连接，并将字符串变量 `sql` 初始化为创建 mytools\
  \ 数据库的 SQL 语句。如果数据库创建成功，则会打印消息；如果发生错误，则 `catch()` 块将显示描述所遇错误的的堆栈跟踪。运行列表 5.1 中的代码，你将看到以下输出：\n\
  \n```\n Database created\n```\n\n如果 mytools 数据库已经存在，或者你多次运行列表 5.1，你将看到以下输出：\n\n\
  ```\n java.sql.SQLException: Can't create database 'mytools'; database exists\n\
  ```\n\n在这种种情况下，你有两个选择：\n\n1. 手动删除数据库。\n2. 在 Java 中执行 SQL 语句来删除数据库。\n\n你可以通过在列表 5.1\
  \ 中创建数据库的代码块*之前*插入以下 Java 代码段来执行选项 #2：\n\n```\n String drop1 = \"DROP DATABASE IF\
  \ EXISTS mytools\";\nstmt.executeUpdate(drop1);\n```\n\n注意：在删除此数据库之前，确保已将 mytools\
  \ 数据库导出到 SQL 文件。\n\n## 在 Java 中创建 MySQL 表\n\n列表 5.2 显示了文件 `CreateTable.java` 的内容，该文件演示了如何在\
  \ Java 中创建 MySQL 表。\n\n***列表 5.2：CreateTable.java***\n\n```\n // downloaded JAR\
  \ file contains the following Java classes:\nimport java.sql.Connection;\nimport\
  \ java.sql.DriverManager;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\
  \npublic class CreateTable\n{\n   // specify the URL and username/password to access\
  \ MySQL\n   // the URL specifies the mytools database that already exists:\n   static\
  \ final String URL  = \"jdbc:mysql://localhost/mytools\";\n   static final String\
  \ USER = \"root\";\n   static final String PASS = \"yourpassword\";\n\n   public\
  \ static void main(String[] args)\n   {\n      // Step 1: open a connection:\n \
  \     try(Connection conn =\n         DriverManager.getConnection(URL, USER, PASS);\n\
  \n         Statement stmt = conn.createStatement();\n      ) {\n          // Step\
  \ 2: drop the table if it exists: otherwise the\n          // code will fail during\
  \ subsequent invocations with\n          // an error message that table 'friends'\
  \ already exists\n          String sql1 = \"DROP TABLE IF EXISTS FRIENDS \";\n\n\
