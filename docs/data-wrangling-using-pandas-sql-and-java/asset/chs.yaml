  )\n```\n\n### 在数据框中选择、添加和删除列\n\n本节包含短代码块，说明了如何对数据框进行类似于对字典的操作。例如，获取、设置和删除列的实现与类似的\
  \ Python 字典操作具有相同的语法，如下所示：\n\n```\ndf = pd.DataFrame.from_dict(dict([('A',[1,2,3]),('B',[4,5,6])]),\
  \ orient='index', columns=['one', 'two'])\n```\n\n在数据框中添加新列：\n\n```\ndf['C'] = [7,\
  \ 8, 9]\n```\n\n删除列：\n\n```python\ndel df['A']\n```\n\n设置列的值：\n\n```python\ndf['B']\
  \ = [10, 20, 30]\n```\n\n修改列的值：\n\n```python\ndf['B'] = [15, 25, 35]\n```\n\n获取列的值：\n\
  \n```python\ndf['B']\n```\n\n查看所有列名：\n\n```python\ndf.columns\n```\n\n选择多个列：\n\n\
  ```python\ndf[['one', 'two']]\n```\n\n使用 `iloc` 按位置选择：\n\n```python\ndf.iloc[:,\
