  \nListing 1.12 显示了 `UserInput2.py` 的内容，它提示用户输入字符串并在 `try/except` 块中尝试将字符串转换为数字。\n\
  \nListing 1.12 在将用户输入转换为数字的结果加上数字 `0`。如果转换成功，将显示一条包含用户输入的消息。如果转换失败，`except` 代码块将包含一个显示消息的\
  \ `print()` 语句。\n\n此代码示例使用了 `eval()` 函数，应该避免使用该函数，以防你的代码执行任意的（可能具有破坏性的）命令。\n\nListing\
  \ 1.13 显示了 `UserInput3.py` 的内容提示用户输入两个数字并在一对 `try/except` 块中尝试计算它们的和。\n\nListing\
  \ 1.13 包含两个 `try` 块，每个块后面都跟着一个一个 except` 语句。第一个 `try` 块尝试将用户提供的第一个数字加到变量 `sum`，第二个\
  \ `try` 块尝试将第二个用户提供的数字加到之前输入的数字。如果任一输入字符串不是有效数字，就会发生错误消息；如果两个都是有效数字，将显示一条包含输入数字及其和的消息。请务必阅读本章节前面提到的关于\
  \ `eval()` 函数的警告。\n\n### 命令行参数\n\nPython 提供了 `getopt` 模块来解析命令行选项和参数，而 `sys` 模块通过\
  \ `sys.argv` 访问任何命令行参数。这有两个作用：\n\n* `sys.argv` 是命令行参数的列表。\n* `len(sys.argv)` 是命令行参数的数量。\n\
  \n在这里，`sys.argv[0]` 是程序名，因此如果 Python 程序名为 `test.py`，它就匹配 `sys.argv[0]` 的值。\n\n现在你可以在命令行上为\
  \ Python 程序提供输入值，而不是通过提示用户输入来提供输入值。例如，考虑此处所示脚本 `test.py`：\n\n```\n #!/usr/bin/python\n\
  import sys\nprint('Number of arguments:',len(sys.argv),'arguments')\nprint('Argument\
  \ List:', str(sys.argv))\n```\n\n如下所示运行上述脚本：\n\n```\n python test.py arg1 arg2 arg3\n\
  ```\n\n这将产生以下结果：\n\n```\n Number of arguments: 4 arguments.\nArgument List: ['test.py',\
  \ 'arg1', 'arg2', 'arg3']\n```\n\n从命令行指定输入值提供了有用的功能。例如，假设你有一个自定义的 Python 类，包含 `add`\
  \ 和 `subtract` 方法来相加和相减一对数字。\n\n你可以使用命令行参数指定对数字数字执行哪种方法，如下：\n\n```\n python MyClass\
  \ add 3 5\npython MyClass subtract 3 5\n```\n\n此功能非常有用，因为你可以编程地执行 Python 类中的不同方法，这意味着你也可以为你的代码编写单元测试。\n\
  \nListing 1.14 显示了 `Hello.py` 的内容，向你展示了如何使用 `sys.argv`。\n\n```\n import sys\n\n\
  def main():\n  if len(sys.argv) >= 2:\n    name = sys.argv[1]\n  else:\n    name\
  \ = 'World'\n  print('Hello', name)\n\n# 调用 main() 的标准模板\nif __name__ == '__main__':\n\
  \  main()\n```\n\n\n\n\n\n在一个理想的世界里，所有数据集都处于完好状态，没有极值、缺失值或错误值。每个特征值都被正确捕获，没有任何混淆可能。此外，由于存在“通用标准”（它定义了所有可能的数据\
  \ set 的正确格式和可接受值），因此不需要日期格式、货币值或语言之间进行任何转换。\n\n当然，上段提到的所有场景都可能发生且确实会发生，这也是本章所讨论各种技术的原因。即使你成功创建了一个极其清洁且健壮的数据集，也可能出现其他问题，例如数据漂移（data\
  \ drift），将在下一节中进行描述。\n\n事实上，即使在机器学习模型部署到生产环境后，数据清洗的任务也并不意味着已经完成。例如，一个每天收集数 TB 或\
  \ PB 级数据的在线系统可能包含对模型性能产生不利影响的偏斜值。这些不利影响可以通过与生产模型相关的指标的变化揭示出来。\n\n#### **什么是数据漂移？**\n\
  \n数据的价值基于其准确性、相关性和年龄。`data drift` 指的是相关性降低的数据：在某些情况下，这种现象随着时间的推移而发生；而在其他情况下，是因为应用程序中与特征相关的变化导致某些数据不再具有相关性。\n\
  \n例如，由于各种因素（如不同类型客户的画像），2010 年的在线购买模式可能没有 2020 年的数据那样相关。另一个例子涉及手机库存：停产型号在类系统中的价值会降低。可能有多个因素影响特定数据集中的\
  \ `data drift`。\n\n处理数据漂移的两种技术是 `domain classifier`（领域分类器）和 `black-box shift detector`（黑盒偏移检测器），在网上都有讨论：\n\
  \n[`blog.dataiku.com/towards-reliable-mlops-with-drift-detectors`](https://blog.dataiku.com/towards-reliable-mlops-with-drift-detectors)\n\
  \n`data drift` 是三种漂移类型之一，所有类型都列在这里：\n\n*   概念漂移（Concept Drift）\n*   数据漂移（Data Drift）\n\
  *   上游数据变化（Upstream Data Changes）\n\n请进行在线查找以获取更多关于这些漂移类型的信息。\n\n### **什么是数据集？**\n\
  \n简单来说，`dataset` 数据源（如文本文件），包含数据的行和列。每一行通常被称为 `data point`（数据点），每一列被称为 `feature`（特征）。`dataset`\
  \ 可以有多种形式：CSV（逗号分隔值）、TSV（制表符分隔值）、Excel 表格、RDMBS 中的表格、NoSQL 数据库中的文档、Web 服务的输出等。正如你所看到的，人们需要分析\
  \ `dataset` 以确定哪些特征是最重要的，哪些特征可以安全地忽略，以便使用定的 `dataset` 训练模型。\n\n`dataset` 的规模从非常小（几个特征和\
  \ 100 行）到非常大（超过 1000 个特征和超过 100 万行）。如果你不熟悉问题领域，可能很难确定大型数据集中最重要的特征。在这种情况下，你可能需要一位领域专家，他们理解理解特征的重要性、特征之间的相互依赖关系（如果有）以及特征的数据值是否有效。\n\
  \n此外，还有算法（称为 `dimensionality reduction algorithms`，降维算法）可以帮助你确定最重要的特征，例如 `PCA`（主成分分析），这超出了本书的范围。\n\
  \n#### **数据预处理**\n\n数据预处理是验证 `dataset` 内容的初始步骤，涉及对缺失和错误数据值做出决策：\n\n*   处理缺失值\n*\
  \   清洗“噪声”文本数据\n*   移除 HTML 标签\n*   移除表情符号\n*   处理 Emoji/表情符号\n*   过滤数据\n*   分组数据\n\
  *   处理货币和日期格式\n\n数据清洗是数据整理（data wrangling）的子集，涉及移除不需要的数据和处理缺失数据。对于文本数据，你可能需要移除 HTML\
  \ 标签、标点符号等。对于数值数据，字母可能与数值数据混合。然而，具有数值特征的 `dataset` 可能存在错误值或缺失值（后文将讨论）。此外，计算特征值的最小值、最大值、平均值、中位数标准差显然仅适用于数值。\n\
  \n在预处理步骤完成后，会执行 `data wrangling`，即将数据转换为新格式。例如，你可能需要将来自多个源的数据合并到单个 `dataset`。在这种情况下，你可能需要在不同的测量单位（如日期格式和货币值）之间进行转换，以便以一致的方式在\
  \ `dataset` 中表示数据。\n\n货币和日期值是 `i18n`（国际化）的一部分；`L10n`（本地化）针对特定的国家、语言或地区。硬编码值（如文本字符串）可以存储在通常称为\
  \ `resource bundle`（资源包）的文件中，其中每个字符串通过代码引用。每种语言都有自己的资源包。\n\n### **数据类型**\n\n如果你写过计算机程序，那么你就知道许多编程语言存在显式数据类型，例如\
  \ C、C++、Java 和 TypeScript。某些编程语言（如 JavaScript 和 awk）不需要用显式类型初始化变量：变量的类型通过隐式类型系统动态推断（即一个不直接暴露给开发者的系统）。\n\
  \n在机器学习中，数据集可以包含不同类型的特征，例如以下一种或多种组合：\n\n*   数值数据（整数/浮点，以及离散/连续）\n*   字符/分类数据（不同语言）\n\
  *   日期相关数据（不同格式）\n*   货币数据（不同格式）\n*   二进制数据（是/否，0/1 等）\n*   名义数据（多个不相关的值）\n*   序数据（多个相关的值）\n\
  \n考虑一个包含房地产数据的数据集，它可能有 30 列（甚至更多），通常具有以下特征：\n\n*   房屋的卧室数量：数值值和离散值\n*   平方英尺：数值值和（可能的）连续值\n\
  *   城市名称：字符数据\n*   建造日期：日期值\n*   售价：货币值且可能为连续值\n*   “待售”状态：二进制数据（“是”或“否”）\n\n年度季节是名义数据的一个例子：尽管许多国家有四个季节，但有些国家只有两个不同的季节。然而，季节可以与不同的温度范围相关（夏季与冬季）。员工薪资等级是序数据的例子：1=初级，2=一年经验，等等。另一个名义数据的例子是颜色集合，例如\
  \ {红、绿、蓝}。\n\n分类数据将在本章稍后部分进行详细讨论。\n\n\n\n\n如果你幸运地继承了一个完完的数据集，那么数据清洗任务（后文将讨论）将大大简化：事实上，你可能不需要对该数据集进行任何`data\
  \ cleaning`。然而，如果你需要创建一个结合了多个数据集的数据集，而这些数据集包含不同日期和货币格式，那么你就需要将它们转换为通用格式。\n\n如果你需要训练一个包含分类数据特征的模型，那么你就需要将这些分类数据转换为数值数据。例如，泰坦尼克号（Titanic）数据集包含一个名为“性别”的特征，其值可能是男性或女性。正如你将在本章稍后部分看到的，`Pandas`\
  \ 可以非常简单地将男性“映射”到 `0`，将女性“映射”到 `1`。\n\n### 离散数据与连续数据\n\n`Discrete data`（离散数据）是一组可以计数的数值，而`continuous\
  \ data`（连续数据）必须通过测量。离散数据可以合理地放入下拉列表中，但做出这种判断并没有精确的数值。某人可能认为一个包含`500` 个值的列表是离散的，而另一个人可能认为它是连续的。例如，加拿大省份列表和美国州立列表是离散数据值，但世界国家数量（约`200`个）或世界语言数量（超过`7,000`种）也是如此吗？\n\
  \n温度、湿度和气压的数值被认为是连续的。货币也被视为连续的，尽管在两个连续值之间存在可衡量的差异。美国货币的最小单位是 1 美分，即美元的`1/100th`（基于会计的测量使用“密”，即美元的`1/1,000th`）。\n\
  \n连续数据类型可能存在细微的差异。例如，一个身高为 `200` 厘米的人是身高为 `100` 厘米的人的两倍（同样，`100` 公斤的人与 `50` 公斤的人也是如此）。但温度不同：`80`\
  \ 度华氏温度的热度不是 `40` 度华氏温度的两倍。\n\n此外，“连续”一词在数学中的含义并不一定与机器学习中的“连续”相同。在数学中，一个连续变量（假设在二维欧几里得平面上）可以具有不可计数的无限个值。然而，数据集中一个特征如果拥有比能“合理”显示在下拉列表中数量更多的值，它就会被视为连续变量。\n\
  \n例如，股票价格的数值是离散的：它们之间的差异至少为一个美分（或其他某种最小货币单位），也就是说，说股票价格变化了百万分之一美分是没有意义的。但是，由于可能的股票值非常多，它被视为连续变量。同样的说明也适用于汽车里程、环境温度和气压。\n\
  \n### 对连续数据进行“分箱”（Binning）\n\n`binning`（分箱）的概念是指将一组值划分为多个区间，然后将同一区间内的所有数字视为具有相同的值。\n\
  \n作为一个简单的例子，假设数据集中的一个特征包含人的年龄。取值范围大约在 `0` 到 `120` 之间，我们可以将其“分箱”为 `12` 个等距区间，每个区间包含\
  \ `10` 个值：`0` 到 `9`、`10` 到 `19`、`20` 到 `29` 等，以此此类推。\n\n然而，如上所述划分人的年龄可能会出现问题。假设\
  \ A 人、B 人和 C 人的年龄分别为 `29`、`30` 和 `39`。那么 A 人和 B 人之间可能比 B 人和 C 人之间更相似，但由于年龄划分的方式，B\
  \ 被归类为比接近 A 更接近 C。事实上，分箱可能会增加第一类错误（假阳性）和第二类错误（假阴性），正如在在下面的博客文章讨论的那样（以及一些分箱的替代方案）：\n\
  \nhttps://medium.com/@peterflom/why-binning-continuous-data-is-almost-always-a-mistake-ad0b3a1d141f\n\
  \n另一个例子是使用四分位数，比之前的年龄分箱例子更加粗糙。分箱的问题在于对处于不同箱的人进行分类所产生的后果，尽管他们彼此非常接近。例如，有些人人因为工资微薄而陷入财务困境，但因为他们的工资高于获得任何援助的截止点而失去了获得资助的资格。\n\
  \n### 通过归一化缩放数值数据\n\n数值范围可能会差异很大，需要注意的是，它们通常需要被缩放到一个较小的范围，例如 `[–1,1]` 或 `[0,1]`\
  \ 范围内的值，你可以分别通过 `tanh` 函数或 `sigmoid` 函数来实现。\n\n例如，以米为单位测量人的身高涉及 `0.50` 米到 `2.5`\
  \ 米之间的范围（在绝大多数情况下），而以厘米为单位测量身高则范围在 `50` 厘米到 `250` 厘米之间：这两个单位之间的差异是 100 倍。人以公斤为单位的体重通常在\
  \ `5` 公斤到 `200` 公斤之间变化。\n\n\n\n因此，`{-1, 0, 1}` 的标准化结果为 `{-1/0.816, 0/0.816, 1/0.816}`，这实际上等于值集合\
  \ `{-1.2254, 0, 1.2254}`。\n\n另一个例子，假设随机变量 `X` 的值为 `{-6, 0, 6}`。那么 `mu` 和 `sigma`\
  \ 的计算如下：\n\n```\n mu       = (SUM xi)/n = (-6 + 0 + 6)/3 = 0\n\nvariance = [SUM\
  \ (xi- mu)²]/n\n         = [(-6-0)² + (0-0)² + (6-0)²]/3\n         = 72/3\n    \
  \     = 24\n\nsigma    = sqrt(24) = 4.899 (近似值)\n```\n\n因此，`{-6, 0, 6}` 的标准化结果为\
  \ `{-6/4.899, 0/4.899, 6/4.899}`，这实际上等于值集合 `{-1.2247, 0, 1.2247}`。\n\n在前面的两个例子中，平均值均等于\
  \ 0，但方差和标准差显著不同。另一点是：一组值的归一化*总是*会产生一组位于 0 和 1 之间的数字。\n\n然而，一组值的标准化可能会产生小于 -1 且大于\
  \ 1 的数字：当 `sigma` 小于每个项 `|mu – xi|` 的最小值时，就会发生这种情况，其中后者是 `mu` 与每个 `xi` 值之间差值的绝对值。在前面的例子中，最小差值为\
  \ 1，而 `sigma` 为 `0.816`，因此最大的标准化值大于 1。\n\n### 通过鲁棒标准化对数值数据进行缩放\n\n*鲁棒标准化*技术是标准化的变体，它根据值的子集来计算平均值\
  \ `mu` 和标准差 `sigma`。具体而言，仅使用第 25 分位数和 75 分位数之间的值，这忽略了可能包含离群值的第一和第四四位数。让我们定义以下变量：\n\
  \n```\n X25 = 第 25 分位数\nX75 = 第 75 分位数\nXM = {Xi} 值的平均值\nXR = 鲁棒标准化\n```\n\n然后根据以下公式计算\
  \ `XR`：\n\n```\n XR = (Xi - XM)/(X75 - X25)\n```\n\n前面的技术也被称为 `IQR`，它是*四分位间距*（interquartile\
  \ range）的缩写，你可以在这里查看一个计算示例：\n\n[`en.wikipedia.org/wiki/Interquartile_range`](https://en.wikipedia.org/wiki/Interquartile_range)\n\
  \n### 类别数据中需要关注的内容\n\n本节包含了处理不一致数据值的各种建议，你可以根据与你特定任务相关的任何额外因素决定采用哪些建议。例如，考虑丢弃基数极低（等于或接近\
  \ 1）的列，以及方差为零或极低的数值列。\n\n接下来，检查类别列的内容，是否存在不一致的拼写或错误。一个很好的例子是性别类别，它可能由以下值的组合：\n\n\
  ```\n male\nMale\nfemale\nFemale\nm\nf\nM\nF\n```\n\n上述性别类别值可以替换为两个类别值（除非你有正当理由保留某些其他值）。此外，如果你正在训练一个分析涉及单一性别的模型，那么你需要确定数据集中的哪些行（如果有）必须被排除。还要检查类别数据列是否存在冗余或缺失的空格。\n\
  \n检查是否存在具有多种数据类型的值，例如一个数值列中的数字以数字形式表示，而数字以字符串或对象的形式存在。还要确保数据格式一致（例如数字作为整数或浮点数），并确保日期具有相同的格式（例如，不要将\
  \ `mm/dd/yyyy` 日期格式与另一种日期格式如 `dd/mm/yyyy` 混合）。\n\n### 将类别数据映射到数值值\n\n字符数据通常被称为*类别数据*，示例包括人的姓名、家庭或工作地址以及电子邮件地址。许多类型的类别数据涉及简短的值列表。例如，星期几和一年的月份分别涉及七和十二个不同的值。注意，星期几之间存在关系：每一天都有前一天和后一天，一年的月份也是如此。\n\
  \n然而，汽车的颜色之间是相互独立的：红色并不比蓝色好或坏。但是某种颜色的汽车事故率在统计上可能更高，但我们在这里不讨论这种情况。\n\n将类别值映射到一组数值值有几种常用技术。一个你需要执行此转换的简单示例涉及泰坦尼克号（Titanic）数据集中的性别特征。该特征是训练机器学习模型的相关特征之一。性别特征的值集为\
  \ `{M,F}`。正如你将在本章后续部分看到的，`Pandas` 可以非常方便地将值集合 `{M,F}` 转换为值集合 `{0,1}`。\n\n另一种映射技术涉及将一组类别值映射到一组连续整数值。例如，集合\
  \ `{Red, Green, Blue}` 可以映射到整数集合 `{0,1,2}`。集合 `{Male, Female}` 可以映射到整数集合 `{0,1}`。星期几可以映射到整数\
  \ `{0,1,2,3,4,5,6}`。注意，星期几的格式取决于国家。\n\n另一种技术称为独热编码（one-hot encoding），它将每个值转换为*向量*（如果需要复习可以查看维基百科）。因此，`{Male,\
  \ Female}` 可以表示为 `[1,0]` 和 `[0,1]`。如果你熟悉矩阵，你会发现性别的向量构成了一个 2x2 矩阵，而颜色 `{R,G,B}` 将构成一个\
  \ 3x3 矩阵，如下：\n\n```\n [1,0,0]\n[0,1,0]\n[0,0,1]\n```\n\n前面的集合看起来像 3x3 矩阵。事实上，这种技术可以简单地泛化。具体来说，如果你有\
  \ `n` 个类别值，可以将其中每一个值映射到 `nx` 矩阵。\n\n另一个例子是头衔 `{\"Intern\", \"Junior\", \"Mid-Range\"\
  , \"Senior\", \"Project Leader\", \"Dev Manager\"}` 在薪资方面存在层级关系（但我们现在跳过这一细节）。\n\n\
  另一组类别数据涉及季节：`{\"Spring\", \"Summer\", \"Autumn\", \"Winter\"}`，虽然这些值通常是独立的，但在某些情况下季节是非常重要的。例如，月雨量、平均温度、犯罪率和贷款率可能取决于季节、月份、每周甚至是年份。\n\
  \n如果一个特征具有大量的类别值，独热编码将为每个数据点产生许多额外的列。由于新列的大部分值为 0，这会增加数据集的稀疏性，从而导致过拟合，并因此对你在训练过程中采用的机器学习算法产生不利影响。\n\
  \n另一种解决方案是使用基于序列的解决方案，将 `N` 个类别映射到整数 `1, 2, ..., N`。另一种解决方案涉及检查类别值的行频率。例如，假设 `N`\
  \ 等于 20，且有 3 个类别值在给定特征中出现了 95%。你可以尝试以下操作：\n\n1. 为这三个类别值分配 1、2 和 3。\n2. 分配反映这些类别值频率的数值。\n\
  3. 为剩余的类别值分配“OTHER”（其他）。\n4. 删除类别值属于那 5% 的行。\n\n\n\n\n```\nMM/DD/YY\nMM/DD/YYYY\n\
  DD/MM/YY\nYY/MM/DD\nM/D/YY\nYY/M/D\nDDYY\nYYMMDD\n```\n\n如果你需要合并包含不同格式的数据集，那么将不同的格式转换为统一的格式将确保一致性。\n\
  \n## 处理货币\n\n货币的格式取决于国家，这包括对 `,` 和 `.` 的不同解释。例如，1,124.78 在美国表示“一千一百二十四点七八”，而 1.124,78\
  \ 在欧洲具有相同的意思（即 `.` 和 `,` 符号互换）。\n\n如果你需要合并包含不同格式的数据集，那么你可能需要将所有不同的格式转换为统一的格式。另一个需要考虑的细节是：汇率可能会波动，从而影响税费、滞纳等的计算。尽管你可能足够幸运不需要处理这些问题，但要注意它们。\n\
  \n## 处理离群值和异常\n\n简单来说，离群值是“正常”值范围之外的异常数据。例如，一个人的身高通常在 30 厘米到 250 厘米之间。因此，电子表格中身高为\
  \ 5 厘米或 500 厘米的数据点就是离群值。这些离群值的结果可能涉及重大的财务或物理损失（尽管它们可能会影响 `model` 的准确性）。\n\n异常也位于“正常”值范围之外（与离群值一样），但它们通常比离群值更具有问题、“后果”。例如，考虑这样做的情况：一个住在加州的人突然在纽约进行了信用卡购买。如果此人正在度假（或出差），那么这次购买就是一个离群值（其典型的购买模式），但这不是问题。然而，如果在进行信用卡购买时该人在加州，那么它可能是信用卡欺诈，也是异常。\n\
  \n遗憾的是，没有简单的方法来决定如何处理数据集中的异常和离群值。虽然你可以删除包含离群值的行，但这会导致数据集（因此 `model`）丢失价值信息。你可以尝试修改数据值（见下文），但再次可能导致\
  \ `model` 错误的推理。另一种可能性是用包含异常和离群值的数据集训练模型，然后使用移除了异常和离群值的数据集训练模型。比较这两个结果，看看你是否能关于异常和离群值推断出任何有意义的内容。\n\
  \n### 离群值检测/移除\n\n虽然保留还是删除离群值由你做决定，但有一些技术可以帮助你检测数据集中的离群值。以下是技术的短列表，以及简要描述和更多信息的链接：\n\
  \n*   修剪 (trimming)\n*   缩尾处理 (winsorizing)\n*   最小协方差行列 (minimum covariance determinant)\n\
  *   局部离群值因子 (local outlier factor)\n*   Huber 和岭回归 (Huber and Ridge regressions)\n\
  *   孤立森林（基于树的算法）\n*   单类 SVM (one-class SVM)\n\n也许 `trimming` 是简单的技术（删除离群值之外），它涉及移除特征位于顶部\
  \ 5% 或底部 5% 范围的行。对数据进行 `缩尾` 是修剪的改进：将顶部 5% 范围的值设置为第 95 分位数的最大值，并将底部 5% 范围的值设置为第 5\
  \ 分位的最小值。\n\n`最小协方差行列` 是一种基于协方差的技术，使用该技术的 Python 代码示例可以从以下网站下载：\n\n[`scikit-learn.org/stable/modules/outlier_detection.html`](https://scikit-learn.org/stable/modules/outlier_detection.html)\n\
  \n`局部离群值因子` (`LOF`) 技术是一种无监督技术，通过 `kNN`（k-最近邻）算法计算局部异常评分。使用 `LOF` 的文档和短代码示例在线获取：\n\
  \n[`scikit-learn.org/stable/modules/generated/sklearn.neighbors.LocalOutlierFactor.html`](https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.LocalOutlierFactor.html)\n\
  \n另外两种技术涉及 `Huber` 和 `Ridge` 类，它们都包含在 `Sklearn` 中。`Huber` 对离群值不敏感，因为它通过线性损失计算，类似于\
  \ `MAE`（平均绝对误差）。比较 `Huber` 和 `Ridge` 回归算法的代码示例可以从以下网站下载：\n\n[`scikit-learn.org/stable/auto_examples/linear_model/plot_huber_vs_ridge.html`](https://scikit-learn.org/stable/auto_examples/linear_model/plot_huber_vs_ridge.html)\n\
  \n你还可以探索 `Theil-Sen` 估计器和 `RANSAC`，它们对离群值具有“鲁棒性”：\n\n[`scikit-learn.org/stable/auto_examples/linear_model/plot_theilsen.html`](https://scikit-learn.org/stable/auto_examples/linear_model/plot_theilsen.html)\n\
  \n\n\n\nListing 2.2 的改进之处在于，你可以指定一组值并从中计算上限和下限范围值，而新的代码块以**粗体**形式显示。\n\n列表 2.2:\
  \ numpy_outliers2.py\n\n```python\n import numpy as np\n\narr1 = np.array([2,5,7,9,9,40])\n\
  print(\"values:\",arr1)\n\ndata_mean = np.mean(arr1)\ndata_std  = np.std(arr1)\n\
  print(\"data_mean:\",data_mean)\nprint(\"data_std:\" ,data_std)\nprint()\n\nmultipliers\
  \ = np.array([0.5,1.0,1.5,2.0,2.5,3.0])\nfor multiplier in multipliers:\n  cut_off\
  \ = data_std * multiplier\n  lower, upper = data_mean - cut_off, data_mean + cut_off\n\
  \  print(\"=> multiplier:  \",multiplier)\n  print(\"lower cutoff:\",lower)\n  print(\"\
  upper cutoff:\",upper)\n\n  outliers = [x for x in df['data'] if x < lower or x\
  \ > upper]\n  print('Identified outliers: %d' % len(outliers))\n  print(\"outliers:\"\
  ,outliers)\n  print()\n```\n\nListing 2.2 包含了一块新代码，它将变量 `multipliers` 初始化为数值值数组，用于寻找离群值。尽管你在真实数据集上可能会使用\
  \ `2.0` 或更大的值，但这一范围数字可以让你对检测离群值有更好的感。运行 Listing 2.2 中的代码，你将看到以下输出：\n\n```\n values:\
  \ [2  5  7  9  9  40]\ndata_mean: 12.0\ndata_std: 12.754084313139327\n\nlower cutoff:\
  \ -7.131126469708988\nupper cutoff: 31.13112646970899\n\nIdentified outliers: 1\n\
  outliers: [40]\n=> multiplier:   0.5\nlower cutoff: 5.622957843430337\nupper cutoff:\
  \ 18.377042156569665\nIdentified outliers: 3\noutliers: [2, 5, 40]\n\n=> multiplier:\
  \   1.0\nlower cutoff: -0.7540843131393267\nupper cutoff: 24.754084313139327\nIdentified\
  \ outliers: 1\noutliers: [40]\n\n=> multiplier:   1.5\nlower cutoff: -7.131126469708988\n\
  upper cutoff: 31.13112646970899\nIdentified outliers: 1\noutliers: [40]\n\n=> multiplier:\
  \   2.0\nlower cutoff: -13.508168626278653\nupper cutoff: 37.50816862627865\nIdentified\
  \ outliers: 1\noutliers: [40]\n\n=> multiplier:   2.5\nlower cutoff: -19.88521078284832\n\
