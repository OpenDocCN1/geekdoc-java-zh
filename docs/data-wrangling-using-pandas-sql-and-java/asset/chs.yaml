  => VALID DAY/TIME FORMAT:\",$0\n        } else {\n          print \"*** 平年超出范围:\"\
  ,$0\n        }\n     }\n   } else {\n     print \"无效的日期/时间格式:\",$0\n   }\n\n   print\
  \ \"----------------\\n\"\n   count += 1\n}\n'\n```\n\n运行 列表 6.22 中的代码，你将看到以下输出：\n\
