  \n### 4. 迭代器模式\n\n迭代器模式以顺序方式访问集合对象的元素。\n\n迭代器模式是行为模式之一。\n\n#### 实验 – 16\n\n```java\n\
  interface Iterator {\n    boolean hasNext();\n    Object next();\n}\nclass LetterBag\
  \ {\n    String names[] = {\"R\", \"J\", \"L\"};\n    public Iterator getIterator()\
  \ {\n        return new NameIterator();\n    }\n    class NameIterator implements\
  \ Iterator {\n        int index;\n        @Override\n        public boolean hasNext()\
  \ {\n            if(index < names.length){\n                return true;\n     \
  \       }\n            return false;\n        }\n        @Override\n        public\
  \ Object next() {\n            if(this.hasNext()){\n                return names[index++];\n\
  \            }\n            return null;\n        }\n    }\n}\npublic class Main\
  \ {\n    public static void main(String[] args) {\n        LetterBag bag = new LetterBag();\n\
  \        for(Iterator iter = bag.getIterator(); iter.hasNext();){\n            String\
