- "# Java 设计模式\n\n\n\n![](img/image_rsrc27V.jpg)\n\n\n在书中，你将学习带有图解的解释以及运行实验，并展示成功执行实验后的输出。提供分步说明的现成解决方案。\n\
  \n\n\n## 引言\n\n设计模式独立于编程语言，它们用于解决常见的面向对象设计问题。设计模式代表一种思想，而不是具体的实现。通过使用设计模式，我们可以使代码更具活性、可重用性和可维护性。Java\
  \ 本身也遵循设计模式。\n\n在 Java Java 中，主要有三种设计模式，它们进一步被分为子部分：\n\n**创建型设计模式**\n1. `工厂模式`\n\
  2. `抽象工厂模式`\n3. `单例模式`\n4. `原型模式`\n5. `构建器模式`\n\n**结构型设计模式**\n1. `适配器模式`\n2. `桥接模式`\n\
  3. `组合模式`\n4. `装饰器模式`\n5. `外观模式`\n6. `享重量模式`\n7. `代理模式`\n\n**行为型设计模式**\n1. `责任链模式`\n\
  2. `命令模式`\n3. `解释器模式`\n4. `迭代器模式`\n5. `调停者模式`\n6. `备忘模式`\n7. `观察模式`\n8. `状态模式`\n\
  9. `策略模式`\n10. `模板方法模式`\n11. `访问者模式`\n\n创建型设计模式用于创建对象时。\n\n## 第 1 章：引言\n\n设计模式是解决特定问题/任务的经过证明的解决方案。例如，为了创建一个只有一个实例的类，且该实例可以被所有其他类使用，可以使用\
  \ `单例` 设计模式。\n\n设计模式独立于编程语言，它们用于解决常见的面向对象设计问题。设计模式代表一种思想，而不是具体的实现。通过使用设计模式，我们可以使代码更具活性、可重用性和可维护性。Java\
  \ 本身也遵循设计模式。\n\n在 Java Java 中，主要有三种设计模式，它们进一步被分为子部分：\n\n**创建型设计模式**\n1. `工厂模式`\n\
  2. `抽象工厂模式`\n3. `单例模式`\n4. `原型模式`\n5. `构建器模式`\n\n**结构型设计模式**\n1. `适配器模式`\n2. `桥接模式`\n\
  3. `组合模式`\n4. `装饰器模式`\n5. `外观模式`\n6. `享重量模式`\n7. `代理模式`\n\n**行为型设计模式**\n1. `责任链模式`\n\
  2. `命令模式`\n3. `解释器模式`\n4. `迭代器模式`\n5. `调停者模式`\n6. `备忘模式`\n7. `观察模式`\n8. `状态模式`\n\
  9. `策略模式`\n10. `模板方法模式`\n11. `访问者模式`\n\n## 第 2 章：创建型模式\n\n### 工厂模式\n\n工厂模式是一种创建型模式，它提供了创建对象的方法，而不向客户端暴露创建逻辑。在接下来的章节中，我们将展示如何使用工厂模式创建形状对象。\n\
  \n首先，我们设计一个接口来表示 `Shape`。\n\n```java\npublic interface Shape {\n    void draw();\n\
  }\n```\n\n然后，我们创建实现接口的具体类。\n\n```java\npublic class Rectangle implements Shape {\n\
  \    @Override\n    public void draw() {\n        System.out.println(\"Inside Rectangle\"\
  );\n    }\n}\n```\n\n```java\npublic class Square implements Shape {\n    @Override\n\
  \    public void draw() {\n        System.out.println(\"Inside Square\");\n    }\n\
  }\n```\n\n```java\npublic class Circle implements Shape {\n    @Override\n    public\
  \ void draw() {\n        System.out.println(\"Inside Circle\");\n    }\n}\n```\n\
  \n核心工厂模式是一个 `ShapeFactory` 类。`ShapeFactory` 类根据传递给 `getShape()` 方法的字符串值创建 `Shape`\
  \ 对象。如果字符串值为 `CIRCLE`，它创建一个 `Circle` 对象。\n\n```java\npublic class ShapeFactory {\n\
  \    // 使用 getShape 方法获取类型对象\n    public Shape getShape(String shapeType) {\n  \
  \      if (shapeType == null) {\n            return null;\n        }\n        if\
  \ (shapeType.equalsIgnoreCase(\"CIRCLE\")) {\n            return new Circle();\n\
  \        } else if (shapeType.equalsIgnoreCase(\"RECTANGLE\")) {\n            return\
  \ new Rectangle();\n        } else if (shapeType.equalsIgnoreCase(\"SQUARE\")) {\n\
  \            return new Square();\n        }\n        return null;\n    }\n}\n```\n\
  \n以下代码包含 `main` 方法，它使用工厂类通过传递类型等信息获取具体类的对象。\n\n```java\npublic class Main {\n  \
  \  public static void main(String[] args) {\n        ShapeFactory shapeFactory =\
  \ new ShapeFactory();\n        // 获取 Circle 对象并调用其 draw 方法。\n        Shape shape1\
  \ = shapeFactory.getShape(\"CIRCLE\");\n        shape1.draw();\n        // 获取 Rectangle\
  \ 对象并调用其 draw 方法。\n        Shape shape2 = shapeFactory.getShape(\"RECTANGLE\");\n\
  \        shape2.draw();\n        // 获取 Square 对象并调用其 draw 方法。\n        Shape shape3\
  \ = shapeFactory.getShape(\"SQUARE\");\n        shape3.draw();\n    }\n}\n```\n\n\
  上面的代码生成以下结果：\n\n输出：\n```\nInside Circle\nInside Rectangle\nInside Square\n```\n\n\
  ### 抽象工厂模式\n\n抽象工厂模式是另一种创建型模式。抽象工厂模式也被称为工厂的工厂，拥有一个创建其他工厂的工厂。使用抽象工厂模式时，我们首先使用超工厂创建工厂，然后使用创建的工厂来创建对象。\n\
  \n实验 - 2\n\n\n\n\n以下代码展示了如何使用抽象工厂模式。\n\n我们将创建形状（shapes）和 `Printers`（打印机）。对于形状，我们将有\
  \ `circle`（圆形）、`rectangle`（矩形）和 `square`（正方形）。对于打印机，我们将有 `paper Printer`（纸质打印）、`Web\
  \ Printer`（网络打印）和 `screen Printer`（屏幕打印）。\n\n对于形状，我们将创建一个 `Shape` 接口，如下：\n\n`Shape.java`\n\
  \n```java\ninterface Shape {\n    void draw();\n}\n```\n\n然后我们创建实现 `Shape` 接口的具体类。\n\
  \n```java\nclass Rectangle implements Shape {\n    @Override\n    public void draw()\
  \ {\n        System.out.println(\"Inside Rectangle::draw() method.\");\n    }\n\
  }\nclass Square implements Shape {\n    @Override\n    public void draw() {\n  \
  \      System.out.println(\"Inside Square::draw() method.\");\n    }\n}\nclass Circle\
  \ implements Shape {\n    @Override\n    public void draw() {\n        System.out.println(\"\
  Inside Circle::draw() method.\");\n    }\n}\n```\n\n之后，我们为 `Printers` 创建一个接口。\n\n\
  `Printer.java`\n```java\ninterface Printer{\n    void print();\n}\n```\n\n然后我们创建实现\
  \ `Printer` 接口的具体类。\n\n```java\nclass PaperPrinter implements Printer {\n    @Override\n\
  \    public void print() {\n        System.out.println(\"paper\");\n    }\n}\nclass\
  \ WebPrinter implements Printer {\n    @Override\n    public void print() {\n  \
  \      System.out.println(\"web\");\n    }\n}\nclass ScreenPrinter implements Printer\
  \ {\n    @Override\n    public void print() {\n        System.out.println(\"screen\"\
  );\n    }\n}\n```\n\n最后，我们创建一个抽象类来获取获取 `Printer` 和 `Shape` 对象的工厂。\n\n```java\nabstract\
  \ class AbstractFactory {\n    abstract Printer getPrinter(String type);\n    abstract\
  \ Shape getShape(String shape);\n}\n```\n\n最后，我们创建扩展 `AbstractFactory` 的工厂类，根据给定信息生成具体类的对象。\n\
  \n```java\nclass ShapeFactory extends AbstractFactory {\n    @Override\n    public\
  \ Shape getShape(String shapeType) {\n        if(shapeType == null){\n         \
  \   return null;\n        } \n        if(shapeType.equalsIgnoreCase(\"CIRCLE\")){\n\
  \            return new Circle();\n        } else if(shapeType.equalsIgnoreCase(\"\
  RECTANGLE\")){\n            return new Rectangle();\n        } else if(shapeType.equalsIgnoreCase(\"\
  SQUARE\")){\n            return new Square();\n        }\n        return null;\n\
  \    }\n    @Override\n    Printer getPrinter(String type) {\n        return null;\n\
  \    }\n}\nclass PrinterFactory extends AbstractFactory {\n    @Override\n    public\
  \ Shape getShape(String shapeType) {\n        return null;\n    }\n    @Override\n\
  \    Printer getPrinter(String type) {\n        if(type == null){\n            return\
  \ null;\n        } \n        if(type.equalsIgnoreCase(\"paper\")){\n           \
  \ return new PaperPrinter();\n        } else if(type.equalsIgnoreCase(\"web\")){\n\
  \            return new WebPrinter();\n        } else if(type.equalsIgnoreCase(\"\
  Screen\")){\n            return new ScreenPrinter();\n        }\n        return\
  \ null;\n    }\n}\n```\n\n创建一个工厂生成器/生产者类，通过传递如 `Shape` 或 `Printer` 等信息来获取工厂。\n\n\
  ```java\nclass FactoryProducer {\n    public static AbstractFactory getFactory(String\
  \ choice) {\n        if(choice.equalsIgnoreCase(\"SHAPE\")){\n            return\
  \ new ShapeFactory();\n        } else if(choice.equalsIgnoreCase(\"Printer\")){\n\
  \            return new PrinterFactory();\n        } \n        return null;\n  \
  \  }\n}\n```\n\n以下代码展示了如何使用抽象工厂模式。\n\n```java\npublic class Main {\n    public static\
  \ void main(String[] args) {\n        //获取形状工厂\n        AbstractFactory shapeFactory=\
  \ FactoryProducer.getFactory(\"SHAPE\");\n        //获取一个 Shape 对象\n        Shape\
  \ shape1 = shapeFactory.getShape(\"CIRCLE\");\n        //调用 Shape 的 draw 方法\n  \
  \      shape1.draw();\n        //获取一个 Shape Rectangle 对象\n        Shape shape2 =\
  \ shapeFactory.getShape(\"RECTANGLE\");\n        //调用 Shape Rectangle 的 draw 方法\n\
  \        shape2.draw();\n        //获取一个 Shape Square 对象\n        Shape shape3 =\
  \ shapeFactory.getShape(\"SQUARE\");\n        //调用 Shape Square 的 draw 方法\n    \
  \    shape3.draw();\n        //获取打印机工厂\n        AbstractFactory printerFactory=\
  \ FactoryProducer.getFactory(\"printer\");\n        Printer printer1 = printerFactory.getPrinter(\"\
  Paper\");\n        printer1.print();\n        Printer printer2 = printerFactory.getPrinter(\"\
  Web\");\n        printer2.print();\n        Printer printer3 = printerFactory.getPrinter(\"\
  Screen\");\n        printer3.print();\n    }\n}\n```\n\n上述代码生成了以下结果。\n\n输出\n![](img/image_rsrc27X.jpg)\n\
  \n### 3. 单例模式\n\n单例模式是一种创建模式。\n\n该模式仅涉及一个类，该类负责创建它自己的对象。\n\n该类确保只有一个对象被创建。\n\n该类提供了一种访问其唯一对象对象的方法。\n\
  \n例如，在设计用户界面时，我们可能只有一个主应用程序窗口。我们可以使用单例模式来确保 `MainApplicationWindow` 对象只有一个实例。\n\n\
  #### Lab – 3\n\n以下代码将创建一个 `MainWindow` 类。\n\n`MainWindow` 类将其构造函数设为私有，并拥有一个自身的静态实例。\n\
  \n`MainWindow` 类提供了一个静态方法向外部世界获取其静态实例。\n\n`Main` 是我们的演示类，将使用 `MainWindow` 类来获取 `MainWindow`\
  \ 对象。\n\n`MainWindow.java`\n```java\nclass MainWindow {\n    private static MainWindow\
  \ instance;\n    private MainWindow() {}\n    public static MainWindow getInstance()\
  \ {\n        if (instance == null) {\n            instance = new MainWindow();\n\
  \        }\n        return instance;\n    }\n    public void showMessage() {\n \
  \       System.out.println(\"Hello World!\");\n    }\n}\n```\n\n```java\nclass Main\
  \ {\n    public static void main(String[] args) {\n        MainWindow window = MainWindow.getInstance();\n\
  \        window.showMessage();\n    }\n}\n```\n\n输出\nHello World!\n\n### 4. 原型模式\n\
  \n原型模式是一种创建模式。\n\n原型模式通过克隆现有对象来创建新对象。\n\n原型模式允许在不初始化类创建对象。\n\nLab – 4\n\n以下代码展示了如何使用原型模式。\n\
  \n`Shape.java`\n```java\nabstract class Shape implements Cloneable {\n    abstract\
  \ void draw();\n    @Override\n    public Object clone() throws CloneNotSupportedException\
  \ {\n        return super.clone();\n    }\n}\n```\n\n然后我们创建扩展 `Shape` 的具体类。\n\n\
  ```java\nclass Rectangle extends Shape {\n    @Override\n    public void draw()\
  \ {\n        System.out.println(\"Inside Rectangle::draw() method.\");\n    }\n\
  }\nclass Square extends Shape {\n    @Override\n    public void draw() {\n     \
  \   System.out.println(\"Inside Square::draw() method.\");\n    }\n}\nclass Circle\
  \ extends Shape {\n    @Override\n    public void draw() {\n        System.out.println(\"\
  Inside Circle::draw() method.\");\n    }\n}\n```\n\n现在我们创建一个原型类，通过克隆来创建对象。\n\n```java\n\
  class ShapePrototype {\n    private Shape shape;\n    public void setShape(Shape\
  \ shape) {\n        this.shape = shape;\n    }\n}\n\npublic class Main {\n    public\
  \ static void main(String[] args) {\n        Shape circle = new Circle();\n    \
  \    ShapePrototype prototype = new ShapePrototype();\n        prototype.setShape(circle);\n\
  \        try {\n            Shape clonedCircle = (Shape) circle.clone();\n     \
  \       clonedCircle.draw();\n        } catch (CloneNotSupportedException e) {\n\
  \            e.printStackTrace();\n        }\n    }\n}\n```\n\n\n\n构建器模式用于使用简单对象来创建复杂的对象。它通过从小而简单的对象逐步构建出较大的对象。\n\
  \n构建器模式是另一种创建模式。\n\n例如，当为我们的应用程序创建一个主窗口时，我们需要创建一个菜单、一个工具栏，然后添加菜单和工具栏。\n\n对于我们要创建的每一个窗口，我们都需要创建一个空窗口、创建一个菜单、创建一个工具栏，并将菜单和工具栏安装到窗口中。\n\
  \n我们可以使用构建器模式来隐藏创建窗口的实现细节。\n\n#### Lab – 5\n\n`MainWindow.java`\n\n```java\nclass\
  \ Menu {}\nclass ToolBar {}\nclass MainWindow {\n    Menu menu;\n    ToolBar toolBar;\n\
  \n    public Menu getMenu() {\n        return menu;\n    }\n\n    public void setMenu(Menu\
  \ menu) {\n        this.menu = menu;\n    }\n\n    public ToolBar getToolBar() {\n\
  \        return toolBar;\n    }\n\n    public void setToolBar(ToolBar toolBar) {\n\
  \        this.toolBar = toolBar;\n    }\n}\n\nclass WindowBuilder {\n    public\
  \ static MainWindow createWindow() {\n        MainWindow window = new MainWindow();\n\
  \        Menu menu = new Menu();\n        ToolBar toolBar = new ToolBar();\n   \
  \     window.setMenu(menu);\n        window.setToolBar(toolBar);\n        return\
  \ window;\n    }\n}\n\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        MainWindow object = WindowBuilder.createWindow();\n    }\n}\n\
  ```\n\n## 第 3 章：结构设计模式\n\n1. 适配器模式\n2. 桥接模式\n3. 组合模式\n4. 装饰器模式\n5.  Fac 器模式\n6.\
  \ 权重模式\n7. 代理模式\n\n### 1. 适配器模式\n\n我们在现实生活中经常使用`适配器`。例如，我们使用内存卡适配器来连接内存卡和电脑，因为电脑只支持一种类型的内存卡，而我们的卡与电脑不兼容。\n\
  \n适配器是两个不兼容实体之间的转换器。适配器模式是一种结构模式。\n\n在 Java 设计模式中，适配器充当两个不兼容接口之间的桥梁。\n\n通过使用适配器模式，我们可以统一这两个不兼容的接口。\n\
  \n#### Lab – 6\n\n首先，我们创建一个`Player` 接口来播放任何类型的媒体文件。\n\n`MyPlayer` 是适配器，它统一了播放媒体文件的接口。\n\
  \n```java\ninterface Player {\n    public void play(String type, String fileName);\n\
  }\n\ninterface AudioPlayer {\n    public void playAudio(String fileName);\n}\n\n\
  interface VideoPlayer {\n    public void playVideo(String fileName);\n}\n\nclass\
  \ MyAudioPlayer implements AudioPlayer {\n    @Override\n    public void playAudio(String\
  \ fileName) {\n        System.out.println(\"Playing. Name: \"+ fileName);\n    }\n\
  }\n\nclass MyVideoPlayer implements VideoPlayer {\n    @Override\n    public void\
  \ playVideo(String fileName) {\n        System.out.println(\"Playing. Name: \"+\
  \ fileName);\n    }\n}\n\nclass MyPlayer implements Player {\n    AudioPlayer audioPlayer\
  \ = new MyAudioPlayer();\n    VideoPlayer videoPlayer = new MyVideoPlayer();\n\n\
  \    public MyPlayer() {\n    }\n\n    @Override\n    public void play(String audioType,\
  \ String fileName) {\n        if(audioType.equalsIgnoreCase(\"avi\")) {\n      \
  \      videoPlayer.playVideo(fileName);\n        } else if(audioType.equalsIgnoreCase(\"\
  mp3\")) {\n            audioPlayer.playAudio(fileName);\n        }\n    }\n}\n\n\
  public class Main {\n    public static void main(String[] args) {\n        MyPlayer\
  \ myPlayer = new MyPlayer();\n        myPlayer.play(\"mp3\", \"h.mp3\");\n     \
  \   myPlayer.play(\"avi\", \"me.avi\");\n    }\n}\n```\n\n上述代码生成以下结果。\n\n#### 输出\n\
  \n![](img/image_rsrc280.jpg)\n\n### 2. 桥接模式\n\n桥接模式将定义与它的实现解耦。它是一种结构模式。\n\n该模式涉及一个充当桥梁的接口。桥接使得具体类与接口实现类相互独立。\n\
  \n两种类型的类都可以被修改，而不会影响对方。\n\n#### Lab – 7\n\n```java\ninterface Printer {\n    public\
  \ void print(int radius, int x, int y);\n}\n\nclass ColorPrinter implements Printer\
  \ {\n    @Override\n    public void print(int radius, int x, int y) {\n        System.out.println(\"\
  Color: \" + radius + \", x: \" + x + \", \" + y + \"]\");\n    }\n}\n\nclass BlackPrinter\
  \ implements Printer {\n    @Override\n    public void print(int radius, int x,\
  \ int y) {\n        System.out.println(\"Black: \" + radius + \", x: \" + x + \"\
  , \" + y + \"]\");\n    }\n}\n\nabstract class Shape {\n    protected Printer print;\n\
  \n    protected Shape(Printer p) {\n        this.print = p;\n    }\n\n    public\
  \ abstract void draw();\n}\n\nclass Circle extends Shape {\n    private int radius,\
  \ x, y;\n\n    public Circle(int radius, int x, int y, Printer draw) {\n       \
  \ super(draw);\n        this.radius = radius;\n        this.x = x;\n        this.y\
  \ = y;\n    }\n\n    public void draw() {\n        print.print(radius, x, y);\n\
  \    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n\
  \        Shape redCircle = new Circle(100, 10, 10, new ColorPrinter());\n      \
  \  Shape blackCircle = new Circle(200, 20, 20, new BlackPrinter());\n        redCircle.draw();\n\
  \        blackCircle.draw();\n    }\n}\n```\n\n上述代码生成以下结果。\n\n#### 输出\n\n![](img/image_rsrc281.jpg)\n\
  \n### 3. 组合模式\n\n组合模式是一种结构模式，因为它创建了对象组的树形结构。\n\n组合模式将一组对象视为单个对象。\n\n组合模式使用一个类来表示树形结构。\n\
  \n在组合模式中，我们创建一个包含其自身对象的类。\n\n#### Lab – 8\n\n以下代码使用`Employee` 类来演示组合模式。\n\n`Employee.java`\n\
  \n```java\nimport java.util.ArrayList;\nimport java.util.List;\n\nclass Employee\
  \ {\n    private String name;\n    private String title;\n    private List<Employee>\
  \ subordinates;\n\n    public Employee(String name, String title) {\n        this.name\
  \ = name;\n        this.title = title;\n        subordinates = new ArrayList<Employee>();\n\
  \    }\n\n    public void add(Employee e) {\n        subordinates.add(e);\n    }\n\
  \n    public void remove(Employee e) {\n        subordinates.remove(e);\n    }\n\
  \n    public List<Employee> getSubordinates() {\n        return subordinates;\n\
  \    }\n\n    public String toString() {\n        return \"Employee :[ Name : \"\
  \ + name + \", dept : \" + title + subordinates + \" ]\";\n    }\n}\n\npublic class\
  \ Main {\n    public static void main(String[] args) {\n        Employee CEO = new\
  \ Employee(\"John\",\"CEO\");\n        Employee headSales = new Employee(\"Rob\"\
  ,\"Sales\");\n        Employee headMarketing = new Employee(\"Mike\",\"Marketing\"\
  );\n        Employee programmer1 = new Employee(\"Lili\",\"Programmer\");\n    \
  \    Employee programmer2 = new Employee(\"Bob\",\"Programmer\");\n        Employee\
  \ tester1 = new Employee(\"Jack\",\"Tester\");\n        Employee tester2 = new Employee(\"\
  Tom\",\"Tester\");\n\n        CEO.add(headSales);\n        CEO.add(headMarketing);\n\
  \        headSales.add(tester1);\n        headSales.add(tester2);\n        headMarketing.add(programmer1);\n\
  \        headMarketing.add(programmer2);\n\n        //打印组织中的所有员工\n        System.out.println(CEO);\n\
  \        for (Employee headEmployee : CEO.getSubordinates()) {\n            System.out.println(headEmployee);\n\
  \            for (Employee employee : headEmployee.getSubordinates()) {\n      \
  \          System.out.println(employee);\n            }\n        }\n    }\n}\n```\n\
