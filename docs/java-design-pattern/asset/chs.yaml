  \        }\n    }\n}\n```\n\n上述代码生成了以下结果。\n\n输出\n\n| ![](img/image_rsrc28A) |\n\n\
  ### 5. 中介者模式\n\n中介模式减少了多个对象之间的通信。\n\n该模式提供了一个中介类来处理所有类之间的通信。\n\n中介模式属于行为模式分类。\n\n\
