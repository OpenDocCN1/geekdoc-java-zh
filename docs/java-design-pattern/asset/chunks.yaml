    \ Shape {\n        void draw();\n    }\n    class Rectangle implements Shape {\n\
    \        @Override\n        public void draw() {\n            System.out.println(\"\
    Rectangle::draw()\");\n        }\n    }\n    class Square implements Shape {\n\
    \        @Override\n        public void draw() {\n            System.out.println(\"\
    Square::draw()\");\n        }\n    }\n    class Circle implements Shape {\n  \
    \      @Override\n        public void draw() {\n            System.out.println(\"\
    Circle::draw()\");\n        }\n    }\n    private Shape circle = new Circle();\n\
    \    private Shape rectangle = new Rectangle();\n    private Shape square = new\
    \ Square();\n    public ShapeFacade() {\n    }\n    public void drawCircle() {\n\
    \        circle.draw();\n    }\n    public void drawRectangle() {\n        rectangle.draw();\n\
    \    }\n    public void drawSquare() {\n        square.draw();\n    }\n}\npublic\
