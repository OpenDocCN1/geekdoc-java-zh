    \    model.setId(\"1\");\n    EmployeeView view = new EmployeeView();\n    EmployeeController\
    \ controller = new EmployeeController(model, view);\n    controller.setName(\"\
    New Name\");\n    controller.updateView();\n  }\n}\n```\n\n上面的代码生成了以下结果。\n\n输出\n\
