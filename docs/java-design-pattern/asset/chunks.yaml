    \n数据访问对象模式或 DAO 模式将数据 API 与高层服务分离离开。\n\nDAO 模式通常包含以下接口和类：\n\n- **数据访问对象接口**：定义在\
    \ `model` 对象（或对象）上的标准操作。\n- **数据访问对象类**：实现上述接口。可能存在多个实现，例如一个用于数据库，一个用于文件。\n- **模型对象**：包含\
    \ `get/set` 方法以存储数据的简单 POJO。\n\n## 实验 – 25\n\n```java\nimport java.util.ArrayList;\n\
