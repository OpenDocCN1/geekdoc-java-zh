  trans: "\n构建器模式用于使用简单对象来创建复杂的对象。它通过从小而简单的对象逐步构建出较大的对象。\n\n构建器模式是另一种创建模式。\n\n例如，当为我们的应用程序创建一个主窗口时，我们需要创建一个菜单、一个工具栏，然后添加菜单和工具栏。\n\
    \n对于我们要创建的每一个窗口，我们都需要创建一个空窗口、创建一个菜单、创建一个工具栏，并将菜单和工具栏安装到窗口中。\n\n我们可以使用构建器模式来隐藏创建窗口的实现细节。\n\
    \n## Lab – 5\n\n`MainWindow.java`\n\n```java\nclass Menu {}\nclass ToolBar {}\n\
    class MainWindow {\n    Menu menu;\n    ToolBar toolBar;\n\n    public Menu getMenu()\
    \ {\n        return menu;\n    }\n\n    public void setMenu(Menu menu) {\n   \
    \     this.menu = menu;\n    }\n\n    public ToolBar getToolBar() {\n        return\
    \ toolBar;\n    }\n\n    public void setToolBar(ToolBar toolBar) {\n        this.toolBar\
    \ = toolBar;\n    }\n}\n\nclass WindowBuilder {\n    public static MainWindow\
    \ createWindow() {\n        MainWindow window = new MainWindow();\n        Menu\
    \ menu = new Menu();\n        ToolBar toolBar = new ToolBar();\n        window.setMenu(menu);\n\
    \        window.setToolBar(toolBar);\n        return window;\n    }\n}\n\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        MainWindow\
    \ object = WindowBuilder.createWindow();\n    }\n}\n```\n\n## 第 3 章：结构设计模式\n\n\
    1. 适配器模式\n2. 桥接模式\n3. 组合模式\n4. 装饰器模式\n5.  Fac 器模式\n6. 权重模式\n7. 代理模式\n\n## 1. 适配器模式\n\
    \n我们在现实生活中经常使用`适配器`。例如，我们使用内存卡适配器来连接内存卡和电脑，因为电脑只支持一种类型的内存卡，而我们的卡与电脑不兼容。\n\n适配器是两个不兼容实体之间的转换器。适配器模式是一种结构模式。\n\
    \n在 Java 设计模式中，适配器充当两个不兼容接口之间的桥梁。\n\n通过使用适配器模式，我们可以统一这两个不兼容的接口。\n\n## Lab – 6\n\
    \n首先，我们创建一个`Player` 接口来播放任何类型的媒体文件。\n\n`MyPlayer` 是适配器，它统一了播放媒体文件的接口。\n\n```java\n\
    interface Player {\n    public void play(String type, String fileName);\n}\n\n\
    interface AudioPlayer {\n    public void playAudio(String fileName);\n}\n\ninterface\
    \ VideoPlayer {\n    public void playVideo(String fileName);\n}\n\nclass MyAudioPlayer\
    \ implements AudioPlayer {\n    @Override\n    public void playAudio(String fileName)\
    \ {\n        System.out.println(\"Playing. Name: \"+ fileName);\n    }\n}\n\n\
    class MyVideoPlayer implements VideoPlayer {\n    @Override\n    public void playVideo(String\
    \ fileName) {\n        System.out.println(\"Playing. Name: \"+ fileName);\n  \
    \  }\n}\n\nclass MyPlayer implements Player {\n    AudioPlayer audioPlayer = new\
    \ MyAudioPlayer();\n    VideoPlayer videoPlayer = new MyVideoPlayer();\n\n   \
    \ public MyPlayer() {\n    }\n\n    @Override\n    public void play(String audioType,\
    \ String fileName) {\n        if(audioType.equalsIgnoreCase(\"avi\")) {\n    \
    \        videoPlayer.playVideo(fileName);\n        } else if(audioType.equalsIgnoreCase(\"\
    mp3\")) {\n            audioPlayer.playAudio(fileName);\n        }\n    }\n}\n\
    \npublic class Main {\n    public static void main(String[] args) {\n        MyPlayer\
    \ myPlayer = new MyPlayer();\n        myPlayer.play(\"mp3\", \"h.mp3\");\n   \
    \     myPlayer.play(\"avi\", \"me.avi\");\n    }\n}\n```\n\n上述代码生成以下结果。\n\n###\
    \ 输出\n\n![](img/image_rsrc280.jpg)\n\n## 2. 桥接模式\n\n桥接模式将定义与它的实现解耦。它是一种结构模式。\n\
    \n该模式涉及一个充当桥梁的接口。桥接使得具体类与接口实现类相互独立。\n\n两种类型的类都可以被修改，而不会影响对方。\n\n## Lab – 7\n\n\
    ```java\ninterface Printer {\n    public void print(int radius, int x, int y);\n\
    }\n\nclass ColorPrinter implements Printer {\n    @Override\n    public void print(int\
    \ radius, int x, int y) {\n        System.out.println(\"Color: \" + radius + \"\
    , x: \" + x + \", \" + y + \"]\");\n    }\n}\n\nclass BlackPrinter implements\
    \ Printer {\n    @Override\n    public void print(int radius, int x, int y) {\n\
    \        System.out.println(\"Black: \" + radius + \", x: \" + x + \", \" + y\
    \ + \"]\");\n    }\n}\n\nabstract class Shape {\n    protected Printer print;\n\
    \n    protected Shape(Printer p) {\n        this.print = p;\n    }\n\n    public\
    \ abstract void draw();\n}\n\nclass Circle extends Shape {\n    private int radius,\
    \ x, y;\n\n    public Circle(int radius, int x, int y, Printer draw) {\n     \
    \   super(draw);\n        this.radius = radius;\n        this.x = x;\n       \
    \ this.y = y;\n    }\n\n    public void draw() {\n        print.print(radius,\
    \ x, y);\n    }\n}\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Shape redCircle = new Circle(100, 10, 10, new ColorPrinter());\n\
    \        Shape blackCircle = new Circle(200, 20, 20, new BlackPrinter());\n  \
    \      redCircle.draw();\n        blackCircle.draw();\n    }\n}\n```\n\n上述代码生成以下结果。\n\
    \n### 输出\n\n![](img/image_rsrc281.jpg)\n\n## 3. 组合模式\n\n组合模式是一种结构模式，因为它创建了对象组的树形结构。\n\
    \n组合模式将一组对象视为单个对象。\n\n组合模式使用一个类来表示树形结构。\n\n在组合模式中，我们创建一个包含其自身对象的类。\n\n## Lab –\
    \ 8\n\n以下代码使用`Employee` 类来演示组合模式。\n\n`Employee.java`\n\n```java\nimport java.util.ArrayList;\n\
    import java.util.List;\n\nclass Employee {\n    private String name;\n    private\
    \ String title;\n    private List<Employee> subordinates;\n\n    public Employee(String\
    \ name, String title) {\n        this.name = name;\n        this.title = title;\n\
    \        subordinates = new ArrayList<Employee>();\n    }\n\n    public void add(Employee\
    \ e) {\n        subordinates.add(e);\n    }\n\n    public void remove(Employee\
    \ e) {\n        subordinates.remove(e);\n    }\n\n    public List<Employee> getSubordinates()\
    \ {\n        return subordinates;\n    }\n\n    public String toString() {\n \
    \       return \"Employee :[ Name : \" + name + \", dept : \" + title + subordinates\
    \ + \" ]\";\n    }\n}\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Employee CEO = new Employee(\"John\",\"CEO\");\n        Employee\
    \ headSales = new Employee(\"Rob\",\"Sales\");\n        Employee headMarketing\
    \ = new Employee(\"Mike\",\"Marketing\");\n        Employee programmer1 = new\
    \ Employee(\"Lili\",\"Programmer\");\n        Employee programmer2 = new Employee(\"\
    Bob\",\"Programmer\");\n        Employee tester1 = new Employee(\"Jack\",\"Tester\"\
    );\n        Employee tester2 = new Employee(\"Tom\",\"Tester\");\n\n        CEO.add(headSales);\n\
    \        CEO.add(headMarketing);\n        headSales.add(tester1);\n        headSales.add(tester2);\n\
    \        headMarketing.add(programmer1);\n        headMarketing.add(programmer2);\n\
    \n        //打印组织中的所有员工\n        System.out.println(CEO);\n        for (Employee\
    \ headEmployee : CEO.getSubordinates()) {\n            System.out.println(headEmployee);\n\
    \            for (Employee employee : headEmployee.getSubordinates()) {\n    \
    \            System.out.println(employee);\n            }\n        }\n    }\n\
    }\n```\n\n## 4. 装饰器模式\n\n装饰器模式在不改变原有结构的情况下，为现有对象添加新功能。\n\n它是一种结构模式，因为它是现有类的包装。\n\
    \n装饰器模式创建一个装饰器类来包装原始类，并提供额外的功能。\n\n## Lab – 9\n"
