- fmt: "\n\n![](image_rsrc27V.jpg)\n\n# Java Design Pattern\n\nIn This Book You Will\
    \ Learn Explanation with Diagram and Working Labs with Successfull Execution of\
    \ Labs with Output Shown. Readymade Solution With Step By Step Explanation.\n\n\
    **AMIT K**\n\n## Contents\n\n### SQL: Beginners Guide to Learn SQL Programming\
    \ Step by Step\n\n#### Introduction\n##### Chapter 1: Introduction\n* Design Pattern\
    \ Introduction\n\n#### Chapter 2: Creational Design Pattern\n* `Factory Pattern`\
    \ (Lab - 1)\n* `Abstract Factory Pattern` (Lab - 2)\n* `Singleton Pattern` (Lab\
    \ - 3)\n* `Prototype Pattern` (Lab - 4)\n* `Builder Pattern` (Lab - 5)\n\n####\
    \ Chapter 3: Structural Design Pattern\n* `Adapter Pattern` (Lab - 6)\n* `Bridge\
    \ Pattern` (Lab - 7)\n* `Composite Pattern` (Lab - 8)\n* `Decorator Pattern` (Lab\
    \ - 9)\n* `Facade Pattern` (Lab - 10)\n* `Filter/Criteria Pattern` (Lab - 11)\n\
    * `Proxy Pattern` (Lab - 12)\n\n#### Chapter 4: Behavioral Design Pattern\n* `Chain\
    \ Of Responsibility Pattern` (Lab - 13)\n* `Command Pattern` (Lab - 14)\n* `Interpreter\
    \ Pattern` (Lab - 15)\n* `Iterator Pattern` (Lab - 16)\n* `Mediator Pattern` (Lab\
    \ - 17)\n* `Null Object Pattern` (Lab - 18)\n* `Observer Pattern` (Lab - 19)\n\
    * `State Pattern` (Lab - 20)\n* `Strategy Pattern` (Lab - 21)\n* `Template Pattern`\
    \ (Lab - 22)\n* `Visitor Pattern` (Lab - 23)\n* `MVC Pattern` (Lab - 24)\n\n####\
    \ Chapter 5: JEE Design Pattern\n* `Data Access Object Pattern` (Lab - 25)\n\n\
    ## Introduction\n\nDesign patterns are programming language independent, they\
    \ are for solving common object-oriented design problems. A design pattern represents\
    \ an idea, not an implementation. By using the design patterns we can make our\
    \ code more flexible, reusable and maintainable. Java itself follows design patterns.\n\
    \nIn core java, there are mainly three types of design patterns, which are further\
    \ divided into their sub-parts:\n\n**Creational Design Pattern**\n1. `Factory\
    \ Pattern`\n2. `Abstract Factory Pattern`\n3. `Singleton Pattern`\n4. `Prototype\
    \ Pattern`\n5. `Builder Pattern`\n\n**Structural Design Pattern**\n1. `Adapter\
    \ Pattern`\n2. `Bridge Pattern`\n3. `Composite Pattern`\n4. `Decorator Pattern`\n\
    5. `Facade Pattern`\n6. `Flyweight Pattern`\n7. `Proxy Pattern`\n\n**Behavioral\
    \ Design Pattern**\n1. `Chain Of Responsibility Pattern`\n2. `Command Pattern`\n\
    3. `Interpreter Pattern`\n4. `Iterator Pattern`\n5. `Mediator Pattern`\n6. `Memento\
    \ Pattern`\n7. `Observer Pattern`\n8. `State Pattern`\n9. `Strategy Pattern`\n\
    10. `Template Pattern`\n11. `Visitor Pattern`\n\nCreational design patterns are\
    \ used when creating objects.\n\n## Chapter 1: Introduction\n\nA design pattern\
    \ is a well-proved solution for solving a specific problem/task. For example,\
    \ to create a class for which only a single instance should be created and that\
    \ single object can be used by all other classes, use `Singleton` design pattern.\n\
    \nDesign patterns are programming language independent, they are for solving common\
    \ object-oriented design problems. A design pattern represents an idea, not an\
    \ implementation. By using the design patterns we can make our code more flexible,\
    \ reusable and maintainable. Java itself follows design patterns.\n\nIn core java,\
    \ there are mainly three types of design patterns, which are further divided into\
    \ their sub-parts:\n\n**Creational Design Pattern**\n1. `Factory Pattern`\n2.\
    \ `Abstract Factory Pattern`\n3. `Singleton Pattern`\n4. `Prototype Pattern`\n\
    5. `Builder Pattern`\n\n**Structural Design Pattern**\n1. `Adapter Pattern`\n\
    2. `Bridge Pattern`\n3. `Composite Pattern`\n4. `Decorator Pattern`\n5. `Facade\
    \ Pattern`\n6. `Flyweight Pattern`\n7. `Proxy Pattern`\n\n**Behavioral Design\
    \ Pattern**\n1. `Chain Of Responsibility Pattern`\n2. `Command Pattern`\n3. `Interpreter\
    \ Pattern`\n4. `Iterator Pattern`\n5. `Mediator Pattern`\n6. `Memento Pattern`\n\
    7. `Observer Pattern`\n8. `State Pattern`\n9. `Strategy Pattern`\n10. `Template\
    \ Pattern`\n11. `Visitor Pattern`\n\n## Chapter 2: Creational Design Pattern\n\
    \n### Factory Pattern\n\nFactory pattern is a creational pattern that provides\
    \ ways to create objects without exposing the creation logic to the client. In\
    \ the following sections we will show how to use Factory pattern to create shape\
    \ objects.\n\nFirst we design an interface to represent `Shape`.\n\n```java\n\
    public interface Shape {\n    void draw();\n}\n```\n\nThen we create concrete\
    \ classes implementing the interface.\n\n```java\npublic class Rectangle implements\
    \ Shape {\n    @Override\n    public void draw() {\n        System.out.println(\"\
    Inside Rectangle\");\n    }\n}\n```\n\n```java\npublic class Square implements\
    \ Shape {\n    @Override\n    public void draw() {\n        System.out.println(\"\
    Inside Square\");\n    }\n}\n```\n\n```java\npublic class Circle implements Shape\
    \ {\n    @Override\n    public void draw() {\n        System.out.println(\"Inside\
    \ Circle\");\n    }\n}\n```\n\nThe core factory pattern is a `FactoryFactory`\
    \ class. The `ShapeFactory` class creates `Shape` object based on the String value\
    \ passed to `getShape()` method. If the String value is `CIRCLE`, it will create\
    \ a `Circle` object.\n\n```java\npublic class ShapeFactory {\n    // use getShape\
    \ method to get object of type shape\n    public Shape getShape(String shapeType)\
    \ {\n        if (shapeType == null) {\n            return null;\n        }\n \
    \       if (shapeType.equalsIgnoreCase(\"CIRCLE\")) {\n            return new\
    \ Circle();\n        } else if (shapeType.equalsIgnoreCase(\"RECTANGLE\")) {\n\
    \            return new Rectangle();\n        } else if (shapeType.equalsIgnoreCase(\"\
    SQUARE\")) {\n            return new Square();\n        }\n        return null;\n\
    \    }\n}\n```\n\nThe following code has `main` method and it uses the Factory\
    \ class to get object of concrete class by passing an information such as type.\n\
    \n```java\npublic class Main {\n    public static void main(String[] args) {\n\
    \        ShapeFactory shapeFactory = new ShapeFactory();\n        // get an object\
    \ of Circle and call its draw method.\n        Shape shape1 = shapeFactory.getShape(\"\
    CIRCLE\");\n        shape1.draw();\n        // get an object of Rectangle and\
    \ call its draw method.\n        Shape shape2 = shapeFactory.getShape(\"RECTANGLE\"\
    );\n        shape2.draw();\n        // get an object of Square and call its draw\
    \ method.\n        Shape shape3 = shapeFactory.getShape(\"SQUARE\");\n       \
    \ shape3.draw();\n    }\n}\n```\n\nThe code above generates the following result:\n\
    \nOutput:\n```\nInside Circle\nInside Rectangle\nInside Square\n```\n\n### Abstract\
    \ Factory Pattern\n\nAbstract Factory pattern is another creational pattern. Abstract\
    \ Factory patterns, also called as Factory of factories, have a factory which\
    \ creates other factories. When using Abstract Factory pattern, we first use super\
    \ factory to create factory, then use the created factory to create objects.\n\
    \nLab - 2\n"
