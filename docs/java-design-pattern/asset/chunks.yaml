    \ 实验 – 11\n\n#### Employee.java\n\n```java\nimport java.util.List;\nimport java.util.ArrayList;\n\
    class Employee {\n    private String name;\n    private String gender;\n    private\
    \ String retireStatus;\n    public Employee(String name, String gender, String\
    \ r) {\n        this.name = name;\n        this.gender = gender;\n        this.retireStatus\
    \ = r;\n    }\n    public String getName() {return name; }\n    public String\
    \ getGender() {return gender; }\n    public String getRetireStatus() {return retireStatus;\
    \ }\n    @Override\n    public String toString() {\n        return \"Employee\
    \ [name=\" + name + \", gender=\" + gender + \", retireStatus=\" + retireStatus\
    \ + \"]\";\n    }\n}\ninterface Criteria {\n    List<Employee> meetCriteria(List<Employee>\
    \ persons);\n}\nclass CriteriaMale implements Criteria {\n    @Override\n    public\
    \ List<Employee> meetCriteria(List<Employee> persons) {\n        List<Employee>\
    \ malePersons = new ArrayList<>();\n        for (Employee person : persons) {\n\
    \            if (person.getGender().equalsIgnoreCase(\"MALE\")) {\n          \
    \      malePersons.add(person);\n            }\n        }\n        return malePersons;\n\
    \    }\n}\nclass CriteriaFemale implements Criteria {\n    @Override\n    public\
    \ List<Employee> meetCriteria(List<Employee> persons) {\n        List<Employee>\
    \ femalePersons = new ArrayList<>();\n        for (Employee person : persons)\
    \ {\n            if (person.getGender().equalsIgnoreCase(\"FEMALE\")) {\n    \
    \            femalePersons.add(person);\n            }\n        }\n        return\
    \ femalePersons;\n    }\n}\nclass CriteriaRetire implements Criteria {\n    @Override\n\
