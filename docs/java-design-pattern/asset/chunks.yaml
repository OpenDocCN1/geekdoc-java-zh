  trans: "\n\n![](img/image_rsrc27V.jpg)\n\n# Java 设计模式\n\n在书中，你将学习带有图解的解释以及运行实验，并展示成功执行实验后的输出。提供分步说明的现成解决方案。\n\
    \n**AMIT K**\n\n## 目录\n\n### SQL：逐步学习 SQL 编程初学者指南\n\n#### 引言\n##### 第 1 章：引言\n\
    * 设计模式介绍\n\n#### 第 2 章：创建型模式\n* `工厂模式` (实验 - 1)\n* `抽象工厂模式` (实验 - 2)\n* `单例模式`\
    \ (实验 - 3)\n* `原型模式` (实验 - 4)\n* `构建器模式` (实验 - 5)\n\n#### 第 3 章：结构型模式\n* `适配器模式`\
    \ (实验 - 6)\n* `桥接模式` (实验 - 7)\n* `组合模式` (实验 - 8)\n* `装饰器模式` (实验 - 9)\n* `外观模式`\
    \ (实验 - 10)\n* `过滤器/准则模式` (实验 - 11)\n* `代理模式` (实验 - 12)\n\n#### 第 4 章：行为型模式\n\
    * `责任链模式` (实验 - 13)\n* `命令模式` (实验 - 14)\n* `解释器模式` (实验 - 15)\n* `迭代器模式` (实验 -\
    \ 16)\n* `调停者模式` (实验 - 17)\n* `空对象模式` (实验 - 18)\n* `观察模式` (实验 - 19)\n* `状态模式`\
    \ (实验 - 20)\n* `策略模式` (实验 - 21)\n* `模板方法模式` (实验 - 22)\n* `访问者模式` (实验 - 23)\n*\
    \ `MVC 模式` (实验 - 24)\n\n#### 第 5 章：JEE 设计模式\n* `数据访问对象模式` (实验 - 25)\n\n## 引言\n\
    \n设计模式独立于编程语言，它们用于解决常见的面向对象设计问题。设计模式代表一种思想，而不是具体的实现。通过使用设计模式，我们可以使代码更具活性、可重用性和可维护性。Java\
    \ 本身也遵循设计模式。\n\n在 Java Java 中，主要有三种设计模式，它们进一步被分为子部分：\n\n**创建型设计模式**\n1. `工厂模式`\n\
    2. `抽象工厂模式`\n3. `单例模式`\n4. `原型模式`\n5. `构建器模式`\n\n**结构型设计模式**\n1. `适配器模式`\n2. `桥接模式`\n\
    3. `组合模式`\n4. `装饰器模式`\n5. `外观模式`\n6. `享重量模式`\n7. `代理模式`\n\n**行为型设计模式**\n1. `责任链模式`\n\
    2. `命令模式`\n3. `解释器模式`\n4. `迭代器模式`\n5. `调停者模式`\n6. `备忘模式`\n7. `观察模式`\n8. `状态模式`\n\
    9. `策略模式`\n10. `模板方法模式`\n11. `访问者模式`\n\n创建型设计模式用于创建对象时。\n\n## 第 1 章：引言\n\n设计模式是解决特定问题/任务的经过证明的解决方案。例如，为了创建一个只有一个实例的类，且该实例可以被所有其他类使用，可以使用\
    \ `单例` 设计模式。\n\n设计模式独立于编程语言，它们用于解决常见的面向对象设计问题。设计模式代表一种思想，而不是具体的实现。通过使用设计模式，我们可以使代码更具活性、可重用性和可维护性。Java\
    \ 本身也遵循设计模式。\n\n在 Java Java 中，主要有三种设计模式，它们进一步被分为子部分：\n\n**创建型设计模式**\n1. `工厂模式`\n\
    2. `抽象工厂模式`\n3. `单例模式`\n4. `原型模式`\n5. `构建器模式`\n\n**结构型设计模式**\n1. `适配器模式`\n2. `桥接模式`\n\
    3. `组合模式`\n4. `装饰器模式`\n5. `外观模式`\n6. `享重量模式`\n7. `代理模式`\n\n**行为型设计模式**\n1. `责任链模式`\n\
    2. `命令模式`\n3. `解释器模式`\n4. `迭代器模式`\n5. `调停者模式`\n6. `备忘模式`\n7. `观察模式`\n8. `状态模式`\n\
    9. `策略模式`\n10. `模板方法模式`\n11. `访问者模式`\n\n## 第 2 章：创建型模式\n\n### 工厂模式\n\n工厂模式是一种创建型模式，它提供了创建对象的方法，而不向客户端暴露创建逻辑。在接下来的章节中，我们将展示如何使用工厂模式创建形状对象。\n\
    \n首先，我们设计一个接口来表示 `Shape`。\n\n```java\npublic interface Shape {\n    void draw();\n\
    }\n```\n\n然后，我们创建实现接口的具体类。\n\n```java\npublic class Rectangle implements Shape\
    \ {\n    @Override\n    public void draw() {\n        System.out.println(\"Inside\
    \ Rectangle\");\n    }\n}\n```\n\n```java\npublic class Square implements Shape\
    \ {\n    @Override\n    public void draw() {\n        System.out.println(\"Inside\
    \ Square\");\n    }\n}\n```\n\n```java\npublic class Circle implements Shape {\n\
    \    @Override\n    public void draw() {\n        System.out.println(\"Inside\
    \ Circle\");\n    }\n}\n```\n\n核心工厂模式是一个 `ShapeFactory` 类。`ShapeFactory` 类根据传递给\
    \ `getShape()` 方法的字符串值创建 `Shape` 对象。如果字符串值为 `CIRCLE`，它创建一个 `Circle` 对象。\n\n```java\n\
    public class ShapeFactory {\n    // 使用 getShape 方法获取类型对象\n    public Shape getShape(String\
    \ shapeType) {\n        if (shapeType == null) {\n            return null;\n \
    \       }\n        if (shapeType.equalsIgnoreCase(\"CIRCLE\")) {\n           \
    \ return new Circle();\n        } else if (shapeType.equalsIgnoreCase(\"RECTANGLE\"\
    )) {\n            return new Rectangle();\n        } else if (shapeType.equalsIgnoreCase(\"\
    SQUARE\")) {\n            return new Square();\n        }\n        return null;\n\
    \    }\n}\n```\n\n以下代码包含 `main` 方法，它使用工厂类通过传递类型等信息获取具体类的对象。\n\n```java\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        ShapeFactory\
    \ shapeFactory = new ShapeFactory();\n        // 获取 Circle 对象并调用其 draw 方法。\n \
    \       Shape shape1 = shapeFactory.getShape(\"CIRCLE\");\n        shape1.draw();\n\
    \        // 获取 Rectangle 对象并调用其 draw 方法。\n        Shape shape2 = shapeFactory.getShape(\"\
    RECTANGLE\");\n        shape2.draw();\n        // 获取 Square 对象并调用其 draw 方法。\n\
    \        Shape shape3 = shapeFactory.getShape(\"SQUARE\");\n        shape3.draw();\n\
    \    }\n}\n```\n\n上面的代码生成以下结果：\n\n输出：\n```\nInside Circle\nInside Rectangle\n\
    Inside Square\n```\n\n### 抽象工厂模式\n\n抽象工厂模式是另一种创建型模式。抽象工厂模式也被称为工厂的工厂，拥有一个创建其他工厂的工厂。使用抽象工厂模式时，我们首先使用超工厂创建工厂，然后使用创建的工厂来创建对象。\n\
    \n实验 - 2\n\n"
- fmt: "\nThe following code shows how to use abstract factory pattern.\n\nWe are\
    \ going to create shapes and `Printers`. For shapes, we would have `circle`, `rectangle`\
    \ and `square`. For printers we will have `paper Printer`, `Web Printer` and `screen\
    \ Printer`.\n\nFor shape we will create `Shape` interface, as follows:\n\n`Shape.java`\n\
    \n```java\ninterface Shape {\n    void draw();\n}\n```\n\nThen we create concrete\
    \ classes implementing the `Shape` interface.\n\n```java\nclass Rectangle implements\
    \ Shape {\n    @Override\n    public void draw() {\n        System.out.println(\"\
    Inside Rectangle::draw() method.\");\n    }\n}\nclass Square implements Shape\
    \ {\n    @Override\n    public void draw() {\n        System.out.println(\"Inside\
    \ Square::draw() method.\");\n    }\n}\nclass Circle implements Shape {\n    @Override\n\
    \    public void draw() {\n        System.out.println(\"Inside Circle::draw()\
    \ method.\");\n    }\n}\n```\n\nAfter that we create an interface for `Printers`.\n\
    \n`Printer.java`\n```java\ninterface Printer{\n    void print();\n}\n```\n\nThen\
    \ we create concrete classes implementing the `Printer` interface.\n\n```java\n\
    class PaperPrinter implements Printer {\n    @Override\n    public void print()\
    \ {\n        System.out.println(\"paper\");\n    }\n}\nclass WebPrinter implements\
    \ Printer {\n    @Override\n    public void print() {\n        System.out.println(\"\
    web\");\n    }\n}\nclass ScreenPrinter implements Printer {\n    @Override\n \
    \   public void print() {\n        System.out.println(\"screen\");\n    }\n}\n\
    ```\n\nFinally we create an abstract class to get factories for `Printer` and\
    \ `Shape` Objects.\n\n```java\nabstract class AbstractFactory {\n    abstract\
    \ Printer getPrinter(String type);\n    abstract Shape getShape(String shape);\n\
    }\n```\n\nFinally we create Factory classes extending `AbstractFactory` to generate\
