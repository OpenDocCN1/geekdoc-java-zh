    \n请求被封装在一个对象中作为命令，并传递给调用者对象。\n\n调用者对象将命令传递给相应的对象，由该对象执行命令。\n\n# 实验 – 14\n\n```java\n\
    import java.util.ArrayList;\nimport java.util.List;\ninterface Command {\n   \
    \ void execute();\n}\nclass MouseCursor {\n    private int x = 10;\n    private\
    \ int y = 10;\n    public void move() {\n        System.out.println(\"Old Position:\"\
    +x +\":\"+y);\n        x++;\n        y++;\n        System.out.println(\"New Position:\"\
    +x +\":\"+y);\n    }\n    public void reset() {\n        System.out.println(\"\
    reset\");\n        x = 10;\n        y = 10;\n    }\n}\nclass MoveCursor implements\
    \ Command {\n    private MouseCursor abcStock;\n    public MoveCursor(MouseCursor\
    \ abcStock) {\n        this.abcStock = abcStock;\n    }\n    public void execute()\
    \ {\n        abcStock.move();\n    }\n}\nclass ResetCursor implements Command\
    \ {\n    private MouseCursor abcStock;\n    public ResetCursor(MouseCursor abcStock)\
    \ {\n        this.abcStock = abcStock;\n    }\n    public void execute() {\n \
    \       abcStock.reset();\n    }\n}\nclass MouseCommands {\n    private List<Command>\
    \ orderList = new ArrayList<Command>();\n    public void takeOrder(Command order)\
    \ {\n        orderList.add(order);\n    }\n    public void placeOrders() {\n \
    \       for (Command order : orderList) {\n            order.execute();\n    \
    \    }\n        orderList.clear();\n    }\n}\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        MouseCursor cursor = new MouseCursor();\n\
    \        MoveCursor moveCursor = new MoveCursor(cursor);\n        ResetCursor\
    \ resetCursor = new ResetCursor(cursor);\n        MouseCommands commands= new\
    \ MouseCommands();\n        commands.takeOrder(moveCursor);\n        commands.takeOrder(resetCursor);\n\
    \        commands.placeOrders();\n    }\n}\n```\n\n上述代码生成了以下结果。\n\n输出\n\n| ![](img/image_rsrc288.jpg)\
    \ |\n\n# 3. 解释器模式\n\n我们通常使用解释器模式来评估语言语法或表达式。\n\n这种类型的模式是行为模式之一。\n\n# 实验 – 15\n\
    \n```java\ninterface Expression {\n    boolean evaluate(String context);\n}\n\
    class IsInExpression implements Expression {\n    private String data;\n    public\
    \ IsInExpression(String data) {\n        this.data = data;\n    }\n    @Override\n\
    \    public boolean evaluate(String context) {\n        if (context.contains(data))\
    \ {\n            return true;\n        }\n        return false;\n    }\n}\nclass\
    \ OrExpression implements Expression {\n    private Expression expr1 = null;\n\
    \    private Expression expr2 = null;\n    public OrExpression(Expression expr1,\
    \ Expression expr2) {\n        this.expr1 = expr1;\n        this.expr2 = expr2;\n\
    \    }\n    @Override\n    public boolean evaluate(String context) {\n       \
    \ return expr1.evaluate(context) && expr2.evaluate(context);\n    }\n}\nclass\
    \ AndExpression implements Expression {\n    private Expression expr1 = null;\n\
    \    private Expression expr2 = null;\n    public AndExpression(Expression expr1,\
    \ Expression expr2) {\n        this.expr1 = expr1;\n        this.expr2 = expr2;\n\
    \    }\n    @Override\n    public boolean evaluate(String context) {\n       \
    \ return expr1.evaluate(context) && expr2.evaluate(context);\n    }\n}\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        Expression\
    \ select = new IsInExpression(\"Select\");\n        Expression from = new IsInExpression(\"\
    From\");\n        Expression isSelectFrom = new AndExpression(select, from);\n\
    \        Expression insert = new IsInExpression(\"Insert\");\n        Expression\
    \ update = new IsInExpression(\"Update\");\n        Expression isInsertOrUpdate\
    \ = new OrExpression(insert, update);\n        System.out.println(isSelectedFrom.evaluate(\"\
    Select\"));\n        System.out.println(isInsertOrUpdate.evaluate(\"Insert\"));\n\
    \        System.out.println(isSelectedFrom.evaluate(\" From\"));\n        System.out.println(isInsertOrUpdate.evaluate(\"\
    Update\"));\n    }\n}\n```\n\n上述代码生成了以下结果。\n\n输出\n\n| ![](img/image_rsrc289) |\n\
    \n# 4. 迭代器模式\n\n迭代器模式以顺序方式访问集合对象的元素。\n\n迭代器模式是行为模式之一。\n\n# 实验 – 16\n\n```java\n\
    interface Iterator {\n    boolean hasNext();\n    Object next();\n}\nclass LetterBag\
    \ {\n    String names[] = {\"R\", \"J\", \"L\"};\n    public Iterator getIterator()\
    \ {\n        return new NameIterator();\n    }\n    class NameIterator implements\
    \ Iterator {\n        int index;\n        @Override\n        public boolean hasNext()\
    \ {\n            if(index < names.length){\n                return true;\n   \
    \         }\n            return false;\n        }\n        @Override\n       \
    \ public Object next() {\n            if(this.hasNext()){\n                return\
    \ names[index++];\n            }\n            return null;\n        }\n    }\n\
    }\npublic class Main {\n    public static void main(String[] args) {\n       \
    \ LetterBag bag = new LetterBag();\n        for(Iterator iter = bag.getIterator();\
    \ iter.hasNext();){\n            String name = (String)iter.next();\n        \
    \    System.out.println(\"Name : \" + name);\n        }\n    }\n}\n```\n\n上述代码生成了以下结果。\n\
    \n输出\n\n| ![](img/image_rsrc28A) |\n\n# 5. 中介者模式\n\n中介模式减少了多个对象之间的通信。\n\n该模式提供了一个中介类来处理所有类之间的通信。\n\
    \n中介模式属于行为模式分类。\n\n# 实验 – 17\n\n```java\nclass Printer {\n    public static void\
    \ showMessage(Machine user, String message) {\n        System.out.println(new\
    \ java.util.Date().toString() + \" [\" + user.getName() +\"]: \" + message);\n\
    \    }\n}\nclass Machine {\n    private String name;\n    public Machine(String\
    \ name) {\n        this.name = name;\n    }\n    public String getName() {\n \
