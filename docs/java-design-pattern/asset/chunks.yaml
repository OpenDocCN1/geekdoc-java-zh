    \ Pattern）。\n\n从名称可以看出 MVC 模式包含三个部分：\n\n- **模型 (Model)** - `Model` 代表一个携带数据的对象。如果它的数据发生变化，它也可以拥有更新控制器的逻辑。\n\
    - **视图 (View)** - `View` 代表模型所包含的数据的可视化。它通常包含 UI 逻辑。\n- **控制器 (Controller)** -\
    \ `Controller` 同时引用 `Model` 和 `view`。它控制进入模型对象的数据流，并在数据发生变化时更新视图。它保持了 `View` 和\
    \ `Model` 的分离。\n\n## 实验 – 24\n\n```java\nclass Employee {\n  private String id;\n\
    \  private String name;\n  public String getId() {\n    return id;\n  }\n  public\
