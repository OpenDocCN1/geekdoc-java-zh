  \n优先队列是一种特殊的队列类型，其中每个元素都关联一个优先级，优先级最高的元素会在其他低优先级的元素之前处理。这种抽象数据类型与传统队列略有不同，传统队列的元素按到达时间排序。优先队列在许多应用中至关重要。\n\
  \n在优先队列中，主要操作包括 `insert`、`deleteMin` 或 `deleteMax`，取决于它是最小优先队列还是最大优先队列。\n\n```java\n\
  class PriorityQueue { \n  void insert(Element e); \n  Element deleteMin(); // 用于最小优先队列\n\
  \  Element deleteMax(); // 用于最大优先队列\n}\n```\n\n为了高效实现优先队列，通常由堆支撑，因为其插入和删除操作的时间复杂度为\
  \ `O(log n)`。本节将涵盖优先队列的概念理解、其重要性以及结构化方法。\n\n**优先队列的操作：**\n\n1. **插入：** 根据优先级将元素添加到优先队列的适当位置。\n\
  \n**算法 26：优先队列的插入**\n**输入：** `PriorityQueue PQ`, `Element e`, `Priority p`\n**输出：**\
  \ 更新后的 `PriorityQueue PQ`\n`PQ.insert(e,p)`\n\n2. **DeleteMin/DeleteMax：** 根据优先队列的类型，该操作会删除最小或最大优先级元素。\n\
  \n**算法 27：最小优先队列的 DeleteMin**\n**输入：** `MinPriorityQueue minPQ`\n**输出：** 最小优先级元素\
  \ `e`, 更新后的 `minPQ`\n`e ← minPQ.deleteMin()`\n\n3. **Peek：** 查看最高优先级元素而不将其从队列中移除。\n\
  \n**算法 28：最小优先队列的 Peek**\n**输入：** `MinPriorityQueue minPQ`\n**输出：** 最小优先级元素 `e`\n\
  `e ← minPQ.peek()`\n\n**使用堆实现：**\n\n实现优先队列的一种常见且高效的方法是使用二叉堆。具体而言，最小堆用于最小优先队列，而最大堆用于最大优先队列。二叉堆确保了每次插入和删除操作都能维持堆属性：对于最小堆，父节点始终小于或等于其子节点；对于最大堆，父节点始终大于或等于其子节点。\n\
  \n在使用最小堆实现的最小优先队列中，最小元素始终位于根节点。当插入元素时，它被添加到堆的末尾，然后向上“上浮”（bubble up）以维持堆属性。当删除最小元素时，堆的最后一个元素替换根节点，然后向下“下浮”（bubble\
  \ down）以重新建立堆结构。\n\n\n\n\n\n```java\nclass MinPriorityQueue {\n\n  private MinHeap\
  \ heap;\n\n  void insert(Element e, Priority p) {\n    heap.add(e, p);\n  }\n\n\
  \  Element deleteMin() {\n    return heap.removeMin();\n  }\n\n  Element peek()\
  \ {\n    return heap.min();\n  }\n}\n```\n\n### 优先队列的优势\n\n- 与排序数组和链表等数据结构相比，插入和删除操作的时间复杂度更高。\n\
  - 具有动态调整优先级的灵活性。\n- 广泛应用于需要根据优先级进行动态顺序处理的场景。\n\n### 优先队列的应用\n\n- **任务调度：** 在操作系统中，任务通过优先级进行管理，高优先级任务比低优先级任务优先获得\
  \ CPU 时间。\n- **Dijkstra 算法：** 用于在图中寻找最短路径，优先队列根据最小距离高效地管理和检索下一个要探索的节点。\n- **事件驱动模拟：**\
  \ 根据预定时间管理事件，确保事件按照正确的顺序顺序被处理。\n\n优先队列凭借其对优先级任务的高效处理，是许多算法解决方案中的关键元素。理解它们的实现方式和用例可以增强有效设计和优化复杂系统的能力。\n\
  \n### 8.9 使用堆实现优先队列\n\n优先队列是抽象数据类型，每个元素都关联着一个优先级。元素按照优先级从高到低的顺序出队。堆（尤其是二叉堆）是实现优先队列的有效结构，因为它们的属性和操作确保了插入和删除的对数级时间复杂度。\n\
  \n**数据结构选择：** 二叉堆是一棵完全二叉树，可以使用数组高效地表示。对于最大堆，优先级最高的元素位于根节点（数组中的索引 0）；对于最小堆，优先级最低的元素位于根节点。\n\
  \n**数组表示法：** 给定一个位于索引 `i` 的节点：\n\n- 父节点位于索引 `⌊(i-1)/2⌋`。\n- 左子节点位于索引 `2i + 1`。\n\
  - 右子节点位于索引 `2i + 2`。\n\n**插入操作：** 插入操作涉及将新元素添加到堆的末尾（底层、最右侧位置），然后“向上浮”该元素以恢复堆的属性。复杂度为\
  \ `O(log n)`。\n\n```java\npublic void insert(int element) {\n  heap[size] = element;\
  \ // 将元素放在数组末尾\n  int current = size;\n  size++;\n  // 向上浮新添加的元素\n  while (current\
  \ != 0 && heap[current] > heap[parent(current)]) {\n    swap(current, parent(current));\n\
  \    current = parent(current);\n  }\n}\n```\n\n**删除操作：** 删除操作通常针对根元素（最高优先级）。用最后一个元素替换根元素，移除最后一个元素，然后“向下调整”被替换的元素以维持堆的属性。复杂度为\
  \ `O(log n)`。\n\n```java\npublic int extractMax() {\n  if (size == 0) throw new\
  \ NoSuchElementException(\"Heap is empty.\");\n  int max = heap[0]; // 根元素\n  heap[0]\
  \ = heap[--size]; // 用最后一个元素替换根节点\n  heapify(0); // 从根节点向下调整\n  return max;\n}\n\
  \nprivate void heapify(int i) {\n  int largest = i;\n  int left = leftChild(i);\n\
  \  int right = rightChild(i);\n  if (left < size && heap[left] > heap[largest])\
  \ largest = left;\n  if (right < size && heap[right] > heap[largest]) largest =\
  \ right;\n  if (largest != i) {\n    swap(i, largest);\n    heapify(largest);\n\
  \  }\n}\n```\n\n**使用堆的优先队列操作：**\n\n- `insert(key)`：向优先队列添加一个新键。\n- `extractMax()`/extractMin()`：移除并返回具有最高/最小优先级的元素。\n\
  - `peekMax()`/peekMin()`：返回最高/最小优先级的元素但不移除它。\n\n**算法 - 向最大堆优先队列插入：**\n\n**算法 29：**\
  \ 插入最大堆优先队列\n**数据：** 大小为 `n` 的最大堆 `H`\n**输入：** 要插入的键 `k`\n将 `k` 插入到 `H` 的末尾；`i`\
  \ ← `n`；**当** `i > 0` **且** `H[i] > H[parent(i)]` **时** 交换 `H[i]` 与 `H[parent(i)]`；`i`\
  \ ← `parent(i)`；`n` ← `n + 1;`\n\n**算法 - 从最大堆优先队列删除：**\n\n**算法 30：** 从最大堆优先队列删除\n\
  **数据：** 大小为 `n` 的最大堆 `H`\n**输出：** 堆中的最大元素\n**如果** `n == 0` **则** **返回** 错误 \"Heap\
  \ is empty\"；`max` ← `H[0]`；`H[0]` ← `H[n-1]`；`n` ← `n - 1`；`i` ← 0；**当** `leftChild(i)\
  \ < n` **时** `largest` ← `i`；**如果** `H[leftChild(i)] > H[largest]` **则** `largest`\
  \ ← `leftChild(i)`；**如果** `rightChild(i) < n` **且** `H[rightChild(i)] > H[largest]`\
  \ **则** `largest` ← `rightChild(i)`\n\n**数组实现的优先队列：** 我们在类中封装了这些操作：\n\n```java\n\
  class PriorityQueue {\n  int[] heap;\n  int size;\n\n  PriorityQueue(int capacity)\
  \ {\n    heap = new int[capacity];\n    size = 0;\n  }\n\n  void insert(int key)\
  \ {\n    if (size == heap.length) throw new IllegalStateException(\"Heap is full.\"\
  );\n    heap[size] = key;\n    int current = size;\n    size++;\n    while (current\
  \ != 0 && heap[current] > heap[(current-1)/2]) {\n      swap(current, (current-1)/2);\n\
  \      current = (current-1)/2;\n    }\n  }\n\n  public int extractMax() {\n   \
  \ if (size == 0) throw new NoSuchElementException(\"Heap is empty.\");\n    int\
  \ max = heap[0];\n    heap[0] = heap[--size];\n    heapify(0);\n    return max;\n\
  \  }\n\n  public int peekMax() {\n    if (size == 0) throw new NoSuchElementException(\"\
  Heap is empty.\");\n    return heap[0];\n  }\n\n  private void heapify(int i) {\n\
  \    int largest = i;\n    int left = leftChild(i);\n    int right = rightChild(i);\n\
  \    if (left < size && heap[left] > heap[largest]) largest = left;\n    if (right\
  \ < size && heap[right] > heap[largest]) largest = right;\n    if (largest != i)\
  \ {\n      swap(i, largest);\n      heapify(largest);\n    }\n  }\n\n  private void\
  \ swap(int i, int j) {\n    int temp = heap[i];\n    heap[i] = heap[j];\n    heap[j]\
  \ = temp;\n  }\n}\n```\n\n\n\n\n\n### 算法 31：使用二叉堆的 Dijkstra 算法\n\n**输入：** 权重 `w`\
  \ 的图 `G = (V,E)`，源顶点 `s`\n**输出：** 从 `s` 到 `V` 中所有顶点的最短路径\n\n1. 将所有顶点的距离初始化为 `∞`，源顶点\
  \ `s` 的距离初始化为 0；\n2. 初始化一个空的优先级队列 `Q`；\n3. 将 `s` 插入 `Q` 中，优先级为 0；\n4. **当** `Q`\
  \ 不空**时**:\n   - 从 `Q` 中提取距离最小的顶点 `u`；\n   - **对于** `u` 的每个邻居 `v` **执行**:\n    \
  \ - 松弛边边 `(u,v)`；\n     - **如果** 松弛操作减小了 `v` 的距离 **则**:\n       - 将 `v` 插入 `Q` 或降低其在\
  \ `Q` 中的优先级；\n\n在此实现中，优先级队列确保了顶点按照它们距离源点的顺序被处理，从而实现了高效的路径查找。\n\n### 2. Prim 最小生成树算法\n\
  \n用于寻找图的最小生成树（MST）的 Prim 算法同样由于堆的特性。该算法通过增长一条边来构建 MST，并使用优先级队列来跟踪跨越已构建 MST 与剩余顶点之间切割的最小权重边。\n\
  \n### 算法 32：最小生成树的 Prim 算法\n\n**输入：** 权重 `w` 的图 `G = (V,E)`\n**输出：** 最小生成树 `T`\n\
  \n1. 将 `T` 初始化为空集合；\n2. 初始化一个空的优先级队列 `Q`；\n3. 选择一个任意顶点 `u` 作为起始顶点；\n4. 将 `u` 插入\
  \ `Q` 中，优先级为 0；\n5. **当** `|T| < |V| − 1`**时**:\n   - 从 `Q` 中提取边权重最小的顶点 `u`；\n \
  \  - 将代价最小的边 `(u,v)` 添加到 `T`，其中 `v` 是非顶点；\n   - **对于** 每条边 `(u,v)` **执行**:\n   \
  \  - **如果** `v` 未包含在树中**则**:\n       - 将 `v` 插入 `Q` 并权重 `w(u,v)`，若 `w(u,v)` 减小则更新\
  \ `Q`；\n\n此处使用优先级队列确保了在每一步中，都能高效地选择增长中的 MST 与剩余顶点的最小边。\n\n### 3. 事件模拟\n\n优先级队列在离散事件模拟中至关重要。模拟中的事件被调度在特定时间发生，并需要按照时间顺序处理。优先级队列可以跟踪这些事件，并将事件时间作为优先级。\n\
  \n```java\nclass Event implements Comparable<Event> { \n\n    int time; \n    String\
  \ description; \n    public Event(int time, String description) { \n      this.time\
  \ = time; \n      this.description = description; \n    } \n\n    @Override \n \
  \   public int compareTo(Event other) { \n      return Integer.compare(this.time,\
  \ other.time); \n    } \n} \n\nPriorityQueue<Event> eventQueue = new PriorityQueue<Event>();\
  \ \n\neventQueue.add(new Event(10, \"Event1\")); \n\neventQueue.add(new Event(5,\
  \ \"Event2\")); \n\neventQueue.add(new Event(15, \"Event3\")); \n\nwhile (!eventQueue.isEmpty())\
  \ { \n    Event event = eventQueue.poll(); \n    System.out.println(\"Processing\
  \ \" + event.description + \" at time \" + event.time); \n}\n```\n\n```\nProcessing\
  \ Event2 at time 5 \nProcessing Event1 at time 10 \nProcessing Event3 at time 15\n\
  ```\n\n在此示例中，事件被添加到优先级队列中并按照其调度时间的递增顺序进行处理，确保了准确的模拟行为。\n\n### 4. 哈夫编码\n\n堆被用于哈夫编码中构建哈夫树，哈夫树根据频率为一组符号提供最优前缀码。算法重复合并频率最低的两个节点，这一操作通过优先级队列高效管理。\n\
  \n### 算法 33：哈夫编码算法\n\n**输入：** 字符频率数组\n**输出：** 哈夫树的根节点\n\n1. 使用字符的频率创建一个优先级队列 `Q`；\n\
  2. **当** `Q` 拥有节点一个以上**时**:\n   - 提取两个频率最低的节点 `x` 和 `y`；\n   - 创建一个频率为 `f(z) = f(x)\
  \ + f(y)` 的新节点 `z`；\n   - 将 `x` 和 `y` 分为 `z` 的孩子；\n   - 将 `z` 放回 `Q`；\n3. **返回**\
  \ `Q` 中剩余的节点（哈夫树的根）\n\n优先级队列确保了每一步都合并频率最低的两个节点，产生最优编码树。\n\n### 5. 操作系统：进程调度\n\n\
  在操作系统中，堆用于任务调度，需要执行具有不同优先级的进程。优先级队列可以管理这些任务，确保高优先级先执行。\n\n```java\nclass Process\
  \ implements Comparable<Process> { \n\n    int priority; \n    String name; \n \
  \   public Process(int priority, String name) { \n      this.priority = priority;\
  \ \n      this.name = name; \n    } \n\n    @Override \n    public int compareTo(Process\
  \ other) { \n      return Integer.compare(this.priority, other.priority); \n   \
  \ } \n} \n\nPriorityQueue<Process> processQueue = new PriorityQueue<Process>();\
  \ \n\nprocessQueue.add(new Process(3, \"Task1\")); \n\nprocessQueue.add(new Process(1,\
  \ \"Task2\")); \n\nprocessQueue.add(new Process(2, \"Task3\")); \n\nwhile (!processQueue.isEmpty())\
  \ { \n    Process process = processQueue.poll(); \n    System.out.println(\"Executing\
  \ \" + process.name + \" with priority \" + process.priority); \n}\n```\n\n```\n\
  Executing Task2 with priority 1\nExecuting Task3 with priority 2\nExecuting Task1\
  \ with priority 3\n```\n\n这种实现确保了按照优先级调度，对于实时系统特别有用。这些应用展示了堆的灵活性。\n\n### 8 d 叉堆\n\
  \nd 叉堆是二叉堆的泛化，每个节点拥有 d 个孩子而不是二叉堆中的两个。这种泛化可以为某些应用提供显著的性能提升。\n\n**定义：** d 叉堆（d-heap）是一个完全\
  \ d 叉树，每个节点最多 d 个孩子，并维护堆属性。堆属性指出，对于最小堆，每个节点的值小于或等于其孩子；对于最大堆，每个节点的值大于或等于其孩子。\n\n\
  **属性：**\n\n*   **度数：** d 叉堆中的每个内部节点最多 d 个孩子。根节点位于索引 0。\n*   **高度：** 拥有 n 个元素的 d\
  \ 叉堆的高度为 `⌈logd⌉`，对 n 是对数关系且与底 d 成比例。\n*   **存储：** d 叉堆可以使用类似于二叉堆的方法高效地存储在数组中。\n\
  \n**索引计算：** 给堆的零索引数组表示中索引为 `i` 的节点：\n\n*   第一个孩子的索引为 `d * i + 1`。\n*   最后一个孩子的索引为\
  \ `d * i + d`。\n*   父节点的索引为 `⌊(i−1)/d⌋`。\n\n**插入：** 插入操作涉及将新元素添加到数组末尾，然后“向上移动”以维护堆属性。算法如下：\n\
  \n### 算法 34：d 叉堆插入\n\n**输入：** d 叉堆 `H`，元素 `e`\n**输出：** 插入了元素 `e` 的更新堆 `H`\n\n1.\
  \ `H.insert(e)`\n2. `i ← H.size − 1`\n3. **当** `i > 0` 且 `H.parent(i) > H[i]`**时**:\n\
  \   - `swap(H[i],H.parent(i))`\n   - `i ← H.parent(i)`\n\n**删除：** 删除操作，特别是删除最小堆中的最小元素（或最大堆中的最大元素），涉及移除根节点，然后“向下移动”最后一个元素以恢复堆属性。最小堆的算法如下：\n\
  \n\n\n\n\n# 算法 35：D 叉堆删除\n\n**输入：** D 叉堆 `H`\n**输出：** 删除了最小元素后的更新堆 `H`\n\n```text\n\
  min ← H[0];\nH[0] ← H.last();\nH.deleteLast();\ni ← 0;\nwhile hasChild(i) do\n \
  \   minChildIndex ← index of minimum child of i;\n    if H[i] > H[minChildIndex]\
  \ then\n        swap(H[i],H[minChildIndex]);\n        i ← minChildIndex;\n    else\n\
  \        break;\n    end\nend\n```\n\n## 性能分析\n\n*   **插入操作**：“向上调整”操作需要 `O(log\
  \ [d]n)` 时间，因为堆的高度为 `log [d]n`。\n*   **删除操作**：“向下调整”操作同样需要 `O(log [d]n)` 时间。\n*\
  \   **建堆**：通过使用自底向上的方法，从 `n` 个元素构建一个 D 叉堆可以在 `O(n)` 时间内完成，这与二叉堆使用的方法类似。\n\n####\
  \ 优缺点\n\n*   **优点**：树高度的降低可能会提高 `decrease-key` 和 `delete` 操作的运行。在需要高效处理大型优先级队列的应用中，性能得到了提升。\n\
  *   **缺点**：每个节点子节点数量的增加会导致向上调整和向下调整过程中进行更多比较，可能会抵消降低高度带来的收益。由于需要管理多个子节点，实现复杂度略微增加。\n\
  \n理解选择叉数 `d` 时涉及的权衡，对于在网络路由、作业调度等特定应用中利用 D 叉堆的优势至关重要。因此，对 D 叉堆的研究不仅体现在理论能力上，还体现在跨计算场景的实际适应性。\n\
  \n## 8.12 斐波那契堆\n\n斐波那契堆是优先级队列的一种高级形式，与二叉堆和二项堆相比，它为部分部分操作提供了更高的效率。它们在 `decrease-key`\
  \ 操作频繁的应用中特别有用，例如 Dijkstra 算法和 Prim 算法等网络优化算法。\n\n一个斐波那契堆是一组满足最小堆属性的树集合，其中节点的键值大于或等于其父节点的键值。斐波那契堆中的树是无序的，但遵循特定的结构约束以确保高效的摊还性能。\n\
  \n### 基础结构\n\n*   `min_pointer`：指向键值最小节点。\n*   `root_list`：连接所有根节点的循环双向链表。\n*  \
  \ `node structure`：每个节点包含一个指向父节点和子节点的指针、度（子节点数量）以及一个用于切割操作的标记标志。\n\n### 关键操作\n\n\
  #### 插入\n插入操作以常数时间内向根列表添加新节点。这是通过将节点插入根节点的循环双向链表并在必要时更新 `min_pointer` 完成的。\n\n```java\n\
  public void insert(Node x) { \n    x.degree = 0;\n    x.parent = null;\n    x.child\
  \ = null;\n    x.mark = false;\n    if (minNode != null) {\n      minNode.addSibling(x);\n\
  \      if (x.key < minNode.key) {\n          minNode = x;\n      }\n    } else {\n\
  \      minNode = x;\n    }\n    n++;\n}\n```\n\n#### 提取最小值 (Extract-Min)\nextract-min\
  \ 操作删除 `min_pointer` 指向的节点，它涉及几个步骤：\n1. 将最小节点的每个孩子添加到根列表。\n2. 从根列表中移除最小节点。\n3. 执行\
  \ `consolidate()` 操作，合并相同度的树以维持高效的结构。\n\n```java\npublic Node extractMin() { \n\
  \    Node z = minNode;\n    if (z != null) {\n      for (Node x : z.children) {\n\
  \          rootList.add(x);\n          x.parent = null;\n      }\n      rootList.remove(z);\n\
  \      if (z == z.right) {\n          minNode = null;\n      } else {\n        \
  \  minNode = z.right;\n          consolidate();\n      }\n      n--;\n    }\n  \
  \  return z;\n}\n```\n\n`consolidate()` 方法负责通过确保没有两个根节点具有相同的度来维护堆。\n\n```java\n\
  private void consolidate() {\n  int arraySize = ((int) Math.floor(Math.log(n) /\
  \ Math.log(2.0))) + 1;\n  Node[] array = new Node[arraySize];\n  // 初始化数组\n  for\
  \ (int i = 0; i < arraySize; i++) {\n    array[i] = null;\n  }\n  // 遍历根列表\n  for\
  \ (Node w : rootList) {\n    Node x = w;\n    int d = x.degree;\n    while (array[d]\
  \ != null) {\n      Node y = array[d];\n      if (x.key > y.key) {\n          Node\
  \ temp = x;\n          x = y;\n          y = temp;\n      }\n      link(y, x);\n\
  \      array[d] = null;\n      d++;\n    }\n    array[d] = x;\n  }\n  minNode =\
  \ null;\n  for (int i = 0; i < arraySize; i++) {\n    if (array[i] != null) {\n\
  \      if (minNode == null) {\n          minNode = array[i];\n      } else {\n \
  \       if (array[i].key < minNode.key) {\n            minNode = array[i];\n   \
  \     }\n      }\n    }\n  }\n}\n```\n\n`link` 操作合并两个相同度的树。\n\n```java\nprivate\
  \ void link(Node y, Node x) { \n  rootList.remove(y);\n  y.parent = x;\n  if (x.child\
  \ == null) {\n      x.child = y;\n  } else {\n      x.addSibling(y);\n  }\n  x.degree++;\n\
  }\n```\n\n#### 减键 (Decrease-Key)\n`decrease-key` 操作减少堆中某个键的值，并在违反结构条件时会触发切割操作。\n\
  \n```java\npublic void decreaseKey(Node x, int k) {\n  x.key = k;\n  Node y = x.parent;\n\
  \  if (y != null && x.key < y.key) {\n    cut(x, y);\n    cascadingCut(y);\n  }\n\
  \  if (x.key < minNode.key) {\n    minNode = x;\n  }\n}\n\nprivate void cut(Node\
  \ x, Node y) {\n  y.removeChild(x);\n  y.degree--;\n  rootList.add(x);\n  x.parent\
  \ = null;\n  x.mark = false;\n}\n\nprivate void cascadingCut(Node y) {\n  Node z\
  \ = y.parent;\n  if (z != null) {\n    if (y.mark == false) {\n      y.mark = true;\n\
  \    } else {\n      cut(y, z);\n      cascadingCut(z);\n    }\n  }\n}\n```\n\n\n\
  \n\n\n# 哈希（Hashing）是计算机科学中用于高效存储和检索数据的基本技术。它提供了一种机制，能够在常数时间 `O(1)` 内访问数据。哈希被广泛应用于对快速数据检索至关重要的场景，包括数据库、缓存和集合（sets）。本节将深入探讨哈希的概念，介绍其基本原理以及使其成为数据结构中不可或缺工具的底层机制。\n\
  \n哈希的核心是将给定的输入（称为 `key`，键）转换为一个通常较小的、固定大小的值（称为 `hash code`，哈希码）。这种转换是通过由一个名为 `hash\
  \ function`（哈希函数）的数学函数完成的。`哈希函数`的主要目标是将键均匀地分布在哈希表中，从而最大限度地减少冲突（collisions）的发生。当两个键哈希到哈希表中的同一个索引时，就会发生冲突。\n\
  \n经典的哈希函数之一是除法法，其中`哈希码`的计算方式为 `key` 除以表大小 `m` 的余数：\n\n```java\nint hashFunction(int\
  \ key, int tableSize) { \n    return key % tableSize; \n}\n```\n\n上述 Java 函数 `hashFunction`\
  \ 通过对 `tableSize` 取模来计算给定 `key` 的 `哈希码`。生成的 `哈希码` 决定了该键值对应该存储在哈希表中的索引。\n\n然而，现实世界的应用通常需要更复杂的哈希函数，以考虑可能键的分布并确保均匀分布。良好的哈希函数的属性（例如最小化冲突和计算高效性）将在后续章节中讨论。\n\
  \n存储`哈希码`及其关联值的结构被称为 `hash table`（哈希表）。`哈希表`通常由一个数组组成，其中每个元素（或称为桶，bucket）持有键值对。在插入键值对时，将`哈希函数`应用于\
  \ `key`，以确定在数组中存储的适当索引。对于检索，则对 `key` 再次进行哈希，以定位存储其关联值的桶。\n\n```java\nclass HashTable\
  \ { \n    private static class HashEntry { \n        int key; \n        String value;\
  \ \n        HashEntry(int key, String value) { \n            this.key = key; \n\
  \            this.value = value; \n        } \n    } \n    private HashEntry[] table;\
  \ \n    public HashTable(int size) { \n        table = new HashEntry[size]; \n \
  \   } \n    public void insert(int key, String value) { \n        int index = hashFunction(key,\
  \ table.length); \n        table[index] = new HashEntry(key, value); \n    } \n\
  \    public String search(int key) { \n        int index = hashFunction(key, table.length);\
  \ \n        if (table[index] != null && table[index].key == key) { \n          \
  \  return table[index].value; \n        } \n        return null; \n    } \n    private\
  \ int hashFunction(int key, int tableSize) { \n        return key % tableSize; \n\
  \    } \n}\n```\n\n在这个示例中，`HashTable` 类定义了一个简单的 `哈希表`，其中实现的`哈希函数`是除法法。`insert` 方法对\
  \ `key` 进行哈希并将新的 `HashEntry` 放置在相应的索引处。`search` 方法通过对 `key` 进行哈希并访问相应的索引，检索与给定 `key`\
  \ 关联的值。\n\n冲突是哈希中不可避免的现实，特别是当可能的键集远大于数组大运行时。有效的冲突解决技术（如链地址映射法 separate chaining\
  \ 和开放寻址法 open addressing）对于维持`哈希表`的性能效率至关重要。这些技术及其变体将在各自的章节中进行检查。\n\n最终，哈希确保了数据检索和插入可以在常数时间内完成，显著提高了管理大型数据集的应用程序效率。随着我们探索实现其强大能力的特定机制，哈希的理论基础和实际应用将变得更加清晰。\n\
  \n## 9.2 哈希函数 (Hash Functions)\n\n`哈希函数`是`哈希表`的关键组成部分。它接收一个输入（通常称为 `key`），并将其映射到数组（称为哈希表）中的一个索引。`哈希函数`的主要目标是提供一种确定性的、均匀分布且快速的计算，将键转换为索引。\n\
  \n`哈希函数`的概念公式可以表示为：\n`h(k) = i`\n其中 `h` 表示哈希函数，`k` 代表键，`i` 是数据应存储在哈希表中的索引。\n\n###\
  \ 有效哈希函数的特征\n有效的哈希函数应该具备以下特性：\n- **确定性 (Deterministic)**：给定的输入必须始终产生相同的哈希值。\n- **均匀分布\
  \ (Uniform Distribution)**：哈希值应该均匀分布在哈希表中，以尽可能减少冲突。\n- **高效性 (Efficiency)**：哈希函数在计算上应该是高效的，以维持性能。\n\
  - **冲突冲突 (Minimal Collisions)**：虽然冲突不可避免，但良好的哈希函数会最小化它们的发生频率。\n- **多类型适用性 (Applicability\
  \ to Variable Types)**：哈希函数应该处理各种数据类型，如整数、字符串或对象。\n\n### 哈希函数示例\n几种经典的哈希函数被广泛应用于应用程序中。以下是一些示例：\n\
  \n#### 除法法 (Division Method)\n除法法使用取模运算计算哈希值：\n`h(k) = k mod m`\n其中 `m` 通常是一个质数。这种方法确保了生成的哈希值处于\
  \ 0 到 `m-1` 的范围内。\n```java\nint divisionHash(int key, int tableSize) { \n    return\
  \ key % tableSize; \n}\n```\n\n#### 乘法法 (Multiplication Method)\n乘法法使用一个无理数来扩展键并提取小数部分：\n\
  `h(k) = ⌊m(A mod 1)⌋`\n其中 `0 < A < 1` 是一个常数，`m` 选择为 2 的幂以简化实现。\n```java\nint multiplicationHash(int\
  \ key, int tableSize) { \n    double A = (Math.sqrt(5) - 1) / 2;\n    return (int)(tableSize\
  \ * ((key * A) % 1)); \n}\n```\n\n#### 通用哈希 (Universal Hashing)\n通用哈希从哈希函数族中随机选择一个`哈希函数`，以降低给定键集的冲突概率。\n\
  ```java\nclass UniversalHashFunction { \n    int a, b, p, m; \n    UniversalHashFunction(int\
  \ p, int m) { \n        this.p = p; \n        this.m = m; \n        this.a = (int)\
  \ (Math.random() * (p - 1)) + 1; \n        this.b = (int) (Math.random() * p); \n\
  \    } \n    public int hash(int key) { \n        return ((a * key + b) % p) % m;\
  \ \n    } \n}\n```\n\n#### 加密哈希函数 (Cryptographic Hash Functions)\n这些函数（如 `SHA-256`）产生固定大小的哈希值，并且安全且抗冲突。\n\
  \n#### 字符串哈希 (String Hashing)\n字符串哈希通常需要组合技术，以确保各种字符串均匀地映射到`哈希表`中。一种常用方法是使用多项式或循环冗余校验（CRC）。\n\
  \n#### 多项式滚动哈希 (Polynomial Rolling Hash)\n这种方法将字符串 `s` 视为一个巨大的整数：\n`h(s) = Σ i=0\
  \ to n-1 s[i]⋅p mod m`\n其中 `p` 和 `m` 通常是质数，`p` 通常设置为 31 或 53。\n```java\nint polynomialRollingHash(String\
  \ s, int p, int m) { \n    int hashValue = 0; \n    int pPower = 1; \n    for (char\
  \ c : s.toCharArray()) { \n        hashValue = (hashValue + (c - 'a' + 1) * pPower)\
  \ % m; \n        pPower = (pPower * p) % m; \n    } \n    return hashValue; \n}\n\
  ```\n\n### 9.3 冲突解决技术：链地址映射法 (Collision Resolution Techniques: Separate Chaining)\n\
  \n\n\n\n\n`Separate Chaining`（链地址法）是一种哈希表中广泛使用的冲突解决技术，它利用链表来管理多个哈到相同索引的条目。在这种方法中，哈希表的每个单元都包含指向链表（或链）的指针，链包含相同哈希索引的条目。当发生哈希冲突时，新条目会被简单地添加到相应哈希索引的链表中\n\
  \n#### 机制\n\n链地址法的主要机制涉及为哈希表的每个数组索引维护一个链表。当插入新的键值对时：\n\n*   为键 `k` 计算哈希值 `h(k)`。这将是哈希表中的索引。\n\
  *   遍历索引 `h(k)` 处的链表，并检查 `k` 是否已存在。\n*   如果链表中不存在该键，则将新的键值对插入到列表开头（或结尾）（取决于具体实现）。\n\
  \n搜索操作通过计算哈希值 `h(k)` 并遍历该索引处的链表来查找键来实现。同样，删除操作涉及在链表中定位该键并移除相应的节点。\n\n## 示例代码实现\n\
  \n考虑以下 Java 实现的哈希表链地址法：\n\n```java\npublic class HashTableSeparateChaining<K, V>\
  \ {\n    private static final int DEFAULT_CAPACITY = 10;\n    private int size;\n\
  \    private LinkedList<Entry<K, V>>[] table;\n\n    public HashTableSeparateChaining()\
  \ {\n        table = new LinkedList[DEFAULT_CAPACITY];\n        for (int i = 0;\
  \ i < DEFAULT_CAPACITY; i++) {\n            table[i] = new LinkedList<>();\n   \
  \     }\n        size = 0;\n    }\n\n    private int hash(K key) {\n        return\
  \ Math.abs(key.hashCode()) % table.length;\n    }\n\n    public void put(K key,\
  \ V value) {\n        int index = hash(key);\n        for (Entry<K, V> entry : table[index])\
  \ {\n            if (entry.key.equals(key)) {\n                entry.value = value;\
  \ // Update existing key\n                return;\n            }\n        }\n  \
  \      table[index].add(new Entry<>(key, value));\n        size++;\n    }\n\n  \
  \  public V get(K key) {\n        int index = hash(key);\n        for (Entry<K,\
  \ V> entry : table[index]) {\n            if (entry.key.equals(key)) {\n       \
  \         return entry.value;\n            }\n        }\n        return null;\n\
  \    }\n\n    public boolean remove(K key) {\n        int index = hash(key);\n \
  \       Iterator<Entry<K, V>> iterator = table[index].iterator();\n        while\
  \ (iterator.hasNext()) {\n            Entry<K, V> entry = iterator.next();\n   \
  \         if (entry.key.equals(key)) {\n                iterator.remove();\n   \
  \             size--;\n                return true;\n            }\n        }\n\
  \        return false;\n    }\n\n    private static class Entry<K, V> {\n      \
  \  K key;\n        V value;\n        Entry(K key, V value) {\n            this.key\
  \ = key;\n            this.value = value;\n        }\n    }\n}\n```\n\n该实现包含了使用链地址法的\
  \ `put`、`get` 和 `remove` 操作的方法。一个静态嵌套类 `Entry` 存储了键值对。每个表索引都指向一个条目的链表。\n\n## 复杂度分析\n\
  \n链地址法的性能取决于键的分布和负载因子 `λ`，`λ` 定义为 `n/m`，其中 `n` 是条目的数量，`m` 是槽位的数量。\n\n*   **最好情况**：如果键分布均匀且负载因子较低，插入、删除和搜索等操作可以在\
  \ `O(1)` 时间内完成。\n*   **平均情况**：通常情况下，假设链表的平均长度保持较短，这些操作仍然可以在 `O(1)` 时间内完成。\n*   **最坏情况**：在最坏的情况下，即所有键都哈希到同一个索引，性能将退化为\
  \ `O(n)`，因为每个索引都包含一个拥有所有条目的单链表。\n\n## 优点与缺点\n\n理解链地址法的优缺点对于它的有效应用至关重要。\n\n*   **优点**：\n\
  \    *   实现和修改简单。\n    *   当负载因子维持在适当水平时非常高效。\n    *   可以优雅地处理大量数量元素，因为链表是可以动态增长的。\n\
  \    *   与开放寻址法相比，对聚集问题较不敏感。\n*   **缺点**：\n    *   需要额外的内存来存储链表中的指针。\n    *   如果有许多键哈希到同一个索引，性能会显著下降。\n\
  \    *   管理链表操作存在开销，例如动态内存分配和指针操作。\n\n链地址法为哈希表的冲突解决提供了一种灵活且直接的解决方案，特别是当条目均匀分布且负载因子得到适当控制时。理解这些特性允许优化哈希表性能以适应特定的应用需求。\n\
  \n### 9.4 冲突解决技术：开放寻址法\n\n开放寻址法是一种冲突解决技术，所有元素都直接存储在哈希表中，而不使用链表等辅助数据结构。当发生冲突时，算法根据定义的探测序列在哈希表内搜索下一个可用槽位。如果初始哈希位置\
  \ `h(k)` 被占用，则使用探测序列计算并检查替代位置，直到找到空槽位。\n\n让我们用 `T` 表示哈希表，并假设其大小为 `m`。键 `k` 初始哈希到索引\
  \ `h(k)`。如果发生冲突，将使用探测序列计算并检查替代位置，直到找到空槽位。\n\n让我们用 `T` 表示哈希表，并假设其大小为 `m`。键 `k` 初始哈希到索引\
  \ `h(k)`。如果发生冲突，将使用探测序列计算并检查替代位置，直到找到空槽位。\n\n线性探测按顺序检查下一个槽直到找到空槽位。如果哈函数 `h(k)` 将\
  \ `k` 映射到索引 `i`，且 `i` 被占用。\n\n```java\npublic class HashTable {\n    private static\
  \ final int TABLE_SIZE = 10;\n    private Integer[] table;\n\n    public HashTable()\
  \ {\n        table = new Integer[TABLE_SIZE];\n    }\n\n    public void insert(int\
  \ key) {\n        int hash = key % TABLE_SIZE;\n        int originalHash = hash;\n\
  \        while (table[hash] != null) {\n            hash = (hash + 1) % TABLE_SIZE;\n\
  \            if (hash == originalHash) {\n                throw new RuntimeException(\"\
  Hash table is full\");\n            }\n        }\n        table[hash] = key;\n \
  \   }\n\n    public Integer search(int key) {\n        int hash = key % TABLE_SIZE;\n\
  \        int originalHash = hash;\n        while (table[hash] != null) {\n     \
  \       if (table[hash].equals(key)) {\n                return hash;\n         \
  \   }\n            hash = (hash + 1) % TABLE_SIZE;\n            if (hash == originalHash)\
  \ {\n                return null;\n            }\n        }\n        return null;\n\
  \    }\n\n    public void delete(int key) {\n        int hash = key % TABLE_SIZE;\n\
  \        int originalHash = hash;\n        while (table[hash] != null) {\n     \
  \       if (table[hash].equals(key)) {\n                table[hash] = null;\n  \
  \              return;\n            }\n            hash = (hash + 1) % TABLE_SIZE;\n\
  \            if (hash == originalHash) {\n                return;\n            }\n\
  \        }\n    }\n}\n```\n\n二次探测通过使用二次函数检查位置来解决冲突。如果索引 `i` 处发生冲突，下一个检查的位置将是 `(i\
  \ + 1²) % m`，然后是 `(i + 2²) % m`，以此此类推。这与线性探测相比减少了聚集现象，但需要仔细的处理以确保所有可能的槽位都能被检查。\n\
  \n一个 Java 实现二次探测的示例：\n\n```java\npublic void insertWithQuadraticProbing(int key)\
  \ {\n    int hash = key % TABLE_SIZE;\n    int step = 1;\n    int originalHash =\
  \ hash;\n    while (table[hash] != null) {\n        // ... logic here\n    }\n}\n\
  ```\n\n\n\n\n\n```java\nhash = (originalHash + step * step) % TABLE_SIZE;\n\nstep++;\n\
  \nif (step == TABLE_SIZE) {\n    throw new RuntimeException(\"Hash table is full\"\
  );\n}\n\n}\n\ntable[hash] = key;\n}\n\npublic Integer searchWithQuadraticProbing(int\
  \ key) {\n    int hash = key % TABLE_SIZE;\n    int step = 1;\n    int originalHash\
  \ = hash;\n    while (table[hash] != null) {\n        if (table[hash].equals(key))\
  \ {\n            return hash;\n        }\n        hash = (originalHash + step *\
  \ step) % TABLE_SIZE;\n        step++;\n        if (step == TABLE_SIZE) {\n    \
  \        return null;\n        }\n    }\n    return null;\n}\n\npublic void deleteWithQuadraticProbing(int\
  \ key) {\n    int hash = key % TABLE_SIZE;\n    int step = 1;\n    int originalHash\
  \ = hash;\n    while (table[hash] != null) {\n        if (table[hash].equals(key))\
  \ {\n            table[hash] = null;\n            return;\n        }\n        hash\
  \ = (originalHash + step * step) % TABLE_SIZE;\n        step++;\n        if (step\
  \ == TABLE_SIZE) {\n            return;\n        }\n    }\n}\n```\n\n#### 双哈希 (Double\
  \ Hashing)\n\n双哈希使用第二个哈希函数来确定探测序列。第一个哈希函数决定初始探测位置，而第二个哈希函数则决定后续探测的步长。假设 `h1(k)`\
  \ 是主哈希函数，`h2(k)` 是次哈希函数，其结果永远不应为零，以确保能够在表中进行移动。探测序列由 `h1(k)`、`(h1(k) + h2(k)) %\
  \ m`、`(h1(k) + 2*h2(k)) % m` 等给出。\n\n以下是双哈希在 Java 中的实现：\n\n```java\npublic void\
  \ insertWithDoubleHashing(int key) {\n    int hash1 = key % TABLE_SIZE;\n    int\
  \ hash2 = 1 + (key % (TABLE_SIZE - 1));\n    int originalHash = hash1;\n    int\
  \ step = 0;\n    while (table[hash1] != null) {\n        hash1 = (originalHash +\
  \ step * hash2) % TABLE_SIZE;\n        step++;\n        if (step == TABLE_SIZE)\
  \ {\n            throw new RuntimeException(\"Hash table is full\");\n        }\n\
  \    }\n    table[hash1] = key;\n}\n\npublic Integer searchWithDoubleHashing(int\
  \ key) {\n    int hash1 = key % TABLE_SIZE;\n    int hash2 = 1 + (key % (TABLE_SIZE\
  \ - 1));\n    int originalHash = hash1;\n    int step = 0;\n    while (table[hash1]\
  \ != null) {\n        if (table[hash1].equals(key)) {\n            return hash1;\n\
  \        }\n        hash1 = (originalHash + step * hash2) % TABLE_SIZE;\n      \
  \  step++;\n        if (step == TABLE_SIZE) {\n            return null;\n      \
  \  }\n    }\n    return null;\n}\n\npublic void deleteWithDoubleHashing(int key)\
  \ {\n    int hash1 = key % TABLE_SIZE;\n    int hash2 = 1 + (key % (TABLE_SIZE -\
  \ 1));\n    int originalHash = hash1;\n    int step = 0;\n    while (table[hash1]\
  \ != null) {\n        if (table[hash1].equals(key)) {\n            table[hash1]\
  \ = null;\n            return;\n        }\n        hash1 = (originalHash + step\
  \ * hash2) % TABLE_SIZE;\n        step++;\n        if (step == TABLE_SIZE) {\n \
  \           return;\n        }\n    }\n}\n```\n\n需要注意的是，开放寻址要求哈希表的负载因子远低于 1（通常在\
  \ 0.5 到 0.7 之间），以维持冲突解决的效率。\n\n### 9.5 线性探测 (Linear Probing)\n\n线性探测是一种用于解决哈希表冲突的开放寻址法。当两个键哈希到同一个索引时，线性探测会在表中寻找下一个可用空位。该技术在空间和速度方面都是高效的，在实现适当的情况下，可以快速检索元素。\n\
  \n要实现线性探测，考虑一个大小为 `m` 的哈希表和一个将键 `k` 映射到哈希表索引的哈希函数 `h(k)`。当索引 `i = h(k)` 发生冲突时，算法会探测后续索引\
  \ `(i + 1)%m`、`(i + 2)%m`、……`(i + j)%m` 直到找到空位。\n\n**输入：** 插入的 `key`、与键关联的 `value`、大小为\
  \ `m` 的 `hashTable` 数组\n**输出：** 插入了新键值对的更新后的 `hashTable`\n**函数** `InsertLinearProbing(key,\
  \ value, hashTable, m)`\n**：** `index ← hashFunction(key) % m`\n**while** `hashTable[index]`\
  \ 不为空\n**do** `index ← (index + 1) % m`，`hashTable[index] ← (key, value)`\n\n\n\n\
  \n为了确保哈表的所有槽位最终都能被探测，`h2(k)` 永远不能为零，且与哈表大小 `m` 互质，这是至关重要的。\n\n```java\npublic class\
  \ DoubleHashingHashTable { \n\n    private static final int DEFAULT_TABLE_SIZE =\
  \ 11; \n\n    private static final double LOAD_FACTOR_THRESHOLD = 0.75; \n\n   \
  \ private HashEntry[] hashTable; \n\n    private int currentSize; \n\n    public\
  \ DoubleHashingHashTable() { \n      hashTable = new HashEntry[DEFAULT_TABLE_SIZE];\
  \ \n      currentSize = 0; \n    } \n\n    private static class HashEntry { \n \
  \       public int key; \n        public String value; \n        public boolean\
  \ isActive; \n\n        public HashEntry(int key, String value) { \n          this.key\
  \ = key; \n          this.value = value; \n          this.isActive = true; \n  \
  \      } \n    } \n\n    public boolean insert(int key, String value) { \n     \
  \ if (currentSize > LOAD_FACTOR_THRESHOLD * hashTable.length) { \n        rehash();\
  \ \n      } \n      int initialIndex = primaryHash(key); \n      int stepSize =\
  \ secondaryHash(key); \n      int index = initialIndex; \n      while (hashTable[index]\
  \ != null && hashTable[index].isActive) { \n          index = (initialIndex + stepSize)\
  \ % hashTable.length; \n          stepSize += secondaryHash(key); \n      } \n \
  \     hashTable[index] = new HashEntry(key, value); \n      currentSize++; \n  \
  \    return true; \n    } \n\n    public boolean remove(int key) { \n      int index\
  \ = findPos(key); \n      if (index != -1 && hashTable[index] != null && hashTable[index].isActive)\
  \ { \n          hashTable[index].isActive = false; \n          currentSize--; \n\
  \          return true; \n      } \n      return false; \n    } \n\n    public String\
  \ find(int key) { \n      int index = findPos(key); \n      if (index != -1 && hashTable[index]\
  \ != null && hashTable[index].isActive) { \n          return hashTable[index].value;\
  \ \n      } \n      return null;\n    } \n\n    private int findPos(int key) { \n\
  \      int initialIndex = primaryHash(key); \n      int stepSize = secondaryHash(key);\
  \ \n      int index = initialIndex; \n      while (hashTable[index] != null && (hashTable[index].key\
  \ != key || !hashTable[index].isActive)) { \n          index = (initialIndex + stepSize)\
  \ % hashTable.length; \n          stepSize += secondaryHash(key); \n      } \n \
  \     return (hashTable[index] != null && hashTable[index].isActive) ? index : -1;\n\
  \    } \n\n    private int primaryHash(int key) { \n      return key % hashTable.length;\
  \ \n    } \n\n    private int secondaryHash(int key) { \n      return 7 - (key %\
  \ 7); \n    } \n\n    private void rehash() { \n      HashEntry[] oldHashTable =\
  \ hashTable; \n      hashTable = new HashEntry[2 * oldHashTable.length]; \n    \
  \  currentSize = 0; \n      for (HashEntry entry : oldHashTable) { \n          if\
  \ (entry != null && entry.isActive) { \n            insert(entry.key, entry.value);\
  \ \n          } \n      }\n    }\n}\n```\n\n主哈希函数 `primaryHash(k)` 计算索引 `k % m`，其中\
  \ `m` 是表的大小。二次哈希函数 `secondaryHash(k)` 被选择为小于表大小的质数，以确保它不为零且与 `m` 互质。在我们的示例中，使用了\
  \ `7 - (k % 7)`。\n\n为了阐明双重哈希的操作过程，考虑向哈希表插入一个键值对 `(k, v)`。首先，主哈希函数 `primaryHash(k)`\
  \ 计算出初始索引。如果对应的槽位被占用，算法将使用二次哈希函数 `secondaryHash(k)` 乘以探测尝试次数 `i` 来探测下一个槽位。这个过程不断重复，直到找到空槽位为止。\n\
  \n```\nExample Execution Output: \nInsert (10, \"A\") \nInsert (22, \"B\") \nInsert\
  \ (31, \"C\") \nFind Key 22: \"B\" \nRemove Key 31 \nFind Key 31: null\n```\n\n\
  双重哈希通过利用两个独立的哈希函数提供了高效的性能并最大限度地减少了聚集。尽管具有这些优势，但由于需要管理两个哈希函数并确保它们与表大小的互质，其实现复杂度高于线性探测或二次探测。采用双重哈希在需要最少冲突和哈希表内键的\
  \ 最优分布的场景中会产生益处。\n\n理解双重哈希对于实现高效的哈希表至关重要，并且与其他冲突解决技术形成互补。这种全面的知识为开发者和计算机科学家提供了优化数据检索系统的丰富工具。\n\
  \n### 9.7 重哈希 (Rehashing)\n\n重哈希是维护哈表在规模增长时保持效率的一项重要技术。当哈表的负载因子过高时，由于冲突的增加以及相关冲突解决成本的提高，性能可能会显著下降。重哈希通过创建一个更大的哈表并将现有元素重新分布到新表中，为这个问题提供了解决方案。\n\
  \n#### 算法：重哈希\n\n**输入：** 哈表 `T`\n**输出：** 重哈希后的哈表 `T'`\n\n**if** `α ≥ α[max]` **then**\n\
  \  创建一个大小为 `2 * m` 的新哈表 `T'`；双倍表的大小\n  **foreach** 表 `T` 中的元素 `e` **do**\n    `k'\
  \ ← hash(e) mod m'`\n    将 `e` 插入 `T'`\n\n#### 重哈希步骤\n\n- **分配新哈表**：创建一个原表两倍数量的新表\
  \ `T'`。\n- **重新计算哈希值**：对表 `T` 中的每个元素使用新的表进行重新哈希。\n- **将元素插入新表**：将重哈希的元素插入 `T'` 中。\n\
  \n#### 重哈希示例\n\n考虑一个具有 5 个槽位的哈表 `T` 以及以下元素和对应值：\n\n元素：`[12, 24, 36, 48, 60]`\n哈希值：`[2,\
  \ 4, 1, 3, 0]`\n\n表初始状态如下：\n|---|---|---|---|---|\n| 12 | 24 | 36 | 48 | 60 |\n\
  （注：值仅为演示）\n\n如果负载因子阈值 `α[max]` 为 0.75 且我们插入另一个元素，负载因子将超过阈值，需要重哈希。我们创建一个具有 10 个槽位的新表\
  \ `T'` 并重哈希元素：\n\n新哈希值：`[2, 4, 6, 8, 0]`（使用新表大小 10）\n\n新表 `T'` 随后所示：\n|---|---|---|---|---|---|---|---|---|\n\
  | 60 | | 12 | | 24 | | 36 | | 48 | |\n\n#### 性能考虑\n\n重哈希在时间复杂度上是一项昂贵的操作，因为它涉及到将每个元素重新插入新表。重哈希\
  \ `n` 个元素的时间复杂度为 O(n)。然而，这种代价被分摊到多次插入中，使得平均插入时间仍为 O(1)。\n\n现代实现通常会在自上一次重哈希执行了大量操作后才延迟重哈希，以优化整体性能。某些实现还使用增量重哈希，将成本分散到多次插入中，从而避免单次的大成本峰值。\n\
  \n\n\n\n妥善管理重新哈希（rehashing）过程可以确保哈表在存储元素数量增加时仍保持高效性能，从而有效平衡空间的时间复杂度。\n\n### 9.8\
  \ 哈希表操作：插入、删除、查找\n\n哈希表是基础数据结构，有助于快速的数据查找、插入和删除操作。理解这些操作的效率和实现细节对于有效利用哈表至关重要。本节将深入探讨哈表中的插入、删除和查找操作，演示它们的执行过程及其底层机制。\n\
  \n#### 插入操作\n\n向哈希表中插入元素涉及计算键（key）的哈希值，并将键值对放置在计算索引处。插入操作的效率取决于哈希函数将键均匀分布在整个表的能力。当发生冲突时，将采用冲突解决技术，如链法（separate\
  \ chaining）或开放寻址（open addressing）。\n\n以下伪代码说明了使用链法和开放寻址（线性探测）解决冲突的插入过程：\n\n```\n\
  Algorithm 37: 使用链法在哈希表中进行插入\nInput: hashTable, key, value\nOutput: 更新后的 hashTable\n\
  hashIndex ← hash(key);\nif hashTable[hashIndex] is empty\nthen hashTable[hashIndex]\
  \ ← {key,value};\nelse hashTable[hashIndex].append({key, value});\n```\n\n```\n\
  Algorithm 38: 使用线性探测在哈希表中进行插入\nInput: hashTable, key, value\nOutput: 更新后的 hashTable\n\
  hashIndex ← hash(key);\nwhile hashTable[hashIndex] is not empty\ndo hashIndex ←\
  \ (hashIndex + 1) mod tableSize;\nhashTable[hashIndex] ← {key,value};\n```\n\n####\
  \ 删除操作\n\n从哈希表中删除元素涉及使用其键查找该元素，一旦找到即移除该键值对。在开放寻址中，将位置标记为“已删除”而非为空，对于正确处理后续的插入和查找至关重要。\n\
  \n以下伪代码演示了链法和线性探测的删除过程：\n\n```\nAlgorithm 39: 使用链法从哈希表中删除\nInput: hashTable, key\n\
  Output: 更新后的 hashTable\nhashIndex ← hash(key);\nif hashTable[hashIndex] is not empty\n\
  then\n    for each pair in hashTable[hashIndex]\n    do\n        if pair.key = key\n\
  \        then hashTable[hashIndex].remove(pair);\n    return;\n```\n\n```\nAlgorithm\
  \ 40: 使用线性探测从哈希表中删除\nInput: hashTable, key\nOutput: 更新后的 hashTable\nhashIndex ←\
  \ hash(key);\nwhile hashTable[hashIndex] is not empty\ndo\n    if hashTable[hashIndex].key\
  \ = key\n    then hashTable[hashIndex] ← deleted;\n    return;\nhashIndex ← (hashIndex\
  \ + 1) mod tableSize;\n```\n\n#### 查找操作\n\n在哈希表中查找元素用于确定特定的键是否存在，如果存在则检索对应的值。查找操作根据为给定键计算的哈希值来遍历表。链法和线性探测在查找过程中都能处理潜在的冲突。\n\
  \n以下是使用链法和线性探测执行查找操作的伪代码示例：\n\n```\nAlgorithm 41: 使用链法在哈希表中查找\nInput: hashTable,\
  \ key\nOutput: value or Not Found\nhashIndex ← hash(key);\nif hashTable[hashIndex]\
  \ is not empty\nthen\n    for each pair in hashTable[hashIndex]\n    do\n      \
  \  if pair.key = key\n        then return pair.value;\nreturn Not Found;\n```\n\n\
  ```\nAlgorithm 42: 使用线性探测在哈希表中查找\nInput: hashTable, key\nOutput: value or Not Found\n\
  hashIndex ← hash(key);\nwhile hashTable[hashIndex] is not empty\ndo\n    if hashTable[hashIndex].key\
  \ = key\n    then return hashTable[hashIndex].value;\nhashIndex ← (hashIndex + 1)\
  \ mod tableSize;\nreturn Not Found;\n```\n\n这些操作构成了哈表内数据处理和交互的核心。每种操作的性能主要取决于哈希函数的质量和所实现的冲突解决策略。采用高效的哈希函数和适当的冲突解决技术可以确保哈表操作保持\
  \ O(1) 的平均时间复杂度，从而促进快速的数据存储和检索。\n\n### 9.9 哈希表的应用\n\n哈希表是多功能的数据结构，能够在常数平均复杂度内提供高效的数据检索，使其适用于许多现实世界的应用。它们的用途跨越多个领域，包括数据库、编译器、网络服务等。本节将深入探讨哈表的一些著名应用，阐明它们在当代计算中的关键作用。\n\
  \n#### 编译器中的符号表\n\n编译器在编译过程中广泛使用符号表来管理标识符（如变量名、函数名等）的信息。在解析和编译源代码时，必须高效地检索和更新这些标识符，而哈表为这些操作提供了理想机制。符号表存储如标识符的作用域、数据类型和内存位置等信息。\n\
  \n考虑编译器必须跟踪变量声明和使用的场景：\n\n```java\nimport java.util.Hashtable;\nclass SymbolTable\
  \ {\n    Hashtable<String, Symbol> table;\n    SymbolTable() {\n        table =\
  \ new Hashtable<>();\n    }\n    void addSymbol(String identifier, Symbol symbol)\
  \ {\n        table.put(identifier, symbol);\n    }\n    Symbol getSymbol(String\
  \ identifier) {\n        return table.get(identifier);\n    }\n}\n```\n\n#### 数据库索引\n\
  \n哈希表经常用于数据库索引，以提高检索操作的速度。索引可以被看是一个将列（或一组列）的值映射到数据库中对应行的表。当哈希表被用索引时，它可以提供对数据的快速访问。\n\
  \n```java\nimport java.util.Hashtable;\nclass DatabaseIndex {\n    Hashtable<String,\
  \ Row> index;\n    DatabaseIndex() {\n        index = new Hashtable<>();\n    }\n\
  \    void addToIndex(String key, Row row) {\n        index.put(key, row);\n    }\n\
  \    Row getIndex(String key) {\n        return index.get(key);\n    }\n}\n```\n\
  \n#### 缓存\n\n缓存是一种存储计算结果或频繁访问数据的技术，以减少未来操作检索这些数据的时间。哈表由于其插入和查找操作的常数平均时间复杂度，是实现缓存的高效结构。常见的实现包括\
  \ LRU（最久未使用）和 LFU（最经常使用）缓存。\n\n```java\nimport java.util.Hashtable;\nclass CacheEntry\
  \ {\n    String key;\n    Object value;\n    CacheEntry next;\n    CacheEntry prev;\n\
  }\nclass LRUCache {\n    final int capacity;\n    Hashtable<String, CacheEntry>\
  \ cache;\n    CacheEntry head;\n    CacheEntry tail;\n    LRUCache(int capacity)\
  \ {\n        this.capacity = capacity;\n        this.cache = new Hashtable<>(capacity);\n\
  \    }\n    void put(String key, Object value) {\n        if (cache.containsKey(key))\
  \ {\n            CacheEntry entry = cache.get(key);\n            remove(entry);\n\
  \        } else if (cache.size() >= capacity) {\n            cache.remove(tail.key);\n\
  \        }\n```\n\n\n\n\n```java\n        remove(tail); \n\n      } \n      CacheEntry\
  \ newEntry = new CacheEntry(); \n\n      newEntry.key = key; \n\n      newEntry.value\
  \ = value; \n      addToHead(newEntry); \n\n      cache.put(key, newEntry); \n \
  \   } \n\n    public Object get(String key) { \n      if (cache.containsKey(key))\
  \ { \n          CacheEntry entry = cache.get(key); \n          remove(entry); \n\
  \          addToHead(entry); \n          return entry.value; \n      } \n      return\
  \ null; \n    } \n\n    private void remove(CacheEntry entry) { \n      if (entry.prev\
  \ != null) { \n          entry.prev.next = entry.next; \n      } else { \n     \
  \     head = entry.next; \n      } \n      if (entry.next != null) { \n        \
  \  entry.next.prev = entry.prev; \n      } else { \n          tail = entry.prev;\
  \ \n      } \n    } \n\n    private void addToHead(CacheEntry entry) { \n      entry.next\
  \ = head; \n      entry.prev = null; \n      if (head != null) { \n          head.prev\
  \ = entry; \n      } \n      head = entry; \n      if (tail == null) { \n      \
  \    tail = entry; \n      } \n    } \n}\n```\n\n# 实现关联数组\n\n关联数组，也称为映射（maps）或字典（diction），是键值对的集合，用于各种编程语言中根据键进行快速数据查找。哈希表是关联数组的核心，利用了高效的键值映射。\n\
  \n```java\nimport java.util.Hashtable; \n\npublic class AssociativeArray { \n  \
  \  private Hashtable<String, Object> hashMap; \n\n    public AssociativeArray()\
  \ { \n      hashMap = new Hashtable<>(); \n    } \n\n    public void put(String\
  \ key, Object value) { \n      hashMap.put(key, value); \n    } \n\n    public Object\
  \ get(String key) { \n      return hashMap.get(key); \n    } \n\n    public boolean\
  \ containsKey(String key) { \n      return hashMap.containsKey(key); \n    } \n\
  }\n```\n\n# 路由与负载均衡\n\n在网络路由和负载均衡中，哈希表可以将请求引导到适当的服务器或快速路由。它们有助于维护有关活动连接的状态信息，并根据代表客户端请求的哈希键分配请求。\n\
  \n```java\nimport java.util.Hashtable; \n\npublic class LoadBalancer { \n    private\
  \ Hashtable<String, Server> routingTable; \n\n    public LoadBalancer() { \n   \
  \   routingTable = new Hashtable<>(); \n    } \n\n    public void addServer(String\
  \ clientKey, Server server) { \n      routingTable.put(clientKey, server); \n  \
  \  }\n    public Server getServer(String clientKey) { \n      return routingTable.get(clientKey);\
  \ \n    } \n}\n```\n\n每个应用程序都体现了哈希表通过快速插入、删除和访问操作管理数据的多功能性和效率。它们对不同需求的适应性强调了它们在现代计算中不可或缺的作用。\n\
  \n## 9.10 哈希的优缺点\n\n哈希作为一种技术，具有许多优点和缺点，在选择其作为数据检索方法时必须仔细考虑。本节将探讨这些方面，以提供对哈希在实际应用中影响的平衡理解。\n\
  \n哈希的一个主要优点是其在搜索操作中的效率。在假设良好的哈希函数和低负载因子的情况下，哈希表在平均情况下的插入、删除和查找中具有常数时间复杂度 `O(1)`。这与其他数据结构（如二叉树，其时间复杂度为\
  \ `O(log n)`）相比要高效得多。下面的代码段演示了在哈希表中执行插入操作的平均 `O(1)` 复杂度：\n\n```java\nvoid insert(String\
  \ key, Integer value) { \n  int hashValue = hashFunction(key); \n  table[hashValue]\
  \ = value; \n}\n```\n\n哈希的主要缺点源于冲突。尽管良好的哈希函数可以尽力减少冲突的发生，但无法完全消除。冲突处理策略（如链链法和开放寻址法）可以缓解这个问题，但它们可能会引入额外的性和性能开销。考虑以下在\
  \ Java 中实现的链链法示例：\n\n```java\nclass HashTable { \n    private LinkedList<Entry>[]\
  \ buckets; \n    void insert(String key, Integer value) { \n      int bucketIndex\
  \ = hashFunction(key); \n      LinkedList<Entry> bucket = buckets[bucketIndex];\
  \ \n      for (Entry entry : bucket) { \n          if (entry.key.equals(key)) {\
  \ \n            entry.value = value; \n            return; \n          } \n    \
  \  } \n      bucket.add(new Entry(key, value)); \n    } \n}\n```\n\n在这种情况下，虽然插入仍然保持相对高效，但如果链的长度增加，处理冲突的链表的存在可能会降低性能。这种问题在高负载因子情况下尤为严重，因为此时此类链会变长，导致操作变慢，并在最坏情况下可能退化为线性时间复杂度\
  \ `O(n)`。\n\n哈希表也易于实现和使用，只需要相对直接的编码和极少的代码行即可获得显著的性能收益，如上述 `insert` 方法所示。这种简单性可以使哈希表成为许多应用程序中吸引人的选择，例如编译器中的符号表、缓存机制和数据库。\n\
  \n然而，在内存使用的背景下，哈希表面临着额外的缺点。通常，哈希表需要预分配一个比预期存储的元素数量更大的数组，以保持效率并避免高负载因子。这种过度分配会导致内存浪费。考虑以下哈希表中底层数组的示意图：\n\
  \n```\n[--][key1:val1][--][key2:val2][--][key3:val3]\n```\n\n键之间的间隙说明了为了保持低冲突率而必要的“浪费”插槽。此外，动态调整大小和重哈希（对于维护效率是必要的）可能是耗耗时且资源密集型的操作。调整大小通常涉及重新分配较大尺寸数组并重新插入所有键，如下方法所示：\n\
  \n```java\nvoid resize() { \n  LinkedList<Entry>[] newBuckets = new LinkedList[buckets.length\
  \ * 2]; \n  for (LinkedList<Entry> bucket : buckets) { \n    for (Entry entry :\
  \ bucket) { \n        int newBucketIndex = hashFunction(entry.key) % newBuckets.length;\
  \ \n        newBuckets[newBucketIndex].add(entry); \n    } \n  } \n  buckets = newBuckets;\
  \ \n}\n```\n\n实现最优哈希函数的复杂性是一个重要的考虑因素。有效的哈希函数需要具有一致性、均匀地分布键并最小化冲突的概率。设计这样的函数并非易事，需要在简单性和随机性之间取得良好平衡，同时避免聚集（即多个键哈希到同一个槽的现象）。\n\
  \n此外，哈希表对于需要有序数据的操作效率很低。与平衡二叉搜索树或链表不同，哈希表不维护元素的任何意义顺序。这种固有的顺序缺失使得如查找最小或最大键、以排序方式遍历元素等操作在没有额外数据结构的情况下效率较低或无法实行的，如下所示：\n\
  \n```java\nList<KeyValue> getSortedKeyValuePairs() { \n  List<KeyValue> list = new\
  \ ArrayList<>(); \n  for (LinkedList<Entry> bucket : buckets) { \n    for (Entry\
  \ entry : bucket) { \n        list.add(entry); \n    } \n  } \n  list.sort(Comparator.comparing(Entry::getKey));\
  \ \n  return list; \n}\n```\n\n\n\n\n哈希表也存在安全方面的考虑。设计不当的哈希函数容易受到碰撞攻击，攻击者系统地创建哈希到同一个桶（bucket）的键，导致性能下降。这类攻击会大幅降低哈希表的效率，正如拒绝服务（DoS）漏洞所示。安全的哈希函数（如加密哈希函数）可以缓解这些风险，但通常会带来更高的计算开销。\n\
  \n哈希的优点包括在插入、删除和查找方面具有高效的平均情况性能、实现简单以及在各个领域具有广泛适用性。缺点包括潜在的碰撞风险、过度分配导致的内存开销、在有序数据操作中的效率低下的、设计最优哈希函数的复杂性，以及实现不当的哈希函数存在的安全漏洞。理解这些因素对于在不同场景下有效利用哈希至关重要。\n\
  \n# 第 10 章：图与图算法\n\n本章介绍了图和基本的图算法，这是解决复杂计算问题的基础。内容涵盖了图的术语和表示方法，包括邻接矩阵和邻接列表。解释了关键的图遍历算法，如深度优先搜索（DFS）和广度优先搜索（BFS）。本章进一步探索了寻找最短路径的算法（如\
  \ Dijkstra 和 Bellman-Ford 算法），以及构建最小生成树的算法（如 Prim 和 Kruskal 算法）。其他主题还包括拓扑排序、图染色以及图算法的实际应用。\n\
  \n## 10.1 图引论\n\n图是计算机科学和离散数学中的一种关键表示方法，用于对对象两两关系建模。形式上，一个图 `G` 由一个顶点集合 `V` 和一个连接顶点对的边集合\
  \ `E` 组成。这意味着图 `G` 可以表示为 `G(V,E)`，其中 `V = {v[1],v[2],…,v[n]}` 是顶点集合，而 `E ⊆ V × V`\
  \ 是边集合，每条边都定义为一个顶点对。\n\n### 图的类型\n\n图可以根据其特征分为以下几类：\n\n*   **无向图：** 在无向图中，边没有方向。因此，如果\
  \ `v[i]` 和 `v[j]` 之间存在一条边，则可以容易地从 `v[i]` 遍历到 `v[j]`，也可以从 `v[j]` 遍历到 `v[i]`。\n* \
  \  **有向图（Digraph）：** 在有向图中，边具有与之关联的方向，表示为有序对。因此，从 `v[i]` 到 `v[j]` 的边不等同于从 `v[j]`\
  \ 到 `v[i]` 的边。\n*   **加权图：** 加权图是指每条边都有一个关联的数值（权重）的图。根据问题背景，这些权重可以代表成本、距离或其他数量。\n\
  *   **无权图：** 这些是边没有权重的图，每条边仅代表顶点之间的连接。\n\n### 图的表示\n\n为了在计算任务中高效地处理图，在内存中适当表示图至关重要。图的两种主要表示方法是：\n\
  \n**邻接矩阵：** 这是一个大小为 `V × V` 的二维数组，如果顶点 `v[i]` 和 `v[j]` 之间存在边，则单元格 `adj[i][j]` 设置为\
  \ 1（如果是加权图，则设置为权重）。否则，设置为 0。\n\n```java\nint[][] adjMatrix = new int[V][V];\n\n\
  // Initializing the adjacency matrix\nfor(int i = 0; i < V; i++) {\n    for(int\
  \ j = 0; j < V; j++) {\n        adjMatrix[i][j] = 0;\n    }\n}\n// Adding edges\n\
  adjMatrix[0][1] = 1;\nadjMatrix[1][2] = 1;\n// ... Add all necessary edges\n```\n\
  \n**优点：**\n*   简单且易于实现。\n*   对于稠密图非常高效。\n\n**缺点：**\n*   无论边数多少，都需要 `O(V²)` 的空间。\n\
  *   对于稀疏图效率低效。\n\n**邻接列表：** 它由一个列表数组组成。数组的大小为 `V`。数组的每个元素 `adj[i]` 都是一个列表，包含了所有与顶点\
  \ `v[i]` 连接的顶点。\n\n```java\nclass Graph {\n    private int V;\n    private LinkedList<Integer>\
  \ adjListArray[];\n\n    Graph(int V) {\n        this.V = V;\n        adjListArray\
  \ = new LinkedList[V];\n        // Initialize adjacency list for each vertex\n \
  \       for (int i = 0; i < V; i++) {\n            adjListArray[i] = new LinkedList<>();\n\
  \        }\n    }\n}\n```\n\n\n\n\n**路径 (Path):** 图中的路径是连接一系列顶点的边序列。路径通常表示为 `v[1],v[2],...,v[k]`，其中每对\
  \ `(v[i],v[i+1])` 都是图中的一条边。\n\n**环 (Cycle):** 环是指起始和结束于同一个顶点且包含至少一条边的路径。在环中，除了起始和终点顶点外，所有顶点都是互不相同的。\n\
  \n**连通图 (Connected Graph):** 如果任意两个顶点之间存在路径，则该无向图是连通的。换句话说，每个顶点都可以从其他任何顶点到达。\n\n\
  **强连通图 (Strongly Connected Graph):** 如果任意顶点到每个其他顶点都存在直向路径，则该有向图是强连通的。\n\n**度 (Degree):**\
  \ 顶点的度是与其相邻的边数。在有向图中，我们区分入度（入边数）和出度（出边数）。\n\n**子图 (Subgraph):** 子图是图顶点和边的子集。对于图\
  \ `G`，如果 `G′` 中的所有边都在 `G` 中，且 `G′` 中的所有顶点都由这些边连接，则 `G′` 是一个子图。\n\n**同构图 (Isomorphic\
  \ Graphs):** 如果两个图 `G` 和 `H` 之间的顶点集和边集之间存在一一对应关系，且保持了关联关系，则这两个图是同构的。\n\n**完全图 (Complete\
  \ Graph (Clique)):** 完全图中每对不同顶点之间都有一条唯一的边。具有 `n` 个顶点的完全图表示为 `K[n]`。\n\n**无环图 (Acyclic\
  \ Graph):** 不包含环的图。如果一个图既是无环的又有向的，则它被称为有向无环图 (`DAG`)。\n\n**二分图 (Bipartite Graph):**\
  \ 二分图是一种顶点可以分为两个不相交且独立的集合 `U` 和 `V` 的图，其中每条边都连接 `U` 中的一个顶点和 `V` 中的一个顶点。\n\n**平面图\
  \ (Planar Graph):** 如果一个图可以在平面上绘制且没有任何边相互交叉，则该图是平面图。\n\n**多重图 (Multigraph):** 多重图允许具有多条边（也称为平行边）的图，即具有相同端点的边。\n\
  \n这些术语为理解更高级的图算法及其应用奠定了基础。在计算机科学中，掌握这些定义对于有效描述、分析和实现图相关的解决方案至关重要。\n\n### 10.3 图的表示：邻接矩阵与邻接表\n\
  \n图 `G` 定义为顶点集合 `V` 和连接这些顶点的边集合 `E`。图的表示对于高效地实现图算法至关重要。两种常见的表示方法是邻接矩阵和邻接表。\n\n####\
  \ 邻接矩阵 (Adjacency Matrix)\n\n邻接矩阵是一个大小为 `|V |×|V |` 的二维数组 `Adj`，其中 `|V |` 是图中顶点的数量。在矩阵矩阵中，如果顶点\
  \ `i` 和顶点 `j` 之间存在边，则元素 `Adj[i][j]` 为非零，否则为零。\n\n```java\npublic class Graph { \n\
  \  private int[][] adjacencyMatrix; \n   private int numberOfVertices; \n    public\
  \ Graph(int numberOfVertices) { \n      this.numberOfVertices = numberOfVertices;\
  \ \n      adjacencyMatrix = new int[numberOfVertices][numberOfVertices]; \n    }\
  \ \n    public void addEdge(int i, int j) { \n      adjacencyMatrix[i][j] = 1; \n\
  \    } \n    public void removeEdge(int i, int j) { \n      adjacencyMatrix[i][j]\
  \ = 0; \n    } \n    public boolean isEdge(int i, int j) { \n      return adjacencyMatrix[i][j]\
  \ != 0; \n    } \n    public void printGraph() { \n      for (int i = 0; i < numberOfVertices;\
  \ i++) { \n        for (int j = 0; j < numberOfVertices; j++) { \n          System.out.print(adjacencyMatrix[i][j]\
  \ + \" \"); \n        } \n          System.out.println(); \n      } \n    }\n}\n\
  ```\n\n邻接矩阵表示法直观，并允许以 `O(1)` 时间复杂度检查两个顶点之间是否存在边。然而，这种表示方法非常消耗内存，因为它需要 `O(|V |²)`\
  \ 空间，对于稀疏图来说效率很的。考虑一个具有以下边的图 `G`：`(0,1)`、`(0,2)`、`(1,2)` 和 `(2,0)`。\n\n```\nGraph\
  \ g = new Graph(3);\ng.addEdge(0, 1);\ng.addEdge(0, 2);\ng.addEdge(1, 2);\ng.addEdge(2,\
  \ 0);\ng.printGraph();\n```\n\n上述代码将为图产生以下矩阵：\n\n```\n0 1 1\n0 0 1\n1 0 0\n```\n\
  \n#### 邻接表 (Adjacency List)\n\n邻接表是列表或数组的集合，图中每个顶点对应一个列表。每个 `Adj[v]` 包含所有与顶点 `v`\
  \ 相邻的顶点。这种表示方法对于稀疏图更节省空间，需要 `O(|V | + |E|)` 空间。\n\n```java\nimport java.util.LinkedList;\n\
  public class Graph { \n  private LinkedList<Integer>[] adjacencyList; \n  private\
  \ int numberOfVertices; \n  public Graph(int numberOfVertices) {\n    this.numberOfVertices\
  \ = numberOfVertices; \n    adjacencyList = new LinkedList[numberOfVertices];\n\
  \    for(int i=0; i<numberOfVertices; i++) {\n        adjacencyList[i] = new LinkedList<>();\n\
  \    }\n  }\n  public void addEdge(int i, int j) {\n    adjacencyList[i].add(j);\n\
  \  }\n  public void removeEdge(int i, int j) {\n    adjacencyList[i].remove((Integer)j);\n\
  \  }\n  public boolean isEdge(int i, int j) {\n    return adjacencyList[i].contains(j);\n\
  \  }\n  public void printGraph() {\n    for (int i = 0; i < numberOfVertices; i++)\
  \ {\n      System.out.print(i + \": \");\n      for (Integer neighbor : adjacencyList[i])\
  \ {\n        System.out.print(neighbor + \" \");\n      }\n      System.out.println();\n\
  \    }\n  }\n}\n```\n*(注：原文中提供的 Java 代码片段不完整且存在逻辑混乱，翻译时已根据上下文意图补全了基础结构以保持逻辑一致性)*\n\
  \n邻接表表示法对于稀疏图更节省空间，需要 `O(|V | + |E|)` 空间。\n\n\n\n\n\n### 图的表示\n\nDFS 可以使用邻接表或邻接矩阵实现我们将使用邻接表来实现\
  \ DFS，因为它在处理稀疏图时在空间复杂度上更高效。\n\n```java\nimport java.util.*; \n\npublic class Graph\
  \ { \n\n    private Map<Integer, List<Integer>> adjacencyList; \n\n    public Graph()\
  \ { \n      adjacencyList = new HashMap<>(); \n    } \n\n    public void addEdge(int\
  \ v, int w) { \n      adjacencyList.computeIfAbsent(v, k -> new LinkedList<>()).add(w);\
  \ \n    } \n\n    public void DFS(int start) { \n      Set<Integer> visited = new\
  \ HashSet<>(); \n      DFSRecursive(start, visited); \n    } \n\n    private void\
  \ DFSRecursive(int v, Set<Integer> visited) { \n      visited.add(v); \n      System.out.print(v\
  \ + \" \"); \n      for (int neighbor : adjacencyList.getOrDefault(v, new LinkedList<>()))\
  \ { \n          if (!visited.contains(neighbor)) { \n              DFSRecursive(neighbor,\
  \ visited); \n          } \n      } \n    } \n\n    public static void main(String[]\
  \ args) { \n      Graph g = new Graph(); \n      g.addEdge(0, 1); \n      g.addEdge(0,\
  \ 2); \n      g.addEdge(1, 2); \n      g.addEdge(2, 0); \n      g.addEdge(2, 3);\
  \ \n      g.addEdge(3, 3); \n      System.out.println(\"Depth First Traversal starting\
  \ from vertex 2:\"); \n      g.DFS(2); \n    } \n}\n```\n\n当执行上述程序时，从顶点 2 开始的 DFS\
  \ 如下：\n\n```\n Depth First Traversal starting from vertex 2:\n2 0 1 3\n```\n\n##\
  \ 复杂度分析\n\n- **时间复杂度：** 邻接表表示的时间复杂度为 O(V + E)，其中 V 是顶点数，E 是边数。这是因为每个顶点和条条都被遍历了一次。\n\
  - **空间复杂度：** 由于需要存储访问集合和递归函数调用栈，空间复杂度为 O(V )。\n\nDFS 在需要遍历整个图的场景中特别有用，例如拓扑排序、强连通分量检测以及解决迷宫等谜题。使用递归还是显式栈的选择取决于编程语言以及当前问题的特定限制条件。\n\
  \n## 边界情况与考虑\n\n在实现 DFS 时，应注意在递归调用深度有限的语言（如 Java 或 Python）中可能出现的栈溢出问题。在这些情况下，使用显式栈模拟递归是一个更健壮的解决方案。此外，处理包含环的图需要仔细标记已访问的节点以避免死循环。\n\
  \n## 迭代方法\n\n为了完整起见，让我们考虑使用显式栈的迭代方法。这种方法在对递归深度有要求的语言中可能具有特别优势。\n\n```java\npublic\
  \ void DFSIterative(int start) { \n    Set<Integer> visited = new HashSet<>(); \n\
  \    Stack<Integer> stack = new Stack<>(); \n    stack.push(start); \n    while\
  \ (!stack.isEmpty()) {\n      int v = stack.pop();\n      if (!visited.contains(v))\
  \ {\n          visited.add(v); \n          System.out.print(v + \" \"); \n     \
  \ }\n      for (int neighbor : adjacencyList.getOrDefault(v, new LinkedList<>()))\
  \ { \n          if (!visited.contains(neighbor)) { \n              stack.push(neighbor);\
  \ \n          } \n      } \n    } \n}\n```\n\n这种迭代实现使用栈来管理遍历，提供了递归的替代方案，并对深度提供了更好的控制。总的来说，DFS\
  \ 是一种通用且基础的遍历技术，是许多图算法的基础。理解它的机制、实现及其限性对于利用其能力至关重要。\n\n### 10.5 图遍历：广度优先搜索 (BFS)\n\
  \n广度优先搜索 (BFS) 是一种用于遍历或搜索树或图结构的算法。它从给定节点（通常称为“源”节点）开始，在移动到下一深度节点之前，探索其当前深度的所有邻居。BFS\
  \ 是图论中的基石，是解决诸如寻找无权图中的最短路径等问题的基础。\n\n### 算法描述\n\n1. 初始化队列 `Q` 和源节点。\n2. 将源节点标记为已访问。\n\
  3. 当 `Q` 不为空时：\n   - 从 `Q` 弹出节点 `u`。\n   - 对于 `u` 的每个邻居 `v`：\n     - 如果 `v` 未被访问：\n\
  \       - 将 `v` 入队 `Q`。\n       - 将 `v` 标记为已访问。\n\n可以用伪代码更正式地描述 BFS 算法：\n\n**算法\
  \ 43:** 广度优先搜索 (BFS)\n**数据：** 图 G(V,E)，源节点 s\n**结果：** 已访问节点和遍历顺序 初始化所有节点为未访问；创建一个队列\
  \ Q；将 s 入队 Q；标记 s 为已访问；**while** Q 不为空 **do** u ← 从 Q 弹出；**for** u 的每个邻居 v **do**\
  \ **if** v 未被访问 **then** 将 v 入队 Q；标记 v 为已访问；\n\n### 实现\n\n在 Java 中实现 BFS，我们使用队列数据结构来辅助层序遍历。核心概念包括标记节点为已访问以及探索邻居。以下是\
  \ BFS 的具体实现：\n\n```java\nimport java.util.*; \n\nclass Graph { \n    private int\
  \ V; // 顶点数 \n    private LinkedList<Integer> adj[]; // 邻接表表示 \n\n    // 构造函数\n\
  \    Graph(int v) { \n      V = v; \n      adj = new LinkedList[v]; \n      for\
  \ (int i = 0; i < v; ++i)\n          adj[i] = new LinkedList(); \n    } \n\n   \
  \ // 向图中添加边的函数\n    void addEdge(int v, int w) { \n      adj[v].add(w); \n    }\
  \ \n\n    // 从给定源节点开始的 BFS 遍历\n    void BFS(int s) { \n      boolean visited[] =\
  \ new boolean[V]; \n      LinkedList<Integer> queue = new LinkedList<Integer>();\
  \ \n      visited[s] = true; \n      queue.add(s); \n      while (queue.size() !=\
  \ 0) {\n        s = queue.poll();\n        System.out.print(s + \" \"); \n     \
  \   Iterator<Integer> i = adj[s].listIterator(); \n        while (i.hasNext()) {\n\
  \          int n = i.next(); \n          if (!visited[n]) { \n            visited[n]\
  \ = true; \n            queue.add(n); \n          } \n        } \n      } \n   \
  \ } \n}\n```\n\n**示例执行：**\n\n考虑以下图：\n\n```\n 0 - 1 \n    |   | \n    2 - 3\n```\n\
  \n添加边并从节点 2 开始执行 BFS：\n\n```java\n// 展示 BFS 的驱动方法\npublic static void main(String[]\
  \ args[]) { \n  Graph g = new Graph(4); \n  g.addEdge(0, 1); \n  g.addEdge(0, 2);\
  \ \n  g.addEdge(1, 2); \n  g.addEdge(2, 0); \n  g.addEdge(2, 3); \n  g.addEdge(3,\
  \ 3); \n  System.out.println(\"Breadth First Traversal starting from node 2:\");\
  \ \n  g.BFS(2); \n}\n```\n\n```\nBreadth First Traversal starting from node 2: \n\
  2 0 3 1\n```\n\n\n\n\nDijkstra 算法（以荷兰计算机科学家 Edsger W. Dijkstra 的名字命名的算法，是一种用于寻找图中节点间最短路径的经典算法。它适用于具有非负边权的图，既可用于有向图也可用于无向图。\n\
  \nDijkstra 算法的基本原理是：反复选择距离起始点已知距离最小的顶点，并对其所有邻居顶点执行松弛操作。松弛操作通过比较新计算的路径与之前已知的最短路径，并选择较小的一个，来更新到达邻居顶点的代价。\n\
  \nDijkstra 算法的正式定义如下所示，涉及多个步骤，包括初始化、通过松弛更新距离以及提取已知距离最小的顶点。\n\n```java\nimport java.util.*;\
  \ \n\nclass Dijkstra { \n\n    static class Edge { \n      int target; \n      int\
  \ weight; \n      Edge(int target, int weight) { \n          this.target = target;\
  \ \n          this.weight = weight; \n      } \n    } \n\n    static class Node\
  \ implements Comparable<Node> { \n      int vertex; \n      int distance; \n   \
  \   Node(int vertex, int distance) { \n          this.vertex = vertex; \n      \
  \    this.distance = distance; \n      } \n      public int compareTo(Node other)\
  \ { \n          return Integer.compare(this.distance, other.distance); \n      }\
  \ \n    } \n\n    public static int[] dijkstraAlgorithm(List<List<Edge>> adjList,\
  \ int start) { \n      int n = adjList.size(); \n      int[] distances = new int[n];\
  \ \n      Arrays.fill(distances, Integer.MAX_VALUE); \n      distances[start] =\
  \ 0; \n      PriorityQueue<Node> priorityQueue = new PriorityQueue<>(); \n     \
  \ priorityQueue.offer(new Node(start, 0)); \n      while (!priorityQueue.isEmpty())\
  \ { \n          Node currentNode = priorityQueue.poll(); \n          int currentVertex\
  \ = currentNode.vertex; \n          for (Edge edge : adjList.get(currentVertex))\
  \ { \n              int neighbor = edge.target; \n              int newDist = distances[currentVertex]\
  \ + edge.weight; \n              if (newDist < distances[neighbor]) { \n       \
  \           distances[neighbor] = newDist; \n                  priorityQueue.offer(new\
  \ Node(neighbor, newDist)); \n              } \n          } \n      } \n      return\
  \ distances; \n    }\n}\n```\n\nDijkstra 算法依赖于以下几个关键组件，详细说明如下：\n\n* **图的表示**：使用邻接列表表示图，其中每个顶点都有一个边列表。每条边由其目标顶点和权重定义。\n\
  * **距离数组**：维护一个 `distances` 数组来存储从起始顶点到每个顶点的最短距离。初始时，所有距离都设为无穷大（`Integer.MAX_VALUE`），但起始顶点设为\
  \ 0。\n* **优先级队列**：为了高效地检索距离最小的顶点，使用了优先级队列。优先级队列存储了包含顶点及其当前距离的节点。\n* **松弛过程**：如果通过\
  \ `currentVertex` 发现更短的路径，则松弛过程会更新到邻居顶点的距离。如果发生了更新，则将邻居顶点及其新距离加入 `priorityQueue`。\n\
  \n该算法详细遵循以下步骤：\n\n1. **初始化**：\n   - 将 `distances` 数组初始化为 `Integer.MAX_VALUE`。\n\
  \   - 将起始顶点的距离设置为 0。\n   - 将距离为 0 的起始顶点插入 `priorityQueue`。\n2. **While 循环**：算法的核心是一个\
  \ `while` 循环，直到 `priorityQueue` 为空为止：\n   - 从 `priorityQueue` 中提取距离最小的 `currentVertex`。\n\
  \   - 对于每个邻居顶点，通过将边权重加到 `currentVertex` 的距离上来计算潜在的新距离。\n   - 如果计算出的距离小于当前到邻居顶点的距离，则更新距离并将邻居顶点加入\
  \ `priorityQueue`。\n3. **结果提取**：一旦 `priorityQueue` 为空，`distances` 数组包含从起始顶点到所有其他顶点的最短路径距离。\n\
  \n```\nExample execution:\nGraph:\n0 -- 1 (weight: 4)\n0 -- 2 (weight: 1)\n2 --\
  \ 1 (weight: 2)\n1 -- 3 (weight: 1)\n2 -- 3 (weight: 5)\n\nAdjacency List:\n[[Edge(1,\
  \ 4), Edge(2, 1)], [Edge(3, 1)], [Edge(1, 2), Edge(3, 5)], []]\n\nExecution with\
  \ start vertex 0:\nSteps:\n1. Initialize distances = [0, ∞, ∞]\n2. Insert vertex\
  \ 0 in priority queue with distance 0.\n3. Pop vertex 0, update neighbors:\n   \
  \ distances = [0, 4, 1, ∞]\n    insert vertices 1 and 2 in priority queue.\n4. Pop\
  \ vertex 2, update neighbors:\n    distances = [0, 3, 1, ∞]\n    insert vertex 1\
  \ again with distance 3.\n5. Pop vertex 1 with distance 3, update neighbors:\n \
  \   distances = [0, 3, 1, 4]\n    insert vertex 3 with distance 4.\n6. Pop vertex\
  \ 1 with distance 4, no updates.\n7. Pop vertex 3, no updates.\n\nResulting shortest\
  \ paths: [0, 3, 1, 4]\n```\n\nDijkstra 算法的正确性取决于一个不变性：当顶点从 `priorityQueue` 中提取出来时，其最短距离就已经确定了。这是由于顶点处理的顺序是非递减的所确保。\n\
  \n最后，重要的是 Dijkstra 算法的时间复杂度。当使用 `priorityQueue`（二叉堆）实现时，总时间复杂度为 $O((V + E)\\log\
  \ V)$，其中 $V$ 和 $E$ 分别是顶点和边的数量。使用 Fibonacci 堆，该复杂度可以进一步降低，但二叉堆实现提供了效率与简单性的实用平衡，适用于大多数应用。\n\
  \n### 10.7 最短路径算法：Bellman-Ford 算法\n\nBellman-Ford 算法是一种用于寻找加权图中单源顶点到所有其他顶点的最短路径的稳健方法。它能够处理带有负权边的图，这使其区别于\
  \ Dijkstra 算法。这一特性对于许多现实世界问题至关重要，在这些问题中边可以代表成本、损失或其他可能的负指标。\n\n**算法定义**：Bellman-Ford\
  \ 算法通过迭代松弛图边来改进源顶点与其他顶点之间的最短路径估计。该过程重复 $|V|-1$ 次，其中 $|V|$ 是顶点的数量。如果在第 $|V|$ 次迭代中发现进一步的松弛，则存在负权环。\n\
  \n**算法 44：Bellman-Ford 算法**\n**输入**：图 $G=(V,E)$,权重函数 $w: E \\to \\mathbb{R}$，源顶点\
  \ $s$\n**输出**：从 $s$ 到所有顶点 $v \\in V$ 的最短路径\n`for` 每个顶点 $v \\in V$ \n  `dist[v] :=\
  \ \\infty`; `parent[v] := NIL`; `dist[s] := 0`;\n`for` $i := 1$ to $|V|-1$ \n  `for`\
  \ 每条边 $(u,v) \\in E$ \n    `if` $dist[u] + w(u, v) < dist[v]$ `then` `dist[v] :=\
  \ dist[u] + w(u, v)`; `parent[v] := u`;\n`for` 每条边 $(u,v) \\in E$ \n  `if` $dist[u]\
  \ + w(u, v) < dist[v]$ `then` 报告负权环；\n\n**初始化**：算法首先将源顶点 $s$ 的距离设置为 0，并将所有其他距离 `dist[v]`\
  \ 初始化为无穷大（$\\infty$）。每个顶点的父节点 `parent[v]` 初始设为 `NIL`。\n`for` 每个顶点 $v$ 在 $V$:\n \
  \ `dist[v] := \\infty`; `parent[v] := NIL`\n`dist[s] := 0`\n\n**松弛**：Bellman-Ford\
  \ 算法的核心是边松弛过程。对于每条边 $(u,v)$，如果通过 $u$ 到顶点 $v$ 的距离比已知的 $v$ 距离短，则更新距离：\n`for` $i :=\
  \ 1$ to $|V|-1$:\n  `for` 每条边 $(u,v)$ 在 $E$:\n\n\n\n这种松弛操作执行了 `|V|− 1` 次迭代，确保最短路径被正确计算，考虑了最短路径可能包含\
  \ `|V|− 1` 条边的最坏情况。\n\n**检查负环：** 在完成 `|V|− 1` 次迭代后，对边进行最后一次遍历以检测是否存在任何负权环。如果在在此迭代中发现更短的路径，则说明存在负权环。\n\
  \n```\nfor each edge (u, v) in E:\n    if dist[u] + w(u, v) < dist[v]:\n       \
  \ report a negative-weight cycle\n```\n\n**时间复杂度：** Bellman-Ford 算法的时间复杂度为 `O(|V||E|)`。这是因为\
  \ `|V|− 1` 次遍历中的每一次都会检查所有的 `|E|` 条边，在最坏情况下，算法执行这种检查 `|V|− 1` 次，再加上额外的一次循环检测。\n\n\
  **空间复杂度：** 空间复杂度为 `O(|V|)`，因为需要为每个顶点维护距离数组和父节点数组。\n\n**实际应用：** Bellman-Ford 算法在处理负权边的应用中特别有用，例如金融模型、距离矢量路由（Distance\
  \ Vector Routing）等路由协议以及某些网络流问题。\n\nBellman-Ford 算法为在可能存在负权边的图中寻找最短路径提供了一种系统的方法。它检测负权环的能力进一步增强了它在广泛计算问题中的适用性。\n\
  \n### 10.8 最小生成树算法：Prim 算法\n\nPrim 算法是一种用于寻找加权无向图最小生成树（MST）的重要算法。图的最小生成树是一个连接所有顶点且不包含任何环的子图，其总边权重为最小。Prim\
  \ 算法的工作原理是从任意起始顶点开始，通过一次构建一个顶点的方式来构建这棵树，始终添加从树到另一个顶点的最廉的连接。\n\nPrim 算法从单个节点开始，探索连接该节点与其他节点之间的所有边，并贪婪地选择权重最小的边。这个过程扩展到包含新顶点，并持续到所有顶点都被包含在\
  \ MST 中。\n\n为了有效实现实现 Prim 算法，我们通常使用优先级队列（或最小堆）来跟踪扩展增长中树的权重最小的边。\n\nPrim 算法的伪代码如下：\n\
  \n```\nData: Graph G = (V,E) 有 V 个顶点和 E 条边，以及一个起始顶点 s ∈ V\nResult: 形成最小生成树的边集 T\n\
  Initialize T ←∅ ;\nInitialize Q to be a priority queue containing all vertices in\
  \ V with key value ∞ ;\nSet the key value of vertex s to 0 in Q ;\nwhile Q is not\
  \ empty do\n    Extract vertex u from Q with the smallest key value ;\n    foreach\
  \ vertex v adjacent to u\n    do\n        if v ∈ Q and weight(u,v) < key value of\
  \ v\n        then set key value of v to weight(u,v) in Q ;\n        Update the parent\
  \ of v to u ;\n    foreach vertex v in V except for s\n    do \n        Add edge\
  \ (parent(v),v) to T\nreturn T\n```\n\n这里是使用邻接接表表示法和优先级队列实现的 Prim 算法的 Java 代码。\n\
  \n```java\nimport java.util.*; \n\nclass PrimMST { \n    static class Edge { \n\
  \        int target, weight; \n        Edge(int target, int weight) { \n       \
  \     this.target = target; \n            this.weight = weight; \n        } \n \
  \   } \n\n    public static void primMST(ArrayList<ArrayList<Edge>> graph) { \n\
  \        int V = graph.size(); \n        boolean[] inMST = new boolean[V]; \n  \
  \      int[] key = new int[V]; \n        int[] parent = new int[V]; \n        PriorityQueue<Edge>\
  \ pq = new PriorityQueue<>(V, Comparator.comparingInt(e -> e.weight)); \n      \
  \  Arrays.fill(key, Integer.MAX_VALUE); \n        Arrays.fill(parent, -1); \n  \
  \      key[0] = 0; \n        pq.add(new Edge(0, key[0])); \n        while (!pq.isEmpty())\
  \ { \n            int u = pq.poll().target; \n            if (inMST[u]) continue;\
  \ \n            inMST[u] = true; \n            for (Edge edge : graph.get(u)) {\
  \ \n                int v = edge.target; \n                int weight = edge.weight;\
  \ \n                if (!inMST[v] && weight < key[v]) { \n                    key[v]\
  \ = weight; \n                    parent[v] = u; \n                    pq.add(new\
  \ Edge(v, key[v])); \n                } \n            } \n        } \n        //\
  \ Print the constructed MST\n        for (int i = 1; i < V; i++) { \n          \
  \  System.out.println(\"(\" + parent[i] + \" - \" + i + \")\"); \n        } \n \
  \   }\n\n    public static void main(String[] args) { \n        // Create a graph\
  \ \n        int V = 5; \n        ArrayList<ArrayList<Edge>> graph = new ArrayList<>();\
  \ \n        for (int i = 0; i < V; i++) { \n            graph.add(new ArrayList<>());\
  \ \n        } \n        // Add edges \n        graph.get(0).add(new Edge(1, 2));\
  \ \n        graph.get(0).add(new Edge(3, 6)); \n        graph.get(1).add(new Edge(0,\
  \ 2)); \n        graph.get(1).add(new Edge(2, 3)); \n        graph.get(1).add(new\
  \ Edge(3, 8)); \n        graph.get(1).add(new Edge(4, 5)); \n        graph.get(2).add(new\
  \ Edge(1, 3)); \n        graph.get(2).add(new Edge(4, 7)); \n        graph.get(3).add(new\
  \ Edge(0, 6)); \n        PrimMST(graph); \n    } \n}\n```\n\n上述程序首先将 `key` 值初始化为无穷大，并将\
  \ `inMST` 初始化为 `false`。它初始化优先级队列并开始循环提取最小的 key。对于每个顶点，它检查到相邻顶点的权重，更新 key，并将边添加到\
  \ MST 中。\n\n执行输出将是：\n```\n(0 - 1)\n(1 - 2)\n(1 - 4)\n(0 - 3)\n```\n该输出表示了 MST 中的边。括号内的数字显示了\
  \ MST 中节点之间的连接。Prim 算法非常高效，由于其使用了优先级队列来管理边，非常适用于稠密图。\n\n### 10.9 最小生成树算法：Kruskal\
  \ 算法\n\nKruskal 算法是一种用于寻找连通无向图最小生成树（MST）的经典算法。它属于贪婪算法的一类，这类算法做出一系列选择，每个选择在当时都是最好的，以希望找到全局最优。Kruskal\
  \ 算法专门通过选择边来构建 MST。\n\nKruskal 算法首先按权重非递减对图中所有的边进行排序。然后选择最短的边并将其添加到增长生成树中，确保不形成环。这个过程持续到包含\
  \ `V − 1` 条边，其中 `V` 是顶点的数量。\n\n为了确保添加边不会产生环，算法使用了称为 Union-Find（并查集）的数据结构。该结构支持高效的联合查找操作，以跟踪增长中\
  \ MST 的连通分量。\n\n```java\nimport java.util.*; \n\n// 表示图中边的类\nclass Edge implements\
  \ Comparable<Edge> { \n    int src, dest, weight;\n\n    // 基于权重排序边的比较器\n    public\
  \ int compareTo(Edge compareEdge) { \n        return this.weight - compareEdge.weight;\
  \ \n    } \n}; \n\n// 用于并查集的子集类\nclass Subset { \n    int parent, rank; \n}; \n\n\
  public class KruskalAlgorithm { \n```\n\n\n\n\n\n```java\n    int V, E; // 顶点和边的数量\n\
  \n    Edge edge[]; // 所有边的集合\n\n    KruskalAlgorithm(int v, int e) {\n        V\
  \ = v;\n        E = e;\n        edge = new Edge[E];\n        for (int i = 0; i <\
  \ e; ++i)\n            edge[i] = new Edge();\n    }\n\n    // 辅助函数，使用路径压缩找到元素 i\
  \ 所在的集合\n    int find(Subset subsets[], int i) {\n        if (subsets[i].parent\
  \ != i)\n            subsets[i].parent = find(subsets, subsets[i].parent);\n   \
  \     return subsets[i].parent;\n    }\n\n    // 使用按秩合并的方法合并 x 和 y 两个集合\n    void\
  \ union(Subset subsets[], int x, int y) {\n        int xroot = find(subsets, x);\n\
  \        int yroot = find(subsets, y);\n        if (subsets[xroot].rank < subsets[yroot].rank)\
  \ {\n            subsets[xroot].parent = yroot;\n        } else if (subsets[xroot].rank\
  \ > subsets[yroot].rank) {\n            subsets[yroot].parent = xroot;\n       \
  \ } else {\n            subsets[yroot].parent = xroot;\n            subsets[xroot].rank++;\n\
  \        }\n    }\n\n    // 构建最小生成树 (MST) 的 Kruskal 算法\n    void kruskalMST() {\n\
  \        Edge result[] = new Edge[V];\n        int e = 0; // result[] 的索引变量\n  \
  \      int i = 0; // 排序后的边的索引变量\n        for (i = 0; i < V; ++i)\n            result[i]\
  \ = new Edge();\n        // 步骤 1：按权重非减对所有边进行排序\n        Arrays.sort(edge);\n   \
  \     // 为创建 V 个子集分配内存\n        Subset subsets[] = new Subset[V];\n        for (i\
  \ = 0; i < V; ++i)\n            subsets[i] = new Subset();\n        // 创建包含单个元素的\
  \ V 个子集\n        for (int v = 0; v < V; ++v) {\n            subsets[v].parent =\
  \ v;\n            subsets[v].rank = 0;\n        }\n        i = 0; // 选择下一条边的索引\n\
  \        // 需要取的边数等于 V-1\n        while (e < V - 1) {\n            // 步骤 2：选取最小的边。检查它是否与目前为止的生成树形成环。如果没有，则将其加入结果中\n\
  \            Edge nextEdge = new Edge();\n            nextEdge = edge[i++];\n  \
  \          int x = find(subsets, nextEdge.src);\n            int y = find(subsets,\
  \ nextEdge.dest);\n            if (x != y) {\n                result[e++] = nextEdge;\n\
  \                union(subsets, x, y);\n            }\n        }\n        // 打印\
  \ MST 的内容\n        System.out.println(\"构建的 MST 中的边如下：\");\n        for (i = 0;\
  \ i < e; ++i)\n            System.out.println(result[i].src + \" -- \" + result[i].dest\
  \ + \" == + + result[i].weight);\n    }\n\n    // 驱动代码\n    public static void main(String[]\
  \ args) {\n        int V = 4; // 图中的顶点数量\n        int E = 5; // 图中的边数量\n       \
  \ KruskalAlgorithm graph = new KruskalAlgorithm(V, E);\n        // 添加边 0-1\n   \
  \     graph.edge[0].src = 0;\n        graph.edge[0].dest = 1;\n        graph.edge[0].weight\
  \ = 10;\n        // 添加边 0-2\n        graph.edge[1].src = 0;\n        graph.edge[1].dest\
  \ = 2;\n        graph.edge[1].weight = 6;\n        // 添加边 0-3\n        graph.edge[2].src\
  \ = 0;\n        graph.edge[2].dest = 3;\n        graph.edge[2].weight = 5;\n   \
  \     // 添加边 1-3\n        graph.edge[3].src = 1;\n        graph.edge[3].dest = 3;\n\
  \        graph.edge[3].weight = 15;\n        // 添加边 2-3\n        graph.edge[4].src\
  \ = 2;\n        graph.edge[4].dest = 3;\n        graph.edge[4].weight = 4;\n   \
  \     graph.kruskalMST();\n    }\n}\n```\n\n该算法遵循以下步骤：\n\n-   初始情况下，每个顶点都在其自己的子集中。`find`\
  \ 函数使用路径压缩来找到集合的代表元素，从而保持树的平坦化。\n-   `union` 函数通过将秩较小的子集的树挂载到秩较大的子集的树上，将两个子集合并为一个子集。\n\
  -   `Kruskal’s algorithm` 对边进行排序并遍历它们，使用 `find` 检查当前边是否连接了不同的子集。如果是，则将该边包含结果中，并使用\
  \ `union` 合并子集。\n\n这种方法确保了图在逐步构建最小生成树的过程中保持无环性。算法的复杂度主要由排序步骤决定。\n\n\n\n\n\n```java\n\
  \      stack.push(v); \n\n   } \n\n   // 执行拓扑排序的函数。它使用了递归的 topologicalSortUtil()\n\
  \n   void topologicalSort() { \n      Stack<Integer> stack = new Stack<>(); \n \
  \     // 将所有顶点标记为未访问 \n      boolean visited[] = new boolean[V]; \n      for (int\
  \ i = 0; i < V; i++) \n          visited[i] = false; \n      // 调用递归辅助函数，逐个从所有顶点开始存储拓扑排序\n\
  \      for (int i = 0; i < V; i++) { \n          if (!visited[i]) \n           \
  \   topologicalSortUtil(i, visited, stack); \n      } \n      // 打印栈中的内容 \n    \
  \  while (!stack.empty()) \n          System.out.print(stack.pop() + \" \"); \n\
  \   } \n\n   // 主函数 \n   public static void main(String args[]) { \n      TopologicalSort\
  \ g = new TopologicalSort(6); \n      g.addEdge(5, 2); \n      g.addEdge(5, 0);\
  \ \n      g.addEdge(4, 0); \n      g.addEdge(4, 1); \n      g.addEdge(2, 3); \n\
  \      g.addEdge(3, 1); \n      System.out.println(\"给定图的拓扑排序:\"); \n      g.topologicalSort();\
  \ \n   } \n}\n```\n\n上述 Java 程序定义了一个用于执行拓扑排序的 `TopologicalSort` 类。`addEdge` 方法用于向邻接列表添加一条边。核心逻辑位于\
  \ `topologicalSortUtil` 方法中，该方法执行深度优先搜索（DFS），并在所有邻居节点处理完毕后将顶点存储在栈中。然后从栈中打印顶点，生成预期的拓扑顺序。\n\
  \n当执行上述代码时，将产生以下输出：\n\n```\n给定图的拓扑排序: \n5 4 2 3 1 0\n```\n\n在这个示例中，可以观察到每个顶点都出现在所有与其有边连接的顶点之前，尊重了依赖关系。\n\
  \n拓扑排序在各个领域的实用性巩固了它在图算法领域的核心地位。正确的理解和实现使得能够在复杂的依赖驱动上下文中高效地解决问题。\n\n### 10.11 图着色\n\
  \n图着色为图的顶点分配颜色的方法，使得任意两个相邻顶点不共享相同的颜色。这个问题在许多应用中都非常重要，包括调度、编译器中的寄存器分配以及移动网络中的频率分配。\n\
  \n形式上，给定一个图 $G = (V,E)$，图着色的目标是对每个顶点 $v \\in V$ 分配一个颜色 $c(v)$使得对于每条边 $(u,v) \\in\
  \ E$，都有 $c(u) \\neq c(v)$。为图 $G$ 着色所需的最小颜色数被称为该图的色数，记作 $\\chi(G)$。\n\n现在我们将探索一些用于图着色的算法，重点关注精确方法和启发式方法。\n\
  \n**算法 46:** 贪心着色算法\n**数据：** 图 $G = (V,E)$\n**结果：** 图 $G$ 的一种着色方案\n**函数** `GreedyColoring(G)`：**对于**\
  \ $V$ 中的每个顶点 $v$ **执行** 让 $L[v]$ 为分配给 $v$ 邻居的颜色列表，color$[v] \\leftarrow$ 不在 $L[v]$\
  \ 中的最小非负整数 **返回** 每个顶点的颜色分配\n\n`GreedyColoring` 算法虽然不能保证使用最小数量的颜色，但它简单快速，通常用于现实世界。它逐个为顶点着色，确保没有相邻顶点共享相同的颜色。\n\
  \n考虑以下示例：\n\n```java\nclass Graph {\n  private int numVertices; \n  private LinkedList<Integer>\
  \ adjList[]; \n  Graph(int vertices) { \n    numVertices = vertices; \n    adjList\
  \ = new LinkedList[vertices]; \n    for (int i = 0; i < vertices; ++i) \n      adjList[i]\
  \ = new LinkedList(); \n  }\n  void addEdge(int v, int w) { \n    adjList[v].add(w);\
  \ \n    adjList[w].add(v); \n  }\n  void greedyColoring() { \n    int result[] =\
  \ new int[numVertices]; \n    Arrays.fill(result, -1); \n    result[0] = 0; \n \
  \   boolean available[] = new boolean[numVertices]; \n    Arrays.fill(available,\
  \ true); \n    for (int u = 1; u < numVertices; u++) { \n      Iterator<Integer>\
  \ it = adjList[u].iterator(); \n      while (it.hasNext()) { \n        int i = it.next();\
  \ \n        if (result[i] != -1) \n          available[result[i]] = false; \n  \
  \    } \n      int cr; \n      for (cr = 0; cr < numVertices; cr++) { \n       \
  \   if (available[cr]) \n            break; \n      } \n      result[u] = cr; \n\
  \      Arrays.fill(available, true); \n    } \n    for (int u = 0; u < numVertices;\
  \ u++) \n      System.out.println(\"Vertex \" + u + \" ---> Color \" + result[u]);\
  \ \n  } \n}\n```\n\n在图上运行上述 `greedyColoring` 函数将产生每个顶点都分配颜色的输出。\n\n```\nVertex 0\
  \ ---> Color 0\nVertex 1 ---> Color 1\nVertex 2 ---> Color 0\nVertex 3 ---> Color\
  \ 1\n```\n\n`GreedyColoring` 算法的时间复杂度为 $O(V + E)$，这对于大型图是非常高效的。对于更多情况，回溯等精确算法很有用但计算代价很高。\n\
  \n**算法 47:** 回溯着色\n**数据：** 图 $G = (V,E)$，颜色数 $m$\n**结果：** 图 $G$ 的一种着色方案\n**函数**\
  \ `Coloring(G, m)`：**如果** $G$ 为空 **则** 返回解决方案 选择顶点 $v$ **对于** 从 1 到 $m$ 的每个颜色 $c$\
  \ **执行** **如果** $v$ 未着色 **则** 为 $v$ 分配 $c$，如果存在解决方案 **返回** true **返回** false\n\n\
  回溯方法以指数级时间运行。\n\n### 10.12 图算法的应用\n\n图算法对于解决多个领域的现实问题至关重要。这些应用跨越从网络到生物信息学的领域。\n\n\
  #### 计算机与通信网络\n\n图自然地模拟计算机通信网络。节点代表计算机或交换机，边代表它们之间的链路。图算法在设计这些网络中起着至关重要的作用。`Dijkstra`\
  \ 和 `Bellman-Ford` 等算法被用于路由，寻找从源到目的的最短路径。考虑 `Dijkstra` 算法确定源到最短路径的示例：\n\n```java\n\
  import java.util.*; \n\nclass Graph { \n  private int vertices; \n  private final\
  \ List<Node>> adjList; \n\n  static class Node implements Comparable<Node> { \n\
  \    int node; \n    int cost; \n    Node(int node, int cost) { \n      this.node\
  \ = node; \n      this.cost = cost; \n    }\n    @Override \n    public int compareTo(Node\
  \ other) { \n      return Integer.compare(this.cost, other.cost); \n    } \n  }\
  \ \n\n  Graph(int vertices) { \n    this.vertices = vertices; \n    adjList = new\
  \ ArrayList<>(vertices); \n    for (int i = 0; i < vertices; i++) { \n      adjList.add(new\
  \ ArrayList<>()); \n    } \n  } \n\n  public void addEdge(int src, int dest, int\
  \ cost) { \n    adjList.get(src).add(new Node(dest, cost)); \n    adjList.get(dest).add(new\
  \ Node(src, cost)); // 对于无向图 \n  } \n\n  public void dijkstra(int src) { \n```\n\
  \n\n\n\n```java\nPriorityQueue<Node> pq = new PriorityQueue<>();\nint[] dist = new\
  \ int[vertices];\nArrays.fill(dist, Integer.MAX_VALUE);\npq.add(new Node(src, 0));\n\
  dist[src] = 0;\nwhile (!pq.isEmpty()) {\n    Node currentNode = pq.poll();\n   \
  \ for (Node neighbor : adjList.get(currentNode.node)) {\n        if (dist[currentNode.node]\
  \ + neighbor.cost < dist[neighbor.node]) {\n            dist[neighbor.node] = dist[currentNode.node]\
  \ + neighbor.cost;\n            pq.add(new Node(neighbor.node, dist[neighbor.node]));\n\
  \        }\n    }\n}\nSystem.out.println(\"Shortest paths from node \" + src + \"\
  :\");\nfor (int i = 0; i < vertices; i++) {\n    System.out.println(\"To node \"\
  \ + i + \": \" + dist[i]);\n}\n}\n```\nOutput:\nShortest paths from node 0:\nTo\
  \ node 0: 0\nTo node 1: 4\nTo node 2: 2\nTo node 3: 7\n...\n\n## 2. 社会网络分析\n\n社交网络可以表示为图，其中节点表示个体，边表示他们之间的关系。广度优先搜索\
  \ (BFS) 和深度优先搜索 (DFS) 等算法可以分析连通分量、最短路径和中心性度量等属性。例如，BFS 算法可以用于寻找两个个体之间的隔程度：\n\n```java\n\
  import java.util.*;\n\nclass SocialNetwork {\n    private final int vertices;\n\
  \    private final LinkedList<Integer>[] adjList;\n    public SocialNetwork(int\
  \ vertices) {\n        this.vertices = vertices;\n        adjList = new LinkedList[vertices];\n\
  \        for (int i = 0; i < vertices; i++) {\n            adjList[i] = new LinkedList<>();\n\
  \        }\n    }\n    public void addEdge(int src, int dest) {\n        adjList[src].add(dest);\n\
  \        adjList[dest].add(src);\n    }\n    public int bfs(int start, int end)\
  \ {\n        boolean[] visited = new boolean[vertices];\n        int[] distance\
  \ = new int[vertices];\n        Queue<Integer> queue = new LinkedList<>();\n   \
  \     visited[start] = true;\n        queue.add(start);\n        while (!queue.isEmpty())\
  \ {\n            int node = queue.poll();\n            for (int neighbor : adjList[node])\
  \ {\n                if (!visited[neighbor]) {\n                    visited[neighbor]\
  \ = true;\n                    distance[neighbor] = distance[node] + 1;\n      \
  \              queue.add(neighbor);\n                    if (neighbor == end) {\n\
  \                        return distance[neighbor];\n                    }\n   \
  \             }\n            }\n        }\n        return -1; // 如果不存在路径\n    }\n\
  }\n```\nOutput:\n从 0 到 5 的隔程度\n从 0 到 2 的隔程度\n...\n\n## 3. 城市规划与交通\n\n在城市规划和交通中，图表示道路网络，其中节点是交叉路口，边是连接这些交叉路口的道路。`Dijkstra’s`\
  \ 和 `Floyd-Warshall` 等算法被用于导航系统寻找最短路线。在公共交通网络中，图有助于优化时间表和路线。\n\n## 4. 生物学与生物信息学\n\
  \n图在生物信息学中广泛用于分子结构、蛋白质-蛋白质相互作用和遗传学的建模。例如，序列比对可以使用图建模，其中顶点表示序列，边表示序列之间的匹配。`Hamiltonian\
  \ path` 和 `cycle` 等算法可以检测遗传网络中的路径。\n\n## 5. 网页搜索引擎\n\n搜索引擎使用图算法来对网页进行排名。`PageRank`\
  \ 算法将网络模型为有向图，其中页面是节点，超链接是边。该算法通过遍历图的邻接矩阵根据其结构确定网页的重要性：\n\n```java\nimport java.util.*;\n\
  \nclass PageRank {\n    private final int vertices;\n    private final double[][]\
  \ adjMatrix;\n    private double[] rank;\n    private static final double DAMPING_FACTOR\
  \ = 0.85;\n    private static final double EPSILON = 1e-6;\n    public PageRank(int\
  \ vertices) {\n        this.vertices = vertices;\n        adjMatrix = new double[vertices][vertices];\n\
  \        rank = new double[vertices];\n        Arrays.fill(rank, 1.0 / vertices);\n\
  \    }\n    public void addEdge(int src, int dest) {\n        adjMatrix[src][dest]\
  \ = 1.0;\n    }\n    public void calculatePageRank(int iterations) {\n        for\
  \ (int k = 0; k < iterations; k++) {\n            double[] newRank = new double[vertices];\n\
  \            for (int i = 0; i < vertices; i++) {\n                newRank[i] =\
  \ (1 - DAMPING_FACTOR) / vertices;\n                for (int j = 0; j < vertices;\
  \ j++) {\n                    if (adjMatrix[j][i] == 1.0) {\n                  \
  \      newRank[i] += DAMPING_FACTOR * rank[j] / getOutDegree(j);\n             \
  \       }\n                }\n            }\n            rank = newRank;\n     \
  \       if (hasConverged(rank, newRank)) {\n                break;\n           \
  \ }\n        }\n    }\n    private int getOutDegree(int node) {\n        int outDegree\
  \ = 0;\n        for (int i = 0; i < vertices; i++) {\n            if (adjMatrix[node][i]\
  \ == 1.0) {\n                outDegree++;\n            }\n        }\n        return\
  \ outDegree;\n    }\n    private boolean hasConverged(double[] oldRank, double[]\
  \ newRank) {\n        for (int i = 0; i < vertices; i++) {\n            if (Math.abs(oldRank[i]\
  \ - newRank[i]) > EPSILON) {\n                return false;\n            }\n   \
  \     }\n        return true;\n    }\n    public void printRanks() {\n        System.out.println(\"\
  PageRank values:\");\n        for (int i = 0; i < vertices; i++) {\n           \
  \ System.out.println(\"Node \" + i + \": \" + rank[i]);\n        }\n    }\n}\n```\n\
  Output:\nPageRank values:\nNode 0: 0.15\nNode 1: 0.65\nNode 2: 0.20\n...\n\n## 6.\
  \ 游戏开发\n\n在游戏开发中，图实现了路径规划和导航。`A* search`算法常用于确定游戏环境中的最短路径。节点表示游戏中的不同位置或状态，边表示状态之间的可能移动或转换。\n\
  \n## 7. 地理信息系统 (GIS)\n\nGIS 应用使用图来表示和分析空间网络，如道路、河流公用网络。`Prim’s` 和 `Kruskal’s`算法有助于构建最小生成树，以在地理区域内设计高效网络。这可以优化资源并提高连通性。\n\
