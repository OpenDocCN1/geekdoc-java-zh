    \ of code. This will cut down the risk of errors being hidden.\n\nA Good Example:\n\
    ```python\ntry:\n    value = collection[key]\nexcept KeyError:\n    return key_not_found(key)\n\
    else:\n    return handle_value(value)\n```\n\nA Bad Example:\n```python\ntry:\n\
    \    # Too broad!\n    return handle_value(collection[key])\nexcept KeyError:\n\
    \    # Will catch a KeyError that is raised by handle_value()\n    return key_not_found(key)\n\
    ```\n\n- When you use a resource tool that is local to a specific code section,\
    \ use it with a statement to make sure that it is cleaned immediately after use.\
    \ You can also use a `try/finally` statement.\n\n- Always invoke a context manager\
    \ through separate methods or functions whenever they are for a purpose other\
    \ than getting and releasing resources.\n\nA Good Example:\n```python\nwith conn.start_transaction():\n\
