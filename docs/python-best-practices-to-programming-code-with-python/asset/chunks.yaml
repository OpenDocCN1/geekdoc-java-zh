  trans: "\n如果你使用了不同优先级的运算符，请考虑在优先级最低的运算符周围添加空格——此处请根据你的判断来决定。然而，空格不应超过一个空格，并确保运算符两侧的空格数量相同——不要在一侧放\
    \ 1 个而在另一侧放 2 个：\n\n### 良好的示例：\n\n```\ni = i + 1\nsubmitted += 1\nx = x*2 - 1\n\
    hypot2 = x*x + y*y\nc = (a+b) * (a-b)\n```\n\n### 糟糕的示例：\n\n```\ni=i+1\nsubmitted\
    \ +=1\nx = x * 2 - 1\nhypot2 = x * x + y * y\nc = (a + b) * (a - b)\n```\n\n当你使用\
    \ `=` 号来指示参数或关键字参数的默认值时，不要在符号周围添加空格：\n\n### 良好的示例：\n\n```python\ndef complex(real,\
    \ imag=0.0):\n    return magic(r=real, i=imag)\n```\n\n### 糟糕的示例：\n\n```python\n\
    def complex(real, imag = 0.0):\n    return magic(r = real, i = imag)\n```\n\n\
    对于函数注解中的冒号，使用标准规则，并确保在使用了 `->` 时周围有空格：\n\n### 良好的示例：\n\n```python\ndef munge(input:\
    \ AnyStr): ...\ndef munge() -> AnyStr: ...\n```\n\n### 糟糕的示例：\n\n```python\ndef\
    \ munge(input:AnyStr): ...\ndef munge()->PosInt: ...\n```\n\n当结合默认值和参数注解使用时，`=`\
    \ 号周围应该有空格——除非该参数同时具有默认值和注解，否则不要这样做：\n\n### 良好的示例：\n\n```python\ndef munge(sep:\
    \ AnyStr = None): ...\ndef munge(input: AnyStr, sep: AnyStr = None, limit=1000):\
    \ ...\n```\n\n### 糟糕的示例：\n\n```python\ndef munge(input: AnyStr=None): ...\ndef\
    \ munge(input: AnyStr, limit = 1000): ...\n```\n\n使用复合语句（即在一行内编写多个语句）不是良好的习惯：\n\
    \n### 良好的示例：\n\n```python\nif foo == 'that':\n    do_that_thing()\ndo_one()\n\
    do_two()\ndo_three()\n```\n\n### 尽量不要这样做：\n\n```python\nif foo == 'that': do_that_thing()\n\
    do_one(); do_two(); do_three()\n```\n\n偶尔在一行内使用 `if`、`for` 和 `while` 语句是可以的，只要它们的体很小，但你永远不要对包含多个从的语句这样做。此外，永远不要折叠非常长的行：\n\
    \n### 尽量不要这样做：\n\n```python\nif foo == 'that': do_that_thing()\nfor x in lst:\
    \ total += x\nwhile t < 10: t = delay()\n```\n\n### 绝对不要：\n\n```python\nif foo\
    \ == 'that': do_that_thing()\nelse: do_non_that_thing()\ntry: something()\nfinally:\
    \ cleanup()\ndo_one(); do_two(); do_three(long, argument,\n                  \
    \           list, like, this)\nif foo == 'that': one(); two(); three()\n```\n\n\
    # 结论\n\n再次感谢你阅读我的书，我真心希望它能帮助你理解如何编写更有效高效的 Python 代码。\n\n从这里开始，下一步简单来说就是实践。你做得越多，就会做得越好，最终，你将像专业人士一样编写\
    \ Python 代码！通过研究、加入在线 Python 论坛并加入 Python 社区来学习更多知识并提升你的技能。\n\n最后，如果你觉得这本书有帮助，可以请你帮一个小忙吗？请考虑在\
