    \ redundant empty lines\", I have processed the logical structure provided in\
    \ the latter half.)*\n\n# Chapter 4: Idioms\n\nProgramming idioms are, in simple\
    \ terms, the way code should be written. We often refer to idiomatic code as Pythonic\
    \ and some more common ones are:\n\n## Unpacking\n\nProvided you know how a tuple\
    \ or list is, unpacking allows you to give each element a name. For example, `enumerate()`\
    \ gives us the index and the item:\n\nYou can also use unpacking to swap variables:\n\
    ```python\na, b = b, a\n```\n\nAnd you can use nested unpacking:\n```python\n\
    c, (b, a) = 3, 2\n```\n\n## Creating Ignored Variables\n\nIf you wanted to assign\
    \ something but do not need to use the variable, you would use `_`. For example:\n\
    \n```python\nfilename = 'footbar.txt'\nbasename, _, ext = filename.rpartition('.')\n\
    ```\n\nNOTE You will often see it recommended that you use a single underscore\
    \ `_` for variables that are throwaway, rather than using a double underscore\
    \ `__`. The problem with this is, the single underscore tends to be used in the\
    \ `gettext()` function as an alias. It is also used to store the value of the\
    \ previous operation at the interactive prompt. When you use a double underscore\
