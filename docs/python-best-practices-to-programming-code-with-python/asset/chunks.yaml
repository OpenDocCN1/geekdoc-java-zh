    \ concatenation of `CPython` that takes the form of `a=a+b` or `a+=b`. This is\
    \ a somewhat fragile optimization, even though it super-efficient in `CPython`,\
    \ because it won’t work on all type and it won’t be present in any Python implementation\
    \ that does not use refcounting. Instead, where you use a part of the library\
    \ that is performance-sensitive, you should use the `.join()` form instead. This\
    \ will make sure that the concatenation is linear across all the different Python\
    \ implementations.\n\n- Never use an equality operator to make comparisons to\
    \ a singleton such as `None`. Instead, use `is` or `not`. You should also be wary\
    \ of using `if x` when really you should be using `if is not None`. An example\
    \ of this is when you are testing if an argument or a variable that defaults to\
    \ a value of `None` was actually set to a different value. The other value could\
    \ have a type that is false in the Boolean context.\n\n- Rather than using the\
    \ operator `not...is`, you should use `is not`. While they both are identical\
    \ in terms of function, the first is low on the readability scale, making the\
    \ second one more preferable. An example:\n\nUse This:\n```python\nif foo is not\
    \ None:\n```\n\nDon’t Use This:\n```python\nif not foo is None\n```\n\n- When\
    \ you implement an ordering operation with a rich comparison, you should implement\
    \ all of the 6 operations instead of relying on some other code to exercise a\
    \ comparison. Those operations are `(__eq__`, `__lt__`, `__ne__`, `__ge__`, `__gt__`,\
    \ `__le__)`. To cut down on the effort needed, one particular decorator helps\
    \ to generate any comparison methods that are missing. That decorator is `functools.total_ordering()`.\n\
    \nThe style guidelines indicate that Python assumes reflexivity rules. As such,\
    \ the Python interpreter might change things about by swapping `y > x` with `x\
    \ < y`, or it may swap `y >= x` with `x <= y`. You may also find that the argument\
    \ `x == y` has been swapped with `x != y`. The `min()` and `sort()` operations\
    \ will also definitely use the `<` operator and the `max()` function will use\
    \ the `>` operator. However, you should, as a best practice guide, use all of\
    \ them so that there is no confusion.\n\n- Rather than using an assignment statement\
    \ that will bind a lambda expression to an identifier, use a `def` statement.\n\
    \nA Good Example:\n```python\ndef f(x): return 2*x\n```\n\nA Bad Example:\n```python\n\
    f = lambda x: 2*x\n```\n\nThe first example shows that the name given to the function\
    \ object is `'f'` rather than the collective `<lambda>`. This is the most useful\
    \ for string representations and for tracebacks and, by using the assignment statement,\
    \ you cut out the one benefit that a lambda expression offers over and above a\
    \ `def` statement – that it may be embedded within a bigger statement.\n\nWhen\
    \ you want to derive exceptions, use `Exception` and not `BaseException`. Inheritance\
    \ from the latter is reserved for those exceptions where it is pretty much always\
    \ wrong to catch them.\n\nWhen you design your exception hierarchies, base them\
    \ on the quality that is likely to be needed by catching exceptions, rather than\
    \ on the location where the exception is raised. Always answer one question –\
    \ “what has gone wrong?” rather than just saying that something is wrong. Use\
    \ the conventions for class naming but do remember to add the “Error” suffix to\
    \ the exception classes that produce an error. There is no need to put any special\
    \ suffixes on exceptions that are not errors and are used as flow-control or another\
    \ form of signaling.\n\n- When you use exception chaining, use it only where needed.\
    \ When you replace an inner exception deliberately, make sure that the right details\
    \ are relocated into the newer exception. Examples of this are making sure the\
    \ name of the attribute is preserved when you convert `KeyError` to `AttributeError`\
    \ or when you embed the original exception text into the message in the newer\
    \ exception.\n\n- When using Python 2 and you raise an exception, always use `raise\
    \ ValueError('message')` instead of `raise ValueError ‘message’`. This is because\
    \ the second example is neither valid nor legal syntax for Python 3. Also, the\
    \ use of the containing parentheses means that there is no requirement to use\
    \ continuation characters on a line when you add string formatting or when an\
    \ exception argument is too long.\n\n- When you catch exceptions, always mention\
    \ specific ones wherever you can rather than using the bare `except:` clause.\n\
    \nFor Example:\n```python\ntry:\n    import platform_specific_module\nexcept ImportError:\n\
    \    platform_specific_module = None\n```\n\n`KeyboardInterrupt` and `SystemExit`\
    \ exceptions will be caught by a bare `except:` clause and this makes it much\
    \ more difficult to interrupt programs using `CTRL+C` and they can also cover\
    \ up other problems that may be there.\n\nIf you are looking to catch every exception\
    \ that signals errors in the program, use `except Exception:`. A general rule\
    \ is to only use the bare `except:` clause in one of these cases:\n1. If the traceback\
    \ is printed that way, the user will be aware of.\n2. If cleanup work is needed\
