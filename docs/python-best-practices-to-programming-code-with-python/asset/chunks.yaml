  trans: "\n\n现在，这两个函数看起来完全一样，仅仅是因为 `lookup_set` 利用了 Python 集合（sets）是哈希表这一事实。然而，每个示例中\
    \ `lookup` 的性能是不同的。为了判断一个特定项目是否包含在列表中，Python 必须搜索每一个项目，直到找到匹配的项为止。这需要时间，特别是当你的列表很长时。使用集合，每个项目都有一个哈希值，它能告诉\
    \ Python 去哪里里查找匹配的项。这使得即使集合很大，搜索速度也会快得多。你也可以以相同的方式搜索字典。由于性能存在差异，在以下情况下，使用集合或字典比使用列表更好的主意：\n\
    \n* 当集合包含大量项时\n* 当你需要频繁地在集合中查找项时\n* 没有重复项时\n\n对于较小的集合或那些不太可能频繁搜索的集合，建立哈希表所需的额外内存和时间，通常会超过你通过提高搜索速度所节省的时间。\n\
    \n# 第 5 章：注释\n\n由于你已经有了一些 Python 编程的经验，你会知道注释在程序运行时是不可见的。注释的作用是帮助编码员和其他阅读代码的人理解做了什么以及为什么要这样做。现在，有些人认为，因为注释是不可见的，所以没必要写它们；而另一些人写的注释毫无意义且与他们的代码矛盾。我必须告诉你，在这者之间，拥有一个矛盾的注释比完全不写要糟糕得多，因此，每当你对代码进行更改时，都必须确保更新你的注释。\n\
    \n当你写一条注释时，确保它是一个带有正确结尾的完整句子。正如你写任何内容一样，你的注释（无论是句子还是短语）必须大写字母开头。该规则的唯一例外是它是以小字母开头的标识符——这里的黄金法则是你**永远不要**改变标识符的大小写！\n\
    \n如果你使用短注释，可以省略结尾的句号。如果你在写块注释，这些注释通常由至少一段组成，有时更多，且每一段都由完整的句子组成。这些句子中的每一个都必须有一个句号。每个句号后面应该有\
    \ 2 个空格，且所有注释都应该用英文编写。唯一的例外是你 200% 确定你的代码永远不会被不通或不读你母语言的人阅读。\n\n## 块注释\n\n块注释倾向于适用于其后的部分或全部代码。注释的缩进方式必须与它所引的代码完全一致，且每个块的每一行必须以一个\
    \ `#` 和一个空格开头。唯一的例外是你是在注释内部使用了缩进文本。每个块注释中的所有段落必须用一个包含一个 `#` 的行隔开。\n\n## 行内注释\n\
    \n这些应该尽可能少地使用。作为回顾，行内注释是放置在语句同一行的注释。行内注释必须与语句之间至少有两个空格隔开，并且它们必须以一个 `#` 和一个空格开头。\n\
    \n诚实地说，你应该避免使用行内注释，因为它们并不是真正必要的，并且可能会引起意外的干扰。\n\n例如，你永远不要这样做：\n\n```python\nx\
