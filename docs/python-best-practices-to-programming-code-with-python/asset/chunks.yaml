    # 第 7 章：方法和函数参数


    对于任何实例方法的第一个参数，始终使用 `self`；对于任何类方法的第一个参数，始终使用 `cls`。


    如果一个函数的参数名与某个保留关键字相同，那么最好在末尾添加一个下划线，这比使用错误的拼写或缩写要好。因此，你应该使用 `class_` 而不是 `clss`。也许比引起冲突更好的方法是使用同义词。


    ## 函数参数


    有 4 种向函数传递参数的方法：


    1. **位置参数（Positional Argument）** – 这些是强制性的，且不包含任何默认值。位置参数是最简单的参数形式，用于作为函数含义完整组成部分的参数；它们还具有自然顺序，因此，在下面的示例中，函数
    `user` 应该很容易记住这两个函数需要 2 个参数，并且它们应该记住顺序：


    `Send(message, recipient)` 和 `point(x, y)`


    在这两种情况下，你可以在调用函数时使用参数名，通过这样做，你可以更改参数的顺序。例如，你可以调用 `send(recipient=''world'', message=''Hello'')`
    和 `point(y=2, x=1)`。然而，正如你所看到的，这并不非常可读，而且里面的单词远超我们的需要。将该版本与更直观的版本——`send(''Hello'',
    ''World'')` 和 `point(1,2)` 进行比较，你可以立即看出可读性的差异。


    2. **关键字参数（Keyword Argument）** – 这些参数包含默认值，且不是强制性的。关键字参数有时用于发送到函数的可选参数。当一个函数包含至少
    2 或 3 个（最好更多）位置参数时，很容易被记住。使用带有默认值的关键字参数会更有帮助。例如，你可以定义一个完整的 `send` 函数为 `send(message,
    to, cc=None, bcc=None)`。`cc` 和 `bcc` 的使用是可选的，如果给它们赋予其他值，它们的值都为 `None`。


    在 Python 中，有几种方法可以使用关键字参数调用函数。例如，你可以遵循定义中的参数顺序，而不显式地命名这些参数；例如，`send(''Hello'',
    ''World'', ''Galactus'', ''God'')`。在这里，你正在向 Galactus 发送消息的抄送，并向 God 发送盲抄。你也可以以不同的顺序命名参数，例如，`send(''Helloagain'',
    ''World'', bcc=''God'', cc=''Galactus'')`。除非你有非常充分的理由不尽可能遵循正确的语法，否则这两个示例最好被避免；它们既冗长又不可可读。最好的方法，即最接近函数定义的方法，是
    `send(''Hello'', ''World'', cc=''Galactus'', bcc=''God'')`。


    3. **任意参数列表（Arbitrary Argument List）** - 这是向函数传递参数的另一种方法。有时，函数的意图通过具有数量位置参数的签名来表达更好，这个数量是可以扩展的。在这种情况下，最好使用
    `*args` 结构来定义它。在参数体中，`args` 是所有剩余位置参数的元组。例如，你可以使用 `send(message, *args)` 并将所有接收者列为单独参数：`send(''Hello'',
    ''Galactus'', ''Dad'', ''God'')` —— 在函数体内，`args` 等于 `(''Galactus'', ''Dad'', ''God'')`。


    然而，你应该非常谨慎地使用这种结构，因为它确实有一些缺点。如果向函数发送了一个包含具有相同或相似性质参数的列表，更好的定义是一个带有单个参数的函数；该单个参数将是一个序列或列表。例如，如果
    `send` 有几个接收者，你使用显式定义更好：`send(''Hello'', ''God'', ''Dad'', ''Galactus'')`，然后通过
    `send(''Hello'', [''God'', ''Dad'', ''Galactus''])` 来调用它。这样，函数用户可以提前更改接收者列表，这为传递任何无法解包的序列提供了可能，包括迭代器。


    4. **任意关键字参数字典（Arbitrary Keyword Argument Dictionary）** - 这是向函数传递参数的最后方法。如果函数需要一个未知的命名参数数组，你可以使用
    `**kwargs` 结构。在函数体内，`**kwargs` 是一个字典，包含了所有传递且未被函数签名中另一个关键字参数捕获的命名参数。


    然而，你应该采取像对待任意参数列表时那样的谨慎程度，因为原因几乎相同。这些是强大的技术，只有当你证明有必要使用它们时才应该使用。如果有更清晰、更简单的结构可以完成工作，绝对不应该使用它们。


    这完全取决于你，程序员，决定哪些函数参数是可选关键字，哪些是位置参数，并决定是否应该使用更高级的技术来传递参数。


    保持简单并遵循这些编写 Python 函数的规则：


    * 是可读的 – 名称和参数不需要任何解释

    * 易于更改 – 你可以添加关键字参数而不会破坏其他代码。


    # 第 8 章：命名规范


    老实说，Python 的命名规范像是一团糟，所以我们永远无法做到完全一致。然而，有一些推荐的命名标准，所有新的包和模块（包括任何第三方框架）必须遵循这些标准。尽管如此，要学习最重要的原则是，当你使用可见
    API 名称时，必须使用反映其使用的规范，而不是其实现。


    ## 描述性


    有许多不同的命名样式，因此识别在使用哪种样式是有帮助的。以下是区分常用的命名样式：


    * `B` – 单字母大写

    * `b` – 单字母小写

    * `lowercase_with_underscores`

    * `lowercase`

    * `UPPERCASE_WITH_UNDERSCORES`

    * `UPPERCASE`

    * `CapitalizedWords` – 通常称为 CamelCase，因为字母看起来像

    * `mixedCase` – 与 CamelCase 不同，因为首字母是小写

    * `Capital_Words_With_Underscore` – 不是一种漂亮的样式！

    * 在 CamelCase 中使用缩写时，你应该确保所有的缩写字母都大写。例如，与其使用 `HttpServerError`，不如使用 `HTTPSError`。


    还可以使用另一种样式，即放置一个唯一的前缀（短的），将一组相关的名称放在一起。这在 Python 中并不常用，但我提到它是为了让你知道它的存在。一个例子是
    `os.stat()` 函数 —— 它将返回一个元组，其中包含的项目如 `st_size`, `st_mode`, `st_mtime` 等。


    这些是一些使用末尾下划线或前导下划线的形式，通常可以与任何大小规范结合：


    * `_one_leading_underscore` – 这通常是“内部使用”的指示，但并不强。

    * `One_trailing_underscore_` – 通常用于防止与 Python 关键字冲突，例如：`tkinter.Toplevel(master,
    class_=''ClassName'')`

