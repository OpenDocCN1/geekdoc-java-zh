    \n## Indentation and Alignment\n\nEvery indent level should be 4 spaces.\n\nWhen\
    \ you use continuation lines, they should align the wrapped elements using one\
    \ of two methods:\n\n*   Vertically with the Python implicit way of joining lines\
    \ inside braces, brackets, and parentheses, or\n\n*   With hanging indents\n\n\
    When you use a hanging indent, consider that there shouldn’t be any arguments\
    \ on line one and that, to mark the continuation line, indentation must be used.\n\
    \nConsider the following examples:\n\nThe Right Way:\n\n# Aligned with an opening\
    \ delimiter.\n\nfoo = long_function_name(var_four, var_three,\n\n                        \
    \ var_two, var_one)\n\n# and some more indentation included so this is distinguished\
    \ from the rest of the code\n\ndef long_function_name(\n\n        var_four, var_three,\
    \ var_two,\n\n        var_one):\n\n    print(var_four)\n\n# Hanging indents should\
    \ be used to add a level.\n\nfoo = long_function_name(\n\n    var_four, var_three,\n\
    \n    var_two, var_one)\n\nThe Wrong Way:\n\n# Arguments on first line are forbidden\
    \ when you are not using vertical alignment.\n\nfoo = long_function_name(var_four,\
    \ var_three,\n\n    var_two, var_one)\n\n# More indentation is required as the\
    \ indentation is not distinguishable from the rest.\n\ndef long_function_name(\n\
    \n    var_four, var_three, var_two,\n\n    var_one):\n\n    print(var_four)\n\n\
    When it comes to continuation lines, the rule on 4 indent spaces is optional:\n\
    \n# it is possible for hanging indents *to* be indented to more or less than 4\
    \ spaces.\n\nfoo = long_function_name(\n\n  var_four, var_three,\n\n  var_two,\
    \ var_one)\n\nWhen you use an if-statement with a long condition that can be written\
    \ over more than one line, note that there is an easy to create a natural indent\
    \ of 4 spaces for the rest of the lines in the conditional – use a keyword of\
    \ 2 characters (for example, if) along with one space and an opening parenthesis.\
    \ However, visually, this can look like some kind of incompatibility with the\
    \ indented code within the if-statement, which will already have a 4-space indent.\
    \ There is no real position on whether to distinguish these conditional lines\
    \ from the code inside the nest but there are a few acceptable options you can\
    \ use, including but not limited to:\n\n# No extra indentation used.\n\nif (this_is_one_thing\
    \ and\n\n    that_is_something_else):\n\n    do_this()\n\n# Add a comment, which\
    \ will provide some help in the editors\n\n# supporting highlighting of syntax.\n\
    \nif (this_is_one_thing and\n\n    that_is_something_else):\n\n    # as both conditions\
    \ are true, we can tweak.\n\n    do_this()\n\n# Add more indentation to the conditional\
    \ continuation line.\n\nif (this_is_one_thing\n\n        and that_is_something_else):\n\
    \n    do_this()\n\nNow, when you have a construction of multiple lines, the closing\
    \ brace, parentheses, or bracket can line up in one of two places – either beneath\
    \ the beginning character that is NOT a white space on the end line of the list:\n\
    \nmy_list = [\n\n    6, 5, 4,\n\n    3, 2, 1,\n\n    ]\n\nresult = a_function_that_will_take_arguments(\n\
    \n    'f', 'e', 'd',\n\n    'c', 'b', 'a',\n\n    )\n\nOr it can be lined up beneath\
    \ the beginning character of the first line in the multiple line construction:\n\
    \nmy_list = [\n\n    6, 5, 4,\n\n    3, 2, 1,\n\n]\n\nresult = a_function_that_will_take_arguments(\n\
    \n    'f', 'e', 'd',\n\n    'c', 'b', 'a',\n\n)\n\nChapter 4:\n\nIdioms\n\nProgramming\
    \ idioms are, in simple terms, the way in which Python code should be written.\
    \ We often refer to idiomatic code as Pythonic code and, although there tends\
    \ to be one very obvious way to write something, the actual way in which Pythonic\
    \ code is written can be a bit obscure to those who are new to Python. So, you\
    \ need to learn good idioms and some of the more common ones are:\n\nUnpacking\n\
    \nProvided you know how long a tuple or list is, unpacking allows you to give\
    \ each element a name. For example,enumerate()  gives us a tuple with 2 elements\
    \ for each of the items in the list:\n\nfor the index, each item in enumerate(this_list):\n\
    \n    # do something with the index and each item\n\nYou can also use unpacking\
    \ to swap the variables:\n\nb, a = a, b\n\nAnd you can use nested unpacking:\n\
    \nc, (b, a) = 3, (2, 1)\n\nWhen Python 3 was implemented, it came with a new extended\
    \ unpacking method:\n\nc *the_rest = [3, 2, 1]\n\n# c = 3, the_rest = [2, 1]\n\
    \nc, *the_middle, c = [4, 3, 2, 1]\n\n# c = 4, the_middle = [3, 2], c = 1\n\n\
    ## Creating Ignored Variables\n\nIf you wanted to assign something but do not\
    \ need to use the variable, you would use __. For example:\n\nfilename = 'footbar.txt'\n\
    \nbasename, __, ext = filename.rpartition('.')\n\nNOTE\n\nYou will often see it\
    \ recommended that you use a single underscore (_) for variables that are throwaway,\
    \ rather than using a double underscore(__). The problem with this is, “-“, the\
    \ single underscore, tends to be used in thegettext()  function as an alias. It\
    \ is also used to store the value of the previous operation at the interactive\
    \ prompt. When you use a double underscore, “__”, it is clear and it is convenient.\
    \ It also cuts out the accidental risk of interfering with the other use cases\
    \ of the single underscore.\n\n## Creating Length-N Lists\n\nTo create a length-N\
    \ list that is of the same thing, you would use the * list operator\n\nfour_zeros\
    \ = [Zero] * 4\n\nTo create a length-N list of a list you should not use the *\
    \ operator. That operator creates lists of N that refer to the same list and that\
    \ is not what we want here. Instead, we use a list comprehension:\n\nfour_lists\
    \ = [[] for __ in xrange(4)]\n\nNote – If you are using Python 3, use range()\
    \ and not xrange()\n\n## Creating Strings from Lists\n\nThe most common idiom\
    \ for creating strings is str.join() on empty strings:\n\nletters = [‘c’, ‘l’,\
    \ o, 't']\n\nword = ''.join(letters)\n\nThis sets a value of “clot” to the variable\
    \ word. You can apply this idiom to tuples and lists.\n\n## Searching a Collection\
    \ for an Item\n\nOn occasion, you will need to search a collection for a specific\
    \ option and there are two ways to do this – using lists or sets\n\nLook at this\
    \ example:\n\ns = set(['c', 'l', 'o', 't'])\n\nl = ['c', 'l', 'o', 't']\n\ndef\
    \ lookup_set(s):\n\n    return 's' in s\n\ndef lookup_list(l):\n\n    return 's'\
    \ in l"
