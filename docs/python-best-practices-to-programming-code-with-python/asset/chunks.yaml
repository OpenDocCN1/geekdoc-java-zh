    *   `two_leading_and_two_trailing_underscores` 是属性或“魔法”对象，存在于用户控制的命名空间中。例如：`__init__`、`__file__`
    或 `__import__`。


    ## 规范性


    这些是你应该避免使用的名称：


    在编写单字符变量名时，永远不要使用 `O`（大写字母）、`l`（小写 L）或 `I`（大写 i）。取决于你所使用的字体，这些字符可能与数字 `0` 和 `1`
    混淆——如果你发现自己想用 `l`，请改用大写的 `L`。


    ## 模块和包的命名


    所有的模块名称都应该是简短且全小写的。你 可以在模块名中使用下划线，但仅当它能提高可读性时才。Python 包也是如此——使用简短且全小写的名称——但不要使用下划线。


    当你有一个用 C 或 C++ 编写的扩展模块，并且它配有一个具有面向对象接口的 Python 模块时，C 或 C++ 模块将以下划线开头，例如 `_socket`。


    ## 类名


    类名通常使用 CapWords（大驼峰法）或 CamelCase（驼峰法）约定。


    内置名称有它们单独的约定，通常是一个单词或两个单词合并为一个，例如 `Hello` 或 `HelloWorld`。CamelCase 约定倾向于用于内置常量和异常名称。


    ## 类型变量


    类型变量的名称通常使用 CamelCase，并且优于使用短名称，例如 `Num`、`AnyStr`。你应该为变量添加后缀（`_co` 或 `_contra`）来声明反变或协变行为。例如：


    ```python

    Import TypeVar

    ```


    ```python

    VT_co = TypeVar(''VT_co'', covariant=True)

    KT_contra = TypeVar(''KT_contra'', contravariant=True)

    ```


    ## 异常命名


    异常是类，因此你应该使用类的命名约定进行命名。尽管如此，如果异常是一个错误，请确保在名称中使用 `Error` 后缀。


    ## 全局变量


    只要变量在单个模块内部使用，其命名规范与函数命名规范相同。


    ## 函数


    所有函数名均为小写，并在需要提高可读性的地方用下划线分隔单词。mixedCase 约定仅在已以此风格的语境中使用，以保持向后兼容性。


    ## 实例变量和方法名


    同样，函数的命名规范也适用于这里——使用小写并间歇使用下划线。如果你正在使用实例变量或非公共方法，应该使用单个前缀下划线。为了防止名称与子类冲突，应该使用两个前缀下划线，以触发
    Python 中的名称修饰（name mangling）规则。


    当这些规则被触发时，名称会与类名进行修改。例如，`class Foo` 包含一个名为 `__a` 的属性。无法通过 `Foo.__a` 访问它。按照规则，只有当名称可能与设计为子类的类属性发生冲突时，才使用双前缀下划线。


    ## 常量


    这些通常定义在模块级，且全大写并用下划线分隔，例如 `MAX_OVERFLOW`。


    ## 继承设计


    必须遵守的规则之一是确定实例变量或类方法是非公开的公共的。如果你无法决定，请选择非公开，因为你可以以后轻松将其改为公共，而将公共改为非公开并不那么容易。


    公共属性是指与类无关的客户端会使用的属性，而非公开属性是不供第三方使用的。对于公共属性，你保证了从开始到结束的向后兼容；而对于非公开属性，你不需要，并且可以移除或更改该属性。注意，不使用“私有”一词，这是因为
    Python 语言中没有真正的私有属性。


    另一个属性类别是保护属性（protected attribute）。在 Python 中，它们属于子类 API。有些类专门设计为供继承的，无论是为了扩展还是修改某些行为方面。当你设计这样的类时，务必确保对属性做出显式决策——它们是公共的、仅供基类使用的，还是属于子类
    API？


    结合以上所有点，这些是 Pythonic 的准则：


    *   公共属性不能有前缀下划线。

    *   如果公共属性与关键字（保留字）冲突，请在属性名称末尾添加一个下划线。这是比使用拼写错误或缩写更优的方法。

    *   对于公共数据属性，最好的方法是只暴露属性名称，而不使用任何复杂的修改器（mutator）或访问器（accessor）方法。如果简单的属性需要扩展其功能行为，Python
    可以轻松实现。

    *   如果你正在使用一个将被子类的类，并且你也使用了不会被子类的属性，考虑添加 2 个前缀下划线，但不要添加任何末尾下划线。这将触发名称修饰，并有助于降低子类具有相同名称属性时发生冲突的风险。


    ## 第 9 章：在语句和表达式中使用空格


    首先，一些关于空格令人不悦的点：


    在以下情况下不要使用不必要的空格：


    *   紧邻大括号、中括号或圆括号内部


    良好的示例：

    ```python

    ham(spam[1], {eggs: 2})

    ```


    错误的示例：

    ```python

    ham( spam[ 1 ], { eggs: 2 } )

    ```


    *   在冒号、分号或逗号之前


    良好的示例：

    ```python

    if x == 4:

    ```


    错误的示例：

    ```python

    if x == 4 :

    ```


    然而，在切片（slice）中，冒号类似于运算符，应该在两侧都包含等的空格。例外是省略的切片。


    良好的示例：

    ```python

    spam[1:8], ham[1:2]

    ```


    错误的示例：

    ```python

    spam[1 : 8], ham[1 : 2]

    ```


    `spam[lower:upper]`


    ```python

    spam[: upper]

    ```


    *   在函数调用参数列表起始圆括号前


    良好的示例：

    ```python

    ham(1)

    ```


    错误的示例：

    ```python

    ham (1)

    ```


    *   在切片或索引的起始圆括号前


    良好的示例：

    ```python

    dct[''key''] = lst[index]

    ```


    错误的示例：

    ```python

    dct [''key''] = lst [index]

    ```


    *   当运算符（如赋值）周围有多个空格以与其他运算符对齐


    良好的示例：

    ```python

    x = 1

    y = 2

    long_variable = 3

    ```


    错误的示例：

    ```python

    x         = 1

    y         = 2

    long_variable = 3

    ```


    ## 其他建议


    在代码中处避免行尾空格，因为它是不可见的且会引起混淆。例如，如果你放了一个反斜杠并跟着一个空格然后换行——这不会被视为行延续符。事实上，某些文本编辑器不会保留它，并且某些项目包含的提交钩子会直接拒绝它——其中之一就是
    CPython。


    以下二元运算符应该被单个空格包围——两侧各一个


    *   赋值 (`=`)

    *   复合赋值 (`+=`, `-=` 等）


    以下比较运算符的处理方式相同：


    *   `==`

    *   `<`

    *   `>`

    *   `!=`

    *   `<>`

    *   `<=`

    *   `>=`

    *   `in`

    *   `not in`

    *   `is`

    *   `is not`


    以及这些布尔值：


    *   `and`

    *   `or`

    *   `not`


