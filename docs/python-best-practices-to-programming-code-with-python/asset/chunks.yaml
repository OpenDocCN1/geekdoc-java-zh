    have a type that is false in the Boolean context.


    *   Rather than using the operatornot…is, you should useis not. While they both
    are identical in terms of function, the first is low on the readability scale,
    making the second one more preferable. An example:


    Use This:


    if foo is not None:


    Don’t Use This:


    if not foo is None


    *   When you implement an ordering operation with a rich comparison, you should
    implement all of the 6 operations instead of relying on some other code to exercise
    a comparison. Those operations are(__eq__, __lt__, __ne__, __ge__, __gt__, __le__)


    To cut down on the effort needed, one particular decorator helps to generate any
    comparison methods that are missing. That decorator isfunctools.total_ordering().


    The style guidelines indicate that Python assumes reflexivity rules. As such,
    the Python interpreter might change things about by swappingy > x with x < y , or
    it may swapy >= x with x <= y . 


    You may also find that the argumentx == y has been swapped withx != y .  Themin()andsort()  operations
    will also definitely use the < operator and themax()  function will use the >operator.
    However, you should, as a best practice guide, use all of them so that there is
    no confusion.


    *   Rather than using an assignment statement that will bind a lambda expression
    to an identifier, use adef statement


    A Good Example:


    def f(x): return 2*x


    A Bad Example:


    f = lambda x: 2*x


    The first example shows that the name given to the function object is ‘f’ rather
    than the collective <lambda>. This is the most useful for string representations
    and for tracebacks and, by using the assignment statement, you cut out the one
    benefit that a lambda expression offers over and above a def statement – that
    it may be embedded within a bigger statement.


    When you want to derive exceptions, use Exception and not BaseException. Inheritance
    from the latter is reserved for those exceptions where it is pretty much always
    wrong to catch them


    When you design your exception hierarchies, base them on the quality that is likely
    to be needed by catching exceptions, rather than on the location where the exception
    is raised. Always answer one question – “what has gone wrong?” rather than just
    saying that something is wrong. Use the conventions for class naming but do remember
    to add the “Error” suffix to the exception classes that produce an error.


    There is no need to put any special suffixes on exceptions that are not errors
    and are used as flow-control or another form of signaling.


    *   When you use exception chaining, use it only where needed.


    When you replace an inner exception deliberately, make sure that the right details
    are relocated into the newer exception. Examples of this are making sure the name
    of the attribute is preserved when you convertKeyErrorto  Attribute Erroror when
    you embed the original exception text into the message in the newer exception


    *   When using Python 2 and you raise an exception, always use theraise ValueError)’message’)instead
    of  raise ValueError ‘message’


    This is because the second example is neither valid nor legal syntax for Python
    3\. Also, the use of the containing parentheses means that there is no requirement
    to use continuation characters on a line when you add string formatting or when
    an exception argument is too long.


    *   When you catch exceptions, always mention specific ones wherever you can rather
    than using the bare except: clause


    For Example:


    try:


        import platform_specific_module


    except ImportError:


        platform_specific_module = None


    KeyboardInterruptand  SystemExitexceptions will be caught by a bare except: clause
    and this makes it much more difficult to interrupt programs using CTRL+C and they
    can also cover up other problems that may be there.


    If you are looking to catch every exception that signals errors in the program,
    use except Exception:


    A general rule is to only use the bare except: clause in one of these two cases:


    1.  If the traceback is being printed by the exception handler; that way, the
    user will be made aware of any errors


    2.  If cleanup work is needed but the code allows the exception to propagate up
    using raise. A more efficient way to do this would be to usetry…finally.


    When you are binding a caught exception to a name, use the explicit binding syntax
    from Python 2.6:


    try:


        process_data()


    except Exception as exc:


        raise DataProcessingFailedError(str(exc))


    This is the ONLY syntax that Python 3 supports and it cuts out any problems of
    ambiguity that are associated with the older-style syntax that is comma-based.


    *   When you are catching system errors, use the exception hierarchy from Python
    3.3 rather than errno values. As well, when you use any try/except clause, try
    to limit the use of the try clause to the least amount of code. This will cut
    down the risk of errors being hidden


    A Good Example:


    try:


        value = collection[key]


    except KeyError:


        return key_not_found(key)


    else:


        return handle_value(value)


    A Bad Example:


    try:


        # Too broad!


        return handle_value(collection[key])


    except KeyError:


        # Will catch a KeyError that is raised by handle_value()


        return key_not_found(key)


    *   When you use a resource tool that is local to a specific code section, use
    it with a statement to make sure that it is cleaned immediately after use. You
    can also use a try/finally statement


    *   Always invoke a context manager through separate methods or functions whenever
    they are for a purpose other than getting and releasing resources.


    A Good Example:


    with conn.start_transaction():


        do_something_in_transaction(conn)


    A Bad Example:


    with conn:


        do_something_in_transaction(conn)


    The second example does not give us any information that indicates whether the
    __enter__ and __exit__ methods do anything other than shutting the transaction.
    In this case, it is important to be explicit.


    *   Consistency in return statements is important. Either all of the function
    return statements or none of the return statements should return an expression
    or value. If a return statement does return an expression, any that do not return
    any value should state explicitly that the return is None and there should be
    a return statement at the end of that function


    A Good Example:


    def foo(x):


        if x >= 0:


            return math.sqrt(x)


        else:


            return None


    def bar(x):


        if x < 0:


            return None


        return math.sqrt(x)


    A Bad Example:


    def foo(x):


        if x >= 0:


            return math.sqrt(x)'
