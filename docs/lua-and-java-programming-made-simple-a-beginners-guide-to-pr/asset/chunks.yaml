- fmt: "\n## 10.3 Object-Relational Mapping (ORM)\n\nObject-Relational Mapping (ORM)\
    \ frameworks, such as `Hibernate`, `JPA` (Java Persistence API), and `MyBatis`,\
    \ provide higher-level abstractions for database interaction in Java. ORM frameworks\
    \ map Java objects to database tables, abstracting the complexities of SQL queries\
    \ and database-specific operations.\n\nORM frameworks offer features like automatic\
    \ mapping, query generation, caching, and transaction management, simplifying\
    \ the development of database-driven applications.\n\nExample using `Hibernate`:\n\
    \n```java\n@Entity\n@Table(name = \"users\")\npublic class User {\n    @Id\n \
    \   @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\
    \    @Column(name = \"name\")\n    private String name;\n    // Getters and setters\n\
    }\n\n// Usage\nSession session = HibernateUtil.getSessionFactory().openSession();\n\
    Transaction transaction = session.beginTransaction();\nUser user = new User();\n\
    user.setName(\"John Doe\");\nsession.save(user);\ntransaction.commit();\nsession.close();\n\
    ```\n\nIn this example, we define a `User` entity class annotated with `Hibernate`\
    \ annotations. We create a new instance of `User`, set its properties, and save\
    \ it to the database using `Hibernate`'s session API.\n\nORM frameworks provide\
    \ a convenient and object-oriented way to interact with databases, abstracting\
    \ the low-level details of `JDBC` and SQL.\n\n## 10.4 Transaction Management\n\
    \nTransaction management is an essential aspect of database interaction. A transaction\
    \ is a logical unit of work that consists of multiple database operations, such\
    \ as inserts, updates, and deletes. Transactions ensure data integrity and consistency\
    \ by grouping related database operations and enforcing the ACID (Atomicity, Consistency,\
    \ Isolation, Durability) properties.\n\nIn Java, we can manage transactions using\
    \ `JDBC`'s `Connection` interface or with the help of ORM frameworks like `Hibernate`,\
    \ which provide higher-level abstractions for transaction management.\n\nExample\
    \ using `JDBC`:\n\n```java\nConnection connection = DriverManager.getConnection(url,\
    \ username, password);\nconnection.setAutoCommit(false);\ntry {\n    // Perform\
    \ database operations\n    // ...\n    // Commit the transaction\n    connection.commit();\n\
    } catch (SQLException e) {\n    // Rollback the transaction in case of an error\n\
    \    connection.rollback();\n    e.printStackTrace();\n} finally {\n    // Close\
    \ the connection\n    connection.close();\n}\n```\n\nIn this example, we disable\
    \ the auto-commit mode and manually manage the transaction. If an exception occurs\
    \ during the database operations, we rollback the transaction to revert any changes\
    \ made and ensure data consistency.\n\n## 10.5 Data Access Patterns\n\nWhen working\
    \ with databases, it's essential to follow good data access patterns to optimize\
    \ performance and maintain code maintainability. Some common data access patterns\
    \ include:\n\n- Data Access Object (DAO): The `DAO` pattern separates the data\
    \ access logic from the business logic of an application. It provides a consistent\
    \ interface for performing CRUD (Create, Read, Update, Delete) operations on a\
    \ specific entity.\n- Repository: The repository pattern abstracts the data storage\
    \ and retrieval operations for a specific domain entity. It provides a higher-level\
    \ API for querying and manipulating data without exposing the underlying database\
    \ details.\n- Query Builder: The query builder pattern offers a fluent and programmatic\
    \ way to construct SQL queries. It allows for dynamic query generation based on\
    \ runtime conditions and facilitates code reusability.\n\nBy following these patterns,\
    \ we can write cleaner and more maintainable database code.\n\nIn this chapter,\
    \ we explored the fundamentals of interacting with databases using Java. We learned\
    \ about `JDBC`, which provides a low-level API for database access, and ORM frameworks\
    \ like `Hibernate`, which offer higher-level abstractions. We also discussed transaction\
    \ management and common data access patterns.\n\nIn the next chapter, we will\
    \ delve into web development with Java and explore how to build web applications\
    \ using popular frameworks and technologies.\n\n# Chapter 11: Web Development\
    \ with Java\n\nIn today's digital age, web development is a crucial skill for\
    \ building interactive and dynamic applications. Java provides a robust ecosystem\
    \ for web development, offering various frameworks and technologies that simplify\
    \ the process. In this chapter, we will explore the world of web development with\
    \ Java.\n\n## 11.1 Introduction to Web Development\n\nWeb development refers to\
    \ the creation of web applications that run on web browsers and interact with\
    \ users. It involves designing, building, and maintaining websites and web-based\
    \ systems. Web development encompasses both the client-side (front-end) and server-side\
    \ (back-end) components of web applications.\n\nClient-side technologies include\
