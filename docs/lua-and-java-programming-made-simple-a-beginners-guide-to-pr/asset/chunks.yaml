    `mathUtils.lua`:


    ```lua


    -- mathUtils.lua


    local M = {}


    function M.add(a, b)


    return a + b


    end


    function M.subtract(a, b)


    return a - b


    end


    return M


    ```


    In the above code snippet, we define a module named `mathUtils` with functions
    `add` and `subtract`. We store the functions in a table `M` and return the table
    at the end.


    To use the module in another Lua file, we need to `require` it. Here''s an example
    of using the `mathUtils` module:


    ```lua


    -- main.lua


    local mathUtils = require("mathUtils")


    local sum = mathUtils.add(5, 3)


    print(sum)  -- Output: 8


    local difference = mathUtils.subtract(10, 7)


    print(difference)  -- Output: 3


    ```


    In the above code snippet, we require the `mathUtils` module and use its functions
