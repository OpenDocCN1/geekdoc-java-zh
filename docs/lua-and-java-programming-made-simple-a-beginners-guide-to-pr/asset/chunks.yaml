    ` and `subtract` to perform mathematical operations.


    ### Wrapping Up


    In this chapter, we explored functions and modules in Lua. Functions allow us
    to encapsulate code into reusable blocks, accept parameters, and return values.
    Modules provide a way to organize related functions and variables into separate
    files, promoting code reusability and encapsulation.


    # Chapter 6: Tables and Metatables


    In this chapter, we will explore tables and metatables in Lua. Tables are a versatile
    data structure that allows you to store and organize related data, while metatables
    provide a way to customize the behavior of tables. Understanding tables and metatables
    is essential for working with complex data structures and creating powerful abstractions
    in Lua. Let''s dive in!


    ## ### Tables in Lua


    Tables in Lua are the primary data structure for storing and organizing data.
    They can be used as arrays, dictionaries, or even a combination of both. Here''s
    an example of a simple table:


    ```lua


    -- Create a table


    local fruits = {"apple", "banana", "orange"}


    -- Access elements


    print(fruits[1])  -- Output: apple


    print(fruits[2])  -- Output: banana


    print(fruits[3])  -- Output: orange


    ```


    In the above code snippet, we create a table named `fruits` that contains three
    elements. We can access individual elements using square brackets and the index
    of the element (Lua arrays are 1-indexed).


    Tables in Lua are not limited to storing values of a single data type. They can
    store values of different types, including other tables. Here''s an example:


    ```lua


    -- Create a table with mixed data types


    local person = {


    name = "John Doe",


    age = 25,


    isMale = true,


    hobbies = {"reading", "gaming", "hiking"}


    }


    -- Access elements


    print(person.name)         -- Output: John Doe


    print(person.age)          -- Output: 25


    print(person.isMale)       -- Output: true


    print(person.hobbies[1])   -- Output: reading


    ```


    In the above code snippet, we create a table named `person` with various data
    types as its elements. We can access elements using dot notation for named fields
    and square brackets for array-like fields.


    Lua tables are also highly flexible and allow dynamic manipulation of their structure.
    You can add, remove, or modify elements at runtime. Here''s an example:


    ```lua


    -- Create an empty table


    local myTable = {}


    -- Add elements


    myTable[1] = "Hello"


    myTable[2] = "world"


    -- Modify an element


    myTable[1] = "Hi"


    -- Remove an element


    myTable[2] = nil


    -- Print the table


    for key, value in ipairs(myTable) do


    print(key, value)


    end


    ```


    In the above code snippet, we create an empty table `myTable` and perform various
    operations on it. We add elements, modify an element, and remove an element. Finally,
    we iterate over the table using the `ipairs` iterator and print its key-value
    pairs.


    ## ### Metatables in Lua


    Metatables allow you to customize the behavior of tables. They let you define
    operations such as addition, subtraction, comparison, and more for tables. By
    setting a metatable for a table, you can define how Lua should handle operations
    on that table. Here''s an example:


    ```lua


    -- Create two tables


    local table1 = {10, 20, 30}


    local table2 = {40, 50, 60}


    -- Set a metatable for table1


    local mt = {


    __add = function(left, right)


    local result = {}


    for i = 1, #left do


    result[i] = left[i] + right[i]


    end


    return result


    end


    }


    setmetatable(table1, mt)


    -- Perform addition on the tables


    local sum = table1 + table2


    -- Print the result


    for key, value in


    ipairs(sum) do


    print(key, value)


    end


    ```


    In the above code snippet, we create two tables `table1` and `table2`. We set
    a metatable `mt` for `table1` that defines the addition operation `__add` for
    tables. The addition operation performs element-wise addition on the two tables
    and returns the result.


    By using the `setmetatable` function, we associate the metatable with `table1`.
    Subsequently, when we perform the addition `table1 + table2`, Lua uses the defined
    addition operation from the metatable.


    ### Wrapping Up


    In this chapter, we explored tables and metatables in Lua. Tables provide a flexible
    and versatile data structure for storing and organizing data. They can be used
    as arrays or dictionaries, and their structure can be dynamically modified. Metatables
    allow us to customize the behavior of tables, defining operations and behavior
    for specific table operations.


    # Chapter 7: Strings and Pattern Matching


    In this chapter, we will explore strings and pattern matching in Lua. Strings
    are a fundamental data type that represents sequences of characters, while pattern
    matching provides a powerful mechanism for searching and manipulating strings
    using patterns. Understanding strings and pattern matching is crucial for working
    with textual data in Lua. Let''s dive in!


    ## ### Strings in Lua


    Strings in Lua are used to represent and manipulate textual data. They can be
    enclosed in single quotes `''like this''` or double quotes `"like this"`. Here''s
    an example of a simple string:


    ```lua


    -- Create a string


    local message = "Hello, world!"


    -- Access characters


    print(message:sub(1, 5))  -- Output: Hello


    print(message:sub(-6))    -- Output: world!


    ```


    In the above code snippet, we create a string named `message` that contains the
    text "Hello, world!". We can access individual characters of a string using the
    `sub` function, which takes the start and end indices as arguments. Negative indices
    count from the end of the string.


    Lua strings are immutable, which means they cannot be modified directly. However,
    you can create new strings by concatenating or modifying existing ones. Here''s
    an example:


    ```lua


    -- Concatenate strings


    local name = "John"


    local greeting = "Hello, " .. name .. "!"


    print(greeting)  -- Output: Hello, John!


    ```


    In the above code snippet, we concatenate the strings "Hello, ", the value of
    the `name` variable, and the exclamation mark. The result is a new string assigned
    to the `greeting` variable.


    ## ### Pattern Matching in Lua


    Pattern matching in Lua allows you to search and manipulate strings using patterns.
    Patterns are sequences of characters that represent a set of strings or a specific
    string format. Lua provides the `string.match` function to perform pattern matching.
    Here''s an example:


    ```lua


    -- Perform pattern matching


    local email = "john.doe@example.com"


    local username = string.match(email, "([^@]+)")


    print(username)  -- Output: john.doe


    ```


    In the above code snippet, we extract the username from an email address using
    pattern matching. The pattern `"([^@]+)"` matches any sequence of characters that
    is not an `@` symbol.


    Lua patterns can include special characters called pattern modifiers to specify
    matching conditions. Some common pattern modifiers are:


    - `+` matches one or more occurrences of the preceding pattern.


    - `*` matches zero or more occurrences of the preceding pattern.


    - `?` matches zero or one occurrence of the preceding pattern.


    - `%a` matches any alphabetical character.


    - `%d` matches any digit.


    - `%s` matches any whitespace character.'
