    \ condition; increment/decrement) {\n// code to be repeated\n}\n```\n\nExample:\n\
    \n```java\nfor (int i = 1; i <= 5; i++) {\n    System.out.println(\"Count: \"\
    \ + i);\n}\n```\n\nIn the example above, the loop will execute five times, printing\
    \ the count from 1 to 5.\n\n### 3.3.2 while Loop\n\nThe `while` loop is used when\
    \ the number of iterations is not known in advance. It continues executing the\
    \ code block as long as the specified condition is true.\n\nThe syntax of the\
    \ `while` loop is as follows:\n\n```java\nwhile (condition) {\n// code to be repeated\n\
    }\n```\n\nExample:\n\n```java\nint i = 1;\nwhile (i <= 5) {\n    System.out.println(\"\
