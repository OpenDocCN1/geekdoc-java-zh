  trans: "\n`for` 循环用于预先知道迭代次数的情况。它由三部分组成：初始化、条件和递增/递减。\n\n`for` 循环的语法如下：\n\n```java\n\
    for (initialization; condition; increment/decrement) {\n// 需要重复的代码\n}\n```\n\n\
    示例：\n\n```java\nfor (int i = 1; i <= 5; i++) {\n    System.out.println(\"Count:\
    \ \" + i);\n}\n```\n\n在上面的示例中，循环将执行五次，打印从 1 到 5 的计数。\n\n### 3.3.2 while 循环\n\n\
    `while` 循环用于预不知迭代次数的情况。只要指定的条件为真，它就会持续执行代码块。\n\n`while` 循环的语法如下：\n\n```java\n\
    while (condition) {\n// 需要重复的代码\n}\n```\n\n示例：\n\n```java\nint i = 1;\nwhile (i\
    \ <= 5) {\n    System.out.println(\"Count: \" + i);\n    i++;\n}\n```\n\n在上面的示例中，只要条件\
    \ `i <= 5` 为真，循环就会一直执行。它将打印从 1 到 5 的计数。\n\n### 3.3.3 do-while 循环\n\n`do-while`\
    \ 循环类似于 `while` 循环，但它保证在检查条件之前至少执行一次代码块。\n\n`do-while` 循环的语法如下：\n\n```java\ndo\
    \ {\n// 需要重复的代码\n} while (condition);\n```\n\n示例：\n\n```java\nint i = 1;\ndo {\n\
    \    System.out.println(\"Count: \" + i);\n    i++;\n} while (i <= 5);\n```\n\n\
    在上面的示例中，循环至少执行一次，打印从 1 到 5 的计数。\n\n### 3.4 控制流语句：总结\n\n在本章中，我们探索了 Java 中的控制流语句，这些语句使我们能够控制程序的执行流向。我们讨论了两种条件语句：`if-else`\
    \ 和 `switch`。`if-else` 语句允许我们根据条件执行代码，而 `switch` 语句提供了一种根据表达式的值进行多次检查的方法。\n\n\
    我们还涵盖了三种类型的循环语句：`for`、`while` 和 `do-while`。`for` 循环用于预先知道迭代次数的情况，`while` 循环用于次数次数的情况，而\
    \ `do-while` 循环确保代码块至少执行一次。\n\n通过掌握控制流语句，你可以创建更具动态性和交互性的程序，这些程序可以做出决策、重复操作并响应不同的场景。这些语句是你编程工具箱中必不可少的工具，允许你编写更灵活高效的代码。\n\
    \n在下一章中，我们将探索方法的概念，方法是执行特定任务的可重用代码块。准备好学习如何封装功能并创建模块化且组织良好的程序。\n\n# 第 4 章：方法\n\
    \n在之前的章节中，我们学习了变量、数据类型和控制流语句。现在，在第 4 章，我们将深入研究方法的概念。方法是执行特定任务的可重用代码块，允许我们在程序中封装功能。它们实现了代码的模块化、可重用和组织。\n\
    \n### 4.1 方法简介\n\n方法是一组组合在一起的语句，用于执行特定任务。它定义在类中，可以从程序的其他部分调用以执行其功能。方法有助于将复杂问题拆分为较小、易于管理的任务，使代码更具读性和可维护性。\n\
    \n### 4.2 方法签名和语法\n\n方法由两个主要部分组成：方法签名和方法体。\n\n方法签名包含以下元素：\n\n- 返回类型（Return Type）：指定方法返回的值的类型。如果方法不返回值，则使用\
    \ `void` 关键字。\n- 方法名（Method Name）：方法的唯一标识符。\n- 参数（Parameters）：方法的输入值。它们是可选的，并括在括号内。多个参数之间用逗号隔开。\n\
    - 访问修饰符（Access Modifier）：决定方法的可见性（例如，`public`、`private`、`protected`）。\n\n方法声明的语法如下：\n\
    \n```java\naccessModifier returnType methodName(parameters) {\n// 方法体\n}\n```\n\
    \n示例：\n\n```java\npublic void greetUser(String name) {\n    System.out.println(\"\
    Hello, \" + name + \"!\");\n}\n```\n\n在上面的示例中，我们有一个名为 `greetUser` 的方法，其返回类型为 `void`（无返回值）。它接受一个类型为\
    \ `String` 的单个参数 `name`。方法体由一条打印问候信息的语句组成。\n\n### 4.3 调用方法\n\n要执行方法内部的代码，我们需要调用或触发该方法。方法调用允许我们在程序的特定位点使用方法提供的功能。\n\
    \n调用方法时，我们使用以下语法：\n\n```java\nmethodName(arguments);\n```\n\n示例：\n\n```java\n\
    greetUser(\"John\");\n```\n\n在上面的示例中，使用参数 `\"John\"` 调用了 `greetUser` 方法。这将执行方法代码并在控制台打印消息\
    \ \"Hello, John!\"。\n\n### 4.4 方法重载\n\n方法重载允许我们定义多个具有相同名称但不同参数列表的方法。它使我们能够创建执行相似任务但接受不同类型或数量参数的方法。\n\
    \nJava 根据提供的参数确定执行哪种方法。\n\n示例：\n\n```java\npublic int sum(int a, int b) {\n  \
    \  return a + b;\n}\n\npublic double sum(double a, double b) {\n    return a +\
    \ b;\n}\n```\n\n在上面的示例中，我们有两个 `sum` 方法，一个接受 `int` 参数，另一个接受 `double` 参数。\n\n###\
    \ 4.5 从方法返回值\n\n方法可以使用 `return` 语句返回值。方法签名中指定的返回类型指示了方法应该返回值的类型。\n\n要从方法返回值，使用以下语法：\n\
    \n```java\nreturn expression;\n```\n\n示例：\n\n```java\npublic int square(int num)\
    \ {\n    return num * num;\n}\n```\n\n在上面的示例中，`square` 方法接受一个 `int` 参数，通过与其自身相乘返回其平方。\n\
    \n4.6 总结\n\n在本章中，我们探索了方法的概念。我们了解到方法是执行特定任务的可重用代码块，提供了代码的模块化和重用性。方法由方法签名（包括返回类型、方法名、参数和访问修饰符）和方法体（包含定义方法功能的语句）组成。\n\
    \n我们讨论了如何通过使用方法名以及传递任何所需的参数来调用或触发方法。我们还探索了方法重载，它允许定义多个同名但参数不同的方法，增加了方法使用的灵活性。\n\
    \n此外，我们学习了如何使用 `return` 语句从方法返回值。方法签名中指定的返回类型决定了方法应该返回值的类型。通过返回值，方法可以为程序的其他部分提供有用的输出和结果。\n\
    \n方法在构建程序和促进代码重用方面起着至关重要的作用。它们有助于将复杂问题拆分为更小、易于管理的任务，并增强代码的可读性、可维护性和组织性。"
