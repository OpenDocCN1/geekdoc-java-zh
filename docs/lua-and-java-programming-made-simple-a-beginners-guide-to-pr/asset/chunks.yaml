  trans: "\n\n# 第 7 章：异常处理与文件输入输出 (I/O)\n\n在之前的章节中，我们介绍了 Java 编程的基础知识，包括变量、控制流、方法、数组、面向对象编程\
    \ (OOP) 等。现在，在第 7 章，我们将探索两个重要的主题：异常处理和文件输入输出 (I/O)。\n\n## 7.1 异常简介\n\n异常处理是 Java\
    \ 中的一种机制，允许我们处理程序执行过程中可能出现的运行时错误或异常情况。这些异常可能由多种因素引起，例如无效输入、除零错误、未找到文件等。\n\n通过处理异常，我们可以优雅地从错误中恢复，向用户提供有意义错误信息，并防止程序崩溃。Java\
    \ 提供了使用 `try-catch-finally` 块的内置异常处理机制。\n\n## 7.2 try-catch-finally 块\n\n`try-catch-finally`\
    \ 块用于处理 Java 中的异常。`try` 块包含可能抛出异常的代码。`catch` 块用于捕获并处理异常，提供替代的方案。`finally` 块是可选的，用于执行无论是否发生异常都应该运行的代码。\n\
    \n语法：\n\n```java\ntry {\n    // 可能抛出异常的代码\n} catch (ExceptionType1 exception1)\
    \ {\n    // 对 ExceptionType1 的异常处理\n} catch (ExceptionType2 exception2) {\n  \
    \  // 对 ExceptionType2 的异常处理\n} finally {\n    // 始终运行的代码\n}\n```\n\n示例：\n\n```java\n\
    try {\n    // 可能抛出异常的代码\n    int result = divide(10, 0); // 除零错误示例\n} catch (ArithmeticException\
    \ ex) {\n    // 对 ArithmeticException 的异常处理\n    System.out.println(\"An arithmetic\
    \ exception occurred: \" + ex.getMessage());\n} finally {\n    // 始终运行的代码\n  \
    \  System.out.println(\"Inside the finally block.\");\n}\n```\n\n在上面的示例中，`try`\
    \ 块尝试将 `10` 除以 `0`，这将抛出一个 `ArithmeticException`。`catch` 块捕获该异常并通过打印错误信息来处理它。`finally`\
    \ 块无论是否发生异常都会执行。\n\n## 7.3 检异常异常与非检异常\n\n在 Java 中，异常被分为两类：受检异常 (checked exceptions)\
    \ 和非检异常 (unchecked exceptions)。\n\n受检异常是必须在方法签名中使用 `throws` 关键字声明，或使用 `try-catch`\
    \ 块处理的异常。受检异常的示例包括 `IOException`、`SQLException` 和 `ClassNotFoundException`。\n\n\
    非检异常也称为运行时异常，不需要显式声明或捕获。它们是 `RuntimeException` 类的子类。非检异常的示例包括 `ArithmeticException`、`NullPointerException`\
    \ 和 `ArrayIndexOutOfBoundsException`。\n\n处理或声明受检异常对于确保正确的错误处理和维护代码的健壮性非常重要。相反，非检异常可以选择处理。\n\
    \n## 7.4 文件输入输出 (I/O)\n\n文件输入输出 (I/O) 是在计算机系统中读取和写入文件的过程。Java 提供了多个类和方法来执行文件 I/O\
    \ 操作，允许我们创建、读取、写入和操作文件。\n\n涉及文件 I/O 操作的关键类包括 `File`、`FileReader`、`FileWriter`、`BufferedReader`、`BufferedWriter`、`InputStream`、`OutputStream`\
    \ 等。\n\n要从文件中读取数据，我们通常遵循以下步骤：\n\n1. 创建代表文件的 `File` 对象。\n2. 创建 `FileReader` 对象，并将\
    \ `File` 对象作为参数传递。\n3. 将 `FileReader` 对象包装在 `BufferedReader` 对象中以进行高效读取。\n4. 使用\
    \ `BufferedReader` 的 `readLine()` 方法逐行读取文件内容。\n\n示例：\n\n```java\nimport java.io.BufferedReader;\n\
    import java.io.File;\nimport java.io.FileReader;\nimport java.io.IOException;\n\
    \npublic class FileReadingExample {\n    public static void main(String[] args)\
    \ {\n        File file = new File(\"example.txt\"); // 将 \"example.txt\" 替换为实际文件路径\n\
    \        try (FileReader fileReader = new FileReader(file);\n             BufferedReader\
    \ bufferedReader = new BufferedReader(fileReader)) {\n            String line;\n\
    \            while ((line = bufferedReader.readLine()) != null) {\n          \
    \      System.out.println(line);\n            }\n        } catch (IOException\
    \ e) {\n            System.out.println(\"An error occurred while reading the file:\
    \ \" + e.getMessage());\n        }\n    }\n}\n```\n\n在上面的示例中，我们创建了一个代表 \"example.txt\"\
    \ 的 `File` 对象。我们使用 `FileReader` 对象读取文件，并将其包装在 `BufferedReader` 中以便高效读取。然后，我们使用\
    \ `while` 循环通过 `readLine()` 方法读取文件的每一行，直到它返回 `null`（表示文件结束）。每行都会被打印到控制台上。\n\n\
    要向文件中写入数据，我们遵循类似的步骤：\n\n1. 创建代表文件的 `File` 对象。\n2. 创建 `FileWriter` 对象，并将 `File`\
    \ 对象作为参数传递。\n3. 将 `FileWriter` 对象包装在 `BufferedWriter` 对象中以进行高效写入。\n4. 使用 `BufferedWriter`\
