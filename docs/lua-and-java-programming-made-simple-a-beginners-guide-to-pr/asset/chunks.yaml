    \nLua 提供了一个内置机制，使用 `error` 函数来处理运行时错误。你可以使用此函数在某些条件不满足时抛出自定义错误。通过提供描述性的错误信息，你可以帮助识别错误原因。这是一个示例：\n\
    \n```lua\nlocal function validateInput(value)\n  if not value then\n    error(\"\
    Invalid input: value must not be nil.\")\n  end\n  -- 额外的验证逻辑...\nend\n\nlocal\
