    SQL 查询与数据库交互。


    JDBC 使 Java 应用程序能够执行核心数据库操作，例如建立连接、执行查询、处理结果集和管理事务。它充当 Java 应用程序与数据库之间的桥梁，提供了访问和操作数据的标准化方法。


