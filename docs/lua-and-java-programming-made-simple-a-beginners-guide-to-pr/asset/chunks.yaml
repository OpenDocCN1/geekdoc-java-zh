    \ pattern. The `%a+` pattern matches one or more alphabetical characters. We use\
    \ the `string.gmatch` function to iterate over the matches and collect them in\
    \ a `table`.\n\n### Wrapping Up\nIn this chapter, we explored strings and pattern\
    \ matching in Lua. Strings are used to represent textual data and can be manipulated\
