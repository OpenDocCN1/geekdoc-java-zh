- "# JavaScript：JavaScript编程代码高级指南\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n\n# 引言\n\n\
  我想感谢你的阅读，并祝贺你拥有了我的书籍《JavaScript 编程代码高级指南》。\n\n本书包含了一系列经过验证的步骤和策略，帮助你学习更高级的 JavaScript\
  \ 代码。我必须强调“高级”这个词——如果你还没有学习 JavaScript 的基础，那么这本书并不适合你；它针对那些具有已有知识和经验、希望进一步深知识并成为更好的\
  \ JavaScript 程序员的人士。\n\n仅使用基础知识就能在 JavaScript 中走得很远，但如果你想充分利用 JavaScript 提供的力量，你就需要学习更多高级的概念和技术。这些技术旨在帮助你编写更具表现力且可重用的代码。这些模式定义了一些可能在其他计算机编程语言中找不到的特性，而这正是它成为一种独特且强大的语言的原因。\n\
  \n如果这是你的第一门计算机编程语言，你可能会发现某些模式有点奇怪，但通过我包含的解释、示例以及供你做的练习（附带答案！），你很快就会熟悉它们。你会发现书中的某些章节非常短，而另一些则较长。我尽量保持所有内容的简洁，以便于你吸收。你不会在每个章节中发现任何冗长的介绍；你现在的水平已经让我可以直接进入主题并边解释边介绍了！\n\
  \n再次感谢阅读我的书；我真心希望你发现它很有用，并祝你在学习这些高级 JavaScript 技术过程中好运。\n\n# 第 1 章：可选函数参数\n\n在 JavaScript\
  \ 中声明函数时，该函数通常会包含一个参数列表：\n\n示例：\n\n代码：\n\n```javascript\nfunction sumValues(val1,\
  \ val2, val3) {\n  return val1 + val2 + val3;\n}\n```\n\n遗憾的是，这不能保证你的函数每次被调用时都有三个参数。函数在传递时带有较少或较多的参数是可以接受的。\n\
  \n示例：\n\n```javascript\nfunction sumValues(val1, val2, val3) {\n  if (val1 === undefined)\
  \ {\n    val1 = 0;\n  }\n  if (val2 === undefined) {\n    val2 = 0;\n  }\n  if (val3\
  \ === undefined) {\n    val3 = 0;\n  }\n  return val1 + val2 + val3;\n}\n```\n\n\
  如果你调用 `sumValues(1, 2, 3)`，结果是 `6`。如果你调用 `sumValues(1, 2)`，结果是 `3`。如果你调用 `sumValues(1)`，结果是\
  \ `1`。如果你调用 `sumValues()`，结果是 `0`。\n\n然而，在 JavaScript 中处理此问题有一个更好的方法。每个函数都有一个名为\
  \ `arguments` 的本地变量，它是一个包含所有传递给函数的参数的数组。\n\n示例：\n\n```javascript\nfunction sumValues()\
  \ {\n  var sum = 0;\n  for (var i = 0; i < arguments.length; i++) {\n    sum +=\
  \ arguments[i];\n  }\n  return sum;\n}\n\nvar result1 = sumValues(3, 2, 1); // 6\n\
  var result2 = sumValues(10, 5); // 15\n\nalert(result1);\nalert(result2);\n```\n\
  \n2 章：真值与假值\n\n如你所知，JavaScript 包含布尔数据类型。该数据类型只有两个值——true 或 false。布尔表达式，例如 `a ==\
  \ b`，也会求值为布尔值，但这些并不是你需要的全部。\n\n\n\n\n当你在布尔上下文中中使用非布尔表达式时（例如 `if` 条件中），这些表达式将会被隐式转换为布尔值，这个过程称为类型转换（type\
  \ coercion）。例如，如果你有表达式 `if (1) {alert('Hi')}`，`1` 将被解释为 `true`，这意味着 `alert` 将出现。值\
  \ `1` 被称为真值（truthy），而值 `0` 是假值（falsy）。\n\n当我们在在布布尔值的上下文中中使用它时，你可以使用任何 JavaScript\
  \ 表达式：\n\n## 示例\n\n```javascript\nvar truthies = [\n  \"false\",\n  \"0\",\n  -1,\n\
  \  \"null\",\n  \"undefined\",\n  \"NaN\",\n  5/0,\n  Infinity\n];\n\nvar foo;\n\
  var falsies = [\n  null,\n  undefined,\n  foo,\n  0,\n  NaN,\n  \"\"\n];\n\nfor\
  \ (var t=0; t<truthies.length; t++) {\n  document.write(\"<li>\" + truthies[t] +\
  \ \" : \" + Boolean(truthies[t]) + \"</li>\");\n}\n\nfor (var f=0; f<falsies.length;\
  \ f++) {\n  document.write(\"<li>\" + falsies[f] + \" : \" + Boolean(falsies[f])\
  \ + \"</li>\");\n}\n```\n\n打开浏览器并打开上面的页面；你看到了什么？你会注意到所有不同的值在隐式转换为布尔值时是如何被求值的。\n\n\
  以下是不同值的转换列表：\n\n| 值 | 真值或假值 | 解释 |\n| :--- | :--- | :--- |\n| `0` | 假值 | `0` 总是假值\
  \ |\n| `“0\"` | 真值 | 所有非空字符串始终是真值 |\n| `-1` | 真值 | 任何不是 `0` 的数字都是真值 |\n| `null`\
  \ | 假值 | `null` 总是假值 |\n| `“null\"` | 真值 | 另一个非零字符串，因此是真值 |\n| `undefined` | 假值\
  \ | `undefined` 总是假值 |\n| `“undefined\"` | 真值 | 非零字符串，真值 |\n| `NaN` | 假值 | `NaN`\
  \ 总是假值 |\n| `“NaN\"` | 真值 | 非零字符串 |\n| `Infinity` | 真值 | 预留关键字且非零 |\n| `5/0` | 真值\
  \ | 结果为 `Infinity` |\n| `\"\"` (空字符串) | 假值 | 空字符串始终是假值 |\n| `“false\"` | 真值 | 非零字符串\
  \ |\n\n我们之所以拥有严格相等或三等 `=` (`(===)`) 比较运算符是因为类型转换。`==` 是普通的相等运算符，它会应用类型转换，在某些情况下，你的比较可能不会得到预期的结果。看这个例子：\n\
  \n## 示例\n\n```javascript\nvar num = 0;\n\nif (num == \"\") {\n  alert('Hey, I did\
  \ not expect to see this.');\n}\n\nif (num === \"\") {\n  alert('This will not be\
  \ displayed.');\n}\n```\n\n我们在第一个条件语句中比较了两个假值，它们都会通过类型转换解析为 `false`。这导致比较结果为 `true`，这很可能不是这段代码的意图。\n\
  \n为了检测类型差异（即字符串和数字之间的差异），你会使用 `===` 运算符，正如你在第二个 `if` 语句中看到的那。\n\n## 类型转换\n\n这是一个练习，完成它大约需要\
  \ 5 到 10 分钟。你将调试一个简单的脚本并修复它：\n\n*   在你的编辑器中，打开此页面：`AdvancedTechniques/Exercises/type-coercion.html`\n\
  *   找出代码中的错误\n*   进行必要的修复\n*   在浏览器中测试你的解决方案\n\n### 答案：\n\n这是你应该得到的结果：\n\n```javascript\n\
  var answer = prompt(\"What is 10-10?\",\"\");\n\nif (answer === \"0\") {\n  alert(\"\
  Right!\");\n} else {\n  alert(\"Wrong!\");\n}\n```\n\n你可能发现这比你想象的要难。在原始代码中，如果用户在提示框中不输入任何内容直接点击\
  \ OK，alert 将显示“Right!”这是因为这是一个空字符串——记住，空字符串和 `0` 都是假值。\n\n所以你需要做什么？最初的想法可能只是将 `==`\
  \ 改为 `===` 来区分类型，但如果你这样做并进行测试，即使使用了 `0`，alert 也会一直显示“Wrong!”。这里的问题在于提示框中的值实际上是字符串，而字符串\
  \ “0”并不严格等于数字 `0`。答案是更改条件，使其变为 `answer===\"0\"`。\n\n# 第 3 章：默认运算符\n\n`&&` 和 `||`\
  \ 是布尔运算符，它们利用真值和假值将操作数解析为布尔值。如果你用过其他编程语言，你可能会认为布尔运算符的结果始终为 true 或 false。在 JavaScript\
  \ 中，这并不完全正确。\n\n在 JavaScript 语言中，布尔操作的结果始终是决定操作结果的那个特定操作数的值。让我解释得更清楚一点：\n\n## 示例\n\
  \n```javascript\nvar a = 0, b = NaN, c = 1, d = \"hi\";\nvar result = ( a || b ||\
  \ c || d );\nalert(\"Result: \" + result);\n\nresult = ( d && c && b && a );\nalert(\"\
  Result: \" + result);\n```\n\n`( a || b || c || d )` 是第一个布尔表达式，它将从左到右求值直到得出结论。`||`\
  \ 是布尔或运算符，它只需要其中一个操作数为真值，整个结果就为真。在上面的例子中：\n\n*   `a = 0`：0 总是假值。求值将继续处理后续操作数，因为假值尚未确定结果。只需要一个真值，整个结果就为真。\n\
  *   `b = NaN`：NaN 总是假值。求值将继续处理后续操作数，因为假值尚未确定结果。只需要一个真值，整个结果就为真。\n*   `c = 1`：1 是真值。求值停止。\n\
  *   `d = \"hi\"`：\"hi\" 是真值。求值停止。\n\n*(注：原文在符号列表部分存在一些重复和混乱，我根据文中提供的技术说明清理了逻辑。)*\n\
  \n\n\n`calculatePrice()` 函数使用默认运算符作为设置默认税率为 `1` 的方法。当传递 `0` 作为税值时问题就出现了。代码的意图是不收税，但由于\
  \ `0` 是假值（falsy），`tax = tax || .1` 将求值为 `.1`。\n\n可以通过将 `tax = tax || .1` 改为 `tax\
  \ = (tax === 0) ? 0 : tax || .1;` 来修复此。\n\n## 为函数参数应用默认值\n\n这个练习大约需要 5 到 15 分钟完成。我们将回到之前使用过的一个示例，并使用\
  \ `||` 作为处理可选参数的方法。\n\n*   在编辑器中打开 `AdvancedTechniques/Exercises/sumAll-defaults.html`。\n\
  *   编辑 `sumValues()`，使用 `||` 运算符代替 `if` 语句块。\n\n## 示例：\n\n```html\n<!DOCTYPE HTML>\n\
  <html\n<head>\n<meta charset=\"UTF-8\">\n<title>所有数字求和，默认运算符</title>\n<script type=\"\
  text/javascript\">\nfunction sumValues(val1, val2, val3) {\nif (val1 === undefined)\
  \ {\nval1 = 0;\n}\nif (val2 === undefined) {\nval2 = 0;\n}\nif (val3 === undefined)\
  \ {\nval3 = 0;\n}\nreturn val1 + val2 + val3;\n}\nvar result1 = sumValues(3, 5,\
  \ 6, 2, 7);\nvar result2 = sumValues(12, 20);\nalert(result1);\nalert(result2);\n\
  </script>\n</head>\n<body>\n<p>这里无显示内容。</p>\n</body>\n</html>\n```\n\n## 解决方案：\n\
  \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>所有数字求和，默认运算符</title>\n\
  <script type=\"text/javascript\">\nfunction sumValues(val1, val2, val3) {\nval1\
  \ = val1 || 0;\nval2 = val2 || 0;\nval3 = val3 || 0;\nreturn val1 + val2 + val3;\n\
  }\nvar result1 = sumValues(3, 5, 6, 2, 7);\nvar result2 = sumValues(12, 20);\nalert(result1);\n\
  alert(result2);\n</script>\n</head>\n<body>\n<p>这里无显示内容。</p>\n</body>\n</html>\n\
  ```\n\n# 第 4 章：作为参数传递的函数\n\nJavaScript 中的函数是一类等对象，而不仅仅是是可以被调用的不可变代码块。相反，每个声明的函数都会变成一个对象，拥有它们自己的方法和属性，这些对象可以像任何其他对象一样被传递。\n\
  \n看下下面的示例，了解函数如何作为另一个函数的参数使用：\n\n## 示例：\n\n```javascript\n//让我们创建一个包含 5 个值的数组\n\
  var values = [5, 2, 11, -7, 1];\n\n//这个函数将相加 'a' 和 'b' 的值并返回和\nfunction add(a, b)\
  \ {\nreturn a+b;\n}\n\n//这个函数将 'a' 的值乘以 'b' 并返回结果\nfunction multiply(a, b) {\nreturn\
  \ a*b;\n}\n\n/* 传递的第 1 参数是数字（在这种情况下，是 values 数组）\n* 传递的第 2 参数是初始值（可以是 0, 1 或任何值）\n\
  * 传递的第 3 参数是操作方法 - 它将是上面声明的函数之一（add 或 subtract）\n*/\nfunction combineAll(nums, initialValue,\
  \ operation) {\n//用传入的 initialValue 初始化局部变量 'runningResult'\nvar runningResult =\
  \ initialValue;\n\n// 循环 nums 数组\nfor (var i=0; i < nums.length; i++) {\n/* 在每次迭代中，调用函数（可以是\
  \ add 或 multiply）并传递 2 个参数\n* 在第一次迭代中，runningResult 是 initialValue；之后，是 operation(runningResult,\
  \ nums[i]) 返回的值\n* nums[i] 指向迭代中的当前数字；第一个是 5，然后是 2，依此类推。\n*/\nrunningResult = operation(runningResult,\
  \ nums[i]);\n}\nreturn runningResult;\n}\n\n//注意第 3 参数传递了 \"add\" 函数 - 你可以将一个函数传递到另一个函数中！\n\
  var sum = combineAll(values, 0, add);\n\n//注意第 3 参数传递了 \"multiply\" 函数 - 你可以将一个函数传递到另一个函数中！\n\
  var product = combineAll(values, 1, multiply);\n\nalert(\"Sum: \" + sum); // 应该是\
  \ 12: 5+2+11+(-7)+1\nalert(\"Product: \" + product); // 应该是 -770: 5x2x11x-7x1\n\
  ```\n\n你可能在想这个函数的含义 - `var sum = combineAll(values, 0, add);`。（此处原文存在大量重复句子和字符串，已根据指令提取核心逻辑）。\n\
  \n\n\n\nJavaScript 变量使用 `var` 关键字进行声明，它们将是局部作用域或全局作用域。要成为全局作用域，变量必须满足以下条件之一：\n\n\
  - 变量在函数外部声明\n- 变量在没有使用 `var` 关键字声明的情况下被使用\n\n要成为局部作用域，变量必须在另一个函数内部使用 `var` 关键字声明。\n\
  \n全局变量可以从 JavaScript 代码的任何地方访问：\n\n示例：\n\n```javascript\nvar maxNum; //global\n\n\
  function prepare() {\n  var maxNum = 5; //local to function\n  //让我们忘记在 \"for\"\
  \ 声明中写 \"var\"\n  for (i=0; i <= maxNum; ++i) { //没有 var，所以 i 将是全局的\n    // 执行一些操作\n\
  \  }\n}\n\nprepare();\n\nalert(maxNum); //undefined\nalert(i); //6 (因为它是全局作用域)\n\
  ```\n\n注意，`maxNum` 是一个全局声明变量，但没有给它赋值。它在 `prepare()` 函数内部被声明并被赋值为 5。\n\n看一看在 `prepare()`\
  \ 之后 `maxNum` 的值，它的值被留为了 `undefined`。这是因为全局变量正在被读取，而我们无法从函数外部访问函数变量。\n\n然而，我们可以访问变量\
  \ `i`，仅仅是因为我们在函数内部给它赋值了，但没有使用 `var` 来声明它。\n\n由于 JavaScript 中没有块级作用域，变量永远不会是 `for`\
  \ 循环或 `if` 语句的局部变量。\n\n# 第 7 章：观察和捕获事件\n\n你可能更习惯于使用 HTML 事件处理器（例如“on”属性）作为捕获事件的方法——参见下面的示例：\n\
  \n示例：\n\n```html\n<ul>\n  <li onclick=\"document.bgColor='red';\">红色</li>\n  <li\
  \ onclick=\"document.bgColor='orange';\">橙色</li>\n  <li onclick=\"document.bgColor='green';\"\
  >绿色</li>\n  <li onclick=\"document.bgColor='blue';\">蓝色</li>\n</ul>\n```\n\n然而，将\
  \ HTML 和 JavaScript 彼此分离要好得多。\n\n## `eval()` 函数\n\n我们为什么要在这里讨论这个函数？仅仅是为了承认它的存在，并告诉你**不要**使用它。我会告诉你为什么，但首先你需要知道它是做什么的。\n\
  \n`eval` 用于编译字符串并执行它，该字符串将包含 JavaScript 代码，它可以是一个非常简单的内容，如“2 + 3”这样的表达式，也可以是一个更长、更复杂的脚本，其中包含各种函数和其他内容。\n\
  \n看下面的示例：这类似于你可以在互联网实时网站上看到的内容：\n\n示例：\n\n```javascript\nfunction getProperty(objectName,\
  \ propertyName) {\n  // 表达式将是：document.title\n  var expression = objectName + \"\
  .\" + propertyName;\n  console.log(expression);\n  // eval() 函数将评估表达式，所以 document.title\
  \ 为我们提供了文档的标题\n  var propertyValue = eval(expression);\n  return propertyValue;\n\
  }\n\nvar prop = \"title\"; //假设这是由用户提供的\nalert(getProperty(\"document\", prop));\n\
  ```\n\n该函数通过获取一个对象名称并将其与点以及属性名称连接来生成一个表达式。然后它使用 `eval()` 该表达式。虽然这是一个非常强大的函数，但它也具有巨大的危险性，而且效率并不高。为什么它是危险的？因为它通常被用作评估用户输入的方法，而这并不总是最安全的方法。效率低的问题源于每次调用\
  \ `eval()` 都会启动一个 JavaScript 编译器。\n\n通常情况下使用该函数表明开发者确实缺乏相关知识。在上面的示例中，我们可以采用 `[]`\
  \ 属性访问符的路径。我们通过 `alert(window[prop]);` 就能得到相同的结果，而不需要为了获取属性值就启动编译器。\n\n记住：尽可能避免使用\
  \ `eval`，因为它只会给你的代码带来问题。\n\n# 第 8 章：错误处理\n\n无论你把代码写得多么细心，错误总是会出现的。大多数情况下，它们是由于你无法预测的事情引起的运行时错误。其他时候，它们是\
  \ bug 或你的代码运行不符合预期。幸运的是，JavaScript 为你提供了处理这两种错误所需的工具，而这就是我们在本章中将讨论的。\n\n## 运行时错误\n\
  \n网络浏览器可能是极其敌对的地方，几乎可以肯定你将永远在处理运行时错误。用户以你完全没想过的可能方式输入错误。浏览器的新版本可能会改变工作方式，Ajax 调用可能会因为许多不同的原因而失败。\n\
  \n很多时候，你无能为力阻止运行时错误，但有办法处理它们，让用户的体验不那么糟糕。\n\n### 未处理的错误\n\n看看这个示例，它看起来很不起微：\n\n\
  示例：\n\n```javascript\nfunction getInput() {\n  var name = prompt('输入你的名字');\n  alert('你的名字有\
  \ ' + name.length + ' 个字母。');\n}\n\ngetInput();\n```\n\n仔细看代码；起初可能没那么明显，但这是一个即将发生的\
  \ bug。如果用户点击或按下 ESC 或取消，`prompt()` 函数将返回 `null`，这将导致下一行出现空引用错误并使其失败。\n\n如果开发者对此不做任何处理，用户将收到一条对他们来说毫无意义的浏览器消息。取决于用户如何配置设置或浏览器，他们可能得不到屏幕上的消息；它可能会以状态栏的形式出现，这很容易被忽略，让用户认为应用程序只是没有响应。\n\
  \n### 全局处理的错误\n\n`window` 对象中有一个名为 `onerror` 的事件，每当页面出现未处理的错误时，它就会被调用。例如：\n\n示例：\n\
  \n```javascript\nwindow.onerror = function (message, url, lineNo) {\n  alert(\n\
  \    '错误: ' + message +\n    '\\n URL: ' + url +\n    '\\n 行号: ' + lineNo\n  );\n\
  \  return true;\n}\n\nfunction getInput() {\n  var name = prompt('输入你的名字');\n  alert('你的名字有\
  \ ' + name.length + ' 个字母。');\n}\n\ngetInput();\n```\n\n从这个示例可以看出，该事件向函数传递了三个参数。第一个是错误消息，第二个是包含错误的文件的\
  \ URL（如果是外部 `.js` 文件则非常有用），第三个是错误所在文件的行号。\n\n`return true` 告诉浏览器开发者已处理此问题；如果返回 `false`，浏览器将将其视为未处理错误，消息将会显示。\n\
  \n## 结构化错误处理\n\n与其他事情一样，处理错误的最佳方法是尽可能在错误发生的地方检测它。这将让你更容易知道如何处理它。JavaScript 使用 `try`...`catch`...`finally`\
  \ 块来实现实现结构化错误处理：\n\n```javascript\ntry {\n  // try 语句\n} catch (error) {\n  // catch\
  \ 语句\n} finally {\n  // finally 语句\n}\n```\n\n这是一个非常简单的原理；如果错误发生在 `try` 块中的语句中，则执行\
  \ `catch` 块中的语句并将错误直接传递给 `error` 变量。`finally` 块是可选的，如果使用，无论是否有错误，它将在最后执行。\n\n我们可以做什么让我们的代码捕获错误？\n\
  \n示例：\n\n```javascript\nwindow.onerror = function (message, url, lineNo) {\n  alert(\n\
  \    '错误: ' + message +\n    '\\n URL: ' + url +\n    '\\n 行号: ' + lineNo\n  );\n\
  \  return true;\n}\n\nfunction getInput() {\n  try {\n    var name = window.prompt('输入你的名字');\n\
  \    alert('你的名字有 ' + name.length + ' 个字母。');\n  } catch (error) {\n    alert('错误类型:\
  \ ' + error.name +\n      '\\n 错误消息为: ' + error.message);\n  } finally {\n    //\
  \ 执行清理工作\n  }\n}\n\ngetInput();\n```\n\n\n\n\n错误对象中有两个重要的属性：`message` 和 `name`。`message`\
  \ 包含了我们已经知道的错误信息，而 `name` 包含了关于错误类型的信息。我们使用这些信息来决定如何处理该错误。\n\n对于任何程序员来说，有一条很好的建议是：只有当你\
  \ 100% 确定知道错误是什么以及确切知道该如何修复它时，才在现场处理错误，而不是抑制它。为了更好地针对性处理代码，可以将其更改为仅处理名为 `TypeError`\
  \ 的错误——这是为该 bug 指定的错误名称：\n\n示例：\n\n```javascript\nwindow.onerror = function (message,\
  \ url, lineNo) {\n  alert(\n    'Error: ' + message +\n    '\\n Url: ' + url +\n\
  \    '\\n Line Number: ' + lineNo);\n  return true;\n}\n\nfunction getInput() {\n\
  \  try {\n    var name = window.prompt('Type your name');\n    alert('Your name\
  \ has ' + name.length + ' letters.');\n  } catch (error) {\n    if (error.name ==\
  \ 'TypeError') {\n      alert('Please try again.');\n      getInput();\n    } else\
  \ {\n      throw error;\n    }\n  } finally {\n    //do cleanup\n  }\n}\n\ngetInput();\n\
  ```\n\n如果发生了不同的错误（在这个简单的示例中不太可能），它将不会被处理。`throw` 语句会将错误发送出去，就像我们没有使用 `try…catch…finally`\
  \ 块一样。该错误将在稍后出现。\n\n## 抛出自定义错误\n\n`throw` 语句可以用于抛出自定义错误，这里只有一个建议—— 错误对象必须具有 `name`\
  \ 和 `message` 属性，并且要与内置的处理方法保持一致。看这个示例：\n\n```javascript\nthrow {\n  name: 'InvalidColorError',\n\
  \  message: 'The given color is not a valid color value.'\n};\n```\n\n# 第 9 章：‘delete’运算符\n\
  \n我们使用 `delete` 运算符作为删除对象属性和数组元素的方法。务必明确这一点——删除不等同于将值设置为 `null`。删除会移除元素或属性，使其变为\
  \ `undefined`，而将值设置为 `null` 则会保留该元素或对象，同时将其值设为 `null`。看这个示例作为说明：\n\n示例：\n\n```html\n\
  <!DOCTYPE HTML>\n<html\n<head>\n  <meta charset=\"UTF-8\">\n  <script type=\"text/javascript\"\
  >\n    var colors = [];\n    colors[\"red\"] = \"#f00\";\n    colors[\"green\"]\
  \ = \"#060\";\n    colors[\"blue\"] = \"#00f\";\n    colors[\"yellow\"] = \"#ff0\"\
  ;\n    colors[\"orange\"] = \"#0ff\";\n\n    function deleteItem() {\n      delete\
  \ colors[\"blue\"];\n      showArray();\n      revealArray();\n    }\n\n    function\
  \ setToNull() {\n      colors[\"blue\"] = null;\n      showArray();\n      revealArray();\n\
  \    }\n\n    function showArray() {\n      var output = document.getElementById(\"\
  colors\");\n      var strOutput = \"<ol>\";\n      for (var i in colors) {\n   \
  \     strOutput += \"<li style='color:\" + colors[i] + \";'>\" + i + \"</li>\";\n\
  \      }\n      strOutput += \"</ol>\";\n      output.innerHTML=strOutput;\n   \
  \ }\n\n    function revealArray() {\n      var colorsCode = document.getElementById(\"\
  colors-code\");\n      var strOutput = \"&lt;ol&gt;\";\n      for (var i in colors)\
  \ {\n        strOutput+=\"\\n\\t&lt;li style='color:\" + colors[i] + \";&gt;\" +\
  \ i + \"&lt;/li&gt;\";\n      }\n      strOutput += \"\\n&lt;/ol&gt;\";\n      colorsCode.innerHTML=strOutput;\n\
  \    }\n  </script>\n  <title>Delete vs. Setting to NULL</title>\n</head>\n<body\
  \ onload=\"showArray();revealArray();\">\n  <button id=\"set-to-null\" onclick=\"\
  setToNull();\">Set Blue to Null</button>\n  <button id=\"del\" onclick=\"deleteItem();\"\
  >Delete Blue</button>\n  <output id=\"colors\"></output>\n  <pre id=\"colors-code\"\
  ></pre>\n</body>\n</html>\n```\n\n现在暂时忘记 `showArray()` 和 `revealArray()` 函数。但请注意，当点击“Set\
  \ Blue to Null”按钮时，数组元素将留在原地，但将是一个无效的颜色 `null`。当点击“Delete Blue”按钮时，数组元素将被删除。\n\n\
  ## 正则表达式\n\n这是对接下来几章的快速介绍，其中我们将介绍正则表达式。它们被用于模式匹配，这在表单验证时非常有用。例如，你可以使用正则表达式来检查输入到表单字段中的电子邮件地址在语法上是否是正确的。在\
  \ JavaScript 中，你可以通过两种方式创建正则表达式：\n\n### 字面量语法\n\n```javascript\nvar reExample =\
  \ /pattern/;\n```\n\n### `RegExp()` 构造函数\n\n```javascript\nvar reExample = new RegExp(\"\
  pattern\");\n```\n\n如果你已经知道将要使用的模式，这两者之间没有实际区别。但如果你不知道将使用哪种模式，最简单的方法是使用 `RegExp()`\
  \ 构造函数。\n\n# 第 10 章：正则表达式 – 方法\n\nJavaScript 包含两个主要的正则表达式测试方法：`test()` 和 `exec()`。\n\
  \n## `exec()` 方法\n\n`exec()` 方法接收一个字符串参数并检查字符串是否存在匹配项。如果有，则返回一个结果数组。如果没有，则返回 `null`。\n\
  \n### `test()` 方法\n\n`test()` 方法也会接收一个字符串并检查字符串是否存在匹配项。如果存在匹配项，则返回 `true`。这在表单验证中非常有用。示例：`RegularExpressions/SsnChecker.html`\n\
  \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n  <meta charset=\"UTF-8\">\n  <title>ssn\
  \ Checker</title>\n  <script type=\"text/javascript\">\n    var reSSN = /^[0-9]{3}[0-9]{4}$/;\n\
  \n    function checkSsn(ssn) {\n      if (reSSN.test(ssn)) {\n        alert(\"VALID\
  \ SSN\");\n      } else {\n        alert(\"INVALID SSN\");\n      }\n    }\n  </script>\n\
  </head>\n<body>\n  <form onsubmit=\"return false;\">\n    <input type=\"text\" name=\"\
  ssn\" size=\"20\">\n    <input type=\"button\" value=\"Check\" onclick=\"checkSsn(this.form.ssn.value);\"\
  >\n  </form>\n</body>\n</html>\n```\n\n让我们仔细观察代码。首先，我们定义了一个正则表达式变量。其次，我们创建了一个名为\
  \ `checkSsn` 的函数。该函数接收一个参数 `ssn`（这是一个字符串），并将其传递给正则表达式以检查是否存在匹配。最后，页面中的表单提供了一个用户输入安全号码的字段，以及一个会将该号码传递给该函数的按钮。\n\
  \n## 标志\n\n如果标志出现在斜杠后面，它将修改正则表达式的工作方式。\n\n- `i` 标志使正则表达式不区分大小写。例如，`/aeiou/i` 将同时匹配大写和小小写的元音。\n\
  - `g` 标志指定全局匹配，这意味着将返回指定模式的所有匹配。\n\n## 字符串方法\n\n许多字符串方法接受正则表达式作为参数：\n\n- `search()`\
  \ 方法：该方法仅接收一个参数——正则表达式。返回匹配正则表达式的子字符串的起始字符索引。如果没有匹配项，则返回 -1。\n- `split()` 方法：该方法也接收正则表达式，并将其作为分隔符将一个字符串拆分为数组。\n\
  - `replace()` 方法：该方法接收两个参数——正则表达式和字符串。第一个正则表达式匹配项将被替换为字符串，如果表达式使用了 `g` 标志，则将替换所有字符串项。\n\
  - `match()` 方法：`match()` 方法接收正则表达式作为参数，并返回与正则表达式模式匹配的每个子字符串。\n\n# 第 11 章：正则表达式 –\
  \ 语法\n\n正则表达式是用于指定字符列表的模式。在本章中，我们将查看用于指定字符的语法：\n\n- 起始和结束 ( `^$` )\n\n\n\n## 正则表达式\n\
  \n*   如果正则表达式的开头有一个插入符号（`^`），它表示正在搜索的字符串必须以此模式开头；\n*   你可以在“food”中找到模式 `^food`，但在“barfood”中找不到；\n\
  *   如果正则表达式的末尾有一个美元符号（（`$` 符号），它表示正在搜索的字符串必须以此模式结尾；\n*   你可以在“curfoo”中找到模式 `foo$`，但在“food”中找不到；\n\
  \n### 出现次数 (`?` + `*` `{}` `{}`)\n\n这些符号会影响其前一个字符（或者如果你使用括号，则是一组字符）出现的次数：`?`、`*`、`+`、`{}`。\n\
  \n*   问号（`?`）表示前面的字符在模式中必须出现 0 次或 1 次；\n*   你可以在“fod”和“food”中找到模式 `foo?`，但在“faod”中找不到；\n\
  *   加号（`+`）表示前面的字符在模式中至少出现 1 次；\n*   你可以在“food”、“fod”和“foood”中找到模式 `fo+`，但在“fd”中找不到；\n\
  *   星号（`*`）表示前面的字符在模式中至少出现 0 次；\n*   你可以在“fd”、“food”和“fod”中找到模式 `fo*d`；\n*   花括号（`{}`）带有单个参数\
  \ `{n}` 表示前面的字符在模式中必须恰好出现 `n` 次；\n*   你可以在“foood”中找到模式 `fo{3}d`，但在“fooood”或“food”中找不到；\n\
  *   带有两个参数的花括号 `{n1, n2}` 表示前一个字符在模式中出现的次数在 `n1` 到 `n2` 之间；\n*   你可以在“fooood”、“foood”和“food”中找到模式\
  \ `fo{2,4}`，但在“foooood”中找不到；\n*   带有一个参数且第二个参数为空的花括号 `{n}` 表示前一个字符在模式中至少出现 `n` 次；\n\
  *   你可以在“foooood”和“food”中找到模式 `fo{2}`，但在“fod”中找不到。\n\n## 常用字符 (`.` `\\d` `\\D` `\\\
  w` `\\W` `\\s` `\\S`)\n\n*   点（`.`）代表换行符以外的任何字符；\n*   你可以在“foad”、“food”、“fo*f”和“fo9d”中找到模式\
  \ `fo.d`；\n*   反斜杠-d（`\\d`）代表任何数字，等于 `[0-9]`；\n*   你可以在“fo1d”、“fo0d”、“fo4d”中找到模式\
  \ `fo\\dd`，但在“fodd”或“food”中找不到；\n*   反斜杠-D（`\\D`）代表数字以外的任何字符，等于 `[⁰-9]`；\n*   你可以在“foad”和“food”中找到模式\
  \ `fo\\D`，但在“fo4d”中找不到；\n*   反斜杠-w（`\\w`）代表任何单词字符，如数字、字母和下划线（`_`）；\n*   你可以在“fo_d”、“food”和“fo4d”中找到模式\
  \ `fo\\w`，但在“fo*d”中找不到；\n*   反斜杠-W（`\\W`）代表任何非单词的字符；\n*   你可以在“fo&d”、“fo*d)”和“fo.d”中找到模式\
  \ `fo\\Wd`，但在“fo d”中找不到；\n*   反斜杠-s（`\\s`）代表任何空白字符，如制表符、空格、换行符等；\n*   你可以在“fo d”中找到模式\
  \ `fo\\sd`，但在“food”中找不到；\n*   反斜杠-S（`\\S`）代表除空白以外的任何字符；\n*   你可以在“food”、“fo*d”和“fo4d”中找到模式\
  \ `fo\\Sd`，但在“fo d”中找不到。\n\n### 分组 (`[]`)\n\n我们使用方括号（`[]`）将选项组合在一起：\n\n*   你可以在“fed”和“fad”中找到模式\
  \ `f[aeiou]`，但在“food”、“faed”或“fd”中找不到。\n*   模式 `[aeiou]` 将匹配“a”、“e”、“i”、“o”或“u”。\n\
  *   你可以在“faed”和“feod”中找到模式 `f[aeiou]{2}d`，但在“fod”、“fed”或“fd”中找不到。\n*   你可以在“Webucator,\
  \ Inc.”中找到模式 `[A-Za-z]+`，但在“13078”中找不到。\n*   模式 `[A-Za-z]` 将匹配任何字母，无论大小写；\n*   模式\
  \ `[A-Z]` 将匹配任何大写字母；\n*   模式 `[a-z]` 将匹配任何小写字母。\n\n### 否定 (`^`)\n\n当插入符号（`^`）在方括号内且位于开头时，它表示否定：\n\
  \n*   你可以在“food”和“fd”中找到模式 `[^aeiou]`。\n\n### 子模式 (`()`)\n\n我们使用括号 `()` 来捕获子模式：\n\
  \n*   你可以在“food”和“fod”中找到模式 `(oo)?`。\n\n### 备选项 (`|`)\n\n我们使用管道符（`|`）作为创建备的方式：\n\
  \n*   你可以在“foo”和“bar”中找到模式 `foo|bar`。\n\n### 转义字符 (`\\`)\n\n我们使用反斜杠（`\\`）来转义字符：\n\
  \n*   你可以在“food.”中找到模式 `\\.`，但在“foo”中找不到。\n\n# 第 12 章：正则表达式 – 表单验证\n\n当你使用正则表达式时，可以创建一些强大的验证函数。来看这个例子：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>登录</title>\n\
  <script>\nfunction validate(form) {\n    var email = form.Email.value;\n    var\
  \ password = form.Password.value;\n    var errors = [];\n\n    var reEmail = /^(\\\
  w+\\.)*\\w+@(\\w+\\.)+[A-Za-z]+$/;\n    var rePassword = /^[A-Za-z\\d]{6,8}$/;\n\
  \n    if (!reEmail.test(email)) {\n        errors.push(\"请输入有效的电子邮件地址。\");\n   \
  \ }\n    if (!rePassword.test(password)) {\n        errors.push(\"密码必须在 6 到 8 位之间，且只能包含字母和数字。\"\
  );\n    }\n\n    if (errors.length > 0) {\n        var msg = \"存在一些问题：\\n\";\n \
  \       for (var i = 0; i < errors.length; i++) {\n            msg += \"\\n\" +\
  \ (i + 1) + \". \" + errors[i];\n        }\n        alert(msg);\n        return\
  \ false;\n    }\n    return true;\n}\n</script>\n</head>\n<body>\n<h1>登录表单</h1>\n\
  <form method=\"post\" action=\"Process.html\" onsubmit=\"return validate(this);\"\
  >\n邮箱：<input type=\"text\" name=\"Email\" size=\"25\"><br/>\n密码：<input type=\"password\"\
  \ name=\"Password\" size=\"10\"><br/>\n<input type=\"submit\" value=\"提交\">\n<input\
  \ type=\"reset\" value=\"重置表单\">\n</form>\n</body>\n</html>\n```\n\n\n\n\n\n-  \
  \ 在你的编辑器中打开 `RegularExpressions/Exercises/FormValidation.js`。\n\n现在编写正确的正则表达式（额外的），用于检查以下内容：\n\
  \n1. **专有名词 (The proper name)**\n   - 它以大写字母开头\n   - 后面至少跟着一个字母或撇号\n   - 它可以是多个单词，例如“New\
  \ Mexico”\n2. **首字母 (Initial)**\n   - 它包含包含 0 个或 1 个大写字母\n3. **州名 (State)**\n  \
  \ - 它恰有两个大写字母\n4. **美国邮政编码 (US Postal Code)**\n   - 由五位数字组成\n   - 后面可以跟一个连字符和另外四位数字\n\
  5. **用户名 (Username)**\n   - 不少于 6 位且不超过 15 位数字或字母\n\n## 第二次练习\n\n-   在你的编辑器中打开 `RegularExpressions/Exercises/Register.html`。\n\
  \n添加正确的验证逻辑来检查这些字段：\n- 名 (first name)\n- 中间首字母 (middle initial)\n- 姓 (last name)\n\
  - 城市 (city)\n- 州 (state)\n- 邮编 (zip)\n- 用户名 (username)\n\n在浏览器中测试你的解决方案\n\n## 挑战\n\
  \n添加正确的正则表达式来测试英国和加拿大的邮政编码：\n- 英国邮政编码为两个字母、一个或两个数字、一个空格、一个数字和两个字母——例如 WC12 3XY\n\
  - 加拿大邮政编码为一个字母、一个数字、一个字母、一个空格、一个数字、一个字母和一个数字——例如 M1A 2B3\n\n接下来，对 `Register.html`\
  \ 进行修改，使用这些正则表达式以及美国邮政编码正则表达式来检查邮编。\n\n## 解决方案：\n\n`RegularExpressions/Solutions/FormValidation.js`\n\
  \n```javascript\n//Regular Expressions\nvar reEmail = /^(\\w+[\\-\\.])*\\w+@(\\\
  w+\\.)+[A-Za-z]+$/;\nvar rePassword = /^[A-Za-z\\d]{6,8}$/;\nvar reProperName =\
  \ /^([A-Z][A-Za-z']+ )*[A-Z][A-Za-z']+$/;\nvar reInitial = /^[A-Z]$/;\nvar reState\
  \ = /^[A-Z]{2}$/;\nvar rePostalUS = /^\\d{5}(\\-\\d{4})?$/;\nvar reUsername = /^[A-Za-z\\\
  d]{6,15}$/;\n```\n\n## 解决方案：\n\n```html\n<!DOCTYPE HTML>\n<html\n<head>\n<meta charset=\"\
  UTF-8\">\n<title>Registration Form</title>\n<script type=\"text/javascript\" src=\"\
  FormValidation.js\"></script>\n<script type=\"text/javascript\">\nfunction validate(form){\n\
  var firstName = form.FirstName.value;\nvar midInitial = form.MidInit.value;\nvar\
  \ lastName = form.LastName.value;\nvar city = form.City.value;\nvar state = form.State.value;\n\
  var zipCode = form.Zip.value;\nvar email = form.Email.value;\nvar userName = form.Username.value;\n\
  var password1 = form.Password1.value;\nvar password2 = form.Password2.value;\nvar\
  \ errors = [];\n\nif (!reProperName.test(firstName)) {\nerrors[errors.length] =\
  \ \"You must enter a valid first name.\";\n}\nif (!reInitial.test(midInitial)) {\n\
  errors[errors.length] = \"You must enter a one-letter middle initial.\";\n}\nif\
  \ (!reProperName.test(lastName)) {\nerrors[errors.length] = \"You must enter a valid\
  \ last name.\";\n}\nif (!reProperName.test(city)) {\nerrors[errors.length] = \"\
  You must enter a valid city.\";\n}\nif (!reState.test(state)) {\nerrors[errors.length]\
  \ = \"You must enter a valid state.\";\n}\nif (!rePostalUS.test(zipCode)) {\nerrors[errors.length]\
  \ = \"You must enter a valid zip code.\";\n}\nif (!reUsername.test(userName)) {\n\
  errors[errors.length] = \"You must enter a valid username.\";\n}\n}\n</script>\n\
  </head>\n```\n\n## 挑战解决方案：\n\n`RegularExpressions/Solutions/FormValidation-challenge.js`\n\
  \n```javascript\n//Regular Expressions\nvar rePostalUS = /^\\d{5}(\\-\\d{4})?$/;\n\
  var rePostalCA = /^[A-Z]\\d[A-Z] \\d[A-Z]\\d$/;\nvar rePostalUK = /^[A-Z]{2}[0-9]{1,2}\
  \ ?[0-9]{1}[A-Z]{2}$/;\n```\n\n## 挑战解决方案：\n\n```html\n<!DOCTYPE HTML>\n<html\n<head>\n\
  <meta charset=\"UTF-8\">\n<title>Registration Form</title>\n<script type=\"text/javascript\"\
