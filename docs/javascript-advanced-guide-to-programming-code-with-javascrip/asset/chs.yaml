  >\nfunction validate(form){\nif (!rePostalUS.test(zipCode)\n&& !rePostalCA.test(zipCode)\n\
  && !rePostalUK.test(zipCode))\n{\nerrors[errors.length] = \"You must enter a valid\
  \ postal code.\";\n}\nreturn true;\n}\n</script>\n</head>\n```\n\n# 第 13 章：清理表单输入\n\
  \n有时，在用户输入时立即对其输入进行清理是很好的，我们可以通过结合字符串对象的 `replace()` 方法和正则表达式来实现这一点。\n\n## 重新回顾\
  \ `replace()` 方法\n\n我们已经查看过这个方法，以及如何使用它将正则表达式匹配替换为字符串，但我们还可以结合反向引用来替换匹配的模式。以下示例展示了这一点：\n\
  \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>ssn</title>\n\
  <script type=\"text/javascript\">\nvar reSSN = /^(\\d{3})(\\d{2})(\\d{4})$/;\nfunction\
  \ cleanSsn(ssn){\nif (reSSN.test(ssn)) {\nvar ssn = ssn.replace(reSSN, \"$1-$2-$3\"\
  );\nreturn ssn;\n} else {\nalert(\"INVALID SSN\");\nreturn ssn;\n}\n}\n</script>\n\
  </head>\n<body>\n<form onsubmit=\"return false;\">\n<input type=\"text\" name=\"\
  ssn\" size=\"20\">\n<input type=\"button\" value=\"Clean SSN\"\nonclick=\"this.form.ssn.value\
  \ = cleanSsn(this.form.ssn.value);\">\n</form>\n</body>\n</html>\n```\n\n我们使用 `replace()`\
  \ 方法来清理用户输入的社会安全号码。正则表达式 `reSSN` 有三个捕获组：`(\\d{3})`、`(\\d{2})` 和 `(\\d{4})`。它们在替换字符串中分别对应\
  \ `$1`、`$2` 和 `$3`。\n\n- 在你的编辑器中打开 `RegularExpressions/Exercises/PhoneCleaner.html`。\n\
  - 这个练习大约会花费你 15 分钟。\n\n## 挑战\n\n有时你会发现电话号码是数字和字母的组合，并且包含额外的字符。你的挑战是添加一个名为 `convertPhone()`\
  \ 的函数，它将：\n- 过滤掉所有非字母非数字字符\n- 将每个字母转换为数字，如下：\n  - ABC -> 2\n  - DEF -> 3\n  - GHI\
  \ -> 4\n  - JKL -> 5\n  - MNO -> 6\n  - PQRS -> 7\n  - TUV -> 8\n  - WXYZ -> 9\n\
  - 它必须将初始数字传递给 `convertPhone()` 函数并返回结果。\n\n在浏览器中测试你的解决方案。\n\n```html\n<!DOCTYPE\
  \ HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Phone Checker</title>\n\
  <script type=\"text/javascript\">\nfunction convertPhone(phone){\nvar convertedPhone;\n\
  convertedPhone = phone.replace(/[^A-Za-z\\d]/g, \"\");\nconvertedPhone = convertedPhone.replace(/[ABC]/gi,\
  \ \"2\");\nconvertedPhone = convertedPhone.replace(/[DEF]/gi, \"3\");\nconvertedPhone\
  \ = convertedPhone.replace(/[GHI]/gi, \"4\");\nconvertedPhone = convertedPhone.replace(/[JKL]/gi,\
  \ \"5\");\nconvertedPhone = convertedPhone.replace(/[MNO]/gi, \"6\");\nconvertedPhone\
  \ = convertedPhone.replace(/[PQRS]/gi, \"7\");\nconvertedPhone = convertedPhone.replace(/[TUV]/gi,\
  \ \"8\");\nconvertedPhone = convertedPhone.replace(/[WXYZ]/gi, \"9\");\nreturn convertedPhone;\n\
  }\n}\n</script>\n</head>\n```\n\n\n\n\n\n```javascript\nconvertedPhone = convertedPhone.replace(/[MNO]/gi,\
  \ \"6\");\nconvertedPhone = convertedPhone.replace(/[PQRS]/gi, \"7\");\nconvertedPhone\
  \ = convertedPhone.replace(/[TUV]/gi, \"8\");\nconvertedPhone = convertedPhone.replace(/[WXYZ]/gi,\
  \ \"9\");\n\nreturn cleanPhone(convertedPhone.substr(0, 10));\n}\n</script>\n</head>\n\
  <body>\n<form onsubmit=\"return false;\">\n<input type=\"text\" name=\"Phone\" size=\"\
  20\">\n<input type=\"button\" value=\"Convert Phone\" onclick=\"this.form.Phone.value\
  \ = convertPhone(this.form.Phone.value);\">\n</form>\n</body>\n</html>\n```\n\n\
  # 附录章节：使用 AJAX\n\nAJAX 代表异步 JavaScript 和 XML（Asynchronous JavaScript and XML），它是一组技术，例如\
  \ `DOM`、`JavaScript`、`HTML`、`XML` 和 `CSS`，这些技术都是相互关联的。AJAX 允许你在无需重新加载网页的情况下异步发送和接收数据，这使得速度极快。\n\
  \nAJAX 还允许你只向 Web 服务器发送最重要的信息，而不是整个页面，因此只有有价值的数据会被路由到客户端。这使得你构建和使用的任何应用程序都快得多且更具交互性。AJAX\
  \ 被应用于大量的 Web 应用程序，包括 Facebook、`Gmail`、`Google Maps`、`Twitter` 以及其他数不尽的应用。\n\n##\
  \ AJAX 是如何工作的？\n\n当你使用传统的 `JavaScript` 代码并想要从服务器文件或数据库中获取某些信息，或者如果你想向服务器发送某些信息时，你需要创建一个\
  \ `HTML` 表单，并使用 `POST` 或 `GET` 向数据发送或接收数据。终端用户需要点击写有 `SUBMIT` 的按钮来发送或获取答案；然后他们必须等待服务器响应，随后会加载一个带有结果的新页面。\n\
  \n每当用户提交输入时，服务器都会返回一个新页面，正因如此，某些 Web 应用程序运行非常缓慢，而且并不总是对用户友好。当你使用 AJAX 时，`JavaScript`\
  \ 将通过 JavaScript 对象 `XMLHttpRequest` 直接与服务器通信。\n\n通过使用 `HTTP` 请求，网页可以在无需重新加载页面的请求并接收\
  \ Web 服务器的响应。用户留在同一个页面，不会察觉到脚本在发送页面请求或向服务器发送数据，因为这些都在后台运行。\n\n用户将发送一个请求，该请求将执行一个操作。对该操作的响应将显示在一个通过\
  \ `ID` 识别的层中，而无需页面经过完全重加载。这是一个页面 ID 的示例：\n\n```html\n<div id=\"ajaxResponse\"></div>\n\
  ```\n\n接下来，我们将简要查看如何创建 `XMLHttpRequest` 对象并从服务器获取响应：\n\n### 步骤 1：创建对象 `XMLHttpRequest`。\n\
  \n不同的浏览器将使用不同的方法来创建此对象；Internet Explorer 使用 `ActiveXObject`，而其他某些浏览器使用 `XMLHttpRequest`，这当然是\
  \ `JavaScript` 中的内置对象。\n\n为了创建对象并处理所有不同的浏览器，我们将使用一种称为“捕获与尝试”（catch and try）的语句。\n\
  \n```javascript\nfunction ajaxFunction()\n{\n  var xmlHttp;\n  try\n  {\n    //\
  \ Firefox, Opera 8.0+, Safari\n    xmlHttp = new XMLHttpRequest();\n  }\n  catch\
  \ (e)\n  {\n    // Internet Explorer\n    try\n    {\n      xmlHttp = new ActiveXObject(\"\
  Msxml2.XMLHTTP\");\n    }\n    catch (e)\n    {\n      try\n      {\n        xmlHttp\
  \ = new ActiveXObject(\"Microsoft.XMLHTTP\");\n      }\n      catch (e)\n      {\n\
  \        alert(\"您的浏览器不支持 AJAX!\");\n        return false;\n      }\n    }\n  }\n\
  }\n```\n\n### 步骤 2：向服务器发送请求\n\n要向服务器发送请求，我们将使用 `open()` 和 `send()` 方法。\n\n第一个方法接受三个参数——第一个用于定义发送\
  \ `GET` 或 `POST` 请求时使用的方法，第二个指定服务器端脚本的 `URL`，第三个指定请求必须被异步处理。第二个方法用于将请求发送到服务器。\n\n\
  ```javascript\nxmlHttp.open(\"GET\", \"time.asp\", true);\nxmlHttp.send(null);\n\
  ```\n\n### 步骤 3：编写服务器端脚本\n\n`responseText` 将存储从服务器返回的任何数据，我们想要返回当前时间。为了此，我们将使用 `time.asp`，代码看起来如下：\n\
  \n```asp\n<%\nresponse.expires=-1\nresponse.write(time)\n%>\n```\n\n### 步骤 4：处理响应\n\
  \n下一步是处理任何返回的响应并将其显示给终端用户：\n\n```javascript\nxmlHttp.onreadystatechange = function()\n\
  {\n  if(xmlHttp.readyState == 4)\n  {\n    document.myForm.time.value = xmlHttp.responseText;\n\
  \  }\n}\nxmlHttp.open(\"GET\", \"time.asp\", true);\nxmlHttp.send(null);\n```\n\n\
  ### 步骤 5：完成代码\n\n最后一步是确定我们何时执行 AJAX 函数。每当用户在用户名文本框中输入内容时，它将在后台运行，整个代码看起来如下：\n\n\
  ```html\n<html>\n<body>\n<script type=\"text/javascript\">\nfunction ajaxFunction()\n\
  {\n  var xmlHttp;\n  try\n  {\n    // Firefox, Opera 8.0+, Safari\n    xmlHttp =\
  \ new XMLHttpRequest();\n  }\n  catch (e)\n  {\n    // Internet Explorer\n    try\n\
  \    {\n      xmlHttp = new ActiveXObject(\"Msxml2.XMLHTTP\");\n    }\n    catch\
  \ (e)\n    {\n      try\n      {\n        xmlHttp = new ActiveXObject(\"Microsoft.XMLHTTP\"\
  );\n      }\n      catch (e)\n      {\n        alert(\"您的浏览器不支持 AJAX!\");\n    \
  \    return false;\n      }\n    }\n  }\n  \n  xmlHttp.onreadystatechange = function()\n\
  \  {\n    if(xmlHttp.readyState == 4)\n    {\n      document.myForm.time.value =\
  \ xmlHttp.responseText;\n    }\n  }\n  xmlHttp.open(\"GET\", \"time.asp\", true);\n\
  \  xmlHttp.send(null);\n}\n</script>\n<form name=\"myForm\">\n  姓名: <input type=\"\
  text\" name=\"username\" onkeyup=\"ajaxFunction();\"/>\n  时间: <input type=\"text\"\
  \ name=\"time\" />\n</form>\n</body>\n</html>\n```\n\n## 总结\n\n这是对 AJAX 如何工作以及它能做什么简单介绍。互联网上有大量信息供你进一步研究，但请确保你先熟悉了\
  \ `JavaScript`。\n\n再次感谢阅读本书！\n\n希望这本书能够帮助你理解并掌握 `JavaScript` 的一些高级技巧，并希望你发现练习很有用——它们设计用于测试你的知识并帮助你更快学习。\n\
