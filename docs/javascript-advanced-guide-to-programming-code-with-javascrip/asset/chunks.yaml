    # Chapter 13:


    Cleaning Up Form Entries


    Sometimes it is nice to clean user entries as soon as they are input and we can
    do this by using a combination of the replace() method of string objects and regular
    expressions.


    Thereplace() Method Revisited


    We already looked at this method and how to use it to replace a regular expression
    match with a string but we can also use it together with backreferences and replace
    a pattern that has been matched with a brand-new string that is made from substrings
    of that pattern. The following example shows you this:


    Example:


    <!DOCTYPE HTML>


    <html>


    <head>


    <meta charset="UTF-8">


    <title>ssn Cleaner</title>


    <script type="text/javascript">


    var reSSN = /^(\d{3})[\- ]?(\d{2})[\- ]?(\d{4})$/;


    function cleanSsn(ssn){


    if (reSSN.test(ssn)) {


    var cleanedSsn = ssn.replace(reSSN, "$1-$2-$3");


    return cleanedSsn;


    } else {


    alert("INVALID SSN");


    return ssn;


    }


    }


    </script>


    </head>


    <body>


    <form onsubmit="return false;">


    <input type="text" name="ssn" size="20">


    <input type="button" value="Clean SSN"


    onclick="this.form.ssn.value = cleanSsn(this.form.ssn.value);">


    </form>


    </body>


    </html>


    We use thecleanSsn() function to clean a social security number in this example.
    In reSSN, ^(\d{3})[\- ]?(\d{2})[\- ]?(\d{4})$, the regular expression has three
    separate subexpressions: (\d{3}), (\d{2}), and (\d{4}). These can be referenced
    as   $1, $2, and $3, respectively in thereplace() method.


    When a user clicks the button that says “Clean SSN” , they call the  cleanSsn() function
    This function will then test to see of the number input by the user is a valid
    number and, if it is, it will then clean it using the code below – this code will
    dash-delimit the substrings that match the subexpressions:


    var cleanedSsn = ssn.replace(reSSN, "$1-$2-$3");


    The properly cleaned social security number will then be returned


    Cleaning Up Form Entries


    This exercise should take you about 15 to 25 minutes.


    *   Open RegularExpressions/Exercises/PhoneCleaner.html in your editor


    *   Where it is indicated by the comment, you must declare a variable calledcleanedPhone
    and then assign it a cleaned version of the phone number entered by the user.
    The clean version should be in this format – (111) 222 3333


    *   Test out your solution in your browser


    A Challenge


    You sometimes find a phone number is a combination of numbers and letters and
    some of these have an extra character in them to complete the word. Your challenge
    is to add in a function that is namedconvertPhone().  This function will:


    *   Strip out every character that is not a letter or a number


    *   Convert every letter to a number as per the following list:


    *   ABC -> 2


    *   DEF -> 3


    *   GHI -> 4


    *   JKL -> 5


    *   MNO -> 6


    *   PQRS -> 7


    *   TUV -> 8


    *   WXYZ -> 9


    It must also:


    *   Pass the initial 10 characters of the string that results to the functioncleanPhone()


    *   Return the string result


    *   Then modify the form, callingconvertPhone()  and notcleanPhone()


    *   Test the solution in your browser


    Solution:


    <!DOCTYPE HTML>


    <html>


    <head>


    <meta charset="UTF-8">


    <title>Phone Cleaner</title>


    <script type="text/javascript">


    var rePhone = /^\(?([2-9]\d\d)\)?[\-\. ]?([2-9]\d\d)[\-\. ]?(\d{4})$/;


    function cleanPhone(phone){


    if (rePhone.test(phone)) {


    var cleanedPhone = phone.replace(rePhone, "($1) $2-$3");


    return cleanedPhone;


    } else {


    alert("INVALID PHONE");


    return phone;


    }


    }


    </script>


    </head>


    <body>


    <form onsubmit="return false;">


    <input type="text" name="Phone" size="20">


    <input type="button" value="Convert Phone"


    onclick="this.form.Phone.value = cleanPhone(this.form.Phone.value);">


    </form>


    </body>


    </html>


    Challenge Solution:


    <!DOCTYPE HTML>


    <html>


    <head>


    <meta charset="UTF-8">


    <title>Phone Checker</title>


    <script type="text/javascript">


    var rePhone = /^\(?([2-9]\d\d)\)?[\-\. ]?([2-9]\d\d)[\-\. ]?(\d{4})$/;


    function convertPhone(phone){


    var convertedPhone;


    convertedPhone = phone.replace(/[^A-Za-z\d]/g, "");


    convertedPhone = convertedPhone.replace(/[ABC]/gi, "2");


    convertedPhone = convertedPhone.replace(/[DEF]/gi, "3");


    convertedPhone = convertedPhone.replace(/[GHI]/gi, "4");


    convertedPhone = convertedPhone.replace(/[JKL]/gi, "5");'
