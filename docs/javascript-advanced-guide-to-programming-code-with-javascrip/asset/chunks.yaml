    \ = \"You must enter a valid postal code.\";\n}\nreturn true;\n}\n</script>\n\
    </head>\n```\n\n# 第 13 章：清理表单输入\n\n有时，在用户输入时立即对其输入进行清理是很好的，我们可以通过结合字符串对象的 `replace()`\
    \ 方法和正则表达式来实现这一点。\n\n### 重新回顾 `replace()` 方法\n\n我们已经查看过这个方法，以及如何使用它将正则表达式匹配替换为字符串，但我们还可以结合反向引用来替换匹配的模式。以下示例展示了这一点：\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>ssn</title>\n\
    <script type=\"text/javascript\">\nvar reSSN = /^(\\d{3})(\\d{2})(\\d{4})$/;\n\
    function cleanSsn(ssn){\nif (reSSN.test(ssn)) {\nvar ssn = ssn.replace(reSSN,\
    \ \"$1-$2-$3\");\nreturn ssn;\n} else {\nalert(\"INVALID SSN\");\nreturn ssn;\n\
    }\n}\n</script>\n</head>\n<body>\n<form onsubmit=\"return false;\">\n<input type=\"\
    text\" name=\"ssn\" size=\"20\">\n<input type=\"button\" value=\"Clean SSN\"\n\
    onclick=\"this.form.ssn.value = cleanSsn(this.form.ssn.value);\">\n</form>\n</body>\n\
    </html>\n```\n\n我们使用 `replace()` 方法来清理用户输入的社会安全号码。正则表达式 `reSSN` 有三个捕获组：`(\\d{3})`、`(\\\
    d{2})` 和 `(\\d{4})`。它们在替换字符串中分别对应 `$1`、`$2` 和 `$3`。\n\n- 在你的编辑器中打开 `RegularExpressions/Exercises/PhoneCleaner.html`。\n\
    - 这个练习大约会花费你 15 分钟。\n\n## 挑战\n\n有时你会发现电话号码是数字和字母的组合，并且包含额外的字符。你的挑战是添加一个名为 `convertPhone()`\
    \ 的函数，它将：\n- 过滤掉所有非字母非数字字符\n- 将每个字母转换为数字，如下：\n  - ABC -> 2\n  - DEF -> 3\n  -\
    \ GHI -> 4\n  - JKL -> 5\n  - MNO -> 6\n  - PQRS -> 7\n  - TUV -> 8\n  - WXYZ\
    \ -> 9\n- 它必须将初始数字传递给 `convertPhone()` 函数并返回结果。\n\n在浏览器中测试你的解决方案。\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Phone Checker</title>\n\
