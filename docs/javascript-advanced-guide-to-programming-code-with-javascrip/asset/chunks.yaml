  trans: "\n当然，想要涵盖每一个技巧来帮助你学习 JavaScript 的最佳实践几乎是不可能的。相反，我们希望关注你在学习编写代码时会遇到的主要属性。在接下来的章节中，我们将为你提供一些较简单的最佳实践，帮助你走上正确的道路。请记住，关于编程的学习永远永无止境。\n\
    \n这是一个极佳的开始！\n\n-   不要声明布尔值对象、字符串或数字\n-   要初始化任何变量\n-   不要使用 `newObject()`\n-\
    \   要使用参数默认值\n-   不要使用自动类型转换\n-   要使用 `\"Timer\"` 来优化代码\n-   不要向 `\"SetTimeOut\"\
    ` 或 `\"SetInterval\"` 传递字符串\n-   要使用 `\"For in\"` 语句\n-   不要使用 `\"With\"` 语句\n\
    \n## 1. 不要声明布尔值对象、字符串或数字\n\n在编写代码时，将你的的布尔值、字符串和数字视为原始值是非常重要的。你不会希望将它们视为对象。如果你将这些代码中的任何定义为对象，可能会产生糟糕的副作用，并减慢你的执行速度。\n\
    \n这里有一个简单的示例：\n\n```\nvar x= \"Joe\";\nvar y= new String (\"Joe\");\n(x ===y)\n\
    ```\n\n-   你可以看到，由于 `x` 是字符串而 `y` 是对象，结果将为 false。它会抛出一个错误，而这种错误是可以避免的！\n\n## 2.\
    \ 要初始化任何变量\n\n无论你是在学习编程还是只是想提高技能，在声明变量的同时初始化它们都是很好的习惯。这样做可以帮助避免未定义（undefined）值，为你提供一个统一的操作位置，并帮助你的代码变得更整洁。\n\
    \n## 3. 不要使用 `newObject()`\n\n虽然我们之前稍微提到过这一点，但记住它是重要的。这里有一份快速查表，帮助你记住应该使用哪些代码以及与其相似的代码。通过良好的组织，你可以保持代码的整洁。\n\
    \n-   使用：`{}` 不使用：`new Object()`\n-   使用 `0` 不使用：`new Number()`\n-   使用：`\" \"\
    ` 不使用：`new String()`\n-   使用 `false` 不使用：`new Boolean()`\n-   使用 `function ()\
    \ {}` 不使用：`new Function()`\n-   使用 `/()/` 不使用：`new RegExp()`\n-   使用 `[]` 不使用：`new\
    \ Array()`\n\n## 4. 要使用参数默认值\n\n我们邀请你停下来问问自己：关于函数我记得什么？当你的函数缺少参数时，你称它为什么？没错！那个缺失参数的值将被称为\
    \ `undefined`。如果你以前没有意识到，这些 `undefined` 值可以并且将会破坏你的代码。为了打破这个习惯，请尽力自动为你的参数赋值。\n\
    \n这里有一个示例：\n\n```\nfunction myFunction (x, y) {\n  if ( x === undefined) {\n \
    \   x= 1;\n  }\n}\n```\n\n## 5. 不要使用自动类型转换\n\n在编写代码时，你需要注意可能被转换为 `NaN` 或字符串的数字。如果你需要复习，`NaN`\
    \ 代表“Not a Number”（不是数字）。由于 JavaScript 是弱类型语言，这种现象会自动发生。你代码中的变量可以改变数据类型，也可以包含几种不同类型的数据。\n\
    \n这里有一个简单的示例：\n\n```\nvar x = \"Hey\";\n```\n\n-   在这种情况下，`x` 是一个字符串，但如果你继续操作：`x=\
    \ 4;`\n-   那么，这会将你的 `x` 变为数字。你可以看出这可能在你的代码中引起错误。\n\n你还应该意识到，当你进行数学计算时，JavaScript\
    \ 会将数字转换为字符串。如果你输入方式不对，它会给你一个答案，但可能不是你想要的那个。这里有一个简单的示例：\n\n-   在这个示例中，`typeof\
    \ x` 将是一个数字\n```\nvar x = 5+ 7; // x.valueOf() 结果为 12\n```\n\n-   在下一个示例中，`typeof\
    \ x` 将是一个字符串\n```\nvar x = 5+ \"7\"; // x.valueOf() 结果为 57\n```\n\n在另一种情况下，你可以尝试用函数从一个字符串中减去另一个字符串。在这种情况下，它将返回\
    \ `NaN`。\n\n使用这个示例：\n\n```\n\"Goodbye\" – \"Love\" // 这将返回 NaN\n```\n\n## 6. 要使用\
    \ `\"Timer\"` 来优化代码\n\n这种做法非常简单。是否你曾经需要一种快速的方法来确定你的操作到底需要多长时间？幸运的是，Firebug 有一个\
    \ `\"timer\"` 功能可以为你记录结果！有时候，掌握一些小技巧对你的编码很有帮助。\n\n这是相关的代码：\n\n```\nfunction TimeTracker\
    \ () {\n  console.time (\"MyTimer\");\n  for (x=4000; x > 0; x--) {}\n  console.timeEnd\
    \ (\"MyTimer\");\n}\n```\n\n## 7. 不要向 `\"SetTimeOut\"` 或 `\"SetInterval\"` 传递字符串\n\
    \n记得我们告诉过你不要使用 `\"eval` 函数吗？这段代码的作用是一样的。这就是为什么我们建议永远不要向 `SetTimeOut` 或 `SetInterval`\
    \ 传递字符串。遗憾的是，这种代码效率极低。\n\n与其使用这段代码：\n\n```javascript\nsetInterval (\n  \"document.getElementById('container').innerHTML+=\
    \ 'The New Number: ' +\" ,2000\n);\n```\n\n使用这个：\n\n```javascript\nsetInterval(someFunction,\
    \ 2000);\n```\n\n## 8. 要使用 `\"For in\"` 语句\n\n当你遍历对象中的项时，可能会发现同时也获取了方法函数。如果不希望这种情况发生，你可以将代码封装在\
    \ `if` 语句中。这样，就可以过滤你的信息。\n\n这里有一个示例：\n\n```javascript\nfor (key in object) {\n\
    \  if(object.hasOwnProperty(key)) {\n    //执行操作\n  }\n}\n```\n\n## 9. 不要使用 `\"\
    With\"` 语句\n\n现在，这个编码技巧是有争议的。一方面，`\"with\"` 语句听起来确实是一个好主意。另一方面，`\"with\"` 语句应该可以用作访问代码中深层嵌套对象的快捷方式。\n\
    \n这里有一个示例：\n\n```javascript\nwith (person.woman.bodyparts) {\n  hand = true;\n\
    \  foot= true;\n}\n```\n\n-   正如我们所说的，你应该使用这些语句：\n```javascript\nperson.woman.bodyparts.hand=\
    \ true;\nperson.woman.bodyparts.foot= true;\n```\n\n经过一些测试，发现这些代码的行为很糟糕，特别是在设置新成员时。与其使用\
    \ `\"with\"`，你可以使用 `var` 并获得正确的结果。\n"
