    this.form.Phone.value = convertPhone(this.form.Phone.value);\">\n</form>\n</body>\n\
    </html>\n```\n\n# Bonus Chapter: Working with AJAX\n\nAJAX stands for Asynchronous\
    \ JavaScript and XML and it is a group of technologies, such as `DOM`, `JavaScript`,\
    \ `HTML`, `XML` and `CSS`, that are all inter-related. AJAX lets you send data\
    \ and receive it asynchronously without having to reload your web page, making\
    \ it incredibly fast.\n\nAJAX also allows you to send only the most important\
    \ information to the web server and not the whole page so only the valuable data\
    \ will be routed over to the client side. This makes any application you build\
    \ and use a good deal faster and more interactive. AJAX is used on a very large\
    \ number of web applications, including Facebook, `Gmail`, `Google Maps`, `Twitter`,\
    \ and too many more to mention.\n\n## How Does AJAX Work?\n\nWhen you use the\
    \ traditional `JavaScript` code and you want to get some information out of a\
    \ server file or a database, or if you wanted to send some information over to\
    \ a server, you would make an `HTML` form and you would use `POST` or `GET` to\
    \ send or receive data to and from a data. End users would need to click a button\
    \ that says `SUBMIT` to send or get the answer; they would then have to wait while\
    \ the server responded and then a new page would load up with their results.\n\
    \nEach time input is submitted by a user, a new page is returned by the server\
    \ and, because of this, some web applications run quite slowly and are not always\
    \ very user-friendly. When you use AJAX, `JavaScript` will talk straight to the\
    \ server via the JavaScript object `XMLHttpRequest`.\n\nBy using an `HTTP` request,\
    \ web pages can request and receive a response form web servers without the need\
    \ to reload the page. The users stay on the same page and will not have a clue\
    \ that there are scripts sending requests for pages or sending data to a server\
    \ as this will be working away in the background.\n\nThe user will send a request\
    \ that will, in turn, execute an action. The response to this action will be shown\
    \ into a layer, identified via an `ID` and all without the page having to go through\
    \ a full reload. This is an example of a page ID:\n\n```html\n<div id=\"ajaxResponse\"\
    ></div>\n```\n\nNext, we are going to look briefly at how to create the `XMLHttpRequest`\
    \ object and get responses from the server:\n\n### Step 1: Create the object `XMLHttpRequest`.\n\
    \nEvery different browser will use a different method to create this object; Internet\
    \ Explorer makes use of `ActiveXObject` while some of the other browsers use `XMLHttpRequest`,\
    \ which is, of course, the built-in object in `JavaScript`.\n\nTo create the object\
    \ and to deal with all the different browsers, we are going to make use of a statement\
    \ called “catch and try”\n\n```javascript\nfunction ajaxFunction()\n{\n  var xmlHttp;\n\
    \  try\n  {\n    // Firefox, Opera 8.0+, Safari\n    xmlHttp = new XMLHttpRequest();\n\
    \  }\n  catch (e)\n  {\n    // Internet Explorer\n    try\n    {\n      xmlHttp\
    \ = new ActiveXObject(\"Msxml2.XMLHTTP\");\n    }\n    catch (e)\n    {\n    \
    \  try\n      {\n        xmlHttp = new ActiveXObject(\"Microsoft.XMLHTTP\");\n\
    \      }\n      catch (e)\n      {\n        alert(\"Your browser does not support\
    \ AJAX!\");\n        return false;\n      }\n    }\n  }\n}\n```\n\n### Step 2:\
    \ Sending the Request to a Server\n\nTo send the request to a server, we will\
    \ use the methods `open()` and `send()`.\n\nThe first method will take three arguments\
    \ – the first to define the method used when the `GET` or `POST` request is sent,\
    \ the second to specify the `URL` of the script on the server side and the third\
    \ to specify that the request must be asynchronously handled. The second method\
    \ is used to send the request over to the server.\n\n```javascript\nxmlHttp.open(\"\
    GET\", \"time.asp\", true);\nxmlHttp.send(null);\n```\n\n### Step 3: Writing the\
    \ Server Side Script\n\n`responseText` is going to store any data that is returned\
    \ from a server and we want to send the current time back. For this we will use\
    \ `time.asp` and the code will look like this:\n\n```asp\n<%\nresponse.expires=-1\n\
    response.write(time)\n%>\n```\n\n### Step 4: Consuming the Response\n\nThe next\
    \ step is to consume whatever response comes back and then display it to the end\
    \ user:\n\n```javascript\nxmlHttp.onreadystatechange = function()\n{\n  if(xmlHttp.readyState\
    \ == 4)\n  {\n    document.myForm.time.value = xmlHttp.responseText;\n  }\n}\n\
    xmlHttp.open(\"GET\", \"time.asp\", true);\nxmlHttp.send(null);\n```\n\n### Step\
    \ 5: Completing the Code\n\nThe final step is to determine when we should execute\
    \ the AJAX function. This is going to run in the background whenever a user inputs\
    \ something into a text field for the username and the entire code would look\
    \ like this:\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nfunction\
    \ ajaxFunction()\n{\n  var xmlHttp;\n  try\n  {\n    // Firefox, Opera 8.0+, Safari\n\
    \    xmlHttp = new XMLHttpRequest();\n  }\n  catch (e)\n  {\n    // Internet Explorer\n\
    \    try\n    {\n      xmlHttp = new ActiveXObject(\"Msxml2.XMLHTTP\");\n    }\n\
    \    catch (e)\n    {\n      try\n      {\n        xmlHttp = new ActiveXObject(\"\
    Microsoft.XMLHTTP\");\n      }\n      catch (e)\n      {\n        alert(\"Your\
    \ browser does not support AJAX!\");\n        return false;\n      }\n    }\n\
    \  }\n  \n  xmlHttp.onreadystatechange = function()\n  {\n    if(xmlHttp.readyState\
    \ == 4)\n    {\n      document.myForm.time.value = xmlHttp.responseText;\n   \
    \ }\n  }\n  xmlHttp.open(\"GET\", \"time.asp\", true);\n  xmlHttp.send(null);\n\
    }\n</script>\n<form name=\"myForm\">\n  Name: <input type=\"text\" name=\"username\"\
    \ onkeyup=\"ajaxFunction();\"/>\n  Time: <input type=\"text\" name=\"time\" />\n\
    </form>\n</body>\n</html>\n```\n\n## Conclusion\n\nThat is a basic look at how\
    \ AJAX works and what it can do. There is plenty of information available on the\
    \ internet for you to research further but do ensure you are familiar with advanced\
    \ `JavaScript` first.\n\nThank you again for reading this book!\n\nI hope this\
    \ book was able to help you understand and grasp some of the advanced techniques\
    \ in `JavaScript` and I hope you found the exercises useful – they are designed\
    \ to test your knowledge and also to help you learn quicker. It is always better\
    \ to learn from practical examples, especially with computer program languages,\
    \ rather than just reading and trying to take in.\n\nThe next step is to practice.\
    \ It doesn’t matter how much you have read or how much you have learned to date;\
    \ if you don’t practice you will soon lose it. The nature of computer programming\
    \ is that things change on a regular basis.\n\nFinally, if this book has given\
    \ you value and helped you in any way, then I’d like to ask you for a favor, if\
    \ you would be kind enough to leave a review for this book on Amazon? It’d be\
    \ greatly appreciated!\n\nThank you and good luck!\n\nCheck Out My Other Books:\n\
    \nBelow you’ll find some of my other Java books that are popular on Amazon and\
    \ Kindle as well. Simply click on the links below to check them out. \n\nAlternatively,\
    \ you can visit my author page on Amazon to see other work done by me.\n\n[JavaScript:\
    \ Tips and Tricks to Programming Code with JavaScript](http://a.co/iiFdxVR)\n\n\
    [JavaScript: Beginner's Guide to Programming Code with JavaScript](http://a.co/fjoFfof)\n\
    \nNOTE: If the links do not work, for whatever reason, you can simply search for\
    \ these titles on the Amazon website to find them.\n\n## Preview Of ‘JavaScript:\
    \ Best Practices to Programming Code with JavaScript’\n\nBest JavaScript Tips\n\
    \nfor Beginners\n"
