  trans: "\n错误对象中有两个重要的属性：`message` 和 `name`。`message` 包含了我们已经知道的错误信息，而 `name` 包含了关于错误类型的信息。我们使用这些信息来决定如何处理该错误。\n\
    \n对于任何程序员来说，有一条很好的建议是：只有当你 100% 确定知道错误是什么以及确切知道该如何修复它时，才在现场处理错误，而不是抑制它。为了更好地针对性处理代码，可以将其更改为仅处理名为\
    \ `TypeError` 的错误——这是为该 bug 指定的错误名称：\n\n示例：\n\n```javascript\nwindow.onerror =\
    \ function (message, url, lineNo) {\n  alert(\n    'Error: ' + message +\n   \
    \ '\\n Url: ' + url +\n    '\\n Line Number: ' + lineNo);\n  return true;\n}\n\
    \nfunction getInput() {\n  try {\n    var name = window.prompt('Type your name');\n\
    \    alert('Your name has ' + name.length + ' letters.');\n  } catch (error) {\n\
    \    if (error.name == 'TypeError') {\n      alert('Please try again.');\n   \
    \   getInput();\n    } else {\n      throw error;\n    }\n  } finally {\n    //do\
    \ cleanup\n  }\n}\n\ngetInput();\n```\n\n如果发生了不同的错误（在这个简单的示例中不太可能），它将不会被处理。`throw`\
    \ 语句会将错误发送出去，就像我们没有使用 `try…catch…finally` 块一样。该错误将在稍后出现。\n\n## 抛出自定义错误\n\n`throw`\
    \ 语句可以用于抛出自定义错误，这里只有一个建议—— 错误对象必须具有 `name` 和 `message` 属性，并且要与内置的处理方法保持一致。看这个示例：\n\
    \n```javascript\nthrow {\n  name: 'InvalidColorError',\n  message: 'The given\
    \ color is not a valid color value.'\n};\n```\n\n# 第 9 章：‘delete’运算符\n\n我们使用 `delete`\
    \ 运算符作为删除对象属性和数组元素的方法。务必明确这一点——删除不等同于将值设置为 `null`。删除会移除元素或属性，使其变为 `undefined`，而将值设置为\
    \ `null` 则会保留该元素或对象，同时将其值设为 `null`。看这个示例作为说明：\n\n示例：\n\n```html\n<!DOCTYPE HTML>\n\
    <html\n<head>\n  <meta charset=\"UTF-8\">\n  <script type=\"text/javascript\"\
    >\n    var colors = [];\n    colors[\"red\"] = \"#f00\";\n    colors[\"green\"\
    ] = \"#060\";\n    colors[\"blue\"] = \"#00f\";\n    colors[\"yellow\"] = \"#ff0\"\
    ;\n    colors[\"orange\"] = \"#0ff\";\n\n    function deleteItem() {\n      delete\
    \ colors[\"blue\"];\n      showArray();\n      revealArray();\n    }\n\n    function\
    \ setToNull() {\n      colors[\"blue\"] = null;\n      showArray();\n      revealArray();\n\
    \    }\n\n    function showArray() {\n      var output = document.getElementById(\"\
    colors\");\n      var strOutput = \"<ol>\";\n      for (var i in colors) {\n \
    \       strOutput += \"<li style='color:\" + colors[i] + \";'>\" + i + \"</li>\"\
    ;\n      }\n      strOutput += \"</ol>\";\n      output.innerHTML=strOutput;\n\
    \    }\n\n    function revealArray() {\n      var colorsCode = document.getElementById(\"\
    colors-code\");\n      var strOutput = \"&lt;ol&gt;\";\n      for (var i in colors)\
    \ {\n        strOutput+=\"\\n\\t&lt;li style='color:\" + colors[i] + \";&gt;\"\
    \ + i + \"&lt;/li&gt;\";\n      }\n      strOutput += \"\\n&lt;/ol&gt;\";\n  \
    \    colorsCode.innerHTML=strOutput;\n    }\n  </script>\n  <title>Delete vs.\
    \ Setting to NULL</title>\n</head>\n<body onload=\"showArray();revealArray();\"\
    >\n  <button id=\"set-to-null\" onclick=\"setToNull();\">Set Blue to Null</button>\n\
    \  <button id=\"del\" onclick=\"deleteItem();\">Delete Blue</button>\n  <output\
    \ id=\"colors\"></output>\n  <pre id=\"colors-code\"></pre>\n</body>\n</html>\n\
    ```\n\n现在暂时忘记 `showArray()` 和 `revealArray()` 函数。但请注意，当点击“Set Blue to Null”按钮时，数组元素将留在原地，但将是一个无效的颜色\
    \ `null`。当点击“Delete Blue”按钮时，数组元素将被删除。\n\n## 正则表达式\n\n这是对接下来几章的快速介绍，其中我们将介绍正则表达式。它们被用于模式匹配，这在表单验证时非常有用。例如，你可以使用正则表达式来检查输入到表单字段中的电子邮件地址在语法上是否是正确的。在\
    \ JavaScript 中，你可以通过两种方式创建正则表达式：\n\n### 字面量语法\n\n```javascript\nvar reExample\
    \ = /pattern/;\n```\n\n### `RegExp()` 构造函数\n\n```javascript\nvar reExample = new\
    \ RegExp(\"pattern\");\n```\n\n如果你已经知道将要使用的模式，这两者之间没有实际区别。但如果你不知道将使用哪种模式，最简单的方法是使用\
    \ `RegExp()` 构造函数。\n\n# 第 10 章：正则表达式 – 方法\n\nJavaScript 包含两个主要的正则表达式测试方法：`test()`\
    \ 和 `exec()`。\n\n### `exec()` 方法\n\n`exec()` 方法接收一个字符串参数并检查字符串是否存在匹配项。如果有，则返回一个结果数组。如果没有，则返回\
    \ `null`。\n\n### `test()` 方法\n\n`test()` 方法也会接收一个字符串并检查字符串是否存在匹配项。如果存在匹配项，则返回\
    \ `true`。这在表单验证中非常有用。示例：`RegularExpressions/SsnChecker.html`\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html>\n<head>\n  <meta charset=\"UTF-8\">\n  <title>ssn Checker</title>\n\
    \  <script type=\"text/javascript\">\n    var reSSN = /^[0-9]{3}[0-9]{4}$/;\n\n\
    \    function checkSsn(ssn) {\n      if (reSSN.test(ssn)) {\n        alert(\"\
    VALID SSN\");\n      } else {\n        alert(\"INVALID SSN\");\n      }\n    }\n\
    \  </script>\n</head>\n<body>\n  <form onsubmit=\"return false;\">\n    <input\
    \ type=\"text\" name=\"ssn\" size=\"20\">\n    <input type=\"button\" value=\"\
    Check\" onclick=\"checkSsn(this.form.ssn.value);\">\n  </form>\n</body>\n</html>\n\
    ```\n\n让我们仔细观察代码。首先，我们定义了一个正则表达式变量。其次，我们创建了一个名为 `checkSsn` 的函数。该函数接收一个参数 `ssn`（这是一个字符串），并将其传递给正则表达式以检查是否存在匹配。最后，页面中的表单提供了一个用户输入安全号码的字段，以及一个会将该号码传递给该函数的按钮。\n\
    \n## 标志\n\n如果标志出现在斜杠后面，它将修改正则表达式的工作方式。\n\n- `i` 标志使正则表达式不区分大小写。例如，`/aeiou/i` 将同时匹配大写和小小写的元音。\n\
    - `g` 标志指定全局匹配，这意味着将返回指定模式的所有匹配。\n\n## 字符串方法\n\n许多字符串方法接受正则表达式作为参数：\n\n- `search()`\
    \ 方法：该方法仅接收一个参数——正则表达式。返回匹配正则表达式的子字符串的起始字符索引。如果没有匹配项，则返回 -1。\n- `split()` 方法：该方法也接收正则表达式，并将其作为分隔符将一个字符串拆分为数组。\n\
    - `replace()` 方法：该方法接收两个参数——正则表达式和字符串。第一个正则表达式匹配项将被替换为字符串，如果表达式使用了 `g` 标志，则将替换所有字符串项。\n\
    - `match()` 方法：`match()` 方法接收正则表达式作为参数，并返回与正则表达式模式匹配的每个子字符串。\n\n# 第 11 章：正则表达式\
    \ – 语法\n\n正则表达式是用于指定字符列表的模式。在本章中，我们将查看用于指定字符的语法：\n\n- 起始和结束 ( `^$` )"
- fmt: "\n# Regular Expressions\n\n* If there is a caret (`^`) at the start of a regular\
    \ expression, it is an indicator that the string that is being researched has\
    \ to begin with this pattern;\n* You will find pattern `^` in “food” but you won’t\
    \ find it in “barfood”;\n* If a regular expression has a dollar ( (`$ ) sign at\
    \ the end of it, it is an indication that the string that is being searched has\
    \ to end with the pattern;\n* You will find pattern `foo$` in “curfoo” but you\
    \ won’t find it in “food”;\n\n## Number of Occurrences (`?` + `*` `{}` `{}`)\n\
    \nThese symbols will affect how many occurrences there are of the preceding character\
    \ or, if you use parenthesis, characters - `?`, `*`, `+`, `{}`.\n\n* The question\
    \ mark (`?`) is an indication that the preceding character must appear 0 or 1\
    \ times in the pattern;\n* You will find pattern `foo?` in “fod” and “food” but\
    \ not in “faod”;\n* The plus sign (`+`) is an indication that the preceding character\
    \ will appear at least once in the pattern;\n* You will find pattern `fo+` in\
    \ “food”, “fod” and “foood” but you won’t find it in “fd”;\n* The asterisk (`*`)\
    \ is an indicator that the preceding character has to appear at least 0 times\
    \ in the pattern;\n* You will find pattern `fo*d` in “fd”, “food” and “fod”;\n\
    * The curly brackets (`{}`), with a single parameter `{n}` is an indicator that\
    \ the preceding character must appear in the pattern exactly `n` times;\n* You\
    \ will find pattern `fo{3}d` in “foood” but you won’t find it in “fooood” or in\
    \ “food”;\n* The curly brackets with two parameters `{n1, n2}` is an indicator\
    \ that the previous character should appear in the pattern between `n1` and `n2`\
    \ times;\n* You will find pattern `fo{2,4}` in “fooood”, “foood” and in “food”\
    \ but you won’t find it in “foooood”;\n* Curly brackets that have one parameter\
    \ with a second empty one `{n}` is an indicator that the previous character must\
    \ appear in the pattern at least `n` times;\n* You will find pattern `fo{2}` in\
    \ “foooood” and in “food” but you won’t find it in “fod”\n\n## Common Characters\
    \ (`.` `\\d` `\\D` `\\w` `\\W` `\\s` `\\S`)\n\n* A period (`.`) is representative\
    \ of any character except for a newline;\n* You will find pattern `fo.d` in “foad”,\
    \ “food”, “fo*f” and in “fo9d”;\n* The backslash-d (`\\d`) is representative of\
    \ any digit and is equivalent to `[0-9]`;\n* You will find the pattern `fo\\dd`\
    \ in “fo1d”, `fo0d”, fo4d” but you won’t find it in “fodd” or in “food”;\n* The\
    \ backslash-D (`\\D`) is representative of any character with the exception of\
    \ a digit and is the equivalent of `[^0-9]`;\n* You will find the pattern `fo\\\
    D` is “foad” and in “food” but you won’t find it in “fo4d”;\n* The backslash-w\
    \ (`\\w`) is representative of any word character, such as digits, letters and\
    \ underscore (`_`);\n* You will find the pattern `fo\\w` in “fo_d”, “food” and\
    \ in “fo4d” but you won’t find it in “fo*d”;\n* The backslash-W (`\\W`) is representative\
    \ of any character that isn’t a word character;\n* “You can find the pattern `fo\\\
    Wd` in “fo&d”, in “fo*d) and in “fo.d” but you won’t find it in “fo d”;\n* The\
    \ backslash-s (`\\s`) character is representative of any whitespace character,\
    \ such as tab, space, newline, etc.;\n* You will find pattern `fo\\sd` in “fo\
    \ d” but you won’t find it in “food)”;\n* The backslash-S (`\\S`) is representative\
    \ of any character except for a whitespace;\n* You can find the pattern `fo\\\
    Sd` in “food”, in “fo*d” and in “fo4d” but you won’t find it in “fo d”\n\n## Grouping\
    \ (`[]`)\n\nWe use square brackets (`[]`) as a way of grouping options together:\n\
    \n* You will find the pattern `f[aeiou]` in “fed” and “fad” but you won’t find\
    \ it in “food\", \"faed\" or \"fd\".\n* The pattern `[aeiou]` will match with\
    \ \"a\", \"e\", \"i\", \"o\", or \"u\".\n* You will find pattern `f[aeiou]{2}d`\
    \ in \"faed\" and in \"feod\", but you won’t find it in in \"fod\", \"fed\" or\
    \ \"fd\".\n* You will find the pattern `[A-Za-z]+` in \"Webucator, Inc.\", but\
    \ you won’t find it in \"13078\".\n* The pattern `[A-Za-z]` will match with any\
    \ letter, regardless of whether it is upper or lowercase;\n* The pattern `[A-Z]`\
    \ will match any letter that is uppercase;\n* The pattern `[a-z]` will match any\
    \ letter that is lowercase.\n\n## Negation (`^`)\n\nWhen the caret (`^`) is used\
    \ within square brackets and is the first character, it is indicative of negation:\n\
    \n* You will find pattern `f[^aeiou]d` in \"fqd\" and \"f4d\", but you won’t find\
    \ it in.\n\n## Subpatterns (`()`)\n\nWe use parentheses `()` to capture subpatterns:\n\
    \n* You will find pattern `(oo)?` in \"food\" and \"fod\", but you won’t find\
    \ it in.\n\n## Alternatives (`|`)\n\nWe use the pipe (`|`) as a way of creating\
    \ alternatives:\n\n* You will find pattern `foo|bar` in \"foo\" and \"bar\" but\
    \ you won’t find it in.\n\n## Escape Character (`\\`)\n\nWe use backslash (`\\\
    ` ) for escaping characters:\n\n* You will find pattern `\\.` in \"food.\" but\
    \ you won’t find it in \"foo\".\n\n# Chapter 12: Regular Expressions – Form Validation\n\
    \nWhen you use regular expressions, you can create some powerful functions that\
    \ are for validation. Let’s look at this example:\n\n```html\n<!DOCTYPE html>\n\
    <html\n<head>\n<meta charset=\"UTF-8\">\n<title>Login</title>\n<script>\nfunction\
    \ validate(form) {\n    var email = form.Email.value;\n    var password = form.Password.value;\n\
    \    var errors = [];\n\n    var reEmail = /^(\\w+\\.)*\\w+@(\\w+\\.)+[A-Za-z]+$/;\n\
    \    var rePassword = /^[A-Za-z\\d]{6,8}$/;\n\n    if (!reEmail.test(email)) {\n\
    \        errors.push(\"Enter a valid email address.\");\n    }\n    if (!rePassword.test(password))\
    \ {\n        errors.push(\"Password must be between 6 and 8 characters and can\
    \ only contain letters and digits.\");\n    }\n\n    if (errors.length > 0) {\n\
    \        var msg = \"There were some problems:\\n\";\n        for (var i = 0;\
    \ i < errors.length; i++) {\n            msg += \"\\n\" + (i + 1) + \". \" + errors[i];\n\
    \        }\n        alert(msg);\n        return false;\n    }\n    return true;\n\
    }\n</script>\n</head>\n<body>\n<h1>Login Form</h1>\n<form method=\"post\" action=\"\
    Process.html\" onsubmit=\"return validate(this);\">\nEmail: <input type=\"text\"\
    \ name=\"Email\" size=\"25\"><br/>\nPassword: <input type=\"password\" name=\"\
    Password\" size=\"10\"><br/>\n<input type=\"submit\" value=\"Submit\">\n<input\
    \ type=\"reset\" value=\"Reset Form\">\n</form>\n</body>\n</html>\n```\n"
